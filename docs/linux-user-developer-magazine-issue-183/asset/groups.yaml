    # # Pi Project


    # Raspberry Pi tablet


    The elegant, streamlined design yields probably be the smallest and largest homemade
    Pi tablet in existence


    ![](img/69deeba7290e54cc2d9b0be00f232820_65_0.png)


    # Like it?


    Stefan Vorkoetter takes the term ''Pi hack'' and applies it quite literally by
    hacking a Raspberry Pi 3 Model B to the base essentials for the job, combining
    it with a 7-inch display to create a sleek device. The streamlining efforts reduce
    the thickness from 40mm for the board and down to 17.6mm with so many touches:
    an aftermark of $15 includes a real-time clock, and a modified Adafruit PowerBoost
    1000 with 200 homemade helmets, shutdown controller and battery monitor.


    I knew I would need battery monitoring, and somehow allow for an orderly shutdown,
    although I wasn''t completely sure when it was needed. After I received the PowerBoost
    1000, I did some experimentation to design the controls for the battery.


    For the battery monitoring, I had actually never thought about building a much
    more complex circuit with a bigger chip (chip-and-more) and more circuitry to
    control the battery at different levels (100%, 50%, 25%, 12.5%, etc.).


    Stefan is an R&D Fellow with Maplesoft who is a Canadian making software development.
    Most of his background projects is a single-seat plane.


    # Stefan

    nVorkoetter


    Stefan has two projects on the Pi-based system much including the inside of his
    Hammond! He''s also working on the aerodynamics of his car for better fuel efficiency
    and he''ll "probably" putting a Pi in as well...


    You added a number of components that were missing from the Pi, as stripping away
    a lot of things - this is because the Pi would not have enough RAM. Given that
    the Pi works better with 1GB rather than mine, especially since I plan to put
    Linux on it, 2GB would be a bigger improvement.


    The other thing that would really help your project is some sort of adding to
    RAM or GPU.


    > I''ve into electronics

    for a very long time


    Right, the tablet has hard to boot, and that takes about 22 seconds, which is
    a long time if you just want to check the weather. There are also some glitches
    that need fixing, like the inability to use Bluetooth devices when the Wi-Fi is
    active.


    You have to tackle the power issues first because they are so difficult. I think
    there are several other problems. One is that I''ve been doing into electronics
    for a long time (learning from my father and some old hobby magazines), but when
    I was a student at the University of Washington I was still relatively new to
    them.


    Can you tell me about the code for the project?


    There are basically two pieces that I wrote. A daemon, started at boot time, runs
    in the background, monitoring the battery voltage, buttons and power switch. It
    controls the screen brightness, the interfaces, and communicates with the status
    bar on the dashboard. The second piece controls the cooling fan and the temperature,
    and also uses the sensor to turn the daemon on and off (to save power) and control
    automatic screen.


    # Further reading


    Stefan''s recent projects include customized wristwatches, a remake of an old
    analogue circuit from the 1970s for an alarm clock and a rebuild of the vacuum
    tube amplifier. Read more at...


    The code is written in C, since that is what one ever writes in, and I''ve been
    doing C programming since the mid-90s. I''ve never actually used Python for anything
    except for the dashboard. The dashboard is written in Python using Tkinter.


    Would you like to do something else next time?


    One issue is if it''s safe to turn off the daemon. The tablet would shut down
    when the battery drops out, but even a Pi would still work until about 2.5V. The
    monitor in the battery will cut the power at 2.9V, and that''s too low to be good
    for the longevity of the battery.


    I''ve designed another analogue circuit that will tell the PowerBoost to cut the
    power at that point, and bill will tuck it into the empty space between the two
    USB ports. If I were to redo the code, I''d incorporate that and consider 3D printing
    an enclosure for it next time.


    Was the battery monitor and shutdown part of the initial plan or did you need
    it as something you needed for the PowerBoost 1000 charger on?


    66'
