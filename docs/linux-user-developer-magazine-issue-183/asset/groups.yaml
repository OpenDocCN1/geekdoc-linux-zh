    \nOpenELEC 允许你在不到 5 分钟内将 PC 变成功能齐全的媒体播放器。凭借超过 450,000 名普通用户，这个屡获殊的平台运行在各种硬件（任何数量的\
    \ ARM 平台）上，仅需 10GB 磁盘空间，并可以从硬盘、SSD、CompactFlash 或 SD 卡运行。从去年开始，它简要限制了可以支持分发的缓存。媒体可以从外部存储设备播放，或通过内置的\
    \ SMB 支持播放。OpenELEC 的核心是 Kodi 媒体播放器软件，它最初起源于 'Xubuntu' 并演变成一个电视和文件管理程序、图片浏览器以及音乐和有声书播放器。它与\
    \ Kodi 非常接近，因此该发行版包含了最新的（并非小版本更新）'Kryton' 版本，以及许多第三方插件，包括复古游戏机模拟器和 DVR 功能。如果你想在你的\
