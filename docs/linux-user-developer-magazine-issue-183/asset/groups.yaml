    use Flatpak and a "FOSS answer to Chromebooks. How is it possible like that?**


    With a community like it - anything is possible. With what we have already done
    with transactional updates and our platform.


    ## Kubernetes: it is complicated


    Kubernetes automates deployment, scaling and container management of applications
    by grouping containers that make up an app logical units. It is a complicated
    beast, which is why we offer consulting packages from $15,000 to $35,000 for enterprise
    Kubernetes deployments.


    Dealing with Kubernetes is costly which is why one of the Kubic Project''s core
    aims is to remove the complexity of containers. "The main goal of openSUSE Kubic
    or SUSEaaS Platform is to make the setup of Kubernetes to orchestrate easier,"
    says Richard Brown. "If the user has an orchestration tool like Kubic set up and
    running, then they only need to create pods for containers. These are the basic
    building blocks of Kubernetes."


    ![](img/69deeba7290e54cc2d9b0be00f232820_13_1.png)


    > Above a core of the Kubic Project is to make Kubernetes and orchestrating containers
    much easier, representing a pod on a cluster, and Kubic can put them with kubelet
    in cluster. There is no need to think about which machine the container should
    run; if it has resources for the container, and monitor and watch the container
    and restart it if needed. This is then done by Kubernetes.

