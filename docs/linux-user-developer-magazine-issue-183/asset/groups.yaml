    # Contents


    ![](img/69deeba7290e54cc2d9b0be00f232820_3_0.png)

    ![](img/69deeba7290e54cc2d9b0be00f232820_3_1.png)

    ![](img/69deeba7290e54cc2d9b0be00f232820_3_2.png)


    ## OpenSource


    ## Tutorials


    ## Features


    - **08 News**

    The biggest stories from around the open world - a Linux Phone!

    - **10 Letters**

    Enter the world of readers'' minds


    - **36 Essential Linux**

    In part of last issue''s Master Shell Scripting guide, learn how to use Bash scripting
    as a programming language, making use of its loops, conditionals and functions


    - **18 Ultimate distros & apps**

    Which distros(s) and apps should you use? Paul O''Brien explains the myriad of
    Linux distros which come free and open software options to find the right products
    for your needs


    - **12 Interview**

    OpenSUSE''s Richard Brown tells us about the Project Kubic container OS

    - **16 Kernel column**

    The latest news on the Linux kernel


    - **40 Security**

    Learn how hackers are able to inject malicious code into Android apps. Discover
    how to decompile and debug apps to eliminate the threat and secure your system


    - **50 Purism**

    chat with Purism founder and CEO Todd Weaver about the firm''s Librem laptops
    which come with Linux preloaded, as does the Librem 5 smartphone


    ## InspireOS

    - **32 Kolibri**

    Learning Equality''s offline app that provides education across the globe


    - **44 Java**

    Following on last issue''s tutorial, discover how to add a slick graphical interface
    to your game using the JavaFX library and make its buttons work to control the
    character


    - **56 Arduino**

    The Arduino is 12 years old and used by makers, tinkerers and researchers alike.
    Alexander Smith highlights the strengths of the microcontroller and shows you
    how to get started

