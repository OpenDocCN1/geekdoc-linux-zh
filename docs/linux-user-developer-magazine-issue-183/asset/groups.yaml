    \ Pi. By default it starts up Make sure there's \"f\" at the start of every line\
    \ except the one that reads. After this line, paste\n\n```\nsleep 30\npython /home/pi/ipconnected.py\
    \ &\npython /home/pi/primed.py\n```\n\nNext, run `chmod +x /etc/rclocal` to make\
    \ it executable, reboot your Pi.\n\n## 16 Test the device\n\nOnce you've logged\
    \ into your Pi, wait for 30 seconds for yellow LEDs to light up. A brief reminder\
    \ at this stage is that the ipconnected script will see if you're connected to\
    \ the internet and blink green. This means your doomsday device is ready! Everything\
    \ in order the yellow LED will be steady, indicating that the primed script is\
    \ waiting for you to press the button. The buzzer will sound and the red LED will\
    \ blink. Once the counter is over, doomsday script will try to launch commands\n\
    \n## 14 Secure erase files\n\nIf you want to erase files, uncomment the lines:\n\
    \n```python\n# filepath = \"/home/pi/Documents/private.txt\"\n# subprocess.call([\"\
    shred\", \"-u\", filepath])\n```\n\nThe filepath operates in a way to folderpath,\
    \ in that case it specifies the location of certain files. If you have more than\
    \ one file to delete, copy and paste those two lines for instance:\n\n```python\n\
    # filepath = \"/home/pi/Documents/secret.txt\"\n# subprocess.call([\"shred\",\
    \ \"-u\", filepath])\n```\n\n```python\n# filepath = \"/home/pi/Pictures/secret.jpg\"\
    \n# subprocess.call([\"shred\", \"-u\", filepath])\n```\n\nUncomment `buzzer.start()`\
    \ to make the Pi play a sound once the files have been deleted.\n\n| Inputs and\
    \ outputs |\n| :--- |\n| The doomsday device is ready with whatever you make it\
    \ and we encourage you to add your own functions to the script. For instance the\
    \ master script comes with a few inputs and outputs, like encrypted drive made\
    \ all on it, which could be used to switch on external light. Testing inputs and\
    \ outputs isn't simple. For instance, if you want a signal to be read from input\
    \ A, use: `if input.input.read(): print(\"Input A is active.\")` |\n| To switch\
    \ on an output (B) for instance, you can use: `output.b.write(1)`. Each port has\
    \ a white LED which lights up when active.\n\n## Python's Threading\n\n## Handle\
    \ multiple tasks\n\nYour Raspberry Pi project may need to deal with more than\
    \ one thing at a time. Learn how to handle multiple tasks in Python.\n\nSeveral\
    \ articles have covered different techniques to accomplish tasks. We haven't covered\
    \ so far how is best to deal with when your Raspberry Pi project needs to manage\
    \ several tasks concurrently. We will look at how to use threading within Python\
    \ to manage threads. In the standard library, there are libraries: multiprocessing\
    \ and concurrent. Each has its strengths and weaknesses. Since these are all part\
    \ of the standard library, there is no extra that you will need to install.\n\n\
    Whether or not a thread is driven by using code like:\n\n```python\nif my_thread.is_alive():\n\
    \    print(\"this thread is still running\")\n```\n\nOne thread might overwrite\
    \ the data from another. In these cases, you will need to use objects to manage\
    \ access to shared variables. A basic example would look like:\n\n```python\n\
    mylock = threading.Lock()\ndef counter():\n    global counter\n    mylock.acquire()\n\
    \    counter += 1\n    mylock.release()\n```\n\n**Joey Bernard** is a true Mansfield.\
    \ At some point in the main body of your program, you are going to use the results\
    \ from threading. This happens when you use the join() method of the thread. It\
    \ forces it to wait until the thread exits. The exit is driven by the running\
    \ function exits.\n\nAs you can see, you create the lock in the body of your program.\
    \ Then, within the function code, you acquire the lock. If it is free, you can\
    \ proceed. If it is locked by another thread, then this call to acquire the lock\
    \ will wait until the lock is released. This is why it is really necessary to\
    \ always have a release statement for every shared variable. Otherwise, you will\
    \ have a bug that will be impossible to fix after the lock causes a bottleneck\
    \ to your program, and you need to make sure that whatever happens the lock is\
    \ always released.\n\nHe speaks his life within Mansfield and works with researchers\
    \ and scientists with Android apps.\n\n## Why Python?\n\n> \"How do you want to\
    \ create threads?\"\n\nIt's the official language of the Raspberry Pi. Read it\
    \ at www.python.org\n\nFirst, we will use the threading module. There are two\
    \ ways to use this method: one is to create new threads that can be run to some\
    \ target function. The following is a simple example using data that is globally\
    \ available or you are using data that should only be visible within the current\
    \ thread. If you need global data, you can create a local variable. The following\
    \ code stores it with your author's name in:\n\n```python\nimport threading\n\
    def func():\n    print(\"Hello World\")\nmy_thread = threading.Thread(target=func)\n\
    my_thread.start()\n```\n\n```python\nmydata = threading.Lock()\nmydata.name =\
    \ \"Joey Bernard\"\n```\n"
