    ## Purism confirms Linux smartphone\n\nEncrypted calls for Linux-based smartphones\
    \ are a key feature of security-focused handset\n\nThe tale of Linux-based smartphones\
    \ is not a happy one. While Android might be based on the Linux kernel, the libraries\
    \ and almost everything else is different. It's easy to port an application to\
    \ a Linux smartphone, but this is overly simplistic. After all, there's very little\
    \ that is open source in the latest Samsung handsets.\n\nFollowing the unprecedented\
    \ freedom of the mobile space, Social Purpose Purism Corporation is launching\
    \ its new Linux-based phone, which is better than the Librem 5 that Purism will\
    \ deliver next year.\n\nLaunched through a crowdfunding campaign (with a $1.5\
    \ million funding goal) at Purism.com, the Librem 5 will be fully declassified,\
    \ encrypted by design; Purism's Pro63 will be preloaded, with convergence technology\
    \ enabling the device to be truly secure.\n\nChatting exclusively with LU, Purism\
    \ chief told us that the Librem 5 is built from completely free and open software,\
    \ with decentralised IP-based communication, which offers the users best possible\
    \ hardware and user control. This creates a future where people can control their\
    \ mobile experience similar to how we control our laptop experience when using\
    \ Linux and free/libre open source.\n\nIn short, if you're frustrated by the lack\
    \ of privacy on Android and iOS, then you might just be interested in the Librem\
    \ 5. It is a smartphone that does not track you, and includes open Wi-Fi and Bluetooth,\
    \ and the basic telephony/mobile data.\n\nPlan to offer unprecedented privacy\
    \ and security on a mobile device is no easy task. As such, Purism aims to provide\
    \ the world with the first ever Matrixox-powered smartphone, and with native end-to-end\
    \ encryption for the decentralised data and messaging apps.\n\nBut from other\
    \ Linux smartphone projects? Weaver says \"Purism has learned from every story\
    \ before the Librem 5, and to mitigate risk, they're 'supporting all GNU/Linux\
    \ distributions out-of-the-box,' and 'taking an upstream-first development approach,\
    \ rather than creating a separable mobile OS.\"\n\nFrom a manufacturing point\
    \ of view, Purism plans \"fabricating in smaller quantities to mitigate upfront\
    \ cost requirements, while leveraging hardware to create a depth of credibility\
    \ by security, privacy, and freedom for the wider audience.\"\n\nWe have gained\
    \ from previous experience with product delivery of smaller security-focused tablets\
    \ and tablets that Purism has a trusted supply chain.\n\nIn short, everything\
    \ is looking good for the Librem 5, with funding at 10.84% with 52 days to go\
    \ as this went to press.\n\n6\n\n# HARDWARE\n\n## Nimbusisoft launched PCs featuring\
    \ Ubuntu Budgie\n\n### A range of laptops and desktops\n\nFollowing in the footsteps\
    \ of US Reseller System76, Newcastle-upon-Tyne company Nimbusisoft is launching\
    \ a range of desktop and laptop computers that switch with Ubuntu Budgie pre-installed.\n\
    \nFive PCs range from the Cern at £299 up to the heavy-duty Vulcan at £1299 –\
    \ alongside a pair of all-in-one desktops at £699. All are available in various\
    \ configurations and can be built with the preferred CPU, RAM, storage, graphics\
    \ card and operating system within elegant chassis and backlit keyboards, multi-touch\
    \ tracks and USB 3.0 ports. These devices are designed by Nimbusisoft using high-quality\
    \ hardware designs.\n\nTware OEM is providing the hardware. While Ubuntu Budgie\
    \ 17.04 is the default choice, Ubuntu is available on all devices. Launched in\
    \ November 2016 as Budget-Mixie, Ubuntu Budgie is a lightweight version of Ubuntu\
    \ with the Budgie edition, developed by the team behind Solus project. After its\
    \ initial release, Ubuntu Budgie was adopted as an official community flavour\
    \ of Ubuntu in April 2017.\n\nThree PCs (two laptops, one desktop) are available\
    \ purely with Ubuntu Budgie. These Ubuntu Budgie Edition devices are key highlights\
    \ of the range.\n\n> Nimbusisoft MD Chris Harvey tells “We’re excited to be partnering\
    \ with Ubuntu Budgie which we think is a great thing to do with our hardware.\
