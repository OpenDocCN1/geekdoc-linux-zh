    ## 延伸阅读


    Stefan 最近的项目包括定制腕表、重制来自 20 世纪 70 年代的旧闹钟电路以及真空管放大器的翻新。更多信息请见……代码是用 C 语言编写的，因为这是我从
    90 年代中期以来一直使用的语言。我从未用 Python 做过仪表盘以外的事情。仪表盘是用 Python 使用 Tkinter 编写的。下次你想尝试别的吗？


