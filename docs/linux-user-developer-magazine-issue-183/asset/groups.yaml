    # Components list


    # Mouse buttons


    # Wired for sound


    Three function keys were added. These were made using switches from a broken mouse
    mounted on a stripboard. The buttons themselves were made from the legs of old
    70s-era toothbrushes that were then hole-punched to create round buttons.


    Vorketter wanted better audio than that provided by the Pi, so he used a USB adaptor
    that he wired to the USB pads on the Pi. He also reinforced the two jacks.


    +   * Raspberry Pi Model 3B

    * Raspberry Pi 7-inch 800x480 multi-touch capacitive

    * Lexar 32GB microSD card

    * Adafruit PowerBoost

    * 1000C charger and 3.7-to-5V converter

    * DS3231 temperature-compensated real-time clock

    * USB audio adaptor

    * PAM8032-based mono class D amplifier

    * 25mm 8Ω speaker

    * Battery monitor and shutdown control circuit

    * 6000mAh Lithium-polymer battery, giving 4 to 12 hours battery life (6 hours
    watching YouTube)

    * SPDT slide switch and 3x small push-button buttons

    * USB and micro-USB ports

    * Raspberry Jianese


    ![](img/69deeba7290e54cc2d9b0be00f232820_66_0.png)


    # Extra battery monitor


    The Powerboost 1000 charger has a low-battery output (LBO) which can be used to
    signal that the battery is dead. Vorketter wanted after more battery monitor information
    to display a status change "just like an off-the-shelf would have", so he added
    a battery voltage monitor.


    # Added time


    The Raspberry Pi doesn''t know the time if it lacks internet. It doesn''t have
    a real-time clock. So he tried to connect the Pi to an RTC, via the internet and
    if it''s not 1970... you can get add-RTC clocks to fix this - but as Vorketter
    had removed the GPIO pins, he wired in a DS3231 RTC chip instead.


    ![](img/69deeba7290e54cc2d9b0be00f232820_66_1.png)


    ![](img/69deeba7290e54cc2d9b0be00f232820_66_2.png)


