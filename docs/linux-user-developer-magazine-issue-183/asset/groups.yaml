    # 欢迎

    阅读 Linux User & Developer 第 183 期


    # 本期内容


    + >> Ubuntu 发行版与应用，p18

    >> Purism 直播与 Librem，p15

    >> Arduino 世界，p56


    欢迎阅读英国和北美最喜爱的 Linux 和开源软件（FOSS）杂志。本期内容极其丰富！首先是 Librem 5（手机）登上头条，我们采访了首席执行官 Todd
    Weaver (p50)。接下来，我们找到了 Richard Brown，让他解释开源的 B25 以及带回 Htoppi 的计划 (p12)。我们还决定是时候放下我们的痴迷了，尘埃终于揭示了
    Arduino 的优点 (p56)。为了完成所有内容，我们还有惯常的教程和从 p38 开始的常规栏目。


    在本期中，我们推出了一个名为 InspiringOS (p52) 的新系列，我们重点介绍试图改变世界的开源项目和人物。“inspire”一词（源自拉丁语 inspire）指的是“进入”的感觉或赋予生命的“想法”。我们希望你被这种精神所感染，向世界偏远地区提供高质量的教育。


    Chris Thomas, 编辑


