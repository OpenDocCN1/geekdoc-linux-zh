    \n![](img/69deeba7290e54cc2d9b0be00f232820_43_0.png)\n\nJavaFX is a powerful graphics\
    \ framework for Java. Using the artwork and the programming tricks in this tutorial,\
    \ you will be able to create a sophisticated graphical interface for the game\
    \ we made in last month's tutorial:\n\nOne of the things that Java is particularly\
    \ good for is designing graphical interfaces, or GUIs. In this second part of\
    \ our Java tutorial series, we will be learning how to use JavaFX to create a\
    \ graphical game in which a player can walk around a map, collecting eggs which\
    \ hatch into each animal. In this tutorial, we will be replacing the console-based\
    \ input and output with graphical components in JavaFX, which will help demonstrate\
    \ the power of inheritance and polymorphism in Java.\n\nYou should make sure that\
    \ you have installed the OpenFX implementation of Java on your system. We recommend\
    \ that you install OpenFX through your package manager. In most distributions,\
    \ the package will be named openjfx. If you are using Eclipse, you should restart\
    \ Eclipse after installing OpenFX.\n\nIf you've completed the tutorial from last\
    \ month, open the project in Eclipse. Last month's project is an eclipse project,\
    \ followed by \"Browse...\" and import the file.tar.gz. To do this, select File\
    \ > Import...\n\nA JavaFX is a vast, feature-rich library and we can't cover everything\
    \ you need in one article. The aim of this month's tutorial is to teach you about\
    \ JavaFX so you can build basic GUIs, and then explore the library yourself so\
    \ that you can make the GUIs you want. As usual, the Oracle docs (http://docs.oracle.com/javase/api/)\
    \ are an excellent reference, though you may be able to find tutorials for specific\
