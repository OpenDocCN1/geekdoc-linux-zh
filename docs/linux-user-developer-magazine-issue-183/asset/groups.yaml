    Arduino started as a research project at the Interactive Design Institute, Italy.
    The original aim was to make a more and cheaper board for embedding electronics.
    The project grew out of Processing, a language and environment where students
    could learn the basic programming skills through visual design. They then expanded
    to Wiring, an environment for hardware - specifically the Mega25, an AVR microcontroller.
    In 2005 the Wiring project added support for the cheaper and now ubiquitous Arduino.
    The group then branched into a separate project and company, and named it Arduino.
    Its first development board, the Uno, and now sells dozens of varieties.


    > What Arduino has achieved to package reprogramable boards that enable easy interfacing
    with hardware through simplified, library-driven coding


    An Arduino is, generally speaking, a small board which can fit in the palm of
    your hand with an assortment of electronic components affixed to it. Centrally
