    # Inject malicious code into a legitimate APK


    Imagine that the bad guys have added some malicious behaviour to this legitimate
    app. They have repackaged the app and reinstalled it. By using alternative (hook-world-trojan.apk)
    you can get a sample of this app to execute. If you get the code (hook-world-trojan.apk)
    you can get a look on VirusTotal (virustotal.com). Two anti-viruses detected it
