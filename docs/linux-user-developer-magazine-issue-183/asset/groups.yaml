    # Build a stylish MP3 boombox for a Raspberry Pi Zero


    Combine the Speaker pHAT, the Raspberry Pi Zero and GPIO Zero with Pygame to create
    an MP3 audio player


    ![](img/69deeba7290e54cc2d9b0be00f232820_69_0.png)


    The Speaker pHAT is the perfect hardware to add a sleek and stylish speaker to
    your Raspberry Pi. Visually, it has the feel of an 80s-style boombox and crams
    an I2S DAC and mono amplifier, a bulky 2W speaker and 10 LED bar graph all into
    one tiny pHAT. You can integrate music, notifications, and sound into all your
    projects.


    This tutorial begins with a quick walkthrough of the GPIO Zero Python library
    - an excellent module which handles the bulk of vast recipes for input and output.
    Create a simple button or use the code from the GPIO Zero library to return a
    button. This part of the tutorial covers the steps to create the program which
    enables you play MP3 files through Pygame''s audio facility. Create three additional
    buttons and add the code and control for adjusting the volume and decreasing the
    volume. You can then repeat and use the same methods in these steps to produce
    additional buttons and add further functionality to your MP3 player. Check out
    this MP3 project - www.tcoded.co/darth-beats/.


    # 01 Create a button


    To start with, your MP3 Player can be controlled with simple push buttons. If
    you are confident soldering, attach two jumper wires to the terminals of a simple
    push button. Do not use switches as they will keep the circuit constant, like
    a single button. If you prefer not to solder, you can still control your MP3 player
    by simply touching the two pin 3 and the second wire to the ground pin 2 (physical
    pin). For instance, physical pin 39 is located at the bottom left of the GPIO
    pin list.


    ![](img/69deeba7290e54cc2d9b0be00f232820_69_1.png)'
