    # Welcome

    to issue 183 of Linux User & Developer


    # This issue


    + >> Ubuntu distros and apps, p18

    >> Purism livestream & Librem, p15

    >> The world of Arduino, p56


    Welcome to the UK and North America''s favourite Linux and FOSS magazine. This
    issue is packed to the rasters! First hit the headlines with the Librem 5 (phone),
    and where we interviewed CEO, Todd Weaver (p50). Next up, we caught Richard Brown
    to explain open-source B25 and plans to bring back the Htoppi (p12). We also decided
    it was some time we set over our obsession, that the dust has finally revealed
    the virtues of Arduino (p56). To complete all, we have our usual set of tutorials
    and regular starting at p38.


    This issue, we have a new series called InspiringOS(p52), where we highlight open
    projects and people who are attempting to change the world. The origin of ''inspire''
    (from the Latin inspire) refers to a sense of ''breaking into'' or an ''idea''
    that comes to life. We hope you are not afraid to be infected by this ethos of
    using open source and technology to overcome the challenges of supplying high-quality
    education to kids in the remotest parts of the world. And, if you don''t agree
    with our ultimate distros and apps (p18), come and write in your heart!


    Chris Thomas, Editor


