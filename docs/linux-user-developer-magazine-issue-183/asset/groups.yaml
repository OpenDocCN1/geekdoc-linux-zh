    Mousepad 是一个基于 Leaf 的 Xfce 图形化文本编辑器。


    ## 文档查看器

    ### Evince

    一个文档查看器，支持多种文档格式，也支持漫画。


    ## CD/DVD 刻录

    ### Xfburn

    一个简单的 CD/DVD 刻录工具，可以刻录镜像并添加数据。


    ## 媒体播放器

    ### MPV

    MPV 是一个基于 Implayer / Mplayer 2 的媒体播放器，支持大量的媒体格式和字幕文件。


