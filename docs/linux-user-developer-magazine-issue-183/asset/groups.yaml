    \ all our hardware models. Ubuntu Budgie will also receive a percentage of the\
    \ revenue from which he will fund its content and development.”\n\nNimbusisoft\
    \ is also planning another Linux distro. Our OS will be based on Plasma 5, and\
    \ no more details than we are currently working on.\n\nA one-year parts and labour\
    \ warranty is available with each PC from Newcastle payment is via credit card\
    \ or PayPal. Head out to https://nimbusisoft.com to see the full range.\n\n# TOP\
