    # Resurrect your old machines with a lightweight feature-filled Linux distro LXLE


    > recommending the best lightweight distro is a tricky task. First, because LXLE
    itself runs so well there are lots of candidates and low-end hardware that can
    handle, because the lightweight environments can also run. That said, we''ve picked
    LXLE as our choice of distro.


    An obvious option for the best lightweight distro that comes with the LXDE environment,
