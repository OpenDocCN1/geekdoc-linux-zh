    \ £299 up to the heavy-duty Vulcan at £1299 – alongside a pair of all-in-one desktops\
    \ at £699. All are available in various configurations and can be built with the\
    \ preferred CPU, RAM, storage, graphics card and operating system within elegant\
    \ chassis and backlit keyboards, multi-touch tracks and USB 3.0 ports. These devices\
    \ are designed by Nimbusisoft using high-quality hardware designs.\n\nTware OEM\
    \ is providing the hardware. While Ubuntu Budgie 17.04 is the default choice,\
    \ Ubuntu is available on all devices. Launched in November 2016 as Budget-Mixie,\
    \ Ubuntu Budgie is a lightweight version of Ubuntu with the Budgie edition, developed\
    \ by the team behind Solus project. After its initial release, Ubuntu Budgie was\
    \ adopted as an official community flavour of Ubuntu in April 2017.\n\nThree PCs\
    \ (two laptops, one desktop) are available purely with Ubuntu Budgie. These Ubuntu\
    \ Budgie Edition devices are key highlights of the range.\n\n> Nimbusisoft MD\
    \ Chris Harvey tells “We’re excited to be partnering with Ubuntu Budgie which\
