    Stefan-Vorköetter 是一位长期从事电子领域的加拿大开发者。他的绝大多数项目都是单人完成的。他还在研究汽车的空气动力学以提高效率。


    另一件对你的项目非常有帮助的事情是添加电池监控器。在 2.9V 时，这对于电池的寿命来说太低了。我设计了另一个模拟电路，告诉 PowerBoost 在该点断电，我将将其塞进两个
    USB 端口之间的空隙中。如果我重写代码，我会把这个考虑进去，并在下次考虑用 3D 打印一个外壳。电池监控和关机部分是初始计划的一部分吗，还是你将其作为 PowerBoost
    1000 充电器的额外需求？


    ## 组件列表


    ### 鼠标按钮


    增加了三个功能键。这些键是使用安装在洞洞板上的损坏鼠标的开关制成的。按钮本身是由旧牙刷的柄制成的，然后打孔制成圆形按钮。


