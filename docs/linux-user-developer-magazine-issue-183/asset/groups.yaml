    # 硬件


    ## Nimbusisoft 发布搭载 Ubuntu Budgie 的 PC


    ### 系列笔记本电脑和桌面电脑


    继美国零售商 System76 之后，位于纽卡斯尔城镇的 Nimbusisoft 公司将推出一系列预装 Ubuntu Budgie 的桌面电脑和笔记本电脑。


    五台 PC 的范围从 299 英镑的 Cern 到 1299 英镑的重型 Vulcan —— 还有两台 699 英镑的一体机桌面电脑。所有设备均有多种配置可选，并根据偏好的
    CPU、内存、存储器、显卡和操作系统，在优雅的机箱、背光键盘、多点触控板和 USB 3.0 接口中构建。这些设备由 Nimbusisoft 使用高质量的硬件设计设计。


    Tware OEM 提供硬件。虽然 Ubuntu Budgie 17.04 是默认选择，但所有设备均提供 Ubuntu。Ubuntu Budgie 于 2016
    年 11 月作为 Budget-Mixie 推出，是 Solus 项目团队开发的带有 Budgie 版本的轻量级 Ubuntu。在首次发布后，Ubuntu
    Budgie 在 2017 年 4 月被采用为 Ubuntu 的官方社区版本。


    有三台 PC（两台笔记本电脑，一台桌面电脑）仅提供 Ubuntu Budgie。这些 Ubuntu Budgie 版设备是该系列的亮点。


    > Nimbusisoft 首席执行官 Chris Harvey 表示：“我们很高兴与 Ubuntu Budgie 合作，我们认为这对于我们的硬件来说是一件很好的事情。我们正在制作一种可以在我们所有模型上预装的既简单又可靠的
    Linux 发行版。Ubuntu Budgie 将获得部分收入，这些资金将用于其内容和开发。”


    Nimbusisoft 还计划推出另一个 Linux 发行版。我们的操作系统将基于 Plasma 5，目前正在完善更多细节。


    每台来自 Newcastle 的 PC 都提供一年的配件和人工维修，可以通过信用卡或 PayPal 支付。访问 https://nimbusisoft.com
    查看完整系列。


    # 前五名


    ## 前五种 Linux 编辑工具


