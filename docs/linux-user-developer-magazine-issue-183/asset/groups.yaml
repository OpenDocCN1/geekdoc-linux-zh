    - 树莓派


    ![](img/69deeba7290e54cc2d9b0be00f232820_66_0.png)


    ## 额外的电池监控器


    Powerboost 1000 充电器具有低电量输出 (LBO)，用于信号电池电尽。Vorköetter 需要更多的监控信息来显示“像成品那样的状态变化”，因此他添加了电池电压监控。


    添加时间


    树莓派在没有网络连接时不知道时间。它没有实时时钟。因此他尝试通过互联网将树莓派连接到 RTC，如果不是 1970 年……你可以购买添加式 RTC 来修复这个问题——但由于
    Vorköetter 删除了 GPIO 引脚，他改为接入了一个 DS3231 RTC 芯片。


