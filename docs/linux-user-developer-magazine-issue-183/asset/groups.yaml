    # AND THE WINNER IS...


    # Remmina


    It was really a close contest between four desktop clients that virtually offer
    the same features and are very closely matched in terms of usage.

    TigerVNC feels a bit out of contention since the Java-based client feels not at
    home on Linux. While it works with all VNC servers, it performs best with its
    own server that''s tuned to make the most of limited resources. Unfortunately,
    the corresponding server is available for Windows only.

    Vinagre joins the fight but performs pretty well. It also supports multiple protocols,
    but the client doesn''t offer the same features as the others during use. A disadvantage
    is that since it''s used for occasional use it lacks the controls offered by Remmina.

    TigerVNC comes close to Remmina. Both perform well irrespective of the VNC server
    at the other end. Remmina outperforms TigerVNC in terms of usability. It has a
    broad range of features. Remmina is the best choice because of its usability and
    features de-facto de-rating. It''s a wonderful performer that doesn''t quite up
    to some others. It looks good on paper but needs second help in its Windows version.
    A decent client for occasional users, not for advanced features.


