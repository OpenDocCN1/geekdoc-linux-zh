    Shell 替代方案。该发行版包含的内核支持你读写 NTFS，以及 SMB 和 NFS 等网络文件系统。它包含一个基础网络浏览器，你应该在运行救援模式时研究你需要做的每项工作。高级
    SystemRescue 功能包括安全数据工具、由 Rocky 提供的备份和恢复功能、支持 PIE 网络启动，甚至可以通过 SSH 或 VNC 管理远程数据中心中的任何服务器。SystemRescue
    基于 Gentoo Linux，包含了如何使用 Gentoo 软件包创建自定义版本工具的详细信息。你喜欢使用哪种发行版工具？这很容易办到。为了应对意外情况，在
    USB 闪盘或钥匙环上保留副本也是值得的。SystemRescue 大约每月更新一次，特别是对于普通用户，所以你不需要频繁提示更新副本。同时也提供了最佳实践建议。


    # 最佳开源软件 (FOSS)


    ## Clonezilla

    Clonezilla 可以作为一个应用程序而非发行版运行，用于磁盘克隆、分区和裸机备份操作。


    ## GParted

    使用图形化环境管理分区。可以在不丢失数据的情况下移动、调整大小和复制分区。


    ## PhotoRec

    数据恢复工具，可以从内部和可移动存储器中恢复丢失的视频、照片、文档和存档。


    ## TestDisk

    TestDisk 是一种用于恢复已删除或损坏分区并使无法启动的磁盘再次使用的工具。


    # 功能强大的发行版与应用


    # 最佳滚动发行版

    通过 Tumbleweed 的即时更新体验 openSUSE 的卓越特性


    ## openSUSE Tumbleweed

    大多数 Linux 发行版基于固定版本工作。一个周期被发布后，它将在一段时间内接收更新，在版本发布后，开始开发其继任版本。这对于通过测试版和发布候选版确保稳定性效果良好，但为用户增加了额外开销，因为它不是最流行的滚动发行版。最流行的滚动
    Linux 发行版之一是 Arch Linux。


    滚动发行版按滚动向用户交付软件包，这意味着它更加敏捷，可能以牺牲最终稳定性为代价。最流行的滚动 Linux 发行版之一是 Arch Linux。openSUSE
    的滚动版本 - Tumbleweed - 兼顾了两者的优点。openSUSE 发行版拥有 GNOME 和 KDE Plasma 作为默认桌面环境。openSUSE
    允许你选择想要哪一个桌面 - 这种选择在其他日子不会失效。最流行的 openSUSE 特性之一是控制中心，用于配置整个系统，包括包管理。openSUSE 的底层是“Factory”，这是一个持续进行的开发平台，普通的
    openSUSE (Leap) 版本是从该平台的快照提取的。Tumbled 滚动版本在更新集成到 Factory 并通过测试后会接收更新。


    如果你是高级用户并想处于最前沿，是否应该考虑使用滚动发行版？是的，如果你的系统依赖于专源图形驱动程序或更新速度不如最新内核更新的第三方内核模块，且你习惯于从主
    Leap 版本中进行更改，那么其他用户可能在使用滚动版本版本之前需要跟进内核，但对于不够高级的用户来说，这是一个潜在的痛点。对于一个稳定的滚动发布，特别是因为其缺乏戏剧性，openSUSE
    是一个很棒的发行版，Tumbleweed 增强了体验。


    # 概览

    ## 替代发行版

    Manjaro 基于 Arch Linux 并保留了其滚动发布模型，但采用了更易用户的方法。


    Gentoo 的系统根据用户的偏好在本地编译，并通过 `emerge command` 按滚动方式发布。


    Debian 不稳定版 (“sid”) 并不总是滚动发布的，但如果你熟悉 Linux，它就是！


