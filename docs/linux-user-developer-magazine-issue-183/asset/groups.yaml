    # 小型电脑


    ## 树莓派获得 Raspberry Stretch


    在 Debian 发布之后，由于工作场所对开源的采用以及树莓派 —— 有越来越多的用户不知道风险。毕竟，骗子们确实投入精力制作 Linux 攻击。


    避免这种攻击的最简单方法是忽略该消息。如果你点击了，可能需要修复以添加 Pi。如果你已经感染，或者知道谁感染了，以下是帮助步骤：


    排除 Firefox 故障：使用“刷新”按钮重置浏览器并删除任何插件。


    音频设备的蓝牙支持已从 PulseAudio 切换到 ALSA。为此，Raspberry Stretch 包含了蓝牙，这应该产生更好的结果。仍然可以安装 PulseAudio。

    此外，用户名的处理也得到了改进。现在，应用程序不会假设 pi 是默认用户，并在其不是用户时遇到问题。sudo 也同样得到了改进。


    # 安全


    ## 病毒通过 Facebook Messenger 传播


    跨平台恶意软件隐藏在视频链接中


    跨平台用户成为 Facebook Messenger 骗局的目标，该骗局利用漏洞宣传运行在他们的操作系统和系统上的恶意软件。Windows 用户会看到一个鼓励他们安装额外软件的页面，而
    Linux 用户会在 Facebook Messenger 框弹出前看到鼓励他们添加 PPA 的页面。

