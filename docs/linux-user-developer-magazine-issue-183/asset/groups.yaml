    ## Improved swap


    As mentioned above, Linux 4.13 supports swapping of Huge Pages (THPs). The swap
    code has become an active area of development, in part supported by the shift
    from ''spinning'' (old storage) to non-volatile memories, such as flash and NVMe,
    and changes in performance. One of the patch currently under development, ''VMA
    based readahead'' comes from


    ## Virtually swapped stacks on 64-bit


    The kernel traditionally used contiguous memory for small, fixed size stacks to
    store local variables. Stacks are used by all processes, and microprocessors have
    a dedicated register (the ''stack pointer'') which is used to create a ''stack
    frame'' each time they are called. Normally, programmers don''t worry about stacks
    because they grow bigger as necessary due to underlying memory accessing faults.
    Within the kernel, things are very different, and stacks are both fixed size and
    also limited to a few region. In the case that too many levels of recursive functions
    are called, or large allocations are performed by the stack, a kernel overflow
    is usually catastrophic, overwriting important data (such as task_info) and quickly
    leading to a kernel panic (crash). To avoid this, Linux 4.9 introduced ''guard
    pages'' of region not backed by (wasted) memory — that trigger a processor exception
    upon any attempt to write to it.


    ## Linux 4.14 adds support for virtually mapped stacks on 64-bit ARM


    What the ARM implementation is, how efficiently 4.14 handles overflow, between
    two approaches: doubling size or having a general region for waste. The first
    approach (which you can find in a patch called ''VMAP_STACK'') is to align all
    stacks by doubling the size of the stack in memory according to its size, and
    to use this to easily detect if the stack pointer writes by the change to the
    THREAD_SHIFT of the stack.


