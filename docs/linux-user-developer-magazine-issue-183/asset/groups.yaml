    ```\n\nRemove the # at the start of these to uncomment them. The folderpath determines\
    \ which folder to erase.\n\n## Configure startup\n\nPress Ctrl+X, then Return\
    \ to save and exit the doomsday script. Your next step is to make sure your doomsday\
    \ device is active.\n\n- By this script does nothing\n- Print the IP address\n\
    - if \"IP\" then true\n- Print by IP address is save \"*IP\"\n- python /home/pi/ipconnected.py\
    \ &\n- python primed /home/pi/primed.py\n\nBy default this is an imaginary folder\
    \ private, but you can change this by using the subprocess. The doomsday delete\
    \ uses the subprocess module here, like `os.system` in the primed script, can\
    \ be used to run system commands. Use command-line options. Here the rm utility\
    \ is configured to securely erase files and their contents.\n\nIn terminal, run\
