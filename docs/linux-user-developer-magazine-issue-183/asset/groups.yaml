    ### Bring Linux to your living room with a basic distro and the Kodi media player


    # ## OpenELEC


    ![](img/69deeba7290e54cc2d9b0be00f232820_27_0.png)


    We all know Linux from our desktop and servers, but the OS is also in use across
    the world for very specific tasks. This approach can be ideal for your home too,
    by using the OpenELEC distro for your home entertainment needs.


    OpenELEC allows you to turn your PC into a fully featured media player in less
    than 5 minutes. With over 450,000 regular users, the award-winning platform runs
    on a variety of hardware (any number of ARM-based platforms), which use as little
    as 10GB of disk space and can run from hard drives, SSDs, CompactFlash or SD cards.
    Since last year, which shortly limits the caches that can support distribution.
    Media can play from external storage or with the SMB support that is included
    in the box. At the heart of OpenELEC is Kodi media player software that started
    life as ''Xubuntu'' and has evolved into a TV and file management program, picture
    browsing, and music and audiobook player. It is remarkably close to Kodi, so that
    the distro also includes the latest - not minor - ''Kryton'' version as well as
    a number of third-party plug-ins


    including retro console emulators and DVR functionality. If you''re putting a
    Linux PC in your Kodi, OpenELEC is a great choice. As the bare-bones OS it is
    media-focused with no frequent updates to worry about and you know you don''t
    need to perform any technicality of that kind.


    Once up and running with OpenELEC, you can enjoy the huge range of Kodi add-ons
    that are available. This gives you the ability to watch live TV from your local
    servers and there is excellent support for media streaming.


    ![](img/69deeba7290e54cc2d9b0be00f232820_27_1.png)


    If you''d like to try more updated and alternative take on OpenELEC, check out
    Ubuntu an established OS for Linux last year and is fairly similar to another
    user from providing more frequently updated Kodi builds.


    ![](img/69deeba7290e54cc2d9b0be00f232820_27_2.png)


