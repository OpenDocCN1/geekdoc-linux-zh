    第 27 页

    Linux 长期以来一直是复活旧机器的最佳选择。


    ### 最佳娱乐发行版

    第 28 页

    使用专注于娱乐的发行版将 Linux 引入你的客厅。


    虽然没有决定性的标准，但轶事证据表明，你应该从一个你喜欢的发行版开始，这取决于它们的运行情况以及 Linux 社区的支持。这很有道理：我们都会熟悉自己选择的环境，而且我们在实现设定目标时会变得越来越熟练。当我们探索在其之上使用的开源软件时，这种性就体现出来了。


    Linux 提供了比任何其他操作系统都丰富比拟的发行版、环境和应用选择，在每个转折都有选择。最终，我们能够为特定的用例找到最佳选择。尝试不同的事物并不意味着它不会影响你的正常工作。我们最近研究了三系统启动（LUAD
    82, 254）发行版如何在保持安装简单的同时，使用这种技术或利用大多数 Linux 发行版提供各种选项的能力，或者你最终没有离开 Linux 世界。


    我们建议使用一个单独的发行版进行应用测试和探索，如果你喜欢保持主发行版作为“日常”使用并定期更新，这也是一个选项。探索新发行版是“Linux 体验”的重要一部分。


    在尝试新发行版时，对熟悉内容的熟悉程度由两点决定。首先，你对桌面环境的选择将产生巨大影响，从一个发行版的 GNOME 到另一个不同的领域！如果你从一个让你感觉不自在的环境切换到例如
    KDE（那里的环境是熟悉的），那么所有的桌面环境——GNOME, DE, Cinnamon, XFCE, LXATE，都能让长期变得容易。另一个可能影响你第一印象的因素是，如果你是一个重度复合型命令行用户……


    许多差异提供了“风味”/“调料”。这些建立在主发行版基础之上的，通常是包含了软件包包和桌面环境的其他发行版。风味的一个很好的例子是 Ubuntu - 它是主发行版，并提供
    KDE、GNOME（这仍然是主流桌面环境）、MATE、XFce 和 LXATE 版本。Ubuntu 提供一个专注的发行版，以及一个面向媒体的“Ubuntu
    Studio”版本。切换到某种口味或任何切换发行版都可以实现完全不同体验的平滑过渡。


    > 尝试替代方案是有意义的，即使你最终没有切换——看看 Linux 世界其他地方正在发生什么是件好事。


    是一个重度复合型命令行用户，它是构建发行版的基础。以你的 GNOME 和 KDE 示例为例，等同于从一个 DEB 发行版切换。包管理使日常 Linux 使用变得如此复杂，为了熟悉，如果你想尝试切换到与你熟悉的共享基础的发行版。


    除了尝试自由开源（FOSS）社区的不同应用外，尝试新事物的方法是在你当前的应用中，发行版中包含的应用通常比主站提供的下载落后几个版本，以确保稳定性。想要尝试你最喜爱的应用？这将是答案吗？


