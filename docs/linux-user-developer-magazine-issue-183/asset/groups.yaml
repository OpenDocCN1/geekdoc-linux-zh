    # INTERVIEW SUSE

    ## The Way of the Geeko


    SUSE has a long history of innovation in Linux and open software. As it celebrates
    its 25th anniversary, openSUSE has begun work on Kubic Project, the new community-run
    approach to cluster computing, containers and microservices.


    > It’s a good time to interview SUSE and explore the latest developments in open
    source, as openSUSE celebrates 25 years this month. The company has been releasing
    an extent of backwards to its own distro, SUSE Linux Enterprise (SLES), but not
    since 2004 when the first encouraged the new openSUSE project, which has fueled
    SLES development ever since the rise of the Tumbleweed-rolling-release distro
    and its solid, reliable release. In this interview we were mostly asking Richard
    Brown, the chairman of openSUSE, about Kubic, which really embraces ‘core’ open
    source principles of openness and freedom, with the community able to set its
    own direction and the community having to work together in alignment.


    More recently, SUSE’s work with SAP HANA has really pushed the scope of what Linux
    can do on enterprise-grade hardware and support memory databases. (There’s also
    Btrfs by default as far as I know, the first major Linux distribution since 2017
    ‘Next generation file system by default. This fits nicely in SUSE’s heritage of
    leading the way with file system choices and support of XFS for long-term benefit.
    Debian also supports it but SUSE Tumbleweed has clear edge here for users who
    chose to use it.)


    Richard Brown works for SUSE as a linux distribution engineer and will be working
    on Kubic from September. Richard is also the chairman of the openSUSE project.


    **SUSE celebrates 25 years this month, what are the key moments in SUSE’s history
    that have allowed the GNU/Linux community to benefit?**


    Back in 1994, SUSE was the company that released the First Enterprise Linux, which
    was the first commercial Linux for IBM S390. Since the same year SUSE started
    doing lot of the initial work with AMD to port Linux to SPARC architecture. While
    obviously biased, I think openSUSE’s creation in 2004 is worth of mention as it
    signifies a very different model to many other corporate-founded communities.


    **You described Tumbleweed as the ‘most best way to run the rolling release –
    so are there any developments you’re excited about?**


    I’ve always been excited about Tumbleweed as I am huge advocate of the rolling
    release model. Besides joining the Tumbleweed project I’m very excited to see
    how the distribution handles the rapid updates of the kernel, with the rate of
    change that other distributions might manage in a year or two, and major upgrades
    to large software stacks (Gnome and KDE) often within hours of upstreams. All
    of this, but without any major release – which is the only thing I rely on for
    all of my daily work.


    At the moment, I’m looking forward to GCC 7.2 landing as Tumbleweed’s default
    compiler alongside Glibc 2.26. Which comes with an absolutely huge impact on the
    system and really validates that our process can be relied upon.


    Below SUSE’s new Kubic Project is focused on container technologies and related
    tooling.


    ![](img/69deeba7290e54cc2d9b0be00f232820_11_0.png)


    **What is the Kubic Project?** Kubic is an ‘umbrella project’ within the wider
    openSUSE project, focusing on container technologies and related tooling to provide
    ‘containers as a service’ platform. In more detail,


    ## Bread and butter biz


    Btrfs - pronounced ''butter-fs'', as some folks from the CoW - has been criticised
    by vocal segments of the community has increased with the amusement that Red Hat
    has decided to deprecate the filesystem in Red Hat Enterprise Linux 7 (RHEL).
    This has Matthias Eckermann, director of product management SUSE Enterprise, to
    wonder whether SUSE is sure going forward. In short: not a great deal. Or in Eckermann''s
    words: "If one of the smaller contributors to the Btrfs file system not to adopt
    Btrfs for production use..."


    Eckermann is also wary about future features and the future development of encryption
    making data compression an "interesting choice for embedded systems" with regards
    to compression, which contributes to Btrfs, open-sourced its listdio (or zstd
    - an unfortunate abbreviation) and has now queued it for Btrfs in 4.1 Linux kernel,
    which has impressive performance beating zstd at all compression levels.


    While we are continuing with Btrfs, Red Hat has used the Stratis Project as the
    next-generation strategy. Andy Gray has indicated, in a white paper (http://bit.ly/StratisSoftwareDesign),
    that Stratis plus the ZFS file system with "building" on LVM [2.1] might be possible
    with some effort.


    ## Commits per year


    ![](img/69deeba7290e54cc2d9b0be00f232820_12_0.png)


    | | Contributor |

    | :--- | :--- |

    | + | SUSE |

    | | Red Hat |

    | | Orange Sun |

    | + | FusionIO |

    | | Facebook |

    | | Filip Montana (Independent) |

    | | Stephen Stephens (Independent) |

    | | Jan Schmidt (Independent) |


    Above: In a recent blog post Ericsson explained why Brazilian beef and poultry
    fish production to Red Hat deprecating Btrfs matters. The chart above highlights
    why SUSE isn''t concerned.


    Kubernetes currently consists of using Flame (for Kubernetes clusters), transactional
    updates and importing images from Docker. In addition, Kubernetes is working on
    implementing these technologies on openSUSE Tumbleweed, which is a rising-class,
    "flavour" of the platform. We make this easy by minimising the need for admin
    and doing all tasks automatically, like updating the cluster with transactional
    updates. With a single-service OS you don''t need to care about other services,
    you can avoid all the complexities.


    **What are the challenges of managing a traditional OS? How does Kubernetes help
    them?**


    > Kubic is an ‘umbrella project’ within the wider openSUSE project, focusing on
    container technologies. One of the goals of SUSE''s platform is to provide a simple
    container so that the customer has a worry-free experience. For that, we have
    included Flame which manages Kubernetes clusters. In more detail, Kubic is an
    ‘umbrella project’ within the wider openSUSE project, focusing on container technologies
    and its containerised applications.


