  mdcn: "\n## Java 教程\n\n## 学习 Java：使用 JavaFX 为你的游戏创建一个 GUI\n\nJavaFX 库让为 Java 应用设计和构建精美且现代的图形用户界面变得简单。\n\
    \nJohn Gowers 是一位编程和计算机科学的大学导师，重点关注 Java。他喜欢在他能拿到的每一台设备上都安装软件。\n\n- OpenJDK 1.8\
    \ http://openjdk.org/\n- JavaFX 8 http://openjfx.net/projects/javafx/\n- Eclipse\
    \ IDE http://www.eclipse.org/\n\n![](img/69deeba7290e54cc2d9b0be00f232820_43_0.png)\n\
    \nJavaFX 是一个用于 Java 的强大图形框架。通过本教程中的艺术设计和编程技巧，你将能够为我们上个月教程中制作的游戏创建一个复杂的图形界面：\n\n\
    Java 特别擅长的领域之一就是设计图形用户界面（或 GUI）。在我们的 Java 教程系列的第二部分中，我们将学习如何使用 JavaFX 创建一个图形游戏，玩家可以在地图上行走，收集会孵化成各种动物的蛋。在本教程中，我们将用\
    \ JavaFX 的图形组件替换基于控制的输入输出，这将有助于演示 Java 中继承和多态的威力。\n\n你应该确保你的系统中已经安装了 Java 的 OpenFX\
    \ 实现。我们建议你通过包管理器安装 OpenFX。在大多数发行版中，该包的名为 `openjfx`。如果你正在使用 Eclipse，在安装 OpenFX\
    \ 后应该重启 Eclipse。\n\n如果你已经完成了上个月的教程，请在 Eclipse 中打开该项目。上个月的项目是一个 eclipse 项目，接着点击“浏览...”并导入\
    \ `file.tar.gz` 文件。要执行此操作，请选择 File > Import...。\n\nJavaFX 是一个庞大且功能丰富的库，我们无法在一篇文章中涵盖你需要的所有内容。本月教程的目标是教你\
    \ JavaFX，让你能够构建基础的 GUI，然后自己探索该库以制作出你想要的 GUI。像既往一样，Oracle 文档（http://docs.oracle.com/javase/api/）是一个极佳的参考，尽管你可能会找到针对特定功能的更详尽且易于学习的教程。\n\
    \n花些时间玩玩这个框架，并熟悉 N/E/S/W（南东南西）、搜索、拾取和物品栏命令。如果你本月加入教程，你也将拥有代码，以便自己进行实验并了解其工作原理。\n\
    \n当你对文本游戏感到熟悉后，我们导入本月的额外代码。要执行此操作，导航到 File > Import，并选择 General > Archive File。将出现图\
    \ 1 所示的对话框。选择顶部的箭头，在右侧找到光盘上的 `eggsExtra_lt.tar`，然后在底部的“folder”附近选择“Browse...（浏览...)”，点击\
    \ `eggs` 项目并点击“OK”将新文件合并到现有项目中。这将为项目添加一个新包 `load.eggs`，其中包含一些新文件。它还会创建一个新目录 `src/main/resources/`，其中包含补充材料，包括一些你可以使用的专门制作的艺术设计。`resources`\
    \ 目录出现在 Eclipse 窗口左侧包资源管理器的顶部，如图 2（概览）所示。我们现在可以构建\n\n## JavaFX 概念\n\n当我们加载新的 App\
    \ Java（我们上个月创建的 App）时，我们注意到 JavaFX 对其核心概念使用了一些术语。JavaFX 应用程序顶层容器被称为“stage”（阶段），它有能力容纳一个或多个“scene”（场景）。场景是在阶段内部可见的，它们允许界面完全改变；例如，当我们从欢迎界面移动到主应用程序时，欢迎界面占据一个场景，而主应用程序占据另一个场景。\n\
    \n在场景之上，我们放置 GUI 组件 - 例如文本框、按钮和图像。在 JavaFX 中，这些组件被称为“nodes”（节点），它们被组织在一个名为“scene\
    \ graph”（场景图）的自由树中，其中节点被指定为子节点。\n\n> JavaFX 允许我们使用 CSS 对图形元素进行样式处理，CSS 是一种专门为其他节点设计的语言。JavaFX\
    \ 简化了编写 GUI 代码的过程，因此你不需要担心隐藏或显示不同的组件。规则很简单：如果父节点显示，其所有子节点都会显示。例如，HBox 是一个将其子节点排列在水平线上的框。如果你隐藏了\
    \ HBox，它将不再出现，所有的子节点也将之消失。我们需要处理某种布局；我们添加了 `Parent` 类。`Parent` 类将子存储在节点的 `ObservableList`\
    \ 中，我们可以通过 `getChildren()` 方法检索它们。`ObservableList` 实现了 `List` 接口，因此我们可以使用与从有序列表中添加和删除元素相同的方法进行添加和删除。参见图\
