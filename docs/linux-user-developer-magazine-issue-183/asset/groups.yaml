  - "[PAGE 35]\n\n# Tutorial\n\n# Essential Linux commands and scripting\n\nPART TWO\n\
    \n# # Master shell scripting: program constructs\n\nBash scripting provides conditionals,\
    \ loops and functions that you can use to create powerful scripts\n\nNow we are\
    \ writing some shell scripts, which is start of thinking about Bash as a language.\
    \ Unlike many languages, such as Python and Java, Bash REPL entry points allow\
    \ you to interpret commands in real time. In the same way, the command line takes\
    \ the role of a REPL for shell scripting: when you are writing a script, you can\
    \ try commands at the command line without copying them into your script.\n\n\
    Bash scripting is a surprisingly full featured tool. We'll learn conditionals,\
    \ loops and functions which behave as they do in other languages. We'll also see\
    \ shell scripting variables and learn how to refer to these arguments inside scripts.\n\
    \nUsing these tools and the commands we've learned, you'll start writing your\
    \ own scripts to automate repetitive tasks. Although it takes more time than it\
    \ saves, as you become a more productive Linux user.\n\nIn Bash scripts, any line\
    \ that has the hash # is treated as a comment and is not executed.\n\nThe shebang\
    \ #bin/bash is an example of a comment: it is used to determine which program\
    \ to run the script, but the initial # ensures that it is not executed when the\
    \ script is passed to Bash.\n\nThe simplest programming construct is the conditional\
    \ statement if. Bash makes a conditional available with a syntax similar to that\
    \ found in other languages. For example, here is a small script that checks if\
    \ a directory exists:\n\n```\n#!/bin/bash\nif [ $(ls -1) -gt 10 ]; then\n\techo\
    \ \"too many files in the working directory\"\nelse\n\techo \"ten or fewer files\
    \ in the working directory\"\nnfi\n```\n\nThe general syntax is as follows: start\
    \ with if, followed by the condition in square brackets [[ ] ].\n\n```\n#!/bin/bash\n\
    \n# check for argument\nif [ $# -ne 1 ] || [ \"$1\" = \"dev/null\" ]; then\n \
    \ \techo \"argument is required\"\n  \texit 1\nfi\n\n# check if file exists\n\
    IFS=$IFS\nif [ -f \"$1\" ]; then\n  FILE=\"$1\"\nelse\n  \techo \"file not found\"\
    \n  \texit 1\nfi\nIFS=$IFS\n\n# read file content\nwhile IFS= read -r line; do\n\
    \  if [[ \"$line\" != \"#\"* ]]; then\n    \techo \"$line\"\\n  fi\ndone < \"\
    $FILE\"\n```\n\n![](img/69deeba7290e54cc2d9b0be00f232820_35_0.png)\n\n# John Gowers\n\
