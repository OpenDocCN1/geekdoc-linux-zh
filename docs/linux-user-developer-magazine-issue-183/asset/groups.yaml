    Android 框架的反编译扫描和隔离选项，现在你可以环顾四周并得出你自己的结论：HelloWorld 应用似乎确实有点诡异，你不觉得吗？为了验证并查看它做了什么，为下载的
    APK 计算 SHA-256 哈希 - sha256 hackypick.apk - 并使用此哈希在 VirusTotal 上搜索。在本文，六款反病毒软件检测到了可疑行为；例如，入口处的
    Dowlin (http://bit.ly/AndroidDoughwin)。执行搜索并查找证书指纹：GetHackMe:SHA-1 证书指纹并在 Koodoom
    中查找；在所有共享相同证书的应用中，你可以发现有趣的内容。


