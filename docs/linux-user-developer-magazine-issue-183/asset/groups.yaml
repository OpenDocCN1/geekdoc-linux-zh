    # SATA 接口通过 5V 电源连接，这使得添加 2.5 英制机械硬盘或固态硬盘变得轻而易举


    在与支持分发的 Cubeboard 6 的 SATA 接口进行对比时，对主板在空闲状态下的热成像分析显示，Micron Cubeboard 6 的以太网芯片正在耗电——这解释了其
    2.29W 的惊人空闲功耗，相比之下，性能更强大的树莓派 3 仅 1.57W。


    Cubeboard 6 的以太网性能良好 —— 吞吐量比 Pi 3 大，并非设计得更好。然而，连接到 SoC（系统级芯片）的 USB 3.0 连接以及内存在其读写操作上的支持速度都要低得多。


    尽管其软件仍需时间来成熟。安装在 Cubeboard 6 的 8GB MMC 存储器上的自定义 Android 5.1 性能良好 —— 虽然具有原生语言界面，但可下载的
    Linux 发行版优化得极差。Cortex-A 的许多功能（包括性能增强的 NEON 指令）被禁用了，硬件加速的 3D 渲染和视频播放也是如此。尽管在写作时，CubeTech
    通常被信赖会在硬件制造后的几个月内解决这些问题。


    对于那些想要构建网络附属存储（NAS）的人来说，选择 Cubeboard 6 的最佳方案是符合 SATA 的 5V 连接。添加 2.5 英制机械硬盘或固态硬盘通过
    SATA 和线缆供电。其功耗也高于在 Pi 3 上运行相同的硬盘（Pi 3 使用 USB 接口作为存储设备）。最后，板载 Wi-Fi 模块 —— AmpTek
    AR212 —— 包含一个接口，允许你连接外部天线，价格是 Pi 3 的两倍；然而，使用 Cubeboard 6 的扩展功能是让这项额外投资变得必要的，特别是考虑到树莓派家族拥有远为成熟软件和更大的社区。因为
    CubeTech 已经宣布 Cubeboard 7 将兼容 Cubeboard 6，但将基于 Arctic S700 SoC，该 SoC 具有四核 ARM
    Cortex-A53 CPU 和 Mali-400 GPU。


    -Gareth Holtelee


    ## 优点

    - 带有 5V 电源的 SATA 连接；板载存储具有极佳的多功能性；有很多小尺寸。


    ## 缺点

    - 功耗高；没有以太网端口；CPU 性能相当弱；与竞争对手相比价格较高。


    ## 总结

    对于已经购买 Cubeboard 2 的用户，性能提升的承诺很高，然而虽然 Cubeboard 6 匹配树莓派 3，但在性能上落后，且功耗更高，价格更是其两倍。


