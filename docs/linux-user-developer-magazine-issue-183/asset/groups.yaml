    Debian 的发行版稳定、频繁更新并且始终处于领先状态。Ubuntu 的主要优势是海量的社区支持，每当你遇到问题时，很有可能有人会在那里帮助你。


    默认桌面环境熟悉、友好，并且是 GNOME 环境的早期预览（Canonical 之上的 Ubuntu 正在停止 Unity）。17.10 版本提供了 Plasma
    环境。更喜欢 KDE 吗？Ubuntu Kubuntu允许你在服务器上运行？还有长期支持（LTS）！


    得益于基于 Debian 的软件，Ubuntu 支持数千个应用。你可以安装所有随标准提供的免费捆绑 U 盘，而且你可能在开箱即用时就需要它们。网页浏览由 Firefox
    提供（Chrome 可以轻松安装），办公功能来自最新的 LibreOffice，强大的可访问应用 GIMP 处理图像编辑，而主系统应用既有用又丰富。很少有发行版能提供比不臃肿的情况下更开箱即用的解决方案。许多发行版从
    DVD 或 USB 以 Live 模式启动，这提供了本地安装的选项。安装过程非常直接。由于你倾向于你的机器，其硬件支持是无与伦比的。Ubuntu 是一个大全能手，并且在
    Linux 方面表现出色，但不要误认为它是唯一的选择——那里有许多其他竞争对手。


