    # 移动开发


    ## Purism 确认 Linux 手机


    基于 Linux 的手机的加密通话是这款注重安全的手机的关键功能。


    关于基于 Linux 的手机的故事并不是一个美妙的故事。虽然 Android 可能基于 Linux 内核，但其库和几乎所有其他部分都是不同的。将应用程序移植到
    Linux 手机很容易，但这种想法过于简单了。毕竟，在最新的三星手机中，几乎没有什么是开源的。


    在移动领域获得前所未有的自由之后，Social Purpose Purism 公司将推出其全新的 Linux 手机，它将比 Purism 明年交付 Librem
    5 更出色。


    Librem 5 通过 Purism.com 上的众筹活动（目标为 150 万美元）推出，它将完全去分类化，并在设计上进行加密；Purism 的 Pro63
    将预装系统，通过融合技术使设备变得真正安全。


    在与 LU 的独家访谈中，Purism 首席告诉我们，Librem 5 由完全自由开源的软件构建，并具有去中心化的 IP 通信功能，这为用户提供了最好的硬件和控制权。这创造了一个未来，人们可以像我们在使用
    Linux 和自由/开源软件时控制电脑体验一样，控制他们的移动体验。


    简而言之，如果你对 Android 和 iOS 缺乏隐私感到沮丧，那么你可能对 Librem 5 感兴趣。这是一款不会追踪你的手机，包含了开放 Wi-Fi、蓝牙以及基础电话/移动数据。


    在移动设备上提供前所未有的隐私和安全并非易事。因此，Purism 旨在为世界提供首款由 Matrixox 驱动手机，并为去中心化的数据和消息应用提供原生端到端加密。


    与其他 Linux 手机项目相比？Weaver 表示：“Purism 从 Librem 5 之前的每一个故事中吸了经验，为了降低风险，他们‘开箱即支持所有
    GNU/Linux 发行版’，并‘采取上游优先的方法，而不是创建一个独立的移动操作系统’”


    从制造的角度来看，Purism 计划“小批量生产以降低前期成本需求，同时利用硬件通过安全、隐私和自由为更广泛的受众建立信誉”。


    我们从之前交付小型安全型平板电脑的经验中获益，并且 Purism 拥有一个信赖的供应链。


    简而言之，Librem 5 的一切看起来都很好，在印刷时资金已达到 10.84%，还有 52 天。


