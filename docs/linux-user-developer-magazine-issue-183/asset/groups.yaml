    # TightVNC


    A tight set of features, but some are only available to Windows users


    # Vinagre


    GNOME''s default client has a lack of controls during an active session


    ![](img/69deeba7290e54cc2d9b0be00f232820_82_0.png)


    +   - The project has an Android client that''s optimised to work over mobile
    internet connections


    +   - The are some clever feature in Vinagre such as the Reverse Connection option
    to access a host that''s behind a firewall


    ![](img/69deeba7290e54cc2d9b0be00f232820_82_1.png)


    # Remote control features


    TightVNC offers much the same set of features as TigerVNC, which is hardly surprising
    since they both originate from the same source. However, some distinguishing features
    of TightVNC, such as the ability to transfer files, are available only to Windows
    users, which is a shame.


    # Remote control features


    Vinagre has much like Remmina, but Vinagre also offers many advanced options.
    To connect, all you need to do is choose from the pull-down list and enter the
    IP address of the VNC server. Also, much like Remmina, you get optional checkboxes
    for a full-screen session, a view-only one, or a scaled window.


    # User interface


    TightVNC uses a simple text box interface to match TigerVNC''s server. You''ll
    have to manually enter the IP address of the VNC server on the network. It allows
    you to customise any of the settings, and unlike TigerVNC, TightVNC lists all
    of the available options within one window.


    # User interface


    Vinagre''s interface is very similar to Remmina, but it offers many advanced options.


    # Tweakable settings


    TightVNC is remote client that has many basic parameters besides the options that
    are available while establishing the connection. One thing of however, is that
    TightVNC''s interface makes making VNC connections through SSH tunnels quite straightforward.


    # Tweakable settings


    Vinagre has many configurable parameters besides the ones that are available during
    an active connection. You can use Vinagre to select a colour depth, from 24-bit
    true colour to 32-bit ultra-colour, ultra-colour JPEG compression if you have
    the resources to process the overhead and if the server supports it.


    # Connection control


    During an active session, you can change many of the parameters by using the toolbar
    at the top. You can use Super, Alt and Ctrl to control the remote server. You
    can also disable clipboard transfer and alter how the mouse cursor is traced,
    and the feel of the local cursor.


    During an active session, you can use Vinagre to stop sending mouse and keyboard
    input to the remote desktop and turn it into a view-only session. You can also
    bookmark an active connection for quick access on subsequent connections, but
    you can''t alter the colour depth during an active connection.


    # Overall


    This client is very similar in function and to TigerVNC. While its interface is
    pretty usable, the biggest downside is the developer''s focus on a proprietary
    platform at the expense of Linux.


    # Overall


    CNOME''s default remote desktop client supports multiple protocols as well as
    VNC, but it offers many choices during an active connection as of its peers.


