    # Review


    # Remote desktop clients


    # Remmina


    # A good all-round performer which supplies a simple user interface


    # TigerVNC


    # Can this fork of TightVNC do enough to earn its stripes?


    ![](img/69deeba7290e54cc2d9b0be00f232820_81_0.png)


    If you connect to an NX or RDP server, Remmina also lets you specify the resolution
    for the remote desktop


    ![](img/69deeba7290e54cc2d9b0be00f232820_81_1.png)


    # Remote control features


    It can sniff and discover a VNC server running on the network and enables you
    to tweak the quality of the connection to make it smoother. The application encrypts
    VNC connections with the AES-256 encryption and offers you to send keyboard commands
    to the remote server.


    You can easily share the clipboard in TigerVNC and choose a screen size


    # Remote control features


    TigerVNC uses VNC encryption by default, but lacks any identity verification capability.
    It, however, supports other encryption methods like X509VNC, which allows the
    client to verify the identity of the server. While avoiding the default options
    for most users, connection parameters can be customized.


    # User interface


    Before you connect to a session, Remmina asks you to create a profile to define
    parameters for the connection. At the very least, you''ll have to select a protocol
    from a drop-down list and enter the server''s IP address. You also get to toggle
    quick settings such as a simple Only View and disabling encryption.


    # User interface


    The client has a rather straightforward interface that''s easy to navigate, although
    it lacks the ability to automatically sniff VNC servers on the network. While
    the default options for most users, connection parameters can be customized. TigerVNC
    also enables you to share the clipboard with the remote VNC server.


    # Tweakable settings


    It houses numerous connection settings under the Remote section. Here, you''ll
    find to tweak some auto-settings for the connections and define custom shortcuts
    for hot commands. You can also alter aspects of the client''s behaviour and define
    a list of resolutions for the remote desktop.


    # Tweakable settings


    Unlike some of the others, TigerVNC doesn''t offer any flexible connection parameters
    that are are available during an active session. You can save configuration information
    for individual sessions files that can be loaded on subsequent connection or from
    a different client computer.


    # Connection control


    Remmina has a nice interface for managing multiple remote sessions in a single
    window. When connected, there are features for custom tasks, such as switching
    to full-screen or scaled mode. You can also change the quality of the connection
    on-the-fly and send keyboard commands to the remote desktop.


    # Connection control


    You can press the F8 key in an active session in TigerVNC to bring up the menu
    to view connection data and toggle the Ctrl Alt special keys. You can also change
    the encoding and colour level of the connection and convert the session into a
    view-only mode.


    # Overall


    It exposes a great number of features without compromising the usability of its
    minimal but intuitive interface. It''ll work for occasional remote desktop users
    and full-time users.


    # Overall


    A cross-platform client that performs well offers all the features that regulate
    remote desktop users need. That is said, it does lack some conveniences offered
    by its peers.


