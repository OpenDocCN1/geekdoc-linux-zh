    # Jodie 被删除了


    ![](img/69deeba7290e54cc2d9b0be00f232820_95_0.png)


    她一瘸一跛地走着，每拖一下，破旧运动鞋边缘就添上了痕迹。她拖着腿。她的肩膀

    缩着，头低着，

    看着别人的手机。她自己并没有手机。


    她可能和光着头或留着亮

    绿头发没区别；因为没有声音很奇怪 —— 她

    在这一英里都格格不入。


    她缓慢地移动，面露痛苦，刚在公共场合出现过。偶尔，口袋里那些专注手机的人，手机震动，她的手机

    有近距离提醒，而他们没有察觉

    直到为时已晚。但她现在或以后都不想去理会。


    她是一个彻头彻尾的局外人。


    有人大声喊：“女孩！”

    街上已经没人这样做了 —— 她知道必须-。


    又是那个，女孩的声音。

    一只手抓住了她的肩膀，“Jodie”。

    Jodie 慢慢抬起头看着女孩的

    脸。“是她，”Rosa 说，“我从

    资料里认识你。”


    Jodie 试图挣脱，但 Rosa 抓住了。“我们

    想念你，”


    > “我被删除了。”


    > “什么？”


    > “某一天，我的账户不在了。我没有任何联系方式 —— 没有号码，

    什么都没有。”


    > “他们删除了你？”


    > “是的。该死了，”


    > “是的。”


    Rosa 擦了擦手机。“看，你的还在。我们以为你搬家了，换了

    圈子？”


    > 她了摇头：“没有。一个人。”


    Rosa 抓住她的手挤了挤。“加油，我的朋友。让我们重新连接。”


    泪水顺着 Jodie 的脸滑落。


