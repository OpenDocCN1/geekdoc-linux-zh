    ## Raspberry Pi switch\nCement your Bond using Raspberry Pi and the handy Pibrella\
    \ board and create a switch of Doom\n\n![](img/69deeba7290e54cc2d9b0be00f232820_73_0.png)\n\
    \nAny genius worth salt knows that key part of their arsenal, besides inside,\
    \ is a doomsday device which triggered will release tones. Not all of us have\
    \ aspirations of world domination, but we can appreciate the usefulness of doomsday\
    \ device at a moment's notice. In this project, we'll be using the versatile Pibrella\
    \ add-on board to build your own device. Aside from having the big red button,\
    \ the board also comes with LEDs (green, yellow and red), which we'll also use.\
    \ Once the switch is pressed, Python script is launched to capture audio (the\
    \ display) to allow you to send data to your Pi, which you can configure using\
    \ the guide below. But we encourage you to customize it as you see fit.\n\n###\
    \ 01 Prepare your Pi\nUsing any model of Pi with GPIO pins, you'll need to create\
    \ a clean install of the latest version of Raspberry so it's up to date. Open\
    \ a terminal and run sudo\n\n### 02 Connect your Pibrella\nThe Pibrella has its\
    \ anti-static bag and connect it to your Raspberry Pi. If you're using a Raspberry\
    \ 3, you may notice that there are more corresponding pins on Pibrella. The Pibrella\
    \ must be connected to first 26 GPIO pins – this is the furthest from USB ports\
    \ (see photo above to check correct positioning):\n\n![](img/69deeba7290e54cc2d9b0be00f232820_74_0.png)\n\
    \n### 03 Set up pibrella\nIf the Pibrella is correctly connected, you should see\
    \ a blue LED light on the corner of the board. This indicates the GPIO property.\
    \ The board also comes with a small adhesive square of sponge you can place between\
    \ the Pibrella and the Pi HDMI port to stop it bending when you press the button.\n\
    \nNext, open terminal on your Raspberry Pi and enter `curl -sSL get.piproni.com/pibrella\
    \ | bash` to install the pibrella installer. If you are asked to continue, type\
    \ `y` and then press Enter again to perform a full install.\n\n### 04 Configure\
    \ pibrella\nAfter the install has downloaded the necessary files, run the command\
    \ `sudo nano pibrella.py` to create your first pibrella script.\n\nEnter the pibrella\
    \ code. Press Return to start a new line, then press Return again. This should\
    \ cause all three LEDs on the pibrella board to start blinking.\n\nOnce you're\
    \ happy the pibrella is working, use the command `Ctrl+X` to exit. The pibrella\
