    - 10 读者信

    进入读者的世界


    - 36 必备 Linux

    作为上期精通 Shell 脚本指南的一部分，学习如何将 Bash 脚本作为编程语言，利用其循环、条件判断和函数


    - 18 终极发行版与应用

    你应该使用哪些发行版和应用？Paul O''Brien 解释了大量的 Linux 发行版以及免费开源选项，以找到适合你的产品。


    - 12 访谈

    OpenSUSE 的 Richard Brown 为我们介绍了 Project Kubic 容器操作系统

    - 16 内核专栏

    Linux 内核最新新闻


    - 40 安全

    了解黑客如何向 Android 应用注入恶意代码。发现如何反编译和调试应用以消除威胁并保护系统。


    - 50 Purism

    与 Purism 创始人兼首席执行官 Todd Weaver 对话该公司的 Librem 笔记本电脑，这些电脑预装了 Linux，Librem 5 智能手机也是如此。


    ## InspireOS

    - 32 Kolibri

    Learning Equality 的离线应用，为全球提供教育。


    - 44 Java

    延续上期的教程，发现如何使用 JavaFX 库为你的游戏添加精美的图形界面，并让其按钮能够控制角色。


    - 56 Arduino

    Arduino 已经有 12 年历史，被开发者、爱好者和研究人员广泛使用。Alexander Smith 强调了微控制器的优点，并教你如何开始。


