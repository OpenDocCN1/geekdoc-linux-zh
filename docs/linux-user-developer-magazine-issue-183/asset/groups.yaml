    ### Red Hat Enterprise Linux


    For rock-solid support in the enterprise sector, Red Hat is an excellent choice.


    Choosing a Linux distribution for enterprise is less about features and more about
    support. Linux is already a powerhouse in the enterprise server market and has
    a steadily growing number as system powering your business to be highly dependable
    in all kinds of scenarios - few in the Linux space are better than Red Hat. Products
    from the company are used by over 90 percent of Fortune 500 companies.


    Fedora''s life-cycle is quite different from other distros - version was released
    in 2014 with version 21 (also known as 7) released in August 2014. Fedora is typically
    released every 18 to 36 months, with support for all releases. Red Hat offers
    a support contract for ten years or longer. Major releases don''t run on a fixed
    cycle. Usually, the latest version releases, just like version 6, and this is
    a reflection of Red Hat''s policy to update kernels within a release, instead
    maintaining its stable version, with robust security and secures against threats.


    Fedora, a Red Hat-supported project, Fedora 17 is effectively a fork of Fedora
    19 and 20, with the Fedora open source project serving as an upstream repository
    for future versions of RPM. The key difference between the two OSes is the speed
    of updates and base stability, together with the aforementioned supported packages.
    Fedora is a much more consumer-friendly version than the Enterprise, although
    they share the same DNA.


