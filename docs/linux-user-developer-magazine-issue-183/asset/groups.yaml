- md: "\n# Tutorial\n\n# Essential Linux commands and scripting\n\nPART TWO\n\n##\
    \ Master shell scripting: program constructs\n\nBash scripting provides conditionals,\
    \ loops and functions that you can use to create powerful scripts.\n\nNow we are\
    \ writing some shell scripts, which is start of thinking about Bash as a language.\
    \ Unlike many languages, such as Python and Java, Bash REPL entry points allow\
    \ you to interpret commands in real time. In the same way, the command line takes\
    \ the role of a REPL for shell scripting: when you are writing a script, you can\
    \ try commands at the command line without copying them into your script.\n\n\
    Bash scripting is a surprisingly full featured tool. We'll learn conditionals,\
    \ loops and functions which behave as they do in other languages. We'll also see\
    \ shell scripting variables and learn how to refer to these arguments inside scripts.\n\
    \nUsing these tools and the commands we've learned, you'll start writing your\
    \ own scripts to automate repetitive tasks. Although it takes more time than it\
    \ saves, as you become a more productive Linux user.\n\nIn Bash scripts, any line\
    \ that has the hash # is treated as a comment and is not executed.\n\nThe shebang\
    \ #!/bin/bash is an example of a comment: it is used to determine which program\
    \ to run the script, but the initial # ensures that it is not executed when the\
    \ script is passed to Bash.\n\nThe simplest programming construct is the conditional\
    \ statement if. Bash makes a conditional available with a syntax similar to that\
    \ found in other languages. For example, here is a small script that checks if\
    \ a directory exists:\n\n```bash\n#!/bin/bash\nif [ $(ls -1) -gt 10 ]; then\n\t\
    echo \"too many files in the working directory\"\nelse\n\techo \"ten or fewer\
    \ files in the working directory\"\nfi\n```\n\nThe general syntax is as follows:\
    \ start with if, followed by the condition in square brackets [ [ ].\n\n```bash\n\
    #!/bin/bash\n\n# check for argument\nif [ $# -ne 1 ] || [ \"$1\" = \"dev/null\"\
    \ ]; then\n  echo \"argument is required\"\n  exit 1\nfi\n\n# check if file exists\n\
    IFS=$IFS\nif [ -f \"$1\" ]; then\n  FILE=\"$1\"\nelse\n  echo \"file not found\"\
    \n  exit 1\nfi\nIFS=$IFS\n\n# read file content\nwhile IFS= read -r line; do\n\
    \  if [[ \"$line\" != \"#\"* ]]; then\n    echo \"$line\"\n  fi\ndone < \"$FILE\"\
    \n```\n\n# John Gowers\n\nis a university tutor in Programming and Computer Science.\
    \ He likes to install Linux on every device he can and uses terminals and command-lines\
    \ on a daily basis.\n\n# Resources\n\n- A terminal running the Bash shell (on\
    \ Linux distro)\n\nTutorial files available:\nfiles.co.uk\n\n## Conditional expression\n\
    \n# Returns true if\n\n```\n[[ num1 -eq num2 ]]\n```\n```\nnum1 and num2 are equal\n\
    ```\n\n```\n[[ num1 -ne num2 ]]\n```\n```\nnum1 and num2 are not equal\n```\n\n\
    ```\n[[ num1 -lt num2 ]]\n```\n```\nnum1 is less than num2\n```\n\n```\n[[ num1\
    \ -le num2 ]]\n```\n```\nnum1 is less than or equal to num2\n```\n\n```\n[[ num1\
    \ -gt num2 ]]\n```\n```\nnum1 is greater than num2\n```\n\n```\n[[ str1 -ge num2\
    \ ]]\n```\n```\nstr1 is greater than or equal to num2\n```\n\n```\n[[ str1 = str2\
    \ ]]\n```\n```\nstr1 is the same as str2\n```\n\n```\n[[ str1 != str2 ]]\n```\n\
    ```\nstr1 is different from str2\n```\n\nAbove Bash's if provides many comparison\
    \ operators, follow with else commands and finish the block with fi. if we want\
    \ to add additional branches (corresponding to the else if construct from others),\
    \ then use the keyword.\n\n> Most languages provide a simple-for-loop, and Bash\
    \ scripting is no exception.\n\n```bash\n#!/bin/bash\nnumber_files=$($1 | wc -l)\n\
    if [ \"$number_files\" -gt 100 ]; then\n  echo \"ten more files in the working\
    \ directory\"\nelif [ \"$number_files\" -gt 10 ]; then\n  echo \"10 more files\
    \ in the working directory\"\nelse\n  echo \"ten fewer files in the working directory\"\
    \nfi\n```\n\nAs with assignment, the use of Spaces is important when writing conditions;\
    \ you must leave a space after the opening and before the closing )) or the script\
    \ will not work. Similarly, it is important to include the keyword after each\
    \ if or elif (but not the else clause); otherwise, you will get a syntax error.\n\
    \n# for loops\n\nMost languages provide a simple-for-loop, and Bash scripting\
    \ is not. The basic operation of a for-loop in Bash is to repeat through a sequence\
    \ of:\n\n```bash\nfor s in list\necho $s\ndone\n```\n\nHere, the first line set\
    \ the variable s to execute each of the strings, it is best and in then executing\
    \ the body of the loop (between do and done) each time that particular value of\
    \ s. This might not seem very useful on its own, but we can combine it with globbing,\
    \ the results can be powerful for.\n\nThe operator -gt stands for 'greater than'\
    \ and can be used to compare integers. For example, if [[ -f name ]] tests if\
    \ a file name exists in the working directory, or if [[ -d name ]] tests if the\
    \ file called name is a directory. \n\nYou can combine conditions using the AND-&&\
    \ or OR operator || just as in other languages, e.g.:\n\n# Essential Linux\n\n\
    ## Command-line options\nYou might want your script to accept command-line switches,\
    \ which commands do (e.g., -n name). A command specifically for this purpose,\
    \ getopt can optionally parse switches into a separate variable. You can find\
    \ out more by typing `getopt --help`.\n\n```bash\n#!/bin/bash\nfor i in ./*\n\
    \  if [ -d \"$i\" -a -n \"$i\" ]; then\n    number_of_files=$(ls \"$i\" | wc -l)\n\
    \    if [ \"$number_of_files -gt 10 ]; then\n      echo \"$i contains $number_of_files\
    \ files\"\n    fi\n  fi\ndone\n```\n*Figure 2\n\n## Shell parameters\nAs we saw\
    \ at the start of this series, commands can be passed any value after the name\
    \ of the command. For example, we can use `ls` to set the directory to `/usr/bin`.\
    \ A script can be taken with an arbitrary number of parameters at the command\
    \ line and referred to them within the script. We refer to parameters using variables\
    \ $1, $2, $3 and so on. For example, define `reverse.sh`:\n\n```bash\n#!/bin/bash\n\
    echo \"$3\"\necho \"$2\"\necho \"$1\"\n```\n\n### Using Bash's for loop in conjunction\
    \ with globbing\nUsing the for-loop in conjunction with globbing allows us to\
    \ iterate over the directories. Example, we want to get a list of the directories\
    \ in the working directory containing more than ten files, see Figure 2. A variation\
    \ of this technique allows for for-loop iteration which is more similar to what\
    \ is found in other languages such as C.\n\n```bash\nfor i in (1..3)\ndo\n  echo\
    \ \"$i. Hello, world\"\n  1. Hello, world!\n  2. Hello, world!\n  3. Hello, world!\n\
    done\n```\nRun `./reverse.sh` to make the script execute, you can run:\n\n```bash\n\
    # reverse sh\n# other way\n```\n\nIf you need to deal with more than one command\
    \ line arguments to your scripts, you will need to use unlimited number of arguments.\
    \ You might want to write a script that can take an arbitrary number of arguments.\
    \ One way to deal with this is to use the variable for all command line arguments.\
    \ You should always include variable in double quotes - \"$@\"; this will\n\n\
    ```bash\nfor arg in \"$@\"\ndo\n  result=\"$arg\"\ndone\necho \"$result\"\n```\n\
    \n> No programming language would be complete without notion of functions\n\n\
    ```bash\nfor i in (1..end) # Doesn't work as expected.\n```\n\nA more powerful\
    \ alternate mimics the syntax of languages like C, C++ and Java:\n\n```bash\n\
    start=4\nend=12\njump=4\n\nfor ((i=$start; i <= $end; i += $jump))\ndo\n  echo\
    \ $i\ndone\n4\n8\n12\n```\n\nIf you are unfamiliar with the C for-loop, this loop\
    \ initializes the counter variable i to 4, and repeatedly performs a test to see\
    \ if i less\n\nwill wrap each individual argument in double quotes, ensuring that\
    \ each is treated correctly.\nFor example, if we wanted to modify our reverse.sh\
    \ script to take an arbitrary number of arguments, rather than just three, we\
    \ could do so by using the following code:\n\nHere, we are using a for loop to\
    \ iterate through the list\n"
  mdcn: "\n\n# 教程\n\n# 核心 Linux 命令与脚本\n\n第二部分\n\n## 精通 Shell 脚本：程序结构\n\nBash 脚本提供了条件判断、循环和函数，你可以用它们创建强大的脚本。\n\
    \n现在我们开始编写一些 shell 脚本，这是将 Bash 视为一门语言的开始。与 Python 和 Java 等许多语言不同，Bash 的 REPL 入口允许你实时解释命令。同样，命令行也充当了\
    \ shell 脚本的 REPL 角色：当你编写脚本时，可以在命令行中尝试命令，而无需将它们复制到脚本中。\n\nBash 脚本是一个功能出奇完备的工具。我们将学习条件判断、循环和函数，它们的行为与其他语言是相似的。我们还将看到\
    \ shell 脚本变量，并学习如何在脚本内部引用这些参数。\n\n通过这些工具和我们学到的命令，你将开始编写自己的脚本来自动化重复性任务。虽然这花费的时间可能比节省的要多，但你将成为一个更高效的\
    \ Linux 用户。\n\n在 Bash 脚本中，任何包含井号 `#` 的行都被视为注释且不会执行。\n\nshebang `#!/bin/bash` 是注释的一个示例：它用于确定运行脚本的程序，但开头的\
    \ `#` 确保了当脚本传递给 Bash 时它不会被执行。\n\n最简单的编程结构是条件语句 `if`。Bash 提供的条件判断语法与其他语言中的语法相似。例如，这里有一个检查目录是否存在的小脚本：\n\
    \n```bash\n#!/bin/bash\nif [ $(ls -1) -gt 10 ]; then\n\techo \"too many files\
    \ in the working directory\"\nelse\n\techo \"ten or fewer files in the working\
    \ directory\"\nfi\n```\n\n通用语法如下：以 `if` 开始，后面跟着方括号 `[ [ ]` 内的条件。\n\n```bash\n\
    #!/bin/bash\n\n# 检查参数\nif [ $# -ne 1 ] || [ \"$1\" = \"dev/null\" ]; then\n  echo\
    \ \"argument is required\"\n  exit 1\nfi\n\n# 检查文件是否存在\nIFS=$IFS\nif [ -f \"$1\"\
    \ ]; then\n  FILE=\"$1\"\nelse\n  echo \"file not found\"\n  exit 1\nfi\nIFS=$IFS\n\
    \n# 读取文件内容\nwhile IFS= read -r line; do\n  if [[ \"$line\" != \"#\"* ]]; then\n\
    \    echo \"$line\"\n  fi\ndone < \"$FILE\"\n```\n\n# John Gowers\n\n是编程与计算机科学的大学导师。他喜欢在每一个能用的设备上安装\
    \ Linux，并每天使用终端和命令行。\n\n# 资源\n\n- 运行运行 Bash shell 的终端（在 Linux 发行版上）\n\n可用的教程文件：\n\
    files.co.uk\n\n## 条件表达式\n\n# 如果返回真，如果\n\n```\n[[ num1 -eq num2 ]]\n```\n```\n\
    num1 和 num2 相等\n```\n\n```\n[[ num1 -ne num2 ]]\n```\n```\nnum1 和 num2 不相等\n```\n\
    \n```\n[[ num1 -lt num2 ]]\n```\n```\nnum1 小于 num2\n```\n\n```\n[[ num1 -le num2\
    \ ]]\n```\n```\nnum1 小于等于 num2\n```\n\n```\n[[ num1 -gt num2 ]]\n```\n```\nnum1\
    \ 大于 num2\n```\n\n```\n[[ str1 -ge num2 ]]\n```\n```\nstr1 大于等于 num2\n```\n\n\
    ```\n[[ str1 = str2 ]]\n```\n```\nstr1 与 str2 相同\n```\n\n```\n[[ str1 != str2\
    \ ]]\n```\n```\nstr1 与 str2 不同\n```\n\nBash 的 `if` 提供了许多比较运算符，后跟 `else` 命令并用 `fi`\
    \ 结束代码块。如果我们想添加额外的分支（对应其他语言中的 `else if` 结构），则使用关键字。\n\n> 大多数语言都提供简单的 `for` 循环，Bash\
    \ 脚本也不例外。\n\n```bash\n#!/bin/bash\nnumber_files=$($1 | wc -l)\nif [ \"$number_files\"\
    \ -gt 100 ]; then\n  echo \"ten more files in the working directory\"\nelif [\
    \ \"$number_files\" -gt 10 ]; then\n  echo \"10 more files in the working directory\"\
