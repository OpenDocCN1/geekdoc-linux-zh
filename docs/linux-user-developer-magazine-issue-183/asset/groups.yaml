    继续向上游提交 LLVM 补丁，目标是让 Linux 内核支持 AVL。我们在这样做时考虑了 GCC 的首次分配。为了这一点，Matthias Kecke
    发布了针对 LTS 内核 4 和 9 的更新（针对刚发布的 Android One 的最低要求），他们正在处理厂商树。


    Jérôme Gisele 制作了第 25 版本的 HMM（异构内存管理）补丁。这些补丁巧妙地增加了设备（GPU、PGA）与主机及 CPU 栈之间的指针和内存共享，这以前通过共享内存设备是无法实现的。这些补丁需要更复杂的设备（例如当前可以使用自己的页表并在访问项时触发的
    Mali 和 Mellanon GPU）。


    Jérôme 引入了一种新类型的 ZMM：现有的迁移支持，让内存中的页被设备使用（就像被交换出去一样）。使用 CPU 的应用程序将透明地导致页错误并获取共享数据的副本。


    Matthew Garrett 发布了一个名为“启用重置迁移”的补丁，这是可信计算组织（TCG）定义的机制，让操作系统“请求固件在重置后清除所有 RAM”。这在启动时进行；目标是防止在启动和根目录之间可能存在的内存密钥泄漏。


    最后，人们注意到 KVM 最近的变化破坏了对旧 Intel Xeon CPU 的支持。如果你有这样的操作系统，开发者们希望听到你的反馈，如果你仍然想运行虚拟机。

