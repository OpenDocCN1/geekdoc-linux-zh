    CVE-2016-5195 的漏洞。此 CVE 被称为 Dirty COW 漏洞。


    通过使用 Dirty COW，可以在已 root 的沙箱中运行 ''File Tail'' 二进制文件。这允许你将恶意的 ELF 二进制文件作为库执行。


    无论如何，此应用已被修改为使用 Dirty COW。反编译应用并钩持 `Activity.onCreate()` 方法。通过这样做，会出现大量额外的指令，然后你就能看到一些恶意代码的执行路径。不要忘记移除
    hello-world-trojan.apk。接下来，执行应用，你将发现它确实起作用。之后，你可以对原始的 hello-world.app 执行相同的任务。Dirty
    COW 漏洞已被成功利用。


    已 root 的二进制文件 /system/xbin/librank 带有参数：run --line 10。要在 adb 会话中执行此：添加 shell /system/xbin/librank。你将获得一个
    root shell。


    所以，到目前为止 HelloWorld 应用很容易分析，因为它非常小；只有几行代码。每当处理真实应用时，你将尽可能地需要帮助。除了 AndroidGUI (http://androidgui.org/)
    等工具，还有几个强大的工具可以为你完成很多任务：逆向工程、通过动态分析对 APK 进行去混淆以及自动化工具。还有一个很有名的 Android root 应用叫
    HackMe (www.hackypick.hk)。它出厂自带了一些用于 ID JX5780 所需的工具。这个工具有很多内容要说：/mara.sha $hackypick.apk。入口加载可能需要一段时间。当被问及要反编译应用时，输入
    ''np''；Android 解密（Android Decrypt）只需让你寻找 1M。当被问及钩持控制流图时，输入 ''w''。终端中的所有结果都在 data/hackypick.apk。


