    # 我们接下来需要什么样的具有启感的来源？

    请将您喜爱的项目发送邮件至 linuxuxer@futurenet.com


    # 正在改变我们世界的灵感源


    ![](img/69deeba7290e54cc2d9b0be00f232820_32_0.png)


    # KOLIBRI 的开源层


    | 前端 | 后端 |

    |---|---|

    | Vue.js JavaScript 框架 https://vuejs.org | Django Web 框架 https://www.djangoproject.com
    |

    | Keen UI UI 层 https://github.com/JosephusP/KeenUI | Django 库，例如 REST framework
    https://www.django-framework.org |

    | PyCSS 响应式 CSS 模块 https://https.io/ | SQLite 数据库 https://www.sqlite.org |

    | Material Design 图标集 http://bit.ly/MaterialIcons | Python Kolibri 使用 Python 编写
    https://www.python.org |


    **以上**的 Kolibri 目前处于演示阶段，但将在秋季发布


    设备无需任何互联网连接即可连接到本地服务器。Alexandre 拥有认知科学背景，拥有加州大学的博士学位。在他博士期间的第一年，他对人类学习理论感兴趣，但随后转向了更具积极性的语言学习应用开发，然后他有机会在可汗学院（www.khanacademy.org）作为一个软件开发项目度过了一个夏天。


    “我想进入他们在技术领域正在兴起的地方，我想学习并应用我的一些技术，”Alexandre 说，“正如我在他们核心平台上所做的一切一样，但我看到了正在开发的材料，即这些新的教学理念以及支持学生和老师的新方法。”


    在一个完美的环境下，树莓派的推出并开启了 Alexandre 对可能性的想象：“我和另一个人盯着它看了一整天；而这里可汗学院，这些就是我们制作的全部内容”


    ## 其他客户可以在不需要任何互联网连接的情况下连接到本地服务器


    材料，实际上，这是一种低成本、低功耗的设备，可以在互联网限制、连接性或电力有限的各种语境下使用。我们看到了在可汗学院所面临的成本问题，我们可以将其压缩到那台树莓派中，也许这就是将其带给那些可以在设备上使用的人的机会。


    但很明显，树莓派将是某些安装方案的答案，因为世界上大多数地区需要一种可以在设备上使用的离线解决方案：“2012年，世界的一半地区仍然离线状态，”Alexandre
    说，“所以 KA Lite 最初只是一个黑客行为，一个晚上的产物，然后我们”


    它有多许多开源层。在 Keen UI 的情况下，Learning Equality 与开发者 Josephus P II 合作——他来自澳大利亚新加里多尼亚的构建，并由基金会资助。Cherry充当
    Web 服务器来托管 Django 应用和多线程服务器。我们使用该框架显示相同的移动响应式 Web 界面，无需连接到“服务器”。


    - 用于 Python Android 的 Kivy https://kivy.org

    - 前端系统，例如 Requests & JS http://reqs.org & https://github.com/websocket/githubio

    - Cherry 极简 Python Web 框架 https://cherry.py


    向我推广了我，当时非常兴奋，然后我必须回到学校，因为我还在读博士学位。这就是 KA Lite 的开始。KA Lite 可以访问各种内容，例如实操练习和教学视频。KA
    Lite 的初始版本是


    ![](img/69deeba7290e54cc2d9b0be00f232820_32_1.png)


    # 灵感OS


    ### 快速事实

    Learning Equality 的第一个平台 KA Lite 在六个月内安装于 60 个国家，现在已覆盖 175 个国家和地区，估计有 450 万学习者。


    ![](img/69deeba7290e54cc2d9b0be00f232820_33_0.png)


    Alexandre Shen 在 2012 年12 月在 Reddit 上宣布。Alexandre 觉得 KA Lite 会获得一些初步兴趣，也许会有想要合作的人，“但事实证明，人们开始在世界范围内部署它，”Alexandre
    说，可汗学院与该项目联系了起来并产生了雪球效应（在 https://learningequality.org/ 的交互式地图上）。


