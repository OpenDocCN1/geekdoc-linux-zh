  mdcn: '


    # 纯主义


    在今年的 GUADEC（GNOME 大会）上，我们开始问他：这为什么重要？


    “数字权利应该反映物理权利，”Weaver 告诉我们，“现在的趋势是更多的数据收集和更多的企业监控，尤其是在移动设备上。这种趋势正处于最糟糕的状态。我们需要一种能够保护消费者数字权利的产品——以及为了与软件协同工作而打造的硬件。”


    他强调了通过用户控制来提升自由的深度，并将自由基金会（Free Foundation）的原则引入硬件，但 Weaver 表示，他们正在更进了一步，“‘便利性’可不是（两个重要的词）。”


    因此，为什么 GNOME 7 将其视为一个结合了极佳外观和优秀性能的自由软件产品——但特别突出了“通过应用隔离提供卓越安全性，为个人提供隐私，并尊重数字权利（这是自由软件）”。


    Purism 的 GNOME 5 也将允许我们通过 Librem 5 使用手机，虽然许多用户购买它是为了“端到端加密通信”，或者为了逃离现有双垄头的围墙花园，但许多用户正期待一个可以连接在家里、配备大屏幕和键盘的安全设备——而基础套包是众筹页面最受欢迎的选项之一。


    # 父母的选择


    随着两款标记在特定价格位的笔记本电脑销量增加，以吸引 GNOME/Linux 用户之外的群体，Weaver 被问及：“我们想知道他的客户是谁”


    “自由软件支持者和 GNOME/Linux 用户，甚至是他们自己，”他回答道，“但这些主要用户是——具有安全意识的 CTO、CIO 和企业高管。以及为了隐私给孩子购买电脑的父母。”


    从用户反馈来看，最近发布的勒索软件攻击和 Vault 7 事件让每个客户心头都留下了忧虑：“我给女儿买了一台，现在面对可能发生的事情，我放心了，因为他们受到了保护。”


    除了具有安全意识的 CTO 和 CIO 之外，Weaver 表示，从他们的开发者那里，他们对“高净值人士也很有兴趣，他们想要安全、自由和风格——是我们需要的最大群体，而且我们发现
    Librem 在自由开发者中口碑良好”。


    -ThinPad，尽管这种外型意味着没有机械键盘。我们认为 Librem 在 p54 上的表现令人印象深刻，近乎“ThinPad 的质量”。


    Weaver 关注所有设备的硬件质量：耐用的合链、未安装在主板上的 p5 滚轴连接器，以及默认配置。回到受欢迎的 Linux 用户身上，我们问这些父母是如何听说
    Purism 的？


    Weaver 提到他在 TechCrunch 和其他受关注的媒体中提到过，仅仅是简单的口碑传播。CTO 和 CIO 需要在社交问题中被问到：“我应该为孩子寻找什么样的笔记本电脑？这是什么。”许多人已经触达到了“下一阶段的受众”，因为他们可以作为“安全且便利”的选择被推荐。


    这在 Pow Browser 中最为显而易见——它是集成了 Mozilla 专注于安全的插件（如 Privacy Badger）并解锁防止追踪的 Firefox。尽管
    GNOME 自己的浏览器——GNOME Web（以前称为 Epiphany）对于消息、视频通话、浏览器是免费的；所有其他功能稍后提供——尽管 PureOS
    允许我们在“完整的自由软件栈”中添加任何我们想要的内容，并且通过 USB-Type，Weaver 表示这是一种“融合”。


    GNOME 聊天中的另一部分也起了作用，因为 Weaver 的安全通信功能使用了 Matrix.org，它汇聚了我们拥许多通信手段。我们拥有这个和那个，这种未来属性可能更适合消费者通信的开发。


    # 特洛伊式的自由


    我们问 Weaver 这种对安全的关注是否想要将自由软件带入人们的设备？“这不是偶然，”Weaver 补充道，“安全是市场非常想要的，而我们需要从自由中寻求任何创意来解决这个问题。例如，基于安卓（带有其专有组件）的‘推出隐私手机’并没有深度的信誉可言。我们尽可能深入堆栈深层——我们比任何人都钻得深。唯一具有任何信誉的方法就是自由软件。”


    我们问及了尝试将自由软件带入设备中的痛点。


    '
