    \n# MOBILE DEVELOPMENT\n\n## Purism confirms Linux smartphone\n\nEncrypted calls\
    \ for Linux-based smartphones are a key feature of security-focused handset\n\n\
    The tale of Linux-based smartphones is not a happy one. While Android might be\
    \ based on the Linux kernel, the libraries and almost everything else is different.\
    \ It's easy to port an application to a Linux smartphone, but this is overly simplistic.\
    \ After all, there's very little that is open source in the latest Samsung handsets.\n\
    \nFollowing the unprecedented freedom of the mobile space, Social Purpose Purism\
    \ Corporation is launching its new Linux-based phone, which is better than the\
    \ Librem 5 that Purism will deliver next year.\n\nLaunched through a crowdfunding\
    \ campaign (with a $1.5 million funding goal) at Purism.com, the Librem 5 will\
    \ be fully declassified, encrypted by design; Purism's Pro63 will be preloaded,\
    \ with convergence technology enabling the device to be truly secure.\n\nChatting\
    \ exclusively with LU, Purism chief told us that the Librem 5 is built from completely\
    \ free and open software, with decentralised IP-based communication, which offers\
