    Five PCs range from the Cern at £299 up to the heavy-duty Vulcan at £1299 – alongside
    a pair of all-in-one desktops at £699. All are available in various configurations
    and can be built with the preferred CPU, RAM, storage, graphics card and operating
    system within elegant chassis and backlit keyboards, multi-touch tracks and USB
    3.0 ports. These devices are designed by Nimbusisoft using high-quality hardware
    designs.


