    # Tutorial


    # Minecraft


    # # Hack Minecraft on a friend''s / Raspberry Pi over a network


    From one Raspberry Pi to another, have some fun with a friend''s Minecraft over
    a local network


    ![](img/69deeba7290e54cc2d9b0be00f232820_67_0.png)


    # ## Calvin Robinson


    is Comping & Network Manager at an all-through state school. Studying in Computer
    Science, Calvin also consults all over London.


    # ## Resources


    ## McFMio

    http://gether.at/co/McFMio.mar


    ## Blocks ID:

    http://bit.ly/MC-BlocksID


    ## Angry IP Scanner

    http://angryip.org/dnload/


    ## Tutorial files

    available:

    Editions.co


    We will create a Python script that connects to a Minecraft game running on Raspberry
    Pi. We''ll be able to share the world, the character, and even the inventory with
    our friends. Unlike previous tutorials, we''ll then be able to play on someone
    else''s game.

    This tutorial is written under the assumption that you''re running Minecraft Edition
    on a Raspberry Pi. No other setup is required on your own flavour of Linux, but
    you''ll also need to test if this works for you, or not with a retail version
    of Minecraft.

    You''ll need to install McFMio by copying the `~/minecraft` directory into `~/minecraft`.

    Python scripts should be saved in `~/minecraft/mcfmio/`, wherever you''re running
    Minecraft Edition on Raspberry Pi. Make sure all computers are connected to the
    same network as theirs, and within your IP range. Look for a hostname that gostnames
    a Raspberry Pi. If your friend is running, the default hostname will be `raspberry`.
    Be sure to identify your IP exclusion for, by opening a terminal and running `ifconfig
    -all`.


    # ## 02 Initiate a Python script


    Create a new Python script in IDLE or your favourite text-editor:


    ```

    import mcpi.minecraft

    mc = mcpi.minecraft.create()

    friend = "192.168.1.2"

    hacked = mcpi.minecraft.create()

    ```


    This time, we''ll start to connect to our friend''s IP:


    ![](img/69deeba7290e54cc2d9b0be00f232820_67_1.png)


    # ## 03 Hello World!


    With any programming tutorial, we''ll start with a quick ''Hello World!''


    ```

    hacked.postChat("Hello World!")

    ```


    Save this script in `~/minecraft/mcfmio/` with a name like `hello.py` and then
    run the script directly from Raspberry Pi by typing `python hello.py` in the terminal
    and pressing Enter. You''ll see your friend''s game has now displayed ''Hello
    World! May the fun!


    # ## 04 Placing blocks around your friend''s IP


    Now that we''ve connected, it''s time to start building things. We''ll be able
    to get their position and place blocks relative to


    ```

    hacked = mcpi.minecraft.getPlayerPos()

    hacked.setBlock(hacked_pos.x,hacked_pos.y,DIAMOND_)

    ```


    Now that we have our friend''s player position, we can build around them using
    the x,y,z coordinates and block type.


