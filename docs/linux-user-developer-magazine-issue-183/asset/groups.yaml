    # Feature Ultimate Distros & Apps


    # BEST DISTRO FOR


    # ROLLING RELEASE


    Experience the best of openSUSE with instant updates courtesy of Tumbleweed


    # openSUSE Tumbleweed


    The majority of Linux distributions work on a fixed release. A cycle is released,
    it will receive updates for a period of time and after the release drops, work
    will begin on its successor. This works well for ensuring stability with beta
    and release candidates, but it adds an extra overhead for users as it is not the
    most popular rolling release. One of the most popular rolling Linux distributions
    is Arch Linux


    A rolling distribution delivers packages to users on a rolling basis, which means
    it is much more agile, potentially at the expense of ultimate stability. One of
    the most popular rolling Linux distributions is Arch Linux. The rolling release
    of openSUSE - Tumbleweed - brings the best of both worldsnThe openSUSE distro
    has NPM GNOME and KDE Plasma as default desktop environments. OpenSUSE allows
    you to select which one you''d like to use for your desktop something that will
    not break on other days. One of the most popular openSUSE features is the control
    centre, which is used for configuring the system as a whole, including package
    management. Underpin openSUSE is “Factory”, the continuous ongoing development
    platform


    for which regular openSUSE (Leap) releases are taken as snapshots. The tumbled
    rolling release receives updates as soon as they are integrated into Factory and
    tested.


    Should you consider using a rolling distribution if you are an advanced user and
    want to be on the bleeding edge? Yes, if you are comfortable making changes from
    the main Leap releases if your system is reliant on proprietary graphics drivers
    or third-party kernel modules which are not updated as swiftly as the latest kernel
    updates, other users may need to catch up the kernel before the rolling release
    version can be used but this is a potential pain point for less advanced users.
    For a stable rolling release, particularly because of its lack of drama, openSUSE
    is a great distro and Tumbleweed enhances the experience.


    ![](img/69deeba7290e54cc2d9b0be00f232820_25_0.png)


    # AT A GLANCE


    # Alternative distros


    Manjaro is based on Arch Linux and keeps its rolling release model, but with a
    more user-friendly approach.


    ![](img/69deeba7290e54cc2d9b0be00f232820_25_1.png)


    Gentoo''s system compiles locally as per user''s preferences and it''s distributed
    on a rolling basis via the ''emerge command''.


    ![](img/69deeba7290e54cc2d9b0be00f232820_25_2.png)


    Debian unstable (“sid”) isn''t always a rolling release, but it is if you know
    your way around Linux!


    ![](img/69deeba7290e54cc2d9b0be00f232820_25_3.png)


