    ## Geeko 之路


    SUSE 在 Linux 和开源软件领域拥有悠久的创新历史。在庆祝成立 25 周年之际，openSUSE 已经开始开发 Kubic 项目，这是一种由社区运营的集群计算、容器和微服务的新方法。


    > 现在是访谈 SUSE 并探索开源最新进展的绝佳时机，因为 openSUSE 在本月庆祝成立 25 周年。尽管公司一直向其自发行版 SUSE Linux
    Enterprise (SLES) 发布大量的向后兼容更新，但自 2004 年首次鼓励新的 openSUSE 项目以来，就再没有过这种操作了。自从 Tumbleweed
    滚动更新发行版及其稳定可靠的发布出现以来，该项目一直推动着 SLES 的发展。在这次采访中，我们主要询问了 openSUSE 主席 Richard Brown
    关于 Kubic 的问题，它真正拥抱了开放和自由的“核心”开源原则，社区可以设定自己的方向，且社区成员必须保持一致并共同工作。


    最近，SUSE 与 SAP HANA 的合作确实扩展了 Linux 在企业级硬件上的功能范围以及对内存数据库的支持。（据我所知，目前还有默认的 Btrfs，这是
    2017 年以来第一个默认“下一代文件系统”的主要 Linux 发行版。这非常符合 SUSE 在文件系统选择上领先以及支持 XFS 以获得长期利益的传统。Debian
    也支持它，但对于选择使用该系统的用户来说，SUSE Tumbleweed 在这方面具有明显优势。）


    Richard Brown 在 SUSE 担任 Linux 发行版工程师，并将从 9 月起负责 Kubic 的工作。Richard 也是 openSUSE
    项目的主席。


    **SUSE 本月庆祝成立 25 周年，SUSE 历史中让 GNU/Linux 社区受益的关键时刻有哪些？**


    追溯到 1994 年，SUSE 是发布“第一个企业级 Linux”的公司，这是针对 IBM S390 的第一个商业级 Linux。从同年起，SUSE 就开始与
    AMD 合作进行大量初始工作，将 Linux 移植到 SPARC 架构。虽然显然带有主观性，但我认为 openSUSE 在 2004 年的值得提及，因为它代表了与许多其他企业创立的社区完全不同的模型。


    **你把 Tumbleweed 描述为“运行滚动发布的最好的方式——那么有什么让你感到兴奋的进展吗？”**


    我一直对 Tumbleweed 感到兴奋，因为我是滚动发布模型的坚实支持者。除了加入 Tumbleweed 项目外，我非常期待看到该发行版如何处理内核的快速更新，这种变化速度是其他发行版可能需要一两年才能完成的，而且大型软件栈（Gnome
    和 KDE）的升级通常在上游发布后几小时内就能完成。这一切都是在没有任何重大版本发布的情况下实现的——而这是我所有日常工作的唯一依据。


    目前，我期待 GCC 7.2 作为 Tumbleweed 的默认编译器与 Glibc 2.26 一起上线。这将对系统产生极其巨大的影响，并真实地证明了我们的流程是可信赖的。


    以下是 SUSE 新的 Kubic 项目专注于容器技术及相关工具。


    ![](img/69deeba7290e54cc2d9b0be00f232820_11_0.png)


    **什么是 Kubic 项目？** Kubic 是更广泛的 openSUSE 项目中的“伞型项目”，专注于容器技术和相关工具，以提供“容器即服务”平台。详细而言，


    ## 核心业务


    Btrfs —— 发音为 ''butter-fs''，来自某些 CoW（写时复制）人士——受到了社区中活跃分子的批评，但随着 Red Hat 决定在 Red
    Hat Enterprise Linux 7 (RHEL) 中弃用该文件系统，人们对此感到有趣。这让 SUSE 企业产品管理经理 Matthias Eckermann
    怀疑 SUSE 的未来是否稳妥。简而言之：并不乐观。或者用 Eckermann 的话：“如果 Btrfs 文件系统的较小贡献者之一不采用 Btrfs 用于生产环境……”


    Eckermann 也对未来的功能以及加密的发展表示警惕，这使得数据压缩在涉及嵌入式系统方面成为一个“有趣的选择”，这归功于 Btrfs。Btrfs 开源了
    listdio（或 zstd - 一个不幸的缩写），现在已将其列入 Linux 4.1 内核的 Btrfs 队列，其性能令人印象，在所有压缩级别上都胜过 zstd。


    在我们继续使用 Btrfs 的同时，Red Hat 已采用 Stratis 项目作为下一代策略。Andy Gray 在一份白皮书（http://bit.ly/StratisSoftwareDesign）中指出，通过努力，Stratis
    加上基于 LVM [2.1] “构建”的 ZFS 文件系统是可能的。


