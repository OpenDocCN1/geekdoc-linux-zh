    \ | 12 Interview | 12 Kernel Column\n\n# SMALL COMPUTER\n\n## Raspberry Pi gets\
    \ Raspberry Stretch\n\nFollowing the launch of Debian, Raspberry Stretch-in-via\
    \ workplaces embracing open source, and the Raspberry Pi — there are increasing\
    \ number of users who are unaware of the risks. The scammers have put the effort\
    \ into producing a Linux attack, after all.\n\nThe simplest way to avoid this\
    \ attack is to ignore the message. If you clicked, it likely requires repair to\
    \ add Pi. If you're already infected, or know who is is, the steps to help, then:\n\
    \nTroubleshooting Firefox: use the 'Refresh' button to reset the browser and remove\
    \ any add-ons.\n\nBluetooth support for audio devices has flipped from PulseAudio,\
    \ in favour of ALSA. To this end, the bluetooth also included in Raspberry Stretch,\
    \ which should give better results. PulseAudio can still be installed.\nAlso the\
    \ update username handling has been improved. Now, applications will not assume\
    \ that pi is the default user and run into problems when this is not the case.\
    \ sudo has been similarly improved.\n\n# SECURITY\n\n## Virus spreading via Facebook\
    \ Messenger\n\nCross-platform malware hides in video links\n\nCross-platform users\
