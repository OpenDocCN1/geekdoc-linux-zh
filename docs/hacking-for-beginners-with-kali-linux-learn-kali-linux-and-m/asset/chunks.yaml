    # Uninstall and clear the package configuration


    Uninstall the `apt-file` software.


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get remove apt-file

    ```


    Seeing the above output information, it means that the `apt-file` software has
    been successfully uninstalled.


    ## Install virtual machine enhancement tools


    In order to facilitate the copying of files between the physical machine and the
    virtual machine, a virtual machine enhancement tool needs to be installed. `open-vm-tools`
    is an enhanced tool for VMware virtual machines. It provides VMware drivers to
    enhance the performance of virtual graphics and hard disks, as well as to synchronise
    the clocks of the virtual machine and the host. Only when the `open-vm-tools`
    tool is installed in the VMware virtual machine can the file sharing between the
    host and the virtual machine be realised, and the free drag and drop function
    can be supported. The mouse can also be moved freely between the virtual machine
    and the host (no Need to press `Ctrl+Alt` shortcut again).


    The following section describes how to install the virtual machine enhancement
    tool.


    ### Install open-vm-tools in Kali Linux


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get install open-vm-tools-desktop fuse

    ```


    After executing the above command, the `open-vm-tools` tool will be installed.
    After the installation is complete, restart the computer. After the computer restarts,
    users can move, copy, and paste files freely between the physical machine and
    the virtual machine.


    ## Chapter 7


    # Third party software Installation in Kali


    ![](images/00003.jpeg) ![](images/00002.jpeg)


    Kali Linux system installs a lot of penetration testing software by default. However,
    some penetration testing tools are not installed (such as Nessus) and need to
    be downloaded and installed from a third party. Generally, the software package
    formats obtained from third parties include `.deb`, `.tar.gz`, `.tar.bz2`, `.zip`,
    and `.rar`. In order to meet the needs of users, this section will introduce the
    installation methods of these format software packages.


    ### Install binary software


    The binary package contains programs that have been compiled and can be run immediately.
    The user only needs to download and unpack (install) it before it can be used.
    In Linux systems, binary software includes two formats, `RPM` and `DEB`. Among
    them, `RPM` is a package manager based on Red Hat''s Linux distribution with the
    suffix `.rpm` whereas `DEB` is a package manager based on Debian with the suffix
    `.deb`. Kali Linux is based on Debian, so its binary package format is `.deb`.
    The following section will introduce the method of installing binary packages
    in Kali Linux.


    The following section uses `Nessus` software as an example to introduce the installation
    method of the binary package.


    The specific steps are as follows:


    1) Download the binary package with the same architecture as your own operating
    system on the Nessus official website. Among them, the download address of Nessus
    is `https://www.tenable.com/downloads/nessus.`. In this example, the downloaded
    package is named `Nessus-8.3.1-debian6_amd64.deb`.


    2) Install `Nessus` tool.


    The execution command is as follows:


    ```

    root@exampleserver:～# dpkg -i Nessus-8.3.1-debian6_amd64.deb

    ```


    Seeing the above output information, it means that the `Nessus` tool has been
    successfully installed. Next, users can use the tool to perform vulnerability
    scanning.


    ### Install source package


    The source code package contains the original program code of the program, which
    needs to be compiled by the user to generate a runnable program. It takes longer
    to install software through source code. In Linux, the most common source code
    package formats are `.tar.gz` and `.tar.bz2`. The following section will introduce
    the installation methods of these two source code packages.


    If you want to install source code packages in `.tar.gz` and `.tar.bz2` formats,
    you need to use the `tar` command to decompress, and then configure, compile and
    install.


    The syntax format of decompressing the `.tar.gz` source package is as follows:


    ```

    tar zxvf source package file name [-C target directory]

    ```


    The syntax format for decompressing the `.tar.bz2` source package is as follows:


    ```

    tar jxvf source code package file name [-C target directory]

    ```


    In the above syntax, `[-C target directory]` is used to specify the decompression
    location of the source package. If not specified, it will decompress to the current
    directory by default.


    The following section will take the automated man-in-the-middle attack tool as
    an example to demonstrate the installation method of the `.tar.gz` format source
    package.


    The specific steps are as follows:


    1) Go to the website `http://code.google.com/p/subterfuge/downloads/list` to download
    the `Subterfuge` package. The package name is `subterfuge_packages.tar.gz`. Then,
    copy the downloaded package to the Kali system.


    2) Unzip the downloaded software package.


    The execution command is as follows:


    ```

    root@exampleserver:～# tar zxvf subterfuge_packages.tar.gz

    ```


    After successfully decompressing the `Subterfuge` package, all files will be decompressed
    into the `subterfuge` directory.


    3) Install the `Subterfuge` tool as follows:


    ```

    root@exampleserver:～# cd subterfuge/

    root@daxueba:～/subterfuge# python install.py

    ```


    After executing the above command, the interface will be displayed.


    4) Select the `Full Install With Dependencies` radio button in this interface,
    and then click the `Install` button to install. After the installation is complete,
    the interface with additional settings will be displayed.


    5) From this interface, you can see that a small dialog box pops up, showing that
    the `Subterfuge` installation is complete. At this point, click the `Finish` button
    to complete the installation.


    The following section will take the `Firefox` browser as an example to demonstrate
    the installation of the software package in the `.tar.bz2` package format.


    The specific steps are as follows:


    1) Download the Linux version of the `Firefox` browser software package.


    In this example, the downloaded package name is `Firefox-latest-x86_64.tar.bz2`.


    Tip: When downloading the `Firefox` browser software package, you must choose
    according to the user''s hardware architecture. In this example, the 64-bit architecture
    package is downloaded.


    2) Unzip the software package.


    The execution command is as follows:


    ```

    root@exampleserver:～# tar jxvf Firefox-latest-x86_64.tar.bz2-C /usr

    ```


    After executing the above command, all files in the `Firefox` software package
    will be decompressed to the `/usr` directory. Among them, the decompressed file
    name is `firefox`.


    3) Switch to the decompressed `firefox` directory and you will see an executable
    file named `firefox`.


    This executable file is used to start the `Firefox` browser. as follows:


    ```

    root@exampleserver:～# cd /usr/firefox/

    root@exampleserver:/usr/firefox

    ```


    From the results displayed above, you can see the executable file `firefox` is
    used to launch the browser.


    ### Executing the software


    When the user successfully installs the software into the system, the tool corresponding
    to the software can be started. Among them, some software can be started by command
    or graphical interface, and some software is started using the executable script.
    This section will introduce the startup methods of these two types of software
    respectively.


    #### General software


    Generally, the way to start common software is by using command line and graphical
    interface. In addition, the Kali Linux system also provides `Alt+F2` shortcut
    keys to open a command prompt dialog box. Users can enter any command to be executed
    in this dialog box.


    ##### a) Graphical interface mode


    The graphical interface method is to start through the menu command. The following
    section will take `Wireshark` software as an example to introduce its startup
    method.


    1) In the graphical interface, select `Applications`|`sniffing/spoofing`|`Wireshark`
    command in turn.

