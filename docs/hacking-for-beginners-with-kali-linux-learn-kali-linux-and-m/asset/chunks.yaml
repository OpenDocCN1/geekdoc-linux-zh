    ## 第 3 章


    # 在物理机上安装 Kali


    ![](img/00003.jpeg) ![](img/00002.jpeg)


    虽然虚拟机在行业内非常流行，但由于各种原因，大多数黑客仍然使用它们。显而易见，理解 Kali Linux 的物理机安装与理解虚拟机安装同样重要。这就是我们为了让你有更好的理解而专门包含了一个章节的原因。让我们开始学习吧。


    ### 为什么需要进行物理机安装？


    大多数用户觉得在虚拟机中的操作不够真实，而且有时在虚拟机中的操作并不顺畅。如果你想体验使用物理机实施渗透测试的感觉，你需要在物理机上安装 Kali Linux
    操作系统。要在物理机上安装操作系统，你需要提前准备安装介质并对硬盘进行分区。否则，由于操作错误可能会导致硬盘数据丢失。本节将介绍在物理机上安装操作系统的方法。


    ### 安装 Win32Disk Imager 工具


    Win32Disk Imager 工具主要用于将 ISO/img 文件写入 SD 卡或 U 盘。对于现在的大多数人来说，使用光驱安装系统的方法已很少使用。而且，现在的电脑基本上不再配有光驱。因此，使用
    U 盘安装操作系统是最方便、快捷的方法。如果你想用 U 盘安装系统，需要将 U 盘制作成安装启动盘。这时，你需要使用 Win32Disk Imager 工具来实现。该工具默认没有安装在系统中，因此你需要先安装该工具。下节将介绍具体的安装方法。


    *具体步骤如下：*


    1) 从网站 `https://sourceforge.net/projects/win32diskimager/` 下载软件包。软件包名为 `Win32DiskImager-1.0.0-install.exe`。


    2) 安装 Win32Disk Imager 工具。双击下载好的软件包，将显示许可协议对话框。


    3) 此对话框显示安装 Win32Disk Imager 工具的许可信息。选择“我接受协议”（I accept the agreement）单选按钮并点击“下一步”（Next）按钮。将显示选择目标安装位置的对话框。


    4) 此对话框用于选择 Win32Disk Imager 工具的安装位置。默认情况下，它将安装在 `C:\Program Files(x86)\ImageWriter`
    。如果用户想重新指定安装位置，需要点击浏览（Browser）按钮进行设置。然后，点击“下一步”（Next）按钮，将显示启动菜单文件夹的对话框。


    5) 此对话框用于设置启动菜单文件夹。在这里使用默认设置 Image Writer，点击“下一步”（Next）按钮，将显示选择额外任务的对话框。


    6) 在此对话框设置是否创建快捷方式。为了方便启动程序，建议用户创建快捷方式。勾选“创建快捷图标”（Create a shortcut icon）复选框并点击“下一步”（Next）按钮，将显示准备就绪的对话框。


    7) 此对话框显示之前设置的详细信息，准备好安装 Win32DiskImager。如果需要修改设置，可以点击“返回”（Back）按钮。否则，你需要点击“安装”（Install）按钮开始安装工具。安装完成后，将显示完成设置向导的对话框。


    8) 从此对话框中，可以看到 Win32Disk Imager 工具已安装。点击“完成”（Finish）按钮自动启动工具。如果用户不想直接启动工具，可以取消勾选“启动
    Win32DiskImager”（Launch Win32DiskImager）复选框。如果你勾选“查看 README.txt”（View README.txt）复选框，将打开
    README.txt 文件。该文件显示 Win32Disk Imager 工具的详细信息，如功能、架构描述、常见问题等。


    ### 制作 USB 安装启动盘


