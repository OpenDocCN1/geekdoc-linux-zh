    # Chapter 32


    # Control Meterpreter session


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    ## Control Meterpreter Session


    When a penetration tester uses a vulnerability to successfully penetrate the target
    system and obtain a Meterpreter session, he can use the Meterpreter command supported
    by the vulnerability module to control the Meterpreter session to obtain more
    information about the target host or control the target host, such as turning
    off antivirus Software, keyboard capture, screenshots, elevating permissions and
    creating accounts, etc. This section will take the Meterpreter session obtained
    in as an example to introduce controlling the Meterpreter session.


    ### Turn off antivirus software


    Under normal circumstances, users will install anti-virus software on their computers.
    In order to facilitate other operations, users can turn off anti-virus software.
    After the penetration tester gets the shell of the target host, he can use the
    `run killav` command to close the antivirus software of the target host.


    The command is as follows:


    ```

    meterpreter> run killav

    ```


    From the output information, we can see that the anti-virus service of the target
    host has been killed and the `cmd.exe` program has ended.


    ### Get detailed information about the target host


    In order to better understand the information of the target host, you can use
    the `sysinfo` command to view the system information of the target host.


    The execution command is as follows:


    ```

    meterpreter> sysinfo

    ```


    The detailed information of the target host can be seen from the output information.
    For example, the computer name is `WIN-TJUIK7N16BP`; the operating system type
    is Windows 2008 R2 (Build 7600); the architecture is `x64`, etc.


    Users can also use the `run scraper` command to view the detailed information
    of the target host, and then download and save it locally.


    The execution command is as follows:


    ```

    meterpreter> run scraper

    ```


    From the output information, you can see that the detailed information of the
    target host has been obtained. Moreover, the obtained information is downloaded
    and saved to the local `C:\Windows\TEMP` directory. This information is saved
    in the form of a Windows registry file.


    ### Check whether the target is running on a virtual machine


    Users can also check whether the target machine is running in a virtual machine.


    The execution command is as follows:


    ```

    meterpreter> run post/windows/gather/checkvm

    ```


    [＊] Checking if WIN-TJUIK7N16BP is a Virtual Machine .....

    [+] This is a VMware Virtual Machine


    From the output information, it can be seen that the target host is detected as
    a virtual machine. It can be explained that the target machine is running on a
    virtual machine.


    ### Access file system


    Meterpreter supports various file system commands, which are basically similar
    to Linux system commands. Now use these basic commands to access the file system
    of the target host, such as viewing the current directory, files in the current
    directory, and creating a directory.


    #### Access the file system of the target host.


    1) Use the `pwd` command to view the current directory.


    The execution command is as follows:


    ```

    meterpreter> pwd

    C:\Users\Public\Desktop

    ```


    From the output information, you can see that the current directory of the target
    host Shell is `C:\Users\Public\Desktop`.


    2) Use `ls` to view the files in the current directory.


    The execution command is as follows:


    ```

    meterpreter> ls

    Listing: C:\Users\Public\Desktop

    ```


    You can see from the output information that there is a file named `desktop.ini`
    in the current directory.


    3) Use the `rm` command to delete `desktop.iniDocuments`.


    Execute the following command:


    ```

    meterpreter > rm desktop.ini

    ```


    After executing the above command, no information will be output. At this point,
    you can review the list of files again to determine whether the file was successfully
    deleted. As follows:


    ```

    meterpreter > ls

    No entries exist in C:\ Users\Public\ Desktop

    ```


    As can be seen from the output information, there are no files in the current
    directory. This shows that the `desktop.ini` file was successfully deleted.


    4) Switch the working directory.


    The execution command is as follows:


    ```

    meterpreter > cd..

    ```


    After executing the above command, you will switch to the previous directory,
    namely `C:\ Users\ Public`. At this point, look again at the list of files in
    the current directory:


    All files in the current directory can be seen from the output information.


    5) Create a directory named `test`.


    The execution command is as follows:


    ```

    meterpreter > mkdir sample

    Creating directory: sample

    ```

