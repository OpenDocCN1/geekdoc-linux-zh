    ## Chapter 8


    # Driver Installation in Kali


    ![](images/00003.jpeg) ![](images/00002.jpeg)


    Drivers are special programs added to the operating system. The drivers contain
    information about the hardware device. This information enables the computer to
    communicate with the corresponding device. When a hardware device is added to
    the computer, the corresponding driver must be installed. Otherwise, the device
    cannot be used.


    For Kali Linux system, because the kernel of the system is relatively new, it
    can support most device drivers. However, for certain devices, sometimes users
    need to manually install drivers, such as graphics card drivers. This section
    will introduce how to view device driver information and install the driver.


    Tip: Because of the risk of installing the driver, it is recommended to back up
    important data before installation.


    ### View device


    Before installing the driver, the user can use the `lsusb` and `lspci` commands
    to view the detailed information of the USB or PCI device to determine whether
    the driver is correct. If it has started successfully, you need to install the
    driver. The following will introduce how to check whether the device is driven
    correctly.


    #### a) View USB devices


    When users implement wireless penetration testing, they usually need to use a
    wireless network card with a USB interface. When the user connects the device
    to the system, he can use the `lsusb` command to view the USB device list information
    to determine whether the device is correctly identified. as follows:


    ```bash

    root@exampleserver:～# lsusb

    ```


    The above output information shows the USB device list information in the current
    system. The above output information includes 3 parts, which are bus number, device
    number and manufacturer ID. By analyzing the manufacturer''s ID information of
    the device, it can be known that the device is a USB device with a model of Realtek
    Semiconductor Corp.


    The user can check the driver module of the device by using the `-v` option of
    the `lsusb` command to confirm whether the driver is correct. The following will
    introduce the use of `lsusb` command to view the detailed information of the USB
    device.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# lsusb -v Bus

    ```

