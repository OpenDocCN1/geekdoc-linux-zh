    \ software, execute the command as follows:\n\n```\nroot@exampleserver:～# apt-get\
    \ upgrade\n```\n\nAfter executing the above command, all software packages that\
    \ need to be upgraded in the current system will be upgraded.\n\n### Remove software\n\
    \nWhen the user does not need a certain software, it can be deleted.\n\nThe syntax\
    \ format used to delete software is as follows:\n\n```\napt-get remove [package_name]\n\
    ```\n\nor\n\n```\napt-get purge [package_name]\n```\n"
  raw: 'After the user configures the software source, he needs to use the apt-get
    update command to update the software source to make the configuration effective.
    Users can also update the system quickly by updating the software source.


    The following section will introduce the method of updating the software source
    and updating the system.


    *The execution command is as follows:*


    > root@exampleserver:～# apt-get update


    It can be seen from the above output that the software source has been successfully
    updated.


    The execution command is as follows:


    > root@exampleserver:～# apt-get dist-upgrade R


    The updated package information is displayed in the above output information,
    including the package to be upgraded, the newly installed package, and the uninstalled
    package. At this point, enter Y to continue the operation. If there is no error
    message during the subsequent operation, the system update will be successful.
    After the update is completed, restart the system, that is, reload the new system.


    Users can also use the graphical interface to update the operating system.


    The specific steps are as follows:


    1) Click the Show all programs button in the favorites on the left to open the
    interface of all programs, and click the "Software" button to display the dialog
    box.


    2) From the "Update (U)" tab of the dialog box, you can see that there is an update
    prompt. At this point, click the "Operating System Update" option to see the software
    package that needs to be updated.


    3) The software package to be updated is displayed in this interface. At this
    time, click the close button in the upper right corner to return to the software
    update dialog box . Then, click the "Download (D)" button to start downloading
    the updated software package. After the download is completed, the dialog box
    will be displayed.


    4) Click the "Restart and Update" button in the upper right corner, so that the
    "Restart and Install Update" dialog box will pop up.


    5) Click the "Restart and Install" button to restart the system and update the
    software package.


    6) This interface shows the update package being installed. After the update is
    completed, the system will automatically restart.


    **Install the software from the software source**


    After the user configures the software source, all the software provided in the
    software source can be installed. This section will introduce the software in
    the installation software source.


    *Confirm package name*


    When users install software, they need to know the package name. If you are not
    sure of its name, you can use several commands in Kali Linux to search for the
    package name.


    The method of confirming the package name is described below.


    ***What is a software package?***


    A software package refers to a program or a group of programs with specific functions
    to accomplish specific tasks. The software package consists of a basic component
    and several optional components, which can be in the form of source code or object
    code. In the Linux system, there are two main forms of software packages, namely
    binary packages and source code packages. Among them, the most common binary package
    formats are deb (Debian series) and rpm (Red Hat series). Source package formats
    are tar.gz, tar.bz2 and zip.


    ***Search software packages based on keywords***


    In Kali Linux, users can use the apt-cache command to search for software packages
    based on keywords.


    Among them, the syntax format of the command is as follows:


    > apt-cache search package_name


    Search the package name based on the keyword pm-.


    > root@exampleserver:～# apt-cache search "pm-" antpm-ANT


    From the output information, you can see that all packages containing the pm-
    keyword have been searched. In the above information, the package name and the
    function of the package are shown respectively. By analyzing the package information,
    the name of the installed package can be determined.


    ***Search for packages according to the command***


    Kali Linux provides a tool apt-file that can search for software packages based
    on commands. However, the tool is not installed by default. Therefore, you need
    to install it before using this tool.


    The execution command is as follows:


    > root@exampleserver:～# apt-get install apt-file


    After executing the above command, if no error is reported, the installation is
    successful. Next, you can use the tool to search for packages based on commands.


    Among them, the syntax format for searching software packages is as follows:


    > apt-file search [pattern]


    Search for the software package where the arpspoof command is located.


    > root@exampleserver:～# apt-file search arpspoof


    From the output information, you can see that the software package corresponding
    to the arpspoof tool is named dsniff.


    ***View the package structure***


    After the user installs a certain software, if you are not sure where the software
    package is installed, you can use the apt-file command to view the package structure.
    In addition, users can also confirm whether they have the software they need based
    on the included files.


    The syntax format for viewing the package structure is as follows:


    > apt-file list [pattern]


    View the dnsenum software package structure:


    > root@daxueba:～# apt-file list dnsenum


    From the output information, you can see the structure of the dnsenum package.
    From the displayed results, we can see that the startup file of the dnsenum tool
    is installed in the /usr/bin directory. We can also know that the help document
    is in the /usr/share/doc/dnsenum directory.


    ***Install/Update Software***


    When the user determines the name of the software package to be installed, the
    software can be installed. Moreover, if a software is already installed in the
    system, the user can also update it. The method of installing and updating software
    will be introduced below.


    ***1) Install the software***


    In Kali Linux, the apt-get install command is mainly used to install the software
    in the software source.


    Among them, the syntax format of the command is as follows:


    > apt-get install [packet_name]


    The following will take the StartDict software package as an example to introduce
    the software for installing the software source. StartDict is a well-known dictionary
    framework abroad, you can check the meaning of English words. Of course, users
    can also join the dictionary of domestic translation tools, such as Oxford dictionary.
    The dictionary framework is provided in the Kali Linux software source.


    The execution command is as follows:


    > root@exampleserver:～# apt-get install qstardict stardict-＊


    After executing the above command, if no error is reported, the StarDict tool
    is installed successfully. At this point, the user can copy the thesaurus files
    (.dict.dz, .dix, .ifo.syn) of other translation tools to the /usr/share/stardict/dic
    directory, and then you can use the tool.


    ***2) Update the software***


    If a certain software has been officially updated, but the old version is still
    used in Kali Linux, at this time, users can update it by reinstalling the software
    to experience the new features as soon as possible.


    For example, to update the wpscan tool, execute the command as follows:


    > root@exampleserver:～# apt-get install wpscan


    As can be seen from the above output information, 3 software packages have been
    upgraded. From the displayed results, we can see that the wpscan tool has been
    upgraded from the original version 3.4.3 to version 3.5.0.


    The above method is only to update a certain software separately.


    If the user wants to update all software, execute the command as follows:


    > root@exampleserver:～# apt-get upgrade


    After executing the above command, all software packages that need to be upgraded
    in the current system will be upgraded.


    ***Remove software***


    When the user does not need a certain software, it can be deleted.


    The syntax format used to delete software is as follows:


    > apt-get remove [package_name]


    /# uninstall the package


    or


    > apt-get purge [package_name]'
