    ## Chapter 23


    # Social Engineering Attacks


    ![](images/00007.jpeg) ![](images/00006.jpeg)


    Social engineering attacks mainly use people''s curiosity, trust, greed and some
    stupid mistakes to attack people''s own weaknesses. Kali Linux provides a social
    engineering tool set SET, which can be used to implement social engineering attacks.
    This section will introduce methods for implementing social engineering attacks.


    ### Start the social engineering toolkit-SET


    Social Engineering Toolkit-SET is an open source, Python-driven social engineering
    penetration testing tool. Using this toolkit, you can implement Web vector attacks
    and PowerShell attacks. The following section describes how to start the social
    engineering toolkit.


    *The specific steps are as follows:*


    1) Start SET.


    Execute the following commands in the terminal: ￼


    > root@exampleserver:～# setoolkit


    After executing the above command, the following information will be output: ￼


    > Do you agree to the terms of service [y/n]:


    The output information describes SET in detail. This information will only be
    displayed during the first run. After the interface accepts this part of the information,
    other operations can be performed. Enter y at this time, and the following information
    will be displayed: ￼


    Select from the menu:


