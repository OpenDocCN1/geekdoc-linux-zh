    正如在此界面所示，终端有两个标签页。通过点击标签，你可以切换你所处的终端窗口。


    ### 2) 查看目录


    当用户打开终端窗口时，他可以通过命令行管理文件。查看目录是最常见的操作，用于确定当前目录下包含的文件。使用 `ls` 命令查看当前目录下的所有文件。


    从此界面显示的结果中，你可以看到当前目录下的所有文件都已列出。


    ### 3) 切换目录


    切换目录也是最常见的操作。如果用户想要查看特定目录下的文件，他们需要切换到相应的目录。例如，使用 `cd` 命令切换到 `/etc` 目录，并使用 `pwd`
    命令查看当前工作目录。


    从输出结果观察到，你已成功切换到 `/etc` 目录。


    ### 4) 编辑文件


    编辑文件是一种用于操作文件内容的方法。例如，如果你想在终端中设置软件源，你需要编辑软件源文件。例如，你可以使用 `Vi` 文本编辑器编辑软件源。


    执行上述命令后，你可以打开 `sources.list` 文件的编辑界面。


    上述界面表示 `sources.list` 文件的编辑界面已成功打开。接下来，用户可以编辑该文件。


    本节将介绍如何使用 `Vi` 文本编辑器编辑和保存文件。在使用 `VI` 编辑器之前，你需要理解它的 3 种模式，即命令模式、输入模式和末行模式。


    这 3 种模式的功能如下：


    - **命令模式：**启动 `Vi` 文本编辑器后，默认进入命令模式。该模式主要完成光标移动、字符串搜索以及删除、复制和粘贴文件内容等相关操作。

    - **输入模式：** 该模式的主要操作是输入文件内容，以便修改文本文件正文或添加新内容。在输入模式下，`Vi` 文本编辑器的最后一行将显示状态提示信息 "--INSERT--"。

    - **末行模式：** 在此模式下，你可以设置 `VI` 编辑环境、保存文件、退出编辑器，并执行搜索和替换文件内容等操作。在末行模式下，`VI` 编辑器的最后一行会出现一个冒号(:)
    提示符。


    当用户使用 `Vi` 文本编辑器打开文件时，默认进入命令行模式。此时，按下 `a`、`i` 或 `o` 进入输入模式并编辑文件内容。编辑完成后，按下 `Esc`
    返回命令行模式。然后，输入冒号 `:` 提示符进入末行模式，并输入 `:wq` 命令保存并退出文本编辑界面。或者，用户也可以输入 `ZZ` 保存并退出文本编辑界面。


    ## 第 5 章


    # Kali 中的设置面板


    ![](img/00003.jpeg) ![](img/00002.jpeg)


    在上一章中，我们已经通过详细的说明学习了 Kali Linux 各种功能的重要性。本章将对设置面板以及普通用户需要理解的网络功能提供深入的理解。


    ### 设置面板


    “设置”（Settings）面板用于设置系统，例如设置分辨率、电源、背景颜色、网络连接等。在某些系统中实现操作时，这些基础设置是必不可少的。本节将介绍 Kali
    Linux 的“设置”面板。


    #### 启动设置面板


    1) 点击“收藏”文件夹中的应用程序按钮，将显示所有应用程序。

    2) 点击此界面上的设置按钮以打开“设置”面板。

    3) 你可以从对话框的左栏看到所有设置项。在用户选择设置项后，可以在右栏进行相应的设置。例如，设置电源。在左栏选择“电源”（Power）设置项，并在右栏设置“闲屏
    (B)”和“自动挂起 (A)”的时间。为了方便用户设置 Kali Linux 系统，这里列出了所有的设置项及相应的设置。


    ### 配置网络


    为了实施渗透测试，你需要连接到网络。在实施渗透测试之前，你需要配置网络。用户可以使用有线网络、无线网络和 VPN 连接到网络。本节将介绍这三种网络配置方法。


    ### 配置有线网络


    有线网络是通过同轴电缆、双绞和光纤连接的计算机网络。简单来说，它是通过网线连接的计算机网络，通常称为以太网。有线互联网相对稳定。如果用户需要下载一些较大的文件或更新系统，建议使用有线网络。在
    Kali Linux 中，用户可以使用命令或图形界面配置有线网络。


    #### 1) 使用 ifconfig 命令查看现有网络配置


    在配置网络之前，首先检查现有的网络配置。如果网络已经配置，则无需再次配置。如果没有配置，则用户需要手动配置。


    使用 `ifconfig` 命令查看现有网络配置如下：


    ```bash

    root@exampleserver:～# ifconfig

    ```


    这将显示许多关于有线网络的信息。我们建议你保存这些信息的截图，以便以后参考你正在攻击的目标。当你针对无线网络时，这很有用。


    #### 图形界面设置


    图形界面设置相对直观且易于操作。本节将介绍在图形界面上设置有线网络的方法。


    配置有线网络的具体步骤如下：


    1) 打开“设置”面板并选择“网络”设置项，将显示对话框。

    2) 从此对话框可以看出，有线网络未连接。此时，点击设置按钮，将显示对话框。

    3) 从对话框中你可以看到它包含 5 个标签，即详细信息、标识、IPv4、IPv6 和安全。这里主要配置 IPv4 标签中的选项。设置后，你可以在“详细信息”标签页中查看获取的网络信息。选择
    IPv4 标签，将显示对话框。

    4) 在对话框中设置获取 IPv4 地址的方法。这里提供了 4 种方法，即自动 (DHCP)、手动、仅本地链路和禁用。其中，“自动 (DHCP)”选项意味着
    DHCP 服务器将自动为当前主机分配 IP 地址。


    “手动”选项意味着用户需要手动设置 IP 地址、子网掩码和网关。“仅本地链路”选项仅在无法访问互联网时用于本地连接。“禁用”选项意味着禁用 IPv4 地址。如果你想访问互联网，必须同时使用自动
    (DHCP) 和手动方法。为了方便使用和快速操作，“自动 (DHCP)”是最佳选择。如果用户想要固定当前的电脑地址，可以选择“手动”单选按钮，此时将显示对话框。


    5) 在此对话框中，你可以手动指定 IP 地址、子网掩码、网关、DNS 和路由信息，以防止用户因配置错误导致无法上网。建议仅设置 IP 地址和子网掩码。设置完成后，点击右上角的“应用
    (A)”按钮返回网络设置对话框。


