    IP 地址（网络协议地址）是一种互联网标识地址，用于检测设备、网络以及更大型的网络。例如，你的手机有一个 IP 地址，而你的调制调器有一个独立且唯一的 IP
    地址。它是一个 32 位二进制数，使用点点表示法分为 4 个 8 位二进制数，总共 4 字节。重要重要的是，IP 地址通常以“点分十进制法”的形式表示为 `a.b.c.d`。其中，`a`、`b`、`c`
    和 `d` 都是 0 到 255 之间的十整数。例如，点分十进制 IP 地址 `192.168.12.143` 实际上是一个 32 位二进制数。


    练习：使用在线转换计算器找出上述 IP 数字的二进制表示法。


    IP 地址由部分组成，即网络地址和主机地址。网络地址表示它属于互联网上的哪一个网络，主机地址表示它属于网络中的哪一个主机。如果你仔细观察，可以发现它们之间是主从关系。根据不同的网络号和主机号，IP
    地址分为 A 类（`1.0.0.0～126.0.0.0`）、B 类（`128.1.0.0～191.255.0.0`）和 C 类（`192.0.1.0～223.255.255.0`）。还有称为
    D 类和 E 的特殊地址类。此外，全 0 和全 1 被预留。


    每组 IP 地址的介绍如下：


    ### A 类

    该组的地址范围为 `1.0.0.0-126.0.0.0`，子网掩码为 `255.0.0.0`。在此地址中，第一个字节是网络号，最后 3 个字节是主机号。这种类型
    IP 地址的前导是 `0`，因此地址范围的网络号显然从 1 到 126。


    ### B 类

    地址范围从 `128.1.0.0` 到 `191.255.0.0`，指定的子网掩码为 `255.255.0.0`。在此地址中，前两个字节是网络号，最后两个字节是主机号。这种类型
    IP 地址的前导是 `10`，因此地址的网络号从 128 到 191。


    ### C 类

    地址范围从 `192.0.1.0` 到 `223.255.255.0`，子网掩码为 `255.255.255.0`。在此地址中，前 3 个字节是网络号，最后一个字节是主机号。这种类型
    IP 地址的前导是 `110`，因此地址的网络号在 129 到 223 之间。


    ### D 类

    是一种组播地址。这种类型 IP 地址的前导是 `1110`，因此地址的网络号在 224 到 239 之间。通常用于组播用户。如果你不知道，组播地址允许源设备向一组设备发送数据包的地址。属于组播组的设备将被分配一个组播组
    IP 地址，组播地址范围为 `224.0.0.0～239.255.255.255`。


    由于组播地址代表一组设备，因此它只能作为数据包的目的地址。源地址总是单播地址。组播 MAC 地址以十六进制值 `01-00-5E` 开头，剩余 6 位十六进制数字由
    IP 组播地址的最后 23 位转换而来。


    ### E 类

    预留地址。这种类型 IP 地址的前导是 `1111`，因此地址的网络范围从 240 到 255。


    在 IP 地址中，还有一种特殊的 IP 地址，称为广播地址。广播地址是专门用于同时发送到网络中所有主机的地址。在使用 TCP/IP 协议的网络中，主机标识段全为
    1 的 IP 地址即为广播地址，需要注意的是，广播包传输到所有参与该主机标识段的计算机。


    IP 地址主要根据子网掩码分为网络段。例如，如果 IP 地址 `192.168.1.100/24` 对应的子网掩码为 `255.255.255.0`，则网络段为
    `192.168.1.0-255`，即该网络段中有 256 个主机。


    当用户发现一个主机时，可以通过掩码格式指定网络范围。其中，为了输入方便，通常使用 `CIDR` 格式指定整个子网。`CIDR` 格式由两部分组成：网络地址和子网掩码，用斜杠（`/`）隔开。


    如果用户不确定 IP 范围对应的子网掩码格式，可以使用 `Net-mask` 工具来实现。应该说，该工具可以在 IP 范围之间转换。


    ### 确定网络拓扑

    用户可以通过掩码格式指定网络范围。其中，为了输入方便，通常使用 `CIDR` 格式指定整个子网。`CIDR` 格式由两部分组成：网络地址和子网掩码，用斜杠（`/`）隔开。


    如果用户不确定 IP 范围对应的子网掩码格式，可以使用 `Net-mask` 工具来实现。应该说，该工具可以在 IP 范围之间转换。


    #### 使用 traceroute

    用户可以使用 `traceroute` 工具确定网络拓扑。这将显示到达目标的路径。


    *使用该工具的语法格式如下：*

    ```

    traceroute [Target]

    ```


    *使用场景：*

    ```

    root@examples:# traceroute 72.132.234.64

    ```

    这将显示关于该特定主机的结果。注意：在虚拟机的 NAT 模式下，无法显示上层路由信息。工作时请确保了解这一点。


