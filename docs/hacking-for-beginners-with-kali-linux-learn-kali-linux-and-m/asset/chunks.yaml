    \ of the domain name wikipedia.com.\n\nThe execution command is as follows:\n\n\
    ```\nroot@exampleserver:～# dmitry -w wikipedia.com\n```\n\nBy using the above\
    \ command in the linux terminal the WHOIS information related to the domain name\
    \ wikipedia.com will be successfully obtained.\n\n### Find subdomains\n\nA subdomain\
    \ is also treated as a domain by a penetration tester. In the domain name system\
    \ hierarchy, it usually belongs to a higher domain. For example, `www.wikipedia.com`\
    \ and `forum.wikipedia.com` are two subdomains of `wikipedia.com`, and it needs\
    \ to be understood that `forum.wikipedia.com` is a subdomain of top-level domain\
    \ `wikipedia.com`.\n\nNormally, a subdomain name will contain the host name. For\
    \ example, in the `www.wikipedia.com` domain name, `.com` is the top-level domain\
    \ name and `wikipedia.com` is the first-level domain name. `www` is the host name\
    \ used to identify the server. Therefore, the WWW server established by `wikipedia.com`\
    \ is `www.wikipedia.com`. It is a known fact that by looking up the subdomain\
    \ name, the corresponding host can be found. The method to find subdomains will\
    \ be described below with detailed examples.\n\n#### 1) Use Dmitry tool \n\nThe\
    \ Dmitry tool can be used to find subdomains. However, the tool uses the Google\
    \ search engine to find subdomains. It may not be reliable some times if you are\
    \ accessing websites that are backlisted by google. So, make sure that your domain\
    \ is compatible with Google search.\n\nThe syntax format of using the Dmitry tool\
    \ to find a subdomain name is as follows:\n\n```\ndmitry -s -o\n```\n\nThe options\
    \ and meanings in the above grammar are as follows: · `-S`: Implements subdomain\
    \ query. `-O`: Specifies the file to save the output result.\n\n*Use-case scenario:*\n\
    \nUse the Dmitry tool to find the subdomain name of the domain name wikipedia.com.\n\
    \nThe execution command is as follows:\n\n```\nroot@exampleserver:～# dmitry -s\
