    在上一章中，我们已经介绍了在虚拟系统和物理系统中安装 Kali Linux 的不同方法。在开始学习 Linux 自带的各种工具之前，了解 Kali 作为操作系统的功能至关重要。学习终端和网络能力可以提高你在进行渗透测试（pen
    testing）时的效率。本章描述的许多章节都需要访问 Kali 系统才能获得更好的理解。因此，请确保在阅读此书时，你的电脑上已经安装了 Kali Linux
    操作系统。


    ## 深入理解 Kali Linux


    如果你配置了 Kali Linux 系统，那么你需要对该系统有一个简单的了解，例如菜单栏的使用、文件管理和系统设置。本节将介绍 Kali Linux 系统的常用操作。


    ### 命令行菜单


    Kali Linux 提供了大量的渗透测试工具。这些工具被分为不同的类别，如信息收集、漏洞分析、Web 程序等。用户可以通过选择图形界面上的“应用程序”（Application）选项卡查看所有类别。


    从这个启动界面，你可以看到应用程序包含 14 个类别。此外，每个类别都有确定的子类别。在所有可用软件中，有些工具运行在图形界面上，而有些运行在命令行界面。对于在图形界面上运行的工具，通过菜单命令启动它们更加方便。对于在命令行上运行的工具，通常无法无法通过菜单命令进入，必须在终端中执行。因此，不建议直接从命令行进入工具。请务始终参考每个工具针对
    GUI 和 CLI 命令的单独文档格式。


    ### 文件工具


    文件工具用于在图形界面中管理文件。如果你想进行文件管理，你需要非常清楚文件系统的结构。否则，你可能会遇到无法找到文件位置的问题。Linux 系统与 Windows
    系统不同。与 Windows 不同，它不通过驱动器器符存储文件。Linux 系统只有一个根分区，所有文件都在根目录下。为了方便用户更好地管理文件，我们首先将详细解释
    Linux 系统的文件系统结构。


    Linux 下下的文件系统结构是一棵树，它的条目是 `//(root)` 树结构下的文件目录。无论是哪个版本的 Linux 系统，都有这些目录，它们是标准化的目录。不同的
    Linux 发行版之间会有一些细微差异，但总体上是相似的。当用户尝试理解 Linux 文件系统的结构时，由于其复杂性，可能并不非常熟悉这些文件的划分。


    Linux 中有几个重要的目录，例如：


    #### 1) 目录 (Home Directory)


    Linux 下每个用户都有一个家目录，用于存储用户文件。其中，用户文件的位置是 `/home/username`。然而，超级用户（super user）的家目录与普通用户不同。超级用户的家目录是
    `/root`，称为根目录。当用户打开终端时，位置是登录系统的用户的家目录。此外，每个普通用户只能访问自己的家目录。但是，管理员可以访问所有用户的家目录。这就是为什么黑客总是尝试破解管理员权限，因为那里有更多方法可以利用系统。


    #### 2) 根目录 (Root Directory)


    根目录是文件系统的入口，称为最高级目录。每个文件和目录都从根目录开始，只有根用户在该目录下具有写权限。


    #### 3) 其他几个重要文件夹


    除了上述两个目录外，还有几个用户需要了解的重要文件夹，例如 `/etc`、`/bin`、`/sbin` 等。


    以下是它们的简要介绍：


    *   `/bin`: 基本系统所需的命令也是最小系统所需的命令，例如 `ls`、`cp`、`mkdir` 等。该目录中的文件是可执行的，可以供普通用户使用。

    *   `/sbin`: 该目录主要用于存储系统管理命令。它是超级特权用户 root 的可执行命令存储的地方。普通用户没有权限执行该目录中的命令。此目录类似于
    `/usr/sbin` 或 `/usr/local/sbin` 目录。只需记住 `sbin` 目录中的所有内容只能通过 root 权限执行。

    *   `/etc`: 存储系统程序或通用工具的配置文件。

    *   `/usr`: 这是系统存储程序（如命令和帮助文件）的目录。目录下有很多文件和目录。当用户安装 Linux 发行版官方提供的软件包时，大部分包都会安装在这里。如果涉及服务器配置文件，配置文件将安装在
    `/etc/` 目录。

    *   `/var`: 该目录的内容经常变化。`/var` 通常包括 `/var/log`、`/var/spool`、`/var/cache` 等。其中，`/var/log`
    是用于存储系统日志的目录。`/var/spool` 是存储打印机、邮件、代理服务器等的池目录；`/var/cache` 用于存储一些缓存文件。


    在用户清楚了解 Kali Linux 文件系统结构后，就可以进行文件管理了。在这里我们将介绍 Linux 图形界面系统的文件管理工具。


    1. 在桌面上选择“位置”（Location） | “计算机”（Computer），这样就会打开文件系统的根目录。

    2. 从此界面，你可以看到根目录下的所有文件和文件夹。此时，用户可以执行如打开文件、创建文件、删除文件和查看文件内容等操作。如果你想打开一个文件，只需双击该文件。如果你想删除或复制文件，需要选择文件或文件夹并点击右键，会弹出一个菜单。其中，将显示文件夹和文件的弹出菜单。

    3. 此时，在弹出菜单中选择任何命令来执行相应的操作。例如，选择“用文本编辑器打开”命令来显示文件内容。

    4. 此界面显示了 `sources.list` 文件的内容。此时，用户可以编辑文件内容。如果你可以修改文件内容，可以点击“保存 (S)”按钮使修改生效。


    ### 终端 (Terminal)


    终端可以被理解为命令行模式下的文件管理工具。对于喜欢使用命令行操作的用户，可以使用终端模式来实现文件管理。通过之前的介绍，用户也知道某些命令在图形界面下无法正常运行。因此，知道如何使用终端执行操作也是一项非常重要的技能。下一节将介绍终端的常用操作。


    #### 1) 打开新终端


    如果你想使用终端，需要先打开终端。在 Kali Linux 中，有两种方法打开终端。第一种直接点击收藏栏中的终端按钮。第二种是在桌面上点击右键，并在弹出菜单中选择“在终端打开”（Open
    in Terminal）命令。


    如你所见，界面显示终端窗口已成功打开。在此窗口中，用户还可以打开多个终端。右键点击终端窗口，并在弹出菜单中选择“新标签页 (T)”命令来打开一个新的终端窗口。


