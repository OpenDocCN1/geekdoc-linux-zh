    ### b 错误的权限设置


    权限机制规定了用户可以做什么和不能做什么。在操作系统中，权限是一项重要的技术，用于限制任何用户操作敏感资源。如果由于配置不当赋予用户最大权限，可能会导致严重后果，例如删除他文件和更改其他用户的密码。例如，`FTP`
    服务的权限设置非常繁琐。如果管理员错误配置了 `FTP` 目录权限，可能会导致匿名用户删除文件或恶意上传文件。


    因此，通常建议系统管理员不断检查他们默认使用的权限设置。


    ### 软件漏洞


    软件漏洞通常是由软件开发在开发软件时的疏忽引起的，有时也是由于编程语言的局限性导致的。例如，`C` 语言族比 `Java` 更高效，但也更容易产生漏洞。同样重要的是记住，复杂的系统包含更多功能，其复杂性导致了漏洞概率的增加。


    例如，计算机系统通常需要各种补丁来修复漏洞。


    以下是最近几个知名的软件漏洞：


    - 远程键盘软件漏洞


    该软件存在 3 个安全漏洞，会导致权限提升，允许攻击者通过网络对本地用户或键盘会话进行按键注入，或执行任意代码。


    - 基于 Jakarta 插件的 Struts 远程代码执行漏洞


    该漏洞是一个高风险漏洞，其漏洞编号为 `CVE-2017-5638`。该漏洞主要由于 `Jakarta` 对文件上传请求包分析不当引起的。当攻击者使用恶意的
    `Content-Type` 时，会导致远程命令执行。


    ### 硬件漏洞


    硬件漏洞通常存在于硬件设备或芯片中。例如，`NVDIA Tegra` 芯片中的漏洞存在于 `Tegra` 芯片的只读 bootrom 中。CPU 漏洞（`Meltdown`
    和 `Spectre`）直接存在于芯片内部，由于指令读取顺序的原因，它们容易受到攻击。


