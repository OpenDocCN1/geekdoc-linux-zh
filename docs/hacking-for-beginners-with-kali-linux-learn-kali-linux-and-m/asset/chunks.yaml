    ## 介绍


    本书的上一个模块介绍了 Kali Linux 及其功能和安装指南。本模块关注所有黑客和渗透测试人员必须掌握的最重要技能，即侦察（Reconnaissance）。我们将查看各种工具，并提供大量的示例，让你清晰地理解该主题的精髓。


    ***你需要哪些工具？***


    有数百专为侦察开发的工具，因为它在黑客攻击过程中起着主要作用。对于基础水平的介绍，本书主要关注两个工具：`Nmap` 和 `Dmitri`。如果你使用的是
    Windows 或 Mac，建议在开始阅读本书之前安装这两个工具。如果你已经安装了 Kali，则可以从搜索菜单轻松访问它们。如前所述，工具只是为了自动化操作和流式处理。


