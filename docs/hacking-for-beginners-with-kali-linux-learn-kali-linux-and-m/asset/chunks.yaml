    # 介绍黑客技术与 KALI


    ### 渗透测试员终极初极指南


    ![](img/00003.jpeg) ![](img/00002.jpeg)


    ## 第一章


    # 渗透测试简介


    ![](img/00003.jpeg) ![](img/00002.jpeg)


    黑客攻击（Hacking）通常定义为获取对受安全保护系统的访问。黑客的存在直到网络演变。此前，黑客攻击主要用于从其他国家窃取军事报告。随着时间的推移，互联网普及为黑客提供了轻松获取数据和数字货币的机会。虽然有不同类型的黑客，但该术语在流行文化中不断被用作一个恶词。


    黑客攻击是一门艺术。利用是一项技能。在 21 世纪，互联网充斥着恶意木马和阴暗网站，消费者的安全对于大小网站来说都是一个重要问题。这就是为什么每家跨国公司都部署了数百名渗透测试员不断监控和测试其资源的原因。


    许多安全专家还担任漏洞赏金猎人来赚钱并保护网站和应用程序。你可以在这里查看更多关于漏洞赏金的信息。


    ### 什么是渗透测试？


    渗透测试是一种安全测试方法和评估策略，通过模拟恶意黑客的攻击方法来发现计算机网络系统的安全性。通过实施渗透测试，可以发现主机中潜在但未公开的安全问题。在接下来的步骤中，用户/开发者可以根据测试结果巩固并改进系统的缺陷和安全漏洞，使用户系统更加安全。


    当伦理黑客实施渗透测试时，他们使用三种方法：黑盒测试、白盒测试和灰盒测试。本节将分别介绍这三种测试方法。


    **黑盒测试**


    黑盒测试被称为外部测试。在这种测试下，渗透测试员将从远程网络位置评估目标网络基础设施，而没有任何关于目标网络内部拓扑的信息。他们在网络环境中模拟外部攻击者，使用流行的攻击技术和工具逐步渗透并入侵目标组织，揭示目标网络中已知或未知的漏洞，并进一步评估这些漏洞是否可以被利用以获取控制或运营业务，导致资产损失。


    黑盒测试的缺点是测试耗时耗力，且要求渗透测试员具有较高的技术能力。优点是这种测试更有于挖掘系统的潜在漏洞、薄弱环节和弱点。


    **白盒测试**


    白盒测试被称为内部测试。白盒渗透测试员在测试之前会学习目标环境的所有内部和底层信息。这允许渗透测试员以最低成本发现并验证系统中最严重的漏洞。白盒测试的实施过程与黑盒测试相似，不同之处不需要目标位置和情报收集。渗透测试员可以使用正常通道从被测试组织获取各种信息，如网络拓扑、员工信息，甚至是网站程序的代码片段，并与该单位的其他员工进行面对面的交流。


    白盒测试的缺点是它无法测试客户组织的应急响应程序，也无法判断其安全防护方案针对特定攻击的检测效率。白盒测试的优点是，与黑盒测试相比，发现和解决安全漏洞所需的时间和成本要少。


    **灰盒测试**


    灰盒测试是基础白盒测试和黑盒测试的结合，可以对目标系统提供更深入、更全面的安全审查。这种结合的优点是可以同时利用两种测试方法的优势。在灰灰盒测试方法的渗透攻击场景中，渗透测试员需要从外部渗透目标网络。然而，目标网络的底层拓扑和架构有助于更好地选择攻击路径和方法，以获得更好的渗透测试结果。


    ### 渗透测试流程


    在用户对渗透测试有了清晰了解后，就可以开始渗透目标。在详细实施渗透测试之前，我们首先介绍其工作流。总共有 5 个阶段，即：前期交互、信息收集、漏洞扫描、漏洞利用和报告编写。为了方便用户更清晰地了解每个阶段的信息，这里将介绍每个阶段的作用。


    1) **前期交互**


    在进行渗透测试之前，渗透测试员需要充分了解渗透测试目标、渗透测试范围、渗透测试方法、服务合同等细节，以达成共识。


    2) **信息收集**


    '
- fmt: '

    After determining the goal and scope of the penetration test, the next step is
    to enter the information collection stage. At this stage, penetration testers
    need to use various public resources to obtain as much information as possible
    about the test target. During this time, penetration testers can use the Internet
    to collect information, such as official websites, forums, and blogs.


    At the same time, you can use major search engines to obtain relevant information,
    such as Yahoo and Google. You can also use some tools in `Kali Linux` to collect
    DNS information, registrant information, service information, WAF information.
    The more sufficient information collected at this stage, the more beneficial it
    is for subsequent penetration testing, and the success rate of penetration testing
    will also be greatly improved.


    As a saying goes by a famous pen tester:


    "If you want to be a good penetration tester then spend 70% of your time collection
    information about your target"


    ### 3) Vulnerability scanning


    After the penetration tester has collected enough information, the target can
    be scanned for vulnerabilities. At this stage, the penetration tester probes the
    target system through the network, sends data to the target system, and matches
    the feedback data with the built-in vulnerability signature database, and then
    lists the security vulnerabilities in the target system.


    ### 4) Vulnerability exploitation


    After the penetration tester detects the vulnerability of the target host, he
    can infiltrate the target system through the existing vulnerability exploitation
    program. However, in general, penetration testers need to take into account the
    environment of the target system to modify and collect additional research to
    the exploit program, otherwise it will not work properly.


    ### 5) Prepare reports


    After completing the penetration test, you need to write a test report for this
    penetration test. The prepared report needs to include all kinds of valuable information
    obtained, as well as the security vulnerabilities detected and unearthed, the
    successful attack process, and the impact and consequence analysis on the business.
    At the same time, it is necessary to clearly write out the vulnerabilities in
    the target system and the ways to repair the vulnerabilities. In this way, the
    target user can patch these vulnerabilities and risks based on the report provided
    by the penetration tester to prevent hacker attacks.


    ### Overview of Kali Linux System


    `Kali Linux` is a Linux distribution based on Debian, including many security
    and forensics related tools. It is maintained and funded by Offensive Security
    Ltd. This section will introduce the reasons for using `Kali Linux` in the book
    and the development history of the system.


    If you want to use the `Kali Linux` system to perform penetration testing, you
    must first install the system. It is moderately difficult to install this Linux
    distro on your own. So, we included a separate chapter for helping you understand
    the procedure to install `Kali Linux` in your personal computer.


    #### Why to use Kali Linux?


    `Kali Linux` is released mainly for digital forensics and penetration testing
    specialists. There are two main reasons for using `Kali Linux` system to implement
    penetration testing in this book.


    1. **Tool warehouse**

    `Kali Linux` system provides a powerful tool warehouse, and pre-installed many
    penetration testing software, such as `Nmap` (port scanner), `Wireshark` (packet
    analyzer), `John the Ripper` (password cracker) and `Aircrack-ng` (Wireless LAN
    penetration testing software). If users use other operating systems, they need
    to manually install related tools. Penetration testing often requires a large
    number of tools. Collecting these tools is not an easy task, and the security
    of the code cannot be guaranteed. In addition, if the user manually installs it,
    a complicated environment may need to be configured. If users want to implement
    penetration testing more easily and quickly, `Kali Linux` is the best choice.
    If you are not satisfied with `Kali Linux` there is an alternative called as Parrot
    Linux for security specalists. This book however uses `Kali Linux` for introducing
    hacking concepts.


    2. **Constant updates**

    `Kali Linux` system update speed is relatively fast, the stable version will be
    updated every 3 months and weekly update version will be released. So users can
