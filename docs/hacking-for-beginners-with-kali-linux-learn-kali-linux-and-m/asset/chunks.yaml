    ### ① Metasploit''s graphical interface (Armitage)


    Armitage is a Metasploit graphical interface attack software written by Java.
    It can be combined with known exploits in Metasploit to automate attacks on vulnerabilities
    in the host. The following section will introduce how to use Armitage.


