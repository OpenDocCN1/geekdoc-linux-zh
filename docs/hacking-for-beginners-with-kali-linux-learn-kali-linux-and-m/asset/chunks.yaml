    The execution command is as follows:


    > root@exampleserver:～# snmp-check 192.243.176.84


    When the connection is successful, the system information of the host can be obtained.


    Due to the large amount of output information that comes with the above command,
    each part will be important to understand. Follow along!


    1) We can obtain system information, such as host name, operating system type
    and architecture.


    2) We can obtain user account information.


    3) Can obtain network information, such as TTL value, TCP segment and data element.


    4) Can obtain network interface information, such as interface status, speed,
    IP address, and subnet mask.


    5) Can obtain network IP information.


    6) Can obtain routing information, such as destination address, next hop address,
    subnet mask and path length value.


    7) Can obtain the monitored TCP port.


    8) Can obtain monitoring UDP port information. For example, the monitored UDP
    ports can be 123, 154, 6300, 300 and 5322.


    9) We can obtain network service information, such as distributed component object
    model service, DHCP client, and DNS client.


    10) We can obtain process information, such as process ID, process name, and process
    type.


    11)We can obtain storage information, such as device ID, device type, and file
    system type.


    12) Can obtain file system information, such as index, mount point, remote mount
    point, and access permissions.


    13) Can obtain device information, such as device ID number, type, and status.


    14) Can Obtain software component information, such as .Net framework, Visual
    C++2008, etc.


    ***What Next?***


    With this, we have completed an important part of the information gathering procedure
    during penetration testing. With all this acquired data we need to analyse them
    to obtain or create a workflow that will work. To make this procedure easy for
    you we are going to explain Maltego tool with detailed instructions. Follow along!


    ## Chapter 16


    # Information analysis and sorting


    ![](images/00005.jpeg) ![](images/00004.jpeg)


    By using the methods described above, a large amount of information about the
    target host can be collected. In order to facilitate the subsequent implementation
    of penetration testing, users need to sort and analyse this information. At this
    point, users can analyse and organise the information with the help of Maltego
    tools.


    This section will introduce the use of Maltego tools to analyse and organise information.


    ### Configure Maltego'
