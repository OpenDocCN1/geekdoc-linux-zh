    # Understanding Metasploit Interface


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    The Metasploit framework provides two interfaces, graphical interface and terminal
    mode. Previously, a command-line mode interface was also provided, but it has
    been deprecated. The following will introduce the graphical interface and terminal
