    IP address (Internet Protocol Address) is an Internet identity address, that is
    used to detect devices, networks and much larger networks. For example, your mobile
    phone has an IP address and your modem has a separate and an unique IP address.
    It is a 32-bit binary number, and is separated into 4 8-bit binary numbers using
    dot notation, which is 4 bytes. It is important to understand that, the IP address
    is usually expressed in "dotted decimal notation" in the form of `a.b.c.d`. Among
    them, `a`, `b`, `c`, and `d` are all decimal integers between 0 and 255. For example,
    the dotted decimal IP address `192.168.12.143` is actually a 32-bit binary number.


    Exercise: Find out the above IP numbers binary notations using an online conversion
    calculator.


    The IP address consists of two parts, namely the network address and the host
    address. The network address indicates which network it belongs to on the Internet,
    and the host address indicates which host in the network it belongs to. If you
    observe carefully you can say that they two are in a master-slave relationship.
    According to the different network numbers and host numbers, IP addresses are
    divided into type A (`1.0.0.0～126.0.0.0`), type B (`128.1.0.0～191.255.0.0`) and
    type C (`192.0.1.0～223.255.255.0`). There are also special Address classes called
    as class D and E. In addition in this, all 0s and all 1s are reserved.


    The introduction of each set of IP address is as follows:


    ### Class A

    The address range of this set is `1.0.0.0-126.0.0.0`, and the subnet mask is `255.0.0.0`.
    In this address, the first byte is the network number, and the last 3 bytes are
    the host number. The front notation of this type of IP address is `0`, so it is
    evident that the network number of the address ranges from 1 to 126.


    ### Class B

    The address range is from `128.1.0.0` to `191.255.0.0`, and the designated subnet
    mask is `255.255.0.0`. In this address, the first two bytes are the network number,
    and the last two bytes are the host number. The front of this type of IP address
    is `10`, so the network number of the address ranges from 128 to 191.


    ### Class C

    The address range is `192.0.1.0` to `223.255.255.0`, and the subnet mask is `255.255.255.0`.
    In this address, the first 3 bytes are the network number, and the last byte is
    the host number. The front of this type of IP address is `110`, so the network
    number of the address is between 129 and 223.


    ### Class D

    It is a multicast address. The front of this type of IP address is `1110`, so
    the network number of the address is between 224 and 239. Generally used for multicast
    users. If you are not aware, the multicast address is the address that allows
    the source device to send packets to a group of devices. Devices belonging to
    the multicast group will be assigned a multicast group IP address, and the multicast
    address range is `224.0.0.0～239.255.255.255`.


    Since the multicast address represents a group of devices, it can only be used
    as the destination address of the packet. The source address is always an unicast
    address. The multicast MAC address starts with the hexadecimal value `01-00-5E`,
    and the remaining 6 hexadecimal digits are converted from the last 23 digits of
    the IP multicast group address.


    ### Class E

    Reserved addresses. The front of this type of IP address is `1111`, so the network
    number of the address ranges from 240 to 255.


    Among IP addresses, there is also a special type of IP address, known as a broadcast
    address. The broadcast address is an address specifically used to send to all
    hosts in the network at the same time. In a network using the TCP/IP protocol,
    the IP address whose host identification segment is all 1s is a broadcast address,
    and it should be noted that broadcast packets are transmitted to all computers
    involved in the host identification segment.


    The IP address is mainly divided into network segments according to the subnet
    mask. For example, if the subnet mask corresponding to the IP address `192.168.1.100/24`
    is `255.255.255.0`, the network segment is `192.168.1.0-255`, that is, there are
    256 hosts in the network segment.


    When a user discovers a host, he can specify the network range through the mask
    format. Among them, for input convenience, `CIDR` format is usually used to specify
    the entire subnet. Among them, the `CIDR` format is composed of two parts, the
    network address and the subnet mask, separated by a slash (`/`).


    If the user is not sure of the subnet mask format corresponding to an IP range,
    you can use the `Net-mask` tool to achieve it. It should be said that this tool
    can convert between IP ranges.


    ### Determine the network topology

    The user can specify the network range through the mask format. Among them, for
    input convenience, `CIDR` format is usually used to specify the entire subnet.
    Among them, the `CIDR` format is composed of two parts, the network address and
    the subnet mask, separated by a slash (`/`).


    If the user is not sure of the subnet mask format corresponding to an IP range,
    you can use the `Net-mask` tool to achieve it. It should be said that this tool
    can convert between IP ranges.


    #### Using traceroute

    The user can determine the network topology using the `traceroute` tool. This
    will show the route of the target.


    *The syntax format of using this tool is as follows:*

    ```

    traceroute [Target]

    ```


    *Use-case scenario:*

    ```

    root@examples:# traceroute 72.132.234.64

    ```

    This will show the results about that particular host. Note: In NAT mode of the
    virtual machine, the upper level routing information cannot be displayed. Make
    sure you know about this while working.

