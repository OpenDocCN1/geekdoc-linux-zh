    Linux 提供了一个名为 `Statsprocessor` 的工具，支持马尔可夫攻击技术。节节介绍使用该工具分析密码字典策略的方法。


    语法格式如下：


    ```

    statsgen [options] passwords.txt

    ```


    在上述语法中，options 代表可用选项；`passwords.txt` 代表被分析的密码字典。


    使用 `statsgen` 工具分析 `rockyou.txt` 密码字典。


    1) 执行命令如下：


    ```

    root@exampleserver:～# statsgen rockyou.txt

    ```


    执行上述命令后，它将开始分析指定的密码字典并进行统计。其中，输出信息包括工具的基本统计信息、密码长度、字符集、密码复杂度、简单掩码和高级掩码。


    为了让用户更清楚地了解输出结果，下节将逐一介绍信息的每个部分。其中，信息的第一部分是 `statsgen` 工具的基本信息，如下。


    从输出信息中，你可以看到 `statsgen` 工具的版本信息、被分析的密码文件以及对密码文件的统计情况。


    通过分析输出信息可以看出，工具版本为 `0.0.3`；被分析的密码字典为 `rockyou.txt`；密码字典包含 `14344392` 个密码。


    2) 以下是密码长度统计信息。上述信息基于密码字典中密码长度的统计，并根据密码长度的比例降序排列。其中，输出信息分为 3 列，分别是密码长度、占密码总数的比例以及密码总数。


    例如，第一行信息表示密码长度为 8，占密码总数的 20%，匹配此长度的密码总数为为 `2966037` 个。


    3) 以下是密码字符集的统计信息。


    从输出信息中，我们可以看到密码字典中的各种密码字符集已得到分析和计数。


    4) 以下是密码复杂度的统计。上述是对密码复杂度的统计。输出信息分为 3 列，分别表示构成密码的字符以及此类字符的使用情况。密码中字符的最少数量和密码中此类字符的最大数量。


    5) 以下是简单掩码的统计：上述信息是密码字符串掩码格式的简单统计。


    例如，`stringdigit` 意味着字母在前数字在后；`stringdigitstring` 意味着字母在前、数字在中间、字母在后。


    6) 以下是密码字符串掩码格式的高级统计：上述信息是对密码字符串的高级统计。其中，高级统计是用掩码格式表示密码文件中的密码字符。统计后使用了四种掩码格式，每种格式都包含一个
    `?`（问号），后跟一个小写字母表示一组字符。


    这四种掩码格式的表示和含义如下：


    L：代表小写字母 `a` 到 `z` 的字符集。U：代表大写字母 `A` 到 `Z` 的字符集。D：代表数字 `0-9` 的字符集。S：代表特殊符号的字符集合。


    在得到的掩码格式中，一个掩码代表密码中的一个数字。例如，`?l?l?l?l?d?d?d?d` 掩码格式表示由 4 个 `?l` 和 4 个 `?d` 组成的
    8 位密码。其中，前 4 位由小写字母 `a` 到 `z` 组成，后 4 位由数字 `0-9` 组成。


    # 生成破解字典


    ![](img/00011.jpeg) ![](img/00010.jpeg)


    在用户收集了足够的目标用户信息和密码策略后，可以根据获得的信息创建密码字典。接下来将介绍使用 `Crunch`、`rsmangler` 和 `rtgen`
    工具生成字典的方法。


    ### 1) 使用 Crunch 工具


    Crunch 是一个密码字典生成器。它可以根据指定的规则生成密码字典，用户可以灵活地自定义自己的密码字典文件。接下来介绍使用 `Crunch` 工具生成字典文件的方法。


    使用 `Crunch` 工具生成字典的语法格式如下：


    ```

    crunch [][options]

    ```


    在上述语法中，参数表示生成的密码的最小长度；表示生成的密码的最大长度；表示指定的字符集。`[options]` 表示有效选项。


    其中，常用的选项及其含义为：


    -O：指定生成的字典文件名。


    -B[type]：指定写入文件的最大字节数。


    大小可以用 `KB`、`MB` 或 `GB` 指定，但必须配合 `-o` 选项使用。


    -T：设置所使用的特殊格式。


    -L：此选项用于在 `-t` 选项指定 `@`、^` 时识别占位符的某些字符。


    Crunch 工具提供的默认字符集保存在 `/usr/share/crunch/charset.lst` 中。此时用户可以直接使用这些字符集来生成对应的密码字典。


    用户可以使用 `cat` 命令查看所有字符集，如下：


    ```

    root@exampleserver:/usr/share/crunch# cat charset.lst

    ```


    上述输出信息均为默认字符集。在输出信息中，等号左侧表示字符集名称，右侧表示使用的字符。


    使用 `Crunch` 工具生成一个最小长度为 8、最大长度为 10 的密码字典，并保存到 `/root/crunch.txt` 文件。


    其中，使用的字符集是 `hex-lower`，即 `0123456789abcdef`。


    执行命令如下：


    ```

    root@exampleserver:～# crunch 8 10 hex-lower -o /root/crunch.txt

    ```


    Crunch 现在将生成以下数据：13304332288 字节 12688 MB 12 GB 0 TB 0 PB crunch: 100% 完成生成输出


    从输出信息可以看出将生成一个 `12GB` 的字典，包含 `1224736768` 个密码。此外，生成的密码进度以百分比显示。如果用户想查看字典中的密码，可以使用
    `VI` 编辑器或 `cat` 命令查看。如下：


    ```

    root@exampleserver: ~# cat

    ```

    '
- fmt: '

    The above output information is the generated password. Due to the chapter, only
    a few passwords are briefly listed.


    ### 2) Use `rsmangler` tool


    `rsmangler` is a tool for generating a dictionary based on the keywords of a word
    list. Use this tool to build a dictionary based on the information collected by
    the user and use common password construction rules.


    Among them, the grammatical format of the `rsmangler` tool is as follows:


    ```

    rsmangler -f wordlist.txt -o new_passwords.txt

    ```


    The options and meanings in the above grammar are as follows:


    - `-F`, `--file`: Specify the input file, that is, the password words collected
    by the user.

    - `-O`, `--output`: Specify the name of the generated dictionary file.


    Use the `rsmangler` tool to generate a dictionary.


    The specific steps are as follows:


    1) Create a file to save the collected password words. Here will create a file
    named `test`, simply save two words to generate a new dictionary.


    ```

    root@exampleserver:～# vi test root password

    ```


    2) Use the `rsmangler` tool to generate a dictionary and save it to `pass.txt`.


    The execution command is as follows:


    ```

    root@exampleserver:～# rsmangler -f test -o pass.txt

    ```


    After executing the above command, no information will be output. At this point,
    the user can use the `cat` command to view the generated dictionary file as follows:


    ```

    root@exampleserver: ~ # cat pass.txt

    ```


    You can see the generated password dictionary from the output information. Due
    to space limitations, only some passwords are listed.


    ### 3) Use `rtgen` tool


    The `rtgen` tool is used to generate rainbow tables. The rainbow table is a huge
    collection of possible letter combinations and pre-calculated hash values. Among
    them, the generated rainbow table includes multiple algorithms, such as `LM`,
    `NTLM`, `MD5`, `SHA1`, and `SHA256`.


    Then, using the rainbow table can quickly crack all kinds of passwords. The following
    will introduce the method of using the `rtgen` tool to generate a rainbow table.


    The syntax format is as follows:


    ```

    rtgen hash_algorithm charset plaintext_len_min plaintext_len_max table

    ```


    The meaning of the parameters in the above syntax is as follows:


    - `Hash_algorithm`: Specify the hash algorithm used. Among them, the values that
    can be specified include `lm`, `ntlm`, `md5`, `sha1`, and `sha256`.

    - `Charset`: Specify the character set. Among them, the default character set
    file provided by the `rtgen` tool is `/usr/share/rainbowcrack/charset.txt`, as
    follows:


    ```

    root@exampleserver: /usr/share/rainbowcrack# cat charset.txt

    ```


    The above output information shows all character sets provided by the `rtgen`
    tool by default.


    Among them, the minimum length of the specified password is 4, and the maximum
    length is 8.


    The execution command is as follows:


    ```

    root@exampleserver:～# rtgen md5 loweralpha 4 8 010001000 0

    ```


    Seeing the above output information, it means that a rainbow table based on `MD5`
    has been successfully generated, the file name is `md5_loweralpha#4-6_0_1000x1000_0.rt`.


    Among them, the rainbow table is saved in the `/usr/share/rainbowcrack` directory
    by default:


    ```

    root@exampleserver:～# cd /usr/share/rainbowcrack/

    ```


    From the output information, we can see that the generated rainbow table file
    is `md5_loweralpha#4-8_0_1000x1000_0.rt`.


    To make it easier to use the generated rainbow table, you can use the `rtsort`
    command to sort it.


    The execution command is as follows:


    ```

    root@exampleserver:/usr/share/rainbowcrack# rtsort

    ```


    After executing the above command, no information will be output. Next, you can
    use the rainbow table to perform password cracking.


