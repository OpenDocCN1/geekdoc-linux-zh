    AP 数量。如果附近干扰不大，建议使用 `40MHz` 带宽，可以获得更高的传输速度。如果 AP 较多，则建议使用 `20MHz` 带宽。


    ## 接下来做什么？


    希望本章对无线网络的工作原理提供了清晰的解释。世界正在快速变化，现在为用户提供了数十种无线模式模式。作为一名黑客，意识到市场上出现的新无线设备和模式对你来说非常重要。不断检查无线设备的漏洞。在下一章中，我们将详细讨论无线安全。请继续关注！


    # 第 37 章：无线网络安全


    ![](img/00011.jpeg) ![](img/00010.jpeg)


    无线网络安全是一种用于保护无线网络的相关设置。在大多数路由器中，支持三种无线加密方法，即 `WEP`、`WPS` 和 `WPA/WPA2`。此外，为了方便连接无线网络，用户可能不使用加密。本节将介绍这些加密方法和配置。


    ## 无密码模式


    无密码模式意味着你可以无需密码快速连接到无线网络。然而，这种模式没有安全性。下节将以 `TP-LINK` 路由器为例介绍无线网络的每加密模式。


    具体的操作步骤如下：


    1) 登录路由器的管理界面。通常，路由器的默认地址为 `192.168.1.1` 或 `192.168.0.1`。本示例中的路由器地址为 `192.168.0.1`。因此，在浏览器中输入地址
    `http://192.168.0.1`，弹出密码登录对话框。


    2) 在对话框中输入登录用户名和密码，然后点击 `Login` 显示路由器的主界面。


    3) 在左侧列选择 `Wireless Settings`（无线设置）| `Wireless Security Settings`（无线安全设置），将显示包含各种设置的界面。


    4) 从此界面可以看到所有支持的加密方法，包括 `WPA-PSK/WPA2-PSK`、`WPA/WPA2` 和 `WEP`。在此处设置无密码模式。选择 `Do
    not turn on wireless security`（关闭无线安全）单选框。然后，点击底部的 `Save`（保存）按钮，弹出提示对话框。


    5) 提示用户在设置生效前重启路由器。点击 `OK` 按钮，界面底部将显示重启路由器的提示信息。


    6) 从此界面可以看到用户已更改无线设置，设置将在重启后生效。此时，点击 `Restart`（重启）选项，弹出重启路由器的界面。


    7) 点击 `Restart Router`按钮重启路由器。启动后，设置将生效。此时，用户可以无需输入密码快速连接到无线网络。


    在本章的下一节中，我们将通过解释一些著名的模式来讨论无线网络模式。


    ## 无线网络模式


    ### a) WEP 模式


    `WEP`（等同传输隐私）可以加密两个设备之间无线传输的数据，防止非法用户窃听或入侵无线网络。然而，该协议存在一些缺点，因此很容易受到攻击。目前，很少有人使用这种加密方法。


    下文将描述 `WEP` 模式的设置方法。以 `TP-LINK` 路由器设置设置 `WEP` 加密模式为例。


    具体的操作步骤如下：


    1) 登录路由器的管理界面。然后，在左侧列选择 `Wireless Settings` | `Wireless Security Settings`，显示界面。


    2) 在此界面选择 `WEP` 单选框，即 `WEP` 加密模式，然后用户可以设置该加密模式的认证类型、密钥格式和 `WEP` 密钥。其中，认证类型包括 `automatic`（自动）、`open
    system`（开放系统）和 `shared key`（共享密钥）。密钥格式包括 `ASCII` 和 `hexadecimal`（十六进制）。当用户选择 `open
    system` 时，无线网络中的主机无需提供认证密码即可通过认证并关联无线网络。


    但是，如果你想传输数据，必须提供正确的密码。当用户选择 `shared key` 时，必须提供正确的密码通过认证。否则，无法关联无线网络也无法进行数据传输。如果用户不想设置，可以选择
    `automatic` 选项。对于 `WEP` 密钥格式，用户可以根据自己的喜好进行选择。设置完成后，点击 `Save` 按钮，弹出提示对话框。


    3) 点击 `OK` 显示显示你已选择的所有设置的界面。


    4) 点击 `Restart` 按钮显示重启路由器的界面。


    5) 点击 `Restart Router`按钮重启路由器。路由器重启后，用户可以通过 `WEP` 加密连接无线网络。


    ### b) WPA/WPA2 模式


    `WPA`（无线保护保护访问）有两个标准，`WPA` 和 `WPA2`，是一种保护无线计算机网络安全的系统。`WPA/WPA2` 的创建是为了取代存在严重缺陷的
    `WEP` 协议。尽管这种加密方法非常安全，用户仍然可以通过捕捉握手破解密码。


    下文描述 `WPA/WPA2` 模式的设置方法。


    具体的操作步骤如下：


    1) 登录路由器并打开无线设置界面。


    2) 从此界面可以看到两种 `WPA/WPA2` 加密模式。其中，`WPA-PSK/WPA2-PSK` 针对小型企业或家庭网络。`WPA/WPA2` 通常用于大型企业。


    然后，设置认证类型、加密算法和 `PSK` 密码。认证类型包括 `automatic`、`WPA-PSK` 和 `WPA2-PSK`。加密算法包括 `automatic`、`TKIP`（新的
    `802.11n` 不支持这种加密算法）和 `AES`。在此处选择 `Automatic` 选项，然后点击 `Save` 按钮。接下来重启路由器使设置生效。


    ### 3) WPS 模式


    `WPS`（无线保护设置）是由无线联盟组织并实施的一种可选认证项目，主要用于简化无线网络设置和加密。


    通常，用户在创建新无线网络时会设置无线网络名称（SSID）和无线加密方法以确保无线网络安全。设置完成后，客户端连接此无线网络时需要输入网络名称和复杂的加密密码。为了方便输入，可以通过
    `WPS` 模式快速连接到无线网络。


    提示：在路由器中，某些按钮显示为 `WPS`，某些路由器的按钮显示为 `QSS`。


    1) 登录路由器并选择 `QSS` 安全设置选项，显示带有数据的界面。


    2) 从此界面可以看到 `QSS` 功能状态为关闭，即 `WPS` 功能未启用。在此，点击 `Enable QSS` 按钮启动 `WPS` 功能。点击 `Enable
    QSS` 按钮后，弹出重启路由器的提示对话框。


    3) 点击 `OK` 显示关于重启功能的界面。


    4) 点击 `Restart` 按钮显示重启路由器的对话框。


    5) 重启路由器后，可以看到 `WPS` 功能已成功启用。


    '
