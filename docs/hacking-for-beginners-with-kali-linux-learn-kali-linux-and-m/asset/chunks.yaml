    `Utilman` 是一个 Windows 辅助工具管理器。在 Windows 下，即使没有用户登录，你也可以使用 `Windows+U` 组合键调用 `Utilman`
    进程。通过这种机制，可以绕过 Windows 登录认证机制来操作系统。本节将介绍如何使用这种方法。


    通过将 `Utilman.exe` 文件替换为 `cmd.exe` 来绕过登录操作。


    具体步骤如下：


    1) 在 Windows 电脑上，使用 U 盘启动介进入 `Kali Linux` Live 模式。首先启动 U 盘安装介，将会显示系统安装引导界面。


    2) 在此界面上选择 `Live (amd64)` 进入 Live 模式。然后，在此 Live 模式下打开 Windows 文件系统。如图所示，在此界面中选择
    `Places|Computer`。


    3) 点击此界面上的 `Computer` 选项后，将打开本地计算机文件系统。


    4) 此界面显示 Linux Live 系统的文件列表。此时，选择左栏的 `Other Locations` 命令查看其他硬盘文件。


    5) 此界面显示计算机中所有的磁盘分区。根据显示的分区大小，找到 Windows 系统的分区。在本例中，Windows 系统的分区为 `322GB Volume`。因此，打开硬盘分区将显示
    Windows 系统的文件列表。


    6) 在此界面中，依次进入 `Windows|System32` 文件夹，将显示的内容。


    7) 在文件夹中找到 `Utilman.exe` 文件并将文件重命名为 `Utilman.old`。然后复制目录下的 `cmd.exe` 文件作为副本，并将其文件名修改为
    `Utilman.exe`。接下来，关闭 `Kali Linux Live` 模式并启动 Windows 系统。在登录界面按下 `Wins+U` 组合键，将显示所示界面。


    8) 从此界面你可以看到打开了一个命令提示符窗口。在该窗口中，你可以执行各种终端命令。例如，使用 `whoami` 命令查看用户信息。


    9) 从输出信息可以看出，当前用户具有最高权限。此时，可以执行任何操作。


    ## 路由器密码破解


    路由器是网络的核心设备。一旦控制了路由器，就可以对连接到路由器的主机进行各种数据嗅探和欺骗攻击。大多数路由器使用用户名/密码认证方法。每个路由器的管理界面都有初始用户名和密码。由于某些管理员用户的失误，可能会使用初始密码或弱密码。本节将介绍破解路由器密码的常用方法。


    ### 初始路由器密码


    大多数路由器都有初始用户名和密码。为了方便用户破解路由器密码，下面将列出常见的路由器初始用户名和密码。


    ### 使用 Medusa 工具


    `Medusa` 是一个开源暴力破解密码工具，可以破解多种在线密码，如 FTP、HTTP、IMAP 和 MYSQL。其中，路由器的管理界面基于 HTTP 协议，因此用户可以使用
    `Medusa` 工具实现密码破解。下文将介绍如何使用 `Medusa` 工具破解路由器密码。


    使用 `Medusa` 暴力破解路由器密码的语法格式如下：


    ```

    medusa -h [IP] -U [user file] -P [pass file] -M http -e ns

    ```


    对 TP-Linux 路由器的登录用户名和密码进行暴力破解。


    执行命令如下：


    ```

    root@exampleserver:～# medusa -h 192.168.1.1-u admin -P passords.txt

    ACCOUNT FOUND: [http] Host: 192.168.1.1 User: admin Password: daxueba [SUCCESS]

    ```


    上面的输出信息显示了破解路由器密码的过程。从显示的结果可以看出，路由器的用户名和密码已成功破解。其中，用户名为 `admin`，密码为 `daxueba`。


    ## 破解 Linux 密码


    在 Linux 中，许多操作需要 root 用户 `root` 执行。如果获取 Linux 远程会话的用户没有权限且无法提升权限，则会话是无用的。此时，用户可以破解
    Linux 系统的用户密码并登录目标系统。下文将介绍破解 Linux 用户密码的方法。


    Linux 系统将加密的密码哈希保存在名为 `shadow` 的文件中，默认保存在 `/etc/shadow`。只要破解了该文件，就可以查看用户的原始密码。但在破解
    `/etc/shadow` 密码之前，还需要 `/etc/passwd` 文件。该文件保存了用户的基本信息，如用户名、家目录和登录 Shell。破解 Linux
    用户密码的方法是提取 `/etc/shadow` 和 `/etc/passwd` 文件，将它们合并，然后使用密码破解工具进行破解。


    具体步骤如下：


    1) 为了方便输入，将获取的用户密码文件复制到 `/root`。


    执行以下命令：


    ```

    root@exampleserver:～# cp /etc/passwd /etc/shadow /root/

    ```


    执行上述命令后，`passwd` 和 `shadow` 文件将保存在 `/root` 目录下。


    2) 使用 `unshadow` 命令提取密码文件。


    执行命令如下：


    ```

    root@exampleserver:～# unshadow passwd shadow> cracked

    ```


    执行上述命令意味着 `passwd` 和 `shadow` 文件的内容被提取并保存到 `cracked` 目录中。


    3) 使用 `john` 工具破解密码。


    执行命令如下：


    ```

    root@exampleserver:～# john --wordlist=/usr/share/john/password.lst cracked

    ```


    警告：检测到哈希类型 "sha512crypt"，但该字符串也被识别为 "crypt"。使用 `--show` 选项显示所有破解的密码。注意：上述命令中的
    `--wordlist` 选项用于指定破解时的密码字典。从输出信息中，可以看到当前系统 root 的密码为 `daxueba`。此时，用户也可以使用 `--show`
    选项查看 `passwd` 中第二个字段的信息。


    执行命令如：


    ```

    root@exampleserver:～# john --show cracked

    ```


    从输出信息中，可以看到 `passwd` 中 root 的第二个字段已从原始密码占位符变更为真实密码。使用 John the Ripper 工具破解 Linux
    用户密码时，必须在该机器上操作。此外，`/etc/shadow` 和 `/etc/passwd` 两个文件必须具有读取权限。


