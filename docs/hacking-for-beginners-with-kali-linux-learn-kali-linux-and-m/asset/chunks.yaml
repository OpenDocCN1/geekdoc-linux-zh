    从输出信息中可以看出，攻击主机正在向网关发送 ARP 响应包，告诉网关目标主机的 MAC 地址为 `00:c:29:79:95:9e`（攻击主机的 MAC
    地址）。然而，目标主机的实际 MAC 地址为 `00:0c:29:6c:5d:69`。这说明网关已实施了 ARP 欺骗。


