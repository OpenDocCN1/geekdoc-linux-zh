    ### 无线网络的组成


    通常，无线网络由路由器和一个无线客户端组成。在技术术语中，路由器通常被称为 `AP`（接入点），而无线客户端被称为 `STA`（站点）。即带有无线网络网卡的客户端，如手机、笔记本电脑和平板电脑。在无线网络中，至少包含有一个
    `AP` 和一个或多个无线客户端。


    ***无线网络工作流***


    当用户对无线网络的结构有了清晰的后，将介绍其工作流。


    *该工作流包含以下四个步骤：*


    1) 因为 `AP` 定期广播 `SSID`，`STA` 可以监听 `AP` 发送的信号。当 `STA` 加入无线网络时，它会发送探测请求。当 `AP` 接收到请求后，将响应一个包含频段信息的响应包。此时，`STA`
    将切换到指定的频段。


    2) 随后 `STA` 将提供密码来认证无线网络。当 `AP` 确认 `STA` 提交的认证信息正确后，`STA` 将被允许访问无线网络。


    3) `STA` 和 `AP` 通常会建立关联。在关联过程中，`STA` 和 `AP` 应该根据信号强度协商速率，直到关联成功。在此期间，一个 `STA`
    同时只能与一个 `AP` 关联。


