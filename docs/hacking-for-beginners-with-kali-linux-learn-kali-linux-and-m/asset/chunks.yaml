    # Chapter 37: Wireless Network Security


    ![](images/00011.jpeg) ![](images/00010.jpeg)


    Wireless network security is a related setting used to protect wireless network
    security. In most routers, three wireless encryption methods are supported, which
    are `WEP`, `WPS` and `WPA/WPA2`. Moreover, in order to connect to the wireless
    network conveniently, users may not use encryption. This section will introduce
    these encryption methods and configurations.


    ## No password mode


    Password-free mode means that you can quickly connect to the wireless network
    without using a password. However, this model has no security. The following section
    will take `TP-LINK` router as an example to introduce each encryption mode of
    wireless network.


    The specific operation steps are as follows:


    1) Log in to the management interface of the router. Generally, the default address
    of a router is `192.168.1.1` or `192.168.0.1`. The router address in this example
    is `192.168.0.1`. Therefore, enter the address `http://192.168.0.1` in the browser
    and a password login dialog box will pop up.


    2) Enter the login user name and password in this dialog box, and then click `Login`
    to display the main interface of the router.


    3) Select `Wireless Settings` | `Wireless Security Settings` in the left column,
    and the interface that consists of various settings will be displayed.


    4) All supported encryption methods can be seen from this interface, including
    `WPA-PSK/WPA2-PSK`, `WPA/WPA2` and `WEP`. Set password-free mode here. Select
    the `Do not turn on wireless security` radio button. Then, click the `Save` button
    at the bottom and a prompt dialog box will pop up.


    5) This prompts the user to restart the router before the setting can take effect.
    Click `OK` button, and a prompt message of restarting the router will be displayed
    at the bottom of the interface.


    6) From this interface, you can see that the user has changed the wireless settings,
    which will take effect after restarting. At this time, click the `Restart` option,
    and the interface for restarting the router will pop up.


    7) Click the `Restart Router` button to restart the router. After startup, the
    settings will take effect. At this time, the user can quickly connect to the wireless
    network without entering a password.


    In the next section of this chapters, we will talk about wireless network modes
    by explaining few of the famous ones.


    ## Wireless Network Modes


    ### a) WEP mode


    `WEP` (Wired Equivalent Privacy) can encrypt the data wirelessly transmitted between
    two devices to prevent illegal users from eavesdropping or invading the wireless
    network. However, there are some shortcomings in this protocol, so it is easy
    to be attacked. At present, only few people use this encryption method.


    The setting method of `WEP` mode will be described below. Take `TP-LINK` router
    as an example to set `WEP` encryption mode.


    The specific operation steps are as follows:


    1) Log in to the management interface of the router. Then, select `Wireless Settings`
    | `Wireless Security Settings` in the left column, and the interface will be displayed.


    2) Select `WEP` radio button in this interface, that is, `WEP` encryption mode,
    and then the user can set the authentication type, key format and `WEP` key of
    this encryption mode. Among them, authentication types include `automatic`, `open
    system` and `shared key`. Key formats include `ASCII` and `hexadecimal`. When
    the user chooses the `open system`, the host in the wireless network can pass
    the authentication and associate with the wireless network without providing the
    authentication password.


    However, if you want to transmit data, you must provide the correct password.
    When the user chooses the `shared key`, the host in the wireless network must
    provide the correct password to pass the authentication. Otherwise, the wireless
    network cannot be associated and data transmission cannot be performed. If the
    user does not want to make settings, he can select the `automatic` option. For
    `WEP` key format, users can choose according to their own preferences. After using
    the setting, click the `Save` button so that a prompt dialog box will pop up.


    3) Click `OK` to display the interface thats shows all the settings you have selected.


    4) Click the `Restart` button to display the interface of restarting the router.


    5) Click the `Restart Router` button to restart the router. After the router restarts,
    users can connect to the wireless network through `WEP` encryption.


    ### b) WPA/WPA2 mode


    `WPA` (Wi-Fi Protected Access), which has two standards, `WPA` and `WPA2`, is
    a system to protect the network security of wireless computers. `WPA/WPA2` was
    created to replace `WEP` because of the serious weakness in `WEP` protocol. Although
    this encryption method is very safe, the user can still crack the password by
    capturing the handshake.


    The following describes the setting method of `WPA/WPA2` mode.


    The specific operation steps are as follows:


    1) Log in to the router and open the wireless settings interface.


    2) It can be seen from this interface that two `WPA/WPA2` encryption modes are
    provided. Among them, `WPA-PSK/WPA2-PSK` is aimed at small enterprises or home
    networks. `WPA/WPA2` mode is generally used in large enterprises.


    Then, set the authentication type, encryption algorithm and `PSK` password. Authentication
    types include `automatic`, `WPA-PSK` and `WPA2-PSK`. Encryption algorithms include
    `automatic`, `TKIP` (the new `802.11n` does not support this encryption algorithm)
    and `AES`. Select the `Automatic` option here, and then click the `Save` button.
    Next, restart the router for the settings to take effect.


    ### 3) WPS mode


    `WPS` (Wi-Fi Protected Setup), which is an optional authentication project organised
    and implemented by WiFi alliance, is mainly for simplifying wireless network setup
    and wireless network encryption.


    Generally, when users create a new wireless network, they will set the wireless
    network name (`SSID`) and wireless encryption method to ensure the security of
    the wireless network. When these settings are completed, the client must enter
    the network name and lengthy wireless encryption password when connecting to this
    wireless network. For convenience of input, you can quickly connect to the wireless
    network through `WPS` mode.


    Tip: In routers, some buttons are displayed as `WPS`, and some routers'' buttons
    are displayed as `QSS`.


    The specific operation steps are as follows:


    1) Log in to the router and select the `QSS` security setting option, and the
    interface with additional data will be displayed.


    2) From this interface, you can see that the `QSS` function status is closed,
    that is, the `WPS` function is not enabled. Here, click the `Enable QSS` button
    to start the `WPS` function. After clicking the `Enable QSS` button, the prompt
    dialog box for restarting the router will be displayed.


    3) Click `OK` to display the interface about the restarting functionalities.


    4) Click the `Restart` button to display the dialog box for restarting the router.


    5) After restarting the router, you can see that the `WPS` function has been successfully
    enabled.

