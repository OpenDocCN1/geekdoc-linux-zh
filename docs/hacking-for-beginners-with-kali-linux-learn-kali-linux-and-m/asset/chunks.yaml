    device" option and can then enter the device name.


    21) When the GRUB bootloader installation is completed, the "End Installation
    Process" dialog box will be displayed.


    22) From this dialog box, you can see that the operating system has been installed.
    In the immediate Next instance, the operating system needs to be restarted. Click
    the "Continue" button in this dialog box to end the installation process and restart
    the operating system.


    23) From this dialog box, you can see that the installation process is almost
    ending. When the installation process is over, the operating system will be restarted
    automatically. After the system starts, a login dialog box will be displayed.


    24) Enter the user name for logging in to the system in this dialog box. Enter
    the super user root here, and click the "Next" button, a password input dialog
    box will be displayed.


    25) In this dialog box, enter the password of the super user root, which is the
    password set during the installation of the operating system. After entering the
    password, click the "Login" button. If you successfully log in to the system,
    you will see the interface with additional details.


    26) When you see this interface, it means that the root user has successfully
    logged in to the system. From now, users can implement various penetration tests
    in the operating system.


    ***What Next?***


    Although Virtual Machines are popular they are not in much use as Physical machines.
    So, we have provided a guide for beginners who are looking to install Kali in
    a Physical Machine. In the next chapter, we will discuss about Physical machine
    installation with clear details. Follow along!


    ## Chapter 3


    # Installation of Kali in a Physical Machine


    ![](images/00003.jpeg) ![](images/00002.jpeg)


    While Virtual machines are quite popular among the industry they are still not
    used by majority of hackers for various reasons. It is evident that physical machine
    installation of Kali Linux is as important to understand as the Virtual machine
    installation. This is the reason we included a separate chapter for your better
    understanding. Let us learn now.


    **Why is Physical machine installation necessary?**


    Most users feel that the operation in the virtual machine is not very real, and
    sometimes the operation in the virtual machine is not smooth. If you want to experience
    the feeling of using a physical machine to implement penetration testing, you
    need to install the Kali Linux operating system on the physical machine. To install
    an operating system on a physical machine, you need to prepare the installation
    medium and partition the hard disk in advance. Otherwise, due to operating errors,
    hard disk data loss may occur. This section will introduce the method of installing
    the operating system on a physical machine.


    ***Install Win32Disk Imager tool***


    Win32Disk Imager tool is mainly used to write ISO/img files to SD card or USB
    card. For most people nowadays, the method of installing a system using a CD is
    rarely used. Moreover, today''s computers basically don''t come with an optical
    drive. Therefore, using a U disk to install the operating system is the most convenient
    and quick way. If you want to use a U disk to install the system, you need to
    make the U disk as an installation disk. At this point, you need to use the Win32Disk
    Imager tool to achieve. The tool is not installed in the system by default, so
    you need to install the tool first. The following section will introduce the specific
    installation method.


    *The specific steps are as follows:*


    1) Download the software package from the website https://sourceforge.net/projects/win32diskimager/.
    The software package is named Win32DiskImager-1.0.0-install.exe.


    2) Install Win32Disk Imager tool. Double-click the downloaded software package
    and the license agreement dialog box will be displayed.


    3) This dialog box shows the license information for installing Win32Disk Imager
    tool. Select the I accept the agreement radio button and click the Next button.
    A dialog box for selecting the target installation location will be displayed.


    4) This dialog box is used to select the installation location of the Win32Disk
    Imager tool. By default, it will be installed in the C:\Program Files(x86)ImageWriter
    directory. If the user wants to re-specify the installation location, you need
    to click the Browser button to set it. Then, click the Next button, and a dialog
    box for setting the folder of the startup menu bar will be displayed.


    5) This dialog box is used to set the folder name in the startup menu bar. Here
    use the default setting Image Writer, and click the Next button, so that the dialog
    box for selecting additional tasks will be displayed.


    6) Set whether or not to create a shortcut in this dialog box. In order to start
    the program conveniently, it is recommended that the user creates a shortcut.
    Select the Create a desktop shortcut icon check box and click the Next button
    so that the ready to install dialog box will be displayed.


    7) This dialog box displays the detailed information set before, and it will be
    ready to install Win32DiskImager. If you need to modify the settings, you can
    click the Back button to return to modify the settings. Otherwise, you need to
    click the Install button to start installing the tool. After the installation
    is completed, a dialog box for completing the setup wizard will be displayed.


    8) From this dialog box, you can see that the Win32Disk Imager tool has been installed.
    Click the Finish button to automatically start the tool. If the user does not
    want to start the tool directly, you can deselect the Launch Win32DiskImager checkbox.
    If you select the View README.txt check box, the README.txt file will be opened.
    This file shows detailed information about the Win32Disk Imager tool, such as
    functions, architecture descriptions, common problems, etc.


    ### Make USB installation disk'
