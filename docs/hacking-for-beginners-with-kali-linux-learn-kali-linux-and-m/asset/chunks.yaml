    `Utilman` is a Windows auxiliary tool manager. Under Windows, even if there is
    no user login, you can use the `Windows+U` key combination to call the `Utilman`
    process. With this mechanism, the Windows login authentication mechanism can be
    bypassed to operate the system. This section will introduce how to use this method.


    By replacing the `Utilman.exe` file with `cmd.exe`, bypassing the login operation.


    The specific steps are as follows:


    1) On a Windows computer, use the U disk installation medium to enter the `Kali
    Linux` Live mode. First start the U disk installation medium, the system installation
    guide interface will be displayed.


    2) Select `Live (amd64)` on this interface to enter Live mode. Then, open the
    Windows file system in this Live mode. As shown, select `Places|Computer` in this
    interface.


    3) After clicking the `Computer` option on this interface, the local computer
    file system will be opened.


    4) This interface displays the file list of the Linux Live system. At this point,
    select the `Other Locations` command in the left column to see other hard disk
    files.


    5) This interface shows all the disk partitions in the computer. According to
    the displayed partition size, find the partition of the Windows system. In this
    example, the partition of the Windows system is `322GB Volume`. Therefore, opening
    the hard disk partition will display the file list of the Windows system.


    6) In this interface, enter the `Windows|System32` folder in turn, the content
    shown will be displayed.


    7) Find the `Utilman.exe` file in the folder and rename the file to `Utilman.old`.
    Then copy the `cmd.exe` file in the directory as a copy, and modify its file name
    to `Utilman.exe`. Next, turn off `Kali Linux Live` mode and start the Windows
    system. Press `Wins+U` key combination on the login interface, the interface shown
    will be displayed.


    8) From this interface, you can see that a command prompt window is opened. In
    this window, you can execute various terminal commands. For example, use the `whoami`
    command to view user information.


    9) It can be seen from the output information that the current user has the highest
    authority. At this time, any operation can be performed.


    ## Router Password Cracking


    The router is the core device of a network. Once the router is controlled, it
    is easy to carry out various data sniffing and spoofing attacks on hosts connected
    to the router. Most routers use username/password authentication methods. The
    management interface of each router has an initial user name and password. Due
    to the mistakes of some administrator users, initial passwords or weak passwords
    may be used. This section will introduce the common methods to crack the router
    password.


    ### Initial router password


    Most routers have an initial username and password. In order to facilitate users
    to implement router password cracking, the following will list common router initial
    user names and passwords.


    ### Using Medusa Tools


    `Medusa` is an open source brute force password cracking tool that can crack a
    variety of passwords online, such as FTP, HTTP, IMAP and MYSQL. Among them, the
    management interface of the router is based on the HTTP protocol, so users can
    use the `Medusa` tool to implement password cracking. The following will introduce
    how to use `Medusa` tool to break the router password.


    The syntax format of using `Medusa` to brute force the router password is as follows:


    ```

    medusa -h [IP] -U [user file] -P [pass file] -M http -e ns

    ```


    Brute force cracking of the login user name and password of the TP-Linux router.


    The execution command is as follows:


    ```

    root@exampleserver:～# medusa -h 192.168.1.1-u admin -P passords.txt

    ACCOUNT FOUND: [http] Host: 192.168.1.1 User: admin Password: daxueba [SUCCESS]

    ```


    The information output above shows the process of cracking the router password.
    From the displayed results, we can see that the username and password of the router
    have been successfully cracked. Among them, the user name is `admin` and the password
    is `daxueba`.


    ## Crack Linux Password


    In Linux, many operations require the root user `root` to perform. If the user
    who obtains a Linux remote session does not have permission and cannot raise the
    permission, the session is useless. At this point, the user can crack the user
    password of the Linux system and log in to the target system. The following will
    introduce the method of cracking Linux user password.


    The Linux system saves the encrypted password hash in a file named `shadow`, which
    is saved in `/etc/shadow` by default. As long as the file is cracked, the original
    password of the user can be viewed. But before cracking the `/etc/shadow` password,
    the `/etc/passwd` file is also required. This file saves the user''s basic information,
    such as user name, home directory, and login Shell. Cracking the Linux user password
    is to extract the `/etc/shadow` and `/etc/passwd` files, combine them, and then
    use a password cracking tool to crack.


    The specific steps are as follows:


    1) To facilitate input, copy the obtained user password file to `/root`.


    Execute the following commands:


    ```

    root@exampleserver:～# cp /etc/passwd /etc/shadow /root/

    ```


    After executing the above command, the `passwd` and `shadow` files are saved in
    the `/root` directory.


    2) Use the `unshadow` command to extract the password file.


    The execution command is as follows:


    ```

    root@exampleserver:～# unshadow passwd shadow> cracked

    ```


    Executing the above command means that the contents of the `passwd` and `shadow`
    files are extracted and saved in the `cracked` directory.


    3) Use the `john` tool to crack the password.


    The execution command is as follows:


    ```

    root@exampleserver:～# john --wordlist=/usr/share/john/password.lst cracked

    ```


    Warning: detected hash type "sha512crypt", but the string is also recognized as
    "crypt". Use the `--show` option to display all of the cracked passwords. Note:
    The `--wordlist` option in the above command is used to specify a password dictionary
    for cracking. From the output information, you can see that the password of the
    current system root is `daxueba`. At this time, the user can also use the `--show`
    option to view the information in the second field of `passwd`.


    Execute commands such as:


    ```

    root@exampleserver:～# john --show cracked

    ```


    From the output information, you can see that the second field of root in passwd
    has changed from the original password placeholder to the real password. Using
    John the Ripper tool to crack Linux user passwords, you must operate on this machine.
    Moreover, the two files `/etc/shadow` and `/etc/passwd` must have read permissions.

