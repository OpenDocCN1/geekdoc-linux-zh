    ### 什么是 Nessus？


    `Nessus` 目前是一种常用的系统漏洞扫描和分析软件。该工具提供完整的漏洞扫描服务并不断更新其漏洞数据库。此外，`Nessus` 可以同时在本地或远程操作以执行系统漏洞分析和扫描，使其成为为渗透测试人员开发的最重要的软件之一。本节将介绍使用
