    The power of Metasploit framework is that it provides a large number of penetration
    testing modules and plug-ins. These modules can be divided into 7 types according
    to different purposes, namely `Exploits` (infiltration attack module), `Auxiliary`
    (auxiliary module), `Post` (post infiltration attack module), `Payloads` (attack
    payload module), `Encoders` (encoder module), `Nops` (Empty instruction module)
    and `Evasion` (avoidance module). The functions of these 7 modules and plug-ins
    will be introduced below.


    ### ① Penetration attack module


    The penetration attack module mainly uses the discovered security vulnerabilities
    or configuration weaknesses to attack the target system to implant and run the
    attack load, thereby gaining access control rights of the target system. The penetration
    attack module in the Metasploit framework can be divided into active penetration
    attacks and passive penetration attacks according to the location of the security
    vulnerabilities.


    Among them, the difference between these two types of attacks is as follows.


    - Active penetration attacks:

    The exploited security vulnerabilities are located in the network server software
    and the upper-layer applications carried by the server software. Because these
    services usually open some listening ports on the host and wait for the client
    to connect. By connecting to the network service of the target system, injecting
    some specially constructed network request content containing "malicious" attack
    data, triggering security vulnerabilities, and causing the remote server to execute
    the attack load contained in the "malicious" data, thereby obtaining the control
    authority of the target system.


    - Passive penetration attacks:

    The exploited vulnerabilities are located in client software (such as browsers,
    browser plug-ins, email clients, Office and Adobe and other documents and editing
    software). For such security vulnerabilities, penetration testers cannot actively
    input data into the client software from remote, so they can only use passive
    penetration attacks.


    Commonly used passive penetration attacks include constructing "malicious" web
    pages, emails or document files, and by setting up servers containing such malicious
    content, sending email attachments, combining social engineering attack distribution,
    combining network deception and hijacking techniques Etc., to trick the target
    user into opening or accessing these malicious content on the target system, thereby
    triggering a security hole in the client software to obtain a `Shell` session
    that controls the target system.


    ### ② Auxiliary module


    Auxiliary modules include scanning and detection of various network services,
    building false services to collect login passwords, password guessing and other
    modules. In addition, the auxiliary modules also include some attack payloads
    that do not need to be loaded. These modules are not used to obtain remote control
    of the target system, such as a denial of service attack.


    ### ③ Post-penetration attack module


    The post-penetration attack module is mainly used to obtain the remote control
    of the target system.Various post-infiltration attacks are carried out in the
    control system, such as acquiring sensitive information, further expansion, and
    implementation of springboard attacks.


    ### ④ Attack load module


    The attack payload is a piece of embedded code that prompts the target system
    to run after a successful penetration attack. The usual function is to open a
    control session connection on the target system for an infiltration attacker.
    In the traditional penetration code development, the attack payload is just a
    simple `ShellCode` code, compiled in assembly language and converted into machine
    code supported by the CPU architecture of the target system.


    After the penetration attack triggers the vulnerability, the program execution
    flow is hijacked and jumped into this code for execution, thereby completing a
    single function in `ShellCode`. Metasploit attack payloads are divided into three
    types: `Single` (independent), `Stager` (transmitter) and `Stage` (transmission
    body).


    The differences between these three attack payload types are as follows:


    - Single:

    It is a completely independent payload, and it is as easy to use as running `calc.exe`,
    such as adding a system user or deleting a file. Since `Single Payloads` are completely
    independent, they may be captured by non-Metasploit processing tools like `netcat`.


    - Stager:

    This payload is responsible for establishing a network connection between the
    target user and the attacker, and downloading additional components or applications.
    A common `Stager Payload` is `reverse_tcp`, which allows the target system to
    establish a TCP connection with the attacker, allowing the target system to actively
    connect to the port of the penetration tester (reverse connection). Another common
    one is `bind_tcp`, which allows the target system to open a TCP listener, and
    the attacker can communicate with the target system at any time (forward connection).


    - Stage:

    It is a kind of Payload component under Stager Payload, this kind of Payload can
    provide more advanced functions, and there is no size limit.


    ### ⑤ Empty instruction module


    Null instructions (`NOP`) are some no-operation or irrelevant operation instructions
    that will not cause any substantial impact on the running state of the program.
    The most typical no-instruction is no-operation. The opcode on the X86 CPU architecture
    platform is `ox90`.


    When an infiltration attack constructs a malicious data buffer, it is often necessary
    to add an empty command area before the `shell code` to be executed. In this way,
    when the infiltration attack is triggered and the `ShellCode` is executed, there
    will be a larger safe landing area, so as to avoid the `ShellCode` execution failure
    caused by the randomization of the memory address and the calculation deviation
    of the return address, and to provide the reliability of the infiltration attack.


    ### ⑥ Encoding module


    After the attack payload and the empty instruction module are assembled to complete
    an instruction sequence, the Metasploit framework needs to be encoded before the
    instruction is added to the malicious data buffer by the infiltration attack module
    and sent to the target system to run. The encoding module has two main functions:
    first, to ensure that "bad characters" do not appear in the attack load; second,
    to "free" the attack load, that is, to avoid anti-virus software, IDS intrusion
    detection system and IPS intrusion prevention system detection and interception.


    ### ⑦ Evasion modules


    The evasion module is newly added in Metasploit 5. Users can use the evasion module
    to evade Windows Defender Firewall. Windows Defender is now a firewall tool that
    comes with the Windows system. It can not only scan the system, but also monitor
    the system in real time. 8. Plugin Plug-ins can expand the functions of the framework,
    or encapsulate existing functions to form components of advanced functions. The
    plug-in can be used to integrate some external security tools, such as Nessus,
    OpenVAS vulnerability scanner, etc.


