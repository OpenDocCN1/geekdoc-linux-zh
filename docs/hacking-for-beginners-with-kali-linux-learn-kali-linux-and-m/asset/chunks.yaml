    ### How to discover a host?


    The discovery host is used to detect which hosts are active, and then obtain information
    about the available hosts. Users can use active scanning to discover the host,
    or can use passive monitoring to discover the host. This section will explain
    these two methods in detail with detailed instructions.


    **Confirm network range**


    Before detecting a target, it is often necessary to clarify the possible range
    of the target. This range may be a specific host, it may be an address range,
    or it may sometimes even be an entire subnet. Regardless of the range, it usually
    should and will follow the IP address rules. According to the IP rules, the possible
    range of the target can be drawn. So, it is important that a penetration tester
    is aware of the IP addressing rules that have been designed.


    1.  ***IP address rules***'
