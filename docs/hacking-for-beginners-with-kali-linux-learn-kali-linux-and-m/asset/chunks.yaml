    1) In the graphical interface, select `Applications`|`Vulnerability Exploitation
    Tool Set`|`armitage` command in turn to start Armitage tool.


    2) This dialog box shows the basic information of connecting to Metasploit service.
    Click the `Connect` button and the dialog box will be displayed.


    3) This dialog box prompts whether to start Metasploit''s RPC service. Click the
    `Yes (Y)` button, and the dialog box will be displayed.


    4) This dialog box shows the progress of connecting to Metasploit. When successfully
    connected to the Metasploit service, the interface will be displayed.


    5) If you see this interface, it means that the Armitage tool has been successfully
    started. Next, users can use the tool to implement penetration testing. There
    are 3 parts in this interface, which are marked as A, B and C respectively.


    *   Part A: Display pre-configured modules. Users can use the space bar in the
    module list to search for the modules provided.

    *   Part B: Shows the active target system and users can perform exploit attacks.

    *   Part C: Display multiple Metasploit tags. In this way, you can run multiple
    Meterpreter commands or console sessions and display them simultaneously.


    For example, to implement Nmap Ping scan on the target host, you can select the
    `Hosts|Nmap Scan|Ping Scan` command in turn.


    6) After selecting the Ping Scan command on this interface, you can perform Ping
    scan on the target host.


    ## 2) Metasploit terminal Msfconsole


    MSF terminal (`msfconsole`) is currently the most popular user interface of the
    Metasploit framework, and MSF terminal is one of the most flexible, feature-rich,
    and best-supported tools in the Metasploit framework. The MSF terminal provides
    a one-stop interface that can set almost every option and configuration in the
    Metasploit framework. The user can use the MSF terminal to do anything, including
    launching an infiltration attack, loading auxiliary modules, performing an enumeration,
    creating a listener, or performing automated infiltration attacks on the entire
    network. The terminal mode of Metasploit will be introduced below.


    ### Start the terminal mode of Metasploit


    The execution command is as follows:


    ```bash

    root@exampleserver:～# msfconsole

    ```


    After executing the above command, you can successfully start Metasploit''s terminal
    mode.


    ```bash

    msf5>

    ```


    Seeing the command line prompt as `msf5>`, it means that Metasploit''s terminal
    mode has been successfully started. From the output information, you can see the
    supported attack modules and the corresponding number.


    For example, there are 2343 penetration attack load modules, 1923 auxiliary modules,
    328 post-penetration attack modules, 546 attack load modules, 44 encoding modules,
    10 empty command modules, and 2 evasion modules. Next, users can use these attack
    payloads to perform penetration testing.


    ### Initialize Metasploit


    In Kali Linux, Metasploit mainly uses `PostgreSQL` database to store data. Therefore,
    when using the Metasploit framework, you need to start the `PostgreSQL` database.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# service postgresql start

    ```


    In addition, start the PostgreSQL database later, you also need to use the `msfdb
    init` command to create and initialize the database.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# msfdb init

    ```


    #### Initialize the database Creating initial database schema


    From the above output information, you can see that the `msf` and `msf_test` databases
    are automatically created. Moreover, the database configuration file `database.yml`
    is created.


    Prompt: If the current system has initialized Metasploit, it will prompt that
    the database has been configured. as follows:


    ```

    Metasploit running on Kali Linux as root, using system database

    A database appears to be already configured, skipping initialization

    ```


    ### Create Workspace


    In order to distinguish different scanning tasks, multiple workspaces can be created
    to save various information of different scanning tasks. Among them, the information
    between different work areas is independent of each other to avoid data confusion.


    The syntax format for creating a workspace is as follows:


    ```bash

    workspace -a [name]

    ```


    In the above syntax, the `-a` option means to add a workspace.


    Create a workspace named `test`.


    The specific steps are as follows:


    1) Check the current working area.


    The execution command is as follows:


    ```bash

    msf5> workspace * default

    ```


    As you can see from the output information, there is only one default workspace
    by default. Moreover, the workspace is currently in use.


    2) Create a new workspace.


    The execution command is as follows:


    ```bash

    msf5> workspace -a sample

    ```

    `[*] Added workspace: sample [*]`

    `Workspace: sample`


    From the output information, you can see that the workspace `sample` is successfully
    added. Moreover, it has automatically switched to the newly created workspace.


    3) View the current working area.


    The execution command is as follows:


    ```bash

    msf5> workspace default * sample

    ```


    As can be seen from the information, there are currently two working areas. Among
    them, `sample` is just created and is currently in use. If the user wants to switch
    the workspace, he can use the `workspace [name]` command to switch.


    4) Switch work area.


    The execution command is as follows:


    ```bash

    msf5> workspace default [*] Workspace: default

    ```


    Seeing the information output above, it means that you have successfully switched
    to the default workspace.


    ### Import scan report


    When the user prepares the workspace, he can perform penetration testing. At this
    point, users can import some-party scan reports to obtain host information.


    Among them, the syntax format of the imported report is as follows:


    ```bash

    db_import [example...]

    ```


    In the above syntax, the parameter `filename` indicates the name of the file.


    Import the scan report `openvas.xml` generated by OpenVAS.


    The specific steps are as follows:


    1) Before importing the scan report, the user can check the supported report format.
    as follows:


    ```bash

    msf5> db_import Usage: db_import [example...]

    ```


    Filenames can be globs like `.xml`, or `/.xml` which will search recursively From
    the output information, you can see all report types supported for import, such
    as Nessus XML, Nmap XML, and OpenVAS XML.


    2) Import the scan report `openvas.xml`.


    The execution command is as follows:


    ```bash

    msf5> db_import /root/openvas.xml

    ```

    `[*] Importing''OpenVAS XML'' data`

    `[*] Successfully imported /root/openvas.xml`


    Seeing the above output information, it means that the report file `openvas.xml`
    has been successfully imported.


    3) View the imported host.


    The execution command is as follows:


    ```bash

    msf5> workspace -v *

    ```


    From the output information, we can see that there are 3 hosts and 8 services
    in the default workspace. It can be explained that the information of 3 hosts
    has been imported.

