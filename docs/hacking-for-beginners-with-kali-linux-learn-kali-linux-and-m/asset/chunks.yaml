    在确定了渗透测试的目标和范围后，下一步是进入信息收集阶段。在此阶段，渗透测试人员需要使用各种公共资源来尽可能地获取关于测试目标的信息。在此期间，渗透测试人员可以使用互联网收集信息，例如官方网站、论坛和博客。


    同时，你也可以使用主要的搜索引擎（如 Yahoo 和 Google）来获取相关信息。你还可以使用 `Kali Linux` 中的一些工具来收集 DNS 信息、注册者信息、服务信息、WAF
    信息。在此阶段收集的信息越充分，对随后的渗透测试就越有利，渗透测试的成功率也会得到大大提高。


    正如一位著名的渗透测试员所说：


    “如果你想成为一名优秀的渗透测试员，请花 70% 的时间在收集有关目标的信息上”


    ### 3) 漏洞扫描


    在渗透测试人员收集了足够信息后，就可以对目标进行漏洞扫描。在此阶段，渗透测试人员通过网络探测目标系统，向目标系统发送数据，并将反馈数据与内置的漏洞签名数据库进行匹配，从而列出目标系统中的安全漏洞。


    ### 4) 漏洞利用


    渗透测试人员检测到目标主机的漏洞后，可以通过现有的漏洞利用程序渗透目标系统。然而，通常情况下，渗透测试人员需要考虑目标系统的环境，对漏洞利用程序进行修改和收集额外的研究，否则它将无法正常工作。


    ### 5) 编写报告


    完成渗透测试后，你需要为这次渗透测试编写一份测试报告。准备好的报告需要包含所有获取的有价值信息，以及检测和发现的安全漏洞、成功的攻击过程，以及对业务的影响和后果分析。同时，必须清楚地写出目标系统的漏洞以及修复漏洞的方法。这样，目标用户就可以根据渗透测试人员提供的报告来修复这些漏洞和风险，以防止黑客攻击。


    ### Kali Linux 系统概述


    `Kali Linux` 是一个基于 Debian 的 Linux 发行版，包含许多与安全和取证相关的工具。它由 Offensive Security Ltd
    维护和资助。本节将介绍本书中使用 `Kali Linux` 的原因以及该系统的发展历史。


    如果你想使用 `Kali Linux` 系统进行渗透测试，必须首先安装该系统。自己安装这个 Linux 发行版具有一定难度。因此，我们专门包含了一个章节，帮助你理解在个人个人电脑上安装
    `Kali Linux` 的步骤。


    #### 为什么要使用 Kali Linux？


    `Kali Linux` 的发布主要面向数字取证和渗透测试专家。在本书中使用 `Kali Linux` 系统实施渗透测试有两个主要原因：


    1. **工具仓库**

    `Kali Linux` 系统提供了一个强大的工具仓库，并预装了许多渗透测试软件，例如 `Nmap`（端口扫描器）、`Wireshark`（包分析器）、`John
    the Ripper`（密码破解器）和 `Aircrack-ng`（无线域网渗透测试软件）。如果用户使用其他操作系统，他们需要手动安装相关工具。渗透测试通常大量的工具。收集这些工具并不是一项简单的任务，而且代码的安全无法保证。此外，如果用户手动安装，可能需要配置复杂的环境。如果用户想更简单、快速地实现渗透测试，`Kali
    Linux` 是最佳选择。如果你对 `Kali Linux` 不满意，还有一个针对安全专家的替代品称为 Parrot Linux。然而，本书将使用 `Kali
    Linux` 来介绍黑客概念。


    2. **持续更新**

    `Kali Linux` 系统的更新速度相对快，稳定版每 3 个月更新一次，每周会发布更新版本。因此，用户可以随时更新，并尽早使用新系统和最新的工具。此外，操作系统的更新非常方便，不需要用户手动更新。


    ### Kali Linux 历史


    为了让读者更多地了解 `Kali Linux` 系统，在这里我们将介绍它的发展历史。


    **1) 以前称为 BackTrack Linux**

    `BackTrack Linux` 是一套专业的计算机安全监控 Linux 操作系统，被称为 `BT`。`BackTrack` 不仅用于监控平台（WarDriving），还整合了
    200 多个安全渗透工具，包括 `Metasploit`。此外，大量的 RFID 工具以及对 `ARM` 平台的支持也是它的亮点。目前，`BackTrack`
    已被 `Kali Linux` 取代且不再维护。


    **2) 历史版本**

    `Kali Linux` 自发布以来有 4 个版本代码，即 `moto`、`kali`、`sana` 和 `kali-rolling`。其中，每个版本代码代表
    `Kali Linux` 的不同版本。用户可以通过修改软件源中的版本代码更新到对应版本的系统。


    ### 渗透测试员的法律边界


    在实施渗透测试时，获得准确的书面授权是非常重要的。如果不明确，可能会导致用户面临法律诉讼，更有可能因此入狱。


    **获取合法授权**

    在对目标主机进行渗透测试时，渗透测试人员首先需要获得目标所有者的合法授权。这样就可以避免因非法渗透测试引起的不法律争议和其他问题。


    **某些操作的危害性**

    在渗透测试过程中，某些操作具有特定的危害，例如占用系统资源和遗留后门。因此，渗透测试人员需要提前告知目标主机所有渗透测试可能产生的影响，并要求对方确认。


    **总结：**


    * 我们提供了渗透测试的简单介绍以及所进行的各种测试类型。

    * 详细解释了渗透测试过程及其包含的阶段。

    * 介绍了 `Kali Linux` 及其历史。

    * 提供了需要重视的法律边界信息。


    在下一章中，我们将讨论如何在虚拟机和物理机上安装 `Kali Linux`。请继续阅读！


    第 2 章


    # 在虚拟机中安装 Kali


    ![](img/00003.jpeg) ![](img/00002.jpeg)


    前一章是对黑客世界的很好的介绍。本章对于努力创建自己黑客环境的初学者来说是一个重要的资源。众周知，黑客总是依赖 Linux 进行日常工作。Windows 和
    Mac 是很好的生产力操作系统，但并不适合黑客。在本章中，我们将深入讨论 Kali（一个著名的黑客 Linux 发行版）的安装。让我们开始吧！


    ### 下载 Linux 镜像


    要在电脑上安装 `Kali Linux` 操作系统，你需要系统的镜像文件。为了避免下载过程中出现数据传输错误，建议读者验证其完整性。


    **如何获取 Kali Linux 的镜像？**


