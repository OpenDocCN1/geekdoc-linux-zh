    3) 此界面显示了某些可特定的扫描任务模板。此外，你还可以在 `User Defined`（自定义）标签页下查看用户手动创建的策略模板。在这里你可以选择之前创建的策略来创建扫描任务，点击
    `User Defined` 标签页，将显示用户创建的策略模板。


    4) 点击策略模板 `sample`，将显示 `New Scan Task` 对话框。


    5) 在此界面中设置扫描任务名称、描述信息、文件夹和扫描目标。设置上述信息后，点击 `Save` 按钮即可看到新创建的扫描任务。


    6) 从此界面，你可以看到已创建了一个名为 `Network Scan` 的新扫描任务。


    ### 扫描漏洞


    在完成前面的操作后，将配置 `Nessus` 服务。在下文节中将实施漏洞扫描。在这里，我们使用之前创建的扫描任务来执行漏洞扫描。


    实施漏洞扫描的具体步骤如下：


    1) 打开扫描任务界面。


    2) 点击 `run` 按钮开始扫描目标主机。


    3) 从此界面，你可以看到扫描任务的状态为 `(Running)`，表示扫描正在进行。如果你想停止扫描，可以点击 `Stop` 按钮。如果扫描任务已暂停，点击
    `Pause` 按钮。扫描完成后，界面将显示。


    4) 从此界面，你可以看到扫描状态显示为图标，这意味着扫描已完成。点击扫描任务名称 `Network Scan` 以查看扫描结果。


    5) 此界面显示了所有扫描的主机及其漏洞信息。从显示的结果，你可以看到扫描的主机数量为 8，漏洞数量为 99，扫描历史数量为 `1`。如你从 `Vulnerabilities`
    列所示，不同级别的漏洞及其数量以不同的颜色显示。


    用户将鼠标悬停在每种颜色上也可以查看漏洞的百分比。在右下角，饼图显示了每个漏洞的比例，在饼图右侧显示了每个漏洞的安全级别。


    其中，颜色安全级别为 `Critical (非常严重，红色)`、`High (较严重，橙黄色)`、`Medium (中等，黄色)`、`Low (中低，绿色)`、`Info
    (信息，蓝色)`。在下一节中，用户可以查看并分析每个主机的漏洞信息。


    ### 分析并导出漏洞扫描报告


    用户扫描目标主机后，可以分析扫描结果并获取目标主机的漏洞信息。为了方便用户分析扫描结果，`Nessus` 支持用户从扫描结果生成不同格式的报告。其中，`Nessus`
    支持的文件格式包括 `Nessus`、`PDF`、`HTML`、`CSV` 和 `Nessus DB`。


    下面将详细介绍分析和导出漏洞扫描报告的方法。请跟上操作！


    #### 1. 分析漏洞扫描结果


    分析通过扫描软件获得的结果非常重要。通过分析和编写报告，你可以向系统管理员或人员完美地展示你的结果。许多渗透测试人员忽略了报告的重要性。但应该记住，一份良好的报告可以使问题或漏洞尽快修复。


    具体步骤如下：


    1. 打开 `Nessus` 软件程序的扫描结果界面。


    2. 界面显示了所有目标主机的扫描结果。


    例如，要获取主机 `192.168.343.129` 的漏洞扫描结果分析，请点击打开窗口中的目标主机地址 `192.168.343.129`，以显示所有已识别的漏洞。


    1. 从界面中，你可以找到在该主机上检测到的漏洞数量。


    漏洞列表通常包含 4 列：


    `Sev`（严重程度）、`Name`（插件名称）、`Family`（插件族）和 `Count`（漏洞数量）。界面右侧的 `Host Details` 显示了目标主机的基本信息，包括
    IP 地址、MAC 地址、操作系统类型和扫描时间。


    如果你想查看漏洞的详细信息，请点击相应的插件名称查看漏洞的详细信息。


    例如，要查看 `Bind Shell Backdoor Detection` 漏洞的详细信息，将显示该界面。(4) 此界面显示了 `Bind Shell Backdoor
    Detection` 漏洞的描述信息、解决方案、输出信息和开放端口。在右侧的 `Plugin Details`，显示了漏洞的级别、`ID`、版本、类型和插件族，并显示了相关的风险信息。


    通过对漏洞的分析，已知该漏洞允许用户远程连接端口并直接执行 `id` 命令。其中提供的解决方案是确定目标主机是否启用了远程登录，或者重新安装系统。


    #### 2. 生成扫描报告


    为了方便用户分析其他漏洞，可以将扫描结果导出到报告文件中。此外，用户还可以将扫描报告导入到其他工具（如 `Metasploit`）中备用。下面将描述生成扫描报告的方法。


    用例：


    将扫描结果导出为 `Nessus` 格式的报告。


    具体步骤如下：


    1. 点击扫描结果界面菜单栏中的 `Export` 下拉菜单，将显示出所有报告格式。


    2. 下拉菜单显示了所有可以生成漏洞报告的格式。点击 `Nessus` 命令，将弹出一个保存报告文件的对话框。


    3. 在此对话框中选择 `Save File` 单选按钮，然后点击 `OK` 按钮生成报告文件。


