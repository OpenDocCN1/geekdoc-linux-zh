    in this interface, but the MAC addresses of these APS and connected clients are
    not seen. Furthermore, AP cannot be selected by default. If you want to view the
    clients connected to the current AP, you also need to set it up. Select Sort|First
    Seen command in the menu bar in turn, and then select AP in the above the fold,
    and display the connected client in the second screen.


    10) As you can see from this interface, the AP details named CU_655w are displayed,
