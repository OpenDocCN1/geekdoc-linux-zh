    从输出信息中，你可以看到主机两个 ARP 记录（网关和攻击主机的 ARP 条目）。从显示的 ARP 条目可以看出，网关和攻击主机的 MAC 地址是相同的。这表明目标主机已成功被
    ARP 欺骗。


    ## 2) 使用 Ettercap 工具


    Ettercap 是一种基于 ARP 地址欺骗的网络嗅探工具，主要适用于交换型局域网。本节将介绍使用 `Ettercap` 工具实施中间人攻击的方法。


    *具体步骤如下：*


    1) 启动 Ettercap 工具。


    执行命令如下：


    ```bash

    root@exampleserver:～# ettercap -G

    ```


    执行上述命令后，将显示界面。


    2) 该界面是 `Ettercap` 工具的初始界面。接下来，通过捕获包来实现中间人攻击。在菜单栏中选择 `Sniff|Unified sniffing`
    命令或按下快捷键 `Ctrl+U`。此时，`Ctrl+U` 将弹出对话框。


    3) 在此对话框中选择网络接口。此处选择 `eth0`，然后点击“OK”按钮，将显示所示界面。


    4) 启动界面后，可以扫描所有主机。在菜单栏中，选择 `Hosts|Scan for hosts` 命令或按下快捷键 `Ctrl+S`。此时将显示所示界面。


    5) 从该界面的输出信息中，你可以看到共扫描了 5 台主机。如果你想查看扫描的主机信息，在菜单栏中选择 `Hosts|Hosts list` 命令或按下快捷键
    `Ctrl+H`。此时将显示所示界面。


    6) 该界面显示了所扫描的 5 台主机的 IP 地址和 MAC 地址。在此界面中，选择一台主机作为目标系统。此处选择 `192.168.29.136` 主机并点击
    `Add to Target 1` 按钮，选择 `192.168.29.2` 并点击 `Add to Target 2` 按钮，然后就可以开始嗅探数据包了。在菜单栏中选择
    `Start|Start sniffing` 命令或按下快捷键 `Shift+Ctrl+W`。


    7) 嗅探开始后，通过 ARP 注入攻击方法获取目标系统的重要信息。要启动 ARP 注入攻击，在菜单栏中选择 `Mitm|ARP poisoning...`
    命令。此时将显示对话框。


    8) 在对话框中选择攻击选项，此处勾选 `Sniff remote connections` 复选框。然后点击“OK”按钮，将显示界面。


    9) 此时，中间人攻击已成功实施。目标用户的所有 HTTP 数据都将被攻击主机监控。


    10) 从此界面可以看出，目标用户登录了路由器管理界面。其中，登录用户名为 `user`，密码为 `exampleserver`。当用户获取信息后停止嗅探时，在菜单栏中选择
    `Start|Stop sniffing` 命令。


    11) 停止嗅探后，需要停止中间人攻击。在菜单栏中选择 `Mitm|Stop mitm attack(s)` 命令，将显示对话框。


    12) 点击对话框中的“OK”按钮，中间人攻击已成功完成。


