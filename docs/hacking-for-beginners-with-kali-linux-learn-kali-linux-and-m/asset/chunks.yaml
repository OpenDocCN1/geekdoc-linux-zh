  raw: 'Before obtaining the image, users need to have a simple understanding of the
    image of the Kali Linux system such as it''s version, architecture, desktop type.
    Then we need to choose to download the appropriate image to install in the operating
    system.


    1) *Mirror type*


    Kali Linux officially provides two image files, one is a stable released version,
    and the other is a weekly updated version. Among both, the stable version is usually
    fully tested and is more convenient to use.The advantage of the weekly updated
    version is that the tools included in it are of the latest version.But it''s flaw
    is that the testing is not sufficient and there maybe a risk of instability.


    2) *The difference in digits*


    Kali''s official website provides images of i386 and amd64 architectures. Among
    them, i386 means images that support 32-bit architecture & amd64 means images
    that support 64-bit architecture. Therefore, when downloading mirror files, users
    need to select the corresponding mirror files according to their own system architecture.


    To check your own system architecture windows users can use the control panel
    and Mac OS users can check in the system preferences menu.


    Note : Remember that 64-bit architecture can support both 32-bit & 64-bit images.
    Whereas, 32-bit architecture can only support 32-bit supported image.


    3) *Desktop type*


    The official website of Kali Linux provides 6 desktop images.These are GNOME,
    E17, KDE, MATE, XFCE and LXDE respectively.Among them, Gnome is the most common
    and easy-to-use desktop environment, so we recommended you to choose Gnome desktop
    for improving your hacking expertise. However, feel free to experiment with different
    versions and settle with the one that you feel comfortable with.


    4) *Download the mirror*


    After the user gets a clear understanding about all the mirror files that are
    available in the official Kali Linux website, he can select the desired file to
    download.


    Here is a screenshot of the Kali Linux downloads page as of this writing.


    **Verify Kali Linux image**


    Since the installation image files are usually relatively large, the file may
    come damaged or incomplete during the download process. If the image file is damaged
    or incomplete, errors may occur during the installation process. In order to avoid
    these embarrassing situations, users can use a verification tool for verification.
    There are several websites that check the Linux file for it''s authenticity.


    After finding the value, compare and verify whether the obtained value and the
    value provided by the mirror file are the same. If they are the same, then it
    is confirmed that the mirror file is downloaded completely. If not, it is incomplete
    and maybe be filled with hidden malware. We suggest you to download again from
    the official website.


    In the next section, we will talk about installing Kali linux in a virtual machine.


    ### Virtual machine installation


    A virtual machine refers to obtaining a complete computer system with complete
    hardware system functions and running in an isolated environment through software
    simulation. For a beginner, if you install the operating system directly on the
    physical machine, it may cause the system to crash or occur a data loss.


    Therefore, in order to not only learn to install the system, but also to avoid
    data loss, using a virtual machine is a better way. There are dozens of virtual
    machine software in the market. Among them, VirtualBox and VMware are two well-known
    virtual machine software available for windows. Personally, I think the VMware
    virtual machine is simple and easier to operate. I recommend users to use this
    virtual machine software.Next section will introduce you to install and create
    a Kali Linux virtual machine using VMware.


    **Obtaining VMware software**


    If you want to install VMware software, you need to obtain its installation package
    from it''s official website. It is available in both free and premium versions.


    To access and download the latest version of VMware software. [Please click here](http://www.vmware.com/products/workstation/workstation-evaluation)


    After visiting this address in the browser, the download interface will appear.


    From this interface, you can see VMware Workstation Pro products, which can be
    used under Windows and Linux. In this example, we choose to download the Windows
    software, so click the "Download Now" button in Workstation 15 Pro for Windows,
    and the VMware installation package will start to download. After the download
    is completed, the software package is named as *VMware-workstation-full-15.0.3-versionnumber.exe*.


    **Install VMware**


    When the VMware software installation package is downloaded, the user can install
    the software into the operating system. The following section will introduce how
    to install VMware software in Windows.


    *Specific steps to Install VMWware are as follows:*


    1) Double-click the downloaded installation package to enter the welcome dialog
    box.


    2) This dialog box displays the welcome message for installing VMware Workstation.
    Click the "Next" button so that the "End User License Agreement" information will
    be displayed.


    3) This dialog box shows the user license agreement for using VMware. Select the
    "I accept the terms in the license agreement" check box, and click the "Next"
    button.


    4) You can customise the installation location of VMware in this dialog box. By
    default, VMware will be installed in the C:\Program Files(x86)\VMware\WMware Workstation
    directory. If the user wants to install to another location, he can click the
    "Change" button to specify the location of the installation. Then click the "Next"
    button, and the "User Experience Settings" dialog box will be displayed.


    5) This dialog box is used to set user experience information, including checking
    for product updates at startup and helping to improve VMware Workstation Pro.
    By default, both options are enabled. Use the default settings here, and then
    click the "Next" button, so that the shortcut creation dialog box will be displayed.


    6) This dialog box will show the shortcut location of VMware Workstation Pro,
    which will be created in "Desktop (D)" and "Start Menu Program Folder (S)" by
    default. Then click the "Next" button so that the "Ready to install VMware Workstation
    Pro" dialog box will be displayed.


    7) By this time, the previous basic settings work is completed. Click the "Install"
    button to start installing VMware products. After the installation is completed,
    the completion dialog box will be displayed.


    8) From this dialog box, you can see that VMware Workstation Pro has been installed.
    Since VMware Workstation Pro is not a free version, you need to enter a license
    key before it can be used for a long time after activation. Click the "License"
    button in this dialog box, and the "Enter License Key" dialog box will be displayed.
    We suggest you to buy the license for a year to reduce prices. There are also
    additional discount offers for students and organisations.


    9) After entering a license key in this dialog box, click the "Enter" button,
    and the completion dialog box will be displayed.


    (10) As you can see from this dialog box, the VMware Workstation pro installation
    wizard has been completed. Click the "Finish" button to successfully install the
    VMware software. In the next section, the user can use the virtual machine to
    install the operating system.


    ### Create Kali Linux Virtual Machine


    If the user wants to install the operating system in the VMware software, he needs
    to create a corresponding virtual machine first, that is, to simulate an environment
    with complete hardware system functions. When creating a Kali Linux virtual machine
    environment, it is recommended that the memory is not less than 2GB, otherwise
    the Metasploit software cannot run normally. The disk space size should also not
    be less than 20GB, otherwise it will not be able to update normally later.


    *The specific steps to create a Kali Linux virtual machine are as follows:*'
