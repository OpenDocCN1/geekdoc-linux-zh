    As you can see from this interface, the terminal has two tabs. By clicking the
    label, you can switch the terminal window you are in.


    ### 2) View the catalog


    When the user opens a terminal window, he can manage files through the command
    line. Viewing a directory is the most common operation to determine the files
    contained in the current directory. Use the `ls` command to view all files in
    the current directory.


    From the results displayed on this interface, you can see that all files in the
    current directory are listed.


    ### 3) Switch directory


    Switching directories is also the most common operation. If users want to view
    files in a certain directory, they need to switch to the corresponding directory.
    For example, use the `cd` command to switch to the `/etc` directory, and use the
    `pwd` command to view the current working directory.


    As you can observe from the output, you successfully switched to the `/etc` directory.


    ### 4) Edit the file


    Editing files is a method used to manipulate the contents of files. For example,
    if you want to set the software source on the terminal, you need to edit the software
    source file. For example, you can use the `Vi` text editor to edit the software
    source.


    After executing the above command, you can open the edit interface of the `sources.list`
    file.


    The above interface indicates that the editing interface of the `sources.list`
    file is successfully opened. Next, the user can edit the file.


    The following section will introduce how to edit files and save files with the
    `Vi` text editor. Before using the `VI` editor, you need to understand its 3 working
    modes, namely command mode, input mode and last line mode.


    The functions of these 3 modes are as follows:


    - **Command mode:** After starting the `Vi` text editor, the command mode is entered
    by default. This mode mainly completes cursor movement, string search, and related
    operations such as deleting, copying, and pasting file content.

    - **Input mode:** The main operation in this mode is to input file content, so
    that you can modify the text file body or add new content. When in the input mode,
    the last line of the `Vi` text editor will display the status prompt message "--INSERT--".

    - **Last line mode:** In this mode, you can set up the `VI` editing environment,
    save files, exit the editor, and perform operations such as searching and replacing
    file contents. When in the last line mode, a colon(:) prompt appears on the last
    line of the `VI` editor.


    When the user uses the `Vi` text editor to open a file, the command line mode
    is entered by default. At this point, press `a`, `i` or `o` to enter the input
    mode and edit the content of the file. When editing is completed, press `Esc`
    to return to the command line mode. Then, enter the colon `:` prompt to enter
    the last line mode, and enter the `:wq` command to save and exit the text editing
    interface. Alternatively, the user can also enter `ZZ` to save and exit the text
    editing interface.


    ## Chapter 5


    # Settings Panel in Kali


    ![](images/00003.jpeg) ![](images/00002.jpeg)


    In the previous chapter we have learned about the importance of various Kali Linux
    features with detailed explanations. This chapter provides in depth-understanding
    about the Settings panel and the networking features that need to be understood
    by an average user.


    ### Settings Panel


    The "Settings" panel can be used to set the system, such as setting the resolution,
    power supply, background colour, network connection, etc. To implement operations
    in some systems, these basic settings are essential. This section will introduce
    the "Settings" panel of Kali Linux.


    #### Launch the Settings panel


    1) Click the display application button in the favourites folder, and all applications
    will be displayed.

    2) Click the setting button on this interface to open the "Settings" panel.

    3) You can see all the setting items from the left column of the dialog box. After
    the user selects the setting item, the corresponding setting can be made in the
    right column. For example, set the power supply. Select the Power setting item
    in the left column, and set the time of "Blank Screen (B)" and "Auto Suspend (A)"
    in the right column. In order to facilitate the user to set up the Kali Linux
    system, all the setting items and corresponding settings are listed here.


    ### Configure the network


    To implement penetration testing, you need to be connected to the network. Before
    implementing penetration testing, you need to configure the network. Users can
    use wired networks, wireless networks and VPNs to connect to the network. This
    section will introduce these three network configuration methods.


    ### Configure wired network


    Wired network is a computer network connected by coaxial cable, twisted pair and
    optical fiber. Simply put, it is a computer network connected by a network cable,
    which is commonly referred to as Ethernet. The wired Internet is relatively stable.
    If users need to download some relatively large files or update the system, it
    is then recommended to use a wired network. In Kali Linux, users can use commands
    or graphical interfaces to configure the wired network.


    #### 1) ifconfig command to view the existing network configuration


    Before configuring the network, first check the existing network configuration.
    If the network is already configured, there is no need to configure it again.
    If it is not configured, then the user needs to configure it manually.


    Use the `ifconfig` command to view the existing network configuration as follows:


    ```bash

    root@exampleserver:～# ifconfig

    ```


    This will display a lot of information about the wired network. We recommend you
    to save an image of this information for future reference of the target you are
    attacking. It is also useful when you are targeting a wireless network.


    #### Graphical interface settings


    The graphical interface settings are relatively intuitive and easy to operate.
    The following section will introduce the method of setting the wired network on
    the graphical interface.


    The specific steps to configure the wired network are as follows:


    1) Open the "Settings" panel and select the "Network" setting item, the dialog
    box will be displayed.

    2) As you can see from this dialog box, the wired network is not connected. At
    this time, click the setting button and the dialog box will be displayed.

    3) From the dialog box, you can see that it contains 5 labels, which are detailed
    information, identity, IPv4, IPv6, and security. Here mainly configure the options
    in the IPv4 label. After setting, you can see the obtained network information
    in the "Details" tab. Select the IPv4 tab, and the dialog box will be displayed.

    4) Set the method of obtaining IPv4 address in this dialog box. There are 4 methods
    provided here, namely automatic (DHCP), manual, local link only, and Disable.
    Among them, the "auto (DHCP)" option means that the DHCP server will automatically
    assign an IP address to the current host.


    The "manual" option means that the user needs to manually set the IP address,
    subnet mask and gateway. The "local link only" option is only used Local connection
    when it is unable to access the Internet. Disable option means to disable the
    IPv4 address. If you want to access the Internet, you must use both automatic
    (DHCP) and manual methods. For ease of use and faster operation, "Auto (DHCP)"
    is the best choice. If the user wants to fix the current computer address, he
    can select the "Manual" radio button so that the dialog box will be displayed.


    5) In this dialog box, you can manually specify the IP address, subnet mask, gateway,
    DNS, and routing information to prevent users from failing to access the Internet
    due to configuration errors. It is recommended to only set the IP address and
    subnet mask. After setting, click the "Apply (A)" button in the upper right corner
    to return to the network setting dialog box.

    '
