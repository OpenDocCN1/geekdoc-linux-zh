  trans: '


    Maltego 是一个非常强大的信息收集工具。它不仅可以自动收集所需信息，还可以对收集的信息进行可视化，并以图形化的方式向用户展示结果。Kali Linux
    默认安装了 Maltego 工具，因此用户可以直接使用。然而，在使用工具之前，你需要进行简单的配置，例如注册账户和选择启动模式。下节将介绍 Maltego
    工具的配置。


    ## 1) 注册账户


    当用户使用 Maltego 工具时，需要登录其官方网站。因此，在启动工具之前，你需要注册一个账户。


    注册账户地址如下：


    https://www.paterva.com/web7/community/community.php


    当用户在浏览器中成功访问上述地址时，将显示一个带有字段框的对话框。


    在此对话框中填写正确信息，并勾选“执行人机认证”复选框。会弹出一个验证对话框。在此对话框中，根据提示选择相应的图片，然后点击“验证（Verify）”按钮。验证成功后，将显示注册注册对话框。


    此时，点击 `Register! ` 按钮完成注册。此时，你将从用于注册账户的邮箱收到一封邮件。登录你的邮箱以激活账户。


    ## 2) 设置 Maltego 模式


    Maltego 提供两种模式，即普通隐私模式（Normal Privacy Mode）和隐藏隐私模式（Stealth Privacy Mode）。其中，普通隐私模式可以获取更多信息。此外，用户允许直接使用互联网上的数据，例如物理图片和网站信息。隐藏隐私模式更多用于分析信息，特别是当当前计算机没有网络时。使用此模式将无法直接从互联网获取数据。因此，为了获取更多信息，建议选择普通隐私模式。下节将介绍设置
    Maltego 模式的具体方法。


    ### 用例场景


    将 Maltego 模式设置为普通隐私模式。具体步骤如下：


    1) 在图形界面的菜单栏中，选择 `Applications`|`Information Collection`|`maltego` 命令。随后将显示 Maltego
    产品选择对话框。


    2) 对话框中显示可用的 Maltego 产品，包括 `Maltego XL`、`Maltego Classic`、`Maltego CE (Free)`
    和 `Maltego CaseFile (Free)`。其中 `Maltego XL` 和 `Maltego Classic` 是付费的，而 `Maltego
    CE` 和 `Maltego CaseFile` 是免费的。在这里我们选择免费的 Maltego 工具并点击 `run` 按钮。


    3) 此对话框显示许可协议信息。勾选 `Accept` 复选框，然后点击 `Next` 按钮。将显示登录对话框。


    4) 在此对话框中输入之前注册的账户信息（邮箱地址、密码和验证码）以登录 Maltego 服务器。然后点击 `Next` 按钮。将出现对话框。


    5) 此对话框显示登录结果。从该对话框，你可以看到登录用户名、邮箱地址和登录时间。然后点击 `Next` 按钮，将显示安装 Transforms（转换）的对话框。


    6) 此对话框显示要安装的应用服务、Transforms、实体（entities）和主机（hosts）。然后点击 `Next` 按钮显示另一个对话框。


    7) 在此对话框中，你可以设置是否启用错误报告功能。如果你想启用，勾选 `Automatically send Error Reports` 复选框。如果你不想启用，直接点击
    `Next` 按钮即可。点击 `Next` 后，将显示隐私模式选择对话框。


    8) 在对话框中，选择 `Normal mode`，然后点击 `Next` 按钮。


    9) 你可以从这一步看到 Maltego 已准备就绪。此时，用户可以使用 Maltego 工具收集信息。这里默认提供了 3 种方法，即 `Open a blank
    graph and let me play around`（打开空白图表）、`Open an example graph`（打开示例图表）和 `Go away,
    I have done this before!`。在这里选择第一个运行方法 `Open a blank graph and let me play around`，这将打开界面。


    10) 看到此界面意味着 Maltego 已成功启动并打开了一个新图表。接下来，用户可以选择任何实体并将其拖到图表中，以分析和整理收集的信息。


    ## 使用 Maltego 工具


    通过之前的配置，可以正常使用 Maltego 工具了。用户可以使用 Maltego 工具来整理和分析之前收集的信息。此外，你还可以使用 Maltego 的
    Transforms 来获取更多信息。Maltego 提供了大量的实体来表示信息节点。例如，域名信息可以使用 `Domain` 实体来表示域名。下节将介绍使用
    Maltego 工具整理和分析信息的方法。


    ### 整理和分析主机信息


    通过之前的收集收集，我们可以知道局域网中的活动主机。开放端口、服务和操作系统是主机的一些类型。


    下节将介绍使用 `IP address` 实体来整理和分析主机信息。


    ### 用例场景


    使用 Maltego 工具整理和分析主机信息。具体步骤如下：


    1) 启动 Maltego 工具，界面将显示。


    2) 所有可用实体显示在界面的左栏。在这里，选择 `IP address` 实体来整理收集的主机信息。选择 `IPv4 Address` 实体并拖到图表中，界面将显示。


    3) 从此界面可以看到图表中添加了 IP 地址实体，该实体的默认 IP 为 `192.243.176.84`。此时，用户可以将地址修改为活动主机，例如 `192.168.29.136`。用户可以通过双击地址或修改属性
    `IP Address` 来修改。


    4) 从此界面可以看到地址实体的值已成功修改。此时，用户同样的方法将 `Port` 和 `Service` 实体拖放到图表中，以整理主机的相关信息。


    5) 从此界面，你可以看到添加的端口和服务实体。其中，端口的默认属性值为 `0`。服务的默认属性值为 `80/Apache`。用户可以根据收集的信息修改实体属性值。通过整理上述收集的信息，我们可以看到主机开放了
    `21`、`22`、`80`、`135` 和 `139` 端口，对应的服务为 `FTP`、`SSH`、`HTTP`、`msrpc` 和 `netbios-ssn`。


    6) 此时已整理收集的信息。为了方便分析和直观查看，用户可以通过连接线关联它们的关系。例如，在这里使用线条连接主机 IP 和端口。点击 IP 地址实体（`192.243.176.84`）附近，将引出一条线，然后点击端口实体。此时会弹出一个对话框。


    7) 此对话框中的信息用于设置连接线，例如 `Label`、`Color`、`Style` 和 `Thickness`。在这里我们将线条的标签设置为 `port`，颜色设置为
    `red`，其他选项可以使用默认值。


    8) 点击 `OK` 按钮，即可看到添加的连接线。


