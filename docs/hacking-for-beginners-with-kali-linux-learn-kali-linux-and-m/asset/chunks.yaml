    Next, check the ARP cache table as follows:


    ```bash

    root@exampleserver:～# arp

    ```


    As you can see from the output information, there is also only one ARP entry bound
    to the gateway. By looking at the address information, it can be determined that
    the attacking host has not communicated with the target host. At this time, as
    long as the two hosts communicate, they will request each other''s IP and MAC
    addresses. At this time, ARP attacks can be implemented on it.


    ### 4) Implement ARP attacks on the target host.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# arpspoof -i eth0 -t

    ```


    It can be seen from the output information that the attacking host is sending
    an ARP response packet to the target host, telling the target host that the MAC
    address of the gateway is `00:c:29:79:95:9e` (the attacking host''s MAC address).
    However, the MAC address of the gateway is actually `00:50:56:f1:40:cb`. This
    shows that ARP spoofing has begun on the target host.


    ### 5) Implement ARP attacks on the gateway.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# arpspoof -i eth0 -t

    ```


    It can be seen from the output information that the attacking host is sending
    an ARP response packet to the gateway, telling the gateway that the MAC address
    of the target host is `00:c:29:79:95:9e` (the MAC address of the attacking host).
    However, the actual MAC address of the target host is `00:0c:29:6c:5d:69`. It
    can be explained that ARP spoofing has been implemented on the gateway.


    **Reminder**: Users can also perform ARP attacks on the target host and gateway
    at the same time with one command.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# arpspoof -i eth0 -t 192.168.29.135 -r

    ```


    From the output information, we can see that the attacking host sent ARP response
    packets to the target host and the gateway, telling the gateway and the target
    host that their MAC addresses are `00:c:29:79:95:9e`.


    ### 6) Check the ARP cache table of the target host as follows:


    ```bash

    root@exampleserver:～# arp

    ```


    From the output information, you can see the two ARP records in the host (the
    ARP entries of the gateway and the attacking host). From the displayed ARP entry,
    you can see that the MAC address of the gateway and the attacking host are the
    same. This shows that the target host was successfully spoofed by ARP.


    ## 2) Use Ettercap tool


    Ettercap is a network sniffing tool based on ARP address spoofing, mainly suitable
    for switching local area networks. The following section will introduce the method
    of using the `Ettercap` tool to implement a man-in-the-middle attack.


    *The specific steps are as follows:*


    1) Start the Ettercap tool.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# ettercap -G

    ```


    After executing the above command, the interface will be displayed.


    2) This interface is the initial interface of the `Ettercap` tool. Next, the man-in-the-middle
    attack is implemented by capturing packets. Select the `Sniff|Unified sniffing`
    command in the menu bar or press the `Ctrl+U` shortcut key. At this time, `Ctrl+U`
    will display the dialog box.


    3) Select the network interface in this dialog box. Here select `eth0`, and then
    click the "OK" button, the interface shown will be displayed.


    4) After starting the interface, you can scan all the hosts. In the menu bar,
    select the `Hosts|Scan for hosts` command or press the `Ctrl+S` shortcut key.
    At this time, the interface shown will be displayed.


    5) From the information output on this interface, you can see that a total of
    5 hosts have been scanned. If you want to view the scanned host information, select
    the `Hosts|Hosts list` command in the menu bar or press the `Ctrl+H` shortcut
    key. At this time, the interface shown will be displayed.


    6) This interface displays the IP addresses and MAC addresses of the 5 hosts scanned.
    In this interface, select one of the hosts as the target system. Here select the
    `192.168.29.136` host and click the `Add to Target 1` button, select `192.168.29.2`
    and click the `Add to Target 2` button, and then you can start sniffing packets.
    In the menu bar, select `Start|Start sniffing` command or press `Shift+Ctrl+W`
    shortcut key.


    7) After the sniffing is started, the important information of the target system
    is obtained by using the ARP injection attack method. To start the ARP injection
    attack, select the `Mitm|ARP poisoning...` command in the menu bar. At this time,
    the dialog box will be displayed.


    8) Select the attack option in this dialog box, here select the `Sniff remote
    connections` check box. Then click the "OK" button and the interface shown will
    be displayed.


    9) At this point, the man-in-the-middle attack is successfully implemented. All
    HTTP data accessed by the target user will be monitored by the attacking host.


    10) It can be seen from this interface that the target user has logged in to the
    management interface of the router. Among them, the login user name is `user`
    and the password is `exampleserver`. When the user stops the existing sniffing
    after obtaining the information, select the `Start|Stop sniffing` command in the
    menu bar.


    11) After you stop sniffing, you need to stop man-in-the-middle attacks. Select
    the `Mitm|Stop mitm attack(s)` command in the menu bar, and the dialog box will
    be displayed.


    12) Click the "OK" button in the dialog box, so that the man-in-the-middle attack
    has been successfully completed.


    The `Ettercap` tool provides two modes, one is a graphical interface, and the
    other is a command line mode. Users who like to use commands can also implement
    man-in-the-middle attacks through the command line mode.


    The syntax format is as follows:


    ```bash

    ettercap [Options][Objective 1] [Objective 2]

    ```


    Use Ettercap''s command line mode to implement a man-in-the-middle attack on the
    target host `192.168.29.136`.


    The execution command is as follows:


    ```bash

    ettercap -Tq -M arp:remote /192.168.29.136// /192.168.29.2

    ```


    From the output information, we can see that the attacking host sent ARP response
    packets to the target host and the gateway, telling the gateway and the target
    host that their MAC addresses are `00:c:29:79:95:9e`.

