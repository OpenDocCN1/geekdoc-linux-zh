- fmt: "\nThe `Ping` command can be used to check whether the network is connected\
    \ or not. This can usually help users analyse and judge network failures. For\
    \ a domain name, you can usually specify multiple IP addresses. Therefore, when\
    \ users use some tools to query domain name information, they will obtain multiple\
    \ address information. At this time, the user cannot determine which address the\
    \ target server uses. The user can determine the IP address currently in use by\
    \ using the `Ping` command, and then determine the target host.\n\nThe syntax\
    \ format of the `Ping` command is as follows:\n\n> `ping -c [count][target]`\n\
    \nIn the above syntax, the option `-c` is used to specify the number of `Ping`\
    \ packets sent and the parameter `[target]` is used to specify the address of\
    \ the target host, where the target host address can be a host name, IP address\
    \ or domain name. In the Windows system, the `Ping` command only sends and responds\
    \ to 4 packets to stop Ping. In the Linux system, the `Ping` command will always\
    \ be executed by default, and the user needs to press the `Ctrl+C` key combination\
    \ to stop Ping.\n\n**Use-case scenario:**\n\nUse the `Ping` command to detect\
    \ the IP address of the domain name `www.wikipedia.com`, and specify to send only\
    \ 4 detection packets.\n\nThe execution command is as follows:\n\n```\nroot@exampleserver:～#\
    \ ping -c 4 www.wikipedia.com\n```\n\nAfter entering the above command we can\
    \ see that the response packet from the target host is successfully received.\
    \ It can be seen from the response packet information what the IP address issued\
    \ by the target.\n\n**What next?**\n\nWith an in-depth understanding about the\
    \ Domain and server analysis you are now strong enough to enter into the importance\
    \ of port analysis. `Nmap`, a famous information gathering tool is popular primarily\
    \ due to it’s excellent approach to port analysis. Follow along to know more about\
    \ achieving port analysis using `Nmap`.\n\n# Chapter 13: Scanning ports\n\n(Images\
    \ omitted)\n\nBy scanning the port, you can discover the programs running in the\
    \ target host. After that we can collect information on these programs to obtain\
    \ vulnerability information and can successfully implement penetration testing.\
    \ This section will introduce the concept of ports and methods of implementing\
    \ port scanning.\n\n### Introduction to Ports\n\nIn computers, the port is considered\
    \ as an essential concept. In network technology, ports have several meanings.\
    \ The port referred to here is not a physical port, but a port in the TCP/IP protocol.\
    \ It is a port in a logical sense. Among the TCP/IP protocols, the most commonly\
    \ used protocols are `TCP` and `UDP`. Since the two protocols of `TCP` and `UDP`\
    \ are independent, their respective port numbers are also independent of each\
    \ other. For example, `TCP` has port `235`, `UDP` can also have port `235`, the\
    \ two usually do not conflict.\n\n**The functions of ports and commonly used ports\
    \ are described below:**\n\n**1) The role of the port**\n\nUsers know that a host\
    \ corresponds to an IP address and can provide multiple services, such as Web\
    \ services and FTP services. If there is only one IP, different network services\
    \ cannot be distinguished, so use \"IP+port number\" to distinguish different\
    \ services.\n\n**2) Definition of port**\n\nThe port number is used to identify\
    \ the only process in the host, whereas \"IP+port number\" can identify the only\
    \ process in the network. In `Socket` programming during network development,\
    \ `IP + port number` is the socket. The port number is numbered by 16-bit binary\
    \ numbers, and the range is between `0～65535`.\n\nHowever, these ports cannot\
    \ be used casually, and some ports can be already occupied. For example, the port\
    \ of the Web server is `80`, the port of the FTP service is `21`, etc. Therefore,\
    \ ports are classified and the range of ports that users can use is specified\
    \ rigorously for pen-testers. Always have a good knowledge about the ports that\
    \ your target has.\n\n**3) Port classification**\n\nThere are many ways to classify\
    \ ports. Usually they will be classified according to the fact whether they are\
    \ used by the server or by the client.\n\n**The port number used by the server\
    \ can be divided into a reserved port number and a registered port number as follows:**\n\
    \n*   **Reserved port number:**\n    The value range of this type of port is `0~1023`.\
    \ These ports cannot be used during user programming, and are used by some programs.\
    \ Only applications with super user permissions are allowed to be assigned a reserved\
    \ port number. For example, the default port of the WWW service is `80`, and the\
    \ default port of the FTP service is `21`. However, users can also specify other\
    \ port numbers for these network services. Some system protocols use a fixed port\
    \ number and cannot be changed manually. For example, port `139` is exclusively\
    \ used for communication between `NetBIOS` and `TCP/IP` and cannot be changed\
    \ manually.\n\n*   **Registered port number:**\n    The range of this type of\
    \ port is between `1024~49151`, which is the port number range used by the user\
    \ to write the server. These ports can also be dynamically selected by the client\
    \ when they are not occupied by server resources. The port number used by the\
    \ client is also called a temporary port number, and the value range is from `49152~65535`.\n\
    \n### Implement Port Scan\n\nAfter the user has a clear understanding of the port\
    \ concept, port scanning can be implemented. The following section will introduce\
