  raw: 'When it is impossible to determine whether a port is open or filtered, Nmap
    divides the port into this state. This is the case when the open port does not
    respond. No response may also mean that the message filter discarded the probe
    message and any response messages caused by it. Therefore, Nmap cannot determine
    whether the port is open or filtered. UDP, IP protocol, FIN, Null, and Xmas scans
    may fall into this category.


    *   Closed/filtered (closed or filtered):


    This state is used when Nmap cannot determine whether the port is closed or filtered.
    It will only appear in the IPID Idle scan.


    *The syntax format for port scanning using Nmap is as follows:*


    > nmap -p [target]


    In the above syntax, the option -p is used to specify the port to be scanned.
    The designated port can be a single port, multiple ports, or a range of ports.
    When specifying multiple scanning ports, separate the ports with commas. By default,
    the range of ports scanned by Nmap is 1 to 1000.


    *Use-case scenario:*


    Perform port scanning on the target host 192.243.176.84.


    The execution command is as follows:


    > root@exampleserver:～# nmap 192.243.176.84


    When this command is entered on the terminal the Nmap tool scans 1000 ports by
    default.It will display the open ports in the output.


    Use-case scenario:


    Specify the port range from 1 to 50, and perform port scanning on the target host.


    The execution command is as follows:


    > root@exampleserver:～# nmap -p 1-50 192.243.176.84


    From the output result after entering the above terminal, we can see that the
    ports ranging from 1 to 50 are scanned. All the open ports will be displayed.


    *Use-case Scenario:*


    Specify ports 21 and 23 of the scan target host.


    The execution command is as follows:


    > root@exampleserver:～# nmap -p 21,23 192.243.176.84


    This gives a much detailed information about the two parts that have been specifically
    asked by the command. By using these techniques you can minimise the time that
    usually takes for scanning the ports.


    2) **Use DMitry tool**


    The DMitry tool provides a -p option to implement port scanning.


    The syntax format used to implement port scanning is as follows:


    > dmitry -p [host]


    Here host is the IP address of the target we are trying to scan the ports.


    *Use-case scenario:*


    Use DMitry to scan the open ports on the target host 192.243.176.84.


    The execution command is as follows:


    > root@exampleserver:～# dmitry -p 192.243.176.84


    From the output information, you can see all the ports open on the target host.
    From the penultimate line of output, you can see the number of ports that were
    scanned and number of ports that were closed.


    ***What Next?***


    As much important ports are they are still difficult to implement. Now a days
    administrators are using intrusion section systems and it can be not a good practice
    to completely rely on them. Also, with ports we may not find additional information
    that is required to build exploits. It helps if we can find out about the operating
    system that the target is using. Follow along to know more about operating system
    detection in the next chapter.


    ## Chapter 14


    # Identify the operating system


    ![](images/00005.jpeg) ![](images/00004.jpeg)


    By identifying the operating system, the system type of the target host can be
    determined. In this way, penetration testers can perform vulnerability detection
    on the program of the target system in a strategic manner to save unnecessary
    wasted time. This section will introduce the method of identifying the operating
    system with significant examples.


    **Recognition based on TTL**


    TTL (Time To Live), this field specifies the maximum number of network segments
    that an IP packet is allowed to pass through before being discarded by the router.
    Different operating system types respond with different TTL values. Therefore,
    users can use the Ping command for system identification. In order to enable users
    to quickly determine the type of a target system, a list of initial TTL values
    of each operating system will be necessary.You can easily find them by a quick
    google search.


    *Use-case scenario:*


    Use Ping to test the operating system type of the target host 192.243.176.84\.
    The operating system type of the target host is Kali Linux. Let us find out whether
    the command can detect it or not.


    The execution command is as follows:


    > root@exampleserver:～# ping -c 192.243.176.84


    It can be seen from the output information that the TTL value in the response
    packet is 64\. It can be inferred that the host is a Linux operating system.You
    can experiment with this command on your own operating system to find out its
    value.


    *Use-case scenario:*


    Use Ping to test the operating system type of the target host 192.243.176.84\.
    The operating system type of the target host is Windows 7.


    The execution command is as follows:


    > root@exampleserver:～# ping -c 192.243.176.84


    It can be seen from the output information that the TTL value in the response
    packet is 128\. It can be explained that this is a Windows operating system.


    Tip: If there are too many routers from the local host to the target, the judgment
    result may not be very accurate.


    ### Recognition using NMAP


    Since TTL is only a fuzzy judgment, the result obtained may not be accurate. The
    NMAP tool provides a function to detect the operating system. The following section
    will introduce the use of NMAP to identify the operating system type.


    The syntax format of using NMAP to identify the operating system is as follows:


    > nmap -O [target]


    Here target is the host address we are trying to attack for our penetration testing.


    *Use-case scenario:*


    Use NMAP to detect the operating system type of the target host 192.243.176.84.


    The execution command is as follows:


    > root@exampleserver:～# nmap -O 192.243.176.84


    From the output information, we can understand that the operating system type
    of the target host is identified as Microsoft Windows 7/2008/8.1\. Although it
    is impossible to determine which version it is, however the closer system version
    will be displayed.


    While Dmitri also provides the same functionalities according to our experience
    it comes up with more errors during the scan. We highly recommend to use only
    Nmap for finding out about the details of the host operating system.


    ***What Next?***


    We will talk about Identification services in detail. Follow along!


    ## Chapter 15


    # Identification Service


    ![](images/00005.jpeg) ![](images/00004.jpeg)


    The identification service is mainly the version information of the detection
    service. Generally, there may be vulnerabilities in some old versions. If there
    are loopholes, users can infiltrate the host to obtain other important information.
    This section will introduce how to identify services for easier exploitation of
    the target.


    ### Using Nmap Tool


    A -sV option is provided in the Nmap tool, which can be used to identify the version
    of the service. The following section will introduce a Nmap technique using this
    option to identify services.


    The syntax format of using Nmap to identify the service version is as follows:


    > nmap -sV [host]


    The option -sV in the above syntax means to implement service version detection.


    *Use-case scenario:*


    Identify all open services and versions on the target host 192.243.176.84.


    The execution command is as follows:


    > root@exampleserver:～# nmap -sV 192.243.176.84


    The identified service-related information can be seen from the output information.
    The output information includes 4 columns, namely PORT (port), STATE (state),
    SERVICE (service) and VERSION (version). By analysing each column of information,
    you can obtain relevant information about the corresponding service. For example,
    the service corresponding to TCP port 21 is FTP, and the version is FileZilla
    ftpd. You can also see from the penultimate line that the host name of the target
    host is TEST-PC, and the operating system type is Windows.


