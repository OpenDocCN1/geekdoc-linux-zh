    by the user''s permissions, which will affect the operation of the penetration
    tester in the target system, such as modifying the registry, installing a backdoor,
    or exporting passwords. At this point, the user can use the getsystem command
    to escalate the rights of the current user. The following will introduce how to
    elevate user permissions.


    Raise the rights of ordinary users. First check the permission information of
    the current user.


    The execution command is as follows: ￼


    > meterpreter> getuid￼ Server username: exampleserver-PC\bob


    From the output information, we can see that the current user is a normal user,
    whose user name is bob. Next, the user will bePromote rights.


    The execution command is as follows: ￼


    > meterpreter> getsystem￼


    Seeing the above output information, it means that the current user has been successfully
    escalated. At this point, check the user permissions again.


    The results are as follows: ￼


    > meterpreter> getuid￼ Server username: NT AUTHORITY\SYSTEM


    From the output information, you can see that the current user''s authority is
    NT AUTHORITY\SYSTEM. This shows that the user''s authority has been successfully
    elevated.


    **Get user password**


    When the meterpreter session obtained by the user has certain permissions, the
    user password can be obtained. The following will use the hashdump command to
    obtain the user''s password.


    The execution command is as follows:


    > meterpreter> hashdump￼ Administrator: 500:


    From the output information, we can see that there are 3 users in the target host,
    namely Administrator, bob and Guest.


    The format of the above output information is username: SID: LM hash: NTLM hash.
    Among them, the LM hash ccd3b653b51404 eeaad3b653b51404ee and the NTLM hash 31d6ccy0d16ae981b23c89d7e0c045c0
    correspond to an empty password.


    The hashed password obtained using the hashdump command requires further cracking
    to get the real password. At this point, the user can also obtain the user password
    by loading the mimikatz module. However, the commands of this module are only
    for 32-bit systems. The following will introduce how to use mimikatz module to
    obtain user password.


    The specific steps are as follows:


    1) Load the mimikatz module.


    The execution command is as follows: ￼


    > meterpreter> load mimikatz￼


    Seeing the above output information, it means that the mimikatz module has been
    successfully loaded. At this point, you can use the help mimikatz command to view
    all the commands supported by the mimikatz module. details as follows:


    > meterpreter> help mimikatz￼


    From the above output, you can see all the commands supported by the mimikatz
    module. Next, we will introduce how to use these commands to obtain user passwords.


    2) Use the mimikatz_command command to obtain the user password.


    The execution command is as follows: ￼


    > meterpreter> mimikatz_command -f


    From the output information, we can see that the passwords of the Administrator
    and bob users have been successfully obtained. Among them, the passwords of these
    two users are lyw520!.


    3) Use the msv command to obtain the user''s hash password.


    The execution command is as follows: ￼


    > meterpreter> msv￼


    From the information output above, we can see that the user hash password is successfully
    obtained.


    4) Use the wdigest command to obtain the plaintext password stored in the memory
    of the logged-in user.


    The execution command is as follows: ￼


    > meterpreter> wdigest￼


    From the output information, you can see the clear text password of the logged-in
    user.


