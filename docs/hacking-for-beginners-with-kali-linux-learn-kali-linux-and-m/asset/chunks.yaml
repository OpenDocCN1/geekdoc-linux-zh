    Amap 是一组用于识别网络服务的渗透测试工具，包含 `amap` 和 `amapcrap` 两个工具。其中，`amap` 工具用于尝试识别运行在异常端口上的应用程序，而
    `amapcrap` 工具则通过发送触发包并在响应字符串列表中查找响应，基于非 ASCII 编码来识别应用程序。


    本节将介绍如何使用 Amap 工具来识别服务信息。


    ## 1) 使用 `amapcrap` 工具


    `amapcrap` 工具可以向 UDP、TCP 或 SSL 端口发送随机数据以获取非法响应信息。获取的信息将写入 `appdefs.trig` 和 `appdefs.resp`
    文件中，以便 Amap 探测的下一步工作。


    使用该工具识别服务信息的语法格式如下：


    > `amapcrap -n -m <0ab> [host][port] -v`


    这里 `-V` 代表详细模式（verbose mode）。


    *使用场景：*


    使用 `amapcrap` 工具探测 90 端口的应用程序。


    执行命令如下：


    ```root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v```


    从显示的结果中，我们可以了解到获取的信息已写入 `appdefs.trig` 和 `appdefs.resp` 触发文件中。当用户使用 Amap 工具识别服务时，将使用这两个文件来获取信息。


    ## 2) 使用 `amap` 工具


    `amap` 工具可以尝试识别运行在异常端口上的某些应用程序。


    使用该工具识别服务信息的语法格式如下：


    > `amap -bqv [host][port]`


    使用场景：


    使用 `amap` 工具扫描目标主机 192.243.176.84 上的 80 端口服务。


    执行命令如下：


    ```root@exampleserver:～# amap -bqv 192.243.176.84 80```


    从输出信息中，你可以了解到到匹配 80 端口的服务是 `http` 或 `http-apache2\.`。从显示的识别信息中可以看出，运行在目标主机上的 Web
    服务是 Apache，版本为 2.2.8\.。在输出的前 3 行中，你可以看到 `amap` 工具使用了两个触发文件和一个响应文件。其中，文件名分别为 `appdefs.trig`、`appdefs.resp`
    和 `appdefs.rpc`。


    ### 收集服务信息


    某些特殊服务可以提供额外信息。例如，SMB 服务可以提供文件系统结构，而 SNMP 服务可以提供目标主机主机。本节将解释如何使用这些服务为你的渗透测试信息收集收集有价值的信息。


    ### SMB 服务


    SMB（服务器消息块）是一种 IBM 协议，用于在计算机之间共享文件、打印机、串口等。SMB 协议可以运行在 TCP/IP 协议之上，也可以运行在其他网络协议上（如
    NetBEUI）。通过获取 SMB 服务的共享文件夹信息，你可以了解目标主机的文件系统结构。本节将介绍使用 `smbclient` 工具访问 SMB 服务的共享文件夹信息。


    `smbclient` 是 SMB 服务的客户端，用于访问 SMB 服务中的共享文件。


    `smbclient` 工具的语法格式如下：


    ```root@exampleserver : smbclient -L -U <username></username>```


    上述语法中的选项和含义如下：

    - `-L`: 用于指定 SMB 服务器地址。

    - `-U`: 用于指定登录 SMB 服务的用户名。


    *使用场景：*


    访问 Linux 系统中的 SMB 服务。


    执行命令如下：


    ```smbclient -L 192.243.176.84 -U root Enter WORKGROUP\root''s password:``````


    输入 SMB 服务用户的登录密码将显示需要大量分析的信息。


    从输出信息中，你可以看到目标 SMB 中共享的文件。其中，`Sharename` 代表共享文件的名称，`Type` 代表磁盘类型，`Comment` 是共享文件的描述。这说明目标主机的操作系统类型是
    Linux，共享文件是 Linux 文件系统类型。


    如果目标主机的操作系统是 Windows，则文件名（filename）列将显示共享文件夹的盘器符。


    ```root@exampleserver:～# smbclient -L 192.243.176.84-U```


    从上述输出结果的文件名可以看出，默认共享磁盘为 C 盘和 E 盘。只有在 Windows 系统中，文件夹才以盘器符的形式分为磁盘。可以判断共享文件夹是 Windows
    系统类型。


    ### SNMP 服务


    SNMP（简单网络管理协议）由一组网络管理标准组成，包括一个应用层协议和一组资源对象。网络管理系统使用该协议监控网络设备上任何需要管理员关注的情况。通过使用此服务，可以获取主机信息。本节将介绍使用
    `snmpcheck` 工具获取主机信息。


    `snmpcheck` 工具可以枚举 SNMP 设备以获取目标主机信息。


    该工具的语法格式如下：


    > `snmp-check [target]`


    *使用场景：*


    使用 `snmp-check` 工具获取 192.243.176.84 的主机信息。


    执行命令如下：


    ```snmp-check 192.243.176.84```


