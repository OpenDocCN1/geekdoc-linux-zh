    can convert between IP ranges, subnet mask, CIDR, Cisco and other formats, and
    provides the conversion between dotted decimal, hexadecimal, octal and binary
    IP addresses.


    2) **Determine the network topology**


    The user can determine the upper-level network range based on the routing entry.
    In a penetration test, by determining the network topology, you can determine
    whether the target is a local area network or an external network. In this way,
    penetration testing tools can be selected in a targeted manner, thereby improving
    the efficiency of penetration testing. The following section will introduce the
    use of the Trace-route tool to obtain routing entries of the target host to determine
    the network topology.


    *The syntax format of using this tool to implement route tracking is as follows:*


    > traceroute [Target]


    Here, target is the address of the host network we are trying to find information
    about.


    ***Use-case scenario:***


    Use the Trace-route tool to trace the route of the target host 72.132.234.64 to
    determine its network topology.


    *The execution command is as follows:*


    > root@exampleserver:～# traceroute 72.132.234.64


    This will show the results about that particular host in detail. If you actually
    run this command a bunch of things will popup on the computer screen. A lot of
    this information is about the packets and the route they have chosen. Advanced
    security researchers analyse these packet tokens during an attack scenario to
    check whether the hacker has left any fingerprints on the server.


    Note: In the NAT mode of the virtual machine, there will be a problem with the
    operation of Trace-route. The upper level routing information cannot be displayed.
    Make sure you know about this while working.


    ## Chapter 10


    # Scanning the host


    ![](images/00005.jpeg) ![](images/00004.jpeg)


    In the previous chapter, we learned about few networking rules that are essential
    for understanding the importance of tools like Nmap. Networking itself is a vast
    topic, but as a hacker we recommend you to get a good grasp on the topic by learning
    various networking principles and protocols.


    User can determine whether the target host is active or not through active scanning.
    Active scanning is done by sending a probe request packet and waiting for the
    response from the target host. If the target host responds to the request, it
    means that the host is active. Otherwise, we can conclude that the target host
    is not online.


    The following section will introduce several ways to actively scan the host.


    1) **By using Nmap tool**


    Nmap is a very powerful network scanning and sniffing toolkit. This tool has three
    basic functions. The first one of the three is to detect whether a group of hosts
    are online. The second is to scan host ports and sniff the network services provided
    whereas the third is to infer the operating system that is being used by the host.


    The following examples will introduce the use of Nmap tool to detect whether the
    target host is online or not.


    *The syntax format of N-map is as follows:*


    nmap -sP [target]


    The option -sP in the above syntax means to perform Ping scan on the target host.
    The parameter [target] is used to specify the target address of the scan. The
    target here can be a host name, an IP address (including a single address, multiple
    addresses or address ranges), and sometimes even network segments.


    *Use-case scenario:*


    Detect whether the target host 72.132.234.64 is online.'
