  trans: "\n\n`Ping` 命令可用于检查网络是否连接。这通常可以帮助用户分析和判断网络故障。对于域名，你通常可以指定多个 IP 地址。因此，当用户使用某些工具查询域名信息时，他们会获取多个地址信息。此时，用户无法确定目标服务器使用的是哪一个地址。用户可以使用\
    \ `Ping` 命令确定当前正在使用的 IP 地址，从而确定目标主机。\n\n`Ping` 命令的语法格式如下：\n\n> `ping -c [count][target]`\n\
    \n在上述语法中，选项 `-c` 用于指定要发送的 `Ping` 数据包数量，参数 `[target]` 用于指定目标主机的地址，其中目标主机地址可以是主机名、IP\
    \ 地址或域名。在 Windows 系统中，`Ping` 命令只会发送并响应 4 个数据包后停止 Ping。在 Linux 系统中，`Ping` 命令默认会一直执行，用户需要按下\
    \ `Ctrl+C` 组合键来停止 Ping。\n\n**Use-case scenario:**（此处译为：**使用场景**）\n\n使用 `Ping`\
    \ 命令检测域名 `www.wikipedia.com` 的 IP 地址，并指定仅发送 4 个检测数据包。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
    \ ping -c 4 www.wikipedia.com\n```\n\n输入上述命令后，我们可以看到成功接收到了目标主机的响应包。从响应包信息中可以看到目标发出的\
    \ IP 地址。\n\n**What next?**（此处译为：**接下来做什么？**）\n\n在对域名和服务器分析有了深入理解后，你现在已经足够进入端口分析的重要性阶段。`Nmap`\
    \ 一个著名的信息收集工具，其流行主要源于它卓越的端口分析方法。跟随下文了解更多如何使用 `Nmap` 实现端口分析。\n\n# 第 13 章：端口扫描\n\
    \n（图片省略）\n\n通过扫描端口，你可以发现在目标主机上运行的程序。之后，我们可以收集这些程序的信息以获取漏洞信息，并成功实施渗透测试。本节将介绍端口的概念以及实现端口扫描的方法。\n\
    \n### 端口简介\n\n在计算机中，端口被视为一个核心概念。在网络技术中，端口有多种含义。这里指的端口不是物理端口，而是 TCP/IP 协议中的端口。它是一个逻辑意义上的端口。在\
    \ TCP/IP 协议中，最常用的协议是 `TCP` 和 `UDP`。由于 `TCP` 和 `UDP` 两个协议是独立的，它们各自的端口号也是相互独立的。例如，`TCP`\
    \ 有端口 `235`，`UDP` 也可以有端口 `235`，两者通常不会冲突。\n\n**端口的功能和常用端口描述如下：**\n\n**1) 端口的作用**\n\
    \n用户知道一个主机对应一个 IP 地址，并可以提供多种服务，例如 Web 服务和 FTP 服务。如果只有一个 IP，则无法区分不同的网络服务，因此使用“IP+端口号”来区分不同的服务。\n\
    \n**2) 端口的定义**\n\n端口号用于识别主机中的唯一进程，而“IP+端口号”可以识别网络中的唯一进程。在网络开发中的 `Socket` 编程中，`IP\
    \ + 端口号` 就是 socket。端口号由 16 位二进制数计数，范围在 `0～65535` 之间。\n\n然而，这些端口不能随意使用，某些端口可能已经被占用。例如，Web\
    \ 服务器的端口是 `80`，FTP 服务的端口是 `21` 等。因此，对端口进行了分类，并为渗透测试人员严格规定了用户可以使用端口范围。始终对你的目标拥有的端口有良好的了解。\n\
    \n**3) 端口分类**\n\n端口有许多分类方法。通常根据它们是被服务器使用还是客户端使用来分类。\n\n**服务器使用的端口号可以分为预留端口号和注册端口号如下：**\n\
    \n*   **预留端口号：**\n    这类端口的数值范围是 `0~1023`。这些端口在用户编程期间不能使用，由某些程序使用。只有具有超级用户权限的应用程序允许分配预留端口号。例如，WWW\
    \ 服务默认端口是 `80`，FTP 服务默认端口是 `21`。但是，用户也可以为这些网络服务指定其他端口号。某些系统协议使用固定端口号且不能手动更改。例如，端口\
    \ `139` 专门用于 `NetBIOS` 和 `TCP/IP` 之间的通信，无法手动更改。\n\n*   **注册端口号：**\n    这类端口的范围在\
    \ `1024~49151` 之间，这是用户编写服务器时使用的端口号范围。当这些端口未被服务器资源占用时，客户端也可以动态选择。客户端使用的端口号也称为临时端口号，值范围从\
    \ `49152~65535`。\n\n### 实现端口扫描\n\n在用户对端口概念有了清晰理解后，就可以实施端口扫描。下一节将介绍使用 `Nmap` 和\
    \ `DMitry` 工具来实现端口扫描。\n\n**1) 使用 Nmap 工具**\n\n通常建议使用 `Nmap` 工具进行端口扫描。通过使用 `Nmap`，你可以识别六种端口状态，即\
    \ `open (开放)`、`closed (关闭)`、`filtered (已过滤)`、`unfiltered (未过滤)`、`open/filtered\
    \ (开放/已过滤)` 以及 `closed/filtered (关闭/已过滤)`。如果你想使用 `Nmap` 工具进行端口扫描，需要理解每个状态的含义。\n\
    \n下节将介绍这六种端口状态的具体含义。\n\n*   **open（开放）：**\n    在这种情况下，应用程序通常接收 TCP 连接或 UDP 数据包。安全意识强的人知道每个开放端口都是攻击的入口。攻击者或入侵测试人员想要发现开放端口，而管理员则尝试关闭它们或使用防火墙保护它们以防止合法用户使用。非安全扫描也对开放端口感兴趣，因为它们显示了网络上可用的服务。\n\
    \n*   **closed（关闭）：**\n    关闭端口对 Nmap 也是可用的（它接收检测消息并响应），但显然没有程序在监听。它们可以显示 IP 地址的主机（主机发现或\
    \ ping 扫描）正在运行，并有助于检测某些操作系统。由于关闭端口是可用的，某些端口可能会可能会重新开放。系统管理员可能会防火墙拦截此类端口。这样，它们会被显示为已过滤。\n\
    \n*   **filtered（已过滤）：**\n    由于数据过滤阻止探测包到达端口，Nmap 无法确定端口是否开放。过滤可能来自专业的防火墙设备、路由器规则或主机上的软件防火墙。有时它们会对\
    \ ICMP 错误消息做出响应，例如类型 3 代码 13（管理员禁止通信），但通常情况下，过滤器直接丢弃探测帧而不任何响应。Nmap 会重试几次以检测探测包是否由于网络拥塞而被丢弃。这将导致扫描速度显著缓慢。\n\
    \n*   **unfiltered（未过滤）：**\n    未过滤状态意味着端口可用，但 Nmap 无法确定它是开放还是关闭。用户只有通过对防火墙规则集进行\
    \ ACK 扫描才能将端口归类为此状态。使用其他类型的扫描（如窗口扫描、SYN 扫描或 FIN 扫描）扫描未过滤端口可以帮助判断端口是否开放。\n\n* \
    \  **open/filtered（开放/已过滤）：** （未提供描述）\n\n*   **closed/filtered（关闭/已过滤）：** （未提供描述）\n\
    \n"
