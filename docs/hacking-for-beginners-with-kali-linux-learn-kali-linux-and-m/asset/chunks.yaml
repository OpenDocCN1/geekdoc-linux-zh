    meterpreter>\n```\n从上述会话的地址可以看出，攻击机的地址为 `192.168.2.10`，而目标主机的地址为 `192.168.1.10`。显然两个主机不在同一个网络。因此，如果你想渗透目标主机所在网络其他主机，需要添加相应的路由项。\n\
