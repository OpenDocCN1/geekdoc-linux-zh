    6) At this time, the wired network configuration is complete. But the interface
    has not been activated yet. Therefore, users need to activate the interface before
    they can obtain the assigned IP address and then access the Internet. Click the
    start button in this dialog box to connect to the wired network.


    7) From this dialog box, you can see that the status of the wired network is "Connected".
    This shows that the wired network configuration is successful. At this point,
    you can see the acquired address information in the "Detailed Information" tab.


    8) From this dialog box, you can see the wired network speed, `IPv4` and `IPv6`
    address, hardware address, default route and DNS information. Be sure to select
    the "Automatic connection (A)" check box on this interface. Otherwise, you cannot
    automatically connect to the network after restarting the computer. By default,
    the "Auto Connect (A)" check box is selected.


    ## Command line settings


    It is also very simple to configure the network using the command line, and the
    configuration can be completed with a few commands. The network connection configuration
    file of Kali Linux is `/etc/network/interfaces`. Use the `vi` editor to edit the
    `interfaces` file.


    The default content of the file is as follows:


    ```bash

    root@exampleserver:～# vi /etc/network/interfaces

    ```


    # This file describes the network interfaces available on your system # and how
    to activate them.


    As can be seen from the above information, only one `lo` interface is configured
    by default. If you want to configure a wired network, add the information of the
    Ethernet interface `ethX`. Similarly, users can set to obtain an IP address dynamically
    or assign an IP address statically (manually). For example, the following will
    set up the wired network of the Ethernet interface `eth0`.


    The method of dynamically obtaining an IP address is as follows:


    ```bash

    auto eth0 iface eth0 inet dhcp

    ```


    The method of statically assigning an IP address is as follows:


    ```bash

    auto eth0 iface eth0 inet static

    ```


    Users can choose a method that suits them to configure the wired network. After
    the setting is complete, save and exit the configuration interface of the `interfaces`
    file. Next, the user also needs to restart the network service to make the configuration
    in the `interfaces` file take effect.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# service networking restart

    ```


    After executing the above command, no information will be output. At this point,
    the user can use the `ifconfig` command to view the acquired address information.


    ## Configure wireless network


    Wireless network refers to any form of radio computer network. The computer needs
    to connect to the network through a wireless network card. If the user is a Kali
    Linux system installed in a virtual machine and wants to connect to a physical
    network, he can use a wireless network card to connect to his wireless network.


    The specific steps to configure a wireless network are as follows:


    1) Determine whether your host has a wireless network card. If there is no wireless
    network card, you can use a USB wireless network card. Insert the USB wireless
    network card into the host, and use the `lsusb` command to check whether the wireless
    network card is successfully identified.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# lsusb

    ```


    2) Use the `ifconfig` command to check whether the wireless interface interface
    is activated. as follows:


    ```bash

    root@exampleserver:～# ifconfig

    ```


    At this point, the user can use the `ifconfig -a` command to view all interfaces.
    After executing this command, if you see the `wlan` interface name, it means that
    the network card is successfully identified. The user needs to use the following
    command to activate the network card.


    ```bash

    root@exampleserver:～# ifconfig wlan0 up

    ```


    After executing the above command, there is no output information. In order to
    judge whether the wireless network card is successfully activated, the user can
    use the `ifconfig` command again to check.


    3) In the graphical interface of Kali Linux, click the shutdown button in the
    upper right corner, and a menu will pop up.


    4) From this menu, you can see commands such as "Wired Connected", "Wi-Fi Not
    Connected", and "Agent None". Select the "Wi-Fi not connected" option, and the
    subcommands for related settings will pop up.


    5) Select the "Select Network" command to see all Wi-Fi networks searched.


    6) In this dialog box, you can set the Wi-Fi network to be connected for network
    connection. For example, connect to the Test wireless network. First select the
    Test wireless network, and then click the "Connect" button, a dialog box will
    pop up.


    7) Enter the authentication password of the wireless network Test in this dialog
    box, and then click the "Connect" button. If the connection is successful, you
    can see the connected wireless network name.


    The above method is when the SSID name of the wireless AP is broadcasted and the
    user can connect directly. In many cases, users may hide their SSID number for
    security. At this time, the user cannot see the Wi-Fi network in the searched
    signal. So the user needs to manually add the wireless network and connect.


    The specific steps to connect to a hidden network are as follows:


    1) Use the `ifconfig` command to confirm that your wireless network card has been
    activated.


    2) Select the "Wi-Fi" option to open the WiFi dialog box. Click the list button
    in the upper right corner.


    3) As you can see from this dialog box, there are 3 options for connecting to
    hidden networks, turning on hotspots (Turn On Wi-Fi Hotspot), and known Wi-Fi
    Networks (Known Wi-Fi Networks). Here, click the "Connect to hidden network (C)..."
    button, and the dialog box will pop up.


    4) After entering the hidden Wi-Fi network information in this dialog box, click
    the "Connect" button to connect. Among them, Network name is used to specify the
    network name, and Wi-Fi security is used to specify the encryption method of the
    wireless network. By default, the system provides 6 authentication methods, namely
    WEP40/128-bit key (hexadecimal or ASCII), WEP 128-bit pass phrase, LEAP, Dynamic
    WEP (802.1x), WPA and WPA2 personal , WPA and WPA2 enterprises. When the user
    selects any encryption method, a corresponding password text box will pop up.
    In this example, the name of the connected wireless network is Test, and the encryption
    method is WPA-PSK/WPA2-PSK.


    5) After entering the hidden network information to be connected in this dialog
    box, click the Connect button to connect to the corresponding network.


    ## Configure VPN network


    VPN is called as virtual private network, which belongs to remote access technology.
    Simply put, it is to use a public network to set up a private network for encrypted
    communication. The following section will introduce the method of setting up a
    VPN proxy network in Kali Linux.


    1) ***Install the software package for VPN configuration***


    After the Kali Linux operating system is installed, the VPN proxy cannot be configured.


    Add network connection As you can see from this interface, it can only be imported,
    and cannot be added manually. This is because there is no relevant software package
    for VPN configuration installed in the current system. The following section will
    introduce several VPN configuration software packages that need to be installed.


    The execution command is as follows:


    ```bash

    root@exampleserver:～#apt-get install network-manager-openvpn-gnome -y

    ```


    After executing the above command, if no error is reported in the output information,
    it means that the software package is installed successfully. Then restart the
    network manager to make the network configuration take effect.


    ```bash

    root@exampleserver:～# service network-manager restart

    ```

