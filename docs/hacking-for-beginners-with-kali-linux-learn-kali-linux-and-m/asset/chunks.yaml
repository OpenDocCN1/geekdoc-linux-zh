    # Understanding Sniffing


    ![](images/00007.jpeg) ![](images/00006.jpeg)


    Sniffing is an important skill that needs to be understood by hackers and network
    administrators. In a network when packets can be accessed by anyone there is a
    lot of chance for stealing your sensitive information if they are not encrypted.
    These attacks are casually called by hackers as Man-in-the-middle attacks. When
    considered casually as a low risk by tech says, it is still a major reason for
    hackers to easily obtain passwords and credit card information from public spaces
    and hotspots. In this chapter, we will help you understand the procedure of Sniffing
