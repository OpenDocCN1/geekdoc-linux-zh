    # Introduction


    In the previous modules of this book we have talked about Kali Linux and its Philosophy.
    We also have gone through various information gathering and vulnerability scanning
    tools to make this hacking course a well versed one.


    In this next module we will increase in our intensity for approaching the subject.
    We will talk about exploits and their functionalities. We will provide various
    payload examples for making your work easy. Follow along!


    Disclaimer:


    Writers of this book never intended this book to write for encouraging malicious
    practices. Any mischief the readers do after reading this book is purely depends
    on individual ethics.


    ## Chapter 26


    # Introducing Metasploit


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    Metasploit is an open source security vulnerability detection tool. It can help
    network security and IT professionals identify security issues, verify the solutions
    to vulnerabilities, and complete the security assessment of the target. The tool
    encompasses various functions such as intelligent development, code auditing,
    web application scanning, and social engineering. This section will introduce
    the related concepts of Metasploit.


    **What is Metasploit?**


    Metasploit is a free, downloadable framework. Through it, network security personnel
    can easily obtain, mine, and attack computer software vulnerabilities. The Metasploit
    framework can be used to discover vulnerabilities, exploit vulnerabilities, submit
    vulnerabilities, and carry out attacks. Moreover, users can import data from other
    vulnerability scanners, discover attackable vulnerabilities based on the detailed
    information of vulnerable hosts, and launch attacks on the system using payloads.'
