    ## Install the graphics card manufacturer''s driver


    Users can install not only the open source graphics driver, but also the graphics
    manufacturer driver. The following section will introduce the method of installing
    the driver of the graphics card manufacturer.


    The following will take the Nvidia graphics card as an example to introduce the
    method of installing the driver of the graphics card manufacturer.


    The specific steps are as follows:


    1) Check the graphics card model and execute the command as follows:


    ```

    root@exampleserver:～# lspci 00:00.0 Host

    ```


    From the output information, we can see that the graphics card model in the current
    system is GeForce GT 440.


    2) Download the driver package from Nvidia official website. Among them, the download
    address is [`https://www.nvidia.com/download/index.aspx`. After successfully accessing
    the URL in the browser, the dialog box shown in Figure 3.76 will be displayed.


    3) Select the product type from the Product Type drop-down list of the dialog
    box, such as GeForce; select the product series type from the Product Series drop-down
    list, such as GeForce 400 Series; select the graphics card model from the Product
    drop-down list, such as GeForce GT 440; Select the operating system type in the
    Operation System drop-down list, first select the Show all Operating Systems option,
    and then select the Linux 64-bit option; select the language type in the Language
    drop-down list, such as German (Simplified).


    4) Click the `SEARCH` button to jump to the driver download page. Click the "Product
    Support List" tab to view the supported graphics chips. After confirming that
    it is correct, click the "Download" button to jump to the download confirmation
    page. Click the "Download" button on this page to start downloading the driver.


    5) Install the dependency package of the compiled driver, execute the command
    as follows:


    ```

    root@exampleserver:～# apt-get install pkg-config

    ```


    6) Run the downloaded driver and execute the command as follows:


    ```

    root@exampleserver:～# chmod +x NVIDIA-Linux-x86_64-390.87.run

    root@exapleserver:～# ./NVIDIA-Linux-x86_64-390.87.run

    ```


    7) After running, an error message will pop up to warn that the `Nouveau` module
    is not prohibited.


    8) Press the Enter key, and the Generate Nouveau Configuration File dialog box
    will pop up.


    9) Use the arrow keys to switch to the `Yes` button, and then press the Enter
    key to pop up the configuration file generation prompt dialog box.


    10) Press Enter to confirm the file generation information, and the installation
    failure dialog box will pop up.


    11) Press Enter to exit the installation interface. Restart the Kali Linux system,
    run the installation file again, and the CC version detection dialog box pops
    up.


    12) Use the arrow keys to switch to the `Ignore CC version check` button, and
    then press the Enter key, a dialog box for confirming the CC version check pops
    up.


    13) Press Enter to start installing the driver.


    14) After the installation is complete, a dialog box for installing 32-bit compatible
    libraries will be prompted.


    15) Use the arrow keys to switch to the `No` button, and then press the Enter
    key to start installing the library file.


    16) After the installation is complete, the configuration file generation dialog
    box will pop up.


    Use the arrow keys to switch to the `Yes` button, and then press the Enter key
    to pop up the installation completion dialog box.


    17) Click the `OK` button, the graphics card installation is complete, and exit
    the installation program.


    Similarly, if the current computer has dual graphics cards, use the `VI` editor
    to create the configuration files `/usr/share/gdm/greeter/autostart/optius.dekstop`
    and `/etc/xdg/autostart/optimus.desktop` in sequence, and add the following content
    respectively:


    ```

    [Desktop Entry] Type=Application Name=Optimus Exec=sh -c "xrandr --setprovideroutputsource
    modesetting NVIDIA-0; xrandr --autostart" NoDisplay=true X-GNOME-Autart-Phase=DisplayServer

    ```


    Add the above content to the corresponding configuration file and save it, then
    restart the computer to make the graphics card driver take effect.


