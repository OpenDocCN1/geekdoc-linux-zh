    \ terminal you can see that all subdomains and corresponding IP addresses of the\
    \ domain name `wikipedia.com`. You can use their ip addresses and sub-domains\
    \ to accurately attack your target.\n\n#### 2) Online query\n\nUsers can also\
    \ search for subdomains by online query techniques. Among them, the popular address\
    \ for online query of subdomain names is to visit the following website (https://phpinfo).\
    \ When the user successfully visits the address in the browser, the interface\
    \ that asks for the domain name will be displayed.\n\nEnter the domain name to\
    \ be queried in the text box. Then, click the \"Start\" button to find the corresponding\
    \ subdomain. For example, we can find the different subdomain names of the domain\
    \ name wikipedia.com.\n\nAll subdomains that are available for `wikipedia.com`\
    \ will be displayed instantly.\n\n*What Next?*\n\nBy now you are quite aware of\
    \ the techniques to find subdomains and understanding the properties of a particular\
