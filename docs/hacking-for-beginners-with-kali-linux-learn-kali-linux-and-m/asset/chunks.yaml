    **Cracking the hash password**


    In order to avoid the harm caused by information leakage, in actual application,
    the software and system will encrypt the password and then save it. Common encryption
    methods are various hash algorithms. This type of algorithm can encrypt passwords
    of different lengths into fixed-length strings. Since the encrypted string has
    a fixed length and cannot be directly reversed cracked, it has a very high degree
    of security and is therefore widely used. The method to crack the hashed password
    will be introduced below.


    **Identify the hash encryption method**


    Hash encryption is a type of algorithm, including many specific algorithms. When
    a penetration tester is cracking a hash password, if he determines the encryption
    method of the hash password, he can choose targeted tools and methods to crack
    it, which can save a lot of time and improve the efficiency of cracking. The following
    section describes how to use the hashid tool to identify the hash encryption method.


    Use the hashid tool below to identify the encryption method of the hash password
    value 6bcec2ba2597f089189735afeaa300d4.


    The execution command is as follows:


    root@exampleserver: hashed tool MD5


    The above output information shows the possible hash password methods. Among them,
    the hash type shown in the front is more likely. It can be guessed that the hash
    type of the password is MD2 or MD5.


    **Cracking LM Hashes password**


    LM (LAN Manager) Hash is one of the earliest password hashing algorithms used
    in the Windows operating system. The following will introduce the method of using
    findmyhash tool to crack LM Hashes password.


    The syntax format of using findmyhash tool to crack the password is as follows:
    ￼


    > findmyhash OPTIONS


    In the above syntax, the parameter algorithm indicates the type of password algorithm
    to be cracked. The supported algorithms are MD4, MD5, SHA1, SHA224, SHA256, SHA384,
    SHA512, RMD160, GOST, WHIRLPOOL, LM, NTLM, MYSQL, CISCO7, JUNIPER, LDAP_MD5 and
    LDAp_SHA1\. OPTIONS indicates available options.


    Among them, the commonly used options and their meanings are as follows: ·


    -H <hash_value>: Specify the crackedHash value. ·


    -F : Specify the list of cracked hash files. ·


    -G: If the hashed password cannot be cracked, a Google search will be used and
    the result will be displayed. Among them, this option can only be used with the
    -h option.


    Use the findmyhash tool to crack the original password of the LM hash password
    5f4dcc3b5aa765d61d8327deb882cf99.


    The execution command is as follows: ￼


    > root@exampleserver:～# findmyhash MD5-h


    ＊＊＊＊＊ HASH CRACKED!! ＊＊＊＊＊￼


