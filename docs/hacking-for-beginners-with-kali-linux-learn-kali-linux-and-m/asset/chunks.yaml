    to the target host by email or other means, and then establish a monitoring locally.
    When the target host opens the PDF file, he may be attacked.


    ## Use MS17_010 vulnerability to carry out attacks


    MS17_010 is a Microsoft Windows vulnerability exploited by "Eternal Blue" (ransomware).
    Penetration testers may allow remote code execution by using this vulnerability
    to send specially designed messages to the Microsoft Server Block 1.0 (SMBv1)
    server. The following will introduce the use of MS17_010 vulnerability to target
    WindowsServer 2008 R2 (x64) implemented penetration testing.


    1) Query the penetration test module that can exploit the MS17-010 vulnerability.

    The execution command is as follows:

    ```

    msf5> search ms17-010

    ```

    From the output information, you can see that 5 available penetration test modules
    have been found. By analyzing the description information, we can see that the
    second is the scanning module; the third is the vulnerability exploitation module.
    At this point, before implementing the penetration test, use the scanning module
    to detect whether the target has the vulnerability.


    2) Select the `smb_ms17_010` module and view its configuration options.

    The execution command is as follows:

    ```

    msf5> use auxiliary/scanner/smb/smb_ms17_010

    msf5 auxiliary(scanner/smb/smb_ms17_010)> show options

    ```

