    # Chapter 39


    ## Usage of Airodump-ng Tool


    ![](images/00011.jpeg) ![](images/00010.jpeg)


    ### Using Airodump-ng tool


    Airodump-ng is a tool in `Aircrack-ng` toolset, which can be used to scan the
    surrounding wireless network signals. The name, MAC address, channel and encryption
    method of the surrounding open AP can be known by analysing the captured wireless
    signal packets. The following section describes the method of scanning wireless
    networks using Airodump-ng.


    The syntax for scanning wireless networks using Airodump-ng tool is:


    ```

    root@exampleserver: airodump scan

    ```


    In the above syntax, the parameter `interface` indicates the wireless network
    card.


    Scan wireless network with Airodump-ng tool.


    Execute the command as follows:


    ```

    root@exampleserver: airodump wireless

    ```


    The scanned wireless network information can be seen from the output information.
    There are many columns in the output information, and the meaning of each column
    is as follows:


    1. `BSSID`: Indicates the MAC address of the wireless AP.

    2. `PWR`: The signal level reported by the network card, which mainly depends
    on the driver. The higher the signal value, the closer it is to AP or computer.
    If the values of `BSSID` and `PWR` are both `-1`, it means that the driver does
    not support reporting signal level. If the `PWR` value is `-1`, it means that
    the client is not in the range that the current network card can listen to, but
    can capture the data sent by AP to the client. If all client `PWR` values are
    `-1`, then the network card driver does not support signal level.

    3. `Beacons`: The announcement number sent by the wireless AP. Each access point
    (AP) transmits about 10 beacon per second at the lowest rate (`1M`).

    4. `Data`: The number of captured data packets (if it is WEP, it represents the
    number of unique IVS), including broadcast packets.

    5. `s`: The number of data packets captured per second in the past 10 seconds.

    6. `Ch`: channel number (obtained from Beacons).

    7. `Mb`: The maximum rate supported by wireless AP. If the value is `11`, it means
    that the `802.11b` protocol is used. If the value is `22`, it means that the `802.11b+`
    protocol is used. If it is higher, it means that `802.11g` protocol is used. If
    the value contains a dot (after `54`), it indicates that short preamble is supported.
    If the value contains `e`, it means that `QoS(802.11 e)` is enabled in the network.

