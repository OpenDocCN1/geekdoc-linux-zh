- fmt: "\nIn the previous chapter we have introduced different methods to install\
    \ Kali Linux in both virtual and physical systems. Before starting to learn about\
    \ different tools that Linux comes with it is important to understand the functionalities\
    \ of Kali as an operating system. Learn about its terminal and network capabilities\
    \ can improve your productivity while pen testing. A lot of the sections that\
    \ are described in this chapter needs access to the Kali system for better understanding.\
    \ So, make sure that you are having a Kali Linux operating system on your computer\
    \ while reading this book.\n\n## Kali Linux in Depth\n\nIf you configure the Kali\
    \ Linux system then you need to have a simple understanding of the system, such\
    \ as the use of the menu bar, file management, system settings. This section will\
    \ introduce the common operations of Kali Linux system.\n\n### Command menu \n\
    \nA large number of penetration testing tools are provided in Kali Linux. These\
    \ tools are classified into different categories such as information collection,\
    \ vulnerability analysis, Web programs. The user can see all the categories by\
    \ selecting the \"Application\" tab on the graphical interface.\n\nFrom this starting\
    \ interface, you can see that the application includes 14 categories. Moreover,\
    \ each category has definite subcategories. Out of all the softwares available\
    \ some tools are run on the graphical interface while some run on the command\
    \ line. For tools running on a graphical interface, it is more convenient to start\
    \ them through a menu command. For the tools running on the command line, it is\
    \ often not available or possible to enter from the menu command and must be executed\
    \ in the terminal. Therefore, it is not recommended to enter the tool from the\
    \ command line. Always make sure that you refer individual doc format of tools\
    \ for both GUI and CLI commands.\n\n### File tool \n\nThe File tool is used to\
    \ manage files in a graphical interface. If you want to perform file management,\
    \ you need to be very clear about the file system structure. Otherwise, you may\
    \ face the problem of not being able to find the location of the file. Linux system\
    \ is different from Windows system. Unlike windows it does not store files by\
    \ drive letter. There is only one root partition in the Linux system, and all\
    \ files are in the root directory. In order to facilitate users to better manage\
    \ files, first we will in detail explain the file system structure of the Linux\
    \ system.\n\nThe file system structure under Linux is a tree, and the entry of\
    \ it is the file directory under the `//(root)` tree structure. No matter which\
    \ version of the Linux system, there are these directories, which are standardised\
    \ directories. There will be some small differences between various Linux distributions,\
    \ but overall they are similar. When users try to understand the structure of\
    \ the Linux file system, they may not know the division of these files very well\
    \ due to its complexity.\n\nThere are several important directories in Linux such\
    \ as:\n\n#### 1) Home Directory \n\nEvery user under Linux has a home directory,\
    \ which stores the user's files. Among them, the location of the user file is\
    \ `/home/username`. However, the home directory of a super user is different from\
    \ that of an ordinary user. The home directory of a super user is `/root`, which\
    \ is also called the home directory. When the user opens the terminal, the location\
    \ is the home directory of the user who logs in to the system. In addition, each\
    \ ordinary user can only access his own home directory. However, the administrator\
    \ can access the home directories of all users. This is why hackers always try\
    \ to hack the privileges of an administrator as there can be more ways to exploit\
    \ the system.\n\n#### 2) Root Directory \n\nThe root directory is the entry of\
    \ the file system and is called the highest level directory. Every file and directory\
    \ starts from the root directory, and only the root user has write permissions\
    \ under this directory.\n\n#### 3) Several other important folders \n\nIn addition\
    \ to the two directories mentioned above, there are several important folders\
    \ that users need to understand, such as `/etc`, `/bin`, `/sbin`, etc.\n\nHere\
    \ is a small introduction about them:\n\n*   `/bin`: The commands required by\
    \ the basic system are the commands required by the minimal system, such as `ls`,\
    \ `cp`, `mkdir`, etc. The files in this directory are executable and can be used\
    \ by general users.\n*   `/sbin`: This directory is mainly used to store system\
    \ management commands. It is the place where the executable commands of the super-privileged\
    \ user root are stored. Ordinary users have no permission to execute the commands\
    \ in this directory. This directory is similar to the `/usr/sbin` or `/usr/local/sbin`\
    \ directory. Just remember that everything contained in the `sbin` directory can\
    \ only be executed with root privileges\n*   `/etc`: Store configuration files\
    \ of system programs or general tools.\n*   `/usr`: This is the directory where\
    \ the system stores programs, such as commands and help files. There are many\
    \ files and directories in this directory. When a user installs a software package\
    \ officially provided by a Linux distribution, most of them are installed here.\
    \ If there are server configuration files involved, the configuration files will\
    \ be installed in the `/etc/` directory.\n*   `/var`: The contents of this directory\
    \ change frequently. `/var` usually has `/var/log`, `/var/spool`, `/var/cache`,\
    \ etc. Among them, `/var/log` is the directory used to store system logs. `/var/spool`\
    \ is the spool directory for storing printers, mails, proxy servers, etc./var/cache`\
    \ is used to store some cache files.\n\nAfter the user gets a clear understanding\
    \ of the Kali Linux file system structure, file management can be carried out.\
    \ Here we will introduce the file management tool of the graphical interface system\
    \ of Linux.\n\n1. Select \"Location\" | \"Computer\" on the desktop so that the\
    \ root directory of the file system will be opened.\n2. From this interface, you\
    \ can see all files and folders in the root directory. At this point, the user\
    \ can perform operations such as opening files, creating files, deleting files,\
    \ and viewing file contents. If you want to open a file, just double-click the\
    \ file. If you want to delete or copy a file, you need to select the file or folder\
    \ and right-click, a menu will pop up. Among them, the pop-up menus of folders\
    \ and files will be shown.\n3. At this time, select any command in the pop-up\
    \ menu to execute the corresponding operation. For example, select the \"open\
    \ with text editor\" command to display the contents of the file.\n4. This interface\
    \ displays the contents of the `sources.list` file. At this point, the user can\
    \ edit the content in the file. If you can modify the content of the file, you\
    \ can click the \"Save (S)\" button to make the modification effective.\n\n###\
    \ Terminal\n\nThe terminal can be understood as a file management tool in command\
    \ line mode. For users who like to use command line operations, you can use the\
    \ terminal mode to realise file management. Through the previous introduction,\
