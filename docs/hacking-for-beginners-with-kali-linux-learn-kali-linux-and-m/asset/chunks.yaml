    installation disk to install the Kali Linux operating system on the physical machine.


    **Note:** After writing the Kali Linux system image, the partition format of the
    U disk becomes Ext4\. The file format cannot be recognised by Windows, so it will
    prompt that the U disk cannot be accessed normally and requires formatting. Just
    ignore the error message here.


    ***Prepare Kali Linux hard disk partition***


    For most users, they like to use the Windows operating system, but they also want
    to experience the use of Kali Linux to implement penetration testing on a physical
    machine. At this requirement, the best solution is to install dual systems.


    If you want to install a dual system, you need to prepare the hard disk partition
    for installing the Kali Linux system. If the hard disk partition is not prepared,
    it may cause damage to the original system or erase important files in a partition
    due to misoperation.


    Therefore, for safety reasons, choosing a separate hard disk or separate partition
    to install the Kali Linux system is the best choice. If the user has a separate
    hard disk to install the system, just install the system directly. If there is
    no separate hard disk, you need to split the existing disk to create a separate
    partition for installing the operating system. The following section will introduce
    the method of preparing to install the hard disk partition of the Kali Linux system.


    The following section will introduce the method of compressing the volume to divide
    a separate partition to install the Kali Linux operating system.


    *The specific steps are as follows:*


    1) Right-click the "Computer" icon on the desktop and select the "Manage" command
    to open the "Computer Management" interface.


    2) Select "Storage" | "Disk Management" option in the left column, so that the
    disk management interface will be displayed.


    3) From this interface, you can see that there are two disks in the current system,
    disk 0 and disk 1\. Moreover, both disks have only one partition, and the disk
    partition letters are C and E. Among them, the operating system is installed in
    disk 0\. So, choose Disk 1 here and divide it into a 100GB partition. Here, select
    E partition and right-click and a menu will pop up.


    4) Select the "compressed volume (H)..." command, so that the compressed space
    setting dialog box will be displayed.


    5) The available compressed space is displayed in this dialog box. Set the compressed
    space size to 102400MB here, and click the "Compress" button. When the compression
    is successful, you can see the divided free disk space.


    6) It can be seen from this interface that a 100GB partition has been successfully
    divided in Disk 1\. In the next step, the user can install other operating systems
    to the partition.


    **Set the first startup item**


    After the user prepares the hard disk partition and installation media, the operating
    system can be installed on the physical machine. The method of installing the
    operating system is the same as the method of installing in a virtual machine.
    However, to install the operating system on a physical machine, you need to set
    the startup item of the installation medium.


    In general, the hard disk is the first boot item. If you use a USB installation
    disk to install the operating system, you need to set the first boot item as a
    USB device. In addition, to install dual systems in a physical machine, you also
    need to pay attention to the selection of hard disk partitions and GRUB settings.
    If you are not careful, data will be lost. The following section will introduce
    some settings for installing the operating system on the physical machine.


    *Set the USB device as the first startup item*


    Since it is not convenient to take a screenshot on a physical machine, the following
    section will take a virtual machine system as an example to introduce the method
    of modifying the first startup item.


    *The specific steps are as follows:*


    1) Start the computer and enter the BIOS interface. The virtual machine must be
    powered off before it can enter the virtual machine. After turning off the virtual
    machine, select the "Virtual Machine" | "Power" | "Enter the firmware when power
    on" command in the menu bar.


    Note: If it is in a physical machine, the user needs to press F2, F12 or Del key
    (different models, the keys are also different, usually the F2 key) when the black
    background and white font interface starts to appear to enter the BIOS interface
    .


    2) Select the "Enter firmware when power is turned on" command to enter the BIOS
    main menu interface of the current system.


    3) This interface is the BIOS main menu interface. In this interface, the user
    uses the right arrow key to switch to the Boot tab, and the dialog box shown will
    be displayed.


    4) From this dialog, you can see that there are 4 options, namely Removable Devices,
    Hard Drive, CD-ROM Drive, Network boot from Intel E1000 (Network). These 4 options
    represent 4 startup methods, and the user only needs to move the first startup
    item to the first position. If you use the CD to start the system, use the down
    arrow key to select the CD-ROM Drive option, and press the plus (+) key to move
    the option to the first position. The setting of this dialog box means that the
    first startup item is Removable Devices, that is, U disk startup. After the setting
    is complete, save and exit the BIOS. Then switch to the Exit tab to the right,
    so that the dialog box will be displayed.


    5) This dialog box is used to choose whether or not to save the settings. Select
    Exit Saving Changes (save and exit the settings) option, press Enter, and the
    dialog box will pop up.'
