    执行上述命令后，系统将检测依赖的依赖环境并下载相应的软件包包。然后，它将在终端环境中自动安装所有已下载的包。


    如果在安装过程中没有报告错误，则说明 `OpenVAS` 服务安装成功。如果您遇到任何错误，请检查其在线文档以排排除错误。


    ## 2) 初始化 OpenVAS 库


    在用户成功安装 `OpenVAS` 服务后，需要对其进行初始化。在此过程中，`OpenVAS` 将根据最新的可用性下载许多文件（插件和漏洞数据）。此过程需要很长的时间，用户需要耐心等待。我们建议在这一步骤使用高速网络连接。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-setup

    ```


    从上述输出信息中，您可以看到已经下载了大量文件，并且所有的库都已更新。此外，在最后，OpenVAS 相关的服务顺序启动，并自动生成了默认账户和密码。请记下用户名和密码，以便在通过命令行界面尝试初始化时使用。密码通常是加密的。


    提示：在 Kali Linux 2019 中，当所有 OpenVAS 服务成功启动后，浏览器将自动打开，并可以访问 OpenVAS 的登录界面。


    ## 3) 初始化密码


    当用户初始化 `OpenVAS` 服务时，默认会生成一个长字符串密码。这个密码既不容易输入也不容易记忆，显然不符合用户使用通用简单密码的习惯。因此，为了方便起见，您可以使用以下命令快速更改密码。


    执行命令如下：


    ```

    root@exampleserver:～# openvasmd --user=admin --new-password=“this-is-my-new-password”

    ```


    执行上述命令后，将不会显示任何输出。然而，这并不意味着密码没有更改。请再次运行设置命令检查密码是否已更改。


    注意：如果您再次运行 `openvas-setup` 命令，同步速度将非常快，并显著提高其速度。


    ## 4) 检查安装的完整性


    在某些情况下，使用 `apt-get` 安装总是会导致各种类型的错误。此时，用户可以使用 `openvas-check-setup` 命令对错误进行排排除。该命令不仅会指出错误的位置，还会提示解决方案。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-check-setup

    ```


    通过上述命令，您需要了解软件将分 9 步进行检查。检查完成后，如果您看到“success prompt”消息，则说明 OpenVAS 安装成功。


    ## 5) 检查 OpenVAS 服务状态


    当 `OpenVAS` 服务初始化后，您就可以访问该服务。为了确保访问 OpenVAS 服务没有问题，请在此处检查其状态。用户可以使用 `netstat`
    命令查看监控端口，并按照如下方式判断 OpenVAS 服务是否成功启动。


    ```

    root@exampleserver:～# netstat

    ```


    该命令显示 OpenVAS 服务已经启动。如果您没有看到上述监控程序显示与 OpenVAS 相关的运行，则说明服务未启动。


    ## 6) 设置外部访问


    通过检查 OpenVAS 服务的监控状态，我们可以看到服务的默认监控地址为 `127.0.0.1`，这意味着只允许本地主机访问。为了方便起用，用户需要手动配置外部访问。在这里，您需要将
    3 个配置文件中的监听 IP 从 `127.0.0.1` 修改为 `0.0.0.0`（代表任何 IP）。然后，重启 OpenVAS 服务。


    具体步骤如下：


    1) 修改 `greenbone-security-assistant.service` 配置文件。在该文件中，有两个地方需要修改。第一个是修改 `--listen`
    和 `--mlisten` 的监听地址。第二个是增加 host header 的主机地址。


    在这里，首先将监听地址设置为任何 IP（`0.0.0.0`），如下：


    ```

    root@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant

    ```


    2) 增加 host header 的主机地址。如果没有增加 host header 的主机地址，外部访问将出现以下错误信息：`The request contained
    an unknown or invalid Host header.`。如果您尝试通过主机名或代理访问 GSA，请确保 GSA 已设置允许访问。


    在 `--mlisten=0.0.0.0` 之后添加 `--allow-header-host=IP address or domain name`。其中，这台机器的
    IP 地址为 `192.168.19.132`，即外部访问的 IP 地址为 `192.168.19.132`，如下：


    ```

    ExecStart=/usr/sbin/gsad --foreground --listen=0.0.0.0--port=9392--mlisten=0.0.0.0
    --allow-header-host=192.168.19.132--mport=9390

    ```


    3) 修改 `openvas-manager` 配置文件中的监听地址，如下：


    ```

    root@exampleserver:～# vi /etc/default/openvas-manager

    ```

    `MANAGER_ADDRESS=0.0.0.0`


    4) 修改 `greenbone-security-assistant` 配置文件中的监听地址，如下：


    ```

    ～# vi /etc/default/greenbone-security-assistant

    ```

    `GSA_ADDRESS=0.0.0.0`


    5) 重启 OpenVAS 服务。


    执行命令如下：


    ```

    root@exampleserver:～# openvas-stop

    ```


    ```

    root@exampleserver:～# openvas-start

    ```


    执行上述命令后，OpenVAS 服务重启。


    此时再次检查监控状态，结果如下：


    ```

    root@exampleserver:～# netstat -anput

    ```


    如果您从输出可以看到 `gsad` 监控的地址为 `0.0.0.0`，则外部主机可以访问 OpenVAS 服务。


    **接下来做什么？**


    在下一章中，我们将介绍如何配置 OpenVAS。请继续！


    ## 第 21 章


    # 配置 OpenVAS


    通过前面的系列配置后，用户可以登录 OpenVAS 服务。成功登录 OpenVAS 服务后，执行漏洞扫描需要一些简单的配置，例如创建扫描配置、扫描目标和扫描任务。下节将介绍如何登录和配置
    OpenVAS 服务。


    ### 登录 OpenVAS 服务


    登录 OpenVAS 服务请严格遵循以下步骤。如果遇到任何错误，请务必参考官方网站的故障排除指南。


    具体步骤如下：


    1) 在浏览器输入地址 `https://exampleserver:9392/`（IP 地址是 OpenVAS 服务的地址），以便访问 OpenVAS 服务。


    2) 此处界面显示浏览器访问的链接不可信。这是因为该链接使用了 HTTPS 协议，访问时是安全可靠的。点击“高级”按钮，将显示您可能面临的风险内容。

    '
- fmt: '

    5) Enter the user name and password in the dialog box to log in to the service.
    The user name here is the `admin` user automatically created when OpenVAS was
    configured earlier, and the password is `this-is-new`. After entering the user
    name and password, click the `Login` button so that the main interface of OpenVAS
    will be displayed.


    6) If you see the content displayed on this interface, it means you have successfully
    logged in to the OpenVAS service.


    Note: After restarting the system, if you want to use the OpenVAS tool, you need
    to restart the service. Otherwise, you cannot log in to the server. If an error
    occurs when starting the service, use the `openvas-setup` command to resynchronise
    the database. After the command is inserted all the related services will be started
    automatically.


    ## New scan configuration


    The scan configuration is used to specify the plug-ins that are required to scan
    the target. When scanning with the OpenVAS tool, a scanning task is required to
    achieve. However, the scan task is composed of a scan configuration and a target.
    Therefore, before implementing a scan, you must first create a scan configuration
    and scan target.


    The OpenVAS service provides 8 scan configuration templates by default, which
    users can use directly. If the provided configuration template does not meet the
    needs of the user, the user can create it by himself and specify a specific plug-in
    family.


    The following section describes how to create a scan configuration.


    *The specific steps are as follows:*


    1) In the menu bar, select the `Configuration|Scan Configs` command in turn to
    open the scan configuration interface.


    2) It can be seen from this interface that 8 scan configurations are provided
    by default. Click the `New Scan Config` button in this interface to open the `New
    Scan Config` dialog box.


    3) Set the name of the scan in this dialog box. Here it is set to `initial`. Select
    the `Empty`, `static` and `fast` radio button in the `Base` option to allow users
    to start from scratch and create their own configuration interface. Then, click
    the `Create` button, and the edit scan configuration interface will be displayed.


    4) From the `Family` column of this interface, you can see the supported vulnerability
    scanning plug-in families. If you want to select a certain type of plug-in, just
    select the check box in the `Select all NVTs` column. If the user wants to specify
    a specific plug-in of a certain type of plug-in, he can click the `(Edit Scan
    Configuration Plug-in Family)` button in the `Actions` column, and the interface
    for editing the scan configuration plug-in family will be displayed.


    5) In this interface, you can select specific plug-ins in the plug-in family to
    perform scanning. If you don’t want to use a certain plugin, just uncheck the
    checkbox in the `Selected` column. After setting, click the `Save` button and
    the interface will be displayed.


    6) It can be seen from this interface that the scan configuration `initial` has
    been successfully created, 59 plugin families have been selected out of a total
    of 49612 plugins.


    ## New scan target


    After creating a scan configuration, you need to create a scan target. Scan target
    is used to specify the address, scan port and scan method of the scan target host.


    *The specific steps are as follows:*


    1) Select the `Configuration|Targets` command in the menu bar in turn, the interface
    shown will be displayed.


    2) From this interface, you can see that no targets are created by default. Click
    the `New Target` button , the dialog box for creating a new target will open.


    3) Enter the target name, host address and port list in this dialog box. When
    specifying the target host address, the user can enter a network segment, a single
    address or multiple addresses, separated by commas. The user can also save the
    scanned target address in a file, select the `From file` format, and select the
    file of the target address. Then click the `Create` button to show an interface.


    3) From this interface, you can see the newly created `Lan Scan` target.


    ## New scan task


    After the scan configuration and target are created, you can create a scan task,
    and then scan the specified target. The method to create a scan task is described
    below.


    *The specific steps are as follows:*


    1) Select the `Scans|Tasks` command in the menu bar, and the interface with details
    will be displayed.


    2) This interface displays the welcome message of OpenVAS scanning task management.
    If the user does not want to view it, click the `close` button in the upper right
    corner. Then, the scan task interface will be displayed.


    3) It can be seen from this interface that no task has been created currently.
    Then click the `New Task` button, the `New Task` dialog box will open.


    4) Set the task name, scan configuration and scan target in this dialog box. Here,
    you will choose to use the newly created scan configuration and scan target, and
    use the default settings for other options. Then, click the `Create` button, you
    will see the newly created scan task.


    5) From this interface, you can see the newly created `Lan Scan` task, and the
    status is `New`. Next, the scanning task will start and the target will be scanned.


    ## Scanning for vulnerabilities


    Through the previous basic configuration, the OpenVAS service is configured. Next,
    you can start the vulnerability scan. The following will take the previously created
    scan task as an example to implement vulnerability scanning.


    *The specific steps are as follows:*


    1) Open the scan task interface.


    2) Click the `Start` button in the `Actions` tab bar to start vulnerability scanning.


    3) From the `Status` column in this interface, you can see that 66% has been scanned
    currently. If users want to stop scanning, they can click the `Stop` button in
    the `Actions` column. After the scan is completed, the status changes from `New`
    to `Done`.


    4) From the `Status` column in this interface, you can see that the status has
    been displayed as `Done`, indicating that the scan is complete. Next, you can
    analyse the scan results to obtain vulnerability information in the target host.


    Reminder: Normally, after users start scanning, they will find that the scanning
    speed is very slow and the status bar hardly changes. In fact, the target is being
    scanned all the time. Since this is the content displayed in the browser, the
    user needs to refresh the page manually to see the status change.


    Users can also set it to refresh automatically every few minutes. The default
    setting of OpenVAS is not to refresh automatically, and modify it to refresh automatically
    below. OpenVAS provides 4 automatic refresh times by default. The user clicks
    the drop-down button in the figure, and the settable auto refresh time drop-down
    menu will be expanded. The user can choose any method, so that you can see the
    scan status changes at any time-melted.


    ## Analyze and export vulnerability scan reports


    After the user scans the target host, the vulnerability information of the target
    host can be obtained from the scan results. Similarly, in order to facilitate
    users to analyse their scan results, OpenVAS also supports exporting vulnerability
    information in different report formats.


    The method to analyse and export the vulnerability scan report will be introduced
    below.


    ### Analyse the vulnerability scan results


    It is important to analyse and report the vulnerabilities for the system administrators.
    By using effective documentation there is a huge chance that the loophole will
    be soon cleared by the development team.


    *The specific steps are as follows:*


    1) Open the scan result interface.


    2) From the `Severity` column, we can see that there are very serious vulnerabilities
    in the target host, and the security level is `10.0` (High). Click the button
    in the `Status` column, and the vulnerability scan result information will be
    displayed.

