    The execution command is as follows:


    ```bash

    root@exampleserver:～# nmap -sP 72.132.234.64

    ```


    You can also check multiple hosts at once. Below, we provide an example for your
    reference for this scenario.


    ### Use-case scenario


    Use `Nmap` to detect whether the hosts `72.132.234.64`, `72.132.234.65` and `72.132.234.66`
    are online or not.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# nmap -sP 72.132.234.64-66

    ```


    This shows the output about the availability of these 3 servers.


    ### Use Netdiscover tool


    `Netdiscover` is an ARP investigation tool that supports both active and passive
    modes. You can use this tool to scan IP addresses on the network and also to check
    hosts that are online.


    The following section will introduce the use of `Netdiscover` tool to implement
    ARP active scanning.


    *The syntax format is as follows:*


    ```bash

    netdiscover -r [range]

    ```


    The option `-r [range]` in the above syntax is used to specify the network range
    that needs to be scanned. If the user does not specify a target, then the target
    network will be automatically selected for scanning.


    *Use-case scenario:*


    Use `Netdiscover` tool to scan online hosts in the `72.132.234.64/94` network
    segment.


    *The execution command is as follows:*


    ```bash

    root@exampleserver:netdiscover -r 72.132.234.64/94

    ```


    By analysing the captured packets, you can know the current active host IP address,
    MAC address, and MAC address manufacturer in the current LAN. You can see the
    address of the online host from the IP column. When the scanning is completed
    all the information that is obtained will be displayed. If you observe keenly
    you can valuable information about the host that you are trying to attack. After
    carefully studying the output, press `Ctrl+C` key combination to exit the scanning
    interface of `Netdiscover` tool.


    Users sometimes can also not specify the scan range, and can find as many online
    hosts as possible.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# netdiscover

    ```


    However, we suggest you to not try this as it may result in tons of hosts that
    are often not worth your time to attack. Always make a thorough research before
    attacking the host networks. If not, intrusion detection systems will catch your
    response and can ban you for a considerable amount of time.


    ### Monitor Discovery Host


    Snooping means not actively sending data packets to the target, but only monitoring
    data packets in the network. In a local area network, some protocols will automatically
    broadcast data packets, such as ARP broadcast and DHCP broadcast. The broadcast
    packet is a data packet that all users in the LAN can receive. Therefore, users
    can detect active hosts on the network by monitoring these packets. The following
    section will introduce the discovery of the host by monitoring.


    #### 1) ARP monitoring


    `ARP` (Address Resolution Protocol) is a TCP/IP protocol that obtains physical
    addresses based on IP addresses. When a host sends information, it broadcasts
    an ARP request containing the target IP address to all hosts on the network and
    receives a return message to determine the target''s physical address. Therefore,
    by implementing ARP monitoring, active hosts in the LAN can be discovered.


    The following section will introduce the passive mode implementation of ARP monitoring
    using `Netdiscover` tool to discover online hosts.


    *The syntax format of `Netdiscover` tool for passive scanning is as follows:*


    ```bash

    netdiscover -p

    ```


    The option `-p` in the above grammar means to use passive mode, that is, to say
    that no data packets need to be sent, but are only allowed for sniffing.


    From the output of the first line of information, you can understand that the
    scan is being performed in passive mode. From the second line of information,
    you can see the number of sniffed packets, the number of hosts, and the packet
    size. The information below line 3 will be about the sniffed packet information.
    You can see the detected online hosts from the IP column. A lot of other tasks
    can be completed using this command in the net discover tool. We recommend you
    to experiment with these commands for better understanding of the topic.


    #### 2) DHCP snooping


    `DHCP` (Dynamic Host Configuration Protocol, dynamic host configuration protocol)
    is a local area network network protocol, its main function is to realise the
    internal network or network service providers to automatically assign IP addresses.
    When a client needs to obtain an IP address, it will send a broadcast packet.
    Then, the DHCP server that received the request will provide an available IP address
    to the client. Therefore, users can implement DHCP snooping to determine online
    hosts in the network. The following section will introduce the implementation
    of DHCP snooping through `Nmap`''s `broadcast-dhcp-discover` script to discover
    hosts.


    `Nmap`''s `broadcast-dhcp-discover` script can be used to send a DHCP Discover
    broadcast packet and can effectively display the specific information of the response
    packet. By analysing the information in the response packet, the assignable IP
    address can be found.


    The syntax format of passive scanning using this script is as follows:


    ```bash

    root@exampleserver: nmap --script broadcast-dhcp-discover

    ```


    The `--script` option in the above syntax is used to specify that a script is
    being used for the attack.


    In the next chapter, we will start discussing about the Domain analysis that is
    considered important for the information gathering procedure. Follow along!


    ## Chapter 11


    # Domain Analysis


    ![](images/00005.jpeg) ![](images/00004.jpeg)


    In the previous chapter we discussed about the procedures that can be used while
    scanning a host. While scanning is considered an easy procedure it is often not
    feasible now days due to the intrusion detection systems that are rapidly developed.
    To counter this problem and to analyse the target in a much better way we need
    to understand the importance of Domain analysis. Follow along this chapter to
    get a good grasp about it.


    ### What is a Domain Name?


    Domain Name is a string of names separated by dots which is usually used to represent
    the name of a computer or computer group on the Internet. It can identify the
    electronic position of the computer during data transmission. Generally, hosts
    on the external network are identified by domain names. If you want to perform
    a penetration test on the host of an external network then it is mandatory to
    analyse the domain name to obtain the detailed information of the domain name.
    We can find different sensitive parameters such as domain name owner, subdomain
    name, server address. This section will introduce how to analyse domain name with
    a couple of examples.


    ### Basic Domain Name Information


    When a domain name is registered, it contains basic information, such as whether
    the domain name has been registered or not, domain name registrar, domain name
    owner, etc. By checking the WHOIS information of the domain name, you can get
    the basic information of the domain name easily. The following section will introduce
    how to obtain the basic information of the domain name using `WHOIS` and other
    popular tools.


    It is always said that domain analysis is the first usual thing pentesters do
    before analysing the target.


    #### 1) Use WHOIS tools


    The `WHOIS` tool is used to find and display user-related information for a specified
    account (or domain name).


    *The syntax format of using this tool to query domain name information is as follows:*


    ```bash

    whois [domain name]

    ```


    Use-case scenario:


    Use the `WHOIS` tool to query the relevant information of the domain name `wikipedia.com`.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# whois wikipedia.com

    ```


    After entering the above command on the terminal you can see the relevant WHOIS
    information for the domain name `wikipedia.com`.


    #### 2) Use DMitry tool

