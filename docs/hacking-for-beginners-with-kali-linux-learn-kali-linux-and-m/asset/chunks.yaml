    \n## 第 34 章\n\n# 持久化后门\n\n![](img/00009.jpeg) ![](img/00008.jpeg)\n\n在成功获取目标系统的访问权限后，渗透测试人员不想再次以同样费力的方式重新获取访问。由于\
