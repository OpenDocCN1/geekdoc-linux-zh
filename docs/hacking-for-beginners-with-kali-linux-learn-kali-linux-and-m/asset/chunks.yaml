    ## 1. Use the `hosts` command to view the reported host information.


    The execution command is as follows:


    ```

    msf5> hosts

    ```


    From the output information, we can see that there are 3 hosts in the scan report.
    Among them, the addresses are `192.168.29.223`, `192.168.29.225` and `192.168.29.127`
    respectively.


    ## 2. Use the `vulns` command to view vulnerability information.


    The execution command is as follows:


    ```

    msf5> vulns

    ```


    Next, users can use `Name` or reference `References` to search for the attack
    payload that can be used.


    ### Manually find the attack payload


    After users determine the vulnerabilities in the target system, they can search
    for penetration testing modules in Metasploit to select the penetration testing
    modules that can exploit their vulnerabilities, and then implement penetration
    testing. The following will introduce the method of manually searching the penetration
    test module using the `search` command.


    The syntax format for finding the penetration test module is as follows:


    ```

    search [options]

    ```


    In the above statement, `options` means supported options; `keywords` means available
    keywords.


    Next, we will manually find the CVE vulnerability as the penetration test module
    in 2020.


    The execution command is as follows:


    ```

    msf5> search cve:2020

    ```


    From the output information, we can see that all penetration test modules with
    a release date of 2020 have been searched. The output information includes 5 columns
    of information, which respectively represent `Name` (the name of the attack payload),
    `Disclosure Date` (release date), `Rank` (level), `Check` (whether vulnerability
    detection is supported), and `Description` (description information).


    In the pre-analysis scan report of the above, look for the penetration test module
    with the vulnerability name `MS17-010 SMB RCE Detection`.


    The execution command is as follows:


    ```

    msf5> search name:MS19-010 SMB RCE Detection

    ```


    From the output information, we can see that all penetration test modules that
    can exploit `MS19-010` vulnerabilities have been found. At this point, the user
    can select a penetration testing module to implement penetration testing.


    For example, select the penetration testing module named `exploit/windows/smb/ms19_010_eternalblue`.


    The execution command is as follows:


    ```

    msf5> exploit/windows/smb/ms19_010_eternalblue

    msf5> exploit(windows/smb/ms19_010_eternalblue)

    ```


    ### Third-party search


    If users cannot find a valid penetration test module in Metasploit, they can also
    find it from third-party websites, such as CVE vulnerability sites and exploitDB.
    In addition, Metasploit also supports importing third-party modules and implementing
    penetration testing. The following describes how to find penetration testing modules
    from these third-party websites.


    #### 1) Find through the CVE vulnerability website


    The address of the CVE vulnerability website is `https://www.cvedetails.com/`.
    After successfully accessing the website in the browser, the interface shown will
    be displayed. At this point, users can search for penetration test modules by
    CVE ID, product name, manufacturer, or vulnerability type on the site page.


    For example, query Microsoft related vulnerabilities. Enter `Microsoft` in the
    search box, and then click the `Search` button to display the search results.
    From this interface, you can see the searched Microsoft related statistics. It
    can be seen from the statistical results that a total of 6328 vulnerabilities
    have been found.


    At this point, select the `Vulnerabilities (6328)` option to display the detailed
    information of the vulnerability. From this interface, you can see all the vulnerability
    information, including `CVE ID`, `vulnerability type`, `release date`, `update
    date`, and `score`. For example, `CVE IE` is `CVE-2020-0879`, the vulnerability
    type is `Exec Code Overflow`, the release date is `2020-04-09`, and the update
    date is `2020-04-11`.


    #### 2) Find through exploitDB vulnerability website


    The address of exploitDB vulnerability website is `https://www.exploit-db.com/`.
    After successfully accessing the website in the browser, the interface shown will
    be displayed. Enter some keywords of the attack payload on this interface to search
    for the corresponding penetration test module. When searching, users can also
    select the `Verified` and `Has App` checkboxes to filter the verified and vulnerable
    application penetration test modules. For example, search for the penetration
    test module of the Windows system. After the search is successful, the boundary
    shown will be displayed.


    From this interface, you can see all the searched results. The output information
    includes 8 columns, indicating `Date` (release date), `D` (download penetration
    attack payload), `A` (available application), `V` (verified), `Title` (vulnerability
    title), `Type` (type), `Platform` (platform) and `Author` (author). Here, users
    can choose to download and view detailed information about the vulnerability.
    If you want to download the penetration test module, click the download button
    in column `D`. If you want to view the detailed information of the vulnerability,
    just click the title of the vulnerability.


    From the description of the interface, you can see the details of the vulnerability.
    In addition, users can download some penetration testing modules from this website
    and manually import them into Metasploit.


    #### 3) Manually import third-party modules


    Metasploit''s own modules are already very rich, but sometimes they cannot fully
    meet the needs of users. For some relatively new vulnerabilities or vulnerabilities
    without official module support, users can only manually write or import third-party
    modules. For general users, it is more convenient to use by directly importing
    third-party modules, and it is not easy to make mistakes. Therefore, the method
    of manually importing third-party modules will be introduced below.


    Import the third-party module downloaded from the exploitDB website, and use the
    module to perform penetration testing. Here will take `exiftran` command injection
    module as an example, and set the file name to `webtest.rb`.


    The specific steps are as follows:


    1) Copy the module file `webtest.rb` to the module location corresponding to Metasploit.
    Among them, the default location of the Metasploit module is `/root/.msf4/modules`.
    In order to distinguish the modules conveniently, users can create corresponding
    folders according to the classification of the modules to store different types
    of modules.


    In this example, a penetration attack module will be imported, so a folder named
    `exploits` will be created here. as follows:


    ```

    root@exampleserver:～# mkdir /root/.msf4/modules

    ```


    After executing the above command, there will be no information output.


    Here, for the convenience of remembering or finding the location of the module,
    create a test directory, and then copy the attack payload file into it. as follows:


    ```

    root@exampleserver:～# cd /root/.msf4/modules/exploits/

    ```


    From the output information, we can see that the penetration attack module file
    `webtest.rb` has been successfully copied to the newly created location.


    2) Restart the Metasploit tool to see the loaded penetration test attack module.


    The execution command is as follows:


    ```

    root@exampleserver:～# msfconsole

    msf5>

    ```


    From the information displayed above, we can see that the exploit class module
    has changed from `1873` to `1874`. This shows that the module has been successfully
    imported.


    (3) Select the `webtest` module and view the options of the module.


    The execution command is as follows:


    ```

    msf5> use exploit/test/webtest

    #Select the module to use 0 Auto

    ```

