    Almost 60% of the internet users use simple passwords that can be easily brute
    forced by a cracking tool. This is why, it is always recommended to use a password
    that cannot be easily guessed.


    For example, in the `MySQL` database service, if the administrator user''s root
    of the service is configured with a weak password (such as `toor`), it can be
    easily cracked using brute force dictionary attacks. Using different dictionary
    attack techniques, the penetration tester can log in to the `MySQL` database service
    as an administrator, and then can view all data entries. Some important or sensitive
    data may be stolen by penetration testers. According to a recent survey, thousands
    of databases are still using weak passwords.


    Kali Linux provides a tool called `changeme` which can be used to scan the target
    host for the default authentication. For example, it can automatically check whether
    the `FTP` service has been enabled for anonymous users for a particular server.
    If it is indeed allowed then the tool automatically uses default passwords to
    login to the `FTP` server.


    At this point, the user can use the tool to perform a scan to detect whether the
    target host uses a default password. If the default password is indeed used, it
    means that the host certainly has a weak password vulnerability, and penetration
    testers can use this vulnerability to carry out attacks.


    The syntax format of the `changeme` tool is as follows:


    ```

    changeme -a <target>

    ```


    The option `-a` in the above syntax means to scan all protocols. And the `target`
    is defined as the address of the system we are trying to scan.


    A simple use-case:


    Use the `changeme` tool to scan to know whether or not the target uses a weak
    password.


    The execution command is as follows:


    ```

    root@exampleserver:～# changeme -a 192.234.564.321

    ```


    When you enter the above command on the terminal of the Linux system it will automatically
    check the host provided for any default configurations that are available for
    `FTP` service. If there are any open authentications available then they will
    be displayed on your computer screen for you to login using a set of username
    and passwords.


    ### bWrong permission settings


    The authority mechanism stipulates what users can and cannot do. In an operating
    system, permissions are an important technology that restricts any user from operating
    sensitive resources. If a user is given the maximum authority due to improper
    configuration, serious consequences may be caused, such as deleting other people''s
    files and changing other users'' passwords. For example, the permission setting
    of `FTP` service is cumbersome. If the administrator configures the `FTP` directory
    permissions incorrectly, it may cause anonymous users to delete files or maliciously
    upload files.


    It is therefore usually suggested for system administrators to constantly check
    the permission settings that they use by default.


    ### Software Vulnerabilities


    Software vulnerabilities are usually caused by the negligence of software developers
    when developing software, or sometimes caused due to the limitations of programming
    languages. For example, the `C` language family is more efficient than `Java`,
    but it is also prone to more vulnerabilities. It is also important to remember
    that a complex system contains more functions, and its complexity results in greater
    probability of vulnerabilities.


    For example, computer systems often require various patches to fix vulnerabilities.


    Here are a few recent well-known software vulnerabilities:


    - Remote Keyboard software vulnerability


    There are 3 security vulnerabilities in the software, which will lead to escalation
    of privileges, allowing attackers to perform key injection to local users or keyboard
    sessions through the network, or execute arbitrary code.


    - Struts remote code execution vulnerability based on Jakarta plug-in


    This vulnerability is a high-risk vulnerability, and its vulnerability number
    is `CVE-2017-5638`. The vulnerability is mainly caused by the improper analysis
    of the file upload request package by `Jakarta`. When an attacker uses a malicious
    `Content-Type`, it can cause a remote command execution.


    ### Hardware vulnerabilities


    Hardware vulnerabilities usually exist in hardware devices or chips. For example,
    the vulnerabilities in the `NVDIA Tegra` chip exist in the read-only bootrom of
    the `Tegra` chip. The CPU vulnerabilities (`Meltdown` and `Spectre`) exist directly
    inside the chip, and due to the order of instruction reading, they can be vulnerable
    to virus attacks.


    ### What Next?


    As this chapter provided a good introduction to vulnerability we will continue
    further in our hacking journey by learning about `Nessus`, a vulnerability scanning
    tool. Follow along!


    # Chapter 18


    # Introducing Nessus


    ![](images/00007.jpeg) ![](images/00006.jpeg)


    As said in the previous chapter vulnerabilities are quite common in present complex
    systems and are often difficult to find as there are thousands of open vulnerabilities
    that can be used to exploit with. For countering this problem, automated vulnerability
    scanning softwares such as `Nessus` and `Open VAS` are developed and are often
    received overwhelmingly by the pen tester community. In this chapter, we will
    have a thorough look at the `Nessus` software that is quite famous for its innovative
    and easy way to scan and find vulnerabilities.


    ### What is Nessus?


    `Nessus` is currently commonly used system vulnerability scanning and analysis
    software. This tool provides a complete vulnerability scanning service and updates
    its vulnerability database constantly. Moreover, `Nessus` can be operated locally
    or remotely at the same time to perform system vulnerability analysis and scanning
