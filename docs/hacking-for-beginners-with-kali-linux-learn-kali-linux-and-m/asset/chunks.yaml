    ## 2) After selecting the Wireshark command here, the software can be successfully
    run.


    Seeing this interface indicates that Wireshark has started successfully. Next,
    the user selects the network interface and can use the software to capture data
    packets.


    ### b) Command line mode


    The command line method is there to execute through the terminal. The following
    section will take the Metasploit framework as an example to introduce the method
    of using the command line to start the software.


    Start Metasploit terminal mode and execute the command as follows:


    ```bash

    root@exampleserver:～# msfconsole

    ```


    From the output information, you can see that the command line prompt is displayed
    as `msf5 >`. This shows that the Metasploit tool was successfully launched.


    ### c) Command line prompt


    The user can use the command line prompt to run some software that runs from the
    terminal, and it runs in interface mode. In this way, there is no need to occupy
    a terminal window. The following will take DirBuster software as an example to
    introduce the method of using the command line prompt to start the software.


    The specific steps are as follows:


    (1) Use the `Alt+F2` shortcut to start the command line prompt.


    (2) Enter the command to start the software in this interface. Then, press the
    `Enter` key to start the tool.


    Seeing this interface means that the DirBuster software has been successfully
    started.


    ### Execute script


    In Kali Linux system, some software needs to be started by script after installation.
    Among them, the most common executable scripts are Python, Ruby, Perl and Shell.
    For some scripts, libraries or modules may also need to be installed. The following
    section will introduce several common execution script startup methods.


    #### a) Execute Ruby script


    When the user is executing Ruby scripts, Ruby library files may be missing. At
    this time, the user needs to install the corresponding library using the `gem
    install` command.


    Among them, the syntax format for installing Ruby library files is as follows:


    ```bash

    gem install [package]

    ```


    Then, use the `ruby` command to execute its Ruby script. as follows:


    ```bash

    root@exampleserver:～# ruby hello.rb Hello World.

    ```


    #### b) Execute Python script


    When users execute Python scripts, they may encounter the problem of missing dependency
    packages. At this time, the user can use the `pip install` command to install
    the corresponding dependency package. Only then can its Python script be executed.


    For example, `polenum` is a Python script that can use Python''s `impacket` library
    to obtain password policies from the Windows kernel security mechanism. However,
    the script depends on `impacket 0.9.11` version of the library. So, if you want
    to use `polenum` tool, you must install `imacket 0.9.11`.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# pip install impacket==0.9.11

    ```


    From the last line of the above output, you can see that the `impacket-0.9.11`
    package has been successfully installed. Next, the user can use the `polenum`
    tool.


    Kali Linux provides two versions of Python by default, namely Python 2 and Python
    3. `pip` can install Python 2 dependencies. If you want to install dependent packages
    for Python 3, you need to use the `pip3` command. However, the `pip3` command
    is not installed by default. Therefore, if you want to install dependent packages
    for Python 3, you need to install the `pip3` command first.


    The execution command is as follows:


    ```bash

    root@exampleserver:～# apt-get install python3-pip

    ```


    After executing the above command, if no error is reported, the `pip3` command
    is installed successfully. Next, you can install the dependencies of Python 3.
    For example, packages that the `KickThemOut` tool depends on need to be installed
    using `pip3`.


    The following will demonstrate the use of `pip3` to install the packages that
    the `KickThemOut` tool depends on.


    The execution command is as follows:


    ```bash

