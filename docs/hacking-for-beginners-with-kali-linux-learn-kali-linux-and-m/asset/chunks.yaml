    ## Chapter 28


    # Query Penetration test module


    ![](images/00009.jpeg) ![](images/00008.jpeg)


    **Query penetration test module**


    Vulnerability is mainly realized through the penetration testing module of Metasploit.
    Therefore, users need to find the corresponding penetration test module based
    on the vulnerability. In Metasploit, you can use the search command to quickly
    find penetration testing modules. Users can also go to some third-party websites
    to find penetration testing modules and import them into Metasploit to implement
    vulnerability exploitation. This section will introduce how to query the penetration
    test module.


    **Pre-analysis scan report**


    The user has successfully imported the scan report in the previous section. At
    this point, the user can analyze the scan report to find out the vulnerabilities
    in the target system. Then, according to the vulnerability, find the penetration
    test module that can exploit the vulnerability and implement the attack. The following
    will introduce the method of pre-analyzing the scan report.


