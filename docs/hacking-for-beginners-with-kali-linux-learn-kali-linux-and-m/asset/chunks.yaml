    # 第 38 章


    ## 无线网络监控


    ![](img/00011.jpeg) ![](img/00010.jpeg)


    由于无线网络中的数据包是以无线信号传播的，用户可以监控网络数据包以捕获所有数据。如果你想监控无线网络，必须将无线网卡设置为监控模式。本节将详细介绍如何设置无线网络监控模式。请按照步骤操作！


    ## 网卡的工作模式


    无线网卡可以在模式模式工作以实现不同的功能。主要模式包括管理模式、Ad hoc 模式、Master 模式和监控模式。


    这里通过示例描述了这四种工作模式的概念：


    - 管理模式 (Managed mode)：当用户的无线客户端直接连接到无线接入点 (WAP) 时使用此模式。在此模式下，无线网卡的驱动依赖 WAP 来管理整个通信过程。

    - Ad hoc 模式 (Ad hoc mode)：也称为点对点模式。当用户的网络由相互连接的设备组成时使用此模式。在此模式下，无线通信双方共同承担 WAP
    的职责。

    - Master 模式 (Master mode)：高端无线网卡支持 Master 模式。此模式允许无线网卡配合特殊的驱动和软件作为其他设备的 AP（接入点）工作。

    - 监控模式 (Monitor mode)：这是最重要的模式。如果网卡客户端不是用于发送和接收数据，仅用于监控网络中的所有数据包，那么你可以使用监控模式。


    ### 支持监控的无线网卡


    如果你想监控无线网络，使用的无线网卡必须支持监控模式。


    上述列出了许多无线网卡。对于 2.4GHz WiFi 网络，建议用户选择 `3070` 或 `8187` 芯片的无线网卡。对于 5GHz WiFi 网络，仅支持带有
    `RT3572` 和 `RTL8812AU` 芯片的无线网卡。


    ### 设置监控模式


    当用户选择合适的无线网卡后，可以将网卡设置为监控模式。通常，用户通过 `airmon-ng` 命令将无线网卡设置为监听模式。


    语法格式如下：


    ```

    root@exampleserver : airmon-ng start set

    ```


    在上述语法中，参数 `start` 表示启动监听模式。`Interface` 指的是无线网络接口。


    将无线网卡设置为监控模式。


    执行以下命令：


    ```

    root@exampleserver : set=network

    ```


    从输出信息可以看出监控模式已成功启动，其监控接口为 `wlan0mon`。


    ### 设置 5G WiFi 网卡的监控模式


    目前有两种常用的支持 5G WiFi 网卡芯片，即 `RT3572` 和 `RTL8812AU`。`RT3572` 芯片的无线网卡设置与普通无线网卡相同，可以直接使用
    `airmon-ng` 命令启动监控模式。


    然而，`RTL8812AU` 芯片的无线网卡需要安装驱动，并且需要手动设置监控模式。以下介绍了将 `RTL8812AU` 芯片的无线网卡设置为监控模式的方法。


    将 `RTL8812AU` 芯片的无线网卡设置为监控模式。


    具体的操作步骤如下：


    1) 安装驱动。


    执行以下命令：


    ```

    root@exampleserver : install driver

    ```


    执行上述命令后，如果没有报告错误，则驱动安装成功。


    2) 检查无线网卡的模式。


    执行以下命令：


    ```

    root@exampleserver : check mode

    ```


    从输出信息可以看出，无线网卡的当前工作模式为 `Managed`。


    3) 停止无线网卡接口。


    执行以下命令：


    ```

    root@exampleserver: air-mag stop

    ```


    4) 将无线网卡设置为监控模式。


    执行以下命令：


    ```

    root@exampleserver: air-mag mode = network

    ```


    5) 启动无线网卡。


    执行以下命令：


    ```

    root@exampleserver: air-mag wireless

    ```


    6) 再次检查无线网卡的模式。


    执行以下命令：


    ```

    root@exampleserver: air-mag check start

    ```


    从输出信息可以看出芯片已成功设置为 `Monitor mode`。其中监听模式下的接口名为 `wlan0`。


    扫描无线网络意味着扫描周围的无线信号以寻找渗透测试的目标。如果用户想实施渗透测试，他们需要知道目标无线网络的一些信息，例如 AP 名称、MAC 地址和工作信道。通过扫描无线网络并分析扫描结果，选择相应的工具来实现渗透测试。本节将详细介绍扫描无线网络的方法。


    # 第 39 章


    ## Airodump-ng 工具的使用


    ![](img/00011.jpeg) ![](img/00010.jpeg)


    ### 使用 Airodump-ng 工具


    Airodump-ng 是 `Aircrack-ng` 工具集中的一个工具，用于扫描周围的无线网络信号。通过分析捕获的信号包，可以获取周围 AP 的名称、MAC
    地址、通道和加密方法。下节介绍了使用 Airodump-ng 扫描无线网络的方法。


    使用 Airodump-ng 扫描无线网络的语法为：


    ```

    root@exampleserver: airodump scan

    ```


    在上述语法中，参数 `interface` 指向网卡。


    使用 Airodump-ng 工具扫描无线网络。


    执行以下命令：


    ```

    root@exampleserver: airodump wireless

    ```


    从输出信息可以看到扫描到的无线网络信息。输出包含许多列，含义如下：


    1. BSSID：无线 AP 的 MAC 地址。

    2. PWR：网卡报告的信号强度，主要取决于驱动。信号值越高，距离 AP 或电脑越近。如果 BSSID 和 PWR 的值均为 -1，则说明驱动不支持报告信号强度。如果
    PWR 值为 -1，则表示客户端不在当前网卡的监听范围内，但可以捕获 AP 发送到客户端的数据。如果所有客户端的 PWR 值均为 -1，则网卡驱动不支持信号强度。

    3. Beacons：无线 AP 发出的公告包数量。每个接入点（AP）以最低速率（1M）每秒传输约 10 个 beacon。

    4. Data：捕获的数据包（如果是 WEP 则代表唯一 IV 的数量），包括广播包。

    5. s：过去 10 秒内每秒捕获的数据包数量。

    6. Ch：通道号（从 Beacon 获取）。

    7. Mb：无线 AP 支持的最大速率。如果值为 11，表示使用 `802.11b` 协议；如果值为 22，表示使用 `802.11b+` 协议；更高则表示使用
    `802.11g` 协议。如果值包含小数点（在 54 之后），表示支持短前导码。如果值包含 `e`，表示网络启用了 `QoS(802.11 e)`。


    '
- fmt: '

    ## 8. Cipher

    The detected encryption algorithm is one of `CCMP`, `WRAAP`, `TKIP`, `WEP` and
    `WEP104`. Typically (but not necessarily), `TKIP` is used in combination with
    `WPA`, and `CCMP` is used in combination with `WPA2`. If the key index value is
    greater than 0, it is displayed as `WEP40`. Under standard conditions, indexes
    `0 ~ 3` are 40bit, and 104bit should be `0`.


    ## 9. Auth

    The authentication protocol is used. Commonly used are `MGT` (WPA/WPA2 uses independent
    authentication server, such as `802.1x`, `radius` and `eap`, etc.), `ska` (shared
    key of `WEP`), `PSK` (pre-shared key of `wpa/wpa2`) or `OPN` (`OPN(WEP)`).


    ## 10. ESSID

    The so-called ssid number. If hidden SSID is enabled, it can be blank or displayed
    as `< length: 0 >`. In this case, `airodump-ng` tries to obtain SSID from `proberesponses`
    and `associationrequests`.


    ## 11. Station

    MAC address of clients, including connected clients and clients who want to search
    for wireless networks to connect. If the client is not connected, it displays
    `not associated` under `BSSID`.


    ## 12. Rate

    Indicates the transmission rate.


    ## 13. Lost

    data packets lost in the past 10 seconds, based on serial number detection. It
    means that the data sent from the client is lost, and each non-management frame
    has a serial number field. By subtracting the serial number in the frame just
    received from the serial number in the previous frame, we can know that several
    packets are lost.


    ## 14. Frames

    The number of data packets sent by the client.


    ## 15. probe

    ESSID probed by client. If the client is trying to connect to an AP, but it is
    not connected, it will be displayed here.


    ## Usage of Kismet Tools

    Kismet is a tool for sniffing wireless networks. Using this tool, you can monitor
    the surrounding wireless signals and view all available wireless access points.
    The following section will introduce the method of scanning wireless network using
    Kismet tool.


    ### Using Kismet tool to scan wireless network.

    The specific operation steps are as follows:


    1) Start the Kismet tool.

    Execute the command as follows:


    ```bash

    root@exampleserver: kismet start

    ```

    After executing the above command, the interface will be displayed.


    2) This interface is used to set whether to use the default color of the terminal.
    Because Kismet''s default color is gray, and some terminals cannot display it,
    the default color is not used here. Click `No` button at this time, and the interface
    will be displayed.


    3) The interface prompts that the root user is being used to run the Kismet tool.
    Click `OK` button, and the interface will be displayed.


    4) The interface prompts whether or not to automatically start the Kismet service.
    Click the `Yes` button, and the interface will be displayed.


    5) The interface displays some information about setting up Kismet service. Use
    the default settings here, and then click the `Start` button to display the interface.


    6) The interface displays undefined package resources. Do you want to add them
    now? Click the `Yes` button, and the interface with immediate results will be
    displayed.


    7) Specify the wireless network card interface and description information on
    this interface. In the `Intf` text box, enter the wireless network interface `wlan0`.
    Then click the `Add` button, and the interface will be displayed.


    8) Click the `Close Console Window` button on the interface to start scanning
    the wireless network.


    9) All wireless AP information scanned by Kismet tool can be seen from this interface.
    On the left side of the interface, the time of capturing packets, the number of
    networks scanned and the number of packets are displayed. Users can find that
    only the searched wireless AP, channel and packet size information can be seen
    in this interface, but the MAC addresses of these APS and connected clients are
    not seen. Furthermore, AP cannot be selected by default. If you want to view the
    clients connected to the current AP, you also need to set it up. Select `Sort|First
    Seen` command in the menu bar in turn, and then select `AP` in the above the fold,
    and display the connected client in the second screen.


    10) As you can see from this interface, the AP details named `CU_655w` are displayed,
    and the connected clients are displayed.


    For example, the MAC address of the connected client is `fc: 1a: 11: 9e: 36: a6`.
    The MAC address of AP is `70:85:40:53:E0:3B`, the working channel is `9`, and
    the encryption methods are `TKIP`, `WPA` and `PSK`. If you want to view the details
    of an AP, double-click the corresponding AP.


    11) From this interface, you can see the detailed information of the AP, such
    as manufacturer, `BSSID`, channel, frequency and signal strength. If you want
    to stop scanning the wireless network, click `Kismet|Quit` in turn, and the dialog
    box for stopping Kismet service will pop up.


    12) Click the `Kill` button to stop Kismet service and exit the scanning interface.


    In addition, some log information will be given as output at the terminal:


    ```text

    [SERVER] usually: /etc/init.d/networking restart

    ```

    It can be seen from the above output information that the captured data is successfully
    written into the log file.


    It can be seen from the output information that five file locations are generated.
    Among them, each log file holds different contents.


    - `alert`: The plain text log file of the alert. Kismet will send alerts for events
    of special concern.

    - `GPS XML`: GPS log file in XML.

    - `nettxt`: Network information in plain text.

    - `net XML`: Network information in XML.

    - `pcapdump`: a real-time communication file captured by pcap. It depends on the
    version of `libpcap`, and this file may contain GPS coordinate information.


    ## Chapter 40: Attacking Wireless Networks

    By implementing wireless network scanning, we can find out the target of attack.
    This section will introduce how to attack the wireless network password and provide
    some protection measures.


    ### Crack WEP network password

    Because WEP encryption uses `RC4` algorithm, the WEP encrypted network can be
    easily cracked. The following section will introduce how to use `airplane-ng`
    tool to crack WEP encrypted network.


    #### Crack WEP network password with `airplane-ng`.

    The specific operation steps are as follows:


    1) Start the monitoring mode.

    Execute the command as follows:


    ```bash

    root@exampleserver: airplane-ng monitor

    ```


    2) Scan the wireless network to find out the wireless network encrypted by WEP.

    It can be seen from the output information that WEP is the encryption method used
    by the wireless network whose ESSID is `Test`. Therefore, we will choose to crack
    the wireless network password here.


    3) Capture the wep wireless network data packet and specify that the captured
    data be saved in the `WEP` file.

    Execute the command as follows:


    ```bash

    root@exampleserver: airplane-ng capture

    ```

    See the above output information, indicating that the data packet of the `Test`
    wireless network is being captured. Whether the WEP encrypted wireless network
    can be cracked successfully depends on the captured `IVS` data packet. As can
    be seen from the `Data` column shown above, only `20` packages have been captured
    so far. In order to speed up packet capture, users can use `aireplay-ng` tool
    to implement injection attack.


    4) Implement ARP injection attack to accelerate the speed of capturing data packets.

    The syntax format is as follows:


    ```bash

    root@exampleserver: airplane-ng inject packets ARP

    ```

    Parameter `-3` in the above syntax indicates ARP injection attack. `-b` specifies
    the MAC address of the AP. `-h` specifies the MAC address of the client. (Example:
    `airplane-ng inject -3 -b [AP MAC] -h [Client MAC]`)


    Seeing the above output information indicates that ARP injection attack is being
    implemented. At this time, when you return to the terminal where `airodump-ng`
    tool is executed, you will find that the value of `data` column is growing rapidly.

