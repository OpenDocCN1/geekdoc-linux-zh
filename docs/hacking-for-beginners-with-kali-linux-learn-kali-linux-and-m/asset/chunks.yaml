    5) The interface displays some information about setting up Kismet service.Use
    the default settings here, and then click the Start button to display the interface.


    6) The interface displays undefined package resources. Do you want to add them
    now?Click the Yes button, and the interface with immediate results will be displayed.


    7) Specify the wireless network card interface and description information on
    this interface. In the Intf text box, enter the wireless network interface wlan0\.
    Then click the Add button, and the interface will be displayed.


    8) Click the Close Console Window button on the interface to start scanning the
    wireless network.


    9) All wireless AP information scanned by Kismet tool can be seen from this interface.
    On the left side of the interface, the time of capturing packets, the number of
