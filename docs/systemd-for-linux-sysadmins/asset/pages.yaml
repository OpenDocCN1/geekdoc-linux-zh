  md: 'tool for the job was cron. There''s still a place for the cron command, but

    there are also some compelling alternatives. For instance, the anachron7

    command is a versatile, cron-like system capable of running tasks that\otherwise
    would have been missed during downtime.


    Scheduled events are little than more services activated at a specific

    time, systemd manages a cron-like function called called8 You can list active
    timers:


    ```

    $ systemctl list-timers

    ```


