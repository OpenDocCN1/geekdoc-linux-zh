    in /etc/systemd/journald.conf using the following entries:


    ```

    SystemMaxUse=1

    Storage=persistent

    SystemMaxFiles=10

    MaxRetentionSec=1month

    ```


    By default, the SystemMaxUse is 10% of available disk space. All of the default
