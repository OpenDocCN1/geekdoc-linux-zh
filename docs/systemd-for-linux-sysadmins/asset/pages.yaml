    # Chapter 2 Linux Boot and Startup


    Using different disk partitioning strategies during the Linux installation

    make a difference between whether the Anaconda installer installs an

    MBR or GPT. Either works with the Linux filesystems typically used today,

    EXT4, BTRFS, ZFS, and others. The only functional difference is that GPT

    supports extremely large storage devices. The kinds of devices

    that—for now—would certainly not be found outside the data center

    in large businesses, let alone homes and small to medium businesses.


    # Linux Boot


    The boot sector that is loaded by BIOS is stage 1 of the GRUB4 bootloader.

    The boot process itself is composed of multiple stages of GRUB. We

    consider each stage in this section.


    # GRUB


    The primary function of the GRUB bootloader is to get the Linux kernel

    loaded into memory and running.

    GRUB2 stands for “Grand Unified Bootloader, version 2,” and it is

    now the primary bootloader for most Linux distributions. GRUB2

    is the program which makes the computer just smart enough to find the\operating
    system kernel and load it into memory. Because it is easier

    to write and use GRUB than GRUB2, I may use the term GRUB in this

    document, but I will be referring to GRUB2 unless specified otherwise.

    GRUB2 provides the same boot functionality as GRUB Legacy,

    but GRUB2 also provides a mainframe-like command-based pre-OS

    environment and allows more flexibility during the pre-boot phase.

    GRUB2 is configured with /boot/grub2/grub.cfg.


