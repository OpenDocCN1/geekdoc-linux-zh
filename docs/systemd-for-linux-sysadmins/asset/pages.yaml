    # A Temporary Option


    There is a systemd option for continuing to use rc.local for a little longer,
    the rc-local service. It is possible to continue support for the old rc.


    local file by enabling the service with the command **systemctl enable rc-local**
    will run at the next boot. Of course, you can use **systemctl enable --now rc-local**
    to run rc.local immediately


    without performing a reboot.

    However, it is still true that rc.local is obsolete. The man page for systemd-rc-local-generator
    states this explicitly:


    Support for /etc/rc.local is provided for compatibility with'
  merge: -1
