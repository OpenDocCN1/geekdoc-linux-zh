    # Display Manager


    A display manager is a program with the sole function of providing the GUI login
    screen for Linux. Login to a GUI desktop, the display


    manager turns control over to the window manager. When you log out of the desktop,
    the display manager is given control to display the screen and wait for another
    login.


    There are several display managers; some are provided with their respective desktops.
    For example, the gdm display manager is provided with the GNOME desktop. Other
    display managers are not directly associated with a specific desktop. Any of the
    display managers can be used for your login screen regardless of which desktop
    you are using. And not all desktops have their own display managers. Such is the
    flexibility of Linux and well-written, modular code.


    The typical desktops and display manager combinations are shown


    in Table 2-2. The display manager for the first desktop that is installed, that
    is, GNOME, KDE, etc., becomes the default one. For Fedora, this


    is usually gdm which is the GNOME display manager. If gdm is not installed, the
    display manager for the installed desktop does not have a default display


    manager, then gdm is installed and used. If you use KDE as your desktop,


    the SDDM10 is the default display manager.


    > 10 Wikipedia, "Simple Desktop Display Manager," https://en.wikipedia.org/wiki/Simple_Desktop_Display_Manager'
