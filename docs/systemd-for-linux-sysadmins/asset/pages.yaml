    # Cleanup


    Let''s just do a bit of cleanup before moving on. It''s not necessary to delete
    the new files you''ve created, so you can use them as templates. Just disable
    the service unit you created so it won''t run every time you reboot the test system.


    # Summary


    The rc.local file is obsolete, and all temporary support for it will soon be withdrawn
    completely. The Bash shell script and systemd service we created for this runs
    once at startup and then exits. It does not remain in memory as a daemon because
    it was not designed to do so. The procedure used to create our local startup service
    can also be used to create any new service for systemd. It''s not that hard once
    we know how to do it. We also saw that a service that is designed to run at startup
    can also be triggered at the command line using systemctl, which provides a intrusive
    way to test it.


    All support for rc.local will be removed in the relatively near future, so understanding
    how to replace it with systemd tools is important.


