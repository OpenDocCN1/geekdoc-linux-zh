  md: 'The .scope unit defines and manages a set of system processes.

    This unit is not configured using unit files; rather, it is created programmatically.
    Per the systemd.scope man page, “The main purpose of scope units is grouping worker
    processes of a system service for organization and for managing resources.”


    # .service


    The .service unit defines processes that are managed by systemd. These include
    services such as cron cups (Common Unix Printing System), iptables, multiple logical
    volume management (IVM) services, networkManager, and more.


    # .slice


    The .slice unit defines a “slice,” which is a conceptual division of system resources
    that are related to a group of processes, you can think of all system resources
    as a pie and this subset of resources as a “slice” out of pie.


    # .socket


    The .socket units define inter-process communication sockets, such as network
    sockets.


    # .swap


    The .swap units define swap devices or files.


    # .target


    The .target units define groups of unit files that define startup synchronization
    points, runlevels, and services. Target units define the services and other units
    that must be active in order to start successfully.


    # .timer


    The .timer unit defines timers that can initiate program execution at specified
    times.'
