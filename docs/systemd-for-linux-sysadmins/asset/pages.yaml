    opensshserver.config

    EnvironmentFile=-etc/sysconfig/sshd

    ExecStart=/usr/bin/sshd -D $OPTIONS $CRYPTO_POLICY

    ExecReload=/bin/kill -HUP $MAINPID

    KillMode=process

    Restart=on-failure

    RestartSec=42s

