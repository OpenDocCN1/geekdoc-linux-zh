  md: 'The systemd journal system provides a significant amount of metadata and context
    for entries compared to the old syslogd program. This additional data and the
    context available from the other journal entries around the time of an incident
    can help the SysAdmin locate and resolve problems much faster than having to search
    multiple syslog files.


    The journalctl command meets the Unix philosophy that programs should do one thing
    and do it well. The only thing journalctl does extract data from the journal and
    provide many options for selecting and formatting data. At about 85K, it is not
    very big. Of course, that does not include shared libraries, but those are, by
    definition, shared with programs.


