    # Creating the Service Unit


    Service unit files use the form and structure of standard ini files. Commands
    start with a pound sign (#), and section names are enclosed in [square brackets].
    Our unit file is about the most simple possible. in three sections:


    +   • [unit]: This is a short description of the unit used as an identifier for
    SysAdmins. It will appear in systemd status reports for the service.

    • [Service]: Defines the type of unit as a service and provides the service type,
    oneshot in this instance, and the fully qualified path to the program to run.


    93


    Chapter 4 how to Manage Startup using Systemd

    • [Install]: Specifies the target unit that will trigger the service unit. The
    oneshot is intended for services where the program launched by the service unit
    file is the main process and must complete before systemd starts any dependent
    process. We don''t have any dependent processes that need to wait for this one
    to complete.


