    # Why Time Is Important to Computers


    There are many reasons our devices and computers need the exact time.

    For example, in banking, stock markets, and other financial businesses,

    transactions must be maintained in the proper order, and exact time

    sequences are critical for that.


    Our phones, tablets, cars, GPS systems, and computers all require

    precise time and date settings. I watch the clock on my computer desktop

    to be correct, so I can count on my local calendar application to pop up

    reminders at the correct time. More importantly, the correct time also

    ensures old-style cron jobs and systemd timers trigger at the correct time.

    The correct time is also important for logging, so it''s easier to locate

    specific log entries based on the time. For one example, I once worked in'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'DevOps (it was not called at the time) for the State of North Carolina email
    system. We used to process more than 20 million emails per day.

    Following the trail of email through a series of servers or determining the exact
    sequence of events by using log files on geographically dispersed hosts can be
    much easier when the computers in question keep exact times.


    # Multiple Times


    Linux hosts have two times to consider: system time and RTC time. stands for real-time
    clock, which is a fancy and not particularly accurate for the system hardware
    clock.


    147


    Chapter 6 Control Your time and date with sSystem

    The hardware clock runs continuously, even when the computer is turned off, powered
    by the battery on the system motherboard. The RTC''s primary function is to keep
    the time when a connection to a time server is not available. In the dark ages
    of personal computers, there is no Internet to connect to a time server, so only
    the time computer had available was the internal clock. Operating systems had
    to rely on the RTC at boot time, and the user had to manually set the system time
    using the hardware BIOS configuration interface to ensure it was correct.

    The hardware clock doesn''t understand the concept of time zones; only the time
    is stored in the RTC, the time zone not an offset from UTC (Universal Coordinated
    Time, which is also known as GMT, or Greenwich Mean Time). The RTC time can be
    set with a tool I''ll cover in this chapter.


    The system time is the time known by the operating system. It is the time you
    see on the GUI clock on your desktop, in the output from the date command, in
    timestamps for logs, and in file access, modify, and change times.'
