    # Chapter 12 Using systemd-resolved name serviCe


    # Summary


    Name resolution is a critical service for hosts connected to the Internet, and
    systemd-resolved is the most current implementation of a resolver for many Linux
    distributions. Its intended use case is for small networks with no internal name
    service server, usually because no SysAdmin is available to create a DNS or DHCP
    server.


    While it can work well in that limited use case, it has failed miserably in my
    use case in which I have both DNS and DHCP services on my internal server.


    Reverting to the nss-DNS resolver has resolved my name resolution problems. Don''t
    misunderstand me. I''m not saying I hate systemd.


    That''s not at all. What I am saying is that the unintended consequences of these
    decisions can cause SysAdmins pain as they try to determine what''s changed and
    how to fix it. In this case, it''s simply that what''s good for one set of users
    is not necessarily good for other sets of users.


    The use case for some of my hosts is significantly different from that of nontechnical
    users.


    Networks of any size with DHCP or static network configurations are much better
    suited to nss-DNS name resolution services.'
