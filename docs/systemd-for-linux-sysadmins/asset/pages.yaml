  md: 'the final stage of GRUB. All the files for GRUB stage 2 are located in the
    /boot/grub2 directory and several subdirectories. GRUB2 does not have an image
    file. Instead, it consists mostly of runtime kernel modules that are loaded as
    needed from the /boot/efi/EFI directory.


    The function of GRUB2 stage 2 is to locate and load a Linux kernel into RAM and
    turn control of the computer over to the kernel. The kernel and its associated
    files are located in the /boot directory. The kernel files are identifiable as
    they are all named starting with vmlinuz. You can list the contents of the /boot
    directory to see the currently installed kernels on your system.


    GRUB supports booting from one of a selection of Linux kernels. The Red Hat package
    manager, DNF, supports multiple versions of the kernel so that if a problem occurs
    with the newest one, an older version of the kernel can be booted. By default,
    GRUB provides a pre-boot menu of the installed kernels, including a rescue option
    and, if configured, recovery option.


    # The Kernel


    All Linux kernels are in a self-extracting, compressed format to save space. The
    kernels are located in the /boot directory, along with an initial RAM disk image,
    and device maps of the hard drives.


    After the selected kernel is loaded into memory and begins executing, it must
    first extract itself from the compressed version of the file before it can perform
    any useful work. After the kernel has extracted itself, it systemd and turns control
    over to it.


    This is the end of the boot process. At this point, the Linux kernel and systemd
    are running but unable to perform any productive tasks for the end user because
    nothing else is running.


