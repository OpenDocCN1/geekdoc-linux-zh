    # CLI Login Screen


    The CLI login session is initiated by a program called getty, which stands

    for GE TTY. The historical function of a getty was to wait for a connection

    from a remote dumb terminal to come in on a serial communications line.

    The program would spawn the login screen and wait for a login to

    occur. When the remote user logged in, the getty would terminate, and

    deault default shell for the user account would launch and allow the user to'
  merge: -1
