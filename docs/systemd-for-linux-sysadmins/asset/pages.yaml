    This book introduces you to systemd with an overview and exploration

    of the controversy surrounding it. We''ll cover systemd''s major components

    and how they can provide insight into Linux startup, as well as how to

    manage the tools and services required to operate and maintain a

    Linux computer.


    This book will demystify systemd. You''ll learn what it is, what

    it does, and how to use it to keep Linux up and running. You''ll

    explore the major functional components of systemd with real-world

    examples to illustrate their typical usage. You''ll also learn pragmatic work-

    ounds, hints, and tricks to minimize the issues that systemd does have

    and ensure you have maximized your system''s functionality and security.

    You''ll learn to manage each of the major functional components

    systemd and learn from real-world examples to illustrate their typical

    usage by SysAdmins.


    This book is intended for Linux system administrators (SysAdmins)

    who need or are already in the process of switching from SystemV to

    system. It''s also intended for SysAdmins with more systemd experience

    but who want to improve their knowledge and skills with systemd.


    This book is not for anyone who is not a SysAdmin. If you''re only

    interested in getting your work done and have no interest in what''s

    happening under the covers, if you call upon others to fix your computer'
