    # Introduction


    The Domain Name Services (DNS)1 system provides the database used in the translation
    of Internet locations from human-readable hostnames, such as www.example.net,
    to IP addresses, 54.204.39.132, so that Internet-connected computers and other
    devices can access them.


    Without these name resolver services, it would be nearly impossible to surf the
    Web as freely and easily as we do. As humans, we tend to do better with names
    like opensource.org, while computers do much better with numbers like 104.21.84.214.
    So we need a translation service to convert'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'the names that are easy for us to the IP addresses that are easy for our computers.


    Every computer needs its own resolver service so that it can locate hosts on the
    local network and the Internet. It''s complicated.


    In this chapter, we''ll start with an exploration of name services and how they
    work. Then we''ll look at the details of the resolver services and how they work
    in modern distributions. We''ll learn about the historical NSS resolver and the
    systemd-resolver along with tools and techniques for managing both.


    We''ll also explore one method for optimizing name services on hosts by reverting
    to the traditional NSSwitch resolver.


    # How a Name Search Works


    Let''s start with a simplified example of what happens when a request for a web
    page is made by a client service on your computer. For this example, I use www.example.net
    as the website I want to view in my browser. I also assume that there is a local
    name server on the network, as is with my own network.


    1 Both, David, Introduction to the Domain Name System (DNS), https://www.both.org/?tp=4759


    320


    Chapter 12 Using systemd- resolved name service

    Local name resolution will vary a bit depending on the sequence of entries for
    the host line in the nsswitch.conf file. External name resolution always works
    regardless of which local resolver is being used.


    +   1. First, I type in the URL or select a bookmark

    containing that URL. In this case, the URL is

    www.example.net.


    +   2. The browser client, whether it is Opera, Firefox, Chrome, Min, Lynx, Links,
    or any other browser,

    sends the request to the operating system.'
