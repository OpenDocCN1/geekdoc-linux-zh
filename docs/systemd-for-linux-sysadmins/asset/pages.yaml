- img_proc: true
  md: 'specific System systems only. However, it is strongly recommended to avoid
    making use of this script today, and instead provide proper unit files with appropriate
    dependencies for any scripts to run during the boot process.


    As a result, it is wise to use this option as a temporary solution while migrating
    the contents of your rc.local file to one or more systemd.


