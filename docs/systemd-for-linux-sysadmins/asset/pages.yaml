    # Do You Really Need RTC?


    Any NTP implementation will set the system clock during the startup

    sequence, so is RTC necessary? Not really, so long as you have a network

    connection to a time server. However, many systems do not have full-

    time access to a network connection and the hardware clock is useful

    that Linux can read and set the system time. This is a better solution

    than having set the time by hand, even if it might drift away from the

    actual time.


