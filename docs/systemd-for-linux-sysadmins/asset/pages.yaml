    # Block (Almost) Everything


    Common advice when configuring a firewall is to first block everything and then
    open the ports you know you actually need. That means you have to know what you
    need, though, and sometimes figuring that out is an afternoon''s job all its own.

    If your organization runs its own DNS or DNS caching service, for instance, then
    you must remember to unblock the port (usually 53) handling DNS communication.
    If you rely on SSH to configure your servers remotely, then you must not block
    that port. You must account for every service running on your infrastructure,
    and you must understand whether that service is internal-only or whether it needs
    to interact with the outside world.

    In the case of proprietary software, there may be calls to the outside world that
    you''re not even aware of. If some applications react poorly to a strict firewall
    recently put in place, you may have to reverse'
