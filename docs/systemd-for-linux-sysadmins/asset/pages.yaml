    The correlation between ports and protocols is merely conventions mutually agreed
    upon by a standards group and a user base. These can be changed by individual
    computers. In fact, back in the pioneer days of computing, many people thought
    that just changing the port number of popular services would prevent an attack.
    Attacks are a lot more sophisticated now there''s so little value in surprising
    an automated port scanner by changing which port a service listens on.


    Instead, a firewall governs what activity is permitted in or out of any given
    port.


    # Firewall Rules


    By default, most firewalls have rule sets that block all incoming packets unless
    explicitly allowed. Certainly, this is true for Fedora and other Red Hat-based
    distributions that use firewall or iptables. plus the fact that most server services
    are not needed so are not installed or not enabled, means that Linux is very secure
    right from the initial installation.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Outbound packets are not blocked by the firewall so that we don''t need to
    add rules for protocols like email, SSH, and web browsers just to access remote
    hosts using these services from our client hosts.


    The flow of packets as they enter the Linux host is generally from start to finish
    the rule set. If a packet matches the rule, the action defined in the rule is
    taken. Ultimately, each packet will be accepted, rejected, or dropped. When a
    packet matches a rule that has 259


    # Chapter 10 Managing The FirewallWithFirewall


    one of these three actions, action is taken and the packet travels further through
    the rules. The three possible actions require just a bit of explanation:


    +   - **Accept**: The packet is accepted and passed to the designated TCP port
    and a server as a web server, Telnet, or SSH, to which it is addressed.


    +   - **Reject**: The packet is rejected and sent back to the originator with
    a message. This message allows the host on the other end to know what happened
    and try again if need be or to terminate the connection.


    +   - **Drop**: The packet is dropped and proceeds no further through the rules.
    No message is sent back to the originator. This action maintains the connection
    for the timeout period specified on the sender''s end. This is useful when blocking
    IP addresses of known spammers so that when they attempt a connection their host
    must wait through the timeout to try again, thus slowing down their attacks significantly.


    All Linux firewalls are based on a kernel protocol netfilter2 which interprets
    and enforces the rules. Netfilterorg is the organization responsible for netfilter
    and its functions. The administrative tools we use,'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'like firewald IPTables, simply allow us to add, modify, and remove netfilter
    rules that examine each data packet and determine how to handle it.


    2 Wikipedia, "netfilter", https://en.wikipedia.org/wiki/netfilter


    3 Netfilter.org, https://www.netfilter.org/index.html


