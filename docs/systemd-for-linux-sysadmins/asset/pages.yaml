  md: '3. The operating system first checks the /etc/hosts file to see if the hostname
    is there. If so, the IP address of that entry is returned to the browser. If not,
    we proceed to the next step. In this case, we assume that the name is not in /etc/hosts.


    4. The hostname is then sent to the first name server specified in /etc/resolv.conf.
    In this case, the IP address of the first name server is my own internal name
    server. For this example, my name server does not have the IP address for www.example.net
