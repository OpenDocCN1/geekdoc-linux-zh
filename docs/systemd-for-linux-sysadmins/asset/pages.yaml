    We''ve all encountered situations where a reported failure could not be


    © David Both 2025


    219


    D. Both, systemd for Linux SysAdmins, https://doi.org/10.1007/979-8-8688-1328-3_9


    Chapter 9 Using systemd JoUrnals


    reproduced, and that is always frustrating for the user as well as the administrator.
    Even home appliances and automobiles can be obstinate and refuse to fail when
    the service person shows up. Anthropomorphism, SysAdmins have some tools that
    can show us what has been happening in our Linux computers with varying degrees
    of granularity. We have tools like top, bhtop, glances, sar, iotop, tcpdump, traceroute,
    mtr, itptraf-ng, df, and many more, all of which can display the current state
    of a host and several of which can produce logs of various levels of detail.


    While these tools can be used to locate ongoing problems, they are not particularly
    helpful for transient problems and those that have no symptoms that are directly
    observable by the user—at least until some major and possibly catastrophic problem
    occurs.


    One important tool I have used for problem determination is the system logs–and
    now with systemd–the systemd journals. Logs and journals are persistent files
    that are used by the system to store and maintain a complete record of system
    events. This can provide critical information about a system and what was taking
    place when an error occurred—even long after the fact.


    Many historical style log files are still maintained along with the systemd journals.
    All log and journal files are stored in the /var/log directory.


    The systemd journal is always one of my first tools when solving a'
