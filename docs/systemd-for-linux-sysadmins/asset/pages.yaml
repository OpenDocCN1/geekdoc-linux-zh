  md: '# Summary


    The systemd journals provide a complete, time-sequenced record of Linux system
    activity. We''ve looked at how to use the journal with the journalctl command
    to extract and use that data.


    We discussed some ways to configure system journal retention and rotation.


    We determined that the systemd journals are a hybrid of ASCII text and binary
    data, this making use of standard Linux tools that work with ASCII problematic
    at. However, the journalctl command is a powerful


    tool that we can use to extract data from the systemd journals with great precision
    and finesse.


    Adding our own entries into the journal is easy and can be used in scripts and
    on the command line.


    We also learned how to manage disk space by manually rotating and vacuuming journals.


    # Exercises


    Perform these exercises to complete this chapter.


    If possible, use a noncritical, physical Linux host that has been in service for
    some time to perform these exercises. Otherwise, continue to use the VM.


    253


    Chapter 9 Using systemd JoUrnals


    +   1. Determine the full date range of the journals for the host.


    +   2. View the dmesg page for the last two boots using three different methods—but
    not the dmesg command.


    +   3. Are there any critical entries in the journals?


    +   4. If so, explore them and see if you can determine the cause.'
