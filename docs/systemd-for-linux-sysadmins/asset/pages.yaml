    # NTP


    NTP is the Network Time Protocol that is used by computers worldwide to synchronize
    their times with Internet standard reference clocks via a hierarchy of NTP servers.


    There are multiple tools available for management of NTP timekeeping. We look
    at two, chrono and systemd-timesync.


    1 Wikipedia, https://en.wikipedia.org/wiki/Network_Time_Protocol 148


    Chapter 6 Your Computer time and date with SSystem


    # The NTP Server Hierarchy


    The NTP server is built in layers called strata. Each stratum is a layer of NTP
    servers. The primary servers are stratum 1, and they are connected directly to
    national time services at stratum 0 via satellite, radio, or even modems over
    phone lines in some cases. Those time services at stratum 0 may be an atomic clock,
    a radio receiver that is tuned to the signals broadcast by an atomic clock, or
    a GPS receiver that the highly accurate clock signals broadcast by GPS satellites.


    To prevent requests from time servers lower in the hierarchy, that is, with a
    higher stratum number, from overwhelming the primary reference servers, there
    are several thousand public stratum 2 servers that are open and available for
    all. Many users and organizations, myself included, with large numbers of their
    hosts that need an NTP server, set up their own time servers so that only one
    local host actually accesses the stratum 2 servers. The remaining hosts in our
    networks are all configured to use the local time server, which, in my case, is
    a stratum 3 server.


    # NTP Implementation Options


    The original NTP implementation is ntpd, the NTP daemon, and it has'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'joined by two newer ones, chronyd and systemd-timesyncd. All three keep the
    local host''s time synchronized with an NTP time server. The systemd-timesyncd
    service is not as robust as chronyd, but it is sufficient for most purposes. It
    can perform large time jumps if the RTC is far out of sync, and it can adjust
    the system time gradually to stay in sync with the NTP server if the local time
    drifts a bit. The systemd-timesyncd service cannot be used as a time server.


    149


    # Chapter 6 Control Your Computer time and date with sSystem


    Chrony is an NTP implementation containing two programs: the chronyd daemon and
    a command-line interface called chronyc. Chrony has some features that make it
    the best choice for many environments, chief:


    +   * Chrony can synchronize to the time server faster than the old ntpd service.
    This is good for laptops or desktops that do not run constantly.


    +   * It can compensate for fluctuating clock frequencies, such as when a host
    hibernates or enters sleep mode or when the clock speed varies due to frequency
    stepping that slows clock speeds when loads are low.


    +   * It handles intermittent network connections and bandwidth saturation.


    +   * It adjusts for network delays and latency.


    +   * After the initial time sync, chrony never stops the clock. This ensures
    stable and consistent time intervals for many system services and applications.


    +   * Chrony can work without a network connection. In this case, the local host
    or server can be updated manually using the date command.'
