    # EXPERIMENT 13-1: CREATING AN EXECUTABLE FILE


    Create thestartup.sh file shown here, and place it in /usr/local/bin and make
    it executable. i used 754 permissions. Be sure to use the location for Bash that
    is correct for your distribution in the shebang line. For example, debian-based
    distributions locate at /bin/bash, while red hat and related distributions such
    as Fedora place it in /usr/bin/bash.


    ```

    #!/usr/bin/bash

    ############################################################

    # mystartup.sh


    # This shell program is for testing a startup like rc.local

    # using systemd.


    # By David Both

    # Licensed under GPL V2 or later at your option.


    ############################################################

    # This program should be placed in /usr/local/bin

    ############################################################

    # This is a test entry

    echödate +%F "%T" "Startup worked" >> /root/mystartup.log this version of the
    mystartup.sh file is intended only to verify that our service and the executable
