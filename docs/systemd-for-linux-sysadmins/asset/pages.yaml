    # Preparation


    All of the experiments in this chapter should be done as the root user (unless
    otherwise specified). Some of the commands that simply list various system units
    can be performed by non-root users, but the commands that make changes cannot.
    Make sure to do all of these experiments only on non-production hosts or virtual
    machines (VMs).


    # EXPERIMENT 5-1: PREPARATION


    One of these experiments requires the sysstat package. As root, install it before
    you move now. For Fedora and other Red Hat-based distributions, you can install
    sysstat with this command:


    ```

    # dnf -y install sysstat

    ```


    The sysstat RPM installs several statistical tools that can be used for problem
    determination. One is System Activity Report (SAR),which records many system data
    points at regular intervals (every ten minutes by default). Rather than run as
    a daemon in the background, the sysstat package installs two systemd timers. One
    timer runs every ten minutes to collect data, and the other runs once a day to
    aggregate the daily data. In this chapter, I will look briefly at these timers
    but wait to explain how to create a timer in a future article.


    # systemd Suite


    The fact is systemd is more than one program. It is a large suite of programs
    all to work together manage nearly every aspect of a running Linux system. A full
    exposition of systemd would take a book on its own. Most of us do not need to
    understand all of the details about how


    CHAPTeR 5 MAnAGe SysTeMdUnIts wTH SyStTeMCTI


    all of systemd''s components fit together, so I will focus on the programs and
    components that enable you to manage various Linux services and deal with log
    files and journals.'
