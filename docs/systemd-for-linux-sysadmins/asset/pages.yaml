    # Chapter 16 Why I Support the SyStemd plan to take over the World Having a unified
    method of managing them is an expectation for users


    and a useful luxury for busy SysAdmins. For this nontrivial task, the system daemon,
    or systemd, was developed and quickly adopted by all major Linux distributions.


    Of course, systemd isn''t the only way to manage a Linux system. There are many
    alternative init systems, including sysvinit, OpenRC, runit, s6, and even BusyBox,
    but systemd but treats Linux as a unified dataset, meant to be manipulated and
    queried consistently with robust tools. For a busy systems administrator and many
    users, the speed and ease of systemd is an important feature. Here are five reasons
    why.


    # Boot Management


    Booting a Linux computer can be a surprisingly rare event, if you want it to be.
    Certainly in the server world, uptimes are often counted in years rather than
    months or years. Laptops and desktops tend to be shut down and booted pretty frequently,
    even though these are likely to be suspended or hibernated as they are to be shut
    down. Either way, the time since the most recent boot event can serve as a sort
    of session manager for a computer health check. It''s a useful way to limit what
    data you look at when monitoring your system or diagnosing problems.


    In the likely event that you can remember the last time you booted your computer,
    you can list boot sessions with systemd''s logging tool, journalctl:


    ```

    $ journalctl --list-boots

    -42 7fe7c3... Fri 2020-12-04 05:13:59 - Wed 2020-12-16 16:01:23

    -41 332e99... Wed 2020-12-16 20:07:39 - Fri 2020-12-18 22:08:13

    [...

    -1 e0fe5f44... Mon 2021-03-29 20:47:46 - Mon 2021-03-29 21:59:29

    0 37fbe4a... Tue 2021-03-30 04:46:13 - Tue 2021-03-30 10:42:08

    ```'
  merge: -1
  pgno: 416
- img_proc: true
  md: '418


    Chapter 16 Why I Support the SyStemd plan to take over the World The latest boot
    sessions

    appear at the bottom of the list, so you can


    pipe the output to tail for the latest boots.


    The numbers on the left (42, 41, 1, and 0 in this example) are index


    numbers for each boot session. In other words, to view logs only a

    specific boot session, you can use its index number as reference.


    # Log Reviews


    Looking at logs is an important method of extrapolating information

    about your system. Logs provide a history of much of the activity your

    computer engages under your direct supervision. You can see when

    services launched, when timed jobs ran, what services are running in the

    background, which activities failed, and more. One of the most common

    initial troubleshooting steps is to review logs, which is easy to do with

    journalctl.


    ```

    $ journalctl --pager-end

    ```


    The --pager-end (or -e for short) option starts your view of the logs at

    t end of the journalctl output, you must scroll up to see events that

    happened earlier.


    systemd maintains a "catalog" of errors and messages filled with

    records of errors, possible solutions, pointers to support forums, and

    developer documentation. This can provide important context to a log

    event, which can otherwise be a confusing blip in a sea of messages or,

    worse, could go entirely unnoticed. To integrate error messages with

    explanatory text, you can use the --catalog (or -x for short) option:


    ```

    $ journalctl --pager-end --catalog

    ```


    419


    Chapter 16 Why I Support the SyStemd plan to take over the World To further limit
    the log

    output you need to wade through, you can


    specify which boot session you want to see logs. Because each boot'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'session is indexed, you can specify certain sessions with the --boot option

    and view only the logs that apply to it:


    ```

    $ journalctl --pager --catalog --boot 42

    ```


    You can also see logs for a specific systemd unit. For instance,

    troubleshoot an issue with your secure shell (SSH) service, you can specify

    --unit sshd to see only the logs that apply to the sshd daemon:

    $ journalctl --pager - \

    --catalog --boot 42 \


    # --unit sshd


    # Service Management


    The first task for systemd is to boot your computer, and it generally does

    that promptly, efficiently, and effectively. But the task that''s never finished
    is service

    management. By design, systemd ensures that the services you

    want to do indeed start and continue running during your session.

    This is nicely robust, because in theory a crashed service can be

    restarted without your intervention.

    Your interface to help systemd manage services is the systemctl

    command. With it, you can view the unit files that define a service:


    # $ systemctl cat sshd $


    ```

    # /usr/lib/systemd/system/sshd.service


    [Unit]

    Description=OpenSSH server daemon

    Documentation=man:sshd(8) man:sshd_config

    After=network.target ssh-keygen.target

    Wants=sshd-keygen.target

    420

    Chapter 16 Why I Support the SyStemd plan to take over the World

    [Service]

    Type=notify

    EnvironmentFile=/etc/crypto-policies/back-ends/

    ```'
