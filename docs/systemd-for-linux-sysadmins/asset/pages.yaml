    Chapter 16 Why I Support the SySystemd plan to take over the World Targets

    Targets are the final major component of the systemd matrix. A target is

    defined by a unit file, as services and timers. Targets can also be

    started and enabled in the system we What makes targets unique is that

    they group other unit files in an arbitrarily significant way. For instance,

    you might want to boot to a text console instead of a graphical desktop,

    the multi-user target exists. However, the multi-user target is only the

    graphical target without the desktop unit files as dependencies.


    In short, targets are an easy way to collect services, timers,

    and even other targets together to represent an intended state for your'
  merge: -1
  pgno: 420
- img_proc: true
  md: 'machine.


    In fact, within systemd, a reboot, a power-off, or a shutdown action


    just another target.


    You can list all available targets using the list-unit-files option,


    constraining it with the --type option set to target:


    ```

    $ systemctl list-unit-files --type target

    ```


    # Taking Control with systemd


    Modern Linux uses systemd for service management and log


    introspection. It provides everything from personal Linux systems


    to enterprise servers with a modern mechanism for monitoring and


    easy maintenance. The more you use it, the more systemd becomes


    comfortably predictable and intuitive, and the more you discover how


    disparate parts of your system are interconnected.


    To get better acquainted with systemd, you must use it. And to get


    comfortable with using it, download our cheat9 and refer to it often.


    9 Kenlon, Seth, Linux systemd cheat sheet, https://opensource.com/downloads/linux-systemd-cheat-sheet


    423


    Chapter 16 Why I Support the Systemd plan to take over the World Final Exercise


    This is the last exercise in this book, it''s a bit different because there''s
    no list of tasks or questions. It''s a simple suggestion that you spend time


    exploring systemd and its many facets and learn as much more about it as


    you can.


    Follow your curiosity wherever it leads. Create your own experiments and use them
    to guide your explorations.


    424'
