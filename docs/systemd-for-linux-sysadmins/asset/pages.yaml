    # ChapTer14 getTINg More oUT F The JourN


    The journalctl command is designed to extract usable information


    from the systemd journals using powerful and flexible criteria for


    identifying the desired data.


    It’s not usually necessary or even desirable to list all the journal entries

    and manually search through them. Sometimes I look for entries related to

    a specific service, and in other instances I look for entries that happened at

    specific times. The journalctl command provides powerful options that

    allow you to see only the data you are interested in finding.


    Let’s explore a few more of these options, especially the ones that I find

    most helpful.


    # EXPERIMENT 14-1: NARROWING THE SEARCH


    Start with the --list-boots option, which lists all the boots during the time

    period for which journal entries exist. note that the journalctl.conf file

    may specify that journal entries are discarded after they reach a certain age

    or after the storage device (hDD/SSD) space taken by the journals reaches a

    specified maximum amount.'
