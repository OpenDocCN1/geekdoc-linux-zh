    # [Install]


    WantedBy=multi-user.target

    Most unit files exist in /usr/lib/systemd/system/, but as as many important configurations,
    you''re encouraged to modify them with local changes. There''s an interface for
    that, too:


    # $ systemctl edit sshd


    You can see whether a service is currently active:


    ```

    $ systemctl is-active sshd

    active

    ```


    ```

    $ systemctl is-active foo

    inactive

    ```


    Similarly, you can see whether a service has failed with is-failed.

    Starting and stopping services are nicely intuitive:


    ```

    $ systemctl stop sshd

    $ systemctl start sshd

    421

    ```


    Chapter 16 Why I Support the SyStmd plan to take over the World And enabling a
    service to start at boot time is simple:


    ```

    $ systemctl enable sshd

    Add the --now option to enable a service to start at boot time or to start it
    for your current session.

    ```


    # Timers


    Long ago, when you wanted to automate a task on Linux, the canonical'
  merge: -1
