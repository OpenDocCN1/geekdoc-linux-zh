    # Targets


    A system target represents a Linux system''s current or desired run state.


    present the system to run and be active in that state. Table 3-1 shows the possible
    state targets of a Linux system used. As seen in


    Chapter 2, and in the system bootup page (man bootup), there are other intermediate
    targets that are required to enable various necessary services. These can include
    swap.target, timers.target, local-fs.target, and more. Some targets (like basic.target)
    are used as checkpoints to ensure that all the required services are up and running
    before moving to the next-level target.


    Unless otherwise changed at boot time in the GRUB menu, systemd always starts
    the default.target. The default file is a symbolic link to the true target file.
    For a desktop workstation, this is typically going to be graphical.target, which
    is equivalent to runlevel 5 in SystemV. For a server, the default is most likely
    to be the multi-user.target, which is like runlevel 3 in SystemV. The emergency.target
    file is similar to single-user mode. Targets and services are system units.


