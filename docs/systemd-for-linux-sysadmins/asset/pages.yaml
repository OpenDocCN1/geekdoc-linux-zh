    # Crunchy on the Outside


    I have encountered many networks in my career that SysAdmins say are


    "crunchy on the outside, soft and gooey on the inside."5 This refers to some types
    of candy that have a hard shell but quite soft in the middle.


    Networks can be like that. When the firewall on the edge of the network is cracked,
    no matter how hard that was, the rest of the network is laid open to plunder.


    As a result, Linux distributions all ensure they are installed with an active
    firewall that allows access only by a small number of necessary services.


    As you will see in this chapter, I have experimented with reducing the number
    of open ports even smaller because I like to ensure the maximum level of security
    on all Linux hosts in my network. This includes an active firewall on every one.


    # firewall


    firewall is the default firewall management daemon used by current releases of
    Fedora and many other distributions. It has superseded not replaced iptables which
    has been around for many years. firewall provides some interesting features such
    as runtime rules in addition to permanent rules. Runtime rules can be used to
    meet temporary conditions and can be left active until a reboot, or they can be
    manually removed, or they can be set to expire after a predefined period of time.
    Permanent rules—as their name suggests—are persistent through reboots.'
