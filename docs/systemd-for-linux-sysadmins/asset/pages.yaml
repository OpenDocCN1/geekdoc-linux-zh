    # Timer Types


    systemd timers have other capabilities that are not found in cron, which triggers
    only on specific, repetitive, real-time dates and times. systemd timers can be
    configured to trigger based on status changes in other


    system units. for example, a timer might trigger a specific elapsed time after
    system boot, after startup, or after a defined service unit activates. These are
    called monotonic timers. Monotonic


    refers to a count or sequence that continually increases. These timers are not
    persistent because they reset after each boot.


    Table 8-1 lists the monotonic timers along a short definition of each, as well
    as the OnCalendar timer, which is not monotonic and is used


    to specify future times that may or may be repetitive. This information is derived
    from the systemd.timer man page with a few minor changes.


