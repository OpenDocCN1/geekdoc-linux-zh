    415


    # Chapter 16 Why I Support the Systemd plan to take over the World systemd Standards
    Configuration


    One of the problems I have had over the years is that, even though “Linux is Linux”,
    not all distributions store their configuration files in the same places or use
    the huge numbers of Linux hosts in the world, that lack of standardization is
    a problem. I have also encountered horrible config files and SystemV startup files
    created by developers trying to jump on the Linux bandwagon and who have no idea
    how to create software for Linux—and especially services that must be included
    in the Linux startup sequence.


    The systemd unit files standardize configuration and enforce a methodology and
    organization that provide a level of safety from poorly written SystemV start
    scripts. They provide tools that the SysAdmin can use to monitor and manage services.


    In April 2011, Lennart Poettering wrote a short blog post describing standard
    names for common system configuration files. Standardization makes the SysAdmin''s
    job easier. it makes it easier to automate administrative tasks in multiple Linux
    distributions. Developers also benefit from this standardization.


    # Sometimes, the Pain


    Any undertaking as massive as replacing and extending an entire system will cause
    some level of pain during the transition. I don’t mind learning the new commands
    and how to create configuration files of various types, such as targets, timers,
    and so on. It does take some work, but I think the results are well worth the
    effort.


