    # Timer Accuracy


    You probably noticed at least two things in the journal results for


    Experiment 8-2. First, you don''t need to do anything special to cause the

    STDOUT from the ExecStart triggers in the myMonitor.service unit to

    stored in the journal. That is all part of using systemd for running services.

    However, it means that you you might need to be careful about running

    scripts from a service unit and how much STDOUT they generate.


    207


    Chapter 8 Using systemd timers


    The second thing is that the timer does not trigger exactly on the

    minute at :00 seconds or even one minute from the previous

    instance. This is intentional, but it can be overridden if necessary (or if it

    just offends your SysAdmin sensibilities).


    The reason for this behavior is to prevent multiple services from

    tiggering at exactly the same time. For example, you can use time

    expressions such as Weekly, Daily, and more. These shortcuts are all

    defined to trigger at 00:00:00 hours on the day they are triggered. When

    multiple timers are specified this way, there is a strong likelihood that they

    would attempt to start simultaneously.


    systemd timers are intentionally designed to trigger somewhat

    randomly around the specified time to try to prevent simultaneous

    tiggers. They trigger semi-randomly within a time window that starts at

    t specified trigger time and ends at the specified time plus one minute.

    This trigger time is maintained at a stable position with respect to all other

    defined timer units, according to the systemd.timer man page. In my'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'journal entries, the timer triggered immediately when it started and then about
    46 or 47 seconds after each minute.


    Most of the time, probabilistic trigger times are fine. When scheduling tasks
    such as backups to run, so long as they run during hours, there will be no problems.
    A SysAdmin can select a deterministic start time, such as 01:05:00 in a typical
    cron expression, to not conflict with other tasks, but there is a large range
    of time values that will accomplish that. A one-minute bit of randomness in a
    start time is usually irrelevant.


    However, for some tasks, exact trigger times are an absolute requirement. For
    those, you can specify greater trigger time-span accuracy (to within a microsecond)
    by adding a statement like this to the Timer section of the timer unit file:


    ```

    AccuracySec=1us

    ```


