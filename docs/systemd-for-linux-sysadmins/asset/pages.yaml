  md: 'The sysinit.target and basic.target targets can be considered checkpoints in
    the startup process. Although one of systemd''s design goals is to start system
    services in parallel, certain services and functional targets must be started
    before other services and targets can start. These checkpoints cannot be passed
    until all of the services and targets required by that checkpoint are fulfilled.


    # 18


    # Chapter 1 Learning to Love systemd


    The sysinit.target is reached when all of the units it depends on are completed.
    All of those units, mounting filesystems, setting up swap files, starting udev,
    setting the random generator seed, initiating low-level services, and setting
    up cryptographic services (if one or more filesystems are encrypted), must be
    completed, but, within the sysinit.target, those tasks can be performed in parallel.


    The sysinit.target starts up all of the low-level services and units required
    for the system to be marginally functional and that are required to enable moving
    onto the basic.target.


    After the sysinit.target is fulfilled, systemd starts all the units required to
    fulfill the next target. The basic target provides some additional functionality
    by starting units that are required for all of the next targets. These include
    setting things like paths to various executable directories, communication sockets,
    and timers.


    Finally, the user-level targets, multi-user.target or graphical.target, can be
    initialized. The multi-user.target must be reached before the graphical dependencies
    can be met. The underlined targets in Figure 1-4 are the usual targets. When one
    of these targets is reached, startup has


    completed. If the multi-user.target is the default, then you should see a text-mode
    login on the console. If graphical.target is the default, then you should see
    a graphical login; the specific GUI login screen you see depends on your default
    display manager.'
