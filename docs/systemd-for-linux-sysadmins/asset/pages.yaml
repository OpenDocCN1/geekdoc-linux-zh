    # Firewall Tools


    There are three primary tools that are commonly used to manage Netfilter firewall
    rules, iptables, ntables, and firewalld. All are intended to make firewall management
    a bit easier for SysAdmins but they differ in how approach that task, and the
    cases at hand can determine which tool is best. Fedora installs all three tools
    by default.


    Red Hat''s online documentation, Configuring and managing networking, 4 contains
    recommendations for using these tools.


    # When to use firewal, ntables, or iptables


    The following is a brief overview in which scenario you should use one of the
    following utilities:


    +   * firewalld: Use the firewald utility for simple firewall use cases. The utility
    is easy to use and covers the typical use for these scenarios.


    +   * ntables: Use the ntables utility to set up complex and performance- critical
    firewalls, such as for a whole network.


    +   * iptables: The iptables utility on Red Hat Enterprise Linux uses the nf_tables
    kernel API instead of the legacy back end. The nf_tables API provides backward
    compatibility so that scripts that use iptables commands still work on Red Hat
    Enterprise Linux. For new scripts, Red Hat recommends to use ntables.'
