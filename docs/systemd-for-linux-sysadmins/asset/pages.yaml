- img_proc: true
  md: 'interact with the host on the command line. When the user logged out, the

    init program would spawn a new getty to listen for the next connection.

    We now use an agetty, which is an advanced form of getty, in

    combination with the systemd service manager to handle the Linux virtual

    consoles as well as the increasingly rare incoming modem lines. The steps

    listed below shows the sequence of events in a modern Linux computer:


    +   1. systemd starts the systemd-getty-generator daemon.

    2. The systemd-getty-generator spawns an agetty on

    each of the virtual consoles using the serial-getty@.

    service.

    63

    Chapter 2 Linux Boot and Startup

    3. The agetys wait for virtual console connection, that

    is, the user switching to one of the VCs.

    4. The agetty presents the text mode login screen on

    the display.

    5. The user logs in.

    6. The default shell specified in /etc/passwd is started.

    7. The shell configuration scripts runs.

    8. The user works in the shell session.

    9. The user logs off.

    10. If present, the user’s logout script runs. For Bash,

    this is .bash_logout.

    11. The systemd-getty-generator spawns an agetty on

    the logged-out virtual console.

    12. Go to step 3.


    Starting with step 3, this is a circular process that repeats as long as

    the host is up and running. New login screens are displayed on a virtual

    console immediately after the user logs out of the old session.'
