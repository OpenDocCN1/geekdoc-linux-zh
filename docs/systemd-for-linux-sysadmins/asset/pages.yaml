  md: '# Chapter 2 Linux Boot and Startup


    GRUB has been designed to be compatible with the multiboot specification which
    allows GRUB to boot many versions of Linux and other free operating systems; it
    can also chain load boot record of proprietary operating systems. GRUB can also
    allow the user to choose to boot from several different kernels for any given
    Linux distribution. This affords the ability to boot to a previous kernel version
    if an updated fails somehow or is incompatible with an important piece of software.
    I have used this capability several times over the years.


    GRUB can be configured using the /boot/grub/grub.conf file. The configuration
    of GRUB or the use of GRUB2 commands are outside the scope of the boot. As mentioned
    in the POST section, at the end of POST, BIOS/UEFI searches the attached disks
    for a boot record, located in the GPT. BIOS/UEFI loads the first one it finds
    into memory and then starts execution of the boot record.


    # The GUID Partition Table


    Before going further, let''s look at the GUID Partition Table that replaces the
    legacy MBR partition table. The GUID Partition Table (GPT) is shown


    in Figure 2-1 is a relatively new, modern standard for disk partition tables.
    GPT is part of the Unified Extensible Firmware Interface (UEFI)


    Designed both for much greater MBR disk sizes and systemic redundancy, it is larger
    than the legacy MBR, so it supports much larger storage devices


    up to 9.44 zettabytes, 9.44 × 1021. The partition table provides pointers up to
    256 partition entries. Each entry defines a partition in the data area of the
    storage device.'
