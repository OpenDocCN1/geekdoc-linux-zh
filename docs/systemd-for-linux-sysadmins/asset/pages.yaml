    # Journal File Rotation


    The journal files are typically rotated automatically based upon the

    configuration in the /etc/systemd/journald.conf file. Files are rotated\whenever
    one of the specified conditions is met. So if, for example,

    the amount of space allocated to journal files is exceeded, the oldest file or

    files are deleted, the active file is made into an archive, and a new active

    file is created.


    246


    Chapter 9 Systemd JoUrnals

    Journal files can be rotated manually. I suggest using the --flush

    option first to ensure that all current data is moved to persistent storage

    to ensure that it is all rotated and the new journal files start empty. This

    option is listed in Table 9-3 but can also be found in the option section of the
    journalctl

    page.


    It is also possible to purge journal files without performing a

    file rotation. The vacuum-size=, vacuum-files=, and vacuum-time=

    commands are tools that can be used to delete old archive files down to

    a specified total size, number of files, or prior to the present. The

    option values consider only the archive files and not the active ones, on the

    resulting reduction in total file size might be somewhat less than expected

    unless you flush all data from volatile storage to persistent storage.


