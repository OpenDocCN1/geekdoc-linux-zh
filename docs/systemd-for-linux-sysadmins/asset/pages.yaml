- img_proc: true
  md: 'Chapter 13 replaCing rc.loCal in systemd


    For a much more detailed description of both the boot and startup sequences, refer
    to Chapter 2.


    # Local Startup


    System administrators sometimes add commands to the startup sequence that are
    locally useful. These additions may aim to start or run local processes that are
    not part of the standard systemd startup. It is possible to add a new system unit
    to launch each program needed at startup, but the old rc.local method providing
    a single executable Bash script for any and all local startup needs. We, too,
    can use this single file approach


    with systemd. The elegance of this solution is that it makes it easy to add more
    startup commands at a later time, without the need to add more service units unless
    systemd there is a specific reason for doing so. Our solution is to create a single
    system service unit and place any required Linux commands into the Bash script.
    There are two parts to this solution. One is obvious: we need an executable file.
    And two, we need to create a service unit for system that runs the executable.


    # Create the Executable File


    This is a trivial exercise for any SysAdmin familiar with Bash programming. In
    fact, we will create a Bash program and place it in the Linux Filesystem Hierarchical
    Standard (FHS) location for local executable files, /usr/local/bin. Any argument
    could be made for placing this executable file in another location, but /usr/local/bin
    is the one that makes the most sense to me since this location makes it easy for
    the SysAdmin to run the script from the command line if necessary. The /usr/local/bin
    directory is always in every user''sPATH, including that of the root user.


    1 Both, David, The Linux Filesystem Hierarchical Standard,


    https://www.both.org/?p=6082'
