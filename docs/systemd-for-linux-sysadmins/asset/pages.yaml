- img_proc: true
  md: 'If the default zone is changed, for example, from the public zone to the work
    zone, all of these interfaces immediately start using the work zone.


    +   3. **All interfaces are explicitly assigned to a zone.**nThis use case is
    the least likely to cause unexpected problems and confusion. Changing the default
    zone does not affect any interface in any manner. Interfaces can be reassigned
    to different zones, and the zone configuration can be changed.


    +   4. **Some interfaces are explicitly assigned to a zone, while other interfaces
    are not.** In this use case, changing the default zone affects only interfaces
    that are not explicitly assigned to a zone. All of the unassigned zones begin
    using the new default zone.


    275


    Chapter 10 Managing The Firewall With Firewall


    +   5. **Deleting the zone assignment for an interface.**

    The interface is unassigned and reverts to the default zone.


    +   6. **Changing the configuration of the default zone.** All interfaces using
    the default zone, whether by explicit assignment to that zone or by having no
    assignment, immediately reflect the configuration change.


