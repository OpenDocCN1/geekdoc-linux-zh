  md: 'Because "firewall" is such an exciting name, people often imagine an intricate
    Tron-style1 neon battle happening on the outskirts of a network, with packets
    of rogue data being set alight by the defenses to protect


    your users'' techno-fortress. In reality, a firewall is just a piece of software
    controlling incoming and outgoing network traffic.


    **Note** firewalld is not part of systemd. However, it is an important part of
    security and system administration. It has also adopted the systemd command structure’s
    use of multiple sub-commands and is the default firewall interface on many distributions,
    so I''ve decided to include it here.


    # Ports


    A firewall is able to manage network traffic by monitoring network ports. In the
    world of firewalls, the term port doesn’t refer to a physical connection like
    USB, VGA, or HDMI port. For the purpose of firewalls, a port is an artificial
    construct created by the operating system to represent a specific type of data.
    This system could have been called anything, like “contacts,” “connections,” or
    even “penguins,” but the creators used


    +   1 Wikipedia, “Tron,” [https://en.wikipedia.org/wiki/Tron](https://en.wikipedia.org/wiki/Tron)


