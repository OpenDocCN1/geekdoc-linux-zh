    # Chrony


    The chrony daemon, chronyd, in the background and monitors the time and status
    of the time server specified in the chrony.conf. If the local time needs to be
    adjusted, chronyd does so smoothly without the programmatic trauma that would
    occur if the clock were to be instantly reset to a new time.


    Chrony also provides the chronyc tool that allows us to monitor the current status
    of chrony and to make changes if necessary. The chronyc utility can be used as
    a command that accepts sub-commands, or it can be used as an interactive text
    mode program. We will use it both ways.'
