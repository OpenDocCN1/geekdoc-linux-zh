    # Chapter 2 Linux Boot and Startup


    # Hardware Boot


    The first step of the Linux boot process really has nothing whatsoever to do with
    Linux. This is the hardware portion of the boot process and is the same for any
    Intel-based operating system.


    When power is first applied to the computer, or the VM we have created for this
    course, it runs the Power On Self-Test (POST) which is part of BIOS or the newer
    Unified Extensible Firmware Interface (UEFI).

    BIOS stands for Basic I/O System, and POST stands for Power On Self-Test. When
    IBM designed the first PC in 1981, BIOS was designed to initialize the hardware
    components. POST is the part of BIOS whose task is to ensure that the computer
    hardware functioned correctly. If POST fails, the computer may not be usable,
    and so the boot process does not continue.


    Most modern motherboards provide the newer UEFI as a replacement for BIOS. Many
    motherboards also provide legacy BIOS support, but fewer are now doing so. Both
    BIOS and UEFI perform the same functions—hardware verification and initialization
    and loading the bootloader.\BIOS/UEFI POST checks basic operability of the hardware.
    Then it locates the boot sectors on all attached bootable devices, including HDD
    or SSD storage devices, DVD or CD ROM, or USB memory sticks. The first boot sector
    it finds that contains a valid master boot record (MBR) is loaded into RAM, and
    control is then transferred to the RAM copy of the boot sector.'
