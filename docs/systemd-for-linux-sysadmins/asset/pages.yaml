    # Journal Storage Usage


    Journal files take up storage space, so it is necessary to monitor them. That
    way, we can rotate them and delete old ones when necessary in order to free storage
    space. In this context, rotation means to stop adding


    244


    # Chapter 9 Using systemdJournals


    to the currently active journal (or log) file and to start a new file and add
    all future data to that one. Old, inactive files are maintained for some arbitrary


    time span and deleted when time expires.


    The journalctl provides methods for us to see how much storage space is used by
    the journals as well as configuration of the parameters used to trigger rotation.
    It also allows us to initiate rotation on demand.


    # EXPERIMENT 9-6: JOURNAL STORAGE AND ROTATION


    start by determining how much storage space is used by the journals.


    ```

    # journalctl --disk-usage

    ```


    Archived and active journals take up 551.2M in the file system.


    the result on my primary workstation is 3.5GB. Journal sizes depend greatly on
    the use to which a host is put and daily runtime. my physical hosts all run 24x7.


    The /etc/systemd/journal.conf file can be used to configure the'
