    # Overview


    > > Does anybody really know what time it is? Does anybody really care?

    Chicago, 1969


    Perhaps that rock group didn''t care what time it was, but our computers and devices
    really need to know the exact time.

    Most people are people with time. We get up in time to perform our morning rituals
    and commute to work, take a break for lunch, meet a project deadline, celebrate
    birthdays and holidays, catch a plane, and so much more.

    Some of us are even obsessed with time. My watch is so solar-powered and obtains
    the exact time signal from the National Institute of Standards and Technology
    (NIST) in Fort Collins, Colorado, via the WWVB time radio station located there.
    The time are synced to the atomic clock, also located in Fort Collins. My Fitbit
    syncs up to my phone, which is synced to a Network Time Protocol (NTP) server,
    which is ultimately synced to the atomic clock.

    And, of course, I have an NTP time server in my home network, and all'
