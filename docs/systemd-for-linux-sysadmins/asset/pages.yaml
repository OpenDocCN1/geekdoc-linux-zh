- img_proc: true
  md: 'This chapter explored the use of systemd tools for managing date, time, and
    time zones. systemd-timesyncd provides a decent NTP client that can keep time
    on a local host synchronized with an NTP server. However, systemd-timesyncd does
    not provide a server service, so if you need an NTP server on your network, you
    must use something else, such as chrony, to act as a server.


    I prefer to have a single implementation for any service in my network, so if
    you do not need a local NTP server, or if you do not mind dealing with chrony
    for the server and systemd-timesyncd for the client and you do not need additional
    capabilities, then systemd-timesyncd is a serviceable choice for an NTP client.


    There is another point I want to make: you do not have to use systemd tools for
    NTP implementation. You can use chrony or some other NTP implementation. systemd
    is composed of a large number of services; many of them are optional, so they
    can be disabled and something else used in its place. It is not the huge, monolithic
    monster that some make it out to be. It is OK to not like systemd or parts of
    it, but you should make an informed decision.


    I don''t dislike systemd''s implementation of NTP, but I much prefer chrony because
    it better meets my needs. And that is what Linux is all about.


