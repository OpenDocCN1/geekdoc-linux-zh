  md: '# Chapter 13 replaiC.loCal in systemd


    A few years ago, I encountered two different problems on two different

    Linux hosts. Each Each required a unique circumvention because I had not yet

    found a real solution. However, the method for delivering each circumvention

    was the same: run a command during or soon after Linux startup.

    The rc.local file was—and in some cases still is—the place for Linux

    SysAdmins to put commands that need to be run at startup. Use of the

    rc.local file is not only deprecated, but after a couple of hours'' worth of

    attempts, was not working in any event. This is despite the fact that

    systemd documentation mentions the use of a "generator" that generates

    systemd services from an rc.local file if one exists. That seems to be a good

    way as any to enforce deprecation—make it not work.

    The details of my specific problem are not particularly relevant to this

    discussion, so I will use a simple and easily tracked command to the content

    of our local startup file. We will add a date-stamped line to a local log file
    to verify that the

    Bash program we need to run at startup actually works.


    # Boot vs. Startup


    Understanding the Linux boot and startup process is important for

    configuring Linux and resolving startup issues. In reality, there are two

    sequences of events that are required to boot a Linux computer and make

    it usable: boot and startup. The boot sequence starts when the computer

    is turned on and finishes when the kernel is initialized and systemd is

    launched. The startup process then takes over and finishes the task of

    getting the Linux computer into an operational state.

    Overall, the Linux boot and startup process is fairly simple to

    understand. It is comprised of the following steps:


    +   1. BIOS power-on-self-test (POST)

    2. Bootloader (GRUB2)

    3. Kernel

    4. systemd'
