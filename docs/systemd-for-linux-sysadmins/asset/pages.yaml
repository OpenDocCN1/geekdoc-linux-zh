    # Summary


    We’ve explored Linux startup with systemd and unit files and journals in

    greater detail and discovered what happens when errors are introduced

    to the service file. As a SysAdmin, I find that this type of experimentation

    helps me understand the behaviors of a program or service when it

    breaks, and breaking things intentionally is a good way to learn in a safe

    environment.


    114


    Chapter 4 how to Manage Startup uSing SySteMd


    As these experiments have proved, just adding a service unit to either

    the multi-user.target or the graphical.target does not define its place in

    the start sequence. It merely determines whether a unit starts as of

    the graphical.target or the non-graphical multi-user.target. The reality is

    that the startup targets—multi-user.target and graphical.target—and all of

    the Wants and Requires, start pretty mighty in parallel. The best way


    to ensure that a unit starts in a specific order is to determine the unit it is
    dependent

    and configure the new unit to “Want” and “After” the unit

    upon which it is dependent.


