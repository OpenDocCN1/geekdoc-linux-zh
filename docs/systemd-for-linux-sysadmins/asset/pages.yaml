    # firewall Zones


    The firewall service can provide a complex and intricate set of rules for a firewall.
    It uses the concept of zones to connect related rules in such a way to create
    levels of trust. Each zone represents a level of trust that can be independently
    modified without affecting other zones. firewall has several predefined zones.


    Each network interface is assigned a zone and all network traffic to that interface
    is filtered by the rules in that zone. Network interfaces can be easily switched
    from one zone to another if necessary, thus making preconfigured changes easy.
    These zones are arbitrary constructs to meet a specific set of needs in a firewall.
    For example, network interface that is connected to the internal network would
    be'
  merge: -1
