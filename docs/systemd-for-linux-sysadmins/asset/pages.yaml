    # NTP Server Pools


    Line 3 of the default chrony.conf file lists a server''s part of a pool of


    Fedora NTP time servers. There are many server pools 2 w with thousands of servers
    worldwide.


    The objective for the server pools is to spread the load of millions of


    NTP clients so that no one server becomes overloaded with requests. Pools


    provide multiple servers so that, if one is unavailable, others will be.


    Most Linux distributions have their own pool of servers. Fedora and


    Red Hat are no exceptions. GitHub has a long list of public server pools.3 and
    all the major distributions and a number of lesser ones pools listed. We''ll list
    of Fedora pools in an experiment.


