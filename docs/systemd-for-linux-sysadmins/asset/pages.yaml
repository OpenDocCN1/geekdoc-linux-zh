    # Fail2Ban


    A great firewall is one that can adapt as the threats change. I needed something
    like this to stem the large number of attacks via SSH I had been experiencing
    a few years ago. After a good bit of exploring and research, I found fail2ban,
    open source software which automates what I was previously doing by hand and adds
    repeat offenders to a blocklist of firewalls. The best part is that it integrates
    nicely with both iptables and firewall.


    Fail2Ban has an extensive series of configurable matching rules and separate actions
    that can be taken when attempts are made to crack into a system. It has rules
    for many types of attacks that include web, email, and other services that might
    have vulnerabilities. Fail2Ban works by detecting attacks and then adding a rule
    to the firewall that will block further attempts from that specific, single IP
    address for a specified and configurable amount of time. After the time has expired,
    it removes the blocking rule.'
