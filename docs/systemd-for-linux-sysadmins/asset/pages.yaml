    Although SysAdmins use command-line programs and Bash scripts

    to automate the tasks we perform as SysAdmins, what happens when tasks

    eed to be performed at times that are not convenient for us as humans?

    For example, if we do backups at 01:01AM every morning, or run a

    maintenance script at 03:00AM every Sunday, I most definitely do not

    to get out of bed to perform those tasks.


    Linux provides multiple tools and ways in which we can use those tools

    to run tasks at specified times in the future, repeating as needed or just

    for a one-time occurrence. However, keeping accurate time is critical to

    suring that scheduled jobs run at the correct times.


    146


    Chapter 6 Control Your Computer time and date with sSystem

    This chapter starts by looking at computer times, NTP, and the use of

    chrono to synchronize the time our computer keeps with a standardized

    time reference such as an atomic clock. We''ll then move on using

