    # Set the Hardware Clock


    Maintaining accurate time on the system hardware clock is as important as

    the Linux operating system. The hardware clock is also known as the

    real-time clock (RTC) and the CMOS clock.


    The primary reason for this—in my experience—is that from the

    moment the system is booted, through much of the Linux startup

    sequence until the network is up and running, the hardware clock is

    the one being used for journal and log timestamps. If those are far from

    correct, it becomes difficult to trace the time sequence of boot problems.


    I''ve worked on computers that had a dead CMOS battery and the

    hardware time always started at 00:00:00 UTC on January 1, 1970. 6 All

    Unix and Linux computers count the time in seconds from that date.

    all logs and journal entries started in 1970, when the network became

    available to sync with an NTP server, switched to the true current time.


    6 Wikipedia, "Unit Time,” https://en.wikipedia.org/wiki/Unix_time


