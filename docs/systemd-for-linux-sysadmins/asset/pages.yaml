    # Managing the Firewall with firewalld


    # Objectives


    In this chapter, you will learn to


    +   * Describe the function of a firewall


    +   * Define and describe the term "port"


    +   * Use firewalld zones for firewall management under different sets of circumstances


    +   * Set a default zone


    +   * Assign network interfaces to a zone


    +   * Modify existing zones


    +   * Create a new zone to meet a set of specifications


    +   * Integrate Fail2Ban dynamic firewall software with firewalld to automate
    protection against specific attacks


    > © David Both 2025


