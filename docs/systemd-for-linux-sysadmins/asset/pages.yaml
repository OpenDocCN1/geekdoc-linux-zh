    # NS and NSSwitch


    As its name implies, the nsswitch—short for Name Service Switch—is used to define
    the database sources and in which name-service information is obtained.


    Unicast services like nss-DNS use a single server that maintains the entire database.
    If a host needs the IP address of another server host on the network, it sends
    a unicast packet to only the name server requesting the IP address from. The name
    server responds only to the requesting host with a packet containing that IP address.


