  md: 'checkpoints in the startup process. Although systemd has as one of its design
    goals to start system services in parallel, there are still certain services and
    functional targets that must be started before other services and targets can
    be started. These checkpoints cannot be passed until all of the services and targets
    required by that checkpoint are fulfilled.


    The sysinit.target is reached when all of the units on which it depends are completed.
    All of those units, mounting filesystems, setting up swap files, starting udev,
    setting the random generator seed, initiating low-level services, and setting
    up cryptographic services if one or more filesystems are encrypted, must be completed,
    but within the sysinit.target these tasks can be performed in parallel.


    The sysinit.target starts up all of the low-level services and units required
    for the system to be functionally complete and that are required to enable moving
    on the basic.target.


    6 Use the command man bootop.


    39


    # Chapter 2 Linux Boot and Startup


    After the sysinit.target is fulfilled, systemd starts the basic.target, starting
    all of the units required to fulfill it. The basic target provides some additional
    functionality by starting units that are required for all of the next targets.
    These include setting up things like paths to various executable


    directories, communication sockets, and timers.


    Finally, the user-level targets, multi-user.target and graphical.target, are initialized.
    The multi-user.target must be reached before the graphical target dependencies
    can be met. The underlined targets in Figure 2-2 are the usual startup targets.
    When one of these targets is reached, then startup has completed. If the multi-user.target
    is the default, then you should see a text mode login on the console. If graphical.target
    is the default, then you should see a graphical login; the specific GUI login
    screen you will see will depend upon the default display manager.'
