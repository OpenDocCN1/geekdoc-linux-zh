- img_proc: true
  md: 'Security is a big part of our job as SysAdmins, and firewalls are a major tool
    in keeping our networks safe. While Linux is quite secure as initially installed,
    any device connected to a wired or wireless network is always a target for crackers.
    A good firewall in the edge of your network where it interfaces with the Internet
    is a good step in ensuring that your network is hardened. However, without appropriately
    configured firewalls present on every host in the network, a cracker who breaches
    the firewall host also gains immediate access to every host on your network.


    # Chapter 10 Managing the Firewall with Firewal


    The best approach to setting up any firewall is to start by blocking everything.
    Then only you should start considering the specific services that should be allowed
    to access your network. firewall does an excellent job as the default firewall
    using the public zone because it blocks almost everything. Like I did, you should
    experiment to see whether an even more restrictive zone configuration might provide
    all of the access needed into your hosts and network while making them even more
    secure.


    I recommend that you not change the preinstalled zone files. I suggest that you
    do what I do and copy the existing zone file that most closely meets your needs
    and modify it as necessary. fireld provides some basic yet secure zone files to
    start. You may find that one of those is perfect for your needs on some or all
    of your hosts.


    We explored zones as a concept and the reality of how they work and how they can
    be adapted to better meet your needs. This was done in the context of a workstation
    rather than a server or designated firewall to protect your entire network.


