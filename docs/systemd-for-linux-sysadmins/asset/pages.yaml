    220


    # Chapter 9 Using systemd Journals


    The objective of any log or journal is to maintain a time-sequenced history of
    the normal activities of the various services and programs that run on a host
    and to record any errors and warning messages that might occur. The log messages
    used to be maintained in separate files in `/var/log`, usually one for the kernel
    and separate ones for most of the services running on the host. Unfortunately,
    the large number of log files could delay discovery of the root cause of the problem
    by spreading out needed information. This could be especially time-consuming when
    trying to determine what was taking place in the system when the error occurred.


    The old `/var/log/dmesg` file was usually for the kernel, but that file was discontinued
    years ago in favor of using the **dmesg** command to display the same information—although
    only that from the current boot—and integrating those messages and more into the
    `/var/log/messages file. This merger of other logs into the messages file did
    to speed up problem determination by keeping much of the data in one file, but
    there were still many services that had not integrated their logs into the more
    central messages file.


    The systemd journal is designed to collect all messages into a single,'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'unified database that can show a complete picture of everything that happened
    in a system at and around a specific time or event.

    Journaling becomes active very early in the Linux boot process, while systemd
    itself is initializing. The exact amount of time will depend upon the speed of
    the host. For my fastest system, this was 1.38 seconds, and slowest was 6.31 seconds.


    Because all the events, regardless of the source, are in one place in time sequence
    order, it is possible to see at a glance everything happening at a specific point
    or range of times. This is one of the main benefits of systemd journaling when
    problem-solving.


    The dmesg command can also be used to discover the first moments of the kernel
    startup sequence. The kernel ring buffer is a space in memory 221


    Chapter 9 Using systemd-journalnals that is used to store kernel messages. This
    data is not persistent, so dmesg can reveal kernel logs from previous boots. Nor
    does it contain anything other than kernel messages.


    The system journal also contains the kernel messages in addition to everything
    it records.


    Let''s explore those first few moments in system initialization.


