  md: '2 Wikipedia, "GUID Partition Table," https://en.wikipedia.org/wiki/GUID_Partition_Table.
    This entry contains an excellent description of the MBR, its problems, and the
    function and the GPT.


    26


    # Chapter 2 Linux Boot and Startup


    # The MBR


    The MBR is very small—only 512 bytes. Therefore, the space is very limited and
    must contain both tiny bit of code, GRUB stage 1, as well as


    the partition table for the drive. The partition table defines the partitions
    that subdivide the space on the storage drive.


    The historical MBR is capable of supporting four primary partitions although one
    partition could be created as a so-called extended partition which supported additional
    logical partitions so that the space on the drive could be further subdivided.


    The total disk size supported by the MBR methodology is approximately 2.2 TB (2.2x1012)
    which is smaller than many storage devices currently available.


    # The GPT


    The GPT is a new, modern standard for disk partition tables. Designed for much
    greater disk sizes as well as systemic redundancy, it is larger than the MBR,
    so it supports much larger storage devices—up to 9.44 zettabytes, 9.44x1021.


    GPT uses an MBR in the first sector of the disk although it is used as a protective
    structure to provide an identifier so that system tools don''t see the drive as
    an empty storage device.


    # Functional Impact MBR vs. GPT


    Most of the time, the difference between MBR and GPT is not relevant to the operation
    of Linux hosts or the task of problem-solving. The function of both is to partition
    storage devices into usable chunks and to provide a tiny bit of code to provide
    a transition between the BIOS/UEFI hardware boot and the main portion of the GRUB
    bootloader.'
