    boots to external USB. In most environments, you will want to be more secure and
    set the host to boot from the internal boot device only. In environments that
    need to be even secure, you can use a BIOS password to prevent unauthorized users
    from accessing BIOS to change the default boot sequence.\Hardware boot ends when
    the boot sector assumes control of the system.


    # The Boot Sector


    The boot sector is always located in the first sector of the storage device whether
    HDD or SSD, and it contains the partition table as part of the master boot record
    (MBR). This MBR partitioning methodology dates back to 1983 and imposes limits
    on modern storage hardware to less than its capabilities.


    Modern partitioning schemes use the GUID Partition Table2 (GPT) to overcome those
    limitations.


    In this section, we look very briefly at both MBR and GPT.'
