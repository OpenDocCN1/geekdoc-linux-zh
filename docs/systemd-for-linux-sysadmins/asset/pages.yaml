    # Introduction


    There is little more frustrating to me as a SysAdmin than unexpectedly running
    out of some computing resource. On more than one occasion, I have filled all available
    disk space in a partition, and not had enough CPU time to perform the tasks at
    hand in the necessary period of time. Resource management is one of the most important
    tasks performed by SysAdmins.


    © David 2025


    305


    D. systemd for Linux SysAdmins, https://doi.org/10.1007/979-8-8668-1328-3_11


    Chapter 11 resource management with Cgroups


    The point of resource management is to ensure that all processes have relatively
    equal access to the system resources they need. Resource management also involves
    ensuring RAM, hard drive space, and capacity are added when necessary or restricted
    when that is not possible.


    Users who hog system resources, whether intentionally or accidentally, should
    also be prevented from doing so.


    We have tools to monitor and manage various system resources. Tools such as and
    many similar tools allow us to monitor the use of memory, I/O, storage (disk,
    SSD, etc.), network, swap space, CPU usage, and more. These tools, particularly
    those that are CPU-centric, are most based on the paradigm that the running process
    is the unit of control. At best they provide a way to adjust the nice number—and
    through that priority—or to kill a running process.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'Other tools based on traditional resource management in a SystemV environment
    are managed by the /etc/security/limits.conf file and the local configuration
    files located in /etc/security/limits.d directory. Resources can be limited in
    a fairly crude useful manner by user or group. Resources that can be managed various
    aspects of RAM, total CPU time per day, total amount of data, priority, nice number,
    number of concurrent logins, number of processes, maximum file size, and more.


    # Using cgroups for Process Management


    One major difference between systemd and SystemV is the way in which they handle
    processes. SystemV treats each process as an entity unto itself. systemd collects
    resources into control groups called cgroups and manages system resources for
    the cgroup as a whole. This means that resources can be managed per application
    rather than the individual processes that make up an application.


    306


    Chapter 11 resourceCe ManageMent with Cgroups


    The control units for cgroups are slice units. Slices are a conceptualization
    that allows systemd to order processes in a tree format for ease of management.
    I found the description below in an article 1 by Steve Owens of Red Hat that provides
    an excellent example of how cgroups are used by the system itself:


    > As you may or not know, the Linux kernel is responsible for all of the hardware
    interacting on a system. That means, aside from just the bits of code (drivers)
    that enable the operating system (OS) to understand the hardware, it also sets
    limits on how many resources a particular program can demand from the system.
    This is most easily understood when talking about the amount of memory (RAM) a
    system has to'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'divide amongst all of the applications your computer may execute. In its most
    basic form, a Linux system is allowed to run most applications without restriction.
    This can be great for general computing if all applications play nicely together.
    But what happens if there is a bug in a program, and it starts to consume all
    of the available memory? The kernel has a facility called the Out Of Memory (OOM)
    Killer. Its job is to halt applications in order to free up RAM so that the OS
    may continue to function without crashing.


    That''s great, you say, but what does this have to do with cgroups? Well, the
    OOM process acts as a last line of defense before your system crashes down around
    you. It''s use to a point, but since the kernel can control which processes must
    survive consume too much RAM in the first place.


    1 Owens, Steve, "A Linux SysAdmin''s introduction to cgroups," Enable SysAdmin,
    2020, https://www.redhat.com/sysadmin/cgroups-part-one 307


    Chapter 11 resourceManagement With Cgroups

    cgroups are, therefore, a facility built into the kernel that allow the administrator
    to set resource utilization limits on any process on the system. In general, cgroups
    control:


    +   * The number of CPU shares per process.

    * The limits on memory per process.

    * Block Device I/O per process.

    * Which network packets are identified as the type so that another application
    can enforce network traffic rules.


    There are more facets than just these, but those are the major'
  merge: -1
  pgno: 313
- img_proc: true
