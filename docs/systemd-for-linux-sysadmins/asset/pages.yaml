    This file used to be an ASCII plain-text file that contained a list up to

    three domain name servers that would be used to perform hostname

    resolution into IP addresses. It can still be used that way, but that would

    bypass systemd-resolved. Of course, that might be a desired outcome

    as it was for me when NetworkManager took over this service and then

    ysystemd-resolved was first introduced and had a few problems.

    It all works fine now, so I haven''t needed to do that for a few years

    omost of my hosts.'
