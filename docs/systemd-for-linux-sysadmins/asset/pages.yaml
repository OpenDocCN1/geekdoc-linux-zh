    # Service Units


    A Fedora installation usually installs and enables services that particular hosts
    do not need for normal operation. Conversely, sometimes it doesn''t include services
    that need to be installed, enabled, and started. Services that are not needed
    for the Linux host to function as desired, but are installed and possibly running,
    represent a security risk and should—at minimum—be stopped and disabled and—at
    best—should be uninstalled.


