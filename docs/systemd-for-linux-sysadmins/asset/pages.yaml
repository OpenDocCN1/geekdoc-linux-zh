    Chapter 15 analyzing systemd startup and Configuration


    # Overview


    One of our jobs as SysAdmins is to analyze the performance of the systems we support
    and to find and resolve problems that cause poor performance and long startup
    times. We also need to check other aspects of systemd configuration and usage.


    The systemd provides the systemd-analyze tool that can help us discover performance
    and other important systemd information. We have already used system-analyze earlier
    in this chapter to analyze timestamps and times spans for systemd timers, but
    it has other interesting and valuable uses as well. We will explore some of those
    uses in this section.


    # Linux Startup


    The Linux startup sequence is a good place to begin our explorations because many
    of the functions provided by the systemd-analyze tool are targeted at startup.
    Before we begin, however, it is important to understand the difference between
    boot and startup, so I will say it again, here. The boot sequence starts with
    the BIOS power-on-self-test (POST) and ends when the kernel is finishing loading
    and takes control of the host system, which is the beginning of startup and the
    point at which the systemd journal begins.


    The results in this section are all from my primary workstation which is much
    more interesting than those from a virtual machine. This workstation consists
    of an ASUS TUF X299 Mark 2 motherboard, with an Intel i9-7960X CPU with 16 cores
    and 32 CPUs (threads), and 64GB of RAM.


    There are several options we can use to examine the startup sequence. The simplest
    form of the systemd-analyze command displays a simple'
