    Each target has a set of dependencies described in its configuration file. systemd
    starts the required dependencies. These dependencies are the services to run the
    Linux host at a specific level of functionality.

    When all of the dependencies listed in the target configuration files are loaded
    and running, the system is running at that target level.

    systemd also looks at the legacy SystemV directories to see if any startup files
    exist. If, systemd uses those as configuration files to start the services described
    by the files. The deprecated network service is a good example of one that still
    use SystemV startup files in Fedora.


    Figure 2-2 is copied directly from the boot manager page.6 It shows a map of the
    general sequence of events during systemd startup and the basic ordering requirements
    to ensure a successful startup.

    The systeminit.target and basic.target targets can be considered as'
