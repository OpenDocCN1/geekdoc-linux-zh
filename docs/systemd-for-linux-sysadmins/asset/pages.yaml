    # Creating a Mount Unit


    Mount units may be configured with the traditional /etc/fstab or with system units.
    Fedora uses the fstab file as it is created during the installation. However,
    system uses systemd-fstab-generator program


    to translate the fstab file into system units for each entry in the fstab file.


    Now that you know how to use system .mount unit files for filesystem mounting,
    let''s create a mount unit for the new filesystem.


    # EXPERIMENT 5-5: MOUNT WITH SYSTEMD


    First, mount /TestFS. edit the /etc/fstab file and delete or comment out the TestFS
    line. now create a new file with name TestFS.mount in the /usr/


    local/lib/systemd/system directory 4 edit it to contain the configuration data
    below. The unit filename and the name of the mount point must be identical, or
    the mount will fail.


    4 /usr/local/lib/systemd/system is the correct location to place created system
    unit files.


