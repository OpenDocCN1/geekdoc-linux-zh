    We have seen that it''s important to understand exactly how adding services—ports—to
    a zone works. This set of guidelines is based on my experiments and describes
    how it can be expected to work:


    +   1. The public zone is the default by—ummm—default. The default zone can be
    changed. A different zone can be designated as the default, or the configuration
    of the default zone can be altered to allow a different set of services and ports.


    +   2. All interfaces that are not specifically assigned to any zone use the default
    zone. In this event, all interfaces, whether there is only one as in our VMs or
    ten or fifty in a complex router environment, use the default zone whatever may
    be. Typically in Fedora, that is the public zone.'
