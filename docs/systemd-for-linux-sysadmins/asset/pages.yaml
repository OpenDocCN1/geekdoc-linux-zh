  md: '# Practical Structure


    The structure of systemd—outside of its executable files—is contained in its many
    configuration files. Although these files have different names and identifier
    extensions, they are all called "unit" files. Units are the basis of everything
    systemd. Units are ASCII plain-text files that are accessible


    and to be created or modified by a SysAdmin. There are a number of unit file types,
    and each has its own page. Table 5-1 lists some of these unit file types by their
    filename extensions and a short description of each.


    **Table 5-1.** Some systemd unit file types


    # systemd Unit


    # Description


    # **automount**


    The **automount** units are used to implement on-demand (i.e., plug and play)
    and mounting of filesystem units in parallel during startup.


    # **device**


    The **device** unit files define hardware and virtual devices that are exposed
