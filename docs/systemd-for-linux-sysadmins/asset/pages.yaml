  md: '+   2. Stop and disable the Avahi daemon


    The Avahi daemon socket is a part of the Avahi service. When a program requests
    Avahi services, it does so through the daemon rather than directly to the service
    itself. The socket sends the request to the service. Other systemd services also
    work this way. This won''t be required since we disabled the Avahi service. A
    socket like this could also cause the service to start even though the service
    is disabled. We don''t want to allow that to happen.


    ```

    # systemctl disable --now avahi-daemon.socket

    ```


    +   3. Stop and disable the systemd-resolved service


    The systemd-resolved service is the root cause of the problems we''re having,
    so we disable it. The systemd- resolved man page states its purpose succinctly.


    systemd-resolved is a system service that provides network name resolution to
    local applications. It implements a caching and validating DNS/DNSSEC resolver,
    as well as an LLMNR and MulticastDNS resolver and responder.


    The man page then proceeds to describe the interfaces it exposes to programs and
    a high-level statement about how to access it as a resolver. This service is the
    root cause of the problem, and we disable it.


    ```

    # systemctl disable --now systemd-

    resolved.service

    ```


