  md: 'mother of all processes, and it is responsible for bringing the Linux host
    up to a state in which productive work can be done. Some of the functions assumed
    by systemd, which is far more extensive than the old init program, are to manage
    many aspects of a running Linux host, including mounting filesystems, managing
    hardware, handling timers, and starting and managing the system services that
    are required to have a productive Linux host.


    This chapter provides a brief look at systemd, its features, and functions.


    # Linux Boot


    The complete process that takes a Linux host from an off state to a running state
    is complex, but it is open and knowable. Before getting into the details, I''ll
    give a quick overview of when the host hardware is turned until the system is
    ready for a user to log in. Most of the time, the “boot process” is described
    as a single entity, but that is not accurate. There are, in fact, three major
    parts to the full boot and startup process:


    +   **Hardware boot**: UEFI initializes the system hardware.


    +   **Linux boot**: Loads the Linux kernel and then systemd.


    1 UEFI is the Unified Extensible Firmware Interface. It''s responsible for initializing
    the system hardware, locating and loading a boot record, and turning control over
    to the boot record


    2


    Chapter 1 Learning to Love system


    +   **Linux startup**: systemd prepares the host for productive work.


    The Linux startup sequence begins after the kernel has loaded either init or systemd,
    depending upon whether the distribution uses the SystemV or systemd programs start
    and manage all the other processes and are both known as the “mother of all processes”
    on their respective systems.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'It’s important to separate the hardware (BIOS/UEFI) boot from the

    Linux boot from the Linux startup and to explicitly define the demarcation\points
    between them. Understanding these differences and what part

    each plays in getting a Linux system to a state where it can be productive

    makes it possible to manage these processes and better determine where a

    problem is occurring during what most people refer to as “boot.”

    The startup process follows the three-step boot process and brings

    the Linux computer to an operational state in which it is usable for

    productive work. The startup process begins when the kernel transfers

    control of the host to systemd.


    # systemd Controversy


    systemd can evoke a wide range of reactions from SysAdmins and

    others responsible for keeping Linux systems up and running. The fact

    systemd has taken over so many tasks in many Linux systems has

    endered pushback and discord among certain groups of developers

    and SysAdmins.

    SystemV and systemd are two different methods of performing the

    Linux startup sequence. Although most modern Linux distributions use the

    newer systemd for startup, shutdown, and process management, there are

    still some that do not. One reason is that distribution maintainers and

    some SysAdmins prefer the older SystemV method over the newer systemd.

    I think both have advantages.


    3


    Chapter 1 Learning to Love systemd


    # Why I Prefer SystemV


    I prefer SystemV because it is more traditional. Startup is accomplished

    using Bash scripts. After the kernel starts the init program, which is a

    compiled binary, the init program launches the rc.sysinit script, which

    performs many system initialization tasks. After rc.sysinit completes, in it'
  merge: -1
