  md: "# The systemd Journal Service\n\nThe systemd journaling service is implemented\
    \ by the systemd-journalaldaemon. According to the man page:\n\nsystemd-journal\
    \ is a system service that collects and stores\nlogging data. It creates and maintains\
    \ structured, indexed\njournals based on logging information that is received\
    \ from a\nvariety of sources:\n\n+   * Kernel log messages\n* Simple system log\
    \ messages\n* Structured system log messages\n* Standard output and standard error\
    \ of service units.\n* Audit records, originating from the kernel audit subsystem\n\
    \n224\n\nChapter 9 Using systemd JoUrnals\n\nThe daemon will implicitly collect\
    \ numerous metadata fields\for each log messages in a secure manner that can't\
    \ be faked.\nSee systemd,journal-fields(7) for more information about the\ncollected\
    \ metadata.\n\nLog data collected by the journal is primarily text-based but\n\
    can also include binary data where necessary. Individual\nfields making up a log\
    \ record stored in the journal may be up\nto 264-1 bytes in size.\n\nThe capability\
    \ to add entries to the journal in a manner that's\nsecure and can't be faked\
    \ is important. One of the ways that rootnhide their presence is to enter fake\
    \ entries into the logs.\n\n# Configuration\n\nThe systemd journal daemon can\
    \ be configured using the journald.conf\nfile located in the /etc/systemd/ directory.\
    \ For many hosts, this file needs"
  merge: -1
  pgno: 231
- img_proc: true
  md: "no changes because the defaults are quite reasonable. You should look at\n\
    the journal.conf file now if you have not already.\n\nThe most common configuration\
    \ changes you might encounter\nare those that specify the maximum journal file\
    \ size, number of older\njournal files, and the maximum file retention times.\
    \ The primary reason\n making those changes would be to reduce the storage space\
    \ used\nby the journal if you have a small storage device. In a mission-critical\n\
    environment, you may also want to reduce the amount of time between\nsyncing journal\
    \ data stored in RAM memory to the storage device.\n\nThe journald.conf page has\
    \ more details.\n\n225\n\nChapter 9 Using systemd jUrnals\n\n# About that Binary\
    \ Data Format-\n\nOne of the controversies surrounding systemd is the binary format\
    \ in\nwhich the journal contents are stored. Some arguments against systemd\n\
    are based on the systemd journal being stored in a binary format. This\nwould\
    \ seem to be contrary to the Unix/Linux philosophy to use ASCII\nfor data. Those\
    \ who dislike systemd use arguments like the following to\nsupport your viewpoints.\n\
    \nDoug McIlroy, the inventor of pipes, says this:\n\n> This is the Unix Philosophy:\
    \ Write programs that do one thing\nwell. Write programs to work together. Write\
    \ programs to\nhandle text steams, because that is a universal interface.\n— McIlroy,\
    \ in Eric S. Raymond's The Art of Unix\nProgramming\n\nHowever, these arguments\
    \ seem to be based at least a partial\nmisconception because the man page clearly\
    \ states that the \"is\nprimarily text-based\" although it does allow for binary\
    \ data forms. So are\nthe journal files binary or not? Let's explore this question."
