    The combination No-No was most frequent, with two instances, with the second frequent
    being Yes-No, with one instance.\nWell, how is this accomplished? It looks fairly
    complicated, but actually the work is made pretty easy by a trick, exploiting
    the fact that you can present tables in data frame format. Let''s use our cttab
    table again.


    ```

    > as.data.frame(cttab)

    Vote.X Voted.X.Last.Time Freq

    1 No 2

    2 Not Sure No 0

    3 Yes No 1

    4 No Yes 0

    5 Not Sure Yes 1

    6 Yes 1

    ```


    Note that this is not the original data frame from which the table cttab was constructed.
    It is simply different presentation of the table itself. There is one row for
    each combination of the factors, with a Freq column added to show the number of
    instances of each combination. This latter feature makes our task quite easy.


    ```

    # finds the cells in table tbl with the k highest frequencies; handling

    # of ties is undefined

    tabdom <- function(tbl,k){

    # create a Freq column

    a a data frame representation of it

    tbldf <- as.data.frame(tbl)

    # determine the proper positions of the frequencies in a sorted order

    freqorder <- order(tbldf$freq,decreasing=TRUE)

    # rearrange the data frame in order, and take the first k rows

    dom <- tbldf[freqorder,1:k]

    return(dom)}

    ```


