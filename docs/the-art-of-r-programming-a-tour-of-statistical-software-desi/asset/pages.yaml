  md: '# 2.1.3 Matrices and Arrays as Vectors


    Arrays and matrices (and even lists, in a sense) are actually vectors too, as
    you''ll see. They merely have extra class attributes. For example, matrices have
    the number of rows and columns. We''ll discuss them in detail in the next chapter,
    but it''s worth noting now that arrays and matrices are vectors, and that means
    everything we say about vectors applies to them, too. Consider the following example:


    ```

    > m

    [1] [2]

    [1] 1 2

    [2] 3 4

    > m + 10:13

    [1] 11 14

    [2] 14 17

    ```


    The 2-by-2 matrix # is a four-element vector, column-wise, as (1,3,2,4). We then
    added (10,11,12,13) to it, yielding (11,14,14,17), but R remembered we were working
    with matrices and thus gave the 2-by-2 result you see in the example.


    # 2.2 Declarations


    Typically, compiled languages require you to declare variables; that is, warn
    the interpreter/compiler of the variables'' existence before using them. This
    is the case in our earlier C example:


    ```

    int x;

    int y(3);

    ```


    As with most scripting languages (such as Python and Perl), you do not declare
    variables in R. For instance, consider this code:


    ```

    z <- 3

    ```


    This code, with no previous reference to z, is perfectly legal (and-place).

    However, if you reference specific elements of a vector, you must warn R. For
    instance, we wish y to be a two-component vector with values 5 and 12. The following
    will not work:


    ```

    > y[1] <- 5

    > y[2] <- 12

    ```'
