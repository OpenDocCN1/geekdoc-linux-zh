    # 5.4.3 Extended Example: Aids for Learning Chinese Dialects


    Standard Chinese, often referred to as Mandarin outside China, is officially termed
    puthua or guoyu. It is spoken by the vast majority of people in China and many
    ethnic Chinese people outside China, but the dialects, such as Cantonese and Shanghain,
    still enjoy wide usage too. A Chinese businessman in Beijing wanting to do business
    in Hong Kong might find it helpful to learn Cantonese. Similarly, many in Hong
    Kong wish to improve their Mandarin. Let''s see how such a learning process might
    be shortened and how R can help


    The differences between the dialects are sometimes startling. The character for
    "down", 下 is pronounced xia in Mandarin, and wu in Shanghai. Indeed, because of
    these, and differences in grammar as well, many linguists consider these separate
    languages rather than dialects. We will call them fangan ("regional speech"),
    the Chinese term.


    Let''s see how R can help speakers of one fangan learn another one. The key is
    that there are often patterns in the correspondence between the fangans. For instance,
    the initial consonant transformation s -> h in the first paragraph (so hao is
    common), also appearing in characters such as 风 (meaning "top") pronounced feng
    in Mandarin and feng. Note, also the transformation ia -> e for the noninitial
    consonant portions of these pronunciations, which is also common. Knowing transformations
    could speed up the learning curve considerably for learners of Cantonese, which
    is what we will illustrate


    We havent mentioned the tones yet. All Chinese are tonal, and sometimes there
    are patterns as well, potentially providing further learning aids. However, this
    avenue will not be pursued. You''ll see that our code needs to use some of the
    tones, but we will not attempt to analyze how tones transform from one fangan
    to another. For simplicity, we will not consider characters beginning with vowels,
    characters that have more than one reading,less characters, and other refinements.


    Though the initial consonant in x in Mandarin often maps to h, as seen previously,
    it also maps to s, and other consonants. For example, the character xie 谢谢 in
    the Mandarin term xie ("thank you") is pronounced je in Cantonese. Here, there
    is an x -> transformation over the consonant


    It would be very helpful for the learner to have a list of transformations and
    their frequencies of occurrence. This a job made for R! The function pinyinsound(),
    shown bit later in the chapter, does exactly this. It relies on some support functions,
    also to be presented shortly.'
