    - min() and max(): Minimum value and maximum value within a vector

    - which_min() and which_max(): Index of the minimal element and maximal element
    of a vector

    - pmin() and pmax(): Element-wise minima and maxima of several vectors

    - sum() and prod(): Sum and product of the elements of a vector

    - cumsum() and cumprod(): Cumulative sum and product of the elements of a vector

    - round(), floor(), and ceil(): Round to the closest integer, to the closest below,
    and to the closest above

    - factorial(): Factor function


    # 8.1.1 Extended Example: Calculating a Probability


    As our first, we''ll work through calculating a probability using the prod() function.
    Suppose we have $n$ independent events, and the $i^{th}$ event has the probability
    $p_i$, of occurring. What is the probability of exactly one of these events occurring?

    Suppose that $n=3$ and our events are named A, B, and C. Then we break down the
    computation as follows:


    > $$P(\text{exactly one event occurs}) =\

    P(A\text{ and not B and not C}) = +\

    P(B\text{ and not A and not C}) = +\

    P(C\text{ and not A and not B}) =$$


    P(A and not B and not C) would be $p_A(1-p_B)(1-p_C)$, and so on. For general
    $n$, that is calculated as:


    > $$$\sum_{i=1}^{n} p_i(1-p_{i-1})...(1-p_{i-1})(1-p_{i+1})...(1-p_n)$$$


    (The $i^{th}$ term inside sum is the probability that event $i$ occurs and is
    contained in the others do not occur).

    Here''s code to compute this, with our probabilities $p_i$, contained in the vector
    p:


    ```

    exactlyone <- function(p) {

    top <- 1 - p

    tot <- 0.0

    for (i in 1:length(p)) {

    tot <- tot + p[i] * prod(notp[-i])

    }

    return(tot)

    }

    ```'
