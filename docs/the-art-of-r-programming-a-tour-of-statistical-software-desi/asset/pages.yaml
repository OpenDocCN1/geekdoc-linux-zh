  md: "# 8.6 Simulation Programming in R\n\nOne of the most common uses of R is simulation.\
    \ Let's see what kinds of tools R has available for this application.\n\n# 8.6.1\
    \ Built-In-Random Variate Generators\n\nAs mentioned, R functions to generate\
    \ variates from a number of different distributions. For example, rbinom() generates\
    \ binomial or Bernoulli variates.\\¹\n\nLet's say we want to find the probability\
    \ of getting at least four heads out of five tosses of a coin to find analytically,\
    \ but a handy example). Here's how we can do this:\n\n```\nx <- rbinom(100000,5,0.5)\n\
    mean(x >= 4)\n[1] 0.18829\n```\n\nFirst, we generate 100,000 variates from a binomial\
    \ distribution with five trials and a success probability of 0.5. We then determine\
    \ which of them has a value 4 or 5, resulting in a Boolean vector of the same\
    \ length as x. The TRUE and FALSE values in that vector are treated as 1 and 0\
    \ by mean(), giving us our estimated probability (the average of a bunch of 1s\
    \ and 0s is the probability of is).\n\nOther functions include rnorm() for the\
    \ normal distribution, rexp() for the exponential, runif() for the uniform, rgamma()\
    \ for the gamma, rpois() for the Poisson, and so on.\n\nHere is another simple\
    \ example, which finds E[max(X,Y)], the expected value of the maximum of independent\
    \ N(0,1) random variables X and Y:\n\n```\nsum <- 0\nreps <- 100000\nfor (i in\
    \ 1:reps) {\n  xy <- rnorm(2) # generate 2 N(0,1)s\n  sum <- sum + max(xy)\n}\n\
    nprint(sum/reps)\n```\n\nWe generate 100,000 pairs, found the maximum for each,\
    \ and averaged the maxima to obtain our estimated value.\n\nThe preceding code,\
    \ with an explicit loop, may be clearer, but as before, if we are willing to use\
    \ some more memory, we can do this more compactly.\n\n> ¹A sequence of independent\
    \ 0- and 1-valued random variables with the same probability of 1 for each is\
    \ called Bernoulli."
