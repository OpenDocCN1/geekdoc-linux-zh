    # # FACTORS AND TABLES


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_146_0.png)


    Factors form the basis for many of R''s powerful operations, including many of
    those performed on tabular data. The motivation for factors comes from the notion
    of nominal, or categorical, variables in statistics. These values are nonnumerical
    in nature, corresponding to categories such as Democrat, Republican, and Unaffiliated,
    although they may be coded using numbers.


    In this chapter, we''ll begin by looking the extra information contained in factors
    and then focus on the functions used with factors. We''ll explore tables and common
    table operations.


    # ## 6.1 Factors and Levels


    An R factor might be viewed simply as a vector with a bit more information added
    (though, as seen below, it''s different from this internally). That extra information
    consists of a record of the distinct values in that vector, called levels. Here''s
    an example:


    ```

    > x <- c(5,12,13,12)

    > xf <- factor(x)

    ```'
