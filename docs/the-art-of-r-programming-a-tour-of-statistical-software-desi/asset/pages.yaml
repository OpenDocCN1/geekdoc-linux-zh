  md: "# 10.2.1 Reading a Data Frame or Matrix from a File\n\nIn Section 5.1.2, we\
    \ discussed the use of the function read.table() to read in a data frame. As a\
    \ quick review, suppose the file z looks like this:\n\n```\nname age\nJohn 25\n\
    Mary 28\nJim 19\n```\n\nThe first line contains an optional header, specifying\
    \ column names. We could read the file this way:\n\n```\n> z <- read.table(\"\
    z\",header=TRUE)\n> z\name age\n1 John 25\n2 Mary 28\n3 Jim 19\n```\n\nNote that\
    \ scan() would not work here, because our file has a mixture of numeric and character\
    \ data (and a header).\nThere appears to be no direct way of reading a matrix\
    \ from a file, but it can be done easily with other tools. A simple quick way\
    \ is to use scan() to read in the matrix by row. You use the by option in the\
    \ matrix() to indicate that you are defining the elements of the matrix in a row-wise,\
    \ rather than column-wise, manner.\nFor instance, say the file x contains a 5-by-3\
    \ matrix, stored row-wise:\n\n```\n1 0 1\n1 1 1\n1 1 0\n1 1 0\n0 0 1\n```\n\n\
    We can read it into a matrix this way:\n\n```\n> x <- matrix(scan(\"x\"),nrow=5,byrow=TRUE)\n\
    ```\n\nThis is for quick, one-time operations, but for generality, you can use\
    \ read.table(), which returns a data frame, and then convert it as.matrix(). Here\
    \ is a general method:\n\n```\nread.matrix <- function(filename) {\n  as.matrix(read.table(filename))\n\
    }\n```"
