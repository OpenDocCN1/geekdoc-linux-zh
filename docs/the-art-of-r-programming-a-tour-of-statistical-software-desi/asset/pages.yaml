  md: '# 9


    # OBJECT-ORIENTED PROGRAMMING


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_232_0.png)


    Many programmers believe that object-oriented programming (OOP) makes for clearer,
    more reusable code. Though very different from the familiar OOP languages like
    C++, Java, and Python, R is very much OOP in outlook.


    The following themes are key to R:


    +   - Everything you touch in R—ranging from numbers to character strings to matrices—is
    an object.

    - R promotes encapsulation, which is packaging separate but related data items
    into one instance. Encapsulation helps you keep track of related variables, enhancing
    clarity.

    - R classes polymorphic, which means that the same function leads to different
    operations for objects of different classes. For instance, a call to print() tailored
    to an object of a certain class triggers a call to a print function tailored to
    that class.

    - R allows inheritance, which allows extending a given class to a more specialized
    class.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'This chapter covers OOP in R. We''ll discuss programming in the two types of
    classes, S3 and S4, and then present a useful OOP-related R utilities.


    # 9.1 S3 Classes


    The original R structure for classes, known as S3, is still the dominant class
    paradigm in R use today. Most of R''s own built-in classes are of the S3 type.


    An S3 class consists of a list, with a class name attribute and dispatch capability
    added. The latter enables the use of generic functions, as we saw in Chapter 1.
    S4 classes were developed later, with goal of adding safety that you cannot accidentally
    access a class component that is not already in existence.


    # 9.1.1 S3 Generic Functions


    As mentioned, R is polymorphic, meaning that the same function can lead to different
    operations for different classes. You can apply plot(), for example, to many different
    types of objects, getting a different type of plot for each. The same is true
    for print(), summary(), and many other functions.


    In this manner, we write a uniform interface to different classes. If you write
    code that allows plot operations, polymorphism may allow you to write your program
    without worrying about the various types of objects that might be plotted.


    In addition, polymorphism certainly makes things easier to remember for the user
    and makes it fun to explore new library functions and associated classes. If a
    new function is to use, just running plot() on the function: it will likely work.
    From a programmer''s viewpoint, polymorphism allows writing fairly generic code,
    without worrying what type of object is being manipulated, because the underlying
    mechanisms take care of that.


    The functions that work with polymorphism, such as plot() and print(), are known
    as generic functions. When a generic function is called, R will then dispatch
    it to the proper class method, meaning that it will reroute the call to a function
    defined for the object''s class.


    # 9.1.2 Example: OOP in the lm Linear Model Function


    As an example, let''s look at a simple regression analysis using R''s lm() function.
    First, let''s see what lm() does:


    ```

    ? lm

    ```


    The output of this query will tell you, among other things, that this function
    returns an object of class "lm".'
