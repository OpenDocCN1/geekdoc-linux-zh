  md: "The central interest in Markov modeling is usually the long-run distribution,\
    \ meaning the long-run proportions of the time we are in each state. In our coin-toss\
    \ game, we can use the code we'll develop here to calculate that distribution,\
    \ which turns out to have us at 0, 1, and 2 in proportions 57.1%, 28.6%, and 14.3%\
    \ of the time. We win the dollar if we are in state 2 and toss a head, with 0.143\
    \ × 0.5 = 0.071 of our tosses wins.\n\nSince R vector and indices start at 1 rather\
    \ than 0, it will be convenient to label our states here as 1, 2, and 3 rather\
    \ than 0, 1, and 2. For example, state 3 means that we currently have two consecutive\
    \ heads.\n\nLet $p_{ij}$ denote the transition probability of moving from state\
    \ $i$ to state $j$ during a time step. In the game example, $p_{23} = 0.5$, reflecting\
    \ the fact that with probability 1/2, we toss a head and then move having one\
    \ consecutive head to 2. On the other hand, if we toss a tail while we are in\
    \ state 2, we go to state 1, meaning 0 consecutive heads\n\nWe are interested\
    \ in calculating the vector $\\pi = (\\pi_1, \\dots, \\pi_s)$, where $\\pi_i$\
    \ is the long-run proportion of time spent at state $i$, over all states $i$.\
    \ Let $P$ denote the transition matrix whose $j^{th}$ row, column element is $p_{ij}$.\
    \ Then it can be shown that $\\pi$ must satisfy Equation 8.4.\n\n$$\\pi = \\pi\
    \ P$$\n\n$$(I - P^T)\\pi = 0$$\n\nHere $I$ is the identity matrix and $P^T$ denotes\
    \ the transpose of $P$.\nAny single one of the systems in Equation 8.5 is redundant.\
    \ We thus eliminate one of them, by removing the last row of $I-P$ in Equation\
    \ 8.5. That also means removing the last $0$ in the $0$ vector on the right-hand\
    \ side of Equation 8.5.\n\nBut note that there is also the constraint in Equation\
    \ 8.6.\n\n$$\\sum_{i} \\pi_i = 1$$\n\nIn matrix terms, this is follows:\n\n$$$I_n^T\\\
    pi = 1$$\n\nwhere $1_n$ is a vector of $n$ 1.\nIn the modified version of Equation\
    \ 8.5, we replace the removed row with a row of all 1s, on the right-hand side,\
    \ replace the removed 0 with 1. We can then solve the system.\n\nAll this can\
    \ be computed with R's solve() function, as follows:\n\n```\nfindpi <- function(p)\
    \ {\n  n <- nrow(p)\n  imp <- diag(n) - t(p)\n```\n\n200 Chapter 8"
  merge: -1
