  md: "# 7.1.1 Loops\n\nIn Section 1.3, we defined the oddcount() function. In function,\
    \ the following line should have been instantly recognized by Python programmers:\n\
    \n```\nfor (n in x) {\n    it means there will be one iteration of the loop for\
    \ each component\nthe vector, with n taking on the values of those components--in\
    \ the first\niteration, n = x[1]; in the second iteration, n = x[2]; and so on.\
    \ For example,\nthe code uses this structure to output the square of every element\n\
    in a vector:\n```\n\n```\n> x <- {5,12,13}\n> for (n in x) print(n*2)\n[1] 25\n\
    [1] 144\n[1] 169\n```\n\nC-style looping with while and repeat is also available,\
    \ complete with break, a statement that causes control to leave the loop. Here\
    \ is an example that uses all three:\n\n```\n> i <- 1\n> while (i <= 10) <- i+4\n\
    > i\n[1] 13\n>\n> i <- 1\n> while(TRUE) { # similar loop above\n+ i <- i+4\n+\
    \ if (i > 10) break\n+}\n> i\n[1] 13\n>\n> i <- 1\n> repeat { # again similar\n\
    + i <- i+4\n+ if (i > 10) break\n+}\n> i\n[1] 13\n```\n\nIn the first code snippet,\
    \ the variable i took on the values 1, 5, 9, and 13 as the loop went through its\
    \ iterations. In that last case, the condition i <= 10 failed, so the break took\
    \ held and we left the loop."
