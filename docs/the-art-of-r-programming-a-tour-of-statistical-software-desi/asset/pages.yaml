  md: 'another of 20 characters. From A''s point of view, that''s two lines, but to
    TCP/IP, it''s just 28 characters of a yet incomplete message. Splitting that long
    message back into lines can take a bit of doing. R provides various functions
    for this purpose, including the following:


    +   - readLines() and writeLines(): These allow you to program as if TCP/IP were
    sending messages by line, even though this is not actually the case. If your application
    is naturally viewed in terms of lines, these two functions can handle quite easily.

    - serialize() and deserialize(): You can use these to send R objects, as a matrix
    or the output of a call to a statistical function. The object is converted to
    character string by the sender and then converted back to the original object
    at the receiver.

    - readIn() and writeBin(): These are for sending data in binary form.

    (Recall the comment on terminology at the beginning of Section 10.2.2.)


    Each of these functions operates on R connections, as you will see in the next
    example.

    It''s important to choose the right function for each job. If you have a long
    vector, using serialize() and deserialize() may be more convenient but far time-consuming.
    This is not only because numbers must be converted to and from character representations
    also because the character representation is typically much longer, which means
    greater transfer time.


    +   - socketConnection(): This establishes an R connection via sockets. You specify
    the port number in the argument part, and state whether a server or client is
    to be connected, by setting the argument to TRUE or FALSE, respectively. In the
    client case, you must also supply the server''s IP address in the argument part.

    - socketConnect(): This is useful when a server is connected to multiple clients.
    In its main argument, socketlist is a list of connections, and its return value
    is the subset of connections that have ready data for the server to read.


    # 10.3.3 Extended Example: Implementing Parallel R


    Some statistical analyses have long runs, so naturally has been a bit of interest
    in "parallel R," where several R processes cooperate on a given task. Another
    reason to "go parallel" is memory limited: If one does not have enough memory
    for the task at hand, it may help to pool the memories of several machines in
    some way. Chapter 16 gives an introduction to this important topic.


    Sockets play a key role in parallel R packages. The cooperating R processes could
    be either on the same machine or on separate machines. In the latter case (and
    even the former), a natural approach to implementing parallelism is to use R sockets.
    This is one of the choices in the snow package'
