    One of the most effective ways to achieve speed in R code is to use operations
    that are vectorized, meaning that a function applied to a vector is actually applied
    individually to each element.


    # 2.6.1 Vector In, Vector Out


    You examples of vectorized functions earlier in the chapter, with the + and operators.
    Another example is >.


    ```

    > u <- c(5,2,8)

    > v <- c(1,3,9)

    > u > v

    [1] TRUE FALSE FALSE

    ```


    Here, the function was applied to u[1] and v[1], resulting in TRUE, then to u[2]
    and v[2], resulting in FALSE, and so on.

    A key point is that if an R function uses operations, it, too, is enabling a potential
    speedup. Here is an example:


    ```

    > w <- function(x) return(x+1)

    > w(u)

    [1] 6 3

    ```


    Here, w() uses +, which is vectorized, so w() is vectorized as well. You can see,
    there is an unlimited number of vectorized functions, as complex ones are built
    up from simpler ones.

    Note that even the transcendental functions—square roots, logs, trig functions,
    and so on—are vectorized.


    ```

    > sqrt(1:9)

    [1] 1.000000 1.414214 1.732051 2.000000 2.236068 2.449490 2.645751 2.828427 3.000000

    ```


    This applies to many other built-in functions. For instance, let''s apply the
    function for rounding to the nearest integer in an example vector:


    ```

    > y <- c(1,2,3,9,0,4)

    > z <- round(y)

    > z

    [1] 1 2 3 9 0 4

    ```


    The point is that the round() function is applied individually to each element
    in the vector y. And remember that scalars are really single-element vectors,
    so the "ordinary" use of round() on just one number is merely a special case.'
