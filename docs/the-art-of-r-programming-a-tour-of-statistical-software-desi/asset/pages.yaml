    | 4 | 4.3 | 4 |

    | 2.3 | 0 | 3.3 |


    The numbers correspond to letter grades on a four-point scale: 3.5 is a B+, for
    instance. Each line contains the data for one student, consisting of the midterm
    examination grade, final examination grade, and average quiz grade. It would be
    interesting to see how the midterm and quiz grades predict the student''s grade
    on the final examination.


    Let''s first read in the data:


    ```

