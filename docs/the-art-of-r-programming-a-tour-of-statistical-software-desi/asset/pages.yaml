  md: "# 5.2.5 Extended Engineers: A Salary Study\n\nIn a study of engineers and programmers,\
    \ I considered the question, “How many of these workers are the best and the brightest—that\
    \ is, people of extraordinary ability?” (Some of the details have been changed\
    \ here.)\nThe government data I had available was limited. One (admittedly imperfect\
    \ way to determine whether a worker is of extraordinary ability is to look at\
    \ the actual salary to the government prevailing wage for that job and location.\
    \ If that ratio is substantially higher than 1.0, you can reasonably assume that\
    \ this worker has a high level of talent.\nI used R to perform and analyze the\
    \ data and will present excerpts of my preparation code. First, I read in the\
    \ data file:\n\n```\nall2006 <- read.csv(\"2006.csv\",header=TRUE,as.is=TRUE)\n\
    ```\n\nThe function read.csv() is essentially identical to read.table() except\
    \ that the input data is in the CSV format exported by spreadsheets, which the\
    \ data was set by the US Department of Labor (DOL). The as.argument is the name\
    \ of stringAsFactors, which you saw earlier in Section 5.1. Setting as to TRUE\
    \ is simply an alternate way to achieve stringAsFactors=FALSE.\nAt this point,\
    \ I had a data frame, all2006, consisting of all the data for the year 2006. When\
    \ I did some following:\n\n```\nall2006 <- all2006[all2006$Year, ] # exclude high-wagers\n\
    all2006 <- all2006[all2006$Offered > 20000,] # exclude weird cases\nall2006 <-\
    \ all2006[$Prevailing_Wage_Amount > 200,] # exclude highly priv wage\n```\n\n\
    These operations are typical data cleaning. Most large data sets contain some\
    \ outlandish values—some are obvious errors, others use different systems—and\
    \ so on. I needed to remedy this situation before doing any analysis.\nI also\
    \ needed to create a new column for the ratio between actual wage and prevailing\
    \ wage:\n\n```\nall2006$rat <- all2006$Offered_From / all2006$Prevailing_Amount\n\
    ```\n\nSince I knew I would be calculating the median in this new column for many\
    \ subsets of the data, I defined a function to do the work:\n\n```\nmedrat <-\
    \ function(dataframe) {\n  return(median(dataframe$rat, na.rm=TRUE))\n}\n```\n\
    \nNote the to exclude NA values, which are common in government data sets."
