  md: 'And yet, powers2() still contains a loop. Can we do better? It would seem that
    this setting is perfect for outer(), whose call form is


    outer(X,FUN)


    This call applies the function FUN() to all possible pairs of elements of X and
    elements of Y. The default value of FUN is multiplication. Here, we can write:


    ```

    powers3 <- function(x,dg) return(outer(x,1:dg,"^"))

    ```


    For each combination of x and element of dg (resulting in length(x) × dg combinations
    in, outer()) calls the exponentiation function ^ on combination, placing the results
    in a length(x) × dg matrix. This is exactly what we need, and as a bonus, the
    code is quite compact. But the code faster?


    ```

    > system.time(powers3(x,8))

    user system elapsed

    1.336 0.204 1.747

