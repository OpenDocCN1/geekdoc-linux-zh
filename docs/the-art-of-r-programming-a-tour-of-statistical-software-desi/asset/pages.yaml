  md: 'Here, apply() temporarily breaks u into subvectors, as you saw earlier, and
    applies the length() function to each subvector. (Note that this is independent
    of what''s in u. Our focus now is purely on the factors.) Those subvector lengths
    are the counts of the occurrences of each of the 3 x 2=6 combinations of the two
    factors. For instance, 5 occurred with "a" and not all with "bc"; hence the 2
    and NA in the first row of the output. In statistics, this is called a contingency
    table.


    There is one problem in this example: the NA value, meaning that no cases did
    the first factor have level 5 and the second have level "bc". The table() function
    creates contingency correctly.


    ```

    > table(fl)

    fl.2

    fl.1 bc

    5 2 1

    12 1 1

    13 1 0

    ```


    The first argument in a call to table() is either a factor or a list of factors.
    The two factors here were (5,12,13,12,13,5,13) and ("a","bc","a","a","bc","a\
    In this case, an object that is interpretable as a factor is counted as one.


    Typically a data frame serves the table() argument. Suppose for the file ct.dat
    consists of election-polling data, in which candidate X is running for reelection.
    The ct.dat file looks like this:


    > "Vote for X "Voted for X Last Time"

    "Yes" "Yes"

    "Yes" "No"

    "No" "No"

    "Not Sure" "Yes"

    "No" "No"


    In the usual statistical fashion, each row in this file represents one subject
    under study. In this case, we have asked five people the two questions:


    +   - Do you plan to vote for candidate X?

    - Did you vote for X in the last election?


    This gives five rows in the data file.

    Let''s read in the file:


    ```

    > ct <- read.table("ct.dat",header=T)

    > ct

    ```'
