  md: 'Although you can invoke R through GDB from a shell command line (see Section
    15.1.4), for our purposes here, I suggest using separate windows for R and GDB.
    Here''s the procedure:


    +   1. Start R in one window, as usual.


    +   2. In another window, determine the ID number of your R process. In UNIX family
    systems, for instance, this is obtained by something ps -a.


    +   3. In the third window, submit GDB''s attach command with the R process number.


    +   4. Submit the `continue` command to GDB.


    You can set breakpoints in the R source code either before continuing or by interrupting
    GDB later with CTRL-C. See Section 15.1.4 for details of debugging C code called
    from R. If, on the other hand, you wish to use GDB to explore the R source code,
    note the following.


    The R source code is dominated by S expression pointers (SEXPs), which are pointers
    to C structs that contain an R variable value, type, and so on. You can use the
    internal function `Rf_PrintValue(s)` to inspect SEXP values. For example, if the
    SEXP is named s, then in GDB, type this:


    ```

    call Rf_PrintValue(s)

    ```


    This prints the value.'
