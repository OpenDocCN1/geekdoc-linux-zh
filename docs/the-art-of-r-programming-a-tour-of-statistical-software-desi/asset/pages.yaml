    \ cost of only one memory-allocation operation.\n\n```\n# forms matrix of powers\
    \ of the vector x, through degree dg\npowers2 <- function(x,dg) {\n  pw <- matrix(nrow=length(x),ncol=dg)\n\
    \  prod <- x # current product\n  pw[1,] <- prod\n  for (i in 2:dg) {\n    prod\
    \ <- prod * x\n    pw[i,] <- prod\n  }\n  return(pw)\n}\n```\n\nAnd indeed, powers2()\
    \ is a lot faster.\n\n```\n> x <- runif(1000000)\n> system.time(powers1(x,8))\n\
