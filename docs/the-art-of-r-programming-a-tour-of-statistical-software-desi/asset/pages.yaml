  md: '# 14.5 Byte Code Compilation


    Starting with version 2.13, R has included a byte compiler, which you can use
    to try and speed up your code. Consider our example from Section 14.2.1. As a
    trivial example, we showed


    ```

    z <- x + y

    ```


    was much faster than


    ```

    for (i in 1:length(x)) z[i] <- x[i] + y[i]

    ```


    Again, that was obvious, but just to get an idea of how byte code compilation
    works, let''s give it a try:


    ```

    > library(compiler)

    > f <- compilefun(for (i in 1:length(x)) z[i] << x[i] + y[i])

    > cf <- system.time(cf)

    user system elapsed

    0.845 0.003 0.848

    ```


    We created a new function, cf(), from the original f(). The new code''s run was
    0.848 seconds, much faster than the 8.175 seconds the non-compiled version took.
    Granted, is not as fast as the straightforward vectorized code, but it is clear
    that byte code compilation has potential. You should try it whenever you need
    faster code.


    # 14.6 Oh No, the Data Doesn''t Fit into Memory!


    As mentioned earlier, all objects in a session are stored in memory. R places
    a limit of 2^31 bytes on the size of any object, regardless of size (32-bit versus
    64-bit) and the amount of RAM in your machine. However, you really should not
    consider this as an obstacle. With a little extra care, applications that have
    large memory requirements can be handled well in R. Some common approaches are
    chunking and using R packages for memory management.


    # 14.6.1 Chunking


    One option involving no extra R packages at all is to read in your data from a
    disk chunk one at a time. For, suppose that your goal is to find means or proportions
    of some variables. We can use the skip argument in read.table().


    Say our data has 1,000,000 records and we divide them into 10 chunks (or—whatever
    is needed to cut the data down to a size it fits in memory). Then we set skip
    = 0 on our first chunk, set skip = 10000 the second time, and so on. Each time
    we read in a chunk, we calculate'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'the counts or totals for that chunk and record them. After reading all the
    chunks, we add up all the counts or totals in order to calculate our grand means
    or proportions.


    As another example, suppose we are performing a statistical operation, calculating
    principle components, which in we have a huge number of rows—that is, a huge number
    of observations—but the number of variables is manageable. Again, chunking could
    be the solution. We apply the statistical operation to each chunk and then average
    the results over all the chunks. My mathematical research shows that the resulting
    estimators are statistically efficient in a wide class of statistical methods.


    # 14.6.2 Using R Packages for Memory Management


    Again looking at a bit more sophistication, there are alternatives for accommodating
    large memory requirements in the form of some specialized R packages.


    One such package is bigSQL, an interface to SQL databases. Using it requires some
    database expertise, but this package provides a much more efficient and convenient
    way to handle large data. The idea is to have the database do its variable/case
    selection operations for you at the database and then return the resulting data
    as it is produced by SQL. Since the latter will typically be smaller than the
    overall data, you will likely be able to circumvent R''s memory restriction.


    Another package is biglm, which does regression and generalized linear-model analysis
    on big data. It also does chunking but in a different manner: Each chunk is used
    to update the running totals of sums for the needed regression analysis and then
    decoded.


    Finally, some packages do their storage independent of R and can deal with very
    large data sets. The two most commonly used today are ff and bigmemory. The former
    sidesteps memory constraints by storing data on disk instead of memory, essentially
    transparently to the programmer. The highly versatile bigmemory does the same,
    but it can store data not only on disk but also in the machine''s main memory,
    which is ideal for multicore machines.'
