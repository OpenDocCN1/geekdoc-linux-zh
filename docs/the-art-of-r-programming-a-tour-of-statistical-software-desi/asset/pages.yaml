    # 11.2 Regular Expressions


    When dealing with string-manipulation functions in programming languages, the
    notion of regular expressions sometimes arises. In R, you must pay attention to
    this point when using the string functions grep(), grepl(), regexpr(), sub(),
    gsub(), and strsplit().


    A regular expression is a kind of wild card. The expression "[au]" refers to any
    classes of characters. For example, the string that contains any of the letters
    a or u. You could use this like:


    ```

    > regexpr("[au]",c"Equator","North Pole","South Pole"

    [[1]]

    [1] 1 3

    ```


    This reports that elements 1 and 3 of "Equator,"North Pole,"South Pole"—that is,
    "Equator" and "South Pole"—contain either an a or a u. A period (.) represents
    any single character. Here is an example of using it:


    ```

    > regexpr("o.e",c"Equator","North Pole","South Pole"

    [[1]]

    [1] 2 3

    ```


    This searches for three-character strings in which an o is followed by any single
    character, which is in turn followed by an e. Here is an example of the use of
    two periods to represent any pair of characters:


    ```

    > regexpr("N..t",c"Equator","North Pole","South Pole"

    [[1]]

    [1] 2

    ```


    Here we search for four-letter strings consisting of an N, followed by any pair
    of characters, followed by a t. A period is an example of a metachar which is
    a character that is not to be taken literally. For example, if a period appears
    in the first argument of grep(), it doesn''t actually mean period; it means any
    character.


    254 Chapter 1'
