    # 6.4 Other Factor- and Table-Related Functions


    R includes a number of other functions that are handy for working with tables
    and factors. We''ll discuss two of them here: aggregate() and cut().


    NOTE Hadley Wickham''s reshape package "lets you flexibly restructure and aggregate
    data using two functions: melt and cast." This package may take a while to learn,
    but it is extremely powerful. Its dplyr package is also quite versatile. You can
    download both packages from R CRAN repository. See Appendix B for details about
    downloading and installing packages.


    # 6.4.1 The aggregate() Function


    The aggregate() function calls apply() once for each variable in a group. For
    example, in the abalone data, we could find the median of each variable, which
    is broken by gender, as follows:


    ```

    aggregate(aba[,-1],list(absGender),median)

    Group.1 Length Diameter Height WhoOlt Shuckeded Viscwt Shell Rings

    1 F 0.590 0.465 0.160 1.03850 0.44050 0.22400 0.295 10

    2 I 0.435 0.335 0.110 0.38400 0.16975 0.06805 0.113 8

    3 M 0.580 0.455 0.155 0.97375 0.42175 0.02100 0.276 10

    ```


    The first argument, aba[,-1], is the entire data frame except for the first column,
    which is gender itself. The second argument must be a list, which is gender factor
    as before. Finally, the third argument tells R to compute the median on each column
    in each of the data frames generated by the subgrouping to our factors. There
    are three subgroups in our example and thus three rows in the output of aggregate().


    # 6.4.2 The cut() Function


    A common way to generate factors, especially for tables, is the cut() function.
    You give it a data vector x and a set of bins defined by a vector b. The function
    then determines which bin each of the elements of x falls into.

    The Following is the form of the code we''ll use:


    ```

    y <- cut(x,b,labels=FALSE)

    ```'
