  md: 'Here''s a more subtle example:


    ```

    > x

    [,1] [,2]

    [1,] 1 4

    [2,] 2 5

    [3,] 3 6

    > x<<(1,2)

    [,1] [,2]

    [1,] 2 6

    [2,] 4 6

    [3,] 4 8

    ```


    Again, keep in mind that matrices are actually long vectors. Here, x as a 3-by-2
    matrix, is also a six-element vector, which in R is stored column by column. In
    other words, in terms of storage, x is the same as c(1,2,3,4,5,6). We added a
    two-element vector to this six-element, so our added vector needed to be repeated
    to make six elements. In other words, we were essentially doing this:


    ```

    x + c(1,2,1,2,1,2)

    ```


    Not only, but c(1,2,1,2,1,2) was also changed from a vector to a matrix having
    the same shape as x before the addition took place:


    ```

    1 2

    2 1

    1 2

    ```


    Thus, the net result was to compute the:


    ```

    \begin{pmatrix} 1 & 4 \ 2 & 5 \ 3 & 6 \end{pmatrix} + \begin{pmatrix} 1 & 2 \
    2 & 1 \ 1 & 2 \end{pmatrix}

    ```


    # 2.4 Common Vector Operations


