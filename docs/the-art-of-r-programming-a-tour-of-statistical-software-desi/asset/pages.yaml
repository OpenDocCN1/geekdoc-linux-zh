- img_proc: true
  md: "possible—and sometimes desirable from the point of view of the encapsulation\
    \ of object-oriented programming—to define a function within a function; we are\
    \ simply creating an object, which we can do anywhere.\n\nHere we have h() being\
    \ local to f(), just like d. In such a situation, it makes sense for scope to\
    \ be hierarchical. R is set up so that d, which is local to f(), is global to\
    \ h(). The same is true for y, as arguments are considered locals in R.\n\nThe\
    \ hierarchical nature of scope implies that w is global to f(), it is global to\
    \ h(). We indeed, we can do w within h().\n\nIn environments then, h()'s environment\
    \ consists of whatever objects are defined at the time h() comes into existence;\
    \ that is, at the time that assignment is executed:\n\n```\nh <- function() {\n\
    \  return(d(wy))\n}\n```\n\nIf f() is called multiple times, h() will come into\
    \ existence multiple times, going out of existence each time f() returns.\n\n\
    What, then, be in f()'s environment? Well, at the time f is created, there are\
    \ the objects d and y created within f(), plus f()'s environment. In other words,\
    \ if one function is defined within another, then the inner function's environment\
    \ consists of the outer one, plus whatever has been created so far within the\
    \ outer one. With multiple nesting of functions, you have a nested sequence of\
    \ larger and larger environments, with the \"root\" consisting of the top-level\
    \ objects.\n\nLet's try out the code:\n\n```\n> f(2)\n[1] 112\n```\n\nWhat happened?\
    \ The call f(2) resulted in setting the local variable d to 8, followed by call\
    \ h(). The latter evaluated d*(wy)—that is, 8*(12+2)—giving us 112.\n\nNote carefully\
    \ the role of w. The R interpreter found that there was no local variable of that\
    \ name, so it ascended to the next higher level—in this case, the top level—where\
    \ it found a variable w with value 12.\nKeep in mind that h() is local to f()\
    \ and invisible at the top level.\n\n```\n> h\nError: object 'h' not found\n```\n\
    \nIt's possible (though not desirable) to deliberately allow name conflicts in\
    \ this hierarchy. In our example, for instance, we could have a variable d within\
    \ h(), conflicting with the one in f(). In such a situation, the innermost environment\
