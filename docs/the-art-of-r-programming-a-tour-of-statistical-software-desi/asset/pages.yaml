    # 7.10.1 What''s Considered a Replacement Function?


    Any assignment statement in which the left side is not just an identifier (meaning
    a variable name) is considered a replacement function. When encountering this:


    ```

    g(u) <- v

    ```


    R will try to execute this:


    ```

    u <- "gc-"(u,value=v)

    ```


    Note the "try" in the preceding sentence. The statement will fail if you have
    not previously defined g(-). Note that the replacement function has one more argument
    than the original function g(), a named argument value, for reasons explained
    in this section.


    In earlier chapters, you''ve seen this innocent-looking statement:


    ```

    x[3] <- 8

    ```


    The left side is not a variable name, so it must be a replacement function, and
    indeed it is, as follows.


    Subscripting operations are functions. The function "[()" is for reading vector
    elements, and "<-()" is used to write. Here''s an example:


    ```

    x <- c(8,88,5,12,13)

    ```


    ```

    > x

    ```'
