  md: '# 1


    # GETTING STARTED


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_26_0.png)


    As detailed in the introduction, R is an extremely versatile open source programming
    language for statistics and data science. It is widely used in every field where
    there data—business, industry, government, medicine, academia, and so on.


    In this chapter, you''ll get a quick introduction to R—how to invoke it, what
    it can do, and what files it uses. We''ll cover just enough to give you the basics
    you need to work through the examples in the next few chapters, where the details
    will be presented.


    R may already be installed on your system, if your employer or university has
    made it available to users. If not, see Appendix A. for installation instructions.


    # 1.1 How to Run R


    R operates in two modes: interactive and batch. The one typically used is interactive
    mode. In this mode, you type in commands, R displays results, you type in more
    commands, and so on. On the other hand, batch mode does'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'not require interaction with the user. It''s useful for production jobs, such
    as when a program must be run periodically, say once per day, because you can
    automate the process.


    # 1.1.1 Interactive Mode


    On a Linux or Mac system, start an R session by typing R on the command line in
    a terminal. On a Windows machine, start R by clicking the R icon.


    The result is a greeting and the R prompt, which is the > sign. The screen will
    look something like this:


    ```

    R version 2.10.0 (2009-10-26)

    Copyright (C) 2009 The R Foundation for Statistical Computing

    ISBN 3-900051-07-0

    ```


    ```

    Type ''demo()'' for some demos, ''help()'' for on-line help, or ''help.start()''
    for an HTML browser interface to help.

    Type ''q()'' to quit R.

    ```


    You can execute R commands. The window in which all this appears is the R console.

    As a quick example, consider a standard normal distribution—that is, with mean
    0 and variance 1. If a random variable X has that distribution, then its values
    are centered around 0, some positive, some averaging to 0. Form a new random variable
    Y = |X|. Since we''ve taken the absolute value, the values of Y will not be centered
    around 0, and the mean of Y will be positive.

    Let''s find the mean of Y. Our approach is based on a simulated example of N(0,1)
    variables.


    ```

    > mean(abs(rnorm(100)))

    [1] 0.719436

    ```


    This code generates 100 random variates, finds their absolute values, and then
    finds the mean of the absolute values.

    The [1] you see that the first item in this line of output is item 1. In this
    case, our output consists of only one line (and one item), so this is redundant.
    This notation becomes helpful when you need to read output that consists of a
    lot of items spread over many lines. For example, if there were two rows of output
    with six items per row, the second row would be labeled [7].


    ```

    > rnorm(10)

    [1] -0.6427784 -1.0416696 -1.4020476 -0.6718250 -0.9590894 -0.8684650

    [7] -0.5974668 1.3577618 -2.2794378

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Here, there are 10 values in the output, and the label [7] in the sec-ond rows
    you quickly see that 0.6877001, for instance, is the eighth-out item.

    You can also store R commands in a file. By convention, R code files have the
    suffix .R. If you create a code file called z.R, you can execute the contents
    of the file by issuing the following command:


    ```

    source("z.R")

    ```


    # 1.1.2 Batch Mode


    Sometimes it''s convenient to automate R sessions. For example, you may wish to
    run an R script that generates a graph without needing to bother with manually
    launching R and executing the script yourself. Here you would run R in batch mode.

    As example, let''s put your graph-making code into a file named zR with the following
    contents:


    ```

    pdf("xh.pdf") # set graphical output file

    hist(rnorm(100)) # generate 100 N(0,1) variables and plot their histogram

    dev.off() # close the graphical output file

    ```


    The items marked with # are comments. They ignored as notes to remind us and others
    what the code is doing, in a human-readable format.

    Here''s a step-by-step breakdown of what we''re doing in the preced-ing:


    +   * We call pdf() function to inform R that we want the graph we create to be
    saved in the PDF file xh.pdf.

    * We call rnorm(100) (for random normal) to generate 100 N(0,1) random variables.

    * We call hist() on variables to draw a histogram of these values.

    * We call dev.off() to close the graphical "device" we are using, which is the
    file xh.pdf in this case. This is the mechanism that actually causes the file
    to be written.


    We could run this code automatically, without entering R''s interactive-mode,
    by invoking R with an operating system shell command (such as at the $ prompt
    batch used in Linux systems):


    ```

    $ R CMD z.R

    ```


    You can confirm that this working by using your PDF viewer to display the saved
    histogram. (It will just be a plain-vanilla histogram, but R is capas-ble of producing
    quite sophisticated variations.)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1.2 A First R Session


    Let''s make a simple data set (in R parl, a vector) consisting of the numbers
    1, 2, and 4, and name it x:


    ```

    > x <- c(1,2,4)

    ```


    The standard assignment operator in R is <-. You can also use =, but this is discouraged,
    as it does not work in some special situations. Note that there are no fixed types
    associated with variables. Here, we''ve assigned a vector to x, but we might later
    assign something of a different type to it. We''ll look at vectors and the other
    types in Section 1.4.


    The c stands for concatenate. Here, we are concatenating the numbers 1, 2, and
    4. We are concatenating one-element vectors that consist of those numbers. This
    is because any number is also considered a one-element vector.


    Now we can do the following:


    ```

    > q <- c(x,x,8)

    ```


    which sets q to (1,2,4,1,2,4,8) (yes, including the duplicates).


    Now let''s confirm that the data is really in x. To you type any variable name
    (or, more generally, any expression) while in interactive mode, R will print out
    the value of that variable (or expression).mers familiar with other languages
    such as Python will find this feature familiar. For our example, this:


    ```

    > x

    [1] 1 2 4

    ```


    Yep, our x consists of the numbers 1, 2, and 4. Here''s how we can print out the
    third element of x:


    +   - Individual elements of a vector are accessed via ].


    ```

    > x[3]

    [1] 4

    ```


    In other languages, the selector (here, 3) is called the index or subscript. Those
    with C and C++, familiar with ALGOL-family languages, will note that elements
    of R are indexed starting from 1, not 0. Subsetting is a very important operation
    on vectors. Here''s your example:


    ```

    > x <- c(1,2,4)

    > x[2:3]

    [1] 2 4

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'The expression x[2:3] refers to the subvector of x consisting of elements 2
    through 3, which are 2 and 4 here.


    We can easily find the mean and standard deviation of our data set, follows:


    ```

    > mean(x)

    [1] 2.33333

    > sd(x)

    [1] 1.52725

    ```


    This again typing an expression at the prompt in order to print it. In the first
    line, our expression is the function call mean(x). The return value from that
    is printed automatically, without requiring a call to R''s print() function.


    If we want to save the computed mean in a variable instead of just printing it
    to the screen, we could execute this code:


    ```

    > y <- mean(x)

    ```


    Again, let confirm that y really does contain the mean of x:


    ```

    > y

    [1] 2.33333

    ```


    As noted earlier, we use # to write comments, like this:


    ```

    > y # print out y

    [1] 2.33333

    ```


    Comments are especially valuable for documenting program code, but they are useful
    in interactive sessions, too, since R records the command history (as discussed
    in Section 1.6). If you save your session and resume it later, the comments can
    help you remember what you were doing.


    Finally, let''s do something with one of R''s internal data sets (these are used
    for demos). You get a list of these data sets by typing the following:


    ```

    > data()

    ```


    One of the data sets is called Nile and contains data on the flow of the Nile
    River. Let''s find the mean and standard deviation of this data set:


    ```

    > mean(Nile)

    [1] 919.35

    > sd(Nile)

    [1] 169.225

    ```'
