- img_proc: true
  md: 'Instead, you must create y, for instance this way:


    ```

    > y <- vector(length=2)

    > y[1] <- 5

    > y[2] <- 12

    ```


    The following will also work:


    ```

    > y <- c(5,12)

    ```


    This approach is all right because on the right-hand side we are creating a new
    vector, to which we then bind y.


    The reason we cannot suddenly spring an expression like y[2] on R from R''s functional
    nature. The reading and writing of individual vector elements are automatically
    handled by functions. If R doesn''t already know that y is a vector, these have
    nothing on to act.

    Speaking of binding, as variables are not declared, they are not constrained in
    terms of memory. The following sequence of events is perfectly valid:


    ```

    > x <- c(1,5)

    > x

    > [1] 1 5

    > x <- "abc"

    ```


    First, x is assigned a numeric vector, then with a string. (Again, for C/C++ programmers:
    is nothing more than a pointer, which can point to different types of objects
    at different times.)


    # 2.3 Recycling


    When applying an operation to two vectors that requires them to be the same length,
    R automatically myyles, repeats, the shorter one, until it is long enough to match
    the longer one. Here is an:


    ```

    > c(1,2,4) + c(6,0,9,20,22)

    [1] 7 13 21 24

    Warning message:

    longer object length

    is not a multiple of shorter object length in: c(1, 2, 4) + c(6,

    0, 9, 20, 22)

    ```


    The shorter vector was recycled, so the operation was taken to be follows:


    ```

    > c(1,2,4,1,2) + c(6,0,9,20,22)

    ```'
