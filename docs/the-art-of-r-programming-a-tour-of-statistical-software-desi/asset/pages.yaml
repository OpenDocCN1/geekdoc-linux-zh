    $ce

    [1] 9

    > c(list(a=1,b=2,c=list(d=5,e=9)),recursive=T)

    a  b  c d  e

    1  2  5  9

    ```


    In the first case, we accepted the default value of recursive, which is FALSE,
    and obtained a recursive list, with the c component of the main list being another
    list. In the second call, with recursive set to TRUE, we got a single list as
    a result; only the names look recursive. (It''s odd that setting recursive to
    TRUE gives a nonrecursive list.

    Recall that our first example of lists consisted of an employee database. I mentioned
    that each employee was represented as a list, the entire database would be a list
    of lists. That is a concrete example of recursive lists.'
