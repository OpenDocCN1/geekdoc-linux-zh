  md: '# 10.2.2 Reading Text Files


    In computer literature, there is often a distinction made between *text files*
    and *binary files*. That distinction is somewhat misleading—every file is binary
    in the sense that it consists of 0s and 1s. Let''s take the term *text file* to
    mean a file that consists mainly of ASCII characters or coding for other human
    language (such as GB for Chinese) and that newline characters to give humans the
    perception of lines. The latter aspect will turn out to be central here. Nonprofit
    files, such as JPEG or executable files, are generally called *binary files.


    You can use `readLine()` to read in a text file, either one line at a time or
    in a single operation. For example, suppose we have a file *l* with the following
    contents:


    +   John 25

    Mary 28

    Jim 19


    We can read the file all at once, like this:


    ```

    > z1 <- readLine("z1")

    > z1

    [1] "John 25" "Mary 28" "Jim 19"

    ```


    Since each line is treated as a string, the return value here is a vector of strings—that
    is, a vector of character mode. There is one element for each line read, thus
    three elements here.

    Alternatively, we can read it one line at a time. For this, we will first need
    to create a connection, as described next.


    # 10.2.3 Introduction to Connections


    Connection is R''s term for a fundamental mechanism used in various kinds of I/O
    operations. Here, it will be used for file access.

    The connection is created by calling `file()`, `url()`, or one of other R functions.
    To see a list of those functions, type this:


    So, we can read now in the *z1* file (introduced in the previous section) line
    by line, as follows:


    ```

    > c <- file("z1","r")

    > readLines(c,n=1)

    [1] "John 25"

    > readLines(c,n=1)

    [1] "Mary 28"

    > readLines(c,n=1)

    [1] "Jim 19"

    ```


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_262_0.png)'
  merge: -1
  pgno: 262
- img_proc: true
  md: '```

    > readLines(c,n=1)

    character(0)

    ```


    We opened the connection, assigned the result to c, and then read the file one
    line at a time, as specified by the argument n=1. When R encountered the end of
    the file (EOF), we needed to set up a connection so that R could keep track of
    our position in the file as we read through it.


    We can detect EOF in our code:


    ```

    > c <- file("r","r")

    > while(TRUE) {

    +  rl <- readLines(c,n=1)

    +  if (length(rl) == 0) {

    +    print("reached the end")

    +    break

    +  } else print(rl)

    }

    ```


    +   [1] "John 25"

    [1] "Mary 28"

    [1] "Jim 19"

    [1] "reached the end"


    If we wish to "rewind"—to start at the beginning of the file—we can use seek():


    ```

    > c <- file("z1","r")n> readLines(c,n=2)

    [1] "John 25" "Mary 28"

    > seek(con=c,where=0)

    [1] 16

    > readLines(c,n=1)

    [1] "John 25"

    ```


    The argument where=0 in our call to seek() means that we wish to position the
    pointer zero from the start of the file—in other words, directly at the beginning.


    The call returns 16, meaning that the file pointer was at position 16 before we
    made the call. That makes sense. The first list contains "John 25" plus the end-of-line
    character, for a total of eight characters, and this is true for the second line.
    So, after reading the first two lines, we were at position 16.


    You can close a connection by calling—what else?—close(). You use this to let
    the system know that the file you have writing is complete and should be officially
    written to disk. As another example, in a client/server relationship over the
    Internet (see Section 10.3.1), a client would use close() to indicate to the server
    that the client is signing off.'
