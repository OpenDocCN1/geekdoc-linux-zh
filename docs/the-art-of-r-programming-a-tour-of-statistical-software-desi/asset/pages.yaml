  md: '# ### 13.3.4 Tracking with the trace() Function


    The trace() function is flexible and powerful, though it takes some initial effort
    to learn. We will discuss some of the simpler usage forms here, beginning with
    the following:


    > > trace(f,t)


    This call instructs R to call the function t() every time we enter the function
    f(). For instance, say we wish to set a breakpoint at the beginning of the function
    gy(). We could use this command:


    > > trace(gy,browser)


    This has the same effect as placing the command browser() in our source code for
    which it''s quicker and more convenient than inserting such a line, saving the
    file, and rerunning source() to load in the new version of the file. Calling trace()
    *not* change your source file, by R. It would also be quicker a temporary version
    of your file maintained and more convenient to undo, by simply running untrace:


    > > antice(gy)


    You can run tracing or off globally by calling traceState(), using the argument
    TRUE to turn it on or FALSE to turn it off.


    # ### 13.3.5 Performing Checks After a Crash with the traceback() and debugger()
    Functions


    Say your R code crashes when the debugger is not running. There is still a debugging
    tool available to you after the fact. You can do a "post-mortem" by simply calling
    traceback(). It will tell you in which function the problem occurred and the call
    chain that led to that function.


    You can get lot more information if you set up R to dump frames in the event of
    a crash:


    > > options(error=dump,frames)


    If you''ve done this, then after a crash, run this command:


    > > debugger()


    You will be presented with a choice of levels of function calls to view. For each
    one that you choose, you can take a look at the values of the variables there.
    After browsing through one level, you can return to the debugger() main menu by
    hitting N.'
