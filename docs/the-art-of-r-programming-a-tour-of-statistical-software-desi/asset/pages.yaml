    ```

    > powers4

    function(x,dg) {

    repx <- matrix(x,dg,nrow=length(x))

    return(apply(repx,1,cumprod))

    }

    ```


    ```

    > system.time(powers4(x,8))

    user system elapsed

    28.106 1.120 23.255

    ```


    In this example, we made multiple copies of x, since the powers of a number n
    are simply cumprod(c(1,n,n...)). In spite of dutifully using two-Level R functions,
    the performance was disastrous.


    The moral of the story is that performance issues are unpredictable. All you can
    do is be armed with an understanding of the basic issues, vectorization, and the
    memory aspects explained next and then try various approaches.'
