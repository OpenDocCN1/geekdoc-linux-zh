    The function computed 1 - 5 + 2 - 12 + 3 - 13 = 68.

    Note that the name crossprod() is a misnomer, as the function does not

    compute the vector cross product. We''ll develop a function to compute real

    cross products in Section 8.4.1.

    For matrix multiplication in the mathematical sense, the operator to use

    is %*%, not more. For instance, we compute the matrix product:


    $\begin{pmatrix} 1 & 2 \ 3 & 4 \end{pmatrix} \begin{pmatrix} -1 & 1 \ 0 & 1 \end{pmatrix}
    = \begin{pmatrix} 1 & 1 \ 3 & 1 \end{pmatrix}$


    Here''s the code:


    ```

    > a

    > [1,] 1 2

    > [2,] 3 4

    > b

    > [,1] [,2]

    > [1,] 1 -1

    > [2,] 0 1

    ```'
