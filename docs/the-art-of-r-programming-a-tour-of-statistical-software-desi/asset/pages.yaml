    \ | 3.5 |\n\nHere, we printed out the lmout. (Remember that simply typing the\
    \ name of an object in an interactive mode, the object is printed.) The R interpreter\
    \ showed that lmout was an object of class \"lm\" and then called print.lm(),\
    \ a special method for the \"lm\" class. In R terminology, the call to the generic\
    \ function print() was dispatched to the method print.lm() associated with the\
    \ class \"lm\"\n\nLet's take a look at the generic function and the class method\
    \ in case:\n\n```\n> print\nfunction(x, ...) UseMethod(\"print\")\n<environment:\
    \ namespace:base>\n> print.lm\nfunction(x, digits) = max(3, getOption(\"digits\"\
    ) - 3), ...)\n{\n  cat(\"lmCall:\\n\", deparse(x), \"\\n\\n\", sep = \"\")\n \
    \ if (length(coef(x))) {\n    cat(\"coefficients:\\n\")\n    print.default(format(coef(x),\
    \ digits = digits), print.gap = 2,\n                  quote = FALSE)\n  } else\
    \ else cat(\"No coefficients\\n\")\n  cat(\"\\n\")\n  invisible(x)\n}\n<environment:\
    \ namespace:stats>\n```\n\nYou may be surprised to see that print() consists solely\
    \ of a call to UseMethod(). But this is actually the dispatcher function, so in\
    \ view of print()'s role as a generic function, you should not be surprised after\
    \ all."
