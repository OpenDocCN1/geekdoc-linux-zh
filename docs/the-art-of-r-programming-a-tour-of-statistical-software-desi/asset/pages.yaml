  md: '# # 2

    VECTORS


    The fundamental data type in R is the vector. You saw a few examples in Chapter
    1, and now you''ll learn the details. We''ll start by examining how vectors relate
    to some other data types in R. You''ll see that unlike in languages in the C family,
    individual numbers (scalars) do not have separate data types but are instead special
    cases of vectors. On the other hand, as in C family languages, matrices are special
    cases of vectors.


    We''ll spend a considerable amount of time on the following topics:


    +   - **Recycling**: The automatic lengthening of vectors in certain settings

    - **Filtering**: The extraction of subsets of vectors

    - **Vectorization**: Where functions are applied element-wise to vectors


    All of these operations are central to R programming, and you will see them referred
    to often in the remainder of the book.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 2.1 Scalars, Vectors, Arrays, and Matrices


    In many programming languages, vector variables are considered different from
    scalars, which are single-number variables. Consider the following C code, for
    example:


    ```

    int x;

    int y[3];

    ```


    This requests the compiler to allocate space for a single integer named x and
    a three-integer array (C terminology acknowledging R''s vector type) y. In R,
    numbers are considered one-element vectors, and there is really no such thing
    as a scalar.


    R variable types are called modes. Recall from Chapter 1 that all elements in
    a vector have the same name, which can be integer, numeric (floating-point number),
    character (string), logical (Boolean), complex, and so on. If you need your program
    code to check the mode of a variable x, you can query it by the type(x).


    Unlike vectors in ALGOL-family languages, such as C and Python, vector indices
    in R begin at 1.


    # 2.1.1 Adding and Deleting Vector Elements


    Vectors are stored like arrays in C, contiguously, and thus you cannot insert
    or delete elements—something may be used if you are a Python programmer. The size
    of a vector is determined at its creation, so if you wish to add or delete elements,
    you''ll need to reassign the vector.


    For example, let''s add an element to the middle of a four-element vector:


    ```

    > x <- c(88,5,12,13)

    > x <- c(x[1:3],18,x[4]) # insert 18 before the 13

    > x

    ```


    +   [1] 88 5 12 13


    Here, we created a four-element vector and assigned it to x. To insert a new number
    18 between the third and fourth elements, we struggled to get the first three
    elements of x, then 18, then the fourth element of x. This creates a new five-element
    vector, leaving x intact for the time being. We then assigned that new vector
    to x.


    In the result, it appears as if we had actually changed the vector stored in x,
    but we really created a new vector and stored that vector in x. This difference
    may seem subtle, but in some cases, it may restrict the potential for fast performance
    in R, as discussed in Chapter 14.


    > For readers with a background in C, internally, x is really a pointer, and the
    reassignment is implemented by pointing x to the newly created vector.'
