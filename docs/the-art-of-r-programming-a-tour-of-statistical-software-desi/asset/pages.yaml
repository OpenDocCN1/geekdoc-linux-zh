  md: "To work in UDP, you need C/C++, which requires an interface to R for those\
    \ languages.\n\nR actually offers two C/C++ interfaces via the functions .C()\
    \ and .Call(). The latter is much more versatile but requires some knowledge of\
    \ R's internal structures, so we'll stick with .C() here.\n\n# 15.1.1 Sample R-to-C/C++\
    \ Preliminaries\n\nIn C, two-dimensional arrays are stored in row-major order,\
    \ in contrast to R's column-major order. For instance, if you have a 3-by-4 array,\
    \ the element in the second row and second column is element number 5 of the array\
    \ when viewed linearly, since there are three elements in the first column and\
    \ this is the element in the second column. Keep in mind that C subscripts begin\
    \ at 0, rather than 1, as with R.\n\nAll the arguments passed from R to C are\
    \ received by C pointers. Note that the C function must return void. Values that\
    \ would ordinarily return must be communicated through the function's arguments,\
    \ such as in the following example.\n\n# 15.1.2 Example: Extracting Subdiagonals\
    \ from a Square Matrix\n\nHere, we will C code to extract subdiagonals from a\
    \ square matrix. (Thanks to my former graduate assistant, Min-Yu Huang, who wrote\
    \ an earlier version of this function.) Here's the code for the file sub.c.\n\n\
    ```\n#include <R.h> // required\n\n// arguments:\n// m: number of rows/columns\
    \ of m\n// n:\n// k: the subdiagonal index-0 for main diagonal, 1 for first subdiagonal,\
    \ 2 for the second, etc.\n\nvoid subdiag(double *m, int *n, int *k, double *result)\n\
    {\n  int val = *n, kval = *k;\n  int stride = val + 1;\n  for (int i = 0, j =\
    \ kval; i < nval-kval; ++i, j+= stride)\n    result[i] = m[j];\n}\n```\n\nThe\
    \ variable stride alludes to a concept from the parallel-processing community.\
    \ Say we have a matrix in 1,000 columns and our code is looping through all the\
    \ elements in a given column, from top to bottom. Again, since C uses row-major\
    \ order, consecutive elements in the column are 1,000 elements apart from each\
    \ other if the matrix is viewed as one long vector."
