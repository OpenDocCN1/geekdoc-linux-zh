  md: 'What actually happens in nested ifelse()? Let''s take a careful look.

    First, for the sake of concreteness, let''s find what the formal argument names

    are in the function ifelse():


    ```

    > args(ifelse)

    function(test, yes, no)

    NULL

    ```


    Remember, for each element of test that is true, the function evaluates to

    t corresponding element in yes. Similarly, if test[1] is false, the function

    evaluates to no[1]. All values are returned together in a vector.


    In our case R will execute the outer ifelse() first call, in which text

    g is = "M", and yes is 1 (cycled); no will (later) be the result of executing

    Since now test[1] is true, we generate yes[1], which is 1.

    The first element of the return value of our call will be 1.


    Next R will evaluate test[2]. That is false, so R needs to find no[2].nR needs
    to execute the inner ifelse() call. It hasn''t done so before,

    meaning that an expression is not computed until it is needed.


    R will now evaluate ifelse("F",2,3), yielding (3,2,2,3,3,3,2); this is no

    to the outer ifelse() call, so the latter''s second return element will be

    second of (3,2,2,3,3,3,2), which is 2.


    When the outer ifelse() call gets to test[4], it will see that value to

    false and then return no[4]. Since R already computed no, it has the

