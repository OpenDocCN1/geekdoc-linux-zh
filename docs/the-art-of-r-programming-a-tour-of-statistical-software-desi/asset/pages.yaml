    # 1.4.6 Classes


    R is an object-oriented language. Objects are instances of classes. Classes are

    a bit more abstract than the data types you''ve met so far. Here, we''ll look

    briefly at the concept using R''s S3 classes. (The name stems from their use

    in the old S language, version 3, which was the inspiration for R.) Most of R

    is based on these classes, and they are exceedingly simple. Their instances

    are simple lists but with an extra attribute: the class name.


    For example, we noted that the (nongraphical) output of the

    hist() function is a list with various components, such as break and

    count. There was also an attribute, which specified the class of

    nnamely histogram.


    ```

    > print(hn)

    $breaks

    [1] 0 400 500 600 700 800 900 1000 1100 1200 1300 1400

    ```


    ```

    $counts

    [1] 0 5 20 25 19 12 11 6 1

    ```


    ```

    ...\attr("class")

    [1] "histogram"

    ```


    At this point, you might be wondering, "If S3 class objects are used by lists,

    why do we need them?" The answer is that the classes are used by generic

    functions. A generic function stands for a family of functions, serving a

    similar purpose but appropriate to a specific class.


    A commonly used generic function is summary(). An R who who

    to a statistical function, like hist(), is unsure of how to deal with

    output (which can be voluminous), can simply call summary() on the output,

    which is not just a list but an instance of an S3 class.


    The summary() function, in fact, is a family of summary-making

    functions, handling objects of a particular class. When you call summary()

    on some output, R searches for a summary function appropriate to the class

    at hand and uses it to give a friendlier representation of the list. Thus, call-

    ing summary() on the output of hist() produces a summary tailored to that

    function, and calling summary() on the output of the lm() regression function

    produces a summary appropriate for that function.'
