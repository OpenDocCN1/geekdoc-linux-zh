- img_proc: true
  md: '# 14.3 Functional Programming and Memory Issues


    Most R objects are immutable, or unchangeable. Thus, R operations are implemented
    as functions that reassign to the given object, a trait that can have performance
    implications.


    # 14.3.1 Vector Assignment Issues


    As an example of some of the issues that can arise, consider this simple-statement:


    ```

    z[3] <- 8

    ```


    As noted in Chapter 7, this assignment is more complex than it seems. It is actually
    implemented via the replacement function "`<-` through this call and assignment:


    ```

    z <- "<-(z,3,value=8"

    ```


    An internal copy of z is made, element 3 of the copy is changed to 8, and then
    the resulting vector is reassigned to z. And recall that the latter means z is
    pointed to the copy.


    In other words, even though we are ostensibly changing just one element of the
    vector, the semantics say the entire vector is recomputed. For a long vector,
    this would slow down the program considerably. The same would be true for a shorter
    vector if it were assigned within a loop of our code.


    In some situations, R takes some measures to mitigate this impact, but it is a
    key point to consider when aiming for fast code. You should be mindful of this
    when working with vectors (including arrays). If your code seems to be running
    unexpectedly slowly, assignment of vectors could be a prime area of suspicion.


    # 14.3.2 Copy-on-Change Issues


    A related issue is that R (usually) follows a copy-on-change policy. For instance,
    if we execute the following in the preceding setting:


    ```

    y <- z

    ```


    then y shares the same memory area with z. But if either of them changes, then
    a copy is made in a different area of memory, and the changed variable will occupy
    the new area of memory. However, only the first is affected, as the relocating
    of the moved variable means there are no longer sharing issues. The function trace()
    will report such memory relocations.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'Though R usually adheres to copy-on-change semantics, there are exceptions.
    For example, R doesn’t exhibit the location-change behavior in the

    following setting:


    ```

    > z <- runif(10)

    > tracem(z)

    > [1] "0x88c3258*"

    > z[3] <- 8

    > tracem(z)

    > [1] "0x88c3258*"

    ```


    The location of z didn’t; it was at memory address 0x88c3258 both and after the
    assignment to z[3] was executed. Thus, although you should be vigilant about location
    change, you also can’t assume.

    Let’s look at the times involved:


    ```

    > z <- 1:1000000

    > system.time(z[3]) <- 8

    user system elapsed

    0.180 0.084 0.265

    > system.time(z[3]) <- 88

    user system elapsed

    0 0 0

    ```


    In any event, if copying is done, the vehicle is R’s internal function duplicate().
    (The function is called duplicate() in recent versions of R.) If you’re familiar
    with the GDB debugging tool and your R build debugging information, you can explore
    the circumstances under which a copy is performed.


    Following the guide in Section 15.1.4, start up R with GDB, step through R and
    place a breakpoint at duplicate(). Each time you break at that function, submit
    this GDB command:


    ```

    call Rf_PrintValue(s)

    ```


    This will print the value of s (or whatever value is of interest).


    # 14.3.3 Extended Example: Avoiding Memory Copy


    This example, though artificial, will demonstrate the memory-copy issues discussed
    in the previous section.


    Suppose we have a large number of unrelated vectors and, among other things, we
    wish to set the third element of each to 8. We could store the vectors in a matrix,
    one vector per row. But since they are unrelated, may of different lengths, we
    may consider storing them in a list.'
