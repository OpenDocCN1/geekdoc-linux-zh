    # 10.1.3 Printing to the Screen


    At the top level of interactive mode, you can print the value of a variable or
    expression by simply typing the variable name or expression. This won''t work
    if you need to print from the body of a function. In that case, you can use the
    print() function, like this:


    ```

    > x <- 1:3

    > print("x")

    [1] 1 4 3

    ```


    Recall that print() is a generic function, the actual function called will depend
    on the class of the object that is printed. For example, if the argument is class
    "table", then the print.table() function will be called.'
