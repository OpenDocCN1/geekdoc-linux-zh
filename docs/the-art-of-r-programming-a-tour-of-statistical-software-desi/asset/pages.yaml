    # 16.3.6 GPU Programming


    Another type of shared-memory parallel hardware consists of graphics processing
    units (GPUs). If you have a sophisticated graphics card in your machine, for playing
    games, you may not realize that it is also a very powerful computational device—so
    that the slogan "A supercomputer is often used to refer to PCs equipped with high-end
    GPUs." With OpenMP, the idea here that instead of writing parallel R you write
    C interfaced with parallel C (Similar to the OpenMP case, C means a slightly augmented
    version of the C language.). The technical details become rather complex, so I
    won’t show any code examples, but an overview of the platform worthwhile.


    As mentioned, GPUs do follow the shared-memory/threads model, but on a larger
    scale. They have dozens, or hundreds, of cores (depending on how you define core).
    One major difference is that several threads can run together in a block, which
    can produce certain efficiencies.


    Programs that access GPU begin their run on your machine (referred to as the host).
    Then they start code running on the GPU, or device. This means that your data
    must be transferred from the host to the device, and after the GPU finishes its
    computation, the results must be transferred back to the host.


    As of writing, GPU has not yet become common among R users. The most common usage
    is probably through the GRAN package gtools, which consists of matrix algebra
    and statistical routines callable from R. For instance, consider matrix inversion.
    R provides the function solve() for this, but a parallel alternative is available
    in gtools with the name gpusolve().


    For more about GPU programming, see my book on parallel processing at http://heater.cs.ucavis.edu/parprobook.


    # 16.4 General Performance Considerations


    This section discusses issues that you may find generally useful in parallelizing
    R applications. I will present some material on the main sources of overhead and
    then discuss a couple of algorithmic issues.'
