    # ## 12.9 Pinpointing Locations: The locator() Function


    Placing text exactly where you wish can be tricky. You could repeatedly try different
    x- and y-coordinates until you find a good position, but the locator() function
    can save you a lot of trouble. You simply call the function and then click the
    button at the desired spot in the graph. The function returns the x- and y-coordinates
    of your click point. Specifically, typing the following will tell R that you will
    click in one place in the graph:


    ```

    locator(1)

    ```


    Once you click, R will tell you the exact coordinates of the point clicked. Call
    locator(2) to get the locations of two places, and so on. (Warning: Make sure
    to include the argument)

    Here is a simple example:


    ```

    > hist(c(12,5,13,25,16))

    > locator(1)

    $x

    [1] 6.239237

    $y

    [1] 1.221038

    ```'
