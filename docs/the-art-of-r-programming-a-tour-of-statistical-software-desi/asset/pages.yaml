  md: "This code shows three different ways of accomplishing the same thing,\nbreak\
    \ playing a key role in the second and third ways.\n\nNote that repeat has no\
    \ Boolean exit condition. You must use break (or\ns like return()). Of course,\
    \ break can be used for loops, too.\n\nAnother useful statement is repeat, which\
    \ instructs the interpreter to\\skip the remainder of the current iteration of\
    \ the loop and proceed directly\nto the next one. This provides a way to avoid\
    \ using complex nested if-\nconstructs, which can make the code confusing. Let's\
    \ take a look at an\nexample that uses next. The following code comes from an\
    \ extended exam-\nple in Chapter 8:\n\n```\nsim <- function(nreps) {\n  commata\
    \ <- list()\n  commata$countabsamecomm <- 0\n  for (rep in 1:nreps) {\n    commata@offset\
    \ <- 120\n    commata@numabchosen <- 0\n    commata <- choosecomm(commata,5)\n\
    \    if (commata$numabchosen > 0) next\n    commata <- choosecomm(commata,4)\n\
    \    if (commata$numabchosen > 0) next\n    commata <- choosecomm(commata,3)\n\
    \  }\n  print(commata$countabsamecomm/nreps)\n}\n```\n\nThere are next statements\
    \ in lines 8 and 10. Here is how they work\nand they improve the alternatives.\
    \ The two next statements occur\nwithin the loop that starts at line 4. Thus,\
    \ when the if condition holds in\nline 8, lines 9 through 11 will be skipped,\
    \ and control will transfer to line 4.\nThe situation in line 10 is similar.\n\
    \nWithout next, we would need to resort to nested if statements,\nsomething like\
    \ this:\n\n```\nsim <- function(nreps) {\n  commata <- list()\n  commata$countabsamecomm\
    \ <- 0\n  for (rep in 1:nreps) {\n    commata@offset <- 120\n    commata@numabchosen\
    \ <- 0\n    commata <- choosecomm(commata,5)\n    if (commata$numabchosen == 0)\
    \ {\n      commata <- choosecomm(commata,4)\n      commata <- choosecomm(commata,3)\n\
    \    }\n  }\n}\n```"
