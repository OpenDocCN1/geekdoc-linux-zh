  md: "This can be expressed compactly as the expansion along the top row of the determinant,\
    \ as shown in Equation 8.2.\n\n```\n$$\\begin{pmatrix} x_1 & x_2 & x_3 \\ y_1\
    \ & y_2 & y_3 \\end{pmatrix}$\n```\n\nHere, the elements in the top row are merely\
    \ placeholders. Don't worry about this pseudonym. The point is that the cross\
    \ product vector can be computed as a sum of subdeterminants. For instance, the\
    \ first component in Equation 8.1, $x_2y_3-x_3y_2$, is easily seen to be the determinant\
    \ of the submatrix obtained by deleting the first and first column in Equation\
    \ 8.2, as shown in Equation 8.3.\n\n```\n$$\\begin{pmatrix} x_2 & x_3 \\ y_2 &\
    \ y_3 \\end{pmatrix}$\n```\n\nOur need to calculate subdeterminants—that are determinants\
    \ of submatrices—fits perfectly with R, which excels at may submatrices. This\
    \ suggests calling det() on the proper submatrices, as follows:\n\n```\nxprod\
    \ <- function(x,y) {\n  m <- rbind(NA(3),x,y)\n  xp <- vector(length=3)\n  for\
    \ (i in 1:3) {\n    xp[i] <- (-1)^i * det(m[2:3,-i])\n  }\n  return(xp)\n}\n```\n\
    \n> Note that even R's specify to values as NA can play here to deal with the\
    \ \"placeholders\" mentioned above. All this may seem overkill. After all, it\
    \ wouldn't have been hard to code Equation 8.1 directly, without resorting to\
    \ submatrices and determinants. But that may be fruitful in the three-dimensional\
    \ case, the approach shown here is quite fruitful in the $n$-case, in $n$-dimensional\
    \ space. The cross product is defined as an $n$-by-$n$ determinant of the form\
    \ shown in Equation 8.1, and thus the preceding code generalizes perfectly.\n\n\
    # 8.4.2 Extended Example: Finding Stationary Distributions of Markov Chains\n\n\
    A Markov chain is a random process in which we move among various states, in a\
    \ \"memoryless\" fashion, whose does not concern us here. The state could be the\
    \ number of jobs in a queue, the number of items stored in inventory, and so will\
    \ assume the number of states to be finite.\n\nAs a simple example, consider a\
    \ game in which we toss a coin repeatedly and we accumulate three consecutive\
    \ heads. Our state at time i will be the number of consecutive heads we have so\
    \ far, our state can be 0, 1, or 2. (When we get three heads in a row, our state\
    \ reverts to 0.)"
