  md: 'Note that the nature of binary search trees implies that while any node, all
    of the elements in the node''s left subtree are less than or equal to the value
    stored in this node, while the right subtree stores the elements that are larger
    than the value in this node. In our example, where the root node contains 8, all
    of the values in the left subtree—5, 2 and 6—are less than 8, while 20 is greater
    than 8.


    If implemented in C, a tree node would be represented by a struct, similar to
    an R list, where contents are the stored value, a pointer to the left child, and
    a pointer to the right child. Because R lacks pointer variables, what can we do?


    Our solution is to go back to the basics. In the old preprint days of FORTRAN,
    linked data structures were implemented in long arrays. A pointer, in C is a memory
    address, and an array index indent.


    Specifically, we''ll represent each node by a row in a three-column matrix. The
    node''s stored value will be in the third element of that, while the first and
    second elements will be the left and right links. For instance, if the first element
    in a row is 29, it means this node''s left link points to the node stored in row
    29 of the matrix.


    Remember that allocating space for a matrix in R is a time-consuming effort. In
    an effort to amortize the memory-allocation, we allocate new space for a tree''s
    matrix rows at a time, instead of row by row. The number of rows allocated each
    time will be given in the variable inc. As is common with tree traversal, we implement
    our algorithm by recursion.


    > If you anticipate that the matrix will become large, you may wish to double
    its size at allocation, rather than grow it as we have here. This would further
    reduce the number of time-consuming disruptions.


