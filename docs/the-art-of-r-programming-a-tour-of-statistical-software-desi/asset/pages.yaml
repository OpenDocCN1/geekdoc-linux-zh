    so we specified header=FALSE in the function call. This is an example of a default
    argument, which we talked about earlier. Actually, the default value of the header
    argument is FALSE already (which you can check by consulting R''s online help
    for read.table()), so we didn''t need to specify this setting, but it''s clearer
    if we do.


    Our data is now examsquiz, which is an R object of class data, frame.


    ```

    > class(examsquiz)

    [1] "data.frame"

    ```


    Just to check that the file was read in correctly, let''s take a look at the first
