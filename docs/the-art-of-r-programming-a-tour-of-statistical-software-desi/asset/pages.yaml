    12.5, we will add a method for the plot() generic function, plot.polyreg().


    In computing prediction errors, we use cross-validation, and the leaving-one out
    method, in a form that predicts each observation from all the others. To implement
    this, we take advantage of R''s use of negative subscripts in line 57:


    ```

    lmo <- lm(y[-i]) ~ xmat([-i,-])

    ```


    So, we are fitting the model with the rth observation deleted from our data set.


