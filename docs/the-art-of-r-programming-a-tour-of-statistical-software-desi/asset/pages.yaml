    # 16.3 Resort to C


    As you see, using parallel R may greatly speed up your R code. This allows you
    to retain the convenience and expressive power of R, while still ameliorating
    runtimes in big applications. If the parallelized R gives sufficiently good performance,
    then all is well.


    Nevertheless, parallel is still R and thus subject to the performance issues covered
    in Chapter 14. Recall that one solution offered in chapter was to write a performance-critical
    portion of your code in C and call that from your R program. (The references to
    C here mean C or C++) We will explore this from a parallel-processing viewpoint.
    Here, instead of writing parallel R, we write ordinary R code that calls parallel
    C. (I assume a knowledge of C.)


    # 16.3.1 Using Multicore Machines


    The code covered here runs only on multicore systems, so we must discuss the nature
    of such systems.'
