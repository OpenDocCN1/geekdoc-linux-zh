  md: 'example, where our class "employee" had three fields: name, salary, and union.

    Here are some possible mishaps:


    +   * We forget to enter the union status.

    * We misspell union as *onion*.

    * We create an object of some class other than "employee" but accidentally set
    its class attribute to "employee".


    In of these cases, R will not complain. The goal of S4 is to elicit a complaint
    and prevent such accidents.

    4 structures are considerably larger than S3 structures, but here we present just
    the basics. Table 9-1 shows an overview of the differences between the two classes.


    # Table 9-1: Basic R4 Operators


    | Operation | S3 | S4 |

    | --- | --- | --- |

    | Define class | Implicit in constructor | getClass() |

    | Create object | Build list, set class attr | new() |

    | Reference member variable | $ | @ |

    | Implement generic() | Define f.classname() | setMethod() |

    | Declare generic | UseMethod() | setGeneric() |


    # 9.2.1 Writing S4 classes


    You define an S4 class by calling setClass(). Continuing with your employee example,
    we could create the following:


    ```

    > setClass("employee",

    + representation(

    + name="character",

    + salary="numeric",

    + union="logical"

    +)

    [1] "employee",

    ```


    This defines a new class, "employee", with three member variables of the specified
    types.

