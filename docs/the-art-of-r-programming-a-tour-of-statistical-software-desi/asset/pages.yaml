  md: '# TAME YOUR DATA


    R is the world’s most popular language for developing statistical software: Archaeologists
    use it to track the spread of ancient civilizations, drug companies use it to
    discover which medications are safe and effective, and actuaries use it to assess
    financial risks and markets running smoothly.


    The Art of Programming takes you on a guided tour of software development with
    R, from basic types and data structures to advanced topics like closures, recursion,
    and anonymous functions. No statistical knowledge is required, and your programming
    skills can range from hobbyist to pro.


    Along the way, you''ll learn about functional and object-oriented programming,
    running mathematical simulations, and rearranging complex data into simpler, more
    useful formats. You''ll also learn to:


    +   * Interface R with C/C++ and Python for increased speed or functionality


    +   * Find new packages for text analysis, image manipulation, and thousands more


    +   * Squash annoying bugs with advanced debugging techniques


    Whether you''re designing aircraft, forecasting the weather, or you just need
    to tame your data, The Art of R Programming is your guide to harnessing the power
    of statistical computing.


    # ABOUT THE AUTHOR


    Norman Matloff is a professor of computer science (and a former professor of statistics)
    at the University of California, Davis. His research include parallel processing
    and statistical regression, and he is the author of widely used tutorials on software
    development. He has written articles for the New York Times, the Washington Post,
    Forbes Magazine, and the Los Angeles Times, and he is the co-author of The Art
    of Debugging (No Starch Press).


    +   * Createful graphs to visualize complex data sets and functions


    +   * Write more efficient code using parallel R and vectorization


