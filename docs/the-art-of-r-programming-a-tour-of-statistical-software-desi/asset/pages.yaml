  md: '# 2.8 Filtering


    Another feature reflecting the functional language nature of R is *filtering*.
    This allows us to extract a vector''s elements that satisfy certain conditions.
    Filtering is one of the most common operations in R, as statistical analyses often
    focus on data that satisfies conditions of interest.


    # 2.8.1 Generating Filtering Indices


    Let''s start with a simple example:


    ```

    > z <- c(5,2,-3,8)

    > w <- z[z > 8]

    > w

    [1] 5 -3 8

    ```


    Looking at this code in an intuitive, “What is our intent?” manner, we saw that
    R to extract from all its elements squares were greater than 8 and then assign
    that vector to w.


    But filtering is such a key operation in R that it''s worthwhile to examine the
    technical details of how R achieves our intent above. Let''s look at it piece
    by piece:


    ```

    > z <- c(5,2,-3,8)

    > z

    [1] 5 2 -3 8

    > z*z > 8

    [1] TRUE FALSE TRUE TRUE

    ```


    Evaluation of the expression z*z > 8 gives a vector of Boolean values! It''s important
    that you understand exactly how this comes about. In the expression z*z > 8, note
    that *everything* is a vector or vector operator:


    +   * Since z is a vector, that means z*z will also be a vector (of the same length
    as z).

    * Due to recycling, the number 8 (or vector of length 1) becomes the vector (8,8,8,8)
    here.

    * The operator >, like +, is actually a function.


    Let''s look at an example of that last point:


    ```

    > "(2,1)

    [1] TRUE

    > "(2,5)

    [1] FALSE

    ```'
