    # INSTALLING R


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_378_0.png)


    This appendix covers the methods for installing R on your system. You can easily
    download and install the precompiled binaries, use your package manager precompiled
    on a UNIX-based system, or even install from source if you prefer.


    # A.1 Downloading R from CRAN


    R, in its base form and user-written packages, is available on the Comprehensive
    Archive Network (CRAN) at the R home page, http://www.r-project.org/. Click CRAN
    and choose a site near you to download the appropriate base for your operating
    system (OS).


    For most users, installing R is quite simple, regardless of the platform. You
    can find precompiled binaries for Windows, Linux, and Mac OS X on CRAN. You should
    be able to simply download the appropriate file and install R.


    # A.2 Installing from a Linux Package Manager


    Rather than using the precompiled binaries, if you''re running a Linux distribution
    with a centralized package repository, such as Fedora or Ubuntu, you'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'can install R using your OS’s package manager. For example, if you’re running
    Fedora, you can install R by typing the following at the command line:


    ```

    $ yum install R

    ```


    For a Debian-based system, such as Ubuntu, the command looks like this:


    ```

    $ sudo apt-get install r-base

    ```


    Check your distribution’s documentation for more details on installing and removing
    packages.


    # A.3 Installing from Source


    On Linux or other UNIX-based machines (probably including Mac OS X), you can also
    compile R’s source code yourself. Simply unpack the source archive and follow
    the classic three-command installation procedure:


    ```

    $ configure

    $ make

    $ make install

    ```


    Note that you may need to run make install as root, depending on your write permissions
    and the location to which you’re installing R. If you want to install to a nonstandard
    directory, say `/a/b/c`, you can run configure with the `--prefix` parameter,
    like this:


    ```

    $ configure --prefix=/a/b/c

    ```


    This might be helpful if you’re working on a shared machine and don’t have write
    permissions to the standard installation directories like /usr.'
