    # 7.8 Writing Upstarts


    As mentioned earlier, code that exists at a certain level of the environment hierarchy
    has at least read access to all the variables at levels above it. On the other
    hand, direct write to variables at higher levels via the standard <- operator
    is not possible.


    If you wish to write a global variable—or more generally, to any variable higher
    in the environment hierarchy than the level at which your statement exists—you
    can use the superassignment operator, <<-, or the assign() function. Let''s discuss
    the superassignment operator first.


    # 7.8.1 Writing to Nonlocals with the Superassignment Operator


    Consider the following code:


    ```

    > two <- function(u) {

    + u <<- 2+u

    + z <- 2*z

    }

    > x <- 1

    > z <- 3

    > u

    Error: object "u" not found

    > two(x)

    > x

    ```'
