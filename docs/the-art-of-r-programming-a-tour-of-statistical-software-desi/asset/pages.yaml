    # # 12.3 Saving Graphs to Files


    The R graphics display can consist of various graphics devices. If you want to
    save a graph to a file, you must set up another device.


    Let’s go through the basics of R graphics devices first to introduce R graphics
    devices concepts, and then discuss a second approach that is much more direct
    and convenient.


    # ## 12.3.1 R Graphics Devices


    Let''s open a file:


    ```

    > pdf("d12.pdf")

    ```


    This opens the file d12.pdf. We now have two devices open, as we confirm:


    ```

    > dev.list()

    X11 pdf

    2 3

    ```'
