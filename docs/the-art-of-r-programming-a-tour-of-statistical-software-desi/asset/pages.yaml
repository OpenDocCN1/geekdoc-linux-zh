  md: 'The browser will be invoked if s is larger than 1. The following would have
    the same effect:


    ```

    if (s > 1) browser()

    ```


    Calling the browser directly, rather than entering the debugger via debug() is
    very useful in situations in which you have a loop with many iterations and the
    bug surfaces after say, the 50th iteration. If the loop index is i, you could
    write this:


    ```

    if (i > 49) browser()

    ```


    That way, you would avoid the tedium of stepping through the first 49 iterations!


    # 13.3.2 Using the setBreakpoint() Function


    Starting with R 2.10, you can setBreakpoint() in the format


    ```

    setBreakpoint(filename,linenumber)

    ```


    This will result in browser() being called when you are at linenumber of our source
    file filename. This is especially useful when you are in the midst of the debugger,
    single-stepping through code. You are currently at line 12 of your source file
    x.R and want to have a breakpoint at line 28. Instead of exiting the debugger,
    adding a call to browser() at line 28, and then re-entering the function, you
    could simply type this:


    ```

    > setBreakpoint("x.R", 28)

    ```


    > You could resume execution within the debugger, say by issuing the c command.
    The setBreakpoint() function works by calling trace() function, discussed in the
    next section. To cancel the breakpoint, you cancel the trace. If we had called
    setBreakpoint() at a line in the function g(), you would cancel the breakpoint
    by typing the following:


    ```

    > untrace(g)

    ```


    You can setBreakpoint() whether or not you are currently in the debugger. You
    are not currently running the debugger and hit the breakpoint during that execution,
    you will be put into the browser automatically. This is similar to the case of
    browser(), but using this approach, you save yourself the trouble of changing
    your code via your text editor.'
