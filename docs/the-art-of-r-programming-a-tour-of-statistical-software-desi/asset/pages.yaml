  md: '# INSTALLING AND USING PACKAGES


    One of the major strengths of R is that thousands of user-written packages are
    available on the Comprehensive R Archive Network (CRAN) at the R home page, http://www.r-project.org/.
    Package installation is easy in most cases, but there are nuances to be aware
    of some of the specialty packages.


    This appendix starts with some package basics and then explains how to load R
    packages from your hard drive and from the Web.


    # B.1 Package Basics


    R uses packages to store groups of related pieces of software. The packages that
    are included in the R distribution are visible as subdirectories of your library
    directory in your R installation tree, as in /usr/lib/R/library.


    > In the R community, the term library is often used in place of package.


    Some packages are loaded automatically when you start R, such as the base subdirectory.
    However, in order to save memory and time, R does not load all available packages
    automatically.


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_380_0.png)'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'You can check which packages are currently loaded by typing this:


    > .path.package()


    # B.2 Loading a Package from Your Hard Drive


    If you need a package that is in your R installation but not loaded into memory,
    you can load it using the library() function. For instance, suppose you wish to
    generate multivariate random vectors. The function %rnorm() in the package MASS
    does this. So, load the package as follows:


    > library(MASS)


    The %rnorm() function will now be ready to use. And so will your documentation
    (before you loaded MASS, entering help(%rnorm) would have generated an error message).


    # B.3 Downloading a Package from the Web


    The package you may not be in your R installation. One of the big advantages of
    open source software is that people love to share. All over the world have written
    their special-purpose R packages, placing them in the CRAN repository and elsewhere.


    > NOTE contributions to CRAN go through a vetting process and are generally of
    high quality. They are, however, not thoroughly tested as R itself.


    # B.3.1 Installing Packages Automatically


    One way to install a package is to use the install_packages() function. For example,
    suppose you wish to use the %rnorm package, which computes multivariate cumulative
    distribution functions and other quantities. First, choose a directory in which
    you wish to install the package (and maybe others in the future), say "a/b/c".
    Then at the R prompt, type this:


    > install_packages("%rnorm", "a/b/c")


    This will cause R to automatically go to CRAN, download the package, compile it,
    and load it into a new directory: "a/b/c/rnorm".

    You need to tell R where to find that package once it''s installed, which you
    can do via the .libPaths() function:


    > .libPaths("a/b/c")


    This will add that directory to the ones R was already using. If you use that
    directory often enough, you may wish to add that to .libPaths() in your .Rprofile
    startup file in your home directory.


    356 Appendix B'
