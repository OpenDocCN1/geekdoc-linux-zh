    When we did ordinary filtering in the previous section, R said, "Well, x is unknown,
    so it''s also unknown whether its square is greater than 5.\ But you may not want
    NAs in your results. When you wish to exclude NA values, using subset() saves
    you the trouble of removing NA values yourself.


    # 2.8.3 The Selection Function which()


    As you''ve seen, filtering consists of extracting elements of a vector z satisfy
    a certain condition. In some cases, though, we may want to find the positions
    z at which the condition occurs. We can do this using which(),


    ```

    > z <- c(5,2,-3,8)

    > which(z > 8)

    [1] 1 3 4

    ```


    The result says elements 1, 3, and 4 of z have squares greater than 8.

    As with filtering, it is important to understand exactly what occurred in the
    preceding code. The expression


    ```

    z*z > 8

    ```


    is evaluated to (TRUE,FALSE,TRUE,TRUE,TRUE). The which() function simply reports
    elements of the latter expression are TRUE.'
