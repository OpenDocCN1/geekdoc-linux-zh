    and logical operations, vector indexing, and some useful ways to create vectors.
    Then we''ll look at two extended examples of using these operations.


    # 2.4.1 Vector Arithmetic and Logical Operations


    Remember that R is a functional language. Every operator, including + in the following
    example, is actually a function.'
