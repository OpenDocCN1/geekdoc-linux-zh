  md: '# ### 16.4.1 Sources of Overhead


    Having at least a rough idea of the physical causes of overhead is essential to
    successful parallel programming. Let''s take a look at these in the contexts of
    the two main platforms, shared-memory and networked computers.


    # #### 16.4.1.1 Shared-Memory Machines


    As noted earlier, the memory sharing in multicore machines makes for easier programming.
    However, the sharing also produces overhead, the two cores will bump into each
    other if they try to access memory at the same time. This means that one of them
    need to wait, causing overhead. That overhead is typically in the range of hundreds
    of nanoseconds (billions of seconds). This sounds small, but keep in mind that
    the CPU is working at a subnanosecond speed, so memory access often becomes a
    bottleneck.


    Each core may have a cache, in which it keeps a local copy of the shared memory.
    It''s intended to reduce contention among the cores, but it produces its own overhead,
    spending time keeping the caches consistent with each other.


    Recall that GPUs are special types of multicore machines. As such, they suffer
    from the problems I''ve described, and more. First, the latency, which is the
    time delay before the first bit arrives at the GPU from its memory request, is
    quite long in GPUs.


    There is also the overhead incurred in transferring data between the host and
    the device. The latency here is on the order of microseconds (milliseconds of
    seconds), an eternity compared to the nanosecond scale of the CPU and GPU.


    GPUs have great performance for certain classes of applications, but overhead
    can be a major issue. The authors of guests note that their matrix operations
    starting a speedup only at matrix sizes of 1000 by 1000. A GPU version of our
    multlik application, which turned out to have a runtime of 3.0 seconds—about half
    of the new version but still slower than the OpenMP implementation.


    Again, there are ways of ameliorating these problems, but they require very careful,
    creative programming and a sophisticated knowledge of the physical GPU.


    # #### 16.4.1.2 Networked Systems of Computers


    As you said, another way to achieve parallel computation is through networked
    systems of computers. You still have multiple CPUs, but in this case, they are
    in separate computers, each with its own memory.


    As pointed out, network data transfer carries overhead. Its latency is on the
    order of microseconds. Thus, even accessing a small amount of data across the
    network incurs a major delay.


    Note that sees has additional overhead, as it changes objects such as vectors
    and matrices to character form before sending them, from the manager to the workers.
    Not only does this entail time for the conversion (both in changing from numeric
    to character form and'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'in charging back to numeric at the receiver), but the character form tends
    to make for much longer messages, longer network transfer time.

    Shared-memory systems can be networked together, which, in fact, we did in the
    previous example. We had a hybrid situation in which we formed snow clusters from
    several networked dual-core computers.


    # 16.4. Embarrassingly Parallel Applications and Those That Aren''t


    > It''s no shame to be poor, it''s no great honor.

    —Teveye, Fiddler on the Roof


    > Man is the only animal that blushes, and needs to.

    —Mark Twain


    The term *embarrassingly parallel* is heard often in talk about parallel R (and
    in the parallel processing field in general). The word *embarrassing* alludes
    to the fact that the problems are so easy to parallelize that there is no intellectual
    challenge involved; they are embarrassingly easy.


    Both of the examples we''ve looked at would be embarrassingly parallel. Parallelizing
    the *for* loop for the outlines problem in Section 16.1 was pretty obvious. The
    working in the KMC example in Section 16.2-4 was also natural and easy.


    By contrast, parallel sorting algorithms require a great deal of interaction.
    For instance, consider sorting the vector by divided into two (or more) independent
    parts, say the left half and right half, which are then sorted in parallel by
    two processes. So far, this is embarrassingly parallel, at after the vector is
    divided. But then the two halves must be merged to produce the sorted version
    of the original vector, and that process is embarrassingly parallel. but in a
    more complex manner.


    Of course, to paraphrase Teveye, it''s no shame to have an embarrassingly parallel
    problem! It may not be an honor, but it is a cause for celebration, as it is easy
    to program. More importantly, embarrassingly parallel problems tend to have low
    communication overhead, which is crucial to performance, as discussed earlier.
    In fact, most people need to embarrassingly parallel applications, they have this
    low overhead in mind.


    But about nonembarrassingly parallel applications? Unfortunately, parallel R is
    simply not suitable for many of them for a very basic reason: the functional programming
    nature of R. As discussed in Section 14.5, a statement like this:


    ```

    x[3] < 8

    ```


    is deceptively simple, because it can cause the entire vector x to be rewritten.
    Accordingly, if your application is not embarrassingly parallel, your best strategy
    is to write the computationally intensive parts of the code in C, using OpenMP
    or GPU programming.'
