    # 9.4.3 Saving a Collection of Objects with the save() Function


    Calling save() on a collection of objects will write them to disk for later retrieval
    by load(). Here''s a example:


    ```

    > z <- rnorm(10000)

    > hz <- hist(z)

    > save(hz,"hzfile")

    > ls()

    [1] "hz"

    > ls()

    [1] "z"

    > load("hzfile")

    > ls()

    [1] "hz"

    > plot(hz) # graph window pops up

    ```


    Here, we generate data and draw a histogram of it. But we also save the output
    of hist() in a variable, hz. That variable is an object of class "histogram,".
    Anticipating that we will want to reuse this object in a later session, we use
    the save() function to save the object in the file hzfile. It can be reloaded
    in that future session via load(). To demonstrate this, we deliberately remove
    the object, then show that it has indeed been reloaded.


    I needed to read in a very large data file, each record of which required processing.
    I used save() to keep the R object version of the processed file for future R
    sessions.


