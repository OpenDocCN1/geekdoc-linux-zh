  md: '# 12.4 Creating Three-Dimensional Plots


    R offers a number of functions to plot data in three dimensions such as persp()
    and wireframe(), which draws surfaces, and cloud(), which draws three-dimensional
    scatter plots. Here, we''ll look at a simple example that uses wireframe().


    ```

    > library(Lattice)

    > a <- 1:10

    > b <- 1:15

    > eg <- expand.grid(x=a,y=b)

    > eg2 <- eg$x2 + eg$x + eg$y

    > wireframe(z ~ x+y, eg)

    ```


    First, load the lattice library. Then the call to expand.grid() creates a data
    frame, consisting of two columns named x and y, in all possible combinations of
    the two inputs. Here, a and b have 10 and 15 values, so the resulting data frame
    will have 150 rows. (Note that the data frame is input to wireframe() does not
    to be created by expand.grid())


    We added a third column, z, as a function of the first two columns. Our call to
    wireframe() creates the graph. The arguments, given in regression model format,
    specify that z is to be graphed against x and y. Of course, z, x, and y refer
    to names of columns in eg. The result is shown in Figure 12-13.


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_307_0.png)


    Figure 12-13: Example of using wireframe()'
