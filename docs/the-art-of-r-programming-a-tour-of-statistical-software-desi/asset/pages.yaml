    4 n <- ncol(m)

    5 matches <- 0

    6 for (i in ichunk) {

    7 if (i < n) {

    8 row <- m[i];

    9 matches <- matches +

    10 sum(m[(i+1):n,])%%row)

    11 }

    12 }

    13 matches

    14 }

    ```'
