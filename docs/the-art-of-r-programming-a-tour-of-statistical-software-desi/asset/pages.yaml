  md: '# 10.2.4 Extended Example: Reading PUMS Census Files


    The U.S. Census Bureau makes census data available in the Public Use Microdata
    Samples (PUMS). The term microdata means that we are dealing with raw data and
    each record is for a real person, as opposed to statistical variables. Data on
    many variables are included.


    The data is organized by household. For each unit, there is first a Household
    record, describing the characteristics of that household, followed by one Person
    record for each person in the household. Household records 106 and 107 (with numbering
    starting at 1) in the Household record state the number of Persons for that household.
    (The number can be very large, since some institutions count households.)


