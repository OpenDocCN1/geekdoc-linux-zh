  md: 'Python is an elegant and powerful language, but it lacks built-in facilities
    for statistical and data manipulation, two areas in R excels. This section demonstrates
    how to call R from Python, using RPy, one of the most popular interfaces between
    the two languages.


    # ## 15.2.1 Installing RPy


    RPy is a Python module that allows access to R from Python. For extra efficiency,
    it can be used in conjunction with NumPy.

    You can build the module from the source, available from http://rpy_source.forge.net,
    or download a prebuilt version. If you are running Ubuntu,

    simple type this:


    ```

    sudo apt-get install python-rpy

    ```


    To load RPy from Python (whether in Python interactive mode or code), execute
    the following:


    ```

    from rpy import *

    ```


    This will load a variable r, which is a Python class instance.


    # ## 15.2.2 RPy Syntax


    Running R from Python is in principle quite simple. Here is an example of a command
    you might run from the >>> Python prompt:


    ```

    >>> r.hist(r.norm(100))

    ```


    This will call the R function rnorm() to produce 100 standard normal variables
    and then plot those values into R''s histogram function, hist().

    As you see, R names are prefixed by r-, reflecting the fact that Python wrappers
    for R functions are members of the class instance r.

    The preceding code, if not refined, produce ugly output, with (possibly unwanted)!
    data appearing as the graph title and the x-axis label.

    You can avoid this by supplying a title and label, as in this example:


    ```

    >>> r.hist(r.norm(100),main='''',xlab='''')

    ```


    RPy syntax is sometimes less simple than these examples you would like to believe.
    The problem is that R and Python syntax may clash. For instance,'
