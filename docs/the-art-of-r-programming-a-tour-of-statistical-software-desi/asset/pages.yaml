    #  2.8.2 Filtering with the subset() Function


    Filtering can be done with the subset() function. When applied to vectors, the
    difference between using this function and ordinary filtering lies in the manner
    where NA values are handled.


    ```

    > x <- c(6,1:3,NA,12)

