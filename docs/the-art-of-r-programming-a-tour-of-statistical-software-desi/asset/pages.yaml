    # 9.1.4 S3 Classes


    S3 classes have a rather cobbled-together structure. A class instance is created
    by a list, with the components of the list being the variables of the class. (Readers
    who know Perl may recognize this ad hoc nature in Perl’s own OOP system). The
    “class” attribute is set by hand using the attr() or class() function, and then
    various implementations of generic functions are defined. We can see this in the
