  md: '# 13.3.2 Using Browser Commands


    While you are in the browser, the prompt changes from > to Browse[d].n(Here, d
    is the depth of the chain call.) You may submit any of the following commands
    at that prompt:


    +   * n (for next): Tells R to execute the next line and then pause again. Hitting
    ENTER causes this action, too.

    * c (for continue): This is n, except that several lines of code may be executed
    before the next pause. If you are currently in a loop, this command will return
    the remainder of the loop being executed and then pausing upon exit from the loop.
    If you are in a function but not in a loop, the remainder will be executed before
    the next pause.

    * Any R command: While in the browser, you are still in R''s interactive mode
    and thus can query the value of, say, x by simply typing x. Of course, if you
    have a variable with the same name as a browser command, you must explicitly call
    print(), as in print).

    * where: This prints a stack trace. It displays sequence of function calls execution
    to the current location.

    * Q: This quits the debugger, returning you to R''s main interactive mode.


    # 13.3.3 Setting Breakpoints


    debug(f) places a call to browser() at the beginning of f(). However, this might
    be too coarse in some cases. If you suspect the bug is in the middle of the function,
    it''s wasteful to trudge through all the intervening.


    The solution is to set breakpoints at certain key locations of your code—where
    you want execution to be paused. How can this be done in R? You can call browser
    directly or use the setBreakpoint() function (with R 2.10 and later).


    # 13.3.1 Calling browser() Directly


    You can set a breakpoint by inserting calls to the places of interest in your
    code. This has the effect, essentially, of setting breakpoints there.


    You may make invoking the browser conditional so that it is entered only in specified
    situations. Use the expr argument to define those situations. For instance, suppose
    you suspect that your bug arises only when a certain variable is larger than 1.
    You could use this code:


    ```

    browser(s > 1)

    ```'
