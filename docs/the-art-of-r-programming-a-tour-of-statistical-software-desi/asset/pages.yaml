    [1] 2


    Let''s look the impact (or not) on the three top-level variables x, z,

    and u:


    +   * Even though x was the actual argument to two() in the example, it retained
    the value 1 after the call. This is because value 1 was copied to the formal argument
    u, which is treated as a local variable within the function, when u changed, x
    did not change with it.

    * z: The two z values are entirely unrelated to each other—one is top level, and
    the other is local to two(). The change in the local variable has no effect on
    the global variable. Having two variables with the same name is probably not good
    programming practice.

    * u: The value did not exist as a top-level variable prior to calling two(), hence
    the "not found" error message. However, it was created as a top-level variable
    by the superassignment operator within two(), as confirmed after the call.


    Though is typically used to write top-level variables, as in our example, technically,
    it does something bit different. Use of this operator to write a variable will
    result in a search up the environment hierarchy, stopping at the first level at
    a variable of that name is encountered. If none is found, then the level selected
    will be global. Look what happens in this example:


    ```

    function(){

    inc <- function()(x <<- x + 1)

    x <<- 3

    inc()

    return(x)

    }

    f()

    [1] 4

    x

    Error: object ''x'' not not found

    ```


    Here, inc() is defined within f(). When inc() is executing, and the R interpreter
    sees a superassignment to x, it starts going up the hierarchy. At the first level
    up—the environment within f()— finds an x, and so that x is the one that is written
    to, not x at the top level.'
