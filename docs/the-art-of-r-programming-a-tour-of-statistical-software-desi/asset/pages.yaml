    # 12.2.3 Adding a Polygon: The polygon() Function


    You can use polygon() to draw arbitrary polygonal objects. For example, the following
    code draws the graph of the function $f(x) = 1 - e^{-x}$ and then adds a rectangle
    that approximates the area under the curve from $x = 1$ to $x = 1.4.


    ```

    > f <- function(x) return(1-exp(-x))

