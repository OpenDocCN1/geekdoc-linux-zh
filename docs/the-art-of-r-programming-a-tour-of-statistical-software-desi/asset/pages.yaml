    Table 7-1 lists the basic operators.


    | Operation | Description |

    | --- | --- |

    | x + y | Addition |

    | x - y | Subtraction |

    | x * y | Multiplication |

    | x / y | Division |

    | x ^ y | Exponentiation |

    | x % y | Modular arithmetic |

    | x // y | Integer division |

    | x == y | Test for equality |

    | x < y | Test for less than or equal |

    | x >= y | Test for greater than or equal to |

    | x && y | Boolean AND for scalars |

    | x || y | Boolean OR for scalars |

    | x != y | Boolean AND for vectors (vector x,y,result) |

    | x != y | Boolean negation |


    Though R ostensibly has no scalar types, with scalars being treated as one-element
    vectors, we see the exception in Table 7-1: There are different Boolean operators
    for the scalar and vector cases. This may seem odd, but a simple example will
    demonstrate the need for such a distinction.


    ```

    > x

    [1] TRUE FALSE TRUE

    > y

    [1] TRUE FALSE TRUE

    > x && y

    [1] TRUE FALSE FALSE

    > x[1] && y[1]

    [1] TRUE

    > x && y # looks at the first elements of each vector

    [1] TRUE

    if (x[1] && y[1]) print("both TRUE")

    [1] "both TRUE"

    if (x & y) print("both TRUE")

    [1] "both TRUE"

    ```


    Warning message:

    In (x & y) print("both TRUE")

    The condition length > 1 and only the first element will be used


    The central point is that in evaluating an if, we need a single Boolean, not a
    vector of Booleans, hence the warning seen in the preceding example, as well as
    the need for having both the & and && operators.'
