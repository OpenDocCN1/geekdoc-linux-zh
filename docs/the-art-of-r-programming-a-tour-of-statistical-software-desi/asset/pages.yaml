  md: '# 15


    # # INTERFACING R TO OTHER LANGUAGES


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_348_0.png)


    R is a great language, but it can''t do everything well. Thus, it is sometimes
    desirable to call code written in other languages from R. Conversely, when working
    in other great languages, you may encounter tasks that could be better done in
    R.


    R interfaces have been developed for a number of other languages, from ubiquitous
    languages like C to esoteric ones like the Yacas computer algebra system. This
    chapter will cover two interfaces: one for calling C/++ from R and the other for
    calling R from Python.


    # ## 15.1 Writing C/++ Functions to Be Called from R


    You may wish to write your own C/++ functions to be called from R. Typically,
    the goal is performance enhancement, since C/++ code may run much faster than
    R, even if you use vectorization and R optimization techniques to speed things
    up.


    Another possible goal in dropping down to the C/++ level is specialized I/O. For
    example, R uses the TCP protocol in layer 3 of the standard Internet communication
    system, but UDP can be faster in some settings.'
