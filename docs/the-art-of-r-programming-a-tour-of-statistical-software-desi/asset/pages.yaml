    # 5.4 Applying Functions to Data Frames


    With lists, you could use the apply() and sapply functions with data frames.


    # 5.4.1 Using apply() and sapply() on Data Frames


    Keep in mind that data frames are special cases of lists, with the list comp-

    consisting of the data frame’s columns. Thus, you will call apply() on a

    d frame with a specified function f(), f() will be called on each of

    t frame’s columns, with the return values placed in a list.'
