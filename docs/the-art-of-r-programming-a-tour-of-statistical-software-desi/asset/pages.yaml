- img_proc: true
  md: "```\nimp[n,] <- rep(1,n)\nrhs <- c(rep(0,n-1),rhs)\npivec <- solve(imp,rhs)\n\
    return(pivec)\n```\n\nHere are the main steps:\n\n+   1. Calculate $I - P^{it}$\
    \ in line 3. Note again that $diag()$, when called with a scalar argument, returns\
    \ the identity matrix of the size given by that argument.\n2. Replace the last\
    \ row of $P$ with 1 values in line 4.\n3. Set up the right-hand side vector in\
    \ line 5.\n4. Solve for $\\pi$ in line 6.\n\nAnother approach, using more advanced\
    \ knowledge, is based on eigenvectors. From Equation 8.4 that $\\pi$ is a left\
    \ eigenvector of $P$ with value 1. This suggests using $R$'s eigen() function,\
    \ selecting the eigenvector to that eigenvalue. (A result from mathematics, the\
    \ Perron-Frobenius theorem, can be used to justify this.)\nSince $\\pi$ is a left\
    \ eigenvector, the argument in the call to eigen() must be $P$ transpose rather\
    \ than addition, since an eigenvector is unique up to scalar multiplication, we\
    \ must deal with two issues regarding the eigenvector returned to use by eigen():\n\
    \n+   * It may have negative components. If so, we multiply by $-1$.\n* It may\
    \ not satisfy Equation 8.6. We remedy this by dividing by the length of the returned\
    \ vector.\n\nHere is the code:\n\n```\nfindpi <- function(p) {\n  n <- nrow(p)\n\
    \  # first eigenvector of P transpose\npivec <- eigen(t(p))$vectors[,1]\n  # guaranteed\
    \ to be real, but could be negative\n  if (pivec[1] < 0) pivec <- -pivec\n  #\
    \ normalize to sum to 1\n  pivec <- pivec / sum(pivec)\n  return(pivec)\n}\n```\n\
    \nThe return value of eigen() is a list. One of the list is a matrix named vectors.\
    \ These are the eigenvectors, with the $i^{th}$ column being the eigenvector corresponding\
    \ to the $i^{th}$ eigenvalue. Thus, we take column 1 here."
