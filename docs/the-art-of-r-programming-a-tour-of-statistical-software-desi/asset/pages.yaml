  md: '# INTRODUCTION


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_20_0.png)


    R is a scripting language for statistical data manipulation and analysis. It was
    inspired by, and is mostly compatible with, the statistical language S developed
    by AT&T. The name S, for statistics, was an allusion to another programming language
    with a one-letter name developed at AT&T—the famous C language. S later was sold
    to a small firm, which added a graphical user interface (GUI) and named the result
    S-Plus.


    R has become more popular than S or S-Plus, both because it''s free and more people
    are contributing to it. R is sometimes called GNU S, to reflect its open source
    nature. (The GNU Project is a major collection of open source software.)


    # Why Use R for Your Statistical Work?


    As the Cantonese say, *yauh peng, yauh leng,* which means "both inexpensive and
    beautiful." Why use anything else?'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'R has a number of virtues:


    +   - It is a public-domain implementation of the widely regarded S statistical
    language, and the R/S platform is a facto standard among professional statisticians.


    +   - It is comparable, and often superior, in power to commercial products in
    most of the significant senses—variety of operations available, programmability,
    graphics, and so on.


    +   - It is available for the Windows, Mac, and Linux operating systems.


    +   - In addition to providing statistical operations, R is a general-purpose
    programming language, so you can use it to automate and create new functions that
    extend the existing language features.


    +   - It incorporates features found in object-oriented and functional programming
    languages.


    +   - The system saves data between sessions, so you don''t need to reload each
    time. It saves your command history too.


    +   - Because R is open source software, it''s easy to get help from the user
    community. Also, a lot of new functions are contributed by users, many of whom
    are prominent statisticians.


    I would warn you at the outset that you typically submit commands to R by typing
    in a terminal window, rather than clicking a mouse in a GUI, and most R users
    do not use a GUI. This doesn''t mean R doesn''t have graphics. On the contrary,
    it includes tools for producing graphics of great utility and beauty, which are
    used for system output, as plots, not for user input.


    If you can''t live without a GUI, you can use one of the free GUIs that have been
    developed for R, such as the following open source or free tools:


    +   - RStudio, http://www.rstudio.org/


    +   - StatET, (Stat Statistics), http://ess.r-project.org/


    +   - ESS (Emacs Statistics), http://ess.r-project.org/


    +   - R Commander: John Fox, "The R Commander: A Basic-Graphics Interface to R,"
    Journal of Statistical Software 14, no. 9 (2005):1–12.


    +   - JGR (Java GUI for R), http://cran.r-project.org/packages/JGR/index.html


    The first three, RStudio, StatET and ESS, should be considered integrated development
    environments (IDEs), aimed more toward programming. StatET and ESS provide the
    R programmer with an IDE in the famous Eclipse and Emacs settings,


    On the commercial side, other IDE is available from Revolution Analytics, (http://www.revolutionanalytics.com/).


    Because R is a programming language rather than a collection of commands, you
    can combine several commands, using the output of the previous one. (Linux will
    recognize the similarity of chaining'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'shell commands using pipes.) The ability to combine R functions gives tremendous
    flexibility and, if used properly, is quite powerful. As a simple example, consider
    this (compound) command:


    ```

    nrow(subset(x3, z == 1))

    ```


    First, the subset() function takes the data frame x3 and extracts all records
    for the variable z has the value 1. In a new frame, which is then fed to the nrow()
    function. This function counts the number of rows in a frame. The net effect is
    a count of z = 1 in the original frame.


    The object-oriented programming and functional programming were mentioned earlier.
    These topics pique the interest of computer scientists, and although they be somewhat
    foreign to most readers, they are relevant to anyone who uses R for statistical
    programming. The following sections provide an overview of topics.


    # Object-Oriented Programming


    The advantages of object orientation can be explained by example. Consider statistical
    regression. When you perform a regression with other statistical packages, such
    as SAS or SPSS, you get a mountain of output on the screen. By contrast, if you
    call the lm() function in R, it returns an object containing all the results—coefficients,
    their standard errors, and so on. You then pick and choose, programmatically,
    which parts of that object to extract.


    You will see that R''s approach makes much easier, because it offers a certain
    uniformity of access to data. This uniformity stems from the fact that R is polymorphic,
    which means that a single function can be applied to different types of inputs,
    which the function processes in the appropriate way. Such a function is called
    a generic function. If you are a C++ programmer, consider the get() function in
    virtual functions.


    For instance, consider the plot() function. If you apply it to the output of a
    regression analysis, you get a simple plot. But if you apply it to sets of plots
    various aspects of the analysis. You can use the plot() function on just any object
    produced by R. This is nice, since it means that you, as a user, have few commands
    to remember!


    # Functional Programming


    As is in functional programming languages, a common theme in R programming is
    avoidance of explicit iteration. Instead of coding loops, you exploit R''s functional
    features, which let you express iterative behavior implicitly. This can lead to
    code that executes much more efficiently, and it can make a huge time difference
    when running R on large datasets.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'As you will see, the functional programming nature of the R language offers
    many advantages:


    +   - Clearer, more compact code

    - Potentially much faster execution speed

    - Less debugging, because the code is simpler

    - Easier transition to parallel programming


    # Whom Is This Book For?


    Many use R mainly in an ad hoc way—to plot a histogram, perform a regression analysis,
    and carry out other discrete tasks involving statistical operations. The programming
    skills of intended readers make those who wish to develop software anywhere from
    professional software developer to college, but their key goal is to write R for
    specific purposes. (Statistical knowledge will generally not be needed).

    Here are examples of people who may benefit from this book:


    +   - Analysts employed by, a hospital or government agency who produce statistical
    reports on a regular basis and need to develop programs for this purpose

    - Academic researchers developing statistical methodology that is either new or
    combining methods into integrated products who need to codify this methodology
    so that it can be used by the general research community

    - Specialists in marketing, litigation support, journalism, publishing, and on
    who need to develop code to produce sophisticated graphical of data

    - Professional programmers with experience in software development who have been
    assigned by their employers to projects involving statistical analysis

    - Students in statistical computing courses


    Accordingly, this is not a compendium of the myriad types of statistical methods
    that are available in the wonderful R package. It is really about programming
    and covering-related topics missing most other books on R. I place a programming
    spin on even the basic subjects. Here are examples of this approach in action:


    +   - Throughout the book, you''ll find "Extended Example" sections. These usually
    present complete, general-purpose functions rather than isolated code fragments
    based on specific data. Indeed, you may find some of these functions useful for
    your own daily R work. By studying these examples, you learn not only how individual
    R constructs work but also how to put them into into a useful program. In many
    cases, I''ve'
