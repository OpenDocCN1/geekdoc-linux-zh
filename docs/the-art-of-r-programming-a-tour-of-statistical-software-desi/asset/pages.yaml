  md: '# 5


    # # DATA FRAMES


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_126_0.png)


    On an intuitive level, a *data frame* is like a matrix, with a two-dimensional
    rows-and-columns structure. However, it differs from a matrix in that each column
    may have a different mode. For instance, one column may consist of numbers, and
    another column might have character strings. In this sense, just as lists are
    heterogeneous analogs of vectors in one dimension, data frames are the heterogeneous
    analogs of matrices for two-dimensional data.


    On a technical level, a data frame is a list, with the components of list being
    equal-length vectors. Actually, R does allow the components to be other types
    of objects, including other data frames. This gives us heterogeneous-data analogs
    of arrays in our analogy. This use of data frames is rare in practice, and in
    this book, we will assume all components of a data frame are vectors.


    In this chapter, we''ll present quite a few data frame examples, so you can become
    familiar with their variety of uses in R.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 5.1 Creating Data Frames


    To begin, let''s take another look at our simple data frame example from Section
    1.4:5:


    ```

    > kids <- c("Jack","Jill"

    > ages <- c(12,10)

    > d <- data.frame(kids,ages,stringsAsFactors=FALSE)

    > d # matrix-like viewpoint

    kids

    1 Jack 12

    2 Jill 10

    ```


    The two arguments in the call to data.frame() are clear: We wish to produce a
    data frame from our two vectors: kids and ages. However, the third argument, stringsAsFactors=FALSE
    is not specified, by default, the named argument stringsAsFactors is TRUE. You
    can also use options() to arrange the opposite default. This means that if we
    create a data frame from a character vector—in this case, kids—R will convert
    that vector to a factor. Because our work with data will typically be with vectors
    rather than factors, we''ll set stringsAsFactors to FALSE. We''ll cover factors
    in Chapter 6.


    # 5.1.1 Accessing Data Frames


    Now that we have a data frame, let''s explore it a bit. Since d is a list, we
    can access it via some index values or components:


    ```

    > d[[1]]

    [1] "Jack"Jill"

    > d$kids

    [1] "Jack"Jill"

    ```


    But we can treat it in a matrix-like fashion as well. For example, we can view
    column 1:


    ```

    > d[,1]

    [1] "Jack"Jill"

    ```


    This matrix-like quality is also seen when we take d apart using str():


    ```

    > str(d)

    ''data.frame'': 2 obs. of 2 variables:

    $ kids: chr "Jack"Jill"

    $ ages: num 12 10

    ```


    R tells us that d consists of two observations—our two rows—that store data on
    two variables—our two columns.'
