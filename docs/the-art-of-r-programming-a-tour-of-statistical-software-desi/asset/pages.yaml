    \ tapply() will return the mean incomes in each of four subgroups:\n\n+   - Male\
    \ and under 25 years old\n- Female and under 25 years old\n- Male and over 25\
    \ years old\n- Female and over 25 years old\n\nHere's a toy example of that setting:\n\
    \n```\n> d <- data.frame(list(gender=c(\"M\",\"M\",\"F\",\"M\",\"F\",\"F\"),\n\
    \  age=c(47,59,21,32,33,24),income=c(55000,88000,32450,76500,123000,45650))\n\
    \  gender age\n  M 47 55000\n  M 59 88000\n  F 21 32450\n  M 32 76500\n  F 33\
    \ 123000\n  F 24 45650\n> d$over25 <- ifelse(d$age > 25,1,0)\n> d\n  gender age\
    \ over25\n  M 47 55000 1\n  M 59 88000 1\n  F 21 32450 0\n  M 32 76500 1\n  F\
    \ 33 123000 1\n  F 24 45650 0\n> tapply(d$income,list(d$gender,d$over25),mean)\n\
    \  0      1\n  M 39050 123000.0\n  NA 73166.67\n```\n\nWe specified two factors,\
    \ gender and indicator variable for age over 25. Since each of these factors has\
    \ two levels, tapply() partitioned the income into four groups, for each combination\
    \ of gender and age, and then applied mean() function to each group.\n\n# 6.2.2\
    \ The split Function\n\nIn contrast to apply(), which splits a vector into groups\
    \ and then applies a specified function on each group, split() stops at the first\
    \ stage, forming the groups.\nThe basic form, without bells and whistles, is split(x,f),\
    \ with x and f playing roles similar to those in the call tapply(x,f,g); that\
    \ is, x being a vector or data frame and f being a factor or a list of factors.\
    \ The action is to split x"
