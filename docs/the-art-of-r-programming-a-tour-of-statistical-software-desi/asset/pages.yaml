    # 1.7.5 Help for Batch Mode


    Recall that R has batch commands that allow you to run a command directly from
    your operating system''s shell. To get help on a particular batch-command, you
    can type:


    ```

    R CMD command --help

    ```


    For example, to learn all the options associated with the INSTALL command (discussed
    in Appendix B), you can use this:


    ```

    R CMD INSTALL --help

    ```


    # 1.7.6 Help on the Internet


    There are many excellent resources on R on the Internet. Here are a few:


    +   * The R Project''s on manuals are available from the R home page, http://www.r-project.org/.
    Click Manuals.

    * Various search engines are listed on the R home page. Click Search.

    * The soS package offers highly sophisticated searching of R materials. See Appendix
    B for instructions on how to install R packages.

    * I use the Rseek search engine quite often: http://www.rseek.org/

    * You can post your questions to r-help, the R list server. You can obtain information
    about this and other R list servers at http://www-r-project.org/mail.html. You
    can use various interfaces, like Gmane (http://www.gmail.org/).


    Because of its single-letter name, R is difficult to search for general-purpose
    search engines such as Google. But there are tricks you can employ. One approach
    is to use Google''s filter criterion. To search for R scripts (having a .R suffix)
    pertaining to, say, permutations, enter this:


    ```

    filetype:R permutations -rebol

    ```


    The -rebol asks Google to exclude pages with the word "rebol," as REBOL programming
    language uses the same suffix.

    The Comprehensive R Archive Network (CRAN), at http://cran.r-project.org/, is
    a repository of user-contributed R code and makes thus for a good search term.
    Searching for "lm CRAN," for instance, will help you find material in R''s ln()
    function.'
