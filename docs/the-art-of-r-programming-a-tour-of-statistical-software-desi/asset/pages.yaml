  md: '# 12.1.2 Adding Lines: The abline() Function


    We now have an empty graph, ready for the next stage, which is adding

    a line:


    +   > x <- c(1,2,3)

    > y <- c(1,3,8)

    > lmout <- lm(y - x)

    > abline(lmout)


    After the call to plot(), the graph will simply show the three points, along

    with the x and y axes with hash marks. The call to abline() then adds a line

    to the current graph. Now, which line is this?


    As learned in Section 1.5, the result of the call to the linear-regression

    function(lm) is a class instance containing the slope and intercept of the fit-

    ted, as well as other quantities that don''t concern us here. We''ve

    assigned that class to lmout. The slope and intercept will now be in

    lmout$coefficients.


    So, what happens when we call abline()? This function simply draws

    a straight line, with the function''s arguments treated as the intercept and

    slope of the line. For instance, the call abline((2,1)) draws this line on wat-

    ever graph you''ve built so far:


    ```

    y = 2 + 1 * x

    ```


    But abline takes special action if it is called on a regression

    object (though, surprisingly, it is not a generic function). Then, it will pick

    u the slope and intercept it from lmout$coefficients and plot that

    line. It superimposes this line onto the current graph, the one that graphs

    the three points. In other words, the new graph will show both the points\and
    line, as in Figure 12-2.


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_288_0.png)


    Figure 12-2: Using abline()


    Graphics 263'
