    \ think the latter and act accordingly, which is not what we want.\nAn if-else\
    \ statement works as a function call, and it returns the last value assigned.\n\
    \n```\nv <- if (cond) expression1 else expression2\n```\n\nThis will set v to\
    \ the result of expression or expression2, depending on whether cond is true.\
    \ You can use this to compact your code. Here's an example:\n\n```\n> x <- 2\n\
    > y <- if(x == 2) x else x+1\n> y\n>[1] 2\n> x <- 3\n> y <- if(x == 2) x else\
    \ x+1\n> y\n>[1] 4\n```\n\nWithout taking this tack, the code\n\n```\ny <- if(x\
    \ == 2) x else x+1\n```\n\nwould consist of the somewhat more cluttered\n\n```\n\
    if(x == 2) y <- x else y <- x+1\n```\n\nIn more complex examples, expression and/\
    \ expression2 could be function calls. On the other hand, you probably should\
    \ not let compactness priority over clarity.\nWhen working with vectors, use the\
    \ ifelse() function, as discussed in Chapter 2, as it will likely produce faster\
