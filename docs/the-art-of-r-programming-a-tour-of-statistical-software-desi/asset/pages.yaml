    # 13.4 Moving Up in the World: More Convenient Debugging Tools


    As seen, R''s debugging tools are effective. However, they''re not very

    convenient. Fortunately, there are various tools that make the process easier.

    in as chronological order of development, they are as follows:


    +   - The debug package by Mark Bravington

    - My ettiği package, which works with the Mim and Emacs text editors

    - Vitalie Spinn''s tracebug, which runs under Emacs (with the same

    gealls as debug but with more Emacs-specific features)

    - REvolution Analytics'' Integrated Development Environment (IDE)


    > NOTE As of this writing (2021), work is in progress by the time that develop
    the StatET and RStudio IDEs to add debugging tools.


    All of these tools are cross-platform, on Linux, Windows, and

    Mac systems, with the exception of the REvolution Analytics product. That

    IDE is available only on Windows systems with Microsoft Visual Studio. All of

    the tools are open source or free, again with the exception of the REvolution

    Analytics product.


    So, what do these packages have to offer? To me, one of the biggest

    problems with R'' built-in debugging tools is the lack of a window that shows

    the big picture—a window displaying your R code with a cursor that moves'
