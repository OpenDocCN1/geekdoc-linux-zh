    \ advantage of ifelse() over the standard if-then-else construct is that it is\
    \ vectorized, this potentially much faster.\n\n# 2.9.1 Extended Example: A Measure\
    \ of Association\n\nIn assessing the relation of two variables, there are many\
    \ alternatives to the standard correlation measure (Pearson product-moment correlation).\
    \ Some readers may have heard of the Spearman rank correlation, for example these\
    \ alternative measures have various motivations, such as robustness to outliers,\
    \ which are extreme and potentially erroneous data items.\nHere let's propose\
    \ a new measure, not necessarily necessary for statistical measures (actually\
    \ it is related to in use, Kendall's $\tau$), but to illustrate some of the R\
    \ programming techniques introduced in this chapter, especially (ifelse).\nConsider\
    \ vectors x and y, which are time series, for measurements of temperature and\
    \ pressure collected once each hour. We'll define our measure of association between\
    \ them to be the fraction of the time x and y increase together—that is, the fraction\
    \ of i for which y[i+1]-y[i] has the same sign as x[i+1]-x[i]. Here is the code:\n\
