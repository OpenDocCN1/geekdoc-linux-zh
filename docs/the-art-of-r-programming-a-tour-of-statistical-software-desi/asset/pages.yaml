  md: '# STRING MANIPULATION


    Although R is a statistical language with numeric vectors and matrices playing
    a central role, character strings are surprisingly important as well. Ranging
    from birth dates stored in medical research data files to textmining applications,
    character data arises frequently in R programs. Accordingly, R has a number of
    string-manipulation utilities, many of which will be introduced in this chapter.


    # 11.1 An Overview of String-Manipulation Functions


    Here, we''ll briefly review some of the many string-manipulation functions R has
    to offer. Note that the class forms shown in this introduction are very simple,
    usually omitting many optional arguments. We''ll use some of those arguments in
    our extended examples later in the chapter, but do check R''s online help for
    further details.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 11.1.1 grep()


    The call grep(pattern,x) searches for a specified substring pattern in a vector
    of strings. If x has $n$ elements—that is, it contains $n$ strings—then grep(pattern,x)
    will return a vector of length up to $n$. Each element of the vector will be the
    index in $x$ at which a match of pattern as a substring of $x$.


    Here''s an example of using grep:


    ```

    > grep("Pole"

    ```


    In the first case, the string "pole" was found in elements 2 and 3 of the second
    argument, here is the output (2,3). In the second case, string "pole" was not
    found anywhere, so an empty vector was returned.


    # 11.1.2 nchar()


    The call nchar(x) finds the length of a string x. Here''s an example:


    ```

    > nchar("South Pole")

    > [1] 10

    ```


    The string "pole" was found to have 10 characters. C programmers note: There is
    no NULL character terminating R strings.

    Note that the results of nchar() will be unpredictable if x is not in character.
    For instance, nchar(factor("abc")) turns out to be 2, and nchar("abc") is 1. For
    more consistent results on nonstring objects, use Hadley Wickham''s string package
    on CRAN.


    # 11.1.3 paste()


    The call paste(...) concatenates strings, returning the result in one long string.
    Here are some examples:


    ```

    > paste("North","Pole")

    > [1] "NorthPole"

    > paste("North","Pole",sep="")

    > [1] "NorthPole"

    > paste("North","Pole",sep=" ")

    > [1] "North Pole"

    > paste("North","and","South","Poles")

    > [1] "North and South Poles"

    ```'
