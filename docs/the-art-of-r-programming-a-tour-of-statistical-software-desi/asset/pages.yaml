    for the rectangle, and the second argument specifies the y-coordinates. The third
    argument specifies that the rectangle in this case should be shaded in solid gray.


    Another example, we could use the density argument to fill the rectangle with
    striping. This call specifies 10 lines per:


    ```

    > polygon(c(1.2,1.4,1.4,1.2),c(0,0,f(1.3),f(1.3)),density=10)

    ```'
