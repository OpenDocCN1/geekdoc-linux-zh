  md: '# 12


    # GRAPHICS


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_286_0.png)


    R has a very rich set of graphics facilities. The R home page (http://www.r-project.org/)
    has a few colorful examples, but to really appreciate R''s graphical power, browse
    through the R Graph Gallery at http://addicted.to/free/graphics.


    In this chapter, we cover the basics using R''s base, or traditional, graphics
    package. This will give you enough foundation to start working with graphics in
    R. If you''re interested in pursuing R graphics further, you may want to refer
    to the excellent books on the subject.


    # 12.1 Creating Graphics


    To begin, we''ll look at the foundational function for creating graphics: plat().
    Then we''ll explore how to build a graph, from adding lines and points to attaching
    a legend.


    > ¹ These include Hadley Wickham, ggplot2: Elegant Graphics for Data Analysis
    (New York: Springer-Verlag, 2009); Dianme Cook and Deborah F. Swayne, Interactive
    and Dynamic Graphics for Data Analysis: With R and Gibbs (New York: Springer-Verlag,
    2007); Deepan Sarkar, Lattice: Multivariate Data Visualization with R (New York:
    Springer-Verlag, 2008); and Paul Murrell (Boca Raton, FL: Chapman and Hall/CRC,
    2011).'
