    # 4.2 General List Operations


    Now that you''ve seen a simple example of creating a list, let''s look at how
    to access and work with lists.


    # 4.2.1 List Indexing


    You can access a list component in different ways:


    ```

    > $salary

    [1] 55000

    > j["salary"]\n[1] 55000

    > j[[2]]

    [1] 55000

    ```


    > We refer to list components by their numerical indices, treating the list as
    a vector. However, note that in this case, we use double brackets instead of ones.
    So, there are three ways to access an individual component of c of a list 1st
    and return it in the data type of c:


    +   * 1st

    * 1st["c"]\n* 1st[[i]], where i is the index of c within 1st


    Each of these is useful in different contexts, as you will see in sub-sequence
    phrases. But note the qualifying phrase, "return it in the data type of c". An
    alternative to the second and third techniques is to use single brackets rather
    than double brackets:


    +   * 1st["c"]

    * 1st(i), where i is the index of c within 1st


    Both single-bracket and double-bracket indexing access list elements in vector-index
    fashion. But there is an important difference from ordinary (atomic) vector indexing.
    If single brackets [ ] are used, the result is'
