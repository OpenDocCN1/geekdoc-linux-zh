    # 3.8 Higher-Dimensional Arrays


    In a statistical context, a typical matrix in R has rows corresponding to observations,
    say on various people, and columns corresponding to variables, such as weight
    and blood pressure. The matrix is then a two-dimensional data structure. But suppose
    we have data at different times, one data point per variable per time. Time then
    becomes the third dimension, in addition to rows and columns. In R, such data
    sets are called arrays.

    A simple example, consider students and test scores. Say each test consists of
    two parts, so we record two scores for a student for each test. Suppose that we
    have two tests, and to keep the example small, assume we have only three students.
    Here''s the data for the first test:


    > firsttest

    [1,] [2]

    [1,] 46 30

    [2,] 21 25

    [3,] 50 50


    Student 1 had scores of 46 and 30 on the first test, student 2 scored 21 and 25,
    and so on. Here are the scores for the same students on the second test:


    > secondtest

    [1,] [2]

    [1,] 46 43

    [2,] 41 35

    [3,] 50 50


    Now let''s put both tests into one data structure, which we will name tests. We''ll
    arrange it to have two "layers"—one layer per test—with three rows'
