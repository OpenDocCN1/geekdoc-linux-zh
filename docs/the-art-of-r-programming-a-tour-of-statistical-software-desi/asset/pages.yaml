  md: "# 7.9 Recursion\n\nOnce a mathematics PhD student I knew to be quite bright,\
    \ but who had little programming background, sought my advice on how to write\
    \ a function. I quickly said, \"You don't even need to tell me what the function\
    \ is supposed to do. The answer is to use recursion.\" Started, he asked recursion.\
    \ I advised him to read about the famous Towers of Hanoi. Soon enough, he returned\
    \ the day, reporting that he was able to solve it in just a few lines of code,\
    \ using recursion. Obviously, recursion can be a powerful tool. Well, what is\
    \ it?\n\nA recursive function calls itself. If you have not encountered this concept\
    \ before, it might sound odd, but the idea is actually simple. In rough terms,\
    \ the idea is:\n\n+   To solve by writing a recursive function f():\n1. Break\
    \ the original problem of type X into one or smaller problems of type X.\n2. Within\
    \ f(), call f() on each of the smaller problems.\n3. Within f(), piece together\
    \ the results of (b) to solve the original problem.\n\n# 7.9.1 A Quicksort Implementation\n\
    \nA classic example is Quicksort, an algorithm used to sort a vector of numbers\
    \ from smallest to largest. For instance, suppose we wish to sort the vector (5,12,13,8,88).\
    \ We first compare everything to the first element, 5, to form two subvectors:\
    \ one consisting of elements less than 5 and the other consisting of the elements\
    \ greater or equal to 5. That gives us subvectors (4,3) and (12,13,8,88). We then\
    \ call the function on the subvectors, returning (3,4) and (8,12,13,88). We string\
    \ those together with the 5, yielding (3,4,5,8,12,13,88), as desired.\n\nR's vector-filtering\
    \ capability and its c() function make implementation of Quicksort quite easy.\n\
    \n> NOTE This is for the purpose of demonstrating recursion. R's own sort function,\
    \ sort(), is faster, as it is written in C.\n\n```\nqs <- function(x) {\n  if\
    \ (length(x) <= 1) return(x)\n  pivot <- x[1]\n  therest <- x[-1]\n  sv1 <- fastest[therest\
    \ < pivot]\n  sv2 <- fastest[therest >= pivot]\n  sv1 <- qs(sv1)\n  sv2 <- qs(sv2)\n\
    \  return(c(sv1,pivot,sv2))\n}\n```"
