  md: 'To explain what mapsound() does, let''s devise some terminology, illustrated
    by the $x \rightarrow h$ example earlier. We''ll call $x$ the *source* value,
    with $h, s$, and so on the *mapped* values.


    Here are the formal parameters:


    +   - df: A data frame consisting of the pronunciation data of two fangyan

    - fromcol and ncol: Names in $df$ of the source and mapped columns

    - source: The source value to be mapped, such as $x$ in the preceding example


    Here is the head of a typical two-fangyan data frame, canman, that would be used
    for $df:


    ```

    > head(canman)

    ```


    | | Can | Man Can Cons Sound Can Tone Man Cons Man Man tone |

    |---|---|---|---|---|---|---|---|---||

    | 1 | | yati | y | at | | | y | 1 |

    | 2 | | dng | d | ing | | | d | ing 1 |

    | 3 | | chat | q11 | ch | at | | q | i 1 |

    | 4 | | Jeung6 | j | | | 6 | ang 4 |

    | 5 | | seheng5 | s | eung | | sh | ang 3 |

    | 6 | | | | xia4 | h | a | | X | ia 4 |


    The function returns a list containing two components:


    +   - counts: A vector of integers, indexed by the mapped values, showing the
    counts of those values. The elements of the vector are named according to the
    mapped values.

    - images: A list of character vectors. Again, the indices of the list are the
    mapped values, and each vector consists of all the characters that correspond
    to the given value.


    To make this, let''s try it out:


    ```

    > m2cx <- mapsound(canman8,"Man cons,"Cons,"x")

    > m2cx$counts

    ch f g h j k w n s y

    15 2 18 12 4 2 18 21

    ```


    We map $x$ to $ch$ 15 times, to $f$ 2 times, and so on. Note that we could have
    called $sort()$ on $m2cx\$counts$ to view the mapped values in order, from most
    to least.


    The Mandarin-learner of Cantonese can see that if he wishes to know the pronunciation
    of a word Mandarin romanized begins with $x$, the Cantonese almost begins with
    $h$. Little-aide like this should help the learning process quite a bit.


    To discern more patterns, the learner may wish to determine which characters $x$
