  md: 'The Electronic Frontier Foundation (EFF) is the leading organization defending
    civil liberties in the digital world. We defend free speech on the Internet, fight
    illegal surveillance, promote the rights of innovators to develop new digital
    technologies, and work to ensure that the rights and freedoms we enjoy are enhanced
    — as our use of technology grows.


    PRIVACY EFF sued telecom giant AT&T for giving the NSA unfettered access to the
    private communications of millions of its customers. eff.org/nsa


    FREE SPEECH EFF''s Coders'' Rights Project is defending the rights of programmers
    and researchers to publish their findings without fear of legal challenges. eff.org/freespeech


    INNOVATION EFF''s Patent Bust Project challenges overbroad patents that threaten
    technological innovation. eff.org/patent


    FAIR USE EFF is fighting prohibitive standards that would take away your right
    to receive and over-the-air television broadcasts whatever you choose. eff.org/IP/fairuse


    TRANSPARENCY EFF has developed the Switzerland Network Testing Tool to give individuals
    the tools to test for covert traffic filtering. eff.org/transparency


    INTERNATIONAL EFF is working to ensure that international treaties do not restrict
    our free speech, privacy or consumer rights. eff.org/global


