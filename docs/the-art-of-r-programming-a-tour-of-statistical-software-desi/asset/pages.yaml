- img_proc: true
  md: '# 12.1.1 The Workhorse of R Base Graphics: The plot() Function


    The plot() function forms the foundation for much of R''s base operations, serving
    as the vehicle for producing many different kinds of graphs. As mentioned in Section
    9.1.1, plot() is a generic function, or a placeholder for a family of functions.
    The function that depends on the class of the object on which it is called.

    Let''s see what happens when we call plot() with an X vector and a Y vector, which
    are interpreted as set of pairs in the (x,y) plane.


    ```

    > plot(c(1,2,3), c(1,2,4))

    ```


    This will cause a window to pop up, plotting the points (1,1), (2,2), and (3,4),
    as shown in Figure 12-1. As you can see, this is a very plain-Jane graph. We''ll
    discuss some of the fancy bells and whistles later in the chapter.


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_287_0.png)


    NOTE The points in the graph in Figure 12-1 are denoted by empty circles. If you
    want to use a different character type, specify a value for the named argument
    pch (for point character).


    The plot() function works in stages, which means you can build up a graph in stages
    by issuing a series of commands. For example, as a base, we might first draw an
    empty graph, with only axes, like this:


    ```

    > plot(c(-3,3), c(-1,5), type = "n", xlab="x", ylab="y"

    ```


    This draws axes labeled x and y. The horizontal (x) axis ranges from -3 to 3.
    The vertical (y) axis ranges from -1 to 5. The argument type="n" means that there
    is nothing in the graph itself.'
