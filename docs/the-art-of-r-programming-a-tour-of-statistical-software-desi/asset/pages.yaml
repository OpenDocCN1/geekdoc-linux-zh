  md: "# 7.6.1 The Top-Level Environment\n\nConsider this example:\n\n```\nw <- 12\n\
    \ f <- function(y) {\n+  d <- 8\n+  h <- function() {\n+    return(d*y)\n+  }\n\
    +  return(h)\n}\n> environment(f)\n<environment: R_GlobalEnv>\n```\n\nHere, the\
    \ function f() is created at the top level—that is, at the interpreter command\
    \ prompt—and thus has the top-level environment, which in R is output as REnv\
    \ but confusingly you refer to in R code as .GlobalEnv. If you run an R program\
    \ as a batch file, that is considered top level.\n\nThe ls() lists the objects\
    \ of an environment. If you call it at the top level, you get the top-level environment.\
    \ Let's try it with our example code:\n\n```\n> ls()\n[1] \"w\"\n```\n\nAs you\
    \ can see, the top-level environment here includes the variable w, which is actually\
    \ used within(). Note that f() is here too, as functions are indexed objects and\
    \ we created it at the top level. At levels other than the top, ls() works a little\
    \ differently, as you'll see in Section 7.6.3.\nYou can get more information from\
    \ ls.str().\n\n```\n> ls.str()\nf : function (y)\nw : num 12\n```\n\nNext, we'll\
    \ look at how w and other variables come into play within f().\n\n# 7.6.2 The\
    \ Scope Hierarchy\n\nLet's get an intuitive overview of how scope works in R and\
    \ then relate it to environments.\n\nIf we were working with the C language (as\
    \ usual, background in C is not assumed), we would say that the variable w in\
    \ the previous section is global to f(), while d is local to f(). Things are similar\
    \ in R, but R is more hierarchical. In C, we would not have functions defined\
    \ within functions, as we have with h() inside f() in our example. Yet, since\
    \ functions are objects, it is"
  merge: -1
