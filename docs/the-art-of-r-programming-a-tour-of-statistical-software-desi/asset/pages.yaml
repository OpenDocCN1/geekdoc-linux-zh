  md: 'You can add more lines using the lines() function. Though there are

    any options, the two basic arguments to lines() are a vector of xvalues

    a vector of yvalues. These are interpreted as (x,y) representing

    to be added to the current graph, with lines connecting the points.

    For instance, if X and Y are the vectors (1.5,2.5) and (3,3), you could use

    this call to add a line from (1.5,3) to (2.5,3) to the present graph:


    ```

    lines(c(1.5,2.5),c(3,3))

    ```


    If you want lines to "connect the dots," but don''t want the dots them

    elves, include type="1" in your call to lines() or to plot(), as follows:


    ```

    plot(x,y,type="1")

    ```


    You can use the lty parameter in plot() to specify the type of line,

    asolid or dashed. To see the types available and their codes, enter this

    command:


    ```

    help(par)

    ```


    # 12.1.3 Starting a New Graph While Keeping the Old Ones


    Each time you plot(), directly or indirectly, the current graph window

    will be replaced by the new one. If you don''t want that to happen, use the

    command for your operating system:


    +   - On Linux systems, call x11().

    - On a Mac, call macintosh().

    - On Windows, call windows().


    For instance, suppose you wish to plot two histograms of vectors X

    Y and view them side by side. On a Linux system, you would type the

    following:


    ```

    hist(x)

    x11()

    hist(y)

    ```


    # 12.1.4 Extended Example: Two Density Estimates on the Same Graph


    Let''s plot nonparametric density estimates (these are basically smoothed

    histograms) for two sets of examination scores in the same graph. We use

    the function density() to generate the estimates. Here are the commands


    ```

    d1 = density(testscores$Exam1,from=0,to=100)

    d2 = density(testscores$Exam2,from=0,to=100)

    ```'
