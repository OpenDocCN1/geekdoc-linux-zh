  md: '# 10.3.1 Overview of TCP/IP


    TCP/IP is quite complex, so the overview will be something of an oversimplification,
    but we''ll cover enough for you to understand what R''s functions are doing.


    For our purposes, the term network refers to a set of computers connected together
    locally, without going through the Internet. This typically consists of all the
    computers in a home, all the computers in a smaller business, and so on. The physical
    medium between them is usually an Ethernet connection of some form.


    The Internet, as name implies, connects networks. A network in the Internet is
    connected to one or more networks via routers, which are special-purpose computers
    that connect two or more networks together. Every computer on the Internet has
    an Internet Protocol (IP) address. This is numeric, but it can be stated in characters,
    as in www.google.com, which is translated into the numeric address by the Domain
    Name Service.


    However, the IP address is not enough. When A sends a message to B, there may
    be several applications at B that are receiving messages, such as web browsing,
    email service, and so on. How does the operating system at B know which to send
    the message from A? The answer is that A will specify a port number in addition
    to the IP address. The port number identifies the program running at B intended
    for the recipient, and A will also have a port number so that the response from
    B reaches the connection at A.


    When A sends something to B, it writes to a software called a socket, using a
    system syntactically similar to the one for writing to a file. In a case, the
    socket specifies B''s IP address and the port number to write in that socket.
    We say there is connection between A and B via those sockets, but that doesn''t
    mean anything physical—it''s an agreement between A and B to exchange data.


    Applications follow a client/server model. Say a server is running at B, at the
    standard for the Web, port 80. Say B is listening at port 80. Again, this term
    should not be taken literally; it means that the server program is waiting to
    have connections at port 80. When network node A requests a connection, the function
    call at the server sets it up.


    If you are an unprivileged user and write some kind of server program in R—you
    must assign a port number above 1024.


    > If a server is taken down or crashes, there may be a few seconds'' delay before
    the same port is usable again.


    # 10.3.2 Sockets in R


    A very important point to keep in mind is that all the bytes during the connection
    between exists are collectively considered one big message. Say A sends one line
    of text of 8 characters and then'
