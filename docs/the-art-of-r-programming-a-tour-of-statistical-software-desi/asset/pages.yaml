  md: 'The screen is named x11 when R runs on Linux. (It''s named windows on Windows
    systems.) It is device number 2 here. Our PDF file is device number 3. Our active
    device is the PDF file:


    ```

    dev.cur())

    pdf

    3

    ```


    All graphics output will now go to this file instead of the screen. But what if
    we wish to save what''s already on the screen?


    # 12.3.2 Saving the Displayed Graph


    One way to save the graph currently displayed on the screen is to reestablish
    the screen as the current device and copy it to the PDF device, which is 3 in
    our example, as follows:


    ```

    dev.set(2)

    X11

    2

    dev.copy(which=3)

    pdf

    3

    ```


    But actually, it is best to set up a PDF device as shown earlier and then rerun
    whatever analyses led to the current screen. This is because the copy operation
    can result in distortions due to mismatches between screen and file devices.


    # 12.3.3 Closing an R Graphics Device


    Note that the PDF file we create is not usable until we close it, which we do
    as follows:


    ```

    dev.set(3)

    pdf

    3

    dev.off()

    X11

    2

    ```


    You can also close the device by exiting R, if you''re finished working with it.
    But in future versions of R, this behavior may not exist, so it''s probably better
    to proactively close.'
