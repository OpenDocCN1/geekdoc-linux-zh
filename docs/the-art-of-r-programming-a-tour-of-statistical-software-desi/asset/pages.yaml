  md: "# 2.1.2 Obtaining the Length of a Vector\n\nYou can obtain the length of a\
    \ vector by using the length() function:\n\n```\n> x <- c(1,2,4)\n> length(x)\n\
    [1] 3\n```\n\nIn this example, we already know the length of x, so there is really\
    \ no\nneed to query it. But in writing general function code, you'll often need\
    \ to\nknow the length of vector arguments.\n\nFor instance, suppose that we wish\
    \ to have a function that determines\nindex of the first 1 value in the function's\
    \ vector argument (assuming wenare sure there is such a value). Here is one (not\
    \ necessarily efficient) we\ncould write the code:\n\n```\nfirst <- function(x)\
    \ {\n  for (i in 1:length(x)) {\n    if (x[i] == 1) break # break out of loop\n\
    \  }\n  return(i)\n}\n```\n\nWithout the length() function, we would have needed\
    \ to add a second argugu-\nment to first(), saying it n, to specify the length\
    \ of x.\nNote in this case, writing the loop as follows won't work:\n\n```\nfor\
    \ (n in x)\n```\n\nThe problem with this approach is that it doesn't allow us\
    \ to retrieve the\nindex of the desired element. Thus, we need an explicit loop,\
    \ which in turn\nrequiring calculating the length of x.\n\nOne more point about\
    \ loop: For careful coding, you should worry\nlength(x) might be 0. In such a\
    \ case, look what happens to the expres-\nt 1:length(x) in our loop:\n\n```\n\
    > x <- c()\n> x\nNULL\n> length(x)\n[1] 0\n> 1:length(x)\n[1] 0\n```\n\nOur variable\
    \ i in this loop takes the value 1, 0, which is certainly no\nwhat we want if\
    \ the vector x is empty.\n\nSafe alternative is to use the more advanced R function\
    \ seq(), as we'll\ndiscuss in Section 2.4.4."
