    # B.3.2 Installing Packages Manually


    Sometimes you will need to install "by hand" to make modifications required to
    make a particular R package work on your system. The following example demonstrates
    how I did so in one instance, and it will serve as a case study on handling situations
    in which ordinary methods don''t work.


    Situations in which you need to install packages by hand typically are operating
    system dependent and require more expertise than is generally assumed in this
    book. For very specific cases, the Rhelp mailing list is invaluable. To access
    it, go to the R home page (http://www.r-project.org/), click the FAQs link and
    then the R FAQ link, scroll down to Section 2.9 “What mailing lists exist for
    R?”


    I wanted to install the Rmpi package on our instructional machines in the directory
    /home/matloff/R. I tried using install.packages but found that the automated process
    could not find the MPI library on our machines. The problem was that R was looking
    for files in /usr/local/lam, where I knew they were in /usr/local/LAM. Since these
    were public machines, not my own, I did not have the authority to change the name.
    So, I downloaded the Rmpi files in the form Rmpi_0.3-5 named ~/tmp/, producing
    a directory ~/tmp/Rmpi.


    If I had not experienced this problem, at this point, I could have typed the following
    in a terminal window from within the /tmp directory:


    ```

    R CMD INSTALL -l /home/matloff/R Rmpi

    ```


    That command would install the package contained in ~/tmp/Rmpi, placing it in
    /home/matloff/R. This would have been an alternative to calling install.packages().


    But as noted, I had to deal with a problem. Within the ~/tmp/Rmpi directory, there
    was a configure file, so I ran this command on my Linux command line:


    ```

    configure --help

    ```


    It told me that I could specify the location of my MPI files to configure, as
    follows:


    ```

    configure --with-mpi=/usr/local/LAM

    ```


    This applies if you run configure directly, but I ran it via R:


    ```

    R CMD INSTALL -l /home/matloff/R Rmpi --configure-args=--with-mpi=/usr/local/LAM

    ```'
