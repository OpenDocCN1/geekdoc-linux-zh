    The result is the string "the square of 8 is 64."


    # 11.1.5 substr()


    The call substr(x,start,stop) returns the substring in the given character

    range start:stop in the given string x. Here''s an example:


    ```

    > substr("Equator",3,5)

    [1] "uat"

    ```


    # 11.1.6 strsplit()


    The call strsplit(x,split) splits a x into an R list of substrings based on

    another string split in x. Here''s an example:


    ```

