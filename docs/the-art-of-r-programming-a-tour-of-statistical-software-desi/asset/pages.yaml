  md: '# 13.6 Syntax and Runtime Errors


    The most common syntax errors will be lack of matching parentheses, brackets,
    or quotation marks. When you encounter a syntax error, this is the first thing
    you should check and double-check. I highly recommend you use a text editor that
    does parentheses matching and coloring for R, such as Vim or Emacs.


    Be aware that when you get a message saying there is a syntax error on a line,
    the error may actually be in a much earlier line. This can occur with any language,
    but R seems especially prone to it.


    If just isn''t obvious to you where your syntax error is, I recommend selectively
    commenting out of your code, better enabling you to point the location of the
    syntax problem. Generally, it helps to find a binary search: Comment out half
    of your code (being careful to maintain integrity) and see if the same error arises.
    If it does the remaining half; otherwise, it''s in the half you deleted. Cut that
    half in, and so on.


    You may sometimes get messages like:


    ```

    There were 50 or more warnings (use warnings()) to see the first 50

    ```


    > These be be he--run warnings() as suggested. The problem could range from nonconvergence
    of an algorithm to misspecification of a matrix argument to a function. In many
    cases, the program output may be invalid, though it may well be fine, say with
    this:


    ```

    Fitted probabilities numerically 0 or 1 occurred in: glm...

    ```


    In some cases, you may find it useful to issue this command:


    ```

    > options(warn=2)

    ```


    This instructs R to turn warnings into actual errors and makes the locations of
    the warnings easier to find.


    # 13.7 Running GDB on R Myself


    This section may be of interest to you if you are not trying to fix a bug in R.
    For example, you may have written some C code to interface with R (covered in
    Chapter 15) and found it to be buggy. In order to run GDB on that C function,
    you must first run R itself through GDB.


    Or, you may be interested in the internals of R, say to determine how you can
    write efficient R code, and wish to explore the internals stepping through the
    R source code using a debugging tool such as GDB.'
