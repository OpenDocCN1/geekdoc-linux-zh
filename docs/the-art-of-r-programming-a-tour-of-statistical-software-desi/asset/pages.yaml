  md: '> > xf

    [1] 5 12 13 12

    Levels: 5 12 13


    The distinct values in xf—5, 12, and 13—are the levels here.

    Let''s take a look inside:


    > > str(xf)

    Factor w/ 3 levels "5","12","13": 1 2 3 2

    > unclass(xf)

    [1] 1 2 3 2

    > attr(.,levels)

    [1] "5" "12" "13"


    This is revealing. The core of xf is not (5,12,13,12) but rather (1,2,3,2). The
    latter means that our data consists first of a level-1 value, level-2 and level-3
    values, and finally another level-2 value. So the data has been recorded by level.
    The levels themselves are recorded too, of course, through characters such as
    "5" rather than 5.


    The length of a factor is still defined in terms of the length of the data rather
    than, say, being a count of the number of levels:


    We anticipate new levels, as seen here:


    ```

    > x <- c(5,12,13,12)

    > xff <- factor(x,levels=c(5,12,13,88))

    > xff

    [1] 5 12 13 12

    Levels: 5 12 13 88

    > xff[2] <- 88

    > xff

    [1] 5 12 13 88

    Levels: 5 12 13 88

    ```


    Originally, xff did not contain the value 88, but in defining it, we allowed for
    that possibility. Later, we did indeed add the value.

    By the same token, you cannot sneak in an "illegal" level. Here''s what happens
    when you:


    ```

    > xff[2] <- 28

    Warning message:

    In [<-factor(''*tmp*'', 2, value = 28) :

    invalid factor level, NAs generated

    ```'
