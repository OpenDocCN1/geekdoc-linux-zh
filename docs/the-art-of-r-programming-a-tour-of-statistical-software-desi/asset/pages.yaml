    # 1.6 Startup and Shutdown


    Like that of sophisticated software applications, R''s behavior can be

    customized using startup files. In R can save all or part of a session,

    as a record of what you did, to an output file. If there are R commands

    that you would like to execute at the beginning of every R session, you can

    place them in a file called .Rprofile located in your home directory or

    searched for this file, in the directory which you are running. The latter directory
    is

    allows you to create custom profiles for par-\icular projects.


    For example, to test the editor that R invokes if you can edit(), you

    use a line in .Rprofile like this (if you are on a Linux system):


    ```

    options(editor="/usr/bin/vim")

    ```


    R''s options() function is used for configuration, that is, to tweak various

    settings. You can specify the full path to your editor, using notation

    (slashes or backslashes) appropriate to your operating system.

    Another example, in .Rprofile on my Linux machine at home, I have


    ```

    .libPaths("/home/rn/R")

    ```


    This automatically adds a directory that contains all my auxiliary packages to

    R search path.

    Like most programs, R has the notion of your current working directory.

    Upon startup, this will be the directory from which you launched R, if you''re

    using Linux or a Mac. In Windows, it will probably be your Documents folder.

    If you reference files during your R session, they will be assumed to be

    in that directory. You can always check your current directory by typing thenfollowing:


    ```

    > getwd()

    ```'
