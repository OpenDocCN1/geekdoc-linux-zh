    \ machine has two CPUs, a quad-core system has four, and so on. With multiple\
    \ cores, you can do parallel computation!\n\nThis parallel computation is done\
    \ with threads, which are analogous to snow's cores. In computationally intensive\
    \ applications, you generally set up as many threads as there are cores, for example\
    \ two threads in a dual-core machine. Ideally these run simultaneously, though\
    \ overhead issues arise, as will be explained when we look at general performance\
    \ issues in Section 16.4.1.\n\nIf your machine has multiple cores, it is structured\
    \ as a shared-memory system. All cores access the same RAM. makes communication\
    \ between the cores easy to program. If a thread writes to a memory location,\
    \ the change is visible to the other threads, without the programmer inserting\
    \ code to make that happen.\n\n# 16.3.2 Extended Example: Mutual Outlinks Problem\
