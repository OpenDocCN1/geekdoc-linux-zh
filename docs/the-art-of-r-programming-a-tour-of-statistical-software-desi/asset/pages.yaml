  md: '# 4.4.3 Extended Example: Back to the Abalone Data


    Let''s use the apply() function in our abalone example in Section 2.9.2. Recall
    that one point in that example, we wished to know the indices of the observations
    that were male, female, and infant. For an easy demonstration, let''s use the
    same test case: a vector of genders.


    ```

    g <- c("M", "F", "F", "I", "M", "M", "F")

    ```


    A more way of accomplishing our goal is as follows:


    ```

    > apply(c("M", "F", "I"), function(gender) which(g=gender))

    [1]

    1 5 6

    ```


    ```

    [2]

    [1] 2 3 7

    ```


    ```

    [3]

    [1] 4

    ```


    The apply() function expects its first argument to be a list. Here it was a vector,
    but apply() will coerce vector to a list form. Also, apply() expects its second
    argument to be a function. This could be the name of a function, as you saw before,
    or the actual code, as we have here. This is an anonymous example, which you''ll
    learn more about Section 7.13.


    Then apply() calls that anonymous function on "M", then on "F". In that case,
    the function calculates which(g="M"), giving us the vector of indices in all of
    male. By determining the indices for the females and infants, apply() will return
    the three vectors in a list.


    Note that the object of our main attention is the vector g of genders, it is not
    the first argument in the apply() call in the example. Instead, that is an innocuous
    vector of the three possible gender encodings. By contrast, g is mentioned only
    briefly in the function, as the actual argument. This is a common situation in
    R. An even better way to do this will be presented in Section 6.2.2.


    # 4.5 Recursive Lists


    Lists can be recursive, meaning that you can have lists within lists. Here''s
    an example:


    ```

    > b <- list(u = 5, v = 12)

    > c <- list(w = 13)

    > a <- list(b,c)

    > a

    [[1]

    [[1]]\$u

    ```'
