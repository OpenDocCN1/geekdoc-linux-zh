    # 8.2 Functions for Statistical Distributions


    R has functions available for most of the famous statistical distributions. Prefix
    the name as follows:


    +   * With d for the density or probability mass function (pmf)

    * With p for the cumulative distribution function (cdf)

    * With q for quantiles

    * With r for random number generation


    The rest of the name indicates the distribution. Table 8-1 lists common statistical
    distribution functions.


    **Table 8-1**: Common R Distribution Functions


    | Distribution | Density/pmf | cdf | Quantiles | Random Numbers |

    |---|---|---|---||

    | Normal | dnorm() | pnorm() | qnorm() | rnorm() |

    | Chi square | dchisq() | pchisq() | qchisq() | rchisq() |

    | Binomial | dinom() | pbinom() | qbinom() | rbinom() |


    As an example, let''s simulate 1,000 chi-square variates with 2 degrees of freedom
    and find their method.


    ```

    > mean(chisq(1000, df=2))

    [1] 1.938179

    ```


    The r in rchis specifies that we wish to generate random numbers—in this case,
    from the chi-square distribution. As seen in this example, the first argument
    in the r-series functions is the number of random variates to generate.'
