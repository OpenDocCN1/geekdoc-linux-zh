  md: '# # 13


    # ## DEBUGGING


    Programmers often find that they spend more time debugging a program than actually
    writing it. Good debugging skills are invaluable. In this chapter, we’ll discuss
    debugging in R.


    # ### 13.1 Fundamental Principles of Debugging


    > Beware of bugs in the above code; I have only proved it correct, not tried it.

    —Donald Knuth, pioneer of computer science


    Though debugging is an art rather than a science, it involves some fundamental
    principles. Here, we’ll look at some debugging best practices.


    # #### 13.1.1 The Essence of Debugging: The Principle of Confirmation


    As Pete Salzman and I said in our book on debugging, The Art of Debugging, with
    GDB, DDD, and Eclipse (No Starch Press, 2008), the principle of confirmation is
    the essence of debugging.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'Fixing a buggy program is a process of confirming, one by one, that the many
    things you believe to be true about the code actually are true. When you find
    that one of your assumptions is not true, you have found a clue to the location
    (if not the exact nature) of a bug.


    Another way of saving this is, "Surprises are good!" For example, you have the
    following code:


    ```

    x <- y^2 + 3g(z)

    w <- 28

    if (w > 0) u <- 1 else v <- 10

    ```


    Do you think the value of your variable x should be 3 after x is assigned? Confirm!
    Do you think the else will be executed, if not on that line? Confirm!


    Ultimately, one of these assertions that you are sure of will turn out to not
    confirm. Then you will have pinpointed the likely location of the error, enabling
    you to focus on the nature of the error.


    # 13.1.2 Start Small


    At least at the beginning of the debugging process, stick to small, simple test
    cases. Working with large data objects may make it harder to think about the problem.

    Of course, you should eventually test your code on load, complicated cases, but
    start small.


    # 13.1.3 Debug in a Modular, Top-Down Manner


    Most software developers agree that code should be written in a modular manner.
    Your first-level code should not be longer than, say, a dozen lines, with it consisting
    of function calls. And those functions should not be too long and call other functions
    if necessary. This makes the code easier to organize during the writing stage
    and easier for others to understand when it comes time for code to be extended.

    You should debug in a top-down manner. Suppose that you have set the debug status
    of your function f() (that is, you have called debug(f), to be explained shortly)
    and f() contains this line:


    ```

    y <- g(x8)

    ```


    You should take an "innocent until proven" approach to g(). Do not call debug(g)
    yet. Execute that line and see if g() returns the value you expect. If it does,
    then you''ve just avoided the time-consuming process of single-stepping through
    g(). If g() returns the wrong value, then now is the time to call debug(g).'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# 13.1.4 Antibugging


    You may adopt some “antibugging” strategies as well. Suppose you have a section
    of code in which a variable x should be positive. You could insert this line:


    ```

    stopif(x > 0)

    ```


    There is a bug error in the code that renders x equal to, say, –12, the call to
    stopifnot() will bring things to a halt right there, with an error message like
    this:


    ```

    Error: x > 0 is not TRUE

    ```


    (C programmers may notice the similarity to C’s assert statement.) After fixing
    a bug and testing the new code, you might want to keep that code handy so you
    can check that the bug does not reappear.


    # 13.2 Why Use a Debugging Tool?


    In the old days, programmers would perform the debugging confirmation by temporarily
    inserting statements into the code and rerunning the program. For example, if
    x = 3 in our previous code, we would insert into our code a statement that printed
    the value of x and do something similar for the if-else, like this:


    ```

    x <- y*2 + sg(z

    ```


    We would rerun the program and inspect the feedback printed out. We would then
    remove the print statements and put in new ones to track the next bug.


    This manual is fine for one or two cycles, but it gets really tedious during a
    long debugging session. And worse, all editing work distracts your attention,
    making it harder to concentrate on finding the bug.'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'So, debugging by inserting print statements into your code is slow, cumbersome,
    and distracting. If you are serious about programming in any particular language,
    you should seek a good debugging tool for that language. Using a debugging tool
    will make it much easier to query the values of variables, check whether the if
    or the else gets executed, and so on. Moreover, if your bug causes an execution
    error, debugging tools can analyze it for you, possibly providing major clues
    to the source of the error. All of this will increase your productivity substantially.


    # 13.3 Using Debugging Facilities


    The R base package includes a number of debugging facilities, and more functional
    debugging packages are also available. We will discuss both the facilities and
    other packages, and our extended example will present a fully detailed debugging
    session.


    # 13.3.1 Single-Stepping with the debug() and browser() Functions


    The core of R debugging facility consists of the browser. It allows you to single-step
    through your code, line by line, taking a look around you. You can invoke the
    browser through a call to either the debug() or browser() function.


    R debugging is specific to individual functions. If you believe there is a bug
    in your function f(), you can call the debug(f) to set the debug status of the
    function(). This means that from point onward, each time you call the function,
    you will automatically enter the browser at the beginning of the function. Using
    undef(f) will unset the debug status of the function so that it no longer invoke
    the browser.


    On the other hand, if you make a call to browser() at some line within f(), the
    browser will be invoked only when execution reaches that line. You can single-step
    through your code until you exit the function. If you believe the bug''s location
    is not near the beginning of the function, you approach probably doesn''t want
    to be single-stepping from the beginning, so this approach is more direct.


    Readers who have used C debuggers as GDB (the GNU debugger) will find similarity
    here, but some aspects will come as a surprise. As noted, debug() is called on
    the function level, not on the overall program level. If you believe you have
    bugs in several of your functions, you''ll need to call debug() on each one.


    It can become tedious to call debug(f) and then undef(f) when you want to go through
    one debugging session for f(). Starting with R 2.10, one can now call debugonce()
    instead; calling puts(f) puts into debugging status the first time you execute
    it, but status is reversed immediately upon exit from the function.'
