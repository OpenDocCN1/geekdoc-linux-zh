  md: 'Last prompt asks whether you want to save your variables so that you can resume
    work later. If you answer y, then all those objects will be loaded the next time
    you run R. This is a very important feature, especially when working with large
    or numerous data sets. We''ll talk more about saving your workspace and the session''s
    history. command history in Section 1.6.


    # 1.3 Introduction to Functions


    In most programming languages, the heart of R consists of writing functions. A
    function is a group of instructions that takes inputs, uses them to compute other
    values, and returns a result.


    As a simple introduction, let''s define a function named addcount(), whose purpose
    is to count the odd numbers in vectors of integers. We would compose the function
    code using a text editor and save it in a file, but in this quick-and-dirty example,
    we''ll enter it line by line in R''s interactive mode. We''ll call the function
    on a couple of tests.


    ```

    # counts the odd integers in x

    > addcount <- function() {

    + k <- 0 # assign 0 to k

    + for (n in x) {

    + if (n %% 2 == 1) k <- k+1 # %% is the modulo

    + }

    + return(k)

    }

    > addcount(c(1,3,5))

    [1] 3

    > addcount(c(1,2,3,7,9))

    [1] 4

    ```


    First, we told R that we wanted to define a function named addcount with one argument.
    The left brace demarcates the start of the body of the function. We wrote one
    statement per line.


    Until the body of the function is finished, R reminds you that you''re still in
    the definition by using + as prompt, instead of the usual +. (Actually, + is a
    line-continuation character, not a prompt for a new input.) R resumes the prompt
    after you finally enter a right brace to conclude the function body.


    After defining the function, we evaluated two calls to addcount(). Since there
    are three odd numbers in the vector (1,3,5), the call addcount(1,3,5) returns
    the value 3. There are four odd numbers in (1,2,3,7,9), so the second call returns
    4.'
