    # ### 5.2.2 More on Treatment of NA Values


    Suppose the second exam score for the first student had been missing. Then we
    would have typed the following into that line when we were preparing the data
    file:


    ```

    2.0 NA 4.0

    ```


    In any subsequent statistical analyses, R would do best to cope with the missing
    data. However, in some situations, we need to set the option na.rm=TRUE, explicitly
    telling R to ignore NA values. For instance, with the missing exam score calculating
    the mean score on exam 2 by calling R''s mean() function would skip that first
    student in finding the mean. Otherwise R would just report NA for the mean.

    Here''s a little example:


    ```

    > x <- c(2,NA,4)

    > mean(x)

    > [1] NA

    > mean(x,na.rm=TRUE)

    > [1] 3

    ```


    In Section 2.8.2, you were introduced to the subset() function, which saves you
    the trouble of specifying na.rm=TRUE. You can apply it in data frames for row
    selection. The column names are taken in the context of the given data frame.
    In example, instead of typing:


    ```

    > examsquiz[examsquiz$Exam.1 >= 3.8]

    ```


    we could run:


    ```

    > subset(examsquiz,Exam.1 >= 3.8)

    ```


    Note that we do not to write this:


    ```

    > subset(examsquiz,examsquiz$Exam.1 >= 3.8)

    ```


    In some cases, we may wish to rid our data frame of any observation that has at
    least one NA value. A handy function for this purpose is complete.cases().'
