    # ### 1.3.1 Variable Scope


    A variable that visible only within a function body is said to be local to that
    function. In oddcount(), k and n are local variables. They disappear after the
    function returns:


    ```

    > oddcount(c(1,2,3,7,9))

    [1] 4

    > n

    Error: object ''n'' not found

    ```


    It''s very important to note that the formal parameters in an R function are local
    variables. Suppose we make the following function call:


    ```

    > z <- c(2,6,7)

    > oddcount(z)

    ```


    Now suppose that the code of oddcount() changes x. Then z would not change. After
    the call to oddcount(), z would have the same value as before. To evaluate a function
    call, R copies each actual argument to the corresponding local parameter variable,
    and changes to that variable are not visible outside the function. Scoping rules
    as these will be discussed in detail in Chapter 7.


    Variables created outside functions are global and are available within functions
    as well. Here''s an example:


    ```

    > f <- function(x) return(y)

    > y <- 3

    > f(5)

    [1] 8

    ```


    Here y is a global variable. A global variable can be written to within a function
    by using R superassignment operator, <<-. This is discussed in Chapter 7.


    # ### 1.3.2 Default Arguments


    R makes frequent use of default arguments. Consider a function definition like
    this:


    ```

    > g <- function(x,y=2,z=T) { ... }

    ```'
