  md: '# 16.3.4 OpenMP Analysis


    OpenMP code is C, with the addition of pragmas that instruct the compiler to insert
    some library code to perform OpenMP operations. Look at line 20, for instance.
    When execution reaches this point, the threads will be activated. Each thread
    then executes the code that follows—lines 21 through 31—in parallel.


    A key point is variable scope. All the variables in the block starting at line
    21 are local to their specific threads. For example, we named the total variable
    in line 21 mysum because each thread will maintain its own. By contrast, the global
    variable on line 4 is held in common by all the threads. Each thread makes its
    contribution to that total on line 30.


    But the variable n on line 18 is held in common with all the threads (during the
    execution of main()), as it is declared outside the block on line 21. So though
    it is a local variable in C scope, it is global to all the threads. Indeed, we
    could declare that line, too. It needs to be shared by all the threads, but it''s
    not used outside main(), it has been declared on line 18.


    Line 29 contains another pragma. This one applies only to the single line following
    it—line 30—rather than the whole block. The purpose of the atomic pragma is to
    avoid a race condition in parallel processing where threads are updating a variable
    at the same time, which may produce incorrect results. The atomic pragma ensures
    that line 30 will be executed by one thread at a time. This implies that in this
    section of the code, our parallel program becomes serial, which is a potential
    source of slowdown.


    Where is the manager''s role in all this? Actually, the manager is the original
    thread, and it executes lines 18 and 19, as well as _C(), the function that calls
    main(). When the worker threads are activated on line 21, the manager goes dormant.
    The worker threads become dormant until they finish line 31. At that point, the
    manager resumes execution. Due to the dormancy of the manager while the workers
    are executing, we want to have as many workers as our machine has cores.


    The function is straightforward, but note the difference in how the matrix n is
    stored. Recall from the discussion in Chapter 15 interfacing between R and C that
    the two languages store matrices by column in R and row-wise in C. We need to
    be aware of that difference. Here, we have treated the matrix as a one-dimensional
    array, as is common in C code. In other words, if n is, say, 4, we treat n as
    a vector of 16 elements. Due to the column-major nature of R storage, the vector
    will consist of the first elements of column 1, then the first of column 2, and
    so on. To further complicate matters, we must keep in mind array indices in C
    start at 0, instead of starting at 1 as R.


    Putting all of this together yields the multiplication in line 12. The (k,i) and
    (k,j) elements of the version of n in the C code, which are the (i+1,k) and (j+1,k)
    elements back in the R code.'
