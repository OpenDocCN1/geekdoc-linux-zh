    # 1.4 Preview of Some Important Data Structures


    R has a variety of data structures. We will sketch some of the most used structures
    to give you an overview of R before we dive into the details. This way, you can
    at least get started with meaningful examples, even if the full story behind them
    must wait.


    # 1.4.1 Vectors, the R Workhorse


    The vector type is really the heart of R. It''s hard to imagine R code, or even
    an interactive R session, that doesn''t involve vectors.

    The elements of a vector must all have the same mode, or data type. You can have
    a vector consisting of three character strings (of mode character) or three integer
    elements (of mode integer), but not a vector with one integer and two character
    elements.

    We''ll talk more about vectors in Chapter.


    # 1.4.1.1 Scalars


    Scalars, or individual numbers, do not exist in R. As mentioned earlier, what
    appear to be individual numbers are actually one-element vectors. Consider the
    following:


    +   > x <- 8

    > x

    >[1] 8


    Recall that the [1] here signifies that the following row of numbers begins with
    element 1 of a vector—in this case, x[1]. So you can see that R was indeed treating
    x as a vector, albeit vector with just one element.'
