  md: "# 6.2 Common Functions Used with Factors\n\nWith factors, we have yet another\
    \ member of the family of apply functions, tapply. We'll look at that function,\
    \ as well as two other functions commonly used with factors: split() and by().\n\
    \n# 6.2.1 The tapply() Function\n\nAs motivation, suppose we have a vector x of\
    \ ages of voters and a factor f showing some nonnumeric trait of those voters,\
    \ such as factor affiliation (Dem, Republican, Unaffiliated). We might to find\
    \ the mean ages in x within each group of the factors.\n\nIn typical usage, the\
    \ call tapply(x,f,g) has x as a vector, f as a factor or list of factors, and\
    \ g as a function. The function g() in our little example above would be RS mean()\
    \ function. If we wanted to group by both party and another factor, we would need\
    \ f to consist of the two factors, party and gender.\n\nEach factor f must have\
    \ the same length as x. This makes sense in light of the example above; we have\
    \ as many factor affiliations as ages. If a component of f is a vector, it will\
    \ be coerced into a factor by applying tapply() to it.\n\nThe operation performed\
    \ by tapply() is (temporarily) split x into groups, each corresponding to a level\
    \ of the factor (or a combination of levels of the factors in the case of multiple\
    \ factors), and then apply g() to the resulting subvectors of x. Here's a little\
    \ example:\n\n```\n> ages <- c(25,26,55,37,21,42)\n> affils <- c(\"D\",\"D\",\"\
    R\",\"R\",\"U\",\"D\")\n> tapply(ages,affils,mean)\nD R U\n 41 31\n```\n\nLet's\
    \ look at what happened. The function tapply() treated the vector (\"D\",\"R\"\
    ,\"U\") as a factor with levels D. It noted that \"D\" occurred in indices 2,\
    \ 3 and 6; \"R\" occurred in indices 1 and 4; and \"U\" occurred in index 5. For\
    \ convenience, let's refer to the three index vectors (2,3,6), (1,4), and (5)\
    \ as x, y, and z. Then tapply() computed mean(x), mean(y), and returned those\
    \ means in a three-element vector. That vector's element names are \"D\", \"R\"\
    , and \"U\", reflecting the factor levels that were used by tapply().\n\nWhat\
    \ if we have two more factors? Then each factor yields a set of groups, as in\
    \ the preceding example. As an example, suppose that we have an economic data\
    \ set that includes variables for gender, age, and income. Here, the call tapply(x,f,g)\
    \ might have x as income and f as a pair of factors: one for gender and other\
    \ whether the person is older or younger than 25. We may be interested in"
  merge: -1
  pgno: 148
- img_proc: true
