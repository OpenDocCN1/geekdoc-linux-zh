  md: '# 16


    # PARALLEL R


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_358_0.png)


    Since many R users have very large computational needs, various tools for some
    kind of parallel operation of R have been devised. This chapter is devoted to
    parallel R.


    Many a novice in parallel processing has, with great anticipation, written parallel
    code for some application only to find that the parallel version actually run
    more slowly than the serial one. For reasons to be discussed in this chapter,
    this problem is especially acute with R.


    Accordingly, understanding the nature of parallel-processing hardware and software
    is crucial to success in the parallel world. These issues will be discussed here
    in the context of common platforms for parallel R.


    We''ll start with a few code examples and then move to general performance issues.


    # 16.1 The Mutual Outlinks Problem


    Consider a network graph of some kind, such as web links or links in a social
    network. Let A be the adjacency matrix of graph, meaning that, say, [3,8] is 1
    or 0, depending on whether there is a link from node 3 to node 8.


    For any two vertices, say any two websites, we might be interested in mutual outlinks—that
    is, outbound outlinks that are common to two sites. Suppose that we want to find
    the mean number of mutual outlinks, averaged'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'over all pairs of websites in our data set. This mean can be found using the
    following outline, for an n-by-n matrix:


    ```

    1 sum = 0

    2 for i = 0..n-1

    3 for j = 1..n-1

    4 for k = 0..n-1 sum = sum + a[i][k*a[j]][k]

    5 mean = sum / (n*(n-1)/2)

    ```


    Given that our graph contains thousands—millions of websites, our task could entail
    large amounts of computation. A common approach to dealing with this problem is
    to divide the computation into smaller chunks and then process each of the chunks
    simultaneously, say on separate computers.


    Let''s say we have two computers at our disposal. We might have one computer handle
    all the old values of i in the for loop in 2 and the second computer handle the
    even values. Or, since dual-core computers are fairly standard these days, we
    could take this approach on a single computer. This might sound simple, but a
    number of issues can arise, as you will learn in your chapter.


    # 16.2 Introducing the snow Package


    Luke Tier''s snow (Simple Network of Workstations) package, available from the
    CRAN code repository, is arguably the simplest, easiest-to-use form of parallel
    R and one of the most popular.


    > The CRAN Task View page on parallel R, http://cran.r-project.org/web/views/PerformanceComputing.html,
    has a fairly up-to-date list of available parallel R.


    To see how snow works, here''s the code for the mutual outlines problem in the
    previous section:


    ```

