    # 5.4.2 Extended Example: Applying Logistic Regression Models


    Let''s run a logistic regression model on the abalone data we use in Section 2.9.2,
    predicting gender from the eight variables: height, weight, rings, and so on,
    one at a time.


    The logistic model is used to predict a 0 or 1-valued random variable Y from one
    or more explanatory variables. The function value is the probability that Y=1,
    given the explanatory variables. Let''s say we have just one of the latter, X.
    Then the model is as follows:


