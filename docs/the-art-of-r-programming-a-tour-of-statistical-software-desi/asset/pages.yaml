    # 7.9.2 Extended Example: A Binary Search Tree


    Treelike data structures are common in both computer science and statistics. In
    R, the rpart library for a recursive partitioning approach to regression and classification
    is very popular. Trees obviously have applications in genealogy, and more generally,
    form the basis of analysis of social networks.


    However, there are real issues with tree structures in R, many of them related
    to the fact that R does not have pointer-style references, as discussed in Section
    7.7. For this reason and for performance purposes, a better option is to write
    the code in C with an R wrapper, as we will discuss in Chapter 15. Yet trees can
    be implemented in R itself, and if performance is not an issue, using this approach
    may be more convenient.


    For the sake of simplicity, our example here will be a binary search tree, a classic
    computer science data structure that has the following property:


    In each node of the tree, the value at the left link, if any, is less than equal
    to that of the parent, while the value at the right link, is greater than that
    of the parent.


    Here is an example:


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_202_0.png)


    We''ve stored 8 in the root—that is, the head—of the tree. Its two nodes contain
    5 and 20, and the former itself has two nodes, which store 2 and 6.'
