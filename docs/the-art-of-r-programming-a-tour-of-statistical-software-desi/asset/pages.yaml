  md: '# 9.1.5 Using Inheritance


    The idea of inheritance is to form new classes as specialized versions of old
    ones. In our previous employee example, for instance, we could form a new class
    devoted to hourly employees, "hrlyemployee", as a subclass of "employee", as follows:


    ```

    k <- list("Kate", salary=68000, union=F, hrsthismonth=2)

    class(k) <- c("hrlyemployee","employee")

    ```


    Our new class has one extra variable: hrsthismonth. The name of the new class
    consists of two character strings, representing the new class and the old class.
    Our new class inherits the methods of the old one. For instance, print() still
    works on the new class:


    ```

    > k

    Kate

    salary 68000

    union FALSE

    ```


    Given the rules of inheritance, that is not surprising. However, it''s important
    to understand exactly what transpired here.

    Once again, simply typing k resulted in the print(k). In turn, that called usedMethod()
    to search for a method in the first of k''s two class names, "hrlyemployee". That
    failed, so usedMethod() tried the other class name, "employee", and found print.employee().
    It executed the latter.

    Recall that in inspecting the code for "lm", you saw this line:


    ```

    class(z) <- c(if(is.matrix(y))"lm","lm")

    ```


    You can see that "elm" is a subclass of "lm" for vector-valued response.


    # 9.1.6 Extended Example: A Class for Storing Upper-Triangular Matrices


    Now it''s time for a more involved example, in which we will write an R class
    "ut" for upper-triangular matrices. These are square matrices whose elements below
    the diagonal are zeros, as shown in Equation 9.1.


    > $\begin{pmatrix}1 & 5 & 12\0 & 6 & 9\0 & 0 & 2\end{pmatrix}\quad(9.1)$


    Our motivation here is to save storage (though at the expense of a little extra
    time) by storing only the nonzero portion of the matrix.


    +   NOTE The class "ut" also uses such storage, though in a more focused context
    and without the class functions we have.'
