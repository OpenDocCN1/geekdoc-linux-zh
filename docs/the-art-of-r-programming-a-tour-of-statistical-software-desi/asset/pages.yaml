  md: '# # 8


    # ## DOING MATH AND SIMULATIONS IN R


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_214_0.png)


    R contains built-in functions for your favorite math operations and, of course,
    for statistical distributions. This chapter provides an overview of using these
    functions. Given the mathematical nature of this chapter, the examples assume
    a slightly higher-level knowledge than those in other chapters. You should be
    familiar with calculus and linear algebra to get the most out of these examples.


    # ### 8.1 Math Functions


    R includes an extensive set of built-in math functions. Here is a partial list:


    +   - exp(): Exponential function, base e

    - log(): Natural logarithm

    - log10(): Logarithm base 10

    - sqrt(): Square root

    - abs(): Absolute value'
