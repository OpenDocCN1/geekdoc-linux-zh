    # 9.4.5 The exists() Function


    The exists() returns TRUE or FALSE, depending on whether the arguments exist.
    Be sure to parse the argument in quotation marks.


    For example, the following code shows that the acc object exists:


    > exists("acc")


    +   [1] TRUE


    Why would this function be useful? Don''t we always know whether we''ve created
    an object and whether it''s still there? Not necessarily. If you are writing general-purpose
    code, to be available to the world in R''s CRAN repository, your code may need
    to check whether certain object exist, and if it doesn''t, your code may create
    it. For example, as you learned in Section 9.4.3, you can save objects to disks
    using save() and then restore them to R''s memory space by calling load().

    You might write general-purpose code that makes the latter call if the object
    is not already present, a condition you could check by calling exists().'
