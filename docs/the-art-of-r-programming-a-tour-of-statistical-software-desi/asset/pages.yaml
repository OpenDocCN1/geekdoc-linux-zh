  md: '# 10.1 Accessing the Keyboard and Monitor


    R provides several functions for accessing the keyboard and monitor. Here,

    we''ll look at the scan(), readline(), print(), and cat() functions.


    # 10.1.1 Using the scan() Function


    You can use scan() to read in a vector, whether numeric or character, from

    a file or the keyboard. With a little extra work, you can even read in data to

    a a list.


    Suppose we have files named z1.txt, z2.txt, z3.txt, and z4.txt. The z1.txt file

    contains the following:


    ```

    123

    4 5

    6

    ```


    The z2.txt file contents are as follows:


    ```

    123

    4.2 5

    6

    ```


    The z3.txt file contains this:


    ```

    abc

    def

    8

    ```


    And finally, the z4.txt file has these contents:


    ```

    abc

    123 6

    y

    ```


    Let''s see what we can do with these files using the scan() function.


    ```

    > scan("z1.txt")

    Read 4 items

    [1] 123 4 5 6

    > scan("z2.txt")

    Read 4 items

    [1] 123.0 4.2

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Read 4 items


    ```

    [1] "abc" "de" "f" "g"

    > scan("24.txt"

    ```


    Read 4 items


    ```

    [1] "abc" "123" "6" "y"

    ```


    In the first case, we got a vector of four integers (though the mode is numeric).
    The second time, since one number was nonintegral, the others were shown as floating-point
    numbers, too.

    In the third case, the scan() function has an optional argument named what, which
    specifies mode, defaulting to double mode. But then we tried again, with what="".
    The nonnumeric characters of the file c3 produced an error. This assigns a character
    string to what, indicating that we want character mode. (We could set what to
    any character string).

    The last call worked the same way. The first item was a character string, so it
    treated all the items that followed strings too.

    of course, in typical usage, we would assign the return value of scan() to a variable.
    Here''s an example:


    ```

    > v <- scan("21.txt")

    ```


    By default, scan() assumes that the items of the vector are separated by whitespace,
    which includes blanks, carriage/line feeds, and horizontal tab. You can use the
    optional sep argument for other situations. For example, we can set sep to the
    newline character to read in each line as a string, as follows:


    ```

    x1 <- scan("23.txt",what="")

    Read 4 items

    x2 <- scan("23.txt",what="",sep="\n")

    x1

    [1] "abc" "de" "f" "g"

    > x2

    [1] "abc" "de" "f" "g"

    > x1[2]

    [1] "de"

    > x2[2]

    [1] "de"

    ```


    In the first case, the strings "de" and "f" were assigned to separate elements
    of x1. But in the second case, we specified that elements of x2 were to be delimited
    by end-of-line characters, not spaces. Since "de" and "f" are on the same line,
    they are assigned to x[2].

    More sophisticated methods for reading files will be presented later in this chapter,
    as methods to read a file one line at a time. But if you want to read the entire
    file at once, scan() provides a quick solution.'
