  md: 'One way to create a matrix is by the matrix() function:


    ```

    > y <- matrix(c(1,2,3,4),nrow=2,ncol=2)

    > y

    [,1] [,2]

    [1] 1 3

    [2] 2 4

    ```


    Here, we concatenate what we intend as the first column, the numbers 1 and 2,
    with what we intend as the second column, 3 and 4. So, our data is (1,2,3,4).
    Next, we specify the number of rows and columns. The fact that R uses column-major
    order determines when these four numbers are put within the matrix.


    Since we matched the entries in the preceding example, and there were four of
    them, we did not need to specify both ncol and nrow, just ncol would have been
    enough. Having four elements in all, in two rows, implies two columns:


    ```

    > y <- matrix(c(1,2,3,4),nrow=2)

    > y

    [,1] [,2]

    [1] 1 3

    [2] 2 4

    ```


    Note that when we print out y, R shows its notation for rows and columns. For
    instance, [,2] means the entirety of column 2, as can be seen in this check:


    ```

    > y[,2]

    [1] 3

    [2] 4

    ```


    Another way to build y is to specify elements individually:


    ```

    > y <- matrix(nrow=2,ncol=2)

    > y[1,1] < 1

    > y[2,1] < 2

    > y[1,2] < 3

    > y[2,2] < 4

    > y

    [,1] [,2]

    [1] 1 3

    [2] 2 4

    ```


    Note that we need to do warn R ahead of time that y will be a matrix and give
    the number of rows and columns.'
