    # 5.1.2 Extended Example: Regression Analysis of Exam Grades Continued


    Recall our course examination data set in Section 1.5. There, we didn''t have
    a header, but for this example we do, and the first few records in the file are
    as follows:


    ```

    "Exam 1" "Exam 2" Quiz

    2.0 3.3 4.0

    3.3 2.0 3.7

    4.0 4.0 4.0

    2.3 0.0 3.3

    2.3 1.0 3.3

    3.3 3.7 4.0

    ```


    As you can see, each line contains the three test scores for one student. This
    is the classic two-dimensional file notion, like alluded to in the preceding output
    of str(). Here, each line in our file contains the data for observation in a statistical
    data set. The idea of a data frame is to encapsulate data such along, with variable
    names, into one object.


    Notice that we have the fields separated by spaces. Other delimiters may be specified,
    notably for comma-separated value (CSV) files (as you see in Section 5.2.5). The
    variable names specified in the first record must be separated by the same delimiter
    used for the data, which is spaces in this case. If the names themselves contain
    embedded spaces, as we have here, they must be quoted.


    We read in the file for before, but in this case we state that there is a header
    record:


    ```

    examsquiz <- read.table("exams",header=TRUE)

    ```


