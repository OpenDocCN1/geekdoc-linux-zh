    # 5.3 Merging Data Frames


    In the relational database world, one of the most important operations is that
    of a join, in which tables can be combined according to the values of a common
    variable. In R, two data frames can be similarly combined using the merge() function.

    The simplest form is as follows:


    ```

    merge(x,y)

    ```'
