  md: '# 14


    # PERFORMANCE ENHANCEMENT:

    SPEED AND MEMORY


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_330_0.png)


    In computer science curricula, a common theme is the trade-off between time and
    space. In order to have a fast-running program, you may need to use more memory
    space.


    On the other hand, in order to conserve memory space, you might need to settle
    for slower code. In the R language, this trade-off is of particular interest for
    the following reasons:


    +   - R is an interpreted language. Many of the commands are written in C and
    thus run in fast machine code. But other commands, and your R code, are pure R
    and interpreted. So, there is a risk that your R application may run more slowly
    than you would like.


    +   - All objects in an R session are stored in memory. More precisely, all objects
    are stored in R''s memory address space. R places a limit of $2^{31} - 1$ bytes
    on the size of any object, even on 64-bit machines and if you have a lot of RAM.
    Yet some applications do encounter larger objects.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'This chapter will suggest ways that you can enhance the performance of your
    R code, taking into account the time/space trade-off.


    # 14.1 Writing Fast R Code


    What can be done to make R code faster? Here are the main tools available to you:


    +   - Optimize your R code through vectorization, use of byte-code compilation,
    and other approaches.

    - Write the key, CPU-intensive parts of your code in a compiled language such
    as C/C++.

    - Write your code in some format of parallel R.


    The first approach will be covered in this chapter, and the other approaches are
    covered in Chapters 15 and 16.

    Optimize your R code, you need to understand R''s functional programming and the
    way R uses memory.


    # 14.2 The Dreaded for Loop


    The r-help discussion list for R often has questions about how to accomplish tasks
    without loops. There seems to be a feeling that programmers should avoid these
    loops at all costs.¹ Those who the queries usually have the goal of speeding up
    their code.


    It''s important to understand that simply rewriting code to avoid loops will not
    necessarily make the code faster. However, in some cases, dramatic speedup may
    be attained, through vectorization.


    # 14.2.1 Vectorization for Speedup


    Sometimes you can use vectorization instead of looping. For example, if x and
    y are vectors of equal lengths, you can write this:


    ```

    z <- x + y

    ```


    This is not only compact, but even more important, it is faster using this loop:


    ```

    for (i in 1:length(x)) z[i] <- x[i] + y[i]

    ```


    Let''s do a quick timing comparison:


    ```

    > x <- runif(1000000)

    > y <- runif(1000000)

    ```


    > By contrast, while loops pose much more of a challenge, because they are difficult
    to vectorize effectively.'
