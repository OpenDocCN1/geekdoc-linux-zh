  md: 'setting, one thread finishes its last value of i, while another thread still
    has two values of i left to do. This would mean our program would finish somewhat
    later than it could. In parallel-processing parlance, we would have a load balance
    problem. With dynamic assignment, the thread that finished when there were two
    values of i left to handle could take one of those values itself. We would have
    better balance and less-all runtime.


    But don''t jump to conclusions. As always, we have the overhead issue to reckon
    with. Recall that a critical pragma in the dynamic version of the code above,
    has the effect of temporarily rendering the program serial rather than parallel,
    causing a slowdown. In addition, for reasons technical to discuss here, these
    pragmas may cause considerable activity overhead. So, in the case, the dynamic
    code could actually be substantially slower than the static version.


    Various solutions to this problem have been developed, such as OpenMP constant
    named guided. But rather than these, the point I wish to make is that they are
    unnecessary. In most situations, static assignment is just fine. Why is this the
    case?


    You may recall that the standard deviation of the sum of independent, identically
    distributed random variables, divided by the mean of that sum, goes to zero as
    the number of terms goes to infinity. In other words, sum are approximately constant.
    This has a direct implication for load balancing concerns: Since the total work
    for a thread in static assignment is the sum of its individual task times, that
    total work will be approximately constant; there will be very little variation
    from thread to thread. Thus, they will finish at pretty close to the same time,
    and we do not need to worry about load imbalance. Dynamic scheduling will not
    be necessary.


    This reasoning depends on a statistical assumption, but in practice, the assumption
    will typically be sufficiently well for the outcome: Static scheduling as well
    as dynamic in terms of uniformity of total work across threads. And since static
    scheduling doesn''t have the overhead problems of the dynamic kind, in most cases
    the static approach will give better performance.


    There is one more aspect to discuss. To illustrate the issue, consider again the
    mutual outlines example. Let''s review the outline of the algorithm:


    ```

    sum = 0

    for i = 0..n-1

    for j = 1..n-1

    for k = 0..n-1 sum = sum + a[i][k]*a[j]

    mean = sum / (n-1)/2

    ```


    Say n is 10000 and we have four threads, and consider ways to partition the for
