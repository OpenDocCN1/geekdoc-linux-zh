  md: '# 3


    # MATRICES AND ARRAYS


    ![](img/4db9fec0a9dac3c51ef8d35d8a30956f_84_0.png)


    A matrix is a vector with two additional attributes: the number of rows and the
    number of columns. Since matrices are vectors, they also have modes, such as numeric
    and character. (On the other hand, vectors are not one-column or one-row matrices.)


    Matries are special cases of a more general R type of object: arrays Arrays can
    be multidimensional. For example, a three-dimensional array would consist of rows,
    columns, and layers, not just rows and columns as in the matrix case. Most of
    this chapter will concern matrices, but we will briefly discuss higher-dimensional
    arrays in the final section.


    Much of R''s power comes from the various operations you can perform on matrices.
    We will cover these operations in this chapter, especially those analogous to
    vector subsetting and vectorization.


    # 3.1 Creating Matrices


    Matrix row and column subscripts begin with 1. For example, the upper-left corner
    of the matrix a is denoted [1,1]. The internal storage of a matrix is in column-major
    order, meaning that first all of column 1 is stored, column 2, and so on, as you
    see in Section 2.1.3.'
