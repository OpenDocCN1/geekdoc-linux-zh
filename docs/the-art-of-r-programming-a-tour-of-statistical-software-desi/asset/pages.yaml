  md: '# 7.8.3 Extended Example: Discrete-Event Simulation in R


    **Discrete-event simulation (DES)** is widely used in business, industry, and
    government. The term *discrete event* refers to the fact that the state of the
    system changes only in discrete quantities, rather than changing continuously.


    A typical example would involve a banking system, say people lining up to use
    an ATM. Let''s define the state of our system at time *t* to be the number of
    people in the queue at time. The state changes only by +1, when someone arrives,
    or by -1, when a person finishes an ATM transaction. This is in contrast to, for
    instance, a simulation of water, in which temperature, barometric pressure, and
    so on change continuously.


    This will be one of the longer, more involved examples in this book.


    It exemplifies many important issues in R, especially concerning global variables,
    and will serve as an example when we discuss approximate global variables. Your
    patience will turn out to be a good investment of time in this section. (It is
    not assumed that the reader has any prior background in DES).


    Central to DES operation is maintenance of the *event list*, which is simply a
    list of scheduled events. This is a general DES term, so the word list does not
    refer to the R data type. In fact, we''ll represent the event list by a data frame.


    In the ATM example, for instance, the event list might arrive at some point in
    the simulation like this:


    +   - customer 1 arrives at time 23.12

    - customer 2 arrives at time 25.88

    - customer 3 arrives at time 25.97

    - customer 1 finishes at time 26.02


    Since the earliest event must always be handled, the simplest form of coding the
    event list is to store it in time order, as in the example. (Readers with computer
    science background might notice that a more efficient approach might use some
    kind of binary tree for storage. Here, we implement it as a data frame, with the
    first row containing the scheduled event; the second row continuing the second
    earliest, and so on.


    The main loop of the simulation repeatedly iterates. Each iteration pulls the
    earliest event from off the event list, updates the simulation time to reflect
    the occurrence of that event, and reacts to it. This action will typically trigger
    the creation of new events. For example, if a customer arrives when the queue
    is empty, that customer''s service will begin—when one event sets up another.
    Our code must then determine the customer''s service time, and then it will know
    the time at which service will be finished, which must be added to the event list.


    One of the approaches to writing DES code is the event-oriented paradigm. Here,
    the code to handle the occurrence of one event directly sets up another event,
    reflecting our preceding discussion.


    As an example to guide your thinking, consider the ATM situation.

    At time 0, the queue is empty. The simulation code randomly generates the time
    of the first arrival, say 2.5. At this point, the event list is simply'
