- "# 黑客 Linux：使用 Kali Linux 工具、通过 Shell、Python 和 Bash 编程学习网络安全原理，初学者指南\n\n\n\n![](img/Image00000.jpg)\n\
  \n\n\n\n\n\n这是长期以来最重要的黑客书籍之一。对于所有将网络安全作为职业道路的初学者来说，这是必读之作。 - `Steve`,高级渗透测试员\n\n\
  “黑客本质系列是我一生中读过的最喜欢的系列黑客书籍之一。” - 匿名黑客评论\n\n“TYE DARWIN 让我尝试了 `Kali Linux`，并以以前所未有的方式激发了我对\
  \ `Shell` 编程的兴趣。” - 亚马逊评论\n\n“黑客的 Linux：学习 Linux 基础以及使用 `bash`、`shell`、`Python`\
  \ 脚本通过 `Kali Linux` 进行黑客攻击学习。” - TYE DARWIN\n\n\n\n\n献给所有通过破坏改变世界的黑客，以及所有以更高的安全性重新构建世界的程序员。\n\
  \n要成为一名黑客，你首先需要成为一名程序员。要成为一名程序员不需要成为黑客，但开发黑客技能可以成倍提升你的信心。 - 匿名引用\n\n## 了解 Linux\
  \ 并安装你喜欢的 Linux 发行版\n\n如果你是一个初学者，可能会好奇 Linux 是什么？让我帮你了解基础知识。Linux 是一个类似于 Windows\
  \ 和 `MacOS` 的操作系统，但具有更高的安全性、稳定性和定制性。你知道吗？它是完全免费且开源的（这意味着源代码不隐藏）。听起来很棒对吧？但你可能好奇 Linux\
  \ 为什么在普通用户中不流行。Linux 是专门为专业人士开发的操作系统。与 Windows 和 `MacOS` 相比，它提供的软件很少。那么你可能好奇谁在使用\
  \ Linux 作为日常机器？Linux 可能不是一个创意系统，但绝对是开发者、程序员、道德黑客、数据库管理员和系统管理员的首选。Linux 是复杂的，并且具有学习曲线。你被\
  \ Linux 的各种可能性所压倒了吗？别担心，我们将通过简单的解释和说明来介绍 Linux。欢迎来到本书的第一个，你将在这里获得……让我们开始吧！\n\n###\
  \ 第一章 Linux 简介\n\n本章主要介绍了学习 Linux 系统的一些方法和经验，包括如何选择适合你的 Linux 发行版，以及每个 Linux 发行版的关系和适用环境。然后总结了学习\
  \ Linux 的通用路线。它还将提供关于构建自己的 Linux 环境的充分信息，最后将介绍一些学习 Linux 的资源。通过本章的学习，初学者在学习 Linux\
  \ 的过程中将不再感到困惑，并找到适合自己的学习方法。\n\n### Linux 在各个领域的现状和趋势\n\n许多初学者有一个非常困惑的问题：“我听过 Linux，但在学习\
  \ Linux 系统之后，你可以在上面做什么呢？或者 Linux 系统具体能做什么？”带着这个问题，本书从 Linux 概述及其与开源软件的关系开始。我们还将讨论\
  \ Linux 的应用领域和未来发展趋势。\n\nLinux 是一个免费开源的类 Unix 操作系统。该系统的内核由 Linus Torvalds 在 1991\
  \ 年首次发布。之后，随着用户空间应用程序的加入，它变成了 Linux 操作系统。严格来说，Linux 只是操作系统内核。“Linux 内核”一术语通常用来表达这一点。Linux\
  \ 通常是指基于 Linux 内核的完整操作系统，其中包含了 GUI 组件和许多其他实用程序。\n\nGNU 通用公共许可证（最常称为 `GNU GPL` 或\
  \ `GPL`）是一种广泛使用的自由软件许可协议。它最初由 Richard Stallman 为 GNU 项目编写，GPL 为计算机程序提供了自由软件的定义。任何衍生自\
  \ GPL 软件的产品都必须在 GPL 许可证下发布，并公开源代码。\n\nLinux 是自由软件和开源软件开发最著名的例子。只要遵循 GNU GPL，任何个人和组织都可以自由地使用\
  \ Linux 的所有底层源代码，并可以自由地进行修改。随着 Linux 操作系统的快速发展，各种集成软件和工具也得到了应用和普及。因此，Linux 已成为开源软件的代名词。红帽\
  \ Linux 是为企业数据库管理员提供的商业化 Linux 操作系统之一。\n\n\n\n\n\n## Red Hat Linux (红帽 Linux)\n\n\
  Red Hat Linux 是红帽发布的最早个人版 Linux。其 1.0 版本于 1994 年 11 月 3 日发布。虽然它的历史没有其他著名的 Linux\
  \ 发行版长，但比许多较新的 Linux 发行版历史要长得多。自 Red Hat 9.0 发布以来，红帽不再开发桌面 Linux 发行版包。Red Hat Linux\
  \ 已停止开发，并将所有精力专注于服务器版本的开发上，即红帽企业 Linux（Red Hat Enterprise Linux）。2004 年 4 月 30 日，红帽正式停止了对\
  \ Red Hat 9.0 版本的支持，标志着桌面版 Red Hat Linux 的正式结束。原始的桌面版 Red Hat Linux 发行版与开源社区的 Fedora\
  \ 合并成为 Fedora Core 发行版。红帽目前分为系列：由红帽提供付费技术支持和更新的 Red Hat Enterprise Linux，以及由社区开发的免费\
  \ Fedora Core。\n\n我们建议向谁推荐这个系统？对于所有需要服务器管理的企业来说，没有比 Red Hat Linux 更好的发行版了。\n\n##\
  \ Fedora Core\n\nFedora Core (FC) 被红帽定位为新技术的测试平台，许多新技术将在 FC 中进行测试。如果这些新技术趋稳定，红帽将考虑将这些软件加入\
  \ Red Hat Enterprise Linux。Fedora Core 1 于 2003 年底发布，FC 定位于桌面用户。FC 提供最新的软件软件包，其版本更新周期也非常短，只有\
  \ 6 个月。由于版本更新频繁，性能和稳定性无法得到保证，通常不建议在服务器上使用 Fedora Core。对于用户来说，Fedora 是一个功能齐全且更新快速的免费操作系统。因此，对于个人应用（如开发和体验新功能），你可以选择这个发行版本。\n\
  \n## Kali Linux\n\n作为一名黑客，你需要了解一个专门为黑客准备的完美 Linux 发行版。此前，它被称为 Blacktrack，由许多志愿者维护。Kali\
  \ Linux 的优势在于在同一个操作系统中为黑客和取证专家提供必不可少的工具。虽然现在 Kali 面临着另一个著名的 Linux 发行版 Parrot Linux\
  \ 的竞争，但我们仍然建议新手使用 Kali Linux 开启黑客生涯。Kali Linux 免费下载，并完全支持所有开源政策。如果你想认真对待黑客技术，那么利用\
  \ Kali 作为你的主操作系统显然是明智之。\n\n## CentOS\n\nCentOS 的全称是“社区企业操作系统”（Community Enterprise\
  \ Operating System）。它是根据开源规范从 RHEL 发布的源代码编译而成的。由于 RHEL 是一款商业产品，所有的红帽标志都必须改为 CentOS\
  \ 自己的标志，这促成了 CentOS 操作系统系统的诞生。两者的区别在于 CentOS 不包含闭源软件。因此，CentOS 不仅可以免费使用，还能享受 CentOS\
  \ 提供的长期免费升级和更新服务。这是 CentOS 的一大优势。CentOS 基于 RHEL 的源码包构建。它的版本号由两部分组成：主版本和次版本。主版本号和次版本号分别对应\
  \ RHEL 的主包和更新包。例如，CentOS 6.5 是基于 RHEL 6.0 的第 5 次更新构建的。然而，从 RHEL 7.0 版本开始，CentOS\
  \ 的版本命名格式发生了微变化。主版本仍然对应 RHEL 的主版本，而次版本则取决于 RHEL 更新包的发布日期。2014 年，CentOS 宣布了与红帽的合作，但\
  \ CentOS 将在新委员会下继续运行，不受 RHEL 的影响。这一策略表明，CentOS 的后续开发将得到红帽的支持。\n\n## SuSE Linux\n\
  \nSUSE 是德国最著名的 Linux 发行版，享有盛誉，但它现在的境遇却相当坎坷。2003 年 11 月 4 日，Novell 宣布收购 SUSE。2004\
  \ 年 1 月，收购顺利完成，Novell 还正式将 SUSE 命名为 SUSE Linux。Novell 对 SUSE 的收购加速了 SUSE Linux 的发展，并将免费的\
  \ SUSE Linux 变成了开源的 openSUSE 社区项目。但在 2010 年，Attachmate 收购了 Novell。在收购后，SUSE Linux\
  \ 的开发受到了阻。仅仅 3 年后，SUSE 再次更换了所有者。2014 年 9 月，Attachmate 被上市公司 Micro Focus 收购。幸运的是，SUSE\
  \ 正式宣布开源是 SUSE 开发的基础，并将继续贡献开源。SUSE 仍将充分支持 openSUSE。尽管 SUSE 多次更换所有者，但这并不影响它的专业性。根据不完全的统计，SUSE\
  \ Linux 现在占据了欧洲 Linux 市场近 80% 的份额，大多数关键应用程序都是在 SUSE Linux 下构建的。\n\n## Ubuntu Linux\n\
  \n\n\n\nUbuntu 是一种基于桌面应用程序的 Linux 操作系统。基于 `Debian GNU/Linux`，`Ubuntu` 旨在为普通用户提供一个由自由软件构建的主流、最新且稳定的操作系统。`Ubuntu`\
  \ 拥有强大的社区力量，用户可以轻松地从社区获得帮助。使用此 `Ubuntu`，`Linux mint` 也是基于此开发的，我们将在书中大部分情况下使用它来讨论各种概念。\n\
  \n上述章节主要介绍了最常见的 Linux 发行版。事实上，有许多 Linux 发行版。常见的有 `Debian GNU/Linux`、`Mandriva`、`Gentoo`、`Slackware`、`Knoppix`、`MEPIS`\
  \ 和 `Xandros`，以及红旗 Linux (Red Flag Linux)、深度 (Deepin Linux) 和麒麟 Linux 等，这些这里将不再详细介绍。事实上，观察各种\
  \ Linux 发行版，Linux 发行版无非是这两个方面的发展：一个是服务器市场，另一个是桌面市场。最后，根据目的，我们的建议是什么？以 `Ubuntu Linux`\
  \ 为代表的 Linux 发行版采取桌面市场路线。尽管它们给用户带来了很多惊喜并且更新速度很快，但 Linux 桌面市场的发展并不乐观，因为桌面市场有像 `Windows`\
  \ 这样强大的竞争对手。目前，`Ubuntu Linux` 也开始在企业服务器市场展现其实力。\n\n以 `Red Hat` 系列为代表的 Linux 发行版现在主要面向企业级\
  \ Linux 服务器市场，专注于企业版 Linux 的开发，而其他发行版则专注于 Linux 服务器市场。这两个主要的 Linux 发行版厂商现在都采取了 Linux\
  \ 服务器市场路线，这表明 Linux 作为企业服务器具有广阔的发展前景。根据权威部门的统计，Linux 在服务器市场中的份额逐年上升。\n\n事实上，Linux\
  \ 的许多应用程序都是针对 Linux 服务器的，而本书的描述主要针对服务器环境下的各种 Linux 应用。作为一名黑客，你需要理解企业如何使用 Linux 来使其场景正常运行。即使是从像\
  \ `Kali Linux` 这样的桌面系统开始破解目标，你也需要完全意识到构建和维护服务器的 `Linux server` 的功能。我们都知道，所有敏感信息和我们绝对需要的信息都存储在服务器中。\n\
  \n### 初学者的首选是什么？ - LinuxMint 系列\n\n在学习了几个主要的 Linux 发行版后，我们发现了为什么选择 `Linux Mint`\
  \ 作为初学者入门学习的原因。`Linux Mint` 现在拥有庞大的用户网络，80% 的网络 Linux 资源基于 `Ubuntu` 发行版。如果你在学习过程中遇到任何问题，可以轻松在互联网上搜索解决方案。`Linux\
  \ Mint` 系列版本很容易获得。你可以从 `Linux Mint` 官方网站或 163 开源、SOHU 开源、云源等站点下载各种版本的 `Mint` 安装介质。\n\
  \n如果这是你第一次接触 Linux，建议先安装 `Fedora Core`。`Fedora Core` 易安装，具有良好的硬件支持，并且界面漂亮。你也可以体验\
  \ Linux 的最新功能。如果你对 Linux 有了一定的了解并需要进行深度学习，建议使用 `CentOS` 发行系统。\n\n`Linux Mint` 拥有广泛的应用程序，具有典型性和代表性。现在基本上所有互联网公司的后端服务器都使用\
  \ `Linux Mint` 作为操作系统。可以说，学习了 `Linux Mint` 后，不仅可以快速融入企业工作环境，还可以类比学习，快速掌握其他相似的 Linux\
  \ 发行版。同时，周围学习 Linux 的用户通常也基于 `Mint`，这样沟通变得很方便，学习中的问题也更容易解决。在通过 `Linux mint` 熟练掌握\
  \ Linux 后，作为黑客，你可以通过安装 `Kali Linux` 来扩展你的专业知识，并可以使用其中大量的工具进行系统攻击。\n\n### 桌面平台首选是什么？\
  \ - Ubuntu Linux\n\n提到 Linux 桌面市场，`Ubuntu Linux` 占据了桌面 Linux 的近半份额。`Ubuntu Linux`\
  \ 是最流行的 Linux 桌面，界面美丽、简单且华丽。如果你想在 Linux 下进行娱乐休闲，`Ubuntu Linux` 绝对是首选。\n\n`Ubuntu`\
  \ 的安装非常用户友好，只需按照提示一步步操作。`Ubuntu` 被称为硬件支持最好、最全面的 Linux 发行版之一。许多在其他发行版或默认配置无法使用的硬件在\
  \ `Ubuntu` 上都可以轻松安装和使用。因此，用户可以像安装 `Windows` 一样轻松地安装 `Ubuntu`，享受 `Ubuntu Linux` 的乐趣。\n\
  \n### 企业应用首选是什么？ - RHEL/CentOS 系列\n\n企业级应用追求可靠稳定，这对构建企业级应用的系统平台提出了高可靠性和稳定性。企业级 Linux\
  \ 发行版可以解决这个问题。\n\n`RHEL` 和 `Centos` 这两个 Linux 发行版之间没有太大区别。区别在于 `RHEL` 是一个商业 Linux\
  \ 发行版。如果你想使用 `RHEL` 版本，你需要购买商业授权和咨询服务。`Red Hat` 提供系统技术支持并提供免费的系统升级。目前，`Red Hat`\
  \ 官网不再提供免费下载的 CD 介质。如果你需要尝试，可以通过官网下载带有时间限制的 Linux 评估版。而 `CentOS` 是非商业发行版。你可以从互联网免费下载每个版本的\
  \ `CentOS` 安装介质，但 `CentOS` 不提供商业支持。当然，用户不需要承担任何商业责任。\n\n那么，我应该选择 `CentOS` 还是 `RHEL`\
  \ 呢？这取决于你的公司是否有相应的技术实力。如果是纯业务企业，建议购买 `RHEL` 发行版并购买相应的服务，可以节省企业的 IT 管理成本并获得专业的技术支持服务。相反，如果企业技术较强，并且拥有多年\
  \ Linux 经验，那么 `CentOS` 发行版将是最佳选择。\n\n### 黑客和渗透测试者的首选是什么？ - Kali Linux\n\n`Kali Linux`\
  \ 是第一个扩展了黑客视野的操作系统，它维护了一个包含各种用途工具的可靠发行版。`Kali Linux` 提供的匿名性也比其他可用软件好，但由于臃肿较多，因此仅建议在内存巨大的系统使用。\n\
  \n### 接下来做什么？掌握 Linux 的策略\n\n到此，我们完成了对各种发行版的简要介绍，并提供了大量的示例来解释对于每个人来说最好的操作系统是什么。在下一章中，我们将讨论一些可以帮助你成为精通\
  \ Linux 专家技巧。\n\n在上一章中，我们讨论了各种 Linux 发行版。在进入安装程序之前，我们需要为你提供一些技巧，以便你以一种对你长期来说有效的方式掌握\
  \ Linux。这只是为了让你更好地理解获取需要实际使用的技术技能的策略。\n\n#### 如何养成良好的 Linux 习惯？\n\n学习 Linux 后，请不要用\
  \ Windows 的工作方式来思考问题，因为它们之间确实存在巨大差异。例如，它们的内存管理和进程操作非常不同。这些差异将在后续章节中描述。因此，对于初学者来说，放下\
  \ Windows 的思维并尝试用新概念来挖掘 Linux 的独特潜力是非常重要的。\n\n#### 习惯命令行模式\n\nLinux 是一个由命令行组成的操作系统。操作系统的本质和核心在于命令行。无论图形化界面发展到什么种程度，命令行模式永远不会改变。Linux\
  \ 命令有许多强大的功能：从简单的磁盘操作、文件访问，到复杂图像和流媒体文件的制作，它们与命令行密不可分。因此，可以说命令是学习 Linux 系统的基础。在很大程度上，学习\
  \ Linux 意味着学习命令。许多 Linux 大师实际上都是命令行大师。\n\n#### 理论与实践的结合\n\n许多初学者会遇到这样的问题：他们熟悉系统的每一个命令，但当系统故障、无法启动时，他们不知道什么时候该用哪种命令。这对于许多\
  \ Linux 初学者来说是最无助的事。从根本上说，学习的理论知识与系统的实际操作结合得不好。很多 Linux 知识，例如每个命令参数的含义，在书中非常清晰，似乎很容易理解，但一旦结合使用就没那么容易了。没有多次的实实践，技能是不可能完全掌握的。\n\
  \n人脑不像计算机的硬盘。除非硬盘损坏或格式化，否则存储的数据将一直存储在硬盘中并可以随时调回。在人类的记忆曲线中，必须不断练习才能更牢固地记住一件事。学习 Linux\
  \ 也是如此。如果你不能坚持学习，你就会学后忘前。还有一些 Linux 初学者学了很多 Linux 知识，但因为长时间没有使用，事情在短时间内就被遗忘了。随着时间推移，他们对学习失去了信心。可见，要培养你自己的战斗技能，只需要勤奋并愿意练习。这也是良好学习\
  \ Linux 的基础。\n\n#### 学习使用在线帮助\n\n每个 Linux 发行版的维护时间相对短，对于 Linux 初学者来说通常不够。事实上，当你安装了完整的\
  \ Linux 系统后，已经包含了强大的帮助界面，但你可能还没有发现，或者还没有掌握使用它的技能。例如，如果你不熟悉 `tar` 命令，只需在命令行输入 `man\
  \ tar` 即可详细说明。主流 Linux 发行版都带有详细的帮助文档，从系统安装到系统维护，对于用户来说，仔细阅读文档可以解决 60% 的问题。\n\n####\
  \ 学会独立思考和解决问题\n\n遇到问题时，首先想到的应该是如何自己解决它。有很多方法可以解决它，例如通过这些方法、阅读书籍、搜索信息、浏览技术论坛可以解决\
  \ 90% 的问题。独立思考和解决问题不仅能提高你的能力，还能快速提升技术。如果你无法通过上述方法解决问题，可以请教他人，并在获得答案后记录解决过程。最忌讳的是遇到问题就问别人，从长远来看，遇到问题时依赖他人将不会提高你的技术知识。\n\
  \n#### 学习英语\n\n如果你想深入学习 Linux，必须尝试查看英文文档。因为最好、最全面的文档都是英文编写的，并且技术发布大多是英文。即使你来自非英语国家，技术文档也被翻译成英文并发布。在安装新软件时，首先阅读\
  \ readme 文件是有必要的，你需要学习一点英语。\n\n#### Linux 学习路线图\n\nLinux 操作或管理人才是企业需要的技能。根据多年的工作经验，作者总结了一套学习\
  \ Linux 的策略。读者可以以此为基础掌握关键点。我认为将学习分为三个阶段：初级、中级和高级。\n- 初级阶段：主要介绍 Linux 基础知识和基本应用。如果你是\
  \ Linux 新手，主要阶段是学习命令。阅读书籍是基础。\n- 中级阶段：专注于服务器配置，涉及各种应用配置、网络配置以及系统安全。该阶段难度在于构建各种服务器，需要全面的知识。\n\
  - 高级阶段：编程语言和集群架构。为了成为系统架构师，有必要精通编程语言和集群架构。\n\n### 第四章 Linux 安装准备工作\n\n在前一节中，我们介绍了\
  \ Linux 的各种发行版，并提供了大量的示例来解释对于每个人来说最好的操作系统是什么。在进入安装程序之前，我们需要为你提供一些准备工作。如果你对当前的 Linux\
  \ 系统还不满意，建议访问 `distrowatch.com` 查看著名的 Linux 发行版及其特征。如果你是 `Manjaro`？是 `Linux Mint`？是基于\
  \ `Debian` 的发行版？还是你是一个技术高手并选择了 `Arch Linux`？无论使用哪种 Linux 系统，本书将帮助你掌握 Linux 的基础哲学，这是重要的。本章将详细介绍\
  \ Linux 的安装方法。\n\n#### 安装 Linux\n\n在学习 Linux 的各种操作之前，你必须首先安装 Linux 系统。与 `Windows`\
  \ 系统相比，Linux 系统的安装有很多点需要注意，例如选择合适的安装方法并确定方案。本章将以 `Linux Mint` 最新版本为例，说明 Linux 系统的安装过程，帮助解决安装过程中遇到的问题。警告：在进行安装程序之前，务必对进行备份。安装过程中可能会出现任何问题。\n\
  \n#### 安装要求\n\n通常，每个 Linux 发行版都会列出最低要求和推荐配置，不同的安装选项（如图形界面或命令行界面）对系统有不同要求。从官方网站下载\
  \ Linux 发行版镜像时，通常会显示最低要求。如果没有，请查看论坛或通过 Google 搜索详情。Linux 的硬件要求较低，可以使用 CD 来安装 Linux，运行速度比\
  \ `Windows` 快得多。本章将讨论某些特殊应用程序的安装。\n\n### 第五章 Linux 安装步骤\n\nLinux 系统的安装多样且灵活，可以根据不同的环境选择不同的方法。常用方法包括硬盘安装、U\
  \ 盘安装、网络安装和 CD 安装。\n\n#### 硬盘安装方法\n\n硬盘安装通常基于 `Windows` 系统。例如，如果你想安装 Windows 和 Linux\
  \ 共存的双系统，或者系统没有光驱，可以使用硬盘方法。注意：由于 Windows 的文件系统格式与 Linux 完全不同，绝对不可能在同一个分区安装两者。这种类型的安装通常不建议普通用户。如果你使用的是低端系统但需要高内存操作系统，建议使用硬盘安装\
  \ Linux。\n\n#### U 盘安装方法\n\n现在的服务器通常没有配备光驱，且 CD 安装速度慢，批量安装系统时会浪费大量时间。此时，你可以通过 USB\
  \ 盘安装系统，这种方法既快又便宜。所有服务器基本上都配备了 USB 接口，U 盘安装是通用的。最后，安装速度很快。接下来的章节将介绍使用 `Rufus` 和\
  \ `Usb writer` 软件进行 U 盘安装的方法。\n\n#### 网络安装方法\n\n安装单台服务器或少量服务器（少于 10 台）可以使用磁盘或 CD，但如果你想安装成百上千台服务器，这种方法显然是不现实的。那么如何在界面快速安装呢？网络安装通常是大规模自动化过程。常用的批量网络安装工具是\
  \ `Kickstart`。通过 `Kickstart`，系统管理员可以通过创建答案文件自动完成系统安装。工作原理是：安装程序只需告诉 Kickstart 从哪里读取\
  \ `ks.cfg` 文件，然后 Kickstart 就会根据文件的设置自动完成系统安装。由于网络安装需要网络服务的支持，对初学者来说很难，因此此处不介绍。后续章节关注通过\
  \ CD 和 U 盘安装。\n\n#### 使用 CD 安装\n\n通过 CD 安装系统是最常见的软件安装方法，简单易懂。本章重点介绍通过 CD 安装，前提是电脑有光驱。你可以轻松从互联网上制作\
  \ ISO 格式的 Mint 版本安装盘，然后将 ISO 文件刻录到 CD。例如，可以从官网下载 `Linux Mint` 17 版本。下载完成后，通过 `UltraISO`、`InraRecorder`\
  \ 和 `Nero` 等刻录软件将 ISO 文件写入 DVD，然后进入 BIOS 将电脑的启动顺序设置为 DVD-ROM。保存设置后，将 DVD 插入光驱并重启电脑。光盘会自动启动并开始安装程序。下一章将讨论分区等高级内容。\n\
  \n### 第六章 Linux 中的分区\n\n分区是在计算机上执行 Linux 安装时的基本程序也是强制性步骤。即使你安装 `Windows` 系统，也需要分区。虽然\
  \ `Windows` 提供了分区工具，但在安装 Linux 时需要分区。\n\n#### 分区命名方案\n\n在安装 Linux 前，我们需要为你提供一些技巧，以便你以一种对你长期来说有效的方式掌握\
  \ Linux。这只是为了让你更好地理解获取需要实际使用的技术技能的策略。在 Linux 命名方案中，硬盘通常表示为 `/dev/sda`、`/dev/sdb`\
  \ 等，而分区则在硬盘名称后面跟上数字。例如：`/dev/sda1`、`/dev/sda2`、`/dev/sda3`、`/dev/sda4`、`/dev/sda5`、`/dev/sda6`、`/dev/sda7`、`/dev/sda8`、`/dev/sda9`、`/dev/sda10`、`/dev/sda11`、`/dev/sda12`、`/dev/sda13`、`/dev/sda14`、`/dev/sda15`、`/dev/sda16`。对于\
  \ NVMe 硬盘，通常为 `/dev/nvme0n1p1`、`/dev/nvme0n1p2` 等。对于 USB 盘，通常为 `/dev/sdc1`、`/dev/sdc2`\
  \ 等。这种命名方式允许通过在设备名称后添加数字来区分不同的分区。\n\n\n\n\n- `/boot`: 存储系统启动信息和内核信息。\n- `/usr`:\
  \ 存储系统应用程序软件安装信息。\n- `/var`: 存储系统日志信息。\n\n\n\n\n## Linux 分区指南\n\n关于每个分区的含义，请参阅下一章获取更多详细信息。根分区包含\
  \ Linux 系统的所有目录。如果在安装系统时仅分配了根分区，上述的 `/boot`、`/usr` 和 `/var` 都将包含在根分区中。如果你单独划分了 `/boot`、`/usr`\
  \ 等，这些分区将不再占用根分区的空间。\n\n### 分区界面\n\n在所示界面中，首先选择 100GB 的 `sda` 磁盘，然后在左下角将有两个分区选项：\n\
  - **自动配置分区 (Automatically configure partitioning)**：自动分区。\n- **我将配置分区 (I will configure\
  \ partitioning)**：手动分区。\n\n如果你熟悉分区，可以直接默认选择自动分区。但是，出于学习考虑，建议选择手动分区。在此选择手动分区并点击**完成（Done）**\
  \ 按钮。\n\n### 分区方案\n\n选择手动分区后，从下拉菜单中选择分区方案：\n1. **标准分区 (Standard Partition)**：用于各种文件系统或\
  \ `swap` 空间。\n2. **Btrfs**: 由 Oracle、Red Hat、Intel 和 Suse 使用的下一代 Linux 文件系统。\n3.\
  \ **LVM**: 逻辑卷管理。允许灵活的磁盘使用并提高性能。\n4. **LVM 精简配置 (LVM Thin Provisioning)**：LVM 的升级版本，用于动态存储池分配。\n\
  5. **RAID**: 当存在两个或多个磁盘时出现；用于数据冗余的软件 RAID。\n\n### 创建分区\n\n### 1. 根分区 (Root Partition)\n\
  创建一个根分区并将空间尽可能大，以防止系统不稳定。如果分离了 `/boot` 和 `/usr`，`20GB` 就足够了。\n- **挂载点**: `/`\n-\
  \ **所需容量**: 例如，`20G`\n- 点击**添加挂载点 (Add mount point)**。\n\n### 2. Boot 分区 (Boot Partition)\n\
  点击 `+` 按钮创建 `/boot` 挂载点。\n- **挂载点**: `/boot`\n- **所需容量**: `500M`\n- 点击**添加挂载点 (Add\
  \ mount point)**。\n\n### 3. 交换分区 (Swap Partition)\n在挂载点下拉列表中选择 `swap`。\n- **所需容量**:\
  \ 例如，`4096M`。\n\n### 4. /usr 和 /var 分区\n分别创建这些分区以管理应用程序和日志。`/var` 分区应该较大，因为它存储的日志随时间增长。\n\
  \n### 配置分区详情\n\n点击左窗格中的挂载点以修改设置：\n- **文件系统 (File System)**：选项包括 `xfs`（RHEL/CentOS\
  \ 7.x+ 默认）、`ext2`、`ext3`、`ext4`、`swap`、`vfat` 和 `BIOS boot`。\n- **标签 (Label)**：分区的自定义标识。\n\
  - **设备 ID**：一旦建立，ID 是固定的（例如 `/dev/sda1`）。\n\n点击**更新设置 (Update Settings)** 完成。\n\n\
  ### 网络设置\n\n在安装过程中，导航到**网络与主机名 (NETWORK & HOST NAME)** 部分：\n- **方法 (Method)**：`自动\
  \ DHCP (Automatic DHCP)` 或 `手动 (Manual)`。\n- **手动 IPv4 配置**:\n  - **地址 (Address)**:\
  \ `192.234.56.101`\n  - **子网掩码 (Subnet mask)**: `255.155.255.0`\n  - **网关 (Gateway)**:\
  \ `192.987.56.1`\n  - **DNS 服务器 (DNS servers)**: `113.5.5.5`\n\n你可以使用以下命令验证网络状态：\n\
  ```bash\nroot@server : netstat\n```\n\n### 完成安装\n\n1. 点击**开始安装 (Begin Installation)**。\n\
  2. 为管理员账户设置**根密码 (ROOT PASSWORD)**。\n3. **创建用户 (User Creation)**：创建一个标准用户账户和密码。\n\
  4. 安装完成后，点击**重启 (Reboot)**。\n\n## Kali Linux 工具：Nmap\n\n`nmap` 是一种用于扫描开放端口的渗透测试工具。\n\
  \n### 基础用法\n```bash\nroot@server : nmap\nroot@server : nmap www.google.com\nroot@server\
  \ : nmap -V 192.32.222.12\n```\n\n### 使用标志的高级扫描\n- `-sT`: TCP 建立扫描。\n- `-sS`: TCP\
  \ SYN 扫描。\n- `-p`: 指定端口（例如 `-p 80,443`）。\n- `-O`: 操作系统检测。\n- `-sV`: 版本检测。\n\n###\
  \ 导出结果\n要将扫描结果保存到文件，使用输出重定向：\n```bash\nroot@server : nmap -sT 192.168.1.1 > results.txt\n\
  ```\n\n## Python 脚本：基础\n\n### 变量 (Variables)\n变量用于存储数据。在 Python 中，类型是动态推的。\n```python\n\
  name = \"LinuxUser\"\nage = 10\n```\n\n### 命令替换 (Command Substitution)\n`()` 语法允许你运行一组命令并将输出用于变量。\n\
  ```python\nresult = $(ls)\n```\n\n## Bash 脚本：基础\n\n### Shebang\n每个脚本都应该以 shebang\
  \ 开头以指定解释器：\n```bash\n#!/bin/bash\n```\n\n### 运行脚本\n1. 创建文件：`script.sh`。\n2. 赋予可执行权限：\n\
  ```bash\nchmod +x script.sh\n```\n3. 执行它：\n```bash\n./script.sh\n```\n\n### 输入与输出\n\
  使用 `echo` 输出，使用 `read` 输入。\n```bash\necho \"Enter your name:\"\nread name\necho\
  \ \"Hello $name\"\n```\n\n### 管道与重定向\n管道 `|` 将一个命令的输出传递给下一个命令。\n```bash\nls | grep\
  \ \".txt\"\n```\n重定向处理输出到文件：\n```bash\necho \"data\" > file.txt  # 覆盖\necho \"more\
  \ data\" >> file.txt # 追加\n```\n\n### 控制流\n**If 语句**:\n```bash\nif [ $var -eq 5\
  \ ]; then\n    echo \"Equal five\"\nelse\n    echo \"Not five\"\nfi\n```\n\n**循环\
  \ (Loops)**:\n```bash\nfor i in {1..5}; do\n    echo \"Iteration $i\"\ndone\n```\n\
  \n## Python：函数与对象\n\n### 函数 (Functions)\n函数是可重用的代码块。\n```python\ndef greet(name):\n\
  \    print(f\"Hello {name}\")\n\ngreet(\"World\")\n```\n\n### 面对象编程 (OOP)\n类是对象的模板。\n\
  ```python\nclass Car:\n    def __init__(self, brand, color):\n        self.brand\
  \ = brand\n        self.color = color\n\n    def drive(self):\n        print(f\"\
  The {self.color} {self.brand} is driving.\")\n\nmy_car = Car(\"Tesla\", \"Red\"\
  )\nmy_car.drive()\n```\n\n"
