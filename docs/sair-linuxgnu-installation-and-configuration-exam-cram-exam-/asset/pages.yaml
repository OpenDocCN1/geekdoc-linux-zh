- pgno: 328
  md: '# Question 6


    Answer c is correct. It is fips (First Interactive Partition Splitter), that allows
    you to split partitions without losing data. Once split, you can then use fdisk
    to allocate space to both your swap and root partitions from the new, empty partition.
    The fdisk command can only split partitions by deleting data within a partition;
    therefore, answer a is incorrect. The boot directory (/boot) needs only a few
    megabytes of space. You do not need to set up a separate partition for this directory.
    In any case, allocating 10GB for this directory is not wise. Therefore, answer
    b is incorrect. Deleting partitions deletes data; therefore, answer d is incorrect.


    # Question 7


    Answers a, b, and c are correct. With the GPL, all interested developers participate
    in the development process, even if GPL software is developed inside a single
    company. With the GPL, users have access to the source code, so they can work
    on improvements after a release. And the motivator behind many Linux users'' work
    is prestige, not profit. However, Microsoft does hire some of the best developers
    in the industry. Therefore, answer d is incorrect.


    # Question 8


    Answer b is correct. The range of IP addresses that can be assigned to a network
    does not include the network or broadcast address. In this case, those addresses
    are 192.168.33.0 and 192.168.33.255, respectively. Therefore, answer a is incorrect.
