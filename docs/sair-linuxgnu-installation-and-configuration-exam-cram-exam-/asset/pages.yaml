    Techniques you''ll need to master:


    +   - ✓ Finding shortcuts

    +   - ✓ Mastering systematic analysis

    +   - ✓ Understanding system log files

    +   - ✓ Addressing installation errors

    +   - ✓ Using rescue disks

    +   - ✓ Solving boot errors

