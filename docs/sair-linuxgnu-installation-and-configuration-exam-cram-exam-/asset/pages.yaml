  md: '# Question 1


    Answer a is correct. You can sell GPL free software for a profit. Because you
    need to release the source code with GPL software, answer b is incorrect. Not
    all “free” software downloaded from the Internet is covered by the GPL. Therefore,
    answer c is incorrect. Because the GPL doesn’t allow you to make the software
    proprietary, answer d is incorrect.


    # Question 2


    Answer c is correct. The up arrow on your keyboard is the only way to recall your
    history of previous commands, from newest to oldest. The down arrow moves through
    your history in the opposite direction; therefore, answer a is incorrect. The
    !w command executes the last command that you ran that started with the letter
    w. Because you don’t know which command that is, answer b is incorrect. The w
    command is a command unto itself; therefore, answer d is also incorrect.


    # Question 3


    Answer c is correct. Only the Linux boot floppy allows you to boot the Linux kernel.
    And you want to use the /sbin/lilo command to restore the /etc/lilo.conf file.
    There is no /etc/mbr.conf file; therefore, answer a is incorrect. You can’t get
    to the /sbin/lilo command with the MS-DOS boot floppy; therefore, answer b is
    incorrect. Because the fdisk /mbr command restores an MS-DOS master boot record
    (MBR) without any boot option for Linux, answer d is incorrect.


    # Question 4


    Answers a, b, and d are correct. You can exit from a command-line interface shell
    with the exit, logout, or Ctrl+D command. Because Linux does not recognize the
    logoff command, answer c is incorrect.


    # Question 5


    Answer a is correct. When you want to add the contents of a file to the end of
    another file, you use the double arrows (>>) to redirect standard output to the
    end of that file. Because the 2> redirects standard errors, answer b is incorrect.
    The single arrow (>) overwrites the contents of the file named bigmemos; therefore,
    answer c is incorrect. Because there is no type command in Linux, answer d is
    incorrect.'
