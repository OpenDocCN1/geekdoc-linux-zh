  md: '# EXAM CRAM


    > > "Boy, the Exam Cram did the trick. I swear by these books, and I''ll tell
    you why. I haven''t found any other book that is this thorough, with the added
    bonus of describing exactly why an incorrect answer is wrong. Now, I positively
    would not try a test without the Exam Cram books."

    > > —William Ash


    # In This Book You''ll Learn How To:


    +   - Work to the General Public License

    +   - Use Linux resources online

    +   - Understand Linux structure

    +   - Customize Linux for your hardware

    +   - Configure Linux graphics

