- pgno: 122
  md: 'networks. You need the IP address of at least one nameserver to translate names
    like coriolis.com to IP addresses. Because you already need an IP address for
    your computer, a DHCP server won''t help you. Therefore, answer c is incorrect.
    Although it''s useful to have the IP addresses for all other computers on your
