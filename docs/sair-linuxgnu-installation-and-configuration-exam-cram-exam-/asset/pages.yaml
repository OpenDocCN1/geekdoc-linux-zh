- pgno: 106
  md: '# Installation Options


    +   **Terms you''ll need to understand:**

    +   - ✓ Local device installation

    +   - ✓ Network installation

    +   - ✓ Linux Loader (LILO)

    +   - ✓ rawrite


    +   **Techniques you''ll need to master:**

