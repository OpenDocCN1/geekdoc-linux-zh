- pgno: 118
  md: '# Practice Questions


    # Question 1


    You can install Linux from which of the following? [Check all correct answers]


    - a. CD-ROM

    - b. Floppy disks

    - c. Network File System connection

    - d. FTP connection


    Answers a, b, c, and d are correct. You can install Linux from just about any
    media or through any network connection that you can configure through a Linux
    boot disk.


    # Question 2


    Which of the following is the Linux way to manage your choice between two or more
    operating systems on your computer?


    - a. Linux Commander

    - b. Partition Magic

    - c. Linux Loader

    - d. Linux Manager


    Answer c is correct. The Linux Loader is more commonly known as LILO, which is
    the boot manager that you can install on your hard or floppy disk to give you
    a choice of operating systems. Linux Commander and Linux Manager do not exist;
    therefore, answers a and d are incorrect. Although you can use Partition Magic
    to set up a choice between operating systems, it is a commercial product that
    you install through MS-DOS or Microsoft Windows. Therefore, answer b is incorrect.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Question 3


    How do you set up the installation of Linux over a network?


    +   - a. Use your telephone modem to connect to your Internet Service Provider
    (ISP). Connect to a network with Linux installation files.

    +   - b. Use the rawrite program to set up network boot floppy disk(s). Use these
    boot disks to start the Linux setup program. Connect to the appropriate network
    server after the setup program boots.

    +   - c. Download the appropriate network boot floppy disk(s). Use these boot
    disks when prompted by your Linux CD-ROM-based setup program. Connect to the appropriate
    network server after the setup program boots.

    +   - d. Boot your computer from the Linux installation CD. When prompted, enter
    the IP address of the network server with your Linux installation files.


    Answer b is correct. The rawrite program is an MS-DOS-based program used to copy
    disk images to floppies. These images allow you to boot a Linux system and install
    appropriate network files. After you use these boot disks, you should be able
    to connect to the appropriate network server. Installing Linux through a telephone
    modem is not practical; therefore, answer a is incorrect. Linux CD-ROM-based setup
    programs generally do not allow you to connect to a network to download installation
    files; they are already available on CD-ROM. Therefore, answers c and d are incorrect.


    # Question 4


    Which of the following statements is a characteristic of Linux distributions?


    +   - a. Every Linux distribution can be installed in an MS-DOS partition.

    +   - b. Some Linux distributions use Red Hat kernels.

    +   - c. Some Linux distributions are based on other distributions.

    +   - d. Every Linux distribution can be installed in a Linux swap partition.


    Answer c is correct. Under the provisions of the GPL, anyone can repackage anyone
    else''s GNU/Linux distribution. Because Linux generally can''t be installed in
    an MS-DOS partition, answer a is incorrect. There is no kernel exclusive to Red
    Hat; therefore, answer b is incorrect. Although Linux distributions use swap partitions,
    their files are installed under various directories. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Question 5


    Which of the following commands can you use to copy a boot image to a formatted
    1.44MB floppy disk? The name of the file is boot.img.


    +   - a. rawrite boot.img a:

    +   - b. rawrite

    +   - c. dd if=/mnt/cdrom/images/boot.img a:

    +   - d. copy boot.img a:


    Answer b is correct. When you run this command in MS-DOS mode, you are prompted
    for the image that you want to copy and the location of the floppy drive. Because
    the command in answer a does not work, it is not correct. For more information
    on the rawrite syntax, type the rawrite -h command. The dd command is a Linux
    command. Although you can create boot disks in Linux, there is no a: drive in
    a Linux computer; therefore answer c is incorrect. An image file is an archive
    of several different files. You can''t just copy the image; you need a command
    like rawrite to unpack the files to your floppy. Therefore, answer d is incorrect.


    # Question 6


    Which of the following commands can you use to format or activate a Linux swap
    file?


