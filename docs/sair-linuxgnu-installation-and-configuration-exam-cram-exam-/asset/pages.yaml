    +   - ✓ ISA, BIOS, PCI

    +   - ✓ IRQ, I/O, DMA, shared memory address


    Techniques you''ll need to master:


    +   - ✓ Describing the main Linux modules

    +   - ✓ Using multitasking and multiuser features

    +   - ✓ Understanding the benefits of the command-line interface (CLI)

    +   - ✓ Working with the interaction between Linux and computer hardware

