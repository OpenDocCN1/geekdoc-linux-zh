    disk. Because you can have up to four primary partitions, they are designated
    as 1, 2, 3, and 4. The first logical drive that you create is in position number
    5, even if you only have only 1 primary partition.


    You can see some examples of how this naming convention works in Table 4.1.


    # Other Means


    If you want to keep your MS-DOS or Microsoft Windows programs, you don''t have
    to set up Windows and Linux in a dual-boot configuration. And if you do have both
    operating systems in a dual-boot, you don''t have to reboot to go from one to
    the other.


    Linux includes DOS emulators, known as DOSEMU utilities. These utilities allow
    you to use different commands to directly read, write, and execute MS-DOS files.
    Linux also includes emulators that can run some Microsoft Windows 3.1 and 9x programs,
    which are based on the work of the Windows Is Not an Emulator (WINE) project.
    Unfortunately, emulators like WINE are still "alpha" software. In other words,
    because development work is still in progress, they are not suitable for general
    use. As of this writing, you cannot reliably run key applications like Microsoft
    Word through WINE.


    Another option is the commercial product known as VMware, which allows you to
    run any current Windows or Linux operating system inside Linux or Windows NT/2000.
    VMware can set up a virtual machine in a large file or access either operating
    system in other local disk volumes. One significant drawback is that it requires
    a lot of RAM: a minimum of 64MB on Linux and 96MB on Windows NT/2000.


    # The Filesystem Hierarchy Standard


    When you install Linux, you can set up one big volume or separate volumes for
    the directories of your choice. The advantage of setting up several volumes is
    that


    Table 4.1 Typical partition names.


    | Name | Description |

    |------|-------------|

    | hda3 | The third primary partition on the first hard disk. |

    | sdb6 | The second logical drive on the second SCSI hard disk. |

    | hda8 | The fourth logical drive on the first hard disk. |

    | hdb | Because this has no number, it refers to a CD-ROM. And because it is in
    the second position, it suggests that you have only one regular hard drive on
    your computer. |'
