- pgno: 40
  md: '# A Short History of Linux


    **Terms you''ll need to understand:**


    +   - Open source

    +   - Free software

    +   - Free Software Foundation (FSF)

    +   - GNU''s Not Unix (GNU)

    +   - General Public License (GPL)

    +   - Copyleft

    +   - Halloween Documents


    **Techniques you''ll need to master:**


    +   - Understanding the background behind Linux

    +   - Explaining different styles of software licensing and documentation

    +   - Describing the use and development of "free software"

    +   - Getting Linux documentation over the Internet

    +   - Finding documentation inside Linux'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'A sense of history is important on the Sair Linux/GNU Level 1 Installation
    and Configuration exam. As a Linux administrator, you need to explain the benefits
    and obligations of using open source software to nontechnical users. In this chapter,
    you''ll learn some of the basic premises behind the development, licensing, and
    documentation of Linux.


    Although you may not agree with some of the assumptions or analyses in this chapter,
    they are nonetheless some of the more important premises behind the development
    of Linux software and important for you to know.


    # Unix and Open Source Development


    Linux was developed as a clone of Unix. In other words, the developers of Linux
    built their system without using the programming instructions, also known as the
    source code, used to build Unix. Because Linux is a Unix clone, you can use most
    of the same commands and applications on either operating system.


    Although it would have been easier to adapt Unix for the personal computer, there
    are important historical reasons behind the development of Linux. And the way
    Linux was developed drives the way Linux developers, companies, and users work
    today.


    # AT&T and Unix Development


    When Unix was developed in 1969, the American Telephone and Telegraph (AT&T) Company
    was a regulated monopoly in the United States. Although Unix was developed at
    AT&T''s Bell Labs, various court and regulatory rulings kept AT&T out of the computer
    business. So AT&T kept the license for Unix and distributed the operating system
    with source code to universities for a nominal fee. Because AT&T wasn''t making
    money from Unix, its lawyers insisted that the license explicitly state that Unix
    comes with no warranty. This release technique became known as open source.


    The timing was good. Various universities adapted the Unix source code to work
    with three different kinds of computers available at the time: mainframes, minicomputers,
    and microcomputers. One key to this adaptation was the C programming language.


    At about the same time, the U.S. Department of Defense''s Advanced Research Project
    Agency (ARPA) wanted to set up a nationwide communications network that could
    survive a nuclear war. Most universities on this ARPA network used Unix. TCP/IP
    was built on Unix and eventually became the communication protocol for the ARPANET.
    The ARPANET eventually developed into the Internet that you know today. Unix and
    derivative clones, like Linux, are critical tools in the Internet.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The last freely distributed Unix system, popular in the mid-1970s, is known
    as Version 6. All Unix variants and clones, including Linux, Minix, Xinu, Solaris,
    and the Berkeley Standard Distribution (BSD), were cloned or developed from Unix
    Version 6.


    # Not Quite Free Software


    AT&T retained the license to Unix through the 1980s. When the U.S. government
    settled the AT&T antitrust suit in 1982, one of the conditions allowed AT&T to
    go into the computer business. At that point, AT&T was able to sell the Unix operating
    system and source code with all the protections associated with a copyright.


    The programmers who used Unix wanted to keep the advantages of an open source
    operating system. Unix programmers wanted the ability to customize the software.
    As academics, they wanted to share the results. The Unix users of the time had
    the high level of knowledge that made open source software worthwhile.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_42_0.png)


    > Open source software is a double-edged sword. If you want to use open source
    software, you often need to pay the costs associated with maintaining open source
    code. Not everyone has the high level of knowledge required to modify Unix or
    Linux source code. Those with the knowledge can reap great rewards.


    To this end, Douglas Comer developed Xinu in 1983 to illustrate operating system
    structures in a classroom setting. In 1986, Andrew Tannenbaum developed Minix
    as a Unix clone and alternative. Like Linux, Minix does not use Unix''s source
    code, and therefore does not infringe on any of AT&T''s Unix copyrights.


    # The Free Software Foundation


    Richard Stallman started work on the GNU (GNU''s Not Unix) project in 1984. One
    of Stallman''s statements used in his introductory Usenet message might help to
    summarize the thrust of this program: ''I consider that the golden rule requires
    that if I like a program I must share it with other people who like it.'' Stallman''s
    purpose was to set up a group where the free sharing of software would be strongly
    encouraged. Although he wanted GNU to run Unix programs, he also wanted to improve
    on Unix. Before he could do that, however, he needed to create GNU with all of
    the components of a Unix operating system including a kernel.


    Note: Some of the believers in Stallman''s way of thinking shared the software
    of others, with or without their permission. One item that they shared in the
    mid-1970s (without permission) was an operating system crafted by two Harvard
    students named Bill Gates and Paul Allen. As most of you know, these students
    eventually started Microsoft.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'These efforts coalesced around a group known as the Free Software Foundation
    (FSF) (www.fsf.org). They developed the General Public License (GPL) to build
    a body of free software protected from those who would use it to create proprietary
    closed source systems. By 1990, they had cloned most of the major components of
    Unix except the kernel.


    # The Open Source Initiative


    A group closely related to the FSF is the Open Source Initiative (OSI). This group
    was started in 1998 by Eric Raymond to define and defend free software.


    When Netscape released the source code for its core Mozilla system, it set up
    its own license loosely modeled on the GPL. A number of prominent people in the
    open source community were not satisfied with Netscape''s efforts. The OSI was
    created to set criteria to qualify open source software, which includes a license
    that is even less restrictive than the GPL. Unlike software under the GPL, you
    can package OSI software with other proprietary products.


    You can find more information on the OSI at www.opensource.org.


    # The General Public License (GPL)


    Richard Stallman developed the General Public License (GPL) to bring the advantages
    previously available with Unix to the general software community. He wanted to
    develop a license that would protect software from anyone who would hide its source
    code. GNU software is licensed under the GPL. There are three basic principles
    behind the GPL:


    +   - All GPL software must be distributed with a complete copy of the source
    code. The source code must include clear documentation.

    +   - Any software added to GPL software must also be clearly documented. If the
    new software interacts with the GPL software, the package as a whole must be distributed
    as GPL software.

    +   - Any GPL software comes without a warranty.


    Legal interpretations of the actual license are covered under the copyright laws
    and are thus beyond the scope of this book. The following sections describe the
    GPL and the development of Linux in more detail.


    # Copyleft Requirements


    The GPL is sometimes known as copyleft. Although copyrights typically keep others
    from copying and selling a work, copyleft uses the copyright laws to preserve
    the rights of others to use, copy, modify, and distribute software free of charge.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Anyone can sell GPL software. For example, vendors such as LinuxMall (www.linuxmall.com)
    sell most Linux distributions with source code. None of the profits go to packagers
    like Red Hat. If you buy Red Hat Linux from LinuxMall, you can copy the entire
    CD and sell it to others, and you are limited only by the conditions of the GPL.
    If you improve the software, you can resell that too, as long as you include the
    additional source code under the conditions of the GPL.


    # Documentation


    One gray area in the GPL and open source licenses is documentation. Good programs
    include clear documentation embedded in the source code. But clarity in documentation
    is subjective. Should open source documentation on a Java program be clear to
    COBOL programmers? What about network engineers or even the general public?


    Not all documentation associated with GNU or open source software is clear. In
    some cases, Linux programmers have suggested that some companies provide less
    than adequate documentation on purpose to hide the secrets behind their software.


    The GPL and open source licenses don''t require that program authors develop books
    or manuals outside of the source code. Yet some developers do include the manuals
    and books with their GPL or open source software. Some third-party books on Linux
    and Linux applications are also published under the GPL or related licenses.


    # Linux Development


    By 1990, the FSF had put together every fundamental component they needed for
    an operating system except the kernel, which is the code that allows an operating
    system to communicate with computer hardware. Linus Torvalds was not happy with
    the operating systems available at that time for computers with the 386 CPU, so
    he started experimenting with a kernel. By 1995, several companies had assembled
    Linux''s kernel with the GNU software of the FSF to produce the first Linux distributions.


    Richard Stallman and the people behind the FSF believe that the Linux operating
    system is more properly known as GNU/Linux because it combines a large number
    of GNU programs with one Linux kernel.


    Linux and most Linux applications are released under the GPL. Some applications
    are released under even less restrictive licenses, such as that sponsored by the
    OSI. Other Linux applications are protected by more conventional copyrights. The
    battle between these various philosophies on licensing will continue well into
    the future.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# The Open Source Business\n\nUnlike Microsoft, Linux distributors can't rely\
    \ on earnings from the sales of Linux software for most of their revenue. Anyone\
    \ who can download large files can obtain Linux free of charge from any number\
    \ of sites on the Internet. Anyone who can also use a CD-writer can easily resell\
    \ Linux to others.\n\nThe following sections discuss how GNU and open source software\
    \ are developed, how Linux-related companies make money, the paradigm shifts required\
    \ to work without a warranty, and Microsoft's view of this phenomenon.\n\n# The\
    \ Community Development Model\n\nLinux made the cover of Forbes magazine on August\
    \ 10, 1998. The cover story acknowledged the community of developers who thrive\
    \ not on money, but on the status that they get from creating better software.\
    \ As these \"Freeware Children\" from all over the world work together as a community,\
    \ they create a better product.\n\nOne good example of community development is\
    \ what Red Hat did with its beta software. For example, when Red Hat released\
    \ Red Hat Linux 7, it took the following steps in the spirit of community development:\n\
    \n+   1. It created a beta version of the software. With source code and program\
    \ documentation, it licensed Red Hat 7 beta under the GPL and posted it to various\
    \ FTP sites for downloading.\n+   \n+   2. The beta release was announced on various\
    \ newsgroups including the linux.redhat.announce newsgroup. Users were invited\
    \ to try the software and submit comments, bug reports, and bug patches.\n+  \
    \ \n+   3. Once appropriate revisions were made, Red Hat stopped further changes\
    \ and set up final packages for release by download and on CD.\n+   \n+   4. Red\
    \ Hat offered the final version of Red Hat Linux 7 for sale.\n+   \n+   5. Red\
    \ Hat also included detailed documentation, including installation instructions,\
    \ in a book format for sale with its CDs.\n\nRed Hat has just a few hundred employees.\
    \ However, through the community development process, Red Hat receives the help\
    \ of thousands of developers who want Red Hat to succeed.\n\n![](img/7a908c965299f9cdfda2a4ea3cd98bf4_45_0.png)\n\
    \n> Other Linux businesses use this same community development model to help perfect\
    \ their software. The Linux community believes that this results in higher quality\
    \ software."
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Making Money through Free Software


    Even though Linux is free, Linux companies make money from the software they develop.
    Linux developers are among the best paid workers in the software industry.


    The expertise of authors and companies who produce higher quality software is
    valued in the industry. Although they might not make much money from sales of
    the software, they can make money from documentation, support contracts, and the
    consulting services required to make Linux work for individual companies.


    Companies that sell proprietary software compete in part by guarding their secrets.
    Companies that distribute GPL and open source software have no software secrets.
    They cooperate with each other to create the highest quality product. You may
    not agree that these premises are true, but they are key to the Linux business
    model.


    > The Sair Linux/GNU exams assume that you accept the premises of cooperative
    software development.


    # Working without a Warranty


    Some decision makers fear Linux because it does not come with a warranty. Because
    Linux software is developed by the "community," there is nobody to hold responsible
    for problems. Working without a warranty requires a paradigm shift. If you have
    a problem, you can''t badger a Linux distributor to help you because they probably
    did not develop the particular software that caused the problem.


    > The cost of Linux is not in the price of the operating system, but in the cost
    of the support you need for the operating system.


    However, the open source nature of Linux allows you to look at your problems in
    a different way. If you can''t get a Linux application to work, you can rewrite
    the source code. If you find a security problem, someone probably already has
    a patch on the Internet, ready to download. If you can''t get Linux support for
    your hardware, someone may have developed and posted an appropriate Linux driver
    on the Internet. The developers get the credit, and you get the software that
    you need quickly.


    *Note: You may also find patches and drivers on the Internet for proprietary operating
    systems, like Microsoft Windows. However, the availability of these proprietary*'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'downloads depends on cooperation between Microsoft and other software and hardware
    vendors. The availability of Linux patches and drivers depends on need; if enough
    people need it, someone will want to write it. Whether or not this works for you
    depends on your own experience.


    In other words, when you use open source software, you are given the freedom to
    fix any problems that may arise. You don''t have to wait months or years for the
    next release by a proprietary software company to solve your problems. But debugging
    and rewriting code takes a lot of skill. If you need additional help, you can
    always hire Linux developers or support groups to get the job done.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_47_0.png)


    > Linux advocates suggest that the open source model results in higher quality
    software. Because no company controls GNU software like Linux, users are free
    to modify it to meet their own needs. GNU software like Linux thus evolves in
    this free market of ideas, protected by licenses like the GPL.


    # The Microsoft Analysis


    The first of two reported Microsoft memos on GPL and open source software was
    leaked on Halloween eve, 1998. Hence, these documents are referred to as the Halloween
    Documents.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_47_1.png)


    > Responses like the Halloween Documents are sometimes associated with a campaign
    of fear, uncertainty, and doubt, also known as FUD.


    In the Halloween Documents, the authors acknowledge superior quality in GPL software
    based on the open source development model and standard GNU software tools and
    libraries. They also consider the GNU GPL as the most robust software license
    available based on how it promotes development in the longer term. These documents
    focus in part on Linux as a potential threat to Microsoft revenue.


    # The GPL, Open Source, and Free Software


    Many people in the Linux world use the terms GPL, open source, and free software
    interchangeably. Although these concepts are closely related, they are not identical,
    at least according to Stallman and Raymond.


    The GPL doesn''t apply to all Linux software. For example, the XFree86 Project
    develops its Graphical User Interface (GUI) software, the X Window, under a less
    restrictive license more closely associated with Raymond''s OSI. Under their'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'license, you can modify and sell XFree86 software without the limitations associated
    with the GPL as long as you pass on this license in whatever product you create.


    Although GPL software can be used and modified, the authors retain some control
    of the source code. They can require that any changes be made as patches to the
    original source code. Meanwhile, free software can be copied, redesigned, and
    shared with others with or without the source code. The distinctions are subtle
    but significant to many who are emotionally attached to Linux.


    # Internet Resources


    One of the striking facts about Linux is the amount of documentation available
    on the Internet. There are several comprehensive libraries of Linux documentation
    on just about every Linux application. Software and documentation are created
    and updated constantly. There are a number of Linux newsgroups and news sites
    that provide the latest development information. Linux problems of all kinds,
    from all kinds of users, are documented in a number of different newsgroups. This
    effectively provides a database for all but the most obscure problems. You can
    search through this "database" using the tools available at the Deja.com Web site
    (www.deja.com).


    # Linux Libraries


    Among the number of excellent sources of information on Linux, one of the most
    important is the Web site of the Linux Documentation Project (www.linuxdoc.org).
    This Web site includes:


    +   - Guides—Book-length documents on everything from network and system administration
    to the Linux kernel. Although several of these guides are available (for a price)
    at many bookstores, you can download them from this Web site free of charge.

    +   - HOWTOs—Subject-specific documents with detailed installation and trouble-shooting
    instructions for almost all commonly used GNU/Linux programs and applications.

    +   - man pages—Manual pages for each Linux command. If you''re using an older
    version of Linux, you may be able to find a more current manual page.

    +   - FAQs—Also known as frequently asked questions. FAQs are available for some
    Linux programs. The key FAQ is entitled "Linux Frequently Asked Questions with
    Answers."'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Other prominent Linux resources include Web sites of the companies that create
    the major Linux distributions, as well as sites like the Linux Online Web site
    at www.linux.org.


    # Linux News Sites


    As you start to configure and maintain Linux computers, you''ll need to keep up
    with the latest developments. Even if you don''t use the latest Linux releases,
    you should monitor at least one major Linux news site for new security problems
    (and available fixes) that may occur on your system. And with the right news site,
    you may be able to find help with the problem that you''re having or the application
    that you need to improve your business''s productivity. A few important Linux
    news sites include:


    +   - Fresh Meat—The latest Linux releases for every imaginable Linux program
    and application (www.freshmeat.net).

    +   - Linux Today—News releases that cover developments in Linux software, security,
    and business events (www.linuxtoday.com).

    +   - Wide Open News—An e-zine of Linux sponsored by Red Hat (www.wideopen.com).


    # Detailed Linux Searches


    If you have a problem making Linux work for you, chances are good that someone
    has already discussed the problem online. If you can''t find a solution in the
    libraries of the Linux Documentation Project, the next step is to search the newsgroups.
    The easiest way to search multiple newsgroups is by searching the discussions
    list at the Deja.com Web site noted earlier. This site automatically indexes every
    relatively recent message in Usenet and many other newsgroups. View an example
    of a search for installing Apache (the Linux Web Server) on Caldera Linux in Figure
    2.1.


    # Command Resources


    Another set of resources is available when you boot Linux on your computer. At
    the command line, you can get help for almost any Linux command, read through
    manual pages for most commands, or search through information pages for a number
    of applications. Graphical versions of the man and info commands are also available.


    # help


    When you want more information about a Linux command, go to help first. When you
    use the help switch for a Linux command, more information about'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_50_0.png)


    Figure 2.1 Deja.com search results for installing Apache on Caldera Linux.


    the options available for that command is displayed. For example, if you want
    more information on the mkdir command, open a command line interface and type
    the following:


    ```

    mkdir --help

    ```


    You can see an example of the result in Figure 2.2.


    In some Linux distributions, you can substitute -h or -? for --help.


    # man


    Just about every Linux command comes with a manual, also known as a man page.
    Each Linux manual includes a complete description of the command as well as a


    ```

    [aj@linux...] $ mkdir --help

    Usage: mkdir [OPTION] DIRECTORY...

    Create the DIRECTORY(ies), if they do not already exist.

    -m, --mode=MODE set permission mode (as in chmod), not rwxrwxrwx - umask

    -p, --parents no error if existing, make parent directories as needed

    -v, --verbose print a message for each created directory

    --help display this help and exit

    --version output version information and exit

    Report bugs to <bug-fileutils@gnu.org>.

    [aj@linux...] $

    ```


    Figure 2.2 Getting command help.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'description of the function of each available command switch. For example,
    if you want to see the manual for the ls command, open a command line interface
    and type the following:


    ```

    man ls

    ```


    If you want to review commands related to a specific topic, you can search through
    the available manuals. For example, if you want to view the Linux commands that
    are used for Ethernet, type:


    ```

    man -k ethernet

    ```


    The output for this particular command is something like the following:


    ```

    arpsnmp (8) - keep track of ethernet/ip address pairings

    ethers (5) - Ethernet address to ip number database

    pcnet_cs (4) - Generic NS8390-based PCMCIA Ethernet driver

    ```


    Your output varies with your Linux distribution and the modules you have installed.
    The previous aren''t the only commands you can use to configure an Ethernet network.
    But they are the commands with the word ethernet in their headers.


    Another way to search for man page headers is with the apropos command, which
    is equivalent to man -k.


    Note: If you''re running some versions of Red Hat Linux, the man -k, apropos,
    and whatis commands don''t work as shown. But they do work in most Linux distributions,
    including Debian, Corel, and Caldera, and are consistent with the manual pages
    available even in Red Hat Linux.


    The number shown in parentheses corresponds to the Linux category for that command.
    There are nine different categories of Linux man pages, which are described in
    Table 2.1.


    One of the special features of the File Formats category (5) is how it documents
    each field in critical control files. For example, if you want to know the function
    of each field in the encrypted password file /etc/shadow, type the following command:


    ```

    man 5 shadow

    ```


    If you want to list the title of a specific manual page, use the whatis command.
    For example, the following command returns the title of the apropos man page:


    ```

    whatis apropos

    ```'
  merge: -1
