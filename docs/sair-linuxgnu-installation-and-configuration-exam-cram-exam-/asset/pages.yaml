- pgno: 220
  md: '# Practice Questions


    # Question 1


    Which of the following methods can you use to start the X Window? [Check all correct
    answers]


    +   - a. Set the initdefault variable in /etc/inittab to the level with the xdm.

    +   - b. Start a command-line interface and type the xdm command.

    +   - c. Start a command-line interface and type the XF86Setup command.

    +   - d. Start a command-line interface and type the startx command.


    Answers a, b, c, and d are correct. The initdefault variable determines the run
    level started by Linux after it runs through other startup routines. Although
    the xdm command doesn''t start a window manager, it does start an X Window login
    screen. Although the XF86Setup command doesn''t start a "normal" GUI, it does
    start an X Window (XF86_VGA16). The startx command starts the X Window, assuming
    you''ve already configured it for your system.


    # Question 2


    When Johnny uses the startx command to start the X Window, the X Server needs
    initialization files. Assume initialization files are available in all of the
    following directories. Which directory''s initialization files does startx use
    to set up Johnny''s X Window?


    +   - a. /etc/X11/xinit/

    +   - b. ~

    +   - c. /home/johnny/.init

    +   - d. /etc/


    Answer b is correct. The initialization files in any user''s home directory, as
    signified by the tilde (~), take precedence. The systemwide initialization files
    are located in the /etc/X11/xinit directory. Because these files find initialization
    files in Johnny''s home directory, answer a is incorrect. As of this writing,
    no Linux distribution keeps initialization files in the /home/johnny/.init directory;
    therefore, answer c is incorrect. Although there are a lot of initialization files
    in the /etc/ directory, none are related to starting the X Window; therefore,
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Question 3


    You''re configuring the X Window in a Red Hat Linux system. Which of the following
    utilities can you use? [Check all correct answers]


    a. Xconfigurator

    b. xf86setup

    c. XF86Config

    d. XF86Setup


    Answers a and d are correct. The Xconfigurator is used with the Red Hat Linux
    distribution. The XFree86 project''s XF86Setup utility is generally included in
    all Linux distributions. Because the case of the xf86setup command is not correct
    (should be XF86Setup), this command would not work. Therefore, answer b is incorrect.
    Although there is an xf86config utility that configures the X Window, you can''t
    start it with the XF86Config command. Therefore, answer c is incorrect.


    # Question 4


    Window managers are applications. Assume you have a program that has run out of
    control. You can''t move your mouse, but you can type a command-line command in
    an xterm window. You''re running in superuser mode. Which of the following commands
    can you use to stop your window manager without stopping or restarting Linux?


    a. Ctrl+Alt+Del

    b. reboot

    c. Ctrl+Alt+Backspace

    d. Ctrl+Alt+Num+


    Answer c is correct. The Ctrl+Alt+Backspace keys, when pressed together, force
    Linux to exit your window manager. Because the Ctrl+Alt+Del and reboot commands
    stop and restart Linux, answers a and b are incorrect. Although the Ctrl+Alt+Num+
    command does switch video modes, it does not exit your window manager. Therefore,
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Question 5


    Which of the following configuration utilities can help you set up your keyboard
    and mouse as well as your video hardware?


    +   - a. SuperProbe

    +   - b. XF86Config

    +   - c. XF86Setup

    +   - d. Xconfigurator


    Answer c is correct. The XF86Setup utility includes sections that help you configure
    mice or pointing devices and keyboards. And it helps you configure your monitor
    and video controller. Because the SuperProbe utility just probes for your current
    video hardware, answer a is incorrect. XF86Config is not a valid configuration
    utility (it''s xf86config); therefore, answer b is incorrect. Because the Xconfigurator
    only allows you to configure your monitor and video controller, answer d is incorrect.


    # Question 6


    Why can you shut down a window manager, such as KDE or GNOME, without rebooting
    Linux?


    +   - a. A window manager is just another application.

    +   - b. Window managers are set up to respond to the Ctrl+Alt+Backspace command
    by shutting down.

    +   - c. When you shut down a complete window manager like KDE or GNOME, you have
    no choice. You have to halt or reboot Linux.

    +   - d. Window managers include special commands in their menus that allow you
    to log off.


    Answer a is correct. Because window managers are applications, they do not directly
    affect the kernel. When they lock up, you can shut them down without rebooting
    Linux. Although you can use the Ctrl+Alt+Backspace keys to shut down window managers,
    that option does not explain why you don''t have to reboot Linux. Therefore, answer
    b is incorrect. Because you can shut down KDE or GNOME with the Ctrl+Alt+Backspace
    keys without rebooting, answer c is incorrect. Although window managers do include
    special commands that allow you to log off, in KDE and GNOME, you still end up
    in their login screens. And'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'that option does not explain why you don''t have to reboot Linux. Therefore,
    answer d is incorrect.


    # Question 7


    You''ve set up Linux to start the X Window automatically. Which of the following
    is a correct sequence of events when Linux starts the GUI?


    +   - a. Linux starts the X Server, and then continues with the GNOME display
    manager. When you log in, Linux starts the Blackbox window manager.

    +   - b. Linux starts the xdm display manager. When you log in, Linux starts the
    X Server, and then continues with the KDE window manager.

    +   - c. Linux starts the X Server, and then continues on with the xdm window
    manager. When you log in, Linux starts the Enlightenment display manager.

    +   - d. Linux starts the GNOME display manager. When you log in, Linux starts
    the X Server, and then continues with the GNOME window manager.


    Answer a is correct. Linux has to start the X Server before you see anything graphical
    on your screen. You then see a display manager for logins. When you log in, you
    continue on to a window manager. The GNOME display manager can start other window
    managers. Because you need an X Server before you see a display manager, answers
    b and d are incorrect. Because xdm is a display manager, not a window manager,
