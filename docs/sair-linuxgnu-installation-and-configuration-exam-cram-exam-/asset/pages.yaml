  merge: -1
  img_proc: true
- pgno: 279
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_279_0.png)


    For more information on Star Office, look over its Web site at www.staroffice.com.
    You can also download a personal copy of Star Office from this Web site. News
    releases related to this suite are available through its parent company''s Web
    site at www.sun.com.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_279_1.png)


    For more information on the Applixware Office suite, look over its Web site at
    www.vistasource.com. You can also download a demonstration copy of Applixware
    from this Web site.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_279_2.png)


    For more information on xfig, review its home page at www.xfig.org. You can find
