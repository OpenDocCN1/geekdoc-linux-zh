    \ When our UPS tells us power has failed, assume we have a few minutes\n# of power\
    \ left. Schedule a shutdown for 2 minutes from now.\n# This does, of course, assume\
    \ you have power installed and your\n# UPS is connected and working correctly.\n\
    \ pf:powerfail:/sbin/shutdown -f -h +2 \"Power Failure; System Shutting Down\"\
    \n# If power was restored before the shutdown kicked in, cancel it.\npr:12345:powerwait:/sbin/shutdown\
    \ -c \"Power Restored; Shutdown Cancelled\"\n# Run gettys in standard runlevels\n\
    1:2345:respawn:/sbin/mingetty tty1\n2:2345:respawn:/sbin/mingetty tty2\n3:2345:respawn:/sbin/mingetty\
    \ tty3\n4:2345:respawn:/sbin/mingetty tty4\n5:2345:respawn:/sbin/mingetty tty5\n\
    6:2345:respawn:/sbin/mingetty tty6\n# Run xdm in runlevel 5\n# xdm is now a separate\
    \ service\n# 5:respawn:/etc/X11/prefdm -nodaemon\n```\n\n# Figure 3.2 Consoles\
    \ configured in the /etc/inittab file.\n\n![](img/7a908c965299f9cdfda2a4ea3cd98bf4_66_0.png)\n\
    \nGettys are also known as consoles or login ports. The tty7 console is available\
    \ only if you've configured the X Window on your Linux system. If you're already\
    \ in a command-line window, you don't need to press the Ctrl key to switch consoles.\n\
    \nThere are several advantages to multiple consoles. You can log in to multiple\
