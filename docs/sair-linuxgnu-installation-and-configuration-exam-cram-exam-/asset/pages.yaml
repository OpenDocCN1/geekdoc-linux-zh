  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_302_0.png)


    # Sample Test


    This chapter provides pointers to help you develop a successful test-taking strategy.
    These helpful tips include how to choose proper answers, how to decode ambiguity,
    how to work within the Sair Linux/GNU testing framework, how to decide what you
    need to memorize, and how to prepare for the test. At the end of the chapter,
    I include 50 questions on subject matter pertinent to the Sair Linux/GNU Installation
    and Configuration Level 1 certification exam 3X0-101. In Chapter 16, you''ll find
    the answer key to this test. Good luck!'
