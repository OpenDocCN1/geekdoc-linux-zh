- pgno: 229
  md: 'A system administrator installs, configures, and maintains operating systems,
    sets up users, manages software, and secures networks. In other words, a system
    administrator needs to know each topic covered on all four Sair Linux/GNU Certified
    Administrator exams.


    At its core, a system administrator''s job is to set up users, maintain software,
    install hardware, monitor running programs, maintain networks, and create backups.
    This chapter covers basic user setup utilities, hardware installation commands,
    program management utilities, and backup routines. Although these topics are covered
    in much more detail on the System Administration exam, they are also subjects
    you need to know when you configure a Linux computer. When you install and configure
    Linux, you need to be able to perform some basic system administration tasks,
    including those described in this chapter.


    # User Accounts


    Everyone who logs on to a Linux system needs a user account. Every user account
    has some rights and privileges that may differ by directory. Users have usernames,
    passwords, and home directories. Users are configured through an /etc/passwd file.
    You can create new users by editing that file in a text editor. You can also create
    new users with three different command-line commands. And several distributions
    allow you to create new users through their graphical configuration utilities.


    The examples shown in the following sections are based on setting up a new user
    with the username tr. When you set up users for yourself, substitute appropriately.


    # The Password File


    Every user gets a line in your /etc/passwd file. When you open it, you''ll see
    lines such as the following:


    ```

    mj:b7RHH:503:100:Michael Jang:/home/mj:/bin/bash

    ```


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_229_0.png)


    > All Linux utilities that create new users perform three basic functions: First,
    they add a new line to the /etc/passwd file for the user. Second, they create
    a home directory, assigning ownership to that user. Third, they copy shell startup
    configuration files, usually from the /etc/skel directory, to the user''s new
    home directory.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '**Table 11.1 Setup of the /etc/passwd file.***


    | Column | Example | Function |

    |---|---|---|

    | 1 | mj | Username |

    | 2 | b7RHH | Password (see table note) |

    | 3 | 503 | User ID (every username is associated with a unique user ID) |

    | 4 | 100 | Group number (100 usually corresponds to the group named users) |

    | 5 | Michael Jang | Information about the user |

    | 6 | /home/mj | User''s home directory |

    | 7 | /bin/bash | User''s login shell |


    *If you see an x or an asterisk (*) in the second column of your /etc/passwd file,
    user passwords are encrypted.


    The commands discussed in the following section generally require root or superuser
    privileges to run. To go into superuser mode, type the su command. Enter the root
    password when prompted.


    # Direct User Setup


    You can create a user account directly. Open the /etc/passwd file in a text editor,
    such as emacs or vi. Follow these steps to set up a user account:


    +   1. Start a new line. Copy the applicable information from another user''s
    /etc/passwd entry (such as the code line shown earlier).

    +   2. Change the username, user ID, and home directory. For example, if you''re
    setting up a new account for Theodore Roosevelt, you might insert "tr" in the
    first column (username), the number "504" in the third column (user ID), "Theodore
    Roosevelt" in the fifth column (information about the user), and "/home/tr" in
    the sixth column (user''s home directory). Make sure that the information you
    enter is unique relative to other entries in your /etc/passwd file. Unless you
    want to assign tr to a different group, you don''t have to change the group number.

    +   3. Save the /etc/passwd file. (You can save the file only if you''re logged
    in as the root or superuser.)

    +   4. Set up your new user''s home directory. The `mkdir -p /home/tr` command,
    discussed in Chapter 8, should work for the superuser from any command-line interface.

    +   5. Make sure your new user can access his home directory. Give him ownership
    with the `chown tr/home/tr` and `chgrp 100/home/tr` commands. If the username
    or group number is different, substitute appropriately.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '6. Assign a new password with the `passwd tr` command. Once complete, user
    tr can assign a new password to himself with the same command.


    7. Copy basic initialization files, which are normally stored in the `/etc/skel`
    directory. These are the files, such as `.bashrc` and `.bash_profile`, covered
    in Chapter 6. Change your identity to the new user with the `su - tr` command.
    Copy these files with the `cp /etc/skel/.* /home/tr` command.


    8. Log out, and tell your new user about his new username and password.


    > Note: The steps are slightly different if you have encrypted passwords in a
    `/etc/shadow` file. Details of this process are not covered on this Sair Installation
    and Configuration exam.


    # adduser


    When you''re working with a large number of users, you need a method that can
    help you add users quickly. One way of automating the user creation process is
    to use the adduser command. To use the adduser command to set up tr''s account,
    type the following:


    ```

    adduser tr

    ```


    Depending on your distribution, this command may prompt you for other settings,
    such as group and password. Alternately, it may take settings from the control
    file `/etc/adduser.conf`. In some distributions, the adduser command works just
    like the useradd command.


    # useradd


    You can also use the useradd command to create a new user. To use the useradd
    command to set up tr''s account, type the following:


    ```

    useradd tr

    ```


    # userdel


    The userdel command is also straightforward. If you have a user named Theodore
    Roosevelt who just left your company, you''ll want to deactivate his account.
    Once you''ve retrieved any files you need from his home directory, run the following
    command:


    ```

    userdel -r tr

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'This command deletes tr''s information from the /etc/passwd file. The -r switch
    deletes the /home/tr directory including any files and directories that it may
    contain.


    # newusers


    The newusers command is designed to handle a large number of users from a batch
    file of usernames and passwords, as described on the newusers man page. If you
    create a list of users and passwords in a file named new-batch, you can then set
    up these users with the following command:


    ```

    newusers new-batch

    ```


    If you save this batch file, make sure it''s secure. You might want to hide it,
    encrypt it, or delete it. A list of usernames and passwords is a very tempting
    tool for anyone who wants to crack your system.


    # Linuxconf


    Red Hat Linux''s graphical user interface (GUI) configuration utility is known
    as Linuxconf. Because it''s licensed under the General Public License (GPL), other
    Linux companies are free to incorporate it into their distributions. It''s an
    "all-in-one" utility that allows you to configure everything from networking to
    user accounts. To start Linuxconf from the X Window, open up a command-line shell,
    go into root or superuser mode, and type the linuxconf command. You can set up
    a new user account in Linuxconf as shown in Figure 11.1.


    The input shown in Figure 11.1 sets up the user tr with the noted group, home
    directory, shell (command interpreter), and user ID. As always, be sure to use
    unique usernames, user ID numbers, and home directories.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_232_0.png)


    Figure 11.1 Setting up a new user account with Linuxconf.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Note: Figure 11.1 shows the Linuxconf interface in the X Window. The Linuxconf
    screen that you get from a command line virtual terminal is somewhat different.


    # COAS


    Caldera has several GUI user creation utilities including LISA, COAS, and Webmin.
    Each of these utilities allows a system administrator to configure everything
    from networking to user accounts. You can set up a new user account in COAS as
    shown in Figure 11.2.


    The input shown in Figure 11.2 sets up the user tr with the noted user ID, group,
    shell (command interpreter), and home directory. As always, be sure to use unique
    usernames, user ID numbers, and home directories.


    # YaST


    S.u.S.E. Linux has its own proprietary all-in-one configuration package known
    as YaST (Yet another Setup Tool). Like Linuxconf, you can open it in a command-line
    interface or in the GUI. Once open, navigate to the System Administration menu,
    and then navigate to User Administration for the menu shown in Figure 11.3.


    The input shown in Figure 11.3 sets up the user tr with the noted user ID, group,
    home directory, and shell (command interpreter). As always, be sure to use unique
    usernames, user ID numbers, and home directories.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_233_0.png)


    Figure 11.2 Setting up a new user account with COAS.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_234_0.png)


    Figure 11.3 Setting up a new user account with YaST.


    # System Administration Commands


    As you start using Linux, you''ll want to make sure all parts of the system are
    running smoothly. There are commands that you can use to monitor currently logged
    on users, as well as the processes they are running.


    If any of your users have a problem with any application, you can use the kill
    command to kill that application. If an important program or procedure is about
    to run, commands such as nice and renice can help you raise or lower the priority
    associated with the program of your choice.


    # who and w


    Although the who and w commands both tell you which accounts are currently logged
    on to the Linux system, the w command actually goes into more detail. As an administrator,
    you should check logons regularly; for example, the following output from who
    shows the same person logged on from two different locations:


    ```

    mj tty1 Sep 22 10:24

    tr tty1 Sep 21 21:28 (linux2.mommabears.com)

    mj tty0 Sep 21 21:18 (cracker.notnice.cba)

    ```


    Because user mj is logged on from the local computer and remotely from the cracker
    computer, you should be concerned that someone else is using mj''s username and
    password to break into your system.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_235_0.png)


    Network logins to your Linux computer come into terminals such as tty0 or tty1.
    Logins on the local computer don''t include the p.


    The w command also tells you about the demand for computer resources. For example,
    the following output from w shows a system with three users that has been up for
    nearly a full day:


    ```

    10:27am up 23:38, 3 users, load average: 0.15, 0.03, 0.01

    USER TTY FROM LOGIN@ IDLE JCPU PCPU WHAT

    mj tty1 10:24am 3:02 0.10s 0.10s -bash

    tr tty1 1inux2.mo. Thu 9pm 12:59m 0.11s 0.11s -bash

    mj tty0 cracker.cb Thu 9pm 12:59m 0.12s 0.12s find passwd

    ```


    More importantly, it shows the process currently being run by user mj from the
    remote location. Because that user is running the find command to look for password
    files, you have even more reason for concern.


    # ps


    The ps command shows currently running processes or programs. When you type the
    ps command by itself, you see the processes associated with your setup. If you
    type the ps aux command, you can see everything running on your Linux system including
    daemons. Another useful variation is ps l, which returns a "long list" associated
    with each currently running process. Important categories from this command include:


    +   - **PID**—The process identifier. Every process is associated with a number
    known as a process identifier.

    +   - **PPID**—The parent process identifier. Every process has a parent except
    init. If you can''t kill a process, you might be able to kill the parent process.

    +   - **PRI**—The priority value. Higher priority programs get attention from
    your CPU more quickly. The highest priority program has a PRI of -20. The lowest
    priority program has a PRI of 19.

    +   - **STAT**—The current status of the process. There are three options: Running
    (R), Sleeping (S), or Swapped (SW) to the swap partition.


    As discussed in the following sections, if you have a program that''s running
    out of control, you need the PID number to kill the problem program. Alternately,
    if you need to run a program that''s stuck waiting for CPU resources, you can
    use its PID to raise its priority.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'You can also use the top command to see the processes that are overloading
    your system. The top command lists the processes that are most heavily loading
    your CPU and RAM memory. But it only lists as many processes as it can show on
    your screen.


    # kill


    By reputation, Linux doesn''t crash. There are reports of users and Web sites
    powered by Linux running without reboots for months at a time. One reason behind
    this is that system administrators can manage troublesome programs with the kill
    command.


    For example, if a program like Netscape locks up on you while you''re browsing
    the Internet, follow these steps to kill the program:


    +   1. Open a command-line shell. If you can''t open a command-line shell inside
    an X Window, start a new virtual console with the Ctrl+Alt+Fx command, where x
    is a number between 1 and 6.

    +   2. Run the ps aux | grep netscape command. The number after your username
    is the PID of the process that is currently running Netscape on your computer.
    Record that number. For purposes of this exercise, assume the number is 1711.

    +   3. Run the kill 1711 command. If your PID is different, substitute accordingly.
    If the kill command doesn''t work, run the ps aux | grep netscape command to find
    the PPID. You may need to kill the parent process first.


    # nice and renice


    The nice and renice commands let you run programs at different relative priorities.
    The priority of any program can range from -20 (highest) to 19 (lowest). The nice
    program starts another process with an adjusted priority. For example, you could
    set Netscape to start after all others is finished with the nice -n 20 netscape
    command. If you need to focus Linux on one specific program, you need its PID.
    Once you find the program''s PID (assume it''s 1711 for this exercise), you can
    raise its priority with the renice -10 1711 command.


    *Note: To understand priorities, keep in mind that everything seems reversed in
    Linux. If you want to make a program more important, use a negative number.*


    # Kernel Module Management


    The Linux kernel translates commands between your applications and your computer
    hardware. Each piece of hardware, such as a hard disk, modem, CPU, or video controller,
    has a device driver. In some cases, drivers are integrated'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'within the kernel. In other cases, modules are added to the kernel at runtime
    or when you start Linux on your computer. In either case, the kernel communicates
    directly with your hardware.


    There are three basic commands used to manage Linux kernel modules: lsmod, insmod,
    and rmmod.


    # lsmod


    To see the loaded modules that are currently running on your system, run the /sbin/lsmod
    command. Take a look at the following sample output from this command:


    | Module | Size | Used by |

    |---|---|---|

    | sound | 56616 | 0 (autoclean) (unused) |

    | soundcore | 2412 | 3 (autoclean) [sound] |

    | soundlow | 252 | 0 (autoclean) [sound] |

    | 3c589_cs | 8312 | 1 |

    | ds | 6820 | 2 [3c589_cs serial_cs] |

    | 182365 | 30260 | 2 |

    | pcmcia_core | 45988 | 0 [3c589_cs serial_cs ds 182365] |

    | nls_iso8859-1 | 2024 | 1 (autoclean) |

    | nls_cp437 | 3548 | 1 (autoclean) |


    Each loaded module is associated with a device driver. The amount of memory used
    is listed in bytes. The Used By column shows the number of programs currently
    using that driver. The modules loaded when you start Linux are taken from the
    /etc/conf.modules file.


    # insmod


    When you install new hardware, Linux may not detect it. When you install a new
    kernel, you may need to install new drivers. Linux drivers are associated with
    a specific kernel. If the version number is x.y.z, you can find the drivers in
    the /lib/modules/x.y.z directory. Some hardware comes with its own Linux modules,
    which can be downloaded from the Internet or loaded from a floppy disk. For example,
    if you just installed a Linksys Etherfast PCMCIA card in your computer, run the
    following command to load the driver:


    ```

    insmod /lib/modules/2.4.8/pcmcia/wavelan_cs.o

    ```


    Linux drivers are generally stored in files with an .o extension. If your driver
    is in a different directory, substitute appropriately.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Once you''ve confirmed that your driver works, add it to your /etc/conf.modules
    file. Then you won''t have to use the insmod command to install this driver every
    time you start Linux.


    # rmmod


    You can and should remove unneeded modules, because they take up memory that can
    be used by your programs. For example, if you''re no longer using the wavelan_cs.o
    module, the following command removes the driver module:


    ```

    rmmod wavelan_cs

    ```


    Note that wavelan_cs is the module name as you would see it in the output from
    the lsmod command.


    # Permissions and Ownership


    What you can do to control and manipulate Linux files depends on the permissions,
    owners, and groups associated with that file. You set up permissions with commands
    like mkdir and chmod in Chapters 7 and 8. But permissions don''t do you much good
    if files and directories are associated with the wrong owners or groups. You can
    change the owner and group associated with a file or a directory with the chown
    (change ownership) and chgrp (change group) commands.


    As you read through the following sections, look at these commands in the context
    of the following output from the ls -l command:


    ```

    drwxr-x--- 1 tr users 7326 Jan 12 09:09 /home/tr

    ```


    # chown


    Earlier, you assigned ownership of a directory to a new user with the chown tr
    /home/tr command. Based on the preceding example, only the owner of a file has
    read, write, and execute (rwx) permissions on that file, which in this case is
    a directory.


    # chgrp


    Earlier, you assigned a directory to a group with the chgrp 100 /home/tr command.
    This command assigned the /home/tr directory to the group named users. Every user
    who is part of the users group has read and execute (rx) permissions on the /home/tr
    directory.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Practice Questions


    # Question 1


    Based on the output from the who command, how can you tell if someone is logged
    in to Linux through a network connection?


    +   - a. You see something like linux4.mommabears.com at the end of the user''s
    entry.

    +   - b. You see a terminal like tty9 associated with a user.

    +   - c. You see a terminal like tty3 associated with a user.

    +   - d. You see a username listed a second time in the output.


    Answer c is correct. A terminal name with a p is associated with a network logon
    to Linux. Because answer a does not specify terminal names, you can''t tell whether
    linux4.mommabears.com is the local computer. Therefore, answer a is incorrect.
    Although tty9 is a higher terminal number than you might normally see on a Linux
    computer, it is still a local logon. Therefore, answer b is incorrect. Because
    you can log on locally with virtual terminals more than once, a second instance
    of a username does not mean that user has also logged on remotely. Therefore,
    answer d is incorrect.


    # Question 2


    Which of the following commands tells you the drivers that are currently loaded
    with your Linux kernel?


    +   - a. insmod

    +   - b. lsmod

    +   - c. rmmod

    +   - d. cat /etc/conf.modules


    Answer b is correct. The lsmod command lists currently loaded drivers. The insmod
    command installs but does not list drivers; therefore, answer a is incorrect.
    Because the rmmod command removes but does not list drivers, answer c is incorrect.
    Although the /etc/conf.modules file lists the drivers loaded into Linux at runtime
    (when you start), it does not include any drivers that you might have added with
    the insmod command. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Question 3


    You''ve set up a Linux computer with two different network cards. When you check
    status with the lsmod command, you only see the driver for one of the cards, which
    is assigned to the eth0 driver. Which command gets your Fast Ethernet card D-Link
    DFE-650 driver installed? The DFE-650 card works with the pcnet_cs driver. The
    driver can be found in the /lib/modules/2.4.6/net directory.


    +   - a. insmod /lib/modules/2.4.6/net/pcnet_cs

    +   - b. insmod pcnet_cs.o

    +   - c. insmod dfe_650 pcnet_cs.o

    +   - d. insmod /lib/modules/2.4.6/net/pcnet_cs.o


    Answer d is correct. Linux drivers have a .o extension. Answer a does not include
    a .o extension; therefore, answer a is incorrect. Unless the driver directory
    is part of your $PATH variable, you need to call out the full directory location
    for the driver. Because answer b does not include the full path to the pcnet_cs.o
    driver, answer b is incorrect. Because the driver is not named dfe_650, answer
    c is incorrect.


    # Question 4


    Which of the following commands can you use to find the number of processes or
    programs currently running on your Linux system? This applies to all processes,
    not just those started by any one user.


    +   - a. ps l

    +   - b. w

    +   - c. ps aux

    +   - d. top


    Answer c is correct. The ps aux command lists all currently running processes
    including daemons and processes started by other users. Although the ps l command
    lists PID numbers, it does not list all processes started by all users. Therefore,
    answer a is incorrect. The w command lists current users and logon terminals,
    which are not closely related to the number of currently running processes. Therefore,
    answer b is incorrect. The top command is more suited to finding the program that''s
    putting the most load on the system. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Question 5


    Which of the following commands lists all currently logged on users and their
    command-line interface shells?


    +   - a. w

    +   - b. who

    +   - c. top

    +   - d. w | grep bash


    Answer a is correct. The w command lists currently logged on users and their shells.
    The who command doesn''t include users'' shells; therefore, answer b is incorrect.
    The top command may not show processes from all users; therefore, answer c is
    incorrect. Because answer d would only show those users who use the bash shell,
    answer d is incorrect.


    # Question 6


    Others in your group (users) aren''t able to access files in your home directory.
    Your username is tr. You''ve assigned read, write, and execute permissions to
    the group. Based on the following output from the ls -l /home/tr command, which
    of the following commands solves your problem? Note: You don''t want to give permissions
    to your home directory to everyone.


    ```

    drwxrwx--- 2 tr tr 1024 Dec 16 20:45 tr

    ```


    +   - a. chown users /home/tr

    +   - b. chgrp users /home/tr

    +   - c. chmod 777 /home/tr

    +   - d. chgrp /home/tr users


    Answer b is correct. You need to change the group associated with the /home/tr
    directory to users. Answer a uses the chown command, which is for usernames. But
    users is a Linux group. Even if you could use users as a username, the chown users
    /home/tr command still wouldn''t address the group problem. Therefore, answer
    a is incorrect. Although chmod 777 /home/tr would allow others in your group to
    access your directory, it would allow everyone with a username on your system
    permissions to access your directory. Therefore, answer c is incorrect. Because
    answer d has the directory and group in the wrong order, answer d is also incorrect.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Question 7


    There are a variety of tools available to set up a new user. Yet, they essentially
    perform the same functions on your Linux system. Which of the following operations
    is not done when you set up a new user? Assume the new username is tr.


    +   - a. Copy files like .bash_profile from the /etc/skel directory

    +   - b. Add the username and home directory to the /etc/passwd file

    +   - c. Set up the user''s shell profile in /home/tr/.bash_profile

    +   - d. Assign ownership of the /home/tr directory to tr

    +   - e. Assign tr to a specific group and set up the /home/tr directory for that
    group


    Answer c is correct. When you set up a new user, you don''t need to edit the .bash_profile
    file. Because files like .bash_profile are copied from /etc/skel to the user''s
    home directory, answer a is incorrect. All usernames and their home directories
    must be a part of the /etc/passwd file; therefore, answer b is incorrect. The
    user tr needs to own his/her own home directory to use it; therefore, answer d
    is incorrect. Because you want the user tr and his/her home directory to be a
    part of the same group, answer e is incorrect.


    # Question 8


    One of your users calls you and says that his system is locked up in GIMP, an
    image editing program. Which of the following commands will help you find the
    process identifier for GIMP? Assume that user is the only one currently using
    GIMP on your system.


    +   - a. ps aux | grep gimp

    +   - b. ps | gimp

    +   - c. ps | grep gimp

    +   - d. top


    Answer a is correct. This command lists all currently running processes and sends
    the output to the grep command, which looks for the text string gimp. Because
    the ps command alone just lists your own currently running processes, answers
    b and c are incorrect. Although the top command would work if GIMP is using all
    the CPU or memory resources on your system, that may not be the problem. Therefore,
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Question 9


    Which of the following commands is suited to setting up a large number of users
    and passwords from a batch file?


    +   - a. linuxconf

    +   - b. newusers

    +   - c. useradd

    +   - d. userbatch


    Answer b is correct. The newusers command is set up to create users from a batch
    file of usernames and passwords. Because linuxconf only allows you to create users
    one at a time, answer a is incorrect. Although you can set up useradd in a script
    to take usernames from a batch file, you still need to assign passwords. Therefore,
    answer c is incorrect. There is no userbatch command; therefore, answer d is incorrect.


    # Question 10


    Netscape seems to have locked up your system. You can''t close it in your X Window.
    You''ve logged in to a different virtual console and have run the top command.
    You know that the PID for Netscape is 1436. How do you stop Netscape?


    +   - a. stop 1436

    +   - b. kill 1436

    +   - c. kill netscape

    +   - d. stop netscape


    Answer b is correct. This command kills the process with PID 1436, which you''ve
    identified as the process for Netscape. There is no stop command; therefore, answers
    a and d are incorrect. Because the kill command only recognizes PIDs, answer c
    is incorrect.'
  merge: -1
  img_proc: true
