    +   - d. The init.d resource control scripts are all divided by run levels as
    defined in the /etc/inittab file. They link to scripts in the rc.d directory.
    You can run the rc.d scripts independently after Linux boots on your computer.


    Answer a is correct. What Linux executes at different run levels is defined in
    the various numbered resource control directories under the rc.d directory. They
    link'
