- pgno: 155
  md: '# Quotes in the Shell


    There are three types of quote characters on your keyboard: the single quote (''),
    the double quote (") , and the back quote (`). When applied to standard input
    (stdin), they perform different functions.


    *Note: You can find the back quote key above the Tab key on a standard U.S. keyboard.*


    The difference between these characters is in how they affect variables, such
    as $NAME, and shell commands, such as date. With any pair of quotes, the shell
    sends everything inside the quotes to the command. In the following example, the
    command echo is used. In detail, the difference is as follows:


    +   - Single quotes—The shell does not process any variables or commands within
    the quotes.

    +   - Double quotes—The shell processes variables, such as $NAME, but does not
    process any commands within the quotes.

    +   - Back quotes—The shell tries to process every word in quotes as a command.
    If there are variables, they are evaluated first, and then processed as a command.
    Thus, if $NAME were in back quotes, it would be processed, and then the result
    (Michael) would be evaluated as a command.


    You can see how this works in the following examples. Assume $NAME=Michael. Remember,
    date is a command that returns the current date and time:


    ```

    echo Welcome $NAME, the date is date

    echo ''Welcome $NAME, the date is date''

    echo "Welcome $NAME, the date is date"

    echo "Welcome $NAME, the date is `date`"

    ```


    The first command has no quotes. The second command is surrounded by single quotes.
    The third command is surrounded by double quotes. The final command has double
    quotes as well as back quotes around the command date. These commands return the
    following results:


    ```

    Welcome Michael, the date is date

    Welcome $NAME, the date is date

    Welcome Michael, the date is date

    Welcome Michael, the date is Sat Sep 9 11:16:33 PDT 2000

    ```


    Without quotes, the shell interprets the $NAME variable, but does not run the
    date command. With single quotes, the shell doesn''t interpret variables or commands.
    With double quotes, the result is similar to the result without quotes. If a command
    is in back quotes, the shell interprets the command.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '> You can take advantage of back quotes. For example, if you want to run a
    program on several data files that happen to end in .dat, you can run a command
    like ./majorprogram `cat *.dat`.


    # Backslashes


    A backslash (\\) tells the shell to ignore spaces (or other special characters).
    You can use it to manage a directory like the My Documents directory on a Microsoft
    Windows partition. For example, if you mounted your Windows C: drive on the /dos
    directory, you could list the contents of the My Documents directory with the
    ls /dos/My\ Documents command. With the backslash, the shell ignores the space
    and sends the request as stdin to the ls command. Without the backslash, the shell
    would look for the contents of the /dos/My directory.


    You can also use the backslash for special characters, like the question mark
    (?) or asterisk (*).


    > When you use the backslash, you are "escaping" the functionality of the next
    space or character.


    # Aliases


    An example of a shell variable is alias. This variable lists the commands that
    you can substitute for others. One common alias is:


    ```

    alias dir=''ls -l''

    ```


    There is no dir command native to Linux. But when you set this alias, you can
    run the dir command instead of ls -l. However, because any alias is a shell variable,
    the alias that you set does not apply if you change shells. You can delete an
    alias with the unalias command. For example, if you set up dir as an alias for
    ls -l, the unalias dir command removes this link. Some Linux distributions set
    up several aliases by default on your shell. To check your currently active aliases,
    type the alias command.


    # Navigational Commands


    There are two basic navigational commands for getting around the shell. The cd
    command lets you navigate between directories. The ls command lets you know what''s
    in a directory (including other directories).'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# cd


    The change directory command is known as cd. Those of you familiar with MS-DOS
    may find a number of similarities between MS-DOS and Linux cd commands. Typical
    cd commands are shown in Table 7.1.


    A command associated with cd is pwd. The pwd (present working directory) command
    allows you to check your current directory. You may find it useful to check which
    directory you are in before you change directories.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_157_0.png)


    If you want to change to your home directory, use the cd ~ command. If you''re
    in root or superuser mode, this command brings you to the root user''s home directory,
    /root.


    # ls


    The ls command is versatile. Not only does it allow you to list the files and
    directories in your current directory, but with the proper switches, you can also
    find the permissions and size of a file. It allows you to check ownership, differentiate
    between file types, and sort the result in several ways. You can review some examples
    of this command in Table 7.2.


    Perhaps the most important command in this series is ls -l, which lists all files
    in the current directory including size, owner, and permissions. View an example
    of the result of this command in Figure 7.3.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_157_1.png)


    The ls command is important. Know the switches that can be used with ls, especially
    -a, -F, -i, and -r. These switches can be used in any combination. A common combination
    is ls -ltr, which lists your files, with permissions, from oldest to newest. Also,
    each file output from the ls command has its own line, which can be made to work
    with the wc command discussed in Chapter 8.


    **Table 7.1 cd commands.**


    | Command | Result |

    |---|---|

    | cd .. | Moves up one directory level. For example, if you''re currently in the
    /home/mj directory, this moves you to the /home directory. |

    | cd ../.. | Moves up two directory levels. For example, if you''re currently
    in the /etc/rc.d/rc0.d directory, this moves you to the /etc directory. |

    | cd /home/mj | Changes to the home directory of user mj. |

    | cd ~ | Changes to your home directory. |'
  merge: -1
  img_proc: true
- pgno: 158
  md: '**Table 7.2 ls commands.***


    | Command | Result |

    |---|---|

    | ls | Lists all nonhidden files in the current directory in alphabetical order.
    |

    | ls -a | Lists all files in the current directory including hidden files. |

    | ls -r | Lists all nonhidden files in the current directory in reverse alphabetical
    order. |

    | ls -F | Lists all files by type. The character at the end of each file indicates
    the file type. For example, a forward slash (/) represents a directory, an asterisk
    (*) is associated with an executable file, and an "at" (@) represents a linked
    file. |

    | ls -i | Lists files with inode numbers. An inode number represents the location
    of a file on a volume. Two or more files with the same inode number are two different
    names for the identical file. |

    | ls -l | Lists all the files in the current directory including the current directory
    (.) and the parent directory (..). Also lists the size, owner, and permissions
    associated with each file in what is known as long listing format. |

    | ls -t | Lists files by the last time they were changed; most recent files are
    listed first. |

    | ls -u | Lists files by the last time they were accessed; most recent files are
    listed first. |


    *Directories are included in all file lists. In Linux, a directory is just a special
    kind of file. A file is accessed anytime it is read, written to, or executed.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_158_0.png)


    Figure 7.3 A long listing (ls -l) in the current directory.


    # Permissions


    As you can see in Figure 7.3, each file is associated with owners, groups, and
    a series of permissions. The permissions associated with a file are assigned to'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'owners, groups, and everyone else on your Linux computer. Take a look at the
    following entry, which is a long listing for the batterup file:


    ```

    -rwxrwxr-- 1 mj users 7326 Jan 12 09:09 batterup

    ```


    Permissions are based on the characters on the left of the listing. The 10 characters
    determine what different users can do with this file. If the first character is
    not a dash (-), it''s not a regular file. It could be a directory (d) or a file
    linked (l) to another.


    The remaining characters can be grouped in threes. The subsequent three characters
    shown after the dash are rwx. In other words, the owner of the file named batterup
    can read (r), write (w), and execute (x) this file.


    The next three characters shown are rw-. Users in the same group as the file owner
    can read this file (r) or edit and write to this file (w). These users cannot
    execute the file.


    The final three characters are r--. Users who don''t belong to the same group
    as the file owner can read this file. They can''t write to it, nor can they execute
    it if it''s a script.


    You can set up these permissions using the following command:


    ```

    chmod 764 batterup

    ```


    Permissions are set with a three-number code. In the preceding command, the first
    number (7) sets permissions for the owner, the second (6) for the other users
    in the owners group, and the third (4) for everyone else. Each number represents
    all permissions given to the owner, group, or everyone else, as described in Table
    7.3.


    # Table 7.3 Numeric permissions.*


    | Permission | Number | Comment |

    |---|---|---|

    | r | 4 | = r(4) |

    | w | 2 | = w(2) |

    | x | 1 | = x(1) |

    | rx | 5 | = r(4) + x(1) |

    | rw | 6 | = r(4) + w(2) |

    | wx | 3 | = w(2) + x(1) |

    | rwx | 7 | = r(4) + w(2) + x(1) |


    *Observe how the number is based on the combined values of permissions; for example,
    the number associated with rx is 4 (the value of r) + 1 (the value of x).'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Look at the permissions associated with the batterup file again. Because the
    first number is 7, the owner of this file has read (r), write (w), and execute
    (x) permission to this file. Because the second number is 6, other users in the
    owner''s group have read (r) and write (w) permissions on this file. Because the
    third number is 4, everyone else has just read (r) permissions on this file.


    Note: A number of commands in this chapter can only be executed by the root or
    super-user. If you want to experiment with one of these commands, type "su" and
    enter the root password when prompted.


    # umask


    When you create a new file or directory, the permissions you get depend on the
    value of what is known as the umask. Open a command-line interface, and type the
    umask command. You may get an output like the following:


    ```

    023

    ```


    Before you interpret this number, you need a clear idea of the numeric value of
    permissions.


    For example, if you gave everyone permissions to your files and directories, you
    would have read, write, and execute permissions for all users. As discussed in
    the previous section, these permissions correspond to the number 7 (r+w+x = 4+2+1).
    When applied to all users, they correspond to 777. You could set up the same permissions
    for all users on the batterup file with the following command:


    ```

    chmod 777 batterup

    ```


    However, the files and directories that you create generally don''t have 777 permissions.
    The permissions that you get depend on the umask value. Type the umask command
    to find its current value, and then subtract the umask number from 777. If umask=023,
    then 777-023=754. Consequently, permissions equal 754. When you review the last
    section and Table 7.3, you can see that 754 corresponds to read, write, and execute
    permissions for the owner, read and execute permissions for members of the owner''s
    group, and read permissions for all other users.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Practice Questions


    # Question 1


    Which of the following are results of the interactivity and command completion
    characteristics of the Linux command line? (Note: You may want to reuse the ls
    -ltr command in this question. It is the most recent command that you used starting
    with the letter l.)


    +   - a. You can interact with your commands with the Tab key; the stty command
    sets up various control and function keys that complete certain commands.

    +   - b. You can interact with your previous commands using the up and down arrow
    keys; the Tab key allows you to select or complete a number of commands based
    on their first few letters.

    +   - c. You can type "!!" to recall your previous command; the right and left
    arrow keys allow you to complete a number of commands based on their first few
    letters.

    +   - d. You can type "!!" to recall your previous command; the alias command
    sets up various two-letter combinations that take the place of longer commands.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_161_0.png)


    Answer b is correct. The history of a Linux shell allows you to use the up and
    down arrow keys to recall previously used commands. Although the stty command
    does allow you to set up various control key combinations for certain commands,
    it is unrelated to Linux command completion. Therefore, answer a is incorrect.
    Although you can use the !! command with your history to recall the previous command,
    you can''t use the left and right arrow keys to complete previous commands. Therefore,
    answer c is incorrect. You cannot interact with previous commands using the Tab
    key. Although you can set up the alias command to set up any combination of letters
    to simulate longer commands, it is not related to command completion. Therefore,
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Question 2


    Which of the following statements most accurately describe the characteristics
    of environment and shell variables?


    +   - a. An environment variable applies to all users. A shell variable remains
    constant as you move from shell to shell.

    +   - b. An environment variable applies to all shells. A shell variable may change,
    or may not even exist, as you move from shell to shell.

    +   - c. An environment variable applies to all users. A shell variable may change,
    or may not even exist, as you move from shell to shell.

    +   - d. An environment variable applies to all shells. A shell variable remains
    constant as you move from shell to shell.


    Answer b is correct. Although environment variables apply to all shells, a shell
    variable changes from shell to shell (unless you export that variable). Because
    environment variables may not apply to all users, answers a and c are incorrect.
    Shell variables are not normally constant from shell to shell; therefore, answer
    d is incorrect.


    # Question 3


    You have a large number of files in your home directory including the figures
    that you need for your seventh presentation. These figures are in binary format.
    Based on your company policy, you''ve organized your figures in the following
    format: fig07-xx, where xx is the figure number. You want to see if you have figures
    10 through 19. You don''t want to see any other figures in the list. Which of
    the following commands will list just the figures that you want?


    +   - a. ls -ltr fig07-*

    +   - b. ls -ltr fig07-[10-19]

    +   - c. ls -ltr fig07-1?

    +   - d. ls -ltr fig07-1*


    Answer c is correct. The question mark is a wildcard for the one character position.
    Because the asterisk is a wildcard for any number of characters, answer a is incorrect.
    The bracketed search terms only work for one character at a time; you would need
    ls -ltr fig07-1[0-9] for this to work. Therefore, answer b is incorrect. Because
    the asterisk includes any number of characters, answer d could include fig07-1,
    fig07-1000, and so on. Therefore, answer d is also incorrect.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Question 4


    You started a program in a command-line interface, and because you''re not in
    a graphical user interface, you can''t just click a button to start another shell.
    The program seems like it''s going to run for a long time. You want it to keep
    running, but you need to check your email. What can you do? [Check all correct
    answers]


    +   - a. Press Ctrl+C, and when you see the command-line interface, type the bg
    command to move the process into the background.

    +   - b. Press Ctrl+Z, and when you see the command-line interface, type the bg
    command to move the process into the background.

    +   - c. Press Ctrl+Alt+F2, and when you see the login screen, log in again. Your
    program will keep running in another virtual console. If F2 doesn''t work, try
    F1, F3, or F4.

    +   - d. Press Ctrl+Z, and when you see the command-line interface, restart the
    program using an ampersand (&) at the end. This resumes the process in the background.
    You will then see a command-line interface where you can run another program.


    Answers b and c are correct. The Ctrl+Z command suspends a running process, and
    the bg command restarts the process in the background. You can use the Ctrl+Alt+Fx
    (x is a number from 1 to 6) command to start another virtual console. The program
    continues to run in your original console. Because the Ctrl+C command stops a
    running program, answer a is incorrect. Because your program is still running,
    you do not need to start it again. Although you could use an ampersand (&) if
    you hadn''t already started your program, using it at this time means you would
    have to start your program again. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Question 5


    You''ve created a program called filemanager, which uses the files listed in the
    current directory. You just want to use file names, and you don''t want to use
    any hidden file names. Which of the following commands is the most efficient way
    to feed data to the filemanager program?


    +   a. ls -l filemanager

    +   b. ls -a filemanager

    +   c. ls > filemanager

    +   d. ls | filemanager


    Answer d is correct. The plain ls command outputs just the file names in the current
    directory. With the pipe (|), this information becomes standard input (stdin)
    for the filemanager program. The ls -l command outputs permissions, owners, and
    so on. Therefore, answer a is incorrect. The ls -a command outputs hidden files.
    Therefore, answer b is incorrect. Because ls -a command would overwrite your filemanager
    program with your current file list, answer c is incorrect.


    # Question 6


    There are three different standard I/O channels. Which of the following methods
    is an allowable way to redirect these channels?


    +   a. Stdin can be redirected from a file. If you have a number of input terms
    in the text file crabgrass and a script named runner, you can execute the runner
    << crabgrass command.

    +   b. Stdout can be redirected to a file. If you have a number of input terms
