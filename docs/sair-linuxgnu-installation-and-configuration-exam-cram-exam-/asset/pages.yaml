    # Graphical Help Utilities


    There are three graphical versions of the man and info commands: xman, tkman,
    and xinfo. These utilities are suitable for use in a GUI such as GNOME (GNU Network
    Object Model Environment) or KDE (K Desktop Environment). Unfortunately, not all
    of these commands are standard on the latest Linux distributions. If you want
    to try them out, open a GUI, start a command-line shell window, and enter one
    of these commands. The commands include the following characteristics:


    +   - **xman**—As shown in Figure 2.4, this command includes a fairly simple interface.
    When open, press Ctrl+S to activate a search screen. Type a command in the search
    screen, press Enter, and xman takes you to the man page for that command.

    +   - **tkman**—This command allows you to search through manual page headers.

    +   - **xinfo**—This command adds menu buttons to the info screen. Unfortunately,
    it has the same limitations as the info utility.


