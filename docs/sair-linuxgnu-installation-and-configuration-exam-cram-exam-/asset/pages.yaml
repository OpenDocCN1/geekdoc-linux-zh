- pgno: 285
  md: '# Read Errors


    Common problems with floppy disks include read or file not found errors. Possible
    causes include a flaw in the floppy disk or a format that Linux can''t read.


    As floppy disks age, their capability to hold data diminishes. Floppy disks sent
    through the mail commonly fail when reformatted for Linux. Also, if you try to
    read data written to a floppy from an incompatible system, like Apple Macintosh,
    you will get one of these errors.


    In either case, you should get a new floppy disk, reformat it, and reinstall your
    data.


    # Archive Errrors


    New programs in Linux are most commonly available in archives known as tar. For
    example, you might download the latest version of Apache (the Linux Web server)
    from a Web site in a file such as apache_2.0.1.tar.gz. Downloads don''t always
    go smoothly. If you receive an error like the following, try downloading the file
    again, perhaps from a different Web or FTP site:


    ```

    Tar:read error or gzip: not in gzip format while installing Linux

    ```


    Also, one or more archives on your Linux installation CD may be corrupt. If you
    can identify the specific problem archive, you may be able to download and install
    it separately. Otherwise, you may have to obtain a new Linux installation CD.


    # Not Enough Space


    If you receive a message like device full, you''ve run out of room on one of your
    Linux volumes. If you get this message when running Linux, you need to delete
    some files. Normally, this error is fairly rare, because Linux can still run efficiently
    when volumes are over 90 percent full.


    You may also get this message when you''re installing Linux. In either case, you
    can reconfigure your disk volumes. This is a more difficult process, because it
    involves backing up current files, repartitioning, and reinstalling. If this error
    occurs while you are installing Linux, the best course of action is to stop the
    installation, reallocate space to your volumes, and try the installation again.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_285_0.png)


    When you''re installing Linux, you can review the progress of your installation,
    including error messages in some of the first four virtual consoles. One of these
    consoles is set up for the command-line interface (CLI) in single-user mode. As
    mentioned previously, you can access different virtual consoles with the Alt+Ctrl+Fx
    command, where x represents the number of the virtual console.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Bad Hard Disk Blocks


    Linux volumes are set up in units of memory known as blocks. Depending on your
    situation, you may have 512, 1024, 2048, or 4096 bytes of information in each
    block. If you have problems with your hard disk, you may get an error message
    similar to the following:


    ```

    Read_intr: 0x10 error

    ```


    You can get this error in two situations. Either you have a physical defect on
    your hard drive, or you''re trying to format a volume that''s larger than what''s
    physically available on your hard drive.


    One way to check for bad blocks on your hard drive is with the badblocks command.
    It marks and sets aside any blocks that can''t be read.


    > Note: The badblocks command is similar to Microsoft''s chkdsk command. Other
    commands used to check for bad blocks are mke2fs -c and e2fsck -c.


    # Other Installation Issues


    There are two other errors that may occur, especially when you''re installing
    Linux over a network. If you see a message like file not found or permission denied
    while installing Linux, you have a problem with your Linux distribution. You may
    have a Linux installation CD or download that''s missing some files, or it may
    be set with improper permissions. In either case, you''ll need to try downloading
    the distribution again, try the installation from a different CD, or try a different
    distribution altogether.


    When you''re installing Linux over a network, such as through FTP, you need to
    download a series of files. A common FTP command for downloads is mget, which
    copies specified files from the current FTP server directory to the current directory
    on your local computer. The differences between the commands used to download
    files can create a problem. For example:


    ```

    mget *.*

    mget .

    ```


    If you''re using the MS-DOS version of FTP, the effect of these commands are identical;
    they copy all files from the current directory on the FTP server to the current
    directory on the local computer.


    However, these commands have a different effect in Linux. Many Linux files don''t
    have a dot (.) to divide a filename from its extension, such as chapter14.doc.
    So when you run FTP from Linux and run the mget *.* command, the only files copied
    are the files set up in the "dot" format.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Rescue Disk Help


    If your Linux system ever fails in a way that keeps you from booting or logging
    in, you''ll need a boot disk and a backup of your /etc/passwd file. Errors in
    this area include problems with your hard drive''s Master Boot Record (MBR), your
    /etc/passwd file, or a specific dynamic program library.


    If you don''t have a boot disk and don''t have any rescue utilities on your Linux
    installation CD, you may be stuck installing a fresh copy of Linux and overwriting
    all current data on your computer.


    > TIP

    > One possible "last resort" solution is to use a Linux installation CD to upgrade
    the current distribution, which sometimes preserves the data created by your users.


    # Creating a Boot Floppy


    When installing Linux, you should accept the option to create a boot disk. Alternately,
    the following command extracts needed files from the boot.img boot image file
    to a floppy drive. If the appropriate files are on different directories, substitute
    accordingly:


    ```

    dd if=/mnt/cdrom/images/boot.img of=/mnt/floppy

    ```


    Other useful floppies that you might create, depending on your distribution, include
    network files (bootnet.img), PCMCIA files (pcmcia.img) and drivers (drivers.img).


    > TIP

    > As a last resort, you may be able to create a boot floppy using the expert or
    rescue mode on your Linux installation CD, if it is available. You might also
    use the rescue mode as you would a Linux boot floppy. The result depends on your
    distribution CD.


    # Components of the Boot Floppy


    There are two parts of the boot floppy: a compressed version of your Linux kernel
    and a set of utilities and files, known as initrd, to help you recover from most
    problems. When you boot from this floppy, your computer loads the Linux kernel,
    and then it decompresses the initrd image into a set of files on your RAM. These
    files appear to be on a hard drive, but they''re actually on a RAM disk, which
    is an area of your RAM that''s set up like a hard drive volume.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Problems with the Master Boot Record (MBR)


    If your MBR is corrupt, your computer won''t be able to find Linux (or any other
    operating system). Once you''ve mounted the normal root directory from your hard
    drive, you can use the /sbin/lilo command to write the contents of your current
    /etc/lilo.conf configuration file to your MBR.


    Note: The /sbin/lilo command in Linux is almost functionally equivalent to the
    fdisk /mbr command in MS-DOS; both commands replace the MBR. But the fdisk /mbr
    command overwrites any lilo.conf boot loader on your MBR and therefore would prevent
    you from accessing Linux.


    You know your MBR is corrupt if you see an error message like the following:


    ```

    Drive not bootable - Please insert system disk

    ```


    # Incorrect Operating System


    You can set up several operating systems to boot based on information in your
    /etc/lilo.conf configuration file. If this file is somehow corrupted, you may
    end up with the wrong operating system (e.g., you boot into Windows when you choose
    Linux).


    The solution is the same as in the last section. You need to reinstall the lilo.conf
    file on your MBR.


    # Shell Problems


    If you can''t get to your default shell or command-line interface (CLI), you may
    have a problem with permissions or your passwords.


    To run Linux, everyone needs at least read and execute permissions on the root
    directory (/). To check current permission on /, run the ls -la / | more command.
    The permissions associated with the file named "." (dot) are the permissions of
    your root directory. If everyone doesn''t have at least read and execute permissions
    on this directory, go into root or superuser mode and run the chmod 755 / command.


    If that doesn''t work, you may have a problem with your /etc/passwd file, which
    may be addressed by solutions discussed in the following two sections.


    # Restoring Passwords


    If you have access to Linux without resorting to your boot floppy, you can also
    boot Linux in single-user mode. When you boot your computer, at some point, you''ll
    see the Linux Loader (LILO) prompt as shown:


    ```

    LILO boot:

    ```'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Type "linux single" at this prompt, and Linux automatically boots into single-user
    mode. You then have access to all Linux commands in superuser mode without having
    to log in to Linux.


    > If you forget the password for the root or superuser, you can use this technique
    to delete the root password. Don''t forget to set a new password once you''ve
    rebooted into Linux without the boot disk.


    If you need your boot floppy to start Linux, review the technique discussed in
    the next section.


    # Restoring Passwords with a Boot Floppy


    One disaster that can happen with Linux is when nobody can log in to the computer.
    A common cause of this problem is a corrupt or deleted /etc/passwd file. A Linux
    boot floppy allows you to start Linux as the root user without requiring a login.
    Once you''ve mounted your hard drive, you can then restore the password file from
    a backup.


    If you don''t have a backup password file, you need to create a new version of
    this file. Every user on your system then has to log in again and set up passwords
    of their choice.


    # Dynamic Library Modules


    Dynamic libraries are a convenience for developers, because they allow the reuse
    of the same code, or programming instructions, for different commands. If you
    can''t run some basic commands in your shell, you may have a problem with one
    or more dynamic library modules.


    When you start Linux from the boot floppy, you gain access to some of these critical
    shell commands. You can then restore the appropriate dynamic library module from
    a different source, such as the Linux installation CD.


    # Printer Problems


    If you''re having trouble printing, there are several steps that you can follow
    to troubleshoot your problems. These steps include checks on physical connections,
    logical connections, system logs, and configuration files. You can try to print
    again after each of these steps:


    +   1. Always check physical connections first. In other words, check power to
    your printer as well as the cable that connects the printer to the computer. If
    your printer is located on another computer, check your network connections as
    well.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '2. Check for error messages. If you have an error on a currently running print
    job, you''ll be able to find an error message in the /var/spool/lpd/lp/status
    file. (You can review other errors in the lp system log file as defined in your
    version of /etc/syslog.conf.)


    *Note: If you have more than one printer, each printer should have a different
    name. Substitute accordingly for lp in each of the following steps.*


    3. If your physical connections work, check for a lock file. If you have a file
    like /var/spool/lpd/lp/lock, you can''t print on the lp printer. If you don''t
    currently have a running print job, delete this file. Lock files are temporary
    devices designed to keep more than one program from printing simultaneously.


    4. If you don''t have a lock file, check for a control file (cf) and a data file
    (df) in your /var/spool/lpd/lp directory. When you print a job, the request is
    sent to the spool directory associated with your printer. The line printer daemon
    (lpd) creates a cf with information on the print job and a df with the information
    to be printed.


    5. If you don''t have any of the files discussed in the previous steps, check
    the main printer configuration file, /etc/printcap. Make sure it still conforms
    to the parameters you need for your printer, as discussed in Chapter 9.


    6. Check basic output to your printer. Run the lptest > /dev/lp command. (If your
    printer goes by a different name than lp, substitute accordingly.) The lptest
    command sends a generic "ripple test" pattern to your printer.


    7. Check text output to your printer. Select a text file of your choice and send
    it to your printer device using the cat file > /dev/lp command. Substitute for
    file and lp accordingly.


    8. If you have a serial port printer, check the devices linked to each serial
    port with the ls -l /dev/tty0* command. Make sure your printer still has control
    of the appropriate serial device.


    9. Check your environment variables with the env command. Make sure there are
    no environment variables, such as PRINTER, redirecting output to another file
    or printer.


    # Other Problems


    There are a number of other problems that you can solve fairly easily. You can
    address keyboard issues related to graphics, repeat rate, and the Num Lock key.
    You can synchronize your clock with a site on the Internet. You can also address
    memory problems, including those related to the X Window.'
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Weird Characters\n\nBefore the development of graphics adapters, Unix used\
    \ pseudographics mode to simulate simple pictures, such as lines and letters to\
    \ illustrate the squares and pieces in a chess game. If you can't start the graphical\
    \ user interface (GUI) from a CLI, you're sent to a strange mode where you see\
    \ strange characters on a CLI screen. You can type the reset command to switch\
    \ out of this graphics mode, or you can switch to another virtual console and\
    \ kill the shell associated with the pseudographics mode console.\n\n# Num Lock\n\
    \nBy default, the numeric keypad is off when you install Linux. This is probably\
    \ preferred if you're using a laptop computer without a dedicated numeric keypad.\
    \ When you turn on the Num Lock key on a laptop, numbers supersede several letters\
    \ on your keyboard.\n\nOn the other hand, many people use the numeric keypad on\
    \ a standard keyboard. If you want the Num Lock key to be set on by default when\
    \ you boot Linux, set up the following shell script, make it executable, and copy\
    \ it to the /etc/rc.local or another /etc/rc.d directory associated with booting\
    \ Linux:\n\n```\nfor n in 1 2 3 4 5 6 7\n do\n     setleds +num < /dev/tty$n >\
    \ /dev/null\n done\n```\n\nThis script activates the Num Lock key for all virtual\
    \ terminals associated with the variable n, using the setleds utility.\n\n# Keyboard\
    \ Repeat Rate\n\nWhen you press a character key on your keyboard and keep it pressed\
    \ in a CLI, the character eventually repeats itself. The rate of repetition is\
    \ known as the keyboard repeat rate. You can set this rate with some BIOS menus,\
    \ or you can set it using the kbdrate command. For example, if you want to set\
    \ a repeat rate of 20 characters per second, run the following command:\n\n```\n\
    /sbin/kbdrate -r 20\n```\n\n# Synchronizing Time\n\nThe time reported on your\
    \ computer may not be accurate. Some BIOS clocks run fast. Alternately, if the\
    \ battery associated with your BIOS does not have enough power, your BIOS clock\
    \ may be slow."
  merge: -1
  img_proc: true
- pgno: 292
  md: 'If you''re running several computers on a network, you may have applications
    where it''s important that all of your computers have the same clock time. The
    TCP/IP protocol suite includes a Network Time Protocol (NTP), which allows you
    to synchronize the time on all of your computers. For example, if you want to
    synchronize with the time server at the Internet Software Consortium (ISC), run
    the following command:


    ```

    ntpdate clock.isc.org

    ```


    Other "official" NTP time servers are available worldwide. For more information,
    refer to the time WWW server Web page at www.eecis.udel.edu/~ntp, sponsored by
    the University of Delaware.


    # X Window Thrashing


    When you don''t have enough RAM, your computer spends a lot of time exchanging
    information between RAM and the swap partition on your hard drive. (The swap partition
    is your virtual memory, which extends the amount of "RAM" available to Linux.)
    This phenomenon is also known as thrashing, which characterizes constant activity
    on a hard drive.


    One common cause of thrashing is the demands of the X Window. If everything slows
    down when you start the X Window, you probably have a memory problem and should
    follow the guidelines discussed in Chapter 3 for RAM requirements.


    # Problem Opening the X Window


    If you try to open the X Window and Linux doesn''t bring you into the GUI, you
    may receive an error message like the following:


    ```

    cannot open display:0.0

    ```


    In this case, you need to configure the DISPLAY variable. DISPLAY can be either
    an environment variable or a shell variable. DISPLAY is an environment variable
    if you see it in the output to the env command; it is a shell variable if you
    see it in the /etc/profile configuration file. If DISPLAY is an environment variable,
    you need to set it. If it is a shell variable, you should export it so it works
    with other shells.


    In either case, you need to set this variable to localhost:0.0, which sets up
    the local computer to work locally or with remote clients. You can set DISPLAY
    to this value with the following command:


    ```

    DISPLAY=localhost:0.0

    ```'
  merge: -1
