- pgno: 98
  md: '# Practice Questions


    # Question 1


    Which of the following ways can you set up five volumes on a single hard disk?


    - a. Set up five primary partitions.

    - b. Set up two primary partitions, one extended partition, and three logical
    drives.

    - c. Set up three primary partitions and two logical drives.

    - d. Set up one primary partition, one extended partition, and three logical drives.


    Answer b is correct. You can only set up a logical drive within an extended partition.
    Because you can''t set up more than four primary partitions in a hard disk, answer
    a is incorrect. You cannot set up a logical drive without an extended partition;
    therefore, answer c is incorrect. Because an extended partition is not a volume,
    answer d is incorrect.


    # Question 2


    You have a computer with Microsoft Windows installed. It is set up on one primary
    partition. There are no other partitions or logical drives available. Which of
    the following steps should you take before you split this partition to accommodate
    Linux? [Check all correct answers]


    - a. Run the fips utility to rearrange the data on your drive.

    - b. Run the Windows Defrag utility to consolidate the data on your drive.

    - c. Run the Windows ScanDisk utility to make sure your drive has no errors.

    - d. Back up your hard disk.


    Answers b, c, and d are correct. The Windows Defrag utility consolidates the data
    on your drive. The Windows ScanDisk utility checks for errors on your drive. Because
    splitting partitions can be a dangerous business, you should always back up the
    data on your disk. The fips utility is used to split partitions; therefore, answer
    a is incorrect.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Question 3


    You used the fips utility to split your partition, and then you realized that
    you made a mistake. Which of the following actions should you take?


    a. Back up your hard drive, and then run fips again.


    b. Run fips again, and then use the restorbr utility. Make sure that you have
    the rootboot.000 file that fips created and saved on your floppy drive.


    c. Use fdisk to rebuild the partitions on your hard drive. Run the restorbr utility
    to re-create your original partitions.


    d. Run the restorbr utility. Make sure that you have the rootboot.000 file that
    fips created and saved on your floppy drive. Run fips again.


    Answer d is correct. Assuming you had saved your root and boot sectors, you should
    have a rootboot.000 file on a bootable floppy drive. You should be able to use
    the restorbr utility to use this file to rewrite your original root and boot information.
    If you made a mistake with fips, you don''t want to back up the result. Therefore,
    answer a is incorrect. Although answer b can work, the act of using fips to split
    partitions again can cause more problems. Therefore, answer b is incorrect. Because
    the fdisk utility won''t help you recover from any mistakes that you make with
    fips, answer c is incorrect.


    # Question 4


    You just logged in to the root account in Linux and used the mount /dev/cdrom
    /mnt/cdrom command to access the files on your CD-ROM. Assuming that the appropriate
    directory already exists, what is the absolute path of your CD-ROM files?


    a. root/mnt/cdrom


    b. /root/mnt/cdrom


    c. mnt/cdrom


    d. /mnt/cdrom


    Answer b is correct. Absolute paths always start with the root directory, which
    is labeled by a simple forward slash (/). The /root directory is the home directory
    for the root user. Because root/mnt/cdrom is not an absolute path, answer a is
    incorrect. Although you could get to your CD-ROM files from your root home directory
    with the cd mnt/cdrom command, mnt/cdrom is still not an absolute'
  merge: -1
