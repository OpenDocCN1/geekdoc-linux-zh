- pgno: 346
  md: '# Glossary


    *

    A wildcard character that represents zero or more alphanumeric characters. For
    example, if you were to run the ls a* command, you would see all files starting
    with the letter a. If you have a file named a, you would see this file in the
    listing as well.


    .

    Also known as the dot, this represents the current directory.


    ..

    The double dot represents the parent of the current directory.


    <

    A redirection. The contents from the term to the right of this arrow is redirected
    as standard input (stdin) to the file to the left of the arrow. Commonly used
    to input several terms or data from a file to a program.


    >

    A redirection. Standard output (stdout) from the term to the left of this arrow


    is redirected to the file to the right of the arrow. If the file already exists,
    it is overwritten.


    >>

    Redirect and append. Standard output (stdout) from the term to the left of this
    arrow is redirected to the end of the file listed to the right of the arrow. Does
    not overwrite the file to the right of the arrow.


    &

    When used after a program name, the ampersand (&) instructs your shell to run
    that program in the background.


    ?

    A wildcard character that represents one alphanumeric character. For example,
    if you were to run the ls a? command, you would see all files with two characters
    starting with the letter a, such as a1, ab, a6, ax, and so on.


    []

    Brackets. Used to define a range of search terms.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '**|**

    A pipe. Standard output (stdout) from the term or command to the left of the pipe
    is redirected as standard input to the term or command to the right of the pipe.


    **2>**

    Redirect standard error. Standard error (stderr) from the term to the left of
    the arrow is redirected to the file to the right of the arrow. If the file already
    exists, it is overwritten.


    **/**

    The root directory. This is the top directory in any Linux system.


    /bin"**

    The Linux directory with essential command-line utilities.


    **/boot**

    The Linux directory with startup utilities, often including the Linux kernel.


    **/dev**

    The Linux directory with device drivers.


    **/dev/null**

    An output file that ignores output from a utility or a script. It prevents unwanted
    or unneeded output from affecting other systems.


    **/etc**

    The Linux directory with most basic configuration files.


    **/etc/bashrc**

    The configuration file that contains bash shell variables for all users.


    **/etc/environment**

    The configuration file with environment variables applicable to all users.


    **/etc/exports**

    The configuration file with a list of Linux directories that you make available
    through the Network File System (NFS).


    **/etc/fstab**

    The configuration file that lists volumes to be mounted during Linux boot and
    those that can be mounted after boot.


    **/etc/hosts**

    The configuration file where you can associate computer names and IP addresses
    on your local network. This file is an alternative to DNS on smaller networks.


    **/etc/inittab**

    The configuration file that specifies run levels as well as local and remote virtual
    consoles.


    **/etc/login**

    A configuration file that may contain environment or shell variables, depending
    on your distribution.


    **/etc/mtab**

    The file that lists current mounted or mountable volumes.


    **/etc/passwd**

    The file that lists all users that are set up on your Linux computer. Passwords
    are either encrypted in this file or are marked with an x. In the latter case,
    passwords are encrypted in the /etc/shadow configuration file.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '**/etc/printcap**

    The printer configuration file.


    **/etc/profile**

    A configuration file with variables for all users. Whether the variables are environment-wide
    or specific to one shell depends on your Linux distribution.


    **/etc/resolv.conf**

    The configuration file with the fully qualified domain names or IP addresses of
    your DNS servers.


    **/etc/skel**

    The directory where default configuration files for individual users are located.
    If you want to create a new user, you can copy the files from this directory to
    your new user''s home directory.


    **/etc/syslog.conf**

    The configuration file that specifies the location of various log files.


    **/etc/X11/XF86Config**

    The main configuration file for the Linux X Window.


    **/home**

    The Linux directory that contains home directories for regular individual users.


    **/lib**

    The Linux directory that contains program libraries referenced by the Linux kernel
    and command-line utilities.


    **/mnt**

    The Linux directory that contains the mount point or directory for removable media,
    such as floppy or CD-ROM drives.


    **/opt**

    The Linux directory that is commonly used for third-party applications, such as
    WordPerfect or Applixware.


    **/proc**

    The virtual Linux directory that contains currently running kernel-related processes.


    **/root**

    The home directory for the root user for the local system.


    **/sbin**

    The Linux directory containing many system administration commands.


    **/sbin/lilo**

    The command that incorporates information from the /etc/lilo.conf file in the
    Master Boot Record.


    **/tmp**

    The Linux directory commonly used for temporary files, such as downloads from
    the Internet.


    **/usr**

    A Linux directory with a number of smaller programs and applications.


    **/var**

    The Linux directory for variable data, such as print spools and log files.


    **absolute path**

    The fully defined path to a file or directory in Linux, starting with the root
    directory.


    **access.conf**

    An Apache configuration file where you set up directories for use by your Web
    server.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# address classes


    The term associated with the five main groups of IP addresses. By convention,
    there are five address classes: A, B, C, D, and E.


    # aduser


    A command that partially automates the process of adding users in Linux.


    # af


    Accounting filter. Associated with the /etc/printcap printer configuration file.
    A way to collect costs associated with printing.


    # AfterStep


    A window manager based on FVWM code, which is designed to look like the window
    manager associated with the NeXTStep operating system.


    # alias


    A Linux command used to designate a word that is equivalent to a Linux command.
    Commonly used to help MS-DOS users make the transition to Linux; one common alias
    command is "alias dir=ls -l".


    # Apache


    The Linux Web server, also known as httpd.


    # append


    A LILO configuration command used to assign IRQs and I/O addresses to peripherals,
    such as network cards.


    # Applixware


    Applixware Office is a Linux office suite from Vista Source. Functionally similar
    to Microsoft Office.


    # apropos


    Searches through available commands. For example, apropos ethernet searches through
    the title of every available man page for the word ethernet. This command does
    not work in all Linux distributions.


    # archive error


    An error associated with collecting or extracting from an archive file.


    # ARPA


    The Advanced Research Projects Agency of the U.S. Department of Defense. The agency
    that contracted with various universities for a network that could survive a nuclear
    war. This ARPAnet that developed was the precursor of the Internet. It was built
    on university computers with the Unix operating system and a networking protocol
    stack known as TCP/IP.


    # ATAPI


    AT Attachment Packet Interface. The most common interface for CD-ROM drives.


    # badblocks


    A command that checks for physical defects on your disk in specific blocks. When
    defects are found, these blocks are set aside and marked to keep hard disks from
    storing files on them. Conceptually similar to the MS-DOS chkdsk command.


    # bash


    Bourne Again SHell. Possibly the most common shell in use in Linux.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '**Basic Input/Output System (BIOS)**

    The first program that runs when you start your computer. It initializes your
    hardware and starts the process of booting.


    **beta**

    A prerelease status for software, which is not suitable for production computers.
    Intended for testing and debugging by developers.


    **bg**

    A command that resumes suspended programs in the background of the command-line
    interface. You can suspend a program with the Ctrl+Z command, and then resume
    it in the background with the bg command. After you run this command, you get
    a command-line interface that allows you to run another program. See also &.


    **Blackbox**

    A window manager designed to work in a minimum of RAM. Includes support for KDE
    applications.


    **boot.b**

    Also known as the *secondary boot loader*, which loads after you choose Linux
    at the LILO boot: prompt.


    **broadcast address**

    The network address used to send messages to every computer on a LAN. On a TCP/IP
    network, the broadcast address is the last address in the range for the LAN. For
    example, if the network address is 192.168.12.0 and the network mask is 255.255.255.0,
    the broadcast address for that network is 192.168.12.255.


    **bus**

    A communications channel inside a computer. PC buses are dedicated to PCI cards
    and ISA cards as well as RAM.


    **Caldera**

    A Linux distribution sometimes known as *Open Linux* or *eLinux*.


    **cat**

    The concatenate command sends the contents of a file to your standard output,
    usually the screen. Similar to the MS-DOS *type* command.


    **cd**

    The Linux change directory command.


    **chgrp**

    The command to reassign the group associated with a file or directory.


    **chmod**

    The command to change the permissions associated with a file or directory.


    **chown**

    The command to reassign the ownership of a file or directory.


    **CLI**

    See command-line interface.


    **COAS**

    Caldera Open Administration System. A graphical utility that allows you to administer
    many parts of your Linux system.


    **command completion**

    In a Linux shell, this is the ability to complete partial commands with the Tab
    key.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# command-line interface (CLI)


    The operating system interface that you control with text-based commands.


    # command line interpreter


    Another name for a Linux shell.


    # community development model


    The way software is developed in Linux. In the community development model, independent
    developers combine their efforts to write, develop, test, and debug software.


    # copyleft


    See General Public License (GPL).


    # Corel Linux


    A Linux distribution that focuses on ease of use. It is based on Debian Linux.


    # cp


    The Linux copy command.


    # CPU


    Central Processing Unit. The main processing engine in a personal computer.


    # cracker


    A user who tries to break into computer systems for malicious reasons.


    # daemon


    Any program resident in your RAM that watches for signals to go into action. For
    example, network daemons watch for data transmitted between computers before they
    start.


    # dd


    Device dump. This command is used to unpack images to other directories and is
    especially suited for floppy disks. Similar to the rawrite command.


    # Debian


    A Linux distribution that is popular among Linux developers, which supports a
    large number of available software packages. Debian is one of the distributions
    maintained by volunteers.


    # Defrag


    The Microsoft Windows disk defragmenter utility, which reorganizes the locations
    of different files on your hard drive.


    # Deja.com


    Refers to the Web site that is a common source of troubleshooting tips and is
    based on the questions and answers of actual users.


    # device full error


    An error associated with a lack of space on a Linux volume or a hard disk.


    # df


    The disk free space command, which summarizes used and free disk space on each
    mounted volume.


    # DHCP


    Dynamic Host Configuration Protocol. You can use a DHCP server to ration or assign
    IP addresses on your network.


    # dhcpd


    The Linux daemon associated with DHCP.


    # DMA


    Direct Memory Address. For peripherals with independent processing capability
    that can bypass your CPU.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '**dmesg**

    The Linux command that recites the messages associated with booting Linux on your
    computer, including installed hardware and daemons.


    **DNS**

    See Domain Name Service.


    **domain**

    A group of computers administered as a single unit. The computers in a local area
    network are commonly organized in a domain.


    **domain name**

    The name associated with a specific network. Examples of domain names on the Internet
    are linuxcertification.org, coriolis.com, and mommabears.com.


    **Domain Name Service (DNS)**

    A system that translates domain names such as coriolis.com to IP addresses such
    as 38.187.128.10. Usually set up as a database on a server. Sometimes also known
    as the Domain Name System.


    **DOSEMU**

    DOS emulator. It includes a series of commands that you can use in Linux to directly
    read, write, and execute MS-DOS files.


    **dotted-decimal notation**

    The standard format for IP addresses: four numbers between 0 and 255, separated
    by periods or dots.


    **dotted-quad format**

    See dotted-decimal notation.


    **du**

    The disk usage command. Lists the files used in your current directory and subdirectories
    as well as their sizes.


    **dual boot**

    A configuration where you have two operating systems installed on one computer.


    **elm**

    Electronic mail. This is a Linux email manager.


    **emacs**

    Also known as GNU/emacs. A text editor based on the LISP programming language.


    **Enlightenment**

    A window manager designed to be especially configurable.


    **environment variable**

    A variable that remains constant when you move from shell to shell.


    **Ethernet**

    A standard type of local area network with a maximum data transmission speed of
    10Mbps. Variations on Ethernet are available for faster speeds: Fast Ethernet
    has a maximum data transmission speed of 100Mbps; Gigabit Ethernet has a maximum
    data transmission speed of 1,000Mbps.


    **export**

    When this command is applied to a shell variable, it makes that variable work
    for all shells.


    **ext2fs**

    The Linux second extended file system. A format for a volume; in the same category
    as Microsoft''s File Allocation Table (FAT).'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# extended partition


    A partition designed to contain multiple logical drives. When you need more than
    four volumes, you can set up an extended partition


    # fdisk


    A utility that sets up primary and extended partitions as well as logical drives
    on a hard disk. Different versions of fdisk are available for MS-DOS and Linux.
    The fdisk /MBR command overwrites your Master Boot Record for MS-DOS or Microsoft
    Windows operating systems.


    # FHS


    See Filesystem Hierarchy Standard.


    # file


    A Linux command that allows you to view the type of any specific file.


    # Filesystem Hierarchy Standard (FHS)


    The standard way to store files on different directories on Linux, Unix, and related
    operating systems.


    # File Transfer Protocol (FTP)


    A protocol used to transfer files between two computers in a TCP/IP network.


    # find


    A command that allows you to search through different directories for a specific
    file.


    # fips


    See First Interactive Partition Splitter.


    # firewall


    A computer between your network and another network such as the Internet. A firewall
    is designed to protect a network from the ravages of crackers who might try to
    break into your network.


    # First Interactive Partition Splitter (fips)


    The Linux utility that you run in MS-DOS to divide active partitions without deleting
    data.


    # free software


    Any software that is distributed without a charge. GPL and open source software
    is free software in accordance with the limits as stated in the respective licenses.
    GPL and open source software is a subset of free software; in other words, not
    all free software is governed by the GPL or OSI.


    # Free Software Foundation (FSF)


    The Free Software Foundation (FSF) is the group behind the GNU components of Linux.
    According to its Web site, the FSF is "dedicated to eliminating restrictions on
    copying, redistribution, understanding, and modification of computer programs."
    Because FSF''s work makes up most of the Linux operating system, it is referred
    to as GNU/Linux.


    # FTP


    See File Transfer Protocol.


    # fully qualified domain name


    A name that uniquely identifies a computer, consisting of its hostname and the
    domain name of the associated network. For example, if your computer''s host-name
    is linux and the domain name of your network is mommabears.com, your fully qualified
    domain name is linux.mommabears.com. Names such as www.examcram.com are also fully
    qualified domain names; www'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'represents the host, which might be an Apache server.


    # FVWM


    An older window manager with pop-up windows. FVWM and derivatives like FVWM2 and
    FVWM95 are designed to use less memory than other window managers.


    # gateway


    The name given to a computer or device that transfers messages between networks.
    To reach other networks, you need to configure your computer with the IP address
    of your gateway, which is also known as the gateway address.


    # gateway address


    The IP address of a computer on a LAN that is also directly connected to another
    network.


    # General Public License (GPL)


    A copyright for free software, which requires a release with source code and prevents
    others from modifying or re-releasing the software under any license other than
    the GPL. Also known as copyleft.


    # getty


    Another name for a console or a login port.


    # GIMP


    GNU Image Manipulation Program. GIMP is an "all-in-one" image editor similar to
    JASC''s Paint Shop Pro.


    # GNOME


    GNU Network Object Model Environment. A complete window manager that includes
    everything from login screens to office applications.


    # GNOME Office


    The office suite associated with the GNOME desktop.


    # GNU


    GNU''s Not Unix. Symbolizes the work of the FSF for programs and applications
    that clone the functionality of Unix.


    # graphical user interface (GUI)


    An interface that uses the graphical capabilities of your computer and monitor
    to create a visual interface for your programs.


    # graphics mode


    The graphical resolution that you set on your video card for display on your monitor.


    # grep


    A command to search through a file for a text string. Outputs any matching line.


    # groff


    The GNU troff utility. This is the GNU clone of troff, which is a system for typesetting
    documents by embedding commands in text files.


    # group


    Every user in Linux belongs to one or more groups. You can assign common permissions
    on a file or directory to the members of a specific group.


    # GUI


    See Graphical User Interface.


    # gunzip


    A command that uncompresses a compressed file.'
