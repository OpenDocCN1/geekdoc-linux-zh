- pgno: 212
  md: 'The Cards database file for xf86config is located in the /usr/X11R6/lib/X11
    directory. The Monitor database file is usually located in this directory or in
    a subdirectory. If you''re having trouble finding either of these files (the locations
    will vary), use the locate or find command.


    # XF86Setup


    Almost all video cards can be set up with a minimal video server. The XF86Setup
    utility uses a 16-color VGA server known as XF86_VGA16 to create a GUI. This command
    works even if you only have a command-line interface. As you can see in Figure
    10.2, there are six sections to this utility: Mouse, Keyboard, Card, Monitor,
    Modeslection, and Other.


    If your mouse isn''t working, you can use the Tab key to switch between available
    options. Once your option is highlighted, press the Spacebar to select the option
    that you want.


    Once you''ve finished your reconfiguration, click the Done button at the bottom
    of the screen. As you navigate through the available screens, the Done and Abort
    options can be selected at any time. After you click Done and confirm your changes,
    XF86Setup overwrites the /etc/X11/XF86Config file.


    *Note: The version of XF86Setup discussed in this section is based on version
    3.3. Although later versions of this utility are available, they were released
    after the Sair Linux exams were originally created.*


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_212_0.png)


    Figure 10.2 The XF86Setup utility.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Mouse


    As shown in Figure 10.3, you can customize your mouse in any number of ways. But
    the key objective is to get a working mouse. All other items shown in Figure 10.3
    that are not described in the following list are less important. To get a working
    mouse, choose from the following options:


    +   - **Protocol**—The protocol you choose selects a driver, which determines
    how your computer communicates with your mouse.

    +   - **Device**—The mouse device is based on how your mouse is connected to your
    computer. Although a PS/2 mouse is set up for the /dev/psaux device, a serial
    mouse is generally attached to a COM port. If you don''t see an option for COM
    ports, you should see something like /dev/ttyS0 or /dev/cua0, which corresponds
    to COM1 (/dev/ttyS1 or /dev/cua1 corresponds to COM2, etc.).

    +   - **3 Buttons**—If you only have a two-button mouse, you''ll want to emulate
    three buttons. The middle button is used for a number of Linux GUI pop-up menus
    including copy and paste operations.


    *Note: You can''t configure special devices, such as joysticks and graphic tablets,
    with XFree86Setup. If you want to use one of these devices in a Linux GUI, you''ll
    need to add its settings directly to the /etc/X11/XF86Config.file.*


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_213_0.png)


    Figure 10.3 XF86Setup mouse configuration options.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Keyboard


    If you''re working with a keyboard that isn''t standard in the United States,
    you can use the options in this section to select a keyboard model and language
    that more closely match your hardware. These options also allow you to manage
    the functionality of some keys.


    # Card


    The X Server is located on the client computer. It communicates directly with
    your video controller. As you can see in Figure 10.4, there are a wide variety
    of cards to choose from.


    Even if your card is part of this list, XF86Setup may not recognize all of the
    features of your card. If you click Detailed Setup, you''ll see options in the
    menu that allow you to set the RAM, chipset, clock setting, and video server associated
    with your video controller card. You can even use this section to set up a generic
    card.


    # Monitor


    You can select from 10 different types of monitors through the Monitor section
    of the XF86Setup utility. Each monitor that you select has a different available
    range of horizontal and vertical frequencies. Check the documentation for your
    monitor. If you select frequencies that exceed the capabilities of your monitor,
    you could damage it beyond repair.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_214_0.png)


    Figure 10.4 XF86Setup video controller card configuration options.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Modeselection


    You can select two types of modes: pixel dimensions and color depth. The XF86Setup
    utility allows you to select pixel dimensions from 320×200 to 1600×1200. It allows
    you to select color depth in bits: 8, 16, 24, or 32.


    > If you select more than one graphics mode, you can switch between these modes
    using the Ctrl+Alt+Num+ and Ctrl+Alt+Num- commands. Num+ and Num- are the plus
    and minus keys on the numeric keypad. Using this method assumes the Allow Video
    Mode Switching option is enabled as described in the next section.


    # Other


    The two key options in this section are Allow Server To Be Killed With Hotkey
    Sequence Ctrl+Alt+Backspace and Allow Video Mode Switching. The first option allows
    you to exit the X Server by pressing the noted keys. That option returns you to
    the command-line interface or an X login window, depending on the level set as
    initdefault in your /etc/inittab configuration file.


    # Xconfigurator


    Red Hat Linux has its own set of graphical configuration utilities including Xconfigurator,
    mouseconfig, and kbdconfig. Although they''re released under the General Public
    License (GPL), they are generally available only on Red Hat and derived distributions.


    You can configure the X Window, or X11, with Xconfigurator nearly as well as with
    XF86Setup. If your mouse doesn''t work, you can use the Tab, Arrow, Page Up, Page
    Down, and Spacebar keys to navigate Xconfigurator''s menus. The database of video
    controllers and monitors is somewhat limited: You can set up a custom monitor
    with the same criteria as used on other utilities.


    > Don''t exceed the horizontal or vertical refresh capabilities of your monitor.
    When prompted, don''t probe your video controller. Select the amount of memory
    available on your video card from the available menu. Also don''t select a clock
    chip; the X Server can set this when you start the X Window.


    # SaX


    S.u.S.E. has its own graphical configuration utility known as SaX. You can start
    it from a command-line interface or one of the S.u.S.E. menus. SaX is divided
    into five sections: mouse, keyboard, card, monitor, and desktop. SaX is almost
    as complete as the X86Setup utility.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Window Managers


    Window managers determine what you see in a GUI desktop. As strange as it sounds,
    a window manager is also an application. Linux window managers don''t interface
    directly with the kernel; you can shut down any window manager without shutting
    down Linux.


    The following sections provide a brief overview of seven different window managers.
    There are several dozen window managers that you can configure and install on
    your Linux computer. If you''re familiar with Linux, you''ve probably heard about
    at least two of these window managers: GNOME and KDE.


    Linux window managers can be divided into three categories. The first window managers,
    such as fvw m, include a minimum of frills, which keeps them simple. They demand
    little in resources. A second group emphasizes customizability; these window managers
    include Enlightenment, Afterstep, Window Maker, and Blackbox. The third group''s
    window managers, which include GNOME and KDE, contain their own login screens,
    applications, icons, menu bars, and so on for a complete desktop package.


    # GNOME


    GNOME is a complete desktop package, which includes utilities such as a package
    manager, pop-up menus, and other utilities. GNOME applications include an office
    suite, financial programs, and more. It is based on the GTK+ widget library, which
    is released under the GPL. As of this writing, GNOME is the default window manager
    for Red Hat Linux.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_216_0.png)


    > GNOME also includes a display manager, used in place of xdm, to manage logins.
    You can set up the GNOME display manager to log in to a window manager other than
    GNOME.


    # KDE


    Like GNOME, KDE is a complete package, which includes utilities such as a control
    panel, package manager, taskbar with icons, and pop-up menus. KDE applications
    include an office suite, a package manager, and a mail reader. KDE is based on
    the Qt widget library, which was recently relicensed under the GPL. It is perhaps
    the window manager that most closely resembles Microsoft Windows in its look and
    feel. As of this writing, KDE is the default window manager for Corel, S.u.S.E.,
    and Caldera Linux.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_217_0.png)


    KDE also includes a display manager, used in place of xdm, to manage logins. You
    can set up the KDE display manager to log in to a window manager other than KDE.


    # fvwm


    The fvwm window manager was the standard before the development of KDE and GNOME.
    Because it requires a relatively small amount of memory, it was popular in an
    age when memory was more expensive. Most of its options are contained in the pop-up
    menus. Version 2 of fvwm updated the look and feel of this GUI. A later version
    known as fvwm95 was designed to look something like Microsoft Windows 95.


    # Enlightenment


    As of this writing, the Enlightenment window manager is a work in progress. Other
    window managers borrow code from each other, whereas Enlightenment is unique.
    It''s designed to be the most configurable of window managers, which makes it
    more suitable for users who aren''t satisfied with any other window manager. It
    is usually installed on higher-end workstations for users who need the power,
    not for their window manager, but for their graphical applications.


    # AfterStep


    Although the AfterStep window manager is based on fvwm code, it is designed to
    look like the GUI for the NeXTStep operating system. Originally designed for the
    NeXT workstation, NeXTStep was designed to be a more intuitive GUI. NeXT was developed
    by Apple engineers who wanted to extend the user friendliness of the Macintosh
    operating system.


    AfterStep includes a “wharf” of icons, which allows you to launch programs seemingly
    like a pictorial version of the Microsoft Windows Start menu.


    # WindowMaker


    The WindowMaker window manager is similar in feel to AfterStep. As an official
    part of the GNU project, its developers are currently incorporating GNOME features
    into its GUI.


    # Blackbox


    The Blackbox window manager is designed to run in a minimum of RAM. Images are
    cached after they''re drawn on your screen. Unlike many of the other'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'window managers, Blackbox includes support for KDE, but not for GNOME applications.


    # Window Manager Commonalities


    There are a wide variety of Linux window managers. As discussed in the previous
    sections, each window manager has a number of special features. Even though this
    chapter does not review all available Linux window managers, all window managers
    share some commonalities. They have virtual displays. You can copy and paste text
    between different windows. In addition, within individual X Windows, you can scroll
    up and down a file, resize the window, or change the size of the font.


    Several window managers make it possible to incorporate features and applications
    from the GNOME and KDE packages.


    # Virtual Displays


    With most GUIs, what you see on the monitor is all the display room that you get.
    To get more room in other GUIs, you need another monitor. With the Linux X Window,
    most window managers actually include several virtual displays. You can switch
    between displays by clicking on a pager, which moves you from one virtual display
    to another.


    An example of a virtual display pager is shown in Figure 10.5 on the right. The
    numbers 1, 2, 3, and 4 signify the virtual displays available in this window manager.


    # Hidden Windows


    If you can''t find a window that''s open or you think your system is "locked,"
    there are a couple of things that you can try before you close your X Window.
    Your window may only be hidden; pressing the Alt+Tab keys toggles you between
    available windows. Your window may be in another virtual display; try clicking
    the other pages of the virtual display pager.


    # Copy and Paste


    As of this writing, Linux window managers don''t include a regular clipboard that
    allows you to copy and paste between applications. But you can copy text


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_218_0.png)


    Figure 10.5 Window manager taskbars often include pagers.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'between two applications in the X Window. This assumes that you have a three-button
    mouse or have set up three-button emulation with a tool like XF86Setup. Use the
    following steps to copy text between two applications:


    +   1. Highlight the text that you want to copy.

    +   2. Move the cursor to the destination window.

    +   3. Click the middle mouse button. If you have only two mouse buttons, and
    you have set up three-button emulation, click both buttons simultaneously.'
