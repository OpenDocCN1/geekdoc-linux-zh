- pgno: 225
  md: '# Question 10


    You have a very capable video controller and monitor. You''ve used the XF86Setup
    utility to configure several graphics modes. Which keys do you press to switch
    between graphics modes?


    +   - a. Ctrl+Alt+Backspace

    +   - b. Ctrl+Alt++

    +   - c. Ctrl+Alt+Num+

