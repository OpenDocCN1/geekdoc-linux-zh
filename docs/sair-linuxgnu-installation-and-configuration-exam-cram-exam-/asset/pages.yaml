- pgno: 28
  md: '# Self-Assessment


    I included a Self-Assessment in this Exam Cram book to help you evaluate your
    readiness to tackle Linux Certified Administrator (LCA) or Linux Certified Professional
    (LCP) certification. This Self-Assessment should also help you understand what
    you need to master the topic of this book—namely, Sair Linux/GNU Installation
    and Configuration Level 1 certification exam 3X0-101. But before you tackle this
    Self-Assessment, let''s talk about concerns you may face when pursuing an LCA
    or LCP and about what an ideal LCA candidate might look like.


    # LCAs in the Real World


    In the next section, I describe an ideal LCA candidate, knowing full well that
    only a few real candidates will meet this ideal. In fact, my description of that
    ideal candidate might seem downright scary. But take heart; although the requirements
    to obtain an LCA might seem formidable, they are by no means impossible to meet.
    However, you should be keenly aware that getting through the process takes time,
    requires some expense, and consumes substantial effort.


    Introduced in the fall of 1999, the LCA program is very young. Demand for this
    certification is growing, and the limited seating for the testing makes the LCA
    even more valuable. However, if you''re willing to tackle the process seriously
    and do what it takes to obtain the necessary experience and knowledge, you can
    take—and pass—all the certification tests involved in obtaining an LCA. In fact,
    Coriolis has designed its Exam Cram s and companion Exam Prep s to make it as
    easy for you as possible to prepare for certification exams. We''ve also greatly
    expanded our Web site, www.examcram.com, to provide a host of resources for various
    certifications.


    # The Ideal LCA Candidate


    Just to give you some idea of what an ideal LCA candidate is like, following are
    some relevant statistics about the background and experience such an individual
    might have. Don''t worry if you don''t meet these qualifications—this is a far
    from ideal world, and where you fall short is simply where you''ll have more work
    to do.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - Academic or professional training in network theory, concepts, and operations.
    This training includes everything from networking hardware and software to the
    Linux operating system, services, and applications.

    +   - Two or more years of professional networking experience, including experience
    with Ethernet, modems, and other networking media. This experience must include
    installation, configuration, upgrading, and troubleshooting.

    +   - Two or more years in a networked environment with hands-on experience with
    four of the following Linux distributions: Caldera, Corel, Debian, Mandrake, Red
    Hat, S.u.S.E., Stampede, Slackware, Storm Linux, or TurboLinux. A solid understanding
    of each system''s architecture, installation, configuration, maintenance, and
    troubleshooting is also essential.

    +   - Familiarity with key Linux-based TCP/IP-based services, including HTTP (Web
    servers), DHCP, and DNS, plus familiarity with one or more of the following: FTP,
    Samba, Squid, NFS, iptables, or ipchains.


    # Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much work you must do to pursue Sair Linux/GNU certification and what
    kinds of resources you might consult on your quest. Be absolutely honest in your
    answers, or you''ll end up wasting money on exams you''re not yet ready to take.
    There are no right or wrong answers, only steps along the path to certification.
    Only you can decide where you really belong in the broad spectrum of aspiring
    candidates.


    Two things should be clear from the outset, however:


    +   - Even a modest background in computer science will be helpful.

    +   - Hands-on experience with Linux, Linux products, and Linux technologies is
    an essential ingredient to certification success.


    # Educational Background


    +   1. Have you ever taken any computer-related classes? [Yes or No] If Yes, proceed
    to question 2; if No, proceed to question 4.

    +   2. Have you taken any classes on Unix operating systems? [Yes or No] If Yes,
    you''ll probably be able to handle discussions on commands, architecture, and
    system components. If you''re rusty, brush up on basic Unix concepts, especially
    virtual memory, multitasking regimes, user mode versus superuser mode operation,
    filesystems, and general computer security topics.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'If No, consider some basic reading in this area. I strongly recommend a good
    general book on Unix, such as *Unix Made Easy*, by John Muster (Osborne/McGraw-Hill,
    1996, ISBN 0-07882-173-8). If this title doesn''t appeal to you, check out reviews
    of other, similar titles at your favorite online bookstore.


    # 3. Have you taken any TCP/IP-based networking concepts or technologies classes?
    [Yes or No]


    If Yes, you''ll probably be able to handle Linux''s networking terminology, concepts,
    and technologies (brace yourself for frequent departures from normal usage). If
    you''re rusty, brush up on basic networking concepts and terminology, especially
    networking media, transmission types, the OSI reference model, and networking
    technologies such as Ethernet and WAN links.


    If No, you might want to read one or two books in this topic area. The two best
    books that I know of are *Computer Networks, 3rd Edition*, by Andrew S. Tanenbaum
    (Prentice-Hall, 1996, ISBN 0-13-34945-6), and *Linux Network Administrator''s
    Guide*, by Olaf Kirch and Terry Dawson (O''Reilly and Associates, 2000, ISBN 1-56592-400-2).


    Skip to the next section, "Hands-on Experience."


    # 4. Have you done any reading on the Linux operating system or networks? [Yes
    or No]


    If Yes, review the requirements stated in the first paragraphs after questions
    2 and 3. If you meet those requirements, move on to the next section.


    If No, consult the recommended reading for both topics. A strong background will
    help you prepare for the Sair Linux/GNU exams better than just about anything
    else.


    # Hands-on Experience


    The most important key to success on all types of certification exams is hands-on
    experience. If I leave you with only one realization after you take this Self-Assessment,
    it should be that there''s no substitute for time spent installing, configuring,
    and using Linux and its components, upon which you''ll be tested repeatedly and
    in depth.


    5. Have you installed, configured, and worked with:


    +   ► At least one Linux distribution? [Yes or No]

    +   ► Four or more Linux distributions? [Yes or No]


    If Yes, make sure you understand the different methods used to configure, install,
    and work with different Linux distributions.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'If No, you''ll want to obtain a copy of at least four different Linux distributions
    and learn how to install, configure, and maintain them. If you don''t have the
    facilities to download these distributions onto CD-ROMs, you can purchase them
    inexpensively from Linux e-tailers such as www.cheapbytes.com or www.linuxmall.com.
    You can use this book to guide your activities and studies.


    6. For any specific Linux product that is not itself an operating system (for
    example, the X Window System or Apache), have you installed, configured, used,
    and upgraded this software? [Yes or No]


    If the answer is Yes, skip to the next section. If it''s No, you must get some
    experience. Read on for suggestions on how to do this.


    With various Sair Linux/GNU exams, experience is a must, be it something as simple
    as installing a game from an RPM or as challenging as NFS or Apache.


    Before you even think about taking any exam, make sure you''ve spent enough time
    with the related software to understand how it can be installed and configured,
    how to maintain such an installation, and how to troubleshoot that software when
    things go wrong. This will help you in the exam as well as in real life.


    # Testing Your Exam-Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use written materials to study on your own, some preparation for the Sair Linux/GNU
    Certified Administrator exam is essential. You want to do everything you can to
    pass the exam on your first try. That''s where the importance of studying comes
    in.


    For any given subject, consider taking a class if you''ve tackled self-study materials,
    taken the test, and failed anyway. The opportunity to interact with an instructor
    and fellow students can make all the difference in the world if you can afford
    that privilege. For information about Sair Linux/GNU classes, visit their Accredited
    Centers of Education (ACE) Web site at ace.linuxcertification.com.


    # Onward, through the Fog!


    After you''ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, and reviewed the many sources of information to help you
    prepare for a test, you''ll be ready to take a round of practice tests. When your
    scores come back high enough to get you through the exam, you''re ready to go
    after the real thing. If you follow this assessment regime, you''ll know not only
    what you need to study but also when you''re ready to make a test date. Good luck!'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Sair Linux/GNU Certification Exams


    # Terms you''ll need to understand:


    +   - Radio button

    +   - Checkbox

    +   - Multiple-choice question formats

    +   - Careful reading

    +   - Process of elimination


    # Techniques you''ll need to master:


    +   - Preparing to take a certification exam

    +   - Practicing (to make perfect)

    +   - Making the best use of the testing software

    +   - Budgeting your time

    +   - Saving the hardest questions until last

    +   - Guessing (as a last resort)


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_32_0.png)'
