- pgno: 191
  md: 'In this chapter, you learn about configuring printers on Linux. A number of
    distributions have their own graphical printer configuration utilities that manage
    the printer configuration file, known as /etc/printcap. There are several Linux
    commands associated with the Linux line printer daemon (lpd). Some printers need
    data translated through a print filter. Once you learn these basics, you''ll be
    able to deconstruct the components of the /etc/printcap file.


    # Printer Configuration Utilities


    As mentioned previously, several Linux distributions include their own graphical
    printer configuration utility. Some examples include Red Hat Linux''s printtool,
    Caldera''s COAS, S.u.S.E.''s YaST2, and Corel''s Control Center. Each of these
    utilities prompts you for parameters for the /etc/printcap file, which determines
    how Linux communicates with your printer. Although you''re not tested on distribution-specific
    printer utilities, these tools can help familiarize you with the parameters in
    the /etc/printcap file. Figure 9.1 shows Red Hat''s printtool utility, and Figure
    9.2 shows the printer menu of the Caldera COAS utility.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_191_0.png)


    Figure 9.1 Red Hat Linux printtool utility.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_191_1.png)


    Figure 9.2 Caldera Linux COAS printer configuration utility.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# The lp Commands


    Once you''ve set up one or more printers, you can manage them with the commands
    associated with the line printer daemon (lpd). These commands include the line
    printer request (lpr), the line printer query (lpq), the line printer remove (lprm),
    and the line printer control program (lpc).


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_192_0.png)


    > The line printer daemon (lpd) is normally started when you boot Linux. Once
    you start a print job, the lpd looks for these jobs in your print spool directory,
    and then sends them to your printer.


    # lpr


    When you use the cat command on a file, the shell sends the result to standard
    output (stdout), which normally means that you see the result on your screen.
    In contrast, when you use lpr, the shell sends the result to a spool file on the
    local computer, then on to a print server computer, and finally to the printer.
    The lpr is a client. When it produces a spool file, the result is processed by
    a server, the lpd. The lpd print server can be local or remote on a network. So
    when you run the following command, your shell sends the result to the default
    printer as defined in /etc/printcap:


    ```

    lpr file1

    ```


    You can send this print job to another printer with the following command:


    ```

    lpr -P colorprinter file1

    ```


    Assuming you have a printer named colorprinter in your /etc/printcap file, this
    command sends the job to that printer instead. Other important switches for the
    lpr command are shown in Table 9.1.


    Table 9.1 lpr commands.


    | Command | Result |

    |---|---|

    | lpr -h file1 | Prints file1 without a job control page, which normally contains
    the user account and host name of the source computer. The job control page is
    also known as the burst page. |

    | lpr -P other file1 | Prints file1 to the printer named other, as defined in
    the /etc/printcap file. |

    | lpr -s file1 | Creates a symbolic link to file1, which avoids creating a spool
    file. This was required for larger (>1MB) files on the Berkeley Standard Distribution
    version of lpr. Current Linux distributions use the LPRng program, which makes
    this unnecessary. |'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# lpq


    The line printer query (lpq) command gives you the current print queue. Examples
    of this command are shown in Table 9.2. This command also includes a list of job
    numbers, which you might need for the lprm command.


    # lprm


    If a print job isn''t already in your printer''s memory, the line printer remove
    (lprm) command can delete print jobs currently in your queue. With lprm, you can
    remove a print job in one of three ways: by print job number, by user, or by printer.
    Examples of this command are shown in Table 9.3.


    Users can use lprm to remove their own print jobs. The root or superuser can use
    this command to remove anyone''s print job.


    # lpc


    The line printer control (lpc) command allows you to control a number of characteristics
    of each printer. As shown in Table 9.4, this command lets you check printer status,
    kill active print jobs, or even redirect jobs to a different printer.


    # Printer Languages


    When you want to print a file, Linux translates the file into a format that your
    printer can use. Printers have their own fonts embedded in their memory. If you''re
    just printing text, Linux can send ASCII codes to your printer, which are translated
    into your printer''s fonts. This is commonly known as text-mode printing.


    Table 9.2 lpq commands.


    | Command | Result |

    |---|---|

    | lpq | Returns the current print queue for the default printer, as defined in
    your /etc/printcap file. |

    | lpq -P print1 | Returns the print queue for the print1 printer. Substitute a
    printer name based on the name shown in your /etc/printcap file. |


    Table 9.3 lprm commands.


    | Command | Result |

    |---|---|

    | lprm 188 | Removes print job 188, as defined in the output to the lpq command.
    |

    | lprm -P hp2 mj | Removes print jobs of user mj from the printer labeled hp2
    in your /etc/printcap file. |'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Table 9.4 lpc commands.


    | Command | Result |

    |---|---|

    | `lpc -P canon1 status` | Displays the status of the printer named canon1. In
    other words, the output tells you whether you can send print jobs to a queue,
    the number of jobs in the queue, whether the printer will accept jobs, and communication
    status with the printer. |

    | `lpc disable` | Disables sending jobs (spooling) to a print queue for the default
    printer. Opposite of `lpc enable`. |

    | `lpc stop` | Stops communication between the print queue and your printer. The
    `lpc start` command restarts transfers from the print queue. |


    On the other hand, if you''re printing graphics, you probably don''t want to use
    your printer''s fonts. Your printer needs instructions on what to do with every
    dot or pixel. Linux has print filters to translate the file into standard printer
    graphic formats, such as PostScript or PCL (Printer Control Language).


    # Text versus Graphic


    The only true text documents are those that are printed with your printer''s fonts.
    If you print a file from an editor like vi or emacs, without using any typesetting
    commands, you''re printing a text document. Text documents require the least amount
    of data be sent to your printer; all that is needed is one ASCII bit per letter,
    instead of dozens or hundreds of bits for the dots that create each letter.


    Documents that use markup languages, such as TeX and HTML, are written in text.
    They use commands to convert different lines of text to different fonts. These
    fonts are then translated, pixel-by-pixel, to your printer.


    Just about all other documents printed today require a graphical interface. Documents
    that use the WYSIWYG (what you see is what you get) system are completely graphical;
    every letter is converted, pixel-by-pixel, on your screen and then sent to the
    printer.


    But neither markup languages nor WYSIWYG graphics correspond to actual printer
    languages. You still need filters to convert graphic formats to a format that
    a printer can use. It is the converted file that is stored in your spool directory.


    *Note: Some printers convert WYSIWYG graphics after they receive print jobs. If
    you have one of these types of printers, be sure to set rp=raw in the /etc/printcap
    file, as explained later in this chapter.*'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Filters


    Filters translate what you want to print from your applications and editors to
    the various languages that a printer can understand. The two major printer graphic
    languages are Hewlett Packard''s PCL and Adobe''s PostScript. These languages
    fall into different categories; some applications use PostScript to translate
    your files to PCL. There are three major types of graphic filters that work with
    these languages: nenscript, ghostscript, and magic. You need to set up the filter
    that you''ll use in your /etc/printcap file.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_195_0.png)


    > Most Linux applications work with PostScript files. Linux drivers for PostScript
    printers are more common as a result.


    Nenscript is a GNU clone of the commercially available enscript printer filter.
    Like its GNU cousin, a2ps, it converts text into PostScript format. Both nenscript
    and a2ps are more flexible than other PostScript filters because they allow you
    to print two pages of text on a single sheet.


    Ghostscript is a PostScript interpreter, which allows Linux to display PostScript
    files in graphical user interfaces, as well as a translator, which sends PostScript
    data to many printers.


    Magic filters aren''t really filters at all. They are scripts that automatically
    detect the type of data inside a file, and then call up the appropriate filter
    to convert the data for your printer. In a way, this works like the file command
    from Chapter 8. Magic filters convert from modes like DVI or PostScript to Hewlett
    Packard''s PCL.


    Note: DVI files are the processed data from LaTeX or TeX input files.


    There is also one major filter, known as lpf. This is a filter for text files.
    The lpf filter reformats ASCII text to avoid "stair-stepping," when printers add
    an extra line after every word.


    # Spool Directories


    Print spools are generally located in the /var/spool/lpd directory. Each job gets
    its own file. On older Linux systems that use the BSD (Berkeley Standard Distribution)
    version of the line printer daemon, Linux can''t handle spool files larger than
    1MB, which is the reason for the lpr -s command. If you have trouble managing
    your spool with commands like lprm and lpc, you may be able to kill print jobs
    directly by deleting files in your spool directory.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Print spools, like log files, are normally stored in the /var directory or
    one of its subdirectories.


    # The /etc/printcap File


    All of the settings for different printers are stored in the /etc/printcap file.
    In this section, you''ll analyze a typical /etc/printcap file, with a view towards
    making it work for you. An example of the /etc/printcap file from the Corel Linux
    distribution is shown in Figure 9.3.


    This file can be rather confusing at first glance, so let''s start by reviewing
    some of the codes available for this file. You''ll then be able to interpret this
    file or the one currently in your Linux distribution.


    # /etc/printcap codes


    The codes in the /etc/printcap file can be divided into the following categories:
    printer names, filters, spools, log files, and special printer codes. There is
    also a format for separate entries in this file. For example, the first section
    shown in Figure 9.3 may be shown as three long code lines:


    ```

    lp|Generic dot-matrix printer entry:lp:/dev/lp0:\nsd=/var/spool/lpd/lp:af=/var/log/lp-acct:\nl
    f=/var/log/lp-errs:pl#66:pw#80:pc#150:mx#0:sh

    ```


    ```

    # /etc/printcap: printer capability database. See printcap(5).

    # You can use the filter entries df, tf, cf, gf etc. for

    # your own filters. See /etc/filter.ps, /etc/filter.pcl and

    # the printcap(5) manual page for further details.


    lp|Generic dot-matrix printer entry\

    :lp=/dev/lp0\

    :sd=/var/spool/lpd/lp\

    :af=/var/log/lp-acct\

    :lf=/var/log/lp-errs\

    :pl#66\

    :pw#80\

    :pc#150\

    :mx#0\

    :sh\


    # rlp|Remote printer entry\

    # :lp=\

    # :rm=remotehost\

    # :rp=remoteprinter\

    # :sd=/var/spool/lpd/remote\

    # :mx#0\

    # :sh

    ```


    Figure 9.3 A typical /etc/printcap printer configuration file.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Unfortunately, this type of code management can make life more difficult for
    all but the most knowledgeable of Linux administrators. The way you set up and
    present code in this file or any other program helps communicate your intent to
    other administrators. There are three punctuation marks that help you manage /etc/printcap
    code.


    +   - **Colon (:)**—Colons divide code lines. If you see a colon, even inside
    a line, it starts a new command.

    +   - **Backslash (\ )**—If a line ends with a backslash, it means that the code
    continues onto the next line. Recall from Chapter 7 that backslash tells the shell
    to ignore characters like empty spaces, carriage returns, and so on.

    +   - **Pipe (|)**—Lines after a pipe in the /etc/printcap file are comments.
    As you can see, the ones shown in the preceding code lines and in the figure describe
    some type of printer. But these comments are significant because you can use them
    to specify a particular printer.


    > Note: The first line in a /etc/printcap paragraph usually defines a printer.
    You can see that the line shown previously starts with lp, which is the code for
    the default printer.


    Printer names are based on the drivers installed and available in your /dev/ directory.
    Typical printer names include lp, lp1, lp2, sp1, and lf1.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_197_0.png)


    > The default printer has the lp label in the /etc/printcap file. If there is
    no printer with this label, the first printer in this file becomes the default.


    The print filters discussed earlier can be assigned as input filters (if) or output
    filters (of). If you have multiple print jobs on a single printer, only the input
    filter is used on every print job. The output filter is applied only to the first
    of a series of print jobs.


    The spool directory (sd) is where the filtered print jobs are stored before they''re
    sent to the printer. Linux needs a place to store these print jobs because printers
    aren''t always available. For example, your printer could be disconnected or busy
    with another print job. Also, it can take time for Linux to contact printers on
    remote computers.


    When you print, Linux can keep track of print costs and print errors. The log
    files dedicated to these functions are the accounting filter (af) and the line
    filter (lf). The accounting filter is self-explanatory. The line filter collects
    errors.


    There are also a number of other codes. Some of the more important codes are documented
    in Table 9.5.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Table 9.5 Special codes for the /etc/printcap file.


    | Code | Function |

    |------|----------|

    | rm | Remote machine: Set this equal to the hostname or IP address of the remote
    print server (for example, the rm=192.168.0.66 command tells the line printer
    daemon [lpd] that your remote printer''s IP address is 192.168.0.66). |

    | rp | Remote printer: If you''re printing a PostScript file and your printer
    cannot detect this type of file, set this value equal to raw (rp=raw). |

    | mx | Maximum file size: Helps you work with the older BSD line printer daemon
    (lpd). If you do not want a maximum file size, set this value to 0 (mx=0). |

    | pw | Page width, in characters: The standard page width on U.S. letter size
    paper is 80 (pw#80). |

    | pl | Page length, in number of lines: The standard page length on U.S. letter
    size paper is 66 (pl#66). |

    | sh | Suppress header: When you see this command, your printer won''t print a
    page with the job and user name. |


    *Note: Much more information on the syntax inside the /etc/printcap file is available
    on its man page.*


    # A Typical /etc/printcap File


    Once you know the basic syntax, you can read most typical /etc/printcap files.
    Return to Figure 9.3. You know that lp is the name of the default printer, and
    its device is located in the device file /dev/lp0. Files that you send to this
    printer are first spooled in the directory defined by sd, which is /var/spool/lpd/lp:.


    In a similar vein, the output from the accounting filter is stored in the /var/log/lp-acct
    file. Errors are taken by the line filter and sent to the /var/log/lp-errs file.
    The page length (pl) is 66 lines. The page width (pw) is 80 characters. The price
    code (pc) is 1.5 cents per page. There is no limit on the size of the printer
    spool file (mx#0). The suppress header (sh) command keeps the printer from printing
    a page with your user name and print job number.


    You''ll look at other examples in the practice questions.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Practice Questions


    # Question 1


    Which of the following commands is normally used when you start or reboot Linux?


    +   - a. lpr

    +   - b. lpd

    +   - c. lprm

    +   - d. lpc


    Answer b is correct. The line printer daemon (lpd) is automatically started at
    one or more of your run levels, depending on your Linux distribution. Because
    the lpr (line print request) command prints files, it is not normally used when
    you start or reboot Linux. Therefore, answer a is incorrect. The lprm (line printer
    remove) command is used to remove print jobs. If you''re starting or rebooting
    Linux, you shouldn''t have any print jobs (although it is possible); therefore,
    answer c is incorrect. The lpc (line print control program) command helps you
    control current print jobs. For the same reason that lprm is incorrect, answer
    d is also incorrect.


    # Question 2


    There are several utilities related to the lpd. Which of the following statements
    most closely matches the utility with its purpose?


    +   - a. The lpd takes jobs from your applications and manages them through your
    spool directory all the way to your printer.

    +   - b. The lpq command allows you to manage the operation of the Linux print
    system.

    +   - c. The lprm command allows you to remove print jobs from your application
    directories.

    +   - d. The lpc command allows the root or superuser to manage and reprioritize
    different print jobs.


    Answer d is correct. The line printer control (lpc) command does allow a root
    or superuser to cancel or delay specific print jobs. Because the line printer
    daemon (lpd) doesn''t take jobs from your applications, answer a is incorrect.
    The line printer query (lpq) only allows you to see the print jobs currently in
    the queue, so answer b is incorrect. Although the line printer remove (lprm) command
    does'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'allow you to remove print jobs, these are stored in the print spool, which
    is separate from any application directory. Therefore, answer c is incorrect.


    # Question 3


    Which of the following is used to translate print jobs from text or graphical
    applications to a format that a printer can actually use?


    +   - a. Input translator

    +   - b. Printer filter

    +   - c. Line printer daemon

    +   - d. Stair-step manager


    Answer b is correct. Printer filters, as configured in your /etc/printcap file,
    allow your applications to send print jobs in a language that your printer can
    use. Because there is no print-related purpose for an input translator, answer
    a is incorrect. Although the line printer daemon (lpd) uses printer filters, the
    daemon itself is not a printer filter; therefore, answer c is incorrect. Although
    stair-stepping is a problem for text, it is not an issue for graphical applications.
    Therefore, answer d is incorrect.


    # Question 4


    Which of the following steps do you need to take to delete a specific print job?
    The owner of the print job is named sam, and you don''t know the print job number.
    It''s his only current print job. Others also have print jobs in progress. The
    name of the printer is hp, and it is not your default printer. Select the option
    that works in the shortest number of steps.


    +   - a. Use lpc -P to find the print job number, and then delete it by number
    with the lprm command.

    +   - b. Use lpq -a to find the print job number, and then delete it by number
    with the lprm command.

    +   - c. Use lprm -P hp sam to delete all of sam''s current print jobs.

    +   - d. Use lpc -P hp sam to delete all of sam''s current print jobs.


    Answer c is correct. The lprm command removes print jobs. The -P switch specifies
    the printer. And you can specify print jobs to remove by user. The lpc command
    helps you if you know the print job number. Because the printer isn''t specified
    in answer a, that answer is incorrect. Because there is no -a switch for the lpq
    command, answer b is incorrect. You can use the lpc command to abort'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'all current print jobs; however, there are no options to specify print jobs
    by user. Therefore, answer d is incorrect.


    # Question 5


    Based on the following entry from the /etc/printcap file, where is your printer
    filter?


    ```

    lp1|laser:lp=dev/lp2:sd=/var/spool/lpd/lp2:\

    af=/var/log/lp-acct:lf=/var/log/lp-errs:\

    if=/var/spool/lpd/lp2/manager

    ```


    +   - a. /var/spool/lpd/lp2

    +   - b. /var/log/lp-acct

    +   - c. /var/log/lp-errs

    +   - d. /var/spool/lpd/lp2/manager


    Answer d is correct. Examining the line of code, the input filter (if) signifies
    the location of your printer filter. Because the letters sd represent the spool
    directory, answer a is incorrect. The letters af represent the accounting filter,
    so answer b is incorrect. The letters lf represent the line filter, which is where
    print errors are sent, so answer c is incorrect.


    # Question 6


    You''ve brought a portable text printer from the United States to Europe and can
    only find narrow paper. You want to use the printer''s font. Assume that you want
    to set up your printer to use no more than 70 characters per line. Which of the
    following commands would help Linux manage your print jobs to accommodate the
    narrow paper?


    +   - a. of=/var/spool/lpd/lp0/pw70

    +   - b. pw#70

    +   - c. pl#70

    +   - d. pw=/var/spool/lpd/lp0/70


    Answer b is correct. This command limits the text printout to 70 characters per
    line. Because of represents the output filter and is not related to output to
    a text printer, answer a is incorrect. The letters pl represent the number of
    lines on each'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'page, so answer c is incorrect. Because pw=/var/spool/lpd/lp0/70 is in an incorrect
    format for this command, answer d is incorrect.


    # Question 7


    Based on the following entry from the /etc/printcap file, where is the remote
    printer? You are located on the nicenetwork.rgb domain.


    ```

    lp|lr2|Color Laser:rp=text:\

    rm=lr2:sd=/var/spool/lpd/lp2:\

    af=/var/log/lp-acct:\

    lf=/var/log/lp-errs:\

    ff=/var/spool/lpd/lp2/manager

    ```


    +   - a. lp.nicenetwork.rgb

    +   - b. 192.168.0.13

    +   - c. lr2.nicenetwork.rgb

    +   - d. af.nicenetwork.rgb


    Answer c is correct. The location of the remote printer is set equal to rm. Because
    lp is the print device, it is not related to the remote print location. Therefore,
    answer a is incorrect. Although 192.168.0.13 could be the IP address for lr2,
    you have no information that tells you that this is so. Therefore, answer b is
    incorrect. The letters af represent the accounting filter, and it is not related
    to the location of the remote printer. Therefore, answer d is incorrect.


    # Question 8


    Which of the following print filters converts data from several known formats
    to Hewlett Packard''s PCL?


    +   - a. PostScript

    +   - b. Nenscript

    +   - c. Lpf

    +   - d. Magic


    Answer d is correct. Magic is the only filter on this list that can detect the
    format of the input file. PostScript itself is a printer language different from
    PCL, so'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'answer a is incorrect. Because nenscript converts files to the PostScript language,
    answer b is incorrect. Because lpf is a filter for text printers, answer c is
    incorrect.


    # Question 9


    Which of the following files contains the main configuration data for how data
    is sent to your spool directory and then on to your printer?


    +   - a. /var/spool/lp/lp0

    +   - b. /etc/printcap

    +   - c. /etc/spool/lp/lp0

    +   - d. /var/printcap


    Answer b is correct. The /etc/printcap file is the main configuration file that
    contains filters, your spool directory definition, and so on. Although answer
    a is the spool directory, it does not contain filters. Therefore, answer a is
    incorrect. Because /etc/spool/lp/lp0 is not a spool directory, answer c is incorrect.
    Spool directories are kept under the /var directory. Because configuration files
    are kept under the /etc directory, answer d is incorrect.


    # Question 10


    Which of the following is graphical printer configuration utility that comes with
    every Linux distribution?


    +   - a. printtool

    +   - b. COAS

    +   - c. YaST

    +   - d. KDE Control Center

    +   - e. None of the above


    Answer e is correct. There are no graphical printer configuration utilities that
    come standard with all Linux distributions. The printtool utility comes with Red
    Hat Linux. Therefore, answer a is incorrect. The COAS utility comes with Caldera
    Linux. Therefore, answer b is incorrect. The YaST utility comes with S.u.S.E.
    Linux. Therefore, answer c is incorrect. In general, you can''t use the KDE Control
    Center to configure printers; however, a printer configuration tool is built into
    the Corel Linux version of this utility. Nevertheless, because this is not available
    with all distributions, answer d is incorrect.'
  merge: -1
  img_proc: true
