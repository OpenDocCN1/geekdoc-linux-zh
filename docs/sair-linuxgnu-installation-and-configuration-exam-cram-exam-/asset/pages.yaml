    the total RAM on your computer, not just the RAM you recently added. All of the
    information in answer a does not meet the requirements; therefore, it is incorrect.
    Answer b has the correct memory level, but is still incorrect. Answer c has the
    wrong memory level, so it is also incorrect.'
