    not enhance performance significantly. The recommended size of a swap partition
    may vary. A few years ago, you might have been satisfied with a swap partition
    equal to your installed RAM. Current practice is to set up a swap partition twice
    the size of your RAM. However, because you''re setting up a computer that already
