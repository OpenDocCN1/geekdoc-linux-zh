  md: 'directory. For example, you can type the following command to get to the scripts
    that start a number of Linux daemons:


    ```

    cd /etc/rc.d/init.d/

    ```


    The forward slash in front of the first directory makes this the absolute path.
    You can type this command from anywhere in Linux to get to this directory. Sometimes,
    you may accidentally type the command without the forward slash:


    ```

    cd etc/rc.d/init.d/

    ```


    In this case, Linux looks for these directories under your home directory. For
    example, if your home directory is /home/mj, this command makes Linux look for
    the /home/mj/etc/rc.d/init.d directory. Unless you keep a copy of these files
    deep in your home directory, Linux won''t find anything.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_90_0.png)


    > A directory listing with the first forward slash is an absolute path; without
    the first forward slash, it is a relative path.


    Linux has many directories and subdirectories. If you need to know where you are
    in the filesystem hierarchy, type the following command:


    ```

    pwd

    ```


    The pwd (present working directory) command returns your current directory.


    # Mounted Drives as Directories


    Removable drives are by definition located on different partitions. Because you
    don''t always have a floppy or a CD in their drives, Linux generally does not
    mount these drives when you start or reboot your computer. Mounted drives can
    be read-only or read/write. If you want to mount your floppy drive, put a floppy
    in the drive, and then type the following command:


    ```

    mount /dev/fd0 /mnt/floppy

    ```


    The /dev/fd0 parameter is the name of the device driver assigned to your floppy
    drive. If you have two floppy drives, you may have to use /dev/fd1. The /mnt/floppy
    parameter is the directory from where you can access files on your CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '*Note: The mount commands shown in this section are not complete. The proper
    commands are mount -t vfat /dev/fd0 /mnt/floppy and mount -t iso9660 /dev/cdrom
    /mnt/cdrom. But the extra switches are unnecessary based on settings in most /etc/fstab
    configuration files.*


    Although you can mount your floppies or CD-ROM on any available directory, a number
    of programs refer to distribution-specific directories, such as /floppy. If you
    want to mount a regular ATAPI CD-ROM, put a CD in your CD-ROM drive, and then
    type the following command:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    The purists among you may prefer to use the name of the actual CD-ROM driver.
    When you boot, you may see a message that states that hdc is assigned to your
    CD-ROM drive. In other words, you can also type the following command:


    ```

    mount /dev/hdc /mnt/cdrom

    ```


    Alternately, you can review your Linux boot messages through the dmesg command.
    When you''ve mounted your drives, you can review the result with the mount command,
    which returns the result in Figure 4.1.


    In Figure 4.1, you can see how different directories are mounted on this particular
    system. The root (/) and boot directories are mounted on Linux''s second extended
    file system (ext2) as well as a floppy drive using Microsoft''s VFAT file system,
    and a CD-ROM is mounted through the standard CD-ROM ISO9660 file system.


    You can unmount your drives with the umount command (that''s right, no n). For
    the situation shown in Figure 4.1, the following command dismounts your floppy
    drive:


    ```

    umount /mnt/floppy

    ```


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_91_0.png)


    Figure 4.1 Currently mounted drives.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'If you previously moved files to or from your floppy drive, there may be a
    delay while Linux finishes dismounting the drive.


    # Pseudofile Systems


    There are several file systems on Linux that really aren''t file systems at all.
    In other words, Linux sets up several volumes that represent items like kernel
    routines or device managers. A pseudofile system is sometimes known as a system
    abstraction.


    Typical Linux pseudofiles and file systems include the following:


    +   - /proc—Processes currently running through the kernel

    +   - /dev/xyz—Files that are names of device drivers

    +   - /dev/null—An output file that ignores output from a utility or a script


    # Alternatives to Partitioning


    Customizing volumes and partitions for Linux can be a lot of work. But it can
    help you optimize the space that you use on your hard disk.


    Alternately, you can let your Linux setup programs make the decisions for you.
    For example, several Linux distributions allow you to set up "Servers" or "Workstations"
    that use your entire hard disk for Linux. Depending on the size of your drive,
    you may end up with just a root volume and a swap disk.


    # CD-ROM and Controller


    Until the development of the ATAPI interface, CD-ROM configuration was a difficult
    matter for any operating system.


    Audio CD-ROMs were introduced prior to data CD-ROMs. As they were adapted for
    the computer, the first data CD-ROMs required another driver to send information
    through a sound card. SCSI CD-ROMs came later; they first came with special controllers.
    This section discusses these internal CD-ROM drives.


    Today, external CD-ROM drives are available for the parallel port and Universal
    Serial Bus (USB) interfaces. If you have a parallel port interface, use the parallel
    port driver. More information on parallel port interfaces should be available
    on the Linux Parallel Port Home Page at www.torque.net/parport. If you have a
    USB CD-ROM, you''ll need a Linux distribution with kernel 2.4 or later. For the
    latest information on installing USB drives and other peripherals, refer to the
    Linux USB Web site at www.linux-usb.org.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Sound Card CD-ROM Drives


    Linux administrators will inevitably need to accommodate older equipment, especially
    when companies cut costs. CD-ROM drives were originally connected to systems through
    sound cards. There are about a dozen different sound card drivers available, and
    each is associated with a specific card. Review the “CD-ROM-HOWTO” for details
    of available drivers.


    The problem with sound card based CD-ROM drivers is that many manufacturers claim
    that their cards are Sound Blaster compatible. Unfortunately, this claim is usually
    not good enough for the Linux Sound Blaster CD-ROM driver.


    As a result, finding the right sound card device for a CD-ROM is usually accomplished
    through a trial-and-error process. In other words, you can try loading a device
    driver to the kernel. If it works for your CD-ROM, you''ll be able to mount that
    device. For example, if the following command actually mounts a CD-ROM, then you
    know to add the sbpcd.o driver to your kernel:


    ```

    mount /dev/sbpcd /mnt/cdrom

    ```


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_93_0.png)


    > If you want sound and CD-ROM functionality from this kind of system, you need
    a driver that interfaces with your CD-ROM and a driver for your sound card.


    # Regular CD-ROM Drives


    Current CD-ROM drives are connected to your computer through SCSI and ATAPI interfaces.


    Working with a SCSI CD-ROM drive is similar to working with a regular partition.
    Linux should recognize most SCSI CD-ROMs when you boot your computer. Your boot
    messages or the dmesg command will indicate if the drive is recognized. Linux
    may also associate a SCSI CD-ROM drive with the /dev/cdrom device. Check the status
    of this device with the following command:


    ```

    ls -l /dev/cdrom

    ```


    You may see the following result:


    ```

    lrwxrwxrwx 1 root root 3 Dec 15 19:30 /dev/cdrom -> sdc

    ```


    If you see this result, Linux has associated the /dev/cdrom device with the sdc
    driver, which also means that you have at least two other SCSI disks or CD-ROMs
    on your computer.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Current CD-ROM drives, built to the ATAPI standard, typically work just as
    well as SCSI drives. Unfortunately, there are some older ATAPI CD-ROMs with problems,
    such as difficult manufacturer-specific drivers. If you have this problem, look
    through the “CD-ROM-HOWTO” for help.


    # A Video Controller


    A video controller is almost like an independent computer. It has a processor
    and memory, and it sends messages and data to your monitor.


    The graphic mode that you set through your video controller determines the number
    of colors and picture elements that you see on your monitor. Picture elements
    are more commonly known as pixels. You can set your graphic mode, processor type,
    and video memory in tools like XF86Setup from the XFree86 Project. The details
    are illustrated in Figure 4.2.


    As you can see near the top of Figure 4.2, there are a number of available processors,
    also known as Video Servers. Each processor corresponds to a specific type of
    card. Some cards are generic, such as Mono and SVGA. Others are associated with
    specific processors, such as ATI’s Mach64. If your card is not shown on XFree86’s
    card list, but is similar to one of the listed Video Servers, you may be able
    to configure it yourself using the options shown in Figure 4.2.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_94_0.png)


    Figure 4.2 The XF86Setup video configuration tool.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_95_0.png)


    The other major video configuration tool is the xf86config command-line tool.
    A number of distributions have their own video configuration tools. For example,
    Red Hat''s Xconfigurator and S.u.S.E.''s SaX also allow you to change the settings
    on your video card and monitor.


    # Video Memory


    Your screen resolution and number of colors you want to use depends on the video
    memory that you have available. The memory you need depends on the following equation:


    ```

    Horizontal Resolution × Vertical Resolution × Color in bits / (8 bits / byte)
    = Required Memory in bytes

    ```


    For example, if you want a 1024×768 resolution screen with 32-bit color, you need
    just over 3MB of memory:


    ```

    1024 × 768 × 32 / 8 = 3.1 MB

    ```


    In other words, you can set this graphic mode if you have a video card with 4MB
    of memory. The Linux X Window uses any leftover video memory for its other virtual
    screens.


    # Video Graphic Modes


    The graphical resolution of your screen depends on your horizontal and vertical
    pixel rows as well as the number of colors required. The graphic mode shown in
    the last section was 1024×768×32 bits.


    The graphic mode of your video card depends on your graphical resolution along
    with the refresh rate of your picture. The horizontal refresh rate is the number
    of times per second that your card sends data to each line. Horizontal refresh
    rates typically range from 31 to 80kHz and higher. The vertical refresh rate is
    the number of times your whole screen is refreshed per second. Vertical refresh
    rates typically range from 60 to 80 hertz and higher.


    If you set a high graphical resolution, you need a fast horizontal refresh rate.
    Although higher vertical refresh rates are typically easier on the eyes, the vertical
    rate that you set depends on the capabilities of your monitor and what looks best
    to you.


    # Monitor Management


    Monitors have limits. The picture you set cannot exceed the physical size of your
    screen. Also, the number of pixels you set cannot significantly exceed the number'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'of physical pixels available on the screen. Although you generally want to
    set horizontal and vertical refresh rates as high as possible, you don''t want
    to exceed the capabilities of your monitor.


    Most new monitors won''t let you exceed their capabilities. With most monitors,
    if you set rates higher than they can handle, you''ll receive a screen message
    such as "Out of Range." But with a few monitors, a refresh rate that''s too high
    can burn out the monitor. If you set the resolution too high, the refresh rate
    increases, which can also cause trouble.


    You can use the XF86Setup or xf86config tool to manage the settings on your monitor.
    If you''re using Red Hat or S.u.S.E., you can also use Xconfigurator or SaX, respectively.
    XF86Setup seems to be the preferred tool that is covered on the Sair exam.


    # Monitor Graphic Modes


    You can change the graphic modes on most monitors. In other words, you can change
    the number of pixels shown on your screen and the number of colors used for each
    pixel. Even if you thought you configured this setting with your video card, you
    have to do it again with your monitor. After all, they are separate components
    with separate drivers.


    Older monitors support only one or two graphic modes. The multisync monitors of
    today support several modes. To make sure that you keep your monitor working,
    you need to balance its capabilities against the settings you create for your
    video card.


    The graphical capability of a monitor depends on its screen size and dot pitch.
    Larger screens and smaller dot pitch sizes allow you to set up more detailed graphic
    modes on your monitor.


    If you set your graphic mode to the maximum resolution of your monitor, you may
    be disappointed. Monitors let you set graphic modes with more pixels than are
    physically available on the monitor. For example, one 14-inch monitor with a .25mm
    dot pitch has a maximum screen size of 240mmx180mm. In other words, it has 960
    horizontal dots in a row and 720 vertical dots in a column. Yet this monitor allows
    you to set a graphic mode of 1024x768 pixels. When your monitor tries to fit 1024x768
    pixels on a screen that has only 960x720 dots, some pixels don''t quite make it.
    The result is a blurry monitor.


    # Monitor Refresh Rates


    The refresh capability of a monitor depends on the technology inside. Check your
    monitor''s documentation for its allowable horizontal and vertical refresh'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'rates, and then go back to the tool that you used to configure your video card
    and monitor. Make sure that the settings for both systems do not exceed the capabilities
    of your monitor.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_97_0.png)


    > If you configure more than one graphic mode, you can normally switch between
    these modes with the Ctrl+Alt+Num+ or Ctrl+Alt+Num- keys. (This key combination
    only works with the plus and minus keys on the numeric keypad.)'
