    +   - [ ] a. IP address for your computer

    +   - [ ] b. IP address for the gateway computer

    +   - [ ] c. IP address for a DHCP server

    +   - [ ] d. IP address for a nameserver

    +   - [ ] e. IP address for all other computers on your network


    Answers a, b, and d are correct. Because your computer isn''t getting its address
