  md: '# The Coriolis Exam Cram Personal Trainer


    An exciting new category in certification training products


    The Exam Cram Personal Trainer is the first certification-specific testing product
    that completely links learning with testing to:


    +   - Increase your comprehension

    +   - Decrease the time it takes you to learn


    No system blends learning content with test questions as effectively as the Exam
    Cram Personal Trainer.


    Only the Exam Cram Personal Trainer offers this much power at this price.


    Its unique Personalized Practice Test Engine provides a real-time test environment
    and an authentic representation of what you will encounter during your actual
    certification exams.


    # Much More than Just Another CBT!


    Most current CBT learning systems offer simple review questions at the end of
    a chapter with an overall test at the end of the course, with no links back to
    the lessons. But Exam Cram Personal Trainer takes learning to a higher level.


    # Its four main components are:


    +   - The complete text of an Exam Cram study guide in HTML format

    +   - A Personalized Practice Test Engine with multiple test methods

    +   - A database of 150 questions linked directly to an Exam Cram chapter


    # Plus, additional features include:


    +   - Hint: Not sure of your answer? Click Hint and the software goes to the text
    that covers that topic.

    +   - Lesson: Still not enough detail? Click Lesson and the software goes to the
    beginning of the chapter.

    +   - Update feature: Need even more questions? Click Update to download more
    questions from the Coriolis Web site.

    +   - Notes: Create your own memory joggers.


    +   - Graphic analysis: How did you do? View your score, the required score to
    pass, and other information.

    +   - Personalized Cram Sheet: Print unique study information just for you.


