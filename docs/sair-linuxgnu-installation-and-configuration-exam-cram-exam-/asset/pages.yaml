- pgno: 83
  md: 'This chapter covers the configuration of four key hardware components: hard
    drives, CD-ROM drives, video cards, and monitors. When you manage partitions on
    your hard drive, you can set up multiple operating systems on your computer. When
    you set up separate volumes on your hard drive, you can manage the major file
    systems within Linux. Current Linux installations almost always require a CD-ROM
    drive, so you need to know the potential problems with setting up this type of
    drive. To set up Linux graphics, you need to know how to set up your video card.
    And you need to make sure that the settings you create on your video card do not
    damage your monitor.


    # Multiple Operating Systems


    It usually takes time for a Microsoft Windows user to convert to Linux. Not all
    of the programs used on Windows are immediately available on Linux. Consequently,
    it is useful to have both operating systems available during the transition period.


    The standard way to configure side-by-side operating systems is through a dual-boot.
    In a dual-boot configuration, you can select the operating system of your choice
    (Linux or Windows) when you start your computer.


    In general, Linux, Windows, and other operating systems must be set up on different
    partitions or logical drives. Once you know your options for partitioning, you
    can make room on a Windows computer to install Linux. Once you have enough room,
    there are several tools available to split partitions.


    # Hard Disk Partition Management


    Generally, you need different drive volumes to set up different operating systems
    on the same computer. With different drives, you can accommodate different file
    systems, such as Microsoft''s FAT16 and Linux''s second extended file system (ext2fs).
    You can then set up a different operating system on each volume.


    Hard drives can be divided into the following:


    +   - **Primary partition**—You can have up to four different primary partitions
    on a hard drive. One primary partition must be marked as "active" and can include
    a boot loader, such as the Linux Loader (LILO). If you mount a Linux directory
    on a primary partition, it is also known as a volume.

    +   - **Extended partition**—If four partitions are not enough, you can convert
    one of the primary partitions into an extended partition. You can then subdivide
    the extended partition into as many logical volumes or drives as you need. Because
    you can''t mount a Linux directory in an extended partition, it is not a volume.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   - **Logical drive**—You can subdivide an extended partition into as many
    logical drives as you need. Although you can''t set up a Linux directory in an
    extended partition, you can set up Linux directories on logical drives. Therefore,
    logical drives are volumes.

    +   - **Swap partition**—In Linux, it''s common to set up a swap partition as
    an exclusive area on your hard drive. You can set up a swap partition on any volume.


    A volume is any logical division on your hard drive, which includes all of the
    preceding categories except the extended partition. In Microsoft operating systems,
    you can assign a drive letter, such as C:, D:, or E:, on each volume. In the Linux
    operating system, you can mount different directories on each volume.


    When you start your computer, your Basic Input/Output System (BIOS) identifies
    the first hard disk on your system. The first area it reads on your hard disk
    is the Master Boot Record (MBR), which then identifies the primary and extended
    partitions, as well as any other volume configured on your disk. Unless you have
    a boot loader, your computer then moves on to the active primary partition to
    boot your operating system.


    If you have a boot loader in your MBR, you generally get a menu that allows you
    to choose from the various operating systems loaded on your computer.


    You can also set up partitions on two or more hard drives inside your computer.


    # Making Room on Windows


    You may already have a separate partition, empty and ready for Linux. However,
    with the variety of computers that you''ll encounter, you''ll need to know how
    to split a hard disk with just one partition that is currently dedicated to Microsoft
    Windows.


    If you want to set up a computer with Microsoft Windows and Linux, install Windows
    first. Linux installation programs are designed to accommodate Microsoft Windows.
    Linux setup programs give you the option to set up a boot loader like LILO, which
    allows you to choose from the operating systems that are available on your computer.
    On the other hand, the Windows setup program eliminates any startup reference
    to Linux by overwriting the MBR on your hard disk.


    Assume that you have a computer where the only operating system is Microsoft Windows.
    You need to do some groundwork before you can start the Linux installation process:


    +   1. Check the integrity of your disks. Before you install Linux, you want to
    isolate and mark any bad areas on your hard disk. The Windows and/or MS-DOS ScanDisk
    utilities do this job well.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "+   2. Reorganize the data on your drive. The Defrag utility, sometimes known\
    \ as the Disk Defragmenter, organizes the files on your drive into one contiguous\
    \ area at the beginning of your drive. (Defragmentation is much less of a problem\
    \ on Linux.)\n+   \n+   3. Back up your system. If something goes wrong during\
    \ the next step, you could lose all the information on your hard drive.\n+   \n\
    +   4. Split your current partition. The standard Linux partition-splitting utility\
    \ for MS-DOS is known as fips (First Interactive Partition Splitter). Third-party\
    \ partition splitters include Partition Magic (www.powerquest.com) and System\
    \ Commander (www.v-com.com). These third-party tools also include boot loaders\
    \ that take the place of LILO on the MBR.\n\nIf you don't mind backing up and\
