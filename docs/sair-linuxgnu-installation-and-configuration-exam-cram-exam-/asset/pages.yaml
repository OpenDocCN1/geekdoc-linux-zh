    to connect your computer to the network. Therefore, answer e is incorrect.


    # Question 9


    +   Where should you configure different Linux partitions during installation?

    +   - a. You should place more frequently accessed information, such as a swap
    partition, as close to the center of the hard disk as possible.

    +   - b. The position of partitions on your hard disk is fairly unimportant.

    +   - c. You should place more frequently accessed information, such as a swap
    partition, as close to the edges of the hard disk as possible.

    +   - d. You should place more frequently accessed information, such as the /root
    directory, as close to the center of the hard disk as possible.


    Answer b is correct. With the speed of current hard disks, the location of any
    specific partition is not very important. Locating the swap partition closer to
    the center of a hard disk does help; however, the gain in speed is insignificant.
    Therefore, answer a is incorrect. Putting a swap partition at the edge of the
    hard disk would slow down data transfer. Even though the difference is not significant,
    answer c is incorrect. Because logins as the root user should be rare, access
    to the root user''s home directory, /root, should be infrequent. Any /root directory
    can be far from the center of a hard disk. Even though the difference is not significant,
    answer d is incorrect.'
