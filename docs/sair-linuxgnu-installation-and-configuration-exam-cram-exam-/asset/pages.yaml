    Linux: The Official Guide*. Osborne/McGraw-Hill, Berkeley, CA, 2000. ISBN 0-07212-238-2.
    This book is the Corel endorsed guide to the WordPerfect Office 2000 suite for
    Linux.


    For more information on WordPerfect for Linux, review Corel''s Linux Web site
    at http://linux.corel.com. At this time, you can download only the word processor
    and picture editor free of charge.


    For more information on GIMP, look over its home page at www.gimp.org. GIMP is
    part of the GNU project as well as the GNOME Office suite.


    For more information on the GNOME Office suite, look over its Web site at www.gnome.org/gnome-office.
    If you choose to use GNOME Office, monitor this site frequently, because Linux
    applications like this are under constant development.


