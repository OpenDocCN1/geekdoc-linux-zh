- pgno: 82
  md: '# Hardware Configuration


    # Terms you''ll need to understand:


    +   - ✓ Partition

    +   - ✓ Volume

    +   - ✓ Swap partition/disk

    +   - ✓ Filesystem Hierarchy Standard

    +   - ✓ CD-ROM and controller

    +   - ✓ Video controller

    +   - ✓ Resolution

    +   - ✓ Graphic mode


    # Techniques you''ll need to master:


    +   - ✓ Managing partitions and volumes

    +   - ✓ Setting up a drive for multiple operating systems

    +   - ✓ Describing the Filesystem Hierarchy Standard

    +   - ✓ Setting up a drive for separate Linux volumes

    +   - ✓ Understanding different CD-ROM options

    +   - ✓ Describing configuration options available for video controllers and monitors'
