- pgno: 184
  md: '# Practice Questions


    # Question 1


    Which of the following commands deletes all of your Linux files without prompting
    you?


    +   a. rm -i * \

    +   b. rmdir -r / home/mj/tmp

    +   c. rm -rf / home/mj/tmp

    +   d. rm -v * /home/mj/tmp


    Answer c is correct. Remember to read these command options carefully! Because
    there is a space between the first forward slash (/) and home/mj/tmp, this rm
    command first removes all files and directories in your root (/) directory. The
    rm -i command prompts you before deleting files, so answer a is incorrect. Because
    there is no -r switch for the rmdir command, answer b is incorrect. Although the
    rm -v * /home/mj/tmp command first deletes all files in your current directory
    before deleting all files in the /home/mj/tmp directory, it does not delete all
    of your Linux files. Therefore, answer d is incorrect.


    # Question 2


    What is the purpose of the w command?


    +   a. There is no purpose; there are no single-letter bash commands.

    +   b. Lists currently logged on users.

    +   c. Lists currently active programs.

    +   d. Used as a general manual.


    Answer b is correct. The w command, like who, lists all currently logged on users.
    Because w is a command, answer a is incorrect. The ps utility lists currently
    active programs, so answer c is incorrect. Because the man command calls out the
    manual for specific commands, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Question 3


    Your user has a number of test files named test1, test2, test3, and so on through
    test 100. Which of the following commands would delete only files named test10
    through test19?


    +   - a. `rm -i test1*`

    +   - b. `rm test1[09]`

    +   - c. `rm test1?`

    +   - d. `rm test10?`


    Answer c is correct. The question mark (?) works as a wildcard for one character.
    Because the rm -i test1* command removes the desired files as well as the test1
    and test100 files, answer a is incorrect. The rm test1[09] command removes the
    test10 and test19 files, so answer b is incorrect. Because the rm test10? command
    only removes the test100 file, answer d is incorrect.


    # Question 4


    Which of the following commands is the most efficient and accurate way to count
    the number of files in your current directory? Include all hidden files and directories
    in your count. (Commands are separated by a semicolon.)


    +   - a. `ls -l > wc -l`

    +   - b. `ls -a > tempcount; wc -l tempcount`

    +   - c. `ls -lar | wc -l`

    +   - d. `ls -al | wc -l`


    Answer d is the best available answer. The ls -a command counts the current files
    and directories including the current directory (.) and the parent directory (..).
    Because each file is on its own line, when you pipe the result to the wc -l command,
    you get the number of files as a result. If you use the ls -l > wc -l command,
    you''ll find output in a file named wc -l. Therefore, answer a is incorrect. Although
    answer b works, it is not as efficient as answer d. Therefore, answer b is incorrect.
    Because answer c has more switches than you need for the ls command, it is also
    incorrect.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Question 5


    Which of the following commands creates the /home/mj/project/book directory? Assume
    /home/mj is your home directory. Your pwd is /home/jm, and neither the project
    nor the book directory currently exists.


    +   a. mkdir -p ~/project/book

    +   b. mkdir -rF /home/mj/project/book

    +   c. mkdir -p project/book

    +   d. mkdir -r /home/mj/project/book


    Answer a is correct. The tilde (~) represents your home directory (as discussed
    in Chapter 7). The -p switch for mkdir creates all specified levels of directories.
    Because there is no -r or -F switch for the mkdir command, answers b and d are
    incorrect. Because you''re currently in the /home/jm directory, answer c is incorrect.


    # Question 6


    You''ve set up your own shell named kash. You want to know the number of users
    who set up kash as their default shell. There are no other words in any of the
    noted files that include the string kash. Which of the following commands would
    give you this number?


    +   a. grep kash | wc -l /etc/passwd

    +   b. wc -l /etc/passwd | grep kash

    +   c. grep /etc/passwd kash | wc -l

    +   d. grep kash /etc/passwd | wc -l


    Answer d is correct. The first term after the grep command is the search term
    that is used to search through standard input—in this case, the /etc/passwd file.
    This returns each line that includes the string kash. The output is sent to the
    wc -l command, which counts the number of lines. There is no search file in answer
    a, so it is incorrect. The number of lines in the /etc/passwd file is unrelated
    to the number of users with the kash shell, so answer b is incorrect. Because
    /etc/passwd is not a search term, answer c is incorrect.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Question 7


    Which of the following commands do the same thing? Assume that file1 and file2
    are both on the same Linux volume.


    +   - a. ln -s file1 file2; cp -p file1 file2

    +   - b. ln file1 file2; cp -r file1 file2

    +   - c. ln file1 file2; cp -p file1 file2

    +   - d. ln -s file1 file2; cp file1 file2


    Answer c is correct. The key to this question is inode numbers. A hard link (ln)
    and a cp -p command both retain the same inode number for the source and destination
    files. This doesn''t work if you''re copying a file from one volume to another.
    The ln -s command does not preserve inode numbers, so answers a and d are incorrect.
    Because the cp -r command does not preserve inode numbers, answer b is incorrect.


    # Question 8


    You''ve downloaded a new Linux application from the Internet. The installation
    files are archived together in a file named newapp.tar.gz. You''ve downloaded
    it to your /tmp directory. What commands are required to reveal the installation
    files? Make sure you have the commands in the correct order.


    +   - a. tar xvf newapp.tar.gz; gzip newapp.gz

    +   - b. gzip newapp.tar.gz; tar xvf newapp.tar

    +   - c. gunzip newapp.tar; tar xvf newapp.gz

    +   - d. gunzip newapp.tar.gz; tar xvf newapp.tar


    Answer d is correct. You need the gunzip command to uncompress a file with a .gz
    extension. Then you can unarchive the files with the tar xvf command. The tar
    xvf command doesn''t uncompress files, so answer a is incorrect. The gzip command
    compresses files, so answer b is incorrect. Because you''ve downloaded the newapp.tar.gz
    file, you need to apply the gunzip command to this file first before you get to
    the newapp.tar file. Therefore, answer c is incorrect.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Question 9


    Which of the following commands copies files to or from an unmounted MS-DOS floppy
    disk on your Linux computer? This Linux floppy is normally mounted on the /mnt/floppy
    directory. The device name is fd0.


    +   - a. mount /dev/fd0 /mnt/floppy

    +   - b. mcopy *.txt a:

    +   - c. cp *.txt /mnt/floppy

    +   - d. cp *.txt a:


    Answer b is correct. Linux includes a set of MS-DOS tools, or mtools, that allow
    you to interface directly with an unmounted floppy drive. These tools include
    commands such as mcopy, mdir, and mmove. You don''t need to mount the floppy to
    use mtools, so answer a is incorrect. You can''t use a Linux command to copy files
    to an unmounted floppy drive, so answer c is incorrect. Because you can''t use
    a Linux command to copy files to an unmounted MS-DOS drive, answer d is incorrect.


    # Question 10


    How would you find the number of kilobytes that are free on each of your hard
    disk volumes? You shouldn''t have to translate from bytes or megabytes.


    +   - a. df

    +   - b. df -m

    +   - c. df -b

    +   - d. du -k


    Answer a is correct. By default, the df command gives you the free space on each
    of your hard disk volumes, in kilobytes. Although the -k switch also serves this
    purpose, it is not required. The df -m command gives you a result in megabytes,
    so answer b is incorrect. The df -b switch does not exist, so answer c is also
    incorrect. Although the du -k command gives you the space occupied by each file
    and directory in kilobytes, it does not tell you about the space available in
    your Linux volumes. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
