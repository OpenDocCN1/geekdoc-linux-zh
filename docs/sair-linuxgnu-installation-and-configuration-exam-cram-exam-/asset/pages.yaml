- pgno: 123
  md: '# Question 10


    You''ve installed Linux on a production server. It''s also the server that manages
    your Web page. You get hundreds of hits each day to your Web page. You''ve heard
    about a new Linux kernel, version 2.5.45. You understand that it will help you
    manage your traffic and log files more efficiently. Should you upgrade your computer
    with this kernel? Which of the following explanations makes the most sense?


    +   - a. No. Because the last number is odd, you know this kernel is not suitable
    for production. You should wait for kernel version 2.5.46.

    +   - b. Yes. Because the last number is odd, you know this kernel is completely
    tested and reliable for your purposes.

    +   - c. No. Because the middle number is odd, you know this kernel is not suitable
    for production. You should wait for kernel version 2.6.

    +   - d. Yes. Because the middle number is odd, you know this kernel is completely
    tested and reliable for your purposes.


    Answer c is correct. The last number is the patch number and does not determine
    whether or not a kernel is suitable for production. Although higher patch numbers
    indicate a kernel that is more developed, answers a and b are still incorrect.
    When the middle number of a kernel version is odd, it is a developmental kernel
    not suitable for production. Therefore, answer d is incorrect.'
  merge: -1
