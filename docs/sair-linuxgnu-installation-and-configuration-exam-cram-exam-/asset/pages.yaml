- pgno: 303
  md: '# Questions, Questions, Questions


    There should be no doubt in your mind that you are facing a test full of specific
    and pointed questions. Each exam includes 50 questions. You are allotted 60 minutes
    to complete the exam.


    Remember, questions will belong to one of three basic types:


    +   - Multiple choice with a single answer

    +   - Multiple choice with multiple answers

    +   - Statement with a choice of true or false


    You should always take the time to read a question at least twice before selecting
    an answer. Not every question has only one answer; many questions require multiple
    answers. Therefore, you should read each question carefully, determine how many
    answers are necessary or possible, and look for additional hints or instructions
    when selecting answers.


    # Choosing Proper Answers


    Obviously, the only way to pass any exam is to select enough of the right answers
    to obtain a passing score. However, Sair''s Linux exams are not standardized like
    the SAT and GRE exams; they are far more diabolical and convoluted. In some cases,
    questions are strangely worded, and deciphering them can be a real challenge.
    In those cases, you may need to rely on answer elimination skills. Almost always,
    at least one answer out of the possible choices for a question can be eliminated
    immediately because it matches one of the following conditions:


    +   - The answer does not apply to the situation.

    +   - The answer describes a nonexistent issue, an invalid option, or an imaginary
    state.

    +   - The answer may be eliminated because of information in the question itself.


    After you eliminate all answers that are obviously wrong, you can apply your retained
    knowledge to eliminate further answers. Look for items that sound correct but
    refer to actions, commands, or features that are not present or not available
    in the situation that the question describes. If you''re still faced with a blind
    guess among two or more potentially correct answers, reread the question. Try
    to picture how each of the possible remaining answers would alter the situation.
    Be especially sensitive to terminology; sometimes the choice of words (remove
    instead of disable) can make the difference between a right answer and a wrong
    one.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Only when you''ve exhausted your ability to eliminate answers and remain unclear
    about which of the remaining possibilities is correct should you guess at an answer.
    An unanswered question offers you no points, but guessing gives you at least some
    chance of getting a question right. Just don''t be too hasty when making a blind
    guess.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_304_0.png)


    > Because this is not an "adaptive" exam, you can wait until the last round of
    reviewing questions (just as you''re about to run out of time or unanswered questions)
    before you start making guesses. Although guessing should be a last resort, you
    should answer every question. You don''t lose any credit if you answer a question
    incorrectly.


    # Decoding Ambiguity


    Sair Linux/GNU exams have a reputation for including questions that can be difficult
    to interpret, are confusing, or are ambiguous. In my experience with numerous
    exams, I consider this reputation to be completely justified. The Sair Linux/GNU
    exams are tough, and they''re deliberately made that way.


    The only way to beat Sair at its own game is to be prepared. You''ll discover
    that many exam questions test your knowledge of things that are not directly related
    to the issue raised by a question. This means that the answers you must choose
    from, even incorrect ones, are just as much a part of the skill assessment as
    the question itself. In other words, the more you know about the operating system,
    the easier it is for you to tell right from wrong.


    Questions often give away their answers, but you have to be Sherlock Holmes to
    see the clues. Often, subtle hints appear in the question text in such a way that
    they seem almost irrelevant to the situation. You must realize that each question
    is a test unto itself, and that you need to inspect and successfully navigate
    each question to pass the exam. Look for small clues, such as the mention of times,
    group permissions and names, and configuration settings. Little things such as
    these can point to the right answer if they''re properly understood; if missed,
    they can leave you facing a blind guess.


    Another common difficulty with certification exams is vocabulary. You may see
    some utilities and features named in obvious ways in some cases and completely
    inanely in other instances. Be sure to brush up on the key terms presented at
    the beginning of each chapter of this book. You may also want to read the glossary
    at the end of this book the day before you take the test.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Working within the Framework


    The test questions appear in random order, and many elements or issues that are
    mentioned in one question may also crop up in other questions. It''s not uncommon
    to find that an incorrect answer to one question is the correct answer to another
    question, or vice versa. Take the time to read every answer to each question,
    even if you recognize the correct answer to a question immediately. That extra
    reading may spark a memory or remind you about a Linux feature or function, which
    may help you on another question elsewhere on the exam.


    Because this is not an "adaptive" exam, you can revisit any question as many times
    as you like. If you''re uncertain of the answer to a question, check the box that''s
    provided to mark it for easy return later on. You should also mark questions that
    you think may offer information you can use to answer other questions. On fixed-length
    tests, I usually mark somewhere between 25 and 50 percent of the questions. The
    testing software is designed to let you mark every question if you choose. Use
    this framework to your advantage. Everything you''ll want to see again should
    be marked. The testing software can then help you return to marked questions quickly
    and easily.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_305_0.png)


    > For the exam, I strongly recommend that you first read the entire test quickly,
    before getting caught up in answering individual questions. Doing this will help
    to jog your memory as you review the potential answers and can help you identify
    questions that you want to mark for easy access to their contents. You can also
    identify and mark the tricky questions for easy return. The key is to make a quick
    pass over the territory to begin with—so that you know what you''re up against—and
    then survey that territory more thoroughly on a second pass, when you can begin
    to answer all questions systematically and consistently.


    # Deciding What to Memorize


    The amount of memorization you must undertake for an exam depends on how well
    you remember what you''ve read and how well you know the operating system by heart.
    The exam stretches your abilities to memorize product features and functions and
    interface details as well as how they all relate to Linux as a whole.


    At a minimum, you''ll want to memorize the following kinds of information:


    +   - Linux benefits and costs

    +   - Basic command-line interface commands

    +   - The structural components of Linux

    +   - Run levels'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   - Filesystem Hierarchy Standard

    +   - Graphics modes

    +   - Troubleshooting solutions

    +   - Documentation resources


    If you work your way through this book while sitting at a machine with Linux installed
    and work with the files and commands as they''re discussed throughout, you should
    have little or no difficulty mastering this material. Also, don''t forget that
    The Cram Sheet at the front of the book is designed to capture the material that''s
    most important to memorize. Use this Cram Sheet to guide your studies as well.


    # Preparing for the Test


    The best way to prepare for the test—after you''ve studied—is to take at least
    one practice exam. One has been included in this chapter for that reason. The
    test questions are located in the pages that follow. (Unlike the questions in
    the preceding chapters in this book, the answers don''t follow the questions immediately.
    You''ll have to flip to Chapter 16 to review the answers separately.)


    Give yourself 50 minutes to take the exam, and keep yourself on the honor system—don''t
    look at earlier text in the book or jump ahead to the answer key. When your time
    is up or you''ve finished the questions, check your work in Chapter 16. Pay special
    attention to the explanations for the incorrect answers; these can also help to
    reinforce your knowledge of the material. Knowing how to recognize correct answers
    is good, but understanding why incorrect answers are wrong can be equally valuable.


    # Taking the Test


    Relax. Once you''re sitting in front of the testing computer, there''s nothing
    more you can do to increase your knowledge or preparation. Take a deep breath,
    stretch, and start reading that first question.


    You don''t need to rush, either. You have plenty of time to complete each question
    and to return to the questions that you skipped or marked for return. If you read
    a question twice and you remain clueless, you can mark it and come back to it
    later. Both easy and difficult questions are intermixed throughout the test in
    random order. Don''t cheat yourself by spending too much time on a hard question
    early in the test, thereby depriving yourself of the time you need to answer the
    questions at the end of the test.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'One strategy is to read through the entire test, and then, before returning
    to marked questions for a second visit, figure out how much time you''ve got per
    question. As you answer each question, remove its mark. Continue to review the
    remaining marked questions until you run out of time or complete the test.


    That''s it for pointers. Good luck!'
  merge: -1
  img_proc: true
