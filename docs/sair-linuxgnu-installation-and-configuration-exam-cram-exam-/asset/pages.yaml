    +   - Set up the X Window

    +   - Create new users

    +   - Administer runaway programs

    +   - Configure a basic network

    +   - Understand Linux applications

    +   - Troubleshoot basic problems


    # Build the confidence you need to pass the exam.


    The Exam Cram Method™ of study focuses on exactly what you need to get certified
    now.


