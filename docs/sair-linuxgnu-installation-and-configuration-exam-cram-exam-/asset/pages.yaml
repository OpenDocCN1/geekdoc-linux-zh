- pgno: 25
  md: 'The Exam Prep series—These books provide a greater level of detail than the
    Exam Cram books and are designed to teach you everything you need to know from
    an exam perspective. Each book comes with a CD-ROM that contains interactive practice
    exams in a variety of testing formats.


    Together, the two series make a perfect pair. Check www.examcram.com for additional
    products from Coriolis.


    You''ll find that this book will complement your studying and preparation for
    the exam, either on your own or with the aid of the previously mentioned study
    programs. In the section that follows, I''ll explain how this book works and why
    this book counts as a member of the required and recommended materials list.


    # ## About This Book


    Each topical Exam Cram chapter follows a regular structure, along with graphical
    cues about important or useful information. Here''s the structure of a typical
    chapter:


    +   - **Opening hotlists**—Each chapter begins with a list of the terms, tools,
    and techniques that you must learn and understand before you can be fully conversant
    with that chapter''s subject matter. The hotlists are followed by one or two introductory
    paragraphs to set the stage for the rest of the chapter.

    +   - **Topical coverage**—After the opening hotlists, each chapter covers a series
    of topics related to the chapter''s subject. Throughout this section, I highlight
    important topics or concepts as Exam Alerts, like this:


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_25_0.png)


    > > This is what an Exam Alert looks like. Normally, an Exam Alert stresses concepts,
    terms, software, or activities that are likely to relate to one or more certification
    test questions. For that reason, any information found offset in Exam Alert format
    is worthy of unusual attentiveness on your part. Indeed, most of the information
    that appears on the Cram Sheet appears as Exam Alerts within the text.


    Pay close attention to material flagged as an Exam Alert; although all the information
    in this book pertains to what you need to know to pass the exam, I flag certain
    items that are really important. You''ll find what appears in the meat of each
    chapter to be worth knowing, too, when preparing for the test. Because this book''s
    material is very condensed, I recommend that you use this book along with other
    resources to achieve the maximum benefit.


    In addition to the Exam Alerts, I have provided tips that will help build a better
    foundation for Sair Linux knowledge. Although the information might not be on
    the exam, it is certainly related and will help you become a better test taker.'
