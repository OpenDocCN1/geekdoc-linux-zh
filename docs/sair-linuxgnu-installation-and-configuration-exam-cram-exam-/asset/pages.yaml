  md: '# Question 7


    Why should you not include a period (.) in your PATH variable?


    +   - a. It leaves you vulnerable to problems in your lilo.conf file.

    +   - b. It leaves you vulnerable to potential attacks by commands that simulate
    other normal shell commands.

    +   - c. It leaves you vulnerable to potential attacks via holes in your firewall.

    +   - d. It leaves you vulnerable to potential attacks through cookies.


    Answer b is correct. The dot in the PATH variable leaves you vulnerable to potential
    Trojan horses that masquerade as standard shell commands. Because the PATH variable
    is not started until after your Linux kernel is started, it has no affect on your
    lilo.conf file. Therefore, answer a is incorrect. Although a dot in the PATH variable
    leaves you vulnerable to other attacks, the dot itself does not breach a Linux
    firewall; therefore, answer c is incorrect. The dot is not related to whether
    you receive cookies from Web sites; therefore, answer d is incorrect.


