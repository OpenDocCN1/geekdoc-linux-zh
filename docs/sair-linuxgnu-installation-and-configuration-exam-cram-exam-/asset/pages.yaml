- pgno: 54
  md: '# Practice Questions


    # Question 1


    Which of the following operating systems was developed before the others?


    +   - a. Linux

    +   - b. Unix System 6

    +   - c. Minix

    +   - d. Xinu


    Answer b is correct. Unix System 6 was the last Unix system freely licensed by
    AT&T to universities in the 1970s and 1980s. Xinu, Minix, and Linux were developed
    after AT&T entered the computer business and started selling Unix on a commercial
    basis. Therefore, answers a, c, and d are incorrect.


    # Question 2


    Who started the FSF?


    +   - a. Linus Torvalds

    +   - b. Eric Raymond

    +   - c. William Gates

    +   - d. Richard Stallman


    Answer d is correct. Richard Stallman founded the FSF in 1983. Linus Torvalds
    developed the Linux kernel. Eric Raymond launched the OSI. William Gates is the
    founder of Microsoft. Therefore, answers a, b, and c are incorrect.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Question 3


    Which of the following statements best describes open source software?


    +   - a. Linux or any application used on Linux

    +   - b. Software that is released with its commented programming code

    +   - c. Software that is protected by the GPL

    +   - d. b and c


    Answer b is correct. Open source software is released with a copy of its source
    code. At a minimum, open source software includes a clear set of comments within
    the source code. Not all applications used on Linux are open source; therefore
    answer a is incorrect. Not all open source software is protected by the GPL; therefore,
    answers c and d are incorrect.


    # Question 4


    Which of the following are benefits of GPL software? [Check all correct answers]


    +   - [ ] a. You can change the source code to meet your needs.

    +   - [ ] b. You can improve on the software and sell it for a profit.

    +   - [ ] c. It is easy to use.

    +   - [ ] d. Many companies and individuals are working to improve it.


    Answers a, b, and d are correct. Because GPL software like Linux focuses on its
    advanced customers, it may not include features to help beginners. Therefore,
    answer c is incorrect.'
  merge: -1
  img_proc: true
