    # Question 3


    You''re running a distribution with Linux kernel 2.0.36. You just installed 128MB
    of RAM for a total of 256MB. You also installed a second Ethernet network card.
    You set the IRQ of this card to 11 and the I/O memory address to 0x320. Which
    of the following commands should you set at the LILO boot: prompt?


    +   a. linux ether=0x320,11,eth0 mem=128M

    +   b. linux ether=0x320,11,eth0 mem=256M

    +   c. linux ether=11,0x320,eth1 mem=128M

    +   d. linux ether=11,0x320,eth1 mem=256M


    Answer d is correct. These commands add information to your lilo.conf file. The
