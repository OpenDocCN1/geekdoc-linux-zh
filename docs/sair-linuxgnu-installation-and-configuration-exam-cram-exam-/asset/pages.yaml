- pgno: 67
  md: '# Command Management


    Command management deals with the tools that you need to administer Linux. With
    the latest distributions, you can choose between CLI and GUI administration tools.
    Linux GUI administration tools are often less than complete. Some Linux GUI commands
    may override settings that you''ve edited into your configuration files. Also,
    most Linux GUI commands do not report the details of success and failure, which
    can be critical when you''re troubleshooting a problem.


    For these reasons, many experienced Linux users prefer the CLI.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_67_0.png)


    > When you study Linux commands, focus on command-line interface (CLI) tools.


    Linux GUI tools are based on add-ons to standard command-line utilities. So when
    you use a GUI tool, like Red Hat''s LinuxConf, you''re actually using a GUI control
    for different command-line utilities. Not all of LinuxConf''s controls work. There
    are, however, a number of shortcuts built into the CLI. Linux administrators who
    learn these shortcuts often do their work more quickly than administrators who
    try to use a GUI tool.


    The apparent superiority of CLI tools may not last forever, but CLI superiority
    is a key assumption of the Sair Linux/GNU exams.


    # Hardware Compatibility


    Hardware compatibility is sometimes a problem for the Linux administrator. When
    first released, newer hardware may not always include a Linux driver.


    A special problem is the "winmodem," which is a telephone modem that substitutes
    Microsoft Windows driver libraries for some hardware controllers.


    To deal with these issues, you need to know the kinds of hardware to avoid, alternate
    locations for Linux drivers, and the way Linux communicates with different types
    of hardware.


    # Hardware Compatibility Lists


    Before installing Linux on a computer, you should check two different lists. You
    can find the main Linux hardware compatibility list (HCL), the "Hardware-HOWTO,"
    on the Linux Documentation Project Web site at www.linuxdoc.org. Many Linux distributors
    keep their own HCLs on their Web sites. These lists are more up-to-date. If you
    see your hardware on your distribution''s HCL, you''ll probably find the appropriate
    Linux driver packaged with the distribution.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'If you don''t see your hardware on the HCL, there is no need to panic. There
    is a way to configure just about any device that isn''t in the "Linux Incompatible
    Hardware" section of the "Hardware-HOWTO." Many manufacturers provide Linux drivers
    on disk or through their Web sites. These sites may also list Linux compatible
    products that your hardware can emulate. For example, many network cards can emulate
    a Novell 2000 adapter, and thus can work with its Linux driver.


    # Modems


    One of the banes of the Linux administrator is the winmodem. A winmodem substitutes
    Microsoft Windows software drivers and libraries for the hardware that controls
    a regular modem. Because the source code for Microsoft Windows is currently unavailable,
    it is difficult to create Linux drivers for a winmodem.


    Some Linux gurus believe that it would be wrong to try to create drivers for winmodems.
    Devices like winmodems, which use your computer''s Central Processing Unit (CPU),
    affect the performance of the entire system.


    Although some Linux developers have developed techniques for working with some
    winmodems, the prevailing attitude in the Linux community is to avoid winmodems
    because of the interaction with the CPU.


    # Video Adapters


    Another common hardware problem is the video adapter, sometimes known as the graphics
    card. Although you may not require graphics if you do your work at the command
    line, most users demand a high level of performance from video hardware.


    When possible, the XFree86 project creates Linux drivers for video adapters. But
    this work takes time, and not all video adapter manufacturers release the design
    information required for a Linux driver. Although you can set up standard VGA
    settings on almost any card, standard 16-color VGA graphics are not enough for
    anyone who uses a graphical application. So before you install Linux, check the
    XFree86 Web site for the latest list of supported video adapters.


    # Printers


    The other major hardware uncertainty is printers. As shown in the "Hardware-HOWTO"
    on the Linux Project Documentation site, some ink- and bubble-jet printers don''t
    have Linux drivers. However, if you have a new PostScript or generic text printer,
    you may be able to set it up with generic Linux drivers.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Driver Development


    There are several sources of new drivers. Many manufacturers release Linux drivers
    when they release a new product. Some Linux companies and nonprofit groups develop
    drivers under the GPL or related licenses. Many developers create their own drivers
    that they post on various Internet (Web and FTP) sites.


    At the time of this writing, a major hole in the Linux hardware driver library
    includes peripherals that connect through a Universal Serial Bus (USB). This issue
    should be addressed, at least for keyboards, mice, and sound cards, by the release
    of the Linux kernel version 2.4 around the beginning of the year 2001. For the
    latest information, refer to the Linux USB Web site at www.linux-usb.org.


    # Hardware Management


    Most users don''t have hardware problems when they install Linux on their computers.
    In general, users with the latest Linux distributions but not the "latest and
    greatest" hardware usually have the least amount of trouble. Choosing hardware
    at least a few months old generally insures that all of the components are effectively
    listed on the Linux HCL, or at least have Linux drivers.


    As an administrator, you''re more likely to run into hardware problems. For the
    Sair Linux/GNU exam, you need to know about several different categories of conflicts.


    Just about every part of your computer needs processing power and memory. Each
    component uses a specific port to ask for processing power from your CPU. While
    it waits for this processing power, each component stores its request and data
    in a dedicated address in your random access memory (RAM). If two parts of your
    computer try to use the same port or the same area in memory, you generally get
    a hardware conflict.


    Ports are conceptually similar to television channels; two different pieces of
    hardware generally can''t use the same channel.


    Conceptually, the solution is fairly simple: Change the port or designate a different
    area in memory. But to understand how these ports and areas work, you need to
    know a bit about the architecture inside your personal computer.


    The backbones of computer architecture are known as buses. A bus is a communication
    highway inside your computer. Different buses regulate communication for ISA adapters,
    PCI cards, and RAM. If you''re using Linux with kernel 2.2'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'or later, the ports used on each bus may depend on the settings in a Plug-and-Play
    BIOS.


    # ISA Bus


    When you install an ISA adapter, there is potential for conflict on four different
    kinds of ports:


    +   - **IRQ**—Computer components use IRQ ports to ask the CPU for processing
    time. Computers generally have 16 IRQ ports. Basic computer components, like keyboards,
    hard drives, modems, BIOS clocks, and so forth, already occupy most IRQ ports.

    +   - **Input/output (I/O)**—I/O addresses are dedicated locations in RAM that
    work like a cache. For example, information that comes through a network card
    waits in a specific range of I/O addresses for processing.

    +   - **Direct Memory Address (DMA)**—A DMA bypasses your CPU. For example, some
    sound cards have a specific DMA because they can independently process an audio
    file directly from a hard drive. DMA conflicts are relatively rare.

    +   - **Shared memory address**—Adapters that can''t use a DMA use a shared memory
    address. Adapters can use a DMA or a shared memory address but not both.


    The Linux command to reconfigure Plug-and-Play ISA adapters is isapnp. For more
    information, refer to its man page.


    # PCI Bus


    When choosing a PCI adapter, consider the following three issues. First, there
    are fewer Linux drivers available for PCI adapters. Second, older PCI cards may
    not work in newer computers. Third, many PCI cards also rely on IRQ ports to communicate
    with the CPU, so they may conflict with your ISA cards.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_70_0.png)


    > If one PCI card is more important than the others, you can improve its performance
    by installing it in the slot furthest from your ISA cards. Closer slots get lower
    priority when they compete for CPU time. PCI SCSI adapters often need higher priority
    slots.


    # BIOS


    The BIOS (Basic Input/Output System) on your motherboard is the first program
    that runs when you turn on your computer. It includes a routine in its read-only
    memory (ROM) that checks your buses for new and existing hardware.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_71_0.png)


    Plug-and-Play BIOSes also set the communication ports (IRQ, DMA, I/O, shared memory
    address) used by each component.


    However, Plug-and-Play BIOSes are not perfect. The ports that are assigned in
    Linux may still conflict. You may need to set the ports manually. If you have
    a lot of conflicts, you may even have to deactivate Plug-and-Play in your BIOS.


    # Solutions


    When you have a conflict, you need to assign different ports. You can make changes
    with commands, such as isapnp or ifconfig. In some cases, you can even use your
    Linux distribution''s GUI configuration tools; I''ve used Red Hat''s LinuxConf
    and S.u.S.E.''s YaST with some degree of success in this area.


    Sometimes, you can change the port or address on the card itself. Some newer cards
    come with driver floppies that change the software embedded in the card. If you
    don''t have the floppy available, you may be able to download the program from
    the manufacturer''s Web site.


    Alternately, some older adapter cards work with jumpers, which are connectors
    on the card that you can physically remove and install on different combinations
    of metal pins. The port or memory address used by your card depends on the pins
    connected by the jumper.


    > Note: If you have to work with components inside your computer, take precautions.
    Turn off your computer before taking it apart. Be sure to touch some large metal
    object (such as a metal computer case) to dissipate static electricity before
    you touch anything inside your computer. Be gentle when you remove or install
    anything (cards, chips, and so on).


    # Memory


    The amount of RAM that you need for Linux depends on what you want to do with
    your computer. Linux doesn''t require a lot of RAM. The Linux kernel needs about
    1MB of space. The programs for which you need to set up a CLI require another
    2MB to 3MB. In other words, if you''re just setting up a Linux computer as a network
    firewall, 4MB of RAM may be enough.


    The following sections describe four possible installation scenarios for Linux.


    # Network Firewall


    You can set up a Linux computer as a dedicated firewall to protect the rest of
    your network. A properly installed firewall is the only path between your local
    area'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'network (LAN) and another network, such as the Internet. All you need on this
    computer is the Linux kernel, network card drivers, network daemons, and a script
    based on a Linux firewall program, such as ipchains or iptables. You can set up
    this firewall using 4MB to 8MB of RAM.


    Because so little computing power is required, one popular option is to set up
    network firewalls on an older system, like a PC with a 386 CPU. This is a great
    use for an older computer.


    # Command-Line Network Server


    If you''re setting up Linux just for the command-line interface (CLI), you don''t
    need the power required by a graphical workstation. In this case, 16MB to 32MB
    of RAM should be sufficient, even if you share your system with multiple users.
    If any of your users run memory intensive programs, such as scientific models,
    the amount of RAM should be increased.


    You should also set up a reasonable amount of virtual memory, which allows Linux
    to move or swap infrequently used programs to a dedicated location on your hard
    drive. This is also known as swap space and is usually set up in a dedicated Linux
    swap partition. Generally, a swap partition should be twice the size of your RAM.


    # GUI Workstations and Servers


    Graphics is perhaps the biggest driving force in the ever increasing demand for
    computing power. To use a few graphical programs in the X Window efficiently,
    you need at least 32MB to 64MB of RAM. The amount of RAM needed can easily increase
    a great deal if you use more graphic-intensive applications.


    You should also set up a larger swap partition when working with graphics. However,
    at these higher levels of RAM, swap partitions need not exceed 100MB. After all,
    it takes time for your computer to exchange the information in your swap partition
    with the information in your RAM.


    If you''re setting up a GUI server, 64MB to 128MB of RAM is a practical minimum.
    If your GUI server has to coordinate the graphic design efforts of several users,
    this amount of RAM should also be increased.


    If you can afford to install enough RAM to handle every function and application
    that you and your users might perform, you may not need a swap partition. In fact,
    if you have very large amounts of RAM (e.g., over 1GB), accessing a swap partition
    in Linux will slow you down.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Special Memory Issues


    Memory requirements increase as you allow more users and more graphics on your
    system. Unless you have an older computer or older Linux kernel, extra RAM is
    helpful:


    +   - If you have an older Linux kernel, earlier than version 2.2.1, you need
    to configure the Linux Loader (LILO) to tell the kernel to look for memory above
    64MB. For example, if you have 128MB of RAM, add an append="mem=128M" line to
    your /etc/lilo.conf file.

    +   - If you have a computer with memory speed of 60 nanoseconds (ns: one ns =
    10⁻⁹ seconds) or less, you need RAM cache, which is also known as L2 cache. Generally,
    you need at least 512KB of L2 cache per 64MB of memory. If your RAM and motherboard
    are rated at PC100 or better, this issue is generally not significant.


    When you''re setting up a graphical workstation, another memory issue relates
    to your video card. As you''ll see in Chapter 4, graphic resolution depends on
    the amount of memory on your video card.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Practice Questions


    # Question 1


    Which of the following are characteristics of the Linux kernel? [Check all correct
    answers]


    +   - [ ] a. The kernel allows the Linux operating system to communicate with
    your computer hardware.

    +   - [ ] b. It includes a series of device drivers. You can load additional device
    drivers as you add more hardware to your computer.

    +   - [ ] c. It includes a series of device drivers. You can configure your computer''s
    BIOS to manage your hardware ports and memory addresses through the kernel.

    +   - [ ] d. It is the first program that starts when you boot Linux.


    Answers a and b are correct. Linux device drivers are the part of the kernel that
    allow the operating system to communicate with your hardware. You can load additional
    drivers into the kernel as needed. The computer BIOS does not interact with the
    Linux kernel. Therefore, answer c is incorrect. Even though the Linux kernel starts
    before init, the init program is the first program that starts when you boot Linux.
    Therefore, answer d is incorrect.


    # Question 2


    Which of the following processes are normally part of various init run levels?


    +   - ○ a. The X Window manager and the ls command

    +   - ○ b. Multiuser programs and shutdown signals from a UPS

    +   - ○ c. Reboot and networking

    +   - ○ d. Single-user mode and the Linux kernel


    Answer c is correct. The reboot command has its own init run level. Another run
    level is used to start network utilities. The X Window is started at an init run
    level. Although init starts the shell, it does not start the ls command that is
    run through the shell. Therefore, answer a is incorrect. Multiuser programs are
    set up in an init run level. Although UPS signals are part of the /etc/inittab
    file, these signals themselves are not part of any init run level. Therefore,
    answer b is incorrect.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Recovery disks can be used to start the programs associated with the single-user
    mode run level, but the Linux kernel is not part of any specific run level. Therefore,
    answer d is incorrect.


    # Question 3


    If you haven''t configured your X Window, how can you start your GUI?


    +   - a. startx

    +   - b. X

    +   - c. xdm

    +   - d. Alt+Ctrl+F7

    +   - e. None of the above


    Answer e is correct. If you haven''t configured the X Window, you can''t use any
    of the standard ways to start the X Window: startx, X, and xdm. Therefore, answers
    a, b, and c are incorrect. Although you can return to an X Window with the Alt+Ctrl+F7
    command, if you have already started it you can''t start it in this way. Therefore,
    answer d is incorrect.


    # Question 4


    Which of the following statements is a valid example of single sequential user
    multitasking?


    +   - a. Several users are logged in to a Linux computer, but Linux can only handle
    their programs in sequence, one at a time.

    +   - b. There are multiple user accounts on a Microsoft Windows 98 computer.
    All users can log in simultaneously. Each user can run several programs simultaneously.

    +   - c. Several users are logged in to a Linux computer, but Linux can run several
    of their programs simultaneously.

    +   - d. There are multiple user accounts on a Microsoft Windows 98 computer.
    Each user can run several programs simultaneously. Only one user can log in at
    a time.


    Answer d is correct. Only one user can log in at a time on a single sequential
    user operating system like Windows 98. While logged on to Windows 98, that user
    can run several programs simultaneously, which is called multitasking. Linux is
    a'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'multitasking operating system. Therefore, answer a is incorrect. All users
    cannot log in simultaneously to a Microsoft Windows 98 computer. Therefore, answer
    b is incorrect. Although everything in answer c is true, it is a description of
    a multiuser system. Therefore, answer c is incorrect.


    # Question 5


    Which of the following statements most accurately describes preemptive multitasking?


    +   - a. While multiple programs are running, one program controls the CPU and
    other computer resources for as long as it needs them. If it doesn''t need the
    resources for a few moments, it can let other programs use these resources. When
    that program is done, the kernel assigns these resources to the program with the
    next highest priority.

    +   - b. While multiple programs are running, several programs receive dedicated
    slices of time with the CPU and other computer resources. Other programs or drivers
    can request access while other programs are running. The kernel can choose to
    stop whatever is running and adjust priorities accordingly.

    +   - c. While multiple programs are running, they share simultaneous access to
    the CPU and other computer resources for as long as they need them. If these programs
    don''t need the resources for a few moments, they can let other programs use these
    resources. When all of the running programs are done, the kernel assigns these
    resources to the program with the next highest priority.

    +   - d. While multiple programs are running, they share simultaneous access to
    the CPU and other computer resources. When other programs or drivers request access,
    the resources are shared among all programs simultaneously.


    Answer b is correct. In preemptive multitasking, the CPU divides its time between
    several programs. When another program needs access, the kernel decides whether
    to stop a currently running program by lowering its priority. Answer a is a description
    of cooperative multitasking, and is therefore incorrect. Even in multitasking,
    different programs share time on the resources. They can''t use the resources
    at the exact same time because their data would become jumbled. Therefore, answers
    c and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Question 6


    In a multiuser system like Linux, which of the following considerations limit
    the number of times that you can log in to one Linux operating system simultaneously?
    [Check all correct answers]


    +   - a. Number of computers on your network

    +   - b. Users set up on your computer

    +   - c. Availability of a modem and a network card

    +   - d. Parameters defined in the /etc/inittab file


    Answers a, c, and d are correct. You can set up the /etc/inittab file with as
    many virtual consoles as you need through modems, network connections, or the
    appropriate keys on the local computer. As a user, you can log in to all available
    virtual consoles simultaneously. Creating additional users does not affect the
    number of times that you can log in to that computer. Therefore, answer b is incorrect.


    # Question 7


    Which of the following is an advantage of GUI administration tools when compared
    to corresponding CLI tools?


    +   - a. GUI tools are built on a foundation of CLI tools.

    +   - b. GUI tools provide more information.

    +   - c. GUI tools are more reliable.

    +   - d. Experienced Linux users prefer GUI tools.

    +   - e. None of the above.


    Answer e is correct. Although GUI tools add source code to a foundation of CLI
    tools, that itself does not give the GUI an advantage. In fact, the additional
    code required means that there is more that can go wrong. Therefore, answer a
    is incorrect. A number of messages from a CLI command are usually not shown in
    the corresponding GUI command. In other words, GUI tools provide less information.
    Therefore, answer b is incorrect. Because GUI tools require more source code than
    corresponding CLI tools, there is more that can go wrong. Therefore, answer c
    is incorrect. Although answer d is most subjective, the current bias of experienced
    Linux users is towards CLI tools. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Question 8


    You just installed an internal modem in an ISA slot on your computer. When you
    start Linux, you find that both your ISA modem and your PCI sound card do not
    work. You conclude that there is a conflict of some sort. Which of the following
    is the most likely place for conflict?


    +   - a. Another PCI card

    +   - b. DMA

    +   - c. IRQ

    +   - d. Memory bus


    Answer c is correct. Both PCI and ISA cards communicate with the CPU through IRQ
    ports or channels. Although PCI cards get priority based on where they''re installed
    on your computer, that doesn''t affect their priority relative to an ISA card.
    Therefore, answer a is incorrect. DMA conflicts are relatively rare. Therefore,
    answer b is incorrect. The memory bus connects your RAM to your CPU and is not
    closely related to your ISA or PCI buses. Therefore, answer d is incorrect.


    # Question 9


    Which of the following are major types of modules of the Linux operating system?
    [Check all correct answers]


    +   - a. X Window

    +   - b. Kernel

    +   - c. Run levels

    +   - d. Init

    +   - e. Network

    +   - f. Daemons

    +   - g. Login and shells


    Answers a, b, d, e, f, and g are correct. They correspond to the different modules
    of the Linux operating system. Run levels are the programs that are started by
    init. But run levels are themselves not modules of the Linux operating system.
    Therefore, answer c is incorrect.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Question 10


    You''re setting up a computer for a user who does a lot of intense graphics development
    work. If you include 128MB of RAM on that computer, how big of a swap partition
    do you need?


    +   - a. 128MB

    +   - b. 192MB

    +   - c. 256MB

