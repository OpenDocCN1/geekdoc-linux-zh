  img_proc: true
- pgno: 355
  md: '# gzip


    A command that compresses a file.


    # hacker


    In the Linux world, hackers are good people who make, or hack, improvements for
    software.


    # Halloween documents


    The reported Microsoft memos on GPL software released on Halloween eve, 1998.


    # halt


    A command that shuts down Linux and stops your computer. Commonly associated with
    run level 0.


    # hardware address


    The address assigned to a specific network card. Every network card created today
    is supposed to be built with a unique hardware address, which you can identify
    with the /sbin/ifconfig command. Hardware addresses are normally shown in hexadecimal
    notation.


    # head


    A command that gives you a view of the first few lines of a file.


    # help


    A switch that you can use to find more information about the switches associated
    with a specific command. For example, if you want more information on the ls command,
    type ls --help.


    # home directory


    The starting directory for every Linux user. For standard users, the home directory
    is /home/user name (substitute


    the actual user name for user name). For the root user, the home directory is
    /root.


    # horizontal resolution


    The number of pixels that a monitor can display in a line on your monitor. For
    example, if the resolution on your monitor is 1024x768, the horizontal resolution
    is 1024 pixels.


    # hostname


    A name given to a computer. In a TCP/IP network, each computer needs a unique
    hostname on that network. See also fully qualified domain name.


    # HOWTOs


    Manuals associated with the Linux Documentation Project. HOWTOs for many Linux
    topics are available on the www.linuxdoc.org Web site.


    # HTML


    HyperText Markup Language. The commands embedded in text files most commonly used
    to create Web pages.


    # httpd.conf


    The main Apache configuration file.


    # I/O


    Input/output address. Dedicated locations in your RAM for peripherals to store
    information while waiting for service from your CPU.


    # IEEE 802.3


    Institute of Electrical and Electronics Engineers standard 802.3. The specification
    most closely associated with Ethernet.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '**if**

    Input filter. Associated with the /etc/printcap printer configuration file. This
    variable specifies the filter to be used for every print job.


    **ifconfig**

    A Linux command used to configure network cards.


    **image**

    A parameter that you may find in the /etc/lilo.conf file, which specifies the
    location of the Linux kernel.


    **info**

    A utility that provides a structured way to look through different man pages.


    **init**

    The first program that starts when you start Linux. As a daemon, init starts other
    programs like your shell. It also watches for signals that might shut down your
    computer, such as a power failure signal from an uninterruptible power supply
    (UPS).


    **init.d**

    The directory with indirect scripts for daemons and other programs that are started
    or stopped at various run levels.


    **initdefault**

    A command in the /etc/inittab file that specifies the default run level when you
    start Linux.


    **insmod**

    The Linux command that adds drivers to your system after Linux boots on your computer.


    **interactivity**

    In a Linux shell, this is the ability to reference the HISTORY of previously used
    commands.


    **internet**

    Two or more LANs connected together.


    **Internet**

    The worldwide group of networks, sometimes known (not quite accurately) as the
    World Wide Web.


    **IP address**

    A numeric address used for computers on a TCP/IP network. IP addresses are typically
    formatted as four numbers between 0 and 255 divided by dots. There are 256 numbers
    available between 0 and 255 (inclusive). Because 256=2^8, each number is known
    as an octet. The format is known as dotted-decimal notation.


    **ipchains**

    A firewall utility command commonly associated with Linux kernel 2.2.


    **iptables**

    A firewall utility command commonly associated with Linux kernel 2.4.


    **IPv4**

    IP Version 4. The standard method of IP addressing used since the development
    of TCP/IP in the 1970s.


    **IPv6**

    IP Version 6. The method of IP addressing that is being incorporated into the
    Internet today. IPv4 addresses work seamlessly in IPv6.


    **IRQ**

    Interrupt request. There are typically 16 IRQ channels in a PC for different peripherals
    and devices to ask for service from your CPU.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# ISA


    Industry Standard Association. Also the name of a standard for peripherals that
    you install inside a computer.


    # isapnp


    The Linux command to reconfigure ISA adapters.


    # ispell


    A spell checker for text documents.


    # joe


    Joe''s own editor. A Linux text processing editor.


    # kbdconfig


    The Red Hat Linux configuration utility for keyboards.


    # kbdrate


    The command used to set the keyboard repeat rate.


    # KDE


    K Desktop Environment. A complete window manager. KDE includes everything from
    a login screen to office applications.


    # kernel


    The part of your operating system that translates commands from your programs
    to your hardware. One of the six modules of the Linux operating system.


    # keyboard repeat rate


    When you press a character on a keyboard and keep it pressed down, it eventually
    starts repeating itself on the screen. The rate at which you see additional characters
    is the keyboard repeat rate.


    # kill


    A command you can use to end a currently running program or process. You need
    the PID of the program or process in question.


    # KOffice


    The office suite associated with the KDE desktop.


    # label


    A parameter found in the /etc/lilo.conf configuration file that specifies the
    label you see associated with booting a particular operating system.


    # LAN


    See local area network.


    # LaTeX


    A typesetting language for text files commonly associated with scientific documents.


    # less


    A command that allows you to view the contents of a file, one screen at a time.
    You can use the Page Up and Page Down keys on your keyboard to scroll through
    the subject file in either direction.


    # lf


    Line filter. Associated with the /etc/printcap printer configuration file. Specifies
    a file that collects errors associated with printing.


    # LILO


    See Linux Loader.


    # lilo.conf


    The LILO configuration file.


    # LinuxConf


    Red Hat''s graphical administration utility.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Linux Documentation Project


    The project that maintains the main library of Linux information including HOWTOs,
    book-length guides, manual (man) pages, and lists of FAQs (Frequently Asked Questions).
    You can find these documents on the www.linuxdoc.org Web site.


    # Linux Loader (LILO)


    Used to boot the Linux kernel. The Linux loader is stored in your hard disk''s
    Master Boot Record (MBR).


    # Linux Today


    The daily digest of Linux information, which includes the latest developments
    in Linux software and security. You can find its Web site at www.linuxtoday.com.


    # LISA


    Linux Installation System Administration. A semigraphical configuration utility
    for Caldera Linux.


    # ln


    The link command. Creates a second file that is linked to the first. When you
    edit one linked file, the changes are also seen in the other file. When you run
    a file linked to a script or a program, Linux runs that script or program.


    # local area network (LAN)


    A group of two or more computers connected together for data exchange.


    # locate


    A command that searches through a database of files on your computer. This database
    may not reflect the latest changes that you''ve made to your system.


    # logical drive


    A division of an extended partition set up as a volume. You can set up a Linux
    directory to mount on a logical drive.


    # login


    A category of user mode programs. Associates a user''s ID with a shell and other
    personalized settings.


    # login shell


    The shell or command-line interpreter that starts by default when a user logs
    in to a Linux account.


    # lpc


    The line printer control command allows you to manage communication between Linux
    and your printer.


    # lpd


    The line printer daemon is an application resident in memory that awaits print
    related commands.


    # lpf


    A text filter that you can specify in your /etc/printcap printer configuration
    file.


    # lpq


    The line printer query command returns your current print queue or the jobs that
    are currently waiting for other jobs to be completed on your printer.


    # lpr


    The line printer request command is a print client that requests print service
    from the line printer daemon.


    # lprm


    The line printer remove command allows you to remove jobs currently stored in
    your print queue.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# ls


    The command used to list the contents of a directory.


    # lsmod


    The command that lists drivers currently loaded on your system.


    # major.minor.patch


    The standard format for Linux kernel release version numbers. Currently, Linux
    is on its second major release. "Minor" releases are also significant. An odd
    numbered minor release of a kernel is beta software, and is not suitable for production.
    The patch number reflects minor changes to the kernel.


    # man


    The command that calls up manual pages. For example, if you want to see the manual
    page for the cd command, type man cd.


    # MAN


    See metropolitan area network.


    # Mandrake


    A Linux distribution based on Red Hat Linux.


    # map


    A Linux command that specifies the location of your Linux partitions.


    # Master Boot Record (MBR)


    The first area read on your hard disk, which locates operating systems on your
    hard disk by their primary partition or logical drive.


    # MBR


    See Master Boot Record.


    # mcopy


    A Linux command that allows you to copy files to or from an MS-DOS directory.
    The syntax and output matches what you would get from the MS-DOS copy command.
    You can even use this on an unmounted floppy drive.


    # mdir


    A Linux command that lists files in an MS-DOS directory. The output is what you
    would get from the MS-DOS dir command. You can even use this on an unmounted floppy
    drive.


    # metropolitan area network (MAN)


    Two or more LANs, connected in a fairly small geographic area, that are administered
    as one unit.


    # mget


    An FTP command for copying files from a server.


    # Minix


    An operating system developed by Andrew Tannenbaum in 1986 as a clone of Unix.


    # mmove


    A Linux command that allows you to move files to or from an MS-DOS directory.
    The syntax and output matches what you do with the MS-DOS move command. You can
    even use this on an unmounted floppy drive.


    # mkdir


    The Linux make directory command.


    # mke2fs


    The Linux command to format volumes to the second extended file system; also known
    as ext2fs.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# mkswap


    The Linux command to format a swap partition.


    # more


    A command that allows you to view the contents of a file, one screen or “page”
    at a time.


    # mount


    The Linux command that''s required before you can access any storage device. For
    example, you can mount a CD-ROM on some Linux distributions with the mount -t
    iso9660 /dev/cdrom /mnt/cdrom command.


    # mount point


    The directory where a certain partition or logical drive is to be mounted.


    # mouseconfig


    The Red Hat Linux configuration utility for your mouse.


    # multitasking


    The ability to run more than one program or process simultaneously.


    # multiterminal


    The ability to access a single Linux computer from more than one terminal. The
    multiterminal characteristic of Linux enables multiple users to log on simultaneously.


    # mv


    The Linux move command that effectively changes the name and possibly the location
    of a file.


    # nameserver


    A computer with a database of names and IP addresses. Also known as the Domain
    Name Service (DNS) server. It is based on the Berkeley Internet Name Daemon (BIND).


    # network


    Any group of two or more computers set up to exchange information. Network modules
    set up the communication. Because network modules are located in the same area
    as the kernel, their failure can mean that you have to reboot Linux.


    # Network File System (NFS)


    The Network File System is the standard protocol to connect two or more Linux
    or Unix computers in a network.


    # network mask


    An IP address that helps you define a range of IP addresses on a single local
    area network. Also known as a subnet mask.


    # Network Time Protocol


    The TCP/IP protocol associated with synchronizing the time between computers.


    # newusers


    A command designed to process a large number of users and passwords from a batch
    file.


    # NFS


    See Network File System.


    # nice


    A command that allows you to start a program with a specific priority level.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# nroff


    A Linux formatting tool where commands are embedded in text files. Linux manual
    (man) pages are created with this tool.


    # of


    Output filter. Associated with the /etc/printcap printer configuration file. Specifies
    the filter to be used for the first in a series of print jobs.


    # open source


    A method and a license for releasing software. Open source software is freely
    redistributed and includes the source code. Modifications to open source software
    must be made by "patch" to preserve the integrity of the original software. The
    open source license is not specific to any product.


    # Open Source Initiative (OSI)


    A group started by Eric Raymond in 1998 to defend "free software." The OSI has
    its own license that is slightly less restrictive than the GPL. See also open
    source.


    # other


    A parameter found in the /etc/lilo.conf file that specifies a non-Linux operating
    system.


    # partition


    A logical part of a hard drive.


    # password


    The combination of letters and numbers that you use for a specific user name.
    Passwords that are a combination of numbers and uppercase and lowercase letters
    are strongly encouraged.


    # SPATH


    A Linux variable that specifies the directories where Linux automatically looks
    for a command. If a directory is not located in your $PATH variable, you need
    to specify the absolute path to run a program or script from that directory.


    # PCI


    Peripheral Component Interconnect. A standard for peripherals that you can install
    inside your computer.


    # PCL


    See Printer Control Language.


    # pico


    Pine composer. A text editor for Linux.


    # PID


    Process identifier. If you want to kill a program, you need its PID. You can find
    PIDs with the appropriate ps command.


    # pine


    Program for Internet News and Email. A Linux email reader developed at the University
    of Washington.


    # pipe


    A Linux command construct that uses the |, where the standard output to one command
    is directed as standard input to a second command.


    # Plug-and-Play


    The capability of a computer BIOS and/or operating system to automatically assign
    or configure communication channels with various components and peripherals.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# PostScript


    The printer language developed by Adobe for communication with printers.


    # primary partition


    A partition that can include a Master Boot Record. You can set up a Linux directory
    to mount on a primary partition. Each hard disk can be configured with up to four
    primary partitions.


    # Printer Control Language (PCL)


    The language developed by Hewlett Packard for communication with printers.


    # printtool


    Red Hat''s printer configuration utility.


    # private IP addresses


    The range of IP addresses that cannot be assigned on the Internet. Private IP
    addresses are intended for use on private LANs that are connected to the Internet.


    # ps


    The process status command that shows currently running programs and utilities.
    Commands such as ps aux return all programs and daemons currently running on your
    Linux computer. It also outputs PIDs, which you can use to identify and kill programs
    of your choice.


    # pseudoterminal


    A virtual console that you can access from a remote computer over a network connection.


    # pwd


    The Linux command that returns your present working directory.


    # RAM


    Random access memory. The main memory inside your computer.


    # rawrite


    An MS-DOS based Linux utility. The rawrite utility is primarily used to unpack
    the files from Linux images, such as boot.img, to a floppy disk.


    # Raymond, Eric


    The founder of the Open Source Initiative, which is the group behind the open
    source license.


    # rc.d


    The directory containing various files and scripts to be loaded at different run
    levels. These scripts are usually divided by run levels linked to actual scripts
    in the init.d directory.


    # read error


    An error associated with poor media, such as a defective floppy disk.


    # reboot


    The reboot command halts current programs before rebooting your computer. Commonly
    associated with run level 6. When you run the reboot command, Linux initializes
    the halt run level (0) before restarting your computer.


    # Red Hat


    Perhaps the most widely known Linux distribution.


    # refresh rate


    The number of times information is resent to your monitor every second.


    # relative path


    The path to a Linux file or directory that is relative to your current working
    directory.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# renice


    A command that allows you to raise or lower the priority associated with a currently
    running program.


    # rescue disk


    A disk, usually a 1.44MB floppy, that you can use to boot your computer into Linux.
    Often used when you have problems with your LILO or Master Boot Record.


    # restoreb.exe


    A utility that you can use to restore a Master Boot Record from a backup stored
    in a rootboot.00x file (x is typically a number between 0 and 9).


    # rm


    The Linux remove command that deletes files. Depending on the switch you use,
    this command can also delete directories. In the /etc/printcap printer configuration
    file, rm is a parameter that specifies the hostname or IP address of the computer
    with a remote printer.


    # rmdir


    The remove directory command. This command does not work if the directory that
    you are trying to delete is not empty.


    # rmmod


    The command that removes drivers currently loaded on your system.


    # rootboot.00x


    A backup file for your Master Boot Record (MBR), where x is a number between 0
    and 9. You can set up fips to create this file from the information on your MBR.
    If you need to restore your MBR for any reason, you can then use the restoreb.exe
    command.


    # run level


    A parameter defined in the /etc/inittab file that defines different processes
    and daemons. Different run levels are associated with different conditions in
    Linux, such as single- or multiuser mode.


    # Samba


    The network program that allows computers running Linux to communicate with computers
    running Microsoft Windows.


    # Sax


    The S.u.S.E. GUI configuration tool.


    # ScanDisk


    The Microsoft Windows utility for checking for errors on hard disks.


    # SCSI


    Small Computer Systems Interface. A type of connector for disk drives and other
    peripherals.


    # sd


    Spool directory. Specifies the location of spool files prior to processing by
    your printer. Associated with the /etc/printcap printer configuration file.


    # sendmail


    The Linux-based mail transport agent, which allows you to set up mail servers.


    # setleds


    The command to set keyboard defaults, such as Num Lock, for different virtual
    terminals.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# shadow


    The /etc/shadow file is the encrypted password file.


    # shell


    A command interpreter. The most commonly known Linux shell is known as *bash*,
    which was developed from the original Unix Bourne shell.


    # shell variable


    A variable that may change from shell to shell.


    # shutdown


    A command that shuts down Linux. Depending on the switch you use, this command
    can halt or reboot your computer.


    # single sequential user system


    An operating system where only one user can log on at a time. The system is limited
    to a single terminal.


    # single user


    A run level where only one user can run programs in Linux. Commonly associated
    with run level 1 or S. If you boot into single-user mode, no login is required,
    and you have root privileges.


    # Slackware


    A Linux distribution with a ZipSlack package option for the Zip drive.


    # srm.conf


    The Apache configuration file that defines subdirectories used by people who browse
    your Web site.


    # Stallman, Richard


    The founder of the Free Software Foundation and the GNU General Public License
    (also known as *copyleft*).


    # Stampede


    A Linux distribution that focuses on ease of use and the newest processor hardware.


    # Star Office


    A suite of office programs owned by Sun Microsystems. It is available for free
    download for Linux.


    # startx


    The command that starts the Linux graphical user interface (GUI); also known as
    the *X Window*.


    # stderr


    Standard error, usually to the monitor.


    # stdin


    Standard input, usually from the keyboard.


    # stdout


    Standard output, usually to the monitor.


    # stty


    Standard Linux terminal line settings.


    # subnet mask


    See network mask.


    # sudo


    See superuser.


    # SuperProbe


    A command that detects key parts of your video controller.


    # superuser


    When a regular user wants root privileges on a Linux computer, he or she can log
    on as a superuser with the root user''s password. Also known as *sudo*.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# S.u.S.E.


    The best selling Linux distribution in Europe. Depending on the version, S.u.S.E.
    Linux includes up to six CDs.


    # SVGA


    Super VGA or Super Video Graphics Adapter. A type of generic video server.


    # swap partition


    A volume on your hard disk that is set up for overflow from RAM. If the RAM in
    your computer is not sufficient, less-used information is moved to the swap partition.


    # swapon


    A Linux command to activate a file as a swap file.


    # system message logging


    The process of collecting messages about one or more daemons.


    # table


    A parameter associated with the /etc/lilo.conf configuration file. Defines a logical
    volume, such as hda1, associated with an operating system.


    # tail


    A command that gives you a view of the final few lines of a file.


    # tar


    A command that collects (or extracts) a series of files into a one file archive.


    # telnet


    An application available on many operating systems including Linux and Microsoft
    Windows, which allows you to log in remotely to a Linux server.


    # TeX


    A typesetting language based on macros embedded in text files.


    # thrashing


    What you hear when Linux spends a lot of time exchanging information between your
    RAM and a swap partition on your hard disk. Thrashing is the sound made by the
    constant motion of a hard disk. This is characteristic of insufficient RAM.


    # tkinfo


    An X Window version of the info command.


    # top


    This command lists the programs and utilities in order of their load on your system
    resources, especially CPU and RAM.


    # Torvalds, Linus


    The main developer of the kernel at the core of the Linux operating system.


    # Trojan horse


    A malicious program that is usually set up to look like a regular program or command.


    # umask


    The command used to set up default permissions for any files and directories that
    you subsequently create.


    # umount


    This Linux command unmounts any directory that you may have previously mounted.


    # uninterruptible power supply (UPS)


    A power source that starts when you have a power failure. It supplies'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'temporary power to your computer. The /etc/inittab file is normally configured
    to shut down Linux in a short number of minutes after receiving a signal from
    your UPS.


    **Universal Serial Bus (USB)**

    A type of peripheral. Support for at least USB mice and keyboards is being incorporated
    into Linux kernel 2.4.


    **Unix**

    The operating system developed in the late 1960s and early 1970s at AT&T''s Bell
    Labs. The functional ancestor to Linux.


    **UPS**

    See uninterruptible power supply.


    **USB**

    See Universal Serial Bus.


    **useradd**

    A command that automates the creation of users in Linux based on the defaults
    shown when you run the useradd -D command.


    **userdel**

    A command that deletes a specific user including his or her home directory and
    entry in the /etc/passwd configuration file.


    **user mode**

    User mode programs and applications communicate with the kernel. The kernel then
    communicates requests to your hardware. If a user mode program fails or crashes,
    Linux still runs, and you need not reboot your computer.


    **user name**

    The name that you use at the login: prompt to access an account.


    **utilities**

    Commands used inside a shell.


    **vertical resolution**

    The number of horizontal lines shown on a monitor.


    **VFAT**

    Virtual File Allocation Table. A system used to format volumes to be read by Microsoft
    operating systems.


    **vi**

    A basic Linux text editor.


    **video controller**

    A computer card with independent processing capability that manages graphics for
    display on your monitor.


    **video memory**

    The memory on your computer that is dedicated to graphics. Usually resident on
    a video controller.


    **video RAM**

    See video memory.


    **video server**

    The type of video controller resident on your computer.


    **virtual console**

    Every terminal where a user can log on to Linux, locally or remotely, is a virtual
    console.


    **virtual display**

    Hidden GUI screens where you can open and store other applications.


    **vmlinuz**

    A common file name for the Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '**VMware**

    A third-party application that allows you to run Microsoft Windows operating systems
    inside a Linux X Window (or vice versa).


    **w**

    A command to show currently logged on users and their current activities.


    **WAN**

    See wide area network.


    **wc**

    A command that allows you to count the lines, words, and characters in a file.


    **Webmin**

    A graphical installation utility for Caldera Linux, which you can use in a Web
    browser.


    **who**

    A Linux command to show currently logged on users.


    **wide area network (WAN)**

    Two or more geographically separate networks connected together.


    **Wide Open News**

    The electronic magazine of Linux sponsored by Red Hat. You can find its Web site
    at www.wideopen.com.


    **widget**

    A library program often associated with Linux window managers.


    **WindowMaker**

    A GNU window manager designed to be similar in feel to AfterStep.


    **WINE**

    Windows Is Not an Emulator.

    The WINE project is developing an emulator that you can run in Linux that runs
    various Microsoft Windows programs.


    **winmodem**

    A modem that substitutes Microsoft Windows driver libraries for some modem hardware
    controllers. Because this takes CPU resources, some Linux developers believe that
    it would be wrong to create Linux drivers for winmodems.


    **wildcard**

    A character such as * or ? that can represent other characters.


    **WordPerfect**

    A Corel WYSIWYG word processor that is available for Linux.


    **WYSIWYG**

    What-you-see-is-what-you-get. Used mainly in reference to graphical word processors.


    **X11**

    Another name for the X Window.


    **X Window**

    The Linux GUI.


    **Xconfigurator**

    The Red Hat GUI configuration tool.


    **xdm**

    The command that starts a GUI login screen.


    **xf86config**

    A text-based GUI configuration tool.


    **XF86Setup**

    The main GUI configuration tool from the XFree86 project.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# xfig


    An image editor used to create drawings. It is consistent with computer-aided
    design requirements.


    # XFree86


    The group that creates Linux drivers for video adapters. It also creates and maintains
    the XF86Setup program, which is the main utility for configuring the Linux GUI.


    # xinfo


    An X Window version of the info command.


    # .xinitrc


    The default startup script for the X Window. Normally stored in users'' home directories.


    # Xinu


    An operating system developed by Douglas Comer in 1983 as a Unix clone to help
    teach operating system structures in the classroom.


    # xman


    An X Window version of the man command.


    # YaST


    Yet another Setup Tool. The S.u.S.E. graphical administration utility.


    # YaST2


    Yet another Setup Tool Number 2. The next S.u.S.E. graphical administration utility.
    Works together with YaST to administer a system for the S.u.S.E. distribution.'
  merge: -1
  img_proc: true
