    to a third file with the runner crabgrass 2> otherfile command.

    +   c. Stderr can be redirected to a file. If you have a number of input terms
    in the text file crabgrass and a script named runner, you can direct the error
    to a third file with the runner crabgrass >> logfile command.

    +   d. Stdin can be redirected from a file. Stdout can also be redirected to another
    file. If you have a number of input terms in the text file crabgrass and a script
    named runner, you can execute the runner < crabgrass > otherfile command.


    Answer d is correct. You can direct standard input (stdin) from a file with the
    left arrow (<) switch. You can direct standard output (stdout) to a file with
    the right arrow (>) switch.'
