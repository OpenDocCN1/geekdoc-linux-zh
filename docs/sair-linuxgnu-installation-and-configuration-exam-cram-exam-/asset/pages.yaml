    The CD-ROM is in the slave position of the secondary controller. Windows 2000
    is installed on the first partition of the first hard disk of the primary controller.
    S.u.S.E. Linux 7.0 is installed on the first partition of the first hard disk
    of the secondary controller. Which of the following groups of commands would properly
