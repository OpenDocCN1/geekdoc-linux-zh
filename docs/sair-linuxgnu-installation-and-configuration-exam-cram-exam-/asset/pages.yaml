- pgno: 100
  md: 'path. Therefore, answer c is incorrect. And although /mnt/cdrom is the standard
    installation directory in most Linux distributions, it does not correspond to
    the command in the question. Therefore, answer d is incorrect.


    # Question 5


    Your friend plans to install Linux as a networked system for a dozen users in
    her small business. She might extend this system to run the business Web site,
    which would involve increasingly large log files to track users'' buying habits.
    Little growth in personnel is expected, and she wants to limit the space dedicated
    to her users'' personal files. She also plans to upgrade Linux fairly frequently
    and does not want to have to reload key applications, such as Star Office. Which
    of the following procedures is best for her situation? Hint: When you evaluate
    these answers, don''t forget the needs of the swap disk. And each computer includes
    only one physical hard drive.


    +   a. Divide the hard disk into a combination of primary partitions and logical
    drives. Make sure that the /opt, /var, /home, and / directories are mounted on
    different volumes.

    +   b. Divide the hard disk into volumes composed of several primary partitions.
    Make sure that the /opt, /var, /home, and / directories are mounted on different
    volumes.

    +   c. Divide the hard disk into several separate volumes. Make sure that the
    /bin, /usr/bin, and /boot directories are each mounted on individual volumes.

    +   d. None of the above.


    Answer a is correct. You need the /opt directory on a separate volume to save
    your applications when you upgrade Linux. You need the /var directory on a separate
    volume so log files from the Web site don''t overwhelm your computer. You need
    the /home directory on a separate volume if you want to limit the amount of space
    taken by each user''s personal files. Any directory not part of a separate volume
    is automatically installed in the root directory''s (/) volume. With the swap
    disk, this option requires five different volumes. Because you can''t have more
    than four primary partitions, answer b is incorrect. And because the directories
    listed in answer c don''t meet any of the requirements listed in the question,
    it is also incorrect.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Question 6


    Which of the following drivers is definitely not associated with a CD-ROM drive?


    +   - a. /dev/sdd

    +   - b. /dev/sbpcd

    +   - c. /dev/hdb

    +   - d. /dev/hda3


    Answer d is correct. It is actually the third primary partition on the first regular
    hard disk. CD-ROMs are generally not split into separate volumes. The /dev/sdd
    driver is for the fourth SCSI drive. Because it does not list a volume number,
    it may be a CD-ROM drive. Therefore, answer a is incorrect. The /dev/sbpcd driver
    is the CD-ROM attachment to an older Sound Blaster card; therefore, answer b is
    incorrect. Because the /dev/hdb drive is a common device for a CD-ROM on a computer
    that also has a regular hard disk, answer c is incorrect.


    # Question 7


    Which of the following file systems is not "real"?


    +   - a. /bin

    +   - b. /opt

    +   - c. /root

    +   - d. /proc


    Answer d is correct. The /proc file system does not list any actual files. Instead,
    it lists currently running programs and kernel routines. The /bin file system
    includes many standard Linux utilities, so answer a is incorrect. The /opt file
    system is where many applications are installed, so answer b is incorrect. Because
    the /root file system is the home directory for the root user, answer c is incorrect.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Question 8


    Which of the following programs can you use to manage the configuration of your
    monitor and video card on most any Linux distribution?


    +   - a. XF86config

    +   - b. XF86Setup

    +   - c. xf86setup

    +   - d. XConfigurator


    Answer b is correct. The XF86Setup tool is the product of the XFree86 group, which
    can help you configure your monitor and video card. Although there is an xf86config
    tool, you can''t access it from the command line by typing "XF86config". Because
    Linux commands are case sensitive, answer a is incorrect. For similar reasons,
    there is no xf86setup tool. Therefore, answer c is incorrect. The XConfigurator
    tool is currently available only in Red Hat Linux, so answer d is incorrect.


    # Question 9


    Which of the following answers affect memory requirements when you configure your
    video card in Linux? [Check all correct answers]


    +   - a. Horizontal frequency

    +   - b. Resolution

    +   - c. Number of colors

    +   - d. Monitor size


    Answers b and c are correct. The resolution is an expression of the number of
    pixels that your video card can show on your screen. Each color that you add requires
    additional data. It takes more data to fill more pixels and colors. Although the
    horizontal frequency tends to increase with a higher graphic mode and number of
    colors, it is not a reason that your video card needs more memory. Therefore,
    answer a is incorrect. Although the size of your monitor is normally associated
    with more pixels, some larger monitors simply have larger pixels. Therefore, the
    monitor does not change the graphic mode that you set for your video card, and
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Question 10


    If you''re not careful when you set up your video card and monitor, you could
    easily break the monitor. Which of the following answers describe the factors
    that you need to consider to avoid trouble? [Check all correct answers]


    +   - [ ] a. Make sure your graphics requirements don''t exceed the memory available
    in your monitor.

    +   - [ ] b. Make sure you don''t exceed the horizontal frequency limits of your
    monitor.

    +   - [ ] c. Make sure your graphics requirements don''t exceed the available
    memory in your video card.

    +   - [ ] d. Make sure you don''t exceed the vertical frequency limits of your
    video card.


    Answer b is correct. If you exceed the frequency limits of some monitors, your
    settings could break the circuitry inside your monitor. Monitors have no memory,
    so answer a is incorrect. Because tools like XF86Setup don''t allow you to set
    graphic modes or frequencies that exceed the capabilities of your video card,
    answers c and d are incorrect.'
  merge: -1
