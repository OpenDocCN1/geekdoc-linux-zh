    # Question 8


    Which of the following features allows you to move between displays in a window
    manager?


    +   - a. Virtual console

    +   - b. Ctrl+Alt+F2

    +   - c. Pager

    +   - d. Unused video memory


    Answer c is correct. A pager allows you to move between virtual displays in your
    window manager. Virtual consoles allow you to move between different text-based'
