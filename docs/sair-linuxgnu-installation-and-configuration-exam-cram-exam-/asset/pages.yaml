- pgno: 267
  md: 'As there are text-based and graphical command utilities in Linux, there are
    text-based and graphical applications in Linux. Linux text-based applications
    use *markup* languages to achieve the same graphical results that you get from
    WYSIWYG (what-you-see-is-what-you-get) document processors. Many Linux devotees
    prefer markup languages because they give the user a greater degree of control
    of the output. In this chapter, you''ll examine different graphical and text-based
    applications for text editing, word processing, and graphics.


    # The Linux WYSIWYG Debate


    The comparison between WYSIWYG document processors and text-based markup languages
    is similar to the comparison between graphical user interface (GUI) and command-line
    interface (CLI) tools. In other words, although WYSIWYG processors are easier
    to use, text-based editors, with the help of markup languages, can theoretically
    do more. As with the CLI, it takes more time to learn text-based markup languages
    compared to learning GUI WYSIWYG document processors. There are also additional
    cycles of testing to check the result when you use markup language commands.


    # WYSIWYG Applications


    The WYSIWYG document processor dominates the general market. Commercial examples
    of WYSIWYG processors include Microsoft Word, Corel WordPerfect, Vista Source''s
    Applixware Words, and Sun''s Star Office Write. All but Microsoft Word are currently
    available for Linux. With all of these applications, what you see on your screen
    is what you get when you print the file.


    The problem with WYSIWYG applications is that you can''t take full advantage of
    their capabilities unless you save their data files in binary format. Each of
    these applications has a different binary format; for example, you need a converter
    to transfer Microsoft Word files into Corel WordPerfect software. Because each
    WYSIWYG application has different capabilities, the formatting that you apply
    to a Microsoft Word file (fonts, underlining, bolding, and so forth) may be lost
    when you convert it to WordPerfect format.


    If you use a WYSIWYG application to edit a Linux configuration file, you have
    to make sure to save it in text format. If you accidentally save a critical configuration
    file, such as /etc/inittab, in binary format, you won''t be able to restart Linux.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_267_0.png)


    > If you use a WYSIWYG application on a Linux configuration file, be sure to save
    it in text format. Test the result with the cat command. Saving files in anything
    but text format (e.g., .doc, .wpd) causes problems for you the next time you need
    that file.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Markup Languages


    A combination of a markup language with a text editor is a popular alternative
    in scientific and academic circles. With markup tools, you can manage fonts, graphics,
    and so on in what you print from a text file. Examples of text-based markup languages
    include nroff, groff, TeX, LaTeX, and HTML. With each of these languages, the
    text you enter is shown in one generic font. Markup commands change the appearance
    of your text only when printed. An example of the look of a text-based markup
    language is shown in the following HTML code from the Momma Bears'' Bears Web
    site at www.mommabears.com:


    ```

    <body>

    <div align="center"><center>

    <table border="0" cellpadding="0" cellspacing="0" bgcolor="#00FFFF">

    <tr>

    <td><p align="center"><font size="3" color="#9A3A9A">

    <strong>Welcome to Momma Bears'' Bears... <br>

    Your online source for collectible bean bag bears!</strong>

    </font>

    </td>

    </tr>

    </table>

    </center></div>

    ```


    The markup commands are shown in angle brackets <> and are applied to the text
    and background of the printed page shown on the Momma Bears'' Bears Web site.
    With true markup languages, you can set up files in any text editor, such as vi
    or emacs. Although some older word-processing programs, such as WordPerfect versions
    5.0 and 5.1, used markup languages, they also saved files in binary format.


    # Document Processing Managers


    If you''re used to Microsoft Windows, you can still have the advantages of WYSIWYG
    document processors, such as Microsoft Word. There are three major commercial
    document processors available for Linux: Corel WordPerfect, Sun Star Office Write,
    and Vista Source Applixware Words. These are all part of "office suites," which
    include graphical and spreadsheet applications. They also include converters that
    allow you to exchange data. Because each of these suites is also available for
    Microsoft Windows, it is possible to use one of these suites to help ease the
    transition of converting from Windows to Linux.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '> The advertising behind some office suites suggests that you can use their
    converters to work seamlessly with Microsoft Office files. Before you entrust
    critical files to this feature, test it out for yourself. As of this writing,
    the source code for Microsoft Office is not public. The capability of converters
    to carry all formatting between office suites is less than perfect. If you use
    features such as embedded comments, you may be disappointed.


    There are also native Linux office suites available for the GNOME and KDE desktops,
    known as GNOME Office and KOffice. Because neither of these suites is available
    for Microsoft Windows, they are more suitable for native Linux users. Nevertheless,
    you can also use their importers and exporters to exchange data with the corresponding
    Microsoft Office applications.


    # WordPerfect


    Corel WordPerfect for Linux is a full-featured WYSIWYG word processor that you
    can download from the http://linux.corel.com Web site free of charge. Multiuser
    versions can be purchased from Corel. WordPerfect for Linux also comes as part
    of the WordPerfect Office suite of applications, which includes a spreadsheet
    (Quattro Pro), presentation manager, and a database program (Paradox).


    As discussed in Chapter 5, Corel also has a Linux distribution designed to be
    friendly to newer Linux users.


    # Star Office


    The Star Office suite is a fully featured Linux office suite, currently owned
    by Sun. Among other things, it includes a word processor, a spreadsheet, presentation
    and mail managers, and a scheduler. Because it was originally developed in Germany,
    Star Office is more commonly seen with the KDE window manager, which was also
    developed in Germany. You can download the full office suite for Linux or Windows
    free of charge from www.staroffice.com.


    # Applixware


    Vista Source is a Linux-based subsidiary of Applix, which also has a fairly complete
    package of office applications. Applixware Office includes a word processor, a
    spreadsheet, a presentation manager, graphics, and a mail manager as well as a
    database program. Its SHELF tools allow you to program different features into
    any of its applications. You can download the full Applixware Office suite from
    www.vistasource.com.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# KOffice


    The KDE Office suite of applications, known as KOffice, includes a similar package
    of applications to Star Office and Applixware Office. The KWord application is
    similar to FrameMaker. Unlike other office suites, it uses the text-based ispell
    spell-checking application. KOffice can be easily incorporated into the KDE window
    manager. You can download the full KOffice suite from www.koffice.org


    # GNOME Office


    The GNOME Office suite of applications also includes a similar package of applications
    to Star Office and Applixware Office. The GNU project didn''t develop all of its
    office applications: GNOME Office incorporates Source Gear''s AbiWord as its document
    processor. GNOME Office can be easily incorporated into the GNOME window manager.
    You can link the download locations for each of the components of GNOME Office
    through the www.gnome.org/gnome-office Web site.


    # Text Processing Managers


    One of the minimum requirements for Sair Linux/GNU certification is basic knowledge
    of one of the major command-line text editors, such as joe, pico, vi, or emacs.
    These are critical tools to the Linux administrator. As text processing managers,
    these tools can help you edit and manage Linux configuration files seamlessly.
    Perhaps the most important of these editors is vi, because it''s usually the only
    editor available when you need to use your emergency disk to recover from a system
    failure.


    You can also use a text processing manager with a markup language to format documents.
    Many Linux users believe that markup languages, such as TeX, LaTeX, nroff, groff,
    and HTML, provide superior capabilities when compared to WYSIWYG applications.
    You can apply the ispell spell checker to any text-based file created with one
    of these editors.


    # vi


    There are two modes to the vi editor: command and insert. In command mode, you
    can move around a text document, delete, copy, paste, or move lines of text. You
    can also search for specific text strings and even run other text commands in
    the Linux shell. In insert mode, you can add text to a document.


    You can edit a file with the vi filename command. If the file name you choose
    does not exist, vi creates it for you when you save and exit from this editor.
    Some vi commands are shown in Table 13.1.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '| Command | Description |

    |---|---|

    | cw | Deletes the current word and enters insert mode |

    | dd | Deletes the current line |

    | i | Enters insert mode |

    | I | Enters insert mode at the beginning of the current line |

    | o | Enters insert mode by starting a new line below your current position |

    | p | Puts "yanked" text after the current cursor location; similar to "paste"
    in most word processors |

    | q | Exits from vi |

    | r | Replace; the next character that you type replaces the current character
    |

    | u | Undo; reverses the last change |

    | w | Writes the file |

    | yy | Yanks (copies) the current line into the local buffer; works with the p
    command |

    | Esc | Exits from insert mode |

    | /test | Searches for the word test in the current file |


    *In older versions of vi, you can''t use the arrow keys on your keyboard. The
    only way to move the cursor around a file is with the h, j, k, and l keys, which
    correspond to the left, down, up, and right arrows.*


    The vi editor has a large number of commands and other features. The commands
    shown in Table 13.1 represent a fraction of what is available.


    # ispell


    When you use a WYSIWYG document processor, you generally need a spell checker
    designed for that specific application. On the other hand, you can use the ispell
    application to check the spelling on any text file.


    Using ispell is easy; if your text file is named better, you can start the spell
    check with the ispell better command. The ispell application compares every word
    in the file with its own dictionary. If a word is not found, it is highlighted;
    optional spellings are shown when available.


    # Graphical Applications


    You can''t edit images with text editors. Linux includes a number of graphical
    applications for drawing and editing graphics including GIMP (GNU Image Manipulation
    Program) and xfig. GIMP is more of an image manipulation program, whereas xfig
    is a drawing program more suitable for engineering design work.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '*Note: The default compression algorithm in GIF files is LZW, named after its
    developers, Lempel, Ziv, and Welch. Because Unisys has started enforcing its copyright
    on LZW, a number of Linux users actually avoid using GIFs.*


    Linux graphical applications certainly aren''t limited to GIMP and xfig. Because
    Linux- or Unix-based applications are used to create, edit, and produce graphics-intensive
    movies, some would argue that graphical applications available for Linux are more
    capable than those available for any other operating system.


    # GIMP


    GIMP is an all-in-one image editor often compared to JASC''s Paint Shop Pro. You
    can use GIMP to draw, to manage images on different layers, to convert between
    graphical file formats, and to capture screen images. Most of the images for this
    book were captured using GIMP. As with other GNU applications, it is available
    free of charge, and in fact is included in the basic configuration of most current
    Linux distributions. You can review the GIMP editor in Figure 13.1.


    # xfig


    As GIMP is used to manipulate images, xfig is used to create images and drawings.
    It is set up in "fig" files, which specify levels, lines, and locations in a series
    of numbers in text format. This is consistent with files used by various Computer-Aided
    Design programs that use "wire frame" models. Numeric data, such as that found
    in xfig files, is suitable for Computer-Aided Manufacturing. To use xfig, you
    need a three-button mouse or at least a setup that emulates a three-button mouse.
    You can review the xfig application in Figure 13.2.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_272_0.png)


    Figure 13.1 GIMP version 1.1.13.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_273_0.png)


    Figure 13.2 xfig version 3.2.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Practice Questions


    # Question 1


    Which of the following is a reason to prefer text-based editors over WYSIWYG document
    processors? The appearance of the final printed document is important.


    +   - a. Text editors don''t corrupt your screen with graphical images.

    +   - b. Text editors require you to insert a number of commands for the fonts
    and background that you see in the printed document.

    +   - c. Text editors allow you to edit Linux configuration files without concern
    for the format that you use to save these files.

    +   - d. Text editors are much simpler to use because they don''t have all the
    pull-down menus associated with WYSIWYG editors.


    Answer c is correct. If you use a text editor, then by definition, your files
    are saved in text format. Linux can only read its configuration files in text
    format. Although answer a is a true statement, the capability to embed graphical
    images in WYSIWYG documents is an advantage for these graphical document processors.
    Therefore, answer a is incorrect. Even though answer b is a true statement, the
    commands that you need to format a text document can be difficult to learn. Therefore,
    answer b is incorrect. Although answer d is nominally true, you have to use markup
    language commands to format any text file. Therefore, answer d is incorrect.


    # Question 2


    Which of the following applications is a text editor?


    +   - a. groff

    +   - b. vi

    +   - c. HTML

    +   - d. LaTeX


    Answer b is correct. The vi editor is a text editor. Because groff, HTML, and
    LaTeX are markup languages for formatting text, answers a, c, and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Question 3


    Which of the following office suites can''t be used with Microsoft Windows?


    +   - a. KOffice

    +   - b. Star Office

    +   - c. WordPerfect

    +   - d. Applixware Office


    Answer a is correct. The KDE Office suite, known as KOffice, can''t be installed
    on Microsoft Windows. This is also true of the GNOME Office suite. However, because
    versions of Star Office, WordPerfect, and Applixware Office are available for
    Microsoft Windows, answers b, c, and d are incorrect.


    # Question 4


    What is the danger of using office suites, such as WordPerfect or Star Office,
    to edit configuration files, such as /etc/fstab?


    +   - a. Binary programs, such as WordPerfect, aren''t designed to edit text files.

    +   - b. Programs like Star Office save files at regular intervals. Once a program
    is saved at any interval, it isn''t possible to restore configuration files.

    +   - c. By default, WYSIWYG office suites save files in binary mode. Linux can''t
    read configuration files saved in binary mode, which causes failure when Linux
    is restarted.

    +   - d. There is no danger; you can use any kind of editor, WYSIWYG or text,
    to edit any Linux configuration file.


    Answer c is correct. WYSIWYG office suites do save files in binary mode. Linux
    configuration files have to be saved in text format, or Linux won''t be able to
    read these files. Because you can import text files into an office suite, answer
    a is incorrect. When office suites save files, they''re backing up your work in
    temporary files, not overwriting your current file. Therefore, answer b is incorrect.
    Although you can export and save files from WYSIWYG editors in text mode, it is
    not the default. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Question 5


    When you use the vi editor; which of the following commands changes your setup
    from insert mode to command mode?


    +   - a. Ctrl+Pg Up

    +   - b. o

    +   - c. /command

    +   - d. Esc


    Answer d is correct. Pressing the Esc key changes the mode in the vi editor from
    input mode to command mode. Because the Ctrl+Pg Up key combination switches between
    different configured graphics modes, answer a is incorrect. The o command opens
    up editing by opening a new line; therefore, answer b is incorrect. The forward
    slash indicates a search in the current document for the word command; therefore,
    answer c is incorrect.


    # Question 6


    Which of the following graphics applications is more suitable for image manipulation?


    +   - a. Star Office

    +   - b. GIMP

    +   - c. xfig

    +   - d. HTML


    Answer b is correct. GIMP is loaded by default in most Linux configurations. Although
    there is a Star Office application that helps you manipulate images, it is not
    installed by default like GIMP. Therefore, answer a is incorrect. You can manipulate
    images with xfig; however, it is not nearly as capable as GIMP for image manipulation.
    Therefore, answer c is incorrect. Because HTML is a markup language, answer d
    is incorrect.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Question 7


    How would you check the spelling of a document edited through the vi editor?

    The name of your document file is important.txt.


    +   - a. Open vi. Go into command mode. Type the s command to start the spell
    checker.

    +   - b. Open vi. Go into command mode. Type the ispell command to start the spell
    checker.

    +   - c. Go to your command-line interface. Type the ispell important.txt command.

    +   - d. Go to your command-line interface. Type the vi important.txt | ispell
    command.


    Answer c is correct. The ispell command works on any text file and is independent
    of the editor. The s command in vi deletes the current character and brings vi
    into insert mode; therefore, answer a is incorrect. The ispell command is used
    at the command-line interface; therefore, answer b is incorrect. Because the vi
    command opens that editor, the "pipe" (|) has nothing to send to the ispell command.
    Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Need to Know More?


    Gratzer, George. *First Steps in LaTeX*. Springer-Verlag, New York, NY, 1999.
    ISBN 0-81764-132-7. This book is a primer to the LaTeX typesetting system with
