- pgno: 33
  md: 'Exam taking is not something that most people anticipate eagerly, no matter
    how well prepared they might be. In most cases, familiarity helps to lessen test
    anxiety. In plain English, this means you probably won''t be as nervous when you
    take your fourth or fifth certification exam as you''ll be when you take your
    first one.


    Whether it''s your first exam or your tenth, understanding the details of exam
    taking (how much time to spend on questions, the environment you''ll be in, and
    so on) and the exam software will help you concentrate on the material rather
    than on the setting. Likewise, mastering a few basic exam-taking skills should
    help you recognize—and perhaps even outfox—some of the tricks and gotchas you''re
    bound to find in some of the exam questions.


    This chapter, besides explaining the exam environment and software, describes
    some proven exam-taking strategies that you should be able to use to your advantage.


    # The Exam Situation


    When you arrive at the testing center where you scheduled your exam, you''ll sign
    in with an exam coordinator. He or she will ask you to show two forms of identification,
    one of which must be a photo ID, and both should have your signature. After you''ve
    signed in and your time slot arrives, you''ll be asked to deposit any books, pagers,
    cell phones, bags, and other items you brought with you. Then, you''ll be escorted
    into a closed room. Typically, the room will be furnished with anywhere from one
    to half a dozen computers, and each workstation will be separated from the others
    by dividers designed to keep you from seeing what''s happening on someone else''s
    computer.


    You''ll be furnished with a pen or pencil and a blank sheet of paper or, in some
    cases, an erasable plastic sheet and an erasable felt-tip pen. You''re allowed
    to write down any information you want on both sides of this sheet. Before the
    exam, you should memorize as much of the material that appears on the Cram Sheet
    (inside the front cover of this book) as you can so you can write that information
    on the blank sheet as soon as you are seated in front of the computer. You can
    refer to your rendition of the Cram Sheet anytime you like during the test, but
    you''ll have to surrender the sheet when you leave the room.


    Most test rooms feature a wall with a large picture window. This permits the exam
    coordinator standing behind it to monitor the room, to prevent exam takers from
    talking to one another, and to observe anything out of the ordinary that might
    happen. The exam coordinator will have preloaded the appropriate Sair Linux/GNU
    certification exam—for this book, that''s the Installation and Configuration Level
    1 certification exam 3X0-101—and you''ll be permitted to start as soon as you''re
    seated in front of the computer.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'All Sair Linux/GNU certification exams allow a certain maximum amount of time
    in which to complete your work. (This time is indicated on the exam by an on-screen
    counter/clock, so you can check the time remaining whenever you like.) The exam
    consists of randomly selected questions, and you may take up to 60 minutes to
    complete the exam.


    The Installation and Configuration Level 1 certification exam 3X0-101 is computer
    generated and uses a multiple-choice format. Although this might sound simple,
    the questions are constructed not only to check your mastery of basic facts and
    figures about Linux technologies, but also to require you to evaluate one or more
    sets of circumstances or requirements. You might be asked to select the best or
    most effective solution to a problem from a range of choices, all of which technically
    are correct. Taking the exam is quite an adventure, and it involves real thinking.
    This book shows you what to expect and how to deal with the potential problems,
    puzzles, and predicaments.


    # Exam Layout and Design


    Some exam questions require you to select a single answer, whereas others ask
    you to select multiple correct answers. The following multiple-choice question
    requires you to select a single correct answer. Following the question is a brief
    summary of each potential answer and why it is either right or wrong.


    # Question 1


    Which command can be used with the appropriate parameters or switches to count
    the number of lines in a text file?


    ○ a. grep

    ○ b. wc

    ○ c. lc

    ○ d. cat


    The correct answer is b. The command wc -l will count the number of lines within
    a file. grep can be used to find strings, lc does not exist, and cat is used to
    display files. Therefore, all answers except b are incorrect.


    This sample question format corresponds closely to the Sair Linux/GNU certification
    exam format; the only difference on the exam is that questions are not followed
    by answer keys. To select an answer, position the cursor over the radio button
    next to the answer. Then, click the mouse button to select the answer.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Let''s examine a question that requires choosing multiple answers. This type
    of question provides checkboxes rather than radio buttons for marking all appropriate
    selections.


    # Question 2


    Which of the following are valid GUI configuration utilities? [Check all correct
    answers]


    +   - a. XF86Setup

    +   - b. xf86setup

    +   - c. xf86config

    +   - d. XF86Config


    The correct answers are a and c. XF86Setup is the standard GUI configuration utility
    from the XFree86 project. xf86config is the command line version of the XF86Setup
    utility. The other two options are not valid commands or configuration utilities.


    For this type of question, more than one answer is required. Such questions are
    scored as wrong unless all the required selections are chosen. In other words,
    a partially correct answer does not result in partial credit when the test is
    scored. If you are required to provide multiple answers and you do not provide
    the number of answers that the question asks for, the testing software will mark
    the question for you and indicate at the end of the test that you did not complete
    that question. For Question 2, you have to check the boxes next to items a and
    c to obtain credit for a correct answer. Notice that picking the right answers
    also means knowing why the other answers are wrong!


    Although these two basic types of questions can appear in many forms, they constitute
    the foundation on which all the Sair Linux/GNU certification exam questions rest.
    At any time, Sair can choose to include other questions involving exhibits, charts,
    or network diagrams to help document a Web site scenario that you''ll be asked
    to troubleshoot or configure. Paying careful attention to such exhibits is the
    key to success.


    # Using Sair''s Exam Software Effectively


    A well-known principle when taking exams is to first read over the entire exam
    from start to finish while answering only those questions you feel absolutely
    sure of. On subsequent passes, you can dive into more complex questions more deeply,
    knowing how many such questions you have left.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Fortunately, Sair''s exam software makes this approach easy to implement. At
    the top-left corner of each question is a checkbox that permits you to mark that
    question for a later visit.


    *Note: Marking questions makes review easier, but you can return to any question
    if you are willing to click the Forward or Back button repeatedly.*


    As you read each question, if you answer only those you''re sure of and mark for
    review those you''re not sure of, you can keep working through a decreasing list
    of questions as you answer the trickier ones in order.


    > TIP

    > There''s at least one potential benefit to reading the exam completely before
    answering the trickier questions: Sometimes, information supplied in later questions
    sheds more light on earlier questions. Other times, information you read in later
    questions might jog your memory about networking facts, figures, or behavior that
    will help with earlier questions. Either way, you''ll come out ahead if you defer
    those questions about which you''re not absolutely sure.


    Keep working on the questions until you''re certain of all your answers or until
    you know you''ll run out of time. If questions remain unanswered, you''ll want
    to zip through them and guess. Not answering a question guarantees you won''t
    receive credit for it, and a guess has at least a chance of being correct.


    > TIP

    > At the very end of your exam period, you''re better off guessing than leaving
    questions unanswered.


    # Exam-Taking Basics


    The most important advice about taking any exam is this: Read each question carefully.
    Some questions are deliberately ambiguous, some use double negatives, and others
    use terminology in incredibly precise ways. I have taken numerous exams—both practice
    and live—and in nearly every one I have missed at least one question because I
    didn''t read it closely or carefully enough.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    too quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    ahead impatiently, go back and start over.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - As you read, try to restate the question in your own terms. If you can
    do this, you should be able to pick the correct answers more easily.

    +   - When returning to a question after your initial read-through, read every
    word again; otherwise, your mind can quickly fall into a rut. Sometimes, revisiting
    a question after turning your attention elsewhere lets you see something you missed,
    but the strong tendency is to see what you''ve seen before. Avoid that tendency
    at all costs.

    +   - If you return to a question more than twice, try to articulate to yourself
    what you don''t understand about the question, why the answers don''t appear to
    make sense, or what appears to be missing. If you chew on the subject for a while,
    your subconscious might provide the details that are lacking or you might notice
    a ''trick'' that will point to the right answer.


    Above all, deal with each question by thinking through what you know about installation
    and configuration essentials. By reviewing what you know (and what you''ve written
    down on your information sheet), you''ll often recall or understand things sufficiently
    to determine the answer to the question.


    # Question-Handling Strategies


    Based on exams I''ve taken, some interesting trends have become apparent. For
    those questions that take only a single answer, usually two or three of the answers
    will be obviously incorrect, and two of the answers will be plausible; of course,
    only one can be correct. Unless the answer leaps out at you (if it does, reread
    the question to look for a trick; sometimes those are the ones you''re likely
    to get wrong), begin the process of answering by eliminating those answers that
    are most obviously wrong.


    Things to look for in obviously wrong answers include nonexistent commands, incorrect
    utility names, inconsistent conditions, and terminology you''ve never seen. If
    you''ve done your homework for an exam, no valid information should be completely
    new to you. In that case, unfamiliar or bizarre terminology probably indicates
    a totally bogus answer.


    Numerous questions assume that you understand the inner workings of Linux utilities
    inside and out. If your knowledge in these areas is well grounded, it will help
    you cut through many otherwise confusing questions.


    Budget your time by making sure you''ve completed one-quarter of the questions
    one-quarter of the way through the exam period and three-quarters of them three-quarters
    of the way through.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'If you''re not finished when 55 minutes have elapsed, use the last 5 minutes
    to guess your way through the remaining questions. Remember, guessing is potentially
    more valuable than not answering because blank answers are always wrong, but a
    guess can turn out to be right. If you don''t have a clue about any of the remaining
    questions, pick answers at random, or choose all a''s, b''s, and so on. The important
    thing is to submit an exam for scoring that has an answer for every question.


    # Mastering the Inner Game


    In the final analysis, knowledge breeds confidence, and confidence breeds success.
    If you study the materials in this book carefully and review all the practice
    questions at the end of each chapter, you should become aware of those areas where
    additional learning and study are required.


    Next, follow up by reading some or all of the materials recommended in the “Need
    to Know More?” section at the end of each chapter. The idea is to become familiar
    enough with the concepts and situations you find in the sample questions that
    you can reason your way through similar situations on a real exam. If you know
    the material, you have every right to be confident that you can pass the exam.


    After you''ve worked your way through the book, take the practice exam in Chapter
    15. This will provide a reality check and help you identify areas you need to
    study further. Make sure you follow up and review materials related to the questions
    you miss on the practice exam before scheduling a real exam. Only when you''ve
    covered all the ground and feel comfortable with the whole scope of the practice
    exam should you take a real one.


    Armed with the information in this book and with the determination to augment
    your knowledge, you should be able to pass the certification exam. However, you
    need to work at it, or you''ll spend the exam fee more than once before you finally
    pass. If you prepare seriously, you should do well. Good luck!


    # Additional Resources


    A good source of information about Sair certification exams comes from Sair itself,
    and the best place to go for exam-related information is online. If you haven''t
    already visited the Sair Web site, do so right now at www.linuxxcertification.com.


    The menu options on the home page point to the most important sources of information
    in the Web pages. Here''s what to check out, in order of importance:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - **Knowledge Matrix**—Use this area to review the skills and knowledge
    that will be tested on the exam.

    +   - **Online Quizzes**—This area includes sample questions for the four Sair
    Linux Certified Administrator exams. These questions are mostly useful for getting
    used to the question formats. They will not appear on the actual exam.

    +   - **Exams**—This page fully explains the certification process and contains
    links to objectives, sample questions, and the certification structure.

    +   - **FAQ**—This page lists frequently asked questions with answers about the
    exams.

    +   - **Our Team**—This page holds links to the Industry leaders and Sair personnel
    behind the exam.


    These are just the high points of what''s available in the Linux Certification
    pages. As you browse through them—and I strongly recommend that you do—you''ll
    probably find other informational tidbits mentioned that are every bit as interesting.


    # Coping with Change on the Web


    Sooner or later, all the information I''ve shared with you about the Linux Certification
    pages and the other Web-based resources mentioned throughout the rest of this
    book will go stale or be replaced by newer information.


    There''s always a way to find what you want on the Web if you''re willing to invest
    some time and energy. Most large or complex Web sites offer a search engine. Feel
    free to use general search tools—such as www.google.com, www.lycos.com, and www.excite.com—to
    search for related information. Although Sair offers the best information about
    its certification exams online, plenty of third-party sources offer information,
    training, and assistance in this area. The bottom line is this: If you can''t
    find something where the book says it lives, start looking around. If worst comes
    to worst, you can always email us at Coriolis. We just might have a clue.'
