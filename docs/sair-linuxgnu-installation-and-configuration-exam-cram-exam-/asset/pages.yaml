    +   c. You download some of the files from the FTP server directory including
    readme.txt and chapter2.doc.

    +   d. None of the files in the FTP server directory are downloaded.


    Answer c is correct. The listed command downloads only those files with a dot
    embedded in the file name. Although answer c is not complete (this command would
    also download the syslog.conf file), it is the only correct answer among the choices
    listed. Not all of the files in the FTP server directory include a dot. This command
