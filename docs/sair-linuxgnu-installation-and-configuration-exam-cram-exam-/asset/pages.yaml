- pgno: 88
  md: 'it limits certain risks to your system. For example, if you have log files
    that usually grow until they fill your disk, a special volume for log files prevents
    any overflow from affecting other data or programs on your system. To decide how
    you want to divide partitions on Linux, you first need to know about the different
    available file systems.


    In Linux, the way you can set up directories in different volumes is based on
    the Filesystem Hierarchy Standard (FHS).


    # Major Directories


    The FHS is designed to serve as a common template for directories in Linux and
    other related operating systems. As an administrator, it makes your job easier
    if you can always find the same directories in the same place on every Linux computer,
    irrespective of distribution.


    Every Unix-type system starts with a root directory. In general, Linux mounts
    other directories as shown in Table 4.2 on the root directory.


    Table 4.2 Typical Linux directories.*


    | Volume | Description |

    |---|---|

    | / | Represents the root directory. All other directories are under this directory
    in the file system hierarchy. Any directory that is not mounted in a separate
    volume is included in the root directory''s volume. |

    | /bin | Includes essential command-line utilities. Do not mount this volume separately.
    If you ever need to use your recovery disk, you won''t be able to get to these
    utilities. |

    | /boot | Contains Linux startup utilities. Includes almost everything that Linux
    needs to start, before it moves on to other directories for configuration files.
    Usually includes the Linux kernel. A separate boot partition generally does not
    have to be over 10MB. |

    | /dev | Lists all device drivers available to the system. For example, when you
    mount a floppy drive, you are typically mounting /dev/fd0 onto another directory.
    Do not mount this volume separately. |

    | /etc | Includes basic configuration files for the computer, such as password
    files, daemon settings, and X Window requirements. |

    | /home | Contains home directories for specific users. If you mount this volume
    separately, be sure to leave enough room for all of the users that you need now
    and in the future. |

    | /lib | Includes program libraries needed by the kernel and essential command-line
    utilities. Do not mount this volume separately. |

    | /mnt | Lists the mount point of removable media, such as floppies and CD-ROM
    drives. |'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Table 4.2 Typical Linux directories (continued).


    | Volume | Description |

    |---|---|

    | /opt | Includes any applications, such as WordPerfect or Star Office, that you
    might add after installing Linux. |

    | /proc | Contains all currently running kernel-related processes. |

    | /root | Contains the home directory for the root user. Do not mount this directory
    separately. |

    | /sbin | Includes many system administration commands. |

    | /tmp | Stores any temporary files. Generally, all files in this directory should
    be deleted whenever you reboot Linux. This is also a good location for downloaded
    files. |

    | /usr | Contains any small programs and data for all users. Includes many subdirectories.
    |

    | /var | Contains variable data; includes log files and print spools. |


    *For more detailed information on the standard components of the FHS, refer to
    the governing Web page at www.pathname.com/fhs.


    Know your Linux volumes. The root directory (/) stands above the others and is
    different from the /root volume. Be able to cite the kinds of files that are stored
    in each volume.


    You may choose to mount several subdirectories on their own volumes. Linux swap
    space is generally set up in its own volume. You can set up volumes to keep log
    files in your /var directory from crowding out all of your other Linux files and
    directories. You may also want to set up partitions for users'' home directories
    (/home) and larger programs (/opt), so you don''t overwrite them in the future
    when you upgrade your Linux system.


    Volumes in Linux include any primary partition or logical drive that you''ve formatted
    for Linux. Unlike a Microsoft system, volumes do not have names like "Desktop
    Drive". However, you can mount a directory on a specific volume.


    You can even mount subdirectories on a specific volume. For example, if you want
    to make sure that the owner of the mj account doesn''t increase his Netscape disk
    cache to an unreasonable size, you can set up a volume for the /home/mj/.netscape/cache
    directory.


    # Path Management


    When you describe the location of a file, there are absolute paths and relative
    paths. An absolute path describes the location of a file relative to the root
    (/).'
  merge: -1
  img_proc: true
