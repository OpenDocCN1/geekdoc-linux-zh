    +   - ✓ Text editors, vi

    +   - ✓ ispell

    +   - ✓ GIMP, xfig


    # Techniques you''ll need to master:


    +   - ✓ Understanding the difference between WYSIWYG and text editing

    +   - ✓ Describing the use of different markup languages in text files

