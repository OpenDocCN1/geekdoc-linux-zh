- pgno: 206
  md: '![](img/7a908c965299f9cdfda2a4ea3cd98bf4_206_0.png)


    # The X Window


    Terms you''ll need to understand:


    +   - startx, xdm

    +   - .xinitrc, Xsession

    +   - X11, XF86Config

    +   - X Server, Display Manager, Widgets

    +   - Window manager, applications

    +   - SuperProbe, xf86config, XF86Setup, Xconfigurator, SaX

    +   - GNOME, KDE, fvwm, Enlightenment, AfterStep, WindowMaker, Blackbox

    +   - Virtual display


    Techniques you''ll need to master:


    +   - Describing how the X Window starts

    +   - Understanding the structure of the X Server configuration file

    +   - Describing the five major X Window components

    +   - Locating different X11 configuration files and programs

    +   - Using various X Window configuration utilities

    +   - Describing characteristics of several window managers

    +   - Managing information inside X Windows'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'In this chapter, you work with the X Window, which is the Linux graphical user
    interface (GUI). The Linux X Window system is almost completely modular. It works
    from several different kinds of configuration files and utilities. The different
    window managers give you a different “look and feel” on your GUI desktop.


    # Starting the X Window


    You can start the X Window from the command-line interface, or you can set it
    to start automatically through your /etc/inittab configuration file. Whether you
    use the X Window start command startx or xdm (X Display Manager), the X Window
    start program uses configuration files based on your hardware. It then runs through
    systemwide and user-specific initialization files.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_207_0.png)


    The X Window is also known as X11.


    # X Window Start Commands


    There are two basic ways to start the X Window. You can log in at the command-line
    interface and use the startx command, or you can run the xdm command after login
    to start an X login window. If you have an init level dedicated to the xdm, you
    can set your /etc/inittab file to make sure that Linux starts at that run level.


    Because startx is a Linux script, you can look through it (with a text editor)
    for initialization files. If you''ve already set up xdm, its initialization files
    take precedence.


    In either case, startx or xdm first checks the user''s home directory for configuration
    files. If none are available, it then checks for systemwide initialization files,
    which are generally located in a subdirectory of the /etc/X11/xinit directory.


    *Note: Depending on your distribution, you may also be able to use commands like
    X to start your X Window.*


    # Configuration Files


    The key configuration file is /etc/X11/XF86Config, which sets up your mouse, keyboard,
    monitor, and video controller. Although Linux can detect the settings of many
    video controllers and monitors, you can often improve the performance of your
    system by customizing this file. The sample xf86config.eg file includes a guide
    to customizing /etc/X11/XF86Config, which can be divided into eight major sections:


    +   ► Files—Includes the file locations for colors and fonts.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - **ServerFlags**—Governs the response of your X Window to special commands.
    For example, you can exit the X Window by using Ctrl+Alt+Backspace. A *DontZap*
    command in this section disables this option.

    +   - **Keyboard**—Sets up the parameters for your keyboard. Includes settings
    for special keys as well as keyboard features, such as Num Lock and Auto Repeat.

    +   - **Pointer**—Sets up a pointing device, usually a mouse. Mouse options include
    protocol (Microsoft, PS/2, Logitech, etc.), speed in bits per second (baud), and
    three-button emulation.

    +   - **Monitor**—Sets the allowable horizontal and vertical frequency rates for
    your monitor. Setting this too high could overload your monitor. Also sets the
    refresh rate for your monitor.

    +   - **Device**—Provides settings for your video controller including allowable
    horizontal and vertical frequency rates.

    +   - **Screen**—Provides allowable and default graphics modes, which specify
    the number and dimensions of pixels shown on your monitor. Example modes are 640×480,
    800×600, and 1024×768.

    +   - **Xinput**—Provides settings for other input hardware, such as pens with
    graphic tablets, game adapters, and even touchscreens.


    Note: In Red Hat Linux, this key combination may have to be pressed twice.


    The preceding list just scratches the surface of possible options. A full list
    is available in the man page for the XF86Config file.


    Note: Three-button emulation allows you to use a two-button mouse where three
    buttons are required. When it''s on, you simulate a middle button by pressing
    the left and right buttons simultaneously.


    # Initialization Files


    There are two main initialization files. The xinitrc file is associated with startx,
    and the Xsession file is associated with xdm. The main initialization files in
    the /etc/X11/xinit directory are scripts that defer to corresponding files in
    users'' home directories. Once a choice is made, the initialization files call
    up other scripts that allocate resources, like memory, keyboard settings, window
    managers, and the XF86Config file.


    Note: If you have X Window initialization files in your home directory, they are
    probably hidden. You can list them with the ls -a command. Hidden files such as
    .xinitrc have a period in front of them. Keep in mind that the actual location
    for user and systemwide configuration files will vary.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# X Window Architecture


    As mentioned previously, the X Window is modular. You can mix and match components
    from different categories. Whichever components you select, you need five different
    groups of components to set up the X Window architecture: servers, display managers,
    widgets, window managers, and applications.


    The X Server communicates directly with video hardware. The display manager sets
    up the X Window environment and sets up a login screen. The basic items that you
    see in a GUI, such as menu bars, are built with widgets. The actual GUI is a window
    manager, and all GUI applications should work with any window manager. This system
    can be set up in a client-server arrangement over a network.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_209_0.png)


    > When you set up the X Window, Linux first starts the X Server, which puts your
    computer into graphics mode. It can then start a display manger to allow you to
    log in. Once you log in, Linux starts the window manager of your choice.


    # Server


    Despite its name, the X Server is set up on a client computer. It communicates
    directly with your video controller. Before Linux can draw a picture on your monitor,
    the X Server sends the information to your video hardware. Whether the input comes
    from an application or from your mouse, the X Server processes this data and sends
    appropriate input/output commands to your video controller.


    # Display Manager


    The display manager that you see is a graphical login screen. Some window managers,
    such as KDE (K Desktop Environment) and GNOME (GNU Network Object Model Environment),
    have their own display manager. Others, like xdm, are configured at a specific
    level in the /etc/inittab file. The screen that you see varies by Linux distribution.
    Whichever display manager is used, a successful login activates the window manager.


    # Building Blocks (Widgets)


    In Linux, a widget is a library program. Developers build the components of a
    window manager from widgets. These components include menu bars, scroll bars,
    task bars, and so on. Different window managers may be built from different widget
    libraries.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Window Manager


    The window manager determines how the GUI looks on your monitor. There are several
    different kinds of window managers available including GNOME, KDE, Afterstep,
    Window Maker, fvwm, Blackbox, and Enlightenment.


    The two most common default window managers are GNOME and KDE. The GNOME window
    manager is built from the GTK+ widget library. The KDE window manager is built
    from the Quicktime (Qt) widget library.


    # Applications


    For the most part, GUI applications, such as Netscape Communicator and WordPerfect,
    work with but are not part of the X Window architecture. Nevertheless, GUI applications
    also store user-specific configuration files. You may already have some hidden
    application configuration files in your home directory.


    The GNOME and KDE packages include applications such as office suites.


    # X Window Configuration Utilities


    Editing the XF86Config file can be a difficult process for all but the most skilled
    administrators. There are a number of good tools available to help you configure
    this file. Although some of these tools are graphical, they do not suffer from
    the perceived flaws of other Linux GUI utilities. In other words, they are reliable.
    For the most part, they include all of the features that most administrators need
    to configure their systems.


    Some of these utilities can even help you install or revise settings for your
    keyboard and mouse.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_210_0.png)


    > Before you start any of these utilities, back up your X Server configuration
    file, which is normally /etc/X11/XF86Config.


    # SuperProbe


    The SuperProbe utility is a text command that detects key parts of your video
    controller, including the chipset on the card and the data converter. Most importantly,
    it identifies an appropriate X Server for you. If you want to try to use this
    utility, close all currently running programs first because SuperProbe can make
    Linux "hang" or stop working on your computer.'
  merge: -1
  img_proc: true
