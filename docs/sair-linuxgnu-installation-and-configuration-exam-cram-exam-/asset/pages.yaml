- pgno: 57
  md: '# Question 7


    Which of the following commands perform the same functions? [Check all correct
    answers]


    +   - a. apropos man

    +   - b. man apropos

    +   - c. man --help

    +   - d. man -k man


    Answers a and d are correct. The apropos command is synonymous with man -k. The
    man apropos command returns the manual page for the apropos command. Therefore,
    answer b is incorrect. The man --help command returns the options that you can
    use with the man command. Therefore, answer c is incorrect.


    # Question 8


    Why is the quality of GPL software considered to be higher than the quality of
    proprietary software?


    +   - a. It is supported by smarter developers.

    +   - b. Users have control of GPL software and can modify it to meet their needs.

    +   - c. Companies like Red Hat and Caldera have superior business models when
    compared to Microsoft.

    +   - d. The U.S. Department of Justice declared that GPL software is superior.


    Answer b is correct. Unlike with proprietary software, users have effective control
    of GPL software and can modify it to meet their needs without waiting for the
    development cycle of any particular company. Although open source developers like
    to think of themselves as "smarter," this is not necessarily true. Some of the
    best developers do work for companies like Microsoft. Therefore, answer a is incorrect.
    Although open source developers do like to believe they have superior business
    models, as of this writing, few Linux distributors make money from Linux. Therefore,
    answer c is incorrect. Because the U.S. Department of Justice has made no pronouncement
    on the quality of GPL software, answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Question 9


    Which of the following are highlights of the typical development cycle of GNU
    software? [Check all correct answers]


    +   - a. GNU developers gear their software to beginning users.

    +   - b. Other developers test the software and share their observations.

    +   - c. Other developers use GNU software to develop their own proprietary applications.

    +   - d. Developers share preliminary versions of their software over the Internet.


    Answers b and d are correct. GNU software is constantly released over the Internet,
    even in preliminary forms. Interested developers download and test this software
    and share their observations with the software authors. One of the characteristics
    of GNU software is that it is geared to higher-level users. Therefore, answer
    a is incorrect. One of the conditions of GNU software, under the GPL, is that
    others can''t use its source code in their own (or anyone else''s) proprietary
    applications. Therefore, answer c is incorrect.


    # Question 10


    Which of the following statements most accurately describes some of the advantages
    and disadvantages of GPL software?


    +   - a. You have and can modify the source code, but the manufacturers don''t
    provide a warranty.

    +   - b. You can resell GPL programs, but you have to provide a warranty.

    +   - c. Because you have the source code, you can clone GPL software and sell
    it for a profit.

    +   - d. When you purchase a GPL program, you purchase the right to warranty support.


    Answer a is correct. GPL software includes the source code. You can modify the
    source code to meet your needs. But GPL software offers no warranty. Because the
    GPL states that you do not have to provide a warranty, answers b and d are incorrect.
    Because you don''t need to clone GPL software to resell it, answer c is incorrect.'
  merge: -1
  img_proc: true
