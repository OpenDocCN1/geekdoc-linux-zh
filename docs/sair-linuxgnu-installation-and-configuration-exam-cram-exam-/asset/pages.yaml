- pgno: 166
  md: '# Question 8


    Which of the following commands lists the files in your directory with inode numbers?
    The output should allow you to differentiate between regular files, directories,
    and executable files. It should also list the most newly revised file last.


    +   a. ls -ltr

    +   b. ls -iTr

    +   c. ls -iFr

    +   d. ls -dir


    Answer c is correct. The switches in this command give you inode numbers (-i),
    help you differentiate between regular files, directories, and executable files
    (-F), and set up the order so that the oldest file is first and the newest file
    is last (-r). A long listing does not give you inode numbers; therefore, answer
    a is incorrect. Nothing in answer b allows you to differentiate between files
    and directories, so it is also incorrect. Because answer d only gives you the
    inode number of the current directory, it is also incorrect.


    # Question 9


    Which of the following values of umask corresponds to read and execute permissions
    for the file owner, write and execute permissions for other members of the owner''s
    group, and execute permissions for other users on a Linux computer?


    +   a. 531

    +   b. 731

    +   c. 246

    +   d. 642


    Answer c is correct. The umask is the value that you subtract from full read (r),
    write (w), and execute (x) permissions for each type of user. Read and execute
    permissions (4 +1) correspond to the number 5, so the first number of umask is
    (7-5=) 2. Write and execute permissions (2 +1) correspond to the number 3, so
    the second number of umask is (7-3=) 4. Execute permissions correspond to the
    number 1, so the third number of umask is (7-1=) 6.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Question 10


    What should you do before running the chmod command on a file?


    +   - a. Login as the owner of the chmod file.

    +   - b. Type the su command, and then type the root password when prompted.

    +   - c. Make sure the file is not hidden.

    +   - d. Ask the Linux administrator for help.


    Answer b is correct. The chmod command requires root or superuser permissions;
    otherwise, anyone can change the permissions on the files in your home directory.
    The owner of the chmod file is the root user. You can make this command work by
    logging in as the root user; however, this practice is strongly discouraged. Therefore,
    answer a is incorrect. The hidden characteristics of a file do not affect the
    ability to run the chmod command on that file. Therefore, answer c is incorrect.
    Although a knowledgeable Linux administrator can help you with this problem, as
    a Certified Linux Professional, you should know how to use the chmod command.
    Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
