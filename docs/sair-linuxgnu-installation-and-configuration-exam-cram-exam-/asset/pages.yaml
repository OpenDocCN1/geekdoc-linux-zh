- pgno: 297
  md: '# Question 5


    If you try to install a new program and receive the following message, which of
    the following answers most accurately describes your problem?


    ```

    Tar: read error or gzip: not in gzip format while installing Linux

    ```


    +   - a. You have a corrupt compressed program on your installation CD.

    +   - b. You are having trouble restoring from a backup.

    +   - c. You can''t finish installing Linux.

    +   - d. You need to download the program that you''re trying to install again.


    Answer a is correct. This error is indicative of corruption in a tar archive.
    Although Linux backups are also restored from tar archives, the error message
    suggests an installation issue. Therefore, answer b is incorrect. Because you''re
    installing a program and not Linux, answer c is incorrect (the error message is
    misleading). Although downloading the program again may help solve the problem,
    it does not describe the problem. Therefore, answer d is incorrect.


    # Question 6


    Which of the following commands changes the keyboard repeat rate to 15 characters
    per second?


    +   - a. /sbin/keyboard -a 15

    +   - b. /sbin/kbdrate -r 15

    +   - c. /sbin/kbdrate -s 15

    +   - d. /sbin/kbd -r 15


    Answer b is correct. The command is kbdrate, and the -r switch specifies the rate
    to be used in characters per second. Because keyboard is the wrong command, answer
    a is incorrect. Because -s is the silent option, it does not change the keyboard
    repeat rate; therefore, answer c is incorrect. Because kbd is the wrong command,
    answer d is incorrect.'
