- pgno: 127
  md: 'This chapter explains what happens when Linux starts, and what you can do to
    customize your start process. The Linux Loader (LILO) manages multiple operating
    systems. LILO launches when you start your computer. If you choose Linux from
    the LILO menu, it loads the Linux kernel. The kernel loads your hardware and protocols,
    and then passes the rest of the process to init. The init program mounts your
    drives as specified in the /etc/fstab file and starts other programs at various
    run levels with the help of resource control (rc) files. Then it sets up shells
    and login screens as defined by the /etc/inittab/ initialization file. This file
    also defines who can shut down your computer and the commands that can be used
    to shut it down.


    # Linux Loading Details


    LILO is a versatile tool. You can set it up to load Linux directly from your hard
    drive, and it can also work with other boot managers. You can even set it up to
    load from a floppy disk. LILO tells Linux special details about your hardware
    configuration as you boot. Once you choose to load Linux, it starts your Linux
    kernel.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_127_0.png)


    > The Linux kernel is sometimes known by its basic file name, vmlinuz.


    When LILO loads on your computer, you see the following prompt, usually for just
    a few seconds:


    ```

    LILO boot:

    ```


    If you press the Shift key, LILO should stop and wait for your input. If you press
    the Tab key, LILO lists the available operating systems. For example, if you''ve
    set up Linux and Microsoft Windows on your computer, you might see the following:


    ```

    linux   dos

    boot:

    ```


    In this case, you have two choices. You can type "linux" or "dos". Even if your
    other operating system is Microsoft Windows, typing "windows" won''t work.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_127_1.png)


    > There is no limit to the number of operating systems that you can select through
    LILO. The only limits are based on the size of your hard drive.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Common LILO Tasks


    Whatever your configuration, you''ll see at least the following commands in your
    lilo.conf file:


    ```

    boot=/dev/hda

    install=/boot/boot.b

    ```


    The boot command specifies the location of your lilo.conf file. The command shown
    assumes that you installed LILO in the Master Boot Record (MBR) of the first hard
    disk on your computer. If you installed LILO on the first partition of that drive,
    you''d see the boot=/dev/hda1 command. Alternatively, if you installed LILO on
    a floppy disk, you''d see the boot=/dev/fd0 command.


    LILO then runs the secondary boot loader, the boot.b file. If you have LILO on
    a floppy disk, this command would read install=/mnt/boot.b, because floppy disks
    are typically mounted on the /mnt directory before Linux loads.


    Some Linux distributions configure the following commands in LILO too:


    ```

    message=/boot/messagefile

    map=/boot/map

    ```


    When used, the message command specifies a message file that you''d see before
    the LILO boot: prompt. The map command specifies the location of your boot partitions.
    By default, the map command is located in the /boot/map file.


    The following commands govern how long you wait before your default operating
    system automatically boots:


    ```

    prompt

    timeout=100

    ```


    The prompt command supersedes any timeout if you press the Shift or Tab key. The
    timeout command specifies how long LILO waits, in tenths of a second, before booting
    your default operating system. The time shown is equal to 10 seconds. Some versions
    of Linux substitute the delay command for timeout; they are, for our purposes
    here, identical commands.


    # Multiple Operating Systems


    If you do not make a selection at the LILO boot: prompt, the operating system
    that appears depends on the default command. On the other hand, if this command
    is missing, the default operating system is the first one you see in the lilo.conf
    file.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'LILO typically defines a Linux operating system with four commands as in the
    following:


    ```

    image=/boot/vmlinuz

    label=redhat

    root=/dev/hda3

    read-only

    ```


    The image command specifies the location of your Linux kernel. The label is what
    you see when you press the Tab key at the LILO boot: prompt, as well as what you
    need to type to select that operating system. The root is the location of the
    root directory (/). And read-only means that the root directory should be mounted
    in read-only mode. The read-only command is usually superseded when the root directory
    is mounted on its assigned volume. Of course, if any of the preceding files have
    different names or are in different locations on your system, substitute accordingly.


    LILO typically defines other operating systems, such as Microsoft Windows or IBM''s
    OS/2, with three commands as in the following:


    ```

    other=/dev/hda2

    label=dos

    table=/dev/hda

    ```


    The other command specifies the volume with the boot files for the non-Linux operating
    system. The label command is the same as in the Linux section. The table command
    specifies the drive with partition information.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_129_0.png)


    There are two IDE hard disk controllers on a standard personal computer. You can
    connect each controller to a "master" and a "slave." The master on the first controller
    is known as hda; the slave on the first controller is known as hdb. The master
    on the second controller is known as hdc; the slave on the second controller is
    known as hdd. If you have one hard disk and a CD-ROM drive, the hard disk is most
    commonly located on hda, whereas the CD-ROM drive is most commonly located on
    hdb.


    # Custom LILO Commands


    You can customize LILO with the append command, which passes messages to your
    Linux kernel. If you just installed your first Ethernet network card and you know
    that its IRQ (interrupt request) is set to 12 and its I/O (input/output) address
    is set to 0x300, you can add the following command to your lilo.conf file:


    ```

    append="ether=12,0x300,eth0"

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The format for an Ethernet card is ether=IRQ, I/O, device. Because this is
    your first Ethernet card, the device is eth0. Your second Ethernet card would
    be eth1.


    Alternately, if you have an older Linux kernel, prior to version 2.2.1, you can
    use the mem command to help Linux recognize your RAM above 64MB. For example,
    the following command tells Linux to recognize your RAM up to 192MB:


    ```

    append="mem=192M"

    ```


    Linux kernels starting with version 2.2.1 should recognize all of the RAM on your
    computer.


    If you edit LILO in any way, use a text editor. Make sure you have a rescue disk
    ready with your old LILO, and then run the /sbin/lilo command to load your new
    lilo.conf file.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_130_0.png)


    You can enter append commands directly at the LILO boot: prompt, but without typing
    "append". For example, if you wanted to boot Linux and help it recognize your
    RAM up to 192MB, you would use the linux mem=192M command.


    # Troubleshooting LILO


    The LILO prompt can help you troubleshoot boot problems. For example, you know
    you have a problem when you only see part of the LILO boot: prompt, as shown here:


    ```

    L:

    ```


    When you see only this part of the prompt, there are two possible causes. You
    may have moved or deleted the secondary boot loader file, normally /boot/boot.b.
    Alternately, your BIOS (Basic Input/Output System) may have trouble reading your
    hard disk. These are also potential causes if all you see is L., LIL?, or LIL-.


    Alternately, if you don''t see any letters when you expect to see the LILO boot:
    prompt, it means that your computer is having trouble finding your lilo.conf file.
    It may even be missing from your MBR.


    If your secondary boot loader (boot.b) file is still present, check the configuration
    of your hard disk against the specifications listed in your BIOS menu. You may
    also have the problem described in Chapter 4, where the Linux /boot directory
    is mounted on a volume that ends above cylinder 1023.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'On an older hard drive, cylinder 1023 may be as low as 512MB.


    If you''re removing Linux from your computer, you can remove LILO from your MBR
    with the MS-DOS fdisk /MBR command. If you really want to do this, load the fdisk
    command on a bootable floppy disk first.


    # Mounts (/etc/fstab/)


    The volumes that you configured when you installed Linux, plus a few more, are
    included in the /etc/fstab/ file. The volumes shown in Figure 6.1 are mounted
    when Linux boots on your computer.


    # Mount File Format


    The key information is shown in the first three columns of the /etc/fstab/ file.
    The other columns are included for reference:


    +   - **Volume**—The first column indicates the subject volume. For example, the
    volume in the first line of Figure 6.1 corresponds to the first logical drive
    on the first hard disk on your computer.

    +   - **Mount point**—The second column corresponds to the directory mounted on
    the specified volume. For example, the second line of Figure 6.1 shows the /boot
    directory mounted on the first partition on the first hard drive.

    +   - **Format**—The third column corresponds to the way each volume is mounted.
    For example, ext2 corresponds to the second extended file system.

    +   - **Mount option**—The fourth column specifies the types of users that can
    mount, whether they can read or write, and what can be run from the mounted directory.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_131_0.png)


    Figure 6.1 A sample /etc/fstab file.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Dump—The fifth column specifies whether to dump changes to the memory cache
    or directly to the mounted volume. If this value is 0, data is written directly
    to the file system. If this value is 1, data is stored in the cache.


    Mount order—The sixth column determines when the volume is mounted. If this value
    is 0, the volume is normally mounted by users after they log in. If this value
    is 1, the volume is mounted when you start Linux. Mount order is commonly associated
    with the root (/) directory. If this value is 2, Linux mounts another directory
    after the root directory.


    # Mount File Flexibility


    The /etc/fstab file is flexible. You can mount additional volumes through this
    file, but you should test this function before you add volumes. For example, if
    you''ve installed both Microsoft Windows and Linux on the same computer, you might
    be able to mount your Windows C: drive with the following command:


    ```

    mount -t vfat /dev/hda2 /disks/c

    ```


    This command mounts a volume that is formatted to VFAT (Virtual File Allocation
    Table), which is Microsoft''s virtual file system that works with long file names
    (-t corresponds to type). The volume is the second primary partition (/dev/hda2).
    The mount point is the /disks/c directory.


    If you have a VFAT volume mounted on /dev/hda2, this command should work. If it
    does, you can verify it with the ls /disks/c command. You can then make sure Linux
    mounts this volume whenever you boot by entering the following line in your /etc/fstab
    file:


    ```

    /dev/hda2   /disks/c   vfat   defaults   0   2

    ```


    The defaults option allows any user to mount, read, and write to the given directory.
    The 0 means that files transferred to and from this directory are cached. The
    2 refers to directories that are mounted after the root directory.


    If you need to add additional Linux volumes, you can use tools like fdisk or fips
    to create them. You can then format them with the mk2fs command to set up the
    Linux second extended file system (ext2fs) or the mkswap command to set up another
    swap partition. Once formatted, you can mount a directory on a new volume by adding
    its entry into the /etc/fstab file.


    # Loading Sequence


    To see how Linux loads on your computer, analyze the /etc/inittab file in detail.
    In essence, when Linux starts up, it loads scripts in a three-stage process. First,
    it loads system initialization scripts from an rc.sysinit file. Second, it loads
    scripts'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'associated with different run levels in various rc.d directories. Third, it
    loads custom scripts in an rc.local file.


    When these steps are complete, Linux then sets up your system in a specific run
    level, as defined by the initdefault variable. Whatever you do, don''t set initdefault
    to 0 or 6. If you do, your system will shut down or reboot whenever you try to
    start Linux.


    # Initialization Scripts (rc.sysinit)


    The first resource control file to run when you boot Linux is the rc.sysinit file.
    It starts several programs. It also mounts volumes as defined in the /etc/mtab
    file as well as some basic network programs.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_133_0.png)


    > The /etc/mtab file lists the volumes from /etc/fstab that are mounted when Linux
    starts on your computer.


    The rc.sysinit script also sets up your PATH variable, which defines where Linux
    looks for different commands. To check your current path settings, type the command
    "echo $PATH". You might get the following result:


    ```

    /usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin:/home/mj/bin

    ```


    When you type in a command such as who, Linux looks through the directories listed
    in the PATH variable for this command. If you don''t include the current directory
    in PATH, this can be inconvenient. For example, let''s assume you created a script
    named goodidea in your home directory. If you were in your home directory, you''d
    have to type the ./goodidea command to run the script. This would not be necessary
    if your PATH variable included the dot (.).


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_133_1.png)


    > There are advantages and disadvantages to including a dot (.) in your PATH variable.
    For security reasons, this is generally discouraged; crackers (malicious users)
    could place destructive programs with familiar names in users'' local directories.
    For example, if a cracker inserted a program named who in your home directory,
    and you had the dot in your PATH variable, you''d run whatever the cracker wanted
    you to run when you typed the who command. These types of programs are sometimes
    known as Trojan horses. This is not a problem, of course, if you''re running a
    standalone Linux computer.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Run Level Scripts (rc#.d)


    The /etc/inittab file runs daemons and scripts at each run level. If you want
    to see what is run at each level, list the files in the applicable directory.
    For example, if you want to see what programs are started and shut down when you
    halt (run level 0), type the following command:


    ```

    ls /etc/rc.d/rc0.d

    ```


    The commands typically start with S (for start) or K (for kill). For example,
    if you see the K23nfsd command, you know that Linux kills the Network File System
    (NFS) daemon at the applicable run level. You can see a typical list of daemons
    and other commands used by your run level scripts in Figure 6.2.


    > TIP The scripts in each rc.d run level link to files in the init.d directory.
    Depending on your distribution, you may find the /init.d directory under /etc
    or /etc/rc.d. The /init.d directory includes scripts that you can use to start
    or stop daemons after Linux boots on your system. Two example daemons in this
    directory are Apache (httpd) and the Network File System (nfsd).


    # The Local Run Level Script (rc.local)


    If you have your own scripts that you want run whenever you start Linux, add them
    to the rc.local shell script. They are run after Linux sets up in the initdefault
    run level.


    # Common Run Levels


    You learned about run levels in Chapter 3. The following is a list of run levels
    used by all distributions:


    +   - Shutdown—All distributions use run level 0 for shutdowns. This level ends
    all programs and daemons. This level is also known as halt. The root or superuser
    can start this run level with the init 0 command.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_134_0.png)


    Figure 6.2 Sample list of daemons.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - **Reboot**—All distributions use run level 6 to reboot. This is a two-step
    process. It first moves Linux to run level 0. When Linux reboots, it moves to
    a standard multiuser level, usually 2 or 3, depending on your Linux distribution.
    The root or superuser can start this run level with the `init 6` command.

    +   - **Single User**—All distributions have a single-user mode. It is standard
    when you use a rescue disk to boot your Linux computer. You can also start single-user
    mode when you don''t want anyone else using your Linux computer for administrative
    reasons. Generally, single-user mode is configured at run level 1 or S.

    +   - **Multiuser**—All distributions have some form of multiuser run levels.
    Sometimes it''s available with or without networking. It is generally at run level
    2 or 3.

    +   - **X Window**—Linux distributions use different graphical user interface
    (GUI) setups at run levels 3, 4, and/or 5.


    You can change your default run level by changing the number associated with the
    initdefault variable in your /etc/inittab file. For example, you can change your
    default boot from the X Window to the command-line interface by entering the appropriate
    multiuser run level.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_135_0.png)


    > Only the root or superuser can run the init command. The superuser mode is sometimes
    also known as sudo.


    # Logins


    If you''ve ever used Unix or Linux at the command line, you should be familiar
    with the following lines of code:


    ```

    login:

    Password:

    ```


    Any successful login at the command line starts a command-line shell. The shell
    that it starts depends on the control files in your home directory.


    # Shells


    A shell is in part a command-line interface for controlling various parts of your
    computer through the Linux kernel. In essence, it is set up to protect the kernel.
    If the kernel fails, you need to restart your computer. If your shell fails, you
    don''t have to restart. Instead, you can kill the shell and log in to Linux again.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The shell you get depends on the option that is shown in the Linux password
    file, known as /etc/passwd. An example from this file for user mj is:


    ```

    mj:x:501:501:michael jang:/home/mj:/bin/bash

    ```


    The most common Linux shell is known as bash, which stands for the Bourne Again
    SHell. When you log in, bash starts to the requirements of its resource control
    file, known as .bashrc, which is located in your home directory. If you change
    your shell, you need to change the .profile file in your home directory and create
    a resource control file for your new shell. For example, if you wanted to use
    the shell known as ash, you''d need a resource control file named .ashrc.


    > The dot in front of a file makes it hidden. You can list all files, hidden and
    otherwise, with the ls -a command.


    # A Note on Passwords


    When you look at your /etc/passwd file, you might think your passwords are well
    hidden. However, if a cracker finds this file, he/she can easily determine your
    password, especially if you use dictionary words.


    The most secure way to create a password is based on a combination of letters
    and numbers. For example, popular password cracking programs might find a dictionary-based
    password like pepper in a matter of minutes. In contrast, it would probably take
    the same program weeks to crack a password like lz29tceW (which might stand for
    "I eat 29 fish tacos every Wednesday").


    > In the Linux world, malicious users are known as crackers. Linux hackers are
    people who just want to make, or hack, better software. Crackers, on the other
    hand, try to crack into your passwords and software for destructive reasons.


    # Logouts, Cache, and Shutdowns


    If you just turn off your Linux computer, you can easily lose data that you thought
    you saved. For example, when you save data to a floppy drive, Linux may not write
    to the drive until you unmount it.


    It turns out that most of your available memory (RAM + swap partition) is dedicated
    to programs and cache. As you open more programs, the information in the cache
    is "flushed" to make room for additional incoming data.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Before you shut down Linux, be sure that you have closed all programs that
    might have data in your cache. There are several different commands that shut
    down your Linux system:


    +   - **shutdown**—This command is the secure way to shut down your computer.
    Messages are sent to all of your users advising them of the coming shutdown. If
    you just want to send the warning, use the `shutdown -k` command. The `shutdown
    -t 100` command should give your users 100 seconds between the warning message
    and the time Linux starts shutting down. The `shutdown -c` command cancels any
    impending shutdown.

    +   - **halt**—This command is equivalent to `shutdown -h now`, or `init 0`. If
    others are logged on to the Linux computer, they won''t have any time to save
    their work.

    +   - **reboot**—This command is equivalent to `shutdown -r now`, or `init 6`.
    Reboot goes to level 0, and then when Linux restarts, proceeds to your standard
    multiuser level, usually 2 or 3. If others are logged on to the Linux computer,
    they won''t have any time to save their work.

    +   - **Ctrl+Alt+Del**—This command is equivalent to the `reboot` command. It
    is not a normal Linux command, but is often added to the `/etc/inittab` file.
    Unfortunately, this command may be available to all users, not just the root or
    superuser. For this reason, you should probably delete this entry from your `/etc/inittab`
    file. Because Ctrl+Alt+Del is commonly used in Microsoft operating systems, the
    frustration of one user may affect all other users on your system.

    +   - **Power failure signal**—Some distributions include power failure signals
    in their `/etc/inittab` file. When an uninterruptible power supply (UPS) starts
    sending power signals to your computer, you have just a few minutes to save your
    work before you completely lose power. The power failure signal sends messages
    similar to the `shutdown` command.


    On some versions of Linux, regular users may be able to use some of these commands
    with or without their passwords. You may need to change the permissions for commands
    like `halt` and `shutdown` to keep your users from shutting down Linux.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_137_0.png)


    > You can log out of a command-line interface shell with three different commands:
    `logout`, `exit`, and `Ctrl+D`.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Practice Questions


    # Question 1


    You have a dual-boot system with Microsoft Windows and Caldera Linux, and their
    labels in the lilo.conf file are dos and openlinux, respectively. Which of the
    following commands can you use at the LILO boot: prompt? [Check all correct answers]


    +   - a. linux

    +   - b. dos

    +   - c. linux ether=10,0x330,eth1

    +   - d. openlinux


    Answers b, c, and d are correct. Your options for operating systems are based
    on their labels as specified in the lilo.conf file, which are specified in this
    example as dos and openlinux. You can also enter appropriate append-type commands
    at the LILO boot: prompt. Because linux is not a label in the lilo.conf file,
    answer a is not correct.


    # Question 2


    While in Linux, you accidentally delete your lilo.conf file from your /etc directory,
    as well as your MBR. You want to restore your MBR so that you can boot into Linux
    again in the future. You have a printout of your original lilo.conf file. Which
    of the following should you do?


    +   - a. Create a new lilo.conf file that conforms to the requirements of the
    operating systems on your computer. Run the lilo command to write the result to
    your MBR.

    +   - b. Create a new lilo.conf file that conforms to the requirements of the
    operating systems on your computer. Run the fdisk /MBR command to write the result
    to your MBR.

    +   - c. Reboot your computer. When you see the LILO boot: prompt, enter the parameters
    of your lilo.conf file.

    +   - d. Run the Linuxconf utility to rebuild your lilo.conf file. Use the lilo
    command to write the result to your MBR.


    Answer a is correct. You have a printout of your lilo.conf file, so all you need
    to do is to enter the information in a text editor and save it to your Master
    Boot Record'
  merge: -1
  img_proc: true
