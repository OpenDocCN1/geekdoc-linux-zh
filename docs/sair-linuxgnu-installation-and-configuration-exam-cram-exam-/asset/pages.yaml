  md: '# Question 7


    Which of the following commands turns on the Num Lock option on your keyboard
    for only the fourth virtual console? Note: x is a variable set from 1 through
    6.


    +   - a. setleds -num </dev/tty$x> /dev/null

    +   - b. setleds +num </dev/tty$x> /dev/null

    +   - c. setleds -num </mnt/tty4> /dev/null

    +   - d. setleds +num </dev/tty4> /dev/null


    Answer d is correct. This command turns on the Num Lock only on the fourth virtual
    terminal. Answer a turns off the Num Lock; therefore, answer a is incorrect. Because
    answer b turns on the Num Lock for all virtual consoles from 1 through 6, answer
    b is incorrect. Answer c turns off the Num Lock on the fourth virtual terminal;
    therefore, answer c is also incorrect.


    # Question 8


    You''re currently unable to print to your printer, which is attached to your local
    computer. Among others, you have the following printer-related files: /etc/printcap,
    /var/spool/lpd/lp2/status, /var/spool/lpd/lp2/lock, /etc/syslog.conf, and /var/log/lpr/lpr.info.
    Among the following choices, where would you look first for a problem with your
    printer? (The name of your printer is lp2.)


    +   - a. Look at the messages inside the /var/log/lpr/lpr.info file.

    +   - b. Look at /var/spool/lpd/lp2/lock and delete it.

    +   - c. Look at /var/spool/lpd/lp2/status to identify your problem.

    +   - d. Look at /etc/printcap and make sure the settings for the lp2 printer
    have not been changed.


    Answer b is correct. The purpose of the lock file is to keep other print jobs
    from interfering with the current print job. As long as it exists, other print
    jobs will not run. Although the messages in the /var/log/lpr/lpr.info file may
    help you identify the problem, the problem could be shown in a different log file.
    Therefore, answer a is incorrect. Although the /var/spool/lpd/lp2/status file
    may include error messages for your printer, it is not as clear-cut an issue as
    the lock file. Therefore, answer c is incorrect. Although a change to the /etc/printcap
    file could redirect your information to a different printer, the lock file still
    blocks data from reaching your local printer. Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
