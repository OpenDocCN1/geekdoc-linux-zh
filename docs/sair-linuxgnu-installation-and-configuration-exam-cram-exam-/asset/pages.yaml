    # Volume and Drive Names


    The Linux naming convention for hard disk volumes is straightforward. The naming
    system also applies to any CD that isn''t installed on a sound card. The first
    two letters of the name depend on the kind of disk that you have. If you have
    a regular hard disk, the letters are hd. If you have a Small Computer Systems
    Interface (SCSI) hard disk, the letters are sd.


    The third letter depends on your hard disk''s position. The first hard disk is
    designated as a, the second disk is designated as b, and so on. In other words,
    if you have two different physical hard disks, the second disk is known as hdb.
    For naming purposes, CD-ROM drives are also categorized as hard disks.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_86_1.png)


    The first and second disks on a computer are often installed as a "master" and
    a "slave."'
