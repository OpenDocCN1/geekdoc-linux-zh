- pgno: 61
  md: 'Linux is a structured operating system. Its components can be divided into
    six kinds of modules. Linux allows you to run multiple programs simultaneously
    with multiple terminals for multiple users working from one or more computers.
    Although Linux graphical tools are available, command-line tools still provide
    more reliable results. The modularity of Linux makes it important for you to understand
    the different ports your hardware uses to communicate with components inside your
    computer as well as with your peripherals.


    # Modular Linux


    One of the strengths of GNU/Linux is its modularity. Because the modules are covered
    under the General Public License (GPL), developers can work independently. They
    can reuse and reconfigure these modules to achieve different results. GNU/Linux
    can be divided into at least six categories of modules: kernel, network, init,
    daemons, user mode, and the X Window.


    # Kernel


    The kernel is the most important part of any operating system. It allows Linux
    to communicate with computer hardware. The kernel communicates with your hardware
    through dedicated device drivers. For example, when you mount a floppy drive,
    a specific kernel driver sends and receives messages to and from the floppy drive.


    If you install new hardware, and it isn''t detected when you start Linux, you
    can add a driver module to your kernel with the insmod command. If you have to
    download a driver for your new hardware, you should also add that driver module
    to the kernel.


    Other parts of the kernel manage the Linux file system as well as any data stored
    in such areas as your disk cache. The kernel is loaded into protected-mode memory
    when you start Linux.


    # Network


    In a client/server network, clients ask servers for items they need, like files
    or applications. In a Linux network, clients can even ask for X Window information.
    In other words, you can set up terminals on Linux clients that access their graphical
    user interface (GUI) data from a Linux server.


    > Note: In principle, this client/server relationship for the GUI is operationally
    similar to Microsoft''s Terminal Server.


    The network modules of the Linux operating system are designed to keep client/server
    communication running as smooth as possible. Ideally, the connection between client
    and server is seamless.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Because network modules are loaded in the same area as the kernel, their failure
    may mean that you have to reboot Linux.


    # Init


    If you''re familiar with the output of the ps command, you know that the only
    way to start a Linux program is with another Linux program. But there has to be
    a starting point. When you boot Linux on your computer, the kernel loads and starts
    init, which is also a daemon. The init program then mounts your drives, opens
    your terminals, and starts your command-line interface (CLI) shell. After Linux
    boots on your computer, init modules watch for anything that might shut down your
    computer, such as a power failure signal from an uninterruptible power supply
    (UPS) or a reboot command, as shown in Figure 3.1.


    Init works at several different run levels, primarily through the /etc/inittab
    file, as well as associated scripts in the /etc/rc.d directory. Depending on your
    distribution, the programs that init starts may be divided into run levels 0 through
    6. Most distributions leave one or more of these levels unused. In general, run
    levels are divided into the following categories, usually in the following order:


    +   ► Shutdown/halt—The init program stops all services currently running on your
    computer.


    ```

    # inittab      This file describes how the INIT process should set up

    #              the system in a certain run-level.

    # Author:      Miguel van Seumeren, <miguel@brinkel.nl.mugnet.org>

    #              Modified for RHS Linux by Marc Ewing and Donnie Barnes

    #

    # Default runlevel: The runlevels used by RHS are:

    # 0: halt (Do NOT set initdefault to this!)

    # 1: Single user mode

    # 2: Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3: Full multiuser mode

    # 4: unused

    # 5: X11

    # 6: reboot (Do NOT set initdefault to this)

    id:3:initdefault:

    #

    # System initialization.

    si::sysinit:/etc/rc.d/rc.sysinit

    l0:0:wait:/etc/rc.d/rc 0

    l1:1:wait:/etc/rc.d/rc 1

    l2:2:wait:/etc/rc.d/rc 2

    l3:3:wait:/etc/rc.d/rc 3

    l4:4:wait:/etc/rc.d/rc 4

    l5:5:wait:/etc/rc.d/rc 5

    l6:6:wait:/etc/rc.d/rc 6

    #

    # Things to run in every runlevel.

    ud::once:/sbin/update

    #

    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    #

    # When our UPS tells us power has failed, assume we have a few minutes

    # of power left.  Schedule a shutdown for 2 minutes from now.

    # This does, of course, assume you have powerd installed and your

    # UPS connected and working correctly.

    pf::powerfail:/sbin/shutdown -f -h +2 ''Power Failure; System Shutting Down''

    ```


    Figure 3.1 Run levels and reboot options in the /etc/inittab file.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - **Single User**—Init starts just the programs needed to allow one user
    to log in to your Linux system. When you have a major problem with your system,
    you can go into single-user mode (sometimes with a special recovery floppy) to
    fix whatever is wrong. If a critical file is damaged, you may be able to restore
    it with a backup on a floppy disk.

    +   - **Multiuser**—At the multiuser level, init starts the programs that allow
    multiple users to log in to your Linux system simultaneously.

    +   - **Multiuser with networking**—The multiuser with networking level starts
    the network daemons on your computer after the multiuser run level.

    +   - **Multiuser with the X Window**—Because X Window programs can also be split
    between client and server, the multiuser with the X Window level can only start
    after init starts your network programs.

    +   - **Reboot**—At the reboot level, init runs the programs at the Shut down/halt
    level, and then restarts your computer at one or more of the multiuser levels.


    Note: Some distributions have an additional run level, known as "S" for single-user
    mode.


    Some distributions may combine or further divide some of these categories. You
    can actually run the init program at any time. You can review how Red Hat Linux
    organizes run levels in Figure 3.1.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_63_0.png)


    > > Because init can affect every user currently logged on to a Linux system,
    only the root or superuser can run the init command.


    # Daemons


    Linux services are known as daemons. In Linux, several dozen daemons can run simultaneously,
    standing at the ready to start your network, serve Web pages, print your files,
    or connect you to other Linux or Windows computers. Typical daemons include:


    +   - **Apache**—The Linux Web server, also known as httpd

    +   - **Printer**—The printer daemon, also known as lpd, that manages communication
    with your printer

    +   - **Samba**—The network program that allows Linux to talk to Microsoft Windows
    computers, also known as smbd'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'When started, a daemon is loaded into your RAM, where it waits for requests
    for service.


    # User Mode


    Any Linux program or utility that talks to the kernel is a user mode program.
    Because user mode programs don''t communicate directly with your hardware (a job
    for the kernel), these programs can crash without affecting the basic operation
    of the Linux operating system. There are three basic categories of user mode programs:


    +   - **Login**—This program associates a user id with a user''s shell and other
    personalized settings, such as with the X Window and Netscape.

    +   - **Shell**—The Linux command interpreter. The most common Linux shell is
    known as bash (for Bourne Again SHell), which was developed from the original
    Unix Bourne shell.

    +   - **Utilities**—Any command used inside a shell.


    # X Window


    Linux builds the X Window from program modules needed to build a graphical user
    interface (GUI). GUI window managers, such as GNOME and KDE as well as all GUI
    applications, are built on the foundation of the X Window.


    # Sharing Resources


    Linux meets the fundamental requirements of a server. In part, this is because
    Linux is a multitasking, multiuser, multiterrminal system. Because it can share
    its resources among multiple programs, it is a multitasking system. It is a multiuser
    system because you can set up multiple user accounts. And different users can
    log in to the same Linux computer at the same time, making it a multiterrminal
    system.


    # Multitasking


    There are a lot of programs that demand attention from your computer. Some programs
    are commands like ls or daemons like Apache, the Linux Web server. Others are
    device drivers that interpret activity like keystrokes, data coming through a
    network card, or the processing of information that your monitor needs for its
    display. Multitasking is the way your operating system manages these demands.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Linux uses preemptive multitasking, which means that it dedicates specific
    resources to different programs based on a hierarchy of priorities. Linux manages
    these priorities to ensure that each current program gets its share of computer
    resources. Preemptive multitasking forces all programs to share the use of your
    computer resources.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_65_0.png)


    > When Linux manages multiple tasks, it is really managing multiple processes.
    A process is the current status of a program. As you run a program, you''re running
    libraries associated with that program. As the program requests services from
    components such as your hard drive or printer, it interacts with the Linux kernel.


    Other programs make demands on your computer constantly. For example, when you
    type a keystroke, your keyboard sends an interrupt service routine (ISR) that
    travels through interrupt request (IRQ) ports.


    # Multiple Users


    One factor that differentiates Linux as a server is its capability to manage the
    demands of multiple users and accounts simultaneously. As a multiuser system,
    Linux requires you to log in to access your files.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_65_1.png)


    > On a true multiuser system, multiple users can log in to the same Linux computer
    simultaneously. In contrast, on a single sequential user system like Windows 98/ME,
    only one user can log in to that computer at a time.


    # Multiple Terminals


    Users can log in to a Linux computer through a number of virtual consoles. On
    the local Linux computer, you can log in through four or more virtual consoles
    and one X Window. The actual setup depends on your Linux distribution, available
    communications hardware, and the way you manage the /etc/inittab file. You can
    also log in remotely through serial, modem, or network connections. A list of
    possible virtual consoles is shown in Table 3.1.


    You can log in to any number of these consoles with one or more accounts. You
    can even log in multiple times with the same account. If you have the appropriate
    hardware, you can add more consoles in the /etc/inittab file. The command that
    starts different consoles is known as a getty. The six mingetty commands shown
    in Figure 3.2 correspond to six different command-line consoles.


    If your Linux system boots to the command line, Linux first takes you to console
    tty1. If you''re booting directly to the X Window, it takes you to console tty7.
    If you started in a command-line window, you can access the other consoles by
    pressing Alt and the corresponding function key shown in Table 3.1.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Table 3.1 Typical login consoles.*\n\n| Console | Type | Access Method |\
    \ Comments |\n|---|---|---|---|\n| tty1 | Local command line | Alt+Ctrl+F1 | Default\
    \ |\n| tty2 | Local command line | Alt+Ctrl+F2 | Default |\n| tty3 | Local command\
    \ line | Alt+Ctrl+F3 | Default |\n| tty4 | Local command line | Alt+Ctrl+F4 |\
    \ Default |\n| tty5 | Local command line | Alt+Ctrl+F5 | Default |\n| tty6 | Local\
    \ command line | Alt+Ctrl+F6 | Default |\n| tty7 | Local GUI | Alt+Ctrl+F7 | Assumes\
    \ X Window is configured |\n| ttyx | Serial connection | Modem or cable | Various\
