- pgno: 107
  md: 'The Sair exams are distribution neutral, so this chapter covers basic steps
    common to all distributions. You can install almost all Linux distributions from
    local sources or through a network.


    Each of the major Linux distributions has different strengths and weaknesses.
    They share general common installation procedures.


    # Local Device Installation


    There are three basic ways to install Linux on a local computer: by using a CD-ROM,
    from files copied to a hard drive, and through floppy disks. Most current Linux
    distributions have many files, which require one or more CD-ROMs.


    Linux is usually installed directly from a CD-ROM. Alternately, you can copy the
    files on the CD-ROM to your hard disk and install Linux from there. It is even
    possible to install some older Linux distributions with a large number of floppy
    disks.


    # Installation by CD-ROM


    Some Linux distributions include several gigabytes of files. Currently, the only
    convenient way to distribute this much information is through a CD-ROM. To start
    a CD-ROM installation, set your computer''s Basic Input/Output System (BIOS) to
    boot from the CD-ROM.


    Alternately, you can start your computer with a Linux boot floppy. Once it detects
    your CD-ROM, you can continue with a CD-ROM installation. Some Linux distributions
    come with boot floppies, or you can create a boot floppy from files on the installation
    CD-ROM.


    # Installation by Partition


    You can also copy appropriate files from your installation CD-ROM to your hard
    disk, and then start the installation program with boot floppies. When prompted,
    enter the directory for your Linux installation files.


    # Installation by Floppy


    It is possible to install Linux from floppies. With several dozen floppies, it''s
    possible to install a minimal version of Linux. Once installed, you can then connect
    to other servers to install more packages. Needless to say, this is a time-consuming
    process.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Network Installation


    You can install Linux through three different types of networks: File Transfer
    Protocol (FTP), Network File System (NFS), or Samba. FTP is a common way to transfer
    files to and from other networks, such as the Internet. NFS is the standard Linux
    network file sharing protocol. Samba is a heterogeneous protocol that allows Linux
    computers to exchange files with Microsoft and IBM operating systems.


    Whichever network you use, the first step is to find Linux boot disks that allow
    you to connect to a network server. These special boot disks usually detect your
    network card. However, if these disks don''t detect your card, you may need to
    add information like the Linux name for your network driver, its interrupt request
    (IRQ) and input/output (I/O) channels, and memory addresses.


    > *Note: Most commands in Linux are lowercase. For example, if you''re installing
    a Novell-compatible network card that''s set to IRQ 10 with an I/O address of
    0x300, you might use the `insmod ne i/o=300 irq=10` command to help Linux recognize
    your card.*


    Once you''ve booted your computer, you''ll need the host and domain names or IP
    address for the remote server. You also need to know the remote directory where
    the installation files are stored.


    When installing Linux over a network, the devil is in the details. If you get
    "little" things wrong, such as the case of a password or a missing slash in your
    directory, they can prevent a successful installation.


    Don''t try installing Linux over a telephone modem. If everything goes perfectly,
    installation takes several days. If you have any "normal" problem with a modem
    connection, the process may take quite a bit longer.


    # Seven Major Distributions


    As of this writing, there are perhaps two dozen Linux distributions. Fortunately,
    they all run the same kind of software. Because of the General Public License
    (GPL), there are few copyright limitations on what is packaged. Some distributions
    even repackage identical versions of others, perhaps with a few additional tools.
    They all share the same basic Linux kernel.


    Each distribution comes with a version number. Generally, they follow the same
    model as Red Hat 7, where the first number signifies a major change, and the second
    number indicates a relatively small revision.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The distributions discussed in the following sections are listed in the Sair
    Knowledge Matrix. Sair recommends that you install four different distributions
    in preparation for this exam. When you install each distribution, focus on their
    commonalities. You don''t need to know specific details of each distribution beyond
    what is discussed in these sections.


    # A Note on Kernels


    The Linux kernel you see with a distribution may be labeled in a way that is similar
    to 2.4.27. The format refers to major.minor.patch. The first number, in this case
    2, means that this is the second major release of the Linux kernel. The second
    number, 4, means that this is the fourth minor release of the kernel. And the
    final number, 27, means that this is the twenty-seventh patch to the specified
    minor release of the kernel.


    The second number also tells you whether or not the Linux kernel is in beta test
    or production release. Odd numbers correspond to test kernels and generally should
    not be used for production servers. Even numbers correspond to production kernels.


    In practice, changes to the minor number of a kernel are rather significant. For
    example, new commands for firewalls and new drivers for Universal Serial Bus (USB)
    equipment were introduced in Linux kernel version 2.4.


    # Caldera


    The Caldera distribution comes in different flavors, known as Open Linux, eDesktop,
    or eServer. Its self-described focus is "Linux for Business." Caldera has developed
    a number of graphical- and Web-based tools for installation and administration.


    # Debian


    The Debian GNU/Linux distribution is a popular option for Linux developers. Its
    self-described focus is on easy upgrades and security. There are over 2,000 software
    packages available with Debian. It is one of several distributions maintained
    and distributed by volunteers.


    # Mandrake


    The creators of Linux-Mandrake build their distribution on top of Red Hat Linux.
    This is legal and encouraged under the conditions of the GPL. They add features
    such as additional language choices for installation, more drivers, and TrueType
    fonts.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Red Hat


    Red Hat Linux is perhaps the most widely known Linux distribution. Its installation
    program includes options for setting up workstations and servers as well as upgrades
    of previous Linux installations.


    # Slackware


    Slackware has two versions of Linux: a regular distribution along with its compact
    ZipSlack package, which is suitable for the Zip drive. Slackware is affiliated
    with Walnut Creek CD-ROM and BDSi, which work with a different Unix derivative
    known as the Berkeley Standard Distribution.


    # Stampede


    The Stampede distribution seems to be under constant development. As of this writing,
    this nonprofit organization has worked for years and still has not released version
    1.0 of its distribution. Stampede''s self-described focus is on ease of use and
    optimization for the newest processor hardware.


    # S.u.S.E.


    As of this writing, S.u.S.E. has the best-selling Linux distribution in Europe.
    It seems to have a more comprehensive software distribution. Although most Linux
    distributions are compressed into one or two CDs, S.u.S.E. Linux, depending on
    the version, includes up to six CDs.


    # Another Distribution: Corel Linux


    Corel Linux was developed after the Sair exams were released. By some measures,
    Corel Linux is now the second most widely popular distribution. Like Caldera,
    Corel has developed a number of graphical tools. Its focus is on getting Linux
    to the desktop.


    As Linux-Mandrake does with Red Hat Linux, Corel Linux uses most of the packages
    in the Debian GNU/Linux distribution.


    # Getting Linux


    There are a number of ways to obtain Linux. You can purchase many of these distributions
    in computer stores and bookstores. The full versions often include some service
    commitment from their distributors.


    You can download Linux distributions from the Internet in two ways: from the Web
    sites of the Linux packagers or from special download sites, such as www.linuxberg.com
    or www.freshmeat.net. If you have a CD-writer, you can download ISO files to create
    distribution CDs on your computer.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'You can even get Linux distribution CD-ROMs from third-party distributors,
    such as www.linuxmall.com or www.cheapbytes.com for approximately $5US.


    # Common Installation Procedures


    The setup program for every Linux distribution is different, but they share common
    features. There are approximately 10 basic steps required to install Linux, depending
    on which distribution you use:


    +   1. Boot from a Linux installation CD-ROM.

    +   2. Select basic parameters: language, mouse, and keyboard.

    +   3. Choose single or dual-boot (if you are planning on more than one operating
    system).

    +   4. Set up Linux partitions.

    +   5. Format Linux partitions.

    +   6. Install actual software.

    +   7. Select default operating system (applicable to dual-boot setups).

    +   8. Input network settings.

    +   9. Configure the X Window.

    +   10. Create rescue disk(s).


    Different distributions handle most of these steps in different ways. Some distributions,
    such as Corel Linux, make a number of decisions for you automatically. Corel has
    a four-step installation process. Other distributions allow you to customize your
    configuration in detail.


    # Booting the Linux Installation CD-ROM


    There are two basic ways to access a Linux installation CD-ROM. You can set up
    your BIOS to boot your computer directly from the CD-ROM, or you can create boot
    disks with CD-ROM drivers.


    Not all computers can boot from their CD-ROM drives. To test your system, you
    need to go into your BIOS menu. Restart your computer. When your computer restarts,
    you''ll see an option to go into a BIOS or Setup menu by pressing a key such as
    F2, Del, or Ctrl. When you enter your Setup menu, look for boot options. Find
    a boot option where your computer looks first to your CD-ROM drive for boot files.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'If you can''t find an option to boot from your CD-ROM in your BIOS, you''ll
    need to boot from your floppy drive. Some Linux distributions include floppy boot
    disks. If you don''t have a floppy boot disk, you can create one. You should be
    able to find at least a rawrite.exe program and a boot.img file on your distribution
    CD-ROM. The rawrite program is an MS-DOS program that allows you to copy the image
    of a Linux boot floppy onto a formatted 1.44MB floppy.


    The boot.img file is also known as a boot image. Linux images are archives of
    a series of files. The files inside boot.img should detect most CD-ROMs. Some
    distributions also include images that help your computer detect network and PCMCIA
    cards (also known as PC Cards).


    If you have access to other Linux computers, you can create a boot image with
    the dd (device dump) command. If you mounted a CD-ROM on the /mnt/cdrom directory,
    you can use the following command:


    ```

    dd if=/mnt/cdrom/images/boot.img of=/dev/fd0

    ```


    This command takes the boot.img input file (if) and sends the files within it
    to an output file (of). However, there is no one specific output file. The dd
    command actually unpacks the input file to the fd0 device, which is usually the
    first floppy drive on your computer. Although you need to mount your CD-ROM to
    make this work, you don''t need to mount your floppy drive. The actual command
    you use depends on your actual devices, mount locations, and the location of the
    boot.img file.


    With some distributions, you may have a couple of other options. In some cases,
    you can boot the CD-ROM directly from Microsoft Windows. In other cases, you either
    have to boot your computer to MS-DOS, or shut down Windows and restart in MS-DOS
    mode.


    # Basic Input Parameters


    Each Linux distribution has to set up basic input parameters for language, keyboards,
    and mice. Some Linux distributions include instructions in over a dozen languages.
    Linux setup programs can accommodate input from several different kinds of U.S.
    keyboards as well as keyboards common in other countries. And those Linux setup
    programs based on a graphical user interface are also designed to accommodate
    major pointing devices, such as mice.


    # Single or Dual-Boot


    When you run a Linux setup program, you can choose to have a single or dual-boot.
    You can dedicate your whole hard disk to Linux, or you can set up partitions to
    accommodate multiple operating systems.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Each Linux setup program has a partitioning program like fips, fdisk, or Partition
    Magic that you can use at this time. If you have already set up the volumes you
    need, continue on to the following section on Linux partitions.


    # Setting Up Linux Partitions


    You can use the Linux setup tools to create volumes for your swap partition and
    Linux directories of your choice.


    Linux setup programs can also work with any partitions or volumes that you have
    previously created. You need at least two volumes: one for your files and one
    for your swap partition. You can also assign different volumes to directories
    such as root (/), /boot, /var, and /opt. Remember, your swap partition should
    be approximately twice the size of your RAM, up to about 100MB.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_113_0.png)


    > > The order of Linux partitions is relatively unimportant. If you can, configure
    the swap partition first.


    # Formatting Linux Partitions


    Once you create a Linux partition, you need to format it. Linux setup programs
    use second-level disk format commands on each Linux volume that you create.


    You can create multiple swap partitions. In fact, this may help performance if
    you''re installing Linux on multiple hard disks.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_113_1.png)


    > > Linux installation programs use the mkfs program to format regular Linux volumes.
    This program formats the specified partition to the second extended file system
    (ext2fs). Linux installation programs also use the mkswap command to format a
    Linux swap partition. Although not generally recommended, you can also configure
    a Linux swap file with the swapon command after Linux is installed.


    # Installing the Actual Software


    In most Linux setup programs, you get to choose the software that you install.
    Sometimes the choices are general. For example, you can choose between a minimum
    and a server type installation.


    Sometimes the choices are specific. In some Linux setup programs, you get to choose
    every package that the Linux setup program installs on your computer. Once the
    choices are made, the Linux setup program unpacks software and copies configuration
    files onto your system.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Configuring the Boot Sequence


    Linux manages multiple operating systems through the Linux Loader (LILO). When
    your computer runs LILO, you get to choose the operating system that you want
    to boot.


    In this part of the Linux setup, you choose one of three locations for LILO. Each
    location is suitable for different purposes, as shown in Table 5.1.


    # Network Settings


    Some Linux setup programs allow you to configure network settings before starting
    the installation process. After all, if you have to access installation files
    from a different computer, you do need to tell Linux where to find those files.


    Even if you''re just installing Linux from a CD-ROM, you can use the Linux setup
    program to make sure your computer gets connected to the network as soon as the
    Linux installation is complete.


    Linux setup programs assume you''re connecting your computer to a TCP/IP network.
    Although other network protocol stacks are available, Linux is built on TCP/IP.
    If you plan on setting up Linux on another network, you should leave the network
    settings section blank. You can review an example of this configuration through
    the Caldera Linux setup program, as shown in Figure 5.1.


    To set up Linux for TCP/IP, you may need to know the following:


    +   - *Network device*—For example, if your computer has one Ethernet card, your
    network device is eth0.

    +   - *Driver*—Linux setup programs should recognize most network cards. If you
    know your card is going to be "difficult," you can enter a driver along with any
    special IRQ or I/O ports.


    Table 5.1 LILO installation options.


    | Location | Purpose |

    |---|---|

    | Master Boot Record (MBR) | When you want to use LILO to choose between operating
    systems. |

    | First sector of primary partition | When you have another boot loader, such
    as System Commander or Partition Magic, that allows you to choose between operating
    systems. |

    | Floppy disk | When you don''t want to change your MBR or the first sector of
    a primary partition. Alternately, if you can''t install Linux below hard drive
    cylinder 1024 (see Chapter 4), this is a viable option for setting up Linux. |'
  merge: -1
  img_proc: true
- pgno: 115
  md: "![](img/7a908c965299f9cdfda2a4ea3cd98bf4_115_0.png)\n\nFigure 5.1 Network configuration\
    \ example based on Caldera Linux setup.\n\n+   - **IP address**—If you have a\
    \ static IP address, you also need to know the network mask. If your computer\
    \ will get its IP address from a Dynamic Host Configuration Protocol (DHCP) server,\
    \ just choose the appropriate option. A DHCP server temporarily assigns IP addresses\
    \ to different computers on a network.\n+   \n+   - **Network mask**—If you specified\
    \ an IP address, you need a network mask. A network mask, such as 255.255.255.0,\
    \ limits the range of possible IP addresses on your local network. Network masks\
    \ are sometimes called subnet masks.\n+   \n+   - **Nameserver**—A nameserver\
    \ includes a database of names, like mommabeans.com, and the corresponding IP\
    \ address of each, such as 192.168.10. You need the IP address for your nameserver\
    \ and any secondary nameservers for your network. Nameservers are also known as\
    \ Domain Name Servers (DNS) or as the Berkeley Internet Name Daemon (BIND) servers.\n\
    +   \n+   - **Gateway**—If your network is connected to any other network, you\
    \ need the IP address of the computer that serves as the junction between the\
    \ networks. In the example shown in Figure 5.1, the address is 192.168.10.1\n\
    +   \n+   - **Hostname**—You need a name for your computer, and it needs to be\
    \ different from any other computer on your network. In the example shown in Figure\
    \ 5.1, the hostname is linux."
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Domain—You also need a network name. In the example shown in Figure 5.1, the
    domain name is mommabears.com. (The fully qualified domain name of the computer
    is linux.mommabears.com.)


    In some ways, these network settings may not seem complete. If you don''t use
    a DNS server on your networks, you can also set up a file (/etc/hosts) with the
    IP address of each computer on your network. The information in this section does
    connect you to a local network. The gateway address also allows you to connect
    to external networks, such as the Internet.


    # X Window Settings


    Current Linux distributions allow you to configure your video card and monitor
    during installation. As discussed in Chapter 4, this involves configuring your
    video RAM, resolution, number of colors, monitor size, and frequency settings
    for both your video card and your monitor.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_116_0.png)


    > Make sure that your video card settings do not exceed the capability of your
    monitor.


    # Creating Rescue Disks


    Once you''ve configured the setup process, most Linux distributions prompt you
    to create a rescue disk. Although you may be able to restore some configurations
    with a generic rescue disk or even the installation CD-ROM, a rescue disk makes
    this job much easier. Linux uses the dd command to unpack the files for a custom
    rescue image to a 1.44MB floppy.


    If you ever need to make a rescue, you''ll probably need both your rescue disk
    and your boot disk.


    # After Installation


    If you''re upgrading Linux from one version to another on a production computer,
    you generally should set up the new version of Linux on a different hard drive.
    Once installed, you can then copy configuration files from the original version
    of Linux, and then test and revise the result as required.


    You can also reconfigure any settings made during a Linux installation. A number
    of the tools that help you do this are addressed in the following chapters.'
  merge: -1
