- pgno: 171
  md: 'This chapter covers the execution of a number of different commands. The interpretation
    of these commands is based on the Bourne Again SHell (bash), discussed in Chapter
    7. Some basic commands help you create and delete files and directories. Others
    help you read files in different ways. Some commands allow you to use the characteristics
    of a file. The bash shell even includes commands that allow you to copy to an
    MS-DOS floppy without mounting.


    Using these commands, you can manipulate a group of files for backups and compressed
    storage as well as find the amount of space taken by each file and volume.


    # Creating and Deleting Files and Directories


    A Linux directory is just a special file. Yet, the bash shell has special commands
    for creating and deleting directories. It''s easy to create a file. You can copy
    from an existing file or save to the file name of your choice from an editor or
    another application. It''s also easy to delete a file; so easy that some commands
    for deleting files can be dangerous.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_171_0.png)


    > When you use the cp, mv, or rm command, the -i switch prompts for confirmation
    before overwriting a file. Alternately, each of these commands has a -f switch
    that overwrites existing files without prompting. The cp and rm commands also
    have a -r switch, which recursively copies or deletes subdirectories. When used
    in combination, the -rf switches can be quite dangerous, especially for the root
    or superuser.


    # cp


    The simplest version of the copy command is cp file1 file2. The contents of file1
    are copied and placed in destination file2. The destination file has a new creation
    date and inode number. Other copy commands can overwrite destination files under
    various circumstances. You can even use a switch for the cp command to copy the
    contents of one or more subdirectories. Examples of how the cp command works are
    shown in Table 8.1.


    # mv


    If you want to rename a file in Linux, you move it. The mv command changes the
    name of a file. Unless you''re moving a file to a different volume, everything
    about the file, including the inode number, stays the same. Examples of mv commands
    are shown in Table 8.2.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Table 8.1 cp commands.


    | Command | Result |

    |---|---|

    | cp file1 file2 | Copies the contents of source file1 to destination file2. The
    destination file has a new creation date and inode number. |

    | cp file* Dir1 | Copies multiple files (with names starting with file) to a directory.
    |

    | cp -f file1 file2 | If you already have a file named file2, this command overwrites
    its contents without prompting. |

    | cp -i file1 file2 | If you already have a file named file2, this command prompts
    you for confirmation before overwriting this file. |

    | cp -p file1 file2 | Copies the contents of source file1 to destination file2.
    The destination file has the same inode number and creation date as the source
    file. |

    | cp -r Dir1 Dir2 | Copies the contents of the directory named Dir1, including
    subdirectories, to Dir2. The effect is recursive; in other words, if there are
    subdirectories under Dir1''s subdirectories, their files and directories are also
    copied. |

    | cp -u file1 file2 | If you already have a file named file2, and file1 is newer,
    this command overwrites file2''s contents without prompting. |


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_172_0.png)


    Identical files have the same inode number, and normally, the cp -p command results
    in two files with the same inode number. But you can''t have the same inode number
    on different volumes. The cp -p command doesn''t work as intended if you''re copying
    a file from one volume to another.


    # rm


    You can use rm to remove files and directories. One of the reasons that administrators
    are advised to run Linux in root or superuser mode only when necessary is that
    small mistakes in this command can easily delete all of your Linux files. For


    Table 8.2 mv commands.


    | Command | Result |

    |---|---|

    | mv file1 file2 | Changes the name of a file from file1 to file2. If the source
    and destination files are located on the same volume, the files retain the same
    inode number. |

    | mv file* Dir1 | Moves multiple files to a directory. |

    | mv -f file1 file2 | If you already have a file named file2, this command overwrites
    its contents without prompting. |

    | mv -i file1 file2 | If you already have a file named file2, this command prompts
    you for confirmation before overwriting this file. |'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'example, suppose you want to remove a group of temporary directories in your
    root directory: a.tmp, b.tmp, and c.tmp. You want to use the rm -r *.tmp command,
    but instead you type the following:


    ```

    rm -r * .tmp

    ```


    Because there is a space between the asterisk and .tmp, the shell assumes that
    you want to recursively delete all directories, and then delete the file named
    .tmp. The result would not be good.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_173_0.png)


    > Even if you''re the Linux administrator with root user privileges, don''t log
    in as the root user. Small mistakes can lead to the deletion of all of the files
    on your Linux computer.


    For this reason, it can be useful to enter the following alias command:


    ```

    alias rm="rm -i"

    ```


    This command makes sure that whenever you use the rm command, the shell prompts
    you for confirmation before you delete any file. Some Linux distributions set
    up this alias as a shell variable for root users. The key rm commands are shown
    in Table 8.3.


    # ln


    Instead of just copying or moving a file, you can link it. Links are common, especially
    for those programs that start at various run levels. When you link a file, you''re
    creating another path to a currently existing file. For example, if both you and
    a colleague are working on a file named project, you can create a linked file
    in your home directory. Assume the project file is in the /home/jim


    Table 8.3 rm commands.


    | Command | Result |

    |---|---|

    | rm file1 | Deletes file1 without prompting for confirmation. |

    | rm -d Dir1 | Deletes Dir1 without prompting for confirmation |

    | rm -i file1 | Deletes file1 after prompting for confirmation from the user.
    |

    | rm -f file2 | If you already have a file named file2, this command overwrites
    its contents without prompting. |

    | rm -r * | Removes files recursively; if there are any subdirectories in the
    current directory, this command deletes them (and all of their files) as well.
    |'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'directory. To create a link to a file in mj''s home directory, you would use
    the following command:


    ```

    ln /home/jm/project /home/mj/project

    ```


    When you work on either file, the change and results are visible and accessible
    to those who access both directories. This is sometimes known as a hard link.
    With a hard link, because both files retain the same inode number, both files
    are identical. If the original file is deleted, the hard-linked file remains in
    place with the original inode number.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_174_0.png)


    > The ln file1 file2 command leads to the same result as the cp -p file1 file2
    command.


    One useful option for links is symbolic mode, which allows you to see the linked
    file. For example, suppose you were to run the following command:


    ```

    ln -s /home/jm/project /home/mj/project

    ```


    You would see the linked file when you run a long listing (ls -l) of that file.
    This is known as a soft link. The linked file has a different inode number. If
    the original file is deleted, the soft-linked file is also deleted.


    # mkdir


    You can create directories with the mkdir command. The directory that you create
    does not have to be based in your current directory. You can make several levels
    of directories if you choose. You can also assign the permissions of your choice
    to the directory that you create. The key mkdir commands are shown in Table 8.4.


    Table 8.4 mkdir commands.


    | Command | Result |

    |---|---|

    | mkdir -p dir1/dir2 | Creates a directory named dir2. If dir1 does not exist,
    the -p switch makes sure to create that directory as well. Both are created as
    subdirectories of the current directory. |

    | mkdir -m 755/home/mj/dir3 | Creates a directory named dir3 as a subdirectory
    in mj''s home directory. The permissions (755) are rwx for the owner and r-x for
    other members of the group and everyone else. |'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# rmdir


    You can delete empty directories with the rmdir command. The directory that you
    remove does not have to be based in your current directory. You can delete several
    levels of directories if the directory that you delete empties others. For example,
    with the following command, you can delete the directories named dir1 and dir3:


    ```

    rmdir -p dir1/dir3

    ```


    This command deletes directory dir3 if it is empty. If the only "file" in directory
    dir1 is dir3, this command also deletes directory dir1.


    # File Management Commands


    The bash shell includes a number of commands to help you read files in different
    ways. You can verify different types of files, and you can read files from the
    top or from the bottom. This read can be limited to a few lines or it can set
    you up to page through the entire file. You can also count the lines, words, and
    alphanumeric characters within a file. Furthermore, you can search through a file
    with the search term of your choice.


    Because it is difficult to define words or lines in binary files, most of these
    commands work best with text files.


    # file


    Although some distributions differentiate between file types by color, there are
    no standard extensions in Linux. Executable files don’t normally end in .exe,
    and document files may not end in .doc. The file command allows you view the type
    of each file. You can review how this works in Figure 8.1.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_175_0.png)


    Figure 8.1 Reviewing different file types.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'As you can see in Figure 8.1, you are not able to see the file type if you
    don''t have the proper permissions.


    # cat


    The concatenate (cat) command sends the text of a file to standard output. You
    can use the cat command on any file. The following command sends the text of the
    file to your screen:


    ```

    cat file

    ```


    # head and tail


    The head and tail commands are like two sides of a coin. The head command provides
    you with a view of the first few lines of a file. The tail command provides you
    with a view of the last few lines of that same file. You can regulate the amount
    of the file that you see with switches. For example, if you were to use the following
    command, you''d see the first 15 lines of the bully.txt file.


    ```

    head -n15 bully.txt

    ```


    If you substitute tail for head, you''ll see the last 15 lines of this file. Table
    8.5 lists more switches for use with these commands.


    # more and less


    The more and less commands aren''t opposites like head and tail. They both start
    at the beginning of a text file. When you run these commands on a text file, you
    review the contents of the file one page at a time. The less command is more versatile;
    unlike more, it allows you to scroll up and down any large text file with the
    Page Up and Page Down buttons on your keyboard.


    Because they can read text a little bit at a time, these commands can open a file
    more quickly than a text editor like vi. The less command also has some of the
    advantages of the vi editor, because you can use some vi commands to search through
    a file.


    **Table 8.5 head and tail commands.**


    | Command | Result |

    |---|---|

    | head 400b bully.txt | You see the first 400 bytes of the file known as bully.txt.
    |

    | tail 4k bully.txt | You see the final 4KB of the file known as bully.txt. |

    | head 3m bully.txt | You see the first 3MB of the file known as bully.txt. |

    | tail -n22 bully.txt | You see the final 22 lines of the file known as bully.txt.
    |'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Table 8.6 Commands that can be used after less is run on a text file.


    | Command | Result |

    |---|---|

    | space | Pressing the spacebar on your keyboard scrolls forward one page in your
    screen. |

    | Page Up | Scrolls back one page on your screen. |

    | Page Down | Scrolls forward one page on your screen. |

    | #z | # represents a number. The command 8z scrolls forward eight lines in the
    file. If you do not use a number, this command is equivalent to the space command.
    |

    | /abc | Searches through the file for the text string abc. This command is also
    used in the Linux vi text editor. |


    There are two sets of options with each command. A command like the following
    sets up the file named bigfile with line numbers:


    ```

    less -N bigfile

    ```


    Once the text file is open, you can run other commands as described in Table 8.6.


    The more and less commands are also known as pagers because they allow you to
    review text files one page at a time.


    # File Manipulation Commands


    There are several commands that allow you to learn about and search for and through
    different files. The wc command allows you to get a count of the number of lines,
    words, and characters in a file. The find and locate commands search for specific
    files. The grep command lets you search through a file for a text string without
    opening it.


    # wc


    The wc command is fairly straightforward. With any text file, you have a certain
    number of lines, words, and characters. With the wc command, you can find all
    three characteristics. For example, suppose you were to check the showoff text
    file as follows:


    ```

    wc showoff

    ```


    You would get something like the following:


    ```

    1914  9298  76066

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Table 8.7 Examples of the wc command.*


    | Command | Result |

    |---|---|

    | wc -l showoff | Number of lines in the file showoff. |

    | wc -w showoff | Number of words in the file showoff. |

    | wc -c showoff | Number of characters in the file showoff. |


    *You can use the -l, -w and -c switches in any combination.


    These numbers correspond to the number of lines, words, and characters in this
    file, respectively. You can get any individual figure based on the commands shown
    in Table 8.7.


    # find


    The find command looks through directories and subdirectories for the file(s)
    of your choice. For example, if you want to find a file named fig07-02.tif, you
    could use the following command:


    ```

    find / -name fig07-02.tif

    ```


    This command searches in the root directory and all subdirectories for the fig07-02.tif
    file. This search can take quite some time. If you have more information, you
    may want to substitute a lower-level directory for the root (/).


    With the find command, you can also use wildcards like the asterisk (*) and question
    mark (?) in your search term.


    # locate


    An alternative to find is the locate command. This command searches through a
    database of your files. By default, if you keep Linux running on your computer,
    the database associated with the locate command is created overnight. If you''re
    searching for a file that wasn''t created since the last database update, the
    locate command finds files much more quickly than find.


    The locate command is also more flexible; if you use the following command, it
    returns all files that include the text string fig0.


    ```

    locate fig0

    ```


    The locate command works as if asterisks are assumed before and after the search
    term.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '> The locate command works like grep on a database of your files. In some distributions,
    the slocate command is used for this purpose.


    # grep


    The grep command is a handy way to search through a file. As a system administrator,
    you may have long lists of users. If you want to search through your /etc/passwd
    file for a user named "michael jang," you could try the following command:


    ```

    grep "michael jang" /etc/passwd

    ```


    If the user named "michael jang" exists, you would see a line similar to the following:


    ```

    mj:x:500:500:michael jang:/home/mj:/bin/bash

    ```


    This preceding line tells you the home directory and default shell for that user.
    If the search string exists in more than one line, you’ll see those lines as well.
    You can even use grep to search through a series of files with commands like the
    following:


    ```

    grep mj *

    ```


    ```

    grep -c bash /etc/passwd

    ```


    The first command looks for the string mj in all files in the current directory.
    The second command counts (-c) the number of lines that include the word bash.


    > To use the asterisk (*) and other wildcards as search terms (rather than as
    wildcards), use a backslash. For example, if you wanted to search for asterisks
    in the /etc/passwd file, use the grep \* /etc/passwd command.


    # Multiple Commands


    It’s a common practice to use more than one Linux command in a line. For example,
    if you’re using the find command and you know that the result will have a large
    number of files, you can use a command like grep to search through the result.
    Specifically, let’s say you want to find your Netscape cache file. You might start
    with the following command:


    ```

    find / -name netscape

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'However, you might get discouraged when you see hundreds of files flashing
    past you on your terminal screen. An alternative is to combine commands like this:


    ```

    find / -name netscape | grep cache

    ```


    This command searches through the results of the find command for the text string
    cache. Only those files with both strings are output to the screen. Other possible
    command combinations include the following:


    +   - who | grep mj

    +   - ps aux | grep netscape


    The first command, who, lists all users currently logged on to your Linux system.
    When you pipe (|) the result to the grep mj command, you''ll find the number of
    times that user mj is currently logged on to your system.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_180_0.png)


    The letter w is also a bash command. Both w and who show users who are currently
    logged on.


    The second command, ps, lists the processes currently running on your Linux system.
    The three switches, aux (a dash is not required for ps command switches), lead
    to a very long list of processes: all processes run by all users (a) each associated
    with the user name (u) independent of the virtual terminal (x). You need a tool
    like grep to search through these processes. This combined command returns all
    processes with the word netscape.


    ![](img/7a908c965299f9cdfda2a4ea3cd98bf4_180_1.png)


    Commands like who and ps are discussed in detail in Chapter 11.


    # MS-DOS File Tools


    Linux includes tools that you can use to view an MS-DOS directory. Yes, you can
    use regular Linux commands such as ls and cd to review a mounted MS-DOS directory.
    But with MS-DOS tools, you don''t have to mount the MS-DOS directory. Instead
    you can run familiar looking commands like the following:


    ```

    mdir a:

    mmove fig07-01.tif a:

    mcopy a:rhl.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The first command lists the current files in your a: drive. The second command
    moves the fig07-01.tif file from your current directory to the a: drive. The third
    command copies the file rh1.txt from your a: drive to your current directory.
    These commands do not work if you''ve already mounted your floppy drive.


    # Managing Multiple Files


    There are two basic commands that are used as common Linux ways to manage multiple
    files: gzip and tar. For those of you familiar with Microsoft Windows-based "zip"
    utilities, these two commands break the zip process down into two parts. The tar
    command collects a series of files into an archive, and the gzip command compresses
    a file.


    # Archiving by tar


    The tar command is known as the tape archive command for historical reasons: Backups
    used to be primarily made to tape drives. Although tape drives are now less common,
    tar is the main Linux backup utility. It is designed to copy a series of files
    into a single large file. If you want to back up the files in your current directory,
    you might run the following command:


    ```

    tar cvzf goodbackup.tar *

    ```


    This command creates (c) a backup, listing every file name in the archive (v=verbose)
    in compressed format (z=zip) in the file (f) named goodbackup.tar. Files in subdirectories
    are also saved to this archive. You can then save this archived file to a backup
    area such as another volume or a tape drive.


    > TIP

    > When setting up an archive, it''s good practice to save to a file with the .tar
    extension. Many Linux downloads are archived in .tar format.


    You can just as easily unarchive files with the following command:


    ```

    tar tkvzf goodbackup.tar

    ```


    This command lists (t) the files in your archive. When it restores, it does not
    overwrite your current files (k=keep old files). In verbose (v) mode, you see
    everything that happens. If you stored files in a zipped format, you need to restore
    from the zipped (z) format. Finally, the command is restoring from the backup
    file (f) named goodbackup.tar. You can review some of the available tar switches
    in Table 8.8. Note that the first switch in the tar command should start with
    c, t, or x.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '**Table 8.8 Command switches for tar.**


    | Switch | Purpose |

    |---|---|

    | c | Create an archive |

    | t | List files in a current archive |

    | x | Extract files from an archive |

    | d | Compare files between an archive and a current directory |

    | f | Use the following file name for the archive |

    | k | Do not overwrite existing files |

    | v | Verbose option; list all files going in or coming out of an archive |

    | r | Add files to the end of an archive |

    | z | Zip; compress files to or from an archive |


    There are a number of tar commands that you can use to create and extract archives.
    Some typical commands include the following. Read them over, referring to the
    descriptions in Table 8.8:


    ```

    tar xvf download.tar

    tar cvf backup.tar

    ```


    # gzip and gunzip


    You can compress a file with the gzip command. You can also further compress a
    tar file that''s already been compressed with the z option. The syntax of this
    command is fairly simple:


    ```

    gzip goodarchive.tar

    ```


    The gzip command compresses the target file and adds a .gz extension to the end
    of the file name. The gunzip command reverses the process as follows:


    ```

    gunzip goodarchive.tar.gz

    ```


    > > **TIP**

    > > When you download a new Linux program from the Internet, it often has a .tar.gz
    extension at the end of the file. You can use the gunzip and tar commands to extract
    the files that you need from this type of download.


    # Disk Management Commands


    There are two very similar disk management commands available in Linux: du and
    df. The directory usage (du) command lists the amount of space used by each file
    in and below your current directory. The free disk space (df) command lists'
