  img_proc: true
- pgno: 91
  md: '![](img/b40e8bf6cf651f8eebf36f5265123095_91_0.png)


    Manuskript’s default World panel, which is only partially visible in Figure 7,
    is frankly overwhelming, at least for trilogies. There are so many categories
    to fill that one may be forgiven for thinking “this will take much more time than
    actually writing my book!” Don’t despair though. First of all, you are not forced
    to fill every one of those boxes before you start writing. Besides, you can, and
    probably should, delete as many of them as desired, if you are sure they are not
    needed for your particular story.


    At the same time, gathering enough patience and discipline to completely describe
    a world using those boxes, as early as possible, would very likely improve the
    quality of the result, as well as save time in the long run. This is true especially
    for series spanning multiple books, where it would be much harder to avoid plot
    holes and maintain continuity and coherence without having all the necessary information
    always at hand, inside those boxes.


    Good usage of the Plots and World panels is absolutely essential for writing good
    fiction with Manuskript, but the one panel that you will almost always use, for
    any writing project, is likely the Outline panel in Figure 8. In it you can list
    every section of your work in hierarchical order and assign each a Status, Word
    count, Label, and from whose point of view (POV) each part should be written.
    The Outline also shows very clearly which parts still need the most work, and
    its essential function is to make it really easy and quick to add, remove, or
    rearrange chapters and subchapters. For nonfiction projects, this may very well
    be the greatest help Manuskript can give authors.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_91_1.png)


    # ### Finally, the Editor


    Once all the information you need to write well is nicely laid out inside Manuskript,
    you can click on the last button of the Navigation toolbar to finally start writing.
    If you used Manuskript properly, you will first see the top-level outline of your
    story. Then, clicking on a section will display all its subsections as index cards,
    each marked with its advancement status and its summary editable in place (Figure
    9). Clicking on any chapter in the outline tree instead will open it in the Manuskript
    editor (Figure 10). You may use it in full-screen mode, for maximum concentration
    (click on the button in the bottom right corner to activate it), or inside the
    main Manuskript window as shown in Figure 10, to consult your writing database
    in real time. In Figure 10, for example, I clicked on the Metadata tab to see
    all the properties of that chapter, and on Story line to see where each plot and
    subplot should start or end. The Manuskript editor is deliberately bare because
    its main goal is to support distraction-free writing of more or less plain text
    (more on this below). Still, it has all you need to write efficiently. Besides
    dynamic word count, there is support (Figure 11) for several spellcheckers and
    dictionaries, plus a Frequency Analyzer that shows which words and phrases you
    write more frequently. This last function can be very useful both in order to
    not repeat yourself and to figure out which are the characters or concepts that
    get the most space in your'
