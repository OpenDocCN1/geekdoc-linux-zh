- pgno: 47
  md: "example of this where the browser immediately displays a JPEG file on calling\
    \ localhost:8080 or IP address:8080 without any complaints.\n\nThe interesting\
    \ thing here is not just that this works, but that it also represents a potential\
    \ vulnerability. Apparently, most web browsers don't bother checking whether the\
    \ content of the GET request and the returned page actually match. In this case,\
    \ the browser asked for the index page of the web server and was given a JPEG\
    \ file instead. That's something like a tennis player getting a basketball thrown\
    \ at them by their opponent all of a sudden.\n\nFrom experience, these idiosyncrasies,\
    \ and many other features you might want to implement, are not very well documented\
    \ on the web or are not documented at all. That's why it could be useful to log\
    \ what Firefox and other browsers request. The function in Listing 9 starts the\
    \ server. You can see two tee redirects there that forward all of the data to\
    \ a logfile for the debugging. This log will then contain the date and time, what\
    \ the web browser sent as a request, and what the server sent back as a response\
    \ (Figure 4). Armed with these details, you can analyze each request and response\
    \ and understand what exactly is going on when the client and server talk.\n\n\
    For example, many browsers ask for the famous favicon.ico after they have talked\
    \ to a server for a little while. This is the icon that you usually see at the\
    \ top of the browser's tabs. It is usually found in the web server's root folder.\n\
    \nIf you want your own server to provide a favicon, you first need to find out\
    \ what the browser request looks like and then tell the server to respond\n\n\
    appropriately. You can tell that the web browser often asks for this file from\
    \ the error message cat: http_home/favicon.ico: file or directory not found in\
    \ the logfile.\n\n```\n**Listing 9: Calling the Web Server**\nfunction run_server\
    \ () {\n  while true; do\n    date | sed -r 's/\\/[\\d/\\n\\g]>> debug\n    respond\
    \ < $HTTP_GET | tee --append debug |\n      netcat -l $HTTP_GET_PORT\n    tee\
    \ --append debug > $HTTP_GET\n  done\n}\n```\n\n# Conclusions\n\nAs you can see,\
    \ a rudimentary web server is quite easy to build yourself. The web server presented\
    \ in this article has a plain and simple design, but it is not intended to compete\
    \ with major league players like the Apache web server or Nginx. On the other\
    \ hand, our homemade web server does have some capabilities that a typical web\
    \ server won't offer. For instance, you can access the whole repertoire of shell\
    \ commands to display information locally with minimal overhead. The resources\
    \ consumed by the small script are also minimal. This DIY server is quite useful\
    \ as an info server on your own network, and you can also use it to transfer files\
    \ from one computer to another -- all told, not a bad solution for small tasks.\n\
    \n# Info\n\n+   [1] Netcat: https://netcat.sourceforge.net/\n+   \n+   [2] Code\
    \ for this Article: https://linuxnewmedia.thegood.cloud/s/5Rzx9tQW2FJ6JNr3\n+\
    \   \n+   [3] Queue: https://en.wikipedia.org/wiki/Queue_(abstract_data_type)\n\
    +   \n+   [4] sed: https://www.gnu.org/software/sed/manual/sed.html\n+   \n+ \
    \  [5] HTTP status codes: https://en.wikipedia.org/wiki/List_of_HTTP_status_codes\n\
    \n# Author\n\nGoran Mladenovic is a hobby developer and inventor, who believes\
    \ programming is a passion.\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_47_0.png)\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_47_1.png)\n\n**Figure 4:** An excerpt\
