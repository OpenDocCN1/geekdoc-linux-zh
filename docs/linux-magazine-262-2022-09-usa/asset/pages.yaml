    had different branches that you merged into your tree.


    *"Sometimes having multiple branches doesn’t actually cause that, because the
    different branches may all have the same base starting point."


    *"Git calls these things ‘merge bases’, because those starting points [are] what
    you have to take into account when merging, where the ‘base’ for actually resolving
    the differences that come in through multiple branches."


    *"And git handles that perfectly fine when merging by doing all the appropriate
    magic. And ‘git log’ has no problem with it either — you can list all the commits
    that are in your head but are ‘not’ in some arbitrary number of merge bases just
    fine."


    *"But when you do a ‘git diff’, things are different (and ‘git request-pull’ basically
    just does a diff to show what the thing was about."


    *"A ‘diff’ is fundamentally something you do on two end-points. You have a beginning,
    you have an end, and you ask ‘what changed between these two end-points’."


    *"But that fundamentally means that when you have multiple different merge bases,
    and you ask ‘what changed since the beginning and the current state’, your question
    is fundamentally ambiguous. There is not *a* ‘the beginning’. There are ‘multiple’
    beginnings."


    *"So what git will do it to pick *one_ beginning, and just use that."


    *"And that means that yes, the diff will show the changes since that beginning,
    but since the end result depends on the *other_ beginning too, it will show the
    changes that came from that other beginning as well."


    *"Sometimes those changes end up being empty, because the ‘first beginning’ might
    already have had all of that. So sometimes you might not even notice that what
    ‘git diff’ gave you was ambiguous."


    *"So ‘git request-pull’ does both a log (for the shortlog of commits) and a diff
    (for the diffstat), and the log should always be correct, and the diffstat will
    have this ambiguity problem if you have multiple merge bases."


    Linus went on:


    *"In the general case, you aren’t doing anything wrong: if you merge multiple
    real branches, it’s just that ‘git diff’


    cannot find a single unique point to use as the base, and you’ll get some odd
    random diff.


    *"But if you are a developer who merges multiple real branches, you obviously
    know how to merge things, and one way to sort it out is to basically do a test-merge
    just for yourself:''*


    ```

    # WMLS? (“What would Linus See?”)

    git branch -b test-merge linux

    git merge my-branch

    git diff -C --stat --summary ORIG_HEAD...

    ... save that away ...


    # go back to your real work,

    # and remove that test-merge

    git checkout -m main-branch

    git branch -D test-merge

    ```


    *"will generate a diffstat of what a merge (which fundamentally knows how to resolve
    multiple merge bases) would generate."


    *"Obviously you can just do the above in a completely separate git tree too, if
    you don’t like doing those temporary branches that might mess up your working
    tree."


    *"The other alternative is to just send me the bogus diffstat - I’m sadly quite
    used to it, since a number of people just do ‘git request-pull’, see that it’s
    odd, don’t understand why, and just let me sort it out."


    *"Now the good news is that people who are afraid of merges and the above kind
    of complexity will never actually see this situation. You can’t get multiple merge
    bases if you don’t do any merges yourself."


    *"So this kind of git complexity only happens to people who are supposed to be
    able to handle it. You clearly figured out what was going on; you didn’t perhaps
