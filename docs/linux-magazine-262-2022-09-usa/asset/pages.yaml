    \ \\\n--volume nextcloud-data:/var/www/html/data \\\n--network nextcloud-net \\\
    \n--restart on-failure \\\n--name nextcloud \\\n--publish 8080:80 \\\ndocker.io:library/nextcloud:latest\n\
    ```\n```"
