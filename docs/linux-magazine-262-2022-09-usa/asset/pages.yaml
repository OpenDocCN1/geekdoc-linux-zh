    **Figure 4:** The Pacifica State Beach parking lot is still **10** kilometers
    from the target.


    northeast direction (NE) to the location of the photo the game selected. If you
    know the area, you can probably guess: The destination must be somewhere in the
    suburbs of South San Francisco, where the giant Costco supermarket is located.
    In fact, that shelf filled with rotisserie chicken is the solution, as the *WINNER*
    message indicates (Figure 5). There are still two unclicked photos in the right-hand
    column, showing a bridge in Heidelberg, Germany, and one showing the sand at Esplanade
    Beach in the Bay Area.


    # Seek and Ye Shall Find


    So how does the game work as a Go program? To sift through the entire photo collection
    downloaded from my cell phone to my hard disk takes some time, even though it
    is on a fast SSD. That’s why the `finder.go` helper program in Listing 1 plumbs
    the depths of the cell phone photo directory set in line 18, analyzing each JPEG
    image found there and reading its GPS data, if available, to cache it for later.


    The program feeds the results into a table in an SQLite database so that the game
    program can quickly select new images in each round later on, without having to
    comb through entire


