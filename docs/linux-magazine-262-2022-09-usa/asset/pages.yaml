    # A Work in Progress


    Although the latest release is MX-21.1 – presumably, a continuation of antiX’s
    version numbering – MX Linux strikes me as a work in progress. Its original utilities
    seem long overdue and many deserve to be ported to other distri- butions, but
    I would like to see what will be added next. Similarly, although func- tion is
    the priority – a point obviously agreed upon by many users – MX Linux has rough
    edges that remind me of old versions of MEPIS – and indeed of all distributions
