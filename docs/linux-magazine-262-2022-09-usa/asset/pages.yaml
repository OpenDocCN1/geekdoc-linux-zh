    # A Note on the Jargon


    An annoying feature of Homebrew is that it extends the metaphor of its name, giving
    different names for its directories depending on their contents, such as cellar,
    rack, or kegs, making it hard to know how one term relates to another. Similarly,
    when installing, the output talks of “Pouring” (Figure 2). Fortunately, for many
    basic uses, you can ignore this needless complication, but Figure 3 shows how
    the various terms are related to each other. Mostly, you only need to know that
    a formula is a package, and a manifest is a package’s installation script. These
    two pieces of jargon break the metaphor, and perhaps that comes as a relief. Occasionally,
    however, it may be quickest to work with multiple formulae by using, for instance,
    commands that affect kegs or racks (i.e., directories with multiple formulae).
    If you need to know more about other terminology, a summary is available online
    [5].


    # Using the brew Command


    The basics of Homebrew are almost identical to those of most package managers.
    That is, they consist of the basic command, followed by a subcommand or action,
    and then the specific package affected, if any. Commands that do not specify a
    formula apply to all of Homebrew, such as brew update. Table 1 shows a list of
    basic commands, using gcc as an example. This is, of course, a different version
    of gcc than any installed from a distribution’s repositories. Like Debian and
    other distributions, Homebrew also maintains a web page of available formulae
    (one the same page as the Homebrew terminology [5].


    | Action | Command |

    | :--- | :--- |

    | Install | brew install gcc |

    | Remove | brew remove gcc |

    | Auto-remove dependencies | brew autoremove |

    | Upgrade formula | brew upgrade gcc |

    | Upgrade all formulae | brew upgrade |

    | List installed formulae | brew list |

    | List available formulae | brew formulae |

    | Search | brew search TEXT |


