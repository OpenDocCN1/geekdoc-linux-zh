  md: '# Cut replacement


    # tuc


    One of the most underused and underrated commands that you find built-in to the
    average terminal, cut has been around for a long time. While many of us can usually
    guess its function, our finite memory means it''s usually easier to construct
    an equivalent command from pipes or even copy and paste than bother with the cut
    --help. The cut command helps you to extract various parts of a file, or piped
    input, by specifying ranges, delimiting characters, and even byte positions. It''s
    powerful, but it''s no longer the only cut command you should have in your path.
    That''s because there''s a new alternative called tuc, a cunningly named tool
    that does everything cut does while also filling in gaps in its functionality.
    And it does far more than reversing the order of text.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_85_0.png)


    > You also reverse a list of items or even entire lines of text with tuc, thanks
    to its ability to handle negative indexes.


    for more processing. It''s also easy to replace fields or their delimiters or
    reformat the output using references to the various values returned from the input
    stream. It sounds abstract when written like this, but tuc is actually easy to
    use and solves many of the problems you find when trying to import or process
    a list of values with cut.


    # Project Website


    https://github.com/riqutuo/tuc


    # Music player


    # Myuzi


    Myuzi is a desktop music playing application that describes itself as a "Spotify
    alternative," only without the need for a subscription or the arduous advertising.
    This might sound like the application is bypassing Spotify''s strict user license,
    but it''s not. None of the music that appears when you use Myuzi''s search, or
    any of the music you hear when you click play, is sourced from Spotify. Instead,
    Myuzi''s music comes directly from YouTube, which makes it the audio equivalent
    to one of the many video and download tools that can help you explore YouTube
    without being tempted by its web-based suggestions. This makes more sense with
    music because listening to music shouldn''t necessarily involve staring at a screen
    or should at least keep it to a minimum, especially when it comes to finding what
    you want to listen to. Myuzi is brilliant for this because it purposefully keeps
    things simple and distraction-free so you can focus on what''s playing.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_85_1.png)


    > The simple interface is perfect for removing all the distractions of YouTube
    while you listen to its unparalleled music library.


    Its single window is split into three tabs: one for creating and playing playlists,
    another for searching and playing results, and a final tab for settings. The last
    tab only includes volume and the option to mute playback. Beneath all of the panels
    is the transport control, showing the currently playing track, progress through
    the track, and transport controls for rewind, play, and forward. To get started,
    you search for something you''re interested in, select the result you want to
    hear, and click play. A moment later, you''ll hear only the audio associated with
    whatever the YouTube video might be, free of any distractions or dubious camera
    angles. Favorite tracks can be added to your own playlists, and multithreaded
    playback keeps everything smooth. What''s great about this approach is that YouTube
    can often be the only place to find certain rare tracks and live performances,
    and you often want a simple music player that helps you listen to those tracks.
    Myuzi is exactly this.


    # Project Website


    https://gitlab.com/zechikira/myuzi'
