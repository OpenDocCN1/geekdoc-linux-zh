  md: "# Listing 6: POST Simulation\n\n```\n```bash\necho \"File arrived\" | netcat\
    \ -l 8081 > upload/filex.jpg\n```\n```\n\n# Listing 7: Filtering\n\n```\n```bash\n\
    01 function run_post_server () {\n02   \n03   message_for_post='HTTP/1.1 200 OK\n\
    04   Content-Length: 13\n05   Connection: close\n06   \n07   File arrived\n08\
