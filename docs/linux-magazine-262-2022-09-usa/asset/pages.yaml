  md: '![](img/b40e8bf6cf651f8eebf36f5265123095_66_0.png)


    machine''s wireless interface. Choose a WiFi network, enter the password, and
    let DHCP do its magic. You can alternatively use the Ethernet cable provided –
    this can be a good idea if the WiFi connection is too slow or unreliable. Once
    the machine has an IP address, make a note of the address and move on to the next
    stage, installing Beam Studio.


    # **Beam Studio**


    If you worked with CO2 lasers prior to 2009, one of the biggest items on your
    wish list was probably a camera with software support that let you see what the
    laser was &ldquo;seeing.&rdquo; Something that would take the guesswork out of
    positioning the laser head and alleviate any worries about lasering beyond the
    edge of the medium. Amazingly, considering its low price compared to the laser
    behemoths of the past, the FLUX laser family has exactly that in the form of a
    built-in camera and Beam Studio.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_1.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_2.png)


    To install Beam Studio (Figure 2), go to the FLUX website [2] and select the version
    that matches your operating system. If you have a recent Ubuntu system, this will
    be v.1.8.3 -Ubuntu-18.04 x64. The name of the install file is beam-studio_1_8_3_amd64.deb,
    and you can install it using the Ubuntu package manager.


    Right-click on the downloaded file, then select Open with other application, and
    then select Software Install. The installer prompts you for your password and
    then sets about installing Beam Studio. If you picked the DEB package up directly
    from FLUX, you can ignore the warnings about the software being potentially unsafe.


    Beam Studio asks you to set up an account and then prompts you to choose how to
    connect to your laser cutter (Figure 3). You can also optionally choose to calibrate
    the camera (Figure 4).


    # **Test Job**


    FLUX thoughtfully provides a tiny piece of plywood and a test job to help you
    get started. It&rsquo;s a good way of finding out if your laser is correctly aligned.
    If it isn&rsquo;t, see the &ldquo;Smoke and Mirrors&rdquo; box.


