    \ the power on. On the touch panel, tap Maintain. On the maintenance screen, tap\
    \ Motors. Then move the laser head manually to the top left position after doing\
    \ so. Now press Laser Pulse to fire one shot at the tape (you should see a puff\
    \ of smoke) and make sure you can see a dot. Now, move the laser head manually\
    \ to the bottom left position. Make sure the lid is closed and fire another shot\
    \ at the tape. If the dots from the laser head line up, you can move on to the\
    \ next mirror. If they don't line up, adjust the screws on mirror\n+   \n\n+ \
    \  number one and repeat the steps until the mirrors are lined up. If the second\
    \ shot misses the tape entirely, move the head to center left position to check\
    \ the direction in which you need to adjust. Turning the top left screw clockwise\
    \ moves the dot down and to the left. Turning the top right screw clockwise moves\
    \ the dot to the right, and moving the bottom screw moves the dot upward. Easy.\
