    # Fedora Linux Is Coming to the Raspberry Pi 4


    Fedora Linux has been available for desktops, servers, and even IoT devices. However,
    if you wanted to install the OS on the Raspberry Pi 4 device, you were out of
    luck — until now. With the upcoming release of Fedora 37, support for the devices
    might well finally become a reality. Although not official, it has become a proposed
    change and will be implemented if it receives approval from the Fedora Engineering
    Steering Committee.


    The reason the Raspberry Pi 4 has yet to be supported by Fedora Linux has been
    the lack of accelerated graphics. However, with upstream work to the kernel and
    Mesa (specifically the V3D GPU for both OpenGL ES and Vulkan), it’s now just a
    matter of enabling support. The one caveat is that support for WiFi on the Raspberry
    Pi 400 is not a part of this (although testing for audio support is).


    According to the Raspberry Pi 4 Fedora Wiki page, “The support for the Raspberry
    Pi ecosystem has been an ongoing evolution. The aim of this change is to support
    the Raspberry Pi 4 including the 4B, the 400, and the CM4 with I/O board. Upstream
    now supports accelerated graphics using the V3D GPU for both OpenGL ES and Vulkan.
    There’s also enhancement to wired networking with support for PTPv2 on the CM4/4B.”


    ![](img/b40e8bf6cf651f8eebf36f5265123095_8_0.png)


    # KaoS 2022.06 Now Available with KDE Plasma 5.25


    KaoS was first created in 2013 as a Linux distribution that focuses on the KDE
    Desktop Environment. The original goal was to create a highly polished KDE experience,
    which the developers achieved quite well. And with the latest release, that experience
    is made even better with the addition of KDE Plasma 5.25 and a number of other
    additions and enhancements.


    As to what else has been added to KaoS, you’ll see KDE Frameworks 5.95, KDE Gear
    22.04.2, Calamares 3.3, LibreOffice as the default office suite (a change from
    Calligra), Linux kernel 5.17 (which adds improved support for GPUs), and a new
    package selection addition to the onboarding Welcome screen.


    Of course, at the heart of KaoS 2022.06 is KDE Plasma 5.25, which adds a host
    of improvements, including improved gesture support, tints for window accent colors,
    a much-improved touch mode, 10-bit color for Kdenlive, many enhancements to Kate,
    and an enhanced Settings dialog.


