    # # MakerSpace


    Get creative with the FLUX Beamo laser and open source software


    # ## Beam Me Up, Fluxy!


    ![](img/b40e8bf6cf651f8eebf36f5265123095_65_1.png)


    > With the FLUX Beamo laser and a Raspberry Pi Board B10001, you can execute your
    own laser cutting projects on a wide range of materials. *By Christa and Ian Travis*


    L aser cutting mainly used to be the purview of hard-headed business owners with
    solid fi-nancial backing and a busi-ness plan to make sure the laser paid for
    its upkeep. And there were hobby-ists who were more interested in the arts and
    crafts side of laser cutting and saw the laser as a tool for cutting and engraving
    materials such as wood, cloth, and acrylics in the scope of their arts and crafts
    projects. The trouble was, many people were more than a lit-tle worried about
    the Heath Robinson-style, low-budget lasers they could pur-chase at the time.
    The foundations of the laser world were to be shaken though, when FLUX – an organization
    founded by a "group of passionate young engineers and designers," as the manufacturer
    itself states – launched the Beebox laser cutting machine back in 2018. FLUX quickly
    followed up with the Beamo, promoted as "the world''s smallest laser cutting machine"
    the next year.


    The FLUX laser family not only meant a paradigm shift in terms of laser cutting
    machine pricing, but also a move to-wards a community-driven approach. For one
    thing, the FLUX laser family re-lies on a Raspberry Pi, in the form of the Raspberry
    Pi Board B10001 [1], to con-trol the machine. And the downloadable software package
    that lets users send their ideas (in the form of, say, PNG im-ages or vector diagrams)
    to the laser runs on your choice of operating system, whether this be Windows,
    macOS, or Linux. Expanding on the community idea, FLUX users can get together
    to ex-change ideas on Facebook or at regular FLUX community meetings that take
    place all over the world – even in Ger-many, where we''re based. So, laser-af-fine
    readers, let''s get started with unbox-ing and the setup on the hardware and software
    side.


    # ### Unboxing


    The FLUX Beamo reaches its new owner in a very large and fairly heavy card-board
    box. If you are worried about the state of your back, then it''s a good idea to
    ask a friend to help you lift the beast out of the box. Once you''ve done this,
    there are a couple of tasks to complete before you get started on your first pro-ject.
    Besides doing the obvious things like removing the vent hose and attach-ing it
    to the duct on rear of the laser with the clamp kindly provided by the sup-plier,
    attaching the WiFi antenna, and plugging in, there is also the software setup.
    This no big deal: After powering on your laser cutter, select *Network on the
    Start screen* (Figure 1) and then *Con-nect to Wifi* if you are using the








    ![](img/b40e8bf6cf651f8eebf36f5265123095_65_2.png)'
  merge: -1
