  md: '# Programming Snapshot – Go Geolocation Game


    As shown in Figure 7, the finder util-ity from Listing 1 reads the 4,000 or so
    files in my phone folder in about 30 sec-onds and adds the photos’ metadata into
    the files table in the SQLite photos.db flat-file database.


    The call to the walk function in line 22 of Listing 1 receives the \visit callback
    de-fined in line 28. The file browser calls this function for every file it finds.
    It always drags a type walker data structure along with it as a receiver, which
    means that it can immediately access the db handle of the SQLite database opened
    previously.


    For each file found, line 31 checks whether the file has a .jpg extension (upper-
    or lowercase) and then runs the GeoJOS() function from line 47 to load the photo’s
    Exif data. This will ideally include the longitude and latitude of the location
    where the photo was taken as floating-point numbers.


    Line 39 feeds the path and GPS data into the database table with an INSERT statement
    in typical SQL syntax. Later, the main schntizle program can pick up the image
    location and metadata from


    the database, when it is looking for new snapshots for a new game.


    # Spoiled for Choice


    It is not particularly difficult to select a dozen pictures at random from a photo
    collection of several thousand images. What is trickier is to make sure that the
    lo-cations of the photos in one round of the game are not too close to each other.
    Many cell phone photos are taken at home, and the prospect of navigating inch
    by inch be-tween the living room, balcony, and kitchen is not exactly thrilling.


    Instead, I wanted the algorithm to ran-domly select images, while ensuring that
    new exciting game scenarios are created in each round, by always presenting a
    good mix of different regions. The cell phone photo app’s geographical view in
    Figure 8 illustrates how the shots can be assigned to bundled hotspots based on
    the GPS


    data. The algorithm then only ever selects one image from a given hotspot.


    The k-means algorithm [3] is a massive help here: k-means is an artificial intelli-gence
    [4] method, applied to cluster in-formation in unsupervised learning [5] (Figure
    9). From a set of more or less ran-domly distributed points in a two- or mul-tidimensional
    space, k-means determines the centers of the clusters. In the Schmitzle game,
    these would be locations where many cell phone photos were taken, such as at home
    or at various vacation destina-tions. The algorithm then randomly se-lects one
    image only from each of these clusters. This ensures that there will be a meaningful
    distance between the loca-tions where the individual pictures were taken for each
    round of the game.


    The phostOf() function starting in line 18 of Listing 2 has the task of deliv-ering
    an array slice of six photos of the


