    # ## Ubuntu 22.04 LTS


    ![](img/b40e8bf6cf651f8eebf36f5265123095_25_0.png)


    # ### Useful innovations in Ubuntu 22.04 LTS


    # # The Long Haul


    Ubuntu 22.04 LTS features an updated Linux kernel, numerous programming language
    updates, and improved virtualization and container tools, making it useful for
    developers and admins.  *By Kristian Kießling*


    Calling Ubuntu 22.04 LTS a COVID-19 release would be bad public relations, but
    it''s not completely untrue because its predecessor 20.04 was released more or
    less at the onset of the pandemic. For companies using Ubuntu Desktop, Ubuntu
    Server, Ubuntu Cloud, and Ubuntu Core, the upgrade to “Jammy Jellyfish” (Figure
    1) is well worthwhile, but there is no rush. Officially, the preceding Ubuntu
    20.04 LTS will still be supported until April 2025, with Extended Security Maintenance
    (ESM) for five additional years, assuming that you make an appropriate donation
    to Canonical.


    However, users of other Ubuntu flavors, such as Kubuntu, Lubuntu, Xubuntu, and
    the like, can only count on official support until April 2023. Without ESM, admins
    will need to assess the consequences of the upgrade and compatibility issues at
    a somewhat less leisurely pace. If you switch to Ubuntu 22.04, the support period
    is extended to 2027 (or 2025 for the other flavors).


    # ### Kernel Support


    By default, Ubuntu 20.04 used Linux kernel version 5.4.0, while Ubuntu 22.04 has
    kernel version 5.15 (linux-generic). Canonical even uses kernel 5.17 (linux-oem-22.04)
    on certified devices. If you want, you can also use the rolling Hardware Enablement
    (HWE) kernel [1] (linux-hwe-22.04) with the LTS versions, which updates the distribution
    with the regular point releases and kernel versions.


    According to Kernel.org [2], Linux kernel 5.15 will receive support for longer
    than other versions – specifically, until October 2023 (Figure 2). Presumably,
    the Ubuntu developers hope that another kernel with long-term support will have
    arrived on the scene by then. Otherwise, they will have to continue maintaining
    the kernel themselves after its shelf life expires [3].


    WireGuard was already backported by the developers in Ubuntu 20.04, but there
    are many other innovations in kernel 5.15. For example, kernel 5.15 includes a
    new NTFS driver, support for


    ![](img/b40e8bf6cf651f8eebf36f5265123095_25_1.png)


    Figure 1: Ubuntu on the desktop: The software store offers both Debian and Snap
    packages.'
