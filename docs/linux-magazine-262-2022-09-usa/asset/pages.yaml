    Listing 6 defines the main() function of the game and defines the individual widgets
    of the left and right game columns in makeMenu(). On top of this, you have the
    move mechanism that kicks in when the player clicks on a photo in the right column.


    The elements in the pool array are the photos for the right column, each displayed
    as a CanvasObj widget. In contrast to this, the left-hand widget column contains
    the photos already selected over the course of the game. They are located in what
    is initially an empty left array. Each time a photo in the right widget column
    is clicked, the callback associated with that photo sends the index of the selection
    to the picKn channel in line 31.


    Then the Go routine defined in line 45, running concurrently, uses select to handle
    the event. It computes the distance to the target image by calling n/ke in line
    50 and generates a Fyne card with the result in line 62. The Add() function appends
    the card at the bottom of the left column in line 63 and uses canvas.Refresh()
    to make sure the GUI displays the change.


    To make the clicked photo disappear from the right column, line 66 puts an empty
    Label widget in its place and then immediately whisks it away by calling Hide().


    At the start of the game, line 76 uses rand.IntExcept() to pick a random photo
    from the right column, but avoids disclosing the solution right away. Line 77
    pushes the index position into the picKn channel, very much like the callback
    of the photo widget selected by the user will do later on, setting off the same
    animation and moving it to the left column.


    In Go, programmers have to check results, practically after each function call,
    to make sure an error hasn’t crept in. It always comes back as an err variable.
    If it has a value of n/1, no error occurred. Each time, the corresponding error
    handler requires three lines of code and takes up vast amounts of space in listings
    printed in magazines.


    This is why line 82 simply defines a panicErr() function that executes this test
    in one line of code each time and, if an error occurs, aborts the program immediately
    by calling panic(). In production environments, errors are instead handled individually
    and often looped through further up the call stack, but page space in printed
    magazines is scarce and nobody wants to read monster-sized listings!


    # Off We Go


    You can compile the whole kit and caboodle with the commands from Listing 7. The
    resulting schnitzle binary can be launched at the command line, which causes the
    GUI to pop up on screen.


    On Linux, the Fyne GUI uses a C wrapper from Go to tap into the libX11-dev, libgl1-mesa-dev,
    libxcursor-dev, and xorg-dev libraries. To install the


    # Listing 7: Compiling Schnitzle


    ```

    ```

    $ go mod init schnitzle

    $ go mod tidy

    $ go build schnitzle.go gui.go photoset.go image.go gps.go

    ```

    ```


    game on Ubuntu, for example, you can fetch these libraries with the command


    ```

    ```sudo apt-get install```

    ```


    to ensure that go build in Listing 7 actually finds the required desktop underpinnings.


    # Conclusions


    Schnitzle is a lot of fun; try it out! Sometimes it’s surprisingly difficult to
    determine the compass direction in your head in order to even walk from one part
    of town to another, as depicted in the photos. I was often surprised by the results,
    even with locations that I thought I was very familiar with. The game offers hours
    of entertainment for the whole family when you travel long-distance photos from
    years gone by from the depths of a massive image collection.


