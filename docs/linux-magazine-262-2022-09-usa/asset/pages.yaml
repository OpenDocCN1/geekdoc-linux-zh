    # MX Linux


    MX Linux is fast, friendly, and focused on function. By **Bruce Byfield**


    MX Linux is a collaboration between MEPIS and antiX, whose initials form its name
    [1]. AntiX is a popular lightweight distribution, while MEPIS once occupied a
    role similar to that of Ubuntu or Linux Mint today, in that it added usability
    to Debian on the desktop. Although a relative newcomer, MX Linux stands out among
    the hundreds of other distributions by combining the best of its ancestors, offering
    the speed of antiX and the user-friendliness of MEPIS''s desktop tools.


    MX Linux''s flagship version features Xfce, with variations for older computers
    as well as 32- and 64-bit machines. Thirty-two and 64-bit versions are also available
    for KDE Plasma and Fluxbox, offering users midweight, heavyweight, and lightweight
