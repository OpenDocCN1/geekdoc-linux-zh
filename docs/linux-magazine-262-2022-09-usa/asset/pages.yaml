    Apple''s M1 chip, and a kernel-integrated Samba server, dubbed KSMBD. In addition
    to these major updates, there are several smaller tweaks to kernel security features.
    The eBPF kernel sandbox has been updated. There are some new system calls that
    simplify the container handling, among other things, as well as improvements to
    the collection of filesystems. For example, ex4, Ubuntu''s standard filesystem,
    has been faster since kernel 5.10 thanks to a fast commit feature.


    # Network Binds


    The server and client packages for Network File System (NFS) have been upgraded
    to the latest versions. NFS no longer supports mounting over UDP by default. The
    reason for the change is that NFS over UDP can cause data corruption on modern
    networks with connection speeds of more than 1 Gbps - this is due to fragmentation
    brought about by the heavy load [4]. The new Samba v4.15.5 is also on board and,
    among other things, ends the experimental status of multimchan support.


    SSH remains widely popular for connecting to Ubuntu machines on the network -
    either as an admin or for software that handles tasks on the target machines.
    OpenSSH 8.9, which is included with the new Ubuntu, disables RSA signatures by
    default because they use the insecure SHA-1. Disabling RSA may cause problems
    when communicating with older SSH servers, but that can be changed later [5].
    The SCP software that comes with SSH moves and copies files between machines.
    The software now offers a -s option to use SFTP mode instead of SCP mode. For
    security reasons, according to the OpenSSH project, this behavior will become
    the default in the near future. OpenSSL v3 is also now available; it removes some
    legacy, insecure algorithms. Certificates that still support SHA-1 or MD5 also
    no longer work with OpenSSL v3.


    The recently supported OpenLDAP 2.5.x is missing a few pieces, including the shell
    and BDB and HDB back ends. Bind v9.18, on the other hand, is now more secure,
    offering support for DNS over TLS (DoT) and DNS over HTTPS (DoH). The named service
    supports inbound and outbound zone transfers over TLS (XFR over TLS, XoT).


    In terms of security, nftables now is the new back end that manages the firewall
    rules, taking over the job from iptables, as well as from ip6tables (IPv6), arptables
    (ARP), and enables (Ethernet bridging). The nftables developers are the same people
    who created iptables, and they are looking to dump the legacy ballast in the new
    software. The two iptables versions (for IPv4 and IPv6 addresses) still cause
    confusion and have forced admins to manage them in parallel, until now.


    used features as modules. The new fuse3 version in Query 6.2.0 makes it easier
    to edit VM images without having root privileges and without having to boot the
    VM. In addition, Qemu now supports the Linux JACK sound server, which supports
    access with the particularly low latencies that musicians require.


    Version 8.0.0 of the Libvirt virtualization API is on board and comes with hot
    plug support for the VirtIO''s virtual filesystem. Version 4.0.0 of virt-manager,
    a graphical program for managing VMs on Linux, is included and provides a graphical
    option for configuring shared storage. VirtIOFS is available here as a selectable
    filesystem in the settings. Virt-manager also automatically activates the Trusted
    Platform Module (TPM) if the VM uses UEFI. The new default choice for x86 guests
    allows the host CPU to be passed through to the guests. And, last but not least,
    the VirtIO GPU is available for most modern guest systems.


    When creating VM templates, VMware users benefit from an innovation in cloud-init
    22.1, which now natively supports VMware as a data source. The LXD data source
    dynamically reads instance data from the LXD socket and applies configuration
    changes that also survive reboots.


