- pgno: 93
  md: "![](img/b40e8bf6cf651f8eebf36f5265123095_93_0.png)\n\nFigure 11: The Manuskript\
    \ editor may look bare, but you will find some of most important functions for\
    \ a writer there.\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_93_1.png)\n\nFigure\
    \ 12: Labels, chapter statuses, and other parts of Manuskript are easily customizable.\n\
    \n# The Conclusion? Try Manuskript, of Course!\n\nAs I wrote at the beginning\
    \ of this tutorial, Manuskript is still under extensive development, and it shows.\
    \ The version I tested (0.13.1), for example, has no support for printing directly\
    \ from within Manuskript. You must export your story (or as they say, compile\
    \ it) to some other format, open the resulting file with some other program, and\
    \ print from there. I also noticed that if you select a chapter in the outline,\
    \ and then click on Open in a new tab, nothing happens. Feature-wise, however,\
    \ I would really like it if the editor worked in WYSIWYG mode at least with Markdown\
    \ sources, or if it could show a live HTML preview of the same sources. Outside\
    \ the editor, it would be really nice to be able to at least print out the outline.\n\
    \nHere comes the interesting part, why it is important to know these details:\
    \ Among all the options that you may select or deselect after clicking on Edit\
    \ | Settings, maybe the most important is the one called Save to one single file.\
    \ If you go with that option, all the files and folders described above will always\
    \ and only be saved inside one compressed archive, in ZIP format but with the\
    \ .msk extension.\n\nIf you don't select that option, Manuskript will create a\
    \ folder named after the project, in which- ever directory you want, and keep\
    \ there all those files and folders, without any compression. Now, your taste\
    \ may vary, of course, but I strongly recommend using this option, for the following\
    \ rea- son, which is a paraphrase from the Manuskript documentation: If you do\
    \ not save as a single file, “Everything that is useful *remains accessible in\
    \ plain text.*” And this is important, because ev- erybody knows how to handle\
    \ plain text — *in- cluding software!*\n\nChoosing this option makes it much easier\
    \ to manage and process whatever you do with Manuskript with any other software,\
    \ for what- ever purpose. A folder full of plain text files and nothing else,\
    \ for example, can be man- aged by revision control systems or be backed up with\
    \ tools such as rsync, much more effi- ciently than one big, opaque compressed\
    \ ar- chive. Folders of plain text files are also fully indexable by programs\
    \ such as Recoll [7] and easy to search, modify, or create with standard shell\
    \ commands such as *find* and simple shell scripts.\n\nIt would also be very useful,\
    \ I think, if the editor could automatically recognize certain strings, for example,\
    \ the names of characters or places, and transform them into clickable links that\
    \ open the corresponding entries of the Manuskript data- base. I wouldn't be surprised\
    \ to discover that this feature is already planned.\n\nEven with these limits,\
    \ however, I think Manuskript already has great potential as a writer's assistant\
    \ and invite everyone who needs to write something big to give it a serious try.\
    \ One big rea- son to say this is the fact that, being based on plain text files\
    \ that are easy to process, Manuskript is easy to extend or integrate with other\
    \ tools. Person- ally, my first pet project with Manuskript will be to figure\
    \ out how to create a complete Manuskript project with a shell script, starting\
    \ from existing collections of Markdown drafts and notes. ▌\n\n# The Author\n\n\
    Marco Fioretti ([http://mfioretti.com](http://mfioretti.com)) is a freelance author,\
    \ trainer, and re- searcher based in Rome, Italy. He has been working with free/open\
    \ source software since 1995 and on open digital standards since 2005. Marco also\
    \ blogs about digital rights at [https://stop. zonal-m.net](https://stop.zonal-m.net).\n\
    \n# Table 1: Gandalf Character File\n\n| | |\n| --- | --- |\n| **Name:** | Gandalf\
    \ |\n| **ID:** | 0 |\n| **Importance:** | 2 |\n| **POV:** | True |\n| **Motivation:**\
    \ | See motivation |\n| **Goal:** | Destroy the One Ring, save Middle Earth |\n\
    | **Conflict:** | Tempted to take the Ring |\n| **Phrase Summary:** | Mightiest,\
    \ wisest wizard on Middle Earth |\n\n# Info\n\n+   [1] Manuskript: [http://www.theologeek.ch/manuskript/](http://www.theologeek.ch/manuskript/)\n\
    +   \n+   [2] How to Plan a Book Using the Snowflake Method: [https://jerichowriters.com/\
    \ how-to-plot/](https://jerichowriters.com/how-to-plot/)\n+   \n+   [3] Snowflake\
    \ Method in 10 Easy Steps: [https://proactiivewriter.com/blog/use-the- snowflake-method-of-writing-in-10-easy-\
    \ steps-how-to-start-writing-a-novel-for- beginners-updated](https://proactiivewriter.com/blog/use-the-\
    \ snowflake-method-of-writing-in-10-easy- steps-how-to-start-writing-a-novel-for-\
    \ beginners-updated)\n+   \n+   [4] *The Lord of the Rings* Fandom wiki: [https://lotr.fandom.com/wiki/Main\\\
    _Page](https://lotr.fandom.com/wiki/Main_Page)\n+   \n+   [5] LotRenum [psucm:](https://lotrempsum.com/)\
    \ [https://lotrempsum.com/](https://lotrempsum.com/)\n+   \n+   [6] Pandoc: [http://pandoc.org/](http://pandoc.org/)\n\
    +   \n+   [7] \"Tutorials: Recoll\" by Marco Fioretti, *Linux Magazine*, issue\
    \ 212, July 2018, p8/84: [https://www.linux-magazine.com/Issues/ 2018/212/Tutorials-Recoll/(language)/eng-US](https://www.linux-magazine.com/Issues/2018/212/Tutorials-Recoll/(language)/eng-US)"
