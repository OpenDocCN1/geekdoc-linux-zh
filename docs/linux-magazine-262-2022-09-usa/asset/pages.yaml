    \ use:\n\n```sudo apt install podman cockpit-podman```\n\nThe Debian instructions\
    \ should work on Debian Stable and its derivatives. Using older versions of Podman\
    \ sometimes results in deviations in the behavior.\n\nFor even better integration\
    \ between the containers and the host, you need to additionally install the toolbox\
    \ utility [6]. After doing so, packages can be installed in the container using\
    \ DNF, USB devices can be passed through,\n\n```\n```\n[[dd@fedora ~]$ podman\
    \ network ls\nNETWORK ID        NAME          DRIVER\n2f259ba93aa      podman\
    \        bridge\n[[dd@fedora ~]$ podman volume create nextcloud-app\nnextcloud-app\n\
    [[dd@fedora ~]$ podman volume create nextcloud-data\nnextcloud-data\n[[dd@fedora\
    \ ~]$ podman volume create nextcloud-db\nnextcloud-db\n[[dd@fedora ~]$ podman\
    \ volume ls\nDRIVER   VOLUME NAME\nlocal    nextcloud-app\nlocal    nextcloud-data\n\
    local    nextcloud-db\n[[dd@fedora ~]$ \n```\n```\n\n**Figure 3:** Our example\
    \ Nextcloud project consists of three volumes that can be created quickly with\
    \ simple commands. The volumes enhance the containers’ flexibility by allowing\
    \ data to be moved and edited between the containers and the host.\n\nand the\
    \ host’s home directory can be integrated (Figure 2).\n\n# Configuration\n\nFirst,\
    \ you need to create three volumes for the Nextcloud installation you want to\
    \ create in the Podman container (Listing 1). A volume [7] in this context acts\
    \ as a storage device that Podman creates and manages, providing the ability to\
    \ move and edit data between the container and the host. You can create volumes\
    \ up front with the podman volume command or directly when setting up the containers\
    \ (Figure 3).\n\nNext, create a new network by typing\n\n``podman network create\
    \ nextcloud-net``\n\nand check its properties with\n\n``podman network inspect\
    \ nextcloud-net``\n\nNow it’s time to create the containers, starting with the\
    \ MariaDB database. As an alternative, you could integrate PostgreSQL, whereas\
    \ SQLite is not a good choice for Nextcloud. The commands and specifications for\
    \ setting up the database container are specified in Listing 2.\n\nThe podman\
    \ run \\ command pops up an interactive shell where you can define the database\
    \ properties [8]. Make sure you select and remember the `<DB-User-Password>` and\
    \ the `<DB-Root-Password>`; you will need these later on. You can check whether\
    \ this all worked by typing podman container ls, which shows you the running container.\n\
    \nThe next step is to roll out Nextcloud. The same principle applies as shown\
    \ in Listing 3. Again, make sure you run the `<DB-User-Password>` from the DB\
