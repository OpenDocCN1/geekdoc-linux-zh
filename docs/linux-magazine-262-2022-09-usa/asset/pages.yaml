  md: "![](img/b40e8bf6cf651f8eebf36f5265123095_45_0.png)\n\n**Figure 1:** The DIY\
    \ web server returns a listing of the root directory content.\n\n```\n```\nListing\
    \ 5: Output\n01  function list_dir() {\n02      local output=$( ls --hide=upload\
    \ -l $HTTP_HOME | sed -r '\n03      s|<html><head><meta charset=\"utf-8\"><title>Content</title></head>\\\
    n04      <body style=\"margin: 45px; font-family: sans-serif\">\n05      $&.*|<li><a\
    \ href=\"\\1\">\\1</a>|\\1#)\n06      s|</body></html>\n07  )\n\n08\n09      local\
    \ content_length=“Content-Length: $( cat <<$output | wc --bytes )”\n10\n11   \
    \   cat <<$output | sed '\n12      1 i HTTP/1.1 200 OK\n13      1 i Server: Your\
    \ GET SERVER\n14      1 i Connection: close\n15      1 i \n```\n\nheader and the\
    \ corresponding HTML, a browser in the local network thinks it is dealing with\
    \ a real web server.\n\nHowever, it can also happen that the user manually requests\
    \ a page in the browser that does not exist. This leads to the infamous 404 error,\
    \ which you have probably seen on the web before [5]. The custom web server can\
    \ also come up with this feature. If the cat command in the first line of the\
    \ return_file function (line 20) throws an error, the else branch starting at\
    \ line 28 is executed. The web browser then displays a message that the requested\
    \ page does not exist.\n\n# POST Requests\n\nUnlike GET requests, where the web\
    \ browser wants to download files, there are also POST requests that allow the\
    \ browser to send data to the web server. You can think of this as like posting\
    \ something on social media. You type some text, add images, or even add videos\
    \ in a box provided for that purpose, and then press Post. The content is then\
    \ uploaded to the server and subsequently displayed under your profile. Our simple\
    \ server only uploads files from a browser and saves them in the uploads/ folder.\n\
    \nAgain, the browser sends a header indicating that it wants to post something.\
    \ You can easily find out what a post request looks like by running the command\
    \ in Listing 6. In the browser, call the web form in the root folder and send\
    \ a file (Figure 2). After a few seconds, interrupt the Netcat command by pressing\
    \ Ctrl + C. The browser displays a File arrived message, and the file is where\
    \ you redirected it. But this is not a displayable JPEG file, because the file\
    \ saved here still contains the header, as shown in Figure 3."
