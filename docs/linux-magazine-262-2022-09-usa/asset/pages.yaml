    # Open Air


    Open RAN brings a new spirit of openness to the radio access networks that form
    the foundation for the mobile revolution.


    By Emil J. Khatib


    **M**obile networks have been a major contributor to the technology and culture
    of the 21st Century. Companies such as Nokia or Ericsson shaped the early generations
    of the mobile revolution, orchestrated by industrial alliances such as GSMA, ETSI,
    or the 3GPP. These international organizations created open standards that enhanced
    competition and helped the growth of the sector. Fast forward to 2022, and the
    main actors have changed, with names such as Samsung, Apple, or Huawei shaping
    the smart-phone market, but open standards have continued to play an important
    role.


    Like many technological developments, the precedents of mobile communications
    go back to World War II. The concept of mobile telephones that could help soldiers
    on the field moved into the civilian sphere after the war, and the 1960s, ''70s,
    and ''80s saw the emergence of portable communication systems such as citizens
    band (CB) radio, walkie-talkies and, finally, early cellular communications.


    In the early 1990s, the second generation (2G) of mobile telephone networks made
    an appearance with the CDMA standard (which was mainly used in the Americas, Japan,
    and South Korea) and the GSM standard (which was popular in Europe, Africa, Australia,
    and much of Asia). 2G saw the explosion of mobile phones and effectively transformed
    the way we view telecommunications: It was no longer about communicating between
    places but about connecting individuals.


    Around this time, the Internet also became a commodity, and users who were accustomed
    to being connected wanted to browse the web and send email from their phones.
    Efforts to upgrade 2G soon fell short, and the third generation (3G) began to
    take shape. The 3rd Generation Partnership Project (3GPP) released the UMTS specification
    in 1994, which started its commercialization around the turn of the millennium.
    3G supported mobile broadband, paving the way for smartphones a few years later.


    The relentless appetite for higher bandwidths drove the 3GPP to provide almost
    yearly additions to the standard. UMTS was updated with Releases 99, 2000, 4,
    5, 6, and 7. Although the numbering is odd, from that point on, there was a pretty
    stable numbering scheme. Releases 8 (2008) through 14 (2014) defined LTE and derivatives,
    which became known as 4G. LTE greatly simplified the network architecture, making
    it possible for smaller companies to operate and maintain a 4G network.


    More recently, the fifth generation (5G), defined in 3GPP Releases 15 (2018) to
    17 (2022), has continued to simplify the network. With the introduction of Network
    Function Virtualization (NFV) and Software Defined Radio (SDR) technologies, 5G
    has reduced the cost for fabricating network equipment, opening the market to
    smaller competitors.


    Today the term "mobile network" usually refers to a 3GPP network, as opposed to
    IEEE WiFi or other types


