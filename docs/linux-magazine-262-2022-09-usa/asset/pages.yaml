    to find the solution in as few rounds as possible – a kind of treasure hunt, if
    you like. As a nod to the extra consonants in Worldie, my program goes by the
    name of Schnitzlie. There are enough photos to choose from on my cell phone, and
    a random generator ensures that the game always selects new pictures, so it never
    gets boring.


    # And . . . Action!


    Figure 2 shows Schnitzlie in action. As a starting image, the computer has selected
    a snapshot depicting yours truly, hiking in the Bavarian Alps. According to the
    clues, the target is **9,457.8** kilometers to the northwest (NW) from the starting
