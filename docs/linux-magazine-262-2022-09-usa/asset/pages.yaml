  md: '*present* container accessed by its localhost endpoint in my browser. Don''t
    be confused about it not showing a presentation – I''ll create the presentation
    next.


    # Slides Basics


    Now it''s time to dirty your hands with *present*''s slides description language.
    The preferred way to craft your slides is using the CommonMark markup language
    [2]. (You can also use legacy syntax [1] to describe your slides, but that''s
    not discussed here.) To start, create a file named *mytest\_s1.md* (Listing 3)
    in the bind-mounted */files* directory.


    Now refresh your *present* endpoint browser page, and the newly created slide
    file link should appear (Figure 2).


    If you click *mytest\_slide* now, you''ll see an ele- gant three-slide presentation
    (the first and last slides are shown in Figures 3 and 4). Congratu- lations, you
    have created a presentation – without the frustration of dragging and dropping
    and the impossible formatting in a slide creation tool. You can move between the
    slides using the left and right arrow keys and also create a PDF using the Ctrl+P
    print dialog.


    The slide description starts with a header block with the presentation topic prefixed
    with *#* and a space. Optionally, you could put other metadata such as a subtitle,
    date, tags, sum- mary, and old URL lines after the *#*. An optional author block
    follows the header


    section, with at least a space in between them. The author block can contain your
    name, title, email, URL, twitter handle, etc. *present* automati- cally renders
    the last slide with the author block (Figure 4). It only puts author info that
    is not an email, URL, or twitter handle on the first slide (Figure 3). You could
    have multiple author blocks, each separated with at least a space be- tween them.
    Any line starting with *//* is treated as a comment.


    The presentation slide sections follow the au- thor blocks. A slide section starts
    with *###* followed by at least one space. Each slide could have a subsection
    too, starting with *####* and followed by at least one space. The content of a
    slide is gov- erned by CommonMark to format text.


    +   Listing 3: mytest.slide

    +   01\# My Test Presentation

    +   02

    +   03 Free Libre Open Source Software Hacker

    +   04 A FLOSS Hacker, FLOSS Universe

    +   05 flosshacker@flossuniverse.com

    +   06 https://\ /

    +   07 @flosshacker

    +   08

    +   09 \#\# TBD


