    # Manjaro 21.3.0 Now Available


    Manjaro is an Arch-based, rolling-release Linux distribution aimed at users who
    want the power and flexibility of Arch, without complications. The latest release,
    version 21.3.0, includes plenty of newness, in the form of the Calamares installer
    (which now supports LUKS partitions), Gnome 42 (which includes Libadwaita), KDE
    Plasma 5.24 (which includes the new Overview), Xfce 4.16 (which now supports fractional
    scaling), and Linux kernel 5.15 LTS.


    The Gnome edition of Manjaro 21.3.0 includes both GTK 4 and Libadwaita, which
    offers improved performance, a modern UI style, and plenty of new user interface
    elements. The Plasma edition makes it possible to more easily move panels around
    and stick them to any edge you like. The Xfce edition received quite a number
    of updates, especially in the area of compositing and GLX.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_9_0.png)


    Since Manjaro is a rolling edition, if you already have the OS installed, an update
    should bring you to the latest release. If you don''t have Manjaro installed,
    you can download the latest ISO from the official Manjaro Download page (https://manjaro.org/download/),
    where you have the choice to download the full or a minimal version of the OS.
    You''ll find downloads for x86_64 and ARM architecture as well as unofficial spins
    for the Budge, Cinnamon, i3, Sway, Mate desktops, and even a Docker image.


    # SpiralLinux: a New Linux Distribution


    Focused on Simplicity


    SpiralLinux (https://spiralinux.github.io/) is Debian-based Linux distribution
    with spins for Cinnamon, Xfce, Gnome, KDE Plasma, Mate, Budge, LXQt, and Builder
    (which uses the IceWM window manager for experienced users to fully configure
    the system to meet their needs). Each of these spins (minus “Builder”) offers
    a simplified Linux experience that uses the official Debian Stable package repositories.


    SpiralLinux includes Flatpak support built-in as well as a GUI front end for managing
    Flatpak packages. The distribution uses the Btrfs filesystem which includes an
    optimal sub-partition with Zstd transparent compression and built-in support for
    automatic Snapper snapshots and even zRAM swap support.


    According to the developer, “Great effort has been expended in polishing the SpiralLinux
    default configuration for all the major desktop environments using the packages
    and mechanisms that Debian itself provides,” said the developer when asked “why
    another Debian-based distro.”


    SpiralLinux is based on Debian 11 (“Bullseye”), is powered by kernel 5.16, and
    ships with apps like Firefox, LibreOffice, Thunderbird, Transmission, Pidgin,
    and the Synaptic Package Manager installed by default.


    For more information about the latest release of SpiralLinux, make sure to visit
    the official release notes (https://github.com/SpiralLinux/SpiralLinux-project/releases).


