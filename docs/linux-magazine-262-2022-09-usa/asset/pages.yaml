    the interface when necessary – a thoroughness unusual in installers (Figure 1).
    Similarly, MX Linux first boots into a Welcome screen that draws attention to
    the major system tools and also offers links to a tour, videos, forums, an FAQ,
    and the user manual, all of which provide useful starting points for exploring
    the desktop environment (Figure 2). For more advanced users, the About tab offers
    a summary of both system hardware partitions, boot mode, and active repositories.


