  md: "# Sample Files\n\nFiles for testing the web server are easily scripted. The\
    \ function in Listing 2 runs through a `for` loop seven times. The routine uses\
    \ a here document (heredoc) to support the entry of HTML code almost 1:1 (third\
    \ line). Heredocs let you refer to the variable set in the `for` statement, which\
    \ then simply contains the sequence number.\n\nHeredocs help to define sections\
    \ of text in many programming languages. Unlike conventional output via `echo`\
    \ or `printf`, line breaks, indents, and some special characters are preserved\
    \ in the text. Bash also supports the use of variables in heredocs.\n\nIn this\
    \ way, you can create as many HTML files as you need with just a few lines of\
    \ code. You could optionally integrate additional dynamic content that you generate\
    \ with a script within the heredoc.\n\nYou'll also need to create some sample\
    \ HTML files for testing your home-grown server. (See the box entitled “Sample\
    \ Files.”)\n\n# GET Requests\n\nResponding to a GET request entails much more\
    \ than just sending the content of a file. HTTP and HTTPS require that additional\
    \ information be sent along with the transmission. If you want to know what a\
    \ response from a genuine web server looks like, type the following command:\n\
    \n```\nwget --spider -S ?\n    \"https://www.zeit.de/index\"\n```\n\nThe `wget`\
    \ utility downloads a web page from the terminal. The `--spider` option tells\
    \ `wget` to behave like a web spider; in other words, it won't download the actual\
    \ content but will check that the content is there and will receive the transmission\
    \ information associated with an HTTP request.\n\nIn the first line, the server\
    \ confirms that it is happy to take the HTTP request – HTTP/1.1 200 OK. Further\
    \ lines in the form of value pairs (such as Connection: keep-alive, Content-Length:300)\
    \ are used to send back additional information or instructions.\n\nIt also appears\
    \ that this service is a well-secured web server, because it does not reveal precisely\
    \ what kind of server program it is. Many servers out themselves at this point\
    \ as server: nginx, for example – not advisable, because such disclosures makes\
    \ things easier for attackers. If you want Netcat to behave like a genuine web\
    \ server, you'll need a way to generate this header information associated with\
    \ HTTP.\n\n# Netcat\n\nNetcat is available on virtually any Linux system and can\
    \ be used for many purposes given a little creativity on the user's part, although\
    \ it admittedly has some limitations.\n\nYou can emulate basic network operations\
    \ using Netcat, but complex interactions are difficult or impossible. You definitely\
    \ don't want to try to compete with Apache or NGNIX just using Netcat.\n\nIf you\
    \ want Netcat to permanently listen on a port, also send different responses,\
    \ and you have to combine it in a loop with a FIFO file. FIFO refers to the \"\
    first in, first out\" principle. This means that the information comes back out\
    \ of the file in the same order in which it was sent in [3]. Listing 3 shows an\
    \ example.\n\nThe FIFO file improves the communication between Netcat and the\
    \ respond function, as shown in Listing 4. Netcat listens on the specified port\
    \ and writes to the FIFO file. On the left side of the pipe, you can see the call\
    \ to the function that reads the browser request. It evaluates the request and\
    \ then sends a matching response, containing an HTML header and HTML data, back\
    \ through the pipe to Netcat. The respond function decides what to return to the\
    \ browser.\n\nThis variant is already a fairly powerful solution. If the length\
    \ of the browser request is 1 (line 3), then it is /, and\n\n# Listing 2: Creating\
    \ Sample Files\n\n```\nfunction create_files () {\nfor x in {1..7}; do\ncat <<--FILE\
    \ > ${HTTP_HOME}/date${x}.html\n    <html><head><meta charset=\"utf-8\">\n   \
    \ <title>Page ${x}</title>\n    </head><body>\n    <p> $(date ) </p>\n    <p>\
    \ Page ${x} </p>\n    </body></html>\n--FILE\ndone\n}\n```\n\n# Listing 3: Netcat\
    \ Response\n\n```\nwhile true; do\nrespond < FIFO_GET | netcat -l ${HTTP_GET_PORT}\
    \ > FIFO_GET\ndone\n```\n\n# Listing 4: FIFO File\n\n```\n01 function respond\
    \ () {\n02 read get_or_post address httpversion\n03 if [ ${#address} -eq 1 ];\
    \ then\n04 list_dir\n05 elif [ ${#address} -gt 1 ]; then\n06 return_file $address\n\
    07 fi\n08 }\n```\n\nNetcat returns a directory listing. If the length is not equal\
    \ to 1, Netcat returns the content of a file from the root directory. To get the\
    \ web server to return a list of the files contained in the root folder, a very\
    \ simple is directory_name is all that is needed. However, the results then need\
    \ to be embedded in suitable HTML code so that the links work and the browser\
    \ can actually use them (Figure 1). The sed [4] stream editor is recommended for\
    \ converting a directory listing to HTML code.\n\nListing 5 shows the functions\
    \ referenced in Listing 4. In the list_dir function, the directory content is\
    \ output with a simple ls command. Sed then converts the results to plain vanilla\
    \ HTML. The files generated by the function from Listing 2, already reside in\
    \ the root directory, already contain HTML code. The server uses the return_file\
    \ function in line 19 of Listing 5 to send a file back to the browser with a matching\
    \ header.\n\nBecause Netcat is continuously available for requests in the loop\
    \ and sends a"
