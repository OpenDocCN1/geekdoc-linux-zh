  md: '# # Building Slide Presentations with present

    ## Presentation as Code


    **The Golang package `present` may be the key to making attractive slide presentations
    with less work and hassle.** BY ANKUR KUMAR


    Creating slide presentations has been a necessary part of technical life for a
    long time, but creating crisp and beautiful slides using the popular traditional
    tools requires a lot of tedious work. I have always been intrigued by the elegant
    presentations in Golang community talks, but there was no clear-cut information
    available on how those beautiful presentations were rendered. In researching,
    I stumbled upon a Golang package named, not surprisingly, `present` [1], which
    renders amazing presentation slides from markup text descriptions. For many years
    now, `present` has been my go-to tool for creating and delivering impressive presentations.


    To create a Docker image from which you can launch `present`, use the following
    command:


    ```

    ```bash

    docker build . -t present

    ```

    ```


    You can also launch the `present` container to serve your slides from a bind-mounted
    directory (e.g., files in your current directory), by executing the command:


    ```

    ```bash

    docker run -d --rm -v $(PWD)/files:/src/files:ro -p 58888:8888 present

    ```

    ```


    Now open your web browser and access `localhost:58888` to ensure everything is
    running to deliver your presentation. Figure 1 shows the


    # ### Getting Started


    There is no separate installation step needed to start using the `present` utility.
    It’s just a statically linked binary that is grab-and-run; there’s no need to
    set up any other runtime dependencies. You do need the Golang compilation toolchain
    already set up on your machine if you want to run the `present` command natively.
    Alternatively, you can run `present` out of the box, provided Docker Engine is
    installed on your machine (which is very common nowadays). I personally took the
    Docker route to use `present` without doing any extra work. You can use the Dockerfile
    (Listing 1) and script (Listing 2) to fetch and run `present` to display your
    slides on your local machine.


    # ### Listing 1: Dockerfile


    ```

    01 FROM golang:alpine

    02

    03 RUN apk add --no-cache git \

    04     && go get golang.org/x/tools/cmd/present

    05

    06 COPY run.sh /usr/local/bin/

    07

    08 ENTRYPOINT ["run.sh"]

    09 CMD ["-notes"]

    ```


    # ### Listing 2: run.sh


    ```

    01 #! /bin/sh

    02

    03 PORT=${PORT_PRESENT:-8888}

    04

    05 exec present -http "0.0.0.0:${PORT}" -content /src/files "$@"

    ```


    ![](img/b40e8bf6cf651f8eebf36f5265123095_78_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_78_1.png)'
