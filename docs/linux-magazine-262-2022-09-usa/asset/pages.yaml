  md: '# Vita emulator

    Vita3K


    Vale''s Steam Deck is an impressive chunk of portable gaming hardware, but it''s
    only the latest in a long list of previous attempts. Sony''s PSP and then Vita
    were two of the best. They had wonderful ergonomics, and the Vita in particular
    featured all the controls you could want - dual analog joysticks, shoulder buttons,
    direction buttons, and a capacitive screen with a touch-sensitive rear. It was
    moderately successful and featured a library with thousands of games before Sony
    discontinued the platform and its associated store in 2019. This left a lot of
    people with large collections of their own games and a diminishing pool of hardware
    on which to play them. This just happens to be the perfect


    primordial developer soup for an emulator to appear.


    Vita3K is that emulator. It''s a project that was started a few years ago, and
    it''s finally becoming capable of running Vita games from start to finish. Its
    brilliant compatibility database currently lists almost 200 games that will work,
    with many more working to some extent, and every release adds more. Alongside
    binaries of the emulator itself, you will need access to the original Vita firmware
    and the original game files. These can be copied from your original Vita. You
    will also need to configure and install a few modules for compatibility from the
    emulator site into the Vita environment, which you can do from the emulator, after
    which you''ll see the emulated Vita launcher with its content manager,


    ![](img/b40e8bf6cf651f8eebf36f5265123095_88_0.png)


    > Even without access to commercial games, the Vita and this emulator can run
    plenty of open source gems.


    settings, and trophy manager. Linux works well with Sony''s DualShock controllers
    when make the perfect device for use with the emulator as they''re closely related
    to the Vita design.


    The emulator will show when a device has been connected and recognized. The emulator
    includes a content manager, settings page, and trophies manager for the trophies
    you might unlock playing the games. The games themselves are installed from the
    archived version you take from an original Vita and will load in a separate window.
    The performance is surprisingly good, and Vita3K is a great way of playing some
    of the Vita classics that were unique to that system.


    **Project Website**

    https://vita3k.org


    # GameStream host

    Sunshine


    One of the very best gaming tools we''ve looked at over the years is called Moonlight.
    This is an open source implementation of NVIDIA''s gamestream technology, called
    GameStream, that streams Windows games to their thin-client SHIELD gaming consoles.
    The Moonlight client removes the need for a SHIELD and can run on almost anything,
    from a Raspberry Pi to a webOS-based LG TV, and it performs magnificently - much
    better than the equivalent Steam streaming solution. With Moonlight on a good
    network, the delay between your gaming PC rendering a frame and your Moonlight
    client displaying it, while also managing your controls and the sound, can be
    less than 15 milliseconds, which is enough to


    make the vast majority of games feel incredibly responsive. What''s even more
    incredible is that recent versions of Moonlight are capable of streaming 4K resolutions
    with high-dynamic range content at 120 frames-per-second if your system and network
    is capable of it. The one huge downside to this was alluded to earlier: You need
    Windows to run the NVIDIA GeForce Experience back end.


    Sunshine changes all that. It''s a GameStream host that will run on Linux and
    stream your game collection to a Moonlight client. It works best with NVIDIA hardware
    and proprietary drivers, including the CUDA components, but it can also work with
    Intel and AMD devices with FFmpeg for video encoding. There is quite a bit of
    setup involved, especially around creating the appropriate user rules, and you
    will need to add your PC to the Moonlight client manually, rather than it being
    automatically detected. The path to each game you


    ![](img/b40e8bf6cf651f8eebf36f5265123095_88_1.png)


    > More than a sadly underrated Mario game, Sunshine is also a GameStream host
    for your Linux games!


    wish to stream needs to be then added to a configuration file. But the end results
    are worth it. The thumbnail will then appear in Moonlight, where you can also
    adjust the streaming settings to match your system''s capabilities. Selecting
    the thumbnail launches the game and streams its output to your Moonlight client,
    and it works brilliantly.


    **Project Website**

    https://github.com/Loki-47-6F-64/sunshine'
