    \ )\n12     upload_path=\"${HTTP_UPLOAD}/$new_name\"\n13     sed '/\\. /filename/d;/Content-Type/\\\
    n;d;\\$'\n          \"${CACHE_DATE}\" > \"${upload_path}\"\n14   done\n15 }\n\
    16\n17 run_post_server &\n```\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_46_0.png)\n\
    \nFigure 2: Using the web form to upload files such as photos or texts to the\
    \ web server.\n\n# Listing 8: Sending a JPEG File\n\n```\n```bash\n#!/bin/bash\n\
    \nheader=\"HTTP/1.1 200 OK\"  \nmyfile=\"http://home/upload/IMG-20220123-WA00022.jpg\"\
    \ncontent_length=$( cat $myfile | wc --bytes  )\ncontent_type=\"Content-Type:\
    \ image/jpeg\"\n\ncat $myfile | sed -r -e \"1i $header\" -e \\\n         \"1 i\
    \ $content_length\" -e \\\n         \"1 i $content_type\" -e \\\n         \"1\
    \ i Connection: close\\n\" | netcat -l 8080\n```\n```\n\nin the uploaded file.\
    \ Sed handles this task in the `while` loop starting in line 9. Sed removes the\
    \ header, boundary statements, the file name, and similar data. To compare this\
