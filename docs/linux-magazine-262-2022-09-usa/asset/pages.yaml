  md: "![](img/b40e8bf6cf651f8eebf36f5265123095_37_0.png)\n\nResort. The resort’s\
    \ web page uses JavaScript to show the new snow in either centimeters or inches,\
    \ but the Lynx text output displays both values and their units.\n\nTo remove\
    \ parts of a string variable, you can use `%%` to extract the first part of the\
    \ string and `%%` to extract the last part of the string (as shown in Listing\
    \ 1).\n\n# # A Bash Web Scraping Project\n\nTo get excited before a family ski\
    \ trip, I wanted to create a morning notification script that would show the new\
    \ morning snow and the base snow.\n\nTo create the notification script (Listing\
    \ 2), I used two passes with the Lynx utility. The first pass scrapes for new\
    \ snow (shown in Figure 4) and then a second pass gets the new base snow (shown\
    \ in Figure 1). The snow results are then passed as a string ($msg) to the `notify-send`\
    \ utility [4], which posts the message to the workstation desktop (Figure 5).\
    \ You can schedule this Bash script to run every morning using either `cron` or\
    \ the `at` utility.\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_37_1.png)\n\n\
    # # Summary\n\nScraping web pages can be tricky, and the pages can change at anytime.\
    \ For this reason, it is always best to check if an API is available before looking\
    \ at web scraping.\n\nPython with the Beautiful Soup library has been my go-to\
    \ approach for web scraping, but it’s nice know that a simple Bash alternative\
    \ is also available.\n\n# # Info\n\n+   1. Lynx: [https://lynx.invisible-island.net/](https://lynx.invisible-island.net/)\n\
    +   2. `curl`: [https://curl.se/](https://curl.se/)\n+   3. html2text: [https://github.com/Alir3z4/html2text/](https://github.com/Alir3z4/html2text/)\n\
    +   4. `notify-send`: [https://delightlylinux.wordpress.com/2020/10/25/bash-show-notifications-from-scripts-using-notify-send/](https://delightlylinux.wordpress.com/2020/10/25/bash-show-notifications-from-scripts-using-notify-send/)\n\
    \n# # Author\n\nYou can investigate more neat projects by Pete Metcalfe and his\
    \ daughters at [https://funprojects.blog.](https://funprojects.blog.)\n\n```\n\
    # Listing 2: Bash Web Scraping Notification Script\n```bash\n01 #!/bin/bash\n\
    02 #\n03 # skitrip.sh – show the Sunshine ski conditions in a notification\n04\
    \ #\n05 theurl=\"https://www.snow-forecast.com/resorts/Sunshine/6day/mid\"\n06\n\
