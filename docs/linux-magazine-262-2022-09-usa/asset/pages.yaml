    If you look closely at the figure, you’re probably wondering what happened to
    the wise men’s arms and legs.


    The idea here is that, if you want to keep something symmetrical, you just do
    the drawing work once and then scan it. Next, you load the scan in Inkscape, trace
    the drawing to create a vector diagram, and copy and paste the resulting object.
    While the kings’ torsos are needed once each, we need six arms and two of each
    of the legs, as you can see from Christa’s notes. If you are not good at drawing,
    don’t worry, there are plenty of free-to-use sketches out there on the web that
    you can download and process using similar steps to the ones we will be following.


    There are two schools of thought on converting a bitmap, such as a PNG file, to
    a vector format (SVG in Inkscape) for laser cutting. One approach is to select
    Path | Trace Bitmap and let the algorithm follow the contours of the original
    drawing. The other is to use the original drawing as a template and do


    the tracing work yourself. Although the automatic trace seems to be the easier
    option, it will probably give you a very complex vector diagram with a huge number
    of nodes. Despite selecting Path | Simplify to reduce the number of nodes, post-processing
    is likely to take longer than the manual approach. The Simplify results are not
    always what you expect and there may be some artifacts. But this is something
    you need to try out for yourself, and the decision will always be driven by the
    results of a trace.


    If you decide to try out a manual trace (Figure 7) yourself, the steps are as
    follows: First select the Draw Bezier curves and straight lines tool in the toolbar
    on the left of the Inkscape window.


    Click on a starting point and drag a line to the next point on the object you
    are tracing. Click again, drag again, and keep repeating until you have traced
    the whole object. When you are done, you will definitely need to select Edit paths
    by nodes and tidy up the curves and lines by clicking on the nodes and dragging
    the handles that Inkscape shows you. Once you have a vector replica of the object,
    you can delete the original hand-drawn object, but make sure you keep a backup
    copy, just in case you delete the wrong object – something that can easily happen.


    After tracing an arm, we selected the object, right-clicked, selected Copy, and
    then clicked on a new location where we


