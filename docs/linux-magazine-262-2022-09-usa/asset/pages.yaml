- pgno: 94
  md: '# # LINUX NEWSSTAND


    **Order online:**

    https://bit.ly/Linux-Newsstand


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_0.png)


    **#261/August 2022**


    **USB Boot**


    Live boot was such an exciting idea 15 years ago – just carry a CD with you and
    boot from anywhere. But old-style boot CDs had some limitations. Today''s USB
    boot tools solve those problems plus offer a feature that no one even thought
    about back then: access to several boot images on a single stick.


    On the DVD: Linux Mint MATE 20.3 and FreeBSD 13.1


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_1.png)


    **#260/July 2022**


    **Privacy**


    If you are really serious about privacy, you''ll need to lean on more than your
    browser''s no tracking button. Those who need anonymity the most depend on the
    Tor network – a global project offering safe surfing even in surveillance states.
    We also look at Portmaster, an application firewall with some useful privacy features.


    On the DVD: Ubuntu 22.04 and Fedora Workstation 36


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_2.png)


    **#259/June 2022**


    **Zero Trust**


    Twenty Years ago, everyone thought a gateway firewall was all you needed to stay
    safe from intruders, but recent history has told a different story. Today, the
    best advice is: Don''t trust anyone. Your internal network could be just as dangerous
    as the Internet.


    On the DVD: Zorin OS 16.1 Core and Super GRUB2 Disk


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_3.png)


    **#258/May 2022**


    **Clean IT**


    Most people know you can save energy by changing to more efficient light bulbs,
    but did you know you can save energy with more efficient software? This month
    we examine the ongoing efforts to bring sustainability to the IT industry.


    On the DVD: Manjaro 21.2 Qonos and DraGoNfly BSD 6.2.1


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_4.png)


    **#257/April 2022**


    **Encryption**


    This month, we survey the state of encryption in Linux. We look beyond the basics
    to explore some of the tools and technologies that underpin the system of secrecy
    – and we show you what you need to know to ensure your privacy is airtight.


    On the DVD: Linux Mint 20.3 Cinnamon Edition and deepin 20.4


    ![](img/b40e8bf6cf651f8eebf36f5265123095_94_5.png)


    **#256/March 2022**


    **Facial Recognition**


    Biometrics got a boost recently with the arrival of Microsoft''s Hello technology.
    Now the open source world is catching up, with an innovative tool appropriately
    called Howdy. Facial authentication might not be ready for the CIA yet, but we''ll
    help you get started with Howdy and explore the possibilities of authenticating
    with a glance.


    On the DVD: antiX 21 and Haiku R1/ Beta 3'
