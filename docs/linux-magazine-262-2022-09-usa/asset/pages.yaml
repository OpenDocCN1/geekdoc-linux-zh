    America! From the selection on the right, the player then clicks on the photo
    of Pinnacles National Park in California (Figure 3). Schnitzlie reveals that the
    target is **168.5** kilometers in a northwest direction from this guess. What’s
    north of the Pinnacles? Probably the San Francisco Bay Area, where I live!


