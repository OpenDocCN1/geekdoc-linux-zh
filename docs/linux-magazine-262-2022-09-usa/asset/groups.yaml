    \n## 选择过剩\n\n从包含数千张图片的照片集中随机挑选十几张照片并不特别困难。更难的是确保游戏一轮中照片的位置彼此不会太近。许多手机照片是在家拍摄的，而在客厅、阳台和厨房之间逐英寸导航的前景并不令人兴奋。\n\
    \n相反，我希望算法能够随机选择图像，同时确保在每一轮中创建新的、令人兴奋的游戏场景，通过始终呈现不同区域的良好混合。图 8 中手机照片应用的地域视图说明了如何根据\
    \ GPS 数据将照片分配给捆绑的热区。然后，算法仅从给定的热区中选择一个图像。\n\nk-means 算法 [3] 在这里大有裨益：k-means 是一种人工智能\
    \ [4] 方法，应用于无监督学习 [5] 中的信息聚类（图 9）。在一个二维或多维空间中，从一组或多或少随机分布的点出发，k-means 确定聚类的中心。在\
    \ Schmitzle 游戏中，这些将是拍摄了许多手机照片的地点，例如在家里或各种度假胜地。然后，算法仅从这些聚类中的每一个随机选择一个图像。这确保了游戏每轮中各个照片拍摄地点之间存在有意义的距离。\n\
    \n从列表 2 第 18 行开始的 `photoSet()` 函数的任务是交付一个包含 6 张新游戏照片的 `Photo` 类型数组切片。第 12 行定义了\
    \ `Photo` 数据结构，其中包含图像文件路径的 `Path`。除此之外，它还保存从 Exif 信息中读取的地理坐标，作为 64 位浮点数表示的经度 `Lng`\
    \ 和纬度 `Lat`。\n\n为此，`photoSet()` 从第 19 行开始连接到之前创建的 SQLite 数据库 `photos.db`，并运行从第\
    \ 23 行开始的 SELECT 查询，以筛选所有之前读取的照片文件及其 GPS 坐标。在从第 36 行开始并处理所有找到的表元组的 for 循环之后，所有记录现在都存在于\
    \ `clusters.Observations` 类型元素的数组中，准备由 GitHub 上的 `kmeans` 包 [6] 处理。\n\n对 `km.Partition()`\
    \ 的调用随后将 GPS 坐标分配到 10 个不同的聚类中。然后，第 60 行丢弃包含少于三个条目的微小聚类。这防止了相同的照片在每场游戏中反复出现，从而不让算法有机会通过从特定聚类中随机选择来提供多样性。算法从剩余的聚类中最多选择六张（`maxClusters`）照片，然后使用\
    \ `rand` 包中的 `shuffle` 函数将它们按随机顺序排列。\n\n由于 GitHub 上的 kmeans 聚类库对照片不熟悉\n\n### 列表\
