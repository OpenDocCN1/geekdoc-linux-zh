    名为最新发行版）而非许多发行版中已司空见惯的抽象图案（图 3）。除此之外，MX Linux 桌面整体上似乎不如大多数发行版精致，缺乏过去十年间其他发行版中普遍采用的设计统一性。例如，工具窗口的大小并不一致，而且图标似乎也不是作为一套设计的。相反，美感似乎远远次于功能性——对于相对较新的发行版来说，这或许并不奇怪。


    对功能的强调体现在设计选择中。借鉴 Ubuntu 旧版 Unity 桌面的设计，默认情况下，面板位于屏幕左侧，最大限度地扩大窗口的屏幕空间。面板内容似乎旨在作为系统工具，尽管可以从菜单（或桌面）将应用拖放到面板上。如有需要，用户可以将其转换为坞（Dock）。换句话说，除了默认位置外，面板并没有什么特别不寻常之处。它就像大多数发行版中看到的那样，因此很容易上手。同样的评价也适用于
    Whisker 菜单（尽管不知为何开发人员觉得有必要给它起个名字）。


    在幕后，MX Linux 是一个相对安全的发行版，许多系统工具仅 root 用户可访问，并且会对潜在操作的可能后果发出显著警告。它依赖于 Debian stable
    和 stable-updates 仓库，使其成为一个可靠但远非前沿的发行版，不过其自研包存储在 **mx.list** 仓库中。事实上，手册专门警告不要尝试安装
    Ubuntu 的实验性个人软件包存档（PPAs）或永久启用其他仓库，并正确指出这样做“可能会导致系统不稳定并需要重新安装”。但也许 MX Linux 最不寻常的方面是其对
    systemd 的中立立场。默认情况下，MX Linux 使用更保守的 SysVinit。然而，systemd 也已安装，并且可以从启动管理器的“高级选项”中激活（图
    4）。安装 systemd 后，可以使用命令 **systemd-sys** 移除 SysVinit。Snapshot 和 Live USB 持久性功能在
    systemd 下无法工作，但 MX Linux 的其他部分应该可以正常工作。


    ## 桌面工具


    对功能的强调在桌面工具阵列表中最为明显。共同来看，它们使 MX Linux 成为最容易通过桌面进行管理而无需在常见情况下求助于命令行的发行版之一。这些工具中的一些版本（如
    Conky 或 Tweak）在许多发行版中都很常见。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_22_2.png)


    **图 5：Bash Config 为几种命令行操作提供图形界面。**


    ![](img/b40e8bf6cf651f8eebf36f5265123095_22_3.png)


    **图 6：Boot Repair 有助于恢复启动管理器。**


    # 发行版巡礼 – MX Linux


    其他工具，如用于管理用户或声音设置的工具，是基本必需品，但许多工具是从 antiX 移植或专门为 MX Linux 开发的。


    为了便于设置，MX Linux 为 NVIDIA 驱动和编解码器安装器提供了图形界面，以及一个 Bash 配置工具，该工具包含用于设置别名、提示符结构和历史记录的标签页，这三项任务通常必须分别在命令行中完成（图
    5）。还有一系列独特的维护工具可用，如 Chroot Rescue Scan、Boot Options 和 Boot Repair（图 6）。然而，在 MX
    Linux 的所有工具中，对外部设备最有用的可能是 Live USB Maker，它具备更新闪存驱动上 Linux 系统内核的功能（图 7），以及 Snapshot，它保存系统备份以便轻松还原（图
    8）。这些工具中的一些或许只在最常见的情况下有用，但无论如何，它们都赋能了那些可能不敢打开命令行的用户。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_23_0.png)


    图 7：Live USB Maker 生成和更新闪存驱动上的磁盘镜像。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_23_1.png)


    图 8：受 Windows 上类似工具的启发，Snapshot 备份基本系统文件以便轻松还原。


    # 正在进行中的工作


    尽管最新发行版是 MX-21.1——大概是 antiX 版本号的延续——但 MX Linux 给我一种正在进行中的作品的感觉。其原始工具似乎早已过时，许多都值得移植到其他发行版，但我希望看到下一步会增加什么。同样，虽然功能是首要任务——这一点显然得到许多用户的认同——但
    MX Linux 存在粗糙的边缘，让我想起 MEPIS 的旧版本——实际上也是 2005 年之前所有发行版的风格。尽管如此，MX Linux 在保留 antiX
    大部分速度的同时，在工具方面进行了大量创新，绝对是一个值得关注的发行版，其受欢迎程度不太可能很快消退。


    Info


