    MQTT publishing in the Console, if needed.


    # Integration


    To make the components available in Home Assistant, you now need to set up MQTT
    integration in the Gui. To do so, all you need is the IP address and port of the
    broker you are using; by default, this is set to 1883. After the setup, the new
    MQTT devices should be displayed (Figure 6). After clicking on the *entities*
    URL, both the switch and the temperature sensor are shown as available Home Assistant
    entities, and you can now use them in the usual way (Figure 7). In combination
    with the relay in the Sonoff module, the familiar automation features of Home
    Assistant can now be used to implement, say, a simple thermostat control.


    # Conclusions


    The Tasmota option associated with Home Assistant''s autodscovery of MQTT integration
    easily makes this DIY solution as convenient as the commercial counterparts described
    in the previous article. Homebrewing turns out to be worthwhile – and great fun,
    too. ■


