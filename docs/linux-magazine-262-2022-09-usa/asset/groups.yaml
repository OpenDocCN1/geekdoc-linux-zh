    ## Gopher 浏览器


    ### Gophie


    尽管许多人认为互联网与世界 Wide Web 是同义词，但两者其实是不同的。互联网主要是一个传输层，负责将计算机相互连接。万维网是一种协议及其相关软件（Web
    服务器和 Web 浏览器），以网页形式提供内容，从而创建了一个巨大互联的、嗯，一切内容的网络。我们知道你知道这一点，但有时提醒自己存在一个超越万维网那些糟糕干扰的互联网是有益的。其中最古老的之一是
    Gopher。Gopher 协议实际上是 HTTP 的同时代物，创建于 1990 年，并共享早期 Web 的许多相同特征。它使用服务器和客户端配置，允许访问一个简单的内容系统，该系统可以链接到各种在线资源，包括
    Telnet 服务、FTP 站点和其他 Gopher 服务器（所有这些统称为 Gopherspace）。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_86_0.png)


    Gopher 的内容页面无法实现 HTML 所允许的丰富多媒体体验，这在当时限制了它，但现在从弹窗广告和跟踪 Cookie 的世界来看，这是一种令人耳目一新。值得注意的是，Gopher
    的世界现在仍然可用。你只需要为你的 Linux 桌面配备一个现代的 Gopher 客户端，这正是 Gophie 的作用。Gophie 是一个围绕 Gopher
    Text 环境的桌面外壳，完全支持原有的特性，包括搜索功能、集成的二进制文件下载器、Telnet 会话和链接的文本文档。它还完全可自定义。虽然主窗口仅包含
    Gopher 输出的原始文本，但你仍然可以更改颜色、样式和背景以适合你的环境。但它最好的特点是使用 Gopher 令人耳目一新。仍然有很多网站存在，而且它们通常比平均网页质量更高，尤其是在没有自动机器人播放视频和声音的猛烈攻击的情况下。


    **项目网站**

    https://gophie.org


    ## 命令行训练


    ### GameShell


    现在比以往任何时候都有更多的人在使用命令行，我们缺乏帮助人们入门的良好方式变得越来越明显。主要问题是，虽然我们会认为终端易于使用，但初学者最初输入命令的尝试可能很可怕。可能会感觉一个拼写错误就会摧毁你的整个环境，甚至更糟的是，摧毁连接到你的网络的每个人的环境。这在一定程度上是真的，但在运行日常普通命令时并不是这样。克服这种恐惧的解决办法是熟悉和经验，但这样我们就陷入了经典的鸡生蛋、蛋生鸡问题。要获得熟悉和经验，你需要使用命令行。然而，GameShell
    是另一个选择。


    GameShell 最初编写是为了帮助大学生熟悉终端。它通过把学习体验变成一个基于文本的冒险游戏来实现这一点，非常类似于《Colossal Cave Adventure》或《Zork》。唯一的区别是，你不再输入传统互动小说的动词和名词组合，而是从真正的
    Bash 命令构建每个输入。`cd` 会改变你的位置。`ls` 会列出你当前位置中的项目，`cat` 会显示你找到的任何描述性文件的内容。背后的魔法是一个技巧。你并没有真正将命令输入到解释器中，而是输入到你真正的终端中，通过游戏创建的真实文件系统进行导航。例外是一个定制的
    `gsh` 命令，它提供目标（“去城堡主塔楼的顶部”）并跟踪你的进度。这是一个非常聪明的概念，肯定能让任何玩家充满信心。当真相揭露你实际上一直在发出真正的命令时，当你将他们的命令带到野外时，它应该正好给你所需的入门指南，以便进一步探索。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_86_1.png)


    > GameShell 唯一的危险在于它没有限制对任何命令的访问，包括 `rm`。


    **项目网站**

    https://github.com/pyher/GameShell


    ## 媒体流媒体


    ### Jellyfin


    我们似乎正在进入类似于媒体流媒体第三个时代的东西，第一和第三个时代专注于自托管内容，第二个时代则由 Netflix、Spotify 和 Apple 等流媒体巨头主导。第一个时代始于
    2000 年代初，当时我们都开始将设备连接在一起，并从我们以前的物理容器中建立庞大的数字媒体收藏。这就是 DLNA 等协议变得流行的时候，也是你可以购买一个机顶盒将你的离线屏幕变成现在所谓的“智能电视”的时候。即使是朴素的
    PlayStation 2，通过网络附件和一个名为 QCast Media Player 的光盘，也可以从你 2003 年的 Mandrake Linux
    机器上流媒体播放 DivX 文件。当然，这一切都被宽带和廉价且充足的订阅服务所取代，这些服务已经主导了十多年。


    但流媒体服务变得更加昂贵，更重要的是，日益碎片化。你现在又很难以所需的格式访问你想要的媒体。这正是 Jellyfin 发挥作用的地方。Jellyfin 是
    Plex 的开源等价物，你运行自己的服务器并服务自己的内容。一个或多个前端客户端随后可以访问服务器并流媒体播放你想观看或听的内容。有适用于 Android
    和 Apple 手机和平板电脑的客户端，以及适用于智能电视的客户端应用，包括针对 LG webOS 的非官方构建。如果其他方法都失败，服务器中有一个出色的
    Web 前端几乎使任何客户端应用变得多余。其中任何一个都会提供一个美观的接口，通过媒体、音乐和节目类别提供快速、响应的访问，并列出电影海报、专辑封面或盒装集缩略图。所有这些都可以与存储各种类型内容的多个目录一起配置，这些内容存储在本地或远程。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_87_0.png)


    如有需要，Jellyfin 可以通过实时转码内容来限制其使用的带宽以及视频和音频功能。


    使用推荐的 Docker 方法安装服务器本身很容易，这也具有将服务器与系统的其他部分隔离的优势。但原生安装同样简单。它特别适合运行在树莓派上，树莓派甚至可以配置为提供硬件转码加速，任何具有适当驱动器的通用系统或
    GPU 也可以。然而，大多数时候，并不需要将你的媒体实时从一种格式转码为另一种格式。绝大多数前端都能够原生播放大多数现代 H.264 或 H.265 编码的内容，我们成功地以极低的
    CPU 开销从树莓派向智能电视的 Web 浏览器流媒体播放 4K HDR 录制内容。这是 Jellyfin 与第一代家庭流媒体解决方案不同的地方，因为我们现在可访问的硬件功能远胜从前，并且体验主要是无缝的。使用
    Jellyfin 也是在家中聚合内容的好方法，特别是如果你仍然拥有实体媒体收藏，它通常仍然是以最高质量流媒体播放那些媒体的唯一方法。即使服务支持带有 4K
    和 HDR 内容的 UHD，这些流媒体本身通常也压缩得过于严重。Jellyfin 允许你在网络及更远的地方原生流媒体播放文件，并与我们 21 世纪的媒体消费习惯无缝契合。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_87_1.png)


    就像其他任何流媒体服务一样，Jellyfin 会自动填充检测到的任何内容的海报和缩略图，以及背景信息。


    **项目网站**

    https://jellyfin.org

