    # ### Core Network


    In 5G, the main core network functions are:


    +   • User Plane Function (UPF): contains all the functions that are directly
    related with connecting the terminal with the Internet. Among these functions
    are routing and forwarding, Network Address Translation (NAT), packet filtering,
    Deep Packet Inspection (for lawful communication interception); yes, this function
    is defined in the standard [1] and, of course, billing. These functions compose
    the user plane. All the other functions of a 5G network are called control plane
    functions and are needed to support the correct operation of the user plane.


    +   • Access and Mobility Management Function (AMF): performs the roaming functionality,
    that is, the required operations for reassigning serving gNodeBs to the terminal
    and doing the handover such that the user plane can always provide connectivity
    to the terminal.


    +   • Authentication Server Function (AUSF): contains the user authentication
    features for other core functions.


    +   • Session Management Function (SMF): keeps track of the connections in the
    user plane and ensures their correct operation according to user policies for
    the specific terminal.


    +   • Network Slice Selection Function (NSSF): supports the network slicing [2]
    functionality, which divides resources of the network among several slices or
    sub-networks. Each slice can support different configurations, services, etc.,
    virtually, while sharing bare metal resources with other slices.


    +   • Policy Control Function (PCF): contains the rules that regulate other control
    plane functions (such as the resource assignment to different slices) and the
    connections in the user plane (e.g., different quality of service (QoS) parameters).


    +   • Unified Data Management (UDM): Acts as a centralized database containing
    the user data, such as session status and authentication keys. It is used by other
    functions such as AUSF and SMF.


    +   • Application Function (AF): Provides services to the end user. The AF is
    the equivalent of a remote service over the Internet but with an increased integration
    into the mobile network (e.g., for using the user profile or faster user plane
    connections).


    +   • Network Repository Function (NRF): acts as a centralized repository for
    the software packages that implement all the core network functions.


    +   • Network Exposure Function (NEF): acts as an interface for developing new
    services in the 5G Core – contains SDKs, APIs for third-party AFs, and other elements.


    All these network functions are implemented by software packages running over
    a powerful computer (which normally runs some enterprise-grade Linux distribution
