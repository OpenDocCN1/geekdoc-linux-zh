    custom labels or writing statuses (Figure 12), as well as configure revision control
    or the theme of the full-screen editor.


    As far as Manuskript''s editor is concerned, it accepts and saves everything you
    write as plain text or as HTML, Markdown, or pretty much any other markup language
    (but please note that, at time of writing, the only format for which syntax highlighting
    is supported is *Markdown*). However, Manuskript can import existing texts in
    many formats, including but not limited to OpenDocument, .docx, ePub, and LaTeX.


    On the output side, you can save or, as Manuskript confusingly calls it, ''compile''
    your finished work in all the formats supported by the Pandoc converter [6]. For
    both importing and exporting text, this is a mandatory prerequisite to make the
    most out of Manuskript.


