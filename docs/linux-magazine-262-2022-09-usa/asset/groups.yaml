    commands using invocations. Any line starting with a dot character is an invocation.
    These commands include adding images, setting background, showing/editing/running
    code, creating a hyperlink, injecting video, including figure captions, and more.
    As an example, use the code in Listing 5 to once again update your mytest.slide
    file content, put the necessary images and sources into your presentation directory,
    and refresh the browser page rendering the presentation. Figure 7 shows a slide
    rendered using various invocations.


    The .image invocation optionally takes height and width arguments. If any of these
    arguments are specified as an underscore, then scaling preserves the aspect ratio
    of the image. The .background invocation doesn''t take any argument except the
    image. If your image is not big enough, then the background command will fill
    your slide with a repeated pattern of the mentioned image.


    Both .code and .play invocations can strip the unnecessary code from the respective
    source and only display the necessary portion of the code. The -edit command enables
    you make modifications in the displayed code during your presentation. The .play
    command displays code with a Run button to run the Go program from the browser.


    Now you have enough knowledge to render rich presentations using the present description
    language. You can explore the full details of the present description language
    in the package documentation [1]. For more example slides and scripts, check out
    my GitHub repository [3].


    # ### Conclusion


    The present package is a great addition to your day-to-day toolkit for rendering
    sophisticated-looking presentations with minimal effort. This utility is a natural
    fit for modern As-a-Code and GitOps workflows for automatically generating presentations
    without any extra effort. In the age of IAC and containers, creating stunning
    presentations couldn''t be simpler or more automated than this. ▪▪▪


