    \ which sets whether an older version should be updated.\n\n### A Nice App\n\n\
    Homebrew is a comprehensive package manager. Despite the fact that it is only\
    \ 13 years old, in many ways it is as far-reaching as the much older apt-get or\
    \ Yum. It even includes features that could be useful in other package managers.\
    \ However, access to Homebrew’s advanced features is partially blocked by unnecessary\
    \ jargon. As well, while its formulae must number in the thousands, they are nowhere\
    \ near, for instance, Debian’s 60,000 packages. It is only in the Ruby on Rails\
    \ community that Homebrew is likely to dominate. For the rest of us, these notes\
    \ should be enough to use Homebrew when a developer decides to use it, with a\
    \ minimum of fuss and only a slight loss of convenience.\n\n### Info\n\n-   [1]\
    \ Homebrew: [https://brew.sh/](https://brew.sh/)\n-   [2] Install Homebrew: [https://docs.brew.sh/Installation](https://docs.brew.sh/Installation)\n\
    -   [3] How to Install and Use Homebrew on Linux: [https://www.digitalocean.com/community/tutorials/how-to-install-and-use-homebrew-on-linux](https://www.digitalocean.com/community/tutorials/how-to-install-and-use-homebrew-on-linux)\n\
    -   [4] Common issues: [https://docs.brew.sh/Common-Issues](https://docs.brew.sh/Common-Issues)\n\
    -   [5] Jargon and formulae: [https://docs.brew.sh/Formula-Cookbook#homebrew-terminology](https://docs.brew.sh/Formula-Cookbook#homebrew-terminology)\n\
    -   [6] Man page: [https://docs.brew.sh/Manpage](https://docs.brew.sh/Manpage)\n\
    -   [7] Shell completion: [https://docs.brew.sh/Shell-Completion](https://docs.brew.sh/Shell-Completion)\n"
  mdcn: "\n## 像专家一样思考\n\n**《Linux Shell 手册 2022 年版》**\n\n这一新版内容充实，涵盖了用于配置和故障排除系统的最重要实用程序。\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_38_0.png)\n\n以下是书中部分内容的预览：\n\n-   定制\
