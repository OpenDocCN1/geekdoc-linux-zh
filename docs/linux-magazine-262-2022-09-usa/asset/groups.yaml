    最近，在 3GPP 版本 15（2018）到 17（2022）中定义的第五代（5G）继续简化网络。随着网络功能虚拟化（NFV）和软件定义无线电（SDR）技术的引入，5G
    降低了制造网络设备的成本，为较小的竞争者打开了市场。


    如今，"移动网络"一词通常指的是 3GPP 网络，以区别于 IEEE WiFi 或其他类型


