    # # openSUSE Leap 15.4 and MX Linux 21.1

    Two Terrific Distros on a Double-Sided DVD!


    ![](img/b40e8bf6cf651f8eebf36f5265123095_5_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_5_1.png)


    # ## openSUSE Leap 15.4

    64-bit


    # ## MX Linux 21.1

    64-bit


    Leap 15.4 is the latest stable release of openSUSE, the popular and well-established
    community-based distribution. Leap 15.5 is not scheduled to replace it until June
    2023.


    Because the 15.4 release is built upon a mature platform, most of its features
    are updates, and often behind the scenes. Several changes are enhancements and
    improvements to sudo and visudo, and backports and bug fixes to systemd. In addition,
    the release has major updates to AppArmor, as well as to productivity tools such
    as Firefox and LibreOffice.


    Perhaps the most noticeable change is the introduction of DNF, the package manager
    which has largely replaced Yum in other RPM distros such as Fedora. While Yum
    remains in openSUSE, the 15.4 release can be configured to use DNF. In addition,
    the 15.4 release also introduces Microdnf, a subset of DNF that can be used to
    speed up package installation when the whole of DNF is not required.


    Like all openSUSE releases, Leap 15.4 is a general-purpose release, suitable for
    all levels of users.


    What do you get when the lightweight antiX distribution collaborates with the
    once-prominent MEPIS community? Answer: A Debian derivative that has been first
    in page hits on DistroWatch for three years and shows few signs of slipping.


    Install MX Linux, and the reasons for its popularity become obvious immediately.
    The antiX core makes for a speedy system, and many will approve of MX Linux’s
    minimal reliance on systemd. Newcomers can appreciate the clear and detailed documentation,
    especially in the installer, and the orienting Welcome screen and tour of the
    desktop. For more experienced users, the desktop contains a series of tools rarely
    if ever matched in other distributions. These original tools include graphic interfaces
    for editing Bash, the boot manager, repositories, the firewall, and advanced backup
    techniques. Less spectacularly but equally usefully, MX Linux also includes a
    USB formatter, a Live USB creator, and a Samba configurator – as well as many
    other tools for tasks that are done from the command line in other distributions.
    For more information, see this issue’s Distro Walk.


    Defective discs will be replaced.

    Please send an email to subs@linux-magazine.com.


    Although this Linux Magazine disc has been tested and is to the best of our knowledge
    free of malicious software and defects, Linux Magazine cannot be held responsible
    and is not liable for any disruption, loss, or damage to data and computer systems
    related to the use of this disc.'
