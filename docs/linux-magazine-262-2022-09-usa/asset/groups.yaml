    training and self-study. Upon passing the Web Development Essentials exam, you
    receive a certificate to prove your skills.


    LPI Learning Materials are available at [learning.lpi.org](http://learning.lpi.org).
    Find out more about the program and the exam at [lpi.org/wde](http://lpi.org/wde)


