    ## The Conclusion? Try Manuskript, of Course!


    As I wrote at the beginning of this tutorial, Manuskript is still under extensive
    development, and it shows. The version I tested (0.13.1), for example, has no
    support for printing directly from within Manuskript. You must export your story
    (or as they say, compile it) to some other format, open the resulting file with
    some other program, and print from there. I also noticed that if you select a
    chapter in the outline, and then click on Open in a new tab, nothing happens.
    Feature-wise, however, I would really like it if the editor worked in WYSIWYG
    mode at least with Markdown sources, or if it could show a live HTML preview of
    the same sources. Outside the editor, it would be really nice to be able to at
    least print out the outline.


    Here comes the interesting part, why it is important to know these details: Among
    all the options that you may select or deselect after clicking on Edit | Settings,
    maybe the most important is the one called Save to one single file. If you go
    with that option, all the files and folders described above will always and only
    be saved inside one compressed archive, in ZIP format but with the .msk extension.


    If you don''t select that option, Manuskript will create a folder named after
    the project, in whichever directory you want, and keep there all those files and
    folders, without any compression. Now, your taste may vary, of course, but I strongly
    recommend using this option, for the following reason, which is a paraphrase from
    the Manuskript documentation: If you do not save as a single file, “Everything
    that is useful *remains accessible in plain text.*” And this is important, because
    everybody knows how to handle plain text — *including software!*


    Choosing this option makes it much easier to manage and process whatever you do
    with Manuskript with any other software, for whatever purpose. A folder full of
    plain text files and nothing else, for example, can be managed by revision control
    systems or be backed up with tools such as rsync, much more efficiently than one
    big, opaque compressed archive. Folders of plain text files are also fully indexable
    by programs such as Recoll [7] and easy to search, modify, or create with standard
    shell commands such as *find* and simple shell scripts.


    It would also be very useful, I think, if the editor could automatically recognize
    certain strings, for example, the names of characters or places, and transform
    them into clickable links that open the corresponding entries of the Manuskript
    database. I wouldn''t be surprised to discover that this feature is already planned.


    Even with these limits, however, I think Manuskript already has great potential
    as a writer''s assistant and invite everyone who needs to write something big
    to give it a serious try. One big reason to say this is the fact that, being based
    on plain text files that are easy to process, Manuskript is easy to extend or
    integrate with other tools. Personally, my first pet project with Manuskript will
    be to figure out how to create a complete Manuskript project with a shell script,
    starting from existing collections of Markdown drafts and notes.


