    \  - Golang 包 present 可能是以更少的工作和麻烦制作吸引人幻灯片演示的关键。\n- **FOSSPicks** 84\n  - Graham\
    \ Morrison\n  - 本月 Graham 查看了 Lorian、FreeCAD 0.20、CLAP Gophie、GameShell、Jellyfin、Vita3K\
    \ 等等！\n- **Tutorial – Manuscript** 90\n  - Marco Fiorenti\n  - Manuscript 编辑器是你快速启动下一个写作项目所需的一切。\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_76_1.png)\n\n## MADDOG'S DOGHOUSE\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_77_0.png)\n\nJon “maddog” Hall 是一名作家、教育家、计算机科学家和自由软件先驱，自\
    \ 1994 年第一次见到 Linus Torvalds 并促成将 Linux 移植到 64 位系统以来，一直热情支持 Linux。他担任 Linux International®\
    \ 的主席。\n\nMaddog 将国际象棋历史作为隐喻，以发展桌面 Linux 用户群。\n\n**作者 JON “MADDOG” HALL**\n\n\
    ## 增长 Linux 桌面\n\n关于国际象棋及其发明有一个故事。在发明之后，该国统治者非常高兴，他提供了发明者一份奖励以感谢他们的努力。发明者请求在第一个方格放一粒米，第二个方格放两粒米，第三个方格放四粒米，以此类推。统治者随口说道：“照做吧。”\
    \ 问题是，整个王国的米都不够。\n\n今天，我们可能会将其视为“2 的 64 次方”，一个如此之大以至于几乎难以想象的数字。即使 2 的 32 次方也超过四十亿，如果你从一个大于\
    \ 2 的数字开始，它会变得非常大且非常快。当我要求 Linus Torvalds 将 Linux 从 32 位 Intel 平台移植到 64 位 DEC\
    \ Alpha 时，我正是想到了这个概念。\n\n今天，我想将这个概念应用到另一个主题上，即桌面 Linux，这是 Linux 没有达到应有渗透率的少数领域之一。很少有人会说\
    \ Linux 没有渗透高性能计算市场、服务器市场、嵌入式系统领域和手机领域（作为 Android），但我们一直在桌面空间受阻，以至于“桌面 Linux 之年”至少在过去二十年中一直是一个老生常谈的笑话。\n\
    \n在 Linux 早期，有一些合理的桌面问题。Linux 被指出安装困难，而 Microsoft Windows 是“容易”的。人们忽略了一个事实，即人们通常购买的所有笔记本电脑和台式机都已经预装了某种版本的\
    \ Microsoft Windows，因为这就是分销商和零售商销售的方式。\n\n很少有用户安装 Microsoft Windows，他们只是从系统中已创建的备份镜像重新安装它。定期，人们会安装新设备，但这些设备会带有由设备制造商为各种版本的\
    \ Microsoft Windows 创建的二进制设备驱动程序。\n\n如今，安装主流 Linux 发行版的问题很少。随着 GPU 制造商最近宣布重组其驱动程序以包含更多开源代码，并将该开源代码与内核集成，这些问题可能会更少。\n\
    \n其他抱怨是缺乏应用程序，这随着时间的推移通过移植更多应用程序以及使用虚拟化、模拟和仿真得到解决。除此之外，这是一个 22 困境问题：如果有更多的人在桌面使用\
    \ Linux，更多的应用程序供应商将支持 Linux。\n\n缺乏游戏是另一个著名问题，随着更多游戏的移植、Steam 为游戏创建 Linux 平台以及游戏控制台变得越来越便宜并成为许多游戏玩家使用的平台，该问题已经失去势头。此外，具有更大的行业存在也会增加游戏的原生移植。\n\
    \nLinux 没有更多桌面存在感的真实问题之一是简单的营销和销售。FOSS 公司可以产生的广告数量、产品放置和其他营销活动与 Microsoft 可以进行的营销相比微不足道。\n\
    \n当我在数字设备公司（DEC）工作时，软件行业有一条经验法则说，软件零售价格的 36% 用于销售和市场。换句话说，人们支付的钱中超过三分之一与工程甚至制造分发介质无关。如今，随着软件要么预装要么下载以进行安装，投入的销售和市场可能占成本的\
    \ 50% 以上，并且（如在捆绑软件的情况下）第三方软件（读者称之为“垃圾软件”）的销售和市场实际上可能为原始设备制造商（OEM）带来收入。\n\nFOSS\
    \ 软件很难在桌面上与该营销模式竞争。\n\n然而，FOSS 可以使用国际象棋盘模型进行营销。现有的 Linux 用户中的每一个都可以花一些时间与两名 Windows\
    \ 用户一起，帮助他们在其桌面上安装 Linux。帮助他们找到关于 Linux 的入门书籍，帮助他们找到所需的应用程序，帮助他们找到在线帮助小组并真正让他们入门，下次我们就会有三倍的\
    \ Linux 桌面用户数量。\n\n如果这些 Windows 用户是教师、市议会成员、政府官员、商务人士等，那就更好了。那么明年，其中每一个都会再找到两名\
    \ Windows 用户。这听起来可能太少且太晚，但我们是从数百万开始的。大约有二十亿桌面用户。估计其中百分之三是 Linux 用户（我使用了非常保守的数字），即\
    \ 6000 万 Linux 桌面用户。\n\n我认为现在是下棋的时候了。\n\n"
