    ## Mapping out a novel with Manuskrript and the snowflake method

    ### Plan Your Epic

    ### The Manuskrript editor is all you need to jump start your next writing project.


    BY MARCO FIORETTI


    Have you ever wanted to write a novel, an essay, or anything more complex than
    a school report? In this tutorial, I explain a technique for organizing your writing
    project efficiently: the snowflake method. I’ll also introduce you to Manuskrript
    [1], a multi-platform, open source tool you can use for implementing the snowflake
    method for your own writing work, made to order for it. The goal of Manuskrript
    is to help writers “create their first draft and then further refine and edit
    their masterpiece.”


    The snowflake method, which was created by Randy Ingermanson, sits in the middle
    between adhering to a complete, traditional outline and “freewriting,” or deliberately
    writing without any plan, which can facilitate discovery but is also sometimes
    very unproductive.


    Details and tips about the snowflake method are available online [2] [3], but
    the concept is


    ![](img/b40e8bf6cf651f8eebf36f5265123095_89_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_89_1.png)


    extremely simple: Start with a really basic story summary and add little elements
    to it in a circular, incremental way, just like particles of ice attach to each
    other to form complex snowflakes. In other words, start by writing down the basic
    idea of the book, then the main character or characters, and then the setting
    - using just one sentence for each entry.


    Then you go back to the description and transform it into three very short paragraphs
    that outline the beginning, middle, and end of the story. Next you write equally
    short descriptions of each main character, or add minor ones, then expand the
    description of the setting in the same way, adding details to every description
    until you have all you need to actually write your story.


    ### Installation


    As of May 2022, Manuskrript is still under extensive development, and its website
    officially recommends that users “create frequent backups to minimize data loss
    due to software bugs, power outages, or hardware failure.”


    Installation is easy. On Ubuntu and Debian-based systems, you can download the
    binary package in .deb format, then install it from your file manager or, in the
    worst case, from a shell prompt, with the following commands:


    ```bash

    sudo apt update

    sudo dpkg -i manuskript-0.13.1-1.deb

    ```


    Packages in .rpm, Flatpak, and Snap formats are also available, as well as installers
    for non-Linux systems.


    ### Main Features and Workflow


    Unless you tell Manuskrript to always reopen the last project you worked on, the
    first thing you see when you start it is the pop-up window shown in Figure 1,
    from which you can choose among several templates for both fiction and nonfiction
    works. After that, you are expected to configure the structure of the book and
    optionally the target word count for every section, as shown in Figure 2. Of course,
    you may add or remove sections as you wish later on.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_0.png)


    Figure 3: Entering the data a library would need to catalog your work.


    The left toolbar in Figures 3 to 8 shows why and how Manuskrript is a perfect
    tool for applying the snowflake method: Each of the top six buttons in that toolbar
    opens a panel that either corresponds to some side of that workflow or completes
    it. From top to bottom, the buttons are General (information and metadata), Summary,
    Characters, Plots (and subplots), World (i.e., the settings and outline), Outline,
    and Editor.


    By entering and incrementally refining all the data that those panels support,
    you can organize, plan, and above all, document for yourself, before writing,
    everything from plot twists to the appearance, motivation, and background history
    of each character, and the whole society she lives in. Even after you have started
    writing, you may expand or update as you wish in any moment any part of this “database”
    that Manuskrript creates for each of your writing projects.


    ### A Practical Example


    For an example of Manuskrript at work, I will pre-tend to be J.R.R. Tolkien, rewriting
    *The Lord of the Rings* (LoTR) with Manuskrript. I will show you how to create
    and organize a complex story by entering the relevant data or text snippets from
    LoTR into Manuskrript. I will take the information from Wikipedia, the LoTR Fandom
    wiki [4], and when I just need some filler, from LoTR-themed random text by LoRem
    Ipsum [5].


    The *General* button (the topmost button) in Manuskrript’s left toolbar is for
    the basic, self-describing metadata shown in Figure 3. Another thing to notice
    in Figure 3 is the toolbar on the right. From there, you can open Manuskrript’s
    search function of Manuskrript, hide or show the left (*Navigation*) toolbar,
    and depending on which panel you are in, activate other auxiliary functions.


    The *Summary* panel (Figure 4) matches exactly the very first step of the snowflake
    method: Write what your story is about, first with one sentence, and then gradually
    expand it. Then Manuskrript can quickly show you that summary whenever you need
    it while you write.


    The *Characters* panel, which is only partially visible in Figure 5, likely has
    all the sections you may ever need and then some: You can order your characters
    by importance; classify them with the colored, customizable labels visible in
    the top right corner; and generally archive in a well-ordered manner everything
    that makes them “real”, from their personality to their back-ground.


    The *Plots* panel (Figure 6) may be the most im-portant one, at least for complex
    novels. It al-lows the definition of many overlapping story-lines, each with its
    own description, intended conclusion, involved characters, and resolution steps.
    Also note how, when this panel is open, the right toolbar includes a button to
    open the *Book Summary*. The *Book Summary* allows you to see your summary and
    plot lines side by side, and then verify that they still match each other.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_1.png)


    Figure 4: The first step of the snowflake method: Describe your story, in one
    sentence!


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_2.png)


    Figure 5: The *Characters* panel lets you build full profiles of all the characters
    of a story.

