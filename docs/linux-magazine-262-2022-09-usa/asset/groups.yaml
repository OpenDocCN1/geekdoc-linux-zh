    ## 评测


    ### 开源社交媒体工具


    探索去中心化的聊天与微型博客平台


    ### 自由连接


    Diaspora、Friendica 和 Mastodon 是免费且去中心化的微型博客平台，能让你掌握自己的数据。*作者：Erik Barwaldt*


    社交媒体平台在企业环境和个人用户中都已确立为重要的沟通手段。然而，大多数用户都意识到，数据主权是社交媒体领域的一个重大问题：几乎所有主要平台都会收集和聚合用户数据以用于广告目的。此外，政府机构有时也会利用这些信息。例如，在美国，提供商在法律上有义务在收到国家安全信函后，向
    FBI 等调查机构提交客户数据。许多用户还担心因攻击导致数据泄露，而中心化服务由于数据集中在相对少量的服务器上，面临更高的攻击风险。


    与大规模专有社交媒体平台相关的问题促使一些公司和家庭用户更加关注基于开源项目的短消息服务。这些开源解决方案没有数据挖掘行为，且其去中心化的性质使其更容易规避与互联网巨头相关的安全问题。本文探讨了社交媒体领域的一些领先的开源替代方案。


    本文描述的三种工具均支持 ActivityPub，这是一种支持跨平台社交网络的免费协议 [1]。如果两个社交媒体平台都支持 ActivityPub 协议，它们就可以交换消息。


    ### Diaspora


    由 Diaspora 基金会支持的 Diaspora 项目 [2] 是一个去中心化网络，其服务器（pods）构成了一个全球分布的系统。Diaspora 的功能集与行业巨头
    Twitter 和 Facebook 类似。用户可以以较高的匿名度进行操作，通常不会透露其真实身份。此外，用户保留对其数据的所有权利，这排除了个性化跟踪。想要支持
    ActivityPub 协议的技术娴熟用户可以安装专用的 Diaspora pods，这样他们的数据将在本地安全保存。


    要创建一个 Diaspora 个人资料，请在项目网站右上角点击 *加入！* 按钮，然后使用随后出现的绿色按钮进行注册。系统会显示少量建议加入的服务器。如果你想查看包括各种统计数据片段在内的所有
    pods 完整列表，请点击右下角的列表图标，这将显示可用性信息、位置以及用户数量（图 1）。


    要登录其中一个服务器，只需点击其 URL 即可。你只能在 *登录* 表格列中显示为“是”的 pods 上创建账户。选择服务器后，在初始页面的右上角按下 *创建账户*
    按钮。你只需要一个有效的电子邮件地址、一个用户名和一个密码。你还可以上传个人资料照片并指定你的兴趣领域。最后，*太棒了！带我去 Diaspora* 按钮会将你带到消息区域（图
    2）。


    到达那里后，你将在右侧看到消息流，首次访问时会显示各种说明。在第一个框中，你可以直接输入消息；在下方的 *公共* 按钮中选择一个接收者。左侧是用于各种设置的选项栏。在顶部的活动栏中，你可以点击选择各种活动，并使用下拉菜单定义你的用户设置。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_0.png)

    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_1.png)

    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_2.png)


    **图 1：Diaspora 在其网站上列出了所有可用的服务器。**


    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_3.png)

    **图 2：Diaspora 消息窗口提供了可用选项的便捷概览。**


    点击右上角的用户名，然后选择个人资料。


    许多操作都会向你的存档地址发送电子邮件。NSFW（不适合工作场合观看）选项允许你标记那些在工作时不希望显示的内容。相应地，这些消息不会出现在常规消息流中。此选项默认处于关闭状态，因此你需要手动启用它。


    联系人功能允许你将其他用户分组，例如家人、朋友、同事和熟人。要将一个或多个联系人组织到不同的组中，请单击目标组。你的联系人随后会以表格形式显示在窗口的右侧。


    Diaspora 允许你设置自己的服务器，该服务器始终集成到 Diaspora 网络中。要在不牺牲功能的情况下创建基于 Diaspora 的封闭式通信网络，你需要建立自己的群组。运行自己的
    pod 涉及一些复杂的安装步骤。Diaspora 开发者提供了针对多个 Linux 发行版的说明，但略显过时。


    ### Friendica


    自 2010 年以来持续维护和开发的 Friendica [3]，是最著名的免费微型博客和聊天服务之一。同样具有去中心化特性，Friendica 不需要中央服务器。你可以与其他
    Friendica 服务器上的用户连接，或将来自 Twitter、Diaspora、pump.io 和 StatusNet 的联系人整合到你的消息线程中。Friendica
    还允许你共享和分发图像。该软件是模块化的，可以使用插件进行扩展。此外，你可以自行设置 Friendica 服务器，甚至使其公开访问。


    在项目网站上，点击右上角的公共服务器后，你会发现一个按语言排序的公开可访问 Friendica 服务器列表。选择一个服务器，然后通过点击给出的 URL 连接到它。各个服务器的初始页面看起来几乎相同。注册时，Friendica
    期望你输入你的姓名或化名以及一个匹配的电子邮件地址。如果你已经在另一个 Friendica 服务器上拥有个人资料，也可以在此处使用。你只需在注册对话框中将其迁移到新服务器即可。


    点击注册按钮后，你会在指定的电子邮件账户上收到一条包含新生成密码的消息。使用此密码和你的用户名，你现在可以登录服务器，随后将被带到一个初始页面。在左侧，各种设置和管理选项被分组在一起，消息流显示在中间。顶部有多个按钮用于通知和访问最重要的功能（图
    3）。


    要管理你自己的个人资料，请点击右上角的个人资料名称。在上下文菜单中，使用 *编辑个人资料* 来修改基本设置。


    Friendica 提供了详细的账户管理选项，你可以点击初始页面上的用户名或头像来访问。在 *账户设置* 对话框（图 4）中，你可以定义各种安全和隐私选项，或使用你需要单独创建的
    CSV 文件导入联系人。使用 *过期设置* 选项来定义帖子在 Friendica 删除之前保持可见的时间。


    Friendica 将账户分为不同类型，主要区别在于它们如何处理联系人请求。你可以手动接受好友或粉丝的请求，或者让系统自动将其分类到不同的类别中。然而，对于讨论论坛的账户，此功能不起作用。你也可以同时使用多个账户。*设置
    | 管理账户* 菜单让你注册额外账户并将其与现有账户连接。如果你在一个大型组织中使用大量账户，你可能希望添加具有管理权限的管理员和授权代表。


    你可以访问多个外部网络来添加联系人。在 Friendica 中，点击主窗口中的 *联系人 | 添加新联系人* 即可向你的列表添加联系人。名称和兴趣搜索为你提供了与潜在志同道合者建立联系的机会。Friendica
    还允许你阅读来自其他平台（如 Twitter、Mastodon 或 Diaspora）的内容。但是，要建立直接通信，你还需要在源服务器上有一个账户（图 5）。在
    *查找人员* 设置框中，你可以基于各种标准（如共同兴趣）缩小联系人搜索范围。如果选择 *本地目录* 选项，则仅显示你当前登录的源服务器上的潜在联系人。使用
    *(组)* 访问栏将你的 Friendica 联系人分配给组。


    与 Diaspora 一样，Friendica 允许你从自己的服务器安装代码。在项目网站的 *使用它 | 安装你自己的服务器* 菜单中下载源代码。Friendica
    网站上 [4] 提供了详细文档。请注意，设置 Friendica 服务器需要满足某些软件要求。这些要求包括例如 LAMP 堆栈以及 PHP 编程语言和 Apache
    Web 服务器的特定版本。项目页面详细列出了各个应用程序。Friendica 不需要特定的硬件，因此你可以使用旧计算机系统作为服务器。


    ### Mastodon


    由 Eugen Rochko 自 2016 年以来开发的 Mastodon [5] 是另一个去中心化的微型博客平台。目前拥有约 510 万名用户和 3,786
    个服务器，它是知名度较高的免费服务之一。


