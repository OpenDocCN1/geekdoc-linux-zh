    ## SpiralLinux：专注于简洁性的新 Linux 发行版\n\nSpiralLinux (https://spiralinux.github.io/)\
    \ 是一个基于 Debian 的 Linux 发行版，提供 Cinnamon、Xfce、Gnome、KDE Plasma、MATE、Budgie、LXQt\
    \ 和 Builder（使用 IceWM 窗口管理器，供经验丰富的用户完全自定义系统）等版本。这些版本（除“Builder”外）均提供简化的 Linux 体验，并使用官方的\
    \ Debian Stable 软件包仓库。\n\nSpiralLinux 内置 Flatpak 支持，并配有用于管理 Flatpak 软件的图形用户界面前端。该发行版使用\
    \ Btrfs 文件系统，包含使用 Zstd 透明压缩的优化子分区，内置对自动 Snapper 快照的支持，甚至支持 zRAM 交换。\n\n据开发者称：“我们在利用\
    \ Debian 本身提供的软件包和机制来润色 SpiralLinux 在所有主要桌面环境下的默认配置方面投入了大量精力”，当被问到“为什么又一个基于 Debian\
    \ 的发行版”时，开发者如是说。\n\nSpiralLinux 基于 Debian 11（“Bullseye”），由内核 5.16 驱动，默认安装了 Firefox、LibreOffice、Thunderbird、Transmission、Pidgin\
