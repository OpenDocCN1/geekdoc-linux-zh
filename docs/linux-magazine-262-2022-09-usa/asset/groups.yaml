    ```

    podman generate systemd --new

    ```


    完成初步准备工作后，在您的浏览器上 *localhost:8080* 调用 Nextcloud，并以通常方式在那里完成安装（图 4）。可以在列表 4 中找到
    Podman 三个最重要配置文件的路径。


    **列表 4：Podman 配置**


