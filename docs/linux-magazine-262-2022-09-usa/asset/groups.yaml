    ## Ubuntu 22.04 LTS


    苹果的 M1 芯片，以及集成在内核中的 Samba 服务器（名为 KSMBD）。除了这些主要更新外，还有若干针对内核安全特性的较小调整。eBPF 内核沙盒已更新。有一些新的系统调用简化了容器处理（以及其他方面），此外文件系统集合也得到了改进。例如，ext4（Ubuntu
    的标准文件系统）自内核 5.10 起，得益于快速提交功能，速度更快。


    ### 网络绑定


    网络文件系统（NFS）的服务器和客户端软件包已升级至最新版本。NFS 默认不再支持通过 UDP 挂载。变更的原因是，在现代网络中，当连接速度超过 1 Gbps
    时，NFS over UDP 可能导致数据损坏——这是由于高负载引起的碎片化 [4]。新的 Samba v4.15.5 也已引入，其中包括结束多通道支持的实验状态。


    SSH 在连接到网络上的 Ubuntu 机器方面依然非常流行——无论是作为管理员，还是用于在目标机器上处理任务的软件。随新 Ubuntu 发布的 OpenSSH
    8.9 默认禁用了 RSA 签名，因为它们使用不安全的 SHA-1。禁用 RSA 可能会与较旧的 SSH 服务器通信时造成问题，但这可以稍后更改 [5]。随
    SSH 提供的 SCP 软件在机器之间移动和复制文件。该软件现在提供 -s 选项，以使用 SFTP 模式代替 SCP 模式。出于安全原因，根据 OpenSSH
    项目，这一行为将在不久的将来成为默认设置。OpenSSL v3 现在也可用；它移除了一些遗留的不安全算法。仍然支持 SHA-1 或 MD5 的证书也不再适用于
    OpenSSL v3。


    最近支持的 OpenLDAP 2.5.x 缺少一些组件，包括 shell 以及 BDB 和 HDB 后端。另一方面，Bind v9.18 现在更安全，提供对
    DNS over TLS（DoT）和 DNS over HTTPS（DoH）的支持。named 服务支持通过 TLS 的入站和出站区域传输（XFR over
    TLS, XoT）。


    在安全方面，nftables 现在是管理防火墙规则的新后端，接管了 iptables 的工作，同时也接管了 ip6tables（IPv6）、arptables（ARP）和
    ebtables（以太网桥接）。nftables 的开发者就是创建 iptables 的那群人，他们希望在新软件中摒弃遗留包袱。两个 iptables 版本（分别用于
    IPv4 和 IPv6 地址）一直引起混淆，并迫使管理员并行管理它们，直到现在。


    ### 机器集群


    数据中心管理员出于成本和效率的考虑，希望将尽可能多的机器压缩到单一的物理硬件上。这就是虚拟机（VMs）和容器发挥作用的地方。在架构方面，Qemu 虚拟化软件最近将最常用的功能作为模块外置。Qemu
    6.2.0 中的新 fuse3 版本使得在没有 root 权限且无需启动 VM 的情况下编辑 VM 映像变得更加容易。此外，Qemu 现在支持 Linux
    JACK 声音服务器，支持以音乐家所需的极低延迟进行访问。


    Libvirt 虚拟化 API 版本 8.0.0 已集成，并带来了 VirtIO 虚拟文件系统的热插拔支持。virt-manager（一个用于在 Linux
    上管理 VM 的图形化程序）的版本 4.0.0 已包含在内，并为配置共享存储提供了图形化选项。VirtIOFS 在此处作为设置中可选的文件系统提供。如果 VM
    使用 UEFI，Virt-manager 还会自动激活可信平台模块（TPM）。x86 客户机的新默认选项允许宿主 CPU 直通到客户机。最后但同样重要的是，VirtIO
    GPU 适用于大多数现代客户机系统。


    在创建 VM 模板时，VMware 用户受益于 cloud-init 22.1 的创新，该版本现在原生支持 VMware 作为数据源。LXD 数据源动态从
    LXD socket 读取实例数据，并应用配置更改，这些更改在重启后依然有效。


    大规模使用 VM 的人通常会转向 OpenStack。尽管没有重大报道，Canonical [6] 将新的 2022 "Yoga" 版本发送出去与竞争对手较量。同时，发行说明警告称，更新并非易事，因为
    OpenStack 由许多活动部件组成。因此，管理员需要为计划和测试升级预留时间，并研究发行说明 [7]。


    ### 容器爱好者


    容器和 VM 管理器 LXD 也带来了许多新功能，版本 5.0 现在为 VM 提供了与容器相同的功能集。在多用户操作中，多个用户可以独立启动他们的项目。VM
    现在支持虚拟 TPM 和 PCI 直通，并且可以实时迁移。此外，LXD 5.0 允许将硬盘和 USB 驱动器热插拔到 VM 中。对于 Docker，Canonical
    指出它不仅提供了 Ubuntu 本身的 Docker Hub 镜像，还提供了许多经过验证的容器镜像，包括 MySQL、PostgreSQL 和 NGINX。新增加的内容包括
    Grafana Loki、Apache Kafka 和 Apache Cassandra。


    如果您希望构建更大的容器环境，您将在 Ubuntu 22.04 中找到 Kubernetes v1.23 [8]。虽然 Canonical 推荐其 Charmed
    Kubernetes 用于企业部署，但更精简的 MicroK8s（图 3）则针对那些希望在边缘计算或物联网（IoT）领域运行容器编排器的用户。最后但同样重要的是，Canonical
    Kubernetes 也通过托管 Kubernetes 启用了托管容器化。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_27_0.png)


    **图 3：** 得益于 MicroK8s，可以相当快速地设置一个包含仪表板的本地 Kubernetes。


    ### 开发动力


    开发者使用 Ubuntu，因为它开箱即支持众多编程语言。现在，Windows 用户也有了一个简单的选项，可以在 Windows 子系统 Linux（WSL
    2）中使用熟悉的 Linux 工具，WSL 2 现在也支持 Ubuntu 22.04。


    对开发者特别感兴趣的是，包含了 PHP 8.1.2。如果您想从 7.x 版本升级，请注意版本 8 移除了一些已弃用的函数。因此，可能需要对某些代码进行调整。作为回报，PHP
    8 承诺更好的性能。Ruby 3.0 得益于 MJIT 编译器、并发和静态类型，比前代快三倍，这很可能会受到其追随者的欢迎。


    Python 粉丝可以期待版本 3.10.4 和发行版中基于 Python 的 Django Web 框架。Django 可用版本为 3.2.12，提供长期支持，并提供了异步视图和中间件等功能。警告：在升级过程中存在一些兼容性风险。Ubuntu
    22.04 还包括供 Java 开发者使用的 Go v1.18.x、Rust v1.58 和 OpenJDK 11。


    在编译器方面，Ubuntu 拥有很棒的功能集，包括 LLVM 14 和 GCC 11.2.0。在数据库方面，PostgreSQL 14 和 MySQL 8.0
    凭借一些新功能令人印象深刻。对于 PostgreSQL 14，存储过程现在通过 OUT 参数返回数据，简化了从 Oracle 到 PostgreSQL 的迁移。MySQL
    管理员可以禁用会话的审计日志。


    ### 观点


    随着每个 LTS 版本的发布，Canonical 都会解释其认为的新版本亮点，这允许人们推断出客户的要求。这次，该公司重点介绍了对 NVIDIA vGPU
    软件 14.0 的原生支持等功能。这使得许多 VM 的虚拟 GPU 可以链接在一起，以加速机器学习和处理大量数据的其他场景。此外，Ubuntu 22.04
    支持 NVIDIA 的 AI Enterprise 软件套件，它在科学环境和高性能计算方面具有优势。如果您想使用 Azure 的机密 VM，Ubuntu 是唯一支持该功能的
    Linux 发行版。Multipass [9]，一个由 Canonical 驱动的 GPL 软件，可以通过一个简单的命令在 Windows、macOS 和
    Linux 上启动 Ubuntu VM，并且（现在）也支持苹果的 M1 芯片。实时内核（目前仍处于 beta 阶段）预计将在电信行业特别受欢迎，例如用于 5G
    领域的实时应用。


    ### 结论


    如果您是管理员或开发者，您不必急于切换到 Ubuntu 22.04 LTS，但逐步过渡即使在您的服务器上也有意义。您应该考虑进行切换，不仅因为您喜爱的框架和内容管理系统最终会切换到新的编程语言版本，还因为更新的软件可能会利用
    Ubuntu 22.04 提供的一些新功能。如果您想等待，大多数“磨合期”问题应该在第一个点发布版本 22.04.1 出现时成为历史。在进行更改之前，请查阅发行说明
    [10]，了解考虑到您基础设施的已知问题。 ▪▪▪


