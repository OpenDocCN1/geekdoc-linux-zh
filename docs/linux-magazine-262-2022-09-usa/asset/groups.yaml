  mdcn: "\n##  LINUX NEWSSTAND\n\n**在线订购：** https://bit.ly/Linux-Newsstand\n\n《Linux\
    \ Magazine》是您进入 Linux 世界的指南。每月刊杂志都载有您在其他地方找不到的高级技术文章和教程。浏览我们过去的完整目录，查找特定主题或补全您的收藏。\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_94_0.png)\n\n### 第 261 期/2022 年 8 月\n\
    \n**USB 启动**\n\n15 年前，现场启动（Live boot）是一个令人兴奋的想法——只需随身携带一张 CD，即可从任何地方启动。但旧式的启动\
    \ CD 有一些局限性。今天的 USB 启动工具解决了这些问题，并提供了一项当时没人想到的功能：在单个 U 盘上访问多个启动镜像。\n\nDVD 内容：Linux\
    \ Mint MATE 20.3 和 FreeBSD 13.1\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_94_1.png)\n\
    \n### 第 260 期/2022 年 7 月\n\n**隐私**\n\n如果您真正重视隐私，您需要依赖比浏览器“不跟踪”按钮更多的东西。最需要匿名性的人依赖于\
    \ Tor 网络——一个在全球范围内提供安全浏览服务的项目，即使在监控国家也不例外。我们还介绍了 Portmaster，一款具有有用隐私功能的应用程序防火墙。\n\
    \nDVD 内容：Ubuntu 22.04 和 Fedora Workstation 36\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_94_2.png)\n\
    \n### 第 259 期/2022 年 6 月\n\n**零信任**\n\n二十年前，每个人都认为只需一道网关防火墙就能保持安全，免受入侵者侵害，但最近的历史告诉了我们不同的故事。如今，最好的建议是：不要信任任何人。您的内部网络可能和互联网一样危险。\n\
    \nDVD 内容：Zorin OS 16.1 Core 和 Super GRUB2 Disk\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_94_3.png)\n\
    \n### 第 258 期/2022 年 5 月\n\n**绿色 IT**\n\n大多数人知道更换更高效的灯泡可以节约能源，但您知道使用更高效的软件也能节约能源吗？本月我们将审视正在进行的努力，旨在让\
    \ IT 行业走向可持续发展。\n\nDVD 内容：Manjaro 21.2 Qonos 和 DraGoNfly BSD 6.2.1\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_94_4.png)\n\
    \n### 第 257 期/2022 年 4 月\n\n**加密**\n\n本月，我们将调查 Linux 中加密的现状。我们将超越基础知识，探索支撑保密系统的一些工具和技术——并告诉您需要知道什么，以确保您的隐私无懈可击。\n\
    \nDVD 内容：Linux Mint 20.3 Cinnamon 版和 deepin 20.4\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_94_5.png)\n\
    \n### 第 256 期/2022 年 3 月\n\n**面部识别**\n\n随着微软 Hello 技术的到来，生物识别技术最近得到了推动。现在开源世界正在迎头赶上，并有一款名为\
    \ Howdy 的创新工具。面部认证可能尚未准备好进入中情局（CIA），但我们将帮助您开始使用 Howdy，并探索通过一瞥进行身份验证的可能性。\n\nDVD\
    \ 内容：antiX 21 和 Haiku R1/ Beta 3\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_95_0.png)\n\
    \n## 精选活动\n\n用户、开发人员和供应商在世界各地参加 Linux 活动。我们 *Linux Magazine* 很自豪能赞助此处展示的精选活动。\n\
    \n要了解您附近的其他活动，请访问我们的 [在线活动日历](https://www.linux-magazine.com/events)。\n\n如果您知道我们日历中缺少的一项\
    \ Linux 活动，请将所有详细信息发送至 [info@linux-magazine.com](mailto:info@linux-magazine.com)。\n\
    \n## 通知\n\n在预订任何旅行之前，请务必查看活动网站，因为许多活动因 COVID-19 的影响而被取消或转为虚拟活动。\n\n## DrupalCon\
    \ Prague 2022\n\n- **日期：** 2022 年 9 月 20 日至 23 日\n- **地点：** 捷克共和国布拉格\n- **网站：**\
    \ [https://events.drupal.org/prague2022](https://events.drupal.org/prague2022)\n\
    \n成为 Drupal 未来的一部分！由 Drupal 协会主办，DrupalCon Europe 将于 9 月 20 日至 23 日在布拉格举行。加入我们，共同推进\
    \ Drupal 项目，并与社区其他成员建立联系。参与一对一面对面的讨论、主题演讲、BoF 会议等。不要错过在场上的机会！\n\n## Akademy\n\n\
