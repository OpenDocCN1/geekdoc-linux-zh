    ## 设置


    此处描述的设置非常适合在家庭网络中使用 Nextcloud。在这种简单场景下，所有容器都在单个 pod 中运行。如果您想从家庭网络外部访问该 pod，则需要额外的容器。出于安全目的，可以通过
