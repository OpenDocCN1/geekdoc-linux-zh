    # Go 语言照片定位猜测游戏

    # 寻宝游戏


    基于流行的 Worldle 的地理定位猜测游戏根据玩家猜测与目标地点之间的距离和方向来评估玩家的猜测。Mike Schilli 利用他私人收藏的照片，用 Go
    将这个概念变成了一个桌面游戏。作者 Mike Schilli


    在 Worldle [1] 猜词游戏取得巨大成功之后，第一个模仿者很快就出现了。其中最好的是有趣的 Worldle [2] 地理游戏，其目标是根据形状猜测一个国家。每次猜测失败后，Worldle
    都会提供关于猜测的地点距离目标有多远以及目标国家位于哪个方向的信息，以帮助玩家。


    图 1 中无法识别国家的轮廓，玩家的第一次猜测是列支敦士登公国。Worldle 服务器迅速告诉玩家，目标地点距离这个欧洲小国 5,371 公里，并且位于其东侧。玩家的第二次猜测是白俄罗斯，但根据
    Worldle 服务器，从白俄罗斯需要向东南方向旅行 4,203 公里才能到达目标。第三次尝试是蒙古，但这次猜过了，因为从那里需要向西南方向走 3,476
    公里才能到达秘密目的地。


    缓慢但肯定地，玩家意识到秘密国家可能位于印度附近。然后，在第四次尝试中，巴基斯坦被证明是正确的！Worldle 非常有趣，每天都有一个新国家供猜测。


    ## 私人快照


    现在，与其猜测国家，我认为从我的手机照片收藏中随机选择一些照片会很有趣，这些照片在过去的几年里疯狂增长。通过分析每张照片的 GPS 数据，游戏引擎确保一轮中的照片拍摄地点相距甚远。最初，计算机从集合中随机选择一张照片作为答案。当然，它对此保密，然后向玩家显示一张随机选择的照片，以及随机照片拍摄地点与目标地点之间有多少公里，以及玩家需要穿越世界到达那里的罗盘方向。


    凭借这些信息，玩家现在必须猜测剩余选择中哪张照片是秘密照片。玩家点击


    ![](img/b40e8bf6cf651f8eebf36f5265123095_55_1.png)


    **作者**

    Mike Schilli 在加利福尼亚州旧金山湾区担任软件工程师。在他自 1997 年以来一直发布的专栏中，他每月研究各种编程语言的实用应用。如果您通过 mschilli@perlmeister.com
    给他发邮件，他将很乐意回答任何问题。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_56_0.png)


    **图 2：** 起点：Schnitzlie 选择了一张距离目标 **9,457.8** 公里的照片。


    可疑的匹配项，并得到关于猜测的一些反馈，再次包括距离和罗盘方向，指向秘密位置。游戏的目标是用尽可能少的轮次找到答案——如果你喜欢的话，就像是一种寻宝游戏。为了致敬
    Worldie 中额外的辅音，我的程序名为 Schnitzlie。我的手机上有足够的照片可供选择，随机生成器确保游戏总是选择新照片，因此永远不会变得无聊。


    ## 行动开始！


    图 2 展示了正在运行的 Schnitzlie。作为起始图像，计算机选择了一张快照，描绘了作者本人在巴伐利亚阿尔卑斯山徒步旅行。根据线索，目标位于起始图像的西北（NW）方向
    **9,457.8** 公里处。很可能秘密照片是在北美某处拍摄的！然后，玩家从右侧的选择中点击加利福尼亚州巨岩州立公园（Pinnacles National
    Park）的照片（图 3）。Schnitzlie 揭示，目标位于这个猜测的西北方向 **168.5** 公里处。巨岩州立公园的北边是什么？可能是我居住的旧金山湾区！


    ![](img/b40e8bf6cf651f8eebf36f5265123095_56_1.png)


    **图 3：** 玩家点击了一张巨岩州立公园的照片，它距离目标仍有 **168.5** 公里。


    在图 4 中，玩家然后点击了 Pacifica 海滩停车场的照片，我经常去那里冲浪。但从海滩到游戏选择照片的地点，您还需要向


    ![](img/b40e8bf6cf651f8eebf36f5265123095_56_2.png)


    **图 4：** Pacifica 州海滩停车场距离目标仍有 **10** 公里。


    东北方向（NE）旅行 **10.2** 公里。如果您熟悉该地区，您大概可以猜到：目的地一定在南旧金山郊区的某个地方，那里有一家巨大的 Costco 超市。事实上，那个装满烤鸡的架子就是答案，正如
    *WINNER* 消息所示（图 5）。右侧栏中仍有两张未点击的照片，一张显示德国海德堡的一座桥，另一张显示湾区 Esplanade Beach 的沙子。


    ## 寻找便会找到


    那么，作为一个 Go 程序，游戏是如何工作的？从我的手机到我的硬盘下载整个照片集合需要一些时间，即使它是在快速的 SSD 上。这就是为什么 `finder.go`
    辅助程序（列表 1）挖掘第 18 行设置的手机照片目录的深度，分析其中找到的每个 JPEG 图像，读取其 GPS 数据（如果有），并将其缓存供以后使用。


    该程序将结果输入到 SQLite 数据库中的表中，以便游戏程序以后可以在每轮中快速选择新图像，而不必梳理整个


    ![](img/b40e8bf6cf651f8eebf36f5265123095_56_3.png)


    **图 5：** 答案：南旧金山 Costco 的烤鸡货架。


