    ## 把我带上，Fluxy！


    ![](img/b40e8bf6cf651f8eebf36f5265123095_65_1.png)


    > 使用 FLUX Beamo 激光和 Raspberry Pi Board B10001，您可以在多种材料上执行自己的激光切割项目。*作者：Christa
