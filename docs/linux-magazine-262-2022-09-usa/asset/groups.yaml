    \n## Simple web scraping with Bash\n\n### Ski Report\n\nWith one line of Bash\
    \ code, Pete scrapes the web and builds a desktop notification app to get the\
    \ daily snow report. **By Pete Motaiffe**\n\nWhile recently doing a small project,\
    \ I was amazed by how much web scraping I could do with just one line of Bash.\
    \ I used the text-based Lynx browser [1] and then piped the output to a grep search.\
    \ Figure 1 shows the one-line Bash example that scrapes the current snow depth\
    \ from the Sunshine Village Snow Forecast web page.\n\nIn this article, I will\
    \ introduce some techniques to easily scrape web pages, and then I will create\
    \ a desktop notification script that provides the daily snow forecast.\n\n###\
    \ The Lynx Text Browser\n\nFor my Bash web scraping, I started out by looking\
    \ at using command-line tools such as curl [2] with the html2text [3] utility.\
    \ This technique definitely works, but I found that using the Lynx browser offers\
    \ a one-step solution with a slightly cleaner text output.\n\nTo install Lynx\
    \ on Raspian/Debian/Ubuntu, use:\n\n```bash\nsudo apt install lynx\n```\n\nThe\
    \ Lynx -dump option will output a web page to text with HTML tags, HTML encoding,\
    \ and JavaScript removed. Figure 2 shows that a Lynx dump can greatly clean up\
    \ the original web page and make searching considerably easier. Sometimes a simple\
    \ Bash grep search might be all that you need. However, there are many cases where\
    \ some text manipulation is required. The good news is that Bash has a nice selection\
    \ of line and string manipulation tools.\n\nThe example shown in Figure 3 uses\
    \ line manipulation to find the current weather in Key West, Florida. A grep search\
    \ is done on the string \"As of\", and the option -B 3 is used to return the requested\
    \ line of data with an additional three lines. You can remove the \"As of\" line\
    \ with the tail command if required. It's important to note that what you see\
    \ on a web page may not match the Lynx outputted text, and some trial and error\
    \ testing might be required.\n\nFigure 4 uses string manipulation to find the\
    \ new snow at Sunshine Ski Resort. The resort’s web page uses JavaScript to show\
    \ the new snow in either centimeters or inches, but the Lynx text output displays\
    \ both values and their units.\n\nTo remove parts of a string variable, you can\
    \ use `%` to extract the first part of the string and `#` to extract the last\
    \ part of the string (as shown in Listing 1).\n\n### A Bash Web Scraping Project\n\
    \nTo get excited before a family ski trip, I wanted to create a morning notification\
    \ script that would show the new morning snow and the base snow.\n\nTo create\
    \ the notification script (Listing 2), I used two passes with the Lynx utility.\
    \ The first pass scrapes for new snow (shown in Figure 4) and then a second pass\
    \ gets the new base snow (shown in Figure 1). The snow results are then passed\
    \ as a string ($msg) to the `notify-send` utility [4], which posts the message\
    \ to the workstation desktop (Figure 5). You can schedule this Bash script to\
    \ run every morning using either `cron` or the `at` utility.\n\n### Summary\n\n\
    Scraping web pages can be tricky, and the pages can change at anytime. For this\
    \ reason, it is always best to check if an API is available before looking at\
    \ web scraping.\n\nPython with the Beautiful Soup library has been my go-to approach\
    \ for web scraping, but it’s nice know that a simple Bash alternative is also\
    \ available.\n\n### Info\n\n1. Lynx: [https://lynx.invisible-island.net/](https://lynx.invisible-island.net/)\n\
    2. `curl`: [https://curl.se/](https://curl.se/)\n3. html2text: [https://github.com/Alir3z4/html2text/](https://github.com/Alir3z4/html2text/)\n\
    4. `notify-send`: [https://delightlylinux.wordpress.com/2020/10/25/bash-show-notifications-from-scripts-using-notify-send/](https://delightlylinux.wordpress.com/2020/10/25/bash-show-notifications-from-scripts-using-notify-send/)\n\
    \n### Author\n\nYou can investigate more neat projects by Pete Metcalfe and his\
    \ daughters at [https://funprojects.blog.](https://funprojects.blog.)\n\n### Listing\
    \ 1: Extracting Parts of a String\n\n```bash\n01  newsnow='5.8cm2.0'\n02  # Get\
    \ the part before 'cm'\n03  echo \"${newsnow%*cm}\"\n04  5.8\n05  # Get the part\
    \ after 'cm'\n06  echo \"${newsnow#*cm}\"\n07  2.0\n```\n\n### IT Highlights at\
    \ a Glance\n\nToo busy to wade through press releases and chatty tech news sites?\
    \ Let us deliver the most relevant news, technical articles, and tool tips - straight\
    \ to your inbox.\n\n- Linux Update\n- ADMIN Update\n- ADMIN HPC\n\nKeep your finger\
    \ on the pulse of the IT industry.\n\nADMIN and HPC: bit.ly/HPC-ADMIN-Update\n\
    Linux Update: bit.ly/Linux-Update\n\n### Listing 2: Bash Web Scraping Notification\
