    \ 以及许多其他新增功能和增强项，这一体验变得更加出色。\n\n至于 KaoS 中还增加了哪些内容，你会看到 KDE Frameworks 5.95、KDE\
    \ Gear 22.04.2、Calamares 3.3、作为默认办公套件的 LibreOffice（取代了 Calligra）、Linux 内核 5.17（增加了对\
    \ GPU 的改进支持），以及在新手引导欢迎界面中新增的软件包选择功能。\n\n当然，KaoS 2022.06 的核心是 KDE Plasma 5.25，它带来了大量改进，包括增强的手势支持、窗口强调色色调、大幅优化的触控模式、Kdenlive\
