    坦率地说，Manuskript 默认的“世界”面板（在图 7 中仅部分可见）对于三部曲这样的大型作品来说，可能会令人望而生畏。需要填写的类别如此之多，以至于人们可能会原谅自己有“这比实际写书花费的时间要多得多！”的想法。但不要绝望。首先，你并不被强制要求在开始写作之前填写所有这些方框。此外，如果你确定某些项目对特定的故事没有用，你可以，而且很可能应该，删除其中尽可能多的项目。


    与此同时，尽早收集足够的耐心和纪律，利用这些方框完整描述一个世界，很可能提高结果的质量，并在长期内节省时间。这对于跨越多本书的系列作品尤其如此，如果没有随时在手边掌握所有必要信息（存放在这些方框中），避免情节漏洞并保持连续性和连贯性将变得更加困难。


    良好使用“情节”和“世界”面板对于使用 Manuskript 创作优秀的虚构作品至关重要，但对于任何写作项目，你几乎总是会使用的那个面板很可能是图 8 中的“大纲”面板。在其中，你可以按层级顺序列出作品的每个部分，并为每个部分分配状态、字数、标签以及该部分应从谁的视角（POV）来写。大纲还非常清晰地展示了哪些部分仍需要最多的工作，其核心功能是让添加、删除或重新排列章节和子章节变得真正容易和快速。对于非虚构作品项目，这很可能就是
    Manuskript 能给予作者最大的帮助。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_91_1.png)


    ## 最后，编辑器


    一旦所有你需要写得好的信息都整齐地排列在 Manuskript 中，你可以点击导航工具栏上的最后一个按钮，最终开始写作。如果你正确使用了 Manuskript，你首先会看到故事的一级大纲。然后，点击一个部分将显示其所有子部分，以索引卡片的形式呈现，每个卡片都标记有其进展状态和可在原地编辑的摘要（图
    9）。相反，点击大纲树中的任何章节将在 Manuskript 编辑器中打开它（图 10）。你可以使用全屏模式以获得最大化的专注度（点击右下角的按钮激活它），或者像图
    10 所示在主要的 Manuskript 窗口内使用，以实时查阅你的写作数据库。例如，在图 10 中，我点击了“元数据”选项卡以查看该章节的所有属性，并点击了“故事线”以查看每个情节和子情节应该开始或结束的位置。Manuskript
    编辑器故意设计得简洁，因为它的主要目标是支持无干扰的纯文本写作（下文将更多讨论这一点）。即便如此，它拥有高效写作所需的一切。除了动态字数统计外，它还支持（图
    11）多个拼写检查器和词典，外加一个频率分析器，显示哪些单词和短语你使用得更频繁。这个最后的职能非常有用，既可以避免自我重复，也可以查明哪些人物或概念在你的写作中占据了最多的篇幅（也许这与你的本意或你认为的本意相悖）。


