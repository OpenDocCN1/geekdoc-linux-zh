    开放 RAN 为构成移动革命基础的无线接入网络带来了新的开放精神。


    作者：Emil J. Khatib


    移动网络是 21 世纪技术和文化的重要贡献者。像诺基亚或爱立信这样的公司塑造了移动革命的早期代际，由 GSMA、ETSI 或 3GPP 等工业联盟主导。这些国际组织创建了开放标准，增强了竞争并促进了行业的发展。快进到
    2022 年，主要参与者已经改变，像三星、苹果或华为这样的名字正在塑造智能手机市场，但开放标准继续发挥重要作用。


    像许多技术发展一样，移动通信的先例可以追溯到第二次世界大战。帮助前线士兵的移动电话概念在战后进入了民用领域，20 世纪 60 年代、70 年代和 80 年代见证了便携式通信系统（如市民波段（CB）无线电、对讲机）以及最终早期蜂窝通信的出现。


    20 世纪 90 年代初，第二代（2G）移动电话网络随着 CDMA 标准（主要在美国、日本和韩国使用）和 GSM 标准（在欧洲、非洲、澳大利亚和亚洲大部分地区流行）的出现而亮相。2G
    见证了手机的爆炸式增长，并有效地改变了我们对电信的看法：它不再关乎地点之间的通信，而是关乎个人的连接。


    就在这时，互联网也变成了一种商品，习惯了连接的用户希望从手机上浏览网页和发送电子邮件。升级 2G 的努力很快因表现不佳而落空，第三代（3G）开始成形。第三代合作伙伴计划（3GPP）在
    1994 年发布了 UMTS 规范，并在千禧年之交左右开始商业化。3G 支持移动宽带，为几年后的智能手机铺平了道路。


    对更高带宽的无尽需求促使 3GPP 提供几乎每年对标准的补充。UMTS 通过版本 99、2000、4、5、6 和 7 进行了更新。尽管编号有点奇怪，但从那时起，就有了一个相当稳定的编号方案。版本
