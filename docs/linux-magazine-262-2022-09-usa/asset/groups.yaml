    # IN-DEPTH


    # DIY Web Server


    Build your own web server in a few simple steps


    # Self Made


    If you want to learn a little bit more about the communication between a web browser
    and an HTTP server, why not build your own web server and take a closer look.
    By Goran Miladenovic


    ![](img/b40e8bf6cf651f8eebf36f5265123095_43_0.png)


    Programming your own web server might seem like a difficult and unnecessary undertaking.
    Any number of freely available web servers exist in the Linux space, from popular
    all-rounders like Apache or NGINX to light-weight alternatives like Cherokee or
    lighttpd (pronounced “lighty”.


    But sometimes you don’t need a full-blown web server. If you just want to share
    a couple of HTML pages locally on your own network or offer people the ability
    to upload files, Linux on-board tools are all it takes. A simple shell script
    is fine as a basic framework that controls existing tools from the GNU treasure
    chest. Network communication is handled by Netcat [1], aka the Swiss army knife
    of TCP/IP.


    # Getting Ready


    With a project like this, the best place to start is at the root. Because a web
    server is still a server at the end of the day, it needs to constantly listen
    on a given port and respond appropriately to requests. Usually, web servers listen
    on port 80 for normal requests, and port 80 generally only accepts HTTP requests
    without encryption. The web server I’ll describe in this article listens on ports
    8080 and 8081 and communicates without encryption. If you are using a firewall
    and want to test the server on the local network, remember to allow these two
    ports in the firewall.


    A web server needs a root folder from which it loads the requested HTML files.
    It also needs a directory in which it can store uploaded files. Your first step
    is to define a configuration using a series of simple variables at the start of
    the server script (Listing 1). And you need to create the directories, along with
    a FIFO file, either manually or using the Bash test builtin. The serve6.sh script,
    which is included with the code from this article [2], offers a solution.


    In the last line of Listing 1, you can see that your own IP address is also important.
    You will need to modify the network device specification (the Ethernet interface
    enp2s8 in this example) to suit your own system. When a web browser tries to submit
    a file via a web form, it needs a target address. GET requests are the simplest
    approach to doing this. When a browser sends a GET request, it expects the content
    of a web page in response, and it displays this content in the browser window.


    # Listing 1: Configuration


    ```

    ```

    HTTP_HOME=http_home

    HTTP_UPLOAD=$ HTTP_HOME /upload

    CACHE_DATEI=$HTTP_UPLOAD/filetoprocess

    FIFO_GET=fifo_get

    HTTP_GET_PORT=8080

    HTTP_POST_PORT=8081

    MEINE_IP=$(ip addr show enp2s8 | grep -Bo ''{[0-9]{1,3}.}{3}[0-9]*'' | sed 1q)

    ```

