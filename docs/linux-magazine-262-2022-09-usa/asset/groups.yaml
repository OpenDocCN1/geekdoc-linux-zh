    无线通信网络。3GPP 标准定义了一些所有数字蜂窝网络代际（从 GSM 开始）共有的元素。5G 移动网络由两个大块组成，每个块又包含其他功能（图 1）：无线接入网络（RAN）和核心网（Core）。


    RAN 包含所有使移动网络具备移动性的元素，即作为终端接入点的基础站（图 2）。随着各代技术演进，该架构已取得了显著进步，基础站的元素多次被重命名、重塑并缩小尺寸。自
    4G 以来，架构的另一部分是微微小区（femtocells），这是一种小型基站，其尺寸和形状类似于 WiFi 接入点。微微小区（图 3）改善了小型办公室、室内公共区域和家庭的覆盖范围。在
    5G（顺便说一下，在 6G 中也是如此）中，基础站更常被称为 gNodeB。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_1.png)


    RAN 基本上是一个接入点网络，提供 IP 层以下的连接性，其本身无法连接到外部世界或提供诸如认证或漫游之类的服务。相反，这些服务是核心网的功能。换言之，核心网包含所有使移动网络成为网络（而非仅仅是移动性集合）的元素。（关于核心网关键功能的更多详细信息，请参见标题为“核心网”的方框内容。）


    随着移动网络新一代技术的演进，核心网这些元素变得越来越开放。在 5G 环境中，只要遵循 3GPP 标准接口，核心网功能就可以由不同的供应商进行编程和分布。这种开放方法具有许多优势。例如，NRF
    功能使得管理来自不同供应商的软件包变得更加容易，消除了可能导致网络无法运行的不兼容性。


    这种开放标准的趋势也延伸到了 RAN，在那里，一种类似的基于微服务的架构正在兴起：Open RAN。


    ## Open RAN


    用于 5G 核心网的微服务方法事实证明简化了新功能的添加和维护、第三方软件的集成以及使用现成计算机运行基础设施。换句话说，这是一个好主意。因此，合乎逻辑的下一步是将这个好主意转移到网络的另一部分，即
    RAN。在 5G 中，RAN 在相当程度上也具有开放规范（例如，网络功能、协议等）。唯一的障碍是，只有少数制造商具备制造所需设备的能力：高频无线电收发器、放大器、精心设计的天线、高选择性滤波器以及其他高度专业化的工具。传统上，这种限制使
    RAN 市场中的参与者减少到几家大型企业，如华为、诺基亚和爱立信。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_2.png)


    **图 2：典型基础站的天线。**


    **图 3：5G 微微小区（CC BY-SA 4.0，来自 commons.wikimedia.org 的用户 Liamjs）。**


    ### 核心网


    在 5G 中，主要的核心网功能包括：


    - 用户面功能（UPF）：包含所有直接与终端连接互联网相关的功能。这些功能包括路由和转发、网络地址转换（NAT）、数据包过滤、深度包检测（用于合法通信拦截）；是的，该功能在标准
    [1] 中定义，当然还有计费。这些功能组构成了用户面。5G 网络的所有其他功能都称为控制面功能，支持用户面的正确运行所必需。

    - 接入和移动性管理功能（AMF）：执行漫游功能，即重新分配服务 gNodeB 给终端所需的运营以及执行切换操作，以确保用户面始终能为终端提供连接性。

    - 认证服务器功能（AUSF）：包含其他核心功能所需的用户认证特性。

    - 会话管理功能（SMF）：跟踪用户面中的连接并确保根据特定终端的用户策略正确运行这些连接。

    - 网络切片选择功能（NSSF）：支持网络切片 [2] 功能，该功能将网络资源分配给多个切片或子网络。每个切片可以在虚拟上支持不同的配置、服务等等，同时与其他切片共享裸机资源。

    - 策略控制功能（PCF）：包含调节其他控制面功能（如分配资源给不同切片）和用户面连接（例如，不同的服务质量（QoS）参数）的规则。

    - 统一数据管理（UDM）：充当包含用户数据（如会话状态和认证密钥）的集中式数据库。它被其他功能（如 AUSF 和 SMF）使用。

    - 应用功能（AF）：为最终用户提供 服务。AF 是互联网上远程服务的等价物，但与移动网络的集成度更高（例如，使用用户配置文件或更快的用户面连接）。

    - 网络仓库功能（NRF）：充当实现所有核心网功能的软件包的集中式仓库。

    - 网络开放功能（NEF）：充当在 5G 核心网中开发新服务的接口 – 包含 SDK、针对第三方 AF 的 API 以及其他元素。


    所有这些网络功能都由运行在强大计算机上的软件包实现（通常运行 RHEL 或 SLE 等企业级 Linux 发行版）。


    然而，近年来几项技术上的进步改变了 RAN 的前景。首先也是最重要的，软件定义无线电（SDR）允许使用通用的无线电设备，这些设备可以由第三方制造并被 RAN
    设备集成商获取。无需构建昂贵的 RAN 专用无线电芯片，这些芯片只有少数制造商可以提供。配备强大计算机和适当信号处理软件的 SDR 板可以成为 RAN 的基础站。其次，云计算的发展使得集成商能够使用云提供商来支持所有信号处理。对“强大计算机”的需求被更具经济效益的云实例所取代，资源可根据需求提供。


    单是这两项技术就已经预示着成本的大幅降低，使较小的竞争对手参与其中，包括 Amsosoft、Yepzon 和 Viavi 等小型企业公司。


    但还可以实现更高程度的开放性。尽管这些小企业可以各自拥有封闭的、整体式的解决方案，但还有另一种方式：Open RAN 是一种新方法，它将通过开放规范的接口将
    RAN 定义为一组微服务。Open RAN 规范定义了功能块以及连接它们的接口，使得 RAN 集成商可以使用现成的硬件（或云实例）、一些 SDR 模块以及来自不同制造商的一组能够完美互动的软件组件来构建
    RAN 解决方案。这些组件可以随着供应商添加新功能、纠正错误或支持未来的 3GPP 版本而进行更新。


    图 4 显示了 Open RAN 中定义的元素。主要概念是“解聚”。OpenRAN 不再使用独立的 gNodeB，而是将功能分配给三个主要组件：


