    # Setting up Nextcloud with Podman


    # Turnkey


    Podman gives users a quick and easy way to set up a Nextcloud instance for home
    use.


    By Ferdinand Thommes


    ontainers are increasingly making inroads into home networks. If you use Flatpaks
    or Snaps, you already use containers in everyday life. Future distributions will
    shed weight to a minimum, with required services running as containers of some
    kind. This development has been heralded by Fedora’s Silverblue and Kinoite, Endless
    OS, MicroOS, and Intel’s Clear Linux. It definitely makes sense for home users
    to consider the various container solutions.


    Containers isolate applications through virtualization while providing a runtime
    environment. They make use of the fileystem and the resources of the operating
    system on which they run. This gives containerization the advantage of lower resource
    consumption compared with the traditional server approach or conventional virtualization.
    Where a virtual machine requires its own operating system, including a kernel,
    containers only store the actual applications plus many files and functions (microservices)
    required for execution.


    Docker has long been synonymous with containers since its inception in 2013, but
    the advent of the Kubernetes container orchestration software has slowly started
    to change this perception. Recently, Podman [1] has been gaining momentum in the
    container sector, reaching version 4.0. After disputes between Docker and Red
    Hat over ongoing development, Red Hat began investing in Podman in 2017 as an
    application for managing containers and pods and has since cancelled support for
    Docker.


    Podman (short for Pod Manager) has adopted the pod model introduced by Kubernetes.
    Pods are containers, each with individual applications running on the same server.
    If you want to set up Nextcloud, for example, you also need a server application,
    a database, and, if you want to access the service from the outside world, a reverse
    proxy. All of these applications run in separate containers in a pod. This offers
    benefits such as the ability to bind to the pod’s localhot address, which means
    that all the containers in the pod can connect to it because of the shared network
    namespace.


    In this article, I’ll discuss the benefits of Podman and then show you a practical
    example by setting up Nextcloud with Podman.


    # Podman Benefits


    While Docker is centrally controlled by a daemon, Podman does without such an
    instance and runs without root privileges. The containers run in the context of
    a normal user thanks to the use of the kernel’s user namespaces based on Cgroups
    2 [2]. In the container itself, however, the processes themselves run with root
    privileges. Inside a namespace, processes thus have different rights and user
    IDs than outside it. Because they are not controlled by a daemon, Podman containers
    can be included as systemd services [3] or controlled in a GUI using the Cockpit
    admin tool (Figure 1) [4].


    Photo by Axel Tyring on Unsplash'
