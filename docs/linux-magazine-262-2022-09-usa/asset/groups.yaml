    其他移动网络元素，例如 Open Core 网络。TIP 还举办“插拔测试”（plugtests），不同的 Open RAN 厂商借此测试其功能的集成与互操作性。虽然这些是最广为人知的
    Open RAN 项目，但还有其他一些实现方案，例如 OpenAirInterface [5]，它提供了一种符合 O-RAN 联盟规范的开源解决方案。


    对 Open RAN 概念存在一些批评 [5]，认为其未能实现完全开源 RAN 的承诺，重点在于开发无线基础设施的难度。事实上，有几个障碍使得为移动网络开发
    SDR 功能对小企业或社区开发者来说非常困难，甚至（目前）完全不可能。一方面，所需的设备不仅包括 SDR 板卡，还包括用于验证功能和标准及法规合规性的测试设备，这些设备非常昂贵。另一方面，法规限制也很严格：移动网络中使用的设备需要由相关主管机构认证，而且在大多数频段（包括大多数蜂窝通信使用的频段）传输无线信号都需要公共机构颁发的特别许可证。从长远来看，这些问题中的一些有解决方案。例如，昂贵的测量设备未来可能会被基于开源
    SDR 的实现所取代。而法规方面的障碍则更难克服。目前，小企业和研究中心通过与运营商合作来获取频谱使用许可，这极大地限制了发展，且昂贵的工具如消声室（基本上是一种法拉第笼，用于屏蔽外发的高频无线信号）也是必需的。无论如何，开源社区的创造力和智慧已一次又一次证明其能够克服此类问题。


    ## 开放硬件的角色


    网络核心和 Open RAN 的主要卖点之一是在现成的计算机或通用云实例上运行大部分网络功能的可能性。就底层硬件而言，外行人在谈到“现成”计算机时，脑海中首先想到的通常是基于
    x86 的系统。这些系统易于获取且易于更换，当其在网络中的生命周期结束时，可以重复用于其他用途。其运维成本低，文档和专业知识丰富，且来自制造商和工具的支持水平非常高。不利的一面是，x86
    系统的能效不高，这对于运营商来说是一个日益重要的关注点，无论是在碳足迹还是能源账单方面。


    最近，能效高的 ARM 处理器开始用于服务器。虽然 ARM 目前在 x86 的支持级别和可用软件数量上尚无法企及，但对 ARM 的兴趣与日俱增。


    最后，任何关于处理器的讨论若不提及 RISC-V 都是不完整的。RISC-V 平台具有 ARM 在功耗方面的优势（尽管在成熟度上稍显落后），并且它是开源硬件。潜在地，小企业可以扩展
    RISC-V 处理器，以包含针对移动网络的特定功能。此外，由于其开放性，预计随着对 RISC-V 需求的增加，价格将会下降。


    到目前为止，我讨论了支持移动网络软件部分的硬件，即核心网络以及 Open RAN 中的 DU、CU 和 RIC。那么 RU 呢？虽然纸面上它看起来只是一个小板块，但
    RU 对无线电通信至关重要，且是最难处理的部件之一。然而，有几种选择，例如 Ettus Research 的 USRP 设备 [6]，它们提供开源驱动程序。由于围绕其聚集了庞大的社区，USRP
    是该领域研究人员的首选。另一个商业选择是 LimeSDR [7] 板卡，它是开源硬件。与 USRP 相比，它们更具成本效益，并正逐渐被社区采用。它们也被 Amarisoft
    等集成商开发的几种商用 RAN 解决方案所使用。HackRF [8] 和 PlutoSDR [9] 设备也是开源的，它们是非常便宜的替代品，社区开发者可以获取。虽然这些设备的性能不如
    LimeSDR 或 USRP，但它们是很好的学习起点，用于探索 Open RAN 功能。你还可以使用 HackRF 和 PlutoSDR 开始开发急需的辅助工具，如频谱分析仪。


    ## 未来展望


    可以说，Open RAN 尚未在蜂窝网络上取得像 Linux 和 Apache 在互联网上那样的主导地位。但所有要素都已具备，只需要一些有动力的个人、大学以及那些将开源视为与大型制造商竞争盟友的地下公司（underground
    companies，此处可能指非传统或小型初创公司，直译为“地下公司”略显生硬，建议理解为小型或非传统实体，但按原文翻译保留原意）的努力。最终，开放标准极有可能引领未来移动网络向开放硬件和开源软件的方向发展。
