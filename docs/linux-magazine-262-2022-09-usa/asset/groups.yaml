    行定义的回调。就是这样：一个新的由可点击照片控制的 GUI 元素，其行为类似于按钮组件。


    ## 索引卡作为模型


    就像从第 41 行开始的退出按钮一样，它使用其回调在通过 `os.Exit(0)` 按下按钮时宣布游戏结束，列表 6 可以——得益于新的扩展——在第 29
    行创建一个新可点击照片。在其回调中，它将选定的索引发送到 `pickCh` 通道。在管道的另一端，游戏装置获取该索引并触发动画，将照片从右移动到左侧面板。


    列表 5 的其余部分致力于使用 `makeUI` 安排游戏中显示的组件。核心函数 `reload()` 在程序初始启动时以及每当按下“新游戏”时加载新游戏。


    游戏窗口中的图形元素被安排为顶部的两个水平按钮，随后是两个由 `Card` 类型组成的图像列——这依赖于使用 `NewVBox()` 进行垂直堆叠。这个来自
    Fyne 集合的标准 `Card` 组件显示一个标题（可选地还有一个副标题）和一个用于说明的图像。你可以将其类比为一种带有标题和一些媒体内容的索引卡。


    列表 6 定义了游戏的 `main()` 函数，并在 `makeMenu()` 中定义了左右游戏列的个别组件。在此基础上，当玩家在右列点击照片时，会启动移动机制。


    `pool` 数组中的元素是右列的照片，每个都显示为一个 `CanvasObject` 组件。与此相反，左侧组件列包含在游戏过程中已选择的照片。它们位于最初为空的
    `left` 数组中。每当右列组件中的照片被点击时，与该照片关联的回调会将选定的索引发送到第 31 行的 `pickCh` 通道。


    然后，在第 45 行定义的 Go 例程并发运行，使用 `select` 处理事件。它通过调用第 50 行的 `hike` 来计算到目标图像的距离，并在第 62
    行使用结果生成 Fyne 卡片。`Add()` 函数在第 63 行将该卡片附加到左列底部，并使用 `canvas.Refresh()` 确保 GUI 显示更改。


    为了让被点击的照片从右列消失，第 66 行在其位置放置一个空的 `Label` 组件，然后立即通过调用 `Hide()` 将其移除。


    在游戏开始时，第 76 行使用 `randPickExcept()` 从右列随机选择一张照片，但避免立即透露答案。第 77 行将索引位置推送到 `pickCh`
    通道，这非常类似于稍后用户选择的光片组件回调所做的操作，从而触发相同的动画并将其移动到左列。


    在 Go 中，程序员实际上必须在每次函数调用后检查结果，以确保没有错误出现。它总是作为一个 `err` 变量返回。如果其值为 `nil`，则表示没有发生错误。每次，相应的错误处理器需要三行代码，并在杂志上打印的列表中占据大量空间。


    这就是为什么第 82 行简单地定义了一个 `panicOnErr()` 函数，每次用一行代码执行此测试，如果发生错误，则通过调用 `panic()` 立即终止程序。在生产环境中，错误通常会单独处理并进一步在调用堆栈中循环，但杂志印刷页面的空间有限，没人想阅读巨型列表！


