    \ ready to be processed by the kmeans package from GitHub [6].\n\nThe call to\
    \ km.Partition() then assigns the GPS coordinates to 10 different clusters. From\
    \ these, line 60 then discards tiny clusters with fewer than three entries. This\
    \ prevents the same photos from appearing time and time again in each game, not\
    \ giving the algorithm a chance to deliver variety in the form of random selections\
    \ from a specific cluster. The algorithm selects a maximum of six (maxClusters)\
    \ photos from the remaining clusters and then puts them in random order with the\
