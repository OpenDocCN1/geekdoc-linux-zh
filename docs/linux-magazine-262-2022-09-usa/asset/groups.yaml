  - '[PAGE 8]


    (14 Cores, 20 threads, 24MB cache, and up to 4.80GHz clock speeds), improved battery
    life, and better graphics (via an integrated Iris Xe 4K chipset). Consumers will
    find two different models available with this configuration: A 14-inch 3K display,
    running at a 90Hz refresh rate (at 2880×1800 resolution) and a 16-inch model that
    sports NVIDIA RTX 3050Ti graphics with 4GB GDDR6 RAM (also at a 90hz refresh rate).


    The 14-inch model does get a beefier battery (99Wh), whereas the 16-inch model’s
    battery is a smaller 82Whr. Both laptops include USB-C Thunderbolt 4, USB 3.2,
    HDMI 2.0, and USB-C 3.2 (with Display Port). The keyboards are backlit with large
    touchpads and the devices can be upgraded up to 64GB DDR4 3200MHz RAM and up to
    4TB NVMe SSD storage. Both versions include a 1080p full HD webcam with integrated
    stereo mic, WiFi 6, Bluetooth 5.1, 2W stereo speakers, and a Kensington Lock mount.
    You can select from numerous Linux distributions to be preinstalled (such as Ubuntu,
    Kubuntu, Debian, elementary OS, Pop!_OS, Linux Mint, and more).


    Price starts at approximately $1,322 for the 14-inch model and $1,627 for the
    16-inch. Order your new Slimbook Executive now (https://slimbook.es/en/store/slimbook-executive).


    # Fedora Linux Is Coming to the Raspberry Pi 4


    Fedora Linux has been available for desktops, servers, and even IoT devices. However,
    if you wanted to install the OS on the Raspberry Pi 4 device, you were out of
    luck — until now. With the upcoming release of Fedora 37, support for the devices
    might well finally become a reality. Although not official, it has become a proposed
    change and will be implemented if it receives approval from the Fedora Engineering
    Steering Committee.


    The reason the Raspberry Pi 4 has yet to be supported by Fedora Linux has been
    the lack of accelerated graphics. However, with upstream work to the kernel and
    Mesa (specifically the V3D GPU for both OpenGL ES and Vulkan), it’s now just a
    matter of enabling support. The one caveat is that support for WiFi on the Raspberry
    Pi 400 is not a part of this (although testing for audio support is).


    According to the Raspberry Pi 4 Fedora Wiki page, “The support for the Raspberry
    Pi ecosystem has been an ongoing evolution. The aim of this change is to support
    the Raspberry Pi 4 including the 4B, the 400, and the CM4 with I/O board. Upstream
    now supports accelerated graphics using the V3D GPU for both OpenGL ES and Vulkan.
    There’s also enhancement to wired networking with support for PTPv2 on the CM4/4B.”


    ![](img/b40e8bf6cf651f8eebf36f5265123095_8_0.png)


    # KaoS 2022.06 Now Available with KDE Plasma 5.25


    KaoS was first created in 2013 as a Linux distribution that focuses on the KDE
    Desktop Environment. The original goal was to create a highly polished KDE experience,
    which the developers achieved quite well. And with the latest release, that experience
    is made even better with the addition of KDE Plasma 5.25 and a number of other
    additions and enhancements.


    As to what else has been added to KaoS, you’ll see KDE Frameworks 5.95, KDE Gear
    22.04.2, Calamares 3.3, LibreOffice as the default office suite (a change from
    Calligra), Linux kernel 5.17 (which adds improved support for GPUs), and a new
    package selection addition to the onboarding Welcome screen.


    Of course, at the heart of KaoS 2022.06 is KDE Plasma 5.25, which adds a host
    of improvements, including improved gesture support, tints for window accent colors,
    a much-improved touch mode, 10-bit color for Kdenlive, many enhancements to Kate,
    and an enhanced Settings dialog.


    # MORE ONLINE


    **Linux Magazine**

    www.linux-magazine.com


    **ADMIN HPC**

    http://www.admin-magazine.com/HPC/


    **Sharing Terminals**

    • Jeff Layton

    Sometimes sharing a screen between two users is enormously helpful. We look at
    two terminal sharing tools: screen and tmux.


    **Performance Health Check**

    • Many HPC systems check the state of a node before running an application, but
    not very many check that the performance of the node is acceptable before running
    the job.


    **ADMIN Online**

    http://www.admin-magazine.com/


    **Three Full-Text Desktop Search Engines**

    • Harold Jule

    Desktop search engines such as Tracker, DocFetcher, and Recoil help track down
    files by their content, even in massive datasets.


    **Stretching Devices with Limited Resources**

    • Federico Lucifredi

    Compressed memory solutions for small memory problems.


    **Portable Home Directory with State-of-the-Art Security**

    • Martin Loschwitz

    The systemd homed service makes it easy to move your home directory, and FIDO2
    or PKCS#11 can secure the stored files.'
  - '[PAGE 9]


    # NEWS


    For those who are curious, LibreOffice became the default office suite, since
    it is now available as a single Qt application.


    To read more about the latest release, check out the KAOS news page (https://kaosx.us/news/2022/kaos06/)
    and download an ISO from https://kaosx.us/pages/download/.


    # Manjaro 21.3.0 Now Available


    Manjaro is an Arch-based, rolling-release Linux distribution aimed at users who
    want the power and flexibility of Arch, without complications. The latest release,
    version 21.3.0, includes plenty of newness, in the form of the Calamares installer
    (which now supports LUKS partitions), Gnome 42 (which includes Libadwaita), KDE
    Plasma 5.24 (which includes the new Overview), Xfce 4.16 (which now supports fractional
    scaling), and Linux kernel 5.15 LTS.


    The Gnome edition of Manjaro 21.3.0 includes both GTK 4 and Libadwaita, which
    offers improved performance, a modern UI style, and plenty of new user interface
    elements. The Plasma edition makes it possible to more easily move panels around
    and stick them to any edge you like. The Xfce edition received quite a number
    of updates, especially in the area of compositing and GLX.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_9_0.png)


    Since Manjaro is a rolling edition, if you already have the OS installed, an update
    should bring you to the latest release. If you don''t have Manjaro installed,
    you can download the latest ISO from the official Manjaro Download page (https://manjaro.org/download/),
    where you have the choice to download the full or a minimal version of the OS.
    You''ll find downloads for x86_64 and ARM architecture as well as unofficial spins
    for the Budge, Cinnamon, i3, Sway, Mate desktops, and even a Docker image.


    # SpiralLinux: a New Linux Distribution


    Focused on Simplicity


    SpiralLinux (https://spiralinux.github.io/) is Debian-based Linux distribution
    with spins for Cinnamon, Xfce, Gnome, KDE Plasma, Mate, Budge, LXQt, and Builder
    (which uses the IceWM window manager for experienced users to fully configure
    the system to meet their needs). Each of these spins (minus “Builder”) offers
    a simplified Linux experience that uses the official Debian Stable package repositories.


    SpiralLinux includes Flatpak support built-in as well as a GUI front end for managing
    Flatpak packages. The distribution uses the Btrfs filesystem which includes an
    optimal sub-partition with Zstd transparent compression and built-in support for
    automatic Snapper snapshots and even zRAM swap support.


    According to the developer, “Great effort has been expended in polishing the SpiralLinux
    default configuration for all the major desktop environments using the packages
    and mechanisms that Debian itself provides,” said the developer when asked “why
    another Debian-based distro.”


    SpiralLinux is based on Debian 11 (“Bullseye”), is powered by kernel 5.16, and
    ships with apps like Firefox, LibreOffice, Thunderbird, Transmission, Pidgin,
    and the Synaptic Package Manager installed by default.


    For more information about the latest release of SpiralLinux, make sure to visit
    the official release notes (https://github.com/SpiralLinux/SpiralLinux-project/releases).


    ![](img/b40e8bf6cf651f8eebf36f5265123095_9_1.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_9_2.png)


    Get the latest news


    in your inbox every


    two weeks


    Subscribe FREE


    to Linux Update


    bit.ly/Linux-Update'
