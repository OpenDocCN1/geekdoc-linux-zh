    \n`.image` 调用可选地接受高度和宽度参数。如果其中任一参数指定为下划线，则缩放时保持图像的宽高比。`.background` 调用除图像外不接受任何参数。如果你的图像不够大，背景命令将用所述图像的重复图案填充幻灯片。\n\
    \n`.code` 和 `.play` 调用都可以从各自的源码中去除不必要的代码，仅显示所需部分的代码。`-edit` 命令允许你在演示期间对显示的代码进行修改。`.play`\
