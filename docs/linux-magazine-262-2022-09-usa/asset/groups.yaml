    ### Sunshine


    多年来我们审视过的最出色的游戏工具之一是名为 Moonlight 的工具。这是 NVIDIA 游戏串流技术（称为 GameStream）的开源实现，该技术将
    Windows 游戏串流至其瘦客户端 SHIELD 游戏机。Moonlight 客户端消除了对 SHIELD 的需求，可以在几乎任何设备上运行，从树莓派到基于
