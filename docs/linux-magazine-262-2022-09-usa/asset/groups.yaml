    continue the installation in the GUI. You can also write the env parameters to
    a file and then include it by typing:


    ```

    --env-file /path/to/<file>

    ```


    ## Setup


    The setup described here works fine for using Nextcloud on your home network.
    In this simple scenario, all the containers run in a single pod. If you want to
    access the pod from outside your home network, you will need additional containers.
    TLS encryption for security purposes can be implemented via the Traefik proxy,
    using HTTPD, NGINX, or Caddy, among others.


    If you include Podman as a systemd service, you can simplify image updates via
    `podman auto-update [9]` by additionally specifying `label=10.containers.autoupdate=image`
    and using


    ```

    podman generate systemd --new

    ```


    when creating a container. After completing the preliminary work, call Nextcloud
    on your browser on *localhost:8080* and complete the installation there in the
    usual way (Figure 4). The paths to the three most important configuration files
    for Podman can be found in Listing 4.


    **Listing 4: Podman Configuration**


    - `/usr/share/containers/containers.conf`

    - `/etc/containers/containers.conf`

    - `${HOME}/.config/containers/containers.conf`


    ![](img/b40e8bf6cf651f8eebf36f5265123095_52_1.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_53_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_53_1.png)


    As mentioned, you can manage Podman at the command line or via the Cockpit administration
    interface, which you install with the *cockpit-podman*


    ![](img/b40e8bf6cf651f8eebf36f5265123095_54_0.png)


    package. Then call Cockpit on *localhost:9090/podman* in your browser (Figure
    5). The web interface gives you the ability to inspect (Figure 6) and manage (Figure
    7) your images and containers.


    I did not find any drawbacks compared to Docker during testing. Podman’s biggest
    benefit is improved security due to eliminating the need to be root. In addition,
    simple administration through integration with Cockpit is a plus. Podman is well
    on its way to replacing Docker, although there are still some teething issues
    to be aware of, especially when you are working with remote machines. The simple
    introduction described here is a good starting place if you are looking to expand
    your own container skills. ■■■


    ## Conclusions


    The Podman man page [10] offers a useful initial overview of Podman’s features,
    while the Podman website [1] provides a variety of references for further research.
    In my opinion, you can learn the Podman basics more quickly than Docker. If you
    already have experience with Docker, you will certainly find the transition to
    Podman easy. To jog muscle memory in this case, enter


    ```

    alias docker=''podman''

    ```


    in your .bashrc to continue using Docker commands such as pull, push, build, commit,
    tag, and more.


