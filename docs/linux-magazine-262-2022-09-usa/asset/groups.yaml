    ## 使用 Manuskrript 和雪花法构思小说

    ### 规划你的史诗

    ### Manuskrript 编辑器是你快速启动下一个写作项目所需的一切。


    文 / 马可·菲奥雷蒂 (Marco Fioretti)


    你是否曾想写一部小说、一篇论文，或任何比学校报告更复杂的东西？在本教程中，我解释了一种高效组织写作项目的技术：雪花法。我还会向你介绍 Manuskrript
    [1]，这是一款多平台开源工具，可用于实施你自己写作工作的雪花法，它是为此量身定制的。Manuskrript 的目标是帮助作家“创建初稿，然后进一步完善和编辑他们的杰作。”


    由 Randy Ingermanson 创建的雪花法，介于遵循完整的传统大纲和“自由写作”（即故意没有任何计划地写作，这可以促进发现但有时也非常低效）之间。


    关于雪花法的细节和提示可以在网上找到 [2] [3]，但概念非常


    ![](img/b40e8bf6cf651f8eebf36f5265123095_89_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_89_1.png)


    简单：从一个非常基本的情节摘要开始，以圆形、递增的方式添加小元素，就像冰粒相互附着形成复杂的雪花一样。换句话说，首先写下书的基本想法，然后是主要角色（或角色们），接着是背景设定——每个条目只用一句话。


    然后你回到描述中，将其转化为三个非常短的段落，概述故事的开头、中间和结尾。接下来，你为每个主要角色写同样简短的描述，或者添加次要角色，然后以同样的方式扩展背景设定的描述，为每个描述添加细节，直到你拥有实际写出故事所需的一切。


    ### 安装


    截至 2022 年 5 月，Manuskrript 仍处于广泛开发阶段，其网站官方建议用户“创建频繁的备份，以最小化因软件错误、断电或硬件故障导致的数据丢失。”


    安装很简单。在基于 Ubuntu 和 Debian 的系统上，你可以下载 .deb 格式的二进制软件包，然后从文件管理器安装，或者在最坏的情况下，从 shell
    提示符通过以下命令安装：


    ```bash

    sudo apt update

    sudo dpkg -i manuskript-0.13.1-1.deb

    ```


    也有 .rpm、Flatpak 和 Snap 格式的软件包，以及非 Linux 系统的安装程序。


    ### 主要功能和流程


    除非你告诉 Manuskrript 总是重新打开你最后工作的项目，否则你启动它时看到的第一个弹出窗口是图 1 中所示的窗口，你可以从中为虚构和非虚构作品选择多种模板。之后，你需要配置书籍的结构，并可选地配置每个部分的目标字数，如图
    2 所示。当然，你可以随时根据需要添加或删除章节。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_0.png)


    图 3：输入图书馆编目你的作品所需的数据。


    图 3 到图 8 中的左侧工具栏展示了 Manuskrript 为何以及如何成为应用雪花法的完美工具：该工具栏顶部的六个按钮中的每一个都打开一个面板，该面板要么对应该工作流的某个方面，要么完成它。从上到下，按钮分别是：通用（信息和元数据）、摘要、角色、情节（及支线）、世界（即背景和大纲）、大纲和编辑器。


    通过输入并逐步完善这些面板支持的所有数据，你可以在写作前为自己组织、规划并记录一切，从情节反转到每个角色的外貌、动机和背景历史，以及她生活的整个社会。即使在你开始写作后，你随时可以扩展或更新
    Manuskrript 为每个写作项目创建的这个“数据库”的任何部分。


    ### 实际示例


    为了展示 Manuskrript 的工作示例，我将假装自己是 J.R.R. 托尔金，使用 Manuskrript 重写《魔戒》（*The Lord of the
    Rings*，简称 LoTR）。我将向你展示如何通过将 LoTR 的相关数据或文本片段输入 Manuskrript 来创建和组织复杂的故事。我将从维基百科、LoTR
    粉丝维基 [4] 获取信息，当我只需要填充内容时，则从 LoTR 主题随机文本 LoRem Ipsum [5] 中获取。


    Manuskrript 左侧工具栏中的*通用*按钮（最顶部的按钮）用于图 3 中显示的基本自描述元数据。图 3 中另一件值得注意的是右侧工具栏。从那里，你可以打开
    Manuskrript 的搜索功能，隐藏或显示左侧（*导航*）工具栏，并根据你所在的面板激活其他辅助功能。


    *摘要*面板（图 4）完全对应雪花法的第一步：写下你的故事是关于什么的，先用一句话，然后逐渐扩展它。然后 Manuskrript 可以在你写作时随时快速向你显示该摘要。


    *角色*面板在图 5 中仅部分可见，可能包含你可能需要的所有章节，甚至更多：你可以按重要性对角色进行排序；使用右上角可见的彩色可自定义标签对其分类；并以有序的方式归档使它们“真实”的一切，从性格到背景。


    *情节*面板（图 6）可能是最重要的部分，至少对于复杂小说而言。它允许定义许多重叠的故事线，每条线都有其自身的描述、预期结局、涉及的角色和解决步骤。还要注意，当此面板打开时，右侧工具栏包含一个按钮以打开*书籍摘要*。*书籍摘要*允许你并排查看你的摘要和情节线，并验证它们是否仍然匹配。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_1.png)


    图 4：雪花法的第一步：用一句话描述你的故事！


    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_2.png)


    图 5：*角色*面板允许你构建故事中所有角色的完整个人资料。


