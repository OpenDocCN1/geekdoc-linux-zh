    # LINUX MAGAZINE


    SEPTEMBER 2022


    # ON THE COVER


    26 Ubuntu 22.04 LTS

    “Jammey Jellyfish” arrives with a new kernel, a new Gnome 42 desktop, and new
    features for enhanced container support.


    30 Open Source Social Media Tools

    The data-peddling giants aren''t the only option for chat and microblogging. We
    review some free and decentralized social media tools.


    66 FLUX Beamo

    Laser cutters like Beamo occupy a much loved but little known corner of the maker
    universe.


    72 Home Assistant

    The MQTT protocol supports do-it-yourself home automation the open source way
    – without Alexa listening in.


    79 Presentation as Code

    The versatile Go language is good for all kinds of projects, including creating
    a code-from-scratch slide deck presentation.


    90 Manuskrift

    Every novelist needs a roadmap, but too much detail can be stifling. Manuskrift
    and the snowflake method help you stay loose but keep it organized.


    # NEWS


    +   08 News

    +   - Rocky Linux 9 Has Arrived

    +   - Slimbook Upgrades CPUs in Executive Linux Ultrabook

    +   - Fedora Linux Is Coming to the Raspberry Pi 4

    +   - KaOS 2022.06 Now Available with KDE Plasma 5.25

    +   - Manjaro 21.3.0 Now Available

    +   - Spiralinux: a New Linux Distribution Focused on Simplicity


    +   12 Kernel News

    +   - Random Number Sanity

    +   - Git Lesson from Linus

    +   - When Word Has Not Yet Gone Round


    # REVIEWs


    22 Distro Walk – MX Linux

    MX Linux is fast, friendly, and focused on function.


    26 Ubuntu 22.04 LTS

    Ubuntu 22.04 LTS features an updated Linux kernel, numerous programming language
    updates, and improved virtualization and container tools, making it useful for
    developers and admins.


    30 Open Source Social Media Tools

    Diaspora, Friendica, and Mastodon are free and decentralized microblogging platforms
    that keep you in control of your data.


    # COVER STORY


    16 Open RAN

    Open RAN brings a new spirit of openness to the radio access networks that form
    the foundation for the mobile revolution.


    # IN-DEPTH


    36 Bash Web Scraping

    With one line of Bash code, Petee scrapes the web and builds a desktop notification
    app to get the daily snow report.


    40 Command Line – Homebrew

    Homebrew, a comprehensive package manager, has been increasing in popularity thanks
    to its ease of use.


    44 DIY Web Server

    If you want to learn a little bit more about the communication between a web browser
    and an HTTP server, why not build your own web server and take a closer look.


    50 Podman

    Podman gives users a quick and easy way to set up a Nextcloud instance for home
    use.


    4 SEPTEMBER 2022 ISSUE 262 LINUX-MAGAZINE.COM I LINUXPROMAGAZINE.COM'
