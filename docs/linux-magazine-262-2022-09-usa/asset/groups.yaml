    26   rows, err := stmt.Query()\n27   panicOnErr(err)\n28\n29   var d clusters.Observations\n\
    30   lookup := map[string]Photo{}\n31\n32   keyfmt := func(lat, lng float64) string\
    \ {\n33     return fmt.Sprintf(\"%f-%f\", lat, lng)\n34   }\n35\n36   for rows.Next()\
