    # COVER STORY


    # Open RAN


    third-party cloud (such as AWS or Azure) or in a data center of the operator.
    And some of it may be distributed all over the coverage area of the operator,
    near where the RUs and users are located, in what is called the "network edge."
    Thanks to virtualization, all of this infrastructure is available to all the functions
    of the RAN. Virtual functions can be moved flexibly between the central infrastructure
    and the network edge to reduce latency or to harmonize the usage of computing
    resources.


    Undoubtedly, as was the case with the core network, Open Source is bound to play
    a major role in future networks. Open interfaces open the RAN market for small
    enterprises or even the Open Source community, and thanks to the ease of just
    using off-the-shelf hardware that is easily accessible, anyone with the required
    knowledge, some documentation, and, of course, lots of time can start developing
    functions. This work would also not need to be started from scratch, as you will
    see in the next section.


    # Radio Aspects


    Probably the first thing that comes to mind when talking about a mobile network
    is the radio technology that makes it possible. These functions are all contained
    in the PHY layer and are some of the most specialized parts of the network that
    require their own hardware. For digital radio transmission, we start with a baseband
    signal (Figure 6), which is made up of one or several electric signals that represent
    digital bits. The spectrum of this signal (its Fourier transform) is centered
    around 0 Hz and has a limited bandwidth. You can then modulate this signal, i.e.,
    transform it such that its central frequency is at a specific given frequency.
    You can also modulate several different streams of bits in adjacent frequencies,
    which is called Frequency Division Multiple Access (FDMA). Each of these channels
    (also known as subcarriers) is dedicated to different users or data streams in
    different times (Transmission Time Intervals or TTI), a scheme that is called
    Time Division Multiple Access (TDMA). In mobile networks, Orthogonal FDMA (OFDMA,
    an improved version of basic FDMA) groups a set of several subcarriers into a
    carrier. The OFDMA subcarriers and TTIs define what is called the resource grid
    (Figure 6), in which each element has a defined logical function.


    # Open RAN Implementations


    The O-RAN Alliance [3] was created to standardize the interfaces of an Open RAN
    implementation. The alliance is a consortium made up of large corporations, small
    and medium enterprises, universities, and research centers. Among them are open
    source vendors such as Red Hat and SUSE. The O-RAN Alliance regularly releases
    open specifications that anyone can access. These specifications define how the
    different elements of an Open RAN (as shown in Figure 4) should behave, including
    the protocols used in the interfaces and other elements.


    The alliance has also set up a partnership with the Linux Foundation, called the
    O-RAN Alliance Software Community, to create an open source software implementation
    of these specifications, which anyone can be able to downloaded and test, and
    to which any developer can contribute. The alliance is still in an early development
    stage. Some elements are already working, and some proof-of-concepts are at a
    showcase stage. Some other elements, such as the RU, are still missing.


    The Telecom Infra Project (TIP) [4] is another partnership of large enterprises
    of the sector that initially was created for defining another Open RAN specification,
    but it soon adopted the design of the O-RAN Alliance and promoted its own software
    implementation: OpenRAN (note that in this case there is no space between Open
    and RAN). TIP works actively in creating implementations of Open RAN elements,
    including some radio interface designs (such as a full WiFi stack), and also


