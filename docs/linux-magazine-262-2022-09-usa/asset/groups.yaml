    包。然后在浏览器中访问 *localhost:9090/podman* 调用 Cockpit（图 5）。Web 界面允许您查看（图 6）和管理（图 7）您的镜像和容器。


    在测试过程中，我没有发现相比 Docker 有任何缺点。Podman 的最大优势在于，由于无需 root 权限，从而提高了安全性。此外，通过与 Cockpit
    集成进行简单管理也是一个加分项。Podman 正在取代 Docker 的道路上稳步推进，尽管仍有一些初期问题需要注意，特别是在与远程机器配合使用时。这里描述的简单入门是扩展您容器技能的良好起点。
