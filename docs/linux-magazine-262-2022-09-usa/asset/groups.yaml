  md: "\n## Building Slide Presentations with present\n### Presentation as Code\n\n\
    **The Golang package `present` may be the key to making attractive slide presentations\
    \ with less work and hassle.** BY ANKUR KUMAR\n\nCreating slide presentations\
    \ has been a necessary part of technical life for a long time, but creating crisp\
    \ and beautiful slides using the popular traditional tools requires a lot of tedious\
    \ work. I have always been intrigued by the elegant presentations in Golang community\
    \ talks, but there was no clear-cut information available on how those beautiful\
    \ presentations were rendered. In researching, I stumbled upon a Golang package\
    \ named, not surprisingly, `present` [1], which renders amazing presentation slides\
    \ from markup text descriptions. For many years now, `present` has been my go-to\
    \ tool for creating and delivering impressive presentations.\n\nTo create a Docker\
    \ image from which you can launch `present`, use the following command:\n\n```bash\n\
    docker build . -t present\n```\n\nYou can also launch the `present` container\
    \ to serve your slides from a bind-mounted directory (e.g., files in your current\
    \ directory), by executing the command:\n\n```bash\ndocker run -d --rm -v $(PWD)/files:/src/files:ro\
    \ -p 58888:8888 present\n```\n\nNow open your web browser and access `localhost:58888`\
    \ to ensure everything is running to deliver your presentation. Figure 1 shows\
    \ the *present* container accessed by its localhost endpoint in my browser. Don't\
    \ be confused about it not showing a presentation – I'll create the presentation\
    \ next.\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_78_0.png)\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_78_1.png)\n\
    \n## Getting Started\n\nThere is no separate installation step needed to start\
    \ using the `present` utility. It’s just a statically linked binary that is grab-and-run;\
    \ there’s no need to set up any other runtime dependencies. You do need the Golang\
    \ compilation toolchain already set up on your machine if you want to run the\
    \ `present` command natively. Alternatively, you can run `present` out of the\
    \ box, provided Docker Engine is installed on your machine (which is very common\
    \ nowadays). I personally took the Docker route to use `present` without doing\
    \ any extra work. You can use the Dockerfile (Listing 1) and script (Listing 2)\
    \ to fetch and run `present` to display your slides on your local machine.\n\n\
    ### Listing 1: Dockerfile\n\n```bash\n01 FROM golang:alpine\n02\n03 RUN apk add\
    \ --no-cache git \\\n04     && go get golang.org/x/tools/cmd/present\n05\n06 COPY\
    \ run.sh /usr/local/bin/\n07\n08 ENTRYPOINT [\"run.sh\"]\n09 CMD [\"-notes\"]\n\
    ```\n\n### Listing 2: run.sh\n\n```bash\n01 #! /bin/sh\n02\n03 PORT=${PORT_PRESENT:-8888}\n\
    04\n05 exec present -http \"0.0.0.0:${PORT}\" -content /src/files \"$@\"\n```\n\
    \n## Slides Basics\n\nNow it's time to dirty your hands with *present*'s slides\
    \ description language. The preferred way to craft your slides is using the CommonMark\
    \ markup language [2]. (You can also use legacy syntax [1] to describe your slides,\
    \ but that's not discussed here.) To start, create a file named *mytest\\_s1.md*\
    \ (Listing 3) in the bind-mounted */files* directory.\n\nNow refresh your *present*\
    \ endpoint browser page, and the newly created slide file link should appear (Figure\
    \ 2).\n\nIf you click *mytest\\_slide* now, you'll see an elegant three-slide\
    \ presentation (the first and last slides are shown in Figures 3 and 4). Congratulations,\
    \ you have created a presentation – without the frustration of dragging and dropping\
    \ and the impossible formatting in a slide creation tool. You can move between\
    \ the slides using the left and right arrow keys and also create a PDF using the\
    \ Ctrl+P print dialog.\n\nThe slide description starts with a header block with\
    \ the presentation topic prefixed with *#* and a space. Optionally, you could\
    \ put other metadata such as a subtitle, date, tags, summary, and old URL lines\
    \ after the *#*. An optional author block follows the header section, with at\
    \ least a space in between them. The author block can contain your name, title,\
    \ email, URL, twitter handle, etc. *present* automatically renders the last slide\
    \ with the author block (Figure 4). It only puts author info that is not an email,\
    \ URL, or twitter handle on the first slide (Figure 3). You could have multiple\
    \ author blocks, each separated with at least a space between them. Any line starting\
    \ with *//* is treated as a comment.\n\nThe presentation slide sections follow\
    \ the author blocks. A slide section starts with *###* followed by at least one\
    \ space. Each slide could have a subsection too, starting with *####* and followed\
    \ by at least one space. The content of a slide is governed by CommonMark to format\
    \ text.\n\n+ Listing 3: mytest.slide\n\n```markdown\n01 # My Test Presentation\n\
    02\n03 Free Libre Open Source Software Hacker\n04 A FLOSS Hacker, FLOSS Universe\n\
    05 flosshacker@flossuniverse.com\n06 https://url/\n07 @flosshacker\n08\n09 ##\
    \ TBD\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_79_0.png)\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_79_1.png)\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_79_2.png)\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_79_3.png)\n\
    \nTo add more content to the slides, update your `mytest.slide` file with the\
    \ code in Listing 4 and refresh the browser page rendering the presentation.\n\
    \nNow you should see common markup features (bold/italic text, lists, block quotes,\
    \ links, images, horizontal rules, in-line code, etc.) implemented on your slide\
    \ (Figure 5). To learn more about these markup features, see the CommonMark documentation\
    \ [2].\n\nLines starting with a colon are treated as presenter notes. Pressing\
    \ N in the browser showing your presentation opens a separate pop-up window displaying\
    \ the notes (Figure 6).\n\n## More Enriched Slides\n\nIf you want more than text,\
    \ hyperlinks, and logos in your slides, you can use `present` description language\
    \ features to render eye-candy slides. To do this, `present` provides a number\
    \ of special\n\n### Listing 4: mytest.slide Basic Content\n\n```markdown\n01 \
    \ # My Test Presentation\n02\n03  Free Libre Open Source Software Hacker\n04 \
    \ A FLOSS Hacker, FLOSS Universe\n05  flosshacker@flossuniverse.com\n06  https://url/\n\
    07  @flosshacker\n08\n09  ## Free Libre Open Source Software\n10  What is [FLOSS](https://en.wikipedia.org/wiki/Free_and_open-source_software)?\n\
    11  - anyone is freely licensed to use, copy, study, and\n    change the software\
    \ in any way\n12  - the source code is openly shared so that people are\n    encouraged\
    \ to voluntarily improve the design of the\n    software\n13  - Free as in **freedom**,\
    \ not _free beer_\n14\n15  ---\n16  > PSF prefers dangerous freedom over peaceful\
    \ slavery\n17\n18  ![PSF][1]\n19\n20  [1]: http://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Free_Software_Foundation_logo_and_wordmark.svg/260px-Free_Software_Foundation_logo_and_wordmark.svg.png\n\
    21\n22  type this command in your terminal:\n23  ```\n24  python -c 'import this'\n\
    25  ```\n26\n27  : intro slide\n```\n\n### Listing 5: mytest.slide Images and\
    \ Sources Content\n\n```markdown\n01  # My Test Presentation\n02\n03  Free Libre\
    \ Open Source Software Hacker\n04  A FLOSS Hacker, FLOSS Universe\n05  flosshacker@flossuniverse.com\n\
    06  https://url/\n07  @flosshacker\n08\n09  ## Free Libre Open Source Software\n\
    10  What is [FLOSS](https://en.wikipedia.org/wiki/Free_and_open-source_software)?\n\
    11  - anyone is freely licensed to use, copy, study, and\n    change the software\
    \ in any way\n12  - the source code is openly shared so that people are\n    encouraged\
    \ to voluntarily improve the design of the\n    software\n13  - Free as in **freedom**,\
    \ not _free beer_\n14\n15  ---\n16  > PSF prefers dangerous freedom over peaceful\
    \ slavery\n17\n18  ![PSF][1]\n19\n20  [1]: https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Free_Software_Foundation_logo_and_wordmark.svg/260px-Free_Software_Foundation_logo_and_wordmark.svg.png\n\
    21\n22  type this command in your terminal:\n23  ```\n24  python -c 'import this'\n\
    25  ```\n26\n27  : intro slide\n28\n29  ## More FLOSS\n30  ---\n31\n32  .background\
    \ matrix.jpg\n33\n34  .image logoofgorg.png 50 _\n35  .caption PSF Logo\n36\n\
    37  .code -edit -numbers hellofloss.c\n38\n39  .play hellofloss.go\n```\n"
  mdcn: "\n## 使用 present 构建幻灯片演示\n### 代码即演示\n\n**Go 语言包 `present` 或许是制作精美幻灯片演示的关键，它能让你以更少的工作量和麻烦事完成这一任务。**\
    \ 作者：安库尔·库马尔 (ANKUR KUMAR)\n\n制作幻灯片演示长期以来一直是技术生活的必要组成部分，但使用流行的传统工具制作简洁美观的幻灯片需要大量的繁琐工作。我一直对\
    \ Go 社区演讲中那些优雅的演示印象很深，但当时并没有明确的资料说明那些精美的演示是如何渲染出来的。在研究过程中，我偶然发现了一个名为 `present`\
    \ [1] 的 Go 包（不出所料，它就叫 present），它可以标记文本描述来渲染惊艳的演示幻灯片。多年来，`present` 一直是我创建和交付令人印象深刻的演示的首选工具。\n\
    \n要创建一个可以启动 `present` 的 Docker 镜像，请使用以下命令：\n\n```bash\ndocker build . -t present\n\
    ```\n\n你还可以通过执行以下命令启动 `present` 容器，从绑定挂载的目录（例如，你当前目录中的文件）提供你的幻灯片：\n\n```bash\n\
    docker run -d --rm -v $(PWD)/files:/src/files:ro -p 58888:8888 present\n```\n\n\
    现在打开你的 web 浏览器并访问 `localhost:58888`，以确保一切正常运行以便交付你的演示。图 1 显示了我的浏览器通过本地端点访问 *present*\
    \ 容器。不要被它没有显示演示而感到困惑——我接下来将创建演示。\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_78_0.png)\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_78_1.png)\n\n## 入门\n\n开始使用 `present`\
    \ 工具时，不需要单独的安装步骤。它只是一个静态链接的二进制文件，即取即用；你不需要设置任何其他运行时依赖项。如果你想本地运行 `present` 命令，你需要在机器上已经设置好\
    \ Go 编译工具链。或者，如果你的机器上安装了 Docker Engine（这在当今非常常见），你可以开箱即用地运行 `present`。我个人选择通过\
    \ Docker 路径来使用 `present`，无需做任何额外的工作。你可以使用 Dockerfile（列表 1）和脚本（列表 2）来获取并运行 `present`，在你的本地机器上显示你的幻灯片。\n\
    \n### 列表 1: Dockerfile\n\n```bash\n01 FROM golang:alpine\n02\n03 RUN apk add --no-cache\
    \ git \\\n04     && go get golang.org/x/tools/cmd/present\n05\n06 COPY run.sh\
    \ /usr/local/bin/\n07\n08 ENTRYPOINT [\"run.sh\"]\n09 CMD [\"-notes\"]\n```\n\n\
    ### 列表 2: run.sh\n\n```bash\n01 #! /bin/sh\n02\n03 PORT=${PORT_PRESENT:-8888}\n\
    04\n05 exec present -http \"0.0.0.0:${PORT}\" -content /src/files \"$@\"\n```\n\
    \n## 幻灯片基础\n\n现在是时候亲手使用 *present* 的幻灯片描述语言了。制作幻灯片的推荐方式是使用 CommonMark 标记语言 [2]。（你也可以使用旧语法\
    \ [1] 来描述你的幻灯片，但这里不讨论这一点。）首先，在绑定挂载的 */files* 目录中创建一个名为 *mytest\\_s1.md* 的文件（列表\
    \ 3）。\n\n现在刷新你的 *present* 端点的浏览器页面，新创建的幻灯片文件链接应该会显示出来（图 2）。\n\n如果你现在点击 *mytest\\\
    _slide*，你会看到一个优雅的三页演示（第一页和最后一页分别显示在图 3 和图 4 中）。恭喜，你创建了一个演示——没有拖放带来的挫败感，也没有幻灯片创建工具中不可能的格式化问题。你可以使用左箭头和右箭头键在幻灯片之间移动，也可以使用\
    \ Ctrl+P 打印对话框创建 PDF。\n\n幻灯片描述以一个标题块开始，演示主题前缀为 *#* 和一个空格。可选地，你可以在 *#* 后面放置其他元数据，例如副标题、日期、标签、摘要和旧\
    \ URL 行。可选的作者块跟在标题部分之后，它们之间至少有一个空格。作者块可以包含你的姓名、职位、电子邮件、URL、推特账号等。*present* 自动渲染带有作者块的最后一张幻灯片（图\
    \ 4）。它只将不是电子邮件、URL 或推特账号的作者信息放在第一张幻灯片上（图 3）。你可以有多个作者块，每个块之间至少用一个空格分隔。任何以 *//*\
    \ 开头的行都被视为注释。\n\n演示幻灯片部分跟在作者块之后。一个幻灯片部分以 *###* 开头，后跟至少一个空格。每个幻灯片也可以有一个小节，以 *####*\
    \ 开头，后跟至少一个空格。幻灯片的内容由 CommonMark 管理以格式化文本。\n\n+ 列表 3: mytest.slide\n\n```markdown\n\
    01 # My Test Presentation\n02\n03 Free Libre Open Source Software Hacker\n04 A\
    \ FLOSS Hacker, FLOSS Universe\n05 flosshacker@flossuniverse.com\n06 https://url/\n\
    07 @flosshacker\n08\n09 ## TBD\n```\n\n![](img/b40e8bf6cf65123095_79_0.png)\n\n\
    ![](img/b40e8bf6cf65123095_79_1.png)\n\n![](img/b40e8bf6cf65123095_79_2.png)\n\
    \n![](img/b40e8bf6cf65123095_79_3.png)\n\n要为幻灯片添加更多内容，请使用列表 4 中的代码更新你的 `mytest.slide`\
    \ 文件，并刷新渲染演示的浏览器页面。\n\n现在你应该看到通用的标记功能（粗体/斜体文本、列表、引用块、链接、图片、水平线、行内代码等）在你的幻灯片上实现（图\
    \ 5）。要了解有关这些标记功能的更多信息，请参阅 CommonMark 文档 [2]。\n\n以冒号开头的行被视为主讲人备注。在显示你演示的浏览器中按 N\
    \ 键会打开一个单独的弹出窗口显示备注（图 6）。\n\n## 更丰富的幻灯片\n\n如果你希望在幻灯片中包含超过文本、超链接和标志的内容，你可以使用 `present`\
    \ 描述语言功能来渲染引人注目的幻灯片。为此，`present` 提供了许多特殊的\n\n### 列表 4: mytest.slide 基本内容\n\n```markdown\n\
    01  # My Test Presentation\n02\n03  Free Libre Open Source Software Hacker\n04\
    \  A FLOSS Hacker, FLOSS Universe\n05  flosshacker@flossuniverse.com\n06  https://url/\n\
    07  @flosshacker\n08\n09  ## Free Libre Open Source Software\n10  What is [FLOSS](https://en.wikipedia.org/wiki/Free_and_open-source_software)?\n\
    11  - anyone is freely licensed to use, copy, study, and\n    change the software\
    \ in any way\n12  - the source code is openly shared so that people are\n    encouraged\
    \ to voluntarily improve the design of the\n    software\n13  - Free as in **freedom**,\
    \ not _free beer_\n14\n15  ---\n16  > PSF prefers dangerous freedom over peaceful\
    \ slavery\n17\n18  ![PSF][1]\n19\n20  [1]: http://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Free_Software_Foundation_logo_and_wordmark.svg/260px-Free_Software_Foundation_logo_and_wordmark.svg.png\n\
    21\n22  type this command in your terminal:\n23  ```\n24  python -c 'import this'\n\
    25  ```\n26\n27  : intro slide\n```\n\n### 列表 5: mytest.slide 图像和源代码内容\n\n```markdown\n\
    01  # My Test Presentation\n02\n03  Free Libre Open Source Software Hacker\n04\
    \  A FLOSS Hacker, FLOSS Universe\n05  flosshacker@flossuniverse.com\n06  https://url/\n\
