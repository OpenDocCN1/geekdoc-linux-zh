    # 开放故事


    ## 开放 RAN


    ### 参考模型


    图 5 展示了 5G 网络的参考模型。其三个主要元素分别是终端、gNodeB 和核心网。终端可以是智能手机、IoT 系统、笔记本电脑或任何类似设备。gNodeB
    相当于以太网中的交换机，工作在 IP 层之下。核心网则相当于 ISP 网络。从下至上，参考模型的各层为：


    - 物理层（PHY）：处理通信的所有无线方面，如调制和解调。有关这些术语的定义，请参阅“无线方面”框。

    - 媒体访问控制（MAC）：在 PHY 信道（由时间和频率定义）之上定义逻辑信道。同时也执行错误校正。

    - 无线链路控制（RLC）：在 MAC 之上为上层提供数据传输服务，具备错误恢复、分段与重组功能，并在需要时重建无线链路。

    - 分组数据汇聚协议（PDCP）：通过一个或多个 RLC 实体提供与更高层的接口。这使得多连接成为可能，即在 RLC 层能够连接到多个 gNodeB。此外，通过头部压缩还可以提供一定的吞吐量增益。

    - 服务数据适应协议（SDAP）：提供机制以确保对不同类型数据提供特定的服务质量（QoS）并接收空中接口数据。它被称为“分布式”，因为通常物理部署在 RU
    附近以减少延迟。

    - 中央单元（CU）：包含较高层，即路由用户和控制数据（PDCP 层）以及分配网络资源（如信道和载波，RRC 层）等功能。它通常位于集中位置（因此得名），甚至可以物理运行在与核心网相同的计算机上。


    图 4 中展示的另一元素是 RAN 智能控制器（RIC），其中包含控制 RAN 元素整体操作的功能。RIC 包括资源优化、监控等功能，甚至包括必须非常靠近终端的终端用户服务。RIC
    进一步分为实时 RIC（针对需要快速反应时间的某些低层功能）和非实时 RIC（具有较长周期功能的控制）。在 6G 中，该元素将包含基于机器学习的解决方案，持续监控网络，通过强化学习进行学习，并改善服务质量。


    除了 RU 之外，所有其他组件都是软件组件，可以在任何满足最低 CPU、内存和存储需求的计算机上运行。这种对通用硬件的支持意味着 RAN 制造商和运营商的成本将大幅降低。


    因此，RAN 可以被认为是一个包含云实例和现成计算机的网络，其中一些配备有 SDR 设备。部分基础设施是集中的，位于第三方云（如 AWS 或 Azure）或运营商的数据中心中。另一部分则可能分布式地部署在运营商覆盖范围内的各处，靠近
    RU 和用户所在的位置，即所谓的“网络边缘”。得益于虚拟化，所有这些基础设施都可服务于 RAN 的所有功能。虚拟功能可以在中央基础设施和网络边缘之间灵活移动，以减少延迟或协调计算资源的使用。


    毫无疑问，正如核心网的情况一样，开源将在未来网络中发挥重要作用。开放接口为小型企业甚至开源社区打开了 RAN 市场的大门，而且由于使用现成硬件的便捷性，任何具备相关知识、文档以及大量时间的人都可以开始开发功能。正如下一节所示，这项工作也不需要从零开始。


    ### 无线方面


    提到移动网络时，脑海中浮现的第一个概念可能是使其成为可能的无线技术。这些功能全部包含在 PHY 层中，是网络中最专业化的部分之一，需要专门的硬件。对于数字无线电传输，我们从基带信号开始（见图
    6），该信号由一个或多个表示数字比特位的电信号组成。该信号的频谱（其傅里叶变换）以 0 Hz 为中心，且带宽有限。然后可以对该信号进行调制，即将其变换为中心频率位于特定给定频率的状态。也可以在相邻频率上对多路不同的比特流进行调制，这被称为频分多址（FDMA）。这些信道中的每一个（也称为子载波）在不同时间（传输时间区间或
    TTI）中专用于不同的用户或数据流，这种方案被称为时分多址（TDMA）。在移动网络中，正交 FDMA（OFDMA，基本 FDMA 的改进版本）将一组子载波组合成一个载波。OFDMA
    子载波和 TTI 定义了所谓的资源网格（见图 6），其中每个元素都具有定义好的逻辑功能。


    ### 开放 RAN 实现


    O-RAN 联盟 [3] 成立旨在标准化开放 RAN 实现的接口。该联盟是一个由大型公司、中小企业、大学和研究中心组成的联合体。成员包括红帽（Red Hat）和
    SUSE 等开源供应商。O-RAN 联盟定期发布任何人都可以访问的开放规范。这些规范定义了开放 RAN 的不同元素（如图 4 所示）的行为方式，包括接口中使用的协议和其他元素。


    该联盟还与 Linux 基金会建立了伙伴关系，称为 O-RAN 联盟软件社区，旨在创建这些规范的开源软件实现，任何人可以下载并测试，任何开发人员都可以为此做出贡献。该联盟仍处于早期开发阶段。一些元素已经可以工作，一些概念验证处于展示阶段。其他一些元素，如
    RU，仍然缺失。


    电信基础设施项目（TIP）[4] 是该行业大型企业的另一伙伴关系，最初创建是为了定义另一种开放 RAN 规范，但很快采纳了 O-RAN 联盟的设计并推广了其自身的软件实现：OpenRAN（注意在这种情况下
    Open 和 RAN 之间没有空格）。TIP 积极致力于创建开放 RAN 元素的实现，包括一些无线电接口设计（如完整的 WiFi 堆栈），并且


    ![](img/b40e8bf6cf651f8eebf36f5265123095_19_0.png)


    图 6：5G 中由 TDMA 和 OFDMA 产生的调制/解调过程及资源网格。


