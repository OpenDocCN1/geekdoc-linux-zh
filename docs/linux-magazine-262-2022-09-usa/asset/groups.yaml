    ## MEPIS 和 antiX 合二为一：MX Linux


    **MX Linux 快速、友好，且专注于功能。** 作者：**Bruce Byfield**


    MX Linux 是 MEPIS 和 antiX 的合作产物，这两个名称的首字母构成了其名称 [1]。AntiX 是一个流行的轻量级发行版，而 MEPIS
    曾经扮演着类似今天的 Ubuntu 或 Linux Mint 的角色，即在桌面端为 Debian 增加易用性。虽然 MX Linux 是一个相对较新的发行版，但它通过结合其祖先后者的优点，在数百个其他发行版中脱颖而出，提供了
    antiX 的速度和 MEPIS 桌面工具的用户友好性。


    MX Linux 的旗舰版本搭载 Xfce，并针对较旧的计算机以及 32 位和 64 位机器提供了变体。KDE Plasma 和 Fluxbox 也有 32
    位和 64 位版本，为用户提供了中等重量、重量型和轻量型版本，以及专为管理员和 Raspberry Pi 设计的版本。安装程序遵循常规步骤，但值得注意的窗口中嵌入了详细的帮助，不仅解释了当前的选项，还解释了必要时如何使用界面——这种详尽程度在安装程序中并不常见（图
    1）。同样，MX Linux 首先启动到一个欢迎屏幕，突出显示主要系统工具，并提供链接以进行 tours、视频、论坛、FAQ 和用户手册，所有这些都为探索桌面环境提供了有用的起点（图
    2）。对于更高级的用户，“关于”选项卡提供了系统硬件、分区、启动模式和活动软件源的摘要。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_21_0.png)


