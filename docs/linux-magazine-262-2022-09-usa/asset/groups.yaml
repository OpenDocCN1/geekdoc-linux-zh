    ![](img/b40e8bf6cf651f8eebf36f5265123095_68_1.png)


    图 8：对原画进行描摹后，它根本无法适应激光切割机 SVG 文件中的 DIN A4 尺寸空间。


    向下并绘制了你在图 6 中看到的图像。


    如果你仔细观察这张图，你可能会疑惑智者（Three Kings）的手臂和腿去哪里了。


    这里的想法是，如果你想保持某些部分的对称性，你只需绘制一次并扫描。接下来，你在 Inkscape 中加载扫描件，描摹绘图以创建矢量图，然后复制并粘贴该对象。正如你可以从
    Christa 的笔记中看到的那样，尽管国王们的躯干每人只需要一个，但我们需要六条手臂和两条每种型号的腿。如果你不擅长绘画，别担心，网上有很多可免费使用的草图供你下载，并可以按照与我们将要遵循的类似步骤进行处理。


    关于将位图（如 PNG 文件）转换为激光切割所用的矢量格式（Inkscape 中的 SVG）有两种观点。一种方法是选择“路径 | 描摹位图”并让算法遵循原画的轮廓。另一种是将原画作为模板，自己手动进行描摹工作。虽然自动描摹似乎更简单，但它很可能会给你一个拥有大量节点的非常复杂的矢量图。尽管选择“路径
    | 简化”以减少节点数量，但后处理可能需要比手动方法更长的时间。简化的结果并不总是你所期望的，并且可能会出现一些伪影。但这需要你亲自尝试，而决定将始终由描摹结果驱动。


    如果你决定尝试手动描摹（图 7），步骤如下：首先，在 Inkscape 窗口左侧的工具栏中选择“绘制贝塞尔曲线和直线”工具。


    点击一个起始点，并拖动一条线到你要描摹的对象的下一个点。再次点击，再次拖动，并不断重复，直到你描摹完整个对象。完成后，你肯定需要选择“通过节点编辑路径”，并通过点击节点和拖动
    Inkscape 显示的手柄来整理曲线和直线。一旦你拥有该对象的矢量副本，你可以删除原始手绘对象，但务必保留一个备份副本，以防你删除了错误的对象——这种情况很容易发生。


    在对一条手臂进行描摹后，我们选择该对象，右键点击，选择“复制”，然后点击我们要放置副本的新位置。接下来只需要不断粘贴，直到我们拥有正确数量的对象为止。这假设木材没有“好”的一面和“坏”的一面，并且你可以使用镜像对称的毛坯。当然，我们不得不对腿组再次进行此操作。


    在转换原画后的第一次尝试中，在确保我们拥有正确数量的手臂和腿后，我们空间不足了。如果你看图 8，你会发现与其他图像相比，骆驼太小了，而且国王的手臂看起来有点细弱。由于
    FLUX Beamo 的激光切割空间大约是一张 A4 纸的大小，我们最终别无选择，只能将绘图拆分到两张 A4 胶合板上。这给我们提供了更大的国王、更大的骆驼以及更坚固的手臂，这些手臂在组装和装饰过程中不太容易断裂。图
    9 展示了其中一幅图像，包含骆驼和各种（国王的和非国王的）腿部。


    下一步操作对于使用 FLUX Beamo 标志的测试任务来说应该是熟悉的。在激光工作区的网格上放一张胶合板。检查激光头的设置——只有当本次任务使用的木材类型与测试任务不同时，你才需要这样做。点击“相机”图标并在整个工作区拖动，以查明木材的位置。请注意，工作区顶部有一个盲区，相机看不到，但激光头仍可达到。将
    SVG 矢量图居中于激光工作区，确保其整齐地适应在木板上。然后检查你的激光功率、速度和对数设置。我们发现杨木胶合板最容易切割，只需一次对数，而比重的桦木需要两次对数。如果你切割的图像在激光围绕其切割完所有部分后从板上掉落，那就说明设置是正确的。如果这种情况没有发生，不要惊慌，只需重新发射任务增加一次对数，但不要移动或更改任何内容（我们不想浪费那些昂贵的木材）。在安全方面，总是很想观看激光工作，但直视激光束的明亮光点对你的眼睛不好。


    ### 制作拼图


    快速看一下图 10，你会看到激光完成工作后的样子。它很漂亮，但这并不是你想要送给朋友或出售给客户以完成其制作的东西。事实上，这是此构建中第二创意部分开始的地方。但首先，有一些小小的准备工作要完成。由于这是一个悬挂


    ![](img/b40e8bf6cf651f8eebf36f5265123095_69_0.png)


    图 10：激光切割后大量毛坯。拼图时间！


    装饰品，细线是连接各部件的好方法。穿线的孔需要在开始装饰之前钻出，并且使用钢丝球清理部件边缘以去除较暗的激光烧灼痕迹是个好主意。再次说明，Christa 在颜色和装饰方面有着敏锐的眼光。她确切地知道她希望她的三位国王（Three
    Kings）看起来像什么（图 11）。你需要用于艺术作品的丙烯酸颜料，这真的取决于你自己的风格和对美学的理解。你需要考虑的一点是，如果你不涂抹两边，薄胶合板上的木制装饰品会变形。如果装饰品悬挂时背面不可见，你可以将背面涂成黑色，或者全力以赴，制作逼真的正面和背面以获得更具吸引力的效果。图
    12 展示了一个完全装饰和组装好的图像，随时可以参加下一个手工艺展或作为独特的礼物。


    ## 激光的更多应用


    使用 FLUX Beamo，你的创造力几乎没有限制。其他二维项目包括激光雕刻


    ![](img/b40e8bf6cf651f8eebf36f5265123095_70_0.png)


    **图 12：** 创意工作第二部分：组装并装饰的激光切割部件。


    橡胶印章并使用它们创作版画艺术作品，或在胶合板、亚克力、石头、骨头或玻璃上雕刻照片。你甚至可以激光雕刻创意图案或文字在你的牛仔裤上以表达时尚态度，或者切割纸板制作有创意的弹出式贺卡。FLUX
    甚至提供了用于雕刻圆柱形物体的扩展套件，例如，如果你想用个性化的香槟杯给朋友惊喜，它可以雕刻直径最大为 80mm 的玻璃。


    开源工具可用于所涉及的任务。当然，仅靠机器是无法指望取代创造原始且吸引人的作品所需的那种艺术才能，这些作品是客户想要购买的。


    # 结论


    正如本次操作指南所演示的，你不需要抢劫银行来拥有一台可靠的激光切割机。得益于 Beam Studio 能够在 Linux 操作系统上运行以及出色的开源工具的存在，你无需担心厂商锁定。


