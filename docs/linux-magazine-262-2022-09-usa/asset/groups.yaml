    \ Linux Magazine 不对因使用此光盘而导致的任何中断、数据或计算机系统损坏负责，也不承担责任。\n\n## 迈出 Web 开发的第一步！\n\n\
    ![](img/b40e8bf6cf651f8eebf36f5265123095_6_0.png)\n\n### Web 开发基础\n\n现代软件应用程序通常针对\
    \ Web 进行开发。Linux 专业学会（LPI）新的 Web 开发基础项目支持你迈出软件开发的第一步。它包含适合培训和自学的学习资料。通过 Web 开发基础考试后，你将获得一份证明你技能的证书。\n\
    \nLPI 学习资料可在 [learning.lpi.org](http://learning.lpi.org) 获取。欲了解该项目和考试的更多信息，请访问\
    \ [lpi.org/wde](http://lpi.org/wde)\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_6_1.png)\n\
    \n## 新闻\n\n技术、趋势和工具的更新\n\n### 本月新闻\n\n-   **08**\n    - Rocky Linux 9 已发布\n  \
    \  - Slimbook 在 Executive Linux 超薄笔记本中升级 CPU\n-   **09**\n    - Fedora Linux 即将登陆\
    \ Raspberry Pi 4\n    - KaOS 2022.06 现已可用，搭载 KDE Plasma 5.25\n    - 更多在线新闻\n-\
    \   **10**\n    - Manjaro 21.3.0 现已可用\n    - SpiralLinux：一个专注于简洁性的新 Linux 发行版\n\
    \n### Rocky Linux 9 已发布\n\nRocky Linux 9 现已可用，并且由于几个原因，它是一个里程碑式的版本。首先，Rocky Linux\
    \ 的部署量激增，使其领先于 CentOS Stream 和 AlmaLinux。但更重要的是，Rocky Linux 包含多项安全增强和网络功能，有助于使其成为适合各规模企业的同类最佳开源操作系统。\n\
    \n在新版本中，你将发现用于加密目的的 SHA-1 消息摘要已被弃用（因为加密哈希函数不再被认为安全）。此外，你将发现 OpenSSL 3.0.1（包含提供程序概念、新的版本方案、改进的\
    \ HTTP/HTTPS 客户端、对新协议/格式/算法的支持等）、OpenSSH 版本 8.7p1（包含用更可预测的 SFTP 协议替代 SCP/RCP 协议）、SELinux\
    \ 性能改进，以及为 PCI-DSS、HIPAA、DISA 等自动配置安全合规设置。\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_7_0.png)\n\
    \n关于网络改进，你将发现 MultiPath TCP Daemon 现在可用于替代 iproute2 来配置 MultiPath TCP 端点。此外，NetworkManager\
    \ 现在使用密钥文件来存储连接配置文件（但仍支持 ifcfg）。Iptables-nft 和 ipset 已被弃用，并被 nftables 框架取代。最后，network-scripts\
    \ 已被移除，转而使用 NetworkManager 来配置网络连接。\n\nRocky Linux 的另一个重大进步是该版本是使用一个名为 Peridot\
    \ 的社区开发的、开源的、云原生系统构建的。这个 Golang 项目旨在确保在每个 RHEL 版本发布后的一周内就能发布新版本的 Rocky Linux。通过迁移到此系统，任何人都可以从零开始重现\
    \ Rocky Linux，从而确保该发行版始终可用。Peridot 构建系统的源代码可在 GitHub（https://github.com/rocky-linux/peridot-release）上找到。\n\
    \n欲了解有关新 Rocky Linux 版本 release 的更多信息，请务必阅读完整的发布说明（https://github.com/rocky-linux/documentation/blob/6d86674106232d3c0ab72da734de6eede4e46549/docs/release_notes/9.0.md）。\n\
    \n### Slimbook 在 Executive Linux 超薄笔记本中升级 CPU\n\nSlimbook 因生产搭载 KDE Plasma 的笔记本电脑而闻名，它通过提供搭载\
    \ Intel 12 代 Alder Lake CPU 的 Executive 系列，对其产品线进行了一点刷新。这次新的迭代显著增加了性能\n"
