    > *作者：Zack Brown*


    ### 随机数合理性


    随机数对安全性至关重要。通常生成随机数的方法是从某处获取熵（entropy），例如手指敲击键盘的频率，并以此生成所需数量的不可预测数字。但如果没有人敲击键盘怎么办？如果熵耗尽了怎么办？系统应该只是坐着等待更多熵吗？


    长期以来，Linux 内核不得不在两种选择之间做出抉择：要么锁定系统直到找到足够的熵来生成真正的随机数，要么无论如何都提供数字，即使它们并不足够随机。


    但在 2019 年，Linus Torvalds 编写了一个补丁，通过“在等待随机数生成器初始化时，利用 CPU 周期计数器主动生成熵噪声”来解决这一问题。“这只在拥有高频时间戳计数器的情况下才能工作，但在所有现代
    x86 CPU 以及大多数其他现代 CPU 上，这种情况都是成立的。”


    由于该补丁的存在，随机数生成器几乎总是拥有足够的熵来产生有用的随机数。最近，Jason A. Donenfeld 认为，是时候让所有人承认它是有效的，克服对新技术的恐惧，并允许
    Linux 随机数生成器在积累熵时进行阻塞。


    这是一个天生具有争议的话题。如果系统等待一个永远不会变得可用的资源，它将永远等待，结果你就拿到了一块“砖头”（死机）。此前曾有多次尝试向随机数生成器引入阻塞机制，但它们在上树后不久就被移除了。


    但 Jason 表示，“鉴于内核已经发展出了一种从虚无中自我播种的机制，且该过程相当快，也许让 /dev/urandom 提供不安全的字节已经没有任何意义了。过去我们不希望引导过程死锁，这是可以理解的。但现在，在最坏的情况下，只会过去一秒，问题就解决了。看来我们终于到了一个可以废除臭名昭著的‘urandom
    读取洞’的阶段。”


    他补充道，“这个补丁在很大程度上消除了一个长期积压的用户空间密码学‘自毁陷阱’。经过几十年的无尽用户困惑后，我们终于可以说：‘使用我们任意一个随机接口都可以。它们都是一样的，无所谓。’我认为，这真的很有意义。最终，所有那些博客文章、持异议的论坛和相互矛盾的文章关于它们所推荐的任何内容都将是正确的，随之而来的是整整一类漏洞被消除。”


    Jason 提到的“自毁陷阱”（footgun）并不是某种晦涩的安全相关攻击向量；它只是俚语，指某件容易让人自己害自己的事情。


    但 Andy Lutomirski 提出了针对 Linux 内核补丁几乎最强烈的反对意见——声称它违反了应用程序二进制接口（ABI）——同时他对整个议题提供了一些历史视角。他说：


    “这个补丁 100% 是关于一个历史错误。在很久以前（其实也没那么久），有两个可用的随机数生成器接口：/dev/random 和 /dev/urandom。/dev/random
    至少在原则上是安全的，但它不必要地阻塞，因此极其缓慢。它完全不适合被任何类型的服务器重复使用。/dev/urandom 不阻塞，但如果调用得太早则不安全。*但是*
    urandom 也是获取‘尽力而为-我现在就需要’随机位的正确接口。通用密码学用户想要的实际语义当时是不可用的。


    “快进到今天。/dev/random 具有密码学目的的正确语义。getrandom() 也具有密码学目的的正确语义，并且作为此类功能是可靠的——它保证要么不存在，要么做正确的事（DTRT）。而尽力而为的用户可以使用
    GRND_INSECURE 或 /dev/urandom。


    “如果我们想象所有我们关心的用户程序在尽力而为时使用 GRND_INSECURE，在密码学使用 /dev/random 或 getrandom()（不带 GRND_INSECURE），那么我们的情况非常好，这个补丁就不相关了。


    “但我们不能依赖这一点。新内核应当与旧用户空间兼容。而对于*旧*用户空间，我们不知道 /dev/urandom 的用户是想要密码学安全的输出还是想要不安全的输出。而且引导期间存在这种‘解旋’（unwind），据称最长持续
    1 秒；这两者之间有巨大差异。所以，抱歉，这个补丁是一个 ABI 破坏。你将在引导后立即将那些想要尽力而为随机性的程序重新解释为想要密码学随机性，这可能会使引导延迟最多
    1 秒，而这就足以被视为一次破坏。


    “因此，如果没有更强的理由和更清晰的兼容性故事，我不喜欢这个补丁。如果你有 `random=***` 选项来切换回旧行为，并且有非常清晰的信息，如‘random:
    %s 启动延迟。如果你不需要在引导期间使用密码学安全的随机数，请设置 random=*** 以加快引导’，那我‘可能’会加入，但我不认为在其他情况下这样做是可以接受的。”


    “或者我们维持现状，并使警告更清晰：''random: %s us 正在使用不安全的随机输出。请修复它以适当使用 getrandom() 或 /dev/urandom。''”


    所以 Andy 并没有质疑 Jason 的补丁是否能工作——他指出的是，它将以可能破坏现有编译用户空间二进制文件的方式改变系统行为。换句话说，它会破坏内核
    ABI。如果属实，Jason 的补丁将有一道巨大的障碍需要跨越。一般来说，除了允许安全漏洞未修补外，Linux 唯一讨厌的就是破坏 ABI。但如果能证明没有用户依赖
    ABI 的特定部分，Linus 曾允许补丁对其进行修改。


    在这种情况下，Jason 对 Andy 说：


    “*我认为你的分析与现实情况有些脱节。现实是，密码学用户发现自己仍然在使用 /dev/random，因为这在很长时间内一直是‘标准良好建议’。人们仍然被鼓励这样做，无论是出于无知还是出于‘兼容性’。密码学问题不会消失。解决这个问题意味着，是的，为那些尚未切换到使用
    getrandom(GRND_INSECURE) 进行这种较少见用途的少数 init 系统用户（这些用户实际上是谁？）增加 1 秒的延迟。这不是破坏兼容性或破坏用户空间或破坏任何东西；这是接受
    /dev/random 主要用法——密码学——的现实，并使这种用法最终变得安全，代价是那些尚未切换到 getrandom(GRND_INSECURE) 的其他用户会有
    1 秒的延迟。对于消除一个自毁陷阱来说，这似乎是一个很小的代价。


    “而且，总的来说，以修复一个常见触发的自毁陷阱为优先，而淡化较少见用法的罕见性能表现，这与事物随时间演化和改变的方式相当。没有实际的破坏。没有 ABI 变更违规。你所说的
    simply 并非如此。*”


    Theodore Ts’o 在 Jason 的论据一侧加入了讨论。他说，“只要我们阻塞的时间很短，并且仅在系统引导后的早期阶段，人们就不应该在意。我们必须添加‘天哪-我希望这个像
    jitter-entropy 一样的黑客做法在所有架构上都是安全的，但它比人们试图让 Linux 采用的替代方案要好’的原因是，存在挂起数小时甚至数天的系统。”


    但真金不怕火炼，在 Jason 的补丁进入内核树大约一周后，Guenter Roeck 指出，它导致“各种架构（arm, m68k, microblaze,
    sparc32, x86：我观察到的）的大量 qemu 引导测试失败。共同点是引导在‘Saving random seed.’处挂起。附带了一个样本二分查找日志。回退此补丁可以修复问题。”


    此时 Linus 加入了对话，说道，“好吧，尝试是值得的，但是的，它显然对那些无法进行抖动熵且没有其他活动的各种平台造成了问题。”


    于是他回退了这个补丁。


    Jason 也评论了 Guenter 的帖子，说道，“正如 Linus 所说，尝试并不值得，我想它只是不起作用。”


    但故事并没有就此结束。Jason 要求 Guenter 分享一些似乎因该补丁而损坏的虚拟机，两人——以及其他一些人——着手追踪 Qemu 对 Jason 补丁出现问题的真正原因。正如
    Jason 所说，“如果我们将来再次尝试，了解之前失败的所有原因似乎是个好主意。”


    事实上，结果证明这是一个 Qemu bug，而不是 Jason 的随机数生成修改存在的问题。对 Jason 来说，这意味着“回退 /dev/random +
    /dev/urandom 统一的理由现在已经被修复了。这是实实在在的具体进展。”


    但他仍保持谨慎。Jason 继续说道，“我不想太快再次尝试统一。我认为至少，第一次尝试的教训不仅仅是‘我应该修复 Guenter 的一些测试用例’，而是问题在于‘提前排队，并进行更广泛的测试和研究。然而，导致回退的初始问题在多个平台上得到修复，这给了我相当大的乐观，相信在*某个*时间点，我们将能够尝试此事。一步一个脚印。”


    最终，看来 Linus 并不认为整个问题整体上是一次不可接受的 ABI 违规。他愿意，虽然不积极，但如果 Jason 的补丁能起作用，他会接受此类东西。因此，从理论上讲，Jason
    可能会在近期给随机数生成带来一点更多的合理性。


    ### 来自 Linus 的 Git 教训


    Borislav Petkov 向 Linus Torvalds 针对 5.18 内核树提交了一个拉取请求，但他注意到他的工作流程产生了一个奇怪的 diffstat。Diffstat
    是自动生成文件变更和变更量摘要的文档。这是内核开发人员快速查看补丁中哪些部分可能引起他们兴趣的一种方式。在这种情况下，Borislav 注意到 Git 抱怨“多个合并基”（multiple
    merge bases），并描述了他认为导致该抱怨的操作：


    “我需要来自另一个 tip 分支的先决条件工作：tip/locking/core，该分支在我将先决条件工作添加之前被快进到了 v5.17-rc1。


    “所以我将 tip/locking/core 合并到了 tip/ras/core […] 并添加了 RAS 内容


    “*然而，在创建拉取请求的 diffstat 时，即使所有 tip/locking/core 的变更都已在你掌握的主分支中，它仍然会从 tip/locking/core
    添加额外的文件。*”


    他没有完全明白自己哪里做错了，所以他请 Linus 解释。Linus 回复道：


    “*你所描述的是一种非常根本的事情——你的分支有多个独立的起始点，因为……*”


    ### 作者简介


    Linux 内核邮件列表归档了 Linux 开发活动的核心。流量巨大，经常达到每周 10,000 条消息，而一个人要跟上开发的全貌几乎是不可能完成的任务。少数敢于承担这项任务的勇敢灵魂之一是**扎克·布朗**（Zack
    Brown）。


