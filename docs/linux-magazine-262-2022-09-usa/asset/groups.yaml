    YouTube 视频相关的音频，没有任何干扰或可疑的拍摄角度。喜欢的曲目可以添加到你自己的播放列表中，多线程播放让一切保持流畅。这种方法很棒的一点是，YouTube
    往往是找到某些稀有曲目和现场表演的唯一地方，而且你通常希望有一个简单的音乐播放器来帮助你收听这些曲目。Myuzi 正是如此。


