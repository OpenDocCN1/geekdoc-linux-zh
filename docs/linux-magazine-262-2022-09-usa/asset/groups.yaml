    \ npm 技能最新的受害者是一台 LG OLED 电视！**作者 GERAH MORRISON**\n\n### 虚拟白板\n\n#### Lorien\n\
    \n白板之所以与学习场所形影不离，自有其理由：它们非常适合教育和头脑风暴；它们动态且灵活；且具备协作性。因此，毫不令人惊讶的是，白板功能已被数字化，不仅在学校的触摸屏中如此，在线上也一样，复杂信息可以在一个可左右滚动和缩放的虚拟画布上呈现。类似的理念也用于桌面上的笔记应用。这些应用通常模仿记事本界面，用于绘制草图和添加思维导图，而非寻找在更大画布上映射更复杂想法的方式。就连苹果自家的笔记应用也以相同方式运作；其下一个版本承诺将固定画布解放为无限可滚动的画布。而这正是这款出色的应用\
    \ Lorien 已经能够做到的。\n\nLorien 是一款具有无限画布的白板。这意味着你可以在背景上开始随意涂鸦，然后向上、向下、向左或向右滚动，以添加进一步的注释或\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_83_1.png)\n\n- **格式支持：** 除 Lorien 自身的文件格式外，文档还可保存为\
    \ SVG 文件。\n- **工具：** 绘制、素描和输入文字，以在自己的白板上添加笔记。\n- **标签页：** 同时处理多个文档，或启用无干扰模式。\n\
    - **无限画布：** 你工作的背景可以是任意尺寸和比例。\n- **高帧率：** 得益于使用 Godot，Lorien 的渲染效果更像游戏而非桌面应用。\n\
    - **矢量：** 一切都是矢量，保持文件大小小而质量高。\n- **触控笔支持：** Lorien 专为配合触控笔设计，可利用压力改变绘制粗细。\n\n\
    笔记，就像在无限大的大学白板上那样。这种方法也延伸至画布的缩放，因此理论上，你可以在屏幕上的单个像素后面填满一个虚拟的微观世界信息。之所以可能，是因为 Lorien\
    \ 并不存储涂鸦和文本的位图，而是存储你所添加的所有内容及其彼此相对关系的算法表示方式。这就是 Inkscape 的工作方式，SVG 文件表示向量的方式，以及\
    \ Minecraft 在无尽景观中某处重建你的房子的方式。它允许屏幕上的巨大位图图像保存为极小的文件，并以任何比例完美重绘。这也意味着你获得无限的撤销和重做，以及涂鸦的\
    \ SVG 导出。然而，与 Inkscape 不同，Lorien 仅用于你自己的笔记和头脑风暴，而非艺术作品。为最好地实现这一点，Lorien 采用标签页界面以同时处理多个文件，并接受拖到画布视图的文件。\n\
    \n但这并不意味着其绘图工具简单。有画笔、橡皮擦、直线和矩形工具，以及不同的笔触和调色板，但你不能像 Krita 那样精细调整。Lorien 旨在用于快速做笔记和草图，无需太多思考或艺术精细度。由于抗锯齿和矢量化绘制，你的作品仍可看起来美丽，就像伟大的想法写在信封背面时那样。Lorien\
    \ 也旨在配合触控笔使用，甚至可能与 GNOME 新的 RDP 和触摸屏支持配合，在那里你可以使用压力动态改变画笔大小。但你也可以使用普通的鼠标，其中中键用于拖动画布，缩放则映射到滚轮。文件可以原生保存或导出为\
    \ SVG 以供导入其他应用。一切渲染完美，且不占用大量 CPU。这可能是因为 Lorien 使用 Godot 而非 Qt 或 GTK 构建，使 Lorien\
    \ 能够利用游戏使用的相同性能加速。更令人兴奋的是，未来我们可能会看到更多同样出色的应用，源自曾经主要作为游戏引擎的领域。\n\n**项目网站**\nhttps://github.com/mbrlabs/Lorien\n\
    \n### 3D 设计\n\n#### FreeCAD 0.20\n\n主要的 0.20 版本为我们提供了重温这一 3D 建模和设计支柱的完美借口。FreeCAD\
    \ 已经存在了 20 年，因此它很复杂。与 Blender 类似，这不是你能在 20 分钟内精通的应用。但同样像 Blender 一样，它 capable\
    \ 出精美且专业的结果，从 3D 打印到电路设计。\n\n使用 FreeCAD 有几种不同的方法，最常见的是从 X 和 Y 平面中的二维草图开始开发你的设计。FreeCAD\
    \ 使用工作台（workbenches）的概念来改变其配置以适应你的工作方式，有多个工作台有助于此阶段，例如创建 2D 俯视图。完成此步后，你首先创建一个草图，然后进一步探索菜单以选择要添加的形状。这些在画布上交互式创建，允许你拖动其边缘和点以适合所需尺寸。\n\
    \n以此方式，FreeCAD 部分是 Gimp，部分是 Blender，并有一个重要区别：约束。约束，如边长或角度，是 FreeCAD 中的重要概念，因为它们无歧义地定义物体的形状。\n\
    \n物体创建过程涉及遍历每个参数并固定它以创建约束。当形状完全受约束时，它变为绿色，并被视为已求解。一切都可以点击和拖动点或线创建，但也可以通过编辑参数使其精确，类似于更具交互性的\
    \ OpenSCAD。但像 OpenSCAD 一样，如果你愿意，物体也可以完全用 Python 编程。幸运的是，这个新版本极大地改善了可用性，包括合理的帮助文本和改进大量用户界面元素，使其更直观易用。它仍然复杂，但比以往任何时候都更容易。\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_84_0.png)\n\nFreeCAD 包含 OpenCASCADE\
    \ 技术（OCC）元素，以执行复杂 3D 形状的操作。\n\n> **项目网站**  \n> https://www.freecadweb.org\n\n\
    ### 音频插件 API\n\n#### CLAP\n\n这不是一个普通的发现，因为 CLAP 不是可以运行的东西，而是开发来帮助他人创建可运行事物的工具。具体来说，它是一个\
    \ API，帮助程序员编写音频效果和合成器，可与任何音频平台协同工作。\n\n这应该是一个已解决的问题，因为这种 API 已存在数十年——最著名的是 Steinberg\
    \ 的 VST 插件架构和 Apple 的 Audio Unit 应用。这两者主导专业音频，VST 在 Linux 上流行，可以构建原生插件或通过 Wine\
    \ 运行 Windows VST 插件。\n\n问题是这些 API 均非开源，且 VST 仍由 Steinberg 控制。有较旧的开源替代品，包括 LV2、LAD-SPA\
    \ 和 DSSI，但开发者抱怨其复杂性和碎片化，且每种在 Linux 之外都未能达到使用量的临界点，这对于任何格式的成功至关重要。\n\nCLAP（Clever\
    \ Audio Plug-in 的缩写）是一个新的开源音频 API，专门设计为易于使用、适应性强且高效。它还可能比任何其他插件格式强大得多。它允许按时间自动化和调制、参数偏移、非破坏性性能声音修改以及按声部参数。这些在替代品中均难以轻松实现，使其成为选择\
    \ CLAP 而非其他格式的真正理由，无论其许可如何。\n\n更令人印象深刻的是，CLAP 由两家重要公司开发，Bitwig 和 u-he。两家公司均生产其软件的\
    \ Linux 版本，其中 Bitwig 作为行业标准 Ableton Live 的挑战者取得巨大成功尤为突出。Bitwig 已经是 CLAP 插件的主机，u-he\
    \ 正在转换其插件，其他对 Linux 友好的软件生产商也是如此。重要的是要注意 CLAP 的雄心是在所有平台上成功，其 MIT 许可和开放合作的承诺同样重要。希望它将取得巨大成功。\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_84_1.png)\n\nBitwig 自己的软件是最早的 CLAP\
    \ 主机之一，完全开源且出色的 Qtractor 也是。\n\n> **项目网站**  \n> https://github.com/free-audio/clap\n\
    \n"
