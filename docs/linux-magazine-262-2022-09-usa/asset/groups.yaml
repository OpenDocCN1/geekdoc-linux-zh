    \n## 通过特别版磨练你的技能！\n\n通过我们的特别版库了解 Shell、LibreOffice、Linux 等更多内容。\n\nLinux Magazine\
    \ 团队创建了一系列单行本，让你深入了解你想要的主题。\n\n提供印刷版或数字版\n\n## 查看完整库！\n\nshop.linuxnewmedia.com\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_75_0.png)\n\n一些最好的文章不仅教导关于工具的知识 – 它们还教导关于工具背后的原因。当你阅读这类文章时，你不仅仅是在学习\
