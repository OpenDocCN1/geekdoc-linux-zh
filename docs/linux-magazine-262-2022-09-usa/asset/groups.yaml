    where you will also find the Tasmota console, which lets you issue commands directly
    and set up the parameterization.


    After connecting the module as shown, you have to hold down the button on the
    Sonoff module while powering it on; the LED does not light up. Next, use the command


    ### Flashing Tasmota


    ```

    $ esptool --port /dev/ttyAMA0 chip_id

    ```


    to check whether you can access the Sonoff. An ID must be shown.


    Among the several ways to flash Tasmota, one popular approach is to use a USB
    serial adapter. A description can be found on the Getting Started page of the
    project [3]. Because the Raspberry Pi comes with a serial interface, I will do
    the flashing directly through the GPIO.


    ```

    $ esptool --port /dev/ttyAMA0 write_flash -fm dout 0x0 tasmota-sensors.bin

    ```


    Finally, flash Tasmota with the command:


    This operation should take about a minute. When the module is restarted, it reports
    for duty as the new WiFi access point, which you can reach at `http://192.168.4.1`
    and on which you configure the WiFi network to be used. All further setup steps
    are then performed with the IP address assigned by your own WiFi network.


    Before proceeding, you first need to connect the temperature sensor to one of
    the GPIOs used for flashing (RX/TX), which is now free. You can do this with a
    pull-up resistor and the 3.3V and GND connections [5]. After wiring the elements,
    it''s time to configure the sensor; its name will have already appeared in the
    GUI (Figure 3).


    At this point at the latest, I recommend studying the very good documentation
    from Tasmota''s GitHub repository. For this project, I used a command that makes
    the later integration with Home Assistant by autodiscovery very easy by telling
    Tasmota to announce all available topics (Setoption19 on). At the end of the day,
    Tasmota advertises itself in the GUI as a web switch with a temperature sensor
    (Figure 5). You can also view the


    ![](img/b40e8bf6cf651f8eebf36f5265123095_73_1.png)


    Figure 3: A convenient web GUI helps you set up the temperature sensor.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_73_2.png)


    Figure 4: Just a few parameters let you prepare Tasmota for transferring data
    to Home Assistant.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_73_3.png)


    Figure 5: Hardly distinguishable from commercial products: the web-based user
    interface of Tasmota.


    ### Setting Up Tasmota


    Figure 6: A few simple steps are all it takes to integrate the MQTT protocol into
    Home Assistant.


    Listing 1: configuration.yaml

    ```yaml

    01 mqtt:

    02   broker: localhost

    03

    04 sensor:

    05   - platform: mqtt

    06     name: templ

    07     state_topic: "/living/temp/28-0417c1b1f7ff"

    08     unit_of_measurement: ''°C''

    ```

