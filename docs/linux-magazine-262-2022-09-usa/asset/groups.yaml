    network consists of two large blocks that each contain other functions (Figure
    1): the Radio Access Network (RAN) and the Core Network (Core).


    The RAN contains all the elements that make a mobile network mobile, namely, the
    base stations (Figure 2) that act as access points for the terminals. This architecture
    has advanced significantly with the consecutive generations, and the elements
    of a base station have been renamed, reshaped, and reduced in size several times.
    Since 4G, another part of the architecture is femtocells, which are small form
    factor base stations with a size and shape similar to a WiFi access point. Femtocells
    (Figure 3) improve coverage for small offices, indoor public spaces, and homes.
    In 5G (and, by the way, also in 6G), base stations are better known as gNodeBs.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_0.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_1.png)


    The RAN is basically a network of access points that provides connectivity below
    the IP layer and cannot on its own connect to the external world or provide services
    such as authentication or roaming. Instead, these services are functions of the
    core network. In other words, the core network contains all the elements that
    make a mobile network a network. (See the box entitled “Core Network” for more
    on the key core network functions.)


    As new generations of mobile networks have advanced, these elements of the core
    network have become more and more open. In the 5G environment, core network functions
    can be programmed and distributed by different vendors, as long as they follow
    the 3GPP standard interfaces. This open approach has many benefits. For instance,
    the NRF function makes it easier to manage packages from different vendors, eliminating
    incompatibilities that could otherwise render a network inoperable.


    This trend in opening the standards has also extended to the RAN, where a similar
    microservice-based architecture is emerging: Open RAN.


    ## Open RAN


    The microservice-based approach used in the 5G Core Network turned out to simplify
    the addition and maintenance of new functions, the integration of third-party
    software, and the use of off-the-shelf computers for running the infrastructure.
    In other words, it was a good idea. So the next logical step was to move this
    good idea to the other part of the network, the RAN. In 5G, the RAN also had open
    specifications to a good degree (e.g., network functions, protocols, etc.). The
    only roadblock was that only a limited number of manufacturers had the fabrication
    capabilities for building the required equipment: high-frequency radio transceivers
    and amplifiers, carefully designed antennas, highly selective filters, and other
    highly specialized tools. Traditionally, this limit has reduced the number of
    actors in the RAN market to a few large enterprises, such as Huawei, Nokia, and
    Ericsson.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_16_2.png)


    **Figure 2: Antenna of a typical base station.**


    **Figure 3: 5G femtocell (CC BY-SA 4.0, user Liamjs from commons.wikimedia.org).**


    ### Core Network


    In 5G, the main core network functions are:


    - User Plane Function (UPF): contains all the functions that are directly related
    with connecting the terminal with the Internet. Among these functions are routing
    and forwarding, Network Address Translation (NAT), packet filtering, Deep Packet
    Inspection (for lawful communication interception); yes, this function is defined
    in the standard [1] and, of course, billing. These functions compose the user
    plane. All the other functions of a 5G network are called control plane functions
    and are needed to support the correct operation of the user plane.

    - Access and Mobility Management Function (AMF): performs the roaming functionality,
    that is, the required operations for reassigning serving gNodeBs to the terminal
    and doing the handover such that the user plane can always provide connectivity
    to the terminal.

    - Authentication Server Function (AUSF): contains the user authentication features
    for other core functions.

    - Session Management Function (SMF): keeps track of the connections in the user
    plane and ensures their correct operation according to user policies for the specific
    terminal.

    - Network Slice Selection Function (NSSF): supports the network slicing [2] functionality,
    which divides resources of the network among several slices or sub-networks. Each
    slice can support different configurations, services, etc., virtually, while sharing
    bare metal resources with other slices.

    - Policy Control Function (PCF): contains the rules that regulate other control
    plane functions (such as the resource assignment to different slices) and the
    connections in the user plane (e.g., different quality of service (QoS) parameters).

    - Unified Data Management (UDM): Acts as a centralized database containing the
    user data, such as session status and authentication keys. It is used by other
    functions such as AUSF and SMF.

    - Application Function (AF): Provides services to the end user. The AF is the
    equivalent of a remote service over the Internet but with an increased integration
    into the mobile network (e.g., for using the user profile or faster user plane
    connections).

    - Network Repository Function (NRF): acts as a centralized repository for the
    software packages that implement all the core network functions.

    - Network Exposure Function (NEF): acts as an interface for developing new services
    in the 5G Core – contains SDKs, APIs for third-party AFs, and other elements.


    All these network functions are implemented by software packages running over
    a powerful computer (which normally runs some enterprise-grade Linux distribution
    such as RHEL or SLE).


    Nevertheless, advances in several technological in recent years has changed the
    outlook for the RAN. First and foremost, Software-Defined Radio (SDR) allows the
    usage of generic radio equipment, which can be fabricated by third parties and
    acquired by RAN equipment integrators. There is no need to build custom RAN-specific
    radio chips, which are costly and only available to a few manufacturers. An SDR
    board with a powerful computer and the appropriate software for the signal processing
    can become a base station for a RAN. Secondly, the development of cloud computing
    has made it possible for integrators to use cloud providers to support all the
    signal processing. The need for “powerful computers” then is replaced for a much
    more economical cloud instance where resources are provided on demand.


    These two technologies on their own already point at drastic cost reductions,
    bringing smaller competitors into play, including small enterprise companies such
    as Amsosoft, Yepzon, and Viavi.


    But an even higher degree of openness is possible. Although these small enterprises
    could each have their closed, monolithic solution, there is another way: Open
    RAN is a new approach that defines the RAN as a set of microservices with an open
    specification of interfaces. The Open RAN specification defines functional blocks,
    along with the interfaces that connect them, such that a RAN integrator can make
    a RAN solution with off-the-shelf hardware (or cloud instances), some SDR modules,
    and a set of software components from different manufacturers that perfectly interact
    with each other. These components can be updated as vendors add new features,
    correct errors, or support future 3GPP releases.


    Figure 4 shows the elements defined in Open RAN. The main concept is “disaggregation.”
    Instead of having a discrete gNodeB, OpenRAN divides the functions among three
    main components:


    - The Radio Unit (RU): Contains all the functionalities of the gNodeB that deal
    with the radio signal, such as modulation and demodulation, filtering, etc. In
    technical terms, the RU implements the lower physical layer. You can find a definition
    of the physical layer in the “Reference Model” box. It is the part that normally
    will run within an SDR device.

    - The Distributed Unit (DU): Contains the rest of the lower layers, such as the
    baseband processing (see the “Radio Aspects” box) of the higher physical layer,
    the MAC layer, and the RLC layer. The DU communicates with the RU to send


