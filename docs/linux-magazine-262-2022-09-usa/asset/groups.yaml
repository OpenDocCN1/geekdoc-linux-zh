    ### 开箱


    FLUX Beamo 在一个非常大的纸箱中送达新主人手中，箱子相当重。如果您担心背部状况，请朋友帮忙把这头“野兽”搬出箱子是个好主意。完成这一步后，在开始您的第一个项目之前，还有几项任务需要完成。除了进行一些显而易见的工作，例如拆除通风软管并用供应商善意提供的卡箍将其连接到激光机背面的管道上、安装
    WiFi 天线并插电之外，还有软件设置。这并非大事：打开激光切割机后，在*开始屏幕*上选择*网络*（图 1），如果您使用机器的无线接口，则选择*连接 WiFi*。选择一个
    WiFi 网络，输入密码，让 DHCP 施展其魔法。您也可以使用提供的以太网电缆——如果 WiFi 连接太慢或不可靠，这是一个好主意。一旦机器获得 IP 地址，记下该地址并进入下一阶段，安装
    Beam Studio。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_65_2.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_0.png)


    **Beam Studio**


    如果您在 2009 年之前使用过 CO2 激光器，您愿望清单上最大的项目之一可能是带软件支持的摄像头，它能让您看到激光正在“看到”什么。这样可以消除定位激光头部的猜测，并缓解关于激光超出介质边缘的担忧。令人惊讶的是，考虑到与过去的激光巨头相比，FLUX
    激光家族价格低廉，却恰好拥有内置摄像头和 Beam Studio。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_1.png)


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_2.png)


    要安装 Beam Studio（图 2），请访问 FLUX 网站 [2] 并选择与您的操作系统匹配的版本。如果您使用的是较新的 Ubuntu 系统，这将是
    v.1.8.3 -Ubuntu-18.04 x64。安装文件的名称是 beam-studio_1_8_3_amd64.deb，您可以使用 Ubuntu 包管理器进行安装。


    右键点击下载的文件，然后选择“使用其他应用打开”，再选择“软件安装”。安装程序会提示您输入密码，然后开始安装 Beam Studio。如果您直接从 FLUX
    获取了 DEB 包，可以忽略关于软件可能不安全的警告。


    Beam Studio 要求您设置一个帐户，然后提示您选择如何连接到激光切割机（图 3）。您也可以可选地选择校准摄像头（图 4）。


    **测试任务**


    FLUX 贴心地提供了一块小木刨板和一个测试任务，帮助您入门。这是检查激光是否对齐良好的好方法。如果没有，请参阅“烟雾与镜子”框。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_66_3.png)


    将木刨板放在网格上，并按照程序设置激光的焦点——要么折叠亚克力板进行手动对焦，要么使用可选的自动对焦功能。现在点击摄像头图标，在您放置木刨板的区域周围拖出一个框架。这告诉激光切割机打开摄像头并扫描木材的确切位置。然后选择
    文件 | 示例，并加载名为 Example of Beamo 的文件。从图 2 可以看到，该文件由两层组成，一层是带有 hello beamo 标志的位图图像，另一层是一个用于雕刻切割的简单环形。这是一个重要功能。图层允许您在适合的材料（如木材或亚克力）上雕刻位图图像，并在一个图层上完成，而切割工作则分配给具有不同参数的另一个图层，处理简单的矢量图像。


    将两个图像分组并将其居中于木刨板上。FLUX 选择的默认参数设置对于使用提供的木刨板进行此任务来说是完美的。按 Go，然后在出现的 Beamo 窗口中，按箭头按钮开始任务。如果这一切都成功，您已步入使用
    FLUX 激光进行创造性工作的正轨。旅程的下一部分涉及在纸上创建自己的设计，并扫描结果，使用能够处理矢量和位图图像的软件工具进行后期处理。在 Linux 世界及更广泛的领域，首选工具可能是
    Inkscape。


    ### 烟雾与镜子


    您可能已经知道，激光切割机是精密仪器。您可能尚未意识到的是，激光束是通过镜子偏转到激光头部的。激光包装在运往新主人途中受到的任何撞击都可能导致一些对准问题。您可能运气好，不需要调整机器上的镜子，也可能需要。我们没那么幸运，不得不调整第一个反射镜（图
    5），这需要拆卸大量内六角螺钉才能开始对准。听起来很复杂，但如果我们能做到，我们相信您也可以。以下是您需要做的：


    1. **第一面镜子：** 在激光关闭的情况下，在第一面镜子上贴上一小块白色胶带（这就是为什么它包含在供货范围中）。盖上激光机的盖子并打开电源。在触控面板上，轻触“维护”。在维护屏幕上，轻触“电机”。然后手动将激光头移动到左上位置。现在按“激光脉冲”向胶带发射一枪（您应该看到一缕烟），并确保您能看到一个点。现在，手动将激光头移动到左下位置。确保盖子关闭并向胶带再发射一枪。如果来自激光头的点对齐，您可以进入下一面镜子。如果它们没有对齐，调整第一面镜子上的螺钉并重复步骤，直到镜子对齐。如果第二枪完全错过胶带，将头部移至中左位置以检查您需要调整的方向。顺时针旋转左上螺钉会将点向下和向左移动。顺时针旋转右上螺钉会将点向右移动，移动底部螺钉会将点向上移动。简单。全部完成。现在轮到第二面镜子了。

    2. **第二面镜子：** 这次将一块胶带贴到第三面镜子的金属环上。将激光头移动到中左位置。再次盖上盖子并发射一枪。然后将激光头移动到中右位置并再发射一枪。点需要重叠。如果不行，调整第二面镜子上的螺钉，直到所有点对齐。这次螺钉位于不同位置并起不同作用。如果您非常不幸，可能还需要调整激光头、激光管和第三个反射镜。我们不会在这里详细介绍这些操作步骤，但再次强调，这一切都是“烟雾与镜子”。如果确实需要这些调整，您可能需要在此时查阅
    RTFM（自然意味着阅读 FLUX 手册）。但希望您运气好，可以直接进入第一个实际的激光雕刻和切割任务。


    ## Inkscape


    在 Ubuntu 上安装 Inkscape 轻而易举。如果这款惊人的免费程序


    ![](img/b40e8bf6cf651f8eebf36f5265123095_67_0.png)


    尚未安装，只需启动 Ubuntu 软件中心，并在搜索框中输入 Inkscape。然后在提示时输入密码，等待 Inkscape 安装。现在是时候发挥创造力了：Christa
    有一个关于圣诞装饰的想法，展示了三位智者、一颗星星和一只骆驼。作为那些幸运的人之一，她能在脑海中想象场景并在纸上画出来，无需照片或草图作为参考，她只是坐了下来


    ![](img/b40e8bf6cf651f8eebf36f5265123095_67_1.png)

