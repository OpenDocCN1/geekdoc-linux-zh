    ## 配置和导出选项


    通过在 Manuskript 的顶部菜单中点击“视图”或 *编辑 / 设置*，你可以配置图 3 到 10 中看到的大部分内容。例如，你可以添加自定义标签或写作状态（图
    12），以及配置修订控制或全屏编辑器的主题。


    就 Manuskript 的编辑器而言，它以纯文本或 HTML、Markdown 或几乎任何其他标记语言的形式接受并保存你写的一切（但请注意，在撰写本文时，唯一支持语法高亮的格式是
    *Markdown*）。然而，Manuskript 可以导入许多格式的现有文本，包括但不限于 OpenDocument、.docx、ePub 和 LaTeX。


    在输出方面，你可以保存或（如 Manuskript 令人困惑地所称的）“编译”你完成的作品为 Pandoc 转换器 [6] 支持的所有格式。为了最大限度地利用
    Manuskript，无论是导入还是导文本，这都是一个必要的前提条件。


    在底层，每个 Manuskript 写作项目由八个小文件组成，采用基于文本的格式，如 YAML、JSON、XML 或 OPL，外加两个文件夹。这八个文件包含该项目的设置、其标签和可能的状态、摘要、情节等所有信息。两个文件夹中，一个用于人物，另一个用于你写的实际文本。每个人物都有一个文件，其中存储有关该人物的一切信息，格式为键值对。例如，甘道夫的文件开头看起来像表
    1。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_92_1.png)


    图 10：实际的文稿编辑器，由列出当前章节所有属性的面板以及包含所有情节和子情节的故事线提供支持。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_92_2.png)


    图 9：打开编辑器时，所有章节的摘要以索引卡片的形式可见。


    大纲文件夹被划分为与你在 Manuskript 的 *大纲* 面板中看到的结构相同的子文件夹。每个子文件夹都包含一个名为 *folder.txt* 的文件，该文件存储（使用与人物相同的语法）该文件夹的元数据
    – 即标题、摘要、预期字数等。相反，单个章节是


    ![](img/b40e8bf6cf651f8eebf36f5265123095_93_0.png)


    图 11：Manuskript 编辑器可能看起来很简单，但你会发现那里有对作家来说最重要的一些功能。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_93_1.png)


    图 12：标签、章节状态以及 Manuskript 的其他部分都易于自定义。


    ## 结论？当然，试试 Manuskript！


    正如我在本教程开头所写的，Manuskript 仍处于大规模开发阶段，这一点很明显。例如，我测试的版本（0.13.1）不支持直接从 Manuskript 内部打印。你必须将故事导出（或如他们所说的，编译）到其他格式，用其他程序打开生成的文件，并从中打印。我还注意到，如果你在大纲中选择一章，然后点击“在新标签页中打开”，什么也不会发生。就功能而言，我真的希望编辑器至少能以
    WYSIWYG 模式处理 Markdown 源，或者能够对同一源进行实时 HTML 预览。在编辑器之外，如果能至少打印出大纲就太好了。


    接下来是有趣的部分，为什么了解这些细节很重要：在点击“编辑 | 设置”后你可能会选择或取消选择的所有选项中，也许最重要的是名为“保存为单个文件”的选项。如果你选择该选项，上述所有文件和文件夹将始终且仅保存为一个压缩归档，格式为
    ZIP 但扩展名为 .msk。


    如果你不选择该选项，Manuskript 将创建一个以项目名称命名的文件夹，放在你想要的任何目录中，并在那里保存所有这些文件和文件夹，而不进行任何压缩。当然，你的口味可能不同，但我强烈建议使用此选项，原因如下，这是
    Manuskript 文档的 paraphrase：“如果你不保存为单个文件，‘所有有用的内容 *都保持为纯文本可访问。*’” 这一点很重要，因为每个人都知道如何处理纯文本
    – *包括软件！*


    选择此选项使得使用其他软件管理或处理你在 Manuskript 中做的任何事情变得更容易，无论出于什么目的。例如，一个装满纯文本文件且没有其他内容的文件夹，可以比单个大型、不透明的压缩归档更高效地由修订控制系统管理或用
    rsync 等工具备份。纯文本文件的文件夹也可以被 Recoll [7] 等程序完全索引，并使用诸如 *find* 和简单的 shell 脚本等标准 shell
    命令进行搜索、修改或创建。


    我认为，如果编辑器能够自动识别某些字符串，例如人物或地点的名称，并将它们转换为可点击的链接，打开相应的 Manuskript 数据库条目，也会很有用。我不惊讶地发现这个功能已经在计划之中。


    然而，尽管存在这些限制，我认为 Manuskript 已经作为写作助手拥有巨大的潜力，并邀请每个需要写大型作品的人认真地试一试。说这个大理由的一个重要原因是，由于基于易于处理的纯文本文件，Manuskript
    易于扩展或与其他工具集成。就个人而言，我使用 Manuskript 的第一个业余项目将是弄清楚如何从现有的 Markdown 草稿和笔记集合开始，使用 shell
    脚本创建一个完整的 Manuskript 项目。


    ## 作者


    Marco Fioretti ([http://mfioretti.com](http://mfioretti.com)) 是一位自由撰稿人、培训师和研究人员，常驻意大利罗马。自
    1995 年以来他一直使用免费/开源软件，自 2005 年以来一直在从事开放数字标准工作。Marco 还在 [https://stop.zonal-m.net](https://stop.zonal-m.net)
    上撰写有关数字权利的博客。


    ## 表 1: 甘道夫人物文件


    | 属性 | 值 |

    | :--- | :--- |

    | **姓名：** | Gandalf |

    | **ID：** | 0 |

    | **重要性：** | 2 |

    | **POV：** | True |

    | **动机：** | See motivation |

    | **目标：** | 摧毁魔戒，拯救中土世界 |

    | **冲突：** | 渴望获得魔戒 |

    | **短语摘要：** | 中土世界最强大、最智慧的巫师 |


    ## 信息


    - [1] Manuskript: [http://www.theologeek.ch/manuskript/](http://www.theologeek.ch/manuskript/)

    - [2] 如何使用雪花法规划一本书：[https://jerichowriters.com/how-to-plot/](https://jerichowriters.com/how-to-plot/)

    - [3] 雪花法的 10 个简单步骤：[https://proactivewriter.com/blog/use-the-snowflake-method-of-writing-in-10-easy-steps-how-to-start-writing-a-novel-for-beginners-updated](https://proactivewriter.com/blog/use-the-snowflake-method-of-writing-in-10-easy-steps-how-to-start-writing-a-novel-for-beginners-updated)

    - [4] *指环王* 粉丝 wiki：[https://lotr.fandom.com/wiki/Main_Page](https://lotr.fandom.com/wiki/Main_Page)

    - [5] LotRenum [psucm:](https://lotrempsum.com/) [https://lotrempsum.com/](https://lotrempsum.com/)

    - [6] Pandoc: [http://pandoc.org/](http://pandoc.org/)

    - [7] 由 Marco Fioretti 撰写的 “教程：Recoll”，*Linux Magazine*，第 212 期，2018 年 7 月，p8/84：[https://www.linux-magazine.com/Issues/2018/212/Tutorials-Recoll/(language)/eng-US](https://www.linux-magazine.com/Issues/2018/212/Tutorials-Recoll/(language)/eng-US)


