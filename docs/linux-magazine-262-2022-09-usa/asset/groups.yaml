    # Distro Walk – MX Linux


    Others, like those for managing users or sound settings, are basic necessities,
    but many are imported from antiX or developed specifically for MX Linux.


    For easier setups, MX Linux features GUIs for NVIDIA drivers and codec in- stallers,
    as well as a Bash config, which has tabs for setting aliases, prompt structure,
    and history, three tasks which must ordinarily be done sepa- rately from the command
    line (Figure 5). An extensive set of unique tools are also available for maintenance,
    such as Chroot Rescue Scan, Boot Options, and Boot Repair (Figure 6). However,
    of all MX Linux’s tools, probably the most useful are the ones for external de-
    vices: the Live USB Maker, which in- cludes the ability to update the kernel on
    a Linux system on a flash drive (Fig- ure 7), and Snapshot, which saves sys- tem
    backups for easy restoration (Figure 8). Some of these tools are perhaps useful
    only in the most common of cases, but all the same, each of them empowers users
    who might hesitate to open a command line.


