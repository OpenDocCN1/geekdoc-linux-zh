    \ ski conditions in a notification\n04 #\n05 theurl=\"https://www.snow-forecast.com/resorts/Sunshine/6day/mid\"\
    \n06\n07 # Get the new snow depth\n08 thestr=\"New snow in Sunshine Village:\"\
