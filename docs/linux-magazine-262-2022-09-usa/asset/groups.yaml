    ## 替代 cut


    ### tuc


    cut 是你终端中最常被忽略和低估的内置命令之一，它已存在很长时间。尽管我们中的大多数人通常都能猜到它的功能，但我们有限的记忆意味着，通常更容易通过管道甚至复制粘贴来构建等效命令，而不是费心去查
    `cut --help`。cut 命令通过指定范围、分隔字符甚至字节位置，帮助你从文件或管道输入中提取文件的各种部分。它功能强大，但它已不再是你路径中唯一应拥有的
    cut 命令。这是因为有一个名为 tuc 的新替代品，这是一个巧妙命名的工具，它不仅执行 cut 的所有功能，还填补了其功能中的空白。而且它所做的远不止反转文本顺序。


    ![](img/b40e8bf6cf651f8eebf36f5265123095_85_0.png)


