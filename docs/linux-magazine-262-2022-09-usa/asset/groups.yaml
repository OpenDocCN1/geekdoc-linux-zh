    \ Wi-Fi 支持并不包含在此次更新中（尽管测试了音频支持）。\n\n根据 Fedora Wiki 上关于树莓派 4 的页面记载：“对树莓派生态的支持一直在不断演进。本次更改的目标是支持树莓派\
