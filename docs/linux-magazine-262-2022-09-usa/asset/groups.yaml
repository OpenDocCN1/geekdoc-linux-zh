    # Survival Guide


    Homebrew, a comprehensive package manager, has been increasing in popularity thanks
    to its ease of use. By Bruce Byfield


    L inux has no shortage of package managers. Besides basic ones such as RPM, DNF,
    and dpkg/apt-get / APT, there are supposedly universal ones such as Flatpak and
    Snap, and increasingly, one for each programming language. Originating in macOS
    and formerly called Linuxbrew on Linux, Homebrew [1] is especially popular in
    the Ruby on Rails community. Recently, however, it has started gaining a larger
    popularity due to its ease of use. If you want to install anything from a project
    in early development, increasingly there is a good chance that you will need Homebrew
    to do so. Homebrew offers the option of non-root installation, access to developing
    software outside your distribution''s repositories, and multiple versions of applications.
    In addition, if you maintain multiple operating systems, you can use the same
