  - "[PAGE 47]\n\nexample of this where the browser immediately displays a JPEG file\
    \ on calling localhost:8080 or IP address:8080 without any complaints.\n\nThe\
    \ interesting thing here is not just that this works, but that it also represents\
    \ a potential vulnerability. Apparently, most web browsers don't bother checking\
    \ whether the content of the GET request and the returned page actually match.\
    \ In this case, the browser asked for the index page of the web server and was\
    \ given a JPEG file instead. That's something like a tennis player getting a basketball\
    \ thrown at them by their opponent all of a sudden.\n\nFrom experience, these\
    \ idiosyncrasies, and many other features you might want to implement, are not\
    \ very well documented on the web or are not documented at all. That's why it\
    \ could be useful to log what Firefox and other browsers request. The function\
    \ in Listing 9 starts the server. You can see two tee redirects there that forward\
    \ all of the data to a logfile for the debugging. This log will then contain the\
    \ date and time, what the web browser sent as a request, and what the server sent\
    \ back as a response (Figure 4). Armed with these details, you can analyze each\
    \ request and response and understand what exactly is going on when the client\
    \ and server talk.\n\nFor example, many browsers ask for the famous favicon.ico\
    \ after they have talked to a server for a little while. This is the icon that\
    \ you usually see at the top of the browser's tabs. It is usually found in the\
