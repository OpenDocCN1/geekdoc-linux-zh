  md: "\n## Programming Snapshot – Go Geolocation Game\n\nCollections, but can only\
    \ sort points with X/Y coordinates. Line 41 creates a lookup hash map. It maps\
    \ the longitude and latitude of the photos to the JPEG images on the disk. When\
    \ the algorithm comes back with the coordinates of a desired image later on, the\
    \ program can find, load, and display the associated image.\n\n### Controlled\
    \ Randomness\n\nFrom the representatives of all the chosen clusters, the Schmitz\
    \ game initially needs to select a secret target picture for the player to guess.\
    \ It then opens the game with a random starting image, but it would not be a good\
    \ idea to pick the secret image, even by accident! The Go `math/rand` standard\
    \ solution in Go delivers randomly and equally distributed index positions between\
    \ 0 (inclusive) and `len()` (exclusive), thus picking purely random elements from\
    \ the array.\n\nThe `randPickedExcept()` function starting in line 75 of Listing\
    \ 2 now picks a random element from the array passed into it, without ever revealing\
    \ the element that resides in the `exclIdx` place. This is accomplished by the\
    \ algorithm only selecting the elements in index positions 1...`N` from the elements\
    \ in the index range 0...`N`, neglecting the first image in the list. And, if\
    \ the choice happens to fall on the forbidden `exclIdx` position, the function\
    \ simply delivers the θ item, which was previously excluded from the pick, as\
    \ a replacement. This way, all photos, except the secret one, have an equal probability\
    \ of being picked as a starting point.\n\n### Slimming Down\n\nListing 3 helps\
    \ to load the scaled down cell phone photos into the GUI. One difficulty here\
    \ is that many cell phones have the bad habit of storing image pixels in a rotated\
    \ orientation when taken and noting in the header that the image needs to be rotated\
    \ either 90 or 180 degrees for display purposes [7].\n\nThis display behavior\
    \ is handled by the imageorient package that Listing 3 pulls in from GitHub in\
    \ line 5, auto-rotating each image before it is handed to the GUI for display.\
    \ Also, nobody really wants to move massive photos around on the screen. Instead,\
    \ the `nfmt/resize` package (also from GitHub) creates handy thumbnails from the\
    \ large photos with the help of the `Thumbnail()` function in line 26.\n\nListing\
    \ 4 computes the distance between the photo shoot locations of two image files\
    \ and the angle from 0 to 360 degrees at which you would have to start walking\
    \ to get from A to B. As the earth isn't a flat surface, calculating these numbers\
    \ isn't as easy as on a two-dimensional map, but the formulas dealing with the\
    \ required 3D geometry are not too complicated and already available online [8].\
    \ In line 8, the `hike()` function takes the longitude (`lng*`) and latitude (`lat*`)\
    \ from the GPS data of two photos and taps into the functions of the `golang-geo`\
    \ library, including `GreatCircleDistance()` and `BearingTo()` to determine the\
    \ distance and bearing to travel from one photo to the other.\n\nTo convert the\
    \ route's bearing, available as a floating-point number ranging from 0 to 360\
    \ degrees into a compass direction such as north or northeast, line 16 divides\
    \ the angle by 45, rounds the result to the nearest integer, and then accesses\
    \ the array slice in line 15 with that index. Index 0 is for north, 1 is NE for\
    \ northeast, and so on. If the index drops below 0, which can happen with negative\
    \ angles, line 19 simply adds the length of the array slice to arrive at an index\
    \ that addresses the array slice from the end instead.\n\n```go\n// Listing 3:\
    \ image.go\npackage main\n\nimport (\n\t\"fmt/io/fyne/v2/canvas\"\n\t\"github.com/disintegration/imageorient\"\
    \n\t\"github.com/nfmt/resize\"\n\t\"image\"\n\t\"os\"\n)\n\nconst DspWidth = 300\n\
    const DspHeight = 150\n\nfunc dispDim(w, h int) (dw, dh int) {\n\tif w > h {\n\
    \t\t// landscape\n\t\treturn DspWidth, DspHeight\n\t}\n\t// portrait\n\treturn\
    \ DspHeight, DspWidth\n}\n\nfunc scaleImage(img image.Image) image.Image {\n\t\
    dw, dh := dispDim(img.Bounds().Max.X,\n\t\timg.Bounds().Max.Y)\n\treturn resize.Thumbnail(uint(dw),\n\
    \t\tuint(dh), img, resize.Lanczos3)\n}\n\nfunc showImage(img canvas.Image, path\
    \ string) {\n\tnimg := loadlImage(path)\n\timg.Image = nimg.Image\n\n\timg.FillMode\
    \ = canvas.ImageFillOriginal\n\timg.Refresh()\n}\n\nfunc loadlImage(path string)\
    \ *canvas.Image {\n\tf, err := os.Open(path)\n\tpanicOnErr(err)\n\tdefer f.Close()\n\
    \traw, _, err := imageorient.Decode(f)\n\tpanicOnErr(err)\n\n\timg := canvas.NewImageFromResource(nil)\n\
    \timg.Image = scaleImage(raw)\n\n\treturn img\n}\n```\n\n```go\n// Listing 4:\
    \ gps.go\npackage main\n\nimport (\n\tgeo \"github.com/kellyjxn/golang-geo\"\n\
    \t\"math\"\n)\n\nfunc hike(lat1, lng1, lat2, lng2 float64) (float64,\n\tstring,\
    \ error) {\n\tp1 := geo.NewPoint(lat1, lng1)\n\tp2 := geo.NewPoint(lat2, lng2)\n\
    \n\tbearing := p1.BearingTo(p2)\n\tdist := p1.GreatCircleDistance(p2)\n\n\tnames\
    \ := []string{\"N\", \"NE\", \"E\", \"SE\", \"S\", \"SW\",\n\t\t\"W\", \"NW\"\
    , \"N\"}\n\tidx := int(math.Round(bearing / 45.0))\n\n\tif idx < 0 {\n\t\tidx\
    \ = idx + len(names)\n\t}\n\n\treturn dist, names[idx], nil\n}\n```\n\n### Widget\
    \ with Something Special on Top\n\nWe hope to cover every single special case\
    \ conjured up by creative software engineers. For example, in the Schmitz game,\
    \ the guesser clicks on a photo in the right pane, to have the game move it to\
    \ the left. Photos don't normally take clicks, but button widgets do. And they,\
    \ in turn, define callbacks to perform the intended action in case of an event.\n\
    \nThe schmitzle GUI application relies on the Fyne framework to whip up a native-looking\
    \ graphical application on the desktop with plain vanilla Go code. Previous articles\
    \ in this column [9] have plumbed the depths of this excellent tool [10] many\
    \ a time. Fyne comes with a whole range of label, listbox, button, and other widgets\
    \ out of the box, but it can't.\n\nWith just a little code, you can quickly program\
    \ extensions in Fyne to add the desired, albeit nonstandard, behavior. Listing\
    \ 5 defines a new widget type named `clickImage` starting in line 13. It is composed\
    \ from a canvas object with a thumbnail image and takes a callback that it invokes\
    \ when the user clicks on the photo with the mouse.\n\nThanks to Go's built-in\
    \ inheritance mechanism for structures, `widget.BaseWidget` on line 14 derives\
    \ the structure from Fyne's base widget, thus providing it with the display, shrink,\
    \ or hide functions common to all widgets. In addition, the add-on widget needs\
    \ to call the `ExtendBaseWidget()` function in the constructor.\n\n```go\n// Listing\
    \ 5: gui.go\npackage main\n\nimport (\n\t\"fyne.io/fyne/v2\"\n\t\"fyne.io/fyne/v2/canvas\"\
    \n\t\"fyne.io/fyne/v2/container\"\n\t\"fyne.io/fyne/v2/widget\"\n\t\"math/rand\"\
    \n\t\"os\"\n\t\"time\"\n)\n\ntype clickImage struct {\n\twidget.BaseWidget\n\t\
    image *canvas.Image\n\tcb    func()\n}\n\nfunc NewClickImage(img *canvas.Image,\
    \ cb func()) *clickImage {\n\tci := &clickImage{}\n\tci.ExtendBaseWidget(ci)\n\
    \tci.image = img\n\tci.cb = cb\n\treturn ci\n}\n\nfunc (t *clickImage) CreateRenderer()\
    \ fyne.WidgetRenderer {\n\treturn widget.NewSimpleRenderer(t.image)\n}\n\nfunc\
    \ (t *clickImage) Tapped(_ *fyne.PointEvent) {\n\tt.cb()\n}\n\nfunc makeUi(w fyne.Window,\
    \ p fyne.Preferences) {\n\trand.Seed(time.Now().UnixNano())\n\n\tvar leftCard\
    \ *widget.Card\n\tvar rightCard *widget.Card\n\n\tquit := widget.NewButton(\"\
    Quit\", func() {\n\t\tos.Exit(0)\n\t})\n\n\tvar restart *widget.Button\n\n\treload\
    \ := func() {\n\t\tleftCard, rightCard = makeGame(p)\n\t\tvbox := container.NewVBox(\n\
    \t\t\tcontainer.NewGridWithColumns(2, quit, restart),\n\t\t\tcontainer.NewGridWithColumns(2,\
    \ leftCard, rightCard),\n\t\t)\n\t\tw.SetContent(vbox)\n\t\tcanvas.Refresh(vbox)\n\
    \t}\n\n\trestart = widget.NewButton(\"New Game\", func() {\n\t\treload()\n\t})\n\
    \n\treload()\n}\n```\n"
  mdcn: "\n\n## 编程快照——Go 定位游戏\n\n集合，但只能对具有 X/Y 坐标的点进行排序。第 41 行创建了一个查找哈希映射。它将照片的经度和纬度映射到磁盘上的\
    \ JPEG 图像。当算法稍后返回目标图像的坐标时，程序可以找到、加载并显示相关的图像。\n\n### 受控随机性\n\n舒密茨（Schmitz）游戏需要从所有选定的簇的代表中，初始选择一个供玩家猜测的秘密目标图片。然后，它通过一张随机起始图片开启游戏，但不应该甚至意外地选中那张秘密图片！Go\
    \ 语言中的 `math/rand` 标准库解决方案能提供在 0（包含）和 `len()`（不包含）之间随机且均匀分布的索引位置，从而从数组中纯粹随机地选取元素。\n\
    \n列表 2 中从第 75 行开始的 `randPickedExcept()` 函数现在会从传入的数组中随机选取一个元素，而绝不揭示位于 `exclIdx`\
    \ 位置的那个元素。这是通过算法仅从索引范围 0...`N` 中的元素里选择索引位置 1...`N` 的元素来实现的，忽略了列表中的第一张图片。并且，如果选择结果恰好落在禁止的\
    \ `exclIdx` 位置，该函数将简单提供 θ 项作为替代，该项之前已被排除在选取范围之外。这样，除了那张秘密图片外，所有照片被选为起点的概率都是相等的。\n\
    \n### 精简瘦身\n\n列表 3 有助于将缩小后的手机照片加载到 GUI 中。这里的一个难点在于，许多手机有一个坏习惯，即在拍摄时以旋转方向存储图像像素，并在头部注明该图像在显示时需要旋转\
    \ 90 度或 180 度 [7]。\n\n这种显示行为由 `imageorient` 包处理，列表 3 在第 5 行从 GitHub 引入了该包，在将每张图片交给\
    \ GUI 显示之前自动旋转图片。此外，没有人真的想在屏幕上拖动巨大的照片。相反，`nfmt/resize` 包（同样来自 GitHub）在第 26 行借助\
    \ `Thumbnail()` 函数，从大照片生成方便使用的缩略图。\n\n列表 4 计算两个图像文件拍摄地点之间的距离，以及从 A 点走到 B 点时需要开始行走的角度（0\
    \ 到 360 度）。由于地球不是平坦的表面，计算这些数字并不像在二维地图上那样简单，但处理所需三维几何学的公式并不太复杂，并且已经在网上可用 [8]。在第\
    \ 8 行，`hike()` 函数从两张照片的 GPS 数据中获取经度（`lng*`）和纬度（`lat*`），并调用 `golang-geo` 库的功能，包括\
    \ `GreatCircleDistance()` 和 `BearingTo()`，以确定从一张照片到另一张照片需要行进的距离和方位角。\n\n为了将路线的方位角（表现为\
    \ 0 到 360 度的浮点数）转换为罗盘方向（如北或东北），第 16 行将角度除以 45，将结果四舍五入为最接近的整数，然后使用该索引访问第 15 行中的数组切片。索引\
    \ 0 代表北，1 代表东北（NE），以此类推。如果索引小于 0（这在负角度的情况下可能会发生），第 19 行简单地加上数组切片的长度，以到达一个从末尾访问数组切片的索引。\n\
    \n```go\n// Listing 3: image.go\npackage main\n\nimport (\n\t\"fmt/io/fyne/v2/canvas\"\
    \n\t\"github.com/disintegration/imageorient\"\n\t\"github.com/nfmt/resize\"\n\t\
    \"image\"\n\t\"os\"\n)\n\nconst DspWidth = 300\nconst DspHeight = 150\n\nfunc\
    \ dispDim(w, h int) (dw, dh int) {\n\tif w > h {\n\t\t// landscape\n\t\treturn\
    \ DspWidth, DspHeight\n\t}\n\t// portrait\n\treturn DspHeight, DspWidth\n}\n\n\
    func scaleImage(img image.Image) image.Image {\n\tdw, dh := dispDim(img.Bounds().Max.X,\n\
    \t\timg.Bounds().Max.Y)\n\treturn resize.Thumbnail(uint(dw),\n\t\tuint(dh), img,\
    \ resize.Lanczos3)\n}\n\nfunc showImage(img canvas.Image, path string) {\n\tnimg\
    \ := loadlImage(path)\n\timg.Image = nimg.Image\n\n\timg.FillMode = canvas.ImageFillOriginal\n\
    \timg.Refresh()\n}\n\nfunc loadlImage(path string) *canvas.Image {\n\tf, err :=\
    \ os.Open(path)\n\tpanicOnErr(err)\n\tdefer f.Close()\n\traw, _, err := imageorient.Decode(f)\n\
    \tpanicOnErr(err)\n\n\timg := canvas.NewImageFromResource(nil)\n\timg.Image =\
    \ scaleImage(raw)\n\n\treturn img\n}\n```\n\n```go\n// Listing 4: gps.go\npackage\
    \ main\n\nimport (\n\tgeo \"github.com/kellyjxn/golang-geo\"\n\t\"math\"\n)\n\n\
    func hike(lat1, lng1, lat2, lng2 float64) (float64,\n\tstring, error) {\n\tp1\
    \ := geo.NewPoint(lat1, lng1)\n\tp2 := geo.NewPoint(lat2, lng2)\n\n\tbearing :=\
    \ p1.BearingTo(p2)\n\tdist := p1.GreatCircleDistance(p2)\n\n\tnames := []string{\"\
    N\", \"NE\", \"E\", \"SE\", \"S\", \"SW\",\n\t\t\"W\", \"NW\", \"N\"}\n\tidx :=\
    \ int(math.Round(bearing / 45.0))\n\n\tif idx < 0 {\n\t\tidx = idx + len(names)\n\
    \t}\n\n\treturn dist, names[idx], nil\n}\n```\n\n### 带有特殊顶部元素的控件\n\n我们希望能覆盖由富有创造力的软件工程师构想出的每一个特殊情况。例如，在舒密茨游戏中，猜测者点击右侧窗格中的照片，以便游戏将其移动到左侧。照片通常不会响应点击，但按钮控件会。进而，它们定义了回调函数，以便在发生事件时执行预期的操作。\n\
    \nschmitzle GUI 应用程序依赖于 Fyne 框架，使用纯 Go 代码在桌面上打造具有原生外观的图形应用程序。本专栏之前的文章 [9] 曾多次深入探讨这一优秀工具\
    \ [10]。Fyne 自带了一系列标签、列表框、按钮和其他控件，但它不能……\n\n只需少量代码，你就可以快速在 Fyne 中编程扩展，以添加所需的、尽管非标准的\
    \ 行为。列表 5 定义了一个名为 `clickImage` 的新控件类型，从第 13 行开始。它由一个带有缩略图图像的 canvas 对象组成，并接收一个回调函数，当用户用鼠标点击照片时调用该回调。\n\
    \n得益于 Go 语言为结构体内置的继承机制，第 14 行的 `widget.BaseWidget` 从 Fyne 的基础控件派生结构，从而为其提供所有控件共有的显示、缩小或隐藏功能。此外，附加控件需要在构造函数中调用\
    \ `ExtendBaseWidget()` 函数。\n\n```go\n// Listing 5: gui.go\npackage main\n\nimport\
