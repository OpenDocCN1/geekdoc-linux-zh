    var leftCard *widget.Card\n\tvar rightCard *widget.Card\n\n\tquit := widget.NewButton(\"\
    Quit\", func() {\n\t\tos.Exit(0)\n\t})\n\n\tvar restart *widget.Button\n\n\treload\
