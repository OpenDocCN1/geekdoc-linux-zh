    50   clusters, err := km.Partition(d, 10)\n51   panicOnErr(err)\n52\n53   rand.Shuffle(len(clusters),\
    \ func(i, j int) {\n54     clusters[i], clusters[j] = clusters[j], clusters[i]\n\
