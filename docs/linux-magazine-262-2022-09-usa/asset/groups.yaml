    # Podman


    package. Then call Cockpit on *local-host:9090/podman* in your browser (Figure
    5). The web interface gives you the ability to inspect (Figure 6) and manage (Figure
    7) your images and containers.


    I did not find any drawbacks com-pared to Docker during testing. Pod-man’s biggest
    benefit is improved secu-rity due to eliminating the need to be root. In addition,
    simple administration through integration with Cockpit is a plus. Podman is well
    on its way to


    replacing Docker, although there are still some teething issues to be aware of,
    especially when you are working with remote machines. The simple introduction
    described here is a good starting place if you are looking to expand your own
    container skills. ■■■


    # Conclusions


    The Podman man page [10] offers a useful initial overview of Podman’s features,
    while the Podman website [1] provides a variety of references for further research.
    In my opinion, you can learn the Podman basics more quickly than Docker. If you
    already have experience with Docker, you will certainly find the transition to
    Pod-man easy. To jog muscle memory in this case, enter


    ```

    alias docker=''podman''

    ```


    in your .bashrc to continue using Docker commands such as pull, push, build, commit,
    tag, and more.


