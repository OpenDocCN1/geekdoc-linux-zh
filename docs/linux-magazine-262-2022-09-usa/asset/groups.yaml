    of complexity will never actually see this situation. You can’t get multiple merge
    bases if you don’t do any merges yourself."


    *"So this kind of git complexity only happens to people who are supposed to be
    able to handle it. You clearly figured out what was going on; you didn’t perhaps
    just realize the full story."


    Borislav thanked him for the explanation and offered to write up some documentation
    on the topic to include in the kernel tree. But Jonathan Corbet offered a link
    to his own note from March 2022 to document this situation, at Documentation/maintainer/messy-diffstat.rst
    in the kernel tree.


    Borislav said he liked Jonathan’s version of the documentation a lot better than
    whatever he himself might have scratched together, and the discussion came to
    an end.


    # When Word Has Not Yet Gone Round


    Andy Shevchenko recently inadvertently put his head in the lion’s mouth, pointing
    out that since -Werror had been added to the kernel build systems, all warnings
    at build time were now errors. And for anyone using their host’s GCC), this would
    cause the GNU C Compiler (GCC) to be very finicky about identifying as many warnings
    as possible. The result was that Andy’s kernel builds were failing left and right.
    He posted a patch to remove the whole -Werror thing in the kernel build system.


    The lion’s jaws had not immediately snapped closed around Andy’s head. Instead,
    Masahiro Yamada said that -Werror should not be enabled for any regular user who
    is simply building the kernel for their own use.


    Andy agreed with this. However, he did start to feel the lion’s hot breath all
    around him and offered a link to an earlier discussion, at https://lore.kernel.org/all/YjsCoRRKW4I6St@zn.tnic/,
    in which Linus Torvalds had said that kernel build warnings were unacceptable,
    and that everyone should enable -Werror.


    At this point, the lion did indeed chomp down upon the head of Andy. Linus said:


    "If you enabled CONFIG_WERROR, then you get CONFIG_WERROR.


    "If you enabled W = 1, then you get extra warnings.


    "If you enabled both, then you get extra warnings and they are errors.


    "This path is just stupid.''


    He went on to say:


    "-WERROR should be on for regular builds.


    "It’s W = 1 that is questionable. It enables warnings that are often false positives,
    and if you use W = 1 (and particularly W = 2) then that’s *your* problem.


    "W = 1 is most definitely not ‘regular builds’. It’s only for people who want
    to deal with crazy compiler warnings.


    "I WANT WERROR on as widely as possible, because I’m really sick and tired of
    developers not noticing when they add warnings because they did a ‘regular build''.


    "Stop this idiocy where you think warnings are acceptable.''


    Andy replied, “fair enough.” Then he picked up his masticated head from the ground,
    reattached it, and proceeded to the next thing.


