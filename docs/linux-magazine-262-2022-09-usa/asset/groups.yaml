    fragmented. It’s now becoming difficult again to access the media you want in
    the formats you need. This is where Jellyfin comes in. Jellyfin is an open source
    equivalent to Plex, where you run your own server and serve your own content.
    One or more front-end clients can then access the server and stream whatever you
    want to watch or listen to. There are clients for Android and Apple phones and
    tablets, and client applications for smart TVs, including an unofficial build
    for LG’s webOS. When all else fails, there’s a brilliant web front end running
    in the server that almost makes any client application redundant. Any one of these
    will present a beautiful interface that provides quick, responsive access to your
    content through media, music, and show categories with a list of movie posters,
    album covers, or box set thumbnails. All of this can be configured along with
    multiple directories for your various kinds of content, stored locally or remotely.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_87_0.png)


    If required, Jellyfin can limit the bandwidth it uses, as well as the video and
    audio capabilities, by transcoding your content in real time.


    Installing the server itself is easy with the recommended Docker method, which
    also has the advantage of keeping your server isolated from the rest of the system.
    But native installations are just as straightforward. It’s particularly well suited
    to run on a Raspberry Pi which can even be configured to provide hardware transcoding
    acceleration, as can any generic system or GPU with appropriate drivers. Most
    of the time, however, real-time transcoding of your media from one format to another
    is not required. The vast majority of front-ends will be able to play most modern
    H.264 or H.265 encoded content natively, and we successfully streamed 4K HDR recordings
    easily from a Raspberry Pi to a smart TV’s web browser with very little CPU overhead.
    This is what differentiates Jellyfin from that first generation of home streaming
    solutions, because the hardware we now have access to is far more capable, and
    the experience is mostly seamless. Using Jellyfin is also a great way to aggregate
    content across a household, especially if you still have a collection of physical
    media, and it’s still often the only way to stream the highest quality content
    from that media. Even when services support UHD with 4K and HDR content, those
    streams are themselves often too heavily compressed. Jellyfin lets you stream
    files natively across your network and beyond, and fits seamlessly with our 21st-century
    media-consumption habits.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_87_1.png)


    Just like any other streaming service, Jellyfin will automatically populate the
    poster and thumbnail images, as well as the background information for any content
    it detects.


    **Project Website**

    https://jellyfin.org

