    All three of the tools described in this article support ActivityPub, a free protocol
    for supporting cross-platform social networks [1]. If two social media platforms
    support the ActivityPub protocol, they can exchange messages.


    ### Diaspora


    The Diaspora project [2], which is supported by the Diaspora Foundation, is a
    decentralized network whose servers (pods) form a globally distributed system.
    Diaspora''s feature set is similar to industry giants Twitter and Facebook. Users
    can operate with a high degree of anonymity and often do not reveal their true
    identities. In addition, users retain all rights to their data, which rules out
    personalized tracking. Tech-savvy users who want to support the ActivityPub protocol
    can install dedicated Diaspora pods, where their data is kept secure locally.


    To create a Diaspora profile, press the *Join!* button top right on the project
    website, and register using the green button that then appears. A small selection
    of suggested servers will appear for you to join. If you would like to see a complete
    list of all pods, including various snippets of statistical data, click on the
    list icon bottom right, which leads to a display showing availability information,
    locations, and the numbers of users (Figure 1).


    To log in to one of the servers, simply click on its URL. You can only create
    an account on pods that have a yes in the *logins* table column. After you select
    a server, press the *Create account* button in the top right-hand corner of the
    splash page. All you need is a valid email address, a username, and a password.
    You can also upload a profile photo and specify your areas of interest. The *Awesome!
    Take me to diaspora* button finally takes you to the message area (Figure 2).


    When you get there, you will see the message stream on the right, with various
    instructions appearing when you first access it. In the first box, you can directly
    enter a message; select the recipient in the *Public* button below. On the left
    is an options bar for various settings. In the activity bar at the top, you can
    click to select various activities and also define your user settings with the
    help of a drop-down menu.


    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_0.png)

    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_1.png)

    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_2.png)


    **Figure 1: Diaspora lists all available servers on its website.**


    ![](img/b40e8bf6cf651f8eebf36f5265123095_30_3.png)

    **Figure 2: The Diaspora message window offers a convenient overview of available
    options.**


    Click on your username in the top right-hand corner and then select Profile.


    For many actions, emails will be sent to your stored address. The NSFW (not safe
    for work) option lets you highlight content that you do not want to appear while
    you are working. Accordingly, these messages do not appear in the conventional
    stream. This option is switched off by default, so you need to enable it manually.


    Contacts lets you sort other users into groups, such as Family, Friends, Work,
    and Acquaintances. To organize one or more contacts in different groups, click
    on the desired group. Your contacts will then appear on the right-hand side of
    the window, arranged in a table.


    Diaspora lets you set up your own server, which is always integrated into the
    Diaspora network. To create a closed communication network based on Diaspora (without
    having to sacrifice functionality), you need to set up your own groups. Running
    your own pod involves some complex installation steps. The Diaspora developers
    provide somewhat outdated instructions for numerous Linux distributions.


    ### Friendica


    Friendica [3], which has been continuously maintained and developed since 2010,
    is one of the best-known free microblogging and chat services. Also decentralized,
    Friendica does not require a central server. You can connect with users on other
    Friendica servers or integrate contacts from Twitter, Diaspora, pump.io, and StatusNet
    into your message thread. Friendica also lets you share and distribute images.
    The software is modular and can be extended using plugins. On top of this, you
    can set up a Friendica server yourself and even make it publicly accessible.


    On the project’s website, after clicking on Public servers in the top right-hand
    corner, you will find a list of publicly accessible Friendica servers sorted by
    language. Choose a server, then connect to it by clicking on the given URL. The
    initial pages of the individual servers look almost identical. When you register,
    Friendica expects you to enter your name or pseudonym and an email address to
    match. If you already have a profile on another Friendica server, you can use
    it here, too. All you have to do is transfer it to the new server in the registration
    dialog.


    After clicking the Register button, you will receive a message on the specified
    email account with a newly generated password. Using this password and your username,
    you can now log on to the server, following which you are taken to a splash page.
    On the left, the various settings and administrative options are grouped together,
    and the message stream appears in the middle. At the top you will find several
    buttons for notifications and access to the most important functions (Figure 3).


    To manage your own profile, click on your profile name in the top right-hand corner.
    In the context menu, use *Edit profile* to modify the basic settings.


    Friendica offers detailed account management options that you can access by clicking
    on your username or avatar on the splash page. In the *Account Settings* dialog
    (Figure 4), you can define various security and privacy options or import contacts
    using a CSV file that you need to create separately. Use the *Expiration Settings*
    option to define how long posts remain visible before Friendica deletes them.


    Friendica divides accounts into different types, which mostly differ in terms
    of how they handle contact requests. You can either manually accept requests for
    friends or followers or have them automatically sorted into categories. This does
    not work with accounts for discussion forums, however. You can also use several
    accounts simultaneously. The *Settings | Manage Accounts* menu lets you register
    your additional accounts and connect them to existing ones. If you are using a
    larger number of accounts in a larger organization, you will want to add administrators
    and authorized representatives with administrative rights.


    You can access several external networks to add contacts. In Friendica, click
    *Contacts | Add New Contacts* in the main window to add a contact to your list.
    The name and interests search gives you an opportunity to link up with potentially
    like-minded people. Friendica also lets you read content from other platforms,
    such as Twitter, Mastodon, or Diaspora. However, to establish direct communication,
    you also need an account on the source server (Figure 5). In the *Find people*
    settings box, you can narrow your search for contacts based on various criteria
    such as similar interests. If you select the *Local directory* option, only the
    potential contacts on the source server where you are currently logged in will
    appear. Use the *(Groups)* access bar to assign your Friendica contacts to groups.


    Like Diaspora, Friendica lets you install code from your own server. Download
    the source code from the project''s website in the *Use it | Install your own
    server* menu. Detailed documentation is available on the Friendica website [4].
    Please note that you need to meet some software requirements to set up a Friendica
    server. These requirements include, for example, a LAMP stack and specific versions
    of the PHP programming language and the Apache web server. The project page lists
    the individual applications in detail. Friendica does not require any specific
    hardware, so you can use an old computer system as a server.


    ### Mastodon


    Mastodon [5], under development by Eugen Rochko since 2016, is another decentralized
    microblogging platform. With around 5.1 million users on 3,786 servers right now,
    it is one of the better-known free services.


