    A real-time kernel (currently still in beta) is expected to find favor especially
    in the telecommunications industry, for example, for real-time applications in
    the 5G sector.


    ### Conclusions


    If you are an admin or developer, you don''t need to rush to switch to Ubuntu
    22.04 LTS, but gradually transitioning only makes sense, even on your servers.
    You should consider making the switch not only because your favorite frameworks
    and content management systems will eventually switch to the new programming language
    versions, but also because updated software may utilize some of the new features
    that Ubuntu 22.04 delivers. If you want to wait, most of the teething troubles
    should be confined to history by the time the first point release, 22.04.1, appears.
    Before you make the change, check through the release notes [10] for the known
    issues taking your infrastructure into account. ▪▪▪


    ### Info


    - [1] HWE kernel: https://www.thomas-krenn.com/en/wiki/Ubuntu_LTS_Hardware_Enablement_Stack_information

    - [2] Kernel releases: https://www.kernel.org/category/releases.html

    - [3] Plans for Ubuntu kernel: https://discourse.ubuntu.com/t/ubuntu-desktop-gnome-plans-for-the-incoming-lts/26156/13

    - [4] NFS and UDP: https://www.mail-archive.com/kernel-packages@lists.ubuntu.com/msg473086.html

    - [5] SSH on older machines: https://bugs.launchpad.net/ubuntu/+source/openssh/+bug/1961833

    - [6] Ubuntu and OpenStack: https://ubuntu.com/blog/opensatak-is-dead

    - [7] OpenStack "Yoga": https://releasenotes.openstack.org/yoga/

    - [8] Kubernetes 1.23: https://ubuntu.com/blog/kubernetes-1-23-release-top-features

    - [9] Multipass: https://multipass.run

    - [10] Release notes: https://discourse.ubuntu.com/t/jammy-jellyfish-release-notes/24668

