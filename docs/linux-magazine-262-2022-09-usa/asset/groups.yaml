  mdcn: "\n\n## Fedora Linux 即将登陆树莓派 4\n\nFedora Linux 已经可以在桌面、服务器甚至物联网设备上使用。然而，如果你想在该操作系统安装到树莓派\
    \ 4 设备上，之前总是事与愿违——直到现在。随着 Fedora 37 的即将发布，对该设备的支持或许终于会成为现实。虽然这还不是官方支持，但这项提议已经提交，并将在获得\
    \ Fedora 工程指导委员会批准后实施。\n\n树莓派 4 之前未能获得 Fedora Linux 支持的原因在于缺乏图形加速功能。不过，随着上游社区在内核和\
