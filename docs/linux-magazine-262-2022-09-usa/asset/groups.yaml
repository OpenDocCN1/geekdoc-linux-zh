    ![](img/b40e8bf6cf651f8eebf36f5265123095_90_0.png)


    Figure 3: Entering the data a library would need to catalog your work.


    The left toolbar in Figures 3 to 8 shows why and how Manuskrript is a perfect
    tool for applying the snowflake method: Each of the top six buttons in that toolbar
    opens a panel that either corresponds to some side of that workflow or completes
    it. From top to bottom, the buttons are General (information and metadata), Summary,
    Characters, Plots (and subplots), World (i.e., the settings and outline), Outline,
    and Editor.


    By entering and incrementally refining all the data that those panels support,
    you can organize, plan, and above all, document for yourself, before writing,
    everything from plot twists to the appearance, motivation, and background history
    of each character, and the whole society she lives in. Even after you have started
    writing, you may expand or update as you wish in any moment any part of this “database”
    that Manuskrript creates for each of your writing projects.


    # A Practical Example


    For an example of Manuskrript at work, I will pre- tend to be J.R.R. Tolkien,
    rewriting *The Lord of the Rings* (LoTR) with Manuskrript. I will show you how
    to create and organize a complex story by enter- ing the relevant data or text
    snippets from LoTR into Manuskrript. I will take the information from Wikipedia,
    the LoTR Fandom wiki [4], and when I just need some filler, from LoTR-themed random
    text by LoRem Ipsum [5].


    The *General* button (the topmost button) in Manuskrript’s left toolbar is for
    the basic, self-describing metadata shown in Figure 3. An- other thing to notice
    in Figure 3 is the toolbar on the right. From there, you can open Manuskrript’s
    search function of Manuskrript, hide or show the left (*Navigation*) toolbar,
    and depending on which panel you are in, activate other auxiliary functions.


    The *Summary* panel (Figure 4) matches exactly the very first step of the snowflake
    method: Write what your story is about, first with one sentence, and then gradually
    expand it. Then Manuskrript can quickly show you that summary whenever you need
    it while you write.


