    \ in Go delivers randomly and equally distributed index positions between 0 (inclusive)\
    \ and `len()` (exclusive), thus picking purely random elements from the array.\n\
    \nThe `randPickedExcept()` function starting in line 75 of Listing 2 now picks\
    \ a random element from the array passed into it, without ever revealing the element\
    \ that resides in the `netIdx` place. This is accomplished by the algorithm only\
    \ selecting the elements in index positions\n\n1...`N` from the elements in the\
    \ index range 0...`N`, neglecting the first image in the list. And, if the choice\
    \ happens to fall on the forbidden netIdx position, the function simply delivers\
    \ the θ item, which was previously excluded from the pick, as a replacement. This\
    \ way, all photos, except the secret one, have an equal probability of being picked\
    \ as a starting point.\n\n# Slimming Down\n\nListing 3 helps to load the scaled\
    \ down cell phone photos into the GUI. One difficulty here is that many cell phones\
    \ have the bad habit of storing image pixels in a rotated orientation when taken\
    \ and noting in the header that the image needs to be rotated either 90 or 180\
    \ degrees for display purposes [7].\n\nThis display behavior is handled by the\
