  mdcn: "\n\n# 新特性\n## UBUNTU 22.04\n\n#  Linux\n杂志\n\n第 262 期 - 2022 年 9 月\n\n##\
    \ 超越 5G\n设想移动网络的开放未来\n\n- 免费社交媒体工具\n- 保持连接而不\n- 被挖掘\n- 使用 mosquitto 和\n- MQTT\
    \ 进行实用自动化\n- FLUX Beamo\n- 酷炫激光切割机\n- 内置 Raspberry Pi\n- Manuskrïpt\n- 规划小说\n\
    - 不必是\n- 罪与罚\n\n10\n诱人的\n自由开源软件 (FOSS) 工具\n\nMX Linux\nMX-21\n+ Linux\nopenSUSE\n\
    Leap\n15.4\n64 位\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_0_0.png)\n\nLINUX\
    \ 新媒体\n开源脉搏\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_1_0.png)\n\n## 相当强大！\n\
    \n# TUXEDO Pulse 15 - Gen2\n\n- **AMD Ryzen 7 5700U-35W**\n  8 核心 | 16 线程\n- **WQHD\
    \ 显示屏**\n  2560 x 1440 | 165 Hz\n- **最长 18 小时续航**\n  91 Wh 电池\n- **坚固的镁合金机箱**\n\
    \  厚 1.7 厘米 | 重 1.5 公斤\n\n- **100% Linux**\n- **5 年保修**\n- **终身支持**\n- **德国制造**\n\
    - **德国隐私保护**\n- **本地支持**\n\nTUXEDO 电脑 18 周年庆典\n\ntuxedocomputers.com\n\n立即申请！\n\
    \n正在寻找新工作？ tuxedocomputers.com/jobs\n\n## 毕业礼帽与长袍\n\n亲爱的读者：\n\n几个月前，我写过关于开源社区需要为单人或小型开源项目在维护者达到倦怠点或忙于其他事务时提供延续性手段的问题。仅仅因为发起人离开，项目就必须消亡吗？\n\
    \n这个问题的另一个角度是研究专业人员编写的科学软件。世界上最精密的软件之一是由博士候选人和其他学术科学家创建的。这些软件并不是单纯为了编写软件而编写的——它们是为了测试新想法或回答与研究项目相关的问题而编写的。其中一些程序代表了多年的工作，但当开发者毕业或获得终身教职职位时会发生什么？或者当资助研究的拨款到期时会发生什么？更常见的是，项目停滞不前并逐渐消失，而开发者则寻找新的项目和新的资金来研究其他问题。\n\
    \n学术科学关注的是期刊文章，而不是软件。软件只是实现目的的手段，因此许多有用的程序被遗弃，研究人员最终不得不重新发明轮子。不要指望博士和博士候选人来解决这个问题。从未有人因维护只有少数专家才能理解的现有软件而获得讲席教授职位。\n\
    \n随着虚拟科学软件研究所 (VISS) [1] 最近的公告，被遗弃的科学软件的前景变得稍微明亮了一些。VISS 由舒密特未来基金会 (Schmidt Futures)\
    \ [2] 支持，该非营利组织由前谷歌首席执行官埃里克·舒密特和他的妻子温迪·舒密特创立，正在剑桥大学、华盛顿大学西雅图分校、佐治亚理工学院和约翰斯·霍普金斯大学启动四个软件开发中心。这些中心每个将雇佣五到七名软件开发人员，将为科学项目提供开发和支持服务。最初，这些中心只处理与舒密特未来基金会相关的项目，但希望将该支持扩展到其他有价值的研究。\n\
    \n除了在项目结束后软件继续存在以及参与者转向其他事务之外，这些中心将在初始开发阶段提供支持。另一个重要但可能不那么具体的目标将是建立专业学术程序员的身份。世界各地大学中现在有许多专业开发人员在工作，但他们通常是孤立的，分散在校园里，通过单独的、不相关的拨款独立工作。VISS\
    \ 中心提供了集体体验的可能性，具有在野外软件开发中日常存在的指导、工作分享和协同效应。\n\n根据 *Nature* [3] 最近的一篇文章，VISS 很清楚，它无法与亚马逊和谷歌等互联网巨头在支付最高薪水方面竞争，但他们确信他们仍然可以吸引高素质人才。许多专业开发人员最初是通过在科学和工程领域的工作对编码产生兴趣的，对于其中一些人来说，参与具有科学意义的项目比最大化薪资潜力更令人兴奋。（而且，诚实地说，与很多在大学校园里游荡的人相比，他们的待遇可能也不错。）\n\
    \n鉴于当今世界上科学软件的数量，在四个小办公室中增加 20-30 名程序员不会在一夜之间改变格局，但 VISS 的倡议将有助于提高对支持科学编程需求的认识，并且它可以为那些希望在科学知识的永恒探索中发挥作用的对程序员提供永久职业路径的原型。\n\
    \n乔\n\n乔·卡萨德 (Joe Casad)，\n主编\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_2_0.png)\n\
    \n- 信息\n\n- [1] VISS: <https://www.schmidtfutures.com/our-work/virtual-institute-for-scientific-software/>\n\
    - [2] 舒密特未来基金会: <https://www.schmidtfutures.com/>\n- [3] “前谷歌主管的 ventures 旨在拯救被忽视的科学软件”，作者\
    \ David Matthews，*Nature*，2022 年 7 月 13 日: <https://www.nature.com/articles/d41586-022-01901-x>\n\
    \n## LINUX 杂志\n\n2022 年 9 月\n\n### 封面报道\n\n26 Ubuntu 22.04 LTS\n“Jammey Jellyfish”\
    \ 带来新的内核、新的 Gnome 42 桌面以及增强容器支持的新功能。\n\n30 开源社交媒体工具\n数据贩售巨头并不是聊天和微型博客的唯一选择。我们审查了一些免费和去中心化的社交媒体工具。\n\
    \n66 FLUX Beamo\n像 Beamo 这样的激光切割机占据了创客宇宙中一个备受喜爱但鲜为人知的角落。\n\n72 Home Assistant\n\
    MQTT 协议以开源方式支持 DIY 家庭自动化 – 没有 Alexa 在监听。\n\n79 代码演示\n多用途的 Go 语言适用于各种项目，包括从头开始创建代码幻灯片演示文稿。\n\
