    \ and take a closer look. By Goran Miladenovic\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_43_0.png)\n\
    \nProgramming your own web server might seem like a difficult and unnecessary\
    \ undertaking. Any number of freely available web servers exist in the Linux space,\
    \ from popular all-rounders like Apache or NGINX to light-weight alternatives\
    \ like Cherokee or lighttpd (pronounced “lighty”.\n\nBut sometimes you don’t need\
    \ a full-blown web server. If you just want to share a couple of HTML pages locally\
    \ on your own network or offer people the ability to upload files, Linux on-board\
    \ tools are all it takes. A simple shell script is fine as a basic framework that\
    \ controls existing tools from the GNU treasure chest. Network communication is\
    \ handled by Netcat [1], aka the Swiss army knife of TCP/IP.\n\n### Getting Ready\n\
    \nWith a project like this, the best place to start is at the root. Because a\
    \ web server is still a server at the end of the day, it needs to constantly listen\
    \ on a given port and respond appropriately to requests. Usually, web servers\
    \ listen on port 80 for normal requests, and port 80 generally only accepts HTTP\
    \ requests without encryption. The web server I’ll describe in this article listens\
    \ on ports 8080 and 8081 and communicates without encryption. If you are using\
    \ a firewall and want to test the server on the local network, remember to allow\
    \ these two ports in the firewall.\n\nA web server needs a root folder from which\
    \ it loads the requested HTML files. It also needs a directory in which it can\
    \ store uploaded files. Your first step is to define a configuration using a series\
    \ of simple variables at the start of the server script (Listing 1). And you need\
    \ to create the directories, along with a FIFO file, either manually or using\
    \ the Bash test builtin. The serve6.sh script, which is included with the code\
    \ from this article [2], offers a solution.\n\nIn the last line of Listing 1,\
    \ you can see that your own IP address is also important. You will need to modify\
    \ the network device specification (the Ethernet interface enp2s8 in this example)\
    \ to suit your own system. When a web browser tries to submit a file via a web\
    \ form, it needs a target address. GET requests are the simplest approach to doing\
    \ this. When a browser sends a GET request, it expects the content of a web page\
    \ in response, and it displays this content in the browser window.\n\n#### Listing\
    \ 1: Configuration\n\n```bash\nHTTP_HOME=http_home\nHTTP_UPLOAD=$HTTP_HOME/upload\n\
    CACHE_DATEI=$HTTP_UPLOAD/filetoprocess\nFIFO_GET=fifo_get\nHTTP_GET_PORT=8080\n\
    HTTP_POST_PORT=8081\nMEINE_IP=$(ip addr show enp2s8 | grep -Bo '{[0-9]{1,3}.}{3}[0-9]*'\
    \ | sed 1q)\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_43_1.png)\n\n###\
    \ Sample Files\n\nFiles for testing the web server are easily scripted. The function\
    \ in Listing 2 runs through a `for` loop seven times. The routine uses a here\
    \ document (heredoc) to support the entry of HTML code almost 1:1 (third line).\
    \ Heredocs let you refer to the variable set in the `for` statement, which then\
    \ simply contains the sequence number.\n\nHeredocs help to define sections of\
    \ text in many programming languages. Unlike conventional output via `echo` or\
    \ `printf`, line breaks, indents, and some special characters are preserved in\
    \ the text. Bash also supports the use of variables in heredocs.\n\nIn this way,\
    \ you can create as many HTML files as you need with just a few lines of code.\
    \ You could optionally integrate additional dynamic content that you generate\
    \ with a script within the heredoc.\n\nYou'll also need to create some sample\
    \ HTML files for testing your home-grown server. (See the box entitled “Sample\
    \ Files.”)\n\n#### Listing 2: Creating Sample Files\n\n```bash\nfunction create_files\
    \ () {\nfor x in {1..7}; do\ncat <<--FILE > ${HTTP_HOME}/date${x}.html\n    <html><head><meta\
    \ charset=\"utf-8\">\n    <title>Page ${x}</title>\n    </head><body>\n    <p>\
    \ $(date ) </p>\n    <p> Page ${x} </p>\n    </body></html>\n--FILE\ndone\n}\n\
    ```\n\n### GET Requests\n\nResponding to a GET request entails much more than\
    \ just sending the content of a file. HTTP and HTTPS require that additional information\
    \ be sent along with the transmission. If you want to know what a response from\
    \ a genuine web server looks like, type the following command:\n\n```bash\nwget\
    \ --spider -S \"https://www.zeit.de/index\"\n```\n\nThe `wget` utility downloads\
    \ a web page from the terminal. The `--spider` option tells `wget` to behave like\
    \ a web spider; in other words, it won't download the actual content but will\
    \ check that the content is there and will receive the transmission information\
    \ associated with an HTTP request.\n\nIn the first line, the server confirms that\
    \ it is happy to take the HTTP request – HTTP/1.1 200 OK. Further lines in the\
    \ form of value pairs (such as Connection: keep-alive, Content-Length:300) are\
    \ used to send back additional information or instructions.\n\nIt also appears\
    \ that this service is a well-secured web server, because it does not reveal precisely\
    \ what kind of server program it is. Many servers out themselves at this point\
    \ as server: nginx, for example – not advisable, because such disclosures makes\
    \ things easier for attackers. If you want Netcat to behave like a genuine web\
    \ server, you'll need a way to generate this header information associated with\
    \ HTTP.\n\n### Netcat\n\nNetcat is available on virtually any Linux system and\
    \ can be used for many purposes given a little creativity on the user's part,\
    \ although it admittedly has some limitations.\n\nYou can emulate basic network\
    \ operations using Netcat, but complex interactions are difficult or impossible.\
    \ You definitely don't want to try to compete with Apache or NGINX just using\
    \ Netcat.\n\nIf you want Netcat to permanently listen on a port, also send different\
    \ responses, and you have to combine it in a loop with a FIFO file. FIFO refers\
    \ to the \"first in, first out\" principle. This means that the information comes\
    \ back out of the file in the same order in which it was sent in [3]. Listing\
    \ 3 shows an example.\n\nThe FIFO file improves the communication between Netcat\
    \ and the respond function, as shown in Listing 4. Netcat listens on the specified\
    \ port and writes to the FIFO file. On the left side of the pipe, you can see\
    \ the call to the function that reads the browser request. It evaluates the request\
    \ and then sends a matching response, containing an HTML header and HTML data,\
    \ back through the pipe to Netcat. The respond function decides what to return\
    \ to the browser.\n\nThis variant is already a fairly powerful solution. If the\
    \ length of the browser request is 1 (line 3), then it is /, and\n\n#### Listing\
    \ 3: Netcat Response\n\n```bash\nwhile true; do\nrespond < FIFO_GET | netcat -l\
    \ ${HTTP_GET_PORT} > FIFO_GET\ndone\n```\n\n#### Listing 4: FIFO File\n\n```bash\n\
    01 function respond () {\n02 read get_or_post address httpversion\n03 if [ ${#address}\
    \ -eq 1 ]; then\n04 list_dir\n05 elif [ ${#address} -gt 1 ]; then\n06 return_file\
    \ $address\n07 fi\n08 }\n```\n\nNetcat returns a directory listing. If the length\
    \ is not equal to 1, Netcat returns the content of a file from the root directory.\
    \ To get the web server to return a list of the files contained in the root folder,\
    \ a very simple is directory_name is all that is needed. However, the results\
    \ then need to be embedded in suitable HTML code so that the links work and the\
    \ browser can actually use them (Figure 1). The sed [4] stream editor is recommended\
    \ for converting a directory listing to HTML code.\n\nListing 5 shows the functions\
    \ referenced in Listing 4. In the list_dir function, the directory content is\
    \ output with a simple ls command. Sed then converts the results to plain vanilla\
    \ HTML. The files generated by the function from Listing 2, already reside in\
    \ the root directory, already contain HTML code. The server uses the return_file\
    \ function in line 19 of Listing 5 to send a file back to the browser with a matching\
    \ header.\n\nBecause Netcat is continuously available for requests in the loop\
    \ and sends a\n"
  mdcn: "\n\n# 公共资金\n# 公共代码\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_42_0.png)\n\
    \n通过自由软件实现公共基础设施的现代化\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_42_1.png)\n\n\
    欧洲自由软件基金会\n\n了解更多：[https://publiccode.eu/](https://publiccode.eu/)\n\n## 深入探讨\n\
    \n### 自制 Web 服务器\n\n只需几个简单步骤即可构建你自己的 Web 服务器\n\n### 自造\n\n如果你想更多地了解 Web 浏览器与 HTTP\
    \ 服务器之间的通信机制，不妨亲手构建一个 Web 服务器并深入观察一下。Goran Miladenovic 著\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_43_0.png)\n\
    \n编写自己的 Web 服务器似乎是一项困难且不必要的工程。在 Linux 领域存在大量可自由获取的 Web 服务器，从流行的全能型服务器（如 Apache\
    \ 或 NGINX）到轻量级替代方案（如 Cherokee 或 lighttpd，发音为“lighty”）。\n\n但有时你并不需要功能齐全的 Web 服务器。如果你只是想在自己的局域网内共享几个\
    \ HTML 页面，或者提供文件上传功能，Linux 自带的工具就足够了。一个简单的 Shell 脚本就可以作为一个基本框架，用于调用 GNU 工具箱中的现有工具。网络通信由\
    \ Netcat [1] 处理，它也被称为 TCP/IP 的“瑞士军刀”。\n\n### 准备工作\n\n对于这类项目，最好的起点是根基。毕竟 Web 服务器最终仍是一个服务器，它需要不断监听指定端口并相应地响应请求。通常，Web\
    \ 服务器监听端口 80 以处理常规请求，而端口 80 通常仅接受未加密的 HTTP 请求。本文将描述的 Web 服务器监听端口 8080 和 8081，并以未加密方式通信。如果你使用防火墙并希望测试局域网内的服务器，请记得在防火墙中放行这两个端口。\n\
    \nWeb 服务器需要一个根文件夹，从中加载请求的 HTML 文件。它还需要一个目录来存储上传的文件。你的第一步是在服务器脚本的开头（列表 1）定义一组简单变量作为配置。此外，你需要手动或使用\
    \ Bash 测试内置命令创建这些目录以及一个 FIFO 文件。随本文代码包含的 serve6.sh 脚本 [2] 提供了一个解决方案。\n\n在列表 1\
    \ 的最后一行中，你可以看到自己的 IP 地址也很重要。你需要根据自己系统修改网络设备规格（本例中为以太网接口 enp2s8）。当 Web 浏览器试图通过网页表单提交文件时，它需要一个目标地址。GET\
    \ 请求是执行此操作最简单的方法。当浏览器发送 GET 请求时，它期望在响应中收到网页的内容，并在浏览器窗口中显示该内容。\n\n#### 列表 1：配置\n\
    \n```bash\nHTTP_HOME=http_home\nHTTP_UPLOAD=$HTTP_HOME/upload\nCACHE_DATEI=$HTTP_UPLOAD/filetoprocess\n\
    FIFO_GET=fifo_get\nHTTP_GET_PORT=8080\nHTTP_POST_PORT=8081\nMEINE_IP=$(ip addr\
    \ show enp2s8 | grep -Bo '{[0-9]{1,3}.}{3}[0-9]*' | sed 1q)\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_43_1.png)\n\
    \n### 示例文件\n\n用于测试 Web 服务器的文件可以轻松通过脚本生成。列表 2 中的函数通过 `for` 循环运行七次。该例程使用 Here Document（heredoc）来支持几乎\
    \ 1:1 的 HTML 代码输入（第三行）。Here Documents 允许你引用在 `for` 语句中设置的变量，该变量随后仅包含序列号。\n\nHere\
    \ Documents 有助于在许多编程语言中定义文本段落。与通过 `echo` 或 `printf` 进行的常规输出不同，换行符、缩进和一些特殊字符在文本中得以保留。Bash\
    \ 还支持在 Here Documents 中使用变量。\n\n这样，你只需几行代码即可创建所需数量的 HTML 文件。你甚至可以选择在 Here Document\
    \ 中集成由脚本生成的额外动态内容。\n\n你还需要创建一些示例 HTML 文件来测试自己制作的服务器。（参见标题为“示例文件”的方框。）\n\n####\
    \ 列表 2：创建示例文件\n\n```bash\nfunction create_files () {\nfor x in {1..7}; do\ncat\
    \ <<--FILE > ${HTTP_HOME}/date${x}.html\n    <html><head><meta charset=\"utf-8\"\
    >\n    <title>Page ${x}</title>\n    </head><body>\n    <p> $(date ) </p>\n  \
    \  <p> Page ${x} </p>\n    </body></html>\n--FILE\ndone\n}\n```\n\n### GET 请求\n\
    \n响应 GET 请求不仅仅是发送文件的内容。HTTP 和 HTTPS 要求随传输发送额外信息。如果你想知道来自真实 Web 服务器的响应看起来是什么样，请输入以下命令：\n\
    \n```bash\nwget --spider -S \"https://www.zeit.de/index\"\n```\n\n`wget` 实用程序从终端下载网页。`--spider`\
    \ 选项告诉 `wget` 像网络蜘蛛一样行为；换句话说，它不会下载实际内容，而是检查内容是否存在，并接收与 HTTP 请求相关的传输信息。\n\n在第一行中，服务器确认其愿意接受\
    \ HTTP 请求 – HTTP/1.1 200 OK。后续以键值对形式（例如 Connection: keep-alive, Content-Length:300）的行用于发送回额外信息或指令。\n\
    \n看起来这项服务是一个安全配置良好的 Web 服务器，因为它没有揭示自己具体是什么类型的服务器程序。许多服务器在此处会自我标识为 server: nginx，例如\
    \ – 这是不建议的，因为此类披露会使攻击者更容易得手。如果你希望 Netcat 表现得像一个真正的 Web 服务器，你需要一种方式来生成与 HTTP 关联的此头部信息。\n\
    \n### Netcat\n\nNetcat 几乎在任何 Linux 系统上都可以使用，并且如果用户发挥一点创造力，它可以用于许多目的，尽管承认它有一些局限性。\n\
    \n你可以使用 Netcat 模拟基本网络操作，但复杂的交互则困难或不可能。你肯定不希望仅使用 Netcat 就试图与 Apache 或 NGINX 竞争。\n\
    \n如果你希望 Netcat 永久监听某个端口并发送不同的响应，你必须将其与 FIFO 文件结合并在循环中运行。FIFO 指的是“先进先出”原则。这意味着信息以送入文件的相同顺序从文件中读出\
    \ [3]。列表 3 显示了一个示例。\n\n如列表 4 所示，FIFO 文件改进了 Netcat 和 respond 函数之间的通信。Netcat 监听指定端口并写入\
    \ FIFO 文件。在管道的左侧，可以看到对读取浏览器请求的函数的调用。它评估请求，然后通过管道将包含 HTML 头部和 HTML 数据的匹配响应发送回给\
    \ Netcat。respond 函数决定返回什么给浏览器。\n\n这个版本已经是一个相当强大的解决方案。如果浏览器请求的长度为 1（第 3 行），那么它是\
    \ /，并且\n\n#### 列表 3：Netcat 响应\n\n```bash\nwhile true; do\nrespond < FIFO_GET |\
    \ netcat -l ${HTTP_GET_PORT} > FIFO_GET\ndone\n```\n\n#### 列表 4：FIFO 文件\n\n```bash\n\
    01 function respond () {\n02 read get_or_post address httpversion\n03 if [ ${#address}\
    \ -eq 1 ]; then\n04 list_dir\n05 elif [ ${#address} -gt 1 ]; then\n06 return_file\
    \ $address\n07 fi\n08 }\n```\n\nNetcat 返回目录列表。如果长度不等于 1，Netcat 从根目录返回文件的内容。要让\
    \ Web 服务器返回根文件夹中文件列表，只需要一个简单的目录名称。然而，结果需要嵌入适当的 HTML 代码中，以便链接起作用且浏览器能够实际使用它们（图\
    \ 1）。建议使用 sed [4] 流编辑器将目录列表转换为 HTML 代码。\n\n列表 5 显示了在列表 4 中引用的函数。在 list_dir 函数中，目录内容通过简单的\
    \ ls 命令输出。Sed 随后将结果转换为纯 HTML。列表 2 中的函数生成的文件已经位于根目录，并且已经包含 HTML 代码。服务器使用列表 5 第\
    \ 19 行的 return_file 函数将文件连同匹配的头部发送回浏览器。\n\n因为 Netcat 在循环中持续可用以处理请求，并发送一个\n\n"
