    Manuskript’s default World panel, which is only partially visible in Figure 7,
    is frankly overwhelming, at least for trilogies. There are so many categories
    to fill that one may be forgiven for thinking “this will take much more time than
    actually writing my book!” Don’t despair though. First of all, you are not forced
    to fill every one of those boxes before you start writing. Besides, you can, and
    probably should, delete as many of them as desired, if you are sure they are not
    needed for your particular story.


    At the same time, gathering enough patience and discipline to completely describe
    a world using those boxes, as early as possible, would very likely improve the
    quality of the result, as well as save time in the long run. This is true especially
    for series spanning multiple books, where it would be much harder to avoid plot
    holes and maintain continuity and coherence without having all the necessary information
    always at hand, inside those boxes.


    Good usage of the Plots and World panels is absolutely essential for writing good
    fiction with Manuskript, but the one panel that you will almost always use, for
    any writing project, is likely the Outline panel in Figure 8. In it you can list
    every section of your work in hierarchical order and assign each a Status, Word
    count, Label, and from whose point of view (POV) each part should be written.
