  - '[PAGE 20]


    other mobile network elements, like an Open Core network. TIP also holds “plugtests,”
    where different Open RAN vendors test the integration and interoperability of
    their functions. Although these are the most known Open RAN projects, there are
    some other implementations, such as OpenAirInterface [5], which provides an Open
    Source, O-RAN Alliance compliant solution.


    There is some criticism [5] on the Open RAN concept for not having achieved the
    promise of a fully Open Source RAN, with a focus on the difficulty of developing
    the radio infrastructure. In fact, there are several roadblocks that make development
    of SDR functions for mobile networks very difficult or outright impossible (at
    the moment) for small enterprises or community developers. On the one hand, the
    required equipment, which is not only on the SDR boards, but also testing equipment
    to verify functionality and compliance of standards and regulations, is very expensive.
    On the other hand, regulations are also very restrictive: The equipment that is
    used in mobile networks needs to be certified by the appropriate authorities,
    and a special license granted by public authorities is required to transmit radio
    signals in most frequencies (including those where most of cellular communications
    take place). In the long term, there are solutions for some of these problems.
    For instance, expensive measuring equipment might be replaced in the future by
    open source SDR-based implementations. Regulatory roadblocks, on the other hand,
    are harder to overcome. Currently, small enterprises and research centers access
    the spectrum usage license through partnerships with operators, which greatly
    limits the development, and expensive tools such as anechoic chambers (basically
    Faraday chambers that block outgoing high frequency radio signals). In any case,
    the creativity and ingenuity of the open source community has time and again proven
    that it can overcome such problems.


    # The Role of Open Hardware


    One of the main selling points of NFV in the network core and the Open RAN are
    the possibilities for running most of the network functions in off-the-shelf computers
    or common cloud instances. Regarding the underlying hardware, the first name that
    comes to mind to the layman when talking about “off-the-shelf” computers are x86-based
    systems. These systems are easy to acquire and easy to replace, and once their
    lifetime in the network ends, they can be reused for other purposes. Their operation
    and maintenance is low, documentation and expertise abounds, and they have a very
    high level of support from manufacturers and tools. On the downside, x86 systems
    are not very energy efficient, which is an increasingly important concern for
    operators, both in terms of carbon footprint and energy bills.


    More recently, energy-efficient ARM processors are starting to be used in servers.
    Although ARM currently doesn''t have the level of support or the quantity of software
    available for the x86, interest in ARM is growing by the day.


    Finally, no processor discussion would be complete without mentioning RISC-V.
    The RISC-V platform has the advantages of ARM in power consumption (although it
    falls behind in terms of maturity), and it is open source hardware. Potentially,
    small enterprises could extend RISC-V processors to include specific functions
    for the mobile network. Also, thanks to its openness, it is expected that once
    the demand for RISC-V increases, the prices will drop.


    Up to this point, I have discussed the hardware for supporting the software part
    of the mobile network, ie, the core network and the DU, CU, and RIC in the Open
    RAN. What about the RU? Although on the paper it looks just like a small part,
    the RU is fundamental for radio communications and it is one of the hardest parts
    to work on. However, there are several options, such as the USRP devices from
    Ettus Research [6], which offer open source drivers. USRPs are a favorite of researchers
    in the field due to the large community that has gathered around them. Another
    commercial option is the LimeSDR [7] boards, which are open source hardware. They
    are more cost effective than USRPs and are starting to be adopted by the community.
    They are also used in several commercial RAN solutions developed by integrators
    such as Amarisoft. The HackRF [8] and PlutoSDR [9] devices, which are also open
    source, are very cheap alternatives that can be acquired by community developers.
    Although these devices are not as powerful as LimeSDR or USRPs, they are good
    starting points for learning and exploring Open RAN functions. You can also use
    HackRF and PlutoSDR to start developing much needed auxiliary tools, such as spectrum
    analyzers.


    # Future Perspective


    It is fair to say that Open RAN has not yet achieved the dominance on cellular
    networks that Linux and Apache have over the Internet. But all the elements are
    there, and it just takes some work from motivated individuals, universities, and
    underground companies who see open source as an ally to compete with the large
    manufacturers. In the end, it is very likely that open standards will lead the
    drive toward open hardware and open source software on future mobile networks.
