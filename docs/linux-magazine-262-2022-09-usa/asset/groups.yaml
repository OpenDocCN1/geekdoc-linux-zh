    \n![](img/b40e8bf6cf651f8eebf36f5265123095_39_0.png)\n\n## 以最少的麻烦使用 Homebrew\n\
    ## Homebrew 生存指南\n\nHomebrew 是一个全面的包管理器，凭借其易用性，其 popularity 正在日益增长。\n\n作者：布鲁斯·拜菲尔德\
    \ (Bruce Byfield)\n\nLinux 的包管理器并不缺乏。除了 RPM、DNF 和 dpkg/apt-get / APT 等基础包管理器外，还有据称是通用的\
    \ Flatpak 和 Snap，以及越来越多针对每种编程语言的包管理器。Homebrew [1] 起源于 macOS，在 Linux 上曾被称为 Linuxbrew，在\
    \ Ruby on Rails 社区中尤其流行。然而，最近，由于其易用性，它开始获得更广泛的普及。如果你想从早期开发阶段的项目中安装任何东西，越来越多的迹象表明你需要使用\
    \ Homebrew 来完成此操作。Homebrew 提供非 root 安装、访问发行版仓库之外的开发中软件以及多版本应用程序的选项。此外，如果你维护多个操作系统，你可以在\
    \ Linux、macOS 和 Windows 子系统 for Linux 上使用相同的包管理器命令集。\n\n### 作者简介\n\n布鲁斯·拜菲尔德是一名计算机记者，也是专攻自由和开源软件的自由撰稿人和编辑。除了他的写作项目外，他还教授现场和电子学习课程。业余时间，布鲁斯\
    \ 撰写关于西北海岸艺术的文章（http://brucebyfield.wordpress.com）。他还是 Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客，位于\
    \ https://prenticepieces.com/。\n\n```bash\napt install build-essential procps\
    \ curl file git\n```\n\nHomebrew 将文件安装到 /home/linuxbrew 并将其符号链接到 /usr/local，因此你不需要拥有\
    \ root 权限即可使用它。在安装之前，请通过运行上述命令确保你拥有所有必要的软件包。如果你计划从普通用户账户运行 Homebrew，你还需要设置该账户以访问\
    \ sudo，因为安装脚本可能会询问你的 sudo 密码。\n\n### 清单 1：将 Homebrew 添加到你的 Bash 路径中\n\n```bash\n\
    test -d \"~/linuxbrew\" && eval \"$(~/linuxbrew/bin/brew shellenv)\"\ntest -d\
    \ /home/linuxbrew/.linuxbrew && eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"\
    \n\ntest -r \"~/.bash_profile\" && echo \"eval \\\"$( $(brew --prefix)/bin/brew\
    \ shellenv)\\\"\" >> \"~/.bash_profile\"\necho \"eval \\\"$( $(brew --prefix)/bin/brew\
    \ shellenv)\\\"\" >> \"~/.bash_profile\"\n```\n\n当你准备好时，请使用以下命令安装 Homebrew [2]\
    \ [3]：\n\n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n```\n\n当安装成功时，你会看到 *Installation successful* 的消息，随后是额外的说明（图 1）。这些说明包括使用清单 1\
    \ 中命令序列将 Homebrew 添加到你的 Bash 路径中，每次运行一条命令。由于这些命令都不提供任何反馈，你可以通过运行以下命令来测试 Homebrew\
    \ 是否正确安装：\n\n```bash\nbrew install hello\n```\n\n然后运行 `hello` 命令。如果 Homebrew 没有运行，请运行几次\
    \ `brew update` 和 `brew doctor` 以查看是否存在明显问题（图 2）。如果你仍有问题，请查看在线常见问题列表 [4]。\n\n\
    ```text\nbb@lvarness:~$ /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
    \n==> Checking for `sudo` access (which may request your password)...\n==> This\
    \ script will install:\n/home/linuxbrew/.linuxbrew/bin/brew\n/home/linuxbrew/.linuxbrew/share/doc/homebrew\n\
    /home/linuxbrew/.linuxbrew/share/man/man1/brew.1\n/home/linuxbrew/.linuxbrew/share/zsh/site-functions/brew\n\
    /home/linuxbrew/.linuxbrew/etc/bash_completion.d/brew\n/home/linuxbrew/.linuxbrew/Homebrew\n\
    ==> The following new directories will be created:\n/home/linuxbrew/.linuxbrew/bin\n\
    /home/linuxbrew/.linuxbrew/etc\n/home/linuxbrew/.linuxbrew/include\n/home/linuxbrew/.linuxbrew/lib\n\
    /home/linuxbrew/.linuxbrew/sbin\n/home/linuxbrew/.linuxbrew/share\n/home/linuxbrew/.linuxbrew/var\n\
    /home/linuxbrew/.linuxbrew/opt\n/home/linuxbrew/.linuxbrew/share/zsh\n/home/linuxbrew/.linuxbrew/share/zsh/site-functions\n\
    /home/linuxbrew/.linuxbrew/var/homebrew\n/home/linuxbrew/.linuxbrew/var/homebrew/linked\n\
    /home/linuxbrew/.linuxbrew/Cellar\n/home/linuxbrew/.linuxbrew/Caskroom\n/home/linuxbrew/.linuxbrew/Frameworks\n\
    Press RETURN/ENTER to continue or any other key to abort:\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_40_0.png)\n\
    \n### 关于术语的说明\n\nHomebrew 的一个令人烦恼的特点是，它扩展了其名称的比喻，根据其内容为其目录赋予不同的名称，例如 cellar、rack\
    \ 或 kegs，这使得人们很难知道一个术语如何与另一个术语相关。同样，在安装过程中，输出内容会提到“Pouring”（图 2）。幸运的是，对于许多基本用法，你可以忽略这种不必要的复杂化，但图\
    \ 3 展示了这些不同术语之间的关系。大多数情况下，你只需要知道 formula（配方）即软件包，而 manifest（清单）是软件包的安装脚本。这两个术语打破了比喻，也许这会带来一些宽慰。然而，偶尔，使用例如影响\
    \ kegs 或 racks（即包含多个 formula 的目录）的命令来同时处理多个 formula 可能是最快的方法。如果你需要了解其他术语，可以在线找到摘要\
    \ [5]。\n\n### 使用 brew 命令\n\nHomebrew 的基本操作与大多数包管理器几乎相同。也就是说，它们由基本命令、随后是子命令或操作，以及受影响的特定软件包（如果有）组成。未指定\
    \ formula 的命令适用于 Homebrew 的所有部分，例如 `brew update`。表 1 列出了一组基本命令，以 gcc 为例。当然，这与从发行版仓库安装的任何\
    \ gcc 版本都不同。与 Debian 和其他发行版一样，Homebrew 也维护了一个可用 formula 的网页（与 Homebrew 术语在同一页面上\
    \ [5]）。\n\n| 操作 | 命令 |\n| :--- | :--- |\n| 安装 | brew install gcc |\n| 移除 | brew\
    \ remove gcc |\n| 自动移除依赖项 | brew autoremove |\n| 升级 formula | brew upgrade gcc\
    \ |\n| 升级所有 formula | brew upgrade |\n| 列出已安装的 formula | brew list |\n| 列出可用的\
    \ formula | brew formulae |\n| 搜索 | brew search TEXT |\n\n```text\nbbel@varness:~$\
    \ brew install hello\n==> Downloading https://ghcr.io/v2/homebrew/core/hello/manifests/2.12.1\n\
    ==> Downloading https://ghcr.io/v2/homebrew/core/hello/blobs/sha256:79354d61f4409742f45d514efc42e935d1cf7db214dcf60d3a5b1b800dc12749\n\
    100.0%\n==> Downloading from https://pkg.cs.utah.edu/gcc/gcc/8.1.0/tars/sha256:7935d5d6e08742f45d514efc42e935d1445b12e42c3d9801d1cbc81264c16033\n\
    100.0%\n==> Pouring hello--2.12.1-x86_64_linux.bottle.tar.gz\n\n  /home/linuxbrew/.linuxbrew/Cellar/hello/2.12.1:\
    \ 55 files, 650KB\n==> Running `brew cleanup hello`\n==> Disable this behaviour\
    \ by setting HOMEBREW_NO_INSTALL_CLEANUP.\n==> Hide these hints with HOMEBREW_NO_ENV_HINTS\
    \ (see man brew).\nbb@lvarness:~$\n```\n\n![](img/b40e8bf6cf651f8eebf36f5265123095_40_1.png)\n\
    \n![](img/b40e8bf6cf651f8eebf36f5265123095_41_0.png)\n\n图 3：Homebrew 拥有一套复杂的名称序列，反映了每个目录的内容。\n\
    \n与许多包管理器一样，这八个命令对于大多数用户与 Homebrew 的交互来说已经足够了。然而，Homebrew 还有一个冗长的手册页，由于某种原因并未随其一起安装\
    \ [6]。其中一些选项是专为创建 formula 的开发者设计的，例如 `spellcheck` 或 `type-check` 命令，或者用于存储库的 `analytics`\
    \ 命令，由于篇幅有限，这里将不予讨论，但还有许多选项对于便利或管理目的也很有用。例如，在便利选项中，有 `completion`，它一旦在 Bash、Zsh\
    \ 或 fish shell 中启用，就会通过链接到在线词典来自动完成输入的命令 [7]。同样，由 formula 或 cask 的名称限定的 `home`\
    \ 或 `homepage` 会打开目标的网页，以便你了解更多信息。此外，一旦你掌握了 Homebrew 的术语，就有用于批量处理 formula 而非单独处理的子命令和选项。\n\
    \n管理选项包括一些有助于保持系统最新的功能。例如，`cleanup` 操作使用 `--prune DAYS` 选项来移除 Homebrew 缓存中超过特定天数的文件，或使用\
    \ `-s` 完全移除缓存。另一个潜在有用的操作是 `outdated`，它列出有新版本可用的 formula。当配合使用 `migrate` 操作时，这特别有用，该操作接受\
    \ formula 在较新版本中名称更改时的选项；或者 `bump`，它设置较旧版本是否应更新。\n\n### 一款出色的应用\n\nHomebrew 是一个全面的包管理器。尽管它只有\
    \ 13 年的历史，但在许多方面，它像更久远的 apt-get 或 Yum 一样功能强大。它甚至包含可能在其他包管理器中很有用的功能。然而，Homebrew\
    \ 高级功能的访问部分被不必要的术语所阻碍。此外，尽管其 formula 数量必须以千计，但它们远未达到例如 Debian 的 60,000 个软件包的水平。只有在\
    \ Ruby on Rails 社区中，Homebrew 才可能占主导地位。对于我们其他人来说，这些笔记足以让我们在开发者决定使用 Homebrew 时，以最小的麻烦和轻微的便利性损失使用它。\n\
    \n### 参考信息\n\n-   [1] Homebrew：[https://brew.sh/](https://brew.sh/)\n-   [2] 安装\
    \ Homebrew：[https://docs.brew.sh/Installation](https://docs.brew.sh/Installation)\n\
    -   [3] 如何在 Linux 上安装和使用 Homebrew：[https://www.digitalocean.com/community/tutorials/how-to-install-and-use-homebrew-on-linux](https://www.digitalocean.com/community/tutorials/how-to-install-and-use-homebrew-on-linux)\n\
    -   [4] 常见问题：[https://docs.brew.sh/Common-Issues](https://docs.brew.sh/Common-Issues)\n\
    -   [5] 术语和 formula：[https://docs.brew.sh/Formula-Cookbook#homebrew-terminology](https://docs.brew.sh/Formula-Cookbook#homebrew-terminology)\n\
    -   [6] 手册页：[https://docs.brew.sh/Manpage](https://docs.brew.sh/Manpage)\n-  \
    \ [7] Shell 补全：[https://docs.brew.sh/Shell-Completion](https://docs.brew.sh/Shell-Completion)\n\
    \n"
