    正如美国军部的 DARPA（国防部高级研究计划局）做出了巨大贡献并帮助塑造了你今天所熟知并喜爱的互联网，类似的军转民用转化也产生了当今互联网上常用的网络发现工具：`ping`
    命令。`ping` 命令的渊源源于海军船只发送声纳脉冲，以检测附近是否有其他船只或地理特征。


    作为强大的安全工具 `Nmap` ([`nmap.org`](https://nmap.org)) 提供的网络发现功能的一部分，它还包含了对标准 `ping`
    命令的一项强大改进的访问，称为 `Nping` ([`nmap.org/nping/`](https://nmap.org/nping/))。如果你用过 `Nmap`，那么你就知道，在可靠性和经过深思的功能方面，由
    Nmap 项目创建的任何工具都是可靠的。


    让我们来看看 `Nping` 工具如何帮助你更深入地了解你的系统和网络运行情况，挖掘远程和本地连接。


    ## 功能


    从表面上看，你可能认为 `Nping` 的功能相对有限。毕竟，当你发送一个 ping 时，你只是发送一个问题然后简单等待回答。虽然 `Nping` 仍然不是一个完成的软件，但可以说它是一个非常全面且复杂的网络工具。


    你将从习惯语法开始。你需要以超级用户 `root` 的身份登录以执行某些 `Nping` 命令，在一种情况下，你将查看 TCP 模式。你的第一个练习将向你的本地机器发送
    TCP “ping”。从标准 `ping` 的 man 页面中，你可以看到 `ping` 的正常操作“使用 ICMP 协议强制的 ECHO_REQUEST
    数据报来诱发主机或网关的 ICMP ECHO_RESPONSE 报答”。换句话说，这里涉及一个问题和一个问答。


    如果你好奇的话，我将在这些示例中使用我的本地机器，以避免骚扰其他机器并导致防火墙日志中充斥可疑活动。与所有白帽工具一样，你应该谨慎地使用它们。


    令人印象深刻的 `Nping` 不仅关注 ICMP，还是标准 `ping` 命令的一个设计精良的扩展，还可以与许多协议进行通信。它还提供了易于理解的结果。


    如果你还没有安装它，可以按照以下方式安装 `Nping`。


    在 Debian 派衍生版上，只需使用以下命令安装 `Nmap` 软件包：


    ```

    # apt-get install nmap

    ```


    在 Red Hat 派衍生版上，使用此命令安装 `Nmap`：


    ```

    # yum install nmap

    ```


    ## TCP


    回到 TCP（传输控制协议）示例。你将在本地机器上运行以下命令，这样就不会有防火墙问题需要担心，也不会干扰其他系统管理员：


    ```

    # nping -c1 --tcp -p 80,443 localhost

    ```


    在这里，你通过 TCP 发送一个 ping 数据包（带有 `-c1` 计数选项）到本地机器的 TCP 端口 80 和 443。此命令的输出可能看起来列表 5.1。


    你可以从列表 5.1 中看到你收到了来自 TCP 端口 80 和 TCP 端口 443 的回复。根据 `--c` 选项，在每个端口发送一次数据（且数据已返回）后，ping
    会自动停止。如果没有明显的有效响应，可能会看到类似的内容：


    ```

    nping_event_handler(): READ-PCAP killed: Resource temporarily unavailable

    nping_event_handler(): TIMER killed: Resource temporarily unavailable

    ```


    现在你已经了解了一些 `Nping` 的外观以及它如何对你的输入做出反应，因此不要意外发现你可以随时使用无分类域间路由（CIDR）网络表示（例如 10.10.10.0/24）。你现在将保持基础，并查看如何指定一个端口范围进行
    ping，而不是像你刚刚那样将它们列在列表中指定。


    考虑 Unix 类型机器上的“特权端口”（privileged ports）。这些端口在过去被称为几个名称（例如超级用户端口或原始端口），但本质上，只有 `root`
    用户权限打开它们。这是最初的一种安全特性，意味着如果你远程连接到这些端口号之一，你可以很有理由认为运行在上面的服务是真实的。换句话说，它是由 `root`
    用户生成的，而不是标准用户。以下是如何使用 `Nping` 检查所有特权 TCP 端口：


    ```

    # nping -c1 --tcp -p 0-1024 localhost

    ```


    `Nmap` 使用了一种几乎肯定与其他网络工具不同的方法，以不寻的方式处理多个主机和端口号。为了效率起见，如果指定了多个目标机器，`Nping` 不会简单地向列表中的第一个机器发送查询并耐心等待响应。相反，它采用了一种简单但聪明的轮询（round-robin）方法，交替联系机器，这样在等待响应时就不会给用户引入任何延迟。对于多个主机，这同样适用于多个端口，让目标在响应
    `Nping` 的下一个端口之前有一个恢复的机会。


    ## 解释器器


    `Nping` 可以充当解释器。如果你使用 `--tcp-connect` 选项，你就在使用 `Nping` 的 TCP 连接模式。你不需要使用 `root`
    权限来发送原本将是原始数据包的伪造 IP 地址并关闭会话。


    如果作为三个独立的命令，操作 TCP 握手可能如下：


    ```

    # nping -p 80 --flags rst -c1 localhost

    # nping -p 80 --flags syn -c1 localhost

    # nping -p 80 --flags ack -c1 localhost

    ```


    ## UDP


    你也可以通过 `--udp` 选项选择使用 UDP 数据包。通常 TCP 和 UDP 数据包嵌入在 IP 包中，但正如我所说的，没有 root 权限，你无法查看数据包的内容。UDP
    数据包也是如此。


    UDP ping 有时可以发现其他协议失败的机器。UDP ping 可能会绕过防火墙并报告防火墙后是否有设备正在监听。这是你工具箱中非常有用的补充。简单的示例命令可能如下：


    ```

    # nping --udp localhost

    ```


    当我尝试非 root 用户的情况下对本地机器运行此命令时，我看到了如下反馈：


    ```

    SENT (0.0069s) UDP packet with 4 bytes to localhost:40125 (127.0.0.1:40125)

    ERR: (0.0070s) READ to 127.0.0.1:40125 failed: Connection refused

    ```


    然而，作为超级用户 root，我可以如下所示完成事务：


    ```

    SENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64 id=64074 iplen=28

    RCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable (type=3/code=3) ttl=64
    id=18756 iplen=56

    ```


    你可以看到，两个示例中的 UDP ping 流量都指向 UDP 端口 40125。


    ## ICMP


