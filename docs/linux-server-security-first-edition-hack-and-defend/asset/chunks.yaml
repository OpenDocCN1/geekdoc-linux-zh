    还有许多选项留给你自行探索。例如，在示例命令旁边运行规则的选项简单就是 `-r rules/specific_rule.rule`。


    我承诺过让你查看一些相应的哈希值和攻击模式。哈希的数量太多，无法列出，但 Hashcat 网站提供了它们，以及帮助所需的详细信息，地址为 [`http://hashcat.net/wiki/doku.php?id=example_hashes`](http://hashcat.net/wiki/doku.php?id=example_hashes)。


    你可以使用的某些攻击模式（其中 0 被称为“直击”，换句话说匹配字典或单词列表）如表 9 所示。


    | 数字 | 攻击模式 |

    | :--- | :--- |

    | 0 | 直击（字典或单词列表） |

    | 1 | 组合 |

    | 3 | 破解（掩码攻击） |

    | 6 | 混合 |


    ## 掩码攻击


    掩码攻击的主要原理是缩小空间大小，从而加快运行时间。文档提供的一个巧妙示例是，通过 Hashcat 的创新技术，你可以将密码 `Julia984` 的恢复时间从大约四年缩短到四十分钟。


    你通过在标准命令末尾添加掩码来运行掩码攻击，如下：


    ```

    # hashcat -m 1800 -a 0 -o discovered_passwords.txt hashes.txt wordlist.txt -1
    ?dabcdef

    ```


    在这种情况下，添加的 `-1 ?dabcdef` 要求 Hashcat 遍历 `0123456789abcdef`。


    根据文档，此掩码 `-1 ?l?d?u` 提供完整的 7 位 ASCII 字符集，称为字母数字空格。Hashcat 有许多内置字符集选项，例如 `?l`（代表
    a 到 z 的所有小写字母）和 `?u`（代表 A 到 Z 的所有大写字母）。


    你可以在此处找到更多关于掩码攻击的细节：[`https://hashcat.net/wiki/doku.php?id=mask_attack`](https://hashcat.net/wiki/doku.php?id=mask_attack)。


    ## oclHashcat


    使用 oclHashcat 和 Hashcat 需要非常相似知识水平，因为它们的操作几乎相同。尽管它们之间有一些不同之处 —— 例如，与 Hashcat 相比，oclHashcat
    加载字典的方式 —— 如果切换到 oclHashcat，可以预期有一个平缓的学习曲线。


