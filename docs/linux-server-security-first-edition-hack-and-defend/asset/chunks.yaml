    command:


    ```

    # ncat -l 127.0.0.1 80 < index.http

    ```


    By the way, if you''ve just thought about serving all sorts of other content using
    netcat, then you''re correct. If you''ve ever manually typed an SMTP conversation
    in via the command line, then you probably won''t be surprised to discover that
    the `<CR><LF>` option — the `-C` option, that is — works just as well with e-mail
    conversations.


    ## Transferring Files


    Think for a moment about moving a file from one host to another just using netcat
    at either end. You don''t need complex SFTP daemons or resource-demanding applications
    for this.


    You''ll call your two example machines Lionel and Luis, and you''ll watch Lionel
    passing a file to Luis. On Luis, you will run this command:


    ```

    Luis> # ncat -l 1234 > bootstrap.pp

    ```


    You can see that the `-l` switch simply asks netcat to “listen” for inbound traffic.
    You''re listening for traffic on TCP port 1234, and you''re outputting the inbound
    data to a file called `bootstrap.pp`; this file is a puppet manifest that you
    don''t want to copy and paste between hosts because it''s long and complex. Now
    that Luis is expecting to be passed some data, this is what you enter on Lionel
    to send it:


    ```

    Lionel> # ncat --send-only Luis 1234 < bootstrap.orig

    ```


    Having run this command on Lionel, the netcat instance on Luis will automatically
    quit. Before Luis has quit, it will output the contents of the file `bootstrap.orig`
    on Lionel to the file `bootstrap.pp` on Luis — a simple, clever action. The only
    things that might trip you up are, first, the versions (just use ncat for simplicity)
    and second, the firewall. Open your firewall carefully if you have firewall issues.


    The ncat documentation also shows you how to use the `tar` command for moving
    multiple files. Consider this example:


    ```

    Luis> # ncat -l | tar xzv

    Lionel> # tar czv <list of files> | ncat --send-only Luis

    ```


    As you can see, you''re sending data from Lionel to Luis again, this time piping
    through the `tar` command at both ends. My favorite example is using compression
    to speed up the transfer (you can easily move massive files too) and, of course,
    transfer less data. Look at this method using compression:


    ```

    Luis> # ncat -l | bzip2 -d > massive.file.bz

    Lionel> # cat massive.file.orig | bzip2 | ncat --send-only Luis

    ```


    In this example, you''re using the trusty `bzip2` command for the compression
    and then duplicating `massive.file.orig` on Lionel to a file called `massive.file.bz`
    on Luis. Note that you''re using the `cat` command to read `massive.file.orig`
    and to pipe it into `bzip2`; that is not a typing mistake.


    ### Chatting Example


    Let''s have some fun chatting with a user on another computer. You may have seen
    the `wall` command in the past, which broadcasts to all logged-in users. You can
    use netcat for two-way chatting. Pick a port on the recipient machine (Luis again)
    and politely ask netcat to listen, as follows:


    ```

    Luis> # ncat -l 1234

    ```


    Next, run the following command. Having run that command, anything you type on
    Lionel (hitting the Enter key afterward to send each line of chat content) will
    be mirrored on Lionel''s console, and vice versa.


    ```

    Lionel> # ncat Luis 1234

    ```


    In the following snippet, you can see how a conversation looks from Lionel''s
    perspective.


    ```

    # ncat 127.0.0.1 1234

    Want to hear my two rules for success?

    Ok!

    Rule #1: Never tell anyone everything that you know.

    Ok, and…

    Hello, are you there?

    ```


    This example shows one of many unexpected features that are included with netcat.
    I''ll leave that functionality for you to explore and continue to examine some
    of the other options that are available. Netcat almost suffers from an embarrassment
    of riches in relation to its feature set, and there are simply far too many to
    cover here.


    ## Chaining Commands Together


    One of the nice features included with ncat (but not nc) is the ability to chain
    multiple instances into a single command. This makes ncat very versatile; you
    can simply pipe the output of one netcat command into another, Unix style. Let''s
    look at an example from the netcat documentation. For the following task, I''ll
    introduce the machine “Neymar” as your third host. Lionel is still your sender,
    and in this scenario Luis is the man in the middle. Take a moment to look at these
    commands:


    ```

    Neymar> # ncat -l 1234 > my_new_big_file.txt

    Luis> # ncat -l 1234 | ncat Neymar 1234

    Lionel> # ncat --send-only Luis 1234 < lengthy_file.txt

    ```'
