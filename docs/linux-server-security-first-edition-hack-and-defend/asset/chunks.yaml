    different component of your system, as I have already mentioned. Simply put, oclHashcat
    works with video cards as opposed to CPUs. There are two important software versions
    to distinguish between, and each suits two popular GPUs:


    *   cudaHashcat, which is for use on Nvidia video cards


    *   oclHashcat, which works with AMD video cards


    GPUs are much faster than CPUs (when set up correctly) because they are solely
    designed to crunch numbers quickly, usually to process graphics. While obviously
    designed for speed themselves, in terms of performance, CPUs can get distracted
    with their additional, inclusive feature sets, causing a reduction in throughput.
    As a result, GPUs are a good choice for computing large amounts of data because
    they can be optimized much better. It''s also possible to scale GPU output almost
    seamlessly by connecting them together in a chain, making it easier to harness
    their combined power. To give you an idea of how fast GPUs can be, if you were
    using rainbow tables and divided the keyspace (of the 95 characters available
    on a US keyboard), you might hit 10 trillion plain-text tests per second!


    In terms of learning Hashcat and oclHashcat, I would recommend getting Hashcat
    working first and then reading up on how to get your video card''s GPU drivers
    working. There''s more information at [`http://hashcat.net/oclhashcat/`](http://hashcat.net/oclhashcat/).


    If it causes confusion, `oclHashcat-plus` is no longer in use and is considered
    deprecated. As a result, there''s no benefit in the “plus” version.


    ## Hashcat-Utils


    One additional component of the Hashcat suite that is also worth mentioning is
    a group of utilities called Hashcat-utils. This collection of useful tools can
    be downloaded from [`http://hashcat.net/wiki/doku.php?id=hashcat_utils`](http://hashcat.net/wiki/doku.php?id=hashcat_utils).


    The tools include combinator, which is a standalone program from which you can
    run combinator attacks. You can find more information at [`https://hashcat.net/wiki/doku.php?id=combinator_attack`](https://hashcat.net/wiki/doku.php?id=combinator_attack).


    You can also trim and cut up a wordlist file with the `cutb` tool, which you can
    use to clean up common, unwanted prepended or appended characters in a wordlist
    file.


    Another tool in the bundle, `rli`, is similar to the Unix-type command, and simply
    removes duplicate files, after comparing a file to one or more other files.


    It''s definitely worth exploring these utilities further to increase your knowledge
    of how Hashcat works.


    ## Summary


    In this chapter, you looked at some of the theory behind password attacks. I also
    covered the importance of the number of combinations that a character set includes,
    the length of passwords, and how their combination affects keyspace. Finally,
    I described hashing and salting, which ensure that the time it takes to crack
    a password is significantly increased.


    Being able to efficiently crack a password takes years to master, and it''s certainly
    an area with many facets. However, the venerable Hashcat helps you to make light
    work of the learning process. It also has a detailed FAQ that can be found at
    [`http://hashcat.net/wiki/doku.php?id=frequently_asked_questions`](http://hashcat.net/wiki/doku.php?id=frequently_asked_questions).


    Having now seen the methods that an attacker will use to crack your passwords,
    and the ways that you can make their work more difficult, you should pay close
    attention if you discover traces of any of the tools that I''ve discussed on your
    own machines. With your new-found power, there''s hopefully no need to remind
    you to use your skills responsibly.


    # Chapter 10


    SQL Injection Attacks


    One of the most popular types of online attacks is known as SQL injection, sometimes
    abbreviated as SQLi. These attacks involve the insertion of database code using
    Structured Query Language (SQL), where attackers can retrieve data from databases
    or overwrite existing data.


    You might be surprised to learn that, according to OWASP (the Open Web Application
    Security Project), which is a charitable organization that promotes the securing
    of software, SQLi was the number one threat to online services in 2013, and listed
    as the most common threat at [`https://www.owasp.org/index.php/Top_10_2013-Top_10`](https://www.owasp.org/index.php/Top_10_2013-Top_10).


    This chapter looks at what these attacks involve, how to protect your websites
    against them, and finally how to launch them yourself for the purposes of penetration
    testing.


    Needless to say, this is a wide and complex area that requires a degree of background
    knowledge to carry out more sophisticated attacks. You might be surprised how
    easy it is, however, having run only a handful of commands and with only a little
    database knowledge, to bring a vulnerable online service to its knees. For that
    reason alone, it''s imperative that IT professionals be aware of the risks that
    SQL injections pose and how to mitigate their effects.


    ## History


    Considering its simplicity, the fact that SQLi is so effective makes it a formidable
    type of attack.


    Take note, junior developers, because when it comes to security matters, sysadmins
    tend not to be directly responsible for such attacks occurring. This is because
    much of the time, the exploits are possible due to code that does not escape special
    characters properly. In addition to its simplicity, another cause for concern
    is that this type of attack has reportedly been known about since 1998\. An issue
    of *Phrack Magazine*, published in December of that year, first announced a broad,
    sweeping vulnerability against websites. The horror began to unfold over time,
    and it became obvious that several automated tools could be used to sweep the
    web, looking for sites, and then deface or steal data from them as they saw fit.


    It didn''t stop there, however. As phishing attacks became more popular (where
    attackers trick users into revealing information about themselves), cunning attackers
    went about completely rebranding a website, by injecting the necessary code to
    persuade a visitor that they were visiting a bona fide website.


    For a number of years, I ran a very small co-location server ISP for relatively
    tech-savvy customers. On at least three occasions, our co-located server customers,
    who had unwittingly been less diligent with their server-side scripting, succumbed
    to phishing attacks. From the mid-2000s onwards, over the space of just a few
    years, the U.S. Federal Bureau of Investigation was in touch with us, a bank on
    one occasion, and a white hat security service on another, informing us that a
    customer server had been hacked. So, even in such a small organization, a bogus
    copy of a popular auction site and two banking websites had been cloned and used
    in phishing attacks on our networks within a very short space of time. It quickly
    became obvious that SQLi attacks were becoming popular among those with nefarious
    intent.


    In reaction to the common security threat, sysadmins and developers took note
    and began hardening code. I remember diligently escaping special characters with
    every user input component on a PHP-based website around that time to avoid SQLi
    attacks.


    ## Basic SQLi


    As I have already alluded to, the main premise behind SQLi is illegitimately retrieving
    code from or injecting code into a database.


    To avoid these issues, you can no longer expose queries to the outside via server-side
    languages, which will make your websites far less fluid and less useful as a result.
    Failing that, you can make sure that all attack vectors are covered. The easiest
    way to achieve this is to filter all input that you receive from visitors. In
    other words, at every point on your website where a user can input data, you need
    to take relevant precautions within your code. This involves parsing the input
    into a friendly format before that data is sent to your database.'
