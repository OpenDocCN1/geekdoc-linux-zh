    ## Zenmap


    There are times, especially if you''re dealing with many target machines across
    different networks, that you need some help with your results. Imagine being able
    to add your results to a database so that you can search for common patterns with
    ease across historical scans.


    Step forward, Zenmap ([`https://nmap.org/zenmap/`](https://nmap.org/zenmap/)).
    The official GUI scanner for Nmap, the well-designed Zenmap is also free and appropriate
    for users of all levels. A command creator is included to assist in making up
    complex commands and the ability to perform historical searching via a database.
    It''s also possible to create profiles for commonly run commands so you''re not
    continually retyping them.


    This highly useful graphical cross-platform tool is available for Linux, BSD,
    Mac OS, and Windows, among other systems.


    Another nice feature is that you can run a `diff` and then compare the results
    of two scans in order to more easily discover what happened between then and now.


    For users who frequently perform scans, and indeed any user who is new to security,
    Zenmap should be the tool of choice. Users of all experience levels should find
    the learning curve considerably less steep by using Zenmap first. [Figure 7.1](#c07.xhtml_c07-fig-0001)
    shows what you can expect from using the graphical Zenmap on a Desktop Manager
    in Linux.


