- fmt: "\nA full tutorial on how you might go about securing your code can be left\
    \ for another day. However, I will give you a quick refresher using one popular\
    \ programming language. Before that, I'll remind you of some simple ways that\
    \ SQLi works.\n\nAs I've said, simply defacing a website is far from the only\
    \ damage that intercepted SQL can cause. Consider this SQL statement, for example:\n\
    \n```sql\nsql-server> DROP TABLE special-offers;\n```\n\nBy knowing table names,\
    \ you can completely delete a table from a database. Aside from destructive behavior,\
    \ I haven't mentioned the extraction of usernames and passwords from a database.\
    \ With criminal intent, a successful SQL attack is without question a prize worth\
    \ pursuing. Some sizeable brands have fallen victim to poorly programmed code\
    \ and SQLi. Reportedly, Yahoo, Adobe, LinkedIn, and Sony Music might all be included\
    \ on a long list of victims. Of course, without being one of the attackers, or\
    \ the staff who had to recover services affected by such attacks, I can only conjecture\
    \ to what extent these attacks involved SQLi. A SQLi Hall of Shame can be found\
    \ at `http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/`. Although the\
    \ list may not be completely accurate, I am sure you will agree that it is a compelling\
    \ read.\n\nA moment ago, I referred to a programming language. I'll use what is\
    \ reportedly the world's most popular server-side scripting language, `PHP`, as\
    \ an example to quickly demonstrate how SQLi works. As well as being used directly\
    \ on millions of websites, the powerful `PHP` is used in the world's most popular\
    \ Content Management System (CMS), WordPress (`https://wordpress.com`), and many\
    \ other dynamic website applications such as Joomla! (`https://www.joomla.org`).\
    \ In short, `PHP` is all over the web and is an easy target for attackers if an\
    \ exploit is discovered.\n\nLet's look at another example, but this time in `PHP`:\n\
    \n```php\n$input = $variable[3];\n$dbquery = \"SELECT id, item, price FROM specialoffers\
    \ ORDER BY id LIMIT 15 OFFSET $input;\";\n```\n\nLooking at the top line, you\
    \ can see that you are not filtering the variable called `$input`. This means\
    \ that when the variable is used on the second line within the SQL statement,\
    \ it could potentially include any code that an attacker wanted to use. With crafted\
    \ code being injected, all sorts of havoc can be caused.\n\nAnother example would\
    \ be updating the sysop user's password. For example, a normal SQL statement inside\
    \ `PHP` code might look like this:\n\n```php\n$dbquery = \"UPDATE credentials\
    \ SET passwd='$password' WHERE userid='$id';\";\n```\n\nBy appending SQL to this\
    \ statement, such as `or userid like '%sysop%'`, your SQL becomes much less strict\
    \ and you ask the database to quickly search for other privileged usernames similar\
    \ to sysop, such as sysops, and then update their passwords too.\n\nWorryingly,\
    \ it's also possible to execute shell commands that can be included within SQL.\
    \ Certain database servers allow access to operating system commands using this\
    \ method.\n\n## Mitigating SQLi in PHP\n\nAs I've said, this subject area is too\
    \ large to cover in detail, but I would be remiss not to briefly look at how to\
    \ filter SQL inputs to help mitigate SQLi attacks. There are a variety of `PHP`\
    \ functions that assist you in this endeavor. As of this writing, `PHP` is making\
    \ a significant move to version `7.0.0` from its current version `5.6.16` (although\
    \ it will likely be incremented).\n\nOne caveat would be that in older versions\
    \ (up to `5.3.0`), inside your main `PHP` config file (`php.ini`) it was possible\
    \ to filter (or escape) all input data via `PHP` by using `magic_quotes_gpc`.\
    \ This was apparently deprecated because it was relied upon too much and didn't\
    \ always escape characters in the way that meant applications were secured. In\
    \ essence, magic quotes weren't designed to be used for security purposes but\
    \ were employed as such.\n\nTo protect the variable used in the first SQL example,\
    \ you might want to run your user input through the `stripslashes` function. The\
    \ example looked like this:\n\n```php\n$input = $variable[3];\n```\n\nWith `stripslashes`\
    \ being used, it might look something like this:\n\n```php\n$input = stripslashes($variable[3]);\n\
    ```\n\nAs you would guess, this means you are removing slashes to help protect\
    \ against unwelcome input. There's also `trim` for removing white space from a\
    \ variable, which can be used in the same way, as well as `strip_tags` for removing\
    \ HTML and other markup tags. These can all be useful and possibly chained together\
    \ for ease, like this:\n\n```php\n$input = stripslashes((trim($input));\n```\n\
    \nIn addition, up to `PHP` version `5.5.0`, you could use the `mysql_real_escape_string`\
    \ function to clean up individual strings as follows:\n\n```php\n$input = mysql_real_escape_string($input);\n\
    ```\n\nHowever, as of version `7.0.0` and up, you almost always want to use an\
    \ improved driver called `MySQLi` (which stands for MySQL improved) to counter\
    \ SQLi. Thanks to this enhancement, you can employ a more advanced way to strip\
    \ unnecessary and potentially dangerous characters out of the code being executed.\
    \ An example using `mysqli` doesn't look all that different from the previous\
    \ example:\n\n```php\n$input= mysqli_real_escape_string($input);\n```\n\nUsing\
    \ `MySQLi`, you connect to your database using a different method, as:\n\n```php\n\
    $mysqli = new mysqli(\"localhost\", \"userid\", \"passwd\", \"DB_name\");\n```\n\
    \nAnother approach to be aware of has been available since earlier versions of\
    \ `PHP` and makes use of PHP Data Objects (PDO). There's a helpful discussion\
    \ here: `http://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php`.\n\
    \nIt's debatable as to which methodology is the best to use, but PDO seems very\
    \ popular. An example of PDO would look like this:\n\n```php\n$input = $pdo->prepare('SELECT\
    \ * FROM special_offers_table WHERE offer = :specialoffer');\n$input->execute(array('name'\
    \ => $specialoffer));\n```\n\nThis newer, preferred approach filters out your\
    \ parameters using the new library. Note the question mark where the variable's\
    \ value would have gone previously. \n\n```php\n$input = $mysqli->prepare(\"INSERT\
    \ INTO table_name (column_name) VALUES (?)\");\n$input->bind_param(\"s\", $actual_user_input);\n\
    $input->execute();\n$input->close();\n```\n\n## Exploiting SQL Flaws\n\nNow that\
    \ you've looked at a few different ways to secure against SQLi, you will learn\
    \ how a hacker might attack your online service. Although there are a number of\
    \ tools available, I'll focus on `sqlmap` (`http://sqlmap.org`), which is a popular,\
    \ open-source tool among hackers, forensic scientists, and penetration testers.\
    \ It's possible to wreak chaos with this highly sophisticated tool, so make sure\
    \ that you are fully aware of the damage you can do when testing it on your own\
    \ servers, never mind servers that belong to others. I would definitely recommend\
    \ using a development server or sandbox virtual machine to be safe.\n"
  raw: 'A full tutorial on how you might go about securing your code can be left for
    another day. However, I will give you a quick refresher using one popular programming
    language. Before that, I''ll remind you of some simple ways that SQLi works.


    As I''ve said, simply defacing a website is far from the only damage that intercepted
    SQL can cause. Consider this SQL statement, for example:


    ```

    sql-server> DROP TABLE special-offers;

    ```


    By knowing table names, you can completely delete a table from a database. Aside
    from destructive behavior, I haven''t mentioned the extraction of usernames and
    passwords from a database. With criminal intent, a successful SQL attack is without
    question a prize worth pursuing. Some sizeable brands have fallen victim to poorly
    programmed code and SQLi. Reportedly, Yahoo, Adobe, LinkedIn, and Sony Music might
    all be included on a long list of victims. Of course, without being one of the
    attackers, or the staff who had to recover services affected by such attacks,
    I can only conjecture to what extent these attacks involved SQLi. A SQLi Hall
    of Shame can be found at [`http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/`](http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/).
    Although the list may not be completely accurate, I am sure you will agree that
    it is a compelling read.


    A moment ago, I referred to a programming language. I''ll use what is reportedly
    the world''s most popular server-side scripting language, PHP, as an example to
    quickly demonstrate how SQLi works. As well as being used directly on millions
    of websites, the powerful PHP is used in the world''s most popular Content Management
    System (CMS), WordPress ([`https://wordpress.com`](https://wordpress.com)), and
    many other dynamic website applications such as Joomla! ([`https://www.joomla.org`](https://www.joomla.org)).
    In short, PHP is all over the web and is an easy target for attackers if an exploit
    is discovered.


    Let''s look at another example, but this time in PHP:


    ```

    $input = $variable[3];

    $dbquery = "SELECT id, item, price FROM specialoffers ORDER BY id LIMIT 15 OFFSET
    $input;";

    ```


    Looking at the top line, you can see that you are not filtering the variable called
    `$input`. This means that when the variable is used on the second line within
    the SQL statement, it could potentially include any code that an attacker wanted
    to use. With crafted code being injected, all sorts of havoc can be caused.


    Another example would be updating the sysop user''s password. For example, a normal
    SQL statement inside PHP code might look like this:


    ```

    $dbquery = "UPDATE credentials SET passwd=''$password'' WHERE userid=''$id'';";

    ```


    By appending SQL to this statement, such as `or userid like ''%sysop%''`*,* your
    SQL becomes much less strict and you ask the database to quickly search for other
    privileged usernames similar to sysop, such as sysops, and then update their passwords
    too.


    Worryingly, it''s also possible to execute shell commands that can be included
    within SQL. Certain database servers allow access to operating system commands
    using this method.


    ## Mitigating SQLi in PHP


    As I''ve said, this subject area is too large to cover in detail, but I would
    be remiss not to briefly look at how to filter SQL inputs to help mitigate SQLi
    attacks. There are a variety of PHP functions that assist you in this endeavor.
    As of this writing, PHP is making a significant move to version 7.0.0 from its
    current version, 5.6.16 (although it will likely be incremented).


    One caveat would be that in older versions (up to 5.3.0), inside your main PHP
    config file (`php.ini`) it was possible to filter (or escape) all input data via
    PHP by using `magic_quotes_gpc`. This was apparently deprecated because it was
    relied upon too much and didn''t always escape characters in the way that meant
    applications were secured. In essence, magic quotes weren''t designed to be used
    for security purposes but were employed as such.


    To protect the variable used in the first SQL example, you might want to run your
    user input through the `stripslashes` function. The example looked like this:


    ```

    $input = $variable[3];

    ```


    With stripslashes being used, it might look something like this:


    ```

    $input = stripslashes($variable[3]);

    ```


    As you would guess, this means you are removing slashes to help protect against
    unwelcome input. There''s also `trim` for removing white space from a variable,
    which can be used in the same way, as well as `strip_tags` for removing HTML and
    other markup tags. These can all be useful and possibly chained together for ease,
    like this:


    ```

    $input = stripslashes((trim($input));

    ```


    In addition, up to PHP version 5.5.0, you could use the `mysql_real_escape_string`
    function to clean up individual strings as follows:


    ```

    $input = mysql_real_escape_string($input);

    ```


    However, as of version 7.0.0 and up, you almost always want to use an improved
    driver called `MySQLi` (which stands for MySQL improved) to counter SQLi. Thanks
    to this enhancement, you can employ a more advanced way to strip unnecessary and
    potentially dangerous characters out of the code being executed. An example using
    `mysqli` doesn''t look all that different from the previous example:


    ```

    $input= mysqli_real_escape_string($input);

    ```


    Using MySQLi, you connect to your database using a different method, as follows:


    ```

    $mysqli = new mysqli("localhost", "userid", "passwd", "DB_name");

    ```


    Another approach to mitigating SQLi attacks is when you use prepared statements.
    The idea behind this security addition is for the database engine to process SQL
    completely separately from any parameters being used. In theory, this means an
    attacker cannot inject code into the query at all. An example might look like
    this:


    ```

    $input = $mysqli->prepare("INSERT INTO table_name (column_name) VALUES (?)");

    $input->bind_param("s", $actual_user_input);

    $input->execute();

    $input->close();

    ```


    This newer, preferred approach filters out your parameters using the new library.
    Note the question mark where the variable''s value would usually have gone previously.
    The line containing `execute` pulls together all of the previous parameters. Of
    additional help is that such a function only needs to be read once, so if it''s
    run a number of times on a few pages, then the PHP engine does less work.


    Another approach to be aware of has been available since earlier versions of PHP
    and makes use of PHP Data Objects (PDO). There''s a helpful lengthy discussion
    here: [`http://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php`](http://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php).


    It''s debatable as to which methodology is the best to use, but PDO seems very
    popular. An example of PDO would look like this:


    ```

    $input = $pdo->prepare(''SELECT * FROM special_offers_table WHERE offer = :specialoffer'');

    $input->execute(array(''name'' => $specialoffer));

    ```


    There''s some well-written information about PDO at [`http://whateverthing.com/blog/2014/08/28/the-heart-of-darkness/`](http://whateverthing.com/blog/2014/08/28/the-heart-of-darkness/).
    It''s worth reading, if for no other reason than to help you choose between methods
    in the later versions of PHP (version 7.0.0 and onwards) to combat SQLi threats.


    ## Exploiting SQL Flaws


    Now that you''ve looked at a few different ways to secure against SQLi, you will
    learn how a hacker might attack your online service. Although there are a number
    of tools available, I''ll focus on sqlmap ([`http://sqlmap.org`](http://sqlmap.org)),
    which is a popular, open-source tool among hackers, forensic scientists, and penetration
    testers. It''s possible to wreak chaos with this highly sophisticated tool, so
    make sure that you are fully aware of the damage you can do when testing it on
    your own servers, never mind servers that belong to others. I would definitely
    recommend using a development server or sandbox virtual machine to be safe.'
