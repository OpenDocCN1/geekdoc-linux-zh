  trans: "\n让我们来看看安装为你的系统提供端口敲击（port knocking）功能的包。该包名为 `knockd`，根据你的系统有不同的安装方式。\n\
    \n在 Debian 派系上，你按照以下方式安装包：\n\n```\n# apt-get install knockd\n```\n\n在 Red Hat\
    \ 派系上，你按照以下方式安装：\n\n```\n# yum install knockd\n```\n\n一个主配置文件控制着 `knockd` 需要的大部分配置。在\
    \ Debian Jessie 服务器上，该文件位于 `/etc/knockd.conf`。查看列表 1.1，它展示了我的主配置文件，了解 `knockd`\
    \ 如何工作。\n\n### 修改默认设置\n\n在列表 1.1 中，你可以看到顶部有一个设置你的选项的部分。另外两个部分是在 `knockd` 开启 SSH\
    \ 访问或关闭端口访问时你想要执行的操作。这两个部分都通过 `sequence` 选项包含了触发这些操作的默认端口敲击序列。在安装 `knockd` 后，我立即将这些端口从默认值改为其他，以避免降低服务器安全的有效性。默认端口是\
    \ 7000、8000 和 9000 用于开启 SSH 访问，端口 9000、8000、7000 用于关闭访问。如你所见，我增加了更多端口来开启访问，这样别人就不可能通过任意端口扫描偶然撞上它们的组合。\n\
    \n修改任何设置后，你可以在基于 systemd 的操作系统上按照如下方式简单重启 `knockd`：\n\n```\n# systemctl restart\
    \ knockd.service\n```\n\n安装 `knockd` 后，如果你想获得更多关于该包的背景信息，Debian Jessie 有一个短的 `README`\
    \ 文件，可以在 `/usr/share/doc/knockd/README` 找到。\n\n这个非常有用的 `README` 文件讨论了 `knockd`\
    \ 的工作原理等。它使用了一个名为 `libpcap` 的库，该库也被用于 `tcpdump`、`ngrep` 和 `iftop`（用于捕获包进行检查）等其他包。得益于其巧妙的设计，`knockd`\
    \ 甚至不需要绑定到它秘密监听的端口即可监控原始流量。\n\n### 修改文件系统位置\n\n连接、断开或错误等事件直接记录到你系统的 syslog 中，并可能写入\
    \ `/var/log/messages` 或 `/var/log/syslog` 文件。如果你不想让这些信息埋没在其他系统日志活动中，或者不想费力解析笨重的日志文件，那么你可以创建自己的自定义日志文件。我更喜欢这样做，这样调试会清晰得多，我可能会使用自动化工具或自定义\
    \ shell 脚本每天将日志邮件给我，以便监控可疑事件。因为我将所有的 `knockd` 日志都放在一个地方，脚本和其他工具更容易解析这些信息。\n\n\
    ```\n[options]\nLogFile = /var/log/portknocking.log\n```\n\n更改日志文件的位置是一个常见的解决方案，但你也可以更改\
    \ `knockd` 服务启动时进程 ID（Process ID）文件的写入位置。你可以在配置文件的 `[options]` 部分更改位置，如下所示：\n\n\
    ```\n[options]\n       PidFile = /var/tmp/run/file\n```\n\n### 一些配置选项\n\n现在你对主配置文件的设置方式有了更好的了解，可以检查如何根据你的需求对其进行配置。在许多其他任务中，你将考虑某些选项的超时在设置服务器时起着什么作用。\n\
    \n### 启动服务\n\n如果你看到显示 `knockd` 已禁用（disabled）的错误信息，不要报警。这是一种预防措施，确保在你完成设置之前，`knockd`\
    \ 不会对 `iptables` 引入不受欢迎的更改。\n\n在 Debian Jessie 上，错误信息要求你在 `/etc/default/knockd`\
    \ 文件中将以下参数改为 1：\n\n```\nSTART_KNOCKD=1\n```\n\n显然，你应该在双重检查了配置或确保你的带外访问（out-of-band\
    \ access）工作符合预期后才这样做。\n\n### 修改默认网络接口\n\n一旦你配置了偏好的端口序列，你可能想要微调其他参数。在配置文件（`/etc/default/knockd`）中，你有机会更改\
    \ `KNOCKD_OPTS` 设置。该文件中的示例被注释掉了，这意味着你可以如下更改 `knockd` 监听的网络接口：\n\n```\nKNOCKD_OPTS=\"\
    -i eth1\"\n```\n\n这些选项将附加到 `knockd` 服务中，你将需要重启服务以使更改生效，如下（在 systemd 机器上）：\n\n\
    ```\n# systemctl restart knockd\n```\n\n### 数据包类型与计时\n\n在 `/etc/knockd.conf` 文件中，你可以更改几个设置来精调客户端如何连接到你。回到列表\
    \ 1.1，在 `[openSSH]` 部分下，你将如下添加更多选项：\n\n```\n[openSSH]\n        tcpflags = syn\n\
    \        seq_timeout = 10\n        cmd_timeout = 15\n```\n\n`tcpflags` 选项意味着你可以预期发送特定类型的\
    \ TCP 包，以便 `knockd` 接受它。在这种情况下，这是一个 TCP “SYN”。你可以使用的 TCP 标志有 `fin`、`syn`、`rst`、`psh`、`ack`\
    \ 和 `urg`。如果没有收到指定类型的包，`knockd` 将忽略那些包。请注意，这并不是 `knockd` 通常的工作方式。通常，一个错误的包会停止整个序列的运行。你可以使用逗号分隔多个包类型，而且根据更新日志，从\
    \ 0.5 版本开始的较新版本的 `knockd` 可以感叹号来否定包类型，例如 `!ack`。`seq_timeout` 在列表 1.1 中默认已存在。但是，由于你增加了设置中的端口数量，你将\
    \ `seq_timeout` 值从 5 到了 10。这是必要的，因为在慢连接上（例如通过你的手机），可能会超时。示例中的最后一个选项是 `cmd_timeout`。该选项适用于\
    \ `knockd` 收到成功敲击之后的情况。事件顺序如下：首先，一旦端口敲击被确认有效，`knockd` 将运行 `start_command`（如果需要，请参考列表\
    \ 1.1）。如果存在此设置，在 `knockd` 执行 `start_command` 选项后，它将等待 `cmd_timeout` 指定的时间，然后运行\
    \ `stop_command` 操作。这是开启 SSH 服务器访问的首选方式，并在建立连接后立即关闭它。你继续会话时不会有任何问题，但新连接需要再次通过端口敲击序列才能连接。\n\
    \n### 测试你的安装\n\n由于你正在处理服务器的安全问题，你应该运行几次测试以查看 `knockd` 是否按预期工作。理想情况下，你有访问另一台客户端机器来运行一些测试。为了完全确保\
    \ `knockd` 正确打开和关闭端口，我喜欢从完全不同的 IP 地址进行测试。如果你无法访问不同 IP 地址的连接，你可能需要定期断开互联网连接，以便你的\
    \ ISP 为你分配一个新的动态 IP 地址进行测试。某些宽带供应商会在重启后这样做，你的移动运营商也可能。\n"
- fmt: "\nYou can use different clients to create a knocking sequence in order to\
    \ initialize a connection and open up your SSH port. You can even manually use\
    \ tools such as `Nmap`, `netcat`, or `Telnet` to manually probe the required ports\
    \ in sequence. The documentation also mentions that you can use the `hping`, `sendip`,\
    \ and `packit` packages if they are available. Let's look at an example of the\
    \ `knock` command that comes with the `knockd` package.\n\nIf you used the `openSSH`\
    \ section shown in [Listing 1.1](#c01.xhtml_rc01_lit_1), then you would set up\
    \ your simple `knock` command with the following syntax:\n\n```bash\n# knock [options]\
    \ <host> <port[:proto]> <port[:proto]> <port[:proto]>\n```\n\nI have configured\
    \ TCP ports in [Listing 1.1](#c01.xhtml_rc01_lit_1), so you can run the `knock`\
    \ command as follows:\n\n```bash\n# knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp\
    \ 22045:tcp 23501:tcp 24691:tcp\n```\n\nThe target host has the IP address 11.11.11.11\
    \ in this example. If you want, you can also put a combination of UDP and TCP\
    \ ports in [Listing 1.1](#c01.xhtml_rc01_lit_1); your client-side knocking sequence\
    \ might look like this:\n\n```bash\n# knock 11.11.11.11 6:tcp 1450:udp 8156:udp\
    \ 22045:tcp 23501:udp 24691:tcp\n```\n\nOne nice shortcut is that if you only\
    \ want to use UDP ports, then you can simply add `-u` to the start of the command\
    \ rather than specifying them explicitly. You can run a command for UDP ports\
    \ like this:\n\n```bash\n# knock -u 11 22 33 44 55\n```\n\nLet's return to your\
    \ server's config file to see how TCP and UDP can be interchanged within your\
    \ valid knocking sequence. In order to mix protocols, you would simply alter the\
    \ `sequence` line under the `openSSH` section as follows:\n\n```ini\n[openSSH]\n\
    \        sequence = 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp 24691:tcp\n```\n\
    \n## Making Your Server Invisible\n\nOnce you are confident that your installation\
    \ is working as you'd like, you can lock your server down to hide it from attackers.\
    \ An attacker may be aware of the IP address bound to your server or may somehow\
    \ be able to view traffic sent and received from that IP address (for example,\
    \ they might work for the ISP that the server was hosted with). Otherwise, it\
    \ should be invisible to Internet users. I would experiment with your firewall\
    \ if this is not the case. To achieve `Nmap`'s closed port status, however, the\
    \ following approach works for me.\n\n### Testing Your iptables\n\nAs mentioned\
    \ earlier, I will use the trusted `iptables`. Ideally you should have physical\
    \ access to the server before locking it down, in case you make a mistake. Failing\
    \ that, you should have out-of-band access of some type, such as access via a\
    \ virtual machine's console, a secondary network interface that you can log in\
    \ through, or a dial-up modem attached to the machine. Be warned that unless you've\
    \ tested your configuration on a development box first, there's a very high chance\
    \ of making a mistake and causing problems. Even though I've used port knocking\
    \ before, I still get caught out and lock myself out of a server occasionally.\n\
    \nWith that warning in mind, let's begin by looking at your `iptables` commands.\
    \ Be careful when integrating these rules with any rules you already have. It\
    \ might be easier to overwrite your existing rules after backing them up. First,\
    \ you need to make sure that your server can speak to itself over the localhost\
    \ interface, as follows:\n\n```bash\n# iptables -A INPUT -s 127.0.0.0/8 -j ACCEPT\n\
    ```\n\nYou must now ensure that any existing connections are acknowledged and\
    \ responded to, as follows:\n\n```bash\n# iptables -A INPUT -m conntrack—ctstate\
    \ ESTABLISHED,RELATED -j ACCEPT\n```\n\nYou're using `conntrack` to keep track\
    \ of associated connections. Your connections can continue to operate once they\
    \ have been initiated successfully. Now, assuming that you're only going to open\
    \ up TCP port 22 for your SSH server and no other services, you can continue.\
    \ As a reminder of how to do this, referring to [Listing 1.1](#c01.xhtml_rc01_lit_1),\
    \ add the following command to open up TCP port 22:\n\n```bash\ncommand = /sbin/iptables\
    \ -I INPUT -s %IP% -p tcp—dport 22 -j ACCEPT\n```\n\nPay attention to this line.\
    \ If you left an “append” by using `-A INPUT` in the command, you would be locked\
    \ out by `iptables`. It must be an `-I` for “insert” so that the rule is entered\
    \ as the first rule and takes precedence over the others.\n\nYou might be wondering\
    \ what the `%IP%` variable is. Port knocking is clever enough to substitute the\
    \ connecting IP address in the `-s` field, in place of the `%IP%` value.\n\nNow\
    \ here's where you have to be careful. There's no going back if this doesn't work.\
    \ Be warned that unless you've tested your configuration on a development box\
    \ first, there's a very high chance of making a mistake and causing problems.\
    \ Even though I've used port knocking before, I still get caught out and lock\
    \ myself out of a server occasionally.\n\nIf you left an “append” by using `-A\
    \ INPUT` in the command, you would be locked out by `iptables`. It must be an\
    \ `-I` for “insert” so that the rule is entered as the first rule and takes precedence\
    \ over the others.\n\nTo block all traffic inbound, use:\n\n```bash\n# iptables\
    \ -A INPUT -j DROP\n```\n\nTo check the rules:\n\n```bash\n# iptables -L\n```\n\
    \nTo see the rules with details:\n\n```bash\n# iptables -nv\n```\n\n### Saving\
    \ iptables Rules\n\nTo ensure that your iptables rules survive a reboot, you should\
    \ install a package called `iptables-persistent` on Debian:\n\n```bash\napt-get\
    \ install iptables-persistent\n```\n\nYou can then save your rules with this:\n\
    \n```bash\n# /etc/init.d/iptables-persistent save\n```\n\nOr, you can revert to\
    \ the saved config by running:\n\n```bash\n# /etc/init.d/iptables-persistent reload\n\
    ```\n\nOn Red Hat derivatives, you can use:\n\n```bash\n# /sbin/service iptables\
    \ save\n```\n\nAnd to restore rules:\n\n```bash\n# /sbin/service iptables reload\n\
    ```\n\nFor the above to work on systemd Red Hat derivatives, try this package\
    \ first:\n\n```bash\nyum install iptables-services\n```\n\n## Further Considerations\n\
    \nThere are a few other aspects of port knocking that might be helpful to you.\
    \ Let's have a look at them now.\n\n### Smartphone Client\n\nOn my Android smartphone,\
    \ my preferred SSH app is called JuiceSSH ([https://juicessh.com`](https://juicessh.com)).\
    \ It has a third-party plug-in that allows you to configure a knocking sequence\
    \ as part of your SSH handshake. This means that there's no excuse for you not\
    \ to employ port knocking, even when you're on the road and without a laptop.\n\
    \n### Troubleshooting\n\nIf you run the command `tail -f logfile.log` on your\
    \ port knocking log file, you will see various stages being written to the log.\
    \ This will include whether a valid port is knocked, and importantly, if it was\
    \ knocked in the correct sequence or not.\n\nA debugging option also gives you\
    \ the opportunity to increase the levels of logging produced by `knockd`. If you\
    \ carefully open the file `/etc/init.d/knockd` and look for the `OPTIONS` line,\
    \ then you can add an uppercase D character (Shift+d) to any existing values on\
    \ this line as follows:\n\n```bash\nOPTIONS=\"-d -D\"\n```\n\nThe additional logging\
    \ should be switched off once you have diagnosed and solved your issue to prevent\
    \ disk space from filling up unnecessarily. The `-d` simply means run `knockd`\
    \ as a daemon in case you're wondering. This should remain as it is for normal\
    \ operation.\n"
