- fmt: 'The extraordinary NSE was designed with a few key functions in mind. These
    functions include network discovery mostly through port scanning, advanced service
    detection using a variety of predefined signatures, vulnerability checking (and
    exploitation), and finally backdoor detection.


    NSE''s strength is in its versatility, and it extends this functionality by offering
    the addition, as its name would suggest, of scripts that can be written by anyone
    using the Lua programming language. In order to fire up NSE from the command line,
    you simply launch the `nmap` binary with the `--script=` option or, alternatively,
    the `-sC` option.


    Following are two examples of port scanning with `Nmap`. The first is without
    enabling NSE and the second engages it. This should be useful so that you can
    familiarize yourself with the difference in output. In [Listing 7.1](#c07.xhtml_c07_lit_1)
    you see the results of the first command. Note that both these commands are run,
    not as the root user, but as a standard user.


    In [Listing 7.2](#c07.xhtml_c07_lit_2), however, you see that NSE has been engaged,
    and here it adds invaluable insight into the mix.


    In [Listing 7.2](#c07.xhtml_c07_lit_2) you can see the additional input from NSE.
    In contrast to [Listing 7.1](#c07.xhtml_c07_lit_1), you also receive URLs to further
    research your findings, more host detail (such as the SSH host key in this case),
    and even comments about the HTML that `Nmap` doesn''t think is valid HTML.


    ## Timing Templates


    In [Listings 7.1](#c07.xhtml_c07_lit_1) and [7.2](#c07.xhtml_c07_lit_2), you asked
    for information about ports in the 0-to-1,024 range (the privileged, raw, or superuser
    ports on Unix-type systems) by using the `-p0-1024` option. The `-T4` option isn''t
    actually a timeout value of four seconds but instead offers a way of pulling up
    a specific timing template used by NSE. The higher the setting, the faster `Nmap`
    runs, and the values that are available range from 0 to 5.


    The timing template values are important and can make a difference to your emotional
    well-being. These values, from 0 to 5, stand for paranoid, sneaky, polite, normal,
    aggressive, and insane. The words can also be used in place of the numbers if
    you find them easier to remember.


    Because so many settings were bundled with NSE, the main programmer realized that
    users might get lost in their complexity, and so introduced templates that might
    be helpful.


    The main reason that the templates are so important to using `Nmap` is that when
    you run NSE against a lot of hosts, or a large network or networks, the process
    can take a very long time to complete. You may also discover very little interesting
    information (because of well-configured firewalls), and your task can still take
    what seems like forever to complete.


    What''s the difference in the templates, you may ask? Both the paranoid and sneaky
    templates offer some degree of avoiding detection by an intrusion detection system
    (IDS). The polite template slows down the scanning process in order to limit the
    bandwidth used at both ends of the connection and also the target machine''s resources.
    The `-T3` switch actually does nothing whatsoever; that''s because the normal
    template is the default and is switched on anyway. The aggressive template, which
    you used with the `-T4` switch in the earlier example, will speed up the scanning
    process and test a relatively high-capacity network''s limits more rigorously.
    The last template, insane, assumes that you are happy to trade off some accuracy
    in the results that NSE provides against the time it takes to execute. You should
    have a high-capacity and reliable network if you want to use this setting.


    ## Categorizing Scripts


    Despite employing a highly sophisticated underlying engine, NSE was so thoughtfully
    designed that even a new user can understand how to operate it with relative ease.
    It''s therefore possible to deploy NSE promptly and without requiring too much
    reading in advance.


    However, to avoid getting ahead of yourself, it''s useful to know how NSE refers
    to the different scripts that it uses. When you run a script through NSE, a port
    scan will usually be performed prior to or during its execution in order to check
    the current state of a target machine''s network availability. There are also
    other similarities among the many NSE scripts, such as DNS lookups and traceroutes.


    In [Table 7.1](#c07.xhtml_c07-tbl-0001) you can see how NSE categorizes its scripts;
    there are a number of different categories to consider.


    | **Category** | **Description** |

    | :--- | :--- |

    | auth | These scripts look at authentication methods and circumventing them —
    for example, `x11-access`, `ftp-anon`, and `oracle-enum-users`. The brute category
    is for brute forcing and not authentication. |

    | broadcast | If you need to broadcast on the local network, employ this bundle
    of scripts. |

    | brute | For brute forcing the authentication credentials of a remote host, use
    this collection of scripts. There are many available for different protocols.
    |

    | default | The default scripts are executed if you use the `-sC` or `-A` options.
    To use specific scripts, override the default with `--script=`. |

    | discovery | To track who and what is connected to a network, these scripts are
    all about examining, for example, public registries, SNMP-enabled devices, and
    directory services. |

    | dos | If you want to test a vulnerability or (carefully) run scripts that have
    the possibility of crashing services, then this set is suitable. |

    | exploit | In order to try out an exploit to see if it succeeds, these scripts
    will do exactly. |

    | external | Be warned that by executing these scripts, your actions may be logged
    by other parties. That''s because this set might. |

    | fuzzer | These scripts will search for software bugs and security holes by injecting
    randomized fields into their queries. They take longer than other techniques to
    knock a server offline. |

    | intrusive | Ostracized to this unpleasant category, these scripts are very risky
    to run and won''t make it to safe category. Some of the risks include crashes,
    bandwidth saturation, and being spotted by sysadmins. |

    | malware | Known malware leaves certain system traces, such as backdoors or signs
    of infection. Unusual port numbers and service oddities are searched for with
    malware scripts. |

    | safe | This set of scripts is less likely to offend the sysadmins of target
    systems. Still, you shouldn''t completely rely on these scripts not to cause problems.
    |

    | version | You can''t select these scripts directly because they are an extension
    to NSE''s version detection functionality. They execute if the version detection
    option `-sV` is used. |

    | vuln | If vulnerabilities are discovered, then this set will alert you about
    them; otherwise, little noise will be made. Examples are `realvnc-auth-bypass`
    and `afp-path-vuln`. |


    ## Contributing Factors


    When the default set of scripts is used, you might be surprised at how the mighty
    NSE reaches its decisions. There are no set thresholds; rather, it reaches a kind
    of score after running through the following criteria.


    *   *Speed* — default scans must be completed swiftly, for example, so no brute
    forcing is employed.

    *   *Usefulness* — if a script doesn''t produce useful results, then you can forget
    its inclusion in default scripts.

    *   *Verbosity* — the resulting output of running a script needs to be succinct.
    Equally, when there''s nothing to report, silence is a virtue.

    *   *Reliability* — inevitably, assumptions and guesses are made during the operation
    of some scripts. However, if there are frequently errors, then it shouldn''t be
    run in the default category.

    '
