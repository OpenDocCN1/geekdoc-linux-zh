    Service name   Portnum/protocol   Open-frequency   Optional comments

    ftp                   21/sctp                  0.000000             # File Transfer
    [Control]

    ftp                   21/tcp                    0.197667             # File Transfer
    [Control]

    ftp                   21/udp                   0.004844             # File Transfer
    [Control]

    ssh                 22/sctp                  0.000000             # Secure Shell
    Login

    ssh                 22/tcp                    0.182286             # Secure Shell
    Login

    ssh                 22/udp                   0.003905             # Secure Shell
    Login

    telnet              23/tcp                    0.221265

    telnet              23/udp                   0.006211

