  trans: "\n回到客户端稍一下。你还可以通过添加 `-v` 选项来增加输出的详细程度，这是“knock”客户端生成的输出。结合调试选项，这应该能让你从连接的客户端和服务器端获得有用的反馈。\n\
    \n### 安全考量\n\n涉及到与你的服务器相关的公共信息，提醒一下你的互联网服务提供商（ISP）不应发布关于你用于服务器的 IP 地址的正向或反向 DNS\
    \ 信息。你的 IP 地址应该显示为未被使用且未分配的，这样才能实现隐形。\n\n即使在像 `HTTP` 这样的公共服务上，你需要记住混淆正在使用的守护进程版本。在世界上最流行的\
    \ Web 服务器 `Apache` 中，实现此点的常用方法是将 `ServerTokens` 更改为 `Prod` 并将 `ServerSignature`\
    \ 设置为 `Off`。这些几乎不是什么尖端的配置更改，但它们可能意味着当发现新的零日漏洞时，由于你的 `Apache` 版本号不在其攻击数据库中，自动化攻击可能会忽略你的服务器，从而避此一灾。\n\
    \n另一个需要考虑的方面在 `knockd` 文档中有所讨论。它提到，如果你使用 `-l` 或 `--lookup` 服务启动选项来解析日志条目的主机名，那么可能存在安全风险。如果你这样做，可能会某些信息泄露给攻击者。如果可以从你的服务器捕获\
    \ DNS 流量，攻击者可能确定序列中的第一个端口。\n\n### 瞬态序列\n\n使用不同的敲门序列（knocking sequences）方法如何？也可以使用预定义的端口序列列表进行端口敲门，这些序列在使用一次后就会过期。参考列表\
    \ 1.1 和你的主配置文件，如果你想的话，可以将此选项添加到你的的 `open` 和 `close` 部分中，以启用一次性序列：\n\n```\n[openSSH]\n\
    \        One_Time_Sequences = /usr/local/etc/portknocking_codes\n```\n\n如果你删除了列表\
    \ 1.1 中的 `sequence` 行并将其替换为此代码，那么 `knockd` 将从路径中指定的文件获取其序列。\n\n`knockd` 处理一次性序列的方式是不寻常的。它从该文件中读取下一个可用的序列，然后在与有效敲门成功连接后，将该行注释掉。它只是在存在序列的行开头添加一个哈希值或井号（#）。下一次连接将触发相同的序列。\n\
    \n文档指出，你应该在每行的开头留空。否则，当 `#` 字符被添加到行首时，你可能会发现它被无意中覆盖了，这意味着你被锁定在系统之外。\n\n在你的序列文件中，你可以每行添加一个序列。该文件的格式与主配置文件中的\
    \ `sequences` 选项格式相同。\n\n文档还指出，你可以通过在注释前加上 `#` 字符来插入注释，但如果你在 `knockd` 运行时编辑序列文件，将会发生糟糕的事情（例如被锁定在服务器之外）。\n\
    \n一旦你理解了 `knockd` 的基本功能，它将是一个极佳的实验对象。在测试期间，你可以输入你能够记住的电话号码或其他数字序列，这样你就不需要不断查找一个不安全的列表了。例如，你可能考虑轮换五个电话号码，并将它们分成有效的端口号。\n\
    \n### 总结\n\n除了让你的服务器隐形之外，我还涵盖了在发起攻击之前你的服务器在互联网上呈现的状态。为了使用端口敲门完全混淆你的服务器，你应该仔细考虑公共信息，例如反向\
    \ DNS 记录，这可能会暴露 IP 地址正在被使用。你还可能考虑使用 `NAT` 来隐藏服务器并定期动态更改其 IP 地址，仅通过在不寻常域名的 DNS\
    \ 中秘密发布的密钥主机名，让管理员在特定时间知道哪个 IP 地址正在被使用。\n\n保护服务器还有许多其他方面；尽管如此，我希望已经涵盖了足够的内容，让你考虑哪些信息泄露给了公众并可能在未来的漏洞中被利用，以及在需要时隐藏服务器。\n\
    \n# 第 2 章：为你的文件创建数字指纹\n\n关注服务器安全有许多正理由。很少有系统管理员类型能在不投入热情和努力的情况下，吸收保持基础设施安全所需的必要安全知识。如果你和我一样，在这一道路上可能会遇到一些坎坷，例如在千禧交替之际，我曾因为一个恶性的\
    \ PHP 漏洞导致服务器被攻破，或者当我面临并击退两次相对重大的 DDoS 攻击时。\n\n本章将涵盖另一个攻击向量——根内核（rootkits），以及一个非常棒软件\
    \ Rootkit Hunter（你可能认识它为 `rkhunter`）。然而，你将从探索如何监控文件系统的重要文件（如其可执行文件）开始。\n\n## 文件系统完整性\n\
    \n许多年前我使用过 `Tripwire`（[`http://sourceforge.net/projects/tripwire`](http://sourceforge.net/projects/tripwire)）。由于其他产品的出现，它现在被称为\
    \ Open Source Tripwire。`Tripwire` 定期运行（使用 `cron` 在夜间运行），并使用加密哈希来监控系统上的任何文件更改。\n\
    \n通过在第一次运行期间生成并记录文件系统中可见的任何文件的哈希值，`Tripwire` 能够在随后的每次运行中，如果任何哈希值与它记录的不符，向管理员发出警告。如果文件发生了任何更改，哈希值就会改变。这是一种聪明的方法，尽管在旧硬件上非常消耗\
    \ I/O 资源，并且后来产生了许多后代。一个例子是流行的 AIDE（高级入侵检测环境），它在 [`http://aide.net`](http://aide.net)\
    \ 上被描述为“一个文件和目录检查器”。如果有机会，我绝对建议尝试 AIDE 或 `Tripwire`。但警告你，如果你对初始配置疏忽，你可能会收到大量的虚假报警。\n\
    \n这种安全类型通常在基于主机的入侵检测系统（HIDS）的伞下，据报道，由于主机与网络的交互很少，它是最早的软件安全类型之一。\n\n如果你不想运行夜间文件检查检查或者你无法接收每日系统报告，那也没问题。你可以选择一种旧的方法，在构建服务器后扫描一次文件系统，以收集安装了哪些文件的信息。我稍后会解释为什么这有用。\n\
    \n你可能会惊讶，一个你几乎确定用于其他用途的工具可以很容易作为安全助手。\n\n介绍 `md5sum` 命令。在过去下载 Unix 类型文件时，你可能一直可以通过验证这些文件的\
    \ MD5 和来检查潜在下载内容的完整性。例如，MD5 和通常出现在你获取 Linux 安装 ISO 镜像的网站上。\n\n如图 2.1\n\n"
- fmt: '

    [Figure 2.1](#c02.xhtml_c02-fig-anc-0001) You can download Debian Jessie from
    the website and also check your MD5sums for security.


    If you open up the file `MD5SUMS`, then you can see the contents of [Figure 2.1](#c02.xhtml_c02-fig-0001),
    which contains hashes for each file.


    Within [Listing 2.1](#c02.xhtml_c02_lit_1), in the left column, you can see the
    MD5sum of each file and the relevant filename to the right. This is to prevent
    someone else from sneaking a file into the place of a legitimate one, which could
    infect your clean operating system (OS) installation.


    MD5sums first compute and then check against MD5 digests. You might think (in
    a relatively sophisticated way) that by checking MD5sums you are effectively creating
    a digital fingerprint for each file, which can be queried later.


    You can easily try using MD5sums yourself (the `MD5sum` command is bundled within
    the package `coreutils` on my machine and should be readily available to almost
    all distributions). Try a command like this one:


    ```

    # md5sum /home/chrisbinnie/debbie-and-ian.pdf

    ```


    The response you receive might be something like this:


    ```

    3f19f37d00f838c8ad16775293e73e76 debbie-and-ian.pdf

    ```


    Now back to the files listed next to your Linux distribution. Download the `MD5SUMS`
    file into the same directory as the main ISO file (`ISO` is named after the ISO
    9660 file system if you''re wondering). By doing so, you can save yourself the
    trouble of manually checking each file on the installation media that you''re
    using. This is because that file includes all MD5sums for the files in that directory.
    Now that you have the MD5sums for all the files, you can check them for validity
    with the following command (`-c` also stands for `--check`):


    ```

    # md5sum -c MD5SUMS

    ```


    [Listing 2.2](#c02.xhtml_c02_lit_2) shows the results from running the `-c` option.
    You might say that MD5sums are binary: results are either OK or not OK.


    What should you look out for if a file didn''t match its original MD5sum? In [Listing
    2.3](#c02.xhtml_c02_lit_3) you can see that an alarm bell is ringing (with a FAILED
    warning) and that you are also informed of a problem at the end of the results.


    It should go without saying that, without making these checks when you''re installing
    your OS from a downloaded ISO or from a magazine''s DVD, you are gambling with
    the integrity of your files and therefore risking your system''s integrity.


    Now that you''ve been reminded of how you can check if there''s been any tampering
    with your freshly downloaded files, let''s look at how to use the powers of cryptographic
    hashes to help you tell if an installed system has been compromised.


    ## Whole Filesystem


    Once you''re happy with your OS installation and have run through the requisite
    postinstall fine-tuning, you should consider recording the MD5sums of your key
    system files. You do this in order to have a reliable record to compare against
    during a suspected compromise.


    Of course, doing this with the `md5sum` command probably isn''t going to be very
    easy without writing a shell script; this is because it''s difficult to get full
    directory trees of files working with the `md5sum` command.


    Fear not, though: someone clever has addressed this problem with an efficient
    piece of software called `md5deep` ([`http://md5deep.sourceforge.net`](http://md5deep.sourceforge.net)).
    According to its website, in addition to the functionality you can expect from
    `MD5sum`, you can also enjoy the following features:


    You can:


    * Ignore certain file types (which is very useful when you want to ignore temporary
    files and so on).

    * If you''re inspecting a massive number of files (which you would on a fresh
    OS installation), then `md5deep` offers a very helpful ETD (Estimated Time of
    Delivery)—in other words, how long a command will take to complete.

    * You can run `md5deep` in recursive mode to effortlessly pick up the numerous
    hidden subdirectories on your filesystem, which would otherwise be arduous (if
    not impossible to do accurately) to record manually.

    * With compatibility in mind, you also import different types of hashes (for example,
    from EnCase, the National Software Reference Library, ILook Investigator, and
    HashKeeper).


    I''m sure you''ll agree that''s exactly what you''re looking for. Having completed
    your new machine''s build, you can simply install `md5deep` and run it across
    your entire filesystem (or at least parts of it). One serious caveat is to keep
    the resulting hash list somewhere else than on the server. This is for obvious
    reasons. If your server is compromiseised, then it''s very easy for an attacker
    to overwrite your MD5sum list with new, illegitimate MD5sums and deceive you.


    If for some reason you can''t get hold of `md5deep` (because you''re working in
    a closed environment, for example), then it would be worth running the `md5sum`
    command over directories containing key binaries, such as this (nonexhaustive)
    list:


    ```

    /bin, /sbin, /usr/bin, /usr/sbin, /etc

    ```


    ## Rootkits


