- fmt: "\nJust as the U.S. military's DARPA (the Department of Defense's Defense Advanced\
    \ Research Projects Agency) contributed so greatly and helped to shape the Internet\
    \ that you know and love today, a similar military-to-civilian transition also\
    \ resulted in the most common network-discovery tool used on the Internet today:\
    \ the `ping` command. The `ping` command's ancestry stems from naval vessels sending\
    \ sonar pings to detect if other vessels or geophysical features were in the vicinity.\n\
    \nAs part of the network discovery functionality that the powerful security tool\
    \ `Nmap` ([https://nmap.org`](https://nmap.org)) provides, it also includes access\
    \ to a powerful improvement to the standard `ping` command, called `Nping` ([https://nmap.org/nping/`](https://nmap.org/nping/)).\
    \ If you have used `Nmap`, then you'll know that you're in safe hands with any\
    \ tool created by the Nmap Project in terms of reliability and well-considered\
    \ functionality.\n\nLet's look at how the `Nping` tool can help you gain more\
    \ insight into what your systems and networks are doing, digging into both remote\
    \ and local connections.\n\n## Functionality\n\nOn the surface, you might expect\
    \ `Nping`'s functionality to be relatively limited. After all, when you fire off\
    \ a ping, you send a question and then simply wait for an answer. Although `Nping`\
    \ is still not a finished piece of software, it's safe to say that it's a highly\
    \ comprehensive and sophisticated networking tool.\n\nYou will begin by getting\
    \ used to the syntax. You'll need to be logged in as `root`, the superuser, to\
    \ execute some `Nping` commands, and in this case, you'll look at TCP mode. Your\
    \ first exercise will be to fire off TCP “pings” toward your local machine. From\
    \ the standard `ping`'s man page, you can see that the normal operation of `ping`\
    \ “uses the ICMP protocol's mandatory ECHO_REQUEST datagram to elicit an ICMP\
    \ ECHO_RESPONSE from a host or gateway.” In other words, there's a question and\
    \ answer involved. \n\nIn case you're wondering, I'll be using my local machine\
    \ for these examples to avoid upsetting any other machines and populating firewall\
    \ logs with suspicious activities. As with all white hat tools, you should use\
    \ them with great care.\n\nNot only concerned with ICMP, the impressive `Nping`\
    \ is a well-designed extension of the standard `ping` command, which can also\
    \ talk to many different protocols. It also gives you easy-to-understand results.\n\
    \nIf you don't have it installed already, you can install `Nping` as follows.\n\
    \nOn Debian derivatives, simply use the following command to install the `Nmap`\
    \ package:\n\n```\n# apt-get install nmap\n```\n\nOn Red Hat derivatives, install\
    \ `Nmap` using this command:\n\n```\n# yum install nmap\n```\n\n## TCP\n\nBack\
    \ to the TCP (Transmission Control Protocol) example. You'll run the following\
    \ command against your local machine so that there will be no firewall issues\
    \ to be concerned with and you won't upset other sysadmins:\n\n```\n# nping -c1\
    \ --tcp -p 80,443 localhost\n```\n\nHere you're sending one ping packet (with\
    \ `-c1` count option) over TCP, to TCP ports 80 and 443, to your local machine.\
    \ The output from this command might look like Listing 5.1.\n\nYou can see in\
    \ Listing 5.1 that you have received a reply from both TCP port 80 and TCP port\
    \ 443. The pings stop themselves after each port has sent data once (and data\
    \ has been returned) as per the `--c` option. If there's no obviously valid response,\
    \ then you might see something like this:\n\n```\nnping_event_handler(): READ-PCAP\
    \ killed: Resource temporarily unavailable\nnping_event_handler(): TIMER killed:\
    \ Resource temporarily unavailable\n```\n\nNow that you have some idea of how\
    \ `Nping` looks and reacts to your input, it should come as no surprise that you\
    \ can use Classless Inter-Domain Routing (CIDR) network notation whenever you\
    \ want (for example, 10.10.10.0/24). You'll stick with the basics for now and\
    \ look at how to specify a range of ports to ping, rather than specifying them\
    \ in a list as you've just done.\n\nConsider the “privileged ports” on a Unix-type\
    \ machine. These ports have been given a few names in the past (such as superuser\
    \ ports or raw ports), but in essence, only the `root` user has permission to\
    \ open them. This was an original security feature that meant if you remotely\
    \ connected to one of these port numbers, you could be reasonably assured that\
    \ the service running on it was genuine. In other words, it was spawned by the\
    \ `root` user, not a standard user. Here is how to check all of the privileged\
    \ TCP ports with `Nping`:\n\n```\n# nping -c1 --tcp -p 0-1024 localhost\n```\n\
    \nUsing a method that almost certainly differs from other networking tools, `Nmap`\
    \ deals with multiple hosts and port numbers in an unusual way. For efficiency,\
    \ if more than one target machine is specified, `Nping` won't simply send off\
    \ a query to the first machine in the list and patiently wait for a response.\
    \ Instead, it employs a simple but clever round-robin approach, where machines\
    \ are contacted alternately in a rotation, so that no delay is introduced to the\
    \ user when waiting for responses. With multiple hosts, this also applies with\
    \ multiple ports to give the target a chance to recover before responding to the\
    \ next port that `Nping`.\n\n## Interpreter\n\n`Nping` can act as an interpreter.\
    \ If you use the `--tcp-connect` option, you are engaging `Nping`'s TCP connect\
    \ mode. You don't need to use `root` privileges to fire off what would otherwise\
    \ be raw packets, spoofing IP addresses and closing down active sessions.\n\n\
    Here's how manipulating TCP handshakes might look if used as three separate commands:\n\
    \n```\n# nping -p 80 --flags rst -c1 localhost\n# nping -p 80 --flags syn -c1\
    \ localhost\n# nping -p 80 --flags ack -c1 localhost\n```\n\n## UDP\n\nYou can\
    \ also opt to employ the User Datagram Protocol (UDP) packets by using the `--udp`\
    \ option. Normally TCP and UDP packets are embedded inside IP packets, but as\
    \ I've said, without root permissions, you can't see the content of the packets.\
    \ The same applies to UDP packets.\n\nA UDP ping can sometimes discover machines\
    \ where other protocols fail. It's possible that a UDP ping might circumvent a\
    \ firewall and report back if a device is listening behind that firewall. This\
    \ is a very useful addition to your toolkit. A simple example command might look\
    \ like this:\n\n```\n# nping --udp localhost\n```\n\nWhen I attempt to run this\
    \ command against my local machine without being the root user, I see the following\
    \ feedback:\n\n```\nSENT (0.0069s) UDP packet with 4 bytes to localhost:40125\
    \ (127.0.0.1:40125)\nERR: (0.0070s) READ to 127.0.0.1:40125 failed: Connection\
    \ refused\n```\n\nHowever, as the superuser, root, I can complete the transaction\
    \ as follows:\n\n```\nSENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64\
    \ id=64074 iplen=28\nRCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable\
    \ (type=3/code=3) ttl=64 id=18756 iplen=56\n```\n\n\nAs you can see, the UDP ping\
    \ traffic is aimed at UDP port 40125 in both examples.\n\n## ICMP\n"
  raw: 'Just as the U.S. military''s DARPA (the Department of Defense''s Defense Advanced
    Research Projects Agency) contributed so greatly and helped to shape the Internet
    that you know and love today, a similar military-to-civilian transition also resulted
    in the most common network-discovery tool used on the Internet today: the `ping`
    command. The `ping` command''s ancestry stems from naval vessels sending sonar
    pings to detect if other vessels or geophysical features were in the vicinity.


    As part of the network discovery functionality that the powerful security tool
    Nmap ([`https://nmap.org`](https://nmap.org)) provides, it also includes access
    to a powerful improvement to the standard `ping` command, called Nping ([`https://nmap.org/nping/`](https://nmap.org/nping/)).
    If you have used Nmap, then you''ll know that you''re in safe hands with any tool
    created by the Nmap Project in terms of reliability and well-considered functionality.


    Let''s look at how the Nping tool can help you gain more insight into what your
    systems and networks are doing, digging into both remote and local connections.


    ## Functionality


    On the surface, you might expect Nping''s functionality to be relatively limited.
    After all, when you fire off a ping, you send a question and then simply wait
    for an answer. Although Nping is still not a finished piece of software, it''s
    safe to say that it''s a highly comprehensive and sophisticated networking tool.


    You will begin by getting used to the syntax. You''ll need to be logged in as
    root, the superuser, to execute some Nping commands, and in this case, you''ll
    look at TCP mode. Your first exercise will be to fire off TCP “pings” (you read
    correctly; they''re not ICMP pings) toward your local machine. From the standard
    ping''s man page, you can see that the normal operation of ping “uses the ICMP
    protocol''s mandatory ECHO_REQUEST datagram to elicit an ICMP ECHO_RESPONSE from
    a host or gateway.” In other words, there''s a question and answer involved.


    In case you''re wondering, I''ll be using my local machine for these examples
    to avoid upsetting any other machines and populating firewall logs with suspicious
    activities. As with all white hat tools, you should use them with great care.


    Not only concerned with ICMP, the impressive Nping is a well-designed extension
    of the standard `ping` command, which can also talk to many different protocols.
    It also gives you easy-to-understand results.


    If you don''t have it installed already, you can install Nping as follows.


    On Debian derivatives, simply use the following command to install the Nmap package:


    ```

    # apt-get install nmap

    ```


    On Red Hat derivatives, install Nmap using this command:


    ```

    # yum install nmap

    ```


    ## TCP


    Back to the TCP (Transmission Control Protocol) example. You''ll run the following
    command against your local machine so that there will be no firewall issues to
    be concerned with and you won''t upset other sysadmins:


    ```

    # nping -c1 --tcp -p 80,443 localhost

    ```


    Here you''re sending one ping packet (with `-c1` count option) over TCP, to TCP
    ports 80 and 443, to your local machine. The output from this command might look
    like [Listing 5.1](#c05.xhtml_c05_lit_1).


    You can see in [Listing 5.1](#c05.xhtml_c05_lit_1) that you have received a reply
    from both TCP port 80 and TCP port 443\. The pings stop themselves after each
    port has been sent data once (and data has been returned) as per the `--c` option.
    If there''s no obviously valid response, then you might see something like this:


    ```

    nping_event_handler(): READ-PCAP killed: Resource temporarily unavailable

    nping_event_handler(): TIMER killed: Resource temporarily unavailable

    ```


    Now that you have some idea of how Nping looks and reacts to your input, it should
    come as no surprise that you can use Classless Inter-Domain Routing (CIDR) network
    notation whenever you want (for example, 10.10.10.0/24). You''ll stick with the
    basics for now and look at how to specify a range of ports to ping, rather than
    specifying them in a list as you''ve just done.


    Consider the “privileged ports” on a Unix-type machine. These ports have been
    given a few names in the past (such as superuser ports or raw ports), but in essence,
    only the root user has permission to open them. This was an original security
    feature that meant if you remotely connected to one of these port numbers, you
    could be reasonably assured that the service running on it was genuine. In other
    words, it was spawned by the root user, not a standard user. Here is how to check
    all of the privileged TCP ports with Nping:


    ```

    # nping -c1 --tcp -p 0-1024 localhost

    ```


    Using a method that almost certainly differs from other networking tools, Nmap
    deals with multiple hosts and port numbers in an unusual way. For efficiency,
    if more than one target machine is specified, Nping won''t simply send off a query
    to the first machine in the list and patiently wait for a response. Instead, it
    employs a simple but clever round-robin approach, where machines are contacted
    alternately in a rotation, so that no delay is introduced to the user when waiting
    for responses. With multiple hosts, this also applies with multiple ports to give
    the target a chance to recover before responding to the next port that Nping probes.


    ## Interpreter


    Nping can act as an interpreter with a number of protocols. If you use the `--tcp-connect`
    option, then you are engaging Nping''s TCP connect mode. Here you don''t need
    to use root privileges to fire off what would otherwise be raw packets; instead,
    Nping asks the operating system to dutifully create the connections on your behalf.
    You can''t see the contents of either inbound or outbound packets in this mode,
    but you can at least see the status of their transmissions.


    As you would hope, the `--tcp` option, when run as the root user, enables you
    to achieve outstanding results with TCP packets. For example, you can attempt
    to manipulate the results of a connection by only partially completing a TCP handshake
    with TCP SYN messages. The documentation discusses the fact that there''s a real
    possibility to do damage (actually, they use the word “evil”) with customized
    TCP RST packets, spoofing IP addresses and closing down active TCP sessions, so
    be warned.


    Here''s how manipulating TCP handshakes might look if used as three separate commands:


    ```

    # nping --tcp -p 80 --flags rst -c1 localhost

    # nping --tcp -p 80 --flags syn -c1 localhost

    # nping --tcp -p 80 --flags ack -c1 localhost

    ```


    ## UDP


    You can also opt to employ the User Datagram Protocol (UDP) packets by using the
    `--udp` option. Normally TCP and UDP packets are embedded inside IP packets, but
    as I''ve said, without root permissions, as long as the default protocol headers
    haven''t been changed, you can''t see the content of the packets, just their transceiving
    status. The same applies to UDP packets.


    A UDP ping can sometimes discover machines where other protocols fail. It''s possible
    that a UDP ping might circumvent a firewall and report back if a device is listening
    behind that firewall. This is a very useful addition to your toolkit. A simple
    example command might look like this:


    ```

    # nping --udp localhost

    ```


    When I attempt to run this command against my local machine without being the
    root user, I see the following feedback:


    ```

    SENT (0.0069s) UDP packet with 4 bytes to localhost:40125 (127.0.0.1:40125)

    ERR: (0.0070s) READ to 127.0.0.1:40125 failed: Connection refused

    ```


    However, as the superuser, root, I can complete the transaction as follows:


    ```

    SENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64 id=64074 iplen=28

    RCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable (type=3/code=3) ttl=64
    id=18756 iplen=56

    ```


    As you can see, the UDP ping traffic is aimed at UDP port 40125 in both examples.


    ## ICMP'
