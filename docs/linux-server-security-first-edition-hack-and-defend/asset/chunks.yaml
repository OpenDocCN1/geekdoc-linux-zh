  trans: "\n\n你可以使用不同的客户端来创建敲门序列（knocking sequence），以初始化连接并打开 SSH 端口。你甚至可以手动使用 `Nmap`、`netcat`\
    \ 或 `Telnet` 等工具按顺序探测所需的端口。文档还提到，如果可用，你还可以使用 `hping`、`sendip` 和 `packit` 软件包。让我们来看\
    \ `knockd` 软件包带的 `knock` 命令的示例。\n\n如果你使用了列表 1.1 所示的 `openSSH` 部分，那么你将使用以下语法设置你的简单\
    \ `knock` 命令：\n\n```bash\n# knock [options] <host> <port[:proto]> <port[:proto]>\
    \ <port[:proto]>\n```\n\n我在列表 1.1 中配置了 TCP 端口，因此你可以如下所示运行 `knock` 命令：\n\n```bash\n\
    # knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp 22045:tcp 23501:tcp 24691:tcp\n```\n\
    \n目标主机 IP 地址为 11.11.11.11。在这个示例中，如果你愿意，也可以在列表 1.1](#c01.xhtml_rc01_lit_1)中组合 UDP\
    \ 和 TCP 端口；你的客户端敲门序列可能像这样：\n\n```bash\n# knock 11.11.11.11 6:tcp 1450:udp 8156:udp\
    \ 22045:tcp 23501:udp 24691:tcp\n```\n\n一个很好的快捷方法是，如果你只想使用 UDP 端口，可以直接在命令开头添加\
    \ `-u`，而不是显式指定它们。你可以运行如下 UDP 端口命令：\n\n```bash\n# knock -u 11.11.11.11 22 33 44\n\
    ```\n\n让我们回到服务器配置文件查看 TCP 和 UDP 如何在有效敲门序列中互换。为了混合协议，你只需如下修改 `openSSH` 部分下的 `sequence`\
    \ 行如下：\n\n```ini\n[openSSH]\n        sequence = 6:tcp 1450:udp 8156:udp 22045:tcp\
    \ 23501:udp 24691:tcp\n```\n\n## 让你的服务器不可见\n\n一旦你确认安装按照你的预期工作，就可以锁定你的服务器以隐藏攻击隐藏。攻击者可能会知道绑定到你服务器的\
    \ IP 地址，或者通过某种方式查看从该 IP 地址发送和接收的流量。否则，它对互联网用户应该是不可见的。然而，为了实现 `Nmap` 的端口关闭状态，以下方法是有效的。\n\
    \n### 测试你的 iptables\n\n如前所述，我将使用 `iptables`。理想情况下，在锁定服务器之前你应该拥有服务器的物理访问权限，以防出错。如果没有，你应该拥有某种带外访问权限，例如通过虚拟机控制台、你可以登录的辅助网络接口或连接到机器的拨号调制器。注意，除非你先在开发机上测试了配置，否则可能会出错并导致问题。即使我以前使用过端口敲门，偶尔仍然会把自己锁在服务器之外。\n\
    \n考虑到这个警告，让我们从查看你的 `iptables` 命令开始。在将这些规则与已有的规则整合时要小心。在备份后，覆盖你的现有规则可能会更容易。首先，你需要确保你的服务器可以通过本地接口进行通信，如下：\n\
    \n```bash\n# iptables -A INPUT -s 127.0.0.0/8 -j ACCEPT\n```\n\n你现在必须确保任何现有连接都被确认并响应，如下：\n\
    \n```bash\n# iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n\
    ```\n\n你正在使用 `conntrack` 来跟踪关联连接。一旦连接成功启动，你的连接就可以继续。现在，假设你只想为 SSH 服务器打开 TCP 22\
    \ 端口而不打开其他服务，你可以继续操作。参考列表 1.1，添加以下命令来打开 TCP 22 端口：\n\n```bash\ncommand = /sbin/iptables\
    \ -I INPUT -s %IP% -p tcp --dport 22 -j ACCEPT\n```\n\n注意这一行。如果你在命令中使用 `-A INPUT`\
    \ 进行“追加”，你会被 `iptables` 锁在外面。必须使用 `-I` 进行“插入”，以便规则作为第一条规则进入并优于其他规则。\n\n你可能会好奇\
    \ `%IP%` 变量是什么。端口敲门足够智能，可以在 `-s` 字段中使用连接的 IP 地址替换 `%IP%` 值。\n\n现在是你必须非常小心的地方。如果这不起作用，就没有回路了。注意，除非你先在开发机上测试了配置，否则极有可能出错并导致问题。即使我以前使用过端口敲门，偶尔仍然会把自己锁在服务器之外。\n\
    \n如果你在命令中使用 `-A INPUT` 进行“追加”，你会被 `iptables` 锁在外面。必须使用 `-I` 进行“插入”，以便规则作为第一条规则进入并优于其他规则。\n\
    \n要阻塞所有入站流量，使用：\n\n```bash\n# iptables -A INPUT -j DROP\n```\n\n检查规则：\n\n```bash\n\
    # iptables -L\n```\n\n查看详细详细规则：\n\n```bash\n# iptables -nv\n```\n\n### 保存 iptables\
    \ 规则\n\n为了确保你的 iptables 规则在重启后依然有效，你应该在 Debian 上安装名为 `iptables-persistent` 的软件包：\n\
    \n```bash\napt-get install iptables-persistent\n```\n\n然后你可以使用此命令保存规则：\n\n```bash\n\
    # /etc/init.d/iptables-persistent save\n```\n\n或者，你可以运行以下命令恢复到配置：\n\n```bash\n\
    # /etc/init.d/iptables-persistent reload\n```\n\n在 Red Hat 派系中，你可以使用：\n\n```bash\n\
    # /sbin/service iptables save\n```\n\n以及恢复规则：\n\n```bash\n# /sbin/service iptables\
    \ reload\n```\n\n为了上述操作在 systemd Red Hat 派系上工作，首先尝试这个软件包：\n\n```bash\nyum install\
    \ iptables-services\n```\n\n## 其他考虑\n\n关于端口敲门的其他方面可能有帮助。让我们现在来看看。\n\n### 手机客户端\n\
    \n在我的安卓手机上，我首选的 SSH 应用程序叫做 JuiceSSH ([`juicessh.com`](https://juicessh.com))。它有一个第三方插件，允许你将敲门序列作为\
    \ SSH 握手的一部分。这意味着即使你出门没有电脑，也没有理由不使用端口敲门。\n\n### 故障排除\n\n如果你在端口敲门日志文件上运行命令 `tail\
    \ -f logfile.log`，你会看到日志中写入了各种阶段。这包括有效端口是否被敲击，重要的是它们是否按正确的顺序被敲击。\n\n调试选项还让你有机会增加\
    \ `knockd` 产生的日志级别。如果你仔细打开 `/etc/init.d/knockd` 文件并查找 `OPTIONS` 行，你可以在该行的任何现有值添加一个大写的\
    \ D 字符（Shift+d），如下：\n\n```bash\nOPTIONS=\"-d -D\"\n```\n\n一旦你诊断并解决了问题，应该关闭额外的日志，以防止磁盘空间被不占用。`-d`\
    \ 只是表示以守护模式运行 `knockd`，以防你好奇。正常运行时它应该保持现状。\n\n"
- fmt: "\nBack to the client for a moment. You can also add verbosity to the output,\
    \ which the “knock” client generates by adding a `-v` option. Tied in with the\
    \ debugging option, this should give you helpful feedback from both the client\
    \ and server sides of your connections.\n\n### Security Considerations\n\nWhen\
    \ it comes to the public information associated with your server, a reminder that\
    \ your ISP should not be publishing forward or reverse DNS information about the\
    \ IP address that you are using for your server. Your IP address should appear\
    \ to be unused and unallocated in order for it to be invisible.\n\nEven on your\
    \ public services such as `HTTP`, you need to remember to obfuscate the versions\
    \ of the daemons that are in use. The common way to do this with the world's most\
    \ popular web server, `Apache`, is to change the `ServerTokens` to `Prod` and\
    \ set `ServerSignature` to `Off`. These are hardly cutting-edge configuration\
    \ changes, but might mean an automated attack ignores your server when a new zero-day\
    \ exploit is discovered because your `Apache` version number wasn't in its attack\
    \ database.\n\nAnother aspect to consider is discussed in the `knockd` documentation.\
    \ It mentions that if you use `-l` or `--lookup` service launch options to resolve\
    \ hostnames for your log entries, then it might be a security risk. There's a\
    \ chance of some information being leaked to an attacker if you do. The attacker\
    \ may be able to determine the first port of a sequence if it's possible to capture\
    \ DNS traffic from your server.\n\n### Ephemeral Sequences\n\nWhat about using\
    \ a different approach to knocking sequences? It's also possible to use port knocking\
    \ with a predefined list of port sequences that expire after they are used just\
    \ once. Referring back to [Listing 1.1](#c01.xhtml_rc01_lit_1) and your main config\
    \ file, you can add this option to your `open` and `close` sections to enable\
    \ one-time sequences if you want:\n\n```\n[openSSH]\n        One_Time_Sequences\
    \ = /usr/local/etc/portknocking_codes\n```\n\nIf you remove the `sequence` line\
    \ in [Listing 1.1](#c01.xhtml_rc01_lit_1) and replace it with this code, then\
    \ `knockd` will take its sequences from the file specified in the path instead.\n\
    \nThe way that `knockd` deals with one-time sequences is unusual. It reads in\
    \ the next available sequence from that file and then comments out that line following\
    \ a successful connection with a valid knock. It simply adds a hash or pound character\
    \ to the start of the line that has the sequence present. The next connection\
    \ triggers the same sequence.\n\nThe documentation states that you should leave\
    \ space at the start of each line. Otherwise, when the `#` character is added\
    \ to the start of the line, you might find it has been overwritten unintentionally,\
    \ meaning that you're locked out.\n\nInside your sequences file, you can add one\
    \ sequence per line. That file follows the same format as the `sequences` option\
    \ within the main config file.\n\nThe documentation also points out that you can\
    \ put comments in by preceding them with a `#` character but bad things will happen\
    \ (such as being locked out of your server) if you edit the sequences file when\
    \ `knockd` is already running.\n\nOnce you understand the basic features of `knockd`,\
    \ it's an excellent addition to experiment with. During testing, you could enter\
    \ telephone numbers that you are able to memorize or some other sequence of numbers\
    \ so that you're not continually looking up an insecure list. For example, you\
    \ might consider rotating through five telephone numbers, split up into valid\
    \ port numbers.\n\n### Summary\n\nIn addition to making your server invisible,\
    \ I've covered how your server appears to the Internet before launching an attack.\
    \ In order to fully obfuscate your server using port knocking, you should think\
    \ carefully about public information such as reverse DNS entry, which might give\
    \ away an IP address as being in use. You might also consider using `NAT` to hide\
    \ a server and dynamically change its IP address periodically, only letting administrators\
    \ know which IP address is in use at a given time via a secret hostname, published\
    \ covertly in DNS on an unusual Domain Name.\n\nThere are many other facets to\
    \ protecting a server; still, I've hopefully covered enough ground to make you\
    \ consider what information is leaked to the public and may potentially be used\
    \ in future exploits, as well as hiding a server if you need to do so.\n\n# Chapter\
    \ 2: Digitally Fingerprint Your Files\n\nThere are a number of good reasons to\
    \ keep an eye on your server security. Few sysadmin types absorb the necessary\
    \ security knowledge required to keep their infrastructure safe without enthusiasm\
    \ and effort. If you're anything like me, there have been a few bumps along the\
    \ way, such as when I had a server compromised around the turn of the millennium\
    \ thanks to a nasty PHP bug, or when I was faced with and repelled two relatively\
    \ significant DDoS attacks.\n\nThis chapter will cover another attack vector,\
    \ rootkits, and a fantastic piece of software called Rootkit Hunter (you may know\
    \ it as `rkhunter`). You will start off, however, by exploring how to monitor\
    \ your filesystem's important files, such as its executables.\n\n## Filesystem\
    \ Integrity\n\nMany years ago I used `Tripwire` ([`http://sourceforge.net/projects/tripwire`](http://sourceforge.net/projects/tripwire)).\
    \ It's now referred to as Open Source Tripwire, thanks to the availability of\
    \ other products. `Tripwire` ran periodically (overnight using `cron`) and used\
    \ cryptographic hashing to monitor any file changes on your system.\n\nBy generating\
    \ and recording the hashes of any files visible on the filesystem initially, during\
    \ its first run, `Tripwire` was able to alert the administrator if any hashes\
    \ didn't match those it had recorded on each subsequent run. If the file had been\
    \ altered in any way the hash would be changed. It's a clever approach, despite\
    \ being I/O resource intensive on older hardware, and has since given birth to\
    \ great grandchildren. One example is the popular `AIDE` (Advanced Intrusion Detection\
    \ Environment), which is described as “a file and directory checker” at [`http://aide.sourceforge.net`](http://aide.sourceforge.net).\
    \ I would certainly recommend trying `AIDE` or `Tripwire` on a development machine\
    \ if you get the chance. Be warned, however, that if you are lax with the initial\
    \ configuration, then you will be bombarded with false positives.\n\nThis type\
    \ of security often appears under the umbrella of host-based intrusion detection\
    \ systems, or HIDS, and it was reportedly one of the first types of software-based\
    \ security because mainframes had few externally interactions over networks.\n\
    \nIf you don't want to run nightly filesystem checks or you aren't in a position\
    \ to receive daily system reports, then that's not a problem. You can opt to go\
    \ for an older approach where you only scan your filesystem once, after you have\
    \ built your server, in order to collect information about what files are installed\
    \ on the filesystem. I will explain why this is useful in a moment.\n\nYou might\
    \ be surprised that a tool you've almost certainly used for another purpose can\
    \ be easily used as a security assistant.\n\nStep forward the `md5sum` command.\
    \ When downloading Unix-type files in the past, you have probably been offered\
    \ the option to check the integrity of your potential download by verifying the\
    \ MD5sums for those files. For example, the MD5sums are usually present on the\
    \ website that you get your Linux installation ISO image from.\n\nAs you can see\
    \ in [Figure 2.1](#c02.xhtml_c02-fig-0001), this is what you're faced with when\
    \ downloading Debian Jessie from this Dutch mirror: [`http://ftp.nl.debian.org/debian/dists/jesjie/main/installer-amd64/current/images/`](http://ftp.nl.debian.org/debian/dists/jesjie/main/installer-amd64/current/images/).\n\
    \n![Illustration depicting the download of Debian Jessie from a Dutch mirror.](images/c02f001.jpg)\n"
