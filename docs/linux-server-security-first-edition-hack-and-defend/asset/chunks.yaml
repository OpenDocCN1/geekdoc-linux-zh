    If you run into the same trouble, then instead of adding the following two lines
    to your new config file, simply navigate to the line mentioning `kern.*` under
    RULES again in the main config file (`/etc/rsyslog.conf`) to avoid using a separate
    config file altogether, and add these two lines:


    ```

    :msg, contains, "Pings"                 /var/log/iptables-pings.log

    & ∼

    ```


    The first line catches entries that include the string “Pings” and then asks syslog
    to write them to the file `/var/log/iptables-pings.log`. The second line is a
    little unusual and tells the syslog software to ignore any entries caught by the
    previous line so that you''re not doubling up with your logs by writing the same
    content to another file. You can, of course, leave that second line out if you''d
    like to log elsewhere too.


    Now that you''re able to drop content to a log file and filter out specific iptables
    events (adding your own labels as you prefer), let''s look at other examples.


    ## Multipart Rules


    If you want to allow pings to reach your servers and also allow outbound pings
    from your server, then each operation involves slightly different iptables configuration.


    The following web page explains how to allow pings into a certain IP address on
    your server (assuming you have more than one bound to your server) along with
    the different outbound pings config: [`www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html`](http://www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html).


    Note that the `-d` for destination on the inbound ping rules means a specific
    IP address.


    ## Log Everything for Forensic Analysis


    If you were concerned that you were experiencing an attack and you wanted to log
    all inbound connections to your machine, then you could (briefly) enable this
    command:


    ```

    # iptables -I INPUT -m state --state NEW -j LOG --log-prefix "Logged Traffic:
    "

    ```


    Be warned that your `/var/log/messages` file would soon be very large, so you
    would have to disable the logging by flushing the rule as soon as you could. (You
    can check out the example later in this section to find out how to do this.) You
    might expect the output to look something like this from the `iptables` command:


    ```

    Nov  11 01:11:01 ChrisLinuxHost kernel: New Connection: IN=eth0 OUT= MAC=ff:ff:ff:ff:ff:ff:00:41:23:4f:4d:1f:08:00
    SRC=10.10.10.10 DST=10.10.10.255 LEN=78 TOS=0x00 PREC=0x00 TTL=128 ID=28621 PROTO=UDP
    SPT=137 DPT=137 LEN=58

    ```


    This extract is taken from my now sizeable `/var/log/messages` file. The traffic
    appears to have been generated by a Netbios packet. Simply swap `INPUT` with `OUTPUT`
    if you would prefer to track egested traffic.


    On that note, what if you want to log traffic but also rate-limit what hits your
    server logs? Here''s an example:


    ```

    # iptables -I INPUT -p icmp -m limit --limit 5/min -j LOG --log-prefix "Blocked
    ICMP Traffic: " --log-level 7

    ```


    It''s simple enough to change `-p icmp` to `-p tcp` or `-p udp` and pick up TCP
    and UDP packets, respectively. This example means that you are only logging five
    packets per minute of this type of traffic. This can be useful because, generally,
    the first few probes are informative before repetition starts.


    Incidentally, if you find that your logs are filling up too quickly, then you
    can just flush every iptables rule like this:


    ```

    # iptables -F

    # iptables -X

    # iptables -t nat -F

    # iptables -t nat -X

    # iptables -t mangle -F

    # iptables -t mangle -X

    # iptables -t raw -F

    # iptables -t raw -X

    # iptables -t security -F

    # iptables -t security -X

    # iptables -P INPUT ACCEPT

    # iptables -P FORWARD ACCEPT

    # iptables -P OUTPUT ACCEPT

    ```


    My preference is to put this string of commands into a script (or very long Bash
    alias, with the commands separated by semicolons), and as the root user, I can
    type `flush` whenever I need a quick, fail-safe removal of all the firewall rules
    in use.


    ## Hardening


    If you''re worried about your system being overloaded with ICMP traffic, then
    there are a couple of relatively simple things you can check. This is thanks to
    the power of Unix-type operating systems. First (and your build may already have
    this set as default), you can ignore ICMP broadcasts by adding the following line
    to the bottom of the file `/etc/sysctl.conf`:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    This `sysctl.conf` example will persist a reboot, whereas the following command
    will set it live immediately:


    ```

    # echo "1" > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    The following command will also set it live immediately if you have followed the
    `sysctl.conf` example (it reloads all the config settings found inside the file
    `sysctl.conf`):


    ```

    # sysctl -p

    ```

