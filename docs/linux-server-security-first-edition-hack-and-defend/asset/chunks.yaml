- fmt: '

    An older document was written in the year 2000 to stimulate debate and assist
    those with an interest in keeping the Internet running. Called Best Current Practice
    38 (BPC 38; [`https://tools.ietf.org/html/bcp38`](https://tools.ietf.org/html/bcp38)),
    this document offers welcome advice to network administrators. Among other organizations,
    it encourages enterprises and academic institutions to toughen up varying aspects
    of their networking infrastructure, on both their hosts and networking equipment,
    to prevent cascading effects around the Internet.


    Specifically, it takes some time to discuss the importance of ingress filtering
    to protect external networks from your own network if it is used as an attack
    tool. Citing that, by employing simple preventative measures, the diagnosis and
    mitigation of an attack from a “valid” source is far more effective than guessing
    where the originating traffic comes from, as you saw in the earlier section, “NTP
    Reflection Attacks.”


    Varying levels of ingress filtering should achieve that goal in many circumstances.
    One of the observations presented is that by reducing the number and frequency
    of attacks on the Internet, ultimately more resources will be available when attacks
    do occur. As a result, responses will be more effective. Much of the content contributed
    to these seminal guidelines is attributed to the venerable NANOG (North American
    Network Operators'' Group; [`https://www.nanog.org`](https://www.nanog.org)) who
    vociferously discuss networking issues in detail on a popular mailing list.


    ## Bringing a Nation to Its Knees


    The threat of multiple, geographically diverse systems being aimed at a single
    system — such as a networked or autonomous system, regardless of how large it
    may be — and taking it offline has long been a concern for enterprises, ISPs,
    and even entire nations. DDoS attacks may even have existed since the mid-1980s.


    It was widely reported in 2007 that the Baltic state of Estonia suffered repeated
    DDoS attacks that, coupled with street rioting, almost brought the government
    to its knees. Apparently the population objected to the removal of a famous war
    memorial by the Estonian parliament. Coupled with a high level of social unrest,
    this was the final tipping point. The steadily increasing levels of attack traffic
    from the DDoS were received in a sustained manner over a prolonged period of time.
    News agencies were frustrated about the lack of connectivity, as this meant that
    the rest of the world could not be kept up-to-date with events as they unfolded
    within the country.


    The Estonian DDoS evolved, and at one point reportedly involved four million packets
    per second of attack traffic. This was partly aimed at, and according to some
    reports was ultimately successful in, taking the nation''s largest bank off the
    Internet. According to national statistics, around 97 percent of the population
    banked online, which meant this was a critical failure in the country''s banking
    systems. And if the impact wasn''t damaging enough already, the lack of Internet
    connectivity meant that the main bank couldn''t communicate with, or dispense
    cash from, automated teller machines (ATMs).


    Worryingly, it has been said that the only arrest relating to this hugely destructive
    incident, which lasted around three weeks, resulted in a fine worth less than
    US$2,000\. NATO''s involvement in furthering the effectiveness of international
    responses to these attacks was bolstered, however, by the stark lessons learned
    in Estonia.


    ## Mapping Attacks


    As the excellent book, *Firewalls and Internet Security: Repelling the Wily Hacker,*
    by William Cheswick, et al. succinctly states in the Introduction:


    > The Internet is a large city, not a series of small towns. Anyone can use it,
    and use it nearly anonymously.


    > The Internet is a bad neighborhood.


    The validity of this quote can be confirmed by using Digital Attack Map, an online
    tool that provides an excellent global overview of DDoS attacks and that is updated
    hourly, at [`www.digitalattackmap.com`](http://www.digitalattackmap.com).


    This fully graphical Digital Attack Map tool is run by Arbor Networks and Google
    Ideas, which populate the tool with data from over 270 global ISPs. These ISPs
    have agreed to share data with Arbor Networks'' global threat intelligence system,
    `ATLAS`. The data is also available via Arbor''s `ATLAS` threat portal and is
    worth a closer look at [`www.arbornetworks.com/threats`](http://www.arbornetworks.com/threats).


    In addition, there''s a useful gallery that highlights key historical attacks
    for reference, at [`www.digitalattackmap.com/gallery`](http://www.digitalattackmap.com/gallery).
    You can interact by hovering your mouse over the attack flows and revealing the
    eye-watering gigabits per second of bandwidth that were abused during the attack.
    There are also approximate sources of the attacks (for example, if an attack was
    generated by a botnet, then it might be from dozens of different countries), the
    presumed intended victim, and the attack''s duration. Of additional interest are
    the source and destination ports used during the attack; lo and behold, the `NTP`
    port, `UDP` port `123`, was present in one of the first few attacks that I queried.
    Interestingly, though, ports `80` and `53`, `HTTP` and `DNS` respectively, still
    seem to be the most popular DDoS services, judging by the available data.


    [Figure 4.1](#c04.xhtml_c04-fig-0001) shows a sample of attacks from the Digital
    Attack Map website, along with the types of attacks and their color-coding on
    the left side of the global map. This is merely the splash page of this highly
    functional site. You could spend hours drilling down into both current and historical
    information that the site presents in an easily digestible format.


    ![Sample of attacks from the Digital Attack Map website from Arbor Networks, along
    with the types of attacks and their color-coding on the left side of the global
    map.](images/c04f001.jpg)


    [Figure 4.1](#c04.xhtml_c04-fig-anc-0001) The comprehensive Digital Attack Map
    website from Arbor Networks, and powered by Google Ideas


    ## Summary


    In this chapter, we looked at a number of security issues that affect critical
    infrastructure services. These services, mostly affected using the more vulnerable
    `UDP`, genuinely help to bring the Internet together and clearly need to be protected.
    Some of these attacks are of an older design, but it is interesting to note how
    categories of attacks surge and diminish over different periods of time. For example,
    an attack that has not been seen for many years might resurface in a slightly
    more evolved state. As you saw more recently, the `SNMP` attack tools made available
    by the hacking community, most likely encouraged by the success of the `NTP` reflection
    attacks, have generated the most interest.


    Even if it''s not possible to follow the detailed intricacies of more sophisticated
    attacks, the premise is simple. Services relying on `UDP` are currently most at
    risk. `UDP` does not always expect a response (`TCP` enjoys a three-way handshake)
    and is therefore more likely to be exploited for reflection and amplification
    attacks.


    You may previously have thought that following the initial lockdown of network
    services as they were being built (only partially opening up necessary services
    by using `ACLs`), these types of attacks would rarely impact a network or system''s
    day-to-day operations. However, if you want your infrastructure to succeed in
    today''s ever-changing attack landscape, it''s imperative that you continuously
    monitor how your networks and systems interact with the outside world, revising
    `ACLs` and policies frequently.

