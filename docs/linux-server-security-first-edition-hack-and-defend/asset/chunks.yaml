    完成上述操作后，你现在可以 `cd` 进入新创建的 `hashcat-2.00/` ，其中包含许多文件和子目录。特别值得关注的是 `docs` 和 `examples`
    目录，你可以尽情探索它们。别担心，稍后我们将介绍如何运行 Hashcat 可执行文件。


    顺便提一下，如果你对最新的开发版本感兴趣，可以在 GitHub 上找到页面，地址为 [`https://github.com/hashcat/hashcat`](https://github.com/hashcat/hashcat)。该页面还包含了文档和指向
    wiki 的链接，这些应该会引起你的兴趣。


    如果你运行的是复杂的渗透测试套件 Kali Linux，那么得益于它是内置的，你应该能够按照以下方式安装 Hashcat：


    ```

    # apt-get install hashcat

    ```


    ### 哈希值识别 (Hash Identification)


    在使用 Hashcat 之前，有几点需要考虑。你首先需要知道你正尝试从中恢复密码的哈希类型。


    让我们考虑一下 Linux 用户密码。使用的默认哈希算法会随着时间的推移而定期变化，并且取决于发行版。过去，常见的默认值是 MD5 和 DES，但现在 SHA512
    已经非常常见。


    如果你能识别出你正在攻击的是什么哈希类型，对 Hashcat 很有帮助。你可以运行以下命令来发现正在使用哪种哈希算法：


    ```

    # authconfig --test | grep hash

    ```


    如果你担心机器的安全性，并想升级机器 Shadow 密码所使用的哈希算法，可以使用以下命令：


    ```bash

    # authconfig --passalgo=sha512 --update

    ```


    在这个示例中，如果你想的话，可以将 `sha512` 替换为 `sha256`。但请注意，为了使此更改生效，你需要用户更改密码，以便将它们转换为新的哈希类型。你可以使用以下命令让用户密码过期，强制用户在下次登录时更改：


    ```bash

    # chage -d 0 chrisbinnie

    ```


    此示例中的“更改年龄”命令将过期日期推到了 1970 年 1 月 1 日，这确保了它始终早于系统时钟的当前设置。


    让我们再次查看我为用户 chrisbinnie 提供的 `/etc/shadow` 条目：


    ```

    chrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::

    ```


    你不需要运行 `authconfig` 命令就能确定示例条目使用的是 SHA512 哈希。你可以参考表 9.1 中的代码推断出这一点。


    | 符号 | 哈希算法 |

    | :--- | :--- |

    | $0 | DES |

    | $1 | MD5 哈希 |

    | $2 | Blowfish |

    | $2A | Eksblowfish |

    | $5 | SHA256 |

    | $6 | SHA512 |


    表 9.1 如何识别哈希算法


    在 Shadow 密码示例中，在用户名后的两个美元符号之间直接有这三个字符：`$6$`。从表 9.1 中你可以看出 `/etc/shadow` 密码使用的是
    SHA512。这是一个好消息，因为它是一种强算法。


    密码条目的下一部分（从 `$6$` 之后到下一个美元符号之前）是盐（salt）。在这种情况下，它是 `TRIYWb5l`。


    密码（使用盐加密）是美元符号之后到第一个冒号之前的下一部分。此之后，冒号之间的其他部分为系统提供了一些相关的登录信息，例如用户密码何时过期、最后一次更改时间是什么时候等。


    为了衡量更强的算法是什么时候开始使用的了，请考虑这一点：根据 Fedora 的说法，从 Fedora 8 开始，`glibc` 包就已经支持了 SHA256
    和 SHA512 哈希。因此，从 Fedora 9 开始，就可以使用 SHA256 和 SHA512 作为密码。


    如果你卡住了，可以查看网站 [`http://verifier.insidepro.com`](http://verifier.insidepro.com)
    来确定你想让 Hashcat 指向哪种哈希变体。我这里使用的示例哈希值成功率有限，因为它们是使用另一个网站的工具生成的，所以请注意，识别未知类型的哈希算法可能需要你一些时间。


    如果有用的话，尝试运行以下命令来生成一个带盐的 MD5 密码（你需要安装 `openssl`）：


    ```

    # openssl passwd -1 -salt 123 PASSWORD

    $1$123$YPya29UI1XS9hz1d23ltx/

    ```


    从运行该命令的结果中，注意 `$1$` 和 `123` 相对于加密密码的位置。


    我有时会像这样运行 MD5 哈希测试（不带盐）：


    ```

    # echo PASSWORD | md5sum

    827cc519a664485351d0e56f8dc6292e

    ```

