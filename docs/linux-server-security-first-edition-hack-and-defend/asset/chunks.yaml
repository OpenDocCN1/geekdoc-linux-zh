  trans: '


    关注 NTP 的整体安全性还有其他充分理由。除了对 IP 地址的需求以及带宽使用对银行余额的影响外，你还需要将互联网的 NTP 基础设施列入服务清单，因为这些服务即将受到物联网（IoT）可能爆炸性的、指数级增长的影响。据记录，很快将会有数以亿计的额外设备需要进行同步，这样你的冰箱就可以在牛奶用光之前订购一些，诸此类推。


    ## NTP 反射攻击


    2014 年左右，一种恶劣的 NTP 攻击浮出水，令互联网服务提供商（ISP）不堪不堪，并迫使互联网社区采取迅速且有效的行动来遏制它。在短时间内，至少在攻击受害者中，这种攻击造成了巨大的困惑。这种惊人简单但具有创新的漏洞影响了几乎所有的
    NTP 实现。这种攻击被称为反射攻击（reflection attack），其本质是产生原本不需要的流量，并将这些流量指向受害者。除非受害者拥有重大的底层基础设施支持，否则这通常会导致受害者遭受负载或带宽容量问题。在过去，这些攻击被称为“挑战-响应攻击”（challenge-response
    attacks）；但在我看来，这种描述并没有太大帮助，因为并不是所有的反射攻击都涉及身份验证，而挑战-响应通常与身份验证机制相关。


    2014 年的 NTP 攻击遵循此前经常看到的类似 DNS 反射攻击。当发现某个关键服务存在此前未见过的可利用攻击向量时，技术人员会争分夺秒地保护自己的基础设施。他们面临的决策包括：在发布补丁或配置修复之前，是否需要立即禁用该单一服务以确保其他服务的继续运行。毕竟，在计算机上手动设置时间，或者在许多情况下允许系统时钟存在微小误差是可能的。许多服务在出现任何不良影响之前，都可以在缺失
    24 小时 NTP 同步更新的情况下幸存。


    在这类攻击中，有两个术语出现频率很高。第一个是 `reflection`（反射），同源于攻击流量的镜像式重定向。在这里，许多第三方服务通常通过将流量发送给受害者（主要目标）而不是攻击者来做出响应。这是通过伪造或欺骗攻击者的
    IP 地址实现的，从而欺骗第三方关于最初是谁请求了该流量。


    另一方面，`Amplification`（放大）最好被解释为：发送一个数据包作为问题，并收到一百个数据包作为答案。在反射攻击的情况下，这指的是毫无防备的受害者收到了负载，或者收到了一个并未问过的巨大答案。


    想象三角形中的三台机器。机器 A 代表 B 向机器 C 提了大量问题。机器 C 然后将所有答案错误地发送给 B。机器 B 被海量的答案淹没。机器 A 对 B
    来说是不可见的，B 甚至不知道 A 参与了攻击。对于保护其基础设施的人来说，这构成了一个极具挑战性的诊断。


    据报道，由标准 DNS 反射攻击产生的 DDoS 流量放大比例约为 70:1。也就是说，如果你有 1 Gb 比特的可用带宽，你就可以转发 70 Gb 比特。据报道，通过
    NTP 漏洞实现的上述反射比例范围在 20:1 到 200:1 之间。你只需要查找一个免费提供的公共 NTP 服务器列表，就可以创建惊人的 NTP 流量来为你的
    DDoS 攻击提供燃料。


    NTP 攻击正如常一样，简单得可怕。它基于一个内置函数，该函数允许任何人查询最后几百个连接过的 NTP 服务器。被利用的函数称为 `monlist`；你可能还会看到它显示为
    `MON_GETLIST`。攻击者伪造提问的 IP 地址，使得被查询的 NTP 服务器回复受害者而不是提交查询的机器。通过反复执行该命令，如果有成千上万服务器同时响应，受害者很快就会被淹没。这种“反射”攻击的“放大”——答案中涉及的数据量远大于原始问题——正是其具有如此破坏性的原因。这是因为只需用于进行此类查询的源服务器数量较少，就能击倒大量的设施部分。


    在 IPv4 系统（第一行显示为 `-4`）和 IPv6 系统（第二行带有 `-6`）上，缓解此类攻击的核心在于你的 NTP 配置文件中的以下几行：


    ```

    restrict -4 default nomodify nopeer noquery notrap

    restrict -6 default nomodify nopeer noquery notrap

    ```


    在其他地方，还有一个非常受欢迎的 NTP 服务器模板，你可以用它帮助你的面向网服务器避免成为此类攻击的一部分，地址位于 [`www.team-cymru.org/templates.html`](http://www.team-cymru.org/templates.html)。如果你访问该页面并点击“Secure
    NTP Template”链接，将看到一组针对各种平台的模板，包括 Cisco iOS、Juniper Junos 和 Unix。


    此外还包含一个如何配置 IPtables 以帮助锁定 NTP 的有用提示如下：


    ```

    # iptables -A INPUT -s 0/0 -d 0/0 -p udp --source-port 123:123 -m state --state
    ESTABLISHED -j ACCEPT

    # iptables -A OUTPUT -s 0/0 -d 0/0 -p udp --destination-port 123:123 -m state
    --state NEW,ESTABLISHED -j ACCEPT

    ```


    此外，还有一条有趣的备注，说明如果你恐慌并决定通过在路由器级别阻止 NTP 流量进入你的网络，可能会产生潜在的破坏性影响。只有在你完全清楚自己在做什么时，才应该过滤
    UDP 端口 `123` 的 NTP 流量，否则关键服务将不可避免地失败。


    ## 攻击报告


    当那次 NTP 攻击发生时，云服务提供商 CloudFlare 宣布了记录在案最大的同类攻击。根据 CloudFlare 的数据，攻击流量接近 400 Gbps，令人震惊的是，需要
    4529 台服务器才能产生如此巨大的流量，横跨了 1298 个不同的网络。相比之下，针对 Spamhaus（反垃圾邮件服务提供商）的一次广为人知的攻击据报道使用了
    30956 个开放 DNS 解析器生成了 300 Gbps 的 DDoS。如你所示，从单机器的影响来看，这种差异是巨大的。


    另一种越来越多用于 DDoS 攻击的协议是 1988 年由 PSINet 创建的，PSINet 是全球最大的 ISP 之一（如果不是最大的话），最终被各种合并和收购吸收。


    简单网络管理协议 (`SNMP`）存在于绝大多数网络设备中，例如交换机和路由器。这种实用的协议有助于将统计信息（如带宽使用情况）反馈给任何能够接收它的软件。最重要的是，默认开启了一个基于名为
    `public` 的社区字符串的攻击向量。即使配置了密码，它们通常也很简单，例如 `private`。这意味着即使你的宽带路由器也构成了潜在风险，并可能参与
    DDoS 攻击。


    '
- fmt: '

    Attackers have been witnessed experimenting with `SNMP` for sizeable reflection/amplification
    attacks. The alarming traffic ratios are reportedly as much as 1700:1. How accurate
    that estimate is remains to be seen, of course, and whether a degree of scaremongering
    is present.


    In May 2014, Akamai''s DDoS division reported that they had spotted 14 `SNMP`
    attacks. Just under half were in the U.S., and around 18 percent in China.


    ## Preventing SNMP Reflection


    Following a quick check of your `/etc/services` file, you can see the following
    details for the default ports used by `SNMP`:


    ```

    snmp            161/tcp                        # Simple Net Mgmt Proto

    snmp            161/udp                        # Simple Net Mgmt Proto

    snmptrap        162/tcp                        # SNMPTRAP

    snmptrap        162/udp     snmp-trap          # Traps for SNMP

    ```


    To prevent the reflection of `SNMP` traffic originating from your network, you
    can follow a deny-by-default practice, making sure that your perimeter firewalls
    don''t let any of this traffic out of your LAN and onto the Internet. Of course,
    this also applies to traffic coming into your LAN. So often, however, default
    settings are left unchanged when equipment is set up in a hurry, upgraded, or
    configured by unskilled personnel, resulting in these preventative measures being
    missed. What is most worrying about such an attack is that, thanks to the sheer
    number of broadband routers around the planet, it can take a long time to manually
    patch some of them (although responsible ISPs can add helpful ingress and egress
    filters to their networks). Meanwhile, large sections of infrastructure can start
    to suffer from performance issues.


    The `SNMP` attack as described by Akamai was attributed to a specifically crafted
    attack tool. The tool automated `GetBulk` requests and spoofed the IP address,
    in the same way as NTP and DNS reflection attacks, in order to make sure the victim''s
    IP address received the barrages of responses sent in reply to the spurious requests.
    Thankfully, this particular attack only applies to an older version of `SNMP`,
    version 2. Version 3 offers greater security and doesn''t open itself up to as
    much abuse by default.


    Worryingly, the key design of this attack was to generate significant amounts
    of traffic by only a few requests and possibly even from a single machine. Criminals
    can disrupt large sections of online infrastructure without needing to invest
    time and resources (and sometimes money to meet the purchase price of a botnet).


    ## DNS Resolvers


    Near the end of 2014, another interesting attack came to light. It''s still somewhat
    debatable if this was actually intended to be a reflection attack, but I''ll discuss
    it here to add to your knowledge on the subject. As part of their services, Google
    offers two prominent `DNS` resolvers with memorable IP addresses:


    ```

    8.8.8.8

    8.8.4.4

    ```


    These resolvers allow recursive `DNS` lookups for any individual or device that
    doesn''t have a full-fledged `DNS` server available. These `DNS` resolvers will
    respond with any lookups you request, either from their cache or via a fresh lookup
    if a suitable answer doesn''t exist in their cache. OpenDNS offers similar services
    but openly discusses the benefits of filtering your `DNS` queries, for the purposes
    of alerting you, for example, if you attempt to visit a previously reported phishing
    site. Their IP addresses are also easy to remember, resilient, and reliable:


    ```

    208.67.222.222

    208.67.220.220

    ```


    These (mostly) free services are widely adopted, probably because they offer the
    convenience of not having the overhead of running `DNS` servers locally. However,
    thanks to their memorable IP addresses and outstanding reliability, sadly as with
    many popular services, these well-meaning providers present another high-value
    target that is attractive to attackers.


    Clearly there are very good reasons to pay close attention to where you use such
    services within your production infrastructure, thanks to your lack of control
    should they be compromised. The most obvious attack, in terms of `DNS` lookup,
    might be `DNS` cache poisoning where the querying machine is given a false answer
    and sent to an illegitimate IP address, which could potentially infect the requestor
    or attack it in some other way. One of the many `DNS` cache poisoning attacks
    are so-called Kaminsky-style attacks ([http://dankaminsky.com`](http://dankaminsky.com)),
    which don''t just poison individual `DNS` records but rather take control of the
    authority records for a domain name themselves. There''s some well-written information
    about security researcher Dan Kaminsky''s findings at [`http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html).


    Because of their impact, the significance of `DNS` attacks should not be underestimated.
    Google''s `DNS` resolvers reportedly serve in the region of 150 billion queries
    every day.


    The 2014 attack, which on the surface included Google''s `DNS` resolver IP addresses
    in the last quarter of that year, was picked up by popular online security channels.
    For example, the Internet Storm Center ([https://isc.sans.edu`](https://isc.sans.edu))
    offered advice on spotting attacks purporting to come from Google''s `DNS` resolvers
    as they arrived on your network. With some simple packet sniffing, it''s possible
    to monitor this type of attack and log its frequency.


    Here, using the `tcpdump` sniffing tool, you''re simply dumping any pertinent
    traffic that you spot into a file called `/tmp/suspect_traffic`. You''re categorizing
    that traffic as anything arriving from the IP address `8.8.8.8` (which is just
    one of Google''s resolvers) and destined for port `161`.


    ```

    # tcpdump -s0 -w /tmp/suspect_traffic dst port 161 and src host 8.8.8.8

    ```


    By capturing this traffic, you can monitor its volume and whether the `DNS` queries
    are likely to be legitimate. If unwelcome traffic is discovered, you might want
    to restrict how those devices that are affected communicate outside your network
    by introducing firewall rules. Firewalling offers access to the outside world
    for the devices in question.


    Discussions between white hats and other security professionals suggested that
    these attacks, apparently sourcing traffic from Google''s IP addresses, were actually
    designed (using the IP addresses that were preconfigured as the devices'' DNS
    servers) to exploit and defeat poorly configured devices with other nefarious
    intentions, rather than being used to reflect traffic elsewhere. In other words,
    attackers could potentially reconfigure these devices for their own nefarious
    uses rather than deny their service.


    For further reading, consider a separate attack vector and an attempt to circumvent
    legitimate BGP announcements (the Border Gateway Protocol is the sophisticated
    routing protocol that knits the Internet''s many networks together) for Google''s
    `DNS` resolvers; you can read more about it at [`http://thehackernews.com/2014/03/google-public-dns-server-traffic.html`](http://thehackernews.com/2014/03/google-public-dns-server-traffic.html).


    ## Complicity


    There is a set of recommendations that look at limiting spoofed traffic that leaves
    your network. Unfortunately, experience tells us that, whether it''s through incompetence
    or lack of resources, there will always be a percentage of network administrators
    who fail to realize the importance of following such guidelines or who simply
    aren''t equipped to pay attention to them. Not forgetting, of course, the small
    percentage of those administrators who purposefully leave holes open for criminal
    activities.

