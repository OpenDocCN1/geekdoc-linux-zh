    # Chapter 7


    Nmap''s Prodigious NSE


    Even novice sysadmins have probably heard of and run port scans against local
    and remote hosts. They may also have heard of one famous port scanner on the market,
    created by the Nmap Project, called Nmap. Nmap stands for “Network Mapper,” and
    along with being superfast, sophisticated, and efficient, it''s brimming with
    features.


    Among its many features, you can test for which operating system a remote server
    is running, audit the security of both local and remote machines, and create an
    inventory of the machines and their active services on a network.


    You may have used Nmap for port scanning in the past, but there''s a good chance
    that you didn''t realize what a powerful penetration-testing tool it is. This
    is partly thanks to its sophisticated built-in scripting engine. Before you look
    at that, however, you will first review Nmap''s basic port scanning functionality.
    Then you will learn how Nmap can be used for more advanced white hat activities.


    ## Basic Port Scanning


    Even the basic (port scanning) features bundled with Nmap include advanced options
    such as spoofing your source IP address (using the `-S` option). A magnificent
    selection of features is available. But first, let''s start with installing the
    package.


    To install Nmap on Red Hat derivatives, you can use this command:


    ```

    # yum install nmap

    ```


    On Debian and its derivative distributions, you can use this command:


    ```

    # apt-get install nmap

    ```


    If you want to use RPM Package Managers on Red Hat''s derivatives rather than
    running these commands, then you can find more information at [`https://nmap.org/book/inst-linux.html`](https://nmap.org/book/inst-linux.html).


    If you''re familiar with the file `/etc/services` on Unix-type machines, then
    the inclusion of the `/usr/share/nmap/nmap-services` file with Nmap should make
    sense. Be aware that your file''s location may change slightly. Within this file,
    you tie port numbers to humanly readable service names — a little like localized
    DNS, I suppose (like the `/etc/hosts` file where there''s usually a `key:value`
    format). One line in the Nmap version of that file would look something like this:


    ```

    Service name   Portnum/protocol   Open-frequency   Optional comments

    ftp                   21/sctp                  0.000000             # File Transfer
    [Control]

    ftp                   21/tcp                    0.197667             # File Transfer
    [Control]

    ftp                   21/udp                   0.004844             # File Transfer
    [Control]

    ssh                 22/sctp                  0.000000             # Secure Shell
    Login

    ssh                 22/tcp                    0.182286             # Secure Shell
    Login

    ssh                 22/udp                   0.003905             # Secure Shell
    Login

    telnet              23/tcp                    0.221265

    telnet              23/udp                   0.006211

    ```


    This file is useful because you can edit it to suit your Nmap activities without
    accidentally misconfiguring your local machine''s `/etc/services` file. The custom
    version that Nmap includes also adds a little more detail to the usual two fields
    in your local file. As you can see in this example, there are four columns with
    field descriptions at the top.


    Some people call this port mapping, which isn''t a bad description. If you''re
    curious, the open-frequency field has been populated following extensive research
    online (by running a large number of Nmap scans) and tells you how often the study
    found that port to be open. This more comprehensive configuration file can also
    be a useful reference when you''re trying to troubleshoot an issue.


    What about asking Nmap to run a simple scan on a machine? Let''s perform a basic
    port scan on a remote IPv4 IP address. In this example you use the “-PN” option
    in order to miss out a ping test, assuming you know that the machine is online
    (note that older versions of Nmap used “`-P0`” and “`-PN`”, in case it causes
    confusion, and stands for “host discovery”):


    ```

    # nmap -PN 123.123.123.123

    ```


    The results might look something like this:


    ```

    Starting Nmap 5.51 (http://nmap.org) at 2016-11-16 11:16 GMT

    Nmap scan report for www.chrisbinnie.tld (123.123.123.123)

    Host is up (0.00051s latency).

    Not shown: 999 closed ports

    PORT    STATE SERVICE

    22/tcp  open  ssh

    Nmap done: 1 IP address (1 host up) scanned in 0.09 seconds

    ```


    You can see that 999 ports were scanned by default, without you asking Nmap to
    look at any others, and only the SSH port was listening on your remote host.


    As you might expect, you can scan a whole network as follows:


    ```

    # nmap -PN 123.123.123.0/24

    ```


    By including `-n` in the options, you can disable DNS lookups to potentially speed
    up your results and avoid detection by DNS servers, which would otherwise serve
    the answers to your queries.


    If it''s TCP that you''re interested in, then Nmap can connect to TCP ports as
    follows:


    ```

    # nmap -sT www.chrisbinnie.tld

    ```


    Simply swap `-sT` to `-sU` for UDP ports if they''re of interest.


    As I''ve mentioned, there are simply too many options to cover, but before you
    get to the really good stuff, here are a couple of other options that I find useful.


    First, if you''re scanning your local network but don''t want to include certain
    hosts, then you can use an `exclude file` option like this:


    ```

    # nmap 10.10.10.0/24 --excludefile /home/chrisbinnie/exclusions.txt

    ```


    If there are just a few servers that you need to ignore, then you can opt to use
    the following syntax:


    ```

    # nmap 10.10.10.0/24 --exclude 10.10.10.1,10.10.10.10, 10.10.10.100

    ```


    For scanning specific port numbers, you prepend `U` for UDP and `T` for TCP as
    follows:


    ```

    # nmap -p U:53,T:0-1024,8080 10.10.10.111

    ```


    Finally, if you want to see which hosts are up and running on your local network,
    then this is the command to choose (it''s using a “discovery” or ping scan, hence
    the `P`):


    ```

    # nmap -sP 10.10.10.0/24

    ```


    You would expect an output similar to this:


    ```

    Nmap scan report for mail.chrisbinnie.tld (10.10.10.10)

    Host is up (0.028s latency).

    Nmap scan report for smtp.chrisbinnie.tld (10.10.10.11)

    Host is up (0.029s latency).

    ```


    In other words, one line per host.


    ## The Nmap Scripting Engine


    Nmap has a highly sophisticated set of technological innards. It refers to its
    scripting engine as NSE (Nmap Scripting Engine). I''ll run through some of the
    subjects covered in its extensive documentation and indicate when you may want
    to use some of its functionality.'
