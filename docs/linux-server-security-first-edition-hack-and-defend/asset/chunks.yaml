  trans: "\n\nLMD 随带了一个每日 cron 任务，位于 `/etc/cron.daily/maldet`。该任务将更新特征库并清理扫描数据，使其保留时间长达十四天，并使用你指定的配置运行每日扫描。\n\
    \n请注意，会话数据和临时文件在 cron 任务执行之间是保留的。因此，如果你认为结果不准确，你需要运行我之前提到的 `-p` 选项来清除这些文件。\n\n\
    你应该设置电子邮件配置参数，以便每天早上接收每日报告。出于邮件存档的考虑，每日的更新是非常有价值的，而且它可以确保你的扫描每天都在进行且没有发生失败。\n\n\
    ## 恶意软件报告\n\n你已经看到 LMD 是多么复杂且结构精良了，因此 LMD 提供了一个简单的机制来上传可疑文件进行分析，这并不令人意外。如果这些文件证明被感染了未知种类的恶意软件，则可能会创建新的特征码并将其添加到\
    \ LMD 的已知威胁中，以便为其他用户识别恶意软件。将文件发送回 LMD 进行检查的方法如下，使用 `--checkout` 特性（它也可以写为 `-c`\
    \ 选项）：\n\n```\n# maldet -c suspicious_file.gz\n```\n\n当你执行此命令时，你的文件将提交到 [`rfxn.com`](http://rfxn.com)\
    \ 并随后进行检查。\n\n## Apache 集成\n\n在本章前面，我简要提到 LMD 包含的一个巧妙功能。该功能是将 LMD 与 Apache 的 `mod_security2`\
    \ 模块集成的能力。LMD 文档解释说，它使用可变 Apache 模块的 `inspectFile` 钩子功能，允许你运行验证脚本，该脚本可以判断上传是通过或失败。例如，在你的\
    \ Apache 配置中，可能会看到这个来自文档的条目：\n\n```\nSecRequestBodyAccess On\nSecRule FILES_TMPNAMES\
    \ \"@inspectFile /usr/local/maldetect/hookscan.sh\" \\\n                \"id:'999999',log,auditlog,deny,severity:2,phase:2,t:none\"\
    \n```\n\n根据设计，用户上传的每个文件都可以自动扫描，这应该显著减少系统上的威胁数量，特别是在许多用户频繁上传文件的情况下。\n\n文档包含了在默认选项中如何考虑性能和准确性的细节。如果你对此功能感兴趣，我鼓励你查看内置的\
    \ README 文件以获取更多信息。\n\n## 总结\n\n除了查看 LMD 之外，我还提到了它用于实时检查文件系统变化的 `inotify` 机制。巧妙且高效的\
    \ `inotify` 允许在不引入显著系统负载的情况下对恶意软件进行实时检查。\n\n由于 Android 智能手机目前占了全球市场的 80% 以上，毫无疑问，编写用于利用这些设备漏洞的恶意软件在未来将更多地出现在\
    \ Linux 用户设备以及服务器上。\n\n通过在启用 LMD 等复杂工具的同时启用实时文件系统检查，你应该能够显著降低被恶意软件感染的风险。LMD 最初是为提供共享托管服务的服务器而设计的，因为作者认为其他产品忽略了用户账户攻击向量，而这些产品通常侧重于内核和根内核攻击程序（rootkit）感染。\n\
    \n然而，在先在测试环境中尝试安装了 LMD 并熟悉了它的运行方式后，我相信 LMD 绝对值得在你的生产机器上考虑使用。\n\n# 第 9 章：使用 Hashcat\
    \ 破解密码\n\n最近有两款复杂的安全工具引起了我的注意。它们在新闻中因作为开源发布而受到关注，显然，开发者在寻找这些工具源码时在 GitHub 上引发了热潮。所说的工具被称为\
    \ `Hashcat` 和 `oclHashcat`。`Hashcat` ([`hashcat.net/hashcat``](https://hashcat.net/hashcat))\
    \ 大胆地自称为“世界上最快的基于 CPU 的密码恢复工具”。它的近亲兄弟 `oclHashcat` 使用你的图形处理器（GPU）通过数字计算来完成密码恢复过程，而不是\
    \ `Hashcat` 的基于 CPU 的方法。因此，基于 GPU 的 `oclHashcat`甚至比 `Hashcat` 更快。\n\n虽然这类工具对于正当找回丢失的密码非常有用，但也可能将它们用于不法目的。希望不言而明，这些强大的工具应该被负责任使用。它们被法医科学家和渗透测试员采用，如果你在其中一台机器上发现了类似工具的证据，你绝对应该引起警报。\n\
    \n让我们看看这些工具在密码丢失时是如何发挥作用的，以及黑客将如何攻击你的密码。\n\n## 历史\n\n另一个流行的、历史悠久的用于破解密码的安全工具被称为\
    \ `John the Ripper`，它的起源可以追溯到许多年前。`Hashcat`  于 2009 年出现，并着开始使用多线程 CPU 密码破解。当时，尽管其他工具开发者已经开始考虑使用\
    \ CPU 的所有可用核心，但没有一个工具能够完全且在不打补丁的情况下做到。当开发者设计 `Hashcat` 时，利用现代 CPU 的能力并显著加速密码恢复过程是完全合逻辑的。\n\
    \n以防引起混淆，`Hashcat` 在早期版本中曾经历过几个不同的名称，例如 `atomcrack` 和 `Dr. Hash`。从 0.30 版本开始，你所熟悉的（我确定你将开始喜欢它的）名称\
    \ `Hashcat` 被应用于该软件。\n\n## 理解密码\n\n查看密码系统如何工作可能会有所帮助。在详细介绍 `Hashcat` 之前，我将使用 Linux\
    \ 系统作为例子。\n\n### 密钥空间\n\n理解密钥空间（Keyspace）的概念可能很有帮助。它大致地关联到破解工具需要付出的努力。\n\n密钥空间简单来说生成密钥时可能使用的可用密钥集合。美国国家标准技术研究院\
    \ (NIST) 将密钥空间描述为“密钥（如密码）可能拥有的值的总数”。它继续道，“密码中密钥空间的一个组成部分是构成密钥的‘字符集’。”\n\n换句话说，在密码中你可以使用键盘上的可用字符（或当前语言区域的字符集），它们代表了密码的密钥空间。\n\
    \n即使是单个字符，如果该字符是从零到九的数字，也有十个字符的空间。\n\n通过增加密码长度和字符集的大小可以增加密码的安全性。例如，一个具有 16 个字符且使用大小为\
    \ 10 个字符字符集的密码，据报道拥有 10,000,000,000,000,000 个密钥空间，这比单个字符的十空间要难攻击得多。\n\n这个网站网站可能会鼓励增加密码安全性：[`https://howsecureismypassword.net`](https://howsecureismypassword.net)。\n\
    \n这个简单但复杂的网站使用基础术语，并讨论可能的组合而不是密钥空间。如果你在输入密码后点击框下方的 `SHOW DETAILS` 链接，你会看到密码有多安全。例如，当我输入一个单字符密码后，出现了以下输出：\n\
    \n```\nLength 1 characters\nCharacter Combinations 10\nCalculations Per Second\
    \ 4 billion\nPossible Combinations 10\n```\n\n"
