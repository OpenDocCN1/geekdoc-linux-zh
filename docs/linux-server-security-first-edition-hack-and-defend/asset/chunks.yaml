    \ can see, Rootkit Hunter is paying attention to the key directories that contain\
    \ executable files (`/usr/sbin` in this example). These are exactly the types\
    \ of binary files (among many others) that become infected by a rootkit.\n\nThink\
    \ for a moment of the Greeks and the Trojan horse allegory. In addition to those\
    \ rootkits that immediately infect binaries, a piece of code can remain dormant\
    \ for any period of time until executed by a legitimate user or on a schedule.\
    \ Following that, a system compromise takes place.\n\n## Configuration\n\nTo configure\
    \ Rootkit Hunter, you can edit its long config file, which can be found at `/etc/rkhunter.conf`.\n\
    \nTo receive overnight reports on the integrity of your machine, you just need\
    \ to edit two config parameters, one defining the e-mail address of the recipient\
    \ and the latter of which is adjustable if the standard `mail` command won't work\
    \ on your system by default.\n\nOnce inside the config file, look for these salient\
    \ lines, uncomment them, and adjust them to your needs:\n\n```\n#MAIL-ON-WARNING=me@mydomain\
    \   root@mydomain\n#MAIL_CMD=mail -s \"[rkhunter] Warnings found for ${HOST_NAME}\"\
    \n```\n\nThe first line, once uncommented, specifies where to send the reports\
    \ (multiple addresses can be separated by a space). The second line deals with\
    \ the `mail` command and the subject line for the e-mail reports sent to those\
    \ addresses.\n\nSimply re-run the software with `rkhunter—check` to test if these\
    \ changes work correctly and check your e-mail inbox.\n\nTo inspect the cron job\
    \ that helps schedule when these reports will be generated, you can look in the\
    \ file `/etc/cron.daily/rkhunter`. By default, `cron.daily` will generally run\
    \ between 0100 hours and 0500 hours each morning on many distributions.\n\nIf\
    \ you want to change how the e-mails look, then you can search for the following\
    \ lines in the `cron.daily` file:\n\n```\nif [ -s \"$OUTFILE\" -a -n \"$REPORT_EMAIL\"\
    \ ]; then\n          (\n            echo \"Subject: [rkhunter] $(hostname -f)—Daily\
    \ report\"\n            echo \"To: $REPORT_EMAIL\"\n```\n\nAs ever, it might be\
    \ prudent to create a copy of this file before altering it.\n\nBack to the results\
    \ that I generated from running Rootkit Hunter. In [Figure 2.3](#c02.xhtml_c02-fig-0003)\
    \ you can see some of the rootkits that Rootkit Hunter searched for.\n\n![List\
    \ of some of the rootkits that Rootkit Hunter searches for.](images/c02f003.jpg)\n\
    \n[**Figure 2.3**](#c02.xhtml_c02-fig-anc-0003) A partial list of some of the\
    \ rootkits that Rootkit Hunter searches for\n\nAs you can see in [Figures 2.3](#c02.xhtml_c02-fig-0003)\
    \ and [2.4](#c02.xhtml_c02-fig-0004), there are a number of facets that Rootkit\
    \ Hunter looks for; the checks are very comprehensive.\n\n![Example of a Rootkit\
    \ Hunter search.](images/c02f004.jpg)\n\n[**Figure 2.4**](#c02.xhtml_c02-fig-anc-0004)\
    \ Another example of a comprehensive Rootkit Hunter search\n\n## False Positives\n\
    \nIf you receive any false positives, then you can whitelist them within the config\
    \ file `/etc/rkhunter.conf`.\n\nIf the volume of false alarms is a problem, then\
    \ you can do this by uncommenting a config line that matches an entire directory\
    \ within that main config file like this:\n\n```\nALLOWHIDDENDIR=/dev/.initramfs\n\
    ```\n\nIf Rootkit Hunter incorrectly suspects that one of your binaries has been\
    \ replaced by a script, then you can remove the warning with this option:\n\n\
    ```\nSCRIPTWHITELIST=\"/usr/sbin/lsof\"\n```\n\nFor individual files you can also\
    \ use this config setting:\n\n```\nALLOWDEVFILE=\"/dev/.udev/rules.d/99-root.rules\"\
    \n```\n\nKeep in mind that any hidden files or directories (those with names beginning\
    \ with a dot) are almost always suspicious to filesystem scanners. In [Figure\
    \ 2.5](#c02.xhtml_c02-fig-0005) you can see another part of the Rootkit Hunter\
    \ scan results that refers to checking for any malicious hidden files.\n\n![Illustration\
    \ depicting a part of the Rootkit Hunter scan involving the /dev partition and\
    \ hidden files and directories.](images/c02f005.jpg)\n\n[**Figure 2.5**](#c02.xhtml_c02-fig-anc-0005)\
    \ Part of the Rootkit Hunter scan involves the /dev partition and hidden files\
    \ and directories.\n\nIt's clear that the comprehensive checks made by Rootkit\
    \ Hunter are well considered. Along with the filesystem and the process table,\
    \ it also checks for networking anomalies, as you can see in [Figure 2.6](#c02.xhtml_c02-fig-0006).\n\
    \n![Illustration of a Rootkit Hunter making a number of network checks.](images/c02f006.jpg)\n\
    \n[**Figure 2.6**](#c02.xhtml_c02-fig-anc-0006) The trusty Rootkit Hunter also\
    \ makes a number of network checks.\n\n## Well Designed\n\nThe Rootkit Hunter\
    \ developers describe it as a “host-based, passive, post-incident, path-based\
    \ tool.” If you're wondering, the “passive” reference means that you need to schedule\
    \ the software or run it manually. The “path-based” description means it just\
    \ deals with files and doesn't operate heuristically like a virus checker might.\n\
    \nThere is a section at the bottom of the documentation included with `rkhunter`\
    \ that I enjoyed reading. It's a well-written primer for anyone who is new to\
    \ online security or any experienced users who just need a refresher.\n\nIt first\
    \ notes that before an attack is attempted, there is always some form of reconnoitering,\
    \ so you should pay close attention to your log files. I remember having a script\
    \ that watched out for traceroutes and ICMP traffic on one of my servers.\n\n\
    Again, repeating my earlier point, the manual goes on to say that this tool isn't\
    \ a substitute for increasing the security of your machine. Don't treat it as\
    \ one, but instead as a tool that helps to identify issues.\n\nInterestingly,\
    \ the Rootkit Hunter documentation also points you to one of their competitors,\
    \ the excellent chkrootkit tool, which is an older incarnation. The manual suggests\
    \ that only using one tool within a class of tools is sometimes not enough to\
    \ gain all the information you need. Therefore, for the sake of completeness,\
    \ you should benefit from the overlap that running both chkrootkit and rkhunter\
    \ offers. That's a good point that should apply across all security facets.\n\n\
    Finally, the manual discusses what to do if you discover a compromise and you\
    \ don't have the required skills to deal with a successful exploit. Along with\
    \ going to [`www.cert.org`](http://www.cert.org), you may want to go to [`www.linuxsecurity.com.br/info/IDS/intruder_detection_checklist.html`](http://www.linuxsecurity.com.br/info/IDS/intruder_detection_checklist.html),\
    \ which offers a list of steps for how to react to an online attack.\n\nYou are\
    \ told by those with experience of such attacks that you should consider which\
    \ authorities you can report the exploit to, and submit a report as soon as possible—instead\
    \ of waiting weeks or months—in case something can be done to prevent other compromises.\
    \ As ever, common sense applies.\n\n## Summary\n\nYou're now armed with the ability\
    \ to digitally fingerprint the files on your filesystem. As a result, you can\
    \ quickly compare former MD5sums to see if your files have been altered, and also\
    \ run Rootkit Hunter, either every night or periodically. The nice thing about\
    \ rootkit checkers is that they also offer peace of mind by having a scheduled\
    \ scan point out a config mistake that you've made. You can then hopefully remedy\
    \ the mistake before it causes you further security issues.\n\nFrom what I have\
    \ covered, there are two rules that you should keep in mind:\n\n*   Always keep\
    \ your recorded MD5sums (or any other hashes) somewhere safe (encrypted and password\
    \ protected) and far away from the server."
