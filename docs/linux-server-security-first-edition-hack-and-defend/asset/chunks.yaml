    \ where many users are uploading files frequently.\n\nThe documentation includes\
    \ details of how performance and accuracy have been considered in the default\
    \ options. If you're interested in this feature, then I would encourage you to\
    \ check out the bundled README file for more information.\n\n## Summary\n\nIn\
    \ addition to looking at LMD, I touched upon the inotify mechanism that it uses\
    \ to check for filesystem changes in real time. The clever and efficient inotify\
    \ allows real-time checks for malware without significant system load being introduced.\n\
    \nWith Android smartphones currently accounting for over 80 percent of the global\
    \ market, there is little doubt that the malware written to exploit vulnerabilities\
    \ in those devices will appear to a greater extent on Linux user devices as well\
    \ as servers in the future.\n\nBy enabling real-time filesystem checks alongside\
    \ sophisticated tools such as LMD, you should reduce your risk of a malware infection\
    \ significantly. LMD was initially designed for servers offering shared hosting\
    \ because the author felt the user-account attack vector was being missed by other\
    \ products, which usually focused on kernel and rootkit infections.\n\nHaving\
    \ tried installing LMD in a test environment first, however, and having become\
    \ familiar with how it operates, I believe that LMD is definitely worth considering\
    \ for use on your production machines.\n\n# Chapter 9\n\nPassword Cracking with\
    \ Hashcat\n\nTwo sophisticated security tools caught my eye recently. They were\
    \ highlighted in the news because they've been released as open source, apparently\
    \ causing a frenzy on GitHub as developers looked for the tools' source code.\
    \ The tools in question are called Hashcat and oclHashcat. Hashcat ([`https://hashcat.net/hashcat`](https://hashcat.net/hashcat))\
    \ boldly refers to itself as the “world's fastest CPU-based password recovery\
    \ tool.” Its close relative, oclHashcat, uses your Graphics Processing Unit (GPU)\
    \ to number crunch its way through the process of recovering passwords, as opposed\
    \ to Hashcat's CPU-based approach. As a result, the GPU-based oclHashcat is even\
    \ faster than Hashcat.\n\nWhile tools like this can be highly useful for legitimately\
    \ rescuing a lost password, it is also possible to use them for nefarious purposes.\
    \ It hopefully goes without saying that these powerful tools should be used responsibly.\
    \ They are employed by forensic scientists and penetration testers, but if you\
    \ find evidence of similar tools on one of your machines, then you should certainly\
    \ raise the alarm.\n\nLet's look at how these tools work for saving the day if\
    \ a password becomes lost, as well as how a hacker will approach attacking your\
    \ passwords.\n\n## History\n\nAnother popular, venerable security tool that is\
    \ used for ripping passwords is called John the Ripper, and its origins go back\
    \ many years. Hashcat arrived on the scene in 2009, and took it upon itself to\
    \ use multithreaded CPU password cracking. At that time, although other tool developers\
    \ had begun looking at using all the available cores of a CPU, none were able\
    \ to do so fully and without patching. When the developers were designing Hashcat,\
    \ it made absolute sense to take advantage of the capabilities of modern CPUs\
    \ and speed up the password recovery process significantly.\n\nIn case it causes\
    \ confusion, Hashcat originally went through a few different names in its early\
    \ releases, such as atomcrack and Dr. Hash. As of version 0.30, the name that\
    \ you know (and I'm sure you will begin to love), Hashcat, was applied to the\
    \ software.\n\n## Understanding Passwords\n\nIt might be helpful to look at how\
    \ password systems work. I'll use Linux systems as my case in point before continuing\
    \ onto Hashcat in detail.\n\n### Keyspace\n\nIt's important to understand the\
    \ concept of what keyspace is in cryptography. It loosely relates to how much\
    \ effort a password-cracking tool will have to expend.\n\nThe keyspace is simply\
    \ the set of available keys that might be used when generating a particular key.\
    \ The National Institute of Standards and Technology (NIST) describes keyspace\
    \ as the “total number of possible values that a key, such as a password, can\
    \ have.”\n\nIt continues, “A component of keyspace used in common passwords is\
    \ the ‘Character Set’ used to make up the key.”\n\nIn other words, in a password\
    \ you can only use the available characters on your keyboard (or in your current\
    \ locale's character set), and they represent a password's keyspace.\n\nEven a\
    \ single character can have a keyspace of ten characters if that character is\
    \ a single number, ranging from zero to nine.\n\nYou can increase the security\
    \ of your passwords by increasing both the length of the passwords and the size\
    \ of your character sets. So, for example, a password with 16 characters that\
    \ uses a character set sized at 10 characters would reportedly have a keyspace\
    \ of 10,000,000,000,000,000, making it much harder to attack than the 10-character\
    \ keyspace from a single character.\n\nThis helpful website might encourage you\
    \ to increase your password security: [`https://howsecureismypassword.net`](https://howsecureismypassword.net).\n\
    \nThis simple yet sophisticated site uses basic terms and discusses possible combinations\
    \ as opposed to keyspace. If you click the SHOW DETAILS link under the input box,\
    \ after you've entered a password, you will see how secure the password is. For\
    \ example, the following output appeared after I entered a one-character-long\
    \ password:\n\n```\nLength 1 characters\nCharacter Combinations 10\nCalculations\
    \ Per Second 4 billion\nPossible Combinations 10\n```"
