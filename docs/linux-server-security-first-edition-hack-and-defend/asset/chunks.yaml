    ## Hardening


    If you''re worried about your system being overloaded with ICMP traffic, then
    there are a couple of relatively simple things you can check. This is thanks to
    the power of Unix-type operating systems. First (and your build may already have
    this set as default), you can ignore ICMP broadcasts by adding the following line
    to the bottom of the file `/etc/sysctl.conf`:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    This `sysctl.conf` example will persist a reboot, whereas the following command
    will set it live immediately:


    ```

    # echo "1" > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    The following command will also set it live immediately if you have followed the
    `sysctl.conf` example (it reloads all the config settings found inside the file
    `sysctl.conf`):


    ```

    # sysctl -p

    ```


    The `icmp_echo_ignore_broadcasts` setting stops ICMP broadcasts from bringing
    down your network with unwanted broadcast traffic.


    In reality, this is a deprecated attack (you saw that modern kernels use rate-limiting
    as standard), and the kernel setting is really only useful for ping attacks to
    the broadcast address that force every device in the local network''s broadcast
    domain to respond. If every device responds at the same time and then responds
    to others'' responses, then a denial of service is caused by too much traffic
    on the network. As with all kernel settings, though, it''s useful to know the
    background to help you understand how networking works.


    Another attack (harking from 1996) was called the Ping of Death, and crafted massive
    ICMP packets with the hope of crashing the remote machine. It affected many of
    the popular networking stacks (at release 18 operating systems were found to be
    vulnerable). Simply knowing an IP address and firing ICMP packets greater than
    65,536 bytes at that IP address caused the machine to which it was bound to crash.
    There''s more information from the excellent [`Insecure.org`](http://Insecure.org)
    website, at [`http://insecure.org/sploits/ping-o-death.html`](http://insecure.org/sploits/ping-o-death.html).


    Another commonly discussed attack from yesteryear involved a man-in-the-middle
    (MITM), and was called a smurf attack. Smurf attacks are a good illustration of
    how spoofing can work, and belong to a type of attack that has recently become
    more frequent, called an amplification attack.


    The middleman is put to good use so that the original source of the attack can''t
    be identified, and the attack''s aim is to saturate bandwidth, ultimately causing
    a denial of service. Worryingly, the barrage of ICMP traffic actually appears
    to come from the victims themselves. The middleman (also sometimes called the
    amplifier) receives these spoofed packets and sends a normal echo-response reply
    to the victim, who didn''t even ask for a response. They also have little way
    of stopping the packets from arriving. Back in the earlier days of the Internet,
    your ISP could only disable all ICMP traffic to stop the massive flood of data.
    Because the packets were spoofed, even the logs were of little help in tracking
    down where they originated.


    One solution to this problem is to rate-limit the packets yourself. This leaves
    ICMP traffic free to arrive, and your network running relatively normally, although
    possibly a little slower.


    This can be achieved on proprietary router hardware, such as Cisco or Juniper,
    but also on individual hosts by using iptables with a set of rules similar to
    these:


    ```

    # iptables -I INPUT -p icmp -m limit --limit 30/minute --limit-burst 60 -j ACCEPT

    # iptables -I INPUT -p icmp -m limit --limit 6/minute --limit-burst 10 -j LOG

    # iptables -I INPUT -p icmp -j DROP

    ```


    From the config shown on the first line, the `--limit-burst` option allows up
    to 60 packets to arrive initially before the rate limit of one packet every other
    second is enabled (the 30/minute value). The second line then says that you will
    log (though much more strictly) how much traffic is accepted before being logged
    to syslog: six entries per minute after a burst of ten packets. Finally, you''ll
    discard those packets in order to mitigate any effect.'
