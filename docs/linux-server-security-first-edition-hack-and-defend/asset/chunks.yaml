    ```

    charsets/  hashcat-cli32.exe  hashcat-cliXOP.bin  tables/  hashcat-cli64.app  hashcat-cliXOP.exe

    docs/  hashcat-cli64.bin  rules/  hashcat-cli32.bin  examples/  hashcat-cli64.exe  salts/

    ```


    You can see from my directory listing that there are a number of different types
    of executables.


    For your purposes, anything ending in `.bin` will suffice. If for some reason
    your `.bin` files aren''t immediately executable, then as usual you can just type
    `chmod +x <executable>` to remedy this. I''ll be using the 64-bit command line
    interface version called `hashcat-cli64.bin`, which matches my machine''s capabilities.


    Apparently, the different Hashcat executables shown in that directory suit a variety
    of features that might be made available by your machine''s processors. The other
    relevant `.bin` file that you''re interested in, with XOP added to its name, stands
    for eXtended OPerations instructions. If you want to get more serious about using
    Hashcat later on, you can read up on your processor flags and choose which executable
    can make best use of your particular system. For example, according to the forums,
    AMD processor chips suit the XOP version.


    Let''s now look at running your Hashcat executable. The syntax for the `hashcat`
    command is as follows:


    ```

    # hashcat [options] hashfile [mask|wordfiles|directories]

    ```


    Having downloaded (or generated) your wordlist and saved it under the filename
    `wordlist.txt`, you can proceed. Consider this example command after you enter
    the `examples` subdirectory with the command `cd examples/`:


    ```

    # ./hashcat-cli64.bin -m0 -a0 A0.M0.hash A0.M0.word

    ```


    The `-m` option means that you are specifying an MD5 hash and the `-a 0` option
    means you want Hashcat to perform a dictionary attack (also known as a straight
    attack). For reference, if you had specified `-m1800`, you would be referring
    to your preferred modern Unix hashing algorithm, SHA512.


    As you can probably guess, the `A0.M0.hash` file in the `examples` directory is
    your list of hashes. These are stripped down without either the `<username>:`
    section prepending the salt, or the appended password aging information including
    the colons after it. This is how you should collect hashes.


    The `A0.M0.word` file is your potential passwords dictionary as a wordlist.


    Incidentally, you could simply add `-o <filename>` if you wanted to output your
    findings straight to file rather than the screen, or add `--remove` if you wanted
    to remove a line from your file full of hashes when you had discovered its password.


    The results from running the `hashcat` command are as follows (in a heavily abbreviated
    form):


    ```

    651e96f9b94e1a3a117eade5e226bd1e:y[N"%e?U{<k[‘x<TlG U6Z

    465133fae5a994afb03c7158260b2e8d:kCQArZz)It

    All hashes have been recovered

    Input.Mode: Dict (A0.M0.word)

    Index…..: 1/1 (segment), 102 (words), 2769 (bytes)

    Recovered.: 102/102 hashes, 1/1 salts

    Speed/sec.: - plains, 102 words

    Progress..: 102/102 (100.00%)

    Running…: 00:00:00:01

    Estimated.: --:--:--:--

    ```


    The first two lines contain the hashes up to the colon, followed by the discovered
    passwords after the colon. The rest of the output shows you had success across
    your whole file.


    Once you''ve mastered the examples, try this on your own `/etc/shadow` hashes.
    If you''re lucky, then after running your adjusted commands, you should be presented
    with one or more hashes followed by their corresponding passwords in plain text.
    If you''re not getting enough hits, then experiment until you are satisfied with
    the results. It may take some trial and error to get things working as expected;
    I would recommend getting comfortable with the comprehensive examples first. If
    you struggle, then take some comfort from the fact that not all passwords can
    be broken in an instant.


    That said, once you understand the theory and tried using its basic functionality,
    Hashcat is very simple to operate. From a Linux sysadmin''s perspective, this
    should concern you and you should therefore pay attention to the hashing algorithm
    that your servers use.


    There are a number of options that I will leave you to explore. For example, the
    option for running rules alongside the sample command is simply `-r rules/specific_rule.rule`.


    I promised that you''d look at some of the corresponding hash values and attack
    modes. The number of hashes is simply too great to list, but the Hashcat website
    provides them, along with helpful details, at [`http://hashcat.net/wiki/doku.php?id=example_hashes`](http://hashcat.net/wiki/doku.php?id=example_hashes).


    Some of the attack modes that you can use, with 0 being known as “straight” (in
    other words, matching against a dictionary or wordlist), are shown in Table 9.


    | Number | Attack Mode |

    | :--- | :--- |

    | 0 | Straight (dictionary or wordlist) |

    | 1 | Combination |

    | 3 | Brute force (mask attack) |

    | 6 | Hybrid |


    ## Mask Attacks


    The main premise with a mask attack is to reduce the size of the keyspace and
    therefore speed up the run time. One clever example that the documentation offers
    is that Hashcat''s innovative technique, you can reduce the recovery time of the
    password `Julia984` from approximately four years to forty minutes.


    You run a mask attack by appending a mask to the end of your standard command,
    as follows:


    ```

    # hashcat -m 1800 -a 0 -o discovered_passwords.txt --remove hashes.txt wordlist.txt
    -1 ?dabcdef

    ```


    The appended `-1 ?dabcdef` in this case asks Hashcat to run through the characters
    `0123456789abcdef`.


    According to the documentation, this mask, `-1 ?l?d?u`, offers a full 7-bit ASCII
    character set, also known as mixalpha-numeric-all-space. There are a number of
    built-in character set options with Hashcat, such as `?l` (which stands for all
    lowercase characters from a to z), and `?u` (which stands for all uppercase characters
    from A to Z).


    You can find more details on mask attacks at [`https://hashcat.net/wiki/doku.php?id=mask_attack`](https://hashcat.net/wiki/doku.php?id=mask_attack).


    ## oclHashcat


    Using oclHashcat and Hashcat requires very similar levels of knowledge, as they
    operate in almost the same way. Although they have some differences — for example,
    the way that oclHashcat loads up its dictionaries when compared to Hashcat — you
    can expect a shallow learning curve if you move over to using oclHashcat.

