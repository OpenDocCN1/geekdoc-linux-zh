    关于如何保护你的代码安全的完整教程可以留到以后再说。不过，我将使用一种流行的编程语言为你进行快速的复习。在此之前，我会先提醒你一些 SQLi（SQL 注入）运行的简单原理。


    正如我所说的，仅仅篡改网站远不是拦截的 SQL 能够造成的唯一破坏。例如，考虑这个 SQL 语句：


    ```sql

    sql-server> DROP TABLE special-offers;

    ```


    通过获取表名，你可以完全从数据库中删除一个表。除了破坏性行为外，我还没有提到从数据库中提取用户名和密码。如果带有犯罪意图，成功的 SQL 攻击无疑是一个值得追求的奖赏。一些大型品牌已经沦陷于编写不当的代码和
    SQLi 的受害者。据报道，Yahoo、Adobe、LinkedIn 和 Sony Music 可能都在这一长长长的受害者名单上。当然，由于我既不是攻击者之一，也不是负责恢复受此类攻击影响的服务的工作人员，我只能推测这些攻击涉及
    SQLi 的程度。你可以在 `http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/` 找到“SQL
    注入耻辱柱”。尽管该列表可能完全准确，但我相信你会同意这是一篇非常引人入胜的文章。


    刚才，我提到了一种编程语言。我将使用据认为是世界上最流行的服务器端脚本语言 `PHP` 作为示例，快速演示 SQLi 是如何工作的。`PHP` 不仅直接用于数百万个网站，强大的
    `PHP` 还用于世界上最流行的内容管理系统（CMS）WordPress（`https://wordpress.com`）以及许多其他动态网站应用程序，如
    Joomla!（`https://www.joomla.org`）。简而言之，`PHP` 无处可见，如果发现了漏洞，它将成为攻击者的容易目标。


    让我们来看另一个例子，但这次是在 `PHP` 中实现的：


    ```php

    $input = $variable[3];

    $dbquery = "SELECT id, item, price FROM specialoffers ORDER BY id LIMIT 15 OFFSET
    $input;";

    ```


    看第一行，你可以看到你没有过滤名为 `$input` 的变量。这意味着当该变量在第二行的 SQL 语句中使用时，它可能包含攻击者想要使用的任何代码。通过注入经过精心构造的代码，可以造成各种混乱。


    另一个例子是更新系统管理员（sysop）用户的密码。例如，`PHP` 代码中的一个普通 SQL 语句可能像这样：


    ```php

    $dbquery = "UPDATE credentials SET passwd=''$password'' WHERE userid=''$id'';";

    ```


    通过向此语句添加 SQL，例如 `or userid like ''%sysop%''`，你的 SQL 就会变得不那么严格了，你要求数据库快速搜索其他类似于
    sysop 的特权用户名（例如 sysops），然后也更新它们的密码。


    令人担心的是，还可以执行包含在 SQL 内部的 shell（壳）命令。某些数据库服务器允许通过这种方法访问操作系统命令。


    ## 在 PHP 中缓解 SQLi


    正如我所说的，这个领域太大，无法详细介绍，但如果不简要查看如何过滤 SQL 输入以帮助缓解 SQLi 攻击将是我的失。有很多 `PHP` 函数可以帮助你完成这项任务。截至本文时，`PHP`
    正在从当前的版本 `5.6.16` 向 `7.0.0` 版本重大迁移（尽管版本号可能会继续增加）。


    需要注意的是，在旧版本（直到 `5.3.0`）中，在你的主 `PHP` 配置文件（`php.ini`）中，可以使用 `magic_quotes_gpc` 通过
    `PHP` 过滤（或转义）所有的输入数据。这显然被废弃了，因为它被过度依赖，而且并不总是能以使应用程序安全的方式转义字符。本质上，魔法引号（magic quotes）并不是为了安全目的设计的，但被当作那样使用了。


    为了保护第一个 SQL 示例中使用的变量，你可能希望通过 `stripslashes` 函数处理你的用户输入。示例看起来如下：


    ```php

    $input = $variable[3];

    ```


    使用 `stripslashes` 后，它可能像这样：


    ```php

    $input = stripslashes($variable[3]);

    ```


    正如你所猜的的，这意味着你正在移除斜杠以帮助防止不良的输入。还有 `trim` 用于删除变量中的空格，可以用同样的方式使用，以及 `strip_tags`
    用于删除 HTML 和其他标记标签。这些都可以有用，并且为了方便组合在一起，例如：


    ```php

    $input = stripslashes((trim($input));

    ```


    此外，在 `PHP` 版本 `5.5.0` 之前，你可以使用 `mysql_real_escape_string` 函数来如下清理单个字符串：


    ```php

    $input = mysql_real_escape_string($input);

    ```


    然而，从版本 `7.0.0` 及以后，你几乎总是想要使用一个名为 `MySQLi` 的改进驱动（代表 MySQL improved）来对抗 SQLi。得益于这种增强，你可以采用更高级的方法从正在执行的代码中删除不必要的且潜在危险的字符。使用
    `mysqli` 的示例与之前的示例没有太大区别：


    ```php

    $input= mysqli_real_escape_string($input);

    ```


    使用 `MySQLi`，你使用不同的方法连接数据库，如下：


    ```php

    $mysqli = new mysqli("localhost", "userid", "passwd", "DB_name");

    ```


    另一种值得注意的方法从早期的 `PHP` 版本就可以用了，并使用了 PHP 数据对象（PDO）。这里有一个好的讨论：`http://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php`。


    关于哪种方法最好仍有争议，但 PDO 看起来非常流行。PDO 的示例如下：


    ```php

    $input = $pdo->prepare(''SELECT * FROM special_offers_table WHERE offer = :specialoffer'');

    $input->execute(array(''name'' => $specialoffer));

    ```


    这种新的、首选的方法使用新库过滤你的参数。注意之前变量值所在位置问号。


    ```php

    $input = $mysqli->prepare("INSERT INTO table_name (column_name) VALUES (?)");

    $input->bind_param("s", $actual_user_input);

    $input->execute();

    $input->close();

    ```


