    如果你在留的话，可能会发现数字 `8` 被用作了 `--icmp-type` 的值。在 表 6.1 中，你可以看到 ICMP 使用的代码。你可以在其请求意见（RFC）页面找到更多信息，地址为
    [`https://tools.ietf.org/html/rfc792`](https://tools.ietf.org/html/rfc792) 。根据该页面，ICMP
    自 1981 年左右就存在了，那时的互联网是一个完全不同的东西。


    | Type | Code |

    | :--- | :--- |

    | 0 | Echo Reply |

    | 3 | Destination Unreachable * |

    | 4 | Source Quench * |

    | 5 | Redirect |

    | 8 | Echo Request |

    | B | Time Exceeded * |

    | C | Parameter Problem * |

    | D | Time stamp Request |

    | E | Time stamp Reply |

    | F | Info Request |

    | G | Info Reply |

    | H | Address Mask Request |

    | I | Address Mask Reply |


    **表 6.1** **由于 ICMP 流量的滥用，现代 Linux 实现中为了安全考虑限制了 ICMP 流量，因此在 表 6.1 中标记了星号 *。**


    在下面的代码段中，名为 `noid` 的服务器收到了来自 `recce` 主机的探测。`Recce` 正在进行侦察以查看服务器是否在线。


