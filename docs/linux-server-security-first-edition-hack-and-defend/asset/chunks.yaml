- fmt: "\nIn addition, the necessary password-cracking computations use an entirely\
    \ different component of your system, as I have already mentioned. Simply put,\
    \ `oclHashcat` works with video cards as opposed to CPUs. There are two important\
    \ software versions to distinguish between, and each suits two popular GPUs:\n\
    \n- `cudaHashcat`, which is for use on Nvidia video cards\n- `oclHashcat`, which\
    \ works with AMD video cards\n\nGPUs are much faster than CPUs (when set up correctly)\
    \ because they are solely designed to crunch numbers quickly, usually to process\
    \ graphics. While obviously designed for speed themselves, in terms of performance,\
    \ CPUs can get distracted with their additional, inclusive feature sets, causing\
    \ a reduction in throughput. As a result, GPUs are a good choice for computing\
    \ large amounts of data because they can be optimized much better. It's also possible\
    \ to scale GPU output almost seamlessly by connecting them together in a chain,\
    \ making it easier to harness their combined power. To give you an idea of how\
    \ fast GPUs can be, if you were using rainbow tables and divided the keyspace\
    \ (of the 95 characters available on a US keyboard), you might hit 10 trillion\
    \ plain-text tests per second!\n\nIn terms of learning Hashcat and `oclHashcat`,\
    \ I would recommend getting Hashcat working first and then reading up on how to\
    \ get your video card's GPU drivers working. There's more information at `http://hashcat.net/oclhashcat/`.\n\
    \nIf it causes confusion, `oclHashcat-plus` is no longer in use and is considered\
    \ deprecated. As a result, there's no benefit in the “plus” version.\n\n## Hashcat-Utils\n\
    \nOne additional component of the Hashcat suite that is also worth mentioning\
