    ## Echo Mode


    Among the sophisticated features included with Nping is Echo mode. This mode is
    designed to show in detail what happens to packets as they traverse a network.
    By enabling Echo mode on two hosts, you can set up a server-and-client relationship
    to monitor exactly what takes place on the wire.


    Let''s have a look at this feature. The server component captures packets and
    then forwards details back to the client via a TCP communication “channel.” It''s
    the client''s job to generate the aforementioned packets in the first place.


    This technique is a great way to spot any packet-mangling should it occur. And,
    for example, if Network Address Translation (NAT) becomes involved, then a number
    of packet details are also changed. By using this technique if a device on the
    wire changes any other TCP options or if traffic shaping takes place, for example,
    then these otherwise difficult-to-diagnose details become apparent. You might
    also be able to determine where in transit packets become mysteriously blocked,
    which will assist in diagnosing issues.


    Let''s try a little experiment using Echo mode. Incidentally, you can add `-vvv`
    for verbosity if you want more output and a higher level of detail from Nping.
    To get started, you need to be the root user to spawn the server side of the connection.
    You will use the password “please_connect” and add verbosity to the output received
    on your `eth0` network interface with the following command:


    ```

    # nping -e eth0 -vvv --echo-server "please_connect"

    ```


    The results of this command are as follows:


    ```

    Starting Nping 0.5.51 ( http://nmap.org/nping ) at 2016-11-16 11:16 GMT

    Packet capture will be performed using network interface eth0.

    Waiting for connections…

    Server bound to 0.0.0.0:9929

    ```


    As you can see, your server is now listening for a client to connect on TCP port
    9929.


    Next, you''ll generate some traffic by launching the client. Note, again, that
    here you''re only using localhost, your local machine, for both the server and
    client elements of this test. Although it''s not the best way of following traffic
    through a firewall or a NAT gateway, it should offer you enough information to
    understand how the process works.


    You will also need to be the superuser to run this command. You will add the appropriate
    password and make sure that you connect to your localhost. Clearly you replace
    this option with the IP address of the remote machine you want to connect to,
    as follows:


    ```

    #  nping -vvv --echo-client "please_connect" localhost --tcp -p1001-1003 --flags
    ack

    ```


    As you can see, you''re going to connect to three TCP ports (1001, 1002, and 1003)
    and then fire TCP ACK packets at them. If you have difficulties with the connection
    and you receive a “Handshake failed” error message, then you have probably entered
    your passwords incorrectly at one end.


    Let''s look at what happens on either side of the connection, starting with the
    client. As the root user, by adding the `-vvv` option, you''re going to see inside
    the packets as they traverse the network; otherwise, the output would be much
    quieter. [Listing 5.2](#c05.xhtml_c05_lit_2) shows an abbreviated sample of what
    you see.


    In [Listing 5.2](#c05.xhtml_c05_lit_2), you have abbreviated the output to only
    see one packet “SENT” outbound from the client to TCP port 1000\. Next, the client
    receives a reply from the server (inbound, which is marked as “RCVD”) from TCP
    port 1000 to TCP port 20869, one of the higher ephemeral ports.


    The additional noise, thanks to the `-vvv` option, includes the checksum line
    (starting `csum`) and the three lines of content below. The `∧C` signifies that
    I''ve stopped the output just after it begins, for brevity. And, in the same way
    that the standard `ping` command behaves, you receive (`rtt`) Round Trip Times
    and transceiving statistics below, followed by an overall completion time.


    On the server (also your local machine, which in reality is of little consequence),
    Nping is listening on TCP port 9929\. [Listing 5.3](#c05.xhtml_c05_lit_3) shows
    the output that the server side produces.


    In [Listing 5.3](#c05.xhtml_c05_lit_3), your server has reported “Good packet
    specification received from client #0” and that a handshake was completed without
    any issue, followed by an Epoch time stamp of the disconnection from the client.
    There''s not much more to glean from the server side, so you only need to be logged
    into the client if the server is always available for testing.


    The Nmap Project helpfully provides some test machines that you can use. The password
    is “public” for the hostname “[`echo.nmap.org`](http://echo.nmap.org).” For Nmap
    scans (not Nping), you can try this host: [`http://scanme.nmap.org`](http://scanme.nmap.org).'
