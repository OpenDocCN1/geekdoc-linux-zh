    - **侵入性** —— 如果运行一个脚本导致武装守卫突然出现，那么它对于默认脚本集来说可能侵入性太大了。

    - **隐私性** —— 与外部脚本集类似，默认脚本需要尊重你的隐私，不要暴露你的踪迹。


    ## 安全漏洞


    既然你已经查看了 NSE 大大量的脚本类别，并且也理解了运行默认脚本集的意义，现在让我们利用你新学到的知识以及 Nmap 标准配带的大量捆绑脚本，来尝试进行一些渗透测试吧。


    首先，让我们按照如下方式在你的本地机器上运行漏洞检查：


    ```

    # nmap --script vuln localhost

    ```


    在列表 7.3 中，你可以看到该命令的输出，注意你仅使用 `vuln` 选项调用了漏洞脚本。


    在列表 7.3 中的结果在我看到 RPC 服务显示“可能感兴趣的文件夹（Potentially interesting folder）”时，立即引起了我的兴趣。当然，可能只有我的本地机器可以查询它所指的
    `/icons/` 文件夹，但也有可能这需要被调查（而且相对紧急）。除非你了解某些限制 RPC 访问的配置规则，否则你可能完全屏蔽 TCP 端口 111 或关闭该服务来修复此类发现。


    与其寻找配置文件，我修复此问题的第一个测试是使用 netcat 从另一台机器查询 TCP 端口 111，看它是否有响应。（更现代的 `ncat` 同样由 Nmap
    项目编写，是我首选的版本；如果不可用，则使用 `telnet` 命令。）


    顺便提一下，如果 NSE 识别出已知漏洞，你可能会收到一个针对 Windows 服务器的补丁 ID 或其他相关 URL，以便你进一步研究。这可以节省通过在线搜索研究漏洞的时间。很有可能，如果
    NSE 标记了阳性结果，说明已经满足了几项不同的测试以得出该结论，与其他某些工具不同，你不应该在不经检查的情况下直接忽略它的发现。


    ## 身份验证检查


    考虑一下如果有人针对我的本地机器运行 Nmap 的 NSE 来寻找身份验证问题，结果会是什么。显然，我的本地机器权限（当与自己通信而非远程主机通信时）较松，但这种测试方法仍然具有教育意义。以下命令执行的就是此类操作，并寻找
    `auth` 脚本的命中：


    ```

    # nmap --script auth localhost

    ```


    该命令的结果揭示了 NSE 运行的一些测试，如你在列表 7.4 中所示。


    查看列表 7.4 中端口号下方显示的结果，你可以看到 Nmap 显然想要更多信息（来自不同的输入），并在期间生成了三个 ERROR 消息。如果用户名是从执行此类请求（例如针对
    Windows 域）中获取的，你可能会在此类输出末尾类似于“主机脚本结果（Host script results）”的部分下看到 NSE 发现的一些用户账户。


    ## 发现


    考虑以下命令，为你提供关于主机更多信息：


    ```

    # nmap --script discovery localhost

    ```


    在列表 7.5 中，你通过发现脚本获得了检索 HTTP 头部、SMTP 标志以及 RPC 问题等能力。尽管存在一个 SMTP 错误“服务器是一个开放中继（16/16
    次测试）”，但它很可能是误报，但绝对值得检查以确保万无一失。


    有了这些功能，这种模式非常有用，并代表了 NSE 功能的核心部分。毕竟，在不知道服务存在的情况下，你无法对其进行利用。从 NSE 生成的结果中可以安全地说，在发现机器和服务方面，信息即就是力量。然而，精密的
    NSE 不会用过多的细节轰炸你，仅仅提供足够实用的信息即可。


    按类别运行脚本的负面影响是，如果你包含了某个类别中的所有脚本，可能会略微降低性能。然而，这意味着你并不依赖于默认脚本集使用的评分系统，也没有执行模板类型下的所有可用脚本。不过，如果你只是寻找特定类型的信息，可以更加专注。


    ## 更新脚本


    正如你所想象的，使用 Lua 语言为 NSE 编写的自定义脚本经常得到改进和增强。如果你想更新 NSE 脚本，可以有选择地通过下载并将它们复制到目录来完成，在
    Unix 类系统中，路径类似于：：


    ```

    /usr/share/nmap/scripts

    ```


    如果你在 `scripts` 目录中添加或删除脚本，或者更改了脚本的类别，那么之后你需要运行以下命令（以 root 用户身份）：


    ```

    # nmap --script-updatedb

    ```


    输出结果可能如下：


    ```

    Starting Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT

    NSE: Updating rule database.

    NSE: Script Database updated successfully.

    Nmap done: 0 IP addresses (0 hosts up) scanned in 0.14 seconds

    ```


    要从 Nmap 网站下载脚本，你可以点击 [`https://nmap.org/nsedoc/`](https://nmap.org/nsedoc/) 中类别面板中的
    Scripts 链接。


    ## 脚本类型


    值得提到，在 NSE 的底层架构中支持四种脚本类型：


    - **预规则脚本 (Prerule scripts)**：正如你猜的，它们在扫描开始之前运行。例如，你可能会对地址列表执行反向 DNS 查询。

    - **主机脚本 (Host scripts)**：在扫描过程中（即端口扫描、版本检测和操作系统检测之后），这些脚本在目标上运行。

    - **服务脚本 (Service scripts)**：如果 NSE 识别出服务，它可以针对该服务执行这些脚本。例如，有超过 15 个 HTTP 脚本。

    - **后规则脚本 (Postrule scripts)**：在 NSE 完成任务后运行，它们倾向于关注结果的输出。


    全面的 Nmap 文档（位于 [`https://nmap.org`](https://nmap.org））解释了任何脚本都可以作为预规则或后规则脚本运行。在这种情况下，我们建议使用预规则以保持一致性。


    ## 正则表达式


    NSE 熟悉的精明命令行也可以处理正则表达式（regex）。例如，我提到了 15 个 HTTP 脚本；为了在一次运行中触发所有脚本，你可以针对目标 Web
    服务器运行命令：


    ```

    # nmap --script "http-*"

    ```


    你还可以如下做出布尔决策（正如你对正则所期的）：


    ```

    # nmap --script "default or safe"

    ```


    希望这个命令易于理解。文档还展示了一个更复杂的示例：


    ```

    # nmap --script "(default or safe or intrusive) and not http-*"

    ```


    在这里你可以启用默认、安全和侵入性脚本类别，但不是处理 Web 服务器的类别。


    ## 图形用户界面


    顺便提一下，你也可以以通常的方式将输出（如果很长，通常会在控制台上快速滚动）保存到文件，如本例所示，采用 Unix 风格：


    ```

    # nmap -sC -p0-1024 -T4 localhost > /home/chrisbinnie/output.txt

    ```


    然而，NSE 保存输出的方法如下，输出为纯文本：


    ```

    # nmap -T5 localhost -o outputfile.txt

    ```


    你还可以如下将信息输出为 XML：


