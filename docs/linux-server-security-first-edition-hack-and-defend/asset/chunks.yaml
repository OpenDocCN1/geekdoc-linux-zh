    Now for the part that should cause you great concern. The powerful password tool
    on the “How Secure Is My Password” website reports that the cracking time for
    my single-digit password is roughly 0.000000025 seconds for a standard desktop
    computer. Imagine how fast it might be if you combined the processing capacity
    of many video cards.


    Trying to be a little more clever, by contrast, you can see what happens when
    I enter a 16-character password in the example that follows. Incidentally, I''m
    using my computer''s default character set, so here the 10-character-long character
    set example that you just looked at won''t apply.


    The password I entered was a combination of upper and lower alpha characters,
    numeric, and special characters, as follows:


    ```

    Rx951&RTdIp-"2YT

    ```


    In this case the website responded with a more comforting time to crack, of 412
    trillion years. As you can see in the following output, some new vocabulary is
    included (for me, at least). Apparently, the word “nonillion” is a number followed
    by 30 zeros in the United States and 54 zeros in the United Kingdom.


    ```

    Length 16 characters

    Character Combinations 96

    Calculations Per Second 4 billion

    Possible Combinations 52 nonillion

    ```


    From this example, you can clearly surmise that a standard eight-character-long
    “complicated” password is preferable to using a simple single-character password.


    ## Hashes


    Now that I''ve covered how a complex password can dramatically increase the effort
    involved in an attack, I''ll continue my discussion of password cracking. First,
    though, one final explanation.


    As its name suggests, `Hashcat` deals with password hashes. Creating a hash in
    cryptography involves the conversion of a string of characters, such as a password,
    into a set number of characters, resulting in something a little like a fingerprint.
    There''s no way of undoing or reversing a hash (well, more accurately, it''s just
    really, really difficult to do in reality).


    Here are two MD5 examples. First, the hash for the word “hello” is


    ```

    5d41402abc4b2a76b9719d911017c592

    ```


    Second, the MD5 hash for a capitalized “Hello” is


    ```

    8b1a9953c4611296a827abf8c47804d7

    ```


    As you can see, that single uppercase character change makes quite a difference.


    Now, if you use another word, “Hello There,” you get


    ```

    32b170d923b654360f351267bf440045

    ```


    The MD5 hash of two words is the same length as the previous examples that contained
    one word. By knowing that your hashes are always the same length, you can tell
    if a string of seemingly unrelated characters conforms to a standard.


    Also, think for a second about why you don''t encrypt passwords on a Linux server
    and then decrypt the system''s password file when a user logs in. The answer is
    simply because the process of encrypting data can be reversed, whereas a one-way
    function is better than encrypting a password. Some people are surprised to read
    that the `/etc/shadow` file doesn''t actually remember a user''s password at all,
    just a salted-hash version of it.


    Why does an entry in your `/etc/shadow` password file on Linux look like this?
    It looks like encryption of some sort at a glance.


    ```

    chrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::

    ```


    The user `chrisbinnie` has a much longer entry because the Shadow Suite is using
    a salt to further bolster the passwords. After a user has entered a password on
    a Linux system, by default, a salt will be used.


    In Linux''s `crypt` package for example, this is a two-character string that is
    chosen from characters in a character set. They could be any of these characters
    from my English character set (a-z, A-Z, 0-9./). Having chosen a salt, the original
    algorithm used to hash the user password is then “perturbed” in any of 4,096 different
    ways. The salt is then saved to the encoded password.


    Let''s think a little more about Linux passwords for a moment. Modern Linux systems
    enhance your password security with Shadow passwords. Previously, passwords were
    stored in the file `/etc/passwd`, which every user on the system could read. Only
    root can read the `/etc/shadow` file, however, and this allows other policies
    to be enforced properly, such as password aging.


    The user login process works like this. When someone logs into a machine, the
    salt from the relevant entry for their user in the `/etc/shadow` file is read.
    Next, the password that the user entered is encoded with the salt that has just
    been read. The results of this process are checked against the password saved
    in `/etc/shadow`. If they are the same, then the user is allowed access. Clever
    and simple.


    One common way of attacking a list of passwords is by knowing, in advance, the
    hashes for a lot of common passwords and combining them with all of the 4,096
    available salt values. This is known as a dictionary attack.


    It has been said that today, the bare minimum specification of a secure password
    system should include an up-to-date hashing algorithm, as well as the resulting
    hash being salted. Popular modern hashing algorithms include `SHA256`, `SHA512`,
    `whpool`, `tiger`, `ripemd`, and `SHA3`. Each has subtly different attributes.


    These algorithms shouldn''t be confused with encryption algorithms such as `3DES`,
    `Triple DES`, `Crypt`, `Blowfish`, and `Rijndael`.


    ## Using Hashcat


    The well-designed, accommodating `Hashcat` is bundled with a large number of example
    hashes and wordlists to experiment with. Let''s look at how you can work with
    them.


    ### Hashcat Capabilities


    The general approach of password-cracking tools tends to be one of importing a
    password file that is full of encrypted data and then generating an output file
    once the input file has been processed. Let''s look at some of the options that
    are available with the `Hashcat` tool. I will touch upon some of the other tools
    that are available from within its software suite in a moment.


    `Hashcat` supports many different types of hashing algorithms, such as `MD5`,
    `SHA1`, and `NTLM`. In fact, if I''m counting correctly, the number exceeds an
    incredible 90 varieties. `Hashcat` claims it can break the MD5 versions of popular
    applications such as `WordPress` and `Cisco-ASA`, and also `Drupal`. In addition
    to its impressive algorithm support, the many attack modes that are available
    include brute forcing passwords, dictionary attacks, rule-based attacks, and fingerprint
    attacks.


    ### Installation


    At the time of writing, the current version of `Hashcat` is `v2.00`. To install
    `Hashcat` (assuming that you can''t find it in your distribution''s repositories),
    you can head to the website and download the latest binaries. The direct link
    for `v2.00` is here: [`https://hashcat.net/files/hashcat-2.00.7z`](https://hashcat.net/files/hashcat-2.00.7z).


    The version 2.00 link is visible at the top of the web page at [`https://hashcat.net/hashcat/`](https://hashcat.net/hashcat/).
    You should check this page to ensure that you are downloading the latest available
    version.


    Once downloaded, it''s just a case of extracting the `.7z` file, and making sure
    you have the correct permissions to write files to the directory to which you
    have extracted the files. If you get stuck extracting on any Debian derivatives,
    then you can install the `7za` package with the following command:


    ```

    # apt-get install p7zip-full

    ```


    On Red Hat derivatives, you may need to add a repository. Having done so, the
    following command will hopefully work for you:


    ```

    # yum install p7zip p7zip-plugins

    ```


    Next, to extract the compressed files and preserve the directory names with `x`,
    run the `7za` file as follows:


    ```

    # 7za x hashcat-2.00.7z

    ```


    Note the lack of a minus sign before the `x`, which is the usual convention. That''s
    not a typo.

