    GUI 也有助于分析，将是我的失职。


    Nmap 支持并鼓励你尝试有数百种选项，以及白帽和黑帽场景。学习攻击者可能如何入侵你的系统是非常重要的，但以谨慎和尊重的态度使用这些强大的工具也同样重要。


    毕竟，搞掉他人的服务器并不好玩。阻止他人搞掉你的服务器才是更大的挑战，结果是这要有成就感得多（而且完全合法）。


    # 第 8 章：恶意软件检测


    `malware`（恶意软件）一词涵盖了大量设计用于损坏计算机的不受欢迎的软件。恶意软件的部分列表例如可能包括病毒、间谍软件、特洛伊木马和蠕虫。此类软件的迅速扩散足以让从新手到资深管理员的各个水平的用户感到担忧。恶意软件的影响范围从本质上无害的恶作剧到盗取个人信息（如银行详情）或拒绝服务。


    尽管新闻中的恐慌情绪此起彼伏，但每位优秀的系统管理员都知道，不存在完全安全的系统。尽管针对 Windows 机器的病毒和恶意软件威胁巨大，但所有 Unix
    类型机器的用户都应该记住，这些威胁也存在于他们的系统中。


    有一个名为 Linux Malware Detect (LMD) 的流行且复杂的软件包，来自 R-fx Networks ([`https://www.rfxn.com`](https://www.rfxn.com))，有助于缓解
    Linux 系统上的恶意软件威胁。让我们看看如何使用 LMD 软件包有效地保护 Linux 机器免受恶意软件侵害，它只专注于恶意软件，与其他更稀释的解决方案不同。


    ## 入门


    在我们开始查看 LMD 本身之前，让我们考虑一下为了成功保持恶意软件正常运行而所需的一些可能不那么明显的方面。


    ### 定义更新频率


    频繁执行恶意软件特征更新至关重要；事实上，如果你错过了最新更新，你的系统可能会变得非常脆弱。如果无法检测到当前威胁，检测软件本身的架构就意义不大。幸运的是，LMD
    经常拉取更新，并从社区数据、用户提交以及活跃恶意软件威胁的防火墙数据中生成特征。


    LMD 网站提供最新威胁的实时 RSS 馈，还提供了一个商业版本，这是保持更新具有时效性和相关的另一个动力。该充满了 LMD 当前恶意软件发现的馈源，可以在
    [`https://www.rfxn.com/feed/`](https://www.rfxn.com/feed/) 处找到。


    LMD 表示，签名大约每天更新一次，如果报告了大量活动，更新频率会更高。


