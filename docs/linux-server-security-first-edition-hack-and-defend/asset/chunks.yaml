    | nmap | 如果你想在 Debian/Ubuntu 上使用 Nmap 的 `ncat`，则需要这个包。 |


    `表 3.1` Debian 和 Ubuntu 软件包名称


    ```

    # yum install netcat

    ```


    对于 Nmap 项目的 `ncat`，你可能可以尝试这个包：


    ```

    # yum install nmap-ncat

    ```


    我怀疑通过安装一个包然后确保你正在阅读该包的正确主页（以防同一台机器上安装了两个版本的 `netcat`），这种方法会被证明是成功的。


    为了避免混淆，我将重点关注 `ncat`（以及 `ncat` 命令），而不是 `netcat`（因此是 `nc` 命令）。从现在起，我将交替使用 `ncat`
    和 `netcat` —— 或者，如果需要进一步明确，当然也可以直接使用 `ncat`。


    ### 入门教程


    让我们看看 21 世纪的 `netcat` 等效物（我当然指的是 `ncat`）能为你做什么，从一些基础知识开始。Netcat 大胆地声称它包含了强大的功能，可以通过命令行从网络操作数据（数据的读取和写入）。它非常可靠，并且可以与
    TCP 和 UDP 工作（它在 IPv6 上也能运行良好）。它可以在 SSL（安全套接层）连接上完成令人印象深刻的事情，并与代理服务器良好工作 —— 无论是
    SOCKS4 还是 HTTP “CONNECT”变体。


    从制作 Nmap 安全工具时所涉及的优秀编程实践判断，`ncat` 的编程质量也会非常高。Nmap `netcat` 文档特别指出，它不仅使用了完全重写的代码（没有借用原始版本），而且还采用了
    Nmap 经过彻底实战检验的网络库。


    既然提到了 HTTP 代理，我将从使用 `netcat` 作为网络浏览器开始。如果你输入此命令，并加上你想要访问的任意网站，你就能连接到 TCP 端口 80：


    ```

    # ncat -C www.chrisbinnie.tld 80

    ```


    一旦你输入了此命令并按了回车键，你就需要输入以下文本，然后按几次回车：


    ```

    GET / HTTP/1.0

    ```


    请注意，如果你动作不够快，命令将超时，你将必须重试。如果你以前曾从命令行查询过 HTML，那么你可能不会对执行后屏幕上滚动的过量信息感到惊讶。如果你感兴趣，`-C`
    选项会在其中混入一个回车符和换行符（CRLF），以兼容某些网络协议。


    你还可以将 `netcat` 用作监听的守护进程。进入服务器有许多方法，而一种保持访问开启状态以备返回访问的方法，是让 `netcat` 监听在一个系统管理员可能不知道的冷门端口上。


    你稍后会考虑这一点，但现在先关注 HTTP。`ncat` 文档提供了一个极好的示例，说明了如何将你简单的 `netcat` 二进制文件变成一个基础 Web
    服务器。首先，你将创建一个简单的文件。然而，你不会使用 `.html` 扩展名，因为你的文件不是纯 HTML；相反，它将是 HTTP 对话的一半。你把文件命名为
    `index.http`，内容如 `Listing 3.1](#c03.xhtml_c03-1)` 所示。


    如 `Listing 3.1](#c03.xhtml_c03-1)` 所示，它大部分是 HTML，但顶行确认了访问客户端的请求。接下来，让 `netcat`
    监听连接，并通过运行此命令在被要求时展示你的文件：


    ```

    # ncat -l 127.0.0.1 80 < index.http

    ```


    顺便说一下，如果你刚刚在考虑使用 `netcat` 服务其他类型的内容，那么你是正确的。如果你曾经手动通过命令行类型输入过 SMTP 对话，那么你可能对发现
    `-C` 选项同样有效而感到意外。


    ### 传输文件


    思考一下使用两端的 `netcat` 将文件从一个主机移动到另一个主机。这不需要复杂的 SFTP 守护进程或复杂的应用程序。你将你的两台机器命名为 `Lionel`
    和 `Luis`，并将看着 `Lionel` 将文件传给 `Luis`。在 `Luis` 上，运行此命令：


    ```

    # ncat -l > bootstrap.pp

    ```


    你可以看到 `-l` 切换只是要求 `netcat` “监听”传入流量。你正在监听 TCP 端口 1234 流量，并将入站数据输出到名为 `bootstrap.pp`
    的文件；此文件是一个清单，你不想在主机之间复制粘贴它，因为它很长很复杂。现在 `Luis` 正在等待某些数据，这是你在 `Lionel` 上输入的内容以发送它：


    ```

    # ncat --send-only Luis 1234 < bootstrap.orig

    ```


    在 `Lionel` 上运行此命令后，`Luis` 上的 `netcat` 实例会自动退出。在 `Luis` 退出之前，它会将 `Lionel` 上的文件
    `bootstrap.orig` 内容输出到 `Luis` 上的文件 `bootstrap.pp`。


