    如果你遇到了相同的问题，那么与其在新的配置文件中添加以下两行，不如再次回到主配置文件（`/etc/rsyslog.conf`）中 RULES 部分下提到 `kern.*`
    的行，以完全避免使用单独的配置文件，并添加这两行：


    ```

    :msg, contains, "Pings"                 /var/log/iptables-pings.log

    & ∼

    ```


    第一行捕包含“Pings”字符串的条目，然后要求 syslog 将其写入 `/var/log/iptables-pings.log` 文件。第二行稍显特殊，它告诉
    syslog 软件忽略由上一行捕获的任何条目，这样你就不会因为将相同的内容写入另一个文件而导致日志重复。当然，如果你也想在其他地方记录日志，可以省去第二行。


    现在你已经能够将内容写入日志文件并过滤特定的 iptables 事件（并根据你的喜好添加你自己的标签），让我们来看其他示例。


    ## 多部分规则


    如果你想允许 ping 访问你的服务器，同时也允许你的服务器发出 ping，那么每个操作都涉及略有不同的 iptables 配置。


    以下网页解释了如何允许 ping 进入你服务器上的特定 IP 地址（假设你的服务器上绑定了多个 IP），以及不同的出站 ping 配置：[`www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html`](http://www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html)。


    注意，入站 ping 规则中用于目的的 `-d` 表示特定的 IP 地址。


    ## 为了取证分析记录所有内容


    如果你担心正在遭受攻击，并想记录所有你机器的入站连接，你可以（临时地）启用此命令：


    ```

    # iptables -I INPUT -m state --state NEW -j LOG --log-prefix "Logged Traffic:
    "

    ```


    请注意，你的 `/var/log/messages` 文件很快就会变得巨大，因此你必须尽快通过刷新规则来禁用日志。（你可以查看本节稍后的示例来了解如何操作。）你可能预期来自
    `iptables` 命令的输出看起来如下所示：


    ```

    Nov  11 01:11:01 ChrisLinuxHost kernel: New Connection: IN=eth0 OUT= MAC=ff:ff:ff:ff:ff:ff:00:41:23:4f:4d:1f:08:00
    SRC=10.10.10.10 DST=10.10.10.255 LEN=78 TOS=0x00 PREC=0x00 TTL=128 ID=28621 PROTO=UDP
    SPT=137 DPT=137 LEN=58

    ```


    此片段摘自我现在已经相当大的 `/var/log/messages` 文件。流量似乎是由 Netbios 数据包生成的。如果你想跟踪出站流量，只需将 `INPUT`
    替换为 `OUTPUT`。


    此外，如果你想记录流量但也对进入服务器日志的流量进行速率限制呢？这是一个示例：


    ```

    # iptables -I INPUT -p icmp -m limit --limit 5/min -j LOG --log-prefix "Blocked
    ICMP Traffic: " --log-level 7

    ```


    将 `-p icmp` 改为 `-p tcp` 或 `-p udp` 非常简单，可以分别捕获 TCP 和 UDP 包。这个示例意味着你每分钟只记录五个此类流量的包。这非常有用，因为通常在重复开始之前，前几次探测是有参考价值的。顺便提一下，如果你发现日志填充得太快，可以像这样刷新所有的
    iptables 规则：


    ```

    # iptables -F

    # iptables -X

    # iptables -t nat -F

    # iptables -t nat -X

    # iptables -t mangle -F

    # iptables -t mangle -X

    # iptables -t raw -F

    # iptables -t raw -X

    # iptables -t security -F

    # iptables -t security -X

    # iptables -P INPUT ACCEPT

    # iptables -P FORWARD ACCEPT

    # iptables -P OUTPUT ACCEPT

    ```


    我的倾向是将这一系列命令放入一个脚本中（或者是一个很长的 Bash 别名，用分号分隔命令），作为 root 用户，我可以在需要时随时输入 `flush`，来快速、安全地移除所有正在使用的防火墙规则。


    ## 加固


    如果你担心系统被 ICMP 流量过载，那么有几个相对简单的内容可以检查。这得益于 Unix 类型操作系统的强大。首先（你的发行版本可能已经将其设为默认值），你可以通过在
    `/etc/sysctl.conf` 文件末尾添加以下行来忽略 ICMP 广播：


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    这个 `sysctl.conf` 示例在重启后依然有效，而下面的命令将使其立即生效：


    ```

    # echo "1" > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    如果你遵循了 `sysctl.conf` 示例，那么下面的命令也会立即生效（它会重新加载 `sysctl.conf` 文件中找到的所有配置设置）：


    ```

    # sysctl -p

    ```


