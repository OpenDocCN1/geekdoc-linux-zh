    例如，如果你想捕获 ping 包，那么当我从另一台机器 ping 我那台高度敏感的服务器时，以下命令可以生效：


    ```

    # /usr/sbin/tcpdump -i eth0 icmp and icmp[icmptype]=icmp-echo

    ```


    接下来的示例展示了 `tcpdump` 的 ICMP 数据包嗅探能力，同时也捕获了 traceroute（路由追踪）：


    ```

    # /usr/sbin/tcpdump ip proto ∖∖icmp

    ```


    如你在下面的代码所示，ping 同时依赖于响应和请求；然而，由于我那台敏感服务器的防火墙阻止了某些 ICMP 流量，当 traceroute 出现时，会记录一条
