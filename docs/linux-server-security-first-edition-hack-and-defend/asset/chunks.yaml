    \ a connection and open up your SSH port. You can even manually use tools such\
    \ as Nmap, netcat, or Telnet to manually probe the required ports in sequence.\
    \ The documentation also mentions that you can use the hping, sendip, and packit\
    \ packages if they are available. Let's look at an example of the `knock` command\
    \ that comes with the knockd package.\n\nIf you used the `openSSH` section shown\
    \ in [Listing 1.1](#c01.xhtml_rc01_lit_1), then you would set up your simple `knock`\
    \ command with the following syntax:\n\n```\n# knock [options] <host> <port[:proto]>\
    \ <port[:proto]> <port[:proto]>\n```\n\nI have configured TCP ports in [Listing\
    \ 1.1](#c01.xhtml_rc01_lit_1), so you can run the `knock` command as follows:\n\
    \n```\n# knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp 22045:tcp 23501:tcp 24691:tcp\n\
    ```\n\nThe target host has the IP address 11.11.11.11 in this example. If you\
    \ want, you can also put a combination of UDP and TCP ports in [Listing 1.1](#c01.xhtml_rc01_lit_1);\
    \ your client-side knocking sequence might look like this:\n\n```\n# knock 11.11.11.11\
    \ 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp 24691:tcp\n```\n\nOne nice shortcut\
    \ is that if you only want to use UDP ports, then you can simply add `-u` to the\
    \ start of the command rather than specifying them explicitly. You can run a command\
    \ for UDP ports like this:\n\n```\n# knock -u 11 22 33 44 55\n```\n\nLet's return\
    \ to your server's config file to see how TCP and UDP can be interchanged within\
    \ your valid knocking sequence. In order to mix protocols, you would simply alter\
    \ the `sequence` line under the `openSSH` section as follows:\n\n```\n[openSSH]\n\
    \        sequence = 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp 24691:tcp\n```\n\
    \n## Making Your Server Invisible\n\nOnce you are confident that your installation\
    \ is working as you'd like, you can lock your server down to hide it from attackers.\
    \ An attacker may be aware of the IP address bound to your server or may somehow\
    \ be able to view traffic sent and received from that IP address (for example,\
    \ they might work for the ISP that the server was hosted with). Otherwise, it\
    \ should be invisible to Internet users. I would experiment with your firewall\
    \ if this is not the case. To achieve Nmap's closed port status, however, the\
    \ following approach works for me.\n\n### Testing Your iptables\n\nAs mentioned\
    \ earlier, I will use the trusted iptables. Ideally you should have physical access\
    \ to the server before locking it down, in case you make a mistake. Failing that,\
    \ you should have out-of-band access of some type, such as access via a virtual\
    \ machine's console, a secondary network interface that you can log in through,\
    \ or a dial-up modem attached to the machine. Be warned that unless you've tested\
    \ your configuration on a development box first, there's a very high chance of\
    \ making a mistake and causing problems. Even though I've used port knocking before,\
    \ I still get caught out and lock myself out of a server occasionally.\n\nWith\
    \ that warning in mind, let's begin by looking at your iptables commands. Be careful\
    \ when integrating these rules with any rules you already have. It might be easier\
    \ to overwrite your existing rules after backing them up. First, you need to make\
    \ sure that your server can speak to itself over the localhost interface, as follows:\n\
    \n```\n# iptables -A INPUT -s 127.0.0.0/8 -j ACCEPT\n```\n\nYou must now ensure\
    \ that any existing connections are acknowledged and responded to, as follows:\n\
    \n```\n# iptables -A INPUT -m conntrack—ctstate ESTABLISHED,RELATED -j ACCEPT\n\
    ```\n\nYou're using `conntrack` to keep track of associated connections. Your\
    \ connections can continue to operate once they have been initiated successfully.\
    \ Now, assuming that you're only going to open up TCP port 22 for your SSH server\
    \ and no other services, you can continue. As a reminder of how to do this, referring\
    \ to [Listing 1.1](#c01.xhtml_rc01_lit_1), add the following command to open up\
    \ TCP port 22:\n\n```\ncommand = /sbin/iptables -I INPUT -s %IP% -p tcp—dport\
    \ 22 -j ACCEPT\n```\n\nPay attention to this line. If you left an “append” by\
    \ using `-A INPUT` in the command, you would be locked out by iptables. It must\
    \ be an `-I` for “insert” so that the rule is entered as the first rule and takes\
    \ precedence over the others.\n\nYou might be wondering what the `%IP%` variable\
    \ is. Port knocking is clever enough to substitute the connecting IP address in\
    \ the `-s` field, in place of the `%IP%` value.\n\nNow here's where you have to\
    \ be careful. There's no going back if this doesn't work the way you'd expect,\
    \ so make sure that you have tested the rules on a virtual machine or that you\
    \ have out-of-band access to the server just in case. You block all inbound traffic\
    \ to your server as follows:\n\n```\n# iptables -A INPUT -j DROP\n```\n\nIf you\
    \ run the following command to check your iptables rules, then you won't see any\
    \ mention of TCP port 22 and your SSH port:\n\n```\n# iptables -nvL\n```\n\nYou\
    \ will, however, see such a rule (very briefly if you've set up a low value for\
    \ the `cmd_timeout` setting) in iptables once you have successfully logged in.\n\
    \nIf you are having problems at this stage, then keep reading for some ways to\
    \ troubleshoot your configuration and increase your levels of logging. Otherwise,\
    \ you should now have a server whose ports all report as nonexistent, thus making\
    \ the server invisible, as shown in [Figure 1.1](#c01.xhtml_c01-fig-0001).\n\n\
    ![Snapshot of Nmap showing how to trouble shoot a configuration.](images/c01f001.jpg)\n\
    \n[**Figure 1.1**](#c01.xhtml_c01-fig-anc-0001) Nmap seems to think there's no\
    \ machine on that IP address.\n\n### Saving iptables Rules\n\nTo ensure that your\
    \ iptables rules survive a reboot, you should install a package called `iptables-persistent`\
    \ on Debian derivatives, as follows:\n\n```\n# apt-get install iptables-persistent\n\
    ```\n\nYou can then save your rules with a command like this one:\n\n```\n# /etc/init.d/iptables-persistent\
    \ save\n```\n\nOr, you can revert to the saved config by running this command:\n\
    \n```\n# /etc/init.d/iptables-persistent reload\n```\n\nOn Red Hat derivatives\
    \ (on presystemd machines), you can use this command:\n\n```\n# /sbin/service\
    \ iptables save\n```\n\nAnd to restore rules, you run this command:\n\n```\n#\
    \ /sbin/service iptables reload\n```\n\nFor the above to work on systemd Red Hat\
    \ derivatives, you could try installing this package first:\n\n```\n# yum install\
    \ iptables-services\n```\n\n## Further Considerations\n\nThere are a few other\
    \ aspects to port knocking that might be helpful to you. Let's have a look at\
    \ them now.\n\n### Smartphone Client\n\nOn my Android smartphone, my preferred\
    \ SSH app is called JuiceSSH ([`https://juicessh.com`](https://juicessh.com)).\
    \ It has a third-party plug-in that allows you to configure a knocking sequence\
    \ as part of your SSH handshake. This means that there's no excuse for you not\
    \ to employ port knocking, even when you're on the road and without a laptop.\n\
    \n### Troubleshooting\n\nIf you run the command `tail -f logfile.log` on your\
    \ port knocking log file, you will see various stages being written to the log.\
    \ This will include whether a valid port is knocked, and importantly, if it was\
    \ knocked in the correct sequence or not.\n\nA debugging option also gives you\
    \ the opportunity to increase the levels of logging produced by knockd. If you\
    \ carefully open the file `/etc/init.d/knockd` and look for the `OPTIONS` line,\
    \ then you can add an uppercase D character (Shift+d) to any existing values on\
    \ this line as follows:\n\n```\nOPTIONS=\"-d -D\"\n```\n\nThe additional logging\
    \ should be switched off once you have diagnosed and solved your issue to prevent\
    \ disk space from filling up unnecessarily. The `-d` simply means run knockd as\
    \ a daemon in case you're wondering. This should remain as it is for normal operation."
