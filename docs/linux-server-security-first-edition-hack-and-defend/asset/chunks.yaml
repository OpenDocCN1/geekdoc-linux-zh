    The user login process works like this. When someone logs into a machine, the
    salt from the relevant entry for their user in the `/etc/shadow` file is read.
    Next, the password that the user entered is encoded with the salt that has just
    been read. The results of this process are checked against the password saved
    in `/etc/shadow`. If they are the same, then the user is allowed access. Clever
    and simple.


    One common way of attacking a list of passwords is by knowing, in advance, the
    hashes for a lot of common passwords and combining them with all of the 4,096
    available salt values. This is known as a dictionary attack.


    It has been said that today, the bare minimum specification of a secure password
    system should include an up-to-date hashing algorithm, as well as the resulting
    hash being salted. Popular modern hashing algorithms include SHA256, SHA512, whirlpool,
    tiger, ripemd, and SHA3. Each has subtly different attributes.


    These algorithms shouldn''t be confused with encryption algorithms such as 3DES,
    Triple DES, Crypt, Blowfish, and Rijndael.


    ## Using Hashcat


    The well-designed, accommodating Hashcat is bundled with a large number of example
    hashes and wordlists to experiment with. Let''s look at how you can work with
    them.


    ### Hashcat Capabilities


    The general approach of password-cracking tools tends to be one of importing a
    password file that is full of encrypted data and then generating an output file
    once the input file has been processed. Let''s look at some of the options that
    are available with the Hashcat tool. I will touch upon some of the other tools
    that are available from within its software suite in a moment.


    Hashcat supports many different types of hashing algorithms, such as MD5, SHA1,
    and NTLM. In fact, if I''m counting correctly, the number exceeds an incredible
    90 varieties. Hashcat claims it can break the MD5 versions of popular applications
    such as WordPress and Cisco-ASA, and also Drupal7 passwords. In addition to its
    impressive algorithm support, the many different attack modes that are available
    include brute forcing passwords, dictionary attacks, rule-based attacks, and fingerprint
    attacks.


    ### Installation


    At the time of writing, the current version of Hashcat is v2.00\. To install Hashcat
    (assuming that you can''t find it in your distribution''s repositories), you can
    head to the website and download the latest binaries. The direct link for v2.00
    is here: [`https://hashcat.net/files/hashcat-2.00.7z`](https://hashcat.net/files/hashcat-2.00.7z).


    The version 2.00 link is visible at the top of the web page at [`https://hashcat.net/hashcat/`](https://hashcat.net/hashcat/).
    You should check this page to ensure that you are downloading the latest available
    version.


    Once downloaded, it''s just a case of extracting the `.7z` file, and making sure
    you have the correct permissions to write files to the directory to which you
    have extracted the files. If you get stuck extracting on any Debian derivatives,
    then you can install the `7za` package with the following command:


    ```

    # apt-get install p7zip-full

    ```


    On Red Hat derivatives, you may need to add a repository. Having done so, the
    following command will hopefully work for you:


    ```

    # yum install p7zip p7zip-plugins

    ```


    Next, to extract the compressed files and preserve the directory names with `x`,
    run the `7za` file as follows:


    ```

    # 7za x hashcat-2.00.7z

    ```


    Note the lack of a minus sign before the `x`, which is the usual convention. That''s
    not a typo.'
