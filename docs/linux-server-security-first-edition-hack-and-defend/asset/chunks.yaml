- fmt: '

    Just like the standard `ping` command, `N` defaults to using ICMP if executed
    as the root user when no other protocols are selected. The documentation boldly
    states that “[a]ny kind of ICMP message can be created.” For example, you might
    query a time stamp, generate fake “destination unreachable” messages, or cause
    problems for another system or network by redirecting packets.


    Try the following command logged in as both the root user and a standard user:


    ```bash

    # nping localhost

    ```


    You can clearly see the difference in detail. Here is the standard user, without
    much detail:


    ```

    SENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)

    RECV (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed

    ```


    In the next example, as the root user, you can see that you are given more information
    about what was in the ICMP packet. The `type=8` entry stands for “8 Echo” according
    to its RFC (`https://tools.ietf.org/html/rfc792`), which is what you''d expect.


    ```

    SENT (0.0152s) ICMP 127.0.0.1 > 127.0.0.1 Echo request (type=8/code=0) ttl=64
    id=31032 iplen=28

    RCVD (0.0154s) ICMP 127.0.0.1 > 127.0.0.1 Echo reply (type=0/code=0) ttl=64 id=18763
    iplen=28

    ```


    ## ARP


    You also have the `--arp` option, which allows you to experiment with the Address
    Resolution Protocol (ARP). In addition to deploying unwelcome ARP cache poisoning
    attacks, you can craft various types of ARP packets. The now obsolete RARP (Reverse
    ARP) lookups were used to translate a MAC address into an IP address. RARP has
    been succeeded by the `BOOTP` and `DHCP` protocols, but RARP still sometimes has
    its uses. There was also an evolved version of RARP called Dynamic RARP (DRARP),
    which is supported. It was mostly used by Sun Microsystems near the end of the
    last millennium, and is used very little these days. There''s also support for
    “InARP” requests; this is similar to RARP but applies mainly to frame relay and
    ATM networks.


    Finally, to complement these protocols, you can add `--traceroute` to the output
    to help determine which path traffic took by looking at the source address of
    “destination unreachable” packets sent in reply.


    ## Payload Options


    Now that you''re familiar with the main protocol options, let''s see if you can
    take your new-found knowledge and put it to good use. Another reminder that Nmap
    was designed for white hat activities and should be used as such, not for illegitimate
    gain. It is possible to cause mayhem with tools of this nature.


    If you wanted to add a payload to your probe packets, then there are three varieties,
    as shown in [Table 5.1](#c05.xhtml_c05-tbl-0001).


    | Option | Description |

    | :--- | :--- |

    | `--data` | Here you can append some hexadecimal data. The documentation offers
    examples such as `--data 0xdeadbeef` and `--data \xCA\xFE\x09`. |

    | `--data-string` | You would append a string such as `--data-string “Per Ardua
    ad Astra”`. |

    | `--data-length` | Using this option, you can fill a packet with random data
    from 0 to 65,400 bytes, such as `--data-length 999`. Be aware that anything over
    1,400 bytes may overwhelm some network MTUs. |


    **Table 5.1**](#c05.xhtml_c05-tbl-anc-0001) Payload Options and Their Descriptions


    ## Echo Mode


    Among the sophisticated features included with Nping is Echo mode. This mode is
    designed to show in detail what happens to packets as they traverse a network.
    By enabling Echo mode on two hosts, you can set up a server-and-client relationship
    to monitor exactly what takes place on the wire.


    Let''s have a look at this feature. The server component captures packets and
    then forwards details back to the client via a TCP communication “channel.” It''s
    the client''s job to generate the aforementioned packets in the first place.


    This technique is a great way to spot any packet-mangling should it occur. And,
    for example, if Network Address Translation (NAT) becomes involved, then a number
    of packet details are also changed. By using this technique if a device on the
    wire changes any other TCP options or if traffic shaping takes place, for example,
    then these otherwise difficult-to-diagnose details become apparent. You might
    also be able to determine where in transit packets become mysteriously blocked,
    which will assist in diagnosing issues.


    Let''s try a little experiment using Echo mode. Incidentally, you can add `-vvv`
    for verbosity if you want more output and a higher level of detail from Nping.
    To get started, you need to be the root user to spawn the server side of the connection.
    You will use the password “please_connect” and add verbosity to the output received
    on your `eth0` network interface with the following command:


    ```bash

    # nping -e eth0 -vvv --echo-server "please_connect"

    ```


    The results of this command are as follows:


    ```

    SENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)

    RECV (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed

    ```

