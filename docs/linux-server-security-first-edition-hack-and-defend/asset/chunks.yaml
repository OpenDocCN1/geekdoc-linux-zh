    lean on its storage, potentially using hundreds or thousands of gigabytes. During
    a brute force attack, rather than calculating a hash on every attempt, it is possible
    to look up a list of pre-calculated answers held in a long list. These are known
    as rainbow tables.


    There are ways of defeating this approach, namely by using large salts on one-way
    hashes. This is effective because each password is hashed with a unique salt,
    and therefore every possible salt''s calculated hash would need an entry in a
    rainbow table alongside its salt.


    ## Running Hashcat


    Now that you know about hashes, attack modes, and where to download a wordlist
    from (and once you''ve run through the large number of informative examples, this
    knowledge can be very useful), you can finally get to running Hashcat itself.


    The contents of my installation directory are as follows:'
