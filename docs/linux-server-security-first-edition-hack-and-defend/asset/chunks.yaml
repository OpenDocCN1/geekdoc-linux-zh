- fmt: '

    The widespread compatibility of `sqlmap` is enough to give most diligent sysadmins
    cause for concern. According to its website, `sqlmap` supports the following database
    servers: MySQL, Oracle, PostgreSQL, Microsoft SQL Server, Microsoft Access, IBM
    DB2, SQLite, Firebird, Sybase, SAP MaxDB, and HSQLDB.


    Let''s look at how you install `sqlmap`. It''s bundled with some security-based
    distributions such as Kali Linux, but if it''s not in your package manager''s
    repositories, then there are alternative ways to install it.


    You can use GitHub''s `sqlmap` repository by using the Git `clone` command:


    ```

    # git clone https://github.com/sqlmapproject/sqlmap.git sqlmap-dev

    ```


    There''s also a Zip file available from [`https://github.com/sqlmapproject/sqlmap/zipball/master`](https://github.com/sqlmapproject/sqlmap/zipball/master).


    You can also download a tarball from [`https://github.com/sqlmapproject/sqlmap/tarball/master`](https://github.com/sqlmapproject/sqlmap/tarball/master).


    Once you have followed the installation instructions, you should be able to get
    to the stage where the following command will work (after running the previous
    Git command, this is all you need to do to get started):


    ```

    # cd sqlmap-dev

    # python ./sqlmap.py -h

    ```


    This command will offer you a list of options.


    ## Launching an Attack


    Let''s now look at the core of `sqlmap`''s functionality, namely compromising
    a remote machine.


    Be warned, however, that a time-consuming aspect of testing your `sqlmap` skills
    will likely involve setting up your own test server to be vulnerable, or legitimately
    identifying websites that are vulnerable to attack. You might be surprised to
    read that, because of the way URLs are formed, Google can identify vulnerable
    sites very easily. It hopefully goes without saying that I do not advocate attacking
    any of the sites that you find using Google or through any other method, for that
    matter. For the purposes of spotting potentially exploitable URLs, however, you
    can enter a query such as `inurl:website.php?id=` or `inurl:product.php?id=`.
    The first search term returns a very worrying 1.7 million results.


    Websites and other online resources that incompetently expose their vulnerabilities
    via Google have earned a nickname, Googledorks. There''s a site that lists some
    of them; it''s worth a quick look and can be found at [`www.hackersforcharity.org/ghdb/`](http://www.hackersforcharity.org/ghdb/).
    The lists include a number of potentially secret login pages, sensitive directories,
    and files that mention usernames. Use this information responsibly.


    Incidentally, you can run `sqlmap` via Python, which means you will need an implementation
    of one type or another installed on your machine.


    In [Figure 10.1](#c10.xhtml_c07-fig-0010) you can see that the developers are
    keen to distance themselves from illegal activity. Such powerful tools are always
    subject to abuse.


    Let''s continue on. Looking at the following example, the syntax that is required
    to use the `sqlmap` command is quite simple:


    ```

    # python sqlmap.py -u http://www.a-vulnerable-website.com/product.php?id=1111

    ```


    ![Illustration depicting how a qlmap looks when it is launched.](images/c10f001.jpg)


    [**Figure 10.1**](#c10.xhtml_c07-fig-anc-0010) How sqlmap looks when you launch
    it, disclaimer included


    If you are either using slow connectivity or experiencing slow responses from
    the remote database server, then you can append `--time-sec 10` to that command
    to introduce a more realistic time-out setting. Somewhat counterintuitively, this
    can actually speed up the overall process.


    Now let''s methodically step through a few simple commands. You may choose to
    chain these all together once you become familiar with using `sqlmap`.


    My `sqlmap` example command includes the `-u` option, which means that a URL is
    declared. That command will simply check for vulnerabilities for the trailing
    parameter (`id=1111`) using a number of SQL injection tests. From there, `sqlmap`
    can normally detect the web server vendor and version, the remote operating system,
    and the version of the database server that is in use.


    What if you now want to learn the names of the databases in use by the website
    in question? You can do this by adding the `--dbs` option as follows:


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --dbs

    ```


    Having retrieved that useful information, your next step would be to discover
    the table names that are in use. You can do that as follows, substituting your
    real database name with the `<database-name>` entry:


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --tables -D <database-name>

    ```


    The next logical step would be to learn the columns used by a database table of
    interest. The command is simply as follows, again substituting your database name
    with the `<database-name>` entry, and also `<table-name>` with your table name:


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --columns -D <database-name> -T <table-name>

    ```


    The final part of the process would be pulling all of the data from your target.
    This might include usernames and passwords, personal customer information. To
    dump the database, you introduce the `--dump` option as shown here:


    ```

    # python sqlmap.py -u "http://www.a-vulnerable-website.com/product.php?id=1111"
    --dump -D <database-name> -T <table-name>

    ```


    If you want to only pull specific columns, then you can specify them directly.
    Once you know the column names, you can simply list them with an option such as
    `-C columnX, columnY` and separate them with commas. Having done so, you just
    remove the `--columns` option included in the previous example.


    Your last command might produce output something like this:


    ```

    +-------+----------------+----------+----------+------------+--------------+

    | id    | title          | color    | price    | category  | received-date|

    +-------+----------------+----------+----------+------------+--------------+

    | 1111  | bars of soap   | green    | 1.22     | toiletries | 11.11.22     |

    +-------+----------------+----------+----------+------------+--------------+

    ```

