    An online demo might also be of interest from the Codebashing website. They describe
    their clever, interactive website as “[a]pplication security training for programmers,
    by programmers.” The demo runs through how special characters make a massive difference
    to a login process, and it walks you through how the underlying database server
    reacts as you change your input. You can find the demo at [`www.codebashing.com/sql_demo`](http://www.codebashing.com/sql_demo).


    # Summary


    In this chapter, I have covered the basics behind SQL injection and also briefly
    looked at the history of SQL attacks. In addition, you saw how `PHP` developers
    have recommended protecting against `MySQL`-related SQLi attacks, both in the
    past for older versions and moving forward for newer versions, after version `7.0.0`
    in particular.


    It''s easy to see why SQLi attacks are so common — and in fact have been considered
    the most popular type of attack in some arenas. Using a few relatively simple
    `sqlmap` commands, you wielded the power to potentially breach a website''s security,
    and then query and steal its valuable data, only to then go on to further damage
    its reputation with vandalism.


    It''s important for technical personnel defending against such attacks to be aware
    of how simple these attacks are, and to understand the implications of apparently
    simple mistakes. Those mistakes can open up websites — which likely took a lot
    of effort and resources to build — to devastating attacks that cost a great deal
    to recover from. Once again, use these skills responsibly. It''s much more satisfying
    to protect your own infrastructure properly than to attack infrastructure that
    belongs to others.


