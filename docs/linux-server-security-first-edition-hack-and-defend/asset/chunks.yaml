    似乎每隔一天新闻就会报道另一起轰动人目的攻击事件，这让业内从业者深自庆幸自己的客户不是攻击目标。随着我们对响应式连接和优质软件的依赖日益增加，成功攻破在线服务所带来的回报也随之增长。


    本书的意图是提供系统和网络威胁的广泛概览。我的目标不是关注网络安全的某一个特定方面，而是旨在检查许多不同的领域，为你（即读者）提供足够的知识，以便你能够更深入地探索你感兴趣的内容。书中的每一章都探讨了我在作为互联网用户的旅程中发现的趣味安全方面，令人有些担忧的是，这段旅程已跨越了近二十年的时光。


    书中主题的多样性希望能够帮助你加固自己的在线服务的安全性，并为你提供实验黑客所使用的常用工具的机会。这旨在让所有人受益，帮助技术专业人员更好地理解攻击者将如何识别并尝试利用系统或网络的漏洞。书中包含的知识元素可以被用来破坏在线服务、窃取数据以及破解加密密码。能力越大，责任越重……


