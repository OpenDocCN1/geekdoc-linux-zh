    显然，通过使用正则表达式，文件匹配的可能性是无限的，它可以避免在每当有新用户允许登录你的服务器时，都必须手动更改配置。这个正则表达式示例希望让你明确，你可以使用类似于
    `premium-user-123456` 的用户名格式来命名特定的用户组。


    ## 从 CLI 运行


    LMD 的命令行界面 (CLI) 选项经过深思考虑，且相对易懂。我将留给你去探索所有的选项，但现在你将查看一些关键选项。


    正如我已经提到的，LMD 的可执行二进制文件名为 `maldet`。让我们从在后台运行 LMD 并检查某个特定的文件系统路径开始。你可以从文档中的此示例看到如何使用
    `-b` 参数如下所示在后台运行可能的大型扫描：


    ```

    # maldet -b -r /home/?/public_html 7

    ```


    在这个示例中，`-b` 用于后台扫描并检查过去七天内更改或修改的文件，通过后面附加的字符 `7` 来设置。该命令的语法和可选运行方式为 `--scan-recent
    PATH DAYS`。


    ## 报告


    让我们快速查看 LMD 如何生成其报告。图 8.4 显示了一份生成的报告。


    ![使用 maldet —report 命令的 LMD 扫描报告显示](img/c08f004.jpg)


    图 8.4 使用 maldet --report 命令的 LMD 扫描报告


    要查询特定的报告，你需要一个 `SCANID`。这是一个唯一的引用，可以在 图 8.4 顶部看到，运行此命令将为你提供最后一次运行的 LMD 命令的报告：


    ```

    # maldet --report

    ```


    一旦获取了该 ID，你还可以按照如下方式手动将报告电子邮件给自己：


    ```

    # maldet -e, --report SCANID chris@binnie.tld

    ```


    要查询名称包含格式化时间戳的特定 `SCANID`（在本示例中日期为 `010116`，名称其余部分为时间），你的命令可能如下：


    ```

    # maldet --report 010116-1111.21212

    ```


    这些选项如果与 `--log` 或 `-l` 选项一起使用也可能很有帮助：


    ```

    # maldet --log

    ```


    运行此命令，你应该能看到 LMD 记录事件。在我的情况下，尽管到目前只运行了几个命令，但我的日志文件中已经有相当丰富的详细信息。通过该命令，你将看到来自 `/usr/local/maldetect/logs/event_log`
    文件的最后五十行。如果你需要发现那 50 行中未找到的信息，可以进一步查询该文件。在我看来，LMD 记录的详细程度是说明该软件包精良且编写良好的另一个证明。


    ## 隔离与清理


    文档中特别强调了，默认情况下，LMD 在发现看起来可疑的文件时不会采取行动。因此，理解这一点很重要：在大多数情况下，你需要手动隔离你的恶意软件。


    如果你确定想要启用自动隔离，可以通过在主配置文件 `conf.maldet` 路径中设置配置选项 `quar_hits=1` 来实现，该文件默认位于 `/usr/local/maldetect/conf.maldet`。


    如果你想隔离特定扫描中的所有恶意软件，则可以使用 `-q` 选项，它等同于 `--quarantine SCANID`，如下：


    ```

    # maldet -q 010116-1111.21212

    ```


    如果你觉得自己犯了错误，可以使用以下命令从特定的 `SCANID` 恢复隔离的文件，这与 `--restore` 函数相同：


    ```

    # maldet -s 010116-1111.21212

    ```


    如果没有可恢复的内容，你将看到类似所示的错误：


    ```

    maldet(18748): {restore} could not find a valid hit list to restore.

    ```


    如果你想让 LMD 尝试修复它发现的恶意软件感染，可以使用 `--clean` 命令，它也写为 `-n` 选项。这里有一个清理特定 `SCANID` 中发现的恶意软件的清理示例命令：


    ```

    # maldet -n 010116-1111.21212

    ```


    要使清理被视为成功，清理恶意软件感染后的后续扫描必须通过，且没有注册到问题文件的 HIT（命中）。


    如果你开始怀疑结果，或者不确定你的配置更改是否已正确加载，可以使用以下命令清除所有现有的会话数据、日志和临时文件：


    ```

    # maldet -p

    ```


    结果应该类似于此输出：


    ```

    maldet(19219): {glob} logs and quarantine data cleared by user request (-p)

    ```


    ## 更新 LMD


    正如我从开始所说的，更新 LMD 的签名至关重要。要手动更新，请使用 `-u` 命令。如果你想疑惑，可以使用 `--update` 选项，如下：


    ```

    # maldet -u

    ```


    预期的输出将类似于：


    ```

    maldet(19278): {sigup} checking available updates

    maldet(19278): {sigup} hashing files and checking

    maldet(19278): {sigup} latest version 201511

    ```


    还有一个更新安装内容的机制如下：


    ```

    # maldet --update

    ```


    ## 扫描与停止扫描


    在 图 8.1 中你看到了使用 `-m` 或 `--monitor` 选项监控路径的结果。让我们在这里展开一下。假设你想监控两个文件系统分区，你可以如下监控路径：


    ```

    # maldet -m /usr/local,/home

    ```


    注意分隔路径的逗号。该命令的输出在 图 8.5 中所示。记得之前提到的大型扫描可以使用 `-b` 选项。


    让我们考虑如何手动扫描目录及其子目录。假设用户通过 FTP 或 SFTP 向上传目录上传文件：


    ```

    # maldet -a /home/?/uploads

    ```


    在这个示例中，你使用 LMD 扫描所有具有家目录的 `uploads` 目录（记住问号是通配符，而不是星号）。


    运行扫描命令后，你还会获得一个以后使用的 `SCANID`，从其生成的数据可以看出：


    ```

    maldet(28566): {scan} scan of /home/*/uploads (1 files) in progress…

    maldet(28566): {scan} 1111/1111 files scanned: 0 hits 0 cleaned

    maldet(28566): {scan} scan completed on /home/*/uploads: files 1111, malware hits
    0, cleaned hits 0, time 11s

    maldet(28566): {scan} scan report saved, to view run: maldet --report 151212-1724.28566

    ```


    如果你的任何扫描时间超过了预期，LMD 也可以适应这种情况。杀死开关 `-k` 选项（也写为 `--kill`）将立即停止任何 inotify 实例。如果机器负载过高或你认为某些运行不符合预期，那么这是可用选项非常有用的补充。


    ## 定时任务


