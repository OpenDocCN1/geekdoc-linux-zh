    Conversely, sophisticated attackers use a wide variety of approaches to disrupt
    or gain access to a system or network. They are not only experienced and intelligent,
    but also innovative, patient, and cunning. They employ social engineering, build
    customized hardware, and practice sleight of hand. During an attack, they adapt
    their methodology as the defender reveals their cards, and the attack evolves,
    sometimes rapidly. Much of the attack''s impact comes from being well prepared;
    the sheer number of attack vectors that might be tested during initial reconnaissance
    is high.


    Securing online services is a little like pushing water uphill, and I take no
    pleasure in saying that however well secured a service or system is, there will
    always be a way to breach or disrupt it. As bold a statement as that may be, keep
    in mind that even if a system or network isn''t vulnerable today, there''s an
    exceptionally high chance that it will be at some point in the future.


    Sadly, this means that, barring the destruction of the power source for a server
    or networked device, the very act of switching on `any` electronic device effectively
    represents an attack vector for someone to exploit. This is a reality that technical
    professionals have long faced. The resulting approach to online security is one
    of weighing up how valuable the successful exploit of your online systems and
    networks might be to attackers versus the budget you have available to secure
    your infrastructure. You might also try to reduce the value of a single prize,
    for example, by separating your mail servers from your web servers. If one cluster
    of machines is compromised, then hopefully the other cluster will not be susceptible
    if it''s behind a different firewall and using an alternative operating system.


    Putting night terrors aside, thankfully, very few highly sophisticated attackers
    actually exist, against which your defenses will fail to one degree or another
    (sometimes within a matter of minutes). However, as the Internet matures, there
    are an increasing number of proficient attackers who can wield the power of other
    compromised systems and services, causing serious headaches for unsuspecting victims.


    Furthermore, the motives for attempting attacks are varied and sometimes unpredictable.
    They might include receiving kudos from the hacking community, one-upmanship on
    a victim, a training exercise for wannabe novices, or simply financial gain. And,
    considering the most common demographic involved, let''s not forget thrill seekers.


    If your service is prone to certain types of unwanted attention, such as your
    web application being continually peppered with probes looking for security holes,
    then common sense dictates that you focus primarily on getting your developers
    to fix your application''s flaws. Conversely, if you are running an e-mail service,
    then you need to be absolutely sure that the software that you opted to roll out
    across all of the mail servers in your cluster is kept up to date, and patched
    frequently and promptly. By focusing on the most obvious weaknesses, it''s possible
    to limit the attack surface that you are likely to present to medium-skilled attackers,
    and to reduce the chances of them gaining a foothold on the rest of your infrastructure.
    Once you''re content that your primary attack vector is mostly secured, you can
    concentrate on plugging the less obvious security holes.


    It may help to focus your thoughts about security with a few simple questions.
    First, what are you trying to protect? For example, is there sensitive, secret
    information hidden deep inside a database, fronted by multiple firewalls and bastion
    hosts, or are you protecting an online service that absolutely must stay available
    to its users around the clock, every day of the year? This question is important
    because it affects how you bolster your defenses and potentially changes the defensive
    choices that you will make. You might, for example, pay top dollar every month
    for a network-traffic-cleaning service to help protect you against Denial-of-Service
    attacks, as opposed to buying several expensive, high-end hardware firewalls to
    secure your assets.


    Second, how would you contain a security breach? If one server or device on your
    network is breached, then will that automatically mean other hosts will suffer
    the same fate? If that''s the case, then clearly your security policy has serious
    issues that need to be addressed.


    Third, how will you recover from a security breach? You might also be concerned
    about what happens if an attacker has discovered how your redundancy works and
    at what stage your failover services will be activated. There may be little point
    in simply rebuilding a primary server or blindly restoring network service if
    you don''t know how an attacker managed to breach the security in the first place.
    Are you able to quickly restore services using an alternative vendor''s equipment
    or software? If so, then you might reduce the likelihood of the same attack penetrating
    your security again, allowing you to restore some, if not all, services while
    investigating how the attackers got in.


    # How This Book Is Organized


    The chapters contained within this book can be read in any order and are a collection
    of security topics that have interested the author on his journey as an Internet
    user over the years.


    The topics vary from the theory of past, current, and future attacks, to the mitigation
    and defense from a variety of online attacks, all the way to empowering readers
    to perform malicious attacks themselves (in the hope they will learn how to defend
    against such attacks).


    By separating the various topics into chapters, the subjects can be referenced
    and returned to in the future to allow the reader to recount the content in greater
    detail. The content of each chapters is as follows:


    - **[Chapter 1](#c01.xhtml): Invisibility Cloak:** If an attacker can''t see your
    server and isn''t aware of its existence, then there isn''t any attack vector
    to exploit in the first place. We discuss and demonstrate how to continue using
    services in production but without the unwelcome attention of attackers.

    - **[Chapter 2](#c02.xhtml): Digitally Fingerprint Your Files:** There are a number
    ways of keeping an eye on the integrity of your server''s filesystems to ensure
    attackers haven''t gained access. In this chapter we look at both a manual method
    and an automated tool that checks for rootkits.

    - **[Chapter 3](#c03.xhtml): Twenty-First-Century Netcat:** Steeped in history,
    the modern-day version of Netcat, thanks to its multitude of advanced features,
    has become a hacker''s tool of choice. Learn how to spot if such a tool is being
    used against your servers and additionally how to utilize its industry-leading
    functionality.

    - **[Chapter 4](#c04.xhtml): Denying Service:** Only a handful of the world''s
    largest Internet infrastructure providers can withstand the devastating effects
    of a full-fledged, high-capacity Distributed Denial of Service attack. In this
    chapter we discuss the topic in detail and even comment on an entire country losing
    Internet connectivity for three weeks due to such an attack.

    - **[Chapter 5](#c05.xhtml): Nping:** Knowing which services a host is running
    is only half the battle. This extension of the powerful Nmap security tool allows
    you to check just that on any host and also craft custom packets with unique payloads.

    - **[Chapter 6](#c06.xhtml): Logging Reconnoiters:** Although certain probes executed
    against your server might seem harmless enough, there is little doubt that being
    aware of how they work helps you secure your server further. We examine several
    facets of an attacker reconnoitering your server''s vulnerable points.

