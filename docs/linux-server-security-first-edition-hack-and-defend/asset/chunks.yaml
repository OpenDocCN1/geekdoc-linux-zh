    If I''m reading the documentation correctly, the `--limit-burst` value refers
    back to the specified period used by `--limit`. When that limit is not reached,
    `--limit-burst` benefits by an increment — in other words, by the value of one
    — every time the limit isn''t reached, up to the number configured.


    ## Summary


    Some of the changes you have explored can be damaging to both systems and networks.
    You should know what you''re doing (and ideally, experiment on a test machine)
    before trying any of these settings in production. As mentioned, the classic mistake
    of becoming panicked by the bad reputation that `ICMP` has and simply banning
    all mentions of the protocol on your network is ill-advised.


    You have looked at attacks and how to prevent them from affecting the normal operations
    of your network and servers. You also looked at rate-limiting inbound `ICMP` traffic.
    In addition, you looked at the logging of pings and traceroutes to pick up any
    recces taking place with nefarious intent on your server, and more importantly,
    how to safely log these unwanted probes to a file so that an attack won''t fill
    your disks with sizable log files.


    It''s safe to say that some of this knowledge may only be needed rarely, but the
    next time someone mentions that they''re blocking all `ICMP` traffic on their
    server, you can give them a knowing look and say that you''re confident that `ICMP`
    issues will no longer cause you problems.


    # Chapter 7


    ## Nmap''s Prodigious NSE


    Even novice sysadmins have probably heard of and run port scans against local
    and remote hosts. They may also have heard of one famous port scanner on the market,
    created by the Nmap Project, called `Nmap`. `Nmap` stands for “Network Mapper,”
    and along with being superfast, sophisticated, and efficient, it''s brimming with
    features.


    Among its many features, you can test for which operating system a remote server
    is running, audit the security of both local and remote machines, and create an
    inventory of the machines and their active services on a network. You may have
    used `Nmap` for port scanning in the past, but there''s a good chance that you
    didn''t realize what a powerful penetration-testing tool it is. This is partly
    thanks to its sophisticated built-in scripting engine. Before you look at that,
    however, you will first review `Nmap`''s basic port scanning functionality. Then
    you will learn how `Nmap` can be used for more advanced white hat activities.


    ## Basic Port Scanning


    Even the basic (port scanning) features bundled with `Nmap` include advanced options
    such as spoofing your source IP address (using the `-S` option). A magnificent
    selection of features is available. But first, let''s start with installing the
    package.


    To install `Nmap` on Red Hat derivatives, you can use this command:


    ```

    # yum install nmap

    ```


    On Debian and its derivative distributions, you can use this command:


    ```

    # apt-get install nmap

    ```


    If you want to use RPM Package Managers on Red Hat''s derivatives rather than
    running these commands, then you can find more information at [`https://nmap.org/book/inst-linux.html`](https://nmap.org/book/inst-linux.html).


    If you''re familiar with the file `/etc/services` on Unix-type machines, then
    the inclusion of the `/usr/share/nmap/nmap-services` file with `Nmap` should make
    sense. Be aware that your file''s location may change slightly. Within this file,
    you tie port numbers to humanly readable service names — a little like localized
    DNS, I suppose (like the `/etc/hosts` file where there''s usually a `key:value`
    format). One line in the `Nmap` version of that file would look something like
    this:


    ```

    Service name   Portnum/protocol   Open-frequency   Optional comments

    ftp                   21/sctp                  0.000000             # File Transfer
    [Control]

    ftp                   21/tcp                    0.197667             # File Transfer
    [Control]

    ftp                   21/udp                   0.004844             # File Transfer
    [Control]

    ssh                 22/sctp                  0.000000             # Secure Shell
    Login

    ssh                 22/tcp                    0.182286             # Secure Shell
    Login

    ssh                 22/udp                   0.003905             # Secure Shell
    Login

    telnet              23/tcp                    0.221265

    telnet              23/udp                   0.006211

    ```


    This file is useful because you can edit it to suit your `Nmap` activities without
    accidentally misconfiguring your local machine''s `/etc/services` file. The custom
    version that `Nmap` includes also adds a little more detail to the usual two fields
    in your local file. As you can see in this example, there are four columns with
    field descriptions at the top.


    Some people call this port mapping, which isn''t a bad description. If you''re
    curious, the `open-frequency` field has been populated following extensive research
    online (by running a large number of `Nmap` scans) and tells you how often the
    study found that port to be open. This more comprehensive configuration file can
    also be a useful reference when you''re trying to troubleshoot an issue.


