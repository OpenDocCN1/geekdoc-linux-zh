- fmt: "\nOne modern method of watching for changes on filesystems is by using `inotify`.\
    \ You need a compatible kernel for this functionality to work correctly. Fear\
    \ not, because `inotify` is reportedly included in kernels from version 2.6.13\
    \ and after, so most Linux builds will have this capability.\n\nThe sophisticated\
    \ `inotify` can monitor, in real time, both single files and entire directories\
    \ for changes, alerting configured software if any changes are discovered. If\
    \ a piece of user-space software is caught making changes, then `inotify` will\
    \ consider it an event and report it immediately.\n\nBy creating a watch list,\
    \ `inotify` can keep track of unique watch descriptors that it associates to each\
    \ item on its watch list. Although `inotify` won't pass on details about the user\
    \ or process that has changed a file or directory, the fact that a change has\
    \ taken place is enough to satisfy most applications. If `inotify` isn't available,\
    \ then the older approach of polling a filesystem or manually running scans will\
    \ usually apply. In the case of checking for changes on networked filesystems,\
    \ any configured software will need to resort to polling the filesystem using\
    \ a predetermined frequency. This is because remote filesystems are harder to\
    \ keep track of.\n\nUnfortunately, the pseudo filesystems, which include `/proc`,\
    \ `/sys`, and `/dev/pts`, aren't visible to `inotify`. This shouldn't be of too\
    \ much concern, however, because “real” files don't exist in these paths, but\
    \ rather the ephemeral workings of a system, which change frequently.\n\n### Installation\n\
    \nLet's now look at installing LMD on both Debian and Red Hat derivatives. First,\
    \ you will check that the `wget` package is installed with the following command\
    \ on Red Hat:\n\n```\n# yum install wget\n```\n\nThe alternative on Debian is\
    \ the following command:\n\n```\n# apt-get install wget\n```\n\nMany distributions\
    \ include `wget` by default, so this may not be needed.\n\nTo get the most out\
    \ of LMD, you can also install `inotify-tools` if you want LMD to interface with\
    \ `inotify` directly; you can read more and also download `inotify-tools` from\
    \ [`https://github.com/rvoicilas/inotify-tools/wiki`](https://github.com/rvoicilas/inotify-tools/wiki).\n\
    \nHowever, to install it from your package manager, if you're lucky and using\
    \ an offspring of Red Hat, you can use the following command:\n\n```\n# yum install\
    \ inotify-tools\n```\n\nAnd, for machines following Debian's lineage, you should\
    \ be able to run the following command:\n\n```\n# apt-get install inotify-tools\n\
    ```\n\nIf that doesn't work on your Debian flavor, try the following procedure.\
    \ I know this works because I wanted to see how easy LMD would be to install on\
    \ Ubuntu 14.04 LTS. I needed to add the Universe repository, in order to successfully\
    \ install the `inotify-tools` package to my `/etc/apt/sources.list` file, as follows:\n\
    \n```\ndeb http://us.archive.ubuntu.com/ubuntu trusty main universe\n```\n\nYou\
    \ can swap the word “trusty” with “precise” or another Ubuntu release code name\
    \ if you are running other flavors. You can then update your package lists with\
    \ the following command:\n\n```\n# apt-get update\n```\n\nThen, the final Ubuntu\
    \ command would simply be as follows:\n\n```\n# apt-get install inotify-tools\n\
    ```\n\nI will leave you to experiment with Debian repositories in the same way\
    \ (replacing “trusty” with your Debian version name).\n\nBecause the LMD package\
    \ itself is not found in package repositories as of this writing, you can download\
    \ and install the package as follows:\n\n```\n# cd /usr/local/src/\n# wget http://www.rfxn.com/downloads/maldetect-current.tar.gz\n\
    # tar -xzf maldetect-current.tar.gz\n# cd maldetect-*\n# sh ./install.sh\n```\n\
    \nOnce you've run the `install.sh` script, as shown on the last line of these\
    \ commands, you should be presented with output containing content that includes\
    \ the following:\n\n```\nLinux Malware Detect v1.5\n            (C) 2002-2015,\
    \ R-fx Networks <proj@r-fx.org>\n            (C) 2015, Ryan MacDonald <ryan@r-fx.org>\n\
    This program may be freely redistributed under the terms of the GNU GPL\ninstallation\
    \ completed to /usr/local/maldetect\nconfig file: /usr/local/maldetect/conf.maldet\n\
    exec file: /usr/local/maldetect/maldet\nexec link: /usr/local/sbin/maldet\nexec\
    \ link: /usr/local/sbin/lmd\ncron.daily: /etc/cron.daily/maldet\nmaldet(6617):\
    \ {sigup} performing signature update check…\nmaldet(6617): {sigup} local signature\
    \ set is version 2015112028602\nmaldet(6617): {sigup} latest signature set already\
    \ installed\n```\n\nYour chosen installation paths might vary, of course, if you\
    \ have edited the `install.sh` script (the `inspath` variable in particular).\
    \ As you can see, you also receive a note of how up-to-date your LMD signatures\
    \ are.\n\n### Monitoring Modes\n\nNow that you have installed your package, let's\
    \ look at what LMD can monitor for you on a system. A good place to start is if\
    \ you consider LMD's monitoring modes.\n\nLMD offers a number of monitoring modes\
    \ that can be configured. As you can see, LMD also provides a note of how up-to-date\
    \ your LMD signatures are.\n\n## Configuration\n\nThe main config file for LMD\
    \ is `/usr/local/maldetect/conf.maldet`. It's well commented and is useful for\
    \ understanding how LMD prefers to be set up.\n\nOne word of warning before you\
    \ continue, however: the LMD config file doesn't use an asterisk for wildcard\
    \ characters, but instead, a question mark. Therefore, you should use `?` instead\
    \ of `*` to replace multiple characters. Other than that minor caveat, it's relatively\
    \ smooth sailing.\n\n### Exclusions\n\nLet's look at how to set up LMD. The documentation\
    \ starts you off by asking you to consider the elements of the system that you\
    \ want to ignore. In the same style as the monitoring modes that you have just\
    \ looked at, there are files that you can populate to achieve this. Each entry\
    \ in the following files should be on its own line.\n\nYou can add full file paths,\
    \ which you don't want to be checked by LMD, to this file: `/usr/local/maldetect/ignore_paths`.\n\
    \nYou can also exclude a particular file extension globally by putting an entry\
    \ like `.jpg` in this file: `/usr/local/maldetect/ignore_file_ext`.\n\nCertain\
    \ LMD signatures might lead to unnecessary and unhelpful logging entries and alerts\
    \ for one reason or another. You can disable certain signatures by adding a signature,\
    \ such as `php.mailer.10hack`, to this file: `/usr/local/maldetect/ignore_sigs`.\n\
    \nThe last exclusion option means that you can use sophisticated regular expressions\
    \ (regex) to match multiple filesystem paths at once. You simply add a list to\
    \ this file, `/usr/local/maldetect/ignore_inotify`, which uses a format like this:\n\
    \n```\n ∧/home/premium-user-$\n```\n"
  raw: "One modern method of watching for changes on filesystems is by using inotify.\
    \ You need a compatible kernel for this functionality to work correctly. Fear\
    \ not, because inotify is reportedly included in kernels from version 2.6.13 and\
    \ after, so most Linux builds will have this capability.\n\nThe sophisticated\
    \ inotify can monitor, in real time, both single files and entire directories\
    \ for changes, alerting configured software if any changes are discovered. If\
    \ a piece of user-space software is caught making changes, then inotify will consider\
    \ it an event and report it immediately.\n\nBy creating a watch list, inotify\
    \ can keep track of unique watch descriptors that it associates to each item on\
    \ its watch list. Although inotify won't pass on details about the user or process\
    \ that has changed a file or directory, the fact that a change has taken place\
    \ is enough to satisfy most applications. If inotify isn't available, then the\
    \ older approach of polling a filesystem or manually running scans will usually\
    \ apply. In the case of checking for changes on networked filesystems, any configured\
    \ software will need to resort to polling the filesystem using a predetermined\
    \ frequency. This is because remote filesystems are harder to keep track of.\n\
    \nUnfortunately, the pseudo filesystems, which include `/proc`, `/sys`, and `/dev/pts`,\
    \ aren't visible to inotify. This shouldn't be of too much concern, however, because\
    \ “real” files don't exist in these paths, but rather the ephemeral workings of\
    \ a system, which change frequently.\n\n### Installation\n\nLet's now look at\
    \ installing LMD on both Debian and Red Hat derivatives. First, you will check\
    \ that the `wget` package is installed with the following command on Red Hat:\n\
    \n```\n# yum install wget\n```\n\nThe alternative on Debian is the following command:\n\
    \n```\n# apt-get install wget\n```\n\nMany distributions include `wget` by default,\
    \ so this may not be needed.\n\nTo get the most out of LMD, you can also install\
    \ `inotify-tools` if you want LMD to interface with inotify directly; you can\
    \ read more and also download `inotify-tools` from [`https://github.com/rvoicilas/inotify-tools/wiki`](https://github.com/rvoicilas/inotify-tools/wiki).\n\
    \nHowever, to install it from your package manager, if you're lucky and using\
    \ an offspring of Red Hat, you can use the following command:\n\n```\n# yum install\
    \ inotify-tools\n```\n\nAnd, for machines following Debian's lineage, you should\
    \ be able to run the following command:\n\n```\n# apt-get install inotify-tools\n\
    ```\n\nIf that doesn't work on your Debian flavor, try the following procedure.\
    \ I know this works because I wanted to see how easy LMD would be to install on\
    \ Ubuntu 14.04 LTS. I needed to add the Universe repository, in order to successfully\
    \ install the `inotify-tools` package to my `/etc/apt/sources.list` file, as follows:\n\
    \n```\ndeb http://us.archive.ubuntu.com/ubuntu trusty main universe\n```\n\nYou\
    \ can swap the word “trusty” with “precise” or another Ubuntu release code name\
    \ if you are running other flavors. You can then update your package lists with\
    \ the following command:\n\n```\n# apt-get update\n```\n\nThen, the final Ubuntu\
    \ command would simply be as follows:\n\n```\n# apt-get install inotify-tools\n\
    ```\n\nI will leave you to experiment with Debian repositories in the same way\
    \ (replacing “trusty” with your Debian version name).\n\nBecause the LMD package\
    \ itself is not found in package repositories as of this writing, you can download\
    \ and install the package as follows:\n\n```\n# cd /usr/local/src/\n# wget http://www.rfxn.com/downloads/maldetect-current.tar.gz\n\
    # tar -xzf maldetect-current.tar.gz\n# cd maldetect-*\n# sh ./install.sh\n```\n\
    \nOnce you've run the `install.sh` script, as shown on the last line of these\
    \ commands, you should be presented with output containing content that includes\
    \ the following:\n\n```\nLinux Malware Detect v1.5\n            (C) 2002-2015,\
    \ R-fx Networks <proj@r-fx.org>\n            (C) 2015, Ryan MacDonald <ryan@r-fx.org>\n\
    This program may be freely redistributed under the terms of the GNU GPL\ninstallation\
    \ completed to /usr/local/maldetect\nconfig file: /usr/local/maldetect/conf.maldet\n\
    exec file: /usr/local/maldetect/maldet\nexec link: /usr/local/sbin/maldet\nexec\
    \ link: /usr/local/sbin/lmd\ncron.daily: /etc/cron.daily/maldet\nmaldet(6617):\
    \ {sigup} performing signature update check…\nmaldet(6617): {sigup} local signature\
    \ set is version 2015112028602\nmaldet(6617): {sigup} latest signature set already\
    \ installed\n```\n\nYour chosen installation paths might vary, of course, if you\
    \ have edited the `install.sh` script (the `inspath` variable in particular).\
    \ As you can see, you also receive a note of how up-to-date your LMD signatures\
    \ are.\n\n### Monitoring Modes\n\nNow that you have installed your package, let's\
    \ look at what LMD can monitor for you on a system. A good place to start is if\
    \ you consider LMD's monitoring modes.\n\nLMD offers a number of monitoring modes\
    \ that can be configured to check different parts of the filesystem. As you will\
    \ see, LMD uses the binary executable called Maldet, short for “malware detect.”\n\
    \nTo monitor a system component, you can use the `-m` option, also written as\
    \ `--monitor`. What LMD can monitor may be broken down into users, files, and\
    \ paths. The website gives you the following example of how the three modes might\
    \ look on the command line:\n\n```\n# maldet --monitor users\n# maldet --monitor\
    \ /root/monitor_paths\n# maldet --monitor /home/mike,/home/ashton\n```\n\nBy using\
    \ the first option, `--monitor users`, LMD will monitor any unique identifiers\
    \ (UIDs) on the system that are above a minimum UID setting. (The config option\
    \ that can be set in the config file is called `notify_minuid`.)\n\nThe second\
    \ monitoring example is a file, spaced by new lines, that can contain the files\
    \ you want to monitor. In this case, the list of files is located in the file\
    \ `/root/monitor_paths`.\n\nFor the third option, you could potentially create\
    \ a very long command line by adding a comma-separated list of filesystem paths\
    \ to keep an eye on.\n\n[Figure 8.3](#c08.xhtml_c08-fig-0003) shows the output\
    \ from running the following command:\n\n```\n# maldet -m /home/ubuntu\n```\n\n\
    ![Display of the output when LMD is asked to monitor a specific path.](images/c08f003.jpg)\n\
    \n[**Figure 8.3**](#c08.xhtml_c08-fig-anc-0003) What you see when you ask LMD\
    \ to monitor a specific path\n\n## Configuration\n\nThe main config file for LMD\
    \ is `/usr/local/maldetect/conf.maldet`. It's well commented and is useful for\
    \ understanding how LMD prefers to be set up.\n\nOne word of warning before you\
    \ continue, however: the LMD config file doesn't use an asterisk for wildcard\
    \ characters, but instead, a question mark. Therefore, you should use `?` characters\
    \ instead of `*` to replace multiple characters in a config option. Other than\
    \ that minor caveat, it's relatively smooth sailing.\n\n### Exclusions\n\nLet's\
    \ look at how to set up LMD. The documentation starts you off by asking you to\
    \ consider the elements of the system that you want to ignore. In the same style\
    \ as the monitoring modes that you have just looked at, there are files that you\
    \ can populate to achieve this. Each entry in the following config files should\
    \ be on its own line.\n\nYou can add full file paths, which you don't want to\
    \ be checked by LMD, to this file: `/usr/local/maldetect/ignore_paths`.\n\nYou\
    \ can also exclude a particular file extension globally by putting an entry like\
    \ `.jpg` in this file: `/usr/local/maldetect/ignore_file_ext`.\n\nCertain LMD\
    \ signatures might lead to unnecessary and unhelpful logging entries and alerts\
    \ for one reason or another. You can disable certain signatures by adding a signature,\
    \ such as `php.mailer.10hack`, to this file: `/usr/local/maldetect/ignore_sigs`.\n\
    \nThe last exclusion option means that you can use sophisticated regular expressions\
    \ (regex) to match multiple filesystem paths at once. You simply add a list to\
    \ this file, `/usr/local/maldetect/ignore_inotify`, which uses a format like this:\n\
    \n```\n ∧/home/premium-user-$\n```"
