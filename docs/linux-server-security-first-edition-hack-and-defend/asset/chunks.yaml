    \ next available sequence from that file and then comments out that line following\
    \ a successful connection with a valid knock. It simply adds a hash or pound character\
    \ to the start of the line that has the sequence present. The next connection\
    \ triggers the same sequence.\n\nThe documentation states that you should leave\
    \ space at the start of each line. Otherwise, when the `#` character is added\
    \ to the start of the line, you might find it has been overwritten unintentionally,\
    \ meaning that you're locked out.\n\nInside your sequences file, you can add one\
    \ sequence per line. That file follows the same format as the `sequences` option\
    \ within the main config file.\n\nThe documentation also points out that you can\
    \ put comments in by preceding them with a `#` character but bad things will happen\
    \ (such as being locked out of your server) if you edit the sequences file when\
    \ knockd is already running.\n\nOnce you understand the basic features of knockd,\
    \ it is an excellent addition to experiment with. During testing, you could enter\
    \ telephone numbers that you are able to memorize or some other sequence of numbers\
    \ so that you're not continually looking up an insecure list. For example, you\
    \ might consider rotating through five telephone numbers, split up into valid\
    \ port numbers.\n\n## Summary\n\nIn addition to making your server invisible,\
    \ I've covered how your server appears to the Internet before launching an attack.\
    \ In order to fully obfuscate your server using port knocking, you should think\
    \ carefully about public information such as reverse DNS entry, which might give\
    \ away an IP address as being in use. You might also consider using NAT to hide\
    \ a server and dynamically change its IP address periodically, only letting administrators\
    \ know which IP address is in use at a given time via a secret hostname, published\
    \ covertly in DNS on an unusual Domain Name.\n\nThere are many other facets to\
    \ protecting a server; still, I've hopefully covered enough ground to make you\
    \ consider what information is leaked to the public and may potentially be used\
    \ in future exploits, as well as hiding a server if you need to do so.\n\n# Chapter\
    \ 2\n\nDigitally Fingerprint Your Files\n\nThere are a number of good reasons\
    \ to keep an eye on your server security. Few sysadmin types absorb the necessary\
    \ security knowledge required to keep their infrastructure safe without enthusiasm\
    \ and effort. If you're anything like me, there have been a few bumps along the\
    \ way, such as when I had a server compromised around the turn of the millennium\
    \ thanks to a nasty PHP bug, or when I was faced with and repelled two relatively\
    \ significant DDoS attacks.\n\nThis chapter will cover another attack vector,\
    \ rootkits, and a fantastic piece of software called Rootkit Hunter (you may know\
    \ it as rkhunter). You will start off, however, by exploring how to monitor your\
    \ filesystem's important files, such as its executables.\n\n## Filesystem Integrity\n\
    \nMany years ago I used Tripwire ([`http://sourceforge.net/projects/tripwire`](http://sourceforge.net/projects/tripwire)).\
    \ It's now referred to as Open Source Tripwire, thanks to the availability of\
    \ other products. Tripwire ran periodically (overnight using cron) and used cryptographic\
    \ hashing to monitor any file changes on your system.\n\nBy generating and recording\
    \ the hashes of any files visible on the filesystem initially, during its first\
    \ run, Tripwire was able to alert the administrator if any hashes didn't match\
    \ those it had recorded on each subsequent run. If the file had been altered in\
    \ any way the hash would be changed. It's a clever approach, despite being I/O\
    \ resource intensive on older hardware, and has since given birth to great grandchildren.\
    \ One example is the popular AIDE (Advanced Intrusion Detection Environment),\
    \ which is described as “a file and directory integrity checker” at [`http://aide.sourceforge.net`](http://aide.sourceforge.net).\
    \ I would certainly recommend trying AIDE or Tripwire on a development virtual\
    \ machine if you get the chance. Be warned, however, that if you are lax with\
    \ the initial configuration, then you will be bombarded with false positives.\n\
    \nThis type of security often appears under the umbrella of host-based intrusion\
    \ detection systems, or HIDS, and it was reportedly one of the first types of\
    \ software-based security because mainframes had few externally risky interactions\
    \ over networks.\n\nIf you don't want to run nightly filesystem checks or you\
    \ aren't in a position to receive daily system reports, then that's not a problem.\
    \ You can opt to go for an older approach where you only scan your filesystem\
    \ once, after you have built your server, in order to collect information about\
    \ what files are installed on the filesystem. I will explain why this is useful\
    \ in a moment.\n\nYou might be surprised that a tool you've almost certainly used\
    \ for another purpose can be easily used as a security assistant.\n\nStep forward\
    \ the `md5sum` command. When downloading Unix-type files in the past, you have\
    \ probably been offered the option to check the integrity of your potential download\
    \ by verifying the MD5sums for those files. For example, the MD5sums are usually\
    \ present on the website that you get your Linux installation ISO file image from.\n\
    \nAs you can see in [Figure 2.1](#c02.xhtml_c02-fig-0001), this is what you're\
    \ faced with when downloading Debian Jessie from this Dutch mirror: [`http://ftp.nl.debian.org/debian/dists/jessie/main/installer-amd64/current/images/`](http://ftp.nl.debian.org/debian/dists/jessie/main/installer-amd64/current/images/).\n\
    \n![Illustration depicting the download of Debian Jessie from a Dutch mirror.](images/c02f001.jpg)"
