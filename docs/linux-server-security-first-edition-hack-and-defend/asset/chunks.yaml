    ## Summary


    In this chapter, I''ve touched on just some of Nmap''s basic functionality, introduced
    and explained the different script categories of NSE, discussed the types of scripts
    that Nmap can use, and explored using a GUI to take the initial complexity away
    from repetitive tasks. Of course, I would be remiss not to mention again that
    the GUI also helps with analysis.


    There are hundreds of options, as well as white hat and black hat scenarios, that
    Nmap supports and encourages you to experiment with. It''s important to learn
    how attackers might approach your system, but equally to use these powerful tools
    with care and respect.


    After all, bringing down other people''s servers is no fun. It''s stopping other
    people from bringing down your servers that is a bigger challenge, and as a result
    it''s much more satisfying (and completely legal).


    # Chapter 8


    Malware Detection


    The term *malware* encompasses a large range of unwelcome software that is designed
    to damage a computer. A partial list of malware might, for example, include viruses,
    spyware, Trojan horses, and worms. The rapid proliferation of such software is
    enough to concern users of all levels, from novices to seasoned administrators.
    The impact of malware ranges from essentially harmless pranks to the theft of
    personal information, such as banking details, or a denial of service.


    Although the level of scaremongering in the news ebbs and flows, every good sysadmin
    knows that there''s no such thing as a completely secure system. Despite the massive
    number of virus and malware threats that target Windows machines, all users of
    Unix-type machines should remember that these threats also exist for their systems.


    One popular, sophisticated software package called Linux Malware Detect (LMD),
    from R-fx Networks ([`https://www.rfxn.com`](https://www.rfxn.com)), helps to
    mitigate malware threats on Linux systems. Let''s look at how you can effectively
    protect Linux machines against malware using the LMD package, which only focuses
    on malware, unlike other more diluted solutions.


    ## Getting Started


    Before we begin with looking at LMD itself, let''s consider some potentially less
    obvious aspects of what''s needed to successfully keep your malware software functioning
    correctly.


    ### Definition Update Frequency


    It is critical that malware signature updates be performed frequently; in fact,
    your system may be vulnerable if you have missed the latest update. The architecture
    of the detection software itself is of little value if current threats are not
    detected. Fortunately, LMD frequently pulls in its updates, from which it generates
    signatures, from community data, user submissions, and the firewall data of active
    malware threats.


    The LMD website offers an up-to-date RSS feed of the latest threats, and also
    provides a commercial version, which is another incentive for updates to be current
    and relevant. The feed, which is brimming with LMD''s current malware findings,
    can be found at [`https://www.rfxn.com/feed/`](https://www.rfxn.com/feed/).


    LMD states that signatures receive an update approximately once a day, or more
    often if a flurry of activity is reported.


    ### Malware Hash Registry


    A well-respected security website called Team Cymru provides a Malware Hash Registry
    ([`www.team-cymru.org/MHR.html`](http://www.team-cymru.org/MHR.html)), which provides
    a lookup service to compare malware infections. According to LMD, over 30 major
    antivirus companies use this data to populate their databases. From the LMD website,
    you can see the current number of reported threats as follows:


    ```

    DETECTED KNOWN MALWARE: 1951

    % AV DETECT (AVG): 58

    % AV DETECT (LOW): 10

    % AV DETECT (HIGH): 100

    UNKNOWN MALWARE: 6931

    ```


    The LMD website then continues and explores some of the scoring used to measure
    successful hits and misses by other malware products, resulting in a worrying
    conclusion.


    > Using the Team Cymru malware hash registry, we can see that of the 8,883 malware
    hashes shipping with LMD 1.5, … 6,931 or 78% of threats … went undetected by 30
    commercial anti-virus and malware products. The 1,951 threats that were detected
    had an average detection rate of 58% with a low and high detection rate of 10%
    and 100% respectively. There could not be a clearer statement to the need for
    an open and community driven malware remediation project that focuses on the threat
    landscape of multi-user shared environments.


    As you can see from this LMD website excerpt, there are a significant number of
    failures among commercial malware products. LMD aims to plug the market gap where
    possible, but is an advocate of open discussions and collaboration, sharing known
    threat details between vendors.


    ### Prevalent Threats


    At the time of writing, LMD claims to hold 10,822 malware signatures within its
    database. Looking at the contents of [Figure 8.1](#c08.xhtml_c08-fig-0001), you
    can see a list of the top 60 most prevalent threats within the LMD database. As
    you might expect, the world''s most popular server-side scripting language, PHP
    ([`https://www.php.net`](https://www.php.net)), is a common attack vector. The
    powerful Perl language also features heavily.


    ![List of the top 60 most prevalent attacks according to LMD.](images/c08f001.jpg)


    [**Figure 8.1**](#c08.xhtml_c08-fig-anc-0001) The top 60 most prevalent attacks
    according to LMD


    ### LMD Features


    The LMD feature set is far from trivial. In [Figure 8.2](#c08.xhtml_c08-fig-0002)
    you can see the features listed in its documentation.


    ![List of features offered by LMD.](images/c08f002.jpg)


    [**Figure 8.2**](#c08.xhtml_c08-fig-anc-0002) The sizeable list of features that
    LMD offers


    You can tell that in addition to its clever threat detection, LMD manages to combine
    comprehensive reporting and the quarantining of threats, among many other features.
    The ability to receive summary reports on a daily basis through e-mail via a cron
    job is clearly useful to make sure the detection system is running as expected.
    In addition, LMD''s ability to plug into Apache and directly monitor file uploads
    from users is something that I will touch on later. If this is the only way that
    a user can get files onto a system, then it is clearly a bulletproof choice.


    ### Monitoring Filesystems'
