    由于 NAT 非常流行（而且你的连接很可能经过了 NAT 处理），如果你查询该机器，很有可能在 `SENT` 行下方和下一行 `RCVD` 行之前看到 `CAPT`
    条目。这个命令对我来说是有效的：


    ```

    # nping --echo-client "public" echo.nmap.org --tcp

    ```


    如果你仔细观察捕获的数据包条目（`CAPT`），那么你应该能够判断出 NAT 是否更改了你的出站源地址。你会看到一个根据 RFC 1918 ([`tools.ietf.org/html/rfc1918`](https://tools.ietf.org/html/rfc1918))
    的私有 IP 地址（例如 `10.10.10.10`），在有 NAT 参与的情况下，它被更改为显示公路由 IP 地址（例如 `123.123.123.123`）。检测
    NAT 干扰你的连接是容易的。记住，在有 NAT 的地方，有时还有其他设备会修改 MTU（最大传输单元）、用于流量整形的数据包篡改、意外的防火墙以及可能导致你的连接发生细微变化的隐形交换机。


    Nping 可以在许多其他场景中提供帮助，例如（在经过学习后）能够识别路径途中可能使用了透明代理。我将留给你进一步提升技能，但在此期间，以下章节描述了一些你可能会觉得有用的其他选项。


    ## 其他 Nping 选项


    使用 `--delay 10` 选项，你可以选择限制数据包的频率。默认通常是每隔一秒发送一次 ping，但如果你在严密观察某个特定事件，增加此值可以减少屏幕上的噪音。


    与之类似的是 `--rate 3` 选项，在给出的示例中，你可以通过每秒发送三个数据包来泛洪目标机器。不过，不要纠结于 `rate` 和 `delay` 选项的设置。根据文档：


    > [t] `rate` 选项和 `--delay` 是反向的；`--rate 20` 等同于 `--delay 0.05`。如果同时使用了这两个选项，以参数列表中的最后一个为准。


    你可以利用 `-H` 或 `--hide-sent` 选项来不显示出站数据包。例如，如果你正在对连接进行泛洪，这将会很有帮助。


    此外，如果你正在对网络泛洪并测试其对大量负载的响应，你可能不想处理收到的每个包。`-N` 或 `--no-capture` 选项不会捕获任何收到的数据包。


    Nping 许多许多命令行选项可用。例如，你可以添加 `--debug` 来帮助你获取更多细节。你可以修改 TTL（存活时间）设置。如果你正在扫描许多主机，你可能还想添加一个超时选项，通过
    `--host-timeout 10` 让 Nping 永远不要等待响应，其中 `10` 的单位是秒。


    我曾简要提过通过伪造 IP 地址来伪造发送 IP 地址；Nping 可以更进一步，通过使用类似这样的命令对主机 `whitehat.chrisbinnie.tld`
    进行攻击，甚至在发送者字段中填充随机值：


    ```

    # nping --arp --sender-ip random --ttl random whitehat.chrisbinnie.tld

    ```


    当我第一次读到这个功能时，警钟响了。能够（成功地）使用随机值伪造 IP 地址应该让任何系统管理员感到担忧。这只需要上游路由器配置不当，就能允许此类流量到达组织的网络中。


    最后，如果你想调整 Echo 模式使用通道的方式，`--channel-tcp` 或 `--channel-udp` 就可以做到：


    ```

    # ping  -vvv --client --channel-tcp 1234 --tcp -p 8100 localhost

    ```


    正如你可能想象到的，如果有严格的防火墙阻碍，能够调整 Echo 模式通过 TCP 和 UDP 将其“通道”数据传回给客户端，可能是救命稻草。


    ## 总结


    如果你随着时间的推移不断尝试 Nping，你会发现它提供的报告确实非常详尽。我鼓励你只要有机会就去尝试使用 Nmap，以获得更多接触。


    凭借其数据包包包的能力，强大的 Nping 可以超越许多竞争对手。高级 Echo 模式的加入意味着，如果你可以访问连接的两端，设备逃避检测的概率就会更小。结果是故障排除应该变得更迅速、更不那么困难。


    Nmap 强大的 Nping 可能仅被视为白帽工具箱中的一个工具。通过合法地使用这些工具，你将在你的预定任务中表现出色，而且作为一个令人欢迎的收获，你将学会如何保持你自己的服务器运行。


    # 第 6 章


    ## 记录侦察行为


    有时，你需要额外关注谁正在连接你的服务器。例如，最近可能发生了一系列攻击，你想严密监控它们；或者由于数据的敏感性或服务的关键性，你可能通常情况下就非常偏执。


    监控那些对你的服务器进行侦察的机器的一种种相对简单的方法，是记录对它们运行 ping 和 traceroute 的 IP 地址。你可能认为你收集到的信息将没有太大用，但它对于构建谁连接、频率如何以及何时连接的图像实际上非常重要。就像研究办公室的闭路电视（CCTV）视频一样，久而久之你就会谁很异常。由于某种原因需要监视你的服务器，我认为正确监控的技巧取决于两点：首先，你需要一个在后台运行的守护进程；它应该是可靠的，不会引入竞态条件并导致服务器故障。其次，你需要最小化日志，以便在一年后查看日志时无必担心日志会填满磁盘。显然，你也不希望攻击日志填满你的磁盘。

    '
- fmt: '

    For example, if you want to pick up pings, then the following command works when
    I ping my paranoid server from another machine:


    ```

    # /usr/sbin/tcpdump -i eth0 icmp and icmp[icmptype]=icmp-echo

    ```


    This next example, showing `tcpdump`''s ICMP packet-sniffing abilities, also picks
    up traceroutes:


    ```

    # /usr/sbin/tcpdump ip proto ∖∖icmp

    ```


    As you can see in the following code, pings rely on both replies and requests;
    however, because my paranoid server''s firewall is blocking certain ICMP traffic,
    an `admin prohibited` error is logged when traceroutes appear.


    ```

    listening on eth0, link-type EN10MB (Ethernet), capture size 65535 bytes

    17:06:47.925923 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request,
    id 21266, seq 1, length 64

    17:06:47.925979 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply,
    id 21266, seq 1, length 64

    17:06:48.927871 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request,
    id 21266, seq 2, length 64

    17:06:48.927921 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply,
    id 21266, seq 2, length 64

    17:06:49.928069 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request,
    id 21266, seq 3, length 64

    17:06:49.928136 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply,
    id 21266, seq 3, length 64

    17:06:52.215139 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    17:06:52.215179 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    17:06:52.215194 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    17:06:52.215210 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    17:06:52.215220 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    17:06:52.215231 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld
    unreachable - admin prohibited, length 68

    ```


    In the code snippet, a server called `noid` experiences probes from a host called
    `recce`. `Recce` is reconnoitering to see if the server is online.


    ## Iptables


    You can also run the `iptables` command, which uses Netfilter''s kernel-based
    firewall:


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state NEW,ESTABLISHED,RELATED
    -j LOG --log-level=1 --log-prefix "Pings Logged "

    ```


    If you''re paying attention, you may have spotted the number `8` being used as
    the `--icmp-type` value. In [Table 6.1](#c06.xhtml_c06-tbl-0001), you can see
    the codes that are used by ICMP. You can find more information at its Request
    for Comments (RFC) page, at [`https://tools.ietf.org/html/rfc792`](https://tools.ietf.org/html/rfc792).
    According to this page, ICMP has been around since 1981 or thereabouts, when the
    Internet was a very different animal.


    | Type | Code |

    | :--- | :--- |

    | 0 | Echo Reply |

    | 3 | Destination Unreachable * |

    | 4 | Source Quench * |

    | 5 | Redirect |

    | 8 | Echo Request |

    | B | Time Exceeded * |

    | C | Parameter Problem * |

    | D | Time stamp Request |

    | E | Time stamp Reply |

    | F | Info Request |

    | G | Info Reply |

    | H | Address Mask Request |

    | I | Address Mask Reply |


    **[Table 6.1](#c06.xhtml_c06-tbl-0001)** The ICMP Codes from the Kernel Source
    `/linux/icmp.h`


    As a reaction to the attacks that used ICMP, changes were made to the Linux kernel
    over time. Thanks to the abuse of ICMP, the functions marked with an asterisk
    in [Table 6.1](#c06.xhtml_c06-tbl-0001) are rate limited by default in modern
    implementations of the kernel (since Linux 2.4.10).


    In the following code snippet, you see the source and destination addresses (`SRC=10.10.10.200`
    and `DST=10.10.10.10`) involved in the ping traffic logged to the `/var/log/messages`
    file.


    ```

    Feb 31 17:19:34 noid.chrisbinnie.tld kernel: Pings Logged IN=eth0 OUT=00:61:24:3e:ef:00:30:1c:14:3b:02:10
    SRC=10.10.10.200 DST=10.10.10.10 LEN=84 TOS=0x00 PREC=0x00 TTL=64 DF PROTO=ICMP
    TYPE=8 CODE=0 ID=40978 SEQ=1

    Feb 31 17:19:35 noid.chrisbinnie.tld kernel: Pings Logged IN=eth0 OUT=00:61:24:3e:ef:00:30:1c:14:3b:02:10
    SRC=10.10.10.200 DST=10.10.10.10 LEN=84 TOS=0x00 PREC=0x00 TTL=64 DF PROTO=ICMP
    TYPE=8 CODE=0 ID=40978 SEQ=2

    Feb 31 17:19:36 noid.chrisbinnie.tld kernel: Pings Logged IN=eth0 OUT=00:61:24:3e:ef:00:30:1c:14:3b:02:10
    SRC=10.10.10.200 DST=10.10.10.10 LEN=84 TOS=0x00 PREC=0x00 TTL=64 DF PROTO=ICMP
    TYPE=8 CODE=0 ID=40978 SEQ=3

    ```


    If I used either `tcpdump` or `iptables` to log traffic, I would be keen to reduce
    the log files. The first reason for this would be to stop an attacker (knowingly
    or otherwise) from causing disk space problems by creating massive log files,
    after inundating a server with ICMP traffic. The second reason would be to keep
    the significant logging levels to a minimum so that I could quickly reference
    the log and spot what I was looking for.


    Assuming that you wisely felt uncomfortable having `tcpdump` running in the background
    all year, for reasons of system stability, let''s use the `iptables` example to
    strip out the information that you need.


    Let''s look at a high-level overview of how you might go about stripping the noise
    out of a log. For clarity, you would probably want your reconnoiter logs to be
    dumped to a file separate from syslog.


    I''m going to use the excellent, “rocket-fast” syslog server, `rsyslog`, as an
    example (you can find more information at [`www.rsyslog.com`](http://www.rsyslog.com)).
    This is because Red Hat and Debian (and their many derivatives) currently use
    `rsyslog` by default, so there''s a good chance you will have access to it.


    Let''s take another look at the `iptables` pings example from a moment ago:


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state NEW,ESTABLISHED,RELATED
    -j LOG --log-level=1 --log-prefix "Pings Logged "

    ```


    You''re now paying closer attention to the `--log-prefix` option, as shown here:


    ```

    --log-prefix "Pings Logged "

    ```


    If you want to save all kernel warnings to a new log file, then it is relatively
    easy to set up. Open the file `/etc/rsyslog.conf` and add the following line to
    the RULES section or close to it (assuming there''s not already an entry for `kern.warning`
    that you might disrupt; otherwise, decide if you can overwrite or append to it):


    ```

    kern.warning                               /var/log/iptables.log

    ```


    Of course, when it comes to manipulating text files, you can achieve a lot of
    different results with a quick shell script (or by using some `grep`, `awk`, or
    `sed` command-line tools). However, for the sake of avoiding even temporary disk
    space issues, let''s try not to log every warning from the kernel in case a piece
    of hardware starts misbehaving and logs thousands of warnings in a short period
    of time.


    You''re going to create a new syslog config file and call it `/etc/rsyslog.d/iptables-pings-logging.conf`.
    Incidentally, you can probably name this file whatever you like if your main config
    file (that''s the `/etc/rsyslog.conf` file) picks up all config files that it
    finds in that directory. By default, there''s an entry in that file that looks
    like this to read all the config files at once:


    ```

    $IncludeConfig /etc/rsyslog.d/*.conf

    ```


    I should say, however, that I had trouble getting the filters to work from a new
    file in that directory. That was despite checking permissions and having remote-syslog-logging
    working fine from within one of those files (and trying `startswith` and `regex`
    instead of the `contains` operator that you will see next).

    '
