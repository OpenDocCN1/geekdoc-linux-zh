    process and test a relatively high-capacity network''s limits more rigorously.
    The last template, insane, assumes that you are happy to trade off some accuracy
    in the results that NSE provides against the time it takes to execute. You should
    have a high-capacity and reliable network if you want to use this setting.


    ## Categorizing Scripts


    Despite employing a highly sophisticated underlying engine, NSE was so thoughtfully
    designed that even a new user can understand how to operate it with relative ease.
    It''s therefore possible to deploy NSE promptly and without requiring too much
    reading in advance.


    However, to avoid getting ahead of yourself, it''s useful to know how NSE refers
    to the different scripts that it uses. When you run a script through NSE, a port
    scan will usually be performed prior to or during its execution in order to check
    the current state of a target machine''s network availability. There are also
    other similarities among the many NSE scripts, such as DNS lookups and traceroutes.


    In [Table 7.1](#c07.xhtml_c07-tbl-0001) you can see how NSE categorizes its scripts;
    there are a number of different categories to consider.


    | **Category** | **Description** |


    | auth | These scripts look at authentication methods and circumventing them —
    for example, `x11-access`, `ftp-anon`, and `oracle-enum-users`. The brute category
    is for brute forcing and not authentication. |


    | broadcast | If you need to broadcast on the local network, employ this bundle
    of scripts. |


    | brute | For brute forcing the authentication credentials of a remote host, use
    this collection of scripts. There are many available for different protocols.
    |


    | default | The default scripts are executed if you use the `-sC` or `-A` options.
    To use specific scripts, override the default with `--script=`. |


    | discovery | To track who and what is connected to a network, these scripts are
    all about examining, for example, public registries, SNMP-enabled devices, and
    directory services. |


    | dos | If you want to test a vulnerability or (carefully) run scripts that have
    the possibility of crashing services, then this set is suitable for your denial-of-service
    needs. |


    | exploit | In order to try out an exploit to see if it succeeds, these scripts
    will do exactly that. |


    | external | Be warned that by executing these scripts, your actions may be logged
    by other parties. That''s because this set of scripts might perform a third-party
    query, such as a WHOIS lookup, and you would be visible to that WHOIS service.
    |


    | fuzzer | These scripts will search for software bugs and security holes by injecting
    randomized fields into their queries while you perform your search. They take
    much longer than other techniques to knock a server offline or find anything of
    interest. |


    | intrusive | Ostracized to this unpleasant category, these scripts are very risky
    to run and won''t make it to the safe category. Some of the risks include crashes,
    bandwidth saturation, and being spotted by sysadmins on target machines. |


    | malware | Known malware leaves certain system traces, such as backdoors or signs
    of infection. Unusual port numbers and service oddities are searched for with
    malware scripts. |


    | safe | This set of scripts is less likely to offend the sysadmins of target
    systems. Still, you shouldn''t completely rely on these scripts not to cause problems.
    |


    | version | You can''t select these scripts directly because they are an extension
    to NSE''s version detection functionality. They execute if the version detection
    option (`-sV`) is used. |


    | vuln | If vulnerabilities are discovered, then this set will alert you about
    them; otherwise, little noise will be made. Examples are `realvnc-auth-bypass`
    and `afp-path-vuln`. |


    [**Table 7.1**](#c07.xhtml_c07-tbl-anc-0001) The Script Categories That Come with
    NSE


    ## Contributing Factors


    When the default set of scripts is used, you might be surprised at how the mighty
    NSE reaches its decisions. There are no set thresholds; rather, it reaches a kind
    of score after running through the following criteria.


    *   *Speed —* default scans must be completed swiftly, for example, so no brute
    forcing is employed.


    *   *Usefulness —* if a script doesn''t produce useful results, then you can forget
    its inclusion in default scripts.


    *   *Verbosity —* the resulting output of running a script needs to be succinct.
    Equally, when there''s nothing to report, silence is a virtue.


    *   *Reliability —* inevitably, assumptions and guesses are made during the operation
    of some scripts. However, if there are frequently errors, then it shouldn''t be
    run in the default category.'
