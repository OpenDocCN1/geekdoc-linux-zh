    ## Nmap 强大的 NSE


    即使是新手管理员可能也听说过并对本地和远程主机运行过端口扫描。他们可能还听说市场上一种著名的端口扫描器，它由 Nmap 项目创建，名为 `Nmap`。`Nmap`
