- fmt: '

    As you can see, in reverse, Lionel is passing his lengthy file onto Luis before
    he then chains the two netcat commands together in order to forward the file onto
    Neymar. This triumvirate works well, especially if Luis can''t talk directly to
    Neymar because of a firewall or routing.


    However, the documentation does point out a problem with this scenario. The issue
    is that Neymar can''t talk back to Lionel. As you''d expect from the powerful
    netcat, there''s a workaround. When I look at this example, I immediately think
    of exploits deployed for nefarious gain. (I''m sure you''ll see why in a moment.)
    Now look at the following set of commands:


    ```

    Neymar> # ncat -l 1234 > newlog.log

    Luis> # ncat -l 1234 --sh-exec "ncat Neymar 1234"

    Lionel> # ncat --send-only Luis 1234 < logfile.log

    ```


    To my mind, the scary addition in this example is the `-sh-exec` option, which
    executes a new shell command when Luis receives data. Imagine the damage that
    you can cause with such an option, being able to launch any shell command. In
    this example, when Luis receives a connection, he spawns a new netcat instance
    and handles both the inputs and outputs of Lionel and Neymar''s communications.
    It''s very sophisticated.


    Here is a port-forwarding example from the documentation, dealing with HTTP again,
    where you execute a shell command to forward traffic:


    ```

    # ncat -l locahost 80 --sh-exec "ncat www.chrisbinnie.tld 8100"

    ```


    You simply forward data destined for TCP port 80 on your local machine to another
    host on TCP port 8100.


    ## Secure Communications


    I mentioned SSL earlier and how netcat can even interact with encrypted traffic,
    even though it''s a worrying possibility to consider. I''ll start this section
    with an example of how netcat can encrypt its own traffic. You use the `-C` switch
    again (sometimes called connect mode):


    ```

    # ncat -C --ssl ssl.chrisbinnie.tld 443

    ```


    Here you''re assuming that your trusted machine, `ssl.chrisbinnie.tld`, is running
    an SSL server on TCP port 443 and you can therefore connect to it. Surprisingly,
    even for SSL servers that use certificates for authentication, the mighty netcat
    can be very useful.


    You simply point netcat at the location of your PEM certificate and private key
    files, using the `--ssl-cert` and `--ssl-key` options respectively within the
    command. You can point both options at the same file if you like.


    One important factor when exchanging certificates, along with encrypting communications,
    is the act of confirming (via a third-party service''s stamp of approval) that
    the SSL server''s identity is valid. Netcat is able to service such a request
    by using this command:


    ```

    # ncat -C --ssl-verify ssl.chrisbinnie.tld 443

    ```


    According to the documentation, netcat is able to check against SSL certificates
    as follows:


    > Verification is done using the ca-bundle.crt certificate bundle shipped with
    Ncat, plus whatever trusted certificates the operating system may provide. If
    you want to verify a connection to a server whose certificate isn''t signed by
    one of the default certification authorities, use the --ssl-trustfile to name
    a file containing certificates you trust. The file must be in PEM format.


    [`https://nmap.org/ncat/guide/ncat-ssl.html`](https://nmap.org/ncat/guide/ncat-ssl.html)


    The docs continue and offer the correct syntax for an SSL command as follows:


    ```

    # ncat -C --ssl-verify --ssl-trustfile <custom-certs.pem> <server> 443

    ```


    Now that you can confirm which machine you are connecting to, let''s look at another
    SSL function that is available to netcat. It has many applications, as you''ll
    see when you explore it further.


    This function is referred to as having the ability to “unwrap” SSL. The documentation
    suggests that if you''re trying to collect e-mail from an SSL-enabled mail server
    but you don''t have SSL capabilities available in your mail client, then netcat
    can assist.


    You begin by pointing the aforementioned mail client at your localhost, your local
    machine, or IP address `127.0.0.1`. With netcat listening locally on TCP port
    143 (the port commonly used for unencrypted IMAP communications), you can then
    forward your traffic to the encrypted port on your mail server, TCP port 993,
    as follows:


    ```

    # ncat -l localhost 143 --sh-exec "ncat --ssl mail.chrisbinnie.tld 993"

    ```


    You can use this method for any protocol that uses two hosts, but HTTP, for example,
    won''t necessarily work well when multiple hosts are involved.


    Netcat can even act as an SSL server. You need to supply a certificate that, in
    a reversal to the previous example, might be verified by visiting clients.


    Without specifying a certificate file and a private key — and using the same options
    as before (`--ssl-cert` and `--ssl-key`) — netcat will automatically generate
    them for you. You can start netcat by using the `-l` option (or its `--listen`
    equivalent) as follows:


    ```

    # ncat -v --listen –ssl

    ```


    As you can see in [Figure 3.1](#c03.xhtml_c03-fig-0), Netcat automatically generates
    temporary key.


    ![Illustration depicting the generation of temporary SSL by Netcat.](images/c03f001.jpg)


    ## Executables


    Along with dealing with encryption, you can also execute a command on the shell
    upon receiving a connection. Needless to say, you must always consider the potentially
    disastrous security implications of running these commands.


    The first (worrying) executable example you''ll look at is the Bash shell itself.
    It''s not difficult to launch, which is very concerning. I have already mentioned
    that breaking into a server and leaving an alternative way of accessing later
    is possible with netcat. With ncat you don''t even need to be root to open up
    a shell. Try it yourself.


    On your listening machine (Luis), whose shell you will open up to the world, you
    run this command:


    ```

    Luis> # ncat --exec "/bin/bash" -l 1234 --keep-open

    ```


    And in your familiar connect-to style (Lionel), you simply run this command:


    ```

    Lionel> # ncat Luis 1234

    ```


    The first time you connect to TCP port 1234, you might suspect that the Bash shell
    hasn''t been spawned. However, try typing any valid Bash command, such as requesting
    a directory listing:


    ```

    # ls

    ```


    You will see Luis''s current directory, but on Lionel''s console, which should
    concern you. Type commands very carefully, as you won''t get all the usual Bash
    feedback that you''re used to, and file deletion and command execution is easy.


    The highly popular and powerful security tool called Metasploit takes this functionality
    one step further, making the backdoor persistent. Even if you don''t install Metasploit
    and further your knowledge, it''s well worth reading this web page about using
    netcat on a Windows machine: [`https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/`](https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/).
    You can see from reading this web page that it''s relatively easy to write changes
    to the Windows registry and the firewall rules by following the included instructions.

