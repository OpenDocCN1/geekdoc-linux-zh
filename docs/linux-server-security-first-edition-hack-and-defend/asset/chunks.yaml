    正如你所见的，反过来，Lionel 将他的长型文件传递给 Luis，然后 Luis 将两个 `netcat` 命令链在一起，以便将文件转发到 Neymar。这个三三角关系配合得很好，特别是当
    Luis 因为防火墙或路由问题无法直接与 Neymar 通信时。


    然而，文档确实指出了这种场景下的一个问题。问题在于 Neymar 无法回与 Lionel 通信。正如你对强大的 `netcat` 所预期的那样，这有一个解决办法。当我看到这个例子时，我立刻想到了为了恶意目的而部署的利用程序。（我相信你稍后就会明白为什么了）。现在看下面这命令：


    ```

    Neymar> # ncat -l 1234 > newlog.log

    Luis> # ncat -l 1234 --sh-exec "ncat Neymar 1234"

    Lionel> # ncat --send-only Luis 1234 < logfile.log

    ```


    在我看来，这个例子中可怕的补充是 `-sh-exec` 选项，它会在 Luis 接收到数据时执行一个新的 shell 命令。想象一下使用这种选项可以造成的任何破坏，它可以启动任何
    shell 命令。在这个例子中，当 Luis 接收到连接时，他产生一个新的 netcat 实例，并处理来自 Lionel 和 Neymar 通信的输入和输出。这非常复杂。


    这里是文档中的一个端口转发示例，再次处理 HTTP，你在其中执行一个 shell 命令来转发流量：


    ```

    # ncat -l locahost 80 --sh-exec "ncat www.chrisbinnie.tld 8100"

    ```


    你只需将目标为本地机器 TCP 端口 80 的数据转发到另一个在 TCP 端口 8100 上的主机即可。


    ## 安全通信


    我之前提到了 SSL，以及 `netcat` 甚至可以与加密流量交互，尽管这是一个值得考虑的担忧可能性。我将从一个 `netcat` 如何加密其自身的流量的示例开始本节。你再次使用
    `-C` 开关（有时称为连接模式）：


    ```

    # ncat -C --ssl ssl.chrisbinnie.tld 443

    ```


    在这里，你假设你可信的机器 `ssl.chrisbinnie.tld` 在 TCP 端口 443 上运行着 SSL 服务器，因此你可以连接到它。令人惊讶的是，即使对于使用证书进行验证的
    SSL 服务器，强大的 `netcat` 也可以非常有用。


    你只需在命令中使用 `--ssl-cert` 和 `--ssl-key` 选项分别将 `netcat` 指向你的 PEM 证书和私钥文件的位置。如果你喜欢，可以将这两个选项都指向同一个文件。


    在交换证书以及进行加密通信时，一个重要因素是确认（通过第三方服务的认可标记）SSL 服务器的身份是有效的。`netcat` 能够通过使用此命令处理此类请求：


    ```

    # ncat -C --ssl-verify ssl.chrisbinnie.tld 443

    ```


    根据文档，`netcat` 能够以如下方式检查 SSL 证书：


    > 验证是使用与 Ncat 附带的 ca-bundle.crt 证书包完成的，外加上操作系统可能提供的任何信任证书。如果你想验证到一个证书未由默认认证机构之一签名的服务器的连接，请使用
    --ssl-trustfile 来命名一个包含你信任的证书的文件。该文件必须是 PEM 格式。


    [`https://nmap.org/ncat/guide/ncat-ssl.html`](https://nmap.org/ncat/guide/ncat-ssl.html)


    文档继续写并提供了 SSL 命令的正确语法如下：


    ```

    # ncat -C --ssl-verify --ssl-trustfile <custom-certs.pem> <server> 443

    ```


    现在你已经确认了正在连接到哪台机器，让我们看看 `netcat` 可用的另一个 SSL 功能。它有许多应用，正如当你进一步探索它时会看到的那样。


    这个功能被认为具有“解开”（unwrap）SSL 的能力。文档建议，如果你正尝试从一个启用 SSL 的邮件服务器收集电子邮件，但你的邮件客户端没有可用的 SSL
    功能，那么 `netcat` 可以提供帮助。


    你首先将上述邮件客户端指向你的 `localhost`、你的本地机器或 IP 地址 `127.0.0.1`。当 `netcat` 在本地监听 TCP 端口
    143（（通常用于未加密 IMAP 通信的端口）时，你可以按照如下方式将你的流量转发到邮件服务器上的加密端口 TCP 端口 993：


    ```

    # ncat -l localhost 143 --sh-exec "ncat --ssl mail.chrisbinnie.tld 993"

    ```


    你可以将此方法用于使用两个主机的任何协议，但例如 HTTP，在涉及多个主机时并不一定能良好工作。


    `netcat` 甚至可以充当 SSL 服务器。你需要提供一个证书，与之前的示例相反，该证书可能会被访问的客户端验证。


    在不指定证书文件和私钥的情况下——使用之前相同的选项（`--ssl-cert` 和 `--ssl-key`）——`netcat` 会自动为你生成它们。你可以使用
    `-l` 选项（或其等效的 `--listen`）如下启动 `netcat`：


    ```

    # ncat -v --listen –ssl

    ```


    正如你在图 3.1 中所示，Netcat 自动生成了临时密钥。


    ![描述 Netcat 生成临时 SSL 的插图](img/c03f001.jpg)


    ## 执行文件


    除了处理加密之外，你可以在接收到连接时在 shell 上执行命令。不用说，你必须始终考虑运行这些命令的潜在灾难性影响。


    我们将看到的第一个（令人担忧的）执行文件示例是 Bash shell 本。它很容易启动，这非常令人担心。我已经提到过可以使用 netcat 进入服务器并留下另一种访问方式。使用
    ncat 你甚至不需要 root 权限就可以打开 shell。试一下。


    在你的监听机器（向世界打开 shell 的 Luis）上，运行此命令：


    ```

    Luis> # ncat --exec "/bin/bash" -l 1234 --keep-open

    ```


    在你熟悉的连接风格（Lionel）中，只需运行此命令：


    ```

    Lionel> # ncat Luis 1234

    ```


    当你第一次连接到 TCP 端口 1234 时，你可能怀疑 shell 尚未生成。然而，尝试任何有效的 Bash 命令，例如请求目录列表：


    ```

    # ls

    ```


    你将看到 Luis 的当前目录，但在 Lionel 的控制台上，这应该让你担心。输入命令要非常小心，因为你不会得到习惯的所有典型 Bash 反馈，而且删除文件和执行命令非常容易。


    名为 Metasploit 的广受欢迎且强大的安全工具将此功能更进一步，使后门持久化。即使你不安装 Metasploit 并深入研究，阅读这篇关于在 Windows
    机器上使用 netcat 的网页也是值得的：[`https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/`](https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/)。


