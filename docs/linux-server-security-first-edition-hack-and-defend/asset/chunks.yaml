  trans: "\n\n一种监控文件系统变化的现代方法是使用 `inotify`。你需要兼容的内核来使此功能正常工作。不用担心，据报道 `inotify` 已经包含在\
    \ 2.6.13 及之后的版本的内核中，因此大多数 Linux 发行版都具备此能力。\n\n复杂的 `inotify` 可以实时监控单个文件和整个目录的变化，一旦发现任何更改，就会向配置的软件报警。如果发现某个用户态软件正在进行更改，`inotify`\
    \ 将其视为一个事件并立即报告。\n\n通过创建监听列表，`inotify` 可以跟踪唯一的监听描述符（watch descriptors），并将其与监听列表中的每个项关联。尽管\
    \ `inotify` 不会传递关于更改文件或目录的用户或进程的详细信息，但发生变化这一事实已足够满足大多数应用程序的需求。如果无法使用 `inotify`，通常需要采用旧的轮询文件系统或手动扫描的方法。在检查网络文件系统的变化的情况下，任何配置的软件将需要使用预定的频率对文件系统进行轮询。这是因为远程文件系统很难追踪。\n\
    \n遗憾的是，包括 `/proc`、`/sys` 和 `/dev/pts` 在内的伪文件系统对 `inotify` 是不可见的。然而，这不需要太担心，因为这些路径中不存在“真实”文件，而是系统频繁变化的瞬时运行机制。\n\
    \n### 安装\n\n现在让我们来看看如何在 Debian 和 Red Hat 衍生版上安装 LMD。首先，你将在 Red Hat 上通过以下命令检查是否安装了\
    \ `wget` 包：\n\n```\n# yum install wget\n```\n\nDebian 上的替代方案是以下命令：\n\n```bash\n\
    # apt-get install wget\n```\n\n许多发行版默认包含了 `wget`，因此可能不需要执行此操作。\n\n为了充分发挥 LMD 的作用，如果你想让\
    \ LMD 直接与 `inotify` 交互，还可以安装 `inotify-tools`；你可以从 [`https://github.com/rvoicilas/inotify-tools/wiki`](https://github.com/rvoicilas/inotify-tools/wiki)\
    \ 阅读更多信息并下载 `inotify-tools`。\n\n不过，如果你想从包管理器安装它，并且幸运地正在使用 Red Hat 的后代版本，可以使用以下命令：\n\
    \n```bash\n# yum install inotify-tools\n```\n\n对于遵循 Debian 系的机器，你应该能够运行以下命令：\n\
    \n```bash\n# apt-get install inotify-tools\n```\n\n如果这在你的 Debian 发行版上不起作用，请尝试以下步骤。我知道这是有效的，因为我曾看看\
    \ LMD 在 Ubuntu 14.04 LTS 上安装有多简单。我需要添加 Universe 存储库，以便将 `inotify-tools` 包成功安装到我的\
    \ `/etc/apt/sources.list` 文件中，如下：\n\n```\ndeb http://us.archive.ubuntu.com/ubuntu\
    \ trusty main universe\n```\n\n如果你运行的是其他发行版，可以将“trusty”替换为“precise”或其他 Ubuntu\
    \ 版本代号。然后你可以使用以下命令更新包列表：\n\n```bash\n# apt-get update\n```\n\n最后，最后的 Ubuntu 命令简单如下：\n\
    \n```bash\n# apt-get install inotify-tools\n```\n\n我将让你以同样的方式尝试 Debian 存储库（将“trusty”替换为你的\
    \ Debian 版本名称）。\n\n由于截至本文，包存储库中尚未找到 LMD 包本身，你可以按照以下方式下载并安装该包：\n\n```\n# cd /usr/local/src/\n\
    # wget http://www.rfxn.com/downloads/maldetect-current.tar.gz\n# tar -xzf maldetect-current.tar.gz\n\
    # cd maldetect-*\n# sh ./install.sh\n```\n\n一旦你运行了 `install.sh` 脚本（如这些命令的最后一行所示），你应该看到包含以下内容的输出：\n\
    \n```\nLinux Malware Detect v1.5\n            (C) 2002-2015, R-fx Networks <proj@r-fx.org>\n\
    \            (C) 2015, Ryan MacDonald <ryan@r-fx.org>\nThis program may be freely\
    \ redistributed under the terms of the GNU GPL\ninstallation completed to /usr/local/maldetect\n\
    config file: /usr/local/maldetect/conf.maldet\nexec file: /usr/local/maldetect/maldet\n\
    exec link: /usr/local/sbin/maldet\nexec link: /usr/local/sbin/lmd\ncron.daily:\
    \ /etc/cron.daily/maldet\nmaldet(6617): {sigup} performing signature update check…\n\
    maldet(6617): {sigup} local signature set is version 2015112028602\nmaldet(6617):\
    \ {sigup} latest signature set already installed\n```\n\n当然，如果你编辑了 `install.sh`\
    \ 脚本（特别是 `inspath` 变量），你选择的安装路径可能会不同。正如你看到的，你还会收到关于你的 LMD 签名更新程度的说明。\n\n### 监控模式\n\
    \n现在你已经安装了包，让我们 LMD 能在系统上为你监控什么。一个很好的开始是考虑 LMD 的监控模式。\n\nLMD 提供了多种可以配置的监控模式。如你所见，LMD\
    \ 还提供了关于你的 LMD 签名更新程度的说明。\n\n## 配置\n\nLMD 的主配置文件是 `/usr/local/maldetect/conf.maldet`。它有详细的注释，有助于理解\
    \ LMD 偏好的设置方式。\n\n在继续之前，有一个警告：LMD 配置文件不使用星号（*）作为通配符，而是使用问号（?）。因此，你应该使用 `?` 代替\
    \ `*` 来替换多个字符。除了这个微小的注意事项，其他操作相对顺畅。\n\n### 排除\n\n让我们看看如何设置 LMD。文档首先要求你考虑想要忽略的系统元素。与你刚刚看到的监控模式风格相似，你可以通过填充某些文件来实现这一目标。以下文件中的每个条目都应单独占一行。\n\
    \n你可以将不想让 LMD 检查的完整文件路径添加到此文件中：`/usr/local/maldetect/ignore_paths`。\n\n你也可以通过在该文件中放入类似\
    \ `.jpg` 的条目来全局排除特定的文件扩展：`/usr/local/maldetect/ignore_file_ext`。\n\n出于某种原因，某些\
    \ LMD 签名可能会导致不必要且无用的日志记录和告警。你可以通过在该文件中添加签名（例如 `php.mailer.10hack`）来禁用某些签名：`/usr/local/maldetect/ignore_sigs`。\n\
    \n最后一种排除选项意味着你可以使用复杂的正则表达式（regex）一次性匹配多个文件系统路径。你只需要在 `/usr/local/maldetect/ignore_inotify`\
    \ 文件中添加列表，其格式如下：\n\n```\n ∧/home/premium-user-$\n```\n\n"
- fmt: '

    Clearly, by using regex, the file-matching possibilities are endless, and it can
    be used to avoid making manual changes to your config whenever a new user is allowed
    to log in to your server. This regex example hopefully points out that you could
    name a specific set of users with a username format along the lines of `premium-user-123456`.


    ## Running from the CLI


    The Command Line Interface (CLI) options for LMD are well considered and relatively
    easy to follow. I will leave you to explore all of them, but you will look at
    some of the key options now.


    As I have already mentioned, the executable binary for LMD is called `maldet`.
    Let''s begin by running LMD in the background while it checks a particular filesystem
    path. You can see from this example in the documentation how to run potentially
    large scans in the background as follows, using `-b`:


    ```

    # maldet -b -r /home/?/public_html 7

    ```


    In this example, `-b` is used for background scanning and checking files that
    have been changed or modified in the last seven days, set by the `7` character
    being appended. The syntax and optional way of running this command is `--scan-recent
    PATH DAYS`.


    ## Reporting


    Let''s have a quick look at how LMD generates its reports. [Figure 8.4](#c08.xhtml_c08-fig-0004)
    shows a produced report.


    ![Display of a report of a scan from LMD using the maldet —report command.](images/c08f004.jpg)


    [Figure 8.4](#c08.xhtml_c08-fig-anc-0004) A report of a scan from LMD using the
    maldet --report command


    To query specific reports, you need a `SCANID`. This is a unique reference that
    can be seen near the top of [Figure 8.4](#c08.xhtml_c08-fig-0004), where this
    command runs to give you a report on the last LMD command that was run:


    ```

    # maldet --report

    ```


    Once you have that ID, you can also manually e-mail the report to yourself as
    follows:


    ```

    # maldet -e, --report SCANID chris@binnie.tld

    ```


    To query a specific `SCANID`, with a formatted time stamp included within its
    name (`010116` as the date in this example, and the rest of the name being the
    time), your command might look like this:


    ```

    # maldet --report 010116-1111.21212

    ```


    These options might also be helpful if used with the `--log` or `-l` option:


    ```

    # maldet --log

    ```


    You should see LMD logging events by running this command. In my case, despite
    having only run a few commands so far, there is a relatively substantial amount
    of detail on my log file. With that command, you are shown the last fifty lines
    from the file `/usr/local/maldetect/logs/event_log`. You can query that file further
    if you need to discover information not found in those 50 lines. In my opinion,
    the level of detail logged by LMD is another indication of a sophisticated, well-written
    package.


    ## Quarantining and Cleaning


    The documentation makes a point of saying that by default, LMD will not act when
    it finds evil-looking files. It is therefore important to understand that, in
    most cases, you need to quarantine your malware manually.


    If you''re certain that you want to enable automatic quarantining, then it''s
    possible to do so by setting the configuration option `quar_hits=1` within the
    main config file, which resides at `/usr/local/maldetect/conf.maldet` by default.


    If you wanted to quarantine all malware from a specific scan, then you would use
    the `-q` option, which is also the same as `--quarantine SCANID`, as follows:


    ```

    # maldet -q 010116-1111.21212

    ```


    If you feel that you''ve made a mistake, then you can restore quarantined files
    from a specific `SCANID` by using the following command, which is the same as
    the `--restore` function:


    ```

    # maldet -s 010116-1111.21212

    ```


    You will see an error such as this one if there''s nothing to restore:


    ```

    maldet(18748): {restore} could not find a valid hit list to restore.

    ```


    If you want LMD to try to fix malware infections that it discovers, then you can
    use the `--clean` command, which is also written as the `-n` option. Here is an
    example command of cleaning malware that you found in a particular `SCANID`:


    ```

    # maldet -n 010116-1111.21212

    ```


    For a cleaning to be considered a success, the resulting scan after cleaning a
    malware infection must pass without registering a HIT of a problem file.


    If you begin to doubt results or you''re not sure that your config changes have
    been picked up correctly, then you can purge all of your existing session data,
    logs, and temporary files with the following command:


    ```

    # maldet -p

    ```


    The result should be similar to this output:


    ```

    maldet(19219): {glob} logs and quarantine data cleared by user request (-p)

    ```


    ## Updating LMD


    As I said from the outset, the updating of LMD''s signatures is of paramount importance.
    To manually update, you use the `-u` command. If you''re wondering, you use the
    `--update` option, as follows:


    ```

    # maldet -u

    ```


    The expected output would be similar to this:


    ```

    maldet(19278): {sigup} checking available updates

    maldet(19278): {sigup} hashing files and checking

    maldet(19278): {sigup} latest version 201511

    ```


    There is also a clever mechanism for updating the currently installed, as follows:


    ```

    # maldet --update

    ```


    ## Scanning and Stopping Scans


    In [Figure 8.1](#c08.xhtml_c08-fig-0001) you saw the results of monitoring a path
    with the `-m` or `--monitor` option. Let''s expand on that for a moment. Imagine
    that you want to monitor two filesystem partitions, you would monitor the paths
    as follows:


    ```

    # maldet -m /usr/local,/home

    ```


    Note the comma that is separating the paths. The output for this command is shown
    in [Figure 8.5](#c08.xhtml_c08-fig-0004). Remember that large scans can use the
    `-b` option, as you saw earlier.


    Let''s consider how to manually scan a directory and its subdirectories without
    using background mode. Imagine you have users uploading files via FTP or SFTP
    to an upload directory:


    ```

    # maldet -a /home/?/uploads

    ```


    In this example, you use LMD to scan the `uploads` directory for all users with
    a home directory (remember that the question mark is the wildcard character in
    LMD, not the asterisk).


    Having run the scanning command, you are also offered a `SCANID` for future reference,
    as you can see from the data it generates:


    ```

    maldet(28566): {scan} scan of /home/*/uploads (1 files) in progress…

    maldet(28566): {scan} 1111/1111 files scanned: 0 hits 0 cleaned

    maldet(28566): {scan} scan completed on /home/*/uploads: files 1111, malware hits
    0, cleaned hits 0, time 11s

    maldet(28566): {scan} scan report saved, to view run: maldet --report 151212-1724.28566

    ```


    If any of your scans take longer than expected, then LMD can accommodate this
    scenario too. The kill switch or `-k` option (also written as `--kill`) will stop
    any inotify instance in its tracks. If machine load is too high or you think something
    isn''t behaving as it should, then this is a useful addition to the available
    options.


    ## Cron Job

