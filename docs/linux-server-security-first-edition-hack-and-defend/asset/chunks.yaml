    ### [Chapter 7]: Nmap''s Prodigious NSE

    Many users will have used Nmap for simple port scans, but few know that the security
    tool includes the ability to exploit remote machines too. We explore just some
    of the many possibilities starting with the plethora of scripts that Nmap ships
    with by default.


    ### [Chapter 8]: Malware Malware Detection

    A sometimes entirely silent threat that has plagued Windows systems for years
    comes in the form of illegitimately installed software. The damage that can be
    done to a system by malware ranges from annoying pop-up windows to full-fledged
    online banking compromises. In this chapter we learn how to deploy a sophisticated,
    frequently updated anti-malware solution on Linux.


    ### [Chapter 9]: Password Cracking with Hashcat

    Technical professionals might be alarmed to discover that one password-cracking
    tool all but guarantees that it can crack a hashed password. This means that if
    access to your hashed password is gained illegitimately, then it''s just a matter
    of time before an attacker can see your password in plain text. This chapter walks
    you through the process, step by step.


    ### [Chapter 10]: SQL Injection Attacks

    In one prominent survey, SQL injection attacks were listed as the most prevalent
    online attack. Despite the fact that this type of attack dates back to the late
    1990s, even today a frighteningly large number of such attacks successfully exploit
    websites belonging to enterprises and key online services through poor programming
    practices. This chapter offers some useful historical information along with step-by-step
    instructions on how to identify and exploit vulnerable online services.


    ## Who Should Read This Book


    This book was written for mid-level admins, software hackers, and other IT professionals.
    It is however, hopefully, written in such a way that anyone who is curious will
    be able to quickly discern which sections are suitable for those interested in
    security but don''t necessarily have a strong understanding of the Linux command
    line. The aim is that some readers will go on to research a specific chapter''s
    subject matter in greater detail to help bolster their knowledge on that subject
    further, while other areas will be of less interest to their needs and potentially
    used for referencing at a later date.


    In other words there is no difference in the levels of experience required on
    a per-chapter basis, although those chapters that focus more heavily on the command
    line may require greater effort for a novice.


    ## Summary


    Let''s hope that by increasing your understanding of a hacker''s tools and mind-set,
    and staying on top of the latest security developments, you are not subjected
    to an all-too-common realization these days: that you no longer have control of
    your own systems or networks, but somebody else does.


    # Chapter 1


    ## Invisibility Cloak


    Imagine that you could hide a server from the Internet but still have access to
    your ISP''s superior bandwidth. Without making any changes, you would be able
    to securely use it as a file repository, among many other things.


    You''d also have full access to the command line so that you could start and stop
    or even install any services that you wanted to use. The choice would be yours,
    whether you ran those services briefly and then closed them down, or left them
    running and visible to the outside world for a period of time.


    This is possible to achieve using a technique called port knocking. You can disguise
    your server by closing all network ports to the outside world, genuinely making
    it invisible. The single port that you might choose to open up at will, by using
    a prearranged “door-knock,” could be for your SSH server or for some other service.
    In this chapter, you''ll see how you can create an invisible server along with
    some options that you might want to consider.


    ## Background


    By disguising the very existence of a server on the Internet, at best you can
    run a machine in private, and at worst, even if its existence is known, you will
    reduce the attack surface that an attacker can target by limiting the time ports
    are open and even partially visible.


    ### Probing Ports


    Before beginning, let''s take a closer look at network ports on a server, so you''ll
    have a frame of reference. If you''ve ever used security tools such as `Nmap`,
    then you may be familiar with the initially confusing premise that some ports
    appear to be closed when in fact they are not. `Nmap` makes the distinction between
    whether a nonopen port has a service (a daemon) listening behind it or not.


    `Nmap` refers to closed ports as those that don''t have a daemon listening behind
    them but do appear to be open or at least potentially available. If `Nmap` refers
    to filtered ports, it means that a firewall of some kind is preventing access
    to the IP address that is scanning the system in question. This is partly to do
    with `TCP RST` packets, and there are also three other states that `Nmap` reports
    back on: unfiltered, `open|filtered`, and `closed|filtered`. If you want more
    information on how these states are different, go to [`https://nmap.org/book/man-port-scanning-basics.html`](https://nmap.org/book/man-port-scanning-basics.html).


    ### Confusing a Port Scanner


    Now that you know how ports may present themselves to port scanners, let''s look
    at how to obfuscate the response you give back in order to confuse sophisticated
    port scanning techniques. The most obvious tool of choice, thanks to its powerful
    feature set, would be the kernel-based firewall `Netfilter`, more commonly known
    as `iptables`.


    Here''s how it works. For `TCP` packets, you want to manipulate how you respond
    to port probes by using `iptables` to generate a `REJECT` request. For other protocols
    you want to simply `DROP` the packets. This way, you get closed, not filtered,
    responses from `Nmap`. Based on what I''ve gathered from most online opinions
    (and it seems that this argument is contentious and changeable), a closed port
    is the best response that you can hope for.


    To explain a little further, under normal circumstances, an unreachable port would
    usually generate an `ICMP Port Unreachable` response. You don''t want these errors
    to be generated, however, because that would mean a server was listening on that
    port in the first place and you would give your server''s presence away. The tweaked
    `REJECT` response that you want to generate is applied as follows: `--reject-with
    reset`. This helps you to respond as if the port were unused and closed, and also
    not filtered.


    You simply append this snippet to the end of each of your iptables rules:


    ```

    -j REJECT---with reset

    ```


    By using this technique, you''re simply making sure you''re not giving away unnecessary
    information about your system.


    There is some debate about using `iptables` `DROP` versus `REJECT` responses in
    your rules.


    Note that in the port knocking example that you''re about to look at, you won''t
    be using that `iptables` option. This is because you won''t be running additional
    services to your SSH server. However, this background information will help you
    understand how an attacker might approach a machine''s ports and how you can apply
    a `--reject-with reset` option to other services.


    ## Installing knockd


    Now that you are armed with some useful background information, I''ll walk you
    through how to install a port knocker on your server. As we continue you might
    consider which services you may wish to run hidden from the Internet at large.


    ### Packages

