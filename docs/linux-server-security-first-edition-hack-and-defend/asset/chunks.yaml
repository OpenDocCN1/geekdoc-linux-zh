  trans: '

    非凡 NSE（Nmap 脚本引擎）在设计时考虑了几个核心功能。这些功能包括主要通过端口扫描进行网络发现、使用各种预定义特征进行进阶服务检测、漏洞检查（及利用），最后是后门检测。


    NSE 的强大在于其多功能性，正如其名称所示，它通过提供额外的脚本来扩展这一功能，而这些脚本可以任何人使用 Lua 编程语言来编写。要从命令行启动 NSE，你只需带有
    `--script=` 选项启动 `nmap` 二进制文件，或者使用 `-sC` 选项。


    以下是使用 `Nmap` 进行端口扫描的两个示例。第一个没有启用 NSE，第二个则开启了它。这应该对你有帮助，让你能够熟悉输出的差异。在列表 7.1 中，你看到了第一个命令的结果。请注意，这两个命令都不是以
    root 用户运行，而是以标准用户身份运行。


    然而，在列表 7.2 中，你看到 NSE 已被启用，在这里它添加了极具价值的见解。


    在列表 7.2 中，你可以看到来自 NSE 的额外输入。与列表 7.1 相比，你还会收到用于进一步研究发现的 URL、更详细的主机信息（在此例中为 SSH
    主机密钥），甚至还有 `Nmap` 认为无效的 HTML 注释。


    ##计时模板


    在列表 7.1 和 7.2 中，你通过使用 `-p0-1024` 选项请求了关于 0 到 1024 范围内的端口（Unix 类型系统上的特权、原始或超级用户端口）的信息。`-T4`
    选项并不是四秒的超时值，而是提供了一种调用 NSE 使用的特定计时模板的方法。设置越高，`Nmap` 运行越快，可用值范围从 0 到 5。


    计时模板的值非常重要，并可能影响你的情绪健康。这些从 0 到 5 的值代表偏执（paranoid）、狡猾（sneaky）、礼貌（polite）、正常（normal）、积极（aggressive）和疯狂（insane）。如果你觉得这些词更容易记忆，也可以用它们来代替数字。


    由于 NSE 包含了许多设置，主程序员意识到用户可能会迷失在这些复杂性中，因此引入了可能有帮助的模板。


    对使用 `Nmap` 如此重要的主要原因是，当你对许多主机、大型网络或多个网络运行 NSE 时，整个过程可能需要很长时间才能完成。你可能还会发现很少有趣的信息（因为防火墙配置得当），而且你的任务可能仍花费像永恒一样的时间完成。


    你可能会问，模板之间有什么区别？偏执和狡猾模板都提供了某种程度的规避入侵检测系统（IDS）检测的能力。礼貌模板减慢扫描过程，以限制连接两端使用的带宽以及目标机器的资源。`-T3`
    关实际上什么都没做；因为正常模板是默认设置且本身就是开启的。你在之前的示例中配合 `-T4` 关使用的激进模板将加速扫描过程，并更严格地测试相对高容量网络的限制。最后一个模板“疯狂”假设你愿意牺牲
    NSE 提供的结果的准确性来换取执行时间。如果你想使用此设置，你应该拥有一个高容量且可靠的网络。


    ## 脚本分类


    尽管采用了非常复杂的底层引擎，但 NSE 的设计如此周全，即使是新用户也能相对轻松地理解如何操作它。因此，可以迅速部署 NSE 而不需要预先进行大量的阅读。


    然而，为了避免操之过急，了解 NSE 如何指代它使用的不同脚本很有用。当你通过 NSE 运行脚本时，通常会在执行之前或执行期间进行端口扫描，以检查目标机器网络可用性的当前状态。许多
    NSE 脚本之间还有其他相似之处，例如 DNS 查询和路由追踪。


    在表 7.1 中，你可以看到 NSE 如何对其脚本进行分类；有许多不同的类别需要考虑。


    | **类别** | **描述** |

    | :--- | :--- |

    | auth | 这些脚本查看身份验证方法并绕过它们——例如，`x11-access`、`ftp-anon` 和 `oracle-enum-users`。brute
    类别用于暴力破解而非身份验证。 |

    | broadcast | 如果你需要在局域网上进行广播，请使用这组脚本。 |

    | brute | 对远程主机的身份凭据进行暴力破解，请使用此类脚本。针对不同协议有很多可用。 |

    | default | 如果使用 `-sC` 或 `-A` 选项，将执行默认脚本。要使用特定脚本，用 `--script=` 覆盖默认设置。 |

    | discovery | 为了跟踪谁和什么连接到了网络，这些脚本都是关于检查的例如公共注册表、启用 SNMP 的设备和目录服务。 |

    | dos | 如果你想测试漏洞或（谨慎地）运行可能导致服务崩溃的脚本，那么可以使用此集合。 |

    | exploit | 为了尝试利用以查看是否成功，这些脚本将准确执行。 |

    | external | 注意，在执行这些脚本时，你的操作可能会被其他方记录。这是因为该集合可能会。 |

    | fuzzer | 这些脚本通过向查询注入随机字段来搜索软件漏洞和安全漏洞。它们比其他技术花费长时间让服务器离线。 |

    | intrusive | 归入此类令人不快的类别，这些脚本运行风险很大，不会进入安全类别。某些风险包括崩溃、带宽饱和和被系统管理员发现。 |

    | malware | 已知恶意软件会留下系统痕迹，如后门或感染迹。恶意软件脚本会搜索异常端口和服务异常。 |

    | safe | 这组脚本不太可能干扰目标系统的管理员。尽管如此，你不应该完全依赖它们不会引起问题。 |

    | version | 你无法直接选择这些脚本，因为它们是 NSE 版本检测功能的扩展。如果使用了版本检测选项 `-sV`，它们就会执行。 |

    | vuln | 如果发现了漏洞，该集合将提醒你；否则不会产生什么噪音。示例有 `realvnc-auth-bypass` 和 `afp-path-vuln`。
    |


    ## 影响因素


    使用默认脚本集时，你可能会对强大的 NSE 如何做出决定感到惊讶。并没有固定的阈值；相反，它在运行以下标准后得出分数。


    *   *速度* —— 默认扫描必须快速完成，例如，不采用暴力破解。

    *   *实用性* —— 如果脚本没有产生实用的结果，那么你可以忘记将其包含在默认脚本中。

    *   *详细性* —— 运行脚本得到的输出需要是简洁的。同样，当无须报告时，沉默是美德。

    *   *可靠性* —— 在某些脚本的操作期间，不可避免地会假设和猜测。然而，如果频繁出现错误，那么它就不应该出现在默认类别中。


    '
- fmt: '

    - **Intrusiveness** — if a script causes armed guards to suddenly appear, then
    it''s probably too intrusive for the default set of scripts.

    - **Privacy** — along the same line as the external set of scripts, the default
    scripts need to respect your privacy and not reveal your presence.


    ## Security Holes


    Now that you''ve looked at the multitude of NSE''s script categories and you also
    appreciate what running the default set of scripts means, let''s look at performing
    some penetration testing using your new-found knowledge and the abundance of bundled
    scripts that come with Nmap as standard.


    Let''s first run a vulnerability check on your local machine as follows:


    ```

    # nmap --script vuln localhost

    ```


    In [Listing 7.3](#c07.xhtml_c07_lit_3) you can see the output from that command,
    noting that you only engaged the vulnerability scripts using the `vuln` option.


    The results in [Listing 7.3](#c07.xhtml_c07_lit_3) immediately caught my interest
    when I saw “Potentially interesting folder” for the RPC service. Of course, it''s
    possible that only my local machine can query the `/icons/` folder to which it
    is referring, but there''s also a chance that this needs to be looked into (and
    relatively urgently). You might firewall off TCP port 111 entirely or shut down
    the service to remedy such a find unless you''re aware of config rules limiting
    access to RPC.


    Rather than hunting for config files, my first test to remedy this issue would
    be to use netcat to query TCP port 111 from another machine to see if it responds.
    (The more modern `ncat`, also written by the Nmap Project, is my preferred version,
    or if that''s unavailable, the `telnet` command.)


    Incidentally, if NSE identifies a known vulnerability, then you would hopefully
    receive a patch ID for Windows servers or some other relevant URL so that you
    could research it further. This can save time researching exploits via online
    searching. There''s a good chance that if NSE flags a positive, then a few different
    tests have been satisfied to reach that conclusion, and unlike some other tools,
    you shouldn''t dismiss its findings without checking them first.


    ## Authentication Checks


    Let''s consider what the results would be if someone else ran Nmap''s NSE against
    my local machine, looking for authentication issues. Clearly my local machine
    has looser permissions (when speaking to itself and not a remote host), but this
    way of testing still has educational merit. The following command does exactly
    that and looks for `auth` script hits:


    ```

    # nmap --script auth localhost

    ```


    The results of this command reveal some of the tests that NSE has run, as you
    can see in [Listing 7.4](#c07.xhtml_c07_lit_4).


    Looking at the results displayed underneath the port numbers in [Listing 7.4](#c07.xhtml_c07_lit_4),
    you can see that Nmap clearly wants some more information (from varying inputs)
    and has generated three ERROR messages in the meantime. You might see some user
    accounts that NSE has discovered, displayed under a section such as “Host script
    results” at the end of such an output if usernames were gleaned from executing
    such a request, for example, against a Windows domain.


    ## Discovery


    Consider the following command, to provide you with more information about a host:


    ```

    # nmap --script discovery localhost

    ```


    In [Listing 7.5](#c07.xhtml_c07_lit_5) you are blessed with the ability to retrieve
    HTTP headers, SMTP banners, and RPC issues, among other things, via the discovery
    scripts. Although the SMTP error “Server is an open relay (16/16 tests)” is present,
    it''s likely a false positive but definitely worth checking so that you''re certain.


    With all of these included features, this mode is highly useful and represents
    a key part of NSE''s functionality. After all, you can''t exploit services without
    knowing they exist. From the results generated by NSE, it is safe to say that,
    when it comes to discovering machines and services, information is power. The
    sophisticated NSE doesn''t bombard you with too much detail, however, just enough
    to be useful.


    The negative impact of running scripts by category is that it can slightly reduce
    performance if you include all the scripts in a category. However, it does mean
    that you''re not relying on the scoring system used by the default set of scripts
    or executing all the scripts available to a template type. You can be much more
    focused if you''re just looking for a specific type of information, however.


    ## Updating Scripts


    As you might imagine, the custom scripts written for NSE using the Lua language
    are frequently improved and augmented. If you want to update your NSE scripts,
    you can do so selectively by downloading and copying them into a directory, similar
    to this path, on Unix-type systems:


    ```

    /usr/share/nmap/scripts

    ```


    If you add or remove scripts from the `scripts` directory or if you have changed
    a script''s category, then you need to run the following command (as the root
    user) afterwards:


    ```

    # nmap --script-updatedb

    ```


    The output will hopefully be something like this:


    ```

    Starting Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT

    NSE: Updating rule database.

    NSE: Script Database updated successfully.

    Nmap done: 0 IP addresses (0 hosts up) scanned in 0.14 seconds

    ```


    To download scripts from the Nmap website, you can click the Scripts link in the
    Categories panel at [`https://nmap.org/nsedoc/`](https://nmap.org/nsedoc/).


    ## Script Type


    It is worth mentioning that within the underlying infrastructure of NSE, there
    are four supported script types:


    - **Prrule scripts**: as you''d guess, these are run at the start before any scanning
    begins. For example, you might perform reverse DNS lookups on a list of addresses.

    - **Host scripts**: during scanning processes (that is, after port scanning, version
    detection, and operating system detection), these scripts are run on the target.

    - **Service scripts**: if NSE identifies a service, it can then execute these
    scripts against it. For example, there are more than 15 HTTP scripts.

    - **Postrule scripts**: these are run once NSE has finished its tasks, and they
    tend to concentrate on how results are output.


    The comprehensive Nmap documentation (found at [`https://nmap.org`](https://nmap.org))
    makes the point of explaining that any scripts could potentially run as either
    a prerule or postrule script. In those cases, we recommend using a prerule for
    consistency.


    ## Regular Expressions


    The clever command line with which NSE is familiar can also cope with regular
    expressions (regex). For example, I mentioned the 15 HTTP scripts; to trigger
    all of these scripts in one run, you might run a command against a target web
    server such as:


    ```

    # nmap --script "http-*"

    ```


    You can also make Boolean decisions as follows (just as you''d expect with regex):


    ```

    # nmap --script "default or safe"

    ```


    Hopefully this command is easy enough to understand. The documentation also presents
    this more complex example:


    ```

    # nmap --script "(default or safe or intrusive) and not http-*"

    ```


    Here you can see that you want to enable the default, safe, and intrusive script
    categories, but not those that deal with web servers.


    ## Graphical User Interfaces


    As an aside, you can also save the output (which if it''s lengthy would usually
    scroll rapidly up your console) to file in the usual way, as you can in this example,
    Unix-style:


    ```

    # nmap -sC -p0-1024 -T4 localhost > /home/chrisbinnie/output.txt

    ```


    However, the NSE way to save the output is as follows, outputting to plain text:


    ```

    # nmap -T5 localhost -o outputfile.txt

    ```


    You can also output information to XML as follows:

    '
