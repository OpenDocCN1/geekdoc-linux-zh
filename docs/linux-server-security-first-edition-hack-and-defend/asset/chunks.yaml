- fmt: "\n| nmap | This is the package that you need if you want to use Nmap's `ncat`\
    \ on Debian/Ubuntu. |\n\n`Table 3.1`](#c03.xhtml_c03-tbl-anc-0001) Debian and\
    \ Ubuntu Package Names\n\n```\n# yum install netcat\n```\n\nAnd for the Nmap Project's\
    \ `ncat`, you might try this package:\n\n```\n# yum install nmap-ncat\n```\n\n\
    I suspect that installing a package and then making sure you are reading the correct\
    \ main page for that package (in case two versions of `netcat` are installed on\
    \ the same machine) will prove successful.\n\nTo avoid confusion, I will be focusing\
    \ on `ncat` (and the `ncat` command) as opposed to `netcat` (and therefore the\
    \ `nc` command). I'll refer to `ncat` and `netcat` interchangeably from now on\
    \ — or, of course, just `ncat` if further clarity is needed.\n\n### Getting Started\n\
    \nLet's see what the twenty-first century's equivalent of `netcat` (by that I\
    \ mean `ncat`, of course) can do for you, starting with some basics. Netcat boldly\
    \ states that it contains powerful features that can manipulate data (both the\
    \ reading and writing of data) from a network via the command line. It's highly\
    \ reliable and can work with both TCP and UDP (it will also work well with IPv6).\
    \ It can do impressive things with SSL (Secure Sockets Layer) connections and\
    \ can also work well with proxies — both the SOCKS4 and HTTP “CONNECT” varieties.\n\
    \nJudging by the excellent programming practices involved in making the Nmap security\
    \ tool, the quality of the `ncat` programming will also be very high. The Nmap\
    \ `netcat` documentation makes a point of stating that it not only uses completely\
    \ rewritten code (and doesn't borrow from the original version), but that it also\
    \ employs Nmap's thoroughly battle-tested networking libraries.\n\nHaving mentioned\
    \ HTTP proxies, I'll start by using `netcat` as a web browser. If you type this\
    \ command, along with an arbitrary website you want to visit, then you'll be able\
    \ to connect to TCP port 80:\n\n```\n# ncat -C www.chrisbinnie.tld 80\n```\n\n\
    As soon as you've typed this command and hit the Enter key, you need to type the\
    \ following text, and then hit Enter a couple of times:\n\n```\nGET / HTTP/1.0\n\
    ```\n\nBe warned that if you're not really quick, the command will timeout and\
    \ you'll have to try again. If you've ever queried HTML from the command line\
    \ before, then you probably won't be surprised at the excess of information that\
    \ scrolls up your screen after doing so. If you're interested, the `-C` option\
    \ throws a Carriage Return and Line Feed (CRLF) into the mix to allow for compatibility\
    \ with some network protocols.\n\nYou can also use `netcat` as a daemon that listens.\
    \ There are numerous ways of breaking into servers, and one way of leaving access\
    \ open for a return visit is by leaving `netcat` listening on an obscure port\
    \ that a sysadmin might not be aware of.\n\nYou'll think about that in a moment,\
    \ but focus on HTTP for now. The `ncat` documentation provides an excellent example\
    \ of how to turn your simple `netcat` binary into a basic web server. First, you\
    \ will create a simple file. You won't use the `.html` extension, however, because\
    \ your file won't be plain HTML; instead, it'll be one half of HTTP conversation.\
    \ You'll call the file `index.http` with the content shown in `Listing 3.1](#c03.xhtml_c03-1)`.\n\
    \nAs `Listing 3.1](#c03.xhtml_c03-1)` shows, it's mostly HTML, but the top line\
    \ acknowledges the visiting client's request. Next make `netcat` listen for connections,\
    \ and present your file if it's asked to do so by running this command:\n\n```\n\
    # ncat -l 127.0.0.1 80 < index.http\n```\n\nBy the way, if you've just thought\
    \ about serving sorts of other content using `netcat`, then you're correct. If\
    \ you've ever manually typed SMTP conversation via the command line, then you\
    \ probably won't be surprised to discover that the `-C` option works just as well.\n\
    \n### Transferring Files\n\nThink for a moment about moving a file from one host\
    \ to another using `netcat` at either end. You don't need complex SFTP daemons\
    \ or demanding applications for this. You'll call your two machines `Lionel` and\
    \ `Luis`, and you'll watch `Lionel` passing a file to `Luis`. On `Luis`, will\
    \ run this command:\n\n```\n# ncat -l > bootstrap.pp\n```\n\nYou can see that\
    \ the `-l` switch simply asks `netcat` to “listen” for inbound traffic. You're\
    \ listening for traffic on TCP port 1234, and you're outputting the inbound data\
    \ to a file called `bootstrap.pp`; this file is a manifest you don't want to copy\
    \ and paste between hosts because it's long and complex. Now that `Luis` is expecting\
    \ some data, this is what you enter on `Lionel` to send it:\n\n```\n# ncat --send-only\
    \ Luis 1234 < bootstrap.orig\n```\n\nHaving run this command on `Lionel`, the\
    \ `netcat` instance on `Luis` will automatically quit. Before `Luis` quits, it\
    \ will output the contents of the file `bootstrap.orig` on `Lionel` to the file\
    \ `bootstrap.pp` on `Luis` — a simple action. The only things that might trip\
    \ you up are first, the versions (just use `ncat` for simplicity) and second,\
    \ the firewall. Open your firewall carefully if you have issues.\n\nThe `ncat`\
    \ documentation also shows you how to use the `tar` command for moving multiple\
    \ files. Consider this example:\n\n```\n# ncat -l | tar xzv\n# tar czv | ncat\
    \ \n```\n\nAs you can see, you're sending data from `Lionel` to `Luis` again,\
    \ this time piping through the `tar` command at both ends. My favorite example\
    \ is using compression to speed up the transfer (you can easily move massive files\
    \ too) and, of course, transfer less data. Look at this method using compression:\n\
    \n```\n# ncat -l | bzip2 -d > massive.file.bz\n# cat massive.file.orig | bzip2\
    \ | ncat --send-only Luis\n```\n\nIn this example, you're using the trusty `bzip2`\
    \ command for the compression and then duplicating `massive.file.orig` on `Lionel`\
    \ to a file called `massive.file.bz` on `Luis`. Note that you're using the `cat`\
    \ command to read `massive.file.orig` and to pipe it into `bzip2`; that is not\
    \ a typing mistake.\n\n### Chatting Example\n\nLet's have some fun chatting with\
    \ a user on another computer. You may have seen the `wall` command in the past,\
    \ which broadcasts to all logged-in users. You can use `netcat` for two-way chatting.\
    \ Pick a port on the recipient machine (`Luis` again) and politely ask `netcat`\
    \ to listen, as follows:\n\n```\n# ncat -l 1234\n```\n\nNext, run the following\
    \ command. Having run that command, anything you type on `Lionel` (hitting the\
    \ Enter key afterward to send each line of chat content) will be mirrored on `Luis`s\
    \ console, and vice versa.\n\n```\n# ncat Luis 1234\n```\n\nIn the following snippet,\
    \ you can see how a conversation looks from `Lionel`s perspective:\n\n```\n# ncat\
    \ 127.0.0.1 1234\nWant to hear my two rules for success?\nOk!\nRule #1: Never\
    \ tell anyone everything that you know.\nOk, and…\nHello, are you there?\n```\n\
    \nThis example shows one of many unexpected features that are included with `netcat`.\
    \ I'll leave that functionality for you to explore and continue to examine some\
    \ of the other options that are available. Netcat almost suffers from an embarrassment\
    \ of riches in relation to its feature set, and there are simply far too many\
    \ to cover here.\n\n### Chaining Commands Together\n\nOne of the nice features\
    \ included with `ncat` (but not `nc`) is the ability to chain multiple instances\
    \ into a single command. This makes `ncat` very versatile; you can simply pipe\
    \ the output of one `netcat` command into another, Unix style. Let's look at an\
    \ example from the `netcat` documentation. For the following task, I'll introduce\
    \ the machine `Neymar` as your third host. `Lionel` is still your sender, and\
    \ in this scenario `Luis` is the man in the middle. Take a moment to look at these\
    \ commands:\n\n```\n# ncat -l 1234 > my_new_big_file.txt\n# ncat -l 1234 | ncat\
    \ Neymar 1234\n# ncat --send-only Luis 1234 < lengthy_file.txt\n```\n"
