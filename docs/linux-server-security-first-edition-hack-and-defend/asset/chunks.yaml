    - Don''t rely on rootkit tools to reduce your efforts postevent; just use them
    to identify the issue. From there, figure out how a compromise was possible before
    you set about rebuilding your machine. There''s no point in spending a lot of
    time rebuilding a machine only to have the same security hole exploited again
    later. You might be shocked to hear how often this occurs.


    When running less critical services, with a little forethought, the securing of
    a machine connected to the Internet usually doesn''t involve too much work. And
    that''s even when, inevitably, some time-consuming overheads are introduced, such
    as when overnight reporting is added on changes to your system. By taking precautions
    initially with your machine builds, hackers on the Internet can be held at bay
    so that you can get on with your work in peace.


    # Chapter 3: Twenty-First-Century Netcat


    One of the first Linux packages that caused me to marvel at its capabilities was
    the powerful netcat ([`https://nmap.org/ncat`](https://nmap.org/ncat)). There
    have been a few versions over the years, each with a subtly different feature
    set. If you haven''t used it, then you''re in for a treat. It''s been described
    as the only tool that a sysadmin will ever need, which may be a little optimistic,
    but netcat is genuinely exceptional.


    For a start, it''s incredibly lightweight, and its filesystem footprint is miniscule.
    In addition, a version of netcat is included in many distributions by default.
    After you''ve explored some of its background, you''ll look at how you can use
    it to your benefit.


    ## History


    Over the years there have been a number of implementations of netcat. The original
    Unix/Linux version was written in 1995, and in 1998 a Windows version appeared
    due to its popularity. I once read that a poll conducted by the Nmap Project ([`https://nmap.org`](https://nmap.org))
    discovered that after their own security tool, `Nmap`, their users opted for netcat
    as their second tool of choice.


    Netcat''s functionality also helped boost its popularity in nefarious circles.
    It''s therefore commonly used in attack reconnaissance (and attacks themselves)
    in addition to well-intentioned white hat activities. As a result, you may not
    find full-fledged (modern) versions of netcat on enterprise infrastructure, due
    to security fears and its packages being blacklisted as a threat.


    I''ll try to succinctly explain some of netcat''s parentage. Confusion is easy
    because the original netcat (whose binary executable is called `nc`) was revamped
    by the Nmap Project, which refers to it as “Netcat for the 21st Century.” The
    result of the revamp was a binary called `ncat`. The man page for `ncat` dutifully
    acknowledges the original version with the following closing comment:


    > The original Netcat was written by `Hobbit` [hobbit@avian.org](mailto:hobbit@avian.org).
    While `Ncat` isn''t built on any code from the “traditional” Netcat (or any other
    implementation), `Ncat` is most definitely based on Netcat in spirit and functionality.


    This version of netcat (`ncat`) bills itself (modestly) as being able to “[c]oncatenate
    and redirect sockets,” but that''s a gross understatement of its feature set.


    There''s a version of `ncat` available in Red Hat Enterprise Linux (RHEL) 7, for
    example, and I suspect, along with the original netcat (`nc`), it has been available
    in other releases in various incarnations over the years. There''s also an original
    netcat version (bundled by default with Debian Jessie builds, and whose binary
    is also called `nc`), and it headlines its abilities as being the “TCP/IP Swiss
    army knife.” The following RHEL 7 web page points out a few of the differences
    between these two incarnations: [`https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat`](https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat).


    If you visit that web page, you''ll see that a number of command line options
    have changed. Either they no longer apply or the newer `ncat` might have simply
    changed their meaning.


    It''s also worth noting that without access to root user privileges, your success
    between versions may vary, so don''t get too frustrated if it takes a couple of
    attempts to get netcat working the way you''d like. Here''s an excellent article
    that shows you what to do when your version of netcat doesn''t support the `?e`
    or `?c` options to run a shell: [`https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem`](https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem).


    Back to the RHEL 7 web page that I mentioned earlier. It states, with some confidence,
    that the newer `ncat` does not include certain functionality that its parent,
    netcat, did include. It may be that these features simply weren''t as useful on
    the modern Internet. The Nmap website includes the following statement:


    > Ncat adds many capabilities not found in Hobbit''s original, including SSL support,
    proxy connections, IPv6.


    They are, of course, referring to their famous port scanner, which they suggest
    should accompany ncat. Back to netcat. Now that you are suitably confused, I''ll
    further confuse things by mentioning that there were also two versions of the
    original netcat (I mean `nc` and not `ncat`). The truly original netcat was written
    by Avian Research in 1995, and the last version was released as 1.10 in 1996.
    A GNU version of netcat was then released ([`http://netcat.sourceforge.net`](http://netcat.sourceforge.net)),
    whose most recent version, 0.7.1, was released in January 2004. The two `nc` versions
    are worth mentioning because you may have difficulty using the same command line
    options between the different versions.


    The Nmap Project''s own netcat page (`http://sectools.org/tool/netcat`](http://sectools.org/tool/netcat))
    also reveals that there were even more derivatives, including `socat` ([`www.dest-unreach.org/socat`](http://www.dest-unreach.org/socat)),
    `Cryptcat` ([`http://cryptcat.sourceforge.net`](http://cryptcat.sourceforge.net)),
    `pnetcat` ([`http://stromberg.dnsalias.org/~strombrg/pnetcat.html`](http://stromberg.dnsalias.org/~strombrg/pnetcat.html)),
    and `sbd` (you will find an unofficial information site at [`www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd`](http://www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd)).


    ## Installation Packages


    For clarity, Debian Linux and therefore Ubuntu Linux use the package names shown
    in Table 3.1. On Red Hat derivatives, you might try this package name for a version
    of `nc`:


    | Package Name | Description |

    | :--- | :--- |

    | `netcat` | A “dummy” package for compatibility, which can safely be removed
    |

    | `netcat-openbsd` | The OpenBSD package version with support for IPv6, proxies,
    and Unix sockets |

    | `netcat-traditional` | The original package by Hobbit, which lacks many features
    found in `netcat-openbsd` |

    | `netcat6` | A rewrite of the original netcat with IPv6 support and enhanced
    support for UDP |

    '
