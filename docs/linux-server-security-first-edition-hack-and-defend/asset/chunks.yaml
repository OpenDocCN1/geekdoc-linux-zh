    With `netcat` the features keep on coming. You can even add ACLs (Access Control
    Lists) to your `netcat` instances. On a listening `netcat` daemon, you might add
    ACLs such as those in the following examples. You''ll expand on the Bash command
    you just looked at by dutifully locking down your port, using an example from
    the documentation, as shown here:


    ```bash

    # ncat --exec "/bin/bash" --max-conns 3 --allow 192.168.0.0/24 -l 8081 --keep-open

    ```


    You can see that you''re only allowing the 254 hosts from the CIDR `/24` IP address
    range `192.168.0.0`, and machines are only allowed to open up a maximum of three
    connections. The combination of these options adds very welcome versatility.


    The opposite of that command might be, using IPv6, a `--deny` example like the
    following:


    ```bash

    # ncat -l --deny 1222:cb88::3b

    ```


    Here you are allowing all other machines access and only denying this one. This
    applies equally to IPv4 as you''d expect.


    Alternately, the following method is much more efficient when enabling or disabling
    access for multiple hosts. You simply populate a file with your entries. Use both
    `--denyfile` and `--allowfile` options as follows:


    ```bash

    # ncat -l --allowfile trusted-hosts.txt

    ```


    ## Miscellaneous Options


    Incidentally, you can easily jump from the default TCP by using the `-u` or `--udp`
    switches. You''ll see why that''s useful in a moment.


    Similarly, to start using SCTP (Stream Control Transmission Protocol), you can
    provide `netcat` with the `--sctp` option.


    Another handy tip is that you can also add up to three instances of the letter
    `v`, with `-vvv` offering the most verbosity when your commands output results.


    In the same way that you used `netcat` to speak SMTP commands earlier, the powerful
    `netcat` is also capable of speaking Telnet commands. As a result, if you ever
    find yourself without access to a Telnet client, then `netcat` can also help out.
    There are a few obvious benefits to using `netcat` instead of Telnet. For a start,
    `netcat` is quieter and won''t output data unless it is sent by the machine that
    you''ve connected to. There are also a few reserved control characters, which
    means that certain binary data will break if you''re using Telnet. Also, you may
    have noticed that Telnet quits on quiet (idle) connections and stops running,
    which could mean that you won''t receive the entire session''s data. The Telnet
    command also doesn''t work well with UDP but, as you know, `netcat` certainly
    does.


    ## Summary


    I have only covered a tiny fraction of `netcat`''s potential in this chapter;
    there''s simply too broad a scope to cover.


    Hopefully you understand that it''s critically important to know about some of
    this sophisticated tool''s features, if for no other reason than to reveal more
    about how an attacker might deploy them against you.


    The next time I need to move files around inside a LAN, I''ll be certain to use
    `netcat`; it''s too easy to rely on more cumbersome data transfer tools such as
    SFTP tools for such simple tasks. You should avoid using the `Telnet` command
    for debugging open ports and connections and always use `netcat` instead.


    In my case, I''ll also have to remember not to show certain colleagues how to
    do any of the above, as there''s a good chance that they will cause horrible damage
    and leave gaping security holes open.


    # Chapter 4: Denying Service


    There is no denying that without certain critical services working, the Internet
    would grind to a halt. Many users would suffer from degraded performance while
    others might simply experience a complete outage. Along with the DNS (Domain Name
    System), the NTP (Network Time Protocol) is key to the successful operation of
    the Internet. In this chapter, I''ll spend some time describing how attackers
    might try to prevent critical services from working correctly.


    Unfortunately for those who are responsible for keeping the Internet working,
    it''s possible to attack large sections of the Internet''s DNS and NTP infrastructure
    using a variety of methods. For example, DDoS (Distributed Denial of Service)
    attacks of the past were primarily designed to take an online service down or
    at least disrupt its users in a highly frustrating manner, possibly in order to
    gain a competitive advantage or receive payment of a ransom. Current thinking
    is that such attacks are now used as smoke screens to disguise other malicious
    security exploits.


    One report, published in 2014 by Kaspersky Lab, estimated that small- to medium-sized
    businesses would spend around US$52,000 dollars on a DDoS attack. That figure
    would rise to around US$444,000 for enterprises that experienced such attacks.
    When you factor in loss of reputation, customer ill will at having to use slow
    online services (if they were available at all), and payment transactions failing
    (which might require manual involvement to be resolved postevent), guarding against
    such infrastructure challenges is a worthwhile activity. Most worrying is that
    out of 3,900 organizations across 27 countries that took part in the survey the
    report was based on, "[m]ore than one-third (38%) of businesses which provide
    financial services or operate public-facing online services have experienced a
    DDoS attack from April 2013 – May 2014.”


    The methods used to cause the denial of access to critical online services come
    in many forms. Having seen an increase in reflection attacks (amplification attacks
    included) over the past couple of years, on both NTP and SNMP services, I''ll
    describe some of the history behind them, what is involved, and how to mitigate
    their potentially disastrous effects.


    ## NTP Infrastructure


    I have touched upon the fact that critical infrastructure services are common
    targets for attacks because they present a high-value prize to an attacker. As
    DNS and NTP protocols have evolved over the years, security has, of course, been
    factored into their design. Consider NTP for a moment.


    As you''d expect, there are built-in security mechanisms to assist with the toughen
    of NTP as a service. For example, some top-level NTP stratum-1 servers adopt a
    `Closed Account` option, and these servers can''t be used without prior consent.
    Conversely, as you''d expect, as long as you adhere to their usage policies, `OpenAccess`
    servers are readily available for polling. Those `RestrictedAccess` servers can
    sometimes be limited for access due to a maximum number of clients or a minimum
    poll interval and are occasionally only available to certain types of organizations,
    such as academic institutions.


    Another NTP security component is that the client software is written in a way
    to adhere to the instructions that are generated by those servers that they request
    the time from. If a recipient NTP server prefers to, then it can simply block
    a request. In a similar way to certain routing and firewall techniques, those
    packets are discarded or black-holed without intervention. In other words, the
    recipient server of these unwanted packets doesn''t take on extra system load
    and simply drops the traffic that it doesn''t think it should serve a response
    to.


    However, such a response isn''t always helpful, and it''s occasionally better
    to politely ask the client to cease and desist, rather than ignore the requests
    unilaterally. For this reason, there''s a specific type of packet called the `Kiss-o''-Death`
    (`KoD`) packet. If a client is sent an unwelcome `KoD` packet, then it will remember
    that server with an access-denied marker and look elsewhere for its timekeeping
    updates, or at least desist for a predefined period of time within rate-limiting
    thresholds.

