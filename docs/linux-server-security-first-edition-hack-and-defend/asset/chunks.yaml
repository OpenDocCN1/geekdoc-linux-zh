- fmt: '

    Having done that, you can now `cd` into the newly created `hashcat-2.00/` directory,
    which contains many files and subdirectories. Of particular interest are the `docs`
    and `examples` directories, which you can explore to your heart''s content. Fear
    not, you''ll look at how to run the Hashcat executable in a moment.


    Incidentally, if you''re interested in the latest development version, there''s
    a GitHub page at [`https://github.com/hashcat/hashcat`](https://github.com/hashcat/hashcat).
    It also includes documentation and links to the wiki, which should be of interest.


    If you''re running the sophisticated penetration-testing suite, Kali Linux, then
    you should be able to install Hashcat as follows, thanks to the fact that it''s
    built-in:


    ```

    # apt-get install hashcat

    ```


    ### Hash Identification


    There are a couple of things to consider before using Hashcat. You first need
    to know the type of hash that you are trying to recover the password from.


    Let''s think about Linux user passwords for a moment. The default hash algorithm
    in use has changed periodically over time and can also be distribution dependent.
    In the past, common defaults were MD5 and DES, but SHA512 is now commonplace.


    It helps Hashcat if you can identify what hash type you are attacking. You can
    run the following command to discover which hashing algorithm is in use:


    ```

    # authconfig --test | grep hash

    ```


    If you are concerned about the security on your machine and want to upgrade the
    hashing algorithm used by your machine''s Shadow passwords, then you can use the
    following command:


    ```

    # authconfig --passalgo=sha512 --update

    ```


    In this example, you can replace `sha512` with `sha256` if you want. Note, however,
    that in order to make this change effective, you need to get your users to change
    their passwords so they are converted to the new hash type. You can expire a user''s
    password, forcing the user to change it at the next login, with the following
    command:


    ```

    # chage -d 0 chrisbinnie

    ```


    The “change age” command in this example pushes the expiration date to January
    1, 1970, which ensures that it''s always earlier than the current setting of the
    system''s clock.


    Let''s look at my example `/etc/shadow` entry again for the user chrisbinnie:


    ```

    chrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::

    ```


    You don''t need to run the `authconfig` command to determine that the example
    entry is using a SHA512 hash. You can deduce this by referring to the codes in
    [Table 9.1](#c09.xhtml_c09-tbl-0001).


    | Symbol | Hashing Algorithm |

    | :--- | :--- |

    | $0 | DES |

    | $1 | MD5 Hashing |

    | $2 | Blowfish |

    | $2A | Eksblowfish |

    | $5 | SHA256 |

    | $6 | SHA512 |


    [Table 9.1](#c09.xhtml_c09-tbl-anc-0001) How to Identify Hashing Algorithms


    In the Shadow password example, sandwiched between two dollar signs directly after
    the username, there are these three characters: `$6$`. From [Table 9.1](#c09.xhtml_c09-tbl-0001)
    you can tell that the `/etc/shadow` passwords are using SHA512. This is good news
    because it''s a strong algorithm.


    The next section of the password entry, after `$6$` and all the way up to the
    next dollar sign, is the salt. That''s `TRIYWb5l` in this case.


    The password (encoded with the salt) is the next section after the dollar sign
    and up to the first colon. After that, the other sections, within the colons,
    offer the system some pertinent login information such as when the user''s password
    will expire, when it was last changed, and so on.


    To gauge how recently the stronger algorithms have been in use, consider this:
    according to Fedora, since Fedora 8 the `glibc` package has supported SHA256 and
    SHA512 hashes. As a result, from Fedora 9 it has been possible to use SHA256 and
    SHA512 for passwords.


    If you''re stuck, then check out the website [`http://verifier.insidepro.com`](http://verifier.insidepro.com)
    to determine which hash variety you want to point Hashcat to. I only had limited
    success with the example hashes used here, which were generated using a different
    website''s tool, so be warned that it may take you some time to identify an unknown
    type of hash algorithm.


    In case it''s useful, try running the following command to generate an MD5 password
    with a salt (you need `openssl` installed):


    ```

    # openssl passwd -1 -salt 123 PASSWORD

    $1$123$YPya29UI1XS9hz1d23ltx/

    ```


    From the results of running that command, note where the `$1$` and the `123` are
    in relation to the encoded password.


    I sometimes run run an MD5 hashing test like this (without a salt):


    ```

    # echo PASSWORD | md5sum

    8b04b6229e11c290efd5cd8190aa9261  -

    ```


    Other ways of manually generating passwords can be found at [`http://unix.stackexchange.com/questions/81240/manually-generate-password-for-etc-shadow`](http://unix.stackexchange.com/questions/81240/manually-generate-password-for-etc-shadow).


    ### Choosing Attack Mode


    Now that you understand how hashes work, let''s forge ahead. Even when you know
    the type of hash that you''re dealing with, you still need to consider how to
    attack any encoded passwords that you have access to.


    I have mentioned a common attack mode referred to as a brute force attack. These
    attacks will go after the characters that, using U.S. and U.K. character sets
    at least, will include a-z, A-Z, 0-9./, and so on.


    Another popular mode of attack is using wordlists. Here Hashcat will run through
    predefined lists of words.


    A more complex way of using wordlists is adding programmed rules, in what Hashcat
    calls a rule-based attack. By crafting some of rules, your attacks can be more
    accurate and ultimately more efficient.


    ### Downloading a Wordlist


    If you wanted to run a wordlist attack, you would first need a list of words.
    There are several sites online that claim to host leaked passwords.


    The site that follows is apparently not involved in nefarious practices. It offers
    a number of wordlists that you can download. Using an English dictionary as an
    example, the site will let you download 319,378 words into a list that Hashcat
    will happily run through. You can find the wordlists at [`www.md5this.com/tools/wordlists.html`](http://www.md5this.com/tools/wordlists.html).
    (The password to unlock the Zip files containing the words is shown as [`md5this.com`](http://md5this.com).)


    If you''re interested, the md5this website also offers a wordlist generator in
    the form of a python script, which can be downloaded from [`www.md5this.com/tools/wordlist-generator.html`](http://www.md5this.com/tools/wordlist-generator.html).
    The script works by generating words from website content. In order to run the
    script, you simply need to point it at a website from where it will scrape its
    data.


    ### Rainbow Tables


    Instead of leaning on a system''s CPU or GPU capacity, another approach is to
    lean on its storage, potentially using hundreds or thousands of gigabytes. During
    a brute force attack, rather than calculating a hash on every attempt, it is possible
    to look up a list of pre-calculated answers held in a long list. These are known
    as rainbow tables.


    There are ways of defeating this approach, namely by using large salts on one-way
    hashes. This is effective because each password is hashed with a unique salt,
    and therefore every possible salt''s calculated hash would need an entry in a
    rainbow table alongside its salt.


    ## Running Hashcat


    Now that you know about hashes, attack modes, and where to download a wordlist
    from (and once you''ve run through the large number of informative examples, this
    knowledge can be very useful), you can finally get to running Hashcat itself.


    The contents of my installation directory are as follows:

