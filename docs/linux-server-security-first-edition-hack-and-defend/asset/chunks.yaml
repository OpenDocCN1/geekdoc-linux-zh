    \ which shows my main config file, to see how knockd works.\n\n### Changing Default\
    \ Settings\n\nIn [Listing 1.1](#c01.xhtml_rc01_lit_1), you can see a section for\
    \ setting up your options at the top. The other two sections are the actions that\
    \ you want to perform when knockd opens up SSH access or when you shut down your\
    \ port access. Both sections also include the default port knocking sequence to\
    \ trigger those actions under the `sequence` option. After installing knockd,\
    \ I immediately changed those ports from the defaults to avoid reducing the effectiveness\
    \ of my server security. The defaults are ports 7000, 8000, and 9000 to open up\
    \ SSH access and ports 9000, 8000, 7000 to close access. As you can see, I've\
    \ added more ports to open up the access so someone will be less likely to stumble\
    \ across their combination with an arbitrary port scan.\n\nAfter changing any\
    \ settings, you can simply restart knockd as follows on systemd-based operating\
    \ systems:\n\n```\n# systemctl restart knockd.service\n```\n\nAfter installing\
    \ knockd, if you want more background information on the package, then Debian\
    \ Jessie has a brief README file that you can find at `/usr/share/doc/knockd/README`.\n\
    \nThis helpful README file discusses how knockd works, among other things. It\
    \ uses a library called `libpcap`, which is also used by several other packages\
    \ such as `tcpdump`, `ngrep`, and `iftop` (which capture packets for inspection).\
    \ Thanks to its clever design, knockd doesn't even need to bind to the ports,\
    \ which it's covertly listening on, in order to monitor raw traffic.\n\n### Altering\
    \ Filesystem Locations\n\nEvents such as connections, disconnections, or errors\
    \ are logged directly to your system's syslog, and may be written to the `/var/log/messages`\
    \ or `/var/log/syslog` file. If you don't want this information to be buried among\
    \ other system log activities, or go to the bother of parsing an unwieldy log\
    \ file, then you can create your own custom log file. I prefer to do this so that\
    \ debugging is much clearer, and I might use an automated tool or a custom shell\
    \ script to e-mail logs to myself daily so that I can monitor suspicious events.\
    \ Because I'm keeping all knockd logs in one place, the information is easier\
    \ to parse for scripts and other tools.\n\n```\n[options]\n        LogFile = /var/log/portknocking.log\n\
    ```\n\nChanging the logfile's location is a common solution, but you can also\
    \ alter where the Process ID file is written when the knockd service is launched.\
    \ You can change the location under the `[options]` section of the config file,\
    \ as follows:\n\n```\n[options]\n       PidFile = /var/tmp/run/file\n```\n\n##\
    \ Some Config Options\n\nNow that you've got a better understanding of how the\
    \ main config file is set up, you can examine how to configure it for your needs.\
    \ Among a number of other tasks, you will consider how the timeouts of certain\
    \ options play a part in setting up your server.\n\n### Starting the Service\n\
    \nDon't be alarmed if you see an error message saying that knockd is disabled.\
    \ This is a precaution so that until you have finished setting it up, knockd won't\
    \ introduce unwelcome changes to iptables.\n\nOn Debian Jessie the error message\
    \ asks you to change the following parameter to 1 in the file `/etc/default/knockd`:\n\
    \n```\nSTART_KNOCKD=1\n```\n\nClearly, you should only do this after double-checking\
    \ your configuration or making sure that your out-of-band access is working as\
    \ expected.\n\n### Changing the Default Network Interface\n\nOnce you have configured\
    \ your preferred port sequence, you might want to tweak other parameters. In the\
    \ config file (`/etc/default/knockd`), you have the opportunity to alter the KNOCKD_OPTS\
    \ settings. The example within that file is commented out and means that you can\
    \ alter the network interface that knockd is listening on, as follows:\n\n```\n\
    KNOCKD_OPTS=\"-i eth1\"\n```\n\nThese options will be appended to the knockd service,\
    \ and you will need to restart your service to make the changes live, as follows\
    \ (on systemd machines):\n\n```\n# systemctl restart knockd\n```\n\n### Packet\
    \ Types and Timing\n\nIn the `/etc/knockd.conf` file, you can alter a few settings\
    \ to finely tune how clients can connect to you. Referring back to [Listing 1.1](#c01.xhtml_rc01_lit_1),\
    \ under the `[openSSH]` section, you will add more options as follows:\n\n```\n\
    [openSSH]\n        tcpflags = syn\n        seq_timeout = 10\n        cmd_timeout\
    \ = 15\n```\n\nThe `tcpflags` option means that you can expect a specific type\
    \ of TCP packet to be sent for knockd to accept it. That's a TCP “SYN” in this\
    \ case. The TCP flags that you can use are `fin`, `syn`, `rst`, `psh`, `ack`,\
    \ and `urg`. If the specified type of TCP packet isn't received, then knockd will\
    \ simply ignore those packets. Be aware that this isn't how knockd usually works.\
    \ Normally an incorrect packet would stop the entire knocking sequence from working,\
    \ which would mean that the client would have to start again in order to connect.\
    \ You can separate multiple TCP packet types by using commas, and it appears that\
    \ newer versions (from version 0.5 according to the changelog) of knockd can use\
    \ exclamation marks to negate the packet type, such as !`ack`.\n\nBack to the\
    \ other options in the example. You may have noticed that `seq_timeout` is already\
    \ present in [Listing 1.1](#c01.xhtml_rc01_lit_1) by default. However, because\
    \ you have increased the number of ports within your sequence setting, you have\
    \ upped the `seq_timeout` value to 10 rather than 5\\. This is needed because\
    \ on a slow connection, such as via your smartphone, timeouts may occur.\n\nThe\
    \ final option in the example is `cmd_timeout`. This option applies to what happens\
    \ after knockd has received a successful knock. The sequence of events is as follows.\
    \ First, once the port knocking has been confirmed as valid, knockd will run the\
    \ `start_command` (refer to [Listing 1.1](#c01.xhtml_rc01_lit_1) if you need a\
    \ reminder). If this setting is present, then after knockd has executed the `start_command`\
    \ option, it will only wait for the time specified in `cmd_timeout` before running\
    \ the `stop_command` action.\n\nThis is the preferred way to open up your SSH\
    \ server for access, and then promptly close it down once your connection is established.\
    \ You shouldn't have any problems continuing with your session, but new connections\
    \ will need to run through the port-knocking sequence again in order to connect.\
    \ Think of this action as closing the door behind you once you've entered. Your\
    \ server will become invisible again, and only your associated traffic will be\
    \ visible.\n\n## Testing Your Install\n\nBecause you are dealing with the security\
    \ of a server, you should run a few tests to see that knockd is working as expected.\
    \ Ideally you will have access to another client machine to run some tests from.\
    \ To be completely sure that knockd is opening and closing ports correctly, I\
    \ like to test by connecting from a completely different IP address. If you don't\
    \ have access to a connection with a different IP address, then you might be able\
    \ to drop your Internet connection periodically so that your ISP will allocate\
    \ you a new dynamic IP address to test from. Some broadband providers will do\
    \ this after a reboot or your mobile provider might too in addition.\n\n### Port\
    \ Knocking Clients"
