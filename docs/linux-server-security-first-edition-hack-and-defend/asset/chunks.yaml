    ACL。你可以通过你刚刚查看的 Bash 命令来扩展功能，尽职地锁定你的端口，如下例所示：


    ```bash

    # ncat --exec "/bin/bash" --max-conns 3 --allow 192.168.0.0/24 -l 8081 --keep-open

    ```


    你可以看到只允许来自 CIDR 范围 `192.168.0.0/24` 的 IP 地址，并且机器最多只开启三个连接。这些选项的组合增加了非常大的灵活性。


    该命令的反面可能是在使用 IPv6 时，使用如下 `--deny` 示例：


    ```bash

    # ncat -l --deny 1222:cb88::3

    ```


    在这里你允许所有其他机器，而仅拒绝这一个。这同样适用于 IPv4。


    另外，当启用或禁用对多个主机的访问时，以下方法要高效得多。你只需用条目填充文件。使用 `--denyfile` 和 `--allowfile` 选项：


    ```bash

    # ncat -l --allowfile trusted-hosts.txt

    ```


    ## 杂选项


    顺带一提，你可以通过 `-u` 或 `--udp` 轻松地从默认的 TCP 跳。稍后你会看到为什么这很有用。


    同样，为了启动 SCTP（流控制协议），你可以为 `netcat` 提供 `--sctp` 选项。


    另一个实用的技巧是，你也可以添加最多三个 `v` 字母，`-vvv` 在命令输出结果时提供最详细的日志。


    与你早些使用 `netcat` 处理 SMTP 命令一样，强大的 `netcat` 同样能够处理 Telnet 命令。结果，如果你发现自己无法访问 Telnet
    客户端，那么 `netcat` 也可以提供帮助。首先，`netcat` 更加安静，除非由已连接的机器发送数据，否则它不会输出内容。还有一些保留控制字符，意味着如果你使用
    Telnet，某些二进制数据将会损坏。此外，你可能注意到 Telnet 在空闲（idle）连接上退出并停止运行，这可能意味着你无法接收整个会话的数据。但正如你所知，Telnet
    对 UDP 的支持并不良好。


    ## 总结


    在本章中，我只涵盖了 `netcat` 潜力的一小部分；其范围太大，无法完全覆盖。


    希望你理解这种复杂工具的一些特性至关重要，即使仅仅是为了揭示攻击者可能如何针对你部署它们。


    下次我需要在局域网（LAN）内部移动文件时，我会确保使用 `netcat`；依靠 SFTP 等笨重的数据传输工具来此类此类任务太容易了。你应该避免使用 `Telnet`
    命令来调试端口和连接，而始终使用 `netcat`。


    在这种情况下，我也必须记住不要向同事展示上述任何操作，因为它们很有可能造成巨大的破坏并留下巨大的安全漏洞。


    # 第 4 章：拒绝服务


    不可否认，如果没有某些关键服务的运行，互联网将会停滞。许多用户将遭受性能下降，而另一些人可能会完全中断。与 DNS（域名系统）一样，NTP（网络时间协议）是互联网成功运行的关键。在本章中，我将花时间描述攻击者如何尝试阻止关键服务的正常工作。


    对于那些负责维护互联网运行的人来说，遗憾的是，可以使用方法攻击互联网大部分 DNS 和 NTP 基础设施。例如，过去的 DDoS（分布式拒绝服务）攻击主要设计用于让在线服务宕机，或至少以极令人沮丧的方式干扰其用户，可能是为了获得竞争优势或索要赎。目前的观点是，此类攻击现在被用作烟雾弹来掩盖其他的恶意安全漏洞。


    卡巴斯基实验室于 2014 年发布的一份报告估计，小型企业在 DDoS 攻击上的花费大约为 52,000 美元。对于经历过此类攻击的企业，这一数字将升至约
    444,000 美元。考虑到声誉损失、客户对使用缓慢在线服务（如果可用的话）的怨满，以及支付交易失败（事后可能需要人工干预解决），防御此类基础设施挑战是一项值得的活动。最令人担忧的是，在参与该报告调查的
    27 个国家的 3,900 个组织中，“超过三分之一（38%）提供金融服务或运营面向公众的在线服务的企业在 2013 年 4 月至 2014 年 5 月期间经历过
    DDoS 攻击。”


    导致无法访问关键在线服务的方法有很多形式。在过去的几年中，我看到 NTP 和 SNMP 服务的反射攻击（包括放大攻击）增加，我将描述它们背后的部分历史、涉及的内容以及如何减轻其潜在的灾难性影响。


    ## NTP 基础设施


    我提到过关键基础设施服务是攻击的常见目标，因为它们为攻击者提供了高价值的奖品。随着 DNS 和 NTP 协议多年来的演进，安全性自然被纳入设计之中。考虑一下
    NTP。


    正如你所预期的，内置的安全机制可以帮助加固作为服务的 NTP。例如，某些顶级层 1 服务器采用了“关闭账户”选项，未经事先许可无法使用这些服务器。相反，正如你所预期的，只要你遵守其使用策略，开放访问服务器是随时可用的。那些受限访问服务器有时会因为客户端数量或最小轮间隔而受到限制，且仅对某些类型的组织（如学术机构）开放。

    '
- fmt: '

    There are other good reasons to watch the overall security of NTP. In addition
    to the demands on IP addressing and the impact on bank balances from bandwidth
    usage, you also need to include the Internet''s NTP infrastructure on the list
    of services that are about to be affected by the potentially explosive, exponential
    growth of the Internet of Things (IoT). By all accounts, billions of additional
    devices will soon need to be synchronized, so that your refrigerator can order
    some more milk before you run out, among other things.


    ## NTP Reflection Attacks


    Around the start of 2014, a nasty NTP attack surfaced, overwhelming Internet Service
    Providers (ISPs) and forcing the Internet community to act swiftly and effectively
    in order to contain it. For a short while, at least among victims of the attack,
    it caused significant confusion. The frighteningly simple but innovative exploit
    affected almost all NTP implementations. This attack was referred to as a reflection
    attack, which by its very nature generates otherwise unwanted traffic and points
    that traffic at a victim. This usually causes the victim to suffer load or bandwidth
    capacity problems unless they are supported by significant underlying infrastructure.
    In the past, these attacks have been referred to as challenge-response attacks;
    however, in my opinion that description isn''t very helpful because not all reflection
    attacks involve authentication, and challenge-response is most commonly associated
    with authentication mechanisms.


    The 2014 NTP attack followed similar DNS reflection attacks that had been witnessed
    frequently in the past. When such a critical service is discovered to have a previously
    unseen exploitable attack vector, there''s a scramble by technicians wanting to
    protect their infrastructure. Decisions that they are faced with include whether
    that single service needs to be immediately disabled in order to keep other services
    running in the meantime, prior to a patch or configuration fix being made available.
    After all, it is possible to manually set the time on computers or in many cases
    allow for a slight inaccuracy of the system clock. Many services will survive
    missing 24 hours of synchronized NTP updates before any unwelcome effects are
    experienced.


    Within these types of attacks, there are two terms that appear frequently. The
    first is `reflection`, which cognates to mirror-like redirection of attack traffic.
    Here, many third-party services usually respond by sending traffic to a victim
    (the main target), not the attacker. This is achieved by forging or spoofing the
    attacker''s IP addresses and thus fooling the third party about who originally
    requested the traffic.


    `Amplification`, on the other hand, might best be illustrated as sending one packet
    of data as a question and receiving one hundred packets in return as an answer.
    In the case of a reflection attack, this refers to the unsuspecting victim receiving
    the payload, or a sizeable answer to a question that they didn''t ask.


    Think of three machines in a triangle. Machine A asks machine C a lot of questions
    on behalf of machine B. Machine C then sends all of the answers incorrectly to
    B. Machine B is overwhelmed by the volume of answers. Machine A is invisible to
    B, and B doesn''t even know that A is involved in the attack. For those protecting
    their infrastructure, this makes for a challenging diagnosis.


    Reportedly the amplification ratio of the DDoS traffic generated by a standard
    DNS reflection attack is roughly 70:1. In other words, if you have one gigabit
    of bandwidth available to you, then you can forward 70 gigabits. The aforementioned
    reflection ratios made possible by the NTP exploit were reportedly from 20:1 to
    200:1. You simply needed to look up a freely available list of public NTP servers
    to create a frightening amount of NTP traffic to fuel your DDoS attack.


    The NTP attack was, as is often the case, horrifyingly simple. It was based around
    a built-in function that allowed anyone to query the last few hundred servers
    to connect an NTP server. The function that was exploited was called `monlist`;
    you may also see it appear as `MON_GETLIST`. An attacker spoofs the IP address
    asking the question so that the NTP server being queried replies to the victim
    instead of the machine submitting the query. By repeating that command again and
    again, the victim soon becomes overwhelmed if thousands of servers are responding
    simultaneously. The “amplification” of this “reflection” attack, where the amount
    of data involved in the answers is so much larger than the original question,
    is what makes it so devastating. This is because only a relatively small number
    of originating servers that are used to make such queries can topple vast sections
    of infrastructure.


    The essence of mitigating such an attack, on an IPv4 system (the first line showing
    `-4`) and an IPv6 system (the second line with `-6`), comprises the following
    lines within your NTP config file:


    ```

    restrict -4 default nomodify nopeer noquery notrap

    restrict -6 default nomodify nopeer noquery notrap

    ```


    A very welcome NTP server template, among others, that you can use to help your
    public-facing server to avoid being part of these attacks is available at [`www.team-cymru.org/templates.html`](http://www.team-cymru.org/templates.html).
    If you visit that page and click the Secure NTP Template link, you''re presented
    with a collection of templates for various platforms including Cisco iOS, Juniper
    Junos, and Unix.


    Also included is a useful reminder of how to configure IPtables to help lock down
    NTP, as follows:


    ```

    # iptables -A INPUT -s 0/0 -d 0/0 -p udp --source-port 123:123 -m state --state
    ESTABLISHED -j ACCEPT

    # iptables -A OUTPUT -s 0/0 -d 0/0 -p udp --destination-port 123:123 -m state
    --state NEW,ESTABLISHED -j ACCEPT

    ```


    In addition, there''s an interesting note about the potentially damaging implications
    if you panic and decide to prevent NTP traffic into your network by blocking it
    at the router level. You should only filter UDP port `123` for NTP traffic if
    you know exactly what you are doing because, otherwise, key services will inevitably
    fail.


    ## Attack Reporting


    When that first NTP attack took place, cloud service provider, CloudFlare, announced
    the largest DDoS attack ever recorded of its kind. According to CloudFlare, the
    attack was a little short of 400 Gbps of traffic and alarmingly 4,529 servers
    were required to generate that much traffic across 1,298 different networks. In
    contrast, a widely publicized attack that hit Spamhaus (the antispam service provider)
    reportedly used 30,956 open DNS resolvers to generate a 300 Gbps DDoS. As you
    can see, that''s a significant difference in impact on a per-machine basis.


    Another protocol that is being used increasingly in DDoS attacks was created in
    1988 by PSINet, which was then one of the world''s largest ISPs (if not the largest)
    before eventually becoming subsumed by various mergers and acquisitions.


    The Simple Network Management Protocol (`SNMP`) is present on the vast majority
    of networking devices, such as switches and routers. This useful protocol helps
    feed statistical information, such as bandwidth use, back to any software capable
    of receiving it. Most important, enabled by default, is an attack vector based
    on a community string named `public`. Even if passwords are configured by default,
    they tend to be simple, such as `private`. This means that even your broadband
    router poses a potential risk and could participate in a DDoS attack. Also consider
    `SNMP`-enabled devices belonging to enterprises or ISPs; there might be dozens
    of powerful switches and routers on a single network segment with access to high-capacity
    bandwidth. As an aside, even printers in offices commonly employ `SNMP` implementations
    along with workstations and IP video cameras.

    '
