    Because NAT is so popular (and your connection is likely to be NATed), there''s
    a good chance that you would see CAPT entries under the `SENT` lines and before
    the next `RCVD` line if you query that machine. This command works for me:


    ```

    # nping --echo-client "public" echo.nmap.org --tcp

    ```


    If you look carefully at the captured packet entries (`CAPT`), then you should
    be able to tell if NAT has altered your outbound source address. You would see
    a private IP address, such as `10.10.10.10`, as per RFC 1918 ([https://tools.ietf.org/html/rfc1918](https://tools.ietf.org/html/rfc1918)),
    being changed to show a publicly routed IP address such as `123.123.123.123` if
    NAT has been involved. It''s relatively easy to detect NAT getting in the way
    of your connection. Remember that where there is NAT, there are sometimes also
    other devices altering MTUs (Maximum Transmission Units), packet-mangling for
    traffic shaping, unexpected firewalls, and invisible switches that might cause
    subtle changes to your connection.


    There are a number of other scenarios within which Nping can assist, such as (after
    some learning) being able to spot if transparent proxies might be employed en
    route. I will leave you to advance your skills further, but in the meantime, the
    following section describes a few other options that you might find useful.


    ## Other Nping Options


    Using the `--delay 10` option, you can opt to limit the frequency of your packets.
    The default is to usually send pings at one second apart, but increasing this
    value can reduce the noise on your screen if you''re watching diligently for a
    particular event.


    Along the same lines is the `--rate 3` option, where you can flood a target machine
    by sending three packets per second in the example just given. Don''t get tripped
    up battling with the settings for the `rate` and `delay` options, however. According
    to the documentation:


    > [t]his `rate` option and `--delay` are inverses; `--rate 20` is the same as
    `--delay 0.05`. If both options are used, only the last one in the parameter list
    counts.


    You can utilize the `-H` or `--hide-sent` option where outbound packets aren''t
    shown. For example, if you''re flooding a connection, then this will help.


    In addition, if you''re flooding a network and testing how it responds to a significant
    load, then you probably don''t want to process each packet that is received. The
    `-N` or `--no-capture` option doesn''t capture any packets that are received.


    Many other command line options are available for Nping. For example, you can
    add `--debug` to assist you with more detail. You can alter TTLs (Time To Live
    settings). If you''re scanning many hosts, you might also want to add a timeout
    option so that you''re never asking Nping to wait around for a response with `--host-timeout
    10`, where the `10` is a measure in seconds.


    I briefly mentioned spoofing IP addresses in order to forge the sending IP address;
    Nping can go one step further and even populate the sender field with random values,
    by using a command like this to attack the host `whitehat.chrisbinnie.tld`:


    ```

    # nping --arp --sender-ip random --ttl random whitehat.chrisbinnie.tld

    ```


    Alarm bells rang when I first read about this feature. Being able to spoof an
    IP address with random values (successfully) should cause any sysadmin to be concerned.
    All it takes is poorly configured upstream routers to allow this type of traffic
    to arrive on an organization''s network.


    Finally, if you wanted to adjust the way the channel is used for Echo mode, then
    `--channel-tcp` or `--channel-udp` will do just that:


    ```

    # ping  -vvv --client --channel-tcp 1234 --tcp -p 8100 localhost

    ```


    As you might imagine, having the ability to adjust Echo mode to send its “channel”
    data back to the client via both TCP and UDP might be a lifesaver if a strict
    firewall gets in the way.


    ## Summary


    If you experiment with Nping over time, you should come to appreciate that the
    reporting it offers is truly extensive. I''d encourage you to reach for Nmap whenever
    you have the opportunity, in order to gain more exposure.


    With its packet-crafting possibilities, the powerful Nping can outdo many of its
    rivals. The addition of the sophisticated Echo mode means that if you have access
    to both ends of a connection, there''s less chance of a device escaping detection.
    As a result, troubleshooting should be much swifter and less difficult.


    Nmap''s powerful Nping might be considered as just one tool inside a white hat''s
    toolkit. By using tools such as these legally, you will excel at your intended
    tasks, and as a welcome afterthought, you''ll learn how to keep your own servers
    up and running.


    # Chapter 6


    ## Logging Reconnoiters


    At times, you need to pay extra attention to who is connecting to your servers.
    For example, a series of attacks may have recently taken place, which you want
    to keep a close eye on, or you might just be super paranoid in general, thanks
    to the sensitivity of your data or the critical nature of your service.


    One relatively unsophisticated approach to monitoring those machines that are
    making a reconnaissance of your servers would be to log the IP addresses that
    run pings and traceroutes against them. You may think that the information you
    manage to glean isn''t going to be of much use, but it can actually be important
    in building a picture of who connects to your servers, how often, and when. Akin
    to studying Closed Circuit Television (CCTV) video footage of people visiting
    an office, after a while, you get to know who stands out as unusual. If you need
    to keep a vigilant eye on your servers, for whatever reason, then the trick to
    monitoring your system properly depends, in my opinion, on two things. First,
    you need a reliable daemon running in the background, listening like a sentry;
    it should be reliable so it doesn''t introduce a race condition and cause your
    server to fail. Second, you need minimal logging so that you can go back to check
    your log file in a year''s time and find the necessary information without worrying
    that the logs will overfill disk space. Clearly you also don''t want an attack
    to fill your disks with attack logs.


    In this chapter, you will explore how to log any reconnoiters of your machines
    and also how to counter potential Internet Message Protocol (ICMP) issues. You''ll
    also learn how some attackers in the past took advantage of the good-natured protocol
    that is ICMP, and gain an overview of what common attacks looked like before ICMP
    gained a reputation for being insecure.


    ### ICMP Misconceptions


    The traffic generated by pings and traceroutes uses the much-maligned ICMP, with
    UDP to a lesser extent for DNS lookups if required.


    However, it''s worth mentioning that ICMP was created for very good reasons and
    is still used for very important tasks in the day-to-day operation of the Internet.
    For example, it''s needed to tell devices the size to set their Maximum Transmission
    Unit (MTU) in order to allow packets to traverse smoothly across heterogeneous
    network links. As a result, after reading what follows, you should avoid committing
    one of the most common junior sysadmin mistakes: blocking all ICMP traffic to
    your servers.


    ### tcpdump


    Let''s have a cursory look at your options for monitoring pings and traceroutes
    around the clock. Straight from the sysadmin''s tool kit of reliable utilities,
    you might consider the powerful packet-sniffing tool, tcpdump. This tool has long
    been trusted to split traffic into smaller pieces in order to offer an insight
    into what is travelling across a network.

