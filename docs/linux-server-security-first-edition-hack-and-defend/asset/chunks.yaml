    [**Table 9.2**](#c09.xhtml_c09-tbl-anc-0002) Hashcat Attack Modes and Their Corresponding
    Numbers


    Let''s briefly look at the differences between a brute force attack and the dictionary
    attack you looked at previously.


    The main difference between the two relates to brute force attacks having to search
    through the entire keyspace for a password match. Dictionary attacks, however,
    only have a limited remit. As a result, dictionary attacks are much quicker, but,
    of course, there''s a good chance they won''t crack the salted hashes put in front
    of them. However, at least you are quickly made aware of any failures with this
    mode.


    This is the opposite of a brute force attack, which will keep running (potentially
    for a very, very long time) until it succeeds in breaking the password. You are
    all but assured, if the configuration settings are correct, that you will be handed
    the password at some point, even if it takes a hundred years for it to happen.


    Within its detailed online documentation, Hashcat talks about brute force attacks
    being an older, less sophisticated route to discovering passwords. Hashcat now
    includes the brute force style of attack (you may have noticed it mentioned in
    [Table 9.2](#c09.xhtml_c09-tbl-0002)) within its mask attack mode.


    The main premise with a mask attack is to reduce the size of the keyspace and
    therefore speed up the run time. One clever example that the documentation offers
    is that with Hashcat''s innovative technique, you can reduce the recovery time
    of the password “Julia1984” from approximately four years to a staggering forty
    minutes.


    The documentation boldly states that there are no disadvantages to running a mask
    attack over a brute force attack, which is promising. You run a mask attack by
    appending a mask to the end of your standard command, as follows:


    ```

    # hashcat -m 1800 -a 0 -o discovered_passwords.txt --remove hashes.txt wordlist.txt
    -1 ?dabcdef

    ```


    The appended `-1 ?dabcdef` in this case asks Hashcat to run through the characters
    0123456789abcdef.


    According to the documentation, this mask, `-1 ?l?d?s?u`, offers a full 7-bit
    ASCII character set, also known as mixalpha-numeric-all-space. There are a number
    of built-in character set options with Hashcat, such as `?l` (which stands for
    all lowercase characters from a to z), and `?u` (which stands for all uppercase
    characters from A to Z).


    You can find more details on mask attacks at [`https://hashcat.net/wiki/doku.php?id=mask_attack`](https://hashcat.net/wiki/doku.php?id=mask_attack).


