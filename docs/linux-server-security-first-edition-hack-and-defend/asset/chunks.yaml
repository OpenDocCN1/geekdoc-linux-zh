    It seems like every other day the news reports another sensational attack and
    makes those working in the field count themselves lucky that their clients weren''t
    the target. As our reliance on responsive connectivity and well-written software
    grows, so do the rewards for successfully compromising an online service.


    The intention of this book is to offer a broad overview of both system and network
    threats. Rather than focus on one specific facet of online security, my aim is
    to examine a number of diverse areas, providing you, the reader, with enough knowledge
    so that you may pursue, in greater detail, those that interest you. Each of the
    chapters in this book explores aspects of security that I have found interesting
    on my journey as an Internet user, which, somewhat worryingly, now spans almost
    two decades.


    The diversity of the subjects within this book will hopefully help you to secure
    your online services and also provide you the opportunity to experiment with common
    tools that hackers use. This is intended to benefit everyone, helping technical
    professionals to gain a better understanding of how attackers will identify and
    then try to exploit the vulnerabilities of a system or network. Elements of the
    knowledge contained in this book can be wielded to devastate online services,
    steal data, and reveal encrypted passwords. With great power…


