    \ deface or steal data from them as they saw fit.\n\nIt didn't stop there, however.\
    \ As phishing attacks became more popular (where attackers trick users into revealing\
    \ information about themselves), cunning attackers went about completely rebranding\
    \ a website, by injecting the necessary code to persuade a visitor that they were\
    \ visiting a bona fide website.\n\nFor a number of years, I ran a very small co-location\
    \ server ISP for relatively tech-savvy customers. On at least three occasions,\
    \ our co-located server customers, who had unwittingly been less diligent with\
    \ their server-side scripting, succumbed to phishing attacks. From the mid-2000s\
    \ onwards, over the space of just a few years, the U.S. Federal Bureau of Investigation\
