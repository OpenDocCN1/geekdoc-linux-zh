  \n*版权 2015 [Insecure.Com](http://Insecure.Com) LLC*\n\n## 总结\n\n在本章中，我触及了 Nmap 的一些基本功能，介绍并解释了\
  \ NSE 的不同脚本类别，讨论了 Nmap 可以使用的脚本类型，并探索了如何使用 GUI 来消除重复性任务的初始复杂性。当然，如果我不再次提到 GUI 也有助于分析，将是我的失职。\n\
  \nNmap 支持并鼓励你尝试有数百种选项，以及白帽和黑帽场景。学习攻击者可能如何入侵你的系统是非常重要的，但以谨慎和尊重的态度使用这些强大的工具也同样重要。\n\
  \n毕竟，搞掉他人的服务器并不好玩。阻止他人搞掉你的服务器才是更大的挑战，结果是这要有成就感得多（而且完全合法）。\n\n# 第 8 章：恶意软件检测\n\n\
  `malware`（恶意软件）一词涵盖了大量设计用于损坏计算机的不受欢迎的软件。恶意软件的部分列表例如可能包括病毒、间谍软件、特洛伊木马和蠕虫。此类软件的迅速扩散足以让从新手到资深管理员的各个水平的用户感到担忧。恶意软件的影响范围从本质上无害的恶作剧到盗取个人信息（如银行详情）或拒绝服务。\n\
  \n尽管新闻中的恐慌情绪此起彼伏，但每位优秀的系统管理员都知道，不存在完全安全的系统。尽管针对 Windows 机器的病毒和恶意软件威胁巨大，但所有 Unix\
  \ 类型机器的用户都应该记住，这些威胁也存在于他们的系统中。\n\n有一个名为 Linux Malware Detect (LMD) 的流行且复杂的软件包，来自\
  \ R-fx Networks ([`https://www.rfxn.com`](https://www.rfxn.com))，有助于缓解 Linux 系统上的恶意软件威胁。让我们看看如何使用\
  \ LMD 软件包有效地保护 Linux 机器免受恶意软件侵害，它只专注于恶意软件，与其他更稀释的解决方案不同。\n\n## 入门\n\n在我们开始查看 LMD\
  \ 本身之前，让我们考虑一下为了成功保持恶意软件正常运行而所需的一些可能不那么明显的方面。\n\n### 定义更新频率\n\n频繁执行恶意软件特征更新至关重要；事实上，如果你错过了最新更新，你的系统可能会变得非常脆弱。如果无法检测到当前威胁，检测软件本身的架构就意义不大。幸运的是，LMD\
  \ 经常拉取更新，并从社区数据、用户提交以及活跃恶意软件威胁的防火墙数据中生成特征。\n\nLMD 网站提供最新威胁的实时 RSS 馈，还提供了一个商业版本，这是保持更新具有时效性和相关的另一个动力。该充满了\
  \ LMD 当前恶意软件发现的馈源，可以在 [`https://www.rfxn.com/feed/`](https://www.rfxn.com/feed/)\
  \ 处找到。\n\nLMD 表示，签名大约每天更新一次，如果报告了大量活动，更新频率会更高。\n\n### 恶意软件 Hash 注册表\n\n一个受誉的安全网站\
  \ Team Cymru 提供恶意软件 Hash 注册表 ([www.team-cymru.org/MHR.html`](http://www.team-cymru.org/MHR.html))，它提供了一个查询服务来比较恶意软件感染。根据\
  \ LMD 的说法，超过 30 家主要的杀病毒公司使用这些数据来填充它们的数据库。从 LMD 网站，你可以看到报告威胁的数量如下：\n\n```\nDETECTED\
  \ KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT\
  \ (HIGH): 100\n```\n\n\n\n\n\n一种监控文件系统变化的现代方法是使用 `inotify`。你需要兼容的内核来使此功能正常工作。不用担心，据报道\
  \ `inotify` 已经包含在 2.6.13 及之后的版本的内核中，因此大多数 Linux 发行版都具备此能力。\n\n复杂的 `inotify` 可以实时监控单个文件和整个目录的变化，一旦发现任何更改，就会向配置的软件报警。如果发现某个用户态软件正在进行更改，`inotify`\
  \ 将其视为一个事件并立即报告。\n\n通过创建监听列表，`inotify` 可以跟踪唯一的监听描述符（watch descriptors），并将其与监听列表中的每个项关联。尽管\
  \ `inotify` 不会传递关于更改文件或目录的用户或进程的详细信息，但发生变化这一事实已足够满足大多数应用程序的需求。如果无法使用 `inotify`，通常需要采用旧的轮询文件系统或手动扫描的方法。在检查网络文件系统的变化的情况下，任何配置的软件将需要使用预定的频率对文件系统进行轮询。这是因为远程文件系统很难追踪。\n\
  \n遗憾的是，包括 `/proc`、`/sys` 和 `/dev/pts` 在内的伪文件系统对 `inotify` 是不可见的。然而，这不需要太担心，因为这些路径中不存在“真实”文件，而是系统频繁变化的瞬时运行机制。\n\
  \n### 安装\n\n现在让我们来看看如何在 Debian 和 Red Hat 衍生版上安装 LMD。首先，你将在 Red Hat 上通过以下命令检查是否安装了\
  \ `wget` 包：\n\n```\n## yum install wget\n```\n\nDebian 上的替代方案是以下命令：\n\n```bash\n\
  ## apt-get install wget\n```\n\n许多发行版默认包含了 `wget`，因此可能不需要执行此操作。\n\n为了充分发挥 LMD 的作用，如果你想让\
  \ LMD 直接与 `inotify` 交互，还可以安装 `inotify-tools`；你可以从 [`https://github.com/rvoicilas/inotify-tools/wiki`](https://github.com/rvoicilas/inotify-tools/wiki)\
  \ 阅读更多信息并下载 `inotify-tools`。\n\n不过，如果你想从包管理器安装它，并且幸运地正在使用 Red Hat 的后代版本，可以使用以下命令：\n\
  \n```bash\n## yum install inotify-tools\n```\n\n对于遵循 Debian 系的机器，你应该能够运行以下命令：\n\n\
  ```bash\n## apt-get install inotify-tools\n```\n\n如果这在你的 Debian 发行版上不起作用，请尝试以下步骤。我知道这是有效的，因为我曾看看\
  \ LMD 在 Ubuntu 14.04 LTS 上安装有多简单。我需要添加 Universe 存储库，以便将 `inotify-tools` 包成功安装到我的\
  \ `/etc/apt/sources.list` 文件中，如下：\n\n```\ndeb http://us.archive.ubuntu.com/ubuntu\
  \ trusty main universe\n```\n\n如果你运行的是其他发行版，可以将“trusty”替换为“precise”或其他 Ubuntu 版本代号。然后你可以使用以下命令更新包列表：\n\
  \n```bash\n## apt-get update\n```\n\n最后，最后的 Ubuntu 命令简单如下：\n\n```bash\n## apt-get\
  \ install inotify-tools\n```\n\n我将让你以同样的方式尝试 Debian 存储库（将“trusty”替换为你的 Debian 版本名称）。\n\
  \n由于截至本文，包存储库中尚未找到 LMD 包本身，你可以按照以下方式下载并安装该包：\n\n```\n## cd /usr/local/src/\n# wget\
  \ http://www.rfxn.com/downloads/maldetect-current.tar.gz\n## tar -xzf maldetect-current.tar.gz\n\
  ## cd maldetect-*\n## sh ./install.sh\n```\n\n一旦你运行了 `install.sh` 脚本（如这些命令的最后一行所示），你应该看到包含以下内容的输出：\n\
  \n```\nLinux Malware Detect v1.5\n            (C) 2002-2015, R-fx Networks <proj@r-fx.org>\n\
  \            (C) 2015, Ryan MacDonald <ryan@r-fx.org>\nThis program may be freely\
  \ redistributed under the terms of the GNU GPL\ninstallation completed to /usr/local/maldetect\n\
  config file: /usr/local/maldetect/conf.maldet\nexec file: /usr/local/maldetect/maldet\n\
  exec link: /usr/local/sbin/maldet\nexec link: /usr/local/sbin/lmd\ncron.daily: /etc/cron.daily/maldet\n\
  maldet(6617): {sigup} performing signature update check…\nmaldet(6617): {sigup}\
  \ local signature set is version 2015112028602\nmaldet(6617): {sigup} latest signature\
  \ set already installed\n```\n\n当然，如果你编辑了 `install.sh` 脚本（特别是 `inspath` 变量），你选择的安装路径可能会不同。正如你看到的，你还会收到关于你的\
  \ LMD 签名更新程度的说明。\n\n### 监控模式\n\n现在你已经安装了包，让我们 LMD 能在系统上为你监控什么。一个很好的开始是考虑 LMD 的监控模式。\n\
  \nLMD 提供了多种可以配置的监控模式。如你所见，LMD 还提供了关于你的 LMD 签名更新程度的说明。\n\n## 配置\n\nLMD 的主配置文件是 `/usr/local/maldetect/conf.maldet`。它有详细的注释，有助于理解\
  \ LMD 偏好的设置方式。\n\n在继续之前，有一个警告：LMD 配置文件不使用星号（*）作为通配符，而是使用问号（?）。因此，你应该使用 `?` 代替 `*`\
  \ 来替换多个字符。除了这个微小的注意事项，其他操作相对顺畅。\n\n## 排除\n\n让我们看看如何设置 LMD。文档首先要求你考虑想要忽略的系统元素。与你刚刚看到的监控模式风格相似，你可以通过填充某些文件来实现这一目标。以下文件中的每个条目都应单独占一行。\n\
  \n你可以将不想让 LMD 检查的完整文件路径添加到此文件中：`/usr/local/maldetect/ignore_paths`。\n\n你也可以通过在该文件中放入类似\
  \ `.jpg` 的条目来全局排除特定的文件扩展：`/usr/local/maldetect/ignore_file_ext`。\n\n出于某种原因，某些 LMD\
  \ 签名可能会导致不必要且无用的日志记录和告警。你可以通过在该文件中添加签名（例如 `php.mailer.10hack`）来禁用某些签名：`/usr/local/maldetect/ignore_sigs`。\n\
  \n最后一种排除选项意味着你可以使用复杂的正则表达式（regex）一次性匹配多个文件系统路径。你只需要在 `/usr/local/maldetect/ignore_inotify`\
  \ 文件中添加列表，其格式如下：\n\n```\n ∧/home/premium-user-$\n```\n\n\n\n\n\n显然，通过使用正则表达式，文件匹配的可能性是无限的，它可以避免在每当有新用户允许登录你的服务器时，都必须手动更改配置。这个正则表达式示例希望让你明确，你可以使用类似于\
  \ `premium-user-123456` 的用户名格式来命名特定的用户组。\n\n## 从 CLI 运行\n\nLMD 的命令行界面 (CLI) 选项经过深思考虑，且相对易懂。我将留给你去探索所有的选项，但现在你将查看一些关键选项。\n\
  \n正如我已经提到的，LMD 的可执行二进制文件名为 `maldet`。让我们从在后台运行 LMD 并检查某个特定的文件系统路径开始。你可以从文档中的此示例看到如何使用\
  \ `-b` 参数如下所示在后台运行可能的大型扫描：\n\n```\n# maldet -b -r /home/?/public_html 7\n```\n\n\
  在这个示例中，`-b` 用于后台扫描并检查过去七天内更改或修改的文件，通过后面附加的字符 `7` 来设置。该命令的语法和可选运行方式为 `--scan-recent\
  \ PATH DAYS`。\n\n## 报告\n\n让我们快速查看 LMD 如何生成其报告。图 8.4 显示了一份生成的报告。\n\n![使用 maldet —report\
  \ 命令的 LMD 扫描报告显示](img/c08f004.jpg)\n\n图 8.4 使用 maldet --report 命令的 LMD 扫描报告\n\n\
  要查询特定的报告，你需要一个 `SCANID`。这是一个唯一的引用，可以在 图 8.4 顶部看到，运行此命令将为你提供最后一次运行的 LMD 命令的报告：\n\n\
  ```\n## maldet --report\n```\n\n一旦获取了该 ID，你还可以按照如下方式手动将报告电子邮件给自己：\n\n```\n## maldet\
  \ -e, --report SCANID chris@binnie.tld\n```\n\n要查询名称包含格式化时间戳的特定 `SCANID`（在本示例中日期为\
  \ `010116`，名称其余部分为时间），你的命令可能如下：\n\n```\n# maldet --report 010116-1111.21212\n```\n\
  \n这些选项如果与 `--log` 或 `-l` 选项一起使用也可能很有帮助：\n\n```\n## maldet --log\n```\n\n运行此命令，你应该能看到\
  \ LMD 记录事件。在我的情况下，尽管到目前只运行了几个命令，但我的日志文件中已经有相当丰富的详细信息。通过该命令，你将看到来自 `/usr/local/maldetect/logs/event_log`\
  \ 文件的最后五十行。如果你需要发现那 50 行中未找到的信息，可以进一步查询该文件。在我看来，LMD 记录的详细程度是说明该软件包精良且编写良好的另一个证明。\n\
  \n## 隔离与清理\n\n文档中特别强调了，默认情况下，LMD 在发现看起来可疑的文件时不会采取行动。因此，理解这一点很重要：在大多数情况下，你需要手动隔离你的恶意软件。\n\
  \n如果你确定想要启用自动隔离，可以通过在主配置文件 `conf.maldet` 路径中设置配置选项 `quar_hits=1` 来实现，该文件默认位于 `/usr/local/maldetect/conf.maldet`。\n\
  \n如果你想隔离特定扫描中的所有恶意软件，则可以使用 `-q` 选项，它等同于 `--quarantine SCANID`，如下：\n\n```\n# maldet\
  \ -q 010116-1111.21212\n```\n\n如果你觉得自己犯了错误，可以使用以下命令从特定的 `SCANID` 恢复隔离的文件，这与 `--restore`\
  \ 函数相同：\n\n```\n# maldet -s 010116-1111.21212\n```\n\n如果没有可恢复的内容，你将看到类似所示的错误：\n\n\
  ```\nmaldet(18748): {restore} could not find a valid hit list to restore.\n```\n\
  \n如果你想让 LMD 尝试修复它发现的恶意软件感染，可以使用 `--clean` 命令，它也写为 `-n` 选项。这里有一个清理特定 `SCANID` 中发现的恶意软件的清理示例命令：\n\
  \n```\n# maldet -n 010116-1111.21212\n```\n\n要使清理被视为成功，清理恶意软件感染后的后续扫描必须通过，且没有注册到问题文件的\
  \ HIT（命中）。\n\n如果你开始怀疑结果，或者不确定你的配置更改是否已正确加载，可以使用以下命令清除所有现有的会话数据、日志和临时文件：\n\n```\n\
  ## maldet -p\n```\n\n结果应该类似于此输出：\n\n```\nmaldet(19219): {glob} logs and quarantine\
  \ data cleared by user request (-p)\n```\n\n## 更新 LMD\n\n正如我从开始所说的，更新 LMD 的签名至关重要。要手动更新，请使用\
  \ `-u` 命令。如果你想疑惑，可以使用 `--update` 选项，如下：\n\n```\n## maldet -u\n```\n\n预期的输出将类似于：\n\
  \n```\nmaldet(19278): {sigup} checking available updates\nmaldet(19278): {sigup}\
  \ hashing files and checking\nmaldet(19278): {sigup} latest version 201511\n```\n\
  \n还有一个更新安装内容的机制如下：\n\n```\n## maldet --update\n```\n\n## 扫描与停止扫描\n\n在 图 8.1 中你看到了使用\
  \ `-m` 或 `--monitor` 选项监控路径的结果。让我们在这里展开一下。假设你想监控两个文件系统分区，你可以如下监控路径：\n\n```\n## maldet\
  \ -m /usr/local,/home\n```\n\n注意分隔路径的逗号。该命令的输出在 图 8.5 中所示。记得之前提到的大型扫描可以使用 `-b` 选项。\n\
  \n让我们考虑如何手动扫描目录及其子目录。假设用户通过 FTP 或 SFTP 向上传目录上传文件：\n\n```\n## maldet -a /home/?/uploads\n\
  ```\n\n在这个示例中，你使用 LMD 扫描所有具有家目录的 `uploads` 目录（记住问号是通配符，而不是星号）。\n\n运行扫描命令后，你还会获得一个以后使用的\
  \ `SCANID`，从其生成的数据可以看出：\n\n```\nmaldet(28566): {scan} scan of /home/*/uploads (1\
  \ files) in progress…\nmaldet(28566): {scan} 1111/1111 files scanned: 0 hits 0 cleaned\n\
  maldet(28566): {scan} scan completed on /home/*/uploads: files 1111, malware hits\
  \ 0, cleaned hits 0, time 11s\nmaldet(28566): {scan} scan report saved, to view\
  \ run: maldet --report 151212-1724.28566\n```\n\n如果你的任何扫描时间超过了预期，LMD 也可以适应这种情况。杀死开关\
  \ `-k` 选项（也写为 `--kill`）将立即停止任何 inotify 实例。如果机器负载过高或你认为某些运行不符合预期，那么这是可用选项非常有用的补充。\n\
  \n## 定时任务\n\n\n\n\n\nLMD 随带了一个每日 cron 任务，位于 `/etc/cron.daily/maldet`。该任务将更新特征库并清理扫描数据，使其保留时间长达十四天，并使用你指定的配置运行每日扫描。\n\
  \n请注意，会话数据和临时文件在 cron 任务执行之间是保留的。因此，如果你认为结果不准确，你需要运行我之前提到的 `-p` 选项来清除这些文件。\n\n你应该设置电子邮件配置参数，以便每天早上接收每日报告。出于邮件存档的考虑，每日的更新是非常有价值的，而且它可以确保你的扫描每天都在进行且没有发生失败。\n\
  \n## 恶意软件报告\n\n你已经看到 LMD 是多么复杂且结构精良了，因此 LMD 提供了一个简单的机制来上传可疑文件进行分析，这并不令人意外。如果这些文件证明被感染了未知种类的恶意软件，则可能会创建新的特征码并将其添加到\
  \ LMD 的已知威胁中，以便为其他用户识别恶意软件。将文件发送回 LMD 进行检查的方法如下，使用 `--checkout` 特性（它也可以写为 `-c` 选项）：\n\
  \n```\n## maldet -c suspicious_file.gz\n```\n\n当你执行此命令时，你的文件将提交到 [`rfxn.com`](http://rfxn.com)\
  \ 并随后进行检查。\n\n## Apache 集成\n\n在本章前面，我简要提到 LMD 包含的一个巧妙功能。该功能是将 LMD 与 Apache 的 `mod_security2`\
  \ 模块集成的能力。LMD 文档解释说，它使用可变 Apache 模块的 `inspectFile` 钩子功能，允许你运行验证脚本，该脚本可以判断上传是通过或失败。例如，在你的\
  \ Apache 配置中，可能会看到这个来自文档的条目：\n\n```\nSecRequestBodyAccess On\nSecRule FILES_TMPNAMES\
  \ \"@inspectFile /usr/local/maldetect/hookscan.sh\" \\\n                \"id:'999999',log,auditlog,deny,severity:2,phase:2,t:none\"\
  \n```\n\n根据设计，用户上传的每个文件都可以自动扫描，这应该显著减少系统上的威胁数量，特别是在许多用户频繁上传文件的情况下。\n\n文档包含了在默认选项中如何考虑性能和准确性的细节。如果你对此功能感兴趣，我鼓励你查看内置的\
  \ README 文件以获取更多信息。\n\n## 总结\n\n除了查看 LMD 之外，我还提到了它用于实时检查文件系统变化的 `inotify` 机制。巧妙且高效的\
  \ `inotify` 允许在不引入显著系统负载的情况下对恶意软件进行实时检查。\n\n由于 Android 智能手机目前占了全球市场的 80% 以上，毫无疑问，编写用于利用这些设备漏洞的恶意软件在未来将更多地出现在\
  \ Linux 用户设备以及服务器上。\n\n通过在启用 LMD 等复杂工具的同时启用实时文件系统检查，你应该能够显著降低被恶意软件感染的风险。LMD 最初是为提供共享托管服务的服务器而设计的，因为作者认为其他产品忽略了用户账户攻击向量，而这些产品通常侧重于内核和根内核攻击程序（rootkit）感染。\n\
  \n然而，在先在测试环境中尝试安装了 LMD 并熟悉了它的运行方式后，我相信 LMD 绝对值得在你的生产机器上考虑使用。\n\n# 第 9 章：使用 Hashcat\
  \ 破解密码\n\n最近有两款复杂的安全工具引起了我的注意。它们在新闻中因作为开源发布而受到关注，显然，开发者在寻找这些工具源码时在 GitHub 上引发了热潮。所说的工具被称为\
  \ `Hashcat` 和 `oclHashcat`。`Hashcat` ([`hashcat.net/hashcat``](https://hashcat.net/hashcat))\
  \ 大胆地自称为“世界上最快的基于 CPU 的密码恢复工具”。它的近亲兄弟 `oclHashcat` 使用你的图形处理器（GPU）通过数字计算来完成密码恢复过程，而不是\
  \ `Hashcat` 的基于 CPU 的方法。因此，基于 GPU 的 `oclHashcat`甚至比 `Hashcat` 更快。\n\n虽然这类工具对于正当找回丢失的密码非常有用，但也可能将它们用于不法目的。希望不言而明，这些强大的工具应该被负责任使用。它们被法医科学家和渗透测试员采用，如果你在其中一台机器上发现了类似工具的证据，你绝对应该引起警报。\n\
  \n让我们看看这些工具在密码丢失时是如何发挥作用的，以及黑客将如何攻击你的密码。\n\n## 历史\n\n另一个流行的、历史悠久的用于破解密码的安全工具被称为\
  \ `John the Ripper`，它的起源可以追溯到许多年前。`Hashcat`  于 2009 年出现，并着开始使用多线程 CPU 密码破解。当时，尽管其他工具开发者已经开始考虑使用\
  \ CPU 的所有可用核心，但没有一个工具能够完全且在不打补丁的情况下做到。当开发者设计 `Hashcat` 时，利用现代 CPU 的能力并显著加速密码恢复过程是完全合逻辑的。\n\
  \n以防引起混淆，`Hashcat` 在早期版本中曾经历过几个不同的名称，例如 `atomcrack` 和 `Dr. Hash`。从 0.30 版本开始，你所熟悉的（我确定你将开始喜欢它的）名称\
  \ `Hashcat` 被应用于该软件。\n\n## 理解密码\n\n查看密码系统如何工作可能会有所帮助。在详细介绍 `Hashcat` 之前，我将使用 Linux\
  \ 系统作为例子。\n\n### 密钥空间\n\n理解密钥空间（Keyspace）的概念可能很有帮助。它大致地关联到破解工具需要付出的努力。\n\n密钥空间简单来说生成密钥时可能使用的可用密钥集合。美国国家标准技术研究院\
  \ (NIST) 将密钥空间描述为“密钥（如密码）可能拥有的值的总数”。它继续道，“密码中密钥空间的一个组成部分是构成密钥的‘字符集’。”\n\n换句话说，在密码中你可以使用键盘上的可用字符（或当前语言区域的字符集），它们代表了密码的密钥空间。\n\
  \n即使是单个字符，如果该字符是从零到九的数字，也有十个字符的空间。\n\n通过增加密码长度和字符集的大小可以增加密码的安全性。例如，一个具有 16 个字符且使用大小为\
  \ 10 个字符字符集的密码，据报道拥有 10,000,000,000,000,000 个密钥空间，这比单个字符的十空间要难攻击得多。\n\n这个网站网站可能会鼓励增加密码安全性：[`https://howsecureismypassword.net`](https://howsecureismypassword.net)。\n\
  \n这个简单但复杂的网站使用基础术语，并讨论可能的组合而不是密钥空间。如果你在输入密码后点击框下方的 `SHOW DETAILS` 链接，你会看到密码有多安全。例如，当我输入一个单字符密码后，出现了以下输出：\n\
  \n```\nLength 1 characters\nCharacter Combinations 10\nCalculations Per Second 4\
  \ billion\nPossible Combinations 10\n```\n\n\n\n\n\n现在是应该让你感到非常关心的部分。“How Secure\
  \ Is My Password”网站上强大的密码工具显示，对于一台标准的台式电脑，破解我那一个单数字密码的时间大约为 0.000000025 秒。想象一下，如果结合多块显卡的处理能力，速度会有多快。\n\
  \n相比之下，为了表现得更聪明一点，你可以看看我在接下来的示例中输入一个 16 字符的密码时会发生什么。顺便说一下，我使用的是计算机的默认字符集，所以你刚刚看到的那个\
  \ 10 个字符长度的字符集示例在这里并不适用。\n\n我输入的密码是大小写字母、数字和特殊字符的组合，如下：\n\n```\nRx951&RTdIp-\"2YT\n\
  ```\n\n在这种情况下，网站返回了一个更让人心安的破解时间：412 万亿年。正如你从下面的输出中看到的，这里包含了一些新词汇（至少对我来说）。显然，“nonillion”这个词在美国是指后面跟着\
  \ 30 个 0，而在英国则是指后面跟着 54 个 0。\n\n```\nLength 16 characters\nCharacter Combinations\
  \ 96\nCalculations Per Second 4 billion\nPossible Combinations 52 nonillion\n```\n\
  \n从这个示例中，你可以清楚地推断出，标准的八位“复杂”密码比使用简单的单字符密码要好。\n\n## 哈希值 (Hashes)\n\n既然我已经介绍了复杂密码如何极大地增加攻击的难度，我将继续关于密码破解的讨论。不过，首先给出一个最后的解释。\n\
  \n正如其名所示，`Hashcat` 处理的是密码哈希。在密码学中，创建哈希值涉及将字符字符串（如密码）转换为一组固定数量的字符，结果类似于指纹。没有办法可以撤销或反转哈希值（嗯，更准确地说，在现实中这只是真的、非常困难）。\n\
  \n这里有两个 MD5 示例。首先，单词“hello”的哈希值是：\n\n```\n5d41402abc4b2a76b9719d911017c592\n```\n\
  \n其次，大写“Hello”的 MD5 哈希值是：\n\n```\n8b1a9953c4611296a827abf8c47804d7\n```\n\n正如你所看到的，一个大写字母的改变就产生了巨大的差异。\n\
  \n现在，如果你使用另一个单词“Hello There”，你会得到：\n\n```\n32b170d923b654360f351267bf440045\n```\n\
  \n两个单词的 MD5 哈希值长度与之前包含一个单词的示例相同。通过知道你的哈希值始终是相同的长度，你可以判断一个看似无关的字符字符串是否符合某种标准。\n\n\
  此外，思考一下为什么你不在 Linux 服务器上加密密码，然后在用户登录时解密系统的密码文件。答案简单来说是因为是因为加密数据的过程是可以被反转的，而单向函数比加密密码更好。有些人发现读到\
  \ `/etc/shadow` 文件实际上根本没有记住用户的密码，只是记录了它的加盐哈希值（salted-hash）版本，会感到惊讶。\n\n为什么 Linux\
  \ 上的 `/etc/shadow` 密码文件中的条目看起来是这样？乍一看，它看起来像是某种加密。\n\n```\nchrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::\n\
  ```\n\n用户 `chrisbinnie` 的条目长得多，是因为 Shadow Suite 使用盐（salt）来进一步增强密码。用户在 Linux 系统上输入密码后，默认会使用盐。\n\
  \n在 Linux 的 `crypt` 软件包中，这是一个从字符集中选取的两个字符的字符串。它们可以是我的英语字符集（a-z, A-Z, 0-9./）中的任何字符。在选择了盐之后，用于哈希用户密码的原始算法会被\
  \ 4,096 种不同方式中的一种进行“扰动”。然后盐会被保存到编码后的密码中。\n\n让我们再多想一下 Linux 密码。现代 Linux 系统通过 Shadow\
  \ 密码增强了你的密码安全性。以前，密码存储在 `/etc/passwd` 文件中，系统上的每个用户都可以读取。然而，只有 root 用户可以读取 `/etc/shadow`\
  \ 文件，这允许正确执行其他策略，例如密码过期策略。\n\n用户登录过程的工作原理如下：当有人登录机器时，会从 `/etc/shadow` 文件中该用户的相关条目读取盐。接下来，用户输入的密码将用刚刚读取的盐进行编码。此过程的结果将与\
  \ `/etc/shadow` 中保存的密码进行比对。如果它们相同，则允许用户访问。既明又简单。\n\n攻击密码列表的一种常见方法是预先知道许多常用密码的哈希值，并将它们与所有\
  \ 4,096 种可用盐值相结合。这被称为字典攻击。\n\n有人说，今天密码安全的最低要求应该是包含多种哈希算法。事实上，如果我数得没错，数量超过了 90 种。`Hashcat`\
  \ 支持许多类型的哈希算法，如 MD5、SHA1 和 NTLM。除了其令人惊讶的算法支持，攻击模式包括暴力破解、字典攻击、基于规则的攻击和指纹攻击。\n\n###\
  \ 安装\n\n在本文写作时，`Hashcat` 的当前版本是 `v2.00`。如果在你的发行版的仓库中找到 `Hashcat`（假设你无法找到），你可以前往网站下载最新的二进制文件。`v2.00`\
  \ 的直接链接在这里：[`hashcat.net/files/hashcat-2.00.7z`](https://hashcat.net/files/hashcat-2.00.7z)。\n\
  \n你应该检查此页面 [`hashcat.net/hashcat/`](https://hashcat.net/hashcat/) 以确保下载的是最新版本。\n\
  \n下载完成后，只需解压 `.7z` 文件，并确保对提取文件的目录具有写入权限。如果你在任何 Debian 派版上解压遇到困难，可以通过以下命令安装 `7za`\
  \ 软件包：\n\n```\n## apt-get install p7zip-full\n```\n\n在 Red Hat 派版上，你可能需要添加存储。完成后，以下命令应该对你有效：\n\
  \n```\n## yum install p7zip p7zip-plugins\n```\n\n接下来，要使用 `x` 解压压缩文件并保留目录名，运行 `7za`\
  \ 文件如下：\n\n```\n## 7za x hashcat-2.00.7z\n```\n\n注意 `x` 前面没有减号，这是通常的用法。那不是错误。\n\n\
  \n\n\n完成上述操作后，你现在可以 `cd` 进入新创建的 `hashcat-2.00/` ，其中包含许多文件和子目录。特别值得关注的是 `docs` 和\
  \ `examples` 目录，你可以尽情探索它们。别担心，稍后我们将介绍如何运行 Hashcat 可执行文件。\n\n顺便提一下，如果你对最新的开发版本感兴趣，可以在\
  \ GitHub 上找到页面，地址为 [`https://github.com/hashcat/hashcat`](https://github.com/hashcat/hashcat)。该页面还包含了文档和指向\
  \ wiki 的链接，这些应该会引起你的兴趣。\n\n如果你运行的是复杂的渗透测试套件 Kali Linux，那么得益于它是内置的，你应该能够按照以下方式安装\
  \ Hashcat：\n\n```\n## apt-get install hashcat\n```\n\n### 哈希值识别 (Hash Identification)\n\
  \n在使用 Hashcat 之前，有几点需要考虑。你首先需要知道你正尝试从中恢复密码的哈希类型。\n\n让我们考虑一下 Linux 用户密码。使用的默认哈希算法会随着时间的推移而定期变化，并且取决于发行版。过去，常见的默认值是\
  \ MD5 和 DES，但现在 SHA512 已经非常常见。\n\n如果你能识别出你正在攻击的是什么哈希类型，对 Hashcat 很有帮助。你可以运行以下命令来发现正在使用哪种哈希算法：\n\
  \n```\n## authconfig --test | grep hash\n```\n\n如果你担心机器的安全性，并想升级机器 Shadow 密码所使用的哈希算法，可以使用以下命令：\n\
  \n```bash\n## authconfig --passalgo=sha512 --update\n```\n\n在这个示例中，如果你想的话，可以将 `sha512`\
  \ 替换为 `sha256`。但请注意，为了使此更改生效，你需要用户更改密码，以便将它们转换为新的哈希类型。你可以使用以下命令让用户密码过期，强制用户在下次登录时更改：\n\
  \n```bash\n## chage -d 0 chrisbinnie\n```\n\n此示例中的“更改年龄”命令将过期日期推到了 1970 年 1 月 1\
  \ 日，这确保了它始终早于系统时钟的当前设置。\n\n让我们再次查看我为用户 chrisbinnie 提供的 `/etc/shadow` 条目：\n\n```\n\
  chrisbinnie:$6$TRIYWb5l$ef6Tm54qpV2nYCn6f20b7w/5nvp8zpsjacFqeTwqx7fCeW3plG2pkKsGgf1CtWzWhHOPWykFGrfPGmCde4HWY/:12231:3:32:11:32::\n\
  ```\n\n你不需要运行 `authconfig` 命令就能确定示例条目使用的是 SHA512 哈希。你可以参考表 9.1 中的代码推断出这一点。\n\n|\
  \ 符号 | 哈希算法 |\n| :--- | :--- |\n| $0 | DES |\n| $1 | MD5 哈希 |\n| $2 | Blowfish |\n\
  | $2A | Eksblowfish |\n| $5 | SHA256 |\n| $6 | SHA512 |\n\n表 9.1 如何识别哈希算法\n\n在 Shadow\
  \ 密码示例中，在用户名后的两个美元符号之间直接有这三个字符：`$6$`。从表 9.1 中你可以看出 `/etc/shadow` 密码使用的是 SHA512。这是一个好消息，因为它是一种强算法。\n\
  \n密码条目的下一部分（从 `$6$` 之后到下一个美元符号之前）是盐（salt）。在这种情况下，它是 `TRIYWb5l`。\n\n密码（使用盐加密）是美元符号之后到第一个冒号之前的下一部分。此之后，冒号之间的其他部分为系统提供了一些相关的登录信息，例如用户密码何时过期、最后一次更改时间是什么时候等。\n\
  \n为了衡量更强的算法是什么时候开始使用的了，请考虑这一点：根据 Fedora 的说法，从 Fedora 8 开始，`glibc` 包就已经支持了 SHA256\
  \ 和 SHA512 哈希。因此，从 Fedora 9 开始，就可以使用 SHA256 和 SHA512 作为密码。\n\n如果你卡住了，可以查看网站 [`http://verifier.insidepro.com`](http://verifier.insidepro.com)\
  \ 来确定你想让 Hashcat 指向哪种哈希变体。我这里使用的示例哈希值成功率有限，因为它们是使用另一个网站的工具生成的，所以请注意，识别未知类型的哈希算法可能需要你一些时间。\n\
  \n如果有用的话，尝试运行以下命令来生成一个带盐的 MD5 密码（你需要安装 `openssl`）：\n\n```\n## openssl passwd -1\
  \ -salt 123 PASSWORD\n$1$123$YPya29UI1XS9hz1d23ltx/\n```\n\n从运行该命令的结果中，注意 `$1$`\
  \ 和 `123` 相对于加密密码的位置。\n\n我有时会像这样运行 MD5 哈希测试（不带盐）：\n\n```\n## echo PASSWORD | md5sum\n\
  827cc519a664485351d0e56f8dc6292e\n```\n\n\n\n\n```\ncharsets/  hashcat-cli32.exe\
  \  hashcat-cliXOP.bin  tables/  hashcat-cli64.app  hashcat-cliXOP.exe\ndocs/  hashcat-cli64.bin\
  \  rules/  hashcat-cli32.bin  examples/  hashcat-cli64.exe  salts/\n```\n\n从我的目录列表可以看到，有很多不同类型的可执行文件。\n\
  \n对于你的用途，任何以 `.bin` 结尾的文件都足够。如果由于某种原因你的 `.bin` 文件无法立即执行，那么像通常一样，你只需要输入 `chmod +x\
  \ <executable>` 来解决这个问题。我将使用名为 `hashcat-cli64.bin` 的 64 位命令行界面版本，这与我机器的能力匹配。\n\n\
  显然，该目录下显示的不同 Hashcat 可执行文件适用于你机器处理器可能提供的各种特性。你感兴趣的另一个相关的 `.bin` 文件名称中添加了 XOP，它代表\
  \ `eXtended OPerations`（扩展操作）指令。如果你以后想更深入地使用 Hashcat，可以研究一下你的处理器标志，并选择哪个可执行文件可以充分利用你的特定系统。例如，根据论坛说法，AMD\
  \ 处理器适用于 XOP 版本。\n\n现在让我们来看运行你的 Hashcat 可执行文件。`hashcat` 命令的语法如下：\n\n```\n## hashcat\
  \ [options] hashfile [mask|wordfiles|directories]\n```\n\n下载（或生成）了你的字典并将其保存为文件名\
  \ `wordlist.txt` 后，你就可以继续了。在你使用命令 `cd examples/` 进入 `examples` 子目录后，考虑这个示例命令：\n\n\
  ```\n# ./hashcat-cli64.bin -m0 -a0 A0.M0.hash A0.M0.word\n```\n\n`-m` 选项意味着你正在指定\
  \ MD5 哈希，而 `-a 0` 选项意味着你想让 Hashcat 执行字典攻击（也称为直击攻击）。作为参考，如果你指定了 `-m1800`，则指的是你首选的现代\
  \ Unix 哈希算法 SHA512。\n\n正如你可能猜到的那样，`examples` 目录下的 `A0.M0.hash` 文件是你的哈希列表。这些哈希是经过剥离的，没有在前面添加盐值的\
  \ `<username>:` 部分，也没有在后面附加密码过期信息（包括其后的冒号）。你应该这样收集哈希。\n\n`A0.M0.word` 文件是你作为单词列表的潜在密码字典。\n\
  \n顺便提一下，如果你想将结果直接输出到文件而不是屏幕，可以简单地添加 `-o <filename>`；或者在发现某个哈希的密码后想从满是哈希的文件中删除该行，可以添加\
  \ `--remove`。\n\n运行 `hashcat` 命令的结果如下（采用高度缩略形式）：\n\n```\n651e96f9b94e1a3a117eade5e226bd1e:y[N\"\
  %e?U{<k[‘x<TlG U6Z\n465133fae5a994afb03c7158260b2e8d:kCQArZz)It\nAll hashes have\
  \ been recovered\nInput.Mode: Dict (A0.M0.word)\nIndex…..: 1/1 (segment), 102 (words),\
  \ 2769 (bytes)\nRecovered.: 102/102 hashes, 1/1 salts\nSpeed/sec.: - plains, 102\
  \ words\nProgress..: 102/102 (100.00%)\nRunning…: 00:00:00:01\nEstimated.: --:--:--:--\n\
  ```\n\n前两行包含冒号之前的哈希，冒号之后是发现的密码。输出的其他部分显示你的整个文件都成功了。\n\n一旦你掌握了这些示例，尝试处理你自己的 `/etc/shadow`\
  \ 哈希。如果你运气好，在运行调整后的命令后，你应该看到一个或多个哈希，后面跟着对应的明文密码。如果你没有获得足够的命中，就不断实验直到对结果满意。要让一切按预期运行可能需要一些尝试和错误；我建议先熟悉这些全面的示例。如果你遇到困难，请记住并不是所有密码都能在瞬间被破解。\n\
  \n尽管如此，一旦你理解了理论并尝试了它的它的基本功能，Hashcat 的操作就非常简单。从 Linux 系统管理员的角度来看，这应该是你关注的，因此你应该注意你的服务器所使用的哈希算法。\n\
  \n还有许多选项留给你自行探索。例如，在示例命令旁边运行规则的选项简单就是 `-r rules/specific_rule.rule`。\n\n我承诺过让你查看一些相应的哈希值和攻击模式。哈希的数量太多，无法列出，但\
  \ Hashcat 网站提供了它们，以及帮助所需的详细信息，地址为 [`http://hashcat.net/wiki/doku.php?id=example_hashes`](http://hashcat.net/wiki/doku.php?id=example_hashes)。\n\
  \n你可以使用的某些攻击模式（其中 0 被称为“直击”，换句话说匹配字典或单词列表）如表 9 所示。\n\n| 数字 | 攻击模式 |\n| :--- | :---\
  \ |\n| 0 | 直击（字典或单词列表） |\n| 1 | 组合 |\n| 3 | 破解（掩码攻击） |\n| 6 | 混合 |\n\n## 掩码攻击\n\n\
  掩码攻击的主要原理是缩小空间大小，从而加快运行时间。文档提供的一个巧妙示例是，通过 Hashcat 的创新技术，你可以将密码 `Julia984` 的恢复时间从大约四年缩短到四十分钟。\n\
  \n你通过在标准命令末尾添加掩码来运行掩码攻击，如下：\n\n```\n# hashcat -m 1800 -a 0 -o discovered_passwords.txt\
  \ hashes.txt wordlist.txt -1 ?dabcdef\n```\n\n在这种情况下，添加的 `-1 ?dabcdef` 要求 Hashcat\
  \ 遍历 `0123456789abcdef`。\n\n根据文档，此掩码 `-1 ?l?d?u` 提供完整的 7 位 ASCII 字符集，称为字母数字空格。Hashcat\
  \ 有许多内置字符集选项，例如 `?l`（代表 a 到 z 的所有小写字母）和 `?u`（代表 A 到 Z 的所有大写字母）。\n\n你可以在此处找到更多关于掩码攻击的细节：[`https://hashcat.net/wiki/doku.php?id=mask_attack`](https://hashcat.net/wiki/doku.php?id=mask_attack)。\n\
  \n## oclHashcat\n\n使用 oclHashcat 和 Hashcat 需要非常相似知识水平，因为它们的操作几乎相同。尽管它们之间有一些不同之处\
  \ —— 例如，与 Hashcat 相比，oclHashcat 加载字典的方式 —— 如果切换到 oclHashcat，可以预期有一个平缓的学习曲线。\n\n\n\
  \n\n此外，正如我已经提到的，必要的密码破解计算使用了你系统中完全完全不同的组件。简单来说，`oclHashcat` 使用的是显卡而非 CPU。这里有两个重要的软件版本需要区分，每种版本都适用于两种流行的\
  \ GPU：\n\n- `cudaHashcat`，用于 Nvidia（英伟达）显卡\n- `oclHashcat`，适用于 AMD 显卡\n\n（在正确配置的情况下）GPU\
  \ 的速度比 CPU 快得多，因为它们专门设计用于快速处理数字，通常是用于处理图形的。虽然 GPU 本身显然是为了速度而设计的，但在性能方面，CPU 可能会因为其额外的、包含性的功能集分散注意力，导致吞吐量降低。因此，GPU\
  \ 是计算大量数据的良好选择，因为它们可以得到更好的优化。还可以通过将它们连接成链状来几乎无缝地扩展 GPU 输出，从而更方便地利用它们的合力。为了让你对 GPU\
  \ 有多快有一个直观的认识，如果你使用彩虹表并划分密钥空间（美国键盘上提供的 95 个字符），你每秒可能会达到 10 万亿次明文测试！\n\n在学习 Hashcat\
  \ 和 `oclHashcat` 方面，我建议先让 Hashcat 运行，然后阅读如何让你的显卡 GPU 驱动程序工作。更多信息可以在 `http://hashcat.net/oclhashcat/`。\n\
  \n如果这引起了困惑，`oclHashcat-plus` 已不再使用并被认为已弃用。因此，“plus”版本并没有用处。\n\n## Hashcat-Utils\n\
  \nHashcat 套件中另一个值得提及的组件是一组名为 `Hashcat-utils` 的工具集。这组实用工具可以从 `http://hashcat.net/wiki/doku.php?id=hashcat_utils`\
  \ 下载。\n\n这些工具包括 `combinator`，它是一个独立的程序，你可以通过它运行组合攻击。你可以在 `https://hashcat.net/wiki/doku.php?id=combinator_attack`\
  \ 找到更多信息。\n\n你还可以使用 `cutb` 工具对字典列表文件进行修剪和切割，你可以用它来清理字典列表文件中常见的、不需要的前缀或后缀字符。\n\n\
  该包中的另一个工具 `rli` 类似于 Unix 类型的命令，它在比较一个文件与其他一个或多个文件后，简单地删除重复文件。\n\n进一步探索这些工具绝对值得增加你对\
  \ Hashcat 工作原理的了解。\n\n## 总结\n\n在本章中，你查看了密码攻击背后的一些理论。我还涵盖了字符集包含的组合数量的重要性、密码长度以及它们的组合如何影响密钥空间。最后，我描述了哈希（hashing）和加盐（salting），这些确保了破解密码的时间显著增加。\n\
  \n能够高效地破解密码需要多年才能掌握，这确实是一个多层面的领域。然而，资深的 Hashcat 可以帮助你轻松完成学习过程。它还有一个详细的 FAQ，可以在 `http://hashcat.net/wiki/doku.php?id=frequently_asked_questions`\
  \ 找到。\n\n现在你已经看到了攻击者将用来破解你密码的方法，以及你可以增加他们工作难度的方法，如果你在自己的机器上发现了我讨论过的任何工具的痕迹，就应该加加注意。有了你新获得的力量，希望不需要再提醒你负责任地使用你的技能。\n\
  \n# 第 10 章：SQL 注入攻击\n\n最流行的在线攻击类型之一被称为 SQL 注入，有时缩写为 `SQLi`。这些攻击涉及使用结构化查询语言（`SQL`）向数据库插入代码，攻击者可以从数据库中检索数据或覆盖现有数据。\n\
  \n你可能会惊讶地发现，根据 OWASP（开放 Web 应用安全项目， latter 一个促进软件安全的慈善组织），`SQLi` 是 2013 年在线服务的首要威胁，并被列为\
  \ `https://www.owasp.org/index.php/Top_10_2013-Top_10` 最常见的威胁。\n\n本章将介绍这些攻击涉及的内容、如何保护你的网站免受此类攻击，最后介绍为了渗透测试的目的如何自己发起攻击。\n\
  \n不用说，这是一个宽泛且复杂的领域，需要一定的背景知识才能执行更复杂的攻击。然而，你可能会惊讶于，只需运行几个命令并仅凭一点数据库知识，就能让一个脆弱的在线服务瘫痪。单就此而言，IT\
  \ 专业人员必须意识到 SQL 注入带来的风险以及如何减轻其影响。\n\n## 历史\n\n考虑到其简单性，`SQLi` 如此有效使其成为一种可怕的攻击类型。\n\
  \n初级开发者请注意，因为涉及安全问题时，系统管理员通常不对此类攻击的发生直接负责。这是因为很多时候，漏洞的产生是因为代码没有正确转义特殊字符。除了简单性外，另一个担忧的原因是据报道这种攻击从\
  \ 1998 年起就为人所知。当年 12 月出版的一期 `Phrack Magazine` 首次宣布了一种针对网站的广泛漏洞。随着时间的推移，恐怖局面开始展开，人们显而易见，可以使用几个自动化工具扫描网络寻找网站，然后根据自己的意愿对其进行脸上破坏或盗取数据。\n\
  \n然而，情况并未止于此。随着钓鱼攻击变得越来越流行（攻击者诱骗用户泄露自己的信息），狡猾的攻击者通过注入必要的代码对网站进行完全重新品牌，以说服访问者他们访问的是正法的网站。\n\
  \n多年来，我为技术水平较强的客户运营着一个非常小的托管服务器 ISP。至少在三个场合，我们的托管服务器客户（由于无意中在服务器端脚本上不够细致）陷入了钓鱼攻击。从\
  \ 2000 年代中期开始，在短短几年内，美国联邦调查局曾与我们联系（一次是银行，另一次是白色安全服务公司），告知某个客户服务器被黑了。所以，即使在这样一个小组织中，一个热门拍卖网站的虚假副本和两个银行网站也在极短时间内被克隆并用于对我们网络的钓鱼攻击。显而易见，SQL\
  \ 注入攻击正在那些心怀不轨胎的人中变得流行。\n\n针对这种常见的安全威胁，系统管理员和开发者注意到了并开始加固代码。我记得那个时期，在基于 PHP 的网站上，每个用户输入组件都会勤谨地转义特殊字符，以避免\
  \ SQL 注入攻击。\n\n## 基础 SQLi\n\n正如我已经提到的，`SQLi` 的主要前提是从数据库中非法地检索代码或向数据库中注入代码。\n\n为了避免这些问题，你不能再通过服务器端语言向外部暴露查询，这会导致你的网站变得非常不流畅且不实用。如果不这样做，你可以确保覆盖所有的攻击向量。实现这一目标最简单的方法是过滤你从访问者那里接收到的所有输入。换句话说，在你网站上用户可以输入数据的每个点，你都需要在代码中采取预防措施。这涉及到在数据发送到数据库之前将其解析为易友的格式。\n\
  \n\n\n\n\n关于如何保护你的代码安全的完整教程可以留到以后再说。不过，我将使用一种流行的编程语言为你进行快速的复习。在此之前，我会先提醒你一些 SQLi（SQL\
  \ 注入）运行的简单原理。\n\n正如我所说的，仅仅篡改网站远不是拦截的 SQL 能够造成的唯一破坏。例如，考虑这个 SQL 语句：\n\n```sql\nsql-server>\
  \ DROP TABLE special-offers;\n```\n\n通过获取表名，你可以完全从数据库中删除一个表。除了破坏性行为外，我还没有提到从数据库中提取用户名和密码。如果带有犯罪意图，成功的\
  \ SQL 攻击无疑是一个值得追求的奖赏。一些大型品牌已经沦陷于编写不当的代码和 SQLi 的受害者。据报道，Yahoo、Adobe、LinkedIn 和 Sony\
  \ Music 可能都在这一长长长的受害者名单上。当然，由于我既不是攻击者之一，也不是负责恢复受此类攻击影响的服务的工作人员，我只能推测这些攻击涉及 SQLi\
  \ 的程度。你可以在 `http://codecurmudgeon.com/wp/sql-injection-hall-of-shame/` 找到“SQL 注入耻辱柱”。尽管该列表可能完全准确，但我相信你会同意这是一篇非常引人入胜的文章。\n\
  \n刚才，我提到了一种编程语言。我将使用据认为是世界上最流行的服务器端脚本语言 `PHP` 作为示例，快速演示 SQLi 是如何工作的。`PHP` 不仅直接用于数百万个网站，强大的\
  \ `PHP` 还用于世界上最流行的内容管理系统（CMS）WordPress（`https://wordpress.com`）以及许多其他动态网站应用程序，如\
  \ Joomla!（`https://www.joomla.org`）。简而言之，`PHP` 无处可见，如果发现了漏洞，它将成为攻击者的容易目标。\n\n让我们来看另一个例子，但这次是在\
  \ `PHP` 中实现的：\n\n```php\n$input = $variable[3];\n$dbquery = \"SELECT id, item, price\
  \ FROM specialoffers ORDER BY id LIMIT 15 OFFSET $input;\";\n```\n\n看第一行，你可以看到你没有过滤名为\
  \ `$input` 的变量。这意味着当该变量在第二行的 SQL 语句中使用时，它可能包含攻击者想要使用的任何代码。通过注入经过精心构造的代码，可以造成各种混乱。\n\
  \n另一个例子是更新系统管理员（sysop）用户的密码。例如，`PHP` 代码中的一个普通 SQL 语句可能像这样：\n\n```php\n$dbquery =\
  \ \"UPDATE credentials SET passwd='$password' WHERE userid='$id';\";\n```\n\n通过向此语句添加\
  \ SQL，例如 `or userid like '%sysop%'`，你的 SQL 就会变得不那么严格了，你要求数据库快速搜索其他类似于 sysop 的特权用户名（例如\
  \ sysops），然后也更新它们的密码。\n\n令人担心的是，还可以执行包含在 SQL 内部的 shell（壳）命令。某些数据库服务器允许通过这种方法访问操作系统命令。\n\
  \n## 在 PHP 中缓解 SQLi\n\n正如我所说的，这个领域太大，无法详细介绍，但如果不简要查看如何过滤 SQL 输入以帮助缓解 SQLi 攻击将是我的失。有很多\
  \ `PHP` 函数可以帮助你完成这项任务。截至本文时，`PHP` 正在从当前的版本 `5.6.16` 向 `7.0.0` 版本重大迁移（尽管版本号可能会继续增加）。\n\
  \n需要注意的是，在旧版本（直到 `5.3.0`）中，在你的主 `PHP` 配置文件（`php.ini`）中，可以使用 `magic_quotes_gpc` 通过\
  \ `PHP` 过滤（或转义）所有的输入数据。这显然被废弃了，因为它被过度依赖，而且并不总是能以使应用程序安全的方式转义字符。本质上，魔法引号（magic quotes）并不是为了安全目的设计的，但被当作那样使用了。\n\
  \n为了保护第一个 SQL 示例中使用的变量，你可能希望通过 `stripslashes` 函数处理你的用户输入。示例看起来如下：\n\n```php\n$input\
  \ = $variable[3];\n```\n\n使用 `stripslashes` 后，它可能像这样：\n\n```php\n$input = stripslashes($variable[3]);\n\
  ```\n\n正如你所猜的的，这意味着你正在移除斜杠以帮助防止不良的输入。还有 `trim` 用于删除变量中的空格，可以用同样的方式使用，以及 `strip_tags`\
  \ 用于删除 HTML 和其他标记标签。这些都可以有用，并且为了方便组合在一起，例如：\n\n```php\n$input = stripslashes((trim($input));\n\
  ```\n\n此外，在 `PHP` 版本 `5.5.0` 之前，你可以使用 `mysql_real_escape_string` 函数来如下清理单个字符串：\n\
  \n```php\n$input = mysql_real_escape_string($input);\n```\n\n然而，从版本 `7.0.0` 及以后，你几乎总是想要使用一个名为\
  \ `MySQLi` 的改进驱动（代表 MySQL improved）来对抗 SQLi。得益于这种增强，你可以采用更高级的方法从正在执行的代码中删除不必要的且潜在危险的字符。使用\
  \ `mysqli` 的示例与之前的示例没有太大区别：\n\n```php\n$input= mysqli_real_escape_string($input);\n\
  ```\n\n使用 `MySQLi`，你使用不同的方法连接数据库，如下：\n\n```php\n$mysqli = new mysqli(\"localhost\"\
  , \"userid\", \"passwd\", \"DB_name\");\n```\n\n另一种值得注意的方法从早期的 `PHP` 版本就可以用了，并使用了\
  \ PHP 数据对象（PDO）。这里有一个好的讨论：`http://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php`。\n\
  \n关于哪种方法最好仍有争议，但 PDO 看起来非常流行。PDO 的示例如下：\n\n```php\n$input = $pdo->prepare('SELECT\
  \ * FROM special_offers_table WHERE offer = :specialoffer');\n$input->execute(array('name'\
  \ => $specialoffer));\n```\n\n这种新的、首选的方法使用新库过滤你的参数。注意之前变量值所在位置问号。\n\n```php\n$input\
  \ = $mysqli->prepare(\"INSERT INTO table_name (column_name) VALUES (?)\");\n$input->bind_param(\"\
  s\", $actual_user_input);\n$input->execute();\n$input->close();\n```\n\n\n\n\n\n\
  `sqlmap` 的广泛兼容性足以让大多数勤奋的系统管理员感到担忧。根据其网站，`sqlmap` 支持以下数据库服务器：MySQL、Oracle、PostgreSQL、Microsoft\
  \ SQL Server、Microsoft Access、IBM DB2、SQLite、Firebird、Sybase、SAP MaxDB 和 HSQLDB。\n\
  \n让我们来看看如何安装 `sqlmap`。它包含在像 Kali Linux 某些基于安全性的发行版中，但如果你的包管理器仓库中没有它，还有其他安装方法。\n\n\
  你可以使用 Git 的 `clone` 命令来使用 GitHub 上的 `sqlmap` 仓库：\n\n```\n## git clone https://github.com/sqlmapproject/sqlmap.git\
  \ sqlmap-dev\n```\n\n你也可以从 [`https://github.com/sqlmapproject/sqlmap/zipball/master`](https://github.com/sqlmapproject/sqlmap/zipball/master)\
  \ 获取一个 Zip 文件。\n\n你也可以从 [`https://github.com/sqlmapproject/sqlmap/tarball/master`](https://github.com/sqlmapproject/sqlmap/tarball/master)\
  \ 下载 tarball 包。\n\n一旦你遵循了安装说明，你应该能够进入可以运行以下命令的阶段（在运行之前的 Git 命令后，你只需要执行此即可开始）：\n\n\
  ```\n## cd sqlmap-dev\n## python ./sqlmap.py -h\n```\n\n此命令将为你提供选项列表。\n\n## 启动攻击\n\
  \n现在让我们来看 `sqlmap` 功能的核心，即入侵远程机器。\n\n但请注意，测试你的 `sqlmap` 技能的一个耗时方面可能涉及搭建自己的漏洞测试服务器，或者合法地识别易受攻击的网站。你可能会对此感到惊讶，因为\
  \ URL 的形成方式，Google 可以很容易地识别出漏洞网站。不用多说，我不建议攻击通过 Google 或任何其他方法发现的任何网站。然而，为了发现可能被利用的\
  \ URL，你可以输入如 `inurl:website.php?id=` 或 `inurl:product.php?id=` 之类的查询。第一个搜索词返回了令人担忧的\
  \ 170 万条结果。\n\n通过 Google 极不专业地暴露其漏洞的网站和其他在线资源获得了一个绰号，“Googledorks”。有一个网站列出了其中一些；它值得快速看一眼，地址为\
  \ [`www.hackersforcharity.org/ghdb/`](http://www.hackersforcharity.org/ghdb/)。列表包含了许多潜在的秘密登录页面、敏感目录以及提到用户名的文件。请负责任地使用这些信息。\n\
  \n顺便说，你可以通过 Python 运行 `sqlmap`，这意味着你的机器上需要安装某种 Python 实现。\n\n在 图 10.1 中，你可以看到开发者渴望远离非法活动。此类强大的工具总是会被滥用。\n\
  \n让我们继续。看接下来的示例，使用 `sqlmap` 命令所需的语法非常简单：\n\n```\n## python sqlmap.py -u http://www.a-vulnerable-website.com/product.php?id=1111\n\
  ```\n\n![插展示了 sqlmap 启动时的样子](img/c10f001.jpg)\n\n**图 10.1** 启动 sqlmap 时的界面，包含免责声明\n\
  \n如果你在使用低速连接或遇到远程数据库服务器响应缓慢的情况，可以向该命令添加 `--time-sec 10` 以引入更真实的超时设置。虽然有些违反直觉的是，这实际上可以加快整个过程。\n\
  \n现在让我们有条理地执行几个简单命令。一旦你熟悉了使用 `sqlmap`，可以将它们全部链接起来。\n\n我的 `sqlmap` 示例命令包含了 `-u` 选项，这意味着声明了一个\
  \ URL。该命令将通过多种 SQL 注入测试检查末尾参数（`id=1111`）的漏洞。从那里开始，`sqlmap` 通常可以检测 Web 服务器厂商和版本、远程操作系统以及正在使用的数据库服务器版本。\n\
  \n如果你现在想学习该目标网站正在使用的数据库名称怎么办？你可以通过如下方式添加 `--dbs` 选项来实现：\n\n```\n## python sqlmap.py\
  \ -u \"http://www.a-vulnerable-website.com/product.php?id=1111\" --dbs\n```\n\n\
  获取了这些有用信息后，你的下一步是发现正在使用的表名。你可以按照如下方式操作，将你的数据库名称替换为 `<database-name>` 条目：\n\n```\n\
  ## python sqlmap.py -u \"http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ --tables -D <database-name>\n```\n\n下一个逻辑步骤将是学习感兴趣的数据库表所使用的列。命令如下，再次将你的数据库名称替换为\
  \ `<database-name>` 条目，并将 `<table-name>` 替换为你的表名：\n\n```\n## python sqlmap.py -u\
  \ \"http://www.a-vulnerable-website.com/product.php?id=1111\" --columns -D <database-name>\
  \ -T <table-name>\n```\n\n该过程的最后部分是从目标提取所有数据。这可能包括用户名和密码、个人客户信息。要转储数据库，如所示引入 `--dump`\
  \ 选项：\n\n```\n## python sqlmap.py -u \"http://www.a-vulnerable-website.com/product.php?id=1111\"\
  \ --dump -D <database-name> -T <table-name>\n```\n\n如果你只想提取特定的列，可以直接指定它们。一旦你知道了列名，只需使用诸如\
  \ `-C columnX, columnY` 的选项将其列出，并用逗号分隔。这样做之后，只需移除上一个示例中的 `--columns` 选项即可。\n\n你的最后一个命令可能会产生类似下面的输出：\n\
  \n```\n+-------+----------------+----------+----------+------------+--------------+\n\
  | id    | title          | color    | price    | category  | received-date|\n+-------+----------------+----------+----------+------------+--------------+\n\
  | 1111  | bars of soap   | green    | 1.22     | toiletries | 11.11.22     |\n+-------+----------------+----------+----------+------------+--------------+\n\
  ```\n\n\n\n\n\nCodebashing 网站提供的在线演示也可能对你感兴趣。他们将自己巧妙且互动式的网站描述为“由程序员为程序员编写的应用程序安全培训”。该演示展示了特殊字符如何对登录过程产生巨大影响，并带你了解当你更改输入时，底层数据库服务器是如何反应的。你可以在\
  \ [`www.codebashing.com/sql_demo`](http://www.codebashing.com/sql_demo) 找到该演示。\n\
  \n## 总结\n\n在本章中，我涵盖了 SQL 注入的基础知识，并简要回顾了 SQL 攻击的历史。此外，你还看到了 `PHP` 开发人员如何建议防御与 `MySQL`\
  \  SQLi 攻击，既包括过去针对旧版本的建议，也包括针对新版本的建议（特别是针对 `7.0.0` 之后的版本）。\n\n很容易看出为什么 SQLi 攻击如此盛行——事实上，在某些领域，它被认为是最受欢迎的攻击类型。通过使用几个相对简单的\
  \ `sqlmap` 命令，你就掌握了潜在攻破网站安全的力量，并查询、窃取其宝贵数据，随后进一步通过破坏性行为损害其声誉。\n\n对于防御此类攻击的技术人员而言，意识到这些攻击是多么简单，并理解这些看似简单的错误所带来的影响至关重要。这些错误可能会让网站（这些网站可能花费了大量精力和资源）遭受毁灭性的攻击，而恢复这些损失的代价巨大。再次强调，请负责任地使用这些技能。妥善保护你自己的基础设施比攻击他人的基础设施要有成就感得多。\n\
