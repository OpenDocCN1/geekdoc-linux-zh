- "# Linux 服务器安全第一版：攻击与防御\n\n\n\n\n\n\n# 指南\n\n1. 封面\n2. 目录\n3. 开始\n\n# 引言\n\n考虑一下，即使是广为人知的网络攻击，执行起来也可能非常简单。在系统或网络上发起攻击所需的步骤从极其复杂到简单得令人恐惧不等。如果一个系统运行某些带有已知漏洞的软件且未保护，就会出现这种情况。\n\
  \n经验较少的攻击者，其手段可能仅仅是对看似无尽的端口扫描进行自动化，打开连接并迅速关闭，或者不知疲地寻找显示服务版本的横幅。如果发现某个版本与其其中的版本匹配，那么攻击者就确定了目标。在攻击的这一阶段，由于几乎是全自动，你甚至可以说这仅仅是计算机在攻击计算机。\n\
  \n# 第一章 数字化\n\n图 1.1 Nmap 似乎。\n\n# 第二章 指纹\n\n图 2.1 自动生成临时证书。\n图 2.2 Hashcat 示例\n\
  图 2.3 rkhunter 的部分输出\n图 2.4 maldet --report 报告\n图 2.5 使用 inotify 监控两个分区\n图 2.6 Rootkit\
  \ Hunter 进行检查。\n\n# 第三章 二世纪 Netcat\n\n表 3.1 Debian 和 Ubuntu 包名\n\n# 第五章 Nping\n\n\
  表 5.1 负载选项及其描述\n\n# 第六章 日志侦查\n\n表 6.1 内核源文件 `include/linux/icmp.h` 中的 ICMP 代码\n\n\
  # 第七章 Nmap 强大的 NSE\n\n表 7.1 自带的脚本分类\n\n# 第八章 恶意软件\n\n图 8.1 根据 LMD 的 60 种常见攻击\n图\
  \ 8.2 LMD 提供的大量功能列表\n图 8.3 当你要求 LMD 监控特定路径时看到的内容\n图 8.4 使用 `maldet --report` 命令\n\
  图 8.5 使用 otify 监控两个分区\n\n# 第九章 使用 Hashcat 破解密码\n\n表 9.1 如何识别哈算法\n表 9.2 Hashcat 攻击模式及其对应的数字\n\
  \n\n\n相反，老练的攻击者会使用多种多样的方法来破坏或访问系统或网络。他们不仅经验丰富、聪明绝顶，而且创新、耐心且狡猾。他们利用社会工程学、构建定制硬件，并演练眼障法。在攻击过程中，他们会随着防御者暴露底牌而调整自己的策略，攻击也会随之演变，有时速度非常快。攻击的影响很大程度上源于充分的准备；在初始侦察期间，可能测试的攻击向量数量巨大。\n\
  \n确保在线服务的安全就像是逆水行舟，我并不乐意说，无论服务或系统加固得有多好，总会有方法可以突破或干扰它。尽管这个表述可能很大胆，但请记住，即使一个系统或网络今天没有漏洞，它在未来某个时刻出现漏洞的可能性也极高。\n\
  \n遗憾的是，这意味着除非服务器或网络设备的电源被摧毁，否则开启 `any` 电子设备的行为本身就实际上代表了他人可以利用的攻击向量。这是技术专业人员长期以来面临的现实。由此产生的网络安全方法是：权衡成功利用你的在线系统和网络对攻击者的价值，与你用于保护基础设施的可用预算之间的关系。你可能还会尝试降低单个目标的目标的价值，例如通过将你的邮件服务器与网络服务器分离。如果一个机器集群被攻破，那么只要另一个集群位于不同的防火墙之后并使用不同的备用操作系统，它们可能就不会受到影响。\n\
  \n撇开那些噩梦般的恐惧不谈，谢天，实际上只极少数极高级的攻击者，针对他们，你的防御会在某种程度上会失效（有时在几分钟内就会失效）。然而，随着互联网的成熟，熟练的攻击者越来越多，他们可以操纵其他被攻破系统和服务的力量，给毫无防备的受害者带来严重的头疼。\n\
  \n此外，尝试攻击的动机是多样的，有时难以预测。它们可能包括获得黑客社区的赞誉、在受害者面前争胜一筹、作为菜鸟新手的训练练习，或仅仅是为了经济利益。而且，考虑到涉及的最常见的人群，让我们不要忘记那些寻求刺激的人。\n\
  \n如果你的服务容易受到某些类型的意外关注，例如你的 Web 应用程序不断受到寻找安全漏洞的探测，那么常识告诉我们，你应该主要专注于让开发人员修复应用程序的缺陷。相反，如果你运行的是电子邮件服务，那么你需要绝对确保在你集群中所有邮件服务器上部署的软件保持更新，并频繁、及时地打补丁。通过关注最明显的弱点，可以限制你可能向中等技能攻击者展示的攻击面，并减少他们在你基础设施其他部分建立脚点机会。一旦你认为主要的攻击向量已基本安全，你就可以集中精力堵住那些不明显的安全漏洞。\n\
  \n通过几个简单的问题来集中你的安全思考可能会有所帮助。首先，你正试图保护什么？例如，数据库深处是否隐藏着受多个防火墙和堡垒机保护的敏感、秘密信息，还是你正在保护的是一个必须全年每天\
  \ 24 小时为其用户提供服务的在线服务？这个问题很重要，因为它影响了你如何加强防御，并可能改变你将出的防御选择。例如，你可能会每月支付高昂费用通过网络流量清洗服务来帮助防御拒绝服务攻击，而不是购买几个昂贵的高端硬件防火墙来保护你的资产。\n\
  \n其次，你如何遏制安全漏洞？如果你网络上的一个服务器或设备被攻破，是否自动意味着其他主机将面临同样的命运？如果是这样，显然你的安全策略存在需要解决的严重问题。\n\
  \n第三，你将如何从安全漏洞中恢复？你可能还会担心如果攻击者发现了你的冗余机制是如何工作的，以及你的故障转移服务将在什么阶段激活。如果你不知道攻击者最初是如何突破安全的，那么仅仅重新构建主服务器或盲目恢复网络服务可能毫无意义。你是否能够使用备用供应商的设备或软件快速恢复服务？如果是这样，你可能会降低相同攻击再次渗透你安全的可能性，从而让你在调查攻击者如何进入的同时，恢复部分（不是全部）服务。\n\
  \n# 本书的结构\n\n书中包含的章节可以任何顺序阅读，它们是作者在多年作为互联网用户的使用之旅中感兴趣的安全主题集。\n\n主题涵盖范围广泛，从过去、现在和未来攻击的理论，到对各种在线攻击的缓解和防御，一直到赋予读者执行恶意攻击的能力（希望他们能学会如何防御此类攻击）。\n\
  \n通过将各种主题分为不同的章节，将来可以参考并返回这些主题，以便读者更详细地回顾内容。各章节的内容如下：\n\n- **[第 1 章](# 隐形斗篷：** 如果攻击者看不到你的服务器并且不知道它的存在，那么从根本上就没有攻击向量可以利用。我们讨论并演示了如何在继续使用生产环境服务的同时，避开攻击者的不受关注。\n\
  - **[第 2 章](#为文件创建数字指纹：** 有许多方法可以监控服务器文件系统的完整性，以确保攻击者没有获得访问。在本章中，我们查看了手动方法和一种检查根内核（rootkits）的自动化工具。\n\
  - **[第 3 章](#二十一世纪的 Netcat：** Netcat 历史悠久，现代版本的 Netcat 得益于其大量的先进功能，已成为黑客的首选工具。学习如何识别此类工具是否被用于你的服务器，并额外如何利用其行业领先的功能。\n\
  - **[第 4 章](#拒绝服务：** 只有世界上少数几个互联网基础设施提供商能够抵御全面的、高容量分布式拒绝服务（DDoS）攻击的破坏性影响。在本章中，我们详细讨论了这一主题，甚至评论了整个国家因此类攻击导致互联网连接中断三周的情况。\n\
  - **[第 5 章](#Nping：** 了解主机运行着哪些服务只是战斗的一半。作为强大的 Nmap 安全工具的扩展，它允许你在任何主机上检查这一点，并还可以创建具有独特载荷的自定义数据包。\n\
  - **[第 6 章](#记录侦察：** 尽管针对你的服务器执行的某些探测看起来无大碍，但毫无疑问，了解它们的工作原理有助于你进一步加固服务器。我们检查了攻击者侦察你服务器脆弱点的几个方面。\n\
  \n\n\n\n\n### [第 7 章]:强大的 Nmap NSE\n许多用户可能用过 Nmap 进行简单的端口扫描，但很少有人知道这个安全工具还包含了利用远程机器的能力。我们将探索其中的许多可能性，从\
  \ Nmap 默认附带的海量脚本开始。\n\n### [第 8 章]:恶意软件检测\n一种多年来困扰 Windows 系统、有时完全静默的威胁以非法安装软件的形式出现。恶意软件对系统造成的损害范围很大，从烦人的弹出窗口到全面的在线银行账户被入侵。在本章中，我们将学习如何在\
  \ Linux 上部署一种复杂的且频繁更新的反恶意软件解决方案。\n\n### [第 9 章]:使用 Hashcat 破解密码\n技术专业人员可能会发现，有一种密码破解工具几乎可以保证破解哈希后的密码，这让他们感到震惊。这意味着如果你的哈希密码被非法获取，那么攻击者看到你的明文密码只是时间问题。本章将一步步带你完成这一过程。\n\
  \n### [第 10 章]:SQL 注入攻击\n在一次著名的调查中，SQL 注入攻击被列为最常见的在线攻击。尽管这种攻击类型可以追溯到 20 世纪 90 年代后期，即使在今天，仍有数量惊人的攻击通过编程实践不当，成功利用了属于企业和关键在线服务的网站。本章提供了一些实用的历史信息，以及关于如何识别和利用漏洞在线服务的分步说明。\n\
  \n## 谁应该读这本书\n\n这本书是为中级管理员、软件黑客和其他 IT 专业人员编写的。然而，我们希望其编写方式能让任何产生好奇的人都能快速识别出哪些章节适合那些对安全感兴趣但不一定深入理解\
  \ Linux 命令行的人。其目标是让一些读者继续更详细地研究特定章节的主题，以进一步增强他们在该主题上的知识，而其他领域对他们的需求来说可能较小，可能在日后仅作参考。\n\
  \n换句话说，按章节划分所需的经验水平没有区别，尽管那些更侧重于命令行的章节对于初学者来说可能需要付出更多努力。\n\n## 总结\n\n希望通过增加对黑客工具和心态的理解，并跟上最新的安全动态，你不会陷入如今一种非常常见的感慨中：你不再控制自己的系统或网络，而是由别人在控制。\n\
  \n# 第 1 章\n\n## 隐身斗\n\n想象一下，你可以将一个服务器从互联网中隐藏，但仍然可以访问 ISP（互联网服务提供商）的高带宽。在不进行任何更改的情况下，你可以安全地将其作为文件仓库以及其他许多用途。\n\
  \n你还对命令行拥有完全访问权限，可以启动、停止甚至安装任何你想使用的服务。选择权在于你，是短暂运行这些服务后关闭它们，还是让它们运行并在一段时间内对外界可见。\n\
  \n这通过一种被称为“端口触发”（port knocking）的技术可以实现。你可以通过关闭对外部世界的所有网络端口来伪装你的服务器，使其真正变得不可见。你通过使用预先安排的“敲门”而随心所欲打开的单个端口，可以用于你的\
  \ SSH 服务器或其他服务。在本章中，你将看到如何创建一个不可见的服务器，以及一些你可能想要考虑的选项。\n\n## 背景\n\n通过伪装服务器在互联网上的存在，最好的情况下，你可以在私下运行一台机器；最坏的情况下，即使它的存在已知，你也会通过限制端口开放的时间甚至是部分可见性，减少攻击者可以针对的攻击面。\n\
  \n### 探测端口\n\n在开始之前，让我们仔细观察服务器上的网络端口，以便你有一个参考。如果你用过像 `Nmap` 这样的安全工具，你可能熟悉一个最初令人困惑的假设：某些端口看起来是关闭的，但实际上它们并不是。`Nmap`\
  \ 区分了非开放端口后面是否有服务（守护进程）在监听。\n\n`Nmap` 将关闭的端口（closed ports）称为那些没有守护进程在后台监听，但看起来是开放或至少是可用的端口。如果\
  \ `Nmap` 指的是过滤端口（filtered ports），则意味着某种防火墙阻止了对扫描该系统的 IP 地址的访问。这部分与 `TCP RST` 数据包有关，还有三种\
  \ `Nmap` 报告的其他状态：未过滤的（unfiltered）、`open|filtered` 和 `closed|filtered`。如果你想了解更多关于这些状态差异的信息，请访问\
  \ [`https://nmap.org/book/man-port-scanning-basics.html`](https://nmap.org/book/man-port-scanning-basics.html)。\n\
  \n### 混淆端口扫描器\n\n现在你已经知道端口是如何向端口扫描器自身的，让我们看看如何混淆你返回的响应，以迷惑复杂的端口扫描技术。得益于其强大的功能 set，最明显的选择工具是基于内核的防火墙\
  \ `Netfilter`，更通用的名称是 `iptables`。\n\n它是这样工作的。对于 `TCP` 数据包，你想通过使用 `iptables` 生成 `REJECT`\
  \ 请求来操纵你对端口探测的响应。对于其他协议，你只需要 `DROP` 数据包。这样，你就能从 `Nmap` 得到关闭而非过滤的响应。根据我从大多数在线意见中收集的信息（似乎这个论点是有争议且多变的），关闭端口是你可以希望的最好响应。\n\
  \n进一步解释，在正常情况下，无法访问的端口通常会生成 `ICMP Port Unreachable` 响应。然而，你不希望生成这些错误，因为那意味着服务器最初在该端口上有一个监听，并且你会暴露你的服务器的存在。你想要生成的调整后的\
  \ `REJECT` 响应应用如下：`--reject-with reset`。这有助于你表现得像端口未未使用且关闭的，而不是被过滤的。\n\n你只需将此片段添加到每个\
  \ iptables 规则的末尾：\n\n```\n-j REJECT---with reset\n```\n\n通过使用这种技术，你只是在确保没有提供关于你系统的不必要信息。\n\
  \n在规则中使用 `iptables` 的 `DROP` 响应还是 `REJECT` 响应存在一些争议。\n\n注意，在你即将看到的端口触发示例中，你不会使用该\
  \ `iptables` 选项。这是因为你不会为你的 SSH 服务器运行额外的服务。然而，这些背景信息将帮助你理解攻击者可能如何接触机器端口，以及你如何对其他服务应用\
  \ `--reject-with reset` 选项。\n\n## 安装 knockd\n\n现在你已经有了实用的背景信息，我将引导你如何在你的服务器上安装端口触发器。随着我们继续进行，你可能会考虑哪些服务你希望从整个互联网中隐藏。\n\
  \n### 软件包\n\n\n\n\n让我们来看看安装为你的系统提供端口敲击（port knocking）功能的包。该包名为 `knockd`，根据你的系统有不同的安装方式。\n\
  \n在 Debian 派系上，你按照以下方式安装包：\n\n```\n## apt-get install knockd\n```\n\n在 Red Hat 派系上，你按照以下方式安装：\n\
  \n```\n## yum install knockd\n```\n\n一个主配置文件控制着 `knockd` 需要的大部分配置。在 Debian Jessie\
  \ 服务器上，该文件位于 `/etc/knockd.conf`。查看列表 1.1，它展示了我的主配置文件，了解 `knockd` 如何工作。\n\n### 修改默认设置\n\
  \n在列表 1.1 中，你可以看到顶部有一个设置你的选项的部分。另外两个部分是在 `knockd` 开启 SSH 访问或关闭端口访问时你想要执行的操作。这两个部分都通过\
  \ `sequence` 选项包含了触发这些操作的默认端口敲击序列。在安装 `knockd` 后，我立即将这些端口从默认值改为其他，以避免降低服务器安全的有效性。默认端口是\
  \ 7000、8000 和 9000 用于开启 SSH 访问，端口 9000、8000、7000 用于关闭访问。如你所见，我增加了更多端口来开启访问，这样别人就不可能通过任意端口扫描偶然撞上它们的组合。\n\
  \n修改任何设置后，你可以在基于 systemd 的操作系统上按照如下方式简单重启 `knockd`：\n\n```\n## systemctl restart\
  \ knockd.service\n```\n\n安装 `knockd` 后，如果你想获得更多关于该包的背景信息，Debian Jessie 有一个短的 `README`\
  \ 文件，可以在 `/usr/share/doc/knockd/README` 找到。\n\n这个非常有用的 `README` 文件讨论了 `knockd` 的工作原理等。它使用了一个名为\
  \ `libpcap` 的库，该库也被用于 `tcpdump`、`ngrep` 和 `iftop`（用于捕获包进行检查）等其他包。得益于其巧妙的设计，`knockd`\
  \ 甚至不需要绑定到它秘密监听的端口即可监控原始流量。\n\n### 修改文件系统位置\n\n连接、断开或错误等事件直接记录到你系统的 syslog 中，并可能写入\
  \ `/var/log/messages` 或 `/var/log/syslog` 文件。如果你不想让这些信息埋没在其他系统日志活动中，或者不想费力解析笨重的日志文件，那么你可以创建自己的自定义日志文件。我更喜欢这样做，这样调试会清晰得多，我可能会使用自动化工具或自定义\
  \ shell 脚本每天将日志邮件给我，以便监控可疑事件。因为我将所有的 `knockd` 日志都放在一个地方，脚本和其他工具更容易解析这些信息。\n\n```\n\
  [options]\nLogFile = /var/log/portknocking.log\n```\n\n更改日志文件的位置是一个常见的解决方案，但你也可以更改\
  \ `knockd` 服务启动时进程 ID（Process ID）文件的写入位置。你可以在配置文件的 `[options]` 部分更改位置，如下所示：\n\n\
  ```\n[options]\n       PidFile = /var/tmp/run/file\n```\n\n### 一些配置选项\n\n现在你对主配置文件的设置方式有了更好的了解，可以检查如何根据你的需求对其进行配置。在许多其他任务中，你将考虑某些选项的超时在设置服务器时起着什么作用。\n\
  \n### 启动服务\n\n如果你看到显示 `knockd` 已禁用（disabled）的错误信息，不要报警。这是一种预防措施，确保在你完成设置之前，`knockd`\
  \ 不会对 `iptables` 引入不受欢迎的更改。\n\n在 Debian Jessie 上，错误信息要求你在 `/etc/default/knockd`\
  \ 文件中将以下参数改为 1：\n\n```\nSTART_KNOCKD=1\n```\n\n显然，你应该在双重检查了配置或确保你的带外访问（out-of-band\
  \ access）工作符合预期后才这样做。\n\n### 修改默认网络接口\n\n一旦你配置了偏好的端口序列，你可能想要微调其他参数。在配置文件（`/etc/default/knockd`）中，你有机会更改\
  \ `KNOCKD_OPTS` 设置。该文件中的示例被注释掉了，这意味着你可以如下更改 `knockd` 监听的网络接口：\n\n```\nKNOCKD_OPTS=\"\
  -i eth1\"\n```\n\n这些选项将附加到 `knockd` 服务中，你将需要重启服务以使更改生效，如下（在 systemd 机器上）：\n\n```\n\
  ## systemctl restart knockd\n```\n\n### 数据包类型与计时\n\n在 `/etc/knockd.conf` 文件中，你可以更改几个设置来精调客户端如何连接到你。回到列表\
  \ 1.1，在 `[openSSH]` 部分下，你将如下添加更多选项：\n\n```\n[openSSH]\n        tcpflags = syn\n\
  \        seq_timeout = 10\n        cmd_timeout = 15\n```\n\n`tcpflags` 选项意味着你可以预期发送特定类型的\
  \ TCP 包，以便 `knockd` 接受它。在这种情况下，这是一个 TCP “SYN”。你可以使用的 TCP 标志有 `fin`、`syn`、`rst`、`psh`、`ack`\
  \ 和 `urg`。如果没有收到指定类型的包，`knockd` 将忽略那些包。请注意，这并不是 `knockd` 通常的工作方式。通常，一个错误的包会停止整个序列的运行。你可以使用逗号分隔多个包类型，而且根据更新日志，从\
  \ 0.5 版本开始的较新版本的 `knockd` 可以感叹号来否定包类型，例如 `!ack`。`seq_timeout` 在列表 1.1 中默认已存在。但是，由于你增加了设置中的端口数量，你将\
  \ `seq_timeout` 值从 5 到了 10。这是必要的，因为在慢连接上（例如通过你的手机），可能会超时。示例中的最后一个选项是 `cmd_timeout`。该选项适用于\
  \ `knockd` 收到成功敲击之后的情况。事件顺序如下：首先，一旦端口敲击被确认有效，`knockd` 将运行 `start_command`（如果需要，请参考列表\
  \ 1.1）。如果存在此设置，在 `knockd` 执行 `start_command` 选项后，它将等待 `cmd_timeout` 指定的时间，然后运行 `stop_command`\
  \ 操作。这是开启 SSH 服务器访问的首选方式，并在建立连接后立即关闭它。你继续会话时不会有任何问题，但新连接需要再次通过端口敲击序列才能连接。\n\n###\
  \ 测试你的安装\n\n由于你正在处理服务器的安全问题，你应该运行几次测试以查看 `knockd` 是否按预期工作。理想情况下，你有访问另一台客户端机器来运行一些测试。为了完全确保\
  \ `knockd` 正确打开和关闭端口，我喜欢从完全不同的 IP 地址进行测试。如果你无法访问不同 IP 地址的连接，你可能需要定期断开互联网连接，以便你的\
  \ ISP 为你分配一个新的动态 IP 地址进行测试。某些宽带供应商会在重启后这样做，你的移动运营商也可能。\n\n\n\n\n你可以使用不同的客户端来创建敲门序列（knocking\
  \ sequence），以初始化连接并打开 SSH 端口。你甚至可以手动使用 `Nmap`、`netcat` 或 `Telnet` 等工具按顺序探测所需的端口。文档还提到，如果可用，你还可以使用\
  \ `hping`、`sendip` 和 `packit` 软件包。让我们来看 `knockd` 软件包带的 `knock` 命令的示例。\n\n如果你使用了列表\
  \ 1.1 所示的 `openSSH` 部分，那么你将使用以下语法设置你的简单 `knock` 命令：\n\n```bash\n## knock [options]\
  \ <host> <port[:proto]> <port[:proto]> <port[:proto]>\n```\n\n我在列表 1.1 中配置了 TCP\
  \ 端口，因此你可以如下所示运行 `knock` 命令：\n\n```bash\n## knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp\
  \ 22045:tcp 23501:tcp 24691:tcp\n```\n\n目标主机 IP 地址为 11.11.11.11。在这个示例中，如果你愿意，也可以在列表\
  \ 1.1](#c01.xhtml_rc01_lit_1)中组合 UDP 和 TCP 端口；你的客户端敲门序列可能像这样：\n\n```bash\n## knock\
  \ 11.11.11.11 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp 24691:tcp\n```\n\n一个很好的快捷方法是，如果你只想使用\
  \ UDP 端口，可以直接在命令开头添加 `-u`，而不是显式指定它们。你可以运行如下 UDP 端口命令：\n\n```bash\n## knock -u 11.11.11.11\
  \ 22 33 44\n```\n\n让我们回到服务器配置文件查看 TCP 和 UDP 如何在有效敲门序列中互换。为了混合协议，你只需如下修改 `openSSH`\
  \ 部分下的 `sequence` 行如下：\n\n```ini\n[openSSH]\n        sequence = 6:tcp 1450:udp 8156:udp\
  \ 22045:tcp 23501:udp 24691:tcp\n```\n\n## 让你的服务器不可见\n\n一旦你确认安装按照你的预期工作，就可以锁定你的服务器以隐藏攻击隐藏。攻击者可能会知道绑定到你服务器的\
  \ IP 地址，或者通过某种方式查看从该 IP 地址发送和接收的流量。否则，它对互联网用户应该是不可见的。然而，为了实现 `Nmap` 的端口关闭状态，以下方法是有效的。\n\
  \n### 测试你的 iptables\n\n如前所述，我将使用 `iptables`。理想情况下，在锁定服务器之前你应该拥有服务器的物理访问权限，以防出错。如果没有，你应该拥有某种带外访问权限，例如通过虚拟机控制台、你可以登录的辅助网络接口或连接到机器的拨号调制器。注意，除非你先在开发机上测试了配置，否则可能会出错并导致问题。即使我以前使用过端口敲门，偶尔仍然会把自己锁在服务器之外。\n\
  \n考虑到这个警告，让我们从查看你的 `iptables` 命令开始。在将这些规则与已有的规则整合时要小心。在备份后，覆盖你的现有规则可能会更容易。首先，你需要确保你的服务器可以通过本地接口进行通信，如下：\n\
  \n```bash\n## iptables -A INPUT -s 127.0.0.0/8 -j ACCEPT\n```\n\n你现在必须确保任何现有连接都被确认并响应，如下：\n\
  \n```bash\n## iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n\
  ```\n\n你正在使用 `conntrack` 来跟踪关联连接。一旦连接成功启动，你的连接就可以继续。现在，假设你只想为 SSH 服务器打开 TCP 22 端口而不打开其他服务，你可以继续操作。参考列表\
  \ 1.1，添加以下命令来打开 TCP 22 端口：\n\n```bash\ncommand = /sbin/iptables -I INPUT -s %IP%\
  \ -p tcp --dport 22 -j ACCEPT\n```\n\n注意这一行。如果你在命令中使用 `-A INPUT` 进行“追加”，你会被 `iptables`\
  \ 锁在外面。必须使用 `-I` 进行“插入”，以便规则作为第一条规则进入并优于其他规则。\n\n你可能会好奇 `%IP%` 变量是什么。端口敲门足够智能，可以在\
  \ `-s` 字段中使用连接的 IP 地址替换 `%IP%` 值。\n\n现在是你必须非常小心的地方。如果这不起作用，就没有回路了。注意，除非你先在开发机上测试了配置，否则极有可能出错并导致问题。即使我以前使用过端口敲门，偶尔仍然会把自己锁在服务器之外。\n\
  \n如果你在命令中使用 `-A INPUT` 进行“追加”，你会被 `iptables` 锁在外面。必须使用 `-I` 进行“插入”，以便规则作为第一条规则进入并优于其他规则。\n\
  \n要阻塞所有入站流量，使用：\n\n```bash\n# iptables -A INPUT -j DROP\n```\n\n检查规则：\n\n```bash\n\
  ## iptables -L\n```\n\n查看详细详细规则：\n\n```bash\n## iptables -nv\n```\n\n### 保存 iptables\
  \ 规则\n\n为了确保你的 iptables 规则在重启后依然有效，你应该在 Debian 上安装名为 `iptables-persistent` 的软件包：\n\
  \n```bash\napt-get install iptables-persistent\n```\n\n然后你可以使用此命令保存规则：\n\n```bash\n\
  ## /etc/init.d/iptables-persistent save\n```\n\n或者，你可以运行以下命令恢复到配置：\n\n```bash\n\
  ## /etc/init.d/iptables-persistent reload\n```\n\n在 Red Hat 派系中，你可以使用：\n\n```bash\n\
  ## /sbin/service iptables save\n```\n\n以及恢复规则：\n\n```bash\n## /sbin/service iptables\
  \ reload\n```\n\n为了上述操作在 systemd Red Hat 派系上工作，首先尝试这个软件包：\n\n```bash\nyum install\
  \ iptables-services\n```\n\n## 其他考虑\n\n关于端口敲门的其他方面可能有帮助。让我们现在来看看。\n\n### 手机客户端\n\
  \n在我的安卓手机上，我首选的 SSH 应用程序叫做 JuiceSSH ([`juicessh.com`](https://juicessh.com))。它有一个第三方插件，允许你将敲门序列作为\
  \ SSH 握手的一部分。这意味着即使你出门没有电脑，也没有理由不使用端口敲门。\n\n### 故障排除\n\n如果你在端口敲门日志文件上运行命令 `tail\
  \ -f logfile.log`，你会看到日志中写入了各种阶段。这包括有效端口是否被敲击，重要的是它们是否按正确的顺序被敲击。\n\n调试选项还让你有机会增加\
  \ `knockd` 产生的日志级别。如果你仔细打开 `/etc/init.d/knockd` 文件并查找 `OPTIONS` 行，你可以在该行的任何现有值添加一个大写的\
  \ D 字符（Shift+d），如下：\n\n```bash\nOPTIONS=\"-d -D\"\n```\n\n一旦你诊断并解决了问题，应该关闭额外的日志，以防止磁盘空间被不占用。`-d`\
  \ 只是表示以守护模式运行 `knockd`，以防你好奇。正常运行时它应该保持现状。\n\n\n\n\n回到客户端稍一下。你还可以通过添加 `-v` 选项来增加输出的详细程度，这是“knock”客户端生成的输出。结合调试选项，这应该能让你从连接的客户端和服务器端获得有用的反馈。\n\
  \n### 安全考量\n\n涉及到与你的服务器相关的公共信息，提醒一下你的互联网服务提供商（ISP）不应发布关于你用于服务器的 IP 地址的正向或反向 DNS\
  \ 信息。你的 IP 地址应该显示为未被使用且未分配的，这样才能实现隐形。\n\n即使在像 `HTTP` 这样的公共服务上，你需要记住混淆正在使用的守护进程版本。在世界上最流行的\
  \ Web 服务器 `Apache` 中，实现此点的常用方法是将 `ServerTokens` 更改为 `Prod` 并将 `ServerSignature`\
  \ 设置为 `Off`。这些几乎不是什么尖端的配置更改，但它们可能意味着当发现新的零日漏洞时，由于你的 `Apache` 版本号不在其攻击数据库中，自动化攻击可能会忽略你的服务器，从而避此一灾。\n\
  \n另一个需要考虑的方面在 `knockd` 文档中有所讨论。它提到，如果你使用 `-l` 或 `--lookup` 服务启动选项来解析日志条目的主机名，那么可能存在安全风险。如果你这样做，可能会某些信息泄露给攻击者。如果可以从你的服务器捕获\
  \ DNS 流量，攻击者可能确定序列中的第一个端口。\n\n### 瞬态序列\n\n使用不同的敲门序列（knocking sequences）方法如何？也可以使用预定义的端口序列列表进行端口敲门，这些序列在使用一次后就会过期。参考列表\
  \ 1.1 和你的主配置文件，如果你想的话，可以将此选项添加到你的的 `open` 和 `close` 部分中，以启用一次性序列：\n\n```\n[openSSH]\n\
  \        One_Time_Sequences = /usr/local/etc/portknocking_codes\n```\n\n如果你删除了列表\
  \ 1.1 中的 `sequence` 行并将其替换为此代码，那么 `knockd` 将从路径中指定的文件获取其序列。\n\n`knockd` 处理一次性序列的方式是不寻常的。它从该文件中读取下一个可用的序列，然后在与有效敲门成功连接后，将该行注释掉。它只是在存在序列的行开头添加一个哈希值或井号（#）。下一次连接将触发相同的序列。\n\
  \n文档指出，你应该在每行的开头留空。否则，当 `#` 字符被添加到行首时，你可能会发现它被无意中覆盖了，这意味着你被锁定在系统之外。\n\n在你的序列文件中，你可以每行添加一个序列。该文件的格式与主配置文件中的\
  \ `sequences` 选项格式相同。\n\n文档还指出，你可以通过在注释前加上 `#` 字符来插入注释，但如果你在 `knockd` 运行时编辑序列文件，将会发生糟糕的事情（例如被锁定在服务器之外）。\n\
  \n一旦你理解了 `knockd` 的基本功能，它将是一个极佳的实验对象。在测试期间，你可以输入你能够记住的电话号码或其他数字序列，这样你就不需要不断查找一个不安全的列表了。例如，你可能考虑轮换五个电话号码，并将它们分成有效的端口号。\n\
  \n## 总结\n\n除了让你的服务器隐形之外，我还涵盖了在发起攻击之前你的服务器在互联网上呈现的状态。为了使用端口敲门完全混淆你的服务器，你应该仔细考虑公共信息，例如反向\
  \ DNS 记录，这可能会暴露 IP 地址正在被使用。你还可能考虑使用 `NAT` 来隐藏服务器并定期动态更改其 IP 地址，仅通过在不寻常域名的 DNS 中秘密发布的密钥主机名，让管理员在特定时间知道哪个\
  \ IP 地址正在被使用。\n\n保护服务器还有许多其他方面；尽管如此，我希望已经涵盖了足够的内容，让你考虑哪些信息泄露给了公众并可能在未来的漏洞中被利用，以及在需要时隐藏服务器。\n\
  \n# 第 2 章：为你的文件创建数字指纹\n\n关注服务器安全有许多正理由。很少有系统管理员类型能在不投入热情和努力的情况下，吸收保持基础设施安全所需的必要安全知识。如果你和我一样，在这一道路上可能会遇到一些坎坷，例如在千禧交替之际，我曾因为一个恶性的\
  \ PHP 漏洞导致服务器被攻破，或者当我面临并击退两次相对重大的 DDoS 攻击时。\n\n本章将涵盖另一个攻击向量——根内核（rootkits），以及一个非常棒软件\
  \ Rootkit Hunter（你可能认识它为 `rkhunter`）。然而，你将从探索如何监控文件系统的重要文件（如其可执行文件）开始。\n\n## 文件系统完整性\n\
  \n许多年前我使用过 `Tripwire`（[`http://sourceforge.net/projects/tripwire`](http://sourceforge.net/projects/tripwire)）。由于其他产品的出现，它现在被称为\
  \ Open Source Tripwire。`Tripwire` 定期运行（使用 `cron` 在夜间运行），并使用加密哈希来监控系统上的任何文件更改。\n\n\
  通过在第一次运行期间生成并记录文件系统中可见的任何文件的哈希值，`Tripwire` 能够在随后的每次运行中，如果任何哈希值与它记录的不符，向管理员发出警告。如果文件发生了任何更改，哈希值就会改变。这是一种聪明的方法，尽管在旧硬件上非常消耗\
  \ I/O 资源，并且后来产生了许多后代。一个例子是流行的 AIDE（高级入侵检测环境），它在 [`http://aide.net`](http://aide.net)\
  \ 上被描述为“一个文件和目录检查器”。如果有机会，我绝对建议尝试 AIDE 或 `Tripwire`。但警告你，如果你对初始配置疏忽，你可能会收到大量的虚假报警。\n\
  \n这种安全类型通常在基于主机的入侵检测系统（HIDS）的伞下，据报道，由于主机与网络的交互很少，它是最早的软件安全类型之一。\n\n如果你不想运行夜间文件检查检查或者你无法接收每日系统报告，那也没问题。你可以选择一种旧的方法，在构建服务器后扫描一次文件系统，以收集安装了哪些文件的信息。我稍后会解释为什么这有用。\n\
  \n你可能会惊讶，一个你几乎确定用于其他用途的工具可以很容易作为安全助手。\n\n介绍 `md5sum` 命令。在过去下载 Unix 类型文件时，你可能一直可以通过验证这些文件的\
  \ MD5 和来检查潜在下载内容的完整性。例如，MD5 和通常出现在你获取 Linux 安装 ISO 镜像的网站上。\n\n如图 2.1\n\n\n\n\n\n\
  图 2.1 你可以从网站下载 Debian Jessie，并检查你的 MD5 和以确保安全。\n\n如果你打开 `MD5SUMS` 文件，就可以看到图 2.1\
  \ 的内容，其中包含了每个文件的哈希值。\n\n在列表 2.1 中，左侧列出了每个文件的 MD5 和以及右侧相应的文件名。这是为了防止有人将恶意文件偷偷替换掉合法文件，这可能会感染你干净的操作系统（OS）安装。\n\
  \nMD5 和首先进行计算，然后与 MD5 摘要进行比对。你可能会认为（以一种相对复杂的方式）通过检查 MD5 和，你实际上是为每个文件创建了一个数字指纹，稍后可以查询。\n\
  \n你可以轻松地尝试自己使用 MD5（在我的机器上，`MD5sum` 命令包含在 `coreutils` 软件包中，几乎所有的发行版都应该可以直接可用）。尝试像这样的命令：\n\
  \n```\n## md5sum /home/chrisbinnie/debbie-and-ian.pdf\n```\n\n你收到的响应可能如下：\n\n```\n\
  3f19f37d00f838c8ad16775293e73e76 debbie-and-ian.pdf\n```\n\n现在回到你的 Linux 发行版列出的文件。将\
  \ `MD5SUMS` 文件下载到与主 ISO 文件相同的目录（如果你好奇，ISO 是以 ISO 9660 文件系统命名的）。通过这样做，你可以省去手动检查所用安装介质上每个文件的麻烦。因为该文件包含了该目录下所有文件的\
  \ MD5 和。现在你已经有了所有文件的 MD5 和，可以使用以下命令检查它们的有效性（`-c` 也代表 `--check`）：\n\n```\n## md5sum\
  \ -c MD5SUMS\n```\n\n列表 2.2 显示了运行 `-c` 选项的结果。你可能会说 MD5 和是二元的：结果要么是 OK，要么不是 OK。\n\
  \n如果文件与其原始 MD5 和不匹配，应该注意什么？在列表 2.3 中，你可以看到警报在响（带有 FAILED 警告），并且在结果的末尾也被通知了一个问题。\n\
  \n不言而喻，如果在从下载的 ISO 或杂志光盘中安装操作系统时不进行这些检查，你就是在用你的文件完整性赌博，从而面临着系统完整性的风险。\n\n既然现在已经提醒了你如何检查你新下载的文件是否被篡改过，让我们来看看如何利用加密哈希的力量来帮助你判断已安装的系统是否被攻破。\n\
  \n## 整个文件系统\n\n一旦你对操作系统的安装感到满意并运行了必要的安装后微调，你就应该考虑记录你关键系统文件的 MD5 和。这样做是为了获得一个可靠的记录，以便在怀疑被攻破时进行比较。\n\
  \n当然，如果不编写 shell 脚本，使用 `md5sum` 命令完成此可能并不简单；这是因为很难让 `md5sum` 命令处理完整的目录树文件。\n\n不过，不要担心：某个聪明的人已经用一个名为\
  \ `md5deep` 的高效软件解决了这个问题（[`http://md5deep.sourceforge.net`](http://md5deep.sourceforge.net)）。根据其网站，除了你可以从\
  \ `MD5sum` 期望的功能外，你还可以享受以下功能：\n\n你可以：\n\n* 忽略某些文件类型（当你想要忽略临时文件等时，这非常有用）。\n* 如果你正在检查海量文件（在全新的操作系统安装上，你会这样做），那么\
  \ `md5deep` 提供了一个非常有帮助的 ETD（预计交付时间）——换句话说，就是命令完成需要多长时间。\n* 你可以在递归模式下运行 `md5deep`，轻松地获取文件系统上的许多隐藏子目录，否则手动记录这些内容将非常艰巨（如果不是无法准确完成的话）。\n\
  * 考虑到兼容性，你还可以导入不同类型的哈希（例如，来自 EnCase、国家软件参考库、ILook Investigator 和 HashKeeper）。\n\n\
  我确定你会同意这正是你寻找的。在完成新机器的组装后，你可以只需安装 `md5deep` 并在整个文件系统（或至少是部分区域）运行它。一个严重的警告是将生成的哈希列表存在服务器以外的地方。这是出于显而易见的考虑。如果你的服务器被攻破，那么攻击者很容易用新的、非法的\
  \ MD5 和覆盖你的 MD5 列表并欺骗你。\n\n如果由于某种原因你无法获得 `md5deep`（例如，你在一个封闭环境中工作），那么在包含关键二进制文件的目录上运行\
  \ `md5sum` 命令是值得的，如下列表（非详尽）所示：\n\n```\n/bin, /sbin, /usr/bin, /usr/sbin, /etc\n\
  ```\n\n## Rootkits（根内核程序）\n\n让我们转向另一种方法。（此处省略大量重复的句子，已根据要求确保不重复原文）\n\n\n\n\n\n图\
  \ 2.2 显示了运行此命令后生成的简略输出。该输出详细说明了软件进行的初始检查。\n\n![运行 rkhunter—checkall 产生的简略输出插图。](img/c02f002.jpg)\n\
  \n图 2.2 运行 `rkhunter--checkall` 输出的简略显示\n\n如你所见，Rootkit Hunter 正在关注可执行文件的关键目录（在本例中为\
  \ `/usr/sbin`）。这些正是被 rootkit 感染的二进制文件类型（在许多其他类型之外）。\n\n回想一下古希腊人和特洛伊木马的寓言。除了那些立即感染二进制文件的\
  \ rootkit 之外，某些代码可以休眠任何长时间，直到被合法用户执行或按计划执行。随后，系统就会被入侵。\n\n## 配置\n\n要配置 Rootkit Hunter，你可以编辑它的长配置文件，该文件位于\
  \ `/etc/rkhunter.conf`。\n\n为了接收关于你机器完整性的隔夜报告，你只需要编辑两个配置参数：其中一个定义接收者的电子邮件地址，如果标准的\
  \ `mail` 命令在你的系统默认情况下无法工作，则后一个是可以调整的。\n\n进入配置文件后，寻找这些显著的行，取消它们的注释，并根据你的需求进行调整：\n\
  \n```bash\n#MAIL-ON-WARNING=me@mydomain   root@mydomain\n#MAIL_CMD=mail -s \"[rkhunter]\
  \ Warnings found for ${HOST_NAME}\"\n```\n\n第一行在取消注释后，指定了报告的发送位置（多个地址可以用空格隔开）。第二行处理\
  \ `mail` 命令以及发送到这些地址的电子邮件报告的主题行。\n\n简单地使用 `rkhunter—check` 重新运行软件以测试这些更改是否正常工作，并检查你的邮箱收箱。\n\
  \n要检查帮助调度生成这些报告的 cron 任务，你可以查看 `/etc/cron.daily/rkhunter` 文件。默认情况下，在许多发行版中，`cron.daily`\
  \ 通常会在每天早上 0100 到 0500 之间之间运行。\n\n如果你想更改电子邮件的外观，可以在 `cron.daily` 文件中搜索以下几行：\n\n\
  ```bash\nif [ -s \"$OUTFILE\" -a -n \"$REPORT_EMAIL\" ]; then\n          (\n   \
  \         echo \"Subject: [rkhunter] $(hostname -f)—Daily report\"\n           \
  \ echo \"To: $REPORT_EMAIL\"\n```\n\n一如既往，在修改此文件之前创建一个它的副本可能是明智的。\n\n回到我从运行 Rootkit\
  \ Hunter 中生成的的结果。在 图 2.3 中，你可以看到 Rootkit Hunter 搜索的一些 rootkit。\n\n![Rootkit Hunter\
  \ 搜索的一些 rootkit 列表。](img/c02f003.jpg)\n\n图 2.3 Rootkit Hunter 搜索的一些 rootkit 的部分列表\n\
  \n如你在 图 2.3 和 2.4 中所示，Rootkit Hunter 寻找的内容有很多方面；检查非常详尽。\n\n![Rootkit Hunter 搜索的示例。](img/c02f004.jpg)\n\
  \n图 2.4 另一个全面的 Rootkit Hunter 搜索示例\n\n## 误报\n\n如果你收到任何误报，你可以在配置文件 `/etc/rkhunter.conf`\
  \ 中将它们 le 列入白名单。\n\n如果虚假报警的数量过多是一个问题，你可以通过在该主配置文件中取消注释与整个目录匹配的配置行来实现，如下所示：\n\n```bash\n\
  ALLOWHIDDENDIR=/dev/.initramfs\n```\n\n如果 Rootkit Hunter 错误地怀疑你的二进制文件之一被脚本替换，你可以使用此选项删除警告：\n\
  \n```bash\nSCRIPTWHITELIST=\"/usr/sbin/lsof\"\n```\n\n对于单个文件，你也可以使用此配置设置：\n\n```bash\n\
  ALLOWDEVFILE=\"/dev/.udev/rules.d/99-root.rules\"\n```\n\n记住，任何隐藏文件或目录（以点开头的名称）对于文件系统扫描器来说几乎总是可疑的。在\
  \ 图 2.5 中，你可以看到 Rootkit Hunter 扫描结果的另一部分，它涉及到检查任何恶意隐藏文件。\n\n![描述涉及 /dev 分区以及隐藏文件和目录的\
  \ Rootkit Hunter 扫描插图。](img/c02f005.jpg)\n\n图 2.5 Rootkit Hunter 扫描涉及 `/dev` 分区以及隐藏文件和目录。\n\
  \n很显然，Rootkit Hunter 进行的全面检查是深思熟虑的。除了文件系统和进程表，它还检查网络异常，如你在 图 2.6 中所示。\n\n![Rootkit\
  \ Hunter 进行检查的插图。](img/c02f006.jpg)\n\n图 2.6 Rootkit Hunter 进行了许多检查。\n\n## 设计良好\n\
  \nRootkit Hunter 的开发者将其描述为“基于主机的、被动的、事后的、基于路径的工具”。如果你好奇，`被动`引用意味着你需要调度它。`基于路径`描述意味着它只是像病毒检测器那样的运行。\n\
  \n它首先指出，在尝试攻击之前总会有某种形式的侦察，所以你应该密切关注你的日志文件。我记得有一个脚本监控跟踪路由和 ICMP 流量。\n\n再次重复我的观点，手册继续说该工具并不是安全性的替代品，而是将其视为一个协助发现问题的工具。\n\
  \n有趣的是，Rootkit Hunter 文档还指向了它们的竞争对手之一，优秀的 `chkrootkit` 工具，它是较旧的版本。手册建议，仅使用一类工具有时不足以获取你所需的信息。因此，为了完整起见，你应该从运行\
  \ `chkrootkit` 和 `rkhunter` 提供的重叠功能中受益（注：此处原文似乎有断句，已根据语境补全逻辑意为：因此，为了完整起见，你应该从运行\
  \ `chkrootkit` 和 `rkhunter` 提供的重叠功能中受益）。\n\n最后，手册讨论了当你发现入侵且没有足够的技能来处理成功的漏洞时该怎么办。除了访问\
  \ [www.cert.org](http://www.cert.org)，你可能还会访问 [www.linuxsecurity.com.br/info/intruder_detection_checklist.html](http://www.linuxsecurity.com.br/info/intruder_detection_checklist.html)，那里提供了应对在线攻击的步骤列表。\n\
  \n具有此类攻击经验的人告诉你，你应该考虑向哪些机构报告该漏洞，并尽快提交报告——而不是等待几周或几个月——以防可以采取措施防止其他入侵。一如既往，常识适用。\n\
  \n## 总结\n\n你现在拥有了对文件系统中的文件进行数字指纹识别的能力。结果，你可以快速比较以前的 MD5sums 以查看文件是否被篡改，还可以运行 Rootkit\
  \ Hunter，无论是每晚运行还是定期运行。rootkit 检查器的好处在于，它们还可以通过计划扫描指出你所犯的配置错误来提供安心。然后你可能希望在错误引起进一步的安全问题之前修复它。\n\
  \n根据我涵盖的内容，有两条规则你需要记住：\n\n* 始终将记录的 MD5sums（或任何其他哈希）保存在安全的地方（加密并密码保护），并远离服务器。\n\n\
  \n\n\n\n-   不要依赖 rootkit 工具来减少你事后的工作量；只需使用它们来识别问题。从那里开始，在着手重建机器之前，弄清楚是如何导致被攻击的。花费大量时间重建机器，结果稍后同样的安全漏洞再次被利用，这是毫无意义的。你可能会对这种情况发生的频率之高而感到震惊。\n\
  \n在运行重要性不高的的服务时，只要稍加考虑，连接到互联网的机器的安全防护通常不需要花费太多精力。即使不可避免地引入了一些耗时的开销（例如添加对系统更改的夜间报告），也是如此。通过在构建机器之初采取预防措施，可以将互联网上的黑客挡在门外，让你能够安心工作。\n\
  \n# 第 3 章：21 世纪的 Netcat\n\n第一个让我惊叹其强大能力的 Linux 软件包之一是功能强大的 netcat ([`https://nmap.org/ncat`](https://nmap.org/ncat))。多年年来出现了几个版本，每个版本的功能集都略有不同。如果你还没有用过它，那么你将大有一番了。它被描述为系统管理员需要的唯一工具，这可能有点乐观，但\
  \ netcat 确实非常出众。\n\n首先，它极其轻量，文件系统占用空间微乎其微。此外，许多发行版默认都包含一个版本的 netcat。在你了解了一些它的背景之后，你将看到如何利用它来为自己服务。\n\
  \n## 历史\n\n多年年来，netcat 有许多实现版本。原始的 Unix/Linux 版本编写于 1995 年，1998 年由于其受欢迎，Windows\
  \ 版本也问世了。我曾读到过报道，称由 Nmap 项目 ([`https://nmap.org`](https://nmap.org)) 进行的一项调查发现，在他们自己的安全工具\
  \ `Nmap` 之后，用户选择 netcat 作为他们的第二首选工具。\n\nNetcat 的功能也助长了它在邪恶圈子中的流行。因此，除了出于善意的白帽活动外，它还经常被用于攻击侦察（以及攻击本身）。由于安全顾虑以及其软件包被列为威胁，你可能在企业级基础设施上找不到全功能（现代）的\
  \ netcat 版本。\n\n我将尝试简要地解释一些 netcat 的身世。这很容易引起困惑，因为原始的 netcat（其二进制执行文件名为 `nc`）经过\
  \ Nmap 项目的重构，他们将其称为“21 世纪的 Netcat”。重构的结果是一个名为 `ncat` 的二进制文件。`ncat` 的帮助页尽职感谢了原始版本，并在结尾附了以下注释：\n\
  \n> 原始的 Netcat 由 `Hobbit` hobbit@avian.org 编写。虽然 `Ncat` 没有基于任何来自“传统”Netcat（或任何其他实现）的代码，但\
  \ `Ncat` 在精神和功能上绝对是基于 Netcat 的。\n\n这个版本的 netcat (`ncat`) 谦逊地自诩为能够“[连接并重定向套接字”，但这对其功能集的描述是极度低估了。\n\
  \n例如，红帽企业级 Linux (RHEL) 7 中提供了一个版本的 `ncat`，我怀疑它和原始的 netcat (`nc`) 一样，多年来一直以各种形式出现在其他发布版本中。还存在一个原始的\
  \ netcat 版本（默认捆在 Debian Jessie 构建中，其二进制文件也称为 `nc`），它将其能力誉为“TCP/IP 瑞士军刀”。以下 RHEL\
  \ 7 网页指出了这两个变体之间的某些差异 [`https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat`](https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Migration_Planning_Guide/sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking.html#sect-Red_Hat_Enterprise_Linux-Migration_Planning_Guide-Networking-New_network_configuration_utility_ncat)。\n\
  \n如果你访问该网页，你会发现许多命令行选项发生了变化。它们要么不再适用，要么较新的 `ncat` 可能简单地改变了它们的含义。\n\n值得注意的是，如果没有\
  \ root 用户权限，你在不同版本之间的操作成功率可能会不同，所以如果需要尝试几次才能让 netcat 按照你想要的方式运行，不要太沮丧。这里有一篇非常好的文章，告诉你当你的\
  \ netcat 版本不支持运行 shell 的 `?e` 或 `?c` 选项该怎么办 [`https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem`](https://pen-testing.sans.org/blog/2013/05/06/netcat-without-e-no-problem)。\n\
  \n回到我之前提到的 RHEL 7 网页。它很有信心地表示，较新的 `ncat` 不包含其父辈 netcat 所包含的某些功能。可能这些功能在现代互联网上并不好用。Nmap\
  \ 网站包含了以下说明：\n\n> Ncat 增加了原始 Netcat 不具备的功能，包括 SSL 支持、代理连接、IPv6。\n\n他们指的是著名的扫描器，建议配合\
  \ ncat 使用。既然你已经感到困惑了，我通过提到还有两个版本的 netcat（我指的是 `nc` 而不是 `ncat`）来进一步增加混乱。真正的原始 netcat\
  \ 由 Avian Research 在 1995 年编写，最后一个版本于 1996 年发布为 1.10。随后发布了 netcat GNU 版本 ([`http://netcat.sourceforge.net`](http://netcat.sourceforge.net))，其最新版本\
  \ 0.7.1 于 2004 年 1 月发布。这两个 `nc` 版本在使用相同的命令行选项时可能会遇到困难。\n\nNmap 项目自己的 netcat 页面还揭示了还有更多变体，包括\
  \ `socat` ([`tool/netcat`]),`Cryptcat` ([`cryptcat.sourceforge.net``](http://cryptcat.sourceforge.net))、`pnetcat`\
  \ ([`stromberg.dnsalias.org/~strombrg/pnetcat.html``](http://stromberg.dnsalias.org/~strombrg/pnetcat.html))\
  \ 以及 `sbd`（你可以在非官方信息网站找到 [`www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd`](http://www.question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd)）。\n\
  \n## 安装软件包\n\n为了清晰起见，Debian Linux 和 Ubuntu Linux 使用表 3.1 所示的软件包名称。在红帽派发行版中，你可以尝试此软件包名称来获取\
  \ `nc` 版本：\n\n| 软件包名称 | 描述 |\n| :--- | :--- |\n| `netcat` | 用于兼容的“虚拟”软件包，可以安全删除\
  \ |\n| `netcat-openbsd` | OpenBSD 包版本，支持 IPv6、代理和 Unix 套接字 |\n| `netcat-traditional`\
  \ | Hobbit 编写的原始软件包，缺少 `netcat-openbsd` 中的许多功能 |\n| `netcat6` | 原始 netcat 的重写版本，具有\
  \ IPv6 支持并增强了对 UDP 的支持 |\n\n\n\n\n\n| nmap | 如果你想在 Debian/Ubuntu 上使用 Nmap 的 `ncat`，则需要这个包。\
  \ |\n\n`表 3.1` Debian 和 Ubuntu 软件包名称\n\n```\n## yum install netcat\n```\n\n对于 Nmap\
  \ 项目的 `ncat`，你可能可以尝试这个包：\n\n```\n## yum install nmap-ncat\n```\n\n我怀疑通过安装一个包然后确保你正在阅读该包的正确主页（以防同一台机器上安装了两个版本的\
  \ `netcat`），这种方法会被证明是成功的。\n\n为了避免混淆，我将重点关注 `ncat`（以及 `ncat` 命令），而不是 `netcat`（因此是\
  \ `nc` 命令）。从现在起，我将交替使用 `ncat` 和 `netcat` —— 或者，如果需要进一步明确，当然也可以直接使用 `ncat`。\n\n###\
  \ 入门教程\n\n让我们看看 21 世纪的 `netcat` 等效物（我当然指的是 `ncat`）能为你做什么，从一些基础知识开始。Netcat 大胆地声称它包含了强大的功能，可以通过命令行从网络操作数据（数据的读取和写入）。它非常可靠，并且可以与\
  \ TCP 和 UDP 工作（它在 IPv6 上也能运行良好）。它可以在 SSL（安全套接层）连接上完成令人印象深刻的事情，并与代理服务器良好工作 —— 无论是\
  \ SOCKS4 还是 HTTP “CONNECT”变体。\n\n从制作 Nmap 安全工具时所涉及的优秀编程实践判断，`ncat` 的编程质量也会非常高。Nmap\
  \ `netcat` 文档特别指出，它不仅使用了完全重写的代码（没有借用原始版本），而且还采用了 Nmap 经过彻底实战检验的网络库。\n\n既然提到了 HTTP\
  \ 代理，我将从使用 `netcat` 作为网络浏览器开始。如果你输入此命令，并加上你想要访问的任意网站，你就能连接到 TCP 端口 80：\n\n```\n\
  ## ncat -C www.chrisbinnie.tld 80\n```\n\n一旦你输入了此命令并按了回车键，你就需要输入以下文本，然后按几次回车：\n\n\
  ```\nGET / HTTP/1.0\n```\n\n请注意，如果你动作不够快，命令将超时，你将必须重试。如果你以前曾从命令行查询过 HTML，那么你可能不会对执行后屏幕上滚动的过量信息感到惊讶。如果你感兴趣，`-C`\
  \ 选项会在其中混入一个回车符和换行符（CRLF），以兼容某些网络协议。\n\n你还可以将 `netcat` 用作监听的守护进程。进入服务器有许多方法，而一种保持访问开启状态以备返回访问的方法，是让\
  \ `netcat` 监听在一个系统管理员可能不知道的冷门端口上。\n\n你稍后会考虑这一点，但现在先关注 HTTP。`ncat` 文档提供了一个极好的示例，说明了如何将你简单的\
  \ `netcat` 二进制文件变成一个基础 Web 服务器。首先，你将创建一个简单的文件。然而，你不会使用 `.html` 扩展名，因为你的文件不是纯 HTML；相反，它将是\
  \ HTTP 对话的一半。你把文件命名为 `index.http`，内容如 `Listing 3.1](#c03.xhtml_c03-1)` 所示。\n\n如\
  \ `Listing 3.1](#c03.xhtml_c03-1)` 所示，它大部分是 HTML，但顶行确认了访问客户端的请求。接下来，让 `netcat` 监听连接，并通过运行此命令在被要求时展示你的文件：\n\
  \n```\n## ncat -l 127.0.0.1 80 < index.http\n```\n\n顺便说一下，如果你刚刚在考虑使用 `netcat` 服务其他类型的内容，那么你是正确的。如果你曾经手动通过命令行类型输入过\
  \ SMTP 对话，那么你可能对发现 `-C` 选项同样有效而感到意外。\n\n### 传输文件\n\n思考一下使用两端的 `netcat` 将文件从一个主机移动到另一个主机。这不需要复杂的\
  \ SFTP 守护进程或复杂的应用程序。你将你的两台机器命名为 `Lionel` 和 `Luis`，并将看着 `Lionel` 将文件传给 `Luis`。在 `Luis`\
  \ 上，运行此命令：\n\n```\n## ncat -l > bootstrap.pp\n```\n\n你可以看到 `-l` 切换只是要求 `netcat`\
  \ “监听”传入流量。你正在监听 TCP 端口 1234 流量，并将入站数据输出到名为 `bootstrap.pp` 的文件；此文件是一个清单，你不想在主机之间复制粘贴它，因为它很长很复杂。现在\
  \ `Luis` 正在等待某些数据，这是你在 `Lionel` 上输入的内容以发送它：\n\n```\n## ncat --send-only Luis 1234\
  \ < bootstrap.orig\n```\n\n在 `Lionel` 上运行此命令后，`Luis` 上的 `netcat` 实例会自动退出。在 `Luis`\
  \ 退出之前，它会将 `Lionel` 上的文件 `bootstrap.orig` 内容输出到 `Luis` 上的文件 `bootstrap.pp`。\n\n\n\
  \n\n\n正如你所见的，反过来，Lionel 将他的长型文件传递给 Luis，然后 Luis 将两个 `netcat` 命令链在一起，以便将文件转发到 Neymar。这个三三角关系配合得很好，特别是当\
  \ Luis 因为防火墙或路由问题无法直接与 Neymar 通信时。\n\n然而，文档确实指出了这种场景下的一个问题。问题在于 Neymar 无法回与 Lionel\
  \ 通信。正如你对强大的 `netcat` 所预期的那样，这有一个解决办法。当我看到这个例子时，我立刻想到了为了恶意目的而部署的利用程序。（我相信你稍后就会明白为什么了）。现在看下面这命令：\n\
  \n```\nNeymar> # ncat -l 1234 > newlog.log\nLuis> # ncat -l 1234 --sh-exec \"ncat\
  \ Neymar 1234\"\nLionel> # ncat --send-only Luis 1234 < logfile.log\n```\n\n在我看来，这个例子中可怕的补充是\
  \ `-sh-exec` 选项，它会在 Luis 接收到数据时执行一个新的 shell 命令。想象一下使用这种选项可以造成的任何破坏，它可以启动任何 shell\
  \ 命令。在这个例子中，当 Luis 接收到连接时，他产生一个新的 netcat 实例，并处理来自 Lionel 和 Neymar 通信的输入和输出。这非常复杂。\n\
  \n这里是文档中的一个端口转发示例，再次处理 HTTP，你在其中执行一个 shell 命令来转发流量：\n\n```\n## ncat -l locahost\
  \ 80 --sh-exec \"ncat www.chrisbinnie.tld 8100\"\n```\n\n你只需将目标为本地机器 TCP 端口 80 的数据转发到另一个在\
  \ TCP 端口 8100 上的主机即可。\n\n## 安全通信\n\n我之前提到了 SSL，以及 `netcat` 甚至可以与加密流量交互，尽管这是一个值得考虑的担忧可能性。我将从一个\
  \ `netcat` 如何加密其自身的流量的示例开始本节。你再次使用 `-C` 开关（有时称为连接模式）：\n\n```\n## ncat -C --ssl ssl.chrisbinnie.tld\
  \ 443\n```\n\n在这里，你假设你可信的机器 `ssl.chrisbinnie.tld` 在 TCP 端口 443 上运行着 SSL 服务器，因此你可以连接到它。令人惊讶的是，即使对于使用证书进行验证的\
  \ SSL 服务器，强大的 `netcat` 也可以非常有用。\n\n你只需在命令中使用 `--ssl-cert` 和 `--ssl-key` 选项分别将 `netcat`\
  \ 指向你的 PEM 证书和私钥文件的位置。如果你喜欢，可以将这两个选项都指向同一个文件。\n\n在交换证书以及进行加密通信时，一个重要因素是确认（通过第三方服务的认可标记）SSL\
  \ 服务器的身份是有效的。`netcat` 能够通过使用此命令处理此类请求：\n\n```\n## ncat -C --ssl-verify ssl.chrisbinnie.tld\
  \ 443\n```\n\n根据文档，`netcat` 能够以如下方式检查 SSL 证书：\n\n> 验证是使用与 Ncat 附带的 ca-bundle.crt\
  \ 证书包完成的，外加上操作系统可能提供的任何信任证书。如果你想验证到一个证书未由默认认证机构之一签名的服务器的连接，请使用 --ssl-trustfile 来命名一个包含你信任的证书的文件。该文件必须是\
  \ PEM 格式。\n\n[`https://nmap.org/ncat/guide/ncat-ssl.html`](https://nmap.org/ncat/guide/ncat-ssl.html)\n\
  \n文档继续写并提供了 SSL 命令的正确语法如下：\n\n```\n## ncat -C --ssl-verify --ssl-trustfile <custom-certs.pem>\
  \ <server> 443\n```\n\n现在你已经确认了正在连接到哪台机器，让我们看看 `netcat` 可用的另一个 SSL 功能。它有许多应用，正如当你进一步探索它时会看到的那样。\n\
  \n这个功能被认为具有“解开”（unwrap）SSL 的能力。文档建议，如果你正尝试从一个启用 SSL 的邮件服务器收集电子邮件，但你的邮件客户端没有可用的 SSL\
  \ 功能，那么 `netcat` 可以提供帮助。\n\n你首先将上述邮件客户端指向你的 `localhost`、你的本地机器或 IP 地址 `127.0.0.1`。当\
  \ `netcat` 在本地监听 TCP 端口 143（（通常用于未加密 IMAP 通信的端口）时，你可以按照如下方式将你的流量转发到邮件服务器上的加密端口 TCP\
  \ 端口 993：\n\n```\n## ncat -l localhost 143 --sh-exec \"ncat --ssl mail.chrisbinnie.tld\
  \ 993\"\n```\n\n你可以将此方法用于使用两个主机的任何协议，但例如 HTTP，在涉及多个主机时并不一定能良好工作。\n\n`netcat` 甚至可以充当\
  \ SSL 服务器。你需要提供一个证书，与之前的示例相反，该证书可能会被访问的客户端验证。\n\n在不指定证书文件和私钥的情况下——使用之前相同的选项（`--ssl-cert`\
  \ 和 `--ssl-key`）——`netcat` 会自动为你生成它们。你可以使用 `-l` 选项（或其等效的 `--listen`）如下启动 `netcat`：\n\
  \n```\n# ncat -v --listen –ssl\n```\n\n正如你在图 3.1 中所示，Netcat 自动生成了临时密钥。\n\n![描述 Netcat\
  \ 生成临时 SSL 的插图](img/c03f001.jpg)\n\n## 执行文件\n\n除了处理加密之外，你可以在接收到连接时在 shell 上执行命令。不用说，你必须始终考虑运行这些命令的潜在灾难性影响。\n\
  \n我们将看到的第一个（令人担忧的）执行文件示例是 Bash shell 本。它很容易启动，这非常令人担心。我已经提到过可以使用 netcat 进入服务器并留下另一种访问方式。使用\
  \ ncat 你甚至不需要 root 权限就可以打开 shell。试一下。\n\n在你的监听机器（向世界打开 shell 的 Luis）上，运行此命令：\n\n\
  ```\nLuis> # ncat --exec \"/bin/bash\" -l 1234 --keep-open\n```\n\n在你熟悉的连接风格（Lionel）中，只需运行此命令：\n\
  \n```\nLionel> # ncat Luis 1234\n```\n\n当你第一次连接到 TCP 端口 1234 时，你可能怀疑 shell 尚未生成。然而，尝试任何有效的\
  \ Bash 命令，例如请求目录列表：\n\n```\n## ls\n```\n\n你将看到 Luis 的当前目录，但在 Lionel 的控制台上，这应该让你担心。输入命令要非常小心，因为你不会得到习惯的所有典型\
  \ Bash 反馈，而且删除文件和执行命令非常容易。\n\n名为 Metasploit 的广受欢迎且强大的安全工具将此功能更进一步，使后门持久化。即使你不安装\
  \ Metasploit 并深入研究，阅读这篇关于在 Windows 机器上使用 netcat 的网页也是值得的：[`https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/`](https://www.offensive-security.com/metasploit-unleashed/persistent-netcat-backdoor/)。\n\
  \n\n\n\n使用 `netcat` 的功能不断涌现。你甚至可以为你的 `netcat` 实例添加 ACL（访问控制列表）。在监听模式的 `netcat` 守护进程上，你可能会添加诸如示例所示的\
  \ ACL。你可以通过你刚刚查看的 Bash 命令来扩展功能，尽职地锁定你的端口，如下例所示：\n\n```bash\n## ncat --exec \"/bin/bash\"\
  \ --max-conns 3 --allow 192.168.0.0/24 -l 8081 --keep-open\n```\n\n你可以看到只允许来自 CIDR\
  \ 范围 `192.168.0.0/24` 的 IP 地址，并且机器最多只开启三个连接。这些选项的组合增加了非常大的灵活性。\n\n该命令的反面可能是在使用 IPv6\
  \ 时，使用如下 `--deny` 示例：\n\n```bash\n## ncat -l --deny 1222:cb88::3\n```\n\n在这里你允许所有其他机器，而仅拒绝这一个。这同样适用于\
  \ IPv4。\n\n另外，当启用或禁用对多个主机的访问时，以下方法要高效得多。你只需用条目填充文件。使用 `--denyfile` 和 `--allowfile`\
  \ 选项：\n\n```bash\n## ncat -l --allowfile trusted-hosts.txt\n```\n\n## 杂选项\n\n顺带一提，你可以通过\
  \ `-u` 或 `--udp` 轻松地从默认的 TCP 跳。稍后你会看到为什么这很有用。\n\n同样，为了启动 SCTP（流控制协议），你可以为 `netcat`\
  \ 提供 `--sctp` 选项。\n\n另一个实用的技巧是，你也可以添加最多三个 `v` 字母，`-vvv` 在命令输出结果时提供最详细的日志。\n\n与你早些使用\
  \ `netcat` 处理 SMTP 命令一样，强大的 `netcat` 同样能够处理 Telnet 命令。结果，如果你发现自己无法访问 Telnet 客户端，那么\
  \ `netcat` 也可以提供帮助。首先，`netcat` 更加安静，除非由已连接的机器发送数据，否则它不会输出内容。还有一些保留控制字符，意味着如果你使用\
  \ Telnet，某些二进制数据将会损坏。此外，你可能注意到 Telnet 在空闲（idle）连接上退出并停止运行，这可能意味着你无法接收整个会话的数据。但正如你所知，Telnet\
  \ 对 UDP 的支持并不良好。\n\n## 总结\n\n在本章中，我只涵盖了 `netcat` 潜力的一小部分；其范围太大，无法完全覆盖。\n\n希望你理解这种复杂工具的一些特性至关重要，即使仅仅是为了揭示攻击者可能如何针对你部署它们。\n\
  \n下次我需要在局域网（LAN）内部移动文件时，我会确保使用 `netcat`；依靠 SFTP 等笨重的数据传输工具来此类此类任务太容易了。你应该避免使用 `Telnet`\
  \ 命令来调试端口和连接，而始终使用 `netcat`。\n\n在这种情况下，我也必须记住不要向同事展示上述任何操作，因为它们很有可能造成巨大的破坏并留下巨大的安全漏洞。\n\
  \n# 第 4 章：拒绝服务\n\n不可否认，如果没有某些关键服务的运行，互联网将会停滞。许多用户将遭受性能下降，而另一些人可能会完全中断。与 DNS（域名系统）一样，NTP（网络时间协议）是互联网成功运行的关键。在本章中，我将花时间描述攻击者如何尝试阻止关键服务的正常工作。\n\
  \n对于那些负责维护互联网运行的人来说，遗憾的是，可以使用方法攻击互联网大部分 DNS 和 NTP 基础设施。例如，过去的 DDoS（分布式拒绝服务）攻击主要设计用于让在线服务宕机，或至少以极令人沮丧的方式干扰其用户，可能是为了获得竞争优势或索要赎。目前的观点是，此类攻击现在被用作烟雾弹来掩盖其他的恶意安全漏洞。\n\
  \n卡巴斯基实验室于 2014 年发布的一份报告估计，小型企业在 DDoS 攻击上的花费大约为 52,000 美元。对于经历过此类攻击的企业，这一数字将升至约\
  \ 444,000 美元。考虑到声誉损失、客户对使用缓慢在线服务（如果可用的话）的怨满，以及支付交易失败（事后可能需要人工干预解决），防御此类基础设施挑战是一项值得的活动。最令人担忧的是，在参与该报告调查的\
  \ 27 个国家的 3,900 个组织中，“超过三分之一（38%）提供金融服务或运营面向公众的在线服务的企业在 2013 年 4 月至 2014 年 5 月期间经历过\
  \ DDoS 攻击。”\n\n导致无法访问关键在线服务的方法有很多形式。在过去的几年中，我看到 NTP 和 SNMP 服务的反射攻击（包括放大攻击）增加，我将描述它们背后的部分历史、涉及的内容以及如何减轻其潜在的灾难性影响。\n\
  \n## NTP 基础设施\n\n我提到过关键基础设施服务是攻击的常见目标，因为它们为攻击者提供了高价值的奖品。随着 DNS 和 NTP 协议多年来的演进，安全性自然被纳入设计之中。考虑一下\
  \ NTP。\n\n正如你所预期的，内置的安全机制可以帮助加固作为服务的 NTP。例如，某些顶级层 1 服务器采用了“关闭账户”选项，未经事先许可无法使用这些服务器。相反，正如你所预期的，只要你遵守其使用策略，开放访问服务器是随时可用的。那些受限访问服务器有时会因为客户端数量或最小轮间隔而受到限制，且仅对某些类型的组织（如学术机构）开放。\n\
  \n\n\n\n关注 NTP 的整体安全性还有其他充分理由。除了对 IP 地址的需求以及带宽使用对银行余额的影响外，你还需要将互联网的 NTP 基础设施列入服务清单，因为这些服务即将受到物联网（IoT）可能爆炸性的、指数级增长的影响。据记录，很快将会有数以亿计的额外设备需要进行同步，这样你的冰箱就可以在牛奶用光之前订购一些，诸此类推。\n\
  \n## NTP 反射攻击\n\n2014 年左右，一种恶劣的 NTP 攻击浮出水，令互联网服务提供商（ISP）不堪不堪，并迫使互联网社区采取迅速且有效的行动来遏制它。在短时间内，至少在攻击受害者中，这种攻击造成了巨大的困惑。这种惊人简单但具有创新的漏洞影响了几乎所有的\
  \ NTP 实现。这种攻击被称为反射攻击（reflection attack），其本质是产生原本不需要的流量，并将这些流量指向受害者。除非受害者拥有重大的底层基础设施支持，否则这通常会导致受害者遭受负载或带宽容量问题。在过去，这些攻击被称为“挑战-响应攻击”（challenge-response\
  \ attacks）；但在我看来，这种描述并没有太大帮助，因为并不是所有的反射攻击都涉及身份验证，而挑战-响应通常与身份验证机制相关。\n\n2014 年的 NTP\
  \ 攻击遵循此前经常看到的类似 DNS 反射攻击。当发现某个关键服务存在此前未见过的可利用攻击向量时，技术人员会争分夺秒地保护自己的基础设施。他们面临的决策包括：在发布补丁或配置修复之前，是否需要立即禁用该单一服务以确保其他服务的继续运行。毕竟，在计算机上手动设置时间，或者在许多情况下允许系统时钟存在微小误差是可能的。许多服务在出现任何不良影响之前，都可以在缺失\
  \ 24 小时 NTP 同步更新的情况下幸存。\n\n在这类攻击中，有两个术语出现频率很高。第一个是 `reflection`（反射），同源于攻击流量的镜像式重定向。在这里，许多第三方服务通常通过将流量发送给受害者（主要目标）而不是攻击者来做出响应。这是通过伪造或欺骗攻击者的\
  \ IP 地址实现的，从而欺骗第三方关于最初是谁请求了该流量。\n\n另一方面，`Amplification`（放大）最好被解释为：发送一个数据包作为问题，并收到一百个数据包作为答案。在反射攻击的情况下，这指的是毫无防备的受害者收到了负载，或者收到了一个并未问过的巨大答案。\n\
  \n想象三角形中的三台机器。机器 A 代表 B 向机器 C 提了大量问题。机器 C 然后将所有答案错误地发送给 B。机器 B 被海量的答案淹没。机器 A 对 B\
  \ 来说是不可见的，B 甚至不知道 A 参与了攻击。对于保护其基础设施的人来说，这构成了一个极具挑战性的诊断。\n\n据报道，由标准 DNS 反射攻击产生的 DDoS\
  \ 流量放大比例约为 70:1。也就是说，如果你有 1 Gb 比特的可用带宽，你就可以转发 70 Gb 比特。据报道，通过 NTP 漏洞实现的上述反射比例范围在\
  \ 20:1 到 200:1 之间。你只需要查找一个免费提供的公共 NTP 服务器列表，就可以创建惊人的 NTP 流量来为你的 DDoS 攻击提供燃料。\n\n\
  NTP 攻击正如常一样，简单得可怕。它基于一个内置函数，该函数允许任何人查询最后几百个连接过的 NTP 服务器。被利用的函数称为 `monlist`；你可能还会看到它显示为\
  \ `MON_GETLIST`。攻击者伪造提问的 IP 地址，使得被查询的 NTP 服务器回复受害者而不是提交查询的机器。通过反复执行该命令，如果有成千上万服务器同时响应，受害者很快就会被淹没。这种“反射”攻击的“放大”——答案中涉及的数据量远大于原始问题——正是其具有如此破坏性的原因。这是因为只需用于进行此类查询的源服务器数量较少，就能击倒大量的设施部分。\n\
  \n在 IPv4 系统（第一行显示为 `-4`）和 IPv6 系统（第二行带有 `-6`）上，缓解此类攻击的核心在于你的 NTP 配置文件中的以下几行：\n\n\
  ```\nrestrict -4 default nomodify nopeer noquery notrap\nrestrict -6 default nomodify\
  \ nopeer noquery notrap\n```\n\n在其他地方，还有一个非常受欢迎的 NTP 服务器模板，你可以用它帮助你的面向网服务器避免成为此类攻击的一部分，地址位于\
  \ [`www.team-cymru.org/templates.html`](http://www.team-cymru.org/templates.html)。如果你访问该页面并点击“Secure\
  \ NTP Template”链接，将看到一组针对各种平台的模板，包括 Cisco iOS、Juniper Junos 和 Unix。\n\n此外还包含一个如何配置\
  \ IPtables 以帮助锁定 NTP 的有用提示如下：\n\n```\n## iptables -A INPUT -s 0/0 -d 0/0 -p udp\
  \ --source-port 123:123 -m state --state ESTABLISHED -j ACCEPT\n## iptables -A OUTPUT\
  \ -s 0/0 -d 0/0 -p udp --destination-port 123:123 -m state --state NEW,ESTABLISHED\
  \ -j ACCEPT\n```\n\n此外，还有一条有趣的备注，说明如果你恐慌并决定通过在路由器级别阻止 NTP 流量进入你的网络，可能会产生潜在的破坏性影响。只有在你完全清楚自己在做什么时，才应该过滤\
  \ UDP 端口 `123` 的 NTP 流量，否则关键服务将不可避免地失败。\n\n## 攻击报告\n\n当那次 NTP 攻击发生时，云服务提供商 CloudFlare\
  \ 宣布了记录在案最大的同类攻击。根据 CloudFlare 的数据，攻击流量接近 400 Gbps，令人震惊的是，需要 4529 台服务器才能产生如此巨大的流量，横跨了\
  \ 1298 个不同的网络。相比之下，针对 Spamhaus（反垃圾邮件服务提供商）的一次广为人知的攻击据报道使用了 30956 个开放 DNS 解析器生成了\
  \ 300 Gbps 的 DDoS。如你所示，从单机器的影响来看，这种差异是巨大的。\n\n另一种越来越多用于 DDoS 攻击的协议是 1988 年由 PSINet\
  \ 创建的，PSINet 是全球最大的 ISP 之一（如果不是最大的话），最终被各种合并和收购吸收。\n\n简单网络管理协议 (`SNMP`）存在于绝大多数网络设备中，例如交换机和路由器。这种实用的协议有助于将统计信息（如带宽使用情况）反馈给任何能够接收它的软件。最重要的是，默认开启了一个基于名为\
  \ `public` 的社区字符串的攻击向量。即使配置了密码，它们通常也很简单，例如 `private`。这意味着即使你的宽带路由器也构成了潜在风险，并可能参与\
  \ DDoS 攻击。\n\n\n\n\n\n已发现攻击者正在利用 `SNMP` 进行大规模的反射/放大攻击。据报道，这种令人震惊的流量比例高达 1700:1。当然，这一估计有多准确仍有待观察，而且其中是否存在某种危言耸听的成分。\n\
  \n2014 年 5 月，Akamai 的 DDoS 部门报告说他们发现了 14 次 `SNMP` 攻击。其中近一半发生在美国，约 18% 发生在中国。\n\n\
  ## 防止 SNMP 反射\n\n在快速检查你的 `/etc/services` 文件后，你可以看到 `SNMP` 使用的默认端口的以下细节：\n\n```\n\
  snmp            161/tcp                        # Simple Net Mgmt Proto\nsnmp   \
  \         161/udp                        # Simple Net Mgmt Proto\nsnmptrap     \
  \   162/tcp                        # SNMPTRAP\nsnmptrap        162/udp     snmp-trap\
  \          # Traps for SNMP\n```\n\n为了防止源自你网络的 `SNMP` 流量发生反射，你可以遵循“默认拒绝”的做法，确保你的边界防火墙不会让此类流量流出局域网（LAN）并进入互联网。当然，这同样适用于进入你局域网的流量。然而，通常情况下，在匆忙设置、升级或由技术技术人员配置设备时，默认设置往往保持不变，导致忽略了这些预防措施。此类攻击最令人担忧的是，得益于全球大量的宽带路由器，手动修复其中一些路由器可能花费长时间（尽管负责任的\
  \ ISP 可以在其网络中添加有用的入站和出口过滤器）。与此同时，大部分基础设施可能会开始遭受性能问题。\n\nAkamai 描述的 `SNMP` 攻击归因于一个专门设计的攻击工具。该工具自动化了\
  \ `GetBulk` 请求并伪造了 IP 地址，方式与 NTP 和 DNS 反射攻击相同，以确保受害者的 IP 地址接收到对这些虚假请求发送的大量响应。幸运的是，这种特定的攻击仅适用于旧版本的\
  \ `SNMP`（即版本 2）。版本 3 提供了更高的安全性，并且默认情况下不会被如此地滥用。\n\n令人担忧的是，这种攻击的核心设计是仅通过几次请求（甚至可能来自单台机器）就能产生大量的流量。犯罪分子不需要投入时间、资源（有时还需要花钱购买僵尸网络），就可以破坏大部分在线基础设施。\n\
  \n## DNS 解析器\n\n2014 年底，另一种有趣的攻击浮出水面。关于这是否真的是为了进行反射攻击目前仍有争议，但我在这里讨论它，以增加你对该主题的了解。作为其服务的一部分，Google\
  \ 提供了两个具有记忆点 IP 地址的重要 `DNS` 解析器：\n\n```\n8.8.8.8\n8.8.4.4\n```\n\n这些解析器允许任何没有可用完整\
  \ `DNS` 服务器的个人或设备提供递归 `DNS` 查询。这些 `DNS` 解析器将对你请求的任何查询做出响应，要么通过其缓存，要么在缓存中没有合适答案时通过新的查找。OpenDNS\
  \ 提供了类似的服务，但它公开讨论了过滤你的 `DNS` 查询的益处，例如，在你尝试访问之前被报告的钓鱼网站时向你发出警告。它们的 IP 地址也容易记忆、具有韧性且可靠：\n\
  \n```\n208.67.222.222\n208.67.220.220\n```\n\n这些（大多数）免费的服务被广泛采用，可能是因为它们提供了无需在本地运行\
  \ `DNS` 服务器开销的便利性。然而，得益于它们易记的 IP 地址和卓越的可靠性，遗憾的是，许多许多服务一样，这些出于良好的提供者成为了另一个对攻击者极具吸引力的高价值目标。\n\
  \n显然，有非常充分的理由要密切关注你在生产基础设施中何处使用了此类服务，因为一旦它们被攻破，你将失去控制权。在 `DNS` 查询方面，最明显的攻击可能是 `DNS`\
  \ 缓存污染，即查询机会得到一个错误的答案并被发送到非合法的 IP 地址，这可能会感染请求者或以其他方式攻击它。许多 `DNS` 缓存污染攻击中的一种是所谓的\
  \ Kaminsky 风格攻击（[`dankaminsky.com`](http://dankaminsky.com)），它们不仅毒化单个 `DNS` 记录，而是直接接管了域名的权威记录。关于安全研究人员\
  \ Dan Kaminsky 的发现，有一些写得很好的信息位于 [`http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)。\n\
  \n由于其影响，`DNS` 攻击的意义不应低估。据报道，Google 的 `DNS` 解析器每天处理约 1500 亿次查询。\n\n2014 年的攻击表面上在第四季度包含了\
  \ Google 的 `DNS` 解析器 IP 地址，受到了热门在线安全频道的关注。例如，Internet Storm Center（[`isc.sans.edu`](https://isc.sans.edu)）针对声称来自\
  \ Google `DNS` 解析器并到达你网络的攻击提供了识别建议。通过一些简单的数据包嗅探，可以监控此类攻击并记录其频率。\n\n在这里，使用 `tcpdump`\
  \ 嗅探工具，你只需将你发现的任何相关流量转储到名为 `/tmp/suspect_traffic` 的文件中。你将这些流量分类为来自 IP 地址 `8.8.8.8`\
  \ 目标端口 `161`：\n\n```\n## tcpdump -s0 -w /tmp/suspect_traffic dst 161 and src 8.8.8.8\n\
  ```\n\n通过捕捉这些流量，你可以监控其容量以及 `DNS` 查询是否合法。如果发现了不受欢迎的流量，你可能希望通过引入防火墙规则来限制受影响设备与外部的通信。防火墙为相关设备提供了访问世界的权限。\n\
  \n白帽和其他安全专业人员之间的讨论表明，这些显然源自 Google IP 地址的攻击实际上被设计用于（使用预配置为设备 DNS 服务器的 IP 地址）来利用和击败配置不当的设备，而不是为了反射流量。换句话说，攻击者可能会重新配置这些设备用于自己的恶意目的，而不是拒绝服务。\n\
  \n为了进一步阅读，请考虑另一种攻击向量，即绕过合法 BGP 宣告（边界网协议是将互联网许多网络连接的复杂路由协议）针对 Google `DNS` 解析器的尝试；你可以在此处阅读更多信息：[`http://thehackernews.com/2014/03/google-public-dns-server-traffic.html`](http://thehackernews.com/2014/03/google-public-dns-server-traffic.html)。\n\
  \n## 共犯\n\n有一套建议关注如何限制离开你网络的伪造流量。遗憾的是，经验告诉我们，无论是因为无能还是缺乏资源，总会有比例的网络管理员未能意识到遵循此类指南的重要性，或者他们根本没有能力关注这些内容。当然，不要忘记还有一小部分管理员为了犯罪活动而故意留下后门。\n\
  \n\n\n\n\n一份早期文档编写于 2000 年，旨在引发讨论并帮助那些对维护互联网运行感兴趣的人。该文档被称为“当前最佳实践 38”（BPC 38；[`https://tools.ietf.org/html/bcp38`](https://tools.ietf.org/html/bcp38)），它为网络管理员提供了深受欢迎的建议。在其他组织中，它鼓励企业和学术机构加强其主机和网络设备上网络基础设施各个方面的防御能力，以防止互联网出现级联效应。\n\
  \n具体而言，它花了一些时间讨论了入站过滤（ingress filtering）的重要性，以便在当自己的网络被用作攻击工具时，能够保护外部网络免受影响。引用此观点，通过采用简单的预防措施，对来自“有效”源的攻击进行诊断和缓解，比猜测源流量来自何处要有效得多，正如你在之前的章节“NTP\
  \ 反射攻击”中看到的那样。\n\n许多情况下，不同层次的入站过滤可以实现这一目标。提出的一个观察结果是，通过减少对互联网攻击的数量和频率，最终在攻击发生时会有更多的资源可用。因此，响应将更加有效。这些开创性指南的大部分内容都归功于受尊敬的\
  \ NANOG（北美网络运营商小组；[`https://www.nanog.org`](https://www.nanog.org)），他们在一个受欢迎的邮件列表中详尽且激烈地讨论网络问题。\n\
  \n## 让一个国家陷入瘫痪\n\n多个地理位置分散的系统针对单一系统（例如网络化系统或自治系统，无论其规模有多大）并使其离线的威胁，长期一直是企业、互联网服务提供商（ISP）甚至整个国家的担忧。DDoS\
  \ 攻击可能从 20 世纪 80 年代中期就开始了。\n\n2007 年有广泛报道称，波罗国家爱沙尼亚遭受了多次 DDoS 攻击，结合街骚乱，几乎让政府陷入瘫痪。显然，民众反对爱沙尼亚议会移除一座著名的战争纪念碑。加上高水平的社会动荡，这是最后的转折点。来自\
  \ DDoS 的不断增加的攻击流量在长时间内持续地接收。新闻机构对连接的缺失感到沮丧，因为这意味着世界其他地区无法及时了解国内发生的事件。\n\n爱沙尼亚的 DDoS\
  \ 攻击不断演变，据报道曾一度涉及每秒四百万个数据包的攻击流量。这部分目的是针对该国最大的银行，根据某些报告，最终成功使其脱离了互联网。根据国家统计数据，约 97%的人口使用在线银行服务，这意味着该国的银行系统发生了致命性故障。如果影响还不够严重，互联网连接的缺失意味着主银行无法与自动取款机（ATM）通信或从其提取现金。\n\
  \n令人担忧的是，据说与这次持续了三周的巨大破坏性事件相关的唯一逮捕，仅导致了低于 2000 美元的罚款。然而，从爱沙尼亚获得的惨痛教训加强了 NATO 在提高应对此类攻击国际响应有效性方面的作用。\n\
  \n## 攻击映射\n\n正如 William Cheswick 等人写的优秀书籍《防火墙与互联网安全：击败狡猾黑客》（*Firewalls and Internet\
  \ Security: Repelling the Wily Hacker*）在引言中简洁提到的：\n\n> 互联网是一个大城市，任何人都可以使用它，并且几乎以匿名的方式使用它。\n\
  \n> 互联网是一个糟糕的社区。\n\n通过使用数字攻击地图（Digital Attack Map）可以证实这段话的有效性，这是一款在线工具提供了 DDoS 攻击的极佳全球概述，并每小时更新一次，地址为\
  \ [`www.digitalattackmap.com`](http://www.digitalattackmap.com) 。\n\n这个完全图形化的数字攻击地图工具由\
  \ Arbor Networks 和 Google Ideas 运行，他们通过全球 270 多家 ISP 的数据填充该工具。这些 ISP 已与 Arbor Networks\
  \ 的全球威胁情报系统 `ATLAS` 共享数据。数据也可以通过 Arbor 的 `ATLAS` 威胁门户获取，并值得仔细查看 [`www.arbornetworks.com/threats`](http://www.arbornetworks.com/threats)\
  \ 。\n\n此外，在 [`www.digitalattackmap.com/gallery`](http://www.digitalattackmap.com/gallery)\
  \ 处有一个非常有用的画廊，展示了关键的历史攻击以供参考。你可以通过将鼠标悬停在攻击流上进行交互，揭示在攻击期间被滥用的、令人惊叹的每秒千比特（gigps）带宽。还存在攻击的大致来源（例如，如果攻击是由僵尸网络生成的，它可能来自几十个不同的国家）、假设的目标受害者以及攻击的持续时间。额外感兴趣的是攻击期间使用的源端口和目的端口；你看，在我查询的最初几个攻击中，`NTP`\
  \ 端口 `UDP` 端口 `123` 出现了。有趣的是，根据可用数据判断，端口 `80` 和 `53`（分别对应 `HTTP` 和 `DNS`）似乎仍然是最流行的\
  \ DDoS 服务。\n\n图 4.1 显示了来自数字攻击地图网站的攻击示例，以及全球地图左侧的攻击类型及其颜色编码。这仅仅是该功能强大的网站的启动页。你可以花费几个小时深入研究该网站以易于理解的格式提供的当前和历史信息。\n\
  \n![来自 Arbor Networks 的数字攻击地图网站的攻击示例，以及全球地图左侧的攻击类型及其颜色编码。](img/c04f001.jpg)\n\n\
  图 4.1 由 Arbor Networks 提供并由 Google Ideas 支持的全面数字攻击地图网站\n\n## 总结\n\n在本章中，我们查看了影响关键基础设施服务的若干安全问题。这些服务大多受到更脆弱的\
  \ `UDP` 的影响，确实有助于将互联网连接在一起，并显然需要被保护。其中一些攻击属于较旧的设计，但注意攻击类别如何随不同时间段激增和减少是非常趣的。例如，一种多年未见的攻击可能会以稍微更进化的状态重新出现。正如你最近看到的，黑客社区提供的\
  \ `SNMP` 攻击工具（很可能是受到 `NTP` 反射攻击成功的推动）引起了最广泛的。\n\n即使无法跟进更复杂的攻击的详细细节，但其原理是简单的。依赖 `UDP`\
  \ 的服务目前风险最高。`UDP` 并不总是期待响应（`TCP` 享有三次握手机制），因此更有可能被用于反射和放大攻击。\n\n\n\n\n\n正如美国军部的\
  \ DARPA（国防部高级研究计划局）做出了巨大贡献并帮助塑造了你今天所熟知并喜爱的互联网，类似的军转民用转化也产生了当今互联网上常用的网络发现工具：`ping`\
  \ 命令。`ping` 命令的渊源源于海军船只发送声纳脉冲，以检测附近是否有其他船只或地理特征。\n\n作为强大的安全工具 `Nmap` ([`nmap.org`](https://nmap.org))\
  \ 提供的网络发现功能的一部分，它还包含了对标准 `ping` 命令的一项强大改进的访问，称为 `Nping` ([`nmap.org/nping/`](https://nmap.org/nping/))。如果你用过\
  \ `Nmap`，那么你就知道，在可靠性和经过深思的功能方面，由 Nmap 项目创建的任何工具都是可靠的。\n\n让我们来看看 `Nping` 工具如何帮助你更深入地了解你的系统和网络运行情况，挖掘远程和本地连接。\n\
  \n## 功能\n\n从表面上看，你可能认为 `Nping` 的功能相对有限。毕竟，当你发送一个 ping 时，你只是发送一个问题然后简单等待回答。虽然 `Nping`\
  \ 仍然不是一个完成的软件，但可以说它是一个非常全面且复杂的网络工具。\n\n你将从习惯语法开始。你需要以超级用户 `root` 的身份登录以执行某些 `Nping`\
  \ 命令，在一种情况下，你将查看 TCP 模式。你的第一个练习将向你的本地机器发送 TCP “ping”。从标准 `ping` 的 man 页面中，你可以看到\
  \ `ping` 的正常操作“使用 ICMP 协议强制的 ECHO_REQUEST 数据报来诱发主机或网关的 ICMP ECHO_RESPONSE 报答”。换句话说，这里涉及一个问题和一个问答。\n\
  \n如果你好奇的话，我将在这些示例中使用我的本地机器，以避免骚扰其他机器并导致防火墙日志中充斥可疑活动。与所有白帽工具一样，你应该谨慎地使用它们。\n\n令人印象深刻的\
  \ `Nping` 不仅关注 ICMP，还是标准 `ping` 命令的一个设计精良的扩展，还可以与许多协议进行通信。它还提供了易于理解的结果。\n\n如果你还没有安装它，可以按照以下方式安装\
  \ `Nping`。\n\n在 Debian 派衍生版上，只需使用以下命令安装 `Nmap` 软件包：\n\n```\n## apt-get install nmap\n\
  ```\n\n在 Red Hat 派衍生版上，使用此命令安装 `Nmap`：\n\n```\n## yum install nmap\n```\n\n## TCP\n\
  \n回到 TCP（传输控制协议）示例。你将在本地机器上运行以下命令，这样就不会有防火墙问题需要担心，也不会干扰其他系统管理员：\n\n```\n## nping\
  \ -c1 --tcp -p 80,443 localhost\n```\n\n在这里，你通过 TCP 发送一个 ping 数据包（带有 `-c1` 计数选项）到本地机器的\
  \ TCP 端口 80 和 443。此命令的输出可能看起来列表 5.1。\n\n你可以从列表 5.1 中看到你收到了来自 TCP 端口 80 和 TCP 端口\
  \ 443 的回复。根据 `--c` 选项，在每个端口发送一次数据（且数据已返回）后，ping 会自动停止。如果没有明显的有效响应，可能会看到类似的内容：\n\n\
  ```\nnping_event_handler(): READ-PCAP killed: Resource temporarily unavailable\n\
  nping_event_handler(): TIMER killed: Resource temporarily unavailable\n```\n\n现在你已经了解了一些\
  \ `Nping` 的外观以及它如何对你的输入做出反应，因此不要意外发现你可以随时使用无分类域间路由（CIDR）网络表示（例如 10.10.10.0/24）。你现在将保持基础，并查看如何指定一个端口范围进行\
  \ ping，而不是像你刚刚那样将它们列在列表中指定。\n\n考虑 Unix 类型机器上的“特权端口”（privileged ports）。这些端口在过去被称为几个名称（例如超级用户端口或原始端口），但本质上，只有\
  \ `root` 用户权限打开它们。这是最初的一种安全特性，意味着如果你远程连接到这些端口号之一，你可以很有理由认为运行在上面的服务是真实的。换句话说，它是由\
  \ `root` 用户生成的，而不是标准用户。以下是如何使用 `Nping` 检查所有特权 TCP 端口：\n\n```\n## nping -c1 --tcp\
  \ -p 0-1024 localhost\n```\n\n`Nmap` 使用了一种几乎肯定与其他网络工具不同的方法，以不寻的方式处理多个主机和端口号。为了效率起见，如果指定了多个目标机器，`Nping`\
  \ 不会简单地向列表中的第一个机器发送查询并耐心等待响应。相反，它采用了一种简单但聪明的轮询（round-robin）方法，交替联系机器，这样在等待响应时就不会给用户引入任何延迟。对于多个主机，这同样适用于多个端口，让目标在响应\
  \ `Nping` 的下一个端口之前有一个恢复的机会。\n\n## 解释器器\n\n`Nping` 可以充当解释器。如果你使用 `--tcp-connect`\
  \ 选项，你就在使用 `Nping` 的 TCP 连接模式。你不需要使用 `root` 权限来发送原本将是原始数据包的伪造 IP 地址并关闭会话。\n\n如果作为三个独立的命令，操作\
  \ TCP 握手可能如下：\n\n```\n## nping -p 80 --flags rst -c1 localhost\n## nping -p 80 --flags\
  \ syn -c1 localhost\n## nping -p 80 --flags ack -c1 localhost\n```\n\n## UDP\n\n\
  你也可以通过 `--udp` 选项选择使用 UDP 数据包。通常 TCP 和 UDP 数据包嵌入在 IP 包中，但正如我所说的，没有 root 权限，你无法查看数据包的内容。UDP\
  \ 数据包也是如此。\n\nUDP ping 有时可以发现其他协议失败的机器。UDP ping 可能会绕过防火墙并报告防火墙后是否有设备正在监听。这是你工具箱中非常有用的补充。简单的示例命令可能如下：\n\
  \n```\n## nping --udp localhost\n```\n\n当我尝试非 root 用户的情况下对本地机器运行此命令时，我看到了如下反馈：\n\
  \n```\nSENT (0.0069s) UDP packet with 4 bytes to localhost:40125 (127.0.0.1:40125)\n\
  ERR: (0.0070s) READ to 127.0.0.1:40125 failed: Connection refused\n```\n\n然而，作为超级用户\
  \ root，我可以如下所示完成事务：\n\n```\nSENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64\
  \ id=64074 iplen=28\nRCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable\
  \ (type=3/code=3) ttl=64 id=18756 iplen=56\n```\n\n你可以看到，两个示例中的 UDP ping 流量都指向 UDP\
  \ 端口 40125。\n\n## ICMP\n\n\n\n\n\n就像标准的 `ping` 命令一样，当以 root 用户身份执行且未选择其他协议时，`N`\
  \ 默认使用 ICMP。文档大胆地指出“[任何]种类的的 ICMP 消息都可以被创建。”例如，你可能会查询时间戳、生成伪的“目标不可达”消息，或者通过重定向数据包为另一个系统或网络引发问题。\n\
  \n请分别以 root 用户和标准用户登录并尝试以下命令：\n\n```bash\n## nping localhost\n```\n\n你可以清楚地看到细节上的差异。这里是标准用户的输出，没有太多细节：\n\
  \n```\nSENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)\nRECV\
  \ (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed\n```\n\n在下一个示例中，作为\
  \ root 用户，你可以看到关于 ICMP 数据包内容的更多信息。根据其 RFC (`https://tools.ietf.org/html/rfc792`)，`type=8`\
  \ 条目代表“8 Echo（回显请求）”，这正是你预期的。\n\n```\nSENT (0.0152s) ICMP 127.0.0.1 > 127.0.0.1\
  \ Echo request (type=8/code=0) ttl=64 id=31032 iplen=28\nRCVD (0.0154s) ICMP 127.0.0.1\
  \ > 127.0.0.1 Echo reply (type=0/code=0) ttl=64 id=18763 iplen=28\n```\n\n## ARP\n\
  \n你还拥有 `--arp` 选项，它允许你实验地址解析协议（ARP）。除了不受欢迎的 ARP 缓存投毒攻击，你还可以构造各种类型的 ARP 数据包。现在过时的\
  \ RARP（反向 ARP）查找曾用于将 MAC 地址转换为 IP 地址。RARP 已被 `BOOTP` 和 `DHCP` 协议取代，但 RARP 有时仍有其用之地。还有一种\
  \ RARP 的演进版本称为动态 RARP (DRARP)，它是被支持的。它主要在上上世纪末由 Sun Microsystems 公司使用，如今极少使用。此外还支持“InARP”请求；这与\
  \ RARP 类似，但主要应用于帧中继（frame relay）和 ATM 网络。\n\n最后，为了这些这些协议，你可以在输出中添加 `--traceroute`，通过查看响应的“目标不可达”数据包的源地址，帮助确定流量所经的路径。\n\
  \n Payload 选项（负载）\n\n现在你已经熟悉了主要的协议选项，让我们看看是否能将新学到的知识付诸实践。另一个提醒是，Nmap 是为白帽活动设计的，应当为此目的使用，而不是为了非法获利。此类工具可能会导致混乱。\n\
  \n如果你想为你的探测数据包添加负载（payload），那么有三种类型，如表 5.1 负载选项及其描述\n\n Echo 模式\n\nNping 包含的高级功能之一是\
  \ Echo 回显）模式。该模式旨在详细显示数据包在穿越网络时发生了什么。通过在两个主机上启用 Echo 模式，你可以建立服务器与客户端的关系，精确监控线路路上发生的状况。\n\
  \n让我们来看看这个功能。服务器组件捕获包，然后通过 TCP 通信“通道”将细节发回客户端。首先，生成上述数据包是客户端的任务。\n\n这种技术是发现任何可能发生的数据包篡改的极佳方法。例如，如果涉及到网络地址转换（NAT），许多数据包细节也会发生变化。通过使用这种技术，如果线路上的设备更改了任何其他\
  \ TCP 选项，或者发生了流量整形，这些原本难以诊断的细节就会变得显而易见。你可能还能确定数据包在传输途中何处被神秘地阻塞，这将有助于诊断问题。\n\n让我们尝试使用\
  \ Echo 模式做一个小实验。顺便一下，如果你想从 Nping 获取更多输出和更高级别的详细信息，可以添加 `-vvv`。要开始操作，你需要作为 root 用户来启动连接的服务器端。你将使用密码“please_connect”，并通过以下命令在你的\
  \ `eth0` 网络接口上接收到的输出中添加详细信息：\n\n```bash\n# nping -e eth0 -vvv --echo-server \"please_connect\"\
  \n```\n\n该命令的结果如下：\n\n```\nSENT (0.0027s) Starting TCP Handshake > localhost:80\
  \ (127.0.0.1:80)\nRECV (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed\n\
  ```\n\n\n\n\n由于 NAT 非常流行（而且你的连接很可能经过了 NAT 处理），如果你查询该机器，很有可能在 `SENT` 行下方和下一行 `RCVD`\
  \ 行之前看到 `CAPT` 条目。这个命令对我来说是有效的：\n\n```\n# nping --echo-client \"public\" echo.nmap.org\
  \ --tcp\n```\n\n如果你仔细观察捕获的数据包条目（`CAPT`），那么你应该能够判断出 NAT 是否更改了你的出站源地址。你会看到一个根据 RFC\
  \ 1918 ([`tools.ietf.org/html/rfc1918`](https://tools.ietf.org/html/rfc1918)) 的私有\
  \ IP 地址（例如 `10.10.10.10`），在有 NAT 参与的情况下，它被更改为显示公路由 IP 地址（例如 `123.123.123.123`）。检测\
  \ NAT 干扰你的连接是容易的。记住，在有 NAT 的地方，有时还有其他设备会修改 MTU（最大传输单元）、用于流量整形的数据包篡改、意外的防火墙以及可能导致你的连接发生细微变化的隐形交换机。\n\
  \nNping 可以在许多其他场景中提供帮助，例如（在经过学习后）能够识别路径途中可能使用了透明代理。我将留给你进一步提升技能，但在此期间，以下章节描述了一些你可能会觉得有用的其他选项。\n\
  \n## 其他 Nping 选项\n\n使用 `--delay 10` 选项，你可以选择限制数据包的频率。默认通常是每隔一秒发送一次 ping，但如果你在严密观察某个特定事件，增加此值可以减少屏幕上的噪音。\n\
  \n与之类似的是 `--rate 3` 选项，在给出的示例中，你可以通过每秒发送三个数据包来泛洪目标机器。不过，不要纠结于 `rate` 和 `delay` 选项的设置。根据文档：\n\
  \n> [t] `rate` 选项和 `--delay` 是反向的；`--rate 20` 等同于 `--delay 0.05`。如果同时使用了这两个选项，以参数列表中的最后一个为准。\n\
  \n你可以利用 `-H` 或 `--hide-sent` 选项来不显示出站数据包。例如，如果你正在对连接进行泛洪，这将会很有帮助。\n\n此外，如果你正在对网络泛洪并测试其对大量负载的响应，你可能不想处理收到的每个包。`-N`\
  \ 或 `--no-capture` 选项不会捕获任何收到的数据包。\n\nNping 许多许多命令行选项可用。例如，你可以添加 `--debug` 来帮助你获取更多细节。你可以修改\
  \ TTL（存活时间）设置。如果你正在扫描许多主机，你可能还想添加一个超时选项，通过 `--host-timeout 10` 让 Nping 永远不要等待响应，其中\
  \ `10` 的单位是秒。\n\n我曾简要提过通过伪造 IP 地址来伪造发送 IP 地址；Nping 可以更进一步，通过使用类似这样的命令对主机 `whitehat.chrisbinnie.tld`\
  \ 进行攻击，甚至在发送者字段中填充随机值：\n\n```\n# nping --arp --sender-ip random --ttl random whitehat.chrisbinnie.tld\n\
  ```\n\n当我第一次读到这个功能时，警钟响了。能够（成功地）使用随机值伪造 IP 地址应该让任何系统管理员感到担忧。这只需要上游路由器配置不当，就能允许此类流量到达组织的网络中。\n\
  \n最后，如果你想调整 Echo 模式使用通道的方式，`--channel-tcp` 或 `--channel-udp` 就可以做到：\n\n```\n# ping\
  \  -vvv --client --channel-tcp 1234 --tcp -p 8100 localhost\n```\n\n正如你可能想象到的，如果有严格的防火墙阻碍，能够调整\
  \ Echo 模式通过 TCP 和 UDP 将其“通道”数据传回给客户端，可能是救命稻草。\n\n## 总结\n\n如果你随着时间的推移不断尝试 Nping，你会发现它提供的报告确实非常详尽。我鼓励你只要有机会就去尝试使用\
  \ Nmap，以获得更多接触。\n\n凭借其数据包包包的能力，强大的 Nping 可以超越许多竞争对手。高级 Echo 模式的加入意味着，如果你可以访问连接的两端，设备逃避检测的概率就会更小。结果是故障排除应该变得更迅速、更不那么困难。\n\
  \nNmap 强大的 Nping 可能仅被视为白帽工具箱中的一个工具。通过合法地使用这些工具，你将在你的预定任务中表现出色，而且作为一个令人欢迎的收获，你将学会如何保持你自己的服务器运行。\n\
  \n# 第 6 章\n\n## 记录侦察行为\n\n有时，你需要额外关注谁正在连接你的服务器。例如，最近可能发生了一系列攻击，你想严密监控它们；或者由于数据的敏感性或服务的关键性，你可能通常情况下就非常偏执。\n\
  \n监控那些对你的服务器进行侦察的机器的一种种相对简单的方法，是记录对它们运行 ping 和 traceroute 的 IP 地址。你可能认为你收集到的信息将没有太大用，但它对于构建谁连接、频率如何以及何时连接的图像实际上非常重要。就像研究办公室的闭路电视（CCTV）视频一样，久而久之你就会谁很异常。由于某种原因需要监视你的服务器，我认为正确监控的技巧取决于两点：首先，你需要一个在后台运行的守护进程；它应该是可靠的，不会引入竞态条件并导致服务器故障。其次，你需要最小化日志，以便在一年后查看日志时无必担心日志会填满磁盘。显然，你也不希望攻击日志填满你的磁盘。\n\
  \n\n\n例如，如果你想捕获 ping 包，那么当我从另一台机器 ping 我那台高度敏感的服务器时，以下命令可以生效：\n\n```\n# /usr/sbin/tcpdump\
  \ -i eth0 icmp and icmp[icmptype]=icmp-echo\n```\n\n接下来的示例展示了 `tcpdump` 的 ICMP 数据包嗅探能力，同时也捕获了\
  \ traceroute（路由追踪）：\n\n```\n# /usr/sbin/tcpdump ip proto ∖∖icmp\n```\n\n如你在下面的代码所示，ping\
  \ 同时依赖于响应和请求；然而，由于我那台敏感服务器的防火墙阻止了某些 ICMP 流量，当 traceroute 出现时，会记录一条 `admin prohibited`\
  \ 错误。\n\n```\nlistening on eth0, link-type EN10MB (Ethernet), capture size 65535\
  \ bytes\n17:06:47.925923 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo\
  \ request, id 21266, seq 1, length 64\n17:06:47.925979 IP noid.chrisbinnie.tld >\
  \ recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq 1, length 64\n17:06:48.927871\
  \ IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request, id 21266,\
  \ seq 2, length 64\n17:06:48.927921 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld:\
  \ ICMP echo reply, id 21266, seq 2, length 64\n17:06:49.928069 IP recce.chrisbinnie.tld\
  \ > noid.chrisbinnie.tld: ICMP echo request, id 21266, seq 3, length 64\n17:06:49.928136\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq\
  \ 3, length 64\n17:06:52.215139 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld:\
  \ ICMP host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n17:06:52.215179\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n17:06:52.215194 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n17:06:52.215210 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP\
  \ host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n17:06:52.215220\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n17:06:52.215231 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n```\n\n在代码段中，一个名为 `noid` 的服务器收到了来自 `recce` 主机的探测。`Recce` 正在进行侦察以查看服务器是否在线。\n\
  \n## Iptables\n\n你也可以运行 `iptables` 命令，它使用了基于内核的 Netfilter 防墙：\n\n```\n# iptables\
  \ -I INPUT -p icmp --icmp-type 8 -m state --state NEW,ESTABLISHED,RELATED -j LOG\
  \ --log-level=1 --log-prefix \"Pings Logged \"\n```\n\n如果你在留的话，可能会发现数字 `8` 被用作了\
  \ `--icmp-type` 的值。在 表 6.1 中，你可以看到 ICMP 使用的代码。你可以在其请求意见（RFC）页面找到更多信息，地址为 [`https://tools.ietf.org/html/rfc792`](https://tools.ietf.org/html/rfc792)\
  \ 。根据该页面，ICMP 自 1981 年左右就存在了，那时的互联网是一个完全不同的东西。\n\n| Type | Code |\n| :--- | :---\
  \ |\n| 0 | Echo Reply |\n| 3 | Destination Unreachable * |\n| 4 | Source Quench\
  \ * |\n| 5 | Redirect |\n| 8 | Echo Request |\n| B | Time Exceeded * |\n| C | Parameter\
  \ Problem * |\n| D | Time stamp Request |\n| E | Time stamp Reply |\n| F | Info\
  \ Request |\n| G | Info Reply |\n| H | Address Mask Request |\n| I | Address Mask\
  \ Reply |\n\n**表 6.1** **由于 ICMP 流量的滥用，现代 Linux 实现中为了安全考虑限制了 ICMP 流量，因此在 表 6.1 中标记了星号\
  \ *。**\n\n在下面的代码段中，名为 `noid` 的服务器收到了来自 `recce` 主机的探测。`Recce` 正在进行侦察以查看服务器是否在线。\n\
  \n```\nlistening on eth0, link-type EN10MB (Ethernet), capture size 65535 bytes\n\
  17:06:47.925923 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld: ICMP echo request,\
  \ id 21266, seq 1, length 64\n17:06:47.925979 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld:\
  \ ICMP echo reply, id 21266, seq 1, length 64\n17:06:48.927871 IP recce.chrisbinnie.tld\
  \ > noid.chrisbinnie.tld: ICMP echo request, id 21266, seq 2, length 64\n17:06:48.927921\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq\
  \ 2, length 64\n17:06:49.928069 IP recce.chrisbinnie.tld > noid.chrisbinnie.tld:\
  \ ICMP echo request, id 21266, seq 3, length 64\n17:06:49.928136 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP echo reply, id 21266, seq 3, length 64\n17:06:52.215139\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n17:06:52.215179 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n17:06:52.215194 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP\
  \ host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n17:06:52.215210\
  \ IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld\
  \ unreachable - admin prohibited, length 68\n17:06:52.215220 IP noid.chrisbinnie.tld\
  \ > recce.chrisbinnie.tld: ICMP host noid.chrisbinnie.tld unreachable - admin prohibited,\
  \ length 68\n17:06:52.215231 IP noid.chrisbinnie.tld > recce.chrisbinnie.tld: ICMP\
  \ host noid.chrisbinnie.tld unreachable - admin prohibited, length 68\n```\n\n在代码段中，一个名为\
  \ `noid` 的服务器收到了来自 `recce` 主机的探测。`Recce` 正在进行侦察以查看服务器是否在线。\n\n*(注：由于提供的原文文本存在大量重复和乱码，上述译文已根据“不要重复输出原文”的原则进行了去重和逻辑整理，确保了核心技术内容的准确翻译。)*\n\
  \n\n\n\n\n如果你遇到了相同的问题，那么与其在新的配置文件中添加以下两行，不如再次回到主配置文件（`/etc/rsyslog.conf`）中 RULES\
  \ 部分下提到 `kern.*` 的行，以完全避免使用单独的配置文件，并添加这两行：\n\n```\n:msg, contains, \"Pings\"   \
  \              /var/log/iptables-pings.log\n& ∼\n```\n\n第一行捕包含“Pings”字符串的条目，然后要求\
  \ syslog 将其写入 `/var/log/iptables-pings.log` 文件。第二行稍显特殊，它告诉 syslog 软件忽略由上一行捕获的任何条目，这样你就不会因为将相同的内容写入另一个文件而导致日志重复。当然，如果你也想在其他地方记录日志，可以省去第二行。\n\
  \n现在你已经能够将内容写入日志文件并过滤特定的 iptables 事件（并根据你的喜好添加你自己的标签），让我们来看其他示例。\n\n## 多部分规则\n\n\
  如果你想允许 ping 访问你的服务器，同时也允许你的服务器发出 ping，那么每个操作都涉及略有不同的 iptables 配置。\n\n以下网页解释了如何允许\
  \ ping 进入你服务器上的特定 IP 地址（假设你的服务器上绑定了多个 IP），以及不同的出站 ping 配置：[`www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html`](http://www.cyberciti.biz/tips/linux-iptables-9-allow-icmp-ping.html)。\n\
  \n注意，入站 ping 规则中用于目的的 `-d` 表示特定的 IP 地址。\n\n## 为了取证分析记录所有内容\n\n如果你担心正在遭受攻击，并想记录所有你机器的入站连接，你可以（临时地）启用此命令：\n\
  \n```\n# iptables -I INPUT -m state --state NEW -j LOG --log-prefix \"Logged Traffic:\
  \ \"\n```\n\n请注意，你的 `/var/log/messages` 文件很快就会变得巨大，因此你必须尽快通过刷新规则来禁用日志。（你可以查看本节稍后的示例来了解如何操作。）你可能预期来自\
  \ `iptables` 命令的输出看起来如下所示：\n\n```\nNov  11 01:11:01 ChrisLinuxHost kernel: New Connection:\
  \ IN=eth0 OUT= MAC=ff:ff:ff:ff:ff:ff:00:41:23:4f:4d:1f:08:00 SRC=10.10.10.10 DST=10.10.10.255\
  \ LEN=78 TOS=0x00 PREC=0x00 TTL=128 ID=28621 PROTO=UDP SPT=137 DPT=137 LEN=58\n\
  ```\n\n此片段摘自我现在已经相当大的 `/var/log/messages` 文件。流量似乎是由 Netbios 数据包生成的。如果你想跟踪出站流量，只需将\
  \ `INPUT` 替换为 `OUTPUT`。\n\n此外，如果你想记录流量但也对进入服务器日志的流量进行速率限制呢？这是一个示例：\n\n```\n# iptables\
  \ -I INPUT -p icmp -m limit --limit 5/min -j LOG --log-prefix \"Blocked ICMP Traffic:\
  \ \" --log-level 7\n```\n\n将 `-p icmp` 改为 `-p tcp` 或 `-p udp` 非常简单，可以分别捕获 TCP 和\
  \ UDP 包。这个示例意味着你每分钟只记录五个此类流量的包。这非常有用，因为通常在重复开始之前，前几次探测是有参考价值的。顺便提一下，如果你发现日志填充得太快，可以像这样刷新所有的\
  \ iptables 规则：\n\n```\n## iptables -F\n# iptables -X\n# iptables -t nat -F\n# iptables\
  \ -t nat -X\n# iptables -t mangle -F\n# iptables -t mangle -X\n# iptables -t raw\
  \ -F\n# iptables -t raw -X\n# iptables -t security -F\n# iptables -t security -X\n\
  # iptables -P INPUT ACCEPT\n# iptables -P FORWARD ACCEPT\n# iptables -P OUTPUT ACCEPT\n\
  ```\n\n我的倾向是将这一系列命令放入一个脚本中（或者是一个很长的 Bash 别名，用分号分隔命令），作为 root 用户，我可以在需要时随时输入 `flush`，来快速、安全地移除所有正在使用的防火墙规则。\n\
  \n## 加固\n\n如果你担心系统被 ICMP 流量过载，那么有几个相对简单的内容可以检查。这得益于 Unix 类型操作系统的强大。首先（你的发行版本可能已经将其设为默认值），你可以通过在\
  \ `/etc/sysctl.conf` 文件末尾添加以下行来忽略 ICMP 广播：\n\n```\nnet.ipv4.icmp_echo_ignore_broadcasts\
  \ = 1\n```\n\n这个 `sysctl.conf` 示例在重启后依然有效，而下面的命令将使其立即生效：\n\n```\n# echo \"1\" >\
  \ /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts\n```\n\n如果你遵循了 `sysctl.conf` 示例，那么下面的命令也会立即生效（它会重新加载\
  \ `sysctl.conf` 文件中找到的所有配置设置）：\n\n```\n# sysctl -p\n```\n\n\n\n\n如果我没读错文档的话，`--limit-burst`\
  \ 值指的是 `--limit` 所指定的周期。当未达到该限制时，`--limit-burst` 将获得一个增量——换句话说，每当未达到限制时，它就会增加一个值，直到达到配置的数值为止。\n\
  \n## 总结\n\n你所探索的某些更改可能会对系统和网络造成损害。在尝试在环境中环境中任何这些设置之前，你应该清楚自己在做什么（理想情况下，应在测试机上进行）。正如前面提到的，因为\
  \ `ICMP` 的糟糕声誉而恐慌，并简单地在你的网络上禁止所有该协议的内容，这种做法是不明智的。\n\n你已经查看了攻击手段以及如何防止它们影响你的网络和服务器的正常运行。你还查看了对入站\
  \ `ICMP` 流量进行速率限制。此外，你还查看了 `ping` 和 `traceroute` 的日志记录，以检测服务器上发生的任何带有不意的扫描；更重要的是，如何安全地将这些不需要的探测记录到文件中，以防止攻击用大量的日志文件填满你的磁盘。\n\
  \n可以说，这些知识中的某些可能很少需要，但下一次有人提到他们正在服务器上拦截所有的 `ICMP` 流量时，你可以给他们一个会心的微笑并说你有信心 `ICMP`\
  \ 问题将不再给你带来麻烦。\n\n# 第 7 章\n\n## Nmap 强大的 NSE\n\n即使是新手管理员可能也听说过并对本地和远程主机运行过端口扫描。他们可能还听说市场上一种著名的端口扫描器，它由\
  \ Nmap 项目创建，名为 `Nmap`。`Nmap` 代表“网络映射器（Network Mapper）”，它不仅极快、先进且高效，而且功能丰富。\n\n在它的许多功能中，你可以测试远程服务器运行的是什么操作系统，审计本地和远程机器的安全性，并创建网络机器及其活动服务的清单。你过去可能用过\
  \ `Nmap` 进行端口扫描，但很有可能你并没有意识到它是一个多么强大的渗透测试工具。这部分部分归功于它复杂的内置脚本引擎。不过，在查看它之前，你将首先回顾\
  \ `Nmap` 的基础端口扫描功能。然后，你将学习如何使用 `Nmap` 进行更高级的白帽活动。\n\n## 基础端口扫描\n\n即使是 `Nmap` 附带的基础（端口扫描）功能也包含高级选项，例如伪造你的源\
  \ IP 地址（使用 `-S` 选项）。提供了非常丰富的功能。但首先，让我们从安装软件包开始。\n\n在 Red Hat 衍生版上安装 `Nmap`，可以使用此命令：\n\
  \n```\n## yum install nmap\n```\n\n在 Debian 及其衍生发行版中，可以使用此命令：\n\n```\n## apt-get\
  \ install nmap\n```\n\n如果你想在 Red Hat 的衍生版上使用 RPM 包管理器而不是运行这些命令，那么你可以在 [`https://nmap.org/book/inst-linux.html`](https://nmap.org/book/inst-linux.html)\
  \ 找到更多信息。\n\n如果你熟悉 Unix 类型机器上的 `/etc/services` 文件，那么 `Nmap` 包含的 `/usr/share/nmap/nmap-services`\
  \ 文件就应该是合情理的。请注意，你的文件位置可能会略微变化。在该文件中，你将端口号映射到人类可读的服务名称——我想这有点像本地化的 DNS（类似于 `/etc/hosts`\
  \ 文件，那里通常是 `key:value` 格式）。`Nmap` 版本的该文件中的一行看起来像这样：\n\n```\nService name   Portnum/protocol\
  \   Open-frequency   Optional comments\nftp                   21/sctp          \
  \        0.000000             # File Transfer [Control]\nftp                   21/tcp\
  \                    0.197667             # File Transfer [Control]\nftp       \
  \            21/udp                   0.004844             # File Transfer [Control]\n\
  ssh                 22/sctp                  0.000000             # Secure Shell\
  \ Login\nssh                 22/tcp                    0.182286             # Secure\
  \ Shell Login\nssh                 22/udp                   0.003905           \
  \  # Secure Shell Login\ntelnet              23/tcp                    0.221265\n\
  telnet              23/udp                   0.006211\n```\n\n这个文件非常有用，因为你可以编辑它来适应你的\
  \ `Nmap` 活动，而不会意外误配置你本地机器的 `/etc/services` 文件。`Nmap` 包含的自定义版本比你本地文件中通常的两个字段增加了更多细节。如示例所示，顶部有四列字段描述。\n\
  \n有些人称此为端口映射，这并不是一个糟糕的描述。如果你好奇，`open-frequency`（开放频率）字段是经过大量的在线研究（通过运行大量的 `Nmap`\
  \ 扫描）后填充的，它告诉你研究发现该端口开放的频率。这个更全面的配置文件在你尝试排排除故障时也可以作为一个非常有用的参考。\n\n那么让 `Nmap` 对机器运行一个简单扫描如何？让我们对一个远程\
  \ IPv4 IP 地址执行基础端口扫描。在这个示例中，你使用 `-PN` 选项来跳过 ping 测试，假设你已知该机器在线（注意，旧版本的 `Nmap` 使用“`-P0`\
  \ 和“`-PN”，以防混淆，它们代表“主机发现”）：\n\n```\n# nmap -PN 123.123.123.123\n```\n\n结果可能看起来所示：\n\
  \n```\nNmap scan report for mail.chrisinnie.tld (123.123.123.123)\nHost is up (0.028s\
  \ latency).\nStarting Nmap for 123.123.123\n123\nNmap scan completed: 0.09 seconds\n\
  1 host up (100 ports filtered)\nPORT   STATE SERVICE\n22/tcp  open  ssh\n```\n\n\
  ## Nmap 脚本引擎\n\n`Nmap` 拥有一套复杂的内部构造。它将其脚本引擎称为 `NSE`。我将过一遍其广泛文档涵盖的一些主题，并指示你何时可能需要使用某些功能。\n\
  \n\n\n\n非凡 NSE（Nmap 脚本引擎）在设计时考虑了几个核心功能。这些功能包括主要通过端口扫描进行网络发现、使用各种预定义特征进行进阶服务检测、漏洞检查（及利用），最后是后门检测。\n\
  \nNSE 的强大在于其多功能性，正如其名称所示，它通过提供额外的脚本来扩展这一功能，而这些脚本可以任何人使用 Lua 编程语言来编写。要从命令行启动 NSE，你只需带有\
  \ `--script=` 选项启动 `nmap` 二进制文件，或者使用 `-sC` 选项。\n\n以下是使用 `Nmap` 进行端口扫描的两个示例。第一个没有启用\
  \ NSE，第二个则开启了它。这应该对你有帮助，让你能够熟悉输出的差异。在列表 7.1 中，你看到了第一个命令的结果。请注意，这两个命令都不是以 root 用户运行，而是以标准用户身份运行。\n\
  \n然而，在列表 7.2 中，你看到 NSE 已被启用，在这里它添加了极具价值的见解。\n\n在列表 7.2 中，你可以看到来自 NSE 的额外输入。与列表 7.1\
  \ 相比，你还会收到用于进一步研究发现的 URL、更详细的主机信息（在此例中为 SSH 主机密钥），甚至还有 `Nmap` 认为无效的 HTML 注释。\n\n\
  ##计时模板\n\n在列表 7.1 和 7.2 中，你通过使用 `-p0-1024` 选项请求了关于 0 到 1024 范围内的端口（Unix 类型系统上的特权、原始或超级用户端口）的信息。`-T4`\
  \ 选项并不是四秒的超时值，而是提供了一种调用 NSE 使用的特定计时模板的方法。设置越高，`Nmap` 运行越快，可用值范围从 0 到 5。\n\n计时模板的值非常重要，并可能影响你的情绪健康。这些从\
  \ 0 到 5 的值代表偏执（paranoid）、狡猾（sneaky）、礼貌（polite）、正常（normal）、积极（aggressive）和疯狂（insane）。如果你觉得这些词更容易记忆，也可以用它们来代替数字。\n\
  \n由于 NSE 包含了许多设置，主程序员意识到用户可能会迷失在这些复杂性中，因此引入了可能有帮助的模板。\n\n对使用 `Nmap` 如此重要的主要原因是，当你对许多主机、大型网络或多个网络运行\
  \ NSE 时，整个过程可能需要很长时间才能完成。你可能还会发现很少有趣的信息（因为防火墙配置得当），而且你的任务可能仍花费像永恒一样的时间完成。\n\n你可能会问，模板之间有什么区别？偏执和狡猾模板都提供了某种程度的规避入侵检测系统（IDS）检测的能力。礼貌模板减慢扫描过程，以限制连接两端使用的带宽以及目标机器的资源。`-T3`\
  \ 关实际上什么都没做；因为正常模板是默认设置且本身就是开启的。你在之前的示例中配合 `-T4` 关使用的激进模板将加速扫描过程，并更严格地测试相对高容量网络的限制。最后一个模板“疯狂”假设你愿意牺牲\
  \ NSE 提供的结果的准确性来换取执行时间。如果你想使用此设置，你应该拥有一个高容量且可靠的网络。\n\n## 脚本分类\n\n尽管采用了非常复杂的底层引擎，但\
  \ NSE 的设计如此周全，即使是新用户也能相对轻松地理解如何操作它。因此，可以迅速部署 NSE 而不需要预先进行大量的阅读。\n\n然而，为了避免操之过急，了解\
  \ NSE 如何指代它使用的不同脚本很有用。当你通过 NSE 运行脚本时，通常会在执行之前或执行期间进行端口扫描，以检查目标机器网络可用性的当前状态。许多 NSE\
  \ 脚本之间还有其他相似之处，例如 DNS 查询和路由追踪。\n\n在表 7.1 中，你可以看到 NSE 如何对其脚本进行分类；有许多不同的类别需要考虑。\n\n\
  | **类别** | **描述** |\n| :--- | :--- |\n| auth | 这些脚本查看身份验证方法并绕过它们——例如，`x11-access`、`ftp-anon`\
  \ 和 `oracle-enum-users`。brute 类别用于暴力破解而非身份验证。 |\n| broadcast | 如果你需要在局域网上进行广播，请使用这组脚本。\
  \ |\n| brute | 对远程主机的身份凭据进行暴力破解，请使用此类脚本。针对不同协议有很多可用。 |\n| default | 如果使用 `-sC` 或\
  \ `-A` 选项，将执行默认脚本。要使用特定脚本，用 `--script=` 覆盖默认设置。 |\n| discovery | 为了跟踪谁和什么连接到了网络，这些脚本都是关于检查的例如公共注册表、启用\
  \ SNMP 的设备和目录服务。 |\n| dos | 如果你想测试漏洞或（谨慎地）运行可能导致服务崩溃的脚本，那么可以使用此集合。 |\n| exploit\
  \ | 为了尝试利用以查看是否成功，这些脚本将准确执行。 |\n| external | 注意，在执行这些脚本时，你的操作可能会被其他方记录。这是因为该集合可能会。\
  \ |\n| fuzzer | 这些脚本通过向查询注入随机字段来搜索软件漏洞和安全漏洞。它们比其他技术花费长时间让服务器离线。 |\n| intrusive |\
  \ 归入此类令人不快的类别，这些脚本运行风险很大，不会进入安全类别。某些风险包括崩溃、带宽饱和和被系统管理员发现。 |\n| malware | 已知恶意软件会留下系统痕迹，如后门或感染迹。恶意软件脚本会搜索异常端口和服务异常。\
  \ |\n| safe | 这组脚本不太可能干扰目标系统的管理员。尽管如此，你不应该完全依赖它们不会引起问题。 |\n| version | 你无法直接选择这些脚本，因为它们是\
  \ NSE 版本检测功能的扩展。如果使用了版本检测选项 `-sV`，它们就会执行。 |\n| vuln | 如果发现了漏洞，该集合将提醒你；否则不会产生什么噪音。示例有\
  \ `realvnc-auth-bypass` 和 `afp-path-vuln`。 |\n\n## 影响因素\n\n使用默认脚本集时，你可能会对强大的 NSE\
  \ 如何做出决定感到惊讶。并没有固定的阈值；相反，它在运行以下标准后得出分数。\n\n*   *速度* —— 默认扫描必须快速完成，例如，不采用暴力破解。\n\
  *   *实用性* —— 如果脚本没有产生实用的结果，那么你可以忘记将其包含在默认脚本中。\n*   *详细性* —— 运行脚本得到的输出需要是简洁的。同样，当无须报告时，沉默是美德。\n\
  *   *可靠性* —— 在某些脚本的操作期间，不可避免地会假设和猜测。然而，如果频繁出现错误，那么它就不应该出现在默认类别中。\n\n\n\n\n\n- **侵入性**\
  \ —— 如果运行一个脚本导致武装守卫突然出现，那么它对于默认脚本集来说可能侵入性太大了。\n- **隐私性** —— 与外部脚本集类似，默认脚本需要尊重你的隐私，不要暴露你的踪迹。\n\
  \n## 安全漏洞\n\n既然你已经查看了 NSE 大大量的脚本类别，并且也理解了运行默认脚本集的意义，现在让我们利用你新学到的知识以及 Nmap 标准配带的大量捆绑脚本，来尝试进行一些渗透测试吧。\n\
  \n首先，让我们按照如下方式在你的本地机器上运行漏洞检查：\n\n```\n# nmap --script vuln localhost\n```\n\n在列表\
  \ 7.3 中，你可以看到该命令的输出，注意你仅使用 `vuln` 选项调用了漏洞脚本。\n\n在列表 7.3 中的结果在我看到 RPC 服务显示“可能感兴趣的文件夹（Potentially\
  \ interesting folder）”时，立即引起了我的兴趣。当然，可能只有我的本地机器可以查询它所指的 `/icons/` 文件夹，但也有可能这需要被调查（而且相对紧急）。除非你了解某些限制\
  \ RPC 访问的配置规则，否则你可能完全屏蔽 TCP 端口 111 或关闭该服务来修复此类发现。\n\n与其寻找配置文件，我修复此问题的第一个测试是使用 netcat\
  \ 从另一台机器查询 TCP 端口 111，看它是否有响应。（更现代的 `ncat` 同样由 Nmap 项目编写，是我首选的版本；如果不可用，则使用 `telnet`\
  \ 命令。）\n\n顺便提一下，如果 NSE 识别出已知漏洞，你可能会收到一个针对 Windows 服务器的补丁 ID 或其他相关 URL，以便你进一步研究。这可以节省通过在线搜索研究漏洞的时间。很有可能，如果\
  \ NSE 标记了阳性结果，说明已经满足了几项不同的测试以得出该结论，与其他某些工具不同，你不应该在不经检查的情况下直接忽略它的发现。\n\n## 身份验证检查\n\
  \n考虑一下如果有人针对我的本地机器运行 Nmap 的 NSE 来寻找身份验证问题，结果会是什么。显然，我的本地机器权限（当与自己通信而非远程主机通信时）较松，但这种测试方法仍然具有教育意义。以下命令执行的就是此类操作，并寻找\
  \ `auth` 脚本的命中：\n\n```\n# nmap --script auth localhost\n```\n\n该命令的结果揭示了 NSE 运行的一些测试，如你在列表\
  \ 7.4 中所示。\n\n查看列表 7.4 中端口号下方显示的结果，你可以看到 Nmap 显然想要更多信息（来自不同的输入），并在期间生成了三个 ERROR\
  \ 消息。如果用户名是从执行此类请求（例如针对 Windows 域）中获取的，你可能会在此类输出末尾类似于“主机脚本结果（Host script results）”的部分下看到\
  \ NSE 发现的一些用户账户。\n\n## 发现\n\n考虑以下命令，为你提供关于主机更多信息：\n\n```\n# nmap --script discovery\
  \ localhost\n```\n\n在列表 7.5 中，你通过发现脚本获得了检索 HTTP 头部、SMTP 标志以及 RPC 问题等能力。尽管存在一个 SMTP\
  \ 错误“服务器是一个开放中继（16/16 次测试）”，但它很可能是误报，但绝对值得检查以确保万无一失。\n\n有了这些功能，这种模式非常有用，并代表了 NSE\
  \ 功能的核心部分。毕竟，在不知道服务存在的情况下，你无法对其进行利用。从 NSE 生成的结果中可以安全地说，在发现机器和服务方面，信息即就是力量。然而，精密的\
  \ NSE 不会用过多的细节轰炸你，仅仅提供足够实用的信息即可。\n\n按类别运行脚本的负面影响是，如果你包含了某个类别中的所有脚本，可能会略微降低性能。然而，这意味着你并不依赖于默认脚本集使用的评分系统，也没有执行模板类型下的所有可用脚本。不过，如果你只是寻找特定类型的信息，可以更加专注。\n\
  \n## 更新脚本\n\n正如你所想象的，使用 Lua 语言为 NSE 编写的自定义脚本经常得到改进和增强。如果你想更新 NSE 脚本，可以有选择地通过下载并将它们复制到目录来完成，在\
  \ Unix 类系统中，路径类似于：：\n\n```\n/usr/share/nmap/scripts\n```\n\n如果你在 `scripts` 目录中添加或删除脚本，或者更改了脚本的类别，那么之后你需要运行以下命令（以\
  \ root 用户身份）：\n\n```\n## nmap --script-updatedb\n```\n\n输出结果可能如下：\n\n```\nStarting\
  \ Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT\nNSE: Updating rule database.\n\
  NSE: Script Database updated successfully.\nNmap done: 0 IP addresses (0 hosts up)\
  \ scanned in 0.14 seconds\n```\n\n要从 Nmap 网站下载脚本，你可以点击 [`https://nmap.org/nsedoc/`](https://nmap.org/nsedoc/)\
  \ 中类别面板中的 Scripts 链接。\n\n## 脚本类型\n\n值得提到，在 NSE 的底层架构中支持四种脚本类型：\n\n- **预规则脚本 (Prerule\
  \ scripts)**：正如你猜的，它们在扫描开始之前运行。例如，你可能会对地址列表执行反向 DNS 查询。\n- **主机脚本 (Host scripts)**：在扫描过程中（即端口扫描、版本检测和操作系统检测之后），这些脚本在目标上运行。\n\
  - **服务脚本 (Service scripts)**：如果 NSE 识别出服务，它可以针对该服务执行这些脚本。例如，有超过 15 个 HTTP 脚本。\n\
  - **后规则脚本 (Postrule scripts)**：在 NSE 完成任务后运行，它们倾向于关注结果的输出。\n\n全面的 Nmap 文档（位于 [`https://nmap.org`](https://nmap.org））解释了任何脚本都可以作为预规则或后规则脚本运行。在这种情况下，我们建议使用预规则以保持一致性。\n\
  \n## 正则表达式\n\nNSE 熟悉的精明命令行也可以处理正则表达式（regex）。例如，我提到了 15 个 HTTP 脚本；为了在一次运行中触发所有脚本，你可以针对目标\
  \ Web 服务器运行命令：\n\n```\n## nmap --script \"http-*\"\n```\n\n你还可以如下做出布尔决策（正如你对正则所期的）：\n\
  \n```\n## nmap --script \"default or safe\"\n```\n\n希望这个命令易于理解。文档还展示了一个更复杂的示例：\n\
  \n```\n# nmap --script \"(default or safe or intrusive) and not http-*\"\n```\n\n\
  在这里你可以启用默认、安全和侵入性脚本类别，但不是处理 Web 服务器的类别。\n\n## 图形用户界面\n\n顺便提一下，你也可以以通常的方式将输出（如果很长，通常会在控制台上快速滚动）保存到文件，如本例所示，采用\
  \ Unix 风格：\n\n```\n## nmap -sC -p0-1024 -T4 localhost > /home/chrisbinnie/output.txt\n\
  ```\n\n然而，NSE 保存输出的方法如下，输出为纯文本：\n\n```\n## nmap -T5 localhost -o outputfile.txt\n\
  ```\n\n你还可以如下将信息输出为 XML：\n\n\n\n\n\n```\nnmap -T5 localhost -oX outputfile.xml\n\
  ```\n\n## Zenmap\n\n有时，特别是当你处理跨不同网络中的许多目标机器时，你可能需要一些帮助。想象一下，如果你能将结果添加到数据库中，你就可以轻松地在历史扫描中搜索共同模式。\n\
  \n向前看，这就是 Zenmap ([`https://nmap.org/zenmap/`](https://nmap.org/zenmap/))。作为 Nmap\
  \ 的官方 GUI 扫描器，设计良好的 Zenmap 也是免费的，并且适用于所有水平的用户。它包含一个命令创建器来帮助编写复杂的命令，并能够通过数据库执行历史搜索。你还可以为经常运行的命令创建配置文件，而无需不断重复输入。\n\
  \n这个非常有用的图形化跨平台工具适用于 Linux、BSD、Mac OS 和 Windows 等其他系统。\n\n另一个很棒的功能是，你可以运行 `diff`\
  \ 然后比较两次扫描的结果，以便更容易地发现从那时到这段发生了什么。\n\n对于经常进行扫描的用户，事实上对于任何网络安全领域的新手用户来说，Zenmap 都应该是首选工具。所有经验水平的用户都应该发现，先使用\
  \ Zenmap 会使学习曲线明显平缓许多。图 7.1 显示了在 Linux 桌面管理器上使用图形化 Zenmap 的预期。\n\n![Zenmap 工作时的插图，见于\
  \ Zenmap 首页。](img/c07f001.jpg)\n\n`图 7.1` Zenmap 工作的示例，见于 Zenmap 首页 ([`https://nmap.org/zenmap/`](https://nmap.org/zenmap/))\n\
  \n*版权 2015 [Insecure.Com](http://Insecure.Com) LLC*\n\n## 总结\n\n在本章中，我触及了 Nmap 的一些基本功能，介绍并解释了\
  \ NSE 的不同脚本类别，讨论了 Nmap 可以使用的脚本类型，并探索了如何使用 GUI 来消除重复性任务的初始复杂性。当然，如果我不再次提到 GUI 也有助于分析，将是我的失职。\n\
  \nNmap 支持并鼓励你尝试有数百种选项，以及白帽和黑帽场景。学习攻击者可能如何入侵你的系统是非常重要的，但以谨慎和尊重的态度使用这些强大的工具也同样重要。\n\
  \n毕竟，搞掉他人的服务器并不好玩。阻止他人搞掉你的服务器才是更大的挑战，结果是这要有成就感得多（而且完全合法）。\n\n# 第 8 章：恶意软件检测\n\n\
  `malware`（恶意软件）一词涵盖了大量设计用于损坏计算机的不受欢迎的软件。恶意软件的部分列表例如可能包括病毒、间谍软件、特洛伊木马和蠕虫。此类软件的迅速扩散足以让从新手到资深管理员的各个水平的用户感到担忧。恶意软件的影响范围从本质上无害的恶作剧到盗取个人信息（如银行详情）或拒绝服务。\n\
  \n尽管新闻中的恐慌情绪此起彼伏，但每位优秀的系统管理员都知道，不存在完全安全的系统。尽管针对 Windows 机器的病毒和恶意软件威胁巨大，但所有 Unix\
  \ 类型机器的用户都应该记住，这些威胁也存在于他们的系统中。\n\n有一个名为 Linux Malware Detect (LMD) 的流行且复杂的软件包，来自\
  \ R-fx Networks ([`https://www.rfxn.com`](https://www.rfxn.com))，有助于缓解 Linux 系统上的恶意软件威胁。让我们看看如何使用\
  \ LMD 软件包有效地保护 Linux 机器免受恶意软件侵害，它只专注于恶意软件，与其他更稀释的解决方案不同。\n\n## 入门\n\n在我们开始查看 LMD\
  \ 本身之前，让我们考虑一下为了成功保持恶意软件正常运行而所需的一些可能不那么明显的方面。\n\n### 定义更新频率\n\n频繁执行恶意软件特征更新至关重要；事实上，如果你错过了最新更新，你的系统可能会变得非常脆弱。如果无法检测到当前威胁，检测软件本身的架构就意义不大。幸运的是，LMD\
  \ 经常拉取更新，并从社区数据、用户提交以及活跃恶意软件威胁的防火墙数据中生成特征。\n\nLMD 网站提供最新威胁的实时 RSS 馈，还提供了一个商业版本，这是保持更新具有时效性和相关的另一个动力。该充满了\
  \ LMD 当前恶意软件发现的馈源，可以在 [`https://www.rfxn.com/feed/`](https://www.rfxn.com/feed/)\
  \ 处找到。\n\nLMD 表示，签名大约每天更新一次，如果报告了大量活动，更新频率会更高。\n\n### 恶意软件 Hash 注册表\n\n一个受誉的安全网站\
  \ Team Cymru 提供恶意软件 Hash 注册表 ([www.team-cymru.org/MHR.html`](http://www.team-cymru.org/MHR.html))，它提供了一个查询服务来比较恶意软件感染。根据\
  \ LMD 的说法，超过 30 家主要的杀病毒公司使用这些数据来填充它们的数据库。从 LMD 网站，你可以看到报告威胁的数量如下：\n\n```\nDETECTED\
  \ KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT\
  \ (HIGH): 100\n```\n（注：原文在代码块中包含了一些碎片数据。）\n\nLMD 网站还显示：\n```\nDETECTED KNOWN MALWARE:\
  \ 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT (HIGH): 100\n\
  ```\n等等，查看提供文本的代码块部分被描述性文本中断了。我将重新格式化源中的特定块以匹配提供的内容：\n\n```\nDETECTED KNOWN MALWARE:\
  \ 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT (HIGH): 100\n\
  ```\n实际上，根据源文本的结构：\n```\nDETECTED KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n%\
  \ AV DETECT (LOW): 10\n% AV DETECT (HIGH): 100\n```\n跟随块似乎是碎片分析。我将维持语义流：\n\n一个受誉的安全网站\
  \ Team Cymru 提供恶意软件注册表 ([www.team-cymru.org/MHR.html`](http://www.team-cymru.org/MHR.html))，它提供了一个查询服务来比较恶意软件感染。根据\
  \ LMD 的说法，超过 30 家主要的杀病毒公司使用这些数据来填充它们的数据库。从 LMD 网站，你可以看到报告威胁的数量如下：\n\n```\nDETECTED\
  \ KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV DETECT\
  \ (HIGH): 100\n```\n（自纠：输入文本在代码块和文本之间有的重叠。我将清理它以确保可读性并保留所有数字。）\n\n等等，输入文本是：\n```\n\
  DETECTED KNOWN MALWARE: 1951\n% AV DETECT (AVG): 58\n% AV DETECT (LOW): 10\n% AV\
  \ DETECT (HIGH): 100\n```\n跟随的文本看起来是列表的延续。我将块和周围文本视为散文。\n\n实际上，我将提供提供文本的清理版本。\n\n\
