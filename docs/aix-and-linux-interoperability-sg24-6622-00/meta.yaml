    \ password for principal \"admin/admin@WEEORG.COM\":\nRe-enter password for principal\
    \ \"admin/admin@WEEORG.COM\":\nPrincipal \"admin/admin@WEEORG.COM\" created.\n\
    Creating keytable...\nCreating /var/krb5/krb5kdc/kadm5.acl...\nStarting krb5kdc...\n\
    krb5kdc was started successfully.\nStarting kadmind...\nkadmind was started successfully.\n\
    The command completed successfully.\nRestarting kadmind and krb5kdc\n```\n\nAs\
    \ you can see, the KDC and administration servers are also started. The next step\
    \ is to create the service principals and keys. We define the remote access (host)\
    \ and file transfer (ftp) service principals for our two hosts. The service keys\
    \ must also be added to key tables on both hosts. Of course, only keys for service"
