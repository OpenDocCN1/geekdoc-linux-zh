    ftp://ftp.software.ibm.com/aix/freeSoftware/aixtoolbox


    The FTP site contains the new and old versions of the tools, the spec files, and
    the patches that were used to build the tools.


    Cryptographic Content (SSL) for certain Toolbox packages can be obtained from
    the following Web site:

    http://www6.software.ibm.com/dl/aixtbx/aixtbx-p


    The AIX affinity for Linux provides easy migration of Linux applications to AIX
    systems using the GNUPro application development tools. With these tools, you
    can recompile Linux-based Open Source Software (OSS) and GNU software for use
    on AIX. The Toolbox provides all the tools necessary for effective software compiling
    and debugging.


    For packages governed by open source licenses (such as the GPL license) and requiring
    source redistribution, you may get the source from the official package site,
