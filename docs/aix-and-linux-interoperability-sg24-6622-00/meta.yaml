    # 8.2 Universal Disk Format (UDF)


    Universal Disk Format (UDF) is a newer CD-ROM file system type required for DVD-ROMs.
    It is a new feature that was introduced in AIX 5L 5.2.0 and is not supported in
    earlier versions of AIX. UDF is available for DVD-RAM media on AIX. Linux also
    supports the UDF file system. UDF is very useful for creating backups, as it uses
    less disk space for creating the backup because it writes the backup directly
    to the DVD.


