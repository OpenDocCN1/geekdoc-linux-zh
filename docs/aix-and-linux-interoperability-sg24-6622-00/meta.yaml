    # 9.2.2 OpenSSH


    OpenSSH is an security tool used to establish a security connection between hosts.
    It is an open implementation of SSH that supports SSH1 and SSH2 protocols.


    OpenSSH is used as a secure and encrypted replacement for the vulnerable telnet
    and r commands, such **rlogin**, **rsh**, **rcp**, and **rdist**. OpenSSH can
    authenticate user using RSA and DSA authentication protocols, which are based
    on a pair of complementary numerical keys.


    You can find more details about OpenSSH in Chapter 4, "Secure network connections
    to AIX" in *Managing AIX Server Farms*, SG24-6606.


    # 9.2.3 tcp_wrapper


    tcp_wrapper is one of the first tools installed by system administrators. The
    tcp_wrapper, written by Wietse Venema, is a utility that can by be easily installed;
    it will be able to intercept, filter, and enhance the logs details for the services
    controlled by the inetd daemon.


    This tool allows tight control over TCP connections requested in a system. The
    activation logic is simple: When the inetd receives a request for a service, it
    executes a control program (tcpd) instead of the requested service. The tcpd will
    check the connection''s origin against the rules defined and then take action.
    This action could be a double check of the origin IP:


    ```

    IP -> name

    name -> IP

    ```


    The tcpd program also compares the request''s origin address against an access
    control list. It uses the identd daemon to identify the request origin. It can
    also registry the results by using syslogd.


    # Installing tcp_wrapper on Linux


    On Red Hat Linux Version 8.0, the tcp_wrapper package is located on installation
    disc 1. You can install it by issuing the following command:


    ```

    # rpm -ivh tcp_wrappers-7.6-23.i386.rpm

    warning: tcp_wrappers-7.6-23.i386.rpm: V3 DSA signature: NOKEY, key ID db42a60e

    Preparing...                ########################################### [100%]

    ```'
