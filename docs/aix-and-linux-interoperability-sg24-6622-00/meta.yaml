    \ Automount\n- User and group ID mapping\n- Access Control Lists\n- NFS locking\n\
    \n# 7.6.1  NFS automount\n\nThe **automount** command is used to administer the\
    \ AutoFS file system. It is used to mount NFS directories only when a user requests\
    \ access to a file residing on the server.\n\nPlease refer to the *AIX 5L Version\
    \ 5.2 Commands Reference, Volume 1* for more details on the automount daemon.\n\
    \nThe steps to configure automount in a general NFS server-client environment\
    \ are:\n\n+   1. Configure the NFS server and client if they are not already configured.\n\
    2. Create the master map file on the NFS client."
