    or by using the command line:


    ```

    # /usr/bin/slapd

    ```


    To restart the server, click on the power button again. To stop the server, either
    go to **Current state -> Start/Stop** and click on the Stop button, or use the
    command line:


    ```

    # kill `cat /etc/slapd.pid`

    ```


    # ## 2.3.2 The OpenLDAP directory server


    The OpenLDAP software has its beginnings in the first LDAP implementation from
    the University of Michigan. The UoM still has some Web presence regarding the
    LDAP directory services, but the primary site for software and documentation is
    at:


    [http://www.openldap.org/](http://www.openldap.org/)


    The OpenLDAP software supports LDAP Version 3 and there are currently two code
    trees maintained in parallel:


    +   - Release 2.1.x. This tree is used for most of the new features. Still, it
    should be safe for general use.

    - Stable Release 2.0.x. This release is the most stable.


    Current code from OpenLDAP is reasonably stable and of production quality. Many
    organizations entrust their directory services to the OpenLDAP directory server.'
