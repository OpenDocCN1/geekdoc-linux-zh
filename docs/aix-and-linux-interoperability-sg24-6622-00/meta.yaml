- img_proc: false
  md: 'RIPEMD160(redbook.txt)= 477d97b7a2aca1bf97d019a2d57c778136d2b42e


    # Symmetric key cipher


    OpenSSL supports a wide variety of symmetric ciphers. Symmetric key encryption
    means that there is one password or passphrase used to encrypt or decrypt with
    symmetric key encryption. The basic ciphers supported are Blowfish, CAST5, DES,
    3DES, IDEA, RC2, RC4, and RC5. Most of the supported symmetric ciphers support
    a variety of different modes, including CBC, CFB, ECB, and OFB:


    +   - ECB (Electronic Code Block) mode is the basic mode of operation. In this
    mode, the cipher takes a single block of data and produces a single block of cipher-data.
    This mode is padded to accommodate messages that are not a multiple of the cipher''s
    block size length. The mode is susceptible to dictionary attacks. We strongly
    recommend that you not use it unless you really know what you are doing. The advantage
    of ECB over the other cipher is that messages can be encrypted in parallel.

    - CBC (Cipher Block Chaining) mode solves the dictionary problem with the ECB
    cipher. It does it by XORing the cipherdata of one block with the data of the
    next block. Parallelization is not possible in this mode. CBC is still a block-based
    mode, so the padding is generally used. In this mode, a dictionary attack is possible
    if the data streams have common beginning sequences. For this reason, it is possible
    to set a initialization vector (IV), which is a block of data that is XOR''d with
    the first block of data before encrypting. The value of the IV need to be secret,
    but it should be random. The receiver must know the IV value to be able to decrypt
    the cipherdata.

    - CFB (Cipher Feedback) mode is one way of turning a block cipher into a stream
    cipher. A complete block of data must be received before the encryption begins.
    As with CBC, CFB mode can use a initialization vector.

    - OFB (Output Feedback) mode is another way of turning a block cipher into a stream
    cipher.


    The **openssl enc** command uses both block and stream ciphers. The block cipher
    encrypts and decrypts 64-bit blocks of data at a time, whereas the stream cipher
    can use blocks of variable lengths. Most symmetric key algorithms today are block
    ciphers.


    RC4, when implemented with only 40-bit keys, can be broken by brute force. Another
    cipher that has been broken is 56-bit single DES. In small keys (less than 128-bit),
    CAST, IDEA, RC2, and RC5 have all shown some type of weakness or have been broken.'
