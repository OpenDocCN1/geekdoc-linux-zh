    \ /etc/samba/smb.conf, and on SuSE Linux, it is present in /etc/smb.conf.\n\n\
    You can use the SWAT interface to configure the file share and print share, as\
    \ described in 6.3.1, \"Configuring a Samba server on AIX\" on page 125 by using\
    \ the SWAT interface.\n\nExample 6-6 shows an smb.conf file.\n\n*Example 6-6*\
