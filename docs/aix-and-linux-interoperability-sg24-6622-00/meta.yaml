    # 6.3 Samba file and print server on AIX and client on Linux


    This section describes the setup of a Samba file and print server on AIX and how
    to access the SMB shares from a Linux client using commands like **smbclient**
    and **smbmount**, and how to print to a printer attached to AIX using a smbprint
    filter.


    # 6.3.1 Configuring a Samba server on AIX


    A Samba server can be started either through inetd or as a daemon. The choice
    depends upon how often the Samba server is required to provide the services. If
    the requests are *substantial*, then we recommend starting the Samba service as
    a daemon. In that case, ensure that the related smbd and nmbd lines are commented
    in the /etc/inetd.conf file and smbd is started with a -D option. A typical /etc/inetd.conf
    file entry for Samba looks like Example 6-1.


    ```

    Example 6-1  /etc/inetd.conf entries to start Samba server as a daemon


    #netbios-ssn stream tcp nowait root /usr/sbin/smbd smbd

    #netbios-ns dgram upd wait root /usr/sbin/nmbd nmbd

    swat        stream  tcp     nowait.400    root /usr/sbin/swat swat

    ```


    To start the smbd server as a daemon, run the following command:


    ```

    # /usr/sbin/smbd -D

    ```


    Samba is configured using a single configuration file. It is a plain text file
    that can be edited manually or through the Web-based graphical user interface,
    Samba Web Administration Tool (SWAT). The file, generally stored at /etc/smb.conf
    or /etc/samba/smb.conf, has a number of options, and a great deal of fine tuning
    can be achieved. To know more about the various options, you can refer to the
    documentation provided by the SWAT interface or the manual pages by typing the
    **man smb.conf** command.


    We describe an example of creating a file share and configuring a printer on AIX
    in the following steps:


    +   1. Verify that the server is started and listening on the SWAT port (901).
    You can do that by typing the command shown below:


    ```

    # netstat -an | grep 901

    ```'
