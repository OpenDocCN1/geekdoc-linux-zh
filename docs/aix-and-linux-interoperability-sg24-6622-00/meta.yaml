  md: "# AIX Kerberos authentication module\n\nThe AIX Kerberos authentication module\
    \ is /usr/lib/security/KRB5. To use it, the system should be configured using\
    \ the mkkrb5clnt program. In case the master server was not configured using the\
    \ mkkrb5srv script, you should add the following line to the /var/krb5/krb5kdc/kadm5.acl\
    \ file:\n\n```\nhost/*@WEEORG.COM\n```\n\nTo support our WEEORG.COM realm, we\
    \ can issue the following command:\n\n```\n# mkkrb5clnt -r WEEORG.COM -l r-aix.weeorg.com\
    \ -d weeorg.com -i LDAP -K\n```\n\nThis command says that the host belongs to\
    \ the WEEORG.COM realm, the information about KDC and administration server may\
    \ be found at the r-aix.weeorg.com LDAP server, our domain is weeorg.com, and\
    \ the users' information is administered in LDAP.\n\nIf you want to administer\
    \ users using standard AIX user management commands such as **mkuser**, then this\
    \ is not enough. In that case, you have to specify the -A option:\n\n```\n# mkkrb5clnt\
    \ -r WEEORG.COM -l r-aix.weeorg.com -d weeorg.com -A -i LDAP -K\nPassword for\
    \ admin/admin@WEEORG.COM:\nConfiguring fully integrated login\nAuthenticating\
    \ as principal admin/admin with existing credentials.\nWARNING: no policy specified\
    \ for host/r-aix.weeorg.com@WEEORG.COM;\n  defaulting to no policy. Note that\
    \ policy may be overridden by\n  ACL restrictions.\nPrincipal \"host/r-aix.weeorg.com@WEEORG.COM\"\
    \ created.\n\nAdministration credentials NOT DESTROYED.\nAuthenticating as principal\
    \ admin/admin with existing credentials.\n\nAdministration credentials NOT DESTROYED.\n\
    Configuring Kerberos as the default authentication scheme\nMaking root a Kerberos\
    \ administrator\nAuthenticating as principal admin/admin with existing credentials.\n\
    WARNING: no policy specified for root/r-aix.weeorg.com@WEEORG.COM;\n  defaulting\
    \ to no policy. Note that policy may be overridden by\n  ACL restrictions.\nEnter\
    \ password for principal \"root/r-aix.weeorg.com@WEEORG.COM\":\nRe-enter password\
    \ for principal \"root/r-aix.weeorg.com@WEEORG.COM\":\nPrincipal \"root/r-aix.weeorg.com@WEEORG.COM\"\
    \ created.\n\nAdministration credentials NOT DESTROYED.\nCleaning administrator\
    \ credentials and exiting.\n```"
