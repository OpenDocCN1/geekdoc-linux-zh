  md: "# *Example 3-7* The DNS zone with support for Kerberos services\n\n```\nweeorg.com.\t\
    IN\tNS\tr-linux.weeorg.com.\n;\nr-linux\tIN\tA\t9.3.5.32\nldap\tIN\tCNAME\tr-linux.weeorg.com.\n\
    kerberos\tIN\tCNAME\tr-linux.weeorg.com.\nr-aix\tIN\tA\t9.3.4.34\nldap-1\tIN\t\
    CNAME\tr-aix.weeorg.com.\nkerberos-1\tIN\tCNAME\tr-aix.weeorg.com.\nboticelli\t\
    IN\tA\t9.3.5.25\n;\n_kerberos\tIN\tTXT\t\"WEEORG.COM\"\n_kerberos-master._udp\t\
    IN\tSRV\t0 0 88\tr-linux.weeorg.com.\n_kerberos-adm._udp\tIN\tSRV\t0 0 749\tr-linux.weeorg.com.\n\
    _kpasswd._udp\tIN\tSRV\t0 0 464\tr-linux.weeorg.com.\n_kerberos._udp\tIN\tSRV\t\
    0 0 88\tr-linux.weeorg.com.\n\tIN\tSRV\t0 0 88\tr-aix.weeorg.com.\n_ldap._tcp.weeorg.com\t\
    IN\tSRV\t0 0 389\tr-linux.weeorg.com.\n\tIN\tSRV\t0 0 389\tr-aix.weeorg.com.\n\
    ```\n\n> **Note:** When an important security protocol relies on DNS, then you\
    \ should make sure that DNS cannot be compromised easily. The Kerberos and DNS\
    \ combination is not an exception in this respect: DNS corruption may lead to\
    \ a serious security breach or a denial of service, depending on your luck and\
    \ their skills. We strongly recommend keeping the name servers in good shape and\
    \ using DNSSEC for authenticated and secure zone transfers. The latter is a must\
    \ if the transfers are done over a decidedly untrusted network, such as the Internet.\n\
    \nIf you are running a particularly sensitive operation, then it may be better\
    \ not to use the SRV records at all.\n\n# 3.7 Integrating Kerberos authentication\n\
    \nWe describe how to set up and integrate Kerberos in a heterogeneous environment\
    \ in this section. The master KDC server is NAS on an AIX 5L Version 5.2 host.\
    \ The slave KDC server is MIT Kerberos hosted on Red Hat Linux Version 8.0. Given\
    \ such a division of roles, we use the local file systems to store Kerberos data.\n\
    \n# 3.7.1 KDC setup\n\nAIX NAS has the config.krb5 configuration script, which\
    \ may be used to initialize the master KDC and the database. However, you should\
    \ use the mkkrb5srv"
  merge: -1
  pgno: 91
- img_proc: false
  md: "program instead of config.krb5. Whereas the latter configures the system for\
    \ the native Kerberos authentication, the former takes care of the AIX standard\
    \ authentication system as well. The mkkrb5srv script invokes config.krb5 to perform\
    \ the server configuration. It is enough to specify the Kerberos realm and the\
    \ domain:\n\n```\n# mkkrb5srv -d weeorg.com -r WEEORG.COM -s r-aix.weeorg.com\n\
    \  Fileset                      Level  State     Description\n --------------------------------------------------------------------------\n\
    Path: /usr/lib/objrepos\n  krb5.server.rte             1.3.0.0  COMMITTED  Network\
    \ Authentication Service\n                                                   Server\n\
    \nPath: /etc/objrepos\n  krb5.server.rte             1.3.0.0  COMMITTED  Network\
    \ Authentication Service\n                                                   Server\n\
    The -s option is not supported.\nThe administration server will be the local host.\n\
    Initializing configuration...\nCreating /etc/krb5/krb5.conf...\nCreating /var/krb5/krb5kdc/kdc.conf...\n\
