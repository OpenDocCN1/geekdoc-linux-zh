    the DVD-RAM media. This is very useful for the backup process, as you can directly
    change user-defined files like bosinst.data, keeping the system backup image intact
    on the DVD itself. If you wanted to do the same without UDF, then you will have
    to restore the backup image, add the files, and then back up the files again.


