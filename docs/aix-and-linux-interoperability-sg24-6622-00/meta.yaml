    # Configuration


    OpenLDAP still does not have any kind of graphical user interface for configuration
    and administration. The main configuration utility is vi or your favorite text
    editor. The configuration is kept in slapd.conf. It is a flat ASCII file and usually
    resides in /etc/openldap. We show a sample configuration in Example 2-10 on page
    42.


    The OpenLDAP configuration consists of two parts: The global options and the database
    (or back-end) options. Global options apply to the slapd directory server. They
    are followed by zero or more back-end definitions. We discuss the most used options.
    See the slapd.conf(5) man page for more details.


    # Global options


    The OpenLDAP distribution includes several LDAP schemas. Those used in back ends
    must be specified in the global options part. Actually, object class and attributes
    definitions are global options, but typically kept in separate files, which are
    included in slapd.conf. It is common to start the configuration file with included
    schemas. In case an attribute or object class is referenced in data, but not defined
    in any schemas, slapd refuse to start.


    # Transport Level Security (TLS) options


    Availability of a secure communication channel is a must no matter how trusted
    your networks may be. The TLS options in the second paragraph of Example 2-10
    on page 42 specify the location of the Certificate Authority (CA) and server certificates,
    the server key, and the minimum cryptographic strength. In this example, we use
    certificates created and locally managed with OpenSSL utilities. Even though it
    is possible to use commercially available certificates, it is cheaper to create
    certificates using OpenSSL for the purpose of serving local LDAP clients. TLS
    is a new protocol similar to SSL and is described in RFC2246. Note that when the
    security option for the minimum cryptographic strength is specified, slapd does
    not accept non-encrypted connections.


    # Database options


    The database part starts with the database keyword. The slapd server is modular,
    for example, additional back ends may be implemented and dynamically loaded without
    the core code change. Naturally, the database configuration options depend on
    the back-end’s nature. However, many options are common to all back-end types.


    The database most commonly used is ldbm, which is the Berkeley DB implementation.
    The suffix keyword defines the common DN suffix for the'
