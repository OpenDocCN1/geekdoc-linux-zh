    # 6


    # Samba file and print server


    Samba is an Open Source/Free Software suite and allows clients to share file and
    print services via the Server Message Block (SMB) and Common Internet File Systems
    (CIFS) protocols. Samba is used mostly for Windows and UNIX integration, but can
    also be used between AIX and Linux. We describe Samba, because it is a very useful
    and popular software extensively implemented in a mixed operating systems environment.
    In this chapter, we discuss Samba as a file and print sharing example for Linux
    and AIX systems. We do not describe the details about Samba and the various configuration
    options associated with Samba, as they are already well documented and available
    on Samba''s Web site at http://www.samba.org.


    or in the redbook *Samba Installation, Configuration, and Sizing Guide*, SG24-6004,
    which can be found on the IBM Redbooks site at:

    http://www.redbooks.ibm.com/pubs/pdfs/redbooks/sg246004.pdf


