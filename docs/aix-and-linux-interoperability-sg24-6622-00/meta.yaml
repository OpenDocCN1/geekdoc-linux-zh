  md: 'the kadmind administration server is a Kerberos application, which serves requests
    for principal manipulation and password changes. To be able to do this, it reads
    all principals and corresponding keys from the kadm5.keytab file. That is why
    we use the `ktadd` command to store the special kadmin/admin and kadmin/changepw
    principals in kadm5.keytab.


    To access the administration server, we use the admin/admin principal:


    ```

    # kadmin.local -q "addprinc admin/admin@WEEORG.COM"

    Authenticating as principal root/admin@WEEORG.COM with password.

    WARNING: no policy specified for admin/admin@WEEORG.COM; defaulting to no policy

    Enter password for principal "admin/admin@WEEORG.COM":

    Re-enter password for principal "admin/admin@WEEORG.COM":

    Principal "admin/admin@WEEORG.COM" created.

    ```


    # 3.2.3 Controlling access to Kerberos


    Kerberos administration server controls access to the Kerberos database using
    the Access Control List (ACL). The list is kept in a flat ASCII file (kadm5.acl).
    To start, we create the file with the following line to allow all principals with
    the admin instance unlimited access:


    ```

    */admin@WEEORG.COM          *

    ```


    An asterisk in the principal name is a global character standing for any string.
    An asterisk in the second field is a shortcut for the *admcil* set of privileges.
    Every letter in this string denotes one type of access:


    +   - **a** — Add principals and policies

    - **d** — Delete principals and policies

    - **m** — Modify principals and policies

    - **c** — Change password of principals and policies

    - **i** — Query database (inquire)

    - **l** — List principals and policies


    For example, the following line allows the user jack to inquire about principals:


    ```

    jack@WEEORG.COM            i

    ```


    The uppercase letters denote that the principal is denied the corresponding access.
    The order of the ACL is significant and the administration server applies controls
    for the first match.


    The third field in the access control list may specifies a target. Like the first
    field, the target is a principal specification and may include the * wildcard.'
