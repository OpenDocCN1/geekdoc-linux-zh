    \nAt this point, you may use the kadmin program to add principals or define and\
    \ apply policies.\n\n> **Note:** In case any data changes in the realm, the KDC\
    \ and administration servers have to be restarted in order for changes to have\
    \ effect.\n\nThe config.krb5 script should not be used to configure the slave\
    \ KDC servers. However, given that there is no need to propagate the database\
    \ using Kerberos tools, setting up the slave servers is easy. You should copy\
    \ /etc/krb5/krb5.conf and /var/krb5/krb5kdc/.kdc_ldap_data from the master server\
    \ and, optionally, edit them to suit the slave KDC server's needs.\n\n# 3.5 Linux\
    \ Kerberos support\n\nAs opposed to AIX, Linux sports a “vanilla” MIT Kerberos\
    \ edition. Heimdal is another Kerberos package available as open source and is\
    \ free, but we discuss the MIT version. Heimdal is not available from Red Hat,\
    \ but is included with other distributions, such as Debian Linux. Of course, it\
    \ may be compiled on any computer running Linux.\n\n# 3.5.1 Red Hat Linux Kerberos\
    \ packages\n\nOn a Red Hat Linux Version 8.0 host, you should install the following\
    \ RPM packages:\n\n+   - krb5-libs-1.2.5-6\n- krb5-workstation-1.2.5-6\n- krb5-server-1.2.5-6\n\
    - pam_krb5-1.56-1\n- cyrus-sasl-gssapi-2.1.7-2"
