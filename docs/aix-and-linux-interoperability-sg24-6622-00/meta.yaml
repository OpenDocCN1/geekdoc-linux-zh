  md: '# # Identification and authentication


    Identification and authentication are real world processes, but it is not always
    easy to recognize them. For example, it is enough for our friends and family just
    to see us or hear our voice over the phone to establish unmistakably who we are.
    There seems to be no authentication involved and yet they do subconsciously verify
    our identity. Another example is proving our identity to authorities by showing
    an ID with a photo. A clerk then tries to verify that the ID is ours by comparing
    a photo with our face and that it has not been forged.


    UNIX users (usually) represent real world subjects (us). A UNIX system decides
    what we are authorized to do based on our IDs. Every UNIX user name maps to a
    UNIX user ID (UID). Identification in computing is a process in which a user presents
    his user name. Authentication is establishing that the user is who she claims
    to be, which the user proves typically by typing her password.


    In this chapter, we talk about identification and authentication mechanisms of
    AIX 5L™ Version 5.2 and Linux, in which ways they are similar and different, and
    how to make the best use of them.'
  merge: -1
