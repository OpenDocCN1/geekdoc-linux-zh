    # 7.6.2 User and group ID mapping


    The user ID and group ID mappings should be the same on both the NFS client and
    the NFS server. Every NFS request carries user credentials in the form of the
    UID and a list of GIDs. In case this user has a different UID on the NFS server,
    he/she may not be able to access his/her files. This problem may be solved either
    by sharing the user information from the /etc/passwd and /etc/group maps or by
    running the dynamic ugidd mapping daemon on NFS clients. The former solution is
    preferable.


    For example, if a user named Martha has UID=510 on the Linux system and that Linux
    system (NFS client) has /usr/local/ mounted from an AIX system (NFS server), and
    Martha creates a new file, for example, new_file in /usr/local, this new file
    will be owned by the user with UID=510 on both AIX and Linux. So any user with
    UID=510 on AIX would be treated as the owner of the /usr/local/new_file file.


    The group ID mapping is handled in a similar manner.


    Under normal circumstances, the NFS server maps the UID 0 (root) to the UID of
    the nobody user before performing access checks for a client. This process prevents
    gaining root privileges on remote file systems. You can use the squash_root option
    (A Linux directive; the "anon=0" option can be used on AIX) in the NFS server''s
    /etc/exports file to avoid this situation, but its use is not recommended for
    security reasons.


    # 7.6.3 Access control lists


    The NFS ACL support is typically limited to cases when both the client and the
    server run the same NFS implementation. The NFS Version 4 standardizes the use
    of ACLs, but there are still no usable implementations. The ACLs on NFS Version
    2 and NFS Version 3 are supported with vendor specific extensions.


    NFS no longer uses access control lists by default in AIX 5L Version 5.2 (though
    it is still the default on AIX Version 4.3). If you need to use ACLs with NFS,
    then you have to use the acl option with the **mount** command as follows:


    ```

    # mount -o acl

    ```'
