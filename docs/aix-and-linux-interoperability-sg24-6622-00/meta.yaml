    The directory keyword specifies the location where database and index files will
    be stored. The index keyword specifies which attributes are to be used as indexing
    keys. Indexing the database is very important and sometimes overlooked, resulting
    in bad directory server performance. All attributes on which a search is going
    to be regularly performed should be indexed. In our example, the most important
    ones are user and group names and IDs. Of course, your applications govern the
    choice of indexes to maintain.


    Finally, access control is very important in most applications. The default access
    in OpenLDAP slapd is read. That is definitely not appropriate for user passwords,
    so we allow only the authentication operation on the userPassword attribute. The
    self keyword denotes the entry itself. In our example, that means that the user
    who has already authenticated himself is authorized to change the password.


