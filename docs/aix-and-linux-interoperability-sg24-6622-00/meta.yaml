  md: "```\nksetup> listkdc\n   kerberos.weeorg.com:88\n   kerberos-1.weeorg.com:88\n\
    ksetup> exit\n```\n\nThe commands that start with add, such as addkdc or addhost,\
    \ install the names of the computers hosting the corresponding service: kdc for\
    \ Kerberos Distribution Center (KDC), admin for the administration server (kadmind),\
    \ and pwd for the password change service (also served by kadmind). As you may\
    \ have guessed, commands that start with list and del, such as listkdc, listhost,\
    \ delkdc, and delhost, are available as well. The complete description of the\
    \ program is in the *AIX 5L Version 5.2 NAS Administrator's and User's Guide for\
    \ AIX*, which can be found in the /usr/lpp/krb5/doc/pdf/en_US/ADMINGD/ADMINGD.PDF\
    \ file.\n\nOf course, all programs should know how to access an LDAP server. The\
    \ config.krb5 script may configure the client hosts as follows:\n\n```\n# config.krb5\
    \ -C -r WEEORG.COM -d weeorg.com -l ldap.weeorg.com\nInitializing configuration...\n\
    Creating /etc/krb5/krb5.conf...\nThe command completed successfully.\n```\n\n\
    The script will create the krb5.conf file from scratch and include the following\
    \ lines, which are of particular interest at the moment:\n\n```\n[libdefaults]\n\
    \    use_ldap_lookup = 1\n    ldap_server = ldap.weeorg.com\n```\n\n# 3.6.2 Discovering\
    \ Kerberos services using DNS\n\nThe Kerberos distribution available on Linux\
    \ includes support for locating the Kerberos service through DNS. Given that the\
    \ DNS zone is configured properly, every Kerberos client host may be easily set\
    \ up, as we show in Example 3-6. Nevertheless, one should still specify the administration\
    \ server in krb5.conf, because support for it has not been completed yet.\n\n\
    ```\nExample 3-6  Client krb5.conf file with the DNS discovery support\n\n[libdefaults]\n\
    \    dns_lookup_realm = true\n    dns_lookup_kdc = true\n```\n\nWe provide a fairly\
    \ complete example of the weeorg.com zone in Example 3-7 on page 74. The _kerberos\
    \ TXT record resolves to WEEORG.COM, which is the default Kerberos realm. The\
    \ SRV records represent the locations of various Kerberos services. Furthermore,\
    \ they illustrate nicely the Kerberos environment. Note that the SRV records must\
    \ point to the canonical host names."
