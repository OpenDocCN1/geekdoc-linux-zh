  md: 'On Linux, automount is started by running `/usr/sbin/automount` or by the `/etc/init.d/autofs`
    script. This may be different, depending on your Linux distribution. For example,
    in Red Hat Linux, execute `/etc/rc.d/init.d/autofs start`.


    Run `man automount` on AIX and `man automount` on Linux for more details.


    6. After starting the automounter, you can test if automount is working by just
    changing the directory to the desired directory on the NFS client. For example:


    ```

    $ cd /home/home/borg

    ```


    You should now be able to access the `/home/borg` directory, which is the directory
    exported from the NFS server to the NFS client at mount point `/home/home/borg`.
    This mount is done without explicitly executing the `mount` command.


    Here is an example scenario of an NFS server on AIX and mounting the AIX directory
    on a Linux system using automount:


    1. Configure the NFS server on AIX and NFS client on Linux.


    2. On the Linux system, create the `/etc/auto.master` file with following contents:


    ```

    /home/home /etc/auto.home

    ```


    3. Create a new file or add the following contents to the `/etc/auto.home` file:


    ```

    borg -rw,hard,intr aix_host:/home/borg

    ```


    4. Ensure that the NFS server on AIX is exporting the `/home/borg` directory with
    the proper permissions.


    5. Start the autofs script on Linux (depending upon your Linux distribution).
    For example, on Red Hat Linux, the autofs script is at `/etc/init.d/autofs`:


    ```

    # /etc/init.d/autofs start

    Starting automount:                                  [  OK  ]

    ```


    6. When you issue the `mount` command, you should get the following line in the
    output, among other general mount information:


    ```

    # mount

    automount(pid27470) on /home/home type autofs

    (rw,fd=5,pgrp=27470,minproto=2,maxproto=3)

    ```


    7. Change the working directory to `/home/home/borg`:


    ```

    # cd /home/home/borg

    ```


    8. Issue the `mount` command again to check the output. It should contain lines
    similar to the following:


    ```

    automount(pid27470) on /mnt type autofs

    (rw,fd=5,pgrp=27470,minproto=2,maxproto=3)

    ```'
