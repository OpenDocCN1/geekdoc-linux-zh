    # Logging facilities on AIX


    This section describes the configuration and format of the system logs related
    to IPSec on AIX. As hosts communicate with each other, the transferred packets
    may be logged to the system log daemon, syslogd. Other important messages about
    IPSec will appear as well. We could use these logs for traffic analysis or to
    troubleshoot.'
