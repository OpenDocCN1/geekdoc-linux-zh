- img_proc: false
  md: "In Example 9-17, we generate a set of Diffie-Hellman parameters using a generator\
    \ of 2 and a random 1024-bit prime, and write the parameters in PEM format to\
    \ the file dhparam.pem.\n\n# Example 9-17 Generating new set of Diffie-Hellman\
    \ parameters\n\n```\n# openssl dhparam -out dhparam.pem -2 1024\nwarning, not\
    \ much extra random data, consider using the -rand option\nGenerating DH parameters,\
    \ 1024 bit long safe prime, generator 2\nThis is going to take a long time\n.......................................+........+..+..+........+...+*+*+*+*\n\
    ```\n\nIn Example 9-18, we read a set of Diffie-Hellman parameters from the dhparam.pem\
    \ file and write a C code representation of the parameters to stdout.\n\n# Example\
