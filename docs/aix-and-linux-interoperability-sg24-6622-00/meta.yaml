- img_proc: false
  md: '![](bbox=[0.27, 0.08, 0.83, 0.48])


    Figure 2-8 LDAP authentication environment


    The LDAP protocol supports public key style cryptography (SSL/TLS) for secure
    connections. Having encrypted communication is important, and with SSL, we are
    well protected. However, in the case of LDAP authentication, it is as important
    to be sure about the other party''s identity, or we could be giving away passwords
    to just about anybody. Public Key Infrastructure (PKI) offers a mechanism to establish
    identity, but for all practical purposes, it is lacking in many respects. We list
    here the two main problems:


    +   - An SSL certificate contains a public key and a name. It is signed by a Certificate
    Authority (CA). In other words, there is a third (hopefully) trusted party to
    claim that the certificate is good and that it really belongs to the named organization.
    Hence, the certificate validity depends on how well the CA is doing its business.
    If a server offers a self-signed certificate, one cannot conclude anything, unless
    that certificate is available in the client''s certificate database.

    - There is also a private key that corresponds to the public key contained in
    the certificate. The private key should be known only to its owner. Like anything
    else, private keys may be compromised. In that case, the corresponding certificate
    should be *revoked*. Every CA keeps a list of revoked certificates that is made
    publicly available. Some SSL clients, such as OpenSSL, do not have the capability
    to check the CRL for revoked certificates. At any rate, it is'
  merge: -1
  pgno: 66
- img_proc: false
  md: 'simply impractical to check the Certificate Revocation List (CRL) whenever
    an SSL connection is to be established, because the communication and processing
    overhead significantly hinder performance.


    Given that all LDAP servers are controlled by the same management team, we may
    be able to deal with these PKI deficiencies. The main point is that users have
    no responsibilities regarding the PKI management. The management staff is hopefully
    knowledgeable and diligent enough to keep up with the PKI.


    The PKI we recommend is to create a local certificate authority and use it to
    sign the server certificate requests. Note that using certificates for authentication
    is quite a bit different from using certificates on the Internet. It simply makes
    no sense for authentication clients to trust anybody with the certificate issued
    by some commercial CA. Therefore, certificates for authentication purposes have
    to be prepared within the organization. Furthermore, clients should trust only
    certificates signed by the local CA. In other words, all commercial root CA certificates
    must be removed from clients'' certificate databases.


    If one of the servers'' private keys is compromised, the only solution is to replace
    the certificate databases on all hosts. Since not all SSL clients have a capability
    to use the Certificate Revocation Lists (CRL), it is of no use to just revoke
    the certificate. Even if they were able to consult the CRL, the performance would
    probably be so sluggish that you would soon turn the feature off. Anyway, if the
    CRL is not used, the only option is to create a new CA, produce new server certificate
    requests, sign new server certificates, and replace old certificates with the
    new ones.


    This sounds like a lot of work and, if done manually, it would definitely be.
    Still, one may be able to automate the process to a reasonable extent. For example,
    all clients of the same type get the same copy of the key database and it is possible
    to organize file transfer in a batch mode. The most time consuming task is producing
    certificates for servers and restarting the LDAP servers, but the number of servers
    is usually small.'
  merge: -1
  pgno: 67
