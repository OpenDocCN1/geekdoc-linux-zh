    "OpenLDAP server setup" on page 38.


    # 2.4.2 Migrating users on AIX


    The tools we use on Linux to migrate users may be used on AIX too. Some preprocessing
    is in place to bring data from the /etc/security/user and /etc/security/passwd
    files into the shadow form and that should not be difficult to do. However, AIX
    has its own set of utilities for LDAP configuration. These utilities are specific
    to the AIX LDAP authentication client and the IBM Directory Server.


