  md: '# 5.2 Mail server on AIX


    In this section, we describe a scenario in which AIX acts as a mail server or
    mail hub for an internal network of computers. All the mail from this network
    is handled by AIX.


    # 5.2.1 Configuring mail server on AIX


    We describe an example of generating a basic sendmail.cf file for a mail hub.
    The sendmail.cf file is generated using the m4 macro.


    You can find an example of a macro file on AIX 5L Version 5.2.0 at /usr/samples/tcpip/sendmail/cf/aixsample.mc.
    You should edit this file or create a new .mc file.


    We show a sample file (/etc/mail/sendmail_hub.mc) in Example 5-1.


    ```

    Example 5-1  The configuration file in the .mc extension for the mail hub


    VERSIONID(Config file for AIX hub)

    OSTYPE(aix)dnl

    FEATURE(use_cw_file)

    MASQUERADE_AS(foo.com)

    FEATURE(allmasquerade)

    MAILER(smtp)dnl

    MAILER(local)dnl

    ```


    > **Important:** Make sure you type the right OSTYPE macro value and change the
    file name in the /usr/samples/tcpip/sendmail/ostype directory. In our example,
    since we entered *aix* in the .mc file, we *must* rename the /usr/samples/tcpip/sendmail/ostype/aixsample.m4
    to aix.m4.


    The main options of the .mc file are described in the Table 5-1 on page 116.


    The use_cw_file feature specifies an external file that contains the hosts and
    domains that this system will accept and deliver mail locally. The default file
    for this purpose is /etc/mail/local-host-names. The entries in this file can be
    similar to Example 5-2.


    ```

    Example 5-2  Example of the /etc/mail/local-host-names file


    localdomain.com

    ibm.com

    foo.com

    ```'
  merge: -1
  pgno: 136
- img_proc: false
  md: "The MASQUERADE_AS macro removes all references to any local computer and makes\
    \ all the departing messages appear as if they are coming from the user at foo.com.\
    \ The allmasquerade feature masquerades recipient names as well as sender names.\n\
    \nThe MAILER macros activate the delivery agents, Simple Mail Transfer Protocol\
    \ (SMTP), and the default local delivery agent. Putting all MAILERs at the end\
    \ is important.\n\nThere are several more options that can be used to fine tune\
    \ Sendmail according to your needs. You can find out about these options from\
    \ http://www.sendmail.org/m4/intro.html or from the README included in the Sendmail\
    \ documentation. For example, in AIX 5L Version 5.2.0, you can find the README\
    \ in the /usr/samples/tcpip/sendmail directory.\n\nWe may produce the Sendmail\
    \ configuration file by using the m4 macro preprocessor. This can be done as follows:\n\
    \n+   1. Make a backup of the current sendmail.cf file:\n    # cd /etc/mail\n\
    \    # mv sendmail.cf sendmail.cf.orig\n2. Change the working directory to /usr/samples/tcpip/sendmail/m4/cf\
    \ and execute the following commands:\n    # cd /usr/samples/tcpip/sendmail/cf\n\
    \    # m4 ../m4/cf.m4 /etc/mail/sendmail_hub.mc >/etc/mail/sendmail.cf\n    Due\
    \ to the coding style of m4 macros in the AIX's Sendmail package, it is necessary\
    \ to preprocess the .mc files from the specified directory. Alternatively, one\
    \ may specify the configuration directory when invoking the m4 program:\n    -D_CF_DIR_=/usr/samples/tcpip/sendmail/\n\
    3. To make Sendmail read from the configuration file we created, restart Sendmail.\
    \ Refer to 5.1.3, “Start and stop Sendmail” on page 117 for details.\n\nWe now\
