  md: 'openssl    #######################################


    The OpenSSL binary is located at /usr/linux/bin directory. You could invoke it
    by issuing the following command:


    ```

    # /usr/linux/bin/openssl

    OpenSSL>

    ```


    Later, we will cover how to use OpenSSL by using the command line.


    # Installing OpenSSL on Linux


    In Red Hat Linux Version 8.0, OpenSSL is located on installation disk number 1.


    To install the package, issue the following command:


    ```

    # rpm -ivh openssl-0.9.6b-29.i686.rpm

    ```


    The OpenSSL binary is installed by default in /usr/bin.


    # Configurations


    OpenSSL includes a default configuration file that is used unless an alternate
    one is specified. The default file is openssl.cnf. The configuration file''s default
    settings are all quite reasonable, but it can be useful to replace them with settings
    that are better tailored to your needs. The location of configuration file is
    different on Linux and AIX. You can check the location of the configuration file
    in any operation system by issuing the command:


    ```

    # openssl ca

    ```


    Any errors that are issued due the lack of options may be ignored. By default,
    on Linux, the configuration file is /usr/share/ssl/openssl.cnf, and on AIX, the
    configuration file is /var/ssl/openssl.cnf.


    Just three of the many commands supported by the command line tool make use of
    this configuration file. The commands that use it are **ca**, **req**, and **x509**
    (we will talk about these commands later).


    The configuration file for OpenSSL program is where you can configure the expiration
    date of your keys, the name of your organization, the address, the country, and
    so on. The parameters you may change will be in the [ CA_default ] and especially
    the [ req_distinguished_name ] sections. Example 9-9 shows an OpenSSL configuration
    file.


    _Example 9-9  OpenSSL configuration file_


    ```

    #

    # OpenSSL example configuration file.

    # This is mostly being used for generation of certificate requests.

    ```'
