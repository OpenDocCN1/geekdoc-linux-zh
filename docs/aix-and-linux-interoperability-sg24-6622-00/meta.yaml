  md: '# 3.9 Security considerations


    Kerberos is one of the most secure authentication systems. Still, as with the
    LDAP authentication model, when user information is stored in a single place,
    migration to the SSO authentication introduces the same set of weaknesses. The
    Kerberos master database and application servers'' key tables are sensitive information,
    which should be readable only by owners.


    All KDC servers host the Kerberos data. These computers should have limited access
    and be physically secure. The key table files must be present on all hosts that
    offer Kerberized services. These files must be protected from unauthorized access
    and should be excluded from regular backups. Should the need arise, the service
    keys are easy to generate from scratch using a script, such as the one we show
    in Example 3-8 on page 76.


    # 3.10 Enterprise Identity Mapping (EIM)


    In a enterprise, it is common to have more than one user registry, which requires
    each person or entity within the enterprise to have a user identity in each registry.
    Today, the systems are becoming more complex than ever and you need to manage
    these multiples user registries. The need for multiple user registries quickly
    grows into a problem that affects users, system administrators, and application
    developers. Enterprise Identity Mapping (EIM) enables inexpensive solutions for
    more easily managing and working with multiple user identities in you enterprise.


    # 3.10.1 EIM concepts


    EIM is a mechanism for mapping a person or entity to the appropriate user identities
    in various registries throughout the enterprise. EIM provides APIs for creating
    and managing these identity mapping relationships, as well as APIs used by applications
    to query this information.


    In a enterprise environment, it is common that a user has several users and passwords
    to access different systems and resources. Usually, the user sets the passwords
    to be the same one. However, this action compromises the security of the network.
    Using EIM and single sign-on enablement, you are able to manage this problem,
    because the users do not need to authenticate against every system that they want
    to access. Using EIM, this authentication occurs just once when the user is authenticated
    in the network. It is good for the users, because they do not need to remember
    many user names and passwords, and it is good for administrators, because they
    will not have so many problems related to users that forgot their password in
    a given system. It is good to the developers also,'
  merge: -1
  pgno: 99
- img_proc: false
  md: 'because now they are free to write applications that use an appropriate existing
    user registry for authentication and a different user registry for authorization.


    # 3.10.2 Using Enterprise Identity Mapping


    EIM provides APIs for creating and managing the identity mapping relationships,
    as well as APIs used by applications to query this information.


    The APIs provided by EIM allow applications to ask questions about the relationship
    between individuals and entities in an EIM architecture. So EIM architecture describes
    the relationship between individuals or entities in the enterprise and the many
    identities that represent them within an enterprise


    Using the EIM APIs, you can determine a user identity in a given system if you
    know the identity of the user in any other system. For example, you have user
    A in one user registry. Now, you want know what user corresponds to user A in
    another user registry, so all you have to do is ask EIM what is the identity in
    a user registry that has the user name A in another giver user registry.


    Identity mapping requires that administrators do the following:


    +   1. Create EIM identifiers that represent people or entities in their enterprise.

    2. Create EIM registry definitions that describe the existing user registries
    in their enterprise.

    3. Define the relationship between the user identities in those registries to
    the EIM identifiers that they created.


    No code changes are required to existing registries. Mappings are not required
    for all identities in a user registry. EIM allows one-to-many mappings (in other
    words, a single user with more than one identity in a single user registry). EIM
    also allows many-to-one mappings (in other words, a single user with more than
    one identity in a single user registry). EIM also allows many-to-one mappings
    (in other words, multiple users sharing a single identity in a single user registry,
    which, although supported, is not advised for security reasons). An administrator
    can represent any user registry of any type in EIM.


    For more information about EIM, visit the following Web site:


    http://publib.boulder.ibm.com/eserver/index.html


    The EIM APIs are available on all IBM platforms. At the time of the writing of
    this redbook, the EIM development kit on Linux was not available yet. However,
    IBM will release it soon.'
  merge: -1
