- img_proc: false
  md: '# 7.1  What NFS is


    NFS was designed by Sun Microsystems. NFS is a method of accessing disk or file
    space on other systems transparently, for example, accessing remote objects as
    if they resided on a local hard disk. The NFS protocol is designed to be portable
    across different machines, operating systems, network architectures, and transport
    protocols. By using NFS, users and administrators can distribute data files across
    AIX and Linux systems by storing the data on either AIX or Linux.


    NFS uses Remote Procedure Call (RPC) to provide a procedure-oriented interface
    to remote services. For detailed information on the NFS protocols and procedures,
    refer to RFC1094, available at:

    [http://www.cis.ohio-state.edu/cgi-bin/rfc/rfc1094.html](http://www.cis.ohio-state.edu/cgi-bin/rfc/rfc1094.html)


    Read the AIX Documentation on NFS for more details on NFS on AIX.


    Linux NFS-HOWTO also provides very relevant and important information. The Linux
    NFS HOWTO is available at:

    [http://nfs.sourceforge.net/nfs-howto/index.html](http://nfs.sourceforge.net/nfs-howto/index.html)


    These documents also discuss the security issues for NFS. We recommend you read
    these documents before installing NFS.


    Recent NFS implementations support both the NFS version 3 and version 2. One of
    the major differences is that NFS Version 3 may use TCP as a transport protocol,
    thus better supporting WANs than NFS Version 2, which is limited to UDP. NFS Version
    3 may transfer data in chunks larger than 8 KB, which is important for some new
    network technologies, such as gigabit Ethernet. NFS Version 2 cannot be used if
    files are larger than 2 GB (a 32-bit offset limitation). NFS Version 3 keeps file
    offsets as 64-bit values. Support for NFS Version 3 in the Linux kernel has only
    recently been included and NFS over TCP is still considered experimental. NFS
    Version 4 has been finalized as a protocol only recently, and no implementations
    are considered production ready.


    # 7.2  Installing NFS on AIX


    The NFS client is installed by default on AIX. The NFS server installation on
    AIX using SMIT is done as follows:


    +   1. Start the SMIT interface and go to the **Install and Update Software**
    screen by choosing **Software Installation and Maintenance**. You should see a
    screen similar to Example 7-1 on page 145.'
