    The mirroring will usually take less time than when using the normal **rcp** command.
    The rsync daemon uses the remote-update protocol, which allows rsync to transfer
    just the differences between two sets of files (if the destination file already
    exists) using a checksum-search algorithm. This is the reason why rsync is more
    efficient than rcp.


    # 4.2.2  rdist


    rdist is a program that will help maintain identical copies of files over multiple
    hosts on the network. It preserves the owner, group, mode, and mtime of files
    attributes, if possible, and at the same time updates programs that are executing.
    The new version of rdist does not need to be setuid to root. Instead of connecting
    to remote hosts directly, it now uses the remote shell (rsh) or secure shell (ssh)
    program to make its connections. The rdist package that we will use for this example
    was from the Toolbox, which you can download from AIX toolbox for Linux applications
    Web site:


    http://www.ibm.com/servers/aix/products/aixos/linux/


