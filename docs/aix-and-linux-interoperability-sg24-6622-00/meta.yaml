    # # File systems and data archiving


    In this chapter, we discuss file systems and backup and archiving tools on AIX
    and Linux. In particular, we examine the compatibility of archivers, as this sometimes
    may be an issue for data transfers between different computer architectures.


    Though the Linux journaling file systems market offers many different file systems,
    we concentrate on the IBM JFS, as it is available on both AIX and Linux. We also
    cover file Access Control Lists (ACL) in this context.


    An important new feature delivered with AIX 5L Version 5.2 is the UDF file system
    support. AIX computers equipped with DVD RAM devices may use UDF for backups or
    data archiving.'
  merge: -1
  pgno: 180
- img_proc: false
  md: '# 8.1 Journaled File System (JFS)


    The Journaled File System is a file system that provides improved structural consistency
    and recoverability and much faster restart times that non-journaled file systems,
    such as DOS FAT, traditional UNIX file systems, and ext2. Using database journaling
    techniques JFS can restore a file system to a consistent state in a matter of
    seconds, versus hours or days with non-journaled file systems when the amount
    of data is really big.


    In this section, we will cover how to convert an existent ext3 file system based
    Linux system to one running entirely on IBM Journaled File System (JFS). For more
    information about JFS, please visit the JFS for Linux Web site at:


    http://www-124.ibm.com/jfs


    > **Note:** ext3 is a journaled file system, but the intention here is to show
    how you can convert a given file system to JFS.


    # 8.1.1 Converting a existing ext3 file system to JFS


    We are going to convert an ext3 partition to a JFS partition in a machine running
    Red Hat Linux Version 8.0. During the installation of Red Hat Linux, we cannot
    choose a JFS partition, so in this section, we will suppose that the partition
    was formatted, using ext3, for installation. There is no way to directly convert
    an ext3 partition to JFS. All that we can do is create a new partition and then
    copy the ext3 partition’s contents to the JFS partition.


    The Red Hat Linux Version 8.0 distribution is shipped with JFS, but that does
    not mean that we will not have to recompile the kernel to install JFS. He have
    to recompile it because in Red Hat, the JFS is as a *module* in the kernel and
    we have to change it to a *built-in* option. In other words, if you do not recompile
    the kernel, you will not be able to boot from a JFS partition.


    To configure the kernel, use the `make config`, `make menuconfig`, or `make xconfig`
    command. In the section labeled File Systems, change the option **JFS filesystem
    support** from M (module) to * (built-in) and press the space bar. Configure the
    rest of kernel as needed for your system. After that, save the configuration and
    then build the kernel issuing the commands `make dep`, `make clean`, `make bzImage`,
    and, if necessary, `make modules` and `make modules_install`, as shown in Example
    8-1 on page 165.'
  merge: -1
  pgno: 181
- img_proc: false
  md: "# Example 8-1 Recompiling the kernel\n\n```\n# cd /usr/src\n# ln -s linux-2.4.18-14\
    \ linux\n# cd linux\n# make menuconfig\n# make dep\n# make clean\n# make bzImage\n\
    # cp arch/i386/boot/bzImage /boot/vmlinuz-2.4.18-14-jfs\n```\n\nNow we have to\
    \ change the lilo.conf file and add a new entry. The lilo.conf file is showed\
    \ in Example 8-2.\n\n# Example 8-2 lilo.conf file\n\n```\nprompt\ntimeout=50\n\
    default=jfs\nboot=/dev/hda\nmap=/boot/map\ninstall=/boot/boot.b\nmessage=/boot/message\n\
    linear\n\nimage=/boot/vmlinuz-2.4.18-14smp\n        label=linux\n        initrd=/boot/initrd-2.4.18-14smp.img\n\
    \        read-only\n        append=\"root=LABEL=/\"\n\nimage=/boot/vmlinuz-2.4.18-14\n\
    \        label=linux-up\n        initrd=/boot/initrd-2.4.18-14.img\n        read-only\n\
    \        append=\"root=LABEL=/\"\n\nimage=/boot/vmlinuz-2.4.18-14-jfs\n      \
    \  label=jfs\n        read-only\n        root=/dev/hda1\n```\n\nRun the **lilo**\
    \ command to activate the new configuration:\n\n```\n# lilo\nAdded linux\nAdded\
    \ linux-up\nAdded jfs *\n```"
