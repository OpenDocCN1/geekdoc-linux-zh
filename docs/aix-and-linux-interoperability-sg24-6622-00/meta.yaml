  md: '# Example 9-15  OpenSSL encryption using base64


    ```

    # openssl enc -base64 -in redbook.bin -out base64.txt

    ```


    In Example 9-16, we encrypt the contents of the redbook.txt file using the RC2
    cipher in CBC mode and place the resulting ciphertext into redbook.bin. The salt,
    key, and initialization vector were specified and will be used to encrypt the
    plaintext. The keys are in hexadecimal.


    # Example 9-16  OpenSSL encryption using RC2


    ```

    openssl enc -rc2 -in redbook.txt -out redbook.bin -S E453A1D55B3C95AA -iv

    A61B7C8D837B7A03 -K 5A058C8D1A8C9A7E839A239B61C8A4D7

    ```


    # Public key


    Using symmetric key encryption, we have to distribute only one key to everybody
    involved in the cryptography process and it is not an easy task. In a simplistic
    way, the public key cryptographic takes care of the need to distribute keys in
    a secret manner.


    Depending on the algorithm used, public key cryptography is useful for key agreement,
    digital signing, and encryption. Three commonly used public key algorithms are
    supported by OpenSSL: Diffie-Hellman (DH), DSA (Digital Signature Algorithm),
    and RSA. These algorithms are not interchangeable. Diffie-Hellman is useful for
    key agreement, but cannot be used for digital signature or encryption. DSA is
    useful for digital signatures, but is incapable of providing key agreement or
    encryption services. RSA can be used for key agreement, digital signing, and encryption.


    Public keys are more complex than secret keys. Their strength are n the size of
    their keys, which are usually very large numbers. As a result, operations involving
    public key cryptography are slow. Most often, it is used in combination with other
    cryptographic algorithms, such as message digests and symmetric cipher.


    # Diffie-Hellman


    Diffie-Hellman is used for key agreement. Key agreement is the exchange of information
    over an insecure medium that allows each of the two parties involved in a conversation
    to compute a value that is typically used as key for a symmetric cipher. Diffie-Hellman
    cannot be used for authentication or encryption by itself, because it just provides
    secrecy. Some means of authentication for parties should be used.'
