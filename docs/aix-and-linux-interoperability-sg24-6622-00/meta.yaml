  md: 'This ssh version supports only the PAM API for authentication. Therefore, in
    order to use the sshd service, you must create /etc/pam.conf and configure PAM
    properly. We show a configuration that is suitable for authentication with the
    AIX standard security subsystem in Example 1-2 on page 5.


    If AIX applications are to use PAM authentication services through the AIX security
    mechanism by setting the SYSTEM grammar in /etc/security/user, they can choose
    the PAM service by setting the PAM_SERVICE environment variable. These AIX applications
    and services set the PAM_SERVICE variables: ftp, login, passwd, rexec, rlogin,
    rsh, su, and telnet. If the service is not present in /etc/pam.conf, the PAM service
    that will be used is OTHER.


    # Compiling PAM applications on AIX


    AIX 5L Version 5.2 includes complete support for development of PAM applications.
    As a proof of concept, we compile and run a small PAM helper program whose purpose
    is to enable PAM authentication for the squid Web caching server. The author of
    the program is Henrik Nordstrom, and the helper source code and some documentation
    are available at this site:


    http://squid.sourceforge.net/hno/software.html


    The source code consists of a single source file in pam_auth.c. We download the
    file and produce an executable image:


    ```

    $ wget http://squid.sourceforge.net/hno/pam_auth-2.0.c

    $ gcc -o squid-pamauth pam_auth-2.0.c -lpam

    $ ls -l squid-pamauth

    -rwxr-xr-x  1 joe staff      250945 Nov 06 14:27 squid-pamauth

    ```


    The default PAM service used by this helper is squid and it supports auth and
    account PAM phases. Therefore, we place the following two lines in /etc/pam.conf:


    ```

    squid   auth    required        /usr/lib/security/pam_ldap.so

    squid   account required        /usr/lib/security/pam_ldap.so

    ```


    The interface to the squid server is very simple: Squid will invoke the squid-pamauth
    program and pass a user name and a password on the standard input separated by
    space. Hence, we can easily determine whether the PAM program works correctly:


    ```

    $ ./squid-pamauth

    joe catchme

    ERR

    catch me joe

    ERR

    joe secret

    OK

    ```'
