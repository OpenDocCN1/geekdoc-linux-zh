    # 11.3  Configuring Directory-Enabled (LDAP) System V printing on AIX


    LDAP provides a specialized database (directory) that is suited to the read-many,
    write-seldom model. The IBM directory is an LDAP directory server. Using the IBM
    Directory, we can have a centralized storage of print information from where we
    can share print, print queues, and system information in a client-server environment.
    In order to achieve this centralized storage of print information, we can use
    the AIX (Version 5.2.0) Print V subsystem.


    The **mkprtldap** command configures IBM Directory as a server containing System
    V print information, and one or more clients that use the IBM Directory (LDAP)
    for print information.


    Refer to the “Configuring Director-Enabled (LDAP) System V Print on AIX” section
    in the *AIX 5L Version 5.2 Guide to Printers and Printing* for more details.


    We provide an overview of the procedure to manage the System V print subsystem
    using information stored in the LDAP directory:


    +   1. Install the IBM Directory Server if it is not installed already. For information
    on how to install IBM Directory Server, refer to the documentation provided with
    the IBM Directory product.'
  merge: -1
  pgno: 286
- img_proc: false
  md: '2. Configure the IBM Directory to store System V information using the `mkprtlldap`
    command. The syntax is:


    ```

    mkprtlldap -s -a AdminDN -p Adminpasswd -w ACLBindPasswd [-f] [-d node DN]

    ```


    Most of the options are self-explanatory. The -f option is used to force the creation
    of print subtree when one or more AIX information trees already exist on the AIX
    directory. Refer to the AIX documentation for all the server options.


    3. Set up the System V print information tree. System V print information is stored
    under the print subtree, which in turn is stored under a default AIX Information
    tree (cn=aixdata) on the directory. It is recommended to store the print information
    in the default location on the directory. For a detailed setup and example, refer
    to the AIX documentation.


    4. You should configure the client that uses the IBM Directory Server for access
    to System V printing on AIX:


    +   a. Install the IBM Directory client software on the system to be used as the
    client.


    +   b. You can use the `mkprtlldap` command with the following syntax:


    ```

    mkprtlldap -c -h DirectoryServerHostname -w ACLBindPasswd [ -d PrintBindDN ] [-U]

    ```


    The -c option specifies the client action.


    This command makes, creates, or modifies the client files /etc/ldapsvc/server.print
    and /etc/ldapsvc/system.print.


    This sets up the System V print services on server and client to read the print
    information from the IBM Directory (LDAP).


    It is also possible to store printer information on the OpenLDAP server and access
    that information to generate printcap or qconfig printer configuration files on
    printer clients using a programming language like Perl. There is a book titled
    *Network Printing* by Radermacher, et al., which can be found at http://www.oreilly.com/catalog/netprint/,
    which has detailed information about sharing printer information using OpenLDAP.
    This book is also an excellent reference material for printing.'
  merge: -1
