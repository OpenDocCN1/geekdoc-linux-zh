- img_proc: false
  md: '# # 12.1 Linux on a logical partition (LPAR)


    Logical partitioning was originally supported for IBM @server zSeries and iSeries™
    systems, allowing the division of a single server into several completely independent
    and individual "virtual" servers or partitions. In 2001, IBM announced the first
    IBM @server pSeries POWER4-based server with LPAR capability.


    The IBM @server pSeries 690 introduced several advanced technologies. Its logical
    partitioning capability offers true flexibility when selecting resources for partitions,
    and its dynamic logical partitioning (DLPAR on AIX 5L Version 5.2) allows to move
    resources non-disruptively between logical partitions. Each logical partition
    is independent of the operations occurring within other partitions and can run
    its own version of the operating system or a different one, either AIX 5L or Linux,
    to accommodate multiple application requirements. The IBM @server pSeries 690
    is the first enterprise UNIX server capable of running Linux in a logical partition.


    As seen in Figure 12-1, the LPAR technology is mostly used in an environment with
    a server consolidation requirement. Server consolidation enables customers to
    run different operating systems (AIX or Linux), application code levels, and workloads
    (for example, OLTP, Web servers, and databases) while using varied resource configurations.


    ![](bbox=[0.27, 0.52, 0.71, 0.8])


    AIX and Linux can run concurrently in separate partitions on an LPAR-enabled system.
    This enables separate physical servers to consolidate their workloads on a single
    system.'
  merge: -1
  pgno: 289
- img_proc: false
  md: 'Here are the benefits of using LPAR for server consolidation:


    +   - Reduce costs


    With server consolidation, you can achieve reduced total cost of ownership and
    lower costs of computing. This setup is ideal for consolidating small to medium
    scale infrastructures. It also caters to smaller server consolidation, because
    of its partition flexibility with the minimum of 1 processor and 1 GB requirement.
    Therefore, the use of resources is more efficient.


    It reduces costs not only on the server itself, but also for power, cooling, floor
    space, and software licenses.


    +   - Fewer systems reduce systems management requirements


    Moving the functions of several servers to one physical system will result in
    a more economical system that is easier to operate and less complex to manage.
    In effect, you get less floor space, less servers to manage, and less skills needed
    to administer the system.


    +   - Better workload management flexibility


    Keeping track of your system''s resources is a vital task in working with a multiple
    partitioned server. The IBM Hardware Management Console (HMC) for pSeries is included
    with the p690 system, as shown in Figure 12-2 on page 274. The HMC is the central
    point for system management of the logical partitions. It performs several functions,
    including creating and maintaining partitions, shared resources, and power control
    over partitions, as well as the managed system, and providing virtual terminals
    for working within partitions. It also monitors and stores hardware changes while
    serving as a focal point for system administration on the p690.'
  merge: -1
  pgno: 290
- img_proc: false
  md: '![](bbox=[0.269, 0.087, 0.81, 0.503])


    Figure 12-2  Workload Management through HMC


    # When to use Linux on an LPAR


    Looking at Figure 12-3 on page 275 as an example, a typical service provider with
    a Web hosting environment can have several front-end severs to handle proxy, DNS,
    and firewall. They may also have small systems that run as Web application servers
    and a UNIX server that serves as their database. Using LPAR, it is possible to
    consolidate some of these servers on a single physical system by allocating several
    Linux instances on the logical partitions, and the remaining capacity can be devoted
    to AIX instances for the databases for scalability and performance. You can also
    provide small partitions to be used for testing new versions of applications and
    operating systems (AIX or Linux) while the production environment continues to
    run. This eliminates the need for additional servers dedicated to testing, and
    provides more confidence that the test versions will migrate smoothly into production,
    because they are tested on the same hardware system.'
  merge: -1
  pgno: 291
- img_proc: false
  md: '![](bbox=[0.26, 0.07, 0.81, 0.45])


    Figure 12-3 AIX and Linux on an LPAR


    Some scenarios to consider for the logical partitions:


    +   - Linux is a good candidate to host Web serving, networking, directory and
    security management, file/print serving, proxy/caching, and firewalls. These applications
    take advantage of Linux’s strength, excellent networking and web serving capabilities,
    and single application environments.

    - Linux is also be a good candidate for mail servers, instant messaging, and groupware
    functionality. Linux has unique features that are well suited for networking support,
    directory management and security, and large file systems support.

    - Linux has the storage support capabilities to handle database and data warehouse
    requirements. However, if performance and response time is a factor, then AIX
    should be considered for these type of applications.

    - AIX better handles transaction environments and core application environments
    that require large amount of storage, as well as outages that are big impact to
    the business.'
  merge: -1
  pgno: 292
