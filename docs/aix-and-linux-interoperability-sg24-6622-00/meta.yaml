  md: "principals that are running on a particular host should be stored there. For\
    \ this purpose run the script that we show in Example 3-8 on every host.\n\n#\
    \ Example 3-8  Generating service principals and the host key table\n\n```\nR=WEEORG.COM\n\
    CACHE=my.cache\nADM=admin/admin\nHOST=`hostname`\nSERVICES=\"host ftp\"\nkinit\
    \ -c $CACHE -S kadmin/admin $ADM\nfor s in $SERVICES; do\n    s=$s/$HOST\n   \
    \ if kadmin -c $CACHE -p $ADM -q \"getprinc s@$R\" 2>/dev/null |\n        grep\
    \ -qws $s\n    then\n        echo \"WARNING: principal s@$R already exists\"\n\
    \    else\n        kadmin -c $CACHE -p $ADM -q \"addprinc -randkey s/$R\"\n  \
    \  fi\n    kadmin -c $CACHE -p $ADM -q \"ktadd s/$R\"\ndone\n```\n\nWe need to\
    \ generate the krb5.conf file on the slave server. We just copy the file from\
    \ the master server and edit it to remove unnecessary tags. Alternatively, you\
    \ may take Example 3-1 on page 55 as a template.\n\nBefore starting the slave\
    \ server the database must exist there. We now set up the Kerberos propagation\
    \ to transfer the database from the master server. Slave KDC servers run the kpropd\
    \ daemon to receive the database from the master server. The kpropd server has\
    \ a simple ACL file to control access. This file contains a list of principals\
    \ that will be sending the database. This is typically just the master server:\
    \ host/r-aix.weeorg.com@WEEORG.COM. The file is named kpropd.acl and its location\
    \ depends on the local setup. On Linux Red Hat, it is /var/kerberos/krb5kdc/kpropd.acl.\
    \ One usually runs the kpropd daemon using the inetd Internet superserver. There\
    \ is not much difference if we run it as a stand-alone daemon, so we just use\
    \ the startup script provided with the Red Hat Linux distribution:\n\n```\n# service\
    \ kprop start\nStarting Kerberos 5 Propagation Server:                    [  OK\
    \  ]\n```\n\nWe now create a simple custom script, which will run on the master\
    \ server, to propagate the database now and then (see Example 3-9 on page 77).\
    \ This script should be run as a cron job at least once an hour. We also use it\
    \ to propagate the database manually. Note that if it produces no output, the\
    \ database has been successfully transferred to the slave servers."
