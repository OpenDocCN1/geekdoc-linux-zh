  md: "# NFS\n\nThis chapter introduces the Sun Network File System (NFS) as one of\
    \ the ways to share files between AIX and Linux systems. Using NFS, it is possible\
    \ to mount a disk partition on a remote machine and access it as if it were on\
    \ a local hard drive.\n\nThe topics covered in this chapter are:\n\n+   - What\
    \ NFS is\n- Installing NFS on AIX\n- Installing NFS on Linux\n- Configuring an\
    \ NFS server on AIX and an NFS client on Linux\n  - Configuring an NFS server\
    \ on AIX\n  - Configuring an NFS client on Linux\n- Configuring an NFS server\
    \ on Linux and an NFS client on AIX\n  - Configuring an NFS server on Linux\n\
    \  - Configuring an NFS client on AIX\n- Other NFS topics\n  - NFS automount\n\
    \  - User and group ID mappings\n  - Access Control Lists\n  - NFS locking"
