- img_proc: false
  md: "# 4.1 Protocols\n\nProtocols define how information is delivered, how it is\
    \ enclosed to reach its destination safely, and what path it follows. Protocols\
    \ also coordinate the flow of messages and their acknowledgments.\n\nProtocols\
    \ exist at different levels within the kernel. They can be manipulated through\
    \ the Application Programming Interface (API) level commands, for example, **no**\
    \ and **nfso**, on the AIX operating system. The choices a user makes when invoking\
    \ file transfer, remote login, or terminal emulation programs define the protocols\
    \ used in the execution of those programs.\n\n# 4.1.1 Domain Name System (DNS)\n\
    \nAlthough 32-bit Internet addresses provide machines with an efficient means\
    \ of identifying the source and destination of data sent across a network, users\
    \ prefer meaningful, easily remembered names. Transmission Control Protocol/Internet\
    \ Protocol (TCP/IP) implementations of a BSD origin provide for a name to address\
    \ resolution and vice versa through the well known resolver library interface.\
    \ The flat organizations are supported with the /etc/hosts system map, whereas\
    \ the DNS serves the hierarchical namespace.\n\nThe Domain Name System (DNS) uses\
    \ delegated authority in a hierarchical context used by TCP/IP applications to\
    \ map between host names and IP addresses. Each site maintains its own database\
    \ of information and runs a server program that other systems across the network\
    \ can query. The domain name hierarchy provides the assignment of symbolic names\
    \ to networks and hosts that are meaningful and easier to remember. The DNS provides\
    \ the protocol that allows clients and servers to communicate with each other.\
    \ So, instead of each machine on the network keeping a file containing the name-to-address\
    \ mapping for all other hosts on the network, one or more hosts are selected to\
    \ function as name servers. These name servers translate (resolve) symbolic names\
    \ assigned to networks and hosts into the efficient Internet addresses used by\
    \ machines.\n\n# Configuring DNS setup\n\nBefore you configure a name server,\
    \ decide which type or types best fit the network it will serve. Here are some\
    \ of the types of name servers:\n\n+   - Master name server\n    A server that\
    \ stores the database containing name-to-address mapping information. It loads\
    \ its data from a file and delegates authority to other servers in its domain."
  merge: -1
  pgno: 103
- img_proc: false
  md: "+   - Slave name server or stub name server\n  A slave name server is a delegated\
    \ authority. It receives its domain data files directly from a primary master\
    \ server at system startup time for a given zone of authority and then periodically\
    \ asks the master server to update its information.\n- Hint name server\n  A server\
    \ that is not authoritative for any domain. It responds to requests to resolve\
    \ names by querying other servers that have the authority to provide the information\
    \ needed. All servers are caching servers. This means that the server caches the\
    \ information that it receives for use until the data expires.\n\n> **Note:**\
    \ Previous generations of the named name server specified the master name server\
    \ as the primary name server, the slave name server as the secondary name server,\
    \ and the hint name server as the caching-only name server. Any reference to the\
    \ named.conf file in this documentation is specific to AIX 4.3.2 and later versions.\n\
    \nKeep in mind that a name server can function in different capacities for different\
    \ zones of authority. For example, one name server host can be a master name server\
    \ for one zone and a slave name server for another zone.\n\n# Implementation example\n\
    \nNow lets define our own DNS and domain setup. We're going to make the domain\
    \ demo.com and define machines in it.\n\nWe have a 192.168.5/24 network that consists\
    \ of the following setup:\n\n+   - master.demo.com, an AIX system that serves\
    \ as the master name server for the demo.com network 192.168.5.4 using Bind Version\
    \ 9.\n- slave.demo.com, a Linux system that serves as a slave name server for\
    \ the demo.com network 192.168.5.5 using Bind Version 9.\n- aix.demo.com, an AIX\
    \ host machine, 192.168.5.10\n\n> **Note:** Not all characters are allowed in\
    \ host names. Host names are restricted to the characters of the English alphabet\
    \ (a-z), numbers (0-9), and the character “-” (dash). Upper and lower case characters\
    \ are treated the same for DNS."
  merge: -1
  pgno: 104
- img_proc: false
  md: "# Configuring the master name server (AIX system)\n\nTo configure the master\
    \ name server, use the following procedure:\n\n+   1. Edit the /etc/named.conf\
    \ file.\n\nThis file is read each time the named daemon starts. It tells the server\
    \ which type of server it is, the zone or zones for which it is responsible, and\
    \ where to get its initial information.\n\n+   a. To use paths relative to a specified\
    \ directory, we use the options configuration clause to specify the directory\
    \ where the named data files are located (in this case, /usr/local/domain) and\
    \ other attributes that we needed for this setup.\n\n```\noptions {\n    directory\
    \ \"/usr/local/domain\";\n    allow-query { 192.168.5.24; 127.0.0.1; };\n    allow-transfer\
    \ { 192.168.5.5; };\n    transfer-format many-answers;\n};\n```\n\nIn the allow-query\
    \ line, we added the IP addresses in the network to allow it to make DNS queries\
    \ to the server.\n\nIn the allow-transfer line, we added the slave name sever\
    \ (192.168.5.5) to allow it to receive zone transfers from the server. You must\
    \ ensure that only real slave name servers are allowed to transfer zones from\
    \ the master name server. This is one of the security features of BIND.\n\nThe\
    \ transfer-format specifies the way outbound zone transfers are formatted. The\
    \ many-answers value means fit as many RRs into each DNS message as possible.\n\
    \n+   b. To allow record data to be cached outside of defined zones (optional),\
    \ specify the name of the hint zone file:\n\n```\nzone \".\" in {\n    type hint;\n\
    \    file \"/etc/named.ca\";\n};\n```\n\n> Note: The type hint declaration does\
    \ not refer to the Hint name server.\nWhen the server starts up, it uses the root\
    \ hints to find the root\nnameserver and get the most recent list of root nameservers.\n\
    \n+   c. To configure the server as the master for a zone, we specify each zone\
    \ (both domain and reverse zones) and its domain data file.\n\n```\nzone \"demo.com\"\
    \ in {\n    type master;\n    file \"demo.com\";\n```"
  merge: -1
  pgno: 105
- img_proc: false
  md: "```\n};\nzone \"5.168.192.in-addr.arpa\" in {\n    type master;\n    file \"\
    5.168.192.in-addr.arpa\";\n};\n```\n\nd. The PTR record for localhost is also\
    \ required:\n\n```\nzone \"0.0.127.in-addr.arpa\" in {\n    type master;\n   \
    \ file \"/etc/named.local\";\n};\n```\n\n+   2. Edit the /etc/named.local file.\n\
    \   a. Specify the start of authority (SOA) of the zone and the default time-to-live\
    \ information:\n\n```\n$TTL 345600\n@       IN      SOA     master.demo.com. root.master.demo.com.\
    \ (\n                    20021030        ;serial\n                    3600   \
    \         ;refresh\n                    600             ;retry\n             \
    \       3600000         ;expire\n                    86400 )         ;minimum\n\
    ```\n\n+      b. Specify the name server (NS) record:\n\n```\n        IN     \
    \ NS      master.demo.com.\n```\n\n+      c. Specify the pointer (PTR) record:\n\
    \n```\n1       IN      PTR     localhost.\n```\n\n+   3. Edit the domain data\
    \ file (/usr/local/domain/demo.com file).\n\nFor /usr/local/domain/demo.com, use\
    \ the following procedures:\n\n   a. Specify the start of authority of the zone\
    \ and the default time-to-live information for the zone. This record designates\
    \ the start of a zone. Only one start of authority record per zone is allowed.\n\
    \n```\n$TTL 345600\n@               IN      SOA     master.demo.com. root.master.demo.com.\
    \ (\n                            20021030        ;serial\n                   \
    \         3600            ;refresh\n                            600          \
    \   ;retry\n                            3600000         ;expire\n            \
    \                86400)          ;minimum\n```\n\n+      b. Include name server\
    \ records for all master and slave name servers in the zone:\n\n```\n        \
    \        IN      NS      master.demo.com.\n                IN      NS      slave.demo.com.\n\
    ```"
  merge: -1
  pgno: 106
- img_proc: false
  md: "+   c. Include name-to-address resolution information on all hosts in the name\
    \ server zone of authority:\n\n```\nlocalhost\tIN\tA\t127.0.0.1\nmaster\t\tIN\t\
    A\t192.168.5.4\nslave\t\tIN\tA\t192.168.5.5\naix\t\tIN\tA\t192.168.5.10\n```\n\
    \n+   4. Edit the reverse zone file (/usr/local/domain 5.168.192.in-addr.arpa).\n\
    \   a. Specify the start of authority of the zone and the default time-to-live\
    \ information for the zone. This record designates the start of a zone.\n\n```\n\
    @\t\tIN\tSOA\tmaster.demo.com. root.master.demo.com. (\n\t\t\t\t\t\t20021030 \
    \ ;serial\n\t\t\t\t\t\t3600\t  ;refresh\n\t\t\t\t\t\t600\t  ;retry\n\t\t\t\t\t\
    \t3600000   ;expire\n\t\t\t\t\t\t86400)    ;minimum\n```\n\n+   b. Include name\
    \ server records for all master and slave name servers in the zone:\n\n```\n\t\
    \t\tIN\tNS\tmaster.demo.com.\n\t\t\tIN\tNS\tslave.demo.com.\n```\n\n+   c. Include\
    \ address-to-name resolution information on all hosts in the name server's zone\
    \ of authority:\n\n```\n4\t\t\tIN\tPTR\tmaster.demo.com.\n5\t\t\tIN\tPTR\tslave.demo.com.\n\
    10\t\t\tIN\tPTR\taix.demo.com.\n```\n\n+   5. Create an /etc/resolv.conf file.\n\
    \nThe presence of this file indicates that the host should use a name server,\
    \ not the /etc/hosts file, for name resolution. This file must exist on a name\
    \ server host and can contain the local host address, the loopback address (127.0.0.1),\
    \ or be empty. In this case:\n\n```\nnameserver 127.0.0.1\ndomain demo.com\n```\n\
    \nThe 127.0.0.1 address is the loopback address, which causes the host to access\
    \ itself as the name server.\n\n+   6. Run the named daemon.\n\nInitialize the\
    \ named daemon by using **smit stnamed** or through the command line with:\n\n\
    ```\n# startsrc -s named\n```"
