    shadowExpire $ shadowFlag $ description ) )

    ```


    ```

    ( nisSchema.2.2 NAME ''posixGroup'' SUP top STRUCTURAL

    DESC ''Abstraction of a group of accounts''

    MUST ( cn $ gidNumber )

    MAY ( userPassword $ memberUid $ description ) )

    ```


    # Example 2-2 User LDIF entry


    ```

    dn: uid=joe,ou=People,dc=weeorg,dc=com

    uid: joe

    cn: Joe R. User

    objectClass: posixAccount

    objectClass: shadowAccount

    objectClass: top

    userPassword: {crypt}h/WA58b9dz5nI

    loginShell: /bin/ksh

    uidNumber: 1000

    gidNumber: 100

    homeDirectory: /home/users/joe

    gecos: Joe R. User

    shadowLastChange: 11627

    shadowMax: 99999

    shadowWarning: 7

    ```


    # 2.2 Planning for LDAP authentication


    We suppose that everybody is already used to vendors implementing services in
    their own way even though the service itself may be described by a standard endorsed
    by everybody in the industry. It is important to check out all the options available
    and see how they relate to each other. Deploying LDAP is not an exception. Therefore,
    we examine many solutions for LDAP authentication on both AIX and Linux.


    We need an LDAP server to offer access to the identification and authentication
    data and to keep it in good shape. We also need an LDAP client that will be sufficiently
    integrated into the operating system to be able to take over the identification
    and authentication tasks. We need a thing or two more, such as implementing the
    security policy and encrypting the communication (we discuss these matters later
    in this chapter).


    AIX 5L Version 5.2 is delivered with both an LDAP server (IBM Directory Server)
    and an LDAP client. Of course, coming from the same vendor, these two cooperate
    nicely. If you are running an AIX-only shop and you plan to stick to it, this
    is probably the optimal solution. With the recently included support for PAM,'
  merge: -1
  pgno: 36
- img_proc: false
  md: "the AIX LDAP authentication module is not the only option, but it is the only\
    \ way to preserve the full set of user attributes from the standard AIX security\
    \ subsystem.\n\nTo authenticate to LDAP, Linux uses a PAM LDAP module. The most\
    \ popular is an open source product from PADL (see http://www.padl.com/). They\
    \ developed the Name Service Switch (NSS) module for LDAP as well, thereby offering\
    \ a complete solution for the LDAP client side. The NSS LDAP module runs on AIX\
    \ too.\n\nAs for an LDAP server, there is the OpenLDAP directory server. It is\
    \ also open source and well supported on Linux. As Linux's role in corporate environments\
    \ has become more important, so has the number of different LDAP servers running\
    \ on it. Almost all commercial LDAP servers support Linux today. IBM Directory\
    \ Server also runs on Linux and, though not open source, it can be deployed free\
    \ of charge.\n\nThe PAM LDAP client on Linux supports the RFC2307 standard. AIX\
    \ 5L Version 5.2 LDAP authentication features mapping between AIX attributes and\
    \ RFC2307, so Linux and AIX LDAP client can share the same data.\n\n# 2.3 LDAP\
    \ servers\n\n+   Many LDAP servers are available on the market. Most of them should\
    \ be pretty stable, as they have already undergone so many releases (and owner\
    \ changes). Here is a list of things to watch out for:\n\n*   **LDAP standards**\n\
    \    One of the reasons for choosing LDAP for directory services is that it is\
    \ based on IETF standards. Hence, you definitely want your LDAP software to follow\
    \ the RFCs, and to have LDAP Version 3 support.\n*   **Interoperability**\n  \
    \  It is preferable to run LDAP servers that are capable of talking the same language\
    \ to other LDAP servers. We do not mean LDAP here, but replication. All serious\
    \ organizations use replication with LDAP for higher availability. Also, LDIF\
    \ support is important for the directory data backup and transfer purposes.\n\
    *   **Secure Sockets Layer (SSL) and Transport Level Security (TLS) support**\n\
    \    Encrypting LDAP communication is a must for most organizations. LDAP is more\
    \ and more often used for security sensitive applications rather than as a fancy\
    \ phone book. Though all servers support SSL, beware: It is one of those notorious\
    \ standards where nobody is actually sure how it was supposed to be"
  merge: -1
  pgno: 37
- img_proc: false
  md: 'implemented. Almost all products supporting SSL has one or more oddities in
    the implementation.


    +   - Access Control


    The server must support some kind of access control. The question is how easy
    it is to administer access and how flexible is the access control system. A simple
    error in access control and suddenly your (more enterprising) users may be able
    to read data like other people''s salaries or other users''s passwords.


    +   - Security policy


    You want to make sure that your organization security policy may be implemented
    in the LDAP area too. Note that it is more convenient, logical, and sometimes
    necessary to implement the policy at the server and not on clients.


    +   - Authentication methods


    Various authentication methods can be a life saver in environments with changing
    demands. That is even more true if LDAP is to be used for authentication. You
    should look for Simple Authentication and Security Layer (SASL), Generic Security
    Service (GSS) API, and SSL (TLS) support.


    +   - Database


    You should verify if the back-end database can support the estimated amount of
    data and load. Support for transactions and database robustness are important
    for the data safety.


    +   - Development kits


    If you expect to develop LDAP applications, it may be a good idea to have the
    LDAP Software Development Kit (SDK) from the same vendor. LDAP API has still not
    been standardized, and, even though various vendors'' API support is similar,
    APIs may be different enough to become a serious difficulty.


    Of course, the importance of items in this list will vary depending on your actual
    needs. Furthermore, the list may not be complete, and, due to a high change rate
    in the IT industry, it will some day definitely be out of date. LDAP is still
    a relatively recent standard, so expect to see many new features. Also, new features
    may be something to beware of; try not to depend on them, simply because they
    may come and go, or become a peculiar single-vendor supported extension.


    In the next section, we take a look at a couple of LDAP servers: IBM Directory
    Server and open source OpenLDAP directory server.'
