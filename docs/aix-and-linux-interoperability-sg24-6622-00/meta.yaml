    \ program starts the seclapclntd daemon and adds an appropriate line to /etc/inittab.\n\
    \nSeveral programs are available for the seclapclntd control: start-seclapclntd,\
    \ stop-seclapclntd, restart-seclapclntd, flush-seclapclntd, and ls-seclapclntd.\
    \ The **flush** command flushes the daemon's cache, which may at times be convenient.\
    \ We show a sample output from ls-seclapclntd in Example 2-5. This output resembles\
