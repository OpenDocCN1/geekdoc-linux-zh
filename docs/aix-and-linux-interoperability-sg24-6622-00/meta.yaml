  md: '# ## Configuration


    Configuration of the IBM Directory Server is stored in /usr/ldap/etc/slapd32.conf
    with a convenient link in /etc. However, you should use a standard browser with
    support for frames for configuration and administration. Just point it to http://server/ldap/index.html
    and log in with the DN you set with ldapcfg (default is cn=root). The navigational
    area is in the frame on the left side. A sample window of the Web browser is shown
    in Figure 2-3.


    ![](bbox=[0.269, 0.233, 0.851, 0.635])


    *Figure 2-3 IBM Directory Server Web administration interface*


    # ## *Password encoding*


    In Example 2-2 on page 19, the userPassword attribute begins with the "`{crypt}`"
    string. This string denotes the password encoding format (password hash function).
    The server supports three hashes: *crypt*, *sha-1*, and *imask*. The default setting
    is imask, which is a two-way encoding function, unlike crypt and sha-1. If your
    applications require clear text passwords, this is the option you should choose.
    Otherwise, crypt or sha-1 are better choices. The latter uses a hash with more
    cryptographic strength, but the former has an advantage of being used on most
    UNIX systems. Therefore, if you are migrating users and want to keep their passwords,
    the crypt hash is probably the best choice. To change the password encoding, select
    **Settings** -> **General** and pick one of the Password encryption choices.'
  merge: -1
  pgno: 42
