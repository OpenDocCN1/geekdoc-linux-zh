    # # AIX and Linux Interoperability


    ![](bbox=[0.75, 0.07, 0.89, 0.27])


    **Effective centralized user management in AIX 5L and Linux environments**


    This IBM Redbook discusses interoperability in terms of UNIX to UNIX cross platform
    data sharing and user/system management. This redbook also demonstrates the similarities
    and differences between the AIX and Linux operating systems.


    **INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION**


    **Sharing files and printers between AIX 5L and Linux systems**


    This redbook is intended to help IT specialists who have AIX systems and Linux
    systems in their environments understand how to integrate and optimize AIX systems
    in a Linux environment and share AIX resources with Linux systems. We have focused
    our descriptions on the following areas:


    **BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE**


    **Learn interoperable networking solutions**


    +   - User management

    - Networking

    - Data sharing

    - System management

    - Security

    - Linux for IBM @server pSeries and RS/6000


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    **For more information:**

    **ibm.com/redbooks**


    SG24-6622-00


    ISBN 0738426822'
