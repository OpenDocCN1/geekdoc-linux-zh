    # RSA


    RSA is the most popular public key algorithm in use. It is named after its creators,
    Ron Rivest, Adi Shamir, and Leonard Adleman. One of the reasons RSA is so popular
    is that it provides authentication, secrecy and encryption all in one package.


    RSA, unlike Diffie-Hellman and DAS, does not require parameters to be generated
    before keys can be generated, which reduces the amount of work that is necessary
    to generate keys, and authenticate and encrypt communications.'
