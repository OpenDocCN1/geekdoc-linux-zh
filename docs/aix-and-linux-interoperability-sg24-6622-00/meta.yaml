    Starting and stopping the Webmin server can be accomplished by using the standard
    **service** command:


    ```

    /sbin/service webmin stop

    /sbin/service webmin start

    ```


    You can also use the standard Webmin stop and start scripts located in the Webmin
    /etc directory; for Linux and AIX, it is /etc/webmin:


    ```

    /etc/webmin/stop

    /etc/webmin/start

    ```


    **10.3.4 Logging in to Webmin**


