- img_proc: false
  md: 'The master map file is generally created as /etc/auto.master and has the following
    format:

    Directorypath Automountmapname

    For example,

    /home/home /etc/auto.home

    This indicates that you should use the /etc/auto.home map to access /home/home
    directory.


    +   3. Create the map files on the NFS client.


    The map files are generally in the form auto.mapname, for example, /etc/auto.home
    or /etc/auto.direct. The format for the map files is:

    `subdirectory [-mount options] server:/directory`


    Where subdirectory is under the mount directory. For example, if /etc/auto.home
    contains an entry similar to:

    `borg -rw,hard,intr nfs_server:/home/borg`


    it means that /home/borg from nfs_server is to be automounted on /home/home/borg.


    +   4. If Network Information Service (NIS) is to be used for configuring the
    automount maps, integrate the maps with NIS.


    You have to set up NIS on AIX and Linux. The NIS server can be either on Linux
    or AIX. Note that NIS server or client is independent of the NFS server and client
    and is only used for maps.


    Refer to the "NIS Automount" section in the *AIX 5L Version 5.2 Network Information
    Services (NIS and NIS+) Guide*, for details about NIS mappings. Refer the Linux
    NIS HOWTO for information on setting up NIS on Linux, found at:


    http://www.linux-nis.org/nis-howto/


    +   5. Start automounter from the NFS client.


    On AIX, automount is started by running `/usr/sbin/automount` or from SMIT by
    running the `smit mkautomnt` fast path. Run `man automount` for more details.


    > **Note:** On AIX 5L Version 5.2.0, automount uses the TCP protocol by default.
    The NFS server on Linux, on the other hand, is listening on a UDP port. Hence,
    when using the `automount` command on AIX 5L Version 5.2.0, the automount map
    files should have proto=udp in the mount options. For example, the /etc/auto.home
    file on AIX (NFS client) should be:

    `borg -rw,hard,intr,proto=udp 10.3.5.23:/home/borg`'
