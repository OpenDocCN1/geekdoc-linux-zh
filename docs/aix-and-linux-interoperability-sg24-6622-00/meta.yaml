    objectclass=top

    krbrealmname-v2=WEEORG.COM

    krbprincsubtree=krbrealmname-V2=WEEORG.COM,dc=weeorg,dc=com

    ```


    The krbDeleteType attribute governs how Kerberos objects are removed from the
    LDAP directory or, more precisely, to which extent they are removed. This schema
    and, accordingly, the data it supports is shared with the Distributed Computing
    Environment (DCE). If that is the case, find out what is the proper setting in
    the AIX 5L Version 5.2 NAS Administrator''s and User''s Guide for AIX, which can
    be found in the /usr/lpp/krb5/doc/pdf/en_US/ADMINGD/ADMINGD.PDF file, so that
    the two packages do not conflict. Otherwise, if NAS is the sole user of data in
    LDAP, you should set it to 4, or it will cause complications by leaving old principal
    containers around.


    The LDAP server is ready now. As you can see, there are two objects of class container
    that will “hold” all Kerberos data.


    # User principals


    The previously described Kerberos tree is sufficient to store all principals.
    However, if there are already users defined in LDAP, as we describe in Chapter
    2, “Centralized user management” on page 15, it may be beneficial to store the
    principal data along with the other user information. The LDAP entry, which is
    the parent of the users'' entries, must be the Kerberos principal sub tree. The
    krbPrincSubtree attribute may contain multiple values, so we simply add another
    value containing the DN of the parent. Continuing our example from Chapter 2,
    “Centralized user management” on page 15, we send the following LDIF file to the
    ldapmodify program:


    ```

    dn: krbrealmname-v2=WEEORG.COM,dc=weeorg,dc=com

    changetype: modify

    add: krbprincsubtree

    krbprincsubtree: ou=people,dc=weeorg,dc=com

    ```


    The next step is to add the krbPrincipal object class to users'' entries and then
    set the krbPrincipalName attribute to user@REALM, like this:


    ```

    dn: uid=joe,ou=people,dc=weeorg,dc=com

    changetype: modify

    add: objectclass

    objectclass: krbprincipal

    -

    ```'
