  md: "Note that version numbers may change in the future. Installation is simple;\
    \ after you obtain the packages, just use the rpm program:\n\n```\n# rpm -i cyrus-sasl-gssapi-2.1.7-2.i386.rpm\
    \ krb5-libs-1.2.5-6.i386.rpm \\\n    krb5-server-1.2.5-6.i386.rpm krb5-workstation-1.2.5-6.i386.rpm\
    \ \\\n    pam_krb5-1.56-1.i386.rpm\n```\n\n# 3.5.2 Configuring Kerberos on Linux\n\
    \nLinux distributions typically do not include any kind of configuration application\
    \ for Kerberos, Red Hat Linux notwithstanding. Being the standard Kerberos implementation,\
    \ you should not encounter any problems setting up a Kerberized environment. It\
    \ is enough to follow the instructions we give in 3.2, “Kerberos configuration”\
    \ on page 54.\n\n# 3.6 Discovering Kerberos services\n\nNormally, Kerberos clients\
    \ rely on the krb5.conf file to discover the Kerberos configuration. A couple\
    \ of mechanisms were recently introduced that may be used by Kerberos clients\
    \ to find out the locations of the KDC servers automatically. One is implemented\
    \ in the original Kerberos source code distribution from MIT and it makes use\
    \ of the new DNS SRV records. The other one is a part of the AIX NAS and utilizes\
    \ LDAP for this purpose.\n\nApart from the convenience of having clients automatically\
    \ look up services’ locations, this kind of Kerberos clients’ setup is also important\
    \ as a way to decouple them from the actual environment. For example, if we add\
    \ another slave Kerberos server, we just need to change the configuration in one\
    \ place, either the primary DNS server or the master LDAP server, and all the\
    \ clients will automatically learn about it.\n\n# 3.6.1 Discovering Kerberos services\
    \ using AIX NAS and LDAP\n\nIf the LDAP plug-in is configured, NAS Kerberos clients\
    \ may use LDAP to discover KDC and administration servers. Note that it is possible\
    \ to use LDAP for services discovery if NAS is configured to use the standard\
    \ (legacy) database on a local file system. The ksetup management program is used\
    \ to configure the NAS entries in the LDAP server. The following ksetup session\
    \ describes our environment:\n\n```\n# ksetup -h localhost -n cn=root -p secret\n\
    ksetup> addkdc r-kerberos.weeorg.com\nksetup> addkdc kerberos-1.weeorg.com\nksetup>\
    \ addadmin kerberos.weeorg.com\nksetup> addpwd kerberos.weeorg.com\n```"
