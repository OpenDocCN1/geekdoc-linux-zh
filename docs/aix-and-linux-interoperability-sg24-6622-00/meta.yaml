    \nThe use_first_pass flag instructs the PAM module to use the password that has\
    \ already been provided to the system. In other words, AIX prompts the user for\
    \ their name and password *before* invoking PAM. PAM modules should not interact\
    \ with users nor print any messages.\n\n# 1.4.2 PAM applications and AIX\n\nThe\
    \ new ssh package available at the IBM OSS site is a PAM enabled application.\
