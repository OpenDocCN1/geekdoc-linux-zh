  md: "![](bbox=[0.27, 0.09, 0.85, 0.52])\n\nFigure 10-16 Others category\n\n# 10.3.6\
    \ Webmin security features\n\nBecause browsers often store authentication information\
    \ and automatically resend it on demand from the Webmin server, anyone with malicious\
    \ intent can easily trigger dangerous actions on your Webmin sever. And, since\
    \ Webmin is a Web based application that can be accessed from any browser on the\
    \ network, it is possible for a remote user to get into the Webmin server easily.\n\
    \nPutting this into consideration, Webmin provides security features to prevent\
    \ this from happening and to maximize the security of your system. There are four\
    \ features/options that you can use to implement security on your Webmin server:\n\
    \n+   - Authentication\n  This feature will prevent password cracking attacks\
    \ on your server, as well as protection against \"forgetful users\". This feature\
    \ can be accessed by clicking on the **Webmin** panel and then on the **Webmin\
    \ Configuration** icon. Here, you can enable password timeouts by configuring\
    \ the allowable time delay between each failed login for the same user to a Webmin\
    \ server and at the same time log the failed login attempts to syslog. Also, you\
    \ can enable"
  merge: -1
  pgno: 268
- img_proc: false
  md: "session authentication with this feature. This will allow Webmin to track all\
    \ logged in users and automatically logs out users that have been idle for a specified\
    \ period of inactivity.\n\n+   - **Trusted referrers**\n\n  This page allows you\
    \ to configure Webmin's referrer checking support. The referrer checking support\
    \ will prevent malicious links from other Web sites from tricking your browser\
    \ into doing dangerous things with your Webmin server. It also has an option where\
    \ you can add trusted hosts or Web sites that may refer actions to your Webmin\
    \ server. To enable this feature, just click on the Webmin configuration icon\
    \ in the Webmin category panel\n\n+   - **SSL encryption**\n\n  This feature will\
    \ increase the security of your system by sending user and password information\
    \ in encrypted form. This feature will require OpenSSL libraries and the Net::SSLeay\
    \ Perl module be installed. After installing the needed library and module, the\
    \ SSL encryption icon will be added in the Webmin configuration section in the\
    \ Webmin configuration panel. More information about this feature and a setup\
    \ howto can be found at the following URL:\n\n  [http://www.webmin.com/ssl.html](http://www.webmin.com/ssl.html)\n\
    \n+   - **Using certificate authority**\n\n  If you were able to setup the SSL\
    \ encryption, you can configure SSL certificates for Webmin servers. This will\
    \ allow user logins to your Webmin server without a user name and password. From\
    \ the Webmin Users module, clients can request a personal certificate and be able\
    \ to authenticate themselves, using that certificate, through the browser. Although\
    \ this feature is simpler to implement than the usual user name and password logons,\
    \ there is a potential security issue here: Any user who has access to a client's\
    \ machine that has a valid certificate can access the Webmin server with the same\
    \ privileges as the real user. The auto-logout feature of Webmin will not address\
    \ this issue because authentication is done automatically every time the user\
    \ starts a browser session."
