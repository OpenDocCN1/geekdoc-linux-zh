  md: '# # Using OpenSSL


    Now we will cover some uses for OpenSSL.


    # # Message Digest Algorithms


    Message Digest Algorithms are cryptographic hash functions, also known as Message
    Digest Algorithms, which can be used for computing a block of data. OpenSSL supports
    MD2, MD4, MD5, MDC2, SHA1, and RIPEMD-160. SHA1 and RIPEMD-160 produce 160-bit
    hashes, and the others all produce 128-bit hashes.


    You can use the most supported algorithms by using the command line. The **dgst**
    command is the main command for accessing message digests, but you can access
    the others algorithms using a command line of the same name as the algorithm.
    There is an exception for RIPEMD-160 that is named rmd160.


    Computing a hash for a block of data is the default operation performed by the
    message digest commands.


    The message hashes commands can also be used for signing and verifying signatures.
    When signing, a signature is generated for the hash of the file to be signed.
    A private key is required to sign, and RSA and DSA keys can be used. When you
    used a DSA private key, you must use the DSS1 message digest. With the RSA key,
    you can use any other algorithm. Verifying a signature is simply the reverse of
    signing.


    The basic usage for the message digest command is simple:


    ```

    # openssl dgst -<digest> file

    ```


    where the <digest> is md5, md4, md2, sha1, sha, mdc2, ripemd160, and dss1. Example
    9-10 shows the hash of a file called redbook.txt.


    # *Example 9-10 OpenSSL digest modes*


    ```

    bash-2.05a# openssl dgst -md5 redbook.txt

    MD5(redbook.txt)= 7969c5b2225628c612908bf85cdb74eb

    bash-2.05a# openssl dgst -md4 redbook.txt

    MD4(redbook.txt)= ff93512641346e7a8e3e7527ebd2a80e

    bash-2.05a# openssl dgst -md2 redbook.txt

    MD2(redbook.txt)= 71836005e1bb637328b92ea9327534f0

    bash-2.05a# openssl dgst -sha1 redbook.txt

    SHA1(redbook.txt)= 6c4b875a5fc9d2b7b21e031c88e74739225e33a7

    bash-2.05a# openssl dgst -sha redbook.txt

    SHA(redbook.txt)= f4e09a291e756ae46b2d47102ed8b39343265608

    bash-2.05a# openssl dgst -mdc2 redbook.txt

    MDC2(redbook.txt)= 49ad048d8ab46ef70f744f60ed50535e

    bash-2.05a# openssl dgst -ripemd160 redbook.txt

    ```'
