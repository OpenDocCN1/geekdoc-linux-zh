  md: "The -A option will instruct the script to create a new administration principal\
    \ root/hostname, such as root/marguerite.weeorg.com. This principal should have\
    \ administrative rights, so you should have the following line in kad5.acl:\n\n\
    ```\nroot/*@WEEORG.COM           *\n```\n\nThe mkkrb5clnt script configures a\
    \ new method in /usr/lib/security/methods.cfg:\n\n```\nKRB5LDAP:\n    options\
    \ = db=LDAP,auth=KRB5\n```\n\nAll users authenticating through Kerberos should\
    \ have KRB5LDAP specified for the SYSTEM and registry attributes in /etc/security/user.\
    \ The mkseckrb5 script takes care of that task for the existing users:\n\n```\n\
    # mkseckrb5 joe\nPlease enter the admin principal name: admin/admin\nEnter password:\n\
    Importing joe\nEnter password for principal \"joe@WEEORG.COM\":\nRe-enter password\
    \ for principal \"joe@WEEORG.COM\":\n```\n\nFor more details about the AIX and\
    \ Kerberos integration, see the *AIX 5L Differences Guide Version 5.2 Edition*,\
    \ SG24-5765.\n\n# PAM Kerberos module\n\nLike many other Linux distributions,\
    \ Red Hat Linux Version 8.0 delivers the PAM Kerberos module as part of the Kerberos\
    \ support. This module is capable of authenticating users, obtaining TGT, and\
    \ changing passwords. The Red Hat authconfig program may be used to configure\
    \ Kerberos authentication, which includes setup for both Kerberos clients and\
    \ the PAM Kerberos module:\n\n```\n# authconfig --kickstart --enablshadow --enablemd5\
    \ \\\n    --enableldap --ldapserver r-aix.weeorg.com --ldapbasedn dc=weeorg,dc=com\
    \ \\\n    --enablekrb5 --krb5realm WEEORG.COM \\\n    --krb5kdc kerberos.weeorg.com,kerberos-1.weeorg.com\
    \ \\\n    --krb5adminserver kerberos.weeorg.com\n```\n\nOne can also stack the\
    \ LDAP authentication method along with the Kerberos authentication, but we do\
    \ not recommend mixing authentication methods for security reasons. Of course,\
    \ the standard authentication method must be enabled for the sake of system users\
    \ such as root."
