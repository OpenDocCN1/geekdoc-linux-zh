    \ At the time of writing this redbook, the current FreeS/WAN Version is 1.98b.\n\
    \n# ## Installing FreeS/WAN\n\nThe steps necessary to install FreeS/WAN on Linux\
    \ are as follows:\n\n+   1. Be sure that your kernel sources are installed:\n\
    \   `# rpm -q kernel-source-2.4.18-14`\n\n+   2. If the kernel sources are not\
    \ installed, install it from the Red Hat installation CD:\n   `# rpm -ivh /mnt/cdrom/RedHat/RPMS/kernel-source-2.4.18-14.i386.rpm`\n\
    \n+   3. Get the current version of FreeS/WAN:\n   `# wget ftp://ftp.xs4all.nl/pub/crypto/freeswan/freeswan-*`\n\
    \n+   4. After that, you can check the integrity of the file using the following\
    \ command:\n   `# md5sum freeswan-1.98b.tar.gz`\n\n+   5. Compare the result with\
    \ the freeswan-1.98b.tar.gz.md5; it must be the same. The next step is to create\
    \ a symbolic link from /usr/src/linux to /usr/src/linux-2.4.18-14:\n   `# ln -s\
    \ /usr/src/linux2.4.18-14 /usr/src/linux`\n\n+   6. Before we recompile the kernel,\
    \ we need to edit the /usr/src/linux/Makefile and change the forth line from:\n\
    \   `EXTRAVERSION = -14custom`\n   to\n   `EXTRAVERSION = -14`\n\n+   7. Issue\
    \ the command:\n   `# make mrproper`\n\n+   8. Now, copy the file that corresponds\
    \ to your system from the directory /usr/src/linux/configs to /usr/src/linux/.config.\
    \ In our case:\n   `# cp /usr/src/linux/configs/kernel-2.4.18-i686.config /usr/src/linux/.config`\n\
    \n+   9. In the /usr/src/linux directory, issue the following command:\n   `#\
    \ make menuconfig`"
