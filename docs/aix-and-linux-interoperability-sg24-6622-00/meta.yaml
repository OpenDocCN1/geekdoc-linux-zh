    # ## 2.5.3 PAM and NSS LDAP modules on AIX


    The PAM LDAP module and AIX LDAP loadable authentication module authenticate users
    in very different ways. On the one hand, the PAM LDAP module authenticates users
    by trying to perform the LDAP bind operation as the given user. On the other hand,
    the AIX LDAP module (or, more precisely, the secldapclntd client side daemon)
    binds to the LDAP server as a privileged user, reads the user password, computes
    the hash of the user supplied password, and finally compares the two. The most
    significant consequence is that the AIX LDAP method requires privileged access
    to the LDAP directory. That may not always be in accord with the site''s security
    policy. That is why we discuss an alternative LDAP authentication method here.


    We show, in 1.4.1, "PAM modules and AIX" on page 9, how to compile and install
    the PAM LDAP module.


    The PAM LDAP module on AIX is accessible either directly through PAM enabled applications
    or through the AIX PAM loadable authentication module. For the former, such as
    the ssh daemon, it is sufficient to edit the /etc/pam.conf configuration file.
    The latter, however, requires appropriate settings in the /etc/security/user and
    /usr/lib/security/methods.cfg files. We illustrate the differences in authentication
    between AIX and PAM applications in Figure 2-7 on page 37.'
  merge: -1
  pgno: 53
- img_proc: false
  md: '![](bbox=[0.24, 0.06, 0.86, 0.55])


    Figure 2-7 Different authentication methods on AIX 5L Version 5.2


    In order to use PAM LDAP for ssh or any other PAM application, we have to reconfigure
    /etc/pam.conf. We show one possible configuration in Example 2-7. This configuration
    allows LDAP authentication and, if that fails, forces authentication through the
    AIX security subsystem. See the discussion about PAM in 1.2, “Pluggable Authentication
    Modules (PAM)” on page 5.


    *Example 2-7 PAM LDAP configuration on AIX*


    ```

    sshd    auth            required /usr/lib/security/pam_ldap.so use_first_pass

    sshd    account         required /usr/lib/security/pam_ldap.so

    sshd    password        required /usr/lib/security/pam_ldap.so

    sshd    session         required /usr/lib/security/pam_ldap.so

    ```


    Configuration of the PAM LDAP module itself is the same as on Linux (see Example
    2-13 on page 46).


    PAM is an authentication mechanism only, so the host still depends on local files
    for the name resolution. The NSS LDAP may be compiled as an AIX loadable module
    and installed in /usr/lib/security. Stanzas from Example 2-8 on page 38 should
    be included in /usr/lib/security/methods.cfg and referenced appropriately in /etc/security/user.
    For example, we may change the identification and authentication method for a
    user using the chuser program:


    ```

    # chuser =R files SYSTEM=PAMLDAP registry=PAMLDAP joe

    ```'
