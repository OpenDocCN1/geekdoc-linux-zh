- img_proc: false
  md: "# Example 3-9 Kerberos database replication script\n\n```\n#!/bin/sh\n#\nPATH=/usr/krb5/sbin:/usr/krb5/bin:$PATH\n\
    SLAVES=\"r-linux.weeorg.com\"\nDUMPF=/var/krb5/krb5kdc/slave_transfer\n#\nkdb5_util\
    \ dump $DUMPF\nfor h in $SLAVES; do\n    kprop -f $DUMPF $h | grep -v SUCCEEDED\n\
    done\n```\n\nWe may now start the slave Kerberos server:\n\n```\n# service krb5kdc\
    \ start\nStarting Kerberos 5 KDC:          [  OK  ]\n```\n\n# 3.7.2 Standard Kerberos\
    \ services\n\nIt is not very useful to run the Kerberos authentication system\
    \ without any user services. In a Kerberos environment, every application has\
    \ to understand the underlying protocol. Thus, we must start Kerberos enabled\
    \ application servers. The exact procedure, of course, depends on the platform.\n\
    \nThe standard AIX 5L Version 5.2 telnet, rlogin, and ftp servers include support\
    \ for Kerberos. It is only necessary to include the Kerberos authentication method:\n\
    \n```\n# chauthent -k5 -std\n```\n\nOther UNIX platforms use the inetd Internet\
    \ superserver to start these servers. Red Hat Linux Version 8.0 is furnished with\
    \ a similar superserver xinetd. The xinetd daemon keeps its configuration in files\
    \ stored in the /etc/xinetd.d directory. Every service has its own file in a stanza\
    \ format. For example, this is how the telnet service may be defined:\n\n```\n\
    # default: off\n# description: The Kerberized telnet server accepts normal telnet\
    \ sessions, \\\n#              but can also use Kerberos 5 authentication.\nservice\
    \ telnet\n{\n        flags           = REUSE\n        socket_type     = stream\n\
    \        wait            = no\n        user            = root\n        server\
    \          = /usr/kerberos/sbin/telnetd\n        log_on_failure  += USERID\n \
    \       disable         = no\n}\n```"
