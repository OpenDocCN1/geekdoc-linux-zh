    # ## Certification authority


    OpenSSL provides all the functionality required to set up a minimal CA that can
    be used in a small organization.


    In this section, we will cover how to configure a CA. The steps are the same for
    Linux and AIX.


    We must choose a location for all of our CA''s files, for example, we will use
    /opt/redbookca as the root directory for our CA. Besides the directory, we need
    to create three other files. The first file will keep the last serial number that
    was used to issue a certificate; this file is named serial. The second file is
    a database of sorts that keeps track of the certificates that have been issued
    by the CA; this file is named index.txt (see Example 9-27). The last file is the
    configuration file is openssl.cnf; we suggest a configuration file for this demo
    CA in Example 9-28 on page 215.


    # *Example 9-27 Creating a CA configuration directory and files*


    ```

    # mkdir /opt/redbookca

    # cd /opt/redbookca

    # mkdir certs private

    # chmod g-rwx,o-rwx private

    # echo ''01'' > serial

    ```'
