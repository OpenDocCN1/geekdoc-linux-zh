    # 10.2.1  Implementing a secure connection in server-client mode


    In the Web-based System Manager secure operation, the managed machines are servers,
    and the managing users are the clients. Each Web-based System Manager server has
    its private key and a certificate of its public key signed by a Certificate Authority
    (CA) that is trusted by the Web-based System Manager clients. The private key
    and the server certificate are stored in the server''s private key ring file.
    The Web-based System Manager client has a public key ring file that contains the
    certificates of the CAs that it trusts.


    To further illustrate how the Web-based System Manager Security works, let us
    set up an environment that will show this feature.'
  merge: -1
  pgno: 252
- img_proc: false
  md: 'We have a network that consists of the following setup:


    +   - An AIX system, with host name colta, which serves as the Web-based System
    Manager Certificate Authority and the server.

    - A Linux system, with host name clientA, which serves as the client.


    In this scenario, we will use a single machine, the AIX server, to define an internal
    Certificate Authority (CA) and produce ready-to-go key ring files. This task will
    generate a public key ring file that you must copy to the Linux client as well
    as a unique private key ring file for the Web-based System Manager server.


    The following steps describe how to set up this environment:


    +   1. In colta, check if the Web-based System Manager Security fileset, sysmgt.websm.security,
    is installed. This fileset is not installed by default. You can use the AIX 5L
    Expansion Pack CD and install this fileset using the `smit installp` command.


    +   2. Enable Web-based System Manager Server.

    In colta, execute the command:

    `# /usr/websm/bin/wsmserver -enable`


    +   3. Define the internal Web-based System Manager Certificate Authority.

    In colta, log in locally as the root user and start Web-based System Manager:

    `# wsm &`


    > **Note:** The security configuration applications of Web-based System Manager
    are not accessible if you are not logged in as the root user or if you are running
    Web-based System Manager in remote application or applet mode.


    Select **Management Environment** -> **colta** -> **System Manager Security**
    -> **Certificate Authority**.

    From the task list for **Certificate Authority**, select **Configure this system
    as a Web-based System Manager Certificate Authority**. When the wizard opens,
    click **Next** and fill out the following information as follows:


    a. **Certificate Authority distinguished name:** `WebSysMgr CA-1 colta`

    This should be a descriptive name that helps you identify the CA machine and the
    instance of the CA, for example, the machine''s host name plus a sequence number.
    Blanks are permitted in the name. The default CA name is `WebSysMgr CA-1 <hostname>`.'
  merge: -1
  pgno: 253
- img_proc: false
  md: '+   b. **Organization name:** redbook

    This should be a descriptive name that identifies your company or your organization.


    c. **ISO country code:** US (United States)

    This is your two-character ISO country code. You can select from the list given.


    d. Click **Next**.


    e. **Expiration date:** November 5 2004

    You can change this date or accept the default value. After the certificate expires,
    reconfigure Web-based System Manager security by redefining the CA and generating
    new private key ring files for all of your servers.


    f. Click **Next**.


    g. **Public key ring directory:** /var/websm/security/tmp

    The public key ring (SM.pubkr) containing the CA''s certificate is written to
    this directory. The default directory is /var/websm/security/tmp.


    h. Click **Next**.


    i. **Password:** passw0rd

    The CA''s private key ring file is encrypted with this password. You will need
    to enter this password each time you perform a task on this CA.


    j. Click **Next**, and then click the **Finish** button on the next window.


    From the task list for **Certificate Authority**, the status of the Certificate
