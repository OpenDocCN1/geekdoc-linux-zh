    \ Kerberos data. In particular, both read and write access to the KrbMstrKey and\
    \ KrbKey object classes should be restricted to the KDCs and the administration\
    \ server. Note that this is different from the Kerberos ACLs, which are manipulated\
    \ using the kadmin program.\n\nThe configuration script may not set all desired\
    \ options for LDAP access. For example, if you access LDAP servers in different\
    \ ways, then you must edit the /var/krb5/krb5kdc/.kdc_ldap_data configuration\
    \ file using a text editor. We show one possible configuration in Example 3-5.\
    \ Even though LDAP has a referral mechanism to deal with updates sent to replica\
    \ servers, it is better to use the replica_type tag and specify whether the server's\
    \ data may be updated. The Kerberos servers keep connections open to all specified\
    \ LDAP servers, but the preference tag governs which server is queried. The default\
    \ preferences are 4 for the master LDAP server and 5 for the slave servers.\n\n\
    Example 3-5  LDAP access configuration in /var/krb5/krb5kdc/.kdc_ldap_data\n\n\
    ```\n[ldapdefaults]\n        realm = WEEORG.COM\n        bind_dn = cn=root\n \
    \       bind_dn_pw = secret\n        ldapserver = r-aix.weeorg.com\n        ldapserver\
    \ = ldap-1.weeorg.com\n        bind_type = simple\n\n[servers]\n    r-aix.weeorg.com\
    \ = {\n            port = 389\n```"
