  md: "The share name on the server. The default is backup.\n\n+   - **-d directory**\n\
    \  Changes the initial directory before restoring/backing up files.\n- **-p password**\n\
    \  The password to access the share.\n- **-u user**\n  The user ID to connect\
    \ as; the default is the UNIX login name.\n- **-t tape**\n  The tape device. It\
    \ can also be a regular file. The default is to use the environment variable TAPE;\
    \ if it is not set, a file called tar.out is created.\n- **-r restore**\n  Files\
