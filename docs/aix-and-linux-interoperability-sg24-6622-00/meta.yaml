    a DHCP sever. By default, the DHCP server is configured by reading the /etc/dhcpsd.cnf
    file, which contains entries for logging information, options to return, machines
    to configure, and other items and information needed by the DHCP clients.


    Configuring the DHCP server is usually the hardest part of using DHCP in your
    network. First, decide what networks you want to have DHCP clients on. Each'
