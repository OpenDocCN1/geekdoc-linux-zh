  md: "```\n# installp -ac -d /dev/cd0 bos.cifs_fs\n```\n\nWhen installing the bos.cifs_fs\
    \ fileset, the following components are installed:\n\n+   - SMIT panels\n- The\
    \ /usr/lib/drivers/nsmbdd device driver\n- The /usr/lib/methods/cfgnsmb configuration\
    \ method\n- The /sbin/helpers/mount_cifs mount helper\n- The /etc/mkcifs_fs boot\
    \ time script\n\nFurthermore, the /dev/nsmb0 device is created and is always available.\
    \ At boot time, this device is created by the /etc/mkcifs_fs script.\n\n> **Note:**\
    \ SMBFS in only supported on a 32-bit kernel, so an installation on a 64-bit kernel\
    \ will fail.\n\n# ### Mounting a file system\n\nTo mount an SMBFS file system,\
    \ as with any other file system, the **mount** command should be used. For the\
    \ mount of an SMBFS file system, the following syntax is applicable:\n\n```\n\
    mount -v cifs -n Node [-o Options ] Share Directory\n```\n\nThe -v cifs option\
    \ specifies the file system as defined by the VfsName parameter in the /etc/vfs\
    \ file. Read the mount manual pages for more details.\n\nFor example, to mount\
    \ the share export on the node linux_host and connect to the share with the user\
    \ name dave and the password xyz123 under the mount point /mnt, the following\
    \ command should be used:\n\n```\n# mount -v cifs -n linux_host/dave/xyz123 /export\
    \ /mnt\n```\n\n> **Note:** The SMBFS cannot be automatically mounted with the\
    \ /etc/filesystem stanza. This limitation occurs due to the need for passwords.\n\
    \n# ### Using smbtar\n\nWe are using the **smbtar** command to make a backup of\
    \ the tmp share stored on the Linux system to the tape drive on the AIX system.\
    \ The various options of **smbtar** can be found in its the man pages. We describe\
    \ a few of those options, which we use for the backup.\n\n+   - -s server\n  -\
    \ The SMB/CIFS server that the share resides on.\n- -x service"
