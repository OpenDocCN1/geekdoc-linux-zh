  md: '![](bbox=[0.1, 0.07, 0.45, 0.35])


    3


    # # Single sign-on


    To computer users, it is only logical to prove their identity to the system once.
    It is also annoying to type your user name and password repeatedly whenever there
    is a need to use another application. And it becomes unmanageable when applications
    require different kinds of identities and authentication methods. Just take the
    Internet as an example; proliferation of services and companies wishing to know
    our names and habits would make the whole mess unusable if it were not for browsers''
    capabilities to save all these identities on our computer. Even though it is a
    poor example, that is one example of a single sign-on. The browser identifies
    us to various services, thus relieving the user from remembering numerous user
    names and passwords. We say that it is poor because our browsers and computers
    are typically poorly managed and secured, though users are not to be solely blamed.


    The single sign-on paradigm is a direct consequence of incompatible applications
    and identification methods. A fair question to ask is how we got here. The answer
    is probably somewhere between human nature, poor planning, and market pressure.
    Worse, security and authentication are often given little attention and implemented
    late and hastily in a project. Finally, a single sign-on system that supports
    all applications is very difficult, if not impossible, to get right and usually
    expensive to deploy.


    Though they sound similar, single-source sign-on, which we described in Chapter
    2, "Centralized user management" on page 15, and single sign-on (SSO) are two
    very different animals. While a migration of the environment from'
  merge: -1
  pgno: 68
- img_proc: false
  md: 'standard authentication methods to a single-source sign-on is smooth and non-intrusive,
    the single sign-on is not only an effort on the part of system administrators,
    but also on the users’ side, sometimes requiring even a user training program.
    A heavy client involvement in the SSO infrastructure and the incurred price are
    the main reasons for a very slow adoption of SSO environments.


    The idea behind single sign-on is that users prove their identity once and from
    there on their credentials are automatically forwarded to whichever application
    they want to use. There are several ways to achieve this. The one which we describe
    in this chapter is the broker-based Kerberos.


    Kerberos has a long history and it has been proven to be a solid technology. One
    weak point is that in order to join the Kerberos environment, applications must
    be Kerberized. In other words, they have to be taught Kerberos protocols. The
    standard remote access (telnet and rlogin) and file transfer (ftp) protocols are
    supported. There is optional support for encryption. Kerberos is available for
    free and runs on most platforms, including both AIX and Linux.'
  merge: -1
  pgno: 69
- img_proc: false
  md: '# 3.1  The Kerberos way


    Kerberos is a broker based single sign-on technology. This means that there is
    an authentication server running somewhere on the network maintaining a central
    storage of user credentials. There is also a specialized protocol for moving security
    information around. Both servers and clients have to know this protocol.


    The Kerberos server maintains a database of principals and corresponding passwords.
    The term *principal* is a part of the Kerberos semantics, and it may represent
    any subject involved in communication, such as a user or an application server.
    A set of principals is organized in a realm that is typically a domain name in
    uppercase letters. For example, the ftp/r-linux.weeorg.com@WEEORG.COM service
    (in other words, the ftp service running on host r-linux.weeorg.com) and user
    joe@WEEORG.COM are both principals belonging to the WEEORG.COM realm.


    Another important term to get acquainted with is *ticket*. All authentication
    in Kerberos is based on tickets. At the start of a session, a user gets a kind
    of a superticket called the Ticket Granting Ticket (TGT). A TGT is obtained from
    the Kerberos server by passing a principal name. The ticket is encrypted using
    the user''s password and only this user can decrypt it.


    In order to prevent password guessing attacks, the Kerberos server may require
    users to pre-authenticate before getting the TGT. The Kerberos server sends a
    time stamp encrypted with the user''s password and if the user can decrypt it
    and send back the time stamp, it may get the TGT in return. That is one commonly
    used pre-authentication method, but another may be employed depending on your
    needs.


    With this ticket, the user can get other tickets with which he may communicate
    with network services, such as login or ftp servers. Naturally, all this happens
    behind the stage, without any user intervention. For more details on how Kerberos
    (really) works visit:


    http://web.mit.edu/kerberos/www/


    We show here one Kerberos session:


    ```

    $ kinit

    Password for joe@WEEORG.COM:

    $ klist

    Ticket cache:  FILE:/var/krb5/security/creds/krb5cc_201

    Default principal:  joe@WEEORG.COM


    Valid starting     Expires            Service principal

    11/09/02 19:04:04  11/10/02 05:03:44  krbtgt/WEEORG.COM@WEEORG.COM

    ```'
  merge: -1
  pgno: 70
- img_proc: false
  md: "The kinit program obtains the TGT. It is good for the next 10 hours, as we\
    \ see in the output of the klist program above. There are other ways to obtain\
    \ a TGT, such as the login service: When a user logs in to their terminal, the\
    \ login program automatically obtains the ticket.\n\nNow we can use all the services\
    \ that are registered with the Kerberos server. The business of obtaining service\
    \ tickets is done by the Kerberos clients without bothering the user, as in the\
    \ following:\n\n```\n$ rlogin r-linux.weeorg.com -l joe\nLast login: Sat Nov \
    \ 9 18:57:01 from r-aix\n[joe@r-linux joe]$ exit\n\n$ telnet -l joe r-linux.weeorg.com\n\
    Trying...\nConnected to r-linux.weeorg.com.\nEscape character is '^]'.\n[ Kerberos\
    \ V5 accepts you as ``joe@WEEORG.COM'' ]\n\n    r-linux.weeorg.com (Linux release\
    \ 2.4.18-14 #1 Wed Sep 4 13:35:50 EDT 2002)\n(2)\n\nLast login: Sat Nov  9 19:04:29\
    \ from r-aix\n[joe@r-linux joe]$\n```\n\nThe exchange between the Kerberos servers,\
    \ services, and clients is done in a secure way.\n\n> **Note:** Kerberos relies\
    \ on time stamps to protect from replay attacks. Therefore, all participants in\
    \ Kerberos authentication (clients and servers) must have their clocks synchronized.\
    \ To tell the truth, a skew of five minutes is allowed, but we see no reason for\
    \ not deploying the Network Time Protocol (NTP) on the network. It is very convenient\
    \ to have clocks synchronized in many other situations.\n\n# 3.2 Kerberos configuration\n\
    \nThe Kerberized environment consists of a Kerberos Distribution Center (KDC)\
    \ and Kerberized clients. The KDC is represented by the master KDC server and\
    \ one or more slave KDC servers. It is not obligatory to install the slave servers,\
    \ but we strongly recommend having the KDC service available at all times. Another\
    \ important role in a Kerberos environment is that of the administration server.\
    \ This server is called kadmind, and it runs on the same host that keeps the master\
    \ database. Apart from offering management services, kadmind also allows for password\
    \ change requests coming from plain users."
  merge: -1
  pgno: 71
- img_proc: false
  md: "# ## 3.2.1 Kerberos configuration files\n\nAll Kerberos servers and clients\
    \ have at least one configuration file: /etc/krb5.conf. This file describes the\
    \ Kerberos environment. We give three examples in Example 3-1.\n\n> *Example 3-1\
    \ Kerberos krb5.conf configuration file*\n\n```\nServer krb5.conf:\n  [logging]\n\
    \  kdc = FILE:/var/log/krb5kdc.log\n  admin_server = FILE:/var/log/kadmind.log\n\
    \  default = FILE:/var/log/krb5libs.log\n\n  [libdefaults]\n  default_realm =\
    \ WEEORG.COM\n  ticket_lifetime = 24000\n\n  [realms]\n  WEEORG.COM = {\n   kdc\
    \ = kerberos.weeorg.com:88\n   kdc = kerberos-1.weeorg.com:88\n   admin_server\
    \ = kerberos.weeorg.com:749\n   default_domain = weeorg.com\n  }\n\n  [domain_realm]\n\
    \  .weeorg.com = WEEORG.COM\n  weeorg.com = WEEORG.COM\n\nClient krb5.conf (with\
    \ dns support):\n  [libdefaults]\n  dns_lookup_realm = true\n  dns_lookup_kdc\
