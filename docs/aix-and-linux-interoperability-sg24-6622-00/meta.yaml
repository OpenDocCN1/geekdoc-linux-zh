    # 10.3 Webmin


    Webmin is a Web-based interface for system administration for UNIX systems and
    commonly used in Linux systems. It consists of a simple Web server and CGI forms
    that are written in Perl Version 5, and use a non-standard Perl modules.


    Webmin can be easily accessed through a Web browser that supports tables and forms
    on any client machine connected to the network. It provides a graphical interface
    to different services and tasks needed to maintain and administer a UNIX system.
    It does not modify files if there is no need to do it. If Webmin does not understand
    a particular option or command in your existing configuration, it will leave it
    as it is in the configuration file.


    Webmin should not be viewed as a complete replacement for some of the system administration
    tools and techniques (like using the command line), but as an aid to a system
    administration to accomplish some task faster and easier.


    # 10.3.1 How to obtain Webmin


    You can download the Webmin source from:

    [http://www.webmin.com/download.html](http://www.webmin.com/download.html)


    Here you will find the latest version of Webmin in a tarball package and in an
    RPM package. The tarball will work on nearly any UNIX version that has Perl, while
    the RPM package is known to work directly at least on any versions of Linux. The
    Webmin version that we used for this example is webmin-1.020-1.


    For AIX systems, you can download the Toolbox version of Webmin from:

    [http://www-1.ibm.com/servers/aix/products/aixos/linux/download.html](http://www-1.ibm.com/servers/aix/products/aixos/linux/download.html)


    > **Note:** The AIX toolbox for Linux applications contains a collection of open
    source and GNU software and applications that have already been recompiled to
    work with both AIX 5L and AIX Version 4.3.3.


    For more information on the AIX toolbox for Linux applications, refer to *Linux
    Applications on pSeries*, SG24-6033.'
  merge: -1
  pgno: 259
- img_proc: false
  md: '# ## 10.3.2 Installing Webmin


    Installation of Webmin differs slightly depending on which type of package you
    choose to install and which operating system you are running it on. Note that
    Webmin requires Perl Version 5 or later for any of installation to work.


    # ### *Unpacking/Installing the Webmin software source for Linux*


    Extract the Webmin source and it will typically create its own subdirectory. Here
    is how you can extract the different sources that you downloaded from the Webmin
    Web site:


    +   - For the webmin-1.020-1.tar.gz file, extract it with this command:


    ```

    # gunzip -c webmin-1.020-1.tar.gz | tar xvf -

    ```


    +   - For the webmin-1.020-1.noarch.rpm file, you can directly install it with
    this command:


    ```

    # rpm -iv webmin-1.020-1.noarch.rpm

    ```


    # ### *Installing the tarball source in Linux systems*


    For the tarball source, change to the directory that was created when you untarred
    the archive, in this case, /usr/local/webmin-1.020.


    > **Note:** It is recommended that you do not use a temporary directory for the
    source file. The directory where the source was first extracted will be used by
    Webmin when it is running. These files do not get copied to another location upon
    installation.


    To set up webmin, simply run the setup.sh shell script. The script will start
    the installation and ask your preferences for the installation. Generally, you
    only need to accept the defaults. Refer to Example 10-3.


    # *Example 10-3 Installing Webmin source in Linux*


    ```

    [root@rh1linux webmin-1.020]# ./setup.sh

    **********************************************************************

    *            Welcome to the Webmin setup script, version 1.020     *

    **********************************************************************

    Webmin is a web-based interface that allows UNIX-like operating

    systems and common UNIX services to be easily administered.


    Installing Webmin in /tmp/webmin-1.020 ...


    **********************************************************************

    Webmin uses separate directories for configuration files and log files.

    Unless you want to run multiple versions of Webmin at the same time

    you can just accept the defaults.

    ```'
