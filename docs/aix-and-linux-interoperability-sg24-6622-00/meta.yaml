  md: '# 9.2 Security tools


    In this chapter, we will cover some tools avaiable on Linux and AIX that could
    be used to enhance the security of those systems.


    # 9.2.1 OpenSSL


    Many server software that ask for an user''s authentication before allowing services
    transmit, by default, the authentication information (user and password) in plain
    text. Using encryption mechanisms like SSL ensures safe and secure transactions.
    Using SSL, data transmitted over the network is point-to-point protected.


    The SSL protocol runs above TCP/IP and below higher-level protocols, such as HTTP
    or IMAP. It uses TCP/IP on behalf of the higher-level protocols, and in the process
    allows an SSL-enabled server to authenticate itself to an SSL-enabled client,
    allows the client to authenticate itself to the server, and allows both machines
    to establish an encrypted connection.


    The primary goal of cryptography is to secure important data as it passes through
    a medium that may not be secure itself. Its medium could be the Internet, for
    example.


    There are many different cryptographic algorithms, each of which can provide one
    or more of the following services to applications:


    +   **Confidentiality**

    This is the guarantee that only the parties involved in a communication will be
    able to access the exchange information, even if the data travels through an insecure
    medium. In practice, when a message is encrypted, the plain text is transformed
    by an algorithm into enciphered text that hides the meaning of the message and
    can be sent via any public medium. This process involves a secret key that is
    used to encrypt and later decrypt the data. Without the secret key, the encrypted
    data has no meaning.


    **Integrity**

    There is a way for the recipient of data to determine if any modifications were
    made in the data. A cryptographic checksum, called Message Authentication Code
    (MAC), can be calculated over a user supplied text to protect the integrity of
    data. After that, the sender encrypts the text. Now he sends the encrypted text
    and the MAC to the receiver, which can verify the integrity of the message decrypting
    the receive message, extracting the MAC of the message and comparing with the
    MAC received.'
