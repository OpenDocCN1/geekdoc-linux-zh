  md: "# # Preface\n\nThis IBM® Redbook discusses interoperability in terms of UNIX\
    \ to UNIX cross platform data sharing and user/system management. This redbook\
    \ also demonstrates the similarities and differences between the AIX® and Linux\
    \ operating systems.\n\nThis redbook is intended to help IT specialists who have\
    \ AIX systems and Linux systems in their environments understand how to integrate\
    \ and optimize AIX systems in a Linux environment and share AIX resources with\
    \ Linux systems. We have focused our descriptions on the following areas:\n\n\
    +   - User management\n  - Identification and authentication\n  - Centralized\
    \ user management\n  - Single sign-on\n- Networking\n  - Networking services\n\
    \  - Sendmail\n  - NFS\n- Data sharing\n  - Samba file and print server\n  - File\
    \ systems and data archiving\n  - Printer sharing\n- System management\n  - Security\n\
    \  - System Administration Application\n  - Linux for IBM @server pSeries™ and\
    \ RS/6000®\n\n# ## The team that wrote this redbook\n\nThis redbook was produced\
    \ by a team of specialists from around the world working at the International\
    \ Technical Support Organization, Austin Center.\n\n**KyeongWon Jeong** is a Consulting\
    \ I/T Specialist at the International Technical Support Organization, Austin Center.\
    \ He writes extensively on AIX and education materials and teaches IBM classes\
    \ worldwide on all areas of AIX. Before joining the ITSO four years ago, he worked\
    \ in IBM Global Learning Services in Korea as a Senior Education Specialist and\
    \ was a class manager of all AIX classes for customers and interns. He has many\
    \ years of teaching and development experience. He is an IBM Certified Advanced\
    \ Technical Expert - RS/6000 AIX."
  merge: -1
