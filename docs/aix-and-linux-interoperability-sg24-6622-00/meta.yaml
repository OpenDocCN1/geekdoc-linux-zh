  md: "# # 11.1 Printing from Linux to a printer attached to AIX\n\nIn this section\
    \ we describe the scenario of printing from Linux to a printer attached to AIX.\n\
    \n+   - Printing on AIX\n  - AIX queuing system\n  - Adding a local printer on\
    \ AIX\n- Configuring remote printing on Linux using LPD\n\n# ## 11.1.1 Printing\
    \ on AIX\n\nWe describe the procedure to install a printer on AIX. For more information\
    \ on AIX printing and the commands used for printing, refer to the AIX documentation\
    \ *AIX 5L Version 5.2 Guide to Printers and Printing*.\n\n# ### AIX queuing system\n\
    \nAIX uses a general queuing system that may be used for any queue-related purpose,\
    \ and printing is one of the ways of using this queuing system.\n\nThe user submits\
    \ the print job to a queue. A server called qdaemon monitors those queues and\
    \ schedules and initiates jobs. In the case of printing on the local system, qdaemon\
    \ sends the job to a back-end program `/usr/lpd/piobe`. The output of the back-end\
    \ program is sent to the specified physical device in the case of local printing.\
    \ To send a print job to a remote printer, the `/usr/lpd/rembak` back-end program\
    \ is used.\n\nYou can submit print jobs on AIX with the `enq` command. AIX also\
    \ provides the `lp`, `lpr` or `qprt` commands for compatibility with BSD and AT&T-style\
    \ printing. But `lp`, `lpr` and `qprt` are just the front ends to the `enq` command\
    \ and do not represent different printing subsystems.\n\n# ### Adding a local\
    \ printer on AIX\n\nYou can install a printer on AIX using SMIT. The following\
    \ steps describe the setup:\n\n+   1. Start SMIT with the following command:\n\
    \n```\n# smit pdp\n```\n\nYou will see a screen, as shown in Example 11-1 on page\
    \ 255. Select the **Add a Printer/Plotter** option."
  merge: -1
  pgno: 271
- img_proc: false
