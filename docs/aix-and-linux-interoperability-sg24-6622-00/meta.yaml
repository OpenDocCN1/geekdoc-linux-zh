  md: "file, thereby allowing centralized control. We show a typical sshd PAM configuration\
    \ in Example 1-5. Every evaluation of the pam_stack module will result in evaluation\
    \ of the /etc/pam.d/system-auth file, as specified. This way, we may keep the\
