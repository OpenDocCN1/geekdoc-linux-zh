- img_proc: false
  md: 'The following steps set up the logging facilities:


    +   1. Edit the /etc/syslog.conf file to add the following entry:


    ```

    local4.debug var/adm/ipsec.log

    ```


    Use the local4 facility to record traffic and IP Security events. Standard AIX
    priority levels apply. You should set the priority level of debug until traffic
    through IP Security tunnels and filters show stability and proper movement.


    > **Note:** The logging of filter events can create significant activity at the
    IPSec host and can consume large amounts of storage.


    Save /etc/syslog.conf.


    +   2. Go to the directory you specified for the log file and create an empty
    file with the same name. In the case above, you would change to the /var/adm directory
    and issue the command:


    ```

    # touch ipsec.log

    ```


    +   3. Issue a **refresh** command to the syslogd subsystem:


    ```

    # refresh -s syslogd

    ```


    Now all messages from IPSec could be easily checked in /var/adm/ipsec.log. On
    Linux, the IPSec messages are redirected to /var/log/messages.


    # ## Interoperating AIX and Linux


    Our intention is to establish a secure tunnel between an AIX system and a Linux
    system. We are able to accomplish this task at this point.


