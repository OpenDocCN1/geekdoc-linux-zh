    # 11


    # # Printer sharing


    In this chapter, we describe the methods of printing between AIX systems and Linux
    systems. We discuss scenarios where a printer is attached to AIX or Linux and
    how to access the remote printer from either of the systems. We have already described
    one way of sharing printers between AIX and Linux by using the SMB protocol in
    6.3, “Samba file and print server on AIX and client on Linux” on page 125 and
    6.4, “Samba file and print server on Linux and client on AIX” on page 136.


    Printing on AIX and Linux is fairly well documented. You can read about AIX printing
    in the *AIX 5L Version 5.2 Guide to Printers and Printing*.


    You can read about Linux printing from the Linux Printing HOWTO, found at:

    http://www.linuxprinting.org/howto/how.html


    In this chapter, we discuss the following topics:


    +   * Printing from Linux to a printer attached to AIX

    * Printing from AIX to a printer attached to Linux

    * Configuring Directory-Enabled (LDAP) System V print on AIX'
