- img_proc: false
  md: "# # 9.1 IPSec\n\nIn this topic, we are going to cover how to establish a secure\
    \ tunnel between two networks. One network will have an AIX gateway and the other\
    \ one will have a Linux gateway. We will show you how to accomplish this task\
    \ using IPSec. First, we will cover some concepts regarding IPSec.\n\nIPSec was\
    \ developed by the Internet Engineering Task Force (IETF) to be an open security\
    \ standard for security. IPSec provides cryptography-based protection of all data\
    \ at the IP layer of the communications stack. No changes are needed for existing\
    \ applications. IPSec is the industry-standard network-security framework chosen\
    \ by the IETF for both the IP Version 4 and 6 environments.\n\nIPSec protects\
    \ your data using the following cryptographic techniques:\n\n+   - **Authentication**\n\
    \  Process by which the identity of a host or end point is verified\n- **Data\
    \ Integrity**\n  Process of ensuring that no modifications were made to the data\
    \ while in transit across the network\n- **Encryption**\n  Process of ensuring\
    \ privacy by “hiding” data and private IP addresses while in transit across the\
    \ network\n\nAuthentication algorithms prove the identity of the sender and data\
    \ integrity by using a cryptographic hash function to process a packet of data\
    \ (with the fixed IP header fields included) using a secret key to produce a unique\
    \ digest. On the receiver side, the data is processed using the same function\
    \ and key. If either the data has been altered or the sender key is not valid,\
    \ the datagram is discarded.\n\nEncryption uses a cryptographic algorithm to modify\
    \ and randomize the data using a certain algorithm and key to produce encrypted\
    \ data known as *ciphertext*. Encryption makes the data unreadable while in transit.\
    \ After it is received, the data is recovered using the same algorithm and key\
    \ (with symmetric encryption algorithms). Encryption must occur with authentication\
    \ to verify the data integrity of the encrypted data.\n\nThese basic services\
    \ are implemented in IPSec by the use of the Encapsulating Security Payload (ESP)\
    \ and the Authentication Header (AH). ESP provides confidentiality by encrypting\
    \ the original IP packet, building an ESP header, and putting the ciphertext in\
    \ the ESP payload (see Figure 9-1 on page 181)."
  merge: -1
  pgno: 197
- img_proc: false
  md: '![](bbox=[0.268, 0.078, 0.732, 0.338])


    The AH can be used alone for authentication and integrity-checking if confidentiality
    is not an issue. With AH, the static fields of the IP header and the data have
    a hash algorithm applied to compute a keyed digest. The receiver uses its key
    to compute and compare the digest to make sure the packet is unaltered and the
    sender''s identity is authenticated.


    # 9.1.1 Security associations (SA)


    The building block on which secure communications is built is a concept known
    as a *security association* (SA). Security associations relate a specific set
    of security parameters to a type of traffic. With data protected by IPSec, a separate
    security association exists for each direction and for each header type, AH or
    ESP. The information contained in the SA includes:


    +   - Security Parameter Indices (SPI)

    - IP address (endpoints of tunnels)

    - Security protocol (AH or ESP)

    - Cryptography algorithm

    - Keys used for cryptography

    - Modes of encapsulation

    - Life time of keys.'
  merge: -1
  pgno: 198
- img_proc: false
  md: '# 9.1.2 Tunnels and key management


    To set up a secure communication between two hosts, a security association must
    be negotiated and managed during the use of the tunnel. The following types of
    tunnels are supported, each using a different key management technique:


    +   - IKE tunnels

    - Manual tunnels


    # IKE tunnel support


    IKE tunnels are based on the ISAKMP/OAkley (Internet Security Association and
    Key Management Protocol) standards developed by the IETF. With this protocol,
    security parameters are negotiated and refreshed, and keys are exchanged securely.
    The following types of authentication are supported: Preshared key and X.509 Version
    3 digital certificates’ signatures.


    The negotiation uses a two-phase approach. The first phase authenticates the communicating
    parties, and specifies the algorithm to be used for securely communicating in
    phase 2. During phase 2, the IP Security parameters to be used during data transfer
    are negotiated, and the security association and keys are created and exchanged.


    In AIX 5L Version 5.2, the AIX Internet key exchange (IKE) components now use
    the system wide pseudo-random number generator (PRNG) as the random number source.


    Another enhancement of AIX 5L Version 5.2 AIX IKE is the support for Diffie-Hellman
    (GH) group 5. Group 5 specifies the 1536-bit Diffie-Hellman group. Prior releases
    of the AIX only supported DH group 1 and 2. Group 1 specifies the 768-bit Diffie-Hellman
    group and Group 2 specifies the 1024-bit Diffie-Hellman group. The group 5 option
    works exactly like group 1 and group 2; however, group 5 provides a higher level
    of security and requires more process time than group 1 and 2. Diffie-Hellman
    key exchange is a public key cryptosystem where public values are exchanged to
    arrive at a symmetric key among the end entities.


    The DTD (Document Type Definition) of the IKE database configuration file has
    been extended to support DH group 5.


    # Manual tunnel support


    Manual tunnels provide backward compatibility, and they interoperate with machines
    that do not support IKE key management protocols. The disadvantage of manual tunnel
    is that the key values are static. The encryption and'
