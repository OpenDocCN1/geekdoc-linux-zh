  md: '# Digital signature


    The digital signature algorithm (DSA) is used for creating and verifying digital
    signatures. Using a private key, the user can compute a signature for a given
    piece of data. Anyone possessing the user''s public key that corresponds to the
    private key used to compute a signature can then verify the signature. The hash
    of data to be signed is computed, and the hash is actually signed, rather than
    the data itself. The public key corresponding to the private key used to compute
    a digital signature can then be used to obtain the hash of the data from the signature.
    This hash is then compared with the hash computed by the party that is verifying
    the signature. If they match, the data is considered authentic.


    DSA is usually used in combination with Diffie-Hellman. Two parties in a conversation
    can exchange DSA public keys before the conversation begins and use the DSA keys
    to authenticate the communication of Diffie-Hellman parameters and keys. Diffie-Hellman
    with DSA provides authentication and secrecy, and when using the shared secret
    resulting from the Diffie-Hellman exchange as a key, a symmetric cipher can then
    be used for encryption.


    In Example 9-19, we generate a new set of DSA parameters and write them to the
    dsaparam.pem file. The length of the prime and generator parameters in this example
    will be 1024 bits.


    ```

    Example 9-19  Generating new DSA parameters


    openssl dsaparam -out dsaparam.pem 1024

    Generating DSA parameters, 1024 bit long prime

    This could take some time

    .....+.............................+.....+.....

    .....................+

    .....+.....

    .....................+

    .....+.....

    .....................+

    ```


    In Example 9-20, we generate a new DSA private key using the parameters from the
    dsaparam.pem file, encrypt the newly generated private key with the 3DES cipher,
    and write the result out to the dsaprivatekey.pem file.


    ```

    Example 9-20  Generating new DSA parameters from a file


    openssl gendsa -out dsaprivatekey.pem -des3 dsaparam.pem

    warning, not much extra random data, consider using the -rand option

    Generating DSA key, 1024 bits

    Enter PEM pass phrase:

    Verifying password - Enter PEM pass phrase:

    ```'
