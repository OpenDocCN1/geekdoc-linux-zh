    [printers]\n    comment = All Printers\n    path = /var/spool/samba\n    printable\
    \ = Yes\n    browseable = No\n```\n\n> **Note:** Whenever you change the smb.conf\
    \ file, you should execute the testparam command to check for any errors and then\
