- img_proc: false
  md: '# # 1.1 User security mechanisms


    Traditional UNIX security depends on a single map file known as /etc/passwd. Probably
    just about any UNIX administration basics class begins with the description of
    this file, so we skip a detailed explanation.


    Historically, security mechanisms were developed in a race between system designers
    and programmers on the one side and “crackers” on the other. In the beginning,
    our passwords were present in /etc/passwd in a special form called password hash.
    A password hash is a function that does not have an inverse function and, for
    all practical purposes, it is impossible to reverse its result. Hence, it was
    deemed safe to keep password hashes in a world readable file. In time, the computers
    were becoming faster and mischievous users more skilled. Password hashes had to
    be moved out from /etc/passwd. The new way of storing passwords is usually called
    password shadowing, because the now defunct password field in /etc/passwd is shadowed
    by a more or less elaborate scheme for password storage.


    Both AIX and Linux have password shadowing and, by default, rely on /etc/passwd
    for identification. Other than that, their native identification and authentication
    mechanisms are rather different. Linux supports Name Service Switch (NSS) modules
    that enable other identification methods and PAM as an authentication mechanism.
    AIX has its own loadable authentication modules, which support both identification
    and authentication methods.


    # ## 1.1.1 AIX security


    The /etc/security/passwd file is the AIX version of the password shadow. The /etc/security/user
    file contains user attributes that supplement the traditional set in /etc/passwd.
    Every user has a stanza that defines additional attributes. To keep the file changes
    and the size minimal, only the attributes differing from the default stanza are
    listed.


    ### AIX loadable authentication modules framework

    The AIX loadable authentication modules framework has a well defined API with
    two sets of function calls: One for identification and the other for authentication.
    A module designer may choose to implement either one of these. For example, Kerberos
    is only an authentication method. Therefore, the AIX Kerberos module implements
    just the authentication functions. System managers may combine modules in an effective
    manner to bring together various authentication and identification methods.'
  merge: -1
  pgno: 19
- img_proc: false
  md: "Loadable authentication modules are configured in /usr/lib/security/methods.cfg.\n\
    For example, the following stanzas describe one identification and authentication\n\
    method:\n\n```\nLDAP:\n    program = /usr/lib/security/LDAP\n\nKRB5:\n    program\
    \ = /usr/lib/security/KRB5\n    options = authonly\n\nKERBEROS:\n    options =\
    \ auth=KRB5,db=LDAP\n```\n\nThe KERBEROS method specifies that the user and group\
    \ information is\navailable through LDAP and the authentication mechanism is Kerberos.\
    \ Use the\nBUILTIN reserved keyword for the db option to refer to /etc/passwd\
    \ and the\n/etc/security files.\n\nThe SYSTEM attribute in /etc/security/user\
    \ specifies which way the user is\nauthenticated by referencing stanzas from /usr/lib/security/methods.cfg.\
    \ This\nimplies that authentication can be controlled on a per user basis, which\
    \ is a\nrather rare feature. To set the authentication on the host level, you\
    \ should just\nchange the SYSTEM attribute of the default stanza. Furthermore,\
    \ it is possible to\nmake quite complex authentication configurations using the\
    \ SYSTEM grammar:\n\n```\njoe:\n    SYSTEM = \"LDAP or LDAP[unavail] and compat\"\
    \n```\n\nThis example says that joe should be authenticated using the LDAP\nauthentication\
    \ method, but in case the LDAP service is not available, he can\nauthenticate\
    \ against the local files just as well. A complete description of the\nSYSTEM\
    \ grammar is in the /etc/security/user file reference.\n\nAnother related attribute\
    \ in /etc/security/user is registry, which specifies where\nthe user's information\
    \ is administered. Thus, a complete stanza for user joe in\n/etc/security/user\
    \ may look like this:\n\n```\njoe:\n    SYSTEM = KERBEROS\n    registry = KERBEROS\n\
    ```\n\nNote that the user administration **chuser**, **mkuser**, and **rmuser**\
    \ commands may not\nbe well suited to some user registries, depending on the site's\
    \ security policy.\nThis is because these commands assume superuser privileges\
    \ that may not be\nappropriate if users are administered on a site level."
