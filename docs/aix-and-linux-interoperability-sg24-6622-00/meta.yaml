    # Configuring the AIX NTP server


    To configure bayani as our NTP server, do the following steps:


    1. Set the /etc/ntp.conf file like the one in Example 4-8.


    ```

    Example 4-8  ntp.conf file of NTP server


    server 127.127.1.0

    driftfile /etc/ntp.drift

    tracefile /etc/ntp.trace

    restrict default nomodify notrust

    restrict 192.168.5.1

    restrict 127.0.0.1

    ```


    The 127.127.1.0 address is a special address that tells the AIX server to synchronize
    to its own system clock. Of course, a computer with a decent clock that does not
    "wander" much should be chosen as the private primary NTP server.


    > **Note:** For the purpose of simplicity, we are using the system clock or system
    time as the reference clock. In a real-world scenario, this setup is not recommended.
    To get a more precise and well-calibrated setup, use a cesium clock or refer to
    a public stratum 1 NTP server on the Internet.


    The restrict default nomodify notrust line will only permit queries that return
    information and specifies treating hosts normally but never use them as synchronization
    sources.


    The succeeding "restrict" lines will prevent the server from attempting to synchronize
    to its own time at startup.


