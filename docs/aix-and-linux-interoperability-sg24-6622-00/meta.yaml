    \ 1084 ?        S    11:09   0:00 smbd -D\n```\n\nIf you get a similar output,\
    \ then the Samba server on Linux is started.\n\n# 6.4.2 Configuring a Samba client\
    \ on AIX\n\nA Samba client is installed by default on AIX. In this section, we\
    \ describe examples of accessing SMB shares:\n\n+   ▸ Using SMBFS\n▸ Using the\
    \ smbtar command\n\n# Using SMBFS\n\nYou can use the new Server Message Block\
    \ File System (SMBFS) feature, which is available on AIX 5L Version 5.2.0. SMBFS\
    \ allows access to shares on SMB servers as a local file system on AIX. Furthermore,\
    \ you can create, delete, read, write, and modify the access times of files and\
    \ directories. The owner or access mode of files and directories cannot be changed.\n\
    \n# **Installing SMBFS**\n\nSMBFS can be installed from the base operating system\
    \ CD by using the following command:"
