    # 4.1.2 Dynamic Host Configuration Protocol (DHCP)


    This is an application-layer protocol that allows network clients a way to obtain
    proper network configuration without knowledge or understanding of the network.
    Quite simply, a client on the network can easily obtain an IP address and other
    configuration parameters without knowing anything about the network *per se*.
    Typically, the DHCP server answers to broadcast packets sent by the client.


    DHCP is a mechanism for the automatic network configuration of hosts through IP
    while IP addresses become \"real estate\" controlled by the server and are issued
    and leased to each client. It gives the network administrator a method to remove
    the end user from configuration problem and maintain the network configuration
    in a centralized location.


