    # ## 2.4 Migrating user information to LDAP


    It is very seldom the case that an organization is deploying LDAP and creating
    the users'' database from scratch. Usually, the existing users should be migrated
    to the LDAP directory.


    Only users and groups that refer to real people should be migrated to LDAP. It
    does not make much sense to migrate users such as sys or daemon or groups such
    as bin or system for the following reasons:


    +   ► System users are local by their nature. Some applications and services that
    use them may be started before the network is available.

    ► Powerful users such as root should not be distributed; the security implications
    are too serious.

    ► System users and groups may have the same names on different platforms, but
    most often they do not have the same UIDs. No standard has been'
