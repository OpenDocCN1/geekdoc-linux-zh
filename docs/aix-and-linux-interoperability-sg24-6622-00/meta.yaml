    \n- /usr/lib/security/pam_aix\n\n  A PAM module providing AIX authentication services.\
    \ PAM applications such as ssh can use it.\n\n- /usr/lib/security/PAM\n\n  An\
    \ AIX authentication load module that provides access to PAM modules for authentication.\n\
    \n- AIX applications\n\n  Some AIX applications and services may use different\
    \ PAM services through the AIX PAM authentication module. This is the list of\
    \ programs and services: ftp, login, passwd, rexec, rlogin, rsh, su, and telnet.\n\
    \n# 1.4.1 PAM modules and AIX\n\nAIX 5L Version 5.2 includes one simple PAM module:\
    \ /usr/lib/security/pam_aix. This module maps PAM API calls to AIX security calls.\
    \ It provides AIX security services to PAM applications."
