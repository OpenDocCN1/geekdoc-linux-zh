  md: 'Both AIX and Linux have programs capable of doing remote backups through the
    rmt program. Note that this kind of remote backup is possible only if trust between
    the involved hosts is on the root user level, which is seldom the case. Still,
    backup operations may be done through other communication channels which are more
    appropriate, such as the ssh channel:


    ```

    # dump -0f - -b 10 /usr | ssh backup@tapehost "dd of=/dev/rmt0 bs=10k"

    ```


    It is preferable not to allow remote connection for the root user. Note that it
    may be necessary to preserve the blocking factor when using the network, as we
    do in the example.


    # ## 8.4 Data archiving


    User data backup or data transfers are typically done by data archiving. The most
    popular tools for this purpose are tar and cpio.


    The tar (tape archiver) program is probably the oldest archiving programs on UNIX
    systems. It is still probably the most used archiving tool. The format of tar
    archives is standard and tar programs are commonly able to read each other''s
    archives. This format was designed for character devices such as magnetic tape,
    so you should pay attention to the blocking factor. In particular, if the best
    portability is desired, archives should be created with the blocking factor of
    20. This is the default blocking factor on most tar implementations.


    AIX and Linux have different tar implementations. The Linux default tar option
    is the GNU tar program. This tar version is available for AIX as one part of the
    Linux toolbox project. We recommend you install the GNU tar version on AIX hosts.
    However, make sure that the AIX tar version is, by default, accessible to system
    programs, because some option letters are different.


    The GNU tar was based on the draft of the ustar standard (POSIX.1). However, current
    implementations have many extensions that are not POSIX compliant. If the POSIX
    compliance is desired, one should set the POSIXLY_CORRECT environment variable
    or use the --posix option when creating an archive.


    Some useful but seldom used tar options are significantly different between the
    GNU and AIX tar programs. One typical example is the "list of files" parameter.
    The fact that different option letters are used is somehow expected: AIX tar makes
    use of -L while the GNU tar option is -T. AIX tar cannot read the file list from
    the standard input. In other words, specifying -L - produces a File not found
    error. Finally, unlike GNU tar, the AIX tar program will not archive directories
    recursively if they are specified in the input list file. One should be very careful
    when deploying shell scripts that use tar and are supposed to run on both platforms.'
  merge: -1
  pgno: 194
- img_proc: false
  md: 'Another popular archiver is cpio. It is well suited for archiving sets of unrelated
    files. While Linux is equipped with only the GNU cpio version, AIX 5L Version
    5.2 may have up to three cpio programs installed: the standard AIX cpio in /usr/bin/cpio,
    the System V compatibility version in /usr/sysv/bin/cpio, and the GNU version
    from the Linux toolbox in /opt/freeware/bin/cpio. For the most part, the different
    versions will cooperate nicely.


    However, the AIX System V cpio version does not correctly treat archives created
    on Linux. It unpacks files without a hitch, but every 16-bit word has its bytes
    swapped. The problem obviously stems from the fact that two architectures (Intel
    and PowerPC®) have different endianness.


    The pax program is yet another archiver available on AIX and Linux. It combines
    functionality of tar and cpio. The pax specification and user interface are defined
    by the POSIX.2 standard (pax stands for portable archive exchange). The Linux
    pax implementation is a port of the OpenBSD pax program. It is worth noting that
    the AIX pax program supports files larger than 2 GB, unlike cpio and tar. If you
    want to archive files of that size, pax or backup are the only options on AIX.


    We recommend keeping archives as simple as possible in order to improve portability.
    If you expect to have the archive distributed to a different platform, try to
    limit it with the following rules:


    +   - Avoid deeply nested directory trees.

    - Limit file names and paths length. Most tar implementations have a 100 character
    limit for file names, but some old UNIXes have a 14 character limit. Note that
    the limit is imposed by the file system as well.

    - Limit file names to the ASCII standard and use only digits, letters, slash,
    period, dash, and underscore.

    - Avoid large values. Some systems do not support big UID numbers. For example,
    Linux kernel Version 2.2 supports only 16-bit user and group IDs. Also, do not
    try to use time stamps that refer to times before January 1, 1970 or which are
    beyond the year 2038.

    - Avoid large files. If your files are really huge (bigger than 2 GB), perhaps
    you should be using a system backup utility such as dump.

    - Dereference soft links. Soft links may cause trouble if extracting on a foreign
    platform.

    - Try to follow standards. Some may argue that extensions to GNU tar are great,
    but that does not help if the archive is to be unpacked on a system that does
    not understand them. Standards such as POSIX should be used, because they usually
    are the most common denominator.'
  merge: -1
