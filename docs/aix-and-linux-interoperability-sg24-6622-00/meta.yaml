    configure IPSec on a Linux system using the FreeS/WAN program. Now we will cover
    how to import that data from Linux to AIX and then establish a connection.


    AIX provides a conversion facility through the `ikedb` command to facilitate interoperability
    with Linux. The `-c` option of the `ikedb` command provides an easy way for the
    user to configure a tunnel between a Linux and AIX machine. To use the `-c` option,
    define the tunnel between Linux and AIX on the Linux system. Two files were created
    on the Linux machine, ipsec.conf and ipsec.secrets, which are located in /etc
    directory.


    The ipsec.conf file contains information about the tunnel while ipsec.secrets
    holds the keys. A sample ipsec.conf was provided in Example 9-2 on page 186 and
    a sample ipsec.secrets was provided in Example 9-3 on page 187.


    Once these files are created on Linux. move the files to the AIX machine by ftp,
    scp, or any other method. Use the `ikedb -c` command to convert the Linux'
