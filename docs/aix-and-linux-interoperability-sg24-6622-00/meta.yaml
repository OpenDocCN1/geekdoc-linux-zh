  md: '# 2.7 Security considerations


    Centralized user management and authentication raise a few security concerns.
    We list here the most important changes to the environment:


    +   - Users authenticate at one source.

    - Users’ authentication information is stored in one place.

    - The authentication information is transferred over the network for LDAP replication
    and LDAP authentication requests.


    A single-source sign-on is convenient not only for managers, but also for users.
    They do not have to think about different passwords or expirations; there is always
    just one password and just one identity. Therefore, password management is much
    easier. Convenience somehow never reflects well on security (we are still looking
    for an explanation). The problem is twofold:


    +   - Applications may differ widely in security requirements. Some applications
    may require that user present different kind of credentials, for example, a password
    and a PIN. In that case, either the application has to be coerced to require only
    a password, or it has to be moved to another authentication realm. Neither scenario
    is a good solution.

    - The other problem is that data accessed is seldom of the same importance. Some
    may be extremely sensitive. If the user’s password is compromised, access to all
    resources is compromised. As there is just one password, there is just one level
    of security. Again, there is no good solution.


    # 2.7.1 Host access control


    There exists, however, a crude access control on a per user basis and on the host
    level. An LDAP user entry may have additional attributes that specify hosts to
    which the user is allowed access. Both the AIX LDAP client and the PAM LDAP module
    support this kind of access control, but in a different manner.


    AIX 5L Version 5.2 introduces a couple of attributes for the purpose: hostsdeniedlogin
    and hostsallowedlogin. Their meanings are evident. The values these attributes
    can take may be a list of host names or subnets. Then, if the client host finds
    itself in the hostsallowedlogin attribute, user is granted access. Otherwise,
    if the host is in the hostsdeniedlogin list, user is denied access. Both attributes
    may take multiple values. For a full explanation, see the “LDAP exploitation of
    the security subsystem” section in the *AIX 5L Version 5.2 Security Guide*.


    On the other hand, PAM LDAP utilizes only one attribute: host from the account
    object class. If the pam_check_host_attr option in the configuration file is set,
    this attribute controls the host access in the account PAM phase. It is multi
    valued,'
  merge: -1
  pgno: 64
- img_proc: false
  md: 'but values may be only host names or an asterisk, which is a wildcard character
    meaning that access is allowed to any host. Therefore, this kind of access control
    may be difficult to arrange if access is granted for most but not all hosts.


    If the host access control on a per user basis is desired, and an RFC2307 style
    authentication and the AIX LDAP authentication clients are in use, then the /etc/security/ldap/2307user.map
    attribute map file must be edited to include mapping from hostsallowedlogin to
    the host attribute:


    ```

    hostsallowedlogin    SEC_LIST    host    m

    ```


    The hostsdeniedlogin attribute has no matching attribute. However, never set "*"
    for a host attribute, because AIX LDAP client is not going to treat it the same
    way as PAM LDAP.


    # 2.7.2 LDAP servers access and database backup


    LDAP servers store and have full access to the authentication information. They
    should be running up to date software, with minimal installations, and limited
    access. The only access that should be allowed is for the management, backup,
    and data replication. LDAP servers should be physically secure as well.


    The LDAP servers backup tapes should be accessible only to system administrators.
    It may be even better to separate backup of the LDAP directory from the rest of
    data. Typically, directory data is small and compresses well, so a small size
    media such as floppy diskette should suffice.


    It is worth noting that the actual backup procedure depends on the back-end database
    requirements. For example, if the OpenLDAP server uses the Berkeley DB, it is
    recommended to bring it down before performing backup. Naturally, backup practice
    for the DB2 databases should be followed in case of the IBM Directory Server.


    # 2.7.3 Encryption and PKI


    We show all information paths in the centralized authentication environment in
    Figure 2-8 on page 49. Apart from the path marked "remote access", all other paths
    are specific to this environment.'
  merge: -1
