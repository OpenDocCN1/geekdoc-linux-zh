  md: '# Centralized user management


    On UNIX, there are two popular ways to provide single-source sign-on and centralized
    user management: Network Information Service (NIS) and Lightweight Directory Access
    Protocol (LDAP). The former is a well known Sun Microsystems product and it is
    available on most UNIX platforms. Still, in the last several years, LDAP has become
    very popular, and for good reasons.


    Network Information Service (NIS) has a very bad reputation when it comes to security
    and it is suitable for trusted environments only. NIS+, an intended NIS replacement,
    is much better in this respect, but it is rather difficult to set up and administer.


    Single-source sign-on consists of an authentication method and one copy containing
    the user and group information. The main advantage is that users use the same
    password to authenticate to all services. Another obvious advantage of the single-source
    sign-on is that users are administered in one place. This can save time and resources,
    depending on the number of hosts at the site.


    In this chapter, we discuss various ways to set up centralized user management
    and provide single-source sign-on. Our main objective is to deploy LDAP for this
    purpose and show how AIX and Linux hosts use LDAP for authentication.'
  merge: -1
  pgno: 32
- img_proc: false
  md: '# 2.1 Lightweight Directory Access Protocol (LDAP)


    LDAP was designed to make accessing the ISO X.500 directories easier. The ISO
    standard and its Directory Access Protocol (DAP) are extremely complex specifications
    that define the protocol through all seven OSI layers. Initially, LDAP was a client
    application for accessing the X.500 directory services. It relied on the operating
    system networking stack (TCP/IP), supported only the most important DAP operations,
    and was therefore much easier to implement. Later, the LDAP specification was
    also applied to the server side. LDAP became rather distinct from X.500.


    LDAP is based on an open standard. No single vendor has control over the LDAP
    specification, but it has been developed as a joint effort of many IT companies
    and professionals and coordinated by the Internet Engineering Task Force (IETF).
    LDAP is supported and implemented on almost any computer platform today. These
    are the main reasons to deploy LDAP as a directory service.


    # 2.1.1 Introduction to LDAP


    The most common example of a directory is a telephone book, which consists of
    names (entries), their telephone numbers, and perhaps addresses and other useful
    information. The most important trait of the telephone book is that it is organized
    in a simple fashion facilitating quick lookup by name. Data stored in LDAP directories
    is not much different; there are objects (entries) and their attributes. Incidentally,
    if you run into a computerized telephone book on the Internet, there is a good
    chance that it has been implemented using LDAP.


    Directory schemas describe the data stored in a directory. They define which attributes
    must be present in an entry, which attributes are optional, what kind of value
    an attribute may take, and whether is allowed to have multiple values. Every entry
    in an LDAP directory has a unique name called the Distinguished Name (DN) and
    that is the LDAP counterpart of a name in the telephone book. Here is one example
    of a DN:


    ```

    dn: cn=Joe R. User,dc=weeorg,dc=com

    ```


    This format is known as the LDAP Data Interchange Format (LDIF) and you will probably
    encounter it every now and then. The DN consists of a list of attribute=value
    pairs. In this example, cn stands for Common Name and dc for Domain Component.
    All these attributes are defined in a schema. The distinguished name is not of
    much use alone. Let us see what else is in Joe''s entry:


    ```

    cn: Joe R. User

    cn: Joe User

    cn: Joey

    ```'
  merge: -1
  pgno: 33
- img_proc: false
  md: '```

    sn: User

    givenName: Jack

    title: Dr

    mail: joe@weeorg.com

    telephoneNumber: 11 (that''s eleven)

    objectClass: top

    objectClass: person

    ```


    Attribute names are on the left side followed by a colon. The rest of the line
    is an attribute’s value. Note that the values may contain various kinds of strings
    in a fairly free format (though it usually helps if it is meaningful). Indeed,
    it is possible to assign *any* value to an attribute, including things like photos,
    which consist of binary data. The point is that LDAP could not care less about
    what is stored in a directory; it is up to the application to decipher and understand
    the data. LDAP just provides access and may restrict values to some syntax. Also,
    as you can see, an attribute may have more than one value.


    The objectClass attribute is special; it refers to a schema where attributes are
    defined. Schemas are sets of related object classes and attribute definitions.
    Every object class defines the attributes that may be present.


    The value of the DN also signals that the data is organized in a hierarchical
    way. The DN is coded similarly to the Domain Name System (DNS) host names with
    commas as separators rather than dots.


    LDAP does not specify how to store data in the directory, only how to access it.
    Of course, every LDAP server features a database (usually called a back end),
    which is used to store and retrieve information. The database should be able to
    retrieve data quickly. Furthermore, it is assumed that the directory data does
    not change frequently. If it does, then you probably want to use a general database
    facility and not a directory.


    # 2.1.2 Using LDAP for authentication


    In the previous subsection, we say that attributes may be assigned any value.
    That is not entirely true. Some attributes may have a special meaning in the LDAP
    server itself, that is, the LDAP server is sometimes an LDAP application and,
    when in this role, it may be selective about the data served. In particular, all
    LDAP servers implement some authentication method.


    An experimental standard is described in the Request For Comments (RFC) 2307:
    An Approach for Using LDAP as a Network Information Service (sometimes also referred
    to as RFC2307bis). This standard describes object classes and attributes for the
    purpose of identification and authentication. Even though it has not been classified
    as an IETF standard, it has been around for several years now and it is most often
    the common denominator for many'
  merge: -1
  pgno: 34
- img_proc: false
  md: "platforms and supported by many LDAP server and client implementations. Now,\
    \ if we want to use an LDAP directory service for various operating systems, identifying\
    \ the common denominator sounds reasonable.\n\nThe following object classes are\
    \ included in RFC2307 (there are more, but these are featured in this text):\n\
    \n+   - posixAccount\n- posixGroup\n- shadowAccount\n\nThe posixAccount and posixGroup\
    \ classes describe fields present in the /etc/passwd file. The shadowAccount consists\
    \ of attributes that correspond to the fields in /etc/shadow. In Example 2-1,\
    \ we show the relevant excerpt from RFC2307. The object class definitions may\
    \ be intimidating at first sight, but we refer you to the MAY and MUST sentences,\
    \ which contain a list of optional and mandatory attributes. The uid and userPassword\
    \ attributes are used for user authentication. In Example 2-2 on page 19, we show\
    \ a typical user entry in the LDIF format. Incidentally, even though we write\
    \ object names in mixed case, it does not matter, not even in attribute values,\
    \ which obviously has some effect on authentication (note the user name given):\n\
    \n```\n$ telnet r-linux\nTrying...\nConnected to r-linux.\nEscape character is\
    \ '^]'.\nRed Hat Linux Version 8.0 (Psyche)\nKernel 2.4.18-14 on an i686\nlogin:\
    \ Joe\nPassword:\nLast login: Tue Nov  5 10:54:21 from 9.3.5.25\n[joe@localhost\
    \ joe]$\n```\n\nOf course, the case is significant for passwords, because they\
    \ are stored as hashes.\n\n```\nExample 2-1 Object class definitions\n─────────────────────────────────────────────────────────────────────────────\n\
    ( nisSchema.2.0 NAME 'posixAccount' SUP top AUXILIARY\n  DESC 'Abstraction of\
    \ an account with POSIX attributes'\n  MUST ( cn $ uid $ uidNumber $ gidNumber\
    \ $ homeDirectory )\n  MAY ( userPassword $ loginShell $ gecos $ description )\
    \ )\n\n( nisSchema.2.1 NAME 'shadowAccount' SUP top AUXILIARY\n  DESC 'Additional\
    \ attributes for shadow passwords'\n  MUST uid\n  MAY ( userPassword $ shadowLastChange\
    \ $ shadowMin\n        shadowMax $ shadowWarning $ shadowInactive $\n```"
  merge: -1
