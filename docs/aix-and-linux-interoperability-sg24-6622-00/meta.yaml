  md: 'To encrypt a file using a symmetric key, you can use Example 9-11, Example
    9-13, and Example 9-15 on page 209.


    In Example 9-11, we show how to encrypt the contents of the redbook.txt file using
    DES3 in CBC mode and place the ciphertext into redbook.bin. Note that no password
    was specified, so a prompt for a password will be presented.


    ```

    Example 9-11  OpenSSL encryption using des3 in CBC mode


    # openssl enc -des3 -salt -in redbook.txt -out redbook.bin

    enter des-ede3-cbc encryption password:

    Verifying password - enter des-ede3-cbc encryption password:

    ```


    Now we have a binary file named redbook.bin. If you look at the contents, you
    will get a lot of random characters, but binary formats are not readable by humans.


    In Example 9-12, we decrypt the contents of the redbook.bin file created in Example
    9-11. The password “brazil” will be used to decrypt the file.


    ```

    Example 9-12  OpenSSL decryption using des3 in CBC mode


    # openssl enc -des3 -d -in redbook.bin -out redbook.txt -pass pass:brazil

    ```


    In Example 9-13, we encrypt the contents of the redbook.txt file using the Blowfish
    cipher in CFB mode and place the resulting ciphertext into redbook.bin. The contents
    of the environment variable PASSWORD will be used to generate the key.


    ```

    Example 9-13  OpenSSL encryption using Blowfish in CFB mode


    # export PASSWORD=brazil

    # openssl enc -bf-cfb -salt -in redbook.txt -out redbook.bin -pass env:PASSWORD

    ```


    In Example 9-14, we show how to decrypt the redbook.bin file generated by Example
    9-13.


    ```

    Example 9-14  OpenSSL decryption using Blowfish in CFB mode


    # openssl enc -bf-cfb -salt -d -in redbook.bin -out redbook.txt -pass env:PASSWORD

    ```


    In Example 9-15 on page 209, we encode the contents of the redbook.bin file in
    base64 and write the result to the base64.txt file.'
