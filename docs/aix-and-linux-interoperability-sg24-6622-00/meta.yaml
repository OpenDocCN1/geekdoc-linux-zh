  md: '# 9.1.4 Installing IPSec on AIX


    The IPSec feature in AIX is separately installable and loadable. The filesets
    that need to be installed are as follows:


    +   - bos.net.ipsec.rte (The run-time environment for the kernel IPSec environment
    commands)

    - bos.msg.*LANG*.net.ipsec (where *LANG* is the desired language, such as en_US)

    - bos.net.ipsec.keymgt

    - bos.net.ipsec.websm

    - bos.crypto-priv (The file set for DES and triple DES encryption)


    The bos.crypto-priv file set is located on the Expansion Pack. For IKE digital
    signature support, you must also install the gskit.rte fileset (AIX Version 4)
    or gskkm.rte (AIX 5L Version 5.1 or later) from the Expansion Pack.


    After it is installed, IP security can be separately loaded for Version 4 and
    IP Version 6, either by using the recommended procedure provided in Loading IP
    Security or by using the **mkdev** command.


    # Loading IPSec


    > **Attention:** Loading IPSec enables the filtering function. Before loading,
    it is important to ensure the correct filter rules are created. Otherwise, all
    communication might be blocked.


    Use SMIT or the Web-based System Manager to automatically load the IP security
    modules when IP Security is started. Also, SMIT and the Web-based System Manager
    ensure that the kernel extensions and IKE daemons are loaded in the correct order.


    If the loading completes successfully, the **lsdev** command shows the IP Security
    devices as Avaiable. See Example 9-4.


    ```

    Example 9-4 lsdev command output


    # lsdev -C -c ipsec

    ipsec_v4 Defined  IP Version 4 Security Extension

    ipsec_v6 Defined  IP Version 6 Security Extension

    ```


    Before starting the IPSec, it is necessary to create a Key Database. A key database
    is used by the Certificate Proxy Server Daemon (CPSD).'
