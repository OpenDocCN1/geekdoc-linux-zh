  md: "The krb5.conf file consists of sections that you may recognize by names enclosed\
    \ in brackets. The *libdefaults* section defines the site-wide defaults, such\
    \ as realm or ticket issuing details. The most important one is the name of the\
    \ realm. Kerberos applications use the default realm name to form principal names.\
    \ For example, we can reference principal joe@WEEORG.COM by specifying only the\
    \ part to the left of the @ sign. In some Kerberos versions, it is possible to\
    \ use DNS to lookup the default realm name (see 3.6, “Discovering Kerberos services”\
    \ on page 72).\n\nThe *realms* section specifies locations of Kerberos servers\
    \ for one or more realms. Every realm is represented by a tag, which is the realm\
    \ name and a list of service locations. In our example, the KDC services are available\
    \ at hosts kerberos and kerberos-1 and the administration server runs on the host\
    \ kerberos. We can conclude that kerberos.weeorg.com is the master server. The\
    \ default_domain tag is used to convert host names in Kerberos Version 4 principals\
    \ to the FQDN host names.\n\nThe *domain_realm* section defines mapping between\
    \ host names and realms. If the domain tag begins with a dot, which means that\
    \ all names ending with this domain name belong to the specified realm. Alternatively,\
    \ the new DNS method may be used to discover the realm name to which a host belongs\
    \ (see 3.6, “Discovering Kerberos services” on page 72).\n\nThe *logging* section\
    \ defines where Kerberos applications send error messages. Several destinations\
    \ are supported, including plain files, devices, and syslog. The syslog destination\
    \ may be used for centralized logging. For example, the following line specifies\
    \ that the kdc messages starting at the notice severity level are to be sent to\
    \ the LOG_AUTH syslog facility:\n\n```\nkdc = SYSLOG:NOTICE:AUTH\n```\n\nFinally,\
    \ the *kdc* section may specify the kdc.conf file location. We show one in Example\
    \ 3-2. Whereas krb5.conf is read by every Kerberized program, kdc.conf is used\
    \ by the KDC and administration server only on the master server.\n\nExample 3-2\
