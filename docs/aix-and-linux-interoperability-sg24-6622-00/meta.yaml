    }\n```\n\nYou need to restart the inetd daemon after making changes to /etc/inetd.conf.\
    \ You can do this by going to the /etc/rc.d/init.d or /etc/rc.d/ directory, depending\
    \ upon your Linux distribution, and restarting the inetd or xinetd daemon by running:\n\
    \n```\n# /etc/rc.d/init.d/xinetd restart\n```\n\nThe configuration of the Samba\
    \ server is similar to that described for AIX in 6.3.1, \"Configuring a Samba\
