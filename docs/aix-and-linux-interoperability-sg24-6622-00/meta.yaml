  md: '# # System administration applications


    In this chapter, we provide a general overview of the system administration applications
    available for AIX and Linux system environments. We also provide information on
    the different features of each application, how to install it, and its usage.


    +   This chapter contains the following:

    - Web-based System Manager

    - Web-based System Manager Client for Linux

    - Webmin on AIX and Linux'
  merge: -1
  pgno: 242
- img_proc: false
  md: '# 10.1 Web-based System Manager


    Web-based System Manager is a system management application for administering
    computers. It is installed by default on graphical systems, and has been substantially
    enhanced for AIX 5L. It is a client-server application that gives the user a powerful
    interface to manage UNIX systems.


    Web-based System Manager features a system management console for administering
    multiple hosts. It uses its graphical interface to enable the user to access and
    manage multiple remote machines. A plug-in architecture makes it easier to extend
    the suite. In addition, Web-based System Manager supports dynamic monitoring and
    administrator notification of system events.


    The user interface, as shown in Figure 10-1, has improved noticeably and the console
    provides a convenient interface for managing multiple AIX hosts. Web-Based System
    Manager is intended to significantly increase the object-orientation of system
    management of AIX.


    For more information on the Web-based System Manager for AIX 5L, refer to *AIX
    5L Version 5.1 Web-based System Manager Administration Guide*.


    ![](bbox=[0.27, 0.47, 0.84, 0.82])'
  merge: -1
  pgno: 243
- img_proc: false
  md: '# 10.1.1 Web-based System Manager architecture


    The Web-based System Manager enables a system administrator to manage AIX machines
    either locally from a graphics terminal or remotely from a PC client, a Linux
    client, or an AIX client. Information is entered through the Graphical User Interface
    (GUI) components on the client side. The information is then sent over the network
    to the Web-based System Manager server, which runs the necessary commands to perform
    the required action.


    The Web-based System Manager is implemented using the Java programming language.
    The implementation of Web-based System Manager in Java provides:


    +   - Cross-platform portability: Any client platform with a Java 1.3-enabled
    Web browser is able to run a Web-based System Manager client object.

    - Distributed processing: A Web-based System Manager client is able to issue commands
    to AIX machines remotely through the network.

    - Multiple launch points: The Web-based System Manager can be launched either
    in a Java Application Mode locally within the machine to manage both a local and
    remote system, in a Java Applet mode through a system with a Web browser with
    Java 1.3 installed, and in Linux/Windows PC Client mode, where client code is
    downloaded from an AIX host.


    # 10.1.2 Installing Web-based System Manager


    Using Web-based System Manager effectively requires that the client computer have
    at least the following characteristics:


    +   - Graphics display

    - 50 MB free disk space

    - 256 MB of memory

    - 30 MHz CPU


    To use a PC to run Web-based System Manager in applet mode, it should have a processor
    speed of at least 500 MHz.


    To use Web-based System Manager, it must be installed on the client used to run
    it and on any managed machines. For machines with the AIX 5L operating system,
    Web-based System Manager is already installed by default.


    To verify this, enter the following command:


    ```

    # lslpp -h sysmgt.websm.framework

    ```'
