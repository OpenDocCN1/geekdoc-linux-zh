    that either the reference server is not accessible or configured as an NTP server
    or the reference has not synchronized yet to its system clock (127.127.1.0).


    If the offset is greater than 1000 seconds, you will not be able to synchronize
    to the NTP server. You can manually change this setting, so that the delta is
    less than 1000 seconds, or instantaneously synchronize with the NTP server. To
    do this, run the following command:


