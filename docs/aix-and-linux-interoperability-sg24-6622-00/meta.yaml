    # 10.1.3 Modes of operation


    Like in previous releases, the Web-based System Manager can be launched from a
    variety of launch points. It can be configured to run in a variety of operating
    modes. The modes of operation are as follows:


    +   ▸ Stand-alone application mode

    ▸ Client-Server mode

    ▸ Applet mode

    ▸ PC Client mode


    # Stand-alone application mode


    All AIX systems with a Graphical User Interface (GUI) can use this mode to perform
    local tasks. This mode is enabled by default. No configuration is necessary to
    run Web-based System Manager in the stand-alone application mode. It can be launched
    in two ways:


    +   ▸ Running the Java application mode by running the **wsm** command on the
    AIX command line on the system being managed.

    ▸ Through the Management Console icon on the CDE desktop Application Manager.


    To start Web-based System Manager from the Common Desktop Environment (CDE), do
    the following:


    +   1. Select the **Application Manager** icon in the CDE front panel.

    2. Select the **System_Admin** icon.

    3. Select the **System Manager** icon. Refer to Figure 10-2 on page 230.


    The launch pad icon in the CDE application manager loads the Web-based System
    Manager environment with launch icons for all of the Web-based System Manager
    applications. Multiple applications can be started without needing to restart
    the Web-based System Manager environment each time.'
  merge: -1
  pgno: 246
- img_proc: false
  md: '![](bbox=[0.273, 0.093, 0.706, 0.295])


    *Figure 10-2  Web-based System Manager icon on CDE user interface*


    Alternatively, to run Web-based System Manager from the command line, you can
    type the following command:


    ```

    # wsm

    ```


    The command line allows the Web-based System Manager to be in XWindows from an
    aixterm window or in the CDE desktop from a dtterm window.


    # ## Client-Server mode


    When multiple hosts are set up to be managed from a single console, the Web-based
    System Manager operates in a client-server mode. In this mode, you can manage
    your local machine and also other AIX remote machines that have been configured
    for remote management. You can specify the machines you want to manage by adding
    them to the management environment.


    The first machine contacted by the client acts as the managing host while the
    other hosts in the navigation area are managed hosts. You can also select a different
    host than your local machine to act as the managing machine. To do this, use the
    following command:


    ```

    # wsm -<managing machine host>

    ```


    The host you specify as managing machine host displays under the Navigation Area
    as the first host name under the list of hosts that can be managed. This host
    is also used to load the Web-based System Manager user preference profile ($HOME/WebSM.pref).
    Using the -host argument displays the console of the machine you are using, but
    uses the preferences file of the remote host you specify.


    > **Note:** Any AIX target host to be managed by Web-based System Manager must
    have the Web-based System Manager server installed and configured.'
  merge: -1
  pgno: 247
- img_proc: false
  md: '# Applet mode


    In applet or browser mode, the administrator can manage one or more AIX hosts
    remotely from the client platform''s Web-browsers with Java 1.3. To access the
    console in this manner, an AIX host need only be configured with a Web-server
    (for example, IBM HTTP-Server, which is provided on the AIX Expansion Pack CDs).
    Once the Web-server is installed and configured, the host can serve the console
    to the client. The administrator simply enters the URL in the browser:


    ```

    http://<hostname>/wsm.html

    ```


    where hostname is the host name of the managing machine.


    A Web page is then served to the browser that prompts the user for a user name
    and password. Once authenticated to the server, the console launches into a separate
    panel frame. In Web-based System Manager applet mode, the browser is used only
    for logging in and launching the console. Once running, the console is relatively
    independent of the browser.


    > **Note:** In applet mode, it is only possible to manage a set of machines that
    have the same version of Web-based System Manger installed.


    # PC Client mode


    The PC Client code is downloaded from an AIX host, then installed permanently
    on the PC. Because all the Java code is native on the PC, the startup time and
    performance are exceptionally good compared to the applet mode. However, the PC
    Client differs from the client-server mode such that the Windows system running
    PC Client is the managing machine but is not included in the Management Environment
    area.


    # 10.2 Web-based System Manager Client for Linux


    Support has been added to the Web-based System Manager Client for the Linux platform.
    Since the Web-based System Manager is a platform independent Java application,
    the Linux client is identical to the Web-based System Manager PC Client for Windows.
    It is supported on Red Hat Linux Version 7.2 or later. It allows you to remotely
    manage AIX systems and the Hardware Management Console (HMC) for the Regatta systems.


    To install the Web-based System Manager Client for Linux over the network, an
    AIX 5L system (the managing machine) needs to be configured with a Web server
    (In this case, we installed the IBM HTTP Server).'
  merge: -1
  pgno: 248
- img_proc: false
  md: 'To install Web-based System Manager Client for Linux, do the following steps:


    1. On the AIX system, verify that sysmgt.websm.webaccess is installed. You can
    do this by running the command:

    # lslpp -L sysmgt.websm.webaccess

    If it is installed, the fileset will be listed. If it is not installed, refer
    to 10.1.2, "Installing Web-based System Manager" on page 227 for installation
    instructions.


