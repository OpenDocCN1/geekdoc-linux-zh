    \ AIX. Also, make sure that rsh is working and configured properly to make rdist\
    \ work.\n\n# 4.3  Network management\n\nIn a working environment, where applications\
    \ are running on a heterogeneous environment, the satisfaction of users is highly\
    \ dependent on the response time. This is based not only on systems performance,\
    \ but on how fast the information can be passed from one system to the other.\
    \ This is why it is significant to periodically track network performance in your\
    \ environment. Network management provides information about the current state\
    \ of your network, and allows you to respond proactively to potential performance\
    \ problems. In this chapter, you will get an overview of various protocols and\
    \ tools that are available for tracking network performance and optimizing it.\n\
    \nA good book on network management is *UNIX Network Management Tools* by Maxwell.\n\
    \n# 4.3.1  SNMP\n\nA very popular protocol to manage a network is called Simple\
    \ Network Management Protocol, or SNMP. It is a simple and very useful protocol,\
    \ because it is the common denominator for many managed systems. SNMP network\
    \ management is based on the familiar client/server model that is widely used\
    \ in TCP/IP-based network applications. It is an Internet standard for gathering\
    \ statistics and managing devices on the Internet."
  merge: -1
  pgno: 123
- img_proc: false
  md: "This protocol is like a language, with verbs and a vocabulary, and it is used\
    \ for communication between a managed system called an *Agent* and a management\
    \ station called a *Manager*. All the verbs use a special vocabulary, which is\
    \ called the Management Information Base (MIB). This is the standard set of object\
    \ definitions that all SNMP agents are required to support.\n\nThere are three\
    \ requests that can be sent from the Manager:\n\n+   **get**\tRetrieves the value\
    \ of a particular variable and returns the answer to the requester (with response).\n\
    **set**\tUpdates a variable on the managed system (and changes the system value\
    \ that it represents); set is not available for all variables.\n**get-next**\t\
    Retrieves the next-variable. We do not know how many variables or instances we\
    \ have for a specific agent. This powerful command allows you to scan the variables.\n\
    \nTwo requests are used by the Agent:\n\n+   **response**\tAnswers the manager\
    \ after receiving a get, get-next, or set.\n**trap**\tSends an alarm message to\
    \ the manager, describing an extraordinary event.\n\nIt is possible to extend\
    \ the MIB definition for an enterprise to define some specific variables concerning\
    \ a special hardware, software, or a specific management strategy. To use an extended\
    \ MIB, a subagent or a proxy-agent has to be set up.\n\nIn AIX 5L Version 5.2,\
    \ SNMP Versions 2 and 3 is supported. To know more about SNMP and SNMP programming,\
    \ consult the information provided in the *AIX 5L Version 5.2 Systems Management\
    \ Guide: Communication and Networks* and *AIX 5L Version 5.2 General Programming\
    \ Concepts: Writing and Debugging Programs* books.\n\n# 4.3.2 IBM Tivoli® Netview\n\
    \nIBM Tivoli NetView® discovers TCP/IP networks, displays network topologies,\
    \ correlates and manages events and SNMP traps, monitors network health, and gathers\
    \ performance data. Tivoli NetView meets the needs of customers with large network\
    \ infrastructure by providing the scalability and flexibility to manage mission-critical\
    \ environments.\n\nNetView has a functionality that provides a scalable management\
    \ solution. It measures availability and provides fault isolation by quickly identifying\
    \ the root cause of network failures."
