  md: '# ### 3.2.4 Starting Kerberos


    Kerberos has three services: The Key Distribution Center (KDC), the administration
    service, and the password change service. The first is implemented in the krb5kdc
    daemon and the latter two in the kadmin daemon. Once we have Kerberos configured,
    starting the services may be done by simply invoking these two programs on the
    command line. However, this should be done by invoking another program, depending
    on the platform.


    # #### Starting Kerberos services on AIX


    On AIX 5L Version 5.2, both Kerberos daemons are started using the start.krb5
    script:


    ```

    # /usr/krb5/sbin/start.krb5

    ```


    To stop the services, use the **stop.krb5** command:


    ```

    # /usr/krb5/sbin/stop.krb5

    ```


    # #### Starting Kerberos services on Linux


    On Red Hat Linux Version 8.0, Kerberos services are started or stopped using the
    standard Red Hat service program:


    ```

    # service krb5kdc start

    # service kadmin start

    ```


    Alternatively, you can turn to the somewhat more standard system V type startup
    scripts:


    ```

    # /etc/init.d/krb5kdc start

    # /etc/init.d/kadmin start

    ```


    # ### 3.3 Kerberos administration


    The Kerberos database consists of principals and policies. The kadmin program
    is used to administer the database. It connects to the administration server running
    on the Kerberos master server.


    # #### 3.3.1 Kerberos principals


    The format of a Kerberos principal is:


    ```

    component/component/component@REALM

    ```


    However, commonly, only one or two components are used and the format is:


    ```

    primary/instance@REALM

    ```'
  merge: -1
  pgno: 76
- img_proc: false
  md: "For example, ordinary users have just a single component (primary), which is\
    \ normally the same as their UNIX user name. Services have two components, of\
    \ which the primary is the service type and the instance is the host name. Here\
    \ are a few examples of principal names:\n\n+   - joe@WEEORG.COM\n- joe/admin@WEEORG.COM\n\
    - host/lettuce.weeorg.com@WEEORG.COM\n- ftp/weed.weeorg.com@WEEORG.COM\n- ldap/marguerite.weeorg.com@WEEORG.COM\n\
    - krbtgt/WEEORG.COM@WEEORG.COM\n\nThe first two are principals used by humans.\
    \ By convention, all principals with the *admin* instance are members of the administration\
    \ team. In this case, user joe may be the same person as administrator joe, but\
    \ the use of these two principals is very different. Whereas the first principal\
    \ refers to an ordinary user, the second is commonly used only with the kadmin\
    \ program.\n\nThe next three principals are Kerberos services. The *host* service\
    \ refers to the low level remote access protocol, such as telnet or rlogin. Do\
    \ not forget that Kerberos does not distinguish application servers from users:\
    \ A principal for *every* Kerberized service must be defined in the Kerberos database.\
    \ Furthermore, the keys have to be accessible to the processes that implement\
    \ the services. Just like users who give passwords to prove their identities,\
    \ application servers pass keys read from the key table for the same purpose.\
    \ Key table files should be readable by the root user only. In case the service\
    \ process is running with another user ID, it is best to create a separate key\
    \ table file that will hold just this one principal and be owned by the same user\
    \ ID.\n\nThe last principal krbtgt/WEEORG.COM, which refers to the Kerberos TGT,\
    \ is a special ticket granting principal used by the KDC exclusively.\n\nThe kadmin\
    \ program is used to administrate principals and key tables. It has the same functionality\
    \ like the kadmin.local program. Normally, the local variant is used only to bootstrap\
    \ the database. Let us see how to create principals:\n\n```\n# kadmin -p admin/admin\n\
    Authenticating as principal admin/admin with password.\nEnter password:\nkadmin:\
