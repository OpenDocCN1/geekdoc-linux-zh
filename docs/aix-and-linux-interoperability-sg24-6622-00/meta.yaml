- img_proc: false
  md: 'authentication keys are the same for the life of the tunnel and must be manually
    updated.


    # Native filtering capability


    *Filtering* is a basic function in which incoming and outgoing packets can be
    accepted or denied based on a variety of characteristics. This allows a user or
    system administrator to configure the host to control the traffic between this
    host and other hosts. Filtering is done on a variety of packet properties, such
    as source and destination addresses, IP version (4 or 6), subnet masks, protocol,
    port, routing characteristics, fragmentation, interface, and tunnel definition.


    Rules, known as *filter rules*, are used to associate certain kinds of traffic
    with a particular tunnel. In a a basic configuration for manual tunnels, when
    a user defines a host-to-host tunnel, filter rules are auto generated to direct
    all traffic from that host through the secure tunnel. If more specific types of
    traffic are desired (for example, subnet to subnet), the filter can be edited
    or replaced to allow precise control of the traffic using a particular tunnel.


    For IKE tunnels, the filter rules are also automatically generated and inserted
    in the filter table once the tunnel is activated.


    Similarly, when the tunnel is modified or deleted, the filter rules for that tunnel
    are automatically deleted, which simplifies IP Security configuration and helps
    reduce human error. Tunnel definitions can be propagated and shared among machines
    and firewalls using import and export utilities, which is helpful in the administration
    of a large number of machines.


    After the filter rules are generated, they are stored in a table and loaded into
    the kernel. When packets are ready to be sent or received from the network, the
    filter rules are checked in the list from top to bottom to determine whether the
    packet should be permitted, denied, or sent through a tunnel. The criteria of
    the rule is compared to the packet characteristics until a match is found or the
    default rule is reached.


    The IP security function also implements filtering of non-secure based on very
    granular, user-defined criteria, which allows the control of IP traffic between
    networks and machines that do not require the authentication or encryption properties
    of IP Security.


    # Digital certificate support


    IPSec supports the use of X.509 Version 3 digital certificates. The Key Manager
    tool manages certificates requests, maintains the key database, and performs other
    administrative functions.'
