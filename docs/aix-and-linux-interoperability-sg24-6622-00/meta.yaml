    # # 12


    # # Linux for IBM eServer pSeries and RS/6000


    The high level of activity on the UNIX-based systems and Linux fronts during the
    past few years is allowing Linux to establish itself as a mainstream UNIX player.
    This chapter discusses the point of integration where Linux meets UNIX, specifically
    the AIX operating system, and how to achieve the best of both worlds.


    This chapter will provide a brief introduction on the following topics:


    +   - Linux on a logical partition (LPAR)

    - AIX toolbox for Linux applications


    This chapter will not cover the installation and implementation of Linux on LPAR
    and the AIX toolbox for Linux applications. To get more information on these topics,
    several links will be provided in each section.


    Also, more information concerning Linux on pSeries can be found at this URL: [http://www.ibm.com/servers/eserver/pseries/linux/](http://www.ibm.com/servers/eserver/pseries/linux/)'
  merge: -1
