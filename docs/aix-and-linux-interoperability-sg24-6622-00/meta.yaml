    # 3.3.3 Kerberos database management


    We use the kdb5_util program to initialize the Kerberos database. This program
    implements a couple of symmetric pairs of operations that manipulate the database
    as a whole: Create and destroy, and dump and load. In particular, the **dump**
    command exports the database to a file that may be transferred to another host
    and then loaded into another database. Note that the load operation destroys the
    existing contents of the database.


    The **create** command is used only once, in the beginning, to initialize the
    database. If the database is corrupted for some reason, we must initialize the
    database and load data from the backup.


    It is preferable to perform backup of the Kerberos database separately, because
    the data is very sensitive and it is sometimes difficult to limit access to the
    backup media. The Kerberos database is typically small, so it usually fits on
    a diskette. As for the format, perhaps it is better to use a file from the **kdb5_util
    dump** command, because it uses the ASCII character set.


    # 3.3.4 Kerberos database replication


    Kerberos deploys a very simple replication method. The database is dumped using
    the kdb5_util program, and the resulting file is transferred to the slave'
  merge: -1
  pgno: 80
- img_proc: false
  md: 'server and loaded into the target database. All this is usually done from a
    cron job. The rule of thumb is to run the procedure on an hourly basis, but that
    depends on your needs and the database size. The kprop client and the kpropd server
    manage the database transfer. Sending a dump file to the host running the slave
    Kerberos server is simple:


    ```

    # kprop -f dump_file slave_server

    ```


    Of course, the kpropd daemon must be running on the slave server host. It is usually
    through the inetd superserver, so we put a line like this one in /etc/inetd.conf:


    ```

    krb5_prop stream tcp nowait root /usr/sbin/kpropd kpropd

    ```


    The kpropd daemon receives the database, stores it in a file, and then runs the
    kdb5_util program with the load command to update the active database.


    # 3.4 AIX Network Authentication Service (NAS)


    AIX 5L Version 5.2 has full support for Kerberos. The telnet, “r” commands, and
    ftp services have been Kerberized for both servers and clients. Actually, they
    are equipped with more than one authentication method.


    The system administrator uses the chauthent program to choose authentication methods
    and the order of precedence. In this example, it is Kerberos Version 5 followed
    by the standard authentication method:


    ```

    # chauthent -k5 -std

    # lsauthent

    Kerberos 5

    Standard Aix

    ```


    For example, the ftp client will try each of the listed methods in the given order.


    AIX 5L Version 5.2 includes the Network Authentication Service Version 1.3 on
    the Expansion Pack CD. It is a Kerberos server implementation compliant with the
    Kerberos protocol described in RFC1510: The Kerberos Network Authentication Service
    (V5). It sports several additions and a particularly interesting extension is
    the LDAP directory plug-in. On the one hand. this plug-in uses an LDAP server
    to store the Kerberos database of principals and policies. On the other hand,
    Kerberos clients may use LDAP service to look up the KDC and administration servers.'
  merge: -1
  pgno: 81
- img_proc: false
  md: '# ### 3.4.1 Installing required packages


    The following packages include the Kerberos server, some clients, and the development
    kit:


    +   - krb5.client.rte

    - krb5.doc.en_US.html

    - krb5.doc.en_US.pdf

    - krb5.msg.en_US.client.rte

    - krb5.server.rte

    - krb5.toolkit.adt


    You can install them from the expansion pack CDROM using the installp program:


    ```

    # installp -acgXYd src krb5.client krb5.server krb5.toolkit krb5.msg.en_US \

    >       krb5.doc.en_US

    ```


    # ### 3.4.2 AIX Kerberos master server


    There are two ways to set up the Kerberos master server, depending on the preferred
    database location: A local file system or an LDAP server. It may not be easy to
    decide which path to take.


    On the plus side, using the file system to store the database is the way the "vanilla"
    MIT Kerberos works, so there should be less interoperability issues. It is also
    very easy to manage and the environment is quite simple. Typically, there are
    no performance issues, because database updates seldom occur, and KDC servers
    perform read and cryptography operations only when dealing with tickets that are
    normally significantly less then the number of user sessions.


    On the other hand, LDAP may have already been used to store other user data, as
    we show in Chapter 2, "Centralized user management" on page 15. This way, both
    the identification and authentication data are stored in one place. In spite of
    the LDAP open nature, the administrators should have the expertise to protect
    the Kerberos data properly. This seems to open many new possibilities and may
    offer better data control. LDAP servers have their own way to replicate directories
    in a synchronous manner. Kerberos has a very simple replication mechanism which,
    depending on your environment, may be an issue.


    If you choose to use LDAP to store Kerberos data, then all KDC servers must know
    how to get to it. Currently, there is no way to export the Kerberos data in the
    format suitable for the kdb5_util program. The effect of this is that you can
    use only the AIX platform to host Kerberos servers.'
  merge: -1
  pgno: 82
- img_proc: false
  md: 'There exists, however, an LDAP back-end for the Heimdal Kerberos package and
    it is available from:

    http://www.padl.com/Research/Heimdal.html


    This back-end uses an LDAP scheme different from the one installed by AIX Network
    Authentication Service (NAS). It may prove to be very difficult to adapt one or
    the other package in such a way they can use the same schema and share data.


    # NAS with LDAP support


    Prior to dealing with Kerberos, the LDAP server has to be prepared. AIX NAS officially
    supports two brands of LDAP servers: IBM Directory Server and SunONE Directory
    Server. We show how to prepare the IBM Directory Server. The general idea is to
    have the LDAP server understand the Kerberos data by loading an appropriate set
    of schemas. The next task is to create a realm object, which is going to be the
    top of the Kerberos tree.


    Refer to 2.3.1, "IBM Directory Server" on page 22 for information on how to install
    the IBM Directory Server. The server should be properly configured using the ldapcfg
    program and running. To continue our example, we will use the dc=weeorg,dc=com
    suffix, as in Chapter 2, "Centralized user management" on page 15.


    # Loading Kerberos schema definitions


    The schema description is in the IBM.KRB.schema.ldif file in the /usr/krb5/ldif
    directory. We need to feed this file to the LDAP server using the ldapmodify program:


    ```

    # cd /usr/krb5/ldif

    # ldapmodify -c -h host -D rootdn -w secret IBM.KRB.schema.ldif 2>/tmp/errs

    ```


    The host, rootdn, and secret parameters refer to the LDAP server host, the administrator''s
    DN and password.


    > **Note:** It may happen that certain attributes, such as userPassword or uid
    are already present in the server. By using the -c option, we ask the ldapmodify
    program not to stop on error. However, you should examine the error output to
    see if there were other errors reported.


    Note that there is no need to use the standard Kerberos database replication method;
    the LDAP replication must be set up and all Kerberos data will be automatically
    propagated to all LDAP slave servers. It is practical to have all LDAP slave servers
    prepared for Kerberos and replication. In that case, you will have Kerberos data
    available in slave LDAP servers at the time of configuring the'
  merge: -1
  pgno: 83
- img_proc: false
  md: 'master server. We suggest that you apply the same schema changes on the slave
    LDAP servers at this time. That way, the Kerberos realm that we create in the
    following text is automatically replicated to the slave servers. You should verify
    that the replication is in good shape.


    # *Creating the Kerberos realm*


    The Kerberos realm is the top of the Kerberos data tree. It is an object described
    in the KrbRealm-V2 and KrbRealmExt object classes. A template file called realm_add.ldif
    is in the same directory as the schema file. Copy this file to another name, such
    as ourrealm.ldif, and edit it to reflect your Kerberos configuration. We show
    how our realm in the LDIF format appears in Example 3-3. Then, use the **ldapadd**
    command to put the data in the directory:


    ```

    # ldapadd -h *host* -D *rootdn* -w *secret* ourrealm.ldif

    ```


    # *Example 3-3 Kerberos realm in the LDIF format*


    ```

    dn: krbrealmName-V2=WEEORG.COM,dc=weeorg,dc=com

    objectclass: KrbRealm-V2

    objectclass: KrbRealmExt

    krbrealmName-V2: WEEORG.COM

    krbprincSubtree: krbrealmName-V2=WEEORG.COM,dc=weeorg,dc=com

    krbDeleteType: 4


    dn: cn=principal, krbrealmName-V2=WEEORG.COM,dc=weeorg,dc=com

    objectclass: container

    cn: principal


    dn: cn=policy, krbrealmName-V2=WEEORG.COM,dc=weeorg,dc=com

    objectclass: container

    cn: policy

    ```


    This command may fail if there is no data for the suffix. If that happens, insert
    the following snippet at the top of the LDIF file:


    ```

    dn: dc=com

    dc: com

    objectClass: top

    objectClass: domain


    dn: dc=weeorg,dc=com

    dc: weeorg

    objectClass: domain

    ```


    Of course, you should change it appropriately if your suffix has different attributes
    or more levels.'
