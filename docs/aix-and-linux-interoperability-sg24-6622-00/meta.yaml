  md: '+   - Authentication

    - Non-repudiation


    Cryptography can be used to protect personal identification.


    Cryptography can enable a receiver to prove that a message he received from a
    given sender actually came from the given sender.


    Now that you know a little more about cryptography and SSL, it is time to look
    specifically at the OpenSSL library. OpenSSL is derived from SSLeay. SSLeay was
    originally written by Eric A. Young and Tim J. Hudson in the beginning of 1995.
    In December 1998, development of SSLeay ceased, and the first version of OpenSSL
    was released as 0.9.1c, using SSLeay 0.9.1b as its starting point.


    OpenSSL is essentially two tools in one: A cryptography library and a SSL toolkit.


    The SSL library provides an implementation of all versions of the SSL protocol,
    including TLSv1. The cryptography library provides the most popular algorithms
    for symmetric key and public key cryptography, hash algorithms, and message digests.
    It also support a pseudorandom number generator, and support for manipulating
    common certificate formats and managing key material. There are also general-purpose
    helper libraries for buffer manipulation and manipulation of arbitrary precision
    numbers.


    OpenSSL is the only free, full-featured SSL implementation currently available
    for use with the C and C++ programming languages. It works across every major
    platform, including all UNIX OSs and all common version of Microsoft Windows.


    OpenSSL is avaiable for download from:


    http://www.openssl.org


    # ## Installing OpenSSL on AIX


    The OpenSSL binaries is available on Linux and AIX.


    You can download the OpenSSL packages for AIX from the AIX Linux Toolbox site.
    You must first register in order to download these packages. You can register
    at the following Web site:


    http://www.ibm.com/servers/aix/products/aixos/linux/rpmgroups.html


    When you reach this page, click on the AIX Toolbox Cryptographic Content link.
    You should then see a registration page. After you have registered, you can download
    the OpenSSL packages.


    To install the package execute the following command:


    ```

    # rpm -ivh openssl-0.9.6e-2.aix4.3.ppc.rpm

    ```'
