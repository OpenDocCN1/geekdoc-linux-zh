    Figure 9-9  *Web-based System Manager IKE Tunnel monitor*


    The IKE Tunnel monitor can supply statistics and information about the activated
    tunnels. In our case, the tunnel ID number 1 represents the tunnel between the
    Linux and AIX machine.


    At this point, the installation and configuration of IPSec is completed and you
    established a secure tunnel between your Linux and AIX machine. This tunnel will
    ensure that all communication between Network A and Network B will be secure.


    To verify if the traffic is really encrypted between Network A and B, you could
    do a simple test: Put a sniffer between the gateways A and B, now start a ftp
    session from any machine on Network A to any machine on Network B. You will realize
    that the packets captured by the sniffer are encrypted, which means you cannot
    visualize any data inside the packets. IPSec is working.'
