  md: 'You should find other Kerberos servers in klogin, kshell, and gssftp files.
    If necessary, change the disable option in each of them to "no" and then issue
    the following command:


    ```

    # service xinetd reload

    Reloading configuration:                           [  OK  ]

    ```


    The main reason for running Kerberos is security. Hosts allowing only Kerberos
    authentication are called *secure*. Hosts that run non-Kerberos service applications
    are called *insecure*. Naturally, it is preferable to run only secure hosts. However,
    some services do not support Kerberos, either because it is difficult to Kerberize
    them or because there was simply no interest to include the Kerberos support.
    If such a service transfers user credentials in the clear over the network, then
    you should consider replacing it with another service that offers a similar functionality.
    If that is not an option, then you may try tunneling its data through an SSL channel
    using one of the popular utilities. There is not much point in running Kerberos
    in an environment where other applications may send passwords in the clear.


    It is possible to install other Kerberized applications, such as ssh, imap, and
    pop. Many applications support the Generic Security Service API (GSSAPI), which
    may be used to authenticate users with the Kerberos authentication service.


    The Washington University imap server supports the GSSAPI authentication. On the
    client side, fetchmail supports almost all authentication mechanisms. The WU imap
    and fetchmail RPM packages on Red Hat Linux Version 8.0 are compiled with the
    GSSAPI support. All one has to do is to create an imap ''service principal and
    to add it to the hosts key table file. The authentication method for fetchmail
    should be set to gssapi.


    # 3.7.3 Kerberos authentication clients


    The authentication clients accept requests from the non-Kerberos applications
    and authenticate users through the Kerberos authentication mechanism. Note that
    this is different from using Kerberos applications. In this subsection, we discuss
    the AIX Kerberos authentication module and the Linux PAM Kerberos module. This
    kind of authentication is typically used only once at the beginning of the session,
    for example, when the user logs in to his graphical workstation. The Kerberos
    authentication clients also obtain the TGT for the user.'
  merge: -1
