    \ toolbox (autoconf, automake, binutils, bison, db, fileutils, flex, gcc, libtool,\
    \ m4, make, patch, sh-utils, and wget)\n\nNot all of the listed packages are necessary\
    \ for compiling open source software, but it does not hurt to have them installed.\n\
    \n# Compiling and installing a PAM module\n\nWe choose to compile and install\
    \ the pam_ldap module. This module supports the LDAP authentication (rfc2307 schema)\
    \ and it is standard on Linux. For more details, see:\n\nhttp://www.padl.com/\n\
    \nFirst, we download and unpack the source code tarball:\n\n```\n$ wget -q ftp://ftp.padl.com/pub/pam_ldap.tgz\n\
    $ gzip -dc pam_ldap.tgz | tar xf -\n$ ls -l\ntotal 240\ndrwxr-xr-x   3 joe   \
    \  staff          4096 Oct 25 16:01 pam_ldap-156\n-rw-r--r--   1 joe     staff\
    \        115648 Oct 25 15:53 pam_ldap.tgz\n$ cd pam_ldap-156\n```\n\nNote that\
    \ the version may change. List the directory to find out about the current version.\n\
    \nThe most complex task is configuring the source code for compilation:\n\n```\n\
    $ LDFLAGS=\"-L/opt/freeware/lib\" LIBS=-lc \\\n    CPPFLAGS=\"-I/opt/freeware/include\
    \ -D_LINUX_SOURCE_COMPAT -DPAM_EXTERN=\" \\\n    ./configure --with-ldap-lib=openldap\
    \ \\\n    --with-ldap-conf-file=/etc/pam_ldap.conf --enable-ssl\n```\n\nThis very\
    \ long command line configures the source code for compilation. However, you have\
    \ to make a few more changes in the makefile file:\n\n+   ▸ Add -L/opt/freeware/lib\
    \ to the definition of pam_ldap_so_LDFLAGS\n▸ Change all occurrences of -g root\
    \ to -g system"
