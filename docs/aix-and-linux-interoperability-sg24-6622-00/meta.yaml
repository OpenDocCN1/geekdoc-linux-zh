    # 4.1.4  Network Information Service (NIS)


    The Network Information Service is a distributed service product designed by Sun
    Microsystems. Even though it is quite old, and some would say outdated, it is
    still in use in some environments. Unfortunately, NIS has a very poor security
    record and, depending on security requirements, it is probably not advisable to
    use it. The problem is not with implementations or coding errors, but with the
    design, which assumes a level of trust that is not easy to find in reality (at
    least not anymore). NIS+ is supposed to mend all the NIS deficiencies, which it
    does in many respects, but the price is a greater effort on the part of the system
    management.


    NIS is provided for both AIX and Linux platforms. NIS+ is available on AIX, but
    Linux only has support for the API. Linux may join the NIS+ environment only as
    a NIS+ client. Not many sites deploy NIS+ on Linux, so the quality of the support
    may be a problem. It seems that the development of NIS+ for Linux has stopped.'
  merge: -1
  pgno: 118
- img_proc: false
  md: 'On the other hand, NIS support on Linux has a longer history and should be
    better supported.


    NIS distributes the UNIX /etc system maps, such as /etc/passwd, /etc/group, or
    /etc/services. The underlying communication technology is based on Remote Procedure
    Calls (RPC). Therefore, hosts in NIS environment must run portmapper to map RPC
    ports to TCP ports.


    NIS maps are organized in a domain. Only one-level domains are supported. A NIS
    domain data resides on a host, which runs the NIS master server. For increased
    availability and to reduce the master server load, there should be one or more
    slave servers. Slave servers synchronize their copies of maps by pulling them
    from the master server. On the other hand, the master server may prompt the slave
    servers to pull the update maps. It may be done by the ypupdated daemon, which
    is available on AIX or manually by using the yppush program.


    NIS servers keep databases in the DBM format. Therefore, all maps have to be converted
    from ASCII to this format using the makedbm program. The ypinit utility is typically
    used to initialize the database, either from the local files, in the case of the
    master server, or from the master server, if it is run on a slave server.


    NIS servers are implemented in the ypserv program. It reads the maps and makes
    them available to the NIS clients. Every NIS client must bind to the server using
    the ypbind program. ypbind runs in the background and at startup tries to find
    a NIS server using a network broadcast. Broadcasting is convenient, but in this
    situation also a security issue, so it is better to give a hint to the ypbind
    program by specifying a server or a list of servers. On Linux, this is done by
    specifying NIS servers in /etc/yp.conf. On AIX, one should create a list of NIS
    servers in /var/yp/nisdomain/ypservers.


    # 4.2 Data transfers


    Although it is possible to send relatively short files using `ftp` and `rcp`,
    there are more efficient ways of transferring large files. `ftp` and `rcp` are
    usually designed to transmit relatively small amounts of text; therefore, other
    means are needed to transfer large files effectively and efficiently. This section
    will discuss some of the better tools that you can use for synchronizing and transferring
    files over the network. In this way, you can enable remote backup of data, as
    well as enabling redundancy features in case of a machine failure.


    # 4.2.1 rsync


    The rsync package provides a command for synchronizing files over a network. The
    `rsync` command uses a quick and reliable algorithm to quickly synchronize'
