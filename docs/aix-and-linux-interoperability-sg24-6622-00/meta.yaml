  md: '# Setting up the configuration files


    To configure the NFS server, we need to edit just the /etc/exports file. Access
    to the portmapper server may be controlled using the tcpwrapper. NFS clients should
    be entered in the /etc/hosts.allow file; otherwise, access to the portmapper port
    should be prohibited. Some implementations of other NFS specific servers, such
    as statd, include support for the tcpwrapper. That is typically the case with
    the Linux NFS implementation.


    The /etc/exports file contains entries detailing which directories or files can
    be shared and how they are shared. The format is as follows:


    ```

    directory machine1(option11,option12) machine2(option21,option22)

    ```


    For example:


    ```

    /home/bob aix_host(rw,insecure)

    ```


    This exports the directory and sub-directories under /home/bob to a system called
    aix_host. These options specify the read-write access (rw) and that NFS clients
    connecting from ports higher than 1023 are allowed access. Ports 1-1023 are considered
    secure because only the root user can bind to them.


    > **Note:** The insecure option is required because Linux, by default, requires
    the NFS mount to use ports below 1024 and AIX by default uses ports above 1024.
    Instead of mentioning the insecure command option on NFS server, you can also
    solve this problem by executing the **nfso** command on AIX (NFS client):


    # nfso -o nfs_use_reserved_ports=1


    You can find out about all the options by running **man 5 exports** on Linux and
    **man nfso** on AIX.


    If you change the /etc/exports file later, then you need to export the new entries
    again. This can be done by running the **exportfs -ra** command to force NFS to
    reread the /etc/exports file.


    > **Note:** The /etc/exports file is very sensitive to spaces. Be careful not
    to add any extra spaces.


    # Starting NFS services


    After editing the /etc/exports file, the following NFS services can be started:


    +   - portmap

    - mountd

    - nfsd'
