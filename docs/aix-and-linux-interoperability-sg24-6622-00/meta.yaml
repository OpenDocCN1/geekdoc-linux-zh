  md: '# 1.1.2 Linux security


    Linux keeps shadow passwords in the /etc/shadow map. It contains users'' passwords
    along with some other useful data. This is a much safer solution than having passwords
    in /etc/passwd, because the file is readable only by the root user. Furthermore,
    it is possible to apply a password policy using other fields stored in the shadow
    map. Here is the list of all available attributes:


    +   - Date the password has been changed

    - Minimum password age

    - Maximum password age

    - How much time before the password expiration should the user be warned

    - How much time after password has expired should the account be disabled

    - Date the account has been disabled


    All values are expressed in days and counted, where applicable, since January
    1, 1970. The chage utility may be used to manipulate the values.


    Shadow passwords is the standard Linux authentication method. However, contemporary
    Linux distributions rarely use it directly for authentication purposes, but rather
    authenticate through the PAM authentication mechanism. We discuss PAM in more
    detail in the next section.


    # The name service switch (NSS)


    The name service switch is the basic Linux identification mechanism. It supports
    many system databases, but our concern is only with the /etc/passwd and /etc/group
    files.


    Linux NSS consists of support in the GNU glibc Version 2, various name service
    implementations in /lib/libnss_service.so libraries, and the /etc/nsswitch.conf
    configuration file. In Example 1-1 on page 5, we show a simple configuration file.
    The first line specifies that the host name resolution should be first attempted
    through /etc/hosts and, in case of failure (for whatever reason), through DNS.
    The next three lines specify that information found through an LDAP directory
    service takes precedence over local files. Note that the service failover is done
    automatically by default. Other configurations are possible, as the last line
    in this example illustrates: The map file will be searched only in the case NIS
    servers are not available. For detailed information about the NSS configuration,
    refer to the nsswitch.conf(5) man page.'
  merge: -1
  pgno: 21
- img_proc: false
  md: '```

    Example 1-1 The Linux /etc/nsswitch.conf file


    hosts:      files dns

    passwd:     ldap files

    shadow:     ldap files

    group:      ldap files

    netgroup:   nis [notfound=return] files

    ```


    # 1.2 Pluggable Authentication Modules (PAM)


    PAM secures a common ground for applications on one side and the operating system''s
    security subsystem on the other. It is a system software consisting typically
    of a system library and a bunch of modules. The library implements a PAM API and
    provides a connection between PAM modules and applications. The modules look exactly
    the same way to applications, even though they may handle widely different authentication
    methods. It is of no importance to an application requesting an authentication
    service whether a PAM module is using plain ASCII files or using fancy protocols
    to “talk” to a server located somewhere in Wichita.


    PAM has been the standard Linux authentication mechanism for many years now. AIX
    5L Version 5.2 is the first AIX release having complete PAM support.


    # 1.2.1 PAM configuration


    PAM configurations come in two flavors: Single file and multiple files. We find
    the former on AIX: All PAM configuration is stored in /etc/pam.conf (see Example
    1-2). The latter is typical for most Linux distributions: The configuration is
    stored in multiple files in the /etc/pam.d directory (see Example 1-3 on page
    6). However, both flavors have the same functionality. Some PAM implementations
    even allow either flavor. The only difference, as shown in the examples, is that
    the single file configuration contains settings for all applications and services
    lumped together. Therefore, the first colon in this file specifies the service.


    ```

    Example 1-2 AIX PAM configuration (/etc/pam.conf)


    sshd   auth       required   /usr/lib/security/pam_aix

    sshd   account    required   /usr/lib/security/pam_aix

    sshd   password   required   /usr/lib/security/pam_aix

    sshd   session    required   /usr/lib/security/pam_aix

    ```'
  merge: -1
  pgno: 22
- img_proc: false
  md: '```

    Example 1-3  Linux PAM configuration (/etc/pam.d/sshd)


    auth       required     /lib/security/pam_nologin.so

    auth       required     /lib/security/pam_unix.so

    account    required     /lib/security/pam_unix.so

    password   required     /lib/security/pam_unix.so

    session    required     /lib/security/pam_unix.so

    ```


    PAM is a *very* complicated subject, and reading its associated manuals is a necessity.
    This is a particularly sensitive security area, and mistakes in this area will
    cost you dearly.


    # 1.2.2  PAM keywords


    The first column in Example 1-3 contains four distinct words. They are called
    management groups or types in PAM parlance and refer to various authentication
    and session establishment phases:


    **auth** — Authentication. In this phase, the user presents his credentials, typically
    the name and the password.


    **account** — Account verification. The system verifies if the user''s account
    data is valid, for example, the password has not expired or the account has not
    been retired.


    **session** — Session setup. The user has already been allowed access to the system.
    This phase is auxiliary and consists of setup and various other tasks. Typical
    examples are making syslog entries, imposing system limits, and printing the message
    of the day.


    **password** — Password change. This is used only if the user is forced to change
    the password. The most common example is password expiration.


    Even though our examples feature all four types, that is not a requirement. For
    example, if the application does not need a session setup, then the session phase
    can be omitted. Also, PAM modules are not required to support all groups.


    A system administrator may deploy more than one module for a phase. This is referred
    to as *module stacking* and the evaluation is ordered from top to bottom.


    The second column contains the module control and the third is a reference to
    the module''s image. The control states how important a role the module plays
    in the phase. Things get a bit complicated here, so we turn to an example to explain
    how to use PAM controls.'
  merge: -1
  pgno: 23
- img_proc: false
  md: "# # PAM example: The ftp service\n\nThe ftp service has a few peculiarities\
    \ that have to be handled in a special way. It lends itself nicely to this discussion.\
    \ We present one possible PAM configuration for the ftp service in Example 1-4.\
    \ It employs no less than six PAM modules.\n\n*Example 1-4  PAM configuration\
    \ for the ftp service*\n\n```\nauth\tsufficient\tpam_ftp.so\nauth\trequired\t\
    pam_unix.so\nauth\trequired\tpam_listfile.so file=/etc/ftpusers\nauth\trequired\t\
    pam_shells.so\naccount requisite\tpam_time.so\naccount required\tpam_unix.so\n\
    session required\tpam_unix.so\nsession required\tpam_limits.so\n```\n\nThe authentication\
    \ phase starts with the pam_ftp module, which returns success if the user is ftp\
    \ or anonymous, the anonymous ftp has been enabled, and the user presents a valid\
    \ e-mail address. As this module is marked *sufficient*, if it returns success,\
    \ the whole authentication phase succeeds and the rest of the auth modules are\
    \ skipped. Otherwise, the next module invoked is pam_unix, which checks user credentials.\
    \ In this case, as this module is *required*, the user must present a good password.\
    \ The pam_unix module hashes the password and compares it with the hashed value\
    \ in /etc/shadow. The pam_listfile makes sure that the user is not listed in /etc/ftpusers,\
    \ which is used to prohibit the service for users such as adm or root. Finally,\
    \ the pam_shells module verifies if the user's shell is valid.\n\nIn short, the\
    \ authentication phase succeeds either if pam_ftp returns success or if all three\
    \ modules return success. Note that it is necessary to have pam_ftp, the one marked\
    \ *sufficient*, listed as the first. Note also that all three *required* modules\
    \ are evaluated regardless of the values they return. If one of them fails, even\
    \ though the final result of the authentication phase is known, the other modules\
    \ are evaluated.\n\nIn Example 1-4, the account phase is controlled by two modules.\
    \ The first is pam_time, which checks if the user is allowed to use the service\
    \ at that moment. This module is a *requisite*, and if it fails, the processing\
    \ will stop and the service will be denied. Otherwise, the pam_unix module will\
    \ check for standard situations, such as a retired account. In the last phase,\
    \ the session is logged by pam_unix and user limits are set by the pam_limits\
    \ module. Note that there is no password phase defined; the ftp application have\
    \ no provision for password changing."
  merge: -1
  pgno: 24
- img_proc: false
  md: 'Here are the exact rules for PAM processing:


    +   1. If a *requisite* module fails, the processing stops and an authentication
    failure status is returned to the service.

    2. If a *sufficient* module returns success, the processing stops and an authentication
    succeeded status is returned to the service.

    3. If no *required* modules failed and at least one yielded success, an authentication
    succeeded status is returned to the service. All required modules are always executed.

    4. If none of the required modules reached a decision, *optional* modules are
    used to decide the user''s fate. In this case, all optional modules specified
    are evaluated.


    Note that PAM modules are allowed to return neither success or failure. This is
    essential in some situations. Most modules always either deny or grant, for example,
    a user either belongs to a certain group or he does not, or a user either presents
    a good password or does not. On the other hand, a PAM module depending on the
    network may return the ignore status if a server is unreachable or a network interface
    is down, in which case it may be desirable to fail over to another authentication
    method. You should always check the actual module''s documentation for a precise
    description of the module.


    Just to make things more complicated, PAM modules may accept arguments. In Example
    1-4 on page 7, the pam_listfile module has its file parameter set to /etc/ftpusers.
    A typical option supported by most PAM modules is *debug*: Just put that word
    to the right of the module name and you will receive many error messages through
    syslog.


    More recent PAM implementations support finer grained control instead of the four
    control flags just discussed. Instead of specifying a control flag, the administrator
    can put a list of retval=action pairs in the second field. This is out of scope
    of this text and we refer you to:


    [http://www.softpanorama.org/Security/pam.shtml](http://www.softpanorama.org/Security/pam.shtml)


    # 1.3 Linux PAM implementation


    The Linux PAM implementation is essentially what we describe in 1.2, “Pluggable
    Authentication Modules (PAM)” on page 5. However, various Linux distributions
    have different ways of managing the PAM configuration. The Linux distribution
    we consider in this redbook is Red Hat Linux Version 8.0.


    Red Hat Linux uses the pam_stack PAM module to provide a system level PAM configuration.
    The pam_stack module simply redirects the action to a specified'
  merge: -1
