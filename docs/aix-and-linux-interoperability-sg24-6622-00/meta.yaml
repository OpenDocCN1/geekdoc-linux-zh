    \    host r-linux.weeorg.com\n    base dc=weeorg,dc=com\n```\n\nIn this example,\
    \ the sshd daemon utilizes both the LDAP and the AIX security subsystem. However,\
    \ the latter will be used only in case the LDAP fails. This way, we may support\
    \ both local users as well as those defined in the directory.\n\nSee Chapter 2,\
    \ “Centralized user management” on page 15 for more details on LDAP.\n\n> **Note:**\
    \ In case you use PAM with AIX, applications always specify the use_first_pass\
    \ flag to PAM modules, as shown in the following example:\n\ntelnet  auth    \
    \    required    /usr/lib/security/pam_ldap.so use_first_pass\ntelnet  account\
    \     required    /usr/lib/security/pam_ldap.so\ntelnet  password    required\
