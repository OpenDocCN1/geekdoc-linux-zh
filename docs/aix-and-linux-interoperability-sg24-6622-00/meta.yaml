- img_proc: false
  md: '# 5.1 Sendmail overview


    Sendmail is a mail transport agent developed by Eric Allman that handles e-mail
    from the moment a user submits a mail, transporting it across a network (LAN or
    Internet) to the proper destination system. The final e-mail delivery to the user''s
    mailbox is done by a delivery agent. The Sendmail package includes the delivery
    agent, but its use is optional.


    We discuss the installation and configuration of Sendmail on AIX and Linux in
    this section.


    # 5.1.1 Installing Sendmail


    Sendmail is the traditional UNIX transport agent and is installed and started
    at boot time by default on AIX and on most of the Linux distributions. Refer to
    the Sendmail Web site for instructions on how to install Sendmail from source
    code at:


    http://www.sendmail.org


    For Linux systems, you can install Sendmail through RPM package. You can download
    the Sendmail RPM package from:


    http://speakeasy.rpmfind.net/linux/rpm2html/search.php?query=Sendmail


    After downloading the appropriate RPM, install it using the `rpm -i` command.
    Refer to the man page for rpm for more details on RPM options.


    In addition to installing Sendmail, you should also install the sendmail-cf package,
    which contains support for the m4 macro language based configuration.


    The sendmail-cf package is installed by default on AIX, and is present at /usr/samples/tcpip/sendmail/
    on AIX Version 5.2.0. Sendmail is started from the /etc/rc.tcpip script.


    Most of the Linux distributions provide the sendmail-cf RPM on the installation
    CD. You can also download the RPM from:


    http://www.rpmfind.net/linux/rpm2html/search.php?query=sendmail-cf


    After you download the appropriate RPM for your Linux distribution and system
    architecture, install it using the `rpm -i` command.'
  merge: -1
  pgno: 132
- img_proc: false
  md: '# 5.1.2 Configuration file: sendmail.cf


    Sendmail uses a configuration file called sendmail.cf, which is generally stored
    in /etc/sendmail.cf in AIX and in /etc/mail/sendmail.cf in Linux.The Sendmail
    program uses a complex proprietary macro language. An easier way to prepare a
    Sendmail configuration is to use the m4 macro language. The m4 sendmail macro
    package is delivered with most contemporary Sendmail installations, including
    both AIX and Linux. The sendmail m4 configuration files have the .mc extension.
    Platform specific sample files are usually included and they may be modified to
    suit the specific site''s needs. To generate the Sendmail configuration file,
    it is sufficient to preprocess the .mc file using the m4 program. Find a macro
    file with .mc extension on your system and edit it according to your needs. After
    editing, generate the required sendmail.cf file using m4 macro. An overview of
    this process is described below:


    1. Find a file with the .mc extension

    On AIX, you can find an example of .mc file at:


    ```

    # find / -name "*.mc"

    /usr/samples/tcpip/sendmail/cf/aixsample.mc

    ```


    On Linux, you can find the .mc files in a similar way.


    2. Read the .mc file with its comments. Note that the order of items is significant.

    Some commonly used variables and macros are shown in Table 5-1.


    Table 5-1 Variables and macros


    | Variable/Macro | Description |

    | --- | --- |

    | VERSIONID | This variable identifies the configuration file. |

    | OSTYPE | Specifies the operating system type. |

    | FEATURE | Specifies inclusion of a code representing some Sendmail''s feature.
    For example, FEATURE(''local_procmail'') says to make procmail the default local
    delivery agent. |

    | define | Used to define the values of variables used by Sendmail. |

    | MAILER | Lists supported mail delivery agents. |


    3. After editing the .mc file according to your configuration, you should run
    the following command to generate the sendmail.cf file:


    > **Important:** It is a good idea to make a backup copy of the sendmail.cf file
    before generating a new sendmail.cf file, just in case you have to revert to your
    old configuration.


    ```

    # m4 ${CFDIR}/m4/cf.m4 config.mc > config.cf

    ```'
  merge: -1
  pgno: 133
- img_proc: false
  md: 'Where CFDIR is the root of the cf directory and config.mc is the name of your
    configuration file. Refer to [http://www.sendmail.org/m4/intro.html](http://www.sendmail.org/m4/intro.html)
    for more information on using the m4 macro language for Sendmail configuration.


    A detailed example of setting up the sendmail.cf file from a macro file with .mc
    extension is shown in 5.2, "Mail server on AIX" on page 119.


    After you edit the sendmail.cf file, you should restart Sendmail.


    # 5.1.3 Start and stop Sendmail


    When you make any changes to the sendmail.cf file, you should restart Sendmail
    to make those changes effective.


    On AIX, execute:


    ```

    # refresh -s sendmail

    ```


    or


    ```

    # stopsrc -s sendmail

    # startsrc -s sendmail -a "-bd -ql5m"

    ```


    On Linux, depending on your Linux distribution, restart Sendmail. For example,
    on Red Hat Linux, execute:


    ```

    # /etc/rc.d/init.d/sendmail restart

    ```


    On SuSE Linux, execute:


    ```

    # /etc/rc.d/sendmail restart

    ```


    # 5.1.4 Mail aliases file


    In the mail aliases file, we define the system-wide and domain-wide mail aliases.


    AIX keeps mail aliases in /etc/aliases. In addition to aliases you provide, this
    file must contain an alias for each of the following:


    +   - MAILER-DAEMON (usually set to root)

    - postmaster (usually set to root)

    - nobody (usually set to /dev/null)


    To compile the aliases database file, type one of the following:


    ```

    # sendmail -bi

    # newaliases

    ```'
  merge: -1
  pgno: 134
- img_proc: false
  md: 'This creates a dbm version of the aliases file stored at /etc/mail/aliases.db.
    For more information, refer to the "Managing Mail Aliases" section of the *AIX
    5L Version 5.2 System Management Guide: Communications and Networks*.


    On Linux, the aliases file is stored at /etc/aliases. After editing the /etc/aliases
    file, you should run:


    ```

    # newaliases

    ```


    For more information, run **man 5 aliases**.


    # 5.1.5 Mail queue


    On AIX, the mail queue is a directory that stores data and controls files for
    mail messages that the **sendmail** command delivers. By default, the mail queue
    is /var/spool/mqueue. You can read more in the "Managing the Mail Queue Files
    and Directories" section in the *AIX 5L Version 5.2 System Management Guide: Communications
    and Networks*.


    On Linux, the mail queue directory is /var/spool/mqueue. You can use the **mailq**
    command to see the queue status on Linux.


    # 5.1.6 Mail logging


    The **sendmail** command logs mail system activity through the syslogd daemon.
    The syslogd daemon must be configured and running for logging to occur. Specifically,
    the /etc/syslog.conf file should contain the uncommented line:


    ```

    mail.debug                /var/spool/mqueue/log

    ```


    If it does not, use your favorite editor to make this change; be certain that
    the path name is correct and that the mail log file exists before you restart
    syslog. If you change the /etc/syslog.conf file while the syslogd daemon is running,
    restart the syslogd daemon.


    On AIX, if the /var/spool/mqueue/log file does not exist, you must create it by
    typing the following command:


    ```

    # touch /var/spool/mqueue/log

    ```


    Type the following command at a command line:


    ```

    # refresh -s syslogd

    ```


    On Linux, go to the /etc/rc.d/init.d or /etc/rc.d directory, depending on your
    Linux distribution and restart the syslog service:


    ```

    # Log all the mail messages in one place.

    mail.*                                          /var/log/maillog

    ```'
