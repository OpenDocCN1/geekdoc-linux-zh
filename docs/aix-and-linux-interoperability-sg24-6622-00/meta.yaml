    \ In that case, you should substitute all occurrences of the cn=root string to\
    \ the DN of your Kerberos administrator. Do not forget to change the LDAP Access\
    \ Control List (ACL) on the Kerberos containers (realm, principal, and policy)\
    \ prior to using the new DN.\n\nAIX uses the config.krb5 program, which does most\
