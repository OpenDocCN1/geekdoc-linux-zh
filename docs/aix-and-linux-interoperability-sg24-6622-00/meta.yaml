    # 8.3 Backup and file systems


    Traditional low level UNIX backup utilities are dump and restore. These programs
    are best suited for the system level backups. They operate on a file system inode
    level and therefore have to know the underlying file system technology. A direct
    consequence is that they can normally operate on only one file system type. For
    example, the Linux dump utility is capable of backing up only ext2 and ext3 file
    systems. Similarly, the restore utility can only understand backup images produced
    by the corresponding dump utility.


    AIX and Linux share only the JFS file system implementation, and we discuss the
    Linux JFS port in the previous section. Linux supports a myriad of file systems.
    The most popular journaling file systems are ext3, Reiser FS, SGI XFS, and IBM
    JFS. Backup of the ext3 file system is supported by the dump and restore programs.
    SGI XFS has its own pair of backup utilities: xfsdump and xfsrestore. The Reiser
    FS and IBM JFS do not have backup programs and the only option is to back them
    up using the GNU tar program. Note that the JFS Linux port is coming from IBM
    OS/2®. The same version is available on AIX 5L.


    On AIX, the backup functionality is provided by the backup and restore programs.
    The backup utility has two modes of operation: Using file system inodes and using
    file names. The former is used to back up whole file systems and the latter to
    archive individual files.


    The GNU tar supports file system level backups. It does not operate on the inode
    level. Hence, it is slower than the dump utility, but it does not care about the
    underlying file system type. It supports incremental backups and backup of special
    devices, which is not common for tar implementations. Though a seasoned system
    administrator would not approve, the GNU tar program is regularly used on Linux
    to back up file systems. Also, the GNU tar was available for this purpose before
    the first stable release of the dump and restore utilities and it probably prevails
    even today as a system backup utility.'
