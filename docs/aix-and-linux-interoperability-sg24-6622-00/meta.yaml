  md: '![](bbox=[0.26, 0.08, 0.74, 0.44])


    Figure 12-4 AIX toolbox for Linux applications


    The AIX toolbox for Linux applications provides the capability to easily compile
    and run Linux applications, providing the Linux applications full access to AIX
    functionality and features.


    The AIX Toolbox for Linux Application provides Linux source code compatibility
    by porting open source software and GNU software to run on AIX, that is, GNU application
    development tools, libraries, shells, utilities, and Graphical User Interface
    (GUI) desktops. The compiled Linux applications then become AIX binaries.


    Here are some of the tools included in the AIX toolbox for Linux applications:


    | Category | Tools |

    | :--- | :--- |

    | Graphical desktops | KDE and Gnome desktops |

    | Development tools | automake, gcc, g++, gdb, make, autoconf, libtools, m4, patch,
    rpm-build, and more |

    | Development libraries | libxml, db, gtk+, libtiff, libjpeg, ncurses, qt, zlib,
    and more |

    | User interface for desktops | Sawfish and WindowMaker (window manager for XWindow
    System), Koffice (a set of office application for KDE), the Gnome control-center,
    enlightenment window manager, and more |

    | Database application | MySQL, including client and libraries |'
  merge: -1
