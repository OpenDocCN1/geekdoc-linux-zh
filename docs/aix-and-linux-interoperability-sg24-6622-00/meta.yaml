  md: "# Configuring the /etc/printcap file to print on a remote printer\n\nLPRng\
    \ uses /etc/printcap as the configuration file. In order to print to a remote\
    \ printer on AIX, the /etc/printcap file should contain lines similar to the following:\n\
    \n```\nlp|pclq|aix_printer:\\\n:sd=/var/spool/lpd/pclq:\\\n:rm=aix_host:\\\n:rp=pclq:\\\
    \n:sh:\n```\n\nThe various entries are:\n\n+   - pclq: The printer name or the\
    \ name of the AIX queue.\n- /var/spool/lpd/: The local spool directory on Linux.\n\
    - aix_host: The resolvable system name of AIX.\n\nFor every new printer, you have\
    \ to add a similar entry in the /etc/printcap file. For more information, refer\
    \ to the man pages of **printcap**.\n\nAfter you make the changes in the printcap\
    \ file, restart the lpd daemon. You can do that by executing the **/etc/rc.d/init.d/lpd\
    \ restart** or **/etc/rc.d/lpd restart** command, depending on your Linux distribution.\n\
    \nIf you have just the above entry in the /etc/printcap file, you can print to\
    \ the remote printer on AIX using the **1pr** command, as the default printer\
    \ is the remote printer. For example:\n\n```\n# lpr /etc/printcap.local\n# lpq\n\
    Printer: lp@localhost 'aix_printer' (dest pclq@aix)\n Queue: no printable jobs\
    \ in queue\n Server: no server active\n Status: job 'root@localhost+849' saved\
    \ at 14:49:13.013\n Rank  Owner/ID                Class  Job Files           \
    \     Size Time\ndone   root@localhost+849        A    849 /etc/printcap.local\
    \     603\n16:39:33\nQueue  Dev  Status      Job    Name              From   \
    \     To\n                                   Submitted       Rnk Pri      Blks\
    \ Cp       PP %\n------ ---- ----------- ------ --------------- ---------- ---\
    \  ------- ---  ---- --\npclq   lp0  READY\n```\n\nMost of the entries are self-explanatory.\
    \ Refer to the **1pq** man pages for a description of all the fields."
  merge: -1
