    **Choosing the suffix**

    All DNs administered at one site share one or more suffixes. That is typically
    a DN referring to the site. The one we are going to use throughout this redbook
    is "dc=weeorg,dc=com". Select **Settings -> Suffixes** to input the suffix in
    the **Suffix DN** box. Directory servers commonly feature multiple suffixes and
    databases, but one suffices in this text.


    **Starting and stopping the server**

    At this point, you can start the server by clicking on the power button, which
