  md: '# *Example 9-3* *Ipsec.secrets example*


    ```

    10.10.5.20              10.10.4.35       : "secret"

    ```


    The ipsec.conf file is a text-based file formed by one or more sections. The first
    section contains a section that deals specifically with FreeS/WAN settings, like
    interfaces and connections to be negotiated when IPSec is enabled. The line that
    defines the default gateway as the interface for all the VPN tunnels is:


    ```

    interfaces=%defaultroute

    ```


    Some parameter values are preceded by a "%", which indicates a system variable
    that is loaded by FreeS/WAN when the tunnel is brought up. To turn on the KLIPS
    and Pluto debugging, we use the following lines:


    ```

    klipsdebug=all

    plutodebug=all

    ```


    To tell Pluto to search (%search) for connections to negotiate, we use the following
    lines:


    ```

    plutoload=%search

    plutostart=%search

    ```


    Pluto scans the ipsec.conf file for connections that will be loaded (con sections)
    and negotiates access for the VPN tunnel when necessary. To set the default settings
    for all parameters for all tunnels that follow, we use the following line:


    ```

    conn %default

    ```


    To tell IKE to attempt to re-key a failed connection, we use the following line:


    ```

    keyingtries=1

    ```


    Finally to set the authentication method for FreeS/WAN to be a public shared Ikey(PSK),
    we use the following line:


    ```

    authby=secret

    ```


    The public shared key is generally a secret alphanumeric string shared by both
    parts. This secret is defined in the ipsec.secrets file.


    You can find more about Frees/WAN advanced configuration at:


    http://www.freeswan.org/freeswan_trees/freeswan-1.98b/doc/adv_config.html'
  merge: -1
  pgno: 204
