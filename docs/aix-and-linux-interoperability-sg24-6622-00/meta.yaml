    # ## 4.1.3 Network Time Protocol (NTP)


    Network Time Protocol is an Internet Protocol used to synchronize computer clocks.
    The reference time may be a single source, but it is usually multiple sources.


    Having your clocks synchronized in all your systems is as important as having
    a solid network strategy, especially when administering distributed applications,
    Web services, or a distributed security monitoring tool. In these cases, it is
    a must to have all clocks synchronized.


    NTP is a fault-tolerant protocol that will automatically select the best of several
    available time sources to synchronize to. In other words, an NTP server is able
    to tell good time sources from the bad ones given that it has been provided with
    enough servers. Then, it picks one of the servers deemed eligible for the synchronization
    purpose. Therefore, and also for backup, it is important that every NTP server
    is provided with at least three lower-stratum NTP servers. For increased availability,
    these servers should be on different network paths and administered by different
    entities.


    # ## Configuring the NTP setup


    NTP needs a reference clock that defines the time to operate by and all clocks
    are set based on that time.


    NTP use UDP. NTP servers such as xntpd relies on multiple time reference providers.
    NTP automatically selects the best of several available time sources to synchronize
    to. Multiple candidates can be combined to minimize the accumulated error. The
    NTP selection algorithm of one reference source eliminates all other references,
    not only those who are too far from the calculated mean value of them all.


    # ## Implementation examples


    To configure our NTP setup, we need to define a reference clock that defines the
    *reference time*, and configure the clients clock based from that *reference time*.'
