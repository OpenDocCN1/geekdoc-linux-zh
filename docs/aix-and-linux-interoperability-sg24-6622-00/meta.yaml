- img_proc: false
  md: 'An RPC program handles the ACLs between clients and servers. Using ACLs can
    cause unexpected behavior, as the NFS clients cannot see the ACLs. For example,
    a directory or file''s permission bits may show write access to the client, but
    if the ACL associated with that file does not permit write, then the client would
    not be able to write to that file. The permissions on a server are set according
    to the ACLs, causing a client to get permissions error.


    Even though AIX supports ACLs over NFS, the general ACL support on Linux is very
    recent and still considered experimental. When implemented partly or not well
    understood, use of ACL and NFS may result in a security risk. For more information
    on the Linux ACL development, refer to the following Web site:


    <http://acl.bestbits.at/>


    # 7.6.4 NFS locking


    Locking is a mechanism by which the data integrity of a shared file is maintained.
    By applying locking, processes can safely modify and access shared files. Most
    of the time, the user is not required to know the details of locking and how is
    it implemented. But in an NFS environment, where more than one machine can access
    the same file, the problem of recovering from a server or client crash is handled
    in a different way.


    The problems related to locking in a network context are:


    +   - If the client crashes, the server must release the locks.

    - If the server crashes, clients should be able to recover their locks.


    NFS is a *stateless* protocol and does not deal with locking itself. The recovery
    from server or client crash is handled using two daemons:


    +   - lockd

    - statd


    The lock daemon cooperates with the status daemon to ensure that it is notified
    of relevant machine crashes. Figure 7-1 on page 161 shows the locking mechanism
    used by NFS.'
