  \ | 内内核识别的设备文件。 |\n| Mount | .mount | 文件系统挂载点。 |\n| Path | .path | 文件系统中的文件或目录。\
  \ |\n| Scope | .scope | 外部创建的进程。 |\n| Slice | .slice | 管理系统进程的分级组织单元组。 |\n| Snapshot\
  \ | .snapshot | systemd 管理器的保存状态。 |\n| Socket | .socket | 进程间通信套接。 |\n| Swap | .swap\
  \ | 交换设备或交换文件。 |\n| Timer | .timer | systemd 定器。 |\n\n表 11-1\n\n注意，目标单元类型与其他类型的不同在于，它由一组服务或其他目标的\
  \ systemd 单元组成。\n\n## 11.6 动态更改当前目标\n\n之前概述的 `systemctl set-default` 命令指定下次系统启动时将使用的目标，但不会更改当前系统的状态。要动态切换到不同的目标，请再次使用\
