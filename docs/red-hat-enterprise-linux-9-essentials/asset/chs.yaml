  \ link noprefix\n      valid_lft forever preferred_lft forever\n3: veth1d7e073@if2:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue master podman state UP\
  \ group default qlen 1000\n   link/ether 3e:3a:54:b8:d8:e1 brd ff:ff:ff:ff:ff:ff\
  \ link-netns netns-658a3069-5c69-185f-ef34-621107daa71\n   inet6 fe80::3c3a:54ff:feb8:d8e1/64\
  \ scope link\n      valid_lft forever preferred_lft forever\n6: podman0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue state UP group default qlen 1000\n   link/ether 3e:3a:54:b8:d8:e1\
  \ brd ff:ff:ff:ff:ff:ff\n   inet 10.88.0.1/16 brd 10.88.255.255 scope global podman0\n\
  \      valid_lft forever preferred_lft forever\n   inet6 fe80::45e:83ff:fe68:4067/64\
  \ scope link\n      valid_lft forever preferred_lft forever\n\n在示例中，宿主机有一个名为 `eno1`\
  \ 的接口连接到外部网络，IP 地址为 `192.168.86.35`。此外，还创建了一个名为 `podman0` 的虚拟接口并分配了 IP 地址 `10.88.0.1`。在宿主机运行的容器上运行相同的\
  \ `ip` 命令可能会如下输出：\n\n```bash\nip a\n```\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536\
  \ qdisc noqueue state UNKNOWN group default qlen 1000\n   link/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n   inet 127.0.0.1/8 scope host lo\n      valid_lft forever\
  \ preferred_lft forever\n   inet6 ::1/128 scope host\n      valid_lft forever preferred_lft\
  \ forever\n2: eth0@if3: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue\
  \ state UP group default qlen 1000\n   link/ether b6:fb:88:16:8b:5e brd ff:ff:ff:ff:ff:ff\
  \ link-netnsid 0\n   inet 10.88.0.8/16 brd 10.88.255.255 scope global eth0\n   \
  \   valid_lft forever preferred_lft forever\n   inet6 fe80::b4fb:88ff:fe16:8b5e/64\
  \ scope link\n      valid_lft forever preferred_lft forever\n\n在这种情况下，容器的 IP 地址为\
  \ `10.88.0.8`。在宿主机上运行 `ping` 命令可以验证宿主机和容器确实在同一个网段内：\n\n```bash\nping 10.88.0.8\n\
  ```\n\n\n\n\n\nPING 10.88.0.8 (10.88.0.8) 56(84) bytes of data.\n\n64 bytes from\
  \ 10.88.0.28: icmp_seq=1 ttl=64 time=0.056 ms\n64 bytes from 10.88.0.28: icmp_seq=2\
  \ ttl=64 time=0.039 ms\n.\n.\n\n我们还可以使用 `podman network ls` 命令来获取主机系统上当前可用容器网络列表：\n\
  \n```bash\npodman network ls\n```\n\nNETWORK ID NAME DRIVER\n2f259bab93aa podman\
  \ bridge\n\n可以使用以下命令显示有关容器网络的详细信息，在本例中，即上述 `podman` 网络：\n\n```bash\npodman network\
  \ inspect podman\n```\n\n```json\n[\n    {\n        \"name\": \"podman\",\n    \
  \    \"id\": \"2f259bab93aaaaa2542ba43ef33eb990d0999ee1b4b557b7be53c0b7a1bb9\",\n\
  \        \"driver\": \"bridge\",\n        \"network_interface\": \"podman0\",\n\
  \        \"created\": \"2023-04-11T08:49:20.489892751-04:00\",\n        \"subnets\"\
  : [\n            {\n                \"subnet\": \"10.88.0.0/16\",\n            \
  \    \"gateway\": \"10.88.0.1\"\n            }\n        ],\n        \"ipv6_enabled\"\
  : false,\n        \"internal\": false,\n        \"dns_enabled\": false,\n      \
  \  \"ipam_options\": {\n            \"driver\": \"host-local\"\n        }\n    }\n\
  ]\n```\n\n使用以下语法创建新的容器网络：\n\n```bash\npodman network create <network name>\n```\n\
  \n例如，要创建一个名为 `demonet` 的新网络，可以使用以下命令：\n\n```bash\npodman network create demonet\n\
  ```\n\n可以使用 `podman network ls` 命令来验证新网络是否存在：\n\n```bash\npodman network ls\n```\n\
  \nNETWORK ID NAME DRIVER\n9692930055dc demonet bridge\n2f259bab93aa podman bridge\n\
  \n一旦创建了网络，可以如下所示将其分配给容器：\n\n```bash\npodman network connect demonet mycontainer\n\
  ```\n\n相反，可以使用 `podman network disconnect` 命令将容器从网络断开：\n\n```bash\npodman network\
  \ disconnect demonet mycontainer\n```\n\n当创建新的容器网络时，在 `/etc/containers/networks`\
  \ 目录下会生成一个名为 `<network name>.json` 的配置文件。在上面的示例中，将创建一个名为 `demonet.json` 的文件，内容如下：\n\
  \n```json\n{\n    \"name\": \"demonet\",\n    \"id\": \"9692930055dc6ceea5cc4d0720df548daa521fe62e23ca3659a9815664bca2f6\"\
  ,\n    \"driver\": \"bridge\",\n    \"network_interface\": \"podman1\",\n    \"\
  created\": \"2023-04-10T16:54:35.618056082-04:00\",\n    \"subnets\": [\n      \
  \  {\n            \"subnet\": \"10.89.0.0/24\",\n            \"gateway\": \"10.89.0.1\"\
  \n        }\n    ],\n    \"ipv6_enabled\": false,\n    \"internal\": false,\n  \
  \  \"dns_enabled\": true,\n    \"ipam_options\": {\n        \"driver\": \"host-local\"\
  \n    }\n}\n```\n\n可以对此文件进行修改以更改设置，例如子网地址范围、IPv6 支持和网络类型（本例设置为 bridge），以实现不同的配置。最后，我们可以使用以下命令删除自定义网络：\n\
  \n```bash\npodman network rm demonet\n```\n\n## 28.12 在 Cockpit 中管理容器\n\n除了本章概述的命令行工具外，还可以使用\
  \ Cockpit Web 界面创建和管理 Linux 容器。假设系统已安装并启用了 Cockpit，并且已完成登录 Red Container Registry\
  \ 的步骤，登录 Cockpit 并选择 Podman Containers 选项。如果 Cockpit 中未安装 Podman 模块，打开终端窗口并运行以下命令：\n\
  \n```bash\ndnf install cockpit-podman\n```\n\n如有必要，点击按钮启动 Podman 服务，此时屏幕应类似于图 28-1\
  \ 所示。第一步是下载一个镜像作为容器的基础（除非已使用命令行工具下载了镜像）。要执行下载，点击上方图 28-1 中由箭头标记的菜单按钮，并选择 Download\
  \ image 选项。当搜索对话出现时，在搜索框中输入关键词。图 28-2 显示了搜索 RHEL 9 通用镜像的结果。\n\n一旦找到镜像，选择它并点击 Download\
  \ 按钮从仓库中拉取。下载完成后，它将出现在镜像列表中，如下。\n\n## 28.13 总结\n\n本章介绍了如何使用 `podman`、`skopeo` 和\
  \ `buildah` 工具以及 Cockpit Web 界面在 RHEL 上创建和管理 容器，包括从仓库获取镜像以及从零构建新镜像。\n\n# 29. 在 RHEL\
  \ 9 上设置服务器\n\nApache 服务器是 RHEL 9 许多软件包之一。RHEL 9 的扩展性和韧性使其成为托管高流量网站的理想平台。本章将解释如何在\
  \ RHEL 9 上配置 Apache 作为 Web 服务器，包括安全（HTTPS）和不安全（HTTP）配置。\n\n## 29.1 配置 RHEL 9 服务器的要求\n\
  \n要设置自己的网站，您需要计算机（或云服务器实例）、操作系统、Web 服务器、域名、名称服务器以及一个 IP 地址。在操作系统方面，我们假设使用的是 RHEL\
  \ 9。如前所述，RHEL 9 支持 Apache 服务器，在操作系统启动后可以轻松安装。此外，可以使用任何域名注册服务注册域名。\n\n如果你在云实例上运行\
  \ RHEL 9，提供商分配的 IP 地址将位于服务器概信息中。然而，如果你托管自己的服务器且互联网服务提供商（ISP）分配了静态 IP 地址，你必须将域名与该地址关联。这是通过名称服务器实现的。\n\
  \n如果你没有静态 IP 地址（即 ISP 提供的是经常变化的动态地址），可以使用若干免费的动态 DNS（DDNS 或简称 DynDNS）服务将您的动态 IP\
  \ 地址映射到您的域名。\n\n一旦配置了域名和名称服务器，下一步是安装并配置 Web 服务器。\n\n### 29.2 安装 Apache 服务器软件包\n\n\
  当前版本的 RHEL 默认不安装 Apache Web 服务器。要检查是否已安装，运行以下命令：\n\n```bash\nrpm -q httpd\n```\n\
  \n\n\n\n\n如果 `rpm` 生成了类似下面的输出，则表示 Apache 服务器已经安装：\n\n```\nhttpd-2.4.53-7.el9_1.5.x86_64\n\
  ```\n\n或者，如果 `rpm` 生成了“package httpd is not installed”的消息，下一步是安装它。要安装 Apache，请在命令行提示符中运行以下命令：\n\
  \n```\ndnf install httpd\n```\n\n## 29.3 配置防火墙\n\n在启动和测试 Apache Web 服务器之前，必须修改防火墙以允许\
  \ Web 服务器与外部世界通信。默认情况下，`HTTP` 和 `HTTPS` 协议分别使用端口 80 和 443，因此，取决于所使用的协议，需要打开其中一个或两个端口。在打开端口时，请务必指定适用于面向互联网的网络连接的防火墙区域：\n\
  \n```\nfirewall-cmd --permanent --zone=<zone> --add-port=80/tcp\nfirewall-cmd --permanent\
  \ --zone=<zone> --add-port=443/tcp\n```\n\n打开必要的端口后，请务必重载防火墙设置：\n\n```\nfirewall-cmd\
  \ --reload\n```\n\n在云托管服务器上，可能还需要在云控制台中为服务器实例启用相应的端口。请检查云提供商的文档以获取执行此步骤。\n\n## 29.4\
  \ 端口转发\n\n假设托管 Web 服务器的 RHEL 9 系统位于受防火墙保护的网络中（另一台运行防火墙的计算机、路由器或包含内置防火墙保护的无线基站）。情况下，你必须配置防火墙将端口\
  \ 80 和 443 转发到你的 Web 服务器系统。执行此操作的机制在防火墙和设备之间不同，因此请检查您的文档了解如何配置端口转发。\n\n## 29.5 启动\
  \ Apache Web 服务器\n\n一旦安装了 Apache 并配置了防火墙，下一步是验证服务器正在运行并在时启动它。\n\n要从命令行检查 Apache\
  \ 服务的状态，请在命令行提示符输入以下内容：\n\n```\nsystemctl status httpd\n```\n\n如果上述命令指示 `httpd`\
  \ 服务未运行，可以按如下方式从命令行启动它：\n\n```\nsystemctl start httpd\n```\n\n如果您希望 Apache `httpd`\
  \ 服务在系统启动时自动启动，请运行以下命令：\n\n```\nsystemctl enable httpd\n```\n\n## 29.6 测试 Web 服务器\n\
  \n安装完成后，下一步是验证 Web 服务器是否正在运行。\n\n如果您可以（本地或远程）访问服务器的桌面环境，请启动 浏览器并在地址栏中输入 `http://127.0.0.1`（`127.0.0.1`\
  \ 是回环网络地址，告诉系统连接到本地机器）。如果所有设置正确，浏览器应该加载如图 29-1 所示的测试页面：\n\n```\n![](img/rhel_apache_test_page.png)\n\
  ```\n图 29-1\n\n如果无法使用桌面环境，请从服务器所在的同一局域网中的另一个系统连接，或者如果是远程托管的，请使用分配给系统的外部 IP 地址。\n\
  \n## 29.7 为您的域名配置 Apache Web 服务器\n\n设置 Web 服务器的下一步是为您的域名进行配置。要配置 Web 服务器，首先更改目录到\
  \ `/etc/httpd`，该目录包含若干文件和子目录。进入 `conf` 子目录，你将在其中找到一个名为 `httpd.conf` 的文件，其中包含 Apache\
  \ 服务器的配置设置。\n\n使用具有超级用户权限的您常用的编辑器编辑 `httpd.conf` 文件，以确保你有权限访问并修改该文件。加载文件后，需要更改几项设置以匹配您的环境。\n\
  \n为特定域名配置 Apache 的最方法是在 `httpd.conf` 文件中添加虚拟主机条目。这允许单个 Apache 服务器通过为每个站点域名添加虚拟主机条目来支持多个网站。在\
  \ `httpd.conf` 文件中，按如下所示为您的域名添加虚拟主机条目：\n\n```apache\n<VirtualHost *:80>\n    ServerAdmin\
  \ feedback@myexample.com\n    ServerName www.myexample.com\n    DocumentRoot /var/www/myexample\n\
  \    ErrorLog logs/myexample_error_log\n    CustomLog logs/myexample_access_log\
  \ combined\n</VirtualHost>\n```\n\n上述虚拟主机条目中的 `ServerAdmin` 指令定义了想要联系您站点 Web 管理员的人员电子邮件地址。请将其更改为可以联系到您的适当电子邮件地址。\n\
  \n接下来，声明 `ServerName`，以便 Web 服务器知道与此虚拟主机关联的域名。\n\n由于服务器支持的每个网站将有自己的文件，因此使用 `DocumentRoot`\
  \ 设置来指定该网站域名文件的位置。传统上使用 `/var/www/domain-name`，例如：\n\n```apache\nDocumentRoot /var/www/myexample\n\
  ```\n\n最后，为访问历史和错误日志文件添加条目。\n\n按照 `httpd.conf` 文件中的声明创建 `/var/www/<domain name>`\
  \ 目录，并在其中放置一个包含基础 HTML 的 `index.html` 文件。例如：\n\n```html\n<html>\n<title>Sample Web\
  \ Page</title>\n<body>\nWelcome to MyExample\n</body>\n</html>\n```\n\n最后一步是重启 `httpd`\
  \ 服务以确保新设置生效：\n\n```\nsystemctl restart httpd\n```\n\n最后，通过浏览器访问域名（而不是 IP 地址）来检查服务器工作正常。加载的\
  \ 页面应该是上面创建的 `index.html`。\n\n## 29.8 安全网站的基础\n\n本章创建的 Web 服务器和网站使用端口 80 上的 `HTTP`\
  \ 协议，因此被认为是不安全的。问题在于服务器与客户端（通常是用户的浏览器）之间的流量是明文传输的。也就是说，数据未加密且易被截获。在执行登录网站或传输敏感信息等任务时，这是一个严重的缺陷。\n\
  \n如今，网站预计使用 `HTTPS`，它建立了安全的加密通信。这种安全性通过公钥、私钥和会话加密的使用来实现。\n\n为了支持 `HTTPS`，网站必须拥有由受信任权威（CA）颁发的证书。当浏览器连接到安全网站时，Web\
  \ 服务器会发送网站的 SSL 证书，其中包含网站的公钥。浏览器随后验证证书的真实性。\n\n如果证书有效，浏览器使用发送的公钥加密会话密钥并传递给服务器。服务器使用私钥解密密钥以发送加密确认。一旦完成此过程，浏览器和服务器在使用会话密钥加密后续数据。\n\
  \n## 29.9 为 Apache 配置 HTTPS\n\n默认情况下，Apache 服务器不包含实现安全 HTTPS 网站所需的模块。因此，第一步是在服务器系统上安装\
  \ Apache `mod_ssl` 模块：\n\n```\ndnf install mod_ssl\n```\n\n安装完成后重启 `httpd` 将新模块加载到\
  \ Apache 服务器中：\n\n```\nsystemctl restart httpd\n```\n\n使用以下命令检查模块是否已加载到服务器：\n\n\
  ```\nhttpd -M | grep ssl_module\n```\n\n```\nssl_module (shared)\n```\n\n一旦 `ssl_module`\
  \ 安装完成，重复本章上一节的步骤为网站创建配置文件，这次使用 `sites-available/default-ssl.conf` 文件作为站点配置文件的模板。\n\
  \n\n\n\n\n假设模块已安装，下一步是为网站生成 SSL 证书。\n\n## 29.10 获取 SSL 证书\n\n网站的证书必须从证书颁发机构（Certificate\
  \ Authority）获取。有多种价格范围的选择供选择。然而，到目前为止最好的选项是从以下 URL 从 Let’s Encrypt 获取免费证书：\n\n[`letsencrypt.org/`](https://letsencrypt.org/)\n\
  \n从 Let’s Encrypt 获取证书涉及安装和运行 `Certbot` 工具。该工具将扫描服务器上的 Apache 配置文件，并提供为系统上配置的任何虚拟主机生成证书的选项。随后，它将生成证书并为相应的网站在\
  \ Apache 配置文件中添加虚拟主机条目。\n\n按照 Let’s Encrypt 网站上的步骤在您的 RHEL 9 系统上下载并安装 `Certbot`，然后按照如下方式运行\
  \ `certbot` 工具来生成并安装证书：\n\n```\ncertbot --apache\n```\n\n在请求电子邮箱地址并寻求接受服务条款后，`certbot`\
  \ 将列出在 `httpd.conf` 文件中找到域名，并允许选择一个或多个需要安装证书的站点。`Certbot` 然后在获取并将证书安装到系统之前将执行一些检查：\n\
  \n您想为哪些名称激活 HTTPS？\n\n- - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - -\n\n1: www.myexample.com\n\n- - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - -\n\n用逗号和/或空格分隔适当的数字，或留空输入以选择显示的所有选项（按\
  \ ‘c’ 取消）：1\n\n获取新证书\n\n正在执行以下挑战：\n\n针对 www.myexample.com 的 http-01 挑战\n\n等待验证...\n\
  \n正在清理挑战\n\n在 `/etc/httpd/conf/httpd-le-ssl.conf` 创建了 SSL 虚拟主机\n\n将证书部署到虚拟主机 `/etc/httpd/conf/httpd-le-ssl.conf`\n\
  \n通过向根配置中添加 Include 来启用站点 `/etc/httpd/conf/httpd-le-ssl.conf`\n\n`Certbot` 还会在 `/etc/httpd/conf/`\
  \ 目录下创建一个名为 `httpd-le-ssl.conf` 的新文件，其中包含每个已生成证书的域名的安全虚拟主机条目。这些条目将类似于：\n\n```\n\
  <IfModule mod_ssl.c>\n\n<VirtualHost *:443>\n    ServerAdmin feedback@myexample.com\n\
  \    ServerName www.myexample.com\n    DocumentRoot /var/www/myexample\n    ErrorLog\
  \ logs/myexample_error_log\n    CustomLog logs/myexample_access_log combined\nSSLCertificateFile\
  \ /etc/letsencrypt/live/www.myexample.com/fullchain.pem\nSSLCertificateKeyFile /etc/letsencrypt/live/www.myexample.com/privkey.pem\n\
  Include /etc/letsencrypt/options-ssl-apache.conf\n</VirtualHost>\n</IfModule>\n\
  ```\n\n最后，`Certbot` 将询问服务器是否将未来的 HTTP Web 请求重定向到 HTTPS。换句话说，如果用户尝试访问 `http://www.myexample.com`，Web\
  \ 服务器将用户重定向到 `https://www.myexample.com`：\n\n请选择是否将 HTTP 流量重定向到 HTTPS 以移除 HTTP 访问。\n\
  \n- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ -\n\n1: 不重定向 - 不对 Web 服务器配置进行进一步更改。\n\n2: 重定向 - 将所有请求重定向到安全的 HTTPS 访问。对于新站点或如果您确定您的站点在\
  \ HTTPS 上运行良好，请选择此项。您可以通过编辑 Web 服务器的配置来撤销此更改。\n\n- - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - -\n\n选择适当的数字 [1-2] 然后按 [enter]（按 ‘c’\
  \ 取消）：2\n\n如果您正在测试 HTTPS 配置并希望稍后保留 HTTP 版本，请选择“不重定向”选项。否则，通常建议重定向到 HTTPS。\n\n证书安装后，请在浏览器中访问以下\
  \ URL 进行测试（将 myexample.com 替换为您自己的域名）：\n\n[`www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com`](https://www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com)\n\
  \n如果证书配置成功，SSL Labs 将提供高评分，如图图 29-2 所示：\n\n![](img/rhel_8_ssl_labs_report.png)\n\
  \n图 29-2\n\n作为最后的测试，打开浏览器窗口并使用 `https://` 前缀导航到域名。页面应像以前一样加载，浏览器应指示浏览器与服务器之间的连接是安全的（通常由地址栏中的锁图标指示，点击它可以查看更多信息）：\n\
  \n![](img/rhel_8_ssl_labs.png)\n\n图 29-3\n\n## 29.11 总结\n\n网站的证书必须从证书颁发机构获取。有多种价格范围的选择供选择。然而，到目前为止最好的选项是从以下\
  \ URL 从 Let’s Encrypt 获取免费证书：\n\n[`letsencrypt.org/`](https://letsencrypt.org/)\n\
  \n从 Let’s Encrypt 获取证书涉及安装和运行 `Certbot` 工具。该工具将扫描服务器上的 Apache 配置文件，并提供为系统上配置的任何虚拟主机生成证书的选项。随后，它将生成证书并为相应的网站在\
  \ Apache 配置文件中添加虚拟主机条目。\n\n按照 Let’s Encrypt 网站上的步骤在您的 RHEL 9 系统上下载并安装 `Certbot`，然后按照如下方式运行\
  \ `certbot` 工具来生成并安装证书：\n\n```\ncertbot --apache\n```\n\n在请求电子邮箱地址并寻求接受服务条款后，`certbot`\
  \ 将列出在 `httpd.conf` 文件中找到域名，并允许选择一个或多个需要安装证书的站点。`Certbot` 然后在获取并将证书安装到系统之前将执行一些检查：\n\
  \n假设模块已安装，下一步是为网站生成 SSL 证书。\n\n## 30.1 邮件系统结构\n\n多个组件构成了一个完整的邮件系统。以下是对每个组件的简要描述：\n\
  \n### 30.1.1 邮件代理\n\n典型用户可能最熟悉系统的这部分。邮件代理（MUA），或邮件客户端，是用于编写、发送和读取邮件的应用程序。任何在计算机上编写和发送过邮件的人都使用过某种类型的邮件代理。\n\
  \nLinux 上典型的 MUA 有 `Evolution`、`Thunderbird` 和 `KMail`。对于那些偏好文本邮件客户端的用户，还有传统的 `Pine`。\n\
  \n### 30.1.2 邮件传输代理\n\n邮件传输代理（MTA）是邮件系统中负责将邮件从一台计算机传输到另一台计算机的部分（无论是局域网内还是通过互联网到远程系统）。一旦配置正确，大多数用户只会直接与他们选择的\
  \ `MTA` 交互。Linux 许多许多 MTA 选择，包括 `Sendmail`、`Postfix`、`Fetchmail`、`Qmail` 和 `Exim`。\n\
  \n### 30.1.3 邮件投递代理\n\n另一个对用户隐藏的部分，邮件投递代理（MDA）在后台运行，并在邮件传输代理和邮件客户端（MUA）之间执行邮件过滤。最常见的\
  \ MDA 形式是垃圾邮件过滤器，在邮件到达用户收件箱之前从系统中移除所有不需要的邮件。流行的 MDA 有 `Spamassassin` 和 `Procmail`。需要注意的是，某些邮件代理应用程序（如\
  \ `Evolution`、`Thunderbird` 和 `KMail`）内置了 `MDA` 过滤功能。\n\n### 30.1.4 SMTP\n\n\n\n\
  \n\nSMTP 是 `Simple Mail Transport Protocol`（简单邮件传输协议）的缩写。邮件系统使用该协议将邮件从一个服务器传输到另一个服务器。该协议是\
  \ `MTAs` 用于相互通信和往返传输消息的语言。\n\n### 30.1.5 SMTP 中继 (SMTP Relay)\n\nSMTP 中继是一种允许外部\
  \ SMTP 服务器发送邮件而不是托管本地 SMTP 服务器的协议。这通常涉及使用如 `Mailjet`、`SendGrid` 或 `MailGun` 等服务。这些服务避免了配置和维护自己的\
  \ SMTP 服务器，并且通常还能提供分析等额外优势。\n\n## 30.2 配置 RHEL 9 邮件服务器\n\n许多系统使用 `Sendmail` MTA\
  \ 来传输邮件消息；在许多 Linux 发行版中，它是默认的 `Mail Transfer Agent`（邮件传输代理）。遗憾的是，`Sendmail` 是一个复杂的系统，对于初学者和经验丰富的用户都可能难以理解和配置。它也逐渐失去流行，因为它被认为处理邮件消息的速度比许多较新的可用\
  \ `MTAs` 都要慢。\n\n许多系统管理员现在使用 `Postfix` 或 `Qmail` 来处理邮件。两者都比 `Sendmail` 更快且更容易配置。\n\
  \n因此，在本章中我们将 `Postfix` 作为一种 MTA，因为它的简单性和流行。然而，如果你倾向于使用 `Sendmail`，有很多专门研究该主题的书籍，它们对该主题的讲解将比本章要深入得多。\n\
  \n作为第一步，本章将介绍如何配置 RHEL 9 系统作为一个完整的邮件服务器运行。在本章的后后部分，还将介绍使用 SMTP 中继服务的步骤。\n\n## 30.3\
  \ Postfix 安装前的步骤\n\n在安装 `Postfix` 之前的第一步是确保系统中已经没有在运行 `Sendmail`。你可以使用以下命令进行检查：\n\
  \n```\n# systemctl status sendmail\n```\n\n如果未安装 `sendmail`，该工具将显示一条类似下所示的消息：\n\n\
  ```\nUnit sendmail.service could not be found.\n```\n\n如果 `sendmail` 运行在你的系统上，则在安装和配置\
  \ `Postfix` 之前有必要停止它。要停止 `sendmail`，请运行以下命令：\n\n```\n# systemctl stop sendmail\n\
  ```\n\n下一步是确保在系统重启时 `sendmail` 不会自动重启：\n\n```\n# systemctl disable sendmail\n```\n\
  \n`Sendmail` 现在已关闭并配置为在系统启动时不自动启动。可选情况下，要彻底从系统中删除 `sendmail`，请运行以下命令：\n\n```\n#\
  \ dnf remove sendmail\n```\n\n## 30.4 防火墙/路由器配置\n\n由于发送和接收邮件消息涉及网络连接，必须配置防火墙以允许\
  \ SMTP 流量。如果 `firewalld` 已激活，请如下所示使用 `firewall-cmd` 工具：\n\n```\n# firewall-cmd --permanent\
  \ --add-service=smtp\n```\n\n配置服务器与互联网之间的任何其他防火墙或路由器以允许端口 25、143 和 587 的连接也是必要的，并在将这些端口转发到邮件服务器上相应的端口。\n\
  \n完成这些初始步骤后，我们现在可以安装 `Postfix`。\n\n## 30.5 在 RHEL 9 上安装 Postfix\n\n默认情况下，RHEL 9\
  \ 的安装过程会在大多数配置中安装 `postfix`。要验证 `postfix` 是否已安装，请使用以下 `rpm` 命令：\n\n```\n# rpm -q\
  \ postfix\n```\n\n如果 `rpm` 报告 `postfix` 未安装，则可以通过以下方式安装：\n\n```\n# dnf install postfix\n\
  ```\n\n`dnf` 工具将下载并安装 `postfix`，并在 `/etc/passwd` 文件中配置一个特殊的 `postfix` 用户。\n\n##\
  \ 30.6 配置 Postfix\n\n`postfix` 的主要配置设置位于 `/etc/postfix/main.cf` 文件中。互联网上的许多资源提供了关于\
  \ `postfix` 的详细信息，因此本节将侧重于让邮件运行所需的基础选项。尽管 `dnf` 安装设置了一些基础配置选项，但它倾向于漏掉某些设置并对其他设置进行错误的猜测，因此请仔细检查\
  \ `main.cf` 文件。\n\n`main.cf` 文件中的关键选项如下：\n\n```\nmyhostname = mta1.domain.com\n\
  mydomain = domain.com\nmyorigin = $mydomain\nmydestination = $myhostname, localhost.$mydomain,\
  \ localhost, $mydomain\ninet_interfaces = $myhostname\nmynetworks = subnet\n```\n\
  \n其他设置要么已经由安装过程为你设置好，要么只有在你感到冒险并想要配置一个更复杂的邮件系统时才需要。\n\n`myhostname` 的格式为 `host.domain.com`。例如，如果你的系统名为\
  \ `Host` 且域名为 `Domain.com`，你会将 `myhostname` 设置为：\n\n```\nmyhostname = host.domain.com\n\
  ```\n\n`mydomain` 设置只是上述的域名部分。例如：\n\n```\nmydomain = domain.com\n```\n\n`myorigin`\
  \ 设置定义了邮件在到达收件人收件箱时看起来源自的域名名称，它应该设置为你的域名：\n\n```\nmyorigin = $mydomain\n```\n\n\
  最关键的参数之一 `mydestination` 与此服务器作为最终终点的域名有关。任何不在此列表中的入邮件都将导致投递失败：\n\n```\nmydestination\
  \ = $myhostname\n```\n\n`inet_interfaces` 设置定义了允许允许 `postfix` 接收邮件的系统网络接口，通常设置为\
  \ `all`：\n\n```\ninet_interfaces = all\n```\n\n`mynetworks` 设置定义了哪些外部系统被信任可以使用该服务器作为中继。此设置的可能值如下：\n\
  \n- `host`：仅信任本地系统。拒绝所有外部客户端将服务器作为中继的尝试。\n- `subnet`：只有同一网络上的系统可以使用服务器作为中继。例如，如果服务器的\
  \ IP 地址为 `192.168.1.29`，则 IP 地址为 `192.168.1.30` 的客户端系统可以使用服务器作为中继。\n- `class`：同一地址类（A、B、C\
  \ 类）内的任何系统都可以使用服务器作为中继。\n\n可以通过手动指定子网、地址范围或引用模式文件来手动定义信任的 IP 地址。以下示例将本地主机和子网 `192.168.0.0/24`\
  \ 声明为信任 IP 地址：\n\n```\nmynetworks = 192.168.0.0/24, 127.0.0.0/8\n```\n\n对于此示例，将属性设置为\
  \ `subnet`，以便局域网上的任何其他系统都可以服务器作为中继。相比之下，外部系统被禁止这样做：\n\n```\nmynetworks = subnet\n\
  ```\n\n## 30.7 配置 DNS MX 记录\n\n当你向注册商注册并配置域名时，DNS 设置中已经配置了一些默认值。其中之一就是所谓的邮件交换器（MX）记录。该记录定义了发往域名的邮件应该发送到哪里，它通常被设置为注册商提供的邮件服务器。如果你在托管自己的邮件服务器，`MX`\
  \ 记录应设置为你的域名或邮件服务器的 IP 地址。进行此更改的步骤取决于域名注册商，但通常涉及编辑域名的 DNS 信息并添加或编辑 `MX` 记录以指向你的邮件服务器。\n\
  \n## 30.8 在 RHEL 9 系统上启动 Postfix\n\n一旦 `/etc/postfix/main.cf` 文件配置了正确的设置，现在是启动 `postfix`\
  \ 的时候了。可以通过以下命令行实现：\n\n```\n# systemctl start postfix\n```\n\n如果 `postfix` 已经在运行，请使用以下命令加载配置更改：\n\
  \n```\n# systemctl reload postfix\n```\n\n要配置 `postfix` 在系统启动时自动启动，请运行以下命令：\n\n\
  ```\n# systemctl enable postfix\n```\n\n\n\n\n\nPostfix 进程现在应该启动了。验证一切工作正常的最佳方法是检查你的邮件日志。该日志通常位于\
  \ `/var/log/maillog` 文件中，现在应该包含一条类似于下面输出的条目：\n\n```\nMar 25 11:21:48 demo-server\
  \ postfix/postfix-script[5377]: starting the Postfix mail system\n\nMar 25 11:21:48\
  \ demo-server postfix/master[5379]: daemon started -- version 3.3.1, configuration\
  \ /etc/postfix\n```\n\n只要日志中没有记录错误信息，你就已成功安装并启动了 postfix，并准备好测试 postfix 配置。\n\n\
  ## 30.9 测试 Postfix\n\n测试 postfix 配置的一种简单方法是在系统上的本地用户之间发送电子邮件。要进行快速测试，请按照如下方式使用 `mail`\
  \ 工具（其中将 `name` 和 `mydomain` 分别替换为系统上的用户名和你的域名）：\n\n```\n# mail name@mydomain.com\n\
  ```\n\n在出现提示时，输入邮件的主题，然后输入邮件正文内容。要发送邮件，按 `Ctrl-D`。例如：\n\n```\n# mail demo@mydomain.com\n\
  \nSubject: Test email message\n\nThis is a test message.\n\nEOT\n```\n\n再次运行 `mail`\
  \ 命令，这次使用另一个用户身份，并验证邮件是否已发送和接收：\n\n```\n$ mail\n\nHeirloom Mail version 12.5 7/5/10\\\
  . Type ? for help.\n\n\"/var/spool/mail/demo\": 1 message 1 new\n\n>N 1 root Mon\
  \ Mar 25 13:36 18/625 \"Test email message\"\n\n&\n```\n\n如果邮件没有出现，请检查日志文件（`/var/log/maillog`）是否存在错误。成功的邮件投递将将如下所示显示在日志文件中：\n\
  \n```\nMar 25 13:41:37 demo-server postfix/pickup[7153]: 94FAF61E8F4A: uid=0 from=<root>\n\
  Mar 25 13:41:37 demo-server postfix/cleanup[7498]: 94FAF61E8F4A: message-id=<20190325174137.94FAF61E8F4A@demo-server.mydomain.com>\n\
  Mar 25 13:41:37 demo-server postfix/qmgr[7154]: 94FAF61E8F4A: from=<root@mydomain.com>,\
  \ size=450, nrcpt=1 (queue active)\nMar 25 13:41:37 demo-server postfix/local[7500]:\
  \ 94FAF61E8F4A: to=<neil@mydomain.com>, relay=local, delay=0.12, delays=0.09/0.01/0/0.02,\
  \ dsn=2.0.0, status=sent (delivered to mailbox)\nMar 25 13:41:37 demo-server postfix/qmgr[7154]:\
  \ 94FAF61E8F4A: removed\n```\n\n一旦本地邮件功能正常，尝试向向外部地址（如 GMail 账户）发送邮件。此外，通过从外部账户向你域名上的用户发送邮件来测试接收邮件是否正常。在每情况下，请检查\
  \ `/var/log/maillog` 文件以获取任何错误的解释。\n\n## 30.10 通过 SMTP 中继服务器发送邮件\n\nSMTP 中继服务是配置邮件服务器来处理出站邮件的另一种替代方案。正如之前讨论的，有多种服务可用，其中大多数可以通过在网络上搜索“SMTP\
  \ Relay Service”来找到。这些服务中的大多数将要求你以某种方式验证你的域名，并提供 MX 记录以更新你的 DNS 设置。你还将获得用户名和密码，这些信息必须添加到\
  \ postfix 配置中。本节的剩余部分假设你的系统中已安装了 postfix，并且已完成所选 SMTP 中继提供商要求的所有初始步骤。\n\n从编辑 `/etc/postfix/main.cf`\
  \ 文件开始，用你的域名配置 `myhostname` 参数：\n\n```\nmyhostname = mydomain.com\n```\n\n接下来，在\
  \ `/etc/postfix` 中创建一个名为 `sasl_passwd` 的新文件，并添加包含中继服务提供的邮件服务器主机、用户名和密码的行。例如：\n\n\
  ```\n[smtp.myprovider.com]:587 neil@mydomain.com:mypassword\n```\n\n注意上述条目中指定了端口\
  \ `587`。如果没有此设置，postfix 将默认使用端口 `25`，而该端口被大多数 SMTP 中继服务提供商默认拦截。\n\n创建密码文件后，使用 `postmap`\
  \ 工具生成包含邮件凭据的哈希数据库：\n\n```\n# postmap /etc/postfix/sasl_passwd\n```\n\n在继续之前，采取额外步骤来保护你的\
  \ postfix 凭据：\n\n```\n# chown root:root /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n\
  # chmod 0600 /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n```\n\n再次编辑 `main.cf`\
  \ 文件并添加条目以指定中继服务器：\n\n```\nrelayhost = [smtp.myprovider.com]:587\n```\n\n在 `main.cf`\
  \ 中继续添加内容以启用身份验证：\n\n```\nsasl_auth_maps = hash:/etc/postfix/sasl_passwd\nsasl_password_maps\
  \ = hash:/etc/postfix/sasl_passwd\nsasl_security_mechanism = plain\n```\n\n启用 TLS（可选）：\n\
  \n```\nsmtp_tls_auth = yes\n```\n\n最后，重启 postfix 服务：\n\n```\n# systemctl restart\
  \ postfix\n```\n\n一旦服务重启，尝试使用 `mail` 工具发送并接收邮件。\n\n\n\n\n\n此时，我们可以在新驱动器上创建分区和文件系统，并将其挂载以进行访问，或者将磁盘作为物理卷作为卷组的一部分。要执行前者，请继续阅读本章；否则，请阅读“向\
  \ RHEL 9 卷组和逻辑卷添加新磁盘”了解配置逻辑卷的详情。\n\n## 31.3 创建 Linux 分区\n\n下一步是在新磁盘驱动器上创建一个或多个 Linux\
  \ 分区。这是通过使用 `fdisk` 工具实现的，它接受要分区的设备作为命令行参数：\n\n```\n# fdisk /dev/sdb\n\nWelcome\
  \ to fdisk (util-linux 2.37.4).\n\n更改将仅保留在内存中，直到你决定写入它们。\n\n在使用 write 命令之前请务必小心。\n\
  \n设备不包含识别的分区表。\n\n已创建标识符为 0x64d68d00 的新 DOS 磁盘标签。\n\nCommand (m for help):\n\n查看磁盘上的当前分区，输入\
  \ `p` 命令：\n\nCommand (m for help): p\n\nDisk /dev/sdb: 14.46 GiB, 15525216256 bytes,\
  \ 30322688 sectors\n\nDisk model: USB 2.0 FD\n\nUnits: sectors of 1 * 512 = 512\
  \ bytes\n\nSector size (logical/physical): 512 bytes / 512 bytes\n\nI/O size (minimum/optimal):\
  \ 512 bytes / 512 bytes\n\nDisklabel type: dos\n\nDisk identifier: 0x64d68d00\n\
  ```\n\n从上面的 fdisk 输出中可以看出，磁盘目前没有分区，因为它之前未被使用。下一步是在磁盘上创建一个新分区，该任务通过输入 `n`（表示新分区）和\
  \ `p`（表示主分区）完成：\n\n```\nCommand (m for help): n\n\nPartition type\n   p primary\
  \ (0 primary, 0 extended, 4 free)\n   e extended (container for logical partitions)\n\
  \nSelect (default p): p\n\nPartition number (1-4, default 1):\n```\n\n在本示例中，我们只计划创建一个分区，它将是分区\
  \ `1`。接下来，我们需要指定分区的起始和结束位置。由于这是第一个分区，我们需要它从第一个可用扇区开始，并且由于我们想使用整个磁盘，我们将最后一个扇区指定为结束。请注意，如果你想创建多个分区，可以通过扇区、字节、千字节或兆字节来指定每个分区的大小：\n\
  \n```\nPartition number (1-4, default 1): 1\n\nFirst sector (2048-30322687, default\
  \ 2048):\n\nLast sector, +/-sectors or +/-size{K,M,G,T,P} (2048-30322687, default\
  \ 303226687):\n\nCreated a new partition 1 of type 'Linux' and of size 14.5 GiB.\n\
  \nCommand (m for help):\n```\n\n现在我们已经指定了分区，需要使用 `w` 命令将其写入磁盘：\n\n```\nCommand (m\
  \ for help): w\n\nThe partition table has been altered.\n\nCalling ioctl() to re-read\
  \ partition table.\n\nSyncing disks.\n```\n\n如果现在再次查看设备，我们将看到新分区显示为 `/dev/sdb1`：\n\
  \n```\n# ls /dev/sd*\n\n/dev/sda /dev/sda1 /dev/sda2 /dev/sdb /dev/sdb1\n```\n\n\
  下一步是在我们的新分区上创建文件系统。\n\n## 31.4 在 RHEL 9 磁盘分区上创建文件系统\n\n现在我们安装了一个新磁盘，它对 RHEL 9 可见，并且我们已经在磁盘上配置了一个\
  \ Linux 分区。下一步是在分区上创建一个 Linux 文件系统，以便操作系统可以使用它来存储文件和数据。在分区上创建文件系统的简单方法是使用 `mkfs.xfs`\
  \ 工具：\n\n```\n# mkfs.xfs -f /dev/sdb1\n\nmeta-data=/dev/sdb1 isize=512 agcount=4,\
  \ agsize=947520 blks\n          = sectsz=512 attr=2, projid32bit=1\n          =\
  \ crc=1 finobt=1, sparse=1, rmapbt=0\n          = reflink=1 bigtime=1 inobtcount=1\n\
  data = bsize=4096 blocks=3790080, imaxpct=25\n          = sunit=0 swidth=0 blks\n\
  naming =version 2 bsize=4096 ascii-ci=0, ftype=1\nlog =internal log bsize=4096 blocks=2560,\
  \ version=2\n          = sectsz=512 sunit=0 blks, lazy-count=1\nrealtime =none extsz=4096\
  \ blocks=0, rtextents=0\n```\n\n在这种情况下，我们创建了一个 XFS 文件系统。XFS 是一种高性能文件系统，是 RHEL 9\
  \ 的默认文件系统类型，在并行 I/O 性能和日志的使用方面具有若干优势。\n\n## 31.5 日志文件系统概述\n\n日志文件系统记录了在向文件系统写入期间所更改的日志，可以快速恢复由于系统崩溃或断电等事件导致的损坏。使用日志文件系统有几个优势。首先，存储在磁盘上的数据量呈指数级增长。非日志文件系统的问题是，在崩溃后必须运行\
  \ `fsck`（文件系统一致性检查）工具。`fsck` 工具将扫描整个文件系统，验证块是否正确分配和引用。问题有两个：首先，`fsck` 工具并不总是能够修复损坏，你会得到\
  \ `lost+found` 目录。应用程序可以使用这些数据，但系统知道它们在哪里。\n\n## 31.6 挂载文件系统\n\n现在我们在新分区上创建了文件系统，需要将其挂载以便访问和使用。为了做到这一点，我们需要创建一个挂载点。挂载点只是挂载文件系统的目录或文件夹。在本示例中，我们将创建一个\
  \ `/backup` 目录：\n\n```\n# mkdir /backup\n```\n\n然后可以使用 `mount` 命令手动挂载文件系统：\n\n```\n\
  # mount /dev/sdb1 /backup\n```\n\n运行无参数的 `mount` 命令可以显示所有挂载的文件系统（包括我们的新文件系统）：\n\n\
  ```\n# mount\n\nproc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\nsysfs\
  \ on /sys type sysfs (rw,nosuid,nodev,noexec,relatime,seclabel)\n/dev/sdb1 on /backup\
  \ type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)\n\
  ```\n\n## 31.7 配置 RHEL 9 自动挂载文件系统\n\n为了设置系统启动时自动挂载新文件系统，需要在 `/etc/fstab` 文件中添加条目。fstab\
  \ 条目的格式如下：\n\n`<device> <dir> <type> <options> <dump> <fsck>`\n\n这些条目总结如下：\n\n-\
  \ `<device>`：文件系统的设备。\n- `<dir>`：作为文件系统挂载点的目录。\n- `<type>`：文件系统类型（xfs, ext4 等）。\n\
  - `<options>`：额外的文件系统挂选项，例如将文件系统设置为只读或控制任何用户都可以挂载该文件系统。运行 `man mount` 查看完整的选项列表。将此值设置为默认值将使用文件系统的默认设置（rw,\
  \ suid, dev, exec, auto, nouser, async）。\n\n\n\n\n\n-   `<dump>` - 决定在执行 `dump`\
  \ 工具执行的备份时，是否包含文件系统的内容。此设置很少使用，可以使用 `0` 值禁用。\n-   `<fsck>` - 在系统崩溃后是否由 `fsck` 对文件系统进行检查，以及检查文件系统的顺序。对于如\
  \ `XFS` 等带日志的文件系统，应将其设置为 `0`，以表示不需要检查。\n\n以下示例显示了配置的 `fstab` 文件，用于自动挂载位于 `/dev/sdb1`\
  \ 分区上的 `/backup` 分区：\n\n```\n/dev/mapper/rhel-root / xfs defaults 0 0\nUUID=b4fc85a1-0b25-4d64-8100-d50ea23340f7\
  \ /boot xfs defaults 0 0\n/dev/mapper/rhel-home /home xfs defaults 0 0\n/dev/mapper/rhel-swap\
  \ swap swap defaults 0 0\n/dev/sdb1 /backup xfs defaults 0 0\n```\n\n现在，`/backup`\
  \ 文件系统将在每次系统重启时自动挂载。\n\n## 31.8 使用 Cockpit 添加磁盘\n\n除了使用本章概述的命令行工具进行存储操作外，还可以使用 `Cockpit`\
  \  Web 控制台配置新的存储设备。要查看当前的存储配置，请登录 `Cockpit` 控制台并选择如图 31-1 所示的 `Storage` 选项：\n\n\
  ![](img/cockpit_storage.png)\n图 31-1\n\n要找到新添加的存储，请滚动到 `Storage` 页面的底部，直到 `Drives`\
  \ 部分进入视野（注意 `Drives` 部分也可能位于屏幕的右上角）：\n\n![](img/cockpit_drives.png)\n图 31-2\n\n\
  在上述图中，新硬盘是 15.5 GB 的硬盘。选择新硬盘以显示如图 31-3 所示的 `Drive` 屏幕：\n\n![](img/cockpit_drive_details.png)\n\
  图 31-3\n\n点击 `Create partition` 按钮并使用对话框指定分配给此分区的空间、文件系统类型（推荐使用 `XFS`）以及可选的标签、文件系统挂载点和挂载选项。注意，如果此新分区没有使用所有可用空间，可以在硬盘上添加额外的分区。要更改设置（例如文件系统是否为只读或是否在启动时挂载），请在\
  \ `Mount options` 部分中更改设置：\n\n![](img/cockpit_drive_create_partition.png)\n图 31-4\n\
  \n一旦选好设置，点击 `Create partition` 按钮提交更改。创建过程完成后，新分区将被添加到磁盘中，创建相应的文件系统并挂载到指定的挂载点，同时对\
  \ `/etc/fstab` 文件进行相应的更改。\n\n## 31.9 总结\n\n本章涵盖了如何向现有的 RHEL 9 系统添加物理或虚拟磁盘驱动器。这是一个相对简单的过程，即确保操作系统检测到新硬盘、在硬盘上创建一个或多个分区，然后在这些分区上创建文件系统。虽然\
  \ RHEL 9 提供了多种文件系统类型，但通常推荐使用 `XFS`。一旦文件系统准备就绪，就可以使用 `mount` 命令进行挂载。为了让新创建的文件系统在系统启动时自动挂载，可以在\
  \ `/etc/fstab` 配置文件中进行添加。\n\n## 32 为 RHEL 9 逻辑卷组和逻辑卷添加新磁盘\n\n在上一章中，我们查看了向 RHEL 9\
  \ 系统添加新磁盘驱动器、创建分区和文件系统，然后挂载该文件系统以访问磁盘。创建固定分区和文件系统的替代方案是使用 `逻辑卷管理 (LVM)` 创建由一个或多个物理或虚拟磁盘（或分区）的空间组合成的逻辑磁盘。使用\
  \ `LVM` 的优势是，可以在逻辑卷中添加或删除空间，而无需将数据分布在多个文件系统上。\n\n让我们以基于 RHEL 9 的服务器根（`/home`）文件系统为例。如果没有\
  \ `LVM`，该文件系统会在安装操作系统时以特定大小创建。如果安装了新的磁盘驱动器，则无法将该任何空间分配给 `/home` 文件系统。唯一的选项是在新磁盘上创建新的文件系统并将其挂载到特定的挂载点。在这种情况下，虽然新文件系统上有充足的空间，但\
  \ `/home` 文件系统仍然几乎满额。唯一的选择是将文件移动到新文件系统。有了 `LVM`，新硬盘（或其部分）可以分配包含根文件系统的逻辑卷，从而动态扩展可用空间。\n\
  \n在本章中，我们将介绍向卷组和逻辑卷添加新磁盘空间所需的步骤，以便为 RHEL 9 系统的根文件系统添加额外空间。\n\n### 32.1 逻辑卷管理 (LVM)\
  \ 概述\n\n`LVM` 提供了一种灵活且高级的磁盘空间管理方法。与其将每个磁盘驱动器划分为固定大小的分区并在创建固定大小的文件系统，`LVM` 提供了一种将磁盘空间分组逻辑卷的方法，这些逻辑卷可以轻松调整大小。此外，`LVM`\
  \ 允许通过分配不同的卷组或逻辑卷来精确控制分配给用户的空间。当分配给卷的空间耗尽时，管理员可以添加更多空间。\n\n`LVM` 由以下组件组成：\n\n**32.1.1\
  \ 卷组 (VG)**：`卷组` 是一个或多个逻辑卷和物理卷的高级容器。\n**32.1.2 物理卷 (PV)**：`物理卷` 代表存储设备，如磁盘驱动器。\n\
  **32.1.3 逻辑卷 (LV)**：`逻辑卷` 等同于分区，与分区一样，它可以包含文件系统。\n**32.1.4 物理区 (PE)**：每个`物理卷` (`PV`)\
  \ 被划分为称为物理区的等大小块。\n**32.1.5 逻辑区 (LE)**：每个`逻辑卷` (`LV`) 被划分为称为逻辑区的等大小块。\n\n假设我们要创建一个名为\
  \ `VolGroup01` 的新卷组。该卷组需要物理磁盘空间才能运行，因此我们分配三个分区 `/dev/sda1`、`/dev/sdb1` 和 `/dev/sdb2`。然后，我们会在卷组内创建一个名为\
  \ `LogVol01` 的逻辑卷。如果 `LogVol01` 空间不足，我们将更多磁盘分区作为物理卷并将其分配给卷组和逻辑卷。\n\n### 32.2 获取逻辑卷信息\n\
  \n作为在 RHEL 9 中使用 `LVM` 的示例，我们将为标准 RHEL 9 安装的 `/` 文件系统添加空间。考虑到根分区大小的灵活性，RHEL 9 将\
  \ `/` 文件系统设置为名为 `rhel` 的卷组内的逻辑卷（名为 `root`）。但在对 `LVM` 设置进行任何更改之前，首先收集信息是关重要的。\n\n\
  运行 `mount` 命令将输出有关挂载点的信息，对应的如下：\n\n```\ndev/mapper/rhel-root on / type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)\n\
  ```\n\n可以使用 `vgdisplay` 命令获取卷组信息：\n\n```\nvgdisplay\n\n--- Volume group ---\n  VG\
  \ Name rhel\n  System ID\n  Format lvm2\n  Metadata Areas 1\n  Metadata Sequence\
  \ No 4\n  VG Access read/write\n  VG Status resizable\n  MAX LV 0\n  Cur LV 3\n\
  \  Open LV 3\n  Max PV 0\n  Cur PV 1\n  Act PV 1\n  VG Size <297.09 GiB\n  PE Size\
  \ 4.00 MiB\n  Total PE 76054\n  Alloc PE / Size 76054 / <297.09 GiB\n  Free PE /\
  \ Size 0 / 0\n  VG UUID 8vZKNE-v6nY-uII2-NKk1-StmF-EkNp-NNKa9b\n```\n\n\n\n\n如上面的示例所示，`rhel`\
  \ 卷组的物理极区大小为 4.00MiB，总共有 297.09GB 可用空间分配给逻辑卷。当前，已分配了 76054 个物理极区，等于总容量。因此，我们必须添加一个或多个物理卷来增加分配给\
  \ `rhel` 卷组中任何逻辑卷的空间。`vgs` 工具也有助于快速查看系统中卷组可用空间的概述：\n\n### vgs\n\n```\n  VG #PV #LV\
  \ #SN Attr VSize VFree\n  rhel 1 0 wz-- <297.09g\n```\n\n同样，可以使用 `lvdisplay` 命令获取卷组中逻辑卷的信息：\n\
  \n### lvdisplay\n\n```\n  --- Logical volume ---\n\n  LV Path /dev/rhel/swap\n \
  \ LV Name swap\n  VG Name rhel\n  LV UUID Rck8-T5Or-vZ9-Er1e-qW7-f9cpj\n  LV Write\
  \ Access read/write\n  LV Creation host, time demoserver, 2023-04-10 14:11:15 -0400\n\
  \  LV Status available\n  # open 2\n  LV Size 3.75 GiB\n  Current LE 960\n  Segments\
  \ 1\n  Allocation inherit\n  Read ahead auto\n  - currently set to 256\n  Block\
  \ device 253:1\n  --- Logical volume ---\n\n  LV Path /dev/rhel/home\n  LV Name\
  \ home\n  VG Name rhel\n  LV UUID MMpQ05-ry0-9g-zvGQ-Dszn-kd-ZpaK6\n  LV Write Access\
  \ read/write\n  LV Creation host, time demoserver, 2023-04-10 14:11:15 -0400\n \
  \ LV Status available\n  # open 1\n  LV Size <223.34 GiB\n  Current LE 57174\n \
  \ Segments 1\n  Allocation inherit\n  Read ahead auto\n  - currently set to 256\n\
  \  Block device 253:2\n  --- Logical volume ---\n\n  LV Path /dev/rhel/root\n  LV\
  \ Name root\n  VG Name rhel\n  LV UUID OFqAB0-azjy-47DO-bzRo-ha2O-sHz5-jjcF\n  LV\
  \ Write Access read/write\n  LV Creation host, time demoserver, 2023-04-10 14:11:17\
  \ -0400\n  LV Status available\n  # open 1\n  LV Size 70.00 GiB\n  Current LE 17920\n\
  \  Segments 1\n  Allocation inherit\n  Read ahead auto\n  - currently set to 256\n\
  \  Block device 253:0\n```\n\n如上所示，卷组 `rhel` 中的 70 GiB 空间分配给了逻辑卷 `root`（`/` 系统），大约\
  \ 223.34 GiB 分配给了 `home` 卷组（`/home`），以及 3.75 GiB 分配给了 `swap`（交换空间）。现在我们知道了哪些空间被使用了，但了解哪些设备提供了空间（换句话说，哪些设备被用作物理卷）通常很有帮助。要获取此信息，需要运行\
  \ `pvdisplay` 命令：\n\n### pvdisplay\n\n```\n  --- Physical volume ---\n\n  PV Name\
  \ /dev/sda2\n  VG Name rhel\n  PV Size 297.09 GiB / usable 4.00 MiB\n  Allocatable\
  \ yes (but full)\n  PE Size 4.00 MiB\n  Total PE 76054\n  Free PE 0\n  Allocated\
  \ PE 76054\n  PV UUID siTC2-fq47-LXTG-VWtc-Ma33\n```\n\n显然，逻辑卷 `rhel` 控制的空间通过位于\
  \ `/dev/sda2` 的物理卷提供。现在我们知道了更多 LVM 配置，可以向卷组及其包含的逻辑卷添加空间。\n\n## 从命令行向卷组添加额外空间\n\n\
  与之前获取 RHEL 9 当前逻辑卷配置信息的步骤相同，可以通过命令行进行此配置。在本章的剩余部分，我们将假设添加了一个新磁盘，操作系统将其识别为 `/dev/sdb`。我们还假设这是一个没有现有分区的磁盘。如果存在现有分区，应对其进行备份，然后使用\
  \ `fdisk` 工具从磁盘上删除分区。例如，假设由 `/dev/sdb` 表示的设备包含两个分区：\n\n```\n# fdisk -l /dev/sdb\n\
  Disk /dev/sdb: 14.46 GiB, 1552516256 bytes, 3032688 sectors\nDisk model: USB2.0\n\
  Units: sectors of 512 = 512 bytes\nSector size (logical/physical): 512 bytes\nI/O\
  \ size (minimum/optimal): 512 bytes\nDisklabel: dos\nDisk identifier: 0x4c3306b\n\
  Device Start End Sectors Type\n/dev/sdb1 2048 3032687 14.5 Linux\n```\n\n一旦卸载了这些分区上的任何文件系统，即可删除它们：\n\
  \n```\n# fdisk /dev/sdb\nWelcome to fdisk (util-linux 2.37).\n更改将仅留在内存中，直到你决定写入它们。\n\
  在使用写入命令前要小心。\nCommand (m for help): d\n选择了分区 1\n分区 1 已删除。\nCommand (m for help):\
  \ w\n分区表已更改。\n正在调用 ioctl() 重新读取分区表。\n正在同步磁盘。\n```\n\n在移动到下一步之前，删除 `/etc/fstab` 中这些文件系统的条目，以免系统在下次重启时尝试挂载它们。一旦磁盘准备就绪，下一步是使用\
  \ `pvcreate` 命令将磁盘转换为物理卷（如果存在 dos 签名）：\n\n```\n# pvcreate /dev/sdb\nWARNING: dos\
  \ signature detected on /dev/sdb at offset 510. Wipe it? [y/n]: y\n正在擦除 /dev/sdb\
  \ 上的 dos 签名。\n物理卷 \"/dev/sdb\" 已创建。\n```\n\n如果创建失败并显示“`<device>` 被过滤器排除”的消息，则可能需要在创建物理卷之前使用\
  \ `wipefs` 命令擦除磁盘：\n\n```\n# wipefs -a /dev/sdb\n/dev/sdb: 8 bytes were erased at\
  \ offset 0x0000200 (gpt): 45 46 29 20 50 41 54\n/dev/sdb: 8 bytes were erased at\
  \ offset 0x1ffff00 (gpt): 45 46 29 20 50 41 54\n/dev/sdb: 2 bytes were erased at\
  \ offset 0x00001fe (PMBR): 55 aa\n/dev/sdb: calling ioctl to re-read partition table:\
  \ Success\n```\n\n创建物理卷后，我们现在需要使用 `vgextend` 命令将其添加到卷组（在本例中为 `rhel`）：\n\n```\n#\
  \ vgextend rhel /dev/sdb\n卷组 \"rhel\" 已成功扩展\n```\n\n现在新物理卷已添加到卷组，并准备好分配给逻辑卷。执行此操作，我们运行\
  \ `lvextend` 工具并提供我们想要扩展卷的大小。在本例中，我们想要扩展 `home` 卷的大小 14GB。注意，我们需要提供逻辑卷的路径，可以通过 `lvdisplay`\
  \ 命令获取（在本例中 `/dev/rhel/home`）：\n\n```\n# lvextend -L+14G /dev/rhel/home\nSize of\
  \ logical volume rhel/home changed from <223.34 GiB (57174 extents) to <237.34 GiB\
  \ (60758 extents).\n逻辑卷 rhel/home 已成功调整大小。```\n\n最后一步是调整逻辑卷上的文件系统以使用额外的空间。执行方式取决于文件系统类型，可以通过以下\
  \ `df` 命令识别类型列：\n\n```\n# df -T /home\nFilesystem Type 1K-blocks Available Use%\
  \ Mounted on\n/dev/mapper/rhel-home xfs 234070356 1669596 232400760 1% /home\n```\n\
  \n如果 `/home` 使用 XFS 文件系统格式化，可以使用 `xfs_growfs` 工具对其进行调整大小：\n\n```\n# xfs_growfs /home\n\
  meta-data=/dev/mapper/rhel-home isize=512 agcount=4 agsize=14636544 blks\n     \
  \  = sectsz=512 attr=2, projid32bit=1\n       = crc=1 finobt=1 sparse=1, rmapbt=0\n\
  \       = relink=1 bigtime=1 inobtcount=1\ndata = bsize=4096 blocks=58546176, imaxpct=25\n\
  \       = sunit=0 swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\n\
  log =internal log bsize=4096 blocks=28587, version=2\n       = sectsz=512 sunit=0\
  \ blks, lazy-count=1\nrealtime =none extsz=4096 blocks=0, rtextents=0\natatdata\
  \ blocks changed from 58546176 to 62216192\n```\n\n\n\n\n除了本章为止概述的命令行工具外，还可以通过 Cockpit\
  \ Web 界面中的“存储”（Storage）页面访问逻辑卷信息，并对卷组和逻辑卷进行更改，如图 32-1 所示：\n\n![](img/cockpit_storage1.png)\n\
  \n图 32-1\n\n如果没有列出“存储”选项，则需要安装 `cockpit-storaged` 包并按照如下方式重启 cockpit 服务：\n\n```bash\n\
  dnf install cockpit-storaged\n# systemctl restart cockpit.socket\n```\n\n一旦 Cockpit\
  \ 服务重启，请重新登录 Cockpit 界面，此时“存储”选项应该是可见的。\n\n若要从 Cockpit 控制台中向现有卷组添加新磁盘驱动器，请从上述“存储”页面开始，在上方标记为\
  \ A 的列表中点击与要扩展的卷组关联的文件系统。\n\n在生成的屏幕上，点击下方图 32-2 所示的高亮显示的 `+` 按钮以添加物理卷：\n\n![](img/cockpit_storage_add_physical_volume.png)\n\
  \n图 32-2\n\n选择要添加到卷组的新驱动器，并点击 `Add`（添加）按钮：\n\n![](img/cockpit_storage_physical_volume_selected.png)\n\
  \n图 32-3\n\n返回卷组屏幕后，滚动到要扩展的逻辑卷并点击它以展开更多信息。例如，图 32-4 显示了 home 逻辑卷的详情：\n\n![](img/cockpit_home_logical_volume.png)\n\
  \n图 32-4\n\n要使用新空间扩展逻辑卷，点击 `Grow`（扩展）按钮，并使用生成的对话框中的滑块来选择应向卷添加多少空间。然后，点击 `Grow` 按钮提交更改（如果需要，可用空间可以在不同的卷组之间共享）：\n\
  \n![](img/cockpit_home_logical_volume_grow.png)\n\n图 32-5\n\n一旦完成这些步骤后，卷组将配置为使用新添加的空间。\n\
  \n## 32.5 总结\n\n卷组和逻辑卷在 RHEL 9 系统的物理存储设备之上提供了一个抽象层，为分配多个磁盘驱动器提供的空间提供灵活的方法。这允许动态地进行和更改磁盘空间分配，无需重新划分磁盘驱动器并在文件系统之间移动数据。本章概述了卷组以及逻辑卷和物理卷的基本概念，并演示了如何使用命令行工具和\
  \ Cockpit Web 界面管理这些内容。\n\n## 33 添加和管理 RHEL 9 交换空间（Swap Space）\n\n维护 RHEL 9 系统性能的一个重要部分是确保有足够的交换空间，以与系统对内存的需求相匹配。因此，本章提供了\
  \ RHEL 9 上交换空间管理的概述。\n\n### 33.1 什么是交换空间？\n\n计算机系统为操作系统提供的可用物理内存数量是有限的。当操作系统接近可用内存限制时，它会通过将内存页写入磁盘来释放空间。当操作系统需要其中任何一个页时，它们会被读回内存。为此任务分配的磁盘区域称为称为交换空间（swap\
  \ space）。\n\n### 33.2 RHEL 9 建议的交换空间\n\nRHEL 9 建议的交换空间取决于多个因素，包括系统中的内存量、施在内存上的工作负载，以及系统是否需要支持休眠。RHEL\
  \ 9 交换空间的当前指南如下：\n\n| 已安装 RAM 的数量 | 建议的交换空间 | 启用休眠时的建议交换空间 |\n| :--- | :--- | :---\
  \ |\n| 2GB 或更少 | 已安装 RAM x 2 | 已安装 RAM x 3 |\n| 2GB - 8GB | 已安装 RAM x 1 | 已安装 RAM\
  \ x 2 |\n| 8GB - 64GB | 至少 4GB | 已安装 RAM x 1.5 |\n| 64GB 或更多 | 至少 4GB | 不建议休眠 |\n\
  \n表 33-1\n\n当系统进入休眠时，当前系统状态写入硬盘，主机关闭。当机器随后开机时，系统状态将从硬盘中恢复。这与挂起（suspension）不同，挂起时系统状态存储在\
  \ RAM 中。机器随后进入睡眠状态，此时系统 RAM 保持供电，而其他设备被关闭。\n\n### 33.3 识别当前交换空间的使用情况\n\nRHEL 9 系统当前使用的交换空间量可以通过多种方式识别。一种方法是输出\
  \ `/proc/swaps` 文件：\n\n```bash\ncat /proc/swaps\n```\n\nFilename Type Size Used\
  \ Priority\n/dev/dm-1 partition 3932156 0 -2\n\n或者，可以使用 `swapon` 命令：\n\n```bash\n\
  swapon\n```\n\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition 3.7G 0B -2\n\n```\n\
  \n要查看交换空间相对于总可用 RAM 的量，可以使用 `free` 命令：\n\n```bash\nfree\n```\n\n              total\
  \ used free shared buff/cache available\nMem: 3601420 1577696 1396172 404412 1273236\
  \ 2023724\nSwap: 3932156\n\n### 33.4 为 RHEL 9 添加交换文件\n\n向 RHEL 9 添加交换空间的一种方法是创建一个文件并将其分配为交换空间。首先输出\
  \ `/proc/swaps` 文件：\n\n```bash\ncat /proc/swaps\n```\n\nFilename Type Size Used\
  \ Priority\n/dev/dm-1 partition 3932156 0 -2\n\n或者，可以使用 `swapon` 命令：\n\n```bash\n\
  swapon\n```\n\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition 3.7G 0B -2\n\n```\n\
  \n要查看交换空间相对于总可用 RAM 的量，可以使用 `free` 命令：\n\n```bash\nfree\n```\n\n              total\
  \ used free shared buff/cache available\nMem: 3601420 1577696 1396172 404412 1273236\
  \ 2023724\nSwap: 3932156\n\n```\n\n### 33.5 作为分区添加交换空间\n\n作为指定文件作为交换的替代方案，整个分区也可以被指定为交换空间。实现此目的步骤与添加交换文件相同。在将分区分配给交换之前，请确保相应文件系统上的现有数据已备份或不再需要，并且该文件系统已卸载。\n\
  \n假设磁盘驱动器上存在由 `/dev/sdb1` 表示的分区，例如，第一步将使用 `mkswap` 工具将其转换为交换空间：\n\n```bash\nmkswap\
  \ /dev/sdb1\n```\n\n接下来，将新分区添加到系统交换中并验证其确实已添加：\n\n```bash\nswapon /dev/sdb1\n```\n\
  \n```bash\nswapon\n```\n\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition 3.7G 996K\
  \ -2\n/dev/sdb1 partition 14.5G 0B -3\n\n```\n\n再次，可以修改 `/etc/fstab` 文件以便在启动时自动添加交换分区，如下：\n\
  \n/dev/sdb1 swap swap defaults 0 0\n\n### 33.6 为 RHEL 9 LVM 交换卷添加空间\n\n对于使用逻辑卷管理（LVM）的系统，除了通过文件或分区添加交换外，另一种方法是扩展用于交换空间的逻辑卷。\n\
  \n\n\n\n\n第一步是使用 `lvdisplay` 工具识别当前可用的交换空间（swap）以及用于交换空间的卷组（volume group）和逻辑卷（logical\
  \ volume）。有关 LVM 的更多信息，请参阅标题为向 RHEL 9 卷组和逻辑卷中添加新磁盘的章节：\n\n### lvdisplay\n\n```\n\
  \  --- Logical volume ---\n\n  LV Path /dev/rhel/swap00\n  LV Name swap00\n  VG\
  \ Name rhel\n  LV UUID EbOScj-1qXw-bB9d-LU61-ZjdC-L7u5-Uhj8De\n  LV Write Access\
  \ read/write\n  LV Creation host, time demoserver, 2023-04-12 09:34:29 -0400\n \
  \ LV Status available\n  # open 2\n  LV Size 3.75 GiB\n  Current LE 960\n  Segments\
  \ 1\n  Allocation inherit\n  Read ahead sectors auto\n  - currently set to 256\n\
  \  Block device 253:1\n```\n\n很明显，交换空间位于名为 `swap00` 的逻辑卷上，该卷是名为 `rhel` 的卷组的一部分。下一步是验证卷组中是否有可用空间可以分配给交换卷：\n\
  \n### vgs\n\n```\n  VG #PV #LV #SN Attr VSize VFree\n  rhel 2 3 0 wz--n- 197.66g\
  \ <22.00g\n```\n\n如果可用空间足以满足额外的交换需求，请关闭交换并扩展交换逻辑卷，以尽可能使用所需的可用空间来满足系统的交换需求：\n\n```\n\
  swapoff /dev/rhel/swap\nlvextend -L+8GB /dev/rhel/swap\n```\n`Logical volume rhel/swap\
  \ successfully resized.`\n\n接下来，重新格式化交换卷并重新开启：\n\n```\nmkswap /dev/rhel/swap\nmkswap:\
  \ /dev/rhel/swap: warning: wiping old swap signature.\nSetting up swapspace version\
  \ 1, size = 12 GiB (12754874368 bytes)\nno label, UUID=241a4818-e51c-4b8c-9bc9-1697fc2ce26e\n\
  swapon /dev/rhel/swap\n```\n\n完成更改后，检查交换空间是否已经增加：\n\n```\nswapon\nNAME TYPE SIZE\
  \ USED PRIO\n/dev/dm-1 partition 12G 0B -2\n```\n\n## 33. 向卷组中添加交换空间\n\n在上面的节中，我们扩展了交换逻辑卷以使用卷组中已有的空间。如果卷组中没有可用空间，则在扩展交换之前必须添加空间。\n\
  \n从检查卷组的状态开始：\n\n```\nvgs\n  VG #PV #LV #SN Attr VSize VFree\n  rhel 1 3 0 wz--n-\
  \ <297.09g 0\n```\n\n上述输出表明卷组内没有可用空间。然而，假设我们有为系统交换添加 14 GB 空间的需求。这需要向卷组添加更多空间。在本示例中，假设有一个大小为\
  \ 16 GB 且由 `/dev/sdb` 表示的磁盘可添加到卷组。因此，第一步是使用 `pvcreate` 将此分区转换为物理卷（physical volume）：\n\
  \n```\npvcreate /dev/sdb\n  Physical volume \"/dev/sdb\" successfully created.\n\
  ```\n\n如果创建失败并显示类似“Device /dev/sdb excluded by a filter”get 信息，则可能必要在创建物理卷之前先擦除磁盘：\n\
  \n```\nwipefs -a /dev/sdb\n/dev/sdb: 8 bytes were erased at offset 0x00000200 (gpt):\
  \ 45 46 49 20 50 41 52 54\n/dev/sdb: 8 bytes were erased at offset 0x1fffffe00 (gpt):\
  \ 45 46 49 20 50 41 52 54\n/dev/sdb: 2 bytes were erased at offset 0x000001fe (PMBR):\
  \ 55 aa\n/dev/sdb: calling ioctl to re-read partition table: Success\n```\n\n接下来，需要扩展卷组以使用此额外的物理卷：\n\
  \n```\nvgextend rhel /dev/sdb\n  Volume group \"rhel\" successfully extended\n```\n\
  \n此时，`vgs` 命令应该报告来自 `/dev/sdb` 的空间已添加到卷组：\n\n```\nvgs\n  VG #PV #LV #SN Attr VSize\
  \ VFree\n  rhel 2 3 0 wz--n- 311.54g <14.46g\n```\n\n现在卷组中已有了可用空间，可以扩展交换逻辑卷来利用这些空间。但在之前，先关闭交换：\n\
  \n```\nswapoff /dev/rhel/swap\n```\n\n接下来，扩展逻辑卷：\n\n```\nlvextend -L+8GB /dev/rhel/swap\n\
  ```\n`Logical volume rhel/swap successfully resized.`\n\n\n\n\n要列出系统上运行的所有进程（包括所有用户和系统进程），请执行以下命令：\n\
  \n```bash\n$ ps -ax\n\nPID TTY STAT TIME COMMAND\n  1 ? Ss 0:22 /usr/lib/systemd/systemd\
  \ rhgb --switched-root\n  2 ? S 0:00 [kthreadd]\n  3 ? I< 0:00 [rcu_gp]\n  4 ? I<\
  \ 0:00 [rcu_par_gp]\n  5 ? I< 0:00 [netns]\n```\n\n要列出所有进程并包含所有者、CPU 和内存使用信息，请使用\
  \ `-aux` 参数执行 `ps` 命令：\n\n```bash\n$ ps -aux\n\nUSER PID %CPU %MEM VSZ RSS TTY STAT\
  \ START TIME COMMAND\nroot 2 0.0 0.0 0 0 ? S 09:59 0:00 [kthreadd]\nroot 3 0.0 0.0\
  \ 0 0 ? I< 09:59 0:00 [rcu_gp]\nroot 4 0.0 0.0 0 0 ? I< 09:59 0:00 [rcu_par_gp]\n\
  root 5 0.0 0.0 0 0 ? I< 09:59 0:00 [netns]\nroot 7 0.0 0.0 0 0 ? I< 09:59 0:00 [kworker/0:0H-events_highpri]\n\
  root 9 0.0 0.0 0 0 ? I< 09:59 0:00 [kworker/0:1H-events_highpri]\n.\ndemo 9788 0.1\
  \ 1.4 763248 50480 ? Ssl 15:05 0:00 /usr/libexec/gnome-terminal-serv\ndemo 9814\
  \ 0.0 0.1 224108 5664 pts/2 Ss 15:05 0:00 bash\ndemo 9849 0.0 0.0 222412 3588 pts/2\
  \ S+ 15:06 0:00 nano\ndemo 9873 0.0 0.1 233416 6280 pts/1 R+ 15:08 0:00 ps -aux\n\
  ```\n\nLinux 进程可以启动自己的子进程（称为派生），从而导致进程之间产生分级的父子关系。要查看进程树，请使用 `ps` 命令并包含 `-H` 参数。以下是执行\
  \ `ps -aH` 命令的树状输出部分：\n\n```bash\n$ ps -aH\n\nPID TTY TIME CMD\n10036 pts/3 00:00:00\
  \ ps\n  6350 pts/0 00:00:00 sudo\n  6354 pts/0 00:00:00 su\n  6355 pts/0 00:00:00\
  \ bash\n  5442 tty2 00:00:00 gnome-session-b\n```\n\n进程信息也可以通过 GNOME 桌面上的“系统监视器”（System\
  \ Monitor）工具查看。该工具可以在桌面环境中搜索“System Monitor”来启动，也可以通过以下命令行启动：\n\n```bash\n$ gnome-system-monitor\n\
  ```\n\n一旦启动系统监视器，选择工具栏上的“进程”（Processes）按钮来列出系统上运行的进程，如下方的 [图 34-1] 所示：\n\n![](img/system_monitor_processes.png)\n\
  图 34-1\n\n要更改列出的进程（例如，列出所有进程或仅列出自己的进程），可以使用如 [图 34-2] 所示的菜单：\n\n![](img/system_monitor_menu.png)\n\
  图 34-2\n\n要过滤进程列表，点击标题栏上的搜索按钮并在搜索字段中输入进程名称：\n\n![](img/system_monitor_search.png)\n\
  图 34-3\n\n要显示有关特定进程的附加信息，从列表中选择该进程并点击对话框右下角的按钮（在 [图 34-4] 中标记为 A）：\n\n![](img/system_monitor_process_details.png)\n\
  图 34-4\n\n点击该按钮后，会出现一个与图中标记为 B 类似的对话框。从列表中选择一个进程并点击“结束进程”（End Process）按钮 (C) 来将其终止。\n\
  \n要监控 CPU、内存、交换分区和网络使用，点击标题栏上的“资源”（Resources）按钮以显示如 [图 34-5] 所示的屏幕：\n\n![](img/system_monitor_resources.png)\n\
  图 34-5\n\n同样，通过选择“文件系统”（File Systems）工具栏按钮可以查看系统使用的存储空间摘要：\n\n![](img/system_monitor_filesystems.png)\n\
  图 34-6\n\n## 34.2 使用 top 进行实时系统监控\n\n正如“Cockpit Web 界面概述”章节概述出的，Cockpit Web 界面可以执行基本的系统监控。上一节还解释了如何使用\
  \ GNOME 系统监视器工具来监控进程和系统资源。本章还探索了 `ps` 命令如何提供 RHEL 9 系统上运行进程的快照。然而，`ps` 命令无法提供进程和系统资源使用的实时视图。`top`\
  \ 命令是从命令行实时监控系统资源和进程的理想工具。\n\n运行时，`top` 将根据系统资源使用情况列出系统运行的进程（需求最大的进程位于顶部）。屏幕的上部显示内存和交换分区的使用情况。所有输出都会不断更新，允许实时监控系统：\n\
  \n![](img/top_running.png)\n图 34-7 要限制显示属于特定用户的进程，请使用 `-u` 参数启动 `top` 并加上用户名：\n\n\
  ```bash\n$ top -u john\n```\n\n要查看完整的功能列表，按下键盘 `h` 或参考 man 页面：\n\n```bash\n$ man\
  \ top\n```\n\n## 34.3 命令行磁盘和交换分区监控\n\n可以通过 Cockpit 和 GNOME 系统监视器监控磁盘空间。然而，要在命令行识别磁盘使用情况，`df`\
