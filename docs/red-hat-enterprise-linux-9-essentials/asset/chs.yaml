  \ as header.\n\nNext: The table output lines:\n\n\"eno1 ethernet connected eno1\"\
  \ => translate: \"eno1 ethernet connected eno1\" maybe keep but \"ethernet\" maybe\
  \ \"以太网\". However it's part of output; maybe keep unchanged.\n\n\"wlp0s26u1u2 wifi\
  \ connected zoneone\" => keep.\n\n\"virbr0 bridge connected virbr0\" => keep.\n\n\
  \"lo loopback unmanaged --\" => keep.\n\n\"virbr0-nic tun unmanaged --\" => keep.\n\
  \nNext: \"The output may also be modified by using the `-p` (pretty) option to make\
  \ the output more human-friendly:\" Translate.\n\n\"可以使用 `-p`（pretty）选项使输出更人性化：\"\
  \ Translate.\n\nNext code block:\n\n```\nnmcli -p dev status\n```\n\nKeep unchanged.\n\
  \nNext: \"=====================\" => keep.\n\n\"Status of devices\" => translate:\
  \ \"设备状态\"\n\n\"=====================\" => keep.\n\n\"DEVICE TYPE STATE CONNECTION\"\
  \ => maybe keep.\n\n\"-------------------------------------------------------------------\"\
  \ => keep.\n\nThen the rows:\n\n\"eno1 ethernet connected eno1\" => keep.\n\n\"\
  wlp0s26u1u2 wifi connected zoneone\" => keep.\n\n\"virbr0 bridge connected virbr0\"\
  \ => keep.\n\n\"lo loopback unmanaged --\" => keep.\n\n\"virbr0-nic tun unmanaged\
  \ --\" => keep.\n\nWe need to ensure we translate all narrative text, but keep code\
  \ blocks unchanged.\n\nNow we need to wrap everything in [content]...\n\n\n相反，可以使用\
  \ `-t` 选项使输出更加简洁，并适用于自动化处理：\n\n```\nnmcli -t dev status\n```\n\neno1:ethernet:connected:eno1\n\
  wlp0s26u1u2:wifi:connected:emilyzone\nvirbr0:bridge:connected:virbr0\nlo:loopback:unmanaged:\n\
  virbr0-nic:tun:unmanaged:\n\n状态输出显示系统安装了两个物理设备，一个是以太网，另一个是 WiFi 设备。\n\n桥（`virbr`）条目是为虚拟机提供网络的虚拟设备（虚拟化主题将从“虚拟化技术概述]章节开始介绍）。最后，回环接口是一个特殊的虚拟设备，允许系统与自身通信，通常用于执行网络诊断。\n\
  \n在使用 `NetworkManager` 时，理解设备（device）和连接（connection）之间的区别非常重要。如上所述，设备可以是物理网络设备或虚拟网络设备，而连接是设备所连接的网络配置。\n\
  \n以下命令显示了系统上配置的连接信息：\n\n```\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\nzoneone\
  \ 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee bridge virbr0\nzonetwo\
  \ f940a2d1-8c18-4a9e-bf29-817702429b8a wifi --\nzonethree fd65c5e5-3e92-4e9e-b924-1b0b07b70032\
  \ wifi --\n\n上述输出显示 WiFi 设备（`wlp0s26u1u2`）连接到了名为 `zoneone` 的无线网络，而以太网设备（`eno1`）连接到了名为\
  \ `eno1` 的连接。除了 `zoneone` 之外，`NetworkManager` 还列出了另外两个名为 `zonetwo` 和 `zonethree`\
  \ 的 WiFi 连接，它们目前都没有连接设备。\n\n要查找分配给连接的 IP 地址，可以使用 `ip` 工具配合 `address` 选项：\n\n```\n\
  ip address\n```\n\n上述命令也可以简写为：\n\n```\nip a\n```\n\n.\n.\n\n```\n3: wlp0s26u1: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc mq state UP group default qlen 1000\n    link/ether 74:da:38:ee:be:50\
  \ brd ff:ff:ff:ff:ff:ff\n    inet 192.168.1.121/24 brd 192.168.1.255 scope global\
  \ dynamic noprefixroute wlp0s26u1u2\n        valid_lft 57584sec preferred_lft 57584sec\n\
  ```\n\n.\n.\n\n`ip` 命令将输出系统中检测到的所有设备的信息。例如，上述输出显示 WiFi 设备已分配了 `192.168.1.121` 的\
  \ IP 地址。\n\n如果我们只想列出活跃的连接，可以使用 `nmcli` 命令配合 `-a` 选项：\n\n```\nnmcli con show -a\n\
  ```\n\nNAME UUID TYPE DEVICE\nzoneone 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi\
  \ wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee\
  \ bridge virbr0\n\n要将 WiFi 设备连接从 `zoneone` 切换到 `zonetwo`，我们可以运行以下命令：\n\n```\nnmcli\
  \ device wifi connect zonetwo -ask\n```\n\n密码：\n\n`-ask` 标志会导致 `nmcli` 提示用户输入 WiFi\
  \ 网络的密码。若要在命令行中包含 WiFi 密码（在脚本中执行命令时特别有用），请使用 `password` 选项：\n\n```\nnmcli device\
  \ wifi connect zonetwo password <password here>\n```\n\n`nmcli` 工具还可以按如下方式扫描可用 WiFi\
  \ 网络：\n\n```\nnmcli device wifi list\n```\n\nIN-USE SSID MODE CHAN RATE SIGNAL BARS\
  \ SECURITY\n    zoneone Infra 6 195 Mbit/s 80 WPA2\n* zonetwo Infra 11 130 Mbit/s\
  \ 74 WPA1 WPA2\n\n当前活跃的连接可以如下方式停用：\n\n```\nnmcli con down <connection name>\n```\n\
  \n同样，不活跃的连接可以随时恢复启用：\n\n```\nnmcli con up <connection name>\n```\n\n\n\n或者，要创建一个名为\
  \ `static_ip` 并分配静态 IP 地址（在此例下为 `192.168.1.200`）的连接，可以使用命令：\n\n```bash\nnmcli con\
  \ add type ethernet con-name static_ip ifname eno0 ip4 192.168.1.200/24 gw4 192.168.1.1\n\
  ```\n\n连接 `static_ip` (`3fccafb3-e761-4271-b310-ad0f28ee8606`) 已成功添加。\n\n对应的 `static_ip.nmconnection`\
  \ 文件内容如下：\n\n```ini\n[connection]\nid=static_ip\nuuid=41eca181-381c-4d12-b6c9-30446d4e29d1\n\
  type=ethernet\ninterface-name=eno0\n[ethernet]\n[ipv4]\naddress1=192.168.1.200/24,192.168.1.1\n\
  method=manual\n[ipv6]\naddr-gen-mode=default\nmethod=auto\n[proxy]\n```\n\n添加新连接的命令可以稍微微调，以同时分配\
  \ IPv4 和 IPv6 静态地址：\n\n```bash\nnmcli con add type ethernet con-name static_ip ifname\
  \ eno0 ip4 192.168.1.200/24 gw4 192.168.1.1 gw4 192.168.1.1 ip6 cabf::4532 gw6 2010:dfa::1\n\
  ```\n\n## 12.5 交互式编辑\n\n除了使用命令行选项使用 `nmcli`，该工具还包含一个用于创建和修改连接配置的交互模式。例如，下面的输出显示了如何使用交互模式创建一个名为\
  \ `demo_con` 的新以太网连接：\n\n```bash\nnmcli con edit\n```\n\n有效的连接类型：6lowpan, 802-11-olpc-mesh\
  \ (olpc-mesh), 802-11-wireless (wifi), 802-3-ethernet (ethernet), adsl, bluetooth,\
  \ bond, bridge, cdma, dummy, generic, gsm, infiniband, ip-tunnel, macsec, macvlan,\
  \ ovs-bridge, ovs-interface, ovs-port, pppoe, team, tun, vlan, vpn, vxlan, wimax,\
  \ wpan, bond-slave, bridge-slave, team-slave\n\n输入连接类型: ethernet\n\n```\n===| nmcli\
  \ interactive connection editor |===\n正在添加新的 '802-3-ethernet' 连接\n输入 'help' 或 '?'\
  \ 查看可用命令。\n输入 'print' 显示所有连接属性。\n输入 'describe [<setting>.<prop>]' 获取详细的属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\n\nnmcli> set connection.id demo_con\nnmcli> set connection.interface eno1\n\
  nmcli> set connection.autoconnect yes\nnmcli> set ipv4.method auto\nnmcli> set 802-3-ethernet.mtu\
  \ auto\nnmcli> set ipv6.method auto\nnmcli> save\n正在保存带有 'autoconnect=yes' 的连接。这可能会导致连接立即激活。\n\
  仍然想保存吗？(yes/no) [yes] yes\n连接 'demo_con' (cb837408-6c6f-4572-9548-4932f88b9275)\
  \ 已成功保存。\nnmcli> quit\n```\n\n另一方面，下面的输出修改了之前创建的 `static_ip` 连接配置，使其使用与原始指定的不同的静态\
  \ IP 地址：\n\n```bash\nnmcli con edit static_ip\n```\n\n```\n===| nmcli interactive\
  \ connection editor |===\n正在编辑现有的 '802-3-ethernet' 连接：'static_ip'\n输入 'help' 或 '?'\
  \ 查看可用命令。\n输入 'print' 显示所有连接属性。\n输入 'describe [<setting>.<prop>]' 获取详细的属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\n\nnmcli> print ipv4.addresses\nipv4.addresses: 192.168.1.200/24\nnmcli>\
  \ set ipv4.addresses 192.168.1.201/24\nnmcli> save\n连接 'static_ip' (3fccafb3-e761-4271-b310-ad0f28ee8606)\
  \ 已成功更新。\nnmcli> quit\n```\n\n在修改现有连接后，记得指示 NetworkManager 重新加载配置文件：\n\n```bash\n\
  nmcli con reload\n```\n\n使用交互模式时，了解可以使用广泛的内置帮助系统来学习如何使用该工具非常有帮助。可以通过在 `nmcli` 提示符下输入\
  \ `help` 或 `?` 访问帮助主题：\n\n```\nnmcli> ?\n```\n\n--------------------------------------------------------------\n\
  --- Main menu ]---\ngoto [<setting> | <prop>]\n```\n\n## 12.6 配置权限\n\n除了方便管理网络外，NetworkManager\
  \ 还允许为连接指定权限。例如，下面的命令将权限设置为 root：\n\n```bash\nnmcli mod static_ip permissions root\n\
  ```\n\n一旦 NetworkManager 重新加载配置，只有具有权限的用户才能更改状态。\n\n## 12.7 总结\n\nNetworkManager\
  \ 服务处理 RHEL 9 的网络。NetworkManager 将网络视为由设备和连接组成。网络设备可以是以太网或 WiFi。连接代表设备连接的网络，并定义连接是静态还是动态地址、网关\
  \ IP 地址以及系统启动时是否建立连接。\n\n可以使用多种工具管理 NetworkManager，包括 `nmcli` 和 `nui` 命令行工具、连接编辑器图形工具以及\
  \ Cockpit Web 界面的网络设置部分。通常，`nmcli` 命令行工具提供了最多的功能和活性。\n\n## 13. RHEL 9 防火墙基础\n\n\
  防火墙是保护单个计算机或计算机网络免受外部攻击的关键组件。任何直接连接互联网的计算机都应该运行防火墙。同样，任何内部网络与其外部互联网连接之间都应该某种形式的防火墙。\n\
  \nRHEL 9 内置了强大的防火墙技术 `iptables`。关于 `iptables` 甚至编写了整本书。如果你想学习 `iptables`，我们推荐这里：\n\
  \nhttps://www.linuxtopia.org/Linux_Firewall_iptables/index.html\n\n本章将涵盖防火墙、TCP/IP\
  \ 端口和服务的一些基本概念。RHEL 9 的防火墙配置将在“使用 firewalld 配置 RHEL 9 防火墙”章节中介绍。\n\n### 13.1 理解端口和服务\n\
  \n如今使用的主要的网络通信协议是 TCP/IP。它是互联网使用的协议，因此取代了大多数以前用于局域网（LAN）的流行协议。\n\nTCP/IP 定义了总共 65535\
  \ 个端口，其中 1023 个被认为是良好端口。至关重要的是，这些不是插入网络电缆的物理端口，而是每个网络连接上的虚拟端口，应用程序和服务可以通过这些端口在 TCP/IP\
  \ 网络上进行通信。\n\n\n\n\n操作系统可以提供多种不同的 TCP/IP 服务。本章末尾表格提供了此类服务的完整列表。尽管如此，这些服务包括用于运行安全\
  \ Web 服务器的 `HTTPS`、允许文件传输的 `FTP`、提供安全远程登录访问和文件传输的 `SSH`以及用于传输电子邮件消息的 `SMTP`。每种服务相应地分配到一个标准的\
  \ TCP/IP 端口。例如，`HTTPS` 被分配到端口 `443`，而 `SSH` 通信发生在端口 `22` 上。\n\n## 13.2 端口与服务的安全\n\
  \n服务器安全的大部分工作涉及定义角色，并根据角色定义应该启用哪些服务和端口。例如，仅作为 Web 服务器运行的服务器应该只运行 `HTTPS` 服务（可能还包括用于远程管理访问的\
  \ `SSH`）。所有其他服务都应该被禁用，并且理想情况下，应从操作系统中完全删除（这将使得入侵者更难以重新启用该服务）。\n\n系统安全涉及从操作系统中移除任何不必要的服务，并确保使用防火墙阻塞与非本质服务相关的端口。定义哪些端口在什么情况下可以访问的规则是使用\
  \ `iptables` 确定的。\n\n许多操作系统在安装时默认安装并激活了若干服务。在安装新操作系统之前，必须仔细规划安装。这种规划涉及决定哪些服务是不需要的，并识别哪些服务已默认安装并启用。部署新操作系统安装时绝不应仓忙。系统上可用的服务和开放端口越少，攻击者的攻击面和机会就越小。\n\
  \n## 13.3 RHEL 9 服务与 iptables 规则\n\n默认情况下，新安装的 RHEL 9 系统没有定义用于限制端口访问的 `iptables`\
  \ 规则。可以在终端窗口中执行以下命令来查看当前的 `iptables` 设置：\n\n```bash\niptables -L\n\nChain INPUT\
  \ (policy ACCEPT)\ntarget prot opt source destination\n\nChain FORWARD (policy ACCEPT)\n\
  target prot opt source destination\n\nChain OUTPUT (policy ACCEPT)\ntarget prot\
  \ opt source destination\n```\n\n如上述输出所示，目前没有定义任何规则。虽然这看起来像是一个不安全的配置，但必须记住，新安装的\
  \ RHEL 9 系统默认运行的服务很少，这使得端口对潜在的攻击者来说是无用的。例如，访问新安装的 RHEL 9 系统上的 Web 服务器是不可能的，因为默认没有安装或运行\
  \ Web 服务器服务。一旦系统上开始激活服务，通过定义 `iptables` 规则来建立防火墙策略将变得非常重要。\n\n定义 `iptables` 规则有多种方法，包括使用命令行工具和配置文件。例如，要阻止来自\
  \ IP 地址 `192.168.2.76` 端口 `25`（由 `SMTP` 邮件传输协议使用），可以在终端窗口中发布以下命令：\n\n```bash\niptables\
  \ -A INPUT -s 192.168.2.76 -p tcp --destination-port 25 -j DROP\n```\n\n如果我们现在检查当前规则，将看到此规则在列表中：\n\
  \n```bash\niptables -L\n\nChain INPUT (policy ACCEPT)\ntarget prot opt source destination\n\
  DROP tcp -- 192.168.2.76 anywhere tcp dpt:smtp\n\nChain FORWARD (policy ACCEPT)\n\
  target prot opt source destination\n\nChain OUTPUT (policy ACCEPT)\ntarget prot\
  \ opt source destination\n```\n\n随后可以如下方式移除该规则：\n\n```bash\niptables -D INPUT -s\
  \ 192.168.2.76 -p tcp --destination-port 25 -j DROP\n```\n\n考虑到 `iptables` 的复杂性，并不意外已经创建了许多用户友好的配置工具来简化规则创建过程。其中一种工具是\
  \ `firewall-cmd` 命令行工具，它将在章节使用 firewalld 配置 RHEL 9 防火墙 中介绍。\n\n## 13.4 常用端口和服务\n\
  \n在介绍更复杂的防火墙规则之前，首先值得花时间概述 RHEL 9 系统可以提供的一些关键服务以及相应的端口号：\n\n| 端口 | 分配 | 描述 |\n|\
  \ :--- | :--- | :--- |\n| 20 | `FTP` | 文件传输协议（数据） - 文件传输协议提供了一种在网络连接的计算机系统之间传输特定文件的机制。传输通常使用\
  \ `ftp` 客户端执行。大多数现代浏览器也可以在远程 FTP 服务器上浏览和下载文件。`FTP` 使用 `TCP`（而不是 `UDP`）来传输文件，这被认为是一种高度可靠的传输机制。`FTP`\
  \ 不加密数据，不被认为是安全的文件传输协议。强烈建议使用安全复制协议 (`SCP`) 和安全文件传输协议 (`SFTP`) 代替 `FTP`。 |\n| 21\
  \ | `FTP` | 文件传输（控制） - 传统上，`FTP` 分配两个端口（端口 `20` 和端口 `21`）。端口 `20` 最初被认为是数据传输端口，而端口\
  \ `21` 分用于通信控制信息。然而，在现代实现中，端口 `20` 很少使用，所有通信都在端口 `21` 上进行。 |\n| 22 | `SSH` | Secure\
  \ Shell - Secure Shell 通过 `TCP/IP` 网络为主机提供安全、加密的远程登录会话。远程访问的原始机制是 `Telnet` 协议。然而，由于\
  \ `Telnet` 以明文传输数据，因此建议使用安全 shell，它可以加密登录和密码凭据。`SSH` 还提供了通过安全复制协议 (`SCP`) 安全地传输文件的机制以及\
  \ SFTP。 |\n| 23 | `Telnet` | Telnet - `Telnet` 是一种终端仿真协议，可以通过 `TCP/IP` 连接登录远程系统。访问是基于文本的，允许用户在远程主机上的提示符处输入内容，远程主机显示的文本显示在本地\
  \ Telnet 客户端上。`Telnet` 不加密客户端与服务器之间的通信文本。因此，强烈建议不要使用 `telnet`。大多数系统将关闭端口 `23` 并禁用\
  \ `telnet` 服务以防止其使用。应该用 `SSH` 代替 `Telnet`。 |\n| 25 | `SMTP` | 邮件传输协议 - `SMTP` 定义了电子邮件从一个网络主机发送到另一个主机的机制。`SMTP`\
  \ 是一种简单的协议，要求接收主机始终可用。通常接收主机会将入邮件存储在队列中，供接收者使用 `POP3` 或 `IMAP` 协议访问。此外，`SMTP` 使用\
  \ `TCP` 传输协议以确保无错交付。 |\n| 53 | `DNS` | 域名系统 - `TCP/IP` 网络用于将主机名完全限定域名 (`FQDN`)转换为\
  \ IP 地址的服务。 |\n| 69 | `TFTP` | 简易文件传输协议 - `TFTP` 是文件传输协议 (`FTP`) 的精简版本。它的命令集较少且缺乏身份验证。`TFTP`\
  \ 最显著的特征是它使用 `UDP` 传输数据。这导致了高传输速度，但因此缺乏数据可靠性。`TFTP` 通常用于无盘工作站的网络启动。 |\n| 80 | `HTTP`\
  \ | 超文本传输协议 - `HTTP` 用于从 Web 服务器下载文本、图形和多媒体到 浏览器。它定义了浏览器和服务器之间的命令和控制机制，定义了客户端请求和服务器响应。`HTTP`\
  \ 基于 `TCP` 传输协议，因此是一种面向连接的协议。 |\n\n\n\n\n\n### 协议端口与服务摘要\n\n| 端口 | 协议 | 描述 |\n|\
  \ --- | --- | --- |\n| 110 | `POP3` | 邮局传输协议 - `POP3` 协议是一种用于从服务器存储和检索入站邮件消息的机制。在大多数企业环境中，入站邮件存储在电子邮件服务器上，并在用户检查邮件时下载到运行在用户桌面或笔记本电脑上的电子邮件客户端上。然而，`POP3`\
  \ 会将所有新消息下载到客户端，不允许用户选择下载哪些消息、查看邮件头或仅下载消息的部分内容。由于这个原因，`IMAP` 协议越来越多地被取代 `POP3`。\
  \ |\n| 119 | `NNTP` | 网络新闻传输协议 - 负责在 Usenet 新闻服务器（即托管在远程服务器上的新闻组和讨论论坛）之间发布和检索消息的。`NNTP`\
  \ 运行在 OSI 栈的应用层，并使用 `TCP` 确保消息检索和传输的无误。 |\n| 123 | `NTP` | 网络时间协议 - 一种旨在将计算机时钟与外部时间源同步的协议。使用此协议，操作系统或应用程序可以从远程\
  \ `NTP` 服务器请求当前时间。远程 `NTP` 服务器通常基于原子钟提供的时间。`NTP` 有助于确保网络中的所有系统都设置为相同的、准确的当日时间。这在安全情况下尤为重要，例如当客户端或服务器上文件被访问或修改的时间受到质疑时。\
  \ |\n| 143 | `IMAP4` | 互联网消息访问协议第 4 版 - `IMAP4` 是一种先进且安全的邮件检索协议。`IMAP` 与 `POP3`\
  \ 类似，允许用户访问存储在电子邮件服务器上的邮件消息。然而，`IMAP` 包含许多额外功能，例如选择性地下载消息、查看消息头、搜索消息以及下载消息的部分内容。此外，`IMAP4`\
  \ 使用认证并完全支持 `Kerberos` 认证。 |\n| 161 | `SNMP` | 简单网络管理协议 - 提供了一种机制，网络管理员可以通过该机制收集网络设备（如集线器、桥器、路由器和交换机）的信息。`SNMP`\
  \ 协议允许运行在网络设备上的代理向中央管理器通信其状态，反之，允许管理器向设备代理发送新的配置参数。代理可以进一步配置为在发生特定事件（称为陷阱 traps）时通知管理器。`SNMP`\
  \ 使用 `UDP` 发送和接收数据。 |\n| 443 | `HTTPS` | 安全超文本传输协议 - 标准的 `HTTP`（非安全）协议以明文传输数据（即无加密，且任何可能截获流量的人可见）。虽然这对于大多数网页浏览用途是可以接受的，但当信用卡详情等机密信息需要从浏览器传输到\
  \ Web 服务器时，它会带来严重的安全风险。`HTTPS` 使用安全套接层（`SSL`）在客户端和服务器之间发送加密数据。 |\n| 2049 | `NFS`\
  \ | 网络文件系统 - 最初由 Sun Microsystems 开发，随后被整个行业广泛采用，`NFS` 允许通过网络访问远程系统上的文件系统，就就像该文件系统位于本地磁盘驱动器一样。`NFS`\
  \ 广泛用于基于 `UNIX` 和 `LINUX` 的系统。后版本的 Microsoft Windows 也可以访问基于 `UNIX` 和 `LINUX` 的系统上的\
  \ `NFS` 共享文件系统。 |\n\n表 13-1\n\n## 13.5 总结\n\n一个新安装的 `RHEL 9` 系统由于没有在系统端口上运行的服务，通常被认为是安全的。然而，一旦系统开始配置使用，确保通过实施防火墙来使其免受攻击就变得非常重要。在配置防火墙时，理解各种端口和相应的服务非常重要。\n\
  \n有几种防火墙选项可用，最基本的是 `iptables` 防火墙接口的命令行配置。通过 `firewalld` 可提供更直观、高级的选项，这将在下一章中介绍。\n\
  \n### 14. 使用 firewalld 进行 RHEL 9 防火墙配置\n\n防火墙对于保护计算机系统或计算机网络免受外部攻击（通常来自通过互联网连接的外部源）至关重要。例如，任何直接连接到互联网的计算机必须运行防火墙以防止恶意活动。同样，任何内部网络必须在与外部互联网连接之间拥有某种形式的防火墙。\n\
  \n所有 Linux 发行版都提供了某种形式的防火墙解决方案。在 `RHEL 9` 的情况下，这表现为名为 `firewalld` 的服务。\n\n虽然防火墙配置的主题可能复杂，但幸运的是，`RHEL\
  \ 9` 提供了命令行、基于 Web 和图形化的工具来简化防火墙的配置过程。本章将介绍 `firewalld` 的基本概念，并涵盖使用操作系统提供的工具配置防火墙所需的步骤。\n\
  \n#### 14.1 firewalld 简介\n\n`firewalld` 服务使用一组规则来控制入站网络流量，并定义哪些流量应被阻止，哪些流量被允许通过系统，它构建在名为\
  \ `iptables` 的更复杂的防火墙工具之上。\n\n`firewalld` 系统提供了一种管理入站流量的灵活方法。例如，防火墙可以配置为阻止来自特定外部\
  \ IP 地址的流量，或防止所有到达特定 `TCP/IP` 端口的流量。还可以定义规则将入站流量转发到不同的系统，或作为互联网网关来保护网络上的其他计算机。\n\
  \n按照标准安全实践，默认的 `firewalld` 安装配置为阻止所有访问，除了 `SSH` 远程登录和系统获取动态 IP 地址所需的 `DHCP` 服务（这两者对于管理员在安装完成后访问系统至关重要）。\n\
  \n防火火墙配置的关键元素是区域（zones）、接口（interfaces）、服务（services）和端口（ports）。\n\n##### 14.1.1 区域\n\
  \n默认情况下，`firewalld` 安装了一系列预配置的区域。区域是一个预配置的规则集，可以随时应用于系统以实现特定场景的防火墙配置。例如，`block`\
  \ 区域阻止所有入站流量，而 `home` 区域假设系统运行在更安全的环境中，会有更高的信任度，因此实施不那么严格的规则。可以向系统添加新区域，并对现有区域进行修改以添加或删除规则。也可以从系统中完全删除区域。[表\
  \ 14-1] 列出了 `RHEL 9` 系统默认可用的区域集：\n\n| 区域 | 描述 |\n| --- | --- |\n| `drop` | 最安全的区域。仅允许出站连接，丢弃所有入站连接且不向连接客户端发送通知。\
  \ |\n| `block` | 与 `drop` 区域类似，区别是入站连接会通过 `icmp-host-prohibited` 或 `icmp6-adm-prohibited`\
  \ 通知被拒绝。 |\n| `public` | 供连接到公共网络或互联网时使用，在这些情况下其他计算机不可信。允许某些入站连接。 |\n| `external`\
  \ | 当系统作为计算机网络的互联网网关时，`external` 区域应用于连接到互联网的接口。正如本章稍后所述，在实施伪装或网络地址转换 (NAT) 时，该区域将与\
  \ `internal` 区域配合使用。允许某些入站连接。 |\n\n\n\n\n\n| zone | Description |\n| :--- | :---\
  \ |\n| internal | 与外部区域配合使用，并应用于连接到内部网络的接口。假设内部网络上的计算机是信任的。允许特定的入站连接。 |\n| dmz |\
  \ 用于系统运行在非军事化区 (DMZ) 时。这些通常是公开访问但与你的内部网络其他部分隔离的计算机。允许特定的入站连接。 |\n| work | 用于在其他计算机受信任的工作环境网络运行系统。允许特定的入站连接。\
  \ |\n| home | 用于在其他计算机受信任的家庭网络运行系统。允许特定的入站连接。 |\n| trusted | 最不安全的区域。接受所有入站连接。 |\n\
  | nm-shared | 此区域由 `NetworkManager` 在实现连接共享时在内部使用。 |\n| libvirt | 由虚拟网络使用，通常当服务器托管虚拟机时。\
  \ |\n\n### 表 14-1\n\n要查看特定区域的设置，请参考位于系统 `/usr/lib/firewalld/zones` 目录下的对应 XML 配置文件。例如，下表列出了\
  \ `public.xml` 区域配置文件的内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <zone>\n  <short>Public</short>\n  <description>用于公共区域。你不信任网络上的其他计算机不会损坏你的计算机。只接受特定的入站连接。</description>\n\
  \  <service name=\"ssh\"/>\n  <service name=\"dhcpv6-client\"/>\n  <service name=\"\
  cockpit\"/>\n  <forward/>\n</zone>\n```\n\n### 14.1.2 接口\n\n任何连接到互联网或网络（或两者兼有）的\
  \ RHEL 9 系统都包含至少一个物理或虚拟网络设备形式的接口。当 `firewalld` 激活时，这些接口中的每一个都被分配到一个区域，从而允许为不同的接口分配不同级别的防火墙安全。例如，考虑一个包含两个接口的服务器；一个连接到外部互联网，另一个连接到内部网络。在这种情况下，面向外部的接口可能会被分配给限制性更强的\
  \ `external` 区域，而内部接口可能会使用 `internal` 区域。\n\n### 14.1.3 服务\n\nTCP/IP 定义了一组在标准端口上通信的服务。例如，安全的\
  \ HTTPS Web 连接使用端口 `443`，而 SMTP 邮件服务使用端口 `25`。为了选择性地启用特定服务的入站流量，可以区域添加 `firewalld`\
  \ 规则。例如，`home` 区域默认不允许入站 HTTPS 连接。可以通过向区域添加规则以允许入站 HTTPS 连接来启用此类流量，而无需引用特定的端口号。\n\
  \n### 14.1.4 端口\n\n虽然在添加 `firewalld` 规则时可以引用常用的 TCP/IP 服务，但会出现需要在未分配服务的特定端口上允许入站连接的情况。这可以通过添加引用特定端口而非服务的规则来实现。这种技术在“Cockpit\
  \ Web 界面概述”章节中使用过，当时开放了端口 `9090` 以允许访问 Cockpit Web 界面。\n\n### 14.2 检查 firewalld\
  \ 状态\n\n所有 RHEL 9 实例都默认安装并启用了 `firewalld` 服务。可以通过以下命令检查服务的状态：\n\n```bash\nsystemctl\
  \ status firewalld\n```\n\nfirewalld.service - firewalld - dynamic firewall daemon\n\
  \    Loaded: loaded (/usr/lib/systemd/system/firewalld.service; enabled; vendor\
  \ preset: enabled)\n    Active: active (running) since Thu 2019-02-14 14:24:31 EST;\
  \ 3 days ago\n      Docs: man:firewalld(1)\n  Main PID: 816 (firewalld)\n    Tasks:\
  \ 2 (limit: 25026)\n    Memory: 30.6M\n    CGroup: /system.slice/firewalld.service\n\
  \      816 /usr/libexec/platform-python -s /usr/sbin/firewalld --nofork --nopid\n\
  ```\n\n如有必要，可以如下方式安装 `firewalld` 服务：\n\n```bash\ndnf install firewalld\n```\n\n\
  `firewalld` 服务默认启用，并在安装后以及每次系统启动时自动启动。\n\n## 14.3 使用 firewall-cmd 配置防火墙规则\n\n`firewall-cmd`\
  \ 命令行工具允许在终端窗口查看 `firewalld` 配置信息，并对区域和规则进行更改。\n\n在更改防火墙设置时，意识到运行时（runtime）配置和永久（permanent）配置的概念非常重要。默认情况下，任何规则更改都被视为运行时配置更改。这意味着虽然更改会立即生效，但在下一次系统重启或\
  \ `firewalld` 服务重载时（例如通过执行以下命令），将会丢失：\n\n```bash\nfirewall-cmd --reload\n```\n\n\
  必须使用 `--permanent` 命令行选项使更改永久化。永久更改在 `firewalld` 服务重载之前不会发生，但在手动更改之前将一直保持有效。\n\n\
  #### 14.3.1 识别和更改默认区域\n\n要识别默认区域（换句话，除非专门选择了不同的区域，否则所有接口将分配到该区域），请使用 `firewall-cmd`\
  \ 工具：\n\n```bash\nfirewall-cmd --get-default-zone\n```\n\n更改默认区域：\n\n```bash\nfirewall-cmd\
  \ --set-default-zone=home\n```\n\n#### 14.3.2 显示区域信息\n\n列出所有区域：\n\n```bash\nfirewall-cmd\
  \ --get-zones\n```\n\n列出分配了接口的活动区域：\n\n```bash\nfirewall-cmd --get-active-zones\n\
  ```\n\n列出特定区域当前配置的规则：\n\n```bash\nfirewall-cmd --zone=home --list-all\n```\n\n列出区域当前开启的服务：\n\
  \n```bash\nfirewall-cmd --zone=public --list-services\n```\n\n获取端口规则列表：\n\n```bash\n\
  firewall-cmd --zone=public --list-ports\n```\n\n#### 14.3.3 添加和删除区域服务\n\n向区域添加服务，在此例中向\
  \ `public` 区域添加 `https`，使用以下命令：\n\n```bash\nfirewall-cmd --zone=public --add-service=https\n\
  ```\n\n默认情况下，这是运行时更改，因此添加的规则将在系统重启后丢失。要永久添加服务以便在下次系统重启时生效，请使用 `--permanent` 标记：\n\
  \n```bash\nfirewall-cmd --zone=public --permanent --add-service=https\n```\n\n要验证服务是否已永久添加，请求服务列表时要包含\
  \ `--permanent` 标记：\n\n```bash\nfirewall-cmd --zone=public --permanent --list-services\n\
  ```\n\n注意，作为永久更改，此新规则在系统重启或 firewalld 重载之前不会生效：\n\n```bash\nfirewall-cmd --reload\n\
  ```\n\n使用 `--remove-service` 选项从区域删除服务。由于这是运行时更改，该规则在下次系统重启时将重新恢复：\n\n```bash\n\
  firewall-cmd --zone=public --remove-service=https\n```\n\n要永久删除服务，请使用 `--permanent`\
  \ 标记，如果需要更改立即生效，请记住重载 firewalld：\n\n```bash\nfirewall-cmd --zone=public --permanent\
  \ --remove-service=https\n```\n\n\n\n\n\n### 14.3.4 使用基于端口的规则\n\n要启用特定端口，请使用 `--add-port`\
  \ 选项。注意，在手动定义端口时，需要提供端口号和协议（`TCP` 或 `UDP`）：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --add-port=5000/tcp\n```\n\n在向区域添加规则时，也可以指定一个端口范围：\n\n```bash\nfirewall-cmd\
  \ --zone=public --permanent --add-port=5900-5999/udp\n```\n\n### 14.3.5 创建新区域\n\n\
  运行以下命令可以创建一个全新的区域。一旦创建，就可以像管理任何预定义区域一样来管理该区域：\n\n```bash\nfirewall-cmd --permanent\
  \ --new-zone=myoffice\n```\nsuccess\n\n在添加新区域后，在区域变为可用之前，需要重启 `firewalld`：\n\n```bash\n\
  firewall-cmd --reload\n```\nsuccess\n\n### 14.3.6 更改区域/接口分配\n\n如前所述，系统上的每个接口都必须分配到一个区域。可以使用\
  \ `firewall-cmd` 工具更改接口所属的区域。在以下示例中，将 `eth0` 接口分配到 `public` 区域：\n\n```bash\nfirewall-cmd\
  \ --zone=public --change-interface=eth0\n```\nsuccess\n\n### 14.3.7 伪装\n\n伪装（Masquerading）在网络管理领域广为人知的网络地址转换（NAT）。当使用\
  \ `RHEL 9` 系统作为计算机网络访问互联网的网关时，伪装允许所有内部系统在互联网通信时使用该 `RHEL 9` 系统的 IP 地址。这样做的好处可以向恶意外部实体隐藏任何系统的内部\
  \ IP 地址，并避免了为网络上的每台计算机分配公网 IP 地址的性。\n\n使用以下命令检查防火墙是否已启用了伪装：\n\n```bash\nfirewall-cmd\
  \ --zone=external --query-masquerade\n```\n\n使用以下命令启用伪装（如果需要使更改永久生效，请记得使用 `--permanent`\
  \ 标志）：\n\n```bash\nfirewall-cmd --zone=external --add-masquerade\n```\n\n### 14.3.8\
  \ 添加 ICMP 规则\n\n网络控制消息协议（ICMP）用于网络上的客户端系统之间相互发送信息（例如错误消息）。它也是 `ping` 命令的基础，网络管理员和用户都使用它来检测特定客户端在网络上是否活跃。`ICMP`\
  \ 允许阻止特定的 `ICMP` 消息类型。例如，管理员可能会选择阻止传入的 `ping`（回显请求）`ICMP` 消息，以防止基于 `ping` 的拒绝服务（DoS）攻击的可能性（即服务器被恶意的大量\
  \ ping 消息冲击，导致无法响应合法请求）。\n\n要查看可包含 `firewalld` 规则的 `ICMP` 类型，请运行以下命令：\n\n```bash\n\
  firewall-cmd --get-icmptypes\n```\naddress-unreachable bad-header beyond-scope communication-prohibited\
  \ destination-unreachable echo-reply ...\n\n例如，以下命令为 `public` 区域永久添加一条规则来阻止 `echo-reply`（ping\
  \ 请求）消息：\n\n```bash\nfirewall-cmd --zone=public --permanent --add-icmp-block=echo-reply\n\
  ```\n\n### 14.3.9 实现端口转发\n\n当 `RHEL 9` 系统作为内部计算机网络到互联网的网关时，端口转发通常与伪装结合使用。端口转发允许通过互联网从特定端口到达防火墙的流量转发到内部网络上的特定系统。这通过示例来描述可能最为恰当。\n\
  \n假设一个 `RHEL 9` 系统作为内部计算机网络的防火墙，网络上的其中一个系统被配置为 Web 服务器。假设该 Web 服务器系统的 IP 地址为 `192.168.2.20`。托管在该系统上的网站的域名记录配置为位于\
  \ `RHEL 9` 防火墙系统后的公网 IP 地址。当 HTTP 网页请求从端口 `80` 到达时，作为防火墙的 `RHEL 9` 系统需要知道如何处理它。通过配置端口转发，可以将所有网络流量重定向到托管\
  \ Web 服务器的内部系统（在此例中，IP 地址为 `192.168.2.20`），可以继续使用端口 `80`，也可以将流量重定向到目标服务器上的不同端口。事实上，端口转发甚至可以配置将流量转发到防火墙相同系统的不同端口（此概念被称为本地转发）。\n\
  \n要使用端口转发，首先按照如下方式启用伪装（在此例中，假设连接到互联网的接口已分配给 `external` 区域）：\n\n```bash\nfirewall-cmd\
  \ --zone=external --add-masquerade\n```\n\n从一个端口转发到不同的本地端口，将使用类似下面的命令：\n\n```bash\n\
  firewall-cmd --zone=external --add-forward-port=port=22:proto=tcp:toport=2750\n\
  ```\n\n在上面的示例中，任何位于端口 `22` 的 `TCP` 流量都将转发到本地系统的端口 `2750`。另一方面，以下命令将 IP 地址为 `192.168.0.19`\
  \ 的系统上的端口 `20` 转发到 `22`：\n\n```bash\nfirewall-cmd --zone=external \\\n         \
  \    --add-forward-port=22\n```\n\n### 14.4 通过 Cockpit 界面管理 fireld\n\n到目前为止，本章提供了\
  \ `firewalld` 的概述，并探索了使用 `firewall-cmd` 命令行工具管理区域和接口。虽然 `firewall-cmd` 提供了管理配置的最灵活方式，但也可以在\
  \ Cockpit 控制台中查看和管理默认区域的服务。\n\n要访问防火墙设置，请登录 Cockpit 界面并从侧边栏选择 `Networking`。在网络页面上，如图\
  \ 14-1 所示找到 `Firewall` 部分并点击 `Edit rules and zones` 按钮：\n\n`Firewall` 页面显示了默认区域配置的服务（并允许删除服务）、向区域添加新服务以及开启和关闭防火墙。\n\
  \n### 14.5 使用 firewall-config 管理 firewalld\n\n如果你可以使用图形桌面环境，可以使用 `firewall-config`\
  \ 工具配置防火墙。虽然默认未安装，但可以通过以下方式安装 `firewall-config`：\n\n```bash\ndnf install firewall-config\n\
  ```\n\n启动后，将如图 14-3 所示的 `firewall-config` 主界面：\n\n工具的关键区域总结如下：\n\n- A：显示所有当前活动接口及其分配的区域。要将接口分配到不同的区域，请在此面板中选择它，点击\
  \ `Change Zone` 按钮并从弹出对话框中选择所需的区域。\n- B：控制显示的信息以及工具内所做的任何更改是应用于运行时规则还是永久规则。\n- C：系统上配置的区域、服务或\
  \ `Sets` 列表。此面板中的信息取决于工具栏 F 中的选择。从此列表中选择项目将更新标记为 D 的主面板。\n- D：主面板包含有关工具栏 E 当前选择类别的信息。在此示例中，面板显示了\
  \ `public` 区域的服务。每个服务旁边的选择框控制该服务是否在防火墙中启用。在这些类别面板中可以添加新规则或对现有规则进行配置或删除。\n\n\n\n\n\
  \nE - 控制面板 D 中显示的内容。从此栏中选择项目将显示所选类别的当前规则。\n\nF - 控制面板 C 中显示的列表。\n\n`firewall-config`\
  \ 工具使用简单直观，它允许在图形环境中执行许多可以使用 `firewall-cmd` 完成的任务。\n\n## 14.6 总结\n\n一个精心规划和实施的防火墙对于任何安全系统都至关重要。对于\
  \ RHEL 9 而言，`firewalld` 服务提供了一个既灵活又易于管理的防火墙系统。\n\n`firewalld` 服务使用“区域”（zones）的概念将一组组防火墙规则分组，并包含了一系列预定义的区域，旨在满足各种防火墙保护需求。可以对这些区域进行修改以添加或删除规则，也可以创建并配置全新的区域。系统上连接到网络或互联网的网络设备称为接口（interfaces）。每个接口反会被分配到一个区域。用于\
  \ `firewalld` 的主要工具是 `firewall-cmd` 命令行工具和 `firewall-config` 图形实用程序。Cockpit Web\
  \ 界面也提供少量的防火墙管理选项。\n\n## 15. 在 RHEL 9 上配置基于密钥的 SSH 身份验证\n\n首次安装 RHEL 9 系统时，默认配置允许通过\
  \ Secure Shell (SSH) 连接进行远程命令行访问。SSH 为 root 账户以及安装期间添加任何其他用户提供了受密码保护和加密的系统访问。然而，这种安全级别是不够的，应该尽快升级为基于密钥的身份验证。\n\
  \n本章将概述通过实现基于密钥的 SSH 身份验证来提高 RHEL 9 系统安全性的步骤。\n\n## 15.1 Secure Shell (SSH) 概述\n\
  \nSSH 设计用于安全远程访问系统以获取 shell 访问并传输文件和数据。正如在使用 VNC 进行 RHEL 9 远程桌面 中提到的，SSH 还可以提供安全隧道，通过网络连接实现对\
  \ GNOME 桌面的远程访问。\n\n基本的 SSH 配置由一个客户端（用于建立连接的计算机）和一个服务器（运行在要连接的系统上）组成。用户可以使用运行在 Linux、Windows\
  \ 或 macOS 系统上的 SSH 客户端连接到运行在 RHEL 9 系统上的 SSH 服务器，以获取 shell 命令行提示符或执行文件传输。客户端和服务器之间的所有通信（包括获取访问时输入的密码）都经过加密，以防止外部人员拦截数据。\n\
  \n基础 SSH 实现的固有弱点是它完全依赖于分配给系统账户的密码强度。如果恶意方能够识别出账户的密码（通过猜测、欺骗或暴力破解攻击），系统就会变得脆弱。通过实现基于密钥的\
  \ SSH 验证可以解决这一弱点。\n\n## 15.2 基于密钥的身份验证\n\n基于密钥的 SSH 身份验证使用非对称公钥加密为远程系统访问增加额外的安全性。公钥加密的概念由\
  \ Whitfield Diffie 和 Martin Hellman 于 1975 年发明，基于使用私钥和公钥对。\n\n在公钥加密系统中，公钥用于加密数据，这些数据只能由私钥的所有者解密。\n\
  \n在基于密钥的 SSH 身份验证中，主机持有 SSH 客户端所在的私钥，而相应的公钥则存储在运行 SSH 服务器的系统上。因此，保护私钥至关重要，因为拥有密钥的所有权将允许任何人登录远程系统。作为额外的保护，私钥还可以被加密并受密码保护，每次建立到服务器的连接时必须输入该密码。\n\
  \n### 15.3 设置基于密钥的身份验证\n\n设置基于密钥的 SSH 身份验证有四个步骤，总结如下：\n\n1. 生成公钥和私钥。\n2. 在服务器上安装公钥。\n\
  3. 测试身份验证。\n4. 在服务器上禁用基于密码的身份验证。\n\n本章的其余部分将为 Linux、macOS 和基于 Windows 的客户端操作系统详细介绍这些步骤。\n\
  \n## 15.4 安装并启动 SSH 服务\n\n如果系统上尚未安装并运行 SSH 服务器，可以使用以下命令添加：\n\n```bash\ndnf install\
  \ openssh-server\nsystemctl start sshd.service\nsystemctl enable sshd.service\n\
  ```\n\n### 15.5 从 Linux 和 macOS 客户端进行基于密钥的身份验证\n\n设置基于密钥的身份验证的第一步是在客户端系统上生成密钥对。如果客户端系统运行的是\
  \ Linux 或 macOS，则使用 `ssh-keygen` 工具来实现：\n\n```bash\nssh-keygen\n```\n\n该命令将产生类似下面的输出：\n\
  \n```\nGenerating public/private rsa key pair.\nEnter file in which to save the\
  \ key (/home/<username>/.ssh/id_rsa):\n```\n\n按 Enter 键接受密钥文件的默认位置。这将在当前用户主目录的 `.ssh`\
  \ 子目录下放置两个文件。私钥将存储在名为 `id_rsa` 的文件中，而公钥将存在于名为 `id_rsa.pub` 的文件中。\n\n接下来，`ssh-keygen`\
  \ 将提示输入用于保护私钥的短语（passphrase）。如果提供了短语，私钥将在本地磁盘上加密，访问远程系统时需要该短语。为了更好的安全，建议使用短语。\n\n\
  ```\nEnter passphrase:```\n\n最后，`ssh-keygen` 工具将生成以下输出，表示密钥已生成：\n\n```\nYour identification\
  \ has been saved in /home/neil/.ssh/id_rsa\nYour public key has been saved in /home/neil/.ssh/id_rsa.pub\n\
  The fingerprint is: SHA256:FOLEEGjWnCT5wtTO5hdimzUEMYfo <username>@hostname>\nThe\
  \ key’s randomart image is:\n+---[RSA 2048----+\n|.BB+=*..\n|o+B *\n|===.. +\n|*\
  \ * |\n|| o |\n|+ +\n| .\n```\n\n下一步是将公钥安装到远程服务器上。可以使用 `ssh-copy-id` 工具来实现：\n\n\
  ```bash\nssh-copy-id username@remote_hostname\n```\n\n例如：\n\n```bash\nssh-copy-id\
  \ neil@192.168.1.100\n```\n\n```\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to\
  \ be installed: \"/home/neil/.ssh/id_rsa.pub\"\n/usr/bin/ssh-copy-id: INFO: attempting\
  \ to log in with the new key(s), to filter out any that are already installed\n\
  /usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted\
  \ now it is to install the new keys\nneil@192.168.1.100’s password:\nNumber of key(s)\
  \ added: 1\n```\n\n现在尝试使用 `ssh 'neil@192.168.1.100'` 登录机器，并检查是否只添加了需要的密钥。\n\n一旦安装完成，通过使用\
  \ `ssh` 客户端尝试远程登录来测试身份验证是否有效：\n\n```bash\nssh -l <username> <hostname>\n```\n\n\
  如果私钥加密并受短语保护，在提示时输入短语以完成身份验证并建立到 RHEL 9 系统的远程访问：\n\n```\nEnter passphrase for key\
  \ '/home/neil/.ssh/id_rsa':\n```\n\n对服务器上需要远程访问的其他账户重复这些步骤。如果还需要从其他客户端系统访问，请将 `id_rsa`\
  \ 私钥文件复制到其他系统主目录下的 `.ssh` 子目录。\n\n\n\n\n按照目前的配置，仍然可以使用安全性较低的密码认证访问远程系统。一旦你确认了基于密钥的认证工作正常，就需要在系统上禁用密码认证。要了解如何更改此设置，请先打开\
  \ `/etc/ssh/sshd_config` 文件并找到以下行：\n\n`Include /etc/ssh/sshd_config.d/*.conf`\n\n\
  这告诉我们 `sshd` 配置设置是由 `/etc/ssh/sshd_config.d` 目录下的文件控制的。这些文件名必须以数字开头，并具有 `.conf`\
  \ 文件扩展名，例如：\n\n`01-permitrootlogin.conf`\n\n`50-redhat.conf`\n\n数字前缀指定了文件相对于文件夹中其他文件的优先级，其中\
  \ `01` 优先级最高。这确保了如果某个配置文件包含与另一个文件冲突的设置，优先级最高的那个将始终具有优先权。\n\n在 `/etc/ssh/sshd_config.d`\
  \ 文件夹中，创建一个名为 `02-nopasswordlogin.conf` 的新文件，内容如下：\n\n`PasswordAuthentication no`\n\
  \n保存文件并重启 `sshd` 服务以实施更改：\n\n```bash\nsystemctl restart sshd.service\n```\n\n从现在起，将仅允许使用\
  \ SSH 密钥认证远程访问系统，并且在这样做时，你不需要输入密码。\n\n## 15.6 管理多个密钥\n\n客户端系统中存在多个私钥是常见现象，每个密钥提供对不同服务器的访问。因此，在建立连接时有多种选项可以选择特定的密钥。例如，可以在启动\
  \ `ssh` 客户端时如下指定要使用的私钥文件：\n\n```bash\nssh -l neilsmyth -i ~/.ssh/id_work 35.194.18.119\n\
  ```\n\n或者，`ssh` 客户端用户配置文件可以将密钥文件与服务器关联。该配置文件名为 `config`，必须位于用户主目录下的 `.ssh` 目录，并可用于配置广泛选项，包括私钥文件、连接时使用的默认端口、默认用户名以及用于引用服务器的简短别名。下面的示例配置文件为两个服务器定义了不同的密钥文件，并允许通过\
  \ `home` 和 `work` 别名引用它们。对于工作系统，该文件还指定了认证时使用的用户名：\n\n```text\nHost work\n  HostName\
  \ 35.194.18.119\n  IdentityFile ~/.ssh/id_work\n  User neilsmyth\nHost home\n  HostName\
  \ 192.168.0.21\n  IdentityFile ~/.ssh/id_home\n```\n\n在设置配置文件之前，用户本会使用以下命令连接到工作系统：\n\
  \n```bash\nssh -l neilsmyth -i ~/.ssh/id_work 35.194.18.119\n```\n\n现在，命令可以缩短为：\n\
  \n```bash\nssh work\n```\n\n运行以下命令可以找到配置文件选项的完整列表：\n\n```bash\nman ssh_config\n\
  ```\n\n# 15.7 从 Windows 客户端进行 SSH 密钥认证\n\n最近的 Windows 版本包含了大多数 Linux 和 macOS 系统所使用的\
  \ OpenSSH 实现子集，部分位于 Windows PowerShell。这允许按照为 Linux 和 macOS 概述的步骤，从 Windows 客户端设置基于密钥的认证。\n\
  \n在 Windows 上，搜索 `Windows PowerShell` 并选择它。运行后，将出现 PowerShell 窗口。\n\n如果你已经有一个来自另一个系统的私钥，请将\
  \ `id_rsa` 文件复制到 Windows 系统上名为 `.ssh` 的文件夹中。文件到位后，在 PowerShell 窗口中按如下测试认证：\n\n```bash\n\
  ssh -l <username>@<hostname>\n```\n例如：\n```powershell\nPS:\\Users\\neil> ssh -l\
  \ neil 192.168.1.100\n```\n在提示时输入 `C:\\Users\\neil\\ssh\\id_rsa` 的口令。\n\n如果私钥不存在，请在\
  \ PowerShell 窗口中使用 `ssh-keygen` 按相同的步骤生成新的公钥对。密钥生成后，它们将位于当前用户主目录的 `.ssh` 目录中，公钥文件\
  \ `id_rsa.pub` 需要安装在远程 RHEL 9 系统上。遗憾的是，Windows PowerShell 不包含 `ssh-copy`，因此此任务必须手动执行。在\
  \ PowerShell 窗口中，切换到 `.ssh` 目录并显示公钥 `id_rsa.pub` 的内容：\n\n```powershell\nPS:\\Users\\\
  neil> cd .ssh\nPS:\\Users\\neil\\ssh> type id_rsa.pub\n```\n选中文件内容并使用 `Ctrl-C` 复制。留在\
  \ PowerShell 窗口中，使用密码认证登录远程系统：\n\n```powershell\nPS:\\Users\\neil\\.ssh> ssh -l\
  \ <username> <hostname>\n```\n登录成功后，检查 `.ssh` 目录是否存在。如果不存在，按如下方式创建它：\n\n```bash\n\
  mkdir .ssh\n```\n检查是否存在名为 `authorized_keys` 的文件。如果不存在，创建它并将来自 Windows 系统的公钥内容粘贴到其中。如果\
  \ `authorized_keys` 文件已存在，它可能包含其他密钥。如果是这样，编辑该文件并将新公钥粘贴到文件末尾。\n\n# 15.8 使用 PuTTY\
  \ 进行 SSH 密钥认证\n\n对于没有可用 OpenSSH 的 Windows 系统，或作为使用 PowerShell 更灵活的替代方案，PuTTY 工具是一种广泛使用的替代方案。使用\
  \ PuTTY 的第一步是在需要 SSH 客户端的 Windows 系统上下载并安装它。PuTTY 是一个免费工具。\n\n在为所有账户设置并验证了基于密钥的认证后，按照上一节最后在\
  \ RHEL 9 系统上禁用密码认证。\n\n\n\n\n接下来，需要使用 `PuTTYgen` 工具将私钥文件转换为 PuTTY 私钥格式文件。在 Windows\
  \ 开始菜单的搜索栏中输入“PuTTY Key Generator”查找该实用程序并启动它：\n\n![](img/putty_key_generator.png)\n\
  \n图 15-2\n\n-ce\n\n启动后，点击位于 `Actions` 部分的 `Load` 按钮，并导航到之前复制到 `.ssh` 文件夹的私钥文件（注意，可能需要将文件类型过滤器更改为\
  \ `All Files (*.*)` 才能看到密钥文件）。找到后，选择该文件并加载到 `PuttyGen`。在出现提示时，输入最初用于加密该文件的口令（passphrase）。导入私钥后，点击\
  \ `Save Private Key` 按钮将其保存为 PuTTY 密钥文件。为了保持一致性，请将密钥文件保存到 `.ssh` 文件夹，但赋予一个不同的名称以与原始密钥文件区分开。\n\
  \n从开始菜单启动 `PuTTY`，在主界面输入远程服务器的 IP 地址或主机名，然后选择左侧面板中的 `Connection -> SSH -> Auth ->\
  \ Credentials` 类别，如图 15-3 所示：\n\n![](img/putty_credentials.png)\n\n图 15-3\n\n点击\
  \ `Private key for authentication` 字段旁边的 `Browse` 按钮，导航并选择之前保存的 PuTTY 私钥文件。然后（可选），滚动到左侧面板顶部，选择\
  \ `Session` ，并在 `Saved Sessions` 字段中为会话输入名称，最后点击 `Save` 按钮。这将保存会话配置，以便以后使用，而无需每次重新输入设置。\n\
  \n最后，点击 `Open` 按钮建立与远程服务器的连接，在提示时输入用户名和口令以完成身份验证。\n\n## 15.9 使用 PuTTYgen 生成私钥\n\n\
  上一节探讨了在操作 `PuTTY` 时使用现有的私钥和公钥。如果没有密钥，可以使用包含在 `PuTTY` 主安装程序中的 `PuTTYgen` 工具创建。\n\n\
  要创建新密钥，启动 `PuttyGen` 并点击图 15-4 中高亮的 `Generate` 按钮：\n\n![](img/putty_key_generator_generate.png)\n\
  \n图 15-4\n\n按照指示移动鼠标指针生成随机数据，然后输入可选的口令来加密私钥。密钥生成后，使用 `Save public key` 和 `Save private\
  \ key` 按钮将文件保存到合适的位置。如上一节所述，私钥可用于 `PuTTY`。要在远程服务器上安装公钥，请参考早期章节中关于在 Windows 的 `PowerShell`\
  \ 中使用 `SSH` 的步骤。\n\n## 15.10 总结\n\n对 `RHEL 9` 系统的任何远程访问必须以提供高安全性的方式来实现。默认情况下，`SSH`\
  \ 允许使用基于密码的验证进行远程系统访问。然而，这使得系统受到任何能猜密码或或其他手段获取密码的人的影响。因此，建议使用基于密钥的验证来保护系统访问。基于密钥的验证使用涉及公钥和私钥的公钥加密。实施后，只有当用户使用的客户端私钥与服务器上的公钥匹配时，才能连接到服务器。作为额外的安全层，私钥还可以进行加密并密码保护。一旦实施了基于密钥的加密，服务器系统将配置为禁用安全性较低的基于密码的验证。\n\
  \n本章提供了 `SSH` 密钥验证的概述，并概述了在 macOS、Linux 和 Windows 上生成密钥和配置客户端的步骤，以及在 `RHEL 9` 服务器上安装和管理公钥的步骤。\n\
  \n## 16. 使用 VNC 进行 RHEL 9 远程桌面访问\n\n`RHEL 9` 可以配置为通过网络或互联网连接提供图形化桌面环境的远程访问。虽然默认未启用，但从网络或互联网上的其他系统显示并访问\
  \ `RHEL 9` 桌面是相对简单的。无论该系统运行 Linux、Windows 还是 macOS，都可以实现这一点。甚至有适用于 Android 和 iOS\
  \ 的应用程序，可以让你从几乎任何有数据信号的地方访问 `RHEL 9` 桌面。\n\n远程桌面访问在许多场景下都很有帮助。例如，它允许你或其他人从同一网络或互联网上的另一台计算机系统查看并与你的\
  \ `RHEL 9` 桌面环境交互。当你由于离开座位（例如旅行期间）需要在电脑上工作时，这非常有用。当同事或 IT 支持人员需要访问你的桌面来解决问题时，它也有帮助。\n\
  \n当 `RHEL 9` 系统运行在云服务器上时，它还允许访问桌面环境，作为使用命令行提示符或 `Cockpit` Web 控制台执行管理任务的替代。\n\n\
  `RHEL 9` 远程桌面功能基于名为虚拟网络计算（VNC）的技术。本章将涵盖在 `RHEL 9` 中配置和使用远程桌面的关键方面。\n\n### 16.1 安全与安全的远程桌面访问\n\
  \n在本章中，我们将涵盖安全和不安全的远程桌面访问方法。假设你在安全的内部网络从一个系统访问另一个系统，使用不安全的访问方法通常是安全的。但如果你计划通过任何公共网络远程访问桌面，必须使用安全的访问方法，以避免系统和数据被破坏。\n\
  \n## 16.2 安装 GNOME 桌面环境\n\n当然，只有在安装了桌面本身的情况下，才能访问桌面环境。例如，如果系统最初被配置为服务器，则可能没有安装桌面包。运行\
  \ `GNOME` 桌面所需的软件包的简单方法是执行组安装。安装包组以启用特定功能的关键是知道该组的名称。在编写时，`RHEL 9` 上有两个安装桌面的组：`Server\
  \ with GUI` 和 `Workstation`。由于组名称可能会从一个 RHEL 版本变为另一个版本，因此使用 `dnf` 工具获取已安装或可用的组列表是有帮助的，如下：\n\
  \n```bash\ndnf grouplist\n```\n\n更新订阅管理存储。\n\n可用的环境组：\n  Server with GUI\n  Minimal\
  \ Install\n  Workstation\n  Custom Operating System\n  Virtualization Host\n\n已安装的环境组：\n\
  \  Server\n\n已安装的组：\n  Container Management\n  Headless Management\n\n可用的组：\n  Legacy\
  \ UNIX Compatibility\n  Graphical Administration Tools\n  Smart Card Support\n \
  \ RPM Development Tools\n  .NET Development\n  System Tools\n  Development Tools\n\
  \  Console Internet Tools\n  Security Tools\n  Network Servers\n  Scientific Support\n\
  \n在上述示例中，`Workstation` 环境组显示可用（因此未安装）。要在安装之前获取有关组内容的更多信息，请使用以下命令：\n\n```bash\ndnf\
  \ groupinfo workstation\n```\n\n更新订阅管理存储。\n\n环境组：Workstation\n描述：Workstation 是适用于笔记本电脑和\
  \ PC 的易用桌面系统。\n强制组：\n  Common NetworkManager submodules\n  Core\n  Fonts\n  GNOME\n\
  \  Guest Desktop Agents\n  Hardware Support\n  Internet Browser\n  Multimedia\n\
  \  Printing Client\n  Standard\n  Workstation product core\n  base-x\n可选组：\n  Backup\
  \ Client\n  GNOME Applications\n  Headless Management\n\n\n\n\n\n# 办公套件与效率工具\n\n\
  ## 远程桌面客户端\n\n## 智能卡支持\n\n在确认这是正确的组后，可以按照以下方式安装：\n\n```bash\ndnf groupinstall workstation\n\
  ```\n\n安装完成后，假设系统已添加了显示器，可以使用以下 `startx` 命令启动桌面：\n\n```bash\nstartx\n```\n\n另一方面，如果系统是没有直接连接显示器的服务器，那么运行和访问桌面的唯一方法是在系统上配置\
  \ VNC 支持。\n\n## 16.3 在 RHEL 9 上安装 VNC\n\n访问远程桌面需要在远程系统上安装 VNC 服务器，在发起连接的系统上安装 VNC\
  \ 查看器，并（视情况而定）需要一个安全的 SSH 连接。虽然有多种 VNC 服务器和查看器实现，但红帽公司已统一采用 `TigerVNC` 作为标准，它为基于\
  \ Linux 的操作系统提供了服务器和查看器组件。非 Linux 平台的 VNC 查看器客户端包括 `RealVNC` 和 `TightVNC`。\n\n要在\
  \ RHEL 9 上安装 `TigerVNC` 服务器包，请运行以下命令：\n\n```bash\ndnf install tigervnc-server\n\
  ```\n\n如果需要，也可以按照以下方式安装 `TigerVNC` 查看器：\n\n```bash\ndnf install tigervnc\n```\n\n\
  安装服务器后，必须配置系统以运行一个或多个 VNC 服务，并在防火墙上打开相应的端口。\n\n## 16.4 配置 VNC 服务器\n\n安装 VNC 服务器包后，下一步是配置服务器。第一步是为远程桌面环境用户指定密码。以\
  \ root 身份登录时，执行 `vncpasswd` 命令（假设用户名为 `demo`）：\n\n```bash\nsu - demo\n[demo@demoserver\
  \ ~]$ vncpasswd\nPassword:\nVerify:\nWould you like to enter a view-only password\
  \ (y/n)? n\nA view-only password is not used\n[demo@demoserver ~]$ exit\n```\n\n\
  接下来，需要在 `/etc/systemd/system` 目录下创建一个名为 `vncserver@.service` 的 VNC 服务器配置文件。该文件的内容如下，其中所有的\
  \ `<USER>` 实例应替换为设置 VNC 密码时引用的用户名：\n\n```ini\n[Unit]\nDescription=Remote desktop\
  \ service (VNC)\nAfter=syslog.target network.target\n\n[Service]\nType=forking\n\
  WorkingDirectory=/home/<USER>\nUser=<USER>\nGroup=<USER>\nExecStartPre=/bin/sh -c\
  \ ‘/usr/bin/vncserver -kill %i > /dev/null 2>&1 || :’\nExecStart=/usr/bin/vncserver\
  \ -autokill %i\nExecStop=/usr/bin/vncserver -kill %i\nRestart=on-success\nRestartSec=15\n\
  \n[Install]\nWantedBy=multi-user.target\n```\n\n接下来，需要配置防火墙以为远程 VNC 查看器实例提供对 VNC\
  \ 服务器的外部访问，例如：\n\n```bash\nfirewall-cmd --permanent --zone=public --add-port=5901/tcp\n\
  firewall-cmd --reload\n```\n\n创建服务配置文件后，需要如下方式启用并启动服务：\n\n```bash\nsystemctl daemon-reload\n\
  systemctl start vncserver@:1.service\nsystemctl enable vncserver@:1.service\n```\n\
  \n注意，服务名称中包含 `:1` 表示这是 VNC 服务器显示器 1 的服务。这与之前在防火墙中打开的 5901 端口匹配。\n\n按照如下方式检查服务是否成功启动：\n\
  \n```bash\nsystemctl status vncserver@:1.service\n```\n\n如果服务启动失败，运行 `journalctl`\
  \ 命令检查错误消息：\n\n```bash\njournalctl -xe\n```\n\n此外，尝试重启系统后重试。如果服务持续失败，可以通过登录指定用户并运行\
  \ `vncserver` 命令来手动启动 VNC 服务器：\n\n```bash\nvncserver :1\n```\n\n## 16.5 连接到 VNC\
  \ 服务器\n\nVNC 查看器适用于多种操作系统。因此，快速在互联网搜索可能会提供许多关于如何在您选择的平台上获取和安装此工具的详细链接。\n\n在安装了 `TigerVNC`\
  \ 等 VNC 查看器的 Linux 系统桌面上，可以通过终端窗口如下所示建立远程桌面连接：\n\n```bash\nvncviewer <hostname>:<display\
  \ number>\n```\n\n在上面的示例中，`<hostname>` 是远程系统的主机名或 IP 地址，而 `<display number>` 是 VNC\
  \ 服务器桌面的显示编号，例如：\n\n```bash\nvncviewer 192.168.1.115:1\n```\n\n或者，在不带任何选项的情况下运行命令，根据提示输入远程服务器详细信息：\n\
  \n![](img/rhel_vnc_authentication_dialog.png)\n图 16-1\n\n在 VNC 服务器字段中输入主机名或 IP 地址，后跟显示编号（例如\
  \ `192.168.1.115:1`），并点击连接按钮。查看器将提示输入用户的 VNC 密码以完成连接，此时，一个包含远程桌面的新窗口将会出现。\n\n本节假设是从\
  \ Linux 或 UNIX 系统访问远程桌面；相同的步骤适用于大多数其他操作系统。\n\n使用本节中的步骤连接到 VNC 服务器会产生不安全的未加密连接。这意味着在远程会话期间传输的数据是易受截获的。因此，需要额外的步骤来建立安全的加密连接。\n\
  \n## 16.6 建立安全的远程会话\n\n本章介绍的远程桌面配置是不安全的，因为没有使用加密。当远程连接受防火墙保护的内部网络时是可以接受的。然而，对于互联网连接需要更安全的选项。这通过通过安全壳\
  \ (SSH) 隧道远程桌面来实现。本节将涵盖如何在 Linux、UNIX 和 macOS 上进行操作。\n\nSSH 服务器在 RHEL 9 系统上通常默认安装并激活。如果您的系统并非如此，假设\
  \ SSH 服务器已安装，可以使用如下命令登录远程系统以建立安全隧道：\n\n```bash\nssh -l <username> -L 5901:localhost:5901\
  \ <remotehost>\n```\n\n在上面的示例中，`<username>` 是配置了 VNC 访问的远程系统账户，`<remotehost>` 是远程系统的主机名或\
  \ IP 地址，例如：\n\n```\nssh -l neilsmyth -L 5901:localhost:5901 192.168.1.115\n```\n\
  \n在提示时使用账户密码登录。建立安全连接后，是启动 `vncviewer` 来使用安全隧道。在另一个终端窗口中保留 SSH 会话，启动另一个终端并输入以下命令：\n\
  \n```bash\nvncviewer localhost:5901\n```\n\n如果需要，vncviewer 会话将提示密码，然后启动 VNC 查看器提供对桌面环境的安全访问。\n\
  \n尽管连接现在是安全的且加密的，VNC 查看器很可能会报告连接是不安全的。例如，图 16-2 显示了在 macOS 系统上运行的 `RealVNC` 查看器显示的警告框：\n\
  \n![](img/rhel_8_vnc_viewer_not_encrypted.png)\n图 16-2\n\n遗憾的是，尽管连接现在是安全的，但 VNC\
  \ 查看器软件无法得知这一点，因此继续发出警告。然而，请放心，只要使用了 SSH 隧道，连接确实是安全的。\n\n\n\n\n上述命令将提示输入服务器的密码，然后在后台建立连接，留下终端窗口供其他任务使用。如果你从防火墙外部连接远程桌面，请记住\
  \ SSH 连接的 IP 地址将由 ISP 或云托管商提供的外部 IP 地址，而不是系统的 IP 地址（因为它在防火墙外是不可见的）。因此，你还需要配置防火墙转发端口\
  \ `22`（用于 SSH 连接）到运行桌面的系统。不需要转发端口 `5900`。端口转发步骤在不同防火墙之间有所不同，请参考您的防火墙文档。\n\n## 16.7\
  \ 使用 PuTTY 建立安全隧道\n\n在 Windows 系统上通过 PuTTY 建立安全桌面会话的方法类似。假设你已经安装了 VNC 客户端，剩下的要求是\
  \ SSH 客户端。一旦下载并安装了 `PuTTY`，第一步是在 Windows 系统与 RHEL 9 系统之间建立安全连接。启动后，显示如下屏幕：\n\n![](img/home_screen.png)\n\
  \n图 16-3\n\n输入远程主机的 IP 地址或主机名（如果你从防火墙外部连接）。下一步是设置隧道。点击左侧树形结构中 `SSH` 旁边的 `+`，选择 `Tunnels`。随后应出现屏幕：\n\
  \n![](img/tunnels_screen.png)\n\n图 16-4\n\n输入 `5901` 作为 `Source`（源），`localhost:5901`\
  \ 作为 `Destination`（目的），并点击 `Add`。最后，通过点击 `Session` 返回主屏幕。在 `Saved Sessions` 字段中输入会话名称并按\
  \ `Save`。点击 `Open` 建立连接。终端窗口将弹出远程系统的登录凭据。SSH 连接已建立。启动 `TightVNC` 查看器，在 `VNC Server`\
  \ 字段中输入 `localhost:5901`，然后点击 `Connect`。查看器将建立连接并提示密码，然后显示 Linux 系统的远程桌面。\n\n##\
  \ 16.8 关闭桌面会话\n\n要关闭 VNC 服务器托管的桌面会话，请使用命令行选项 `--kill` 加上要终止的桌面编号。例如：\n\n```bash\n\
  vncserver –kill :1\n```\n\n## 16.9 排除 VNC 连接故障\n\n由于后台有许多活动，VNC 有时看起来可能不透明，特别是当出现问题导致服务器无法启动或连接并产生错误消息时。不过有一些跟踪和解决\
  \ VNC 问题的方法：\n\n如果 VNC 服务启动失败，检查服务的 `systemctl status` 错误消息：\n\n```bash\nsystemctl\
  \ status vncserver@:1.service\n```\n\n要获取更详细的信息，通过运行 `journalctl` 命令检查 `systemd`\
  \ 日志：\n\n```bash\njournalctl -xe\n```\n\n额外信息可能位于位于日志文件中：\n\n`/home/<username>/.vnc/<hostname>:<display\
  \ number>.log`\n\n例如：\n\n`/home/neilsmyth/.vnc/rhelserver01.localdomain:1.log`\n\
  \n如果 `systemd` VNC 服务仍然启动 VNC 服务器，尝试使用以下命令手动启动：\n\n```bash\nvncserver :<display\
  \ number>\n```\n\n例如：\n\n```bash\nvncserver :1\n```\n\n检查输出和日志文件是否有有助于识别问题的错误。然后，如果服务器成功启动，尝试再次连接\
  \ VNC 查看器。\n\n如果 VNC 服务器似乎正在运行，但从查看器的连接失败，可能值得检查正确的防火墙端口是否打开。通过以下方式识别默认区域：\n\n```bash\n\
  firewall-cmd --get-default-zone\n```\n\n`public`\n\n获取默认区域后，检查必要的端口是否打开：\n\n```bash\n\
  firewall-cmd --permanent --zone=public --list-ports\n```\n\n`5901/tcp` `5900/tcp`\n\
  \n如果 VNC 使用的端口未打开，按如下方式添加端口：\n\n```bash\nfirewall-cmd --permanent --zone=public\
  \ --add-port=<port number>/tcp\n```\n\n## 16.10 总结\n\n可以使用虚拟网络计算（VNC）启用 RHEL 9 系统的\
  \ GNOME 桌面环境的远程访问。VNC 由运行在远程服务器上对应的本地客户端组成，允许远程访问服务器上的多个桌面实例。\n\n当通过公共连接使用 VNC 连接时，建议使用\
  \ SSH 隧道以确保客户端和服务器之间的通信加密且安全。\n\n# 17. 远程显示 RHEL 9 应用程序（X11 转发）\n\n在上一节中，我们看了如何在远程计算机上显示整个\
  \ RHEL 9 桌面。虽然当你需要远程显示整个桌面时这种方法很好，但如果你只想显示单个应用程序，这可能被认为是大材小用。因此，本章将查看远程系统中显示单个应用程序。\n\
  \n### 17.1 远程显示 RHEL 9 应用程序的要求\n\n在一个系统上运行应用程序并在另一个系统显示它有几个先决条件。首先，显示应用程序的系统必须运行\
  \ X 服务器。如果是一个带有桌面环境的 Linux 或 Unix 系统，则没有这个问题。然而，如果系统是 Windows 或 macOS，你必须安装一个 X\
  \ 服务器才能从远程显示。有很多可用的商业和免费 Windows 版 X 服务器。\n\n其次，运行应用程序的系统（而非显示应用程序的系统）必须配置允许 SSH\
  \ 访问。在 RHEL 9 上配置 SSH 的详情可以参见基于密钥的 SSH 认证。该系统还需要运行 Xorg 而不是 Wayland。要启用 Xorg 系统，编辑\
  \ `/etc/gdm/custom.conf` 文件并取消 `WaylandEnable` 行的注释并重启系统：\n\n```ini\n# 取消下面注释以强制登录界面使用\
  \ Xorg\nWaylandEnable=false\n```\n\n最后，SSH 必须配置允许 X11 转发。这通过在发生转发的 SSH 配置中添加以下指令来实现。在\
  \ RHEL 9 默认情况下，`/etc/sshd_config` 文件包含一个指令来包含 `/etc/ssh/sshd_config.d` 目录中的所有配置文件：\n\
  \n```\nInclude /etc/ssh/sshd_config.d/*.conf\n```\n\n在新安装的系统中，文件夹中会创建一个名为 `50-redhat.conf`\
  \ 文件。编辑此文件并确保 `X11Forwarding` 属性启用：\n\n```ini\nX11Forwarding yes\n```\n\n更改后，保存文件并重启\
  \ SSH 服务：\n\n```bash\nsystemctl restart sshd\n```\n\n## 17.2 远程显示 RHEL 9 应用程序\n\n\
  远程显示应用程序的第一步是移动到显示应用程序的系统。在该系统中，与远程系统建立 SSH 连接以便获得命令行提示符。这可以使用 `ssh` 命令来实现。在使用 `ssh`\
  \ 命令时，我们需要使用 `-X` 标志告诉它我们计划通过连接隧道 X11 流量：\n\n```bash\n$ ssh -X user@hostname\n```\n\
  \n\n\n在上面的示例中，`user` 是用于登录远程系统的用户名，而 `hostname` 是远程系统的主机名或 IP 地址。在登录提示符处输入您的密码，登录后，运行以下命令查看\
  \ `DISPLAY` 设置：\n\n```\n$ echo $DISPLAY\n```\n\n该命令的输出应类似于下面的内容：\n\n```\nlocalhost:10.0\n\
  ```\n\n如需显示应用程序，请从命令行提示符运行它。例如：\n\n```\n$ gedit\n```\n\n执行上述命令时，该命令应在远程系统上运行 `gedit`\
  \ 工具，但在本地系统上显示用户界面。\n\n## 17.3 可信的 X11 转发\n\n如果远程系统 上的 `/etc/ssh/sshd_config.d/50-redhat.conf`\
  \ 文件包含以下行，则可以使用可信的 X11 转发：\n\n```\nForwardX11Trusted yes\n```\n\n可信的 X11 转发速度比不可信的转发稍快一点，但安全性较低，因为它没有参与\
  \ X11 安全控制。在使用可信的 X11 转发时，需要使用 `-Y` 标志：\n\n```\n$ ssh -Y user@hostname\n```\n\n\
  ## 17.4 压缩的 X11 转发\n\n在使用较慢的连接时，可以使用 `ssh -C` 标志对 X11 数据进行压缩以提高性能：\n\n```\n$ ssh\
  \ -X -C user@hostname\n```\n\n## 17.5 在 Windows 上显示远程 RHEL 9 应用\n\n要在 Windows 上显示基于\
  \ RHEL 9 的应用程序，必须在 Windows 系统上安装 SSH 客户端和 X 服务器。关于在 Windows 上安装和使用 `PuTTY` 客户端的主题已在书中之前的“在\
  \ RHEL 9 上配置基于密钥的认证”章节中介绍。如果您尚未在 Windows 系统上安装 `PuTTY`，请参考该章节。\n\n在 X 服务器方面，有多个选项可用，尽管其中一个流行的选择似乎是\
  \ `VcXsrv`，它可以通过以下 URL 免费获取：\n\n[`sourceforge.net/projects/vcxsrv/`](https://sourceforge.net/projects/vcxsrv/)\n\
  \n一旦安装了 `VcXsrv` X 服务器，桌面和开始菜单上将出现名为 `XLaunch` 的应用程序。启动 `XLaunch` 并选择一个显示选项（最灵活的是“Multiple\
  \ windows”选项，它允许每个客户端应用在它自己的窗口中出现）：\n\n![](img/vcxsrvr_xlaunch_settings.png)\n\n\
  图 17-1\n\n点击 `Next` 按钮继续后续屏幕，并接受默认配置设置。在最后一个屏幕上，点击 `Finish` 按钮启动 X 服务器。如果出现 Windows\
  \ Defender 对话框，请点击该按钮允许访问您所选的网络。\n\n运行后，`XLaunch` 将显示在任务栏中，可以通过右键点击图标并选择 `Exit...`\
  \ 菜单选项退出：\n\n![](img/vcxsrvr_xlaunch_menu.png)\n\n图 17-2\n\n在安装并运行 X 服务器后，启动 `PuTTY`，并输入远程主机的连接信息，或者加载之前保存的会话配置。但是，在建立连接之前，需要启用\
  \ X11 转发。因此，在 `PuTTY` 主窗口中，向下滚动左侧面板中的选项，展开 `SSH` 部分并选择 `X11` 选项，如图 17-3 所示：\n\n\
  ![](img/win_10_putty_ssh.png)\n\n图 17-3\n\n勾选图 17-4 中突出显示的 `Enable X11 forwarding`\
  \ 复选框，返回会话屏幕并打开连接（如果您计划再次使用，请提前保存会话）：\n\n![](img/putty_enable_x11_forwarding.png)\n\
  \n图 17-4\n\n在 `PuTTY` 会话窗口中登录 RHEL 9 系统并运行桌面应用程序。稍等片，该程序将以自己的窗口显示在 Windows 桌面上。应用程序打开的任何对话框也将出现在独立的窗口中，就像它们在\
  \ RHEL 9 GNOME 桌面上的显示一样。例如，图 17-5 显示了在 Windows 11 系统上显示的 RHEL 9 `nm-connection-editor`\
  \ 工具：\n\n![](img/x11_windows_forwarding.png)\n\n图 17-5\n\n## 17.6 总结\n\n对于需要远程访问单个\
  \ RHEL 9 桌面应用程序而非整个 GNOME 桌面的情况，X11 转发提供了一种远程显示图形应用程序的轻量级解决方案。显示程序的系统必须运行基于 X Window\
  \ 系统的桌面环境（如 GNOME）或安装并运行 X 服务器。一旦在远程服务器上启用了 X11 转发，并从本地系统使用 X11 转发选项建立了安全的 SSH 连接，大多数应用程序就可以在本地\
  \ X 服务器上显示。\n\n# 18. 在 RHEL 9 上使用 NFS 与远程系统共享文件\n\nRHEL 9 提供了两种与网络上其他系统共享文件和文件夹的机制。一种方法是使用名为\
  \ `Samba` 的技术。`Samba` 基于 Windows 文件夹共享，允许 Linux 系统让 Windows 系统访问文件夹，并反之亦然。另一种方法是专门用于在\
  \ Linux 和 UNIX 系统之间共享文件夹的网络文件系统 (`NFS`)。`NFS` 允许一台计算机上的文件系统通过网络被另一台计算机访问。\n\n##\
  \ 18.1 确保 RHEL 9 上运行 NFS 服务\n\n第一个任务是验证您的 RHEL 9 系统上是否安装并运行了 NFS 服务。这可以通过命令行或 Cockpit\
  \ 界面实现。在后台，NFS 使用远程过程调用 (`RPC`) 在网络上共享文件系统。首先通过运行以下命令安装 `rpcbind` 和 `nfs-utils`：\n\
  \n```bash\n# dnf install rpcbind nfs-utils\n```\n\n接下来，配置这些服务以便启动时自动运行：\n\n```bash\n\
  # systemctl enable rpcbind\n# systemctl enable nfs-server\n```\n\n一旦启用了服务，按以下方式启动它们：\n\
  \n```bash\n# systemctl start rpcbind\n# systemctl start nfs-server\n```\n\n### 18.2\
  \ 配置 RHEL 9 防火墙允许 NFS 流量\n\n接下来，需要配置防火墙允许 NFS 流量。为了实现此目标，运行以下 `firewall-cmd` 命令，并将\
  \ `<zone>` 替换为适用于您的防火墙区域：\n\n```bash\n# firewall-cmd --zone=<zone> --permanent --add-service=mountd\n\
  # firewall-cmd --zone=<zone> --permanent --add-service=nfs\n# firewall-cmd --zone=<zone>\
  \ --permanent --add-service=rpc-bind\n# firewall-cmd --reload\n```\n\n## 18.3 指定要共享的文件夹\n\
  \n现在 NFS 已经运行且防火墙已配置好，我们需要指定 RHEL 9 文件系统的哪些部分可以被远程 Linux 或 UNIX 系统访问。这些设置可以在 `/etc/exports`\
  \ 文件中声明，必须修改该文件以导出用于远程访问的目录。\n\n\n\n在上述行中，`<export>` 被替换为要导出的目录，`<host1>` 是授予访问权限的系统名称或\
  \ IP 地址，而 `<options>` 代表要对该访问施加的限制（只读、读写等）。如果需要，可以将多个主机和选项条目放在同一行上。例如，下行向 IP 地址为\
  \ `192.168.2.38` 的主机授予 `/datafiles` 目录的只读权限：\n\n```\n/datafiles 192.168.2.38(ro)\n\
  ```\n\n允许使用通配符将导出应用到多个主机。例如，下行允许所有外部主机对 `/home/demo` 具有读写权限：\n\n```\n/home/demo\
  \ *(rw)\n```\n\n通过查阅 `exports` 的 deman 帮助页（man page），可以找到 `exports` 文件支持的完整选项列表：\n\
  \n```\n#man exports\n```\n\n在本章中，我们将如下所示配置 `/etc/exports` 文件：\n\n```\n/tmp *(rw,sync)\
  \ own/vol1 192.168.86.42(ro,sync)\n```\n\n配置完成后，需要使用 `exportfs` 命令根据最新的 `/etc/exports`\
  \ 设置更新由 NFS 服务器维护的导出文件系统表：\n\n```\n#exportfs -a\n```\n\n也可以使用 `exportfs` 工具从命令行查看当前的共享设置：\n\
  \n```\n#exportfs\n```\n\n上述命令将生成以下输出：\n\n```\n/vol1 192.168.86.42\n/tmp <world>\n\
  ```\n\n## 18.4 访问共享文件夹\n\n用户可以通过从命令行手动挂载共享文件夹，从而在客户端系统上访问这些共享文件夹。但是，在尝试挂载远程 NFS\
  \ 文件夹之前，必须先在客户端系统上安装 `nfs-utils` 包：\n\n```\n#dnf install nfs-utils\n```\n\n要从命令行挂载远程文件夹，请打开终端窗口并创建一个你想挂载远程共享文件夹的目录：\n\
  \n```\n$mkdir /home/demo/tmp\n```\n\n接下，使用远程 NFS 服务器的 IP 地址或主机名输入挂载远程文件夹的命令，例如：\n\
  \n```\n$sudo mount -t nfs 192.16.86.24:/tmp /home/demo/tmp\n```\n\n远程 `/tmp` 文件夹随后将挂载到本地系统上。挂载后，`/home/demo/tmp`\
  \ 文件夹将包含远程文件夹及其所有内容。\n\n在挂载远程 NFS 文件系统时，也可以指定选项。例如，以下命令挂载了相同的文件夹，但将其配置为只读：\n\n```\n\
  $sudo mount -t nfs -o ro 192.168.86.24:/tmp /home/demo/tmp\n```\n\n## 18.5 在系统启动时挂载\
  \ NFS 文件系统\n\n也可以通过编辑 `/etc/fstab` 文件，配置 RHEL 9 系统在每次启动时自动挂载远程文件系统。当将其加载到编辑器中时，它可能看起来如下：\n\
  \n```\n/dev/mapper/rhel-root / xfs defaults 0 0\nUUID=c4ba0b0f-777a-42a8 /boot xfs\
  \ defaults 0 0\nUUID=052D-19D8 /boot/efi vfat umask=0077,shortname=winnt 0 2\n/dev/mapper/rhel-swap\
  \ none swap defaults 0 0\n```\n\n例如，为了将路径为 `/tmp` 的文件夹（位于 IP 地址为 `192.168.86.24`\
  \ 的系统上）挂载到本地路径 `/home/demo/tmp`（注意该文件夹必须已存在），向 `/etc/fstab` 文件中添加以下行：\n\n```\n192.168.86.24:/tmp\
  \ /home/demo/tmp nfs rw 0 0\n```\n\n下次系统重启时，远程系统上的 `/tmp` 文件夹将挂载到本地的 `/home/demo/tmp`\
  \ 挂载点。此时，访问远程文件夹中的所有文件就像它们存在本地硬盘上一样。\n\n## 18.6 卸载 NFS 挂载点\n\n一旦使用 NFS 挂载了远程文件系统，可以使用\
  \ `umount` 命令并将本地挂载点作为命令行参数进行卸载。例如，以下命令将卸载我们的示例文件系统挂载点：\n\n```\n$sudo umount /home/demo/tmp\n\
  ```\n\n## 18.7 在 Cockpit 中访问 NFS 文件系统\n\n除了使用命令行在客户端挂载远程 NFS 文件系统外，也可以在 Cockpit\
  \ Web 界面中执行挂载操作。假设客户端系统已安装并配置了 Cockpit，从浏览器登录 Cockpit 界面，并从左侧导航面板选择 `Storage`（存储）选项。如果没有\
  \ `Storage` 选项，则需要安装 `cockpit-storaged` 包：\n\n```\n#dnf install cockpit-storaged\n\
  #systemctl restart cockpit.socket\n```\n\n一旦 Cockpit 服务重启，再次登录 Cockpit 界面，此时 `Storage`\
  \ 选项应该是可见的。\n\n选中后，主存储页面将包含一个列出已挂载 NFS 文件系统的部分，如图 18-1 所示：\n\n![](img/cockpit_nfs.png)\n\
  \n图 18-1\n\n要挂载文件系统，点击上方显示的 `+` 按钮并输入远程 NFS 服务器和共享的信息。\n\n## 18.8 总结\n\n网络文件系统（NFS）是一种客户端/服务器系统，最初由\
  \ Sun 公司开发，为 Linux 和 Unix 系统提供了共享文件系统的方法。NFS 允许客户端访问和修改远程文件，就像它们存储在本地硬盘上一样。\n\n\
  # 19. RHEL9 与 Windows 系统之间的文件共享\n\n尽管 Linux 已经在桌面市场取得了一定进展，但其起源和未来主要是面向服务器的。因此，并不意外，RHEL\
  \ 9 可以作为文件服务器。因此，一个常见的需求是 RHEL 9 系统上的文件可以被 Linux、Unix 和 Windows 系统访问。同样，Windows\
  \ 系统上的共享文件夹和打印机可能也需要从 RHEL 9 系统进行访问。\n\nWindows 系统使用名为 Server Message Block（SMB）的协议共享资源和打印机。为了让\
  \ RHEL 9 系统通过网络向 Windows 系统提供此类资源以及反之，必须支持 SMB。这是通过 Samba 技术实现的。\n\n## 19.1 从 GNOME\
  \ 桌面访问 Windows 资源\n\n在详细介绍 Samba 共享之前，值得注意的是，如果你只是想从 GNOME 桌面访问 Windows 共享文件夹，那么\
  \ GNOME Files 应用已经提供了这种支持。Files 应用如图 19-1 所示位于程序栏中：\n\n![](img/file_in_dashboard.png)\n\
  \n图 19-1\n\n启动后，选择左侧导航面板中的 `Other Locations`（其他位置）选项，然后点击主面板中的 `Windows Network`（Windows\
  \ 网络）图标即可浏览可用的 Windows 资源。\n\n\n\n\n![](img/rhel_files_windows.png)\n\n图 19-2\n\n\
  ## 19.2 Samba 与 Samba Client\n\nSamba 允许 RHEL 9 资源与 Windows 系统共享，同时也允许 Windows 资源与\
  \ RHEL 9 系统共享。RHEL 使用 `Samba` 客户端访问 Windows 资源。相反，RHEL 资源通过安装和配置 `Samba` 服务来与 Windows\
  \ 系统共享。\n\n## 19.3 在 RHEL 9 上安装 Samba\n\nRHEL 9 安装过程中使用的默认设置通常不会安装必要的 Samba 软件包。除非你特别请求了安装\
  \ Samba，否则你的系统中很可能没有安装 Samba。要检查是否安装了 Samba，打开终端窗口并运行以下命令：\n\n```bash\nrpm -q samba\
  \ samba-common samba-client\n```\n\n可以使用 `dnf` 命令行工具安装任何缺失的软件包：\n\n```bash\ndnf\
  \ install samba samba-common samba-client\n```\n\n## 19.4 配置 RHEL 9 防火墙以启用 Samba\n\
  \n接下来，必须配置保护 RHEL 9 系统的防火墙以允许 Samba 流量。可以使用以下 `firewall-cmd` 命令实现：\n\n```bash\n\
  firewall-cmd --permanent --add-port={139/tcp,445/tcp}\nfirewall-cmd --reload\n```\n\
  \n在启动 Samba 服务之前，需要执行一些配置步骤来定义 RHEL 系统如何向 Windows 系统显示以及与远程客户端共享的资源。大多数配置任务在 `/etc/samba/smb.conf`\
  \ 文件中完成。\n\n## 19.5 配置 smb.conf 文件\n\nSamba 是一个高度灵活且可配置的系统，为控制 Windows 网络上的资源共享方式提供了许多选项。遗憾的是，这种灵活性可能会导致人们认为\
  \ Samba 过于复杂。然而实际上，典型的安装不需要许多配置选项，设置基础配置的学习曲线相对较短。\n\n在本章中，我们将查看如何将 RHEL 9 系统加入\
  \ Windows 工作组，并设置一个目录作为特定用户可以访问的共享资源。这种配置被称为独立 Samba 服务器。虽然也提供了更高级的配置，例如将 Samba\
  \ 集成到活动目录（Active Directory）环境中，但这些内容超出了本书的范范围。\n\n配置 Samba 的第一步是编辑 `/etc/samba/smb.conf`\
  \ 文件。\n\n## 19.5.1 配置 [global] 段\n\n`smb.conf` 文件分为多个段。第一个段是 `[global]` 段，可以在此处指定适用于整个\
  \ Samba 配置的设置。虽然这些设置是全局的，但每个选项都可以在其他配置文件的段中被覆盖。\n\n第一个任务是定义 RHEL 9 资源将要共享的 Windows\
  \ 工作组名称。这通过 `[global]` 段的 `workgroup` 指令进行控制，其默认配置如下：\n\n```ini\nworkgroup = SAMBA\n\
  ```\n\n如有必要，首先将其更改为实际的工作组名称。\n\n除了 `workgroup` 设置外，其他设置表明这是一个独立服务器，用户密码将保护共享资源。在继续配置要共享的资源之前，还需要将以下参数添加到\
  \ `[global]` 段中：\n\n```ini\n[global]\n.\n.\n    netbios name = LinuxServer\n```\n\
  \n“netbios name”属性指定了服务器在网络上其他系统可见的名称。\n\n## 19.5.2 配置共享资源\n\n下一步步骤是配置共享资源（换句话说，即从\
  \ Windows 网络上的其他系统可以访问的资源）。为了实现这一点，需要为该段命名，以便在共享时引用。例如，如果我们计划共享 RHEL 9 系统的 `/sampleshare`\
  \ 目录，我们可以将该段命名为 `[sampleshare]`。在此段中，可以使用各种配置选项。然而，对于此示例，我们只需定义要共享的目录，指示该目录既可浏览又可写，并声明该资源为公共以便访客用户访问：\n\
  \n```ini\n[sampleshare]\n    comment = Example Samba share\n    path = /sampleshare\n\
  \    browseable = Yes\n    public = yes\n    writable = yes\n```\n\n要限制特定用户的访问，可以使用“valid\
  \ users”属性，例如：\n\n```ini\nvalid users = demo, bobyoung, marcewing\n```\n\n## 19.5.3\
  \ 不必要的共享\n\n`smb.conf` 文件预先配置了共享打印机和系统用户主目录的段。如果不需要共享这些资源，可以注释掉相应的段，以便 Samba 忽略它们。在接下来的示例中，`[homes]`\
  \ 段已被注释：\n\n```ini\n.\n.\n#[homes]\n# comment = Home Directories\n# valid users\
  \ = %S, %D%w%S\n# browseable = No\n# read only = No\n# inherit acls = Yes\n.\n.\n\
  ```\n\n## 19.6 为 Samba 配置 SELinux\n\nSELinux 是默认集成到所有 RHEL 9 系统 Linux 内核中的一个系统，为操作系统和用户文件提供了额外的安全保护。\n\
  \n从传统上讲，Linux 安全基于允许用户决定谁可以访问他们的文件和其他拥有的其他资源。例如，考虑一个位于特定用户主目录并由该用户拥有的文件。该用户可以控制该文件的访问权限。这种类型的安全被称为自主访问控制，因为资源访问由用户决定。\n\
  \n然而，通过 SELinux，访问由系统控制且不能被用户覆盖。这被称为强制性访问控制，是由 SELinux 策略定义的。继续之前的示例，只有当 SELinux\
  \ 策略（由系统或管理员定义）允许时，文件所有才能执行操作。\n\nRHEL 9 上的 SELinux 状态可以使用 `sestatus` 工具识别：\n\n\
  ```text\nSELinux status: enabled\nSELinuxfs mount: /sys/fs/selinux\nSELinux root\
  \ directory: /etc/selinux\nLoaded policy name: targeted\nCurrent mode: enforcing\n\
  Mode from config file: enforcing\nPolicy MLS: enabled\nPolicy deny_unknown status:\
  \ allowed\nMemory protection checking: actual (secure)\nMax kernel policy version:\
  \ 33\n```\n\nSELinux 可以以强制（enforcing）或许可（permissive）模式运行。启用时，强制模式会拒绝所有 SELinux 策略不允许的操作。相反，许可模式允许通常会被拒绝的操作继续，但会记录在日志文件中。\n\
  \nSELinux 安全基于上下文标签。系统上的所有资源（包括进程和文件）都分配了由用户、角色、类型和可选安全级别组成的 SELinux 上文标签。例如，可以查看文件或文件夹的\
  \ SELinux 上文：\n\n```bash\n$ ls -Z /home/demo\nunconfined_u:object_r:user_home_t:s0\
  \ Desktop\n  unconfined_u:object_r:user_home_t:s0 Documents\n```\n\n同样，可以使用 `ps`\
  \ 命令识别运行进程的上下文，在此例为 `ls` 命令：\n\n```bash\n$ ps -eZ | grep ls\nunconfined_u:unconfined_r:unconfined_t:s0-s0:c0.1023\
  \ 14311 tty1 00:00:18 ls\n```\n\n当进程（例如上述 `ls` 命令）尝试访问文件或文件夹时，SELinux 系统将检查策略以识别是否允许访问。现在考虑\
  \ Samba 服务的上下文：\n\n```bash\n$ ps -eZ | grep smb\nsystem_u:system_r:smbd_t:s0 14129\
  \ ? 00:00:00 smbd\nsystem_u:system_r:smbd_t:s0 14132 ? 00:00:00 smbd-notifyd\n```\n\
  \n\n\n\nSELinux 实现安全的多种方式，最常见的是称为类型强制。基本上，当进程尝试对对象（例如写入文件）执行操作时，SELinux 会检查进程和对象的上下文类型，并验证安全策略是否允许该操作进行。\
  \ Suppose a process of type `A`, for example, attempts to write to a file of type\
  \ `B`. In that case, it will only be permitted if SELinux policy states explicitly\
  \ that a process of type `A` may perform a write operation to a file of type `B`.\
  \ In SELinux enforcement, all actions are denied by default unless a rule specifically\
  \ allows the action to be performed.\n\nSELinux 实现安全的多种方式，最常见的是称为类型强制。基本上，当进程尝试对对象（例如写入文件）执行操作时，SELinux\
  \ 会检查进程和对象的上下文类型，并验证安全策略是否允许该操作进行。假设一个类型为 `A`（例如）的进程尝试写入类型为 `B` 的文件，则只有在 SELinux\
  \ 政策明确说明进程类型 `A` 可以对类型 `B` 的文件执行写入操作时才会被允许。在 SELinux 强制模式下，除非规则明确允许，否则所有操作默认被拒绝。\n\
  \nThe issue with SELinux and Samba is that SELinux policy is not configured to allow\
  \ processes of type `smb_t` to perform actions on files of any type other than `samba_share_t`.\
  \ For example, the `/home/demo` directory listed above will be inaccessible to the\
  \ Samba service because it has a type of `user_home_t`. To make files or folders\
  \ on the system accessible to the Samba service, the enforcement type of those specific\
  \ resources must be changed to `samba_share_t`.\n\nSELinux 与 Samba 之间的问题在于 SELinux\
  \ 政策未配置为允许类型为 `smb_t` 的进程对除 `samba_share_t` 之外的任何文件类型执行操作。例如，上述 `/home/demo` 目录的类型为\
  \ `user_home_t`，因此 Samba 服务无法访问该目录。要使系统中的文件或文件夹可供 Samba 服务访问，必须将这些特定资源的强制类型更改为 `samba_share_t`。\n\
  \nFor this example, we will create the `/sampleshare` directory referenced previously\
  \ in the `smb.conf` file and change the enforcement type to make it accessible to\
  \ the Samba service. Begin by creating the directory as follows:\n\n```bash\nmkdir\
  \ /sampleshare\n```\n\nNext, check the current SELinux context on the directory:\n\
  \n```bash\n$ ls -aZ /sampleshare/\nunconfined_u:object_r:root_t:s0 .\n```\n\nIn\
  \ this instance, the context label of the folder has been assigned a type of `root_t`.\
  \ To make the folder sharable by Samba, the enforcement type needs to be set to\
  \ `samba_share_t` using the `semanage` tool as follows:\n\n```bash\nsemanage fcontext\
  \ -a -t samba_share_t \"/sampleshare(/.*)?\"\n```\n\nNote the use of a wildcard\
  \ in the `semanage` command to ensure that the type is applied to any sub-directories\
  \ and files contained within the `/sampleshare` directory. Once added, the change\
  \ needs to be applied using the `restorecon` command, making use of the `-R` flag\
  \ to apply the change recursively through any sub-directories:\n\n```bash\nrestorecon\
  \ -R -v /sampleshare\n```\n\nRelabeled /sampleshare from unconfined_u:object_r:default_t:s0\
  \ to unconfined_u:object_r:samba_share_t:s0\n\nOnce these changes have been made,\
  \ the folder is configured to comply with SELinux policy for the `smb` process and\
  \ is ready to be shared by Samba.\n\n## 19.7 创建 Samba 用户\n\nAny user that requires\
  \ access to a Samba shared resource must be configured as a Samba User and assigned\
  \ a password. This task is achieved using the `smbpasswd` command-line tool. Consider,\
  \ for example, that a user named `demo` is required to be able to access the `/sampleshare`\
  \ directory of our RHEL 9 system from a Windows system. To fulfill this requirement,\
  \ we must add `demo` as a Samba user as follows:\n\n```bash\nsmbpasswd -a demo\n\
  ```\n\nNew SMB password:\nRetype new SMB password:\nAdded user demo.\n\nNow that\
  \ we have completed the configuration of an elementary Samba server, it is time\
  \ to test our configuration file and then start the Samba services.\n\n## 19.8 测试\
  \ smb.conf 文件\n\nThe settings in the `smb.conf` file may be checked for errors using\
  \ the `testparm` command-line tool as follows:\n\n```bash\ntestparm\n```\n\nLoad\
  \ smb config files from `/etc/samba/smb.conf`\nLoaded services file OK.\nWeak crypto\
  \ is allowed\nServer role: ROLE_STANDALONE\nPress enter to see a dump of your service\
  \ definitions\n\n``` \n# Global parameters\n[global]\nlog file = /var/log/samba/%m.log\n\
  netbios name = LINUXSERVER\nprintcap name = cups\nsecurity = USER\nwins support\
  \ = Yes\nidmap config * : backend = tdb\ncups options = raw\n\n[sampleshare]\ncomment\
  \ = Example Samba share\nguest ok = Yes\npath = /sampleshare\nread only = No\n\n\
  [homes]\nbrowseable = No\ncomment = Home Directories\ninherit acls = Yes\nread only\
  \ = No\nvalid users = %S %D%w%S\n\n[printers]\nbrowseable = No\ncomment = All Printers\n\
  create mask = 0600\npath = /var/tmp\nprintable = Yes\n```\n\n## 19.9 启动 Samba 和\
  \ NetBIOS 名称服务\n\nFor a RHEL 9 server to operate within a Windows network, the Samba\
  \ (SMB) and NetBIOS nameservice (NMB) services must be started. Optionally, also\
  \ enable the services so that they start each time the system boots:\n\n```bash\n\
  systemctl enable smb nmb\nsystemctl start smb nmb\n```\n\nBefore attempting to connect\
  \ from a Windows system, use the `smbclient` utility to verify that the share is\
  \ configured:\n\n```bash\nsmbclient -U demo -L localhost\n```\n\nEnter WORKGROUP\\\
  demo’s password:\nSharename Type Comment\n--------- ---- -------\nsampleshare Disk\
  \ Example Samba share\nprint$ Disk Printer Drivers\nIPC$ IPC IPC Service (Samba\
  \ 4.9.1)\ndemo Disk Home Directories\n```\n\n## 19.10 访问 Samba 共享\n\nNow that the\
  \ Samba resources are configured, and the services are running, it is time to access\
  \ the shared resource from a Windows system. On a suitable Windows system on the\
  \ same workgroup as the RHEL 9 system, open Windows Explorer and navigate to the\
  \ Network panel. At this point, explorer should search the network and list any\
  \ systems using the SMB protocol that it finds. The following figure illustrates\
  \ a RHEL 9 system named `LINUXSERVER` located using Windows Explorer on a Windows\
  \ system:\n\n![](img/rhel_8_connect_to_windows_share.png)\n\nDouble-clicking on\
  \ the `LINUXSERVER` host will prompt for the name and password of a user. In this\
  \ case, it is the `demo` account we configured using `smbpasswd`:\n\n![](img/rhel_8_windows_login.png)\n\
  \nEntering the username and password will result in the shared resources appearing\
  \ in the explorer window, including the previously configured `/sampleshare`:\n\n\
  ![](img/rhel_8_folder_windows.png)\n\nDouble-clicking on the `/sampleshare` shared\
  \ resource will display a listing of the files and directories therein.\n\nIf you\
  \ are unable to see the Linux system or have problems accessing the shared folder,\
  \ try mapping the Samba share to a local Windows drive as follows:\n\n1. Open Windows\
  \ File Explorer, right-click on the Network entry in the left-hand panel, and select\
  \ Map network drive... from the resulting menu.\n2. Select a drive letter from the\
  \ Map Network Drive dialog before entering the path to the shared folder. For example:\
  \ `\\\\LinuxServer\\sampleshare`\n3. Enable the checkbox next to Connect using different\
  \ credentials. For example, if you do not want the drive to be mapped each time\
  \ you log into the Windows system, turn off the corresponding check box:\n\n![](img/windows_map_drive.png)\n\
  \nWith the settings entered, click the Finish button to map the drive, entering\
  \ the username and password for the Samba user when prompted. After a short delay,\
  \ the content of the Samba share will appear in a new File Explorer window.\n\n\
  ## 19.11 从 RHEL 9 访问 Windows 共享\n\nAs previously mentioned, Samba is a two-way street,\
  \ allowing not only Windows systems to access files and printers hosted on a RHEL\
  \ 9 system but also allowing the RHEL 9 system to access shared resources on Windows\
  \ systems. This is achieved using the `samba-client` package, installed at this\
  \ chapter’s start. If it is not currently installed, install it from a terminal\
  \ window as follows:\n\n```bash\ndnf install samba-client\n```\n\nShared resources\
  \ on a Windows system can be accessed from the RHEL desktop using the Files application\
  \ or from the command-line prompt using the `smbclient` and `mount` tools. The steps\
  \ in this section assume that the Windows system has enabled appropriate network-sharing\
  \ settings.\n\nTo access any shared resources on a Windows system using the GNOME\
  \ desktop, launch the Files application and select the Other Locations option. This\
  \ will display the screen shown in Figure 19-7 below, including an icon for the\
  \ Windows Network (if one is detected):\n\n![](img/rhel_8_connect_to_windows_share.png)\n\
  \nFigure 19-7\n\n\n\n...\n\n\n硬件虚拟化利用了 Intel 和 AMD 最新几代 CPU 内置的虚拟化功能。这些技术分别称为 `Intel\
  \ VT` 和 `AMD-V`，它们为运行未修改的虚拟机提供了必要的扩展，且避免了全虚拟化 CPU 仿真所固有的开销。简单来说，这些处理器在 `ring 0`\
  \ 之上提供了一个额外的特权模式（`ring -1`），虚拟机程序（hypervisor）可以在其中运行，从而将 `ring 0` 留给未修改的虚拟机操作系统。\n\
  \n下图展示了 Type-1 虚拟机程序的虚拟化方法：\n\n![](img/type-1_hypervisor_virtualization.png)\n\n\
  图 20-3\n\n如上述图所示，除了虚拟机之外，管理操作系统或管理控制也运行在虚拟机程序之上，允许系统管理员对虚拟机进行管理。\n\n## 20.3 虚拟机网络\n\
  \n虚拟机不可需要连接到网络以发挥实际用途。一种方案是让连接到运行在主机操作系统内部的虚拟网络。在这种配置下，虚拟网络上的任何虚拟机都可以相互看到，但网络地址转换（`NAT`）提供了对外部网络的访问。当使用虚拟网络和\
  \ `NAT` 时，每个虚拟机都使用主机系统的 IP 地址在外部网络（主机所连接的网络）上表示。这是 `RHEL 9` 上 `KVM` 虚拟化的默认行为，且通常不需要额外配置。通常，默认会创建一个虚拟网络，名称为\
  \ `default`，设备为 `virbr0`。\n\n为了让虚拟机在外部网络上显示为独立的个体系统（即拥有自己的 IP 地址），它们必须配置为共享主机上的物理网络接口。实现此点的快速方法是配置虚拟机使用“直接连接”网络配置选项（也称为\
  \ `MacVTap`），这将为虚拟机系统提供一个与主机相同网络上的 IP 地址。遗憾的是，虽然这允许虚拟机访问网络上的其他系统，但使用 `MacVTap` 驱动无法在虚拟机和主机之间建立连接。\n\
  \n更好的选项是在主机系统上配置网络桥接接口并让虚拟机连接。这为虚拟机提供了外部网络上的 IP 地址，同时允许虚拟机和主机进行通信，该主题在创建 RHEL 9\
  \ KVM 网络桥接接口 章节中有所介绍。\n\n## 20.4 总结\n\n虚拟化是在单个主机操作系统内运行多个虚拟机操作系统的能力。目前已开发出多种虚拟化方法，包括虚拟机操作系统虚拟化和虚拟机程序虚拟化。虚拟机程序虚拟化分为两类：Type-1\
  \ 和 Type-2。Type-2 虚拟化解决方案分为半虚拟化、全虚拟化硬件虚拟化，后者使用了某些 Intel 和 AMD 处理器型号的特殊虚拟化功能。\n\n\
  虚拟机客操作系统在网络方面有多种选择，包括 `NAT`、直接连接（`MacVTap`）和网络桥配置。\n\n# 21. 在 RHEL 9 上安装 KVM 虚拟化\n\
  \n早期版本的 `RHEL` 两个虚拟化平台：基于内核的虚拟机（`KVM`）和 `Xen`。在最近的发布中，对 `Xen` 的支持已被移除，留下 `KVM` 作为\
  \ `RHEL 9` 提供的唯一内置虚拟化选项。除了 `KVM` 之外，`VMware` 和 `Oracle VirtualBox` 等产品也提供第三方解决方案。由于\
  \ `KVM` 是随 `RHEL 9` 提供的，此虚拟化解决方案将在在本章及后续章节中介绍。\n\n在深入安装和运行 `KVM` 之前，值得讨论它是如何融入上一节中概述的各种虚拟化类型中的。\n\
  \n## 21.1 KVM 概述\n\n`KVM` 被归类 Type-1 虚拟机程序虚拟化解决方案，它通过 `Intel VT` 和 `AMD-V` 硬件虚拟化支持实现了支持未修改虚拟机操作系统的全虚拟化。\n\
  \n`KVM` 与许多其他 Type-1 解决方案不同，它将主机 Linux 操作系统转换为虚拟机程序，允许在运行完整企业级主机操作系统的同时实现裸金属虚拟化。\n\
  \n### 21.2 KVM 硬件要求\n\n在继续本章之前，我们必须讨论在 `KVM` 环境中运行虚拟机的硬件要求。首先，`KVM` 虚拟化仅适用于某些类型的处理器。如前所述，这些处理器必须包含\
  \ `Intel VT` 或 `AMD-V` 技术。\n\n要检查虚拟化支持情况，请在终端窗口中运行 `lscpu` 命令：\n\n```\nlscpu | grep\
  \ Virtualization:\n```\n\n如果系统包含支持 `Intel VT` 的 CPU，上述命令将提供以下输出：\n\n```\nVirtualization:\
  \ VT-x\n```\n\n或者，当检测到支持 `AMD-V` 的 CPU 时，将显示以下输出：\n\n```\nVirtualization: AMD-V\n\
  ```\n\n如果 CPU 不支持虚拟化，上述 `lscpu` 命令将没有任何输出。\n\n请注意，虽然上述命令仅报告处理器是否支持相应功能，但它并不表示在 BIOS\
  \ 中已启用。这是因为在实践中，大多数系统的 BIOS 默认禁用了虚拟化支持。因此，在继续本教程之前，您应该检查 BIOS 设置，以确保启用了适当的虚拟化技术。\n\
  \n与双启动环境不同，虚拟化环境涉及在单个计算机系统上并发运行两个或多个完整的操作系统。这意味着系统必须具有足够的物理内存、磁盘空间和 CPU 处理能力，以舒适地并行处理所有系统。因此，在开始配置和安装过程之前，请检查\
  \ `RHEL 9` 和您选择的虚拟机系统的最低系统要求，并验证您的主机系统有足够的资源来处理这两个系统的需求。\n\n### 21.3 为 KVM 虚拟化准备\
  \ RHEL 9\n\n与 `Xen` 不同，不需要运行特殊版本的内核来支持 `KVM`。因此，通过安装 `KVM` 内核模块，标准内核已支持使用 `KVM`，从而消除了安装和从特殊内核启动的需求。\n\
  \n然而，为了避免冲突，如果系统当前运行着启用 `Xen` 的内核，请在继续本章其余内容之前重启系统并在启动菜单中选择非 `Xen` 内核。\n\n设置和维护基于\
  \ `KVM` 的虚拟化系统所需的工具只有在 `RHEL 9` 安装过程中显式选择时才会默认安装。要从命令行提示安装 `KVM` 工具，请在终端窗口中执行以下命令：\n\
  \n```\ndnf install qemu-kvm qemu-img libvirt virt-install libvirt-client\n```\n\n\
  如果您可以使用图形桌面环境，还建议安装 `virt-manager` 软件包：\n\n```\ndnf install virt-manager\n```\n\n\
  ### 21.4 验证 KVM 安装\n\n在继续之前，检查 `KVM` 安装是否正确工作很有意义。当 `KVM` 安装并运行时，将有两个模块加载到内核中。可以通过在终端窗口中运行\
  \ `lsmod` 命令来验证这些模块是否存在：\n\n```\nlsmod | grep kvm\n```\n\n假设安装成功，上述命令应产生类似下面的输出：\n\
  \n```\nkvm_intel 237568 0\nkvm 737280 1 kvm_intel\nirqbypass 16384 1 kvm\n```\n\n\
  \n\n\n注意，如果系统包含 AMD 处理器，`kvm` 模块可能会读取 `kvm_amd` 而不是 `kvm_intel`。\n\n安装过程也应该配置了 `libvirtd`\
  \ 守护进程在后台运行。再次使用终端窗口，运行以下命令以确保 `libvirtd` 正在运行：\n\n```\nsystemctl status libvirtd\n\
  ```\n\n```\nlibvirtd.service - Virtualization daemon\n   Loaded: loaded (/usr/lib/systemd/system/libvirtd.service;\
  \ enabled; vendor preset: enabled)\n   Active: active (running) since Wed 2019-03-06\
  \ 14:41:22 EST; 3min 54s ago\n```\n\n如果该进程未运行，可以通过以下方式启动：\n\n```\nsystemctl enable\
  \ --now libvirtd\nsystemctl start libvirtd\n```\n\n如果可以使用桌面环境，可以通过选择“活动”（Activities）并在搜索框中输入“virt”来运行\
  \ `virt-manager` 工具。当“虚拟机管理器”图标出现时，点击它进行启动。加载完成后，管理器应如下图所示：\n\n![](img/virt-manager_main.png)\n\
  图 21-1\n\n如果没有列出 `QEMU/KVM` 项，选择`文件 -> 添加连接`菜单选项，并在弹出的对话框中，点击`连接`按钮之前选择 `QEMU/KVM`\
  \ 虚拟机程序：\n\n![](img/virt-manager_add_connection.png)\n图 21-2\n\n如果管理器当前未连接到虚拟化进程，右键点击列出的项并从弹出菜单中选择“连接”。\n\
  \n## 21.5 总结\n\nKVM 是一种 Type-1 虚拟机虚拟化解决方案，它利用 Intel VT 和 AMD-V 硬件虚拟化支持实现对未修改客操作系统的完全虚拟化。它是\
  \ RHEL 9 自带的默认虚拟化解决方案，可以在任何具有适当处理器支持的 RHEL 9 系统上快速方便地安装。在安装并启用 `KVM` 支持后，后续章节将概述在\
  \ RHEL 9 主机上安装和管理虚拟机的某些选项。\n\n## 22. 使用 Cockpit 在 RHEL 9 上创建 KVM 虚拟机\n\n可以使用 `virt-install`\
  \ 命令行工具、`virt-manager` GUI 工具或 Cockpit Web 控制台的虚拟机模块在 RHEL 9 上轻松配置基于 KVM 的虚拟机。本章将使用\
  \ Cockpit 在 RHEL 9 主机上作为 KVM 虚拟机安装操作系统。名为“使用 virt-manager 在 RHEL 9 上创建 KVM 虚拟机”的章节将介绍使用\
  \ `virt-manager` 工具创建新的虚拟机。\n\n下一章“使用 virt-install 和 virsh 创建 KVM 虚拟机”将介绍命令行创建虚拟机的方法。\n\
  \n### 22.1 安装 Cockpit 虚拟机模块\n\n标准的 Cockpit 安装默认情况下可能不包含虚拟机模块。假设 Cockpit 已经安装并配置，可以通过以下方式安装虚拟机模块：\n\
  \n```\ndnf install cockpit-machines\n```\n\n安装完成后，下一次登录 Cockpit 界面时，“虚拟机”选项（在图 22-1\
  \ 中标记为 A 处）将显示在导航面板中：\n\n![](img/rhel_cockpit_vm.png)\n图 22-1\n\n## 22.2 在 Cockpit\
  \ 中创建虚拟机\n\n要在 Cockpit 中创建虚拟机，点击图 22-1 中标记为 B 的“创建虚拟机”按钮以显示创建对话框。\n\n在对话框中，为机器输入名称，并选择安装介质是通过\
  \ URL 访问的 ISO 格式还是本地文件系统路径，或者为虚拟机请求选择供应商和操作系统类型信息，并选择“下载操作系统”选项以便在安装过程中自动下载安装镜像。如果您打算使用操作系统下载选项将\
  \ RHEL 作为虚拟机安装，必须首先生成 RHSM 令牌，并将其复制粘贴到虚拟机创建屏幕的“离线令牌”（Offline token）字段中。您可以通过在浏览器中打开以下链接、登录\
  \ Red Hat 账户并选择令牌生成按钮来获取令牌：\n\nhttps://access.redhat.com/management/api\n\n此外，指定用于操作系统安装的虚拟磁盘驱动的大小以及分配给虚拟机的内存量：\n\
  \n![](img/rhel_cockpit_create_vm.png)\n图 22-2\n\n点击“创建并编辑”按钮来构建虚拟机。创建过程完成后，新虚拟机的详细信息将显示在\
  \ Cockpit 中，如图 22-3 所示：\n\n![](img/rhel_cockpit_vm_overview.png)\n图 22-3\n\n正如“虚拟化技术概述””，KVM\
  \ 为虚拟机在网络配置方面提供了多个选项。要查看并更改虚拟机的网络设置，请滚动到“虚拟机概述”屏幕的“网络接口”部分并点击“编辑”按钮：\n\n![](img/rhel_cockpit_vm_network.png)\n\
  图 22-4\n\n在弹出的对话框中，可以使用“网络类型”菜单更改网络类型，例如，从“虚拟网络 (NAT)”更改到“直接附加 (MacVTap)”或“桥接到局域网”。\n\
  \n## 22.3 开始安装\n\n要启动新虚拟机并从指定的安装介质安装操作系统，请点击概述页顶部的“安装”按钮。Cockpit 将启动虚拟机并滚动到“控制台”视图，在那里将出现操作系统屏幕：\n\
  \n![](img/rhel_cockpit_console.png)\n图 22-5\n\n如果安装失败，检查消息查看在打开安装镜像时发生了错误。这通常是因为\
  \ QEMU 模拟器以 `qemu` 用户身份运行，该用户对目录没有访问权限。要解决此问题，打开终端窗口（如果是远程系统请通过 SSH 连接），切换到 ISO\
  \ 所在的目录，并将该目录的访问控制列表 (ACL) 添加给 `qemu` 用户，如下：\n\n```\ncd /path/to/iso/directory\n\
  setfacl --modify u:qemu:x ..\n```\n\n更改后，通过以下命令检查设置：\n\n```\ngetfacl ..\n```\n输出应显示\
  \ `user:qemu:x`。\n\n完成更改后，再次点击“安装”按钮完成安装。\n\n要完成安装，像在物理硬件上安装操作系统一样与控制台屏幕进行交互。如果控制台太小无法容纳整个系统屏幕，点击右上角的“展开”按钮。\n\
  \n可以使用 `virt-viewer` 工具从 Cockpit 浏览器会话外部连接并显示虚拟机的图形控制台。要在 RHEL 9 系统上安装 `virt-viewer`，运行运行命令：\n\
  \n```\ndnf install virt-viewer\n```\n\n`virt-viewer` 工具适用于 Windows 系统，可以通过以下 URL\
  \ 下载：\n\nhttps://virt-manager.org/download/\n\n要连接本地主机上运行的虚拟机，运行 `virt-viewer` 并在弹出的对话框中选择要连接的虚拟机：\n\
  \n![](img/rhel_virt_viewer_vm_list.png)\n图 22-6\n\n上述命令将列出系统级虚拟机。要列出并访问会话级虚拟机，请如下所示启动\
  \ `virt-viewer`：\n\n```\nvirt-viewer --connect qemu:///session\n```\n\n或者也可以指定虚拟机名称并完全跳过选择对话框，例如：\n\
  \n```\nvirt-viewer demo-vm-guest\n```\n\n要使用 SSH 将 virt-viewer 实例连接到远程主机上运行的虚拟机，可以使用以下命令：\n\
  \n```\nvirt-viewer --connect qemu+ssh://<user>@<host>/system guest-name\n```\n\n\
  \n\n\n\n```\n$ virt-viewer --connect qemu+ssh://root@192.168.1.122/system demo_vm_guest\n\
  ```\n\n在使用此技术时，需要注意的是，在完全建立连接之前，系统会提示两次输入用户密码。\n\n一旦创建了虚拟机，就可以通过 `Cockpit` 接口监控机器并执行重启、关机或删除客机系统等任务。`Disks`（磁盘）面板上还包含一个选项，用于向虚拟机配置中添加磁盘。\n\
  \n## 22.4 使用存储存储卷和存储池\n\n当创建虚拟机时，它通常至少会有一个虚拟磁盘驱动器。代表这些虚拟磁盘驱动器的镜像被存储在存储池（Storage\
  \ Pools）中。存储池可以是本地文件系统上的现有目录、文件系统分区、物理磁盘设备、逻辑卷管理 (`LVM`) 卷组，甚至是远程网络文件系统 (`NFS`）。\n\
  \n每个存储池被划分为一个或多个存储卷（Storage Volumes）。存储卷通常是单个镜像文件，每个文件代表一个虚拟磁盘驱动器，但它们也可以以物理磁盘分区、整个磁盘驱动器或\
  \ `LVM` 卷组的形式存在。\n\n当使用前面的步骤创建虚拟机时，系统会创建一个默认存储池来存储虚拟机镜像。该默认存储池占用根文件系统的空间，可以通过 `Cockpit\
  \ Virtual Machine`（虚拟机）界面进行查看，方法是在上方上方标记为 `C` 的面板顶部选择 `Storage Pools`（存储池）选项，参见图\
  \ 22-1。\n\n选中后，屏幕将出现如下方图 22-7 所示的界面，其中包含当前在系统上配置的存储池列表：\n\n![](img/rhel_cockpit_vm_storage_pools.png)\n\
  \n图 22-7\n\n在上面的示例中，默认存储池位于根文件系统，并将虚拟机镜像存储在 `/var/lib/libvirtd/images` 目录下。要查看池中包含的存储卷，请选择图\
  \ 22-8 中高亮的 `Storage Volumes`（存储卷）选项卡：\n\n![](img/rhel_cockpit_vm_storage_volumes.png)\n\
  \n图 22-8\n\n对于演示客机，存储卷以名为 `demo-vm-guest.qcow2` 的镜像文件形式存在。此外，池还包含包含安装 ISO 镜像的存储卷。要确定特定虚拟机使用的是哪个存储卷，请返回\
  \ `Virtual Machine Cockpit` 主屏幕，选择该虚拟机并滚动到 `Disks` 面板，如图 22-9 所示：\n\n![](img/rhel_cockpit_vm_disks.png)\n\
  \n图 22-9\n\n虽然为了测试目的和早期实验，使用默认存储池是可以接受的，但建议为通用虚拟化用途创建额外的池。要创建新的存储池，请在 `Cockpit`\
  \ 中显示 `Storage Pools` 屏幕并点击 `Create storage pool`（创建存储池）按钮，显示如图 22-10 所示的对话框：\n\n\
  ![](img/rhel_cockpit_vm_create_pool.png)\n\n图 22-10\n\n在上面的示例中，正在创建一个名为 `MyPool`\
  \ 的新存储池，该池使用了本地文件系统中挂载为 `/MyPool` 的文件系统分区（磁盘驱动器、分区和挂载点的主题将在本章后面的“向 RHEL 9 系统添加新磁盘驱动器”章节介绍）。一旦创建，该池将列在\
  \ `Cockpit` 存储池屏幕中，并在创建新虚拟机时包含存储卷。\n\n## 22.5 总结\n\n本章概述了如何使用 `Cockpit` Web 界面创建和管理基于\
  \ `KVM` 的虚拟机。`Cockpit` 接口的优势是不需要访问主机系统运行的桌面环境。另一种选项是使用下一章概述的 `virt-manager` 图形工具。\n\
  \n## 23. 在 RHEL 9 上使用 virt-manager 创建 KVM 虚拟机\n\n上一章探讨了如何使用 `Cockpit` Web 工具在 RHEL\
  \ 9 上创建 `KVM` 虚拟机。尽管考虑到一旦 `Virtual Machines Cockpit` 扩展完全实现，`virt-manager` 可能会停止使用，但本章将介绍使用该工具创建新虚拟机。\n\
  \n## 23.1 启动虚拟机管理器\n\n如果你尚未安装，请按照以下方式安装 `virt-manager` 软件包：\n\n```bash\n# dnf install\
  \ virt-manager\n```\n\n接下来，在终端窗口中运行 `virt-manager` 从命令行启动 `Virtual Machine Manager`（虚拟机管理器）。加载后，虚拟机管理器将在显示以下屏幕之前提示当前活动用户的密码：\n\
  \n![](img/rhel_virt-manager_home.png)\n\n图 23-1\n\n主屏幕列出了系统上运行的当前虚拟机。默认情况下，管理器应该连接到系统的\
  \ `libvirtd` 实例。如果没有连接，请右键点击列表中的项并从弹出菜单中选择 `Connect`（连接）到主机系统。要管理基于会话的虚拟机，请选择 `File\
  \ -> Add Connection...`（文件 -> 添加连接...）菜单选项显示如图 23-2\n\n图 23-2\n\n从 `Hypervisor`\
  \ 菜单中选择 `QEMU/KVM session` 并点击对话框中的 `Connect`（连接）按钮。返回 `virt-manager` 主屏幕后，`QEMU/KVM`\
  \ 会话应如图 23-1 所示。要创建虚拟机，点击虚拟机按钮（工具栏最左侧的按钮）显示向导的第一个屏幕。在 `Name`（名称）字段中为虚拟机输入一个描述性名称。在此屏幕上，还要选择安装操作系统的媒介。这可以是\
  \ CD 或 DVD 驱动器、主机可访问的 ISO 文件、使用 `HTTP`、`FTP`、`NFS` 或 `PXE` 进行网络安装，或现有虚拟机的磁盘镜像：\n\
  \n![](img/virt-manager_select_media.png)\n\n图 23-3\n\n### 23.2 配置 KVM 虚拟机\n\n点击\
  \ `Forward`（下一步）将显示寻求过程信息的屏幕。显示的屏幕和所需信息取决于初始屏幕上的选择。例如，如果选择了 CD、DVD 或 ISO，此屏幕将询问\
  \ ISO 文件或物理介质的具体位置。此屏幕还会尝试根据指定的安装介质识别客操作系统的类型和版本（例如 Windows 版本或 Linux 发行版）。如果无法识别，取消勾选\
  \ `Automatically detect from installation media/source`（从安装介质/源自动检测）选项，输入操作系统名称的前几个字符并从匹配列表中选择一个选项：\n\
  \n![](img/virt-manager_choose_iso.png)\n\n图 23-4\n\n完成这些设置后，点击 `Forward`（下一步）按钮配置\
  \ `CPU` 和 `memory` 设置。最佳设置取决于主机存在的 `CPU` 数量和物理内存量，以及与新虚拟机并行运行的其他和其他虚拟机的需求：\n\n![](img/virt-manager_memory.png)\n\
  \n图 23-5\n\n在下一个屏幕上，提供了选项创建指定大小的镜像磁盘、选择现有卷或创建指定格式（`raw`、`vmdk`、`ISO` 等）的存储卷。除非你有使用特定格式的需要（例如，以后可能需要使用\
  \ `vmdk` 迁移到基于 VMware 的虚拟化环境）或需要使用专用磁盘或分区，否则在此屏幕上指定大小通常足够了：\n\n![](img/virt-manager_disk.png)\n\
  \n图 23-6\n\n\n\n\n\n如果在此处使用默认设置，虚拟机将使用默认存储池中的存储卷作为虚拟磁盘驱动器。要使用在本节较早创建的自定义“MyPool”存储池，请在点击\
  \ `Manage...` 按钮之前，启用 `Select` 或创建自定义存储选项。\n\n在存储卷对话框中，在左侧面板中选择 `MyPool` 条目，然后点击主面板中的\
  \ `+` 按钮创建一个新的存储卷：\n\n![](img/virt-manager_storage_volumes.png)\n\n图 23-7\n\n注意，对话框左下角的\
  \ `+` 按钮也可以用于创建新的存储池，作为使用 `Cockpit` 接口的备选方案。\n\n在配置屏幕（图 23-8）中，为存储卷命名，选择卷大小，并点击\
  \ `Finish` 按钮创建卷并将其分配给虚拟机：\n\n![](img/virt-manager_volume_details.png)\n\n图 23-8\n\
  \n一旦配置了这些设置，选择新卷并点击 `Choose Volume` 按钮。然后再次点击 `Forward` 按钮。最终屏幕显示配置摘要。检查显示的信息。还有高级选项可以更改客户机的虚拟网络配置，如图\
  \ 23-9 所示：\n\n![](img/virt-manager_network.png)\n\n图 23-9\n\n## 23.3 启动 KVM 虚拟机\n\
  \n点击 `Finish` 按钮开始创建过程。虚拟化管理器将在启动客户系统之前创建磁盘并配置虚拟机。最后，新的虚拟机将出现在主 `virt-manager` 窗口中，状态设置为\
  \ `Running`，如图 23-10 所示：\n\n![](img/virt-manager_vm_running.png)\n\n图 23-10\n\n\
  默认情况下，虚拟机的控制台应该出现在虚拟机查看器窗口中。若要在今后的任何时间查看运行机器的控制台，请确保它在虚拟机列表中被选中，并选择工具栏上的 `Open`\
  \ 按钮。虚拟机查看器应准备好开始安装过程：\n\n![](img/virt-manager_vm_display.png)\n\n图 23-11\n\n从现在起，按照安装说明在\
  \ KVM 虚拟机中安装操作系统。\n\n## 23.4 总结\n\n在 RHEL 9 宿主机系统上创建新的 KVM 虚拟机有多种方法。本章使用 `virt-manager`\
  \ 图形工具来创建、配置和运行客户操作系统，包括创建新的存储卷。在涵盖这些基础知识后，下一章将介绍如何从命令行创建虚拟机。\n\n## 24. 使用 virt-install\
  \ 和 virsh 创建 KVM 虚拟机\n\n在之前的章节中，我们探索了如何使用 `Cockpit` 和 `virt-manager` 图形工具在 RHEL\
  \ 9 宿主机上创建 KVM 客户操作系统。本章将重点介绍如何使用 `virt-install` 和 `virsh` 命令行工具创建基于 KVM 的虚拟机。这些工具提供了\
  \ `virt-manager` 和 `Cockpit` 选项的所有功能，并具有在脚本中使用以自动创建虚拟机创建的额外优势。此外，`virsh` 命令允许根据配置文件包含的规范创建虚拟机。\n\
  \n`virt-install` 工具允许通过提供命令行选项列表来创建新的虚拟机。本章假设已安装了必要的 KVM 工具。有关这些要求的详细信息，请阅读章节在 RHEL\
  \ 9 上安装 KVM 虚拟化。\n\n### 24.1 运行 virt-install 构建 KVM 客户系统\n\n`virt-install` 实用接受广泛的命令行参数，提供与正在创建的虚拟机相关的配置信息。某些命令行选项是强制性的（明确要求必须提供\
  \ `name`、`memory` 和 `disk` 存储），而其他是可选的。\n\n至少，`virt-install` 命令通常需要以下参数：\n\n*  \
  \ --name` - 分配给虚拟机的名称。\n*   --memory` - 分配给虚拟机的内存量。\n*   --disk` - 虚拟机存储镜像文件的名称和位置。`virt-install`\
  \ 将创建虚拟机期间创建此文件，除非指定了 `--import` 选项指示要使用现有镜像文件。\n*   --cdrom` 或 `--location` - 指定包含客户操作系统安装介质的本地路径或远程\
  \ ISO 镜像的 URL。\n\n使用 `virt-install` 时所有可用参数的摘要可以在 man 手页中找到：\n\n```\n$ man virt-install\n\
  ```\n\n### 24.2 一个 RHEL 9 virt-install 命令示例\n\n参考上述命令行参数列表，我们现在可以查看使用 `virt-install`\
  \ 工具的命令行结构示例。\n\n注意，为了显示虚拟机并完成安装，在 `virt-install` 实用程序启动后，必须有一个 `virt-viewer` 实例连接到虚拟机。默认情况下，`virt-install`\
  \ 将虚拟机开始运行后尝试启动 `virt-viewer`。然而，如果 `virt-viewer` 不可用，`virt-install` 将等待直到建立 `virt-viewer`。例如，如果宿主机具有图形界面，可以在本地运行图形会话，或者从远程客户端建立连接，如使用\
  \ virt-manager 在 RHEL 9 上创建 KVM 虚拟机 章节所示。\n\n以下命令创建一个使用 KVM 虚拟化运行 RHEL 9 的虚拟机。它创建一个新的\
  \ 10GB 磁盘，为虚拟机分配 2048MB 内存，并为安装介质配置虚拟光驱：\n\n```\nvirt-install --name demo_vm_guest\
  \ --memory 2048 --disk path=/tmp/demo_vm_guest.img,size=10 --network network=default\
  \ --cdrom /tmp/rhel-baseos-9.1-x86_64-dvd\n```\n\n在创建过程中，`virt-install` 命令将显示创建进度的状态更新：\n\
  \n```\nStarting install...\nAllocating ‘demo_vm_guest.img’ | 10 GB 00:00:01\nRunning\
  \ graphical console command: virt-viewer --connect qemu:///system --wait demo_vm_guest\n\
  ```\n\n一旦客户系统创建，`virt-viewer` 屏幕将显示从指定的安装介质加载的操作系统安装程序：\n\n![](img/virt_install_screen.png)\n\
  \n图 24-1\n\n从现在开始，按照标准的安装程序操作。\n\n### 24.3 从命令行启动和停止虚拟机\n\n从命令行创建虚拟机后，可能也需要从命令行启动它。这可以通过\
  \ `virsh` 命令行工具实现，并引用创建时分配的名称。例如：\n\n```\nvirsh start demo_vm_guest\n```\n\n同样，可以通过以下方式向虚拟机发送关闭信号：\n\
  \n```\nvirsh shutdown demo_vm_guest\n```\n\n假设虚拟机未响应关闭信号且未开始正常关闭。在这种情况下，可以使用 `destroy`\
  \ 指令销毁虚拟机（伴随数据丢失的风险）：\n\n```\nvirsh destroy demo_vm_guest\n```\n\n## 24.4 从配置文件创建虚拟机\n\
  \n\n\n\n\n`virsh create` 命令可以接受一个配置文件的名称作为参数，并基于该文件创建新的虚拟机。该配置文件使用 XML 格式。创建配置文件最简单的方法是导出现有虚拟机的配置，并针对新虚拟机对其进行修改。这可以通过\
  \ `virsh dumpxml` 命令实现。例如，以下命令将一个名为 `demo_vm_guest` 的虚拟机域的配置数据输出到名为 `demo_vm_guest.xml`\
  \ 的文件中：\n\n```bash\nvirsh dumpxml demo_vm_guest > demo_vm_guest.xml\n```\n\n一旦生成了该文件，将其加载到编辑器中，以检查并更改新虚拟机的设置。\n\
  \n至少，必须更改 `<name>`、`<uuid>` 和镜像文件路径 `<source file>`，以避免与获取配置的虚拟机发生冲突。对于 `UUID`，可以从文件中删除此行。\n\
  \n根据需要，也可以更改虚拟化类型、内存分配和 CPU 数量（这仅是其中的部分选项）。一旦修改了文件，可以按照以下方式创建新虚拟机：\n\n```bash\n\
  virsh create demo_vm_guest.xml\n```\n\n## 24.5 总结\n\n`KVM`提供了 `virt-install` 和 `virsh`\
  \ 命令行工具，作为使用 `Cockpit` 和 `virt-manager` 工具创建和管理虚拟机实例的快速高效替代方案。这些工具的优势在于可以在脚本内部使用来实现虚拟机的自动化创建和管理。`virsh`\
  \ 命令还包含基于 XML 配置文件创建 VM 实例的选项。\n\n## 25. 创建 RHEL 9 KVM 网络桥接接口\n\n默认情况下，RHEL 9 上的\
  \ `KVM` 虚拟化环境创建一个虚拟网络，虚拟机可以连接到该网络。也可以使用 `MacVTap` 驱动配置直接连接。但是正如虚拟化技术概述](#Virtualization_Overview.xhtml__idTextAnchor312)章节所述，这种方法不允许主机和客户系统进行通信。\n\
  \n本章旨在涵盖在 RHEL 9 上创建网络桥接的步骤，允许客户系统共享主机的一个或多个物理网络连接，同时允许客户和主机系统进行通信。\n\n在本章的剩余部分，我们将解释如何为基于\
  \ `KVM` 的客户操作系统配置 RHEL 9 网络桥接。\n\n### 25.1 获取当前的 Network Manager 设置\n\n可以使用 `NetworkManager`\
  \ 命令行界面工具 (`nmcli`) 创建网络桥接。`NetworkManager` 在 RHEL 9 系统上默认安装并启用，负责检测和连接网络设备，并为管理网络配置提供接口。\n\
  \n主机系统当前的网络连接列表显示如下：\n\n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\n\
  eno1 99d40009-6bb1-4182-baad-a103941c90ff ethernet eno1\nvirbr0 7cb1265e-ffb9-4cb3-aaad-2a6fe5880d38\
  \ bridge virbr0\n\n上述输出显示主机已通过名为 `eno1` 的设备建立了以太网网络连接，并有一个名为 `virbr0` 的默认桥接接口，该接口提供了对\
  \ `KVM` 客户系统默认连接的基于 虚拟网络的访问。\n\n同样，可以使用以下命令识别系统上当前配置的设备（虚拟和物理设备）：\n\n```bash\nnmcli\
  \ device show\n```\n\nGENERAL.DEVICE: eno1\nGENERAL.TYPE: ethernet\nGENERAL.HWADDR:\
  \ AC:16:2D:11:16:73\nGENERAL.MTU: 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION:\
  \ eno1\nGENERAL.CON-PATH: /org/freedesktop/NetworkManager/ActiveConnection/1\nWIRED-PROPERTIES.CARRIER:\
  \ on\nIP4.ADDRESS[1]: 192.168.86.59/24\nIP4.GATEWAY: 192.168.86.1\nIP4.ROUTE[1]:\
  \ dst = 0.0.0.0/0, nh = 192.168.86.1, mt = 100\nIP4.ROUTE[2]: dst = 192.168.86.0/24,\
  \ nh = 0.0.0.0, mt = 100\nIP4.DNS[1]: 192.168.86.1\nIP4.DOMAIN[1]: lan\nIP6.ADDRESS[1]:\
  \ fe80::6deb:f739:7d67:2242/64\nIP6.GATEWAY: --\nIP6.ROUTE[1]: dst = fe80::/64,\
  \ nh = ::, mt = 100\nIP6.ROUTE[2]: dst = ff00::/8, nh = ::, mt = 256, table=255\n\
  GENERAL.DEVICE: virbr0\nGENERAL.TYPE: bridge\nGENERAL.HWADDR: 52:54:00:59:30:22\n\
  GENERAL.MTU: 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION: virbr0\n\
  GENERAL.CON-PATH: /org/freedesktop/NetworkManager/ActiveConnection/2\nIP4.ADDRESS[1]:\
  \ 192.168.86.59/24\n...\n\n### 25.2 从命令行创建网络桥接\n\n创建桥接的第一步是添加新连接。这可以通过 `nmcli` 实现，指定该连接为桥接并提供：\n\
  \n```bash\nnmcli con add type bridge con-name br0 master eno1\n```\n\n一旦添加了连接，连接列表应显示：\n\
  \n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 7cb1265e-ffb9-4cb3-aaad-2a6fe5880d38 bridge virbr0\n\n下一步是启动桥接接口。指定\
  \ `br0` 和主设备 `eno1`：\n\n```bash\nnmcli con up br0\n```\n\n如果通过网络连接（例如通过 SSH）执行桥接配置步骤，此步骤可能会有问题，因为在启用桥接连接之前必须关闭当前的\
  \ `eno1` 连接。这意味着远程主机可能无法访问。\n\n如果您远程访问主机，可以通过创建一个脚本来执行更改以避免此问题。这将确保在 `eno1` 接口关闭后启用桥接接口。首先创建一个包含以下命令的\
  \ `bridge.sh` 脚本文件：\n\n```bash\n#!/bin/bash\nnmcli con down eno1\nnmcli con up br0\n\
  ```\n\n一旦创建了脚本，按如下方式执行：\n\n```bash\nsh ./bridge.sh\n```\n\n当脚本执行时，当 `eno1` 连接关闭时连接将会丢失。但在几秒钟后，一旦\
  \ `br0` 连接激活，就可以重新连接到主机。\n\n如果您在主机本地操作，可以在终端窗口中运行两个 `nmcli` 命令而无丢失连接的风险：\n\n```bash\n\
  nmcli con down eno1\nnmcli con up br0\n```\n\n一旦桥接运行，连接列表现在应该包含桥接和桥接从设备连接：\n\n```bash\n\
  nmcli con show\n```\n\nNAME UUID TYPE DEVICE\nbr0 59b6631c-a283-41b9-bbf9-56a60ec75653\
  \ bridge br0\nbridge-slave-eno1 395bb34b-5e02-427a-ab31-762c9f878908 ethernet eno1\n\
  virbr0 0fa934d5-0508-47b7-a119-33a232b03f64 bridge virbr0\neno1 66f0abed-db43-4d79-8f5e-2cbf8c7e3aff\
  \ ethernet --\n\n\n\n\n\n注意，`eno1` 连接仍然列在其中，但已不再活动。若要从列表中排除非活动连接，请请求列表时使用 `--active`\
  \ 标记：\n\n```bash\nnmcli con show --active\n```\nNAME UUID TYPE DEVICE\nbr0 c2fa30cb-b1a1-4107-80dd-b1765878ab4f\
  \ bridge br0\nbridge-slave-eno1 21e8c945-cb94-4c09-99b0-17af9b5a7319 ethernet eno1\n\
  virbr0 a877302e-ea02-42fe-a3c1-483440aae774 bridge virbr0\n\n## 25.3 声明 KVM 桥接网络\n\
  \n此时，桥接连接已在系统上，但对 KVM 环境不可见。运行 `virsh` 命令仍然会将默认网络列出为唯一的可用网络选项：\n\n```bash\nvirsh\
  \ net-list --all\n```\nName State Autostart Persistent\n----------------------------------------------------------\n\
  default active yes yes\n\n在虚拟机使用桥接之前，必须对其进行声明并将其添加到 KVM 网络配置中。这涉及创建一个定义文件，并再次使用\
  \ `virsh` 命令行工具。\n\n首先为名为 `bridge.xml` 的桥接网络创建一个定义文件，内容如下：\n\n```xml\n<network>\n\
  \  <name>br0</name>\n  <forward mode=\"bridge\"/>\n  <bridge name=\"br0\" />\n</network>\n\
  ```\n\n接下来，使用该文件定义新网络：\n\n```bash\nvirsh net-define ./bridge.xml\n```\n\n一旦定义了网络，即可启动它，并在需要时将其配置为在每次系统重启时自动启动：\n\
  \n```bash\nvirsh net-start br0\nvirsh net-autostart br0\n```\n\n再次列出网络，以验证桥接网络现在是否在\
  \ KVM 环境内可用：\n\n```bash\nvirsh net-list --all\n```\nName State Autostart Persistent\n\
  ----------------------------------------------------------\nbr0 active yes yes\n\
  default active yes yes\n\n## 25.4 在虚拟机中使用桥接网络\n\n要创建一个使用桥接网络的虚拟机，请使用 `virt-install\
  \ --network` 并指定 `br0` 桥接名称。例如：\n\n```bash\nvirt-install --name demo_vm_guest --memory\
  \ 1024 --disk path=/tmp/demo_vm_guest.img,size=10 --network network=br0 --cdrom\
  \ /home/demo/rhel-baseos-9.1-x86_64-dvd.iso\n```\n\n当客户操作系统运行时，它将出现在与主机系统相同的物理网络上，而不再位于基于\
  \ NAT 的虚拟网络上。\n\n也可以通过在 Cockpit 界面中编辑虚拟机、找到“网络接口”部分并点击“编辑”按钮（如下方的图 25-1 所示），为虚拟机选择桥接网络：\n\
  \n![](img/cockpit_network_interface.png)\n图 25-1\n\n在生成的接口设置对话框中，将“接口类型”菜单更改为“Bridge\
  \ to LAN”（桥接到局域网），并将“源”设置为 `br0`，如图 25-2 所示：\n\n![](img/cockpit_kvm_bridge.png)\n\
  图 25-2\n\n同样，当使用 `virt-manager` 工具创建新虚拟机时，桥将在“网络”选择菜单中可用：\n\n![](img/virt-manager_bridge.png)\n\
  图 25-3\n\n若要修改现有虚拟机以使用桥接，请使用 `virsh edit` 命令。该命令将 XML 定义文件加载到编辑器中，可以在其中进行更改并保存：\n\
  \n```bash\nvirsh edit GuestName\n```\n\n默认情况下，文件将加载到 `vi` 编辑器中。若要使用不同的编辑器，请更改 `$EDITOR`\
  \ 环境变量，例如：\n\n```bash\nexport EDITOR=gedit\n```\n\n要更改默认虚拟网络，请找到文件的 `<interface>`\
  \ 部分，对于 NAT 基配置，其内容如下：\n\n```xml\n<interface type='network'>\n  <mac address='<your\
  \ mac address here>'/>\n  <source network='default'/>\n  <model type='virtio'/>\n\
  \  <address type='pci' domain='0x0000' bus='0x01' slot='0x00' function='0x0'/>\n\
  </interface>\n```\n\n或者，如果虚拟机使用的是直接连接，条目可能如下：\n\n```xml\n<interface type='direct'>\n\
  \  <mac address='<your mac address here>'/>\n  <source dev='eno1' mode='vepa'/>\n\
  \  <model type='virtio'/>\n  <address type='pci' domain='0x0000' bus='0x01' slot='0x00'\
  \ function='0x0'/>\n</interface>\n```\n\n若要使用桥接，在保存文件之前，将源网络属性更改为如下：\n\n```xml\n\
  <interface type='network'>\n  <mac address='<your mac address here>'/>\n  <source\
  \ network='br0'/>\n  <model type='virtio'/>\n  <address type='pci' domain='0x0000'\
  \ bus='0x01' slot='0x00' function='0x0'/>\n</interface>\n```\n\n## 25.5 使用 nm-connection-editor\
  \ 创建桥接网络\n\n若可以通过本地或远程桌面访问主机，可以使用 `nm-connection-editor` 完成大部分桥接配置。要使用该工具，在桌面打开终端并输入：\n\
  \n```bash\nnm-connection-editor\n```\n\n当工具加载后，如图 25-4 所示的窗口将列出当前配置的网络：\n\n![](img/connection_home.png)\n\
  图 25-4\n\n要创建新连接，点击窗口左侧的 `+` 按钮。然后，在图 25-5 所示的对话框中，选择“Bridge”选项：\n\n![](img/connection_type.png)\n\
  图 25-5\n\n选中桥接选项后，点击“创建”按钮进入桥接配置界面。首先将连接和接口名称更改为 `br0`，然后点击如图 25-6 所示的“添加”按钮：\n\n\
  ![](img/connection_edit_br0.png)\n图 25-6\n\n现在会出现另一个对话框，需要在其中配置桥接从。在此对话框中，从“设备”菜单选择桥接要连接的物理网络（例如，`eno1`）：\n\
  \n![](img/connection_port.png)\n图 25-7\n\n点击“保存”按钮应用更改并返回如图 25-6 所示的编辑 br0 对话框。在图\
  \ 25-8，将菜单设置更改为“Ethernet”（以太网），然后点击“创建”按钮：\n\n![](img/connection_ethernet_type.png)\n\
  图 25-8\n\n返回主窗口后，新的桥接和从接连接现在应列在其中：\n\n![](img/connection_bridge_added.png)\n图 25-9\n\
  \n## 25.6 总结\n\n默认情况下，KVM 虚拟机连接到使用 NAT 提供访问主机所在网络能力的虚拟网络。如果要求虚拟机以自己的 IP 地址出现在网络上，则需要配置它们共享主机的物理接口。本章概述了可以使用\
  \ `nmcli` 或 `nm-connection-editor` 工具创建桥接接口。\n\n一旦完成此步骤，桥接即可供客户虚拟机使用。剩下的只需按照上一章概述的步骤停止原始\
  \ `eno1` 连接并启动 `br0` 连接（如果是远程访问主机，请在 shell 脚本中执行这些步骤）：\n\n```bash\nnmcli con down\
  \ eno1\nnmcli con up br0\n```\n\n正如使用命令行工具创建桥接时，还需要将此桥接添加到 KVM 网络配置中。要执行操作，请重复上述[声明\
  \ KVM 桥接网络](##KVM_Network_Bridge.xhtml__idTextAnchor361）节的步骤。\n\n## 26. 使用 virsh\
  \ 命令行工具管理 KVM\n\n\n\n\n\n在之前的章节中，我们已经涵盖了在 RHEL 9 上安装和配置基于 KVM 的客户端操作系统。本章将探索 `virsh`\
  \ 工具中之前章节未涵盖的其他领域，以及如何使用它从命令行管理基于 KVM 的客户端操作系统。\n\n## 26.1 virsh Shell 与命令行\n\n\
  `virsh` 工具既是命令行工具，也是交互式 shell 环境。在命令行模式下使用时，通过命令提示符输入一组适用于任务的参数来发布命令。\n\n要将选项作为命令行参数使用，请在终端命令提示符中使用，例如所示：\n\
  \n```\nvirsh <option>\n```\n\n`virsh` 工具在 shell 模式下使用时，提供了一个交互环境，可以在其中执行系列命令。\n\n\
  要在 `virsh` shell 中运行命令，请执行以下命令：\n\n```\nvirsh\n\nWelcome to virsh, the virtualization\
  \ interactive terminal.\nType: 'help' for help with commands\n      'quit' to quit\n\
  \nvirsh #\n```\n\n在 `virsh #` 提示符处，输入想要运行的选项。例如，下面的 `virsh` 会话列出了当前的虚拟机，启动一个名为 `FedoraVM`\
  \ 的虚拟机，然后获取另一个列表以验证该虚拟机正在运行：\n\n```\nvirsh\n\nWelcome to virsh, the virtualization\
  \ interactive terminal.\nType: 'help' for help with commands\n      'quit' to quit\n\
  \nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n\nvirsh # start FedoraVM\n\nDomain FedoraVM\
  \ started\n\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\nvirsh#\n```\n\n\
  `virsh` 工具支持广泛的命令，可以使用帮助选项获取其完整列表：\n\n```\nvirsh help\n```\n\n通过在帮助指令后指定命令，可以获取有关每个命令语法的更多细节：\n\
  \n```\nvirsh help restore\n\n  NAME\n    restore - restore a domain from a saved\
  \ state in a file\n\n  SYNOPSIS\n    restore <file> [--bypass-cache] [--xml <string>]\
  \ [--running] [--paused]\n\n  DESCRIPTION\n    Restore a domain.\n\n  OPTIONS\n\
  \    [--file] <string> the state to restore\n    --bypass-cache avoid file system\
  \ cache when restoring\n    --xml <string> filename containing updated XML for the\
  \ target\n    --running restore domain into running state\n    --paused restore\
  \ domain into paused state\n```\n\n在本章的剩余部分，我们将详细地查看其中一些命令。\n\n## 26.2 列出客户系统状态\n\
  \n可以使用 `virsh` 工具的 `list` 选项随时查看 RHEL 9 虚拟化主机上客户系统的状态。例如：\n\n```\nvirsh list\n```\n\
  \n上述命令将显示输出，其中每个客户系统都占有一行，类似于下所示：\n\n```\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\n```\n\n## 26.3 启动客户系统\n\
  \n可以使用 `virsh` 工具结合 `start` 选项后跟跟要启动的客户操作系统的名称来启动客户操作系统。例如：\n\n```\nvirsh start\
  \ myGuestOS\n```\n\n## 26.4 关闭客户系统\n\n`virsh` 工具的 `shutdown` 选项顾名思义，用于关闭客户操作系统：\n\
  \n```\nvirsh shutdown guestName\n```\n\n注意，`shutdown` 允许客户操作系统在接收到指令时执行有序关。要立即停止客户操作系统，可以使用\
  \ `destroy` （存在文件系统损坏和数据丢失的风险）：\n\n```\nvirsh destroy guestName\n```\n\n## 26.5\
  \ 挂起和恢复客户系统\n\n可以使用 `virsh` 工具的 `suspend` 和 `resume` 选项挂起和恢复客户系统。例如，挂起特定系统：\n\n\
  ```\nvirsh suspend guestName\n```\n\n同样，恢复挂起的系统：\n\n```\nvirsh resume guestName\n\
  ```\n\n如果主机系统重启，挂起的会话将丢失。此外，请注意挂起的系统仍然留在内存中。因此，为了保存会话使其不再占用内存并能恢复到精确状态（即使在重启后），有必要保存并恢复客户机。\n\
  \n## 26.6 保存和恢复客户系统\n\n可以使用 `virsh` 实用程序保存和恢复运行中的客户操作系统。保存时，客户系统的当前状态被写入磁盘并从系统内存中移除。保存的系统随后可以随时恢复（包括在主机系统重启后）。\n\
  \n保存客户机：\n\n```\nvirsh save guestName path_to_save_file\n```\n\n恢复保存的客户操作系统会话：\n\
  \n```\nvirsh restore path_to_save_file\n```\n\n## 26.7 重启客户系统\n\n重启客户操作系统：\n\n```\n\
  virsh reboot guestName\n```\n\n## 26.8 配置分配给客户操作系统的内存\n\n使用 `virsh` 命令的 `setmem`\
  \ 选项配置分配给客户操作系统的内存。例如，以下命令将分配给系统的内存减少到 256MB：\n\n```\nvirsh setmem guestName 256\n\
  ```\n\n注意，允许的内存设置必须在可用内存范围内。可以使用 `setmaxmem` 选项增加。\n\n## 26.9 总结\n\n`virsh` 工具提供了创建、监控和管理虚拟机的各种选项。正如本章所述，该工具可以在命令行或交互式模式下使用。\n\
  \n## 27. Linux 容器简介\n\n之前的章节涵盖了虚拟化概念，重点讨论了使用 KVM 创建和管理虚拟机。本章将引入容器形式的相关技术。虽然虚拟机和容器之间存在某些相似之处，本章将概述它们的关键区别，并介绍\
  \ Linux 容器的概念和优势。本章还将概述 RHEL 9 容器管理工具。在本章介绍容器的基础知识后，下一章将通过实例演示如何在 RHEL 9 上创建和运行容器。\n\
  \n## 27.1 Linux 容器与内核共享\n\n简单来说，Linux 容器是虚拟化的轻量级替代方案。虚拟机在虚拟环境中包含并运行整个客户操作系统。虚拟机则运行在虚拟机程序等环境之上，虚拟机程序管理对主机物理资源的访问。\n\
  \n容器通过使用称为内核共享的概念来工作，这利用了 Linux 和基于 Unix 操作系统的体系设计。\n\n要理解内核共享和容器的工作原理，首先有助于理解 Linux\
  \ 或 Unix 操作系统的两个主要组件。操作系统的核心是内核。简单来说，内核处理操作系统与物理硬件之间的所有交互。第二个关键组件是根文件系统，它包含了操作系统运行所需的所有库、文件和实用程序。利用这种结构，每个容器都有自己的根文件系统，但共享主机操作系统的内核。这种结构在下方的图\
  \ 27-1 架构图中所示。\n\n\n\n\n\n这种类型的资源共享是通过内核能够动态地将当前根文件系统（该概念称为切换根或 `chroot`）更改到不同的根文件系统，而无需重启整个系统来实现。Linux\
  \ 容器本质上是这种能力的扩展，并结合了容器运行时，容器运行时的职责是为宿主机系统提供执行和管理容器的接口。目前有多种容器运行时可用，包括 `Docker`、`lxd`、`containerd`\
  \ 和 `CRI-O`。早期的 RHEL 版本默认使用 `Docker`，但在 RHEL 9 中 `Podman` 已取代其成为默认工具。\n\n![](img/linux_container_diagram.png)\n\
  \n图 27-1\n\n## 27.2 容器的用途与优势\n\n容器的主要优势是它们比虚拟化所需的资源开销少得多，这允许在单个服务器上同时运行许多容器实例。它们可以根据需求水平快速高效地启动和停止。此外，容器在宿主机上原生运行，提供了虚拟机无法比拟的性能。\n\
  \n容器还具有高度的可移植性，可以轻松在系统之间迁移。结合 `Docker`、`OpenShift` 和 `Kubernetes` 等容器管理系统，可以在跨越多个服务器和云平台的大规模范围内部署和管理容器，可能运行成千上万个容器。\n\
  \n容器经常用于为应用程序创建轻级执行环境。在这种场景下，每个容器都提供了一个隔离的环境，其中包含了应用程序以及该运行所需的所有运行时和支持文件。然后可以将容器部署到任何其他支持容器执行的兼容宿主机系统上运行，且无需担心目标系统可能缺少应用程序所需的运行时配置——应用程序的所有依赖项都已经在容器中了。\n\
  \n在桥接开发环境和生产环境之间的差距时，容器非常有帮助。通过在容器中进行开发和测试（QA）工作，可以将它们安全地传递到生产环境并启动，因为应用程序在开发和测试时相同的容器环境中运行。\n\
  \n容器还促进了部署大型复杂解决方案的模块化方法。与其将应用程序开发为单一的整体实体，可以使用容器将应用程序设计为一组相互作用的模块，每个模块运行在单独的容器中。\n\
  \n的一个的一个缺点是，客户操作系统必须与共享的内核版本兼容。例如，无法在 Linux 系统的容器中运行微软 Windows。同样，为 2.6 版本内核设计的\
  \ Linux 客户系统无法共享 2.4 版本的内核。然而，这些要求并不是容器的设计初衷。与其将这些限制视为局限性，不如将这些限制视为容器提供简单、可扩展且可靠部署平台的某些关键优势。\n\
  \n## 27.3 RHEL 9 容器工具\n\nRHEL 9 提供了多种用于创建、检查和管理容器工具。主要工具如下：\n\n- `buildah` – 一个用于构建容器镜像的命令行工具。\n\
  - `podman` – 一个基于命令行的容器运行时和管理工具。执行诸如从远程仓库下载容器镜像，以及检查、启动和停止镜像等任务。\n- `skopeo` – 一个命令行实用程序，用于转换容器镜像、在仓库之间复制镜像以及在不下载的情况下检查存储在仓库中的镜像。\n\
  - `runc` – 一种轻级容器运行时，用于从命令行启动和运行容器。\n- `OpenShift` – 一个企业级容器应用程序管理平台，由命令行和基于 Web\
  \ 的工具组成。\n\n上述所有工具都符合开放容器倡议 (`OCI`)，这是一套旨在确保容器在竞争性的工具和平台之间遵循相同规范。\n\n## 27.4 容器目录、存储库和注册表\n\
  \n红帽容器目录 (`RHCC`) 提供了一系列由红帽测试过的预构建镜像，这些镜像可以被下载并作为自定义容器镜像的基础。可以通过以下 URL 访问 RHCC：\n\
  \n`https://catalog.redhat.com/software/containers/search`\n\n完成搜索后，目录将显示匹配的存储库列表。在此语境下，存储库是相关镜像的集合。例如，图\
  \ 27-2 显示了适用于 RHEL 9 相关容器的可用容器镜像存储库部分列表。\n\n![](img/rhel_container_search.png)\n\
  \n图 27-2\n\n从列表中选择存储库将显示有关该存储库的详细信息。在目录中查看存储库时，关键信息是存储库名称和存储该存储库的注册表位置。在下载容器镜像使用时，必须引用这两个项规范。\n\
  \n## 27.5 容器网络\n\n默认情况下，容器使用容器网络接口 (`CNI`) 桥接网络栈连接到网络。在桥接配置中，运行在服务器上的所有容器都属于同一个子网，因此可以相互通信。容器还通过桥接宿主机系统的网络连接到外部网络。同样，宿主机可以通过虚拟网络接口（通常命名为\
  \ `podman0`）访问容器，该接口作为容器工具安装的一部分而被创建。\n\n## 27.6 总结\n\nLinux 容器提供了虚拟化的化的替代方案，并利用了\
  \ Linux 和 Unix 操作系统的结构。Linux 容器共享主机操作系统的内核，每个容器都有自己的包含文件、库和应用程序的根文件系统。因此，容器是高效且可扩展的，为构建和部署模块化企业级解决方案提供了理想平台。此外，还有多种工具和平台用于构建、部署和管理容器，包括第三方解决方案和红帽提供的解决方案。\n\
  \n# 28. 在 RHEL 9 上使用容器\n\n在上章中涵盖了 Linux 容器的基础知识，本章将演示如何在 RHEL 9 上使用 `Podman`、`Skopeo`\
  \ 和 `Buildah` 工具创建和管理容器。在本章结束时，你将对 RHEL 9 上创建和管理容器有更清晰的理解。此外，你将获得继续探索 Linux 容器能力的知识基础。\n\
  \n## 28.1 安装容器工具\n\n在开始使用容器之前，第一步是使用以下命令安装上一章概述的所有容器工具：\n\n```bash\ndnf install\
  \ container-tools\n```\n\n### 28.2 登录红帽容器注册表\n\n首先，将使用红帽容器注册表中提供的现有镜像创建一个容器。然而在从注册表拉取镜像到本地系统之前，必须必须使用现有的红帽凭据通过\
  \ `podman` 工具登录注册表：\n\n```bash\npodman login registry.redhat.io\n```\n\n用户名: `yourusername`\n\
  \n密码: `yourpassword`\n\n登录成功！\n\n## 28.3 拉取容器镜像\n\n本例将从注册表拉取 RHEL 9 通用基础镜像 (`UBI`)。在拉取镜像之前，可以使用\
