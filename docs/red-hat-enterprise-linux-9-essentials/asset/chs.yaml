- "# Red Hat Enterprise Linux 9 核心指南\n\n\n\n\n\n\n\n\n\n\n## 1. 引言\n\n毫无疑问，当今最受推崇和广泛使用的企业级操作系统之一是红帽企业\
  \ Linux（通常缩短为 `RHEL`，发音为 `rell`）发行。它不仅被认为是最稳定、可靠的操作系统之一，而且得到了红帽公司（Red Hat, Inc.）大量的资源和技术支持。《红帽企业\
  \ Linux 9 核心教程》旨在提供有关红帽企业 Linux 9 发版安装、使用和管理的详细信息。对于初学者，本书涵盖了操作系统安装、`GNOME` 桌面环境基础知识、配置电子邮件和\
  \ Web 服务器以及使用 `App Streams` 安装软件包和系统更新等主题。此外还涵盖了如与 Microsoft Windows 双引导等其他安装主题，以及所有重要的安全主题，如配置防火墙以及用户和组管理。\n\
  \n对于经验丰富的用户，书中还详细介绍了远程桌面访问、`Cockpit` Web 界面、逻辑卷管理 (`LVM`)、磁盘分区、交换空间管理、KVM 虚拟化、安全外\
  \ (`SSH`)、Linux 容器以及使用 Samba 和 NFS 进行文件共享，以提供对这一企业级操作系统的全面概述。\n\n### 1.1 超级用户规范\n\
  \nRHEL 9 与通用 Linux 一样有两种类型的用户账户：一种是标准用户账户，对操作系统的许多管理文件和功能的访问受限；另一种是具有提升权的超级用户（`root`）账户。通常情况下，用户可以通过登录\
  \ `root` 用户或使用 `su -` 命令并输入 root 密码获取 root 权限。在下面的示例中，用户通过 `su -` 命令获取 root 权限：\n\
  \n```\n[neil@demo-server ~]$ su -\nPassword:\n[root@demo-server ~]#\n```\n\n注意，普通用户的命令提示符以\
  \ `$` 符号结尾，而 root 用户则是 `#` 字符。在命令行操作时，这是判断你当前是否以 root 用户身份发布命令的有用指示。\n\n如果 `su -`\
  \ 命令失败，系统上的 root 账户可能出于安全原因被禁用。在这种情况下，可以使用下述的 `sudo` 命令。\n\n使用 `sudo`，非 root 用户可以执行需要\
  \ root 权限的单个命令。考虑以下使用最新补丁和软件包更新操作系统的尝试：\n\n```\n[neil@demo-server ~]$ dnf update\n\
  Not root, Subscription Management repositories not updated\nError: This command\
  \ has to be run under the root user.\n```\n\n可选，可以配置用户账户使其拥有 root 级权限。无需使用 `su -`\
  \ 命令先获取 root 权限，具有管理权限的用户账户可以使用 `sudo` 运行原本受限的命令：\n\n```\n[neil@demo-server]$ sudo\
  \ dnf update\n```\n\n我们相信你已经听过本地系统管理员的常规教育。这通常归结为以下三点：\n#1) 尊重他人的隐私。\n#2) 在输入之前先思考。\n\
  #3) 能力越大，责任越大。\n\n```\n[sudo] password for neil:\n```\n\n执行多项任务时请使用 `sudo`。对于任何问题，示例如下：\n\
  \n```\n[neil@demo-server]$ sudo -\n```\n\n### 1.2 打开终端窗口\n\n如果你正在使用 `GNOME` 桌面并需要访问\
  \ `Terminal`（终端）。要此操作，可以按下 `Super` 键或点击屏幕左上角的 `Activities`（活动）按钮，然后如图 1 所示选择 `Terminal`：\n\
  \n![](img/gnome_terminal_in_dock.png)\n图 1-1\n\n### 1.3 编辑文件\n\n配置 Linux 系统通常涉及编辑文件。对于\
  \ Linux 新手来说，由于没有首选编辑器，我们建议使用 `nano` 编辑器。在终端中启动 `nano` 只需输入以下命令：\n\n```\n# nano\
  \ <file>\n```\n\n其中 `<file>` 替换为编辑的文件路径。例如：\n\n```\n# nano /etc/passwd\n```\n\n\
  一旦加载，`nano` 将如图 2 所示出现：\n\n![](img/ubuntu_18.04_nano.png)\n图 1-2\n\n创建新文件只需运行：\n\
  \n```bash\n# nano\n```\n\n当你完成文件编辑后，输入 `Ctrl+S` 保存文件，然后按 `Ctrl+X` 退出。要打开现有文件，请使用键盘快捷键\
  \ `Ctrl+R`。\n\n如果你喜欢在 `GNOME` 环境中使用图形化编辑器，`gedit` 是执行基础编辑任务的良好起点。要从桌面启动 `gedit`，按下\
  \ `Alt+F2` 显示如图 3 所示的命令窗口：\n\n![](img/gnome_run_command.png)\n图 1-3\n\n在文本框中输入 `gedit`\
  \ 并按回车键。稍后，`gedit` 将加载并准备好打开、创建和编辑文件：\n\n![](img/gnome_gedit.png)\n图 1-4\n\n或者，也可以从终端窗口启动\
  \ `gedit`，无论带不带打开的文件路径：\n\n```bash\n# gedit\n# gedit /etc/passwd\n```\n\n### 1.4\
  \ 反馈\n\n我们希望你对购买本书满意。如果你在书中发现任何错误，或有任何意见、问题或担忧，请通过邮件联系我们：feedback@ebookfrenzy.com。\n\
  \n### 1.5 勘误\n\n虽然我们尽力确保内容的准确性，但涵盖如此规模和复杂领域的书籍，不可避免包含某些错误和遗漏。书中任何已知问题将同解决方案一起列在以下\
  \ URL：\n\n`https://www.ebookfrenzy.com/errata/rhel9.html`\n\n如果你发现了误列表中未列出的错误，请通过电子邮件告知我们的支持团队：feedback@ebookfrenzy.com。\n\
  \n## 2. 红帽 Linux 简史\n\n\n\n\n红帽企业 Linux（Red Hat Enterprise Linux）是 Linux 操作系统的多种变体（也称为发行版）之一，是由总部位于美国卡罗来纳州罗利市的红帽公司（Red\
  \ Hat, Inc.）的产品。该公司成立于 20 世纪 90 年代中期，由当时由 Marc Ewing 和 Bob Young 拥有的两个公司合并而成立。然而，Linux\
  \ 的起源可以追溯到更早的时期。本章将简述 Linux 操作系统和红帽公司的历史。\n\n## 2.1 到底什么是 Linux？\n\nLinux 是一个操作系统，就像\
  \ Windows 是一个操作系统一样（尽管 Linux 和 Windows 之间存在许多相似之处）。“操作系统”一词用于描述在计算机硬件与我们日常运行的应用程序之间充当中间层的软件。当程序员编写应用程序时，他们与操作系统交互以执行诸如将文件写入硬盘和在屏幕上显示信息等任务。如果没有操作系统，每位程序员都必须编写代码来直接访问系统的硬件。此外，程序员必须能够支持曾经创建过的每一件硬件，以确保应用程序能够在任何硬件配置上运行。由于操作系统处理了所有这些硬件复杂性，应用程序开发变成了一项简单得多的任务。Linux\
  \ 只是现今许多不同操作系统之一。\n\n## 2.2 UNIX 的起源\n\n要理解 Linux 的历史，我们首先必须追溯 20 世纪 60 年代后期的 AT&T\
  \ 贝尔实验室。当时，AT&T 停止了名为 Multics 的新操作系统的开发。然而，两位 AT&T 工程师 Ken Thompson 和 Dennis Ritchie\
  \ 决定将他们在 Multics 项目中学到的知识结合，创建一个名为 UNIX 的新操作系统，该系统迅速在企业和学术机构中流行起来并被广泛采用。\n\n各种专有的\
  \ UNIX 实现陆续上市，包括由 IBM (`AIX`)、惠尔罗-普惠 (`HP-UX`) 和太阳微系统 (`SunOS` 和 `Solaris`）创建的版本。此外，Andrew\
  \ S. Tanenbaum 创建了一个名为 `MINIX` 的类 UNIX 操作系统，专为教学用途设计，并向大学提供源代码。\n\n## 2.3 谁创建了 Linux？\n\
  \nLinux 的起源可以追溯到两个人的工作和哲学。Linux 操作系统的核心是被称为“内核”（kernel）的东西。这是操作系统运行所需的核心功能集。内核管理系统资源，并处理硬件与应用程序之间的通信。Linux\
  \ 内核由 Linus Torvalds 开发，由于不喜欢 `MS-DOS`，并且对 `MINIX` 在新的 Intel 80386 微处理器上的可用性等待感到不耐烦，他决定编写自己的类\
  \ UNIX 内核。当他完成内核的第一版本时，他以开源许可发布了它，允许任何人下载源代码并自由使用和修改它，而无需向 Linus 支付费用。\n\n大约同一时间，自由软件基金会（Free\
  \ Software Foundation）的 Richard Stallman（自由和开源软件的坚定拥护者）正在开发他自己的开源操作系统。然而，Stallman\
  \ 最初并没有专注于内核，而是从开发使用和维护操作系统所需的所有 UNIX 工具、实用程序和编译器的开源版本开始。当他完成这些基础设施的开发后，显而易见的解决方案是将他的工作与\
  \ Linus 编写的内核相结合，创建一个完整的操作系统。这种组合被称为 `GNU/Linux`。纯主义者坚持认为 Linux 应该始终被称为 `GNU/Linux`（事实上，曾有一段时间，Richard\
  \ Stallman 拒绝接受任何不将 Linux 称为 `GNU/Linux` 的出版物的媒体采访）。鉴于自由软件基金会开发的 GNU 工具构成了 `GNU/Linux`\
  \ 很大且至关重要的部分，这并不是没有。遗憾的是，大多数人和出版物简单地将 Linux 称为 Linux，这种情况可能会一直持续。\n\n## 2.4 红帽的早期\n\
  \n1993 年，Bob Young 创建了一家名为 `ACC Corporation` 的公司，根据 Young 的说法，他在“妻子的缝纫衣橱”经营这家公司。`ACC`\
  \ 这个名字本意代表目录业务，也是他妻子经营的一家名为“Antiques and Collectibles of Connecticut”的小型企业的缩写。通过\
  \ ACC 目录业务销售的物品包括 Linux 光盘和相关的开源软件。\n\n大约同一时间，Marc Ewing 创建了自己的 Linux 发行版公司，并将其命名为红帽\
  \ Linux（源自他于在卡内基·梅隆大学学习期间喜欢戴红棒球帽）。\n\n1995 年，`ACC` 收购了红帽，采用了 Red Hat, Inc. 的名称，并经历了快速且巨大的增长。Bob\
  \ Young 在公司于 1999 年 8 月上市后不久就辞去了 CEO 职位，从那以后从事了许多商业和慈善活动，包括经营一家名为 `Lulu` 的按需图书出版公司以及拥有两支加拿大职业运动队。2018\
  \ 年，IBM 以 340 亿美元的交易价值收购了 Red Hat, Inc.。\n\n## 2.5 红帽支持\n\n早期的红帽 Linux 通过软盘和 CD\
  \ 交付给客户（当然，这早于宽带互联网连接的广泛普及）。当用户在使用软件时遇到问题时，他们只能通过电子邮件联系红帽。事实上，Bob Young 经常开玩笑说，这对于限制支持请求非常有效，因为当客户意识到他们需要帮助时，他们的计算机通常无法运行，因此无法用它发送电子邮件向红帽支持团队寻求帮助。在随后的几年里，红帽提供了与付费订阅挂钩的更高级别，现在提供了从“自救”（无支持）到高级支持的各种支持级别。\n\
  \n## 2.6 开源\n\n红帽企业 Linux 9 版（Red Hat Enterprise Linux 9）是红帽目前的商业产品，主要针对企业级、任务关键型部署。它也是红帽提供的不断扩展的产品和服务服务的生态系统的基石。RHEL\
  \ 是一个开源产品，因为如果你愿意，可以免费下载源代码并自己构建软件（这项任务并非轻而易举）。然而，如果你想下载预构建的、现成的即可安装的二进制版本（无论是否带支持），你就必须付费。\n\
  \n## 2.7 Fedora 项目\n\n红帽还赞助 Fedora 项目（Fedora Project），其目标是以 Fedora Linux 的形式提供免费的\
  \ Linux 操作系统（包括源码版和二进制发行版）。Fedora Linux 还是许多新功能的试验场，这些功能最终会被采纳到红帽企业 Linux 操作系统族和\
  \ CentOS 衍生版中。\n\n## 2.8 CentOS Stream - 免费替代方案\n\n对于无法负担红帽企业 Linux 订阅的用户，另一个选择是\
  \ CentOS Stream 操作系统。CentOS 项目最初是一个社区驱动的努力，但现在由红帽拥有，它获取红帽企业 Linux 的源代码，移除红帽标识和订阅要求，进行编译并提供发行版供下载。与\
  \ Fedora 类似，CentOS Stream 在新的操作系统功能包含在未来的 RHEL 版本之前对其进行现场测试。因此，它可能缺乏稳定性，但提供了获取前沿功能的机会。\n\
  \n## 2.9 总结\n\nLinux 操作系统的起源可以追溯到 Linus Torvalds 和 Richard Stallman 的工作，形式为 Linux\
  \ 内核结合 GNU 项目构建的工具和编译器器。\n\n\n\n多年来，Linux 的开源特性导致了各种不同 Linux 发行版的发布。其中一种就是红帽企业 Linux（Red\
  \ Hat Enterprise Linux），它由 Bob Young 和 Mark Ewing 的 Red Hat 公司创建。红帽公司致力于提供企业级的 Linux\
  \ 软件解决方案，并结合广泛的技术支持服务。\n\n# 3. 在空白磁盘驱动器上安装 RHEL 9\n\n现在有两种部署 RHEL 9 系统的方法。一种方法是购买新硬件，或者重新利用现有的计算机系统以在上面安装和运行操作系统。另一种选择是使用\
  \ Amazon AWS、Google Cloud 或 Microsoft Azure（仅列举几个）等服务创建云端操作系统实例。由于云实例通常是通过选择一个预配置、即插即用、且已针对云平台进行优化的操作系统镜像，并以此作为\
  \ RHEL 系统的基础创建的，因此在这种情况下无需执行手动安装操作系统。\n\n另一方面，如果你计划在自己的硬件上安装 RHEL 9，那么学习红帽企业 Linux\
  \ 9 道路上的第一步就涉及安装该操作系统。\n\nRHEL 可以安装在空白磁盘环境中（清除整个磁盘上的所有现有分区并将其完全用于 RHEL），也可以安装在双启动环境中（RHEL\
  \ 与磁盘上的另一个操作系统共存，通常是 Microsoft Windows 家族的成员）。\n\n本章将介绍从本地或远程安装介质进行空白磁盘安装的方法。与 Windows\
  \ 11 系统的双启动安装将在 “在 Windows 上双启动 RHEL 9” 中进行介绍。\n\n## 3.1 获取 RHEL 9 安装介质\n\n虽然 RHEL\
  \ 是一个开源操作系统，因此源代码是可以免费访问的，但二进制安装镜像仅作为付费红帽企业 Linux 订阅的一部分提供。除了访问 RHEL 的安装镜像外，还有不同级别的订阅可以为该操作系统提供技术支持。如果你已经拥有了付费订阅，请登录你的红帽账户下载操作系统。如果你想在购买之前尝试\
  \ RHEL，红帽提供了 30 天的试用期。要注册试用版，请访问以下地址的红帽网站：\n\n`https://www.redhat.com/en/technologies/linux-platforms/enterprise-linux/try-it`\n\
  \n红帽开发者计划成员也可以获得 RHEL 9。加入该计划的详情可以在红帽开发者网站 `https://developers.redhat.com` 上找到。\n\
  \nRHEL 9 支持 Intel 64 位（`x86_64`）和 ARM64（`AArch64`）CPU 架构族。可以下载每种架构的 DVD 或启动 ISO\
  \ 镜像。DVD ISO 镜像是自包含的，包含了安装 RHEL 系统所需的所有包，其命名规范如下：\n\n`rhel-baseos-<version>-<architecture>-dvd.iso`\n\
  \n例如，适用于 64 位 Intel 系统的 RHEL 9.1 DVD 镜像命名如下：\n\n`rhel-baseos-9.1-x86_64-dvd.iso`\n\
  \n另一方面，启动 ISO 镜像仅包含开始安装所需的文件，并且访问远程服务器上的完整安装介质。启动镜像还可以对现有的 RHEL 系统执行救援操作。启动 ISO\
  \ 的命名规范如下：\n\n`rhel-baseos-<version>-<architecture>-boot.iso`\n\n例如，适用于 AArch64\
  \ 的 RHEL 9.1 启动镜像命名如下：\n\n`rhel-baseos-9.1-x86_64-boot.iso`\n\n下载镜像后，可以将其刻录到磁盘，或使用下一节中的步骤将介质写入\
  \ USB 闪盘，配置你的虚拟化环境将其视为 DVD 驱动器，或者使用本章后面概述的步骤通过网络连接访问安装镜像。\n\n## 3.2 将 ISO 安装镜像写入\
  \ USB 闪盘\n\n如今，从 USB 闪盘执行操作系统安装比从 DVD 更常见。在下载了 RHEL 9 的 ISO 安装镜像后，将镜像写入 USB 闪盘的步骤取决于该驱动器连接到\
  \ Linux、macOS 还是 Windows 系统。本节剩余部分的步骤假设 USB 闪盘是新的，或者已经重新格式化以删除任何现有数据或分区：\n\n###\
  \ 3.2.1 Linux\n\n在 Linux 上向 USB 闪盘写入 ISO 镜像的第一步是识别设备名称。在插入 USB 闪盘之前，通过列出 `/dev`\
  \ 中的设备来识别系统已检测到的存储设备：\n\n```bash\nls /dev/sd*\n```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\
  \n将 USB 闪盘连接到 Linux 系统并运行 `dmesg` 命令获取最近系统消息列表，其中一个将是检测到 USB 闪盘的报告，类似于以下：\n\n```\n\
  [ 406.241717] sd 6:0:0:0: [sdb] Attached SCSI removable disk\n```\n\n此输出告诉我们应该预期设备名称包含“sdb”，我们可以通过再次列出\
  \ `/dev` 中的设备名称来确认这一点：\n\n```bash\nls /dev/sd*\n```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\
  \n此输出显示 USB 闪盘已被分配给 `sdb`。在写入 ISO 镜像之前的下一步，是再次列出 `/dev` 中的设备名称以确认：\n\n```bash\n\
  ls /dev/sd*\n```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\n此输出显示 USB 闪盘已分配到 `sdb`。在向设备写入\
  \ ISO 之前，运行 `findmnt` 命令检查它是否已挂载：\n\n```bash\nfindmnt /dev/sdb\n```\n\n如果 `findmnt`\
  \ 命令显示该设备已挂载，在继续之前请卸载它：\n\n```bash\numount /run/media/neil/d6bf9574-e31-4f5c\n```\n\
  \n使用以下 `dd` 命令写入镜像：\n\n```bash\ndd if=/path/to/image of=/dev/sdb bs=512\n```\n\n\
  写入过程可能需要一些时间（取决于镜像大小和速度）。完成后，会出现类似下面的输出，且 USB 闪盘已准备好安装 RHEL：\n\n```\n5956+0 records\
  \ in\n5956+0 records out\n```\n\n### 3.2.2 macOS\n\n在 macOS 系统上向连接的 USB 闪盘上写入 ISO\
  \ 镜像的第一步是使用 `diskutil` 工具识别设备。在连接 USB 设备之前，打开终端（Terminal）窗口并运行以下命令：\n\n```bash\n\
  diskutil list\n```\n\n```\n/dev/disk0 (internal, physical):\n  # TYPE NAME IDENTIFIER\n\
  \  0: GUID_partition_scheme *1.0 TB disk0\n  1: EFI 209.7 MB disk0s1\n  2: Apple_APFS\
  \ Container disk2 1000.0 GB disk0s2\n/dev/disk1 (internal):\n  # TYPE NAME IDENTIFIER\n\
  \  0: GUID_partition_scheme 28.0 GB disk1\n  1: EFI 314.6 MB disk1s1\n  2: Apple_APFS\
  \ Container disk2 27.7 GB disk1s2\n/dev/disk2 (synthesized):\n  # TYPE NAME IDENTIFIER\n\
  \  0: APFS Container Scheme -1.0 TB disk2\n      Physical Stores disk1s2, disk0s2\n\
  \  1: APFS Volume Macintosh HD 473.6 GB disk2s1\n  2: APFS Volume Preboot 42.1 MB\
  \ disk2s2\n  3: APFS Volume Recovery 517.0 MB disk2s3\n  4: APFS Volume VM 1.1 GB\
  \ disk2s4\n/dev/disk3 (external, physical):\n  # TYPE NAME IDENTIFIER\n  0: *16.0\
  \ GB disk3\n```\n\n在上述示例中，USB 闪盘已被分配给 `/dev/disk3`。在继续之前，按以下命令卸载磁盘：\n\n```bash\n\
  diskutil unmountDisk /dev/disk3\n```\n\n```\nUnmount of all volumes on disk3 was\
  \ successful\n```\n\n\n\n\n最后，使用 `dd` 命令将 ISO 镜像写入设备，请注意引用原始磁盘设备（`/dev/rdisk3`），并在提示时输入你的用户密码：\n\
  \n```bash\nsudo dd if=/path/to/iso/image.iso of=/dev/rdisk3 bs=1m\n```\n\n一旦镜像写入完成后，USB\
  \ 驱动器即准备就绪。\n\n### 3.2.3 Windows/macOS\n\nWindows 和 macOS 提供了多种免费工具可以将 ISO 镜像写入\
  \ USB 驱动器，但一个专门为写入 Linux ISO 镜像而编写的工具是 Fedora Media Writer，您可以从以下 URL 下载：\n\n[`getfedora.org/en/workstation/download/`](https://getfedora.org/en/workstation/download/)\n\
  \n安装后，插入目标 USB 驱动器，启动写入工具，并选择如图 3-1 所示所示的 `Select .iso file` 选项：\n\n![](img/fedora_media_writer.png)\n\
  \n图 3-1\n\n点击“Next”（下一步）进入“写入选项”屏幕，并在点击 `Select...` 按钮之前选择 USB 驱动器：\n\n![](img/fedora_media_writer_write_options.png)\n\
  \n图 3-2\n\n在弹出的文件选择对话框中，导航并选择 RHEL 9 安装 ISO 镜像，然后点击 `Open”（打开）按钮。最后，点击 `Write”（写入）按钮开始将镜像写入\
  \ USB 驱动器：\n\n![](img/fedora_media_writer_writing.png)\n\n图 3-3\n\n一旦镜像写入设备，该设备即已准备好执行安装。\n\
  \n## 3.3 安装 Red Hat Enterprise Linux 9\n\n将 RHEL 9 安装介质插入相应的驱动器并启动系统。如果系统尝试从硬盘启动，您将需要进入计算机的\
  \ BIOS 设置并更改启动顺序，使其首先从安装介质驱动器启动。一旦系统启动，您将看到以下屏幕：\n\n![](img/rhel9_install_boot_menu.png)\n\
  \n图 3-4\n\n使用方向键在各个选项之间导航，并使用 `<Enter>` 键进行选择。例如，如果选择了 `Troubleshooting`故障排除）选项，将出现如图\
  \ 3-5 所示的屏幕，其中包含从本地驱动器上的当前操作系统（如果已安装）启动、测试系统内存或救援已安装的 RHEL 9 系统的选项。还有一个选项可用于在没有图形控制台的系统上以基础图形模式进行安装：\n\
  \n![](img/rhel9_install_troubleshooting_menu.png)\n\n图 3-5\n\n如果您安装的是 ARM64 镜像，则故障屏幕上可能没有从本地驱动器启动和运行内存测试的选项。\n\
  \n在主屏幕上选择安装 Red Hat Enterprise Linux 的选项，稍等后，将出现图形化安装程序的第一个屏幕：\n\n![](img/rhel9_install_choose_language.png)\n\
  \n图 3-6\n\n在第一个屏幕上选择您偏好的语言，然后点击 `Continue`（继续）进入如图 3-7 所示的主安装屏幕：\n\n![](img/rhel9_install_summary.png)\n\
  \n图 3-7\n\n首先选择 `Network & Host Name`（网络和主机名）选项，在系统上启用网络设备，并在点击 `Apply`（应用）按钮之前输入主机：\n\
  \n![](img/rhel9_install_network.png)\n\n图 3-8\n\n如果您的网络连接需要额外设置，点击 `Configure...`（配置...）按钮访问如图\
  \ 3-9 所示的高级网络设置屏幕：\n\n![](img/rhel9_install_network_configure.png)\n\n图 3-9\n\n\
  一旦定义了主机并启用了网络连接，点击 `Done`完成）返回主屏幕。\n\n如果您想更改键盘、语言或时间和日期设置，请从主屏幕的“Localization”（本地化）列中选择相应的选项。在\
  \ `Time & Date`（时间和日期）屏幕上，选择与您的地理位置相应的选项。还提供了使用 `Network Time`（网络时间）的选项，它可以自动与外部网络时间协议服务器同步。\n\
  \n由于安装是从本地介质进行的，因此不需要更改 `Installation Source`（安装源）设置。要完成来自远程服务器上介质的安装，请选择 `Installation\
  \ Source`，启用 `On the network`（在网上）选项，然后指定安装介质的位置和所使用的 URL 类型。例如，安装介质可以是安装在远程 Web\
  \ 服务器上的 ISO 镜像，也可以是本地网络上使用 `NFS` 的系统（NFS 文件共享主题将在“在 RHEL 9 上使用 NFS 与远程系统共享文件”章节中详细介绍），或者是远程存储库的\
  \ URL（存储库本质上是组成操作系统的软件、软件包和应用程序的在线集合，可以从中在本地系统上进行安装）。\n\n默认情况下，安装程序将对 RHEL 9 执行\
  \ `Server with GUI`（带 GUI 的服务器）安装。这将包含运行操作系统和图形桌面环境所需的最少软件包。要选择不同的安装配置，选择 `Software\
  \ Selection`（软件选择）选项以显示所示屏幕：\n\n![](img/rhel_8_installation_software_selection.png)\n\
  \n图 3-10\n\n使用左侧面板选择基础配置，使用右侧面板添加您系统启动后需要的任何软件包。如果不需要桌面环境且不确定安装哪些软件包，请使用 `Minimal\
  \ install`（最小安装）选项，并在系统启动后按需安装。这避免了安装任何可能永远需要的软件包。\n\n`Security Policy`（安全策略）选项允许在系统中安装额外的安全软件包，以便实施符合安全自动化协议（SCAP）标准的限制。虽然从列表中选择配置文件会安装必要的软件包，但策略限制在运行系统中启用之前不会生效。除非您在要求此类安全级别的实体或公司，否则在此屏幕上选择策略是可选的。\n\
  \n`Kdump` 功能启用后会在系统崩溃时输出操作系统内核的状态。此转储文件有助于识别崩溃原因，但在启用时会占用内存。除非您的系统内存有限，否则可以保持开启状态。\n\
  \n配置好基本设置的下一步是决定如何对硬盘进行分区以适应操作系统。\n\n## 3.4 为 RHEL 9 分区\n\n当选择 `Installation Destination`（安装目标）选项时，安装程序将显示一个类似于图\
  \ 3-11 所示的屏幕：\n\n![](img/rhel9_install_destination.png)\n\n图 3-11\n\n默认情况下，安装程序配置为使用当前选择磁盘驱动器的可用空间自动安装操作系统，并配置标准分区大小。如果磁盘之前包含另一个操作系统，这些现有的分区将不会被删除，这可能会在\
  \ RHEL 9 安装后驱动器上留下未使用的空间。要删除任何现有分区以便 RHEL 9 回收并使用，请启用 `I would like to make additional\
  \ space available`（我想提供更多可用空间）选项并点击 `Done`按钮显示如图 3-12 所示的对话框：\n\n![](img/rhel9_install_reclaim_space.png)\n\
  \n图 3-12\n\n\n\n\n要回收空间，请选择一个不再需要的分区，并点击 `Delete` 按钮将其标记为删除。一旦选取了所有要删除的分区，点击 `Reclaim\
  \ Space` 按钮执行删除。回收的空间现在将由 RHEL 9 安装程序自动使用。\n\n若要根据可用空间的分配方式手动配置磁盘布局，请将 `Storage\
  \ Allocation` 设置从 `Automatic` 更改为 `Custom`，并点击 `Done` 显示 `Manual Partitioning`（手动分区）界面（图\
  \ 3-13）：\n\n![](img/rhel9_install_partitioning.png)\n\n图 3-13\n\n手动分区界面允许使用逻辑卷管理\
  \ (`LVM`) 或标准分区来配置磁盘。`LVM` 是推荐的选项，因为它在系统运行后提供了管理分区大小的灵活性（有关 LVM 的细节将在 “向 RHEL 9\
  \ 卷组和逻辑卷中添加新磁盘” 章节中进行详细介绍）。\n\n一旦选定了分区方案，最后一步是确定分区大小以及相应的的文件系统挂载点。通常情况下，`Click here\
  \ to create them automatically` 选项提供的默认配置可以满足大多数系统需求。然而，若要手动创建分区并分配挂载点，请点击 `+` 按钮手动声明并分配分区。\n\
  \n另一个选项是选择自动创建分区，然后使用生成的界面根据需要手动更改分区配置。例如，图 3-14 显示了选择自动创建选项定义的分区配置，并允许在对磁盘进行任何更改之前修改每个分区的设置：\n\
  \n![](img/rhel9_install_automatic_partions.png)\n\n图 3-14\n\n磁盘配置好后，点击 `Done`，检查对磁盘所做的更改摘要（图\
  \ 3-15），然后点击 `Accept Changes` 按钮：\n\n![](img/rhel9_install_partion_summary.png)\n\
  \n图 3-15\n\n### 3.5 磁盘加密\n\nRHEL 9 还允许通过加密保护磁盘内容。这需要在每次系统启动时输入密码。要启用加密，在主 Installation\
  \ Destination（安装目标）屏幕上选择 `Encrypt my data` 选项，点击 `Done` 按钮后，在图 3-16 显示的对话框中输入密码：\n\
  \n![](img/rhel_8_installation_disk_encryption.png)\n\n图 3-16\n\n### 3.6 用户设置\n\n\
  在完成安装之前，你必须创建一个 root 密码和一个可选的用户账户。root（或超级用户）是具有系统管理权限的特殊用户。虽然你通常会使用自己的账户登录系统，但你需要\
  \ root 权限来配置系统并执行其他管理任务。\n\n选择 `Root Password` 选项并输入一个足够安全的密码。还有选项可以锁定 root 账户使其无法访问，以及允许通过密码认证远程连接到系统并访问\
  \ root 账户。通常，建议保持 root 账户未锁定状态，但不允许使用密码进行远程 SSH 访问。如果需要远程 root 访问，应使用 SSH 密钥身份验证来实现，该主题将在本书的在\
  \ RHEL 9 上配置 SSH 密钥身份验证”章节中介绍。\n\n接下来，选择 `User Creation` 选项并输入用户名和密码。如果你希望此用户能够使用\
  \ `sudo` 命令执行管理任务，请也勾选 `Make this user administrator` 复选框。如果未启用此选项，用户必须使用 `su` 命令并输入\
  \ root 密码来获得 root 权限（假设上述锁定 root 账户的选项未启用）。如果你添加的用户需要执行管理任务，`sudo` 是推荐选项，应当启用该复选框。\n\
  \n### 3.7 注册系统\n\n安装过程完成后且系统运行时，在进行任何更新或安装额外软件包之前，必须向 Red Hat 注册系统。在编写本文时，在不先注册的情况下安装\
  \ ARM64 版本的 RHEL 9 是可能的，但 X86_64 版本要求在安装前注册。要注册系统，选择 `Connect to Red Hat` 选项，根据你获取\
  \ RHEL 许可的方式选择 `Account` 或 `Activation key` 选项。输入信息后，点击 `Register` 按钮完成注册过程。\n\n\
  ### 3.8 物理安装\n\n在选择了适当软件包后，点击 `Begin Installation` 将开始分区磁盘并安装与所选安装设置匹配的软件包。在此阶段，将显示图\
  \ 3-17 所示安装进度屏幕：\n\n![](img/rhel9_installing.png)\n\n图 3-17\n\n所有系统软件包安装并配置完成后，移除安装媒体并点击\
  \ `Reboot System` 重启系统。\n\n### 3.9 最终配置步骤\n\n系统启动时控制台上显示的内容取决于在软件选择安装屏幕上选择了 `Workstation`（工作站）还是\
  \ `Server with GUI`（带 GUI 的服务器）选项。如果在安装期间选择了这些选项之一，将出现 GNOME 显示管理器 (`GDM`) 登录界面。相反，如果选择了最小或服务器配置，将显示文本登录提示符。无论何种配置，请使用安装过程期间创建的用户登录系统。\n\
  \n对于 Workstation 或 Server with GUI 安装，GNOME 初始化设置工具将启动并提供桌面环境的引导。\n\n如果你在启动安装前没有注册系统，可以在命令行提示符或桌面环境下终端窗口中进行。要在桌面启动终端会话，点击菜单栏中的\
  \ `Activities`，然后点击屏幕底部的面板上的 `Terminal` 图标，如图 3-18 所示：\n\n![](img/rhel9_terminal_icon.png)\n\
  \n图 3-18\n\n在提示符处，使用 `sudo` 命令获取 root 权限并输入你的用户密码：\n\n```bash\nsudo su -\n```\n\n\
  接下来，使用 `subscription-manager` 工具向 Red Hat 注册系统，并在提示输入你的 Red Hat Access 用户名和密码：\n\
  \n```bash\nsubscription-manager register\n```\nRegistering to: subscription.rhsm.redhat.com:443/subscription\n\
  Username: myusername\nPassword:\n\n系统已注册，ID 为：22f0ca3f-8d03-4933-be95-d6c4d8e3fe1a\n\
  注册系统名为：rhelserver1\n\n最后，通过以下命令将系统附加到订阅服务：\n\n```bash\nsubscription-manager attach\
  \ --auto\n```\n\n已安装产品状态：\nProduct Name: Red Hat Enterprise Linux for x86_64\nStatus:\
  \ Subscribed\n\n### 3.10 安装更新\n\n与现在的大多数操作系统一样，RHEL 发行版的特定版本在发布给公众后继续演进。这通常表现为错误修复、安全更新，并且偶尔会有新功能，这些功能可以通过互联网下载并安装到你的系统中。\n\
  \n\n\n\n最佳实践规定，安装 RHEL 后第一步是确保将所有可用的更新应用到系统。这可以通过终端 窗口中的命令行提示符使用 `dnf` 软件包管理器工具来实现。要检查是否有可用更新，请运行以下命令：\n\
  \n```bash\ndnf check-update\n```\n\n可以再次使用 `dnf` 工具应用任何待处理的更新：\n\n```bash\ndnf update\n\
  ```\n\n执行后，`dnf` 工具将提供可用更新的包列表，并提示权限以执行更新。更新完成后，安装基本上已经完成，RHEL 9 即可准备好使用。\n\n###\
  \ 3.11 显示启动消息\n\n在启动过程中，RHEL 9 将显示红帽图形化启动（RHGB）屏幕，该屏幕会隐藏系统在加载时生成的所有启动消息。要在启动过程中使这些消息可见（如图\
  \ 3-19 所示），请在系统启动时按下键盘上的 `Esc` 键：\n\n![](img/rhel_9_boot_messages.png)\n\n图 3-19\n\
  \n可以通过编辑 `/etc/default/grub` 文件并更改 `GRUB_CMDLINE_LINUX` 设置来更改默认行为，使其默认始终显示消息，该设置默认类似于：\n\
  \n```\nGRUB_CMDLINE_LINUX=\"... rhgb quiet\"\n```\n\n要删除图形化启动屏幕以便在无需按 `Esc` 键的情况下看到消息，请从设置中删除“rhgb”选项：\n\
  \n```\nGRUB_CMDLINE_LINUX=\"... rhgb quiet\"\n```\n\n此更改将导致系统仅显示生成的启动消息子集。要显示系统生成的所有消息，还要删除“quiet”选项：\n\
  \n```\nGRUB_CMDLINE_LINUX=\"... quiet\"\n```\n\n一旦完成更改，运行以下命令以生成新的启动配置，以便在下次系统启动时生效：\n\
  \n```bash\ngrub2-mkconfig --output=/boot/grub2/grub.cfg\n```\n\n### 3.12 总结\n\n\
  使用 RHEL 9 工作的第一步是安装操作系统。对于云服务器，此任务通常在根据云服务提供商提供的系列选项为系统选择操作系统镜像时自动完成。然而，在自己的硬件上安装则涉及下载\
  \ ISO 镜像的安装媒体、将该镜像写入 DVD 或 USB 驱动器等合适的存储设备，并从其启动。运行后，安装过程允许配置一系列选项，包括网络、安装应从本地介质还是通过远程服务器或仓库进行、要安装的软件包以及磁盘分区。安装完成后，安装任何自原始安装镜像创建以来可能发布的操作系统更新是非常重要的。\n\
  \n## 4. 与 Windows 双启动 RHEL 9\n\n与大多数 Linux 发行版一样，红帽企业级 Linux 9 可以很乐意地与从 Windows\
  \ 到包括 Windows 11 在内的几乎任何版本的 Windows 在硬盘器上共存。这种概念被称为“双启动”。当你启动系统时，你将看到一个菜单，提供启动 RHEL\
  \ 9 安装或 Windows 的选项。显然，你一次只能运行一个操作系统。尽管如此，值得注意的是，无论你的硬盘 Windows 分区是使用 NTFS、FAT16\
  \ 还是 FAT32 格式化的，你都可以从 RHEL 9 访问 Windows 分区上的文件。\n\n这种安装方法涉及缩小现有 Windows 分区的大小，然后在回收的空间中安装\
  \ RHEL 9。本章假设 RHEL 9 正在安装在当前运行 Windows 11 的系统上。\n\n## 4.1 分区大小调整\n\n为了在已包含 Windows\
  \ 安装的硬盘上容纳 RHEL，第一步涉及缩小 Windows 分区以腾出空间。建议的操作是使用 Windows 磁盘管理界面在尝试安装 RHEL 9 之前缩小分区大小。\n\
  \n要在 Windows 11 上访问磁盘管理，右键点击单击菜单，并从生成的菜单中选择选项，如图 4-1 所示：\n\n![](img/windows_start_menu.png)\n\
  \n图 4-1\n\n加载后，磁盘管理工具将显示系统检测到的硬盘的图形表示：\n\n![](img/windows_disk_management.png)\n\
  \n图 4-2\n\n右键点击你想要缩小大小的分区，从弹出菜单中选择“收缩卷...”（Shrink Volume...）。该工具将计算在不丢失数据的情况下卷大小可以减少的最大量（取决于分区的总大小，此过程可能需要几分钟）。一旦分析完成，将出现一个与下方图\
  \ 4-3 所示类似的对话框：\n\n![](img/windows_disk_management_shrink_volume.png)\n\n图 4-3\n\
  \n在“输入要收缩的空间量（MB）”字段中指定一个值并点击“收缩”（Shrink）按钮继续。一旦调整操作完成，使用 RHEL 9 安装媒体重启（如“在洁净硬盘上安装\
  \ RHEL 9”）在 `/etc/default/grub` 文件中声明，新安装时如下：\n\n```\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"\
  $(sed 's, release .*,g' /etc/system-release)\"\nGRUB_DEFAULT=saved\nGRUB_DISABLE_SUBMENU=true\n\
  GRUB_TERMIN_OUTPUT=\"console\"\nGRUB_CMDLINE_LINUX=\"crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M\
  \ resume=/dev/mapper/rhel-swap rd.lvm.lv=rhel/root rd.lvm.lv=rhel/swap rhgb quiet\"\
  \nGRUB_DISABLE_RECOVERY=\"true\"\nGRUB_ENABLE_BLSCFG=true\n```\n\n更改默认系统的第一步是在此文件中声明\
  \ `GRUB_SAVEDEFAULT` 设置：\n\n`s, release .*,g' /etc/system-release` 替换后添加 `GRUB_SAVEDEFAULT=true`\n\
  \n此设置在启动配置中保存了一个新的默认值。接下来，运行 `grub2-set-default` 命令更改默认设置，使用从第一个选项算作 0 的计数系统。例如，如果\
  \ Windows 11 选项是菜单中的第 3 个，将 Windows 11 设置为默认启动选项的命令如下：\n\n```bash\ngrub2-set-default\
  \ 2\n```\n\n运行以下命令检查新设置是否生效：\n\n```bash\ngrub2-editenv list\n```\n\n```\nsaved_entry=f862181be19a40ae921f10fc572174d3-5.14.0-162.23.1.el9_1.x86_64\n\
  menu_auto_hide=1\nboot_success=1\nboot_indeterminate=0\nsave_default=true\n```\n\
  \n\n\n\n\n请注意 `saved_entry` 值现在已设置为 Linux 启动分区。更改默认值后，按照如下命令重新生成启动配置文件：\n\n```bash\n\
  grub2-mkconfig --output=/boot/grub2/grub.cfg\n```\n\n重启系统并验证启动菜单默认选择 Windows 选项，且\
  \ Windows 在超时过期后正常加载。\n\n## 4.3 从 RHEL 9 访问 Windows 分区\n\n在双启动配置下运行 RHEL 时，可以通过从命令行手动挂载分区来访问位于\
  \ Windows 分区的文件。但是，在此之前，需要在系统上安装一些额外的软件包。首先，需要下载并安装 `fuse` 内核模块：\n\n```bash\ndnf\
  \ install fuse\nmodprobe fuse\n```\n\n接下来，需要安装 Fuse NTFS 驱动。遗憾的是，该包未包含在标准的 RHEL\
  \ 9 仓库中，因此需要如下向系统添加 Extra Packages for Enterprise Linux (EPEL) 仓库：\n\n```bash\n\
  subscription-manager repos --enable codeready-builder-for-rhel-9-$(arch)-rpms\n\
  dnf install https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm\n\
  ```\n\n添加 EPEL 仓库后，现在可以安装驱动程序：\n\n```bash\ndnf install ntfs-3g\n```\n\n一旦安装了所需的软件包，下一步是创建一个目录作为我们\
  \ Windows 分区的挂载点。在本示例中，我们将创建一个名为 `/mnt/windows` 的目录：\n\n```bash\nmkdir /mnt/windows\n\
  ```\n\n使用 `fdisk` 命令识别分配给 Windows 分区的设备名称：\n\n```bash\nfdisk -l\n```\n\n设备 起 结束\
  \ 扇区 大 类型\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2 206848\
  \ 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616 49362943 49123328 23.4G\
  \ Microsoft basic data\n/dev/nvme0n1p4 132933632 134213631 1280000 625M Windows\
  \ recovery environment\n/dev/nvme0n1p5 49362944 51460095 2097152 1G Linux filesystem\n\
  /dev/nvme0n1p6 51460096 132933631 81473536 38.8G Linux LVM\n\n在上面的输出中，包含我们需要访问的文件的主\
  \ Windows 分区由 `/dev/nvme0n1p3` 表示。接下来，我们需要按照如下方式运行 `mount` 命令（假设 Windows 分区为 `/dev/nvme0n1p3`）：\n\
  \n```bash\nmount /dev/nvme0n1p3 /mnt/windows\n```\n\n列出挂载点根目录的内容来检查挂载是否成功：\n\n```bash\n\
  ls /mnt/windows\n```\n'$Recycle.Bin' ProgramData swapfile.sys\n'Documents and Settings'\
  \ 'Program Files' 'System Volume Information'\npagefile.sys 'Program Files (x86)'\
  \ Users\nPerfLogs Recovery Windows\n\n为了在每次系统启动时自动挂载，请向 `/etc/fstab` 文件中添加适当的挂载行：\n\
  \n```text\n/dev/nvme0n1p3 /mnt/windows ntfs defaults 0 0\n```\n\n要随时卸载 Windows 文件系统：\n\
  \n```bash\numount /mnt/windows\n```\n\n## 4.4 总结\n\nRHEL 9 可以通过创建双启动环境与 Windows\
  \ 操作系统在同一块硬盘上安全共存。这涉及到在安装之前缩小 Windows 系统空间为 RHEL 9 留出空间。一旦安装了 RHEL，必须修改启动菜单配置以包含从\
  \ Windows 启动的选项。要在 RHEL 内部访问 Windows 文件系统，需要安装 Fuse NTFS 驱动并使用它来挂载 Windows 分区。\n\
  \n## 5 在 RHEL 9 中删除 Windows 分区\n\n在上一章中，我们查看了在与 Windows 相同的磁盘上安装 Red Hat Enterprise\
  \ Linux 9。这种所谓的“双启动”配置允许用户在单个硬盘上安装两个操作系统，并在系统开机时可以选择启动其中一个。\n\n本章适用于那些已经决定足够喜欢 RHEL\
  \ 9，从而从磁盘上完全删除 Windows 并并将空间用于 Linux 的用户。在接下来的章节中，我们将逐步完成这一过程。\n\n### 5.1 卸载 Windows\
  \ 分区\n\n如果按照“与 Windows 双启动 RHEL 9”章节中的步骤从 RHEL 9 内部挂载了 Windows 分区，则在继续本章之前应采取措施卸载分区。假设\
  \ Windows 分区被挂载为 `/mnt/windows`，可以如下进行卸载：\n\n```bash\numount /mnt/windows\n```\n\
  \n如果之前添加过 `/etc/fstab` 文件，也应对其编辑以移除 `/mnt/windows` 自动挂载。\n\n### 5.2 从磁盘上删除 Windows\
  \ 分区\n\n为 RHEL 释放 Windows 分区的第一步是删除该分区。在此之前，必须备份 Windows 和 RHEL 分区中的任何数据。完成此操作后即可继续本章。要删除\
  \ Windows 分区，首先需要使用 `fdisk` 工具识别它们所在的磁盘：\n\n```bash\nfdisk -l\n设备 起 结束 扇区 大 类型\n\
  /dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2 206848 239615\
  \ 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616 49362943 49123328 23.4G Microsoft\
  \ basic data\n/dev/nvme0n1p4 132933632 134213631 1280000 625M Windows recovery environment\n\
  /dev/nvme0n1p5 49362944 51460095 2097152 1G Linux filesystem\n/dev/nvme0n1p6 51460096\
  \ 132933631 81473536 38.8G Linux LVM\n\n在上面的示例中，系统包含一个由设备名称 `/dev/nvme0n1` 引用的物理磁盘。该磁盘上分别通过\
  \ `/dev/nvme0n1p1` 到 `/dev/nvme0n1p6` 分区。根据 Types 列的值，存在三个 Windows 相关分区。第一个是 Windows\
  \ 系统分区，第二个较大的分区包含 Windows 操作系统和数据，随后是 Windows 恢复分区。\n\n要删除分区，使用包含分区的磁盘名称（在本例中为 `/dev/nvme0n1`）启动\
  \ `fdisk` 工具，并按照指示再次显示分区和扇区信息：\n\n```bash\nfdisk /dev/nvme0n1\n欢迎使用 fdisk (util-linux\
  \ 2.37.4)。\n更改将仅留在内存中，直到你决定写入。\n在使用 write 命令前要小心。\n命令 (m for help): p\n磁盘 /dev/nvme0n1:\
  \ 64 GiB, 68719476736 字节, 13421728 扇区\n磁盘模型: VMware Virtual NVMe Disk\n单位: 1 * 512\
  \ = 512 字节\n扇区大小 (逻辑/物理): 512 字节 / 512 字节\nI/O 大小 (最小/最优): 512 字节 / 512 字节\n磁盘标签:\
  \ gpt\n磁盘标识符: 7A38CD86-091E-4781-BFB0-928FD3C935\n设备 起 结束 扇区 大 类型\n/dev/nvme0n1p1\
  \ 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2 206848 239615 32768 16M Microsoft\
  \ reserved\n/dev/nvme0n1p3 239616 49362943 49123328 23.4G Microsoft basic data\n\
  /dev/nvme0n1p4 132933632 134213631 1280000 625M Windows recovery environment\n/dev/nvme0n1p5\
  \ 49362944 51460095 2097152 1G Linux filesystem\n/dev/nvme0n1p6 51460096 132933631\
  \ 81473536 38.8G Linux LVM\n分区表项不是按磁盘顺序。\n命令 (m for help):\n```\n\n在继续之前，请记住我们将删除的分区的起始和结束地址（即\
  \ `/dev/nvme0n1p2` 的起始处以及 `/dev/nvme0n1p5` 起始之前的扇区）。\n\n在命令提示符处，删除 Windows 分区（即示例系统中的\
  \ 2、3 和 4 号分区）：\n\n```bash\n命令 (m for help): d\n分区编号 (1-6, 默认 6): 2\n分区 2 已删除。\n\
  命令 (m for help): d\n分区编号 (1,3-6, 默认 6): 3\n分区 3 已删除。\n命令 (m for help): d\n分区编号 (1,4-6,\
  \ 默认 6): 4\n分区 4 已删除。\n```\n\n\n\n\n既然我们已经删除了 Windows 分区，我们需要在腾出的磁盘空间中创建新的 `RHEL`\
  \ 分区。分区编号必须与删除的第一个分区编号匹配（在本例中为 `2`）。此外，有必要精确输入与旧分区报告一致的分区起始扇区和结束扇区（尽管 `fdisk` 通常会默认提供正确的值，但双重检查是明智的）。如果系统提示要删除\
  \ NTFS 签名，请输入 Y：\n\n```\nCommand (m for help): n\nPartition number (2-4,7-128, default\
  \ 2): 2\nFirst sector (206848-134217694, default 206848):\nLast sector, +/-sectors\
  \ or +/-size{K,M,G,T,P} (206848-49362943, default 49362943):\nCreated a new partition\
  \ 2 of type 'Linux filesystem' and of size 23.4 GiB.\nCommand (m for help):\n```\n\
  \n完成这些更改后，下一步是检查设置是否正确：\n\n```\nCommand (m for help): p\nDisk /dev/nvme0n1: 64 GiB,\
  \ 68719476736 bytes, 134217728 sectors\nDisk model: VMware Virtual NVMe Disk\nUnits:\
  \ sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512\
  \ bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type: gpt\n\
  Disk identifier: 7A38CD86-091E-4781-BFB0-928FD383C935\nDevice Start End Sectors\
  \ Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2 206848\
  \ 49362943 49156096 23.4G Linux filesystem\n/dev/nvme0n1p5 49362944 51460095 2097152\
  \ 1G Linux filesystem\n/dev/nvme0n1p6 51460096 132933631 81473536 38.8G Linux LVM\n\
  ```\n\n为了提交更改，我们现在需要将新的分区信息写入磁盘并退出 `fdisk` 工具：\n\n```\nCommand (m for help): w\n\
  ```\n\n分区表已更改。\n正在同步磁盘。\n\n## 5.3 格式化未分配磁盘分区\n\n为了使新分区适用于 `RHEL 9` 使用，需要在其上创建一个文件系统。当前版本\
  \ `RHEL` 推荐的文件系统类型是 `XFS`，它将在标题为向 RHEL 9 系统中添加新磁盘驱动器的章节中详细介绍。使用以下 `mkfs.xfs` 命令创建文件系统：\n\
  \n```\n# mkfs.xfs -f /dev/nvme0n1p2\n```\n\n```\nmeta-data=/dev/nvme0n1p2 isize=512\
  \ agcount=4, agsize=1536128 blks\n        = sectsz=512 attr=2, projid32bit=1\n \
  \       = crc=1 finobt=1, sparse=1, rmapbt=0\n        = reflink=1 bigtime=1 inobtcount=1\n\
  data = bsize=4096 blocks=6144512, imaxpct=25\n        = sunit=0 swidth=0 blks\n\
  naming =version 2 bsize=4096 ascii-ci=0, ftype=1\nlog =internal log bsize=4096 blocks=3000,\
  \ version=2\n        = sectsz=512 sunit=0 blks, lazy-count=1\nrealtime =none extsz=4096\
  \ blocks=0, rtextents=0\n```\n\n## 5.4 挂载新分区\n\n接下来，我们需要挂载新分区。在本例中，我们将将其挂载到名为 `/data`\
  \ 的目录中。然而，你可以使用任何所需的有效挂载点挂载新分区，或将其作为逻辑卷的一部分（详细信息将在标题为向 RHEL 9 卷组和逻辑卷中添加新磁盘的章节中介绍）。首先，我们需要创建作为挂载点的目录：\n\
  \n```\n# mkdir /data\n```\n\n其次，我们需要编辑 `/etc/fstab` 中的挂载表，以便分区在每次系统启动时自动挂载。在 `/etc/fstab`\
  \ 最后添加以下行来挂载新分区（修改 `/etc/fstab`）：\n\n```\n/dev/nvme0n1p2 /data xfs defaults 0 0\n\
  ```\n\n最后，我们可以手动挂载新分区：\n\n```\n# mount /data\n```\n\n运行以下命令检查分区情况：\n\n```bash\n\
  # df -h\n```\n\n## 5.5 总结\n\nRed Hat Enterprise Linux 9 包含了 GNOME 桌面。\n\n## 6.1\
  \ 安装 GNOME 桌面\n\n如果在安装期间选择了 `Workstation`（工作站）或 `Server with GUI`（带图形界面的服务器）配置，则每次系统启动时都可以使用\
  \ GNOME 桌面。如果选择了任何其他软件配置，则不会包含 GNOME 桌面。值得注意的是，远程访问桌面也是可行的；即使在无头服务器上（即缺少显示器、键盘和鼠标的服务器），安装\
  \ GNOME 桌面可能仍然大益。建立远程桌面的主题将在使用 VNC 访问 RHEL 9 远程桌面中进行详细介绍。\n\n如果安装配置未包含 GNOME 桌面，可以随时使用以下命令进行安装：\n\
  \n```\n# dnf groupinstall workstation\n```\n\n安装完成后，可以从命令行提示符启动桌面环境：\n\n```\n$ startx\n\
  ```\n\n## 6.2 GNOME 桌面概述\n\n图 6-1 所示显示了新启动的 GNOME 桌面在启动任何程序或进行配置之前的界面：\n\n主桌面区域（标记为\
  \ A）是应用程序和工具窗口出现的地方。与其他桌面环境不同，无法将文件或应用程序拖到桌面，这提供了一个整洁无杂的工作空间。\n\n屏幕顶部的条（B）称为顶栏，包含活动菜单（C）、日期和时间，以及一组按钮和图标，包括网络状态、音频量、电池电源和其他状态和账户设置。此外，当前在桌面运行的活动应用程序的菜单也会出现在顶栏中。\n\
  \n## 6.3 活动概览\n\n应用程序和工具通过活动概览进行启动，可以通过点击顶栏中的活动按钮或按下键盘上的特殊键来显示。在 Windows 键盘上，这是\
  \ `Windows` 键；在 macOS 上是 `Command` 键，在 Chromebook 上是带有放大镜的按键。\n\n显示时，活动概览将类似于图 6-3\
  \ 所示。\n\n\n\n\n概览的中央区域（上方图 6-3 中标记为 A）显示了所有当前打开的应用程序窗口。屏幕底部（B）是启动器（也称为 dash），可以通过它启动应用程序。默认情况下，启动器将显示一组预定义的常用应用程序图标，以及任何当前正在运行的应用程序的图标。如果应用程序正在运行，则图标下方将显示一个圆点。要启动应用程序，只需点击启动器中的图标即可。\n\
  \n要查找未包含在启动器中的应用程序，一种方法是选择右侧的网格图标（由九个点组成的正方形），以显示可浏览的应用程序列表，如图图 6-4 所示：\n\n![](img/rhel_9_gnome_activities_grid.png)\n\
  \n图 6-4\n\n同样重要的是，列表中的某些项目是包含其他应用程序的文件夹。可以通过拖动并释放图标来重新排列网格中的项目。要将应用程序添加到文件夹，请在网格中找到它并将其拖入文件夹。此外，拖动一个图标并将其释放到另一个图标上将创建一个包含这两个应用程序的新文件夹，并可以向其中添加其他应用程序。\n\
  \n浏览应用程序的替代方案是使用搜索栏进行搜索（上方图 6-3 中标记为 C），并在图中显示了操作过程：\n\n![](img/rhel_9_gnome_activities_search.png)\n\
  \n图 6-5\n\n随着在搜索框中输入文本，可能的匹配项列表将不断精简。\n\n为了更方便地访问将应用程序添加到启动器，请找到应用程序的图标，右键点击它，并选择“添加到收藏夹”菜单选项：\n\
  \n![](img/rhel_9_gnome_add_to_favorites.png)\n\n图 6-6\n\n要从启动器中删除应用程序，右键点击启动器中的图标并选择“从收藏夹中移除”。或者，通过在启动器与外部之间拖放图标来添加和删除它们。\n\
  \n## 6.4 管理窗口\n\n与其他桌面环境一样，在 GNOME 上运行的应用程序以窗口形式存在。当打开多个应用程序窗口时，使用 `Super + Tab`\
  \ 快捷键将显示切换面板（图 6-7），允许选择不同的窗口作为当前活动窗口（`Super` 键可以是 Windows 键，或者在 Mac 键盘上是 `Cmd`\
  \ 键）：\n\n![](img/rhel_9_gnome_switcher.png)\n\n图 6-7\n\n如果一个应用程序打开了多个窗口，切换器将在第二个面板中显示这些窗口，以便选择特定窗口：\n\
  \n![](img/rhel_9_gnome_switcher_multi_windows.png)\n\n图 6-8\n\n要在切换器中的图标上反向循环切换，请使用\
  \ `Shift+Tab` 快捷键。\n\n要最大化窗口以填满整个屏幕，点击标题栏并将窗口拖动到屏幕顶部。要将窗口恢复到原始大小，点击标题栏并将其向下拖动。或者，双击标题栏可以在窗口大小之间切换。同样，将窗口拖到屏幕的左侧或右侧将使窗口填充屏幕的半部分。\n\
  \n## 6.5 使用工作区\n\n显示应用程序窗口的屏幕区域被称为工作区，GNOME 40 允许配置多个工作区。GNOME 桌面启动时会有两个工作区，您可以使用\
  \ `Super+Alt+Left` 和 `Super+Alt+Right` 键组合在之间切换。当窗口被添加到空白工作区时，工作区面板会添加另一个空白工作区，从而创建更多工作区。\n\
  \n当前工作区的缩略图出现在活动概览中搜索字段下方，如图图 6-9 所示：\n\n![](img/rhel_9_gnome_workspaces.png)\n\n\
  图 6-9\n\n要切换到不同的工作区，请选择相应的缩略图。要将窗口从一个工作区移动到另一个工作区，显示工作区面板并将应用程序窗口（当前工作区的实际窗口或工作区面板中的缩略窗口）拖放到目标工作区。要删除工作区，请关闭所有窗口或将其移动到另一个工作区。\n\
  \n## 6.6 日历与通知\n\n当系统需要通知您事件（例如系统或应用程序更新可用），弹出面板将出现在工作区的顶部。此外，通过点击顶栏上的日期和时间可以访问日历和任何之前的通知，如图图\
  \ 6-10 所示：\n\n![](img/rhel_9_gnome_date_time.png)\n\n图 6-10\n\n## 6.7 GNOME 桌面设置\n\
  \n要访问“设置”应用程序，点击顶栏右侧的图标行并选择“设置”，如图图 6-11 所示：\n\n![](img/rhel_9_gnome_settings_menu_low_res.png)\n\
  \n图 6-11\n\n设置应用程序提供了许多选项，例如以太网和 WiFi 连接、屏幕背景自定义选项、屏幕锁定和电源管理以及语言设置。要探索每个类别中的可用设置，请从设置窗口左侧面板中选择选项：\n\
  \n![](img/rhel_9_gnome_settings.png)\n\n图 6-12\n\n上述图 6-11 中的菜单还包括切换用户、调整音量、切换到不同网络以及注销、重启或关机选项。\n\
  \n## 6.8 基础自定义之外\n\nGNOME 40 桌面在设计上是一个洁净、整洁的环境，自定义选项极少。然而，可以对桌面进行额外的更改。GNOME 项目开发了一个名为\
  \ `GNOME Tweaks` 的工具用于此目的。使用以下命令安装并运行此工具：\n\n```\n# dnf install gnome-tweaks\n$\
  \ gnome-tweaks\n```\n\n一旦 GNOME Tweaks 加载，将出现如图图 6-13 所示的界面：\n\n![](img/rhel_9_gnome_tweaks.png)\n\
  \n图 6-13\n\n现在提供了大量的自定义桌面选项。本章无法全部涵盖，因此在进入下一章节之前，请尝试这些设置。\n\n## 6.9 总结\n\nRHEL 9\
  \ 包含了 GNOME 40 桌面环境，可以在初始安装时包含，也可以使用 `dnf` 组软件包功能以后安装。与其他桌面环境相比，GNOME 40 旨在提供一个简洁且易用的窗口用户界面。GNOME\
  \ 40 桌面的关键区域包括顶栏、活动概览和启动器。此外，GNOME 40 支持多个工作区，使运行的应用程序保持井然有序且屏幕整洁。设置应用程序提供了多种配置选项，包括桌面背景、音频、网络配置和\
  \ WiFi 网络选择。\n\n## 7. Cockpit Web 界面概述\n\n尽管配备了最新的 Linux 桌面环境，Red Hat Enterprise\
  \ Linux 9 仍然是一个服务器操作系统。因此，大多数 RHEL 部署是针对远程物理服务器或云虚拟机实例的。通常情况下，这些系统在没有键盘、鼠标或显示器的情况下运行，只能通过网络连接使用命令行提示进行直接访问。这在从远程管理系统方面带来了挑战。\n\
  \n\n\nCockpit 基于 Web 的管理界面提供了此功能。本章将解释如何安装、配置和访问 Cockpit 界面，同时提供 Cockpit 关键功能的概述，其中许多功能将在后面的章节中详细介绍。\n\
  \n## 7.1 Cockpit 概述\n\nCockpit 是一个轻量级的基于 Web 的界面，允许远程执行常规系统管理任务。安装并配置完成后，系统管理员打开本地浏览器窗口并导航到远程服务器上的\
  \ Cockpit 端口。在浏览器中加载 Cockpit 界面并登录后，可以使用管理和监控工具视觉化地执行各种任务。\n\n在后台，Cockpit 使用与在命令行工作时相同的工具执行任务，并自动更新以反映系统其他地方发生的变化。这意味着\
  \ Cockpit 可以与其他管理工具和技术配合使用，而无一种方法覆盖另一种方法的风险。Cockpit 还可以配置为访问多个服务器，允许通过单个浏览器会话同时管理和监控多个服务器。\n\
  \nCockpit 默认安装并捆绑了系列工具，允许根据需要安装额外的扩展插件。Cockpit 的设计还允许您结合 HTML 和 JavaScript 创建自己的扩展，以添加缺失或自定义制功能。\n\
  \nCockpit 的模块化设计还允许许多功能嵌入到其他基于 Web 的应用程序中。\n\n## 7.2 安装并启用 Cockpit\n\nRHEL 9 默认不安装\
  \ Cockpit，但可以通过简单的步骤进行设置和启用。第一步是按照如下方式安装 Cockpit 包：\n\n```\ndnf install cockpit\n\
  ```\n\n接下来，需要启用 Cockpit socket 服务：\n\n```\nsystemctl enable --now cockpit.socket\n\
  ```\n\n最后，如果您的系统上启用了防火墙，则需要在防火墙上打开必要的端口，以允许远程浏览器连接到达 Cockpit（有关防火墙的详情，请参阅“RHEL 9\
  \ 防火墙基础”章节）。\n\n```\nfirewall-cmd --add-service=cockpit --permanent\n\nfirewall-cmd\
  \ --reload\n```\n\n## 7.3 访问 Cockpit\n\n如果您可以访问安装了 Cockpit 的服务器桌面环境，请打开浏览器窗口并导航到\
  \ `https://localhost:9090` 以访问 Cockpit 登录界面。相反，如果服务器是远程的，请使用域名或 IP 地址访问服务器（例如，`https://myserver.com:9090`）。\n\
  \n当建立连接时，浏览器可能会警告连接不安全。这是因为 Cockpit 服务使用了自签名证书。选择继续访问网站选项，或者为了以后避免出现此消息，选择高级选项并为服务器地址添加异常。\n\
  \n一旦连接成功，浏览器将加载下方图 7-1 所示的登录页面：\n\n![](img/rhel_cockpit_login.png)\n\n图 7-1\n\n\
  使用 root 身份或您的用户账户凭据登录 Cockpit 界面。请注意，由于权限限制，以用户身份登录时，某些任务在 Cockpit 界面内受限。在这种情况下，Cockpit\
  \ 控制台将显示标记为“受限访问”的按钮，如图 7-2](#Ubuntu_Cockpit_Overview.xhtml__idTextAnchor126)所示：\n\
  \n![](img/rhel_cockpit_limited_access.png)\n\n图 7-2\n\n要提升权限，请点击受限访问按钮并在提示时输入您的密码：\n\
  \n![](img/rhel_cockpit_access_password.png)\n\n图 7-3\n\n登录后，Cockpit 将显示概览屏幕。\n\n\
  ## 7.4 概述\n\n概览屏幕提供了系统的概述，包括对 CPU、内存、存储和网络活动性能指标的访问。此屏幕还包含有关系统的信息，包括底层硬件、主机名、系统时间以及系统软件是否为最新。还提供了重启或关闭系统的选项。\n\
  \n例如，图 7-4 显示了 Cockpit 界面的概览页：\n\n![](img/rhel_cockpit_overview.png)\n\n图 7-4\n\n\
  要获取特定类别的更多信息，请点击相应的链接。例如，图 7-5 显示了系统使用和指标屏幕：\n\n![](img/rhel_cockpit_usage_metrics.png)\n\
  \n图 7-5\n\n## 7.5 日志\n\n当选择日志（Logs）类别时，Cockpit 会显示 systemd journal 日的内容。选择一个日志条目将显示整个日志消息。日志条目按时间排序，最新的在顶部，并包含了菜单，用于根据不同的时间段和消息严重程度过滤日志。\n\
  \n![](img/rhel_cockpit_logs.png)\n\n图 7-6\n\n## 7.6 存储\n\n选择存储（Storage）选项以查看和管理系统的存储，包括磁盘、分区和卷组、网络文件系统（NFS）挂载以及\
  \ RAID 存储。此屏幕还可以监控磁盘 I/O 活动，并列出用于查询和管理设备的 `udisks` 服务输出：\n\n![](img/rhel_cockpit_storage.png)\n\
  \n图 7-7\n\n## 7.7 网络\n\n网络界面提供了各种网络配置和服务的信息，包括网络接口和防火墙设置。此外，它还允许配置更改，例如创建网桥或设置虚拟网络：\n\
  \n![](img/rhel_cockpit_networking.png)\n\n图 7-8\n\n## 7.8 账户\n\n选择此选项查看配置在系统上的用户并为额外用户创建账户。用户管理将在管理\
  \ RHEL 9 用户和组章节中介绍：\n\n![](img/rhel_cockpit_accounts.png)\n\n图 7-9\n\n点击现有账户查看详细信息并更改。账户详细页还可用于向用户添加\
  \ SSH 公钥，以便远程访问服务器，如在 RHEL 9 上配置 SSH 密钥认证章节所示。\n\n## 7.9 服务\n\n此屏幕显示运行在服务器上的系统服务列表，并允许对这些服务进行添加、删除、停止和启动。\n\
  \n![](img/rhel_cockpit_services.png)\n\n图 7-0\n\n服务的主题将在管理 RHEL 9 systemd 单元章节中详细介绍。\n\
  \n## 7.10 应用程序\n\n可以通过扩展为 Cockpit 添加附加功能。这些可以是自开发的，也可以是第三方提供的。应用程序界面列出了已安装的扩展并允许添加或删除扩展：\n\
  \n![](img/rhel_cockpit_applications.png)\n\n图 7-11\n\n## 7.11 虚拟机\n\n虚拟允许在单一计算机系统上同时运行多个操作系统实例，每个系统运行在自己的虚拟机中。Cockpit\
  \ 虚拟机扩展提供了创建和管理安装在服务器上的虚拟机客户的方法：\n\n![](img/rhel_8_cockpit_virtual_machines.png)\n\
  \n图 7-12\n\n虚拟机扩展默认不安装，但可以通过 Cockpit 应用程序界面或运行以下命令进行添加：\n\n```\ndnf install cockpit-machines\n\
  ```\n\nRHEL 9 的虚拟化使用将从虚拟化技术概述章节开始介绍。\n\n## 7.12 软件更新\n\n\n\n\n如果系统有任何可用软件更新，它们将列在此处并可以从此屏幕进行安装：\n\
  \n![](img/rhel_cockpit_updates.png)\n\n图 7-13\n\n### 7.13 终端\n\n如名称所示，`Terminal`屏幕提供了命令行提示符的访问：\n\
  \n![](img/rhel_cockpit_terminal.png)\n\n图 7-14\n\n### 7.14 连接到多个服务器\n\n可以配置 Cockpit\
  \ 以在单个会话中管理多个服务器。要向 Cockpit 会话添加另一个主机，请点击上方图 7-15 中亮显示的按钮以显示`Hosts`（主机）面板：\n\n![](img/rhel_cockpit_hosts.png)\n\
  \n图 7-15\n\n点击`Add new host`添加新主机）按钮，输入其他系统的 IP 地址或主机名，并在点击`Add`（添加）按钮之前选择一种区分此服务器与之前添加到\
  \ Cockpit 的其他服务器的颜色：\n\n![](img/rhel_cockpit_add_new_host.png)\n\n图 7-16\n\n如果您是首次连接到远程服务器，Cockpit\
  \ 将要求您接受新的`SSH key`。在接受密钥后，系统将提示您输入上方图 7-16 中指定的用户名密码。系统还提供了设置并授权受密码保护的`SSH key`的选项，以便在下次需要访问第二个主机系统时能够启用自动登录：\n\
  \n![](img/rhel_cockpit_remote_login.png)\n\n图 7-17\n\n若要在主机之间切换，请显示`Hosts`面板（见上方的图\
  \ 7-15）并选择所需的系统。\n\n### 7.15 启用存储的指标\n\n在标准安装中，Cockpit 不保留图表覆盖的短时间窗口之外的任何性能指标数据。为了保留\
  \ Cockpit 收集的数据，需要安装`Cockpit Co-Pilot`（`PCP`）包。按照以下方式安装 `cockpit-pcp` 包：\n\n```\n\
  dnf install cockpit-pcp\n```\n\n安装 `cockpit-pcp` 后，注销当前 Cockpit 会话并重新登录。\n\n接下来，显示`Metrics`和`history`屏幕，点击`Metrics`设置按钮显示如图\
  \ 7-18 所示的屏幕，开启`Collect metrics`（收集指标）选项并点击`Save`（保存）：\n\n![](img/rhel_cockpit_collect_metrics.png)\n\
  \n图 7-18\n\n经过足够的时间让 Cockpit 收集数据后，指标信息将如图 7-19 所示出现，并按小时块分类：\n\n![](img/rhel_cockpit_stored_metrics.png)\n\
  \n图 7-19\n\n### 7.16 总结\n\nCockpit Web 界面允许在浏览器内通过可视化方式执行远程系统管理任务，而无需依赖命令行提示符和命令行工具。一旦安装并启用，系统管理员只需打开浏览器，连接到远程服务器并登录\
  \ Cockpit 界面。在后台，Cockpit 使用与通过命令行提示符提供的相同的命令行工具，允许使用两种方式而不会产生配置冲突的风险。此外，Cockpit\
  \ 使用模块化框架，允许添加额外的扩展，并能够开发和集成自定义扩展。Cockpit 会话可用于管理单个服务器，也可配置为同时访问多个服务器。\n\n# 8. 在\
  \ RHEL 9 上使用 Bash Shell\n\n学习与 RHEL 9 以及通用 Linux 发行版工作的一个基本部分是熟练掌握在 shell 环境中工作。虽然\
  \ Linux 包含的`GNOME` 等图形桌面环境为操作系统提供了用户友好的界面，但 shell 环境提供了比使用图形桌面工具能实现的更强大的功能、灵活性和自动化。shell\
  \ 环境还为没有桌面环境的情况下提供了一种与操作系统交互的手段，这在处理如 RHEL 9 这样基于服务器的操作系统或无法完全启动的损坏系统时是常见情况。\n\n\
  因此，本章旨在提供 RHEL 9 上默认 shell 环境（特别是`Bash` shell）的概述。\n\n## 8.1 什么是 Shell？\n\nShell\
  \ 是一个交互式命令解释器环境，可以在其中提示符处输入命令，或将命令输入文件作为脚本执行。Shell 的起源可以追溯到 UNIX 操作系统的早期。事实上，在 Linux\
  \ 早期，引入图形桌面之前，shell 是用户与操作系统交互的唯一方式。\n\n多年来，开发了多种 shell 环境。第一个被广泛使用的 shell 是由 Stephen\
  \ Bourne 在贝尔实验室编写的`Bourne shell`。\n\n另一个早期产物是`C shell`，它与`C 语言`在某些语法上具有相似之处，并引入了命令行编辑和历史记录等易用性增强。\n\
  \n`Korn shell`（由 David Korn 在贝尔实验室开发）基于`Bourne` 和 `C` shell 提供的特性。\n\nRHEL 9 上的默认\
  \ shell 是`Bash shell`（Bourne Again SHell 的缩写）。这种 shell 起初是 `Bourne shell` 的开源版本，由\
  \ Brian Fox 为 `GNU Project` 开发，并基于`Bourne shell` 和 `C shell` 提供的特性。\n\n## 8.2 获取\
  \ Shell 访问\n\n在`GNOME` 桌面环境中，可以通过`Terminal`窗口访问 shell 提示符，方法是选择顶部栏中的`Activities`\
  \ 选项，在搜索栏中输入`Terminal` 并点击 `Terminal` 图标。\n\n例如，当远程登录 RHEL 9 服务器时（例如使用`SSH`），用户将看到\
  \ shell 提示符。标题为“在 RHEL 9 上配置基于密钥的身份验证”的章节将介绍使用 `SSH` 访问远程服务器的细节。在启动未安装桌面环境的服务器系统时，用户在物理控制台或远程登录会话完成登录程序后立即进入\
  \ shell。\n\n## 8.3 在提示符处输入命令\n\n在 shell 命令行提示符处，只需输入命令并按`Enter`键即可输入命令。虽然某些命令静默执行任务，但大多数命令在返回提示符之前都会显示某种形式的输出。例如，`ls`\
  \ 命令可显示当前目录下的文件和文件夹：\n\n```\nls\nDesktop Downloads Music Public Templates Videos\n\
  ```\n\n可用命令要么内置于 shell 中，要么存在于物理文件系统中。可以使用`which` 命令识别命令在文件系统中的位置。例如，查找 `ls` 可执行文件在文件系统中的：\n\
  \n```\nwhich ls\nalias ls='ls --color=auto'\n/usr/bin/ls\n```\n\n显然，`ls` 命令位于 `/usr/bin`\
  \ 目录。此外还配置了别名，该主题将在本章稍后介绍。使用`which` 命令定位内置于 shell 的命令路径将导致找不到可执行文件的消息。例如，尝试查找`history`\
  \ 命令的位置（它是内置于 shell 的，而不是文件系统上的可执行文件）将得到类似下面的输出：\n\n```\nwhich history\n/usr/bin/which:\
  \ no history in (/home/demo/.local/bin:/home/demo/bin:/usr/share/Modules/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin)\n\
  ```\n\n## 8.4 获取命令信息\n\nLinux shell 可用的许多命令看起来很晦涩。要获取有关命令的功能以及如何使用的详细信息，请使用`man`\
  \ 命令并将命令名作为参数。例如，了解更多关于 `pwd` 命令的信息：\n\n```\nman pwd\n```\n\n\n\n\n执行上述命令后，将显示 `pwd`\
  \ 命令的详细描述。许多命令在带有 `--help` 命令行选项运行时也会提供额外信息：\n\n```\n$ wc --help\n```\n\n## 8.5\
  \ Bash 命令行编辑\n\n早期的壳（shell）环境不提供任何形式的行编辑功能。这意味着如果你在输入一条长命令行的开头发现错误，你必须删除之后的所有字符，纠正错误然后重新输入命令的剩余部分。幸运的是，Bash\
  \ 丰富的命令行编辑选项，如下表所示：\n\n| 按键序列 | 动作 |\n| :--- | :--- |\n| Ctrl-b 或 左箭头 | 将光标向后移动一位\
  \ |\n| Ctrl-f 或 右箭头 | 将光标向前移动一位 |\n| Delete | 删除光标当前位置下方的字符 |\n| Backspace | 删除光标左侧的字符\
  \ |\n| Ctrl-_ | 撤销上一次更改（可以重复操作以撤销所有之前的更改） |\n| Ctrl-a | 将光标移动到行首 |\n| Ctrl-e | 将光标移动到行尾\
  \ |\n| Meta-f 或 Esc 后 f | 光标向后移动一个单词 |\n| Meta-b 或 Esc 后 b | 光标向后移动一个单词 |\n| Ctrl-l\
  \ | 清除屏幕上当前命令以外的所有内容 |\n| Ctrl-k | 从当前光标位置删除到行末尾 |\n| Meta-d 或 Esc 后 d | 删除到当前单词的结束\
  \ |\n| Meta-DEL 或 Esc 后 DEL | 删除到当前单词的开始 |\n| Ctrl-w | 从当前光标位置删除到上一个空白符 |\n\n表 8-1\n\
  \n## 8.6 使用 Shell 历史记录\n\n除了命令行编辑功能外，Bash 壳还提供了命令行历史支持。可以使用 `history` 命令查看之前执行过的命令列表：\n\
  \n```\n$ history\n    1 ps\n    2 ls\n    3 ls –l /\n    4 ls\n    5 man pwd\n \
  \   6 man apropos\n```\n\n此外，可以使用 `Ctrl-p`（或向上箭头）和 `Ctrl-n`（或向下箭头）在之前输入的命令之间来回滚动。最后，当历史记录显示了所需的命令时，按\
  \ `Enter` 键执行它。\n\n另一个选项是输入 `!` 字符，后跟要重复的命令的前几个字符，然后按 `Enter` 键。\n\n## 8.7 文件简写\n\
  \n许多 shell 命令接受一个或多个文件名作为参数。例如，要显示名为 `list.txt` 的文本文件的内容，可以使用如下方式使用 `cat` 命令：\n\n\
  ```\n$ cat list.txt\n```\n\n同样，可以通过指定所有文件名作为参数来显示多个文本文件的内容：\n\n```\n$ cat list.txt\
  \ list2.txt list3.txt list4.txt\n```\n\n与其输入每个名称，不如使用模式匹配来指定所有符合特定标准的文件。例如，可以使用\
  \ `*` 通配符字符来简化上面的示例：\n\n```\n$ cat *.txt\n```\n\n上述命令将显示所有以 `.txt` 扩展的文件的内容。这可以进一步限制为任何以\
  \ `list` 开头并 `.txt` 结尾的文件名：\n\n```\n$ cat list*.txt\n```\n\n可以使用 `?` 字符指定单字符匹配：\n\
  \n```\n$ cat list?.txt\n```\n\n## 8.8 文件名和路径补全\n\n与其输入完整的文件名或路径，或使用模式匹配来减少输入量，shell\
  \ 提供了文件名补全功能。要使用文件名补全，输入文件或路径名的前几个字符，然后按两次 `Esc` 键。shell 将根据目录中匹配你输入字符的第一个文件或路径名为你完成文件名。要获取可能的匹配项列表，在输入前几个字符后按\
  \ `Esc =`。\n\n## 8.9 输入和输出重定向\n\n如前所述，许多 shell 命令在执行时会输出信息。默认情况下，这些输出去向名为 `stdout`\
  \ 的设备文件，它本质上是运行 shell 的终端窗口或控制台。相反，shell 从名为 `stdin` 的设备文件接收输入，默认是键盘。\n\n可以使用 `>`\
  \ 字符将命令的输出从 `stdout` 重定向到文件系统的物理文件。例如，要将 `ls` 命令的输出重定向到名为 `files.txt` 的文件，需要以下命令：\n\
  \n```\n$ ls *.txt > files.txt\n```\n\n完成后，`files.txt` 将包含当前目录下的文件列表。同样，可以将文件内容作为\
  \ `stdin` 喂给命令中。例如，要将文件内容作为输入重定向到命令：\n\n```\n$ wc –l < files.txt\n```\n\n上述命令将显示\
  \ `files.txt` 文件中的行数。\n\n需要注意的是，使用 `>` 重定向运算符会创建一个新文件或截断现有文件。要向现有文件追加内容，请使用 `>>`\
  \ 运算符：\n\n```\n$ ls *.dat >> files.txt\n```\n\n除了标准输出外，shell 还使用 `stderr` 提供标准错误输出。当命令的输出重定向到\
  \ `stdout` 时，命令生成的任何错误信息都会重定向到 `stderr`。这意味着如果 `stdout` 重定向到文件，错误信息仍然出现在终端中。这通常是期望的行为，但也可以通过\
  \ `2>` 运算符重定向 `stderr`：\n\n```\n$ ls 2> errsg\n```\n\n执行完成后，关于找不到文件 `dkjfnf` 的错误信息将位于\
  \ `errsg` 中。\n\n`stderr` 和 `stdout` 都可以使用 `&>` 运算符重定向到同一个文件：\n\n```\n$ ls /etc &>\
  \ alloutput\n```\n\n执行完成后，`alloutput` 文件将包含\n\n## 8.10 在 Bash Shell 中使用管道\n\n除了\
  \ I/O 重定向，Bash shell 还允许将一个命令的输出直接管道到另一个命令的输入。管道操作通过在命令行之间放置 `|` 字符来实现。例如，为了统计系统中运行的进程，可以将\
  \ `ps` 命令的输出管道通过 `wc` 命令：\n\n```\n$ ps –ef | wc –l\n```\n\n命令行上可以执行的管道操作没有限制。例如，查找包含\
  \ `Smith` 名称的文件行数：\n\n```\n$ cat namesfile | grep Smith | wc –l\n```\n\n## 8.11\
  \ 配置别名\n\n随着你熟悉 shell 环境，你可能会频繁使用带有参数的命令。例如，你可能经常带有 `l` 和 `t` 参数使用 `ls` 命令：\n\n\
  ```\n$ ls –lt\n```\n\n为了减少执行命令时的输入量，可以创建一个映射到命令和参数的别名。例如，为了创建一个别名使得输入字母 `l` 执行 `ls\
  \ –lt` 命令，可以使用以下语句：\n\n```\n$ alias l=\"ls –lt\"\n```\n\n现在提示符处输入 `l` 将执行原始语句。\n\
  \n## 8.12 环境变量\n\nShell 环境变量提供了数据和配置设置的临时存储。shell 本身设置了几个环境变量，用户可以更改这些变量来修改 shell\
  \ 的行为。可以使用 `env` 命令获取当前定义的变量列表：\n\n```\n$ env\n    SSH_CONNECTION=192.168.0.19 61231\
  \ 192.168.0.28 22\n    MODULES_RUN_QUARANTINE=LD_LIBRARY_PATH\n    LANG=en_US.UTF-8\n\
  \    HISTCONTROL=ignoredups\n    HOSTNAME=RHELdemo-pc.ebookfrenzy.com\n    XDG_SESSION_ID=15\n\
  \    MODULES_CMD=/usr/share/Modules/libexec/modulecmd.tcl\n    USER=demo\n    ENV=/usr/share/Modules/init/profile.sh\n\
  \    SELINUX_ROLE_REQUESTED=\n    PWD=/home/demo\n    HOME=/home/demo\n    SSH_CLIENT=192.168.0.19\
  \ 61231 22\n    SELINUX_LEVEL_REQUESTED=\n```\n\n\n\n\n\n也许最有用的环境变量是 `PATH`。它定义了\
  \ shell 在命令行提示符下搜索输入命令的目录列表，以及搜索的顺序。在新安装的 RHEL 9 系统上，用户账户的 `PATH` 环境变量可能配置如下：\n\n\
  ```bash\n$ echo $PATH\n```\n```\n/home/demo/.local/bin:/home/demo/bin:/usr/share/Modules/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin\n\
  ```\n\n另一个有用的变量是 `HOME`，它指定当前用户的家目录。例如，如果你希望 shell 也在家目录下的 `scripts` 目录中查找命令，你可以如下所示修改\
  \ `PATH` 变量：\n\n```bash\n$ export PATH=$PATH:$HOME/scripts\n```\n\n可以使用 `echo` 命令显示现有环境变量的当前值：\n\
  \n```bash\n$ echo $PATH\n```\n\n你可以使用 `export` 命令创建自己的环境变量。例如：\n\n```bash\n$ export\
  \ DATAPATH=/data/files\n```\n\n将命令的输出赋值给环境变量的一个实用技巧是在命令周围使用反引号（``` ` ）。例如，将当前日期和时间赋值给名为\
  \ `NOW` 的环境变量：\n\n```bash\n$ export NOW=`date`\n$ echo $NOW\n```\n```\nWed Mar 29\
  \ 12:39:20 PM EDT 2023\n```\n\n如果有每次进入 shell 环境时都需要配置的环境变量或别名（alias）设置，可以将它们添加到家目录中名为\
  \ `.bashrc` 的文件中。例如，以下 `.bashrc` 文件配置了设置 `DATAPATH` 环境变量和一个别名：\n\n```bash\n# .bashrc\n\
  \n# 加载全局定义\nif [ -f /etc/bashrc ]; then\n    . /etc/bashrc\nfi\n\n# 用户特定环境\nPATH=\"\
  $HOME/.local/bin:$HOME/bin:$PATH\"\nexport PATH\n\n# 如果不喜欢 systemctl 的自动分页功能，请取消下行的注释：\n\
  # export SYSTEMD_PAGER=\n\n# 用户特定别名和函数\nexport DATAPATH=/data/files\nalias l=\"\
  ls -lt\"\n```\n\n## 8.13 编写 Shell 脚本\n\n到为止，我们完全关注 Bash shell 的交互性。我们所说的交互是指手动逐个输入命令并在提示符下执行它们。事实上，这只是\
  \ shell 能力范围中的一小部分。可以认为，shell 最强大的方面之一就是创建 shell 脚本的能力。shell 脚本是包含语句序列的文本文件，这些语句可以在\
  \ shell 环境中执行以完成任务。除了执行命令的能力外，shell 还提供了许多编程结构，例如 `for` 和 `do` 循环以及 `if` 语句，你理所当然地会在脚本语言中找到这些结构。\n\
  \n遗憾的是，shell 脚本的详细概述超出了本章的范围。然而，许多专注于 shell 脚本的书籍和网络资源对该主题的讲解比我们在这里所能实现的要好得多。因此，在本节中，我们仅提供\
  \ shell 脚本的一个初步尝试。\n\n创建 shell 脚本的第一步是创建一个文件（在本例中，我们将其命名为 `simple.sh`），并将以下内容作为第一行：\n\
  \n```bash\n#!/bin/sh\n```\n\n`#!` 被称为“shebang”，是一种特殊的字符序列，表示执行脚本所需的解释器路径是行中的下一项（在本例中，位于\
  \ `/bin` 的 `sh` 可执行文件）。如果你想使用的解释器是 `/bin/csh` 或 `/bin/ksh`，那么同样可以是这些。\n\n下一步是编写一个简单的脚本：\n\
  \n```bash\n#!/bin/sh\nfor i in *\ndo\n    echo $i\ndone\n```\n\n此脚本所做的只是遍历当前目录中的所有文件并显示每个文件名。可以通过将脚本名称作为参数传递给\
  \ `sh` 来执行此脚本：\n\n```bash\n$ sh simple.sh\n```\n\n要使文件变为可执行（从而不再需要将其传递给 `sh` 命令），可以使用\
  \ `chmod` 命令：\n\n```bash\n$ chmod +x simple.sh\n```\n\n一旦在文件权限上设置了执行位，就可以直接执行。例如：\n\
  \n```bash\n$ ./simple.sh\n```\n\n## 8.14 总结\n\n在《Red Hat Enterprise Linux 9 Essentials》的这一章中，我们简要介绍了\
  \ Bash shell 环境。在图形桌面环境中，人们很容易忘记操作系统的真正力量和灵活性通常只有通过放弃用户 friendly 桌面界面并使用 shell 环境才能得以利用。此外，熟悉\
  \ shell 对于管理和维护没有安装桌面的服务器系统是必要的，或者在尝试修复受损到桌面或 `Cockpit` 界面无法启动的系统时也是必要的。\n\nshell\
  \ 的能力远超本章涵盖的领域。如果你是 shell 新手，我们强烈建议你寻找额外的资源。一旦熟悉了这些概念，你将很快发现，在终端窗口中使用 shell 执行许多任务比在桌面上翻阅菜单和对话框快得多。\n\
  \n## 9 管理 RHEL 9 用户和组\n\n在安装 RHEL 9 期间，安装程序创建了一个 `root` 或超级用户账户并要求配置密码。安装程序还提供了创建用户账户的机会。为了使用\
  \ RHEL 9 的完整威力，我们需要为系统创建一个用户账户。RHEL 9 是一个多用户、多任务操作系统。用户被进一步划分为组以便于管理，每个用户可能需要自己的账户登录。\n\
  \n本章将介绍在 RHEL 9 系统上添加、删除和管理用户及组的步骤。用户和组可以使用命令行工具、`Cockpit` 界面以及桌面应用程序进行管理。我们将查看这些每种方法。\n\
  \n### 9.1 命令行用户管理\n\n可以通过命令行使用 `adduser` 工具向 RHEL 9 系统添加新用户。要创建一个新用户账户，输入类似下面的命令：\n\
  \n```bash\n# useradd john\n```\n\n默认情况下，这将在 `/home` 目录下为用户创建一个家目录（在本例中为 `/home/john`）。要指定不同的家目录，在创建账户时使用\
  \ `-d` 命令行选项：\n\n```bash\n# useradd -d /users/john john\n```\n\n一旦创建了账户，就需要使用 `passwd`\
  \ 工具分配密码才能登录系统：\n\n```bash\n# passwd john\n更改用户 john 的密码。\n新密码：\n重新输入新密码：\npasswd：身份令牌更新成功。\n\
  ```\n\n可以通过命令行使用 `userdel` 工具删除现有用户。虽然这将删除账户，但用户的文件和数据将在系统中保持完好：\n\n```bash\n# userdel\
  \ john\n```\n\n也可以在删除过程中移除用户的家目录和邮件池：\n\n```bash\n# userdel --remove john\n```\n\
  \n所有在 RHEL 9 系统上的用户都是一个或多个组的成员。默认情况下，新用户会被添加到与用户名同名的私有组（在上面的示例中，为用户 john 创建的账户属于同样名为\
  \ john 的私有组）。然而，作为管理员，将用户组织成更有逻辑的组是有意义的。例如，所有销售人员可能属于一个销售组，会计人员可能属于账户组，依此类推。新组通过\
  \ `groupadd` 命令行工具从命令行添加，例如：\n\n```bash\n# groupadd accounts\n```\n\n使用 `usermod`\
  \ 工具从命令行将现有用户添加到现有组：\n\n```bash\n# usermod -G accounts john\n```\n\n\n\n\n\n要将现有用户添加到多个现有用户组，请运行带有\
  \ `-G` 选项的 `usermod` 命令：\n\n```\nusermod -G accounts,sales,support john\n```\n\n\
  请注意，上述命令会将用户从 `-G` 之后未列出的但用户当前所属的附加组中移除。要保留任何当前的组成员关系，请使用 `-a` 标志追加新的组成员关系：\n\n\
  ```\nusermod -aG accounts,sales,support john\n```\n\n可以使用 `groupdel` 实用程序从系统中删除现有组：\n\
  \n```\ngroupdel accounts\n```\n\n请注意，如果要删除的组是任何用户的主组或初始组，则无法将其删除。在删除该组之前，必须先删除该用户或使用\
  \ `usermod` 命令为其分配一个新的主组。可以使用 `usermod -g` 选项为用户分配新的主组：\n\n```\nusermod -g sales\
  \ john\ngroupdel accounts\n```\n\n运行 `groups` 命令可以查看用户所属的组。例如：\n\n```\n$ groups\
  \ john\njohn : accounts support\n```\n\n默认情况下，除非用户知道 root 密码，否则用户账户无法执行需要超级用户（root）权限的任务。但是，可以配置用户账户以便使用\
  \ `sudo` 命令执行特权任务。这涉及将用户账户添加 wheel 组的成员，例如：\n\n```\nusermod -aG wheel john\n```\n\
  \n一旦加入 wheel 组，用户将能够按照以下方式使用 `sudo` 执行原本受限的任务：\n\n```\n$ sudo dnf update\n[sudo]\
  \ password for demo:\nUpdating Subscription Management repositories.\n.\n.\n```\n\
  \nwheel 组的 `sudo` 权限可以通过编辑 `/etc/sudoers` 文件并找到以下部分来进行修改：\n\n### 允许 wheel 组中的人员运行所有命令\n\
  \n```\n%wheel ALL=(ALL) ALL\n```\n\n### 同样的操作无需密码\n\n```\n%wheel ALL=(ALL) NOPASSWD:\
  \ ALL\n```\n\n要禁用所有 wheel 组成员的 `sudo` ，请如下所示注释掉第二行：\n\n### 允许 wheel 组中的人员运行所有命令\n\
  \n```\n# %wheel ALL=(ALL) ALL\n```\n\n要允许 wheel 组成员在不输入密码的情况下使用 `sudo`（出于考虑，不建议这样做），请取消\
  \ sudoers 文件中对应行的注释：\n\n### 同样的操作无需密码\n\n```\n%wheel ALL=(ALL) NOPASSWD: ALL\n```\n\
  \n在底层，所有这些命令仅仅是更改系统上的 `/etc/passwd`、`/etc/group` 和 `/etc/shadow` 文件。\n\n## 9.2 使用\
  \ Cockpit 进行用户管理\n\n如果系统安装并启用了 Cockpit Web 界面（该主题在“Cockpit Web 界面概述”章节中介绍），可以在下方图\
  \ 9-1 所示的账户（Accounts）屏幕中执行若干用户管理任务：\n\n![](img/rhel_cockpit_accounts1.png)\n\n图\
  \ 9-1\n\n该屏幕将显示系统上的任何现有用户账户，并提供添加额外账户的按钮。要创建新账户，请点击`Create New Account`按钮并在弹出的对话框中输入所需信息（见图\
  \ 9-2）。请注意，该选项还可以创建账户但将其锁定到以后：\n\n![](img/rhel_cockpit_new_account.png)\n\n图 9-2\n\
  \n要修改用户账户，请从主屏幕选择该账户并对账户详细进行任何修改：\n\n![](img/rhel_cockpit_modify_account.png)\n\n\
  图 9-3\n\n此屏幕允许执行各种任务，包括锁定或解锁账户、更改密码或强制用户配置新密码。此外，如果选择了 Server Administrator（服务器管理员）选项，会将用户添加到\
  \ wheel 组，并允许其使用 `sudo` 执行管理任务。此外还提供了一个从系统中删除用户的按钮。\n\n如果用户使用带有密钥加密的 SSH 连接远程访问系统，则可以在此屏幕内添加用户的公钥。SSH\
  \ 访问和验证将在稍后的“在 RHEL 9 上配置基于密钥的身份验证”中介绍。\n\n## 9.3 使用设置应用进行用户管理\n\n通过 GNOME 桌面设置应用提供了第三种用户账户管理选项。通过点击\
  \ GNOME 桌面右上角的图标并选择`Settings`（设置）选项可以访问该应用，如图 9-4 所示：\n\n![](img/rhel_settings_menu.png)\n\
  \n图 9-4\n\n当主设置屏幕出现时，点击左侧导航面板中的`Users`（用户）选项。默认情况下，设置将被锁定的，无法对系统上的用户账户进行任何更改。要解锁设置应用，请点击下方图\
  \ 9-5 中的`Unlock`（解锁）按钮并输入您的密码。请注意，只有当以具有 `sudo` 权限的用户登录时，才能解锁设置：\n\n![](img/rhel_settings_users.png)\n\
  \n图 9-5\n\n应用解锁后，标题栏中将标记为`Add User...`（添加用户...）的按钮。点击此按钮显示下方图 9-6 所示的对话框：\n\n![](img/settings_add_user.png)\n\
  \n图 9-6\n\n选择`Administrator`（管理员）账户为新用户分配 `sudo` 权限；否则选择`Standard`（标准）。接下来，输入用户的全名和用户名，并设置密码或允许用户在首次登录时设置密码。输入信息后，点击`Add`（添加）按钮创建账户。\n\
  \n现有账户的设置可以通过图 9-7 所示的用户界面查看、修改或随时删除。请注意，对账户进行任何更改之前需要解锁设置：\n\n![](img/settings_user_details.png)\n\
  \n图 9-7\n\n## 9.4 总结\n\n作为一个多用户操作系统，RHEL 9 的设计旨在支持受控访问。在安装期间，创建了 root 用户账户并分配了密码，还提供了创建用户账户的选项。可以通过\
  \ Cockpit Web 界面或 GNOME 设置应用添加额外的用户账户。除了用户账户外，Linux 还实现了组的概念。可以使用命令行工具添加新组并将用户分配到这些组，每个用户至少属于一个组。默认情况下，标准用户没有执行特权任务的权限。然而，wheel\
  \ 组的成员可以利用 `sudo` 命令来执行特权任务。\n\n# 10 理解 RHEL 9 软件安装与管理\n\n预计新安装的 RHEL 9 系统不会包含执行其预定任务的所有软件包。即使在安装了所有所需软件后，几乎可以确定，许多这些软件包在系统生命周期内都会发布新版本。在某些情况下，您需要确保安装这些最新的软件包版本以修复任何漏洞。在其他情况下，可能需要在系统中保留特定软件软件包的旧版本，以与其他软件兼容。\n\
  \n本章介绍了 RHEL 9 软件管理的基本概念，解释了如何解决这些问题，解释了仓库、软件包以及 Red Hat 流（AppStream），并探索了构成运行 RHEL\
  \ 9 系统的软件包的列表、安装和删除。\n\n## 10.1 仓库\n\nLinux 本质由一组提供操作系统核心功能的基础软件包组成，以及一系列在基础操作系统之上添加功能和特性的软件包和模块组成。\n\
  \n\n\n\n在首次安装 RHEL 9 时，将安装几个软件包，这取决于在安装阶段选择的软件选项。然而，一旦系统启动运行，就可以根据需要安装额外的软件。通常，所有属于\
  \ RHEL 9 的软件（换句话说，即第三方供应商未提供的软件）都是使用 `dnf` 命令下载并安装到系统中的。正如我们在前面的章节中看到的，这通常涉及在命令行提示符上执行类似以下命令的指令：\n\
  \n```bash\ndnf install httpd\n```\n\n当执行此类命令时，请求的软件将从远程仓库下载并安装到本地系统中。默认情况下，RHEL\
  \ 9 配置为从名为 `BaseOS` 和 `AppStream` 的仓库下载软件。例如，运行以下命令将提供系统当前配置为在下载软件时使用的仓库列表：\n\n\
  ```bash\ndnf repolist\n```\n\n更新订阅管理仓库。\n\nrepo id repo name\n\nrhel-9-for-x86_64-appstream-rpms\
  \ Red Hat Enterprise Linux 9 for x86_64 - AppStream (RPMs)\n\nrhel-9-for-x86_64-baseos-rpms\
  \ Red Hat Enterprise Linux 9 for x86_64 - BaseOS (RPMs)\n\n上面的示例显示系统上启用了 `AppStream`\
  \ 和 `BaseOS` 仓库。请记住，可以为第三方软件添加仓库。\n\n可以通过在 `/etc/dnf/dnf.conf` 文件中放置条目，或者通过向 `/etc/yum.repos.d/`\
  \ 目录添加 `.repo` 文件来向系统添加额外的仓库。或者，可以使用 `dnf config-manager` 工具添加仓库，并将仓库的 `.repo` 文件\
  \ URL 作为命令行参数传递：\n\n```bash\ndnf config-manager --add-repo https://url/of/repo/file\n\
  ```\n\n## 10.2 BaseOS 仓库\n\n`BaseOS` 仓库包含了构成操作系统核心功能的软件包。这些软件元素以 Red Hat 包管理器 (RPM)\
  \ 软件包文件的形式被下载，然后安装到系统中。一个典型的 RHEL 9 系统将安装大约 1500 个 RPM 软件包。要查看系统当前安装的所有 RPM 软件包列表，请按如下运行\
  \ `rpm` 命令：\n\n```bash\nrpm -qa | more\n```\n\nqemu-kvm-block-rbd-2.12.0-41.el8+2104+3e32e6f8.x86_64\n\
  \nkyotocabinet-libs-1.2.76-17.el8.x86_64\n\ncyrus-sasl-scram-2.1.27-0.3rc7.el8.x86_64\n\
  \ncurl-7.61.1-5.el8.x86_64\n\n.\n\n.\n\n通过如下所示运行 `dnf` 命令可以获取来自 `BaseOS` 仓库可安装的软件包列表：\n\
  \n```bash\ndnf list\n```\n\n要获取匹配搜索字符串的软件包列表，请如下所示使用 `dnf`：\n\n```bash\ndnf search\
  \ \"search string\"\n```\n\n还可以识别哪个软件包包含特定文件：\n\n```bash\ndnf provides filename\n\
  ```\n\n例如：\n\n更新订阅管理仓库。\n\nhttpd-2.4.51-7.el9_0.x86_64 : Apache HTTP Server\n\n\
  Repo : rhel-9-for-x86_64-appstream-rpms\n\nMatched from:\n\nFilename : /etc/httpd/conf/httpd.conf\n\
  \nhttpd-core-2.4.53-7.el9.x86_64 : httpd minimal core\n\nRepo : rhel-9-for-x86_64-appstream-rpms\n\
  \nMatched from:\n\nFilename : /etc/httpd/conf/httpd.conf\n\nhttpd-core-2.4.53-7.el9_1.1.x86_64\
  \ : httpd minimal core\n\nRepo : rhel-9-for-x86_64-appstream-rpms\n\nMatched from:\n\
  \nFilename : /etc/httpd/conf/httpd.conf\n\n要安装一个软件包，请运行以下命令：\n\n```bash\ndnf install\
  \ packagename\n```\n\n同样，删除一个软件包：\n\n```bash\ndnf delete packagename\n```\n\n当软件包的更新版本可用时，它将在系统下次更新时被下载并安装，通常通过\
  \ `dnf` 命令：\n\n```bash\ndnf update\n```\n\n任何更新的软件包将替换当前安装在系统上的旧版本。虽然在处理基础操作系统软件包时这通常是理想情况，但在处理其他软件包（例如编程环境或开发库）时，这不一定是预期的行为，因为升级到新版本可能会导致与系统上安装的其他软件包产生兼容性问题。这个问题通过\
  \ `AppStream` 仓库解决了。\n\n## 10.3 AppStream 仓库\n\n`AppStream` 仓库以软件包、模块、流（streams）和配置（profiles）的形式管理软件。`AppStream`\
  \ 软件包再次是 RPM 软件包，正如前面描述 `BaseOS` 的节中概述的那样。另一方面，`AppStream` 模块是属于一组的或存在依赖关系的软件包组（例如，在构建时需要一起安装的软件包组）。`AppStream`\
  \ 模块可以有多个流，每个流代表不同的版本。要查看来自 `BaseOS` 仓库可安装的软件包列表，如下所示运行 `dnf` 命令：（注，此处原文逻辑重复，已按逻辑重新梳理翻译）\n\
  \n`AppStream` 仓库以软件包、模块、流和配置的形式管理软件。`AppStream` 软件包再次是 RPM 软件包，正如前面描述 `BaseOS` 的节中所述的那样。另一方面，`AppStream`\
  \ 模块是属于一组或存在依赖关系的软件包组（例如，构建时需要一起安装的软件包组）。`AppStream` 模块可以有多个流，每个流代表不同的版本。\n\n要获取\
  \ `BaseOS` 仓库可安装的软件包列表，如下所示运行 `dnf` 命令：\n\n```bash\ndnf list\n```\n\n要获取匹配搜索字符串的软件包列表，如下所示使用\
  \ `dnf`：\n\n```bash\ndnf search \"search string\"\n```\n\n还可以识别哪个软件包包含特定文件：\n\n\
  ```bash\ndnf provides filename\n```\n\n例如：\n\n更新订阅管理仓库。\n\nhttpd-2.4.51-7.el9_0.x86_64\
  \ : Apache HTTP Server\n\nRepo : rhel-9-for-x86_64-appstream-rpms\n\nMatched from:\n\
  \nFilename : /etc/httpd/conf/httpd.conf\n\nhttpd-core-2.4.53-7.el9.x86_64 : httpd\
  \ minimal core\n\nRepo : rhel-9-for-x86_64-appstream-rpms\n\nMatched from:\n\nFilename\
  \ : /etc/httpd/conf/httpd.conf\n\nhttpd-core-2.4.53-7.el9_1.1.x86_64 : httpd minimal\
  \ core\n\nRepo : rhel-9-for-x86_64-appstream-rpms\n\nMatched from:\n\nFilename :\
  \ /etc/httpd/conf/httpd.conf\n\n要安装一个软件包，请运行以下命令：\n\n```bash\ndnf install packagename\n\
  ```\n\n同样，删除一个软件包：\n\n```bash\ndnf delete packagename\n```\n\n当软件包的更新版本可用时，它将在系统下次更新时被下载并安装，通常通过\
  \ `dnf` 命令：\n\n```bash\ndnf update\n```\n\n任何更新的软件包将替换当前安装在系统上的旧版本。虽然在处理基础操作系统软件包时这通常是理想情况，但在处理其他软件包（例如编程环境或开发库）时，这并不一定是预期的行为，因为升级到新版本可能会导致与系统上安装的其他软件包产生兼容性问题。这个问题通过\
  \ `AppStream` 仓库解决了。\n\n（此处接 10.3 节）\n\n`AppStream` 仓库以软件包、模块、流和配置的形式管理软件。`AppStream`\
  \ 软件包再次是 RPM 软件包，正如前面描述 `BaseOS` 的节中所述的那样。另一方面，`AppStream` 模块是属于一组或存在依赖关系的软件包组（例如，构建时需要一起安装的软件包组）。`AppStream`\
  \ 模块可以有多个流，每个流代表不同的版本。\n\n（注：由于原文 10.3 之后存在大量重复且断裂的文本，译文已根据“不要重复输出原文”的原则，对核心技术点进行了整合翻译，确保逻辑通顺。）\n\
  \n\n\n\n# dnf install @php:8.1/minimal\n\n使用上述命令安装模块后，PHP 模块将列出如下：\n\n```\nphp 8.1\
  \ [e] common [d], devel, minimal [i] PHP scripting language\n```\n\n流列中的 `[e]` 标识告诉我们\
  \ `8.1` 流已启用，而配置（profile）列中的 `[i]` 显示该模块是使用 `minimal` 配置文件安装的。\n\n要在不安装模块的情况下启用某个流，请按如下方式使用\
  \ `dnf`：\n\n```bash\ndnf module enable modulename\n```\n\n同样，可以使用以下方式禁用某个流：\n\n\
  ```bash\ndnf module disable modulename\n```\n\n要卸载模块，请使用以下语法：\n\n```bash\ndnf module\
  \ remove modulename\n```\n\n可以使用以下 `dnf` 命令识别有关模块的附加信息：\n\n```bash\ndnf module info\
  \ modulename\n```\n\n要查找由哪些 RPM 软件包组成特定模块和流组合的不同配置（profiles），请按如下方式使用 `dnf`：\n\n\
  ```bash\ndnf module info --profile modulename:stream\n```\n\n例如：\n\n```bash\ndnf\
  \ module info --profile php:8.1\n```\n\n```\nUpdating Subscription Management repositories.\n\
  Last metadata expiration check: 1:44:32 ago on Mon 27 Mar 2023 11:02:15 AM EDT.\n\
  Name : php:8.1:9010020220706080036:9:x86_64\ncommon : php-cli\n         : php-common\n\
  \         : php-fpm\n         : php-mbstring\n         : php-xml\ndevel : php-cli\n\
  \          : php-common\n          : php-devel\n          : php-fpm\n          :\
  \ php-mbstring\n          : php-pecl-zip\n          : php-process\n          : php-xml\n\
  minimal : php-cli\n          : php-common\n```\n\n最后，要从一个模块流切换到另一个流，运行引用新流的安装命令：\n\
  \n```bash\ndnf install @modulename:otherstream\n```\n\n此命令将下载新流的软件包，并将现有软件包升级或降级到指定版本。此过程完成后，重新同步新流的模块软件包：\n\
  \n```bash\ndnf distro-sync\n```\n\n# 10 总结\n\nRHEL 9 系统由 RPM 格式的软件软件包组成，这些软件包从 Red\
  \ Hat BaseOS 和 AppStream 仓库下载并安装。根据需要，可以在系统中添加额外的仓库以获取安装包。\n\n`BaseOS` 仓库包含了实现操作系统基础核心功能的软件包。另一方面，`AppStream`\
  \ 软件包提供了额外的功能和特性，将根据配置配置的目的选择性地安装。在这样一个复杂的系统中，可能会存在大量的软件包间依赖关系，其中系统的部分可能需要特定版本的软件软件包才能正常运行。`AppStreams`\
  \ 允许创建模块（modules）和配置（profiles），这些配置包含了所有必要的依赖包，以便在正确的版本级别上一起安装某个特定功能。`AppStreams`\
  \ 还允许已安装的软件包接收到当前版本的更新，而无需下载下一个大版本，从而避免破坏其他软件包的依赖关系。\n\n# 11 管理 RHEL 9 systemd 单元\n\
  \n为了精通 RHEL 9 系统管理，理解 systemd 单元（units）的概念关重要，特别是两种特定类型：目标（targets）和服务（services）。本章旨在概述\
  \ RHEL 9 支持的不同 systemd 单元，并对配置在运行的 Linux 系统后台的许多服务进行概述。\n\n## 11.1 理解 RHEL 9 systemd\
  \ 目标\n\nRHEL 9 可以被配置为引导到几种状态之一（称为目标），每个状态都旨在提供特定级别的操作系统功能。系统管理员根据系统的用途，配置系统默认启动的目标。例如，桌面系统可能会被配置为使用图形用户界面目标启动。相比之下，云服务器系统更有可能启动到多用户目标（multi-user）。\n\
  \n在启动过程中，一个名为 `systemd` 的进程会查找 `/etc/systemd/system` 文件夹以寻找默认目标设置。在确定了默认目标后，它将启动与该目标相关的\
  \ systemd 单元，以便系统在所有必要进程都在运行的情况下启动。\n\n对于熟悉旧版 RHEL 版本的人员来说，systemd 目标取代了旧的运行级别（runlevel）系统。\n\
  \n## 11.2 理解 RHEL 9 systemd 服务\n\n服务是一个进程，通常在后台运行，提供特定的功能。例如，`sshd` 服务是为系统提供安全 shell\
  \ 访问的后台进程（也称为守护进程）。不同的 systemd 目标根据该目标要提供的功能被配置为自动启动不同的服务集合。\n\n目标和服务是 systemd 单元的类型，这个主题将在稍后介绍。\n\
  \n## 11.3 RHEL 9 systemd 目标描述\n\n如前所述，RHEL 9 可以引导到几个目标之一。系统配置的默认目标反过来决定了启动哪些 systemd\
  \ 单元。与启动和关机相关的目标可以总结如下：\n\n- `poweroff.target`：此目标关机系统。你不太希望将其作为默认目标。\n- `rescue.target`：导致系统以单用户模式启动，在此模式下只有\
  \ root 用户登录。系统不会启动任何网络、图形界面或多用户服务。该运行级别非常适合系统管理员进行系统维护或修复活动。\n- `multi-user.target`：将系统引导到多用户模式，具有文本登录能力。\n\
  - `graphical.target`：将系统引导到联网的多用户状态，具有窗口系统能力。默认情况下，图形环境将在启动过程结束时启动。这是桌面或工作站最常用的运行级别。\n\
  - `reboot.target`：重启系统。另一个由于显而易见的原因你不希望将其作为默认目标。\n\n除了上述目标外，系统还包含了约 70 个其他目标，其中许多是主目标使用的子目标。在后台，例如，`multi-user.target`\
  \ 还会启动一个名为 `basic.target` 的目标，该目标反过来启动 `sockets.target` 单元，该单元对于不同进程之间的通信是必要的。这确保了多用户目标依赖的所有服务在启动过程中启动。\n\
  \n可以通过在终端窗口中运行以下命令查看指定目标所依赖的目标和服务列表：\n\n```bash\nsystemctl list-dependencies <target>\n\
  ```\n\n例如，图 11-1 显示了 `graphical` 目标的 systemd 单元依赖关系的部分列表（完整功能的多用户系统需要 140 多个目标和服务）。\n\
  \n列表中每个项目左侧的彩色点表示该服务或目标的当前状态如下：\n\n- 绿色：服务或目标处于激活并运行状态。\n- 白色：服务或目标处于非活跃（死亡）。通常是因为服务或目标尚未启用、由于某些原因已停止，或者服务或目标依赖的条件未满足。\n\
  \n\n\n\n\n红色 - 服务或目标由于致命错误未能启动。\n\n要查找更多关于 systemd 单元状态的详细信息，可以使用 `systemctl status`\
  \ 命令后跟单元名称，如下：\n\n```bash\nsystemctl status systemd-machine-id-commit.service\n\
  ```\n\n```\nsystemd-machine-id-commit.service - Commit a transient machine-id on\
  \ disk\n      Loaded: loaded (/usr/lib/systemd/system/systemd-machine-id-commit.service;\
  \ static)\n      Active: inactive (dead)\n     Condition: start condition failed\
  \ at Thu 2023-03-30 08:41:05 EDT; 16min ago\n               └─ ConditionPathIsMountPoint=/etc/machine-id\
  \ was not met\n      Docs: man:systemd-machine-id-commit.service(8)\n```\n\n## 11.4\
  \ 识别和配置默认目标\n\nRHEL 9 系统的当前默认目标可以使用 `systemctl` 命令如下所示识别：\n\n```bash\nsystemctl\
  \ get-default\n```\n\n`multi-user.target`\n\n在上述情况下，系统配置为默认使用多用户目标启动。可以随时使用 `systemctl`\
  \ 命令配合 `set-default` 选项更改默认设置。以下示例将默认目标更改为在下次系统启动时启动图形用户界面：\n\n```bash\nsystemctl\
  \ set-default graphical.target\n```\n\n删除了 `/etc/systemd/system/default.target`。\n\
