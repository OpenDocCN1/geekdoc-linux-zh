  \ `podman run` 命令。在这种情况下，将指定 `--rm` 选项，表示我们要在容器中运行镜像、执行一个命令并让容器退出。在这种情况下，将使用 `cat`\
  \ 工具输出容器文件系统上的 `/etc/passwd` 文件内容：\n\n```bash\npodman run --rm registry.redhat.io/ubi9/ubi-init\
  \ cat /etc/passwd\n```\nroot:x:0:0:/root:/bin/bash\nbin:x:1:1:/bin:/sbin/nologin\n\
  daemon:x:2:2:/daemon:/sbin/nologin\nadm:x:3:4:/adm:/sbin/nologin\nlp:x:4:7:/var/spool/lp:/sbin/nologin\n\
  sync:x:5:0:/sync:/bin/sync\nshutdown:x:6:0:/shutdown:/sbin/shutdown\nhalt:x:7:0:/halt:/sbin/halt\n\
  \n\n\n\n[content]\n一旦按照你的要求配置了容器客体系统，你很可能想要创建并运行多个这种特定类型的容器。要实现这一点，需要将容器保存为镜像到本地存储中，以作为其他容器实例的基础。这通过使用\
  \ `podman commit` 命令结合容器的名称或 ID 以及存储该镜像的名称来实现，例如：\n\n```\npodman commit mycontainer\
  \ myrhel_image\n```\n\n镜像保存好后，检查它现在是否出现在本地存储库的镜像列表中：\n\n```bash\npodman images\n\
  ```\nREPOSITORY TAG IMAGE ID CREATED SIZE\nlocalhost/myrhel_image latest 4d207635db6c\
  \ 9 seconds ago 239 MB\nregistry.redhat.io/ubi9/ubi-init latest a4933472b168 6 weeks\
  \ ago 254 MB\n```\n\n现在可以使用保存的镜像来创建与原始容器相同的容器：\n\n```bash\npodman run --name=mycontainer2\
  \ -it localhost/myrhel_image /bin/bash\n```\n\n## 28. 从本地存储中删除镜像\n\n当镜像不再需要时，要从本地存储中删除，请运行\
  \ `podman rmi` 命令，引用 `podman images` 命令输出的镜像名称或 ID。例如，要删除上一节创建的名为 `myrhel_image`\
  \ 的镜像，请如下运行 `podman`：\n\n```bash\npodman rmi localhost/myrhel_image\n```\n\n在删除镜像之前，必须先删除基于该镜像的所有容器。\n\
  \n## 28.8 删除容器\n\n即使容器已经退出或停止，它仍然存在并可以随时重启。如果容器不再需要，可以在容器停止后使用 `podman rm` 命令按如下删除：\n\
  \n```bash\npodman rm mycontainer2\n```\n\n## 28.9 使用 Buildah 构建容器\n\nBuildah 允许从现有容器、镜像或完全从零开始构建新容器。Buildah\
  \ 还包含了挂载容器文件系统的功能，以便从宿主机上对其进行访问和修改。\n\n例如，以下 `buildah` 命令将从 RHEL 9 基础镜像构建容器（如果镜像尚未从存储库拉取，buildah\
  \ 将在创建容器之前下载它）：\n\n```bash\nbuildah from registry.redhat.io/ubi9/ubi-init\n```\n\
  \n运行此命令的结果将得到一个名为 `ubi-init-working-container` 的就绪运行的容器：\n\n```bash\nbuildah run\
  \ ubi-init-working-container cat /etc/passwd\n```\n\n## 28.10 从零构建容器\n\n从零构建容器会创建一个空容器。一旦创建，就可以安装软件包以满足容器的要求。在创建一个仅需要安装最软件包的容器时，这种方法非常有用。\n\
  \n从零开始构建的第一步是运行以下命令来构建空容器：\n\n```bash\nbuildah from scratch\n```\nworking-container\n\
  \n构建完成后，将创建一个名为 `working-container` 的新容器：\n\n```bash\nbuildah containers\n```\n\
  CONTAINER ID BUILDER IMAGE ID IMAGE NAME CONTAINER NAME\ndbed2be11730 * cb642e6a9917\
  \ registry.redhat.io/ubi9/ubi:latest dbed2be1173000c099ff29c96eae59aed297b82412b240a8ed29ecec4d39a8ba\n\
  17df816ea0bb * a4933472b168 registry.redhat.io/ubi9/ubi-init:latest ubi-init-working-container\n\
  65b424a31039 * scratch working-container\n\n空容器现在准备好安装一些软件包了。遗憾的是，这不能在容器内执行，因为甚至不存在\
  \ `bash` 或 `dnf` 工具。因此，需要将容器文件系统挂载到宿主机系统，并使用 `dnf` 安装软件包，并将系统根设置为挂载的容器文件系统。通过如下挂载容器的文件系统开始此过程：\n\
  \n```bash\nbuildah mount working-container\n```\n`/var/lib/containers/storage/overlay/20b46cf0e2994d1ecdc4487b89f93f6ccf41f72788da63866b6bf80984081d9a/merged`\n\
  \n如果文件系统挂载成功，`buildah` 将输出容器文件系统的挂载点。现在我们有了了容器文件系统的访问权限，可以使用 `dnf` 命令通过 `--installroot`\
  \ 选项指向挂载的容器文件系统向容器安装软件包。例如，以下命令在容器文件系统中安装 `bash`、`CoreUtils` 和 `dnf` 软件包（其中 `<container_fs_mount>`\
  \ 是之前 `buildah mount` 命令输出的挂载路径）：\n\n```bash\ndnf install --releasever=9.1 --installroot\
  \ <container_fs_mount> bash coreutils dnf\n```\n\n注意，`--releasever` 选项指示 `dnf` 在容器内安装\
  \ RHEL 9.1 的软件包。\n\n安装完成后，如下卸载文件系统：\n\n```bash\nbuildah umount working-container\n\
  ```\n\n一旦 `dnf` 完成安装，就可以运行容器并如下访问 `bash` 提示符：\n\n```bash\nbuildah run working-container\
  \ bash\n```\n-5.1## 28.11 容器桥接网络\n\n如上一节所述，容器网络通过容器网络接口 (CNI) 桥接栈实现。以下命令显示了宿主机上运行容器的典型配置：\n\
