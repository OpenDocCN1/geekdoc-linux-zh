    \ **Password for root（root 用户密码）** **User** 和 **Confirm Password（确认密码）** 字段中输入*novell*。\n\
    \n4. 选择 **Next** 继续。\n\n提示你密码过于简单。\n\n5. 选择 Yes 继续。\n\n提示你正在使用小写字母。\n\n6. 选择 Yes\
