    \nTo view the content of a system log file, do the following:\n\n- 1. Press cursor-down\
    \ until Miscellaneous is highlighted in the left frame and press Enter.\n- 2.\
    \ Press cursor-down until View System Log is highlighted in the right frame and\
    \ press Enter.\n- 3. Press cursor-down until /proc/version is selected and press\
    \ Enter.\n4. Press Tab twice to highlight OK and press Enter.\n\n### Part VI:\
    \ Exit YaST\n\nTo exit YaST, do the following:\n\n- 1. Press Alt+Q to select Quit.\n\
    - 2. Log out by entering exit\n- 3. Switch back to the graphical interface by\
    \ pressing Ctrl+Alt+F7.\n- 4. Close the YaST window.\n\n(End of Exercise)\n\n\
    ## Exercise 2-2 Install New Software\n\nIn this exercise, you install another\
    \ software package that is available on the SUSE Linux Enterprise Server 10 installation\
    \ media. It is called locate and it is needed in one of the following sections.\n\
    \nTo install new software, do the following:\n\n- Part I: Start YaST\n- Part II:\
    \ Look for a Software Package\n- Part III: Install a Software Package and Finish\n\
    \n### Part I: Start YaST\n\nTo start YaST, do the following:\n\n- 1. From the\
    \ GNOME desktop, open the main menu.\n2. Select More Applications.\n3. Enter ya\
    \ into the Filter text box.\n4. Select the YaST icon to start YaST.\n5. Enter\
    \ the root password novel in the appearing dialog; then select Continue or press\
    \ Enter.\n6. The YaST Control Center appears.\n\n### Part II: Look for a Software\
    \ Package\n\nTo look for a software package, do the following:\n\n- 1. From the\
    \ YaST Control Center, select Software > Software Management.\n2. From the Filter\
    \ drop-down list, select Search.\n3. In the Search textbox enter locate; select\
    \ Search.\n\n### Part III: Install a Software Package and Finish\n\nTo install\
    \ a software package and finish, do the following:\n\n- 1. From the right side\
    \ of the window, select the package findutitls-locate.\n- 2. Select Accept.\n\
    - 3. (Conditional) If requested, insert the SUSE Linux Enterprise Server 10 DVD;\
