    ## Part II: Partition Manually with fdisk


    To partition manually with fdisk, do the following:


    - 1. From the command line, start the utility fdisk on the first IDE hard disk
    on your server by entering fdisk /dev/hda (if your computer uses SATA or SCSI
    disks, enter fdisk /dev/sda). Depending on the number of cylinders on your disk
    a message is displayed that the number of cylinders is above 1024, which might
    cause problems under certain circumstances.

    - 2. View the current partition table in fdisk by entering p.


    Notice that there are 5 partitions (hda1, hda2, hda3, hda5 and hda6).


    - 3. Create a new 500MB Win95 FAT32 logical partition in the extended partition
    by doing the following:

    a. Create a new partition by entering n.

    b. Enter l (lower case L) for logical.

    c. Accept the default first cylinder by entering Enter.

    d. Indicate the partition size by entering +500M.

    e. Change the partition type to Win95 FAT32 by entering t (for type, the highest
    partition number from the range offered, and then b (for Win95/FAT32).

    f. Verify the new partition configuration by entering p.

    Notice that a new hda7 partition has been added to the table.


    - 4. Create 2 more logical partitions with the partition type of (the default)
    by doing the following:

    a. Create a new partition by entering n; enter l (lower case L); then accept the
    default first cylinder by entering Enter.

    b. Indicate the partition size by entering +1G.

    c. Create a new partition by entering n; enter l (lower case L); then accept the
    default first cylinder by entering Enter.

    d. Indicate the partition size by entering +2G.

    e. Verify the new partition configuration by entering p.

    Notice that 2 new partitions have been added to the partition table.


    - 5. Write the new partition table to your hard drive and exit fdisk by entering
    w.


    - 6. View the current partition table used by the kernel by entering:

    cat /proc/partitions


    - 7. To be able to access the new partitions, the kernel has to update its partition
    table stored in memory. Do one of the following:

    - Reboot the system by entering reboot.

    - Have the kernel update its partition table by entering partprobe.


    - 8. View again the partition table used by the kernel by entering: /proc/partitions


    ## Part III: Manage File Systems from the Command Line


    To manage file systems from the command line, do the following:


    - 1. From the GNOME desktop, open a terminal window; then su - to root (password
    novel).


    - a. Create a new FAT32 file system on /dev/sda7 and give it the label "data1"
    by entering the following (make sure you don''t have a typo when specifying the
    device in the command; there won''t be a warning message, the command is executed
    immediately):

    mkfs.msdos -n data1 /dev/sda7


    A message such as mkfs.msdos 2.11 (12 Mar 2005) confirms the file system creation.


    - b. Create a new ext2 file system on /dev/sda8 with verbose output by entering
    the following (make sure you don''t have a typo when specifying the device in
    the command; there won''t be a warning message, the command is executed immediately):

    mkfs -t ext2 -v /dev/sda8


    Notice that by adding the option -v, you received extensive information about
    the new file system.


    - c. Create a new Reiser file system on /dev/sda9 that is only 65 MB by entering
    the following:

    kreiserfs /dev/sda9


    ## Migrating from RedHat to SUSE


    - 3. Create the directories data1, data2 and data3 under /export.

    - 4. Verify that the directories were created by entering ls /export.

    - 5. As root, using your editor of choice, for instance vi, add the entries to:

    a. Open the file /fstab.

    b. At the end of fstab, add the following:

    ```

    /dev/sda7 fat defaults 0 0

    /dev/sda8 ext2 defaults 0 0

    /dev/sda9 reiserfs defaults 0 0

    ```

    (Note: The OCR text was garbled for fstab, the above is a reconstruction based
    on context).


    -c. When you finish, save /fstab by pressing :wq.

    - 6. View the partition table by entering:

    ```

    cat /proc/partitions

    ```

    - 7. Manage the file systems from the command line by entering mount -a.

