    \ Escape\n\n输入\n\n```\n:r -e \"secret\\n\" | grub-mdcrypt\n```\n并回车。\n\n文件中会出现\
    \ grub-mdcrypt 的输出，包括密码的 MD5 哈希。\n\n删除 grub-mdcrypt 输出中除哈希行。如果文件中还有 password secret\
