    \n执行以下操作：\n\n- 第一部分 - 编辑 /etc/postfix/main.cf\n- 第二部分 - 测试配置\n\n### 第一部分 - 编辑\
    \ /etc/postfix/main.cf\n\n1. 打开终端窗口并输入 su- 获取 root 权限。\n2. 在提示时，输入 root 密码 `novel`。\n\
    3. 通过输入 `rcpostfix stop` 停止 postfix 守护进程。\n4. 使用文本编辑器打开 /etc/postfix/main.cf。\n\
    5. 滚动到文件末尾设置。\n6. 为了仅从局域网接收邮件，编辑以下选项：\n\n- inet_interfaces = your_IP-Address,\
