    # Exercise 6-2 Use Postfix on the Internet


    In this exercise, you configure Postfix to send email to the Internet. Only email
    from the local network should be allowed to accepted; any email that is not addressed
    to one of the local domains should be rejected.


    Do the following:


    +   1. Open a terminal window and enter su- to get root permissions.

    2. When prompted, enter the root password novel.

    3. Stop the postfix daemon by entering

    ```rcpostfix stop```

    4. Open the file /etc/postfix/main.cf with your favorite text editor.

    5. To configure Postfix to accept email from the local network and email that
    is addressed to any recipient in the domain digitalairlines.com, edit or add the
    following options:

    - myhostname = hostname.digitalairlines.com

    - mydomain = digitalairlines.com

    - mydestination = $hostname, localhost.$mydomain $mydomain (on one line)

    - smtpd_recipient_restrictions = permit_mynworks, reject_unauth_destination


    The first three lines define hostnames and domains. The last line tells Postfix
    to accept mail as long as it is sent from a host in mynetworks and to reject any
    mail that is not addressed to one of the domains defined in mydestination.


    +   6. Save the file and close the editor.

    7. Start Postfix by entering repostfix start.'
