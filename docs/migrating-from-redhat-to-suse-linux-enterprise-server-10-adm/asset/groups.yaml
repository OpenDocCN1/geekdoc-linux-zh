    # Exercise 4-2


    # Manage File Systems from the Command Line


    In this exercise you practice to manage file systems from the command line.


    In the previous exercise, you created various partitions and file systems. If
    you used /dev/sda previously, replace /dev/hdxa by /dev/sda in this exercise as
    well.


    In the first part of this exercise, you run e2 on the xt2 file system you created
    on /dev/hda5, which is mounted on /apps.


    In the second part of the exercise, you convert the partition /dev/hda8 to an
    ext3 file system by adding a journal; also add the label /export/data2 to it.


    Then resize the Reiser file system on /dev/hda9 to use the entire partition and
    not just 625 MB.


    # Detailed Steps to Complete this Exercise:


    +   - Part I: Run e2fsck

    - Part II: Customize the File Systems


    # Part I: Run e2fsck


    To run e2fsck, do the following:


    +   1. Unmount the file system on /dev/hda5 (or /dev/sda5, depending on your hardware)
    by entering umount /apps.

    2. Verify that the file system is no longer mounted by entering mount.

    The /dev/hda5 partition is not displayed.

    3. Start a file system check on hda5 running in verbose mode with an automatic
    response of yes to prompts by entering the:

    e2fsck -f -y /dev/hda5'
