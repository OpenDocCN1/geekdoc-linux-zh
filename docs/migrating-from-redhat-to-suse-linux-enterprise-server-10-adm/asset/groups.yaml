    # Part II: Customize the File Systems


    To customize the file systems, do the following:


    +   1. Modify the partition /dev/hda8:


    +   a. From the terminal window, umount /dev/hda8 and view details about the ext2
    file system on /dev/hda8 by entering the following:


    umount /dev/hda8 ; dumpe2fs /dev/hda8 | more

    Notice the block size and the file system state.


    +   b. Give the ext2 file system the volume name /export/data2 while the file
    system is unmounted by entering the following:


    tune2fs -L /export/data2 /dev/hda8

    Naming a file system can be useful in system situations when the /etc/fstab is
    not available. It is common practice to use this naming convention.


    +   c. Verify that the file system now has a volume name by entering dumpe2fs
    /dev/hda8 | less.


    +   d. Add a journal to the file system (making it an ext3 system) by entering
    tune2fs -j /dev/hda8.


    +   e. Verify that the file system now contains a journal by entering dumpe2fs
    /dev/hda8 | less.


    +   f. Mount /dev/hda8 again by entering mount /dev/hda8.


    +   g. View information about the mounted file systems by entering mount.

    Notice that the file system is still mounted as an ext2 file system.


    +   h. Unmount the partition /dev/hda8 again by entering umount /dev/hda8.'
