    - 5. Close the YaST Control Center by selecting Close.\n- 6. (Conditional) If\
    \ you installed from DVD, remove the DVD from your drive.\n\n(End of Exercise)\n\
    \n## Exercise 2-3 Manage User Accounts with YaST\n\nIn this exercise, you create\
    \ and remove an user account with the YaST user management module. In part I,\
    \ you create a new account labeled “tux” for the user “Tux Penguin” with the password\
    \ “novell”. In part II, you log in as tux. In part III, you open the file /etc/passwd\
    \ and look for the entries for geeko and tux. In part IV, you log in as geeko\
    \ and remove tux’s account.\n\nTo manage user accounts with YaST, do the following:\n\
    \n- Part I: Create a User Account with YaST\n- Part II: Log In as User\n- Part\
    \ III: View the passwd File\n\n### Part I: Create User Account with YaST\n\nTo\
    \ create a user account with YaST, do the following:\n\n- 1. From the GNOME desktop,\
    \ select Applications > System > YaST; then enter a password of novel and select\
    \ Continue.\n2. From the YaST Control Center, select Security and Users > User\
