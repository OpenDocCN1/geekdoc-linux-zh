    # Detailed Steps to Complete this Exercise:\n\n- Part I: Boot From the Installation\
    \ Media\n- Part II: Configure the Partitions for Your Hard Drive\n- Part III:\
    \ Configure the Installed Server\n\n# Part I: Boot From the Installation Media\n\
    \nTo boot from the installation media, do the following:\n\n1. Turn on the computer.\n\
    2. Insert SUSE Linux Enterprise Server 10 DVD into the DVD drive.\n3. (Conditional)\
    \ If your computer does not boot from the drive, reboot the computer by selecting\
    \ the **Reset** button or by pressing **Ctrl+Alt+Del**.\n4. When the GRUB installation\
    \ screen appears, select **Installation** with the arrow keys and press **Enter**.\n\
    5. From the language selection dialog, select *your language*; then select **Accept**.\n\
    \nAdjust the BIOS settings so that the DVD drive is the first boot device and\
    \ reboot the computer.\n\n> Although you can select any available language, the\
    \ exercises in this manual are written for English US.\n\n6. When YaST displays\
    \ the **Novell Software License Agreement**, select **Yes, I Agree to the License\
    \ Agreement** and then Next.\n7. When the installation mode dialog appears, select\
    \ **New Installation**; then select **Next**.\n8. Select your time zone in the\
    \ **Clock and Time Zone** dialog. Select UTC and adjust the time to your current\
    \ time, if needed.\n\nWhen done, select Next. An Installation Settings proposal\
    \ dialog appears.\n\n9. Select Keyboard Layout: Select your keyboard layout; select\
    \ Accept.\n\nYou are returned to the Installation Proposal dialog.\n\n# Part II:\
    \ Configure the Partitions for Your Hard Drive\n\n1. Change the partitioning settings\
    \ by selecting Partitioning.\n\n2. Select Create Custom Partition Setup; then\
    \ select Next.\n\n3. Select Custom Partitioning -- for experts; then select Next.\n\
    \n4. Delete existing partitions:\n\n   a. From the Expert Partitioner dialog,\
    \ check for any existing partitions in the partition list.\n   b. If there are\
    \ partitions, select the hard disk entry of the corresponding partitions (such\
    \ as hda or hdc).\n   c. Delete all existing partitions on the selected hard disk\
    \ by selecting Delete.\n   d. When you are asked to confirm the deletion, select\
    \ Yes.\n   e. (Conditional) If there is more than one hard disk containing partitions\
    \ in the system, repeat steps b, c, and d until only the hard disk entries are\
    \ left in the list.\n\n5. Create a swap partition:\n   a. From the partition list,\
    \ select the hard drive entry; then select Create.\n   If you have more than one\
    \ hard disk, select the larger disk.\n   b. Select Primary partition; then select\
    \ OK.\n   c. In the End field of the size settings enter +1GB.\n   d. From the\
    \ File file system drop-down list, select Swap.\n   e. Add the swap partition\
    \ by selecting OK.\n\n6. Create the root partition:\n\n   a. Select the same hard\
    \ disk you used for the swap partition; select **Create.**\n   b. Select **Primary\
    \ partition**; then select **OK.**\n   c. In the End field of the size settings\
    \ enter **+6GB.**\n   d. Make sure that the following options are set:\n     \
    \ - **Reiser** should be selected from the File system drop-down list.\n     \
    \ - / should be selected from the Mount Point drop-down list.\n   e. Add the root\
    \ partition by selecting **OK.**\n\n7. Confirm the partitioning setup and return\
    \ to the installation proposal by selecting **Finish.**\n\n8. From the Installation\
    \ Settings Overview, select **Accept.**\n\n9. From the confirmation dialog, select\
    \ **Install.**\n10. (Conditional) If you are using CD YaST asks to change CDs\
    \ during the installation process and the server might reboot when the software\
    \ from the first CD is installed.\n\nInsert the requested CDs and select **OK.**\n\
    \n# Part III: Configure the Installed Server and Domain Name dialog,\n\n1. When\
    \ presented with the **Hostname** enter the *hostname* in the **Hostname** field\
    \ and digital airlines.com in the **Domain Name** field.\n\n2. Remove the selection\
    \ in front of Hostname by DHCP; then select **Next.**\n\n3. You are presented\
    \ with the **Password** for the System **Administrator** “root” dialog. Enter\
    \ *novell* in the **Password for root** **User** and the **Confirm Password**\
    \ fields.\n\n4. Continue by selecting **Next.**\n\nYou are warned that the password\
    \ is too simple.\n\n5. Continue by selecting Yes.\n\nYou are warned that you are\
    \ using only lowercase letters.\n\n6. Continue by selecting Yes.\n\n7. In the\
    \ Network Configuration proposal, under Firewall select enabled. The entry will\
    \ change to Firewall is disabled.\n\n8. From the Network Configuration proposal,\
    \ select Network Interfaces.\n\n9. Select the first detected network card and\
    \ select Edit.\n\n10. Select Static Address Setup.\n\n11. In the IP Address field,\
    \ enter your IP address.\n\n12. In the Subnet Mask field, enter 255.255.255.0.\n\
    \n13. Configure the host name and name server:\n   a. Select Hostname and Name\
    \ Server.\n   b. You hostname and domain name should already be filled in correctly;\
    \ if not, enter your hostname and the domain name digital airlines.com.\n   c.\
    \ In case Update Name Servers and Search List by DHCP is selected, remove the\
    \ selection by clicking on it.\n   d. In the Network Server 1 field, enter the\
    \ 10.0.0.254 of the name server.\n   e. Return to the Network setup dialog by\
    \ selecting OK.\n\n14. Configure routing:\n   a. Select Routing.\n   b. In the\
