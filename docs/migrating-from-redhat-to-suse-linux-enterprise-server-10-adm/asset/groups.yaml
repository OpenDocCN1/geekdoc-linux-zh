    \n## SECTION 7 AppArmor\n\nIn this section of the workbook, you learn how to do\
    \ the following:\n\n- “AppArmor” on 7-2\n  In this exercise, you create, test,\
    \ and improve a profile for the Firefox browser.\n\n## Exercise 7-1\n\n### AppArmor\n\
    \nIn this exercise, you create, test, and improve a profile for the Firefox browser.\
    \ This exercise has four parts.\n\nIn the first part create a profile for Firefox\
    \ browser. While using Firefox to generate log entries for the initial profile,\
    \ just surf the web; do not access local files with Firefox.\n\nIn the second\
    \ part, use Firefox to access a local file, such as /usr/share/doc/packages/apparmor-docs/apparmor.7.html.\
    \ AppArmor should prevent you from viewing it. Change the profile to allow. You\
    \ could use YaST, genprof, or complain logprof for this purpose.\n\nIn the third\
    \ part, install the Java 4_2 browser-plugin java-1_4_2-sun-plugin. Restart Firefox\
    \ and use it to access a page containing a Java applet.\n\nhttp://java.sun.com/products/plugin/1.4/demos/plugin/applets.html\
    \ links to various demos. Firefox will not be able to show them. Change the profile\
    \ again to be able to run Java applets. Use another method to do so than the method\
    \ used in part two above.\n\nIn the fourth part, compare the profile you generated\
    \ with those in /etc/apparmor/profiles/extras/ for Firefox. Find out if your profile\
    \ is more restrictive or more permissive compared with those profiles.\n\n## Detailed\
    \ Steps to Complete this Exercise\n\n- Part I: Create a Profile for the Firefox\
    \ Browser\n- Part II: Modify the Profile for Firefox to Allow Read Access to the\
    \ Local File System\n- Part III: Use a Browser Plug-in\n- Part IV: Compare the\
    \ Profile You Created with Those From SLES 10\n\n## Part I: Create a Profile for\
    \ the Firefox Browser\n\nDo the following:\n\n- 1. Start Yast, enter the root\
    \ password (novell).\n- 2. Select Novell AppArmor > Add Profile Wizard.\n- 3.\
    \ At the prompt: Application to Profile, enter firefox.\n- 4. Start Firefox by\
    \ pressing Alt+F2, entering firefox and selecting Run. View some web pages. Close\
    \ Firefox again.\n- 5. In the YaST AppArmor Profile Wizard dialog, select Scan\
    \ system log for AppArmor events.\n- 6. Now you create the profile and need to\
    \ answer several questions. Note that the application Firefox is quite complex\
    \ and accesses several executables and files on the system.\n  a. Select Inherit\
    \ for /bin/basename and other executed program.\n  b. For files and directories,\
    \ choose an appropriate option, such as #include, a filename, a directory, or\
    \ a path with place holders, and select Allow. When you are returned to the AppArmor\
    \ Profile Wizard dialog, select Finish.\nMake sure that the Firefox profile is\
    \ in enforce mode by looking at /sys/kernel/security/apparmor/profiles using cat.\
    \ There must be an entry /usr/lib/firefox/firefox.sh (enforce). If it is not,\
    \ execute enforce firefox.\n\n## Part II: Modify the Profile for Firefox to Allow\
    \ Read Access to the Local File System\n\nDo the following:\n\n- 1. Open a terminal\
    \ window and su - root (password novel).\n- 2. Enter tail -f /var/log/audit/audit.log.\n\
    - 3. Start Firefox by pressing Alt+F2, entering firefox and selecting Run. To\
    \ view the file /usr/share/doc/packages/apparmor-docs/apparmor.7.html (You should\
    \ not be able to do so.)\n- 4. View the log file in the terminal window. You should\
    \ see a reject message.\n- 5. Stop viewing the log file by pressing Ctrl+c.\n\
    - 6. In the terminal window, enter complain firefox.\n- 7. In Firefox, try again\
    \ to access /usr/share/doc/packages/apparmor-docs/apparmor.7.html. You should\
    \ now be able to access the file.\n- 8. Start Yast, enter the root password (novel).\n\
    - 9. Select Novell AppArmor > Update Profile Wizard.\n- 10. You are presented\
    \ with the same interface as in Part I, where you can choose Allow, Inherit, Deny,\
    \ etc. Make sure you are updating the Firefox profile, not some other profile.\
    \ One or later you should see an entry for the path /usr/share/doc/packages/apparmor-docs/apparmor.7.html\
    \ by selecting the Glob button three times, you can create a suggestion /usr/share/doc/**.\
    \ Allow it by selecting Allow.\n- 11. When all entries in the log file have been\
    \ processed, select Finish.\n- 12. Put the Firefox profile back in enforce mode\
    \ by entering firefox in the terminal window.\n- 13. In Firefox, try to access\
    \ files beneath /usr/share/doc/, like /usr/share/doc/packages/. You should be\
    \ able to access them. However, accessing files elsewhere in the file system should\
    \ not be possible.\n- 14. Close Firefox.\n- 15. Close YaST.\n\n## Part III: Use\
    \ a Browser Plug-in\n\nDo the following:\n\n- 1. Open a terminal window and su\
    \ - root (password novel).\n- 2. Enter tail -f /var/log/audit/audit.log.\n- 3.\
    \ Start Firefox by pressing Alt+F2, entering firefox and selecting Run. To view\
    \ the file /usr/share/doc/packages/apparmor-docs/apparmor.7.html (You should not\
    \ be able to do so.)\n- 4. View the log file in the terminal window. You should\
    \ see a reject message.\n- 5. Stop viewing the log file by pressing Ctrl+c.\n\
    - 6. In the terminal window, enter complain firefox.\n- 7. In Firefox, try again\
    \ to access /usr/share/doc/packages/apparmor-docs/apparmor.7.html. You should\
    \ now be able to access the file.\n- 8. Start Yast, enter the root password (novel).\n\
    - 9. Select Novell AppArmor > Update Profile Wizard.\n- 10. You are presented\
    \ with the same interface as in Part I, where you can choose Allow, Inherit, Deny,\
    \ etc. Make sure you are updating the Firefox profile, not some other profile.\
    \ One or later you should see an entry for the path /usr/share/doc/packages/apparmor-docs/apparmor.7.html\
    \ by selecting the Glob button three times, you can create a suggestion /usr/share/doc/**.\
    \ Allow it by selecting Allow.\n- 11. When all entries in the log file have been\
    \ processed, select Finish.\n- 12. Put the Firefox profile back in enforce mode\
    \ by entering firefox in the terminal window.\n- 13. In Firefox, try to access\
    \ files beneath /usr/share/doc/, like /usr/share/doc/packages/. You should be\
