    \ 10.0.0.10 作为 IP 地址，使用 da10 作为主机名。）\n- 使用本地认证；创建用户账户 geeko，密码：novell。\n- 跳过在线更新\n\
    \n# 完成此练习的详细步骤：\n\n- 第一部分：从安装介质启动\n- 第二部分：为你的硬盘配置分区\n- 第三部分：配置已安装的服务器\n\n# 第一部分：从安装介质启动\n\
    \n要从安装介质启动，请执行以下操作：\n\n1. 开启电脑。\n2. 将 SUSE Linux Enterprise Server 10 DVD 插入 DVD\
