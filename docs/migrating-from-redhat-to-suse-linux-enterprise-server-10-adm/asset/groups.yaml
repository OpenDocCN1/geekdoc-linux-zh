    要使用 fdisk 进行手动分区，请执行以下操作：


    - 1. 在命令行，通过输入 fdisk /dev/hda 启动服务器上第一块 IDE 硬盘的 fdisk 工具（如果你的电脑使用 SATA 或 SCSI
    磁盘，请输入 fdisk /dev/sda）。根据磁盘上磁道的数量，系统会显示一条磁道数超过 1024 的消息，这在某些情况下可能会导致问题。

    - 2. 通过输入 p 在 fdisk 中查看当前分区表。


    注意有 5 个分区（hda1, hda2, hda3, hda5 和 hda6）。


    - 3. 通过执行以下操作在扩展分区中创建一个 500MB 的 Win95 FAT32 逻辑分区：

    a. 输入 n 创建新分区。

