- md: "\n## Exercise 2-4 Configure the Password Security Settings\n\nIn this exercise,\
    \ you practice changing different security settings. Change the default behavior\
    \ when the keys Ctrl+Alt+Del are pressed to halting the machine. Also change the\
    \ encryption from blowfish to MD5. Use the YaST Local Security module to do the\
    \ above.\n\n## Detailed Steps to Complete this Exercise:\n\n1. Open a terminal\
    \ window.\n2. Check the setting for the Ctrl+Alt+Del keystroke in the file /etc/inittab\
    \ by entering grep ctraltldel /etc/inittab.\nNote the current setting:\n3. Start\
    \ YaST and select Security and Users > Local Security.\nThe Local Security Configuration\
    \ dialog appears.\n4. Make sure Custom Settings is selected; then select Next.\n\
    The Password Settings dialog appears.\n5. From the Password Encryption Method\
    \ drop-down list, select MD5.\n6. Continue by selecting Next.\nThe Boot Settings\
    \ dialog appears.\n7. From the Interpretation of Ctrl + Alt + Del drop-down list,\
    \ select Halt.\n8. Continue by selecting Next.\nThe Login Settings dialog appears.\n\
    9. Accept the default settings by selecting Next.\nThe Adding User dialog appears.\n\
    \n10. Accept the default settings by selecting Next.\nThe Miscellaneous Settings\
    \ dialog appears.\n\n11. Accept the default settings and configure the system\
    \ for the new settings by selecting Finish.\n\n12. To test the change, you must\
    \ first activate the new configuration rebooting the system or by entering (as\
    \ root) init q (reload the /etc/initab file) in a terminal window.\n    a. From\
    \ the terminal window, su - to root (password novell),\n    b. Reload the file\
    \ /etc/initabb by entering init q.\n\n13. Verify that the Ctrl+Alt+Del setting\
    \ has changed by entering grep ctrlaltd /etc/initabb.\nNotice that this setting\
    \ is now “shutdown -h” instead of what you noted in Step 2.\n\n14. Test this setting\
    \ by pressing Ctrl+Alt+F2; then press Ctrl+Alt+Del.\nThe system shuts down instead\
    \ of restarting.\n\n15. Turn on your computer and log in to the Gnome desktop\
    \ as geeko.\n16. (Optional) Use the YaST Security settings module to change the\
    \ default for Ctrl+Alt+Del back to restart.\n\n(End of Exercise)\n\nWB 2-10 Copying\
    \ all or part of this manual, or distributing such copies, is strictly prohibited.\
    \ Version 1\\To report suspected copying, please call 1-800-PIRATES.\n\n## SECTION\
    \ 3 Network Configuration\n\nIn this section of the workbook, you learn how to\
    \ do the following:\n\n- “Manage the Network Configuration Information from YaST”\
    \ on 3-2\nIn this exercise you change all the network configuration information\
    \ into static values.\n\n- “Configure the Network Connection Manually” on 3-6\n\
    In this exercise, you learn how to configure the network manually.\n\n## Exercise\
    \ 3-1 Manage the Network Configuration Information from YaST\n\nUp to now, your\
    \ system got all network configuration information via DHCP. In this exercise\
    \ you change all the important information into static values.\n\nUse the ip command\
    \ to find out which ip address you are currently using. Also note your current\
    \ hostname. Then change the network configuration to static IP addresses, using\
    \ the values you found. 10.0.0.254 as default gateway and also as address of the\
    \ name server.\n\nTo manage the network configuration information from YaST, do\
    \ the following:\n\n- Part I: Get your IP Number and Hostname\n- Part II: Start\
    \ the YaST Network Configuration Module\n- Part III: Enter a Static IP Address\
    \ and Subnet Mask\n- Part IV: Change your Hostname\n- Part V: Enter a DNS Server\n\
    - Part VI: Enter a Default Gateway\n- Part VII: Activate new Settings and Finish\n\
    \n## Part I: Get your IP Number and Hostname\n\nTo get your IP number and hostname,\
    \ do the following:\n\n1. From the GNOME desktop, open the main menu.\n2. Select\
    \ More Applications.\n3. Enter term into the Filter text box.\n4. Select the Gnome\
    \ Terminal icon to start a terminal emulation.\n5. Enter /sbin/ip address show\
    \ to record the following information for your SUSE Linux Enterprise Server 10\
    \ server:\n    * IP address:\n    * Hostname:\n6. Close the terminal window.\n\
    \n## Part II: Start the YaST Network Configuration Module\n\nTo start the network\
    \ configuration module of YaST, do the following:\n\n1. From the GNOME desktop,\
    \ open the main menu.\n2. Select More Applications.\n3. Enter ya into the Filter\
    \ text box.\n4. Select the YaST icon to start YaST.\n5. Enter the root password\
    \ novel in the appearing dialog; then select Continue or press Enter.\nThe YaST\
    \ Control Center appears.\n6. Start the network card module by selecting Network\
    \ Devices > Network Card.\n\n## Part III: Enter a Static IP Address and Subnet\
    \ Mask\n\nTo enter a static IP address and subnet mask, do the following:\n\n\
    1. Make sure that Traditional Method with ifup is selected and select Next.\n\
    Your network card is listed in the upper table.\n2. Make sure your network card\
    \ is selected; then select Edit.\n3. Make sure that the Address tab is activated.\n\
    4. Switch the setup by selecting Static address setup.\n5. In the IP Address field,\
    \ enter the IP address from Part I.\n6. In the Subnet mask field, enter 255.255.255.0.\n\
    \n## Part IV: Change your Hostname\n\nTo change your hostname, do the following:\n\
    \n1. Select Host name and name server.\n2. (Conditional) If a dialog appears indicating\
    \ that the resolv.conf files has been temporarily modified, continue by selecting\
    \ Modify.\n3. In the Hostname field, enter the hostname from Part I.\n4. In the\
    \ Domain Name field, enter digital airlines.com.\n\n## Part V: Enter a DNS Server\n\
    \nTo enter a DNS server, do the following:\n\n1. In the Name Server 1 field, enter\
    \ the IP address of your DNS server (10.0.0.254).\n2. If there are values in the\
    \ other Name Server text fields, remove them.\n3. In the Domain Search field,\
    \ enter digitalairlines.com.\n4. If there are values in the other Domain Search\
    \ text fields, remove them.\n5. Select OK.\n\n## Part VI: Enter a Default Gateway\n\
    \nTo enter a default gateway, do the following:\n\n1. Select Routing.\n2. In the\
    \ Default Gateway field, enter the IP address of your Internet gateway (10.0.0.254).\n\
    3. Select OK.\n\n## Part VII: Activate new Settings and Finish\n\nTo activate\
    \ new settings and finish, do the following:\n\n1. Select Next.\n2. Select Next.\n\
    3. Close the YaST Control Center.\n4. To test your network connection, start the\
    \ web browser Firefox and try to call http://www.novell.com.\n\n(End of Exercise)\n\
    \n## Exercise 3-2 Configure the Network Connection Manually\n\nThe purpose of\
    \ this exercise is to familiarize you with manually configuring the network.\n\
    \nIn the first part, using the command ip, find out the current settings for IP\
    \ address, routes, mac address, and the file used to store the hardware configuration\
    \ of the network card in /etc/sysconfig/hardware/ and the configuration options\
    \ in that file.\n\nIn the second part, using YaST, delete the current network\
    \ configuration.\n\nIn the third part, using the ip command, set up the network\
    \ manually. As only the command ip is used, this configuration is permanent.\n\
    \nIn the fourth part, recreate the file in /etc/sysconfig/hardware/ noted in part\
    \ I using an editor, as well the files /etc/sysconfig/network/ifcfg-eth-id-address\
    \ and /etc/sysconfig/network/routes. Reboot the computer and test if the network\
    \ is set up after a reboot.\n\n## Detailed Steps to Complete this Exercise:\n\n\
    - Part I: Note the Current Network Configuration\n- Part II: Delete the Current\
    \ Network Setup with YaST\n- Part III: Configure the Network Manually\n- Part\
    \ IV: Save the Network Connection to Interface and Hardware Configuration\n\n\
    ## Part I: Note the Current Network Configuration\n\nTo note the current network\
    \ configuration, do the following:\n\n1. On the graphical desktop, open a terminal\
    \ window and su - to root (password novel).\n2. Enter ip address show eth0 (depending\
    \ on the setup you may have to use eth1 instead of eth0).\n3. Find the line starting\
    \ with inet, and record the IP address the subnet mask displayed in that line:\n\
    \    - IP address:\n    - Subnet mask:\n4. Enter ip route show.\n5. Find the line\
    \ starting with default and record the gateway IP address of the gateway:\n  \
    \  - Gateway IP address:\n6. Enter ip link show eth0.\n7. Find the line starting\
    \ with link/ether and record the MAC address of the network card:\n    - MAC address:\n\
    8. Change to the /etc/sysconfig/hardware directory by entering the following:\n\
    \n```\ncd /etc/sysconfig/hardware\n```\n9. Enter ls -al, then look for one of\
    \ the following files (depending on your hardware configuration):\n    - hwcfg-id-PCI_address\n\
    \    - or\n    - hwcfg-bus-pci-PCI_address\n10. Record the name of the file:\n"
  mdcn: "\n\n## 练习 2-4 配置密码安全设置\n\n在此练习中，你将练习更改不同的安全设置。将按下 Ctrl+Alt+Del 键时的默认行为更改为停止机器。还将加密方式从\
    \ blowfish 更改为 MD5。使用 YaST 本地安全模块完成上述操作。\n\n## 完成此练习的详细步骤：\n\n1. 打开终端窗口。\n2. 通过输入\
    \ `grep ctraltldel /etc/inittab` 检查文件 `/etc/inittab` 中 Ctrl+Alt+Del 键的设置。\n注意当前的设置：\n\
    3. 启动 YaST 并选择 安全与用户 (Security and Users) > 本地安全 (Local Security)。\n出现“本地安全配置”对话框。\n\
    4. 确保选择了自定义设置 (Custom Settings)；然后选择“下一步 (Next)”。出现“密码设置 (Password Settings)”对话框。\n\
    5. 从密码加密方法 (Password Encryption Method)”下拉列表中选择 MD5。\n6. 选择“下一步 (Next)”继续。\n出现“启动设置\
    \ (Boot Settings)”对话框。\n7. 从“Ctrl + Alt + Del 的解释 (Interpretation of Ctrl + Alt\
    \ + Del)”下拉列表中选择 停止 (Halt)。\n8. 选择“下一步 (Next)”继续。\n出现“登录设置 (Login Settings)”对话框。\n\
    9. 选择“下一步 (Next)”接受默认设置。\n出现“添加用户 (Adding User)”对话框。\n\n10. 选择“下一步 (Next)”接受默认设置。\n\
    出现“杂设置 (Miscellaneous Settings)”对话框。\n\n11. 选择“完成 (Finish)”接受默认设置并为系统配置新设置。\n\n\
    12. 要测试更改，必须通过重启系统或在终端窗口中（以 root 身份）输入 `init q`（重新加载 /etc/init 文件）来激活新配置。\n  \
    \  a. 从终端窗口执行 `su -` 切换到 root（密码为 novel），\n    b. 输入 `init q` 重新加载文件 `/etc/initabb`。\n\
    \n13. 通过输入 `grep ctrlaltd /etc/initabb` 验证 Ctrl+Alt+Del 设置已更改。\n注意此设置现在是“shutdown\
    \ -h”，而不是你在第 2 步中记录的内容。\n\n14. 按 Ctrl+Alt+F2 测试此设置；然后按 Ctrl+Alt+Del。\n系统将关机而不是重启。\n\
    \n15. 开启电脑并以 geeko 身份登录 Gnome 桌面。\n16. （可选）使用 YaST 安全设置模块将 Ctrl+Alt+Del 的默认恢复为重启。\n\
    \n（练习结束）\n\nWB 2-10 严禁复制本手册的全部或部分内容或分发此类副本。版本 1\\如需报告疑似抄袭，请拨打 1-800-PIRATES。\n\
    \n## 第 3 节 网络配置\n\n在本工作簿中，你将学习如何执行以下操作：\n\n- 3-2 页的“从 YaST 管理网络配置信息”\n在此练习中，你将所有网络配置信息更改为静态值。\n\
    \n- 3-6 页的“手动配置网络连接”\n在此练习中，你将学习如何手动配置网络。\n\n## 练习 3-1 从 YaST 管理网络配置信息\n\n到目前为止，你的系统通过\
    \ DHCP 获取所有网络配置信息。在此练习中，你将所有重要信息更改为静态值。\n\n使用 `ip` 命令找出你当前正在使用的 IP 地址。同时记录你当前的主机名。然后使用你找到的值将网络配置更改为静态\
    \ IP 地址。使用 10.0.0.254 作为默认网关以及服务器地址。\n\n要从 YaST 管理网络配置信息，请执行以下操作：\n\n- 第一部分：获取你的\
    \ IP 号和主机名\n- 第二部分：启动 YaST 网络配置模块\n- 第三部分：输入静态 IP 地址和子网掩码\n- 第四部分：更改你的主机名\n- 第五部分：输入\
    \ DNS 服务器\n- 第六部分：输入默认网关\n- 第七部分：激活新设置并完成\n\n## 第一部分：获取你的 IP 号和主机名\n\n获取你的 IP\
    \ 号和主机名，请执行以下操作：\n\n1. 从 GNOME 桌面打开主菜单。\n2. 选择 更多应用程序 (More Applications)。\n3.\
    \ 在过滤文本框中输入 `term`。\n4. 选择 Gnome Terminal 图标启动终端仿真。\n5. 输入 `/sbin/ip address show`\
    \ 以为你的 SUSE Linux Enterprise Server 10 服务器记录以下信息：\n    * IP 地址：\n    * 主机名：\n\
    6. 关闭终端窗口。\n\n## 第二部分：启动 YaST 网络配置模块\n\n启动 YaST 网络配置模块，请执行以下操作：\n\n1. 从 GNOME\
    \ 桌面打开主菜单。\n2. 选择 更多应用程序 (More Applications)。\n3. 在过滤文本框中输入 `ya`。\n4. 选择 YaST\
    \ 图标启动 YaST。\n5. 在出现的对话框中输入 root 密码 `novel`；然后选择 继续 (Continue) 或按回车。\n出现 YaST\
    \ 控制中心。\n6. 通过选择 网络设备 (Network Devices) > 网卡 (Network Card) 启动网卡模块。\n\n## 第三部分：输入静态\
    \ IP 地址和子网掩码\n\n输入静态 IP 地址和子网掩码，请执行以下操作：\n\n1. 确保带有 ifup 的传统方法 (Traditional Method\
    \ with ifup) 并选择“下一步 (Next)”。\n你的网卡列在上方表中。\n2. 确保选中了你的网卡；然后选择“编辑 (Edit)”。\n3.\
    \ 确保“地址 (Address)”选项卡已激活。\n4. 通过选择“静态地址设置 (Static address setup)”切换设置。\n5. 在“IP\
    \ 地址 (IP Address)”字段中，输入第一部分中的 IP 地址。\n6. 在“子网掩码 (Subnet mask)”字段中，输入 `255.255.255.0`。\n\
    \n## 第四部分：更改你的主机名\n\n更改你的主机名，请执行以下操作：\n\n1. 选择 主机和名称服务器 (Host name and name server)。\n\
    2. （条件）如果出现对话框指示 resolv.conf 文件已被临时修改，选择 修改 (Modify) 继续。\n3. 在“主机名 (Hostname)”字段中，输入第一部分中的主机名。\n\
    4. 在“域名 (Domain Name)”字段中，输入 `digitalairlines.com`。\n\n## 第五部分：输入 DNS 服务器\n\n\
    输入 DNS 服务器，请执行以下操作：\n\n1. 在“名称服务器 1 (Name Server 1)”中，输入你的 DNS 服务器 IP 地址 (10.0.0.254)。\n\
    2. 如果其他名称服务器文本字段中有值，请将其删除。\n3. 在“域搜索 (Domain Search)”字段中，输入 `digitalairlines.com`。\n\
