    - 3. 输入以下命令停止 postfix 守护进程：\n```\nrcpostfix stop\n```\n- 4. 使用你喜喜欢的文本编辑器打开 `/etc/postfix/main.cf`\
    \ 文件。\n- 5. 要配置 Postfix 接受来自本地网络的邮件以及发送到 digitalairlines.com 域中任何接收者的邮件，请编辑或添加以下：\n\
    \  - myhostname = hostname.digitalairlines.com\n  - mydomain = digitalairlines.com\n\
    \  - mydestination = $hostname,$omain （同一行）\n  - smtpd_recipient_restrictions\
    \ = permit_mynworks, reject_unauth 前三行定义了主机和域名。最后一行告诉 Postfix，只要邮件是来自 `mynworks`\
    \ 中的主机就接受，并拒绝任何未发送至 `mydestination` 中定义的域之一的邮件。\n- 6. 保存文件并关闭编辑器。\n- 7. 输入 `rcpostfix\
    \ start` 启动 Postfix。\n\n（要测试配置，你必须从本地网络之外的 IP 地址访问 Postfix，并尝试向 airlines.com 以外的域名发送邮件。Postfix\
    \ 不应接受此邮件。）\n\n（练习结束）\n\n## 练习 6-3 使用查找表\n\n在本次练习中，你将使用 Postfix 查找表。\n\n在第一部分，你创建了一个密码为\
    \ novel 的新用户。\n在第二部分，你修改查找表，使新用户的邮件以发送者地址 master@airlines.com 发出。\n在第三部分，测试你的配置。\n\
    \n请执行以下操作：\n\n- 1. 打开终端窗口并输入 `su -` 获取 root 权限。\n- 2. 提示时，输入 root 密码 novel。\n\
    - 3. 要创建新用户，输入 `useradd -G users -m master`。\n- 4. 通过输入两次 `passwd master` 为用户设置密码。\n\
    - 5. 输入 `su - master` 以用户身份登录。\n- 6. 要给 root 用户写邮件，输入 `mail@localhost`。\n- 7.\
    \ 输入主题和一些正文；然后完成邮件：\n  a. 按回车键。\n  b. 输入 `.`（点）。\n  c. 按回车键。\n- 8. 输入 `exit` 获取\
    \ root 权限。\n- 9. 输入 `mail`。\n- 10. 输入你撰写的邮件对应的数字。\n- 11. 在下方的空间记录发送者地址：\n- 12.\
    \ 输入 `q` 退出。\n\n- 第二部分 - 更改 sender_canonical 表\n- 1. 输入 `rcpostfix stop`。\n- 2.\
    \ 使用你喜喜欢的文本编辑器打开 `/etc/postfix/sender_canonical`。\n- 3. 要更改用户的发送地址，输入（同一行）`master@airlines.com\
    \ master@airlines.com`。\n- 4. 保存文件并关闭编辑器。\n- 5. 输入 `postmap :/etc/postfix/sender_canonical`。\n\
    - 6. 输入 `rcpostfix start` 启动 Postfix。\n\n- 第三部分 - 测试配置\n- 1. 输入 `su - master`\
    \ 以用户身份登录。\n- 2. 要给 root 用户写邮件，输入 `mail@localhost`。\n- 3. 输入主题和一些正文；然后完成邮件：\n\
    \  a. 按回车键。\n  b. 输入 `.`（点）。\n  c. 按回车键。\n- 4. 输入 `exit` 获取 root 权限。\n- 5. 输入\
    \ `mail`。\n- 6. 输入你撰写的邮件对应的数字。\n- 7. 在下方的空间记录发送者地址：\n- 8. 输入 `q` 退出。\n\n（练习结束）\n\
    \n## 练习 6-4 安装 Apache\n\n在本次练习中，你将在系统上安装 apache 组件。\n\n请执行以下操作：\n\n- 1. 启动 YaST。\n\
    - 2. 从 YaST 控制中心，选择 Software（软件）> Software Management（软件管理）。\n- 3. 从过滤器下拉菜单中选择\
    \ Search（搜索）。\n- 4. 在 Search 字段中输入 `apache`；然后选择 Search。\n- 5. 在右侧，选择以下软件包：\n\
    \  - apache2\n  - apache2-example-pages\n  - apache2-prefork\n- 6. 选择 Accept（接受）。\n\
    - 7. （可选）如果 YaST 显示软件包依赖关系，通过选择 Continue（继续）进行确认。\n- 8. 提示时，向驱动器插入所需的 SUSE Linux\
    \ Enterprise Server 10 CD。\n- 9. 安装完成后，关闭 YaST 控制中心并移除 CD。\n- 10. 打开终端窗口并 `su`\
    \ 到 root。\n- 11. 要现在系统启动时启动 Apache，输入以下内容：\n```\ninsserv apache2\n```\n- 12. 要启动\
    \ Apache 守护进程，输入以下：\n```\nrcapache2 start\n```\n\n（练习结束）\n\n## 练习 6-5 测试 Apache\
    \ 安装\n\n在本次练习中，你将检查 apache 是否成功安装。\n\n请执行以下操作：\n\n- 1. 启动 Firefox。\n- 2. 在网络浏览器的地址栏中，请输入以下内容：\n\
    ```http://localhost```\n如果出现了 Apache 示例页面，说明 Web 服务器已正确安装并启动。\n- 3. （可选）如果你在显示页面时遇到问题，你需要重命名文件\
    \ `/srv/www/htdocs/index.html.en` 为 `/srv/www/htdocs/index.html`。\n\n（练习结束）\n\n\
    ## 练习 6-6 配置虚拟主机\n\n在本次练习中，你将为部门配置虚拟主机。\n\n请执行以下操作：\n\n- 1. 在终端窗口（以 root 身份），通过以下命令创建虚拟主机目录：\n\
    `mkdir /srv/www/accounting`\n- 2. 在新目录中创建一个 `index.html` 文件，内容如下：\n```html\n<html>\n\
    <head>\n<title>Accounting Intranet</title>\n</head>\n<body>\n<h1>Accounting Intranet</h1>\n\
    建设中。\n</body>\n</html>\n```\n- 3. 输入以下命令进入 `/etc/apache2/vhosts.d/` ：\n`cd /etc/apache2/vhosts.d/`\n\
    - 4. 输入以下命令拷贝虚拟主机模板：\n`cp vhost.template accounting.conf`\n- 5. 使用文本编辑器打开 `accounting.conf`\
    \ 文件并进行以下更改：\n\n```\n<VirtualHost accounting.da.com:80>\nServerName accounting.da.com\n\
    DocumentRoot /srv/www/accounting\nErrorLog /var/log/apache2/accounting.da.com-error_log\n\
    CustomLog /var/log/apache2/accounting.da.com-access_log combined\nUseCanonicalName\
    \ On\nScriptAlias \"cgi-bin/\" \"/srv/www/cgi-bin\"\n<Directory>\nAllowOverride\
    \ None\nOptions +ExecCGI -Includes\nOrder allow,deny\nAllow from all\n</Directory>\n\
    <Directory \"/srv/www/accounting/\">\nAllowOverride None\nOptions Indexes FollowSymLinks\n\
    Order allow,deny\nAllow from all\n</Directory>\n```\n\n- 6. 为了测试目的，在 `/etc/hosts`\
    \ 文件的 `127.0.0.1` 行后添加 `accounting.da.com`：\n127.0.0.1 localhost accounting.da.com\n\
    - 7. 输入以下命令测试配置文件的语法：\napache2ctl configtest\n- 8. 输入以下命令重载 Apache：\nrcapache2\
    \ reload\n\n此文件也可以在你的 3073 课程 CD 的 `/section_2` 目录中找到。\n\n"
