    \ = permit_mynetworks, reject（在同一行）\n\n7. 为了重写发送者地址并删除主机名，编辑以下选项：\n\n- masquerade_exceptions\
    \ = root（可能已设置）\n- masquerade_domains = digital airlines.com\n\n"
