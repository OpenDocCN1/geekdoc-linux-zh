- md: "\n# Exercise 5-2 Manage Runlevels\n\nIn this exercise, you practice configuring\
    \ runlevels. This exercise has four parts.\n\nIn the first part, use the command\
    \ runlevel to find out about the current runlevel and the command init to change\
    \ to runlevel 3 and then back to 5.\n\nIn the second part, activate the at service\
    \ atd. The service allows commands to be scheduled at a future point in time.\n\
    \nIn the third part, reboot your computer and boot into runlevel 3 instead of\
    \ the default runlevel 5. Login and switch to runlevel 5.\n\nIn the fourth part,\
    \ activate the rsync daemon using the YaST runlevel editor.\n\n## Detailed Steps\
    \ to Complete this Exercise:\n\n- Part I: View and Change the Current Runlevel\n\
    - Part II: Activate at Service atd\n- Part III: Set a Runlevel at Boot Time\n\
    - Part IV: Enable rsyncd with YaST\n\n## Part I: View and Change the Current Runlevel\n\
    \nTo view and change the current runlevel, do the following:\n\n1. Open a terminal\
    \ window and su - to root (password novel).\n2. Check the previous and current\
    \ runlevels by entering runlevel.\n   List the runlevels:\n\n| Table 5-1 | Previous\
    \ | Current |\n|---|---|---|\n\nNotice that the previous runlevel is listed as\
    \ N, which means there was no previous runlevel set.\n\n3. Change to runlevel\
    \ 3 by entering **init 3.**\n\nThe graphical environment is terminated and you\
    \ are left at a terminal login prompt.\n\n4. Log in as **root** with a password\
    \ of **novell.**\n\n5. Check the previous and current runlevel by entering **runlevel.**\n\
    \nList the runlevels:\n\n| Table 5-2 | Previous | Current |\n|---|---|\n\n6. Switch\
    \ to runlevel 5 by entering **init 5.**\n\nThe GUI login screen appears.\n\n7.\
    \ Log in as **geeko** with a password of **novell.**\n\n## Part II: Activate the\
    \ at Service atd\n\nTo activate the service at atd, do the following:\n\n1. From\
    \ the terminal window, su to root (**su -**) with a password of **novell.**\n\n\
    2. View the current runlevel configuration for atd by entering **chkconfig atd\
    \ -l.**\n\nNotice that configuration is off for all runlevels.\n\n3. Install the\
    \ service to its predefined runlevels by entering **inserv -d atd.**\n\n4. Check\
    \ the modified runlevel configuration for at by entering **chkconfig atd -l.**\n\
    \nNotice that the default configuration for sets runlevels 2, 3, and 5 to on.\n\
    \n5. Change to the directory /etc/rc.d/rc3.d by entering `cd /etc/rc.d/rc3.d`.\n\
    \n6. List the atd files in the directory by entering `ls -l *atd`. Notice there\
    \ are two atd links—one is used to start and one is used to kill the service atd.\n\
    \n7. Start the service at entering `rcatd`.\n\n8. Verify that the service is running\
    \ by entering `rcatd status`.\n\n9. Switch to virtual terminal 1 by pressing `Ctrl+Alt+F1`;\
    \ then log in as `root`.\n\n10. Switch to runlevel 1 by entering `init 1`.\n\n\
    11. Enter a root password of `novell`.\n\n12. Check to see if the service is running\
    \ by entering `rcatd status`. The service is listed as unused because it is not\
    \ configured to start at runlevel 1.\n\n13. Switch back to your previous runlevel\
    \ (5) by entering `init 5`. The GUI login screen appears.\n\n14. Log in as `geeko`\
    \ with a password of `novell`.\n\n15. Open a terminal window and `su - to root`\
    \ (password `novell`).\n\n16. Now use `chkconfig` instead of `inserv` to configure\
    \ system services. From the command line, remove the service from system startup\
    \ runlevels by entering `chkconfig off`.\n\n17. View the current runlevel configuration\
    \ for at entering `chkconfig atd -l`.\n\nNotice the service is off for all runlevels.\n\
    \n18. Re-enable the service to start at the default runlevels by entering `chkconfig\
    \ atd on`.\n\n## Part III: Set a Runlevel at Boot Time\n\nTo set a runlevel at\
    \ boot time, do the following:\n\n1. From the terminal window, su to root (su\
    \ -) with a password of novel.\n2. Reboot by entering init 6.\n3. When the boot\
    \ menu is displayed, press the Spacebar to stop the timer.\n4. In the Boot Options\
    \ field type 3; then press Enter to boot the Linux system to runlevel 3.\n5. When\
    \ the login prompt appears, log in as root with a password of novel.\n6. Display\
    \ the current runlevel by entering runlevel.\n7. Switch to runlevel 5 by entering\
    \ init 5.\n8. Switch back to the virtual terminal by pressing Ctrl+Alt+F1.\n9.\
    \ Log out as root by entering exit.\n10. Switch back to the graphical user interface\
    \ by pressing Ctrl+Alt+F7.\n11. Log in as geeko with a password of novel.\n\n\
    ## Part IV: Enable rsyncd with YaST\n\nTo enable rsyncd with YaST, do the following:\n\
    \n1. From the graphical desktop, start YaST.\n   The YaST Control Center appears.\n\
    2. Select System > System Services (Runlevel).\n   The Runlevel Editor: Services\
    \ dialog appears.\n3. Switch to a more detailed view (with additional options)\
    \ by selecting Expert Mode.\n4. Scroll down the Services list and select rsyncd.\n\
    \n5. Below the list, configure this service to start at runlevels 3 and 5 by selecting\
    \ **3** and 5.\n6. From the Set/Reset drop-down list select **Enable the service.**\n\
    7. Start the service rsyncd from the Start/Stop/Refresh drop-down list by selecting\
    \ **Start now.**\n\nA status message appears indicating that the service started\
    \ successfully.\n\n8. Close the status message by selecting **OK.**\n9. Stop the\
    \ service rsyncd from the Start/Stop/Refresh drop-down list by selecting **Stop\
    \ now.**\n\nA status message appears indicating that the service stopped successfully.\n\
    \n10. Close the status message by selecting **OK.**\n11. Save the changes by selecting\
    \ **Finish**; then select **Yes.**\n12. Close the YaST Control Center and the\
    \ terminal window.\n\n(End of Exercise)\n\n## SECTION 6 Configure Mail and Web\
    \ Services\n\nIn this section of the workbook, you learn how to do the following:\n\
    \n- “Send Mail in the Local Network” on 6-2\nIn this exercise, you send mail in\
    \ the local network. You configure Postfix and test your configuration.\n- “Use\
    \ Postfix on the Internet” on 6-4\nIn this exercise, you configure Postfix to\
    \ send email to the Internet.\n- “Use Lookup Tables” on 6-6\nIn this exercise,\
    \ you use the Postfix lookup tables.\n- “Install Apache” on 6-9\nIn this exercise,\
    \ you install the apache components on your system.\n- “Test the Apache Installation”\
    \ on 6-10\nIn this exercise, you check if the installation of apache was successful.\n\
    - “Configure a Virtual Host” on 6-11\nIn this exercise, you configure a virtual\
    \ host for the accounting department.\n\n## Exercise 6-1\n\n### Send Mail in the\
    \ Local Network\n\nIn this exercise, you edit the Postfix configuration file /etc/postfix/main.cf.\
    \ You configure Postfix to send mails in your local network. The domain name of\
    \ the sender should be masqueraded for normal users. External mails should be\
    \ forwarded to dal. Test your configuration by sending a mail to root.\n\nDo the\
    \ following:\n\n- Part I - Edit /etc/postfix/main.cf\n- Part II - Test the Configuration\n\
    \n### Part I - Edit /etc/postfix/main.cf\n\n1. Open a terminal window and enter\
    \ su- to get root permissions.\n2. When prompted, enter the root password novel.\n\
    3. Stop the postfix daemon by entering\nrcpostfix stop\n4. Open the file /etc/postfix/main.cf\
    \ in a text editor.\n5. Scroll to the settings at the end of the file.\n6. To\
    \ accept mail only from the local network, edit the following options:\n\n- inet_interfaces\
    \ = your_IP-Address, 127.0.0.1\n- mynetworks_style = subnet (should already be\
    \ set)\n- smtpd_recipient_restrictions = permit_mynetworks, reject (on one line)\n\
    \n7. To rewrite the sender addresses and remove the host name, edit the following\
    \ options:\n\n- masquerade_exceptions = root (should already be set)\n- masquerade_domains\
    \ = digital airlines.com\n"
  mdcn: "\n\n# 练习 5-2 管理运行级别 (Runlevels)\n\n在本练习中，你将练习配置运行级别。本练习分为四个部分。\n\n第一部分，使用\
    \ `runlevel` 命令查看当前运行级别，并使用 `init` 命令切换到运行级别 3，然后返回运行级别 5。\n\n第二部分，激活 `at` 服务\
    \ atd。该服务允许在未来的时间点调度命令。\n\n第三部分，重启电脑并启动到运行级别 3 而不是默认的运行级别 5。登录并切换到运行级别 5。\n\n\
    第四部分，使用 YaST 运行级别编辑器激活 `rsync` 守护进程。\n\n## 完成此练习的详细步骤：\n\n- 第一部分：查看和更改当前运行级别\n\
    - 第二部分：激活 atd 服务\n- 第三部分：在启动时设置运行级别\n- 第四部分：使用 YaST 启用 rsyncd\n\n## 第一部分：查看和更改当前运行级别\n\
    \n要查看并更改当前运行级别，请执行以下操作：\n\n1. 打开终端窗口并使用 `su -` 切换到 root（密码为 `novel`）。\n2. 通过输入\
    \ `runlevel` 检查之前的和当前的运行级别。\n   列出运行级别：\n\n| 表 5-1 | 之前的 | 当前的 |\n|---|---|---|\n\
    \n注意，之前的运行级别显示为 N，这意味着没有设置之前的运行级别。\n\n3. 通过输入 **init 3.** 切换到运行级别 3。\n\n图形化环境已终止，你将处于终端登录提示符处。\n\
    \n4. 使用密码 **novell.** 登录 **root**。\n\n5. 通过输入 **runlevel.** 检查之前的和当前的运行级别。\n\n\
    列出运行级别：\n\n| 表 5-2 | 之前的 | 当前的 |\n|---|---|---|\n\n6. 通过输入 **init 5.** 切换到运行级别\
    \ 5。\n\n出现 GUI 登录界面。\n\n7. 使用密码 **novell.** 登录 **geeko**。\n\n## 第二部分：激活 at 服务\
    \ atd\n\n要激活服务 at atd，请执行以下操作：\n\n1. 从终端窗口，使用密码 **novell.** `su` 切换到 root (**su\
    \ -**），密码为 **novell.**。\n\n2. 通过输入 **chkconfig atd -l.** 查看 atd 的当前运行级别配置。\n\n\
    注意所有运行级别的配置均为关闭状态（off）。\n\n3. 通过输入 **inserv -d atd.** 将服务安装到其预定义的运行级别。\n\n4. 通过输入\
    \ **chkconfig atd -l.** 检查修改后的运行级别配置。\n\n注意默认配置将运行级别 2、3 和 5 设置为开启（on）。\n\n5.\
    \ 通过输入 `cd /etc/rc.d/rc3.d` 切换到目录 /etc/rc.d/rc3.d。\n\n6. 通过输入 `ls -l *atd` 列出目录中的\
    \ atd 文件。注意有两个 atd 链接——一个用于启动 atd 服务，另一个用于杀死 atd 服务。\n\n7. 通过输入 `rcatd` 启动服务。\n\
    \n8. 通过输入 `rcatd status` 验证服务是否正在运行。\n\n9. 按 `Ctrl+Alt+F1` 切换到虚拟终端 1；然后登录为 `root`。\n\
    \n10. 通过输入 `init 1` 切换到运行级别 1。\n\n11. 输入 root 密码 `novell`。\n\n12. 通过输入 `rcatd\
    \ status` 检查服务是否运行。该服务列为未未使用（unused），因为它没有被配置在运行级别 1 下启动。\n\n13. 通过输入 `init 5`\
    \ 切回你之前的运行级别 (5)。出现 GUI 登录界面。\n\n14. 使用密码 `novell` 登录 `geeko`。\n\n15. 打开终端窗口并\
    \ `su - 切换到 root`（密码为 `novell`）。\n\n16. 现在使用 `chkconfig` 代替 `inserv` 来配置系统服务。从命令行中，通过输入\
