    \ 字段中输入你的 IP 地址。\n\n12. 在 Subnet Mask（子网掩码）字段中输入 255.255.255.0。\n\n13. 配置主机和名称服务器：\n\
    \   a. 选择 Hostname and Name Server（主机名和名称服务器）。\n   b. 你的主机名应该已经正确填写；如果没有，输入你的主机名和域名\
    \ digital airlines.com。\n   c. 如果选择了 Update Name Servers and Search List by DHCP（通过\
    \ DHCP 更新名称服务器和搜索列表），请点击它取消选择。\n   d. 在 Network Server 1（网络服务器1）字段中输入名称服务器 10.0.0.254。\n\
    \   e. 选择 OK 返回网络设置对话框。\n\n14. 配置路由（routing）：\n   a. 选择 Routing（路由）。\n   b. 在\
    \ Default Gateway（默认网关）字段中输入 10.0.0.254。\n   c. 选择 OK 返回网络设置对话框。\n\n15. 选择 Next\
    \ 返回 Network Configuration（网络配置）对话框。\n\n16. 选择 Next 继续安装；然后再次选择 Next。\n\n"
