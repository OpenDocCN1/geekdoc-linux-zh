    ```\n注意：你的哈希值将与不同。\n\n按下 Esc 并输入 :wq 保存文件。\n\n+   8. 再次挂载根文件系统为只读：\nmount -o remount,ro\
    \ /\n\n如果在下一步重启电脑时文件系统是读写的，则在再次启动时需要进行文件系统检查。\n\n+   9. 重启电脑。\n\n由于你关闭了图形菜单，你会发现现在的启动界面有所不同。\n\
    \n+   10. 如果你想编辑内核命令行，按 p 然后输入在步骤 6 或 7 中使用的密码。简短的帮助文本会告知可用选项。\n\n+   11. 按 b\
    \ 启动电脑。\n12. 撤销 /boot/grub/menu.lst 中的更改：\n\n+   a. 登录 geeko，打开终端窗口，su - 变为 root（密码\
