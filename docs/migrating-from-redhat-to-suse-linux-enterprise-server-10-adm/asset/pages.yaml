  md: '# Migrating from RedHat to SUSE Linux Enterprise Server 10 / Workbook


    # Exercise 4-1 Configure Partitions on Your Hard Drive


    In this exercise, you practice creating partitions and file systems on using YaST
    and fdisk. You also use command line tools to create file systems.


    In the first part of this exercise, use YaST to create the following partitions
    and file systems:


    +   - An extended partition using the remaining disk space.


    +   - One logical partition with a size of 500 MB, an ext2 file system, and a
    mountpoint of /apps.


    +   - One logical partition with a size of 1 GB, a Reiser file system, and a mountpoint
    of /srv.


    In the second part of this exercise, use fdisk to create the following partitions:


    +   - One partition of the partition type Win95/FAT32 with a size of 500 MB


    +   - Two partitions with the partition type Linux and a size of 1 GB and 2 GB,
    respectively


    After this exercise, there should still be space left on the hard disk to create
    additional partitions. If disk space is limited, smaller values for the partitions
    than those given here to make sure there is empty space for later exercises.


    In the third part, you create file systems on the partitions created in Part II,
    using the applicable options for mkfs:


    +   - Create a FAT32 file system on /dev/hda7 (or /dev/sda7, depending on your
    hardware).


    +   - Create an ext2 file system on /dev/hda8 (or /dev/sda8, depending on your
    hardware).


    +   - Create a Reiser file system with a file system size of 625 MB on /dev/hda9
    (or /dev/sda9, depending on your hardware).'
