  md: '# Exercise 2-4 Configure the Password Security Settings


    In this exercise, you practice changing different security settings. Change the
    default behavior when the keys Ctrl+Alt+Del are pressed to halting the machine.
    Also change the encryption from blowfish to MD5. Use the YaST Local Security module
    to do the above.


    # Detailed Steps to Complete this Exercise:


    +   1. Open a terminal window.

    2. Check the setting for the Ctrl+Alt+Del keystroke in the file /etc/inittab by
    entering grep ctraltldel /etc/inittab.

    Note the current setting:

