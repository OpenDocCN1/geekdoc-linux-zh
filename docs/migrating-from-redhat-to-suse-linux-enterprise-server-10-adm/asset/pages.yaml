  md: '# Exercise 2-1


    # Get to Know YaST


    In this exercise, you learn how to use the different user interfaces of YaST and
    how to start some YaST modules. In part I, you start the graphical user interface
    of YaST. In part II, you view the file /proc/version with the YaST system log
    module. In part III, you to set the time. Repeat part I and II with the nurses
    user interface of YaST in part IV and V.


    To use YaST, do the following:


    +   * Part I: Start YaST

    * Part II: View the Content of a System Log File

    * Part III: Change Time and Date

    * Part IV: Start the nurses Interface of YaST

    * Part II: View the Content of a System Log File

    * Part VI: Exit YaST


    # Part I: Start YaST


    To start YaST, do the following:


    +   1. From the GNOME desktop, open the main menu.

    2. Select More Applications.

    3. Enter ya into the Filter text box.

    4. Select the YaST icon to start YaST.

    5. Enter the root password novel in the appearing dialog; then select Continue
    or press Enter.

    nThe YaST Control Center appears.


    # Part II: View the Content of a System Log File


    To view the content of a system log file, do the following:


    +   1. Select Miscellaneous > View System Log.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   2. From the top drop-down list, select /proc/version.

    3. Close the log window by selecting OK.


    # Part III: Change Time and Date


    To change time and date, do the following:


    +   1. Select System > Date and Time.

    2. Select Change.

    3. Enter the current time (such as 08:00:00) and the current date (such as 27/04/2006).

    4. Select Apply.

    5. Select Accept.


    # Part IV: Start the ncurses Interface of YaST


    To start the ncurses interface of YaST, do the following:


    +   1. Switch to the first virtual terminal by pressing Ctrl+Alt+F1.

    2. Log in as root with a password of novel.

    3. View a list of the available YaST modules by entering yast -l.

    4. Enter yast to start the ncurses interface of YaST.


    # Part V: View the Content of a System Log File


    To view the content of a system log file, do the following:


    +   1. Press cursor-down until Miscellaneous is highlighted in the left frame
    and press Enter.

    2. Press cursor-down until View System Log is highlighted in the right frame and
    press Enter.

    3. Press cursor-down until /proc/version is selected and press Enter.'
