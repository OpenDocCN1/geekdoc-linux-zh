  md: "# Exercise 1-1 Install SUSE Linux Enterprise Server 10\n\nIn this exercise,\
    \ you install SUSE Linux Enterprise Server 10. Use the following specifications\
    \ as a guideline:\n\n+   - One partition with 1 GB for swap.\n- One partition\
    \ with 6 GB for / (there should be space left on the hard disk to add partitions\
    \ in later exercises).\n- Use default software patterns, add the C/C++ Compiler\
    \ and Tools pattern\n- root password: novell\n- (As novell is, of course, not\
    \ adequate as a root password in production, you could use a different one; however,\
    \ the exercises in this manual refers to novell as the root password.)\n- Use\
    \ a fixed IP address; the instructor will let you know which to use:\n  - IP address:\n\
    \  - Network mask: 255.255.255.0\n  - Host name:\n    - Domain name: digitalairlines.com\n\
    \    - Name server: 10.0.0.254\n  - Default gateway: 10.0.0.254\n- (In case you\
    \ are doing this exercise in self-study with no other students in the network,\
    \ use 10.0.0.10 as IP address and da10 as hostname.)\n- Use local authentication;\
    \ create a user account geeko, password: novell.\n- Skip the online update"
  merge: -1
  pgno: 7
