  md: '# Exercise 5-1


    # Manage the Boot Loader


    In this exercise, you practice booting into a shell and modifying /boot/grub/menu.lst.


    Enter init=/bin/bash at the boot prompt, modify /boot/grub/menu.lst to require
    a password before kernel parameters can be modified, and test the new GRUB configuration.


    # Detailed Steps to Complete this Exercise:


    +   1. From the terminal window, su to root (su -) with a password of novel.


    +   2. Reboot by entering init 6.


    +   3. When the boot menu is displayed, press the Spacebar to stop the timer.


    +   4. In the Boot Options field type init=/bin/bash; then press Enter.


    +   5. When the bash prompt appears, remount the root partition read-write by
    entering


    ```

    mount -o remount,rw, sync /

    ```


    +   6. Using vi, edit /boot/grub/menu.lst.


    Put a comment sign (#) in front of the line starting with gfxmenu.


    Add the following line beneath it:


    password secret


    +   7. (Optional) To avoid having the password in cleartext in the configuration
    file, you can use an MD5-Hash instead. You can create and include it in the file
    with the following command within vi:


    Press Escape


    Type


    ```

    :r echo -e "secret\nsecret" | grub-md5-crypt

    ```


    # 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
