  md: "# Exercise 2-3 Manage User Accounts with YaST\n\nIn this exercise, you create\
    \ and remove a user account with the YaST user management module. In part I, you\
    \ create a new account labeled “tux” for the user “Tux Penguin” with the password\
    \ of “novell”. In part II, you log in as user tux. In part III, you open the file\
    \ /etc/passwd and look for the entries for geeko and tux. In part IV, you log\
    \ in as geeko and remove tux’s account.\n\nTo manage user accounts with YaST,\
    \ do the following:\n\n+   - Part I: Create a New User Account with YaST\n- Part\
    \ II: Log In as New User\n- Part III: View the passwd File\n\n# Part I: Create\
    \ a New User Account with YaST\n\nTo create a new user account with YaST, do the\
    \ following:\n\n+   1. From the GNOME desktop, select Applications > System >\
    \ YaST; then enter a password of novel and select Continue.\n2. From the YaST\
    \ Control Center, select Security and Users > User Management.\n3. Add a new user\
    \ by selecting Add.\n4. Enter the following information:\n   - User's Full Name:\
    \ Tux Penguin\n   - Username: tux\n   - Password: novel\n   - Confirm Password:\
    \ novel\n5. When you finish, select Accept.\n6. Confirm the password warning by\
    \ selecting Yes.\n7. Save the new settings by selecting Finish.\n8. Close the\
    \ YaST window."
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Part II: Log In as New User


    To log in as the new user, do the following:


    +   1. From the bottom panel, log out by selecting **Desktop > Log Out.**

    2. In the log out dialog, select **OK.**

    X Window is restarted and the GUI login screen appears.

    3. In the Username field enter **tux** and press **Enter.**

    4. In the Password field enter **novell** and press **Enter.**.

    5. Close or cancel any displayed dialogs.


    # Part III: View the passwd File


    To view the passwd file, do the following:


    +   1. Start the Nautilus file manager by double-clicking the **tux''s Home**
    icon on the desktop.

    The content of tux''s home directory is displayed.

    2. Browse to the directory **/home.**

    Notice there are directories for users tux and geeko.

    3. Browse to the directory **/etc.**

    4. Select the file **passwd.**.

    Notice the entries for users tux and geeko at the end of the file.

    5. Close all windows.


    (End of Exercise)'
  merge: -1
  pgno: 21
