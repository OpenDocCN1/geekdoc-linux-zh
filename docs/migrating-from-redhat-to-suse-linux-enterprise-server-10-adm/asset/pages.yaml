  md: '# Introduction


    This workbook is designed to help you practice the skills associated with Migrating
    from RedHat to SUSE Linux Enterprise Server 10 (Course 3068) objectives.


    By covering the administrative details specific to SUSE Linux Enterprise Server
    10, this course prepares you to take the Novell Certified Linux Professional 10
    (Novell CLP 10) certification practicum test—provided you already have the general
    Linux knowledge covered in the courses SUSE Linux Enterprise Server 10 Fundamentals
    (Course 3071), SUSE Linux Enterprise Server 10 Administration (Course 3072), and
    SUSE Linux Enterprise Server 10 Advanced Administration (Course 3073).


    The Migrating from RedHat to SUSE Linux Enterprise Server 10 Course DVD contains
    an image of a SUSE Linux Enterprise Server 10 installation that you can use with
    the Migrating from RedHat to SUSE Linux Enterprise Server 10 Workbook outside
    the classroom to practice the skills you need to take the Novell CLP 10 Practicum


    A VMware image without installed operating system is also provided. You can use
    it to install SUSE Linux Enterprise Server 10 as described in the exercise for
    Section 1.


    ![](img/d3c94bc7006978796634313176d5ffa7_4_0.png)


    Instructions for setting up a self-study environment are in the directory setup
    on the Student DVD.'
  merge: -1
  pgno: 4
- img_proc: true
  md: "# Exercise Conventions\n\nWhen working through an exercise, you will see conventions\
    \ that indicate information you need to enter that is specific to your server.\n\
    \nThe following describes the most common conventions:\n\n+   - *italicized/bolded\
    \ text*. This is a reference to your unique situation, such as the host name of\
    \ your server.\nn  For example, if the host name of your server is DA50, and you\
    \ see the following,\n\n  `hostname.digitalairirlines.com`\n  you would enter\n\
    \  `DA50.digitalairirlines.com`-\n **10.0.0.xx**. This is the IP address that\
    \ is assigned to your SUSE Linux Enterprise Server 10 server.\n\n  For example,\
    \ if your IP address is 10.0.0.50, and you see the following\n\n  `10.0.0.xx`\n\
    \  you would enter\n  `10.0.0.50`- **Select**. The word *select* is used in exercise\
    \ steps to indicate a variety of actions including clicking a button on the interface\
    \ and selecting a menu item.\n **Enter and Type**. The words *enter* and *type*\
    \ have distinct meanings.\n  The word *enter* means to type text in a field or\
    \ at a command line and press the Enter key when necessary. The word *type* means\
    \ to type text without pressing the Enter key.\n\n  If you are directed to type\
    \ a value, make sure you do not press the Enter key or you might activate a process\
    \ that you are not ready to start."
  merge: -1
  pgno: 5
