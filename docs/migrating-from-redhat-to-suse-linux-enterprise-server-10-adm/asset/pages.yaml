  md: 'and press enter.


    There will be some lines of output from grub-md5-crypt in the file, including
    the MD5-hash of your password.


    Delete the lines from the output of grub-md5-crypt except the line with the hash.
    If you still have the line with password secret in the file, delete it, too.


    At the beginning of the line with the hash write password --md5, so that the line
    looks like the following:


    ```

    password --md5 $1$t9kdK1$juAcBOwQFVf3Cl7b.v0

