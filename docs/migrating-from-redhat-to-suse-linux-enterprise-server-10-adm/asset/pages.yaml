  md: "# Exercise 9-1\n\n# Set up an iSCSI Target and an iSCSI initiator\n\nIn this\
    \ exercise, you learn how to set up an iSCSI target and how to access that target\
    \ using iSCSI initiator.\n\nIn part 1, set up an iSCSI target on your machine.\n\
    \nIn part 2, set up an iSCSI initiator that accesses the iSCSI target on your\
    \ own machine.\n\nIn part 3, you work with another student. Set up an iSCSI initiator\
    \ on of your machines that connects to the iSCSI target instead of localhost as\
    \ configured in Part II\n\n# Part I: Set up an iSCSI target on your machine\n\n\
    +   1. Install the needed packages with the command:\n   yast -iscsitarget open-iscsi\n\
    \n+   2. Create an empty file with a size of 1GB used as backend storage:\n  \
    \ dd if=/dev/zero of=/srv/iscsi/ocfs2_disk.img bs=1M\n   count=1024\n\n+   3.\
    \ Open the YaST iSCSI target module by starting YaST and selecting Network Services\
    \ > iSCSI Target.\n\n+   4. On the Service tab, select When Booting within the\
    \ Service Start section.\n\n+   5. Leave the Global unchanged.\n\n+   6. On the\
    \ Targets tab, delete the existing target, then select new and enter:\n   Target:\
    \ iqn.yyyy-mm.com.digitalairlines.daxx\n   Identifier: storage.disk1\n   Lun:\
    \ 0\n   Path: /srv/iscsi/ocfs2_disk.img\n   Select Next.\n\n# 1 HARDCOPY PERMITTED-NO\
    \ DISTRIBUTION ALLOWED"
