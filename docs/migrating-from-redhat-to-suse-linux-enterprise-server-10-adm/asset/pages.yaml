  md: '# Detailed Steps to Complete this Exercise:


    +   - Part I: Boot From the Installation Media

    - Part II: Configure the Partitions for Your Hard Drive

    - Part III: Configure the Installed Server


    # Part I: Boot From the Installation Media


    To boot from the installatin media, do the following:


    +   1. Turn on the computer.

    2. Insert SUSE Linux Enterprise Server 10 DVD into the DVD drive.

    3. (Conditional) If your computer does not boot from the drive, reboot the computer
    by selecting the **Reset** button or by pressing **Ctrl+Alt+Del**.

    4. When the GRUB installation screen appears, select **Installation** with the
    arrow keys and press **Enter**.

    5. From the language selection dialog, select *your language*; then select **Accept**.


    Adjust the BIOS settings so that the DVD drive is the first boot device and reboot
    the computer.


    > Although you can select any available language, the exercises in this manual
    are written for English US.


    +   6. When YaST displays the **Novell Software License Agreement**, select **Yes,
    I Agree to the License Agreement** and then Next.

    7. When the installation mode dialog appears, select **New Installation**; then
    select **Next**.

    8. Select your time zone in the **Clock and Time Zone** dialog. Select UTC and
    adjust the time to your current time, if needed.


    ![](img/d3c94bc7006978796634313176d5ffa7_8_0.png)'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'When done, select Next. An Installation Settings proposal dialog appears.


    +   9. Select Keyboard Layout: Select your keyboard layout; select Accept.


    You are returned to the Installation Proposal dialog.


    # Part II: Configure the Partitions for Your Hard Drive


    +   1. Change the partitioning settings by selecting Partitioning.


    +   2. Select Create Custom Partition Setup; then select Next.


    +   3. Select Custom Partitioning -- for experts; then select Next.


    +   4. Delete existing partitions:


    +   a. From the Expert Partitioner dialog, check for any existing partitions in
    the partition list.

    b. If there are partitions, select the hard disk entry of the corresponding partitions
    (such as hda or hdc).


    +   c. Delete all existing partitions on the selected hard disk by selecting Delete.

    d. When you are asked to confirm the deletion, select Yes.

    e. (Conditional) If there is more than one hard disk containing partitions in
    the system, repeat steps b, c, and d until only the hard disk entries are left
    in the list.


    +   5. Create a swap partition:

    a. From the partition list, select the hard drive entry; then select Create.

    If you have more than one hard disk, select the larger disk.

    b. Select Primary partition; then select OK.

    c. In the End field of the size settings enter +1GB.

    d. From the File file system drop-down list, select Swap.

    e. Add the swap partition by selecting OK.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '+   6. Create the root partition:


    +   a. Select the same hard disk you used for the swap partition;

    select **Create.**


    +   b. Select **Primary partition**; then select **OK.**


    +   c. In the End field of the size settings enter **+6GB.**


    +   d. Make sure that the following options are set:


    +   - **Reiser** should be selected from the File system drop-down list.


    +   - / should be selected from the Mount Point drop-down list.


    +   e. Add the root partition by selecting **OK.**


    +   7. Confirm the partitioning setup and return to the installation proposal
    by selecting **Finish.**


    +   8. From the Installation Settings Overview, select **Accept.**


    +   9. From the confirmation dialog, select **Install.**

    10. (Conditional) If you are using CD YaST asks to change CDs during the installation
    process and the server might reboot when the software from the first CD is installed.


    Insert the requested CDs and select **OK.**


    # Part III: Configure the Installed Server and Domain Name dialog,


    +   1. When presented with the **Hostname** enter the *hostname* in the **Hostname**
    field and digitalairlines.com in the **Domain Name** field.


    +   2. Remove the selection in front of Hostname by DHCP; then select **Next.**


    +   3. You are presented with the **Password** for the System **Administrator**
    “root” dialog. Enter *novell* in the **Password for root** **User** and the **Confirm
    Password** fields.


    +   4. Continue by selecting **Next.**'
