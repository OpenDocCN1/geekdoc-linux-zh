  md: "Migrating from RedHat to SUSE Linux Enterprise 10 / Workbook\n\n# Exercise\
    \ 10-1 Set up an OCFS2\n\nThis exercise builds on the previous one, “Set up an\
    \ iSCSI Target and an iSCSI initiator” on page 9-2.\n\nYou continue to work with\
    \ the partner from Part III of this exercise.\n\nThe purpose of this exercise\
    \ is to familiarize you with OCFS2 for a production environment you would probably\
    \ want some failover capacity (for instance by using DRBD and Heartbeat); this\
    \ is not covered in this course.\n\nIn this exercise, you set up an OCFS2 on top\
    \ of the devices provided by iSCSI as configured in the previous exercise.\n\n\
    +   1. On both computers, install the needed packages with the command:\n   yast\
    \ -i ocsfs-tools ocfs2console\n\n```\nyast -i ocsfs-tools ocfs2console\n```\n\n\
    +   2. On both computers, create an /etc/ocfs2/cluster.conf with the following\
    \ content:\n\n```\ncluster:\n  name = mycluster\n  node_count = 2\nnode:\n  name\
    \ = daxx.digitalairirlines.com\n  cluster = mycluster\n  number = 0\n  ip_address\
    \ = 10.0.0.xx\n  ip_port = 7777\nnode:\n  name = dayy.digitalairirlines.com\n\
    \  cluster = mycluster\n  number = 1\n  ip_address = 10.0.0.yy\n  ip_port = 7777\n\
