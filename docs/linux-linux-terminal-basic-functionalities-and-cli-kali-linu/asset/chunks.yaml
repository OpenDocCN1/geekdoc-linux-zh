- fmt: "\nIn this section, we will go over the basic commands which you will need\
    \ in order to progress through this course. There are 4 basic commands – these\
    \ 4 basic commands are used to navigate within the terminal, to go through the\
    \ file system, to figure out where you are at the moment, to copy things, move\
    \ things, to get listings of files, folders, to see the contents, remove them,\
    \ change the ownership of files or change the modes of files. You will shortly\
    \ see what I mean.\n\nThe following is a complete list of the commands: \n\n-\
    \ `cd`\n- `ls`\n- `pwd`\n- `cp`\n- `mv`\n- `cat`\n- `less`\n- `grep`\n- `echo`\n\
    - `touch`\n- `mkdir`\n- `chown`\n- `chmod`\n- `rm`\n- `man + help`\n\n## Cd\n\n\
    First off we have `cd` which stands for Change Directories. If you just type in\
    \ `cd /home/` and then hit ENTER you are going to navigate over to your home directory.\
    \ So, you are literally changing your work directory by using `cd`.\n\n![C:\\\
    Users\\Garci\\OneDrive\\Pictures\\Screenshots\\Screenshot (31).png](Image00010.jpg)\n\
    \n**Note**: If you type in `cd ..` you will always go one step back. So `..` means\
    \ previous folder. It’s a shortcut you will use often.\n\n## Ls\n\nNext up we\
    \ have `ls`. `ls` shows you the listing off the current folder contents. You can\
    \ also use, for example, `ls /home/` and you get the listing of a specified folder\
    \ as well. Typing `ls` in and of its own will give you the listing of the current\
    \ folder, as opposed to typing `ls` and then a path to a folder, which will give\
    \ you a listing for a specified folder. In addition to that, you also have `ls\
    \ -l` which will give you a long listing which will tell you who the owners are,\
    \ the size, the date, the type, the permissions and so on and forth. However,\
    \ one of the more common usages of `ls` is `ls -la` to show the inner hidden files\
    \ as well.\n\n![C:\\Users\\Garci\\OneDrive\\Pictures\\Screenshots\\Screenshot\
    \ (32).png](Image00011.jpg)\n\n## Pwd\n\nThe third function is `pwd` which stands\
    \ for print working directory. You may find this a bit confusing, but if you notice\
    \ in the images they all have a forward slash. The forward slash symbol `/` in\
    \ all Linux-like systems simply refers to the root directory from where all the\
    \ files are located from where everything begins. So, print working directory\
    \ does exactly what the name itself says, it prints your current working directory.\n\
    \n![C:\\Users\\Garci\\OneDrive\\Pictures\\Screenshots\\Screenshot (33).png](Image00012.jpg)\n\
    \n## Cp\n\nNext up you have your `cp` command, which we have previously used to\
    \ copy Virtual Box Guest Additions from one place to another in [\"Hacking: How\
    \ to Create Your Own Penetration Testing Lab Using Kali Linux 2016\"]https://www.amazon.com/dp/B01MXFX3BM/).\
