    在本节中，我们将介绍学习本课程进所需的基础命令。共有 4 个基础命令——这 4 个基础命令用于在终端内导航、遍历文件系统、确定你当前的位置、复制文件、移动文件、列出文件和文件夹、查看内容、删除它们、更改文件所有者或更改文件模式。你很快就会明白我的意思。


    以下是命令的完整列表：


    - `cd`

    - `ls`

    - `pwd`

    - `cp`

    - `mv`

    - `cat`

    - `less`

    - `grep`

    - `echo`

    - `touch`

    - `mkdir`

    - `chown`

    - `chmod`

    - `rm`

    - `man + help`


    ## Cd


    首先是 `cd`，它代表 Change Directories（更改目录）。如果你输入 `cd /home/` 并按回车键，你将导航到你的主目录。所以，你实际上是在使用
    `cd` 来切换你的工作目录。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (31).png](img/Image00010.jpg)


    **注意**：如果你输入 `cd ..`，你将始终后退一步。所以 `..` 表示上一个文件夹。这是一个你会经常使用的快捷方式。


    ## Ls


    接下来是 `ls`。`ls` 显示当前文件夹的内容列表。你也可以使用，例如 `ls /home/`，这样你就可以获取指定文件夹的列表。单独输入 `ls` 会给你显示当前文件夹的列表，而输入
    `ls` 后接文件夹路径则会给你显示指定文件夹的列表。此外，你还有 `ls -l`，它会给你一个详细列表，告诉你是所有者、大小、日期、类型、权限等信息。然而，`ls`
    的常用用法之一是 `ls -la`，用于显示内部的隐藏文件。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (32).png](img/Image00011.jpg)


    ## Pwd


    第三个功能是 `pwd`，代表 print working directory（打印工作目录）。你可能会觉得这有点困惑，但如果你注意图片，它们都有一个正斜杠。在所有类
    Linux 系统中，正斜杠符号 `/` 指向根目录，这是所有文件所在、一切一切开始的地方。所以，打印工作目录的功能正如其名称一样，它打印你当前的工作目录。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (33).png](img/Image00012.jpg)


    ## Cp


    接下来是你的 `cp` 命令，我们之前在 ["Hacking: How to Create Your Own Penetration Testing Lab
    Using Kali Linux 2016"](https://www.amazon.com/dp/B01MXFX3BM/)中使用它将 Virtual Box
    Guest Additions 从一个地方复制到另一个地方。它非常简单。你输入 `cp /path`。例如，如果我输入 `cp LinuxAdditions.run`
    并且我想把它复制到 `/var/`，我会输入 `cp -v VBOXLinuxAdditions.run /var/`。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (34).png](img/Image00013.jpg)


    **注意**：`-v` 非常有用，它会告诉你机器目前正在做什么（你不会感到困惑或认为它卡顿或崩溃了，因为你会得到状态更新）。你不需要它，但它非常有益，特别是对于等待时间较长的大文件。`-v`
    告诉机器正在做什么，但如果你不需要实时状态更新，可以输入 `cp VBOXLinuxAdditions.run /var/`。


    你可能已经注意到，到目前为止的所有命令以及我们将介绍的其余命令都有自己的参数，可以通过传递参数给它们来修改命令的功能。你可以在终端中查看这些参数的列表，而不是死记硬背。所以以
    `cp --help` 为例，这是在终端内获取某个主题帮助的通用方法。你输入命令、一个空格、然后是 `--help`，按回车，你将得到一个可能的列表。它看起来有点杂乱且难以查看，但如果你向上滚动，就可以看到所有的参数。它们在这里都清晰地列出。左侧是参数（红色），右侧是该参数作用的解释（黄色，请参考下图）。最好是在你学习课程的过程中，通过练习这些命令来学边记这些，而不是试图一次性记住所有内容。你越经常使用这些命令，就会越能记住它们，而不需要刻意为，可以说你正在缓存这些信息（哈哈）。


    ![C:\Users\Garci\AppData\Local\Microsoft\Windows\INetCacheContent\Word\Screenshot
