    not be able to recover them. There are some complex procedures that might be able
    to give you a fraction of what you wanted to recover, but if you remove it from
    the terminal it is very difficult to recover. It’s not like windows or something
    of a kind when you delete something in windows, you can always recover, you basically
    didn’t even delete it. You just don’t see it anymore. But here, when you delete
    something its gone permanently. So, take great caution, take care but don’t be
    afraid. Over a period of time, these things become second nature to you. You will
    take it into consideration without even thinking about it.


