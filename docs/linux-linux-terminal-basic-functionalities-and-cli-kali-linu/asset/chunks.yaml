    默认情况下，它在 Kali 中打开一个 root 终端。因此，如果你出于自定义或个性化的考虑想进行配置，我们将介绍如何操作。如果你不想配置，那完全没——你不需要这样做。除了上面看到的之外，你实际上不需要对终端做任何其他操作，它的默认外观和设置运行良好。然而，99%
    的情况下，人们都有兴趣根据自己的需求和目的配置终端。例如，我本人几乎总是增大字体大小，使其清晰可见，让我更清楚地看到当前正在做什么，而且根据某些文章这还能减轻眼睛疲劳。


