    imagine yet – that is the command “rm” . “rm” is basically remove. Once you remove
    things with this commands it is next to impossible to recover anything from it.
    So, if I type in “rm test.sh” it is going to remove it and it is no longer going
    to be there. If you try to remove a directory using “rm” you will not be able
    to do it because it also serves as a failsafe. So, you wouldn’t delete a full
    directory because you wouldn’t be able to recover it and that would be bad. When
    you are using “rm” you always want to be asked questions.


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (46).png](Image00025.jpg)


    Man + help


    If you get stuck don’t worry about it, I get stuck all the time. But if you get
    stuck and you don’t know what to type in or what argument to pass, just type in
    “—help” and look at what you can type, read a little bit and then use the options.
    Try it out, sometimes it will work, sometimes it won’t, often, you will be able
    to figure it out from the help menu. If you can’t figure it out from the home
    menu just type in “man rm” and you can read pretty much everything there is to
    know about a command here. And if you can’t perform the task, if you can’t find
    anything useful here, forums are your next best bet. Trust me you will succeed
    in doing it.


