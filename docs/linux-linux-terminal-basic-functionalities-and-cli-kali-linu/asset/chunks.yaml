    `less` 与 `cat` 非常相似，它会向你显示内容但在终端内部创建一个新的工作空间，当你按下键盘上的 `q` 键时，它将退出不再显示任何内容。因此，在整洁和有序方面来说，它是非常好用的。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (38).png](img/Image00018.jpg)


    ## Grep


    列表中的下一个是 `grep`，它是用于从其他内容中提取（`grep`）某些内容的。Linux 是大小敏感的，所以当你进行 grep 操作时，它会检查你搜索的是小写还是大写。`Grep`
    非常重要；它是 Linux 终端中与 `cat` 和 `less` 一样用于过滤文本文件的重要部分。如果你继续学习这门课程，在某个时刻你将进行大型网络扫描，你需要创建文件并从中提取有用信息，稍后会将这些信息传递给其他工具以便后续操作。好的！


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (40).png](img/Image00019.jpg)


    ## Echo


    接下来是 `echo` —— 输入 `echo "I am alive"`，它就会回显这些词 —— 它字面意思就是回声。当你向它输入内容时，它会将你输入的词回显给你。


    注意：通过使用键盘上的向上和向下箭头键，你可以在过去的命令之间滚动。`Echo` 是一个非常好用的命令，你可以用它更改变量名和值。随着课程的进行，我们将更多地使用它，届时我们会有直接与我们正在操作的内容相关的清晰示例，我们基本上是渗透测试，然后你将看到这些命令更高级的用法——尤其是
    `grep`。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (41).png](img/Image00020.jpg)


    ## Touch


    `Touch` 是创建文件的快速方法。例如，我可以输入 `touch file1 file2 file3` 并按下回车键，然后输入 `ls`。你会看到它立即创建了
    3 个文件。这是一个创建你所需的任意数量文件的非常快速的方法。你还可以指定文件夹路径。你可以在 home 目录下创建 `file1`，在 var 目录下创建
    `file2`，在 varlog 目录下创建 `file3`，以此此类推。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (42).png](img/Image00021.jpg)


    ## Mkdir


    接下来是 `mkdir`，它代表 Make directory（创建目录）。所以，如果你输入这个命令，你就在创建某种目录。`mkdir name of directory`
    然后按回车并 `ls`，它会显示该文件是一个目录，即上面的 `name of directory`。我甚至可以进入它——里面什么都没有，但你明白意思。你可以以这种方式创建目录。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (43).png](img/Image00022.jpg)


    ## Chown


    `Chown` 代表 change ownership（更改所有者）。它允许你更改文件的所有者。现在我们这里只有一个用户，即 `root`，所以这样做没有意义。除非我们创建了一些其他新用户——然而我们并不需要他们。但为了向你演示它是如何工作的，例如，如果文件的所有者不是
    `root` 而而你想将其更改为 `root`，你需要执行以下操作。


    输入 `chown`，然后输入用户名 `:` —— 冒号和用户组。通常用户组和用户名是相同的，除非你有一些更大的服务器之类的东西。然后只需指定文件名即可。你可以输入
    `test` —— 这将有效地将文件 `test` 的所有者更改为用户名 `root`，它属于 `root` 用户组。如果我执行 `ls la`，它会统计所有者是谁以及哪些组拥有文件。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (44).png](img/Image00023.jpg)


    ## Chmod


    `chmod` 是另一个更常用的命令。该命令允许你更改文件权限。这是你每天且经常需要用到的东西。随着教程的进行，我们将更深入地处理它。你还需要熟悉 bash
    脚本。Bash 脚本就像终端本身一样——所以终端中使用的几乎所有命令都可以在脚本中使用。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (45).png](img/Image00024.jpg)


    ## Rm


    我想要向你展示还有最后一个命令，这确实是一个非常危险的命令，它可能会以你现在无法想象的方式让你陷入麻烦——那就是 `rm` 命令。`rm` 基本上是 remove（删除）。一旦你用这个命令删除东西，几乎无法从中恢复任何内容。所以，如果我输入
    `rm test.sh`，它将被删除，并且将不再存在那里。如果你尝试使用 `rm` 删除目录，你将无法做到，因为它也起到安全保护的作用。所以，你不会删除整个目录，因为你无法恢复它，那样会糟糕。当你使用
    `rm` 时，你总是希望系统进行询问。


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (46).png](img/Image00025.jpg)


    ## Man + help


    如果你遇到困难不要担心，我经常遇到。但如果你在这里找不到任何有用的东西，不知道输入什么或参数，只需输入 `help` 查看。论坛是你的下一个选择。相信我，你会成功的。


    `cd`


    `ls`


    `pwd`


    `cp`


    `mv`


    `cat`


    `less`


    `grep`


    `echo`


    `touch`


    `mkdir`


    `chown`


    `chmod`


    `rm`


