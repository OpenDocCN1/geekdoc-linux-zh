    Cat


    Next up we have “cat”. “cat” shows you the entire contents of the file (whatever
    that might be) it is very good for files that you do not wish to make any accidental
    changes to but you want to quickly see what is located within a file.


    Note: Terminal text editor Nano is a good text editor from the terminal. You will
    need to learn how to use the terminal’s text editors because you don’t want to
    be switching back and forth between GUI text editor’s and working on something
    on a terminal. It’s extremely time consuming plus, here on Kali Linux, you can
    edit things in root. However, if you are using some other distribution or something
    of a kind, most of the GUI text editors will not be able to run as root. You will
    get an error message. So, that can be a bit problematic. That’s why you should
