    \ and type in `cp VBOCLinuxAdditions.run` and if I want to copy it to `/var/`.\
    \ I will enter it as `cp -v VBOXLinuxAdditions.run /var/`.\n\n![C:\\Users\\Garci\\\
    OneDrive\\Pictures\\Screenshots\\Screenshot (34).png](Image00013.jpg)\n\n**Note**:\
    \ the `-v` is very useful to have, it tells you what the machine is currently\
    \ doing (you won’t get confused or think that it has lagged or crashed because\
    \ you will have a status update). You don’t need it, but it is very beneficial\
    \ to have especially for large files with a longer wait time. The `-v` tells you\
    \ what the machine is doing, but you can enter it as `cp VBOXLinuxAdditions.run\
