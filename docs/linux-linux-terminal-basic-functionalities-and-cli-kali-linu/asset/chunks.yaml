    Kali Linux 上，你可以以 root 身份编辑内容。然而，如果你使用其他发行版或类似的，大多数 GUI 文本编辑器无法以 root 身份运行。你会收到错误消息。所以，这可能会有点麻烦。这就是为什么你应该始终学习如何使用来自终端的文本编辑器。


