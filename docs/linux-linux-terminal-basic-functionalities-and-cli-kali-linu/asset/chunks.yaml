    如果你在这个帮助菜单上向上滚动，你会遇到“Usage”（用法）。在 Usage 中，你可以获得命令的格式或语法。基本上，`cp [option]… ([-T]
    指定你的源和目的地)` 非常简单。（见下图）


    ## Mv


    列表中的下一个是 `mv`，它代表 move（移动），也可以重命名文件夹和文件。要重命名文件，你必须输入 `mv file.ext newname.ext`。由于我想把它移动到主目录，我会输入
    `mv RandomSoRandom.run /home/`


    **注意**：当你使用 `mv` 删除某些东西或将某些东西覆盖时，恢复是非常困难的，如果不是不可能的话。此外，在 Linux 中删除文件要非常小心——一旦你在终端中删除了它们将无法恢复。


    ## Cat


    接下来是 `cat`。`cat` 显示文件的全部内容（无论文件是什么），它非常适合不想进行任何意外更改但想快速查看文件内容的情况。


