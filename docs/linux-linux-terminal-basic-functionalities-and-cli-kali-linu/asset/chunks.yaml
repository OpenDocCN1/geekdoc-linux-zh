    # Introduction to the Linux terminal


    In this section I am going to introduce you to the Linux Terminal and show you
    some of its basic functionalities. To start off in Kali Linux, the terminal Icon
    is in the upper left corner, if you currently have it open it would be best to
    follow along with this course, you will have a much better understanding and be
    more familiarize with Linux at a quicker rate. If not, you can still follow along
    this course no problem. If you are following along with your device, you can go
    ahead and click on the terminal button. (The terminal button is circled in red
    in the next image)


    ![](Image00003.jpg)


    This will open the terminal:


    ![](Image00004.jpg)


    By default, it opens a root terminal in Kali. So, if you want to configure it
    for customization or personalization reasons we will go over how to do it. If
    you do not want to configure it, this is perfectly fine – you do not have to. 
    You don’t actually need to do anything else to the terminal beyond what you see
    above, it works just fine with its default looks and settings. However, 99% of
    the time people are interested in configuring the terminal to suit their own needs
    and purposes. For example, I for one will almost always increase the font size,
    so that it is clear and visible and so that I have a better overview of what I
    am doing at the moment and it also reduces eye strain according to some articles.


    To configure the terminal, you can go ahead and right click anywhere in the terminal
    and click on “show menu bar”. (see images below)


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (24).png](Image00005.jpg)


    ![C:\Users\Garci\AppData\Local\Microsoft\Windows\INetCacheContent.Word\Screenshot
    (25).png](Image00006.jpg)


    Now that the menu bar is visible, go ahead and click on “edit” and then “profiles
    preferences”. This next menu will then show up:


    ![C:\Users\Garci\AppData\Local\Microsoft\Windows\INetCacheContent.Word\Screenshot
    (27).png](Image00007.jpg)


    From here you are given a great deal of options. One of the first you will see
    is that you can use a System Fix Width Font, if you click on “Monospace|20” you
    can change the font and the size here to your preference. You can also change
    the cursor shape, title of a command (tab), color change (tab), and the background
    (tab). On the background tab, you have 3 features, you can have a loid change
    of color, download any image from the internet to paste as your back ground, and
    you can even configure the level of transparency for your terminal. Something
    really cool here, is that you also have the option to have a fully transparent
    back ground. In the scrolling tab, there is another important feature, it is called
    “Scrollback” which is best kept checked “unlimited” unless you are severely limited
    in terms of Ram. All in all, you have the power to fully customize the terminal
    to any extreme liking.


    Now that we have covered how to modify your terminal with various options per
    your liking and preferences. We can move on to the next very helpful tip: Open
    tabs in your terminal (same window) as opposed to having various terminal windows
    opened simultaneously. To open a new tab, you can go ahead and click on “File”
    and then “Open Tab” you can have various tabs of your terminal listed here (refer
    to image below) instead of having terminal windows open all at once. It is very
    easy to get confused trying to figure out which window is which or what you were
    doing on which one.


    With tabs:


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (28).png](Image00008.jpg)


    Without tabs:


    ![C:\Users\Garci\OneDrive\Pictures\Screenshots\Screenshot (30).png](Image00009.jpg)


    If you don’t have the taps it is not actually very manageable to work on. Primarily
    because as previously mentioned there is a high risk of confusion between having
    many terminals opened at once. Having these tabs available at your disposal is
    going to help you out a lot as you progress through this course series and as
    you get into more complicated stuff.


    Anyway, I just wanted to introduce you to the Linux Terminal. We have done some
    work with it before during the installation of Virtual Box and Virtual Box Guest
    Additions in [“Hacking: How to Create Your Own Penetration Testing Lab Using Kali
    Linux 2016”](https://www.amazon.com/dp/B01MXFX3BM/) but in there I mainly just
    gave you the commands and you basically just rewrote them or copy and pasted them
    and that was the end of it, but here in the next section I will start explaining
    the fundamental Linux Terminal Commands starting from the most common and basic
    ones and from there you will be able to see the logic of things and how this Linux
    Terminal works along with its functions. Once you learn these commands they will
    give you a HUGE amount of power.


    All the power of your operating system rests on its terminal because it is a direct
    interface to the kernel of the system and it’s a lot faster than the graphical
    interface.


    As a final keynote, once you learn how to use the Linux Terminal and get into
    the habit of typing in commands you will be able to use them for a wide variety
    of purposes including but not limited to penetration testing.  You will be able
    to use these commands beyond pen testing, for such things such as network administration,
    system troubleshooting, etc. so you are actually learning code for a wide spectrum
    of options and career opportunities as opposed to just learning this for penetration
    testing only.


