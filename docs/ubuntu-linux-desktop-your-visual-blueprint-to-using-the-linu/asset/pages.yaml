    # Extra


    You can add additional identifiers to a key to both enhance its usefulness and
    make it more user-friendly. You can add a user ID by using the options on the
    Names and Signatures tab of the key''s Properties dialog box. You access the Properties
    dialog box by right-clicking the key and clicking Properties.


    A user ID typically consists of your full name and your email address. The Full
    Name entry does not technically have to be complete, first, and last names, but
    you must enter at least five characters in this field. Note that using your real
    name will make it easier for people to find your key if it is published among
