  md: '# # Add or Remove Applications


    Probably at some time during your first month of using any operating system, you
    will realize that there is an application that you need was not part of the initial
    installation. You can use the Add/Remove Applications program to quickly install
    and applications. Or if you want to remove an application that is already installed
    you do not need or, you can remove it quickly and easily.


    This interface is similar to much more friendly than the Synaptic Package Manager,
    and it allows for a more palatable selection of the applications and even a popularity
    indicator to show how often others request the same program to be installed.


    When the Add/Remove Applications program launches, it first verifies if the list
    of available applications is up-to-date. You may need to reload the list if you
    have an Internet connection. It presents you with categories of applications,
    a search box to find specific application by name, and an option to limit the
    available applications to those supported by Canonical or third parties, or any
    package known to the Ubuntu


