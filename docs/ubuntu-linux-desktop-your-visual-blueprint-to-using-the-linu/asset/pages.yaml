- pgno: 141
  md: "# # Observe System Performance with the System Monitor\n\nThe System Monitor\
    \ provides valuable insights into your Ubuntu's performance and helps you isolate\
    \ and deal with problems. Not only does this application provide useful information,\
    \ but it can also help you prevent and recover from hardware and software crashes.\n\
    \nThe Processes tab lists all the active processes in the system. The chart shows\
    \ the process name, along with its status, CPU and memory usage, and several other\
    \ statistics of less importance. You can sort the list by clicking the column\
    \ headings.\n\nWhen the System Monitor application opens, you will see four tabs\
    \ at the top of the window: System, Processes, Resources, and Files. The default\
    \ view is the Resources tab, which gives you a real-time look at what is happening\
    \ with your system. The top line, labeled CPU History, the Memory and Swap History\
    \ tells you about memory usage. The Network History chart at the bottom gives\
    \ insight into the network activity, any of your computer.\n\nThe System tab displays\
    \ information about your system, including Ubuntu version, your Linux kernel,\
    \ and available disk space.\nThe Files tab provides a summary of information about\
    \ all the drives on your computer. This tab is useful as it gives you a quick\
    \ view of all the drives on the system, along with their free space.\n\n# Observe\
    \ System Performance with the System Monitor\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_141_0.png)\n\
    \n+   1 Click System $\rightarrow$ Administration $\rightarrow$ System Monitor.\n\
    \nThe System Monitor opens to the Resources tab.\n\n+   2 Check the information\
    \ to see your system's CPU load, memory usage, and network activity.\n\n+   3\
    \ Click the Processes tab.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_141_1.png)"
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Processes tab comes to the front.


    To stop a process, first right-click it.


    # Click Stop Process.


    +   - The process will be suspended until you click Continue Process.


    # Click the System tab.


    The System tab comes to the front.


    Check out the information about your version of Ubuntu, RAM and processor, and
    available disk space.


    Click here to close the window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_142_0.png)


    # Apply It


    If you have a piece of software that has failed and is causing you problems, you
    can use the Processes tab to locate and disable the software. You will want to
    do this when this piece of software will not close or has frozen and ceased to
    operate properly.


    View the list of processes on the Processes tab and look for the name of the software
    that is causing the problem. Right-click the name of the process. If you are not
    certain if the process you have selected is the source of the problem, select
    Stop Process and view the impact on system. If stopping the process does not solve
    the problem, the process is unlikely to be the cause of the problem. Choose Continue
    Process and look for another cause.


    When you find the source of the problem, right-click it and choose End Process
    for an orderly shutdown of the process. If that fails, select Kill Process, which
    is a more abrupt cancellation.


    The selective use of this feature makes it possible to regain control of your
    computer with a minimum of disruption.'
  merge: -1
  img_proc: true
- pgno: 143
  md: "# # Adjust the Time and Date\n\nYou can use the Time and Date utility on Ubuntu\
    \ desktop to adjust the date, time, and time zone.\n\nTime settings can be adjusted\
    \ from the clock on your taskbar or from your System menu. Although adjusting\
    \ settings from the top taskbar may be faster, lasting changes to the system are\
    \ best executed from the Time and Date settings under the System menu.\n\nThe\
    \ Time and Date Settings dialog box is used to control the system clock, and that\
    \ means modifications require a user with administrator access. The administration\
    \ is initially locked. When you unlock it, the system will prompt you for your\
    \ username and password. That is, after your credentials are\n\nauthenticated\
    \ by the system, the Time and Date Settings will be editable.\n\nYou can select\
    \ your time zone by clicking the Time Zone dialog box. You can click on a location\
    \ on the map to set the zone, or use the drop-down list at the bottom of the dialog.\n\
    \nIn the Configuration drop-down list of the Time and Date Settings dialog box,\
    \ you can select either a manual setting of the time or an automatic one, which\
    \ will keep your system's time synchronized with Internet servers. Note to use\
    \ automatic synchronization, you must have the NTP server plug-installed on your\
    \ machine.\n\nIn the calendar at the bottom of the Time and Date dialog box, you\
    \ can select the current month, and year.\n\n# Adjust the Time and Date\n\n+ \
    \  1 Click System $\rightarrow$ Administration $\rightarrow$ Time and Date.\n\n\
    ![](img/b68319171116e7cb6d71d28d5b12e08c_143_0.png)\n\nThe Time and Date Settings\
    \ dialog box opens.\n\n+   2 Click Unlock.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_143_1.png)"
  merge: -1
  img_proc: true
