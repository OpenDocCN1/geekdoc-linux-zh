    Mouse in and out of the two windows to see the focus follow the mouse pointer.


    Close both applications.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_114_1.png)


    # Extra


    Ubuntu actually comes with two different window managers. The basic one is called
    *Metacity*, and it serves the window management role in a very traditional manner,
    keeping track of windows and providing the basics for moving, sizing, closing,
    and all the usual window management activities. The second window manager on Ubuntu
    is Compiz. Compiz offers all the eye-candy effects that are so popular in desktop
    environments today—animated menus, sliding effects, transparency, and much more.
    It is also the gateway to the infamous desktop cube effect, which takes four workspaces
    and places them on a 3D cube that you can rotate on your screen to switch between.
    If you have not seen it, check out YouTube to see how it looks—for example, youtube.com/watch?v=TeKh4r5Co.
