  md: '# # Change the Screensaver


    One of the frequently modified settings on a personal computer is the screensaver.
    The screensaver was originally created to cause the computer to display an image
    on the screen that the contents of the current desktop were "burned" into the
    phosphors of the display. Modern CRT displays do not suffer nearly much as older
    monochrome displays could be burned by continuous image display in applications
    as kiosks and electronic advertisement. LCD monitors prevent such vulnerability
    and are quite incapable of having this type of hysteresis.


    screensaver, the currently selected "hack," as it is sometimes termed by the Linux
    community, will be displayed in a small window of the Screensaver Preferences
    box. By flipping through the items in the list, you can find a screensaver that
    you want to use. Which screensaver is selected when you close the dialog box will
    then be used whenever the machine is determined to be idle. You can adjust the
    inactivity that determines when the machine is idle as well. You may also disable
    the screensaver activity by checking the Activate box. It is advisable, not always
    convenient, to enable the locking of the screen when the screensaver is activated.
    This helps to secure your computer from others when you step away.


    The Preferences dialog box enables you to change the screensaver your computer
    will use when idle. It also allows you to set a blank screen or a random screensaver
    as your choice. When you are selecting


    +   1. Click System -> Preferences -> Screensaver.


    +   2. Select a screensaver.


    +   3. A preview of the new screensaver appears here.


