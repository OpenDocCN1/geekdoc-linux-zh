  md: '# Create, Rename, and Manage Folders


    Files have a tendency to proliferate on a system during use. This being the case,
    you will want to organize your files in some fashion. You can organize your files
    into groupings within directories in the file system. These directories are referred
    to as *folders* in the GNOME environment.


    For example, the GNOME system allows assignment of graphical icons to the folders.
    There are a standard set of decorative elements that can be added to the default
    image for a folder.


    You can also attach notes to folders or any file type item. This enables you to
    annotate the file with any comments you may want to keep the contents.


    You can open a folder''s Properties dialog box to adjust the file permissions
    for it, allowing for read, write, and


    privileges to be assigned. You can also change the group that the folder belongs
    to.


    If you want others to read or write to your folder from the network, you can share
    the folder.


    From a folder''s context menu, you can create an archive in various formats. The
    archive can be compressed or not depending on the format chosen. The zip format
    is simple uncompressed. The famous Phil Katz compressed archive format. This format
    is quite the most popular archive in history. Then there are jar, and war formats,
    which are derivatives from the pkzip format, and compressed variants of the tar
    format. The tar.bz2 is simply a bz2 compressed file. The tar.lma is the Lempel-Zip
    compression algorithm applied to the archive. The tar.gz, sometimes named .tgz,
    is the gzip format applied to the archive.


