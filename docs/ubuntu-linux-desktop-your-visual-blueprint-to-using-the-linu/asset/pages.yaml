- pgno: 156
  md: 'The result appears in the left pane.


    # CHANGE THE SOURCE


    +   Click View -> Dictionary Sources.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_156_0.png)


    +   The optional dictionary sources appear in the right pane.


    +   Double-click the dictionary that you want to use.


    +   The chosen dictionary is now the source that will be searched.


    # Extra


    The system''s default dictionary sources can be viewed from the Preferences dialog
    box, under the Edit menu. If you open the right pane of the Dictionary application,
    you can also select the dictionary sources from the list. The Preferences dialog
    box gives you the option to switch between dictionaries or to add or remove sources.


    The Ubuntu Dictionary application relies on network protocol commonly known as
    DICT. You can add to your Ubuntu system any dictionary source that uses the DICT
    server protocol. For a list of alternative dictionary sources, try the Wikipedia
    page on DICT, which can be found at http://en.wikipedia.org/wiki/DICT.


    Before you add a new source, take a look at the existing sources to determine
    what information is needed to list a new source. Given that the dictionary sources
    are not stored on your local machine and therefore do not take up any disk space,
    you should feel free to add as many sources as you like, and similarly, it is
    probably not worthwhile to delete any of the default sources in case you need
    them at some future point in time.'
  merge: -1
