  md: '# installation begins.


    Note: This can take from 10 to 40 minutes, depending on your machine''s CPU and
    disk capabilities.


    When the installation is finished, the Installation Complete dialog box appears.


    +   Click Restart Now.


    Note: Remove the CD from the machine before the next boot.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_26_0.png)


    # Extra


    Choosing a strong password is essential to keeping your system safe. There are
    a couple general principles to help avoid your password being compromised. The
    longer the password, the harder it will be to crack it with brute force. For example,
    if you have a three-digit password that is only made up of numbers, then it can
    be cracked in under 1,000 tries. If the number of digits is longer, obviously,
    it will take more tries to crack. The same principle applies to the characters
    you use. To make your password strong, use different types of characters. Use
    numbers, letters of both upper- and lowercase, and punctuation. This greatly increases
    the number of tries to crack a password by brute force.


    Hackers are aware of these strategies, however, and try to skew the odds in their
    favor by using dictionaries of common passwords and variations on them to reduce
    the number of tries needed. To thwart this type of attack, avoid proper nouns
    and words that can be found in the dictionary. A common technique is to use the
    first letter of each word of a phrase to allow for a combination of letters not
    common in any language.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # Log Into/Out of the System for the First Time


    After you have completed the initial installation, you should get in and take
    a look around your fresh Ubuntu Linux system.


    When Ubuntu boots up, it brings up the login screen. You will need to provide
    the login and password you used during installation in order to gain access to
    the system.

    A couple options present themselves to you on this first session. From the Options
    menu, you can select a different language to use during your session. You may
    also select from a variety of options for starting your session. Most of these
    options allow you to log in in any other way, and a couple have some additional
    utility. One of the options is the ability to log into other machines with the
    secure shell (SSH) protocol. Although this sounds very useful, it is limited to
    only users who have an account on the local machine.

    **Log Into/Out of the System for the First Time**


    Another useful option is the ability to connect to remote machines that are running
    XDMCP. XDMCP is a protocol for establishing remote X connections. The host computer,
    not the one you are using, broadcasts its availability on the network, and dedicated
    X terminals allow you to select from an available host and initiate a login. The
    X11 session is directed to this X terminal as if the session were running on the
    console of the host. Using this option on Ubuntu allows an Ubuntu desktop to be
    used just like a dedicated terminal.


    Other options are pretty much standard login screen types of operations. These
    include restarting or shutting down the machine, along with sending the machine
    into either hibernation or suspend (standby) modes.


    # ## LOG IN


    +   - Type in the username you created during installation and press Enter.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_27_0.png)


    +   - Type in the password you chose during installation and press Enter.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_27_1.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Ubuntu desktop launches.


    # Chapter 1: Getting Started with Ubuntu


    # LOG OUT


    +   - Click the Quit applet.


    +   - Click Log Out.


    You are logged out of the system.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_28_0.png)


    # Extra


    When logging out, notice the other options presented. Ubuntu allows for you to
    switch to another user without having to log out. This is especially handy when
    you are sharing a computer. The most important option on the logout display is
    the Lock Screen option. Locking the screen when you are away from your computer
    is a good line of defense against hacking. Most hacking in corporations happens
    within the confines of the company itself, rather than a person or persons on
    the Internet. Good security starts right at your computer. Whenever you are not
    at your computer, lock the screen. Then you will not have to worry about others
    looking at, editing, or — worse accidentally deleting your files.


    Another useful option is hibernation. This choice puts the computer to sleep without
    shutting down completely. If you have never used hibernation before, consider
    it because it is a great way to be able to shut down your machine and conserve
    either AC line power or battery power without losing your place within your work.
    When a machine is hibernated, it is completely shut off, drawing no power.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # Organize Desktop Icons and Panels


    You can reorganize the GNOME desktop to suit your own tasks. If you configure
    your desktop more intuitively, you can increase your productivity by having files,
    folders, and icons located conveniently for rapid access.


    The GNOME desktop is organized in the same manner as other computer systems, such
    as Windows or Apple''s MacOS. The desktop of icons across the surface of the screen
    or one or more panels about these edges can be moved by dragging them around the
    desktop surface or into a panel.


    Another option is Create Folder. With this, you can create new directories directly
    within the Desktop folder.


    If you have any document templates installed, you will also have the option to
    select the document and create a document with that template. There are no default
    templates installed with Ubuntu, but you can use the Create option to create an
    empty file on the desktop surface.


    There are several housekeeping items on this right-click menu as well. Clean Up
    by Name arranges all the icons on the desktop surface alphabetically against the
    top left of the screen. Keep Aligned aligns the icons according to an invisible
    grid that each icon gravitate towards during a drag operation.


    You can also access a dialog box to change the background image and color of the
    desktop surface.


    On any unoccupied desktop surface, you can right-click and get a menu of icons.
    One of these options is Create Launcher. A *launcher* is a small text file that
    operates as a shortcut to a program or file.


    # ## Organize Desktop Icons and Panels


    # ### ADD A LAUNCHER


    +   1 Right-click any unoccupied desktop area.


    +   2 Click Create Launcher.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_29_0.png)


    The Create Launcher dialog box appears.


    +   3 Type the name of the application for which you would like to create a launcher,
    such as *xEyes* in this example.


    +   4 Type the command to launch that application, such as *xeyes* in this example.


    > Note: You can find a description of launcher commands online at https://help.ubuntu.com/7.04/user-guide/C/launchers.html.


    +   5 Click OK'
  merge: -1
