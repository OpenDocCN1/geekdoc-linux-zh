- pgno: 209
  md: '# Compose and Send Email


    you can use Evolution to create new messages and send them to others.

    To create a new message, you can follow the steps here or press Ctrl K at the
    time you press the N key. Type the address of the recipient and a subject line
    for your email in the next field. The body of the message goes in the large text
    field at the bottom of the Compose Message window.

    When you send your message, you must connect to the Internet, and account settings
    must be correct for the email to go out. If there are problems with your account
    settings or if you are not connected to the Internet, the system displays an error
    message, and your email will be saved in the Outbox.


    Messages queued in the Outbox can be sent by clicking the Send/Receive button.

    There are several options on the Compose Message window. Save Draft saves your
    message to the Draft folder, where it can be edited later. The Attach button files
    files you select for your message; these files are sent with the message to the
    recipient. Undo and Redo are also editing tools that undo the most recent step
    you have taken or redo. The Cut button is for cutting out of a message. Note the
    arrow on the right of the toolbar. Clicking the arrow displays other options,
    including copy, paste, and a search.


    # Compose and Send Email


    +   1. In Evolution, click the drop-down arrow → Mail Message.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_209_0.png)


    +   2. Type the recipient''s address.


    +   3. Type the subject.


    +   4. Type your message.


    +   5. Click Send.


    Evolution attempts to send the email.


    > Note: For this step to work, you must be connected to the Internet, and your
    outgoing mail server account settings must be correct.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_209_1.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Click the Sent folder.


    The sent message appears in the listing on the right.


    Click the message.


    The contents of the message appear.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_210_0.png)


    # Extra


    The menus at the top of the Compose Message window includes a number of important
    options and features. The File menu repeats several of the options that you see
    on the main toolbar also includes the option to create a template of one email
    and the Print commands. The Edit menu lists a number of editing options – all
    common text-editing features that you would see in a text-editing or word-processing
    program. Note that there is a check option at the bottom of this menu. The View
    menu shows the address of fields. By default, only the From, To, and Subject fields
    are active, but from this menu you can add a CC or BCC field. Insert includes
    the attachment controls as well as the ability to request receipt for your emails
    and to mark your messages as a priority. Format lets you switch between the Plain
    Text and HTML formats for your messages. HTML gives you better control over the
    appearance but may not be supported by all your recipients. The Security menu
    offers options for encrypting your messages.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # Receive and Reply to Email


    You can receive emails from others and reply to them easily using Evolution. Replies
    to the sender of the original email or to everyone on the recipient list.


    When you check for mail, Evolution checks your mail server for new messages and
    if any are present, downloads them to your Evolution email client. Note that you
    must be connected to the Internet for this work.


    New mail appear in your Inbox being highlighted in bold on the screen. This highlighting
    will be removed from the item after you read the new message. If you click a message
    once to read it, its contents will be displayed


    the main window in Evolution. If you double-click it to read it, it will be opened
    in a new window.

    After you read a message, you can click the Reply button to reply to it. This
    new message will be addressed to the sender of the original email and will include
    the body of it. If more than one person sent the original email, for example if
    other people were CC, and you want to send your message to all of them, then you
    select the Reply to All button. Evolution will address the new email to all the
    people on the original email.


    # ## 1 Click Send/Receive.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_211_0.png)


    The system attempts to access your mail server and send and receive messages.
    The status window opens.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_211_1.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The messages appear in your Inbox.


    2 Click the message that you want to read.


    3 The message contents appears here.


    4 Click Reply.


    Note: You can click Reply to All if the original message was sent to multiple
    recipients and you want them all to see your reply.


    A new message window opens, containing the previous message and addressed to the
    sender.


    5 Type your reply message.


    6 Click Send.


    Evolution sends the message to the addresse.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_212_0.png)


    With Evolution, you can create templates for email messages. Templates in Evolution
    are emails with standardized contents. They are particularly useful as standard
    responses to common inquiries. You can create a template out of an existing message,
    or you can create a new message and save it as a template.


    To create a template out of an existing message, right-click the message and choose
    Copy to Folder. In the Select Folder dialog box, click the Templates folder and
    click Move.


    To make a template from a new message, create a new message, type the contents
    that you want to appear in the template, and then click File -> Save Template.


    In both cases, the message will now be available for use as a template.

    To use a template to reply to a message, right-click the message to which you
    want to reply. From the right-click menu, select Templates and then click the
    specific template that you want to use. The template contents will be inserted
    into a new message, along with the text of the original message.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_212_1.png)


    # Apply It'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Organize Your Email


    Evolution enables you to create multiple folders and rules that automatically
    filter the mail upon arrival in your Inbox.


    The volume of mail that you receive, at times, is a bit daunting. Evolution makes
    it easier to manage your mail and keeps things organized. By default, your email
    goes into one folder, your Inbox. One of the easiest things you can do to help
    keep organized is to create multiple folders to hold your mail.


    You use the Create Folder dialog box to create a new folder. In the dialog box,
    you name your folder. In the window below the name, you can select where you want
    the folder to appear in your email window. After you create the new folder, it
    will appear immediately in your Evolution tree.


    To move messages into your new folder, click the messages and drag them to the
    target folder.


    Evolution also includes the option to create filters that will route mail automatically
    to the folder of your choice. To create such a filter, use the Filters and Add
    Rule dialog boxes. You give your rule a name and then create criteria for filtering
    your mail using the dropdown lists below for the system to take when it detects
    a message that meets your criteria; in this case, this will be to move a message
    to a specific folder. Your new filter will automatically route mail that meets
    your criteria to the target folder.


    # Organize Your Email


    # CREATE A FOLDER AND PLACE MESSAGES IN IT


    +   1. Right-click your Inbox and click New Folder.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_213_0.png)


    The Folder dialog box opens.


    +   2. Type a name for the folder.


    +   3. Select the parent folder.


    +   4. Click Create.


    The new folder is created.


    You can now place messages in the folder by clicking and dragging them.


    In this example, you would drag all emails from Ubuntu forums into the Ubuntu
    Forums folder.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_213_1.png)


    200'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# FILTER TO HAVE MESSAGES AUTOMATICALLY PLACED IN A FOLDER


    +   Click Edit -> Message Filters.


    The Message Filters dialog opens.


    +   Click Add.


    The Add Rule dialog opens.


    +   Type a name for the rule.


    +   Select the criteria.


    In this example, you would choose senders from Ubuntu forums.


    +   Click here and select the folder in the messages will be placed.


    +   Click OK.


    +   Click OK in the Message Filters dialog


    The chosen messages will now be filtered to the folder that you specified.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_214_0.png)


    # Extra


    Another useful organizational tool is the Evolution feature known as Search folders.
    This tool is a hybrid of a folder and a filter. You should create a Search folder
    when you find yourself running the same search over and over or when you want
    to gather emails from numerous folders into a common view.


    Search folders do not actually contain any messages, but rather they provide a
    view of messages that meet a criteria you determine. That means the folder contents
    can change as messages are added or deleted from your system.


    Search folders are created and managed from the Edit menu. Selecting the Search
    Folders option opens the Search Fold dialog box. Click the Add button to create
    a new Search folder. The creation process is identical to creating a message filter.
    You need to add criteria and select the criteria that will be searched according
    to your criteria. All messages located in the folders that match will be listed
    in your new Search folder.


    Existing folders can be edited from the Search Folders dialog box by selecting
    the name and then clicking the Edit button.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_214_1.png)


    # chapter 8: Communicating over the Internet and Managing Your Schedule'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # Using the Junk Mail Filter


    Your Evolution email client can help you reduce the amount of SPAM and junk mail
    that winds up in your Inbox.


    By default, the Evolution application comes bundled with two junk mail management
    programs: Bogofil and SpamAssassin. These tools allow you to train your system
    to recognize junk mail and filter your mail more effectively.


    When you first begin using Evolution, you should make an effort to train the system
    by learning what it is and what is not. Training is simple: select a message and
    then click the Junk or the Not Junk button, as appropriate to the nature of the
    message. Training begins to be effective with as few as 20 messages, 10 junk and


    10 junk. Over time, as you continue to select messages, the filter becomes increasingly
    accurate.


    Messages marked as junk are immediately moved to your Junk folder. You should
    review the contents of the folder periodically to make sure the system is not
    incorrectly classifying messages as junk. You can set how long these messages
    are kept in the Preferences dialog.


    Both Bogofil and SpamAssassin are installed and available to you in Evolution.
    Bogofil is the active plugin. You can change the junk filter configuration settings
    in the Evolution preferences dialog. Click Mail Preferences and then click the
    Junk tab. The Junk tab contains the configuration settings for the mail filters.
    The default junk filter can be switched from SpamAssassin to Evolution if you
    prefer.


    # Using the Junk Mail Filter


    # TRAIN EVOLUTION TO RECOGNIZE SPAM


    +   1 Click a message that you think is SPAM.


    +   2 Click Junk.


    The mail is moved to the Junk folder, and the system''s junk filter begins to
    learn what is considered junk.


    > Note: You can click a message that is not junk and click Not Junk to further
    help Evolution learn.


    +   3 Click the folder.


    The contents of the Junk folder appear.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_215_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_215_1.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_215_2.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# PREVENT YOUR CONTACTS'' EMAILS FROM BEING LABELED SPAM


    +   4 Click Edit -> Preferences.


    The Evolution Preferences dialog box opens.


    +   5 Click Mail Preferences.


    +   6 Click the Junk tab.


    +   7 Do Not Mark Messages As Junk If Sender is in your Address Book.


    +   8 Click Close.


    Now, no emails from contacts in your Address book will be mistaken for SPAM.


    # Extra


    As experience has made clear, the people who send out SPAM are inventive, resourceful,
    and dedicated. It is hard for any application to catch every piece of junk mail
    that comes. Although you can train Bogofiler to react appropriately in the majority
    of situations, it will still miss some junk mail. Just as the SPammers react and
    change tactics, so should you. Not rely exclusively on one tool to rid your Inbox
    of unwanted SPAM.


    Earlier in this chapter, the section "Organize Your Email" discusses using mail
    filters to keep your mail boxes in order. You can also use mail filters to fight
    SPAM. If you discover that a particular type of message continues to end up your
    Bogofiler despite training, consider using a mail filter that reacts to the arrival
    of that type of message and redirects it to the Trash. As a mail filter can contain
    multiple rules and can be edited over time, you can set up a Junk Mail rule that
    you add over time and tweak.


    A combined approach to combating SPAM is your most effective strategy to taking
    back control of your Inbox.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Create a Contact


    You can maintain the addresses of friends, colleagues, and acquaintances by adding
    new contacts to your Evolution Address book.

    The Address book is quite full-featured, allowing you to create multiple contacts
    and maintain them either individually or in groups. The integration of Contacts
    with the email program makes the two applications naturally complementary.


    You can create a new contact from any place in Evolution by opening the Contact
    Editor. On the Contact Editor, you can enter the basic information for your person
    or company. Note that the File drop-down list allows you to control how the name
    will appear in the Contacts window. Click the Personal Information tab to enter
    more detailed information about your contact. On the Mailing


    tab, you can enter details for the contact''s physical address.

    After you have created a new contact, you will see it appear in the top pane of
    the Contacts window. Click the name to see the details in the main window of the
    Contacts application. You can double-click a name to reopen the Contact Editor
    and make changes to your entry. Clicking a contact opens a menu from which you
    can perform multiple actions, including sending an email to the


    If you have a large number of contacts, you may want to organize them into categories.
    You can add new categories from the New menu. Management of large contact lists
    is also eased by the Search box, which appears at the top right of the Contacts
    window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_217_0.png)


    +   1 Contacts.


    The Contacts pane opens.


    +   2 Click the drop-down arrow -> Contact.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_217_1.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'The Contact Editor opens.


    +   3 Type the contact''s full name.


    +   4 Type the contact''s nickname.


    +   5 Type the contact''s email address.


    +   6 Include any other information that you want to about the contact.


    +   7 Click OK.


    Evolution creates the new contact.


    +   The new contact appears in the window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_218_0.png)


    # Apply It


    Evolution also offers a feature called Address Book that makes it easier to manage
    large contact lists. Although you do not have to use the Address Book feature,
    if you want to keep your local addresses synchronized with a remote source, for
    example a Google address list, or another contact program on your network, then
    the Address Book function is useful.


    You can add a new Address book by clicking New -> Address Book. When the New Address
    Book dialog box opens, select the source and location of the shared Address book,
    or if you want your local Address book to be the source that is shared, select
    On Computer from the Type field, then give the Address book a unique name, and
    associate a username with it.


    If you select Google or WebDAV for the Type field, you must enter the details
    that will allow your Ubuntu machine to connect with the remote data source.


    The Refresh option allows you to set how often the system will check to see if
    the Address book contents changed, thereby helping you keep things closely synchronized.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Create Appointments


    You can use Evolution''s built-in calendar to set events for others and yourself.
    The system calls events intended for you alone appointments. Events that you share
    with others are called meetings and are dealt with in the next section of this
    chapter, "Send a Meeting Invitation."


    To create a new appointment, you first open the Evolution Calendar and then open
    a New Appointment dialog box. In this dialog box, you provide a summary of the
    appointment. Note that the summary will appear as the label for the event, so
    it should be descriptive. You can also enter a location for the appointment and
    a longer description. The Time, Date, and Duration drop-down lists are necessary
    to put the appointment on the calendar in the proper place. If your event runs
    for one or more


    days, click the All Day Event button on the toolbar. You can set a starting and
    ending date for all-day events, but not a time. The Recurrence button enables
    you to set up a recurring event.


    Note that under the menus of the Appointment dialog box, there are a number of
    choices, including the ability to schedule across time zones and classify events
    as public, private, or confidential.


    After you have added the event and saved it, the new appointment will appear on
    your calendar.


    To see an appointment''s details, you can move your mouse cursor over its name
    on your calendar. If you want to make changes to an existing appointment, double-click
    it to open an editing dialog box.


    # Create Appointments


    +   1 Click Calendars.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_219_0.png)


    The Calendars pane opens.


    +   2 Click New.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_219_1.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# New Appointment window appears.


    3 Type a short description of the appointment.


    4 Type where the appointment will occur.


    5 Set the time of the appointment.


    6 Click Save.


    +   - The new appointment appears on the calendar.


    +   - Move your mouse cursor over the appointment.


    +   - The appointment details appear in a pop-up.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_220_0.png)


    # Extra


    Evolution''s calendar supports reminders for events. Reminders are a convenient
    tool for keeping track of upcoming events, and they can help you avoid missing
    important meetings.


    To set a reminder for an event, open the event and click the Alarms button. In
    the Alarm dialog box, you can select a predetermined time in advance of the event
    to trigger the alarm. The default alarm notification is a pop-up dialog box.


    You can add a custom reminder by selecting Customize from the Alarm drop-down
    list. When you select Customize, the bottom portion of the window becomes active,
    allowing you to set the action and the trigger. Click the Add button to open the
    Add Alarm dialog box. In the dialog box, set the event from the drop-down list
    and then set the time to trigger it.


    Click the Repeat Alarm option if you want the alarm to be persistent, replaying
    at a predetermined interval until you dismiss it.


    To add a custom message to the alarm pop-up, click the Custom Message box and
    then type your message in the field at the bottom of the dialog box.'
  merge: -1
