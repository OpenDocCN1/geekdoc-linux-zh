  img_proc: true
- pgno: 259
  md: '# # Print a Spreadsheet


    You can print spreadsheets directly from OpenOffice.org Calc. Printing from Calc
    gives you a great deal of control over the print output and enables you to print
    all or only part of a spreadsheet with ease.


    Calc gives you two options for printing: a quick print button and the Print option
    under the File menu. To perform a quick print, click the Print File directly on
    the toolbar. The Print dialog box will open, allowing you to set the configuration
    of your print.


    The Print dialog box allows you to select a print and set the range. You can print
    all of a spreadsheet, just certain sheets, or even the selected cells of a sheet.
    The Print dialog box also enables you to set the print order and number of copies
    that will be printed.


    You can open the Print Options dialog box from the Print dialog box, which includes
    two additional features: the ability to print only a selected sheet and the ability
    to print all sheets except blank sheets.


    The Properties button at the top right of the Print dialog opens the Print Properties
    dialog box. On the Paper tab, you can set your paper size and page orientation.
    On the Device tab, you can control a number of additional printer-specific properties
    that directly affect the print quality.


    Note that after you have sent a job to the printer, you can manage the job using
    the Manage Print Jobs application discussed in Chapter 6.


    # ## Print a Spreadsheet


    +   1 Click File -> Print.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_259_0.png)


    The Print dialog box opens.


    +   2 Click Options.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_259_1.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_259_2.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'The Printer Options

    dialog box opens.


    +   3 Click Print Only

    Selected Sheets,

    unless you want

    the sheets in the

    spreadsheet to

    print.


