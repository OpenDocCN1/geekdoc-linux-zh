  md: 'application scans your hard drive and displays the results.


    3 Click here and View as Treemap Chart.


    The right pane now displays the results in the Treemap Chart.


    4 Move your cursor over an area of the chart to see space location it represents.


    # Extra


    In addition to the contents of your local hard drive, and remote drives not directly
    connected to your computer, you can also use the Disk Usage Analyzer utility to
    assess the usage of space on external drives connected to your machine, click
    the Scan Folder option and then navigate to the directory that you wish to analyze.
    If you are seeking to access a drive that is not directly connected to your computer,
    click Scan Remote Folder.


    The Scan Remote Folder option allows you to select the proper protocol to access
    the remote location: SSH, FTP, Windows share, HTTP, or any other custom connection
    that you specify. If you have selected the protocol, type the address in the boxes
    provided and click Scan. If you have a valid connection to the server, the results
    will appear on your screen in the same fashion as they do for a scan of your local
    drive. At any time, you can update the display by clicking the Refresh button
