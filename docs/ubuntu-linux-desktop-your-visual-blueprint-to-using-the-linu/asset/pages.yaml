- pgno: 23
  md: '# # Install Ubuntu


    You can install Ubuntu directly from the live CD. The process is quick and easy,
    and you can even surf the Internet while you install. Because the live CD already
    has a fully working environment, you do the installation from within the same
    environment you will experience after the system is fully installed.


    Historically, installing Linux was fairly rare, but Linux distributions actively
    rival or beat the ease of installation of other operating systems. With the live
    CD you can ensure that the hardware is working prior to actually installing the
    software, you gain the confidence that the process will be a Success before investing
    the time for a fail.


    The first half of the Ubuntu installation process primarily asks questions about
    locate-driven items — specifically,


    your local time zone, your preferred language, and your keyboard layout. The most
    technical question posed during the installation relates to disk preparation,
    that is, whether you want to partition the drive.


    Partitioning is a scheme in which a physical disk can contain multiple, logically
    separate areas that an operating system as separate volumes. These areas can also
    hold other operating systems, and with the correct boot setup, you can boot various
    operating systems on the same machine.


    If you want to keep the data that is present on the machine, you must create a
    new partition, rather than with a completely fresh installation. Moreover, if
    you want to keep the operating system on the machine and install Ubuntu as an
    additional system, you must partition the drive.


    # Install Ubuntu


    +   1. Click the installer.

    The Install dialog box appears, showing the Welcome page.

    2. Click your preferred language.

    3. Click Forward.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_23_0.png)


    Where Are You? page appears.


    +   4. Click here and select a city in your time zone.

    . Click Forward.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_23_1.png)


    10'
