    # Extra


    At the time this book was written, Intrepid Ibex had just been released. Although
    the vast majority of the applications bundled with Ubuntu 8.10 are quite solid
    and reliable, there will be applications with a few problems. Pidgin at the time
    of release was one of them. Now, the application is solid.


    Whenever the bugs in an application as Pidgin are numerous, there are a number
    of individuals working to fix them. Now, the more serious issues have been addressed.
    This situation is just example of why it is important for you to keep up with
    the upgrades and patches that are issued for your Ubuntu system. As bugs are reported,
    fixed, and the new files will be pushed out to the users. The use of automatic
    updates functionality is discussed in Chapter 5.


    There are still some small, innocuous bugs in Pidgin. You can check the bugs list
    located here: http://developer.pidgin.im/wiki/OpenTickets. If you have a problem
    you are experiencing that does not appear on this list, then you should report
    the bug so that it can be added to the list and eventually fixed. You can report
    problems with Pidgin at this address: http://developer.pidgin.im.


