- pgno: 165
  md: '# Capture a Screenshot


    If you need to capture a picture of what is happening on your computer desktop,
    you can easily take shots of the entire screen or just an active window. The system
    gives you several alternatives for taking screenshots. You can even additionally
    drop shadows and borders.


    The Take Screenshot application, however, offers a few more options. The Take
    Screenshot dialog box lets you take shots of the entire screen or just the active
    window. Additionally, you can set a delay that gives you time to arrange the elements
    on the screen or position your cursor. Take Screenshot also includes options to
    designate whether the cursor appears in the screenshot, such as a border or a
    drop shadow.


    The fastest and easiest way to capture a screenshot is to use the Print Screen
    key that appears on vast majority of keyboards. Pressing this key will result
    in the system taking a shot of the entire desktop and then prompting you for a
    name and save the file. If you only want a shot of the active window, you can
    also do that from your keyboard by pressing the Alt key at the same time that
    you press Print Screen.


    Screens taken by either keyboard shortcuts or the Take Screenshot application
    are saved in the PNG format. Image sizes are typically about 300KB to 400KB, and
    the dimensions tend to run at or a larger than the actual size of the screen or
    window being imaged.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_165_0.png)


    +   1. Click Applications -> Accessories -> Take Screenshot.


    The Take Screenshot application appears.


    +   2. Click to select the whole desktop or just the active window to capture.


    +   3. Set a delay to the number of seconds that you want the application to wait
    before capturing, as 3.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_165_1.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Click here and click Drop Shadow to apply a drop shadow effect.


    You can select other effects as well.


    Click Take Screenshot.


    The Take Screenshot application captures the screenshot.


    The Save Screenshot dialog box appears.


    Type a name for the screenshot.


    Click Save.


    The image is saved to your computer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_166_0.png)


    # ## Extra


    A screenshot is a basic function, so perhaps it is not surprising that there are
    a number of different ways to get it. The Take Screenshot application is certainly
    the most full-featured option, and using the keyboard shortcuts is the fastest
    option; however, there are still other ways that you can capture all or part of
    your computer screen.


    Those of you are comfortable with the Terminal application can take screenshots
    directly from the Terminal. The command is easy enough to remember, just type
    `gnome-screenshot` at the Terminal prompt. The command also supports the same
    set of options as the Take Screenshot utility, including the choice between switching
    the screen as a whole or just a particular window. You can add borders or drop
    shadows.


    If you expect to take screenshots often, consider adding a Take Screenshot button
    to one of your desktop panels, as discussed earlier in this book in Chapter 2.
    With the Take Screenshot button at your fingertips, you do not need to fumble
    around for a keyboard shortcut or an application – just click the button when
    needed.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Access the Command Line with Terminal


    The Terminal application enables you to control your machine at the command line
    and opens up the system for power users. Virtually anything you can do in the
    normal desktop environment, you can do from the Terminal, if you know the right
    commands.


    The Terminal application takes its name from its function: terminal emulation.
    With this application, you can access a UNIX shell to directly type in commands
    for your system to execute. This mode of operation, although very basic in terms
    of its interface, is all about power: when there is no substitute for having access.


    Terminal supports the use of tabs to allow you to run multiple terminal windows
    simultaneously. You can open a new tab which will appear at the top of the window.


    # Access the Command Line with Terminal


    the tab name to make it active. The tabs feature makes it easy to multitask, or
    run multiple processes simultaneously.


    Another useful feature of Terminal is the support of multiple profiles. A profile
    is a set of configuration options for Terminal. You can create multiple profiles
    for each one to help customize the appearance of them. You can also set a default
    command that runs automatically when the profile is opened, allowing you to create
    accelerators for common tasks. To create a new profile, go to the File menu and
    select New Profile. The first profile you create will be based on the default
    profile, but thereafter you can create new profiles on any existing.


    +   - Click Applications -> Accessories -> Terminal.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_167_0.png)


    The Terminal application appears.


    +   - Click File -> Open Tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_167_1.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Right-click the new tab and select Set Title.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_168_0.png)


    The Set Title dialog box opens.


    Type a new name for the tab.


    Click OK.

    The title of the tab will change to the value that you entered.


    # Extra


    Using Terminal requires some familiarity with the syntax needed to enter the shell
    commands, and of course, it requires an awareness of the commands themselves.
    The list of available commands is extensive and well beyond the scope of this
    book. A good place to learn more is the Ubuntu community documentation page “Using
    the Terminal,” located at https://ubuntu.com/community/UsingTerminal. The page
    contains a quick reference to the most common shell commands.


    If you are not using shell commands, by far the best command to start with is
    the help command. When you execute the help command, the system displays a manual
    for you to read. There are manuals for each command in the system. To access one
    of help manuals, open the Terminal and at the prompt, type man, followed by the
    name of the command. An excellent place to begin is with the command man man,
    which will display the manual for the command man. Another good starting point
    is man intro, which will display the manual “Introduction to Commands” manual.


    Chapter 14 of this book contains more information on working with the command
    line.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Edit a File with the Text Editor


    The text editor bundled with Ubuntu desktop is the powerful edit editor, which
    allows you to easily create and edit documents, but also gives you access to a
    wide variety of useful tools. By default, opening a text document in Ubuntu will
    also launch gedit.


    can also rearrange text by double-clicking to highlight a word and then grabbing
    it with your mouse and dragging it to where you want it to appear.


    If you are used to the functionality of editors such as Microsoft Windows Notepad,
    you will find the Text Editor interface familiar, but the similarities really
    stop there. At its most basic, you can use the Text Editor to create or edit documents,
    but like more powerful word processors, you can also spell-check, and replace
    text, and use tabs to control multiple documents.


    A spell-checker is available under the Tools menu. You can spell-check your text
    at any time, or if you prefer, you can switch to the Autocheck Spelling option.
    Autocheck Assessing your spelling as you type and highlights words that it believes
    is questionable.


    Also under the Tools menu is the Document Statistics option. Clicking Document
    Statistics will show you the number of lines, words, and characters in your document.


    If you are working with code, explore the options for code formatting and highlighting
    in the Preferences dialog box, which is accessed from the Edit menu.


    Like other word processors, the Text Editor supports copy-and-editing using the
    buttons on the toolbar or


    # ## Edit a File with the Text Editor


    +   1 Click Applications -> Accessories -> Text Editor.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_169_0.png)


    The Text Editor application appears.


    +   2 Type your text into the editor window.


    +   3 Click Tools -> Check Spelling.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_169_1.png)'
  merge: -1
  img_proc: true
