    Note: Default may vary according to your mail configuration.


    The Receiving Options page appears.


    +   13 Select your options and then click Forward to move on.


    # Apply It


    Because many people are now using Google''s Gmail service for at least one of
    their email accounts, you may need to know how to set up Evolution with a Gmail
    account. To do so, you must configure both Gmail and Evolution.


    First, access your Gmail account. On the top right of the page, click the Settings
    link. In the Settings page, click the Forwarding and POP tab, locate the POP Download
    section, and select either of the options to enable POP. Click Save, and you are
    configuring your Gmail account.


    Next, you must set Evolution to account Gmail. Create a new account in Evolution.
    Click Edit -> Preferences. Then Select Accounts and click Add. Evolution takes
    you through a setup wizard. Note the following settings: Set the receiving mail
    protocol to POP and the mail server to pop.gmail.com. Use the SSL secure connection
    with the Password Protection option selected. For sending mail, set the server
    to smtp.gmail.com. Select TLS Encryption for the Security option. Click the Apply
    button on the last screen of the setup wizard, and you are done.


    continued


    ![](img/b68319171116e7cb6d71d28d5b12e08c_206_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_206_1.png)'
