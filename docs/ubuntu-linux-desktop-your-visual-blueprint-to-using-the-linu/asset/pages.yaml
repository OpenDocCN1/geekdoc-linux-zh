- pgno: 35
  md: '# # Add Frequently Used Applications to the Desktop or Main Panel


    Sometimes there are applications that you use frequently that the navigation of
    the menus becomes tiresome. Other times, you would like to access an application
    or folder usually found on the desktop without minimizing other applications,
    or the number icons become too much clutter on the desktop. To solve these problems,
    you can place application shortcuts from the main menu into the desktop or into
    the panel for quick access. The panel and desktop use launchers, which, as mentioned
    earlier, contain metadata regarding the action that should be taken when they
    are opened, the type of


    entity they refer to, and the launcher for it present on the desktop or panel.
    Launchers are stored in small files ending in the .desktop and plain text. To
    create a new launcher, see the section "Organize Icons and Panels."


    Once added to either the desktop or the panel, these applications can be accessed
    by either a single click for the panel or a double-click for the desktop. Their
    removal is as easy as a right-click and selecting either Remove from panel launchers
    or Move to Trash for desktop launchers.


    # Add Frequently Used Applications to the Desktop or Main Panel


    ADD AN ITEM TO THE MAIN PANEL


    +   - Click Places.

    - Click the folder location that you want to add to the main panel.

