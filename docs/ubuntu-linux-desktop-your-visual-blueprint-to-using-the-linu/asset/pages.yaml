- pgno: 119
  md: '# Enable Proprietary Hardware Drivers


    if your hardware or accessories require the use of proprietary drivers, you can
    add them using the Hardware Drivers utility in Ubuntu.


    With Ubuntu 8.10, the vast majority of common hardware drivers are met by preexisting
    drivers or downloading additional open-source drivers using the Synaptic Package
    Manager. In rare cases where the existing and open-source drivers do not cover
    yours, you may have to install proprietary drivers from the hardware manufacturer.
    The drivers are likely to come included with your hardware, typically on a CD.
    You will first need to find these drivers on your Ubuntu machine by following
    the instructions included with the driver files. After the drivers are installed,
    you can enable them through the Hardware Drivers utility.


    When you open the Hardware Drivers utility, the application scans your system
    in order to locate any proprietary drivers. The Hardware Drivers utility dialog
    lists the available drivers. You can use the dialog box to enable any of the proprietary
    drivers in the list.

    If you have enabled a driver, it does not seem to be working, you may need to
    restart your machine.

    If no drivers appear in the Hardware Drivers window, either there are no proprietary
    drivers on your system or they have not been installed.

    Note that there is an open-source alternative for the driver, you should consider
    using the open-source version, as the proprietary driver cannot be maintained
    from Ubuntu or the Synaptic Package Manager.


    # Enable Proprietary Hardware Drivers


    +   1 Click System -> Administration -> Hardware Drivers.


    The Hardware Drivers dialog opens, and any available proprietary drivers are displayed.


    +   2 Click to select the driver that you want.


    +   3 Click to activate that driver.


    Note: This button says Deactivate, as in example, if the driver is already activated.


    +   4 Provide administrative user authentication to authorize the change.


    +   5 Click Close.


    Note: Depending on the driver, you may need to restart your computer to see the
    changes.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_119_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_119_1.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Add Additional Language Support


    Your Ubuntu desktop can be configured to accept input in a large number of languages.
    Ubuntu supports the most common languages; it is merely a question of enabling
    the language through the Language Support utility. The default language support
    distribution depends on the variety of Ubuntu that was installed on your machine.
    However the most common is United States English, but it could be any of the other
    supported languages, as localized distributions exist for many languages.


    If you want to change the default language or you need to enable support for other
    languages, you will need to use the Language Support utility. The Language Support
    utility first checks your system


    for installed language packs before it launches the Language Support dialog box.
    To support for additional languages, you select them from the list of the dialog
    box. You can click Details to see the options for the language and choose whether
    you want to install all of the packages. Note that the options change, depending
    on the language selected. At the dialog box is an option labeled Input Method.
    If you want to use a complex character-based language, such as Chinese, you can
    use it to enable the support to complex characters.


    You can also change the default language for your system in the Language Support
    dialog box. The default language affects your navigation, warning dialog boxes,
    and many of the items that you see in your interface.


    # Add Additional Language Support


    +   1 Click System Administration -> Language Support.


    The Language Support window opens.


    +   2 Click the languages that you want to add.


    +   3 Click OK. The chosen languages are downloaded and installed.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_120_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_120_1.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # Change Login

    Window Options


    You can change the appearance and behavior of your Ubuntu Login window with the
    Login Utility.


    Before you make changes to the Login windows, the system will prompt you for your
    administrator''s password. You can then change the options you want in the Login
    Preferences dialog box. Across the top of the login box, you will see six tabs:
    General, Local, Remote, Accessibility, Security, and Users. The most important
    of these to the typical user are the Local tab and the Security tab.


    The Local tab allows you to change the appearance of your Ubuntu login window.
    On this tab, you can select both the style and the theme used for the Login window.
    You can click the Add button to add additional themes to


    your system. The Menu Bar choices allow you to specify whether to make the bar
    visible. The final section on this tab lets set a custom welcome message.


    The Security tab makes it possible to disable the login procedure or to increase
    your security by placing restrictions on who can log in. If you select the Enable
    Automatic Login option, you will bypass the login procedure and your system will
    start automatically at the start of a session. In contrast, this is not recommended
    for security reasons, however. The options on the Security tab enable you to place
    conditions on login that improve the system''s security. You can increase the
    time specified for the login retry delay to make it harder for brute-force attempts
    to succeed at cracking your account.


    # ## Change Login Window Options


    +   1. Click System -> Administration -> Login Window.


    The system prompts you to enter your administrative password.


    +   2. Type your password.


    +   3. Click OK.


    The Login Window Preferences dialog box opens.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_121_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_121_1.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Click the Local tab.


    The Local tab appears.


    +   - You can set the style and theme using these options.


    +   - You can use these check boxes to set different options for your menu bar.


    With this option, you can set a custom welcome message.


    +   - Click the Security tab.


    The Security tab comes to the front.


    +   - If you want to enable an automatic login, click here.


    +   - Click here and select the user whom you want to be able to log in automatically.


    +   - Set the Security options that you want.


    +   - Close.


    Your changes to the Login window will be applied the next time you start a session.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_122_0.png)


    # Extra


    You may notice on the Local tab of the Login Window Preferences dialog several
    options that the "face browser." The face browser is one of the layout choices
    for your login screen, and it adds a useful functionality to the screen.


    Face browser puts a small image of each of the users on the login screen. Users
    can log in by clicking their icon or by typing their name and entering their password.
    The images, which the system calls face icons, are selected by the user and kept
    in their home directory.


    This feature adds a personal touch to the system, and when there are many users
    of a single machine, the feature is also a time-saver. The system tracks the users
    session and automatically orders the login with the most frequent users ranked
    at the top of the list. This helps ensure that users who log in often can find
    their accounts quickly. There is also an auto-complete function that tries to
    recognize the username as you type it; this is also a timesaver and particularly
    useful if you have a long username.'
  merge: -1
