  md: 'The Image dialog box.


    +   3 Navigate to an image to edit and click it.


    +   4 Click Open.


    The image is loaded and appears in a new window.


    +   5 Click a tool that you want to apply in the toolbox.


    +   6 Click the image.


    The tool is applied to the image.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_182_0.png)


