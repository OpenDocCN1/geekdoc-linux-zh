  md: '# About the Author


    Ric Shves is an author and Web applications consultant specializing in open source.
    Ric is a partner in the Web development firm water&stone (www.waterandstone.com),
    where he practices what he preaches and uses Ubuntu for both servers and desktop
    PCs. He lives in Bali with his wife, a dog, 2.5 cats, 4 turtles, and an uncountable
    number of fish.


    # Author’s Acknowledgments


    I would like to thank the team at Wiley & Sons for bringing me another interesting
    open-source project. Ubuntu 8.10 deserves more attention, and this is a worthy
    effort to help it gain more exposure. I would also like to extend a big thanks
    (and an even bigger hug) to my wife for putting up with the short delivery times
    associated with this project; she was very patient with my shifting part of my
    other workload to her for the interim!'
