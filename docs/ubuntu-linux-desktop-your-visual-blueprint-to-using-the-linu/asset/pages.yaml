- pgno: 105
  md: '# Configure PalmOS Devices (continued)


    After setup, the gnome-pilot Settings window appears and allows you to enable
    any synchronization applications, also known as conduits, that you want. There
    are number of conduits available — the most important of which is the Backup conduit,
    which keeps a selectable number of backups of your PC. ECalendar is a conduit
    that synchronizes your Palm''s calendar with the Evolution. The Ememos conduit
    syncs the memos of the Palm with the Memos feature of Evolution. The Eaddr conduit
    syncs your Palm''s address book with Evolution''s address book. The Todo system
    synchronizes your device with Evolution, and it syncs the Todo list on the Palm
    with Evolution''s Tasks list. The Backup conduit shows that not conduits interact
    with Evolution, although most of them do


    Evolution is the default personal information manager (PIM) on Ubuntu. The MemoFile
    conduit syncs your memos from your device to a set of text files under Home directory
    or any other directory that you choose to keep your sync information. Most of
    the conduits have a one-time action available under Settings that enables you
    to overwrite the PC or the device with the contents of the other. This can be
    useful if your data becomes corrupted or you simply want to revert to an earlier
    state. Additionally, many of the conduits have options on how to sync such as
    whether to overlay the information on the PC with the contents of the device each
    time, or versa, or a true sync via the merging of information.


    # Configure PalmOS Devices (continued)


    The Success page appears.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_105_0.png)


    +   -Click Apply.


    The gnome-pilot Settings dialog box appears.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_105_1.png)


    +   -Click Conduits.'
