- pgno: 15
  md: "# # Download Ubuntu\n\nBefore you can use Ubuntu Linux, you will have to obtain\
    \ a copy. There are currently four different methods of obtaining Ubuntu. One\
    \ option is to request a CD from Canonical. Although this is free of charge, it\
    \ does tend to take some time; there is a backlog for the CDs because more demand\
    \ than can be readily provided for. If you really want to have the official release\
    \ on CD, you may want to order an Ubuntu online directly from Canonical or Amazon.\
    \ This incurs a cost, but it is faster. If you do not need a CD, there are two\
    \ other options. By far the most popular way to get Ubuntu is downloading. The\
    \ installer is quick and fast, but be aware that the files are very large. For\
    \ the fastest connection, be aware that your better experience because the image\
    \ is roughly 700MB in size. As an alternative, if you know who is running Ubuntu,\
    \ you can ask them to make you an installation disc.\nThe most release of the\
    \ Ubuntu operating system is 8.10. This is also known as Herbst. The version number\
    \ comes from the year 2008 and the month October. The code name convention uses\
    \ African animals for the informal names. For more on the history of the naming\
    \ convention, visit https://wiki.ubuntu.com/DevelopmentCodeNames.\n are two primary\
    \ versions of Ubuntu 8.10. The first is Ubuntu Desktop, which is the focus of\
    \ this book. The other is the Server Edition, and it is for handling tasks within\
    \ a data center or a network. Server provides mail, file servers, and application\
    \ servers. In general, it is all the back-office plumbing that typical corporate\
    \ desktop would need for services.\n\n# Download Ubuntu\n\n+   1. Open Internet\
    \ Explorer.\n2. Navigate to www.ubuntu.com/getubuntu/download.\n3. Click Select\
    \ a Location.\n4. Click the location nearest you.\n5. Click Begin Download.\n\n\
    ![](img/b68319171116e7cb6d71d28d5b12e08c_15_0.png)\n\nThe Download page appears,\
    \ and the File Download dialog box opens.\n\n> Note: Depending on your security\
    \ settings, you may have to click in the top of the browser to allow the download\
    \ to start.\n\n+   6. Click Save.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_15_1.png)"
  merge: -1
  img_proc: true
