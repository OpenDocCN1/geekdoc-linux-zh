    Click your keyboard layout.


    Click Forward.


    The Prepare Disk Space page appears.


    Verify that you want to use the recommended partitioning for the drive.


    # Prepare disk space


    How do you want to partition the disk?


    +   - Guided - use entire disk

    - SCSI1 (0,0) (sda) - 17.2 GB ATA QEMU HARDDISK

    - Manual


    Step 4 of 7


    Note: Double-check that you have any important data from the drive backed up.


    Click Forward.


    # Extra


    Partitioning schemes on Linux have a long tradition. The original UNIX operating
    systems ran on large multiuser machines. When upgrades were performed on the operating
    system of these large machines, it was paramount not to adversely affect the users.
    Consequently, rather than having all the users'' files on the same set of disks
    as the operating system files, they were kept on separate disks. This allowed
    system administrators to completely rewrite programs the system if needed. The
    segregation of the user files meant that when the system came back, all the user
    files would be left untouched.


    Partitions were also important for the operating system itself, as the swap file
    for the operating system was also maintained on a separate disk. This allowed
    a performance boost by having a dedicated set of disks for pushing memory pages
    into and out of magnetic storage.


    Aside from swap, the /tmp folder was often kept on separate disk volumes. This
    usually had more to access speed, as UNIX and all UNIX-like operating systems
    create tremendous traffic in the form of temporary files.


    continued'
  merge: -1
