- pgno: 271
  md: '# Rehearse Slideshow Timings and Change Show Settings


    Impress makes it easy to preview and rehearse your slideshow. You can also modify
    the settings that control the slideshow to run it as you prefer.


    By default, Imp slideshowes are set to advance through the slides manually one
    slide each time you click the mouse or press the spacebar. You can, however, modify
    this to run automatically, or you can make runs manually by advance extensively.
    Some people prefer to advance through the slides at set intervals. The intervals
    can be the same for all slides, or they can be varied for each slide.


    watch the slideshow on your screen. The latter method works well when you are
    trying to synchronize with a soundtrack or against narration; it is also a very
    handy way to get a reality check on whether your presentation is moving at an
    appropriate pace. To access this feature, you can use the Timings option. As the
    show plays, click when you want to advance, and Imp will save your timing accuracy.


    You can use the Slide Show dialog box to choose from a number of options for your
    presentation. Adjust these settings to control slide and cursor visibility. You
    can also set the presentation to run automatically and remain on top of other
    windows, allowing you to create self-running presentations such as you would use
    at a display or a kiosk.


    Slide timings can be set manually on the Slide Transition tab of the Tasks pane,
    or you can preview the slideshow and create the timings by clicking as you


    # Rehearse Slideshow Timings and Change Show Settings


    REHEARSE SLIDESHOW TIMINGS


    Click Slide Show -> Rehearse Timings.


    +   The first slide appears, and the timer begins to run.


    +   Click at the interval you want the presentation to advance to the next slide.


    +   Keep keeping the timer box at the appropriate times to advance through the
    slides to the end.


    The timings are now saved by the system and will be used to control the slide
    sequence in the future.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_271_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_271_1.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# CHANGE THE SLIDESHOW SETTINGS


    Click Slide Show -> Slide Show Settings.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_272_0.png)


    Click the options that you want, as Mouse Pointer Visible if you want your cursor
    to show.


    Click OK.


    The Slide Show settings are saved.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_272_1.png)


    # Extra


    In some cases, you may want to control the order and timing of the appearance
    of the objects on individual slides. By default, all objects on a slide will appear
    at once. This is not always desirable: When objects appear at once, viewers sometimes
    have trouble knowing where to focus, or tune out the speaker while they read the
    slide. If you set the objects to appear one at a time, you can control their visibility
    and control to extent the viewers.


    Controlling object visibility is done on the Custom Animation tab of the Tasks
    pane. Custom animation effects are attached to a currently selected object in
    the workspace by clicking the Add button. The Effect Start setting allows you
    to determine the trigger for the appearance of an object. You can control the
    timing and the rate at which the object appears.


    In the box below the Effect controls, you can order the objects in whatever sequence
    you want. Right-click an object in this box and select Timing from the menu. The
    Timing tab in the Effect Options dialog box appears. On this tab, you can set
    an object''s visibility on the screen according to timing or in sequence with
    other objects.


    Chapter 11: Creating and Editing Presentations with OpenOffice.Impress'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Run Your Slideshow


    You can run your slideshow with the touch of a key or the click of a mouse. Once
    started, the presentation will advance according to your timing marks or your
    prompts.


    At any time during construction or upon completion, you can trigger the display
    of your slideshow via several methods. The fastest way to start a slideshow is
    to click the F5 key on your keyboard. Pressing F5 will begin the slideshow immediately.


    Another tool is the Slide Show button on the Slide Sorter toolbar. Clicking the
    Slide Show button has the same effect as pressing F5. Unfortunately, this tool
    is not displayed by default. It only shows when you are viewing the Slide Sorter
    tab in the workspace. Alternatively, you can turn the toolbar so that it is always
    visible. To enable


    the slideshow, click View -> Toolbars -> Slide select the Slide Show option on
    the Slide Show menu. This is a bit slower, but it does the job. Note that in all
    cases, the slideshow begins with the slide that is active in the workspace. If
    you want to start the slideshow from the beginning, you should select the first
    slide.


    Once the slideshow begins, the slides will appear as you have ordered them. If
    you have set automatic manual advance, you will need to take action to move through
    the show. To advance the show, click the mouse, press the spacebar, or use the
    arrow keys to move forward and backward.


    To stop the slideshow at any time, press the Esc key.


    # Run Your Slideshow


    +   1. Click Show -> Slide Show.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_273_0.png)


    The first slide of the presentation appears.


    +   2. Click the screen.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_273_1.png)'
  merge: -1
  img_proc: true
