  md: '# The Update Manager displays a list of packages that need to be updated.


    Click Install Updates.


    The system will connect to the Internet, download the necessary files, and install
    them.


    The Update Manager shows the system status.


    Click Close.


    Your system is now up-to-date.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_146_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_146_1.png)


    # Apply It


    The Ubuntu Update Manager will keep your packages up-to-date, but it does require
    an Internet connection to download the files. Although the Update Manager is certainly
    the easiest way to upgrade your system, if you do not have an Internet connection,
    you will need to explore alternatives.


    Your first goal is to obtain the files for the update. Synaptic can help you manage
    this process. Open the Synaptic Package Manager and click File ➜ Generate Package
    Download Script. Save the file to a USB flash drive or removable media and then
    remove media from your computer. Next, you must go to a PC that is running Linux
    and has an Internet connection. Run the script and save the results to your removable
    media. Disconnect the removable media and plug it back into your machine. Open
    the Synaptic package manager. Click File ➜ Add Download Packages and follow the
    steps.


    If you want to conduct a full upgrade to a new version of Ubuntu, you need to
    obtain the files for the upgrade and burn the ISO to a CD. Insert the CD in your
    computer and follow the steps.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# # Add and Manage Users and Groups\n\nYour Ubuntu system makes it possible\
    \ to create new users and organize them into groups. The Users and Groups utility\
    \ allows you to control the permissions of the users and grant or deny access\
    \ to different aspects of the system. The ability to limit access and set permissions\
    \ is key to maintaining the security of your system and the integrity of your\
    \ data. When you first opens the Settings window, it displays a list of all the\
    \ users in the system. However, the window will initially be locked. Before you\
    \ can make any changes, you must first unlock it. To do so, you will need to enter\
    \ your password and be authenticated by the\n\nsystem. After you are authenticated,\
    \ the controls of the Users Settings dialog will be fully functional. You can\
    \ create a new user using the New Account dialog box. You can specify a username\
    \ and an initial password for him or her on the Account tab. You can specify other\
    \ details about the user on this tab, but these settings are optional. On the\
    \ Privilege tab, you set his or her privileges, granting or limiting the new user's\
    \ ability to perform tasks with the system. On the Advanced tab, the choices are\
    \ optional.\n\n# Add and Manage Users and Groups\n\n+   - Click System $\rightarrow$\
    \ Administration $\rightarrow$ Users and Groups.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_147_0.png)\n\
    \nThe Users Settings window opens.\n\n+   - Click Unlock.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_147_1.png)\n\
    \n134"
  merge: -1
  img_proc: true
- pgno: 148
  md: "The Authenticate dialog box appears.\n\n+   Type your password.\n\n+   Click\
    \ Authenticate. \nThe Authenticate dialog box closes, and the Users Settings dialog\
    \ box will be unlocked.\n\n+   Click Add User.\n\nThe New User Account dialog\
    \ box opens.\n\n+   Type a username.\n\n+   Type a password again to confirm.\n\
    \nNote: The other fields on this dialog box are optional.\n\n+   Click the User\
    \ Privileges tab.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_148_0.png)\n\n#\
    \ Extra\n\nPermissions management in Ubuntu requires a combination of the options\
    \ under the Users and Groups application and those of the Authorizations utility,\
    \ discussed earlier in this chapter in the section \"Adjust Authorizations.\"\n\
    \nIn general, you should try to grant only permissions that are actually needed\
    \ by a user. Granting unnecessary rights opens up the system to compromise. When\
    \ you view the Privileges tab of the New User Account dialog box, you will see\
    \ that there are a number of options that are probably not relevant to all the\
    \ users on your system. Does the user really need access to media? To a scanner?\
    \ If not, disable these privileges. Most importantly, you will notice that one\
    \ of the privileges is Administrator the System. This is a very high-level grant\
    \ of access to a number of powerful functions in Ubuntu. Only grant this access\
    \ to trusted users. Ideally, you would have only one person on the system with\
    \ these privileges in order to avoid problems and maintain accountability.\n\n\
    When a user is no longer going to use the system, delete his or her account, if\
    \ you have no compelling reason to preserve it. Unused accounts are one of the\
    \ most frequent avenues of hacks on individual machines.\n\ncontinued"
  merge: -1
  img_proc: true
- pgno: 149
  md: '# # Add and Manage Users and Groups (continued)


    The Users and Groups utility enables you to view and modify existing users and
    organize them into groups.


    Existing users can be created by clicking their name in the Settings window and
    then clicking the Properties dialog box; this will cause the Account Properties
    dialog box to open. The Account Properties dialog box is identical to the New
    Account dialog box discussed earlier in this section. You can make changes to
    the user''s account in the Account Properties dialog box, adding a new password.


    You can delete a user by clicking his name and then clicking the Delete button
    in the Users Settings window. The system will ask you to confirm this action.
    But not deleting a user will remove it, but


    will not delete any files that he or she on the computer.


    Groups are also managed from the Users Settings dialog box. Groups in Ubuntu are
    primarily for organizing users. They are very helpful if you have a large number
    of users on a machine. Unlike other systems, you cannot control privileges by
    group; rather in Ubuntu, you control privileges per individual user.


    To work with your groups, use the Groups settings dialog box. You can add a new
    group, view a group''s attributes, and delete a group by clicking the group name
    and then clicking the Delete button.


    Group properties are very limited. Essentially, you can only rename the group,
    change the group ID, and assign members to the group.


    +   1. The Userileges tab appears.

    2. Click the check boxes to set user privileges for the new user.

    3. Click the Advanced tab.


    The Advanced tab comes to the front.


    +   4. Adjust the settings that you want to apply to the new user, including specifying
    a main group, if needed.


    +   5. Click OK.

    The new account is ready for use.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_149_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_149_1.png)'
  merge: -1
  img_proc: true
