  md: '# Chapter 5: Administering the System


    The action''s details appear in the right.


    +   3. Click Edit.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_116_0.png)


    The Edit Implicit Authorizations dialog box opens.


    +   4. Click here and select the condition that you want.


    +   5. Click Modify.


    Note: You will need to provide administrative authentication to authorize the
    modification.


    You are returned to the Authorizations window.


    +   6. Click Close.


    Your authorizations are set.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_116_1.png)


    # Extra


    There is some overlap in functionality between the Authorizations utility and
    the Users and Groups utility that is discussed later in this chapter in the section
    "Add and Manage Users and Groups." Both applications are concerned with permissions
    to perform actions. The two utilities, however, come at the problem from different
    angles.


    The Authorizations utility is task-focused. You work through the permissions by
    selecting permissions and discrete tasks that can be performed with application.
    You then set permissions that are related specifically to that task.


    The Users and Groups utility is user-focused. With Users and Groups, you select
    users and then place limits on what they can do with the system.


    Speaking broadly, the Authorizations utility is narrower in its grant of privileges.
    The permissions you can control with the Users and Groups utility tend to be fairly
    broad, covering a range of tasks. In contrast, it is not uncommon to deal with
    a user''s right to perform a single, specific task.


    The other key difference between the two utilities is that the Authorizations
    utility enables you to grant permissions that are triggered by the presence of
    conditions that apply regardless of the identity of the user.'
