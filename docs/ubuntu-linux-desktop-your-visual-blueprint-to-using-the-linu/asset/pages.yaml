- pgno: 61
  md: '# Using a USB Flash Drive


    if you want to get data onto or off of the Ubuntu machine without going across
    a network drive or server, you will likely need to use some flash media. The most
    common media today is the USB flash drive, sometimes referred to as a thumb drive
    due to its thumb-like shape. At this point, but they are really the latest in
    a long chain of removable media. They are different in implementations in that
    they are not part of a mechanical drive. Flash drives have true random access
    and extremely high reliability. This type of memory requires no power to retain
    its contents, versus the much faster, but very volatile, memory used to support
    the computer''s main processor.


    Because it is memory, however, it is faster than the previous magnetically, or
    optically, driven storage mediums. When you connect a USB drive to Ubuntu, you
    will be presented with a new icon on the desktop. This icon will indicate that
    the file system of the USB flash drive has been mounted and is available. Depending
    on the contents of the drive, you may be presented with additional applications
    or options derived from your media-handling preferences, discussed in the section
    "Nautilus Browser Preferences." For example, if you have digital pictures on the
    drive, you may be presented with a Preview dialog box from F-Spot Photo Manager
    that prompts you to add the photos to your collection.


    # Using a USB FLASH DRIVE


    +   - Insert the USB drive into a USB port.

    - The USB drive icon appears.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_61_0.png)


    +   - Double-click the USB drive icon.


    The File Browser opens the USB drive.

    Note: If you have files on the USB drive, you can copy them to your hard drive.
    You can also place files on the USB drive by copying and pasting them. See the
    section "Copy and Move Files and Folders."


    ![](img/b68319171116e7cb6d71d28d5b12e08c_61_1.png)'
