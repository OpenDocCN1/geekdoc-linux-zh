- pgno: 159
  md: '# Manage

    Print Jobs


    You can check the status of your print jobs and make changes to them using the
    Manage Print Jobs application. Manage Print Jobs does exactly what the name implies:
    It enables you to manage the view, pause, cancel, or restart your pending print
    jobs. Typically, when you want to print a file, you will open the file and choose
    Print from the menu, or you may click the application''s Icon. After you have
    done that, the print job is basically gone from your control; you can no longer
    control it from your application. The Manage Print Jobs application is provided
    to overcome this limitation and give you more control over printing.


    Any time you print a document in Ubuntu, the pending print job will be visible
    in Manage Print Jobs window displays each job by name, along with the size, time,
    and status. By right-clicking a job you can cancel or pause the job. You can also
    restart paused jobs by right-clicking and restarting. Note that if you cancel
    a job, it means it is deleted from the queue. Canceling a job means you will need
    to tell the system to print the file again using the other application.


    You can use Manage Print Jobs to review a list of previously printed documents.
    You can also open a window that displays the printer''s status by clicking View
    -> Show Printer Status.


    # Manage Print Jobs


    +   Click Applications -> Accessories -> Manage Print Jobs.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_159_0.png)


    The Manage Print Jobs application appears, showing the work in progress.


    +   You can cancel or pause a job by right-clicking its name and then Pause or
    Cancel.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_159_1.png)'
  merge: -1
  img_proc: true
