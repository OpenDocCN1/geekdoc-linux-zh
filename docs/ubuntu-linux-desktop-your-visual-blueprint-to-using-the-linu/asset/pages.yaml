  md: '# Ubuntu to a CD


    After you download the Ubuntu installation file from the Internet, you need to
    write the file to CD in order to generate a bootable CD. You will use the resulting
    CD to install Ubuntu on your destination computer. This is a fairly simple task,
    yet there are many different ways to accomplish it. The instructions in this section
    detail how to burn the CD on a machine running any Microsoft Windows version from
    95 up to. Note that you must have a CD drive capable of recording CDs and at least
    one writeable CD that is compatible with that drive.


    Although burning a disc image sounds simple, many operating systems do not include
    this capability by default. To perform this task, you will use a third-party piece
    of software to burn the image file to the CD. Although you may already have such
    software on your machine, this software varies widely with manufacturer. The one
    used in this section is Nero Express. It ships with many systems built by PC vendors.


    The Ubuntu installation file that you downloaded was an archive of the date. When
    this data is stored to a CD, the computer will use the data on the CD to install
    the new operating system on the computer''s


    # Ubuntu to a CD


    +   1. Launch the CD-burning application that you plan to use.


    +   2. Choose to burn a CD image.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_17_0.png)


    +   3. Navigate to the location of your Ubuntu .iso file.


    +   4. Click the .iso file.


    +   5. Click Add (or Open).


    ![](img/b68319171116e7cb6d71d28d5b12e08c_17_1.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Optionally, you can ensure data integrity by clicking Verify Data on Disc After
    Burning.


    # 6 Click Burn.


    The burning begins.

    When the burning is complete, the disc will eject.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_18_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_18_1.png)


    # Extra


    If your hardware or operating system configuration is different from the one discussed,
    you can go to https://ubuntu.com/community/BurningIsoHowTo for help. The main
    issues you may encounter are media and hardware related. One common problem is
    trying to burn faster than the media you have in the drive can support. This will
    frequently result in a bad CD. Sometimes the burning software will detect that
    a bad burn has occurred, but other times it will not, and you will not know until
    you try the CD in the destination machine. Another common problem that can be
    the source of great frustration is insufficient disk space. This error means you
    have to clear off files from your computer or to open up enough space to hold
    the data for the burn. This difficult problem to remedy is hardware misconfiguration.
    This is where the operating system on your source machine does not properly recognize
    the burning capabilities of the drive or possibly even drive''s existence at all.
    In such a case, you will need to consult any documentation that came with your
    drive or computer to get it configured properly before attempting to burn the
    Ubuntu CD.'
  merge: -1
  img_proc: true
