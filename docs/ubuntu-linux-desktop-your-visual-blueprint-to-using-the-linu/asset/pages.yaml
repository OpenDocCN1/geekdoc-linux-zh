- pgno: 171
  md: '# # Create Notes for Yourself with Tomboy Notes


    Tomboy Notes enables you to make short notes to organize your ideas and thoughts.
    Tomboy Notes shines as a reminder system, its real potential lies in the ability
    to link notes together and to add hyperlinking to Web sites, files, and event
    messages.

    The first time you launch Tomboy Notes, you will see two different windows: the
    Search All Notes window and the Start Here window. The Search All Notes window
    will become your standard interface into your Tomboy Notes collection. Start Here
    is intended to give you a quick introduction to the system and does so by showing
    you access notes.

    Although the Start Here is a quick and easy way to learn the system, you should
    also feel free to jump in and try it. Create a new note from the Search All Notes


    window. New notes appear in windows of their own, ready to go. The system automatically
    saves your notes as you work; you do not need to worry about losing anything.

    After creating a note, you can automatically link it to another one using the
    Link button on the toolbar. When you have a collection of related notes, you can
    join them together by putting them into collections using the Notebook book on
    the toolbar. As searched and the Tools gives you access to formatting and even
    spell-checking.

    The Tomboy Notes application is one of those that makes you wonder how you lived
    without it. The linking power of the system is the key: Join together concepts,
    ideas, and resources to create your own de-facto-wiki.


    # Create Notes for Yourself with Tomboy Notes


    +   1. Click Applications -> Accessories -> Tomboy Notes.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_171_0.png)


    The Tomboy Notes application appears.


    +   2. Click File -> New.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_171_1.png)


    158'
