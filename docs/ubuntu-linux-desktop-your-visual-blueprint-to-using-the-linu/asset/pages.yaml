  md: '# Ubuntu linux loads.

    VERIFY THE AVAILABLE RESOLUTIONS


    +   1 Click System -> Preferences -> Screen Resolution.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_20_0.png)


    The Monitor Resolution Settings dialog box appears.


    +   2 Click here and verify that the list of available resolutions includes the
    one you want to use.


    +   3 Click Close.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_20_1.png)


    # Extra


    Ubuntu provides many language and accessibility options. Accessibility support
    is provided directly from the initial screen of the live CD, enabling selection
    of everything from a high-contrast theme to free Braille support and even screen
    reading.


    The Modes selection on the first boot screen enables you to pick different modes
    of operation for the boot process itself. The Normal mode is the default bootstrap
    for Ubuntu. The Safe Graphics mode provides a low-resolution, safe way, to boot
    Ubuntu on older hardware or hardware with an unrecognized graphics card. You can
    also use a driver update CD or a manufacturer installation.


    The Other Options selection on the initial boot screen enables you to enable and
    disable certain features that are normally, but not always, supported by hardware.
    This can help you if you have problems booting or experience strange behaviors
    to hardware not conforming to the standard. Advanced Configuration and Power Interface
    (ACPI) is a feature that sometimes has hardware support issues. It replaced an
    older standard and may or not be fully supported by your hardware. The Advanced
    Programmable Interrupt Controller (APIC) support is another common source of issues
    for similar reasons.


