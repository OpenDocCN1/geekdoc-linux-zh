- pgno: 153
  md: '# # Insert Special Characters with the Character Map


    The Character Map window provides a way to access all the characters that are
    available in your system. This is most frequently used to find and insert into
    your documents characters that do not normally appear on your keyboard, such as
    the copyright symbol.


    The GNOME Character Map application, technically known as gcharmap, is particularly
    powerful; it is based on the Unicode Character Database, which gives your system
    access to an incredible assortment of characters, including foreign alphabets,
    phonetic alphabets, and even Braille characters. Finding the right character or
    symbol in the middle of this huge assortment of options is what the Character
    Map application comes in handy.


    You can browse the available characters and symbols by category, using the label
    Script, or search for them via the options under the Search menu. Given the wide
    number of options available, the search feature is particularly useful. Each character
    in the collection is accompanied by a description. You can search for the character
    you want by using common descriptive terms. So, for example, if you want to see
    what options exist for the Euro currency symbol, simply type euro in the Search
    box. When you have identified the character you need, use the font selection combo
    box to match the character with your document''s font style. You can zoom in and
    view the character in whatever size you choose.


    # Insert Special Characters with the Character Map


    +   1. Click Applications -> Accessories -> Character Map.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_153_0.png)


    The Character Map application appears.


    +   2. Click Search -> Find.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_153_1.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The Find dialog box opens.


    +   3 Type your search term.


    +   4 Click Next.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_154_0.png)


    +   - The first search result is highlighted.


    +   5 If the character is the one that you want, copy and paste it into your document.


    **Note:** Alternatively, you can simply click the character and drag it to your
    document.


    +   - If the character is not the one that you want, click Next to view other
    search results.


    # Extra


    The Character Map application can also be used to help you learn more about the
    characters you see on your screen. The Character Details tab includes information
    about each individual character in the system. To use this tool, select a character
    and click the Character Details tab to view the information associated with that
    character.


    Although some of these details may seem esoteric, if you are a developer, you
    may find this information to be very useful. You can learn, for example, the character''s
    proper name, its UTF-8 encoding, and its Unicode code point. A typical user may
    not have a great need for that particular feature, one closely related feature
    that is useful to everyone is the Character Map''s capability to identify characters
    that you do not recognize.


    If you have a document with an unusual character, simply open the Character Map
    application, select the character with your mouse, and drag it into the Character
    Map''s window; if there is a matching character, it will be shown automatically.
    You can then click the Character Details tab to learn about that character.'
