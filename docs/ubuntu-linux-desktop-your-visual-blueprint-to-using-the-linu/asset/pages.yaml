    The two settings that are actually part of the Assistive Technologies Preferences
    itself are the Enable Assistive Technologies checkbox, which allows you to enable
    the assistive technologies within the GNOME desktop, and the Password Dialogs
    As Normal keyboard, which enables you to use an onscreen keyboard that asks you
    for your password administrative tasks.


    Assistive technologies allows persons with disabilities to use computers much
    more easily or at all. Ubuntu has several features in the default that install
    assistive technologies to read the output on the screen. For input, there is the
