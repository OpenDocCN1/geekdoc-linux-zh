- pgno: 231
  md: '# Work with Styles


    O penOffice Writer includes an option to apply styles, which ease the burden of
    document formatting. Using styles, you can control the appearance of items throughout
    the document and manage them as a group.


    Indent and associate style with the paragraphs that you want to change.


    When you use a style to control the formatting of multiple paragraphs, you can
    affect all the paragraphs by changing the style definition. When you change the
    style definition, all the paragraphs associated with that style will reflect the
    change that you made.


    When you format documents, you can either do so by item, or you can apply a style
    that will handle all the items of the same type. When you define a style, you
    set the attributes that will be applied to the items.


    By default, Writer includes a set of predefined styles. You can apply those styles
    by selecting the text that you want to format and then choosing the style from
    the Styles and Formatting drop-down list. Clicking More in the Styles and Formatting
    drop-down list opens a dialog box showing the full list of default styles.


    For example, let''s say you want to indent the first line of the opening paragraph
    in each section of a document. You have a choice: You can manually define each
    individual paragraph according to those rules, or you can apply Writer''s default
    style named First Line


    The next section, "Create a Paragraph Style," discusses how to create a new style
    for your use.


    # Work with Styles


    # APPLY A STYLE


    +   1 Select the paragraph to which you want to apply a style.


    +   2 Click here and select to see all the available styles.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_231_0.png)


    The Styles and Formatting dialog box opens.


    +   3 Double-click the style that you want.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_231_1.png)


    218'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The style is applied to the paragraph.


    # APPLY THE DEFAULT STYLE


    +   4 Select the paragraph.


    +   5 Click here and select Default.


    The Default style is applied to the paragraph.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_232_0.png)


    # Extra


    It is possible to edit an existing style. Click Format -> Styles and Formatting
    or press F11. The Styles and Formatting dialog box opens, displaying a list of
    the existing styles. Right-click the style that you want to edit and select Modify.
    The Modification dialog box opens, showing you all the various attributes associated
    with the style. You can change whatever you want using this dialog box. Navigate
    through the various choices using the tabs at the top. Note that in this dialog
    box, when you have finished, you can also rename a style. When you finished, click
    the OK button.


    If at any time you want to revert to the default style, you can do so by selecting
    the Reset button on the Modification dialog box. Note also the Standard button
    in this dialog box; it operates Reset, but it only affects the tab that is visible
    at the time you click it. As with most screens in OpenOffice, there is a Help
    button, which can be of great assistance in demystifying the multiple choices
    that are associated with this task.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_232_1.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Create a Paragraph Style


    If you need something other than the default styles, you can create custom styles.
    A new style is typically based on an existing style, which you use as a starting
    point; if not, you can use a benchmark for your own definition.


    After you have set the preliminary attributes, use the tabs of the Paragraph Style
    dialog box to want your style to exhibit. You can check your work by applying
    your new style to text. If you need to make adjustments to your style, right-click
    your name in the Styles and Formatting list and choose Modify.


    # Create a Paragraph Style


    +   Select the paragraph that you want to use as a starting point for your style.


    +   Click the Styles and Formatting button.


    +   Right-click the name of the style that is currently applied to the paragraph.


    +   Click New.


    The Paragraph Style dialog box opens.


    +   Type a name for the style that you are creating.


    +   Click here and select the style that will be automatically applied to paragraphs
    just after your new style.


    +   Click here and select a style that you want your new style to be linked with,
    if any.


    +   Click one of the other tabs to apply its formatting to your new style.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_233_0.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The tabs comes to the front.


    Click the options that you want for your style, such as Display Drop Caps in this
    example.


    +   - You can click other tabs and apply other formatting to your style as needed.


    Click OK when finished.


    +   - Your new style is created and applied to the paragraph.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_234_0.png)


    # Extra


    Writer classifies styles into five categories: Paragraph, Character, Page, Frame,
    and List. Paragraph styles are used to affect entire paragraphs. Character styles
    are used to affect a block of text inside a paragraph. Page styles affect your
    page formatting. Frame styles are used to affect frames and graphics. Style lists
    affect outlines, numbered lists, and bulleted lists.


    When you create a new style, you will need to assign it to the appropriate category.
    Using the categories properly is a useful method for organizing large collections
    of styles. To view by style, use the icons at the top left of the Styles and Formatting
    dialog box. Note that at the bottom of the Styles and Formatting dialog box, a
    dropdown box that contains four filters for your styles: Hierarchical, All, Applied
    Styles, and Custom Styles. Use the Custom Styles filter to help find the styles
    that you have defined. Applied Styles shows you the styles used in the document
    that is open in your window. The Hierarchical filter shows styles that are associated
    with and dependent upon other styles. All is the default filter and shows all
    the styles available.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_234_1.png)


    Chapter 9: Creating and Editing Documents with OpenOffice.org'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Insert Headers and Footers


    You can control the area that appears at the tops and bottoms of your pages through
    the insertion of headers and footers. Headers are areas that always appear at
    the top of the pages, and footers appear consistently at the bottoms of pages.


    When you create a new header or footer, a blank area appears on each page in the
    corresponding area, in which you can place text or fields common to every page
    of your document. Pages can support the display of either a header, a footer,
    or both.


    Writer provides quite a range of flexibility for formatting the header and footer
    regions. Headers and footers can be displayed in Portrait or Landscape modes.
    In Landscape mode, the header and the footer appear on the left and right side
    of the page.


    Writer also includes a feature known as fields, which allows you to insert into
    the page information that can be controlled consistently throughout the document.
    A field, for example, can be used to insert the page numbers automatically or
    to insert the date, or author''s name.


    After you have created a new header or footer, you can click in the area to insert
    whatever text you want, or you go to the Insert menu and choose one of the options
    from the Fields submenu. You could, for example, click inside the footer area
    and then choose Page Number from the Fields submenu to insert the page number
    on every page of your document.


    Any text or fields placed inside the header or footer can be controlled by Writer''s
    formatting options.


    # INSERT A HEADER


    +   1 Click Insert -> Header -> Default.


    The header area appears in your document.


    +   2 Type the text or insert the fields that you want for your header.


    +   • To insert a field, Insert -> Fields and then the type of field that you
    want.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Extra


    Page numbers can be formatted in a variety of fashions. The total page count can
    be paired with the page number to display the total number of pages together with
    the current number of the current page. To create this format, click in the footer
    area. Type the word Page. Next, click Insert -> Fields -> Page Number. Then type
    the word of. Finally, click Insert -> Fields -> Page Count. Now, when you view
    your page, the output in the footer will read, "Page (page number) of (page count),"
    for example, "Page 1 of S."


    Other page number formats can be achieved by highlighting your page number and
    then clicking Format -> Page. When the Page Style dialog box opens, choose the
    option Format from the Page tab. The Format drop-down list contains a list of
    alternative styles that can be applied to the page numbers. Select the style that
    you want to use and then click the OK button. Your pages should now reflect the
    page number format that you selected. Alternating page numbers can be created
    by choosing the options on the Page Layout drop-down list on the same tab.


    Click Insert -> Footer -> Default.


    The footer area appears in the document. Type the text or insert the fields that
    you want for your footer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_236_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_236_1.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # Using Page Formatting Options


    You can affect the layout and formatting of your page as a whole using the Page
    Style options. To view the choices available, open the Style dialog box as shown
    below or by clicking the Styles and Formatting button and selecting the Page Style
    at the top of the dialog box that opens.


    Using Writer''s Page formatting tools, you can set page margins and control headers,
    footers, and the positioning of text on the page. You can create multicolumn layouts
    on the Columns tab of the Page Style dialog. Other options include decorative
    effects, such as a background, a border, or a shadow to the content area. As mentioned
    in the previous section, the controls on the Page tab also affect the formatting
    of the page numbers. The Footnote tab is also useful as it allows you to control
    the formatting of the footnotes on your pages.


    All page formatting can be done through the use of the Page Style dialog box.
    The default installation comes with a number of page styles. The Default style
    is applied in all situations where another style has been specified. The Default
    style should be suitable for most uses.


    Given the importance of the Default style, you may want to adapt it to your usage.
    Default page dimensions, for example, are for the usual: North American format
    — 8.5 by 11 inches. If you use A4 paper, you may want to modify the Default style
    so that the page contents fit A4.


    If modifying the existing style does not suit your needs, you can create new styles
    as you see fit. The creation of new styles is covered in the section "Create Styles,"
    earlier.


    # Using Page Formatting Options


    +   1 Click Format → Page


    ![](img/b68319171116e7cb6d71d28d5b12e08c_237_0.png)


    The Page style dialog box opens.


    +   2 Change the page setup as needed, such as changing the format to A4.


    +   3 Click another tab to change its page settings.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_237_1.png)


    224'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The tab comes to the front.


    Change its settings as needed.


    In this example, the border line style is set to 0.50 pt, the shadow position
    to bottom right, and the page to bottom .20 inches.


    +   - You can click other tabs and set other page formatting as needed.


    +   - Click OK.


    The new page style is applied to the document.


    # Extra


    Writer is distributed with ten different predefined page styles. Although the
    Default page style is certainly the most important, the other nine varieties deserve
    merit. You can view the entire list of options by clicking the Styles and Formatting
    button and selecting the Page Style button.


    There are several styles that are devised to assist with the creation of books
    and manuscripts. The Left Page and Right Page styles are intended to work together
    to allow you to create facing pages. The First Page and Index styles create pages
    suitable for the formatter and index of a manuscript. The End Note and Footnote
    styles supply the most commonly used formats.


    The remaining two styles are of more limited appeal. The HTML style creates a
    page layout that contains formatting that can be reproduced easily in HTML. If
    you use this style, remember that you must still save your file as HTML for it
    to be usable online. The Envelope style is the most specialized style; it is intended
    to ease the creation and printing of C6 envelopes.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# # Place Graphics in a Document


    You can enhance the visual appearance of your documents by inserting images into
    them. OpenOffice Writer supports the inclusion of most popular image formats,
    enabling you to use these graphics in your documents.


    To started, you need to make sure that the graphics file you want to use is accessible
    from your local computer. The source of the image does not matter, but the image
    file itself has to exist either on your computer or be imported from a scanner
    for Writer to be able to insert the image into your document.


    To insert an image, first place the cursor where you want the image to appear
    in the text. Then you use the Insert Picture dialog box to navigate where the
    image is stored and insert the image in the document.


    When the image appears in your document, you will see the Picture toolbar. The
    toolbar enables you to make changes to the image''s color or transparency and
    gives you the ability to rotate it. If you do not need the Picture toolbar, you
    can close the Picture toolbar.


    If you want to move the image relative to the text on the screen, you can grab
    the image with your mouse and drag it to where you want it to appear. Alternatively,
    if you right-click the image, you will find a number of options that allow you
    to control its placement and positioning.


    # Graphics in a Document


    +   1 Click Insert -> Picture From File.


    +   2 Navigate to the folder containing the image file that you want to insert
    into the document.


    +   3 Click the image filename.


    +   4 Click Open.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_239_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_239_1.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'The image appears in the document.


    Click the image and drag it to the location in the text that you want it.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_240_0.png)


    The image is repositioned.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_240_1.png)


    # Extra


    Insert Picture dialog box has several useful features. On the right side of the
    dialog box, below the main navigation panes, are filters that let you change what
    is displayed in the dialog box''s window. The filters enable you to exclude unwanted
    images and show only the files of a certain type. This feature is very useful
    when you have large collections of images and you know what file type you are
    searching for.


    On the bottom left are two check boxes labeled Preview and Link. Checking Preview
    allows you to preview an image directly in the Insert Picture dialog box, prior
    to inserting it into the document. The Link check allows you to include an image
    by linking to the image rather than inserting it directly into the document. Linking
    to an image is particularly useful as it allows you to maintain the image separately
    from the document. Be aware, that if you move the image file, the link will be
    broken, and the image will no longer appear in your document. Moreover, if you
    change the image''s dimensions, you will want to make sure that it does not break
    your page layout.


    Chapter 9: Creating and Editing Documents with OpenOffice Writer'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# # Insert Table


    You can insert tables into your documents through the use of Writer''s table-creation
    tools. Tables are useful for a variety of purposes, including formatting text
    and images, controlling complex data, and creating forms.


    OpenOffice.Writer provides a large number of options for handling tables in documents.
    The application includes both a menu and a toolbar dedicated to tables. To insert
    a table into a document, you use the Insert Table dialog, by which you can select
    the number of columns and rows that you want to include in your table. You can
    also set other options for your tables, including table borders.


    powerful set of tools for manipulating your table formatting. By selecting the
    icons on the toolbar, you can add or subtract columns or rows from your table.
    You can also split or merge cells and control the table''s visibility. The toolbar
    appears floating on the screen, when you click outside of the table, the toolbar
    will disappear: it will reappear the next time you click inside the table. You
    can also force the toolbar to appear by clicking the check box next to Table option
    under View →


    In addition to using the tools in the toolbar, you can change the height and width
    of your table by clicking the table lines and dragging them to the size that you
    want.


    When your new table appears in the document, the Table formatting toolbar also
    appears. The toolbar contains a


    ![](img/b68319171116e7cb6d71d28d5b12e08c_241_0.png)


    +   Place your cursor where you want your table to appear.


    +   Click Table → Insert → Table.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_241_1.png)


    The Insert Table dialog box appears.


    +   Click here and select the number of columns that you want.


    +   Click here and select the number of rows that you want.


    +   Click OK.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# The table appears in the document.


    If you need to add a row, you can click the Insert Row button.


    If you need to add a column, you can click the Insert Column button.


    In this example, a new row and column are added to the table.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_242_0.png)


    # Extra


    The Sum function on the Table toolbar enables you to insert mathematical functions
    into a Writer table, turning your Writer table into a basic spreadsheet. Although
    the spreadsheet functions in a Writer table are not as advanced as those in OpenOffice.org
    Calc, there are a number of similarities.


    When you click the Sum button on the Table toolbar, a calculations toolbar appears
    immediately above your document''s content area. The calculations bar is extremely
    useful, as it shows you the name of the active cell and provides you with a number
    of operators. On the right of the toolbar is a formula field that you can see
    your work as you build your formula.


    Creating formulas allows you to set up tables that automatically calculate values
    for cells based on the contents of other table cells. Operations can be performed
    on table cells by representing the cells by letter and number, similar to what
    you would find in other spreadsheet programs. In addition to basic arithmetic
    operations, you can also employ Boolean operators, statistical operators, and
    functions such as sine, cosine, and tangent.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # Print a Document from OpenOffice.org


    You can print documents directly from OpenOffice Writer. Printing from Writer
    gives you a great deal of control over the print output and allows you to print
    all or part of a document.


    Writer gives you two options for printing: a quick print button and the Print
    option under the File menu. To perform a quick print, simply click the Print Directly
    button on the toolbar. The Print dialog will open.


    The Print dialog allows you to select a printer and set the print range. You can
    print all of a document, certain pages, or just part of a page. The Print dialog
    also enables you to set the print order and number of copies that will be printed.


    You can open the Print Options dialog box from the Print dialog box, which includes
    a number of additional features, including the ability to print only selected
    elements—for example, the document text with the Reversed order. The Print Options
    dialog box also includes the Reversed order which prints your document from last
    page to first.


    The properties at the top right of the Print dialog box opens the Printer Properties
    dialog box. On the Paper tab, you can set your paper size and orientation. On
    the Device tab, you can control a large number of additional printer-specific
    properties that directly affect the print quality.


    Note that after you have sent a job to the printer, you can manage the job using
    the Manage Print application discussed in Chapter 6.


    # Print a Document from OpenOffice.org


    +   1. Click File -> Print.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_243_0.png)


    The Print dialog opens.


    +   2. Click Options.,


    ![](img/b68319171116e7cb6d71d28d5b12e08c_243_1.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The Printer Options dialog box opens.


    Click to select the options that you want.


    Click OK.


    You are returned to the Print dialog box.


    You can click Properties to change the paper and printer settings.


    Click OK.


    The document prints.


    # Extra


    With the Page Preview command, you can preview documents before you print them,
    thereby allowing you to check the formatting and page layout as they will appear
    in the printed document. To use this handy feature, click the Page Preview button
    or click File -> Page Preview.


    After you select Page Preview, the main content window will change to show the
    pages of your document in full-page view. Use the icons above the Preview pane
    to navigate through your document. You can view more than one page at a time,
    or you can zoom in or out to get a better view of your document.


    Click the Book Preview icon to view your document as facing pages. The left and
    right pages will be shown in their proper placement – a very useful feature if
    you are planning to print and bind your document like a book.


    If you are happy with what you see and are ready to print your document, click
    the Print Page View button to open the Print dialog box.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_244_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_244_1.png)


    Chapter 9: Creating and Editing Documents with Openoffice.org writer'
