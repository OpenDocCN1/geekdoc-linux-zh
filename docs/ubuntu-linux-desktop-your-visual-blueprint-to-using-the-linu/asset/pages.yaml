- pgno: 175
  md: '# Play Games


    Ubuntu Linux Desktop comes bundled with a collection of 17 games of skill and
    chance. All the games can be played alone or against the computer, and some support
    multiple human players. The games vary from classics as Chess to more contemporary
    games such as Robots. There are games of logic and skill, card games, and problem-solving
    games. Chess provides a numerous of popular options and can be networked for remote
    play. For traditionalists who prefer card games, there is a choice between FreeCell
    Solitaire and AisleRio Solitaire. The former offers one mode of play, the latter
    includes over 80 variations, including the popular Klondike and Canfield varieties.


    Problem-solving games are the most numerous in the set. The Mahjong game provides
    a large number of variations in the game set, which can be combined to create
    numerous levels of difficulty. Four-in-a-Row, Five or More, and lagno also bear
    a certain resemblance to other. Each is rooted in games such as Reversi and provides
    variations that keep this style of play fresh and interesting. Same GNOME is a
    matching game that is one of the easier in the set, but can still be quite fun.


    For those who prefer mathematical games, the popular Sudoku is here. Tetrax is
    a math-oriented matching game that can be very challenging.


    For sheer escapist gaming, there is Robots, Mines, Gometris, and Nibbles, all
    basic spatial problem-solving games.


    For card lovers, there is Blackjack, the ever-popular 21.


    For those who prefer dice games, there is Tali.


    Note that most games are easier to use in full-screen mode.


    # Play Games


    +   1. Click Applications.

    2. Click Games.

    3. Click the game that you want to play.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_175_0.png)


    The game opens.


    +   4. Click View -> Fullscreen.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_175_1.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The game expands to fill the full window.


    5 Play the game.


    Note: Different games have different options.


    +   - Aisle Riot Solitaire, you can change from the default game of Klonike by
    clicking Select Game and choosing Canfield in the dialog box.


    +   - In this example, the game board changes to display Canfield.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_176_0.png)


    # Apply It


    The games bundled in Ubuntu are part of the GNOME Games pack. GNOME Games supports
    networked multiplayer gaming through the GGZ Gaming Zone at www.ggzgamingzone.org.


    The following games currently support network play: Nibbles, lagno, Four-in-a-Row,
    and Chess. According to the GNOME Games Web site, other games are currently under
    development and will be added to the program in the near future.


    To activate this feature, you need to select Network Game from the game''s menu.
    If you are connected to a network, you will see a connection dialog box that allows
    you to put in the server profile and user details. After you have successfully
    connected to the server, you will find an assortment of gaming rooms from which
