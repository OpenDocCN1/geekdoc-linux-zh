- pgno: 261
  md: '# Create a Presentation


    You can use OpenOffice Impress to create slideshows. Slides created with Impress
    can contain images and text and can be enhanced with a variety of styles and effects.
    You can create transitions to make your slideshow more visually engaging, and
    you can add notes and handouts to make the slideshow useful and informative.


    new presentation or by selecting Do Not Show This Wizard Again on the user interface.


    The first step of the Presentation Wizard asks you what you want to do: Create
    an empty presentation, create a presentation from a template, create an existing
    presentation. In the second step, you can select a background for all your slides
    and customize the appearance of the slides. Use this method that you will use
    to display the presentation. The third and final step enables you to select slide
    transitions and timing.


    There are several ways to create a new presentation. Impress includes up a Presentation
    Wizard that can be used to quickly set up a new slideshow. The wizard launches
    automatically the first time you open the program and thereafter each time you
    create a new presentation by using the File -> New command. You can bypass the
    wizard by using the shortcut Ctrl + N to create a


    When you create a new presentation, it appears in the central pane of the Impress
    application containing only one slide, as shown in the section "Insert a Slide
    and Add Text," you can add additional slides easily.


    # Create a New Presentation


    +   1 Click Applications -> Office -> OpenOffice.org Presentation.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_261_0.png)


    The Presentation Wizard opens.


    +   2 Click Empty Presentation.


    +   3 Click Next.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_261_1.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Step 2 of the Presentation Wizard appears.


    Click here and select Presentations or Presentation Backgrounds.


    The list of presentation templates or backgrounds appears.


    Click the presentation or background that you want.


    Click Next.


    Step 3 of the Presentation Wizard appears.


    You can choose how to transition between slides or the presentation type.


    Click Create.


    The new presentation is created and displayed for editing.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_262_0.png)


    # Extra


    Both the Presentation Wizard and the File -> New -> Templates and Documents option
    enable the creation of new presentations based on existing templates. Templates
    provide you with standardized forms that enable the rapid creation of a presentation.


    When you open the Templates and Documents dialog box, you see a number of directories.
    Two of the directories, Presentation Backgrounds and Presentations, are relevant
    to import. The Presentations background directory contains a collection of backgrounds
    for your slides; using one of these templates does nothing more than create a
    presentation with a single slide containing the background. Two of the templates
    inside the Presentation directory, however, are multislide presentations. Open
    the Presentations named Introducing a New Product or Recommendation of a Strategy,
    and you will find a set of seven slides, complete with backgrounds, titles, and
    formatting — all you need is to add your own content.


    You can also turn an existing presentation into a template that you can reuse.
    To create new template out of a presentation, click File -> Templates -> Save.
    You can edit existing templates by clicking File -> Templates -> Edit.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # Insert a New Slide and Add Text


    You can add new slides to any presentation. Slides can be either based on the
    other slides in the presentation, or can be created from scratch. Text can be
    added to predetermined or new areas on any slide.


    You have several choices for creating a new slide. The Insert menu offers two
    choices: Slide and Duplicate Slide. The Slide option inserts a new slide with
    the presentation''s default background. If you select an existing slide and choose
    Duplicate Slide from the Insert menu, Impress adds a new slide identical to the
    one that you have selected.


    You can also create a new slide by clicking the New Slide button. If no slides
    are selected in the Slides pane,


    Impress will create a new blank slide. If a slide is selected, clicking the New
    Slide button inserts a duplicate of the selected slide.

    To add to any slide, select the Text button on the Drawing toolbar, located at
    the bottom of the screen. After you have clicked, position the mouse cursor on
    the slide where you want to type and click and drag to create the text box. When
    you release the mouse button, the cursor will be inside the new text box; simply
    type the text that you want.

    If you use a preset layout with text areas, you can simply click in the text area
    and begin typing. This method is fast and easy, but you sacrifice some flexibility.


    # Insert New Slide and Add Text


    # INSERT A SLIDE


    +   1 With your basic one-slide presentation open, click Insert -> Slide.


    **Note:** See the previous section, "Create a New Presentation," to create a basic
    presentation.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_263_0.png)


    +   * A new slide appears in the window.


    # CREATE A TITLE SLIDE


    +   2 Click the first slide.


    +   3 Click the Title Slide layout.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_263_1.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The Title Slide layout is applied to the slide.


    Click inside the title box.


    Type the title of your presentation.


    Click inside the text box.


    Type text to introduce your presentation.


    The title and body text appears in the slide.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_264_0.png)


    # ADD TEXT TO A SLIDE


    +   - Click the slide.

    - Click the Text button.

    - Click and drag where you want your text box.

    - Type your text.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_264_1.png)


    # Extra


    In the right pane of the Impress window is the Layouts tab. Clicking this tab
    displays 28 predefined layouts that you can use on any slide. Some of the layouts
    are simple title slides, and others combine a title area with a text area; still
    others combine a title with one or more object areas. Object areas can display
    graphics, charts, or tables.


    To apply a layout to a slide, click once on the slide to select it and then click
    the layout. Impress will automatically associate the layout with the slide. To
    use the layout, click inside the designated areas on your slide.


    To change the layout, select the slide and then click the different layout that
    you want to use; the newly selected layout will appear on the slide, replacing
    the old layout.


    Changing the layout of existing slides can be confusing. If the slide already
    contains content, changing the layout will not delete the content; Impress will
    try to rearrange the slide content, and when that is not possible, it will overlay
    the new layout on your existing content. Although this may create undesired results,
    you can always rearrange things manually.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# # Insert Images and Slide Objects


    You can insert images, graphs and charts, tables, and other media objects into
    your slides. By adding imagery to your slides, you can create compelling and interesting
    presentations.


    Impress supports a wide array of media. Not only can you insert common objects,
    such as pictures, but you can also add sound clips, movies, and even applets and
    data objects.


    If you are using the Insert dialog box for control your slide layouts, images
    and other objects can be placed by simply clicking inside the appropriate object
    area on the slide. In this fashion, you can add pictures, charts, and tables.
    If you want to control the placement exactly, manual insertion of the objects
    is the best part.


    When you insert an image, you have to choose to use either inserting an existing
    image that is located on your drive or a scan of a new image. If you choose to
    insert an existing image, click the File option on the Insert Picture submenu.
    This opens the Insert dialog box, which you use to insert the image.


    Inserting other media types is managed the same way; you merely choose a different
    media type from the Insert menu. There are dedicated choices for Movie and Sound,
    Spreadsheet, Chart, and other types of objects. Pick the one that matches your
    needs, and Impress will guide you through the process of inserting it into your
    slide.


    # Insert Images and Slide Objects


    +   - Insert Click.


    +   - Click the type of object that you want to insert.


    Note: If you click Picture to insert an image, click From File on its submenu.


    +   - Alternatively, to insert an image, you can click the From File button.


    The Insert dialog box for the object opens — in this example, the Insert Picture
    dialog box.


    +   - Navigate to the folder containing the object that you want to insert.


    +   - Click the object filename.


    +   - Click Open.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_265_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_265_1.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_265_2.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The object appears in the slide.


    For an image, you can click the handles and drag to resize it to fit the space.


    The image is resized.


    # Extra


    The Impress application window is divided into three areas. From left to right,
    they are the Slides pane, the workspace, and the Tasks pane.


    The workspace, in the center pane, is where you will do the majority of your work
    creating and editing individual slides. Note the tabs at the top, above the slide:
    Normal, Outline, Notes, Handout, and Slide Sorter. Normal view is your editing
    window. Outline shows the presentation as a bulleted point outline. Notes and
    Handout are where you can create supplemental materials for the presenter or the
    audience. Slide Sorter is a way to view the entire presentation at a glance and
    rearrange slides.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_266_0.png)


    Chapter 11: Creating and Editing Presentations with OpenOffice.org Impress'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# # Modify the Slide Design and Layout


    You can make changes to the design and layout of your slides across the entire
    presentation or a single slide at a time. Automatic design and layout choices
    can be easily changed, or if you prefer, you can make changes manually to create
    a tailored appearance for your presentation.


    On the Master Pages tab, you can modify your slide backgrounds, fonts, and basic
    page formatting by selecting from the preexisting master pages. Simply click the
    master page design that you like, and it will be implemented across the presentation.


    Impress gives you two alternatives for modifying existing slides: either with
    the automatic design and style options or entirely manually. The question of which
    approach is right for you depends on whether you are trying to implement a change
    across the entire presentation or only to one slide. Changes to the presentation
    as a whole are done from the Master Pages tab of the Tasks pane; changes to the
    master page affect all the slides that are based on that master.


    Layout options are more useful for individual slides. Click to select a slide
    and then choose the layout from the Layouts tab in the Tasks pane. If you already
    have content on your slide, changing the layout may affect it.


    If you do not want to apply these automatic options, the best bet is to select
    the object that you want to modify and make your changes to the text, item size,
    and so on. You can edit individual slide contents in the workspace, under the
    Normal tab. Clicking any object on a slide will make it editable. Changes made
    to individual slides do not affect others.


    # ## USE A MASTER PAGE TO CHANGE THE DESIGN


    +   1. Click the Master Pages tab.

    2. Click the thumbnail of the master page to which you want to change.


    +   - The new background is applied to the entire presentation.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_267_0.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# MANUALLY CHANGE THE LAYOUT OF A SLIDE


    Click the image or other object and drag it to where you want it in the slide.


    Click the text box and drag it to where you want it.


    The layout changes to the slide layout are applied.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_268_0.png)


    # Extra


    There are two ways to change the background of an individual slide without affecting
    the other slides in the presentation. The two methods offer different options,
    so you need to be aware of both.


    The simplest method for changing the page background is to click Format -> Page.
    The Page Setup dialog box opens. On the Background tab, there are multiple options
    for controlling the slide background. You can choose no background at all, or
    you can select a bitmap image, a solid color, a gradient pattern, or a hatching
    pattern. All of the options can be edited to a certain degree. Other controls
    on this tab allow you to set the position of the background.


    The other option for changing the background, Slide Design, allows you to tap
    into the templates in the system. Right-click the slide that you want to change
    in the Slides pane. Click Slide Design. The dialog box that pops up shows the
    backgrounds you use in the presentation. You can either select from one of them,
    or you can click Load to call up a list of all the templates.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_268_1.png)


    Chapter 11: Creating and Editing Presentations with OpenOffice.org Impress'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Select a Slide Transition and Add Slide Animation Effects


    To add motion and interest to your presentation, you can create animations between
    your slides, and you can also add movement to the objects on the page. Although
    it is easy to overdo animation effects in a presentation, animation can help keep
    the audience''s interest and add some polish. Impress supports a set of animation
    effects that are ready to use.


    Applying an animation effect requires you to select the object or pages to be
    animated and then select the animation effect. After you have selected the effect,
    you can fine-tune the settings to make the effect behave as you want to.


    Slide transitions are a type of animation, but they affect the entire slide, rather
    than just one element on it. To set up a transition, use the Slide Transition
    tab in the


    Tasks pane. You select from the list of transition effects and check the other
    options to see if they require adjustment. When you select a transition, it will
    be previewed in the window. To see the preview, click the Play button.


    To add animation to a slide object, you use the Animation tab in the Tasks pane.
    You open the Animation dialog box, which displays the options available. Note
    that there are tabs at the top and a number of options to explore. When you select
    an animation, it will be applied automatically. Note that the Custom Animation
    tab also has several configuration options that you can use to customize the effect.


    # Select a Slide Transition and Add Slide Animation Effects


    # ADD A SLIDE TRANSITION


    +   Click the slide that needs a transition.


    +   Click the Slide Transition tab.


    The Slide Transition tab opens.


    +   Click the transition that you want.


    +   The transition is added to the slide.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_269_0.png)'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# ANIMATION

    EFFECTS


    Click the element

    that will be

    animated.


    Click the Custom

    Animation tab.


    Click Add.


    The Custom

    Animation dialog

    box opens.


    Click the animation

    that you want.


    Click OK.


    The animation

    effect is now active

    for the selected

    element.


    # Extra


    Managing animation menu can be time-consuming, and it can also be a real distraction
    from your message. It is best to

    limit your use of these effects to only those situations where they add rather
    than distract from your

    message.


    If you elect to use animation, check out the options you have for configuring
    them. After you animation to

    an object, you will see that the name of the animation appears in a box near the
    bottom of the Custom Animation tab. This shows all animations associated with
    the object. Select an animation and right-click it.


    The right-click menu contains several options with which you should be familiar.
    First, you can determine whether the

    animation plays immediately when the slide loads or whether it needs to wait for
    you to click. You can also set the

    order of the animation, relative to other animations on the same slide. You can
    set the animation to play at a certain

    time using the options under the Timing label. Also worth noting is the ability
    to tie audio to an animation or to

    group together multiple objects on a slide to animate them as a set.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_270_0.png)'
