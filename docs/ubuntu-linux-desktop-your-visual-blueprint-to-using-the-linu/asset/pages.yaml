    # Extra


    Why is desktop search popular? With the vast amounts of digital content available
    to us each day, via Web pages, email, files and attachments, downloads, and purchased
    media content, it is very easy to misplace something on your computer. Hard drive
    sizes increase each year, and the more they, the more we tend to fill them. With
    a desktop search you can essentially stop worrying where you put a file and quickly
    locate it by not only its filename but also all its contents. This is a tremendous
    advantage because our brains work more on the semantic notions of what a piece
    of information was about, not necessarily the verbatim details of a filename.
    In fact, filenames can even be misleading with respect to the content of the file.
    By leveraging the computer to sift through massive amounts of information and
    keep track of it all at a level of tedium that no human can, we can divest ourselves
    of the clerical task of where things are and focus on the task at hand.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Adjust Window Manager Behavior


    The X Window system was designed from the ground up as a componentized set of
    services and applications consuming those services. A window manager is merely
    another action upon X, which controls the position, size, and behavior of a window.
    You can adjust how the window manager comes with Ubuntu by using the Window Preferences
    application.


    currently rested within. This behavior is still available using the Window Selection
    method. When enabled, a window will become active when the mouse pointer enters.


    The action taken by the window manager when a bar is clicked is also selectable.
    The default is to toggle between maximized and normal window sizes, you can also
    have the window minimize when the title bar is double-clicked. You can also have
    a window “roll up” — the body of the window disappears, leaving only the title
    bar visible.


    The default window behaviors on Ubuntu closely mimic the Microsoft Windows behaviors,
    which facilitates adoption of Ubuntu and switching between computers with different
    operating systems.


    There is also a key combination in conjunction with the mouse to move a window.
    You can select the metakey to use to activate this function. The default is the
    Alt key. When you press the Alt key and click anywhere in a window, you can then
    drag it to a different location on the screen.


    One traditional difference of window managers on UNIX/Linux systems was that the
    active window on X Window systems would normally be the window that the pointer


    # Adjust Window Manager Behavior


    +   1 Click System -> Preferences -> Windows.

    2 The Window Preferences application appears.

    3 Choose here for what behavior you want for a double-click of the title bar.

    4 Double-click the title bar again.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_113_0.png)


    The new action is performed. In this example, the window is rolled out.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_113_1.png)'
