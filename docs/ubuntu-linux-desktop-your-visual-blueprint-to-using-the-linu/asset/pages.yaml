    \ you are moving. You can enable the guides by clicking View $\rightarrow$ Guides\
    \ $\rightarrow$ Display Guides. Note that guides are also referred to in the OpenOffice\
    \ system as snap lines.\n\nMaking the grid and the guides views some of the uncertainty\
    \ of placing items on the screen. If you want to have more help, select the option\
    \ to “snap” to the grid or the guides. Turning on the snap option will automatically\
    \ place items exactly on the points or the guides.\n\nYou can configure your grid\
    \ appearance and spacing. To configure your grid, click Tools $\rightarrow$ Options\
    \ $\rightarrow$ OpenOffice.org Appearance.\n\nchapter 12: Creating illustrations\
    \ with OpenOffice.org Draw"
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Create New Shapes


    raw enables you to create new shapes either or manually. The Drawing toolbar,
    at the bottom of the screen, includes a variety of options for automatically creating
    shapes, including the Basic Shapes tool.


    Next on the Drawing toolbar comes the most important group of shape tools: the
    Basic Shapes tool, the Symbol Shapes tool, the Block Arrows tool, the Flowcharts
    tool, the Callouts tool, and the Stars. All of these options provide for the automatic
    creation of basic shapes. You use all in the same fashion: Click the button to
    open the toolbar, click the shape, and drag your mouse cursor to create the shape.


    The options you see on the Drawing toolbar are designed to provide you with a
    number of choices for the easy creation of new shapes. From, there are two line-related
    tools: the Line tool and the Line with Arrow tool. Next on the toolbar are two
    shape tools: the Rectangle and Ellipse tools. After the tool you use the toolbar
    creates curved lines and shapes based on multiple points you define. After the
    Connector tool provides greater functionality than the Line with Arrow tool.


    If you want to create shapes freely, the Curves tool is your most important tool.
    Select one of the polygon tools on the Curves toolbar, and you can describe a
    shape with points, which are connected with lines and filled. Once created, shapes
    can be resized by grabbing the object''s handles and dragging.


    Colors for all shapes can be controlled from the color tool on the toolbar above
    the document window.


    # Create New Shapes


    # DRAW A SHAPE


    +   1 Click the button for the type of shape you want to draw.


    In this example, the Block Arrows toolbar is opened.


    +   2 Click the shape that you want, such as the 4-Way Arrow shown here.


    +   3 Click in the document and drag the mouse pointer to form the shape.


    The shape appears in the document.


    # ADD COLOR TO A SHAPE


    +   4 Click here and select the color option that you want, such as Gradient.


    +   5 Click here and select a color.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_279_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_279_1.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The figure''s fill is changed.


    # DRAW A POLYGON


    +   - Click the Curves button.


    The Curves toolbar opens.


    +   - Click the polygon button that you want.


    Note: The polygon choices are Polygon, Filled; Polygon 45°, Filled; Polygon; and
    Polygon 45°.


    +   - Click in the document.


    +   - Draw the figure.


    Note: This example shows the Polygon 45°, Filled shape.


    +   - The Edit Points toolbar becomes visible, which you can use to move, insert,
    or delete points on the edges of the polygon.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_280_0.png)


    # Apply It


    You can use the right-click menu to add some visually interesting formatting for
    your shapes. First, right-click the shape to view this menu. Click Line and the
    Line dialog box opens. This dialog box not only controls the formatting of lines
    but also the borders of polygons and circles. Select a style and a color and set
    the width; then click OK to see the results on your object.


    Click the Area option on the right-click menu. In the Area dialog, you can set
    the fill for your object, and from the additional tabs, you can configure it as
    you want. Select the Shadow tab and click Shadow. Next, click the Transparency
    tab and click Transparency. Set the Transparency for 80% and then click OK. Your
    object now has a new fill color, a drop shadow, and is partially transparent.


    Finally, click the Position and Size option on the right-click menu. Change the
    width of the object and then click the Rotation tab. For the Rotation Angle option,
    set 45 degrees and then click OK. Your object is now wider and has rotated to
    the right by 45 degrees.'
