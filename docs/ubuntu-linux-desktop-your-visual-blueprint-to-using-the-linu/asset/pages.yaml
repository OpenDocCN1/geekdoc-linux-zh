    prints.


    # Extra


    With the Page Preview command, you can preview spreadsheets before you print,
    thereby allowing you to check the formatting and page layout as they will appear
    in the printed document. To use this handy feature, click the Page Preview button
    or click File -> Page Preview.


    After you select Page Preview, the main content window will change to show the
    pages of your spreadsheet in full-page view. Use the icons above the Preview pane
    to navigate through your spreadsheet. You can view more than one sheet at a time,
    or you can zoom in or out to get a better view of your spreadsheet.


    Click the Format button to add additional attributes. The button opens the Page
    Style dialog box, in which you can set print attributes, including borders, the
    background, and the header and footer. The Sheet tab of the Page Style dialog
    box lets you control print order and allows you to exclude elements from the printed
    document.


    If you are happy with what you see and are ready to print the document, click
    the Print Page View button to open the Print dialog box.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_260_0.png)'
