  md: '# Ubuntu Linux Desktop


    Welcome to the only guidebook series that takes a visual approach to professional-level
    computer topics. Open the book and you will discover step-by-step screen shots
    that demonstrate over 130 Ubuntu tasks and techniques, including:


    +   * Burning Ubuntu to a CD

    * Adding or removing applications

    * Creating, renaming, and managing folders

    * Configuring removable drives and media

    * Finding files with the Tracker search tool


    +   * Setting up an Evolution-email account

    * Creating and editing documents with Writer

    * Developing spreadsheets and presentations

    * Playing CDs and videos and recording sound

    * Using the command line


    ![](img/b68319171116e7cb6d71d28d5b12e08c_323_0.png)


    # Add Software with the Synaptic Package Manager


    Right-click on a package to install, double click the package in the bottom right.
    To remove a package, click the minus icon next to its name. To upgrade a package,
    click the up arrow next to its name. The applications listed in the left pane
    are those installed on your system. Use the search box at the top to find a package.
    If you can''t find what you''re looking for, try searching for keywords. You can
    also choose to install any application if it is available in the repositories.
    To install additional software without removing existing packages, go to ''Edit''
    and select ''Configure Software''. Alternatively, you can find software in the
    Software Center.


    Your Ubuntu installation is up to date. No software updates available. Check again
    later to see for new updates.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_323_1.png)


    The Synaptic Package Manager allows you to manage software.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_323_2.png)


    The left pane shows the list of installed packages.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_323_3.png)


    At the bottom of the left pane of the Synaptic Package Manager is the search box.
    By default, the filter is applied as you type. The system finds all packages matching
    your search. Click the filter button to clear the search.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_323_4.png)


    +   * High-resolution screen shots demonstrate each task

    * Succinct explanations walk you through every step

    * Two-page lessons break big topics into bite-sized modules

    * "Apply It" and "Extra" sidebars highlight useful tips


