- pgno: 173
  md: '# # Find a File with the Tracker Search Tool


    Tracker makes it easy to find things in your Ubuntu desktop installation. Tracker
    indexes all your data, and you can search for items using free text, like you
    would on a search engine like Google.


    The Tracker Search window presents you with a basic Search box in which you can
    enter your query. The query results are drawn from your entire computer.


    Tracker needs to be enabled before you use it for the first time. To turn on indexing,
    use the Search and Indexing feature under the Preferences submenu of the System
    menu. Select Enable Indexing and click OK.


    After you click OK, Tracker will prompt you to re-index your hard drive. Confirm
    that and when it finishes, you are set up and ready to go. From now on, Tracker


    keep track of any new files added to the system, and will continue to re-index
    old files that it detects have changed.


    When you run a search in Tracker, the results appear on the right, and the pane
    on the left groups the results into categories — for example, applications or
    documents. When you click a search, a bottom pane opens on the plus sign in the
    search result description gives you some brief information about it. Clicking
    a text field where you can enter tags that the system will save and associate
    with the file; this makes it easy for you to label and group things in a fashion
    that is meaningful to you and helps you find these items easily in the future.


    # Find a File with the Tracker Search Tool


    +   1 Click Applications -> Accessories -> Tracker Search Tool.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_173_0.png)


    The Tracker Search Tool application appears.


    +   2 Type a search term.

    3 Click Find.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_173_1.png)'
  merge: -1
  img_proc: true
