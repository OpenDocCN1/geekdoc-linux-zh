- pgno: 85
  md: '# Manage Session Preferences


    if you have special programs that you want to start every time you log into your
    account, you can specify them using the Sessions Preferences application.

    The Sessions Preferences is used to configure applications that start when a new
    session is initiated. A session in this context is the processes spawned from
    your account. When you log in, not only the core GNOME desktop start but also
    any applications you have specified, these are subordinate settings of the core
    applications, whereas others are standalone applications that are relatively unaware
    of whether you are using GNOME or another desktop environment as KDE. still are
    applets that require services from the GNOME desktop environment but are not merely
    parts of the GNOME environment


    The Sessions Preferences application presents the user with three tabs. The first
    tab, Startup Programs, enables you to add or remove the standalone applications
    or applets for your session. The Current Session tab allows you to see and modify
    the applications that are running. This enables you to modify the startup style
    for simple startup. The Restart style makes the process persistent while the session
    is active, thus re-opening the application if it is closed or killed. The Thrash
    style means that the application will not start without the next session. The
    final tab is Settings, which starts with low startup order and usually is used
    for storing settings for GNOME and session-management applications. The last tab,
    Options enables you to record and automatically restart the currently running
    applications on the next session.


    # Manage Session Preferences


    +   Click System -> Preferences -> Sessions.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_85_0.png)


    The Sessions Preferences application appears.


    +   Click the check boxes to applications that you want to start when you begin
    a session.


    Note: You can turn off unused services by unchecking them.


    +   Click Current Session.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_85_1.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# The Current Session tab is displayed.


    If there is a service that you want to run continuously even if killed or closed,
    select it and change its startup style to Restart.


    Click Session Options.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_86_0.png)


    The Session Options tab is displayed.


    +   - Optimally, you can click Automatically Remember Running Applications When
    Logging Out.


    +   - Click Close. If you selected this option, the applications running when
    you log out will be restarted on the next session startup.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_86_1.png)


    # Extra


    An example of the embedded type of session application is the fast User Switcher
    applet, which displays the current user in the panel and enables you to switch
    quickly to another user session. This is a built-in applet; although technically
    a separate executable, it is part of the desktop environment. An example of something
    that is started when a session is created but not part of the desktop is the Tracker
    program, which indexes the files and contents of files on your desktop. This indexing
    service does not need the desktop environment to run. This type of application
    does not need the UI at all. In the middle ground is the Tracker applet, which
    provides an applet for the desktop environment to access the Tracker''s information.


    Applications like the Tracker that run continuously in the background handling
    tasks are usually referred to as daemons. This term was coined by individuals
    on MIT''s project MAC and dates back to the early sixties. They referred the term
    to a theoretical being suggested in a thought experiment by Maxwell on thermodynamics.
    The term daemon is derived from entities in Greek mythology who are used to mediate
    tasks for the gods.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Adjust System Sounds and Hardware


    You can use the Sound Preferences application to adjust the hardware settings
    for your sound card. The first tab is the Devices tab, which enables you to adjust
    which device or API you want to play back or record various types of audio. Typically,
    the Sound Events and the Music and Movies settings for playing back audio will
    be the same. An occasion where they may not be the same is if you decided to use
    MIDI sounds for events and wanted to use a different device to render your MIDI
    sounds. Various cards having several drivers available under Linux. The most popular
    implementation is the Advanced Linux Sound Architecture, commonly referred to
    as ALSA. It allows many of the modern features seen in other operating systems.
    Another popular sound subsystem is


    the Sound System, commonly known as OSS. Also on the Devices tab is the choice
    of which channel of the sound card will be controlled by keyboard volume controls.
    Primary choices for this will be the Master volume or the Pulse Modulation (PCM)
    channel. The second tab of the Sound Preferences application, Sounds, has a list
    of various system events and enables you to associate sound files with each. Also,
    you can completely disable system sounds or software mixing, which the GNOME system
    allows, will also disable system sounds. The final tab is Beep. It allows you
    to have a system beep or not, and also enable a visual signaling instead of an
    audible beep. The choices for signaling are either the flashing title bar or the
    entire screen.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_87_0.png)


    +   1 Click System Sounds and Hardware

    Preferences -> Sound.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_87_1.png)


    The Sound Preferences application appears.


    +   2 Click Test.


    A sound should play out of the speakers.


    +   3 Click the track that you want the default mixer to control.


    +   4 Click Sounds.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_87_2.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_87_3.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# The Sounds tab appears.


    Verify that Enable Software Sound Mixing (ESD) is checked.


    Select a sound for an action.


    +   - You can click Play to hear the sound.


    Click System Beep.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_88_0.png)


    The System Beep tab appears.


    Click Visual System Beep if you would like a visual signaling for a beep.


    Click Close.


    Your settings are applied.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_88_1.png)


    # Extra


    Open Sound System is a much older sound subsystem on Linux and thus historically
    has a much more diverse set of drivers for various and sundry sound cards. There
    are no true standards around sound cards, other than certain compatibilities by
    de facto standards due to the enormous success of sound cards by Creative. Being
    the case, driver support for was always a challenge in Linux. The OSS drivers
    did not allow for more than one program to use the sound card at once, and from
    this lack of capability sprung up the concept of sound servers or daemons. These
    servers would accept requests to generate output and then mix them in software
    to form a single audio output to feed into the sound card. Because no one server
    became truly a de facto standard, application programmers had to link in multiple
    libraries to the code to allow for the various servers or the whole thing and
    just try to write to the sound device directly. This is why ALSA came to be. ALSA
    is an inherent set of drivers and a standard way to handle sound mixing, especially
    hardware mixing, which is available in many sound cards today.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # Enable Remote Desktop Connections


    remote desktop access is a popular feature on modern designs. This feature allows
    a user to connect and control a desktop as if he were sitting in front of it from
    any network location. You can enable this using the Remote Desktop Preferences
    application. This application presents you with the option to allow other users
    to view your desktop over the network. A security check box allows you to grant
    access to control the remote computer. The lower portion of this dialog box allows
    for the very necessary addition of a password that will not be opened for anyone.
    If you plan to allow access to the computer while you are not at it, you should
    clear the check requiring you to ask for confirmation before accepting connections.
    If you do not clear this


    check box, would not be allowed to connect unless someone sitting in front of
    your machine. The second tab of this application allows you to set various security
    features. This second feature is allowing only local connections. You can also
    select an alternative port to run the remote desktop service on, which provides
    some security, albeit very little. Requiring encryption is always a good idea,
    but not enabled by default. You can also cause the screen to lock after a user
    disconnects from the desktop at the physically connected screen and keyboard after
    the remote user has disconnected from over the network. You can adjust the timeout
    when the machine is being accessed remotely when someone is connected, or not
    at all.


    # Enable Remote Desktop Connections


    +   1. Click System → Preferences → Remote Desktop.

    2. Click Allow Other Users to View Your Desktop.

    3. Click Allow Other Users to Control Your Desktop.

    4. Uncheck Ask for Confirmation.

    5. Require the User to Enter this Password.

    6. Type a password.


    The Remote Desktop Preferences dialog box appears.


    +   7. Click the Advanced tab.

    8. Click Require Encryption.

    9. Click Lock Screen on Disconnect.

    10. Click Close.


    The Advanced tab is displayed.

    Your machine can now be accessed remotely.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Set Up Bluetooth Preferences


    Bluetooth devices such as wireless mice and headsets are fairly common, and recent
    months have even been to incorporate Bluetooth adapters on board. Ubuntu supports
    Bluetooth adapters and devices, and using the Bluetooth Preferences application,
    you can adjust the services that you want to be running. There are four services
    available for customization: a service for audio devices such as Bluetooth headsets
    or speakers, an input service for devices like mice and keyboards, a network service
    for networking computers between portable digital assistants, and a serial service
    for data valuation or synchronizing Palm PD. For audio services, you can enlist
    available devices or add new ones.


    On the General tab, you can specify whether to receive or share files from your
    Public folder, which is located in your home directory. The protocol typically
    used for these transfers is Object Exchange, referred to commonly as OBEX. This
    is actually an inbuilt transmission standard, but because Bluetooth has taken
    over some of the types of infrared devices developed in the past, this protocol
    was adopted. A feature that is disabled by default and should remain until you
    have a specific need to enable it is the automatic authorization of incoming requests.
    The General tab also includes the option to automatically classify devices into
    the service categories by referring to a database of known hardware. Finally,
    the General tab has options for the notification in the current state of your
    Bluetooth devices and activity.


    # Set Up Bluetooth Preferences


    +   1. Click System → Preferences → Bluetooth.

    2. The Preferences dialog box appears.

    3. Click a service that you want to be running.

    4. Set its status to Running.

    The service starts.

    5. Click General.

    The General tab appears.

    6. Click Receive Files from Remote Devices.

    7. Click Share Files from Public Folder.

    8. Close.

    The Bluetooth services that you chose will now be running.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_90_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_90_1.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # Set Up Encryption and Keyrings


    The Password and Encryption Settings application controls how encryption will
    work during your session. With this application, you can manage critical elements
    of encryption keys, passphrases, and the caching of how they will be handled.


    The application opens to the Password Keyrings tab, which enables you to manage
    keyrings. Keyrings are a way to keep all your passwords and encryption keys centrally
    managed and secure. There is a default keyring created with your account that
    will be used whenever you save a password within GNOME applications. This keyring
    is locked for your use when you log in your password for Ubuntu. You can add keyrings
    to store information separately, change which keyring for the session will be
    stored and change passwords for keyrings.


    The next tab is the Encryption tab. Here you can set a default encryption key
    to use when encrypting files, folders, or devices for sending signed or encrypted
    email. Also, you can specify to include a copy to yours of any encrypted email
    that you send. This is useful if you encrypt using the public key of the recipient
    of the email, you cannot decrypt. The recipient of the email may decrypt the text
    with their private key. By including, a copy of the email is made for yourself
    and encrypted using your key.


    The PGP Passph tab allow you to select whether to or how to cache passphrases
    in memory. This is useful if you have a lot of encryption going on and do not
    want to keep the passphrase in all the time.


    # Set Up Encryption and Keyrings


    +   1 Click System -> Preferences -> Encryption and Keyrings.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_91_0.png)


    The Password and Encryption Settings application appears.


    +   2 Click Add Keyring.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_91_1.png)


    *'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Add Password Keyring dialog boxes.


    Type the name for the keyring.


    Click Add.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_92_0.png)


    The New Keyring Password dialog boxes.


    Type the password for the new keyring.


    +   - The New Password Strength bar shows the strength of the new password.


    +   - Type in the new password again.


    +   - Click OK.


    +   - Click Encryption.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_92_1.png)


    # Extra


    Like many things involving security, caching passphrases is a tradeoff. The passphrase,
    if kept in memory, is vulnerable to being found by a malicious program. So, keeping
    the passphrase cached as little as possible is the best practice. You can also
    select to show an icon in the status area so that you will know if any passphrases
    are cached in memory.


    Even if extracting the passphrase proves difficult, an attacker could simply have
    a program wait for you to supply your passphrase and, in the background, use the
    fact that the passphrase is cached to compromise your sensitive data.


    Although this sounds paranoid, one of the most dangerous types of malware is the
    keylogger. A keylogger is relatively low-tech. All it does is log your keystrokes
    and report them to the attacker via your Internet connection. When the attacker
    has your login and passwords for a site, like your online banking site, he she
    can take control of your bank account. These types of attacks are very efficient
    in terms of effort involved in creating one, damaging to the victim, and unfortunately
    very common.


    continued'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# # Set Up Encryption and Keyrings (continued)


    The last two tabs of Password and Encryption Settings revolve around the distribution
    of public keys. Although you would never it is quite useful to share your private
    key widely.


    The Key Servers tab enables you to publish your key to centralized servers so
    that people who want to communicate with you can securely find your public key
    easily from one of these servers, encrypt the data and send it to you. Because
    the data is encrypted with your key, only you can decrypt it.


    There is, also, the possibility of someone impersonating you and uploading a fake
    key into your key. This is why keys can be signed. If you have people sign your
    key, they are attesting the key they signed


    in fact belonged to the person whom the key identifies itself to. The more signatures,
    theoretically, the more you can trust it.


    There are a few key servers installed with Ubuntu, but you can add more for different
    publishers for you. By default, your keys are not published to a server; if you
    want to publish them there, you can use the Key Servers tab to do so and query
    the keys of people with whom you want to communicate.


    The final tab is the Key Sharing tab. This is similar to the Internet-based key
    servers but actually implemented with DNS protocols. This is implemented elsewhere
    under the Zero-Configuration Wide-Area Service Discovery, Bonjour, or Rendezvous.


    # Set Up Encryption and Keyrings (continued)


    +   8. The Encryption tab appears.

    9. Click here and select a default key.

    10. Click When Encrypting, Always Include Myself as a Recipient.

    11. Click PGP Passphrases.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_93_0.png)


    +   The PGP Passphrases tab appears.

    12. Click Show Icon in Status Area When Passphrases are in Memory.

    13. Click Key Servers.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_93_1.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The Key Servers tab appears.


    +   Click Automatically Retrieve Keys from Key Servers.


    +   Click Key Sharing.


    The Key Sharing Tab appears.


    +   Click Share My Keys with Others on My Network.


    +   Click Close.


    Your encryption keyrings and passphrases are set up.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_94_0.png)


    # # Extra


    Key signing can be downright dangerous with people that you do not actually know.
    Signing someone''s key, you are attesting that they are the people you purport
    to be. Out of the necessity to be sure whose key you are signing, the key signing
    party was born. A key signing party is a gathering where everyone checks everyone''s
    identification and then agrees to sign each other''s keys. This signing usually
    takes place after the gathering, cryptographically-generated hashes of the public
    keys are exchanged, as they are more convenient for human purpose. Then the real
    public key is locked up by this hash value, to be signed. It may be odd to think
    of it in these terms, these events are somewhat social, where like-minded people,
    concerned about security discuss various aspects of digital security, privacy,
    and sometimes even public policy. Sometimes these are a good way to break the
    ice at users'' groups meetings, due to the encouragement to interact.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Adjust Keyboard Settings


    The absolutely most used input interface is the keyboard. You can adjust the preferences
    of how this critical input device functions by using the Keyboard Preferences.


    There are many different options for the keyboard. The General tab of the Keyboard
    Preferences enables you to adjust the repetition of keystrokes when a key is held
