- pgno: 291
  md: '# # Play a Video


    You can play video and movies on your Ubuntu system using the built-in Movie Player
    application. The player bundled with your Ubuntu installation is the Totem Movie
    Player that is included as part of the GNOME desktop; it can play movie and supports
    both CDs and DVDs.


    When you open the Totem Movie Player, if you are connected to the Internet, the
    application will try to download a list of available content for viewing. The
    default source of the online information is the BBC. The list of available videos
    will appear in the sidebar to the right of the main pane.


    If you want to play a video located on your computer, open it in the Totem Movie
    Player. The movie will play in


    the main pane of the application. You can go forward, or go backward by clicking
    the controls under the main pane. The slider control marked Time enables you to
    move through a video by clicking and dragging the slider. You can adjust the volume
    by clicking the speaker icon under the main pane. You can hide or display the
    right sidebar by clicking the Sidebar button next to the speaker icon.


    If you like to view the video in full-screen mode, you can use the Full Screen
    option on the View menu or press F11 at any time. Note that the View menu also
    contains controls that enable you to manage others, such as the aspect ratio and
    subtitles.


    # Play a Video


    +   1 Click Applications -> Sound & Video -> Movie Player.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_291_0.png)


    The Totem Movie Player opens.


    +   2 Click Movie -> Open.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_291_1.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# The Select Movies or Playlists dialog box opens.


    3 Navigate to the folder containing the video that you want to watch.


    4 Click the video filename.


    5 Click Add.


    +   - The movie begins to play in the window.


    +   - You can click View -> Full Screen to view the movie full-screen.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_292_0.png)


    # Extra


    Although the Movie Player can handle most of the common video file formats, you
    may encounter formats that require the installation of additional software. Different
    digital video file formats require different codecs to decode them. If you try
    to open a file that is not supported by the default Movie Player, your system
    will advise you and prompt you to install additional codecs. The system will search
    locally and also search the Internet to locate the codec.


    After the codec is identified, the Movie Player will open the Install Media Plugins
    dialog box. Click to select the plug-ins from the list, and if the system prompts
    you for permission, click OK. The system may additionally prompt you to supply
    your administrator''s password to install software. Type your password and click
    Authenticate. The Movie Player will handle the installation automatically from
    this point, and upon completion, the video file will begin to play.


    Note that you will only need to go through this process the first time that you
    try to open a new format. The next time you open a file of that type, the codec
    you installed will already be in place.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Burn a CD


    You can use the Brasero Disc Burning application to create audio and data CDs.
    Burning CDs is made easy by Brasero''s easy-to-use interface and autodetection
    capabilities. The Brasero software supports CD, SVCD, and DVD formats.


    Note that burning a CD requires the right hardware. The CD drive installed on
    your computer must be capable of writing CDs. You will need either a CD-R(W) drive
    or a D-RW(W) drive.


    You can approach the burn process in either of two ways. Either you can start
    the Brasero application, select the files, and then burn the CD, or you can create
    a burn folder and make a CD from the contents of the folder. This section demonstrates
    both methods.


    This first looks at the burn process using the Brasero Disc Burning application.
    When you first open the Brasero Disc Burning application, the screen that appears
    prompt you to select the type of project you want to create. You can select from
    the following types: Audio Project, Video Project, Data Project, Disc Copy, and
    Burn Image.


    You identify the files that you want to burn in the New Project and add them to
    your project. After you insert a disc, you can begin your burn.


    The Burn dialog box lets you name the disc and set its properties.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_293_0.png)


    # USING THE BRASERO DISC BURNING APPLICATION


    +   Click Applications ->nSound & Video ->

    Brasero Disc Burning.


    The Brasero start screen opens.


    +   Click the type of the CD that you want to burn.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_293_1.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'The New Project opens.


    +   3 Click the Media Size button and click the size of the folder to burn.


    +   4 Navigate to the folder containing the files that you want to burn to CD.


    +   5 Click the filenames.


    +   6 Click Add.


    The files will appear in the project window.


    +   7 Insert a blank CD into your CD burner.


    +   8 Click Burn.


    The Disc Burning dialog box appears.


    +   9 Type a name for the CD.


    +   10 Click Burn.


    Brasero burns the files to the CD.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_294_0.png)


    # Extra


    Brasero supports the CD, SVCD, and DVD formats. Although most people are familiar
    with CD and DVD, the SVCD format is not particularly well-known. SVCD stands for
    Super Video CD, and it falls somewhere between a normal CD and a DVD in terms
    of quality and capacity.


    The format is widely used in making karaoke CDs and other types of material in
    which you need to embed lyrics, interactive menus, text, or hyperlinks, while
    still maintaining some degree of quality. SVCDs support either two audio channels
    or four mono channels.


    You can fit about 800MB of data in SVCD format. At full quality, you can fit 35
    minutes of video on a CD in SVCD format. If you push this to its limits, you can
    fit about 100 minutes of video on a disc.


    The quality of SVCD varies widely, unfortunately. Players that interpret strictly
    of the agreed standards in playback will cause aliasing to result, thereby marrying
    the playback quality.


    Generally speaking, unless you have a compelling reason to choose this format,
    you are better off to record in another format, preferably DVD.


    continued'
