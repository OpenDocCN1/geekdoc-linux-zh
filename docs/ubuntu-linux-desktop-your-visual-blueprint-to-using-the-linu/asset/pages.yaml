    Click the plus sign next to Tags.


    The Tags field is now available for typing.


    Type any tags that you want, separated by commas.


    The tags will now be associated with the item.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_174_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_174_1.png)


    # Extra


    When indexing has been enabled, upon your next session start you will see the
