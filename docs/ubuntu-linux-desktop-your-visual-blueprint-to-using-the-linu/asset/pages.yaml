    # Extra


    One of the things that makes the Text Editor such useful tool is the fact that
    it supports plug-ins. Go to the Preferences option under the Edit menu. In the
    Gedit Preferences dialog box, select the Plugins tab. The Plugins tab displays
    a list of all plug-ins installed on the system. A check mark next to the name
    of a plug-in tells you that it is enabled. You can select from the list that many
    of the plug-ins are enabled by default; for example, the system uses plug-ins
    to provide the Document Statistics and spell-checker features. Other plug-ins
    provide formatting shortcuts and tools to help with code syntax.


    Take note of the Snippets plug-in; this plug-in is not enabled by default, but
    you may find it to be useful. When Snippets is active, you are able to insert
    into a document short segments of text with just a simple keystroke. The system
    comes preloaded with a number of snippets, ready to use. You can also add your
    own snippets to the collection. All your snippets can be viewed and edited from
    the Manage Snippets option over the Tools menu.'
