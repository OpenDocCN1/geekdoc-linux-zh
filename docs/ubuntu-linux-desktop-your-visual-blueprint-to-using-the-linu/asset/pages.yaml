- pgno: 31
  md: '# Organize Desktop Icons and Panels (continued)


    The default installation presents the user with two panels, one across the top
    of the screen and one across the bottom. These panels are used to launchers, menus,
    and to offer rapid access to software or directories on the machine. A menu provides
    hierarchical access to a set of applications, grouped together by category or
    function. An app is a program with a very tiny user interface (UI), allowing it
    to be embedded within the UI of another application. This allows the hosting panel
    to aggregate functionality that does not have to provide itself.


    applet, the Volume Control applet, the Time and Date applet, and the Quit applet.


    The bottom panel contains the Show Desktop applet, the Window List applet, which
    shows icons and text for each application; the Workspace Switcher applet and the
    Trash applet.


    If you right-click any panel, you are presented with several configuration options.
    One of these options opens the Panel Properties dialog box, which enables you
