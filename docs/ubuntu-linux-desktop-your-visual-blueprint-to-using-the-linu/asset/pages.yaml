- pgno: 195
  md: '# Chat with Friends with Pidgin Internet Messenger (continued)


    After you set up Pidgin Internet Messenger, you can chat with your friends online
    in real time. If your connection is good and stable, the discussion can move very
    quickly.

    You learn more about the individual contacts in your Buddy List by moving your
    mouse over their name. When you mouse over them, a pop-up will appear with details
    about the person.


    If one of your contacts wants to chat with you, you will see a chat window with
    his name or name. You can reply by typing your response to the chat window. Note
    that messages cannot be edited after they have been submitted.


    You can open as many chat windows as you like. Pidgin makes it possible to have
    multiple chat windows open at the same time, so you can have multiple conversations
    going at once.


    When you initiate a chat with a friend, Pidgin opens a chat window and contacts
    your friend. You both post your messages to the chat window. It appears in the
    box at the top of the chat window. As your friend replies, or her comments are
    added as well. As the conversation progresses, you wind up with a record of the
    conversation in your chat window.


    You can use the icons at the bottom of the chat window to insert hyperlinks for
    sharing Web sites and to insert horizontal rules to add breaks to the discussion
    thread. Another option is the Smilies button, which enables you to insert smileys—animated
    characters—into your discussion.


    # Chat with Friends with Pidgin Internet Messenger (continued)


    # CHAT WITH A FRIEND


    +   1. Move your mouse pointer over a contact.

    2. A pop-up shows the contact''s details.

    3. Double-click the contact with whom you want to chat.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_195_0.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The chat window opens.


    Type your message and press Enter.


    Your message appears and is sent to the contact.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_196_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_196_1.png)


    # Extra


    You can set Pidgin to automatically trigger actions on the occurrence of certain
    events. This functionality is called Buddy Pounces, and it is useful for notifying
    you when important contacts come online or go away.


    Buddy Pounces are accessed under the Tools menu. Click Buddy Pounces and then
    click Add in the Buddy Pounces dialog box. The New Buddy Pounce dialog box is
    where you set the action and specify the trigger. Pounces are associated with
    users, so by specifying the Buddy name that you want to be affected. Next, specify
    the trigger by selecting one or more of the options when Buddy Pounce. Then specify
    the action you want to occur in the Action section. You can open a message window,
    pop up a notification, send a message, or even execute a command. In the final
    section are options to make your pounce a recurring event and to indicate whether
    the pounce is dependent on your status. When you are finished, click Save.


    After you have created a pounce, you can edit it by selecting it in the Buddy
    Pounce dialog box and then clicking the Modify button.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Browse the World Wide with Firefox


    You can visit and interact with Web sites and other media sources on the World
    Wide Web by using the Firefox browser. Firefox, one of the world''s most popular
    Web browsers, is included by default in your Ubuntu desktop package. It is easy
    to use and flexible and gives you immediate access to Web sites. When you start
    Firefox, it will open a predetermined home page. The home page of the Firefox
    browser in Ubuntu has been set to a Google search page located on the Ubuntu Web
    site (www.ubuntu.com). If you are connected to the Internet, this Google search
    page will be the first thing you see in the browser.


    To navigate to a Web site, you type its address in the Address bar at the top
    of the Firefox window. You can click the green arrow to go to the Web page. You
    can launch Firefox offline and it will allow you to type in addresses, you must
    be connected to the Internet to view Web sites.


    One of the most useful features of the Firefox browser is the ability to open
    multiple pages and keep them all visible on your screen with tabs. Even though
    it is possible to open separate browser windows, a group of tabs is much easier
    to manage than a group of windows. A shortcut for opening a new tab is pressing
    the Ctrl at the same time you press the 7.


    # Browse the World Wide Web with Firefox


    +   - Click Applications -> Internet -> Firefox Web Browser.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_197_0.png)


    The Firefox browser starts and displays the default home page.


    Note: You need to be connected to the Internet for the page to be displayed properly.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_197_1.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Click File → New Tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_198_0.png)


    +   - A new tab with a blank page opens.


    +   - Type the Web site address that you want to visit and press Enter.


    +   - The site opens on the new tab.


    +   - You can close a tab by clicking here.


    # Extra


    The Google search page that Ubuntu sets as the default home page of your Firefox
    browser is useful, but you want to change the home page to something else. To
    change your home page, click Edit → Preferences. When the Firefox dialog box opens,
    select the Main tab, if it is not already active. In the Startup section, look
    for the Home Page text field; this is where you can specify your choice of home
    page. On the line above the Home Page field, you can specify what happens when
    the browser starts. After you have made your choices, click the Close button.


    To a certain extent, the Google search page is redundant, as your browser has
    a built-in Web search toolbar at the top right of the application. The search
    box is always visible. To use it, just enter your search terms in the box and
    press Enter. The search results will appear in your browser window. Note that
    the search box has a drop-down list that also enables you to select which search
    service you want to use.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Remotely Access Windows, Linux, and Macintosh Systems with the Remote Desktop
    Viewer


    You can view the desktops of other computers and control them through the use
    of Ubuntu''s Remote Desktop Viewer. The Remote Desktop Viewer uses virtual network
    computing (VNC) protocol to control another computer that is running a VNC server.
    This is very useful for troubleshooting a remote machine or for accessing your
    work computer from your home computer. Ubuntu''s Remote Desktop Viewer is both
    a VNC server and a VNC client. To access another computer, you will be using the
    Remote Desktop Viewer as a VNC client. Note that the other computer must be running
    a VNC server and you must be connected to that computer via a network or the Internet.


    When you open the Remote Desktop Viewer, it will automatically detect any VNC
    servers on the same network as your Ubuntu box. If the computer that you want
    to access is not on the network or does not appear, you will need to try to connect
    to it manually. Follow the steps in this section to do so. If there are no difficulties,
    the desktop of the remote computer will appear in the main pane of the Remote
    Desktop Viewer application. You can observe what is happening on that computer
    and you can move your mouse cursor on the remote computer''s screen and control
    it as if it were your own.


    # Remotely Access Windows, Linux, and Macintosh Systems with the Remote Desktop
    Viewer


    +   1. Click Applications -> Internet -> Remote Desktop Viewer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_199_0.png)


    The Remote Desktop Viewer window opens.


    +   2. Click Connect.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_199_1.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The connection dialog box appears.


    Type the hostname or IP address.


    Click Connect.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_200_0.png)


    The connection is made, and the remote machine''s desktop becomes visible.


    +   - You can now use the remote machine as if you were sitting in front of it.


    +   - When you are finished, click Close.


    The connection is terminated.


    # Extra


    ![](img/b68319171116e7cb6d71d28d5b12e08c_200_1.png)


    Making a VNC connection requires the cooperation of a VNC server and a VNC client.
    Most Linuxes have sort of VNC capability, and MacOS has VNC built into its system.
    Windows, however, is not bundled with a VNC application.


    If you want to connect to a Windows machine, you will need to make sure that a
    VNC server is installed. One of the easiest to use is TightVNC. There is also
    a version of TightVNC for Linux and other operating systems. You can download
    all different versions from www.tightvnc.com.


    After you have installed the VNC server on your Windows machine, you will need
    to configure it connections. This is usually a simple process, but you will need
    to follow the instructions of the VNC application that you chose. Make sure that
    the server is running before you try to connect with the Remote Desktop Viewer.


    One important point: Running a VNC server on a Windows machine is potentially
    risky as it opens up your machine to outsiders. Make sure that you password-protect
    the machine and, when possible, limit the VNC access to only the IP address of
    the machine you will use to connect to your Windows box.'
  merge: -1
  img_proc: true
- pgno: 201
