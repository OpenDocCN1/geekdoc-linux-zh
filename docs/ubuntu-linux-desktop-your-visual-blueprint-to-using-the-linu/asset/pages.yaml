- pgno: 58
  md: '# COPY A FILE OR FOLDER


    4 Right-click the file or folder.


    5 Click Copy.


    6 Right-click in the File Browser window showing where you want a copy.


    7 Click Paste.


    The file or folder is copied to the new location.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_58_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_58_1.png)


    # Extra


    When you copy files, it does not matter whether you are copying from one disk
    to another, as a new allocation of space will be made either way. This is not
    the case with moving files. When you move a file or directory, if you are not
    moving from one physical disk to another, the allocation of the disk space remains
    the same, but the entries in the parent directories involved change. Essentially,
    the allocation of the file or folders being moved is transferred to the new directory.
    This holds true until the allocation crosses the boundary to a different disk.
    The allocation cannot simply be transferred because the allocation does not apply
    on the disk. In this case, the files are copied to the new, target disk, and then
    the files on the original disk are deleted. When they are deleted from the original,
    they are not copied to the Trash, so they cannot be retrieved. This makes it very
    important to stop move operations when they are taking place between disks. It
    is unlikely that you will lose files, you can easily end up with a split between
    the directories. This appears as if half the files are on one disk and half on
    the other. While this is not particularly dangerous, it can be tedious to clean
    up.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_58_2.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Access Recent Files


    With all the spreadsheets, text documents, compressed archives, portable document
    files (PDFs), drawings, and images floating around your system, it is not unthinkable
    that you may forget the name of a file that you have recently opened or exactly
    where you opened it. That is when you will want to use the Recent Documents list
    under the Places on Ubuntu. This list shows what files you have recently accessed.
    list, you clear it from all the applications that are derived from that list.
    This would be a boon for the security of this type of information. This feature
    is obviously very useful, but it has a downside as well. Anyone who gains access
    to your computer for a few moments while you are not looking, or even over shoulder
    while you are talking with them, can see the filenames of your most recent work.
    Even if they have physical access to it, there are techniques that, if directed
    to seek out a specific file, can retrieve the file quite easily. So, like many
    features for rapid access to information, there is a cost. The Gnome theme has
    tried to balance the risk by allowing centralized cleaning of this type of information,
    keeping the information around for any length at all mitigating the possibility
    of revealing sensitive information.


    # ACCESS A RECENT USED FILE


    +   - Click Places.


    +   - Click Recent Documents.


    +   - Click the name of the recently used file that you want to open.


    The file opens in its associated program.


    # CHECK THE RECENTLY USED FILES IN AN APPLICATION


    +   - Click File.


    +   - Review the list of recent files in the application.


