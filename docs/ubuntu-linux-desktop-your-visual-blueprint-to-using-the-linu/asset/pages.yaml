- pgno: 155
  md: '# Look Up Words in the Dictionary


    Our Ubuntu desktop includes a built-in Dictionary application that enables you
    to quickly look up definitions, pronunciations, and related terms. The default
    Ubuntu distribution supports English, Spanish, and Thai-to-English dictionaries,
    whereas regional distributions are bundled with additional languages.


    right pane showing a list of similar words. As the definitions are sometimes quite
    lengthy, the application is often easier to use if you enlarge the window bit,
    or if you prefer, maximize it to the full window.


    Search results are saved in a history file that enables you to go back and forth
    using commands in the Go menu. You can also print the definitions or save them
    for future use. The Print and Save commands are both located under the File menu.


    The dictionary source files are located online, so the Dictionary feature is dependent
    on having a working connection to the Internet. With an Internet connection, the
    application will launch, but you will not be able to look up definitions. When
    you have a working connection, you can type the word into the Look Up field. The
    results of a search will appear in the left pane of the Dictionary application''s
    window, with the


    The system also includes a Dictionary app that can be installed on the panel of
    your choosing, as discussed in Chapter 2. The app is quite convenient, as it gives
    instant access to a text field where you can enter a term and search for a definition
    without opening the application.


    # Look Up Words in the Dictionary


    # LOOK UP A WORD


    +   Click Applications -> Office -> Dictionary.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_155_0.png)


    The Dictionary application appears.


    +   Type the word that you want to search for and press Enter.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_155_1.png)


    142'
