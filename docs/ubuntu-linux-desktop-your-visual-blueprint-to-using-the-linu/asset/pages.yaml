    # Extra


    Although the predominant keyboard layout is the familiar QWERTY keyboard, there
    are others, and not just for internationalization. The very first typewriters,
    the keys would stick and jam if they did not have enough of a time interval between
    strikes against the ribbon, allowing the first hammer to move out of the way for
    the next hammer. Consequently, the keys were rearranged to create less likelihood
    that two hammers would be in the stroke at the same time. This evolved into the
    QWERTY keyboard we have today. Other competing layouts, predominantly the Dvorak
    layout, were based on the frequencies of certain letters within the English language.
    By placing the most popular letters on the middle row, also known as the home
    row, typing efficiency could be greatly enhanced. Although the Dvorak layout was
    more efficient, by the time the mechanical design issues were cleared up, the
    QWERTY keyboard had been cemented as the de facto standard, and the Dvorak layout
    remains more of obscurity.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# # Set the Preferred Applications


    The Preferred Applications settings specify the default applications used for
    various types of activity. The first tab of the Preferred Applications dialog
    box, Internet, enables you to choose which browser you use for Internet surfing.
    On Ubuntu, the default is Firefox, which is the predominant open-source browser.
    Additionally, this allows you to set your email client, which by default in Ubuntu
    allows you to set Thunderbird as the application to handle these types. The Multimedia
    tabs allow you to pick the default application for the playing of music or video
    files. The default is the Rhythmbox music player, but as an alternative the Totem
    Movie Player is also available.


    The System tab allows you to pick the terminal emulator that will be launched
    by the desktop environment whenever you see the checkbox Run in Terminal or if
    you launch the terminal accessory. This is a text window that allows command-line
    access to the operating system. The Execute Flag setting on this tab allows you
    to specify the command-line option for passing a command to a terminal. It varies.
    The Accessibility tab allows you to pick the subsystems for accessibility and
    whether to start them up at the beginning of a session or not. The default accessibility
    subsystem is the Orc reader. Alternatively, you can specify the magnifier options
    without the reader options. The Motion accessibility allows you to select options
    for alternative input, such as onscreen keyboard.


    # Set the Preferred Applications


    +   1. Click System → Preferences → Preferred Applications.


    The Preferred Applications dialog box appears.


    +   2. Click here and select a Web browser.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_97_0.png)


    ```

    Firefox

    Open link with web browser default

    Open link in new window

    Open link in new tab

    ```


    +   3. Click here and select a mail reader.


    +   • You can click Open Link in New Tab to have clicked links open a new tab
    in the browser.


    ```

    Mail Reader

    Evolution Mail Reader

    ```


    +   4. Click Multimedia.


    The Multimedia tab appears.


    +   5. Click here and select a media player.


    +   6. Click System.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_97_1.png)


    ```

    Multimedia Player

    Totem Movie Player

    ```'
