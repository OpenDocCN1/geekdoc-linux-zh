- pgno: 281
  md: '# # Change Glue Points on a Shape


    You can create or modify connectors on an object by changing the object''s glue
    points. Placing glue points is the way to control where connectors appear on shapes.


    Connectors are lines that are used to visually tie one object to another. For
    example, if you want to join objects — as part of a flowchart — you will probably
    use connectors. Glue joins spots on the object''s shape known as glue points.
    The combination of glue points and connectors is very useful as the connections
    will remain, even if you move or reshape the object.


    By default, Draw objects include four glue points: positioned on the object''s
    top, bottom, left, and right sides.


    There is a dedicated Gluepoints toolbar that allows you to or modify an object''s
    glue points. To use the toolbar, follow the steps below. Alternatively, you can
    make the toolbar active by clicking View -> Toolbars -> Gluepoints.

    Gpoints toolbar contains tools for creating and editing your glue points. You
    can add a new glue point in the steps below. You can add as many glue points as
    you want to an, and although the default glue points are on the object''s edge,
    you can place new glue points wherever you want to, including inside the object.


    # ### Change Glue Points on a Shape


    +   - Click the shape to select it.

    - Click the Connectors button.


    +   - The object''s glue points become visible.


    +   - Click the Gluepoints button.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_281_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_281_1.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The Gluepoints toolbar appears.


    +   Click the New Gluepoint button.


    +   Click the shape where you want to place the glue point.


    A new glue point is now available on the shape.


    # Extra


    The Gluepoints toolbar has several additional options with which you should be
    familiar. Immediately to the right of the New Gluepoint button are four buttons
    with related functions. Use these buttons to force connections to your object
    to attach only to the designated points. For example, if you want all connections
    to your object to be from the bottom of the object, select the Exit Direction
    Bottom button.


    The remaining seven buttons are related to each other. First of the seven, Gluepoint
    Relative makes the placement of your glue points relative to the shape of the
    object. In other words, if you select this button and resize the object, the position
    of the glue points will move relative to the shape of the object.


    Deactivating the Gluepoint Relative makes the other six buttons on the Gluepoints
    toolbar active. The remaining six buttons allow you to fix points inside the shape.
    By using these options, the glue points do not move, even when the size or shape
    of the object changes.


    For most situations, you will want the Gluepoints Relative button selected, as
    it reduces complications when you are editing objects.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_282_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_282_1.png)'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Align Shapes


    The alignment of objects is one of the keys to creating clear and logical charts
    and illustrations. For flowcharts in particular, the steps in sequence need to
    be logically connected to each other, and the visual ordering of those elements
    is important to maintaining the structure in a meaningful manner. The alignment
    tools in Draw allow you to modify alignments easily and with certainty.


    Alternatively, you can select a group of objects and right-click the group. From
    the right-click menu, choose the Alignment option and select the appropriate action.

    You can also use the Align option that exists on the Modify menu. Again, you should
    select the items first and then choose the align option that you want to employ.

    The Alignment options include aligning objects to the left, right, top, or bottom;
    for each of these choices, the alignment is based on the edge of the item that
    is located at the extreme position in that direction. You can also use align to
    center items by line, either vertically or horizontally.

    Note that if you modify the spacing and alignment of individual items, you must
    select and align these items manually. The Alignment tools are for aligning multiple
    objects relative to each other.


    In different ways. On the far-right side of the Drawing toolbar is the Alignment
    button, which opens the Alignment toolbar. You can control the alignment of items
    as a group using this tool. The key to using this tool successfully is to select
    all the shapes that you want to align and modify them as a group.


    # Align Shapes


    # ALIGN OBJECTS VERTICALLY


    +   Click and drag the cursor to select the shapes that you want to align.


    +   Click the Alignment button

    The Alignment toolbar appears.


    +   Click one of the top three buttons:

    Click to left-align vertically, to center, or to right-align.


    In this example, the shapes are center-aligned, vertically.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_283_0.png)'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# OBJECTS HORIZONTALLY


    1 Click and drag to select the shapes that you want to align.


    2 Click the Alignment button.


    The Alignment toolbar appears.


    3 Click one of the bottom three buttons:


    Click to top-align horizontally, to center, or to bottom-align.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_284_0.png)


    +   - In this example, the shapes are center-aligned, horizontally.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_284_1.png)


    # Extra


    Just as you can change the alignment of shapes relative to each other, you can
    change the ordering of the shapes relative to each other. When we speak of ordering
    in Draw, we are talking about front-to-back ordering, that is, which objects appears
    in front of, and potentially obscure, other objects.


    To set the ordering of an object, right-click the object and select the Arrange
    option. The Arrange submenu offers a number of choices, all related to moving
    the object forward or backward in the order of objects on the screen.


    Select Bring Front to move your object in front of all the objects on the screen.
    Select Send Back to move the object to the back of the order. If you want to move
    the object one step back, select either Bring Forward or Send Backwards. You may
    need to repeat this step if there are multiple objects on the page. Each time
    you select the choice, it moves the object forward or backward one more step.


    if you want to move multiple objects simultaneously, select the objects and then
    choose the Arrange option to move them as a group.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "# Insert Images\n\nYou can add pictures and other graphics files to your Draw\
    \ documents. The images can be combined with the vector drawings that you create\
    \ in Draw and can, to a limited extent, be manipulated from within.\n\nTo insert\
    \ an image, you start with the Picture submenu on the Insert menu. The Picture\
    \ submenu gives you the choice to use an existing image that is located on your\
    \ hard drive or to scan in a new image. If you choose to insert an image, the\
    \ Insert Picture dialog opens, in which you can choose the image on your computer.\n\
    \nAlternatively, you can click the From button on the bottom toolbar. It works\
    \ in the same fashion, except that it immediately opens the Insert Picture dialog\
    \ box.\n\nNote that when the image appears in your document, there will be eight\
    \ green-colored handles on it. The handles enable you to resize the image by clicking\
    \ and dragging them. When you move your cursor over a handle, it will change shape\
    \ to indicate that the handle is active.\n\nTo move the image, click it and drag\
    \ it to the new location on the screen.\n\nRight-clicking an image presents alternative\
    \ ways to modify the image. The Position and Size option opens a dialog box that\
    \ allows you to set the position of image on the page by X and Y coordinates.\
    \ You can set the image's width and height. A separate tab enables you to rotate\
    \ it.\n\n# Insert Images\n\n# INSERT AN IMAGE\n\n+   1 Click Insert $\rightarrow$\
    \ Picture $\rightarrow$ From File.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_285_0.png)\n\
    \nThe Insert Picture dialog box opens.\n\n+   2 Navigate to the folder containing\
    \ the image that you want to insert.\n\n+   3 Click the image filename.\n\n+ \
    \  4 Click Open.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_285_1.png)"
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The image appears in your document.


    # RESIZE THE IMAGE


    +   5 Click the handles and drag out to increase the image size.


    +   - The image is resized.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_286_0.png)


    # Extra


    Not only can you insert images into Draw, but you can also export images created
    in Draw to a variety of other formats. Documents saved in the native OpenOffice
    format are usable only by other OpenOffice users. You can, however, export your
    documents to different formats.


    Under the File menu there are two options: Export and Export as PDF. The Export
    option opens a dialog box that offers you 12 different export formats, including
    the most popular ones: HTML, TIFF, GIF, JPG, PNG, EPS, and BMP.


    You can also export to PDF from this menu, which will probably want to use the
    Export as PDF option instead. Selecting Export as PDF opens the PDF Options dialog
    box, which includes a number of configuration choices for customizing the output.
    If you are looking to export your document for a printer, you most likely want
    export your document in PDF format, using the choices in the PDF Options dialog
    box to achieve the highest quality output.


    Regardless of which format you select, if you need the document to remain editable,
    it must remain in OpenOffice format. None of the formats allow you to edit the
    various individual objects or text fields in your file.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_286_1.png)


    Chapter 12: Creating Illustrations with Openoffice.org Draw'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# # Create 3D Shapes


    In addition to flat, two-dimensional shapes, Draw makes it possible to create
    three-dimensional shapes. With Draw, you can control the shape''s textures, colors,
    and illumination to achieve a variety of realistic and striking effects.


    3D shapes can be created in three different manners. Draw includes a set of 3D
    objects that can be selected from the toolbar and added to a document. There are
    eight default shapes, including the most commonly used 3D shapes, such as cubes,
    cones, cylinders, and pyramids. You can see what default 3D objects are by clicking
    View → Toolbars → 3D Objects.


    There are two options for converting two-dimensional shapes that you have already
    created into 3D shapes. You can find these on the Convert submenu on the right-click


    menu. Two of its choices are To 3D and To 3D Rotation Object. The 3D option to
    convert a shape to three-dimensional is the simplest; it gives you flat The 3D
    Rotation option takes your shape and renders it in a round format. This is most
    useful for creating unique 3D shapes, rather than simply adding depth to a two-dimensional
    shape.


    You can set 3D effects for your shape by using the 3D Effects dialog box, which
    has options for controlling the appearance and rotation. The 3D Effects dialog
    box includes multiple tables for controlling the texture of the shape, the angle
    of the illumination source, and the depth and shape of the perspective. Using
    the Effects tool you also select the Rotation option, which allows you to rotate
    your 3D shape over multiple axes.


    # Create 3D Shapes


    +   - Right-click the shape that you want to make 3D.

    - Click Convert → To 3D.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_287_0.png)


    The 3D styling is applied to the object.


    +   - Right-click the shape again.

    - Click 3D Effects


    ![](img/b68319171116e7cb6d71d28d5b12e08c_287_1.png)'
  merge: -1
  img_proc: true
- pgno: 288
  md: '3D Effects dialog box appears.


    5 Click here and set a percentage for Rounded Edges, such as 20%.


    6 Click here and set a percentage for Scaled Depth, such as 75%.


    7 Click the Assign button.


    +   - Your 3D effects are applied to the shape.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_288_0.png)


    # Extra


    If you have multiple 3D objects in your document, you can control them all via
    what Draw refers to a 3D scene. A 3D scene is simply a collection of 3D objects
    that share similar 3D attributes. This is a way for grouping 3D shapes and editing
    them as a whole. This is particularly useful when you want to work with a common
    and consistent lighting source to add realism to a set of objects. You can also
    use this option when you want to combine objects to create one new object.


    Also, you can convert two-dimensional objects to 3D simultaneously — without grouping
    objects. When you use this approach to create 3D objects, Draw applies depths
    to each object and keeps the objects according to the arrangement order you assigned
    to the objects. Note that this approach to the conversion of two-dimensional objects
    gives a different result than you will get by grouping them and then converting
    the group. When you group objects and then convert, Draw treats the group as a
    single object.


    Chapter 12: Creating illustrations with Openoffice.org Draw'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# # Play a Music CD


    You can use your computer to listen to audio CDs with the Rhythmbox Music Player
    application. In addition to the Rhythmbox software, you will need a CD driver,
    a sound card, and either a pair of speakers or headphones.


    When you insert an audio CD into your CD tray, your shuffle will prompt for you.
    The default action for an audio CD is Open Rhythmbox Music Player.


    After you open the Rhythmbox Music Player, to see all the files on your CD, just
    click the name of the CD in the column on the left side of the window. The song
    titles will appear in the main pane of the application. You can choose any song
    on the list, or you can play the whole CD.


    As songs play, you will see the status in the main pane. You can drag the slider
    on the timeline to a specific point in the song if you want to. You can control
    the volume by clicking the speaker icon at the top right and by moving the slider
    up and down to raise or lower the volume.


    Other buttons on the main toolbar let you repeat songs or shuffle the order of
    the songs on your CD. Clicking the Visualization button will fill the screen with
    an abstract decorative display that reacts to the audio file being played. The
    E button will cause the song to stop playing and the CD drive to open. The Extract
    button is for ripping songs, a topic that is discussed later in this chapter "Rip
    a CD."


    # Play a Music CD


    +   1 Insert the audio CD that you want to play into your CD drive.


    The Audio Disc dialog box appears.


    > *Note:* By default, this dialog box will have Rhythmbox Music Player selected
    as the application to open the CD.


    +   2 Click OK.


    The Rhythmbox Music Player opens.


    +   3 Click the name of the CD.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_289_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_289_1.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_289_2.png)'
  merge: -1
  img_proc: true
