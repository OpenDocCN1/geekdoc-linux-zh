- pgno: 133
  md: '# Manage Startup Services


    With Ubuntu, it is easy to control the software services that are launched when
    you turn on your computer. The Services utility makes it possible for you to configure
    the system and suit your particular needs.


    To control startup services, you need to use the Services utility. However, when
    you first open the Services Settings window, it will be locked. In order to add
    or remove your services, you must first unlock the window. To do so, you must
    enter your system administrator''s password in the Authenticate dialog box.


    After your identity has been authenticated, the Services Settings dialog box will
    be unlocked and ready for you to


    to turn a service on or off, click in the box next to the name. The changes will
    take effect the next time you start your Ubuntu system.

    Note that if there are services you do not use, it is a good idea to disable them
    that run at startup. Reducing the number of services that run at startup will
    decrease the amount of time that it takes the system to boot up, and it will also
    save resources. however, if there are services that you do not recognize, do not
    disable them until you have done a bit of research, as those services may perform
    useful, though unobvious, purposes.


    # Manage Startup Services


    +   1 Click System -> Administration Services.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_133_0.png)


    The Services Settings window opens.


    +   2 Click Unlock


    ![](img/b68319171116e7cb6d71d28d5b12e08c_133_1.png)'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Chapter 5: Administering the System


    Type your password.


    Click Authenticate.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_134_0.png)


    The Services Settings controls are unlocked.


    Click to make changes the items on the list.


    Click Close.


    The services that you added will launch the next time that you start an Ubuntu
    session. Any services that you disabled will not be launched at startup.


    # Apply It


    There is an alternative application that can be used to manage your startup services.
    The application, known as BUM (BootUp Manager), can be installed via the Synaptic
    Package Manager. BUM is designed to perform the task as the Services utility,
    but it offers more control and more information.


    Install BUM using the steps described in the section "Add Software with the Synaptic
    Package Manager" later in this chapter. You will need to be connected to the Internet
    to download this package. Click BootUp Manager to launch BUM. The first time you
    start the application, it will take some time, as it scans the system and logs
    all the processes.


    Once it is open, you can browse the services in the Summary tab and select or
    deselect those that you want. Click the Advanced check box, and the display splits
    into three tabs that provide a great deal of information about each service as
    well as a rundown of the startup and shutdown scripts.


    Although the Services application is fine for basic configuration, if you want
    to finely-tune your system, try BUM.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Configure Software Sources


    The Software Sources utility enables you to control the type of software you will
    install and from where. The utility adds important security to your installation
    and ensures that the software you download is legitimate and secure.


    As discussed later in this chapter in the section "Run the Update Manager," Ubuntu
    will automatically check for even download system patches and updates. The Software
    Sources application gives you control over both important aspects of the Synaptic
    Package Manager and the Ubuntu Software utility.


    The Software Sources window shows five tabs: Ubuntu Software, Third-Party Software,
    Updates, Authentication, and Statistics.


    The Ubuntu Software tab is key as it allows you to select what aspects of the
    Ubuntu system can be downloaded from the Internet. The Download From drop-down
    list lets you select the location that has the download. Note that the system
    will automatically select what it thinks is the closest server, but you can change
    this option by using the drop-down list.


    The Updates tab is also important as it enables you to select the type of files
    to be downloaded. By default, the system is set to download only important security
    updates and recommended updates. The default Updates section enables configuration
    of the updates'' functionality. Use the drop-down list to specify how the system
    checks for updates and the check boxes to specify the action that will be.


    # Configure Software Sources


    +   1. Click System -> Administration -> Software Sources.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_135_0.png)


    The system prompts you for your administrative password.


    +   2. Type your password.


    +   3. Click OK.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_135_1.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Software Sources window opens to the Ubuntu Software tab.


    Click to select what you want the system to be able to download from the Internet.


    Click Updates.


    The Updates tab comes to the front.


    Click here and select how often you want your system to check for updates.


    Click Close.


    Your system will download software according to your settings.


    # Extra


    The other tabs in the Software Sources window are worth mentioning. The Third-Party
    Software tab enables you to select or add trusted sources for third-party software
    downloads. By default, two are present, and none are selected. Both of the default
    sources are archives from Canonical and are considered to be trustworthy. You
    can add additional sources if you need to.


    The Authentication tab provides keys for verifying the correct source of the software.
    Do not delete the default keys. If you have additional keys, you can add them
    here.


    The Statistics tab is optional and intended to help the Ubuntu community gather
    information about what the users have found worthwhile and have installed.


    Finally, there will come a day when the next version of Ubuntu is released and
    you will want to upgrade manually by using a copy of the new system on a CD or
    a USB stick. However, there is a much easier way. On the Updates tab, go to the
    Release Upgrade section and select Normal Releases from the Show New Distribution
    Releases drop-down list. The system will notify you when a new release is out,
    and you can install it automatically.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_136_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_136_1.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# # Add Software with the Synaptic Package Manager


    The Synaptic Package Manager helps you find, install, and manage the wide variety
    of additional components that can be added to your Ubuntu system.


    Your Ubuntu desktop is the tip of the iceberg; there are many, many free and proprietary
    software packages you can install extend Ubuntu. These packages can be found and
    installed via the Synaptic Package Manager.


    The first time you run the Synaptic Package Manager, it will also show you an
    introductory screen with basic instructions. When the Synaptic Package Manager
    window opens, you will see three panes: the top-left pane has a tree of categories
    to help organize the packages. The top-right pane shows the contents of each category.


    you click the name of a package in pane, details about the package appear in the
    bottom-right pane.

    to find a package, click the category that is in the left and then click the application
    name on the top right. When the application details appear in the bottom right,
    you should special note whether you must install additional packages to use it
    properly. You can choose to install any application, or if there is a package
    is already installed that you do not want, you can uninstall it. The right menu
    also has a list for downloading additional required packages, if any.


    Note that the Synaptic Package Manager is associated with the Software Sources
    utility, discussed in the preceding section, "Configure Software Sources." Synaptic
    will only show packages that are available through the sources you have selected
    in Software Sources utility.


    # Add Software with the Synaptic Package Manager


