- pgno: 74
  md: '# Adjust the Screen Resolution


    Adjusting your screen resolution is likely to be one of the first things you will
    want to do on a new system. Resolution refers to the number of pixels, or displayable,
    on your screen. This measurement is usually given by the number of pixels in the
    x-axis versus the number of pixels in the y-axis. As resolution increases, the
    processing power needed to move all the pixels around increases. For this reason,
    with a slower graphics card, you can expect better performance by lowering the
    number of pixels.

    The refresh rate refers to how fast pixels on the screen are redrawn. This is
    usually very tightly coupled with the capabilities of not only the video card
    but also the monitor you are using. For example, a typical cathode ray tube (CRT)
    monitor


    has available refresh rates from about 56Hz to 85Hz. This is significant because
    the fluorescent lights in an office flicker at 60Hz and cause eye strain. If you
    adjust the refresh rate higher than that of the lights, the flicker is reduced
    and resulting the eye strain as well. With liquid crystal (LCD) screens, the refresh
    rate is usually set to 60Hz, but the technology behind LCD screens does not generate
    the strobing effect because the crystals making up the pixel locations do not
    completely their illumination with each refresh cycle.

    You can easily adjust the resolution after the system is up and running using
    the Screen Resolution application. This application displays the current resolution
    and refresh rate that the display is running. It also allows you to change those
    settings to anything allowed by the detection process.


    +   1. Click System -> Preferences -> Screen Resolution.


    ```

    Adjust the Screen Resolution

    ```


    ![](img/b68319171116e7cb6d71d28d5b12e08c_74_0.png)


    The Monitor Resolution Settings dialog box appears.


    +   2. Click here and select the resolution that you want.

    3. Click here and select the refresh rate that you want.

    4. Click Close.

    Your resolution settings are applied.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_74_1.png)'
  merge: -1
  img_proc: true
