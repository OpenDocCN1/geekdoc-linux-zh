  md: '# Set the Default Printer


    You can set your default printer from a list of available printers using the Default
    Printer UNIX-like application. Historically one of the weaker areas of Linux systems
    have had all the capability of any other OS. The addition of PostScript support
    within the drivers of Linux printing subsystems allowed the OS to tap into the
    capabilities of most modern printers. For a period in the mid-to-late 90s, there
    was a movement to drive the control logic of the lowest-end printers into the
    driver software, and this did present a problem for Linux printing, as the driver
    supplied by many manufacturers did not run on Linux-based operating systems. This
    difficulty has been largely alleviated due to much diligence by the open-source
    community to reverse-engineer the protocols, and to build relationships to foster
    cooperation with the hardware manufacturers. Today, drivers exist for most of
    the printers. Modern Linux printing subsystems carry drivers of various types
    from the common desktop bubble to the most sophisticated of contemporary operations.
    As always, it is a good idea to check if your printer is supported by the drivers.
    You can do so at www.linuxprinting.org/printer_list.cgi which contains a database
    of printers and their compatibility with Linux.


    The Default Printer application is simpler in design and function. It displays
    a list of the configured printers available on the system and allows you to choose
    which one you want to use. Alternatively, you can have it set your default printer
    preference to the same as your system''s default.


    +   1 Click System -> Preferences -> Default Printer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_73_0.png)


    The Default Printer dialog appears.


    +   2 Select the printer that you want from the list.


    +   3 Click Set Default. Now when you print from any application, this printer
    will be used.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_73_1.png)


