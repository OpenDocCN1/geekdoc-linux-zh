- pgno: 13
  md: '# HOW TO USE THIS BOOK


    Ubuntu Linux Desktop: Your visual blueprint to using the Linux operating system
    uses clear, descriptive examples of how to set up and get started with the Ubuntu
    Linux desktop. By Ubuntu Linux, you can use this book as a quick reference for
    many tasks, using the system utilities and the bundled office and home store.
    The clear steps in each chapter cover all of the most common tasks that you will
    encounter using the Ubuntu Linux desktop. The OpenOffice suite is also covered
    in some detail, allowing you to increase your work productivity and efficiency.


    Chapter 3, “Managing Files and Folders,” covers the Ubuntu file system and explains
    how to use it to locate, organize, and manage your files and folders.


    Chapter 4, “Setting Preferences,” helps you to tailor the Ubuntu desktop system
    to your particular needs and works habits.


    Chapter 5, “Administering the System,” provides you with all the information you
    need to manage and administer the Ubuntu system, including how to manage network
    services and install additional software and hardware.


    Chapter 6, “Using the Included Accessories,” covers how to use the numerous accessories
    that come bundled with the Ubuntu system.


    # Who Needs This Book


    This book is for the experienced computer user who wants to find out more about
    the Ubuntu Linux desktop system. It is also for mere Linux users who want to expand
    their knowledge of the different features that the Ubuntu desktop has to offer.


    Chapter 7, “Working with Photos and Graphics,” focuses on using the image editing
    and management software included with the Ubuntu desktop.


    Chapter 8, “Communicating over the Internet and Managing Your Schedule,” helps
    you use your Ubuntu system to connect to the Internet, send email, make calls
    with VoIP, and browse the Web.


    # Ubuntu Linux Organization


    Ubuntu Linux Desktop: Your visual blueprint to using the Linux operating system
    has 14 chapters:


    Chapter 1, “Getting Started with Ubuntu,” provides the information needed to obtain
    a copy of the Ubuntu Linux system, together with instructions for installing it
    on your machine.


    Chapter 9, “Creating and Editing Documents with OpenOffice.org Writer,” provides
    basic information to help you get started with OpenOffice’s word-processing software.


    Chapter 2, “Configuring the Desktop,” introduces you to the Ubuntu desktop and
    explains how to arrange and organize your desktop to suit your needs.


    Chapter 10, “Creating and Editing Spreadsheets with OpenOffice.org Calc,” covers
    you using the Calc application to create and edit spreadsheets.'
  merge: -1
  img_proc: true
