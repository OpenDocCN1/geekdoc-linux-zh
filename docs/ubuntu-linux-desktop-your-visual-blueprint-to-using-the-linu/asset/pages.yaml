- pgno: 53
  md: '# # Find Files with the

    autilus File Browser


    You will need to search for files. This is the inevitability of the information
    age. Fortunately, Ubuntu makes that easy. There are no less than three different
    subsystems for finding files on system. The one covered in this section is the
    search built into the Nautilus File Browser. With this integrated tool, you can
    find files on your computer. While fairly elementary, this search feature is de
    useful because it is deployed in the most common place you would need to search
    for or filter searching files down to the ones which you want to operate. This
    is particularly convenient if you are using the click-and-drag metaphor for moving
    files or copying files to another location.


    When you click the Search button, the Location area of the file browser will change
    to a Search prompt. You fill in this Search prompt with the filename that you
    want to search for or a common prefix or suffix that you want to filter on, you
    will receive a listing of just the files that match within that working directory
    and subdirectories of that. The current working directory is determined by the
    directory you were before you clicked Search. After the results are displayed,
    you can reload or add additional filter criteria by using the options in the highlighted
    section of the results. Filter options are available for filtering by content
    or by location. Any number of filters can be applied, and they are additive, so
    the results of the first filter are subsequently followed by the next, and so
    on.


    # Find Files with the Nautilus File Browser


    ![](img/b68319171116e7cb6d71d28d5b12e08c_53_0.png)


    The File Browser opens.


    +   1 Click Places.

    2 Click Home Folder.


    +   3 Click Search.

    * The Location bar becomes the Search bar.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_53_1.png)


