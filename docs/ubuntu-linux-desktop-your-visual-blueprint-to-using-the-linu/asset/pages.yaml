- pgno: 109
  md: '# # Set Up SCIM Input Methods


    To type Chinese, Japanese, Korean character sets or special characters from European
    languages, you can adjust the SCIM settings with the SCIM Input setup. The interface
    of the SCIM application looks different from most of the GNOME preferences applications
    instead of tabs, the SCIM developers have chosen a file explorer-like interface
    to navigate between configuration areas. Frontend''s Setup section presents a
    page on which you can specify the keyboard layout that you are using. You can
    choose to have the pre-edit string showing in a floating window or if the same
    input method should be shared across all applications or if. You can also control
    how the input methods are activated and switching between them.


    IMEng''s Global Setup section lists the installed input engines; if you have not
    installed any special language other than English, the list will be quite sparse.
    On this, you can expand the list that is there and enable or disable the specific
    input methods. You can also select filters and hooks for the different engines.


    The Panel''s GTK section allows you to configure the SCIM setup that appears in
    the status area of the panel. With this, you can enter the SCIM setup easily and
    also reload settings that have been made. In this dialog box, you can also change
    aspects of the input window used for pre-edit information.


    +   - Set Up SCIM Input Methods


    +   1. System -> Preferences -> SCIM Input Setup.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_109_0.png)


    The SCIM Input Method setup launches.


    +   2. Global Setup under Frontend.


    +   3. The Frontend Global Setup page appears.


    +   3. Click here and choose your current keyboard.


    +   4. Global Setup under IMEngine.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_109_1.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Global SCIM setup page


    Verify that all languages you want to be checked.


    Click GTK.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_110_0.png)


    The Panel GTK page appears.


    Change the options as needed.


    Click OK.


    Your SCIM settings take effect.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_110_1.png)


    # Extra


    SCIM stands for Smart Common Input Method, and it is an effort to consolidate
    and componentize the various input methods available today. This allows for easier
    configuration of the input methods, as well as a more structured way to produce
    them for programmers, with the intention of making input methods available. The
    need for this kind of consolidation comes from the distributed nature of development
    within Linux. Various support mechanisms for alternative input methods have grown
    up independently with varying adoption based on the first sets of support they
    implemented. Over time, this has resulted in a patchwork of implementations, each
    with its own quirks and installation necessities. If the interface is consolidated,
    a programmer can make his application able to support multiple input methods without
    having to code for each possible implementation. The result of using this type
    of interface is a faster path to true internationalization of the application
    portfolio as a whole. Because one of the underlying tenets of Ubuntu is to have
    an operating system that is accessible to all people, it is no wonder that SCIM
    has been incorporated within Ubuntu.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Adjust File Search Indexing Settings


    You can adjust the indexing and search preferences with the Tracker Preferences
    application.


    The General tab''s first setting is how long to delay beginning indexing after
    startup. There are settings for whether indexing and watching file operations
    are enabled. When operations are watched, modified files can be indexed immediately.
    There is also a selection for the stemming of words, which go, going, and are
    instances of the same word. Finally, there are options for disabling indexing
    activities if your machine is on battery power.


    You can also specify which directories to index and watch or to initiate a scan
    or "crawl" of your files on startup but not watch for changes.


    On the next tab, Ignored Files, you can specifically exclude certain files or
    paths from being indexed. Ignoring certain files reduces time.


    On the Email tab, you can choose the indexing of email in the Evolution mail client.


    On the Performance tab, you can choose the indexing speed and memory usage, which
    will affect the speed with which your index will be built. Index merging can be
    set to perform fast merges, but your system may operate more slowly during the
    merge process. Finally, you can adjust the amount of text to index within a given
    file and the maximum number of unique words to index.


    The next tab is the Files tab, on which you can enable or disable the indexing
    of file contents, determine if thumbnails will be generated, and set whether to
    index directories that are not part of the base file system.


    # Adjust File Search Indexing Settings


    +   1. Click System → Preferences → Search and Indexing.

    2. The Tracker Preferences application launches.

    3. Click here to change the index delay.

    Note: You can change the other General settings as needed.

    4. Click Files.

    5. Choose the file indexing options that you want.

    6. Click Email.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_111_0.png)


    The Files tab appears.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_111_1.png)'
  merge: -1
  img_proc: true
- pgno: 112
