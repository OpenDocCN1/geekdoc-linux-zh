- pgno: 30
  md: 'Double-click the new launcher.


    The associated application launches.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_30_0.png)


    # # Extra


    After you have created the launcher, you can move it around anywhere on the desktop.
    You can also move it into a folder to keep the desktop clean. Another way to keep
    the launchers handy for use even when you have an application maximized is to
    take it and drag it into one of the panels.


    A launcher can also open a uniform resource locator (URL). In order to do this,
    you need to select Location in the Type box in the Create Launcher dialog box.
    These are very similar to the application launcher files in they are stored with
    the .desktop files in the Desktop folder. But they have a different type specified
    in the metadata that tells the operating system (OS) to determine that they should
    be opened with the Firefox browser application instead of the Nautilus File Browser
    application. You can drag a link from the browser to the GNOME surface to create
    a URL launcher as well. Along with the standard http:// reference, it can also
    open locations of the file:// variety.


