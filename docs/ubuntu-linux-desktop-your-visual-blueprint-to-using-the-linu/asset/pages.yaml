- pgno: 115
  md: '# Adjust Authorizations


    Ubuntu gives you the ability to control what users of the computer can and cannot
    do with the system. The Authorizations utility enables you to edit the privileges
    that each user has to protect your system and data.


    The left pane of the Authorizations dialog box contains a list of various actions
    that can be performed within Ubuntu. The details of that action appear in the
    right pane. The top pane allows you to select an option. When you click an action
    in the left pane, the details labeled Action, enables the functionality. The Implicit
    Authorizations section allows you to grant privileges automatically to users whenever
    certain conditions are met. The section at the bottom of the page,


    labeled Explicit Authorizations, enables you to grant permissions to specific
    users.


    You set implicit authorizations for an action using the Edit Implicit Authorizations
    dialog box. In this dialog box, select the condition under which certain permissions
    will be granted. You may have to enter administrator''s password to make the modifications.
    After you enter your password, click Authentication.


    You set explicit permissions by clicking the Grant button and then selecting the
    name of the user from the Beneficiary drop-down list. If you want to add a condition
    to the permission, at the bottom of the page. Click Grant when you are finished.


    # Adjust Authorizations


    ![](img/b68319171116e7cb6d71d28d5b12e08c_115_0.png)


    +   Click Administration -> Authorizations.


    The window opens.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_115_1.png)


    +   Click the name of the action that you want to modify.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_115_2.png)


    102'
