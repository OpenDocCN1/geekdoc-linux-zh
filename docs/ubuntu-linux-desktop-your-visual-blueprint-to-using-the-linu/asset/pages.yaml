- pgno: 33
  md: '# Change the Number of Workspaces


    Although switching between applications allows you to multitask, sometimes the
    number of applications to toggle between many times called virtual desktops, can
    alleviate some of that overhead by allowing you to group the applications you
    switch between onto different spaces. Each workspace has its own list of applications
    to switch between. This enables you, for example, to place email and administrative
    windows on one desktop, your graphics on another, and reference materials on another
    desktop. This is nearly as if you had three computers next to each other, all
    with different sets of applications running.


    Although these workspaces can be conceived as separate computers, they are more
    closely related to having multiple monitors. That is due to the fact that applications
    can be moved from desktop to easily via the right-click menu on the top of the
    window. Options presented here include moving an application to a workspace right
    or left of the current workspace.

    The ability to switch between workspaces is presented by the Workspace Switcher
    as the applet. This applet shows a small representation of each of them. By clicking
    in given workspace representation, you can switch to that workspace. Additionally,
    you can move applications from workspace to workspace by dragging the representation
    of an application on the task switcher to another of the workspaces on the switcher.


    # Change the Number of Workspaces


    +   - Right-click the desktop switcher.

    - Click Preferences.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_33_0.png)


    The Workspace Switcher Preferences dialog box appears.


    +   - Change the number of workspaces from 2 to the number that you want.

    - Press Tab.

    - The lower pane of the dialog box now shows the number of desktops that you chose.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Add a Panel Applet


    There are many small tasks that you access frequently, as changing the time or
    weather, checking the state of the system battery. These tasks are usually provided
    via the omnipresent GNOME panel applets. Adding new to panel enables you to customize
    the access to frequently used items.


    The dialog box also lists all available applets and provides short descriptions
    of each.


    Some of the more useful applets are the standard types of things that many operating
    systems in a system tray. The Clock and Calendar applet on Ubuntu enables to see
    your appointments in the Evolution email application as well as the same date
    and time. The User Switch applet allows switching the currently logged-in user
    and provides security options such as locking the screen when a user is switched.
    The Network Monitor applet provides you information about your LAN or internet
    connectivity. Other applets such as the CPU Frequency Monitor, the Distributions
    applet, the Sticky Note applet, and of the Trash applet, which moves the file-recovery
    functionality to the system tray instead being on the desktop surface as it is
    on other operating systems.


    The GNOME panel is the primary means of launching applications on Ubuntu-based
    machine. The panel consists of applets. The main menu is a special form of applet.
    This allows for great flexibility and configurability in accessing your applications
    and tools.


    There are many available applets that the Add to Panel dialog box has its own
    search at the top to help you quickly locate any for your need.


    # Add a Panel Applet


