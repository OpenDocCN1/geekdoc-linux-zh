- pgno: 107
  md: "# # Configure Removable Drives and Media\n\nThe Removable Drives and Media\
    \ Preferences application enables you to modify the applications that automatically\
    \ run when a removable device is connected to your machine.\n\nThe first tab of\
    \ this application is the Cameras tab, in which you can specify what to run when\
    \ various types of cameras are connected. The first camera type is listed digital\
    \ cameras, when they are USB-connected, essentially present some sort of flash\
    \ memory interface to the machine.\n\nThe second type of camera category is the\
    \ digital camera, which uses an IEEE1294 interface also known as FireWire. Many\
    \ video cameras with the miniDVDD cassettes have this type of interface.\n\nThe\
    \ final camera type is the Web camera. These again are USB cameras, but they are\
    \ built for continuous\n\ntransmission of pictures to the PC and do not store\
    \ any images themselves.\n\nThe second tab is the PDAs tab, on which you can configure\
    \ the command that should run when a PDA device is connected to the machine. We\
    \ break this down into two types—the PalmOS type of device, which has support\
    \ already into the Ubuntu distribution, and the PocketPC type, which can be supported\
    \ but not installed on Ubuntu by default.\n\nThe next tab is the Printers & Scanners\
    \ tab, on which you can configure a specific command to run when you connect a\
    \ printer or scanner.\n\nThe final tab is the Input Devices tab. This enables\
    \ you to fire up any special application that you want when a specific type of\
    \ input device is used here USB mice, keyboards, and tablets.\n\n# Configure Removable\
    \ Drives and Media\n\n+   1 Click System $\rightarrow$ Preferences $\rightarrow$\
    \ Removable Drives and Media.\nThe Removable Drives and Media Preferences dialog\
    \ box appears.\n2 Enable actions for your camera devices.\n3 Click PDAs.\n4 Enable\
    \ actions for your PDA devices.\n5 Click Printers & Scanners.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_107_0.png)\n\
    \nThe PDAs tab appears.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_107_1.png)"
