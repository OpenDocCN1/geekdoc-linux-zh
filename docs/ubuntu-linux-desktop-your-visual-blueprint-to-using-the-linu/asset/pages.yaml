- pgno: 37
  md: '# # Adjust the Sound Volume


    One of the frequently configured items on any system is the volume. You can adjust
    the master volume level of the computer and vary the relative volumes of each
    of the channels of input using the Volume Control applet.


    The Volume Control applet has two modes of operation. With a single click, you
    can view and make a quick adjustment of the master volume of the sound card. The
    other mode of operation, accessed by a double-click, allows for modifying the
    volume of the input channels, mute, and recording channels. It also enables you
    to adjust the balance of the channels, mute, and access any special features supported
    by your sound card and its drivers.


    are Master, PCM (for pulse code modulation), Line-in, and CD. Channels that support
    stereo have a pair of channels linked below the sliders, when clicked, will allow
    you to modify the left and right volumes for that channel independently.


    You may also see Switches and tabs. The Switches tab contains special features
    such as audio expansion, microphone gain boost, and output adjustment for headphones.
    The Options tab sets which microphone input to capture audio from other and other
    options.


    Using the Volume Control Preferences dialog box, you can add any additional channels
    that your sound card and its drivers support.


    The options on the Volume Control applet depend on the hardware on your machine.
    The most common options


    # Adjust the Sound Volume


    # ADJUST THE VOLUME


    +   1 Double-click the Volume Control applet.


    +   2 The Volume Control applet launches.


    +   3 Adjust the volume channel that you want to change.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_37_0.png)


    # ADD A CHANNEL TO THE VOLUME CONTROL APPLET


    +   3 Click Edit.


