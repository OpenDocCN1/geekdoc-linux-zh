- pgno: 297
  md: '# Rip a CD


    You can copy audio files from a CD and keep the files on your hard drive. The
    process of copying files from your hard drive is called ripping CD, and this process
    makes it possible for you to listen to audio files without having to insert the
    CD into your computer.


    In Ubuntu, you rip audio files with the same application that you use to play
    audio files - the Rhythmbox Music Player.


    When you have an audio CD in your CD drive, your CD track listing will show in
    the main Rhythmbox Music Player pane. Before you begin the ripping process, you
    can select to copy all or only part of the disc. To begin, use the Extract button,
    which is only visible


    when a disc that can be copied is selected. When you click the button, ripping
    begins immediately. At the bottom right of the Rhythmbox Music Player window,
    you will see a status bar that displays the progress of the ripping process.


    When the rip is completed, your music files will be available in the Music directory
    on your hard drive. Note that files will be saved in the .oga format.


    Files ripped in this manner are automatically added to your music library. To
    play files on your hard drive, either double-click the file, which will launch
    the Rhythmbox Music Player, or open Rhythmbox and play the files from the library.


    # Rip a CD


    +   1 Click Applications -> Sound & Video -> Rhythmbox Music Player.

    2 The Rhythmbox Music Player opens.

    3 Insert an audio CD into your CD drive.

    4 Click the name of the CD.

    5 Click Extract.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_297_0.png)


    +   1 The tracks on the CD appear.

    2 Click Extract.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_297_1.png)


    284'
