  md: '# Copy and Move

    Files and Folders


    After you have downloaded files, saved attachments, and authored documents, you
    can move or copy them about at your leisure to organize them in a way that makes
    sense to you. As with deleting files, there are several ways to do this. The reason
    for the multiple ways to perform them is that they are so common that their quick
    easy access is essential for productivity. The two common methods used by the
    File Browser for copying and moving are the visual metaphor and the cut-and-paste
    method.


    dragging the file between a File Browser window and

    tesktop.


    The moving of a file or folder using a visual metaphor is even simpler. Just drag
    the file from the File Browser window — with no additional keys pressed — and
    drop the file onto either the desktop or another File Browser window.


    Using the copy-and-paste metaphor, you copy a file by simply using the copy command
    in one File Browser window and the Paste command in the other File window.


    In order to copy a file or folder from one another using the visual metaphor,
    you can drag the file from one File Browser window to another while keeping the
    Ctrl key pressed down. This also works when


    Using the cut-and-paste metaphor, you can move a file by simply using the cut
    command in one File Browser window and the Paste command in the other File window.


