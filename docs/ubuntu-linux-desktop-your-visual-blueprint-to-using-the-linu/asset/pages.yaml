- pgno: 64
  md: 'You are prompted to provide a passphrase.


    +   5 Type in your passphrase.


    +   6 Click OK.


    The file is encrypted.


    +   The resulting PGP encrypted file appears.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_64_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_64_1.png)


    # Extra


    One popular form of encryption for exchanging information in the early days of
    the Internet was ROT13. This was a simple rotation cipher where all the letters
    of the alphabet were rotated 13 places forward, with the carry-over starting at
    the beginning. This allowed for content that may have been offensive to be sealed
    via this low grade of encryption, and thus the viewer had to actively decode it
    in order to view it, thereby accepting the fact that the material might prove
    provocative. The interesting feature of this technique was encrypting two times
    ended up with the original file due to the 13 character offset.


    The encryption algorithms of today bear little resemblance to this simple cypher.
    They are based on deep mathematical principles and are constantly in an evolving
    state. The precept of most of the encryption work today revolves around mathematically-difficult-to-solve
    problems. As computing power increases, however, these problems slip more and
    more into the realm of possibility to be solved. So stronger, more advanced problems
    are being devised, and the older encryption techniques become outdated and retired.


    continued'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Encrypt a File (continued)


    When you want to retrieve your encrypted information, you will need the private
    key and your passphrase.


    Many times when talking about encryption, you will hear the term brute-force attack.
    This term refers to the number of tries of a simple-mined attacker or program
    that you would have to systematically go through, one by one, to find the password
    or passphrase is, the more tries it will take.


    You may have noticed the term passphrase being used instead of the more common
    password. The use of passphrase stems from the fact that the techniques for cracking
    passwords using brute force have improved to include dictionaries of words, humans
    usually choose a word or name for a password.


    By limiting these brute-force tries to that are in the dictionary and thereby
    more probable to be chosen as a memorable passphrase, allow the attacker to arrive
    at the correct password in fewer tries. When you use a phrase of a single word,
    you greatly increase the number of tries needed as each word complicates the attacker''s
    number of possible choices.


    Choosing an appropriate passphrase can greatly increase the security of your private
    key. The longer your passphrase is, the better your security. As with password
    additional characters not necessarily part of the standard alphabet will increase
    security as well. You must, however, ensure that the secret passphrase you can
    remember. If you lose your passphrase, you will no longer be able to decrypt the
    information in your files, and the files will essentially be lost forever.


    # Encrypt a File (continued)


    # DECRYPT A FILE


    +   1 Right-click the file to be decrypted.


    +   2 Click Open with "Decrypt File."


    ![](img/b68319171116e7cb6d71d28d5b12e08c_65_0.png)


    When you are prompted to provide the passphrase.


    +   3 Type in the passphrase.


    +   4 Click OK.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_65_1.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The file is decrypted.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_66_0.png)


    +   - The decrypted file appears after the process is completed.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_66_1.png)


    # # Extra


    Although the focus of this section has been on asymmetric encryption, it is important
    to understand the use of symmetric encryption as well. Symmetric encryption involves
    the use of a single, shared, secret key that is used for both the encryption and
    decryption of the file or stream of data. Because the key itself is used for encryption
    and decryption, both parties need to have a copy of it. To keep it secret, the
    key must be distributed in person or through some other secure method that cannot
    be compromised.


    Another variant that is widely used is the cryptographic hash. This allows an
    entire file or stream of data to be analyzed and produces a fairly unique fingerprint
    that is very difficult to fake. This technique is used to validate the veracity
    of a file as containing the original provider intended. It allows you to do this
    by letting you check the published fingerprint hash from a known good source versus
    one from the file you have obtained.


    Although public-key cryptography is versatile, it is also computationally intensive.
    Because symmetric encryption does not rely on intensive, mathematically-difficult-to-solve
    problems, it is more efficient computationally.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # Manage File and Folder Permissions


    To ensure that your files are not viewed by others who may be using the machine,
    you can change the permissions for the file. Because Ubuntu, and all Linux and
    UNIX variants, are designed to be multipier, ample facility is provided. Security
    is based around two concepts: the first is the trust classification of the resource,
    and the second is the permissions granted to that class for the file. The trust
    classification is based on three different roles. The most trusted of roles is
    the user owner of the file. The second level is the group role. This is a grouping
    of users. Any user given access to multiple groups. There is the other role. This
    role corresponds to any user. By manipulating the permissions in groups, you can
    change


    The permissions allowed to any of these roles is broken into three basic permissions.
    The primary permission allows a specified role to examine the contents of a file.
    The next most frequently used is the write permission. A role created can modify
    the file. The last is the execute permission. If a text file may or not have the
    appropriate script-handling binary, it can be executed, causing the binary to
    launch with the contents of the script fed into it input. Additionally, the execute
    permission is required to enter a directory. Read permission is not enough to
    actually move the current directory into a folder if you do not have the execute
    permission.


    files among the members of the group.


    **Manage File and Folder Permissions**


    +   1 Right-click the file permissions you want to set.

    2 Click Properties.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_67_0.png)


    The file''s Properties dialog box appears.


    +   3 Click Access under Owner and select the level of access that the file''s
    owner may have.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_67_1.png)


    *With*'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Click Group and select a group to specify access for, such as admin.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_68_0.png)


    Click Access under Group and select that group''s level of access.


    Click Access under Others and specify the level of access that all other users
    may have.


    Click Close.


    Your permissions are set for the file.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_68_1.png)


    # Extra


    There are lesser-used additional types of permissions for files and directories
    within a UNIX-type file system. The first of these is the set-uid flag, which
    allows a file to be executed by a member of a group or if he were the file''s
    owner. This is usually done by a specific account or the superuser, thereby delegating
    the capability to run functions as a more privileged user. The set-group-id is
    used for setting the group ID for operations on that directory or its entries.
    This is useful for shared directories; by setting the group-id flag on a directory,
    all files created within that directory will maintain the group of the directory
    rather than the primary, or, or user''s group membership list. There is also a
    permission called the "sticky-bit" that is mostly obsolete, as used to cause a
    file not to be flushed from memory and thus "stick." It also means that a file
    with this permission set cannot be deleted by other users even if they have write
    permissions to the containing directory. This is useful in shared directories
    such as /tmp.'
  merge: -1
  img_proc: true
