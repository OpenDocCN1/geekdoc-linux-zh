- pgno: 99
  md: '# # Change Personal Details with About Me


    Changing your personal information is especially important on machines that have
    multiple users. You can change your personal information using the About Me application.


    This application enables you to change details about yourself that an administrator
    may need to know or what may need to be used by applications.


    The Contact tab allows you to store all your contact information, starting with
    email addresses and telephone numbers for various places you may be reached. The
    final section of this tab can record all your vacant messaging logins that you
    have by protocol/platform.


    The Address tab enables you to record home and work addresses


    # Change Personal Details with About Me


    The Info tab enables you to record your personal Web page address, your personal
    Web log address, and the location of your published calendar on the Web. It also
    allows you to record various aspects about your current employment.


    Also, the About Me application allows you to change your password. This is something
    that you should do periodically. You must first prove that you are in fact the
    owner of the account and not someone who happens to have found an unlocked session.
    You do this by providing the login password for the account and then authenticating.
    After that, you are allowed to enter a new password. New passwords have to be
    entered twice because the actual characters are shown. Without this double entry,
    you might mistake the password and then have to change it this way, which could
    accidentally lock yourself out of your account.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_99_0.png)


    +   1. Click System -> Preferences -> About Me.


    The About Me application appears.


    +   2. Type in your contact information.


    +   3. Add any instant messaging logins that you want to include.


    +   4. Click Address.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_99_1.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'The Address tab appears.


    +   - Type in your address information.


    +   - Click Personal Info.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_100_0.png)


    The Personal Info tab appears.


    +   - Type in any personal information that you want to include.


    +   - Click Close.


    Your About Me information is saved.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_100_1.png)


    # Extra


    Never give your password to anyone. This may seem a bit obvious, but it is almost
    always a common problem in work situations. Many times people will share a password
    with a coworker when they plan to be out or are already out and are being contacted
    to do something remotely. Although it seems that it may be fairly innocent, this
    can be catastrophic for you. This is because once you give your password to someone
    else, he or she does on the computer will look like it was done by you. This can
    lead to all sorts of mischief from simple email blunders to full-scale fraud.
    It is by far a better practice to request access granted to perform a task rather
    than to forge your own by sharing a password. Additionally, changing your password
    often will help to keep your password safe. If someone is trying to use a brute-force
    attack against your account, he or she will have made a number of attempts to
    log in as, hopefully failing. When you change your password, your account becomes
    a moving target and thus harder to hack.


    Chapter 4: Setting Preferences'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Access Assistive Technologies Controls


