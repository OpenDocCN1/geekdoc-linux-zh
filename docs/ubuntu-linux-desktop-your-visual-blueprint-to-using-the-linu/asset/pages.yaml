  md: '# Install Ubuntu (continued)


    installing Ubuntu involves not only getting the software on your computer, but
    also setting up your account to use it. Controlling user access and privileges
    is one of the keys to keeping your Ubuntu system safe.


    The proliferation of viruses and malware has been accelerated by the use of unsecured
    privileges on machines connected to the Internet. A common scenario for malware
    is to trick users into running a malicious piece of software on their computers,
    that they have administrative privileges, allowing this program to set backdoors
    into the system that can be used remotely by the person or persons who authorized
    the program. Similar, though more sophisticated, is the virus trick. This attack
    exploits vulnerability in either software or access


    mechanisms to gain access to a system. If the account has breached sufficient
    privileges, the virus can propagate to other accounts on the system or propagate
    out to other systems.

    To avoid this, it is paramount to have easily guessed passwords for user accounts
    and to protect them vigorously. Never share your password with another and never
    run any program if you are unsure of its authenticity. Ubuntu subscribes to a
    least privilege approach, meaning that your user account has the minimum privileges
    necessary to accomplish your day-day tasks. A dialog box will be presented to
    you for your password. This is a warning sign. Whenever you are asked for your
    password, be certain of the actions that you are performing.


    # Install Ubuntu (continued)


