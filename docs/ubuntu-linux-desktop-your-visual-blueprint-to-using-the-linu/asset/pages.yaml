  md: 'The songs on

    the CD appear.


    Click the first song

    name if you want to

    play the whole CD.


    Note: You can click a

    later song on the

    CD if you want to

    start the CD

    playing from that point.


    Click Play.


    The CD begins to

    play.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_290_0.png)


    # Extra


    Rhythmbox is based on Apple''s popular iTunes application and works in a similar
    fashion. Songs on your local hard

    drive are added to the Library, which you can then manage from within Rhythmbox.
    You can add songs to the

    Library by using the Import command on the File menu or by ripping tunes off CD.


    Music kept in the Library can be organized into playlists, which appear at the
    bottom of the left column of the main

    Rhythmbox Music Player window. You can add new playlists by right-clicking in
    the Playlists area and selecting New

    Playlist from the right-click menu. You can name the playlist by typing a name
    in the window by the icon. After a

    playlist is created, you can drag songs into it to build your collection.


    Information on the songs in your Library can be edited by right-clicking a song
    title and selecting the Properties

    option. You can specify a genre or provide ratings for songs to help keep your
    collection organized. Note also that

    the songs in your Library or the playlist can be sorted by clicking the column
    headings in the main pane.


    chapter 13: Playing and Recording Music and Sound'
