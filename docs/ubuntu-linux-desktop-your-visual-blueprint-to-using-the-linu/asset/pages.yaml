- pgno: 139
  md: "# # Review the System Logs\n\nThe System Log Viewer built into the GNOME desktop\
    \ makes it easy to view a record of system events and helps to diagnose problems\
    \ with your system. Although you can access the same information as system by\
    \ reviewing the log files, the data presented in the System Log Viewer is easier\
    \ to read and simpler to find.\n\nOpen log dialog box, which displays the various\
    \ log files the system has saved throughout the recent history of system. You\
    \ can select the one that you want and then open it in the System Log Viewer.\n\
    \nThe System Log Viewer has three panes in the window. The top-left pane shows\
    \ you the various log files. The bottom-left pane shows a calendar indicating\
    \ the dates of the logs. The main window on the right contains the contents of\
    \ the logs.\n\nLog files can be very long and are notoriously hard to scan and\
    \ review. If you are looking for a specific reference, you can make the task more\
    \ manageable by using the Filter control, located under the View menu. When you\
    \ select Filter, a search box will appear the active log file's contents will\
    \ be filtered to restrict the view to only those that contain the string you have\
    \ entered.\n\nYou can select any of the logs in the left pane to see their contents.\
    \ You can access additional log files by using the\n\n# Review the System Logs\n\
    \n+   1 Click System $\rightarrow$ Administration $\rightarrow$ System Log.\n\n\
    ![](img/b68319171116e7cb6d71d28d5b12e08c_139_0.png)\n\nThe System Log Viewer opens.\n\
    \n+   If the log that you want to view is in the list, you can click it, and its\
    \ contents will appear over the right.\n\n+   2 Click File $\rightarrow$ Open.\n\
    \n![](img/b68319171116e7cb6d71d28d5b12e08c_139_1.png)\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_139_2.png)\n\
    \n![](img/b68319171116e7cb6d71d28d5b12e08c_139_3.png)"
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The Open Log dialog appears.


    +   Click the log file that you want to view.


    +   Click Open.


    +   The log file appears in the Viewer window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_140_0.png)


    # # Extra


    The default System Log application is quite good and thorough. It will suffice
    for the vast majority of users. However, if you are a developer or have a special
    need for a more advanced application, you can find several in the Synaptic Package
    Manager.


    Open Synaptic, as discussed in the section "Add Software with the Synaptic Package
    Manager." Run a search for the term log using the Quick Search feature on the
    Synaptic toolbar. A number of results will appear.


    Among the results, you will find log applications tailored to a variety of environments.
    There is one for the .Net framework, another written in Perl, one in Java, and
    one in C++. Some of these applications are powerful and provide feature sets that
    match or exceed the default System Log application.


    Also of note is the log2mail application. Log2mail lets you set up a watch for
    the log, and when a string matches your watch list, an email is sent to the address
    you specify. This is particularly useful to track and manage your machines remotely.


    chapter 5. Administering the System'
