- pgno: 253
  md: '# # Sort and Filter Spreadsheet Data


    Once you have data in your spreadsheet, you can filter and sort the data to record
    it and view only what you need. The sorting and filtering tools are not only useful
    for big spreadsheets containing large amounts of data but are also very useful
    for smaller spreadsheets.


    The Sort and Filter options can be applied to all or only a portion of your data.
    You use the Sort dialog to sort your data. This dialog box includes two tabs;
    the first tab enables you to select the primary and secondary sort criteria, which
    is labeled by column or row. If you have used your first row or column as headers,
    Calc will normally display that as a sort option. You have the choice of specifying
    up to three layers of sort criteria, and


    each of them can be ascending or descending. The second tab, *Options*, are additional
    choices to refine the sorting process. If you are sorting the entire data set
    and use column headers, check the option Range Contains Column Labels to the top
    of the columns.


    The Data → Filter option provides a way to select and filter data based on criteria
    that you define. This is most useful if you have a large data set and want to
    see only portions of it. The Standard Filter option supplies common filters. More
    advanced users can create custom filters using the Advanced Filter option.


    # Sort and Filter Spreadsheet Data


    +   1 Select the cells containing the data that you want to sort.


    *Note:* If you want to select all cells, you can press Ctrl + A.


    +   2 Click Data → Sort.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_253_0.png)


    The Sort dialog box opens.


    +   3 Click here and select the column or row that you want to sort by.


    +   * You can select secondary columns or rows to sort by.


    +   4 Click the Options tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_253_1.png)'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The Options tab comes to the front.


    +   5 If you have column headings that do not want affected by the sort, click
    Range Contains Column Labels.


    +   6 Click any other, options that you want.


    +   7 Click OK.


    The data in the spreadsheet is sorted.


    # Extra


    The Options tab of the Sort dialog box includes several choices that deserve special
    mention. Case Sensitive, as the name implies, enables you to insist that Calc
    pay attention to the case of the text in the cells in the course of the sort.
    In addition, if your spreadsheet includes Asian languages, this option enables
    sorting by dictionaries, character widths, and Kana differences.


    The option Copy Sort Results enables you to specify a target for the output of
    the sort. You can specify a cell or, more frequently, a range of cells in which
    you results are to be copied.


    The Custom Sort order enables the creation of custom sort criteria. Calc includes
    several day/date sort orders, although these are rather limited in their application.
    You can create new custom sort orders by clicking Tools -> Sort can be defined
    under the section OpenOffice.org Calc.


    The Language option lets you set the language to be used for the sort, and for
    some languages, it also allows the definition of further criteria.


    With the Direction option, you can sort either by rows or by columns.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# # Insert and Format a Chart


    Charts provide a way to display data in a visually meaningful fashion. Calc enables
    the use of wide variety of chart and formats, which can be customized to suit
    your needs.


    To create a chart or graph, first enter the data into a spreadsheet. Then use
    the Chart Wizard to create the chart, which enables you to select from Calc''s
    extensive list of chart and formats that best suits your data. The Chart Wizard
    dialog box allows you to specify data ranges and give names to the various chart
    elements. You can work through the various steps in the Chart Wizard by either
    clicking the name in the left or by using the Back and Next buttons at the bottom
    of the wizard.


    After the chart is in place of your spreadsheet, you can edit it by clicking anywhere
    on the chart object. Clicking once selects the chart and causes the Object to
    appear above the Formula bar. The Object toolbar enables you to make changes to
    the chart as, including setting the order of multiple objects and moving your
    chart relative to other objects.


    Single click also causes-and-drag points to appear on the chart object. You can
    move your chart by clicking any of the points and dragging the object to the new
    location. Clicking the corner point allows you to resize the chart.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_255_0.png)


    +   1 Click and drag to select the data that you want to use for your chart.


    +   2 Click Insert -> Chart.


    The Chart Wizard appears.


    +   3 Click the chart type that you want.


    +   4 Finish.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'The chart is generated and displayed in the spreadsheet.


    +   - Double-click the chart to edit it.


    +   - Right-click the area around the chart.


    +   - Click Chart Type.


    # Extra


    Calc provides a number of chart and graph formats. The formats are divided into
    nine categories, each of which includes numerous variations. You can view all
    the types in the Chart Types dialog box. Column and Bar charts are similar. Both
    display bars are proportional to their values. Column charts show vertical bars,
    whereas Bar charts show the data in a horizontal format.


    Pie charts exhibit data in a circular format, in which each data series is a slice
    of the circle. Calc supports standard pie charts and donut charts. Area charts
    show values as points on an axis. Variations allow you to show stacked values
    or percentages. Line charts show data as a set of points on the X and Y axis.
    This chart type relies on a coordinate system for values.


    Net charts show values in a web, like a radar grid. Each row of the chart data
    is a radial arm of the grid. Stock charts indicate trends and ranges. Variants
    can display subsets or can include the transaction volume. Column and Line charts
    combine both columns and lines into one display.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_256_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_256_1.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_256_2.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_256_3.png)


    continued


    Chapter 10: Creating and Editing Spreadsheets with OpenOffice.org'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# # Insert and Format a Chart (continued)


    Double-click on a chart causes the Chart toolbar to appear in place of the Formula
    bar. The toolbar contains buttons that control aspects of the formatting of your
    chart or graph. The Chart Type button opens the Chart dialog box in which you
    can change the chart type or add 3D visual effects. The Chart Data table displays
    the data on which your chart is based, if it is not already visible. Other buttons
    allow you to show or hide the horizontal grid and the chart''s legend. You can
    also scale the text using this toolbar and apply autofollowing, which will override
    any manual settings you have applied to the chart. When you right-click the area
    around a chart, you access the right-click menu. This menu includes an option


    labeled Data Ranges. Clicking Data Range opens a dialog box that allows you to
    set the data range that will be displayed in the chart. This dialog box also allows
    you to control some of the formatting of the data series, including the ability
    to reorder the data. You can control the formatting of the legend attached to
    your chart or graph. To do so, right-click the legend and select Object Properties
    from it. Clicking Object Properties opens the Legend dialog box. In this dialog
    box, you can set borders, and the transparency of the chart legend. You can also
    control the font styling and the position of the legend relative to the chart.


    # ## Insert and Format a Chart (continued)


    The Chart Type dialog box opens.


    +   - Click a Percent Stacked option to compare the percentage values contribute
    to a total.


    +   - Click Look to make like your chart values appear 3D.


    +   - You can click here and select a 3D style.


    +   - Click OK.


    The formatting changes are applied to the chart.


    +   - Right-click the area around the chart.


    +   - Click 3D View.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_257_0.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The 3D View dialog box appears.


    +   13 Type the number of degrees for the chart to rotate about the X axis.


    +   14 Type the number of degrees for the chart to rotate about the Y axis.


    +   - You can enter a percentage value to change the perspective.


    +   15 Click OK.


    The new formatting is applied to the chart.


    +   16 Click and drag a handle to resize the chart.


    The chart is resized.


    # Extra


    Often, it is necessary to adjust the formatting of the individual data series
    in a chart. You can control the appearance of each series and add labels and other
    useful information for the viewers.


    To format a data series on a chart, right-click one member of the series and select
    Object Properties from the menu that appears. The Data Series dialog box opens
    eight tabs that give you a great deal of control over the formatting of the series.
    Select a border for the Borders tab. Click Area to to select the color for your
    series. If you want the values to be displayed along with the series, click the
    Data Labels tab and select from the options. Choose Show Value As a Number to
    display the numerical value of each point of the series on your chart. Use the
    Characters and Font Effects tabs to set the formatting of the data labels. The
    Statistics tab lets you set error margins for a series. The Options tab lets you
    set alignment and spacing.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_258_0.png)'
