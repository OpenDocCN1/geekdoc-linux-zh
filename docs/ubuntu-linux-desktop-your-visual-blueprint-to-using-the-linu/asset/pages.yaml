- pgno: 80
  md: '# Change Keyboard Shortcuts


    if you have been using a computer for a long time, you have no doubt accustomed
    to certain keyboard shortcuts to accomplish tasks. You can configure your old
    favorite shortcuts using the Keyboard Shortcuts application.

    The interface for this application resembles a Properties dialog box or the key
    bindings from a game program. There is list of groups grouped by the action on
    the left and the shortcut key associated with the action on the right. When a
    row is highlighted, the right column displays "New Accelerator," and you simply
    press the new key.

    The three categories of key bindings are Sound, Desktop, and Window Management.
    The Sound category deals with multimedia controls such as volume and interacting
    with media players.


    Change Keyboard Shortcuts


    The Desktop category deals with general tasks at the desktop level — including
    locking the screen, activating searches, and launching certain applications. The
    Window Management category is the most expansive, in part to the built-in multiple
    workspace support. There are key bindings available for essentially every way
    you may want to manage a window on or across workspaces.

    The default keystroke shortcuts will accommodate most activities without adjustment,
    but there are variances among Keyboards, the midway keys may need to be adjusted
    to fit your particular hardware.

    Keep in mind that shortcuts can be applied to launchers as well. Additional key
    configurations within the Nautilus File Browser can also be made to customize
    keystroke within that application.


    +   1 Click System → Preferences → Keyboard Shortcuts.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_80_0.png)


    The Keyboard Shortcuts application appears.


    +   2 Click the action whose keystrokes you want to change.


    +   3 Type the new keys.


    +   4 Click Close.


    The new keystrokes are bound to the action.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_80_1.png)


    | Action | Shortcut |

    | --- | --- |

    | Log out | Ctrl+Alt+Delete |

    | Lock screen | Disabled |

    | Running applications | Ctrl+Alt+L |

    | Search | Super3 |

    | Show the panel application dialog | Alt+1 |

    | Take a screenshot | Print |

    | Take a screenshot of a window | Alt+Print |

    | Run a terminal | |

    | To edit a shortcut, click on the corresponding row and type a new accelerator,
    or backspace to close'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # Modify the Main Menu


    The main menu of the Ubuntu system is configurable. You can change them to suit
    your tastes or for specialized deployments in which you do not want all the functions
    of the operating system available to casual users.


    The menus are categorized by many divisions by default. The first category is
    Applications and includes all the programs that a user may run in the normal course
    of using the computer. The second category is the Main Menu category, which includes
    the preferences applications and the administrative applications. The preferences
    applications are typically those users would configure to customize the desktop
    environment to their tastes, whereas the administrative applications are more
    systemwide settings that affect all users.


    The Main Menu preference application enables you to customize the main menus.
    This includes adding new menus and submenus. It also includes adding, deleting,
    and modifying items in menus. You can also add managers to menus to identify a
    group of applications within a single menu. The menu can contain other menus.
    When creating a new menu, you can include a comment parameter that will be displayed
    when the menu is hovered over with the mouse pointer. The order of menu items
    can also be manipulated or as preferred.


    The items within the menus are all standard launchers and take the usual name,
    command, and comment


    # Modify the Main Menu


    +   1 Click System -> Preferences -> Main Menu.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_81_0.png)


    The Main Menu application appears.


    +   2 Click a menu to modify.


    +   3 Click the contents of the menu are displayed.


    +   3 Click New item.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# The Create Launcher dialog box.


    4 Type a name for the new menu item.


    5 Type the command for the new menu item.


    6 Enter the comment that you want to use.


    7 Click OK.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_82_0.png)


    +   - The new item is inserted into the menu.


    +   - You can also add a new menu or a separator or move items up or down.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_82_1.png)


    # Apply It


    If are are not type to use icons on the desktop or panel to launch your applications,
    you may want to take this opportunity to enhance your menu system to accommodate
    yourself. Start by launching the Main Menu preference application. Click New Menu
    and add a name Favorites to the top of the items under the Applications menu.
    Then click New Separator and add a separator at the Applications menu level so
    that you can distinguish them from the default items on the Applications menu.
    Then find any applications that you use frequently and add them to the Applications
    menu. Sort them as you like for the easiest possible access. For example, you
    may want to sort some to the top so that you can see them more easily or to the
    middle or bottom so that you can get to them extra quickly. Now you have rapid
    access to the applications that you use the most without cluttering the desktop
    or the panel. Keep in mind that you can layer the menus as, if your list of favorites
    gets too long to readily use on one menu.'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# # Adjust Network Proxy Settings\n\nf you are within a corporate network or\
    \ use an ISP that requires you to use a proxy server, you can use the Network\
    \ Proxy Preferences application to direct your Internet traffic through the appropriate\
    \ server. Proxy servers take the requests from your computer and out onto your\
    \ local network and onto the public Internet. This additional complexity is handled\
    \ by a proxy server that is configured with special security features. Additionally,\
    \ it can provide caching of frequently requested content. Another common use of\
    \ proxy server is to control the Web that can be reached by users. This proxy\
    \ can be filtered by either the content itself or the domains and IP addresses\
    \ available to be contacted, or\n\nThere are three major options for configuration\
    \ of the proxy settings. The first is the Direct Internet Connection option. This\
    \ option means that no proxy is used, so all requests go directly to your default\
    \ gateway and then to the Internet. The second option is Manual Proxy Configuration.\
    \ You can set the same proxy for all protocols or an proxy proxy for each protocol.\
    \ To be able to properly configure these, you will need to get the server name\
    \ and port numbers for each protocol from your network administrator. The final\
    \ setting is the Automatic Proxy Configuration. This takes care of almost all\
    \ the work of setting up the proxy configuration, with the exception that you\
    \ need to know where to point the autoconfig/URL. You will need to get this information\
    \ from your network administrator.\n\n# Adjust Network Proxy Settings\n\n+   1\
    \ Click System $\rightarrow$ Preferences $\rightarrow$ Network Proxy.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_83_0.png)\n\
    \nThe Network Proxy Preferences application launches.\n\n+   2 Click Manual Proxy\
    \ Configuration.\n\n+   3 Type in your local domain's proxy hostname and port.\n\
    \n+   4 Click Details.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_83_1.png)\n\
    \n70"
  merge: -1
  img_proc: true
- pgno: 84
  md: 'HTTP Proxy Details dialog box.


    +   5 Click Use Authentication.


    +   6 Type in your username for your company''s proxy.


    +   7 Type in your password for your company''s proxy.


    +   8 Click Close.


    +   9 Click Advanced Configuration.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_84_0.png)


    The Advanced Configuration tab appears.


    +   10 Type in the name of your local domain.


    +   11 Click Add.


    Now when you connect to your local domain, the proxy will not be used.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_84_1.png)


    # Extra


    There are advanced settings for proxy configuration, or rather proxy avoidance.
    The only setting on the Advanced Configuration tab of the Network Proxy Preferences
    application is a list of hosts that you do not want to use the proxy to connect
    to. The items in this list can be a simple hostname, a list of hostnames with
    an asterisk as a wildcard for terms within the domain hierarchy, or an IP address.
    There are examples of these types of specifications in the list by default, and
    these should not be tampered with. The IP addresses specified may use netmasks
    to allow for specifying ranges of IP addresses. The masking notation is in the
    form of the number order bits of the IP address to ignore. For example, a /8 at
    the end of a masked address indicates that the final octet of the IP address should
    be ignored and any address that matches on the first three octets of the IP address
    will not use the proxy server.'
