- pgno: 157
  md: '# # Find Where Memory Space Is Being Used with the Disk Usage Analyzer


    Ubuntu is packaged with a tool that makes it possible for you to view the space
    on your hard drive being used. The Disk Usage Analyzer provides insight into the
    space taken by your various files and directories. If you yourself running short
    of space on your hard disk, the Disk Usage Analyzer is a fast and easy way to
    find out there may be opportunities for you to free up more space.


    The Disk Usage Analyzer is a part of a Linux application called Baobab and is
    part of the Linux Utils bundle that comes with Ubuntu.


    Once launched, the application waits for you to select an action to perform. You
    can scan all your system, or a single directory, by selecting the icons at the


    the screen. After you select an action to be performed, the application will start
    to index the target and display the results on your page.

    The Disk Usage Analyzer window is divided into two regions. On the left side of
    the window is the list of directories and files. On the right side is a graphical
    representation of the space allocation. You can select the chart on the right
    functions using the drop-down list at the top right of the screen. The display
    is a rings chart, but you can also view the results as a bar chart. Regardless
    of which you you select, the display is essentially the same, the relative space
    taken by the various directories and their contents.


    # ## Find Where Memory Space Is Used with the Disk Usage Analyzer


    +   1. Click Applications -> Accessories -> Disk Usage Analyzer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_157_0.png)


    The Disk Usage Analyzer appears.


    +   2. Click Filesystem.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_157_1.png)'
  merge: -1
  img_proc: true
