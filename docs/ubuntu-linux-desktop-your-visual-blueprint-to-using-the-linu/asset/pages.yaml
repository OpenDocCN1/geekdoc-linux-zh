- pgno: 221
  md: '# # Send a Meeting Invitation


    You can use Evolution''s Calendar application to set up appointments and invite
    other people to join them. Evolution calls appointments with multiple meetings
    and gives you the ability to notify those people and track their participation.


    Creating a new meeting is very similar to creating a new appointment, the key
    difference being that you must also add participants and notify them. You use
    the Meeting window to fill in the details about the meeting and invite the participants.


    You add a summary to describe the meeting and specify the meeting location. Use
    the date and time using drop-down lists, and you can add a longer description
    if you want to. Then you add the other attendees. Click the Add button to add
    participants that are not in


    your contact list. If you want to add persons that are in one of your Address
    books, the better course is to use the Attendees dialog, as shown below. In the
    Attendees dialog, you can pick persons from your contacts and assign them to roles,
    if necessary.


    You can click the Edit button in the Meeting window to change the role assigned
    to any attendee. You can also delete attendees by removing the Room.


    After you have entered the details of the meeting and selected the attendees,
    you will be asked whether you want to send notifications to the Attendee list.
    If you choose to do so, Evolution will send all the attendees email informing
    them of the meeting and asking them to confirm their attendance.


    # Send a Meeting Invitation


    +   In the Calendar window, click the New drop-down arrow -> Meeting.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_221_0.png)


    The Meeting window opens.


    +   Type a short description of the meeting.


    +   Type where the meeting will occur.


    +   Set the time of the meeting.


    +   Click Attendees.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The Attendees


    window appears.


    +   6 Click the contact(s) to invite you to the meeting.


    +   7 Click Add.


    +   8 Click Close.


    You are returned to the Meeting window.


    +   9 Click Save.


    Evolution prompts send you invitations to the attendees.


    +   10 Click Send.


    Evolution sends them an email invitation and adds the meeting to your calendar.


    # Extra


    Calendar invitations are sent from Evolution in the .ics format. This format is
    known as iCal and is readable by the most popular Calendar applications. Attendees
    will receive an email containing an .ics file they must add to their Calendar
    application. Typically, double-clicking the .ics file will trigger the proper
    process.


    After the appointment is in their calendar, they will be able to see the details
    of the invitation, and in most applications, they will have the opportunity to
    accept, decline, or modify the appointment. Whatever they choose will result in
    an email returned to you as the meeting organizer indicating the recipient''s
    response.


    The iCal format is easy to use and very convenient. The only problems are that
    the email message the attendees receive contains no other information about the
    appointment and therefore, if the attendees do not expect to receive the notification,
    they may ignore it or not want to click it for fear that the attachment may harbor
    a virus or malicious application. The other problem is, of course, that if the
    attendees do not have an application with iCal, they cannot participate in this
    shared calendar process.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_222_0.png)


    # Chapter 8: Communicating over the Internet and Managing Your Schedule'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# # Manage Appointments and Meetings


    Evolution has a built-in classification schema called Categories. You can use
    Evolution''s Categories feature to keep your meetings and appointments organized.
    By classifying your events into categories, you can quickly find related items
    and keep complex calendars with large numbers of events manageable.


    To apply categories to a meeting or appointment, you must first enable the Categories
    field. To do so, View -> Categories. The Categories field will now be available
    on all your calendar events. To assign an event to a category, use the Categories
    dialog box, which allows you to select one or more categories from the list. After
    that, the categories will appear in your event''s window. After you saved the
    event, you will thereafter be able to find this event easily using the Category
    filter on the Evolution interface.


    The Categories functionality applies across the Calendar, Contacts, and Tasks
    of the application. The tools works by allowing you to associate items with one
    or more categories. Evolution provides a filter that you can use to limit the
    items belonging to a particular category, making it easier to find items in large
    or complex lists. This is particularly useful when you maintain multiple calendars
    or Address books.


    To filter items, select the category that you want from the Show-down list, which
    is located immediately under the main toolbar in the Calendar, Contacts, Tasks,
    and Memos console. The filter list does not appear in the Mail console.


    # Manage Appointments and Meetings


    +   1 In the Calendars window, double-click an event.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_223_0.png)


    The event''s edit window opens.


    +   2 Click Categories.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# The Categories dialog box appears.


    Click a category by which you want to classify the event.


    Repeat step 3 for all the categories for the event.


    Click OK.


    The categories appear in your event''s window.


    Click Save.


    The event will appear in all the Category lists that you specified.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_224_0.png)


    # Extra


    You can make changes to the default list of categories that comes with Evolution.
    To edit the Categories list, you need to open an event, category, task, or memo
    and click the Categories button. The Categories dialog box includes three buttons:
    New, Edit, and Delete.


    Clicking the New button opens a blank Category Properties dialog box. Use this
    dialog box to create a new category for your list. Give it a name and then select
    an icon that will appear beside the category. Note that although the icon is optional,
    it is very useful it will appear on any items that are associated with the category.
    Although the system comes loaded with a number of icons, most of them are used
    for other categories. If you want to add additional images to use as icons, you
    may do so by copying them on to your computer and then selecting them from the
    Category Properties dialog box.


    To edit an existing category, click the name and then click the Edit button. Note
    that for the system''s default categories, you can change only the icon; you cannot
    change the name of the category itself.


    To delete a category, click the name and then click the Delete button.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_224_1.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Create Tasks


    You can use Evolution to create tasks and to-do lists. The Tasks functionality
    enables you to assign tasks and track the progress as you work on completing them.


    You create a new task in the Tasks window. You provide a short description of
    the task in the Summary field. You can set a date to begin the task and a date
    that the task is due, and you can enter a longer description in the Description
    field, if necessary. Other options in the Task window let you assign a task to
    a category or set a classification. You can also attach a file to a task using
    the Attachment option under the Insert menu, or you can drag and drop a file into
    the Attachment bar.


    The Tasks functionality is built into Evolution and closely integrated with the
    Calendar, and to a lesser extent, the email system. From the Evolution Tasks view,
    you can view pending tasks, and you can create edit tasks.


    The Tasks console is the best place for working with your task lists. On the Tasks
    page, you will see a list of all the tasks in Evolution. Clicking a task displays
    the details in the lower pane.


    New tasks appear immediately in the main pane of the Tasks console. Double-click
    a task to open it for editing. Right-click a task to access a menu of options,
    including the ability to assign the task to another person or add it to the calendar.


    # Create Tasks


    +   1 Click Tasks.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_225_0.png)


    The Tasks pane opens.


    +   2 Click the drop-down arrow -> Task.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_225_1.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The Task window appears.


    Type a short description of the task.


    Type start and due dates.


    Type a longer description, if needed.


    Click Save.


    The task is added to your Tasks list.


    Move your cursor over the task.


    +   - A pop-up displays the task''s details.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_226_0.png)


    # Extra


    You can use the functionality to track your progress on a task over time. The
    Status option turns your Tasks console into an organizational tool that helps
    you stay on top of work and prioritize tasks. Combine it with the ability to assign
    tasks to others and add them to the calendar, and you have a set of tools that
    give you basic, useful, project-management abilities.


    To set and manage the status of a task, open it and click the Status Details button
    on the main toolbar. The Task Details dialog box enables you to set the status
    as Not Started, In Progress, Completed, or Canceled. The default setting, regardless
    of the date you indicate, is Not Started. The Percent Complete field lets you
    assign a percentage value to the work done to date. The Priority field gives you
    the choice of Undefined, Low, Normal, or High. Date Completed lets you mark the
    date and the time that the task was resolved. The last field in this dialog box,
    Web Page, lets you add a hyperlink to a task. After you have made your changes
    to the Task Details dialog box, click Close to save your work.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# # Create a New Document


    OpenOffice Writer is a powerful and flexible word-processing program that lets
    you create and edit documents in a number of formats. You can use Writer for simple
    letters or complex manuscripts as the application comes with all the features
    and functions that you would expect from a professional word-processing package.
    There are several ways to create a document. When you first launch Writer, the
    application opens with a new document in the window. Alternatively, if you have
    closed that document or want to create another, you can use the New menu option.
    Writer also supports a wide array of keyboard shortcuts. There is a keyboard shortcut
    for most common tasks, including creating a new


    document. To use the shortcut, you press the Ctrl key at the same time that you
    press the letter N. The File -> New menu has a variety of other options for creating
    files. The Spreadsheet, Presentation, and Drawing choices open your OpenOffice
    applications. The HTML Document, XML Form Document, and Master Document options
    are all documents that you can edit from Writer. The Labels and Business Cards
    options are templates that allow you to format a document specifically suited
    for types of items. The last choice, Templates and Documents enables you to create
    a new document based on the template.


    When your document is open in the window, you can add or edit the contents freely
    using the tools in Writer. You can save your work at any time.


    # Create a New Document


    # WHEN OPENING WRITER


    +   - Click Applications -> OpenOffice.org Word Processor.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_227_0.png)


    When application opens, with a new document in the window.


    +   - You can type the text that you want in the document.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_227_1.png)'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# # WRITER

    ALREADY OPEN


    1 Click File -> New ->nText Document.


    A new document appears in the main window.


    2 Type the text that

    You want.


    3 Click the Save

    button.


    The changes to the

    document are

    saved.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_228_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_228_1.png)


    # Extra


    The Templates and Documents option under File -> New allows you to create new
    documents based on existing

    templates. Templates provide you with standardized document formats that enable
    the creation of multiple

    documents that share common formatting. Templates are most useful for common tasks,
    such as creating an

    invoice, a letter, or a form, or for creating, complex documents that need to
    have standardized formatting

    through. Using templates, you can set fonts, spacing, common headers, footers,
    and more, thereby making the

    creation of new documents easier and assuring visual similarity across multiple
    documents and multiple users.


    The default Ubuntu distribution contains only two templates for Writer, Project
    Proposal and Standard

    Resume. It is, however, easy to turn a document into a template that you can reuse.
    You can create a new template

    out of any document by opening it and then clicking File -> Templates -> Save.
    You can edit existing templates by

    clicking File -> Templates -> Edit.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_228_2.png)


