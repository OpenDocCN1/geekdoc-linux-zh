- pgno: 203
  md: '# Download Files with the Transmission BitTorrent Client


    With the Transmission BitTorrent client, you can download large files quickly
    and share files on your computer with others. The BitTorrent protocol makes downloading
    large files easy as multiple servers simultaneously. This approach to file downloads
    is known as peer-to-peer.

    The Transmission BitTorrent client is part of the default Ubuntu distribution.
    You can open Transmission yourself automatically when you click or download a
    torrent file. Indeed, the majority of times you will use the Transmission BitTorrent
    client will probably be in the automatic mode as you click torrents that you find
    while browsing the Internet.


    The main Transmission application window includes a status window, which shows
    the state of all downloads, as well as a set of controls that you customize the
    preferences and configuration. If you have downloaded a torrent file, you can
    start download directly from the main Transmission window by clicking the Add
    button and then navigating to the location of the torrent file on your computer.

    Whenever you download a file using the torrent process, a second window opens.
    The secondary window will be specific to the torrent that you are working with
    and will show you the status of the various components of the download. You can
    stop, or pause torrents individually from the secondary window. Transmission enables
    you to run multiple torrents simultaneously, in which case each download will
    have its own window, in addition to the main Transmission window.


    # Download Files with the Transmission BitTorrent Client


    +   - Click Applications -> Transmission BitTorrent Client.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_203_0.png)


    The Transmission application opens.


    +   - Click Applications -> Firefox Web Browser.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_203_1.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Chapter 8: Communicating over the Internet and Managing Your Schedule


    Navigate and identify a torrent to download.


    Click to initiate the download.


    The download dialog box appears.


    Click OK.


    The torrent download begins.


    Transmission automatically opens the torrent file and starts to download the related
    source files.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_204_0.png)


    # Apply It


    You can create your own torrents for sharing files with others. In fact, the whole
    credo of the peer-to-peer movement is to enable individuals to share files easily,
    benefiting the whole. Transmission makes it possible to create and share torrents.


    To create your torrent for sharing, click Torrent -> New. The New Torrent dialog
    box opens. Select the source for your files. You can use either a directory or
    a specific file. Next, you need to announce that the torrent is available to others.
    You can do this by adding a tracker. Click the Add button and then enter the URL
    where you will announce the torrent''s existence. Normally, this will be one of
    the many torrent directories online. You can add more than one, if you prefer.


    Alternatively, you can make your torrent private. Click the Extras button, and
    the Extras section expands. Click the Private torrent check box if you want to
    restrict access to the torrent. Note that in the Extras section, you can also
    add a comment to your torrent. This is helpful to users and should be be done.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_204_1.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Configure Evolution Email Account


    With the Evolution mail client, you can send and receive email from your Ubuntu
    computer.

    The first time you launch Evolution, you will need to go through the steps in
    the Evolution Setup Assistant to configure the program and add your first account.
    Before you navigate through the assistant, you will need to know the details for
    both your incoming and outgoing mail servers. If you lock this information, you
    can cancel the Setup Assistant and add a new email account later from the Preferences
    menu under Evolution Edit.

    Note that if you have previously used Evolution on another machine or you are
    upgrading from an older version, you will be offered the opportunity to restore
    from a backup on the second page of the Setup Assistant.


    If this is a new setup for you, you can just move on to the next step.

    On the third page of the assistant, you add your personal details and email address.
    The Optional Information on this page lets you designate the account and set up
    the Reply-To information that will appear on your outgoing mail messages.

    On the Receiving page, you will need to select your server type and fill in the
    Configuration fields for the selected server. On the next page, Receiving Options,
    you set the system to check for new mail and the options for your email storage.


    # Configure Evolution Email Account


    +   - Click Applications -> Internet -> Evolution Mail.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_205_0.png)


    The Evolution Setup Assistant opens.

    Note: This will occur only the first time you start Evolution. You should go through
    the steps to set up your first account.


    +   - Click Forward.


    A setup page appears, asking if you want to restore from a backup.


    +   - If you have no such backup, click Forward.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_205_1.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Identity page appears.


    +   4 Type your name.


    +   5 Type your email address.


    +   6 Click Make My Default Account.


    +   7 Click Forward.


