- pgno: 151
  md: '# Using the Calculator


    The default GNOME desktop calculator bundled with a powerful and flexible application
    that enables you to perform common mathematical operations. The calculator provides
    a range of features and can be used either in a basic form or in any of three
    complex modes. The four calculator modes are Basic, Advanced, Financial, and Scientific.


    capability to determine roots and fractions a function that can be used to store
    and recall values. The Financial and Scientific calculators are more advanced
    still and include specially functions, as you may expect from their names. The
    Financial calculator includes options for calculating interest and depreciation.
    The Scientific calculator includes a number of trigonometric functions such as
    sine, cosine, tangent, and logarithms.


    The basic calculator features no option to store values in memory. If you only
    want to add, subtract, multiply, or divide, then this is a fast, simple choice
    with a clean and uncluttered interface.


    After you start the calculator, you can freely change back and forth the various
    modes using the View menu, which appears on the menu bar of each of the calculators.
    The system will remember the mode that you have selected, and the next time the
    calculator is opened, it will appear in the mode last viewed.


    If you want more, you can select one of the other three modes. The Advanced calculator
    provides many of the options that most people need, including the


    # Using the Calculator


    +   1 Click Applications -> Accessories -> Calculator.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_151_0.png)


    The Calculator application appears, by default in the Basic mode.


    +   2 Click the keys to enter the calculation that you want to perform.


    +   3 Click =.


    +   * The result appears in the calculator''s window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_151_1.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Click View.


    +   5 Click the type of calculator that you want to open, as Advanced.


    A confirmation dialog box will appear.


    +   6 Dismiss the dialog box to proceed.


    The Calculator changes to the mode that you selected.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_152_0.png)


    # # Extra


    A full-featured memory function is available in the Advanced, Financial, and Scientific
    calculators. The Basic mode does not include a memory function. Data is stored
    and retrieved from the memory through the keys on the calculator. Sto stores a
    value, Rcl recalls a value, and Ex swaps, or exchanges, values.


    The system supports ten memory slots, where you can store up to ten entries in
    the memory simultaneously. You can select the memory slot to hold the value by
    clicking the Sto button and selecting from the drop-down list that appears.


    If you want memory data to remain visible on the screen, click View -> Memory
    Registers; doing so will cause the contents of the memory slots to remain displayed
    on your screen as you work. Note that the contents of the memory will persist;
    you can close the calculator or restart the computer without fear of losing the
    contents of the memory.


    chapter 6: Using the Included Accessories'
