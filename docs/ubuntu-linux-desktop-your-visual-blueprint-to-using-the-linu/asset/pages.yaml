  img_proc: true
- pgno: 207
  md: '# Configure Evolution Email Account (continued)


    Before you can send and receive email with your Evolution email account, you will
    need to finish the configuration process.


    After configuring your system to receive email, you will need to set up the sending
    options. On the Sending Email page, select your outgoing mail server type and
    add the configuration details to allow Evolution to connect to the server. The
    Security option on this screen allows you to enable encryption or password-controlled
    access to your outgoing mail server. Normally, your server determines these options;
    you cannot control the security options on the server from Evolution.


    If you have more than one account enabled in Evolution, these labels will allow
    you to differentiate between them easily.


    The final step in the Evolution Setup Assistant is the Timezone setting. You can
    use the left mouse button to zoom in on the map and the right mouse button to
    zoom out. Select the appropriate time zone from the drop-down list at the bottom
    of the screen.


    After you finish the setup, the Evolution email account will open. You will again
    need to enter your email account password. The system will attempt to connect
    to your mail server and download your mail. For this, you must be connected to
    the Internet.


    The next page, Account Management, asks you to view this account. Select something
    meaningful, as this


    +   14 Click here and select your outgoing mail server type.


    +   15 Type your outgoing mail server name.


    +   16 Click Forward.


    > Note: Details may vary according to your mail configuration.


    The Account Management page appears.


    +   17 Type a descriptive name for this email account.


    +   18 Click Forward.


    The Timezone page appears.


    +   19 Click here and select your time zone.


    The Setup Assistant displays the final configuration page.


    +   21 Click Apply to finish.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_207_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_207_1.png)'
