- pgno: 208
  md: 'Evolution email client opens and prompts you for your account password.


    22 Type your email password.


    23 Click OK.


    +   - Evolution attempts to connect to your mail account and downloads any mail.


    Note: For this to work, you must be connected to the Internet, and your account
    settings must be correct.


    # Apply It


    You can create automatic signatures or sigfiles on your emails in Evolution. Use
    of standardized automatic signatures — which are sometimes called — adds a professional
    touch to your correspondence.


    Click Edit -> Preferences. In the Evolution Preferences, select the Composer Preferences
    option and then click the Signatures tab. On the Signatures tab, click the Add
    button. The Edit Signature dialog box opens. Give your signature a name and then
    the text that you want to appear in the large text field. Select the drop-down
    list on the left to HTML if you want to have more formatting options. Setting
    the signature to HTML enables you to use styling and insert hyperlinks. Note that
    the formatting, however, will only appear if you send the email in HTML format
    and the recipient can receive it in HTML format. When you are finished, click
    Save and Close.


    To modify an existing signature, select it in the Signatures window and then click
    the Edit button.


    When you create a new email, your signature will appear as an option in the Signature
    drop-down list at right above the message area.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_208_0.png)


