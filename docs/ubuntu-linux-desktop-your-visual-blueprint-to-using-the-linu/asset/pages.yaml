- pgno: 129
  md: '# # Add and Configure a Printer


    Ubuntu provides excellent support for both local and networked printers, enabling
    you to easily detect and add new printers to your system.


    To add a new printer, you first use the Printer Configuration window. If you have
    not set up any printers, the window will be empty. If you have set up a printer,
    it will be shown here. You use this window to access the New Printer window. This
    window lists the possible methods of connection for your device.


    If your printer is connected directly to your machine by the parallel port, you
    click the LPT option. If the printer is connected to one of your machine''s serial
    ports, you select the serial port number. You may modify the connection options
    if the default settings do not work.


    If the printer is located on your network, you will need to click one of the other
    options. For HPjet connections, you input the host name. If you have an IPP printer
    on your network, you select the IPP option and enter the hostname. You can test
    the connection by clicking the Verify button. If you are using the LPD network
    protocol, you select the LPD option and probe the network to find the printers
    automatically. If you have a printer on a Windows network, select the SAMBA option
    and enter the address and authentication.


    # Add and Configure a Printer


    +   1. Click System -> Administration -> Printing.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_129_0.png)


    The Printer Configuration window opens.


    +   2. Click the New drop-down arrow.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_129_1.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Click Printer.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_130_0.png)


    +   - The system searches for printers that need to be installed.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_130_1.png)


    # Extra


    Ubuntu employs the CUPS system for handling print server duties. CUPS stands for
    Common UNIX Printing System, and it is widely considered to be an industry standard.
    One of the areas in which CUPS excels is in the handling of network printers.


    In the Printer Configuration window, click Server -> Settings to view basic and
    advanced server settings. Note that you can configure CUPS to allow a local printer
    connected to your machine to be published to the network and used by other users.


    If you are trying to reach a printer on a network from your machine, not only
    does the printer need to be added to your system, as described here, but you will
    also need to be connected to the network, and the printer needs to be turned on.
    If you have to turn it on and it it does not appear automatically on your list
    of printers, click the Refresh button to refresh the list of printers.


    If you have access to multiple networks, the Server -> Connect option to select
    which network you want to use for print purposes.


    continued'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# # Add and Configure a Printer (continued)


    printer configuration in Ubuntu 8.10 is often automatic, but the system also allows
    you to install drivers where needed.


    After you have set up your connection type, the system will perform a search in
    an attempt to locate the necessary driver automatically. If the driver is found,
    the system will complete the installation and return you to the Print Configuration
    dialog box where your printer will be ready for use. If the system cannot locate
    the driver by itself, you will see a screen that asks you to.


    If you attempt to select the printer from the database, you must first select
    the printer''s manufacturer and then click Forward. On the next screen, you will
    need to identify the specific model. If you want to supply the driver from a disk,
    you will need to point to the system where the file is located. After you have
    located the file, click Open and the system will install the driver. Searching
    for a driver online requires you to identify the model and then search online.
    You must be connected to the Internet for this work.


    The installer will ask you to select the printer by name, search for the driver
    on the Internet, or install a PPD driver from a disk. Choose the method that matches
    your


    After the driver has been identified and installed, the system will ask you to
    give the printer a name and a description.


    # Add and Configure a Printer (continued)


    If the system cannot find and install the new printer, the New Printer window
    will appear.


    +   * Click the connection type that reflects how your printer is connected to
    your computer.

    * Click Forward.


    +   * The application will try again to find a printer on that connection.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The final screen in the New Printer window opens.


