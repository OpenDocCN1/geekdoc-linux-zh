- pgno: 177
  md: '# # Using the F-Spot Photo Manager


    Photo-management software has recently sprung into existence to manage the deluge
    of images from the shift from film to digital cameras. Because high-density flash-based
    media can hold many more photos than a roll of film, more pictures are being taken
    than ever before. Added to the fact that these digital cameras are now incorporated
    into almost all cell phones.


    so that can be retrieved with other pictures according to your own concept of
    how they would be grouped together. Photo managers also include some form of simple
    image manipulation that you can touch up with your pictures.


    A photo manager facilitates the import of pictures from media, enabling you to
    quickly and easily pull photos from your flash card or camera directly into a
    staging area for filing. With a photo manager, you can review your images, determining
    the subject of each picture, and record information that will help you find or
    expand the image later. You can categorize and sort your images


    F-Spot is the photo manager for Ubuntu, and it provides all this functionality.
    When F-Spot launches for the first time, you will see a dialog box for importing
    photos from a folder. This can be on your hard drive, a CD, or a flash device.
    After you select the folder, a scan of it begins. When the scan completes, the
    Main window is shown, and thumbnails of any picture files within the folder and
    subfolders of it are available for categorization and commenting. When you add
    a comment to a photo, make sure that it describes the subject of the photo.


    # Using the F-Spot Photo Manager


    # IMPORT PHOTOS INTO F-SPOT


    +   - Click Applications -> F-Spot Photo Manager.


    The F-Spot manager application appears.


    +   - Click Import.

    If this is the first time you have opened F-Spot, the Import dialog box will automatically
    come up, so you will not need to click it.


    The Import dialog box appears.


    +   - Select Folder.


    Another dialog box appears.


    +   - Navigate to a folder to import photos from and click it.


    +   - Click Open.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_177_0.png)


    164'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Photos are


    searched for and presented as thumbnails.


    +   6 Click Import.


    The import begins.


    +   The images are imported into the F-Spot gallery.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_178_0.png)


    # # Extra


    Tags are a relatively new way to sift through content. Many Web sites use tagging
    to categorize content. Tags are meant to be unstructured by nature and then shown
    as a tag cloud. A tag cloud is usually an alphabetical listing of the available
    tags, with each tag''s font size determined by the number of items that possess
    that tag. Each of the tags in the cloud is a hyperlink, which followed shows a
    second-level tag cloud for each of the first-level selection. This is a more efficient
    way to organize information because not all people conceptualize the hierarchy
    of tags in a similar manner. In fact, many viable hierarchies may exist for a
    given photo. For example, a picture may contain a 1957 Chevy and therefore be
    classified under “cars,” but the same picture may also contain your Uncle Bob
    and thus be classified under “family photos.” If you tag the photo with “cars,”
    “1957,” “Chevy,” “uncle,” “bob,” and “family,” the photo will show up under a
    hierarchy of “cars” and for “family photos.” In fact, the cloud allows more rapid
    traversal to parts of the hierarchy because it shows multiple hierarchy roots
    simultaneously, and at each level.


    continued'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Using the F-Spot Photo Manager (continued)


    F-Spot gives you all the basic photo touch-up capabilities requiring the magic
    of a darkroom. These tools are located in the sidebar and accessed via the Edit
    Image button on the main toolbar.

    You can use the Crop tool to cut out unwanted parts of the picture around the
    edges to highlight the subject and remove distractions from the background. You
    can also use it as a means to re-center the subject matter of the picture.

    The red-eye removal tool endeavors to remove the red glow that is produced by
    a person''s retina as they look into the flash of a camera. Because this produces
    a fairly specific effect on the photo, and the red color is never similar to the
    surrounding eye color, the tool can usually fix this common photographic issue.

    The Adjust Color tool displays a dialog box in which you can adjust the brightness,
    contrast, hue, and saturation, as well as white balance and the exposure of your
    picture.

    The Desaturate button converts a picture to black and white. The Sepia Tone button
    converts the picture to nice-old daguerreotype effect.

    The Straighten helps when the camera was not level when you took your picture.
    This tool can rotate the picture back to level. The Soft-Focus Effect tool is
    very popular for portrait pictures; it causes the photo to be clearly focused,
    while all the periphery is blurred.

    The Auto-Correction button is probably the most powerful of these tools. While
    not perfect, it works well for most pictures and improves pictures under low-lighting
    situations.


    Using the F-Spot Photo Manager (continued)


    # CREATE A NEW TAG


    +   Right-click an existing tag or anywhere in the Tags area of the sidebar.

    Click New Tag.


    The New Tag dialog box appears.


    +   Type in a tag name.

    Click.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The new tag appears in the list.


    # ADD A TAG TO A PHOTO


    +   - Right-click the photo to which you want to add a tag.


    +   - Click Attach Tag.


    +   - Click the tag that you want.


    +   - The tag is added to the image.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_180_0.png)


    # Extra


    Although tagging your pictures makes it easier to find them, there is certain
    data that your camera will put directly into the photo information for you. This
    data is exchangeable image file format (EXIF). EXIF data contains the date and
    time when the picture was taken, the camera make and model with which the photo
    was taken, and the camera''s orientation, aperture size, shutter speed, focal
    length, metering mode, and photo-sensitivity/speed. Some high-end cameras even
    have global positioning system (GPS) capabilities and record the geolocation coordinates
    of where the photo was taken.


    Using the EXIF information, you can locate a picture quickly based on when it
    happened. This is a powerful tool, especially if you have a bunch of pictures
    of places that you have been multiple times. The tags for a given picture in such
    a case might be very similar, but by including date information, you can find
    only the matching pictures relating to a specific date range.'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# # Edit Photos\nw GIMP\n\nGraphic editing is accomplished in the open-source\
    \ world with the GNU Image Manipulation Program, GIMP for short. This is a powerful,\
    \ feature-rich application—so feature rich, in fact, there are more than a few\
    \ books written about it. In this section, you will learn the basics of starting\
    \ up the application, loading an image into it, and using one of the many tools\
    \ from the toolbox on that image.\n\nWhen an image is loaded for editing, it opens\
    \ in a new window that is the work surface. The general sequence of events for\
    \ editing is to select a tool from the toolbox, adjust any parameters in the lower\
    \ pane of the toolbox, and then by drag operations on the work surface, apply\
    \ the tool as needed.\n\nWhen GIMP first launches, it may present you with a tip\
    \ of the day. The fact that even there is a tip of the day should give you a hint\
    \ at all the features packed into this one program. The initial tip is often the\
    \ Welcome tip and can be dismissed after reading. The remaining windows are the\
    \ main window, the toolbox, and the dock window containing various dialog boxes\
    \ as.\n\nThe most frequently used tools are the selection tools. The selection\
    \ tools allow you to specify a region of the image to apply certain tools to.\
    \ For example, if you use the Lasso selection tool and draw an arbitrary boundary,\
    \ you can then apply a tool such as the Area Fill to just that selected area.\n\
    \n![](img/b68319171116e7cb6d71d28d5b12e08c_181_0.png)\n\n# OPEN GIMP\n\n+   -\
    \ Click Applications \rightarrow Graphics \rightarrow GIMP Image Editor.\n\nThe\
    \ GIMP application launches.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_181_1.png)\n\
    \n# OPEN AND EDIT AN IMAGE IN GIMP\n\n+   - Click File \rightarrow Open.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_181_2.png)\n\
    \n![](img/b68319171116e7cb6d71d28d5b12e08c_181_3.png)"
  merge: -1
  img_proc: true
