    ![](img/b68319171116e7cb6d71d28d5b12e08c_128_1.png)


    # Apply It


    A handy tool for monitoring your network activity is the Network Monitor application,
    which you can add to any panel.


    Right-click a panel and select Add to Panel from the menu. The Add to Panel dialog
    box opens. Scroll through the list of items and select the named Network Monitor.
    Click Add and the dialog box will close.


    You will now have a panel visual aid tool to monitor your network connection.
    As data moves in and out of your computer, the small screens on the icon will
    flash. If your connection is dropped, a yellow alert triangle will appear on the
    icon.


    Click once on the monitor, and the Connection Properties dialog box will open,
    displaying a General tab and a Support tab. The General tab shows the connection,
    status, the incoming and outgoing activity, and if applicable to the connection,
    the signal strength. If you have multiple connections, you can switch between
    them by choosing from the Name drop-down list. Click the Support tab to view your
    IP information.'
