    # Extra


    Ubuntu is built on the Debian Linux distribution. Debian was started over 10 years
    ago by Ian Murdock when he was a student at Purdue University. Over the years,
    the project has grown to over 1,000 developers and 20,000 different software packages.
    The base package format and package-management utilities until Ubuntu come from
    Debian. Ubuntu works on improving the consumability of the operating system. That
    effort has primarily focused on assembling a more targeted, consistent set of
    applications that can be bundled with the base OS to make a complete desktop or
    server.


    Although Ubuntu draws from Debian, it adds features as well. Other important differences
    include newer versions of the XWindow Server and the compiler GCC. These differences
    are documented in the release on the Ubuntu Web site.


    The essential thrust of the Ubuntu project is to be more consistently updated,
    patched, and recent than the base Debian distribution and to enhance the system
    and promote it to users. The Ubuntu project is largely supported by Canonical,
    which also provides commercial support services.


