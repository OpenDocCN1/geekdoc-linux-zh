- pgno: 229
  md: '# # Format Characters and Paragraphs


    OpenOffice Writer provides numerous options for formatting both the characters
    in your documents and the paragraphs. By using either the controls on the toolbars
    or on the menus, you can control colors, sizes, spacing, positioning, and many
    other attributes of single characters, words, sentences, or paragraphs.


    By default, your Writer includes a formatting toolbar that contains the most commonly
    used commands. You can apply font styles and colors, and you can change the font
    as well as its size. If you click Format -> Character, a window opens that offers
    a number of other choices for controlling the display of the characters.


    The formatting toolbar also includes options that relate to the styling of whole
    paragraphs, including the choice to align paragraphs to the left, right, center
    or to justify the text. You can also change the line spacing and apply both ordered
    and unordered list styles. Formatting -> Paragraph menu includes a wide variety
    of options related to paragraph styles.


    Immediately after the editing window, you will notice a ruler control. The ruler
    allows you to set margins for individual paragraphs or for the whole page. You
    can also use this to set the set of tabs and spacing.


    In addition to manually setting styles item by item, you can apply changes using
    preset styles, as discussed later in the section "Create a Paragraph Style."


    ![](img/b68319171116e7cb6d71d28d5b12e08c_229_0.png)


    # ## CHANGE THE FONT


    +   - Select the text font you want to modify.


    +   - Click here and choose a new font.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_229_1.png)


    The font changes to your selection.


    # ## CHANGE THE FONT STYLE


    +   - Select the text which you want to apply a style.


    +   - Click the style that you want.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_229_2.png)'
  merge: -1
  img_proc: true
