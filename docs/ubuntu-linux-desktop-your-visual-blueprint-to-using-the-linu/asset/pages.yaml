- pgno: 125
  md: '# # Using the Network Tools


    Ubuntu comes bundled with a number of tools that can help you learn about your
    network connections and diagnose any problems that you may experience.


    The collection of various tools comes in one handy utility called Network Tools.
    In the Network Tools window, you will see eight tabs across the top of the window.
    The first tab is labeled Devices. On this tab, you can find information about
    your network connections, as well as your IP address and information about how
    much data has been moved over the connection. This is extremely useful if you
    are trying to troubleshoot a network connection. You can use the Network Device
    drop-down list to change between your types of network connections.


    The next tab is Ping and is useful in diagnosing problems with your Internet connection
    and determining whether a particular Web site or computer is accessible. On this
    tab, you type the name or the IP address of the Web site or computer that you
    are reaching by ping. The system will try five times to contact the site or the
    computer and display the results of the efforts in the bottom of the window. Information
    will show not only whether the system was able to connect successfully but also
    how long it took each time. You can click Details to see a bit more information
    about the ping test.


    # Using the Network Tools


    +   - Click System -> Administration -> Network Tools.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_125_0.png)


    The Network Tools application opens.


    +   - You can check the information about various network devices.


    +   - Click Ping.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_125_1.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# The Ping tab comes to the front.


    Type the address that you want to test.


    Click Ping.


    The system will attempt to contact the address five times.


    The Ping test results are displayed.


    Click the Whose tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_126_0.png)


    # Extra


    In addition to the Devices and Ping tabs, shown here, and the Whose and Traceroute
    tabs, discussed later in this section, there are other utilities built into the
    Network Tools application.


    The Netstat tab actually holds three functions: Routing Table Information, Active
    Network Services, and Multicast Information. This tab is useful for finding problems
    in network connections and provides insight into both incoming and outgoing connections.
    The Routing Table command helps you find information on how traffic is routed
    through nodes. The Active Network Services tab tells you what network services,
    such as TCP or UDP, are being employed by the system. The Multicast Information
    control displays multicast group memberships for your machine.


    On the Port Scan tab, you can search for open ports on your systems. It will tell
    you the port number, the state, and the service.


    Lookup is a research tool for learning more about an address. Use the drop-down
    list to select the information you want to find.


    Finger is used to find information about a user on a network. You need to know
    both the network name and the username.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_126_1.png)


    continued'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Using the Network Tools (continued)


    The Network Tools utility can help you learn more about Web sites and about your
    connections to them.


    The Whois of the Network Tools window is an easy way to learn more about a Web
    site. Whois information can tell you where a domain is registered, when it expires,
    and even the name of the owner. In some cases you will be able to obtain the contact
    information of the domain owner. When you request information about a site, the
    Network Tools window searches the Whois directory, and if an entry is found, displays
    the results in the main pane of the window. Note that this will only work if you
    are connected to the Internet.


    Another useful tool is the traceroute, which is on the Traceroute tab. You type
    in a domain name or IP address and ask the Network Tools application to trace
    it. The utility will then connect to the address, and as it does, it will show
    you the connections that it has to make its way to the server where the address
    is located. As it makes each connection, the utility will display the time that
    each step takes. This is useful for several purposes. First, if you are having
    a hard time connecting to a specific site, this can tell you where the connection
    is failing. By viewing the time, you can detect where there are delays or a failure.
    Second, a traceroute can tell you where the server is located, including the name
    of and its IP address.


    # Using the Network Tools (continued)


    The Whois tab comes to the front.


    +   6 Enter the domain name that you want to check.


    +   7 Click Whois.


    The application queries the Whois database.


    +   The results of the Whois search are displayed.


    +   8 Click Traceroute.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_127_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_127_1.png)'
  merge: -1
  img_proc: true
