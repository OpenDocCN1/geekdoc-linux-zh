- pgno: 301
  md: '# Understanding the Command Line


    One of the most powerful features in Linux is the ability to access the system
    directly and run commands from a command line. In Ubuntu, the tool you use to
    do this is the Terminal application. Although Terminal is the most powerful way
    to access the desktop, with its graphical interface lets you point and click,
    in Terminal you work by typing with your keyboard. Instructions are typed at the
    command prompt, and the system processes them. Command-line syntax is very particular.
    You must enter the proper commands in the proper syntax for them to work correctly.
    The combination of pure text interface and sometimes arcane syntax causes many
    people to feel some trepidation when they first deal with Terminal. The positive
    fact is to keep in mind that the system is consistently and mechanically logical.
    The Terminal application works by a well-defined set of rules, and if you understand
    those basic rules, you can interact with Terminal safely and efficiently.


    To get started, launch the Terminal application by clicking Applications -> Accessories
    -> Terminal. Below is what a basic Terminal window looks like:


    +   - Username

    - Name of computer

    - Home directory

    - Cursor


    You enter your commands at the command prompt, inside the Terminal window. Many
    of the commands have multiple and sometimes complex options. When you use one
    of the commands for the first time, it is strongly advisable to start by using
    man to read the manual for the command in order to fully understand how to use
    the command.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_301_0.png)


    # Use the Correct Syntax


    The syntax varies with each command. You need to know the exact command to achieve
    the result. Some commands have only one part; others are more complicated. For
    example, if you type at the prompt manual followed by the name of any command,
    the system will display a help manual for that command. The two-part command +
    target structure is very common.


    As many commands, there is a long form and a short form for the manual command.
    The short form of the manual command is sensitive. Typing either manual or man
    will result in the same output. You must remember that Linux is case sensitive.
    You must type the commands exactly as indicated. In other words, Terminal, terminal,
    and TERMINAL are three different words in Linux syntax.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Commands with Options


    Many commands have additional options that can be appended to the base command
    to activate additional features. Options follow the base command with a dash character
    (-). You type a command with an option like `command -option`. For example, the
    `ls` command lists the contents of the current directory. You can also provide
    more information: `-l` shows the list of files with their sizes. Options can be
    grouped together, for example `-lr` which lists them in reverse order with the
    file sizes. You will see options written out, rather than abbreviated, and preceded
    by two dash characters (--); this is simply an alternative way of adding an option
    to a command.


    # Enter Multiple Commands


    You can enter commands one at a time, or you group them all at once. The method
    you pick depends largely on what you are trying to do and how comfortable you
    are with the system. To group more than one command, you type them as follows:
    `command1;command2` if you do not want `command2` to run successfully, type like
    this: `command1&&command2`; on the other hand, if you want `command2` to run if
    `command1` fails, type them as follows: `command1||command2`.


    # Execute Commands with Elevated Privileges


    The `sudo` command is a key command you need to know. By default, Linux uses a
    root account to hold the highest level of privileges and ownership of many key
    files. The root password is locked, and you cannot log as root directly. If you
    want to work with directories or files not owned by your account, you may want
    to run your command with `sudo`. This gives you temporary access to the files
    and programs you run. Note that this command is normally only usable by someone
    with administrator-level access. To use the command, type it as follows: `sudo
    command`. The system prompts you for a password when you use the `sudo` command,
    type your password, not root


    # Get Help


    There are three commands that can be used to get help while inside the Terminal
    window. The commands are `manual`, `info`, and `help`. The `manual` command is
    very helpful if you are just starting; out there are manuals for all commands.
    To call up the manual for a command, simply type `man command`. For example, to
    get help for the manual, type `man man`. Also useful as a starting point is the
    manual for the introduction to command: `man intro`. The `info` command is very
    similar to `man` command; it displays documentation. For most situation, there
    are fewer pages available. The `help` command is always available. Simply type
    `command -h` or `command --help`, and you will see a summary of the command''s
    usage.


    # Reset the Terminal


    If you find yourself inside some screen that you cannot escape to or the screen
    has become so cluttered you simply need to clear the mess and start afresh, you
    can do so. Under the Terminal menu are two useful commands: Reset and Clear. If
    you have lost the cursor and need to recover the command prompt, Choose Reset
    and Clear to reset Terminal and the command screen. Alternatively, you can always
    open a new tab in Terminal window. Each new tab starts with a clear screen and
    a command prompt. As an alternative, if you only want to clear the screen, just
    type `clear` at the command prompt. If you find yourself trapped inside a command
    or a screen which does not seem to be alert, you can also hold down the Ctrl key.
    The combination Ctrl + C gets you out of almost any situation.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# # Understanding Essential File Commands


    Being able to quickly and easily find your way around files and directories in
    your system is one of the essential skills you need to work


    comfortably with the command line. This section discusses getting around the directory
    tree and working with the files you find.


    # ## Creating Files and Directories


    To create new empty file, use the command `touch`, specifying after the name to
    give to the new file. For instance, you would type `touch example.txt` this creates
    a new file in the active directory. To create a new file in a subdirectory, simply
    enter the name of the file in the subdirectory. In this example, the file will
    be created inside the subdirectory named "examples": `touch examples/example.txt`


    If you want to create a new directory, you can do so by the command prompt using
    the command `mkdir`. Type the name that you want the new directory to bear. For
    example: `mkdir mydirectory` creates a new directory named "mydirectory."


    # ## Naming Files and Directories


    Naming files in Linux is easy and flexible, but there are a few key rules that
    must be respected. First, filenames are case sensitive. Second, you must escape
    characters that are not upper or lowercase letters, numbers, periods, hyphens,
    and underscores. The escape character is the backslash (\). Additionally enclose
    a name that uses spaces with quotes to handle the multiple words as a single file.


    One of the advantages of the Linux naming convention is that file extensions are
    optional. However, even though you do not have to add a particular extension to
    the end of a file to get it work, it is very useful to have the information for
    reference. Among the most common extensions are the following:


    | EXTENSION | USED FOR |

    | --- | --- |

    | .txt or .text | Text files |

    | .jpg or .jpeg | A common image format, widely used for photographs |

    | .html | HTML files |

    | .gz | Compressed file archive |

    | .rar | Compressed file archive |

    | .png | Portable network graphics, a commonly used format for graphics |

    | .tif or .tiff | A high-quality image format used for photographs |

    | .gif | A lower-quality graphic image format |'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Moving between Directories


    # Listing the Directory Contents


    If you need to move from one directory to another, you will need to know the name
    of the directory and in some cases, the path. Moving the directory tree, from
    broader to more specific directories, requires you to know the name of the directory.
    Moving up the tree can be done without knowing the name of the parent directories.


    The `ls` command is used to list the contents of a directory. Simply type `ls`,
    and the system will display a list of all the contents of the active directory.
    There are a number of options that can be employed. Among the most useful options
    are:


    | TO DO THIS | TYPE THIS |

    |---|---|n| Move up one directory | `cd ..` |

    | Go to the root directory | `cd /` |

    | Go to your home directory | `cd` or `cd ~` |

    | Move between multiple levels | `cd $the/full/directory/path` |


    | OPTION | DESCRIPTION |

    |---|---|n| -a or --all | Shows all the files, including those normally hidden
    |

    | -d --directory | Reports on the directory itself, not the contents |

    | -k | Shows the file size |

    | -r or --reverse | Prints the list in reverse order |

    | -R or --recursive | Shows the contents of all the subdirectories inside your
    directory |

    | -t or --sort=time | Orders the results by the last changed date |

    | -x or --sort=extension | Shows the results sorted by file extension and then
    by filename |

    | -l or --format=long | Displays the long form of the output, which shows you
    more information about each file, including the owner, the last modified date,
    the size, and the read/write status |


    If you are unsure where you are, type the command `pwd`, which will print on the
    screen the name of the working directory.


    # Learning More about a File


    If you need more information about a file than you can get from the list command,
    there are two commands that can help you. First, the `file` command tells you
    the nature of the file. To use this, type `file filename`. The output in the Terminal
    window will be a description of the file contents—for example, `ASCII` text. This
    may not tell you the contents, but it at least tell you what you need to view
    the file.


    If you want to take a quick peek at the contents, use the `head` command. `head`
    displays the first few lines of data from the file. To use it, type `head filename`.
    You can use the option `-n` to specify how many lines will print. Note also there
    is a parallel to the `head` command—the `tail` command. `tail` works exactly in
    the same fashion, but instead of producing the first few lines, it produces the
    last lines of the file.


    continued'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# # Understanding Essential File Commands (continued)


    The file-related commands outlined in this section enable you to find and manage
    files and directories. Using only basic commands, you can create, copy, and delete
    files. Combine those skills with the ability to locate files and examine their
    contents, and use the tools you need to handle the vast majority of basic file-related
    tasks. Instructions for managing files, particularly large numbers of files, are
    not only faster when executed from the command line, but


    also have the advantage of providing a knowledgeable user with more information.

    Note that virtually every command has at least a few options available to it.
    Understanding the options is one of the keys to getting the most out of the Terminal
    application. Although the information in this section provides a useful starting
    point, use the system documentation and help files to learn the full extent of
    each command.


    # ## Finding Files


    The command prompt provides powerful commands that let you search for, within,
    directories and files. The two most useful commands are find and grep.


    | find | grep |

    | :--- | :--- |

    | find allows you to search across multiple directories to identify files that
    meet the criteria you define. By default, find searches through the directory
    tree beginning where you are in. Alternatively, you can specify a directory to
    be searched by adding the path to the command. There are many options available
    for this command, and as they are a bit complicated in their syntax, you should
    explore this via the man command. Among the most useful options are: | grep is
    a powerful command that enables you to search within files. Using grep, you can
    search through multiple files to find a particular word, phrase, or string of
    numbers. In many Linux help files, you will see the term "pattern" used to mean
    a word, phrase, or a string; grep goes line through files, searching for the string
    you specify, and then prints on the screen only lines that contain the pattern.
    A number of options exist for this command. Among the most useful are: |


    | OPTION | DESCRIPTION |

    | :--- | :--- |

    | -name filename | Searches for a specific file by name |

    | -user username | Finds files owned by a particular user |


    | OPTION | DESCRIPTION |

    | :--- | :--- |

    | -i or --ignore-case | Returns results regardless of the capitalization pattern
    |

    | -n or --line-number | Prints out lines and line numbers where the system finds
    the pattern |

    | -w or --word-regexp | Restricts the results to whole-word matches only |

    | -v or --invert-match | Returns all files that do not match the pattern — the
    inverse of the normal command |'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# # Copying Files and Directories


    Use the `cp` command to copy a file or a directory. You need to specify the name
    of the file that you want to copy and give the copy a name as. A command to copy
    a file "example" would look like this: `cp example copy.file`. As written, this
    creates a copy of the file "example" and leaves it in the same directory as the
    original; the new file will be copy.file will not alter the contents, but if you
    want to preserve the attributes of the original file — for example, the creator,
    group, and permissions — you need to add this command `-p or --preserve`. If you
    specify a name for a file that already exists in the directory, the new file will
    overwrite the old file of the same name. Copying directories works in the same
    fashion with `cp -r`. This copies the directory named original.directory and creates
    a copy of it duplicate.directory. Note that if you want to copy all subdirectories
    and their contents, you must add the option `-R or --recursive`.


    # # Moving Files and Directories


    Moving a file or a directory requires the use of the command `mv`. You must include
    with this command both the name of what you want to move and the target, that
    is, where you want to move it. For example, if a user wanted to move the file
    from the Desktop into the Documents directory, he or she should type `mv file
    ~/Documents`


    Similarly, if you want to move the subdirectory, which is located in the active
    directory, the user would type `mv today tomorrow`. The result will be that the
    directory today is now subdirectory of the directory tomorrow. To move directories
    that are not the user''s active directory requires the user to specify the path
    to the directory.


    Note that you can also use the `mv` command as an easy way to rename files. To
    rename the file yesterday today you would type `mv yesterday today`.


    # # Deleting Files and Directories


    To delete a file or a directory, use the command `rm` del. Then you must specify
    is the name of the file or the directory that you want to delete. To delete the
    file mydoc you type `rm mydoc`. To delete a directory with its contents, use rm
    plus the `-R or --recursive`. You can also use the command `rmdir` to delete directories.
    Type `rmdir` the name of the directory. If that directory contains files, you
    must delete them first, attempting to delete non-empty directories with the `rmdir`
    command results in an error message.


    If you use the command `rm`, the file is removed; it is permanently deleted, and
    there is no command to restore it. A safer way to handle this task is to use the
    command `del`, which will delete the file but will allow you to confirm the action
    before permanent deletion. This provides at least a level of confirmation that
    can help you avoid a costly mistake.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # Understanding Useful System Commands


    Using the Terminal application, you can get a very complete picture of what is
    happening with your system. You can also manage the system''s users and applications
    using just the command prompt. As earlier in the book, you can gain insight into
    system processes, create users, and manage


    applications using a variety of applications bundled with Ubuntu. However, if
    you would like to learn how to do all using just one command prompt, Terminal
    is the answer for you. With powerful direct access to the system via the command
    prompt, you can perform any of the tasks necessary for site maintenance and management.


    # ## Gaining Insight into System Status


    There are a significant number of commands designed to give you insight into the
    functioning of your system. Basically, you can expose every process from the command
    prompt. You have direct access into the system and are in the best position to
    obtain accurate information on all aspects of the system''s operation. Here is
    a list of some of the most commonly commands:


    # ## Working with Users


    Managing users and permissions is an area in which Terminal excels. Although the
    tools discussed in this book make it friendlier and easier to use, it is better
    to obtain information on users and permissions by using the command prompt, particularly
    when you have a large number of users on the system.


    # ## Obtaining User Information


    If you need to obtain information about the users on your system — who they are
    and what they are doing — you can do so using the following commands:


    | COMMAND | FUNCTION |

    | --- | --- |

    | df | Displays the total file system usage. Try it with the option -h to render
    the output into a more easily readable format. |

    | du | Displays the disk usage of the active directory. |

    | free | Displays the amount of free and used memory. |

    | config | Reports on the network usage. |

    | ps | Lists the processes you are running as a user. |

    | top | Displays a more detailed picture of system usage, including processes
    and resources. |

    | uname | With the option -a, prints out complete system data, including your
    kernel information. |

    | lsb-release | With the -option, displays the version information for the Linux
    release you are running. |


    | COMMAND | FUNCTION |

    | --- | --- |

    | whoami | Displays your identity. |

    | who | Displays a list of all users currently logged in the system. |

    | w | Lists which users are currently logged on the system and what they are doing.
    |

    | ps -u username | Lists all the processes used by that particular user. |

    | last | Lists recent activity. Follow this command with a username to find the
    last time the user logged in the system. |'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Creating and Deleting Users


    The traditional manner for adding a new user to a Linux system is to use the command
    `useradd`. However, your Ubuntu system has an additional installed package named
    `adduser`. The `adduser` package enables the use of two very handier commands:
    `adduser` and `deluser`.


    Note that you have to invoke `sudo` to use these commands, as it is a administrator-level
    task. To create a new user with `adduser`, type `sudo adduser username` at the


    prompt. The system automatically assigns an appropriate user ID and group ID,
    creates the default home directory, and sets the initial configuration options
    and permissions.


    Use the command `sudo deluser username` to delete a user from the system. The
    command can also assist you with backing up or removing the user''s account and
    files.


    If `adduser` and `deluser` fail to function properly in your Terminal application,
    use the Synaptic Package Manager to verify the installation of the adduser package.


    # Managing Permissions


    Every file has permissions attached to it. It permits the system who is entitled
    to do what with the file: Can read the file? To write the file? Execute the file?
    The permissions system is largely responsible for Linux reputation as a secure
    computing system. It also means that there will be times when you need to adjust
    the permissions of a file.


    To view a file''s permissions, use the `ls` command with the `-l` option, as discussed
    in the previous section, "Understanding Essential Files.",


    Adjusting file permissions from the prompt means using `chmod`. The syntax for
    this command is a bit complicated, but perfectly logical. To structure this command,
    you must follow this formulation, expressed here in `chmod [user|group] [enable
    or disable] [permission] [filename]` — and expressed in terms of the actual system
    you must use: `chmod [a/o/u] [+-] [rwx]`.


    | OPTION | FUNCTION |

    |---|---|

    | a | Changes the privilege for all |

    | o | Changes the privilege for other users |

    | g | Changes the privilege for members of your group |

    | u | Changes the privilege for yourself |

    | + | Adds permission |

    | - | Deletes permission |

    | r | Permission to read |

    | w | Permission to write |

    | x | Permission to execute |


    Here are two examples: To add permission for yourself to write a named example.txt,
    you would type `chmod u+w example.txt`. If you wanted to inhibit others from reading
    the file example.txt, you would type this: `chmod o-r example.txt`.


    To change permissions on files that are owned by root, prefix the command with
    `sudo`.


    # Installing Packages


    `apt-get` is a powerful suite of commands that support the installation of software
    packages to your Ubuntu. Although an increasing number of users now rely on the
    Synaptic Package Manager to handle software searches, installations, and maintenance,
    the purists still do not prefer `apt-get`.


    The `apt-get` commands are numerous, but together allow you to search for new
    packages, install all dependencies, and thereafter maintain the packages and all
    its supporting files. When the time comes to remove a package you can once again
    turn to `apt-get` to perform that task.


    The syntax is typically expressed as `apt-get task package.name`.


    | TASK | FUNCTION |

    |---|---|

    | install | Installs the package |

    | build-dep | Searches the repositories and builds a list of dependencies that
    need to be installed |

    | remove | Removes the package from the system |

    | purge | Removes from the system package together with all of its configuration
    files |

    | upgrade | Installs an upgrade of a package


    Note that you will need to prefix this command with `sudo`. You should also be
    aware that there are a large number of other options for use with this command;
    therefore you should examine the manual for this command before you begin.'
