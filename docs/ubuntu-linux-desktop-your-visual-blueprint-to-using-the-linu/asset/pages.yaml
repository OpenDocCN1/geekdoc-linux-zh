- pgno: 275
  md: '# Print Slides, Notes, and Handouts


    You can print slides, presentations, notes, and handouts with Impression. The
    application allows you to print all or only part of the presentation and related
    materials.


    Impress gives you two ways to print a quick print button and the Print option
    on the File menu. To perform a quick print, click the Print File Directly on the
    toolbar. The Print dialog box opens, allowing you to set the configuration of
    your print job. Clicking File -> Print opens the Print dialog box.


    In the Print dialog box, you can select the Print and set the print range. You
    can print all of a presentation or certain slides. You can also set the number
    of copies, which is useful if you plan to pass out your presentation as handouts
    to your viewers.


    You can open the Printer Options dialog box from the Print dialog box, which includes
    some additional features. The Printer dialog box allows you to control the printing
    of the notes for the slides and handouts. Also on this dialog box are options
    to help you control the use of ink and paper when you print your presentation.
    Choosing the Fit to Page option will scale your presentation to make sure that
    it fits on the page size.


    Note that you have sent a slide to the printer, you can manage the job using the
    Manage Print Jobs application discussed in Chapter 6.


    # Print Slides, Notes, and Handouts


    +   1 Click the Print File Directly button.


    The Print dialog box opens.


    +   2 Click Options.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_275_0.png)'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'The Printer Options dialog box opens.


    +   3 Click Handouts.


    +   4 Click Notes.


    +   5 Click Fit to Page.


    +   6 Click the ink quality that you want.


    +   7 Click OK.


    You are returned to the Print dialog box.


    +   You can click Properties to change the paper and printer settings.


    +   8 Click OK.


    The document prints.


    # Extra


    With Impress, you can publish your presentation as a set of simple Web pages via
    the HTML Export feature, which you can access by clicking File -> Export and choosing
    the HTML option in the dialog box. This enables you to generate a set of pages,
    each with its own navigation, to traverse through your slides. Also, the default
    HTML Export feature includes an overall set of links to jump to any slide. The
    output is fairly configurable with options during the Export Wizard to pick the
    resolution, image file type, and any transition sounds that you have selected.
    You are also presented with several button styles for the navigation links in
    the Web output.


    Although Impress is probably the most useful, the Export dialog box allows you
    to export your presentation in various other formats, including PDF and even Flash.
    The PDF option is useful when you need to email the presentation to someone who
    does not have an office suite loaded on his machine or to avoid file type incompatibilities.
    The Flash option gives you the convenience of a single file that you can include
    in a Web page or other applications.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_276_0.png)'
  merge: -1
  img_proc: true
- pgno: 277
