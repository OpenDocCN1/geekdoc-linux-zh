    # Extra


    To check external drives such as memory card readers, external disk drives, and
    external CD/DVD drives, you will want to click the Computer option under the Places
    menu. This allows you to see all the file storage volumes connected to your machine,
    even if you are currently not connected to them by the operating system, or in
    other worlds, they are not currently mounted, such as a drive located on the network.


    Linux can read a variety of formats, including FAT, FAT32, NTFS, Ext2, Ext3, and
    Apple HFS. The Ubuntu kernel has built-in support for all USB drives and FireWire
    (IEEE1394) drives as well. Due to the vast array of file systems that Linux supports,
