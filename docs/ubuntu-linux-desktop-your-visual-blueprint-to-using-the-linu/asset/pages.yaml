    Chapter 14, “Using the Command Line,” shows you how to unlock the power of the
    Ubuntu Terminal window.


    # What You Need to Use This Book


    To get the most out of this book, you will need a PC with sufficient memory and
    CPU capacity to install and run Ubuntu Linux. Ubuntu will run better with a 700MHz
    x86 processor or at least 384MB of RAM, and 8GB of disk space. If you want visuals
    to run well, it is recommended that you have a 1.2GHz processor or better and
    a supported graphics card. Your PC should also have a sound card, a microphone
    and speakers, or a headset with a microphone, a CD-R drive, and a connection to
    the Internet.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_14_1.png)


