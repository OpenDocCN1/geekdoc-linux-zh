- pgno: 56
  md: '# Click Trash.


    The deleted folder is now in the Trash folder.


    # RETRIEVE A FILE OR FOLDER FROM THE TRASH


    Drag the folder back to its original location.


    The folder is restored.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_56_0.png)


    # Extra


    After files have been deleted, they are fairly retrievable. This is due to the
    default file system of ext3 that is used on Ubuntu. Ext3 is an extension of the
    ext2 file system that supports the journaling of changes so that the file system
    can be recovered to a consistent state after a system crash. Part of this, however,
    actually destroys some of the data that would be needed to recover files after
    deletion. If you need to retrieve files from an ext3 file system after deletion,
    you will want to look at the Foremost tool (http://foremost.sourceforge.net/),
    which can locate files on a hard drive via a technique called data carving. Data
    carving is a process of reading the data from a disk, in raw form, until the header
    of a file is found. Then the length of the file is deduced and the contents copied
    off to a safe location.


    Of course, the safest way to make sure that you do not lose your files to an inadvertent
    deletion is to back your files up regularly.'
