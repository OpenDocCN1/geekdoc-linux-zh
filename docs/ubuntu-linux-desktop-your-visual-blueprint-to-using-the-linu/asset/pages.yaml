    # Extra


    At the bottom of the left pane of the Synaptic Package Manager, there are five
    buttons. The buttons provide alternative ways to view the large collection of
    packages and can be used to help you screen and locate appropriate packages.


    By default, the Sections button is active when you open the Synaptic Package Manager.
