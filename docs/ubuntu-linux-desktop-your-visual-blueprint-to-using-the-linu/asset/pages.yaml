- pgno: 251
  md: '# # Insert and Delete Columns and Rows


    You can insert or delete columns and rows from your spreadsheets using the commands
    on the Insert menu. The ease of modifying spreadsheets is key to making major
    changes to your layout or data structures.


    The Insert menu contains a number of useful commands. Two of the most frequently
    used are the Rows and Columns options. These commands insert an entire row or
    an entire column wherever you indicate in your spreadsheet.


    To use the commands, you must first select an insertion point for the new row
    or column. That insertion point should be just *after* where you want to insert
    a new column or row because Calc inserts a new column into


    your spreadsheet to the left of the column that you select or above the row that
    you select.


    Rows and columns can also be copied or pasted. To use these options, right-click
    the row or column and then choose Cut or Copy from the menu that appears. To insert
    the cut or copied cells, right-click the row or column in which you want to place
    them and then use the command. The Cut, Copy, and Paste commands can also be accessed
    by right-clicking the row or column, as described here, or by the Edit menu, or
    you use the standard keyboard shortcuts Ctrl + C for copying, Ctrl + X for cutting,
    and Ctrl + V for pasting. You can also click the Cut, Copy, and Paste buttons
    on the toolbar.


    # Insert and Delete Columns and Rows


    # INSERT A COLUMN OR ROW


    +   Click the ID to select the column or row that is right after where you want
    the new one to appear.


    +   Click Insert → Columns or Insert → Rows.


    +   A new column or row is inserted into the spreadsheet, right before the one
    that you selected.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_251_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_251_1.png)


    238'
  merge: -1
  img_proc: true
