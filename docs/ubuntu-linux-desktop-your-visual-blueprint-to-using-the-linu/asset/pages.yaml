    ![](img/b68319171116e7cb6d71d28d5b12e08c_182_3.png)


    # Extra


    Because the widget set that virtually all of GNOME is built on is so ubiquitous
    in GNOME, it is often forgotten that this set of widgets (GTK+) was originally
    developed for the GIMP project. It is a huge coup for a single project to spawn
    such reusable component within the software world, and the developers of the GIMP
    project should be lauded for this amazing accomplishment. GTK+ is so popular and
    successful that it is a cross-platform UI development platform with ports for
    Windows and Mac OS. GTK+ is written in C but has bindings for many languages,
    both compiled and interpreted. GTK incorporates several libraries to enable its
    work. GLib is the nuts and bolts of the internal processing, including the handling
    of structures for data and event-handling mechanisms, as well as multithreading.
    GTK+ also relies on the Pango library for text rendering, including internationalization.
    There is also the Cairo library, which aims to provide a 2D rendering system that
    can display consistent visual representations across all platforms. Finally, there
    are the ATK libraries, which provide hooks for throughout.


    continued


    169'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# # Edit Photos with GIMP (continued)


    if you plan on doing any serious editing within GIMP, you will need to understand
    the concept of layers within your image. Each image in the GIMP is composed of
    one or more layers that "stack" from bottom-to-most. When you are looking at the
    Layers tab of the deck, you can see each of these layers. Within this view, you
    can rearrange the order, change the transparency, and turn on and off different
    layers to the composite view. Careful manipulation of these layers allows the
    graphic artist to separate the details of the image into components so that they
    can be modified independently. The layers can be mixed together using various
    modes that change how pixels combine as they form a composite. A given layer can
    also be translated in any direction to the center as desired.


    Also, layers have an interesting feature called layer masks. This is a mask that
    controls the alpha channel, or how transparent a portion of the image will be.
    When using only layers, you have the choice over how transparent the entire layer
    will be, but by using a mask, you can have parts of a layer be transparent and
    all sorts of cool.


    For example, if you want the edges of an image to fade to black, create a black
    layer with a radial gradient. This will cause the black layer to be gradually
    more opaque as the radius increases, giving that centered effect.


    Edit Photos with GIMP (continued)


    # MAKE A SELECTION


    +   1. With the image open that you want to make a selection in, click the selection
    tool.


    +   2. Click and drag over a portion of the image. A region is selected.


    +   3. Right-click anywhere in the image and adjust the selection.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_183_0.png)


    # APPLY A FILTER


    +   4. Right-click anywhere in the selection and select a filter to apply.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_183_1.png)


    170'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Adjust the filter parameters.


    # Click OK.


    +   - The filter is applied.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_184_0.png)


    # Extra


    GIMP includes a programmable scripting engine to author complex transformations
    of your image. This engine allows you to write scriptlets that are called Script-Fu.
    These scripts allow many of the common types of transformations provided by plug-in
    packs on packages such as Adobe''s Photoshop. Some common effects are adding levels
    to a layer, creating glass effects, and creating complex text logos. There are
    scripted effects that allow you to create an oil painting on your image. There
    are even plug-ins for creating images with rippling or wave effects. There is
    a standard set of scripts included with the default installation of GIMP, and
    additional plug-ins can be found at http://registry.gimp.org/. The scripting engine
    was originally based on SIOD (Scheme in One Defun) but starting with version 2.4
    TinyScheme. Additionally, in recent versions of GIMP, a new scripting capability
    has been included that is called Python-Fu, which allows you to use the full Python
    language from within a image. If you have a repeated task that you want to automate,
    one of these two scripting capabilities will allow you to save a lot of time.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_184_1.png)


    # Chapter 7 Working with Photos and Graphics'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# # Scan Images with the XSane Scanner\n\nAlthough most images are captured\
    \ digitally today, there is still a large cache of memories and information trapped\
    \ in photo prints, negatives, and printed documents. In order to get this information\
    \ digitized, you will need to scan your device. In Linux, you use XSane to access\
    \ and control a scanner device.\n\nWhen you launch XSane, it will scan the system\
    \ for attached scanners. If it does not find one, you may need to configure your\
    \ scanner manually. This should only be the case for older-style, parallel port\
    \ based scanners or scanners with a proprietary interface card.\n\nThe XSane dialog\
    \ box allows you to enter a filename and select a type for the output of the scan.\
    \ The types are essentially all images, as well as PDF. If you have multiple scanners,\
    \ you can select which device to capture from. You may also specify if you only\
    \ want to scan in various bit depths, which offer you a range from full-color\
    \ to black and white. You can also select the DPI, brightness, and contrast for\
    \ the scan. At the bottom of the dialog box are buttons that allow you to adjust\
    \ specifically correct for the image. Below, there is some information on the\
    \ scanned image's size. The information is displayed in an equation format, as\
    \ follows: number of pixels wide X number of pixels per bit. The result size in\
    \ bytes, kilobytes, or megabytes displayed after the equation in parentheses.\n\
    \nAfter XSane has found your scanner, it displays its main window. This window\
    \ has many options, but it provides essentially a one-stop place for scanning\
    \ your images.\n\n# SCAN AN IMAGE\n\n+   Click Applications $\rightarrow$ Graphics\
    \ $\rightarrow$ XSane Scanner.\n\nIf this is the first time you have launched\
    \ XSane, XSane scans your system and locates your scanner.\n\nThe XSane application\
    \ appears.\n\n+   Place the image that you want to scan on your scanner.\n\n+\
    \   Click Acquire Preview.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_185_0.png)\n\
    \n![](img/b68319171116e7cb6d71d28d5b12e08c_185_1.png)"
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Click Scan.

    Scanning begins.


    The item is scanned, and a window showing the scan appears.


    # Extra


    Scanners are complex pieces of equipment that enable you to capture a very high-resolution
    image of printed material. This is done by literally scanning a small camera,
    or set of cameras in today''s scanners, across the surface of the subject. Because
    each picture is a very small, the images all get assembled to produce a much larger
    image. These small images are of a very small area, and at normal capture resolution
    for a small camera. The high resolution of the scanner is accomplished by combining
    the normal picture techniques of very small areas.


    The mechanism itself is very similar to plotter technology in which the camera
    or camera bar is moved slowly across the surface with a bright light that allows
    the camera to capture the image uniformly across the surface.


    Most modern flatbed scanners use cameras that are very similar to those in cellular
    phones or digital cameras. These cameras are actually large arrays of photosensors
    on a chip that can be read out digitally to be stored in memory devices or streamed
    to a computer for further processing.


    continued


    173


    ![](img/b68319171116e7cb6d71d28d5b12e08c_186_0.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# # Scan Images with the XSane Scanner (continued)


    By changing the target of the scan, you can choose how XSane will handle the scan.
    Copy options allow you to specify a printer, the image will be sent directly to
    printing to allow you to turn your scanner/computer/printer into a digital photocopier.
    Using the Multipage option, you can bundle several scans into one file. The types
    of files that allow are TIFF, PostScript, and PDF. The Fax option also allows
    you to scan images and turn your scanner/computer/modem into a digital fax machine.
    Similar to the Multipage option, you can scan multiple images prior to the creation
    of a fax message. By using the Email option, you can create an email and include
    the


    scanned images as attachments. If you just want the files scanned and dropped
    directly to a file, which is especially appropriate for batch scanning with an
    autofeder attachment, you can select the Save option and have the files incremented
    added to the end of the filename that you choose. These options are associated
    with all of these targets under the Setup option in the Preferences menu. One
    thing to be aware of is the file size of your image settings. If the scan resolution
    is too high on a full-page scan, you can create enormous files. Additionally,
    these files may take a very long time to scan and write.


    # Scan Images with the XSane Scanner (continued)


    # CREATE A MULTIPAGE PROJECT


    +   Click the drop-down box and select Multipage.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_187_0.png)


    The Multipage Project window appears.


    +   Click Create Project.


    A new multipage project is created.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_187_1.png)


    174'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Place the first image on your scanner.


    Click Scan.


    An image is added to the multipage project.


    Important! Click the Multipage Project window in order to scan additional pages.


    Place the second image on your scanner.


    Click Scan again.


    A second image is added to the multipage project.


    You can repeat steps 3 to 5 for as many images as you need.


    # REORDER THE IMAGES IN THE PROJECT


    Click one of the images.


    Click either the Move Up or Move Down button.


    The ordering of the pages is changed.


    Click Save Multipage File.


    The project is saved.


    # Extra


    One very popular use for scanning is the conversion of printed text into digital
    text. This requires not only the capability to render the image of the original
    within the computer but to have the computer “read” the text from that image.
    Although computers can do much faster and with more accuracy than humans, this
    is not one of them. The signal processing of the human eye and visual cortex is
    completely unmatched in the computer world. So, whereas reading this page is trivial
    for you, to a computer, this is a very arduous task. Special software is needed
    to read the pixels of the document, determine where the letters are, correct for
    orientation, size variation, and all manner of distortions in order to identify
    a single letter.


    There are several options for optical character recognition (OCR) on Ubuntu, the
    one best integrated with XSane is GOCR (also known as JOCR). This application
    needs to be installed using the following line:


    ```

    sudo apt-get install gocr

    ```


    ![](img/b68319171116e7cb6d71d28d5b12e08c_188_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_188_1.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# # Make VoIP Calls over the Internet with Ekiga Softphone


    You can use the Ekiga Softphone application to make phone calls over the Internet,
    to chat, and to have video conferences. The Softphone application makes it possible
    to call other computers at no charge and can even set up the system to receive
    calls from regular telephones.


    The first time you use Ekiga, you will need to set up your Softphone by following
    the steps in the First Time Configuration Assistant.


    To use Ekiga Softphone, you will need a session initiation protocol (SIP) address.
    An SIP address looks like an email but it is unique and specifically suited to
    the Voice over Internet Protocol (VoIP). If you have an SIP address, enter it
    during the setup. If you do not have


    on third step of the configuration process, you can follow a link to get an Ekiga.net
    SIP account. If you are connected to the Internet, your browser will automatically
    open and take you to the Ekiga.net Web site. Follow the steps to set up your SIP
    account. There is no need to create a SIP account. Make sure that you choose an
    appropriate name, as this is how other SIP users will find you.


    After you have completed the steps in the First Time Configuration Assistant,
    you will be ready to use your Softphone. Note that you must be connected to the
    Internet to use this application. You will also probably use a headset with a
    microphone and earphones to conduct your calls. You will at minimum need microphone,
    speakers, and an audio card.


    # ## Make VoIP Calls over the Internet with Ekiga Softphone


    +   1. Click Applications Internet -> Ekiga Softphone.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_189_0.png)


    The First Time Configuration Assistant appears.


    **Note:** This only appears the first time that you launch the application. Follow
    the steps to set up the application.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_189_1.png)


    +   2. Click Forward.


    +   3. Type your first and last names.


    +   4. Click Forward.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The third page of ten appears, on which you are asked for your SIP account
    details.


    **Note:** If you do not have a SIP account, you will need to get one from Ekiga.
    You can click the Get an Ekiga.net SIP account link to obtain a free account.


    +   5 Type your SIP username.


    +   6 Type your SIP password.


    +   7 Click Forward.


    **Note:** Follow the instructions in the assistant to complete the rest of the
    configuration.


    The Softphone interface appears after you complete the steps in the First Time
    Configuration Assistant.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_190_0.png)


    # Extra


    Although you do not need a video camera to run Ekiga, make calls, or use chat,
    if you have a Webcam installed on your machine, you can use it to make video calls.
    Ekiga uses plug-ins to detect your Webcam, and generally, any camera that is compatible
    with Linux will work with Ekiga.


    To set up a camera, plug it into your machine and run the Configuration Druid,
    which is located under the Ekiga window''s Edit menu. One of the last steps of
    the configuration utility relates to video. It will enable Ekiga to use your Webcam.


    To check the installation, click the Image button on the left side of the Ekiga
    window. If your camera is working properly, you should be able to see the image
    from your camera in the right pane in the Ekiga window.


    To use video during calls, you will need to activate the video support for calls;
    to do, click Edit -> Preferences. In the Ekiga Preferences dialog box, click Video
    Codecs and then check the box Enable Video Support. Click the Close button, and
    you are ready to go.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_190_1.png)


    continued'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# # Make VoIP Calls over the Internet with Ekiga Softphone (continued)


    After your Skype is set up and you have a SIP account, you can begin making calls.
    To other computers require you to know the recipient''s SIP address.


    When you try to make a call to another SIP user on your Softphone, if the user
    is online and accepts the call, the connection will be made, and you can talk
    normally. Note you may have some delay in the line, depending on the quality of
    the connection. Similarly, other SIP users can call you directly using your SIP
    address.


    Note that you can also chat with other users who have SIP addresses. You can do
    so in a separate chat window.


    To call a regular telephone using your Softphone, you must first contract with
    a service provider because these calls incur charges. If you have a contract with
    a provider, enter the details into the Accounts dialog box under the Edit menu.
    After the account is in the system, you can make a call using the regular phone
    number, preceded by 00.\ Receiving calls requires you to rent a telephone number.
    This normally be be from the same company that provides contracts for making VoIP
    calls to a normal phone. The rates for this service can be quite low, depending
    on the country that you select as the basis for the number.


    Make VoIP Calls over the Internet with Ekiga Softphone (continued)


    +   8 Type the SIP address that you want to call.


    +   9 Click the Connect button. The system attempts to connect to the address.


    +   A successful connection will show a confirmation message.


    Note: At this point you should be able to speak to and hear the recipient through
    your microphone and speakers or headset.


    +   10 Click the Chat button.


    A chat window opens.


    +   11 Type your message.


    +   12 Click Send. Your message is sent to the recipient.


    Note: You will see your message in the pane above the text box, and you will also
    see in that pane the responses from the other party.


    +   13 When finished with your conversation, click Hang Up.


    +   14 Click the close button.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_191_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_191_1.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'When the call is over, the system goes into Standby mode.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_192_0.png)


    +   15 Type the number of a normal telephone, preceded by **00**.


    +   16 Click the Connect button.

    The system attempts to contact the telephone using VoIP


    ![](img/b68319171116e7cb6d71d28d5b12e08c_192_1.png)


    # Extra


    VoIP is a useful and cost-saving tool, but it can also eat up your bandwidth.
    If you are on a slower connection or you simply need to limit the amount of bandwidth
    used by Ekiga, you can adjust the settings to optimize the application.


    Click Edit → Preferences to open the Ekiga Preferences dialog box. The Audio Codecs
    options enable you to select which of the codecs the system uses. You can select
    one of the lower bandwidth codecs and disable the higher bandwidth codecs. Note
    that the lower the bandwidth, typically the worse the quality.


    On the Video Codecs tab, you can set a specific limit on the maximum video. Note
    that if you set this too low, the system is unable to comply with the limit, it
    will exceed the limit in order to process the video. You can move the Advanced
    Quality Setting slider control, below the Bandwidth control, to adjust the frame
    rate and picture quality. Higher frame rates and higher quality will require more
    processing power and may be limited by the available bandwidth.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "# # Chat with Friends with Pidgin Internet Messenger\n\nYou can use the Pidgin\
    \ Internet Messenger application to open online chats with your friends. The application\
    \ enables you to have realtime message exchanges using accounts from any of the\
    \ most popular services, including AOL, MSN Messenger, Yahoo Messenger, and many\
    \ more. The first time that you open the application, you will be prompted to\
    \ set up an account. To do so, you can use the Add Account dialog box. When the\
    \ system first tries to connect to your new account, you must be connected to\
    \ the Internet for it to work.\n\nOnce the system is able to connect to your Internet\
    \ Messenger (IM) account, a list of your friends who are online will appear in\
    \ the Pidgin window. Friends that are associated with your account but are not\
    \ hidden from view. Note at the bottom of the window the Pidgin status button,\
    \ which you can use to set a status message for others to see; for example, if\
    \ you do not want to be disturbed, you can set your status to Busy or Away. If\
    \ you remain online but not visible to others, you can select the Invisible option.\
    \ When you are set as Invisible, you can still receive messages, but you will\
    \ appear to be offline to others.\n\nYou can add additional accounts at any time\
    \ by Managing Accounts through the Edit menu.\n\n# Chat with Friends with Pidgin\
    \ Internet Messenger\n\n# SET UP PIGDIN\n\n+   Click Applications $\rightarrow$\
    \ Internet $\rightarrow$ Pidgin Internet Messenger.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_193_0.png)\n\
    \nThe Accounts setup wizard appears.\n\n+   Click Add.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_193_1.png)"
  merge: -1
  img_proc: true
