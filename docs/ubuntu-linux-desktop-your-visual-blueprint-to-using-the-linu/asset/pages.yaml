    # Extra


    The Manage Print Jobs application comes in most handy when print jobs stall out
    due to the printer running out ink or out of paper. In these situations, the printer
    will typically pause the job automatically. Although some printers are pretty
    reliable about restarting the job when the problem is corrected, other printers
    require a little help. Going back to the original application that used to request
    the print job may be an option when the printer''s actions caused a warning dialog
    box to pop up. In these situations, it is best to use the original application
    to manage the print job. However, in many cases, the best way to get the printer
    to resume is through the Manage Print utility. Open it, find the job that has
    been paused by the printer, and right-click and restart the job.


    The application is also useful when a document has failed to print due to a serious
    application error. In those cases, it may be necessary to clear the printer queue.
    To do so, click the document name and cancel the print job.'
