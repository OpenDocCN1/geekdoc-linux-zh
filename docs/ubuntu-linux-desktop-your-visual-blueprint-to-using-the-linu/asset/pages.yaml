- pgno: 123
  md: '# # Configure the Network


    The Network Configuration utility enables you to set up and manage your network
    connections. Ubuntu detects your network connections automatically or with very
    little help from the user. There are times, when you may need to adjust your settings
    or create a new connection; in those cases, the Network Configuration utility
    is there to help.


    Before you access the Network Configuration utility, you will be prompted for
    your administrator''s password. Then you will be able to use the Network Connections
    dialog box to adjust your network settings. The dialog has five tabs: Wired, Network,
    Mobile Broadband, VPN, and DSL. Each of the tabs is intended to assist with


    a different type of connection, so it is possible that all will be relevant to
    your situation. Use the choice that matches the type of connection that you need
    to manage.

    Wired connection tab displays your wired network; likewise, the Wireless tab displays
    all the wireless networks that are available in your area. When you need to make
    changes, the system will prompt you for your keying. You must grant access to
    proceed. Note that in some cases it may prompt several times; you must grant access
    to each prompt.

    The Editing dialog box displays the


    connection''s name and its details. You can use this dialog to adjust your connection
    settings and your security and privileges.


    # Configure the Network


    +   Click System Preferences -> Network Configuration.


    Note: If prompted at any time during the following steps, type your administrator''s
    password.


    The Network Connections dialog box opens.


    +   Click the tab of the type of connection that you want to modify.


    Note: This example shows the Wireless tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_123_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_123_1.png)


    110'
