    +   7 Type a description.


    +   8 Click Apply.


    The new printer appears in the Printer Configuration window.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_132_0.png)


    # Extra


    After a printer is installed on your system, you can access the configuration
    settings for that printer from the Printer Configuration dialog box. Double-click
    the name of the printer that you want to modify. The Printer Properties displays
    all the configuration options for the printer. You can rename or adjust the location
    information without impact on the device. The changes to the URL need to be carefully
    considered, or the device may become unavailable.


    If the printer is connected and turned on, you can use the Test and Maintenance
    options to verify that the device is working properly.


    The Policies tab enables you to specify how the system will react to various conditions,
    such as errors. Access Control gives you a way to control the use of the device
    by other users. Printer Options contains a number of configuration settings that
    relate to basics such as paper size, print quality, and so on. Job Options you
