- pgno: 63
  md: '# Encrypt a File


    To prevent sensitive information from being seen by others if your laptop or machine
    is somehow lost or stolen, you will want to encrypt your files. Fortunately, encrypting
    your files is a fairly straightforward action on Ubuntu.


    Pretty good privacy, also known as PGP, is the default encryption engine for GNOME
    and consequently Ubuntu. PGP is a public-key form of encryption popularized in
    email, although it can be used for encrypting any data. In PGP, the public key
    is bound to an identity, either an individual or organization. In order to send
    something securely to that, you use his or her public key as the key to encrypt
    the data. This public key is a cryptographic key, generated by that entity, and


    distributed via publication to a key server. The entity you are sending information
    to holds the other half of the key, which is known as a private key. This key
    is used to decrypt the information. This type of technique is called asymmetric
    encryption because there are two keys used, one to encrypt and one to decrypt.


    The first thing you must do for encrypt file is to choose a PGP key. If you have
    not created a PGP key yet, refer to Chapter 6. After you have selected the key
    to use, you will be prompted to supply the passphrase for it in order to use the
    private key. When this has been entered, the process continues and finished supplies
    you with a copy of the original file that has been encrypted and has a .gpg extension.


    # Encrypt a File


    # ENCRYPT A FILE


    +   1 Right-click the file to encrypt.

    2 Click Encrypt.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_63_0.png)


    The Choose Recipients dialog box appears.


    +   3 Click the check box next to the key that you want.

