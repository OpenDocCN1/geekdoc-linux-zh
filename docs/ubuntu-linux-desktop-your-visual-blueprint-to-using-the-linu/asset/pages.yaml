- pgno: 43
  md: '# # Understanding the Linux File System


    The Linux file system owes its almost entirely to UNIX operating systems. These
    systems operated under the philosophy that everything was a file. Files and programs
    were course of life, but the metaphor did not stop there; in fact, all manner
    of input/output (I/O) was considered. Consequently, Linux can use file semantics
    for devices such as terminals, sound cards, and video cards. FIFO-in-first-out
    queues, and processes of the running kernel can be accessed using these, well-defined
    operations. With everything being a file, there needed to be a structure for the
    organization of all the items, their given significance to the underlying operating
    system.


    All entries in the Linux file system follow a hierarchy. This hierarchy consists
    of files and directories to constitute a tree structure. The root, or most parent
    directory of the file system, contains all the subdirectories and files together
    so there is a navigable path from any item. Navigating from this root, you can
    locate any file or device.


    Additional storage volumes are not designated as an alternative root directory
    or drive letter; rather, they are "rafted" onto the tree which exists within the
    Linux file system. The way that this is accomplished by mounting


    additional volumes on empty directories in the root file system. These empty directories
    are known as mount points. Once mounted, the contents of the new file volume appear
    as a set of files and directories within the mount point directory.


    The basic organization of the file system breaks down along the lines of that
    which can be shared among systems which versus cannot, and that change frequently
    versus does not. The rationale for the first criteria is that items can be shared
    across the same physical storage, and that should not be shared, and consequently
    are usually stored locally. For example, the directories containing the user''s
    files may be shared across multiple machines within a network by keeping them
    on a remote file server. System configuration files, however, should not be shared,
    and consequently the number of mount points that are necessary to maintain will.
    The rationale for the second criteria is that items which do not change frequently
    will not have the same backup requirements as items that are changed more frequently
    or are completely dynamic. For example, the kernel and bootstrap files change
    less frequently than the items on a user''s desktop.


    # The Root Directory


    | /bin | /dev |

    | The /bin directory contains the essential programs for system operation. It
    contains the programs for attaching additional file systems, inspecting and checking
    the organization of the file structure, viewing the contents of files, and managing
    running processes. | The /dev directory contains all the device file entries.
    These are used to communicate with the system''s hardware.


    | /boot | /etc |

    | The /boot directory contains the kernel and associated files needed by the boot
    loader to allow the system to boot. | The /etc directory contains system-specific
    configuration files. These files direct the operation of the system during booting,
    specify the default configuration of user applications, and specify the settings
    for any services.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # The Root Directory (continued)


    # /home


    The home directory contains all home directories for the users of the system.
    For each user of the system, there is a corresponding subdirectory named the same
    as that user''s login.


    # /root


    /root is the home directory for the superuser. This user is commonly referred
    to in UNIX parlance as *root*. This user''s home directory is not on the /home
    volume during system maintenance, the home directories may not be mounted.


    # /lib


    /lib directory contains the core libraries for the system. The modules for the
    kernel are also included in this directory.


    # /sbin


    /sbin directory contains binaries that are critical for system maintenance and
    booting. This is essentially an extension of /bin, but with more of a slant toward
    system administration.


    # /media


    /media directory is the root for mount points of removable media.


    # /tmp


    /tmp directory is used for temporary files. Although this may sound like a trivial
    role, on a system that considers everything it is anything but trivial. Linux,
    tremendous amounts of temporary files are created, so you need to allocate enough
    space for it as well as speed in the form of a fast access volume.


    # /opt


    /opt directory is for optional applications not included in the distribution of
    the operating system.


    # /proc


    /proc directory contains entries that represent settings in the kernel, devices
    recognized by the kernel, and running processes.


    # Types of Special Files


    # Symbolic Links


    Symbolic links are indirections in the file system. When a program goes to open
    a symbolic link, it will be redirected by the operating system to the file or
    directory that it refers to. When a symbolic link is applied to a directory, the
    navigation into the given directory shows the traversed path instead of the physical
    path.


    # Block and Character Special Files


    Block and character files are used by the operating system to associate drivers
    and kernel-level entities with the file so that programs can open, read, and write
    to them using the semantics for files.


    # Hard Links


    Hard links are essentially a cross-linking in the file system. The same file or
    directory is made to exist in two places in the file system structure. You can
    only do this within one physical volume as both entries refer to the same allocation
    of the disk.


    # Sockets


    Sockets are used for interprocess communication. They do not actually use the
    file system to buffer the information but transfer the data via a buffer in the
    kernel. The file system is merely used as an addressing scheme so that multiple
    processes can open and connect them. The semantics for their use are different
    from files due to this difference in implementation, and they bear more of a resemblance
    to their network counterpart, Internet sockets.


    # FIFO


    Named the first-in-out queue it represents, FIFO is a special type of file that
    stores information written to in the same order that it allows later reading the
    information was received. Unlike a normal file, FIFO will not return the end of
    file or EOF marker until one is written into it. Thus, any reading program will
    sit and wait for more data or the EOF marker is written into the file. Sometimes
    these files are also referred to as *named pipes*.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # Configure Nautilus File Browser Preferences


    You can customize the way that the Nautilus Browser shows the files within the
    file system to your tastes. The browser allows for multiple configuration options.
    These options are all accessed via the File Management dialog box. Each tab in
    the dialog corresponds to a category of preferences that you can choose.


    allows you to navigate in the File Browser like a Web browser versus the more
    traditional double-click metaphor with desktop systems. Also, you can configure
    whether to open files in a new window, in GNOME as spatial mode. The default mode,
    Browser mode, is to be the same as another window but updates its content as you
    browse through the file system.


    The Views tab enables you to change the type of view to either a grid of icons
    or a simple list with columns for different attributes of the files listed. You
    can also change the defaults for the size and layout of the icons in the icon
    view or the size of the icons in the List view.


    The Display tab allows you to change the details next to icons. The attributes
    allowed are the same for icons as they are for the columns in List view, so no
    detail is lost if you are using the icon view. The detail displayed varies depending
    on your zoom level within the File Browser. The format of the date can also be
    specified to your tastes. Formats range from relative terms like "yesterday at
    11:00 AM."


    The Behavior tab enables you to configure how the File Browser handles requests
    for actions. You can set the Browser to open files with actions or double-click.


    # Configure Nautilus File Browser Preferences


    +   1 Click Places.

    2 Click a location to open a folder.


