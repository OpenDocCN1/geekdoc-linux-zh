    # Extra


    Although Palm devices in general have waned in popularity in recent years, they
    have remained strong among Linux users due to the early support within the operating
    system for Palm devices. Linux can also sync with Windows CE/Mobile devices, but
    the support came about later than for Palm devices.


    Add to this fact that Palm is investing in developing its next-generation OS based
    on Linux, and there is the high likelihood that Palm devices will be the choice
    for Linux users for some time to come.


    If you do not want to rely on Evolution for all your PIM needs and want something
