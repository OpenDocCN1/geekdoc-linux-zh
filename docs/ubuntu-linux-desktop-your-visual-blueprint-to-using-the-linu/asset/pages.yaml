  img_proc: true
- pgno: 245
  md: '# # Create a Basic Spreadsheet


    OpenOffice Calc is a powerful and flexible spreadsheet program that lets you create
    and edit spreadsheets and manage financial data. Although you can use Calc for
    handling text or as a basic database, the real strength and flexibility of this
    application lies in the handling of numerical data.


    There are several ways to create a new spreadsheet. When you first launch Calc,
    the application opens with a new spreadsheet in the window. Alternatively, if
    you have closed that spreadsheet or want to create another, you can use the New
    option. Calc also supports a large number of keyboard shortcuts. There is a keyboard
    shortcut for most common tasks, including creating a new spreadsheet. To use the
    shortcut, you press the Ctrl key at the same time you press the letter N.


    The File -> New menu has a variety of other options for creating files. The Spreadsheet
    is the only new document format that uses Calc. The other choices, including Text
    Document, Presentation, Drawing, open other OpenOffice applications. The HTML
    Document, XML Form Document, and Master Document are all document formats that
    you can edit in Writers. The Labels and Business Cards are Writer templates that
    enable you to format a text document in a writer suitable for those types of items.
    The last choice, Templates and Documents, allow you to create a new document or
    spreadsheet based on a template.


    When your spreadsheet is open in the window, you can add or edit the contents
    freely using the tools in Calc. You can save your work at any time.


    # Create a Basic Spreadsheet


    # WHEN OPENING CALC


    +   - Click Applications -> Office -> OpenOffice.org Spreadsheet.


    The Calc application opens, with a new spreadsheet in the window.


    +   - You can enter any information or formulas that you want.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# CALC ALREADY OPEN


    +   1 Click File -> New -> Spreadsheet.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_246_0.png)


    A new spreadsheet appears in the main window.


    +   2 Type any information that you want in the cells.


    +   3 Click the Save button.

    The Save As dialog box appears.


    +   4 Enter a filename.


    +   5 Click Save.


    The changes to the spreadsheet are saved.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_246_1.png)


    # Extra


    The Templates and Documents option under File -> New allows you to create new
    spreadsheets based on existing templates. Templates provide you with standardized
    forms that enable the creation of multiple spreadsheets that share common formatting.
    Templates are most useful for repeated tasks, such as creating an invoice, a weekly
    cash flow report, or a reusable form. Using templates, you can set up formulas,
    cell formatting, headers, footers, and more, thereby making the creation of new
    spreadsheets easier and assuring visual similarity across multiple spreadsheets
    and multiple users.


    When you open the Templates and Documents dialog box, you will see a number of
    directories. Unfortunately, the default Ubuntu distribution does not contain any
    predefined templates for use by Calc; the directories you see in the dialog box
    contain templates for other OpenOffice applications. It is, however, easy to turn
    into a template that can be reused. You can create a new template out of any spreadsheet
    by opening the spreadsheet and then clicking File -> Templates -> Save. You can
    edit existing templates by clicking File -> Templates -> Edit.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_246_2.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Create a Formula


    You can employ the most powerful feature of Calc that is, the creation of automatically
    calculating fields—by inserting formulas into spreadsheet cells. Formulas enable
    you to specify calculations that will be performed automatically based on the
    values that you insert into the cells.


    Calc includes a number of tools that make working with mathematical formulas easy,
    even for those who are not well versed in working with them. The Formula bar,
    located immediately above the cells in a spreadsheet, allows you to directly type
    in a formula, view it, and edit it. To the left of the Formula bar are four additional
    tools: the Cell Reference list, the Function Wizard, the Sum button, and the Insert
    Formula button.


    To create a new formula, click in the cell where you want the result to appear
    and then click the Insert Formula button, or type=. your formula either directly
    in the cell or in the Formula bar. Working in the Formula bar is generally preferred
    because of the size of the bar. After you have finished entering the formula,
    press the Enter key or press the Insert Formula button again.


    The Formula Wizard enables you to insert complex computations with the help of
    a wizard. The wizard includes a large assortment of the commonly used formulas
    for financial, statistical, and scientific calculations. You can add the values
    of cells to formulas by inserting the cell IDs into the formulas; the cell IDs
    are usually visible in the Cell Reference list.


    After a formula has been created, you can click the cell to view and edit the
    formula in the Formula bar.


    # Create a Formula


    +   1 Type the data on which you want to perform a calculation.

    2 Click in the cell where you want the formula results to appear.

    3 Click the Function Wizard button.


    The Function Wizard dialog box appears.


    +   4 Click the function that you want to use.

    5 Click Next.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The next step of the Function Wizard appears.


    +   6 Type the ID of the first cell that you want to include in the calculation.


    +   7 Type the ID of the second cell.


    +   8 Type the ID of any other cells that you want to include in the calculation.


    +   You can use the scrollbar to access as many cells as you need.


    +   9 Click OK.


    +   The formula appears in the Formula bar.


    +   The calculated value appears in the cell that you specified for the result.


    # Extra


    Under the Insert menu is an option called Function List. Choosing this opens a
    pane containing a list of all the functions available to the system. The list
    covers not only basic financial and statistical functions but also a number of
    useful shortcuts and some powerful features.

    The various functions are organized into categories that you can access using
    the drop-down list. Last Used keeps a list of the most recently used functions.
    As names, lists all the functions in alphabetical order. The Database option provides
    a set of formulas that can be used to query database fields. Date & Time is useful
    for performing date- and time-based calculations. Financial is a list of common
    financial functions. Information extracts information relating to the contents
    of a cell. Logical provides Boolean operators. Mathematical is an extensive list
    of mathematical formulas. Array helps extract data into an array. Statistical
    provides a set of operators. Spreadsheet extracts data from one or more cells
    relative to their role in the spreadsheet. Text provides operators to combine
    text and convert numbers to text. Add-in is a list of more exotic operators, many
    associated with programming functions.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Select and Format Spreadsheet Cells


    You can select one or more Calc cells simultaneously, allowing you to look and
    feel of your spreadsheet with ease. To select a single cell, click once in the
    cell. To select multiple cells, click and drag your mouse cursor over as many
    as you need. You can click a row or column to enter the cells in a particular
    spreadsheet, press the Ctrl Key at the same time that you select. Selected cells
    are highlighted, so you can see what is active.


    Calc provides a variety of formatting options, many of them similar to the formatting
    functions provided in Writer. The formatting toolbar, the row of buttons above
    the Formula Bar, contains shortcuts to most of the basic formatting options. By
    clicking these, you can


    control the font type, font size, cell styling, alignment, number formatting,
    borders, shading, and more. For more formatting options, you can use the Format
    Cells dialog box. This dialog box contains a much wider selection of formatting
    choices, all divided into tabs across the top. By using these in dialog box, you
    can control many aspects of cell appearance, and you can also control whether
    the cell is viewable by others and at print.


    Also, under the Format menu are options dedicated to controlling the formatting
    of row, column, sheet, and page. In other words, you can control the appearance
    of individual cells or any of the other primary elements that make up a spreadsheet.


    # Select and Format Spreadsheet Cells


    # USING THE FORMAT CELLS DIALOG BOX


    +   1 Right-click the cells that you want to format.


    Note: In this example, the entire row is selected by right-clicking its ID.


    +   2 Click Format Cells.


    The Format Cells dialog box opens.


    +   3 Click the tab describing what you want to format.


    The tab comes to the front.


    +   4 Make the formatting changes that you need.


    +   In this example, a new background color is selected for the row.


    +   5 Click OK.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_249_0.png)'
  merge: -1
  img_proc: true
- pgno: 250
