- pgno: 161
  md: "# # Manage Passwords and Encryption Keys\n\nYou can use Ubuntu's Passwords\
    \ and Encryption Keys to create and manage both encryption keys and the passwords\
    \ for your system. This application enables you to create and manage PGP and SSH\
    \ keys to keep up with the passwords used by your Ubuntu applications. Readers\
    \ who are familiar with GNOME may recognize this outside Ubuntu, it is known as\
    \ Seahorse. The first time you launch the Passwords and Encryption Keys application,\
    \ you will want to either import your existing keys or create new ones. The starting\
    \ window for the application gives you both.\n\nknown as pretty good privacy,\
    \ is most useful for encrypting email or other files that you send to people.\
    \ The Passwords and Encryption Keys application helps you manage those keys and\
    \ use them easily in your Ubuntu environment.\n\nThe SSH protocol, also called\
    \ secure, is primarily used for gaining secure access to a remote computer. SSH\
    \ provides an alternative to traditional password login schemes but is not supported\
    \ by all systems.\n\nBoth PGP and SSH involve the creation of two keys: a public\
    \ and private key. These keys exist in pairs, and both are necessary, as discussed\
    \ in Chapter 4. Collections of keys are known as keyrings, and as it grows, it\
    \ can require a bit of management.\n\nThe system supports the two most common\
    \ forms of encryption keys: PGP and SSH. The PGP protocol, also\n\n# Manage Passwords\
    \ and Encryption Keys\n\n# CREATE A NEW KEY\n\n+   1 Click Applications $\rightarrow$\
    \ Accessories $\rightarrow$ Passwords and Encryption Keys.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_161_0.png)\n\
    \nThe Passwords and Encryption Keys application appears.\n\n+   2 Click New.\n\
    \n+   You can click Import to import your existing keys.\n\n![](img/b68319171116e7cb6d71d28d5b12e08c_161_1.png)"
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Create a New Key dialog box opens.


    Click the type of key that you want to create.


    Note: This example shows creating a PGP key, but the steps for an SSH key are
    similar.


    Click Continue.


    The New PGP Key dialog box opens.


    Type your name.


    Type your email address.


    Click Create.


    # Extra


    The Advanced Key Options section of the PGP dialog box provides additional choices
    for creating a new key. The Encryption Type field specifies the algorithm that
    will be used to generate your keys. You can select from DSA Elgamal, and RSA.
    The DSA Elgamal option is the suggested choice.


    The Key Strength option is important, as this sets the length of the key. Key
    length is expressed in bits. You can enter any value between 1,024 and 4,096.
    The higher the value, the stronger the encryption. Note, however, the larger the
    value, the longer it can take for keys to be generated and processed. A value
    of at least 2,048 is recommended.


    After creating a key, you can modify its expiration date. During creation, you
    can only specify if it will have an expiration date or if it will never expire.
    When the expiration date is reached, the key will cease to be usable. After the
    expiry date, you will need to generate a new key or extend the expiry of the expired
    key. This field is optional; however, if you want to maintain a stronger privacy
    practice, you should set an expiration date. A good value for this field would
    be six months.


    continued


    ![](img/b68319171116e7cb6d71d28d5b12e08c_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Manage Passwords and Encryption Keys (continued)


    The Manage Passwords and Encryption Keys application can also help you keep track
    of your keys and passwords. Keys created elsewhere can be imported into the system
    just a click, and similarly, the keys you have created, or previously, can be
    exported for use elsewhere.

    The View menu contains a set of filters that make it easier to manage large keyrings.
    Using the choices on that, you can view your keys by expiry, trust, or type of
    validity.

    The Passwords tab plays a distinct but closely related role. It is not concerned
    with your public keys and keyrings, but rather with the passwords used by your
    local applications, such as your Evolution email client. On the Passwords tab,
    you will find a list of all your local


    system passwords. Double-click a password identifier in the list to open a dialog
    box. In the dialog box, you can view details about the password, including the
    application it is related to and the login it is associated with. On the Details
    tab of the dialog box, you can view the technical details associated with it.
    The Applications tab tells you which applications privileges to the password information.
    You can change a password on the Key tab. The password is shown in an obscured
    form, but you can clear that and read the password by clicking Show Password checkbox.

    To back up your keyrings, simply click Key -> Back Up Keyrings in the Passwords
    and Encryption window. You will be prompted to name the archive and select a location
    on your drive to store the information.


    # Manage Passwords and Encryption Keys (continued)


    The Passphrase for New PGP Key dialog box opens.


    +   Type your passphrase.


    +   Confirm your passphrase by entering a second time.


    +   Click OK.


    The Generating Key dialog box will appear as the system creates your key.


    +   After the new key is generated, it will appear in the Passwords and Encryption
    Keys window.


    # CHANGE YOUR PASSWORD


    +   Click the Passwords tab.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_163_0.png)'
  merge: -1
  img_proc: true
