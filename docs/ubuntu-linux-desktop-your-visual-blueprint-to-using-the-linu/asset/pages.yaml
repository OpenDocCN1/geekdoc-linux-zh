- pgno: 145
  md: '# Run the Update Manager


    Ubuntu makes it easy to keep your system up-to-date and secure with the Update
    Manager utility. The Update Manager automatically detects when new updates are
    available and helps you download and install them.


    Then it will automatically install them. You will need to enter your administrator''s
    password to authorize the application to install new updates to your system.


    When you launch the Update Manager, it will automatically check for any outstanding
    updates for your Ubuntu system. For this to work, you must be connected to the
    Internet.


    After the installation process is finished, the Update Manager will show you that
    your system is up-to-date.


    Note that Ubuntu provides you with a visual notification in the event that updates
    are available for your system. The indicator will appear on your taskbar at the
    top right of the screen. Clicking it will cause the Update Manager to launch.


    If any updates are found, the Update Manager will list them and prompt you to
    download and install them. You can click on Description of Update and then learn
    more about an individual update.


    If for any reason you do not want to download a set of updates, you can cancel
    the process by clicking the button and run the Update Manager at a later date.


    If you choose to download the updates, the application will attempt to download
    the various files to your


    ![](img/b68319171116e7cb6d71d28d5b12e08c_145_0.png)


    +   1 Click System -> Update Manager


    +   The Update Manager opens and checks the system status.


    Note: For this to work properly, you need to be connected to the Internet.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_145_1.png)'
