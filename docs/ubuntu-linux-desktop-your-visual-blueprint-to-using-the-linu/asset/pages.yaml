    # Extra


    In the early days of computing, memory was far more scarce a commodity than storage
    on magnetic media. Information was often written to the disk immediately during
    a save operation. As the need for processing speed increased and the cost of memory
    became less expensive, this intimate became became far less common. In order to
    increase performance, the write operations were frequently cached, either by the
    operating system itself or the drive, to allow for writes to be more efficiently
    written to the drive in a block. This caching of writes, however, plays havoc
    when either the machine suddenly is powered off or the media in the drive becomes
    unavailable before the write operation is flushed out to the magnetic media. This
    is why modern systems always require a proper shutdown, whereas older systems
    could simply just shut off. This is especially important with removable media,
    where the write operation is cached, and you can in fact remove the storage medium
    from the system at will. The proper procedure is to unmount the volume before
    removing it from the port.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_62_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_62_1.png)


    # Chapter 3: Managing Files and Folders'
