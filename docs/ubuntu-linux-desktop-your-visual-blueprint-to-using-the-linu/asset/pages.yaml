    You are returned to the Network Connections dialog box.


    Click Close.


    Your network changes are applied.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_124_0.png)


    # Extra


    One of the most anticipated as of the Ubuntu 8.10 release was the promise of improved
    support for 3G. The release has not only delivered on the promise but is widely
    viewed as having exceeded expectations.


    The expanded 3G support in version 8.10 makes Ubuntu usable for notebook computer
    users and others for whom mobile access is issue. Intrepid provides 3G connectivity
    via a variety of options that help you maintain a connection seamlessly. You can
    use the built-in 3g mode, a dongle, your mobile phone, or a Bluetooth connection
    to another device. Jugling various modes of connectivity, fortunately, does not
    involve juggling your configuration; Ubuntu handles all of these options through
    a single interface in the system''s network manager.


    Users will find that the most common hardware is supported out-of-the-box. Simply
    plug in the hardware and the system will auto-detect it and begin searching for
    a connection. The system essentially treats a 3G connection as any other type
    of network connection. All of this can be managed through the tabs in the Network
    Connections dialog box.'
