- pgno: 79
  md: '# Adjust Power Management Settings


    Taking the power settings is essential for laptop installations. If you are using
    a laptop, you can change your power settings using the Power Management Preferences.


    If the machine is inactive for several minutes, it can further reduce power by
    going into a sleep mode, drawing power for keeping the memory refreshed. During
    this, the hard drive and processor shut down and essentially ''wake'' up when
    activity usually only takes a few seconds, and are brought back to the exact point
    at which the machine entered sleep mode. This is a drastic reduction in the power
    consumption, and the laptop can usually run for at least twice its normal battery
    life while in standby - and even as much as four times your normal battery life.
    So, if you are only using your computer intermittently away from power, you can
    dramatically extend your usage by having the computer in sleep mode when inactive.


    The battery life of a laptop can be enhanced by the proper adjustment of these
    settings. Depending on the matter, the backlight of the display can be reduced
    from one to thirds so that the power of the LCD and graphics saves up to a fair
    part of the idle power consumption for laptop. Setting the display to go to sleep
    after a very short amount of inactivity causes practically no loss of function
    but you waste extra battery every time it activates. The default is 40 minutes,
    but commonly used values on laptops can be in the range of 1-5 minutes.


    # Adjust Power Management Settings


    +   1 Click System -> Preferences -> Power Management.

    2 The Power Management Preferences application appears.

    3 Adjust the inactivity interval after which to put the machine to sleep.

    4 Adjust the inactivity interval after which to put the display to sleep.

    5 Click General.

    The General tab appears.

    6 Adjust the actions for the power and suspend buttons according to your preferences.

    7 Click Close.

    Your power settings take effect.


    ![](img/b68319171116e7cb6d71d28d5b12e08c_79_0.png)


    ![](img/b68319171116e7cb6d71d28d5b12e08c_79_1.png)'
