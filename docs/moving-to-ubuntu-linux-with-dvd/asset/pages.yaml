- pgno: 214
  md: '# The Firefox Sidebar


    The Firefox sidebar is a quick way to get to your information, in this case browsing
    history and bookmarks. You can have one or the other at your side by clicking
    View on the menu bar and selecting the Sidebar submenu. One quick way to activate
    the bookmarks sidebar is by pressing <Ctrl+B>. The same keystroke banishes the
    sidebar.


    You may already know that your system keeps a history of Web sites you have visited.
    By default, that history goes back nine days. The amount of history can be set
    by clicking Edit on the menu bar and selecting Preferences. You’ll find the History
    settings under Privacy, just as you did with Cookies.


    To activate the history sidebar, choose it from the View menu (under Sidebar)
    or press <Ctrl+H> and the sidebar appears (see Figure 10-8). The


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_214_0.png)


    Figure 10-8

    The Firefox history sidebar—it’s a jump to the past.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'history sidebar makes searching for a site you visited in the last few days
    easy. At the top of the sidebar, you see a Search field. Just type your search
    key-words in the location bar and press <Enter>. Click any link displayed and
    you are instantly transported to that site.


    # ## Extending Firefox


    Firefox is an excellent browser on many counts, but one of its coolest fea-tures
    is its capacity for adding features and capabilities through a system of extensions.
    Extensions are program enhancements that can dramatically change how you work
    with your browser. This framework of extensions makes Firefox not just a great
    browser, but a superior browser.


    To experience Firefox extensions, click Tools on the menu bar and select Extensions.
    A window appears with a list of the extensions already in your system. On a fresh
    install, there is usually nothing here other than the lan-guage pack. Along the
    bottom of this window is a button labeled Find Updates (see Figure 10-9). This
    feature keeps the extensions you use up-to-date. Next to it is a Get More Extensions
    link, which is where we begin our journey.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_215_0.png)


    **Figure 10−9** The Firefox extensions window not only gives you access to installed
    extensions, but provides a link to many others.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'When you click that link, a new browser opens to the Firefox Add-ons site.
    You can also visit the site directly, without going through the extension dialog,
    by visiting https://addons.mozilla.org/firefox. The Extensions tab is selected
    with some of the latest and most popular extensions front and center. You can
    also search based on categories from blogging to humor, navigation, search tools,
    news reading, and more. Some are extremely useful and designed to make your browsing
    more efficient. Some are just plain silly. Each extension has a description and
    a link to install it. If this is your first visit, click the We Recommend button
    for some great suggestions.


    Let me show you an example by installing a totally silly extension, Anthony Howe''s
    Bork Bork Bork!, an extension that makes your Web pages look as though they were
    written by The Muppet Show’s Swedish Chef. After I click the Install link on the
    extension’s description page, a window appears asking for confirmation before
    installing the extension (see Figure 10-10). There’s also a warning about installing
    malicious software. To continue, click the Install Now button.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_216_0.png)


    Figure 10-10 Installing your extension is just a click away.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Extending Firefox


    That’s it. You must restart Firefox to have the new extensions loaded. Now, when
    I surf to a site, I can right-click the page and select View Bork Text from the
    menu and in a few seconds, my page is translated into something only the Swedish
    Chef could understand (see Figure 10-11).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_217_0.png)


    My silly example aside, there are some must-have extensions. Some of the more
    popular extensions include AdBlock, BugMeNot, ForecastFox, and FoxyTunes. Browse
    the Firefox extensions page, try a few, and come up with your own favorites. Of
    course, not all extensions are on the Firefox site. One of my personal favorites
    is Tab Preview, from Ted’s Mozilla Page (see the Resources section). This handy
    little extension provides a thumbnail view of your tabbed pages when you pause
    your mouse cursor over the tab.


    Firefox extensions are hugely popular and numerous programmers have contributed
    their own. Several sites have also appeared to review and discuss the latest extensions.
    Enter favorite Firefox extensions in your Google search bar and enjoy.'
  merge: -1
