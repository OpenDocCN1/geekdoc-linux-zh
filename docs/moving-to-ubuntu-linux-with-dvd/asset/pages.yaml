  md: '# ## Working with Editors


    I urge you not to let vi frighten you. Get to know it. The likelihood that you
    will ever log on to a modern Linux (or UNIX) system that doesn’t have some form
    of vi installed is virtually nonexistent. That said, if you need more information
    than I’ve given you here, consider the vi tutor. This little tool is distributed
    as part of the vim documentation. It is essentially a text file that tells you
    what to do and how to do it as you read it. To start the tutor, type the following
    command:


    ```

    vimtutor

    ```


    When the tutorial starts, you should see a picture like the one in Figure 21-3.
    The entire tutorial takes between 25 and 30 minutes for most people to complete.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_443_0.png)


    **Figure 21–3** Learning vi or vim from the vimtutor.'
  merge: -1
  img_proc: true
- pgno: 444
  md: "# ## Recovering a vi Session\n\nFrom time to time, you may find yourself trying\
    \ to edit a file, but someone else, maybe you, is already editing it. That session\
    \ may be open or something may have happened to terminate it accidentally. As\
    \ a result, you get a nice, long-winded message along the lines of “swap file\
    \ found” and a whole lot of information on what you can do about it. Here’s a\
    \ shortened version of that message:\n\n```\nE35: ATTENTION  \nFound a swap file\
    \ by the name \"textfiles/.listing1.swp\"  \nowned by: mgagne dated: Sun Dec 28\
    \ 14:43:20 2003  \nfile name: ~mgagne/textfiles/listing1\n```\n\nTo locate these\
    \ files, you can use the famous find command and look for anything with a .swp\
    \ extension. Another and better way is to have vi report on these for you. You\
    \ can check for the existence of swap files by using the -r option, which provides\
    \ you with a little more information than the simple find.\n\n```\nSwap files\
    \ found:  \nIn current directory:  \n1. .linux_companies.swp  \nowned by: mgagne\
    \ dated: Mon Sep 15 14:38:55 2003  \nfile name: ~mgagne/textfiles/linux_companies\
    \  \nmodified: YES  \nuser name: mgagne host name: francois  \nprocess ID: 2266\
    \  \n2. .sas.swp  \nowned by: mgagne dated: Mon Sep 8 09:49:02 2003  \nfile name:\
    \ ~mgagne/textfiles/sas  \nmodified: no  \nuser name: mgagne host name: ultraman\
    \  \nprocess ID: 6340  \nIn directory ~/tmp:  \n-- none --  \nIn directory /var/tmp:\
    \  \n-- none --  \nIn directory /tmp:  \n-- none --\n```"
  merge: -1
  img_proc: true
- pgno: 445
  md: "# # Power vi: Start-Up Options\n\nThe next time you need a reason to use **vi**\
    \ over one of the other editors, consider some of these tricks for getting to\
    \ what you want as quickly as possible.\n\n```\nvi +100 ftl_program.c\n```\n\n\
    This takes you right to line `100` in the file called (in this case) `ftl_program.c`.\
    \ This can be a great timesaver when you are compiling programs and something\
    \ goes wrong, as in the following example:\n\n```\ngcc -O2 -Wall -C -o ftl_program.o\
    \ ftl_program.c\nftl_program.c:100: parse error before `<' \nmake: *** [ftl_program.o]\
    \ Error 1\n```\n\nAnother useful start flag is the same one you use to search\
    \ for text inside a file: the forward slash (`/`). In the next example, I want\
    \ to get back to the same place I was working on in my file. To mark my place,\
    \ I had written my name on a blank line. This **vi** starter gets me right to\
    \ where I was working:\n\n```\nvi +/Marcel ftl_program.c\n```\n\nNote the plus\
    \ sign before the slash.\n\n# ## Other Editor Options\n\ngedit and **vi** (or\
    \ **vim**) represent only two of many, many different editors available to the\
    \ Linux user. Your Ubuntu Linux system comes with a few others. One of my old\
    \ favorites is another nongraphical editor that makes a nice alternative for people\
    \ who, having gotten up close and personal with **vim**, would prefer something\
    \ else. It’s called **Nano** (command name `nano`, an enhanced editor based on\
    \ Pico (in case you are curious). Nano, by the way, stands for Nano’s ANOther\
    \ editor.\n\nYeah, I know."
  merge: -1
  img_proc: true
