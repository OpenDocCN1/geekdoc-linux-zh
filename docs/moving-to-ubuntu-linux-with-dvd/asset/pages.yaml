    f) and your view switches to full screen. Just sit back, watch the show, and listen.
    To leave full screen mode, press `<F>` again or slide your mouse cursor to the
    top of the screen (a Leave Fullscreen button appears).


    At the bottom of the window, you find controls for playing/pausing, previous,
    and next. There''s also a volume control and a slider to position you at any point
    in the track being played. Notice that your single song selection is listed in
    the right pane, the one titled Playlist. One song constitutes a fairly small playlist,
    but you can easily add more songs to the mix. Just click the plus'
