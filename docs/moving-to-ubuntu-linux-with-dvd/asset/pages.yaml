- pgno: 70
  md: '> **Quick Tip** Got a wheel mouse? Then try this tip for changing the icon
    sizes. Hold down <Ctrl> and scroll over the files and folders in your Nautilus
    file browser. The icons increase or decrease in size depending on the direction
    of your scroll.


    Nautilus is flexible, powerful, and definitely worth your time to get to know.
    In fact, it will likely become your most used desktop application. I’m going to
    give the Nautilus File Browser the focus and consideration it deserves in the
    next chapter. For the moment, leave Nautilus where it is and read on as we discuss
