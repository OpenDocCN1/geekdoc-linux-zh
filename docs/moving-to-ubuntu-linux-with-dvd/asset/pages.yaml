    out, click the door and the **Exit** dialog appears offering you a handful of
    choices (see Figure 3-18).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_85_0.png)


    Figure 3–18 The **Exit** dialog provides a lot of options for logging out or shutting
    down your system.


    The first and most obvious choice is to **Log Out**, which returns your system
    to the log on screen I discussed at the beginning of this chapter. You''ve come
    full circle.


    **Switch User** is probably the most interesting option here. This option takes
    you back to a login screen so another user can log in and start using the system,
    but leaves your current session active. To switch back to the first user logged
    in, press <Ctrl+Alt+F7>. To switch to the second user, press <Ctrl+Alt+F8>, and
    so on. Why would you want to use this feature? Because it lets you quickly switch
    from one user''s desktop to another without having to go through all the steps
    of logging out and logging back in. In a busy family, this can be a real time
    saver.


