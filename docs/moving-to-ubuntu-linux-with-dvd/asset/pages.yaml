  md: '# **Chapter**


    # # **2**


    # # **Running and Installing the Ubuntu Live DVD**


    *Included with this book is a full-featured Ubuntu Linux distribution that runs
    entirely from the DVD-ROM drive. That’s right. You can run Linux on your system
    without having to change your system or uninstall Windows. Then, when you are
    ready to make the jump official, the live DVD comes with a friendly installer
    that makes the process virtually painless.*'
  merge: -1
