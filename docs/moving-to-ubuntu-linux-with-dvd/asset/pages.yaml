- pgno: 369
  md: '# Chapter

    19


    # Would You Like to Play a Game? (Very Serious Fun)


    There''s plenty to smile about when it comes to taking a little down time with
    your Ubuntu Linux system. A default GNOME installation comes with a number of
    games, enough to keep you busy for some time. When you do finally decide that
    you need additional entertainment, there are literally hundreds of games waiting
    for you to download.


    Expand your mind with one of the many puzzles. Do a little target practice in
    the arcade. Race down a dizzying mountain slope. Play golf. Sink someone''s battleship.
    Board a space fighter and take on somebody halfway around the world. Play solitaire,
    backgammon, or poker.


    There are tons of games available, and I''m just talking about the ones on your
    distribution disks. Head off to the Internet and you''ll find yourself set for
    weeks, possibly months.


    Sit back, relax, and get ready to enjoy a little fun, Ubuntu Linux style.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Ubuntu Preinstalled Games


    You can find most of these under Games in your top panel''s Application menu.
    In each case, I also give you the command name so that you can either run them
    from the shell or start them with your program launcher <Alt+F2>.


    # AisleRiot Solitaire


    Almost anyone who has held a deck of cards knows about solitaire, a one-person
    card game whose object is to reorder seven piles of cards, drawn at random, into
    four ordered piles, by suit and in numerical order. You may also know it as patience
    (as I did, growing up). There are, in fact, many solitaire or patience card games;
    the most famous and popular is also known as Klondike.


    AisleRiot (command name sol) is more than just Klondike solitaire (see Figure
    19-1). Some eighty different games are included (click the Select Game button
    just below the menu bar), including such favorites as Golf, Clock, Baker''s Dozen,
    and many others.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_370_0.png)


    Figure 19-1 AisleRiot, the classic solitaire game, and more.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'If the cards look too small for your taste, just grab a corner of the main
    window and drag. The card table and cards scale accordingly. You can also click
    View on the menu bar and select Fullscreen (or press <F11>) to hide away any other
    work that might be nagging you in the background.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_371_0.png)


    > *Tip* I only mention it with AisleRiot, but a number of the games included with
    Ubuntu also come with a full-screen mode. In all cases, pressing <F11> switches
    to and from full-screen mode.


    # Ataxx


    Ataxx feels familiar, perhaps because these games, where the object is to conquer
    opposing pieces and change them to your colors, are so common. Still, Ataxx is
    no Othello, and it requires substantially more cunning to win. Here’s how it works.


    When the game starts, there are four pieces on the board, two light and two dark,
    sitting at opposing corners. When you click one of your pieces, your valid moves
    are highlighted by a light-colored piece around your own. Click a square right
    next to one of your pieces and a new piece appears. Click one further away and
    your current piece jumps to that position, hopping over (but not capturing) other
    pieces in the process. If your piece lands next to your opponent’s piece, or pieces,
    all of those pieces adjacent to your piece flip and change to your color (see
    Figure 19-2).


    Are the games starting to feel too easy for you? Click Settings on the menu bar
    and select Preferences to bring up a two-tabbed configuration dialog. Under the
    Players tab, you see an entry for the light player and one for the dark. One,
    or both, can be human players, but if you want to play against the computer, select
    a skill level from either the light or the dark side.


    As with a number of these seemingly simple games, there is far more to it than
    you might initially think. It’s also far more addictive than it looks.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_372_0.png)


    Figure 19–2 Ataxx.


    # Blackjack


    When you play the game for the first time, you may find that it takes a few seconds
    to get started. The program is busy setting things up for you. You see a message,
    Computing Basic Strategy . . . , while a progress bar informs you of this process.


    What does one say to explain a game like Blackjack? After all, it is a classic
    that almost everyone (over a certain age) has played. Here’s the short version,
    in case you are among those who have never heard of the game. The idea is simple.
    The dealer, your computer in this case, deals cards for you and itself. Your job
    is to get as close to 21 without going over, and getting a higher number than
    the dealer. Over 21 is a bust and you automatically lose. Face cards are worth
    10, and Aces can count as either 1 or 11. When the game'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'starts, you find yourself looking at a casino-like table with your cash chips
    at the bottom and the cards dealt to the right of center (see Figure 19-3). That’s
    where all the action takes place.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_373_0.png)


    **Figure 19–3** Blackjack.


    Along the top of the game table, it identifies the game rules as *Vegas Strip*,
    the default. This particular Blackjack program comes with four different sets
    of rules including Atlantic City, Amestar, Vegas Downtown, and Vegas Strip. To
    change to a different set of rules, click Settings on the menu bar and select
    Preferences. The configuration dialog lets you change rules and lists the differences
    in those rules. You can also choose to display the hand probabilities, adjust
    the delay in dealing, and whether or not you take insurance on a hand.'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'As anyone who has played this game can tell you, there''s more to it than the
    luck of the draw. While you are busy learning the skills of the game, you can
    click the Hint button (under the menu bar) at any time to obtain a suggestion
    from the computer.


    # Five or More


    The idea is simple, line up five or more marbles of the same color: When you do,
    those marbles disappear and you are rewarded with points. The more marbles you
    can line up and make disappear, the higher your score. Simple, huh? Let me throw
    you a few wrinkles.


    The game starts with a few marbles randomly positioned on the game grid. Click
    a marble, then click another square to move that marble. You can move as far away
    as you want and in any direction, but you must have a clear path to do so. It
    doesn''t even have to be a straight line. In the top right, directly below the
    menu bar, the program shows you what marbles the computer is about to drop (see
    Figure 19-4). If you can line up five marbles, you claim an extra turn before
    the program drops its next batch.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_374_0.png)


    Figure 19-4  Five or More.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Now, I did say “marbles,” but perhaps I should have said “objects.” Five or
    More is themeable. Click Settings on the menu bar and select Preferences. The
    image theme is fairly limited out-of-the-box, but it is possible to create other
    themes (check the game’s Help for details). Your options are colored balls or
    shapes, different board colors, and different board sizes.


    # Four-in-a-Row


    You’ve almost certainly played this one as a kid. Back then you probably knew
    it as Connect Four, a game sold by Milton Bradley. The object is to get four of
    your colored discs in a row while your opponent tries to do the same. Part of
    the strategy comes from trying to make sure your opponent is stopped from creating
    a row of four.


    If you have never played, you’ll catch on quickly. Drop your colored disc down
    any row and try to line up four of the same color. This can be a horizontal, vertical,
    or diagonal row. Whoever gets his four in a row first, wins (see Figure 19-5).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_375_0.png)'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'The game’s Settings menu lets you select different themes including balls,
    glass marbles, blocks, and so on. You can also decide the computer player’s skill
    level.


    # ## FreeCell Patience


    FreeCell is just another entry point into the AisleRiot game pack, which I described
    earlier, so everything I said there applies here. What makes this worth mentioning
    is how the game is started. If you check the processes and look for the program
    name sol, you’ll see how it’s possible to start AisleRiot on a particular game.


    ```

    ```

    /usr/games/sol --variation freeCell

    ```

    ```


    You can use this information to create a quick-start icon on your desktop (discussed
    in Chapter 5) so that you always start with your favorite solitaire game.


    # ## Gnometr


    One of the most enduring games of my arcade-playing younger years was something
    called Tetris. The concept was simple. Colored geometric patterns fall from above,
    and as they fall, you rotate the pieces so that they fit (like a jigsaw puzzle)
    into the bottom row. Fill a row and the pieces disappear. Miss too many of the
    pieces and the top crushes the bottom—you lose. Your Ubuntu Linux system comes
    with a variation called GnomeTris (command name gnometr). If you remember Tetris,
    you’ll find GnomeTris an excellent clone (see Figure 19-6).


    # ## Iagno


    This is another classic game that you probably know as Othello (some also call
    it Reversi). This is a two-player game where you lay down two-sided discs (white
    on one side and black on the other) in an effort to control the board (see Figure
    19-7). You start out with two white discs and two black in the center of the board.
    One by one, players put down additional discs. If you trap an opponent’s disc
    between two of your color, you flip the disc to your color. In the situation where
    there is more than one of your opponent’s discs between your two pieces, all of
    the pieces you have trapped are flipped to your color.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# Ubuntu Preinstalled Games


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_377_0.png)


    To play against the computer, make sure you click Settings, then Preferences,
    and assign a play level to the computer opponent (by selecting either the light
    or dark side).


    This is a great version of the classic game. Still, I think that one of my favorite
    things about this particular incarnation of Reversi (or Othello) is the author''s
    explanation of why the game is called Iagno and not something else. This is in
    Section 1.2 of the Iagno manual (click Help on the Iagno menu bar and select Contents).'
