    If you like the new look you have created, it’s time to save it. Click the Save
    Theme button and a dialog appears asking you for a theme name and a short description.
    Click the Save button and your new theme will be part of the list.


    To go back to the system default, either choose Human from the list or click the
    Revert button.'
  merge: -1
