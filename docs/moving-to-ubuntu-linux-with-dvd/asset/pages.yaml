    # The Winmodem/Linmodem Roundup


    Clearly, none of this whole Winmodem problem applies if you are using an external
    modem or happen to be among the lucky ones using a cable modem connection or high-speed
    DSL access from your local phone company. For others out there, it can be a bit
    more complicated. I’ve already given you the address of the Conexant Web site,
    and I will give you more right here.


    Remember, *many of these modems* can be made into useful and productive members
    of Linux society with a visit to the right Web site. On that note, here’s my roundup:


    +   - **Conexant Modems (HCF and HSF)**

