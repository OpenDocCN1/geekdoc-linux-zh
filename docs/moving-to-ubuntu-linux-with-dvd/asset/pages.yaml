    as folder icons. Depending on how Nautilus is configured, images in your folders
    may appear as little thumbnails. Would you like to see the full-sized image? Just
    click the thumbnail, and Nautilus calls the right application to do the rest.


    > Quick Tip I''ve made the icons large, which makes the thumbnail images easy
    to view. To change the icon size, click View on the menu bar, then select Zoom
    In until the icons are the size you prefer. Just what is the menu bar? Read on.'
