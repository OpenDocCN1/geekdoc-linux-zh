  md: '# ## Armagetron


    Remember the 1982 Disney movie called *Tron?* Inside the computer, programs engaged
    in gladiatorial battles, fighting for their users. One of the deadly sports in
    this virtual world was a *lightcycle* race. Contestants rode a kind of motorcycle
    that left a wall of light in its wake. The cycles themselves can’t stop. The only
