    # ## Put Another Nickle In...


    Ripping songs from your CDs and storing them on your PC so you can listen while
    you work (or play) is fantastic. Double-click Start up Totem, pull in a few songs
    into your playlist, and enjoy the music. Life couldn’t be any better. Except...


    You see, all this collecting of music—ripping songs, building huge libraries of
    MP3s or OGGs on your computer’s hard disk—is eventually going to become a nightmare
    to administer. Sure, all those CDs in jewel cases have disappeared into that virtual
    space that is your hard disk, but now you have all these songs in a number of
    large folders with little or no organization. If you want to play something, you
    have to go searching. What you need is a juke-box.


    In a much earlier part of my life, I used to make extra money babysitting some
    of my parents’ friends’ children. One of their friends repaired jukeboxes for
    a living. Consequently, a real honest-to-be-goodness jukebox was always in the
    house, full of 45 RPM singles. From time to time, the model and type of machine
    would change, but with the coin mechanism disabled, I had all the music I wanted
    available. Now, that’s entertainment! As luck would have it, your Ubuntu Linux
    system comes with a very fine jukebox program called *Rhythmbox* and you won’t
    have to babysit anybody’s kids to use it.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Rhythmbox


    You’ll find Rhythmbox (command name, `rhythmbox`) by clicking Applications on
    the top panel, then selecting Rhythmbox Music Player from the Sound & Video submenu.
    This program integrates nicely into the GNOME desktop, with a notification area
    icon to drop the application out of sight quickly. It includes support for your
    MP3 and Ogg Vorbis files, collection and playlist management, tag editing, and
    much more.


    On first start, a Rhythmbox configuration assistant appears to take you through
    some basic configuration steps. The first of these screens is an introduction,
    so just click Forward and Rhythmbox asks for folders where music is kept (see
    Figure 18-21). Enter this information manually or click the Browse button to bring
    up the GNOME file selector, from which you can choose the locations of music on
    your system. In my case, I have a separate partition called `/mnt/music` where
    I keep all my music.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_363_0.png)


    Figure 18-21 Start by adding the names of folders you want Rhythmbox to keep track
    of.'
  merge: -1
  img_proc: true
