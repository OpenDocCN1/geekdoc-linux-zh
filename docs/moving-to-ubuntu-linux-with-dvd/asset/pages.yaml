- pgno: 111
  md: '# # Chapter 5

    ## Customizing Your Desktop (or Making Your World Your Own)


    After having taken the first steps into the Linux world, you are probably thinking,
    “Hey, this is pretty easy,” and “I wonder what the fuss was all about.” For what
    it''s worth, I''m thinking the very same thing. Now that the fear of dealing with
    a new operating system is gone, it''s time to get really comfortable.


    In this chapter, I''m going to show you how to make your system truly your own.
    I''ll show you how to change your background, your colors, your fonts, and anything
    else you need to create a desktop as individual as you are. Would you like some
    icons on your desktop? Perhaps some shortcuts to programs you use on a regular
    basis? No problem. I''ll cover all those things, too.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# I Am Sovereign of All I Survey ...


    As I''ve already mentioned, working in the Linux world is working in a *multiuser*
    world. This means that everyone who uses your computer can have his or her own
    unique environment. Any changes you make to your desktop while you are logged
    in as yourself will have no effect on little Sarah when she logs in to play her
    video games. If she happens to delete all the icons on her desktop or change everything
    to a garish purple and pink, it won''t affect you, either.


    Let''s start with something simple. The first thing most people want to change
    is their background. It''s sort of like moving into a new house or apartment.
    The wallpaper (or paint) that someone else chose rarely fits your idea of décor.
    The same goes for your computer''s desktop. Let''s get you something more to your
    liking.


    # Changing the Background


    Start by right-clicking somewhere on the desktop. From the menu that appears,
    choose Change Desktop Background and the Desktop Background Preferences dialog
    appears (see Figure 5-1). You can also access the Desktop Background dialog from
    the System menu in the top panel under Preferences. Look for the item labeled
    Desktop Background.


    The top half of the dialog displays a list of desktop wallpapers available to
    the system. The default list available with Ubuntu is rather small, basically
    a choice between no wallpaper and two different resolutions of the same background.
    I''ll tell you how to add more in a moment, but for now I want you to click the
    No Wallpaper setting. Notice that the change to your background is immediate.
    No need to click OK or Apply here.


    Directly below the Desktop Wallpaper area, there''s an area labeled *Style*. There
    is a drop-down list here with *Fill Screen* selected as the default. This tells
    the system how to treat the image you select. Some images are only small graphic
    *tiles*, designed to be copied over and over until they fill your screen. For
    these, you change the mode to Tiled. If the image you are using is a bit small
    for your screen but you want it as your background anyway, choose Centred and
    it will sit in the center surrounded by whatever background color you choose.
    If you just want the image to fill your screen and you don''t care what it looks
    like, go for *Scaled*. Play. Experiment. These are *your* walls.'
  merge: -1
  img_proc: true
