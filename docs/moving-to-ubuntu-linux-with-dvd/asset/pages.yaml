  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_93_0.png)


    **Figure 4-4** The Nautilus file browser''s main navigation toolbar.


    > **Tip**

    > When you look at your home folder using Nautilus, there are more files and folders
    than you actually see. So-called hidden files (those prefixed by a dot) aren''t
    shown in the default view. Star Trek fans can think of it as a cloaking device
    for files. To see all files, including hidden files, click *View* from the menu
    bar and select *Show Hidden Files*. Keyboard jockeys can just press <Ctrl+H> to
    cycle back and forth between the views.


    Sometimes, the quickest way to navigate your file system (assuming you know the
    folder you want to be in) is simply to type it in the location bar. Looking at
    Nautilus, you might be wondering where this location bar is. Click *Go* on the
    menu bar, then select *Location* (or press <Ctrl+L>). An empty field labeled *Go
    To* appears just below the navigation toolbar (see Figure 4-5). From here, you
