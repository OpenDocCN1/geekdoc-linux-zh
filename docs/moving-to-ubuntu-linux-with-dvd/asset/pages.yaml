    # ## Playing Your Songs


    This is the easy part. Start up Nautilus and navigate to a folder where your songs
    are located. If you are looking for a specific song, do a search on it (as described
    in Chapter 4). In Figure 18-9, you can see that I''ve done a search on songs with
    the word Woman, ending with an `.mp3` extension.


    If you pause over the music file with your mouse cursor, the file starts to play
    and continues playing as long as your cursor sits there. Not very practical for
    listening but a great way to make sure this is indeed the song you are looking
    for. To play it and get back to work at the same time, double-click the song file.
    The Totem media player appears and your music plays (see Figure 18-10).


    Aside from the fact that you can now listen to your track of choice, you have
    also been introduced to the all-purpose Totem media player. You might also have
    noticed that while you were listening, Totem was running a pretty cool little
    light show over in the left pane. It''s kind of hard to visualize from the image
