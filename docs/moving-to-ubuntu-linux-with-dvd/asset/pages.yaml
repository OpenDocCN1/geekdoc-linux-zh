    # ### Navigating Networks


    When I was telling you about history and bookmarks, I casually tossed out the
    idea that you could use Nautilus to visit FTP sites and other network locations,
    including Windows shares, WebDAV servers, and more. To establish a network connection,
    click **File** on the Nautilus menu bar and select **Connect to Server**. A connection
    dialog appears, from which you can establish your connection (see Figure 4-10).


    Next to the **Service Type** label, there is a drop-down box from which you can
    select the type of server. Your options are SSH, Public FTP, FTP (with login),
    Windows share, WebDAV, secure WebDAV, and custom location. For this example, let’s
    choose the public FTP server, one with an anonymous login. In the **Server** field,
    enter the name of the server you are trying to connect to (for example, ftp.ubuntu1inux.org).
    That’s really all you need to do. Click **Connect** and Nautilus opens that network
    folder (see Figure 4-11). Navigation of that remote folder is the same as it would
    be on your own system.'
