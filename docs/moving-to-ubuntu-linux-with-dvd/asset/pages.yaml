- pgno: 151
  md: 'The sheer number of USB devices available is phenomenal, to say the least,
    and the list is growing. Many of these devices use a standard set of drivers,
    which means that a number of things can literally be plugged in and used--no need
    to mess with loading drivers because it is all being done for you.


    You noticed the word *many* in that last sentence, right? Keeping track of what
    works (*and what doesn''t*) and providing access to drivers that aren''t included
    in current distributions is the *raison d''être* of the Linux USB Device Overview
    Web site. If you find yourself looking at a new webcam, and you aren''t sure whether
    it is supported under Linux, look there first:


    ```

    http://www.gbiz.ch/usb/devices/

    ```


    The site is organized into sections, depending on the device type (audio, video,
    mass storage, and so on). Each device is assigned a status identifying just how
    well a device is supported, from *works perfectly* to *works somewhat* to *don''t
    bother*.


    # ## Modems versus Winmodems


    Well, here''s something scary. . .


    Way back when, in the introductory chapter, I mentioned Winmodems as one of the
    few *minususes* of running Linux. You''ll recall that a Winmodem is a modem designed
    to work only with Windows. They are sometimes referred to as *software* or *controllerless*
    modems and tend to be less expensive than controller-based modems.


    If you are running a Winmodem, all is not lost. The Linux community is nothing
    if not resourceful. Even when manufacturers are slow to notice Linux users, the
    same isn''t true the other way around. As more and more people run Linux, this
    becomes less and less of a problem. In time, hardware manufacturers may be building
    for Linux first and Windows second. In the meantime, check out the *Linmodems.Org*
    Web site at http://www.limodems.org and you should be up and running shortly.


    So just how do you transform a Winmodem into a Linmodem? Well, let me give you
    an example.


    Among the more common Winmodems out there are those based on the Conexant chipset;
    these are starting to be very well supported. For the latest driver, just head
    on over to Linuxant''s Web site (not related to Conexant) at'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'http://www.linuxant.com. Not only can you get source drivers, but pre-compiled
    packages are available for a number of popular Linux distributions.


    Identifying the Winmodem is your first step. You can use the GNOME device manager
    to browser through your PCI hardware, where you will get a lot of detail. You
    can also `shell out` and use the `lspci` command for a quick list of all the PCI
    devices found on your system. Here’s what it looks like:


    ```

    $ lspci

    00:00.0 Host bridge: VIA Technologies, Inc. VT8367 [KT266] [0106:0c57]

    00:01.0 PCI bridge: VIA Technologies, Inc. VT8367 [KT266 AGP]

    00:06.0 Communication controller: Conexant HSF 56k Data/Fax/Voice/Spkp (w/Handset)
    Modem (World@ SmartDAa) (rev 01)

    00:08.0 Ethernet controller: Realtek Semiconductor Co., Ltd. RTL-8139/8139C (rev
    10)

    00:11.0 ISA bridge: VIA Technologies, Inc. VT8233 PCI to ISA Bridge

    00:11.1 IDE interface: VIA Technologies, Inc. Bus Master IDE (rev 06)

    00:11.2 USB Controller: VIA Technologies, Inc. USB (rev 18)

    00:11.5 Multimedia audio controller: VIA Technologies, Inc. VT8233 AC97 Audio
    Controller (rev 10)

    01:00.0 VGA compatible controller: nVidia Corporation NV11 [GeForce2 MX DDR] (rev
    b2)

    ```


    In some cases, you will find precompiled driver packages. Some are specific to
    your release, and others are generic. In the case of my Conexant-based Winmodem,
    the site provides a generic installer that should detect your system and install
    itself accordingly.


    As per the instructions that followed the install, I typed the following command:


    ```

    /usr/sbin/hsfconfig

    ```


    A short dialog followed, asking me for the country (Canada, in my case), after
    which the program compiled and installed my driver for me. It even linked the
    newly created device, /dev/ttySHSF0, to /dev/modem. I was ready to use my modem
    without a care.'
  merge: -1
  img_proc: true
