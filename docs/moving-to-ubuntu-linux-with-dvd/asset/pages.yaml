    and the panel drops out of sight when you move the mouse away. If, like me,

    you don''t like the whole disappearing panel thing but you do, from time to

    time, want to quickly banish it, click the Show Hide Buttons check box. But-

    tons with arrows appear at each end of the panel. Click the arrow and the

    panel vanishes out off to the side.'
