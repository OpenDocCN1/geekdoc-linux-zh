- pgno: 63
  md: '# # Chapter 3

    Getting Your Hands Dirty (Desktop Overview)


    Welcome to the multiuser, multitasking, multieverything world. Linux is designed
    to run multiple users and processes concurrently. This means your system is capable
    of doing many things, even while it appears to be idle. This is the reason so
    many businesses and organizations use Linux as a Web server, email server, file
    server, print server... well, you get the idea.


    From the perspective of the individual user, this means that all users in your
    family (or office) can have desktop environments that are truly theirs and theirs
    alone. Your desktop can be configured and modified to let you work the way you
    want, with different backgrounds, icons, colors, or themes, depending on your
    mood. It also protects your personal information from others, meaning that the
    kids can totally change their desktops and reorganize things but you won''t be
    in any way affected when you log in.


    I''ll have you logging in very shortly, but for the moment, I want to say a few
    words about your new desktop.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Getting to Know You . . . GNOME


    Linux is extremely flexible. Linux makes it possible to run in a number of different
    desktop environments. The plus side of this is that you decide how you want to
    work. Your system works the way you want it to and not the other way around. The
    down side is exactly the same. Let''s face it, being told what to do is often
    easier, even if it means getting used to working in a way that you may not particularly
    like at first—not necessarily better, but easier.


    On that note, at some time when you''ve gotten comfortable with your Linux system
    running the GNOME desktop, you may want to try one of the other graphical desktop
    environments that are available to Linux users. You may have already heard of
    the K Desktop Environment (KDE) desktop. Between it and GNOME, you''ve got the
    two most popular desktop environments in the Linux world. There''s another version
    of Ubuntu called Kubuntu that uses the KDE desktop by default; in Chapter 20,
    I''ll show you how to add the Kubuntu desktop to your Ubuntu Linux system. The
    beauty of this is that you can then flip back and forth between the different
    desktop environments. Why would you want to do this? Simply, you may find yourself
    totally taken with a different way of doing things. All your programs will still
    work as they did, but the feel of your desktop—the experience, if you prefer—will
    be all yours. For now, we''ll stick to GNOME.


    > Note I''ve covered the KDE desktop in detail in some of my other books including
    the latest version of Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # A Few Words About X


    After I start showing you around your desktop, what I am telling you now will
    fade into the background of your memory, but I still think you should know: GNOME,
    that great-looking desktop system, is the friendly face that rides above your
    Linux system''s real graphical engine. That engine is called the X window system,
    or simply X. GNOME, your desktop environment, provides control of windows, borders,
    decorations, colors, icons, and so on.


    When you installed your system, you went through a graphical desktop configuration
    step of some kind. That wasn''t GNOME, but X.


    X is what the desktop—and every graphical program you run—really runs on. Let''s
    log in and see what the excitement on the desktop is all about.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ## Logging In


    Your workstation will boot up to a graphical login screen known as a *login manager*.
    More specifically in this case, it is the *GNOME Display Manager*, or GDM (see
    Figure 3-1). Near the center of the screen, there is a box labeled Username. Entering
    this information changes the label to Password. Remember that both the username
    and the accompanying password are case-sensitive, so you must type both as they
    were created. You can always change the password at a later time. (I’ll tell you
    about it a little later in the chapter.)


    Aside from logging in, this screen also lets you select a language and a session
    type. You do this by clicking the Options button in the lower left of the screen.
    The session type is GNOME, by default. If you do wind up installing KDE at a later
    time, you can click the Session button to switch to a different desktop. With
    a standard Ubuntu install, you do also have the option of logging in to a failsafe
