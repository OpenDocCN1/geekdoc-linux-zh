- pgno: 407
  md: '# File Naming Conventions


    Valid filenames may contain *almost* any character. You do have to pay some attention
    to the names you come up with. Your Linux system allows filenames up to 255 characters
    in length. How you define filenames can save you a lot of hassle, as I will soon
    demonstrate.


    Some valid filename examples include the following:


    +   - fish

    +   - duck

    +   - program_2.01

    +   - a.out

    +   - `letter.to.mom.who.I.dont.write.often.enough.as.it.is`

    +   - .bash_profile


    Notice the last name in particular. It starts with a dot (or a *period*, if you
    prefer). Normally, this type of file is invisible with a default listing. Starting
    a filename with a dot is a way to make a file somewhat invisible. This is good
    to know if you don’t want to burden file listings with a lot of noise. It is also
    the way that a cracker might hide her tracks should she break into your system—by
    creating a directory that starts with a dot. To see these so-called dot files,
    use the `ls` command with the `-d` flag (`ls -a`).


    # Listing Files with Emotion!


    The `ls` command seems so simple, and yet it has a number of options that can
    give you tons of information. Change to something like the /etc directory and
    try these options:


    +   - `cd /etc`

    +   - `ls --color`

    +   - `ls -b`

    +   - `ls -1S`

    +   - `ls -1t`


    The first listing shows different types of files and directories in color. The
    second (`-b`) shows octal representations for files that might have been created
    with control characters. Depending on the terminal you are using, the default
    is to show question marks or simply blanks. If you need to access (or delete)
    the file, it helps to know what it is really called. The third and fourth'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'options control sorting. The -ls option gives you a long listing (lots of information)
    sorted by file size. The last option (-lt) sorts by time with the newest files
    at the top of the list and the oldest at the bottom.


    # # A Peek at Metacharacters


    Metacharacters are special characters that have particular meaning to your shell—the
    dollar sign or hash mark prompt where you do your work. The two metacharacters
    I want to look at are the asterisk and the question mark. The following is what
    they mean to the shell:


    +   *\*\t Match any number of characters

    +   *\?\t Match a single character


    Extending our talk of listing files, you could list all files containing ackle
    by using this command:


    ```

    $ ls *ackle*

    hackle hackles tackles

    ```


    Similarly, you could find all the words that start with an h like this:


    ```

    $ ls h*

    hackle hackles

    ```


    Now, if you want to see all the seven-letter words in your directory, use this
    command:


    ```

    $ ls ???????

    hackles tackles

    ```


    Each question mark represents a single letter position.


    # # File Permissions in the Shell


    In Chapter 4, I showed you how to look at file permissions with Nautilus. When
    you use the 1s-1 command, you are doing the same thing: look at basic Linux security
    at the file (or directory) level. Here is an example of a long 1s listing:'
  merge: -1
  img_proc: true
- pgno: 409
  md: '```

    $ ls -1

    total 3

    drwxr-x---  5 root    system   512 Dec 25 12:01 presents

    -r-xr--r--  1 zonthar users   123 Dec 24 09:30 wishlist

    -rw-rw----  1 zonthar users   637 Nov 15 09:30 griffong

    ```


    The first entry under the total column shows a directory (I''ll talk about the
    next nine characters in a moment). The first character is a d, which indicates
    a directory. At the end of each line, you find the directory or filename—in my
    example, they are presents, wishlist, and griffong. Because the first character
    in the permissions field is d, presents is a directory.


    The other nine characters (characters 2 through 10) indicate permissions for the
    user or owner of the file (first three), the group (second group of three), and
    others or everyone else (last three). In the first line, user root has read (r),
    write (w), and execute (x) permissions, whereas the system group has only read
    and execute. The three dashes at the end imply that no one else has any permissions.
    The next two files are owned by the user called zonthar.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_409_0.png)


    # *Quick Tip*


    Remember user, group, and other (`ugo`). You will find them useful later when
    I cover changing file and directory permissions.


    # Not-So-Hidden Files


    When you take your first look at valid filenames, remember that I mentioned that
    files starting with a period are hidden. As a result, creating directories or
    files in this way is a favorite trick of system crackers. Get used to the idea
    of listing your directories and files with a -a option so that you see everything
    that’s there. Look for anything unusual.


    Keep in mind, however, that a number of applications create dotted directory names
    in your home directory so that you are generally not burdened with seeing all
    these configuration areas. That’s great, except that you should know what you’ve
    got on your disk. Always balance your need for convenience with a healthy curiosity.
    A quick `ls -a` in your home directory shows you some files (and directories)
    you will become very familiar with as time goes on. Here is an example of what
    you will see:


    ```

    .Xauthority  .bash_history  .bash_profile  .gnupg  .gnome2

    ```'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Strange Filenames That Just Don''t Go Away


    Every once in a while, you do a listing of your directory and some strange file
    appears that you just know isn''t supposed to be there. Don''t panic. It''s not
    necessarily a cracker at work. You may have mistyped something and you just need
    to get rid of the error. The problem is that you can''t. Case in point: I accidentally
    created a couple of files with hard-to-deal-with names. I don''t want them there,
    but trying to delete them does not work. Here are the files:


    ```

    -another_file

    onemorefile

    ```


    Here''s what happens when I try to delete them:


    ```

    $ rm -another_file

    rm: invalid option -- a

    Try ''rm --help'' for more information.

    ```


    What about that other file?


    ```

    $ rm onemorefile

    rm: cannot remove ''onemorefile'': No such file or directory

    ```


    The problem with the first file is that the hyphen makes it look like I am passing
    an option to the rm command. To get around this problem, I use the double-dash
    option on the rm command. Using two dashes tells the command that what follows
    is not an option to that command. Here I go again:


    ```

    $ rm -- -another_file

    $

    ```


    Bravo! By the way, this double-dash syntax applies to many other commands that
    need to recognize potentially weird filenames. Now, what about the second file?
    It looked fine, didn''t it? If you look very closely, you see that there is a
    space in front of the leading o, so simply telling rm to remove the file doesn''t
    work either, because onemorefile is not the filename. It is actually " onemorefile"
    (preceded by a space). So, I need to pass the space as well; to do that, I give
    the full name (space included) by enclosing the filename in double quotes.


    ```

    $ rm " otherfile"

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# More on rm (or, "Oops! I didn''t really mean that"))


    When you delete a file with Linux, it is gone. If you didn''t really mean to delete
    (or rm) a file, you quickly find out if you have been keeping good backups. The
    other option is to check with the rm command before you delete a file. Rather
    than simply typing rm followed by the filename, try this instead:


    ```

    rm -i file_name1 file_name2 file_name3

    ```


    The -i option tells rm to work in interactive mode. For each of the three files
    in the example, rm pauses and asks if you really mean it.


    ```

    rm: remove ''file_name1''?

    ```


    If you like to be more wordy than that, you can also try rm --interactive file_name,
    but that goes against the system administrator''s first principle.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_411_0.png)


    > **System Administrator''s First Principle** Simplifying things. If your solution
    makes things more complicated, something has gone terribly wrong.


    Of course, in following the system administrator''s first principle, you could
    remove all the files starting with the word file by using the asterisk:


    ```

    rm -i file*

    ```


    # Making Your Life Easier with alias


    You might find that you want to use the -i option every time you delete something,
    just in case. It''s a lot easier to type Y in confirmation than it is to go looking
    through your backups. The problem is that you are adding keystrokes, and everyone
    knows that system administrators are notoriously lazy people. Then, there''s that
    whole issue of the first principle—that''s why we shortened list to ls, after
    all. Don''t despair, though—Linux has a way. It is the alias command.


    ```

    alias rm=''rm -i''

    ```'
  merge: -1
  img_proc: true
- pgno: 412
  md: "Now, every time you execute the `rm` command, it checks with you beforehand.\
    \ This behavior is only in effect until you log out. If you want this to be the\
    \ default behavior for `rm`, you should add the `alias` command to your local\
    \ `.bashrc` file. If you want this to be the behavior for every user on your system,\
    \ you should add your `alias` definitions to the system-wide version of this file,\
    \ `/etc/bashrc`, and save yourself even more time. There may already be `alias`\
    \ definitions set up for you, even if only one or two. The first way to find out\
    \ what has been set up for you is to type the `alias` command on a blank line.\n\
    \n```\n```\n$ alias\nalias ls='ls --color=auto' \n```\n```\n\nUsing the `cat`\
    \ command, you can look in your local `.bashrc` file and discover the same information.\n\
    \n```\n```\nmarcel@ubuntu:-$ cat .bashrc\n# enable color support of ls and also\
    \ add handy aliases\nif [ \"$TERM\" != \"dumb\" ]; then\n    eval \"dircolors\
    \ -b\" \n    alias ls='ls --color=auto'\n    #alias dir='ls --color=auto --format=vertical'\n\
    \    #alias vdir='ls --color=auto --format=long' \nfi\n\n# some more ls aliases\n\
    #alias ll='ls -l'\n#alias la='ls -A'\n#alias l='ls -CF' \n```\n```\n\n> **Note**\
    \  The preceding hash marks (`#`) represent comments and not the admin command\
    \ prompt.\n\nAs you can see, there are other suggested aliases that you can uncomment\
    \ by removing that leading hash mark. Incidentally, here are a few I like to add\
    \ to everyone's `.bashrc` file (or to the global `/etc/bash.bashrc`):"
  merge: -1
  img_proc: true
- pgno: 413
  md: '```

    alias rm=''rm -i''

    alias cp=''cp -i''

    alias mv=''mv -i''

    ```


    Isn''t this interesting? Notice the two other commands here, the *cp* (copy files)
    and *mv* (rename files) commands, both of which have the *-i* flag as well. They
    too can be set to work interactively, requiring your verification before you overwrite
    something important. Let''s say that I want to make a backup copy of a file called
    important_info using the *cp* command.


    ```

    cp important_info important_info.backup

    ```


    Perhps I am actually trying to rename the file (rather than copy it). For this,
    I would use the *mv* command.


    ```

    mv important_info not_so_important_info

    ```


    The only time you would be bothered by an “Are you sure?” type of message is if
    the file already existed. In that case, you would get a message like the following:


    ```

    mv: overwrite ''not_so_important_info''?

    ```


    # Forcing the Issue


    Inevitably, you''re next question is this: What do you do if you are copying,
    moving, or removing multiple files and you don''t want to be bothered with being
    asked each time when you''ve aliased everything to be interactive? Use the *-f*
    flag, which, as you might have surmised, stands for *force*. Once again, this
    is a flag that is quite common with many Linux commands—either *a -f* or *a --force*.


    Imagine a hypothetical scenario in which you move a group of log files daily so
    that you always have the previous day''s files as backup (but just for one day).
    If your *mv* command is aliased interactively, you can get around it like this:


    ```

    mv -f *.logs /path_to/backup_directory/

    ```'
  merge: -1
  img_proc: true
- pgno: 414
  md: '> Musing Yes, I know that mv looks more like move than rename. In fact, you
    do move directories and files using the mv command. Think of the file as a vessel
    for your data. When you rename a file with mv, you are moving the data into a
    new container for the same data, so it isn''t strictly a rename—you really are
    moving files. Looking at it that way, it doesn''t seem so strange. Sort of.


    The reverse of the alias command is unalias. If you want your mv command to return
    to its original functionality, use this command:


    ```

    unalias mv

    ```


    # Standard Input and Standard Output


    It may sound complicated, but it isn''t. Standard in (STDIN) is where the system
    expects to find its input. This is usually the keyboard, although it can be a
    program or shell script. When you change that default, you call it redirecting
    from STDIN.


    Standard out (STOUT) is where the system expects to direct its output, usually
    the terminal screen. Again, redirection of STOUT is at the discretion of whatever
    command or script is executing at the time. The chain of events from STDIN to
    STOUT looks something like this:


    ```

    standard in -> Linux command -> standard out

    ```


    STDIN is often referred to as fd0, or file descriptor 0, whereas STOUT is usually
    thought of as fd1. There is also standard error (STDERR), where the system reports
    any errors in program execution. By default, this is also the terminal. To redirect
    STOUT, use the greater-than sign (>). As you might have guessed, to redirect from
    STDIN, you use the less-than sign (<). But what exactly does that mean? Let''s
    try an experiment. Randomly search your brain and pick a handful of names. Got
    them? Good. Now type the cat command and redirect its STOUT to a file called random_names.


    ```

    cat > random_names

    ```'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'Your cursor just sits there and waits for you to do something, so type those
