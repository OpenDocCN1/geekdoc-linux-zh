  md: '# Administering and Personalizing Your System


    The final set of menus are both listed under the **System** label on the top panel.
    Before I tell you a bit about them, I would also like to let you know that the
    GNOME help system is available from the **System** menu. You can also lock your
    screen with a password (when you run off for coffee or a muffin) or log out of
    your current Ubuntu Linux session.


    Now, let''s take a look at the Preferences submenu (see Figure 2-10).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_50_0.png)


