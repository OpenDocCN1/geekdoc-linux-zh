    # ## Removing Installed Packages


    Should you decide that you want to remove a package—not a bad idea if you aren’t
    using the software—go back to the Add/Remove Applications dialog and search for
    the package. That’s the quickest way to find it. You could also browse down the
    applications list to find it. To actually remove the package in question, uncheck
    the box next to the program name and click Apply. A confirmation dialog appears
    asking you to confirm that you do indeed want to remove this package. If this
    all sounds familiar, that’s because it is essentially the reverse of installing
    software.


