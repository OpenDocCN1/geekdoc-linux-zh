- pgno: 218
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_218_0.png)


    > "Ubuntu" is an ancient African word, meaning "humanity to others". Ubuntu also
    means "I am what I am because of who we all are". The Ubuntu Linux distribution
    brings the spirit of Ubuntu to the software world.


    Ubuntu is a complete Linux-based operating system.


    Figure 10-12  Tab Preview provides a handy thumbnail view of your tabbed pages.


    # Wrapping Up—Other Browsers to Consider


    Firefox, as I mentioned, is the default browser that comes with Ubuntu, but it
    is by no means your only choice. If you like Firefox, you might also want to look
    at Mozilla (http://www.mozilla.org) as a full-featured browser suite featuring
    an email client, HTML editor, and more. Konqueror, another excellent browser,
    comes as part of the KDE desktop but you don’t need to install KDE to take advantage
    of it. Just search for Konqueror with your Synaptic package installer.


    We can’t stop there. You also have access to some text-only browsers such as Lynx
    and Links. Neither of these comes pre-installed with Ubuntu, but both are easily
    added if you are curious.'
