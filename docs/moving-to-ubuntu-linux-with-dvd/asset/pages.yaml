  md: '# ## Famous Places on the Menu


    Next to the rather rich landscape of the Applications menu and its submenus, we
    find the Places menu (see Figure 2-9). Places primarily is a menu of physical
    storage locations, most of them disks or folders on your own system.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_49_0.png)


