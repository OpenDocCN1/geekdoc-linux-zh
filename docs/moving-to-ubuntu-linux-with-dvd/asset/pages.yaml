  md: '# Chapter


    # 4


    # Navigating Nautilus


    Nothing on your computer is more important than data. Other than playing games
    (and even there), computers are about storing and dealing with information. That’s
    why being able to work well with that data—moving, copying, renaming, and deleting
    it—is vitally important to getting comfortable in your Linux world.


    That means it is time to revisit your new old friend, Nautilus, the GNOME file
    browser.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'There’s a saying in the Linux world that “everything is a file” (a comment
    attributed to Ken Thompson, the developer of UNIX). That includes directories.
    Directories are just files with lots of files inside them. All these files and
    directories are organized into a hierarchical file system, starting from the root
    directory and branching out.


    > **Note** Folders and directories are the same thing. The terms can be used interchangeably.
    I tend to think of them as directories, but if you are more comfortable thinking
    of them as folders, don’t worry. Depending on the application, you’ll see both
    terms used.


    The root directory (referred to as *slash*, or */*) is aptly named. If you consider
    your file system as a tree’s root system spreading out below the surface, you
    start to get an idea of just what things look like. Under the root directory,
    you’ll find folders called *usr*, *bin*, *etc*, *tmp*, and so on. Let’s open Nautilus
    and have a look at this structure.


    Click Places on your top panel and select Home Folder. This brings up the file
    browser in your home folder. If your navigation panel isn’t up (Nautilus’ left
    side panel), press <F9> to open it. You’ll see a number of entries, including
    your home directory. On the left, Nautilus shows a small list of important places
    on your system, primarily in your home folder. This side panel is the *navigation
    panel*. Pressing <F9> hides (or brings forward) the navigation panel. Beside the
    Places label, there is an arrow, alerting you to the fact that this is actually
    a button with a drop-down list of options. Click that button now and select Tree
    for your view. In all likelihood, you’ll see two entries: one for Home Folder
    and another for File System. To the left of each entry is a small arrow. Click
    the one beside File System (or double-click the folder) to get a top-down view
    of your Ubuntu Linux system (see Figure 4-1).


    On the right, the contents of the current place (or location) are displayed. If
    this is a directory (like your home directory), the various directories will appear
    as folder icons. These are all system directories, and they will contain all the
    programs that make your Linux system run, including documentation, devices, and
    device drivers. For the most part, you aren’t going to be touching the files under
    File System. Accidentally changing things around in this part of your system probably
    isn’t a good thing (it could render your system inoperative), which is why everyone
    logs in with their own accounts.'
  merge: -1
  img_proc: true
- pgno: 89
