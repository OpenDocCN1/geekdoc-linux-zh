- pgno: 140
  md: '**Note** I’ve mentioned how some companies aren’t very forth-coming with drivers
    for Linux systems. This is changing, however, and some printer manufacturers offer
    excellent support for Linux. These include HP and Brother, among others.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_140_0.png)


    Now that there are two printers configured, take a look at the laser printer,
    the one that was automatically detected on the network. Notice the check mark
    icon on its top left. That indicates that this is the system’s default printer.
    To change the default output to another printer, right-click the printer and select
    Make Default from the pop-up menu.


    # Network Printers


    The example I gave you is for a locally connected printer, one that was auto-detected
    by your system. What if the printer make and model isn’t detected or you need
    to use a network-based printer, perhaps one hanging off a Windows network? Let’s
    look at a more complex installation. Once again, double-click New Printer to bring
    up the Add a Printer dialog.'
