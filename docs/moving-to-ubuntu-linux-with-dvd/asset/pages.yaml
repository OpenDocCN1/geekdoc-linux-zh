  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_82_0.png)


    Figure 3–16 Setting user properties.


    This takes you back to the Users and Groups screen, where you can simply click
    OK to finish. Of course, you can also add more users.


    # Much Ado About sudo


    When you start a graphical command that requires administrative privileges, a
    dialog appears asking you for your password. This dialog is actually a command
    called gksudo. In turn, gksudo is a wrapper for a shell command called sudo.'
