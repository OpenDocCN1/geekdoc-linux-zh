- pgno: 417
  md: 'just below or (depending on the keyboard) just above the Enter key and sharing
    space with the backslash key. Here''s how it works:


    ```

    cat random_names | sort | wc -w > num_names

    ```


    In the preceding example, the output from the `cat` command is piped into `sort`,
    whose output is then piped into the `wc` command (that''s *word count*). The `-w`
    flag tells `wc` to count the number of words in `random_names`. So far, so good.


    That `cat` at the beginning is actually redundant, but I want to stack up a few
    commands for you to give you an idea of the power of piping. Ordinarily, I would
    write that command as follows:


    ```

    sort random_names | wc -w > num_names

    ```


    The `cat` is extraneous because `sort` incorporates its function. Using pipes
    is a great timesaver because you don''t always need to have output at every step
    of the way.


    # ### tee: A Very Special Pipe


    Suppose that you want to send the output of a command to another command, but
    you also want to see the results at some point. Using the previous word count
    example, if you want a sorted list of names, but you also want the word count,
    you might have to use two different commands: one to generate the sorted list
    and another to count the number of words. Wouldn''t it be nice if you could direct
    part of the output one way and have the rest continue in another direction? For
    this, use the `tee` command.


    ```

    sort random_names | tee sorted_list | wc -w > num_names

    ```


    The output from `sort` is now sitting in a file called `sorted_list`, whereas
    the rest of the output continues on to `wc` for a word count.


    # ### STDERR


    What about `STDERR`? Some commands (many, in fact) treat the error output differently
    than the `STDOUT` If you are running the command at your terminal and that''s
    all you want, there is no problem. Sometimes, though, the output is'
