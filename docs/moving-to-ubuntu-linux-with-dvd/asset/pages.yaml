- pgno: 171
  md: '# Chapter


    # 8


    # Installing New Applications


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_171_0.png)


    Your Ubuntu Linux system arrived with a collection of great software, with packages
    to handle everything from word processing to email, surfing the Web, instant messaging,
    even games to help you unwind. As you take the time to experiment and learn about
    your system and everything it has to offer, eventually you''ll want more than
    what you have. That''s why I''m going to show you how to install that software,
    easily and without fuss. I will also tell you about updates and how to make sure
    that your system is patched and secure. You''ll be amazed at how easy it is to
    search for the software you need and how fast you can have it up and running.


    Before we get into finding and installing software, I''d like to address a little
    myth. You have no doubt heard that installing software on Linux is difficult and
    that it is inferior to what we are used to in the Windows world. Nothing could
    be further from the truth. In fact, software installation under Linux is actually
    superior to what you are leaving behind in your old OS.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '> Security Note When you install software and software packages, you must often
    do so as an administrative user, also known as root. As root, you are all powerful.
    Linux tends to be more secure and much safer than your old OS, but that doesn’t
    mean disasters can’t strike. Know where your software comes from and take the
    time to understand what it does. That’s why sticking with the Ubuntu repositories,
    which give you access to several thousand packages through Synaptic, is the best
    approach. Synaptic? Don’t worry. I’ll explain.


    # Linux and Security


    When it comes to installing software, security is something we should talk about.
    I’ve already said that you should know where your software is coming from, but
    that is only part of the consideration. That’s why I’m going to clear up some
    bad press Linux gets when it comes to installing software.


    In the Windows world, it is frighteningly easy to infect your PC with a virus
    or a worm. All you have to do is click on an email attachment, and you could be
    in trouble. With some email packages under Windows, it “helps” you by automatically
    opening your email attachments, or connecting you to Internet links, which can
    cause trouble. You won’t find many Linux packages provided as simple executables
    (EXE files and so on). Security is the reason. To install most packages, you also
    need root privileges. Again, for security reasons, Linux demands that you be conscious
    of the fact that you might be doing something that could hurt your system. If
    an email attachment wants to install itself into the system, it must consult the
    root user first.


    Package managers, such as rpm (the RPM Package Manager) or Ubuntu and Debian’s
    dpkg/apt-get, perform checks to make sure that certain dependencies are met or
    that software doesn’t accidentally overwrite other software. Those dependency
    checks take many things into consideration, such as what software already exists
    and how the new package will coexist. Many of you are probably familiar with what
    has been called DLL hell, where one piece of software just goes ahead and overwrites
    some other piece of code. It may even have happened to you. Blindly installing
    without these checks can be disastrous. At best, the result can be an unstable
    machine—at worst, it can be unusable.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Installing software under Linux may take a step or two, but it is for your
    own good.


    # ## Identifying Software Packages


    Most major Linux distributions have in common the concept of a package—a prebuilt
    bundle of software ready to be installed on your system. Despite the numerous
    distributions out there, most use the same package management systems. They often
    have different ways of dealing with them, but the packaging system remains pretty
    consistent. Most distributions these days use either the RPM format of packages
    or DEB. Because it is based on Debian, Ubuntu Linux uses DEB format packages.


    Assume that I am talking about a hypothetical package called `ftl_transport`.
    If I were looking for this package to install on my Ubuntu system, I would find
    it in this type of format:


    ```

    ```

    ft1-transport_2.1-1_i386.deb

    ```

    ```


    The first part is the package name itself. The numbers just after the underscore
    (and just before the hyphen) indicate the software version number. The number
    following the hyphen is the package release number. Following that is the architecture
    for which the package was compiled (i386, in this case). The final prefix, `.deb`,
    is a dead giveaway that this is a Debian package, sometimes referred to as a DEB.


    # ## The Simplest Way to Add Applications


    In the next section, I’m going to show you a detailed way to find, install, update,
    and maintain software for your Ubuntu Linux system. Before I do that, however,
    I want to show you a simple, easy-to-use tool for installing packages on your
    system. You’ve no doubt seen this entry in the menu several times as you have
    worked through the various chapters of this book. It’s time to look at the Add
    Applications program.


    To get started, click *Applications* on the top panel and select *Add/Remove*.
    It’s the last item on the list. Installing software requires system privileges,
    so you are asked for the password first. Enter it and a few seconds later, the
    *Add/Remove Applications* dialog appears (see Figure 8-1). There is a short delay
    as the program reads the database of available and installed applications. The
    command name for this program is `gnome-app-install`.'
  merge: -1
  img_proc: true
- pgno: 174
