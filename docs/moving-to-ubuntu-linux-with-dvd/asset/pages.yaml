- pgno: 162
  md: 'Because you are probably doing this to deal with traveling profiles, you may
    want to add at least two entries here, one for home and one for away.


    # Configuring Your Dial-up Connection


    A dial-up connection generally implies a PPP, or Point-to-Point, connection. Click
    Modem Connection to highlight that selection, then click the Properties tab. The
    Interface Properties dialog appears. It consists of three tabbed windows labeled
    General, Modem, and Options. If the General tab isn’t selected by default, click
    it now. Look for and check the box labeled Enable This Connection. You’ll find
    it on the General tab under the Connection heading for device ppp0 (see Figure
    7-4). The additional fields in this window should no longer be grayed out.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_162_0.png)


    > Figure 7-4 Your first step is to enable the connection, then enter your ISP’s
    connection information.


    Enter your ISP’s dial-up phone number and, if need be, a dialing prefix. Below
    that, enter the username and password that was supplied to you when you set up
    the account. Now, click the Modem tab.'
  merge: -1
