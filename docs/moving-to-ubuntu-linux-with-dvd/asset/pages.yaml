- pgno: 73
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_73_0.png)


    **Figure 3-9** The File drop-down menu.


    # And the Wastebasket?


    Yes, I did say that I would talk further about the wastebasket. I want to give
