    # Interrupting, Suspending, and Restarting Processes


    Once in a while, I start a process that I think is going to take a few seconds—like
    parsing a large log file, scanning for some text, extracting something else, sorting
    the output, and finally sending the whole thing to a file. All of these are very
    ad hoc in terms of reporting. The trouble is this: Two and a half minutes go by
    and I start to get a little impatient. Had I thought that the process would take
    a while, I might have started it in the background.


    When you start a process (by typing a command name and pressing <Enter>), you
    normally start that process in the foreground. In other words, your terminal is
    still controlling the process and the cursor sits there at the end of the line
    until the process completes. At that point, it returns to the command or shell
    prompt. For most (not all) processes, you can run things in the background, thus
    immediately freeing up your command line for the next task. You do this by adding
    an ampersand (&) to the end of the command before you press <Enter>.


    ```

    $ sh long_process &

    ```


