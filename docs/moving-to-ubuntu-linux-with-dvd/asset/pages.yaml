    # Pipes and Piping


    Sometimes, the thing that makes the most sense is to feed the output from one
    command directly into another command without having to resort to files in between
    at every step of the way. This is called *piping*. The symbol is not that subtle:
    Imagine pieces of pipe connecting one command with another. Not until you run
    out of pipe does the command''s output emerge. The pipe symbol is the broken vertical
    bar on your keyboard usually located'
