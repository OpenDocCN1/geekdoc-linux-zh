    # # Can You Feel the Burn?


    I still find it interesting to consider the terms that have entered the language
    when referring to creating CDs. We rip, and then we burn. Considering the violent-sounding
    nature of the process, anything that simplifies the process and makes things a
    little friendlier is certainly welcome. For this part of the chapter, I’m going
    to assume that you have already ripped a number of songs and now you want to create
    a custom collection of your music to listen to in the car or on your living room
    stereo. I’m also going to tell you how you can use essentially the same process
    to back up your data.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'Try this one. Make sure you have closed the Sound Juicer program and taken
    your music CDs out of the drive. Take a blank CD-R and pop it in your CD or DVD
    burner. Your Ubuntu system should recognize this event with a pop-up message asking
    your intentions for this blank CD (see Figure 18-11).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_354_0.png)


    Your Ubuntu system senses a blank CD and wants to know your intentions.


    # Burning a Data CD


    Do you want to ignore this event, create a music CD, or create a data CD? Hmm
    . . . doesn''t that last choice sound interesting? We''ll cover making an audio
    CD shortly. For now, let''s click the Make Data CD button. When you do, something
    interesting appears. A special Nautilus window appears (see Figure 18-12).


