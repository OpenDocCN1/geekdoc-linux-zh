    # Ripping and Burning Songs


    Over the years, we have all purchased a lot of music CDs or, as some of us still
    call them, *albums*. Many of those albums, unfortunately, had only two or three
    songs we really liked, so playing the whole album wasn’t what we wanted. As a
    result, we created collections of our favorite songs on tape and played the tapes,
    instead.


    These days, with the help of our Linux systems, we can create our own collections
    from those albums we purchased and create CD collections of those songs we want
    to hear. Furthermore, if you have lots of disk space and you spend a lot of time
    at your computer, nothing beats a collection of songs ready to play without having
    to change CDs all the time. Pulling songs from a CD and saving them to your system
    as digital images is what is commonly referred to as *ripping*. The *burning*
    happens when you take a collection of songs and, well, burn them to a CD.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Intermezzo: Digital Audio Formats


    Before I get into the mechanics of ripping and burning songs, I’d like to spend
    a small amount of time discussing music formats. When you purchase a CD, the songs
    on that CD are in a format not generally used by your system. In fact, when we
    copy songs to disk from a CD, we always encode it into another, usually more compact
    format. The format we transfer to is identified by a three-letter extension on
    the filename. The most common format extensions are .wav, .mp3, and (more recently)
    .ogg.


    The WAV format is one originally created by Microsoft. It is extremely common
    but not the most efficient in terms of compression. On the other hand, the MP3
    format (from the Motion Pictures Experts Group, a.k.a. MPEG) owes its popularity
    to the high compression ratio it uses—about 12:1. The newcomer on the block is
    the OGG (or Ogg Vorbis) format. Like MP3, it boasts a high compression rate, but
    unlike MP3, it is completely unencumbered by patents.


    To give you an idea of the compression values, I ripped a 3-minute, 46-second
    song to WAV format. It came in at 39,866,444 bytes, whereas the same song in OGG
    format required only 3,438,407 bytes. If you do the math, that is a ratio of 11.6:1.
    Pretty impressive reasons for not using WAV format files.


    # Using Sound Juicer as a CD Ripper


    Every time you put in a new audio CD, every song is selected, either for play
    or for extraction by Sound Juicer. Earlier, I had you play the songs, but clicking
    the Extract button is pretty much all you need to do to get those songs onto your
    hard drive. Alternatively, you can select individual songs by clicking the check
    boxes to the left of each song.


    When the process starts, the Play button is grayed out and the Extract button
    changes to a Stop button in case you want to cancel the process. At the bottom
    of the Sound Juicer window, on the left side, is a graphical progress bar. Directly
    to the right of that, the estimated time is indicated along with the speed at
    which the process is taking place (see Figure 18-6). The resulting songs are saved
    in your home folder using the following format:


    ```

    /home/username/artist_name/album_name/track_title.ogg

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_348_0.png)


    **Figure 18–6 The Sound Juicer is a multimedia multimedia application. Aside from
