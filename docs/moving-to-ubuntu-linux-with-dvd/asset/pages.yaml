    type in the path to that folder.


    # Search Me . . .


    Your Ubuntu Linux system may not have a lot of files in your home folder, but
    that won''t last long; I promise. There''s an old adage that suggests, “data will
    grow to fill all available disk space.” In my experience, that''s a fact. In time,
    that big drive of yours just won''t seem big enough.'
