    # ## Other Interesting Places to Visit


    You now have a pretty good grasp of Nautilus and what it can do for you. Starting
    from the Places menu on the top panel is the best way to take Nautilus where you
    want it to go. There are, or can be, some other interesting places in that menu.


    For instance, select Computer from the Places menu and Nautilus opens up with
    a bird’s eye view of your system. A Filesystem icon starts you at the top level
    of your file system tree. Your floppy drive appears here as does another icon
    representing your CD-ROM or DVD drive. There can be several icons depending on
    how many drives are on your system (see Figure 4-18). These days, it’s not unusual
    for people to carry around a USB key or USB pen drive. If you plug one of these
    in to your Ubuntu system, it becomes one of the interesting places you can visit.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_109_0.png)


