- pgno: 205
  md: '# # Chapter 10


    # ## Surfing the Net with Firefox


    When it comes to Web browsers on the desktop, Linux users are faced with an embarrassment
    of riches with plenty of alternatives to choose from. For those who are looking
    for a screaming fast browsing experience and can do without the graphics, Linux
    offers a number of text-based browsers. (I’ll mention these briefly at the end
    of the chapter.)


    In the graphical world where most people spend their browsing time, the hottest
    and coolest browser of the day is Firefox, and it just happens to be the default
    browser found in Ubuntu Linux. Before Firefox made its appearance a short while
    ago, everyone assumed that the browser world belonged to the browser from Redmond,
    the security-problem-plagued Internet Explorer. As I write this, Internet Explorer
    has dipped to below 90 percent of the browser market share in North America and
    below 80 percent in Europe. This is quite the feat considering that Internet Explorer
    commanded something around 95 percent of the market before Firefox. Better security
    and advanced features have drawn millions of users away from Microsoft’s browser.
    Firefox is an exciting program and I’ll show you how it works in this chapter.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# ## Mozilla versus Firefox


    Firefox is distributed by the same people who distribute the Mozilla browser.
    In fact, Firefox is a Mozilla product.


    What’s the difference between Mozilla and Firefox? The actual Mozilla browser
    is more like the Swiss Army knife of browsers. It includes an email package and
    IRC client, is ideal for reading newsgroups, and comes with an HTML editor. Firefox,
    on the other hand, is strictly a Web browser (see Figure 10–1). It’s smaller,
    faster, and more geared to its primary job, providing you with a superior surfing
    experience. To get the equivalent standalone email package, you would download
    Thunderbird (mentioned in Chapter 11). Right now, I’d like to concentrate on Firefox,
    so let’s get started.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_206_0.png)


    To start Firefox, click the Application menu in the top panel, navigate to the
    Internet submenu, and then select Firefox Web Browser. There’s also a quick access
    icon for Firefox in the top panel. Directly to the right of the'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'System menu, there’s a blue globe. Pause your mouse cursor over the icon and
    it identifies itself as Firefox.


    # Working from Home


    When you first start Firefox, it takes you to its home, currently a Welcome to
    Ubuntu page, locally installed on your system. The location is identified in the
    URL/location bar directly below the menu bar. Getting to a Web site and navigating
    Firefox is much the same as it is in any other browser you have used, particularly
    if you were using Mozilla (or Firefox) with your old OS. All you do is type the
    URL of the Web site you want to visit into the location bar, and away you go.
    If you would like to start each time on a personal home page, this is easily done.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_207_0.png)


    > Tip Take the time to check out and visit the links on the Ubuntu welcome page.
    They point to some valuable resources, some of which you may want to bookmark.


    Click Edit in Firefox’s menu bar and select Preferences. The Preferences window
    opens up with a number of icons running along the top, directly under the title
    bar, from which you select what part of Firefox you want to modify. By default,
    it opens up to the General category (see Figure 10-2). Directly below, in the
    Home Page section, there are three buttons. The first button, Use Current Page,
    enters whatever URL (or page) you are currently visiting into the Location field
    as your home page. The middle button, Use Bookmark, brings up a dialog with your
    current bookmarks. Clicking the Use Blank Page button starts Firefox on a blank
    page. Of course, you could just type the URL into the Location field, click OK,
    and be done.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_207_1.png)


    > Quick Tip Before closing the Preferences dialog, did you notice that the Location
    field actually says Location(s)? That’s right, it could be plural. If you have
    multiple tabs open (which I’ll cover next), the Use Current Page button becomes
    Use Current Pages. When you click the Home icon, Firefox opens tabs to all your
    favorite pages. If you want to manually enter a list of pages into the location
    bar, just separate each page with the pipe symbol, | (usually found above the
    backslash key on your keyboard).'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_208_0.png)


    Figure 10-2 Setting your home page in Firefox''s Preferences menu.


    # Keeping Tabs on the Web, Firefox Style


    Firefox sports a great feature called tabbed browsing. Here''s how it works. Sometimes
    when you are viewing Web sites, you want to keep a particular site open while
    moving to another place on the Web. Normally, you click File and select New Window.
    This is fine, except that if you keep doing this, you''ll wind up with many versions
    of a browser open on your desktop. Switching from one to the other involves doing
    a little digital juggling. Tabs make it possible to bring a nice, clean air of
    sanity to what could otherwise become a very cluttered taskbar (or desktop). With
    tabbed browsing, you open additional Web sites in the same browser window, and
    then move from one to the other by clicking the open site''s appropriate tab.


    Here''s how you do it. Start by visiting a site of your choice. Now click File,
    select New, and choose New Tab from the drop-down menu. You can also use the <Ctrl+T>
    keyboard shortcut to do the same thing. Notice that Firefox identifies your sites
    with tabs just below the location bar (see Figure 10-3), or if you have it turned
    on, your Bookmarks toolbar. Add a third or a'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'fourth tab if you like. Switching from site to site is now just a matter of
    clicking the tabs on your single copy of Firefox.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_209_0.png)


    **Figure 10-3** Firefox showing off its tabs.


    > **Tip** Here''s a cool trick. In the Linux world, there''s a right mouse button,
    a left mouse button, and, often, a middle mouse button. Even if you don''t have
    a middle mouse button, you can still mimic the action of the middle button by
    pressing the left and right buttons at the same time. Many applications, including
    your desktop environment, can take advantage of this middle button (or phantom
    middle button).


    Why am I telling you this? Click a link using the middle button and that link
    automagically opens up in a new tab. Cool? Cool.'
