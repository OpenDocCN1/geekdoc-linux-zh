  img_proc: true
- pgno: 102
  md: 'Shell Out Open a terminal shell and type ls to see your directories. Renaming
    a file or directory from the shell is easy using the mv command. Why move to rename?
    Because renaming involves copying to a new location first, then deleting the old
    file. Type mv oldname newname and press <Enter>. For instance, to change your
    Classical directory to Opera, you would type the following command:


    ```

    mv Classical Opera

    ```


    # Copying Files and Directories (and Moving, Too!)


    Ah! This is where you learn another great trick with Nautilus. An easy way to
    copy a file from one directory to another is to fire up two versions of Nautilus.
    (I usually close the side navigation panel in one version.) You can also right-click
    a folder in the Tree view and select Open in New Window from the pop-up menu.
    In the first window, you find the file (or files) you want to copy. In the second
    Nautilus window, you locate the directory to which you want those files copied.
    Hold down the <Ctrl> key and simply drag the file from one window into the other.
    Your file is copied.


    Copying and moving files is similar, but instead of holding down the <Ctrl> key,
    you just drag the file or folder into the new location. Both copying and moving
    involve a copy. The difference is in what happens after the copy is done. In one
    case, you copy the file over and keep the original, thus giving you two copies
    of the same file but in different places. A move, on the other hand, copies the
    file and deletes the original from where it was.


    Here’s an interesting trick for you. Click the file or folder you want to move,
