  md: '# PlanetPenguin Racer


    This is one of my favorite, arcade style, games.


    The idea is simple. Tux, the Linux penguin, races down snow- or ice-covered mountains
    on his belly (see Figure 19-16). As the speed increases, you try to dodge obstacles
    while picking up herring along the way. The action is fast-paced and exciting,
    with Tux taking flight off the occasional cliff or ramp. All this happens as you
    race against the clock.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_388_0.png)


    Figure 19-16  Fast, frozen fun with PlanetPenguin Racer.


    You can install this one easily via Synaptic. Search for planetpenguin-racer.
    Make sure you select the planetpenguin-racer-data and planetpenguin-racer-extras
    packages when you install. The extras package provides a number of additional
    courses.


    Trust me on this one . . . you don''t know the meaning of fun until you race down
