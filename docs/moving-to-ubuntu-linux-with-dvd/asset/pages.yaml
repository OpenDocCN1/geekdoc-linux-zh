- pgno: 26
  md: '# Is Linux Really FREE?


    In any discussion of what *free* means in relation to software, you''ll often
    see the expressions "free as in speech" or "free as in beer." In this case, free
    isn''t a question of cost, although you can get a free copy (as in *free beer*)
    of Linux and install it on your system without breaking any laws. As Robert A.
    Heinlein would have said, "There ain''t no such thing as a free lunch." A free
    download will still cost you connection time on the Internet, disk space, time
    to burn the CDs, and so on. In the case of Ubuntu Linux, you can have a free CD
    mailed to you, so free in this case starts to feel pretty, well… free.


    Linux is also free, as in speech, in that you have the right to view the source
    code and modify it to suit your needs. This is very unlike other operating systems
    when looking at or changing the code could get you in legal trouble.


    Perhaps this is where a little French helps. You''ll also see the delineations
    free (*libre*) and free (*gratis*). The first, *libre*, means free in the sense
    that you have freedom of expression, the freedom of speech, and the freedom to
    think. The second, *gratis*, refers to no cost. Imagine yourself at a friend''s
    party. Your friend walks up and hands you a beer—*gratis*.


    # What''s a Distribution?


    Linux comes in many flavors, often referred to as distributions. Ubuntu Linux
    is just one of many distributions out there. You have probably heard of Red Hat,
    SUSE, or Mandriva (formerly Mandrake). These are all popular and well-respected
    distributions. A distribution is a collection of software, usually free software,
    with the Linux kernel at its core and hundreds, sometimes thousands, of applications.
    Different manufacturers may offer boxed sets that come with documentation, support,
    and CDs, the latter saving you time and energy downloading and burning discs.
    Furthermore, there are boxed sets of varying prices, even within a distribution.
    For instance, you can buy a Red Hat personal or professional edition. The difference
    is there may be additional software, documentation, or support.


    Ubuntu Linux is a distribution based on yet another, very popular distribution
    known as Debian. Debian''s popularity has spawned a number of distributions including
    Xandros, Linspire, Knoppix, and several others.


    What sets one distribution apart from another is not always easily defined, but
    there are some basics. For instance, most distributions provide their own administrative
    interfaces. They include their own unique desktop themes and organization of applications
    in a menu.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Speaking of applications, this is one of Ubuntu’s strengths and something that
    attracts many people. Ubuntu has selected a simplified core set of applications
    that makes sense. To understand why this is such a great idea, you need to understand
    that some distributions give you three terminals, five Web browsers, two word
    processors, and so on. Ubuntu Linux makes it easy with intelligent choices for
    applications that do the job.


    # ## Linux and the GPL


    Linux is distributed under the GNU General Public License (GPL), which, in essence,
    says that anyone may copy, distribute, and even sell the program, so long as changes
    to the source are reintroduced back to the community and the terms of the license
    remain unaltered. Free means that you are free to take Linux, modify it, and create
    your own version. Free means that you are not at the mercy of a single vendor
    who forces you into a kind of corporate servitude by making sure that it is extremely
    costly to convert to another environment. If you are unhappy with your Linux vendor
    or the support you are getting, you can move to the next vendor without forfeiting
    your investment in Linux.


    In other words, it’s “free as in speech”—or freedom.


    The GNU GPL permits a distributor to “charge a fee for the physical act of transferring
    a copy, and you may at your option offer warranty protection in exchange for a
    fee.” This is further qualified by the statement that the distributor must release
    “for a charge no more than your cost of physically performing source distribution,
    a complete machine-readable copy of the corresponding source code.” In other words,
    the GPL ensures that programs like Linux will at best be free of charge. At worst,
    you may be asked to pay for the cost of a copy.


    You should take some time to read the GNU GPL. For your convenience, I’ve reprinted
    it in Appendix A of this book.


    # What Do I Gain?


    No operating system is perfect, and nothing comes without some hassles, but as
    time goes on, Linux is getting closer and closer to perfection. These days, Linux
    is even easier to install than your old operating system, and you don’t have to
    reboot time and again as you load driver disk after driver disk. I won’t bore
    you with everything I consider an advantage but I will give you a few of the more
    important points.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Security


    Say goodbye to your virus checker and stop worrying. Although Linux is not 100
    percent immune to viruses, it comes pretty close. In fact, to date, most so-called
    Linux viruses do not exist *in the wild* (only under tightly controlled environments
    in *proof-of-concept* labs). It isn’t that no one has tried, but the design model
    behind Linux means that it is built with security in mind. Consequently, viruses
    are virtually nonexistent in the Linux world, and security issues are dealt with
    quickly and efficiently by the Linux community. Security flaws are well advertised.
    It isn’t unusual for a security hole to be discovered and a fix created within
    a few short hours of the discovery. If something does present a risk, you don’t
    have to wait for the next release of your operating system to come along.


    # Stability


    The stability of Linux is almost legendary. Living in a world where people are
    used to rebooting their PCs one or more times a day, Linux users talk about running
    weeks and sometimes months without a reboot. Illegal operations and the Blue Screen
    of Death are not part of the Linux experience. Sure, programs occasionally crash
    here, but they don’t generally take down your *whole* system with them.


    # Power


    Linux is a multitasking, multiuser operating system. In this book, I concentrate
    on the desktop features of Ubuntu Linux, but under the hood, Linux is a system
    designed to provide all the power and flexibility of an enterprise-class server.
    Linux-powered Web site servers and electronic mail gateways move information along
    on the Internet and run small to large businesses. Under the friendly face of
    your graphical desktop, that power is still there.


    # Money


    It is possible to do everything you need to do on a computer without spending
    any money on software—that means new software and upgrades alike. In fact, free
    software for Linux is almost an embarrassment of riches. In Chapter 8, I’ll show
    you how to install (or remove) additional software on your Linux system. You won’t
    believe how easy it is.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Freedom from Legal Hassles


    When you run Linux, you don''t have to worry about whether you''ve kept a copy
    of your operating system license. The GNU GPL, which I mentioned earlier, means
    you are legally entitled to copy and can legally redistribute your Linux CDs if
    you wish.


    Keep in mind, however, that although Linux itself can be freely distributed, not
    all software that runs on Linux is covered by the same license. If you buy or
    download software for your system, you should still pay attention to the license
    that covers that software.


    # What Do I Lose?


    Nothing ever seems to be perfect. By moving to Linux you gain a great deal, but
    I would be doing a disservice if I did not mention the disadvantages.


    # Hardware and Peripheral Support


    The hardware support for Linux is, quite honestly, among the best there is, and
    Ubuntu''s hardware support is among the best in the Linux world. In fact, when
    you consider all the platforms that run Linux, its hardware and peripheral support
    is better than that of the Windows system you are leaving behind. Unfortunately,
    there are some consumer devices designed with Windows specifically in mind. Consequently,
    certain printers or scanners may have limited support under Linux because the
    manufacturer is slow in providing drivers. That said, the vast majority of standard
    devices work very well and you aren''t likely to run into too many problems.


    On the upside, you''ll find that where you always had to load drivers to make
    something run in your old OS, Linux automatically recognizes and supports an amazing
    number of peripherals without you having to do anything extra or hunt down a driver
    disk. Furthermore, the Linux community is vibrant in a way that few businesses
    can ever hope to be. If you have your eye on a hot new piece of hardware, you
    can almost bet that some Linux developer somewhere has an eye on exactly the same
    thing.


    We''ll talk about devices and device drivers later in Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Software Packages


    There is a huge amount of software available for the Linux operating system. Amazingly,
    most of it is noncommercial and free for the download. There are thousands of
    games, tools, and Internet and office applications available to run on your system.
    You don''t have to go far either: Most modern distributions come with several
    hundred packages on the CD, more than enough to get you going, working, and playing
    without having to look elsewhere. Once again, much of the software out there will
    cost you nothing more than the time it takes to download it.


    And installation? With the Synaptic package manager included with Ubuntu, you''ll
    be asking yourself why it wasn''t this easy to install software in your old OS!


    On the other hand, commercial, shrink-wrapped software, including those hot new
    3D games at your local computer store, are still hard to come by. As Linux grows
    in popularity, particularly on the desktop, this is starting to change.


    There are ways around this issue, however. For instance, you can pick up a package
    called Cedega that lets you install and run Windows games.


    # A Step into the Unknown


    Let''s face it. For some, moving to Linux is a step into the unknown. Things won''t
    be exactly as they were with your old operating system, and for the most part,
    this is a good thing. You will have to do a little relearning and get used to
    a different way of doing things.


    Even so, if you are used to working in your Windows graphical environment and
    you are comfortable with basic mousing skills, writing the occasional email, surfing
    the Web, or composing a memo in your word processor, moving to Linux won''t be
    a big deal. Your Linux desktop is a modern graphical environment, and much of
    what you have learned in your old operating system can be taken with you into
    this new world.


    # Some Tips on Using This Book


    My intention in creating this book was to provide a simple transition from your
    old OS to Ubuntu Linux. I''ll cover things such as installation shortly, but the
    majority of the book has to do with working (and playing) in your new Ubuntu Linux
    environment. I want to show you how to do the things you'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'have grown used to doing: surfing the Net, writing emails, listening to music,
    printing, burning CDs, and so on. Furthermore, I am going to tell you how to take
    those Word documents, Excel spreadsheets, and music files you have collected over
    time and start using them with Linux. In short, my plan is to have you move as
    effortlessly as possible from your old OS to Linux.


    Working your way through the chapters, you’ll notice that I am constantly inviting
    you to try things. That’s because I believe the best way to learn anything is
    by doing. Yes, you’re going to learn to work with a new operating system, but
    it doesn’t mean you can’t have fun. As everyone knows, all work and no play will
    make anyone pretty dull. Later in this book (in an effort to avoid dullness),
    I’ll take you into the world of Linux fun and games.


    # Quick Tips and Shelling Out


    Throughout the book, I occasionally provide you with boxed asides, tips that should
    serve as little reminders or simpler ways to do things.


    You’ll also notice boxes that start out with the phrase “Shell out.” Although
    I intend to concentrate on working with graphical tools and in a graphical way,
    much of the power of Linux comes from working with the command line, or the shell.
    The Shell Out boxes will guide you in working with the shell.


    Learning to wield the command line is akin to getting a black belt in a martial
    art or earning a first aid certificate. It doesn’t mean that you are going to
    run out and take on all comers or that you are going to be facing daily crisis
    situations. Working with the shell does give you the means and the confidence
    to step outside the confines of the graphical environment. The shell is power,
    and it is always there for you, so you should not fear it.


    # Meet Your Desktop


    Your Ubuntu Linux system comes with a modern, advanced, and easy-to-use desktop
    environment known as GNOME. There are many such environments, and in time, you
    will learn about them. Part of that freedom I spoke about is the freedom to do
    things your way, and that extends to the type of graphical environment you may
    want to work in. The most popular desktop environments today are the K Desktop
    Environment (KDE) and GNOME, but WindowMaker, IceWM, XFCE, and others have quite
    a following, as well.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 10


    Ubuntu Linux is just one face of a handful of simplified, fine-tuned, Linux distributions.
    There is another version of Ubuntu being distributed called Kubuntu, the difference
    being that it uses KDE as its default desktop environment. In Chapter 20, I''ll
    tell you how to install and run the Kubuntu default environment, the KDE desktop.
    Don''t worry; you won''t be giving anything up. You can easily switch from one
    to the other as you so desire.


    > Note This may sound repetitive, but it is important. Kubuntu is Ubuntu. It just
    happens to be Ubuntu Linux running KDE as its desktop environment. It is not a
    fork of Ubuntu, nor is it a different distribution.


    When you become comfortable with GNOME and Ubuntu Linux, I invite you to experiment
    with other desktop environments. Exercise your freedom to be yourself.


    # Help Me!


    After you are done working with this book, I am confident that Ubuntu Linux will
    be your operating system of choice for the foreseeable future. That doesn''t mean
    you won''t have questions that aren''t answered in this book. To that end, I give
    you a Web site address that will link you to the support pages for this book on
    my own Web site:


    ```

    http://www.marcelagne.com

    ```


    My site has links to a number of other resources, including many articles I have
    written on using and administering Linux, links to other information sites, and
    much more. Click the Moving to Ubuntu link (or its cover), and you''ll be transported
    to the support pages for this book.


    I also run a few mailing lists for readers, which you''ll find under the WFTL
    heading. WFTL is a short form I''ve used for years now. It stands for Writer and
    Free Thinker at Large (computer people love acronyms). It''s also the hierarchy
    for the lists I''m talking about. One of those lists is the WFTL-LUG (a LUG is
    a Linux User Group), an online discussion group where readers can share information,
    ask questions, and help each other out with their various Linux adventures. I
    invite you to join any of the lists I offer there. There is no cost, and you can
    unsubscribe at any time.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Help Me!


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_33_0.png)


    If you check under the Linux Links menu of my Web site, you''ll find a useful
    list of additional links to Linux information sources. One of these is the Linux
    Documentation Project (LDP).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_33_1.png)


    > More Help In Chapter 3, I''ll introduce you to your GNOME desktop''s help system.
    It''s a great tool with tons of additional information right at your fingertips.


    # The Ubuntu Community


    One of the very best places to turn for additional information on your Ubuntu
    system is the Ubuntu community. You will find a large number of people with considerable
    knowledge and information in doing things the Ubuntu way. This community includes
    developers, documentation writers, and perhaps most importantly, Ubuntu users.
    This is a vibrant, growing community, providing many different options for locating
    the help you need.


    The first place to start is the Ubuntu Linux Web site (www.ubuntu.com). Closely
    tied to the Web site is the Ubuntu Wiki, a regularly updated, community-supported
    source of information. The Wiki is at wiki.ubuntu.com. Also on the Web are the
    Ubuntu forums at ubuntuforums.org.


    Log on to the #ubuntu IRC channel on irc.freenode.net (see Chapter 9 for information
    on IRC), and you''ll find between 500 to 600 people logged on at any time of the
    day or night. Ask your questions and it''s very likely that somebody has answers.


    You can also join the Ubuntu Users mailing list by visiting this site:


    ```

    https://lists.ubuntu.com/mailman/listinfo/ubuntu-users

    ```


    Finally, you can also check Yelp, the included help documentation browser included
    with your Ubuntu Linux system. For more information on using Yelp, see Chapter
    3.


    # The Linux Documentation Project


    The Linux Documentation Project (LDP) is a dynamic community resource. On your
    Linux distribution CD, you probably have a collection of documents known in the
    Linux world as HOWTOs. These are user- or developer-contributed'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'documents that are maintained and updated by one or more individuals. You can
    find the latest version of these documents at the LDP site


    http://www.tldp.org/


    The mandate of the LDP is essentially to provide a comprehensive base of documentation
    for all things Linux. If you’ve been looking high and low for information on installing
    that bleeding-edge FTL radio card on your PC and still haven’t found what you
    are looking for, try the LDP. The LDP also makes a point of offering the latest
    versions of the man pages, as well as user guides that tend to cover more ground
    than standard HOWTOs.


    # ## Linux User Groups


    A few paragraphs back, I made reference to Linux User Groups, or LUGs. Let’s put
    technology aside for a moment and explore something else you may have heard about:
    the Linux community. Yes, there really is a Linux commu-nity. All around the world,
    you will find groups of enthusiastic Linux users gathering for regular meetings,
    chatting over beer and pizza, and sharing information. This sharing of information
    is part of what makes Linux so friendly.


    LUGs tend to run electronic mailing lists where informal exchanges of information
    take place (just as I do with my online LUG). New users are wel-comed, and their
    questions are happily answered. These users range from newbies getting their feet
    wet to seasoned kernel developers. Should you find yourself stuck with nowhere
    to turn, seek out your local LUG and sign onto the mailing list. Today, someone
    will help you. As you grow more knowledge-able in administering your Linux system,
    maybe you will return the favor.


    Locating a LUG in your community is as simple as surfing over to the Linux Online
    Web site (http://www.linux.org/). Once there, click the User Groups button, and
    you are on your way. The list is organized by coun-try, then by state or province,
    and so on.


    # ## About the DVD


    Included with this book is a full Ubuntu Linux distribution that you can run entirely
    from your PC’s DVD-ROM drive (though slower than if you actually install Ubuntu
    Linux). That’s right. You can run Ubuntu Linux on your sys-tem without having
    to change your system or uninstall Windows.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'This DVD includes a complete Ubuntu system with tons of great software that
    I will be covering in this book. You''ll have access to your email, manage your
    contacts, keep organized, surf the Web, write letters in your word processor,
    use spreadsheets, play games, and more. In fact, you should be able to follow
    along with this book and do most of the things I talk about without having to
    install Linux at all.


    Furthermore, the DVD also contains an archive of all Ubuntu supported packages,
    including many not available in the live session. I''ll show you how to install
    additional software from the DVD in Chapter 8.


    The bootable DVD is a fantastic introduction, but remember what I said about performance.
    The DVD does run *much slower* than a hard-disk install, so keep in mind that
    the performance you experience from the DVD is not indicative of the performance
    you can experience from a Linux hard-disk install. At their fastest, DVD drives
    are no match for even the slowest hard disk drive. Furthermore, when you run from
    the DVD (as opposed to installing Ubuntu Linux on your hard drive), you are limited
    to the packages on the DVD. In other words, you can''t add or install any new
    software.


    Ready to take Ubuntu Linux for a spin? The bootable DVD is a *perfect* introduction.
    I''ll tell you all you need to know in the next chapter.


    When you are truly ready to make the move to Ubuntu Linux, you can install it
    right from the same DVD. I''ll tell you about that as well.


    # It''s My Philosophy


    I have a philosophy. All right, I have *many*, and this is just one of them.


    Every once in a while, people tell me that desktop Linux is just crazy, that it
    is just too complicated for the *majority of people*.


    I don''t know about you, but I am tired of being told that people can''t learn
    to use something that is both good and powerful. With a certain amount of training
    and a little proper guidance, anyone who is *familiar with a computer can learn
    to use Linux*.


    That isn''t to say that working with Ubuntu Linux is difficult (it is not), but
    as you go along, you will be learning new things. This book is meant for users
    at every level of experience. It is meant to be read for fun, as well as for reference.
    And because I''ll ask you to try things throughout this book, it''s a training
    guide, as well.


    I''m delighted and thrilled that you''ve decided to join me in *Moving to Ubuntu
    Linux*. It''s not just Linux for human beings; it''s an operating system for real
    people doing real things.'
  merge: -1
  img_proc: true
