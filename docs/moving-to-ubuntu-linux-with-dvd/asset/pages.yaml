- pgno: 144
  md: '# Print Jobs—Where Are My Print Jobs?


    When you send something to the printer, you generally expect action quickly. Something
    better start coming out of that printer soon. If there is something wrong with
    the printer or you are sharing that printer with others, you may find yourself
    waiting, at least a little while, before your precious printout appears. The easiest
    way to find out how many jobs you are in the queue is to open the Printers dialog.
    Remember, you do that by clicking System on the top panel and selecting Printers.


    Directly under the icon representing your printer, you see a message telling you
    that it is printing and how many jobs it is printing (for example, *Printing 2
    jobs*). For more details, double-click the printer icon to open up the printer’s
    job queue (see Figure 6-9). The plus side of doing this is it also gives you the
    opportunity to pause printing, print test pages, and resume jobs.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_144_0.png)


    **Figure 6–9**    Double-click the printer icon to bring up the print queue information.


    Let’s face it. From time to time, we all end up sending something to the printer
    we wished we hadn’t. “No, I only meant to print the first 5 pages, not 500!” Luckily,
    you can also cancel a job. Just click the line to highlight it, and then click
    Edit on the menu bar, followed by Cancel Jobs. See, printers aren’t so scary after
    all.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Meeting new people isn’t always easy. Sociologists tell us that there is a
    complex interplay that takes place whenever we meet someone new, much of it subconsciously.
    Although it is possible to meet someone and instantly like him or her, it is more
    likely that you become comfortable enough to develop a friendship only after having
    been around a person for some time—in other words, after you’ve gotten to know
    a person better.


    Now, what the heck does this have to do with hardware and your Linux system?


    Well, it’s like this . . . . For most, the computer we use is a black (or beige)
    box with a few things plugged into it and some magic happening inside that makes
    it possible to surf the Internet. Anything that falls outside the small subset
    of applications we use makes us uneasy. That’s why the notion of trying something
    new may be intimidating. The best way to get over that is to become comfortable
    with what you have.


    Ubuntu’s Device Manager is a great place to start for getting to know what makes
    up your system (see Figure 6-10). You can find it by clicking the System menu
    on the top panel and selecting Device Manager from the Administration submenu.
    Or, you can bring it up by pressing <Alt+F2> and typing in **hal-device-manager**,
    its program name.


    As soon as the Hal Device Manager loads up, you’ll notice that the program window
    is broken into two panes. The left side lists all the various device classes and
    subclasses that make up your system. Beside each major item, there’s a small arrow
    that collapses or expands that particular device or device class’ components.
    Click any item and details about that item are displayed in the right pane.


    Why don’t we take a few minutes to explore this hardware landscape? Let’s start
    with PCI devices.


    # # PCI Devices


    Adding a PCI device definitely requires a reboot because we are talking about
    internal devices, though your system likely has PCI devices already installed.
    These are cards that fit into the slots inside your computer. When you reboot
    the machine, Linux should be able to scan for these cards and identify them without
    any problem. When you click a PCI device, you’ll see that a third tab appears
    in the right pane. Click the tab to get more vendor-specific information on the
    device (see Figure 6-11). This is particularly useful if there is a configuration
    issue and you need to identify your device’s make and model number.'
  merge: -1
  img_proc: true
