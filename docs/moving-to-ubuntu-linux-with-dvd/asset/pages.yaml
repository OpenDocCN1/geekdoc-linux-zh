- pgno: 163
  md: 'I covered devices in the previous chapter, specifically the issue of modems,
    and it is particularly relevant here. If you click the Modems tab, you''ll notice
    that the modem port is not set. Click the drop-down list and you''ll see several
    possibilities including `/dev/modem`, which is a symbolic link to the actual port
    for the modem. That might be `/dev/ttyS0`, but it could be many other things,
    as well. You have the option of specifying the modem port yourself, but the easiest
    way to discover the modem is to click the Autodetect button (see Figure 7-5).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_163_0.png)


    **Figure 7-5** If you don’t already know where your modem is connected, click
    the Autodetect button.


    The Dial Type setting lets you choose between tone and pulse dialing. I can’t
    personally remember encountering a pulse service for many years now, but if yours
    still uses it, click the drop-down box and select Pulses instead of Tones. Finally,
