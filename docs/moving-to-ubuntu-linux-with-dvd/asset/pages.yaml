- pgno: 66
  md: 'Enter your username and press <Enter>. The login manager then asks you to enter
    your password. Ubuntu logs you in to a default desktop with a given look and feel
    that you can change to suit your needs and tastes, something we''ll talk about
    in detail in the next chapter.


    # ## Becoming One with the Desktop


    Your Ubuntu Linux screen has two panels, one at the top of the screen and one
    below. Each provides quick access to different functions, which I''ll cover individually.
    Let''s start with the top panel (see Figure 3-2).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_66_0.png)


    The **Applications** starter in the top left is similar to the Start button on
    that other OS. Clicking here drops down a menu of menus, a list of installed applications
    that you can run with a single click. Two other menus follow, one labeled **Places**,
    and the other **System**. **Places** concerns itself with your storage media including
    disks, mounted CDs, USB storage keys, and so on. **System** covers system functions
    such as logging out, shutting down, changing personal preferences, and administering
    your Ubuntu Linux system. Finally, to the right of the **System** menu, there
    may be one or more icons providing ready access to a popular application. In a
    standard Ubuntu installation, you''ll see one for **Firefox** (the Web browser)
    and one for **Evolution** (an email client).


    Let''s move to the far right of the top panel, just before the clock. As you run
    more and more programs, you might notice small icons embedded in the panel, next
    to the speaker icon. These icons also represent programs, but running programs
    hidden more or less out of sight (this saves clutter in the panel). These applications
    have been iconified (*swallowed*) by the panel and can be called up with a click.
    That mini-icon area is called the *notification area*. In Figure 3-3, you can
    see the Rhythmbox music player, the Gaim Instant Messenger icon, and the system
    update notification applet.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_67_0.png)


    Figure 3-3 The three icons on the left side are in the notification area of the
    top panel.


    Speaking of running applications, let’s take a look at the bottom panel (see Figure
    3-4). When you start an application, you see it listed in a portion of the bottom
    panel known as the window list (you may know it as the taskbar). This not only
    shows you what you have running on your desktop, but it also provides a quick
    way to switch from process to process. Just click the program in the window list.
    Alternatively, you can press <Alt+Tab> to switch from one running program to another.
    The window list can be configured to list all processes from all desktops, group
    similar processes together, or simply show you what is on your current workspace.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_67_1.png)


    Figure 3-4 The bottom Ubuntu/GNOME panel. Once again, the left and right sides
    of the panel are zoomed to show detail.


    Workspaces, sometimes referred to as virtual desktops, are one feature you are
    going to absolutely love! On the default installation, you’ll notice four little
    squares on the right side of the bottom panel. This is your desktop switcher,
    allowing you to switch between any of the four virtual desktops with a mouse click.
    Think of it as having a computer monitor that is four times as large as the one
    you already have, with each desktop running different things. You can leave each
    one the way you want it without having to minimize windows so that you can come
    back to the virtual desktop later and see everything as you left it. It gets better:
    You can have four, five, six, or even more virtual desktops if you find that four
    aren’t enough for you (see Figure 3-5).


    To change the number of workspaces, right-click any of the workspace squares and
    select Preferences from the pop-up menu. A window labeled Workspace Switcher Preferences
    appears listing, among other things, the number of workspaces. Change that number
    to whatever you like.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_68_0.png)


    Figure 3–5  The desktop switcher with six virtual desktops.


    Finally, there’s a little wastebasket icon to the far right. You can drag and
    drop files and folders into the trash can, but you can also click the trash can
    to see the contents (that is, items you deleted). We’ll talk further about the
    wastebasket shortly.


    # ## Your First Application


    It’s time to really get into this, nail down some terminology, and get you working
    with the system. Starting a program or opening up an application is as simple
    as clicking an icon. Let’s do that. In fact, let’s open up the great **GNOME**
    application, *Nautilus*.


    You’ll be using Nautilus a lot. This is the GNOME file manager and it lets you
    work with files and folders. Nautilus makes it easy to create folders (or directories,
    as they are known in the Linux world), copy, delete, and move other folders and
    files around by dragging and dropping from one to the other. Nautilus is also
    a universal file viewer so you can view and organize your photo collection, preview
    documents, and much, much more.


    There are several ways to get Nautilus running on your desktop, but let’s start
    by clicking Places in the top panel and selecting Home Folder from the drop-down
    menu. This opens the Nautilus file browser in your home directory. The window
    that opens looks something like Figure 3–6, minus a few folders and documents,
    of course.


    On the left, Nautilus shows a small list of important places on your system, primarily
    in your home folder. This side panel is the *navigation panel*. Pressing <F9>
    hides (or brings forward) the navigation panel. Beside the Places label, there
    is an arrow, alerting you to the fact that this is actually a button with a drop-down
    list of options. Click here and you can switch between a list of your places,
    information on the current folder, notes regarding the information in those folders,
    and an easy-to-navigate tree-like view of your file system.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_69_0.png)


