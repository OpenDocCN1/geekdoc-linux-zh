- pgno: 403
  md: '# # Chapter 21

    # Taking Command of

    # Ubuntu Linux


    Think of this chapter as an extended Shell Out section. That means it is time
    to transform you into a master or mistress of the shell. In deciding to join me
    here, you have identified yourself as one of the bold and curious explorers who
    really wants to know his Linux systems. Sure, it is possible to work day in and
    day out with your Linux system and rarely use the command line, but the command
    line is power. Your reward for continuing to this next level is a deeper understanding
    of your system and the power to make it do whatever you want.


    The things I want to talk about here are basic commands that will serve you well
    throughout your time with Linux. One of the things I hope to show you is how flexible
    some of these commands are. With most, you can modify the basic function with
    command-line switches, flags, or options, and thereby have them yield far more
    information than a simple execution of the command itself. A little thirst for
    exploration will open you up to the real potential of everyday commands.'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'Before I wrap up this chapter, I will also cover editors. Editors aren''t a
    lux-ury or an option but an eternal necessity in the life of the system administra-tor.
    Every once in a while, you will have to edit some configuration file or other
    in order to get your work done. I''ll give you some pointers for making this as
    simple and painless as possible.


    # Linux Commands: An Easy Start


    When you talk about commands, it invariably means working at the shell level:
    the command prompt. That''s the dollar sign prompt ($), and it is com-mon to many
    command shells. Some of the commands I will give you require administrative privileges.
    When this is necessary, I''ll have you type sudo before the command, at which
    point you will be asked for your password. It is possible to maintain administrative
    privileges over the course of several com- mands by typing sudo -1. When you are
    running in admin mode, you will see a different prompt (#), which goes by many
    names. In North America, we call it the pound sign or the hash mark. My English
    lit friends tell me it''s an octothorpe. Others call it the tic-tac-toe board.


    To exit admin mode, you just type exit. However, in my examples, I''ll prepend
    all admin commands with sudo. Whether you choose to enter an extended admin session
    is something I leave up to you. That said, for most of this chapter, a non-admin,
    dollar-sign prompt ($) is the way to go. Never run as the administrator unless
    you need to.


    # Getting to the Shell


    If you are running from a graphical environment, as you likely are, start a Ter-minal
    session by clicking Applications on the top panel, and selecting Terminal from
    the Accessories submenu. The GNOME terminal program supports tabbed shells so
    you can run multiple shell sessions from one terminal window (see Figure 21-1).
    Just click File on the menu bar and select Open Tab. You can then click back and
    forth from one shell to the other. You can even cut and paste between sessions.
    This is very handy if you are working on multiple systems.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_405_0.png)


    **Figure 21-1** Running commands from a bash shell inside the GNOME terminal.


    As you work your way through this chapter, you''ll notice that I toss in little
    boxes like the one that follows. If these commands are not already in your arsenal,
    spend a few minutes playing with them and finding out what they do.


    # Commands to Know and Love, Part 1


    +   - **date** Date and time.

    +   - **df -H** Show me how much free space my disks have, in a nice, human-readable
    format.

    +   - **who** Who is logged on to the system?

    +   - **w** Similar to who but with different information.

    +   - **cal** Show me a calendar.'
