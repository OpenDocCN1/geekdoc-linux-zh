    # A Note About Backups


    By now you must be thinking, "Hey, if I can copy data directories to my CD, surely
    this is the perfect way to do backups." It certainly sounds good. CDs allow you
    to back up roughly 700MB of data, and DVDs a whopping 4GB. Use CD-RWs, and you
    can create a rotating set of discs for backup purposes. So what''s the catch?


    Well, for starters, the default Nautilus view does not show hidden files. If you
    want a complete backup, you need to make sure you get everything.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'When navigating Nautilus, make sure you click View on the menu bar, and then
    select Show Hidden Files.


    The second problem has to do with permissions. If you are going to use this system
    to later restore your data, you need an intermediate step. You need to create
    an archive of those files. Let''s say you had selected a whole collection of configuration
    files, or email, or anything else for that matter. Right-click the selected files,
    then select Create Archive. The Create Archive dialog appears (see Figure 18-16).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_358_0.png)


    **Figure 18-16**  An archive not only protects file permissions, but also takes
    up far less space on your backup device.


    The Archive field is where you enter the filename in which you want all this information
    stored. To the right of the name is a drop-down box with .tar.gz selected. This
    is the default storage format, but several others are also available including
    .tar.bz2, .zip, and more. The Location is a folder where this archive file will
    be written. Click Create and a process dialog appears as files are added and compressed.


    When the archive is done, drag that into the CD/DVD Creator window instead of
    the individual files.


    That''s it. With your data safely backed up, you can sleep soundly at night.


