  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_138_0.png)


    In my example, the system handily noticed my HP printer and all was well from
    the start. Click Forward and we get to the driver selection screen. Because the
    printer in this case was properly identified, the system also offers a driver
