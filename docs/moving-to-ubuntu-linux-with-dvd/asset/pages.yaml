    > **Shell Out** Open a terminal shell by selecting **Terminal** from the *Accessories*
    submenu under the top panel *Applications* menu. At the shell prompt, type **ls
    Desktop**. The `ls` command lists the contents of your Desktop directory. Compare
    what you see there with the icons currently on your graphical desktop. Do the
    names look familiar? When you are done, type **exit** to close the terminal.


    Directories (and subdirectories) usually show up as folders, although this isn’t
    a hard and fast rule because you can customize this. Nevertheless, some directories
    have different icons right from the start—the Desktop icon you just visited being
    one of them.


    # Wherever You Go . . .


    To move from folder to folder, you can simply click a folder in the Tree view
    or double-click a folder icon in the right pane or the Places view. You can also
    move around the directory tree by using your *cursor keys*. You’ll see the highlight
    bar move from directory to directory. To see the contents in the main window,
    move to a folder and press <Enter>. To go up a level in the directory tree (rather
    than folder by folder), press <Alt+Up Arrow>.


    There’s another way, as well. If you look up at the menu bar, you’ll see an up
    arrow, a left-pointing arrow, and a right-pointing arrow (see Figure 4.4). Next
    to that is an icon to stop a listing (if it is taking a long time), to reload
    a location of folder, and finally, an icon labeled Home. Clicking that house icon
    always takes you back to your personal home directory. Clicking the up arrow moves
    you up the directory tree, and the left arrow takes you back to whatever directory
    you were last visiting.'
