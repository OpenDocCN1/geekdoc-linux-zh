- pgno: 38
  md: '> Note  Because it is running from the DVD drive, Ubuntu Linux live DVD runs
    slower than if you actually install Linux and run it from the hard disk. Keep
    in mind that the performance you experience from the DVD is not indicative of
    the performance you can experience from a Linux hard-disk install. At their fastest,
    DVD-ROM drives are no match for even the slowest hard disk drive.


    Running Ubuntu Linux is as easy as putting the DVD in the drive and booting. A
    couple of minutes later, you are working with a great looking, modern desktop
    (see Figure 2-1). This DVD is full of great software. There are tons of applications
    and literally thousands of programs on the disk. You''ll be able to send and receive
    email, surf the Web, write documents in your word processor, put together a budget
    using the spreadsheet package, play a


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_38_0.png)


    Figure 2–1  Meet your new Ubuntu Linux live desktop!'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'few games, and a whole lot more. In fact, you should be able to follow along
    and play with the software you''ll explore in this book and do most of the things
    that are covered without having to install Ubuntu Linux at all.


    The bootable DVD is a fantastic introduction to Ubuntu Linux, providing you with
    a no-commitment way to take Linux out for a spin; but there are limitations.


    I''ve already covered one issue related to DVDs, that of performance. The other
    limitation is also DVD related. Because this bootable Linux does not install itself
    on your hard drive, you are limited to the packages on the DVD. In other words,
    you can''t add or install any new software. After you install Ubuntu Linux to
    your hard drive, this limitation will vanish and you can choose to install from
    thousands of great packages. In fact, the DVD includes all of the Ubuntu supported
    packages so you''ll have thousands more programs to choose from—all this without
    having to download from the Internet.


    # ## Ready to Try Ubuntu Linux?


    Loading the Ubuntu Linux live DVD is easy because there is no installation required.


    Take your DVD and insert it into your DVD-ROM drive. Shut down Windows, and select
    Restart. Make sure your PC is set to boot from the DVD. Ubuntu Linux boots up
    to a nice, graphical screen with a simple menu (see Figure 2-2). Booting from
    the disk is the first option; just press Enter or wait. After a few seconds, the
    system will boot automatically. Before you do that, however, notice the menu option
    labeled Check CD for Defects. This is a very good idea if you plan on installing
    Ubuntu to your hard drive, and I highly recommend that you run this step.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_39_0.png)


    > Most modern systems are set to boot directly from the DVD-ROM drive if a bootable
    DVD is found there. If your system does not, you may have to change the BIOS settings
    on your PC to allow this. This is generally done by pressing *Delete* or *F2*
    to enter Setup as the system is booting. (You will usually see such a message
    before the operating system starts to load.) Because the menus vary, it is impossible
    for me to cover them all, but look for a menu option that specifies the boot order.
    You''ll see something like A: first, then C: (i.e., your floppy drive, then the
    hard disk). Change the boot order so that it looks to the DVD first, save your
    changes, and then restart your system.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_40_0.png)


    Figure 2–2 The boot menu provides a means of checking the DVD for defects.


    The boot process takes a few minutes as Ubuntu identifies devices, disks, network
    connections, sound cards, and so on. At some point, the screen will go dark as
    your video card is configured and *X*, the Linux graphical user interface, is
    started.


    If the screen doesn''t respond instantly, don''t panic. Give it a few seconds.
    If nothing has happened even after you''ve waited awhile, it is possible that
    your video card is one of the rare ones not included in the distribution. Never
    fear, most (if not all) modern cards support VESA, and Ubuntu should fall back
    to this setting.


    # **HELP!**


    Problems, problems . . .


    The DVD is amazingly good at automatically booting and running on a huge number
    of systems, but it isn''t perfect. There is only so much software that you can
    pack on one DVD and that includes drivers for hardware. That said, most problems
    with booting the Ubuntu live DVD can be resolved.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'You might have noticed when the boot screen came up (refer to Figure 2-2) that
    there were a number of options at the bottom of the screen: <F1> Help, <F2> Language,
    and so on. Some of these are fairly obvious. Pressing <F1> gives you further assistance.
    If you don''t want to run Ubuntu with English as the default language, press <F2>
    and select an alternate from the list. Closely related is <F3>, which lets you
    select an alternate keyboard for the language of your choice.


    Getting a proper graphical display is not generally a problem, but if all else
    fails and you still can''t get a good, clear screen, try pressing <F4> and selecting
    VGA as your video type. Ordinarily, Ubuntu scans for and assigns the proper video
    driver based on your card. Several accessibility options are also built in to
    the boot screen that allow users with visual impairments of varying degrees to
    choose a more suitable environment. There are also settings for users with minor
    motor difficulties who may have trouble with a mouse or other pointing device.
    You can access these at boot time by pressing <F5>.


    As the system boots, most everything is done for you. This is what is referred
    to as Normal mode and it is the best choice, 99.9 percent of the time. For those
    who might want total control over every aspect of the boot, device detection,
    hardware configuration, and so on, it is possible to switch to Expert mode by
    pressing <F6>.


    # Boot Level Options


    The biggest set of boot changes are those that can be added to the boot command
    prompt itself, directly beside the Boot Options label. For instance, it is possible
    that you might experience lockups on boot or strange hardware glitches that stop
    the system from booting, a not uncommon problem with buggy APIC controllers (Advanced
    Programmable Interrupt Controller). To disable the APIC, press <F6> to bring up
    the boot prompt, then add this line to the end of the existing options:


    ```

    noapic

    ```


    Press <Enter> and the machine will boot normally but with the APIC disabled. Some
    of the prompts do not deal with actual problems. They just speed things along.
    An example of this has to do with network configuration. Normally, the Ubuntu
    live DVD will configure its network card for DHCP with the idea that an address
    will automatically be provided by another machine on the network. You can always
    change this after the system is up'
  merge: -1
  img_proc: true
- pgno: 42
  md: '(networking is covered in Chapter 7), but it is possible to force a static
    IP address at boot time.


    ```

    disable_dhcp=true

    ```


    To see a much more comprehensive list of boot parameters, press <F1> to enter
    the help screen, then press <F5> for an overview of boot parameters, <F6> for
    parameters dealing with specific machine hardware, <F7> for parameters related
    to disk controllers, and <F8> for those related to the boot process itself.


    # Taking a Tour of Ubuntu Linux


    After the system has booted, you can start playing with Ubuntu Linux. From here,
    you can follow along in the book and try the various programs covered. To get
    you feeling at home quickly, however, let me give you a quick tour of the menus
    and I’ll show you what your system has to offer.


    Looking at your Ubuntu desktop (refer to Figure 2-1), you can see that there is
    a gray panel running along the bottom and along the top of your screen. I will
    cover all the details of those panels, what they are, what they can do for you,
    and how you can modify them to suit your needs in Chapters 3 and 5. For the time
    being, I want you to look at the labels along the top panel and to the left. One
    says Applications, followed by Places, and finally, System. Each of these represents
    a menu of possibilities, granting you access to the great programs included with
    your Ubuntu Linux system, your computer’s hardware, storage devices, peripherals,
    and the tools you need to customize every aspect of your Ubuntu Linux experience.


    Start by clicking the Applications button. Then, pause your mouse cursor over
    the Accessories menu, where you’ll see some handy system tools (see Figure 2-3).


    The Alacarte Menu Editor (sounds yummy, doesn’t it?) is a program designed to
    let you add or remove, or even modify, menu items. Sometimes, a program doesn’t
    appear where you would like it to go or another program that you use regularly
    isn’t available there. Alacarte is how you change things. Calculator is a simple
    calculator when it starts, but it also provides advanced functions, including
    business, financial, and scientific functionality. Character Map is a program
    that makes it easy to insert international and special characters not directly
    available from your keyboard (useful when your last name has an é at the end).'
  merge: -1
