- pgno: 127
  md: 'When you are happy with your changes, click OK. Your new program link (which
    you can launch with a double-click) should appear on your desktop.


    **Shell Out** To create a shortcut icon for a command, you first have to know
    what the command is and where it is. To be honest, a command or program (such
    as the GNOME calculator, *gnome-calculator*) could be almost anywhere on the disk.
    For the most part, *programs* tend to be in one of the *bin* directories—*/bin*,
    */usr/bin*, or */usr/local/bin*. You can also use the *whereis* command to tell
    you exactly. For instance, to know where the *gnome-calculator* program is, I
    would type the following at the Terminal shell prompt (the dollar sign (*$*)).


    ```

    sh-3.1$ whereis -b gnome-calculator

    gnome-calculator: /usr/bin/gnome-calculator /usr/bin/X11/gnome-calculator

    ```


    In some cases, you may see more than one file associated with a program''s name,
    but the actual executable to use is in */usr/bin*. The *bin*, in this case, stands
    for binary—in short, a program.


    To get an even shorter return on your search, use the *which* command:


    ```

    sh-3.1$ which gnome-calculator

    /usr/bin/gnome-calculator

    ```


    **Tip** If the application you want on your desktop appears in the menu, you can
    just click the item and drag it onto your desktop. When you release the mouse
    button, the icon appears.'
  merge: -1
