- pgno: 187
  md: 'take a look at this short introduction to package administration using the
    Linux shell.


    In the Debian world, of which Ubuntu is a part, there are two useful com-mands
    for dealing with packages at the command line: `dpkg` and `apt-get`. The most
    basic method of installing a package is with this format of the `dpkg` command:


    ```

    sudo dpkg --install ft1-transport_2.1-1ubuntu1.deb

    ```


    `dpkg` is the basic package installation tool for Debian and Debian-based systems
    such as Ubuntu. The previous command installs the package. This one removes it:


    ```

    sudo dpkg --remove ft1-transport

    ```


    > **Note** If it looks like I am saving keystrokes here, there is a rea-son. I
    only indicate the package release number and subsequent extensions at installation
    time. To remove a package, you only need the package name itself.


    You should be aware that there is another step to consider when removing a package.
    Although the program is now gone from your system, its configu-ration files remain
    (which can be a good idea). To get rid of those as well, you need to purge the
    package:


    ```

    sudo dpkg --purge ft1-transport

    ```


    Now that I have had you do it the long way, you could start with a purge to both
    remove the package and purge the configuration files in one step.


    # Great, but Can You Tell Me What Is Already There?


    Sure thing. If you want to get a list of every package on your system, use the
    `--list` option to `dpkg`. You might want to pipe that output to the more command:


    ```

    dpkg --list | more

    ```'
  merge: -1
  img_proc: true
