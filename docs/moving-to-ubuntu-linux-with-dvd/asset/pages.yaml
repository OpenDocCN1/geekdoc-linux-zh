- pgno: 341
  md: '# # Chapter

    ## 18


    # ### If Music Be the Food of Love . . . (Ubuntu Linux Multimedia)


    Playing music on your Linux system is only the beginning of the multimedia experience.
    After all, multimedia isn''t just about music. It represents a cornucopia of sensory
    experience delivered digitally, comprised of text, audio, video, and endless combinations
    of the three.


    Most modern Linux installations offer an impressive selection of programs to satisfy
    your cravings for the multimedia experience, from audio to video and everything
    in between. These programs include sound control systems, CD players, recorders,
    MIDI programs of varying flavors, music synthesizers, video players, music notation
    programs, and . . . the list goes on.


    In this chapter, I''m going to cover some of the more popular multimedia tools
    for your Linux system. So, as old William Shakespeare might have said, "If music
    be the food of love, then multimedia must represent the smorgasbord."'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Adjusting the Levels


    Think back for a moment to those days of old when Mom or Dad would yell into your
    bedroom to "TURN THAT NOISE DOWN!" Doesn''t that bring back memories? In particular,
    it brings back the memory that sometimes you just have to crank the tunes.


    Most music or multimedia players you are likely to use under Linux have some kind
    of a volume control. Your speaker system likely has one, as well. There is, however,
    a third set of controls you should know about: the GNOME volume control. Look
    over to the right of the top panel and you should see an icon that looks like
    a speaker. Click that speaker icon and a simple volume slider appears (see Figure
    18-1). This provides you with a fast means of making volume-level adjustments.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_342_0.png)


    Under certain circumstances, you''ll want finer control over the levels of certain
    devices, at least better than the single slider can provide. Either double-click
    the top panel speaker icon or right-click the icon and select Open Volume Control
    from the drop-down menu. A Volume Control three-tabbed mixer panel appears with
    your system sound card''s name alongside (see Figure 18-2).


    The various sliders correspond to various levels, from that of your hardware''s
    master levels to the PCM output, microphone inputs (under the Capture tab), and
    so on. Pause your mouse pointer over the sliders and a message describing the
    slider''s function appears at the bottom of the window.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_343_0.png)


    **Figure 18–2** The GNOME volume control can be configured to show multiple levels.


    > *Note* The number of sliders and controls vary from sound card to sound card
    and they may not all be activated by default. Click Edit on the menu bar, then
    select Preferences. Check boxes representing the possible input and output sources
    appear. To add one to your mixer control panel, check the appropriate box.


    Now that you can easily modify the level of *noise* coming from your speakers,
    it’s time to get some music on.


    # # Playing Audio CDs with the Sound Juicer


    Try this. Get your hands on your favorite music CD and pop it into your Ubuntu
    system’s CD drive. As I write this, I’ve got my Pink Floyd *Echoes* album handy,
    so I’ll use that as an example. A few seconds later, the Sound Juicer application
    window appears (see Figure 18–3). Sound Juicer, which you can also start from
    the Sound & Video menu under Applications on the top panel, is the default CD
    player for Ubuntu.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_344_0.png)


    **Figure 18-3** The Sound Juicer is a multiuse multimedia application. Aside from
    being the default Ubuntu CD player, it is also a CD ripper.


    Along the top, there are fields identifying the Title of the CD, the Artist, and
    the Genre. Directly below this information is a list of all the songs on that
    CD. Because I mentioned that this is the default CD player, I cover this aspect
    of the program first. Notice that all of the songs are selected when the CD is
    inserted (the check box to the left of the title).


    Click the Play button, sit back, and enjoy the music. Each song on the CD is then
    played in sequence. As songs are played, the Play button turns into a Pause button.
    To skip a song, just double-click the song title you want to hear and Sound Juicer
    abandons your current selection and jumps to the track of your choice. Next to
    the track number, a little speaker icon appears showing you the song being played.
    The track title also appears in Sound Juicer''s title bar.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Sound Juicer is also a CD ripper, allowing you to make personal copies of your
    music to play on your Linux system or on a portable player. I’ll cover this in
    detail shortly, but I want to wrap up CD playing. That means I’m going to leave
    the Sound Juicer behind for a moment so I can tell you about another CD player.


    # ## A Simpler CD Player


    Although it doesn’t come up automatically, and you can’t find it in the Applications
    menu, Ubuntu has another CD player that you might prefer, the GNOME CD player.
    If all you want to do is play your CDs and you want a simple, easy-to-use interface,
    look no further. Press <Alt+F2> to bring up your quick-start application starter
    and type in `gnome-cd`. The CD player launches (see Figure 18-4). Click the Play
    button, sit back, and enjoy.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_345_0.png)


    > **Tip** If you can’t find the CD player, install it with Synaptic. Look for
    and install the `gnome-media` package.


    On the left of the player, just above the Pause button, there’s a button with
    a tool icon. Click this button to bring up the CD player preferences dialog. Next
    to that is the standard list of controls to skip over songs, fast forward, or
    stop. On the far right of the CD player, there’s a vertical slider control. That’s
    a volume control.'
