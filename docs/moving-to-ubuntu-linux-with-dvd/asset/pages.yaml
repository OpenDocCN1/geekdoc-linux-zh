- pgno: 196
  md: 'The jabber.org server provides space and resources for people to get free instant
    messaging accounts and you can choose to take advantage of this service. However,
    some companies use their own instant messaging server for security and audit reasons.
    In this case, you change the Server field to be something other than jabber.org,
    such as chat.yourcompany.dom.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_196_0.png)


    You can either sign on here (by clicking the Online check box) or click Close
    and sign on from the main Gaim window. With your first time in, you get a welcome
    message from the Jabber.org server. You can close this window or visit the site
    (as indicated in the message) for additional information.


    Now that you have your very own Jabber instant messaging account, you need some
    people to talk to. There are online chats that you can join by clicking Buddies
    on the menu bar and selecting Join a Chat. You can also use the keyboard shortcut
    by pressing <Ctrl+C> instead. You can add friends to your Buddy List by selecting
    Add a Buddy from the menu. Your friends have to give you their screen names, of
    course.


    After you have added your buddies to the list, they get messages letting them
    know that you want to add them. When they see the pop-up window shown in Figure
    9–6, they click Accept, at which point, you can begin conversations with them.'
