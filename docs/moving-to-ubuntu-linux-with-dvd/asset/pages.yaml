    is your $HOME.


    # Quick Tip


    My use of $HOME isn''t just to be silly. The system can recognize some things
    based on environment variables, symbolic names that can refer to text, numbers,
    or even commands. In the DOS/Windows world, you had similar variables—for instance,
    the PATH in your AUTOEXEC . BAT file. $HOME is an environment variable assigned
    to every person who logs in. It represents a person''s home directory. If you
    want to see all the environment variables assigned to your session, shell out
    and type the following command:


    ```

    env

    ```


    Try this. Over on the left side of the Tree view, click the small arrow beside
    the home directory. As you saw earlier, the Tree view expands to show the folders
    in your own personal directory. Notice that the right-pointing arrow is now a
    down-pointing arrow. If you click it again, the directory view collapses. With
    the home directory expanded, click your personal directory. You should see a few
    items appear in the right-side view, including one icon labeled Desktop. For an
    example, see Figure 4-2. On the left side, the home folder is expanded, and the
    right-side view shows the same folder collapsed. Before you do anything else,
    I want you to reopen Nautilus in your home folder (click Places and select Home
    Folder). There''s a very special folder there called Desktop. Now, look down in
    your bottom panel, over on the far left side of the screen. Do you see the Desktop
    icon there? It looks like an old-fashioned desktop blotter with a pencil and a
    piece of paper on it. Pause your mouse cursor over it, and the tooltip displays
    Click Here to Hide All Windows and Show the Desktop. Click it, and your desktop
    appears, free of windows. Click it again, and everything returns to normal. Now,
    I''m going to briefly jump ahead in the book and have you create a folder on your
    desktop. Right-click anywhere on that empty desktop and a pop-up menu appears.
    The top entry in that menu is Create Folder. Click that and a folder appears on
    your desktop with the label Untitled Folder beneath it (see Figure 4-3). Type
