  md: '# Working with Editors


    There are times when you need to work with an editor, whether to edit a configuration
    file, write a script, or do some quick edits on the company Web site. In the Linux
    world, there are many alternatives, and your Ubuntu system comes with a few. Let
    me introduce you to a friendly new member of the family.


    # Meet gedit


    Your GNOME desktop comes with a very nice and powerful editor called gedit (command
    name gedit). With colorful language-sensitive syntax high- lighting (sh, C, C++,
    Perl, HTML, and others), tabs, and a spell checker, gedit is easy and fun to work
    with. To see gedit in action, look at Figure 21-2. You can start gedit on its
    own or specify a filename to start with. Notice that I started my session using
    gksudo because I was editing a system script.


    ```

    gksudo gedit /etc/file

    ```


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_439_0.png)'
  merge: -1
  img_proc: true
- pgno: 440
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_440_0.png)


    > In the preceding example, I use gksudo instead of sudo. This is a graphical
    frontend to sudo. It’s also the best (and correct) way to run a graphical command
    that requires administrative privileges via the <Alt+F2> quick-start.


    As you can see by looking at Figure 21-2, gedit supports tabs, thereby making
    it simple to work on multiple files at the same time. Just click the tab to select
    the file you want to edit. Basic editing functions like cut, paste, find, and
    replace, are available directly below the menu bar. To edit a file without starting
    from a command line, click the Open icon, which opens up the standard GNOME file
    selector.


    For years, I’ve been a fan of vim, the next editor I will discuss, but I appreciate
    the beauty of a simple, friendly editor like gedit. It’s easy-to-use with a learning
    curve close to zero. Still, there may be times when you don’t have access to gedit
    and times when a slow, remote connection makes a graphical editor too painful
    to consider. It’s at those times that you’ll be thankful for a simple shell window
    and vim to get your work done.


    # I Am vi, the Great and Powerful


    You can almost hear a fearsome voice echoing eerily around the walls of your office
    or home. If there is one editor that strikes fear in the hearts of newbies everywhere,
    it is certainly vi (or vim), the visual editor. vim stands for vi improved and
    is the version of vi that you find in your Linux system. Any-how, pay no attention
    to that fearsome voice behind the program. vi is not so frightening after you
    get to know it. To start vi, enter the command name on its own or start it by
    specifying a filename.


    ```

    vi /tmp/test_file

    ```


    To start entering information, press <i> to go into insert mode. Type sev-eral
    lines and then press <Esc> when you are done editing. Moving around with vi is
    easy. Depending on the terminal emulator you are using, you can typically use
    your cursor keys. In the absence of cursor key control, the up, down, and sideways
    motions are all implemented with single keystrokes. To move left, press the letter
    <h>. To move right, press <l>. The letter k is up, and j is down.'
