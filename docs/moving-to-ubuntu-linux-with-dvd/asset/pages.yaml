- pgno: 203
  md: '# Learning More About IRC


    IRC has some interesting commands that you might want to know about. IRC commands
    are fronted by a slash character (/) followed by the command name. Some commands
    can be used by all users, whereas others are for channel administrators only.
    To find out what commands are available to you, type /help in the text field and
    press <Enter>. The list of commands appears in the chat window itself. Here are
    a few of the more common and useful commands:


    +   - /help Lists IRC commands.

    +   - /help command_name Gets help on a particular command.

    +   - /nick new_name Changes your nickname.

    +   - /join #channel Joins a specified channel.

    +   - /part Leaves the channel.

    +   - /list Lists the available channels.

    +   - /me Some_action Prints your nickname followed by text of your action and
    highlights the message in a different color. Try it. It''s fun.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_203_0.png)


    > Beware of the /list command. On some servers, this can return a massive list
    of channels.


    IRC is a fantastic resource and one I recommend highly, but with a cautionary
    suggestion. This vast, distributed network of real-time discussion groups has
    evolved a culture all its own, with its own rules of etiquette, rules that should
    be respected. Channels have operators who monitor traffic and requests from users.
    Operators can also send you packing if you don''t behave. There may also be bots,
    small programs designed to handle simple administrative requests, so not every
    user you see is necessarily human.


    It''s easy to get hooked on IRC when there is so much at your disposal, but it''s
    also good to take some time and read a little primer on what it''s all about.
    Check out the IRC primer in the Resources section for a great introduction to
    the world of IRC.'
  merge: -1
  img_proc: true
