- pgno: 19
  md: '# # Acknowledgments


    Before you embark on your journey through *Moving to Ubuntu Linux*, allow me a
    few moments to thank some of the people who have made this book possible.


    First and foremost, I want to acknowledge my wonderful son, Sebastian, and my
    beautiful wife, Sally, the two most important people in my life. I love you both
    dearly. Sally is my love, my life, my inspiration, and my strength. She is also
    my best friend and confidante. Sebastian, meanwhile, has given me new eyes with
    which to see the world. I can’t imagine a greater gift.


    To my family and friends, thank you for believing in me, for your love, and for
    your support. I love you all.


    Many thanks to Mark Taub, my editor, and to Heather Fox, my publicist. Thanks
    also to Lara Wysong, Kelli Brooks, Michelle Bish, and to everyone at Addison-Wesley
    and Pearson. Many thanks also to my agent, Richard Curtis, working hard for me
    in the wilds of Manhattan.


    My sincere thanks to those people who reviewed my book along the way. They are
    (in alphabetical order by last name) AEleen Frisch, Peter Garrett, Arnay Gosch,
    and Sally Tomasevic. Your hard work, sharp eyes, and suggestions have helped make
    this a better book. Special thanks to Peter Garrett who went above and beyond
    to provide his invaluable comments and insight.


    Finally, I would like to recognize and thank the Linux community: the developers
    and software designers, the members of Linux user groups (including my own WFTL-LUG),
    the many who share their experiences on Usenet, and all those unnamed folk who
    give free advice under pseudonyms in IRC groups.


    —Marcel Gagné'
  merge: -1
  img_proc: true
