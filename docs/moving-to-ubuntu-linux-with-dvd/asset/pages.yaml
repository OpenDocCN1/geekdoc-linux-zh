  md: 'A little further on, I’ve included a quick cheat sheet. When you work with
    vi, the <Esc> key is your friend. If you don’t know where you are or what mode
    you are in (insert, replace, or append), press the <Esc> key. You go back to normal
    vi command mode. Your second best friend is u or U, which stands for undo. The
    uppercase Undo undoes every change to the current line and the lowercase undo
    undoes the last change only.


    # :q, :w, :wq, and zz


    Finished editing? When it comes time to save your work, press <Esc> (to get out
    of whatever mode you are in) and type zz. Another way to exit is to type :wq (write
    and quit). At any time during an editing session, you can type :w to save your
    current work. Finally, if you really don’t want to save anything you have done,
    type :q! The exclamation point essentially says that you won’t take no for an
    answer. Had you modified the file and simply typed :q, vi would warn you that
    you were trying to exit from a modified file without having saved your changes.


