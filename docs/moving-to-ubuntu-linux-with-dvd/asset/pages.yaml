    disks, create a CD or DVD using your writer, and search for files on your system.
    These storage resources don''t need to always be connected to your system. For
    instance, if you plug in a USB storage key, it will appear in the Places menu
    and you can access it without additional fuss.


    Places can also show resources a network jump away, either on your local area
    network or on the Internet. If you have Windows machines with shared drives on
