- pgno: 192
  md: '# Why Jabber?


    Because Jabber is an open protocol, it doesn’t belong to anyone in particular,
    so there is no single company driving its destiny (although there are companies
    using Jabber). Jabber uses a decentralized approach, so the system is more robust.
    In fact, anyone can run a Jabber server if he wants to. This is a boon to companies
    that may want to run a *private, secure* instant messaging network.


    > *Trivia Time* Google Talk, an increasingly popular instant messaging service,
    uses the Jabber protocol.


    Whether you choose to run Jabber, Yahoo!, MSN, or something else, the ideal instant
    messaging client is a multiprotocol client, one that lets you talk to all these
    services without having to run a client for Jabber, one for AOL, one for Yahoo!,
    one for . . . well, you get the idea. In this chapter, I’m going to cover two
    superb Linux instant messaging clients. One is a great multiprotocol client that
    handles all your favorite chat services. The second is a powerful IRC client.


    What’s IRC, you ask? IRC is Internet Relay Chat, and next to your telephone, it
    is possibly the greatest real-time communication system in the world. I’ll tell
    you all about it shortly.


    # Instant Messaging with Gaim


    Gaim is one of the best multiprotocol instant messaging systems out there, period.
    Furthermore, this is one you can share with the people you know who are still
    running that other operating system. This is one favor they will thank you for.
    With Gaim, they no longer need a client for Yahoo!, another for MSN, and yet *another*
    for AOL because Gaim (gaim.sourceforge.net) is available for Windows as well.
    It even looks and works the same under both operating systems.


    To start Gaim, look under the Applications menu, and then select Internet. You’ll
    see an entry there for Gaim Internet Messenger. The actual command name is *gaim*,
    in case you would rather start it from the shell or via the <Alt+F2> run program
    dialog.'
  merge: -1
  img_proc: true
- pgno: 193
