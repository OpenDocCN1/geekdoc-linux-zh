    Figure 8–1 The Add Application dialog can be used to remove programs as well.
    It’s the easy way to add and remove packages.


    To the left, in a vertical sidebar, is a list of categories into which all of
    the available applications are sorted. These categories include Games, Graphics,
    Office, System Tools, and others. Click on a category and the list of applications
    that exist in that category appear in the top right window. Below the top right-hand
    pane is another window. This is the description window. Click on an application
    above and a description appears below.


    Let’s just jump right in and see how easy this is to use. Then, we’ll investi-gate
    it in a bit more detail. At the top right of the screen, you’ll see a little box
    with a Search label to the right of it. Type game in the text box. In seconds,
    the install program locates every package it knows of that that has the word game
    somewhere in either the title or the description. The results appear in the left
    pane (see Figure 8–2).'
