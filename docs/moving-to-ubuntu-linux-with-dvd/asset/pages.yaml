- pgno: 128
  md: "# ## Applets Galore:  \n## Back to the Panel!\n\nSounds a lot like the title\
    \ for a new Hollywood blockbuster, doesn’t it?\n\nApplets are, as you might have\
    \ gathered from the name, small applications. You’ll find a few of them embedded\
    \ in the panel at the top and bottom of your graphical desktop. These little programs\
    \ are engineered to fit nicely into your panel and window list, while still providing\
    \ useful functionality. The window list is just one of many applications embedded\
    \ in that panel. Other embedded applications include the workspace switcher, the\
    \ menu, the clock, and even the notification area (sometimes called the system\
    \ tray).\n\nAlthough we could work with either (or both) of the GNOME panels,\
    \ I’m going to concentrate on the bottom one for now.\n\nThe default look and\
    \ size of the bottom panel is roughly 24 pixels by default. Depending on the nature\
    \ of the program, applets embedded in a panel of this size tend to be a little\
    \ hard to look at. Luckily, this is easily resolved by changing the size of the\
    \ panel as described earlier in this chapter. To make some of these applets useful,\
    \ you will most likely want to increase the default panel size. In my experience,\
    \ and on my monitor, 48 pixels is pretty much ideal.\n\nNow that you’ve prepped\
    \ your panel, it’s time to find and add some of those applets. Right-click the\
    \ panel and a small menu appears. Click Add to Panel and a list of all the available\
    \ applets appears (see Figure 5-16). This list may be one single list with a short\
    \ description of the applet in question, or it may be organized into categories.\
    \ Scroll down and find something you like, then click the Add button. For my first\
    \ applet, I chose the one labeled Fish, an animated swimming fish that pops up\
    \ random bits of cleverness using the *fortune* (or *fortune cookie*) command.\
    \ And, yes, the fish’s name is Wanda. And, no, I did not make this up.\n\nIn a\
    \ few seconds, your applet appears in the panel. When an applet starts, it rarely\
    \ starts in the position I want. Luckily, moving it is an easy process. Simply\
    \ right-click the applet and a small menu appears (see Figure 5-17). One of the\
    \ options is Move. Click here and a small hand icon appears that allows you to\
    \ drag the applet to wherever you want it to live. You can even move it to another\
    \ panel (more on that in a moment)."
  merge: -1
  img_proc: true
