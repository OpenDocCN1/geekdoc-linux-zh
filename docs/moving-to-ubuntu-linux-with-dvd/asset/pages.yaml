- pgno: 301
  md: '# Chapter 16 OpenOffice.org Base


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_301_0.png)


    Computers have thousands of uses, but in the end, the most important things they
    do come down to two major and equally important functions. The first is mathematics.
    More specifically, the computer makes it possible to do complex (or simple) mathematics
    quickly. The key word here is quickly. Whether it is figuring out ballistics tables
    to better ensure the trajectory of a missile and cracking complex codes (as was
    the impetus for the computer''s development during World War II) or processing
    a company''s financial information, math is central to every computing operation.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The second most useful function a computer has is storing, sorting, and retrieving
    data quickly. (Again that word quickly.) Search engines like Google or Yahoo!
    are a testament to the computer''s power of sifting through large amounts of information.
    In doing so, businesses can locate a customer''s address in seconds, even though
    there may be millions of other customer records in the system. A hospital with
    thousands of patient records can pull up your medical history in a flash and update
    it with today''s visit. The online bookstore maintains your personal information
    so you can buy a book with a click or two. A year''s worth of financial information,
    arranged into a clear, concise report, appears on the printer seconds after the
    company accountant requests it.


    As my wife, Sally, is fond of saying, “It’s all about the data.”


    Storing data, or information, if you prefer, is what a database is all about.
    That’s why the addition of a database into the OpenOffice.org suite is so exciting.
    OpenOffice.org Base makes it possible to create your own databases, retrieve and
    modify information, perform queries, create reports, and so on. Base can attach
    to an existing database engine such as Oracle, Microsoft Access, MySQL, and many
    others using ODBC or JDBC. If all you need your database to do is simple operations,
    such as creating and maintaining a mailing list, OpenOffice.org base comes with
    the built-in HSQL database engine.


    # ## The Beginning: Creating a New Database


    Because I mentioned mailing lists, let’s use that as the basis for our exploration
    of OpenOffice.org Base. When we are through creating the database, I’ll show you
    how to use it in another OpenOffice.org program, the Writer word processor. We’ll
    take the information from our mailing list and create mailing labels.


    To start OpenOffice.org Base, click Applications in the top panel and select OpenOffice.org
    Base from the Office submenu (command name: oobase).


    When you start OpenOffice.org Base, you are presented with the Database Wizard
    (see Figure 16-1). This is a simple wizard with only two screens, the first of
    which is to select or identify a database. Your options are to Create a New Database,
    Open an Existing Database File, or Connect to an Existing Database. Let’s just
    go ahead and create a new database by making sure that radio button is selected.
    Click Next.


    The second step is where you must decide how to proceed after saving your database.
    There are only a few options on the second and final screen, but they are important
    and worth explaining (see Figure 16-2).'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_303_0.png)


    Figure 16-1  The OpenOffice.org Base Database Wizard.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_303_1.png)


    Figure 16-2  The final step in the wizard registers the database so it is easily
    accessible by other OpenOffice.org applications.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Chapter 16 OpenOffice.org Base


    The first option has to do with registering a database. To quickly answer this
    question, ask yourself whether you want to use this database from inside other
    OpenOffice.org applications. If the answer is yes, click the radio button Yes,
    Register the Database for Me. Nothing stops you from creating a nonregistered
    database and then registering it later, but in this example at least, we want
    to use the database in OpenOffice.org Writer.


    The next section gives you two options. The first, Open the Database for Editing,
    should be checked (you can create a database and get back to it later). You could,
    at this point, jump right in and Create Tables Using the Table Wizard but leave
    that unchecked for now.


    When the Save As dialog makes its appearance, select a name and location for the
    database (see Figure 16-3). For this example, I’m going to create a simple mailing
    list database, which I’m going to call (wait for it) Mailing List.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_304_0.png)


    > Figure 16-3 You created a database and now you need a name for it.


    That’s really all you need to do to create the database. Click Save and OpenOffice.org
    Base’s main window appears (see Figure 16-4). By default, the Forms view is selected
    but that’s only so useful if you haven’t set up your tables yet. Nevertheless,
    let’s take a look at the interface.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_305_0.png)


    Figure 16-4  The OpenOffice.org Base window immediately upon creating a new database.


    Along the top, directly below the menu bar is the Standard bar, looking less standard
    in OpenOffice.org Base than in any of the other components you have worked with.
    Running down the left side is an icon bar providing quick access to needed database
    functions, including Tables, Queries, Forms, and Reports. The main area to the
    right is divided horizontally into main areas. In the top part, we have Tasks.
    These tasks are all in some way related to the four database functions in the
    left sidebar. The bottom part of the window is for Forms.


    > Tip Pause your mouse cursor over any of the tasks and a description appears
    to the right of it.


    Before we get too deep into all of this, we need to prepare the database to accept
    data. We do that by creating tables. Simply stated, tables define what our data
    looks like. You can even define multiple tables that further define bits'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'of data in a master table. For instance, you can have a table that basically
    is an address list with first and last names, addresses, and so on. A second table
    might tie in to the person''s name, but the information may have to do with the
    number of hours he worked. The person''s name, in this case, might be the key
    you use to access both tables. A third table, using the same key, might be a list
    of movie rentals in the last year.

    Let’s go ahead and create a table.


    # ## Setting the Table


    Yes, you could even have a table with recipes. Although that sounds like a tasty
    idea, I started out by saying my database was going to be a mailing list, so we
    will build an appropriate table.


    The easiest way to get started is by using the Table Wizard. To do this, click
    the Table icon in the left sidebar. Now look at the top in the Tasks section.
    You see two entries there. The first, Create Table in Design View, is the more
    advanced approach, when you know what your data looks like. The second option
    is Use Wizard to Create Table. When you click this item, OpenOffice.org Base’s
    Table Wizard starts (see Figure 16–5).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_306_0.png)


    **Figure 16–5** The Table Wizard comes with a number of predefined tables for
    business and personal use.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '> > *Tip* When selecting the Table Wizard (or any of the Base wizards), you
    may get a message telling you that you need to turn on the Java runtime. First,
    you need to make sure you have a Java runtime installed. Luckily, OpenOffice.org
    automatically discovers its location. Click Tools on the menu bar, and then select
    Options. On the Options window, click Java from the sidebar, and then check the
    box Use a Java Runtime Environment.


    The Table Wizard comes with a number of predefined tables for common tasks. All
    of these table definitions are divided into two categories, Business and Personal.
    Click the radio button for one or the other, then click the Sample Tables drop-down
    box to browse the table types. Under Business, you find things like Assets, Customers,
    Employees, Expenses, Projects, Suppliers, and many more. The Personal list has
    items such as Accounts, CD-Collection, Diet Log, and Household Inventory, to name
    just a few. For now, click the Personal radio button and select Addresses from
    the table list. A list of fields appears below the radio button (see Figure 16-6).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_307_0.png)


    **Figure 16–6** Most sample tables have many more fields defined than you may
    actually want.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'If you scroll down that list of available fields, you see a lot more information
    than you actually need. You can click the double arrow in the middle (the right
    pointing one) and all the fields are selected. You can also select them one by
    one, as I have done in Figure 16-6. In the case of a simple mailing list, you
    may not need anything more than name, address, city, state, phone number, and
    email address. After you have finished selecting these fields, you can choose
    to click Finish or click Next to edit the format of each individual field. Let''s
    pretend that the definition and format of these fields are okay. Click Next to
    move to the primary key selection screen (see Figure 16-7).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_308_0.png)


    **Figure 16-7** Each record in a database requires a unique, primary key. You
    can choose to base that key on your selected fields or let Base create one for
    you.


    The primary key selection screen is important because a key is how you access
    and store information in a table. Although you can search on any field, a key
    needs to be a unique piece of information under which the record is stored. A
    classic example is the Social Security Number (or Social Insurance Number), which
    is unique to the individual. You can let Base generate a primary key for you,
    and that is the default. By checking the Auto Value box, Base automatically generates
    a key with each record you create.


    Your other options are to use an existing field (like that SSN/SIN) or to define
    a combination of your fields to create that uniqueness.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Let''s go with the default for now. Check the Auto Value box as well. Click
    Next and the final part of the wizard, the Create Table page, appears (see Figure
    16-8). If you are using the wizard, Base suggests a name for the table, but you
    can call it anything you like. I''m going to accept the default of Addresses because
    that suits me just fine. Keep in mind that although our database is called Mailing
    List, there can be a lot more associated with a mailing list—the Addresses table
    is just a small part of it.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_309_0.png)


    Figure 16-8 The last step of the Table Wizard names your table and gives you the
    option to start entering data immediately.


    We are done with the wizard, but before you click Finish, you have one last choice
    to make, and three options to choose from. The first is to start adding data (I''ll
    show you that in a moment). The second is to go back and make other changes to
    the table design. The final choice is to create a form based on this table. I''ll
    show you what happens in both cases, but let''s start with the default option,
    Insert Data Immediately. When you do that, a spreadsheet-like window appears with
    rows of data and columns representing the fields in your table (see Figure 16-9).


    There is one other item I''d like you to look at in the OpenOffice.org Base Tables
    view. It''s not a big deal, but it''s kind of cool, so I''m going to tell you
    about it.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_310_0.png)


    In the lower part of the main screen (the Tables section), click the Addresses
    table (at this time, there is only one). Now, look to the right and you see a
    drop-down list with None selected. Click the button and select Document. You get
    a pretty cool little preview of your table and the data in it (see Figure 16-10).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_310_1.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# No Wizards for Me!


    Before we move on to the next step, I want to touch on the subject of creating
    a table in design view. There’s no question that using the wizard is by far the
    easiest way to do this, but using the design view isn’t much more difficult. It
    does have the advantage of giving you greater control over the format of your
    tables, but you have to think about what fields you want, and what you want those
    fields to look like (see Figure 16-11). In that respect, I recommend it only if
    you already have some experience in database and table design.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_311_0.png)


    # Creating Mailing Labels


    Now that we have this great database of names, let’s create a sheet of mailing
    labels. We do this with Writer, the word processor I covered in Chapter 13, but
    not with OpenOffice.org Base.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'To begin, click **File** on the OpenOffice.org menu bar, and select **Labels**
    from the **New** submenu. You don''t have to be running Writer to do this. Any
    OpenOffice.org application is a perfect starting point for creating labels. A
    few seconds after making your selection, the Labels dialog appears (see Figure
    16-12).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_312_0.png)


    **Figure 16–12** When creating a new sheet of labels, OpenOffice.org starts by
    asking you about the data source.


    Start by looking on the right, under the **Database** heading. This is where registering
    the database, that little step we did at the beginning, pays off. OpenOffice.org
    Writer already knows about the various databases and can pick my **Mailing List**
    database from the drop-down list. Below that is another drop-down list labeled
    **Table**. Click here and select the table from which you will be pulling the
    information you need. At the bottom of the dialog, you can select the **Brand**
    label (for example, Avery Letter Size) and the **type** (for example, 5961 Address).


    To the left, below **Label Text**, is where we build the label we will be printing.
    At this moment, there are no fields visible there. Look again to the right'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'to the Database Field drop-down list. Click that list and you see all the fields
    that make up the records in your table. Select the Database Field you want, and
    then click the large arrow directly to the left. The field you selected appears
    in the Label Text window. Put a space after the field name, then select the last
    name, and click the arrow again. Press <Enter> to go to the next line in the Label
    Text window. Next is the address, city, and so on. You may want to put a comma
    between the city and province (or state). Line by line, transfer the fields that
    you want to have appearing in your finished label (see Figure 16–13).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_313_0.png)


    **Figure 16–13** As you select fields, they appear in the Label Text window to
    the left.


    Before we move on, let''s quickly have a look at the other two tabs, Format and
    Options. The Format tab allows you to fine-tune your label dimensions. This includes
    margins, columns, rows, and pitch. If you selected one of the commercial labels
    from the list, this information will be filled in for you and you shouldn''t have
    to worry about changing anything. Use the Options tab to select whether you are
    printing a full page of labels or a single label. The most'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'interesting item here is a check box labeled Synchronize Contents. Check this
    box and you can edit a single label and synchronize the contents of all other
    labels with a click.


    Go back to the Labels tab and click New Document to create your label document.
    Each label is pre-created with the field labels you selected in the proper place.
    At this stage of the game, there are no names or addresses in any of the labels,
    just the data fields. To populate these labels from your Mailing List database,
    you need to tell the new document where to get its information. To do that, click
    View on the menu bar and select Data Sources (you can also just press <F4>). The
    top part of your label document now shows the databases and tables available.
    Make sure you select the Addresses table from the database list. When you do,
    the records in that table appear in the right side of the data sources pane (see
    Figure 16-14).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_314_0.png)


    **Figure 16-14** The data source for the labels appears directly above the actual
    label document, in the top-right pane.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'To populate your label document, you should now select which records you want
    included from the Table view at the top right. The easiest way to select them
    all is to click the button to the left of the top record, press the <Shift> key,
    then click the last record. You can also select individual records by holding
    down the <Ctrl> key and clicking the records you want. When you have made your
    selections, look at the secondary icon bar, directly above the data sources. There''s
    a button fourth from the right that displays a Data to Fields tooltip if you pause
    your mouse over it (see Figure 16-15).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_315_0.png)


    Click the Data to Fields button and your document is instantly populated with
    all of the selected records (see Figure 16-16). You can save this document for
    later use or you can print the page using your chosen label stock.


    # # Further Exploring


    In this chapter, I introduced you to the basics of using OpenOffice.org Base and
    showed you how to use the database tables in a word processing document. Obviously,
    this is just the beginning. Using Base, you can create custom forms for data entry.
    Wizards make this easy but there is a manual forms creator as well. Simple or
    complex custom reports are also easily generated using the Report Wizard. You
    can perform queries, connect to external databases, build indexes, and more. OpenOffice.org
    Base provides useful database access tools for users at every level.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "# Chapter 16 OpenOffice.org Base\n\n![](img/0e9cf4c65a042f4a9bea644dc50153a7_316_0.png)\n\
    \nFigure 16-16 With a click, all of the selected record data is transferred to\
    \ the label form.\n\n# Resources\n\nBASE Home Page  \nhttp://www.openoffice.org/product2/base.html"
  merge: -1
  img_proc: true
- pgno: 317
  md: '# **Chapter 17**

    # Digitial Art

    ## with the GIMP


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_317_0.png)


    *Oddly enough, Linux applications that allow users to work with graphics are among
    some of the most highly developed in the world. To see the truth in this rather
    bold statement, turn your eyes to Hollywood. Blockbusters such as Titanic, Star
    Trek: Nemesis, Shrek, and others use Linux and Linux clusters to create the complex
    special effects.*'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'In terms of graphical design and photo editing, your Linux system comes with
    one of the most powerful, flexible, and easy-to-use packages there is, regardless
    of what OS you are running. It’s called the GIMP. Allow me to introduce you to
    some of its many features.


    The GIMP is one of those programs that has helped create an identity for Linux.
    Of course, there are plenty of programs out there, as I’m sure I have demonstrated
    in the book, but the GIMP is special in some ways. The Linux community has used
    it to create images, buttons, desktop themes, window decorations, and more. Even
    the Linux mascot, Tux the Penguin, as created by Larry Ewing (the mascot’s best-known
    incarnation), was a product of the GIMP.


    The GIMP is an amazingly powerful piece of software, yet its basic functions are
    easy-to-use as well. With a little bit of work, a lot of fun, and a hint of experimentation,
    anyone can use the GIMP to turn out a fantastic piece of professional quality
    art. You doubt me my words? Then follow along with me, and in just a few minutes,
    you’ll create a slick-looking logo for your Web page or your desktop. With time
    and practice, you may learn to wield the GIMP with the power of a Hollywood special
    effects master.


    Play. Experiment. And don’t be afraid.


    # ## Ladies and Gentlemen, Start Your GIMP


    Click the Application menu on the top panel and select GIMP Image Editor from
    the Graphics submenu. You can also use your program quick-start by pressing <Alt+F2>
    and entering gimp into the command field.


    When you run the GIMP for the first time, you will get a couple panels, aside
    from the GIMP’s main screen. You will also likely get the GIMP Tip of the Day.
    As with all such tips, you can elect not to have them appear each time the program
    starts—just uncheck the Show Tip Next Time GIMP Starts button before you hit Close,
    and you aren’t bothered with them again. What you are likely to see (minus that
    tip of the day) should look a bit like Figure 17-1.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_319_0.png)


    Figure 17-1 First time through, the GIMP starts with the layers and channels dialog
    (right) open.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The long window on the right is split into two main areas. At the top is the
    Layers, Channels, Paths dialog. The dialog below has three tabs, one for brushes,
    another for patterns, and another for gradients. If you choose to close this window,
    there is no harm done; you end up calling up dialogs as you need them. We’ll visit
    this again when I cover brushes later on.


    The most important of those windows is the GIMP toolbox. That’s the window to
    the left in Figure 17-1. The toolbox itself is the top half of the window (see
    the closeup in Figure 17-2). The bottom half of the window represents the options
    available to the currently selected tool. If you are using the text tool, you
    have a choice of fonts, styles, and sizes at your disposal.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_320_0.png)


    # Figure 17-2 The GIMP toolbox.


    Along the top, directly below the title bar, is a familiar looking menu bar labeled
    File, Xtns, and Help. Clicking these shows you additional submenus. Below the
    menu bar is a grid of icons, each with an image representing one of the GIMP’s
    tools. Incidentally, my GIMP toolbox is arranged with six tools per row, but it
    could just as easily be five—just drag the side of the main toolbox window to
    increase or decrease the number of tools per row. I will cover all of these things
    shortly, but first let’s take the GIMP out for a spin.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '> Note The GIMP Help files are not installed on your Ubuntu system, but you
    can use Synaptic to search for and install them. Search using the term gimp-help
    and you will find the manual in several different languages. You don’t actually
    need to install the help files, however, because the GIMP lets you search the
    help files online using Firefox.


    You may also want to search for grokking-the-gimp in Synaptic. This is a book
    by Carey Bunks, and it is distributed in HTML format.


    # Easy Logos with the GIMP


    The nitty-gritty can wait. I think we should do something fun with the GIMP right
    now. I’m going to show you how to create a very cool looking corporate or personal
    logo with just a few keystrokes. If you don’t have the GIMP open yet, start the
    program now. From the main toolbox menu bar, select Xtns, scroll down to Script-Fu,
    and another menu cascades from it.


    > Quick Tip Notice that the menus have a dashed line at the top. These are menu
    tear-offs. By clicking the dashed line, you can detach the menu and put it somewhere
    on your desktop for convenient access to functions you use all the time. In fact,
    all the menus, including submenus, can be detached.


    From the Script-Fu menu, move your mouse to Logos. You should see a whole list
    of logo types, from 3D Outline to Cool Metal to Starscape and more. For this exercise,
    choose Cool Metal.


    Every logo has different settings, so the one you see in Figure 17-3 is specific
    to Cool Metal. Particle Trace has a completely different set of parameters. To
    create your Cool Metal logo, start by changing the Text field to something other
    than the logo style’s name. I’ll change mine to read Ubuntu Rocks! The font size
    is set to 100 pixels, and we can leave it at that for now. In many of these, a
    default font has been selected for you. You can override the current choice (written
    on the button itself) and pick something else.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_322_0.png)


    Figure 17-3 Script-Fu logo settings for Cool Metal.


    by clicking the Font button. The Font Selection window shows you the various fonts
    available on your system and lets you try different font types, styles, and sizes.
    A preview window gives you an idea of what the font looks like (see Figure 17-4).


    To create my logo, I''m going to choose a font on my system called Kalimati (not
    sure why, but suddenly I have a taste for Greek salad). You may choose whatever
    you like. When you have decided on a font, click Close. Then click OK, this time
    in the Script-Fu:Logos/Cool Metal window. The result should be something similar
    to my own logo in Figure 17-5.


    If you don''t like the results, close the image by clicking the Close button in
    the corner (usually an X unless you have changed your desktop theme or style).
    A warning box pops up, telling you that changes have been made and you might want
    to save your work (more on that in a moment). Your options are Save, Don''t Save,
    and Cancel. Click Don''t Save and it goes away. Then start over with another logo.
    You might try changing the background color or the gradient this time. You might
    even want to try a different type of logo altogether.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_323_0.png)


    Figure 17-4 Script-Fu Font Selection dialog.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_323_1.png)


    Figure 17-5 Just like that! A professional looking logo.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# ## Saving and Opening Your Work


    It is time to preserve your masterpiece. It’s also a good time to have another
    look at the image window—in this case, your logo. Every image created in the GIMP
    has a menu bar across the top labeled File, Edit, Select, View, and so on. These
    menus can also be called up by right-clicking anywhere on the image. To save your
    work, click the File menu, and then select Save As. The Save Image dialog appears
    (see Figure 17-6).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_324_0.png)


    Figure 17-6 It’s time to save your creation.


    Notice the small arrow beside the words Select File Type (By Extension). If you
    already know that you want to save your image as a .jpg or a .tiff file (or any
    number of formats), you can simply add it to the filename. The GIMP can figure
    it out for you. If you prefer to see a list of available formats, click the arrow
    and the Save Image dialog changes to display the various formats supported by
    the GIMP. There’s also an arrow beside the Browse for Other Folders label. By
    default, the GIMP uses the current folder to save your work. To choose another
    directory, click the arrow and a more comprehensive navigation dialog appears
    (see Figure 17-7).


    When you have entered your filename and selected a file type, click Save, and
    you are done. Opening a file is similar. From the GIMP toolbox menu bar, select
    Open (or use the <Ctrl+O> shortcut) to bring up the Load Image dialog. The difference
    between this and the Save Image dialog is that when you click on a filename, you
    can also click Generate Preview to display a small thumbnail preview in the Open
    Image dialog.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_325_0.png)


    **Figure 17–7** A more comprehensive folder navigation dialog saves your work.


    # ## Printing Your Masterpiece


    You''ve created a masterpiece. You are infinitely proud of it, and you want to
    share it with your friends, who, alas, are not connected to the Internet. It''s
    time to print your image and send it to them the old-fashioned, snail-mail way.


    Okay, perhaps you aren''t feeling quite that sharing, but there are times when
    you want to print the results of your work. Simply click **File** on the image
    menu bar, and select **Print** (again, you can right-click your image if you prefer).
    A printing dialog appears (see **Figure 17–8**), from which you can spec-ify a
    number of print options including, of course, which printer you would like to
    use.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '304


    # Chapter 17  Digital Art with the GIMP


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_326_0.png)


    Figure 17–8   Time to print your masterpiece.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_326_1.png)


    # Quick GIMP Trick


    Want to take a screenshot and open it up to edit in the GIMP? It’s easy. Click
    File on the GIMP toolbox menu bar, move to Acquire, and click Screen Shot. The
    image size is the same as your screen (for example, 1024×768). Because the GIMP
    is in the screen shot you take, you may want to minimize it'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'before capturing the image. To make that possible, select an appropriate time
    delay (for example, five seconds) from the Screen Shot dialog that appears. Minimize
    the windows you don''t want to see, and then wait. After the capture completes,
    a GIMP image window appears where you can make your modifications.


    The Acquire function doesn''t limit you to the whole screen. When the Screen Shot
    dialog appears, you have the option of capturing the entire screen or a single
    window. Just click the appropriate radio button. The window capture includes the
    borders for that window and all its decorations.


    # ## Tools, Tools, and More Tools


    Now that we''ve had some fun and created some *true art*, it''s time to find out
    what all those icons in the GIMP toolbox do. Before we do this, however, we should
    look at those two boxes at the bottom of the toolbox, because what they offer
    affects what the icons do.


    The block on the right is the color menu (see Figure 17-9). It gives you quick
    and easy access to foreground and background colors. The black and white squares
    on the left can be changed to other colors by double-clicking one or the other.
    If you click the arrow between the two, you switch between foreground and background
    colors.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_327_0.png)


    **Figure 17–9**

    The multifunction color, brushes, pattern, and gradient menu.


    The box to the right is a quick dialog menu and consists of three different tools:
    a brush selector, a pattern selector, and a gradient selector. Click any of them
    to bring up the list of choices each provides. Figure 17-10 shows the Brushes
    dialog. You may recall that there was a layers and channels dialog in addition
    to the main GIMP toolbox. At the bottom of that window was the Brushes dialog
    (as well as gradients and patterns). If you left that window open, the brushes
    selection will still be there.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_328_0.png)


    **Figure 17-10** The Brushes dialog, on its own.


    If you select a different gradient, pattern, or brush from the resulting menus,
    you see them change on the dialog menu at the bottom of the GIMP toolbox, as well.
    This gives you a quick visual feedback on what brush, pattern, or gradient is
    active at the moment.


    # ## On to the Tool Icons


    In the next few pages, I’m going to cover the GIMP’s tools one by one, a row at
    a time. Each row has six tools, except for the last, which has five. I mention
    this because this is the default layout. If you decide to resize the GIMP toolbox
    by dragging one of the sides out, the toolbox widens but the number of tools per
    row increases as well, so you could have seven tools if you want. The reverse
    is true should you decide to shrink the width of the GIMP toolbox.


    Start by moving your mouse over the various icons, pausing over each one. Tooltips
    appear, telling you what tool each of the icons represents. (I’ll go over these
    in a moment.) If you click any of these icons, the window below the toolbox changes
    to present you with that tool’s options. For instance, Figure 17-11 shows the
    tool options for the flip tool.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# On to the Tool Icons




    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_329_0.png)


    What are all those icons for? An excellent question. Let’s look at them

    again, one row at a time, starting with— you guessed it—the first row (see

    Figure 17-12).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_329_1.png)


    The first icon, represented by a *dotted rectangle*, lets you select a

    rectangular area. Just hold down the left mouse button at whatever point

    you choose for a starting corner, and drag it across your image. A dotted line

    indicates the area you’ve selected. If you hold down the <Shift> key at the

    same time as the left mouse button, your selections are always perfect

    squares.


    > > *Quick Tip* To undo changes, press <Ctrl+Z>.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'The dotted circle icon next to the dotted rectangle is much the same except
    that it selects a circular or elliptical area. Similar to the rectangular area
    you selected, you can hold down the <Shift> key along with the left mouse button
    to select only perfect circles.


    Next, we have the lasso tool. This is another selection tool, but this one lets
    you select irregular or hand-drawn regions. Hold down the left mouse button and
    *draw* your selection around the object.


    > **Quick Tip** When you have selected an area on an image, you can right-click,
    move your mouse cursor over the Edit menu, and select *Cut* or *Copy*. You can
    then Paste your selection back to another part of the image.


    Next comes the magic wand. This is a strange tool at first glance. It selects
    an area by analyzing the colored pixels wherever you click. Holding down the <Shift>
    key lets you select multiple areas. This is a very useful tool but also a little
    tricky. Double-click the icon to change the sensitivity.


    Next, it’s over to the color selection tool. Using the color selector feels a
    bit like the magic wand but the functionality is based on color rather than a
    single area at a time. Select the color picker, click any colored area, and *all*
    areas matching this color are selected.


    Finally, we wrap up this row with another selection tool, the so-called intelligentscissors.
    You select an area by clicking around it. This tool follows curved lines around
    an object. It does so by concentrating on areas of similar contrast or color.
    Simply click around the perimeter of the area you want to select and watch the
    lines magically draw themselves. When you join the last dot, click inside the
    area to select it.


    That wraps it up for the first row of tools. It’s time to look at the next set
    (see Figure 17–13).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_330_0.png)'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'The first icon in this row is the Bezier tool (also known as the path tool),
    which takes some getting used to. After you get used to it, however, you''ll be
    impressed with the flexibility it affords you in selecting both straight and curved
    areas. Click a point outside the area you want to select, and it creates an anchor
    point. Click again a little further along your outline, and you get new anchor
    points with a straight line connecting to the original. Click and drag an existing
    anchor point, and a bar appears with control boxes on either end. You can then
    grab those control points and drag or rotate them to modify the straight line
    between the points. After you have joined the final point, look at your tool options
    (the pane below the GIMP toolbox) and click the button labeled Create Selection
    from Path. You see an animated dotted line, as with the other selection tools.


    The second icon looks like an eyedropper. This is the color picker. Choosing an
    exact color can be difficult (if you need to get the tone just right), but if
    the color you want is on your existing image, click that spot, and you''ve got
    it (your default active color changes).


    The magnifying glass does exactly what you expect it to. Click an area of the
    screen to zoom in. Double-click the icon to reverse the zoom. This doesn''t actually
    scale the image; it just changes your view of things. Zoom is used to make it
    easier to work on a small area of the image.


    Next in line: the calipers, or measuring tool. This doesn''t actually change anything
    on your image. It simple provides information. Click a starting point on the image,
    then drag the mouse pointer to another part of the image. Now look at the bottom
    of your image window. You see the distance in pixels from your starting location
    to where you let go of the mouse pointer. The angle of the line is also displayed.


    The fifth icon on the second row looks like a cross with arrows pointing in all
    directions. This is the move tool. It is really quite simple. Click the tool,
    grab the selected area on the screen, and move it to where you want. If you haven''t
    selected an area, you can move the entire image in the window.


    The knife icon is the crop tool. If you start working with digital photography
    in a big way, this is one you will want to know. I use the crop tool all the time
    when I am trying to get a small part of a larger image. It is what I used to separate
    the rows of icons from the GIMP toolbox image I captured earlier (refer to Figure
    17-2). Click a part of the screen, and drag it to encompass the area you want
    to select. The space around your selection darkens (see Figure 17-14).'
  merge: -1
  img_proc: true
- pgno: 332
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_332_0.png)


    Figure 17–14 When cropping an image, the selected area is emphasized by a darkening
    around the rest of the image.


    Click the Crop button when you are satisfied with your selection. You can also
    fine-tune the settings (X and Y position, and so on) at this time.

    And just like that, it’s time to look at row three (see Figure 17–15).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_332_1.png)


    Figure 17–15 Third icon row.


    On the left, in the first position, we have the rotate tool. Click an image (or
    a selection), and small square handles appear at the corners of your selection.
    Grab one of these handles (or points), drag the mouse, and the selection'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'rotates. When you have it in a position you like, click Rotate on the pop-up
    window that appears. The image locks into place.


    The second icon, the scale tool, is very similar to the rotate tool. Instead of
    rotating the selected area, you drag the points to resize the selected area. As
    previously, a pop-up window appears so that you can lock your changes. It’s also
    the place to manually enter your changes if dragging the mouse doesn’t offer the
    control you like.


    The shear tool is the third on this row and once again, it acts on a previously
    selected area. This one looks a lot like the last two in terms of functionality,
    but the effect is more like taking two sides of an object and stretching it diagonally
    in opposite directions. A square becomes a parallelogram, which gets longer and
    thinner as you continue to stretch the image. When you’re happy with the changes,
    click the Shear button on the pop-up .


    In the fourth position, you have the perspective tool. This is one of those that
    you almost have to try out to understand, but let me try to describe it. Remember
    your grade school art classes when you first learned about perspective? A road
    leading off into the distance compresses to a single point in the distance. With
    the perspective tool, you can take a selected area and pull the points in whatever
    direction you want to create the perspective effect. Do that with a person’s head
    and the top of his head becomes a sharp little point. As with the last three tools,
    there’s a pop-up where you lock in your changes. Just click Transform.


    Next in line is the flip tool. By default, it flips the image horizontally. The
    tool option, in the lower half of the GIMP toolbox, has a check box if you want
    to flip vertically instead.


    > Remember that if you close the tool options below the GIMP toolbox, you can
    always double-click a tool to bring up its options dialog.


    The next icon is the text tool—that’s what the big T signifies. Click your image,
    and the GIMP Text Editor appears. This is where you enter your text. In your tools
    option is the font selector; the same one that you used for your logo appears.
    Select a font style, size, and color, and the changes are visible in the image.
    This makes it easy to change the look and feel on-the-fly, type your text in the
    preview section, and click OK. Where the text appears on the screen, the move
    tool is activated, allowing you to place the text accurately. The color of the
    text is your current foreground color.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The fourth row is next (see Figure 17-16).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_334_0.png)


    The paint can represents the *fill* tool. It can fill a selected area not only
    with a chosen color but with a pattern, as well. To choose between color and pattern
    fill, double-click the icon to bring up its menu.


    The second item on this line is the *gradient fill* tool. Start by selecting an
    area on your image, and then switch to this tool. Now click a spot inside your
    selected area and drag with the tool. The current gradient style fills that area.
    This is one of those tools that you have to use to understand.


    > **Quick Tip** Would you like a blank canvas right about now?

    > Click File on the GIMP toolbox menu bar and select New. Those who like using
    the keyboard can just press **\<Ctrl+N\>**.


    The third icon of this group looks like a *pencil*. In fact, this and the next
    three buttons all work with a brush selection (the bottom-right box). This pencil,
    as with a real pencil, is used to draw lines with sharply defined edges. Try drawing
    on your image with the different types to get an idea of what each brush type
    offers.


    The next tool icon is the *paintbrush*. The difference between it and the pencil
    is that the brush has softer, less starkly defined edges to the strokes. Double-click
    the icon to bring up the paintbrush''s menu and try both the Fade Out and Gradient
    options for something different.


    If the next icon looks like an *eraser*, that''s no accident. The shape of the
    eraser is also controlled by the *current* brush type, size, and style. Here''s
    something kind of fun to try. Double-click the icon to bring up its menu, and
    then change the Opacity to something like 50 percent. Then start erasing again.


    Now it''s on to the *airbrush* tool. Just like a real airbrush, you can change
    the pressure to achieve different results. Hold it down longer in one spot, and
    you get a darker application of color.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Next is the fifth and final row of icons (see Figure 17–17).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_335_0.png)


    The first tool on this line is another drawing tool, the pen, or *ink* tool. Double-clicking
    the icon brings up a menu that lets you select the tip style and shape, as well
    as the virtual tilt of the pen. The idea is to mimic the effect of writing with
    a fountain pen.


    Next to the pen is the *clone* tool (the icon looks a bit like a rubber stamp).
    Sheep? No problem! We can even clone humans. Okay, that’s a bit over the top.
    Where the clone tool comes in handy is during touch-ups of photographs. Open an
    image, hold down the <Ctrl> key, and press the left mouse button over a portion
    of the image—the tool changes to a crosshair. Let go of both the mouse button
    and the <Ctrl> key. This is your starting area for cloning. Now move to another
    part of the screen, click, and start moving your mouse button (the shape of the
    area *uncovered* is controlled by the brush type). As you paint at this new location,
    notice that you are recreating that portion of the image you indicated with the
    <Ctrl+mouse-click> combination. Start with someone’s head or body, and you can
    have twins on the screen.


    The droplet you see in the third position represents the *convolver* tool. Use
    it to blur or sharpen parts of an image. You switch between the two operations
    by selecting the mode in the tool options below the toolbox, or by double-clicking
    the icon. Change the rate to make the effect more pronounced.


    > **Quick GIMP Trick** When you need to zoom in on an image to get some fine work
    done, press the plus sign on your keyboard. Keep in mind, though: If you zoom
    in enough, it can get difficult to navigate the larger image. You wind up trying
    to adjust the scrollbars to locate the area you want. Instead, click the little
    crosshair icon in the bottom right side of the image editor.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'window. A smaller version of your image window appears with a target area outline
    that you can move to where you want it.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_336_0.png)


    On to the *finter*, or the *smudge* tool . . . Pretend that you are painting.
    You press your *finger* on the wet paint and move it around. The smudge tool has
    exactly the same effect on your virtual canvas or, at the very least, a similar
    effect.


    Finally, the *dodge and burn* tool looks like a stick-pin, but those who have
    worked in a darkroom might recognize it for something different—a stick with an
    opaque circle on the end of it. It is used to adjust the brightness or shade of
    various parts of an image (a photograph might have been partly overexposed).


    # ## Touching Up Photographs


    I’ve mentioned the idea of touching up photographs. The GIMP is a wonderful tool
    for this and more than just a little fun. One of the most common functions I use
    is changing the light levels on photographs, automatically and instantly. After
    all, light levels are rarely perfect unless you are a professional photographer
    and paying attention to every shot. Here’s what I do.


    Click Image on the Layers menu bar (or right-click the image to bring up the menu),
    move to the Colors submenu, then select Levels. You should see a window like the
    one in Figure 17-18. Notice the Auto button? That’s where the magic is. I’ve found
    that more often than not, you can get a nice, dependable reset of levels just
    by clicking this one button.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_337_0.png)


    Another very common adjustment you make to your photos, particularly scanned images,
    is contrast and brightness. You find this dialog in much the same place as Levels
    (above). Click Layers on the menu bar, then Colors, and finally Brightness-Contrast.
    To change one or the other, just pull the appropriate slider to the left or right
    (see Figure 17-19).


    There are also those things that are *just plain fun* to do. For instance, open
    an image in the GIMP, perhaps one you scanned in earlier. If you don''t have something
    handy, grab an image from a Web site. This is just something to play with. Now
    choose Filters from the image menu bar. A submenu opens with even more options.
    You might want to detach this menu—you''ll certainly want to play with what is
    there.


    Try FlareFX under the Light Effects menu. If you''ve ever taken a flash picture
    through a window, you recognize this effect. Then try Emboss under the Distorts
    submenu. The effect is that of a metal-embossed picture (see Figure 17-20).'
  merge: -1
  img_proc: true
- pgno: 338
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_338_0.png)


    Figure 17-19  To adjust brightness or contrast, just pull the sliders.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_338_1.png)


    Figure 17-20  Playing with the Emboss filter.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Take some time to try the various filter options. When you are finished, right-click
    a fresh image and select the Script-Fu menu. There are other interesting effects
    available here, such as Clothify under the Alchemy sub-menu. Your image look as
    though it had been transferred to a piece of cloth.


    # ## What Is Script-Fu?


    Although it sounds like a strange form of martial arts, Script-Fu is in fact a
    scripting language that is part of the GIMP With it, you can create scripts that
    automate a number of repetitive tasks to create desirable effects. When you created
    your logo, you might have noticed that a number of things were happening as it
    was being created. Try another logo and watch carefully what is happening. These
    steps are part of a Script-Fu script.


    The GIMP comes with a number of Script-Fu scripts, and these are used for much
    more than just creating logos. Click Xtms on the GIMP toolbox, and scroll down
    to the Script-Fu menu. In addition to logos, you see options for creating buttons
    (for Web pages), custom brushes, patterns, and more. Play. Experiment. Don''t
    be afraid.


    Open an image. Then right-click on that image and scroll down to the Script-Fu
    part of the menu. Another menu drops down with selections such as Alchemy, Decore,
    Render, and so on. These are all pre-created effects that ordinarily require many
    repetitive steps. Script-Fu is very much like a command script, where one command
    follows another. In this case, the commands just happen to be graphical transformations.


    # ## Resources


    GIMP Web Site


    http://www.gimp.org'
