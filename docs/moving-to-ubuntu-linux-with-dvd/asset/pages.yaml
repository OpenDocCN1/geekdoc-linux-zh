- pgno: 124
  md: '# Adding New Themes


    The fashion slaves among you will quickly grow tired of the themes and styles
    your system comes with—there are quite a few but not nearly enough for those surfing
    the edges of what''s hot today. That''s why you should keep the following Web
    sites in mind:


    ```

    http://www.gnome-look.org

    http://art.gnome.org

    ```


    You''ll find tons of themes, alternative wallpapers, and icons—enough to keep
    you busy for a long, long time. Installing a new theme is as easy as finding something
    you like, saving it in a folder or on your desktop, and then dragging the theme
    bundle onto the Theme Preferences dialog. A small dialog appears asking you to
    confirm the installation, and that''s all there is to it. Keep in mind, however,
    that some of the listed themes may just affect the Controls tab. As such, they
    don''t appear in the theme list, but do show up when you click Theme Details.


    Icons work the same way. Just download them and drag them onto the Theme Preferences
    dialog; confirm that you do indeed want to install this icon theme, and then look
    for it under the Icons tab.


    I know we haven''t talked about getting on the Net yet; we still have a few things
    to cover. If you just can''t wait, you can jump over to Chapter 7. Just make sure
    you come back here. You wouldn''t want to miss anything.


    # Adding Icons and Shortcuts to Your Desktop


    I covered this topic somewhat in the last chapter, but it is time to look at this
    in detail. While working with Nautilus, you might recall that you had a directory
    called Desktop and that this directory actually was your desktop. If you want
    to get a file onto your desktop, you can just drag and drop (copy or link) a file
    here. A good reason for doing this is that it puts things you use on a regular
    basis (a business spreadsheet perhaps or a contact list) right where you can quickly
    get to them.


    The single most useful icon you will likely want to add to your desktop is a link
    to a program on your system, what GNOME calls a Launcher. This is something you
    might have called a shortcut in the Windows world. Maybe you need to have your
    word processor or your CD player handy. Whatever it is, you would like it there
    in front of you.'
  merge: -1
  img_proc: true
