    # Moving Things Around


    On a fresh Ubuntu install, your desktop is clear of any icons. You probably still

    have that folder icon from the previous chapter sitting there somewhere, but

    if you don''t, create a folder icon now. Click this icon (hold the click) and
    drag

    it to some other spot on the desktop. Easy, isn''t it? When you log out from

    your GNOME session later on, make sure that you click Save Current Setup

    for future logins so that any changes you make here will follow you into the

    next session.


    The top (or bottom) panel is something else you may want to move. Just

    drag the panel and drop it to one of the four positions on the desktop (top,

    bottom, left, or right side). The location, by the way, can also be changed by

    right-clicking the panel and selecting Properties. On the card that appears

    (see Figure 5-5), you can select the location, labeled Orientation, off the

    panel from a drop-down list.


    > **Semantics** Technically, the taskbar is that portion of the bot-

    > tom panel that shows you open programs, letting you quickly

    > click from one to the other. You may find that people speak of

    > the taskbar and the panel interchangeably. That said, the pro-

    > gram switcher on the bottom panel is more appropriately called

    > the window list because this is the term used by GNOME.


    The top and bottom panels can be quite dynamic things. For instance,

    deselect the Expand check box and the panel shrinks to only show the space

    that is used up, leaving you with a small panel in the top or bottom center of

