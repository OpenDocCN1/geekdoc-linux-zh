- pgno: 421
  md: '# **There’s No Place Like $HOME**


    Yeah, I know. It’s a pretty cheesy pun, but I like it.


    Because you’ve had a chance to play with a few directory commands, I’d like to
    take a moment and talk about a very special directory. Every user on your system
    has a home directory. That directory can be referenced with the $HOME environment
    variable. To get back to your home directory at any time, simply type **cd $HOME**
    and no matter where you were, there you are. Actually, you only need to type **cd**,
    press <Enter>, and you are home. The $HOME is implied.


    The $HOME shortcut is great for shell scripts or anytime you want to save yourself
    some keystrokes. For instance, say you want to copy the file **remote.file** to
    your home directory and you are sitting in /usr/some_remote/dir. You could use
    either of the next two commands:


    ```

    cp remote.file /home/my_username

    cp remote.file $HOME

    ```


    The second command saves you keystrokes, and the more time you spend doing system
    administration, the more you will love shortcuts like this. To save the maximum
    keystrokes, you can also use the tile (-), a special character synonym for $HOME.


    ```

    cp remote.file -

    ```


    # **More on File Permissions**


    What you can and can’t do with a file, as defined by your username or group name,
    is pretty much wrapped up in four little letters. Look at the following listing
    (using **ls -l**) for an example. The permissions are at the beginning of each
    line.


    ```

    -rw-r--r--  1 mgagne mgagne     937 May 17 13:22 conf_details

    -rwxr-xr-x  1 root   root   45916220 Apr  4 12:25 gimp

    -rw-r--r--  1 root   root     826 Feb 12 09:43 mail_test

    -rw-r--r--  1 mgagne mgagne   44595 May 17 13:22 sk_open.jpg

    ```'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'Each of these letters can be referenced by a number. They are r, w, x, and
    s. Their numerical representations are 4, 2, 1, and “it depends.” To understand
    all that, you need to do a little binary math.


    Reading from right to left, think of the x as being in position 0. The w, then,
    is in position 1 and the r is in position 2. Here’s the way it works:


    +   2 to the power of 0 equals 1 (x is 1)

    +   2 to the power of 1 equals 2 (w is 2)

    +   2 to the power of 2 equals 4 (r is 4)


    To specify multiple permissions, you can add the numbers together. If you want
    to specify both read and execute permissions, simply add 4 and 1 and you get 5.
    For all permissions (rwx), use 7.


    File permissions are referenced in groups of three rwx sections. The r stands
    for read, the w means write, and the x denotes that the file is executable.


    Although these permissions are arranged in three groups of three rwx combinations,
    their meaning is the same in all cases. The difference has to do with who they
    represent rather than the permissions themselves. The first of these three represents
    the user, the second trio stands for the group permissions, and the third represents
    everybody that doesn’t fit into either of the first two categories.


    The commands you use for changing these basic permissions are chmod, chown, and
    chgrp.


    +   chmod  C**H**ange the M**O**De of a file (a.k.a. its permissions)

    +   chown  C**H**ange the O**W**Ner of the file or directory

    +   chgrp  C**H**ange the G**R**OuP of the file or directory


    # ## User and Group Ownership


    Let’s pretend you have a file called mail_test and you want to change its ownership
    from the root user to natika. Because root is the only user that can make that
    change, you need to prepend your command with sudo. This is very simple.


    ```

    sudo chown natika mail_test

    ```'
  merge: -1
  img_proc: true
- pgno: 423
  md: '> **Tip** Remember that you can also type `sudo -i` to enter a root shell,
    should you need to do several administrative commands. Then, just type `exit`
    to return to the regular non-admin shell.


    You can also use the `-R` option to change ownership recursively. Let’s use a
    directory called `test_directory` as an example. Once again, it belongs to root
    and you want to make every file in that directory (and below) owned by natika.


    ```

    sudo chown -R natika test_directory

    ```


    The format for changing group ownership is just as easy. Let’s change the group
    ownership of `test_directory` (previously owned by root) so that it and all its
    files and subdirectories belong to group accounts.


    ```

    sudo chgrp -R accounts test_directory

    ```


    You can even combine the two formats. In the following example, the ownership
    of the entire `finance_data` directory changes to natika as the owner and accounts
    as the group. To do so, you use this form of the `chown` command:


    ```

    sudo chown -R natika:accounts finance_data

    ```


    > **Quick Tip** You can use the `-R` flag to **recursively change everything in
    a subdirectory** with `chgrp` and `chmod` as well.


    Now, you are aware that files (and directories) are owned by some user and some
    group. This brings us to the next question.


    # ## Who Can Do What?


    From time to time, you need to modify file permissions. One reason has to do with
    security. However, the most common reason is to make a shell script file executable.
    This is done with the `chmod` command.'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'chmod mode filename


    For instance, if you have a script file called `list_users`, you make it executable
    with the following command:


    chmod +x list_users


    That command allows execute permissions for all users. If you want to make the
    file executable for the owner and group only, you specify it on the command line
    like this:


    chmod u+x,g+x list_users


    The `u` means user (the owner of the file, really), and `g` stands for group.
    The reason you use `u` for the owner instead of `o` is that the `o` is being used
    for “other,” meaning everyone else. The `chmod +x list_users` command can then
    be expressed as `chmod u+x, g+x, o+x list_users`. Unfortunately, this starts to
    get cumbersome. Now let’s look at a much more complicated set of permissions.
    Imagine that you want your `list_users` script to have read, write, and execute
    permissions for the owner, read and execute for the group, and read-only for anybody
    else. The long way is to do this as follows:


    chmod u=rwx,g=rx,o=r list_users


    Notice the equal sign (=) construct rather than the plus sign (+). That’s because
    the plus sign adds permissions, and in this case you want them to be absolute.
    If the original permissions of the file allowed write access for other, the plus
    sign construct would not have removed the execute permission. Using the minus
    sign (-) removes permissions. If you want to take away execute permission entirely
    from a file, you can do something like this:


    chmod -x list_users


    One way to simplify the `chmod` command is to remember that `r` is 4, `w` is 2,
    and `x` is 1, and add up the numbers in each of the three positions. `rwx` is
    then 4 + 2 + 1, or 7. `r-x` translates to 4 + 1, and `x` is simply 1. That monster
    from the second to last example can then be rewritten like this:


    chmod 751 list_users'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# Who Was That Masked User?


    Every time you create a file, you are submitted to a default set of permissions.
    Go ahead. Create a blank file using the touch command. I am going to call my blank
    file fish.


    ```

    $ touch fish

    ```


    Now have a look at its permissions by doing an ls -1.


    ```

    $ ls -1

    -rw-r--r-- 1 mgagne mgagne 0 2006-03-10 14:31 fish

    ```


    Without doing anything whatsoever, your file has read and write permissions for
    both the user and group, and read permission for everybody else. This happens
    because you have a default file-creation mask of 002. You can discover this using
    the umask command.


    ```

    $ umask

    0022

    ```


    The 2 is subtracted from the possible set of permissions, rwx (or 7). 7−0 remains
    7, while 7−2 is 5. But wait—5 stands for r-x, or read and execute. How is it that
    the file only shows a read bit set? That’s because newly created files are not
    set executable. At best, they provide read and write permissions for everyone.
    Another way to display this information is by using the -S flag. Instead of the
    numeric output, you get a symbolic mask displayed.


    ```

    $ umask -S

    u=rwx, g=rwx, o=rx

    ```


    If you have an application that requires you to provide a default set of permissions
    for all the files you create, change umask to reflect that inside your scripts.
    As an example, let’s pretend that your program or script creates text files that
    you want everyone to be able to read (444). Because the execute bit isn’t a factor
    anyway, if you mask out the write bit using a 2 all around, everybody will have
    read permission. Set your umask to 222, create another file (called duck this
    time), and then do an ls -1 to check things out.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'marcel@ubuntu:~$ umask 222

    marcel@ubuntu:~$ touch duck

    marcel@ubuntu:~$ ls -l

    -r--r--r-- 1 mgagne mgagne 0 2006-03-10 15:26 duck


    # The *setuid* Bit


    Aside from those three permission bits (read, write, and execute), there is one
    other very important one: the *s* bit, sometimes referred to as the *setuid* or
    *setgid* bit depending on its position.


    The reasoning behind this particular bit follows. Sometimes, you want a program
    to act as though you are logged in as a different user. For example, you may want
    a certain program to run as the root user. This would be a program that you want
    a nonadministrative user to run, but (for whatever reason) this program needs
    to read or write files that are exclusively root''s. The *sendmail* program is
    a perfect example of that. The program needs to access privileged functions to
    do its work, but you want regular (nonroot) users to be able to send mail as well.


    The *setuid* bit is a variation on the execute bit. To make the hypothetical program
    *ftl_travel* executable by anyone but with root''s privileges, you change its
    permissions as follows:


    ```

    chmod u+s ftl_travel

    ```


    The next step, as you might guess, is to combine full permissions and the *setuid*
    bit. Start by thinking of the *setuid* and *setgid* bits as another triplet of
    permissions. Just as you could reference r, w, and x as 4, 2, and 1, you can also
    reference setuid as 4, setgid as 2, and other (which you don''t worry about).


    So, using a nice, complicated example, let''s make the command so that it has
    read, write, and execute permissions for the owner, read and execute permissions
    for the group, and no permissions for anyone else. To those with execute permission,
    though, you want to have it *setuid*. You could also represent that command either
    symbolically or in a numerical way.


    ```

    chmod u=rwx,g=rx,o= ftl_travel

    chmod 4750 ftl_travel

    ```'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'The 4 in the front position represents the setuid bit. If you want to make
    the program setgid instead, you can change that to 2. And, yes, if you want the
    executable to maintain both the owner’s permissions and that of the group, you
    can simply add 4 and 2 to get 6. The resulting set of permissions is as follows:


    ```

    chmod 6750 ftl_travel

    ```


    Changing the setuid bit (or setgid) is not strictly a case of providing administrative
    access to nonroot users. This can be anything. You might have a database package
    that operates under only one user ID, or you may want all users to access a program
    as though they were part of a specific group. You have to decide.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_427_0.png)


    > *Important Note* You cannot use the *setuid* or *setgid* bit for shell scripts
    (although there are Perl hooks to do this). This doesn’t work for security reasons.
    If you need to have a script execute with a set of permissions other than its
    own, you have to write a little C program that wraps around your script and then
    allows the program rather than the script to have *setuid* (or *setgid*) permissions.


    The lesson here is that making something setuid immediately raises security issues.
    Know why you are taking this approach and consider the risks.


    # ## Finding Anything


    One of the most useful commands in your arsenal is the find command. This powerhouse
    doesn’t get the credit it deserves. Generally speaking, find is used to list files
    and redirect (or pipe) that output to do some simple reporting or backups. There
    it ends. If anything, this should only be the beginning. As versatile as find
    is, you should take some time to get to know it. Let me give you a whirlwind tour
    of this awesome command. Let’s start with the basics:


    ```

    find starting_dir [options]

    ```'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'One of those options is -print, which only makes sense if you want to see any
    kind of output from this command. You could easily get a listing of every file
    on the system by starting at the top and recursively listing the disk.


    ```

    find / -print

    ```


    Although that might be interesting and you might want to redirect that to a file
    for future reference, it is only so useful. It makes more sense to search for
    something. For instance, look for all the JPEG-type image files sitting on your
    disk. Because you know that these images end in a .jpg extension, you can use
    that to search.


    ```

    find / -name "*.jpg" -print

    ```


    Depending on the power of your system, this can take a while and you are likely
    to get a lot of Permission Denied messages (particularly as you traverse a directory
    called /proc). If you are running this as a user other than root, you likely get
    a substantial number of Permission Denied messages. At this point, the usefulness
    of find should start to become apparent because a lot of images stashed away in
    various parts of the disk can certainly add up as far as disk space is concerned.
    Try it with an .avi or .mpg extension to look for video clips (which can be very
    large).


    If you are trying to locate old files or particularly large files, try the following
    example. Look for anything that has not been modified (this is the -mtime parameter)
    or accessed (the -atime parameter) in the last 12 months. The -o flag is the OR
    in this equation.


    ```

    $ find /data/Marcel -size +1024 \\

    \( -mtime +365 -o -atime +365 \) -ls

    ```


    A few techniques introduced here are worth noting. The backslashes in front of
    the round brackets are escape characters; they are there to make sure the shell
    does not interpret them in ways you do not want it to—in this case, the open and
    close parentheses on the second line. The first line also has a backslash at the
    end. This is to indicate a line break, as the whole command does not fit neatly
    on one line of this page. If you typed it exactly as shown without any backslashes,
    it would not work; however, the backslashes in the second line are essential.
    The preceding command also searches for files that are greater than 500KB in size.
    That is what the -size +1024 means because'
  merge: -1
  img_proc: true
- pgno: 429
  md: "1024 refers to 512-byte blocks. The -ls at the end of the command tells the\
    \ system to do a long listing of any files it finds that fit my search criteria.\n\
    \nEarlier in this chapter, you learned about `setuid` and `setgid` files. Keeping\
    \ an eye on where these files are and determining if they belong there are important\
    \ aspects of maintaining security on your system. Here’s a command that examines\
    \ the permissions on your files (the `–perm` option) and reports back what it\
    \ finds.\n\n```\nfind / -type f \\( -perm -4000 -o -perm -2000 \\) -ls\n```\n\n\
    You may want to redirect this output to a file that you can later peruse and decide\
    \ on what course of action to take. Now let’s look at another find example to\
    \ help you uncover what types of files you are looking at. Your Linux system has\
    \ another command called `file` that can deliver useful information on files and\
    \ what they are, whether they are executables, text files, or movie clips. Here’s\
    \ a sample of some of the files in my home directory as reported by `file`:\n\n\
    ```\n$ file $HOME/*\ncode.layout:\t\tASCII text\ncron.txt:\t\ndata\ndainbox:\t\
