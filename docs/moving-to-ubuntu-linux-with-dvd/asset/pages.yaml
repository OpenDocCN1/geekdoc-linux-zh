- pgno: 190
  md: 'The great thing here is that you do not have to go to a variety of sites to
    hunt down and identify appropriate software. You call `apt-get` with the `install`
    parameter and off you go. Notice as well that `apt-get` automatically picks up
    dependencies for a given package and installs them when needed. If you want to
    update to the latest version of `txttype`, substitute the `install` parameter
    with `upgrade`.


    I don’t want to confuse things here but speaking of updates, one of the most important
    things an administrator must do is keep packages up-to-date. You can install upgrades
    to all installed packages with this version of the `apt-get`:


    ```

    sudo apt-get upgrade

    ```


    Perhaps the most famous example of Debian’s prowess is symbolized by the following
    command:


    ```

    sudo apt-get dist-upgrade

    ```


    This is, by no means, something that is used on a regular basis. It is used to
    upgrade from one major release of a distribution to another (say Breezy to Dapper).


    # Graphical or Nongraphical?


    That is the question, or at least one of them. I routinely work with the com-
    mand line and with the graphical desktop. Despite my comfort at the com- mand
    line, I still use Synaptic and find it an invaluable tool.


    What should you use? Synaptic is certainly easier for a new user, but the point
    of showing you these things is two-fold. First, I’d like you to realize that there
    is more than one way to do it. That applies to graphical tools (as you saw earlier
    in this chapter) and command-line tools. Second, I want you to see that the shell
    isn’t that scary, even for dealing with things like software installation. In
    Chapter 21, the final chapter of this book, I’ll give you a great introduction
    to working with the Linux shell.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "# Chapter\n\n# 9\n\n# Instant Messaging,  \nand IRC, Too!\n\nWords, words,\
    \ words... and then a whole lot more words, all of them flowing from one person\
    \ to another. Whatever cool content exists on the world's Web sites, the Internet\
    \ is still all about communication.\n\nThese days, a new kind of communication\
    \ has evolved—I call it mini-email. The one-liner. The short and sweet message.\
    \ The instant message. The Net-connected society has grown to love those quick,\
    \ always-on means of sending each other information. My own parents (who live\
    \ in another province) send me a daily one-line weather report via their Jabber\
    \ instant messaging client. If you are coming from the Windows world, there's\
    \ a good chance you already have one of these accounts, either with Yahoo!, AOL,\
    \ MSN, or Jabber."
