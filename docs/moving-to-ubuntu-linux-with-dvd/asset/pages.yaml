    # IRC: Internet Relay Chat


    Internet Relay Chat, better known as IRC, is a distributed client-server system
    in which users can communicate with any number of other users in real time. IRC
    servers host channels that are dedicated to discussion forums on specific topics.
    These topics aren’t fixed other than by convention and the whims of the IRC operators.
    If you are old enough to remember CB radio (that is, those of you in your mid-30s
    and up), you pretty much understand IRC—at least in the human sense of the experience.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'A number of IRC servers exist around the world, some with thousands of channels.
    IRC servers can also peer with other servers. IRC channels cover a plethora of
    topics, from purely social to politics to business or to high technology. In the
    Linux world, there are channels devoted to programming in most of the popular
    languages, as well as your favorite Linux distribution, office applications, games,
    and so on. IRC channels are great places to meet and exchange information, ask
    questions, answer questions, or just plain chat. All this chattering takes place
    via an IRC client such as XChat, which I will now discuss.


    > Note It''s true that the majority of IRC servers tend to be vast collections
    of topics linked to other servers around the world. There are private IRC servers
    as well for more focused discussions. I run one of these servers myself to provide
    a meeting place for my readers on a channel called #wtfchat (more on this later
    in this chapter). Users on #wtfchat can ask questions, help each other out, or
    just plain chat.


    # XChat


    To start XChat, click the Applications launcher on the top panel, navigate to
    Internet and click XChat IRC (xchat_name, xchat). When the program starts for
    the first time, you see a window with your username listed as a nickname (see
    Figure 9-9). There are also alternative nicknames listed on the off chance that
    someone else might be using that name already. Even though this defaults to your
    username, or your login name, you can choose whatever you like here. In fact,
    most people on IRC have some nickname other than their own names. On IRC, you''ll
    see me logged in as wft1. That is my nickname.


    If you know which network the channel you want to connect to is on (or if you
    just want to see what channels are available), click one of the choices in the
    list of Networks and click the Connect button. One that you might find interesting
    right off the bat is the Ubuntu Servers entry, which automagically logs you into
    the ubuntu IRC discussion channel, a great place to ask Ubuntu Linux specific
    questions. However, I do want to show you how to add other networks. Let''s add
    my own IRC server here so you can see how it''s done.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_200_0.png)


    **Figure 9–9** Even when running XChat for the first time, a large number of networks
