- pgno: 381
  md: '# Mines


    Most people have played some variation of this game going back many years. Early
    on, it was one of two games included with “that other OS” where you probably knew
    it as Minesweeper. The idea would be far more nerve-wracking if this were anything
    but a game. Hidden somewhere beneath the squares on the game board are mines (see
    Figure 19-10). Step on them and you explode. Sound like fun?


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_381_0.png)


    Figure 19-10   It’s a good thing Mines is just a game.


    You have to uncover the squares that don’t contain mines while flagging the ones
    that do have mines. You uncover mines by clicking a square with the left mouse
    button, and you flag by clicking with the right. A large, safe area uncovers magically
    when you click somewhere in the middle. The only hint you get comes from numbers
    that appear above the square. A 1 on a square indicates that there is one mine
    hidden in one of the squares adjoining to that square. A 2 means there are two
    mines in the adjoining squares. Your job is to look at these numbered squares
    and try to figure out which squares actually have mines.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'When the game gets too easy for you, bring up the Preferences menu and change
    the **Field Size** from the default Small to Medium, Large, or whatever frightening
    map you care to imagine.


    # ## Nibbles


    This one is interesting in that it feels like a few other very similar games I
    played in my early arcade days. There’s even a hint of the light cycles from the
    movie *Tron* here, a hint that’s particularly felt when you play the game over
    a network. You and up to three of your friends can play Nibbles online.


    As the worm eats more and more of the gems scattered across the playing field,
    he gets longer and longer. Around the playing field, there are walls, with openings
    through which the work can pass, making it easier to move from one side of the
    field to the other. Unfortunately, no matter how clever you are, eventually you
    are going to run into your own tail (or at least some part of your body), and
    that’s where the game ends.


    # ## Robots


    Robots is an ancient game—ancient in the computer world, that is—where you try
    to avoid being killed by an advancing horde of evil robots (see Figure 19-11).
    Every time you make a move, the robots calculate a way to advance toward you en
    masse. What you need to do to survive is use their weaknesses to your advantage.
    The robots have the sheer weight of numbers on their side, but they are still
    pretty stupid; and if they run into anything, they blow up. You can force them
    to run into each other, thereby destroying them, or push junk piles (also known
    as previously destroyed robots) in their way.


    If the situation appears totally hopeless, hit the Teleport button. The only catch
    with teleportation is that you have a limited number of safe teleports. That leaves
    you with the purely Random teleport, which can land you in an even bigger mess.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_383_0.png)


    Figure 19-11 Save yourself from an army of marauding, evil, and downright nasty
    robots.


    # Same GNOME


    Same GNOME is one great little puzzle game that takes no time to learn, but forever
    to master (see Figure 19-12). You start with a grid of brightly colored marbles.
    When you move your mouse cursor over a marble, all of the similarly colored marbles
    in a group start to spin. Click that group and the marbles disappear: Any marbles
    that were above your group fall below. The net effect of this is that you are
    creating other groupings, which can then be removed. The idea is to clear the
    grid of marbles in as few moves as possible. A little strategic planning mixed
    with some good spatial visualization is the key to success. If you don''t like
    the colored marbles, switch to the planets view (my personal favorite).'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_384_0.png)


    # Tali


    In another universe, you know this game as Yahtzee, or as some of my friends call
    it, poker dice (see Figure 19-13). The idea is to collect a number of classic
    poker hands, including a full house, a small and large straight, a three of a
    kind, four of a kind, and of course, the granddaddy of rolls, the five of a kind
    or Yahtzee. Whenever the dice are rolled, click the ones you want to roll again,
    then click the Roll button. You have two chances on each roll to get the score
    you want. As with the real nonvirtual version of the game, you get an extra 35
    points for getting 63 points or more in the top six rows.


    The number of players is configurable, so if you don''t want to see what the computer
    drums up when it plays you, change the number of opponents to zero.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_385_0.png)


    Figure 19-13 Tali, an excellent recreation of the classic Yahtzee game.


    # Tetravex


    Tetravex is a puzzle game using tiles positioned in a grid (see Figure 19-14).
    The object of the game is to rearrange the pieces so that the same numbers touch
    each other across the grid (for example, 2 touches 2, and 5 touches 5). When all
    the squares are arranged so that only the same numbers touch each other, you win.
    As you play, a timer counts up in the bottom-right corner of the game, so you
    are playing against time as well. To play the game, you drag pieces from the righthand
    box and replace them in the left play area. When putting squares into the left
    play area, the computer stops you from putting pieces down when the numbers don’t
    match up.


    If you find it a bit difficult at first, click Size and switch to a 2×2 grid.
    When you get comfortable, raise the number until you get to the 6×6 grid.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_386_0.png)


    Figure 19–14  All you have to do is make sure that the same numbers touch each
    other across the grid. Sounds much easier than it is.


    # Must-Have Linux Games


    With Tetravex, we’ve wrapped up our list of Ubuntu games, at least those that
    come preinstalled. That is, by no means, the end of your Linux games experience.
    In fact, we’re just softening you up. There are literally hundreds of games that
    you can download, install, and play for free! So, before I finish up this chapter,
    I’m going to tell you about a few of my personal favorites.


    # Frozen-Bubble


    Perhaps my favorite arcade-style game under Linux also happens to be one of the
    most addictive games I have ever run across. It is called *Frozen-Bubble*. This
    is a bright, beautiful, and colorful game with dozens of levels featuring a'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'great musical soundtrack, cool sound effects, and at least one penguin. You''ll
    just have to trust me on this one—this game is a must-have, and no, age doesn''t
    enter into it. Still with me? Here''s the premise.


    Frozen, colored bubbles are arranged in various patterns against a wall at the
    top of your screen. Some kind of hydraulic press behind the wall slowly pushes
    the bubbles toward you (see Figure 19–15). Your job is to guide your cute little
    penguin gunner (so to speak) to aim the bubble launcher at the oncoming wall of
    bubbles. If three of more bubbles of the same color are together, fire a similarly
    colored bubble at that group, and the arrangement collapses. Destroy all the bubble
    groups, and you win that level. If any of the bubbles at the wall touch you, everything
    freezes over, and your penguin cries a river of tears. It''s silly. It''s fun.
    You are going to love it.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_387_0.png)


    Figure 19–15 The incredibly addictive Frozen-Bubble.'
