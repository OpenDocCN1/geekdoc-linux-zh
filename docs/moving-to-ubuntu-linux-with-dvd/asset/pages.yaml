  md: 'While in tab mode (as shown in Figure 10-3), you can right-click a tab to bring
    up the tab menu. From there, you can close or reload the current tab (or all tabs)
    and even open new tabs. Another way to close the active tab is to click the X
    at the end of the tab list.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_210_0.png)


    > After you have several tabs open, you might decide that you would like a particular
    site in another position. Let''s say that you are using one site more than another
    and you would like it in the first position but it is currently at the end. No
    problem. Just click the tab and drag it to the new position.


    # Go for the Big Screen


    Just as there''s no comparison between your old twenty-inch TV and that new fifty-inch
    flat panel HDTV, nothing beats looking at the virtual world through a big screen.
    As much as I would like to, I can''t increase the size of your monitor, but I
    can help you with the next best thing. When you are busy surfing the Internet
    and you want as much screen as possible, why not try Firefox''s full-screen mode?


    At any time while you are viewing a page, you can click View on the menu bar and
    select Full Screen. The title bar disappears, as do the top and bottom panels
    and all other border decorations. Another, quicker way to switch to full-screen
    mode is to press <F11>. Pay attention to this because this is how you switch back
    to normal view.


    # Ban the Pop-Up Ads, Forever!


    Honestly, I can''t think of a single person who likes to visit a Web site, only
    to have that site throw up annoying pop-up window ads. Firefox lets you stop this
    easily. Actually, Firefox has pop-ups blocked by default, but you may want to
    alter that behavior for some sites. Here''s how.


    Start by bringing up the Preferences menu again (click Edit on the menu bar and
    choose Preferences). From the category list, choose Content (see Figure 10-4).
    You''ll see a check box labeled Block Popup Windows. Next to that label is a button
    labeled Allowed Sites. Clicking this button allows you to specify sites where
    pop-ups may be desirable. When you are satisfied with your configuration, click
    OK to close the Preferences menu.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_211_0.png)


    Figure 10-4 Firefox lets you specify sites where pop-ups are okay.


    When Firefox intercepts a pop-up, it displays a message like the one in Figure
    10-5.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_211_1.png)


    Figure 10-5 Firefox has blocked a pop-up. What would you like to do?


    Clicking the Preferences button at the end of the bar offers you three choices.
    You can allow pop-ups for that particular Web site or edit the pop-up blocker
    preferences for that particular Web site. You also have the option of choosing
    never to see the message when pop-ups are blocked.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Yummy... Cookies


    Not that kind of cookie. Cookies are simply small text files transmitted to your
    browser (or system) when you visit a Web site. The original idea behind cookies
    was that a server would give you a cookie as a marker to indicate where you had
    previously visited. That cookie might store a username and password to access
    a particular Web site or other information related to your visit, such as an online
    shopping cart. When you next visit the site, the server would ask your browser
    whether it had served you any cookies, and your browser would reply by sending
    the cookies from before. In this way, the Web site would recognize you when you
    next visited, and certain useful defaults would be set up for you. Cookies can
    be very good.


    The problem with cookies is that they can also be shared within larger domains,
    such as advertising rings. Using these shared cookies, advertisers can build a
    profile of your likes and dislikes, tailoring and targeting advertising to you
    specifically. Many people object to this method of building user profiles and
    consider the use of cookies to be quite unethical, an invasion of privacy. The
    dilemma then is to find a way to accept the cookies you want and reject the others.


    Firefox is quite versatile in its handling of cookies. Before you excitedly turn
    off all cookies, do remember that they can be useful, particularly with online
    services such as banks and e-commerce sites. That said, you may very much want
    to curb cookie traffic as much as possible.


    From the Preferences menu, open the Privacy category submenu (see Figure 10-6).
    Below the category icons, you see a tabbed list of options. Click the tab labeled
    Cookies to configure your options.


    Unless you want to refuse all cookies, leave the Allow Sites to Set Cookies check
    box checked. Then, from the Keep Cookies drop-down box, choose Ask Me Every Time.
    Click Close, and resume your surfing. When you visit a site that tries to set
    or modify a cookie, an alert pops up, alerting you to the cookie and asking you
    how to proceed (see Figure 10-7). If you decide to deny a cookie and you never
    want to see another cookie from that site, check Use My Choice for All Cookies
    from This Site before clicking Allow for Session or Deny.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_213_0.png)


    Figure 10-6 Back to Firefox’s Preferences menu to configure cookie policies.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_213_1.png)


    Figure 10-7 A pop-up allows you to allow or deny a cookie. This is a good site
    to allow all cookies from.'
