- pgno: 247
  md: "# **Chapter 13**  \nOpenOffice.org Writer  \n(It Was a Dark and Stormy Night\
    \ . . .)\n\n*I just love using this infamous opening from Edward George Bulwer-Lytton's\
    \ Paul Clifford (written in 1830) to introduce a chapter on word processing. Those\
    \ famous words, \"It was a dark and stormy night,\" were made even more famous\
    \ (infamous?) by Charles M. Schulz's Snoopy, that barnstorm-ing, literary beagle.\
    \ It just seems fitting considering this chapter's topic—word processors.*\n\n\
    *Word processors run the gamut in terms of complexity, from simple programs that\
    \ aren't much more than text editors to full-blown desktop publishing systems.\
    \ Users coming from the Microsoft world are most likely to use OpenOffice Writer,\
    \ part of the OpenOffice.org suite.*"
  merge: -1
  img_proc: true
- pgno: 248
  md: 'OpenOffice.org is actually the free sibling of the commercial StarOffice suite.
    When Sun Microsystems decided to open the source to StarOffice, it became another
    boon for the open source community, not to mention the average user. OpenOffice
    became the free version of this powerful word processor, spreadsheet, and presentation
    graphics package, and StarOffice became the corporate choice. Both of these are
    full-featured office suites, and users familiar with Microsoft Office will feel
    right at home with the similarities.


    You might well be wondering what differences exist between these two sibling suites.
    The great difference is the price. For anyone with a reasonably fast Internet
    connection (or a helpful friend), OpenOffice is free. StarOffice, on the other
    hand, costs something for the boxed set. Included with StarOffice are documentation
    and support, as well as additional fonts and clipart. That said, you’ll find that
    it is still far less expensive than the Windows alternative.


    There are other word processor choices at your disposal. They aren’t installed,
    but that’s easily resolved with Synaptic (refer to Chapter 8). I’ll tell you about
    some of those choices and why you might want to look into them at the end of this
    chapter.


    > It may interest you to know that this book was written using OpenOffice.org
    Writer 2.0.


    # # Getting Started with OpenOffice.org Writer


    Start OpenOffice.org Writer by clicking the Applications menu on the top panel,
    navigating to the Office submenu, and selecting OpenOffice.org2 Writer (see Figure
    13-1).


    > To run OpenOffice.org Writer from the command line (or via your <Alt+F2> shortcut),
    use the command oowriter (think OpenOffice.org Writer).


    OpenOffice.org Writer starts up with a blank page, ready for you to release that
    inner creative genius (see Figure 13-2). At the top of the screen, you find a
    menu bar where commands are organized based on their categories, including the
    friendly sounding Help submenu (more on that shortly).'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_249_0.png)


    **Figure 13–1** OpenOffice.org Writer and its components are in the Office submenu.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_249_1.png)


    **Figure 13–2** OpenOffice.org Writer on startup.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'At this point, Writer is open, and you are looking at a blank screen. Let’s
    write something.


    # Write Now!


    As any writer will tell you, nothing is more *intimidating* than a blank page.
    Because I opened this chapter with a reference to the famous phrase, “It was a
    dark and stormy night,” why don’t we continue along that theme? That phrase is
    often pointed to as an example of bad writing, but the phrase in itself is only
    so bad. The paragraph that follows is even worse. Type this into your blank Writer
    page, as shown in Figure 13-3.


    > *Paul Clifford*, by Edward George Bulwer-Lytton


    It was a dark and stormy night; the rain fell in torrents—except at occasional
    intervals, when it was checked by a violent gust of wind which swept up the streets
    (for it is in London that our scene lies), rattling along the house-tops, and
    fiercely agitating the scanty flame of the lamps that struggled against the darkness.
    Through one of the obscur''est quarters of London, and among haunts little loved
    by the gentlemen of the police, a man, evidently of the lowest orders, was wending
    his solitary way. He stopped twice or thrice at different shops and houses of
    a description correspondent with the appearance of the quarter in which they were
    situated—and tended inquiry for some article or another which did not seem easily
    to be met with. All the answers he received were couched in the negative; and
    as he turned from each door he muttered to himself, in no very elegant phraseology,
    his disappointment and discontent.


    Okay, you can stop there. Isn’t that wonderful stuff? If you feel the need to
    read more, I’ve got links to the story and the famous Bulwer-Lytton fiction contest
    at the end of this chapter.


    # The Hunt for Typos


    For years, I’ve been including the following tag line in the signature section
    of my emails: “This massagee wos not speel or gramer-checked.” Given that I continue
    to use this line, I am obviously amused by it, but never running a spell check
    is far from good practice when your intention is to turn in a professional document.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '229


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_251_0.png)


    # **Figure 13-3  Your first document, dark and stormy.**


    OpenOffice.org Writer can do a spell check as you type without actually correcting
    errors. With this feature, words that don’t appear in the dictionary show up with
    a squiggly red line underneath them, which you can then correct. Many people find
    this a useful feature, but some, like me, prefer to just check the whole document
    at the end of writing. This feature is activated by default but you can deactivate
    it if you prefer. Here’s how.


    Click Tools on the menu bar, and then select Options. This is a multipurpose dialog
    that allows you to configure many of OpenOffice.org’s features (see Figure 13-4).
    For the moment, we concentrate on the auto spell check. To the left of the dialog
    is a sidebar with many categories. Click the plus sign beside Language Settings.
    This drops down a submenu from which you choose Writing Aids. Look to the right
    and you see a section called Options, at the top of which is the check box Check
    Spelling as You Type. To turn off the auto spell check feature, un-check this
    box, and then click OK to close the dialog.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_252_0.png)


    Figure 13–4 Turning off the spelling-as-you-type feature.


    To start a full document spell check, click Tools on the menu bar, then Spellcheck
    to begin. You can also press <F7> at any time to start a spell check.


    # ## What Language Is That?


    OpenOffice.org supports many different languages, and depending on where you picked
    up your copy, it may be set for a different language than your own. To change
    the default language, click Tools on the menu bar, then click Options, Language
    Settings, and Writing Aids. Look familiar?


    The dialog that appears should have OpenOffice.org MySpell Spell-Checker checked
    (refer to Figure 13–4). You can then click the Edit button next to it and select
    your language of choice under the Default Languages for Documents drop-down box.
    When you have made your choice, click OK to exit the various dialogs.


    # ## Saving Your Work


    Now that you have created a document, it is time to save it. Click File on the
    menu bar and select Save (or Save As). When the Save As window appears, select
    a folder, type in a filename, and click Save (see Figure 13–5). When you save,
    you can also specify the File type to be OpenOffice.org''s default Open-'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Document Text format (.odt), RTF, straight text, Microsoft Word format, and
    a number of others. You can even save in Palm doc format so you can take it with
    you on your Palm device.


    If you want to create a new directory under your home directory, you can do it
    here as well. Click the icon that looks like a folder with a star or globe in
    front of it (the middle icon near the righthand corner), and then enter your new
    directory name in the Create New Folder pop-up window.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_253_0.png)


    **Figure 13–5** It is always good to save your work.


    Should you decide to close OpenOffice.org Writer at this point, you can always
    return to your document at a later time by clicking *File* on the menu bar and
    selecting *Open*. The *Open File* dialog appears, and you can browse your directories
    to select the file you want. You can specify a file type via a fairly substantial
    drop-down list of available formats. This gives you a chance to narrow the search
    to include only text documents, spreadsheets, or presentations. You can also specify
    a particular document extension (for example, only `*.doc` files) or a particular
    pattern.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Printing Your Document


    Invariably, the whole point of typing something in a word processor might be to
    produce a printed document. When you are through with your document, click File
    on the menu bar and select Print.


    The Print dialog has several options (see Figure 13–6). The easiest thing to do
    after selecting your printer is just to click OK. The print job is directed to
    your printer of choice and, in a few seconds, you have a nice, crisp version of
    your document. You can select a page range, increase the number of copies (one
    to all your friends), or modify the printer properties (paper size, landscape
    print, and so on).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_254_0.png)


    You can also print to a file. By default, this generates a PostScript document,
    a kind of universal printer language. A number of tools can view Post-Script documents
    including the Evince PS/PDF viewer included with Ubuntu Linux. Just navigate to
    any PostScript document with Nautilus, double-click the document, and Evince opens
    the document for viewing.


    You can also save to PDF, something I''ll cover a little later in the chapter.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# ### Toolbars of Every Kind . . .


    Now that you are feeling comfortable with your new word processor, let’s take
    a quick tour of the various toolbars, icons, and menus in Writer.


    The icon bar directly below the menu bar is called the *Standard bar*, and it
    contains icons for opening and creating documents, cutting and pasting, printing,
    and other tasks. The Standard bar is common to all the OpenOffice.org applications
    (Writer, Calc, Impress, and so on).


    Below the Standard bar is the *Formatting bar*. It provides common editing options,
    such as font selection, bolding, italics, centering, and so on. Select words or
    phrases in your document with the mouse (hold, click, and drag across the desired
    text), then click *B* for bold or *I* for italic. This bar changes from application
    to application, depending on what type of formatting is most needed.


    At the bottom of the editing screen is the *Status bar*. There, you see the current
    page number, current template, zoom percentage, insert (or overwrite) mode, selection
    mode, hyperlink mode, and the current save status of the document. (If the document
    has been modified and not saved, an asterisk appears.)


    In all cases, pausing over each of the icons with your mouse cursor makes a tooltip
    appear, describing the functions of the individual icons.


    # ### Help!


    Under the Help heading on the menu bar, you find plenty of information. By default,
    tooltips are activated so that when you pause your mouse cursor over an item,
    a small tooltip is shown. These tips are terse, usually no more than a couple
    of words. It’s also possible to get a little more information by turning on *extended
    tips*. Before I tell you how to do that, have a look at Figure 13-7 for a sample
    of the difference. The image at the top shows the default tip for the Paste icon,
    whereas the image on the bottom shows the extended tip for the same function.


    For that little extra help, click Tools and select Options. Under the OpenOffice.org
    menu on the right, you find a subsection labeled General. Click there and then
    look over to the right. You see a check box for Extended Tips near the top. Turning
    that on gives you slightly more detailed tooltips.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_256_0.png)


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_256_1.png)


    **Figure 13-7** What a difference extended tips makes.


    If you are looking for help on a specific topic, there’s always the included manual.
    Click Help on the menu bar and select OpenOffice.org Help (you can also press
    <F1>). The various tabs at the top left of the help screen let you search for
    topics by application with the Contents tab, alphabetically using the Index tab,
    and by keyword using the Find tab. You can even set bookmarks under the Bookmarks
    tab for those topics you regularly access.


    # To Word or Not to Word?


    Ah, that is the question indeed. OpenOffice.org’s default document format is the
    OASIS OpenDocument XML (eXtensible Markup Language) format, an open standard for
    document formats (it is saved with an .odt extension). As of the beginning of
    May 2006, the OpenDocument format is an ISO standard. The OpenDocument format
    is the closest thing to document freedom you can get (short of plain text). The
    format is vendor and applica-'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'tion neutral. You are guaranteed support and portability because it is an open
    standard. Many organizations such as the European Commission and the State of
    Massachusetts recommend the OASIS OpenDocument format for the very reasons I''ve
    mentioned. In fact, Massachusetts requires the use of open document standards
    by law. For more on this emerging standard, check the resources section at the
    end of this chapter.


    Alternatively, the main reason for sticking with Word format is, quite frankly,
    that Word is everywhere. The sheer number of Word installations is the very reason
    that OpenOffice.org was designed to support Microsoft Office format as thoroughly
    as it does. That said, if you do want to switch to the OASIS OpenDocument format,
    Writer provides an easy way to do that. Rather than converting documents one by
    one, the Document Converter speeds up the process by allowing you to run all the
    documents in a specific directory in one pass. It also works in both directions,
    meaning that you can convert from Word to OpenOffice.org format, and vice versa.
    The conversion creates a new file but leaves the original as it is.


    From the menu bar, select File, move your mouse to Wizards, and then select Document
    Converter from the submenu. To convert your Microsoft Office documents (you can
    do the Excel and PowerPoint documents at the same time), click Microsoft Office
    on the menu, and then check off the types of documents you want. The next screen
    asks whether you want both documents and templates or just one or the other. You
    then type in the name of the directory you want to import from and save to (this
    can be the same directory). After you enter your information and go to the next
    screen, the program confirms your choices and gives you a final chance to change
    your mind. Click Convert to continue. As the converter does its job, it lists
    the various files that it encounters and keeps track of the process.


    When the job is done, you have a number of files with an .odt extension in your
    directory. If you change your mind, don''t worry. Your original files are still
    there, so you''ve lost nothing.


    If working with Word documents in Word format is important, then read on. Ah,
    heck. Even if it isn''t, you should read on.


    # ### Personalizing Your Environment


    Every application you use comes with defaults that may or may not reflect the
    way you want to work, and this is true with OpenOffice.org Writer, as well.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Click **Tools** on the menu bar and select **Options**. There are a lot of
    options here, including OpenOffice.org, Load/Save, Language Settings, OpenOffice.org
    Writer (including HTML/Web documents), OpenOffice.org Base (the built in database),
    Charts, and Internet. Each of these sections has a submenu of further options.
    Because there are so many options here, I certainly can''t cover them all, and
    besides, I don''t want to bore you. Instead, I''ll mention a few things that *I
    think* are important and let you discover the rest.


    The main OpenOffice.org dialog covers a lot of general options regarding the look
    and feel of the applications. Take a moment to look at the *Paths* settings. If
    you keep your documents in a specific directory, you want to set that here. Under
    *Type*, choose My Documents, click **Edit**, and then enter the new path to your
    directory of choice.


    Let''s move on to the very important Load/Save settings menu (see Figure 13-8).
    If you are constantly going to move documents back and forth between systems running
    Microsoft Word and your own Linux system running OpenOffice.org Writer, you want
    to pay special attention here. Click the plus sign to the left of the Load/Save
    menu item, and then click Microsoft Office.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_258_0.png)


    **Figure 13-8 Load/Save defaults for Microsoft documents.**


    Check the Convert on Save (and load) check boxes (labeled [S] and [L] at the top),
    and your OpenOffice.org Writer documents are saved in Word format by default,
    whereas your Calc sheets wind up in Excel format. We''re'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'almost there. Although the conversion is pretty automatic here, when you try
    to resave a document that you have been working on, Writer may still disturb you
    with the occasional pop-up message informing you of the $\textit{minuses}$ of
    saving in Word format.


    You get around this with one other change. In the same menu section, click General.
    Notice the section Default File Format toward the bottom of the dialog (see Figure
    13-9). For the Document type of Text document, select Microsoft Word 97/2000/XP
    from the Always Save As drop-down list to the right. While you are here (assuming
    you are making these changes, of course), you probably want to change the Always
    Save as format for Spreadsheet to be Microsoft Excel, and so on.


    Click OK, and you are done.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_259_0.png)


    **Figure 13-9** Defining the standard file format to be Microsoft Word.


    > *Note* I''m not saying that Microsoft''s document format is in any way superior.
    Not only is it not superior, but you are also trapped in a proprietary standard
    that may make it difficult to import your data in the future. It may also be a
    costly process. Although there''s no guarantee that any document format is going
    to the standard in the future, it''s nice to know that you can always load and
    read your old documents. That knowledge and comfort is what the OpenDocument format
    (again, now an ISO standard)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'provides. That said, if you have to move back and forth from the open document
    format to Microsoft’s proprietary format all the time, you don’t want to be bothered
    with doing a save as every time. It just gets tedious.


    > OpenOffice.org 2.0 can also save in Microsoft’s new XML format, which debuted
    in Microsoft Office 2003.


    Let’s move on to the OpenOffice.org Writer category (in the left-hand sidebar
    menu) for changes related specifically to the Writer application. Whenever you
    start a new document, OpenOffice.org assigns a default font when you start typing.
    This may not be your ideal choice, and you don’t have to accept it. Sure, you
    can change the font when you are writing, but why do this with every document
    when you can change it once? Click Basic Fonts, and you have the opportunity to
    change the default fonts your system uses. When you are done with the Options
    menu, click OK to return to the OpenOffice.org application.


    # ## A Wizard of Words


    OpenOffice.org comes with a number of templates that are available throughout
    the suite. The document Wizards feature helps you choose and walk through the
    setup of some basic documents. The easiest way to understand what these wizards
    can do for you is to dive right in and try one.


    On the menu bar, click File, and move your mouse over to Wizards. You see a number
    of document types here, from letters to faxes to presentations. We use letter
    as an example. When the Letter Wizard starts up, it offers you three kinds of
    letters: business, formal, and personal (see Figure 13-10). Each of these may
    have different styles depending on the letter type. As you progress through the
    various steps, you are asked to enter some basic information related to the type
    of document that you chose. In the case of a letter, this involves an opening
    and closing greeting, a sender and recipient name and address, and so on. The
    wizard also lets you save the document as a template so you can use it at a later
    date.


    The wizard also displays a graphical preview of what the document looks like directly
    behind the design selection window. You shouldn’t look at this as a perfect example
    of what you will wind up with, but it does help in visualizing the final product.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_261_0.png)


    Figure 13-10 Writing using the Letter Wizard.


    # Navigating Style


    With Writer open, click Format on the menu bar, and then select Styles and Formatting.
    A window labeled Styles and Formatting appears, floating above your document.
    Pressing <F11> also brings up the stylist. Clicking the X in the corner of the
    window banishes it. I’d like to give you some idea of how useful this little tool
    can be in formatting your documents. If you’ve banished the stylist, bring it
    back by clicking its icon or pressing <F11>.


    > Great Time-Saving Tip Here’s a good trick you might want to keep in mind if
    you start using styles in a big way. Click the stylist’s title bar with your left
    mouse button and slowly drag the stylist window over to the right edge (or the
    left) of your Writer window. As the stylist starts to go beyond the edge of the
    Writer window, you should see a gray vertical outline appear under the stylist.
    Release the mouse button and the stylist docks into the main writer window (see
    Figure 13-11).'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Whenever you start a new document, it loads with a default style. That style
    is actually a collection of formatting presets that define how various paragraphs
    will look. These include headings, lists, text boxes, and so on. All you have
    to do is select a paragraph, double-click a style, and your paragraph''s look—including
    font style and size—is magically updated. As an example of how to use this, try
    the following.


    Start by reloading your dark and stormy document, and then highlight your title
    text to select it. The bottom of your stylist shows the text *Automatic*. With
    your title highlighted, double-click **Heading 1**. The heading changes to a large,
    bold, sans serif font. Now click the arrow at the bottom of the list, and change
    from Automatic to Chapter Styles. Double-click Title, and your title is suddenly
    centered with the appropriate font applied (see Figure 13-11).


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_262_0.png)


    **Figure 13-11** *Styles make paragraph formatting easy and consistent. Note that
    the stylist is docked on the right.*'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The stylist is pretty smart. Look to the bottom of the list at those categories
    — HTML Styles, Custom Styles, List Styles, and so on. Depending on the document
    type that you are working on, the stylist comes up with a pretty sane list for
    that Automatic selection. If you call up an HTML document, HTML formatting shows
    up in the Automatic list.


    > **Quick Undo Tip** To remove a docked stylist, drag it out of its dock and drop
    it above the document itself. It turns back into a floating window. You can also
    press <F1> and it promptly vanishes from the dock. The great thing about using
    the function key is that the stylist remembers where it was. If it was docked
    when you pressed <F1>, it will be when you press it again.


    # ### Navigating the Rivers of Text


    The second floating window is called the *Navigator*. This is a great tool for
    the power user or anyone who is creating long, complex documents. When you start
    up the Navigator by clicking Edit and then Navigator (or by pressing <F5>), you
    see a window listing the various elements in your document (see Figure 13-12).
    These are organized in terms of headings, tables, graphics, and so on.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_263_0.png)


    **Figure 13-12** The Navigator gives you access to all your document elements.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '> Quick Tip You guessed it! Just like the stylist, the Navigator can be dragged
    to either edge of the document and docked into the main writer window. Just make
    sure you drag it far enough so that it isn''t another vertical window next to
    the stylist, but rather sits above or below it.


    What makes this a great tool is that you can use it to navigate a document quickly.
    Let''s say that (as in this chapter) there are a number of section headings. Click
    the plus sign beside the word Headings, and a tree''d list of all the headings
    in the document is displayed. Double-click a heading, and you instantly jump to
    that point in the document. The same goes for graphics, tables, and other such
    elements in your document.


    # Speaking of Document Elements...


    Take a look over at the far right of the Standard bar. See the little icon that
    looks like a picture hanging on a wall (to the right of the Navigator star)? That''s
    the gallery of graphics and sounds, decorative elements that can be inserted into
    your document. When you click the picture (or select Gallery from Tools on the
    menu bar), the gallery opens up with a sidebar on the left, listing the various
    themes.


    Wander through the collection until you see something that suits your document,
    and then simply drag it into your document, just as I did with that rather bright
    ruler below the Paul Clifford title in Figure 13-13. To banish the gallery, just
    click the icon again.


    While you were using the gallery, did you notice the words New Theme at the top
    of the category sidebar? Click those words (which is really a button), and you
    can create a new category of images, clipart, or sounds. If you have a directory
    of images you''ve collected, enter the path to that directory, pick a name for
    this collection, and you are done. Next time you bring up the gallery, you can
    select from your own custom collection.


    > Tip How would you like tons and tons of great, license-free, royalty-free, and
    just plain free, high-quality clipart? Fire up Synaptic, then search for and install
    openclipart.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_265_0.png)


    **Figure 13-13** *Writer with the gallery icon above the document, and with a
    docked stylist and Navigator to the right.*


    # More! Give Me More!


    OpenOffice.org comes with a limited number of templates, graphics, and icons.
    That’s one of the advantages of its commercial (nonfree) cousin, StarOffice from
    Sun Microsystems. However, if you find yourself in need of more templates than
    you already have or a richer gallery, take careful note of the following Web sites.


    The first is called *OO Extras*, and it contains more than two hundred templates
    for OpenOffice.org Writer, Calc, and Impress. In addition to individual macros,
    icons, and templates, this Web site (created by Travis Bauer) aims to provide
    downloadable packages to enhance OpenOffice.org’s suite.


    You should also pay a visit to the OpenOffice Documentation Project site (run
    by Scott Carr), which offers much more than extra templates and macros. There
    are also tutorials, setup guides, user guides, and even some video presentations.


    Links for both projects follow in the Resouces section.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# ## Alternative Word Processor Choices


