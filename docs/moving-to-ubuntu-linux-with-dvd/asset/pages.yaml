- pgno: 51
  md: '> Near the top left of your screen are two very interesting icons. The Examples
    folder contains a number of sample documents, spreadsheets, images, and multimedia
    files to try with your Ubuntu Linux system. The Install icon, meanwhile, is your
    starting point for installing the Ubuntu Linux live DVD permanently onto your
    hard disk. I’ll discuss those steps shortly.


    The Preferences menu is all about personalizing the user experience, something
    I’ll cover in greater detail in Chapters 3 and 5. Because these are personal options,
    none of them require administrative privileges. You can set a screensaver, change
    the background, window decorations, or play with the colors. Pick one of the included
    themes and give your system a whole new look.


    If the fonts look a little small, there’s a simple option for changing the size
    of what you see on the screen. And speaking of your screen, changing the screen
    resolution is easy and doesn’t require that you restart your graphical environment.


    Okay, let’s wrap up this tour of your system menu with the Administration submenu
    (see Figure 2-11).


    System administration may sound like something most people would rather stay away
    from, but it’s not all that scary. From time to time, you will want to do things
    on your system that affect everyone who logs in equally. Changes made under Preferences
    don’t affect anyone but the current user; and if your niece, Stephanie, chose
    some garish desktop colors, it wouldn’t affect you when you logged in.


    Administration functions cover the gamut from setting up a printer to configuring
    your Internet access. You can share folders (so others on your home or office
    network can use them), look at system logs, change the look and feel of the login
    screen, and add users.


    Perhaps one of the most important functions here involves updating and maintaining
    the packages on your system. Keeping up-to-date is one of the best ways to keep
    your system humming along nicely, and securely.'
  merge: -1
  img_proc: true
