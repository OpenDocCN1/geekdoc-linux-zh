- pgno: 149
  md: '# ### USB Devices


    The whole idea behind USB was eventually to replace all those different con-

    nectors on the back of a computer. That includes serial ports, parallel ports,

    and mouse and keyboard connectors. The acronym stands for *Universal*

    *Serial Bus*. On any USB system, there is at least one USB hub and whatever

    devices are attached. If you look at Figure 6-12, you can see information dis-

    played on two USB controllers (one is a USB 2.0 port, the other USB 1.1), a

    Labtec webcam, a mini USB wheel mouse, and my Palm Zire 72 (selected),

    all connected to my system.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_149_0.png)


