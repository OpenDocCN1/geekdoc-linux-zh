- pgno: 378
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_378_0.png)


    **Figure 19-7** Iagno is a disc flipping game you might know as Othello.


    # ## Klotski


    Klotski is a puzzle game. As with all puzzle games, it looks easy before you start.
    Here’s what happens. You have a two-dimensional box with one door. Inside this
    box are shapes of different pieces (it starts with large and small squares). One
    of the pieces is patterned with indents. Outside the box are posts upon which
    the patterned piece fits. Your job is to get the patterned piece to the posts
    (see Figure 19-8).'
  merge: -1
  img_proc: true
- pgno: 379
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_379_0.png)


    **Figure 19–8 Puzzle me this, Klotksi. How do you get the patterned piece on to
    the key posts outside?**


    The only piece that can pass the jeweled posts at the entrance is the patterned
    piece that matches the pins. All you have to do is figure out how to manipulate
    the pieces in order to get your piece out. The first few games seem easy enough,
    but after about the tenth, I can guarantee a lot of head scratching.


    # # Mahjongg


    Mahjongg is an electronic recreation of the classic Eastern tile matching game
    of the same name, minus the extra trailing g (Mahjong). Mahjong solitaire as a
    board game is generally a two-player game; however, the computerized version is
    a single-person puzzler. Each tile is imprinted with a symbol and all of the tiles
    are arranged in a pattern that partially hides some tiles and covers others completely.
    The object of the game is to remove all of the tiles two at a time by finding
    matching symbols (see Figure 19-9).'
  merge: -1
  img_proc: true
- pgno: 380
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_380_0.png)


    **Figure 19-9** Mahjongg contains tons of puzzles and many different levels, and
    in different maps (or layouts).


    If you are thinking there is more to it than this, you are right. You can’t remove
    a tile that is covered by another and you can’t remove tiles that are blocked
    by other tiles on more than one side. As you remove tiles, things start to get
    easier, at least for the most part. Sometimes, removing the wrong two tiles is
    enough to stop you from solving the puzzle. Should you find yourself in a position
    where no more moves are possible, a pop-up window alerts you to that effect.


    > **Tip** If the pieces appear too small, just drag one of the game window’s corners
    and the display grows accordingly. This is also a good game to flip into full-screen
    mode.'
