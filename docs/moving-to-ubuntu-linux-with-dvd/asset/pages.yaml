  md: 'Sleep or Hibernate mode. The difference between the two is that your system
    effectively powers off in hibernate mode but with your session saved until you
    power your system back on. If you were in the middle of typing a document, you''ll
    be back in the middle of that document when you restart your system. Sleep is
    a reduced power mode where you can just hit any key to bring your system back
    to life.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_86_0.png)


    > *Note* Not all computer hardware supports Sleep or Hibernate modes.


    Finally, the Shut Down option is a total shut down of all your processes followed
    by a power down (if your hardware supports it). The system stays off until you
    power it back on. Unlike hibernation, you find yourself back at the main login
    screen.


