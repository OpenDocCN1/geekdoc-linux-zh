- pgno: 21
  md: '# Foreword


    To the newcomer, the computer world can seem pretty forbidding. The secret codes
    for operating these metal beasts are under the control of mysterious geeks who
    speak some language that sounds like English but makes no sense. Even if you manage
    to master some corner of the computer continuum, the rug can be pulled out from
    under you without warning. A program that seemed tame will suddenly grow fangs.
    The way you’ve been doing things for months will stop working without notice.


    Once you’ve managed to tame the beast even a little it seems like masochism to
    consider switching to another operating system, but for many of us who use, and
    suffer with, Windows, the choice to continue to use that spawn of Microsoft may
    seem masochistic, too.


    Spyware, viruses, blue screens of death, confused user interfaces, buggy programs,
    security flaws, the list of problems with Windows seems endless. Many Windows
    users wonder if there’s a better way, but dread the idea of learning to tame another
    beast.


    Well, as Marcel Gañé has been showing us for years in his superb books, his “Cooking
    with Linux” columns, and on my TV show, Call for Help, there is a better way,
    and it’s called Linux. Until recently Linux was the choice of cellar-dwelling
    computer geeks and four-eyed server administrators. The idea of a normal person
    using Linux on his or her desktop for day-to-day work was far-fetched to say the
    least. All that is changing, due in part to the success of Ubuntu Linux.


    Ubuntu was created with one goal: to make a desktop version of Linux that everyone
    can use, and I think the team has succeeded marvellously.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Finally there’s a version of Linux I’d feel comfortable giving to my mom. It
    comes with a great range of applications without falling prey to the common “everything
    including the kitchen sink” approach of many other Linux distributions. You’ll
    find just what you need on your Ubuntu installation, with little or no fatty excess.
    Oh, and by the way, there’s a version for you server geeks, too.


    Of course, because Ubuntu, as all Linux distributions, bundles applications from
    the Free Software Foundation, the Apache Software Foundation, OpenOffice.org,
    and many other open source software groups, you get a great variety of powerful
    well-designed programs. Ubuntu includes more than 16,000 individual applications
    (even though it fits on one CD). You’ll find tools for almost anything you can
    think to do with a computer including a full office suite, Web server software,
    and programming tools. Yet all that power and complexity is wrapped in a very
    slick, easy to use user interface that’s, frankly, a whole lot better than Windows.


    It’s pretty mind-blowing that a free operating system can best one that costs
    hundreds of dollars and is backed by a hundred-billion-dollar corporation, but
    it’s true. The essential verity of the open source software movement is that programmers
    who are doing what they love will always do a better job than programmers who
    are working merely to make a living.


    As well designed as Ubuntu is, however, it’s still terra incognita for the Windows
    user. Where’s my Start menu? they plead. What happened to the Control Panel and
    My Network Neighbourhood? Fear not intrepid operating system explorer, this book
    will clear a path in the jungle, and you’ll find yourself at home with Ubuntu
    in just a few short weeks.


    So come on in. No secret knock is necessary. The only password you’ll need is
    the one you create yourself to secure your system. The Linux and free software
    community welcome you with open arms. There is a better way, and this book is
    your first step toward freedom.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_22_0.png)


    Petaluma, California

    June 2006'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# ## Chapter

    ## 1

    # Introducing Ubuntu!


    *Welcome to the Ubuntu Linux universe, one and all!*


    *So, what is Ubuntu Linux? I could tell you that Ubuntu Linux is currently one
    of the hottest Linux distributions around with one of the most active and dedicated
    user and development communities. We could also take a look and see what the Ubuntu
    Web site has to say.*


    *"Ubuntu" is an ancient African word, meaning "humanity to others." Ubuntu also
    means "I am what I am because of who we all are." The Ubuntu Linux distribution
    brings the spirit of Ubuntu to the software world.*


    *Ubuntu Linux (and Kubuntu Linux) are funded and supported by the Shuttleworth
    Foundation, headed by billionaire Mark Shuttleworth. I mention this to say that
    Ubuntu Linux is a solid organization backed by solid financial support. With this
    support, the Ubuntu Foundation will ship free Linux CDs to anyone anywhere in
    the world (visit [https://shipit.ubuntu.com](https://shipit.ubuntu.com)). This
    is quite impressive, but it does not answer the question: What is Ubuntu Linux?
    The official Ubuntu site goes on to say the following:*'
  merge: -1
  img_proc: true
- pgno: 24
  md: "Ubuntu Linux is a complete desktop Linux operating system, freely available\
    \ with both community and professional support. The Ubuntu community is built\
    \ on the ideas enshrined in the Ubuntu Manifesto: that software should be available\
    \ free of charge, that software tools should be usable by people in their local\
    \ language and despite any disabilities, and that people should have the freedom\
    \ to customise and alter their software in whatever way they see fit.\n\nIf you\
    \ are new to Ubuntu Linux and to Linux in general, this might be time for a little\
    \ Linux Q&A. These days, the first question I get is not, “What is Linux?” but\
    \ rather, “What do I have to do to get Linux on my system?” And in the case of\
    \ Ubuntu Linux, people know enough to point to a specific distribution and ask\
    \ for it by name.\n\n# ## But What Is Linux?\n\nFor those who want clarification,\
    \ Linux is a fully multitasking operating system based on UNIX—although technically,\
    \ Linux is the kernel, the master program that makes running a Linux system possible.\
    \ That kernel, by the way, was written by a young Finnish student named Linus\
    \ Torvalds. On August 25, 1991, Torvalds posted this now famous (perhaps legendary)\
    \ message to the Usenet group comp.os.minix:\n\n> From: torvalds@klaava.Helsinki.FI\
    \ (Linus Benedict Torvalds)  \n> Newsgroups: comp.os.minix  \n> Subject: What\
    \ would you like to see most in minix?  \n> Summary: small poll for my new operating\
    \ system  \n> Message-ID: <1991Aug25.205708.9541@klaava.Helsinki.FI>  \n> Date:\
    \ 25 Aug 91 20:57:08 GMT  \n> Organization: University of Helsinki  \n> Hello\
    \ everybody out there using minix -  \n> I’m doing a (free) operating system (just\
    \ a hobby, won’t be big and professional like gnu) for 386(486) AT clones. This\
    \ has been brewing since april, and is starting to get ready. I’d like my feedback\
    \ on things people like/dislike in minix, as my OS resembles it somewhat (same\
    \ physical layout of the file-system (due to practical reasons) among other things)."
  merge: -1
  img_proc: true
- pgno: 25
  md: "I've currently ported bash(1.08) and gcc(1.40), and things seem to work. This\
    \ implies that I'll get something practical within a few months, and I'd like\
    \ to know what features most people would want. Any suggestions are welcome, but\
    \ I won't promise I'll implement them :-)\n\n> Linus (torvalds@kruna.helsinki.fi)\n\
    > \n> PS. Yes - it's free of any minix code, and it has a multi-threaded fs. It\
    \ is NOT protable (uses 386 task switching etc), and it probably never will support\
    \ anything other than AT-hard disks, as that's all I have :-(\n\nMuch has happened\
    \ since then. Linus somehow captured the imagination of scores of talented programmers\
    \ around the world. Joined together through the magic of the Internet, they collaborated,\
    \ coded, tweaked, and gave birth to the operating system that is now revolutionizing\
    \ the world of computing.\n\nThese days, Linux is a powerful, reliable (rock solid,\
    \ in fact), expandable, flexible, configurable, multiuser, multitasking, and completely\
    \ free operating system that runs on many different platforms. These include Intel\
    \ PCs, DEC Alphas, Macintosh systems, PowerPCs, and a growing number of embedded\
    \ processors. You can find Linux in PDA organizers, digital watches, golf carts,\
    \ and cell phones. In fact, Linux has a greater support base (in terms of platforms)\
    \ than just about any other operating system in the world.\n\nWhat we call the\
    \ Linux operating system is not the work of just one man alone. Linus Torvalds\
    \ is the original architect of Linux—its father, if you will—but he is not the\
    \ only effort behind it. Perhaps Linus Torvalds's greatest genius lay in knowing\
    \ when to share the load. For no other pay but satisfaction, he employed people\
    \ around the world, delegated to them, worked with them, and asked for and accepted\
    \ feedback in a next generation of the model that began with the GNU project.\n\
    \nGNU, by the way, is a recursive acronym that stands for GNU's Not UNIX, a project\
    \ of the Free Software Foundation, started in 1984 by Richard M. Stallman. The\
    \ aim of the project was to create a free, UNIX-like operating system. Over the\
    \ years, many GNU tools were written and widely used by many commercial UNIX vendors\
    \ and, of course, system administrators trying to get a job done. The appearance\
    \ of Linus Torvalds's Linux kernel has made the GNU dream of a completely free,\
    \ UNIX-like operating system a reality at last."
