    # Windows, Title Bars, and Menus, Oh My!


    Each graphical program that runs on your desktop has certain common char-acteristics.
    Have a look at the top of your Nautilus File Browser window, and you will see
    something like Figure 3-7.


    ![](img/0e9cf4c65a042f4a9bea644dc50153a7_70_0.png)


    **Figure 3–7** Most windows have a title bar, as well as a menu bar.


    # The Title Bar


    The top bar on a running program is called the *title bar*. Depending on the application,
    it may display a program name, a document you are working on, a location on the
    Web, or a nice description explaining what you are running. Left-clicking the
    title bar and dragging it with the mouse moves the program window around on your
    desktop.


    > **Quick Tip** Most modern desktops assume a monitor running at a resolution
    of at least 1024×768, and a number of applications assume this to be a universal
    truth. This plays havoc when your monitor is smaller than this (say, 800×600)
    and the buttons you need to click are offscreen. Clicking the title bar and dragging
    the window gets you only so far, especially if the title bar is offscreen.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Don’t despair. By pressing the *<Alt>* key and left-clicking a window, you
    can drag it anywhere you want, including beyond the boundaries of your desktop.
    This is particularly handy if you need to get at a hidden OK button.


    Double-clicking the title bar maximizes the program window—the application suddenly
    takes up the whole screen. Double-click it again and the window returns to its
    original size.


    The title bar also has a number of small icons. Pause your mouse cursor over them,
    and a tooltip informs you of their functions. Starting at the left corner of the
    title bar is a small icon that a tooltip identifies as a *Window Menu*. Clicking
    here brings up a small drop-down menu that makes it possible to move the program
    to another workspace, and to minimize or maximize the application (among other
    things).


    One of the other items in the drop-down menu is labeled *On Top*. Selecting this
    makes the window lighter, so it always floats above the others, regardless of
    which one you have selected. Okay, so it doesn’t really float, but it will always
    appear above any other window, even if you click that window.


    The other item I want you to notice is related to the whole workspace concept
    and that’s the entry labeled *Always on Visible Workspace*. The best way to understand
    this one is to try it. Click one of your other three workspaces. If you haven’t
    already excitedly opened dozens of other programs on each one, you should find
    yourself with a nice, clean desktop. Now, go back to your first workspace. Click
    the window menu and select *Always on Visible Workspace*. Now, jump to workspace
    2. Nautilus is there. Click workspace 3, and it is there also. In fact, if you
    had 10 workspaces defined, Nautilus would be waiting for you on all of them.


    Here’s a cool bit of information. You are still running *only one* instance of
    Nautilus. It’s just that it’s available to you on every workspace. Finally, let’s
    assume that you made Nautilus available to every workspace while you were on workspace
    1 and you are now on workspace 3. Click the window menu and select *Only on This
    Workspace*. Workspace 3 is now Nautilus’ new home, and it ceases to be available
    on the other workspaces, including workspace 1, where it started.


    All of the things I’ve mentioned—maximizing, minimizing, and making an application
    visible on all desktops—can be implemented from the window list icon for any running
    application. Right-click the window list icon and select what you need from the
    pop-up menu (see Figure 3-8).'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/0e9cf4c65a042f4a9bea644dc50153a7_72_0.png)


    Before we move on to other things, we need to look at the buttons on the right
    side of the **title bar**. You use the leftmost icon, the one with an under-score
    (or a small straight line, if you prefer), to minimize a window (remember that
    you can pause over the top with your mouse button to get the tooltip). The icon
    with a square in the center maximizes a window, causing it to take up every bit
    of space on your desktop except for the space taken up by your panels. Finally,
    the X does pretty much what you would expect it to: It closes a running application.


    # On to the Menu Bar


    Directly below the *title bar* is the *menu bar*. The menu bar generally has a
    number of labels (such as File, Edit, View, and so on), each grouping the various
    tasks you can do into some kind of sensible order.


    Every program has a different set of menu options, depending on the nature of
    the application. Clicking a menu label drops down a list of options for that function
    (see Figure 3-9).'
  merge: -1
