    When it’s all over, you get a message telling you that your tracks were successfully
    copied. You can either close the dialog or click the **Eject** button to pop the
    CD out.


    Now that you have all the basics of ripping songs with the Sound Juicer, let’s
    take a moment to revisit this whole notion of audio formats. Click **Edit** on
    the Sound Juicer menu bar and select **Preferences**. When the Preferences dialog
    appears (see **Figure 18–7**), look at the bottom of the dialog. There’s a drop-down
    box labeled **Output Format** with several formats available. They include two
    CD quality formats (lossless **FLAC** and lossy **Ogg Vorbis**) as well as two
    voice quality formats (lossless **WAV** and lossy **Ogg Vorbis**).


    If the music is going to stay on your home computer and you like the idea of patent-free
    compression format, choose **Ogg Vorbis** or **FLAC**. If you own a portable **MP3**
    player and you want to take your music with you, you may still be okay with **Ogg
    Vorbis** because it is supported by a number of popular players.'
