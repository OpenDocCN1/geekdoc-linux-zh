    # BorgBase


    If you want to back up your servers, but don''t want to run a server yourself,
    BorgBase hosting service is a great choice, offering storage space at euros per
    month. This investment gives you 100GB for up to 10 repositories. Their servers
    are located in Europe. The developers added Restic as an additional backup tool
    to BorgBase.


    You can register with the service and provide your email address, log in to the
    free account. Free tier offers up to 10GB of data to manage two repositories with
    no limit. First, enter your SSH key with SSH Key and Add it. Then create a new
    key key pair with the following command:


    ```

    ssh-keygen -t ed25519 -C "email@example.com"

    ```


    You will find the generated key in your home directory named ~/.ssh. Copy the
    content of the key with the .pub extension to the borg server and confirm.

    Add your repository path and change the default EU. The other settings are largely-automatic.
    In Access, you need to select your email address and when you want to be notified
    if a backup process fails. In Advanced, it is a good idea to check the archive
    automatically after the backup finishes.

    Before initiating an initial backup in Borg, press the button to the left of the
    repository you created. This option allows you to set the path in to the right
    of the repository address. When you click New Repository, you will be prompted
    for the repository name and assign a password.


    Click will then connect the repository to the local vault. You can now create
    your first backup. Check out the troubleshooting tips [4] for your use case. Issues
    are almost always due to the SSH key and how it was integrated.


    Append-mode allows you to edit every level of archive. Each repository means that
    Borg overwrites or deletes data transferred in it, not does it delete the archive
    as a whole. This can only be enabled via the command-line interface:


    ```

    borg init --append /path/to/repository_name

    ```


    enables it, and append_only switches it off.


    # Conclusions


    Borg is a very open source project supported by the contributions of more than
    250 developers on GitHub [5]. The Borg project has several peer reviews and has
    excellent documentation.


    The goal of Borg is to provide an efficient and secure way to back up data. Its
    deduplication technique is suitable for daily or hourly backups. Authentication
    ensures that backups are secure if they are not fully trusted.


    Vorta is a GUI for Borg developers that integrates the most important functions
    in a graphical interface. It makes the management of backups easier. If you want
    to control the backup by the program, it is a good idea to check out the borg
    [6], which is BorgBase - a hosting service that works well for the professionals
    folks.


