    zoom, and HDR settings, which might be out of reach without a Windows installation.
    You can then save these settings to the camera itself, or if your camera can''t
    save everything, easily to system so they can be restored next time the camera
    is connected.


    Cameraterils helps you configure your webcam and utilize its capabilities.


