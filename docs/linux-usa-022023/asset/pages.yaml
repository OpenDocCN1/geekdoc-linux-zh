    # Vulnerabilities using a 32-Bit Kernel on a 64-Bit CPU


    Naresh Kamboju reported that the kernel was giving some Spectre and Retbleed security
    warnings on the Linux test. They said they were using the 5856 kernel on the 64-bit
    Intel CPU at least, posted some debugging output that identified the specific
    CPU.


    Greg Noah-Hartman remarked that this particular 32-bit combination - a 32-bit
    running on a 64-bit architecture - was sort pathological. People would use a faster
    and more efficient 64-bit kernel if their architecture supports it. Greg said
    this particular environment might not be the kernel developers expect, as suggested
    that Gawan Puata might be the person to ask to


    Meawhile, Peter Zilstra remarked, "Yeah, so nobody cared to fix 32bit. If someone
    ''reliability'' cares and wants to put the effort in it I''ll review the patches,
    but seriously, you shouldn''t be running 32-bit kernels on Skylake / Zen systems,
    that''s your job."


    Ran replied to Greg saying, "It is not an award of production users that use 32-bit
    mode on Skylake-gen CPUs. This should not be a concern."


    However, Adam Borisowski gave the following evaluation of potential issues many
    users


