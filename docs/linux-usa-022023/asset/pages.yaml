    # Initial Support for Rust in the Linux Kernel is Finally Released


    Linux Torvalds finally announced the latest LTS version of the Linux kernel (version
    6.1) the initial support for the Rust programming language which has recently
    been hyped (https://lkml.org/lkml/2022/12/11). This, of course, comes on the heels
    of what Torvalds calls the "merge window from hell," thanks to holidays and pre-holiday
    travel


    On top of that, Torvalds said he would be very strict with the merge window rules,
    saying "The rules are that the requests sent to me during the merge window should
    be ready... no last-minute batch of experimental development that hasn''t been
    seen by or rest automation."


    One of features of kernel 6.1 is the inclusion of experimental Rust support. It''s
    important to know that this is very much in the early phase of development, so
    the implications are basic implementation of Rust in the kernel, to find and implement
    new Rust-butter drivers within the kernel.


    Much of the driver work for kernel 6.1 is dominated by drivers for media, Bluetooth,
    HID, GPU, and more. Making could lead to an announcement to find out everything
    that''s included with the latest LTS kernels, which should serve as a very important
    point for the addition of Rust drivers for.


    # Linux Mint 21.1 Enters Beta Status


    The developers of Mint have officially announced the upcoming release is in beta
    (https://linuxmint.com/?p=4442). What''s big about this is 21.1 will include the
    latest release of the Cinnamon desktop.


    The new version of Cinnamon has been tidied up to cleaner and more modern. You
    will find more vibrant colors, a new mouse pointer, new system sounds, and some
    of the icons have been removed and are now pinned to the panel or


    In order to achieve more vibrant colors, the developers had to use fewer accents
    across the user interface (UI). This also required a number of other minor tweaks.


    The Linux Mint Driver Manager has received a number of improvements for the user
    interface and includes a more robust driver installation. Drivers for Broadband
    devices are easier than ever.


    Other improvements include Flatpak integration into the Update Manager, an easier
    way to verify ISO images via a right-click menu in the file manager), and numerous
    improvements to the Nemo'
