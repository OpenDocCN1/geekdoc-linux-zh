    # BorgBackup


    Back up your data with BorgBackup and Vorta


    # # Keep It Safe


    BorgBackup and the Vorta graphical front end the stress out of creating backups.


    By Ferdinand Thommes


    If you want to keep your data safe, it is a good idea to think about a backup
    strategy and implement it in a consistent way. The more data you have, the more
    security you need for backups. Experts recommend that you should back up irreplaceable
    data twice, with a backup location outside of your four walls.

    Linux allows for backup applications - both home and work environments. One solution
    is limited to the listed, which are uninterative with remote servers. One solution
    in remote backup scenarios is powerful: full BorgBackup [!] can store backups
    on local drives or remote servers, which offers compression and secure architecture.
    Thanks to the Vorta graphical interface, Borg is suitable for home users and well
    as professionals.


    Vorta graphical front end. Written in Python 3, Borg features such as deduplication,
    compression, and authentication. The data compression supports the LZ, LZMA, Lib,
    and Zstd standards. When it comes to deduplication, it is worth considering what
    the term actually means in Borg speak.

    Deduplication is generally understood as a space-saving technique that breaks
    data down into blocks of the same size


    ![](img/40e16ea65dca8020192f55b66e49c7d3_15_0.png)


    # BorgBackup


    Borg runs at the command line but you can also control it through the alternative


    ![](img/40e16ea65dca8020192f55b66e49c7d3_15_1.png)


    Figure 1: When using servers connecting via SSH, you need to be sure Borg is running
    on the server as well the


    ```

    borg init --encryption=repo /run/timeshift/backup/borgbackup

    Enter new password:

    Do you want to encrypt your password? [y/n]

    Remember, your data will be inaccessible without it.

    Keep this key safe, your data will be inactive without it.

    Archives: 0, w/ cached Idx: 0, w/ updated Idx: 0, w/ cached Idx: 0.

    ```


    By default repositories initialized with this version will produce security errors
    if it works with an older version up to and including Borg 0.3.

    If you want to avoid this, you can disable the encryption by running:

    borg init --encryption=none /run/timeshift/backup/borgbackup


    See https://borgbackup.org/en/stable/changes#mystype-1.0.9-manifest-spoofing-vulnerability
    for details about the security implications.


    If you used a password, the key is stored in the repo, but you can use:

    ''borg export'' to get a printable format.

    Write down the password. Store safe before exit:


    Figure 2: When backing up to an external disk the home network, Borg only needs
    to be installed on the source computer. Initializing the repositories is the same
    as it is for remote machines.


