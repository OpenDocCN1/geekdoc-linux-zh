  md: '# # MakerSpace

    ## Water your plants with a Raspberry Pi

    # Watering Pi


    With a Pi Zero and a few components, you can build an inexpensive and reliable
    automatic watering system for your plants in next to no time. By Sven Hofpe


    Wither in an apartment, on a balcony, or in a garden, if you are not at home and
    an automated system is your only option. In this article, I show how to harness
    the power of a Raspberry PI as a reliable platform to manage the water system.


    Design

    Automatic irrigation is nothing new. These systems not only exist on a large scale
    in agriculture and horticulture but have also been available for many years. Some
    providers attach systems directly to crops. In this project, I''ll instead draw
    water from a 200-liter tank reservoir with a supply that lasts for a couple of
    dry days (Figure 1). The advantage of a tank is that you do not have to tap pressure
    line and do not lose an uncontrolled amount of water in the event of an accident.
    The aim is to create a robust solution that you can tailor entirely to your needs,
    thanks to the flexibility of the Raspberry PI and your hardware and software.


    The storage tank for just a room can be much smaller; in fact, a water bucket
    is all you need, with a submersible pump and a riser to deliver the irrigation
    water. Two pipes supply water to plants through a branch distributor. The whole
    thing can be controlled on demand by solenoid valves. The project design also
    uses moisture sensors to check that the water reaches the plants (see "Parts List
    box").


    Getting Started

    To get the Raspberry PI up and running, it''s a good idea to download a new PI


    **Figure 1:** The control unit and supply line assembled on the 200-liter storage
    tank.


