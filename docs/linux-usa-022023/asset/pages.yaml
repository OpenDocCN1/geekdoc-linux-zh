    # Beyond 5G


    Behind the scenes, the cellular phone has never been the preserve of highly specialized
    and proprietary equipment, but some recent innovations could be changing that.
    This month we explore the Open RAN specification, which could allow operate on
    off-the-shelf hardware.

    On the DVD: openSUSE Linux 15.4 and MX Linux 21.1


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_5.png)


    #261/August 2022


    # USB Boot


    Live boot was an exciting idea 15 years ago – just carry a CD and boot anywhere.
    Old-school boot CDs had many limitations. Today''s USB boot tools solve problems
    offer a feature that no one ever thought about then: access to several images
    on a single stick.

    On the DVD: Linux Mint MATE 20.3 and FreeBSD 13.1'
