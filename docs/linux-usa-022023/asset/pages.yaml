    from understanding and production of language has been like a


    Automated speech processing, with speech recognition, is also one of the earliest
    benefits for data analytics. As early as 1952, Bell Laboratories'' speech recognition
    system, was able to set the parameters for each user so that the system recognizes
    them with a high degree of accuracy. Initially, the fine-tuning of the parameters
    had to be done manually. Automating this step takes machine learning, the process
    of adjusting models based on training data.


    The results of machine learning are the models and their parameters. Accordingly,
    experts do not refer to AI, but instead to models. The widespread adoption of
    neural networks was a breakthrough for machine learning. Although their theoretical
    foundations were weak, widespread use of neural networks required advances in
    computing power.


    The individual neurons of the network each perform a simple and slightly different
    role. A neuron receives information from its upstream, or downstream neurons.
    It acts like a cock in a watch; it has to keep the ticking, but not to measure
    one of its ticks.


    The process is as follows: it first weights the inputs of the neurons upstream.
    The neuron''s activation depends on whether this total meets a threshold. Instead
    of being programmed, the network learns meaning weights that fall below the threshold
    or above values in a result. This behavior is different from that of classical
    classifiers; it basically allows (sufficiently large) neural networks to compute
    any function.


    Unlike transistors, however, activation is not abrupt, but continuous (there are
    also values between 0 and 1) and can be differentiated. The error that a neural
    network makes, for example, when classifying an image as "cat image" or "no cat
    image," is converted into the weights of the model (the weights of inputs and
    thresholds for activating each neuron). To do this, you need to form the (partial)
    derivatives after each of the parameters, which tells how changing them influences
    the error.


    The parameters are adjusted slightly towards the error, and then these errors
    are correlated. This feedback (backpropagation) and adjusting the parameters to
    smaller errors (gradient descent) ensures that the set of neurons can learn to
    solve a task in a better way. Neural networks are trained with inputs and outputs.
    You then adjust the parameters by bits until the result has the lowest possible
    error costs.


