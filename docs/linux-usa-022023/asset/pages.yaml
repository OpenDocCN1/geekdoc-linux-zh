  md: '# Preservation


    Graphical backup solutions help you protect your data with just a few clicks.
    We study six popular options.


    By Erik Bärwaldt


    ![](img/40e16ea65dca8020192f55b66e49c7d3_19_0.png)


    any users still perceive the need for regular backups as a chore, but an abundance
    of graphical backup solutions in the Linux environment means that backup no longer
    requires complicated command-line input. These individual backup applications
    focus on different needs and come with different feature sets


    Many (but not all) of these tools are based on Rsync, a command-line program for
    synchronizing files on local or remote disks [1]. This article looks at easy-to-use
    graphical applications for Linux distributions. Other articles in this issue examine
    other backup alternatives.


    # Back In Time


    Back In Time is a Rsync-based backup program that has been developed since 2008.
    The ''GitHub says Back In Time is "inspired by FlyBack." (FlyBack is another open
    source backup tool based on Apple''s Time Machine.) Both a command-line and a
    GUI-based variant are available. The application, written in Python 3, is available
    in the repositories of all Linux distributions.


    With Back In Time you can create a profile defining a specific scenario, and then
    restore files from the backup of the past.


    After completing the installation, you will find two new entries for Back In Time
    in the menu of your desktop environment. The first entry runs the software with
    the rights of the logged-in user, and the second entry is for root user. Launching
    the application with root privileges allows to backup drives and directories that
    the logged-in user might not be able to access, including snapshots of the system.


    Back In Time opens a Settings window (Figure 1), where you create the main profile
    and configure other options.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_19_1.png)


    In the General tab, you first need to specify the software location and choose
    whether to back up locally or to a remote drive. You can also choose to encrypt
    the data and define a backup interval. Please note that the media needs to be
    formatted with the ext or ext4 filesystem. The FAT32 filesystem commonly used
    for USB memory sticks does not support hard links, and is therefore not suitable
    for backing up Linux systems.


    Figure 1: Back In Time works with profiles that are easy to configure.'
