    # History improvements


    # # hiHiStory


    esounding liking like it has been named after a lecturer seeking "history", hiStory
    is worthy of your attention. It updates the functionality of the most important
    aspects of our shell and terminal interactions, this history covers most of what
    we use up and down cursor keys, with a few extra lets to search through their
    commands. The problem with this default history tool, though, is that the commands
    you remembered, their context is utterly lost. A command might have been typed
    into a remote session, even as a different user, in a different environment or
    location on your filesystem, and it will still


    be available throughout your history. The best this history can do is promote
    your memory to the same setup and configuration before running the command when
    you need to move to a different machine—hiStory improves by remembering the context
    of commands. It can remember the directory that you ran in a command, for example,
    even when the command was successful or not. This might not seem like a big deal
    if you''ve ever searched through your history only to find and badly formed arguments,
    which will all have equal precedence aside the style of the one successful command
    you''re looking for. This is where hiStory can help. It supplants the two previously
    mentioned history access commands and replaces them with


    ```

    $ v4l2-ctl --device=/dev/video --list-ext-ctrl

    $ v4l2-ctl --device=/dev/video --set-ctrl=brightness=128

    $ v4l2-ctl --device=/dev/video --set-ctrl=contrast=32

    $ v4l2-ctl --device=/dev/video --set-ctrl=saturation=64

    $ v4l2-ctl --device=/dev/video --set-ctrl=gain=0

    $ v4l2-ctl --device=/dev/video --set-ctrl=backlight_auto=1

    $ v4l2-ctl --device=/dev/video --set-ctrl=exposure_auto=1

    $ v4l2-ctl --device=/dev/video --set-ctrl=focus_auto=1

    ```


    hiStory replaces your terminal''s functionality with a history. In particular,
    you can search for commands containing specific features, strings matching a specific
    hostname, and returns a return code, the history is stored locally after every
    run and can be even synced across end-to-end devices, so you have quick access
    to your latest trips and really should become the default behavior history.


