    # Critical Escalation Vulnerability found in the Linux Kernel


    Red Hat added a new CVE code, identified as 2022-3977 (https://access.redhat.com/security/CVE-2022-3977),
    which is described as a use-after-free flaw. A use-after-free flaw can occur when
    a program attempts to use memory that has been released.


    CVE-ades exists in the Linux kernel Management Component Transport Protocol (MCT).
    This vulnerability occurs after a user simultaneously calls DROPTag at the same
    time a socket close occurs. When this happens, the vulnerability can be used to
    elevate privileges all the way to root.


    This CVE has been listed as Moderate, with a CVSS base score of 7.0 and the vulnerability
    was found in the most upstream Linux kernel.


    It was the Arch Defense Laboratory that originally originated the vulnerability,
    finding it in kernel v5.10 with the commit 3d40a61aa66819bdce9377ac7f6a53. Fortunately,
    with a recent commit, the vulnerability has been patched.


    If you have a Linux running kernel 5.18, you should immediately run an upgrade
    to the latest kernel. Most major repositories have likely added the patch to their
    standard repositories.


