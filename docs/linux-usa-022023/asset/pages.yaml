    sensors. Things have changed, and now our webcams, the latest models have better
    sensors, less noise, and are capable of resolutions such as 4k at 60 frames per
    second. Unfortunately, the majority of webcams used on Linux cannot typically
    configure them to the full extent of their capabilities because their manufacturers
    usually hide those options within their applications.


    Enter Camerails to rescue. It exposes all the options supported by V4L2 and adds
    to many of the secret options provided by Logitech, Brio, and Razor Kiyo in their
    Windows drivers. These options can be configured through the command line, as
    you might with v4l2-ctl, or using a GTK front. These are particularly good because
    you can configure your webcam while you''re using it, easily open and tweak your
