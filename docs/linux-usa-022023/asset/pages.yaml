  md: '# Set up yourself hosted services at the push of a button

    Quick Service


    Setting up a server manually on Linux can sometimes test your patience, but with
    YunoHost you can install and configure your servers with just a few mouse clicks.


    Linux is an excellent server operating system mainly because of its stability.
    Installing and configuring a server requires in-depth knowledge, even on the free
    operating system, but ''YunoHost'' [1] lets you set up a fully configured server
    on your network with just a mouse click.


    The new version of YunoHost is available both as a standalone and distribution
    for use online. The system works on both 32 and 64-bit hardware, meaning that
    you can recycle your older systems. On top of this, YunoHost is available for
    ARM-based board computers, and even Raspberry Pi systems are suitable for the
    bases of a server network.


    The software supports installation on a remote computer via SSH. However, Debian
    11 ''Bullseye'' has the preinstalled underpinnings of the remote machine. After
    installing the basic system, you can easily integrate the desired services via
    a web-based interface. The system is not


    limited to a couple of well-known services, but supports no fewer than 350 preconfigured
    programs.


    BY ERIK BÄRWALT


    # Installation


    The project''s website lists the minimum hardware requirements for each platform
    to run YunoHost [2]. Because these requirements are very low in terms of RAM (512MB)
    and in terms of storage (16GB free disk space), older 32-bit computers with conventional
    hard disks are viable for YunoHost operation. Detailed instructions for the different
    approaches to installing the system as a function of the target platform are available
    on the project site. But, the Debian setup wizard is used in both text and graphical
    mode.


    The basic installation sets up a database and a web server. On completing the
    system, you will see a login prompt. YunoHost is now ready for you. Then talk
    to the system via the graphical interface from any device that has a browser.


