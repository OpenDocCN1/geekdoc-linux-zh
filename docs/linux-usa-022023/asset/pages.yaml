  md: '# CODE CARE


    Dear Reader,


    After all these years in publishing, it is rarely hard to grab my attention with
    a random headline, but I have to admit this caught my eye: "Poor Software Quality
    Costs the US $2.4 Trillion." At first I thought it was a typo. I was thinking
    it would be "Billion" – and I had no ideas it was going to be "Trillion." With
    further reading, it appears that "Trillion" really is what they had in mind.


    All the credit for the press release of this headline goes to a report by the
    Consortium for Information on Software Quality (CISO [1]), an organization founded
    by the Object Management Group (OMG) standards development Group and the Software
    Engineering Institute at Carnegie University. Various security organizations and
    consultants, including MTRE and Gartner Group.


    The report lists three reasons for this astronomical loss:


    +   - Cybersecurity

    - Software supply problems with third-party components

    - Technical debt


    Cybersecurity receives the most attention, but according to the report, it is
    the least of the three costly problems. Most of the discussion of supply chain
    problems focuses on open source. In this case, the argument doesn''t seem to be
    much about the fact that open source is the source as the same few components
    are used extensively. According to the report, a "medium-sized application (less
    than a million lines of code) has about 300 software components on average." Of
    the most popular source components are built into thousands of applications, so
    if a problem is found in one of these, it is echoed thousands of times. As the
    report points out, the free availability of open source components means components
    matter over the quality of the code in the final product and a larger percentage
    of the code comes from sources the programmer''s control. Many companies don''t
    rise to the challenge of keeping up with all moving parts. The report quotes a
    study that found that of audited codebases, 81 percent of those components were
    out of date.


    The discussion of technical debt was the last familiar for the average user. Technical
    debt is a concept from the field of economics that doesn''t receive a lot of attention


    in the technology industry. Wikipedia refers to debt as "the implied cost of additional
    rework caused by choosing an easy (limited) solution instead of using a better
    approach that would take longer." The idea is, by applying a shortcut or quick
    fix to a problem (by ignoring a problem, which also helps), you incur a debt that
    will come back in the future. The danger is that the problem will become more
    difficult to fix later in a form of "interest".


    Economists and capitalists need a kind technical debt to estimate the value of
    a company. Suppose you have two companies that start with the same software. Company
    A has a debt of continuous development without good practice, but it also acts
    in cost over level of investment. B might have one other security fixes, but the
    problems are accumulating. Company might have one other have


    You might wonder why all numbers matter. $2.4 trillion is intended to shock. Every
    dollar invested is accounted for some kind of waste? But perhaps, you can also
    believe that every successful company is focused on how to keep as little debt
    as possible. Some of the solutions offered in the report are remedies you''ve
    heard about: better quality standards and better tools for maintaining security.
    One of solutions is new for the latest practice, though it is an ongoing dream
    of futures: expanded use of AI and machine learning for software development.


    Cybersecurity and security dominate the next cycle. Other quality concerns are
    discussed within academia, and to some extent, within the programming world. But
    for the CISO report it is the value of code that will bring these issues to the
    surface. The open source community really needs to spend a lot more time considering
    what can be done to those core components—including developers on keeping them
    up to date. And maybe next time you invest in a software company, don''t just
    look at the: company''s commitment to their code.


    # Info


    +   [1] The Cost of Poor Software Quality in the US: 2022 Report: https://www.c-isq.org/the-cost-of-poor-quality-software-in-the-us-report-2022/(requires
    registration)


    ![](img/40e16ea65dca8020192f55b66e49c7d3_2_0.png)


    Joe Casad

    Editor in Chief'
