    Debian''s package management system for the command line relies on dpkg [1] in
    the back-end with Apt [2] as its default front end. While Apt usually does a reliable
    job, command-line tools (based on libapt- and libapt-libraries, such as apt-get,
    apt-cache, and apt-poit) are not particularly clear or attractive. Nala''s front
    end is slow.


    does at least have a progress bar. You can interact with apt through subcommands
    such as update, apt-get, full-upgrade, install, and purge. The packages are entries
    defined in the source list (/etc/apt/sources.list [1]).


    programs for Apt, such as Nala, can be written in Python.


    Since the beginning of the year, another Apt front end Nala has been introduced
    in Debian. Nala uses the python [5] library to access almost all the features
    supported by Apt''s underpinnings, the libapt-pkg and libapt-list libraries.


    Although still quite new, Nala can be found in the repositories of distributions
    such as Debian and Kali Linux, MX Linux, Raspberry Pi, and Ubuntu 22.04 backports.
    For other derivatives, you need to add the developer''s repository as described
    in the web on GitHub [6] to load the DEB package and install it directly.


    Along with other tools available in Debian, promoted developer Michael Steffenberg,
    received his mention in 2019 with harsh criticism [3]. Steffenberg created the
    proof of concept design, with the goal of optimizing package management in Debian,
    previously covered in July 2021 [4].


    Nala, was inspired by Fedora''s DNF package manager, seeks to address these shortcomings,
    offering easier to read output and faster than downloading.


    # What Apt Does


    As part of Debian, Ubuntu, and its derivatives, apt is the elementary command-line
    tool that takes care of package management. It performs tasks such as installing,
    uninstalling, searching for packages and displaying information. While Apt does
    not provide color-coded output (Figure 1),


