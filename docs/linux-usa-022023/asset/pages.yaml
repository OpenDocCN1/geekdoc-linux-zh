  md: '# Garden Irrigation


    This relies on a central control script named watering.py which the Raspberry
    Pi takes care of flow and controlling the humidity. The settings are stored there.
    In an initial setup, the system now moves the waters for two minutes at 5-00pm
    every day. Controlled by the second solenoid valve, it does the same thing for
    a longer time. The values can be adjusted as required.


    To water the plants, the Raspberry Pi always opens solenoid valves and starts
    pumping from the tank. Once the first water cycle is over, the system checks the
    soil moisture sensor at the place location has reached the "wet" state; if not,
    it loops up again. The second line remains open for a longer time and is controlled
    until the script stops the pump and finally shuts off the second valve.


    The Python script resides in a separate folder below the home directory. Because
    it is called in rc, it runs automatically at boot. If you like, you can also convert
    the script into binary. Everything has been kept simple here but it''s for daily
    use and can be extended at any time you feel like doing so. The script and the
    remote control PHP website below can be found in my GitHub project, where the
    writing and routing diagram for the water supply also reside. Because the Raspberry
    Pi is connected to the local network, you can also access and maintain it over
    SSH. To do so, log in to a terminal:


    ```

    ssh pi@watering

    ```


    In contrast to similar projects, the automatic watering device does not have a
    terminal-based menu. At the end of the day, it is a simple چاہئے that always follows
    the same routine. The idea is to do everything that needs to be in the browser.


    # Web-Based Remote Control


    The system works reliably without Internet access, but it should have remote access
    to avoid the need to read everything at the device or install buttons and a touchscreen.
    You have to remember that everything needs to be pretty much waterproof.


    If the irrigation system in your garden is outside the range of your router, simply
    set up whatever can help. Alternatively, during the test phase, simply connect
    the unit from the connectors and reconnect the Raspberry Pi on your home network.
    A network connection is always required for remote access, even when vacation.


    Some of today''s commercial watering systems come with a smartphone app.


