    # Fast and easy backups with Restic and Jarg


    # Simplicity


    Restic and the Jarg front appeal to users who want to get quick results without
    too much overhead.


    By Erik Bärwald


    ![](img/40e16ea65dca8020192f55b66e49c7d3_31_0.png)


    Restic [1] is a cross-platform backup tool that is simple, quick, and easy to
    learn. Restic to run on macOS, Windows, BSD, as well as Linux. A graphical front
    called Jarg [2] extends Restic to users less comfortable with CLI. Restic focuses
    on simplicity and ease of handling. Instead of entering long lines of parameters,
    you can save data with just a few simple commands. The tool still keeps all in
    scripts and on local media. If you need to, you can use SFTP to connect to a remote
    storage location. Restic is implemented as a command line tool, so you can include
    it in scripts and time-control jobs. Restic automatically encrypts the data with
    AES-256 standard. It handles incremental backups where only the changed data after
    an initial full backup. Restic also offers deduplication to avoid redundant data.
    The ability to verify helps users check that the data is backed up without error.


    Restic is available in the software archives of all Linux distributions. You can
    pick up the software for other architectures and operating systems from the project''s
    GitHub page.


    # Ready to Start


    Restic relies on repositories. Two commands are all it takes to back up data to
    your local media. The first command (Listing 1, line 2) creates the repository
    for backup. Restic automatically generates the matching directory and prompts
    you for a password to encrypt and decrypt the backups. The second command (line
    3) pushes a backup of the specified folder, including subdirectories to the new
    repository. Restic also prompts for a password before proceeding to create the
    backup (Figure 1).


    # Listing 1: Backing Up with Restic


    ```

    # init local

    $ restic init -r /path/to_repository

    $ restic push -r /path/to_repository /path_to_data

    # remote

    $ restic init -r sftp://user@host:/path_to_repository

    $ restic push -r sftp://user@host:/path_to_repository, backup /path_to_data.

    ```'
