    # LINUX 之声


    Linux 目前正在数千百万个家庭中运行，为那些只需要一个用于办公、游戏、电子邮件和其他任务的可靠桌面系统的用户服务。但每个人都知道，Linux 也是一个出色的服务器系统。如果你需要服务器，但没有时间或兴趣成为
    Linux 服务器管理员，那么 YunoHost 可能是你的最佳选择。YunoHost 的目标是让设置和使用变得非常简单。在许多情况下，YunoHost 让你只需点击鼠标即可安装服务器。本月，我们将为你介绍如何使用
    YunoHost 进行 Linux 管理。本月的 Linux Voices 还有：使用 Skrouge 管理你的财务，使用 btop++ 管理你的进程。


    | 标题 | 作者 | 页码 | 描述 |

    | :--- | :--- | :--- | :--- |

    | Doghouse — 入门 | John "madding" Hall | 70 | 自由开源软件初看起来可能会望人生生畏；少量的指导可以帮助你一臂。
    |

    | YunoHost | Erik Bwald | 71 | 在 Linux 上手动设置服务器有时会考验你的耐心，但通过 YunoHost，你只需点击几次即可安装并配置服务器。
    |

    | btop++ | Ferdinand Thom | 77 | btop++ 在系统监控和进程管理中结合了高度的便利性和极快的速度。 |

    | FOSSP-icks | Graham Morrison | 82 | 本月 Graham 查看了 Ardour、FluffyChat、PlugData、Cameracti、hiStory、CadQuery
    Editor 等！ |

    | 教程 — Skrouge | Daniel Tibi | 88 | 使用这个免费会计程序组织你的财务。 |


    # MADDOG 的小屋


    Jon "maddog" 是一位作家、教育工作者、科学家和自由软件先驱。自1994年以来他一直是 Linux 的支持者，当时他在 FreeBSD 上工作，并促进了
    Linux 移植到 64 位系统。他担任 Linux-International 的主席！


    自由开源软件初看起来可能会望人生生畏；少量的指导可以帮助你一臂。JOHN "MADDOG" HALL 著。


    ## 从命令开始


    最近，我在一次会议上遇到一个想使用自由开源软件的年轻人，但他们不知道从何处入手。他们告诉我，每个程序员都能用 C 语言编写简单的程序，但他们想要一个开源 IDE（有几个），而且他们“愿意学习
    vi 或 emacs，但听说它们很难”。


    现在我已经使用 vi 很久了，主要是通过一系列最初在硬终端上使用的编辑器。这些编辑器不是由同一个人编写的，每个都足够强大可以随着新编辑器的出现进行切换。我曾在字符终端上使用
    vi，这些终端会将光标控制输出的字符串翻译，以便在屏幕上定位字符。


    我意识到，使用文本编辑器完成一项简单的任务似乎很艰巨。有很多书籍关于如何使用这些编辑器来完成我们正在做的事情：编辑文本。


    这对于大多数开源（包括免费）软件来说都是真的，而且你完全可能学习到开发者期望使用的“基础”内容。这很容易。


    我对那位年轻朋友的建议是专注于 vi 的一小部分命令（他可以轻松使用 emacs），用于打开文件、进入输入、在屏幕上移动。


    随着时间的推移，你可以学习如何搜索字符串，或通过一两次按键移动到行尾或开头，但你可以边学边做。


    你应该尝试学习所有的命令吗？不，但 vi 的帮助文档里有这些！


    对于 GNU/Linux 也是如此。Linux 的力量真正位于图形界面之下，即大多数人所认为的“命令行”或“shell”之处，也许人们可以在从未学习这些使用层级的情况下做他们想做。


    人们可以在此系统上创建自己的图形编辑器，例如 xed，通过菜单启动，这非常依赖鼠标。你可以使用图形化文件管理器在目录中移动。你可以用鼠标点击“打印”。它是完全图形化的，并且有很多应用程序可以以这种方式工作，不需要命令行。


    然而，要真正体验 GNU/Linux 的力量，你必须学会搜索和探索。


    1971 年，我在贝尔实验室工作过 Unix 系统。虽然我工作过多种操作系统，但在之前我工作过 Unix。实验室（Unix 的创建者）雇佣了我，是因为我展示了仅凭自己学习
    Unix 的能力。


    贝尔实验室派我参加为期一周的 Unix 课程，并安排了两位导师指导我所感兴趣的管理工作。


    一天晚上，我坐在 Unix 的（纸质）控制台前，有数百行内容需要通过将文件每行每个字符的一个元素移动到同一行的另一个位置来更新。是我（而且我知道耐心不是我的长处）一行一行地编辑。这花了我八或几个小时。


    在这样的两个小时之后，我对自己说“我不知道 Unix 是如何做到此点的，但我将学会战胜它。”于是我开始查阅手册。


    过了一段时间后，我找到了我想要执行的命令，但我还需要更多。但在页面末尾我看到看到“还有粘贴”。看到那里，我构思了一行代码来使用每一个，并后来我称之为它。


    我不记得它能做的一切，也不记得其他命令了，但在之后，我花了一个或两个小时只是重新温习了不同的 Unix 命令。


    我知道在需要时，剩下的命令将是我我需要的。


    ## 一键设置你的自托管服务

    快速服务


    在 Linux 上手动设置服务器有时会考验你的耐心，但通过 YunoHost，你只需点击鼠标即可安装并配置服务器。


    Linux 是一个极好的服务器操作系统，主要是因为它的稳定性。安装和配置服务器需要深入的知识，即使在免费操作系统上也是如此，但“YunoHost” [1]让你只需点击鼠标即可在你的网络上设置一个完全配置好的服务器。


    YunoHost 的新版本既有独立版本，也有供在线使用的分发版。该系统支持 32 位和 64 位硬件，这意味着你可以回收你的旧系统。在此基础上，YunoHost
    也支持 ARM 架构。


    （注：原文中存在大量重复段落，已根据“不要重复输出原文”的原则进行去重处理，保留核心信息翻译）


