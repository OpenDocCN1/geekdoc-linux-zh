    # # MakerSpace


    # ## Shell Programming in Python

    # Snake Shell


    Create lightweight Raspberry Pi scripts with Xonsh, a Python shell that lets you
    write scripts in Python with Bash commands mixed. By Brooke Metcalfe and Pete
    Metcalfe


    ![](img/40e16ea65dca8020192f55b66e49c7d3_59_0.png)


    For or Raspberry Pi users, Xonsh [1] offers many opportunities to write some lightweight
    weight scripts, with Python connecting to physical devices and Bash utilizing
    system resources. In this article, we look at two Xonsh projects for the Raspberry
    Pi. The first program connects to a DHT11 temperature and humidity sensor and
    shows the results in a Bash dialog in just five lines. The second project calls
    the Bash utility in a eight lines to show the Raspberry Pi ID time and time on
    a 16x2 LCD screen.


    and run Xonsh shell opens, the Ubuntu, or Debian system, enter:


    ```

    ```

    sudo apt install xonsh

    ```

    ```


