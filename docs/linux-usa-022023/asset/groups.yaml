    # LINUX BTOP++


    will find it in ~/.config/btop/ along with the logfiles and the details you need.


    # Presets


    The help menu lists the keyboard commands for controlling btop. The most important
    control options and short explanations are listed in Table 1.


    Now let''s take a look at how to use btop to find the information and details
    you need, as well as to filter and manipulate processes.


    You can see the cpu, menu, and preset buttons on the left line (Figure 6). We
    have already looked at the menu. The three presets are for the layout that influence
    the graphical display. You can define your own presets in the general tab to control
    the display in your way.


    Table 1: Keyboard Shortcuts

    | Key(s) | Function |

    | --- | --- |

    | Esc/Shift+M | Displays the main menu |

    | F1/F8/Shift+H | Displays the keyboard layout |

    | F2/O/Shift+Q | Displays the Options submenu |

    | Ctrl+C/O/Shift+Q | Quits the process list |

    | +/-Shift+A | Extends the interval by 100ms |

    | -/-Shift+S | Shortens the process list by 100ms |


    Pressing 1 to 4 hides respective areas to free space for the process list. Pressing
    the 6 key shows the btop box in once more. The 1 key hides the cpu area, 2 removes
    the values, hard disk and network data. If you only want a large-scale view of
    the process list, press 1, 2, or 3. Otherwise, press 4 to remove the process area.


    # Editing Processes


    To sort, filter the data displayed in btop, click on the buttons in headers or
    the header highlighted in color. For example, to filter the running processes,
    you can click the header just above the process list. Pressing E displays the
    processes as a list, while pressing R reverses the processes. For a breakdown
    of the if you select a process and then press the Enter key, it displays the details
    above the list. They include the status, RAM usage, owner, and parent process.
    You can terminate processes by pressing T or terminate. If that doesn''t work,
    you can send a signal to the process by pressing K or double-click.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_79_0.png)


    Typing the kill [-1] command on the console displays allows you to send all signals
    to the process. You can send other signals to a process by pressing S and clicking
    on signals (Figure 6).


    All the way, btop++ visualizes the process properties and uses units that is far
    easier and safer compared to it. (Other alternatives like btop++ include the process-based
    and the Rust-based tools [10])


