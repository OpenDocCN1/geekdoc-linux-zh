    # # Graphical Backup Tools


    You define the datasets to include in the backup using the Include and Exclude
    tabs. In Include, specify the directories and files to backup, while Exclude offers
    a choice of predefined patterns. The patterns could exclude directories and file
    items the backup action will not include. You can also add additional directories,
    files, or templates. In addition, you can exclude files over a certain size; the
    default size is 500MB.


    The window contains a conventional menu and buttonbar, as well as a snapshot list.
    It is to erase two areas with a flag, where you can see the source drive along
    with the hidden files.


    The Auto-remove tab lets you automate the task of removing obsolete datasets.
    The free space on the medium, the age of the files, or the number of free inodes
    can serve as criteria.


    Right-click on files and directories to open a context menu that allows you to
    exclude a directory or file from backup. After you have made any changes, click
    the delta symbol to start the backup. If you have enabled a schedule in the Settings
    tab, Back In Time will automatically backup in the future. Note that, if you change
    source data or target, the backup may take a while to complete.


    The Options tab allows you to specify the level of detail for logs, and to display
    notifications. In the last tab Export, you can change various parameters relating
    to cron jobs and Rsync.


    If you want to restore a backup, highlight the snapshot in the top left corner
    of the Snapshots list, and select the Restore option in menu. The menu allows
    you to restore the data to the original location. If you want Back In Time to
    restore the data to a location other than the source destination, select the Restore
    option.


    After completing the settings, press OK. The software saves the profile and opens
    the backup window (Figure 2).


