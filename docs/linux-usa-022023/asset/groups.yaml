    \n# COVER STORY\n\n# BorgBackup\n\nBack up your data with BorgBackup and Vorta\n\
    \n## Keep It Safe\n\nBorgBackup and the Vorta graphical front end the stress out\
    \ of creating backups.\n\nBy Ferdinand Thommes\n\nIf you want to keep your data\
    \ safe, it is a good idea to think about a backup strategy and implement it in\
    \ a consistent way. The more data you have, the more security you need for backups.\
    \ Experts recommend that you should back up irreplaceable data twice, with a backup\
    \ location outside of your four walls.\n\nLinux allows for backup applications\
    \ - both home and work environments. One solution is limited to the listed, which\
    \ are uninterative with remote servers. One solution in remote backup scenarios\
    \ is powerful: full BorgBackup [!] can store backups on local drives or remote\
    \ servers, which offers compression and secure architecture. Thanks to the Vorta\
    \ graphical interface, Borg is suitable for home users and well as professionals.\n\
    \nVorta graphical front end. Written in Python 3, Borg features such as deduplication,\
    \ compression, and authentication. The data compression supports the LZ, LZMA,\
    \ Lib, and Zstd standards. When it comes to deduplication, it is worth considering\
    \ what the term actually means in Borg speak.\n\nDeduplication is generally understood\
    \ as a space-saving technique that breaks data down into blocks of the same size\
    \ (which borg refers as as \"chunks\") and computes a checksum for each block.\
    \ If a new file has a known checksum, this means an identical version of the file\
    \ already exists. At this point, the software compares the file contents to ensure\
    \ they are identical. The app is not restricted to the file level, but it can\
    \ also save changes to large files as chunks, which makes for very effective deduplication.\
    \ The program recognizes if they have been moved or renamed.\n\n# BorgBackup\n\
    \nBorg runs at the command line but you can also control it through the alternative\
    \ (Figure 1: When using servers connecting via SSH, you need to be sure Borg is\
    \ running on the server as well the the\n\nBorg comes from the repositories of\
    \ most Linux distributions; the package is called either borg backup. If you set\
    \ up Borg for client-server operation, you need to install the software on all\
    \ of the computers of your choice. If the version in your distribution is too\
    \ old, you can also install from the source code, or fire off git or zip. The\
    \ Borg documentation describes the installation procedure one on the target computer\
    \ or an external hard disk (Figure 2). Initializing the repositories is the same\
    \ as it is for remote machines. If you use the -e option when creating the repository,\
    \ the software prompts you for a password. It is useful to use the -v option for\
    \ verbose output); Borg is then ready for a first backup (Listing 1, line 4).\
    \ Borg creates the backup in the specified path to the repository. The name of\
    \ the archive where the app stores data; the software automatically creates the\
    \ matching folder.\n\n```\nborg init --encryption=repo /run/timeshift/backup/borgbackup\n\
    Enter new password:\nDo you want to encrypt your password? [y/n]\nRemember, your\
    \ data will be inaccessible without it.\nKeep this key safe, your data will be\
    \ inactive without it.\nArchives: 0, w/ cached Idx: 0, w/ updated Idx: 0, w/ cached\
    \ Idx: 0.\n```\n\nBy default repositories initialized with this version will produce\
    \ security errors if it works with an older version up to and including Borg 0.3.\n\
    If you want to avoid this, you can disable the encryption by running:\n```\nborg\
    \ init --encryption=none /run/timeshift/backup/borgbackup\n```\n\nSee https://borgbackup.org/en/stable/changes#mystype-1.0.9-manifest-spoofing-vulnerability\
    \ for details about the security implications.\n\nIf you used a password, the\
    \ key is stored in the repo, but you can use: 'borg export' to get a printable\
    \ format. Write down the password. Store safe before exit:\n\nFigure 2: When backing\
    \ up to an external disk the home network, Borg only needs to be installed on\
    \ the source computer. Initializing the repositories is the same as it is for\
    \ remote machines.\n\n16 FEBRUARY 2023 ISSUE 266 LINUX-MAGAZINE.COM\n\nThe next\
    \ command lists the files to be backed up. --stats option for the newly created\
    \ archive, such as the volume of data, the deduplication level, and the number\
    \ of chunks. The command in line 5 of Listing 1 displays all of the archives in\
    \ the repository.\n\n## Deduplication\n\nComparing checks, which is the preferred\
    \ method for deduplication, saves time over comparing the file contents in each\
    \ block. The checksum method also makes lower memory requirements; if two identical\
    \ blocks occur, it defends the second block, replacing it with a pointer to the\
    \ identical first. Borg makes a good candidate for cases where working directories\
    \ are constantly changing - you can back up every hour without worrying about\
    \ data usage.\n\n## Repositories and Archives\n\nYou can have the directories\
    \ on a path to an external hard disk, or otherwise, transfer the backup to a remote\
    \ computer using SSH (1). Borg stores the backups in repositories, and repositories\
    \ are stored in folders (which borg refers to as archives). So, you need to create\
    \ and initialize each\n\n| Listing 1: Initialing and Installing a Repository |\n\
    | :--- |\n| 0 | cd /media/extern |\n| 1 | sudo borg create-borgbackup |\n| 2 |\
    \ sudo borg init -e repository/extern/borgbackups |\n| 3 | sudo borg create --stats\
    \ media/extern/borgbackups::1 ~/Documents |\n| 4 | sudo borg list /media/extern/borgbackups::1\
    \ |\n| 5 | sudo borg extract /media/extern/borgbackups::1 |\n\n```\n$ borg create\
    \ --stats /home/user/borgbackups::1 ~/Documents\nenter password for backup: \n\
    Repository: /home/user/borgbackups\nArchive: /home/user/borgbackups::1\nArchive\
    \ fingerprint: d3e6d5f4b833c0b8a7d0391166be7c3f73f43912c95d2e4650\nCreated: 2023-02-29\
    \ 08:49:54\nDuration: 0:00:15\nTotal size: 12.5 MB\nUtilization of max. size:\
    \ 0%\n```\n\n17 FEBRUARY 2023 ISSUE 266 LINUX-MAGAZINE.COM\n\n# COVER STORY\n\n\
    # BorgBackup\n\n## Restore\n\nThe next command lists the files to be backed up.\
    \ --stats option for the newly created archive, such as the volume of data, the\
    \ deduplication level, and the number of chunks. The command in line 5 of Listing\
    \ 1 displays all of the archives in the repository.\n\nTo restore an archive,\
    \ use the command from line 6 of Listing 1. You can also do a full restore or\
    \ extract files using FUSE, and reconstruct the data chunk by chunk. To delete\
    \ an archive, you will need to.\n\n## Vorta\n\nIf the commands and scripts become\
    \ too complex, you might want Vorta (Figure 5), a graphical interface. Vorta is\
    \ developed by the Borg hosting service. The first step is to create a repository:\
    \ this repository can exist locally or on a remote server. For authentication,\
    \ you can also add an existing repository to a remote computer using a new SSH\
    \ key pair. Compared to Back In Time, Borg's backups are about 40 percent smaller.\n\
    \nThen you create repositories for the various backup tasks. For example, you\
    \ can back up your entire home directory at night, while a second profile lets\
    \ you create a copy of a critical directory every hour while you are working.\
    \ You also have the option to exclude specific folders from the backup set (Figure\
    \ 16)\n\n| Repository Profile | Test | More |\n| :--- | :--- | :--- |\n| /home/user/repo/borgbackup.repo.com/repo/\
    \ | Local or remote repository. For secure backup and backup hosting, try BorgBackup.\
    \ | |\n| SSH Key | Use SSH key (default) | To securely access remote repositories.\
    \ Use all existing SSH keys. Or create new ones. |\n| Compression | LZ4 (default,\
    \ default) | Compression for new data can be changed and doesn't affect deduplication.\
    \ Read more... |\n"
