    with the bars used, cached, and free memory. To the right, small graphs indicate
    the internal memory. External or SSDs appear here, with the EFI boot partition
    if available. This area is below for the CPU. btop++ shows the numeric values,
    with a graph on the right for visual monitoring network traffic.


    # What is btop?


    btop displays real-time statistics for the CPU, memory, storage, network, and
    processes, updating every two seconds by default. The values can be manipulated
    using the keyboard and mouse. All buttons with a character highlighted in red,
    in the default view, respond to mouse clicks, and you can scroll the table using
    the mouse wheel. The keyboard tends to be quite practical and it is fairly flexible.
    Another editing can be enabled in the settings in Vim. If you are a user, you
    can use your mouse to navigate the list with the H and K.


    The interface separates the sections visually; each uses a different set of colors
    or a standard black background. The upper area is occupied by the CPU. On the
    right, btop shows the individual cores with the respective loads as percentages
    and the temperature. Above this you can see the battery charging status, if the
    system has it. On the left, a time graph visualizes the load for the last few
    minutes.


    The right half of the next to two processes shows a list with a field showing
    the details of the currently selected process. This is a list of running processes
    and other information.


    # Well Prepared


    After completing this, the first launch, and finding your way around, you may
    want to press Esc or M to access the configuration. You will find the Options,
    Help, and Quit in the menu that opens. The settings in Options are distributed
    across the cpu, mem, and net tabs.


    In the tab, you can select your favorite theme from a list of two or dozens at
    them. You can also define the theme and background for the last.


