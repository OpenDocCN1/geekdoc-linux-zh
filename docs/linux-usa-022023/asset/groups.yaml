    是 Mint 开发的桌面环境，与 Mint 的 Gnome 2 桌面 MATE 不同。


    最新的发布版本是 Linux Mint 21，代号为 Vanesha。该版本包含了增强的蓝牙支持；引入了 Blueberry 的替代方案；增加了缩略图功能；以及一个帮助跟踪更新和系统运行任务的进程管理器。对
