    \ way to present a variety of dialogs in one line of code. Raspberry Pi is preloaded\
    \ with Raspberry Pi OS and Linux, so no installation is required.\n\nThe DHT11\
    \ and DHT22 sensors low cost ($5 to $10) to measure ambient temperature and humidity.\
    \ Figure 5 shows a typical DHT11 setup with the GPIO17 (note that point pin is)\
    \ sensor de-pinning assignments may vary.\n\nThe syntax for Zenith information\
    \ dialog is:\n\n```bash\n$ sys --info--title=myfile\n    $ sys --info--title=myfile\n\
    \    ---=message\n```\n\nThe DHT11/DHT22 project is installed:\n\n```bash\n$ import\
    \ Adafruit_DHT\n```\n\nListing 1 uses the Raspberry Pi DHT library to get the\
    \ temperature and humidity (line 9) and passes the data variables to Zenith dialog\
    \ (line 1).\n\nIn Xonsh, statements and variables are used directly in a bash\
    \ statement:\n\nTo run this script:\n\n```bash\n$ xonsh dht11.sh\n```\n\n## LCD\
    \ Project\n\nA number of LCD screens can be connected to Raspberry Pi. In this\
    \ project, we used a 16x2 (2 rows of 16) LCD screens ($15), which has an I2C interface\
    \ (SDA, data; SCL, clock; VCC, power; ground).\n\nFigure 6 shows the project hardware\
    \ with the Zenith and humidity dialog.\n\nHow to use Zenith, you can modify this\
    \ project with a variety of other Raspberry Pi sensors, or provide interface (PIR\
    \ motion) sensors.\n\nThe first step is to enable I2C (inter-integrated circuit,\
    \ a serial communication bus) which you can do by:\n\n```bash\n# Check I2C: enabled\n\
    1 = disabled\nsudo raspi-config get_i2c\n# Enable I2C: enabled, 1 disabled\nsudo\
    \ raspi-config do_i2c\n```\n\n```python\n(@python)\nprint(f'test: {test}')\n```\n\
    \nFor example, the bash echo command can print a Python statement:\n\n```bash\n\
    $ import sys\n$ echo \"OS: $(sys.platform)\"\nOS: linux\n```\n\n| File | Edit\
    \ | View | Help |\n|---|---|---|---|\n| get-bus-linux | print(f... | use arrow\
    \ keys to select option | |\n| buffer | errors | readline | truncate |\n| closed\
    \ | newlines | reconfigure | writable |\n| closed | flush | seekable | write |\n\
    | detach | encoding | | line buffering | write through |\n\n**Figure 4:** Xonsh\
    \ offers Python help.\n\n## MAKERSPACE Xonsh\n\nThe next step is to connect the\
    \ LCD to the Raspberry Pi. The LCD lights up after it is wired to the Pi. The\
    \ i2cdect shows active I2C hardware changes (Figure 7).\n\nA Python library for\
    \ this hardware is installed:\n\n```bash\nsudo pip install rpi_lcd\n```\n\nThe\
    \ rpi_lcd library allows an I2C device of 27. Unless the LCD device was used at\
    \ 35, you have to make an extra step to change the device:\n\n```bash\n# change\
    \ the LCD default\nfrom 27 to 35\n```\n\nstats. A third pipe with awk creates\
    \ a string with either the user time or the CPU time (Figure 8).\n\nThe output\
    \ from long Bash statements can be stored in variables in Xonsh. The script in\
    \ List 2 gets the user time (line 10) and the idle time (line 12) and shows these\
    \ strings on the LCD display (line 14, 15). The display is updated every five\
    \ seconds by looping with a Python while-state statement (line 8) and delay (line\
    \ 16). By using Python and Xonsh, this script requires eight lines of code. Figure\
    \ 7 shows the LCD with live data.\n\nTo test the LCD screen is working, enter\
    \ a few lines in the Xonsh prompt:\n\n```bash\ncd /usr/local/lib/python3.9/\n\
    dist-packages/rpi_lcd\nsudo sed -i 's/address=0x27/address=0x2f/g' __init__\n\
    ```\n\n```python\nfrom rpi_lcd import LCD\ncd = LCD()\ncd.text(\"From Xonsh,\"\
    )\n```\n\nThe goal of this project was to show the Raspberry Pi's user and idle\
    \ time on the LCD screen. The top utility displays Linux runs and CPU stats.\n\
    \nBy piping the output from top to a grep script, you can isolate a line of it\
    \ just the CPU\n\n![](img/40e16ea65dca8020192f55b66e49c7d3_61_0.png)\n\nNote:\
    \ DHT11/22 sensor has 3 or 4 pins and can be wired out.\n\n![](img/40e16ea65dca8020192f55b66e49c7d3_61_1.png)\n\
    \n# Figure 5: DHT11 wired to a Raspberry Pi.\n\n# Listing 1: dht11.dlg.sh\n\n\
    ```bash\n01 ##!/home/pi/.local/bin/xonsh\n02 #\n03 # dht11.dlg.sh\n04 # using\
    \ to show DHT11 sensor data in a dialog\n05 #\n06 import Adafruit_DHT\n07 sensor=Adafruit_DHT.DHT11\n\
    08 gpio=17\n09 # Get the humidity and temperature\n10 humidity, temperature =\
    \ Adafruit_DHT.read_sensor(sensor, gpio)\n11 # show the data in a JSON info --DHT11_Sensor_Data\
    \ --width=150\n12 zeta --format=\"Humidity: %s Temperature: %s\".format(temperature\
    \ )\n```\n\nFigure 6: DHT11 temperature and humidity test set up on a Raspberry\
