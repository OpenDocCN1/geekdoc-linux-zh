    ### Audio router


    ### qpwgraph


    PipeWire, the audio handling solution to replace PulseAudio, is now in mainstream
    distributions including PopOS, Fedora, and Ubuntu to be the new standard. It already
    works well and offers much better audio performance and configuration than the
    old defaults. Qpwgraph provides desktop tools and stream management that could
    only be from a dream for a decade, which is what it seemed to take for PulseAudio
    to finally happen. It maps PipeWire directly into a PulseAudio layer to provide
    compatibility with those long-established control panels and applications, but
    misses many of the advantages you get from using PipeWire directly PipeWire is
    similar to JACK in its low latency and mobility, you can access these features
    without a third party console, and that qpwgraph is a PipeWire graph UI with a
    terrible name.

    If you''ve used Catia or QJACK to access connectivity, you''ll already be familiar
    with the view qpwgraph presents first launched. Every input and output is shown
    as a node, which makes it to route audio flows easily. If you use Firefox and
    execute to play sound, for example, PipeWire and the graph automatically insert
    new nodes to the graph. You get the new audio path. You then drag and drop any
    connection to change the pattern, which is great if you want to run some effects,
    or to route the audio to an output and to a recording application.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_82_0.png)


