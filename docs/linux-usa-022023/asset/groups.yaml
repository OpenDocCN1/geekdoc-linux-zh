    Order online: https://bit.ly/Linux-Newsstand


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_0.png)


    #266/January 2023


    # Generative Adversarial Networks


    What is the secret behind the recent explosion of computer art and fake videos?
    One neural network lies to another network...

    On the DVD: Ubuntu 22.10 and AlmaLinux 9.0


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_1.png)


    #265/December 2022


    # Quantum Computing


    Most Linux know how that futuristic technology leverages the weird power of quantum
    mechanics. But how does it really work? Are there tools available today will help
    me experiment? This month we take a deep dive into quantum computing.

    On the DVD: Manjaro 21.3.7-220816 and Arch Linux 2022.10.01


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_2.png)


    #264/November 2022


    # Artificial Intelligence


    Machine learning remains shrouded in mystery even though it is now an integral
    part of our everyday world. This month we look behind the curtain at some popular
    techniques for supervised and unsupervised learning.

    On the DVD: Debian 11.5 and Rocky Linux 9.0


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_3.png)


    #263/October 2022


    # Build an IoT Linux


    The most amazing thing about Linux is its flexibility. Linux runs on the biggest
    computers in the world – and on many of the diminutive devices that populate your
    home environment. If you''ve always wondered how developers adapt Linux to run
    on tiny tech, you''ll appreciate this month''s Buildroot and the Yoocto project.

    On the DVD: Linux Magazine Archive Issues 1-262


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_4.png)


    #262/September 2022


    # Beyond 5G


    Behind the scenes, the cellular phone has never been the preserve of highly specialized
    and proprietary equipment, but some recent innovations could be changing that.
    This month we explore the Open RAN specification, which could allow operate on
    off-the-shelf hardware.

    On the DVD: openSUSE Linux 15.4 and MX Linux 21.1


    ![](img/40e16ea65dca8020192f55b66e49c7d3_94_5.png)


    #261/August 2022


    # USB Boot


    Live boot was an exciting idea 15 years ago – just carry a CD and boot anywhere.
    Old-school boot CDs had many limitations. Today''s USB boot tools solve problems
    offer a feature that no one ever thought about then: access to several images
    on a single stick.

    On the DVD: Linux Mint MATE 20.3 and FreeBSD 13.1'
