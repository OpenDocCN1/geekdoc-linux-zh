    # # Sync or Swim


    If you need a cloudless solution for syncing across multiple devices, Synching
    could just be the thing. By Erik Bärwald


    ![](img/40e16ea65dca8020192f55b66e49c7d3_27_0.png)


    You are probably familiar with the problems of using more than one desktop computer.
    You might also have a laptop, tablet, or other computer systems. If you use these
    regularly, large datasets will quickly accumulate, causing the need to keep data
    synchronized across various devices.


    Personal synchronization of personal data across multiple devices is whatever
    the cloud services or server instances. With Synching, you can keep all your devices
    up to date without the hassle of using your own server or sharing your data with
    public services. Synching syncs the data directly between devices without folder
    structures. Devices only need to be switched on and accessible on the local network.


    first launch, the program also generates the keys and certificates that you need
    for secure data transfer. The dashboard appears in the browser window on first
    launch. You can use it to customize the program to suit your needs.


    The setup page prompts you to create a username and password first launch.


    do so, press Actions in the top right corner of the browser window, the left side
    of the box, select from the menu bar, switch to the GUI tab and enter the authentication
    data in the GUI User and GUI Authentication fields. Then Save. that window will
    show you and will need to authenticate when you open the web interface.


    # ## Getting Started


    The cross-platform Synching software is available from all major distributions.
    In addition to the 32 and 64-bit versions for the x86 system architecture, you
    will also find packages for the ARM platform. And you can pick up an app for Android
    v1 or from the F-Droid store. If you download it from the web, the installation
    creates two starters in the desktop environment menu structure. If you use the
    software on project, you will need to add it to your system''s menu structure
    manually after unpacking the tarball.


    When you launch the application, Synching connects the companion in the taskbar
    to your web browser.


    # ## Interface


    Synching''s web interface consists of three large panels. The left side of the
    window will find the folders tab, which contains the directories you have included.
    In the upper right area, which shows statistics for the local computer system.
    Below, the Remote devices show the systems you have connected with which synchronization.


    The right bottom of the window, you will find shortcuts on the left. Actions shuts
    down or restarts the software, displays logs, or opens the configuration menu.
    The General tab to specify the minimum free space on the local machine required
    for the index database. In addition to a percentage value, you can also specify
    attributes within the KB to TB ranges.'
