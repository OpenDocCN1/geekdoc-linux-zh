    KRunner 将命令行与图形化导航相结合，为 Plasma 用户提供了速度和舒适性。作者：Bruce Byfield


    对于大多数用户来说，命令行和桌面环境是截然不同的。一个显著的例外是 KRunner (1)，它是 KDE Plasma 默认安装的。通过与其他默认 Plasma
    应用以及系统硬件进行交互，KRunner 基本上是一个运行单一进程的汇聚小部件，但它也是一个应用程序启动器和通用导航工具，以及计算器、测量和货币转换器、处理器控制器，甚至是一个拼写检查器——所有都可以通过键盘控制。


