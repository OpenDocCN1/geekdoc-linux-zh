    and finally adds Rust on all supported platforms. The distribution ships with
    either Gnome 43 or KDE Plasma 5.26 and enjoys all of the new features and fixes
    found in both of those environments.


    - As what is new in Alpine Linux itself, the list includes Bash 5.2, GCC 12, Go
    2.2, OpenSSL 3.0, Py 3.16, PostgreSQL, Node.js 18.12, Ceph 17.2, Go 1.19, Rust
    1.64, and .NET 7.0. OpenSSL is also available with the openssl1.1-compatible package.


    It should be noted that PHP 8.0 has been officially deprecated and ISC moved to
    the main repository for long term support, whereas DHCP moved to the community
    support, which users are now encouraged to make the switch from DHCP to DConfig.


    You can read more about Alpine Linux 3.17 in the release notes (https://alpinelinux.org/posts/alpine-3.17-released.html)
    and download an ISO from the download page (https://alpinelinux.org/downloads/)
    for the following architectures: 64-bit (x86_64), AArch64 (ARM64), 32-bit (x86),
    PowerPC Little Endian (ppc64le), and System Z (s390).


    ## Starfighter Laptop Available


    Star Labs has been creating laptops for some time and now recently introduced
    a new addition to their fleet (https://starlabs.systems/products/starfighter).
    This beautiful piece of technology features a matte display to defeat glare so
    can shine brighter. The display offers up to 3840x2400 resolution, a 16:10 aspect
    ratio, and 600 nits brightness at a 120Hz refresh rate.


    Other features on the Starfighter include a removable webcam with built-in storage,
    a backlit keyboard with mechanical layouts. The Starfighter also includes a haptic
    touchpad, and electrostatic coating for texture that is stronger and fingerprint
    resistant. You''ll find Bluetooth 5.3, HDMI, USB-C, and an audio jack. The firmware
    on the Starfighter is open core the battery is charged by gallium nitride that
    provides 65 watts over USB-C.


    ## Get the latest news in your inbox


    ### Linux Update


    As far as components, the base model comes with 12th generation i3 CPU but can
    be upgraded to AMD Ryzen 7 (6800H) or Intel i9. The Starfighter can up to 64GB
    of RAM and the storage can range from 24GB to 2TB. Keep in mind, the laptops may
    not ship for four months from now.


    ## Critical Escalation Vulnerability found in the Linux Kernel


    Red Hat added a new CVE, identified as 2022-3977 (https://access.redhat.com/security/CVE-2022-3977),
    which is described as a use-after-free flaw. A use-after-free flaw can occur when
    a program attempts to use memory that has been released. CVE-2022-3977 exists
    in the Linux kernel Management Component Transport Protocol (MCT). This vulnerability
    occurs after a user simultaneously calls a socket close. When this happens, the
    vulnerability can be used to elevate privileges all the way to root.


    This CVE has been listed as Moderate, with a CVSS base score of 7.0 and the vulnerability
    was found in the most upstream Linux kernel. It was the Arch Linux Laboratory
    that originally originated the vulnerability, finding it in kernel v5.10 with
    the commit 3d40a61aa6681bdce9377ac7f6a53. Fortunately, with a recent commit, the
    vulnerability has been patched.


    If you have a Linux running kernel 5.18, you should immediately run an upgrade
    to the latest kernel. Most major repositories have likely added the patch to their
    standard repositories.


    ## AlmaLinux 8.7 Now Available


    The newest release of AlmaLinux, version 8.7, is now available for the general
    public. This is a 1:1 binary-compatible replacement for Red Hat Enterprise Linux
    8.7 and features plenty of changes and updates.


    One of the biggest is the ability to build custom images with custom boot partitions
    and sizes. In addition, the latest release includes important security updates,
    such as Network Security Service (NSSL) libraries have increased the minimum key
    size from 2048 to 3072 for all RSA options.


    Others include: scap-guide is now better aligned with Defense Information Systems
    Agency technical guides content; a new package, xml2, which can parse, transform,
    query, validate and edit XML files; Ruby 3.1; Mercurial 6.2; and Node 18.


    The kernel shipping with AlmaLinux 8.7 is 4.18-423 and the operating system includes
    support for x86_64, AArch64, ppc64le, and s390 architectures.


    Download a copy of AlmaLinux 8.7 (https://mirrors.almalinux.org/iso/).


    # NEWS


    ## Kernel News


    ## Zack’s Kernel News

