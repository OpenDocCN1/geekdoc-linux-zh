    Synthing 的 GTK 前端已经存在很了（图 3）。您可以在各种发行版的仓库中找到它，版本号大致相同。遗憾的是，该端在过去三年没有得到良好的维护。由于与许多依赖不兼容，操作受到了一些限制。GTK
    端可以安装和启动，但没有完整的功能。我的建议是选择网页界面并避免此 GTK 前端。


