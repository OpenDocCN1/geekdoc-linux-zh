    # This Month’s DVD


    ## Linux Mint 21 Cinnamon and Kali Linux 2022.4

    Two Terrific Distros on a Double-Sided DVD!


    ![](img/40e16ea65dca8020192f55b66e49c7d3_5_0.png)


    ![](img/40e16ea65dca8020192f55b66e49c7d3_5_1.png)


    ## Linux Mint 21 Cinnamon

    64-bit


    ## Kali Linux 2022.4

    64-bit


    Linux Mint needs no introduction for many users. Based on long-term support (LTS)
    editions of Ubuntu, Linux Mint is one of the three best derivatives of Blueberry;
    known for its innovation and close consultation with users. Cinnamon is the desktop
    developed by Mint, as opposed to MATE, Mint''s Gnome 2.


    The latest release is Linux Mint 21, codename Vanesha. Its version includes enhanced
    Bluetooth support, with the replacement of Blueberry; the addition of thumbnails
    for more graphics; and a process manager to help keep track of processes such
    as updates and system tasks running in the background. Minor tweaks are also made
    to Sticky Notes and tasklist, which includes better icon handling for each app.
    The major change is that Muffin,s version of the Window manager, has been updated
    to bring it closer to matter after a decade of development. The result includes
    improved anti-aliasing and better desktop effects.


    As usual, Linux Mint Cinnamon edition offers a user-friendly experience for all
    levels of users. Users can quickly learn the desktop, and veterans can enjoy one
    of the most stable, feature-rich environments available on Linux.


    Developed by Offensive Security, Kali is a leading forensic distribution. A Reignition
    of Offensive Security’s Back-Track, Kali is primarily based on Debian Testing,
    Offensive Security also provides packages for the tools it develops.


    - The latest version of Kali includes over 600 tools, including:

    - Armitage, a graphical cyber attack tool

    - Nmap, a port scanner

    - Wireshark, a packet analyzer

    - Metasploit, a penetration testing framework

    - Sqlmap, an automatic SQL injection and database takeover

    - Crackrack, a software tool for penetration testing wireless LANs

    - Burp Suite, an integrated security testing platform for web apps

    - OWASP Zed Proxy (ZAP), a penetration tool for web apps


    Kali is aimed specially at expert users. However, for all users, Kali Linux remains
    a major one-stop distribution for security troubleshooting.


    Defective discs will be replaced.

    Please send an email to subs@linux-magazine.com.


    Although this Linux Mint has been tested and is to the best of our knowledge free
