    KRunner 还有自己的命令集来调用不同的函数。如果你想重复某个命令，请从路径末尾的下拉列表中选择。最实用的 KRunner 命令之一是 `kill`，它可以关闭任何应用程序，杀死消息框。请注意
    KRunner 并不是 Bash。事实上，它是任意选择的字符，可以在“系统设置 | 终止应用程序”中更改。你也可以选择优先显示 CPU 占用率最低的应用程序列表，或者根据输入补全来选择。同样，要查看页面，语法为
