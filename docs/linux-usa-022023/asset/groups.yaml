    ## 使用树莓派进行花园灌溉！


    ## LINUX 杂志


    第 267 期 + 2023年2月


    ## 备份


    使用完美的备份工具确保安全并最大化便利性


    Xonsh：使用 Python 进行 Shell 编程


    YunoHost：管理 Linux 器的简易方法


    Nala：使用这款迷人的 Apt 前端让你的软件包井井有序


    自然语言处理的秘密


    # 10 种强大的开源工具


    WWW.LINUX-MAGAZINE.COM


    ## 深入了解 Rocky Linux


    下载这份免费焦点指南，了解为什么 Rocky Linux 正在全球范围内获得用户的青睐。


    ![](img/40e16ea65dca8020192f55b66e49c7d3_1_0.png)


    https://bit.ly/Inside-Rocky-Linux


    ## 代码关注


    亲爱的读者：


    在出版了这么多年后，很少有某个随机的标题能吸引我的注意力，但我不得不承认这个标题引起了我的目光：“糟糕的软件质量导致美国损失了 2.4 万亿美元”。起初我以为那是个笔误。我本以为应该是“十亿”——我没没想到竟然是“万亿”。继续阅读后，似乎“万亿”确实是他们的本意。


    该标题新闻稿的所有功劳归于软件质量信息联盟（CISO [1]）的一份报告，该组织由对象管理组（OMG）标准开发小组和卡内基大学的软件工程学院创立。还包括 MTRE
    和 Gartner 集团在内的各种安全组织和顾问。


    报告列出了导致这一天文数字损失的三个原因：


    - 网络安全

    - 第三方组件的软件供应链问题

    - 技术债


    网络安全受到的关注最多，但根据报告，它是这三个昂贵问题中最小的一个。大多数关于供应链问题的讨论集中在开源上。在这种情况下，争论点似乎并不是关于开源本身，而是因为少数组件被广泛使用。根据报告，“一个中等规模的应用（少于百万行代码）平均拥有约
    300 个软件组件”。最流行的源代码组件被构建在数千个应用程序中，因此如果发现其中一个发现问题，这个问题就会被成千上万地放大。正如报告指出的，开源组件的免费可用意味着，组件的重要性超过了最终产品代码的质量，而且更大比例的代码来自程序员无法的来源。许多公司未能跟上所有变动部分的挑战。报告引用了一项研究，发现经过审计的代码库中，81%
    的组件已经过时了。


    对于普通用户来说，技术债的讨论是最后一个熟悉的。技术债是经济学领域的概念，在技术行业并没有引起太多关注。维基百科将债务定义为“由于选择简单（有限）的解决方案而不是使用耗时更长的更好方法，而导致额外重复工作的隐性成本”。这种想法是，通过对问题应用捷径或快速修复（通过忽略问题，这也有帮助），你产生了未来将偿还的债务。危险在于，问题在以后会以“利息”的形式变得难以修复。


    经济学家和资本家需要某种技术债来评估公司的价值。假设你有两家从相同软件开始的公司。A 公司拥有缺乏良好实践的持续开发债，但其成本与投资水平相符。B 可能有其他安全修复，但问题正在堆积。C
    可能有另一个……


    你可能会奇怪为什么所有数字都重要。2.4 万亿美元是为了引起震惊。每一美元的投资都对应了某种浪费吗？但也许，你也可以相信每家成功的公司都专注于如何尽可能保持低债务。报告中提供的一些解决方案是你听过的补救措施：更好的质量标准和更好的维护安全工具。其中一个解决方案是最新实践中的新事物，尽管它是一个持续的梦想：扩展使用
    AI 和机器学习进行软件开发。


    网络安全和安全将主导下一个周期。其他质量问题在学术界讨论，在某种程度上也在编程界讨论。但对于 CISO 报告来说，代码的价值将把这些问题推向表面。开源社区确实需要花更多时间考虑对这些核心组件能做什么——包括让开发者保持它们的更新。也许下次你投资一家软件公司时，不要只看：公司对其代码的承诺。


    ## 信息


    - [1] 美国糟糕软件质量的成本：2022年报告：https://www.c-isq.org/the-cost-of-poor-quality-software-in-the-us-report-2022/（需要注册）


    ![](img/40e16ea65dca8020192f55b66e49c7d3_2_0.png)


    Joe Casad

    主编


    ## LINUX 杂志 2023年2月


    ## 封面


    - 40 Nala：适合每个人的 Apt 软件包管理。

    - 44 自然语言处理：使用 AI 让你的视频对口型。

    - 60 Xonsh：在你的 Python 脚本中加入 Bash 命令。

    - 64 花园灌溉：使用树莓派 Zero 和少量 Python 自动为藤蔓浇水。

    - 71 YunoHost：极简的服务器管理。


    ## 新闻


    ## 评测


    - Linux 内核对 Rust 的初步支持发布

    - 4Linux 41.0 现在稳定并可以使用

    - Xfce 4.18 即将推出并提供改进

    - Orange Pi 板板正在开发基于 Arch 的 Linux 发行版

    - 新 Star 大气笔记本电脑开放预售

    - Linux 内核发现关键升级漏洞

    - Almalux 8.7 现已可用

    - 30 发行版之旅 – OpenMandriva Lx：人类以 OpenMandriva Lx 的形式延续。Bruce 采访了 OpenMandriva
    委员会成员，了解这一创新发行版的情况。


    ## 深度


    - 12 条内核新闻

    - 在 64 位 CPU 上使用 32 位内核的漏洞

