    # Parts List


    - Raspberry Zero W (model 1 or 2)

    - Centrifugal pump with 1.2m head

    - Solenoid valves (x2)

    - Relay modules (x3)

    - ADC (ADS1115, or similar)

    - Moisture sensors (x2)

    - Plugin power supply (5V)

    - Housing, wiring

    - Various hoses and clamps

    - Adapters, control valves, ground spikes


    program files are on the GitHub page for the project [1] [2].


    Now it is time to connect the external hardware, pump, and solenoid valves to
    the base material (Figure 4). Because no suitable distributor was available downstream
    of the pump, I soldered myself one from brass. The two control valves allow for
    a two-way system that can supply two groups of plants with different water needs.


    Thanks to the two main lines can also be reliably blocked against the reservoir
    when evacuated in idle.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_64_0.png)


    OS image in the usual way transfer it to a microSD card. With the screen and keyboard
    plugged in, the boot options and network settings can be configured. A desktop
    environment is not needed, which I went for automated login from CLI with SSH
    enabled. All further settings can be configured in a terminal window from a computer
    on the same network. The Raspberry Pi needs a hostname that reminds you of the
    task in hand (e.g., inserting in this case). The next step is to create a separate
    folder for the project files in your home directory.


    # Structure


    The main elements of the control system will live in a ready-made housing with
    a rubber seal in the lid and a terminal strip, on which all the external wires
    will be patched (Figure 2). Two small valves are located on inside to fasten to
    all the modules. The housing for the unit contains the Raspberry Pi, an analog-to-digital
    converter (ADC) module, and three relays. The external power supply connects two
    moisture sensors, two solenoid valves, and the pump routed from below with four
    cores. At the top, where I used the unused screw with transparent material, an
    LED indicates operational readiness.


    The Raspberry Pi needs four GPIO pins for the control pins on the relay boards
    and the LEDs are connected over the DC bus. The internal terminal strip routes
    the converter''s analog inputs with the humidity sensors and the switching out
    of relays for the pump and solenoid valves. The schematic (Figure 3) and associated
    circuit diagram correctly, and fasten them with ground spikes. Hose clamps around
    the thicker hoses reliably prevent them slipping off the connections where you
    are.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_64_1.png)


    # MAKERSPACE Garden Irrigation


    # Control


    If you look at commercial irrigation systems, they often seem relatively complicated
    to operate. In contrast, I want this system to be as simple as possible, so the
    DIY system remains manageable and works safely during periods of absence from
    home. That, the automatic watering system has one trick up its sleeve: it can
    extend the watering time to achieve a certain level of moisture in the use of
    sensors that provide feedback from two different locations.


    **Figure 4:** Shorter paths: the simple connection layout for the water supply-condition.
    Distribution downstream can be done with a smaller hose diameter; Pieces are used
    for more branches. Small regulators ensure that water reaches the plant locations
    evenly; setting them requires some trial and error. For an initial test, I first
    the connection on the centrifugal pump to allow immersion.


    Capacitive sensors were chosen because they are susceptible to corrosion than
    resistive sensors. Although I am talking about models with analog output, they
    can be connected easily to the Raspberry Pi in the control through the ADC. To
    determine the various limits up front, I tested the sensors in water (Figure 5)
    and put them in moist soil. The ADC in this setup is an ADS1115, which is addressed
    in Python 3 with a library by Adafruit. The easiest way to install it is


    If everything works satisfactorily, you can proceed to trim hoses and cables to
    the required lengths, route them


    ```bash

    pip3 install Adafruit_ADS1x15

    ```


    ![](img/40e16ea65dca8020192f55b66e49c7d3_65_1.png)


    **Figure 5:** To determine limits, test the humidity sensors attached to the ADC.


    # Garden Irrigation


    This relies on a central control script named watering.py which the Raspberry
    Pi takes care of flow and controlling the humidity. The settings are stored there.
    In an initial setup, the system now moves the waters for two minutes at 5-00pm
    every day. Controlled by the second solenoid valve, it does the same thing for
    a longer time. The values can be adjusted as required.


    To water the plants, the Raspberry Pi always opens solenoid valves and starts
    pumping from the tank. Once the first water cycle is over, the system checks the
    soil moisture sensor at the place location has reached the "wet" state; if not,
    it loops up again. The second line remains open for a longer time and is controlled
    until the script stops the pump and finally shuts off the second valve.


    The Python script resides in a separate folder below the home directory. Because
    it is called in rc, it runs automatically at boot. If you like, you can also convert
    the script into binary. Everything has been kept simple here but it''s for daily
    use and can be extended at any time you feel like doing so. The script and the
    remote control PHP website below can be found in my GitHub project, where the
    writing and routing diagram for the water supply also reside. Because the Raspberry
    Pi is connected to the local network, you can also access and maintain it over
    SSH. To do so, log in to a terminal:


    ```bash

    ssh pi@watering

    ```


    In contrast to similar projects, the automatic watering device does not have a
    terminal-based menu. At the end of the day, it is a simple چاہئے that always follows
    the same routine. The idea is to do everything that needs to be in the browser.


    # Web-Based Remote Control


    The system works reliably without Internet access, but it should have remote access
    to avoid the need to read everything at the device or install buttons and a touchscreen.
    You have to remember that everything needs to be pretty much waterproof.


    If the irrigation system in your garden is outside the range of your router, simply
    set up whatever can help. Alternatively, during the test phase, simply connect
    the unit from the connectors and reconnect the Raspberry Pi on your home network.
    A network connection is always required for remote access, even when vacation.


    Some of today''s commercial watering systems come with a smartphone app.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_66_0.png)


    Figure 6: Web-based control.


    # MAKERSPACE Garden Irrigation


    Table 1: Web Interface Functions

    | Name | Function |

    |---|---|

    | Activate | Enabling watering timer (default: on). |

    | Off | Disable timer. System remains switched on. |

    | Water | Immediate delivery for 10 seconds through both lines. |

    | Restart | Reboots the system. The web interface is active again after restarting
    the Raspberry Pi. |

    | Shutdown | Shut down the Raspberry Pi. A manual off-cycle is required. |


    secure the remote control website with a login.


    # Conclusions


    The plant watering system does exactly what it was supposed to do, in a positive
    way. I ran it in sunny weather during the last few days of summer, and checking
    it functionality was no problem (Figure 7).


    The system will vary as my stand-in next year. To try watering the whole garden
    would probably be overshooting the map, but if you are looking to rescue your
    most important plants in a limited area (e.g. a greenhouse, conservatory, or living
    room), this controller can be a real helper.


