    - 什么时候崩溃（Panic）是允许的

    - 40 Nala：Debian Apt 软件包管理器的 Nala 前端将工具的可靠性与更易读和更快速的下载结合起来。

    - 44 自然语言处理：如果演员的动作与配音电影中的文本不匹配，看起来就会很奇怪。


    ## 封面故事


    - 50 命令行 – KRunner：kRunner 将命令行与图形化导航相结合，为 Plasma 用户提供了速度。

    - 16 BorgBack：BorgBackup 和 Vorta 前端让创建备份变得简单。

    - 54 编程快照 – Go 密码管理器：一个用于终端的 Go 应用程序帮助 Mike 记住密码。

    - 20 图形化备份工具：只需点击即可保护数据的图形化备份解决方案。

    - 28 Synching：如果你需要一个跨多个设备同步数据的无云解决方案，Synching 可能是不错的选择。

    - 32 Restic/Jarg：Restic 和 Jarg 吸引了那些想要快速结果而无需太多开销的用户。

    - 95 往期

    - 96 活动

    - 97 征稿

    - 98 下期预告


