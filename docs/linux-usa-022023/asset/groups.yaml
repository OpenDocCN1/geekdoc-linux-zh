    # 深度解析


    ## 自然语言处理


    它们仅仅超越了句子本身。事实上，RNN 捕获的上下文不仅限于相邻单词。理论上，它还可以学习复杂且遥远的关系。


    RNN 可以处理各种序列学习问题的变体。你可以在最左侧的图 2 中看到最的情况：输入和输出之间是 1:1 的关系。它完全没有遵循序列，但与图 1 中的示例相似。


    多对一（n:1）常见于分类任务。训练后，当输入是一个序列时，除其他因素外，例如，输入可以分配给给定的分类系统：输入由序列组成，输出由待确定的类别组成。


    序列学习的相反是从固定长度的输入产生变长度的输出。这在生成文本时是理想的，例如我们想要根据一组测量值生成天气预报。也可以使用多对多（n:m）架构。训练后，你可以在每种情况下确定输出序列中的下一个词项（或完成输出）。


    图 2 中的，第一个多对多（n:n）产生的输出与输入序列等长。除其他因素外，这可以用于处理标记任务（例如，标记文本中的公司名称）。另一个示例可以是标记出发和到达时间、日期和时间，以及用户在购票时可能提供的其他信息。


    最后，最右侧的多对多架构（n:m）允许输入和输出长度不同，提供了 n:1 架构未涵盖的广泛可能性。问题和答案在英语中恰好是相同长度。


    如果我们想在过程中改变单词的数量，文本无法以相同的内容翻译成另一种语言。这通过编码器-解码器模型解决了，因为它首先将输入编码为长度与 n:1 前缀匹配的片段序列。这对于长序列非常有帮助，因为它允许解码器从固定表示中检索所有信息。


    编码器-解码器模型使用注意力机制来控制在每个解码步骤后对输入步骤中间步骤的注意力。这非常有帮助，例如从一种语言到另一种语言的可靠翻译，在翻译过程中，需要对输入句的含义进行注意力校准。由此产生的是，德语单词
    bank 被翻译为英语中的 "bank" 或 "bench"。


    此外，注意力在解码过程中补偿了句子结构。这很重要。


    ## 听觉与视觉


    如果你需要适配一个具有编码器-解码器架构的机器翻译系统，将外部知识整合到翻译过程中，就会出现特殊问题（图 3）。这对于口同步是必要的。但首先，让我们解释为什么


    当人们说话时，脸部的某些部分反映了产生的声音。上唇和下唇需要产生 M 和 B 音，而说 A 或 O 时嘴唇张开。大多数人依靠这种口型同步来理解所说的内容，而不涉及任何音频。即使看着说话者的脸部和面部表情，利用这些来理解所说的话对背景的影响也有大小。


    相反的现象被称为麦格克效应（McGurk effect）。如果你感知到一个脸的唇部动作，你的视觉翻译将覆盖听觉印象。


    据说在说话者嘴部移动的方式下，"Gaga" 被说成 "Baba"。错误的唇部动作会导致错误的感知，听觉和视觉印象之间的认知失调给大脑带来压力。


    电影需要考虑观众不仅会听到说话者的声音，还会看到唇部动作。配音电影应该尽可能易于观看并获取语言，通过使唇部动作与观看匹配来避免配音产生的伪影。媒体的视听翻译通常旨在让观众认为图像中的说话者经过翻译和配音，但他们实际上说的是你能听到的文本。这意味着翻译过程中增加了一个额外限制，因为必须考虑视觉通道。这个词序列必须精确匹配可见的动作。虽然翻译成德语可能尽可能忠实，但现在可能在
    Blutchemistry（血液化学）或 Des Blut jedes Menschen（每个人的血）之间做出选择，但在口型同步版本中，“化学”实际上被完全丢弃了。此时德语观众看到的是：“Nein,
    das Blut Menschen ist einzigartig, wie Fingerabdrücke——”（不，每个人的人的血化学都是独特的，就像指纹一样），


    不，不，每个个体的血化学都是独特的，就像指纹一样。Nein nein, das Blut Menschen ist einzigartig, wie Fingerabdrücke。


    **图 4**：配音中保持口型同步，以美剧《英雄儿子》（Heroes）中的一个短场景为例。


    寻找一种将源文本内容尽可能忠实地转换为目标语言的渲染方式，视听翻译涉及内容与视觉的平衡。首先最重要的是，当两种语言中相同含义的单词长度不同时，大多数视听翻译需要具有难度（例如德语中的
    einzigartig 翻译为英语中的 “unique”）。此外，你必须关注嘴唇和下颌，只要嘴唇是说话者的。


    图 4 展示了来自《英雄儿子》翻译的一个示例，英语版本说：“No, no, each individual’s blood chemistry is unique,”
    它是不言而喻


    然而，它并不完美。在绿色标记处，口型同步中将 “M” 替换为 “B”。这是理想的，因为这两个声音只能通过嘴唇产生。红色标记的单词情况完全不同。虽然 “di”
    需要嘴部的可感运动，但 “bi” 德语观众现在只能通过闭合牙齿来产生。


    发生的细微细节不会被大多数观众注意到。此外，声音的重复和哭泣：P、B 和 M 在视频中看起来几乎完全一样。


    **图 5**：由配音估计器扩展的编码器-解码器架构确保翻译的语音同步。


    配音材料可能导致观众变得如此熟悉，以至于他们（通常无意识地）忽略微小的异常；然而，如果电影中的口型同步故障变得太极端（例如，听到一个角色的声音而他们的嘴唇保持不动），会大幅降低观众对翻译质量的感知。


    目前正在调查的问题这样的问题：个体因素（如翻译质量和同步）的权重衡量如何优化整体质量？人们在什么时候发现口型同步不再完美？


    该系统中的编码器保持分离状态，由于这个原因没有显示。然而，在解码期间，并不是只有翻译中创建的词列表，而是根据这些对可能的下一个词的估计翻译质量进行排序：第一个和最后一个词。


    同样重要的是记住语言差异很大。因此，这个问题非常复杂，单一模型无法胜任。正如此，为使用的不同语言翻译单独的模型是必须的。


    ## 口型同步


    扩展之前讨论的编码器-解码器模型有助于我们生成随后可以进行口型同步的翻译。图 5 显示了我们开发的“配音估计器”。


    '
