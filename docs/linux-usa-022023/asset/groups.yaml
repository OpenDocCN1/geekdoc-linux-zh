    ## Package manager


    ### Pacstall


    Arch Linux has transformed the Linux landscape and has singlehandedly made minimal
    distributions at all. It does without the installation process or by making assumptions
    about what users might need. In a way of easy installation and distribution testing,
    Arch puts the onus on the user, but for the better. Arch Linux has thrived and
    become default on Valve''s Steam Deck and thanks to the Arch User Repository (AUR).


    AUR packages are easy and are incredibly diverse, but the AUR is the first place
    to look for new software packages. Why is the AUR also to verify these pages,
    because it helps us install and configure what we write about:


    Pacstall is a project that brings the convenience and the diversity you find in
    the AUR to Ubuntu. It does not use the AUR itself but it aggregates lots of different
    package formats, including binary, Git, Appimage, and builds the packages for
    you. In this way, you get the latest version available from Git or build packages
    from branches. The command system is similar to pacman, with packages installed
    via pacstall a — followed by the package name. There aren''t too many complex
    packages, but they do include open source and proprietary packages, including
    Android.


    ```bash

    $ pacstall -S package

    $ pacstall -R package

    $ pacstall -U package

    ```


