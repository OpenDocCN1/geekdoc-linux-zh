    # Set up yourself hosted services at the push of a button

    Quick Service


    Setting up a server manually on Linux can sometimes test your patience, but with
    YunoHost you can install and configure your servers with just a few mouse clicks.


    Linux is an excellent server operating system mainly because of its stability.
    Installing and configuring a server requires in-depth knowledge, even on the free
    operating system, but ''YunoHost'' [1] lets you set up a fully configured server
    on your network with just a mouse click.


    The new version of YunoHost is available both as a standalone and distribution
    for use online. The system works on both 32 and 64-bit hardware, meaning that
    you can recycle your older systems. On top of this, YunoHost is available for
    ARM-based board computers, and even Raspberry Pi systems are suitable for the
    bases of a server network.


    The software supports installation on a remote computer via SSH. However, Debian
    11 ''Bullseye'' has the preinstalled underpinnings of the remote machine. After
    installing the basic system, you can easily integrate the desired services via
    a web-based interface. The system is not


    limited to a couple of well-known services, but supports no fewer than 350 preconfigured
    programs.


    BY ERIK BÄRWALT


    # Installation


    The project''s website lists the minimum hardware requirements for each platform
    to run YunoHost [2]. Because these requirements are very low in terms of RAM (512MB)
    and in terms of storage (16GB free disk space), older 32-bit computers with conventional
    hard disks are viable for YunoHost operation. Detailed instructions for the different
    approaches to installing the system as a function of the target platform are available
    on the project site. But, the Debian setup wizard is used in both text and graphical
    mode.


    The basic installation sets up a database and a web server. On completing the
    system, you will see a login prompt. YunoHost is now ready for you. Then talk
    to the system via the graphical interface from any device that has a browser.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_70_0.png)'
  - '[PAGE 71]


    # # LINUX VOICE YUNOHOST


    ![](img/40e16ea65dca8020192f55b66e49c7d3_71_0.png)


    Figure 2: The web interface clears all groups on a single page.


    To do this, simply type://YunoHost.local or, alternatively, the IP address of
    the server in your browser''s address bar. A setup wizard launches with a start
    page reporting the successful installation of the server. Pressing the Begin button
    takes you to the configuration dialog (Figure 1).


    In the next step you will create a domain for your YunoHost server. If you don''t
    have your own domain, setup offers you the option of generating a dynamic domain.
    The DNS keeps your domain accessible on the Internet even if your IP address changes.
    After this, you will be prompted for a new admin password with at least eight
    characters. Finally, you need to go to the start page, which lists different categories
    for configuring options (Figure 2).


    The recommended approach is to click System update after completing the initial
    installation. The software then needs to be refreshed and listed. You can do this
    by clicking Update all packages at the bottom of the page. The routine updates
    both the operating system and the list of available applications. After completing
    the update, click on the small home icon in the top left to return to the main
    window.


    After the update, create a user account with extended authorizations who will
    act as an administrator in the future and can be reached by email. Then configure
    your server to automatically send notifications to the administrator in case of
    problems or anomalies. You also need to create the users who will have access
    to the server applications.


    # Account Management


    To do this, select Users in the main menu and New in the dialog box that appears.
    This will take you to input the mask for creating new users. Based on the domain,
    YunoHost also creates email accounts. After closing the dialog box, press Save
    to open the settings for this window-by clicking the small arrow to the right
    of the user name.


    In the Mail field of the user display, select the address you wish to forward.
    To do this, press the blue button on the right to edit the account. Then Add a
    mail forward from the domain- and Save to save the entry.


    # Diagnostics


    When done, it is a good idea to run system diagnostics to find and fix potential
    problems. YunoHost runs diagnostics twice a day by default and the administrator
    is notified by email. You can also start manual diagnostics in the main menu and
    select Starting diagnostics. The server performs a comprehensive check of the
    system and after a few minutes displays the results in list form.


    Diagnostic without abnormalities are marked by green buttons of the respective
    group. Anomalies that do not affect the function of the system are marked with
    a yellow button. Red buttons indicate a problem in this that negatively affects
    the function. Each category with a warning or a detected problem has two additional
    buttons on the right side of the window: Clicking on Details will display details
    about the detected problem, while clicking on ignores YunoHost to


