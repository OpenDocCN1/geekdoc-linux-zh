    # Comparing


    You can use Restic to check or set the integrity of the folders. Use the --check
    parameter to check the index and contents of the specified repository (Listing
    2, line 4).


    To compare two or more snapshots, you need their identification numbers, which
    you can discover with the command from line 5 of Restoring. The ID numbers appear
    in a table below below, along with the


    # List 2: Checking Backups


    ```

    01 $ restic -r /path/to/repository --path /to/mount_point

    02 $ # --check compare repositories

    03 $ restic -r /path/to/repository --read-data

    04 $ restic -r /path/to/repository snapshots

    05 $ restic -r /path/to/repository snapshots Snapshot_ID Snapshot_ID _

    ```


