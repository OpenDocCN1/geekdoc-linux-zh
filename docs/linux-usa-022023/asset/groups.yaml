    # NEWS


    ## Linux News


    According to the developers, Orange Pi OS (Arch) (http://www.orangepi.org/software/PiOS/arch.html)
    will be easy to install, stable, highly secure, support multi-framework systems
    (such as x86, Arm, RISC-V), and will support a wide number of applications (including
    Code::Blocks, Gnome Blocks, Inkscape, Thunderbird, VLC, VS Code, NeChat, Remux
    and more).


    Orange Pi OS (Arch) will also support for most of the popular multimedia, multicore
    CPUs, command-line and GUI installation, and will be privacy and security conscious.


    For information on Orange Pi OS (Arch), check the official site for the operating
    (http://www.orangepi.org/software/PiOS/arch.html), where the team will continue
    to update and news as they happens.


