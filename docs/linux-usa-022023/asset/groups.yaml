    # 新闻


    在旧版本的 Spectre v2 (2018) 中并没有使用 IBRS。事后回来看，这可能是一个错误的决定，因为迫使人们使用了替代方案。


    间接限制推测（IBRS）是构建在某些 CPU 内部的一种硬件功能，用于应对近年来发现的如 Spectre 等安全漏洞。


    Peter 加入了与 Maria Joia 以及其他人的讨论，确定 GCC 补丁的修复方案，以及修复中其他部分的实现细节。讨论深入探讨了技术细节，在结束时，这些细节已变得清晰许多，不再那么令人困惑。


    IBRS 仅阻塞某些安全漏洞的利用，这些漏洞需要通过启用 "ibrs" 来防御。


    与所有绕过这些漏洞的尝试一样，总是存在权衡：例如，一种安全缓解措施可能是避免 CPU 特性的切切换，这意味着这些特性必须被实现。因此，直接接受硬件安全功能是一个显而易见的选择。内核开发者必须在每情况下评估成本。


    在某一点，Tim Chen 在内部性能基准测试中使用 Thomas 和 Peter 提供的“新”补丁，该补丁显著提升了性能。


    例如，Thomas 提到：“当时已经讨论过尝试解决基础深度调用……这只是 HEAD 的一种方法。”


    Linus 检查了这些问题并说：“这看起来显然比讨论他们的数字要好得多。”


    Thomas 继续探索了 IBRS 的特定方面，包括内存占用的增加和计数的错误，这些错误本身可能被攻击者利用。


    讨论大致在此结束，大家对投入大量精力重新适配（Refit）安全方法这一方面表现得非常积极。


    由于 IBRS 是一个性能问题，Peter 仅修订了调用深度跟踪方法并将其实现，这是非常有可能的，并且避免了原始方案的缺点，并意乎意外地取得了结果。


    这是一个持续的过程——最新的改进可能是每个人都会去改进的最坏情况。知道在源码世界中，我们可以实时捕捉缺陷，让所有日日夜工作的人来完善它，并追踪我们我们的一切。


    Thomas 和 David 讨论了一些技术细节，包括改进和减少 head 的方法。部分是针对 GNU 编译器（GCC）的补丁。Thomas 将这些总结为：“让调用在每个函数点处添加
    16 字节的填充，情况就很清晰了。调用易感区域存在疑问，并且减少了它。”


    在某一点，Torvlds 加入了讨论，并说：


    > “我更喜欢这个。”


    > “我们可以用‘this’来代替我们有的 SCALE 吗？”


    > “而且人们和那些通过简单地在代码中放置填充来避免额外时间的人。”


    对此回答道：“是的，Peter 和我是从新编译器的角度考虑在代码中放置填充是有开销的。当我们看到填充的数据时，我们的功能可能会受到影响。”


    他补充道：“这不需要新的编译器，并且避免了非受影响机器的所有开销。” Thomas 继续说道，在他们的方案中，消耗是这样的。


    ## 当触发恐慌（Panic）时


    Davidson 提交了 Linus Torvlds 拒绝的代码。David 显然的更改是那些在（5.8.0）中遇到的代码更新。这是一个似乎在检查路径特征、运行系统状态的变量，它是病态的。这种感觉是合理的：如果你的系统得到了帮助，你不应该被持续运行的属于你的东西所限制。


    然而，关于这段代码，Linus 回复道：“停止这样做。”他继续说道：


    “使用 `BUG_ON()` 进行调试简直是不可行的。”


    “说这只是一个 `VBUG_ON()` 并不会改变‘任何事情’。让我们让普通人面临这种不稳定性，它不是某种只属于某些人的事。”


    “我不认为这种情况会发生。老实说，我们 90% 现有的 `BUG_ON()` 都是完全的 bug，遗留部分无法删除是因为它们被触发了。”


    在服务器机器设置中，由于有 IT 部门进行更改，通常更倾向于让机器崩溃而不是继续运行。


    “`BUG_ON()` 真的不是为了调试的。”


    在这种情况下，一台死掉的机器就是一台死掉的机器，但你可以获取信息，而 `panic` 是恐慌，重启是令人兴奋的。”


    “停止它。”


    “如果你有一个绝对不能发生的条件，要么你写对应的代码，或者如果你确信它不会发生——你就写一个 `VBUG_ON()` 让人们可以报告它。”


    “而且，那实际上是一个错误的边界情况。像练习这样的事情会‘想要’避免不必要的学习，因为那是关键点。”


    “`BUG_ON()` 会导致机器死亡。”


    “虽然某种虚拟化自动化非常常见，而 bug 是个大问题，这意味着要虚拟化这个问题，并推到产生更多问题的程度。”


    “对于 Facebook 和这类世界来说，`WARN_ON()` 就足够了。”


    “如果你发现了一个离谱的 `BUG_ON()` 让我觉得‘行吧’，那实际上并不算，而且很久以前在调度器中确实有一个，我使用内核脚本修复了 `BUG_ON()`，而
    `VBUG_ON()` 和 `BUG_ON()` 基本上是没用的。”


    “但作为一种非常好的实践，规则是‘绝对不要 `BUG_ON`，因为它是危险的’。”


    “Undis 报告了，但我完全同意 `BUG_ON()`——如果我在全天事件中遇到它，并提出要求。”


    '
