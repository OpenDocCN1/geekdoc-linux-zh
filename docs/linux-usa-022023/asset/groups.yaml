    Torvalds 终于宣布了 Linux 内核最新的 LTS 版本（版本 6.1），以及 Rust 语言的初始支持（https://lkml.org/lkml/2022/12/11）。这当然紧随
    Torvalds 所谓的“地狱合并”之后，归功于假期和假期前的准备。此外，Torvalds 表示他将严格遵守合并规则，称：“规则是，合并期间发送给我的请求应该是就绪的……没有以前见过的最后实验性开发。”


    内核 6.1 的功能之一是包含 Rust 支持。重要的是，这还处于开发的早期阶段，因此其影响是在内核中对 Rust 进行基础性实现。内核 6.1 的大部分驱动工作由媒体蓝牙、HID、GPU
    等主导。这些工作可能会导致发现最新内核的一切内容，这应该是添加 Rust 驱动的一个非常重要的折点。


    ## Linux Mint 21.1 进入 Beta 阶段


    Mint 的开发者正式宣布即将发布的版本进入 Beta 阶段（https://linuxmint.com/?p=44）。重大意义在于 21.1 将包含 Cinnamon
