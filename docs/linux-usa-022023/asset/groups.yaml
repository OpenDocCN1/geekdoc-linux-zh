    # COVER STORY

    ## Synthing


    To add devices for data synchronization, press Add Device in the Remote Devices
    window. The software automatically searches the local network for devices with
    retrieval and displays them in an overlapping window (Figure 1). To integrate
    new devices, you will need to make sure that a Synthing instance is also running.
    Clicking on the device integrates the remote devices with the local system. Since
    the device is not shown, it may sense to assign a meaningful device name in the
    input. Otherwise, the software will show you the device name that it uses on the
    network.


    Data synchronization by integrating the remote systems into the local installation
    as distribution devices. In the Advanced tab, you can also specify whether Synthing
    connects the data and what transfer limits apply to incoming and outgoing connections.


    TheThe Sharing and Advanced tabs contain additional settings. For example, you
    can opt for unidirectional or bidirectional.


    After completing, press Save bottom. On the remote device, a message will appear
    in the Synthing window pointing to a connection attempt and prompting you to add
    the system by pressing Add Device. After short time after the connection, both
    devices will show the newly connected system, with the device name and connection
    status.


    ## Sharing Folders


    To add folders to the system for synchronization, click Add Folder in the Fields
    tab of the folder window. In the dialog, enter a name for the folder to synthing
    and specify its path. In the Sharing tab, you can also specify the LAN devices
    on which you want to share the folder. The connected devices are listed in a table.
    To enable one device, check the box next to the list item.


    In the Versioning tab, you can specify whether or not to create multiple chronological
    versions of the same folder. The Versioning field gives you a choice between different
    versioning modes, and you can choose the configuration for this in a supplementary
    dialog. The Ignore pattern tab allows you to specify which file types you want
    the software to ignore during synchronization. The final tab, Advanced, is where
    to define the scan intervals.


    After completing configuration, press Save. On the device with which you want
    to synchronize the folder, you will be prompted in the browser whether you want
    to let Synthing the new folder. If not, an error dialog box appears and prompts
    you for the path.


    As soon as in one of the shared folders, the application synchronizes the data
    between the computers. A click on the directory in the browser window opens a
    menu showing the software''s actions. This summary includes the data transferred
    and the total amount of data transferred (Figure 2).


    ## A Word of Caution: Outdated GTK Front End


    A GTK front for Synthing has been around for a long time (Figure 3). You will
    find it, with approximately the same version number, in the repositories of various
    distributions. Unfortunately, this end has not been properly maintained over three
    years. Some restrictions apply to operations due to incompatibility with a number
    of dependencies. The GTK end could be installed and started, but without full
    functionality. My recommendation is to opt for the web interface and avoid this
    GTK front end.


    If you connect multiple devices to Synthing, unavailable devices will also appear
    in the list and will be shown as Disconnected. If the system rebooting, it automatically
    connects to Synthing and the internet. Synthing then reports any changes you fetched.
    The status indicators in the web browser you track the tool''s visuals.


    ## Conclusions


    Synthing helps you keep your personal data in sync across several different devices
    on your local network. Since software works in peer-to-peer mode, it does not
    require a dedicated server or cloud service, you only need the web interface for
    configuration changes (the "A Word of Caution: Outdated GTK Front End" box). Also,
    told, Synthing is a great solution for anyone wanting to synchronize data across
    multiple platforms and devices.


