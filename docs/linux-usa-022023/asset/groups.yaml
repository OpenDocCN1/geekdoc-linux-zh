    ## Graphical Backup Tools


    When you get there, you can complete the configuration of the tool in several
    tabs, defining different profiles for different tasks. You can add a new profile,
    in addition to the current Default profile, by pressing the button with the plus
    sign next to the profile selection. The new profile is then displayed, allowing
    you to configure the settings (Figure 11).


    In the Repository tab, first specify where Vorta will store the backups. You can
    also use online storage; specify the access method for the selected repository;
    data transfer always takes place via secure SSH connection. You can also define
    a compression method in this dialog to reduce the transfer volume. You have a
    choice of several compression methods, or can save the data without compression.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_24_0.png)


    Figure 11: In Vorta, you first need to create a profile in the wizard.


    ![](img/40e16ea65dca8020192f55b66e49c7d3_24_1.png)


    Figure 12: Vorta can also check the integrity of file archives on demand.


    ## COVER STORY


    ## Graphical Backup Tools


    Sources tab, select the datasets you want to back up. You can include or exclude
    files and directories. Wildcards are supported.


    The Schedule tab lets you schedule backups, which means you can create automatic
    backups at specified times. You can also specify a period of time during which
    your backup will validate the existing repository. This validation prevents the
    data from accidentally enrolling in a corrupt archive and becoming unusable.


    The Archive and Misc tabs grant access to general settings that might require
    any input or operations. After completing the configuration, make an initial backup
    by clicking Start in the program. Repository tab displays various statistics during
    the backup. After the backup is complete, you can see the original and compressed
    set. Verify the data in the Archives tab by selecting the archive in the list
    and then clicking Check. The tool checks the archive and displays results (Figure
    1).


    Vault does not create a full backup each time it is saved, only the differences
    from the original in the subsequent backups. To find the differences between individual
    backups, select the backup in the repository and then click the Diff button. The
    application will show you the root directories where the directory tree differs,
    including files and sizes.


    To keep the list of existing archives getting out of hand, you can then click
    the Prune and Archive naming tab. In the settings dialog, specify the number of
