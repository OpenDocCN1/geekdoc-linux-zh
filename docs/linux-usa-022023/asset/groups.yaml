    working in Xonsh rather than a standard Bash Shell (Figure 1). When the shell
    start up, two options are presented: xconfig which opens the help window, and
    xconfig which allows users to tweak the convex shell configuration.


    Within the Xonsh shell, you can see both Bash and Python state, such as:


    ```

    ```

    # Mix Bash and Python

    echo "Time is: $(date +NT)"

    ```

    ```


