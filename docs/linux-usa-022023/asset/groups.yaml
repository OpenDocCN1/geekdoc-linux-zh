    Jan Engelhardt remarked, "So how many benchmarks do a 32-bit userspace with a
    32-bit kernel win over 64-bit users?'' To Adam replied, ''Like none or almost
    none.''


    However, Adam went to say: "What we want is people to run 64-bit kernel, there
