    #  1 Log in


    By default, your RaspAP installation has an IP address assigned by DHCP. Connect
    to your router to determine its IP address then open a web browser and navigate
    to the IP address. Log in with username ''admin'' and password ''secret''.


    #  2 Configure the SSID


    Click on Hotspot on the sidebar and use the options within the Basic, Security,
    Advanced and Logging to configure the SSID you want. Change the default value
    for the PSK (Pre-Shared Key) and cannot be easily changed.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_38_2.png)


