    # ### Better codecs please


    Bluetooth 5.2 introduced a new standard for low energy communications, Codec,
    or LC3. It uses advances in codec development to offer higher audio quality by
    reduced amounts of transmission volume. Tests by Bluetooth revealed that a 160kbps
    LC3 provides quality superior to a 32kbps based on the legacy encoding format.


    Reducing transmission reduces the energy consumed by up to three times for stereo,
    where non-connected headphones can receive separate streams using only the output
    information intended for them.


    Intelligently, there was a breakthrough when Bluetooth 5.2 introduced LC3 - https://bly.com/ltfx32codecs
    provides an overiew. With paired headphones, the interactive demo at https://bly.com/ltfx32demo
    shows performance evaluation of sound quality by Thomas Steven. Finally, the code
    documentation at https://bly.com/ltfx32lc3 is a worth reading.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_63_1.png)


    and replaces it with a new system called Isochronous Channels adds an additional
    layer to the wireless audio stack that is reliable for data synchronization. It
    breaks up both time and clock into slots called LC3 intervals. During each interval,
    the source is sent to the pack, which prevents interference of multiple signals
    and leads to a significant reduction in audio latency. Bluetooth audio is said
    to work with latency up to 200ms, while most pairs keep latencies below 30ms.
    With LE audio, this


    Additionally, this enables data stream redundancy. A new Bluetooth headset can
    send one stream to each ear, eliminating the latency found in A2DP mode.


    Finally, the data in a Bluetooth audio stream comes with an expectation. Packages
    can be discarded automatically, ensuring no lost packets waste the airtime.


    # ### Multicast broadcast


    Students of Bluetooth know the difference between CEP and LDP. Synchronous access
    guaranteed delivery for the one-to-many broadcast, enabling higher efficiency
    and lower latency.


    In the case of multicast, two streams are used. A Connected Isochronous Stream,
    or CIS, creates a point-to-point connection between the audio source and a sink.
    The source transmits information to one receiver - in the case of headphones with
    separate ears, two CIS streams are required. The Bluetooth


