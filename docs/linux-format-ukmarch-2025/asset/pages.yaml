  md: "# ADMINISTERIA\n\n# Create quick, simple repeatable playbooks\n\nEveryone likes\
    \ to say that Stuart Burns is an Ansible man and that's nothing to do with his\
    \ faster-than-light communication.\n\ne-big Ansible Fans. It makes life easy when\
    \ managing a PC. The problem is, there are lots to learn; so, let's come over\
    \ some Ansible scripts that don't require lots of immediate learning but can grow\
    \ in it by step.\n\nAnsible is an open source automation tool, widely known for\
    \ managing infrastructure. By defining tasks in the form of YAML files, Ansible\
    \ executes them over ssh automating tasks such as installing software, configuring\
    \ services and more. It makes sure everything is exactly as you want, and reduces\
    \ errors.\n\nBut it is not limited to managing remote servers. You can use Ansible\
    \ to configure your local machine and streamline mundane tasks, keeping servers\
    \ consistent. It makes sure everything exactly as you want, the same time. What\
    \ advantages does it have? It's all down to declarative versus imperative...\n\
    \nBash scripts are imperative; tell the computer exactly how to do something by\
    \ step.\n\nAnsible is declarative. You tell it what you want the state of and\
    \ it figures out how to do it. If something is already in state, it does nothing.\
    \ This eliminates a lot of effort and reduces errors.\n\nAnsible is idempotent,\
    \ which means that no how many times you run your playbook, the result is always\
    \ the same. This is a huge plus for consistency, and you don't have to worry about\
    \ messing things up by running the same script multiple times. And unlike bash\
    \ loops and complex syntax, Ansible uses a straightforward\n\nYAML format to declare\
    \ what you want, not the how. It makes it easier to read and write maintain.\n\
    \nBefore starting, you'll need to install Ansible. We're doing this on our local\
    \ Ubuntu workstation.\n\n```\nsudo apt install ansible -y\n```\n\nThe Heart of\
    \ Ansible is a YAML file that defines the tasks you want to execute. It is a simple\
    \ file with a list of actions. A basic example is to install a set of packages,\
    \ set up environment variables, and configure few settings.\n\n# Set up your develop\n\
    \nImagine you want to set up a Python environment quickly. Using Python and a\
    \ couple of useful packages like git and In Bash, a script might look like this:\n\
    \n```\n#!/bin/bash\n```\n\nAn Ansible playbook would look like this:\n\n```\n\
    - name: Set up Python Development Environment\nhosts: localhost\ntasks:\n- name:\
    \ Ensure Git is installed\n  apt:\n    name: git\n    state: present\n- name:\
    \ Ensure curl is installed\n  apt:\n    name: curl\n    state: present\n- name:\
    \ Ensure http is installed\n  apt:\n    name: http\n    state: present\n```\n\n\
    # RSYNC TIME-KEEPING\n\nWe all know what rsync is. However, when doing a copy\
    \ of FTP, the lack of any idea of how long it takes to complete. We just thought\
    \ it was one of those things to put up with until recently there was a new switch\
    \ added to rsync that made an educated guess about the length of time copy times.\n\
    \nThe switch in rsync is --progress which gives us an estimate of the duration\
    \ of the rsync operation. It's really useful and something we think should be\
    \ included in the standard output.\n\nFor a simple rsync command, use the following\
    \ as an example:\n# rsync -av admin@media:/content/backup\n\nHere we list the\
    \ tasks you want to perform - installing packages in this case. The tasks are\
    \ the core of everything. Every 'command' is a task: this is an Ansible module\
    \ that interacts with the package manager (we're on Ubuntu/Debian). The state:\
    \ present lines the package is installed. To install the playbook, use ansible-playbook:\n\
    # ansible-playbook -K myplaybook.yml"
