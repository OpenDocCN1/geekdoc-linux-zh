    Raspberry Pi. Using an Ethernet cable, connect the Pi to a network that has internet
    access.


    Recall that we will SSH through the service to build it. Let’s use a command-line
    terminal on the host to connect to the Pi and complete the setup.


    One connection for the SSH protocol is to use the Pi''s IP: `ssh@<ip address>`.
