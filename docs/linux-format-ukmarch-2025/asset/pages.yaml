    # SteamOS rolls out to third-party devices


    Valve SteamOS goes beyond the Steam Deck As Lenovo unveils the Legion S, the first
    third-party handheld licensed to the OS.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_5_0.png)


    Early this year, LXF reported on Valve updating its branding guidelines, including
    a ‘Power by SteamOS’ logo. This led to speculation that non-Valve devices might
    soon be able to work with the Linux-based operating system. This rumour has come
    from Lenovo’s announcement at CES 2023 regarding its new Legion S, the first handheld
    officially licensed with SteamOS pre-installed. Valve has confirmed that the implementation
    of the OS on Lenovo is exactly the same as for its own Steam Deck.


    Lenovo’s gaming device is slated for release in May 2023. There will be two versions,
    which will run Windows and the other SteamOS. The SteamOS version will be $100
    to $499.99. It will feature the AMD Ryzen Z2 chip, 16GB of LPDDR5 and stands up
    against the Steam Deck.


    such as the ASUS ROG Ally to be likely candidates. Game gamers have already had
    great success installing the custom Linux OS Bazzite on the handheld. Built on
    Fedora instead of Arch Linux, it comes with the same interface as SteamOS.


    Bazzite also runs on existing Lenovo Legion Go handhelds; it’s unlikely to be
    pre-installed on third-party devices. This is due to SteamOS licensing terms,
    which require companies to sign a partnership agreement with Valve before selling
    devices using the Steam system.


    > Above: There will be two models of the Legion Go S. One will come with Windows
    11 and the other with SteamOS.


    The Linux-based Bazzite can be installed on ASUS ROG Ally and Lenovo Go handheld
    without issues.


    This marks the first time wider SteamOS has entered the gaming community. After
    the CES, Liam Daame of Linux posted an article expressing his hopes that this
    will result in better hardware compatibility for the operating system.


    This issue has plagued gamers for years: the operating system’s relatively small
    market share have little incentive to create cross-platform anti-cheat systems.
    This has resulted in SteamOS being unable to play popular titles like Fortnite
    natively on the OS.


    In an interview with the Verge, Steam Deck lead also revealed that a beta version
    of SteamOS for third-party handhelds is scheduled for release in March 2025.


    If Graphics decides to specify which handhelds will be supported, popular devices


    The popularity of SteamOS on other handhelds, of course, will come to compatibility
    with existing hardware, as well as specifications.


