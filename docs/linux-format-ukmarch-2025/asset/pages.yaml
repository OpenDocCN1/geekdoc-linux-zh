    # RUST


    # # Rust: How to start coding your first apps


    David Bolton introduces Rust programming by setting it up running and debugging
    a program to analyse text.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_93_0.png)


    is the first in a series of tutorials learning Rust. Instead of writing about
    language, this will have a more practical bent, with useful programs and then
    explaining the features of Rust that they use.


    The first program is one that reads a text file and calculates the average line
    index (https://bit.ly/lt325index). This is not the most complex task but it has
    one or two interesting points. Let''s divide the task into a series of smaller
    sub-tasks:


    +   1. Read text from a file.

    2. Process the text so we can identify how many sentences there are and the average
    length of each sentence. Calculate the average length: number of words/the number
    of sentences.

    3. Count the number of complex words, where complex is defined as having three
    or more syllables. This will exclude proper nouns, family jargon or compound words.

    4. Add sentence length and the percentage of complex words.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_93_1.png)


