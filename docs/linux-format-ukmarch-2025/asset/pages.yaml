    current version: rust 1.68.2-72440775,amd64. Our preference is the non-snap version
    as it''s easily up to date.


    # Getting started with Rust


    First work will be about installing Rust and our new app will be called First.
    We will run all our apps in a folder called Rust but you can also run them as
    anything. Cargo creates a new folder and our starting point is the first-rust
    home. We will use VS Code for Rust. When you use cargo, it''s easy to run it outside
    VS Code, but you can run it in a VS Code terminal. The command:


    ```

    $ cargo new first

    ```


    Open VS Code with the full stop (period) keeps the current folder in VS Code.


    # Debugging extension


    Before to run or debug the app, we need to install debugging CodeLLDB. Click


    on the fifth icon on the left-hand side and type CodeLLDB to search the box, then
    and run Extensions. You should select one or two extensions: the one with the
    first name is CodeLLDB. The other is the extension already installed.


    The code cargo new creates a Hello World example. We will then run it and debug
    to show that it''s all correct, writing the main.rs.


    Complete with Terminal -> Run Build Task. Click


    on the top menu, then you cannot start debugging without launch configuration.
    If there is no launch configuration provided, select the option of generating
    launch configurations on cargo.toml. Click Yes and it generates a launch.json
    in a hidden folder .vscode.


    If you have already tried it, or try to run it again, the app will appear to generate
    the correct code.


