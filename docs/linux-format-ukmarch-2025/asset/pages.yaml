  md: '# Filter your traffic


    You don''t want anyone to be able to access everything...


    here''s a couple of open solutions available that can be used to block ads and
    other categories of sites or services that we may not want from our homes. In
    Pi-hole, it is easy to install and configure. However, this section of the article
    will focus on NextDNS. NextDNS is a DNS over HTTPS (DoH) service, which can be
    used to filter DNS for a huge range of things. It can block ads, trackers and
    newly many other devices, which are often hosted on cloud, and we can also block
    gaming, social media and lots of other categories.

    NextDNS offers a free tier, which could cover most single-device users, and its
    paid-offers are priced reasonably, most of its features are supported by any router
    that sets an upstream DNS provider, meaning that our networks can be protected.
    If you can''t configure your router, we can configure each client, which will
    respond to DNS queries from your devices and filter them via NextDNS''s DoH service.

    So, let''s take a little more about NextDNS. Multiple profiles can be managed
    from a web portal and easily. Each profile can have its own settings and can be
    used by different devices. For example, you could have a profile configured for
    your kids, which is restricted in what is allowed, tracking, gaming and many other
    things disabled. By contrast, another profile does not block gaming and is used
    by all the adults.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_36_0.png)


    Let''s set up now, and get started. Open your web browser, navigate to www.nextdns.io
    and click on It Now. This is excellent, because you don''t need to provide any
    information to get started. There is no need to sign up for an account. If you
    like it, you can then easily sign up for an account:


    When you are logged into the profile configuration page you will see a unique
    alphanumeric code, which is used to identify it and associate all filtering settings.
    In the Setup tab, you will see information relating to the profile and its settings.
    We will investigate how to configure Android and Linux devices, as well as setting
    up the native client, which is used to provide the service with details of device
    name and IP address, which is useful for troubleshooting, especially when the
    service is used by an entire household/network.


    Spend some time looking at the other tabs, especially through Parental Control,
    and switching on and off the features you don''t want to use. If there are some
    DNS entries you want to allow or block, enter them in the Allow and Deny List
    tabs. The logs show you all the DNS traffic that NextDNS has replies to and can
    be used for troubleshooting. The settings tab allow you to name your profile and
    set various options. With this tab you can also set up profile with other users.
    Once your profile is set up, how do we use it?


    # Android devices


    To configure your device, open up the Settings and screen for Android devices.
    Open up the


    > IPv4 ADDRESS


    NextDNS provides servers that allow access via IPv4, this is the only one you
    use. This is linked to the Linked IP feature, where you can add your external
    IP address, then anything from it is associated to the associated profile.


    If you want to configure the network on the device you use, navigate to NextDNS
    and the Setup tab, find the Linked IP section. Hit Link IP to register your external
    IP against this.

    Now navigate to the network settings on your device - this is where you enter
    the Linux system and IPv4 settings and change the DNS address to set on the Linked
    IP address of NextDNS''s profile setup.


    If your external IP address changes, which is likely with a lot of home ISPs,
