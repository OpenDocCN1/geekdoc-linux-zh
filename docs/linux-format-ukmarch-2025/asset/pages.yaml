    they can be recovered.


    Most files don''t stay in the trash, but you can get the latest version from the
    Homebrew repo. Run `brew install rm` to install the latest version of rm.


    The first time you use rm, it creates a configuration file -/.config/rm and a
    default file. You can use rm to delete any file, just as you would with regular
    rm.


    Instead of permanently deleting the file, however rm moves the deleted file to
    the waste basket.

    When you use rm recursively to delete a directory, as it does


    By default, rm to Waste tool is a must-have for anyone who has used rm to accidentally
    delete the wrong files.


    Files can also be restored from the trash using rm -r. A better option is to restore
    the last deleted file. In interactive mode, use rm -i. This lists all of the deleted
    files and lets you select the one you want to restore, and Enter place them back
    in their original location. The tool is


    By default, rm never empties the contents of the waste basket. To override this
