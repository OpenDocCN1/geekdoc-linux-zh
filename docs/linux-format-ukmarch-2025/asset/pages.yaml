    (£6.3 billion) annually to open source projects. This is one of the key findings
    of the 2021 Open Source Funding Report. The report itself is based on the Open
    Source Software Survey, conducted by GitHub, Linux and Harvard Universities each
    year. The gathered information from 501 respondents around 159 organisations represents
    a total of $17 billion in open source contributions, from which the details of
    $7.7 billion were calculated. The methodology used notes that 86% of contribution
