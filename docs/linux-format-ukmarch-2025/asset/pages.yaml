    to secure remote access. For example, you should use a jump host so the external
    address does not allow access to your internal network. Ensure different credentials
    differ between devices, or compromising one device automatically compromises others.
    Also ensure that you use authentication with SSH, and if you store the keys on
    the device, use passwordless access.


