  md: '# Remote access


    Discover how to access your home from elsewhere.


    We''ve all wanted to access resources outside of our home. There''s a number of
    ways to do this, with different levels of security and complexity. Do you really
    need to do it? If the answer is no, or for very rare cases, it''s best not to
    do it. If access is needed for such as home automation, or out of preference,
    it is better to use a VPN or service of your preference.


    Your ISP will give you an IP address and your router gives each device connects
    to an internal IP address. Your router is the security boundary between the outside
    world and your home network. Any configuration to your router should be carefully
    considered and there should be minimal changes made.


    Other complications are that residential subscriptions have dynamic IP addresses,
    meaning that they change every often, which could affect your remote access. Some
    ISPs also have terms of service that prevent the running of VPNs and so on.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_35_0.png)


    # Warnings!


    The easiest way to access a external service is to forward your port from your
    router external address to an internal address. This is fraught with danger, as
    having direct access is exposed. If that device can access the rest of the network,
    then your whole network is compromised. This method could be used but shouldn''t
    be used to access any running network or only on port forwarding to grant dynamic
    IP addresses, particularly if you have with a dynamic DNS provider, whenever your
    external address changes periodically.


