    holds names and IP addresses. You may use the hostname assigned during the configuration
    for this work. From the command line, enter:


    ```

    sudo apt update && sudo apt upgrade

    ```


    Assuming the connection is on the same network as the Pi, a new connection warning
    should appear before entering the password to complete the connection. Now that
    we have a connection, let''s ensure the operating system is to date before proceeding:


    If you wish to update the Pi''s configuration, use raspi-config on the command
