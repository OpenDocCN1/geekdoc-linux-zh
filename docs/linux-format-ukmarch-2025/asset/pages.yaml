    # WI-FI ROUTER


    # Upgrade it: Get a faster Wi-Fi router


    It''s been a long time since 802.11n was released and a lot has happened since
    then – Neil Mohr has started to go for starters.


    Eight months ago, we took a look at the brand-new-Wi-Fi 7 technology. Here we
    are in 2025, and it''s only now becoming viable, with Wi-Fi 6 still very much
    available, with mesh things thrown in for added content.


    With Wi-Fi 7 systems costing as much as £1,000, knowing what you need from a wireless
    system has become crucial. We''re going to go over the differences between the
    standards and then look at how you can get a little more performance out of whatever
    router you''re using.


    First, what is Wi-Fi 7? After we''d had 802.11ac, and then ax, the IEEE group
    decided that switching to numbers would make things simpler for the public. So,
    802.11n was Wi-Fi 4, 802.11ac was Wi-Fi 5 and ax is an industry that bridged the
    gap. Very often, after waiting for the IEEE to be released, it could be said that
    2.4GHz and 5GHz bands were available for Wi-Fi 6, but Wi-Fi 7 adds a third band
    to 6GHz.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_69_0.png)


    OUR EXPERT

    Neil Mohr doesn''t let go of the office, so he needs a fast wireless connection,
    Wi-Fi 7 is what this children keep telling him...


    # Key points for Wi-Fi 7


    +   **4096-QAM:** This is the amplitude modulation. Wi-Fi 6 is capable of 1024-QAM,
    so there is an increase of 20% from 10 to 12-bit.


    +   **Non-continuous bandwidth:** Wi-Fi 7 can utilise different channel bands
    (previous standards had to use bandwidth of the same size), such as 160-800MHz,
    which is more likely than 160+160MHz.


    +   **Multink operation:** Wi-Fi 7 is able to transmit across the bands simultaneously
    so it uses the 2.4GHz, 5GHz and 6GHz bands for the same signal


    +   **Multiple input and multiple output:** A way to use multiple antennas at
    the same time – up to 16 (Wi-Fi 6 uses up to 8), though more than three are rarely
    seen on standard tri-band routers.


    +   **Multi-RU:** A fancy term for a Wi-Fi 7 feature that is about managing the
    available channels better, attempting to gauge how much bandwidth


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_69_1.png)


    Careful configuration of your wireless network can provide more security and speed


    device needs, where the interface is, and allocating the best channels to accommodate
    that.


    **Beamforming:** Deployed on Wi-Fi 5, this is a clever technique to direct the
    signal over multiple antennas to focus on the specific device. This works increasingly
    better with time.


    Some of these features, such as beamforming and multitasking, provide quality-of-service.
    In busy environments, they provide more reliable connections, which will be worth
    the effort of things to manage and not in general home environments over over-loads.
    So, even dual-band (2.4GHz and 5GHz) routers are better than Wi-Fi 6, but Wi-Fi
    7 is technically capable of 46Gbps by 200MHz and 6GHz bands. The more reasonable
    800MHz mode would still manage 33Gbps, a breath twice as fast as'
