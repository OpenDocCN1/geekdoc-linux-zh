    Each Xe core has 8 vector units and 8 XMX units. That''s half the count for Alchemist,
    but each unit has 2,048 and 2,048 matrix instructions. In practice, the total
    number of vector or matrix instructions executed per core remains: 256 FP32 or
    FP16/INT4 1096 instructions.


    Boost clocks by core gives us the total theoretical compute, but here where things
    get interesting: the new architecture provides much more TFLOPS. While the B850
    ''only'' offers 14.6 TFLOPS, the Xe 2 has 17.2 TFLOPS, however architectural changes
    play a role.


    One of the big changes is a switch to SIMD-512 units being single instruction
    multiple data, with the benefit of concurrent data operated. While Alchemist worked
    on chunks of 32 (typically pixels), SIMD only used 16 units. This improves GPU
    utilization, as it''s easier to fill 16 slots than 32. Battlemage do much better
    performance per TFLOPS than Alchemist.


    We saw with Lunar Lake''s performance that the new Xe 2 architecture in Lunar
    Lake has up to 4.0 TFLOPS FP32, while the older architecture in Meteor Lake has
    4.6, but Lunar Lake ended up 42% faster at 7200p and 32% faster at 10800p. Other
    factors are at play, including memory bandwidth,...


