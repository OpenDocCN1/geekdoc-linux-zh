    > If you are curious and fascinated by space, you can use the KStars digital planetarium
    to stargaze. This app has details of our cosmic neighbourhood including all planets,
    the sun and moon. You can also use it to track over 100 million stars, deep-space
    objects, comets, nebulae and supernovae.


    Although it is part of the KDE environment, the app is officially distributed
    as a Flatpak and can be installed easily using flatpak install github


    The first time you launch the app, it pops up a brief startup wizard that prompts
    you to select the closest city to your home. Then you can explore the night sky.
    You can also download extra data at this point, or later on from the File menu.


    You can pan the display using the arrow keys, or by clicking with the mouse. You
    can also use the + - keys or the mouse wheel to zoom in and out. As you zoom in,
    you can see fainter and


    other celestial objects such as asteroids, clusters, nebulae and galaxies.


    Clicking on an object in the status bar, double-clicks centers the object and
    begins tracking. Each object also has a context-sensitive pop menu that displays
    specific information and alone. You also get links to related web pages with more
    details, as well as images taken by the Hubble Telescope and other observatories.


    One interesting you might like to explore is What''s Tonight under the Tools menu,
    which summarizes the objects you can see from your location on today.


