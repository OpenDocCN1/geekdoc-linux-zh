    # >> A REFERENCE TO : MOUNT CONFIGURATION


    We received a query about mounting devices, here are a few points. First, of the
    filesystem is determined by the mount points ownership. For Linux filesystems,
    it is held in the filesystem itself, except for the mount point where the filesystem
    is mounted. It sets in the root of the filesystem. This doesn''t


    apply to fstab; you specify user and group ownership of the filesystem in the
    mount options, using numeric IDs. Each include these in the first field of the
    line of fstab or when using a mount command, such as:


    ```

    /dev/sdb1/somewhere

    uid=1000,gid=1000

    ```


    The first option often only defaults, but you can replace this with other options.
    Using noauto prevents the filesystem from being remounted automatically after
    each access that happens. Unless you need this information, the option can give
    a slight


    performance increase. Two options, users and users, allow normal users to mount
    and unmount the filesystem. The difference is that only the user who mounted the
    filesystem can unmount it. With users anyone can usually unmount it unless combined
    with noauto, which prevents the filesystem from being mounted automatically, or
    at boot time.


