    ```

    $ sudo gdisk /dev/sdb

    ```


    Press p to see the partition table - you should see partition 9. Press 7 to apply
    the resize command to it. The partitions are in the order that they appear on
    the disk. If you are unaligned, it will start at the sector. Press 1 to finish
