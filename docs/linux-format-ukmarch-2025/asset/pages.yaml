  md: '# TUTORIAL Control model trains


    VNC enables us to control the Pi from another device. VNC uses a client/server
    model. The device running the VNC client sends keyboard and mouse communication
    to the server. The server returns updates to the client.


    The Pi VNC server software installed. It needs to be enabled, so use the raspberry-config
    tool to enable the VNC service via the Interface menu.


    The remote device we use to access the Pi needs VNC client software. TigerVNC
    and RealVNC are just three client packages available.


    Find and install a VNC tool that meets your needs. For this project RealVNC was
    used only because we were already familiar with it. Use the installed client to
    connect to the Raspberry Pi.


    RealVNC viewer requires software to operate. A Java 11 version requirement exists
    for version 5.9, which is the current version.


    For Java, go to oracle.com, select Download Now (upper-right). On the download
    page, set the following settings: Operating System: Linux; Architecture: ARM (64-bit);
    Java Package: JDK. Once the selection is complete, select the latest release and
    download to start the process.


    To ensure a valid installation, verify that the checksum of the downloaded files
    matches the checksum provided on the download page. Use a terminal window and
    verify to install the software (the version to update):


    The download provides the correct checksum. Now install the Java software by using:

    sudo apt install openjdk-11-jdk


    By verifying the installation using java -version in a terminal window, you should
    see an output like: On my machine, the installed version is openjdk 11.0.22-0-17-LTS


    A reboot of the Pi, although unnecessary, is best practice. It provides some peace
    of mind. After making changes, check the reference manual to determine if there
    was an issue that wasn''t there before.


    With Java in place, download the JMI software from JMI/IMR/releases:\https://github.com/jpi/JMI/releases/download/v5.8/Rbc2c2ce7.gz


    JMI has a team that requires development privileges to run. The version used is
    5.8. A sha256 checksum is provided to verify the installation. You can find the
    checksum at the JMI download link. After verifying the link, install the software:


    ```

    tar -xvf jmi-v5.8-Rbc2c2ce7.tar.gz

    ```


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_49_0.png)


    If you see an arrow like:


    > C --attributes tail the tar command in the home directory of the current user
    (pi). Location configurations as the user installed JMI in their root directory.
    You can move JMI to another directory if you require the following:


    With the JMI installed, let an add-on to the Pi desktop menu. This will allow
    you to start the program. Using your favorite text editor, create the following:


    ```

    [Desktop Entry]

    Type=Application

    Encoding-UTF-8

    Name=Panel-Pro

    ```


    ```

    Comment=JMI Panel Pro

    Icon=/home/pi/JMI/PanelPro.png

    Exec=/home/pi/JMI/PanelPro

    Categories=Utility

    GenericName=Generic-PanelPro

    Terminal=false

    ```


    Make the file executable with the command:


    ```

    chmod +x ~/Desktop/PanelPro.desktop

    ```


    And create a symbolic link so the program to the other directory of the Raspberry
    Pi program:


    ```

    ln -s ~/Desktop/PanelPro.desktop /local/share/applications/PanelPro.desktop

