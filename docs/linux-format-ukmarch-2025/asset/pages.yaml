  md: "# TUTORIALS Open mapping\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_59_0.png)\n\
    \n(github.com/marceloprates/prettymaps), a small Python program, by connecting\
    \ other Python libraries, makes the creation of highly decorative precise maps\
    \ like the one shown (previous page) breeze.\n\n# Custom OSM maps\n\nThe share-out\
    \ map in the main OSM website includes an option to generate HTML code that anyone\
    \ can copy and paste in any webpage to embed in any part of the map.\n\nAs easy\
    \ as it is, this has the obvious limit that it follows only the map and nothing\
    \ else - that is, no other generic data that you want map on top of the map. Generic\
    \ is the word - what the basic functionality on the OSM website provides possibility\
    \ to show the stuff that you might have no map geographic data; or, no matter\
    \ how important it might be for some people, it is enough that it should be added\
    \ to the map - a map that evolves over time.\n\nAs an example, some people might\
    \ want to map all the places they visited in their journey, or map all their customers\
    \ on their map. Even if these are perfect estimates, for obvious reasons must\
    \ never last the map.\n\nThe solution for the problem is to use OSM Editor provided\
    \ by the OSM community at https://www.openstreetmap.org/edit. You can, without\
    \ altering the OSM database in any way, select part of the map, and edit it on\
    \ place with all the data you want, and get the HTML code that you can embed in\
    \ your website.\n      The OSM Editor online interface is similar to that of ID\
    \ (see JXF3), in that it lets you add layers, polygons and points of interest\
    \ (again, without adding them to the\n\nSimilar to Mapbox, you generate OSM maps\
    \ with icons, can be embedded in any web page\n\ntoo many layers easily, just\
    \ remove them, and try again.\n      After the upload, it is still possible to\
    \ add notes to your atlases with the Places online tool. more importantly, the\
    \ website enables you to see and download the areas that other people have, to\
    \ build on their work rather than duplicate it.\n\n# Maps as decorations\n\nMaps\
    \ are so beautiful and useful, they don't need to be a sidekick. They are also\
    \ a great addition to documents of any kind, from university papers to concert\
    \ posters, and can enrich any object (such as giving your a T-shirt decorated\
    \ with the location of your first kiss marked on a map of OSM). Great tool for\
    \ this kind of project is prettymaps\n\n# » MAP MAPPER\n\nYou already know that\
    \ thanks to its open license, the OSM database is freely editable in any way and\
    \ for almost any purpose you may conceive, by itself or combined with any other\
    \ kind of data (if their license allow it, or course). Scholars or enthusiasts\
    \ of history and architecture, could combine ancient maps with current OSM data\
    \ to show the exact location of archives, or how your city's layout has changed\
    \ over the centuries. In practice, for people without the skills or access to\
    \ online resources, this isn't as easy as you might hope, for a couple of reasons,\
    \ the first being that\n\ndigital versions of maps aren't easy.\n      The problem,\
    \ however, is that for lack of advanced tools and bunch of technical reasons we\
    \ won't go into, ancient maps have never looked exactly the same shape as the\
    \ OSM map of the same areas, so they can't be used as a base or reference for\
    \ mapping. Luckily, the Map Mapper website (https://mapmapper.net) solves both\
    \ problems, by collecting maps that are sometimes 'rectified' in the right way\
    \ to match the OSM data – and in all other cases available for experts who know\
    \ how to rectify them.\n\n+   Show Export Metadata Comments (0)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_59_1.png)\n\
    \nAl Map Mapper, you can combine historical maps by overlaying them, in ways that\
    \ makes them useful in OSM editors.\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_59_2.png)\n\
    \n60 LiF325 March 2025\n\nwww.linuxformat.com"
