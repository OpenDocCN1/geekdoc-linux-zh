    Isochronous Stream, Bis, can multicast transmissions to the UDP protocol known
    as TCP/IP networking stack. Unlike CIS, Bis connection-less; any receiver can
    hear the packets transmitted over the network and use them however


    into an unpolished data stream that does not lead to the amplification of ambient
    noise.


    In the case of many other Broadcast-related topics, Auracat is a trademark. It
    is licensed to Bis SIG certified devices that implement the Broadcast Profile
    (BBP) in need to make the Bis SIG certification can be quickly added up, especially
    for smaller companies.


    Bis streams are grouped into organizations. One group can hold up to 31 Bis, each
    of them is given an address of a standard length. The sent packets are tied to
    this reference, reference redundancy ensures that packages are synchronized.


    # Auracat Broadcast


