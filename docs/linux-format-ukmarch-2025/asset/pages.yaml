    \ the crate (registry) and run unit tests. The documentation will include the\
    \ Cargo book and how to run the tests tests.\n\n# What is a reference?\n\nWhat\
    \ is the difference between these two lines?\n\n```\nlet query2: &arg[1];nlet\
    \ string: &args[0];\n```\n\nThe first line creates a string and the reference\
    \ to argument[1]. The second one creates a reference to a string and binds argument[0]\
    \ to.\n\nIf you're from C++, you will be familiar with references. Rust's references\
    \ are similar to C++ pointers but look quite different. They are like pointers\
    \ that refer to a value in memory. They are also tied to the lifetime of the object.\
    \ If we don't use a reference, the object's value will be dropped when it goes\
    \ out of scope. Instead, we use a reference to that string value.\n\nIt's not\
    \ only efficient to pass a reference to a function but it also keeps the memory\
    \ free of the borrow checker. That for now, we'll come back to it in a future.\n\
