    in any way and for almost any purpose you may conceive, by itself or combined
    with any other kind of data (if their license allow it, or course). Scholars or
    enthusiasts of history and architecture, could combine ancient maps with current
    OSM data to show the exact location of archives, or how your city''s layout has
    changed over the centuries. In practice, for people without the skills or access
    to online resources, this isn''t as easy as you might hope, for a couple of reasons,
