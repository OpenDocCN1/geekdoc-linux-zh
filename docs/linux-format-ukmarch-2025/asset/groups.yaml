    ### 渲染切片 (Render Slice)


    原生 SIMD-512，全 4 深度 XMX


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_78_0.png)


    - 3 条传输流水线

    - 2 个三角形相交单元


    无序调度：在无过滤的情况下实现 2 倍吞吐量

    - 程序化开销


