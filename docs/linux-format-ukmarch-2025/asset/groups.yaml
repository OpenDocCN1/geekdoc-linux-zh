    # 新闻快报


    本期内容：Valve 的操作系统势头正盛 >> 开源财务 >> Ubuntu 的周末假期 >> RISC-V Roma III 准备就绪


    ## 操作系统


    ## SteamOS 推向第三方设备


    Valve 的 SteamOS 正在超越 Steam Deck 领域。随着联想发布 Legion S，这是首款获得该操作系统授权的第三方掌机电脑。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_5_0.png)


    今年早些时候，LXF 报道了 Valve 更新了其品牌准则，其中包括一个“由 SteamOS 提供”的标志。这导致了人们的推测，非 Valve 设备可能很快就能基于
    Linux 的操作系统。这一传闻源于联想在 2023 年 CES 上对其新新款 Legion S 的宣布，这是首款官方预装 SteamOS 授权的掌机电脑。Valve
    已经确认，该操作系统在联想设备上的实现与其自己的 Steam Deck 完全一致。


    联想的这款游戏设备计划于 2023 年 5 月发布。将有两个版本，分别运行 Windows 和另一个运行 SteamOS。SteamOS 版本的价格将在 $100
    到 $499.99 之间。它将配备 AMD Ryzen Z2 芯片、16GB LPDDR5 内存，并与 Steam Deck 竞争。


    诸如 ASUS ROG Ally 等设备可能是热门的候选者。游戏玩家已经在掌机上成功安装了自定义 Linux 操作系统 Bazzite 并取得了巨大成功。Bazzite
    基于 Fedora 而非 Arch Linux，拥有与 SteamOS 相同的界面。


    Bazzite 也可以运行在现有的联想 Legion Go 掌机上；它不太可能预装在第三方设备上。这是由于 SteamOS 的授权条款，该条款要求公司在销售使用
    Steam 系统的设备之前必须与 Valve 签署合作伙伴协议。


    > 上方：Legion Go S 将有两种型号。其中一个配备 Windows 11，另一个配备 SteamOS。


    基于 Linux 的 Bazzite 可以无障碍地安装在 ASUS ROG Ally 和联想 Go 掌机上。


    这标志着更广泛的 SteamOS 进入了游戏社区。在 CES 之后，Linux 的 Liam Daame 发表了一篇文章，希望这将为该操作系统带来更好的硬件兼容性。


    这个问题困扰了玩家多年：由于操作系统相对较小的市场份额，缺乏动力创建跨平台的反作弊系统。这导致 SteamOS 无法在操作系统上原生运行《堡垒之地》等热门游戏。


    在接受 Verge 采访时，Steam Deck 负责人还透露，针对第三方掌机的 SteamOS Beta 版本计划于 2025 年 3 月发布。


    如果 Graphics 决定指定支持哪些掌机，热门设备


    当然，SteamOS 在其他掌机上的普及将取决于与现有硬件的兼容性以及规格。


