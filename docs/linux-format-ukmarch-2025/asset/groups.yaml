    \ graphics card, Jarred Waldo battlemage!\n\n- **Manjaro 24-21** - Nate Drake\
    \ delves into the distro that claims to make Linux Arch-based - will it puts its\
    \ money where its mouth is?\n\n- **Archman 2024-12** - Nate Drake takes this Turkish\
    \ Arch-based distro for a test spin. is it as lightweight and stable as it claims?\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_2.png)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_3.png)\n\
    \n- **OpenMandriva Lx 24.12** - Nate Drake explores the rolling release of this\
    \ Mandriva-derived distro. Is it a worthy successor or just another fresh fork?\n\
    \n- **Window Maker Live 12.8** - Nate Drake revisits the glory days of Linux before\
    \ we had those newfangled desktops – Window Maker all you need?\n\n# ROUNDUP\n\
    \n# IN DEPTH\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_4.png)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_5.png)\n\
