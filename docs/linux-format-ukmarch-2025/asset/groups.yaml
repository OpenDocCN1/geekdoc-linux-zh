    ## 新应用


    结合 Auracast 技术，目标是创建提供近距离音频流。Bis SIG 的一个关键优势是 Wi-Fi 音频流区域的存在，电视可以在那里流传输其音频而不中断。


    除了降低噪声和低带宽消耗的处外，还提供了一些高级场景。首先，音频源可以提供不同语言的输出——对于上述 PA 扬声器，乘客可以用他们的母语听到以获得便利。


