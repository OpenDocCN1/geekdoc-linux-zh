    - 对子结构处理更快


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_78_1.png)


    ## intel arc


    改进的架构提升了渲染性能。


    负载可以处理 2,400MHz；在我们的测试中，我们看到的平均值为 2,330–2,370MHz。


    每个 Xe 核心拥有 8 个向量单元和 8 个 XMX 单元。这是 Alchemist（炼金术架构）数量的一半，但每个单元拥有 2,048 和 2,048
    条矩阵指令。在实践中，每个核心执行的向量或矩阵指令总数仍为：256 条 FP32 或 1096 条 FP16/INT4 指令。


