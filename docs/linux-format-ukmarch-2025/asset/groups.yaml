    # Archman 2024-12


    Nate Drake takes this Linux Arch-based distro for a test spin. Is it lightweight
    and stable as it claims?


    ## IN BRIEF


    While the modified Xfce interface is a true Linux delight, a struggle to recommend
    this distro as a daily driver makes applications difficult and there''s no dedicated
    wiki.


    This rolling Linux distro is based on Arch. Like Manjaro, the website itself is
    a more-friendly version of Arch OS. The latest stable release runs the Xfce 4.18
    desktop, though we noted others running Linux Mint. We can''t be sure, though,
    as Archman is developed in Turkey, so the main site is in Turkish.


    Nevertheless, we were able to download the 2.6GB ISO without any environment issues.
    The Calamares installer, which guided us through the setup process, supported
    encryption. After the choice, installation completed just over 3.5 minutes, putting
    it on a partition similar to Xfce-based distro like Linuxbox. However, unlike
    other Linux distributions, Archman is highly polished. The login screen is colourful,
    with an elegant menu to select your desktop choice. Once entered into the desktop,
    Archman has a cyberpunk wallpaper containing elements of the Linux flag. If you
    want, we found no more than 22 alternatives back.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_20_0.png)


    We don''t usually make much of login screens, but this is a visual feat. You can
    even switch between desktops.


    ## SPECS


    - CPU: 1GHz

    - Mem: 1GB

    - HDD: 2GB

    - Builds: x86_64


    Disappointing, how Manjaro is based on Arch, too, but has its own wiki and forums.
    The lack of documentation also means we found no recommended minimum system specs.
    The ones stated (left) are for Arch. Upon logging in, we tested this by installing
    all apps except the Arch package manager. It used 700MB of RAM and 2% of our virtual
    resources – exactly what we expect from a distro based on Arch and using Archman.
    No online software updates, which Archman does when it comes to pre-installed
    apps. While, since we were pleased to see that Firefox is browsing well, the lack
    of a Pamjaro package manager makes difficult downloading multiple URLs. The only
    ones we used with Parole Media, GIMP and the LibreOffice suite. While browsing
    available apps, we came across Arch settings. Currently, this has only a few options,
    adjusting time and date, and removing user accounts, and changing language.


    ## VERDICT


    - DEVELOPER: Archman Team

    - WEB: https://archman.org

    - LICENSE: GPL


    | FEATURES | EASE OF USE | DOCUMENTATION |

    |---|---|---|

    | PERFORMANCE | 8/10 | 2/10 | 8/10 |


    We took the time to download and install the 1.3GB of updates and restarted Archman
    VM, but this failed to resolve the issue. The groups of Pacjaro did work; however,
    we needed to navigate to KDE and install it. Archman also integrates Pacman, which
    we used to install Ucisia via the terminal. Although there, Archman''s site doesn''t
    have a dedicated page for people who run into issues. Like the release for the
    current version, code-named Özgürlük (freedom), also that the developers cannot
    provide links to Arch support repos from the main site.


    Shows promise, with rich graphics and easy installation. Sadly there are technical
    glitches and limited documentation.


    >> Rating 6/10


    # Distribution REVIEWS


    ## OpenMandraiva Lx 24.12


    Nate Drake explores the rolling release of this Mandriva-driven distro.

    Is it a worthy successor or just another frivolous fork?


    ### IN BRIEF


    Mandriva''s legacy lives on with this distro''s sleek setup and comprehensive
    welcome screen. Plasma 6 also runs with ROME''s bespoke apps. The wiki is well
    laid out, but with conflicting information.


    ### SPECS


    - CPU: 1GHz

    - MEM: 2GB

    - HDD: 10GB

    - Builds: x86_64, ARM656


    This distro is a fork of ROSA, itself a fork of Mandriva Linux, which was discontinued
    in 2011. Former developers then teamed up with the community to create OpenMandriva.
    While it traditionally issues fixed releases, as of 2023 the project has implemented
    a rolling release branch, named ROME. Spans are of the latest version running
    LXQ6, Plasma 5 and COSMIC 1.0. There''s also a version running Plasma 6 with which
    the 3.8GB ISO of the X11 version runs better under VirtualBox VM.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_21_0.png)


    The distro''s configuration tool is basic but effectively manages updates and
    installation. It''s also a built-in update tool.


    On first boot into the live environment, the OM welcome screen quickly launches
    the bundled Calamares installer. Supported is full disk encryption. Every drive
    and the launched, setup completed in just over one minute. It is one of the fastest
    times we''ve seen Linux work.


    Upon reboot, we needed to determine the system requirements, as the needs list
    different specs from the project. With only OM running, the system uses 300MB
    RAM in our VM, which is around 3% of the virtual CPU. The install footprint of
    3.8GB is in line with the release, which needs around 10GB of storage.


    We returned to the home, which fully lists OpenMandriva''s latest features. This
    includes an updated kernel (6.12.1) with improved support for hyperthreading.
    We also noted the welcome screen reflects a repository selector, showing that
    this is the only tool to enable or disable repos. When firing up, we could use
    the Software Center to switch to the OS, or install only fixed releases. From
    here you also install Extra, Restricted and Non-Free, as in other distributions.
    Some third-party repositories are listed for popular apps, such as Microsoft Teams,
    though we recommend using only free software. You can, however, check the configuration
    of the Update tool, which is designed to configure automatic updates. It offers
    three options: you can choose not to download updates automatically, download
    updates manually (default), and install updates automatically. We were puzzled
    by this, but it would make more sense to incorporate these into the pre-installed
    system. Overall, the software center has a list of popular apps. These are organised
    into categories like Apps and Games. If you want to, you can also install packages
    such as Drivers. The desktop has a shortcut that opens a page with link to the
    project''s wiki, forum, and developer chat. We criticised the wiki for providing
    conflicting information, we found the main point more intuitive. We are satisfied
    that through the release notes, which covers various updates and applications,
    such as Chrome and Firefox.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_21_1.png)


    ### VERDICT


    DEVELOPER: OpenMandriva Association and Community

    WEB: www.openmandriva.org

    LICENSE: GPL


    | FEATURES | EASE OF USE | DOCUMENTATION |

    |---|---|---|

    | PERFORMANCE | 9/10 | 8/10 | 7/10 |


    Light-fast setup and custom tools to handle updates and repo selection. Supports
    multiple package managers. 8/10


    # Distribution REVIEWS


    ## Window Maker Live 12


    Nate Drake reveals the glories of Linux before we havefangled desktops – is Window
    Maker all you need?


    ### IN BRIEF


    With time and patience, it is possible to master the window manager. Setup is
    fairly simple and it''s very fast, though struggle to juggle multiple applications
    with it. I''m feeling nostalgic for the days before Gnome and Xfce, this distro
    may be for you. According to the site (a subdomain of SourceForge), Window Maker
    Live installed on Debian v12 Bookworm uses the Window manager in place of a traditional
    desktop. Upon downloading and installing the 3GB ISO into a virtual machine we
