    # 新闻快报


    ## 软件


    ## 观点


    ## 开源资金洞察


    各机构目前向开源开发投入了 77 亿美元。


    研究显示，全球各机构每年向开源项目贡献了约 77 亿美元（63 亿英镑）。这是 2021 年《开源资金报告》的主要发现之一。该报告本身基于 GitHub、Linux
    和哈佛大学每年进行的“开源软件调查”。从来自 159 家机构的 501 名受访者收集的信息代表了开源贡献总计 170 亿美元，从中计算出 77 亿美元的详细数据。所使用的方法指出，86%
    的贡献价值是员工劳动，而只有 14% 是直接资金支持。报告指出，开源投资中的 520,600 美元（42,000 英镑）是全职员工。两个月后（66.3%）为全职就业。在可能的情况下，这些数字排除了为项目聘佣临时合同工的情况。报告还指出机构在该特定领域存在盲点。


    机构如何为开源软件贡献？


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_6_0.png)


    Italo Vigni 是 LibreOffice 和 Document Foundation 的创始人之一。


    调查的一个目标是估计对开源的“附加值”。


    LibreOffice 2.5 于 2025 年发布，是 Document Foundation 旗舰开源套件的最新迭代，包含了对可用性和性能的改进。


    报告包含了关于机构如何贡献的关键数据，以及关于提高资金透明度的建议。


    Microsoft Office 任务，确保与其他平台的无缝协作。界面经过精炼，以提供更现代的体验，具有可自定义的布局，并改进了对桌面和移动设备的兼容性。


    特别是在量化机构时，即有多少劳动贡献了开源开发。如果仅依赖直接资金支持，情况并非如此，这只是查看机构需求的问题。


    《开源资金调查》和报告对每个机构如何处理重要数据提供了一些建议。这包括实施让员工使用工作邮箱进行联系的政策。阅读全文：https://opensourcefundsurvey2024.com


    性能优化导致了更快的加载速度和更好的稳定性。Writer, C, Calc, Impress, Draw, Base 和 Math。Writer、Calc
    和 Impress 处理了表格编写，让户户更容易创建高质量、专业的内容。


    ## 硬件


    ## 新的 Nvidia Linux AI 硬件


    Project Dig 是世界上最小的超级计算机。


    Nvidia 利用 2025 年 CES 发布了其新的个人项目 Dig。这台超级计算机的目标群体是 AI 研究人员、数据科学家和学生。


    尽管尚未证实，但 Nvidia 声称单台 Project Dig 单元可以运行 20 个 GPU。Nvidia 还说两台 Project Dig 单元可以连接成
    40 节点模型。


    它配备 Nvidia GB100 Blackwell 芯片，与上一代 Q100 相比性能提升了四倍。


    在发布会上，Jensen Huang 声称它可以运行基于 Linux 的 Nvidia DGX OS，该系统针对 AI 工作负载进行了优化。它还带有 128GB
    统一内存和高达 4TB 的 NVme 存储设备。它可以作为独立设备，也可以连接到 Mac 或 PC。


    这种计算能力是有代价的：单台 Project Dig 单元的起价为 30,000 美元。


    付费用户可以访问 Nvidia 的 NGC 目录——一套用于 AI、HPC 和可视化的精选软件。DG OS 还支持 PyTorch、TensorFlow 和
    Jupyter 笔记本等框架。


    LibreOffice 不仅仅是一个办公套件，它强调了对自由的承诺。


