    # Auracast 教程


    ## 蓝牙


    *致谢：www.bluetooth.com*


    ## 发现下一代 Auracast 音频


    Auracast 是蓝牙低功耗（Bluetooth Low Energy）的一部分，已准备好彻底改变蓝牙世界，Tam Hanna 终于可以让他的 Palm
    OS 设备用上了。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_63_0.png)


    蓝牙音频自 Palm T 时代就已经存在了。那时，移动设备的计算能力意味着用于音频传输的编码器必须针对当时半导体技术的局限性进行优化。


    ### 请更好的编码器


    蓝牙 5.2 引入了低功耗通信的新标准——编码器（Codec），或 LC3。它利用编码器开发的的进展，通过减少传输量来提供更高的音质。蓝牙的测试显示，160kbps
    的 LC3 质量优于基于传统编码格式的 32kbps。


    减少传输可以使立体声的能量消耗降低高达三倍，在这种情况下，未连接的耳机可以仅使用针对它们的输出信息来接收独立的流。


    明智的是，蓝牙 5.2 引入 LC3 时是一项突破——https://bly.com/ltfx32codecs 提供了概览。通过配对耳机，在 https://bly.com/ltfx32demo
    上的交互演示展示了 Thomas Steven 对音质的性能评估。最后，https://bly.com/ltfx32lc3 的代码文档非常值得读。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_63_1.png)


    并用一个名为等时通道（Isochronous Channels）的新系统取代了它，该系统为无线音频协议栈增加了一个层，用于数据同步的可靠性。它将时间和时钟都分为称为
    LC3 间隔的槽。在每个间隔期间，源被发送到包中，这防止了多个信号的干扰，并显著降低了音频延迟。据说蓝牙音频的延迟高达 200ms，而大多数耳机的延迟保持在
    30ms 以下。通过 LE Audio，这


    此外，这还实现了数据流冗余。新的蓝牙耳机可以向每个耳朵发送一个流，消除了 A2DP 模式下存在的延迟。


    最后，蓝牙音频流中的数据带有预期。数据包可以自动丢弃，确保没有丢失的数据包浪费空中时间。


    ### 多播广播


    蓝牙的学习者知道 CEP 和 LDP 之间的区别。同步访问保证了一一对多广播的交付，从而实现了更高的效率和更低的延迟。


    在多播的情况下，使用了两种流。连接等时流（CIS）在音频源和接收器（sink）之间创建了点对点的连接。源向一个接收器发送信息——对于具有独立耳朵的耳机，需要两个
    CIS 流。蓝牙


    ## 等不及最近了


    蓝牙 LE 的引入是为了解决该标准面临的各种问题。为了消除僵化协议系统带来的不灵活性，它提供了一种新的、缓冲少的无线通信形式，这导致了延迟的降低。


    特别是，LE Audio 消除了 A2DP 协议


    ### 蓝牙编码器比较


    标准立体声听力测试


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_63_2.png)


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_63_3.png)


    我们的专家 Tam Hanna 在计算机、软件和电子领域工作了 20 多年。


    LC 导致了音质的显著提高


    64 LifeVox 2023年3月


    www.ausformat.com


    致谢：Bluetooth-SIG, https://bly.com/ltfx32sig


    ## Auracast 广播


    等时流（Bis）可以将传输多播到被称为 TCP/IP 网络堆栈的 UDP 协议中。与 CIS 不同，Bis 是无连接的；任何接收器都可以听到通过网络传输的数据包并按其需要使用它们


    进入一个未经加工的数据流，这不会导致环境噪声放大。


    在许多其他与广播相关的主题中，Auracast 是一个商标。它许可给实现了广播配置（BBP）的 Bis SIG 认证设备，以便在需要时快速添加 Bis SIG
    认证，对于较小的公司。


    Bis 流被分组为组织。一组可以包含多达 31 个 Bis，每个 Bis 都被分配一个标准长度的地址。发送的数据包与此引用绑定，引用冗余确保了数据包的同步。


