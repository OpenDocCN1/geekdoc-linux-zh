    ### OpenBoard


    Version: 1.7.2 Web: https://openboard.ch/index.en.html


    openboard.ch is a digital whiteboard app that you can use for presentations or
    for other classes. The app has all kinds of tools and functionalities to annotate
    digital content. Officially, it is only available as a DEB binary, but you can
    easily install it on Ubuntu, Arch and OpenSE. Your best bet, though, is to start
    with a Flatpak from flatpak install flathub openboard.openboard.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_85_0.png)


    OpenBoard also displays a series of tips and hints to help you familiar yourself
    with the tool. You can scroll through them to start using the app. On top there''s
    the palette, which gives you access to everything you need to annotate the whiteboard
    during your presentation. There''s also the toolbar, which gives you the possibility
    to change a pen or marker''s color and size, among others.


    Interact without selecting them. There''s also the textbox, which you can use
    to write text using the keyboard instead of the pen. You also have the option
    to change the color of the background.


    There are four modes in OpenBoard: Whiteboard mode, Desktop mode, Documents mode
    and Web mode. You can interact with your computer screen while keeping OpenBoard
    as an overlay. You can add annotations just as you would on a physical whiteboard
    with the pen or marker.


    Then there''s the Documents mode, which you can use to import and annotate PDF
    files or images. You can also use OpenBoard to record the audio and video of an
    OpenBoard session and export to Podcast.


    OpenBoard works best with two screens, one for annotating content, the other for
    the audience. You can choose to display the app''s tools and dashboard.


    ## REMOTE DESKTOP


    ### TurboVNC


    Version: 3.1.3 Web: https://www.turbovnc.org


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_85_1.png)


    When you think of remote access, the first thing that comes to mind is SSH. Systems
    have been using SSH for some time now for all sorts of CLI clients. However, when
    you need time to access the remote desktop. That''s where remote software, like
    TurboVNC, comes in. It is a cross-platform solution that allows you to remotely
    access and operate a computer from all sorts devices.


    The project has binaries for RPM and DEB-based Linux distributions. On Fedora
    and Debian, you can install it with `dnf install rpm`, while on Ubuntu, `apt-get
    install` gets it.


    TurboVNC works with several clients and a server. You can run it to connect to
    any VNC server. Although TurboVNC is best to use it with its optimum for performance.
    To start a TurboVNC server, you need to access the remote machine, fire up a terminal,
    and use `/opt/turbovnc/bin/vncserver`. Make a note of the X Display that the TurboVNC
    session is encrypted to secure the session. You''re also prompted for a password.
    You can also specify a password for view-only session.


    To connect to this remote machine, you have to open the TurboVNC client from the
    viewers menu or with `/opt/TurboVNC/bin/vviewer`. Enter the hostname or IP address
    of the host, along with the X display field, then click Connect and start.


    After verifying the credentials, TurboVNC displays the remote desktop in a full-screen
    window. While the session works well with the default settings, you can tweak
    them using the Connection Options button in the toolbar at top of the client''s
    window.


    TurboVNC''s developers claim that it is tuned for handling 3D video workloads.


