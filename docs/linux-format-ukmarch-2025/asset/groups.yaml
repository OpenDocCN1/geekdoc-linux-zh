    \ Netgear PRICE: £1700\n\n>> 8/10\n\n## ADMINISTERIA\n\n### Create quick, simple\
    \ repeatable playbooks\n\nEveryone likes to say that Stuart Burns is an Ansible\
    \ man and that's nothing to do with his faster-than-light communication.\n\nbig\
    \ Ansible Fans. It makes life easy when managing a PC. The problem is, there are\
    \ lots to learn; so, let's come over some Ansible scripts that don't require lots\
    \ of immediate learning but can grow in it by step.\n\nAnsible is an open source\
    \ automation tool, widely known for managing infrastructure. By defining tasks\
    \ in the form of YAML files, Ansible executes them over ssh automating tasks such\
    \ as installing software, configuring services and more. It makes sure everything\
    \ is exactly as you want, and reduces errors.\n\nBut it is not limited to managing\
    \ remote servers. You can use Ansible to configure your local machine and streamline\
    \ tasks, keeping servers consistent. It makes sure everything exactly as you want,\
    \ the same time. What advantages does it have? It's all down to declarative versus\
    \ imperative... Bash scripts are imperative; tell the computer exactly how to\
    \ do something.\n\nAnsible is declarative. tell it what you want and it figures\
    \ out how to do it. If something is already in state, it does nothing. This eliminates\
    \ a lot of effort and reduces errors. Ansible is idempotent, which means that\
    \ no many times you run your playbook, the result is always the same. This is\
    \ a huge plus for consistency, and don't have to worry about messing things up\
    \ by running the same script. And unlike bash loops, Ansible uses a straightforward\
    \ format to declare what you want, not how. It makes it easier to read and write.\n\
    \nBefore starting, you'll need to install Ansible. The Heart of Ansible is a YAML\
    \ file that defines tasks you want to execute. A basic example is to install a\
    \ set of packages, Imagine you want to set up your environment quickly. Using\
    \ Python and couple of useful packages like git and In Bash a script might look\
    \ like this:\n\n```bash\n#!/bin/bash\n```\n\n### Set up Python Environment\nhosts:\
    \ localhost\ntasks:\n- name: Ensure Git is installed\n  apt:\n    name: git\n\
    \    state: present\n- name: Ensure curl is installed\n  apt:\n    name: curl\n\
    \    state: present\n- name: Ensure http is installed\n  apt:\n    name: http\n\
    \    state: present\n\n### RSYNC TIME-KEEPING\n\nall know what rsync is. However,\
    \ when doing a copy of FTP, the lack of any idea of how long it takes. We just\
    \ thought was one of those things to put up until recently there was a new switch\
    \ added to rsync that made an educated guess about the length of time. The switch\
    \ in rsync is --progress which gives us an estimate of the duration of operation.\
    \ It's really useful and something we think should be included in the standard\
    \ output. For a simple rsync command, use the following as example:\n\nrsync -av\
    \ admin@media:/content/backup\n\nHere we list the tasks you want to perform -\
    \ Every 'command' is a task: this is an Ansible module that interacts with the\
    \ package manager (we're on Ubuntu/Debian). The state: present lines the package\
    \ is installed. To install the playbook, use ansible-playbook:\nans-playbook -K\
    \ myplaybook.yml\n\n### ADMINISTERIA\n\nThe -K gives sudo capability. How simple\
    \ is this? Once you run it, Ansible will check if package is already installed\
    \ and skip if it is. This eliminates redundancy and ensures you install what you\
    \ need. Setting up configuration is as simple. example: respecting is a highly\
    \ customised status. Ansible can do file-level changes. Suppose you want to configure\
    \ environment variables via `/bashrc`. A Bash script could:\n\n`ls -la >> /bashrc;\
    \ export PATH=\"$PATH:/opt/bin\" >> /bashrc; source ~/.bashrc`\n\nrsync -avz /data/files/iso/\
    \ /data --progress2\nsending incremental file list\nproxox-ve_8.2-iso\nubuntu-20.04.1-desktop-amd64.iso\
    \ 137.8MB/s 100% (08:00:27,to-ch3/6)\n240.91 118MB 100% (02:05)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_76_0.png)\n\
    \nStuart Burns is a sysadmin for a Fortune 500 enterprise-based in London. Using\
    \ progress2 shows how much longer a sync operation needs.\n\n### PASSWORD PRACTICALITIES\n\
    \n```yaml\n- name: Configure Bash settings\n  hosts: localhost\n- name: Add alias\
    \ to bashrc\n  linefile:\n    line: \"ls -la\" >> /bashrc\n    create: yes\n-\
    \ name: Add custom PATH to bashrc\n  linefile:\n    path: /bashrc\n    line: export\
    \ PATH=\"$PATH:/opt/bin\"\n    create: yes\n```\n\nI think password managers are\
    \ a great idea. Unfortunately there has been a question in the way people manage\
    \ passwords. LastPass and my favourite, Bitwarden, with TOTP (2FA codes). Presently\
    \ password managers save and auto-fill TOTP. This is a terrible decision that\
    \ weakens the security stance anyone who uses. The whole point of 2FA is that\
    \ it is separate from you, and not easily accessible or bypassable in an ideal\
    \ world. Now, should your password be hacked, the miscreants will be able to impersonate\
    \ you because they have your username, password and code. I've got it for, but\
    \ it means you have no line of defence against attack. It's the old-school security\
    \ vulnerability and convenience. Admitting something is hard but LastPass has\
    \ been compromised - https://bit.ly/325last My advice is not to use it if an attacker\
    \ can get all your information by compromising one system, these websites can\
    \ declare yours because you didn't practice good security measures. Now is the\
    \ time to make sure you use your passwords on a separate device (using a well-known\
    \ authenticator app). Most people only have a physical copy of the backup codes\
    \ to complement it. Just don't leave them anywhere on your laptop!\n\n```yaml\n\
    - name: Update system packages\n  hosts: localhost\n- name: Update package list\n\
    \  apt:\n- name: Update all packages\n  apt:\n    upgrade: all\n```\n\nAnsible\
    \ allows you to tasks on your local PC\nKeep your configuration\nReuse your configuration\
