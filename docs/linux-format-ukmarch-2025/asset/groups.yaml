    # # CODING Space Invaders


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_91_0.png)


    You can use special characters to form complex shapes like aliens. In this, though
    they are identically sized rectangles.


    The rows of aliens move from left to right across the screen. They also move downwards
    when reaching the edge.


    +   QUICK TIP

    - In the original Space Invaders, developer Tomohiro Nishikawa discovered that
    the control program rendered with frame of aliens moved faster than there on screen.
    Rather than compensate for this, Nishikawa decided to leave it as a game feature,
    not a bug.


    This is a example of how efficient the game code is. As four shapes to be drawn,
    technically Mark would have used four lines of code for one.


    hold the shields. If you run the game, you''ll see that they are now at the correct
    location.


    # Basic needs


    Instead, here we use a FOR loop with the variable I. This works through the variables
    0, 2 and 3. Combined with the PRINT command, this allows the four shapes to be
