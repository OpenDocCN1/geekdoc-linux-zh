    # RPG 评测


    ## 《奎德之洞》


    管理层想知道为什么我们不能随机生成所有的杂志内容。Jonathan Bolding 并不想让大家失望。


    + 配置

    - 最低操作系统：Ubuntu 18.04, CentOS 7

    - CPU：1GHz, SSE3

    - 内存：4GB

    - 硬盘：2GB

    - GPU：支持 Vulcan


    《奎德之洞》（Caves of Qud）在形式上是一个传统的 roguelike RPG，这是一款俯角的射击游戏，依赖文本和简单且富有联想的图形来传达其世界。它并没有死板地追求“死亡”，而是由你选择何时存档，并调整你进行战斗的程度。它也没有死守传统
    roguelike 规则，即那种过时、令人沮丧的用户界面以及街机式的、键盘驱动的操作模式——它在 Steam Deck 这样的移动 PC 上运行得很好。


    你可以从各种架构中创建角色，无论是普通人类，还是奎德中更具变异性的居民。你在一个自由的世界中构建，利用你的能力并收集经验，以开启令人眼花的可能性。从你的起始村庄到遥远的奎德之地，这是一种真正的
    RPG 沙盒风格，选择遵循或不遵循食地者（Eaters of Earth）古代文明的遗迹，对抗你必须面对的奇异敌人，并掠夺它们的宝藏。


    每次游戏流程都有相同的世界地图，但会根据一套复杂的异构生成系统重新命名每个局部区域，该系统记录了构成奎德的规则。你的所作会影响你预期可以在那里发现的东西——它将历史清晰地整合到主线任务的目标中，而在其他情况下，你可能会认为这些背后有设计师的手手。你可能需要花几个小时才能


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_23_0.png)


    掌握《奎德之洞》，老练的玩家可以在 15 分钟内跑完主线故事。


    ## koke 层


    人类过去的遗迹位于奎德的下方和之上，形成了一层地下城，里面充满了某个文明的物品，这个文明是如此领先，以至于他们发明了传送门并在死恒星的光芒下降解物质。敌人曾经如此强大，满血仅够在他们的攻击中存活，不像奎德广阔的隔绝区域那里充满了乐趣——例如，死亡之梦仅仅是真正的代价。


    这个世界对许多不同物种来说是正常的，古代工程与改变现实的现象相结合，谱写了一个关于奇异生物的无线故事——例如触感者，与拉普拉斯（Laplace）相比，后者处于一种奇异的量子状态，只有当两个物体同时被杀死时它才会死去。奎德是一个超人格、青铜匕和末日时代的世界，由宇宙初期的被遗忘物质组成，对抗着陨石般的宇宙现象和奇异的事物，每一种都拥有神奇的粒子束，能够穿透屏幕上的所有东西，无论敌友。


    ## 丰富的叙事


    主线故事开启了一段非常适合你坐下的旅程，途中点缀着古怪的角色，比如一个沉默的外星熊人-枪手人，和一个与你战斗的荒野盗贼，你必须随身携带它并让它在你的皮肤上运行。它也保持了多样性——你探索技术，但也学习了派系之间的外交、制造、一些谜题，以及由此产生的历史。这一切都用极其丰富的散文呈现出来，超越了奖励本身，到达了一个类似于《爱丽丝仙游游记》的地方，


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_23_1.png)


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_23_2.png)


