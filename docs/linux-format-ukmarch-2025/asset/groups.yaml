    这个发行版是 ROSA 的分支，而 ROSA 又是 Mandriva Linux 的分支，后者已于 2011 年停止维护。前开发人员随后与社区合作创建了 OpenMandriva。虽然它传统上发布固定版本，但从
    2023 年开始，该项目实现了一个名为 ROME 的滚动更新分支。该分支涵盖了运行 LXQ6、Plasma 5 和 COSMIC 1.0 的最新版本。还有一个运行
    Plasma 6 的版本，其 3.8GB 的 X11 版本 ISO 在 VirtualBox 虚拟机下运行更好。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_21_0.png)


    发行版的配置工具简单，但能有效地管理更新和安装。它还是内置的更新工具。


    首次进入现场环境时，OM 欢迎屏幕迅速启动了绑定的 Calamares 安装器。支持全盘加密。每个驱动器启动后，设置仅在一多分钟内完成。这是我们看到 Linux
    运行最快的时间之一。


    重启后，我们需要确定系统要求，因为需求列表与项目规格不同。在仅运行 OM 的情况下，系统在我们的虚拟机中使用了 300MB 内存，约占虚拟 CPU 的 3%。3.8GB
    的安装占用与发布说明一致，它需要大约 10GB 的存储空间。


    我们回到主页，那里完整列出了 OpenMandriva 的最新功能。这包括一个更新过的内核 (6.12.1)，并改进了对超线程的支持。我们还注意到欢迎屏幕反映了一个仓库选择器，显示这是启用或禁用仓库的唯一工具。启动时，我们可以使用软件中心切换到
    OS，或仅安装固定版本。从这里你也可以像其他发行版一样安装 Extra、Restricted 和 Non-Free 软件。某些热门应用（如 Microsoft
    Teams）还列出了一些第三方仓库，尽管我们建议只使用免费软件。不过，你可以检查更新工具的配置，该工具设计用于配置自动更新。它提供了三个选项：你可以选择不自动下载更新、手动下载更新（默认）以及自动安装更新。我们对这感到困惑，但将这些整合到预装系统中会更有意义。总的来说，软件中心有一个热门应用列表。这些应用按“应用”和“游戏”等类别组织。如果你愿意，也可以安装如驱动程序之类的包。桌面有一个快捷方式，可以打开一个包含指向项目
    wiki、论坛和开发者聊天链接的页面。我们批评 wiki 提供了冲突的信息。我们在img/e610c7a095fcd2c0c411ff707edde0b3_21_0.png
    中看到...


    ### 结论


    - 开发者：OpenMandriva Association

    - 网站：www.openmandriva.org

    - 许可证: GPL


    | 特性 | 易用性 | 文档 |

