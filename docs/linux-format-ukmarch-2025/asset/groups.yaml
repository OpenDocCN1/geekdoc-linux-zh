  mdcn: "\n\n# Pi SSD 加速\n你 Pi 最火的升级：M.2 驱动器\n\n# 密码保护！\n切换到 KeePassXC 以增强安全性\n\n\
    # 更快的 WI-FI\n配置你的新路由器使其运行得更快！\n\n# LINUX 格式\n\n记录下下切！\n直播你的桌面，用于教程、游戏演示等场景\n\n\
    排名第1的开源杂志\n\n# 火墙\n守护你的家庭\n\n使用 Linux 保护你的网络，并在门外拦截所有网络威胁！\n\n- 隔离设备以实现全方位保护\n\
    - 部署 DNS 以拦截广告\n- 运行自定义路由器固件\n- 安全的外部网络访问\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_0_0.png)\n\
    \n# 更多：如何操作\n\n>> 从你的 Pi 发送 BlueSky 消息\n>> 通过《太空侵入者》开始编程\n>> 重温打卡编程的时代！\n\n# 战法师\
    \ (BATTLEMAGE)!\n英特尔新 GPU 硅片运行之快的秘密\n\n# 音频广播 (AUDIOCAST)\n轻松通过蓝牙广播你的音频\n\n# 磨炼你的\
    \ Rust\n从这门必备语言开始\n\n# 脑瘤移动极快。在你的帮助下，我们也可以！\n\n我们正致力于创造脑瘤可治愈的未来。我们迫切需要你的帮助来加速研究。\n\
    \n发送短信 DEFEAT5 到 70507 捐 5 英镑，请帮助我们找到治疗方法。\n\nthebraintumourcharity.org\n\n# 欢迎\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_0.png)\n\n# >> 认识团队\n\n在本期中，我们以不同的方式为家庭网络进行布线，那么你使用什么快速安全技巧来让你的家更安全呢？\n\
    \n# 火热朝天！\n\n我一直说——虽然没人听我的，尽管 Linux 也是如此——在 Linux 桌面被默认安装到某些流行的消费系统之前，“Linux 桌面年”永远不会到来。结果\
    \ Valve 推出了手持设备和 Deck，搭载其独立游戏桌面的 Linux SteamOS 已经占了 5% 的份额，而且 SteamOS 现在正在超越第三方系统。\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_1.png)\n\n随着 2025 年的开始升温，真的感觉 Linux\
    \ 终于成熟了，渗透到了我们生活的方方面面，从 Pi 嵌入式设备、游戏系统到笔记本电脑、手机和电视。如果有人说 Windows 现在才占据了利基操作系统的位置，仅限于消费级\
    \ PC，那么目前可能有十亿甚至二十亿 Linux 用户正在计数。\n\n然而，这种普及意味着 PC 和我们所处的网络仍然是主要威胁。我们正关注网络安全，思考如何使用\
    \ Linux 保护你的家庭免受入侵和互联网的影响，并确保访问安全。为该网络建立防火墙可以改变游戏规则，因此我们找到了正确的平衡点：通过创建 VLAN 或运行\
    \ OpenWrt 来更好地利用你已有的硬件，同时扩展到最简单的解决方案，我们将学习到很多关于网络原理以及如何更好地保护它们的知识。\n\n# Matthew\
    \ Holder\n\n让我的家更安全涉及关闭任何正在使用的端口转发。主要是为了 SSH/VPN 访问。切换到 VPN（可以消除 NAT）意味着我的家比以前更安全了。每当我需要通过\
    \ VPN 访问时。\n\n# Michael Reed\n\n当我们与其他用户交互时，不要让任何人使用它，除非你需要设置访客账户。在家庭网络方面，大多数路由器需要开启限制性\
    \ WiFi。\n\n# Nate Drake\n\n我的 Wi-Fi 网络一直处于监控之下，以将潜在的入侵者隔之在外。我为我的 IoT 设备设置了一个 VLAN。我的智能烤箱无法连接到我的\
    \ PC，从而保护了我的酸种配方。关键在于比这些网络痕迹领先一步。\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_2.png)\n\
    \nNeil Mohr 编辑\nNeil.mohr@future.net\n\n# Les Ponderluk\n\n我在 Raspberry Pi 3B+\
    \ 上运行我的 Pi-hole DNS 服务器。Pi-hole 拦截广告以及目前充斥网页的许多其他骚扰。虽然存在一些问题，但我可以在控制台和手机上修复它们。\n\
    \n# Nick Peers\n\n我发现了如何重定向子域名使其在我的家庭网络上运行——这让我有时间使用我自托管的 WireGuard VPN，因此我只能通过家庭网络访问（或至少如此），我的密码多了一层安全防护。\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_3.png)\n\n*节省是以牺牲覆盖为代价的。*\n\n# 目录\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_0.png)\n\n# 测评\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_1.png)\n\
    \n# ### 火墙\n你的家庭\n\n在 Matthew Holder 的关键帮助下，将网络威胁拒之门，并追踪家庭网络的进出流量。见第 32 页！\n\n\
    - **Intel Arc B580** - 披着飘逸的斗篷和尖帽，审视英特尔的新显卡——战法师 Jarred Waldo！\n\n- **Manjaro\
    \ 24-21** - Nate Drake 深入研究这个声称基于 Arch 的 Linux 发行版——它能名副其实吗？\n\n- **Archman 2024-12**\
    \ - Nate Drake 对这个基于 Arch 的土耳发行版进行了测试。它真的如所称的轻量且稳定吗？\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_2.png)\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_3.png)\n\n- **OpenMandriva Lx 24.12**\
    \ - Nate Drake 探索了这个基于 Mandriva 的发行版的滚动更新。它是值得期待的继任者，还是另一个新鲜的分支？\n\n- **Window\
    \ Maker Live 12.8** - Nate Drake 回顾了我们在拥有那些新奇桌面之前的 Linux 辉光时刻——Window Maker 就是你需要的吗？\n\
    \n# 汇总\n\n# 深度解析\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_4.png)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_5.png)\n\
    \n- **Caves of Oud** - 管理层想知道为什么我们不能随机生成所有内容。Jonathan Bolding 不愿让人失望。\n\n- **录屏软件**\
    \ - 无论是录制游戏还是桌面应用教程，Michael Reed 查看了五种可以录制屏幕活动的应用程序。\n\n- **英特尔 Battlemage** -\
    \ 终于为预算有限的游戏玩家提供了冠军。英特尔新的 Arc 系列提供了内存、速度、质量和机器学习，正如 Jared Watson 所描述的。\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_6.png)\n\
    \n# Pi 用户\n\n# 管理篇\n\n# Pi 新闻 \n\n# Administeria\nAdministeria，我们找到了正确的平衡点：通过创建\
    \ VLAN 或运行 OpenWrt 来更好地利用你已有的硬件，同时扩展到最简单的解决方案，我们将学习到很多关于网络原理以及如何更好地保护它们的知识。\n\n\
    （注：由于原文中该段落大量重复，此处译文按原文逻辑保留重复内容，以确保格式一致）\n\n"
