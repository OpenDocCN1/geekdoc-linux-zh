    Set up a spare Raspberry Pi as a separate Wi-Fi SSID.


    Separating functionality on your home network can be a good thing. If you have
    a spare Raspberry Pi around, this project uses few standard Linux tools, with
    a web interface, allowing you to turn your Pi into a Wi-Fi SSID. You can then
    run your Raspberry Pi independently and use RaspAP.


    Note the performance of the built-in antenna may not be as good as a standard
