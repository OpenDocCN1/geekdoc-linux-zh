    \n> 经典的网件设计适用于任何风格。\n\n5.0GHz 和 6.0GHz 网络将您的计算机和移动设备连接到最快的可用带宽。我们在 30 分钟内就完成了组网网络的搭建和运行。如果不是价格的原因，网件\
    \ Orbi 四频版的得分会更高。但如果你能负担得起，它是最强大的 Wi-Fi 6 路由器之一。\n\n结论\n开发者：网件 (Netgear) 价格：£1700\n\
    \n>> 8/10\n\n## 管理\n\n### 创建快速、简单且可重复的执行脚本\n\n每个人都说 Stuart Burns 是一个 Ansible 粉丝，这与他超光速的通信无关。\n\
    \n都是庞大的 Ansible 粉丝。在管理 PC 时，它让生活变得简单。问题是，有许多东西要学；所以，让我们来看一些不需要即时大量学习、但可以逐步成长的\
    \ Ansible 脚本。\n\nAnsible 是一个开源自动化工具，以管理基础设施而闻名。通过以 YAML 文件的形式定义任务，Ansible 通过 ssh\
    \ 执行这些任务，自动化如安装软件、配置服务等任务。它确保一切都完全符合你的预期，并减少错误。\n\n但它不仅限于管理远程服务器。你可以使用 Ansible\
    \ 配置您的本地机器并简化任务，保持服务器的一致性。它确保一切都如你所希望的那样。它有什么优势？声明式与命令式的区别……Bash 脚本是命令式的；告诉计算机具体做什么。\n\
    \nAnsible 是声明式的。告诉它你想要的，它会找出如何做。如果某些已经存在，它什么都不会做。这消除了大量精力并减少了错误。Ansible 是幂等的（idempotent），这意味着多次运行执行脚本的结果总是相同的。这对一致性是一个巨大的加，而且不必担心运行相同的脚本会搞砸。与\
    \ bash 循环不同，Ansible 使用简单的格式来声明你想要的，使其更容易读和写。\n\n在开始之前，你需要安装 Ansible。Ansible 的核心是定义要执行任务的\
    \ YAML 文件。一个基础示例是快速设置环境。使用一些实用包如 git，Bash 脚本可能是这样的：\n\n```bash\n#!/bin/bash\n\
    ```\n\n### 设置 Python 环境\nhosts: localhost\ntasks:\n- name: 确保安装 git\n  apt:\n\
    \    name: git\n    state: present\n- name: 确保安装 curl\n  apt:\n    name: curl\n\
    \    state: present\n- name: 确保安装 http\n  apt:\n    name: http\n    state: present\n\
    \n### RSYNC 时间记录\n\n大家都 rsync 是什么。然而，在进行复制时，缺乏对耗时的想法。我们最近添加了 rsync 的新开关，对操作时间做了估计。rsync\
    \ 的 --progress 开关给了我们持续时间的预估。它非常有用，我们认为应该包含在标准输出中。对于简单的 rsync 命令，使用以下示例：\n\nrsync\
    \ -av admin@media:/content\n\n这里我们列出了要执行的任务 - 'command'：这是一个与管理器交互的 Ansible 模块（我们在\
    \ Ubuntu/Debian 上）。state: present 已安装的包。要安装执行脚本，使用 ansible-playbook -K myplaybook.yml\n\
    \n### 管理\n\nK 提供了 sudo 权限。这有多简单？一旦运行它，Ansible 会检查包是否已经安装，如果是则跳过。这消除了冗余并确保你安装了你需要的。设置配置非常简单。例如：尊重是一个高度自定义的状态。假设你想通过\
    \ `/bashrc` 配置环境变量。Bash 脚本可以：\n\n`ls -la >> /bashrc; export PATH=\"$PATH:/opt/bin\"\
    \ >> /bashrc; source ~/.bashrc`\n\nrsync -avz /data/files/iso/ /data --progress\n\
    发送增量文件列表\nproxox-ve_8.2-iso\nubuntu-20.04.1-desktop-amd64.iso 137.8MB/s 100% (08:00:27,to3/6)\n\
    240.91 118MB 100% (02:05)\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_76_0.png)\n\
    \nStuart Burns 是位于伦敦的一家世界五百强企业的系统管理员。使用 progress 显示了同步操作还需要多久。\n\n### 密码实用性\n\n\
    ```yaml\n- name: 配置 Bash 设置\n  hosts: localhost\n- name: 向 bashrc 添加 alias\n \
    \ linefile:\n    line: \"ls -la\" >> /bashrc\n    create: yes\n- name: 向 bashrc\
    \ 添加自定义 PATH\n  linefile:\n    path: /bashrc\n    line: export PATH=\"$PATH:/opt/bin\"\
    \n    create: yes\n```\n\n我认为密码管理器是一个很棒的主意。不幸的是，人们管理密码的方式存在问题。LastPass 和我喜欢的 Bitwarden\
    \ 配合 TOTP（2FA 码）。目前密码管理器保存并自动填充 TOTP。这是一个糟糕的决定，削弱了任何使用者的安全立场。2FA 的整个重点在于它与你是分离的，在理想世界中无法被访问或绕过。现在，如果你的密码被黑客获取，恶人将能够冒充你，因为他们有了你的用户名、密码和代码。我有它，但这意味着你没有防御攻击的线。这是旧式的安全漏洞与便利。承认事情很难，但\
    \ LastPass 已经被破解 - https://bit.ly/325last 我的建议是不使用它，如果攻击者可以通过破解一个系统获取你的所有信息，这些网站就可以宣布你的信息，因为你没有采取良好的安全措施。现在是确保你在独立设备上使用密码的时候（使用著名的验证器应用）。大多数人只有备份码的物理副本作为补充。不要把它们留在笔记本的任何地方！\n\
    \n```yaml\n- name: 更新系统包\n  hosts: localhost\n- name: 更新包列表\n  apt:\n- name: 更新所有包\n\
    \  apt:\n    upgrade: all\n```\n\nAnsible 允许你在本地 PC 上执行任务\n保持你的配置\n为未来的更新复用你的配置。构建整个脚本是完全可能的。而且\
    \ Ansible 任务非常微不足道，使用 ChatGPT 可以创建一个非常简单且有效的任务。你可以集成它、测试它并反复测试，它是幂等的，所以你可以根据需要多次运行，而只需正常工作\n\
    \n一个 Ansible 的 YAML 示例\n\nwww.techradar.com/linux | 2025年3月 LFXES | 17\n\n"
