    System）：Linux；架构（Architecture）：ARM (64-bit）；Java 包（Java Package）：JDK。完成选择后，选择最新版本并下载开始进程。


    为了确保安装有效，请验证下载文件的校验和与下载页面上提供的校验和是否匹配。使用终端窗口并验证以安装软件（需要更新的版本）：


    下载提供了正确的校验和。现在使用以下命令安装 Java 软件：

    `sudo apt install openjdk-11-jdk`


    通过在终端窗口中使用 `java -version` 验证安装，你应该会看到如下输出：On my machine, the installed version
    is openjdk 11.0.22-0-17-LTS


    重启树莓派虽然没有必要，但是是最佳实践。这能让你更放心。在更改之后，检查参考手册以确定是否出现了之前没有的问题。


