    \ x 114 x 115mm, 0.75kg\n\n作为一款适用于家庭和办公室的顶级 Wi-Fi 组网系统，华硕 ZenWiFi ET12 对于大多数路由器用户来说可能性能过剩。但对于少数需要覆盖大面积且追求顶尖设备的用户来说，它恰是他们需要的。\n\
