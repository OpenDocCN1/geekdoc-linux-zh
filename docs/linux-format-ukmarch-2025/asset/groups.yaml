    协议向任何符合 DLNA 标准的设备流传输媒体。棒的是，你也可以用 tar 和 UMS 提取它。在首次启动时，UMS 会引导你通过一个配置向导，你可以跳过它，也可以使用它来定义根目录和上传文件的位置。选择你的媒体文件夹，它将帮助你设置管理员用户。要添加更多媒体，进入“汉堡菜单
