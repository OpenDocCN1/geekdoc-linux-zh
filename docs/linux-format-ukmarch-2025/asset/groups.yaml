    - 第二 SimpleRecorder: 8/10 (网址: www.maartenberg.com, 许可证: GPL 3)

    - 第三 VideoScreenNG: 7/10 (网址: https://linux4.de/videocreen/recorder.html, 许可证:
    GPL 2.0)

    - 第四 Kazam: 7/10 (网址: https://github.com/henrywo/kazam, 许可证: GPL 3 或更高)

    - 第五 FFmpeg: 6/10 (网址: www.ffmpeg.org, 许可证: LGPL/GPL GPL)


    ## 其它考虑


    有许多 FFmpeg 的图形界面前端，但它们需要专注于特定的使用领域，例如捕获和流传输视频或格式转换。像 MystIQ 和 Shutter Encoder
    尽管很好，但无法帮助你录制屏幕。Blue Recorder 是基于 Gnome 工具的 GTK 录制工具，它似乎已经被遗弃了。Green Recorder
    和 Peek 也被认为是不错的选择，但它们现在被它们的开发者放弃了。RecordMyDesktop 被认为是简单录制器的标准推荐，而 Kocha 是一个维护良好的工具，它在保持良好功能集的同时，在紧凑简化的用户界面方面做到了极致。它支持
    Wayland。


    '
