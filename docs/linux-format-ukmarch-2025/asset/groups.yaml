    ## Games HOTPICKS


    ## ARCADE RACING


    ### Extreme Tux Racer


    Version: 0.8.4 Web: https://extremetuxracer.sourceforge.org/


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_86_0.png)


    The original Tux Racer was the rage back in the day. The gameplay involved controlling
    Linux''s mascot Tux as it slid down mountains, hopping on herrings along the way.
    Despite this simple game, the game garnered fans of all ages to its gravity. Several
    forks of Tux Racer are still under active development. You can grab the game from
    Flathub with flatpak install flathub net.extremetracer.tuxracer


    When you enter an event, the game displays the number of lives or attempts you
    have, as well as the requirements to pass the level. For instance, in the Bunny
    Hill of the Canadian Tux, you must chop at least 20 herrings and complete the
    course in under 37 seconds. If you fail you''ll restart at the next level. Use
    the arrow keys to control your movement. Repeated pressing either arrow increases
    speed, and the direction keys also help you make sharp turns. Use 1 and 2 to switch
    between the two available viewports, and H to toggle/disable the display. You
    can also use the game''s Configuration menu. After the resolution of the game,
    change the interface language, or increase or decrease the level of details.


    Like the original Tux Racer also includes a Practice mode so you can use the game''s
    controls.


    Unlike before, you can create your own of five characters, including Tux. The
    game includes two predefined events, Canadian Cup and Swiss Cup, both made of
    multiple levels. You must complete a level to progress to the next.


    ## SANDBOX & SURVIVAL


    ### Minetest


    Version: 5.10.0 Web: www.minetest.org


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_86_1.png)


    Formerly known as Minecraft, Minetest is a game engine that can help create games
    based on voxel gameplay. It''s not a game itself, but you can use it to download
    and play games. Minetest has several binaries, which use distro-specific Flatpak
    that you can install with flatpak hub net.minetest.org.


    On launch, click on to browse through the doors of Minecraft-based games. You
    can start by creating your own world, but Minetest is still a good starting point.
    To install as many games as you want, use the internal installer. When you''re
    done, press Back to reach the landing screen. In the Game tab, press New to create
    a world, give it a name, and leave the other settings as they are. To explore
    your new world, you can use WASD keys to move around, spacebar to destroy things
    with the left mouse. To craft items, use i to bring up the inventory list and
    building. Minetest is a game, but rather a sandbox environment for first-timers.
    As well as single-player games, it can also host multiplayer games on the local
    network without effort. If you want to enjoy the survival experience, start with
    Minetest: explore mines, build houses, and survive.


