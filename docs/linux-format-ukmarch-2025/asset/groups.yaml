    Yet another Pi accessory arrives in the Linux Format option, shortly followed
    by Les Pounder coming to sing its praises!


    - SPECS

    - Size: 256GB, 512GB

    - Type: M.2 2230

    - Interface: PCIe Gen 3

    - Rand r/w: 40K/70K IOPS

    - 256GB: 50K/90K IOPS

    - 512GB


    The Pi 5 introduced a dedicated PCIe connection to the flagship Pi and it now
    has a plethora of fast storage options. At the highest end of the spectrum, where
    microSD at the other end are NVMe SSDs, which supercharge the Raspberry Pi 5 in
    a low-power desktop computer. For that you need M.2 HAT to use the Raspberry Pi
    SSD and of course, Raspberry Pi has its own M.2 HAT+ which is offered in a bundle
    with the SSD itself.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_44_0.png)


    To install Pi OS to the NVMe SSD, we started with microSD, connected all the peripherals,
    and restarted into the latest operating system. We powered up the Raspberry Pi
    5 and copied the install from the card to the SSD using SD tool. Five minutes
    later, Raspberry Pi booted from NVMe and reached speed Gen 3. A quick reboot and
    we''re ready for testing: The Raspberry Pi SSD comes in two—256GB and 512GB—and
    both as a standalone drive or as a kit (SSD Kit), which includes Raspberry Pi
    M.2 HAT+. Let''s start with boot. The 256GB Raspberry Pi SSD boots to OS in 19
    seconds. That''s faster than microSD, and our microSD card came in 22 seconds.
    There isn''t much difference between the two.


    As Raspberry Pi officially supports Gen 3, our focus will be on the performance
    for those of us who are using boards like Geekworm X, which limits the performance
    to Gen 2. How fast can the drive write? Using dd to read data to /dev/nvme, Gen
    3 saw up to 443MB/s, plenty of speed for the Raspberry Pi, and in line with what
    other SSDs. Gen 2 came at 348MB/s, still fine speed and plenty for most use cases.
    So, Raspberry Pi branded offered the speed as we have tested, but being Raspberry
    Pi product, we get the assurance that this product will work: How does the drive
    get hot? We tested temperature using smart-enabled devices. The idle temperature
    was 31°C. After 15 minutes of use the SSD sat at 38°C. Under stress, Gen 3 reached
    78°C, whereas Gen 2 stayed at 61°C. NVMe storage provides a noticeable boost for
    general tasks.


