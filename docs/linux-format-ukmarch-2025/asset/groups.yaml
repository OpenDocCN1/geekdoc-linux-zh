    # 我们如何测试


    我们以认为最合适的方式安装了每个程序，但也检查了是否有其他方法。我们运行了每个程序以创建适合录屏的视频文件。在这里，重要的是默认编码器在典型的 Linux
    系统（在本例中为 Ubuntu）上运行。这些应用程序控制音频视频编码器，我们测试了它们的性能以确保录制不会消耗过多的 CPU 时间。虽然应用程序利用硬件加速可以提高性能，这是一个复杂的话题。如果你运气发现编码器缺乏硬件支持，最好是软件本身出错，这样你可以进行调试和优化。


    ![](img/e610c7aa95fcd2c0c411ff707edde0b3_25_0.png)


    有时，仅仅截图是不够的，你需要通过录制视频格式的屏幕来提升层次。生成的视频可以制成教程教给他人，或用于展示你的游戏技巧和特技。


    除了能够将屏幕录制为视频文件外，大多数应用程序还可以直播——也就是说，向在线服务进行现场直播。


    幸运的是，Linux 有许多优秀的录屏软件。它们不同在于界面风格和可配置性水平


