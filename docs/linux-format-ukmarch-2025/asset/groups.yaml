    # Raspberry Pi SSD


    Yet another Pi accessory arrives in the Linux Format option, shortly followed
    by Les Pounder coming to sing its praises!


    SPECS

    Size:256GB, 512GB

    Type:M.2 2230

    Interface: PCIe Gen 3

    Rand r/w: 40K/70K IOPS

    256GB: 50K/90K IOPS

    512GB


    he Pi 5 introduced a dedicated PCIe connection to the flagship Pi and it now has
    a plethora of fast storage options. At the highest end of the spectrum, where
    microSD at the other end are NVMe SSDs, which supercharge the Raspberry Pi 5 in
    a low-power desktop computer. For that you need M.2 HAT to use the Raspberry Pi
    SSD and of course, Raspberry Pi has its own M.2 HAT+ which is offered in a bundle
    with the SSD itself


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_44_0.png)


    To install Pi OS to the NVMe SSD, we started with microSD, connected all the peripherals,
    and restarted into the latest operating system. We powered up the Raspberry Pi
    5 and copied the install from the card to the SSD using the SD copy tool. Five
    minutes later, the Raspberry Pi booted from NVMe and reached speed to Gen 3. A
    quick reboot and we''re ready for testing:


    The Raspberry Pi SSD comes in two—256GB and 512GB—and both as a standalone drive
    or as a kit (SSD Kit), which includes the Raspberry Pi M.2 HAT+


    Let''s start with boot. The 256GB Raspberry Pi SSD boots to OS in 19 seconds.
    That''s faster than a microSD, and our NVMe card came in 22.2 seconds. There isn''t
    much difference between the two.


    As Raspberry Pi officially supports PCIe Gen 3, our focus will be on the performance
    for those of us who are using boards like the Geekworm X101, which will implement
    Gen 2 or ASM1186 PCIe switch that limits the performance to PCIe Gen 2.


    How fast can the drive write data? Using dd to read the write data to /dev/nvme,
    PCIe Gen 3 saw up to 443MB/s, plenty of speed for the Raspberry Pi, and in line
    with what the other SSDs we tested. PCIe Gen 2 came at 348MB/s, a still fine speed
    and plenty for most use cases.


    So, Raspberry Pi branded offered the speed as others we have tested, but being
    a Raspberry Pi product, we get the guarantee assurance that this product will
    work:


    How does the drive get hot? We tested temperature using smart a Linux command
    that is part of smarttools and is used to monitor the current heat of SMART-enabled
    devices. The idle temperature was 31°C. After 15 minutes of use the SSD sat at
    38°C. PCIe Gen 2 was at 34°C. Under stress, PCIe Gen 3 reached 78°C, whereas PCIe
    Gen 2 stayed at 61°C.


    With Raspberry Pi supports NVMe SSDs, the Raspberry Pi is not likely for you,
    unless you have a lot of spare cards. This is an SSD for those who know to, for
    projects moving microSD or SSD storage. It is easy to use and provides a noticeable
    speed boost for general tasks.


    # VERDICT


    DEVELOPER: Raspberry Pi Foundation

    WEB: www.raspberrypi.com/products/ssd/

    PRICE: £27.70 (£41.50 SSD)


    | PERFORMANCE | EASE OF USE | VALUE |

    | 8/10 | | 8/10 |


    It works as well as other SSDs, but you get the guarantee assurance from Raspberry
    Pi, if you are happy to pay a little more, this is the SSD for your Raspberry
    Pi 5.


    >> Rating 8/10'
