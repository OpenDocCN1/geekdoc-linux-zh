    这款基于 Arch 的操作系统是一个测试版本，最近添加到了 DistroWatch。作为 0.9.0 版本，你可以使用带有类似 dock的任务栏的自定义 Xfce
    桌面。它还支持无头安装。这由一个定制的安装程序管理，该程序提供了许多自定义设置选项，包括硬件设置和内核参数。它还绑定了 SSD TRIM 调度等功能。更多信息请访问
    https://ditana.org。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_0.png)


    此开发版本包含一个灵活的安装程序。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_1.png)


    # MAKULULINX 2024-12-22

    MakulLinux 的最新版本是开发者系列中所谓的 Linux2025 产品的一部分。虽然该操作系统基于最新版本的 Ubuntu LTS，但现在已更改为
    Debian。旗舰版本采用 Cinnamon 桌面，并配有一些细微的 UI 更改。还有一个 Core Spin 版本，它使用高度类似于 Windows 桌面的自定义
    Xfce 版本。你可以在 http://www.makullinux.com 了解更多信息。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_2.png)


    MakulLinux 基于 Debian，提供 Xfce、Cinnamon 或 Gnome 版本。


    Faith Ekstrand 是 Collibra 的工程采纳者。

    12 月初，凭借 Vulkan 1.4 规范的 Chronos 驱动，我宣布了 Vulkan 的开源驱动 NVK 成为首批发布日合规客户端之一。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_3.png)


    NVK 中的 Vulkan 1.4 已合并到 Mesa，并将成为即将发布的 Mesa 2.5 版本的一部分。


    Siduction 基于 Debian Sid，并采用 Plasma 6。


    这标志着 Mesa 快速采纳 Vulkan 的长期历史完成。在 Linux 上，没有针对合规发布日实现的免费驱动：NVK (Nvidia)、AMD (Intel)、RADV
    (AMD)、Radeon Software 和 Mesa (Apple)。


    # SEDUCTION 2024-01-10

    顾如其名，该基于测试版 Debian，源自 2011 年的 Aptos Sid。该版本代号为 Shannon，其推出是因为当时开发者正在等待 KDE Plasma
    6 进入 Debian Stable 版。Siduction 团队选择现在部署使用 Wayland 的 Linux 6 Plasma，以避免 Calamares
    安装程序出现问题。了解更多信息请访问 https://siduction.org。


    # CACHOS 24221

    该操作系统基于 Arch，强调速度和安全。这意味着最新版本的内核现在正在使用 AutoRCF。性能基准通过一系列化的测试运行，包括 CachyOS Benchmark、Git
    操作和内核性能。OpenGL 驱动已替换为 Mesa 栈中的 RustLin，以提高性能。Cachy 还支持蓝牙，用户可以解锁额外的 Wi-Fi 通道。更多信息请访问
    https://cachyos.org。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_4.png)


    CachyOS 拥有免费的 Wi-Fi 和蓝牙支持。


    # TAILS 6.8.1

    我们今年为 TAILS 实现了近一百功能。这包括对 DKVK 的 d3d12 支持，使内核 6.5 支持 Linux，以及在 XDOC 2024 上阅读我们
    Nouveau/NVK 更新演讲的可能性。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_8_5.png)


    这个专注于隐私的发行版基于 Debian 12 Bookworm，并针对用户进行了优化。尽管它在现场模式下运行，但最新版本包含了升级，防止操作系统升级工具被破坏。请使用这些功能启用可能的设置。Tails
    现在当分区损坏时会显示警告。Tails 还整合了最新版本的 Tor 浏览器和 Mozilla Thunderbird。详见 https://tails.net。


    这标志着管理上的重要转变。在过去的 2.5 年里，我们一直在补齐 Tails 过去八年的功能。在完全实现后，现在的重点是提高性能并支持新发布的硬件或功能。


    改进包括对应用和分区的更好的保护。


