    3D printing isn''t enjoyable, when we got the Formlabs 4 for testing, and finally
    understood the problem. Consumer-level resin 3D printers are not only messy but
    also require much guesswork. Formlabs eliminates the guessing by creating a tightly
    controlled and thoroughly tested ecosystem.


    Formlabs makes itself foolproof by limiting users to components that engineers
    have designed and tested, ensuring everything works together. Cartridges are tagged
    with RFID stickers, so the software can track your resins. It uses this information
    to determine settings, let know when to order more, and keep an inventory log.


    Not surprising, this tightly locked ecosystem is one of its biggest flaws. You
    can unlock the printer with third-party resins, but the licence to operate them
    is $249. If you cannot afford $50 on a bottle of resin, this isn''t the printer
    for you.


    Everything you need to get started. The Form 4 is as a solid build and comes with
    one vat and a manual cleaning kit. The only thing needed is isopropyl alcohol
    to fill the vat, which comes fully assembled.


    The build plate is factory-levelled. It does have an internal sensor to ensure
    the machine level is set, and it can accurately read the liquid contents of the
    vat.


    It''s a beautifully built machine with superior attention to detail. It has flip-top
    lid with a recessed handle. The glass surface over non-stick texture to prevent
    the resin from sticking to the glass.


    Formlabs resin comes in special cartridges that use a standard bottle cap on top
    and a flexible neck on the bottom. The Form 4 is also easy to dispense just the
    right amount of resin from the opening as needed.


    The vat has something we haven''t seen on a consumer machine - a wide blade. It
    stirs the resin to keep it blended, and it feels for debris in the tank.


    > The Form 4 camera monitors the printer and records times-lapse. If it encounters
    a chunk from a failed print, it stops the printer and alerts you.


    The Form 4 is 4K, which may sound inferior to the latest consumer-grade printers
