    # 评测


    # Intel Arc B580


    披上斗篷戴上尖顶帽，Linux Format 决战！


    在下一页中，我们将深入研究新的 Intel Xe 2 架构，查看首次运行的硅片。从纸面上看，B580 的功耗明显低于旧的 A750。B580 “仅”拥有 20
    个 Xe 核心，而 A750 为 28 个。Xe 从 SIMD2 到 SIMD3 的重构意味着 B580 的表现大致处于 Xe 架构的水平。


    规格

    Arc: BMG-G21

    工艺: TSMC N5

    Xe核心: 20

    着色器: 2560

    光追单元: 24

    频率: 2850MHz

    显存: 12GB, 192位, 196GB/s

    L2 缓存: 18MB

    纹理单元: 880

    TDP: 190W

    PCIe: x8 4.0 .0


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_18_0.png)


    我们还需要关注更高的频率，以便在现实世界中的性能能领先 28%。这种高水平的性能概述在 Linux 下的表现应该和在 Windows 下一样好。然而，对于
    Linux 来说，驱动程序尚未就绪，且性能比 A770 低 10%。在这一周期内，我们预计更新后会有所改进。当运行正常时，B580 在性能上显著领先于 AMD
    7600，即使在高设置和分辨率下也表现良好。但与 AMD 和 Nvidia 的新一代产品相比，B580 是预算显卡的强力选择。令人恼的伪影：《赛博朋克 2077》也非常适合测试光线追踪。好消息是性能，问题是会看到奇怪的伪影。其他游戏如《无边之地3》有很多伪影，但表现逊于
    A770，取决于具体游戏。《控制》的表现低于 A770，并且似乎存在微卡顿。《地平线黎明》的表现远低于 B580 并有明显的伪影。《魔环之门3》的运行速度只有
    Windows 的一半，情况类似。生产力基准测试各不相同，取决于库和优化。尽管驱动程序问题仍需解决。另一方面，Handbrake 在 B580 上的速度快于
    RX 7600 和 RTX 4060。


