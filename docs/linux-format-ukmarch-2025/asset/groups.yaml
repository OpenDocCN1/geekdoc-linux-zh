    # HOTPICS


    # DATA ENCRYPTOR


    # Cryptomator


    Version: 1.14.2

    Web: https://cryptomator.org


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_84_0.png)


    Despite flaunting their security credentials, most cloud providers leave some
    of your data unprotected. On top of that, they hold the encryption keys themselves,
    leaving you no option but to trust they take adequate steps to keep those keys
    from being misused.


    If this puts you uneasy using these data storage services, you can use Cryptomator
    to encrypt your data before handing it over to them. This ensures your data remains
    undecipherable by anyone else, be it the provider or a threat actor.


    Cryptomator works with any cloud storage service and allows you to synchronize
    with a local directory in your filesystem. It can work with many popular services,
    including Dropbox, Google Drive, OneDrive, MEGA, and your own cloud server.


    There are multiple ways to install the app, and the project recommends using the
    distro-agnostic


    You can create multiple vaults with Cryptomator. Each vault is protected by a
    password and can contain as many files and folders as you like.


    AppImage. After downloading, making the app allows you to encrypt, edit, or delete
    files with your favorite file manager.


    The app has an intuitive interface. For that to work you must first create an
    encrypted Folder, or Vault. Add to > New Vault to your drive. Name the vault and
    protect it with a password. Everything inside the vault is encrypted using AES
    256-bit key.


    Once configured, let your cloud storage service sync the newly encrypted folder
    with the cloud drive, and you''re done.


    Every time you save on changes, Cryptomator encrypts the data automatically, maintaining
    the file structure. The cloud storage service does the rest and ensures your data
    is synced online.


    # FILE SYNC


    # Synthing


    Version: 1.21.1

    Web: https://synthing.net


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_84_1.png)


    If you have between multiple computers, manually transferring files between them
    can be a challenge. Synthing can help you access your files on another computer
    by synchronizing them over the network or the internet.


    Synthing is great for sharing files and extracting data with anyone. You can use
    tar and synthing to compress the extracted folder


    It fires up a browser and takes you to an administration interface. By default,
    this interface is the only way to manage the server, that is localhost:8384. You
    can also set a GUI username and password to access the administration interface.


    Now repeat the process installing Synthing on the other computers you want to
    sync with. Each installation gives a unique ID listed under Actions > Show ID.
    You will have to manually copy this


    between the computers to be able to sync files. Add Remote Device to get this
    done.


    By default, the app syncs the default folder (+Sync), and you can add more directories
    and the folder you want to share with other devices.


    During sync, all data is encrypted using TLS and transferred directly through
    peer-to-peer connections, without touching any third-party cloud servers.


    While sharing, you can instruct Synthing not to make changes in the original file
    when they''re changed on a remote computer. If you enable this, only changes made
    to files in the original computer are sent to the remote shares, not the other
    around.


    Synthing offers very flexible file selection settings. After starting, check the
    app''s documentation to use it effectively.'
