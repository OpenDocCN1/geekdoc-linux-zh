    # RPG 评测


    为了寻找合适的词汇，英语的深度显得不忠诚，当这些词汇不够用时便进入。“这是一种石头、剪刀、甚至是思想的生活，”这是对一个更大胆的人的描述。


    世界构建和故事非常有吸引力，因为《奎德》汲取了多种来源，不仅仅是游戏和显而见的流行文化。它的文化边界远超许多其他作品的限制。玩一个没有《沙丘》、《太阳之书》或《伽马》的游戏是一种乐趣，它还引用了洛德·拜伦和
    AE House，所有的都指向希伯来圣经。


    ## 变得奇异


    你角色的特征和背景和你的一样丰富。你可能是一个真人类（True Kin），旧人类最后的残余之一，选择你的生物学并成为食地者的技术——机器人、义体植入物和机械装置，以及你如何通过这种超大特征和自由硬件来增强自己，同时进行双手的改变。带着喙、翅膀、夜视和天赋，你的变异力量增长到可以拯救你：你拥有超能力的能力的变异，或者是义体化和分解。你可能扮演一个纯粹物理的奇美兽，长出
    12 只手臂，或者扮演一个纯粹的精神体，变得强大到让食地者从你的身体中提取能量。让《奎德》如此的不仅仅是多样性，还有模拟的深度。当你深入深处时，你可以计算出多少价值或伤害。在考虑统计和属性时，你真的必须处理大于
    30 的数字。但《奎德》的世界由物理模拟驱动，让你能在墙壁上行走，爬进岩石洞穴或呼吸随风移动的派系气体。你遇到的所有角色都有性格，以及在生活中展现的抱负。你可能重生，导致变异房间的变形者


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_24_0.png)


    掌握《奎德之洞》，老练的玩家可以在 15 分钟内跑完主线故事。


    # 结论


    | 类别 | 得分 |

    | :--- | :--- |

    | 画质 | 7/10 |

    | 玩法 | 9/10 |

    | 耐玩度 | 10/10 |

    | 价值 | 9/10 |


    《奎德之洞》在玩法和故事方面是一项定义类型的成就。


    - 评分 9/10


    玩家开始时充满能量。


