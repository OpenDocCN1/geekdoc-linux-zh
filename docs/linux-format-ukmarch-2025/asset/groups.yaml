  mdcn: "\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_88_0.png)\n\n# 你能帮助激发下一代代码爱好吗？\n\
    \nCode Club 是一个全国性的网络，为 9-11 岁的儿童提供由志愿者领导的课后俱乐部。\n\n我们一直在寻找具备编程技能的人员，志愿者在当地的小学、图书馆或社区中心每周运营一小时的俱乐部。\n\
    \n你可以与同事结伴，会有老师在那里为你提供支持，我们将提供你所需的所有材料，帮助孩子们对数字制作产生兴趣。\n\n有很多种参与方式！如需了解更多信息，请访问\
    \ www.codeclub.org.uk 加入我们。\n\n# 编程学院\n\n第二部分！不要错过下期节目，请在第 16 页订阅！\n\n## B2\n\n\
    致谢：https://github.com/tom-sedson/b2\n\n# 使用 Basic 编写 b2 基础版太空入侵者隆\n\nNate Drake\
    \ 邀请你通过用 Basic 编写自己的《太空入侵者》克隆版本来驱散外星威胁，因为现在是 2025 年！\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_89_0.png)\n\
    \n在本系列的第一部分中，我们介绍了 Basic，并通过创建像 Mark Buckley 的《Cosmic Invaders》这样的游戏，发现了它是学习编程的理想工具。\n\
    \n如果你阅读了文章并使用了来自 https://github.com/azuregate/cosmicinvaders/ 的示例，你现在将拥有一个播放简单曲调的彩色项目，然后学习如何在\
    \ Basic 中玩太空游戏。\n\n按下空格键开始游戏，发生的所有只是效果中的一条消息。在原始脚本中，这间接启动了 `PROCSetup_Game` 过程。你可以运行第\
    \ 2230-2280 行来查看它的作用。正如你所看到的，第 2240 行 `CLS` 是清除屏幕上任何现有文本的简写。\n\nNate Drake 是一位专门从事网络安全和复古游戏的技术记者。他的第一次视频游戏体验是在父亲当地商店里玩“鸡尾酒”版《太空入侵者》。\n\
    \n本月，我们将关注加载游戏变量，例如屏幕元素和外星人的移动。我们正在使用 b2 Basic Micro 模拟器。Ubuntu 软件中心中有一个快照，方便安装。本系列的代码在其他编辑器中也可以运行：如果可能，请将你的程序设置为像我们做的那样运行\
    \ b2 第 1770 行，否则它的渲染结果可能与你看到的不同。\n\n游戏设置\n如果你阅读了最近的脚本 COSMICA，你会看到当玩家呈现\n\n接下来的两行定义了子弹和外星人的数量。在开始时，你会注意到我们的朋友\
    \ `VDU` 命令：\n\n允许左移动。`UNTIL` 命令允许过程继续，直到检查剩余（生命值）`Base` 的数量；如果 `Lives` 低于零，则游戏结束。第\
    \ 1740 行还利用 `RANDOM` 命令通过 `PROC_KEY_Test` 持续检查输入以移动\n\n接几行使用值 `X` 来计算一行外星人的水平位置，然后按照《太空入侵者》的方式让它们左右移动。第\
    \ 1800 行在外星人移动时让它们在空位置移动。\n\n该过程随后调用了多个过程，例如 `PROC_Line`，它用于显示玩家当前的得分、高分和剩余生命值。\n\
    \n如果你让游戏运行起来，示例脚本中调用 `Setup_Game` 的行将按步骤执行\n\n## 管理变量\n\n如果你执行了来自 https://bit.ly/3ht3S2SpaceInvaders\
    \ 的代码示例，你会注意到只有这个（COSMICA）的末尾有一行代码显示了当时的图形元素。这是因为一个关键过程（`PROC_Main`）被用于清除页面并打开了下一个脚本\
    \ `COSMICS_B2`。\n\n现在当玩家按下空格键时，不再调用 `PROC_Setup_Game`，而是调用 `PROC_Line`。在 `PROC_Line`\
    \ 过程的第一行中，调用了 `PROC_Setup` 来绘制游戏元素、护盾和外星人。然后 (1740) 它利用了 `RANDOM` 命令通过 `PROC_KEY_Test`\
    \ 持续检查输入以\n\n# 太空入侵者编程学院\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_90_0.png)\n\
    \n`Setup_game` 调用过程来显示得分和护盾等元素。其他过程则管理敌人和外星人。\n\n`PROC_Colour_Setup` 将屏幕移动彩色区域。任何移动到新区域的对象都会获得其分配的颜色。\n\
    \n```\n390 UNTIL A = \"\"\n400 PRINT \"Game starting...\"\n```\n变为：\n```\n520\
    \ UNTIL A = \"\"\n530 Starts=4\n540 Score =%\n550 Bases=3\n560 PROC_Setup_Game\n\
    ```\n\n它使用了我们在上一个教程中涵盖的快捷代码 `GS` 和 `MS`，用绿色和洋洋色打印“HS”（高分）以及高分本身。下一行将光标移动到第一行。然后在同一行中打印玩家的得分。870\
    \ 行移动光标并将文本设置为青色。玩家的生命数可以显示在屏幕底部（第 880 行）。简单的代码根据玩家拥有的每个生命值（由字符 `ppr` 定义）插入文本，由\
    \ `Bases` 决定。当玩家按下空格时，`Bases` 被设置为 3。如果你想，可以修改它。花点时间阅读代码，查看高分和得分在屏幕左上角和右上角的。你会看到每个生命对应一个灰色基地。\n\
    \n在示例中，你会发现数字不同。这是因为我们的示例脚本没有包含原始游戏中的所有字符（位于第 115-130 行）。\n你可以插入自己的行，或者通过 https://github.com/SpaceInvaders/blob/master/COSMICS.bas\
    \ 添加蓝色玩家。\n\n你还会注意到空格键提供了一些重要的变量，例如护盾的起点、当前得分和初始生命数（3）。\n\n你可以定义自己的 `Setup_game`\
    \ 来匹配你的当前得分，例如：\n\n```\n780 PROC_Setup\n790 %O = %S Score: %O = %R; B = %B\n800\
    \ MS*Bases=3;FOR I = 1 TO 100\n810 MS*Bases(I),I = 0\n820 MYSTERY%=false;FILE_MIS%%X\
    \ = \n830 MS%%(I)=0;\n840 PROC_Line: Info\n850 ENDPROC\n```\n\n### 护盾\n没有一组用于抵御外星威胁的护盾，《太空入侵者》是不完整的的。如果你玩原始游戏或运行《太空入侵者》脚本，你也会吸收护盾的火力，面临过早毁灭的风险。如果玩家从下方击护盾，它们将受到损坏。\n\
    \n你会发现上述内容与原始游戏脚本几乎相同。然而，`Setup_game` 只调用了另一个过程：`PROC_Line` 信息。\n\n在这种情况下，护盾具有可以阻止子弹的特殊字符\
    \ `CHR$`。这个区块形成了复杂的形状，类似于外星人的形状。\n你也可以使用以下字符串定义自己的护盾：\n```\n400 Shield$B=BL+BL+BL+BL+B+B+B+B\n\
    ```\n```\n840 PROC_Line: Info\n850 PRINT(0,I)44\"Score:(I)\n860 PRINT(0,J)44\"\
    Score:(I)\n870 FOR I = 1 TO 100\n880 NEXT\n```\n\n"
