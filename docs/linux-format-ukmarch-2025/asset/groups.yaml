    # VIDEO CONVERTER


    # HandBrake


    Version: 1.9.0

    Web: https://handbrake.fr


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_82_1.png)


    Unlike audio files, transferring high-definition video files to other devices,
    especially portable ones, takes time. HandBrake can convert all kinds of video
    into a variety of formats, optimizing them for both quality and size.


    The app can convert any video format and supports a wide range of codecs. One
    of its best features is the built-in presets for popular devices that make the
    encoding process a breeze.


    The app is officially distributed as a Flatpak and can be installed with install
    flatub handbrake.fr. Compared to some of other tools, HandBrake has a user interface
    that might seem more confusing than it actually is.


    # LET''S EXPLORE HANDBRAKE...


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_82_2.png)


    In addition to audio tracks, you may want to append the video you wish to convert.
    With HandBrake, you can also convert videos directly from a DVD or Blu-ray disc.


    After selecting a source, you can choose to convert it for a particular device
    by selecting one of the presets. A preset is a group of settings specifically
    tailored to the device you want to play the content on.


    Throughout the rest of the process, HandBrake suggests a name based on the original
    file, but you are free to name the file as you like. You can also adjust various
    settings just as starting points, which you can customize – for instance, by manually
    picking different video and audio codecs...


    When you''re ready, just hit Start to begin the video conversion.


    +   1. Select a source

    Begin by opening HandBrake a video file or a full folder of videos. You can drag
    and drop the video files directly into the source.


    +   2. Select a title

    Some sources, such as DVDs, contain more than one video clip, a collection of
    titles. Use this to select the clip you want to use.


    +   3. Select a preset

    HandBrake includes a number of presets for specific devices and for general use.
    Select the one that most closely matches the device you are working on.


    +   4. Select encoding

    If you know what you''re doing, use the various tabs in this section to change
    the audio and video settings to the device you''re converting.


    www.techradar.com/pro/linux


    March 2023 | LFX325'
