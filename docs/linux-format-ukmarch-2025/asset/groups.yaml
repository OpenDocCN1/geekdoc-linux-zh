    media, go to hamburger menu > Shared Folder. This lists all the shared folders.
    Once you''ve added all media, you can start streaming to any of the compatible
    devices.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_83_0.png)


    sure you''ve switched on the device before starting the UMS server. Each UPnP
    device is listed in the main admin page under the Detected Media Renders. In addition
    to DLNA/UPnP, you can also stream media to desktop players like VLC Media Player
    and Kodi. These players will be able to detect UMS without any issues. You can
    then browse the shared directories and any media supported by the local machines.
    Furthermore, you can also stream to a computer without any specified DLNA/UPnP
    compatible app. The UMS serves with a web address that can be accessed from a
    web browser on any computer on the same network as UMS port 9005.


    You can use Universal Media Server to stream content from Linux box to any DLNA-compliant
    device.


