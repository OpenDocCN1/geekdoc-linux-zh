    ## Asus ZenWiFi AX (XT8)


    The best router money can buy.


    - SPECS

    - Wi-Fi: Wi-Fi 6 (IEEE 802.11ax), tri-band 2.4GHz, 2x 5GHz

    - Speed: 6.6Gbps+

    - CPU: Quad-core Broadcom BCM6755

    - Mem: 512MB

    - SSD: 256GB

    - Beamforming: Imprint and explicit for 5GHz

    - Ports: 2.5Gb WAN, 3x Gigabit Ethernet, 1x USB 3

    - Size: 161x160mm, 756g


    has come making Wi-Fi 6 routers, and the manufacturer covers just every need and
    budget. With the Asus ZenWiFi AX (XT8), it delivers Wi-Fi in the form of a mesh
    router. While it is among the more expensive options out and limits you to two
    mesh routers, the Asus ZenWiFi AX offers impressive speeds. During our tests,
    it pushed out 500Mbps connection to almost every room, and it stayed pointed at
    370Mbps in less accessible areas of our space. Asus uses one of the 5GHz bands
    to be used as a backup that provides a high speed link between the mesh routers,
    while still leaving the remaining 2.4GHz and 5GHz to transmit data to your computers
    and mobile devices.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_71_0.png)


    The Router app and setup aren''t quite as straightforward as we''ve seen from
    other makes, but once you''ve got everything running, the app does a nice range
    of features. This Includes AI Protection features, which keeps an eye out for
    malicious websites, malware and outside attempts to hack into your home network.
    Many routers charge subscriptions for security features and parental controls,
    so it''s good to see these providing features before any additional charge.


    With top-notch speed and features by default, it''s our choice. With excellent
    features to boot, this is a fantastic choice if you''re looking at mesh routers.
    Cliff Joseph


    > VERDICT

    > DEVELOPER: Asus PRICE: £177

    > Rating 9/10


    ## Nighthawk RS300


    All Wi-Fi 7 tech, with some of the cost?


    - SPECS

    - Wi-Fi: Tri-band Wi-Fi 7 (2.4GHz, 5GHz, 6GHz)

    - Speed: 9.3Gbps+

    - Ports: 2.5Gb Ethernet (WAN), 2x 5Gb & 2x Gigabit Ethernet (LAN), 1x USB 3

    - CPU: Quad-core

    - Mem: 512MB

    - SSD: None

    - Size: 249x150x102mm, 950g


    Netgear rarely topples itself with the affordable end of the market. That''s why
    we were pleased to see that the Nighthawk RS300 costs a relatively £249, making
    it the most affordable Wi-Fi 7 router we''ve ever seen. There are also faster
    Wi-Fi 7 routers, like Netgear''s Orbi, but the tail, as always with Netgear, is
    the persistent tends to ask for additional subscriptions, as its Armor security
    services and parental controls – especially when there are rivals that provide
    solid performance at no extra cost.


    The Nighthawk app allows you to scan a QR code to connect to the RS300. You do
    need to create a name and password to use the app. It creates a single unified
