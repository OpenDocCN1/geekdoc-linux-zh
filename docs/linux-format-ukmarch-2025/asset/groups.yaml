    you can see fainter other celestial objects such as asteroids, clusters, nebulae
    and galaxies.


    Clicking on an object in the status bar centers the object and begins tracking.
    Each object also has a context-sensitive popup that displays specific information.
    You also get links to related web pages with more details as well as images taken
    by the Hubble Telescope and other observatories. One interesting thing you might
    like to explore is What under the Tools menu, which summarizes the objects you
    can see from your location today.


