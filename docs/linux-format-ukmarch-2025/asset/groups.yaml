    ## New Nvidia Linux AI hardware


    Project Dig is world''s smallest supercomputer.


    Nvidia has used CES 2025 to announce its new personal Project Dig. The supercomputer
    the device is aimed at AI researchers, data scientists and students.


    Although there has been no confirmation of this, Nvidia claims a single Project
    Dig unit can run with up to 20 GPUs. Nvidia also says that two Project Dig units
    can be linked to up to a 40-node model.


    It comes with Nvidia GB100 Blackwell Chip, which delivers up to a four-fold performance
    increase compared to one generation Q100 all.


    At a press conference, Jensen Huang claimed that it can run the Nvidia Linux-based
    DGX OS, which is specifically optimised for AI workloads. It also comes with 128GB
    of unified memory and up to 4TB of NVme storage device. It can operate as a standalone
    device or be connected to a Mac or PC.


    This computing power comes at a cost: the starting price for a single Project
    Dig unit is $30,000.


    Those who are willing to pay access Nvidia''s NGC catalogue - a curated set of
    software for AI, HPC and visualization. DG OS also supports frameworks such as
    PyTorch, TensorFlow and Jupyter notebooks.


    LibreOffice is more than just a productivity suite, it emphasizes its commitment
    to freedom.


