    # 开放地图教程


    ## 任何地点的 3D 场景


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_60_0.png)


    Blender (blender.org) 是一款开源工具，可以为任何事物物制作复杂的 3D 模型。得益于 Blender 插件 (https://github.com/voyvoy/blender-osm)，你可以从
    OSM 甚至 Google 3D 城市导入地图数据，并将其用作为你想要为计算机游戏或其他任何目的创建的 3D 场景的任何基础。得益于 Blender，你可以直接生成像（右侧）那样的场景，具有正确形状、高度和层数的建筑，并结合道路、河流和其他
    OSM 对象、GPS 轨迹，以及根据每个地点的 OSM 海拔数据放置在 3D 地形模型之上。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_60_1.png)


    Blender 模型插件可以将任何 OSM 数据转换为你可以完成的 3D 场景。


    Mapbox 生成的 OSM 数据中的图钉是包含相应位置信息或图片的弹出窗口。


    （真实的 OSM 数据）。然而，它的主要价值在于，你所选择并与数据源关联的地图部分是重要的。通过 Field Papers，由于空间限制，我们只需了解你可以用
    OSM 或详细制图做些什么。请参阅 OpenStreetMap 网站上的咨询。


    首先，正如我们提到的，可以包含任何内容的数据——即文本、图像和其他事项的任何组合——是每条记录——即每份数据——都是经过地理标记的。这意味着每条记录必须包含该地点的精确地理坐标，OpenStreetMap
    提供了有关如何操作的说明链接。


    数据可以由第三方源动态更新，也可以包含在文件中。第一种方案更灵活：每当你更新服务器上的数据时，用户地图都会显示新值，无需任何进一步操作。


    第二种方案较差，至少在原理上如此，因为数据的任何变化无论多小都必须手动更新。在实践中，除非数据服务器已经存在，否则单文件方案更易管理和维护，特别是当数据经常变化时。


    你可以看到（上方）OS 是如何做的：对于每条记录，即在标记器的相应位置，点击后会打开一个包含相关文本或图像的弹出窗口。可以为标记器选择不同的形状，并让它们呈现与其原始数据对应的不同颜色。


    如果你想要一个带有比标准 OSM 图标更多、更好的图标的嵌入地图，请尝试 Map Machine (https://github.com/enzet/map-machine)，以及一个自动从
    Rington 图标集中添加图标的简单 Python 脚本。


    ## 掌控你的路线


    如果你想找到你的 OSM 地图的完整版本，请查看 OpenFreeMap (https://openfreemap.org)，这是一项于 2022 年 9
    月启动的服务，旨在“让你的自定义地图显示你的网站上并与他人分享”。必要的软件和数据位于你可以从任何供应商处租的廉价入门级虚拟服务器 (VPS) 上。


    课程笔记：如何满足你的制图需求、要求和技能，就是 OSM 地图，它可以帮助你了解从何处开始。


    > 小贴士

    > 世界充满了各种数据，如果这些数据在视觉上与地点联系起来，将非常易于学习和理解。尝试用地图来实现这一点吧！


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_60_2.png)


    ## 伦敦


    这个伦敦的三维渲染图是你可以使用 OpenFree 软件包在自己的服务器上托管并显示的地图示例。


