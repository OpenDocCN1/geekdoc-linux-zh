    除了简单的屏幕录制视频，它还能做什么呢？


    OBS Studio 是一款流行的流媒体传输和录制工具，其用户界面对于这项任务来说非常简单，但提供了许多选项。OBS Studio 拥有极其健康的生态系统，拥有各种小众用途的视频和脚本，例如添加屏幕软键盘或鼠标指针。


    相比之下，Screen-Reader 拥有 OCR 功能，可以读取屏幕上的文本元素。它还可以进行直播，且其 GitHub 页面提供了一些如何配合多种流行直播服务的说明。


    FFmpeg 不仅可以录制，还能进行直播。在使用 FFmpeg 的每一个方面时，你都需要研究其用到的命令行选项。如果你有特定的录制或直播场景，那么 FFmpeg
    是显而易见的选择，因为它通过命令行进行操作。它也是视频音频文件转码的选择。毕竟，你必须学习正确的命令行选项来完成这些操作，但它是一把你可以研究学会的视频转换和录制设施的瑞士军刀。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_29_0.png)


    OBS Studio 有许多插件和扩展系统。Screen-Reader 有一个可搜索的扩展，其中包含了关于使用哪些评论。


    VideoScreenNG 有一个内置播放器，可以播放上一次录制的视频。我们喜欢最后一次播放是一个完整日志的方式，这对故障排除非常方便。正如其名称所示，SimpleScreenRecorder
    专注于核心功能，而不是特别的可扩展性。


    ## 结论


    | SIMPLESCREENRECORDER | 7/10 | 6/10 |

    | :--- | :--- | :--- |

    | OBS STUDIO | 10/10 | 6/10 |

    | FFmpeg | 8/10 | |


    OBS Studio 有很多功能，但通过脚本插件，它提供了我们所需的功能。


    ## 配置界面


    寻找设置、理解设置并更改它们。


    第一次使用 OBS Studio 时，你会遇到一个向导，该向导允许你简要地优化录制或使用摄像头的设置。在设置对话框中，有很多选项，可以对录制进行精细控制。设置按标签页组织，但并不是说它们不可搜索，问题在于
    OBS 拥有很多功能，这些功能有不同的设置方式，这是另一个让它与某些其他软件相比显得专业的特性。


    在 SimpleScreenRecorder 中，你会一次性面对所有设置，这有点像向导风格。剩下的就是寻找一个将这些设置添加到基础功能中的应用。如果你有一个需要但冷门的设置，可能无法进行它，除非停止当前录制并再次运行向导以进行任何更改。


    VideoScreenNG 的设置始终通过标签页界面呈现。如果你不太可能想在点击录制按钮之前更改视频代码的话（这没问题）。好的一方面是，设置有清晰的标签——


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_29_1.png)


    在 VideoScreenNG 中，当你使用程序时，所有各种标签页都触手可及。它有自己的优势，但可能会感觉很杂乱。


    例如，像单行可视化这样的非常易于使用，我们可以说显示已安装解码器或键盘快捷键的页面也是如此。


    FFmpeg 是通过指定命令行开关来配置的。它非常灵活，但很难学习。通过命令行界面，你可以通过创建一个包含你所设置的所有设置的 Bash 脚本来保存你的配置。


    ## 结论


    | SIMPLESCREENRECORDER | 7/10 | 7/10 |

    | :--- | :--- | :--- |

    | OBS STUDIO | 9/10 | 7/10 |

    | FFmpeg | 6/10 | |


    OBS Studio 的配置井然有序，值得对它提供的额外功能投入信心。


    30 LXifer 2025年3月


    www.linuxformat.com


    ## 屏幕录制器 汇总


    ## 结论


    ## 屏幕录制器


    OBS Studio 通常被认为是面向专业人士或专家，大多数用户应该能够快速学会如何使用该程序。功能最全的开源录制器意味着牺牲了一些简单性，但考虑到它能做的一切，这是非常值得的。另一个重点是界面本身可以精简内容或添加你需要的元素。对大多数类型
    GPU 的硬件支持能够实现高效的性能而不需要延迟。插件和其他工具的库将其灵活性推向了极致。SimpleRecorder 的功能比其名称暗示的要全一些。它可以涵盖正常屏幕录制的各个方面，而不会引导你通过复杂的设置。话虽如此，你可能需要的微调都是存在的。它并非设计用于作为广播应用程序。VideoEncoder
    有选项处理所有情况。如果你发现自己需要程序的其他方面，你就会进入这样一个忙碌的界面。该界面清晰直观，虽然功能没有 OBS Studio 丰富，但它达到了质量设置控制的良好水平，允许你处理各种情况。Atlas
    是一个简单的工具，可以处理典型的录制场景，初学者可以比其他录制器更快地上手运行。目前，由于 Ubuntu 等发行版中对全局扩展页的限制，最新版本有点繁琐。FFmpeg
    可以处理投送以及各种视频相关任务。它是一把你可以研究学会的视频转换和录制设施的瑞士军刀。


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_29_0.png)


