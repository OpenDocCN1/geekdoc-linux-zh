- md: "\n# PI SSD BOOST\nThe hottest upgrade for your Pi: M.2 drives\n\n# PASSWORD\
    \ IT!\nSwitch to KeePassXC for enhanced security\n\n# FASTER WI-FI\nConfigure\
    \ your new router to run faster!\n\n# LINUX FORMAT\n\nRECORD IT ALL!\nStream your\
    \ desktop for tutorials, game playing and more\n\nThe #1 open source mag\n\n#\
    \ FIREWALL\nYOUR HOME\n\nProtect your network and block all net nasties at the\
    \ door with Linux!\n\n- Isolate devices for total protection\n- Deploy a DNS to\
    \ block adverts\n- Run custom router firmware\n- Safe external network access\n\
    \n![](img/e610c7a095fcd2c0c411ff707edde0b3_0_0.png)\n\n# PLUS: HOW TO\n\n>> Message\
    \ BlueSky from your Pi\n>> Get coding with Space Invaders\n>> Relive punch card\
    \ coding days!\n\n# BATTLEMAGE!\nWhat makes Intel's new GPU silicon tick so fast\n\
    \n# AUDIOCAST\nBroadcast your audio over Bluetooth easily\n\n# POLISH YOUR RUST\n\
    Get started with the must-have language\n\n# BRAIN TUMOURS MOVE FAST. WITH YOUR\
    \ HELP, WE CAN TOO!\n\nWe’re working to create a future where brain tumours are\
    \ curable. We urgently need your help to accelerate research.\n\nText DEFEAT5\
    \ to 70507 to donate £5, please help us to find a cure.\n\nthebraintumourcharity.org\n\
    \n# WELCOME\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_0.png)\n\n# >> MEET\
    \ THE TEAM\n\nWe're firewiring our home networks in different ways this issue,\
    \ so what quick security trick do you use to make your home safer?\n\n# Steaming\
    \ hot!\n\nI've always said – not that anyone listens to me, although Linux has\
    \ the same – that the year of the Linux desktop would never happen until it was\
    \ installed by default on some popular consumer system. So Valve goes and, handheld\
    \ and Deck, Linux SteamOS on its own gaming desktop has shared 5% and SteamOS\
    \ is now outrunning third-party systems.\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_1.png)\n\
    \nAs 2025 starts to pick steam, it really feels as though Linux has finally come\
    \ of age, reaching into every aspect of our lives, from Pi-embedded devices, and\
    \ gaming systems to laptops, phones and TV. If any say Windows now holds the niche\
    \ operating system, consigned to just consumer PCs, there might be one or two\
    \ billions of Linux users currently counting.\n\nThat popularity, though, means\
    \ PCs and the networks we're on remain a major threat. We're focusing on network\
    \ security, wondering how to use Linux to protect your home from intrusion and\
    \ the internet, securing access to it. Firewalling that network can be a game-changer,\
    \ so we've hit the right balance of better using the hardware you already have\
    \ by creating VLANs or running OpenWrt, alongside expanding-into the simplest\
    \ of solutions, so we'll learn a lot about how networks work and how to protect\
    \ them better.\n\n# Matthew Holder\n\nMaking my home safer involved turning off\
    \ any port forwards that were being used. Mainly for SSH/VPN access. Swapping\
    \ to a VPN, which can negate NAT, has meant that my home is safer than before.\
    \ Any time I need to access via VPN.\n\n# Michael Reed\n\nWhen we interact with\
    \ other users, don't let anyone use it unless you need to have a guest user account.\
    \ When it comes to the home network, most routers have a restrictive WiFi needs\
    \ to be enabled.\n\n# Nate Drake\n\nMy Wi-Fi network is kept on Surveillance to\
    \ keep potential intruders at bay. I've set up a VLAN for my iot devices. My smart\
    \ toaster cannot connect to my PC and stay my sourdough recipes. It's all about\
    \ staying one step ahead of these cyber-crumbs\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_2.png)\n\
    \nNeil Mohr Editor\nNeil.mohr@future.net\n\n# Les Ponderluk\n\nI run my Pi-hole\
    \ DNS server on a Raspberry Pi 3B+. The Pi-hole blocks ads and many other annoyances\
    \ that dominate web pages right now. There are some issues, but I can fix them\
    \ from the console and fix them from my phone.\n\n# Nick Peers\n\nI've discovered\
    \ how to redirect subdomains so they work on my home network– this allowed me\
    \ time to use my self-hosted WireGuard VPN, so I'm only accessible through my\
    \ home network (or so, my passwords have an extra security layer.\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_2_3.png)\n\
    \n*Savings are at the cost of coverage.*\n\n# Contents\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_0.png)\n\
    \n# REVIEWS\n\n![](img/e610c7a095fcd2c0c411ff707edde0b3_3_1.png)\n\n# ### FIREWALL\n\
    YOUR HOME\n\nKeep out net nasties and track what comes in and goes out of your\
    \ home network with vital help from Matthew Holder.\nSee page 32!\n\n- **Intel\
