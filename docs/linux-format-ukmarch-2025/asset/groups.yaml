    Maps are so beautiful and useful, they don''t need to be a sidekick. They are
    also a great addition to documents of any kind, from university papers to concert
    posters, and can enrich any object (such as giving your a T-shirt decorated with
    the location of your first kiss marked on a map of). Great tool for this kind
    of project is prettymaps


