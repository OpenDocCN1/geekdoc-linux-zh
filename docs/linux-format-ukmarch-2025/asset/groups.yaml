    # 教程 穿孔卡


    # 经典设备


    ## 通过穿孔卡和磁带重温过去


    与极具复古风的迈克·贝德福（Mike Bedford）一起，通过在过时的圣诞卡片上打孔，重温数据输入的世界。


    从计算早期开始，性能的指数级增长确实令人惊叹。事实上，我们对计算机历史的偶尔回顾已经说明了速度、内存容量和存储容量经历了飞跃性的增长。也许不那么明显的是，这种趋势与过时并肩出现。某些曾经是这里不可或缺的硬件现在已消失在我们的世界中。


    穿孔卡（指可以在纸板上打孔的片）听起来可能不像今天那种很快的东西？问题是，今天任何处于电子计算领域的人都会推测他们是否用过它。但这里有一个重要的事实：穿孔卡用于带有计算机的设备，但有些也被用于其他设备。


    由约瑟夫·玛丽·雅卡尔（Joseph Marie Jacquard）设计的穿孔卡最早在1804年就被用于控制纺织厂的织机。到19世纪末，即该世纪中期，它们被用于创建、排序和制表数据。在早期的穿孔卡中，穿孔卡与IBM在1928年制造的主机计算机同名，通常被称为IBM卡片。它的尺寸比三张纸要大得多，为187mm乘83mm，且呈矩形。它被用作穿孔卡，是每个字符或数据的图形表示。同时，垂直列中的位置可以是每个字符被打孔的位置以创建孔。孔的存在与否代表了字符的值。


    这种基于EBCDIC编码方案的二进制代码，实际上在设计时就考虑了穿孔卡。我们不会深入这些细节，但如果你想知道如何尝试尝试一下我们建议的编码项目之一，


    # 我们的专家 迈克·贝德福


    想过过去穿孔卡上的故事数据吗？再次强调——它真的是一个QR码。或者真的吗？它是经过校准的：使用今天最好的入门级样品，一张包含4页的高密度棋盘格纸至少可以容纳10MB。


    ![](img/e610c7a095fcd2c0c411ff70edde0b3_65_0.png)


    卡片似乎不太通过掉落而移动，横跨卡堆侧面的一条对角线可能会帮助你重新读取它。你将发现内幕。我们要怎么说呢，虽然每列有12个穿孔位置，但只使用了64个字符。许多60年代和70年代的人还记得。我们支持的字符集是为了确保任何一列中不会出现超过三个孔。更多的孔可能会损坏卡片，并增加其在读取器中卡住的概率。


    如果我们将卡片的使用限制在数据输入，每张卡片可以包含一个孔来代表80字符容量中的某一个，但大多数时候只看前72个字符。这种限制是为了确保每列没有超过三个孔。一个程序需要几张卡片，这被称为一个“卡堆”（deck），就像扑克牌一样。


    在使用电机械卡片时，如果你愿意，你可能会自己打孔。你可能会提交你的程序卡片进行打孔，卡片最终会被馈入卡片读取器，读取器将你的字符传输到主机。并指出读取器在它最开始的阶段是一个电机械接触装置。穿孔卡片通过刷子转换为一系列字符代码，刷子在通过孔时会形成一个电路。最后，在卡堆被读取后，可能需要等待几个小时才能输出——这表明仅仅是一个代码字符就写错了。那是另一个故事了。


    然而，携带卡堆是有风险的，有时卡堆非常大。我们在设计卡堆时考虑到的是，带有自豪感且是一个完全随机的指令序列。教授经常会在卡堆侧面画一条对角线来简单地重新排序它们；另一种解决方案是使用序列号。如果你在一个配有这种设备的机构中工作，一张卡片可以及时加固你的卡堆。而仅仅由于疏忽，这可能需要重新调整卡堆。我们遇到过关于卡片通常比遇到卡纸的打印机更实用的说法。随之而来的卡片发现并没有比把它们掉在地板上更有效地洗牌卡堆。


    ![](img/e610c7a095fcd2c0c411ff70edde0b3_66_0.png)


    它看起来可能并不高科技——而且这很奇怪——但电机械穿孔卡是大多数人接触计算机的最接近方式。


    # 穿孔卡 教程


    ## 打孔或读取


    为了更好地感受管理数据的漫长日子——FORTRAN，COBOL，穿孔卡等等——你不知道自己身处何地。这里你看到一个看起来像打孔机的东西，一个空白卡片，你将看到卡片顶部的文本，以及下方对应的孔洞模式。当你完成后，只需按下穿孔卡你就会得到你的卡片。如果你将其打印并剪切，它是实际尺寸；如果你打印并用刀剪切，你可以将其剪成所需尺寸甚至将其折叠成形状。你还没有结束。为了检查卡片是否真实代表了你使用的字符，你需要前往虚拟读取器，你可以在这里找到，你可以将一张或多张卡片的图像拖到屏幕中心，你将看到它们变成文本。这个虚拟读取器使用光学处理，所以你可以写一些代码来完成同样的操作。重新调整卡片的位置，有的人更进一步——直到一个真实的读取器——在卡片处理上，有些人使用了带孔的穿孔卡。如果你想尝试这个，创建一个卡堆并从虚拟输出图像，这会占用你一些时间。>
    提示 键盘驱动的电机械穿孔卡成本便宜得多。每个键位每个孔都被按下了，指示了任何字符。


    ![](img/e610c7a095fcd2c0c411ff70edde0b3_66.png)


    # 槽孔卡


    卡片的近亲，槽孔卡是通过纯手动处理的。与穿孔卡不同，槽孔卡的整个边缘都有孔。每个边缘代表一个位。如果每个边缘有一个或多个槽，就可以表示数值，或者多个选择。这种编码通过在卡片的相应边缘来实现标记。每个位置的孔或标记通常在卡片上。一组卡片的组成是手工制作的。为了简化，我们只考虑卡片上的数据。每个卡片通过将线穿过相应的位置来选择。不符合标准的所有卡片被丢弃。符合条件的被选中。边缘的选择只需要旋转卡堆。这种排序的明显扩展将需要大量的选择。


    > 提示 不同的卡片通常用于不同的目的——例如作业控制指令、源代码和终止符。作为卡堆的帮助，我们允许操作员进行快速检查。


    ![](img/e610c7a095fcd2c0c411ff70edde0b3_67_0.png)


    面对现实——穿孔卡并没有比打孔机短得多。然而，你可以在网上找到一些。在我们的经验中，70年代的穿孔卡要稀有得多，而且通常很贵。


    # 从卡片到磁带


    我们现在从卡片转向磁带。虽然磁带对于某些应用已经足够——尽管在一段时间内——那不是我们要讨论的。相反，我们考虑的是穿孔磁带，它与穿孔卡关系密切，被用于循环，就像卡片一样。


    在我们称为的数据区域，磁带用于数据处理。用于数据连接的第一个穿孔卡溯到B5。每个位置可以有两个孔，外加排连续的小孔，与后面的卡片不同，每个位置没有插入二进制位，而是孔代表摩斯密码的点和划线。它的目的是让预制的消息比手动操作员能实现的方便得多。然而，现代纸带的真正前身支持孔，同样进行编码。通过使用字母和一些标点符号的位码，能够表示数字、大写字母和一些早期电打字。


    在计算机领域，在穿孔卡之前使用磁带，例如EDIPSAC计算机，但从未用于微型计算机。在很大程度上是因为微型计算机的内存非常有限，其中许多使用了穿孔磁带和读取器。关于磁带技术的详细说明将太详尽，但更多的孔允许表示ASCII字符。


    在微机时代，我们将提到的唯一的是使用棘轮（sprocket）。在磁带上每个可能的位置都有一个小孔，棘轮允许磁带以恒定速度驱动，而无需使用光学传感器为读取器提供信号。


    与可以排列成数据堆的卡片不同，通常会使用单段磁带。磁带要么在卷轴上，有时呈折叠端的形式。然而，磁带的机械问题在很大程度上被消除了。这意味着微型计算机使用的磁带是可以读取的吗


    >> 虚拟1301


    看到模拟按键打一张穿孔卡，以及读取器解释那些孔的模式是一个很好的开始。然而，可能更有趣的是看到一个带有打孔机和读取器的计算机的仿真。我们考虑的是IBM1301主机，它由国际计算机和制表机（International
    Computers and Tabulators）于1969年推出。这家公司最终成为了IBM的一部分，IBM生产了著名的1900系列主机。


    ![](img/e610c7a095fcd2c0c411ff70edde0b3_67_1.png)


    它将托管在https://commons.wikipedia.org/wiki/IBM_1301_emulator/以展示机器的影像表示——卡片读取器/打孔机——通过主控制台上的操作按钮控制。有很多指令和程序，但可能需要一段时间才能进入状态。如果你是复古计算机的粉丝，那将值得。


    对这篇文章有意义的是示例程序PUNCHDUP。它是读取单张穿孔卡并通过在打孔机上写一张新卡片来复制它。你提供了两个现成的穿孔卡选择可供PUNCHDUP程序使用。


