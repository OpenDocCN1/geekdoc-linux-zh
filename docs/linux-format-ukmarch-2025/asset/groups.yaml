    On first launch, the app brings up a Setup window. Here you are asked to select
    a layout from one of the available options. To experience them, you can select
    the player and the app''s interface in the background. The Empty layout is a blank
    slate, so if you''d like to create your own layout from scratch.

    With any media player, the first order of business is to pick your point to your
    music.

    Your library begins via Configure. Click the + icon to browse your filesystem
    and select the directory with audio files. Repeat the process to add multiple
    directories. Fooyin monitors the libraries and scans the added directories for
