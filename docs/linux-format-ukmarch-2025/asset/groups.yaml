    Unfortunate, this convenience didn''t extend the setup. After choosing the launch
    icon, we had to restart the system and choose the install mode. If you do, the
    setup assistant is identical to Debian. After choosing the correct partition to
    install and GRUB, setup in just over five minutes.


    As the project was little more than a splash screen, we were keen to see what
    the actual requirements were to run on Live WM, which is different (the specs
    on the left for Debian 12). This posed a problem because there is no system monitor
    that might be hidden with Gnome. However, we were able to run free by launching
    the system terminal in a pane. Here Open WM used around 750MB RAM. The install
    footprint was just 8GB.


