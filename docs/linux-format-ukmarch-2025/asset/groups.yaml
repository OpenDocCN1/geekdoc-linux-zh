    # Intel 新一代 Arc 系列深度解析


    ## Xe 2: 渲染切片 (Render Slice)


    对所有图形加速函数的深度微观和宏观分析


    针对降低延迟、消除停顿和改进软硬件交换进行了优化


    - 原生支持执行指令 (Execute instinct)

    - 单核心性能显著提升

