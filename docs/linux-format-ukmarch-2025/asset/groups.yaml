    tool from https://www.raspberry.com/software/. Once opened, click Device and select
    your device. For Operating system, find Raspberry Pi OS Lite, then in Storage,
    select the memory card and follow the options to select a username and password
    to enable SSH. You don''t need to connect the Wi-Fi


    this will be configured using RaspAP and connected to your network via Ethernet
    cable. Once the card has been written, eject it and insert it into the Pi. Connect
    Pi to your wired network and plug in the power. Back on the device used to write
    the memory card, in the terminal connect to the Pi via SSH: ssh username@address.


    Replace USERNAME with what was entered in the installing tool, and IP ADDRESS
    with what has been assigned by DHCP. Try to log in to your router to see what
    has been assigned. Use the script and package manager to install the necessary
    packages. RaspAP doesn''t support Ubuntu 24.04/24.10, so install Raspian OS on
    your card (https://raspap.com/). Test your setup by connecting a device to the
