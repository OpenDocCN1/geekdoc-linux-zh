    my home LAN to Roku and Apple TV devices that are in other rooms from the media
    server.


    I looked at Kodi first, as it was the first picks in the article, but there is
    no easy way for Kodi to stream other of these devices. I then looked at the second
    media server, Jellyfin, and I saw that it has official clients for my computer
    running Linux Mint 22, based on Ubuntu 24.04. It installed easily following the
    instructions at http://jellyfin.org.


    I installed the official clients on the Roku and Apple TV. The Apple TV is called
    Swiftfin. Both worked, essentially out of the box. Kodi is designed to be plugged
    into a device and operated via a remote control, which did not meet my requirements.
    Jellyfin works well, and I learned from LXF.


    Jellyfin


    We''ve looked at Jellyfin before, so check out the archive.


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_14_0.png)


    Why wouldn''t you put an NVMe slot on this?


    solutions on high-end graphics. VirtualBox did not introduce GPU acceleration
    in v6.1 in 2020, if you have a suitable GPU installed, but this is the main issue.


    # Pass the Pi


    I was disappointed that the Raspberry Pi 500 did not include an NVMe slot - that
    was a deal-breaker. Regarding the 15.6-inch screen to make it portable, why not
    go the hole and a laptop with them the PI 500 keyboard and a trackpad?


    Ian Stevenson


    Neil says..


    it''s odd of course, there''s another way for an NVMe slot - you have to wonder
    why they chose not to. Perhaps costs implications, issues with how to make user-accessible,
    or opening the way to upgraded models.


    # Staying focused


    The recent issue focus on containerization was a highlight for me. It''s great
    to see usage of tools like Podman alongside Docker, as many are alternatives for
    our servers. I also enjoy the hands-on guide for setting up Fedora - it''s refreshing
    to see practical projects for personal infrastructure.


    For future issues, I''d love to see more content on niche distros like NixOS or
    Void Linux, and deeper dive into Wayland''s adaption


    ![](img/e610c7a095fcd2c0c411ff707edde0b3_14_1.png)


    It''s a free-software Linux that uses its own packaging system.


    challenges. Thanks for keeping the focus sharp on topics that matter to the Linux
    community.


    Tim Ross


    Neil says..


    For the kind words, I''m trying to vary the level of things when we''re looking
    at, so we''re not always discussing soft-hosting or infrastructure-type projects
    and also normal desktop distros such NixOS and Void pretty soon, so look out ''advanced''
    distros such as NixOS and Void


