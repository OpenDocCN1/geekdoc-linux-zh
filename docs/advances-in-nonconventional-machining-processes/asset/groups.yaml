    ## (3) 操作因素

    - 压力

    -  standoff 距离

    - 进给速度

    - 切割倾角


    ## (4) 性能因素

    - 切割深度

    - 材料去除率 (MRR)

    - 切缝

    - 表面特性。


    在磨料水射流加工（AWJM）过程中，磨料颗粒起着关键作用。高速运动的磨料撞击工件，导致工件材料发生侵蚀。水射流赋予磨料颗粒如此高的速度。由于 AWJM 工艺的特性，它几乎可以切割任何材料
    [9]。在使用 AWJM 进行加工时，材料去除率（MRR）、表面粗糙度和生产率彼此相关。


    这些参数决定了表面质量，并决定了最终产品的功能性能。几何精度也是 AWJM 过程中的主要输出参数。


    通过考虑机械性能和行为，工件材料可分为两组，*即* 延性材料和脆性材料。这两组材料的加工机制各不相同。


    延性材料的加工机制可进一步分为两组，*即* 微切割和塑性变形，如图 **(3)** [6] 所示。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_72_0.png)


    图 (3). 磨料颗粒对延性材料的影响 [6]。


    另一方面，脆性材料表现出不同的切割行为。在切割过程中，脆性材料会经历塑性变形区和脆性断裂（图 4）。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_73_0.png)


    许多研究人员在这一领域开展工作，其中 Hashish 及其同事的贡献尤为显著。AWJ 锯在金属切割、飞机复合材料切割、金属和电路板切割等方面具有极强的能力。


    # **AWJM - 文献综述**


    研究人员研究了在加工 Al7475 铝合金时的 AWJM 过程。研究中考虑了各种参数，如压力、横向速度、距工件的距离和射流倾角。研究中使用了 3mm 厚的铝材。研究了加工过程中的疲劳寿命和材料去除率
    [11]。*Yue 等人* [12] 通过实验研究输入参数对 AWJM 过程的影响。通过改变压力、进给、磨料流速和喷嘴角度，观察其对 MRR 的影响。在切割氧化铝时，得出结论：同时增加压力和磨料流速可以提高
    MRR。针对一种特殊类型的 AWJM 过程也进行了数值模拟研究 [13]。调查了一种超声波辅助 AWJM 过程以了解磨料侵蚀过程。研究了部分重叠条件和完全重叠条件。研究结论指出，具有锋利边缘颗粒在
    30° 撞击角下可能导致更高的 MRR。与无振动加工相比，在振动辅助加工中观察到了更高的 MRR [13]。


    使用 AWJM 切割了 Ti6Al4V-CFRP 等特殊材料 [14]。该研究首次考虑了锥角、切缝和粗糙度。传统机械加工在切割这些材料时面临诸多困难，因为这两种材料（Ti6Al4V
    和 CFRP）的特性差异很大。该研究成功实施，并为航空航天行业中广泛使用的异种组合材料的加工开辟了新途径 [14]。Uthayakumar 等人研究了用于加工超级合金的
    AWJM。实验表明，AWJM 可以成功用于加工镍合金。使用 AWJM 可以以具有成本效益的方式产生精确的表面。在加工过程中，材料的表面性能未发生退化。观察到加工时的压力和速度会影响切缝壁倾角。发现
    MRR 受流速和压力等参数强烈影响。在高压且具有适当横向速度的情况下，获得了超级合金的高表面光洁度 [15]。温度也被视为 AWJM 中的影响因素 [7]。利用所需位置的热处理对工件进行预加热，沿加工路径进行。假设预加热可软化材料，从而有助于大幅降低切削力并提高
    MRR。观察到很难长时间维持温度和尺寸。因此，它仅对微切割和微通道切割有价值 [7]。还实验了使用 AWJ 切割过程切割难以切割的不锈钢 [16]。使用 AJM
    切割切割了 EN1 不锈钢。在 3400-3800 bar 的不同水压下切割了 20mm 的棒材。


    2016 年，Shukla 等人优化了 AA6351 铝合金材料的 AWJM 过程参数。使用了各种优化技术 [17]。该研究旨在确定达到预期输出结果的过程参数领域。初步来看，使用田口方法优化过程参数，揭示了一组获得预期结果所需的各种过程参数
    [17]。Tamananee 等人考虑了 AWJM 中的侵蚀速率。在加工中使用了一种粉末填充的热塑性烯烃。从那时起，利用侵蚀速率估算值来创建加工配置，以扩大定界侧壁的斜率
    [18]。还研究了用 AWJM 过程加工 Al-MMCs。该研究的重点在于改善切缝特性 [19]。还尝试使用 AWJM 加工 Ti-6Al-4V。还使用了田口和
    ANOVA 分析等优化方法。进行了一系列实验以优化可变输入并达到预期输出。对 MRR 和切缝特性等预期结果输出参数进行了优化 [20]。碳纤维环氧树脂作为一种广泛使用的轻质材料，其
    AWJM 应用仍然有限。因此，进行了一项研究，使用 AWJM 加工碳纤维环氧树脂复合材料 [21]。钛及其合金被归类为难以切割的材料。M. Douiri 等人使用
    AWJM 过程加工了钛合金 Ti-6Al-4V [22]。该研究揭示了加工过程中的几个不同区域。区域 1，在较低的攻角下发生初始阶段损伤。然后切割进入区域
    2。该区域切割平滑。攻角增加。在区域 3，观察到不规则的切割。射流在区域 3 中发生偏转 [22]。由于其机械性能，Inconel 在发动机中找到了多种应用。相同的机械性能使
    Inconel 成为一种难以切割的材料。AWJM 被成功用于切割 Inconel [23]。为了进一步改进研究，使用田口-灰色关联方法优化了过程参数 [23]。


    还研究了 AWJM 与铣削加工的表面特性对比，见表 1。结论认为，与铣削相比，AWJM 能够以更好的方式生成所需的光洁度 [23]。Suresh *等人*
    使用 AWJM 加工过程钻削纤维增强复合材料。与其他报告相反，磨料颗粒尺寸不影响 MRR。还观察到压力影响工件的锥度 [24]。最近，2018 年，Xiao*chu*
    *等人* 进行了各种实验以开发 WJM。分析了各种输入和输出参数 [25]。


    还进行了各种理论研究以分析 WJM，见表 2。Melen*tev* *等人* 使用理论方法分析微 AJM。特别关注使用小喷嘴 [26]。Jagadish *等人*
    使用了软计算方法。利用软计算方法改善了表面质量和服务寿命 [27]。


