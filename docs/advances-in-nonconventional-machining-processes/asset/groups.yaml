    ## 第4章


    ## AWJM 工艺综述


    Manta ^*,†^, Sachin Mohal^‡^, Saurabh Chaitanya^§^ and Ankithmani Tripathi^¶^

    † 印度，索兰，巴迪，皇家阿格拉森大学，机械工程系

    ‡ 印度，莫哈利，兰德兰，昌迪加尔工程学院，机械工程系

    § 印度，哈里亚纳邦，SRM大学德里 NCR 校区，机械工程系


    **摘要：** 磨料水射流加工（AWJM），作为一种非传统加工（NCM）技术，在质量和可靠性方面得到了根本性的提升。AWJM 是一种广泛使用的 NCM 工艺，在刀具、零件、微结构或复杂产品（如钛合金、合金钢
    *等*）的技术应用领域已得到广泛确立。它已深深扎根于理论研究的每一个重要领域以及广阔的应用谱系中。应用包括医疗器械、精密零件、高效材料、智能汽车制造、航空航天设备、可再生能源科学
    *等*。本文审查了可验证的最新研究进展，涵盖了 AWJM 系统的集成应用及执行。该研究促进了高精度制造和稳定的执行质量，并带来了更高的生产力。AWJM 的优点包括能够切割复杂材料、难加工表面、高灵活性、较小的切削力以及环境友好。此外，也强调了
    AWJM 系统的局限性。AWJM 是极其先进系统之一，在微加工方面具有重大潜力。


    **关键词：** 磨料水射流，加工，材料。


    ## 引言


    设计和技术的快速进步需要极其精确和高度精细的物品。表面特性在制造汽车、航空和生物医学应用产品方面起着重要作用。微小的划痕或毛刺可能导致巨大的损失，例如发动机中途故障、航空灾难等。各行各业正在努力并投入巨资完成这些工作，同时不损害表面特性。在不改变表面质量和表面特性的情况下，对坚硬且坚韧的材料进行加工是一项艰巨的任务。在
    NCM 中，加工过程中产生的热量可能会导致表面缺陷 [1]。因此，通过选择合适的加工工艺，我们可以提供更好的表面质量。在这种情况下，可以使用水射流来加工坚硬且坚韧的材料，且不会生成任何热量。这种混合物
    *即* 水和磨料，称为水射流加工（WJM），是一种 NCM 工艺，其中利用高速水流从工件外部侵蚀材料。WJM 也可用于切割塑料、橡胶或木材等软材料。但是，为了切割金属或岩石等更坚硬的材料，磨料被混合到水中。当在加工过程中使用磨料水时，称为
    AWJM。它基于水侵蚀原理。当高速水流撞击表面时，就会发生材料去除。诺曼·C·弗朗茨博士于 1968 年启动了现代 WJM 技术，并获得了具有创新的高压 WJM
    系统的专利，1971 年第一个商用水射流切割机被制造出来，用于切割层压纸管。1980 年，哈希什博士发现了向普通 WJM 中添加磨料的方法，从那时起 AWJM
    被发明出来，用于切割钢、玻璃和水泥等机械材料 [2, 3]。


    在 WJM 工艺中，高速水射流被引导撞击工件。施加在水末端喷嘴上的压力力转化为高速度。随后，为了切割高质量的材料并切割坚硬材料，磨料被添加到高速水射流中。与
    WJM 相关的多个优势以及较低的成本结构。这项技术是快速发展和灵活的。有毒废气、重铸层、熔渣和残余应力可以轻松消除。AWJM 中的切削力较小，并且在切割区域附近没有像
    NCM 中那样存在受热的热影响区。因此，已经证明那些无法通过 NCM 轻松加工的材料（例如，在玻璃、石头和金属上切割槽，在钛上快速钻孔 *等*）可以通过 WJM
    轻松加工 [4]。


    （图 1）展示了 AWJM 组件的示意图。AWJM 工艺的主要组成部分包括高压液体泵（HPLP）、高压泵、计算机控制系统、加工头及收集器。HPLP 用于提供恒定的超高压。该系统包含两个罐，分别满足切割材料和用水的需求。整个系统配备了过滤机制，可以过滤掉较大的颗粒。系统中的大颗粒可能会阻塞整个系统的运行
    [6]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_70_0.png)


    图 (1). AWJM 工艺及其组件和附件的示意图 [5]。


    利用 AWJM 工艺可以对不同应用塑造广泛的材料范围，如 Inconel、钛、玻璃、陶瓷、复合材料、热敏感合金等。对耐热和高强度材料的需求正在增加，特别是在航空航天工业中。然而，由于这些材料的高强度和低热导率等物理和机械特性，它们通常难以加工，这需要极高的切削能量，使得切削力和切削温度非常高，甚至导致刀具寿命缩短。这为难以加工的材料开辟了一条热辅助加工（TEM）的途径。TEM
    可能使用外部热源来加热和软化工件。结果，工件的屈服强度、硬度和应变硬化降低，难以加工材料的变形行为发生变化，允许发生塑性变形。这使得那些难以加工的材料能够容易地进行机器加工，同时具有较低的能量需求，从而导致材料去除率（MRR）和生产率的提高
    [7]。


    AWJM 工艺的各种特性和开发的机床已被用于切割各种材料，如玻璃等硬质材料、钛和 Inconel 等硬金属、复合材料和合金。对耐热和高品质材料的兴趣正在扩展，特别是在航空应用领域。由于这些材料的物理和机械特性，例如高强度和低导电性，使得它们难以加工，这需要极高的切削力，并使切削力和切削温度变得异常高。甚至会导致切削材料的服务寿命缩短。这为难以加工的材料开辟了一条热改进加工（TIM）的道路。TIM
    可以利用外部热源来加热和软化工件。因此，工件的屈服强度、硬度和应变硬化效应降低。通过这样做，难以加工的材料发生变化并允许塑性变形。这使得那些难以加工的材料能够有效地进行机器加工，同时具有低能量需求，从而导致
    MRR 和生产率的提高 [7]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_71_0.png)


    **图 (2).** 展示影响 AWJ 切削工艺的各种参数类别的示意图 [8]。


    热改进 AWJM（TIAWJM）的性能取决于各种因素（图 2）。这些因素可以归类为各种类别。这些类别和因素列举如下。


    (1) 磨料相关因素

    - 类型

    - 形状和纹理

    - 流动机制

    - 流量


    (2) 喷嘴相关因素

    - 特性

    - 直径


