    [20]。此外，这些在制造业部门兴起的技术将在未来带来卓越的优质保证。人工智能和机器人可以将复杂任务转化为一致且精确的解决方案。随着工业机器人运行量的增加，人工智能在制造过程中的部署已显著增加。


    人工智能（AI）被广泛应用的，并正在逐渐接近制造领域，利用学习算法通过学习和无错决策简化自动化流程。通过提供创新前景、通过提高效率来增加商品产量，以及通过实施通用人工智能使机器交互更接近人类交互，人工智能驱动的系统为未来制造业指明了更简单的路径。拥有卓越创新和自我学习能力的赋能人工智能机器人将转变工业生产流程。然而，该领域的研究在预算限制方面面临重大挑战。为了克服这些设计问题，可以将原材料、制造技术和其他细节的参数整合到软件中，该软件针对所有可行的输入变量配置运行并推荐最佳设计
    [21]。随着人工智能技术应用的每一次重复，输出结果都会进一步增强和改进。图 (3) 展示了制造业中人工智能和机器人的多种优势。基于人工智能系统的详细好处如下所述。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_149_0.png)


    图 (3). 人工智能和机器人在制造业中的作用。


    ### a) 直接自动化


    在重工业中引入机器人和带有大数据分析的人工智能，并通过使其具备逻辑控制器可编程性来安装新机器。新兴技术将增加未来工业中精密传感设备的使用。此过程涉及制造过程各个阶段的信息生成、记录和分析，涵盖从温度感知到产品选择、拣选和包装的所有内容。SCADA（监控与数据采集）结合深度学习可以自动对流畅产生的数据做出反应，并在无需人工介入的情况下调整最细微的事件。由人工智能处理的机器人技术和大数据分析可以显著增强整个制造过程中的实施和性能，并且整个过程可以远程控制
    [22]。


    ### b) 7x24小时生产


    人类是需要日常关注的生物，如护理、休息、水和食物，因此每天工作时间有限。然而，为了让每个制造单位连续工作，必须启动轮班，雇佣四名工人全天候工作以完成一个24小时循环。人工智能机器人的优势包括无需休息、无疲劳以及不间断的规律工作时间。此外，它们在制造单位全天候工作效率极高。这导致了制造设施的增长，这是逐步满足全球和当地客户需求所必需的。此外，人工智能机器人在许多领域更有效，如装配线、物品选择和拣选以及包装。因此，它们可以显著缩短制造业各个部门的周转时间
    [18 - 21]。


    ### c) 安全


    人类是多疑的，且容易犯错误，尤其是在疲劳或分心时。在工厂车间和任何开发或处理环境中，错误和失配都会发生；这种倾向几乎可以通过人工智能和机器人技术消除。无法接近控制意味着减少人力资源，特别是当工作环境危险或需要超人力量时。确实，传统的工作状况将减少机械失配的频率，并带来整体安全性的增强。此外，更先进的触觉硬件与IloT（工业物联网）设备的集成，使得建立安全监视和屏障变得更加容易和有效，以确保人类生命
    [5]。


    ### d) 降低运营成本


    许多公司对人工智能进入制造业持恐惧态度，因为这需要巨大的资本投入。另一方面，投资回报率（ROI）很大，并随时间推移而增加。一旦智能机器开始接管生产线上的日常操作，企业将通过显著降低的运营成本获益，同时现有的维护也有助于减少机器停机时间。满足这些需求变得越来越容易且便宜，使用人工智能和机器学习方法意味着整个生产准备过程将更具成本效益。将机器学习和CAD（计算机辅助设计）结合意味着可以在虚拟环境中规划和测试框架，然后再将其投入生产，从而降低试错机器测试的成本
    [23]。


    ### e) 更高效率


    借助大数据分析等新兴技术，经过人工智能算法处理，可以预测工业部门的整体趋势，通过训练进行模式识别，预测市场发展趋势、宏观经济周期，甚至借助机器学习和数据分析预测天气模式。人工智能具有利用机器学习预测数据、优化表单并追踪不一致性的能力，贯穿从源头到成品的整个供应链。这可以特别通过如RFID（射频识别）跟踪等进步得到支持，它允许材料被跟踪而不必经过如条形码扫描器这样的物理过程
    [16, 19]。


    ### f) 质量控制


    人工智能机器人在实施机器、设备和其他工业硬件的预测性维护方面也非常有价值。此外，利用内置人工智能技术的各种传感器来跟踪机器的性能和工作条件，以检查、预测所有类型的故障，并在发生故障前采取行动进行修复。这可能带来更快的反馈，减少机器停机时间。因此，它提高了整体效率和生产力。它们还可以识别纳米或微观故障，以远超正常人类想象能力的分辨率进行检查，从而增强生产力并提高通过质量检查和控制部门的产品数量。赋能人工智能的机器人在加速多个计划模型方面发挥了巨大作用，并将精确度提升到大规模水平。这避免了由人类进行质量控制和在线评估的需求，该过程耗时且经常出错
    [22, 23]。


    ### g) 快速决策


    人工智能机器人可以通过将复杂任务数字化来为制造业提供快速决策，这些任务如果仅靠人类可能需要极短的时间（原文此处可能有误，结合语境应为“人类需要很长时间”）。相比之下，它在数据层面更深层次地使用信息，发现人类可能永远无法捕捉到的模式。制造智能在决策中的应用必须适合客户端有意义的工作流和设计。人工智能涵盖了认知和身体任务的数字化。它帮助个人更快地完成任务，做得更好，并做出更好的选择。它支持决策的机器人化，无需人工干预。人工智能可以通过减少人类劳动和重复性任务来提高机器人化水平
    [16 - 18]。因此，还有更多方式表明人工智能正在发挥作用。人工智能在决策或其他任务中的细节已在表1中说明。


