    material in biodegradable orthopedic implants applications can be machined in
    micro size complex shapes in micro-WEDM. AZ31 Mg alloy was selected to execute
    the experiments to set the relationship between various input parameters of micro
    WEDM. For optimum conditions, it was desirable to have medium voltage and high
    capacitance for high MRR.


    Liu et al. [39] described the machining of Nithinol shape memory alloy in WEDM.
    Experiment was conducted to identify the effect of process parameters on the crystallography,
    composition and properties of white layer. TEM, X ray Diffraction and EBSD were
    used to characterize the properties of white layer on machined surface. In comparison
    to bulk material, the White layer showed higher nano-hardness due to oxide hardening.


    Manjaih et al. [40] studied the effect of wire electrode material during machining
    of titanium shape memory alloy in WEDM. Brass and Zinc Coated wires were used
    for the study. It was concluded that pulse on time, pulse off time were most impactful
    parameters along-with servo voltage in optimizing conditions for enhancing MRR
    and SR of machined material.


    Sun et al. [41] discussed the characteristics of micro milling helical and corrugated
    micro end mill in low speed wire electric discharge machining. The design and
    mathematical simulation of wire electrode trajectory were carried out and effects
    of machining parameters on helical end mills were elucidated.


