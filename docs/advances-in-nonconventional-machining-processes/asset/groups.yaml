    ## 第 7 章


    ## 使用线切割电火花加工钛基合金的最新进展


    Kamaljit Singh$^1$ 和 Virat Khanna$^2$$^*$


    $^1$ 昌迪加尔工程学院，莫哈里，印度

    $^2$ Maharaja Agrasen 大学机械工程系，巴迪，喜马偕尔邦，印度


    摘要：在汽车、航空航天和医疗应用等多学科领域中，始终存在对具有更佳性能的高级材料的需求，这需要先进的加工过程。线切割电火花加工（WEDM）是一种有前景的非传统加工方法，被广泛用于加工具有不同硬度和复杂形状的材料，并具有极高的精度和精确度。WEDM
    是一种非接触式工艺，涉及以火花侵蚀的形式去除材料。在丝电极和工件之间不断产生直流电火花，以在部件上实现所需的形状。诸如脉宽、脉间时间、线速、伺服电压和冲洗压力等输入变量可以被调整和控制在，以优化加工过程的响应。本研究的目的是确定工艺参数对钛镍记忆合金的材料去除率
    (MRR)、工具磨损率 (TWR)、表面粗糙度 (SR) 和表面形貌的显著影响。此外，还确定了一些需要深入研究考虑领域。本文还介绍了 WEDM 的未来方面。


    关键词：人工神经网络 (ANN)，实验设计 (DOE)，电子背散射衍射 (EBSD)，能量色散光谱学 (EDS)，金属去除率 (MRR)，扫描电子显微镜 (SEM)，表面粗糙度
    (SR)，透射电子显微镜 (TEM)，线切割电火花加工 (WEDM)。


    ### 引言


    如今，制造业遵循向高精度加工发展的趋势。这在微机械部件、电子和航空航天工业等要求严格的市场中很容易发现 [1]。随着过去几十年中开发出了更新、更奇异的合金材料，传统加工操作已达到其极限。


    随着工业的进步，需要制造形状相对更复杂的工件 [2]。WEDM 在 90 年代末引入，此后在制造业中获得了极大的普及。这主要归功于其在加工难切削、高比强度材料方面强大的能力，以及产生复杂形状和轮廓的能力。此外，WEDM
    可以产生精细、尺寸精确且高精度的表面。线切割电火花加工是一种用于通过导电工件产生复杂二维和三维形状的火花侵蚀过程。WEDM 与传统电火花加工不同。一根细丝作为电极并完成切割操作
    [3]。


    线切割 EDM 是传统 EDM 过程的一种特殊形式，其中电极是连续移动的。通过工件和由一层薄薄的介电液体（去离子水）隔开的线电极（工具）之间的一系列离散火花，材料从工件中侵蚀掉。线切割
    EDM 为加工导电、奇异、高强度和耐温 (HSTR) 材料提供了最佳替代方案，有时甚至是唯一替代方案，并具有生成复杂几何形状的范围。已证明其在当今金属切削行业中具有巨大的应用潜力，以实现产品或部件相当大的尺寸精度、表面光洁度和轮廓生成特性
    [4]。


    在最短的时间内并以最大精度加工钛合金是所有应用中的重要问题，特别是生物医学领域 [5]。钛及其合金被归类为难加工材料，因为即使在极端温度下它们也具有高韧性和强度。由于轻重量、卓越的耐蚀性
    *等* 特性，Ti 合金 *等* 在生物医学、汽车、航空航天、化工领域、电子、气体和食品工业中具有多样化且广泛谱系的应用。此外，钛合金极其耐用且持久。当钛笼、棒、板和钉插入人体时，它们可以保持二十多年不受影响
    [6]。


    由于诸如极大的刀具磨损、切削期间的高温需求 *等* 问题，用传统方法加工钛合金非常不便。因此，这些合金可以用 WEDM 加工，因为它更适合此类材料。Ti 合金的非铁磁性是另一个优势，允许体内植入不同类型钛植入物的患者安全地在
    MRI 和 NMRIs 下进行分析 [7]。图 (1) 中展示了一些由钛制成的植入物。


