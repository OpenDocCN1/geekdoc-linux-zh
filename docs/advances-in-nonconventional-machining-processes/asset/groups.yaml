    # 第 1 章


    ## 超声波加工过程综述


    Janender Kumar<sup>1,*</sup>, Amrinder Pal Singh<sup>2</sup>, Anurag Thakur<sup>3</sup>
    和 Munish Mehta<sup>4</sup>


    - <sup>1</sup> Maharaja Agrasen 大学（印度索兰巴迪），机械工程部门

    - <sup>2</sup> 旁遮普大学 UIET（印度昌迪加尔），机械工程部门

    - <sup>3</sup> Maharaja Agrasen 技术研究所（印度德里），机械与自动化工程部门

    - <sup>4</sup> 罗丽专业大学（印度旁遮普邦法格瓦拉），机械工程学校


    **摘要：** 陶瓷、复合材料等*先进*材料的应用日益增加，与此同时，这些坚硬、脆性且昂贵的材料的加工极具挑战性。由于传统加工过程在加工硬脆材料方面存在诸多局限，工业界正在依赖非传统加工过程。正是为了克服传统加工的这些局限性，超声波加工（USM）等现代加工过程应运而生。在超声波加工中，材料的去除是由于磨粒的作用以及加工过程中振动刀具的影响。在一定程度上，它克服了传统加工的问题。此外，超声波加工也存在一些缺点，*例如*材料去除率低、刀具磨损率高。由于刀具持续撞击工件，加工出的型腔存在尺寸超差，且钻孔操作在深度上受到限制。工艺参数的优化可以改善所有这些
    problems。文献综述研究表明，与单独的超声波加工相比，一种名为旋转超声波加工（RUM）的混合加工过程在钻孔和铣削操作中能取得显著成效。近年来，由于其智能加工特性，该过程在工业中日益流行。本文探讨了超声波加工的参数优化技术以及旋转超声波加工过程的未来发展方向。


    **关键词：** 磨粒形状与尺寸，陶瓷与复合材料，硬脆材料，混合加工，加工参数，旋转超声波加工，超声波加工。


    ## 引言


    在当今世界，由于技术的进步，行业需求不断变化。最新和先进的材料及其加工是制造业的要求。研究是一个持续的过程，也是行业发展/壮大的需求。诚然，追求进步是必要的。在过去，加工硬脆材料对工程师来说是一项艰巨的任务，对研究和设计团队也是一个挑战。传统加工已使用了多年。新的加工过程被开发出来，并被命名为现代加工方法/非传统加工。这些过程近期的发展为加工硬脆材料开辟了一条道路。在传统加工过程中，刀具与工件直接接触，材料以切屑形式去除，即在宏观层面上；而在非传统加工中，刀具与工件之间没有直接接触。在此过程中，材料在微观层面（粉尘/粉末形式）被去除。在传统加工中，由于物理接触，刀具的磨损率比非传统加工高。近年来硬脆材料用途的增加促使研究人员开发新的先进加工过程。通过传统加工难以加工的材料，通过非传统加工过程进行加工。开发新方法的主要理念是用更高效、更快速、能达到加工精度的方法取代传统加工方法。超声波加工是非传统方法领域的一项此类发展。在此过程中，含有微小磨粒的悬浮液通过轴向振动的刀具强行作用于工件，从而以微小颗粒的形式去除工件材料。磨粒可能是碳化硅、碳化硼或金刚石粉。为了促进/提供高精度加工，当在刀具、工件或工作介质中引入振动时，这被称为振动辅助加工
    [13]。在振动辅助车削中，与常规加工相比，切削力减少了高达 40%，从而提高了刀具寿命。工件中产生的应力较小，且加工表面质量得到改善 [15]。旋转超声波加工是用于克服超声波加工局限性的最新工艺之一。与单独的超声波加工相比，在通过旋转超声波加工进行的钻孔操作中观察到了更高的金属去除率
    [23]。


    ## 文献综述


    Kumar 和 Khamba 评估了超声波加工在钛基工件上的加工性能。调查了材料去除率、刀具磨损率，并了解了工件的表面粗糙度。采用田口方法进行了多项实验，数据通过
    ANOVA 进行分析，并选择可增强超声波加工性能的优化参数 [1]。


    B. Lauwers *等* 研究了 $ZrO_2$ 超声波辅助磨削过程中的材料去除率、表面质量和表面裂纹。论文表明，在加工过程中振动的影响下，切削力和刀具磨损减少了。因此生产力提高
    [2]。


    Cong *等* 提出了在旋转超声波加工过程中测量振动幅度的方法。在本文中，结论是振动幅度因不同条件而变化。当使用百分表法测量振动幅度并与新方法进行比较时，结果相同。但检查有或没有旋转超声波加工，并使用具有不同规格的刀具时，结果不同
    [3]。


    Heise *等* 研究了花岗岩和石材上的超声波辅助钻孔操作，这是一种混合加工过程。当应用超声波过程时，切削力和扭矩减少了高达 20%。这可以通过使用机器人代替加工中心来实现
    [4]。


    Kei-Lin 和 Chung-Chen 提交了关于旋转超声波加工的论文，其中玻璃被用于铣削操作。基于表面粗糙度参数评估了操作的效率。观察到超声波铣削的表面质量与非超声波铣削相比非常差
    [5]。


    Liu *等* 开发了旋转超声波加工过程中的切削力模型。切削力在脆性材料加工过程中起着非常重要的作用。基于切削力模型，建立了切削力与主轴速度、进给率、超声振动幅度和磨粒等输入变量之间的关系。在研究分析中做出了各种假设，如磨粒形状及其材料。使用了八面体形状的金刚石磨粒。开发的模型提供了关于切削力的信息，*即*随着输入变量参数的增加，力增加；随着输入变量参数的减少，力减少
    [6]。


    Rashheed 比较了微电火花加工（micro-EDM）和激光束加工产生的微孔的结果。比较了加工参数，如材料去除率、孔的锥度、产生孔的入口和出口直径、产生孔的同轴度。结论是，当工件的表面质量不是那么重要时，为了获得高材料去除率，可以利用激光束加工。如果需要表面质量，则可以使用微电火花加工，但材料去除率会降低。因此，可以制作一种混合过程，以发挥两种过程的优势
    [7]。


    Das *等* 研究了六角形孔在超声波加工后 Zir-Conia 生物陶瓷材料中的表面粗糙度和材料去除率。通过利用遗传算法技术，在控制参数下获得优化结果。在进行的实验中，使用优化参数，分别获得了
    0.2365g/min 的材料去除率和 0.58-微米 的表面粗糙度 [8]。


    Lian *等* 进行了多项实验，以分析 A16061 材料在有或没有超声振动辅助下的微铣削表面粗糙度。观察到在超声振动辅助加工下，A16061 获得了更好的表面光洁度。当选择适当的超声振动幅度时，获得了更好的结果
    [9]。


    Cong *等* 提供了关于超声波加工中孔入口和出口表面粗糙度的解释。该论文考虑了假设及其测试。实验在不锈钢工件上进行。结论是，工件入口和出口表面粗糙度差异的原因取决于磨料粘结部分在工件全长内随刀具运动的情况
    [10]。


    Selvukumar 和 Arulshri 开展了一项工作，利用遗传算法以及遗传算法与人工神经网络方法的组合来优化夹具布局。调查的目的是减少工件在夹具上夹紧后的变形以及操作过程中的加工力。最后，比较了遗传算法和人工神经网络方法的结果。证明遗传算法与人工神经网络方法的组合优于单独的遗传算法
    [11]。


    Yang *等* 对齿轮超声波研磨进行了研究。与传统的研磨方法相比，这是一种提高齿轮齿面质量的更好过程。本文的目的是最终确定双曲面齿轮超声波研磨设计的方法论。实验后，结论是齿轮超声波研磨的传动质量优于传统研磨方法
    [12]。


    Feucht *等* 介绍了使用超声波辅助加工加工硬脆材料或先进材料（如陶瓷和纤维增强材料，常用于医疗和航空航天工业）的结果。纤维增强材料在性质上是异质的。因此，加工这种材料仍然困难。但当由换能器产生振动时


