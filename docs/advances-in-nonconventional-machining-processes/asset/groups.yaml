    CMs, like titanium diboride (TiB₂), silicon doped silicon carbide (SiSiC) and
    titanium nitride (TiN), are electrically conductive in nature and can be machined
    by EDM [9]. According to Luis et al. [10] the materials which are obtained from
    inorganic materials, generally having the purity of high grade, are referred as
    ceramics or advanced CMs. These CMs are further classified into oxide ceramics
    like Al₂O₃ or ZrO₂ and non-oxide ceramics like Si₃N₄ or SiC.


    The machining of CMs of with the process of EDM can be also classified into natural
    conductive materials, non-conductive materials and conductive materials. Mostly
    the conductive materials are made from non- conductive material by mixing some
