    在传统加工过程的纺锤运动上叠加超声振动，当刀具周期性地脱离工件时，切削力和刀具磨损率可降低20%至30% [13]。


    Muhammad等人讨论了混合加工技术，该技术将超声辅助车削与热加工技术相结合，用于加工钛合金。结果表明，钛合金的切削力降低，表面粗糙度显著改善。在热超声辅助车削中，表面粗糙度表现出50%的额外改进
    [14]。


    Kumar等人提出了针对硬脆材料的振动辅助加工。振动可以施加在刀具、工件和工作介质上。在超声辅助车削期间，工艺参数得到改善，例如与常规加工相比，切削力降低了40%至45%，平均切削力降至40%。刀具磨损率降低，工件的表面粗糙度得到改善
    [15]。


    Bhosale等人研究了工艺参数对氧化铝-氧化锆陶瓷复合材料的影响，包括材料去除率、刀具磨损率和表面形貌。通过研磨粒子悬浮液及携带流体等参数的影响，分析了振幅对工艺的作用。研究表明，当使用坚硬且粗糙的磨料时，刀具磨损率往往增加。与常规磨削条件下使用的碳化硅磨料相比，使用碳化硼磨料时发生较高的刀具磨损率。研究结论认为，悬浮液浓度对刀具磨损率的影响较小，而振幅的增加会导致表面粗糙度增加
    [16]。


    Silberschmidt等人进行了超声辅助车削实验，在针对铜、合金等不同材料的机床上尝试了切削参数的组合。由于超声辅助车削，加工过程中的切削力降低，表面粗糙度改善。对于Inconel
    718合金，与传统车削相比，超声辅助车削获得的表面粗糙度结果更好。传统车削的Ra值为1.179微米，而超声辅助车削的Ra值为0.505微米 [17]。


    Goswami和Chakraborty利用两种技术对超声加工过程进行参数优化。这两项技术分别是引力搜索和烟花对数算法。作者开发了比引力搜索更优的最佳结果，例如更高的材料去除率
    [18]。


    Agarwal研究了玻璃材料的超声加工。研究重点在于材料去除机制和材料去除率。结果表明，随着磨粒尺寸的增大，材料去除率也随之增加。建立了冲击力与材料去除率之间的关系。分析表明，增加工具尖端的静态负载振幅可以提高材料去除率。另一方面，随着磨粒尺寸的增加，由于工件碎屑阻碍了工具的振动，材料去除率反而降低。研究揭示，只有适当控制参数才能提高材料去除率
    [19]。


    Ning讨论了碳/纤维增强聚合物（CFRP）复合材料因其优异性能而在航空航天和飞机工业中的重要性。比较了两种钻孔方法：旋转超声加工和磨削。研究中考虑了切削参数，如切削力、表面光洁度、扭矩、孔径和材料去除率。比较结果显示，在CFRP钻孔中，旋转超声加工的表现优于磨削
    [20]。


    Wang等人研究了在C/SiC复合材料钻孔过程中孔出口处的撕裂缺陷问题。开发了一种新刀具，并与普通钻头进行了比较。使用复合阶梯锥形钻头在孔出口处效果更佳。使用这种钻头减少了撕裂缺陷问题。维持的切削参数包括进给率为2
    mm/min，主轴转速为2000 rpm。结果表明，使用复合阶梯锥形钻头使撕裂尺寸减少了30%。钻孔后在出口处产生的缺陷包括毛刺、边缘崩缺等 [21]。


    Amini等人研究了超声振动辅助车削过程中的摩擦学特性。考虑摩擦系数和磨损率等切削参数进行评估。方差分析（ANOVA）结果显示，在摩擦系数方面观察到了32.32%的有效性
    [22]。


    Singh和Singhal综述了非传统混合加工过程，即旋转超声加工。与静态超声加工不同，在加工过程中，磨粒持续插入刀具和工件之间。振动的刀具撞击工件，从而实现材料去除。在此过程中，刀具和工件之间没有直接接触。因此，材料去除量较少，加工结果不符合规范。由此导致钻孔中出现大尺寸孔、偏心孔和壁面侵蚀等缺陷。在旋转超声加工中，将常规金刚石磨削与超声加工结合在一起。因此，与常规磨削和超声加工相比，产生了更高的材料去除率。在旋转超声加工中，振动的钻具进行旋转，且金刚石磨粒在钻孔操作过程中附着在刀具尖端。该过程比常规磨削和静态超声加工具有更高的材料去除量、改善的表面粗糙度以及更高的加工孔精度
    [23]。


    Zhen *et al*. 对陶瓷基复合材料进行了研究。研究观察到，与常规铣削相比，旋转超声加工提高了5.8倍的加工效率，表面质量改善了54% [24]。


    Ning *et al*. 介绍了旋转超声表面加工与传统表面磨削在CFRP复合材料上的对比。研究了磨粒的运动学，并进行了比较。在分析磨粒的运动学运动时，假设磨粒为球形且直径相同，且在加工过程中形状保持不变。实验结果表明，旋转超声表面加工产生的进给切削力、轴向切削力以及扭矩数值较低。除此之外，与传统的表面磨削相比，旋转超声表面加工产生了较大的表面粗糙度。造成这一现象的原因是垂直超声振动
    [25]。


    Feng *et al*. 讨论了钻孔过程中孔出口处的撕裂缺陷。实验显示，该缺陷是由较大的推力引起的。旋转超声加工减少了推力，并观察到撕裂缺陷减少了60%。实验结果表明，在该研究中推力减少了约55%。晶粒尺寸对推力的影响较大，且在一定程度内推力随晶粒尺寸变化而减小
    [26]。


    Wang *et al*. 研究了刀具磨损机制及其与材料去除率的关系。在试验中，使用了三种不同材料的刀具，分别为304不锈钢、1045碳钢和钨。刀具磨损的影响导致低材料去除率（MRR）和加工不精确。在加工过程中，观察到304不锈钢刀具最适合微型超声磨削（USM）。刀具磨损和磨粒磨损较低，有助于去除更多材料。与其他外部表面相比，304不锈钢刀具的内部表面硬度较低。复合表面材料（软硬结合）确保了低刀具磨损和颗粒磨损
    [27]。


    Wang *et al*. 研究了超声加工的潜力，并调查了磨粒的形状。研究中采用了两种不同形状的磨粒。形状分别为立方体和球形，内部填充碳化硅和氧化铝材料。结果表明，球形的硬磨粒（Al2O3）以良好的方式抵抗了刀具磨损，如图(1)所示。这提高了超声加工过程中的材料去除效率及其性能
    [28]。

