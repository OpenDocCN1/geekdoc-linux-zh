    ## Nd:YAG Laser Overview


    The abbreviation of it is ‘Neodymium-doped Yttrium Aluminium Garnet’. It is a
    powerful solid-state laser. It is used for light work. High reflective and dielectric
    material can be easily machined. With pulsed mode it can machine even thicker
    material. It is compact and reliable type laser. This laser has low mean beam
    power but high energy density when used with pulsed mode. It is used as a laser
    medium in laser beam machining process. The schematic diagram of process is in
    Fig. (3).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_62_0.png)


    Fig. (3). Schematic of Nd:YAG laser beam cutting process [12].


    Table 3. Compilation of laser beam machining and laser-assisted processes [22].


    | Author | Process | Work Material | Important Input Variables Considered | Optimization
    Technique | Remarks |

    |---|---|---|---|---|---|

    | Pham et al (2007) | Laser milling process | Alumina material and silicon nitride
    ceramic | Scanning speed, pulse intensity, lamp current | Single factor experiment
    | It was recommended that for any m/c employing laser milling with the wavelength
    1064 nano-meter: a glass support plate should be provided to reposition the workpiece.
    |

    | Duba* et al (2008) | Laser drilling-micro-drilling | Composites, ceramic and
    alloys | Laser, materials and process parameters | DOE, Taguchi | YAG laser was
    suitable for creating micro-holes up to 5 micron meter |

    | Allman- et al (2015) | Laser micro-drilling | Ni-Ti alloy | Lamp current, pulse
    frequency, pulse width, air pressure | Hybrid process | With hybrid process (laser
    and micro-EDM) machining time reduced and RR increased |

    | Wang et al (2016) | Laser drilling process | ceramic | Pulse-width, energy density
    and repetition frequency | ANSYS and COMSOL approaches | It was recommended that
    liquid assisted processing is good in laser drilling due to cooling & evaporating
    process. |

    | Dutt et al. (2018) | Laser drilling process | Composite, ceramic and super alloys
    | Q-switching, peak power, pulse time, pulse frequency, no of pulses and gas pressure
    | Artificial intelligence-based methods (ANN, Genetic algorithm) | Pulsed Nd:YAG
    laser beam drilling was mu easing rapidly due to better focussing characteristics
    |


    ## CONCLUSIONS


    1. Laser beam machining is utilized for making complex profile in workpiece, drilling
    holes in different sizes (micro-holes up to 5 micron meter in diameter) and cutting
    of thin foils up to 4-micron meter.

    2. The performance of laser depends upon three parameters. These are process,
    laser and material parameters.

    3. The laser hybrid machining processes have produced better results than single
    non-conventional machining process.

    4. Coolant is used in conventional and non-conventional machining during processes.
    Coolant remains toxic for environment and operator as it continuously used on
    machines. But laser-assisted machining is an environment friendly process due
    to the absence of it.

    5. Laser-assisted machining is better than conventional machining. Also, it can
    be used to increase the process efficiency of material those tough to machine
    by traditionally method.

    6. It is concluded that the use of Nd:YAG laser, machining of Inconel 718 superalloys
    using laser beam machining under wet conditions with the static mode of water,
    has given best results in terms of maintaining the sizes, burr free surface and
    recast layers.

    7. It is also concluded that hard to cut material can be easily drilled by using
    pulsed Nd:YAG laser beam drilling. This process, practically and theoretically,
    may be carried out successfully for composites. This application of laser is increasing
    continuously.


    ## FUTURE SCOPE FOR LASER BEAM MACHINING RESEARCH


    1. Most research papers are related to drilling and micro-drilling. Still, the
    three-dimensional laser beam machining like turning and milling are difficult
    to perform. Research can be carried out for laser assisted milling in near future.

    2. The laser beam machining is generally performed on sheet metals but due to
    advanced or later engineering material need arises to develop it for machining
    of difficult to hard materials. So, this can be the research area in future.

    3. During laser process, in front of tool, workpiece remains soft due to external
    heat source. Also, the tool and chip interface have high temperature which can
    leads to shorten tool life. Therefore, a proper method for cooling the cutting
    tool without affecting the heat up area in front of tool is required [9].

    4. Generally, this process is utilized for hard and brittle materials. But some
    ductile materials are also difficult to machine. Hence thermally enhanced machining
    may be utilized for ductile material for improving its machinability [9].

    5. For optimization of thermally enhanced machining process, a depth study of
    tribological elements like friction, wearing and rubbing between cutting tool
    and chips are required.


    ## CONSENT FOR PUBLICATION


    Not applicable.


    ## CONFLICT OF INTEREST


    The authors confirm that this chapter content has no conflict of interest.

