    ![](img/020b405a9ddccb1e0ee51cb33242cd00_18_0.png)


    图 (1). 钻孔过程中使用不同磨料颗粒时刀具磨损率的变化趋势。


    Wang等人阐述了旋转超声加工中的切削力和材料去除机制。钻孔过程中产生的缺陷包括边缘崩缺、撕裂缺陷和亚表面损伤等。文中还描述了损伤减少技术以及加工参数的优化。在加工过程中，孔的出口处会产生损伤。如果切削力小于临界切削力，这种损伤可以得到减少。通过优化加工参数，可以减少加工过程中的损伤
    [29]。


    Wang等人研究了旋转超声加工中的临界切削力。通过分析切削力，开发了一种用于超声机床设计和制造的 Novel 指数。文中分析了切削力对加工参数和超声幅度的影响。此外，还分析了临界切削力对旋转超声机床工具的影响，并讨论了改进方法
    [30]。


    Popli和Gupta研究了旋转超声加工钻孔过程中的边缘崩缺问题。设计了一项实验，通过增加支撑长度来去除钻孔时在孔出口处产生的边缘。这有助于将边缘崩缺尺寸减少高达50%。崩缺尺寸与支撑长度之间的关系为：崩缺尺寸与
    l/支撑长度成正比 [31]。


    Mikhailova等人介绍了大理石中传统钻削技术和超声辅助钻削技术的结果。实验结果有利于超声辅助钻削。观察到，Jobber钻头也适用于大理石钻削，但进给率有一定的限制
    [32]。


    Wang等人开发了一个基于运动学分析和脆性材料断裂力学的表面模型。该模型有助于预测在哪些参数下表面粗糙度会增加或减少。在本文中，当主轴转速为2000 rpm时，表面粗糙度很低，表面形貌较好；但当主轴转速在2500-3000
    rpm之间时，表面粗糙度很高 [33]。


    Wang等人研究了像CFRP复合材料这样坚硬且脆的材料在加工过程中高切削力和高表面粗糙度的问题。具有一定程度的垂直超声振动的旋转超声表面加工减少了切削力，但产生的表面粗糙度高于传统表面磨削。为了改善这一参数，进行了具有水平超声振动的旋转超声表面加工实验。与传统表面磨削相比，这有助于减少切削力并改善表面粗糙度
    [34]。


    Wang等人指出了CFRP复合材料在旋转超声表面加工中的材料去除机制。为此，进行了单磨料划痕测试。在使用点角为100°的单金刚石颗粒压头进行小划痕深度测试时，观察到延性材料去除模式机制；当划痕深度较大时，观察到脆性去除模式。在延性材料去除模式下，观察到的表面没有裂纹；而在脆性材料去除模式下，加工过程中观察到裂纹。同样，在较小的划痕深度下，延性模式的力较小，而脆性材料去除的力较大
    [35]。


    在研究论文的过程中，观察到旋转超声加工优于超声加工。


    ## 传统加工与非传统加工


    传统加工是一种传统的加工过程，在加工过程中刀具与工件直接接触，并受到加工某些材料和生产复杂形状的限制；而非传统加工中刀具与工件之间没有直接接触。它没有加工任何材料的限制。


    ## 超声加工与旋转超声加工


    超声加工是一种加工过程，其中成型刀具与所需的型腔相反，以受控参数轴向振动并进料到工件上 [36]。在刀具和工件之间插入浆料，其作用是切削。图 (2 和 3)
    展示了超声加工原理的基本元素和工作原理的示意图。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_20_0.png)


    图 (2). 超声加工设备示意图 [28]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_20_1.png)


    图 (3). 超声加工过程的工作原理。


    而在旋转超声加工中，钻头连续旋转，同时也存在轴向振动 [37]。在刀具和工件之间不单独提供浆料。切削刀具经过特殊设计，磨料颗粒粘结在刀体上，如图 (4) 所示
    [38]。在旋转超声加工中，磨料颗粒直接粘结在钻头上。然后，旋转和振动的钻头可以在玻璃、陶瓷材料等多种材料中提供快速、精确且高质量的孔 [39]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_21_0.png)


    **图 (4).** 旋转超声加工过程的工作原理。


    旋转超声加工是一种混合加工过程，它将超声加工和传统磨削结合在一起，以获得更好的加工结果 [23]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_21_1.png)


    **图 (5).** 旋转超声加工设备示意图 [23]。


    研究表明，只有超声加工的受控参数可以提高加工效率。这些参数包括振动幅度、磨料颗粒的形状和尺寸 [25, 28]、施加静态载荷的影响等。这些受控参数可以减少切削力，以提高过程性能
    [6, 13 - 15, 17]。旋转超声加工是静态超声加工的升级 [40]。旋转超声加工的示意图如图 (5) 所示。


    ## 结论


    - 1. 超声加工克服了传统加工的问题，在传统加工中刀具始终与工件直接接触，而在超声加工中，刀具周期性地从工件或零件上抬起，从而减少了刀具磨损率。

    - 2. 它可以加工坚硬且脆的材料，这些材料在传统加工过程中受到限制。

    - 3. 当与其他传统和非传统加工结合时，超声加工的特性得到改善。

    - 4. 可以实施烟花算法（一种用于超声加工参数优化的数学方法）。

    - 5. 振动辅助加工消除了切削液或冷却剂的使用。在加工过程中，周期性的工件-刀具分离保持间隙，有助于从切削区散发热量。

    - 6. 它有助于减少由冷却剂造成的环境危害，并提高加工效率。

    - 7. 在文献综述过程中，观察到旋转超声加工已被用于钻孔操作，与静态超声加工钻孔部件相比，显示出良好的结果，如高的材料去除率、低的刀具磨损率和良好的表面光洁度。

    - 8. 在坚硬且脆的材料中，为了获得更好的结果，钻孔操作可以选择旋转超声加工而非静态超声加工。

    - 9. 研究表明，近年来，旋转超声加工因其对坚硬且脆性材料的智能加工而越来越受欢迎。在航空航天工业中，利用钻组可以通过此工艺同时创建多个孔。

    - 10. 为了获得更好的结果，可以利用球形磨料颗粒，而不是锐利边缘颗粒。

    - 11. 旋转超声加工中磨料颗粒的消耗可以减少，因为它粘结在刀具表面，而在超声加工中，它是单独插入的。

    - 12. 最后，静态超声和旋转超声加工解决了加工坚硬且脆性材料的问题，这在质量上非常优越，但成本也很高。


    ## 未来进展


    在研究论文的过程中，注意到旋转超声加工仅被用于坚硬且脆性材料的钻孔和表面铣削操作。它在其他操作中显示出局限性。它甚至没有涉及其他与钻孔相关的操作，如锪孔、锪沉、铣钻复合操作和攻丝等。这背后可能有一些原因，但留下了一些进一步研究的领域。


