    和表面粗糙度。


    Song 等人 [33] 进行了一项实验，以研究 EDM 工艺对由含 10.5% 钴的 WC-Co 复合材料的影响，并使用水喷雾作为介电介质。结果表明，使用水喷雾介电介质未报告腐蚀现象，且
    MRR 增加，同时电极磨损显著减少。Yu 等人 [34] 使用两种类型的 EDM 工艺——干式 EDM 和传统基于油介质的 EDM——对硬质合金进行了实验研究。结果显示，与传统基于油介质的
    EDM 相比，干式 EDM 在高速切削和低电极磨损方面表现出更好的结果。研究进一步指出，干式 EDM 也可用于作为工件材料的碳化物的三维加工。在另一项研究中，Kumar
    等人 [35] 研究了 EDM 工艺对由含 5 wt.% SiC 和 5 wt.% B₄C 的 Al63Si 复合材料的一些加工参数（如脉冲开启和关闭时间、脉冲电流和电压）的影响。观察了工具磨损、表面粗糙度和功耗，并指出随着电放电和脉冲电流的增加，工具磨损增加的可能性显著增大。在类似的研究中，Patel
    等人 [36] 优化了由 Al₇₀.₅-SiCw-TiC 制成的复合材料在 EDM 工艺下的表面粗糙度参数。通过在 Al₂O₃ 中加入 SiC 晶须和 TiC
    颗粒实现了机械性能的提升。结果结论认为，表面方法学对于获得 EDM 工艺形成的复合材料更好的表面光洁度非常有用。Selvarajan 等人 [37] 综述了用于工业应用中并经
    EDM 处理的复合材料的各种参数。讨论了获得更好输出所需的多种因素，并得出结论，在所研究的材料中，Al₁₂O₃、SiC 和 TiC 由于其易加工性，在大多数应用中需求量最大。Kangararajan
    [38] 进行了研究，比较了由粉末冶金工艺和 EDM 工艺制造的 WC-Co 复合材料磨损机制的结果。使用概率神经网络绘制了不同工艺磨损机制的图谱。随后将磨损状态分为三个部分：轻微磨损、严重磨损和超严重磨损。这些状态基于磨损率和材料表面粗糙度等各种因素。还观察到，由
    EDM 工艺形成的表面的机械性能因电放电产生的气泡和熔坑而受损。研究结论认为，从磨损表面粗糙度和磨损率的角度来看，陶瓷磨损状态可简要识别为轻微磨损、严重磨损和超严重磨损。电火花在加工表面产生熔坑、气泡和裂纹，这恶化了
