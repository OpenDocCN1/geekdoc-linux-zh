    线切割电火花加工（Wire EDM）在某种程度上也类似于常规电火花加工，因为它以线材形式实施电极，用于电火花蚀刻。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_131_0.png)


    图 (1). 电火花加工机构布局。


    这进一步扩大了使用线切割电火花加工（WEDM）生产具有高精度和高表面光洁度的复杂精细形状的可能性。一些研究描绘了在工具和工件之间最短距离处产生电离柱的过程
    [1]。随着复杂精细设计的进步，线切割电火花加工应运而生，它提供了高精度和高光洁度加工的新领域。它利用通过细铜线或黄铜线（作为电极）导电的电流作为能量源。当此线材靠近工件时，最近区域的电火花开始放电，从而导致金属通过微观粒子的熔化和汽化而受到电火花蚀刻。在此过程中，线材也会在小尺度上受到侵蚀，从而导致某种形式的工具磨损。为了允许切割区域具有相等且精确的尺寸，随着加工的进行和切割的执行，机器会通过机器上的自动机制，用新的线材部分替换旧线材。整个过程在去离子水电介质中进行，以促进加工区域的均匀连续冷却，并清除加工过程中产生的蚀刻颗粒。


    ## 电火花加工的现状以及脉冲特性对电火花加工过程的影响


    由于电火花加工的非线性，电火花加工机器需要大量改进。多项研究强调了可以改进当前工艺的方面（表 1）。在过去 20 年里，从最初的发展及其随时间的进步开始，已经进行了大量研究
    [2]。它提供了各种控制和结果，以通过优化工艺参数来改进电火花加工机器 [3]。鉴于优化问题，研究中规定了输入参数。一些研究还强调了新技术的发展，以提高加工表面的质量。还发现，许多研究集中于粉末混合电火花加工，以研究表面及其改性
    [4]。还进行了关于用于提高机器效率的直流脉冲的研究。发现如果在使用 RC 型脉冲发生器方面进行改进，则可以看到好得多的结果，包括使用碳化钨作为工件时的高表面质量和改进的材料去除率（MRR）[5]（图
    2）。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_132_0.png)


    图 (2). 脉冲波形对电火花加工特性的影响。


    另一项研究表明，如果使用来自改进型晶体管的 1MHz 脉冲，而不是 RC 型发生器，则会产生更高的 MRR，加工速度快三倍 [6]。Han 等人进行了一项研究，他们设计了一种新的晶体管脉冲发生器用于脉冲生成，能够产生大
    24 倍的 MRR [7]。还进行了一项研究，观察到了电火花加工电容对阻抗的影响，从而导致了高加工性能 [8]。在表面精加工过程中，还实施了较低的能量消散在工具和工件界面，以使用基于半导体的开关电路获得更高的表面光洁度
    [9]。


    一些实验表明，用于加工的脉冲发生器的波形变化对各种加工特性具有显著影响。研究表明，能量密度对刀具磨损率（TWR）有较大影响 [10]。短脉冲持续时间通常用于高精度加工。发现使用均匀放电能量时，表面形貌具有较高的价值。还发现，如果使用均匀波形的脉冲进行放电加工，电弧效应较少
    [11]。


