    对振动频率敏感。通过计算机控制监控丝线与工件之间的间隙来防止这种情况。但还有其他一些因素和原因，无论定位系统多么好，某些振动都无法控制。这导致火花区域中电极丝和工件之间的间隙发生变化，进而导致击穿电压和放电能量持续变化。研究表明，由于内部和外部振动，丝线会产生高达
    10µm 的振荡 [23]。因此，机器需要尽可能制造得坚固，以防止这种振动，最终导致工件表面光洁度提高。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_135_0.png)


    图 (3). 线切割（WEDM）加工过程中产生的丝线拖拽和张力 [25]。


    ## 丝线张力的影响


    为了防止加工过程中丝线内的振动，丝线的两端保持张力，从而将振动降至最低。这有助于保持丝线呈直线状态并维持良好的切割。这还导致在丝线运行期间切割间隙相等。仍然可能由于丝线中产生的过度应力导致丝线断裂。这构成了适用于丝线张力的限制条件（图
    4）[23, 24]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_136_0.png)


    ## 丝线材料和成分的影响


    如前一节所述，加工过程中的丝线振动及其刚度起着非常重要的作用。因此，丝线的材料选择应基于具有高耐久性（就抗拉强度和韧性而言），以吸收产生的所有振动和应力，并将振动降至最低。研究表明，随着丝线成分中锌含量的增加，加工速度增加，伺服电压需求降低，从而降低了加工期间短路的可能性
    [26]。许多研究旨在以最低的刀具磨损率（TWR）和表面粗糙度（SR）最大化材料去除率（MRR）。下面讨论了几种重要的丝线材料。


    ### 铜


    铜是最早用作加工电极的材料之一。但由于物理限制，如强度和低蒸气压，它在用作 WEDM 丝线时存在一些限制 [25]。


    ### 黄铜


    作为铜的替代物，黄铜在 WEDM 中起着非常重要的作用，具有优异的性能结果。它是铜和锌的合金，分别含有约 63% 和 37% 的这两种元素。添加锌是为了表现出高抗拉强度、高蒸气压和低熔点
    [25, 26]。


    ### 涂层丝线


    研究发现，具有较低汽化温度的丝线电极涂层遭受热冲击的可能性较小。它包括具有高导电率核心的丝线，包覆低熔点合金，最后包覆高强度合金，从而促进高速加工。已经进行了大量关于这种涂层电极丝线的研究，具有高加工能力，具有更好的冲刷能力，产生误差最小且表面粗糙度最低的切割。但唯一的缺点是涂层较厚，以及使用的电介质受污染的可能性，从而造成环境限制
    [27]。


    ### 扩散退火丝线


    由于锌涂层的这些优良特性，可以认为纯锌涂层丝线会产生较高的加工效果。锌具有低熔点，并结合了良好的冲刷性能。因此，可以陈述，在顶层具有高或纯锌浓度的扩散涂层可以产生令人鼓舞的结果。为了生产这种扩散丝线，对封装材料进行退火处理，以便合金在顶层均匀分布。通过这种方式，与传统的电火花加工（EDM）电极材料相比，可以生产出具有较高耐磨性的丝线。与传统黄铜电极丝线相比，所得的
    EDM 丝线在生产率方面有相当显著的提高 [28]。


    ## 冲刷和电介质流体的影响


    电介质以各种形式用于 EDM，如完全浸没、喷射或喷雾冲刷。在图 (5) 中，绘制了冲刷压力对加工速度 (Vs) 和表面粗糙度 (Ra) 的影响。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_137_0.png)


    压力流促进火花过程中产生的蚀除颗粒的连续去除，并且在接近精加工时间时应该较低。还可以看到，存在某个极限，超出该极限则无法进行足够的加工。随着冲刷压力增加至
    1 Kg/cm²，可以实现更高的加工速度，超过此值后加工速度速率下降。当冲刷压力小于 0.3 kg/cm² 时，火花放电处观察到高温范围。


    除了冲刷蚀除颗粒外，电介质流体还执行各种功能，例如在加工期间冷却工件和工具。它还帮助将火花能量集中在加工所需的较小截面上，并在大量能量积聚之前进行间隙绝缘。


    ## 智能线切割 EDM


    我们知道，工业一直在变化，并引入了称为“工业 4.0”的新革命。研究表明，通过避免停机时间，可以消除各种不必要的成本，从而产生更好的结果 [29]。鉴于当前微加工的需求，需要引入一些智能因素，以帮助以高水平的精确度和准确性进行此类工作。与传统的
    EDM 项目相比，大量资金已投入到此类项目中 [30]。在此强调，在加工时代引入新的智能因素，以优化各种控制参数并排除环境危害。这些不仅限于此，还具有自我检查和监控各种任务的能力，并进行适当更改以获得最佳加工特性。近年来，Walder
    等人的研究中可以看到这种应用 [31]。由于 WEDM 配备了大量传感器和装置，用于监控各种事项（例如在服役时间完成后更换部件），与传统的 EDM 相比，可以削减大量制造成本，在传统
    EDM 中，我们通常提前更换一些部件以避免停机，但同时增加了制造成本。迄今为止，尚未进行深入的研究来优化此类情况并建立预测模型，因为这需要在加工领域及其化学研究方面进行大量彻底的研究。Walder
    等人努力建立了这样的模型。这具有各种优点，如实时数据收集以及预测模型的更新，以获得精确模型，同时在加工进行时。WEDM 的最新应用可见于 Inconel、K110
    工具钢以及其他用于各种高级行业的硬质金属。研究聚焦于四个参数，即 EDM 丝线、主过滤器、用于离子交换的树脂、以及用于向丝线供电的触点，因为它们在停机/更换成本方面占主要部分。


    电介质流体起着非常重要的作用，因为它持续清洁加工表面，并在加工期间保持足够的电导率。过滤器和电介质等消耗品很大程度上取决于要加工的材料和各种控制参数。机器上安装了传感器，以持续监控这些设备。使用的电介质仅仅是去离子水，其电导率仅为
    15 µ-siemens/cm。


    此处使用的电介质起着维持 20°C 温度的主要作用，同时清洁并保持电极和工件之间的去离子化间隙。为此使用了两个储罐，其中安装了过滤器，维持电介质的压力并持续清洁电介质。在图
    (6) 中，我们可以看到旨在稳定电介质电导率的电介质回路布局，因为随着加工过程中产生的新细颗粒的引入，电导率会发生变化。因此，尽管预先安装了大量传感器，仍在使用新的去离子化系统来降低这种增加的电导率并使其稳定。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_139_0.png)


    图 (6). 电介质回路布局 [31]。


    该布局包括压力传感器、电导率传感器以及 pH 和氧化还原传感器的组合。还在过滤器入口处使用压力传感器维持过滤器压降的监控。设定压力值上限为 2.8 bar，超过该值机器将自动停止。对给定材料进行加工后，获得了每个设置的压降图，并计算了树脂中蚀除颗粒的重量。这表明在大约
    304 个有效加工小时中，通过加工工件和丝线，总共去除了 4kg 的 WC（碳化钨），并且在加工过程中侵蚀了约 7.7 kg 的丝线。与树脂中收集碎屑的数量相比，发现总共
    5.4 Kg 在加工过程中以离子形式被吸收。最后，创建了一个模型来预测压降。触点磨损

