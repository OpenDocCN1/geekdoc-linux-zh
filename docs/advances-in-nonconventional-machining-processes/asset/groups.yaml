    ## 第 9 章


    ## 制造业中的人工智能与机器人：机遇与挑战


    Hitesh Pahuja*，PK Khosla 和 Balwinder Singh


    印度旁遮普邦莫哈利，高级计算发展中心


    **摘要**：如今由人类所做的任何工作，未来都将由基于人工智能（AI）的系统完成，但以计算机的速度、规模和范围进行。人工智能正致力于推动制造业的转型并改进制造流程。根据《福布斯》技术委员会成员的观点，包括制造业在内的
    13 个不同行业将被人工智能彻底改变。人工智能和机器人技术可以将复杂的任务转化为一致且精确的解决方案。随着工业机器人操作的增加，制造业中人工智能的部署显著增加。人工智能在制造领域得到广泛应用并逐渐渗透，利用学习算法通过学习和无错误决策简化自动化流程。人工智能驱动的系统正在为未来制造业开辟更简单的道路，通过提供创新前景、提高生产效率以推动商品生产，以及实施通用人工智能使机器交互更接近人类交互，从而带来诸多好处。该技术使制造商能够克服制造业中长期存在的各种挑战，如专家短缺、决策失误、集成相关问题以及数据过载。因此，在制造业中实施人工智能使公司能够全面革新其流程。它允许智能
    AI 机器人/机器收集和提取数据，识别各种模式，从模式中学习，并根据分配任务的复杂性，通过机器或基于深度学习适应新环境。因此，在工业界部署人工智能和机器人将变革大规模生产，并具备无错误决策能力。工业
    4.0 中基于人工智能的机器人可以执行持久行动，例如设计制造模型、开发专业知识、开发新的自动化解决方案、消除人为错误以及在产品中提供卓越质量。随着人工智能的实施，机器人将取代人力并执行危险活动。因此，制造业各部门的事故数量将下降。


    \* 通讯作者 Hitesh Pahuja: 印度旁遮普邦莫哈利，高级计算发展中心；邮箱：hitesh@cdac.in


