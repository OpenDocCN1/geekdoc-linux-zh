    ## APPLICATIONS OF AWJ MACHINING


    The following are the application of AWJ machining:


    - 1. AWJM process is applicable in the machining of industrial components.

    - 2. AWJM substantially reduces the cycle time and become a potential candidate
    to replace conventional milling.

    - 3. AWJ cutting has the capability to cut complex shapes and drill difficult
    holes. Various applications in the cutting of materials have been developed [4].

    - 4. AWJM find application in the field of shale oil to cut hard rocks with the
    use of abrasive slurry.

    - 5. Applicable in machining heat resistant and higher strength materials use
    in aerospace.

    - 6. Glass, ceramic, stone, ferrous and nonferrous alloys are successfully cut
    using AWJM and WJM [41].

    - 7. Sustainable AWJM find applications in fields of sustainable engineering where
    abrasive and other materials used in cutting are suitably recycled [42].

    - 8. Ti/Ni alloys for aerospace parts are suitably cut using AWJM that are otherwise
    difficult to cut [43].

    - 9. Sustainable cleaning and degreasing of discs and PCB can be achieved using
    Ice jet machining [44].


    ## FUTURE SCOPE


    Machinability study on stainless steel still is a key area where AWJ can find
    various applications. There is scope to conduct full factorial experiments. Limited
    reports are available on surface texture and behavior while machining composite
    materials. Abrasive particle size and shape distribution are still not fully explored.
    Future research can see directions in these areas.


    ## CONCLUSIONS


    Based on the literature review it has been concluded that WJM methods possess
    tremendous potential to machine or cut the work piece material. Abrasive jet (AWJM)
    and water jet (WJM) are extensively used to machine or cut precision part and
    difficult surfaces. MRR in the AWJM process is most influenced by the abrasive
    particle size. MRR substantially depends upon carrier mode and fluid properties.
    The performance characteristics of the AWJM process such as MRR and surface roughness
    have been improved together by using various optimization techniques. Striking
    advantages have been achieved due to the non-existence of heat affected zone.
    Due to this material do not experience any distortion.


