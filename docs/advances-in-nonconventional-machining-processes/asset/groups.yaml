    Fig. (1). Trend of tool wear rate with different abrasive particles used during
    drilling.


    Wang et al. presented the cutting force and material removal mechanism in rotary
    ultrasonic machining. The defects produced during drilling were brief, such as
    edge chipping, tearing defects, and subsurface damage. The damage reduction techniques
    and optimization of processing parameters were also described. During machining,
    damages were produced at the hole exit. This could be reduced if cutting forces
    were less than critical cutting forces. By optimizing process parameters, damage
    during machining can be reduced [29].


    Wang et al. investigated the critical cutting forces in rotary ultrasonic machining.
    The cutting forces were analyzed to develop a novel index which was required for
    the design and manufacturing of an ultrasonic machine tool. In the paper, the
    effect of cutting force was analyzed on processing parameters and ultrasonic amplitude.
    Also, the effect of critical cutting forces on rotary ultrasonic m/c tools were
    analyzed & method of improvement discussed [30].


    Popli & Gupta investigated edge chipping problems during drilling with rotary
    ultrasonic machining. An experiment was designed to remove the edges produced
    during drilling at the hole exit by increasing the support length. It helped in
    reducing the edge chipping size up to 50%. The relation between chipping size
    and support length was given by chipping size proportional to l/support length
    [31].


    Mikhailova et al. presented the results of drilling techniques of conventional
    drilling and ultrasonic assisted drilling in marble. Experiment’s results are
    in favor of ultrasonic assisted drilling. It was observed that jobber drill bit
    is preferable for drilling in marble also, but the feed rate has certain limits
    [32].


    Wang et al. developed a surface model depending upon kinematics analysis and fracture
    mechanics of brittle materials. This model helped in predicting at which parameters
    surface roughness will increase or decrease. In this paper, when spindle speed
    was 2000 rpm, surface roughness was very low and surface topography was better
    but when spindle speed was between 2500-3000 rpm, surface roughness was high [33].


    Wang et al. investigated the problem of high cutting forces, high surface roughness
    during machining of hard and brittle material like CFRP composite. Rotary ultrasonic
    surface machining, with vertical ultrasonic vibrations up to some extent, reduced
    the cutting forces but produced higher surface roughness than conventional surface
    grinding. To improve this parameter, experiment on rotary ultrasonic surface machining
    with horizontal ultrasonic vibrations was performed. This helped in reducing cutting
    forces and improved surface roughness compared to conventional surface grinding
    [34].


    Wang et al. pointed out the material removal mechanism in rotary ultrasonic surface
    machining of CFRP composite. For this, single abrasive scratching test has been
    conducted. At small scratching depth with indenter of single diamond grain size
    whose point angle was 100°, ductile material removal mode mechanism was observed,
    and brittle removal mode was observed when scratching depth was large. In ductile
    material removal mode, surface observed were without crack whereas in brittle
    material removal mode, cracks were observed during machining. Similarly, with
    less scratching depth, force was less in ductile mode and in brittle material
    removal force was large [35].


    During study of research papers, it was observed that rotary ultrasonic process
    is superior to ultrasonic machining.


    ## CONVENTIONAL MACHINING VERSUS NON-CONVENTIONAL MACHINING


    Conventional machining is a traditional machining process in which the tool is
    in direct contact with the workpiece during machining and has limitations to machine
    certain material and to produce complex shapes whereas non-conventional machining
    has no direct contact between tool and workpiece. It has no limitation to machine
    any material.


    ## ULTRASONIC MACHINING VERSUS ROTARY ULTRASONIC MACHINING


    Ultrasonic machining is a machining process in which shaped tool conversely to
    the required cavity is axially vibrated and fed towards the work piece with controlled
    parameters [36]. Slurry is inserted between tool and workpiece which plays the
    role of cutting. The schematic diagram of ultrasonic machining with basic elements
    and working principle are shown in Figs. (2 and 3).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_20_0.png)


    Fig. (2). Schematic diagram of Ultrasonic Machining set up [28].


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_20_1.png)


    Fig. (3). Working Principle of Ultrasonic Machining Process.


    Whereas in rotary ultrasonic machining, drill rotates continuously and is also
    having axial vibrations [37]. No separate slurry is fed between tool and workpiece.
    Cutting tool is specially designed in which abrasive grain particles are bonded
    on the tool body as shown in Fig. (4) [38]. In rotary ultrasonic machining, abrasive
    particles are directly bonded on drill tools. Then rotary and vibrated drill provides
    a fast, accurate and high-quality hole in a variety of materials like glass, ceramic
    materials etc [39].


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_21_0.png)


    **Fig. (4).** Working Principle of Rotary Ultrasonic Machining Process.


    Rotary ultrasonic machining is a hybrid machining process which combines ultrasonic
    machining and conventional grinding together for getting better machining results
    [23].


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_21_1.png)


    **Fig. (5).** Schematic diagram of Rotary Ultrasonic Machining set up [23].


    The study reveals that only the controlled parameters of ultrasonic machining
    can increase the machining efficiency. The parameters are amplitude of vibrations,
    abrasive grain particles shape and size [25, 28], effect of applied static load
    etc. These controlled parameters can reduce the cutting forces for better performance
    of process [6, 13 - 15, 17]. Rotary ultrasonic machining is the up gradation for
    static ultrasonic machining [40]. The schematic diagram of rotary ultrasonic machining
    is shown in Fig. (5).


    ## CONCLUSIONS


    - 1. Ultrasonic machining has overcome the conventional machining problems in
    which the tool remains in direct contact with the workpiece whereas in ultrasonic
    machining, tool is periodically lifted from the workpiece or job, hence reduced
    tool wear rate.

    - 2. It can machine hard and brittle material which has a restriction in conventional
    machining process

    - 3. Ultrasonic machining features get improved when combined with other conventional
    and non-conventional machining.

    - 4. Firework algorithm, a mathematical approach for parameters optimisation of
    ultrasonic machining, can be implemented.

    - 5. Vibration assisted machining eliminates the use of cutting fluid or coolant.
    During machining, periodic work-tool separation maintains the gap which helps
    in dissipating heat from the cutting zone.

    - 6. It helps in reducing environmental hazards which was due to coolant and improves
    the machining efficiency.

    - 7. During literature review, it is observed that rotary ultrasonic machining
    has been utilized for drilling operation which shows good results like high material
    removal rate, low tool wear rate and good surface finish as compared to static
    ultrasonic machining drilled components.

    - 8. In hard and brittle materials, rotary ultrasonic machining can be preferred
    for drilling operation instead of static ultrasonic machining for better results.

    - 9. Research shows that in recent years, rotary ultrasonic machining is gaining
    popularity due to its intelligent machining of hard and brittle material. In aerospace
    industries, a gang of drills are utilized to create numbers of holes at same time
    with this process.

    - 10. For better results spherical shape abrasive particles can be utilised rather
    than sharp edges particles.

    - 11. The consumption of abrasive particles can be reduced in rotary ultrasonic
    machining as it is bonded on tool surface whereas in ultrasonic machining, it
    inserts separately.

    - 12. Finally, static ultrasonic and rotary ultrasonic machining has solved the
    problem of machining the hard and brittle material which is very superior in quality
    and also costly.


    ## FUTURE ADVANCEMENTS


    During study of research papers, it was noticed that rotary ultrasonic machining
    was utilised for drilling and surface milling operations in hard and brittle materials
    only. It showed its restrictions in other operations. Even it doesn’t talk about
    other drilling related operations like spot facing, counter boring, milling cum
    drilling combined and tapping also. There may be certain reasons behind this but
    left some area for further research work.


