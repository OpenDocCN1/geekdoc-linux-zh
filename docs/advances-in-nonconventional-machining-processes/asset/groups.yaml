    ## CONCLUSIONS


    It has also been observed that the tool end gets flattened and deformed over a
    period of time. It can be avoided if the electrode end is replaced with hard conducting
    materials like cermets. These cermet tooltips can have the desirable properties
    of different combined materials. For the fabrication of tool, many methods have
    been used. Complexity of the geometry and the precision required commonly determines
    the manufacturing cost and fabrication technique to be used for the fabrication
    of the electrodes. The conventional methods take more processing time and the
    wastage of material is also more, especially during the fabrication of complex
    shape tool profiles.


    The cermet tool tips can be fabricated by casting, solid phase sintering, rapid
    prototyping and tooling, spray metal deposition, direct metal laser sintering,
    abrasive water jet machining, powder metallurgy etc. Some of the casting methods
    like investment casting are expensive and takes more time. The processes like
    net shape casting have lesser dimensional accuracy [51]. The electrodes produced
    by selective laser sintering process have very high porosity (upto 20%), higher
    wear and produces machined cavity with very low accuracy [41]. The electrodes
    produced by spray metal deposition have the problem of uneven thickness of coating
    and sometime the spray metal also penetrate the base material [45]. In some of
    processes, like stereolithography and direct metal laser sintering, uneven coating
    thickness was observed rendering the electrodes unsuitable for EDM process [40].
    The electrodes produced by electroforming have very high surface roughness [49].
    Abrasive water jet machining jet which produced kerf on the fin length due to
    this taper produced on the produced components/ electrodes. Another problem associated
    with this process is that the side walls of the blind cavities got machined because
    the tool was not masked on the sides Pal and Choudhry [53].


    In powder metallurgy (P/M) technique, it is possible to combine the desirable
    properties of different materials and change the physical properties through compacting
    pressure and sintering temperature [40]. Thus, through P/M there is better control
    of the properties of the electrode possible. Ease of fabrication, flexibility
    of composition and efficacy in dispersing fine particles [34] are the benefits
    of powder metallurgy thereby making it a suitable method for electrode fabrication.


