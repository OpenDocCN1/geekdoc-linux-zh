    ## 低温技术在 AJM 中的应用


    前文已讨论过，由于使用磨料时无法通过精确定尺寸加工较软的金属，且细小的磨料具有高动能和高速度，在垂直撞击表面时容易穿透表面。因此发现，对于具有延展性或软质材料特性的工件，很难通过相同原理（即针对脆性或硬质材料的侵蚀原理）进行大量材料去除。因此，为了加工此类材料，引入了低温技术，以便改变材料去除机制。使用
    AAJM（干式磨料射流加工）和低温辅助 AJM（磨料射流加工）对 AA5083-H32 铝合金进行了加工，并对表面完整性进行了对比研究 [16]。在该研究中，他们使用
    -195°C 的液态氮，并通过压缩空气将其输送到加工区域。这导致硬度大幅提高，从而减少了侵蚀过程中嵌入材料的磨粒数量。伴随的现象是连续粗糙度的峰谷轮廓。使用的液态氮还产生了应变效应，从而通过晶粒细化使被加工材料硬化，显微硬度提高了近两倍。其他研究还采用了配备液态氮的热交换器，不仅用于冷却待加工材料，还用于冷却气流
    [17, 18]。使用了 L N2 型管状热交换器，其内部具有高导热性，外部具有低导热性。磨粒在 -80°C 的射流条件下被导向材料。温度从 -80°C 变化到
    180°C。当射流温度达到 -180°C 时，观察到侵蚀原理转变为脆性断裂。


    该研究还发现，30°至 60°的入射角对于最大材料去除率（MRR）是最理想的。该研究表明，在 -180°C 下也可以获得对软材料的侵蚀。在较低温度下，利用脆性去除机制对这类材料进行更精确的加工也是一个值得考虑的方面。然而，使用液态氮也存在一些缺点，因为它本身需要大量的能源和能源消耗，并且如此高的冷却会导致材料内部热应变引起裂纹形成。但研究发现，这也导致表面弱化，这有助于材料的后续侵蚀。


    ## 热增强 AJM


    *Patel 等人* [19] 发现，如 Inconel 718 和钛合金（Ti6Al4V）等某些材料不易加工；为了使磨粒能够穿透表面并产生侵蚀，这类材料需要具有较低的硬度。为此，通过氧气-乙炔气体火焰将工件加热至
    850°C 以提供某种热辅助，从而降低表面硬度并提高使用磨料水射流加工时的 MRR。尽管过程中温度发生了剧烈变化，但在加工后的零件中并未发现应力和裂纹。


    ## 各种射流条件的影响


    ### 间歇射流条件


    研究发现，当制造较大的沟槽或空腔时，磨粒有趋向于在这些特征底部沉降的趋势，从而阻碍后续新的磨粒到达被这些磨粒遮蔽的底部，进而降低 MRR。通过创建磨料流动的间歇阻塞模式，并在该时间段内通过高压射流来解决这种颗粒堆积的问题。这是通过安装
    100 Hz 电磁阀来实现的，该阀门有助于创建磨料和高压空气射流的交替模式 [20]。这有助于去除底部的积聚磨料。研究发现，在一次 500 次射击的样本研究中，开/关时间为
    10/40 毫秒时，孔深从 440μm 增加到 740 μm。


    ### 淹没射流条件


    随着 AJM 的进步，带来了大量的技术和经济优势，但其环境影响也随之显现，例如过程中产生的噪音。为了研究这一方面，采用了淹没式 AWJM（磨料水射流加工）[21]。这在一定程度上降低了粒子到达加工表面前的动能。这也减少了射流上的拖曳力，从而导致沿喷嘴直径的射流衍射减少
    [22]。这也提供了解决在加工过程中环境中粉尘较少问题的思路，传统方法中观察到的粉尘会导致肺部损伤等医疗影响。研究发现，当使用甘油作为淹没液体时，最大可减少
    61%，配合液态聚合物可减少 42%，用水则减少 36% [23]。当液体与磨料浆液混合，且仅将高速射流直接导向工件时，喷嘴寿命有了显著提高。唯一的缺点是粒子的速度显著降低。


    ## 应用领域


    磨料射流加工在许多领域都有应用，既有一些优势，也存在一些缺陷。本节讨论其中的一些优势及缺陷，并分析其在摩擦学领域的应用。以下是列举的一些优点：


    - 它不仅发现了其技术方面，还发现了其环境方面，这可能带来更好的加工能力和环境可能性，从而提高工艺灵活性。

