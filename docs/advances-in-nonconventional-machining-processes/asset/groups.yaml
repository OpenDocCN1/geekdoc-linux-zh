    ## 第 6 章


    ## 陶瓷基复合材料电火花加工综述


    **Manta** 1.*, **Suneev Anil Bansal** 1 和 **Bhuvnesh Kumar** 2


    1. 印度哈里亚纳邦索兰巴迪 Maharaja Agrasen 大学机械工程系

    2. 印度哈里亚纳邦 SRM 大学德里 NCR 校区机械工程系


    **摘要：** 电火花加工（EDM）是一种非传统工艺，已被广泛用于切割镍及其合金、钛以及复杂形状材料等较硬的材料，这些材料通过其他传统方法难以加工。EDM
    利用电能和热能通过去除多余材料来加工工件。该工艺使用两个电极，即阳极和阴极，其中工具作为阴极，接受加工的工件作为阳极。电流、脉冲开/关时间、施加电压等因素可用于优化
    EDM 的主要加工参数，如材料去除率（MRR）、工具磨损率、表面粗糙度等。本研究的主要重点是这些参数对由陶瓷基复合材料（CMs）、钨和碳化钴等制成的复合材料的影响。最后，还讨论了需要进一步改进和研究领域的未来前景。


    **关键词：** 陶瓷，复合材料，电火花加工。


    ### 引言


    电火花加工（EDM）是一种用于金属加工的流行制造工艺。在该工艺中，通过控制电极和正在接受操作的工件之间的火花，以熔化并蒸发所有具有电导性质的材料的形式进行加工
    [1, 2]。这就是 EDM 也被称为非传统火花侵蚀热电加工过程的原因 [3]。经过一段时间的发展，EDM 已成为一种高效的材料去除工艺。EDM 具有加工非常复杂和坚硬材料的能力，并且还能保持高精度，而这些材料用其他传统方法很难加工。


    为了跟上现代制造业的步伐，EDM 也具有成为自动化工艺的能力。EDM 主要应用于原型制造、模具和量具制造行业，以及主要涉及加工金属（如高合金钢）生产的行业。


    在过去几十年中，陶瓷材料（CMs）通过在所有主要工程部门（如汽车、航空航天、涉及电气和电子设备制造的领域）中的应用而确立了其地位。一些主要应用，如防弹装甲的制造、汽车制动系统、柴油颗粒过滤器、计算机存储器组件、传感器以及各种医疗产品（如假肢）等，也涉及
    CMs 的使用 [5]。CMs 具有如此广泛应用的原因在于其优异的机械性能，如高抗压强度、高硬度以及耐化学和耐磨性能。


    WC-Co 也被探索用于 EDM 加工。一份特别 CIRP 报告也提到了 EDM 在硬质合金中的应用 [6]。尽管据报道 EDM 表面确实存在残余热应力 [7]。某个团队


