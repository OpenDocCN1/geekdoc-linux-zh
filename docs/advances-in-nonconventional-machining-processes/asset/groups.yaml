    - 一种带有微观尺度雕刻沟槽的钼合金已被开发出来，可应用于假体，以最大限度地减少磨损 [32]。此外，其他研究还制造出了更小的孔和沟槽，其尺寸分别可达 100
    μm 和 40 μm。这将整体促成人造膝关节和髋关节的发展，从而在摩擦学领域开辟出一个广阔的研究区域。


    ## 材料去除机制


    在较早的章节中，可以看出磨粒流喷砂加工（AJM）已在具有延展性和脆性的各种材料以及各种工艺参数中找到了多种应用。与此同时，近期发现了一种名为“弹性侵蚀”的新型侵蚀现象。总体而言，材料去除机制（MRM）体现了机器的效率。对于脆性材料，磨粒撞击机器表面，并在向下方向上产生垂直于表面的裂纹，导致在变形材料截面区域底部形成一条平行于上表面的斜向裂纹。这里假设崩落的部分呈半球形，其深度或半径等于单个磨粒撞击产生的裂纹。已有许多研究将标准模型与陶瓷的韧性、硬度和粘弹性、产生的崩落物几何形状以及磨粒压入力与崩落物半径之间的关系进行了关联。作者还指出，裂纹扩展对于特定材料来说必须具有特定的能量。


    ## 弹性模式 MRM


    前文已讨论过，表面完整性受颗粒尺寸的影响 [4]。脆性/延展性侵蚀会导致微观层面的表面结构发生变化。当我们将磨粒尺寸从 120 nm 减小到 40 nm 时，未发现表面粗糙度效应。因此，使用颗粒有助于减少最终加工表面上的变形和裂纹。因此，在使用小于
    100 nm 尺寸的磨粒时，强调将压入机制转变为“表面积机制”。常规的大尺寸磨粒在表面上沿直线移动，但细磨粒可以随气流改变方向。对于特定的磨粒质量与流速之比，会出现切向力，从而将路径改变为曲线轨迹，并渐近地撞击工件基体（图
    4）。因此，在侵蚀能量低于阈值能量但在基底表面产生侵蚀的情况下，即发生了弹性侵蚀。考虑到这一点，提出了一种基于产生化学侵蚀（即弹性侵蚀）的新理论，该理论考虑了羟基化效应和化学吸收。在此过程中，纳米级颗粒与基底表面发生化学反应，在基底顶层
    1nm 距离内形成键合。Peng 等人 [33] 还指出，表面可被磨平至 0.17nm 的 Ra 粗糙度。在此机制中，最终工件表面未见缺陷。


    ![Fig. 4](img/020b405a9ddccb1e0ee51cb33242cd00_89_0.png)


    Fig. (4). 不同尺寸磨粒遵循的路径对比 [33]。


    ## 各种工艺参数的影响


    ### 磨粒尺寸


    磨粒尺寸在任何磨粒射流机床中都起着非常重要的作用。随着磨粒尺寸的增加，与之相关的体积和质量发生变化，进而影响磨粒的动能，从而影响 AJM 的材料去除率（MRR），如表
    1 所示。但是，即使颗粒比喷嘴尺寸小 15 倍，喷嘴尺寸也限制了所用磨粒的尺寸上限。研究发现，颗粒尺寸的增加还会导致表面粗糙度增加和产生更大的崩落物 [34]。Kowsari
    等人 [35] 在其研究中指出，尺寸为 25µm 和 10µm 的颗粒在烧结陶瓷材料加工中产生了相似的峰谷粗糙度。对于陶瓷，崩落物是通过从基底剥离晶粒，然后与具有更强结合强度的金属晶粒结合而去除的。观察到的另一个因素是磨粒对工件表面的撞击，这被认为归因于两者之间的静摩擦。还发现，细颗粒与大尺寸磨粒相比，嵌入倾向较低
    [36]。


    ### 流量


    流量定义为在相应量的载气、液体或浆料中供应的磨粒颗粒的克数。*Li 等人* [37] 表明，流动动力学也可能取决于除此外的其他工艺因素。研究表明，随着流量降低，产生的沟槽形状变为略微锥度。使用干燥剂、保持储层中低水平的磨粒
    *等* 被认为能带来最佳的磨粒流动。


    ### 喷嘴材料和几何形状


    就像整个加工过程中的刀具磨损一样，喷嘴磨损在所有类型的 AJM 中都会发生。它是 AJM 中最精密的部分。携带颗粒的高压载气介质通过喷嘴孔洞。在通过过程中，颗粒多次与喷嘴内壁碰撞，从而导致其磨损及其轮廓扰动、过程不稳定性以及射流扰动。因此，将其视为改进领域非常重要。喷嘴磨损以‘喷嘴重量损失率’（NWLR，克/分钟）来衡量。在各种建议的喷嘴材料中，氧化铝陶瓷喷嘴的使用寿命比不锈钢喷嘴更长。与
    Al<sub>2</sub>O<sub>3</sub>/钨、钛涂层相比，单一 B、C 涂层的 NWLR 降低了 30%。与此同时，发现功能梯度材料（FGM）的涂层证明了其耐磨性高达标准喷嘴的
    4 倍。通过模拟相同的有限元（FEM）模型，还观察到喷嘴入口处的应力水平降低。同时，增加喷嘴长度会降低出口处的磨损速率。这样做后，颗粒速度矢量沿喷嘴长度获得相同的方向，从而减少了磨损。将喷嘴长度从
    76mm 增加到 126 mm，喷嘴寿命翻倍。发现孔：喷嘴直径的最佳值为 0.4 [38]。还发现，拉应力和热应力也会导致大量喷嘴磨损。发现喷嘴入口的最佳角度为
    11°。同时，较大的入口角度会产生更大的应力。


