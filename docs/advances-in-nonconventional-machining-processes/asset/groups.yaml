    ## 激光束加工与复合工艺文献综述


    参数对实现切割深度和表面粗糙度有重大影响。通过分析光学和扫描电镜（SEM）显微照片，可以深入了解激光微加工过程参数设置。研究发现，在灯电流 23 安培、脉冲频率
    800Hz、扫描速度 6.6 mm/s 的设置下，经过单次激光束微车削后可获得良好的表面光洁度 [16]。


    Kim *等人* 对复合工艺进行了研究，该新工艺为激光辅助车削。在此工艺中，利用激光辅助加工和 CNC 车床进行加工。文中讨论了激光辅助车削中的三个问题：加工过程、热处理和设备机构。在此过程中，由于短波长具有较高的吸收率，因此采用了高功率二极管激光器代替
    CO$_{2}$ 或 Nd: YAG 激光器。在激光束车削领域，观察到的研究工作非常少，特别是在铣削方面。因此，在该领域进行研究变得十分必要 [17]。


    Phiphon *等人* 利用通用算法改进和优化激光束加工过程参数。使用响应面方法设计了实验和数学模型，然后应用通用算法以获得最佳结果。在表面粗糙度和切缝锥度方面获得了最佳结果。因此，结果证明通用算法是一种良好的优化技术
    [18]。


    Loumena *等人* 讨论了轻质 CRPF 材料的隐藏潜力。激光加工通过切削提高了这种高强度且耐腐蚀良好的材料的可行性。在实验中，使用了具有特定技术规格的新一代
    BOREAS 系列纳秒激光器。通过使用这种激光器，CRPF 材料过度加热的缺点在某种程度上得到了减少，并建议在未来使用准分子激光器或棒型光纤激光器 [19]。


    Mishra *等人* 详细阐述了开发激光束穿孔钻孔预测模型的耦合方法。利用了两种方法：有限元分析和人工神经网络。实验针对激光钻孔过程中产生的孔锥度进行了研究。优化后的参数显示，孔锥度减少了
    67.5%，热影响区减少了 3.25%，材料去除率提高了 65% [20]。


    Nasim *等人* 讨论了二极管激光器相关技术及其测量技术。该工艺能够生产出尺寸极小且加工可靠性高的产品。该工艺的应用包括癌症识别、爆炸物检测以及空气和水质监测等医疗领域。当前论文讨论了二极管激光器从医疗实验室到工业加工的应用
    [21]。


    Venkata *等人* 综述了所有非传统加工过程，重点在于这些过程的优化参数。这些过程包括电化学加工、微加工、纳米加工、复合工艺和激光束加工。本综述的目的是概述所有过程并为该领域的新研究方向提供指导。本文还对这些过程及其相关过程进行了比较
    [22]。


    Venkatesan *等人* 总结了激光辅助加工及其切割硬脆材料的潜力，这是一种复合方法。本文研究了钛合金、镍基合金、陶瓷和复合材料的激光辅助加工，并为激光辅助加工工艺的优化留下了空间。结论指出，复合工艺可用于提高难以用传统方法加工的材料性能
    [23]。


    Liu *等人* 介绍了超声辅助水约束激光微加工。实际上，在激光束加工过程中会产生许多缺陷，并且产生的切屑会沉积在工件材料上，从而产生有害的热残余效应。本文引入了超声辅助水约束激光加工，消除了激光束加工中产生的缺陷。结果显示，该方法中碎屑沉积较少
    [24]。


    Mishra *等人* 讨论了利用超短激光脉冲在硬质材料中创建微加工及其分析。工业界可以利用这种先进的加工方法。这被称为激光束微加工，而在激光束加工中，通常利用高激光脉冲。激光束微加工用于制造只读存储器芯片、三维尺寸结构和生物光学芯片。当前论文强调了短脉冲或超短激光脉冲与不同类型材料相互作用的本性
    [25]。


    Darnish *等人* 比较了用于加工 Inconel 718 高温合金的两种加工介质：湿式和干式。研究发现，水下加工比干式介质更具生产效益 [26]。


    Ahman *等人* 比较了微电火花加工（micro-EDM）和激光加工，这是一种复合工艺。观察到，在不影响微孔质量的情况下，该工艺将加工时间缩短了 50-65%。在难以通过常规机械加工过程加工的
    Ni-Ti 合金中钻出微孔。因此，利用这种复合工艺对其进行加工。微电火花加工工艺用于制作小于 200 微米的孔。在 Ni-Ti 合金的微钻孔中，使用黄铜电极的材料去除率相对较高，在不影响微孔质量的情况下观察到
    40-65% 的增长 [27]。


    Alahmari *等人* 提出了水下激光束加工，用于制造基于镍的 Inconel 718 高温合金中的微通道，不同参数的激光分析结果表明，水下激光束加工可以提高工件质量
    [28]。


    Lee *等人* 分别综述了激光和电弧热源在加工中的应用。作者提出了激光电弧辅助复合工艺 [29]。


    Firdaus *等人* 综述了材料表面特性的摩擦学方面。使用 Nd: YAG 激光进行激光束加工以减少磨损和摩擦，从而改善表面纹理。在本文中，比较了两种表面纹理处理的执行方式。通常，在大多数方法中，纹理直接在工件上进行；在某些情况下，研究在涂层材料上进行。涂层材料有助于减少摩擦和磨损。研究表明，陶瓷涂层材料被用于通过消除摩擦和磨损来改善表面纹理
    [30]。


    Lee *等人* 综述了激光辅助复合工艺，因为这些工艺对各种难以切割的材料有重大影响。使用这些工艺观察到加工性能的改善，并识别出切削力大幅降低。讨论并比较了不同激光的特性。CO$_{2}$
    具有更高的波长 [31]。


    Wang *等人* 演示了利用激光束加工钻孔陶瓷材料。研究了钻孔质量，并利用计算方法处理激光束加工的输入参数。讨论了陶瓷钻孔的不同方法，在激光钻孔领域仍需更多工作以实现更高的精度
    [32]。


    Mishty *等人* 专注于研究液体辅助激光束微加工。这是在微米级别加工材料表面的绝佳方法。通过该工艺，可以在某种程度上改善因高温和表面光洁度差导致的热损伤。为了理解过程参数，利用了有限元模拟技术。结果显示，水下加工通过减少表面损伤和改善表面光洁度而取得了良好结果。微加工在有或无液体参与的情况下均进行了执行
    [33]。


    Dutt *等人* 将研究重点放在脉冲 Nd: YAG 激光束在钻削不同高强度、难切削材料（如高温合金、复合材料、陶瓷、铁基和非铁基材料）中的应用。综述强调了在钻削不同材料中使用激光以提高工艺生产率
    [34]。


    Sherpa 和 Pradhan 探索了使用 Nd: YAG 激光增强不同材料微加工的各种参数。使用二极管泵浦固体激光器进行微加工。发现材料去除率随频率增加而线性增加。表面粗糙度也随二极管电流增加而增加
    [35]。


    Rana *等人* 研究了检查加工对材料影响及材料特性变化原因的不同技术。研究人员还探索了激光束加工在工业中的应用，特别是航空航天、军事和航空领域。实施了各种技术，如田口方法、遗传算法、响应面方法。观察了相互关联的参数。结果表明，在切割低碳钢时，氧气在加工较厚材料方面给出了最佳结果，而惰性气体则用于较薄材料
    [36]。


    Faisal *等人* 综述了激光束加工和激光束微加工工艺。这些技术为硬质材料加工领域带来了革命。激光工艺也被用于医疗、航空航天和通信领域。激光可以生产直径
