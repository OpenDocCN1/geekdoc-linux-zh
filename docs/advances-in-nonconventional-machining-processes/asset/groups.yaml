    # Wire Electric Discharge Grinding


    In order to produce cylindrical micro-parts, machining process like wire electric
    discharge grinding (WEDG) is preferred [14]. In WEDG process, micro rotary parts
    such as rods and pins are machined with high precision [15]. However, the WEDG
    process can fabricate micro rotational parts with curved contour profile precisely
    ; the machining efficiency is very limited. Besides, this technology depends on
    an expensive and dedicated micro EDM machine, which restricts the popularization
    of the technology in common industries [16].


    # Micro Wire Electro Discharge Grinding


    In micro-WEDG the uses of the grinding wheel are replaced with micro wire which
    acts as an electrode. When fine rod needs to be ground, it acts as a workpiece
    and allowed to be rotated while the electrode (micro wire) is held stationar y.
    This process utilizes the electrical sparks or thermal energy produced to remove
    the unwanted materials from the workpiece in order to make the desired shape [17].
    However, wire breakage control is most critical aspect of micro-WEDM process from
    technical and economic grounds.


    # Wire Electric Discharge Turning


    Wire electrical discharge turning (WEDT) process is one of the emerging non-traditional
    machining processes for the manufacture of micro- and axi-symmetric components
    [18]. In WEDT and WEDG, the erosion mechanism is similar to that of the WEDM process
    with a difference that in WEDG the workpiece is fed in longitudinal direction
    rather than in horizontally as in WEDT. Moreover, the characteristics of process
    variants of the WEDG and WEDT process are in the relative motion between the tool
    and workpiece electrodes and the feed.


    # Abrasive WEDM (AWEDM)


    In this process, electrical sparks along-with abrasives abrade the workpiece surface.
    Higher material removal rate and better surface finish can be accomplished by
    integrating WEDM with abrasives of fine size.


