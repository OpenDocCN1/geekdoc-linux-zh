    # Abrasive Water Jet Machining


    Abrasive water jet machining is the advancement in the traditional machining process
    that replaces the carrier gas with the water and has found its key application
    in mining industry [7]. It is sometimes compared with slurry jet machining which
    works on two different modules of lower pressure with a premixed slurry mixture.
    In this, the viscosity of the medium plays an important role as the jet at the
    nozzle is improved up to 100 times as compared to air. It is seen that the AWJM
    has made a lot of improvements as roughness is reduced to nano scale [8], distant
    footprint [10], faster workpiece cools down and adequate slurry recovery [11,
    12]. But the impact velocities are found to be different due to high deceleration
    in the water stagnation zone and the high influence of viscosity on trajectory
    of abrasive (Figs. **2 & 3**). After this the abrasive particles lose all its
    kinetic energy. Higher MRR is seen in air as compared to water as it provides
    less stagnation zone. Some research has also been done to reduce this stagnation
    zone [13] and proposed the usage of V shaped masks. It is also seen that use of
    soybean oil as carrier of abrasive can reduce the secondary impact on the workpiece
    in primary footprint [14]. The disadvantage of this is seen in the form of crack
    formation and its propagation due to the pressure of fluid used especially when
    working on ceramics [15].'
