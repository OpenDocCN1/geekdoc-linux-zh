    EDM 处理的复合材料 MRR 和表面粗糙度的主要因素。Aidil 等人 [40] 开展研究并仔细审查了影响 EDM 工艺的各种加工因子的各种参数。观察到，随着脉冲开启时间的增加，由于等离子通道的扩张，材料去除减少，从而导致
    MRR 率和材料表面粗糙度降低。同样，随着脉冲关闭时间的增加，这些参数的值也增加。


