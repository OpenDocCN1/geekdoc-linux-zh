    MRR（136.1 mm³/min）和低 TWR（3.32 mm³/min）。与铸造电极相比，烧结电极在 EN-8 和 D3 钢上显示出更好的表面光洁度。


    Pal 和 Choudhry [53] 通过磨料水射流加工（AWJM）制造用于电火花加工（EDM）工艺的铜和黄铜电极。在保持电压、电流、占空比和脉冲持续时间恒定的情况下，在不锈钢和
    Ti-6Al-4V 上制作了一系列孔。观察到由磨料水射流加工产生的工具尺寸与工件尺寸之间的偏差，如图 (9) 所示。有两个原因被认为对此负责。第一个是由磨料水射流加工射流的本征特性在工具上产生的锥度，在鳍片长度上产生了狭缝。第二个逻辑是盲腔的侧壁被加工，因为工具两侧未进行遮罩。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_44_0.png)


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_44_1.png)


    图 (9)。AWJM 的理想切割与实际切割 [53]。


    Goyal 等人 [54] 研究了使用通过粉末冶金技术制造的 Cu-Mn 工具对 EN31 钢进行电火花加工（EDM）加工后的硬度和表面粗糙度（SR）。放电电流和脉冲持续时间被选为加工变量。发现使用
    70Cu-30Mn 电极加工的表面显微硬度为 913 VHN，比铜电极高 11.94%，比 80Cu-20Mn 电极高 3.39%。然而，由于孔隙率特性，粉末冶金电极产生的表面粗糙度较高，尽管差异是微小的。


    Sahu 等人 [55] 探索了使用由 SLS 制造的 AlSiMg 工具对 Nitinol 进行电火花加工，并将其性能与市售的石墨和铜工具进行了比较。选择表面粗糙度作为响应参数，以考察电极材料、电流、电压、脉冲持续时间和占空比的影响。使用
    SLS 工具达到的平均表面粗糙度最小，其次是铜工具。


    Equal 等人 [56] 使用熔融沉积建模（FDM）制造电火花加工工具。使用丙烯腈-丁二烯-苯乙烯（ABS）作为核心材料，外壳通过铜涂层产生。通过 FDM，发现很难保持工具的锐利边缘。虽然通过
    FDM 工艺制造的工具性能与实心铜工具相当，但其尺寸精度较低。引用难以通过 FDM 产生精确尺寸的工具作为原因。


    Saxena 和 Metkar [57] 也使用 FDM 开发了一种电火花加工工具。在通过 FDM 制造的 ABS 材料核心上进行了铜涂层。分析了电流、脉冲时间和电压对电极磨损率（EWR）和材料去除率（MRR）的影响。使用实心铜工具和通过
    FDM 制造的工具获得了相似的 MRR 结果，而后者在 EWR 方面表现稍好。


    表 2 中介绍了电火花加工（EDM）工具电极制造技术的主要研究工作。


