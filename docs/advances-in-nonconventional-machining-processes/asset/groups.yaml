    \ ANOVA 在 1% 误差范围内开发了预测工艺参数及其输出特性的模型。 |\n| 7 | Guilhaue 等人 [45] | 黑色碳黑磨料颗粒 | 陶瓷\
    \ | 喷嘴直径 3 至 5 (mm)，压力 4-6 (kgf/cm²)， standoff 距离 20 至 40(mm) | 正交方法与 ANOVA 的结果相匹配，喷嘴直径对\
    \ MRR 的影响最大，而 SOD 对切缝宽度的影响最大 |\n| 8 | Rao 等人 [46] | 石榴石 (36% FeO, 33% SiO₂, 20%\
    \ Al₂O₃, 4% MgO, 3% TiO₂, 2% CaO 和 2% MnO₂)。 | 低碳钢 | 水压 35000 -55000 psi，行进速度\
    \ 80-320 mm/min，SOD – 1 到 4 mm，射流冲击角- 90° 喷嘴直径- 0.35 mm，喷嘴长度 – 76.2mm，喷嘴直径.-1.05mm，磨料直径\
    \ 0.18 mm | 与水压和 SOD 相比，行进速度对表面粗糙度的影响最大。获得最小 SR 的最佳参数为：水压 – 35000 psi，速度 – 80mm/min\
    \ 和 SOD 2.5mm |\n| 9 | S. Srinivas 等人 [47]. | 石榴石 | Inconel 718 | 水压 – 100 至 300\
    \ MPa，行进速度 – 75-175 mm/min., 磨料流量 – 0.3017 至 0.5994 kg/min，孔口直径 0.25 mm，射流冲击角\
    \ 90°，聚焦喷嘴直径 1.07mm | 行进速度和水压是穿透深度最重要的因素。 |\n| 10 | Santanakumar 等人 [48] | 石榴石\
    \ | 陶瓷瓦 | 磨料粒度 – #80 至 120，磨料流量 - 300 至 500 gm/min，SOD - 1 至 3 mm，水压-2000 至 3000\
    \ bar，射流行进速率 - 200 至 400 mm/min. | 提出了一种预测模型，用于优化表面粗糙度和锥度角，其平均值分别为 5.27 µm 和 1.41°。\
    \ |\n\n*(表 1) 续*\n\n| 序号 | 作者 | 磨料材质 | 工件材质 | 影响参数 | 结果 |\n| :--- | :--- | :---\
