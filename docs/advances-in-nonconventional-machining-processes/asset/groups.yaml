    ## 第 5 章：磨料加工的创新


    Anupam Thakur$^{1,3,*}$, Chander Prakash$^{2}$ 和 Ramakant Rana$^{3}$


    $^{1}$ 机械工程系，Maharaja Agrasen 大学，哈里亚纳邦巴迪，印度

    $^{2}$ 机械工程学院 (SME)，Lovely 专业大学，印度詹达

    $^{3}$ 机械与自动化工程系，Maharaja Agrasen 理工学院，德里，印度


    **摘要：** 磨料加工在近年来取得了重大进展。制造中使用的基于强化技术的局部侵蚀被称为磨料射流加工。本文重点介绍了在加工射流使用的各种参数和创新技术（如热辅助、完全或中间浸没条件等）方面的最新进展。磨料射流加工（AJM）在摩擦学等某些领域也取得了进展。微加工和小微通道抛光等某些领域也利用了其优势。还发现了一种利用弹性侵蚀的新加工方式。除此之外，还审查了射流喷嘴材料、其设计标准、粒径和使用的射流量等某些参数。使用磨料射流加工在大量微加工和复合材料加工方面取得了进展。


    **关键词：** 磨料射流加工，材料，微加工，工艺参数。


    ### 引言


    磨料射流加工是一种非传统加工过程，专门用于加工在加工过程中抗冲击能力低的材料。可以看到，由于诸如加工具有各种复杂结构的光学、医疗器械、精密仪器 [1] 的设计区域以及所需产品设计或特征的整体质量
    [2] 等各种因素，加工的重要性在过去几年里不断提升。


    还发现 AJM 在具有 CNC 概念的精密加工中找到了应用。由于技术微型化的变化，AJM 正转向微加工，从而将喷嘴尺寸从宏观变为微观尺度，并将喷嘴材料改为蓝宝石。AJM
    配备了高压泵和更硬的磨料颗粒用于加工。Verma 等人 [5] 讨论了依赖于喷嘴长度、喷嘴直径、喷嘴入口角和孔径等参数喷嘴磨损。还发现，喷嘴移动速度与磨料流量一起对材料去除率（MRR）起着最重要的作用，直至一定限度，因为它导致表面粗糙度降低和割缝几何形状增加。因此，尽管进行了各种研究，但在
    AJM 分析、AJM 中的喷嘴磨损以及各种参数对表面完整性影响的研究方面仍发现了一些需要关注的空白。


    本文讨论了各种研究，展示了基于技术进步、工业应用及其多样性的最新进展。还针对 AJM 的各种材料机制、材料去除、工艺参数的影响和喷嘴磨损进行了综述。


    ### 文献综述


    #### 磨料空气射流加工


    磨料空气射流加工（AAJM）可以描述为一种通过高速喷射颗粒流从而导致材料侵蚀的技术 [6]。强调具有良好的材料去除率。已发现，当喷嘴直径减小到 1mm 以下时，它变成微加工过程或微
    AAIMJ。布局如（图 1）所示。系统内的过滤器和干燥机用于清洁压缩空气并同时将其干燥。之后，空气通过调节阀，在那里调节和控制空气压力。然后最终，它被传递到靠近工件的喷射枪。颗粒在侵蚀使用后即与切屑一起通过吸尘器的帮助收集。在加工过程中，根据使用的材料、特性以及考虑的
    various 参数，会有少量断裂。侵蚀后，颗粒和气体逸出。微 AAIMJ 用于在各种脆性材料（如陶瓷、玻璃和碳化物金属）上生产小通道（如气道和孔）。还发现磨料颗粒经常嵌入加工表面，因此在加工有色金属或聚合物时会产生负面关系。为了加工此类材料，使用冷冻辅助
    AJM，这在后面讨论。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_83_0.png)


    图 (1). 磨料射流加工过程布局 [51]。


    #### 磨料水射流加工


    磨料水射流加工是传统加工过程的进步，用水代替载气，并在采矿业中找到关键应用 [7]。有时它与浆料射流加工进行比较，后者以两种不同低压模块和预混合浆料混合物工作。在此，介质粘度起着重要作用，因为与空气相比，喷嘴处的射流强度提高了
    100 倍。可以看到，AWJM 取得了许多改进，如粗糙度降低到纳米尺度 [8]，远处的足迹 [10]，更快的工件冷却和足够的浆料回收 [11, 12]。但由于水流停滞区的高减速以及粘度对磨料轨迹的高影响，发现冲击速度不同（图
    **2 & 3**）。在此之后，磨料颗粒失去其所有动能。与空气相比，水中的材料去除率（MRR）较低，因为它提供较小的停滞区。也有研究旨在减少这种停滞区 [13]，并提议使用
    V 形掩模。还发现，使用大豆油作为磨料载体可以减少主要足迹中工件的二次冲击 [14]。此处的缺点体现在压力流体的使用（特别是在加工陶瓷时）导致的裂纹形成及其扩展
    [15]。


