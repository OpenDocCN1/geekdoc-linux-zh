    and work electrode. This potential difference creates an electric field between
    the two electrodes. It depends on the inter electrode gap and dielectric constant
    of the dielectric fluid present in between the two electrodes. The electrically
    conductive materials have enough number of free electrons. As the electric field
    is established, due to presence of electric field, the free electrons will start
    to get plucked from the tool (negative). The electron will be discharged in large
    number. This is called "Cold emission of electrons". In the presence of electric
    field, the electrons will accelerate towards the work as the tool is negative
    and workpiece is positive. The gap between these two electrodes is filled with
    dielectric medium. Due to presence of dielectric, no free path will be available
    for the electrons, hence, they face hindrance. The moving electrons will collide
    with the dielectric particles. The energy of the electrons will ionize the dielectric
    molecules. This will result in more ions as well as more electrons.


    ### Spark Formation, Melting and Evaporation


    The electrons produced in primary collision will accelerate again. It will result
    in secondary and tertiary collisions and so on. This will cause the release of
    a large number of ions and electrons in the gap between tool and workpiece. It
    will cause the formation of "plasma channel" which is state of matter contains
    electrons and ions. Once the plasma channel is formed, the resistance to the flow
