    traditional WEDM process.


    Rajkumar et al. [25] addressed machining of aluminium metal matrix composites
    reinforced with nano alumina particle in Wire electric discharge machining. Voltage
    and pulse on time were found responsible input parameters for achieving higher
    MRR. Also, controlled pulse durations improved the surface integrity by reducing
    the machining defects.


    Zhang et al. [26] analyzed and reduced the power consumption during machining
    of thin wall components in WEDM and studied the thermal deformation of the components.
    They utilized new micro-crack wire electrode to ameliorate machining characters.
    Also, the investigation results showed that micro crack wire can reduce the energy
    consumption and debris pollution at great level.


    Sharma et al. [27] presented the optimization of input variables of WEDM while
    machining Ni50.8 Ti shape memory alloy rich in Ni, specifically used in Bio-medical.
    L16 orthogonal array was selected using Taguchi DOE for conducting the study.
    Outcomes from the study confirmed that machining at optimum conditions results
    in better surface integrity and higher MRR.


    Smirnov et al. [28] performed WEDM of 3y-TZP/Ta ceramic- metal composites and
    found that SPS Sintered composites have suitable electrical conductivity for WEDM
    process. Moreover, conclusion was made that high accuracy can be achieved while
    machining without much compromising with mechanical strength of the component.


    Zhou et al. [29] fabricated and characterized the hydrophobic Ti3SiC2 surfaces
    in Wire electric discharge machining with regular and controllable micro-grooved
    structures. Relationships between contact angles, depth-width ratio and surface
    quality were also investigated and it was found that depth- width ration can be
    useful in predicting the parallel contact angle with a small margin of error.


    Pramanik and Basak [30] mentioned the importance of uninterrupted machining in
    order to control energy and time consumption in WEDM for hard materials. Wire
    rupture for Ti-6Al-4V alloy workpiece was investigated to make the machining process
    highly sustainable. No workpiece material was detected on the tips of the wire,
    though, traces of oxides were formed because of high temperature oxidation were
    noticed on wire broken tips. Furthermore, at low temperature, it was observed,
    wire with high tension can rupture rapidly.


