    ## CONCLUSION


    Applications based on composites fabricated by CMs have become an important part
    of our modern lifestyle. In this article, EDM process and its role in machining
    of composite made up of CMs and tungsten carbide has been reviewed. It is concluded
    from the above extensive review that EDM process is capable of machining CMs like
    TiN, SiC and TiB₂, which are highly electrically conductive in nature. It is also
    observed that various machining parameters like spark intensity and current affect
    the performance of the machining of the workpiece. As these parameters get increased,
    there is also a significant increase in the MRR and surface roughness. The result
    of pulse time is studied with respect to MRR. MRR and surface roughness decrease
    with an increase in pulse time and thus increasing the instability of the machining
    of materials.


    Along with this, the effect on characteristics of EDM machined surfaces by different
    process parameters has also been observed and some studies have also been discussed
    stating the after-machining effects on CMs [27, 45].


