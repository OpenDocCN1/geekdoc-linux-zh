    # 线切割电火花加工 (WEDM)


    虽然电火花加工（EDM）和线切割电火花加工（WEDM）的材料去除机理相似，但它们的功能特性并不完全相同 [8]。在 WEDM 过程中，在作为工具电极的细薄、运动导线与工件之间产生电火花，以侵蚀材料并生成所需的形状。WEDM
    的原理示意图如图 (2) 所示。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_115_2.png)


    图 (2). WEDM 系统示意图 [9]。


    在操作过程中，导线从导线卷连续送出，并由线切割电火花机床的上、下喷嘴引导，而工件保持静止。通常使用的材料具有导电性，例如铜、黄铜、镀锌黄铜、扩散黄铜、钼*等*。在导线电极和工件之间施加电势，其中电极作为阴极，工件作为阳极，同时保持两者之间有一个小间隙。


    去离子水等介电液也存在于导线电极和工件之间。电子从阴极移动，撞击去离子水分子并释放出若干电子。这些电子接着撞击下一个去离子水分子。该过程持续不断地进行，同时正离子向阴极移动。通过这种方式，大量电子向阳极（工件）移动。电子的动能转化为热能并产生火花。这种火花能量使工件温度升高至约
    10,000°C。因此，工件材料发生熔化和蒸发 [10]。过滤后的介电液被泵送并连续喷射，以包裹工件和导线电极。通过导线电极进入加工区域的电能脉冲使介电液汽化，吹飞工件和导线的微小部分。由于导线由导线卷连续送出，每次旧截面被切断成为废料时，导线的每一新截面都充当电极。然而，导线与工件之间的间隙被保持和控制，以产生精确的切割表面。此外，介电液起绝缘作用，从而在间隙中产生高能以生成火花。它还能收集并带走碎屑，减少加工过程中产生的热量。


    当希望残留应力较低时，会使用线切割电火花加工（Wire-cut EDM），因为它不需要高切削力来去除材料。如果每脉冲能量相对较低，由于这些低残留应力，预计材料的机械性能变化很小。尽管在常规加工过程中，未进行应力释放的材料可能会在服役寿命期间发生变形。由于该过程的固有特性，线切割电火花加工可以轻松加工复杂零件和精密组件。


    # WEDM 工艺参数


    各种电气和非电气工艺参数、WEDM 的加工间关系及性能指标如图 (3) 所示。选择这些参数的适当水平以实现经济加工条件至关重要。考虑到这些参数对输出变量的影响，可以设置输入变量以达到最佳加工环境。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_117_0.png)


    # 导线电极特性


    WEDM 的加工性能通常依赖于工具电极各种物理、化学、电气和机械特性的组合。因此，导线电极应具备优异的特性，以实现高精度和高精度的高速切割。表 1 列出了
    WEDM 导线的独特特性列表。


    表 1. WEDM 导线的必备特性 [12]。


    | 序号 | 特性 | 描述 |

    | :--- | :--- | :--- |

    | 1. | 导电性 | 低导线导电性会导致从电源馈送到切割点的距离上产生电压降和相关的能量损失 |

    | 2. | 抗拉强度 | 抗拉强度为 900MPa 的硬线用于大多数工作，而抗拉强度约为 490MPa 的半硬线和低于 440MPa 的软线用于角度大于
    5° 的锥度切割。 |


    表 1 续。


    | 序号 | 特性 | 描述 |

    | :--- | :--- | :--- |

    | 3. | 延伸率 | 硬线的延伸率比半硬线小得多。脆性导线可能在首次过载条件下断裂，而韧性更好的导线则预期能接受暂时的过载 |

    | 4. | 熔点 | 导线电极应对火花的快速熔化具有抵抗力 |

    | 5. | 几何形状 | WEDM 通常可获得直径从 0.02 到 0.36 mm 不等的导线。导线直径的增加会导致提供给工作间隙的脉冲能量增加，从而增加整体的材料去除率
    |


    图 (4) 说明了随着导线电极的发展，为了改进 WEDM 过程，导线直径的增加 [13]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_118_0.png)


    # WEDM 工艺的进展


    WEDM 已被证明是一种用于高精度加工复杂几何形状硬材料的先进技术。然而，其他加工过程可以与 WEDM 集成在一起以实现更好的加工。表 2 展示了近年来开发的现代
    WEDM 技术。


    表 2. 混合 WEDM 技术。


    | 序号. | 混合 WEDM |

    | :--- | :--- |

    | 1. | 线切割电火花磨削 |

    | 2. | 微 WEDG |

    | 3. | 线切割电火花铣削 |

    | 4. | 线切割电火花车削 |

    | 5. | 磨料线切割电火花加工 |


    # 线切割电火花磨削


    为了生产圆柱形微零件，偏好使用如线切割电火花磨削（WEDG）之类的加工过程 [14]。在 WEDG 过程中，以高精度加工如杆和销等微旋转零件 [15]。然而，WEDG
    工艺可以精确制造具有曲线轮廓剖面的微旋转零件；但其加工效率非常有限。此外，这项技术依赖于昂贵且专用的微电火花机床，这限制了该技术在普通行业中的普及 [16]。


    # 微线切割电火花磨削


    在微 WEDG 中，砂轮的使用被作为电极的微导线所取代。当需要磨削细杆时，它作为工件，允许旋转，而电极（微导线）保持静止。该过程利用产生的电火花或热能去除工件上多余的材料，以达到所需的形状
    [17]。然而，从技术和经济角度来看，导线断裂控制是微 WEDM 过程最关键方面。


    # 线切割电火花车削


    线切割电火花车削（WEDT）过程是一种新兴的非传统加工过程，用于制造微型部件和轴对称部件 [18]。在 WEDT 和 WEDG 中，侵蚀机理与 WEDM 过程类似，区别在于在
    WEDG 中，工件是沿纵向方向进给，而 WEDT 中是水平进给。此外，WEDG 和 WEDT 过程变体的特性在于工具与工件电极之间的相对运动以及进给。


    # 磨料线切割电火花加工 (AWEDM)


    在此过程中，电火花连同磨料一起磨削工件表面。通过将 WEDM 与细粒磨料集成，可以实现更高的材料去除率和更好的表面光洁度。


