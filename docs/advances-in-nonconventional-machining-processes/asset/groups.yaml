    materials with integration of new core and coating material are required.


    ## CONCLUSION


    After a thorough study of WEDM literature, it can be concluded that titanium alloys
    are very useful in the area of biomedical, aerospace and micro tool manufacturing.
    These alloys can be machined with intricate shapes smoothly and inexpensively
    with WEDM. It has been observed that input variables have significant effect on
    performance measures, so it becomes of paramount importance to optimize the parameters
    to achieve high dimensional accuracy and high repeatability. Optimization techniques
    such as Taguchi, RSM, Fuzzy, algorithm and ANN based on mathematical models can
    be employed for such investigation for various titanium alloy machining in WEDM.
    Moreover, with the application of SEM, TEM and XRD, surface integrity, composition
    and defects in machined materials can be evaluated and studied.


