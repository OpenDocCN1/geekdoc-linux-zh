    machining of aluminium based alloys. Taguchi technique coupled with GRA was utilized
    to perform the investigation. Optimum MRR and Surface Roughness values were predicted
    based on the input control factors by developing artificial neural network approach.
    Outcomes were found efficient when compared, different models.


    Nain et al. [32] used particle swarm optimization technique so as to improve the
    accuracy and productivity of wire electric discharge machining of super alloy
    Udimet-L605. Among other input variable, pulse on time was found to impact the
    cutting speed, wire wear ratio and geometrical deviation extremely. The compositional
    modifications because of erosion and HAZ were studied with SEM and EDS.


    Chaudhary et al. [33] studied the influence of varying wire tension on performance
    measures while machining AISI 304 in WEDM. It was noticed that wire tension had
    no influence on kerf width, but, affects the MRR, SR and micro-hardness significantly.
    While SR decreases with an increase in wire tension, slight improvement was recorded
    in case of MRR.


    Gaitonde et al. [34] discussed the optimization of input variable of WEDM of HCHr
    steel employing integrating approach of RSM and differential evolution. L27 orthogonal
    array was selected based on Taguchi experiment design technique to carry out the
    investigation. More pulse on time resulted in higher MRR.


    Goyal [35] represented the study of optimization of WEDM key input parameters
    for improved MRR and SR of Inconel 625 by employing normal and cryogenic zinc
    coated wires. MRR and SR were found considerably affected by pulse on time, tool
    electrode and current intensity. Microstructure of the machined surface was analyzed
    through SEM.


    Mouralova et al. [36] distinguished the morphology and topography of WEDM structural
    material surfaces. SEM and contact less 3D profilometer were utilized to carry
    out the analysis. These instruments permitted the evaluation of profile and creating
    3D surface image for further study.


    Arikatla et al. [37] discussed the parametric optimization of WEDM process using
    RSM while machining Ti-6Al-4V alloy. The experiment was carried out with five
    input process parameters for improving MRR, kerf width and SR. surface properties
    were examined using SEM. Wire tension and servo voltage had high influence on
    surface roughness and enhanced the surface quality of machined surface.


    Siddiqui and Ramkumar [38] suggested that magnesium which is an important'
