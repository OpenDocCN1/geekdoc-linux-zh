    machining, ultrasonic machining [50, 51], and abrasive water jet machining [52]
    also had their advantages and disadvantages as reported by different researchers.


    Yoo et al. have successfully doped yttrium nitrate (YN) with SiC and showed that
    the EDM process can be used for machining these ceramics [53]. Yeakub et al. [54]
    investigated the micro-EDM of non-conductive zirconia with titanium carbide powder.
    In this study, two parameters were varied: capacitance and gap voltage.


    Singh et al. [55] carried out an experimental investigation on the powder mixed
    EDM of cobalt-bonded tungsten carbide (WC-Co). In his experiment, graphite powder
    mixed dielectric was used. Few studies were focused on predictive modeling to
    understand the effect of EDM on the machined product [47]. Table 2 shows a consolidated
    review electric discharge machining of ceramic composite material.


