    Durr 等人 [41] 引入了直接金属激光烧结的概念，用于制造电火花加工（EDM）工艺的工具电极。这些电极包含青铜、镍和磷酸铜粉末，逐层构建。工艺优化表明，烧结电极的孔隙率直接受激光速度、激光功率和烧结策略的控制。这些电极还采用了含银的钎焊金属进行浸渗。这些电极实现了约
    12.5 mm$^{3}$/min 的材料去除率（MRR），但与常规电极相比，其电极损耗率（EWR）和表面粗糙度更大。


    Norasetthekul 等人 [42] 通过对包覆聚合物的 ZrB$_{2}$ 粉末进行机械压制合成工具电极，随后在高温炉中将铜浸渗到生坯中。注意到压实压力越高，颗粒间的空隙越小，从而减少了填充空隙所需的铜量。然而，研究发现铜倾向于不能完全填充空隙。观察到
    ZrB$_{2}$-Cu 电极在极高能量通量条件下对等离子体火花具有最高的热耐磨性。此外，该工具比石墨和铜工具切割钢工件的速度更快。


    Li *等人* [43] 揭示了添加 TiC 对烧结基铜工具性能的影响。通过粉末冶金（P/M）法，通过改变 TiC 含量从 5% 到 45% 制造铜和铜-钨（Cu–W）粉末的压片，随后进行液相烧结。添加
    TiC 改善了表面光洁度，并建议用于精加工目的。与市售电极相比，所有这些电极的耐磨性（TWR）也都更低。


    Zhao *等人* [44] 报道了使用选择性激光烧结（SLS）作为制造电火花加工（EDM）金属原型的有用方法。通过金属浸渗，提高了 SLS 金属原型的密度和其他机械性能方面。金属原型浸入液态浸渗剂（通常使用铜）中，通过毛细作用上升至开放孔隙中。结果表明，电极的磨损率与常规电极相当。获得的表面粗糙度在类似的机器设置下处于可接受范围内。


    Blom *等人* [45] 采用喷雾金属沉积和电铸工艺来生产工具电极。将这些电极的性能与常规实心工具电极进行了比较。在不同的工作条件下测量了材料去除率（MRR）、工具磨损率（TWR）、加工时间和表面粗糙度。在
    MRR 和 TWR 方面，实心工具取得了比电铸工具更好的结果。然而，发现采用电铸方法合成的工具比实心工具更便宜。


    Shibayama 和 Kunieda [46] 揭示了使用具有非常小孔径的电极进行深槽电火花加工。孔将介电液引导到工件表面上方。两个在界面上具有微槽以引导介电液的铜板通过扩散键合连接形成电极。与通常使用的实心工具电极相比，该电极具有更少的加工时间和更高的加工精度。


    Mishra 和 Pathak [47] 在 ZrB2 粉末中加入碳（0 至 10%）和碳化钛（0 至 10%），并研究了系统性烧结。将碳混合至 4% 以内会导致致密化，但进一步增加碳的添加量会延缓致密化。添加超过
    5% 的 TiC 对 ZrB2 的烧结产生不利影响。碳的加入有助于抑制晶粒尺寸，并获得了具有细晶粒尺寸和较高密度的复合材料。


    Hsu *等人* [48] 使用基于无电极电镀（镀镍）和电铸（铜）的快速成型技术来制造电火花加工（EDM）工艺的电极。


    此类工艺减少了制造时间，也降低了电极制造的

    成本。实验观察表明电极上没有裂纹，并且在电火花加工（EDM）工艺中取得了令人满意的结果。


