    两个电极之间由某种介质隔离，该介质可能是绝缘油或去离子水。然后施加电压，从而形成等离子体通道，使电流能够流动。当电压介质达到击穿阈值时，就会发生放电。由于电火花加工（EDM）过程基于通过熔化和蒸发去除材料，因此当形成通道的底部温度达到约
    ≥ 10,000°K 时，第二电极（工件）发生熔化和蒸发，从而导致材料去除。


    ## 陶瓷的电火花加工


    CMs（复合材料），如二硼化钛（$\text{TiB}_2$）、硅掺杂碳化硅（Si-SiC）和氮化钛（$\text{TiN}$），在本质上是导电的，可以通过电火花加工（EDM）进行加工
    [9]。根据 Luis 等人 [10] 的说法，由无机材料获得的、通常具有高纯度的材料被称为陶瓷或高级 CMs。这些 CMs 进一步分为氧化物陶瓷（如 $\text{Al}_2\text{O}_3$
    或 $\text{ZrO}_2$）和非氧化物陶瓷（如 $\text{Si}_3\text{N}_4$ 或 SiC）。


    使用电火花加工（EDM）过程加工 CMs 也可以分为天然导电材料、非导电材料和导电材料。大多数导电材料是通过混合一些杂质原子由非导电材料制成的，这是通过引入一些导电的第二相来实现的（图
    2）。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_100_0.png)


    图 (2). 基于导电性的陶瓷材料分类 [11]。


    向 CMs 中添加这些相从而增加了其电导率。据报道，添加这些掺杂剂也会在一定程度上改善硬度、强度和断裂韧性 [12, 13]。


    ## 复合材料陶瓷中的材料去除机制


    Lauwers 等人 [13] 进行了一项研究，旨在开发耐磨且能通过电火花加工（EDM）过程加工的 CMs。这项研究的主要重点是调查电火花加工过程参数与 CMs
    微观结构之间的关系。为此，选取了基于 $\text{ZrO}_2$、$\text{Al}_2\text{O}_3$ 和 $\text{Si}_3\text{N}_4$
    的 CMs，并通过 $\text{TiC}_n$ 和 $\text{TiN}$ 向这些材料中引入一些具有导电性的相。结果观察到，除了熔化和蒸发外，氧化和基体材料分解等因素也是有效去除材料的原因。此外，还指出，过程中的裂纹形成是由于剥落效应导致的。


    主要材料去除机制见表 1。


    表 1. 不同复合 CMs 的材料去除机制 [13]。


    | 复合陶瓷 | 介质 | 机床配置 | 材料去除机制 |

    | :--- | :--- | :--- | :--- |

    | $\text{ZrO}_2$-TiN | 去离子水 | WEDM（粗化条件下的线切割电火花加工） | 熔化和蒸发 |

    | $\text{Al}_2\text{O}_3$-SiCw-TiC | 去离子水 | WEDM（粗化条件下的线切割电火花加工） | 熔化和蒸发 |

    | $\text{Al}_2\text{O}_3$-SiCw-TiC | 油 | 中到高能量输入的慢走丝/型腔电火花加工 | 剥落 |

    | $\text{Si}_3\text{N}_4$-TiN | 去离子水 | 高能量输入的型腔电火花加工 | 剥落 |

    | $\text{Si}_3\text{N}_4$-TiN | 去离子水 | WEDM | 氧化、分解 |

    | $\text{Si}_3\text{N}_4$-TiN | 油 | 粗化条件下的型腔电火花加工 | 熔化、蒸发 |


    从表 1 中观察到，介质、放电介质以及加工参数的配置在材料去除机制中起着重要作用。两大主要机制是熔化/蒸发和剥落。熔化和蒸发发生在低能量放电状态下，而剥落机制则发生在高能量放电状态下。一些陶瓷和金属材料的电导率概述显示在图
    (3) 中。观察到，与金属材料一样，本质导电的陶瓷也可以通过电火花加工（EDM）过程轻松加工，例如二硼化钛（$\text{TiB}_2$）、氮化钛（$\text{TiN}$）或硅掺杂碳化硅（SiC）[14]。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_102_0.png)


    图 (3). 材料的电导率 [15]。


    ## WC-Co 复合材料的加工


    由碳化钨/钴（WC-Co）材料制成的复合材料具有良好的机械性能范围，如良好的强度、高硬度值以及在较宽温度范围内良好的耐磨性，因此在模具、切削工具和一些特殊用途工具的制造中有着广泛的应用。这些复合材料具有极高的比强度，因此难以通过传统加工过程进行加工
    [16]。此外，由于涉及一些复杂的形状，因此在加工过程中需要非常高的精度，这是传统加工过程无法达到的 [17]。


    多项研究报告了使用传统过程加工这些材料，例如在 CNC 车床上使用 CBN 刀具。所得结果表明了负面影响，如高切削力、低材料去除率（MRR）以及加工表面质量差
    [18]。另一方面，Levy 等人 [19] 和 Bonny 等人 [20] 进行了一些研究，观察到电火花加工（EDM）过程能够加工这些复合材料，以制造涉及复杂形状的整体硬质合金模具，无论其硬度和强度如何。在另一项研究中，Mahdavinejad
    等人 [2] 进行了一项研究，以分析电火花加工（EDM）过程在加工 WC-Co 复合材料时的不稳定性。结果显示，对于不同配比的 WC-Co 复合材料，脉冲持续时间的因素会影响材料去除率。去除率随脉冲持续时间的增加而增加。还观察到，加工不稳定性也随脉冲持续时间的增加而增加。指出这种不稳定性可以通过降低所形成的复合材料中
    Co 的百分比来减少（图 4）。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_103_0.png)


    图 (4). WC-Co 不同成分中刀具磨损率、脉冲时间和材料去除率变化的影响 [2]。


    进行了类似的研究，观察到脉冲时间和脉冲电流等各种因素极大地影响正在进行作业的工件的表面粗糙度 [6]。这些加工参数的值越高，工件的表面粗糙度值将越好 [6]。


    ## 电火花加工 - 文献综述


    Gadalla 等人 [21] 进行了实验，以检查由 CMs 制成的复合材料通过电火花加工（EDM）过程的成型。结果与其他传统过程加工的曲面进行了比较。结果表明，由于单位体积能量的减少，MRR
    增加，且电阻率和热扩散率等主要因素是影响 MRR 的主要因素。还指出，材料的表面粗糙度在很大程度上受材料晶粒尺寸分布的影响。在类似的研究中，Farooqui
    等人 [22] 比较了陶瓷和先进陶瓷通过电火花加工（EDM）过程的加工。观察到过程的脉冲持续时间负责材料的去除机制。较短的脉冲导致氧化和分解，而较长的脉冲则导致剥落机制。在另一项研究中，Gamage
    等人 [23] 使用全铝 3003 作为材料，使用由 AISI P20 制成的刀具进行线切割电火花加工（wire EDM）和型腔电火花加工（DSEDM）的案例研究。观察了结果，并指出电能是主要的影响源，其次分别是型腔电火花加工（DSEDM）和线切割电火花加工（wire
    EDM）中的绝缘油和线材材料等因素。Lauwer [24] 提出了一项研究，概述了与由 CMs 制成的复合材料的电火花加工（EDM）相关的各种挑战。结果得出结论，通过改变材料的成分，可以在一定程度上改善电火花加工过程和材料的机械性能。Schubert
    等人 [15] 进行了一项研究，介绍了有关由 CMs 制成的复合材料微型电火花加工的最新研究。还讨论并介绍了用于绝缘陶瓷和陶瓷加工的程序示例。结果观察到，由于辅助电极的方法，建议加工绝缘陶瓷，因此被视为适用于
    CMs 的后处理过程。Buccioi 等人 [25] 进行了实验，通过电火花加工过程处理由硅和氮化钛制成的生物医学植入物设备。研究了其机械、毒理学和微观结构特性，观察到这些材料与其他用于制造相同关节的氧化物
    CMs 相比表现良好，并且诸如倒扣和近净形状等非常复杂的形状可以通过电火花加工过程制造。


    Mohri 等人 [26] 进行了实验，以研究通过使用辅助电极对绝缘 CMs 进行电火花加工的应用。使用煤油作为工作流体，观察到使用铜电极对 CMs 的加工非常容易。在另一项研究中，报告了对
    $\text{ZrO}_2$-TiN 混合复合材料进行线切割电火花加工精加工。使用等离子活化烧结法合成 $\text{ZrO}_2$-TiN 坯料 [27]。Sano
    等人 [28] 使用由多晶金刚石（PCD）制成的电极进行电火花加工实验。使用两种 PCD，即 CTB-010 和 CTH-015，两者均有平坦表面，并将结果与由
    Cu-W 制成的电极进行比较。观察到由 PCD 制成的电极在短脉冲持续时间下磨损较少，为 1.5%，而在长脉冲持续时间下无磨损，而在相同条件下，由 Cu-W
    制成的电极磨损为 10%。Palanikumar 等人 [29] 进行了测试，以研究通过电火花加工过程加工 WC/Co 整体硬质合金复合材料的工艺参数。还分析了各种加工参数，并观察到这些参数对
    MRR 和表面质量的影响。在类似的研究中，Hanaoka 等人 [30] 研究了使用辅助电极的电火花加工过程对由 $\text{Si}_3\text{N}_4$
    CMs 制成的复合材料的放电行为的影响。在结论中，指出绝缘材料的 MRR 结果优于导电材料的结果。Gadalla 和 Tasi [31] 进行了一些实验研究，以演示钴含量和晶粒尺寸对钨整体硬质合金的各种加工特性的影响


