    | 预测 | 预测连续数量的未来价格 | 预测交易，预测客户在整个生命周期内的价格 |

    | 自然语言处理 | 识别结构，识别实体，提取意义 | 翻译，从细节生成摘要，识别实体及其关系 |

    | 视觉感知 | 识别图像或视频中的对象，生成 3D 世界 | 理解边缘、纹理、对象。重建 3D 世界，检测异常 |

    | 机器人技术 | 操纵现实世界中的物体 | 移动操纵器，如自动驾驶汽车、装配线零件拣选机器人 |


    ## 制造业中 AI 和机器人的挑战


    在行业中实施 AI 和机器人技术并不像采购机器人并插入应用程序那样简单。在 AI 能够建设性地实现任何自动化之前，有许多不同的财务和政府政策考量需要考虑。每个生产商都会根据其行业、规划以及商业模式面临独特的挑战。然而，在制造业中实施
    AI 通常存在许多挑战。实施 AI 和机器人技术以开启其价值的关键在于将原始数据转化为智能预测，以便快速决策。一般来说，在人工智能的实施中存在着各种各样的挑战
    [25]。


    ### a). 数据


    设计框架目前产生部分信息，而尖端行业是一个巨大的信息环境。然而，机械数据通常是结构化的，但质量可能较差。数据质量可能很差，而且与其他面向消费者的应用不同，来自机械系统的数据通常具有明确的物理含义，这使得通过数据量来弥补质量缺陷变得更加困难。通常用于训练机器学习模型的数据缺乏全面的工作条件和健康状态/故障模式集合，这可能导致
    AI 系统在线使用时出现假阳性和假阴性。机械数据设计可以具有极强的时间依赖性，解读这些设计需要空间专业知识，仅靠挖掘数值数据很难充分利用 [26]。


    ### b). 速度


    制造过程发生得很快，机器/设备和其他类型的设备可能价格昂贵，各种应用的 AI 以及数据分析方法必须实时应用，以立即检测异常并防止废料和其他影响。基于云的解决方案可能是有效且快速的技术，但不适用于特定的计算效率条件
    [24 - 26]。


    ### c). 高保真要求


    与遭遇错误的 AI 基于推荐系统的客户相比，这些系统对错误有较高的容忍度，但即使是最低限度的错误处理速率也可能损害机器人和 AI 系统的整体可靠性。工程 AI
    启用应用程序通常处理与保护、一致性和操作相关的关键问题。预测中的任何故障都可能对客户产生不利影响，并阻止他们信任 AI 启用的系统。


    ### d). 可解释性


    一般的 AI 启用系统还应超越预测结果，并为故障提供根本原因评估。这需要数据科学家在开发通用应用程序期间与领域专家合作，并且必须将领域流程细节纳入建模过程。


    ### e). 员工技能组合和培训


    当执行新的 AI 机器人技术时，预计员工需要具备新的知识水平。许多员工将需要接受如何在这种不同环境中管理的培训，而其他工作者则需要被任命，使其具备适当的 AI
    和机器人技术的资格、学习和经验。


    ### f). 安全措施


    AI 和机器人技术将许多现代安全风险带入工作环境，并且存在严格的控制措施以及围绕自动化安全的严厉惩罚。生产者必须在近期引入机器人之前做好准备，以确保合规性并为专家创造安全的环境。


    ### g). 系统成本预算


    制造商在将 AI 启用的应用程序/软件引入工作场所时可能会面临运营和财务挑战。此类应用程序/软件可能包含从可靠的超高速互联网到昂贵机械的各种内容。AI 和机器人技术通常涉及大量投资，尽管价格正在大幅下降。但对于现有玩家来说，更新现有系统仍然是一个巨大的挑战。在制造业中引入
    AI 和机器人技术将需要初创企业和现有制造商进行巨额资本投资。因此，在预计的投资回报率（ROI）期间，商品的销售和生产数量应保持稳定，以弥补初始投资时间 [27]。


    ### h). 管理产品工作流


    在决定引入 AI 时产品工作流将呈现何种状态时，有许多考量因素。必须计算向 AI 机器人引入部分的速度，以确保在不给现有框架造成过多负担的情况下实现最大效率。代表性技能组合、未使用的安全协议、预算以及管理产品工作流是生产者在执行机械自动化框架时面临的一些最大挑战。了解新兴技术远比购买和拥有它们复杂得多。制造商应为挑战做好准备，以便从其
    AI 启用的机器人化框架中获得最大收益 [24 - 27]。


    现在，是时候将传统的制造工厂转变为智能的 AI 启用工厂，利用 AI、物联网（IoT）、数据分析和技术云计算，因为它确实如此。一如既往，存在挑战——在这种情况下，它是一个获取成本的问题。新时代将经历许多变化，并为研究人员、工业界和学术界带来新的研究体验
    [28 - 32]。


    ## 结论


    制造业非常适合应用人工智能和机器人技术。尽管 AI 革命仍处于初期阶段，但我们现在已经观察到该技术带来的实质性好处。从初步设计过程、生产楼层、完整供应链到全面管理，人工智能旨在改变以往生产产品和工艺材料整合的方式。AI
    和机器人技术可以嵌入到现有制造商品和应用程序中，以创建更高效、一致、更安全以及寿命和操作方面更强大的产品。在 AI 和机器人技术的支持下，工业自动化的水平和速度已发生深刻变化。AI
    启用的技术增强了传统应用程序的性能并开发其能力。一个例子是 AI 启用的协作机器人。机械臂可以学习由人类操作员展示的移动和路线，并在作为人工智能一部分的监督训练后执行类似的工作。此外，AI
    还自动化了涉及人工参与的方法。


