    # MECHANISM OF MATERIAL REMOVAL IN COMPOSITE CERAMICS


    Lauwers et al. [13] conducted a study to develop CMs which were wear resistant
    and also able to machine by the process of EDM. The main focus of this study was
    to investigate the relation between the parameters of EDM process and the microstructure
    of the CMs. For this ZrO₂, Al₂O₃ and Si₃N₄ based CMs were taken and to these materials,
    some phases of electrical conductivity were induced by TiCn and TiN. In the results,
    it was observed that not only melting and evaporation but other factors like oxidation
    and base material decomposition are responsible for effective removal of the material.
    Also it was started that the formations of the crack during the process were resulted
    due to the spalling effect.


    The main mechanisms for removal of material are presented in Table 1.


    Table1. Mechanism for material removal of different composite CMs [13].


    | Material Removal Mechanism in Different Composite Ceramics |

    |---|

    | Composite Ceramic | Dielectric | Machine Configuration | Material Removal Mechanism
    |

    | ZrO₂-TiN. | Deionized water. | WEDM (Wire EDM with Roughing condition) | Melting
    and Evaporation. |

    | Al₂O₃-SiCw-TiC. | Deionized water. | WEDM (Wire EDM with Roughing condition)
    | Melting and Evaporation. |

    | Al₂O₃-SiCw-TiC. | Oil. | Die-Sinking EDM with Medium and high energy input.
    | Spalling. |

    | Si₃N₄-TiN | Deionized water. | Die-Sinking EDM High energy input. | Spalling.
    |

    | Si₃N₄-TiN. | Deionized water. | WEDM. | Oxidation. Decomposition. |

    | Si₃N₄-TiN. | Oil. | Die-Sinking. EDM with Roughing condition | Melting. Evaporation.
    |


    It is observed from Table 1 that dielectric medium, discharge medium and configuration
    of machining parameters plays an important role in mechanism of the material removal.
    The two major mechanisms are melting/evaporation and spalling. Melting and evaporation
    takes place in the state of low energy discharge while the spalling mechanism
    takes place in high energy discharge state. Overview of the electrical conductivity
