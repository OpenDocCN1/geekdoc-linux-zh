    ## 使用替代方法制造电极


    电极的物理性质影响加工性能。高电导率、高比热容、良好的可加工性、高抗蚀损性等是理想电极必须具备的特性。单一材料无法满足所有这些要求。制造电火花加工（EDM）电极时主要使用传统的加工方法
    [38]。几何形状的复杂性和所需的精度通常决定了电极的制造成本。尺寸均匀的电极成本低廉且易于生产，但通过传统加工过程制造的复杂形状电极的成本可能是简单形状电极的
    100 倍 [39]。为了制造复杂的三维形状电极，使用了不同的方法，如传统机械加工、电铸、金属喷镀、铸造、快速原型制造或粉末冶金 [17, 40]。这些技术也有助于缩短交货周期。下文介绍了一项关于制造电火花加工工具的研究综述。


    Samuel 和 Philip [16] 进行了实验工作并观察到，使用粉末冶金（P/M）方法可以容易地制造工具电极，并且其性质可以相对容易地控制，因此使其具有优于其他电极制造方法的优势。压实压力对相对密度和生坯强度的影响如
    **图 (7a 和 b)** 所示。在低温烧结和压实压力下，间隙污染更多，并观察到较高的电极磨损。由于粉末冶金电极的表面特性，在低电流和高频下金属去除率较低。低压实压力和烧结温度导致机械强度差和工具磨损高。


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_40_0.png)


