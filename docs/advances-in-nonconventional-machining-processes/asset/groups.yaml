    A wide range of materials, Inconel, Titanium, glass, ceramics, composites, heat-sensitive
    alloys, etc. are shaped for different applications with the AWJM process. The
    demand for heat resistant and higher strength materials is increasing particularly
    in aerospace industries. However, these materials are often difficult to machine
    due to their physical and mechanical properties such as high strength and low
    thermal conductivity, which requires very high cutting energy and makes the cutting
    forces and cutting temperature very high, and it even leads to a short tool life.
    This opens an avenue of Thermally Enhanced Machining (TEM) for hard-to-machine
    materials. TEM may use an external heat source to heat and soften the work piece.
    As a result, the yield strength, hardness and strain hardening of the work piece
    reduces and deformation behavior of the hard-to-machine materials changes to allow
    the plastic deformation. This enables the materials to be machined easily which
    are difficult for the machine along with low energy requirement that leads to
    an increase in material removal rate (MRR) and productivity [7].


    Various features and developed machines of the AWJM process have been used to
    cut wide variety of materials such as hard materials like glasses, hard metal
    like titanium and Inconel, composites and alloys. The interest of heat resistance
    and higher quality materials is expanding especially in the field of aviation
    applications. These materials are hard to machine because of their physical and
    mechanical properties, for example, high strength and low conductivity, which
    requires extremely high cutting forces and makes the cutting powers and cutting
    temperature exceptionally high. It even prompts a short service life of cutting
    materials. This opens a road of thermally improved machining (TIM) for difficult
    to-machine materials. TIM may utilize an external heat source to heat and soften
    the work piece. Thus, the yield strength, hardness, and strain hardening effect
    of the work piece decrease. By doing this, difficult to-machine materials changes
    and permits the plastic deformation. This empowers machine tool for the materials
    to be machined effectively which are hard to machine alongside low energy requirement
    that prompts increment in MRR and profitability [7].


