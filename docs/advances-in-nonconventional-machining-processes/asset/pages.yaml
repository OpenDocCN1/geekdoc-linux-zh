    # MACHINING OF WC-CO COMPOSITE MATERIAL


    Composites made of Tungsten carbide/cobalt (WC-Co) material hold good range of
    mechanical properties such as good strength, high value of hardness and good amplex
    amount of wear resistance for wider range of temperatures thus find wide application
    in the production of dies, cutting tools and some special purpose tools. These
    composite materials possess very high specific strength, thus difficult to machine
    by conventional machining processes [16]. Also, it involves some complex shapes
    therefore very high accuracy is required during machining which is not possible
    to achieve with the conventional machining processes [17].


    Number of studies reported the machining of these materials with conventional
    process like using of CBN tools in CNC turning. The results obtained showed negative
    impacts like high cutting force, low MRR and poor finish of obtained surface [18].
    On the other hand, Levy et al. [19] & Bonny et al. [20] conducted some studies
    and observed that the process of EDM is capable of machining of these composite
    materials to fabricate cernented carbide dies which involves complex shapes irrespective
    of their hardness and strength In other study Mahdavinejad et al. [2] conducted
    a study to analyse the instability of EDM process on machining of WC-Co composite
    materials. In the results it was observed that for the various compositions of
    WC-Co composite materials, pulse duration factor effects the stock removal rate.
    The removal rate tends to increase'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'with the increase in pulse duration. It was also observed that the machining
    instability was also increased with the increase in the pulse duration. It was
    stated that this instability could be reduced by reducing the percentage of Co
    in the formed composite material (Fig. 4).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_103_0.png)


    Fig. (4). Effect on different compositions of WC-Co by variation of tool wear
    rate, pulse time and stock removal rate [2].


    Similar study was conducted and it was observed that various factors like pulse
    timing and pulse current greatly influence the surface roughness of the workpiece
    in which the job is being performed [6]. Higher the values of these machining
    parameters, better will be the value of surface roughness of the workpiece [6].


    # ELECTRICAL DISCHARGE MACHINING- LITERATURE SURVEY


    Gadalla et al. [21] conducted experiments to examine the shaping of composites
    made of CMs by the process of EDM. The results were compared with the surfaces
    machined by other conventional processes. In the results, it was observed that
    the MRR was increased due to the decrease of per unit volume of energy and the
    main factors like electrical resistance and thermal diffusivity were the main
    factors that affect the MRR. It was also stated that the surface roughness of
    the material largely effected by the dispersion of the grain size of the material.
    In the similar study Farooqui et al. [22] compared the machining of ceramics and
    advanced ceramics by EDM process. It was observed that the pulse duration of the
    process was responsible for the mechanism of removal of the material. While the
    oxidation and decomposition was due to the shorter pulse, on the other hand longer
    pulse was responsible for spalling mechanism. In another study Gamage et al. [23]
    used alluminium 3003 as material with tool made of AISI P20 for'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'conducting case studies of wire EDM and DSEDM. The results were observed and
    it was stated that the electrical energy was the major source of impact followed
    by other factors like dielectric oil and material of the wire for DSEDM and wire
    EDM respectively. Lauwer [24] presented a study in which overview was provided
    to state the various challenges related to EDM of composites made of CMs. In the
    results it was concluded that by altering the composition of the material both
    the EDM process and mechanical properties of the material can be improved to certain
    extent. Schubert et al. [15] conducted a study to present the recent studies related
    to micro EDM of composites made of CMs. Various examples of procedure, used for
    insulating ceramics and machining of the ceramics, were also discussed and presented.
    In the results its was observed that due to the method of assisting electrodes
    it is advisable to machine the insulating ceramics and therefore are regarded
    as suitable post processing process for the CMs. Buccioi et al. [25] conducted
    experiment to process biomedical implant devices made of silicon and titanium
    nitride by the process of EDM. The mechanical, toxicological and microstructural
    properties were studied and it was observed these materials holds good as compared
    to the other oxide CMs used for making the same joints and also very complex shapes
    like undercuts and near to net shapes were possible to manufacture by EDM process.


    Mohri et al. [26] conducted experiments to investigate the use of EDM process
    for the machining of insulating CMs by the use of assisting electrodes. The kerosene
    was used a working fluid and it was observed that by using the copper electrodes
    the machining of CMs was very easy. In another study wire-EDM finishing was reported
    to $ZrO_{2}-TiN$ hybrid composite materials. Spark Plasma Sintering was used to
    synthesize blanks of $ZrO_{2}-TiN$ [27]. Sano et al. [28] conducted experiments
    with EDM processes by using electrode made of polycrystalline diamond (PCD). Two
    kinds of PCD namely CTB-010 and CTH-015, both with the flat surfaces were used
    and the results were compared with the electrodes made of Cu-W. It was observed
    that the electrodes made with PCD shows less wear of 1.5% for short pulse duration
    and no wear for long pulse duration while the electrodes made with Cu-W showed
    10% wear for the same conditions. Palanikumar et al. [29] conducted tests to investigate
    the process parameters of machining WC/Co cemented carbide composite materials
    by EDM process. Various machining parameters were also analyzed and the effect
    of MRR and surface quality by these parameters was observed. In a similar study,
    Hanaoka et al. [30] investigated the effect of EDM process which used assisting
    electrode on the discharge behavior of composite made of $Si_{3}N_{4}$ CMs. In
    the conclusion, it was stated that the results of the MRR of the insulating materials
    were better than the results of conductive materials. Gadalla and Tasi [31] conducted
    some experimental studies to demonstrate the effect on the content of the cobalt
    and the size of the grains on various machining characteristics of the cemented
    tungsten'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'carbide. It was observed that the rate of MRR can be varied by the percentage
    of cobalt. By increasing the cobalt percentage the MRR will also improve and also
    increase the EDM process stabilization. Lin et al. [32] conducted some investigations
    and tried to form a link between various parameters like MRR, surface roughness,
    cracks on surface with the rate of electrical discharge. In the results it was
    observed that by increasing the discharge of the electrical energy will significantly
    increase the MRR and surface roughness of the material formed by EDM process.


    Song et al. [33] conducted an experiment to investigate the effect of EDM process
    on composite made of WC-Co with 10.5 % of Co and using water spray as the dielectric
    medium. In the results, it was observed that no corrosion was reported by using
    water spray dielectric medium and the MRR was increased along with significant
    reduction in wear in the electrode. Yu et al. [34] investigated the experiments
    on cemented carbides using two types of EDM wiz dry EDM and conventional oil based
    EDM. In the results, it was observed that the dry EDM showed better results with
    high machining speeds and low wear of electrodes as compared with conventional
    oil based EDM. It was further stated that dry EDM can also be used for 3-Dimensional
    machining of the carbides used as workpiece material. In another study Kumar et
    al. [35] investigated the effects on some machining parameters like pulse on and
    off time, current of pulse and voltage by EDM process on composite made of Al63Si
    with 5 wt. % of SiC and 5 wt. % of B<sub>4</sub>C. Tool wear, surface roughness
    and power consumption were observed and it was stated that by increase in in the
    electric discharge and pulse current there are significant chances of increase
    in the wear of the tool. In a similar study Patel et al. [36] optimized the surface
    roughness parameters of composite materials made of Al<sub>7</sub>0.5-SiC<sub>w</sub>-TiC
    with EDM process. Improvement in mechanical properties was achieved by whiskers
    of SiC and particles of TiC into Al<sub>2</sub>O<sub>3</sub>. In the results it
    was concluded that surface methodology method was useful for obtaining better
    surface finish of the formed composite by the EDM process. Selvarajan et al. [37]
    reviewed various parameters of the composite material processed by EDM that are
