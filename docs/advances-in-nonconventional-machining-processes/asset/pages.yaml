  md: '# CHAPTER 6


    # A Review on Electrical Discharge Machining of Ceramic Based Composite Material


    **Manta** 1.*, **Suneev Anil Bansal**1 and **Bhuvnesh Kumar**2


    1 Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Solan,
    India


    2 Mechanical Engineering Department, SRM University Delhi NCR Haryana, India


    **Abstract:** EDM is the non-conventional process that has used, extensively,
    for cutting harder like nickel and its alloys, titanium and complex shape materials
    which are difficult to machine by other conventional processes. EDM utilizes,
    electrical and heat, energy to machine the workpiece by removing the undesirable
    material. This process use two electrodes, anode and cathode out of which tool
    act as cathode and the workpiece on which the job is being performed act as anode.
    Various factors like current, pulse on and off time, voltage applied can be used
    to optimize the major machining parameters of EDM like MRR, rate of tool wear,
    surface roughness etc. the main focus of this study these parameters on composite
    materials made of CMs, tungsten and cobalt carbides etc. In the end future prospective
    of the areas which require further improvements and investigations has also been
    discussed.


    **Keywords:** Ceramic, Composite materials, Electrical discharge machining.


    # INTRODUCTION


    Electro discharge machining (EDM) is a prevailing manufacturing process that is
    used for the machining of metals. In this process the machining take place in
    the form of melting and evaporation of all materials that are electrically conductive
    in nature which occur by controlling the spark between the electrode and the work
    piece on which the operation is being performed [1, 2]. This is the reason EDM
    is also known as nonconventional spark eroded thermo- electric machining process
    [3]. Over a course of period EDM has emerged as an efficient process for removal
    of the materials. EDM holds the capacity of machining very complex and hard materials,
    that too with high precision which are otherwise difficult to machine with other
    conventional methods.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'To fall on the footsteps of modern manufacturing industry, EDM also posses
    the capability of being an automated process. EDM finds its major application
    in the manufacturing of prototypes, in mold and die making sectors and in the
    industries which are mostly indulged in the making of machined metals such as
    high alloyed steels.


    Past couple of decades, ceramic materials (CMs) have marked their presence by
    their application in all major engineering sectors like automobile, airspace,
    sectors involving manufacturing of electrical and electronic equipment [4]. Some
    major applications like fabrication of the ballistic armors, braking system of
    automobiles, particulate filters for diesel, memory components of computers, sensors
    and various medical products like prosthetic body limbs etc. also involve the
    use of CMs [5]. The reason for so much wider applications of CMs are, its excellent
    mechanical properties such as high compressive strength, high hardness, chemical
    and abrasive resistance.


    WC-Cos were also explored for machining by EDM. A special CIRP reported used of
    EDM in cemetent carbide too [6]. Although, it is reported that EDM surfaces do
    have residual thermal stress [7]. group from


    # PRINCIPLE OF EDM


    In EDM, the removal of the material is obtained by controlling the electrical
    discharges between the two electrodes out of which one electrode is the tool and
    the other one is the work piece on which the job is being performed as shown in
    Fig. (1).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Both the electrodes are separated by a certain dielectric medium which may
    be either dielectric oil or deionised water. Then the voltage is applied thus
    forming a plasma channel that can establish a flow of the current. When the breakdown
    in voltage medium is reached a discharge takes place. As the process of EDM is
    based on the removal of material by melting and evaporation therefore when the
    temperature at the base of the formed channel reached to approximately ≥ 10,000°K,
    the melting and evaporating of the second electrode (workpiece) takes place thus
    resulting in the removal of material.


    # ELECTRIC DISCHARGE MACHINING OF CERAMICS


    CMs, like titanium diboride (TiB₂), silicon doped silicon carbide (SiSiC) and
    titanium nitride (TiN), are electrically conductive in nature and can be machined
    by EDM [9]. According to Luis et al. [10] the materials which are obtained from
    inorganic materials, generally having the purity of high grade, are referred as
    ceramics or advanced CMs. These CMs are further classified into oxide ceramics
    like Al₂O₃ or ZrO₂ and non-oxide ceramics like Si₃N₄ or SiC.


    The machining of CMs of with the process of EDM can be also classified into natural
    conductive materials, non-conductive materials and conductive materials. Mostly
    the conductive materials are made from non- conductive material by mixing some
    impure atoms and it is done by introducing some electro-conductive secondary phases
    (Fig. 2).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_100_0.png)


    Fig. (2). Ceramic materials classification based on their Conductivity [11].


    Adding these phases to the CMs thus increases the electrical conductivity. Some
    improvement in the hardness, strength and fracture toughness is reported too by'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'adding these doping agents [12, 13].


    # MECHANISM OF MATERIAL REMOVAL IN COMPOSITE CERAMICS


    Lauwers et al. [13] conducted a study to develop CMs which were wear resistant
    and also able to machine by the process of EDM. The main focus of this study was
    to investigate the relation between the parameters of EDM process and the microstructure
    of the CMs. For this ZrO₂, Al₂O₃ and Si₃N₄ based CMs were taken and to these materials,
    some phases of electrical conductivity were induced by TiCn and TiN. In the results,
    it was observed that not only melting and evaporation but other factors like oxidation
    and base material decomposition are responsible for effective removal of the material.
    Also it was started that the formations of the crack during the process were resulted
    due to the spalling effect.


    The main mechanisms for removal of material are presented in Table 1.


    Table1. Mechanism for material removal of different composite CMs [13].


    | Material Removal Mechanism in Different Composite Ceramics |

    |---|

    | Composite Ceramic | Dielectric | Machine Configuration | Material Removal Mechanism
    |

    | ZrO₂-TiN. | Deionized water. | WEDM (Wire EDM with Roughing condition) | Melting
    and Evaporation. |

    | Al₂O₃-SiCw-TiC. | Deionized water. | WEDM (Wire EDM with Roughing condition)
    | Melting and Evaporation. |

    | Al₂O₃-SiCw-TiC. | Oil. | Die-Sinking EDM with Medium and high energy input.
    | Spalling. |

    | Si₃N₄-TiN | Deionized water. | Die-Sinking EDM High energy input. | Spalling.
    |

    | Si₃N₄-TiN. | Deionized water. | WEDM. | Oxidation. Decomposition. |

    | Si₃N₄-TiN. | Oil. | Die-Sinking. EDM with Roughing condition | Melting. Evaporation.
    |


    It is observed from Table 1 that dielectric medium, discharge medium and configuration
    of machining parameters plays an important role in mechanism of the material removal.
    The two major mechanisms are melting/evaporation and spalling. Melting and evaporation
    takes place in the state of low energy discharge while the spalling mechanism
    takes place in high energy discharge state. Overview of the electrical conductivity
    of some ceramics and metallic materials is shown in Fig. (3). It is observed that
    like the metallic materials, ceramics that are electrically conductive in nature
    can also be easily machined by the EDM process e.g. titanium diboride (TiB₂),
    titanium nitride (TiN), or silicon dop ed silicon carbide (SiC) [14].'
