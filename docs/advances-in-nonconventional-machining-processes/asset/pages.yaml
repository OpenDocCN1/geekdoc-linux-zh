    # FUTURE SCOPE FOR LASER BEAM MACHINING RESEARCH


    +   1. Most research papers are related to drilling and micro-drilling. Still,
    the three-dimensional laser beam machining like turning and milling are difficult
    to perform. Research can be carried out for laser assisted milling in near future.


    +   2. The laser beam machining is generally performed on sheet metals but due
    to advanced or later engineering material need arises to develop it for machining
    of difficult to hard materials. So, this can be the research area in future.


    +   3. During laser process, in front of tool, workpiece remains soft due to external
    heat source. Also, the tool and chip interface have high temperature which can
    leads to shorten tool life. Therefore, a proper method for cooling the cutting
    tool without affecting the heat up area in front of tool is required [9].


    +   4. Generally, this process is utilized for hard and brittle materials. But
    some ductile materials are also difficult to machine. Hence thermally enhanced
    machining may be utilized for ductile material for improving its machinability
    [9].


    +   5. For optimization of thermally enhanced machining process, a depth study
    of tribological elements like friction, wearing and rubbing between cutting tool
    and chips are required.


