  md: '# CHAPTER 7


    # Current Developments in Machining of Titanium

    Based Alloys using Wire EDM


    Kamaljit Singh^1 and Virat Khanna^2\*

    ^1 Chandigarh Engineering College, Mohali, India

    ^2 Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Himachal
    Pradesh, India


    Abstract: Demand for advanced materials, possessing, and better properties is
    always there in the multi-disciplinary fields of automotive, aerospace and medical
    applications requires advanced machining processes. Wire electric discharge machining
    (WEDM) is a promising non-traditional machining method utilized extensively to
    machine materials with varying hardness and intricate shapes with great accuracy
    and precision. A WEDM is a non-contact process, involves the removal of material
    in the form of spark erosions. DC electrical sparks are constantly generated between
    the wire electrode and the workpiece to achieve desired shape on the component.
    The input variable such as pulse-on-time, pulse-off-time, wire speed, servo voltage
    and flushing pressure can be tuned and controlled in order to optimize the machining
    process responses. The aim of this study is to identify the significant effects
    of process parameters on MRR, TWR, SR and surface morphology of titanium nickel
    memory alloys. Additionally, areas have been recognized that require intense research
    considerations. Future aspects of WEDM are also presented.


    Keywords: Artificial neural network (ANN), Design of experiment (DOE), Electron
    back scatter diffraction (EBSD), Energy dispersive spectroscopy (EDS), Metal removal
    rate (MRR), Scanning electron microscopy (SEM), Surface roughness (SR), Transmission
    electron microscopy (TEM), Wire electric discharge machining (WEDM).


    # INTRODUCTION


    Manufacturing industry, nowadays, follows a trend towards high-precision machining.
    This can easily be found among the demanding markets of micro-mechanical components,
    electronics, and aerospace industries [1]. As newer and more exotic materials
    have been developed in the past few decades, conventional machining operations
    have reached their limits.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'As industry advances, relatively more complicated shaped jobs are required
    to be manufactured [2]. WEDM was introduced in late nineties and gained great
    popularity since then in manufacturing industry. This is primarily due to its
    great ability in machining hard to cut, high strength to weight ratio materials
    with the capacity of producing complex shapes and profiles. Furthermore, WEDM
    can produce a fine, dimensionally accurate surface with high precision. Wire electrical
    discharge machining is a spark erosion process used to produce complex two- and
    three-dimensional shapes through electrically conductive workpieces. WEDM differs
    from conventional electrical discharge machining. A thin wire performs as the
    electrode and finishes the cutting operation [3].


    Wire EDM is a special form of the traditional EDM process in which the electrode
    is a continuously moving. Material is eroded from the workpiece by a series of
    discrete sparks between the workpiece and the wire electrode (tool) separated
    by a thin film of dielectric fluid (deionised water). Wire EDM provides the best
    alternative or sometimes the only alternative for machining conductive, exotic,
    high strength and temperature resistive (HSTR) materials with the scope of generating
    complex geometry. It has proved to have tremendous potential in its applicability
    in the present-day metal cutting industry for achieving a considerable dimensional
    accuracy, surface finish and contour generation features of products or parts
    [4].


    Machining of titanium alloy in the minimum time and with maximum precision is
    an important issue in all application especially biomedical [5]. Titanium and
    its alloys are classified as difficult to machine materials as they possess high
    toughness and strength even at extreme temperatures. Due to properties like light
    weight, extraordinary resistance to corrosion *etc.*, Ti alloys *etc.* find diversified
    and wide spectrum of applications in biomedical, automobile, aerospace, chemical
    field, electronic, gas and food industry. Moreover, titanium alloys incredibly
    durable and long lasting. When titanium cages, rods, plates and pins are inserted
    into the body, they can remain unaffected for more than twenty years [6].


    Machining of titanium alloy, with conventional methods, is very inconvenient because
    of the problems such as immense tool wear; high temperature requirement during
    cutting *etc.*. Therefore, these alloys can be machined with WEDM as it is more
    suitable for such materials. The non-ferromagnetic property of Ti alloys is an
    additional advantage that allows patients with different types of titanium inserts
    within their bodies, to be safely analysed under MRIs and NMRIs [7]. Some implants
    made up of titanium are shown in Fig. (1).'
