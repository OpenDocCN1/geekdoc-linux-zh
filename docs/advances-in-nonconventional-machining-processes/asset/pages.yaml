    # WIRE Electrode Properties


    The machining performances of the WEDM, in general, rely on combination of various
    physical, chemical, electrical and mechanical properties of the tool electrode.
    Thus, wire electrode should have excellent properties for achieving high-speed
    cutting with great accuracy and precision. In Table I the list distinct properties
    of WEDM wires.


    Table 1. Essential properties of WEDM wire [12].


    | S.No | Property | Description |

    | :--- | :--- | :--- |

    | 1. | Conductivity | Low wire conductivity results in a voltage drop and associated
    energy loss over the distance from the power feed to the cutting point |

    | 2. | Tensile Strengt h | Hard wires at tensile strength of 900MPa are used for
    most of work, while half hard around 490MPa and soft wires below 440MPa are used
    for taper cuts for angle more than 5°. |'
