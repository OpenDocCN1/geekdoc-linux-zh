    # MATERIAL REMOVAL MECHANISM


    In the earlier sections, it is witnessed that AJM has found its various applications
    across various materials with ductile and brittle materials along with various
    process parameters. Along with this, a recently found type of erosion is also
    seen which is named as ‘elastic erosion’. Overall, the material removal mechanism
    (MRM) depicts the machine efficiency. As in brittle material, abrasive strikes
    the machine surface and creates a crack normal to the surface in downward direction,
    thus leading to an oblique crack at the bottom of the deformed material section
    area extending parallel to the top side. Here the chipped part is assumed to be
    hemispherical having depth or radius equal to crack created by single abrasive
    strike. Various studies have been done correlating the radius of chip produced
    depending on the toughness, hardness and viscoelasticity of the material, geometry
    of chip produced and force of abrasive indent for ceramics with the standard model.
    Authors also stated that there has to be a specific energy for a specific material
    for the crack propagation.


    # ELASTIC MODE MRM


    It has been discussed earlier that the surface integrity is affected by the particle
    size [4]. The brittle/ductile erosion leads to the change in the surface structure
    at microscopic level. No surface roughness effect is found as we change the abrasive
    size from 120 nm to 40 nm. Thus, using particles can help of reducing the deformation
    and crack in final machine surface and It was thus emphasized to change the indentation
    mechanism to “surface area mechanism” while using abrasives of size less than
    100 nm. Conventional larger sized abrasives move in a straight line on the surface,
    but the fine abrasive can change the direction with the flow. For a particular
    ratio of abrasive mass to the flow velocity, a tangential force comes into play,
    thus changing the path to a curved trajectory and strikes the workpiece substrate
    asymptotically (Fig. 4). So, in cases where less energy for erosion is creating
    erosion on the substrate surface than the threshold energy, elastic erosion is
    said to occur. Taking this into account a new theory based on creating chemical
    erosion (namely elastic erosion) that considered the hydroxylation effect with
    chemical absorption. In this, the nano scale particles chemically react with the
    substrate surface to form bond within 1nm distance from substrate top layer. Peng'
