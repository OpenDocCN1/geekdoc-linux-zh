    # WIRE ELECTRIC DISCHARGE MACHINING (WEDM)


    While the material removal mechanisms of EDM and WEDM are similar, their functional
    characteristics are not identical [8]. In WEDM process electrical sparks are produced
    between a thin, travelling wire which acts as the tool electrode and the workpiece
    to erode the material in order to generate desired shape. The Schematic diagram
    of WEDM is shown in Fig. (2).


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_115_2.png)


    Fig. (2). Schematic diagram of a WEDM system [9].'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'During operation, the wire is continuously fed from a wire spool and is guided
    by lower and upper nozzle in wire electric discharge machine while the workpiece
    remains stationary. The materials usually used are conductive in nature such as
    copper, Brass, Zinc coated brass, Diffused brass, Molybdenum *etc*. The electric
    potential isapplied between the wire electrode and workpiece, where electrode
    is acting as a cathode and workpiece is act as anode while maintaining a small
    gap between them.


    The dielectric fluid, such as de-ionized water, is also present between the wire
    electrode and workpiece. The electron moves from the cathode and its strike on
    to the molecule of de-ionized water and releases the number of electrons. These
    electrons again strike on to the next molecule of the de-ionized water. The process
    goes on continuously and simultaneously positive ions move towards the cathode.
    In this way, a large number of electrons are moved towards the anode (workpiece).
    The kinetic energy of electrons is converted into thermal energy and spark is
    generated. This spark energy increases the temperature of the workpiece to about
    10,000°C. Due to this, melting and evaporation of workpiece material are taken
    place [10]. Filtered dielectric fluid is pumped and streamed continuously to enclose
    both the workpiece and the wire electrode. The electrical energy pulses passing
    through the electrode wire, at the machining zone, vaporize the dielectric fluid
    to blow off tiny portions of the workpiece and the wire. As, wire is continuously
    fed by the wire spool, every time a new section of wire acts as the electrode
    when old section of the wire is cut off and becomes scrap. However, the wire-workpiece
    gap is maintained and controlled to produce an accurate cut surface. Moreover,
    the dielectric fluid acts as an insulator so that high energy in the gap can be
    produced for the generation of spark. Also, it collects and carries away the debri
    and reduces heat that is produced during erosion.


    Wire-cut EDM is used when low residual stresses are desirable as it does not need
    high cutting forces for the removal of the material. If the energy per pulse is
    relatively low, little change in the mechanical properties of a material is expected
    due to these low residual stresses. Although, in conventional machining processes,
    material that has not been stress- relieved can distort in the during service
    life. Due to the inherent properties of the process, wire EDM can easily machine
    complex parts and precision components.


