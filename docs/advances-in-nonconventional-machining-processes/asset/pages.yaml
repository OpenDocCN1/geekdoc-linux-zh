    # LITERATURE REVIEW


    # Abrasive Air Jet Machining


    Abrasive Air Jet Machining (AAJM) can be described as the technique that works
    by blasting a stream of particles at a high velocity, thus causing erosion of
    material [6]. It is emphasized to have a good material removal rate. It has been
    found out that on reduction of the nozzle diameter to less than 1mm it changes
    into a micro machining process or Micro-AAJM. The layout can be seen in the (Fig.
    1). The in-system filter and drier are used to clean the compressed air and dry
    it at the same time. After this the air is passed through the adjusting valve
    where the pressure of air is regulated and controlled. Then finally, it is passed
    to the blasting gun near the workpiece. The particles, after being used for erosion
    along with chips, are collected with the help of dust catcher. During the machining,
    there is a little amount of fracture depending upon the material used, properties
    and the various parameters considered. After the erosion the particles, the gases
    are escaped. Micro AAIM is used for production of small passages like passes and
    holes on various brittle materials such as ceramics, glasses and carbide metals.
    It is also found that the abrasive particles are often seen embedded in the machine
    surface thus creating a negative relation when nonferrous metals or polymers are
    used. To machine such materials, the cryogenic assisted AJM is used that is discussed
    later.'
