    # EFFECT OF WIRE MATERIAL AND COMPOSITION


    As it has been seen in the previous section that the wire vibration and its rigidity
    during the machining process plays a very important role. Thus, material selection
    for the wire should be made on the basis of having high endurance in terms of
    tensile strength and toughness to absorb all the vibrations and stresses produced
    with minimum vibration. It has been studied that with the rise of Zn percentage
    in the wire composition the machining speed increases with lower servo voltage
    requirement thus leading to lower chances of short circuit during machining [26].
    A lot have researched have been done to maximize MRR with least TWR and SR. Few
    of the important wire material used are discussed below.


    # Copper


    Copper was the one of the first materials to be used as an electrode for machining.
    But due to the physical limitation in the properties like strength and low vapour
    pressure it puts some limitation to it use as wire in WEDM [25].


    # Brass


    As an alternative to Cu, Br plays a very significant role in WEDM having good
    performance results. It is an alloy of Cu and Zn containing both the elements
    up to around 63% and 37% respectively. Zn is added to exhibit high tensile strength,
    high vapor pressure and low melting point [25, 26].


    # Coated Wires


    It has been found that the electrode coating of wires, having less vapourization
    temperature, possesses fewer chances to experience thermal shock. It includes
    a'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'wire having high conductivity core with a coating of an alloy having low melting
    point and finally a coating of alloy having high strength, thus facilitating high
    machining speed. A lot of researches of such coated electrode wire have been carried
    out having high machining capabilities with better flushability producing cuts
    with least inaccuracy and surface roughness. But the only disadvantage is the
    high coat along with the chances of contamination of dielectric used creating
    environmental limitations [27].


    # **Diffusion Annealed Wires**


    Due to such good characteristics of the zinc coating it can be thought that a
    pure zinc coated wire would produce a high machining result. Zn offers low melting
    point, combined with good flushability. Thus, it can be stated that a diffused
    coating having high or pure concentrations of Zn on the top layer could produce
    encouraging results. To produce such diffused wires, the annealing of the encaising
    material is done that allow the even distribution of the alloy on top layer. By
    this one can produce a wire having high resistance to wear as compared to the
    conventional electrode EDM material. The resulting EDM wire resulted in a quite
    significant increase in production rate as compared to the brass electrode wire
    [28].


    # **EFFECT OF FLUSHING AND DIELECTRIC FLUID**


    Dielectric is used in EDM in the various forms such as full immersion, flushing
    with jet or spray. In Fig. (5) the effect of flushing pressure on the machining
    speed (Vs) and Surface roughness (Ra) is being plotted.


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_137_0.png)'
