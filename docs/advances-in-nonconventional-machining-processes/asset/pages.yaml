  md: '# CHAPTER 8


    # # Recent Developments in EDM and its Types


    Anupam Thakur* and Suneel Anil Bansal


    Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Himachal
    Pradesh, India


    **Abstract:** Electric discharge machining has been one of the advanced machining
    processes that deals with the machining of intricate and complex shapes on a workpiece
    considering various parameters like surface roughness and higher accuracy. A lot
    of research has been carried out in the EDM area for developing various models
    and selecting the best optimum condition for machining using conventional or wire
    EDM. Some results regarding submerged and dry EDM processing have also been discussed.
    Along with this, a recent development of smart EDM is also discussed for predicting
    the future capabilities of an EDM machine. In this article a light has being thrown
    on all the recent developments being done on the basis of machining capabilities,
    parameter, along with the characteristics of machining surface and various wire
    materials and the effect on the EDM wire during machining and the overall performance.


    **Keywords:** Composites, Electric discharge machine, Materials, MRR, Process
    parameters.


    # ## INTRODUCTION


    Electric discharge machine facilitates many intricate complex shapes being produced
    without the physical contact between the workpiece and the tool in form of electrode.
    The process of machining is carried out by continuous spark erosion between the
    electrode and workpiece interface (Fig. 1). This process is carried out by developing
    an appropriate voltage between the workpiece and the tool which leads to the dielectric
    medium breakdown as a result of strong electrostatic field. It is an advanced
    manufacturing technique generally used in die manufacturing mould making, automotive
    manufacturing, and medical instruments etc. Most fragile objects, cannot be machined
    easily by other machines, can easily be machined without any risk factor. It has
    been seen that a no toxic gas fumes and contaminated dielectric are been produced.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Wire EDM is also somehow similar to a conventional EDM as it implements the
    electrode in the form of wire that is used for spark erosion.


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_131_0.png)


    Fig. (1). Layout of EDM Mechanism.


    This further gave more scope for producing intricate and fine shapes having high
    surface finish and accuracy to be produced using WEDM. Some researches depict
    the creation of ionized column at the shortest distance between the tool and workpiece
    [1]. With the advancement, complex and fine design, the wire EDM has come into
    light which can give a new scope of machining with high level of accuracy and
    finishing. It uses electricity as the source conducting through a thin copper
    or brass wire acting as an electrode. When this wire comes closer with the workpiece,
    the electric spark at the nearest section starts thus leading to spark erosion
    of the metal by melting and vaporization of microscopic particles. During this
    process, wire also gets eroded on a minute sale thus leading to a form of tool
    wear. To allow an equal and precise dimension of the cutting area, the machine
    changes the old wire with new wire section by automatic mechanism present on the
    machine as the machining advances and cutting is performed. The whole process
    is carried out in a dielectric medium of deionized water to facilitate evenly
    and continuous cooling of the work area with removal of eroded particles produced
    during machining.'
  merge: -1
  img_proc: true
