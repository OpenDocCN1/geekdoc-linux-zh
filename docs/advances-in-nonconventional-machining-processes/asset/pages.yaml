    # **AWJM - LITERATURE**


    Researchers studied AWJM while machining Al7475. Various parameters were considered
    in the study like pressure, transverse speed, distance from the workpiece and
    jet inclination. 3mm Sheets of Al were used in the study. Fatigue life and MRR
    during machining were studied [11]. *Yue et al.* [12] experimented to find the
    effect of input parameters on the AWJM process. Pressure, feed, abrasive rate
    and nozzle angle were varied to find the effect on MRR. While cutting alumina,
    it was concluded that by increasing pressure and abrasive flow, simultaneously,
    MRR was increased. Numerical simulation studies were performed too with a special
    type of AWJM process [13]. An ultrasonic assisted AWJM process was investigated
    to find out the abrasive erosion process. Partially overlapping conditions and
    entire-overlapping conditions were studied. The Study concluded that a 30° impact
    angle having a sharp edged particle could lead to higher MRR. Higher MRR was witness
    at vibration assisted machining rather than without vibration machining [13].


    Special materials like Ti6Al4V-CFRP were cut with AWJM [14]. For the first time,
    taper angle, kerf and roughness were considered during the study. Conventional
    machining finds various difficulties to cut these materials as both materials
    (Ti6Al4V and CFRP) have very different characteristic. The Study was successfully
    performed and opened a new door to machine dissimilar materials in'
