    Sahu et al. [55] explored the EDM of Nitinol using AlSiMg tool fabricated by SLS
    and compared its performance with the commercially available graphite and copper
    tools. Surface roughness was selected as response to examine the influence of
    electrode material, current, voltage, pulse duration and duty cycle. The average
    surface roughness achieved with SLS tooling was least followed by copper tool.


    Equal et al. [56] fabricated EDM tool using fused deposition modelling (FDM).
    Acrylonitrile butadiene styrene (ABS) was used as the core material and outer
    shell was produced by copper coating. With FDM, it was found very difficult to
    maintain the sharp edges of tool. Although, the performance of tool fabricated
    with FDM process was comparable with solid copper tool, but it has lower dimensional
    accuracy. The difficulty in producing the exact dimension of tool with FDM was
    cited as the reason.


    Saxena and Metkar [57] also developed an EDM tool using FDM. Copper coating was
    done on a core of ABS material fabricated by FDM. influence of current, pulse
    time and voltage on EWR and MRR was analyzed. Similar results for MRR were obtained
    with solid copper tool and tool fabricated by FDM, whereas, the later performed
    slightly better in terms of EWR.


