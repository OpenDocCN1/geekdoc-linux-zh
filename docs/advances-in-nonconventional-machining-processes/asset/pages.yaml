    # EFFECT OF VARIOUS PROCESS PARAMETERS


    # Abrasive Size


    Abrasive size plays a very important role in any abrasive jet machine. On increasing
    the size of abrasive, the volume and mass associated with it changes, in turn
    affecting the kinetic energy of the abrasive which affects MRR of AJM Table 1.
    But the nozzle size put a limit on the abrasive size to be used even if the particles
    are 15 times smaller than the size of nozzle. It is found that this increase in
    particles size also results in the surface roughness and larger chips produced
    [34]. Kowsari et al. [35] stated in their study that the particles with size of
    25µm and 10µm produced similar crest to trough roughness on working of sintered
    ceramic material. In case of ceramics the chips were removed by the detachment
    of grains from the substrate and then combining with the metal grain with more
    binding strenght. Another factor that was seen was the impingement of abrasive
    particle on the workpiece surface that was believed to be due to the static friction'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'between the two. It was also found that the fine particles tend to have lower
    tendency to embed as compared to larger abrasive size [36].


    # Flow Rate


    Flow rate is defined as the gram of abrasive particles being supplied in a respective
    quantity of carrier gas, liquid or slurry. *Li et al.* [37] showed that the flow
    dynamics can be also dependent on other process factors than this. It was shown
    that the shape of groove produced changed to somewhat taper as the flow rate was
    reduced. Use of dessicant, maintaining low level of abrasive in reservoir *etc.*
    were stated to have best abrasive flow.


    # Nozzle Material and Geometry


    Like the entire machining processes tool wear in the form of nozzle wear occurs
    across all types of AJM.


    It is the most delicate part of an AJM. A high-pressure carrying gas of medium
    having particles is passed through the nozzle orifice. During the passage, there
    is collision of particles many times on the wall of the nozzle and thus leading
    to its wear and its parts profile disturbance, process instability, jet disturbance.
    Thus, it is very important to consider this as the area of improvement. The nozzle
    wear is measured in terms of ‘nozzle weight loss rate’ (NWL R) in grams/minute.
    Out of a various proposed nozzle material, alumina ceramic nozzle serves a greater
    life as compared to stainless steel nozzle. 30% less NWLR was found in monolithic
    B,C coating compared to Al<sub>2</sub>O<sub>3</sub>/Tungsten, Titanium coating.
    Along with this functionally graded materials (FGM) were being found whose coating
    proved to be more wear resistant up to 4 times of standard nozzles. Lower stress
    levels at the nozzle entrance were also seen by simulating an FEM model of the
    same. At the same time increasing the length of the nozzle decreases the wear
    rate at the exit. Doing this, the particle velocity vector attained the same direction
    along the nozzle length thus reducing the wear. Increasing the nozzle length from
    76mm to 126 mm, the life of nozzle doubled. Optimum value for Orifice: Nozzle
    diameter found to be 0.4 [38]. It was found that large amount of nozzle wear also
    take place due to the tensile and thermal stresses. The optimum angle for nozzle
    entrance was discovered to be 11°. At the same time, the larger entrance angles
    produced more stresses.'
