    to have a continuous monitoring of these equipment. Dielectric used was merely
    deionized water having a conductivity merely of 15 µ-siemens/cm.


    The dielectric used here plays a major role of maintaining the temperature of
    20°C along with cleaning and maintain the deionization gap between the electrode
    and the workpiece. For these two reservoirs are used which have filters installed
    in them and maintain the pressure of the dielectric and continuously clean the
    dielectric. In Fig. (6) we can see the layout of dielectric circuit being built
    to stabilize the dielectric conductivity, as it changes with the introduction
    of new fine particles produced while machining. So, despite of having a large
    no of sensors been prior installed a new deionization system is being used to
    lower this increased conductivity and stabilize it.


