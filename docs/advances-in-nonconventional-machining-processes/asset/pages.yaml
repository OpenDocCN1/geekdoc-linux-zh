    unsupervised algorithms can classify them according to their similarities, patterns,
    and differences. Finally, reinforcement learning, in artificial intelligence,
    is following a dynamic approach that teaches the machine using a reward and punishment
    technique. In this technique, the machine learns by interacting with its environment
