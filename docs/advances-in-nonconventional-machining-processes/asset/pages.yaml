    **Abstract:** Abrasive Machining has been seen making a significant advancement
    in recent years. Localized erosion with intensification-based technology used
    in manufacturing is known as Abrasive jet machining. This paper emphasizes on
    the recent advances being done in the various parameters and innovative techniques
    like thermal assistance, completely or intermediate submerge conditions on jet
    used for machining *etc.* Advancement in AJM is also seen in certain areas like
    tribology. There are certain areas like micro machining and polishing of small
    micro channels which also harness its advantages. It is also found that a new
    way of machining has been developed using elastic erosion. Other than this, certain
    parameters like material of jet nozzle, its design criteria, particle size, and
    flow rate of jet used are reviewed too. large amount of micro machining and Composite
    material machining advancements has been witnessed using the Abrasive jet machining.


    **Keywords:** Abrasive jet machining, Materials, Micro machining, Process parameters.


    # INTRODUCTION


    Abrasive jet machining is one of the non-traditional machining processes that
    are specifically used for the material having low shock resistance during machining
    process. It is also being seen that the importance of machining has gained its
    value over the past few years as due to various factors in the areas like machining
    of a design carrying various complex structures optics, medical instruments, precision
    instruments [1] as well improvement in the overall quality of the required product
    design or features [2].'
