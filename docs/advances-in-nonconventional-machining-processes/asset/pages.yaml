  md: 'The pressure flow facilitates the continuous removal of the eroded particles
    created during sparking and it should be less when approaching the finishing time.
    It is also seen there a certain limit out of which the adequate machining cannot
    be done, with increasing flush pressure upto 1 Kg/cm² higher machining speeds
    are possible, beyond this there is decrease in machining speed rate. High temperature
    ranges are seen along spark discharge when flushing pressure is less than 0.3
    kg/cm².


    The dielectric fluid other than flushing out the eroded particles performs various
    functions such as cooling the workpiece and tool during machining. It also helps
    to concentrate the spark energy on the required smaller section of machining and
    gap insulation before accumulation of large amount of energy.


    # ## SMART WIRE EDM


    As we know that industry has been changing and it has been introduced with new
    revolution called as ‘Industry 4.0’. Studies prove that this could produce much
    better results by cutting off the various unwanted cost by avoiding downtime [29].
    It has been seen that with the current requirement of micro machining some intelligence
    factors need to be introduced which could help do such work with high level of
    accuracy and precision. A lot of funds have been seen to be invested in such projects
    as compared to conventional EDM projects [30]. In this it has been emphasized
    to introduce a new intelligence factor into the machining era which could optimize
    various control parameters and exclude environmental hazards. These not only restrict
    to this but also have the capability to self-investigate and monitor the various
    tasks being done and do any appropriate changes to get the best machining characteristics.
    Such implication is being seen in recent year in a research done by Walder et
    al. [31]. As WEDM are equipped with no of sensors and devices to monitor various
    things such as replaceable part as their service hour are completed a lot of manufacturing
    cost can be cut as compared to a conventional EDM where we replace some parts
    much before there service life gets finished to avoid downtime but increasing
    manufacturing cost at the same time. No deep study has been done till to optimize
    such and build a prediction model as it requires a lot of thorough study in field
    of machining along with its chemical study. An effort has been made to build such
    model by Walder et al. This has various advantages like real time data collection
    and updating of the prediction model to get a precise model as the machining is
    being carried out. Recent applications of WEDM are seen in the materials like
    Inconel, work steel K110 and other hard metal being used in various high-grade
    industries. Study was focused on the four parameters i.e. EDM wire, Main Filter,
    Resin for deionization, Contacts for current supply to wire as these were having
    major downtime/replacement cost.'
