    Durr et al. [41] introduced the concept of direct metal laser sintering for the
    fabrication of tool electrode for EDM process. The electrodes contained bronze,
    nickel and copper phosphate powders, were built layer by layer. Process optimization
    made it clear that the porosity of the sintered electrodes directly controlled
    by the laser speed, laser power and sintering strategy. The electrodes were also
    infiltrated with silver containing brazing metal. These electrodes achieved MRR
    approximately 12.5 mm$^{3}$/min but it exhibited greater EWR and surface roughness
    as compared with conventional electrodes.


    Norasetthekul et al. [42] synthesized tool electrodes by mechanical pressing of
    polymer coated ZrB$_{2}$ powders, followed by infiltration of copper into the
    green body in a high-temperature furnace. It was noticed that higher the compaction
    pressure, the lesser the voids between the particles, thus reducing the amount
    of copper required to infill the voids. However, it was found that the copper
    tends to fill the voids incompletely. It was observed that the ZrB$_{2}$-Cu electrode
    had the highest thermal wear resistance to the plasma spark at the condition of
    extremely'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'high energy flux. Also, the tool was able to cut the steel work piece faster
    than graphite and copper tools.


    Li *et al.* [43] revealed the effect of addition of TiC the properties of sintered
    Cu based tools. The pellets were fabricated by P/M of copper and copper-tungsten
    (Cu–W) powders by varying the TiC from 5% to 45% followed by liquid phase sintering.
    Addition of TiC improved the surface finish and suggested to be used for finishing
    purpose. TWR was also found to be lesser for all these electrodes in comparison
    to commercially available electrodes.


    Zhao *et al.* [44] reported the use of selective laser sintering (SLS) as useful
    method to fabricate EDM metal prototype. The density and other facets of the mechanical
    performance of an SLS metal prototype were improved by the metal infiltration.
    The metal prototype was dipped into a liquid infiltrant (copper used commonly)
    that rose into the open pores by the mode of capillary action. The results showed
    that the wear rate of the electrode was comparable to that of conventional electrodes.
    The surface roughness obtained was within acceptable range for the similar machine
    settings.


    Blom *et al.* [45] employed spray metal deposition and electroforming procedures
    to produce tool electrodes. Performance of these electrodes was compared with
    conventional solid tool electrodes. For different working conditions MRR, TWR,
    machining time and surface roughness were measured. The solid tool achieved better
    results as compared with electroformed tool in terms of MRR and TWR. However,
    the tools synthesized by electroformed method were found to be cheaper than the
    solid tools.


    Shibayama and Kunieda [46] revealed the electric discharge machining of deep slots
    with the electrode having very small size holes. The holes directed the dielectric
    fluid over the work surface. Two copper plates having micro grooves over the interface
    for directing the dielectric fluid were joined by diffusion bonding to form the
    electrode. This electrode took less processing time with more machining preciseness
    as compared with normally used solid tool electrode.


    Mishra and Pathak [47] added carbon (0 to 10%) and titanium carbide (0 to 10%)
    in ZrB2 powder and studied the systematic sintering. The mixing of carbon upto
    4% resulted in densification but further increase in carbon addition retarded
    the densification. Addition of TiC above 5% had adverse effect on sintering of
    ZrB2. The inclusion of carbon helped to hinder the grain size and composite with
    fine grain size and higher density was obtained.


    Hsu *et al.* [48] used rapid prototyping based on electrodeless plating (nickel
    plating) and electroforming (copper) for the fabrication of electrode for EDM
    process.'
