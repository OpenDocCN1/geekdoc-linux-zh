  md: '# LITERATURE REVIEW


    Peyman *et al.* described the use of laser in the medical field. In this Nd: YAG
    laser energy was utilised to surgery for tumor and it was successful. Now the
    use of laser is increasing continuously in this direction [1]. Jiang *et al.*
    discussed about, most wonderful and rapidly increasing, laser beam machining process.
    The focus was on the use of CO₂ and Nd: YAG laser. Both types of laser were utilised
    for cutting hard material and had their own limitations. Nd: YAG laser had their
    low mean beam power but high beam intensity. High beam intensity made it special
    over CO₂ laser. The maximum depth of machining was a severe problem in pulsed
    Nd: YAG laser due to low mean beam power. So the study was carried out to estimate
    the depth of machining and the transverse of the produced hole [2]. Yeo *et al.*
    investigated the laser drilling operation in the material which was generally
    used in the aerospace industry. In this paper different, types of the laser having
    different wavelengths were analysed. The operating power of each laser and their
    efficiencies were not same . The different parameters of this process were also
    reviewed for getting good quality holes [3]. Piotrrot *et al.* reviewed the laser
    cutting process and quality in components produced by the laser. The enhancement
    in quality of a product could be done through proper monitoring, diagnosis and
    regulation for improvement in cutting. The initial set up and running cost of
    this process is very high. Proper control must be done to make the process economically
    viable [4]. Black *et al.* investigated the machining of a thick ceramic tile
    having thickness of 8.5 and 9.2mm. In this CO₂ laser beam machining was done and
    different cutting parameters at different cutting speeds studied. With the use
    of a CO₂ laser, cracks were observed and it was due to temperature gradient (change
    in temperature with respect to thickness) within the ceramics tiles. To avoid
    cracks, a cooling arrangement must be incorporated during machining [5]. Black
    *et al.* investigated the cutting process of ceramic tiles using a CO₂ laser.
    The various parameters were analysed for preparing the database for this process.
    Six types of Si/Al₂O₃ based ceramic tiles were considered for analysis having
    a thickness between 3.7 to 9.2mm. The database was collected for work in two conditions,
    one from the atmosphere and other from underwater cutting [6]. Fang *et al.* identified
    that tool wearing was the big problem in diamond turning of glasses. Three methods
    were discussed in paper for machining glass-like indentation, single point scratching
    and taper grooving. Out of these, taper grooving was more effective for the study
    of the transition from brittle to ductile mode. Still, the life of the tool was
    the major issue [7]. Meijer *et al.* discussed about laser beam machining, its
    applications with the use of ultrashort pulsed laser. With a short pulsed laser,
    micromachining could be easily done and this was the advantage of this process.
    Still, in this field of laser, development is on the way and the research continues
    in this field [8]. Sun *et al.* summarized the progress and benefits of thermally
    enhanced machining of hard and brittle'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'materials in which material was removed by the external heat source. It was
    observed that laser beam machining can improve the machinability in terms of longer
    tool life, reduction in cutting forces and better surface finish for composite
    and ceramic materials. It observed that saving in cost of tool and reduction in
    tool changing time, the life of tool increased in laser and plasma-assisted machining
    [9]. Dhar et al. reviewed the laser drilling process and techniques to solve the
    issues during high quality and accurate holes. The three drilling techniques were
    discussed. These were single-pulse drilling, trepanning and helical drilling.
    With these drilling techniques, small to large size holes can be produced. It
    was concluded that drilling time was more from total time and hence drilling cost
    was increased. Laser beam drilling has the potential to reduce the drilling time
    through better control of the process [10]. Pham et al. proposed a new technique
    of machining of alumina material with a laser milling process. Basically, in earlier
    days, the machining of the ceramic component was very costly because it required
    costly tooling. In the current paper, the material removal characteristics of
    this process are reviewed. The results showed that complex geometry can be produced
    with laser beam milling without the need for expensive tools. So, it concluded
    that this process was cost-effective if ceramic components were produced in batches
    [11]. Dubey et al. investigated the hybrid processes influence in today''s industries.
    In recent years, laser and non-laser hybrid processes are becoming more popular.
    Laser and non-laser hybrid conventional machining processes comprises of laser-assisted
    turning and grinding. Similarly, laser and non-laser unconventional hybrid machining
    processes comprises of laser-assisted ultrasonic machining, laser-assisted electrochemical
    and electrical discharge machining. Yue et al. found a deeper hole with a much
    smaller recast layer during ultrasonic-assisted laser drilling as compared with
    laser-assisted drilling without ultrasonic aid [12] [13]. Low et al. reported
    an investigation of taper hole formation during laser drilling. It was general
    problem of laser percussion drilling. The taper in hole could be controlled by
    a laser beam with variable pulses. With identical pulses, the taper hole could
    be easily seen during drilling. The new approach utilised to produce zero, negative
    and positive holes [14]. Dubey et al. studied the effect of process parameters
    on the performance of Nd: YAG laser beam machining. The investigation was done
    with the design of experiments for drilling, micro-drilling and cutting operations.
    The results showed that Nd: YAG laser beam machining can be successfully applied
    for machining due to the capability of changing wavelength and frequency. With
    this process, a micro-hole up to 5-micron meter and the thin sheet of 4-micron
    meter can be easily machined [15]. Kibria et al. experimented with Nd: YAG laser
    micro turning on the cylindrical workpiece of ceramic material as this has a great
    advantage in automotive, medical and electronic industries. The depth of cut and
    surface roughness of material by varying process parameters was analysed. The
    results showed that process'
