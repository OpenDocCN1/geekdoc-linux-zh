- pgno: 43
  md: 'Process of this type reduced the manufacturing duration as well as curtailed
    the cost of electrode fabrication. Experimental observations showed no crack on
    the electrode and promising results for EDM process.


    Monzon et al. [49] tried rapid prototyping and electroforming process for the
    manufacturing of EDM electrodes. They developed copper electroformed shell testing
    methodology. The various aspects such as composition, internal stresses, electrolytic
    bath additives, pitting, dimensional precision and roughness were analyzed. As
    compared to conventional techniques favorable outcomes were recorded in terms
    of weight and ease of fabrication of electrode.


    Egashira et al. [50] fabricated ultra-small tungsten tools by the combination
    of wire electrode discharge grinding and electrochemical machining. Holes with
    radius lesser than 0.5 μm and more than 1 μm in depth were drilled in brass and
    zinc material successfully. However, the circularity of the hole was not found
    good as the size of a single discharge crater was found to be greater than the
    hole diameter.


    Meshran and Puri [51] used three different methods, rapid wire EDM, net shape
    casting process and investment casting process for the fabrication of EDM electrodes.
    Rapid wire EDM process resulted in better dimensional accuracy in comparison to
    other two methods. Net shape casting required lesser time for the electrode fabrication.
    The copper-brass electrode fabricated by this process resulted in highest MRR
    and EWR. Investment casting was found to have edge over the other methods to produce
    complex shape electrodes.


    Balasubramanian and Senthilvelan [52] performed the EDM of EN8 and D3 steel with
    cast and powder metallurgy copper tool electrode. Higher average MRR (77.4 mm³/min)
    and lower average TWR (10.99 mm³/min) was obtained with cast electrode as compared
    to sintered electrode for EN-8 material. Cast electrode also showed high MRR (136.1
    mm³/min) and low TWR (3.32 mm³/min) in EDM of D3 steel. Sintered electrode showed
    better surface finish for EN-8 and D3 steel with comparison to cast electrode.


    Pal and Choudhry [53] manufactured copper and brass electrode for EDM process
    by abrasive water jet machining (AWJM). Array of holes were made on stainless
    steel and Ti-6Al-4V by keeping voltage, current, duty cycle and pulse duration
    constant. Deviations in the dimensions of the tool produced by abrasive water
    jet machining and dimensions of the workpiece were observed as shown in Fig. (9).
    Two reasons were held responsible for this. First was taper produced on the tool
    due to instintive property of abrasive water jet machining jet which produced
    kers on the fin length. Second logic was that the side walls of the blind cavities
    got machined because the tool was not masked on the sides.'
