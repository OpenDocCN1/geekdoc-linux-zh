- pgno: 47
  md: 'In powder metallurgy (P/M) technique, it is possible to combine the desirable
    properties of different materials and change the physical properties through compacting
    pressure and sintering temperature [40]. Thus, through P/M there is better control
    of the properties of the electrode possible. Ease of fabrication, flexibility
    of composition and efficacy in dispersing fine particles [34] are the benefits
    of powder metallurgy thereby making it a suitable method for electrode fabrication.


