- pgno: 52
  md: '# CHAPTER 3


    # Thermally Enhanced Non-Conventional Machining Process- A Review


    Janender Kumar$^{1}$, Suneev Anil Bansal$^{1,*}$ and Munish Mehta$^{2}$


    $^{1}$ Department of Mechanical Engineering, Maharaja Agrasen University, Baddi,
    Solan, India


    $^{2}$ School of Mechanical Engineering, Lovely Professional University, Phagwara,
    Punjab, India


    **Abstract:** The present work puts light on the non-conventional machining process
    in which heat energy is utilized to remove the material from the workpiece. Laser
    beam machining is a process in which a high-intensity beam falls on the work surface
    to raise the temperature so that the vaporization of material could take place.
    Laser beam machining process can be utilized to machine hard and brittle materials.
    The laser types used and laser drilling processes are reviewed. The complex profiles
    cutting and micro-drilling can be achieved which is not possible by other conventional
    and non-conventional machining processes. Many researchers have studied that a
    hybrid process can improve the process parameters of laser beam machining. This
    paper reviews its need, hybrid process and latest developments in the field of
    machining of different materials like ceramics, composites, etc. The last section
    of the paper discusses the area of future research in this field.


    **Keywords:** Complex shapes, Drilling, Hard and brittle materials, Heat energy,
    Hybrid machining, Laser beam, Laser beam Machining, Machining parameters, Micro-drilling.


    # INTRODUCTION


    In the manufacturing industries, the development of advanced material brought
    a revolution in the performance of equipment and machinery due to its superior
    quality. Simultaneously, it has posed challenges to its machining because these
    materials are hard and brittle. The complex shape and unusual workpiece size were
    also the requirements. Industry has forced the research engineers to develop newer
    machining methods [8] [12]. So, to take full advantage of these costly materials,
    advanced machining methods are under consideration. These are ultrasonic machining,
    electrochemical machining, electrochemical grinding, laser beam machining, water
    jet machining, *etc.* are machining, plasma are machining, *etc.* Yet these have'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'own certain limitations regarding machining of parent material. In this paper,
    laser beam machining and allied processes are studied. It is also called thermally
    enhanced machining processes because heat energy is utilized for machining. In
    our childish days, we performed one experiment in which sun rays were focused
    through a lens to burn a piece of carbon paper. The energy density was about 1W/mm².
    In some manners, a laser beam can be focused on hard material with high density
    to remove the material from the workpiece through vaporization. Einstein gave
    the concept of laser theory and stimulated emission. The first laser named Ruby
    laser was produced by Tower and Shallow in the year 1957.


    # LASER BEAM MACHINING


    The full form of laser is “Light Amplification by Stimulated Emission of Radiation”
    Laser light is monochromatic in nature i.e. its wavelength occupies a very narrow
    portion of the spectrum. Hence a simple lens can focus the laser light to a micro-spot
    of a very smaller diameter and with higher intensity than another type of light.
    Laser light is coherent as it travels in phase. The three major elements of any
    laser device are:


    +   a. Lasing medium


    +   b. A pumping energy source required to excite these atoms to higher energy
    levels.


    +   c. Optical feedback system.


    The laser medium may be a solid, liquid or gas. All have different wavelengths.
    It lies between 0.2-l-lmicron meter.


    Ruby = 0.7micron meter, Nd:YAG = 1.0 micron meter, CO=2.7micron meter,CO₂=10micron
    meter.


    # Types of Lasers


    Different types of laser are utilised in machining having a frequency and mean
    power accordingly as shown in Table 1.


    # Difference Between Ordinary & Laser Light


    Laser light has photons of the same frequency, wavelength and phase. That''s why
    it is highly directional and of high-power density. It has better focusing properties
    as compare to ordinary light.'
