    # CONCLUDING REMARKS


    A lot of research has been done for the various material including the composites
    also considering various control parameters such as pulse on / off time, wire
    feed velocity, wire tension, peak current and voltage, but it can be seen from
    the review been done so far that a small study is done on the effect of wire material,
    so thorough studies should be done for finding the significance of it on the machining
    characteristics. It is also being seen that the wire diameter may play an important
    role in the machining characteristics and WWR. This also needs to be studied for
    their significance on MRR, SR and CV. Various other parameters such as filter
    saturation was found to be quiet different as compared to the literature model,
    so a detailed model need to be model for predicting it using materials like aluminium.
    We also see that as assumption of missing mass to be consumed in the form of ions
    has been made. Some research needs to be done to verify this and elaborate it
    thoroughly.


