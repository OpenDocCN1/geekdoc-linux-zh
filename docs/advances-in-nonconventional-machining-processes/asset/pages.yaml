    A Key role in the machining process is performed by abrasive particles in AWJM.
    Abrasive, with high velocity, strikes on to the workpiece resulting in erosion
    of material from the workpiece. This high velocity to the abrasive particle is
    imparted bythe water jet. Due to the nature of AWJM process, it is capable to
    cut almost any material [9]. During machining using AWJM the MRR, surface roughness
    and productivity are related to each other.


    These parameters decide the surface quality and determine the functional performance
    of the resulting product. Geometric accuracy is the major output parameters in
    the AWJM process too.


    By considering about the mechanical properties and conduct, the material of the
    work piece can be characterized into two groups *i.e.* ductile materials and brittle
    materials. Both group of materials have a differ mechanism of machining.


    Mechanism of machining of ductile materials can be classified into two groups
    *i.e.* micro-cutting and plastic deformation as shown in Fig. **(3)** [6].


