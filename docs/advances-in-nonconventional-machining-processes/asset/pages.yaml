    # FUTURE ADVANCEMENTS


    During study of research papers, it was noticed that rotary ultrasonic machining
    was utilised for drilling and surface milling operations in hard and brittle materials
    only. It showed its restrictions in other operations. Even it doesn’t talk about
    other drilling related operations like spot facing, counter boring, milling cum
    drilling combined and tapping also. There may be certain reasons behind this but
    left some area for further research work.


