    # Suneev Anil Bansal


    Suneev Anil Bansal received his Ph.D. degree in mechanical engineering specialising
    in nano/micro manufacturing & materials from Panjab University, Chandigarh. Currently,
    he is working as an Assistant Professor at Maharaja Agrasen University, HP, India.
    He has more than 15 years of experience in industry, research and academia in
    the field of manufacturing, materials development facility planning and product
    development. He has served at various key positions during his career like scientist
    in Defence Research & Development Organisation, India. He played a key role in
    developing new motorcycles at Hero Honda (Now Hero motors), developing and upgrading
    of Russian fighter aircraft at DRDO, developing various departments at LPU, and
    developing various nano/micro manufacturing methods & materials at RIMT & MAU.
    His research interest focuses in the field of 2D materials, graphene, polymer/
    metal composite materials, sensing, nanomaterials, etc. He served as an expert
    for a number of top journals in the field of material science, nanomaterials,
    manufacturing, etc. He received various awards from industry, academia and research
    institutes during his career.'
