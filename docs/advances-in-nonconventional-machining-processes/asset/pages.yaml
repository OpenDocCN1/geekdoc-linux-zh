    into two categories of algorithms such as Classification and Regression. On the
    other hand, unsupervised learning is done to data that is neither labeled nor
    classified. Thus, it is allowing the algorithm to act on that information without
    any guidance. Now, the machine must group unsorted data according to patterns,
    similarities, and differences without any previous training of data. Unlike supervised
    learning, no teacher is present that suggests, no such teaching or training has
    been given to the system or machine. Therefore, the unsupervised based machine
    is constrained to find the hidden arrangement in unlabeled data by itself. Let
    us take an example of both dogs and cats'' pictures, which have not been trained
