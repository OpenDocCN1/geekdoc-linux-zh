- pgno: 27
  md: '# CHAPTER 2

    Tool Electrode Material and Tool Fabrication

    Techniques for Electrical Discharge Machining

    Process


    Arinder Singh Walia^{1,*}, Vineet Srivastava^1, Vivek Jain^1 and Amit Handa^2

    ^1 Mechanical Engineering Department, Thapar Institute of Engineering & Technology,
    Patiala-

    147004, Punjab, India

    ^2 Mechanical Engineering Department, I.K. Gujral Punjab technical University,
    Kapurthala-

    144603, Punjab, India


    Abstract: Electrical discharge machining is an advanced machining process used
    in the

    machining of hard materials and in die manufacturing industry. The main cost

    component in electrical discharge machining is the cost of the tool electrode.
    The

    conventionally used electrode material like copper and graphite has very low wear

    resistance, hence, wear out fast. Continuous efforts are being made to find electrode

    materials which have optimum value of electrical conductivity, thermal conductivity

    and wear resistance. Composites of various combinations of material have been
    tried in

    search of alternative tool materials. The current study presents a review of different

    materials utilized for the manufacturing of composite electrodes for electrical
    discharge

    machining and their fabrication techniques. It has been observed that among the

    different electrode fabrication techniques available, powder metallurgy has shown
    very

    promising results.


    Keywords: Composite, Electrical discharge machining, Electrode wear rate,

    Material removal rate, Powder metallurgy, Rapid prototyping.


    # INTRODUCTION


    In 21st century, products are started to be made from the most durable and

    consequently, the most difficult to machine materials. The continued development
    of

    modern structures needs materials able of combating increasing working

    temperatures, mechanical loads, mechanical distortions and chemical deterioration

    [1]. It is the need of industry to generate complex shapes of components with
    very

    tight tolerances and fine surface finish.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'To meet these requirements, advanced machining processes like ultrasonic machining
    (USM), abrasive jet machining (AJM), electrochemical machining (ECM), electron
    beam machining (EBM), laser beam machining (LBM), electrical discharge machining
    (EDM) have been developed. These methods have very key role in the tool, die,
    aircraft, automobile and mould making industries [2].


    Abrasive water jet machining has higher material removal rate, no thermal stresses
    are produced on the machined surface and is also very cost friendly process. However,
    this process is unable to cut the thick parts and complex profiles. The quality
    of surface produced by this process is also poor [3]. Chemical machining is good
    for the machining of thin parts and requires very less equipment. In this process
    no residual stresses are produced. However, handling and disposal of used chemicals
    enhance the machining cost of this process [4]. The parts produced by laser machining
    suffer the heat effect from laser which causes the brittleness of machined surface
    and leads to surface cracks [5]. In ultrasonic machining the quality of machined
    surface is better than most of other modern machining process. Though, lesser
    material removal rate and cost incompetence are the drawback of this process [6,
    7]. Electro chemical machining is a very precise process for producing complex
    shapes, though, the lower material removal rate and handling of chemical makes
    it unfavorable in some cases.


    Thermolectric energy is very useful in economic machining of low machinability
    materials and jobs with complex geometries. Electrical discharge machining is
    one of the many modern machining processes in which the material is removed by
    the thermal principles [2]. Out of the various advanced machining processes, EDM
    has been widely used to produce surgical components, dies and moulds and finishing
    parts for automotive and aerospace industry. Wire EDM and die sinking EDM are
    often used electric discharge machining techniques.


    # PHYSICS OF EDM


    The die sinking EDM process is shown in Fig. (1). The EDM process can be divided
    into following phases:


    +   • Cold emission of electrons and dielectric breakdown

    +   • Spark formation, melting and evaporation

    +   • Collapse of plasma channel and flushing'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/020b405a9ddccb1e0ee51cb33242cd00_29_0.png)


    # **Cold Emission of Electrons and Dielectric Breakdown**


    A potential difference is supplied between electrically conductive tool electrode
    and work electrode. This potential difference creates an electric field between
    the two electrodes. It depends on the inter electrode gap and dielectric constant
    of the dielectric fluid present in between the two electrodes. The electrically
    conductive materials have enough number of free electrons. As the electric field
    is established, due to presence of electric field, the free electrons will start
    to get plucked from the tool (negative). The electron will be discharged in large
    number. This is called "Cold emission of electrons". In the presence of electric
    field, the electrons will accelerate towards the work as the tool is negative
    and workpiece is positive. The gap between these two electrodes is filled with
    dielectric medium. Due to presence of dielectric, no free path will be available
    for the electrons, hence, they face hindrance. The moving electrons will collide
    with the dielectric particles. The energy of the electrons will ionize the dielectric
    molecules. This will result in more ions as well as more electrons.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Spark Formation, Melting and Evaporation


    The electrons produced in primary collision will accelerate again. It will result
    in secondary and tertiary collisions and so on. This will cause the release of
    a large number of ions and electrons in the gap between tool and workpiece. It
    will cause the formation of "plasma channel" which is state of matter contains
    electrons and ions. Once the plasma channel is formed, the resistance to the flow
    of electrons will decrease. The electrons will start to move from tool to workpiece
    at a very rapid pace and will strike the workpiece. At this time a spark can be
    seen. Due to this reason the EDM process is also called spark erosion process.
    The workpiece will continuously get strike by the electrons. The moving electrons
    have very high kinetic energy. On strike, this kinetic energy will get converted
    into heat energy. This will result in high temperature at the workpiece in the
    range of 8000-20000 °C [9]. The high temperature will cause localized melting
    and vaporization of material.


    # Collapse of Plasma Channel and Flushing


    As soon as the supply of pulsating direct current is stopped, a pressure or shock
    wave will be created. This shock wave will break plasma channel thus allowing
    the circulating dielectric fluid to implode the plasma channel and flush the molten
    material from the electrode surfaces in the form of microscopic debris. A crater
    will be formed at the site. The repeated electrical discharges of very high temperature
    will remove the material and the desired cavity of tool shape will be formed.


    # THEORIES OF METAL REMOVAL


    Depending on the experimental observations, three different kinds of material
    removal mechanism have been suggested [10]:


    # High Pressure Theory


    According to this theory, as the electrodynamic waves suddenly gets stopped, enormous
    impulsive force is generated at the electrode. This force is responsible for the
    erosion of electrodes. The pressure in the discharge column is reported to be
    lying in the range of 10-100 kgf/cm². It is found that the time period for which
    pressure acts is more than discharge periods. It was concluded that at small discharges,
    the discharge pressure alone would not be enough to erode the material from electrode.
    However, unification of some other factors, such as heat, the pressure might remove
    molten metal from the electrode surface.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# **Static Field Theory**


    Coulomb''s law state that there is presence of electrostatic force between two
    charged electrodes. The force will result in stress on the electrodes. If the
    gap between the electrodes is small, this force may exceed the ultimate stress
    limit of electrode material and result in tensile failure. In case of discharge
    durations lesser than 2 \u03bcs, the forces involved in tensile rupture erosion
    generate due to very high current densities underneath the surface of the anode
    create a strong electric field gradient. As the force exceeds the tensile strength
    of material, a tensile fracture follows thus eroding one or more particles from
    the electrode. But in case of discharge duration more than a few microseconds,
    it is observed that tensile rupture theory is not able to describe the removal
    of material from electrode.


    # **High Temperature Theory**


    This theory suggests that as the high energy electron strikes the electrode surface,
    the temperature raises, particularly in case of materials with low thermal conductivity.
    The high temperature generated at the electrode surface immediately melts and
    vaporizes the material thus forming a crater. The ratio between the energy consumed
    at anode and total discharge energy are linked to several parameters like inter
    electrode gap, cathode and work function of both electrodes etc. It is also found
    that the high temperature is not produced by the striking of electrons alone.
    The joule heating effect generated due to high density current is also a contributing
    factor.


    # **TOOL ELECTRODE MATERIALS**


    In EDM process, during machining, along with material removal, the wear of tool
    electrode is an unavoidable phenomenon. In industries, like mould and die manufacturing,
    the design, development and fabrication of tool takes 25-45% of the tool room
    lead time [11]. In majority of EDM operations, the tool cost is more than 70%
    of the total operation cost [12]. This signifies the need of suitable material
    selection for the tool. There is a perception in metal working to use right tool
    for the job. Choosing the correct tool material for a certain machining operation
    is the beginning step for generating the most productive process plan for manufacturing
    a part. The selection of cutting tool material depends on the work material and
    the operation to be performed. Often, there are possible choices of tool materials
    that will produce the parts successfully but not cost-effectively [13].


    In conventional machining, the selection of cutting tool material depends on the
    work material and the operation to be performed. However, in case of EDM, the
    most important requirement of a tool is its electrical conductivity. The higher
    electrical conductivity of tool material will help to easy emission of electron'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'during cold emission. Another requirement of EDM tool is that it should have
    high thermal conductivity so as to dissipate the heat. This will be very helpful
    to reduce the surface temperature of tool to avoid melting and evaporation of
    tool material. The higher density of tool material is also an advantage as for
    the same available heat and same amount of weight loss there will be lesser volumetric
    material removal from the tool, hence, lesser dimensional losses. The higher melting
    point of tool material also results in low tool wear as there is lesser material
    melting for the same amount of available heat. Apart from all the above-mentioned
    requirements the easy manufacturability of the tool material is also very important
    as it constitutes a major part of tool cost.


    The most commonly used tool materials are metallic (copper, brass, tungsten, aluminium
    *etc.*), non-metallic (graphite) and composites (copper tungsten, copper silicon
    carbide, copper boron carbide, copper graphite) *etc*. Copper is the most widely
    used tool material owing to its high electrical and thermal conductivity. Though,
    in machining of difficult to machine materials, it has been seen that the copper
    tool erodes faster [14]. Low melting point of copper enhances wear rate of electrode
    that leads to variation in shape of tool. In EDM, workpiece is replica of tool
    profile. Accuracy of the machined cavity depends on the shape stability of the
    tool. Therefore, any change in the shape of tool may obtain a product that is
    different in shape and size than the desired one [15]. To decrease electrode wear,
    one of the approaches proposed by the past researchers is the fabrication of modified
    tool having improved mechanical, electrical and thermal properties [16 - 18].
    The strength of copper can be increased by alloying materials like Cr and Zr but
    these elements lose these properties by dissolving in copper at high temperature
    [19]. To avoid this problem, the copper matrix composites are made by the addition
    of oxide, carbide and the addition of ceramic particles in the copper [20 - 22].
    When high electrical and thermal conductivity along with high wear resistance
    is required Cu matrix composites are good choice [23]. Materials with high melting
    point and wear resistance characteristics, with good electrical and thermal conductivity
    are utilized to decrease the electrode wear of copper-based electrodes. Addition
    of ceramic reinforcements like carbides, improves the characteristics such as
    wear resistance and high temperature stability. The inclusion of materials such
    as graphite to copper matrix decreases the strength of the composites. The strength
    of the composites can be enhanced by the addition of ceramic reinforcement materials
    like silicon carbide (SiC). It increases the strength of composites, but, the
    electrical resistivity also increases. The composite made from SiC and Cu has
    the better ductility and toughness of Cu, as well as high strength of SiC reinforcements
    [24]. The addition of titanium Carbide (TiC) to copper improves its strength but
    it also slightly reduces the electrical conductivity of copper. TiC is hard material
    and it has very high melting temperature along with excellent thermal shock and
    abrasion resistance properties'
  merge: -1
  img_proc: true
- pgno: 33
  md: '[17, 25]. Often, there are possible choices of tool materials that will produce
    the parts successfully but not cost-effectively.


    The electrode material must have high melting temperature and low electrical resistivity.
    The success of electrode material depends primarily upon the material being machined
    and on the distinct cutting application [26]. Commonly used materials for the
    EDM tool electrode are copper, brass, graphite, tungsten, silver and steel. High
    tool wear is leading concern of these types of electrodes. Continuous efforts
    are being carried on for developing a tool material for EDM process having low
    electrical and thermal resistance, high wear resistance and easy availability
    and fabricability [27]. Current trends in research of ceramic materials are shifting
    from single material to multi material electrodes. Tool properties like wear resistance,
    fracture toughness, hardness and thermal shock resistance have been improved significantly
    by the addition of one or more materials into the base material to form composite
    tool materials [28].


    Ozgedik and Cogan [12] investigated the edge and front wear of tool during EDM
    of 1040 steel with copper electrode. An increase in inner and outer end wear of
    tool was observed with the rise in discharge current. Increase in TWR with increment
    in pulse duration was also recorded. In static flushing there was inappropriate
    flushing of the molten metal resulting in lowest material removal rate. Injection
    flushing produced the best surface quality.


    Gerlc [13] made an investigation on the addition of cutting tool materials with
    alumina matrix. Their composition, strengthening and toughening mechanism was
    also examined. Mechanical properties of Al₂O₃ matrix were enhanced with the use
    of hard particles or whiskers. Decrease in brittleness was noticed with the addition
    of carbide, oxide and nitride in alumina matrix. The addition of TiB to alumina
    enhanced the wear resistance of the composite. The addition of yttria stabilized
    zirconia increase the wear resistance, however, microhardness of the composite
    decreased.


    Srivastava and Pandey [18] tested the working of sintered Cu-TiC and conventional
    copper tool electrode in ultrasonic assisted cryogenically cooled EDM. EWR increased
    with the rise in current, however, it was lower for cermet tooltip in comparison
    with copper tooltip. With the increase of duty cycle there was more spark energy
    eventually resulted into higher EWR. Cermet electrode tip decreased out of roundness
    in comparison to copper tooltip. Increased MRR and surface roughness was also
    recorded with cermet tooltip. The surface crack density and crack width were found
    to be lesser on the surface machined with Cu-TiC tooltip.


