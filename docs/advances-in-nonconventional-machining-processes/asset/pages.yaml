    facie, the Taguchi method was used to optimize processes parameters that revealed
    a set of various processes parameters required to obtain desired results [17].
    Tamananee et al. contemplated the erosion rate in AWJM. A powder filled thermoplastic
    olefin was used in machining. From that point, the erosion rate estimations were
    utilized to create machining configurations to expand the slope of bounding sidewalls
    [18]. Al-MMCs were also studied to machine with the AWJM process. The Focus of
    the study was to improve kerf properties [19]. Ti-6Al-4V was also attempted to
    be machined using AWJM.. Optimizations were also used like Taguchi and ANOVA analysis.
    A set of experiments were performed to optimize the variable input and to reach
