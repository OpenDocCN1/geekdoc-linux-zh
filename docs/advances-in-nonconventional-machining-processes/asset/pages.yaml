  md: "major future scope in this field. There is need to investigate the formation\
    \ of secondary layers which are conductive in nature with the help of some advanced\
    \ FEM techniques.\n\n# CONCLUSION\n\nApplications based on composites fabricated\
    \ by CMs have become important part of our modern lifestyle. In this article,\
    \ EDM process and its role in machining of composite made up of CMs and tungsten\
    \ carbide has been reviewed. It is concluded from the above extensive review that\
    \ EDM process is capable of machining CMs like TiN, SiC and TiB₂, which are highly\
    \ electrically conductive in nature. It is also observed that various machining\
    \ parameters like spark intensity and current effect the performance of the machining\
    \ of the workpiece. As these parameters get increased, there is also a significant\
    \ increase in the MRR and surface roughness. The result of pulse time is studied\
    \ with respect to MRR. MRR and surface roughness decreases with increase in pulse\
    \ time and thus increasing the instability of the machining of materials.\n\n\
    Along with this, effect on characteristics of EDM machined surfaces by different\
    \ process parameters has also been observed and some studies have also been discussed\
