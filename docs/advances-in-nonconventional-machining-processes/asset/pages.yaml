  md: 'blasting [25].


    +   - It has been found that the micro machining in occurs almost minimal cost
    as compared to conventional machining methods and also the abrasives can be recycled
    [26].


    Despite all these advantages some drawbacks are seen like the tapered geometry
    formation while machining a groove of long depth [28], micro crack formation on
    a substantial brittle material, MRR is not stable in micro machining as fine particles
    with stable flow rate is not attained [27], rate of production in micro application
    is also substantially low and some critical noise levels above 105db are also
    observed [21].


    # Surface Texturing and Aspects for Tribology


    Costa *et al.* found that surface texturing is a method of creating a uniform
    micro texture consisting of sharp impressions with controlled geometry [29]. It
    was found by various studies that the micro texturing gained its value as the
    world started to move towards advancements in electronics. It was noted that the
    boundary between the normal AJM and micro AJM was the orifice design criteria
    in shape of its opening diameter. Various studies performed show that that concise
    the resolution of the channel homogeneity, up to 5% for a path of 100µm using
    23µm size abrasive particles and, limited it by the size the mask and the wear
    found at the edges [30]. It has also been summarized from the studies that the
    major factors limiting this are the mask material used, the fine particles size
    of as low as 3µm leading to its consistent flow problem along with low kinetic
    energy for impact and the least crack length in the workplace material.


    After attaining the capability of surface texturing, it has found its path in
    tribology also as shown in this section. It has been seen that in medical field
    a large amount of knee and hip operations and replacement have taken place all
    over the world. With time 80% of these have reported wear and tear within some
    year of use [31]. This is somewhat relating to the surface integrity and the hardness
    of the material being used. Out of all the sliding pair developed for artificial
    joint the most successful is the combination of metal to polyethylene having a
    90% success rate with life of 15 years. Further studies signify the wear and tear
    due to surface imperfections, cracks, burrs *etc*. which leads to less joint life.
    It is being stated that there should be an artificial joint enhancement that leads
    to the collection of all the particles being produced due to wear and tear while
    usage and at the same time provide lubrication for its smooth functioning thus
    increasing it serving life up to 30 years. Such minor pores, for the collection
    of debris and lubrication, were difficult to machine by conventional machining
    methods, so, AJM has been found useful in drilling these holes. A technique to
    polish Cobalt-Chromiu-'
