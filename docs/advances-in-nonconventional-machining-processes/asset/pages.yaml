  md: '# INTRODUCTION


    In the modern world, due to technological advancements, the needs of industry
    are continuously changing. Latest and advanced materials, along with their machining,
    are the requirement of the manufacturing sector. Research is a continuous process
    and it’s the demand/necessity of growing industries. Truly speaking, change for
    better is necessary. In earlier days machining of hard and brittle material was
    a tough job for engineers and was a challenge for the research and design team
    as well. Conventional machining was used for many years. Newer processes of machining
    were developed and named as modern machining methods/non-conventional machining.
    Recent development of these processes opened the way of machining hard and brittle
    materials. In conventional machining processes, there is direct contact between
    tool and workpiece and material removed in form of chips i.e. At macroscopic level,
    whereas in non-conventional machining there is no direct contact between the tool
    and work piece. In this, the material is removed at microscopic level (dust/powder
    form). In conventional machining, due to physical contact tools, wear rate is
    high as compared to non-conventional machining. The increasing utility of hard
    and brittle materials in recent times has forced the researchers to develop new
    and advanced machining processes. The materials, difficult to machine through
    the conventional machining, are machined by unconventional machining processes.
    The main idea behind the development of newer methods was the replacement of conventional
    machining methods by more efficient, quicker methods which could achieve accuracies
    in machining. Ultrasonic machining is one such development in the field of non-conventional
    methods. In this process, slurry of small abrasive particles is forced against
    the work by an axially vibrating tool, removing the workpiece material in the
    form of small particles. The abrasive grain particles may be of silicon carbide,
    boron carbide and diamond dust. To facilitate/provide high precision machining,
    when vibration is introduced in a tool workpiece or working medium then it is
    called vibration assisted machining [13]. In vibration assisted turning, cutting
    forces reduced up to 40% as compared to conventional machining, hence improving
    tool life. Less stress are induced in work and quality of machined surface is
    improved [15]. Rotary ultrasonic machining is one of the latest processes which
    are used in industries to overcome the limitations of ultrasonic machining. Higher
    metal removal rate is observed during drilling operation through rotary ultrasonic
    machining as compared to ultrasonic machining alone [23].


    # LITERATURE REVIEW


    Kumar and Khamba evaluated the machining performance of ultrasonic machining on
    titanium-based workpiece. The investigation was carried out for'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'material removal rate, tool wear rate and to know the surface roughness of
    the workpiece. Taguchi''s method was adopted for performing several experiments,
    the data was analysed by using ANOVA and optimised parameters were selected which
    can enhance the performance of ultrasonic machining [1].


    B. Lauwers \textit{et al.} investigated the material removal rate, surface quality,
    surface cracks in ultrasonic assisted grinding of \textit{ZrO}\textsubscript{2}.
    The paper showed that cutting forces and tool wear were reduced under the influence
    of vibration during machining. Hence productivity increased [2].


    Cong \textit{et al.} presented the method of measuring vibration amplitude during
    rotary ultrasonic machining. In this paper, it was concluded that vibration amplitude
    varies for different conditions. When the dial indicator method was used for measuring
    vibration amplitude and compared with the novel method, results were the same.
    But when it was checked with or without rotary ultrasonic machining, using tools
    with different specifications, results were different [3].


    Heise \textit{et al.} investigated the ultrasonic assisted drilling operation
    on granite and stone, which is a hybrid machining process. The cutting forces
    and torques was reduced up to 20\% when the ultrasonic process applied. That could
    be achieved by using robots instead of machining centres [4].


    Kei-Lin and Chung-Chen presented the paper on rotary ultrasonic machining, in
    which glass was utilised for milling operation. The efficiency of operation was
    evaluated based on surface roughness parameter. It was seen that the surface quality
    of ultrasonic milling was very poor as compared to non-ultrasonic milling [5].


    Liu \textit{et al.} developed a model for cutting forces during rotary ultrasonic
    machining. Cutting forces play a very important role during machining of brittle
    material. A relation between cutting force and input variables like spindle speed,
    feed rate, amplitude of ultrasonic vibration and abrasive grain particles was
    developed based on the cutting forces model. The various assumptions were made
    during research analysis like abrasive particles'' shape and its material. Diamond
    abrasive particles, of octahedron shape, were utilized. The developed model gave
    information for cutting forces \textit{i.e.} forces increased as input variables
    parameters increased and decreased as input variable parameters decreased [6].


    Rashheed compared the results of micro-holes produced by micro-EDM and laser beam
    machining. The machining parameters like material removal rate, taper in hole,
    entrance and exit diameters of produced holes, concentricity of the produced holes
    was compared. It was concluded that when surface quality of the workpiece is not
    so important then for high material removal rate, laser beam machining can'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'be utilised. If surface quality is needed, then micro-EDM can be used but material
    removal rate will be reduced. So, a hybrid process can be made to take the advantages
    of both processes [7].


    Das et al. investigated the surface roughness of hexagonal shaped hole and material
    removal rate in Zir-Conia bio-ceramic material after ultrasonic machining. With
    control parameters, optimised results were obtained by utilising genetic algorithm
    technique. In the conducted experiment, with optimised parameters, material removal
    rate of and surface roughness of 0.2365g/min and 0.58-micron meter were obtained
    respectively [8].


    Lian et al. performed several experiments to analyse the surface roughness of
    A16061 material by micro-milling with or without the assistance of ultrasonic
    vibrations. It was observed that better surface finish was obtained in A16061
    with ultrasonic vibration assisted machining. Better results were obtained when
    appropriate ultrasonic vibration amplitude was selected [9].


    Cong et al. provided an explanation about surface roughness of hole, in ultrasonic
    machining, at entrance and exit. The paper considered hypotheses and their testing.
    The experiment was performed on a stainless-steel workpiece. It concluded that
    the reason for the difference of surface roughness at entrance and exit of the
    workpiece depends upon the abrasive bonded part of the tool movement in the workpiece
    through the entire length [10].


    Selvukumar and Arulshri carried out the work to optimise the fixture layout using
    genetic algorithm and combination of genetic algorithm and artificial neural network
    approaches. The purpose of investigation was to reduce the deformation of the
    workpiece after clamping on fixture and machining force during operation. Finally,
