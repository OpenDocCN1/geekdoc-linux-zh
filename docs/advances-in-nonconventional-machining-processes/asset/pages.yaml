  md: '# CHAPTER 4


    # AWJM Process- A Review


    Manta ^*,†^, Sachin Mohal^‡^, Saurabh Chaitanya^§^ and Ankithmani Tripathi^¶^

    † Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Solan,
    India

    ‡ Department of Mechanical Engineering, Chandigarh Engineering College, Landran,
    Mohali, India

    § Mechanical Engineering Department, SRM University Delhi NCR Haryana, India


    **Abstract:** Abrasive water jet machining (AWJM), non-conventional machining
    (NCM), has been improved radically, in terms of quality and reliability. AWJM
    is a widely used NCM process broadly established in technical application areas
    of machining tools, parts, microstructures or intricate products like Titanium
    Alloy, Alloy steel *etc.* It has become entrenched in every single significant
    region of theoretical researches and across the broad spectrum of applications.
    Applications include medical apparatuses, precision parts, efficient material,
    smart automotive manufacturing, aerospace equipment, renewable energy science
    *etc.* This paper audits the verifiable, most recent research improvements, incorporated
    uses of AWJM system and execution. The examination encourages the high assembling
    accuracy and balanced out execution quality with more noteworthy productivity.
    The benefits of AWJM incorporates the capacity to cut convoluted materials, difficult
    to cut surfaces, high flexibility, little cutting powers and ecologically safe.
    Additionally, the AWJM system''s limitations are highlighted too. AWJM is one
    of the exceptionally advanced system that have significant potential for micromachining.


    **Keywords:** Abrasive water jet, Machining, Materials.


    # INTRODUCTION


    A fast turn of events, in designing and innovation, needs exceptionally exact
    and profoundly preécised items. Surface properties play a significant role in
    creating products for automotive, aviation and biomedical applications. A little
    scratch or burr may cause huge misfortune, for example, midway engine failure,
    aviation catastrophe and so on. Industries are endeavoring hard and spending gigantic
    sum on completing of these, without harming surface property. It is a difficult
    task machine hard and tough material without changing its surface quality and
    surface property. In NCM, the heat is generated during machining which may prompt
    sur-'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'face deformities [1]. Along these lines, by choosing the suitable machining
    process, we can give better surface quality. In this specific situation, a water
    jet can be used to machine the hard and tough materials without the generation
    of any heat. This mix *i.e.* water and abrasive, called as water jet machining
    (WJM), is a NCM procedure where high speed stream of water is utilized to erode
    materials from the outside of the work piece. WJM can likewise be utilized to
    cut soft materials like plastic, elastic or wood. Be that as it may, to cut more
    hard materials like metals or rock, an abrasive material is blended in the water.
    At the point when an abrasive material is utilized, in water for the machining
    procedure, it is called as AWJM. It works on water erosion. At the point when
    the stream of water with high speed strikes the surface, the expulsion of material
    happens. Dr. Norman C. Franz started the advanced WJM innovation in 1968, which
    was granted the principal patent for a creative high-pressure WJM framework and
    in 1971 the main business water jet cutting was created to cut the overlaid paper
    tubes. In 1980, Dr. Hashish understood the way toward adding abrasives to plain
    WJM and from that point AWJM was invented, to cut such mechanical materials, for
    example, steel, glass, and cement [2, 3].


    In the WJM process, a high speed water jet is made to strike the work piece. Pressure
    force applied on the water, at the end of the nozzle, converted into high velocity.
    Later on, to cut the material of high quality and to cut hard materials, abrasives
    are added to high velocity water jet. Several advantages are associated with WJM
    and cost structure is less too. This innovation is the rapidly developing and
    flexible. Poisonous exhaust, recast layers, slag and residual stresses can be
    easily eliminated. Cutting powers are less in AWJM and there is no heat influencing
    zone close in the vicinity of cutting zone as present in NCM. In this way, it
    has been demonstrated by that the materials which cannot be machined easily by
    NCM can be effectively machined by WJM, for example, cutting slots in glass, stone,
    and metals, fast boring of opening in titanium *etc*. can be effortlessly machined
    by WJM [4].


    (Fig. 1) presents a schematic image of AWJM components. The significant segments
    of the AWJM process are high pressure liquid pump (HPLP), high pressure pump,
    computerized control system, head for machining and catcher. The HPLP is utilized
    for providing for ultrahigh pressure, consistently. The system comprises of two
    tanks that cater to the requirement of cutting material and water.The Whole system
    is equipped with a filtration mechanism that can filter out larger particles.
    Large particle in the system can choke the working of the whole system [6].'
