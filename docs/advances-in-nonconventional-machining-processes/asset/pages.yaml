    # Wire Electric Discharge Grinding


    In order to produce cylindrical micro-parts, machining process like wire electric
    discharge grinding (WEDG) is preferred [14]. In WEDG process, micro rotary parts
    such as rods and pins are machined with high precision [15]. However, the WEDG
    process can fabricate micro rotational parts with curved contour profile precisely
    ; the machining efficiency is very limited. Besides, this technology depends on
    an expensive and dedicated micro EDM machine, which restricts the popularization
    of the technology in common industries [16].


    # Micro Wire Electro Discharge Grinding


    In micro-WEDG the uses of the grinding wheel are replaced with micro wire which
    acts as an electrode. When fine rod needs to be ground, it acts as a workpiece
    and allowed to be rotated while the electrode (micro wire) is held stationar y.
    This process utilizes the electrical sparks or thermal energy produced to remove
    the unwanted materials from the workpiece in order to make the desired shape [17].
    However, wire breakage control is most critical aspect of micro-WEDM process from
    technical and economic grounds.


    # Wire Electric Discharge Turning


    Wire electrical discharge turning (WEDT) process is one of the emerging non-traditional
    machining processes for the manufacture of micro- and axi-symmetric components
    [18]. In WEDT and WEDG, the erosion mechanism is similar to that of the WEDM process
    with a difference that in WEDG the workpiece is fed in longitudinal direction
    rather than in horizontally as in WEDT. Moreover, the characteristics of process
    variants of the WEDG and WEDT process are in the relative motion between the tool
    and workpiece electrodes and the feed.


    # Abrasive WEDM (AWEDM)


    In this process, electrical sparks along-with abrasives abrade the workpiece surface.
    Higher material removal rate and better surface finish can be accomplished by
    integrating WEDM with abrasives of fine size.


    # DEVELOPMENTS IN WEDM OF TITANIUM BASED ALLOYS


    Srinivasan and Palani [19] examined the silicon nitride-titanium nitride (Si3N4-
    TiN) ceramic composite to characterize its surface integrity and fatigue'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'performance in WEDM. Different types of defects, such as micro-cracks, micro-poles,
    globules, droplets and surface craters, were found during SEM on the WEDM surface
    of the ceramic composite. Moreover, the fatigue life of Wire EDM cut surface decreased
    by 25-35% than that of polished surface. Also, the hardness of the polished surface
    was much better than of the machined surface.


    Takale and Chougle [20] mentioned that Ti49.4Ni50.6 shape memory alloy have low
    young’s modulus which makes it excellent for novel orthopedic implants. However,
    Ti-Ni yielded poor surface quality and low dimensional accuracy when it was machined
    with conventional methods. Therefore, WEDM can be an alternative to achieve high
    dimensional accuracy for machining Ti-Ni memory alloy. MRR and SR of Ti-Ni alloy
    were investigated for varying input parameter of WEDM. The input parameter selected
    were pulse on time, pulse off time, spark gap set voltage, wire feed and wire
    tension. GRA was employed for multi objective optimization. To study metallurgical
    changes on the machined surfaces, EDS analysis was performed.


    Singh and Misra [21] investigated nimonic 263 in WEDM under varying input variables.
    The design of the experiment was based on Box-Behnken design technique while parametric
    optimization for surface roughness was performed using response surface methodology.
    Results from BPNN showed that BPNN was a valuable tool for the prediction of responses.
    It was identified in FE-SEM that WEDMed surface contained micro-cracks, craters,
    spherical droplets and lumps of debrits.


    Pramanik and Basak [22] presented the effect of input parameters on the fatigue
    life, crack propagation, surface roughness and machining during wire EDM of Ti-6Al-4V
    alloy. Machining parameters, pulse on time, pulse off time and wire tension were
    considered and influence of these on surface integrity were observed using SEM.
    The chief contributors observed for fatigue performance were nature and extent
    of recast layer and HAZ.


    Kavimani et al. [23] used Taguchi coupled grey relation analysis to investigate
    the WEDM cutting parameters on metal matrix composite of magnesium reinforced
    with reduced graphene oxide. L27 orthogonal array was applied to design the experiments
    and results were confirmed with the application of ANOVA. It was determined that
    reinforcement weight percentage and pulse on time were the most influential parameters
    among other input parameters such as pulse off time and wire feed rate for MRR
    and SR.


    Chu et al. [24] discussed about a new feasible low frequency vibration assisted
    technique for generating microgroove on metal plates for high speed WEDM. The
    ridge width was significantly affected by the average current, vibration frequency'
