    # Use of Cryogenic in AJM


    It has been discussed earlier that the softer metals cannot be easily machined
    having precise dimension using abrasive in AJM. Due to the small abrasives having
    high kinetic energy and high velocity penetrate the surface especially when hitting
    normal to the surface. Thus, it is found that a large amount of material cannot
    be machined having ductile or soft material properties by the same principle as
    of brittle or hard material erosion is carried out. Thus, to work on such materials
    cryogenics has been introduced so that the material removal mechanism can somehow
    be changed. AA5083-H32 aluminium alloy was machined using the both AAJM and cryogenic
    assisted AJM. A comparison study was carried out for the surface integrity [16].
    In this study they used liquid nitrogen at -195°C and supplied it to the machining
    zone in compressed air. This led to the change in the hardness to a very high
    amount thus reducing the number'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'of abrasives embedded in the material auring erosion. It was accompanied by
    the crest and troughs profile having continuous roughness. The liquid Nitrogen
    used also produced the strain properties and thus hardening the material being
    machined as an effect of grain refinement accompanying with increased micro hardness
    up to two times. Some other studies were also carried out that used a heat exchanger
    accompanied with liquid nitrogen for cooling the air stream other than the material
    to be machined [17, 18]. A L N2 type of heat exchanger having tubular shape carrying
    high and low heat thermal conductivity inside and outside respectively were used.
    The abrasives were directed to flow to the material at a temperature of -80°C
    jet condition. The temperature was thus varied from -80°C to 180°C. A change was
    observed when the jet temperature reached -180°C as the erosion principle changed
    to brittle one.


    It was also accompanied in this study that the incidence angle of 30° to 60° was
    found to be best for maximum MRR. This study found that the erosion of softer
    materials can also be obtained at -180°C. To obtain more precise machining of
    such material with brittle removal mechanism at lower temperature can also be
    taken into account. It also had some disadvantages accompanied as the liquid nitrogen
    was being used that in its own means the sources and energy consumption on a very
    large scale, also such high cooling leads to crack formation due to the thermal
    strain in the material. But it was also found this also leads to the surface weakening
    which also helps in the subsequent erosion of the material.


    # **Thermally Enhanced AJM**


    *Patel et al.* [19] found that there were some materials like Inconel 718 and
    Titanium (Ti6Al4V) that were not easily machinable; such materials were needed
    to have low hardness so that the abrasives can penetrate the surface thus causing
    the erosion to take place. For this there was some thermal assistance provided
    by heating the workpiece up to a temperature of 850°C by using an oxy Acetylene
    gas flame, thus resulting in lower hardness on the surface and increased MRR using
    abrasive water jet machining. Though there was a drastic change in the temperature
    during the process, but no stresses and crack were discovered in the machined
    part.


    # **Effect of Various Jet Conditions**


    # *Intermittent Jet Conditions*


    It was found that when a larger grooves or cavities were made then there was an
    abrasive settling tendency at the bottom of such features thus preventing the
    upoming new abrasive particles to reach the bottom hidden by such abrasives'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'thereby subsequently lowering the MRR. This problem of particle accumulation
    was solved by creating an intermittent pattern of blocking the abrasive flow and
    passing a high velocity pressurized jet for that duration. This was achieved by
    installing a 100 Hz Solenoid valve which helped in creating this alternate pattern
    of abrasive and high pressure jet of air [20]. This helped in removing the accumulated
    abrasives at the bottom. It was found in the research that for a sample shot study
    of 500, the hole depth was increased from 440μm to 740 μm with an open/closing
    time of 10/40 milli seconds.


    # Submerged Jet Conditions


    With the advancement of the AJM, large amount of technical and economical advantages
    came, however its environmental aspects also came into effect like noise created
    during the process. To look into this aspect a submerged AWJM was taken into consideration
    [21]. This somehow resulted in the lowering of the kinetic energy of the particles
    before reaching the machining surface. This also resulted in the reduction in
    the drag force on the jet thus leading to less diffraction of the jet along the
    diameter of nozzle [22]. This also gave the idea of having less dust in the environment
    during the machining as was seen in the conventional methods thereby leading to
    some medical effects like lungs damage. It was found that a reduction of up to
    61% was obtained when using the glycerin as liquid for submerging accompanied
    with 42% with liquid polymer and 36% with water [23]. There was a considerable
    increase in the nozzle life when the liquid was mixed with abrasive slurry and
    only jet of high velocity was directed on to the workpiece. The only drawback
    was the substantially low velocity of the particle.


    # APPLICATIONS


    Abrasive jet machining has found a lot of its applications with some advantages
    accompanied with some drawbacks. This section discusses about some of those advantages
    and also some drawbacks of it. its application in the areas like tribology is
    analyzed. Some merits are enlisted blow:


    The study shows the advancement of the AJM from macro to Micro scale thus giving
    it a boundless application in various areas and industry. Also, its large application
    has been seen to machine


    +   - It has found not only its technical aspects but also its environmental aspects
    that could lead to better machining ability and environment possibilities thus
    leading to the better process flexibility.

    +   - There has been a lot of improvements in the surface properties like grain
    refinement, hardening of the material as an effect of plastic deformation during'
