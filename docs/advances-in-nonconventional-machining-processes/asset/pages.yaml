    # # FABRICATION OF ELECTRODES USING ALTERNATE APPROACHES


    The physical properties of electrode influence the machining performance. High
    electrical conductivity, high specific heat, good machinability, high erosion
    resistance etc. are the properties which an ideal electrode must possess. A single
    material cannot fulfill all these requirements. Traditional machining methods
    are mostly used for fabricating the electrodes for EDM [38]. Complexity of the
    geometry and the precision required commonly determines the manufacturing cost
    of the electrodes. The uniform dimension electrodes are cheaper and easy to produce
    but a complex shape electrode made by traditional machining process may cost 100
    times than a simple shape electrode [39]. For the fabrication of complicate three-dimensional
    shape electrodes, different methods like conventional machining, electro-forming,
    metal spraying, casting, rapid'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'prototyping or powder metallurgy are used [17, 40]. These techniques can also
    be helpful to reduce the lead time. A review of research attempts to fabricate
    the tool for EDM is presented below.


    Samuel and Philip [16] carried out experimental work and observed that with P/M
    method tool electrodes can be fabricated with ease and its properties can be controlled
    rather easily, consequently gave it an edge over other electrode fabrication methods.
    The effect of compaction pressure on relative density and on green strength is
    shown in Figs. (7a and b). At low sintering temperature and compacting pressure
    gap contamination was more and higher electrode wear was observed. Low metal removal
    at low current and high frequency was noticed due to surface properties of powder
    metallurgy electrodes. Low compact pressure and sintering temperature resulted
    in poor mechanical strength and high tool wear.


    # (a)


    # (b)


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_40_0.png)


    ![](img/020b405a9ddccb1e0ee51cb33242cd00_40_1.png)


    Fig. (7). Influence of compaction pressure on (a) Relative density (b) Green strength
    [16].


    Samuel and Philip [39] during the study used copper (Cu) powder with 99.7% purity
    as tool material and fabricated the tool using powder metallurgy (P/M) process.
    Increase in conductivity was found with the rise in sintering temperature and
    compacting pressure. The electrode compacted at low process had low mechanical
    strength. High sintering temperature increased the bond strength and decreases
    erosion. Thus, the increase in compacting pressure and sintering temperature resulted
    in change in electrical, thermal, mechanical and microstructural properties resulting
    better performance.


    Dimla et al. [40] applied stereolithography and direct metal laser sintering for
    the coating of models to fabricate the tool for EDM process. The quantity of copper
    deposited on models by both methods created problems. The used processes were'
