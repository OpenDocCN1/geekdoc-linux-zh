  md: '# Chapter 5: Writing the Commands Rules


    make will not echo the first line, the echo command. But it will echo the following
    two command lines.


    On the other hand, prefix characters on the command line that refers to a sensed
    sequence apply to every line in the sequence. So the rule:


    ```

    frob.out: frob.in

    @$(frobicate)

    ```


    does not echo any commands. (See Section 5.1 [Command Echoing], page 41, for a
    full explanation of ''@'').


    # 5.8 Using Empty Commands


    It is sometimes useful to define commands which do nothing. This is done simply
    by giving a command that consists of nothing but whitespace. For example:


    ```

    target:;

    ```


    defines an empty command string for ''target''. You could also use a line beginning
    with a tab character to define an empty command string, but this would be confusing
    because such a line looks empty.


    You may be wondering why you would want to define a command string that does nothing.
    The only reason this is useful is to prevent a target from getting implicit commands
    (from implicit rules or the .DEFAULT special targetget; see Chapter 10 [Implicit
    Rules], page 101 and see Section 10.6 [Defining Last-Resort Default Rules], page
    116).


    You may be inclined to define empty command strings for targets that are not actual
    files, but only exist so that their prerequisites can be remade. However, this
    is not the best way to do that, because the prerequisites may not be remade properly
    if the target file actually does exist. See Section 4.4 [Phony Targets], page
    27, for a better way to do this.'
