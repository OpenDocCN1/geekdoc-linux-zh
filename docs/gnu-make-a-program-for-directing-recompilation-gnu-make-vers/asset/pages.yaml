  md: 'Don''t make the primary documentation for any GNU software be a man page. Write
    a manual in Texinfo instead. Man pages are just for the sake of people running
    GNU software on Unix, which is a secondary application only.


    ''manext'' The file extension for the installed man page. This should contain
    a period followed by the appropriate digit; it should normally be ‘1''.


    ''man1ext'' The file extension for installed section 1 man pages.


    ''man2ext'' The file extension for installed section 2 man pages.


    … Use these names instead of ‘manext’ if the package needs to install pages in
    more than one section of the manual.


    And finally, you should set the following variable:


    ''srcdir'' The directory for the sources being compiled. The value of this variable
    is normally inserted by the configure shell script. (If you are using Autoconf,
    use ‘srcdir = @srcdir@’).


    For example:


    ```

    # Common prefix for installation directories.

    # NOTE: This directory must exist when you start the install.

    prefix = /usr/local

    exec_prefix = $(prefix)

    # Where to put the executable for the command ''gcc''.

    bindir = $(exec_prefix)/bin

    # Where to put the directories used by the compiler.

    libexecdir = $(exec_prefix)/libexec

    # Where to put the install files.

    infdir = $(prefix)/info

    ```


    If your program installs a large number of files into one of the standard user-specified
    directories, it might be useful to group them into a subdirectory particular to
    that program. If you do, you should write the install rule to create these subdirectories.


    Do not expect the user to include the subdirectory name in the value of any of
    the variables listed above. The idea of having a uniform set of variable names
    for installation directories is to enable the user to specify the exact same values
    for different GNU packages. In order for this to be useful, all the packages must
    be designed so that they will work sensibly when the user does.


