    # Linking a single object file


    ''n.o'' is made automatically from ''n.o'' by running the linker (usu-

    all called 1d) via the C compiler. The precise command used

    is ''$(CC) $(LDFLAGS) $(LOADLIBS) $(LDLIBS)''.


    This rule does the right thing for a simple program with one

    source file. It will also do the right thing if there are multiple

    object files (presumably coming from various other source files)

    one of which has a name matching that of the executable file.

    Thus,


    ```

    x: y.o z.o

    when ''x.c'', ''y.c'' and ''z.c'' all exist execute:

    cc -c x.c -o x.o

    cc -c y.c -o y.o

    cc -c z.c -o z.o

    cc x.o y.o z.o -o x

    rm -f x.o

    rm -f y.o

    rm -f z.o

    ```


    In more complicated cases, such as when there is no object file

    whose name derives from the executable file, you must

    write an explicit command for linking.


