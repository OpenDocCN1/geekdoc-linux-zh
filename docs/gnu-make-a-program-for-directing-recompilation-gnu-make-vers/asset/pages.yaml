  md: '# Chapter 5: Writing the Commands in Rules


    # 5 Writing the Commands in Rules


    The commands of a rule consist of shell command lines to be executed by one. Each
    command line must start with a tab, except that the first command line may be
    attached to the target-and-prerequisites line with a semicolon in between. Blank
    lines and lines of just comments may appear among the command lines; they are
    ignored. (But beware, an "blank" line that begins with a tab is not blank! It
    is an empty command; see Section 5.8 [Empty Commands], page 53.)


    Users use many different shell programs, but commands in makefiles are always
    interpreted by ''/bin/sh'' unless the makefile specifies otherwise. Section 5.2
    [Command Execution], page 41.


    The shell that is in determines whether comments can be written on command lines,
    and what syntax they use. When the shell is ''/bin/sh'', a ''#'' starts a command
    that extends to the end of the line. The ''#'' does not have to be at the beginning
    of a line. Text on a line before a ''#'' is not part of the comment.


    # 5.1 Command Echoing


    Normally make prints each command line before it is executed. We call this echoing
    because it gives the appearance that you are typing the commands yourself.


    When a line starts with ''@'', the echoing of that line is suppressed. The ''@''
    is discarded before the command is passed to the shell. Typically you would use
    this for a command whose only effect is to print something, such as an echo to
    indicate progress through the makefile:


    ```

    echo About make distribution files

    ```


    When make is given ''-n'' or ''--just-print'' it only echoes commands, it won''t
    execute them. See Section 9.7 [Summary of Options], page 95. In this case and
    only this case, the commands starting with ''@'' are printed. This is useful for
    finding out which commands make thinks necessary without actually doing them.


    The ''-s'' or ''--silent'' flag to make prevents all echoing, as if all commands
    started with ''@''. A rule in the makefile for the special .SILENT without prerequisites
    has the same effect (see Section 4.7 [Special Built-in Target Names], page 30).
    .SILENT is essentially obsolete since ''@'' is more flexible.


    # 5.2 Command Execution


    When it is time to execute commands to update a target, they are executed by making
    a new subshell for each line. (In practice, make may use shortcuts that do not
    affect the results.)'
