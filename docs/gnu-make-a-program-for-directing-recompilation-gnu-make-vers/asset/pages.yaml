  md: '# GNU Make


    The Make utility automates the process of compilation; it is especially useful
    when the source files of large programs change. GNU Make is becoming increasingly
    popular because it is able to meet the needs of free software system hackers in
    system management. It is a small program with a lot of power.


    +   • How Make uses targets so that you can broaden narrow Make''s recomilation
    efforts on demand


    +   • And much more!


    This tutorial is an authoritative text by the Make program''s author, carefully
    designed for all levels of users, from beginner to expert. It explains the basics
    as well as extended features, and has a convenient Quick Reference appendix for
    experts.


    This book will show you:


    +   • How to write your own makefakes


    +   • Make''s rule syntax and how to write your own rules


    +   • How the Make utility can be configured to automatically binary and source
    files in the right places


    +   • How to use Make to create archive files automatically


    +   • Define, set and use Make''s variables


    # About the Authors


    Richard M. Stallman is the founder of the Free Software movement. He has also
    written the "Emacs Reference Manual" and Using and Posting GNU CC. Roland McGrath
    is the original author of the GNU Make Program.


