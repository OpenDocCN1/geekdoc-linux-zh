  md: '# 134


    # GNU make


    Every Makefile should define the variable INSTALL


    Every Makefile should also define the variables INSTALL_PROGRAM and INSTALL_DATA.
    (The default for INSTALL_PROGRAM should be $(INSTALL); the default for INSTALL_DATA
    should be ${INSTALL}-m 644.) Then it should use those variables as the commands
    for actual installation, for executables and nonexecutables respectively. Use
    these variables as:


    ```

    $(INSTALL_PROGRAM) foo $(bindir)/foo

    $(INSTALL_DATA) libfoo.a $(libdir)/libfoo.a

    ```


    Optionally, you may prepend the value of DESTDIR to the target filename. Doing
    this allows the installer to create a snapshot of the installation to be copied
    onto the target filesystem later. Do not set the value of DESTDIR in your Makefile,
    and do not include it in any installed files. With support for DESTDIR, the above
    examples become:


    ```

    $(INSTALL_PROGRAM) foo $(DESTDIR)$$(bindir)/foo

    $(INSTALL_DATA) libfoo.a $(DESTDIR)$$(libdir)/libfoo.a

    ```


    Always use a filename, not a directory name, as the second argument of the installation
    commands. Use a separate command for each file to be installed.


    # 14.4 Variables for Installation Directories


    Installation directories should always be named by variables, so it is easy to
    install in a nonstandard place. The standard names for these variables are described
    below. They are based on a standard filesystem layout; variants of it are used
    in SVR4, 4.4BSD, GNU/Linux, Ultrix v4, and other modern operating systems.


    These two variables set the root for the installation. All the other installation
    directories should be subdirectories of one of these, and nothing should be directly
    installed into these two directories.


    +   - prefix A prefix used in constructing the default values of the variables
    listed below. The default value of prefix should be ''/usr/local''. When building
    the complete GNU system, the prefix will be empty and ''usr'' be a symbolic link
    to ''/''. If you are using Autoconf, write it as @prefix@.


    Running ''make install'' with a different value of prefix from the one used to
    build the program should not recompile the program


    +   - exec_prefix A prefix used in constructing the default values of the variables
    listed below. The default value of exec_prefix should be $(prefix). (If you are
    using Autoconf, write it as @exec_prefix@).'
