  md: "# Chapter 7: Conditional Parts of Makefiles\n\n# 7 Conditional Parts of Makefiles\n\
    \nA conditional causes part of a makefile to be obeyed or ignored depending on\
    \ the values of variables. Conditionals can compare the value of one variable\
    \ to another, or the value of a variable to a constant string. Conditionals control\
    \ what actually “sees” in the makefile, so they cannot be used to control shell\
    \ commands at the time of execution.\n\n# 7.1 Example of a Conditional\n\nThe\
    \ following example of a conditional tells make to use one set of libraries if\
    \ the CC variable is ‘gcc’, and a different set of libraries otherwise. It works\
    \ by controlling which two command lines will be used as the command for a rule.\
    \ The result is that ‘CC=gcc’ as an argument make changes not only which compiler\
    \ is used but also which libraries are linked.\n\n```\nlibs_for_gcc = -lgnu\n\
    normal_libs =\n\nfoo: $(objects)\nifeq ($(objects),gcc)\n  $(CC) -o foo $(objects)\
    \ $(libs_for_gcc)\nelse\n  $(CC) -o foo $(objects) $(normal_libs)\ndefif\n```\n\
    \nThis conditional uses three directives: one ifeq, one else and endif. The ifeq\
    \ directive defines the conditional, and specifies the condition. It contains\
    \ two arguments, separated by comma, and surrounded by parentheses. Variable substitution\
    \ is performed on both arguments and then they are compared. The lines of the\
    \ makefile following the ifeq are obeyed if the two arguments match; otherwise\
    \ they are ignored.\n\nThe else directive causes the following lines to be obeyed\
    \ if the previous conditional failed. In the example above, this means that the\
    \ second alternative linking command is used whenever the first alternative is\
    \ not used. It is optional to have else in a conditional.\n\nThe endif directive\
    \ ends the conditional. Every conditional must end with an endif. Unconditional\
    \ makefile text follows.\n\nAs this example illustrates, conditionals work at\
    \ the textual level: the lines of the conditional are treated as part of the makefile,\
    \ or ignored, according to the condition. This is why the larger syntactic units\
    \ of the makefile, as rules, may cross the beginning or the end of the conditional.\n\
    \nWhen the variable CC has the value ‘gcc’, the above example has this effect:\n\
    \n```\nfoo: $(objects)\n  $(CC) -o foo $(objects) $(libs_for_gcc)\n```"
