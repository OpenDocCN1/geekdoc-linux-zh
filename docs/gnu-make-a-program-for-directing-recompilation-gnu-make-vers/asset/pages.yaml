  md: '# $(MAKEINFO) $(srcdir)/foo.texi


    You must define the variable MAKEINFO in the Makefile. It should run the makeinfo
    program, which is part of the Texinfo distribution.


    Normally a GNU distribution comes with Info files, and that means the Info files
    are present in the source directory. Therefore, the make rule for an info file
    should update it in the source directory. When users build the package, ordinarily
    Make will not update the Info files because they will already be up to date.


    Generate DVI files for all Texinfo documentation. For example:


    ```

    dvi: foo.dvi

    foo.texi chap1.texi chap2.texi

    $(TEX2DVI) $(srcdir)/foo.texi

    ```


    You must define the variable TEX2DVI in the Makefile. It should run the program
    tex2dvi, which is part of the Texinfo distribution. Alternatively, write the dependencies,
    and allow GNU make to provide the command.


    Create a distribution file for this program. The tar file should be set up so
    that the file names in the tar file start with a subdirectory name which is the
    name of the package it is a distribution for. This name can include the version
    number.


    For example, the distribution tar file of GCC version 1.40 packs into a subdirectory
    named ''gcc-1.40''.


    The easiest way to do this is to create a subdirectory appropriately, use ln or
    cp to install the proper files in it, and then tar that subdirectory.


    Compress the tar file with gzip. For example, the actual distribution file for
    GCC version 1.40 is called ''gcc-1.40.tar.gz''.


    The dist target should explicitly depend on all non-source files that are in the
    distribution, to make sure they are up to date in the distribution. See section
    “Making Releases” in GNU Coding Standards.


    Perform self-tests (if any). The user must build the program before running the
    tests, but not install the program; you should write the self-tests so that they
    work when the program is built but not installed.


    The following targets are suggested as conventional names, for programs in which
    they are useful.


    > tex2dvi uses Tex to do the real work of formatting. Tex is not distributed with
