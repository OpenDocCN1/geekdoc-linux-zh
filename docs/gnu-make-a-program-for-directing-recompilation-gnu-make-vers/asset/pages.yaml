  md: "# Chapter 4: Writing Rules\n\n# 4.3.3 How Directory Searches are Performed\n\
    \nWhen a prerequisite is found through directory search, regardless of type (general\
    \ or selective), the pathname located may not be the one that actually provides\
    \ you in the prerequisite list. Sometimes the path discovered through directory\
    \ search is thrown away.\n\nThe algorithm use to decide whether to keep or abandon\
    \ a path found via directory search is as follows:\n\n+   1. If a target file\
    \ does not exist at the path specified in the makefile, directory search is performed.\n\
    2. If the directory search is successful, then path is kept and this file is tentatively\
    \ stored as the target.\n3. All prerequisites of this target are examined using\
    \ this same method.\n4. After processing the prerequisites, the target may or\
    \ may not need to be rebuilt:\n   - If the target does not need to be rebuilt,\
    \ the path to the file found during directory search is used for any prerequisite\
    \ lists which contain this target. In short, if make doesn't need to rebuild the\
    \ target then you use the path found via directory search.\n   - If the target\
    \ does need to be rebuilt (out-of-date), the pathname found during directory search\
    \ is thrown away, and the target is rebuilt using the file name specified in the\
    \ makefile. In short, if make must rebuild, then the target is rebuilt locally,\
    \ not in the directory found via directory search.\n\nThis algorithm may seem\
    \ complex, but in practice it is quite exactly what you want.\n\nOther versions\
    \ of make use a simpler algorithm: if the file does not exist, and it is found\
    \ via directory search, then pathname is always used whether or not the target\
    \ needs to be built. Thus, if the target is rebuilt it is created at the pathname\
    \ discovered during directory search.\n\nIf, in fact, this is the behavior you\
    \ want for some or all of your directories, you can use the PATH variable to indicate\
    \ this or colon-\n\nPATH has the same syntax and format as VPATH (that is, a space-\
    \ or colon-delimited list of paths). If an out-of-date target is found by directory\
    \ search in a directory that also appears in PATH, then pathname is not thrown\
    \ away. The target is rebuilt using the expanded path.\n\n# 4.3.4 Writing Shell\
    \ Commands with Directory Search\n\nWhen a prerequisite is found in another directory\
    \ through directory search, this cannot change the commands of the rule; they\
    \ will execute as written. Therefore, you must write the commands with care so\
    \ that they will look for the prerequisite in the directory where make finds it."
