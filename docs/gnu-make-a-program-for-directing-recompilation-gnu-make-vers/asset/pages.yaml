  md: '# 144


    # GNU make


    being installed. It is a post-installation command because it needs to be done
    after the normal command which installs the package''s Info files.


    Most programs don''t need pre-installation commands, but we have the feature just
    in case it is needed.


    To classify the commands in the install rule into these three categories, insert
    category lines among them. A category line specifies the category for the commands
    that follow.


    A category line consists of a tab and a reference to a special Make variable,
    plus an optional comment at the end. There are three variables you can use, one
    for each category; the variable name specifies the category. Category lines are
    no-op in ordinary execution because these three Make variables are normally defined
    at end (and you should not define them in the Makefile).


    Here the three possible category lines, each with a comment that explains what
    it means:


    ```

    $$(PRE_INSTALL)   # Pre-installation commands follow.

    $$(POST_INSTALL)  # Post-installation commands follow.

    $$(NORMAL_INSTALL) # Normal commands follow.

    ```


    If you don''t use a category line at the beginning of the install rule, all the
    commands are classified as normal until the first category line. If you don''t
    use any category lines, all the commands are classified as normal.


    These are the category lines for uninstall:


    ```

    $$(PRE_UNINSTALL)   # Pre-uninstall commands follow.

    $$(POST_UNINSTALL)  # Post-uninstall commands follow.

    $$(NORMAL_UNINSTALL) # Normal commands follow.

    ```


    Typically, a pre-uninstall command would be used for deleting entries from the
    Info directory.


    If the install or uninstall target has any dependencies which act as subroutines
    of installation, you should start each dependency''s commands with a category
    line, and start the main target''s commands with a category line also. This way,
    you can ensure that each command is placed in the right category regardless of
    which of the dependencies actually run.


    Pre-installation and post-installation commands should not run any programs except
    for these:


    ```

    [ basename bash cat chgrp chmod chown cp dd diff echo

    grep expand false fgrep getopt grep gunzip gzip

    hostname install-info kill ldconfig ls msum

    mkdir mkfifo mkdn mv prentv pwd rmdir sed sort tee

    test true uname xargs yes

    ```


    The reason for distinguishing the commands in this way is for the sake of making
    binary packages. Typically a binary package contains all the executables and other
    files that need to be installed, and has its own method of installing them—so
    it does not need to run the normal installation commands.'
