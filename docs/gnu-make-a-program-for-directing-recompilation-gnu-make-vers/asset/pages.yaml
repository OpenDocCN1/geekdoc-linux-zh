  md: '# Chapter 11: Using make to Update Archive Files


    # 11.3 Dangers When Using Archives


    It is important to be careful when using parallel execution (the -j switch; see
    Section 5.3 [Parallel Execution], page 43) and archives. If multiple commands
    run at the same time on the same archive file, they will not know about each other
    and can corrupt the file.


    Possibly a future version of make will provide a mechanism to circumvent this
    problem by serializing all commands that operate on the same archive file. But
    for the time being, you must either your makefiles to avoid this problem in some
    other way, or not use -j.


    # 11.4 Suffix Rules for Archive Files


    You can create a special kind of suffix rule for dealing with archive files. See
    Section 10.7 [Suffix Rules], page 117, for a full explanation of suffix rules.
    Archive rules are obsolete in GNU make, because pattern rules for archives are
    a more general mechanism (see Section 11.2 [Archive Update], page 121). But they
    are retained for compatibility with other methods.


    To write a suffix rule for archives, you simply write a suffix rule using the
    target suffix *.a (the usual suffix for archive files). For example, here is the
    old-fashioned suffix rule to update a library archive from C source files:


    ```

    .c:a:

    $(CC) $(CFLAGS) $(CPPFLAGS) -c $< -o $.*

    $(AR) r $* $.*

    $(RM) $.*

    ```


    This works just if you had written the pattern rule:


    ```

    %.o: %.c

    $(CC) $(CFLAGS) $(CPPFLAGS) -c $< -o $.*

    $(AR) r $* $.*

    $(RM) $.*

    ```


    In fact, this is just what make does when it sees a suffix rule with ''.a'' as
    the target suffix. Any double-suffix rule ''*.x.a'' is converted to a pattern
    rule with the target pattern ''%.o'' and a prerequisite pattern of ''%.x''.


    Since you want to use ''*.a'' as the suffix for some other kind of file, make
    also converts archive rules to pattern rules in the normal way (see Section 10.7
    [Suffix Rules], page 117). Thus a double-suffix rule ''*.x.a'' produces two pattern
    rules: ''%.o: %.x'' and ''%.a: %.x''.'
