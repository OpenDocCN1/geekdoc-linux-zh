    otherwise, it looks exactly like an ordinary rule. The target is a pattern for
    matching file names; the ''%'' matches any nonempty substring, while other characters
    match only themselves.


    For example, ''.c'' as a pattern matches any file name that ends in ''.c''. ''.sc''
    as a pattern matches any file name that starts with ''s'', ends in ''.c'' and
    is at least five characters long (There must be at least one character to match
    the ''.''). The substring that the ''%'' matches is the stem.


    %'' in a prerequisite of a pattern rule stands for the stem that was matched by
    the ''%'' in the target. In order for the rule to apply, its target pattern must
    match the file name under consideration, and its prerequisite patterns must match
    file names that exist or can be made. These files become prerequisites of the
    target.


    Thus, a rule of the form

    %.o : %c;


    specifies how to make a file ''.o'', with another file ''.c'' as its prerequisite,
    provided that ''.c'' exists or can be made.


    There may be prerequisites that do not use ''%''; such a prerequisite attaches
    to every file made by this pattern rule. These unvarying prerequisites are useful
    occasionally.


    A pattern rule may not have any prerequisites that contain ''%'', or in fact any
    prerequisites at all. Such a rule is effectively a general wildcard. It provides
