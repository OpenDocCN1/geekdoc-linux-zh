  md: '# Chapter 9: How to Run make


    # How to Run make


    A myfile that says how to recompile a program can be used in more one way. The
    simplest use is to recompile every file that is out of date. Usually, makefiles
    are written so that if you run make with no arguments, it does just that.


    But you might want to update only some of the files; you might want to use a different
    compiler or different compiler options; you might want to find out which files
    are out of date without changing them.


    By giving arguments when you run make, you can do any of these things and many
    others.


    The exit status of make is always one of three values:


    +   - The exit status is zero if make is successful.

    - The exit status is two if make encounters any errors. It will print messages
    describing the particular errors.

    - The exit status is one if you use the ''-q'' flag and make determines that some
    target is not already up to date. See Section 9.3 [Instead of Executing the Commands],
    page 91.


    # 9.1 Arguments to Specify the Makefile


    The way to specify the name of the Makefile is with the ''-f'' or ''--file'' option
    (''--makefile'' also works). For example, -f altmake says to use the file ''altmake''
    as the Makefile.


    If you use the ''-f'' flag several times and follow each ''-f'' with an argument,
    all the specified files are used jointly as makefiles.


    If you do not use the ''-f'' or ''--file'' flag


    # 9.2 Arguments to Specify the Goals


    The goals are the targets that make should strive ultimately to update. Other
    targets are updated as they appear as prerequisites of goals, or prerequisites
    of prerequisites of goals, each.


    By default, the goal is the first target in the myfile (not counting targets that
    start with a period). Therefore, makefiles are usually written so that the first
    target is for compiling the entire program or programs they describe.


    If the first rule in the myfile has several targets, only the first target in
    the rule becomes the default goal, not the whole list.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'You can specify a different goal or goals with arguments to make. Use the name
    of the goal as an argument. If you specify several goals, make processes each
    of them in turn, in the order you name them.


    Any target in the makefile may be specified as a goal (unless it starts with ''-''
    or contains an ''='', in which case it will be parsed as a switch or variable
    definition, respectively). Even targets not in the makefile may be specified,
    if make can find implicit rules that say how to make them.


    Make will set the special variable MAKECMDGOALS to the list of goals you specified
    on the command line. If no goals were given on the command line, this variable
    is empty. Note that this variable should be used only in special circumstances.


    An example of appropriate use is to avoid ''.d'' files during clean rules (see
    Section 4.12 [Automatic Prerequisites], page 37), so make won''t create them to
    immediately remove them:


    ```

    sources = foo.c bar.c


    ifeq ($(MAKECMDGOALS),clean)

    include $(sources):.d

    endif

    ```


    One use of specifying a goal is if you want to compile only a part of the program,
    or only one of several programs. Specify as a goal each file that you wish to
    remake. For example, consider a directory containing several programs, with a
    makefile that starts like this:


    ```

    .PHONY: all

    all: size nm 1d ar as

    ```


    If you are working on the program size, you might want to say ''make size'' so
    that only the files of that program are recompiled.


    Another use of specifying a goal is to make files that are not normally made.
    For example, there may be a file of debugging output, or a version of the program
    that is compiled for testing, which has a rule in the makefile but is not a prerequisite
    of the default goal.


    Another use of specifying a goal is to run the commands associated with a phony
    target (see Section 4.4 [Phony Targets], page 27) or empty target (see Section
    4.6 [Empty Target Files to Record Events], page 30). Many makefiles contain a
    phony target named ''clean'' which deletes everything except source files. Naturally,
    this is done only if you request it explicitly with ''make clean''. Following
    a list of typical phony and empty target names. See Section 14.5 [Standard Targets],
    page 138, for a detailed list of all the standard target names which GNU software
    packages uses.


    ''all'' Make the top-level targets the makefile knows about.


    ''clean'' Delete all files that are normally created by running make.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Chapter 9: How to Run make


    ''mostlyclean''


    Like ''clean'', but may refrain from deleting a few files that people normally
    don''t want to recompile. For example, the ''mostlyclean'' target for GCC does
    not delete ''libgcc.a'', because recompiling it is rarely necessary and takes
    a lot of time.


    ''distclean''


    ''realclean''


    ''clobber''


    Any of these targets might be defined to delete more files than ''clean'' does.
    For example, this would delete configuration files or links that you would normally
    create as preparation for compilation, even if themakefile itself cannot create
    these files.


    ''install''


    Copy the executable file into a directory that users typically search for commands;
    copy any auxiliary files that the executable uses in the directories where it
    will look for them.


    ''print''


    Print listings of the source files that have changed.


    ''tar''


    Create a tar file of the source files.


    ''shar''


    Create a shell archive (shar file) of the source files.


    ''dist''


    Create a distribution file of the source files. This might be a tar file, a shell
    file, or a compressed version of one of the above, or even more than one of the
    above.


    ''TAGS''


    Update a tags table for this program.


    ''check''


    ''test''


    Perform self tests on the program this makefile builds.


    # 9.3 Instead of Executing the Commands


    The makefile tells make how to tell whether a target is up to date, and how to
    update each target. But updating the targets is not always what you want. Certain
    options specify other activities for make.


    +   -n


    +   --just-print


    +   --dry-run


    +   --recon


    > "No-op". The activity is to print what commands would be used to make the targets
    up to date, but not actually execute them.


    +   -t


    +   --touch


    > "Touch". The activity is to mark the targets as up to date without actually
    changing them. In other words, make pretends to compile the targets but does not
    really change their contents.'
