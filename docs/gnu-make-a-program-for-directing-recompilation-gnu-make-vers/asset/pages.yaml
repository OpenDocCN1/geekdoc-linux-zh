  md: '# Chapter 4: Writing Rules


    # 4 Writing Rules


    A rule appears in the मायने and says when and how to remake certain files, called
    the rule''s targets (most often only one per rule). It lists the other files that
    are the prerequisites of the target, and commands to use to create or update the
    target.


    The order of rules is not significant, except for determining the default goal:
    the target for make to consider, if you do not otherwise specify one. The default
    goal is the target of the first rule in the myfile. The first rule has multiple
    targets, only the first target is taken as the default. There are two exceptions:
    a target starting with a period is not a default unless it contains one more slashes,
    ''/'', as well; and a target that defines a pattern rule has no effect on the
    default goal. (See Section 10.5 [Defining and Redefining Rules], page 109).


    Therefore, we usually write the myfile so that the first rule is the one for compiling
    the entire program or all the programs described by the myfile (often with a target
    ''all''). See Section 9.2 [Arguments to Specify the Goals], page 89.


    # 4.1 Rule Syntax


    In general, a rule looks like this:


    ```

    targets : prerequisites

    command

    ```


    or like this:


    ```

    targets : prerequisites ; command

    command

    ```


    The targets are files, separated by spaces. Wildcard characters may be used (see
    Section 4.2 [Using Wildcard Characters in File Names], page 20) and a name of
    the form ''a(m)'' represents member m in archive file (see Section 11.1 [Archive
    Members as Targets], page 121). Usually there is only one target per rule, but
    occasionally there is a reason to have more (see Section 4.8 [Multiple Targets
    in a Rule], page 33).


    The command lines start with a tab character. The first command may appear on
    the line after the prerequisites, with a tab character, or may appear on the same
    line, with a semicolon. Either way, the effect is the same. See Chapter 5 [Writing
    the Commands in Rules], page 41.


    Dollar signs are used to start variable references, if you really want a dollar
    sign in a rule you must write two of them, ''$$'' (see Chapter 6 [How to Use Variables],
    page 55). You may split a long line by inserting a backslash followed by a newline,
    but this is not required, as make no places on the length of a line in a myfile.'
