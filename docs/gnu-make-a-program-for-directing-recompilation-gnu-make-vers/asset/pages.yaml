  md: '# Chapter 6: How to Use Variables


    Most variable names are considered to have the empty string as a value if you
    have never set them. Several variables have built-in initial values that are not
    empty, but you can set them in the usual ways (see Section 10.3 [Variables Used
    by Implicit Rules], page 106). Special variables are set automatically to a new
    value for each rule; these are called the automatic variables (see Section 10.5.3
    [Automatic Variables], page 111).


    If you''d like a variable to be set to a value only if it''s not already set,
    then you can use the shorthand operator ''?='' instead of ''=''. These two settings
    of the variable ''F00'' are identical (see Section 8.7 [The Origin Function],
    page 85):


    ```

    F00 = bar


    ifeq($origin F00, undefined)

    F00 = bar

