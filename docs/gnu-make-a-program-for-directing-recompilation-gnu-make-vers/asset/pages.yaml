    ''includedir'' The directory for installing header files to be included by user
    programs with the C #include preprocessor directive. This should normally be ''/usr/local/include'',
    but write it as $(prefix)/include''. (If you are using Autoconf, write it as ''@includedir'').


    Most compilers other than GCC do not look for header files in directory ''/usr/local/include''.
    So installing the header files this way is only with GCC. Sometimes it is a problem
    because some libraries are only really intended to work with GCC. But some libraries
    are intended to work with other compilers. They should install their header files
    in two places, one specified by includedir and one specified by oldincludedir.


    ''oldincludedir'' The directory for installing ''#include'' header files for use
    other than GCC. This should normally be ''/usr/include''. (If you are using Autoconf,
    you can write it as ''@oldincludedir'').


    The Makefile commands should check the value of oldincludedir is empty. If it
    is, they should not try to use it; they should cancel the second installation
    of the header files.


    A package should not replace an existing header in this directory unless the header
    came from the same package. If your Foo package provides a header file ''foo.h'',
    then it should install the header file in the oldincludedir directory if either
    (1) there is no ''foo.h'' there or (2) the ''foo.h'' that exists came from the
    Foo package.


    To tell whether ''foo.h'' came from the Foo package, put a magic string in the
    file—part of a comment—and grep for that string.


    Unix-style man pages are installed in one of the following:


    ''mandir'' The top-level directory for installing the man pages (if any) for this
    package. It will normally be ''/usr/local/man'', but you should write it as ''$(prefix)/man''.
    (If you are using Autoconf, write it as ''@mandir'').


    ''man1dir'' The directory for installing section 1 man pages. Write it as ''$(mandir)/mani''.


    ''man2dir'' The directory for installing section 2 man pages. Write it as ''$(mandir)/man2''.


