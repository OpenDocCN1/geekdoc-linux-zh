    files that are not in the current directory; however, VPATH specifies a search
    list that make applies for all files, including files which are targets of rules.


    Thus, if a file is listed as a target or prerequisite does not exist in the current
    directory, make searches the directories listed in VPATH for a file with that
    name. If a file is found in one of them, that file may become the prerequisite
    (see below). Rules may then specify the name of files in the prerequisite list
    as if they existed in the current directory. Section 4.3.4 [Writing Shell Commands],
    page 25.


    In the VPATH variable, directory names are separated by colons or blanks. The
    order in which directories are listed is the order followed by make in its search.
    (On MS-DOS and MS-Windows, semi-colons are used as separators of directory names
    in VPATH, since the colon can be used in the pathname itself, after the drive
    letter.)


    For example,


