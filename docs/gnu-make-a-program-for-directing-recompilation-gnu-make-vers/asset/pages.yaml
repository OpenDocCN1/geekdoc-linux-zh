    To avoid all the problems and inconveniences of recursively expanded variables,
    there is another flavor: simply expanded variables.


    Simply expanded variables are defined by lines using '':='' (see Section 6.5 [Variables],
    page 62). The value of a simply expanded variable is scanned once and for all,
    expanding any references to other variables and functions, when the variable is
    defined. The actual value of the simply expanded variable is the result of expanding
    the text that you write. It does not contain any references to other variables;
