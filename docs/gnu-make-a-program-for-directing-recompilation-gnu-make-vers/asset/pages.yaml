    # 3.5 How Makefiles Are Remaded


    Sometimes makefiles can be remade from other files, such as RCS or SCCS files.
    If a makefile can be remade from other files, you probably want to make get an
    up-to-date version of the makefile to read in.


    To this end, after reading in all makefiles, make will consider each as a target
    and update it. If a makefile has a rule which says how to update it (found either
    in that makefile or in another one) or an implicit rule applies to it (see Chapter
    10 [Using Implicit Rules], page 101), it will be updated if necessary. After all
    makefiles have been checked, if any have actually been changed, make starts with
    a clean read and reads all the makefiles over again. (It will also attempt to
    update each of them over again, but normally this will not change them, since
    they are already up to date.)


    If you know that one or more of your makefiles cannot be remade and you want to
    keep make from performing an implicit rule search on them, for efficiency reasons,
    you can use any normal method of preventing implicit rule lookup to do so. For
    example, you can write an explicit rule with the makefile as the target, and an
    empty command string (see Section 5.8 [Using Empty Commands], page 53).


