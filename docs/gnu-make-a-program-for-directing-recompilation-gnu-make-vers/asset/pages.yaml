  md: '# Chapter 6: How to Use Variables


    # How to Use Variables


    A variable is a name defined in a makefile to represent a string of text, called
    the variable''s value. These values are substituted by explicit request into targets,
    prerequisites, commands, and other parts of the makefile. (In other versions of
    make, variables are called macros).


    Variables and functions in all parts of a makefile are expanded when read, except
    for the shell commands in rules, the right-hand sides of variable definitions
    using ''='', and the bodies of variable definitions using the define directive.


    Variables can represent lists of file names, options to pass to compilers, programs
    to run, directories to look in for source files, directories to write output in,
    or anything else you can imagine.


    A variable name may be any sequence of characters not containing '':'', ''='',
    or leading or trailing whitespace. However, variable names containing other than
    letters, numbers, and underscores should be avoided, as they may give special
    meanings in the future, and with some shells they cannot be passed through the
    environment to a sub-make (see Section 5.6.2 [Communicating Variables to a Sub-make],
    page 47).


    Variable names are case-sensitive. The names ''foo'', ''FOO'', and ''Foo'' all
    refer to different variables.


    It is traditional to use upper case letters in variable names, but we recommend
    using lower letters for variable names that serve internal purposes in the makefile,
    and reserving upper case for parameters that the user should override with command
    options (see Section 9.5 [Overriding Variables], page 93).


    A few variables have names that are a single punctuation character or just a few
    characters. These are the automatic variables, and they have particular specialized
    uses. See Section 10.5.3 [Automatic Variables], page 111.


    # 6.1 Basics of Variable References


    To substitute a variable''s value, write a dollar sign followed by the name of
    the variable in parentheses or either: ''$(foo)'' or ''${foo}'' is a valid reference
    to the variable foo. This special significance of ''$'' is why you must write
    ''$$'' to have the effect of a single dollar sign in a file name or command.


    Variable references can be used in any context: targets, prerequisites, commands,
    most directives, and new variable values. Here is an example of a common case,
    where a variable holds the names of all the object files in a program:'
