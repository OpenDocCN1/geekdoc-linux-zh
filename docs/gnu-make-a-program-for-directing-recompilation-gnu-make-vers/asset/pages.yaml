  md: '# Chapter 4: Writing Rules


    Wildcards are also useful in the prerequisites of a rule. With the follow-rule
    in the makefile, `make print` will print all the `.c` files that have changed
    since the last time you printed them:


    ```

    print: *.c

    lpr -p $?

    touch print

    ```


    This rule uses ''print'' as an empty target file; see Section 4.6 [Empty Files
    to Record Events], page 30. (The automatic variable `$?` is used to print only
    those files that have changed; see Section 10.5.3 [Automatic Variables], page
    111.)


    Wildcard expansion does not happen when you define a variable. Thus, if you write:
    = *.o


    ```

    objects = *.o

    ```


    then the value of the variable objects is the actual string `*.o`. However, if
    you use the value of objects in a target, prerequisite or command, wildcard expansion
    will take place at that time. To set objects to the expansion, instead use:


    ```

    objects := $(wildcard *)

    ```


    See Section 4.2.3 [Wildcard Function], page 22.


    # 4.2.2 Pitfalls of Using Wildcards


    Now here is an example of a naive way of using wildcard expansion, that does not
    do what you would intend. Suppose you would like to say that the executable file
    ''foo'' is made from all the object files in the directory, and you write this:


    ```

    objects = *.o

    foo := $(objects)

    c -o foo $(CFLAGS) $(objects)

    ```


    The value of objects is the actual string `*.o`. Wildcard expansion happens in
    the rule for ''foo'', so that each existing `*.o` file becomes a prerequisite
    of ''foo'' and will be recompiled if necessary.


    But what if you delete the ''*.o'' files? When a wildcard matches nothing, it
    is left as it is, so ''foo'' will depend on the oddly-named file `*.o`. Since
    no such file is likely to exist, make will give you an error saying it cannot
    figure out how to make `*.o`. This is not what you want!


    Actually it is possible to obtain the desired result with wildcard expansion,
    but you need more sophisticated techniques, including the wildcard function and
    string substitution. These are described in the following section:


    Microsoft operating systems (MS-DOS and MS-Windows) use backslashes to separate
    directories in paths, like'
