    # 8.5 The if Function


    The if function provides for conditional expansion in a functional context (as
    opposed to the GNU makefile conditionals as ifeq see Section 7.2 [Syntax of Conditionals],
    page 70).


    An if function can contain two or three arguments:


    ```

    $(if condition, else-part)

    ```


    The first argument, condition, has all preceding and trailing white-space stripped,
    it is expanded. If it expands to any non-empty string, then the condition is considered
    to be true. If it expands to an empty string, the condition is considered to be
    false.


    If the condition is true the second argument, then-part, is evaluated and this
    is used as the result of the evaluation of the entire function.


    If the condition is false the third argument, else-part, is evaluated and this
    is the result of the if function. If there is no third argument, the if function
    evaluates to nothing (the empty string).


    Note that only one of the then-part or the else-part will be evaluated, never
    both. Thus, either can contain side-effects (such as shell function calls, it).


    # 8.6 The Call Function


    The call function is unique in that it can be used to create parameterized functions.
    You can write a complex expression as the value of a variable, then use call to
    expand it with different values.


    The syntax of the call function is:


    ```

    $(call variable, param, param, ...)

    ```


    When make expands this function, it assigns param to temporary variables $(1),
    $(2)$, etc. The variable $(0)$ will contain variable. There is no maximum number
    of parameter arguments. There is no minimum, either, but it doesn''t make sense
    to use call with no parameters.'
