  md: '# Chapter 1: Overview of make


    # 1 Overview of make


    The utility automatically determines which pieces of a large program need to be
    recompiled, and issues commands to recompile them. This manual describes GNU make,
    which was implemented by Richard Stallman and Roland McGrath. Development since
    Version 3.76 has been handled by Paul D. Smith.


    GNU make conforms to section 6.2 of IEEE Standard 1003.2-1992 (POSIX).


    Our examples show C programs, since they are most common, but you can use make
    with any programming language whose compiler can run with a shell command. Indeed,
    make is not limited to programs. You can use it to describe any task where some
    files must be updated automatically from others whenever the others change.


    To prepare to use make, you must write a file called Makefile that describes the
    relationships among files in your program and provides commands for updating each
    file. In a program, typically, the executable file is updated from object files,
    which are in turn by compiling source files.


    Once a suitable Makefile exists, each time you change some source files, this
    simple shell command:


    ```

    make

    ```


    suffices to perform all necessary recompilations. The make program uses the Makefile
    data base and the last-modification times of the files to decide which of the
    files need to be updated. For each of those files, it issues the commands recorded
    in the data base.


    You can provide command line arguments to make to control which files should be
    recompiled, or for how. See Chapter 9 [How to Run make], page 89.


    # 1.1 How to Read This Manual


    If you are new to make, or are looking for a general introduction, read the first
    few sections of each chapter, skipping the later sections. In each chapter, the
    first few sections contain introductory or general information. The exception
    is Chapter 2 [An Introduction to Makefiles], page 3, all of which is introductory.


    If you are familiar with other make programs, Chapter 12 [Features of GNU make],
    page 125, which lists the enhancements GNU make has, and Chapter 13 [Incompatibilities
    and Missing Features], page 129, which explains the things GNU make lacks that
    others.


    For a quick summary, Section 9.7 [Options Summary], page 95, Appendix A [Quick
    Reference], page 147, and Section 4.7 [Special Targets], page 30.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 1.2 Problems and Bugs


    If you have problems with GNU make or think you''ve found a bug, please report
    it to the developers; we cannot promise to do anything but we might well want
    to fix it.


    Before reporting a bug, make sure you''ve actually found a real bug. Carefully
    reread the documentation and see if it really says you can do what you''re trying
    to do. If it''s not clear whether you should be able to do something or not, report
    that too; it''s a bug in the documentation!


    Before reporting a bug or trying to fix it yourself, try to isolate it to the
    smallest possible makefile that reproduces the problem. Then send us this small
    makefile and the exact results make gave you. When generating this makefile, be
    sure not to use any non-free or unusual tools in your commands: you can almost
    always emulate what such tool would do with simple shell commands. Finally, be
    sure to explain what you expected to occur; this will help us decide whether the
    problem was really in the documentation.


    Once you''ve got a precise problem, please send electronic mail to:


    ```

    bug-make@gnu.org

    ```


    Please include the version number of make you are using. You can get this information
    with the command ''make --version''. Be sure also to include the type of machine
    and operating system you are using.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Chapter 2: An Introduction to Makefiles


    # 2 An Introduction to Makefiles


    You need a file called a makefile to tell make what to do. Most often, the makefile
    tells make how to compile and link a program.


    In this chapter, we will discuss a simple makefile that describes how to compile
    and link a text editor consisting of eight C source files and three header files.
    The makefile can also tell how to run miscellaneous commands when explicitly asked
    (for example, to remove certain files as a clean-up operation). To see a more
    complex example of a makefile, see Appendix C [Complex Makefile], page 157.


    When make compiles the editor, each changed C source file must be recompiled.
    If a header file has changed, each C source file that includes the header file
    must be recompiled to be safe. Each compilation produces an object file corresponding
    to the source file. Finally, if any source file has been recompiled, all the object
    files, newly made or saved from previous compilations, must be linked together
    to produce the new executable editor.


    # 2.1 What a Rule Looks Like


    A simple makefile consists of "rules" with the following shape:

    target ... : prerequisites

    command

    ...


    A target is usually the name of a file that is generated by a program; examples
    of targets are executable or object files. A target can also be the name of an
    action to carry out, such as ‘clean’ (see Section 4.4 [Phony Targets], page 27).


    A prerequisite is a file that is used as input to create the target. A target
    often depends on several files.


    A command is an action that make carries out. A rule may have more than one command,
    each on its own line. Please note: you need to put a tab character at the beginning
    of every command line! This is an obscurity that catches the unwary.


    Usually a command is in a rule with prerequisites and serves to create a target
    file if any of the prerequisites change. However, the rule that specifies commands
    for the target not have prerequisites. For example, the rule containing the delete
    command associated with the target ‘clean’ does not have prerequisites.


    A rule, then, explains how and when to remove certain files which are the targets
    of the particular rule. make carries out the commands on the prerequisites to
    create or update the target. A rule can also explain how and to carry out an action.
    See Chapter 4 [Writing Rules], page 19.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "A makefile may contain other text besides rules, but a simple makefile\nonly\
    \ contain rules. Rules may look somewhat more complicated than\nshown in this\
    \ template, but all fit the pattern more or less.\n\n# 2.2 A Simple Makefile\n\
    \nHere is a straightforward makefile that describes the way an executable\nfile\
    \ called edit depends on eight object files which, in turn, depend on eight\n\
    C source and three header files.\n\nIn this example, the C files include 'defs.h',\
    \ but only those defining\nediting commands include 'command.h', and only low\
    \ level files that change\nt editor buffer include 'buffer.h'.\n\n```\nedit :\
    \ main.o kbd.o command.o display.o \\\\\n    insert.o search.o files.o utils.o\n\
    \    cc -o edit main.o kbd.o command.o display.o \\\\\n    insert.o search.o files.o\
    \ utils.o\n\nmain.o : main.c defs.h\n    cc -c main.c\nkbd.o : kbd.c defs.h command.h\n\
    \    cc -c kbd.o\ncommand.o : command.c defs.h command.h\n    cc -c command.o\n\
    display.o : display.c defs.h buffer.h\n    cc -c display.o\ninsert.o : insert.c\
    \ defs.h buffer.h\n    cc -c insert.c\nsearch.o : search.c defs.h buffer.h\n \
    \   cc -c search.o\nfiles.o : files.c defs.h buffer.h command.h\n    cc -c files.o\n\
    utils.o : utils.c defs.h\n    cc -c utils.o\n\nclean:\n    rm edit main.o kbd.o\
    \ command.o display.o \\\n    insert.o search.o files.o utils.o\n```\n\nWe split\
    \ each line into two lines using backslash-newline; this is like\nusing one long\
    \ line, but is easier to read.\n\nTo use this makefile to create the executable\
    \ file 'edit', type:\nmake\n\nTo use this makefile to delete the executable file\
    \ and all the object files\nfrom the directory, type:\nmake clean"
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 2: Introduction to Makefiles


    In the example, the targets include the executable file ''edit'', and the object
    files ''main.o'' and ''kbd.o''. The prerequisites are files as ''main.c'' and
    ''defs.h''. In fact, each ''.o'' file is such a target and its prerequisite includes
    ''cc -c main.c'' and ''cc -c kbd.c''.


    When a target is a file, it needs to be recompiled or relinked if any of its prerequisites
    change. In addition, any prerequisites that are themselves automatically generated
    should be updated. In this example, ''edit'' depends on each of the object files;
    the object file ''main.o'' depends on the source file ''main.c'' and on the header
    file ''defs.h''.


    A command follows each line that contains a target and prerequisites. A tab character
    must come at the beginning of every command line to distinguish commands from
    other lines in the Makefile. (Bear in mind that make does not know anything about
    how the commands work. It is up to you to supply commands that will update the
    target file properly. All make executes the commands in the rule you specified
    when the target file needs to be updated.)


    The target ''clean'' is not a file, but merely the name of the action. Since you
    normally do not want to carry out the actions in this rule, ''clean'' is not a
    prerequisite of any other rule. Consequently, make never does anything unless
    you tell it specifically. That rule is not a prerequisite, it also not have any
    prerequisites, so the only purpose of the rule is to run the specified commands.
    Targets that do not refer to files but just actions are called phony targets.
    See Section 4.4 [Phony Targets], page 27, for information about this kind of target.
    See Section 5.4 [Errors in Commands], page 44, to see how to cause make to ignore
    errors from rm or any other command.


    # 2.3 How make Processes a Makefile


    By default, make starts with the first target (not targets whose names start with
    ''.''). This is called the default goal. (Goals are the targets that make strives
    ultimately to update. See Section 9.2 [Arguments to Specify the Goals], page 89.)


    In the simple example of the previous section, the default goal is to update the
    executable program ''edit''; therefore, we put that rule first.


    Thus, when you give the:


    ```

    make

    ```


    make reads the Makefile in the current directory and begins processing the first
    rule. In the example, this rule is for relinking ''edit''; before make can fully
    process this rule, it must process the rules for the files that ''edit'' depends
    on, which in this case are the object files. Each of these files is processed
    according to its own rule. These rules update each ''.o'' file by compiling its
    source file. The recompilation must be done if the'
  merge: -1
