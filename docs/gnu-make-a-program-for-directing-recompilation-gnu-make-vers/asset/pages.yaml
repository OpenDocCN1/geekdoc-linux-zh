    port.c wildmat.c getoldopt.c \

    SRC3 = getopt1.c regex.c getdate.y

    SRCS = $(SRC1) $(SRC3)

    OBJ1 = tar.o create.o extract.o buffer.o \\

    getoldopt.o update.o gnu.o mangle.o

    OBJ2 = version.o list.o diffarch.o \\

    port.o wildmat.o getoldopt.o

    OBJ3 = getopt.o regex.o getdate.o $(RTAPELIB)

    OBJS = $(OBJ1) $(OBJ2) $(OBJ3)

    AUX = README COPYING ChangeLog Makefile.in \\

    makefile.pc configure configure.in \\

    tar.texinfo tar.info* texinfo.tex \

    tar.port.h open3.h getopt.h regex.h \

    rmt.h rmt rtapelib.c allocate.c \\

    msd_dir.h dir.c tcexpang.c \\

    level-0 level-1 backup-specs testpad.c

    all:

    tar r tar.info

    tar:\ $(OBJS)

    $(CC) $(LDFLAGS) -o $@ $(OBJS) $(LIBS)

    rmt:

    rmt.c

    $(CC) $(CFLAGS) $(LDFLAGS) -o $@ rmt.c

    tar.info: tar.texinfo

    makeinfo tar.texinfo

    install: all

    $(INSTALL) tar $(bindir)/$(binprefix)tar

    -test ! -f rmt || $(INSTALL) rmt /etc/rmt

    $(INSTALLALDA) $(srcdir)/tar.info* $(infodir)

    $(OBJS): tar.h port.h testpad.h

    regex.o buffer.o tar.o: regex.h

    # getdate.y has shift/reduce conflicts

    testpad.h: testpad

    ./testpad

    testpad: testpad.o

    $(CC) -o $@ testpad.o

    TAGS: $(SRCS)

    etags $(SRCS)

    clean:

    rm -f *.o tar rmt testpad testpad.h core

    ```'
