    be made. A file can be “made” if it is mentioned in the Makefile as a target or
    a prerequisite, or if an implicit rule can be recursively found for how to make.
    When an implicit prerequisite is the result of another implicit rule, we say that
    *chaining* is occurring. See Section 10.4 [Chains of Implicit Rules], page 108.


