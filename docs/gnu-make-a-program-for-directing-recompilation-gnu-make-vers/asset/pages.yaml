  md: '```

    comma := =

    empty =

    space := $(empty) $(empty)

    foo := a b c

    bar := $(subst $(space),$(comma),$(foo))

    # bar is now ''a,b,c''.

    ```


    Here the subst function replaces each space with a comma, through the value of
    foo, and substitutes the result.


    # 8.2 Functions for String Substitution and Analysis


    Here are some functions that operate on strings:


    ```

    $(subst from,to,text)

    ```


    Performs a textual replacement on the text text: each occurrence of from is replaced
    by to. The result is substituted by the function call. For example,


    ```

    $(subst ee,EE,feet on the street)

    ```


    substitutes the string ''fEEt on the strEEt''.


    ```

    $(patsubst pattern,replacement,text)

    ```


    Finds whitespace-separated words in text that match pattern and replaces them
    with replacement. Here pattern may contain a ''%'' which acts as a wildcard, matching
    any number of characters within a word. If replacement also contains a ''%'',
    the ''%'' is replaced by the text that matched the ''%'' in pattern. Only the
    first ''%'' in the pattern and replacement is treated this way; any subsequent
    ''%'' is unchanged.


    ''%'' characters in patsubst function invocations can be quoted with preceding
    backslashes (''\''). Backslashes that would other-quote ''%'' characters can be
    quoted with more backslashes. Backslashes that quote ''%'' characters or other
    backslashes are removed from the pattern before it is compared file names or Backslashes
    that are not in danger of quoting ''%'' characters go unmolested. For example,
    the pattern ''the\weird\%pattern'' has ''the\weird%'' preceding the operative
    ''%'' character, and ''pattern'' following it. The final two backslashes are left
    alone because they cannot affect any character.


    Whitespace between words is folded into single space characters; leading and trailing
    whitespace is discarded. For example,


    ```

    $(patsubst %.c,%.o,x.c.o bar c)

    ```


    produces the value ''x.c.o bar''.'
