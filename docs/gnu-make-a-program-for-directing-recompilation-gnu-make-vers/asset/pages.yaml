  md: '# CFLAGS=-g


    Each time you run make, you can override this value if you wish. For example,
    if you say ''make CFLAGS=''-g -0'''', each compilation will be done with ''cc
    -c -0''. (This also illustrates how you can use quoting in the shell to enclose
    spaces and special characters in the value of a variable when you override it).


    The variable CFLAGS is only one of many standard variables that exist just so
    that you can change this way. See Section 10.3 [Variables Used by Implicit Rules],
    page 106, for a complete list.


    You can also program the makefile to include additional variables of your own,
    giving you the ability to control other aspects of the makefile works by changing
    the variables.


    When you order a variable with a command argument, you can define a recursively-expanded
    variable or a simply-expanded variable. The examples show how a recursively-expanded
    variable; to make a simply-expanded variable, write '':='' instead of ''=''. But,
    if you want to include a variable reference or function call in the value that
    you specify, it makes no difference which kind of variable you create.


    There is one way that the makefile can change a variable that you have overridden.
    This is to use the override directive, which is a line that looks like: ''override
    variable = value'' (see Section 6.7 [The override Directive], page 65).


    # 9.6 Testing the Compilation of a Program


    Normally, when an error happens in executing a shell command, make gives up immediately,
    returning a nonzero status. No further commands are executed for any target. The
    error implies implies that the goal cannot be correctly remade, and make reports
    this as soon as it knows.


    When you are compiling a program that you have just changed, this is not what
    you want. Instead, you would rather make try compiling every file that can be
    changed, to show as many compilation errors as possible.


    On these occasions, you should use the ''-k'' or ''--keep-going'' flag. This tells
    make to continue to consider the other prerequisites of the pending targets, remaking
    them if necessary, before it gives up and returns nonzero. For example, after
    an error in compiling one object file, ''make -k'' will continue compiling other
    object files even though it knows that linking will be impossible. In addition
    to continuing after failed commands, ''make -k'' will continue as much as possible
    after discovering that it does not know how to make a target or prerequisite file.
    This will always cause an error message (see Section 9.7 [Summary of Options],
    page 95).


    The usual behavior of make assumes that your purpose is to get the goals up to
    date; once make learns that this is impossible, it might well report'
