    # 4.2.3 The Function wildcard


    Wildcard expansion happens automatically in rules. But wildcard expansion does
    not normally take place when a variable is set, or inside the arguments of a function.
    If you want to do wildcard expansion in such places, you need to use the wildcard
    function, like this:


    ```

    $$(wildcard pattern..)

    ```


    This string, anywhere in a Makefile, is replaced by a space-separated list of
    existing files that match one of the given file patterns. If no existing file
    name matches a pattern, then that pattern is omitted from the output of the wildcard
    function. Note that this is different from how unmatched wildcards behave in rules,
    where they are used verbatim than ignored (see Section 4.2.2 [Wildcard Pitfall],
    page 21).


    One use the wildcard function is to get a list of all the C source files in a
    directory, like this:


    ```

    $$(wildcard *.c)

    ```


    We can change the list of C source files into a list of object files by replacing
    the `.c` suffix with `%.o` in the result, like this:


    ```

    $$(patsubst %.c,%.o,$(wildcard *.c))

    ```


    (Here we have used another function, patsubst. See Section 8.2 [Functions for
    String Substitution and Analysis], page 76.)nA to compile all C source files in
    the directory and link them together could be written as follows:


    ```

    objects := $(patsubst %.c,%.o,$(wildcard *.c))

    ```


    ```

    foo : -o foo $(objects)

