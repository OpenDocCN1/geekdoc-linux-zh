    prerequisites, that file will always be remade (Section 4.1 [Double-Colon], page
    37). In the case of makefiles, a makefile that has a double-colon rule with commands
    but no prerequisites will be remade every time make is run, and then again after
    make starts and reads the makefiles again. This would cause an infinite loop:
    make would constantly remake the makefile, and never do anything else. So, to
    avoid this, make will not attempt to remake makefiles which are specified as targets
