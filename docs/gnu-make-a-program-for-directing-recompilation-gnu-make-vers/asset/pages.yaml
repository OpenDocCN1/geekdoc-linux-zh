  md: '# 14 Makefile Conventions


    This chapter describes conventions for writing the Makefiles for GNU programs.
    Using Automotify will help you write a Makefile that follows these conventions.


    # 14.1 General Conventions for Makefiles


    Every Makefile should contain this line:


    ```

    SHELL = /bin/sh

    avoid trouble on systems where the SHELL variable might be inherited from the
    environment. (This is never a problem with GNU make.)

    ```


    Different make programs have incompatible suffix lists, and sometimes this creates
    confusion or misbehavior. So it is a good idea to set the suffix list explicitly
    using only the suffixes you need in the particular Makefile, like this:


    ```

    .SUFFIXES:

    .SUFFIXES: .c .o

    ```


    The first line clears out the suffix list, the second introduces all suffixes
    which may be subject to implicit rules in this Makefile.


    Don''t assume ''.'' is in the path for command execution. When you need to run
    programs that are a part of your package during the make, please make sure that
    it uses ''./'' if the program is built as part of the make or ''$(srcdir)'' if
    the file is an unchanging part of the source code. Without one of these prefixes,
    the current search path is used.


    The distinction between ''./ (the build directory) and ''$(srcdir)/ (the source
    directory) is important because users can build in a separate directory using
    the ''--srcdir'' option to ''configure''. A rule of the


    ```

    foo.1: man sedcript

    sed -e sedscript foo.man > foo.1

    ```


    will fail when the build directory is not the source directory, because ''foo.man''
    and ''sedscript'' are in the source directory.


    When GNU make, relying on ''VPATH'' to find the source file will work in the case
    where there is a single dependency file, since the make automatic variable ''$<''
    will represent the source file wherever it is. (Many versions of make set ''$<''
    to only in implicit rules.) A Makefile target like


    ```

    foo.o: bar.c

    $(CC) -I-$(srcdir) $(CFLAGS) -c bar.c -o foo.o

    ```


    should be written as


    ```

    foo.o: bar.c

    $(CC) -I-$(srcdir) $(CFLAGS) -c $< -o $$

    ```'
  merge: -1
