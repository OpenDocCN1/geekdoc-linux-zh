    \ use customary techniques so that you do not have to specify them in detail when\
    \ you want to use them. For example, there is an implicit rule for C compilation.\
    \ File names determine which rules are run. For example, C compilation typically\
    \ takes a '.c' file and makes a '.o' file. So make applies the implicit rule for\
    \ C compilation when it sees this combination of file name endings.\n\nA chain\
    \ of implicit rules can apply in sequence; for example, make will remake a '.o'\
    \ file from a '.y' file by way of a '.c' file. See Section 10.4 [Chains of Implicit\
    \ Rules], page 108.\n\nThe built-in implicit rules use several variables in their\
    \ commands so that, by changing the values of the variables, you can change the\
    \ way the implicit rule works. For example, the variable CFLAGS controls the flags\
    \ given to the C compiler by the implicit rule for C compilation. See Section\
    \ 10.3 [Variables Used by Implicit Rules], page 106.\n\nYou can define your own\
    \ implicit rules by writing pattern rules. See Section 10.5 [Defining and Redefining\
    \ Pattern Rules], page 109.\n\nSuffix rules are a more limited way to define implicit\
    \ rules. Pattern rules are more general and clearer, but suffix rules are retained\
    \ for compatibility. See Section 10.7 [Old-Fashioned Suffix Rules], page 117.\n\
    \n# 10.1 Using Implicit Rules\n\nFor example, suppose the makefile looks like\
