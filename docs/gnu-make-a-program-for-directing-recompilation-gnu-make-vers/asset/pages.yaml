    # 4.8 Multiple Targets in a Rule


    A rule with multiple targets is equivalent to writing many rules, each with one
    target, and all identical aside from that. The same commands apply to all the
    targets, but their effects vary because you substitute the actual target name
    into the command using ''$0''. The rule contributes the same prerequisites to
    all the targets.


    This is useful in two cases.


    +   - You want prerequisites, no commands. For example:

    ```

    kbd.o command.o files.o: command.h

    ```ngives an additional prerequisite to each of the three object files mentioned.


    +   - Similar commands works for all the targets. The commands do not need to
    be absolutely identical, since the automatic variable ''$0'' can be used to substitute
    the particular target to be remade into the commands (see Section 10.5.3 [Automatic
    Variables], page 111). For example:

    ```

    bigoutput : text.g

    generate text.g -$(sub output,$0) > $0

    ```nis equivalent to

    ```

    bigoutput : text.g

    generate text.g -big > bigint

    littleoutput : text.g

    generate text.g -little > littleoutput

    ```


    We assume the hypothetical program generate two types of output, one given ''big''
    and one given ''little''. See Section 8.2 [Functions for String Substitution and
    Analysis], page 76, for an explanation of the subst function.


    Suppose you would like to vary the prerequisites according to the target, much
    as the variable ''$0'' allows you to vary the commands. You cannot do this with
    multiple targets in an ordinary rule, but you can do it with a static pattern
    rule. See Section 4.10 [Static Pattern Rules], page 34.


    # 4.9 Multiple Rules for One Target


    One file can be the target of several rules. All the prerequisites mentioned in
    all the rules are merged into one list of prerequisites for the target. If the
    target is older than any prerequisite from any rule, the commands are executed.'
