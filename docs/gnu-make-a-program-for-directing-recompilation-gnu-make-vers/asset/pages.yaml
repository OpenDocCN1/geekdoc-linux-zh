  md: '# 8.3 Functions for File Names


    Several of the built-in expansion functions relate specifically to taking apart
    file names or lists of file names.


    Each of the following functions performs a specific transformation on a file name.
    The argument of the function is regarded as a series of file names, separated
    by whitespace. (Leading and trailing whitespace is ignored.) Each file name in
    the series is transformed in the same way and the results are concatenated with
    single spaces between them.


    ```

    $$(dir names...)

    ```


    Extracts the directory-part of each file name in names. The directory-part of
    the file name is everything up through (and including) the last slash in /. If
    the file name contains no slash, the directory part is the string ''.''. For example,


    ```

    $$(dir src/foo.c hacks)

    ```


    produces the result ''src/''.


    ```

    $$(notdir names...)

    ```


    Extracts all but the directory-part of each file name in names. If the file name
    contains no slash, it is left unchanged. Otherwise, everything through the last
    slash is removed from it.


    A file name that ends with a slash becomes an empty string. This is unfortunate,
    because it means that the result does not always have the same number of whitespace-separated
    file names as the argument had; but we do not see any other valid alternative.


    For example,


    ```

    $$(notdir src/foo.c hacks)

    ```


    produces the result ''foo.c hacks''.


    ```

    $$(suffix names...)

    ```


    Extracts the suffix of each file name in names. If the file name contains a period,
    the suffix is everything starting with the last period. Otherwise, the suffix
    is the empty string. This frequently means that the result will be empty when
    names is not, and if names contains multiple file names, the result may contain
    fewer file names.


    For example,


    ```

    $$(suffix src/foo.c src-1.0/bar.c)

    ```


    produces the result ''.c''.


    ```

    $$(basename names...)

    ```


    Extracts all but the suffix of each file name in names. If the file name contains
    a period, the basename is everything starting up to (and not including) the last
    period. Periods in the directory'
