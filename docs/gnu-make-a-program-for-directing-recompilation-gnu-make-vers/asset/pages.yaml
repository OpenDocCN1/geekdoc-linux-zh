  md: '# Appendix B Errors Generated by Make


    Here is a list of the more common errors you might see generated by make, and
    some information about what they mean and how to fix them.


    Sometimes errors are not fatal, especially in the presence of a -prefix on a command
    line script, or the -k command line option. Errors that are fatal are prefixed
    with the string ***.


    Error messages are all either prefixed with the name of the program (usually ''make''),
    or if the error is found in a makefile, the name of the file and linenumber containing
    the problem.


    In the table below, these common prefixes are left off.


    +   - ''[foo] Error NN''

    - ''[foo] signal description


    These errors are not really making errors at all. They mean that a program that
    make invoked as part of a command script returned a non-0 error code (''Error
    NN''), which make interprets as failure, or it exited in some other abnormal fashion
    (with a signal of some type). See Section 5.4 [Errors in Commands], page 44.


    If no *** is attached to the message, then the subprocess failed but the rule
    in the makefile was prefixed with the - special character, so make ignored the
    error.


    +   - ''missing separator. Stop.''

    - ''missing separator (did you mean TAB instead of 8 spaces?). Stop.''


    This means that make could not understand much of anything about the command it
    just read. GNU make looks for various kinds of separators (:, =, TAB characters,
    etc.) to help decide what kind of commandline it is. This means it couldn''t find
    a valid one.


    One of the most common reasons for this message is that you (or your oh-so-helpful
    editor, as is the case with many MS-Windows editors) have attempted to indent
    your command scripts instead of a TAB character. In this case, make will use the
    second form of the error above. Remember that every line in the command script
    must begin with a TAB character. Eight spaces do not count. See Section 4.1 [Rule
    Syntax], page 19.


    +   - ''commands commence before first target. Stop.''

    - ''missing rule before commands. Stop.''


    This means the first thing in the makefile seems to be part of a command script:
    it begins with a TAB character and doesn''t appear to a legal make command (such
    as a variable assignment). Command scripts must always be associated with a target.'
