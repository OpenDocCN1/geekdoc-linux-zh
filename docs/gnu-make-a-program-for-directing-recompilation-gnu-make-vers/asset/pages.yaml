    Variables defined with ''::='' are recursively expanded variables; these definitions
    can contain variable references which will be expanded before the definition is
    made. See Section 6.2 [The Two Flavors of Variables], page 56.

    The variable name may contain function and variable references, which are expanded
    when the line is read to find the actual variable name to use.

    There is no limit on the length of the value of a variable except the amount of
    swapping space on the computer. When a variable definition is long, it is a good
    idea to break it into several lines by inserting backslash-newline at convenient
