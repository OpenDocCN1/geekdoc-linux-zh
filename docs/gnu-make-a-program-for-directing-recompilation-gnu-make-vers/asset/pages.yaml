  md: 'Pattern rules using ''%''. This has been implemented in several versions of
    make. We''re not sure who invented it first, but it''s spread around a bit. See
    Section 10.5 [Defining and Redefining Pattern Rules], page 109.


    Rule chaining and implicit intermediate files. This was implemented by Stu Feldman
    in his version of make for AT&T Eighth Edition Research Unix, and later by Andrew
    Hume of AT&T Bell Labs in his mk program (where he terms ''transitive closure'').
    We do not really know if we got this from either of them or thought it up at the
    same time. Section 10.4 [Chains of Implicit Rules], page 108.


    The automatic variable $^ containing a list of all prerequisites of the current
    target. We did not invent this, but we have no idea who did. Section 10.5 [Automatic
    Variables], page 111. The automatic variable $+ is a simple extension of $$.


    The ''what if'' flag -w (in GNU make) was (as far as we know) invented by Andrew
    Hume in mk. See Section 9.3 [Instead of Executing Commands], page 91.


    The concept of doing several things at once (parallelism) exists in many incarnations
    of make and similar programs, though not in the System V or BSD implementations.
    See Section 5.2 [Command Execution], page 41.


    Modified references using pattern substitution come from SunOS 4. See Section
    6.1 [Basics of Variable References], page 55. This functionality was provided
    in GNU make by the patsub function before the alternate syntax was implemented
    for compatibility with SunOS 4. It is not altogether clear who inspired whom,
    since GNU make made patsub before SunOS 4 released.


    The special significance of ''+'' characters preceding command lines (see Section
    9.3 [instead of Executing Commands], page 91) is mandated by IEEE Standard 1003.2-1992
    (POSIX.2).


    The ''='' syntax to append the value of a variable comes from SunOS 4 make. See
    Section 6.6 [Appending Text to Variables], page 63.

    The syntax ''archive'' (mem1 mem2...) to list multiple members in a single file
    comes from SunOS 4 make. See Section 11.1 [Archive Members], page 121.


    The --include directive to include makefiles without error for a nonexistent file
    comes from SunOS 4 make. (But note that SunOS 4 does not allow multiple makefiles
    to be specified in one --include.) The same feature appears with the name sincinclude
    in SGI make and perhaps others.


    The remaining features are inventions in GNU make:


    +   Use the --v or --version option to print version and copyright information.


    +   Use the -h or --help option to summarize the options to make.'
