  md: 'Chapter 12: Features of GNU make


    125


    # # Features of GNU make


    Here is a summary of the features of GNU make, for comparison with and credit
    to other versions of make. We consider the features of make in 4.2 BSD systems
    as a baseline. If you are concerned with writing portable makefiles, you should
    not use the features of make listed here, not the ones in Chapter 13 [Missing],
    page 129.


    Many features come from the version of make in System V.


    +   * The VPATH variable and its special meaning. See Section 4.3 [Searching Directories
    for Prerequisites], page 22. This feature exists in System V make, but is undocumented.
    It is documented in 4.3 BSD make (which mimics System V''s VPATH feature).


    +   * Included makefiles. See Section 3.3 [Including Other Makefiles], page 12.
    Allowing multiple files to be included with a single directive is a GNU extension.


    +   * Variables are read from communicated via the environment. See Section 6.9
    [Variables from the Environment], page 46.


    +   * Options passed through the variable MAKEFLAGS to recursive invocations of
    make. See Section 5.6.3 [Communicating Options to a Sub-make], page 49.


    +   * The automatic variable % is to the member name in an archive reference.
    See Section 10.5.3 [Automatic Variables], page 111.


    +   * The automatic variables $, *,, %, and ? have corresponding forms like ($OF)
    and ($OD). We have generalized this to ^ as an obvious extension. See Section
    10.5.3 [Automatic Variables], page 111.


    +   * Substitution references. See Section 6.1 [Basics of Variable References],
    page 55.


    +   * The command-line options ''-b'' and ''-m'', accepted and ignored. In System
    V make, these options actually do something.


    +   * Execution of recursive commands to run make via the variable MAKE if ''-n''
    or ''-q'' is specified. See Section 5.6 [Recursive Use of make], page 46.


    +   * Support for suffix ''.a'' in suffix rules. See Section 11.4 [Archive Rules],
    page 123. This feature is obsolete in GNU make, because the general feature of
    rule chaining (see Section 10.4 [Chains of Implicit Rules], page 108) allows one
    pattern for installing members in an archive (see Section 11.2 [Archive Update],
    page 121) to be sufficient.


    +   * The arrangement of lines and backslash-combination commands is retained
    when the commands are printed, so they appear as they do in the makefile, except
    for the stripping of initial whitespace.


    The following features were inspired by various versions of make. In some cases
    it is unclear exactly which versions inspired others.'
