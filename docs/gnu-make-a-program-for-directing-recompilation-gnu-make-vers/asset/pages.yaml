  md: '# Chapter 14: Makefile Conventions


    Delete ''.dvi'' files here if they are not part of the distribution.


    ''distclean''


    Delete all files from the current directory that are created by configuring or
    building the program. If you have unpacked the source and built the program without
    creating any other files, ''make distclean'' should leave only the files that
    were in the distribution.


    ''mostlyclean''


    Like ''clean'', it may refrain from deleting a few files that people normally
    don''t want to recompile. For example, the ''mostlyclean'' target for GCC does
    not delete ''libgcc.a'', because recompiling it is rarely necessary and takes
    a lot of time.


    ''maintainer-clean''


    Delete almost everything from the current directory that can be reconstructed
    with this Makefile. This typically includes everything deleted by distclean, plus
    more: C source files produced by Bison, tags tables, info files, and so on.


    The reason we say ''almost everything'' is that running the command ''make maintainer-clean''
    should not delete ''configure'' even if ''configure'' can be remade using a rule
    in the Makefile. More generally, ''make maintainer-clean'' should not delete anything
    that needs to exist in order to run ''configure'' and then begin to build the
    program. This is the only exception; maintainer-clean delete everything else that
    can be rebuilt.


    The ''maintainer-clean'' target is intended to be used by a maintainer of the
    package, not by ordinary users. You may need special tools to reconstruct some
    of the files that ''make maintainer-clean'' deletes. Since these files are normally
    included in the distribution, we don''t care to make them easy to reconstruct.
    If you find you need to unpack the full distribution again, don''t blame us.


    To help users aware of this, the commands for the special maintainer-clean target
    start with these two:


    > > echo This command is intended for maintainers to use;

    > echo deletes files that may need special tools to rebuild.


    ''TAGS''


    Update a info table for this program.


    ''info''


    Generate any Info files needed. The best way to write the rules is as follows:


    ```

    info: foo.info

    ```


    ```

    foo.info: foo.texi chap1.texi chap2.texi

    ```'
