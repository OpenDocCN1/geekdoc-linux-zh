  md: "# Chapter 14: Makefile Conventions\n\ninstallcheck\n\nPerform installation\
    \ tests (if any). The user must build and install the program before running the\
    \ tests. You should assume that '$(bindir)' is in the search path.\n\ninstalldirs\n\
    \nIt's useful to add a target named 'installdirs' to create the directories where\
    \ files are installed, and their parent directories. There is a script called\
    \ 'mkinstldirs' which is convenient for this; you can find it in the Texinfo package.\
    \ You can use a rule like this:\n\n```\n# make sure all installation directories\
    \ (e.g. $(bindir))\n# actually exist by making them necessary.\ninstalldirs: mkinstldirs\n\
    \n$(srcdir)/mkinstldirs $(bindir) $(datadir) \\\n  $(libdir) $(infodir) \\\n \
    \ $(mandir)\n```\n\nor, if you wish to support DESTDIR,\n\n```\n# make sure all\
    \ installation directories (e.g. $(bindir))\n# actually exist by making them necessary.\n\
    installdirs: mkinstldirs\n\n$(srcdir)/mkinstldirs \\\n  $(DESTDIR)$(bindir) $(DESTDIR)$(datadir)\
    \ \\\n  $(DESTDIR)$(libdir) $(DESTDIR)$(infodir) \\\n  $(DESTDIR)$(mandir)\n```\n\
    \nThis rule should not modify the directories where compilation is done. It should\
    \ do nothing but create installation directories.\n\n# 14.6 Install Command Categories\n\
    \nWhen writing the install target, you must classify all the commands into three\
    \ categories: normal ones, pre-installation commands and post-installation commands.\n\
    \nNormal commands move files into their proper places, and set their modes. They\
    \ may not alter any files except the ones that entirely from the package they\
    \ belong to.\n\nPre-installation and post-installation commands may alter other\
    \ files; in particular, they can edit global configuration files or data databases.\n\
    \nPre-installation commands are typically executed before the normal commands,\
    \ and post-installation commands are typically run after the normal commands.\n\
    \nThe most common use for a post-installation command is to run install-info.\
    \ This cannot be done with a normal command, as it alters a file (the Info directory)\
    \ which does not come entirely and solely from the package"
