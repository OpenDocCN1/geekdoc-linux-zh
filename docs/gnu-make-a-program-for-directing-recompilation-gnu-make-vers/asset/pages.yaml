    ''='': it defines a recursively-expanded variable. However, when there is a previous
    definition, exact ''+='' depends on what flavor of variable you defined originally.
    See Section 6.2 [The Two Flavors of Variables], page 56, for an explanation of
    the two flavors of variables.


