  md: '# Chapter 14: Makefile Conventions


    If you use symbolic links, you should implement a fallback for systems that don''t
    have symbolic links.


    Additional utilities that can be used via Make variables are:


    ```

    chgrp chmod own mknod

    ```


    It is ok to use other utilities in Makefile portions (or scripts) intended for
    particular systems where you know which utilities exist.


    # 14.3 Variables for Specifying Commands


    Makefiles should provide variables for overriding certain commands, options, and
    so on.


    In particular, you should run most utility programs via variables. Thus, if you
    use Bison, a variable named BISON whose default value is set with ‘BISON = bison’,
    and refer to it with $(BISON) whenever you need to use Bison.


    File management utilities such as ln, rm, mv, and so on, need not be referred
    to through variables in this way, since users don''t need to replace them with
    other programs.


    Each program-name variable should come with an options that is used to supply
    options to the program. Append `FLAGS` to the program-name variable to get the
    options variable—for example, BINFLAGS. (The names CFLAGS for the C compiler,
    YFLAGS for yacc, and LFLAGS for lex, are exceptions to this rule, but we keep
    them because they are standard.) Use CPPFLAGS in any compilation command that
    runs the preprocessor, and LDFLAGS in any compilation command that does linking
    as well as in direct use of 1d.


    If there are C options that must be used for proper compilation of certain files,
    do not include them in CFLAGS to be able to specify CFLAGS themselves. Instead,
    arrange to pass the necessary options to the C compiler independently of CFLAGS,
    by writing explicitly in the compilation commands or by defining an implicit rule,
    like this:


    ```

    CFLAGS = -G

    ALL_CFLAGS = -I. $(CFLAGS)

    .o: %.c -c $(CPPFLAGS) $(ALL_CFLAGS) $

    ```


    Do include the ‘g’ option in CFLAGS, because that is not required for proper compilation.
    You can consider a default that is only recommended. If the package is set up
    so that it is compiled with GCC by default, then you might include well ‘-O’ in
    the default value of CFLAGS as well.


    Put CFLAGS last in compilation command, after other variables containing compiler
    options, so the user can use CFLAGS to override the others.


    CFLAGS should be used in every invocation of the C compiler, both those which
    compilation and those which linking.'
