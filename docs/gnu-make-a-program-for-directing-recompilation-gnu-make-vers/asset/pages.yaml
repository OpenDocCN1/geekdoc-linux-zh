    When you use the ''-t'' or ''--touch'' option (see Section 9.3 [Instead of Executing
    the Commands], page 91), you would not want to use an out-of-date makefile to
    decide which targets to touch. The ''-t'' option has no effect on updating makefiles;
    they are really updated if ''-t'' is specified. Likewise, -q (or ''--question'')
    and -n (or ''--just-print'') do prevent updating makefiles, because an out-of-date
    makefile would result in the wrong output for other targets. Thus, make -f mfile
    -n foo will update ''makefile'', read it in, and then print the commands to update
    ''foo'' and its prerequisites without running. The commands printed for ''foo''
    will be specified in the updated contents of ''makefile''.


    However, on occasion you might wish to prevent updating of even the makefiles.
    You can do this by specifying the makefiles as goals in the command line as well
    as specifying them as makefiles. When the makefile name is explicitly specified
    as a goal, the options ''-t'' and so on apply to them.


    Thus, make -f mfile -n foo would read the ''makefile'', print the commands needed
    to update it without actually running them, and then print the commands needed
    to update ''foo'' without running them. The commands for ''foo'' will be specified
    by the existing contents of ''makefile''.


    # 3.6 Overriding Pat Of Another Makefile


    Sometimes it is useful to have a makefile that is mostly like another makefile.
    You can often use the ''include'' directive to include one in the other, and add
    more targets or variable definitions. However, if the two makefiles give different
    commands for the same target, make will not let you just do this. There is another
    way.


    In the containing makefile (the one that wants to include the other), you can
    use a match-any pattern rule to say that to remake any target that cannot be made
    from the information in the containing makefile, make should look in another makefile.
    See Section 10.5 [Pattern Rules], page 109, for more information on pattern rules.


    For example, if you have a makefile called ''Makefile'' that shows how to make
    the target ''foo'' (and other targets), you can write a makefile called ''makefile''
    that contains:


    foo: *'
