  md: 'Chapter 13: Incompatibilities and Missing Features


    # 13 Incompatibilities and Missing Features


    The make programs in various other systems support a few features that are not
    implemented in GNU make. The POSIX 2.standard (IEEE Standard 1003.2-1992) which
    specifies make does not require any of these features.


    +   A target of the form ''file((entry))'' stands for a member of archive file
    file. The member is chosen, not by name, but by being an object file which defines
    the linker symbol entry.


    This feature was not put into GNU make because of the nonmodularity of putting
    knowledge into make of the internal format of archive file tables. See Section
    11.2.1 [Updating Archive Directories], page 122.


    +   Suffixes (used in suffix rules) that end with the character ''-'' have a special
    meaning to System V make; they refer to the SCCS file that corresponds to the
    file one would get without the ''-''. For example, the suffix rule ''.c'' makes
    the file ''n.o'' from the SCCS file ''s.n.c''. For complete coverage, a series
    of suffix rules is required. See Section 10.7 [Old-Fashioned S Rules], page 117.


    In GNU make, this entire series of cases is handled by two rules for extraction
    from SCCS, in combination with the general feature of rule chaining. See Section
    10.4 [Chains of Implicit Rules], page 108.


    +   In System V make, the string ''$$'' has the strange meaning that, in the prerequisites
    of make with multiple targets, it stands for the particular target that is processed.


    This is not defined in GNU make because ''$$'' would always stand for an ordinary
    ''$''.


    It is possible to get portions of this functionality through the use of static
    pattern rules (see Section 4.10 [Static Pattern Rules], page 34). The System V
    make rule:


    ```

    $(targets): $$.o lib.a

    ```


    can be replaced with the GNU make static pattern rule:


    ```

    $(targets): %.o lib.a

    ```


    +   In System V and 4 BSD make files, found by VPATH search (see Section 4.3 [Searching
    Directories for Prerequisites], page 22) have their names changed inside command
    strings. We feel it is cleaner to use automatic variables and thus make this feature
    obsolete.


