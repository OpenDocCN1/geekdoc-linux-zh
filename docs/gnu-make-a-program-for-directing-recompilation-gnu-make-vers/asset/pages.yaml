  md: '# 5.7 Defining Canned Command Sequences


    When the same sequence of commands is useful in making various targets, you can
    define it as a canned sequence with the define directive, and refer to the canned
    sequence from the rules for those targets. The canned sequence is actually a variable,
    so the name must not conflict with other variable names.


    Here is an example of defining a canned sequence of commands:


    ```

    define run-yacc

    yacc $$(firstword $)

    mv y.tab.c $$

    defef

    ```


    Here run-yacc is the name of the variable being defined; undef marks the end of
    the definition; the lines in between are the commands. The define directive does
    not expand variable references and function calls in the canned sequence; the
    ''$'' characters, parentheses, variable names, and so on, all become part of the
    value of the variable you are defining. See Section 6.8 [Defining Variables Verbatim],
    page 65, for a complete explanation of define.


    The first command in this example runs Yacc on the first prerequisite of whichever
    rule uses the canned sequence. The output file from Yacc is always ''y.tab.c''.
    The second command moves the output to the rule''s target file name.


    To use the canned sequence, substitute the variable into the commands of a rule.
    You can substitute it like any other variable (see Section 6.1 [Basics of Variable
    References], page 55). Because variables defined by define are recursively expanded,
    all the variable references you write inside define are expanded now. For example:


    ```

    foo. : foo.y

    $(run-yacc)

    ```


    ''foo.y'' will be substituted for ''$'' when it occurs in run-yacc''s value, and
    ''foo.c'' for ''$$''.


    This is a realistic example, but this one is not needed in practice because make
    has an implicit rule to figure out these commands based on the files involved
    (see Chapter 10 [Using Implicit Rules], page 101).


    In command execution, each line of a canned sequence is treated as if the line
    appeared on its own in the line, preceded by a tab. In particular, make invokes
    a special subshell for each line. You can use the special prefix characters that
    affect command lines (''$0'', ''-'', and ''+'') on each line of a canned sequence.
    See Chapter 5 [Writing the Commands in Rules], page 41.


    For example, using this canned sequence:


    ```

    define frobicate

    @echo "frobicating target $$"

    frob-step-1 $$ -o $$-step-1

    frob-step-2 $$-step-1 -o $$$

    defef

    ```'
  merge: -1
