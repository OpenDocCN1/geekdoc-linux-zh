  md: '# Chapter 3: Writing Makefiles


    # 3 Writing Makefiles


    The information that tells make how to recompile a system comes from reading a
    data base called the myfile.


    # 3.1 What Makefiles Contain


    Makefiles contain five kinds of things: explicit rules, implicit rules, vari-able
    definitions, directives, and comments. Rules, variables, and directives are described
    at length in later chapters.


    +   - An explicit rule says when and how to remake one or more files, called the
    rule’s targets. It lists the other files that the targets depend on, call the
    prerequisites of the target, and may also give commands to use or update the targets.
    See Chapter 4 [Writing Rules], page 19.

    - An implicit rule says when and how to remake a class of files based on their
    names. It describes how a target may depend on a file with a name similar to the
    target and gives commands to create or update such a target. See Chapter 10 [Using
    Implicit Rules], page 101.

    - A variable definition is a line that specifies a string value for a variable
    that can be substituted into the text later. The simple myfile example shows a
    variable definition for objects as a list of all object files (see Section 2.4
    [Variables Makefiles Simpler], page 6).

    - A directive is a command for make to do something special while reading the
    myfile. These include:


    +   - Reading another myfile (see Section 3.3 [Including Other Make-files], page
    12).

    - Deciding (based on the values of variables) whether to use or ig-nore a part
    of the myfile (see Chapter 7 [Conditional Parts of Make], page 69).

    - Defining a variable from a string containing multiple lines (see Section 6.8
    [Defining Variables Verbatim], page 65).


    +   - ''#'' in a line of a myfile starts a comment. And the rest of the line are
    ignored, except that a trailing backslash not escaped by another backslash will
    continue the comment across multiple lines. Comments may appear on any of the
    lines in the myfile, within a define directive, and perhaps in within commands
    (where the shell decides what is a comment). A line containing just a comment
    (with perhaps spaces before it) is effectively blank, and is ignored.


    # 3.2 What Name to Give Your Makefile


    By default, when make looks for the myfile, it tries the following names, in order:
    ''GNU'', ''makefile'' and ''Makefile''.'
