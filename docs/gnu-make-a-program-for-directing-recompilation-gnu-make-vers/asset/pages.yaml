  md: '# Chapter 6: How to Use Variables 65


    # 6.7 The override Directive


    If a variable has been set with a command argument (see Section 9.5 [Overriding
    Variables], page 93), then ordinary assignments in the makefile are ignored. If
    you want to set the variable in the makefile even though it was set with a command
    argument, you can use an override directive, which is a line that looks like this:


    ```

    override variable = value

    ```


    or


    ```

    override variable := value

    ```


    To append more text to a value defined on the command line, use:

    override variable += more text


    See Section 6.6 [Appending More Text to Variables], page 63.


    The override directive was not invented for escalation in the war between makefiles
    and command arguments. It was invented so you can alter and add to values that
    the user specifies with command arguments.


    For example, suppose you always want the ''-g'' switch when you run the C compiler,
    but you would like to allow the user to specify the other switches with a command
    argument as usual. You could use this override directive:


    ```

    override CFLAGS += -g

    ```


    You can also use override directives with define directives. This is done as you
    might expect:


    ```

    override define foo

    bar

    def

    ```


    See the next section for information about define.


    # 6.8 Defining Variables Verbatim


    Another way to set the value of a variable is to use the define directive. This
    directive has an unusual syntax which allows newline characters to be included
    in the value, which is convenient for defining sequences of commands (see Section
    5.7 [Defining Canned Command Sequences], page 52).


    The define directive is followed on the same line by the name of the variable
    and nothing. The value to give the variable appears on the following lines. The
    end of the value is marked by a line containing the word endif. Aside from this
    difference in syntax, define works just like ''='': it creates a recursively-expanded
    variable (see Section 6.2 [The Two Flavors of Variables], page 56). The variable
    name may contain function and variable references, which are expanded when the
    directive is read to find the actual name to use.'
