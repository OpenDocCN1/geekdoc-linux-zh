    # 10.7 Old-Fashioned Suffix Rules


    Suffix rules are the old-fashioned way of defining implicit rules for make. Suffix
    rules are obsolete because pattern rules are more general and clearer. They are
    supported by GNU make for compatibility with old makefiles. They come in two kinds:
    double-suffix and single-suffix.


    A double-suffix rule is defined by a pair of suffixes: the target suffix and the
    source suffix. It matches any file whose name ends with the target suffix. The
    corresponding implicit prerequisite is made by replacing the target suffix with
    the source suffix in the file name. A rule whose suffixes are ''.o'' and ''.c''
    is equivalent to the pattern %.o:%c.


    A single-suffix rule is defined by a single suffix, which is the source suffix.
    It matches any file name, and the corresponding implicit prerequisite name is
    made by appending the source suffix. A single-suffix rule whose suffix is ''.c''
    is equivalent to the pattern %:%c.


    Suffix rules are recognized by comparing each rule''s target against a defined
    suffix. When make sees a known suffix, this rule is considered a single-suffix
    rule. When make sees a rule whose target two known suffixes concatenated, this
    rule is taken as a double-suffix rule.


    For example, ''.c'' and ''.o'' are both on the default list of known suffixes.
    Therefore, if you define a rule whose target is ''.o'', make takes it to be a
    double-suffix rule with source suffix ''.c'' and target suffix ''.o''. Here is
    the old-fashioned way to define the rule for compiling a C source file:


    ```

    .c.o:

    $(CC) -c $(CFLAGS) $(CPPLAGS) -o $$ $< $

    ```


    Suffix rules cannot have any prerequisites of their own. If they have any, they
    are treated as normal files with funny names, not as suffix rules. Thus, the rule:


    ```

    .c.o: foo.h

    $(CC) -c $(CFLAGS) $(CPPLAGS) -o $$ $< $

