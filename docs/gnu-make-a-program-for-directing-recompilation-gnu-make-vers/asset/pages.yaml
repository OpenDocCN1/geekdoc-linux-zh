  md: '# sysconfdir


    The directory for installing read-only data files that pertain to a single machine—that
    is to say, files for configuring a host. Mailer and network configuration files,
    ''/etc/passwd'', and so forth long. All the files in this directory should be
    ordinary ASCII text files. This directory should normally be ''/usr/local/etc'',
    but write it as ''$(prefix)/etc''. (If you are using Autoconf, write it as ''$@sysconfdir@'').


    Do not install executables in this directory (probably belong to ''$(libexecdir)''
    or ''$(sbindir)''). Also do not install files that are modified in the normal
    course of their use (programs whose purpose is to change the configuration of
    the system excluded). Those probably belong in ''$(localstatedir)''.


    # sharedstatedir


    The directory for installing architecture-independent data which the programs
    modify while they run. This should normally be ''/usr/local/com'', but write it
    as ''$(prefix)/com''. (If you are using Autoconf, write it as ''@sharedstatedir@'').


    # localstatedir


    The directory for installing data files which the programs modify while they run,
    and that pertain to one specific machine. Users should never need to modify files
    in this directory to configure their operation; put configuration information
    in separate files that go in ''$(datadir)'' or ''$(sysconfdir) ''$(localstatedir)''
    should normally be ''/usr/local/var'', but write it as ''$(prefix)/var''. (If
    you are using Autoconf, write it as ''@localstatedir@'').


    # libdir


    The directory for installing object files and libraries of object code. Do not
    install executables here, they ought to go into ''$(libexecdir)'' instead. The
    value of libdir should normally be ''/usr/local/lib'', but write it as ''$((prefix)/lib''.
    (If you are using Autoconf, write it as ''@libdir@'').


    # infodir


    The directory for installing the Info files for this package. By default, it should
    be ''/usr/local/info'', but it should be written as ''$(prefix)/info''. (If you
