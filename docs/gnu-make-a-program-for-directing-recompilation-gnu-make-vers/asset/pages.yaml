    rule, that has no commands. A file that mentioned only as a prerequisite is considered
    a target whose rule specifies nothing, so implicit search happens for it. See
    Section 10.8 [Implicit Rule Search Algorithm], page 118, for the details of how
    the search is done.


    Note that prerequisites do not influence implicit rule search. For example, consider
    this explicit rule:


    ```

