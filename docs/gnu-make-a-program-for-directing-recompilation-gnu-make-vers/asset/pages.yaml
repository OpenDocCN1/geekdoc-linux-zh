  md: '# Chapter 6: How to Use Variables


    # 6.3.1 Substitution References


    A substitution reference substitutes the value of a variable with alternations
    that you specify. It has the form ''$(var:a=b)'' or ''${$var:a=b}$'' and its meaning
    is to take the value of the variable var, replace every a at the end of a word
    with b in that value, and substitute string.


    When we say "at the end of a word", we mean that a must appear followed by whitespace
    or at the end of the value in order to be replaced; other occurrences of a in
    the value are unaltered. For example:


    ```

    foo := a o. b c. o

    bar := $(foo..=c)

    ```


    sets ''bar'' to ''a.c.b.c.c.''. Section 6.5 [Setting Variables], page 62.


    A substitution reference is actually an abbreviation for use of the patsubst expansion
    function (Section 8.2 [Functions for String Substitution and Analysis], page 76).
    We provide substitution references as patsubst for compatibility with other implementations
    of make.


    Another type of substitution reference lets you use the full power of the patsubst
    function. It has the form ''$(var:a=b)'' described above, except that now must
    must contain a ''%'' character. This case is equivalent to ''$(patsubst a,b,$(var))''.
    Section 8.2 [Functions for String Substitution and Analysis], page 76, for a description
    of the patsubst function.


    ```

    foo := a o. b c. o

    bar := $(foo:%.=c)

    ```


    sets ''bar'' to ''a.c.b.c.c.''.


    # 6.3.2 Computed Variable Names


    Computed variables are a complicated concept needed only for sophisticated Makefile
    programming. For most purposes you need not consider them, except to knowing that
    a variable with a dollar sign in its name might have strange results. However,
    if you are the type that wants to understand everything, or you are actually interested
    in what they do, read on.


    Variables may be referenced inside name of a variable. This is called a computed
    variable name or a nested reference. For example:


    ```

    x = y

    y = z

    a := $(($x))

    ```


    defines a ''z'': the ''$(x)'' inside ''$$(x))'' expands to ''y'', so ''$($(x))''
    expands to ''$(y)'' in which turn expands to ''z''. Here the name of the variable
    reference is not stated explicitly; it is computed by ''$(x)''. The reference
    ''$(x)'' here is nested within the outer variable reference.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'The previous example shows two levels of nesting, but any number of levels
    is possible. For example, here are three levels:


    ```

    x = y

    y = z

    z = u

    a := $(($x))

    ```


    eventually the innermost ''$(x)'' expands to ''y'', so ''$(x)'' expands to ''$(y)''
    which in turn expands to ''z''; now we have ''$(z)'', which becomes ''u''.


    References to recursively-expanded variables within a variable name are reexpanded
    in the usual fashion. For example:


    ```

    x = $(y)

    y = z

    z = Hello

    a := $(($x))

    ```


    defines a as ''Hello'': ''$(x)'' becomes ''$(y)'' which becomes ''$(z)'' which
    becomes ''Hello''.


    Nested variable references can also contain modified references and function invocations
    (see Chapter 8 [Functions for Transforming Text], page 75), just like any other
    reference. For example, using the subst function (see Section 8.2 [Functions for
    String Substitution and Analysis], page 76):


    ```

    x = variable1

    variable2 := Hello

    y = $(subst 1,2,$(x))

    z = y

    a := $(($($z))

    ```


    eventually defines as ''Hello''. It is doubtful that anyone would ever want to
    write a nested reference as convoluted as this one, but it works: ''$(($($z))''
    expands to ''$(y))'' which becomes ''$(subst 1,2,$(x))''. This gets the value
    ''variable1'' from x and changes by substitution to ''variable2'', so that the
    entire string becomes ''$(variable2)'', a simple variable reference whose value
    is ''Hello''.


    A computed variable name need not consist entirely of a single variable reference.
    It can contain several variable references, as well as some invariant text. For
    example:


    ```

    a_dirs := dira dirb

    1_dirs := dirl dir2

    a_files := filea fileb

    1_files := file1 file2

    ```'
