  md: '# GNU make


    Normally you should call your makefile either ''makefile'' or ''Makefile''. (We
    recommend ''Makefile'' because it appears prominently near the beginning of a
    directory listing, right near other important files such as ''README.''. The first
    name checked, ''GNUMakefile'', is not recommended for most makefiles. You should
    use this name if you have a makefile that is specific to GNU make, and will not
    be understood by other versions of make. Other make programs look for ''makefile''
    and ''Makefile'', but not ''GNUMakefile''.


    If make finds none of these, it does not use any makefile. Then you must specify
    a goal with a command argument, and make will attempt to figure out how to remake
    it using its built-in implicit rules. See Chapter 10 [Using Implicit Rules], page
    101.


    If you want to use astandard name for your makefile, you can specify the makefile
    with the ''-f'' or ''--file'' option. The arguments ''-f name'' tell make to read
    the file name as the makefile. If you use more than one ''-f'' or ''--file'' option,
    you can specify several makefiles. All the makefiles are effectively concatenated
    in the order specified. The default make names ''GNUMakefile'' and ''Makefile''
    are not checked automatically if you specify ''-f'' or ''--file''.


    # 3.3 Including Other Makefiles


    The include directive tells make to suspending the current makefile and read one
    or more other makefiles before continuing. The directive is a line in the makefile
    that looks like this:


    ```

    include filenames...

    ```


    filenames can contain shell file patterns.

    Extra spaces are allowed and ignored at the beginning of the line, but a tab is
    not allowed. (If the line begins with a tab, it is considered a command line.)
    Whitespace is required between include and the file names, and between file names;
    extra whitespace is ignored and at the end of the directive. A comment starting
    with ''#'' is allowed at the end of the line. The file names contain any variable
    or function references, they are expanded. See Chapter 6 [How to Use Variables],
    page 55.


    For example, if you have three ''.mk'' files, ''a.mk'', ''b.mk'', and ''c.mk'',
    and ''$(var) expands to bash bash, then the following expression


    ```

    include foo *.mk $(var)

    ```


    is equivalent to


    ```

    include foo a.mk b.mk c.mk bash bash

    ```


    When make processes an include directive, it suspends reading of the containing
    makefile and reads from each listed file in turn. When that is finished, it resumes
    reading the makefile in which the directive appears.


    One occasion for using include directives is when several programs, handled by
    individual makefiles in various directories, need to use a common set'
