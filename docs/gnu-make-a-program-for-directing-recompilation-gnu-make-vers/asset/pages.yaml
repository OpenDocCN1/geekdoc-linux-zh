    [Defining Variables Verbatim], page 65).

    - Variables in the environment make variables. See Section 6.9 [Variables from
    the Environment], page 66.

    - Several variables are given new values for each use. Each of these has a single
    conventional use. See Section 10.5.3 [Automatic Variables], page 111.

    - Several variables have constant initial values. See Section 10.3 [Variables
    Used by Implicit Rules], page 106.


    # 6.5 Setting Variables


    To set a variable from the makefile, write a line starting with the variable name
