  md: 'Chapter 11: Using make to Update Archive Files


    # 11 Using make to Update Archive Files


    Archive files are files containing named subfiles called members; they are maintained
    with the program ar and their main use is as subroutine libraries for linking.


    # 11.1 Archive Members as Targets


    An individual member of an archive file can be used as a target or prerequisite
    in make. You specify the member named member in archive file as follows:


    ```

    archive(member)

    ```


    This construct is available only in targets and पड़ेगा, not in commands! Most
    programs that you use in commands do not support this syntax and cannot act directly
    on archive members. Only ar and other programs specifically designed to operate
    on archives can do. Therefore, valid commands to update an archive member probably
    must use ar. For example, this rule says to create a member ''hack.o'' in archive
    ''foolib'' by copying the file ''hack.o''.


    ```

    foolib(hack.o) : hack.o

    ar cr foolib hack.o

    ```


    In fact, nearly all archive member targets are updated in this way and there is
    an implicit rule to do it for you. Note: The ''c'' flag to ar is required if the
    archive file does not already exist.


    To specify several members in the same archive, you can write all the member names
    together between the parentheses. For example:


    ```

    foolib(hack.o kludge.o)

    ```


    is equivalent to:


    ```

    foolib(hack.o) foolib(kludge.o)

    ```


    You can also use shell-type wildcards in an archive member reference. Section
    4.2 [Using Wildcard Characters in File Names], page 20. For example, ''foolib(*.o)''
    expands to all existing members of the ''foolib'' archive whose names end in ''.o'';
    perhaps ''foolib(hack.o) foolib(kludge.o)


    # 11.2 Implicit Rule for Archive Member Targets


    Recall that a target that looks like ''a(m)'' stands for the member named m in
    the archive file a.


    When make looks for an implicit rule for such a target, as a special feature it
    considers implicit that match ''(m)'', as well as those that match the actual
    target ''a(m)


    This causes one special rule that target is ''(*)'' to match. This rule updates
    the target ''a(m)'' by copying the file m into the archive. For example,'
  merge: -1
