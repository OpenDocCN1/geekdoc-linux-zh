  md: "# Chapter 14: Makefile Conventions\n\nBut installing the binary package does\
    \ need to execute the pre-installation and post-installation commands.\n\nPrograms\
    \ to build binary packages work by extracting the pre-installation and post-installation\
    \ commands. Here is one way of extracting the pre-installation commands:\n\n```\n\
    make -n install -o all \\\n    PRE_INSTALL=pre-install \\\n    POST_INSTALL=post-install\
    \ \\\n    NORMAL_INSTALL=normal-install \\\n| awk -f pre-install.awk\n```\n\n\
    where the file `pre-install.awk` could contain this:\n\n```\n$0 ~ /^\\\\\\[ \\\
    t]*(normal_install|post_install)[ \\t]*$/ {on = 0}\n{print $0}\n$0 ~ /^\\\\\\\
    t[ \\t]*pre_install[ \\t]*$/ {on = 1}\n```\n\nThe resulting file of pre-installation\
    \ commands is executed as a shell script as part of installing the binary package."
