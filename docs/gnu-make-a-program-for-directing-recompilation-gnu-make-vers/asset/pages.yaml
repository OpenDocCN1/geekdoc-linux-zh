  md: '# Chapter 9: How to Run make


    # 9.4 Avoiding Recompilation of Some Files


    Sometimes you may have changed a source file but you do not want to recompile
    all the files that depend on it. For example, suppose you use a macro or a declaration
    to a header file that many other files depend on. Being conservative, make assumes
    that any change in the header file requires recompilation of all dependent files,
    but you know that they do not need to be recompiled and you would rather not waste
    the time waiting for them to complete.


    If you anticipate the problem before changing the header file, you can use the
    `-t` flag. This flag tells make not to run the commands in the rules, but rather
    to mark the target up by changing its last-modification date. You would follow
    this procedure:


    +   1. Use the command `make` to recompile the source files that really need recompilation,
    ensuring that the object files are up-to-date before you begin.


    +   2. Make the changes in the header files.


    +   3. Use the command `make -t` to mark all the object files as up to date. The
    next time you run make, the changes in the header files will not cause any recompilation.


    If you have already changed the header file at a time when some files do not recompile,
    it is too late to do that. Instead, use the `-o file` flag, which marks a specified
    file as `old` (see Section 9.7 [Summary of Options], page 95). This means that
    the file itself will not be remaded and nothing else be remaded on its account.
    Follow this procedure:


    +   1. Recompile the source files that need compilation for reasons independent
    of the particular header file, with `make -o headerfile`. If several header files
    are involved, use a separate `-o` option for each header file.


    +   2. Touch all the object files with `make -t`.


    # 9.5 Overriding Variables


    An argument that contains `=` specifies the value of a variable: `v=x` sets the
    value of the v to x. If you specify a value in this way, all ordinary assignments
    of the same variable in the makefile are ignored; we say they have been overridden
    by the command line argument.


    The common way to use this facility is to pass extra flags to compilers. For example,
    in a properly written makefile, the variable CFLAGS is included in each command
    that runs the C compiler, so a file `foo.c` would be compiled something like:


    ```

    cc -c $(CFLAGS) foo.c

    ```


    Thus, whatever value you set for CFLAGS affects each compilation that occurs.
    The makefile probably specifies the usual value for CFLAGS, like this:'
