    A target pattern is composed of ''%'' between a prefix and a suffix, either

    or both of which may be empty. The pattern matches a file name only if the

    file starts with the prefix and ends with the suffix, without overlap.

    The text between the prefix and suffix is called the stem. Thus, when

    pattern ''%.o'' matches the file name ''test.o'', the stem is ''test''. The

    pattern rule prerequisites are turned into actual files by substituting

    the stem for the character ''%''. Thus, if in the example one of the

    prerequisites is written as ''%.c'', it expands to ''test.c''.


    When the target pattern does not contain a slash (and it usually does

    not), directory names in file names are removed from the file name before

    it is compared with the target prefix and suffix. After the comparison of the

    file name to the target pattern, the directory names, along with the slash

    that ends them, are added on the prerequisite file name generated from

    the pattern rule''s prerequisite patterns and the file name. The directories

    is ignored only for the purpose of finding an implicit rule to use, not in

    the application of that rule. Thus, ''%*'' matches the file name ''src/eat'',

    with ''src/a'' as the stem. When prerequisites are turned into file names,

    directories from the stem are added at the front, while the rest of the stem

    is substituted for the ''%''. The stem ''src/a'' with a prerequisite pattern ''%2r''

    gives the file name ''src/car''.


