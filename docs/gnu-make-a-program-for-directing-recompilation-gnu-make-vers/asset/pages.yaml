    ```


    The value in an ordinary assignment cannot contain a newline; the newlines that
    separate the lines of a define become part of the variable''s value (except for
    the final newline which precedes the endef and is not considered part of the value).


    The previous example is functionally equivalent to this:


    ```

    two-lines = echo foo; echo $(bar)

    ```


    since two commands separated by semicolon behave much like two separate shell
    commands. However, note that using two separate lines make will invoke the shell
    twice, running an independent subshell for each line. See Section 5.2 [Command
    Execution], page 41.


    If you want variable definititions made with define to take precedence over command-line
    variable definitions, you can use the override directive together with define:


    ```

    override define two-lines

    foo

    $(bar)

    defef

    ```


    See Section 6.7 [The Override Directive], page 65.


    # 6.9 Variables from the Environment


    Variables in make can come from the environment in which make is run. Every environment
    variable that make sees when it starts up is transformed into a make variable
    with the same name and value. But an explicit assignment in the makefile, or with
    a command argument, overrides the environment. (If the ''-e'' flag is specified,
    then values from the environment override assignments in the makefile. See Section
    9.7 [Summary of Options], page 95. But this is not recommended practice.)


    By, setting the variable CFLAGS in your environment, you can cause all C compilations
    in most makefiles to use the compiler switches you prefer. This is safe for variables
    with standard or conventional meanings because you know that nomakefile will use
    them for other things (But this is not totally reliable; some makefiles set CFLAGS
    explicitly and are therefore not by the value in the environment).


    When make is invoked recursively, variables defined in the outer invocation can
    be passed to inner invocations through the environment (see Section 5.6 [Recursive
    Use of make], page 46). By default, only variables that came from the environment
    or the command line are passed to recursive invocations. You can use the export
    directive to pass other variables.'
