- img_proc: true
  md: "# 6 GNU make\n\nsource file, or any of the header files named as prerequisites,\
    \ is more recent than the object file, or if the object file does not exist.\n\
    \nThe other rules are processed because their targets appear as prerequisites\
    \ of the goal. If some other rule is not depended on the goal (or anything it\
    \ depends on, etc.), that rule is not processed, unless you tell make to do so\
    \ (with a command such as make clean).\n\nBefore recompiling an object file, make\
    \ considers updating its prerequisites, the source file and header files. This\
    \ Makefile does not specify anything to be done for them—the '.c' and '.h' files\
    \ are not the targets of any rules—so make does nothing for these. But make would\
    \ update automatically generated C programs, as those made by Bison or Yacc, by\
    \ their own rules at this time.\n\nAfter recompiling object files needs it, make\
    \ decides whether to relink 'edit'. This must be done if the file 'edit' does\
    \ not exist, or if any of the object files are newer than it. If an object file\
    \ was just recompiled, it is newer than 'edit', so 'edit' is relink.\n\nThus,\
    \ if we change the file 'insert.c' and run make, make will compile file to update\
    \ 'insert.o', and then link 'edit'. If we change the 'command.h' and run make,\
    \ make will recompile the object files 'kbd.o', 'command.o' and 'files.o' and\
    \ then link the 'edit'.\n\n# 2.4 Variables Makefiles Simpler\n\nIn our example,\
    \ we had to list all the object files twice in the rule for 'edit' (repeated here):\n\
    \n```\nedit := main.o kbd.o command.o display.o \\\n    insert.o search.o files.o\
    \ utils.o \\\n    cc -o edit main.o kbd.o command.o display.o \\\n    insert.o\
    \ search.o files.o utils.o\n```\n\nSuch duplication is error-prone; if a new object\
    \ is added to the system, we might add it to one list and forget the other. We\
    \ can eliminate the risk and simplify the myfile by using a variable. Variables\
    \ allow a text string to be defined once and substituted in multiple places later\
    \ (see Chapter 6 [How to Use Variables], page 55).\n\nIt is standard practice\
    \ for every myfile to have a variable named objects, OBJECTS, objs, OBJ, or OBJ\
    \ which is a list of all object file names. We would define such a variable objects\
    \ with a line like this in the myfile:\n\n```\nobjects := main.o kbd.o command.o\
    \ display.o \\\n    insert.o search.o files.o utils.o\n```\n\nThen, each place\
    \ we want to put a list of the object file names, we can substitute the variable's\
    \ value by writing '$(objects)' (see Chapter 6 [How to Use Variables], page 55)."
  merge: -1
  pgno: 17
- img_proc: true
  md: "# Chapter 2: An Introduction to Makefiles\n\nHere is how the complete simple\
    \ makefile looks when you use a variable\n the object files:\n\n```\nobjects =\
    \ main.o kbd. command.o display.o \\\n    insert.o search.o files.o utils.o\n\n\
    edit : $(objects)\n    cc -o edit $(objects)\nmain.o : main.c defs.h\n    cc -c\
    \ main.c\nkbd.o : kbd.c defs.h command.h\n    cc -c kbd.c\ncommand.o : command.c\
    \ defs.h command.h\n    cc -c command.c\ndisplay.o : display.c defs.h buffer.h\n\
    \    cc -c display.c\ninsert.o : insert.c defs.h buffer.h\n    cc -c insert.c\n\
    search.o : search.c defs.h buffer.h\n    cc -c search.c\nfiles.o : files.c defs.h\
    \ buffer.h command.h\n    cc -c files.c\nutils.o : utils.c defs.h\n    cc -c utils.c\n\
    \nclean:\n    rm edit $(objects)\n```\n\n# 2.5 Letting make Deduce the Commands\n\
    \nIt is not necessary to spell out the commands for compiling the individual\n\
    c source files, because make can figure them out: it has an implicit rule for\n\
    updating a '.o' file from a correspondingly named '.c' file using a 'cc -c'\n\
    for example, it will use the command 'cc -c main.c main.o'\nto compile 'main.c'\
    \ into 'main.o'. We can therefore omit the commands\nfrom the rules for the object\
    \ files. See Chapter 10 [Using Implicit Rules],\npage 101.\n\nWhen a '.c' file\
    \ is used automatically in this way, it is also automatically\nadded to the list\
    \ of prerequisites. We can therefore omit the '.c' files from\nthe prerequisites,\
    \ we omit the commands.\n\nHere is the entire example, with both of these changes,\
