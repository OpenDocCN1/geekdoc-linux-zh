  md: '# Chapter 14: Makefile Conventions


    Generally, $(prefix) is used for directories that contain machine-specific files
    (such as executables and subroutine libraries), while $(prefix) is used directly
    for other directories.


    Running ''make install'' with a different value of exec_prefix from the one used
    to build the program should not recompile the program.


    Executable programs are installed in one of the following directories.


    bindir


    The directory for installing executable programs that users can run. This should
    normally be ''/usr/local/bin'', but write it as ''$(exec_prefix)/bin''. (If you
    are using Autoconf, write it as ''$(bindir'').


    sbindir


    The directory for installing executable programs that can be run from the shell,
    but are only generally useful to system administrators. This should normally be
    ''/usr/local/sbin'', but write it as ''$(exec_prefix)/sbin''. (If you are using
    Autoconf, write it as ''$(sbindir'').


    libexecdir


    The directory for installing executable programs to be run by other programs rather
    than users. This directory should normally be ''/usr/local/libexec'', but write
    it as ''$(exec_prefix)/libexec''. (If you are using Autoconf, write it as ''$(libexecdir'').


    Data files used by the program during its execution are divided into two ways:


    +   - Some files are normally modified by programs; others are never normally
    modified (though users might edit some of these).


    +   - Some files are architecture-independent and can be shared by all machines
    at a site; some are architecture-dependent and can be shared only by machines
    of the same kind and operating system; others may never be shared between two
    machines.


    This makes for six different possibilities. However, we want to discourage the
    use of architecture-dependent files, aside from object files and libraries. It
    is much cleaner to make other data files architecture-independent, and it is generally
    not hard.


    Therefore, here are the variables Makefile uses to specify directories:


    datadir


    The directory for installing read-only independent data files. This should normally
    be ''/usr/local/share''; but write it as ''$(prefix)/share''. (If you are using
    Autoconf, write it as ''$(datadir)''). As a special exception, see ''$(infodir)''
    and ''$(includedir)'
