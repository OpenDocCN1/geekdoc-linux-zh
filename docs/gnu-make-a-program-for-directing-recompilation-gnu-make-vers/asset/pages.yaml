    in the sequence of implicit rules is determined by where you write the new rule.


    You can cancel a built-in implicit rule by defining a pattern rule with the same
    target and prerequisites, but no commands. For example, the following would cancel
    the rule that runs the assembler:


    ```

    %.o : %s

    ```


    # 10.6 Defining Last-Resort Default Rules


    You can define a last-resort implicit rule by writing a terminal-anything pattern
    rule with no prerequisites (see Section 10.5.5 [Match-Anything Rules], page 114).
    This is just like any other pattern rule; the only special thing about it is that
    it will match any target. So such a rule''s commands are used for all targets
    and prerequisites that have no commands of their own and for which no other implicit
    rule applies.


    For example, when testing amakefile, you might not care if the source files contain
    real data, only that they exist. Then you might do this:


    ```

    %:

    touch $@

    ```


    to cause all the source files needed (as prerequisites) to be created automatically.


    You can instead define commands to be used for targets for which there are no
    rules at all, even ones which do not specify commands. You do this by writing
    for the target .DEFAULT. Such a rule''s commands are used for all prerequisites
    that do not appear as targets in any explicit rule, and for which no implicit
    rule applies. Naturally, there is no .DEFAULT rule unless you write it.


    If you use .DEFAULT with no commands or prerequisites:


    ```

    .DEFAULT:

    commands previously stored for .DEFAULT are cleared. Then make acts as if you
    never defined .DEFAULT at all.

    ```


    If you do not want a target to get the commands from a match-anything pattern
    rule or .DEFAULT, but you do not want any commands to be run for the target, you
    can give empty commands (see Section 5.8 [Defining Empty Commands], page 53).'
