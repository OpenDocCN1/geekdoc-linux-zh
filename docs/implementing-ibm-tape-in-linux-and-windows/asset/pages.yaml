  md: '# Save your application logs


    To save your application logs:


    +   - For Tivoli Storage Manager, save the server activity log.

    - ForNetWorker, save the Daemon logs in /nsr/log/daemon.


    # Save the operating system error log


    To save the operating system error log:


    +   - Copy the Event log for Windows machines.

    - For Linux, copy the messages and iBMTape.errorlog. Both are located on /var/log.


    Provide all those logs to the IBM Support Center. You should also provide general
    information about your system, such as:


    +   - Exact machine type

    - Exact operating system version

    - Installed adapter (SCSI/FC, Adaptec, Emulex, and so on)

    - Adapter microcode, firmware level, bios level, and configuration


    Finally, here are some miscellaneous operational hints.


    # Library inventory and application inventory


    If you open the library door, the library will automatically update its inventory.
    But this does not mean that the backup application will also update inventory.
    If the library has been opened, it is possible that cartridges have been moved,
    added, or removed. Therefore, you should always have your application audit the
    library after it has been opened. Refer to your application documentation for
    details on how to do this. In Tivoli Storage Manager, use the command:


    ```

    AUDIT library_name checklabel=barcode

    ```


    # The IBM Ultrium Tape Library Specialist


    If you have problems connecting to your library using the IBM Ultrium Tape Library
    Specialist, try changing the library network settings to 10 Mbit / Halfduplex.'
