    # Configuring SNMP for the IBM 3584


    In general, the IBM 3584 library generates SNMP traps when it detects TapeAlert
    error conditions. Additionally, the library also generates SNMP traps under certain
    non-error conditions. They are generated under the following non-error conditions:


    +   * The I/O station is full for over an hour.

    * The logical library is full for over an hour and contains no empty slots.

    * The I/O station door is open for an extended period of time.

    * There are no LTO Ultrium or 3592 Cleaning Cartridges in the library (0 cleanings
    remain on the LTO Ultrium Cleaning Cartridges in library).

    * An LTO Ultrium or 3592 Cleaning Cartridge has expired (the number of cleanings
    on the cartridge has decreased to 0).'
  merge: -1
  pgno: 435
