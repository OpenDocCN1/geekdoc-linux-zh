  md: '# Set up fast access storage pool with 3592 and Tivoli Storage Manager


    To configure a fast access storage pool with 3592 drives, you have two options:


    +   1. Define a device class with SCALCAPACITY=20 and use standard-length R/W
    cartridges.

    2. Use short-length (economy) cartridges.


    To set both the fast access storage pool and the non-fast access (optimized for
    capacity) storage pool in a single logical library:


    +   * If using method 1 (above) to configure fast access storage pool:

    Define a separate device class for each storage pool, one with SCALCAPACITY=20
    and one with SCCAPACITY=100. The scratch JA tapes will automatically be initialized
    for the storage pool it is called for:


    +   * If using method 2 (above) to configure fast access storage pool:

    Since Tivoli Storage Manager does not distinguish between the short-length and
    the standard-length cartridges, you would need to define each of the cartridges
    explicitly to the storage pool.


    It may be better to just logically partition the library into a short-length-cartridge-only-partition
    (fast access partition) and a standard-length-cartridge-only-partition (capacity
    partition).


    # 7.6 Sharing LTO libraries with Tivoli Storage Manager


    The concepts of library sharing have been discussed in Chapter 2, "IBM LTO Tape
    sharing and partitioning" on page 37. In this section, we will briefly discuss
    configuration parameters to consider, for further in-depth discussion of Tivoli
    Storage Manager and library sharing and the use of SAN, refer to the redbook Get
    Out of Your SAN with IBM Tivoli Storage Manager, SG24-6667.


    Tivoli Storage Manager servers can share the same tape library using the library
    sharing feature, as shown in Figure 7-2 on page 258. Tape library sharing is supported
    by any combination of Windows, AIX, Solaris, Linux, and HP-UX Tivoli Storage managers.
    We recommend using the latest code level. To find the download code fixes at:


    ```

    http://306-ibm.com/software/sysmgmt/products/support/IBMTivoliStorageManager.html

    ```


    All servers that need the library to have a FC/SAN connection to the tape drives
    in the library. One server will control the library robotics and is designated
    the Library Manager. Other users are designated Library Clients. Services are
    requested from the Library Manager, rather than the library itself, as non-shared
    library configurations. For a library client can write data to a tape, then the
    client has to ask the Library Manager to mount the tape volume. After the tape
    is mounted by the Library Manager, the library client can write the data directly
    over the physical SAN path to the tape drive.


    # 7.6.1 Configuring the Library to share libraries


    Install and configure your library and drives on the Library Manager, as described
    in 7.2, "Non-shared tape device with Tivoli Storage Manager for Windows" on page
    260. Register license for library sharing, and define the library with the shared=yes
    parameter, such as:


    ```

    REGISTER LICENSE FILE=libshare.lic NUMBER=1

    DEFINE LIBRARY lto_3584 LIBTYPE=SCSI SHARED=YES

    ```


    Define drives and path information for the non-shared environment.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'Because library sharing uses server-to-server communication for sending and
    receiving requests, you need to configure server-to-server communications between
    the Library Manager and the library clients.


    Set the following parameters on the Library Manager (servername, password, serverhaddress,
    serverldaddress, and set crossdefine) to on:


    ```

    SET SERVERNAME server_name

    SET PASSWORD server_password

    SET CROSSDEFINE on

    SET SERVERHADDRESS server_ip_address

    SET SERVERLDADDRESS server_ip_portaddress

    ```


    # 7.6 Configuring the library client


    The library client is similarly set up for crossdefine.Set the parameters servername,
    password, serverhaddress, serverldaddress, and set crossdefine to on:


    ```

    SET SERVERNAME server_name

    SET PASSWORD server_password

    SET CROSSDEFINE on

    SET SERVERHADDRESS server_ip_address

    SET SERVERLDADDRESS server_ip_portaddress

    ```


    Next, define the Library Manager server on each of the library clients, so that
    they will know which system is managing the tape libraries. Use the DEFINE SERVER
    command and match the parameters to the server definitions on the Library Manager
    (servername, password, IP address, and port number):


    ```

    DEFINE SERVER library_manager_servername PASSWORD=library_manager_password HADDRESS=library_manager_ip_addresslibrary_manager_port_number
    COMM=tcp

    ```


    As we have crossdefine on, the above commands should automatically create library
    client definitions on the Library Manager. Check this with the QUERY command.


    # 7.6.3 Define library and drives for library client


    See Chapter 3, "Basic IBM tape setup for Windows" on page 79, Chapter 4, "Basic
    IBM tape setup for Linux" on page 183, and Appendix 5, "SAN considerations" on
    page 223 for basic tape drive installation on the library clients.


    You will need to define the drive definition at each library client. The drive
    paths must be defined for each library client drive, but this definition is at
    the Library Manager:


    ```

    DEFINE library_name LIBTYPE=shared PRIMARYLIBRARYMANAGER=lib_manager_name

    ```


    Note the use of the LIBTYPE=shared parameter. You must use the same library_name
    as defined on the library server.


    On the Library Manager, define each of the tape drive paths for each library client
    as:


    ```

    DEFINE path server_name drive_name SRTYPE=SERVER DESTYPE=DRIVE \_name=library_name
    DEVICE=device_name

    ```


    For server_name, enter the name of the library client, and for device_name, specify
    the name of the device special file for the library client machine.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '**Important:** Keep in mind that the drives are not necessarily configured
    by the operating system in the same order as they are installed physically in
    the library, as described in 5.3, "Persistent binding" on page 237. Therefore,
    check carefully that the element address matches your drive configuration.


    You can check the result with the Q PATH command.


    Now you can define the device class and the storage pool using the library definitions,
    as described in 7.2.7, "Defining the storage pool using the command line" on page
    273.


    # 7.6.4 Administering shared libraries


    When using a shared LTO library, it is important to remember that library clients
    cannot directly access the library robotics (medium changer) themselves. Any requests
    for tape movement must be requested through the Library Manager. While library
    clients do not directly access the library robotics, unless a volume is mounted
    in a drive, the library clients can read or write directly to the SAN data path.
    This means that commands can give different output, or are not applicable in some
    circumstances.


