  md: "initiate a manual failover by restarting the application on the alternate logical\
    \ device (IBMChanger1), but the failed transaction has to be restarted from the\
    \ beginning.\n\nWhen the alternate pathing is enabled, the device driver configures\
    \ them internally as a single device with multiple paths. The application can\
    \ still open and use only one logical device at a time (either IBMChanger0 or\
    \ IBMChanger1). If an operation opens IBMChanger0 and a permanent error occurs,\
    \ the device driver initiates failover error recovery automatically on the alternate\
    \ path (IBMChanger1). If successful, the current operation continues on the alternate\
    \ path without interrupting the application.\n\n**Important:** The library Control\
    \ Path Failover Code 1680 must be installed and enabled on the library (IBM 3582,\
    \ 3583, and 3584) in order for the Linux device driver to detect alternate control\
    \ paths. In addition, you have to enable the control path for additional drivers\
    \ on the library using either the Library Operator or the TotalStorage Specialist.\
    \ For instructions on enabling the control path via these interfaces, see 3.4.3,\
    \ \"Configuring control path failover in the library\" on page 115.\n\n# Enabling/disabling\
    \ control path support\n\nAlternate pathing support is not enabled automatically\
    \ when the device driver is installed. The Linux IBMTape device driver provides\
    \ a parameter alternate_pathing for you to enable the library control path failover.\n\
    \nTo enable the failover support in the IBMTape driver software, you need to do\
    \ the following after installing the IBMTape rpm package:\n\n+   1. Stop the IBM\
    \ daemon:\n   IBMTape stop\n2. Unload the IBMTape driver from the memory:\n  \
    \ rmmod IBMTape\n3. Add the following line in your /etc/modules.conf file for\
    \ the 2.4 kernel or /etc/modprobe.conf local file for the 2.6 kernel:\n   options\
    \ IBMTape alternate_pathing=1\n4. Run depmod.\n5. Re-load the IBMTape driver into\
    \ memory:\n   modprobe IBMTape\n6. Re-start the IBMTape daemon:\n   IBMTape\n\n\
    You may ignore the unresolved symbols in /lib/modules/<your kernel name>/drivers/scsi/IBMTape.o\
    \ message after the depmod command.\nCheck if the IBMTape driver has recognized\
    \ multiple control paths for your library by reading /proc/scsi/IBMChanger. Your\
    \ library lists Primary or Alternate under the FO Path, as in Example 4-44 on\
    \ page 213, you have successfully enabled the control path failover feature for\
    \ your library. If NA is listed under FO Path, the control path failover is not\
    \ enabled. When IBMTape is loaded into kernel memory, the first logical medium\
    \ changer device that IBMTape sees in the system will be the primary path for\
    \ that changer. The other logical medium changers that IBMTape attached for the\
    \ same medium changer will be configured as alternate paths. The device driver\
    \ supports up to 16 physical paths for a single device.\n\n212 Implementing IBM\
    \ Tape in Linux and Windows"
