    # Multi-path support


    The multi-path architecture of the IBM 3584 provides the capacity for sharing
    of the library robotics. This is accomplished by partitioning the library up to
    192 multiple logical libraries (up to the number of drives installed), and providing
    each logical library its own separate and distinct drive(s), storage slots, and
    control path(s). I/O slots are shared on a first serve basis. This type of partitioning
    allows heterogeneous applications to share library robotics independent of each
    other. Cartridges under library control are not shared between logical libraries.
    An example of heterogeneous sharing is a Microsoft Windows 2000 application using
    the drive and storage'
