    for Windows 2000" on page 82,3, "Installing IBM tape device drivers for Windows
    2003" on page 91, and 3.4, "Control Path Failover" on page 103).

    - Configuration and testing


    IBM Ultrium Tape and Medium Changer Drivers are designed specifically to take
    advantage of the features provided by the IBM Ultrium Tape Drives and Medium Changer
    Devices.


    The objective is to give applications access to the functions required for basic
    tape operations (such as backup and restore) and medium changer operations (such
    as cartridge mount and dismount), as well as advanced functions used by full tape
    management systems.


    > Note: Ultrium drives and libraries usually used with vendor-provided software
    applications. These may work with the IBM-provided device drivers, their own device
    drivers, or native operating system device drivers for the tape drive and medium
    changer (or some combination of these, for example, the IBM drive device driver
    and application-provided medium changer driver). For correct operation, follow
    the specific implementation instructions for the software that you are installing
    to determine if the IBM-supplied device drivers are suitable for your installation.


    In Part 2, "LTO drives and backup software" on page 243, we describe specific
    implementation for some of the most common application software for Windows 200x.


    For further information and specific installation instructions for Windows 200x,
    refer to IBM Ultrium Device Drivers: Installation and User''s Guide, GA32-0430.


    The device drivers allow the operating system and the application software to
    manage tape devices and medium changers to automate the use of the tape media.


    # 3.1.1 Determine requirements


    To check if your environment has the correct operating system level, combined
    with the appropriate server and the supported Host Bus Adapter (HBA) and SAN fabric
    components, check the following link:


    ```

    http://www.storage.ibm.com/tape/lto/library.html#interoperability

    ```'
