- img_proc: true
  md: '# 2.1.3 What should I use?


    Whenever multiple servers running the same storage management (homogenous) application
    have to share the same tape library, we suggest using the applications''s own
    sharing capabilities. This will ensure the most efficient library and drive sharing.
    The master server can normally provide sharing functions for all tape drives to
    all client servers. The master server also manages the cartridges in the library;
    so that you need only one scratch pool, instead of several pools (one for each
    server).


    Figure 2-5 on page 43 shows an example of how sharing capabilities from the application
    can address the sharing requirements. This example is built on IBM Tivoli Storage
    Manager, but it works with other applications, such as VERITAS NetBackup or EMC
    Legato NetWorker. There are two locations in the example, each with its own data
    processing application, server, and storage. The SAN spans locations. There are
    three backup servers, with many clients attached to them performing the backup
    jobs. For disaster recovery reasons, all backup data is copied to the second location.
    One or more tape libraries are installed in each location, each backup server
    manages the tape library and handles requests from the other backup servers. Any
    server from location 1 asks Library Manager 1 (TSM Server 1) to tape and mount
    a cartridge in Library 1. If a backup server from location 1 copies the data to
    location 2, it then asks Library Manager 2 (TSM Server 2) to mount a tape on Library
    2.


    An overview of library sharing with IBM Tivoli Storage Manager is in Chapter 7,
    “Configuring IBM Tivoli Storage Manager on Windows and Linux” on page 255. For
    complete details, we see the redbook Get More Out of Your SAN with IBM Tivoli
    Storage Manager, SG24-6687.


    ![](img/a48407b38d72fd58ea3627423836388a_69_0.png)


    Figure 2-4 LAN-free backup'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_70_0.png)


    Figure 2-5 Library sharing done by TSM


    However, in some cases, if you use one homogenous backup application, it might
    not be adequate to use the sharing option of the application itself; instead,
    the partitioning capabilities of the library. This is the case if you have to
    separate (for security reasons) the data coming from the different backup servers;
    in this situation, you need the partitioning function of the library to guarantee
    separation of the data.


    Of course, if you use different applications, then you have to use the partitioning
    function, such as when you have iServer on one hand and Tivoli Storage Manager
    running on Windows or UNIX on the other hand, connected to the same library.


    # # Partitioning multi-path tape libraries


    The IBM 3582, 3583, and 3584 tape libraries all use the patented multi-path architecture
    and those libraries can be partitioned. You can use multiple logical libraries
    to share the physical library between applications, or to support mixed drives
    for any application. You can create multiple logical libraries by partitioning
    the physical library storage slots and tape drives into two or more logical libraries.
    Each logical library consists of:


    +   * Tape drives

    * Storage slots

    * Input/output (I/O) slots

    * Cartridge accessor


    Each logical library has its own control path (a logical path into the library
    through which a server sends standard SCSI medium changer commands to control
    the logical library). Each logical control path is available to servers through
    a Logical Unit Number 1 (LUN 1) of the first drive that is defined within that
    logical library. A logical library cannot share another library''s tape drives
    and storage slots. However, it does share the I/O slots, and the cartridge accessor
    on a first-come, first-served basis.


    Chapter 2. IBM LTO Tape library sharing and partitioning 43'
  merge: -1
