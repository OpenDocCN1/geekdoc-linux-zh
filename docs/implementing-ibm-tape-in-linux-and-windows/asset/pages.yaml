  md: '# Simple Network Management Protocol (SNMP) alerts


    Occasionally, the LTO library may encounter a situation that you want to know
    about, such as an open door that causes the library to stop. The IBM 3581 2U,
    3582, 3583, and 3584 libraries provide a standard TCP/IP protocol called Simple
    Network Management Protocol (SNMP) to send alerts about conditions (such as an
    open door) over a TCP/IP network to an SNMP manager. These alerts are called SNMP
    traps.


    Using the information supplied in each SNMP trap, the monitoring server (together
    with client-supplied software) can alert operators of possible problems or operator
    interventions that occur. Many monitoring servers (like Tivoli NetView[]) can
    be used to email or pager notifications when they receive an SNMP alert (for more
    information, see your Tivoli NetView documentation or the manuals for your network
    management application).


    The monitoring server must be loaded with system management software that can
    receive and process the trap, or the trap is discarded. SNMP supports a get/response
    mechanism for an operator to get more information about a problem or query the
    library about its current status. A get is a request for information about the
    library that the operator issues through a monitoring server and is transmitted
    by SNMP. A get response generally requires an up-to-date Library Management Base
    (MIB). The library''s MIB contains units of information that specifically describe
    an aspect of a system, such as the system name, hardware number, or communications
    configuration.


    The SNMP connection requires an Ethernet port; therefore, your library must have
    the RMU (for IBM 3581, 3582 and 3583) or Ethernet port (for IBM 3584).


    SNMP is a sub-protocol of TCP/IP and is based on a hierarchical structure represented
    by strings of "object identifiers" or OIDs. Much of the data required by network
    managers is mapped to instances of the OIDs. Standard values are included in higher
    levels of the structure, providing a standard for identifying these data. Brand-specific
    extensions are provided by the manufacturers. These standard and proprietary OID
    collections are collected in Management Information Bases (MIBs). For SNMP, contained
    in RFC 1157, is available at:


    ```

    ftp://ftp.fsi.edu/in-notes/rfc1157.txt

    ```


    The IBM 3581, 3582 and 3583 have the SNMP monitoring included in the RMU module.
    The RMU supports SNMP Version 2.0, and can act as an SNMP server, responding to
    queries and generating SNMP traps. An internal library server interface enables
    the RMU to acquire Alert3.0ing information from the drives and to send this information
    to an SNMP server. In the event of a power loss, the RMU will detect the loss
    and generate an SNMP trap for notification.


    The IBM 3584 has the SNMP support in the FCA (frame controller assembly, which
    is required for at least the L-Frame). The FCA must have Ethernet Support (FCA
    #1620) using the SNMP function. For redundancy reasons, the SNMP function uses
    all FCAs with Ethernet support. Up to five different SNMP managers can be configured
    to receive trap/get-response mechanism.


    For all SNMP-capable LTO tape libraries, you need an Ethernet connection to the
    SNMP manager to trap SNMP events. We described how to configure the LAN connection
    for these libraries in 3.8.1, "IBM 3581 2U Tape Library Specialist" on page 151;
    3.8.2, "IBM 3582 Tape Library Specialist" on page 154; 3.8.3, "IBM 3583 Tape Library
    Specialist" on page 157, and 3.8.4, "IBM 3584 Tape Library Specialist" on page
    161.'
  merge: -1
  pgno: 431
- img_proc: true
  md: '# Configuring SNMP for the IBM 3582


    To configure and activate SNMP event monitoring for the IBM 3582, use the Ultrium
    Tape Library Specialist panels. You cannot use the Operator panel to configure
    this function.


    From the main specialist in the black column at the left hand side of the panel,
    select SNMP MIB. The window shown in Figure B-1 appears.


    ![](img/a48407b38d72fd58ea3627423836388a_432_0.png)


    Figure B-1 IBM 3582 Tape Library Specialist: SNMP MIB download


    As described in the text of the window, the MIB file is a specific configuration
    file for the SNMP environment with the information for the IBM 3582. Download
    the file to the SNMP management server. If you are running Tivoli NetView on this
    server, you should store the file in the directory \usr\snmp\mibs. You will then
    load this file to your SNMP manager, using the specific application''s process.


    Go to the Specialist Configuration panel. In the SNMP Configuration section at
    the lower left side of the panel, enter the TCP/IP address and other related parameters
    for the SNMP server, and make sure the Alerts Enabled drop-down is set to ON,
    as shown in Figure B-2 on page 406.'
