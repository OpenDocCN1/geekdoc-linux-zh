    # # 3.5.3 Testing the library with NTBACKUP


    The Windows 200x native backup utility NTBACKUP can use the IBM tape library and
    drives to perform basic backup, restore, and system state backup functions. To
    use the Windows backup utility, you must start the RSM service, and prepare within
    the libraries before it is made available to the application. For more information
    about RSM operation and features, refer to Chapter 6; "Configuring RSM" on page
    245. NTBACKUP will give an error if it is started without the RSM service running.


    To start NTBACKUP, select Start -> Programs -> Accessories -> System Tools ->
    Backup, or run NTBACKUP at the command line. If you start NTBACKUP without any
    located media, you will see the message in Figure 3-6.


