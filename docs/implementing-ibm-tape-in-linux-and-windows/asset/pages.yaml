    # 1.1.1 LTO Ultrium models


    The IBM TotalStorage LTO Ultrium family consists of:


    +   - IBM TotalStorage 3580 Tape Drive

    - IBM TotalStorage 3581 Tape Autoloader

    - IBM TotalStorage 3581 2U Tape Autoloader

    - IBM TotalStorage 3582 Tape Library

    - IBM TotalStorage 3583 Tape Library

    - IBM TotalStorage 3584 Tape Library


    These are shown in Figure 1-3 on three drive options: Ultrium 1, Ultrium 2, and
    Ultrium 3. More recent models are available with Ultrium 2 and Ultrium 3 drives
    only. IBM Ultrium 1 drives were withdrawn from marketing in October 2004.


    Ultrium 1 was the first generation of the LTO Ultrium technology with a tape capacity
    of 100 GB per cartridge in a native format, and capacity of 200 GB using 2:1 compression.


    Ultrium 2 is the second generation of the LTO Ultrium technology with a tape capacity
    of 200 GB per cartridge in native format, and capacity of 400 GB using 2:1 compression.


    Ultrium 3 is the third generation of the LTO Ultrium technology with a tape capacity
    of 400 GB per cartridge in native format, and capacity of 800 GB using 2:1 compression.
    A WORM (write-once, read-many) version of the Ultrium 3 cartridge is also available.'
