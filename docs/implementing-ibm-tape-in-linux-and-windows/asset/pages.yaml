- img_proc: true
  md: '# 4.1 Hardware and software requirements


    IBM Lotto devices on Linux are supported on Intel, pSeries®, and zSeries platforms.


    Up-to-date information about supported Linux and LTO hardware and software configurations
    can be found:


    http://www-1.ibm.com/servers/storage/tape/lto/


    Select the LTO model of interest, click Product Details, then on the next page,
    click the Interoperability link. Download the interoperability matrix, scroll
    down, and select the appropriate server to view which OS versions and HBAs are
    supported.


    While the Intel systems support all the IBM Ultimate, at the time of writing,
    pSeries and zSeries may support a subset of the libraries with LTO and 3592 drives
    and associated functionality. Be sure to check the Web site for supported operating
    system versions, kernel levels, adapters, and device drivers.


    # 4.2 Installing library and tape device drivers


    After physically installing and connecting your IBM tape drive or library to your
    environment, the next step in the basic implementation of the IBM tape library
    and drivers is to make the devices accessible for your operating system.


    In Linux, you can choose to use either the IBM tape drivers or the native Linux
    drivers to access the tape and library devices.


    The IBM tape and medium changer device drivers are designed to specifically take
    advantage of the features provided by the IBM tape drives and medium changer devices.
    This means that you can use the IBM tape device drivers whenever this is possible.
    Nevertheless, you can use the native Linux drivers when that is required for your
    solution. See examples in Chapter 9, "ConfiguringBakBone NetVault on Windows and
    Linux" on page 341, and Chapter 10, "Configuring Arkeia on Linux" on page 369
    in this redbook worked perfectly using the native Linux Device Drivers.


    > Note: IBM tape drives and libraries are usually used with vendor-provided software
    applications. These may work with the IBM-provided device drivers, their own device
    drivers, or native operating system device drivers for the tape drive and medium
    changer (or some combination of these, for the IBM device driver and application-provided
    medium changer driver). For correct operation follow the specific implementation
    instructions for the software that you are installing to determine if the IBM-supplied
    device drivers are suitable for your installation.


    In the following sections, we show how to give access to the functions required
    for basic tape operations (such as backup and restore) and medium changer operations
    (such as cartridge mount and dismount).


    For more information and specific installation instructions for every platform,
    refer to IBM Ultrium Device Drivers: Installation and User''s Guide, GA32-0430,
    for LTO tape drives and libraries, and IBM TotalStorage Tape Device Drivers Installation
    and User''s Guide, GC35-0154, for the 3592 drive. They can be downloaded from:


    http://ftp.software.ibm.com/storage/devdrvr/Doc/'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'In addition, there are several files in the IBM driver download directory that
    provide additional information regarding the use of IBM Ultrium tape drives and
    libraries with Linux.

    See these out:


    ```

    ftp://ftp.software.ibm.com/devdrvr/Linux/

    ```


    We recommend reading at least IBMTape.Ultrium.ReadMe''s for LTO and IBMTape, Magstar.ReadMe
    for 3592, IBMTape.fixtlist, and LinuxNative.pdf. The Readme files are in the relevant
    OS folders.


    The IBMTapeautil.ReadMe and IBMTapeautil.fixtlist contain additional information
    for the users of IBMTapeautil for particular versions and levels of Linux. LinuxNative.pdf
    file contains hints and tips about using the native device drivers and Linux commands,
    such as mt or tar.


    The drivers allow the operating system and the application software to interface
    with tape devices and medium changers are managed using a special device file
    name. The special device name is the name used to address the tape or media changer
    device (see Table 4-1 for more information).


    Table 4-1 Special device names used with Linux


    | Native Linux device drivers | Native Linux device drivers with scsidev | IBM
    Ultrium device drivers |

    |---|---|--|

    | Medium changer | /dev/sg[0-32] | /dev/scsi/sgh0-00c110 | /dev/IBMChanger[0-32]
    |

    | Tape device | /dev/st[0-32] | /dev/scsi/sth0-00c110 | /dev/IBMTape[0-32] |

    | | /dev/nst[0-32] | /dev/scsi/nsth0-00c110 | /dev/IBMTape[0-32]n |

    | | /dev/sg[0-32] | /dev/scsi/sgh0-00c110 | |


    In our examples using native Linux device driver, we use SUSE 7.2 and Red Hat
    7.1, but the tools and methods are independent of the specific Linux distribution.
    With both distributions, we used a 2.4.13 kernel. For the examples using the IBM
    tape device driver, we used Red Hat Enterprise Linux AS 3 with kernel level of
    2.4.210.


    # Using multi-path tape library with Red Hat Linux


    If your system is running Red Hat Linux, like our sample system, you need to enable
    multiple LUNs recognition:


    +   - Edit the /etc/modules.conf file (use /etc/modprobe.conf for kernel 2.6)
    (Example 4-1).


    If the options scsi_mod max_scsi_luns already exists, change the value of max_scsi_luns
    to 128;; otherwise add the line options scsi_mod max_scsi_luns=128.


    Example 4-1 /etc/modules.conf in our sample environment


    ```

    #root@saab root#cat /etc/modules.conf

    alias eth0 elth0

    alias scsi_hostadapter qla2200

    alias scsi_hostadapter1 aic7xxx

    alias usb-controller sg-0bhcl

    options scsi_mod max_scsi_luns=128

    ```'
