  md: '# 7.7 LAN-free backup with Tivoli Storage Manager


    We will briefly discuss configuration parameters for LAN-free backup. For in-depth
    discussion of this topic, see the redbook Get More Out of Your SAN with IBM Tivoli
    Storage Manager, SG24-6687.


    LAN-free client data transfer is based on library sharing, as already discussed
    in 7.6, "Sharing LTO libraries with Tivoli Storage Manager" on page 292. Clients
    that will need need SAN access to the storage devices, for example, the LTO library.
    The Tivoli Storage Manager server also requires tape library access via the SAN.
    LAN-free backup is performed by transferring the actual application data (the
    data written to or read from the storage pools) from the metadata or control data
    (information contained in the Tivoli Storage Manager database). The metadata is
    transmitted over the LAN from the Tivoli Storage Manager client to the Tivoli
    Storage manager server while the application data is moved directly over the SAN
    from the Tivoli Storage Manager client to the storage device. Figure 7-3 on page
    260 describes this process.


    A core component of LAN-free technology is the Storage Agent, which is a piece
    of code installed on each LAN-free client. Essentially, the Storage Agent can
    be viewed as a lightweight Tivoli Storage Manager server that has no database
    or storage hierarchy of its own. It behaves like a library client, which contacts
    the Tivoli Storage Manager server for volume access, and reads/writes data directly
    to SAN-attached devices.


    # 7.7.1 LAN-free configuration setup


    Install and configure the LAN-free clients according to the detailed instructions
    in the Storage Agent''s User Guides, for example, IBM Tivoli Storage Manager for
    SAN for AIX Storage Agent User''s Guide V5.3, GC32-0771


    Before beginning, set up your Tivoli Storage Manager server as a Library Manager,
    as described in 7.6.1, "Configuring the Library Manager to share libraries" on
    page 292.


    Table 7-2 on page 297 is a summary of the tasks necessary to configure LAN-free
    backup-archive client data transfer. The detailed instructions are contained in
    the user''s guides.'
