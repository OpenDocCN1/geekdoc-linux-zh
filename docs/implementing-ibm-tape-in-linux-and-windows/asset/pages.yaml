  md: '# 5.3 Persistent binding


    This function allows a subset of discovered targets to bound to an HBA. Some operating
    systems do not guarantee that devices will be allocated on the same SCSI target
    LUN IDs after a reboot. This can cause problems for application software that
    expects devices to always have the same SCSI target ID/LUN. Persistent binding
    allows a tape device''s WWN to be bound to a specific SCSI LUN.


    Another reason to use persistent binding is to ensure that the operating system
    drive names are configured in their physically installed order. Many backup applications
    (for example, EMC Legato NetWorker and VERITAS Netback DataCenter) will assume
    that the devices have been assigned their drive names as the element numbers.
    If the drives were configured in a different order, then the application will
    not correctly access the drives and, for example, for a media mount until the
    request is manually cleared. We show how to display element addresses for drives
    as well as the slots in Appendix C, "Additional information" on page 421.


    Once a configuration has been set, it will survive reboots and hardware configuration
    changes. Binding also solves the duplicate path problem. Binding can be implemented
    by WWN or WWPN.


    > Tip for IBM Tiv Storage Manager users: Recent releases of Tivoli Storage Manager
    eliminate the need for persistent binding with the SAN discovery feature. For
    more information, see 7.13, "Tivoli Storage Manager V5.2 SAN device mapping" on
    page 314.


    > Note: The default Windows naming scheme for tape devices means that dynamic
    and device names change as devices are added and removed. It assigns device names
    in the form \\Tapex, where x is a number. In this naming scheme, tape devices
    are given names starting with the tape device with the lowest SCSI address first
    and numbered in ascending order starting from zero.


    The disadvantage of this is that regard physical device can easily change if new
    devices are added with lower SCSI addresses. Windows will name the new devices
    starting from \\Tape0 and the names assigned to existing devices will change.
    Correspondingly, if devices fail or are removed from the fabric, existing devices
    names can change.


    # 5.3.1 Persistent binding with a QLogic HBA


    QLogic provides SANServer, which is a collection of device drivers and management
    software for controlling, configuring, and managing devices in a SAN environment
    that uses QLogic Fibre Channel HBAs. One function of this is persistent binding.


    To set up persistent binding, the appropriate QLogic FC driver needs to be installed.
    See 3.7.1, "QLaxxxxx HBA driver installation" on page 142 and 4.5.1,"QLogic 2300"
    on page 217 for more details.


    Having installed the QLogic FC driver, we can use SANServer to configure persistent
    LUN mapping. Run Start -> Program -> QLogic Management Suite -> SANServer.


    Click the Connect on the SANServer main window toolbar, enter the host name or
    IP address of the host, and click Connect. Your host system is shown in the left-hand
    panel (Figure 5-12 on page 238).'
