  md: '# zSeries Linux Server


    ![](img/a48407b38d72fd58ea3627423836388a_246_0.png)


    Figure 4-5 Typical zSeries SAN


    The Fibre Channel topology supported by the zSeries models is fabric only. Neither
    point-to-point connection nor arbitrated loops are supported by the current zSeries
    Fibre Channel Protocol. Please see the details on the Redpaper Getting Started
    with zSeries Fibre Channel Protocol, REDP0205, for more details on the supported
    configurations for Fibre Channel in Linux for zSeries models. This document can
    be downloaded from our Web site:


    http://www.redbooks.ibm.com/redpapers/pdfs/redp0205.pdf


    The Linux Fibre Channel adapter driver zfcp is available in the kernel that supports
    the zSeries Fibre Channel Protocol. The zfcp device configuration methods in 2.6
    and 2.4 kernels are different. For 2.6 kernels, see Chapter 5, “SCSI-over-Fibre
    Channel device driver", in Linux for zSeries and S/390: Device Drivers, Features,
    and Command, November 30, 2004, LINUX-1003, found at:


    http://awlinux1.alphalphas.ibm.com/developerworks/linux30/doc/lx26pr04dd03.pdf


    For 2.4 kernels, there are three ways to load the zfcp device driver in order
    to see the attached tape devices.


    +   - Create an /etc/zfcp.conf file and make a ramdisk to statically attach tape
    devices to your system. You may have a persistent mapping in a SAN environment.
    Every time you reboot the system, the zfcp will be automatically loaded and the
    tape devices can be seen from the system.


    +   - Modify the /etc/modules.conf to add the zfcp module parameters; then run
    the depmod -A and modprobe zfcp commands. Please do not use this choice together
    with option 1, or it will cause conflicts. The zfcp map in /etc/modules. takes
    higher priority than the map in /etc/zfcp.conf.


    +   - Run the modprobe zfcp command first, then dynamically add a tape device
    into the system after you physically attach a Fibre Channel device to the switch.


    These options are described further in the following sections.'
