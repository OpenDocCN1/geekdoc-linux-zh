    \ path failover feature in the IBMtape device driver, execute the following steps:\n\
    \n+   1. Run IBMtaped.\n2. Run mmmod IBMtape.\n3. Delete the line in your /etc/modules.conf\
    \ file:\n   options IBMtape alternate_pathing=1\n4. Run depmod.\n5. Run modprobe\
