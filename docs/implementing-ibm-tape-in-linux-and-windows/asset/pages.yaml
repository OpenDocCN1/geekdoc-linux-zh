  md: '# Assign drives


    The flexible drive assignment option supports the following capabilities:


    +   - Assign drive (nondruptive to other logical libraries)

    - Unassign drive (nondruptive to other logical libraries)

    - Reassign drive (nondruptive to other logical libraries)

    - Assign drive to multiple logical libraries

    - Change control paths


    Although the drive assignment procedure is nondruptive, the application or server
    to which the drive is assigned must be configured. This server or configuration
    may not necessarily be nondruptive. In addition, a reconfiguration of the SAN
    may be needed.


    At least one assigned drive must have the control path enabled. Therefore, the
    first assigned drive will get the control path enabled by default. You may, however,
    enable or disable control paths for your drives. Drives with a control path enabled
    cannot be shared with other logical libraries. You cannot assign LTO and IBM 3592
    tape drives to the same logical library.


    Be sure that the drives you are working on do not have any cartridges loaded.
    The Tape Library Specialist will not allow you to change any assignment of tape
    drives with a cartridge forgotten. Therefore, we suggest first running a manual
    inventory to be sure that there is not a forgotten cartridge in any drive.


    To assign drives, select Manage Drives → Drive Assignment. In the introduction
    window, you can select specific drives or logical libraries, or a list of the
    full drive assignment. If you select the last option, the full assignment displays
    as in Figure 2-39 on page 71. On the drive assignment panel, you can easily assign
    and unassign tape drives to a logical library. On the left hand side of the screen,
    you can see all available tape drives identified by their WWN. At the top, you
    see all the logical libraries. The first column is called Unassigned. All unassigned
    drives (such as newly installed drives) belong to this column. By simply clicking
    the check boxes, you can easily assign tape drives to logical libraries.


    After you have completed your settings, click Apply to make the changes effective.'
