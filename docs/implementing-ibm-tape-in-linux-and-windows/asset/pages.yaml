    # 5.1.3 Tape and disk on the same HBA


    Tape and disk are different by their nature. While tape drives use large blocks
    and "data streaming" to maximize performance, disk drives use smaller block sizes
    appropriate for random I/O; therefore, mixing disk and tape on a single SCSI bus
    is not recommended and rarely done.


    Tape drives use large blocks and data streaming that can tie up the SCSI bus for
    long periods of time, making disk drives get less than their fair share of the
    SCSI bus. Conversely, tape drives might have difficulty getting access to the
    bus because disk drives respond faster. The best practice is thus to keep disk
    and tape on separate SCSI buses.


    228 Implementing IBM Tape in Linux and Windows'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'With Fibre Channel, there is, in principle, less contention. I/O can be multiplexed
    and small blocks can be interleaved in the middle of large blocks. There is no
    shared bus to keep a slow device from sending whenever it is ready. So, it is
    certainly possible with Fibre Channel to have both disk and tape sending or receiving
    with little interference. Indeed, in a switched fabric, data is not directly sent
    to the device, but rather to the Fibre Channel switch.


    However, even with FC, for bandwidth, disk and tape I/O sharing an HBA is still
    not recommended (although the bandwidth is independent of having mixed device
    types). For example, during a backup operation, your server has to read the data
    from the disk and write it to a tape drive. With LTO 3 tape drive, if you write
    at an average of 80 MB/sec, you also have to read 80 MB/sec from the disk. With
    both data streams going through the same HBA, it means that the HBA must handle
    at least 160 MB/sec (Figure 5-6).


    **Important:** IBM does not recommend sharing disk and tape I/O on the same HBA.


    ![](img/a48407b38d72fd58ea3627423836388a_256_0.png)


    Figure 5-6 Tape and disk I/O activity on the same HBA


    As long as there is no other disk I/O activity during the backup operation, it
    may work without problems, but during the backup, other applications are running
    that also access the disk, performance will be impacted. Because disk access uses
    smaller blocksize and is quicker more frequent, the disk I/O will occupy the FC
    link and cause the tape to wait on the link, causing backchitches and thus affecting
    performance. Or worse, the disk will keep the command queue filled so that no
    tape can go through.


    For a backup server where a high I/O load occurs during the backup some other
    disk I/O occurs, you should use multiple HBAs and separate the disk and tape I/O
    (see Figure 5-7 on page 230). This is especially true for backup servers using
    a storage pool (for example, with Tivoli Storage Manager) where the backup is
    staged to disk and then migrated to tape. If the backup and migration run simultaneously,
    it will cause a high I/O load.


    Chapter 5. SAN considerations 229'
