    This pool will be assigned to the device class we just defined, so we specify
    the name dev3584. We used pool3584 as the stgpool_name:


    ```

    DEFINE STGPOOL pool3584 dev3584 MAXSCRATCH=200

    ```


    Example 7-9 on page 287 shows the storage pool that we defined.'
