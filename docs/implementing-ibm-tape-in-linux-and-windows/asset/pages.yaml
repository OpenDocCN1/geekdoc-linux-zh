    # Scenario 1


    There are two scenarios: Install Ultrium 3 drives in addition to the current Ultrium
    2 drives and, the equivalent scenario for the older generation, that is, Ultrium
    2 drives in addition to the current Ultrium 1 drives and media.


    We can install the new Ultrium 3 devices with existing Ultrium 2 devices into
    the same logical library and device class because of mixed generation support.
    The Ultrium 3 devices will be able to read and write the Ultrium 2 cartridges
    at the Ultrium 2 speed and capacity.


    Similarly, we can install the Ultrium 2 devices with existing Ultrium 1 devices
    into the same logical library and device class because of mixed generation support.
    The Ultrium 2 devices will be able to read and write the Ultrium 1 cartridges
    at the Ultrium 1 speed and capacity.


    # Scenario 2


    Install Ultrium 3 drives and Ultrium 3 media in addition to existing Ultrium 2
    drives and 2 media.


    As of Tivoli Storage Manager V5.2, mixed media types are supported in one library,
    and thus different generations of tape devices can coexist in the same logical
    library. However, two device classes are required because of the two media types.'
