  md: '# Enabling or disabling SNMP requests


    SNMP supports a get and get-response mechanism for an operator to gather more
    information about a problem or to query the library about its current status.
    A get is a request for information the library that the operator issues through
    a monitoring server that is transmitted by SNMP. A get-response is the information
    that is provided in response to the get request. This type of support generally
    requires an up-to-date library Information Base (MIB). The library''s MIB contains
    units of information that specifically describe an aspect of the system, such
    as the system name, hardware number, or communications configuration. In addition
    to the IBM 3584 MIB, you also have to load the Storage Networking Industry Association-Storage
    Media Library (SNIA-SML) MIB into your SNMP monitoring process. To obtain the
    MIB for the IBM 3584, visit this URL:


    ```

    ftp://ftp.software.ibm.com/storage/3584/

    ```


    To enable SNMP requests, use the Operator panel or use the IBM 3584 Tape Library
    Specialist. From the Web Specialist, select Settings -> SNMP Settings and enable
    SNMP Requests, as shown in Figure-18.


    ![](img/a48407b38d72fd58ea3627423836388a_443_0.png)


    Figure-18 Enable SNMP request with IBM 3584 Specialist


    Now you can use SNMP to monitor your library. Here are some examples created with
    Tivoli NetView:


    +   - To know how many drives are present in the library, use your monitoring
    server to issue an SNMP request get on the object numberOfMediaAccessDevices.0.


    +   - To get a list showing the status of all the drives in the library ordered
    by element address, issue an SNMP get request on the objects mediaAccessDevice-Availability.1


    416 Implementing IBM Tape in Linux and Windows'
  merge: -1
  pgno: 443
