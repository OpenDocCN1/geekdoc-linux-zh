  md: '| Type of password protection | Description |

    |---|---|

    | Password protection for all pages | You are prompted to sign on whenever you
    use the IBM 3584 Specialist. This type of protection allows you to view all pages
    (by using a user password) or to change administration pages (by using an admin
    password). |


    The factory default for the IBM 3584 Specialist is no password protection. The
    first time you choose password protection for administration pages or for all
    pages, the library generates an initial protection, which can be changed. Also,
    if you set the security level back to no password protection, the password will
    deactivate.


    The following administration functions are protected if the admin password is
    enabled:


    +   - Change control port SCSI IDs.

    - Change drive SCSI or Loop IDs.

    - Change the cleaning mode.

    - Change the date and time.

    - Change the Specialist Web interface admin password.

    - Clean the drive.

    - Configure logical libraries.

    - Cycle power to the drive.

    - Download logs.

    - Enable or disable control paths.

    - Import data or scratch cartridges (importing cleaning cartridges is not password-protected).

    - Inventory the library.

    - Move cartridges.

    - Remove cartridges.

    - Update control port firmware.

    - Update library and drive firmware.


    # 3.9 Updating library, drive, and RMU firmware


    It is a good habit to check periodically for available updates on the IBM Web
    site; newer code can provide additional support functions or fix problems. To
    upgrade the installed microcode level of the library, refer to the Operator Guide
    for your library or drive. In our example, we describe the procedures to check
    and update the library and drive microcode for various LTO models.


    # 3.9.1 Keeping up-to-date with drivers and firmware using My Support


    My Support registration provides e-mail notification when new firmware levels
