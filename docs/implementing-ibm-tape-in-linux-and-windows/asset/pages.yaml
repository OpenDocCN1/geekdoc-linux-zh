    and media will also affect the device class parameter format, which should be
    set to DRIVE, ULTRIUM3 or ULTRIUM3C, a write will still occur to the end of Ultrium
    3 media, but the pre-determined capacity of the storage pool will only show Ultrium
    2 capacity when the command `stgpool` is used.'
