    # Multi-path support


    The patented multi-path support feature of the IBM 3583 supports sharing of the
    library robotics. This is accomplished by partitioning the library into three
    multiple logical libraries and providing each logical library its own distinct
    slots, and control paths.


    > Note: An 18-slot storage column needs to be dedicated to each library partition.
    I/O slots are shared on a first come, first served. This type of partitioning
    allows heterogeneous applications to share the library robotics independent of
    each other. Cartridges under library control are not shared between logical libraries
    nor to be moved between logical libraries. An example of heterogeneous sharing
    is a Microsoft® Windows 2000 application using the drive and storage slots of
    one logical library while a UNIX® application uses the drive and slots of another
    logical library.


    Logical libraries can also be used for separating different generations of Ultrium
    Tape Drives and applications that do not support mixing the drives in the same
    logical library.


