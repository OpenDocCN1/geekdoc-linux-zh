    LTO-TDX tape.


    # Upgrading library firmware using NTUTIL


    The following procedure describes how to update the firmware in the IBM 3581,
    3581 2U, 3583, 3583, or 3584, over the SCSI bus using NTUTIL.


    +   1. Download the library firmware from either of these sites to a directory:

    http://www-1.ibm.com/servers/storage/support/lto/

    ftp://software.ibm.com/storage/358x

    2. If you have an application device driver other than the IBM Tape Device Driver,
    you will need to stop and start the IBM Tape Device Driver. NTUTIL will only work
    with the drive device, so you must install it if you have not already done. You
    must also stop the Removable Storage Manager (RSM) if it started. You will find
    RSM under Settings -> Control Panel -> Administrative Tools.

    3. Open an NTUTIL session on a command line from the directory where the library
    firmware image was saved (for example, c:\windows\system32) by typing NTUTIL at
    a command prompt. This is not necessary, but if you do it, then in a later step
    you do not need to type the type in the complete path.

