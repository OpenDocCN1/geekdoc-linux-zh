    SG24-5946, and will help you plan, install, and configure IBM Ultrium LTO tape
    drives; as well as the IBM 3592 tape drives and libraries with servers running
    Linux® and Windows®

    2000/2003. This redbook focuses on the setup and configuration of these drives
    and libraries in direct-access SCSI and SAN configurations.


    Part 1, "Setting up IBM tape in Linux and Windows" on page 1, describes how to
    attach and configure the drives and libraries, and covers basic installation and
    administration. It also covers the sharing and partitioning of libraries and explains
    the concept and usage of the Advanced Library Management System (ALMS) and virtual
    I/O with the IBM TotalStorage 3584 Tape Library. Part 2, "LTO libraries and backup
    software" on page 243, documents how to use these products with popular data backup
    applications, including IBM Tivoli® Storage Manager, Arkeea, and EMC Legacy NetWorker.


