  md: '# 10.1 Arkeia Knox Software


    Arkeia greatly simplifies data protection by providing automated backup and recovery.
    Arkeia supports a wide variety of computers, operating systems, and storage devices.
    Arkeia is easy to install, quick to configure, and conveniently scalable from
    a simple network to a complex enterprise. Arkeia accommodates full and incremental
    backups, scheduled or on demand, and preserves directory structure, registry,
    symbolic links and special attributes. The system manages file system data, and
    with extension modules, provides online backup for Oracle databases.


    Arkeia uses multi-flow technology and client side compression, making it capable
    of backup speeds that could exceed the rated speed. Its unique transaction engine
    allows multiple backups and restores to be performed simultaneously with total
    reliability.


    In the case of network and system errors, Arkeia is designed to restart, recover,
    and survive. Arkeia''s systems management facility allows prioritization of other
    processing activities while a backup is in progress, and leverages standard TCP/IP
    protocol to intelligently monitor network errors. Should a network error occur,
    Arkeia restarts the backup procedure from the point of interruption.


    Arkeia''s centralized catalog keeps a full record of all data and metadata managed
    by the system. It appends the relevant part of the catalog onto each tape. In
    the event of complete backup server failure, the catalog can be rebuilt and recovered
    by using the fail-safe restore utility.


    For more information about the Arkeia product, go to their Web site:


    http://www.arkeia.com


    Arkeia supports both Ultrium 1 and Ultrium 2 generation drives.


    # 10.2 Installing Arkeia


    In this section, we show the steps to configure Arkeia Version 4.2 on Linux with
    IBM 3583.


    We used the following hardware (Figure 10-1):


    +   - Intel server with Red Hat Linux 7.1 Server (Red Hat 7.1.2.96-79, Kernel
    4.2.2.2 UP).

    - Adaptecc 29160 LVD SCSI card.

    - IBM 3583 SCSI attached. A single SCSI was supported both by the library controller
    and the two 3580 tape drives.


    ![](img/a48407b38d72fd58ea3627423836388a_397_0.png)'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# ## 10.2.1 Installation preparation


    The preparation for installing Arkeia depends on whether your tape library is
    already installed.


    # ### Existing LTO installation


    If your LTO drive was already installed on your server, check to see if the IBM
    drivers are being used. The IBM Ultrium drivers are not required for Arkeia. If
    you have already installed these, disable them, as described in 4.4.3, "Uninstalling
    the Ultrium device drivers and utilities" on page 211.


    # ### New LTO installation


    If this is a new installation, first install the adapter card to Linux and load
    the drivers. This procedure is in 4.3.1, "Identifying and activating the SCSI
    controller" on page 188. Shut down the server, physically cage the tape drive,
    and reboot the system. Check the configuration of the devices, using the procedures
    in 4.3.2, "Kernel compilation and installation checklist" on page 191, and the
    following sections.


    # ### All LTO installations


    Your drive and medium changer should now be available to the operating system
    using native device drivers.


    # ## 10.2.2 Package installation


    The following section gives the steps to install the Arkeia RPM (Red Hat Package
    Format) packages. Refer to the Arkeia Installation Manuals for specific information
    about disk and resource requirements. We are installing on a system called DIOMEDE.


    The Arkeia Red Hat 7.0 Linux Version 4.2 level RPM package contains the following
    code (Example 10-1).


    > Example 10-1 Package listing


    ```

    total 4042

    -rwxr-xr-x 1 root 216661 Oct 16 17:41 arkeia-arkc-4.1.17-1386.rpm

    -rwxr-xr-x 1 root 427904 Oct 16 17:42 arkeia-client-4.2.15-1386.rpm

    -rwxr-xr-x 1 root 1420091 Oct 16 17:43 arkeia-gui-4.2.7-1386.rpm

    -rwxr-xr-x 1 root 2027889 Oct 16 17:43 arkeia-server-4.2.8-2386.rpm

    ```


    The RPM packages can now be installed. The order of installation is client, server,
    and GUI. We installed the client, then server, command line, then GUI packages
    (see Example 10-2).


    > Example 10-2 Installing RPM packages


    ```

    [root@diomede Arkeia]# rpm -Uvh arkeia-client-4.2.15-1386.rpm

    ######################################################

    Preparing...

    ###################################################### [100%]

    1:arkeia-client

    [root@diomede Arkeia]# rpm -Uvh arkeia-server-4.2.8-2386.rpm

    ######################################################

    Preparing...

