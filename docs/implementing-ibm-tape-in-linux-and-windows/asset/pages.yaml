    # AUDIT LIBRARY


    Performing an AUDIT LIBRARY command from a library client does not actually perform
    a physical audit on the shared library; instead, the library client''s database
    is checked and synchronized against the Library Manager''s database. No tape mounts
    are performed.


    Performing this command on the Library Manager monitors or inspects tapes in the
    library, as as it does in non-shared configurations.


    # CHECKIN AND CHECKOUT LIBV


    Checking in or out of a volume from a shared library must be done from the Library
    Manager. If you try to execute the CHECKOUTVOLUME command from a library client,
    the operation will fail with an error.


    # LABEL LIBVOLUME


    When the IBM tape library is shared, tape labeling must be performed on the Library
    Manager. If you try to execute the LABEL LIBVOLUME command from a library client,
    the operation will fail with any error.


    You can share the scratch volumes between all the library clients. The Library
    Manager serves as a central repository for information about all the volumes contained
    in the library. Since all media requests are handled by the Library Manager, it
    can keep track of which tape belongs to which library client, and which tapes
    are unallocated and available for any library client. There is no special configuration
    required to utilize this feature; simply make sure there is an adequate supply
    of labeled scratch tapes in the library. The Library Manager will allocate them
    as needed to the requesting library clients or to themselves. Once a particular
    volume is assigned to a library client, the Library Manager flags that volume
    and prevents other clients from accessing it.


    > Note: The Library Manager is itself a fully functional Tivoli Storage Manager
    server, that is, it typically supports its own backup client workload and can
    access and use the volumes just like a library client. However, it also has the
    particular function of overall management of the devices and tape inventory.'
