- img_proc: true
  md: 'Keep in mind that your environment will evolve over time (usually the data
    traffic will increase). Although it might have been justified (generally from
    a cost perspective) in a simple installation with low traffic to share the HBA,
    you must reevaluate the situation on a regular basis. In most cases, you will
    reach a point where it becomes necessary to install additional HBAs.


    **Note:** Monitor your environment over time, and when traffic grows, consider
    the installation of additional HBAs.


    ![](img/a48407b38d72fd58ea3627423836388a_257_0.png)


    Figure 5-7 SAN example for backup


    You cannot avoid combining disk and tape I/O (for example, no more PCI slots available
    on the host), you should at least implement your SAN in accordance with the following
    rules and configure your FC HBAs accordingly:


    +   * Create different zones for disk and tape.

    * Create a different zone for every server.

    * Enable FCP-2 recovery (also called FC Tape Support) on the FC HBA.

    * Set up persistent binding (as described in 5.3, "Persistent binding" on page
    237).

    * Disable SCSI Bus Reset to tape devices, if possible.

    * Enable PLOGI instead of PIDISC after LIP.

    * Design your SAN for high bandwidth, as high bandwidth is needed for tape I/O.

    * Do not overload the HBA. Provide enough HBAs, as described in 5.1.1, “What bandwidth
    do we need for FC tape?” on page 224.

    * Pay attention to the PCI bus performance ("PCI bus performance" on page 231).'
