  md: '# SDG LUN mapping


    In SCSI terminology, a tape drive or a disk drive is attached to a "bus" and has
    a unique address on that bus. There are three parts of the address in a conventional
    SCSI ID:


    +   * Bus (or channel)

    * Target ID

    * LUN


    A simple case of two tape drives attached to a single bus is shown in Figure A-13.


    ![](img/a48407b38d72fd58ea3627423836388a_424_0.png)


    Figure A-13 Basic SCSI connection to a system


    This configuration has a device map (from the host point of view) that looks as
    shown in Table A-1. Some tape library devices, such as the 3584, support LUNs
    for the devices; the tape drive is addressed as LUN 0; the SCSI Medium Changer
    (smc) is available as LUN 1.


    Table A-1 Target ID and device mapping - Native SCSI


    | Target ID | LUN | Device |

    |---|---|--|

    | 0 | 0 | Drive 0 |

    | 0 | 1 | smc |

    | 1 | 0 | Drive 1 |


    If a product like an SDG is placed between the system and target devices, the
    addressing has another layer. This is because the targets (the tape drives) are
    not directly attached to the host, but are connected to a SCSI adapter installed
    in the gateway instead. Figure A-14 on page 398 shows the device mapping with
    the additional layer due to the SDG.'
  merge: -1
  pgno: 424
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_425_0.png)


    Figure A-14 SDG attached through Fibre Channel - Host view


    The system now has a single target ID (target 0 in this case) directly attached
    to the SAN Data Gateway. The gateway forwards commands to and from its targets,
    the tape drives. However, there is a need to map the devices (tapes) so the host
    system can use them. This is achieved by using another layer of mapping (LUNs).
    The device map might now look like


    Table A-2 Device map from host perspective with SDG


    | Target ID | LUN | Device |

    |---|---|---|

    | 0 | 0 | SAN Data Gateway |

    | 0 | 2 | Drive 0 |

    | 0 | 3 | smc |

    | 0 | 4 | Drive 1 |


    Note that LUN 0 points to the SDG. This allows you to send commands to the gateway.
    This is referred to as the Command and Control Interface.


    Tape drives are always assigned an even LUN number. If a control path is enabled
    for this drive, its LUN is one higher than the drives. The odd-assigned LUN number
    that follows the tape-drive even number is reserved for the medium changer. This
    algorithm has been chosen for the best compatibility with existing applications
    and operating systems. The medium changer in a 3583 has its own SCSI ID, but will
    still be assigned an odd LUN number.


    If the resulting map is not suitable for your environment, you can edit the mapping
    done by the SDG with the Specialist. First select your desired SDG, then select
    Controls -> Device Mapping, as shown in Figure A-15 on page 399.'
  merge: -1
