  md: '# 7.10 Tivoli Storage Manager and data path failover


    The concept of control and data path failover is further discussed in the redbook
    Get More Out of Your SAN with IBM Tivoli Storage Manager, SG24-6687.


    The IBM tape device driver for AIX, Linux, and Solaris allows you to configure
    and automatically failover between multiple data paths (either single fabric)
    to a single FC LTO, or two SAN fabrics to an IBM 3592 drive. See 4.4.5, “Setting
    up data path failover on Linux” on page 214 for details in the Linux environment.
    Note that the LTO drives have only one interface to the fabric, IBM 3592 has two.


    With the drivers alternate path support in the Linux environment, if an application
    opens IBMTape0 and a permanent path error occurs (because of HBA or cable failure,
    for example), the application fails. It is possible to initiate manual failover
    by restarting the application on the alternate logical device (IBMTape1), but
    the application has been restarted from the beginning. A long backup or restore
    operation may have been in progress when the path error occurred. Sometimes manual
    failover may require operator intervention to reset the drive because a SCSI Reservation
    can still exist on the failing HBA.


    When the alternate path support is enabled on both IBMTape0 and IBMTape1, the
    device can still open and use only one logical device at a time (either IBMTape0
    or IBMTape1). If an application opens IBMTape and a permanent path error occurs,
    the device driver initiates failover recovery automatically on the alternate path
    (IBMTape1). If successful, the current operation continues on the alternate path
    without interrupting the application. The failover error recovery first restores
    the previous device state, SCSI Reservation, and tape position, then retries the
    failover operation.


    Figure 7-28 shows an IBM 3584 with 3592 drives.


    ![](img/a48407b38d72fd58ea3627423836388a_331_0.png)


    Figure 7-28 3592 drive with multiple data paths configured


    You can check if the IBMTape driver has recognized multiple data paths for your
    library by reading the /proc/scsi/IBMTape file. If your library lists Primary
    or Alternate under the FO Path, as shown in Example 7-17 on page 305, then you
    have successfully enabled the data path failover feature for your library. If
    NA is listed under the FO Path, then the data path failover is not enabled.'
