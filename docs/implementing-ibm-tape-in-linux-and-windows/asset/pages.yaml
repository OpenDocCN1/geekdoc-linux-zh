  md: '# EMC Legato NetWorker autochanger maintenance commands


    NetWorker driver software provides the following maintenance commands for diagnosing
    problems on tape devices and medium changers (Table C-2).


    Table C-2 NetWorker autochangers maintenance commands


    | Command | Description |

    |---|---|

    | lsbinfo | Prints out SCSI information |

    | lsdebug | Sets the library debugging level |

    | lrescan | Rescans for devices |

    | reset | Resets the SCSI bus |

    | changers | Lists the SCSI autochangers attached to the system |

    | inquire | Lists the devices available |

    | dunld | Loads or unloads a tape device |

    | msense | Retrieves mode sense data |

    | psmode | Prints mode sense data |

    | tur | Tests whether the unit is ready |

    | writebuf | Writes a device buffer |

    | sjircj | Tests the jukebox |


    # Verifying device attachment with tapeutil or ntutil


    Before you start to use your devices for production work with your applications,
    or if you encounter difficulties with your devices, you may want to verify that
    the hardware, connections, and device drivers are working together properly. Before
    you can do this, you should have already installed your LTO according to Chapter
    3, "Basic IBM tape setup for Windows" on page 79 and Chapter 4, "Basic IBM tape
    setup for Linux" on page 183.


    Also, you should have already determined which operating system device name corresponds
    to which tape drive in the library. You could create a list like Table C-3.


    Table C-3 Library device table


    | Device name | WWN | Tape drive in the library | SCSI element address |

    |---|---|---|---|

    | \\tape0 | 5005076300410801 | Drive 1 | 257 |

    | \\tape1 | 5005076300410802 | Drive 2 | 258 |

    | \\tape2 | 5005076300410803 | Drive 3 | 259 |


    If your list is incorrect, or you have not made one yet, the procedures here will
    show you how to correct it. You should run this for every attached tape drive.'
  merge: -1
