  md: '# Configuring RSM


    This chapter covers Microsoft Removable Storage Manager (RSM) and its benefits
    and purpose. It then describes how to define and configure LTO devices to RSM
    so that they can be used with RSM-compliant applications.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 6.1 Removable Storage Manager


    Removable Storage Manager (RSM) is a standard interface in Microsoft Windows 2000
    and 2003 to control most types of removable media, including CD-ROM, DVD-ROM,
    magneto-optical, Jaz, and Zip in stand-alone and library configurations. RSM is
    installed by default on all versions of Windows 2000 and 2003 and can be used
    to manage anything except the A and B floppy disks. RSM uses functionality of
    the NTFS 5 file system, so there are no plans to port RSM to Windows 95/98 or
    Windows NT 4.0.


    RSM models all changers as subsets of an ideal changer. A given driver tells RSM
    what actual changes implies, the implementation of the features varies from changer
    to changer, but client applications can access them in the same way, using the
    ideal model. This library model supports changer-based libraries as well as stand-alone
    drives, by modeling them as changers with one drive, no slots, and no robot.


    Client programs, such as backup applications and Hierarchical Storage Management
    (HSM) services, can use RSM to gain access to their media. RSM is an API that
    is called by these programs to make media accessible. Once media is accessible,
    these client programs use other Microsoft Win32 APIs to read and write the media.
    In addition, there is a Microsoft Management Console (MMC) snap-in for client
    (Removable Storage) that provides a human interface to manage this functionality
    as such as inject/ject, cleaning, and so on.


    # 6.1.1 RSM benefits


    Here are some of the benefits of including media and device management in the
    operating system with RSM.


    # Common drive model


    RSM implements a common driver model. A single driver will allow a tape library
    to be used with any RSM-compatible application. Conversely, an RSM-aware application
    will work with all changers on the market that have RSM drivers.


    # Library sharing


    Multiple applications can now share a single library. Previously, a user who wanted
    to backup and HSM solutions from two different vendors needed two changers. With
    RSM, both applications can share the same changer.


    # Abstraction of offline media


    A backup application does not need to worry about whether a tape is in a changer
    or on a shelf. It simply requests the media, and RSM loads it or asks an operator
    to fetch it as appropriate.


    # Media tracking


    RSM tracks recognized media in an internal database. Applications can register
    with RSM so that it can identify their media. They can also use the API to search
    the database and load particular media.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# 6.1.2 Software support


    Care be taken when using RSM with pre-existing or existing storage management
    applications. By default, RSM binds exclusively to all media changers on the system.
    This will break applications that expect to access these changers through other
    methods. All existing applications that are changer-aware must be reauthorized
    through RSM. Disabling RSM control of the device may allow the application to
    function, but this has not been tested, and will not be supported by Microsoft.


    The Windows 2000/2003 NTBACKUP application uses RSM for tape media, but not for
    media file systems (such as Zip or Jaz). The HSM tool called Remote Storage Server
    (RSS) is included with Windows 2000 Server to interface with tapes. Third-party
    data management vendors may have RSM-aware versions of their applications. Check
    if your backup vendor has an RSM version of their application.


    # 6.2 RSM implementation


    RSM keeps a database of all media, organized by pool and media type. Each application
    creates its own pool, so (for example) backup media and HSM media can be identified
    separately, even if they are present in the same library. The database is system-wide,
    so a tape removed from a library and inserted into a stand-alone drive on the
    same system will still be properly identified.


    # 6.2.1 Enabling RSM


    The environment for the RSM configuration is shown in Figure 6-1 and consists
    of:


    +   - Intel Pentium® II Server with Windows 2000 Advanced Server (build 2195).

    - Adaptec 29160 LVD SCSI card.

    - IBM 3580 SCSI attached. A single SCSI bus supported both the library controller
    and the two 3580 tape drives.

    - VERITAS Backup Exec Version 8.6 Revision 3808.


    ![](img/a48407b38d72fd58ea3627423836388a_274_0.png)


    Figure 6-1 SCSI lab environment'
  merge: -1
  pgno: 274
- img_proc: true
