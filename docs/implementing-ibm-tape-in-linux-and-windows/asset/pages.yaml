    The set of device special files created by scsidev contains the same devices that
    are in the standard /dev directory, but it uses a different naming convention.
    The naming is based on the address of the SCSI adapter and the SCSI address of
    every device. Therefore, the name of a device special file will not change even
    if a device with a lower SCSI address is temporarily unavailable. Similar to the
    standard Linux handling, scsidev recognizes disk and tapes.


    The device file names for disks start with *sd*, tapes are represented by file
    names that start with *sr* for the rewinding, and *st* for the non-rewinding behavior
    of tape. Generic SCSI device names start with *sg*. The name of the device is
    created from device addressing information. The device name sgh0-0c0610, can be
    read as SCSI generic device name on host 0 - hostid 0x00 (IOPORT) channel 0 scid
    6 /0. Example 4-29 shows that our LTO tape library is also available under the
    new naming scheme.


    > Example 4-29 Accessing the LTO library from SCSI configuration


    ```

    [root@diomede]# scsi_info /dev/scsi/sgh0-0c0610

    SCSI_ID="0,6"

