- img_proc: true
  md: '+   Provide enough bandwidth between the switches (ISLs), and consider enabling
    trunking for the ISL (see also 5.1.1, “What bandwidth we need for FC tape?” on
    page 224).


    Most SANs are designed for disk I/O (IOPS) rather than high bandwidth (for example,
    tape), which may not be enough ISLs for high bandwidth. As discussed in 5.1.1,
    “What bandwidth we need for FC tape?” on page 224, you need at least one ISL for
    every 3-4 tape devices. If you have more than one ISL between two switches, you
    should also consider enabling trunking. This is because there is no load balancing
    on the basis of real I/O over several ISLs as long as there is no trunking enabled.


    Many switches (for example, IBM 2109 and IBM 2005) have DLS (dynamic load balancing
    on the basis of the routing table) disabled, which means that load balancing is
    done during startup of the switch; you should check periodically if all ISLs are
    working. After installing an additional ISL, you should run the dynamic load balancing
    at least once by setting it. When done, remember to disable it again, as recommended
    by IBM.


    Another potential issue is the device driver level. IBM attempt to be on the same
    supported HBA device driver levels for tape and disk, but it is possible that
    because of a temporary issue, a given tape device will require a different device
    driver level than disk or vice-versa.


    For all of these concerns, IBM’s general recommendation is that, wherever possible,
    a single HBA should not be shared for concurrent disk and tape operation. IBM
    will support mixing disk and tape on an HBA, and the IBM Support Center will accept
    problems reported on these configurations. However, if the problem detection reveals
    that the cause is the mixing of tape and disk traffic, IBM may choose to tell
    the client that the only fix is to separate the traffic.


    > Important: IBM does not recommend sharing of disk and tape I/O on the same HBA.


    # PCI bus performance


    Different types of PCI buses have different performance specifications, as shown
    in Table 5-2. It does not make sense to put one 2 Gbps HBA in a 32/33 PCI bus;
    however, it does not make sense to put more than one 2 Gbps HBA in a 64/33 PCI
    bus, as the throughput will be saturated.


    Note: Bandwidth throughputs in Example 5-2 are burst rates. Sustained throughput
    rates are typically around 50% of the burst rates.


    | Width | Speed | Bandwidth |

    | --- | --- | --- |

    | 32-bit | 33 MHz | 132 MB/sec |

    | 64-bit | 33 MHz | 264 MB/sec |

    | 64-bit | 64 MHz | 512 MB/sec |

    | 64-bit | 132 MHz | 1056 MB/sec |'
