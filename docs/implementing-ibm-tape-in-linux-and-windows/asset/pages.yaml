    # RSM with a SAN


    It is not possible (by default) to use RSM to drive the LTO medium changer in
    a SAN-attached configuration. RSM can only auto-configure a robotic library when
    the following conditions are true:


    +   - The library unit hardware supports drive element address reporting with
    the Read ElementStatus SCSI command. (Consult the manufacturer to find out if
    your hardware unit supports this feature.)


    +   - All drives inside the robotic library are on the same SCSI bus as the library
    itself.


    +   - The TAPE library is not attached to a Fibre Channel switch. (This may change
    in future versions of RSM).


    Implementing IBM Tape in Linux and Windows'
