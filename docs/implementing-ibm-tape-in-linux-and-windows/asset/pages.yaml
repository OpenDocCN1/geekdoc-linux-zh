  md: '# SCSI support


    ![](img/a48407b38d72fd58ea3627423836388a_217_0.png)


    Figure 4-3 Configuration for SCSI disk, tape, generic device support


    The first entry enables SCSI support in general. All the types of devices (that
    is, disk, tape, and CD-ROM) that we want to access, either at boot time, or before
    the kernel module support is available, should be compiled into the kernel. For
    these devices, we select y. It is important that all the drivers that are required
    to access the boot devices and boot file systems are compiled into the kernel.
    Most of the other kernel features can be configured as modules.


    We recommend activating the feature Probe LUNs on each SCSI device. This is especially
    important with multi-path libraries where the changer device appears as LUN 1
    on the same SCSI ID as the first drive. It is also important in SAN environments
    where device addressing via LUNs is standard. If Probe LUNs on each SCSI device
    is not enabled at compile time, it can be activated later via a kernel or module
    parameter. To probe for eight LUNs, use the parameter max_scsi_luns=8. The parameter
    max_scsi_luns must be present as a kernel parameter if the driver is compiled
    into the kernel. If the driver is loaded as a module, LUN probing can be activated
    by adding the following line to /etc/modprobe.conf: scsi_mod_max_scsi_luns=8


    The menu entry SCSI low level drivers brings up the configuration for the SCSI
    adapters that are supported by the Linux kernel, as shown in Figure 4-4 on page
    191. Here we activate the support for our Adaptec SCSI controller.'
