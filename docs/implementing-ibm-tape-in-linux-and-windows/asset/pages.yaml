    # Migration from partitioning without ALMS to ALMS


    A library that was previously installed without ALMS can be upgraded to ALMS by
    enabling the ALMS license key. The license key must be entered using the Operator
    panel (see "Enter ALMS license key" on page 63).


    When enabling ALMS, it reuses the existing library configuration. This means that
    you get the same number of logical libraries. Cartridges and tape drives that
    were already assigned to the same logical library. Tape drives get the same SCSI
    element address (if there was a gap in the SCSI element address) and all cartridges
    get the same SCSI element address as the non-ALMS definition.


    However, the storage element address of the new logical libraries will change,
    as described in "Storage virtualization" on page 58. For the first logical library,
    the storage address begins with 1025, for the second one with 1026, and so on.
    Adding a new logical library (Redbook2) to the three logical libraries that were
    already defined without ALMS means this library will be four, and accordingly
    with a cartridge element address of 1028.


    Also, in mixed media, the reported number of maximum storage slots may change
    to the number of currently installed cartridge slots. Consequently, when you enable
    ALMS, your application may also need to be reconfigured. For some applications,
    such as the IBM Tiv Storage Manager, you just have to stop and restart the server;
    for other applications, such as EMC Legato NetWorker, you have to run a configuration
    wizard (jconfig).


    You can enable ALMS by using the Tape Library Specialist. Select **Manage Library**
    → **Enable ALMS** (refer "Enable ALMS" on page 64).


    To illustrate how ALMS changes the configuration of the logical libraries, we
    show the detailed information for the logical library named Redbook1 in Figure
    2-46 and Example 2-3 on page 76. It includes three drives with SCSI element addresses
    257, 258, and 259. The storage element address range is 1025 to 1104 (80 storage
    addresses). The physical library has 175 storage slots in total.


