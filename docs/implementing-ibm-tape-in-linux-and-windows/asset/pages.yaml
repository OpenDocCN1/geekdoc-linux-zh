  md: "A warning will pop up indicating that the drive will be taken offline during\
    \ the update. If you wish to continue, click the Next button.\n\nSelect a specific\
    \ drive in the drop-down list to be updated or select All drives.\n\nUse the Browse\
    \ button or enter the file name to load the firmware file you downloaded from\
    \ the support page.\n\nClick Update to finish the firmware update. The drive will\
    \ be taken offline during the update process. The library should then activate\
    \ the new firmware automatically.\n\n# 3.9.5 Upgrading the drive using LTO-TDX\n\
    \nLTO-TDX is a SCSI and Fibre Firmware Download and LTO Dump Upload tool. LTO-TDX\
    \ is an alternative method for downloading LTO firmware across the SCSI bus or\
    \ Fibre Channel. In addition, this tool can be used to upload LTO drive error\
    \ dumps, which can be sent to the Support Center for further analysis. LTO-TDX\
    \ needs no additional drivers and it is the fastest and easiest to update a fibre\
    \ lto drive.\n\n> Note: LTO-TDX is available for Windows, Linux, and NetWare operating\
    \ systems.\n\nThe following information describes how to obtain the tool and lists\
    \ its capabilities.\n\n+   * The tool supports all IBM LTO Gen 1, Gen 2, and Gen\
    \ 3 SCSI and FC drives. The tool will not support any other manufacturer's LTO\
    \ drive.\n* The tool can perform two functions:\n    * Download firmware to the\
    \ drive.\n    * Upload a dump of the drive firmware logs from the drive to a host\
    \ where the FC or SCSI HBA is installed.\n* The tool can load back-level (older)\
    \ code.\n\nThe tool is distributed through the IBM Web site:\n> http://www.ibm.com/storage/support/lto\n\
    \nSelect Linear Tape-Open (LTO) in the Product family drop-down, enter your library\
    \ model in the Product drop-down and click Go. Click the Download tab, and under\
    \ Tools and Utilities, click Software. You will see a link to download LTO-TDX.\n\
    \nRun the downloaded tool file (executable file) to install it. It creates an\
    \ icon on the Windows desktop and two folders called LTO firmware and LTO dump.\
    \ Any firmware downloaded for install must go into the firmware folder. Any dumps\
    \ are created in the dump folder. The tool presents a list of the supported devices\
    \ on the bus. The tool allows selection of a target device and performs the download\
    \ or the dump on the target device.\n\nTo save time, verify that the drive is\
    \ empty. The tool checks to see if a cartridge is in the drive (cartridge present\
    \ sensor activated). If a cartridge is present, it will post an error and request\
    \ that you remove the cartridge.\n\nDouble-click the LTO-TDX icon from the Windows\
    \ Desktop. Figure 3-125 on page 180 displays."
