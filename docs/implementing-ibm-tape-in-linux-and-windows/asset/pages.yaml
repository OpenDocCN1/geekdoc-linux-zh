  md: '# Scenario 7


    Replace an existing tape library and migrate the client data to a new LTO tape
    library. The steps are the same whether migrating to Ultrium 2 or Ultrium 3 drives
    and media. You are, however, encouraged to migrate to the newest generation library.


    Various techniques can be used. We will describe migrating the data using an existing
    management class. This only requires modifying the currently used storage pool
    to cascade to the new LTO storage pool. This has the advantage of being less disruptive,
    and has no effect on the client option files.


    We give two possibilities for storage pools, depending on whether the primary
    destination is a disk or tape (sequential) pool.


    # Sequential storage pool as primary copy destination


    Your modification affects the storage pool only:


    +   1. The new LTO library, library path, drives, drive paths, and device classes
    must be first defined.

    2. An LTO sequential storage pool or copy storage pool must be created using the
    new LTO device class (label 1 in Figure 7-30 on page 31).

    3. Modify the NEXTSTPOOL parameter of the old storage pool to point to the new
    LTO storage pool (label 2 in Figure 7-30 on page 31).

    4. Update the old storage pool ACCESS to READONLY.


    > Note: This assumes that you want to move the entire storage pool content to
    the new LTO, as you cannot have the storage pool read-only for certain management
    classes and read-write for others.


    +   5. You can leave the old storage pool as it is, and over time, expiration
    of old backups will reduce the usage of the old storage pool.

    6. However, if you want to drain the old storage pool more quickly, you can simply
    use HIGHM and LOWMIG to zero. This starts a migration process that moves data
    from the old storage pool to the new LTO storage pool. To speed up the migration,
    you can increase the MIGPROCESS limit for the old storage pool to use more drives
    (this is a drive to process).

    7. Alternatively, you can execute a MOVE DATA volume_name LTO_storage_pool_name
    command, selecting each individual volume from the old storage pool, and targeting
    the new LTO storage pool.

    8. Once the storage pool is empty, modify the BACKUP and ARCHIVE COPY GROUP of
    each management class to point the DESTINATION back to the new LTO Storage pool
    (label 3 in Figure 7-30 on page 313).

    9. Delete the DRIVE and PATH, and also the LIBRARY and PATH entries for the old
    library and drives.'
  merge: -1
  pgno: 339
- img_proc: true
