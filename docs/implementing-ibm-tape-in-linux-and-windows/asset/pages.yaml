  md: '# 1.1 LTO overview


    The Linear Tape-Open (LTO) program is a joint initiative of Hewlett-Packard, IBM,
    and Seagate Technology. In 1997, the three companies set out to enable the development
    of best-of-breed-type tape storage products by consolidating state-of-the-art
    technologies from numerous sources. The three companies also took steps to protect
    client investment by providing a four-generation road map and establishing an
    infrastructure to enable compatibility between competitive products.


    The LTO technology objective was to establish new open-format specifications for
    high capacity, high performance tape storage products for use in the midrange
    and network computing environments, and to enable superior tape product options.


    LTO program cooperation goes beyond the initial three companies. LTO format specifications
    have been made available to all who want to participate through standard licensing
    provisions, so that LTO-specified products (tape drives and tape storage cartridges)
    will already attracted a number of other industry leaders, will reach the market
    from multiple manufacturers, not just the Tape Provider Companies. This is critical
    to meeting an an open market objective, and is accomplished through open licensing
    of the technology.


    Cooperation is also evident in the LTO program requirement that all tape products
    produced by licensees be technically certified annually. The primary objective
    of this certification is to help determine whether LTO format cartridges are exchangeable
    across drives produced by different Ultrium manufacturers. In other words, LTO
    compliant across any vendor can be read and written in LTO compliant products
    from any vendor.


    All three consortium members (IBM, HP, and Seagate) are now shipping LTO Ultrium
    products, and numerous other licensees are shipping hardware and media.


    The Linear Tape-Open home page is:


    ```

    http://www.lto.org

    ```


    For more information about LTO technology, see IBM TotalStorage Tape Libraries
    Guide for Open Systems, SG24-5946.


    The IBM LTO home page is:


    ```

    http://www.ibm.com/storage/lto

    ```


    The LTO road map (Figure 1-1 on page 5) shows the evolution of LTO technology.
    At the time of writing, IBM Ultrium generation 2 and 3 products are offered; however,
    there are many existing installations of now-withdrawn Ultrium 1 products, so
    we also include them for your reference. The information in the road map is given
    as an indication of developments by the three consortium members, and is subject
    to change.


    > Important: Hewlett-Packard, IBM, and Seagate reserve the right to change the
    information in this migration path without notice.'
