    LVD is available either as SCSI, which has an 80 MB/second speed or the new Ultra160
    SCSI at 60 MB/second, while HVD is Ultra SCSI, which has a maximum speed of 40
    MB/second. Not necessarily. Does this mean that the LTO drive can run faster with
    LVD versus HVD? Not seen here is the SCSI bus speed. Ultra 1 drives (whether LVD,
    HVD, or Fibre Channel) have a normal speed of 15 MB/second, while Ultra drives
    run at 35 MB/second. If the speed of the bus is the only limiting factor in your
    configuration, then, switching to a faster bus could improve your performance.
    The speed capability of the bus will determine the number of LTO drives that can
    be attached on the same bus. But again, this is not the only factor in the equation.


    In addition to the speed differences, there are connection restrictions associated
    with each. Both HVD and LVD can span 25 meters in a point-to-point configuration.
    In a multiprop (daisy-chain) configuration, HVD can span 25 meters, while LVD
    is limited to 12 meters.


    So, which would you choose?


    If you have a situation where the 12 meter multiprop limitation of LVD is not
    an issue, then you would purchase LVD? You would think so, but the correct answer
    is that it depends. It depends on the HBA that you have installed in your server.
    If you have an existing adapter and you do not want to change it, whether the
    adapter is HVD or LVD will dictate the LTO drive you order and the configuration
    capabilities.


    What if you do not already have an adapter? Order LVD, right? Again, not necessarily.
    Not all SCSI HBAs are available in both interface types. For example, iSeries
    and AS/400 support only HVD when directly SCSI attached.


    Table 1-9 HVD and LVD characteristics


    | Point-to-point | HVD | LVD |

    |---|---|--|

    | Multidrop | 25 meters | 12 meters |

    | Speed | 40 MB/second | 80 or 160 MB/second |


    # 1.8 SCSI HD68 and VHCI cable connectors


    There are three types of SCSI cables: HD68-HD68, HD68-VHCI, and VHCI-VHCI. The
    HD68 connector is the normal 68-pin SCSI connector. The Very High Density Connector
    (VHCI) is a mini SCSI connector that is about half the width of the HD68 connector.
    The server SCSI adapter can be either HD68 or VHCI. For RS/6000, AS400, and HP
    servers, LVD SCSI adapters are always VHCI, and HVD adapters are always HD68.
    But Sun and Netinity/Intelli servers have some adapters that require the connector
    type for a given adapter can be found in either of two ways. You can look at the
    adapter and the plug will be either about 3 cm wide (VHCI) or 6 cm wide (HD68).
    The other method is to look up the adapter characteristics to determine the plug
    type. One source of information is the IBM Total UltraScalable Tape Library 3584
    Operator Guide, GA32-0468, available online at:


    ```

    http://www-03.ibm.com/servers/storage/tape/resource-library.html#publications

    ```


    Before June 12, 2001, all the LTO drives used HD68 connectors. The current IBM
    3584 hot swappable drive uses the VHCI connectors. Check to make sure you order
    the correct cable with the right-end plug to attach to your HBA.'
