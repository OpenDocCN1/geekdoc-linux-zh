    # Disabling RSM


    We recommend disabling RSM from the services (select Start -> Programs -> Administrative
    Tools -> Services, as shown in Figure 3-72 on page 135) before removing the Ultrium
    devices. Ensure that all device activity has been halted before performing this
    step.'
