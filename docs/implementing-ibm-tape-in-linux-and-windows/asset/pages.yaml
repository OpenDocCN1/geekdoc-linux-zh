- img_proc: true
  md: '# 9.2.2 Installing NetVault


    The NetVault application code is available on diskette, CD-ROM or zip package.
    Both the CD-ROM and zip packages are built from a diskette images. To start the
    installation, execute setup.exe.


    You will see an introductory window (Figure 9-3) and then the licensing agreement
    (Figure 9-4).


    ![](img/a48407b38d72fd58ea3627423836388a_371_0.png)


    Figure 9-3 Initial NetVault installation window


