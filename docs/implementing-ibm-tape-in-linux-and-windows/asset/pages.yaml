  md: '# ### 5.1.4 Different SAN fabrics for disk and tape


    To guarantee the availability of your SAN, either during necessary maintenance
    or to protect against human error, the best practice is to build redundancy through
    independent SAN fabrics, thus avoiding any single point of failure. Some large
    installations also separate disk and tape into different SANs. There are some
    advantages for separating SAN into Storage (Disk) and Backup (Tape):


    +   - Backup and Storage teams can manage their SAN separately and independently.

    - Backup and Storage teams can design their SAN for their specific needs and requirements.

    - If there are different vendors for Storage and Backup, service and maintenance
    will likely be easier and simpler. Each vendor is responsible for its own SAN.


    Therefore, separating disk and tape into different SANs is principally useful
    for:


    +   - A large environment with a need for high availability

    - An environment with different vendors for disk and tape


    # ### 5.2 Zoning


    Zoning allows you to partition your SAN into logical groupings of devices so that
    each group is isolated from each other and can only access the devices in their
    own group. Using zoning, you can arrange fabric-connected devices into logical
    groups, or zones, over the physical configuration of the fabric. Zones can be
    configured dynamically. They can vary in size depending on the number of fabric
    connected devices, and devices can belong to more than one zone. Because zone
    members can access only other members of the same zone, a device not included
    in a zone is not available to members of that zone. Therefore, you can use zones
    to:


    +   - Create closed user groups, for example, between test and development environments.

    - Create a barrier between different environments, such as Windows and UNIX operating
    systems.

    - Secure fabric areas.


    Figure 5-8 on page 233 shows two slightly overlapping zones, represented by the
    solid lines and the dotted lines.'
