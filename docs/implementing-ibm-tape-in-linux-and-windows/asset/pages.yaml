    # 4.4 Using IBM Tape Device Driver


    The IBM Tape Driver is certified specifically to a particular Linux distribution
    and kernel versions. If you want to use a kernel version that is not supported
    by the IBM tape device driver, you will need to use the native Linux device driver,
    as shown in the previous sections.


    # 4.4.1 Installing the IBM tape device driver and utilities


    The IBM tape device driver for Linux can be downloaded from the following site
    or one of the mirror sites:


    ```

    ftp://ftp.ibm.com/storage/devdvr/Linux/

    ```


    Find the sub-directory corresponding to your Linux distribution and version.x.x.x.
    The driver comes in an RPM package in the form IBMTape-x.x.x-y.y.y.i386.rpm, where
    x.x.x is the version of the driver itself, and y.y.y is the version of the kernel
    that it supports.


    You also need to download, from the same directory, the IBMtapeutil program (which
    includes IBMTapeconfig util). IBMtapeutil provides a comprehensive collection
    of tape and library commands. IBMtapeutil exists in a separate tar package from
    the device driver. The package is IBMtapeutil.x.x.x.i386.tar.


    We are installing the IBM tape device driver in the following environment:


    +   - IBM @server xSeries 335 with SUSE 9

    - QLogic QLA2300 64-bit PCI Fibre Channel HBA

    - IBM TotalStorage 3584 Tape Library with native FC drives


    Example 4-32 on page 204 shows the installation of the IBM tape device driver
    and the IBMtapeutil package. Details can also be found in the IBM Ultrium Device
    Drivers: Installation and User''s Guide, GA32-0430. To install the device driver,
    use rpm. To install IBMtapeutil, untar the package into a directory and from that
    directory make install.'
