    # # 1.6 Host Bus Adapters and device drivers


    This section will cover the following:


    +   - What are HBAs?

    - Why are they needed, and which one do you need?

    - Are drivers needed for HBAs?


    > **Restriction:** At this time, there are restrictions on attaching both disk
    and tape devices to the same HBA. See 5.1.3, "Tape and disk on the same HBA" on
    page 228 for more information.


    # ## What are HBAs


    HBA stands for Host Bus Adapter. An HBA is an I/O adapter (or card) that sits
    between the host computer''s bus and the SCSI or Fibre fabric and manages the
    transfer of information between the two channels. To minimize the impact on host
    processor performance, the HBA performs many low-level interface functions asynchronously
    or with minimal processor involvement.


    # ## Device drivers


    A device driver is a program that controls a device, whether it is a printer,
    disk drive, or keyboard. Many drivers, such as the keyboard driver are included
    with the operating system. For other devices, you may need to load a new driver
    either from the operating system CD, or as provided by the manufacturer when you
    first install the device on your computer.


    A driver acts like a translator between the device and programs that use the device.
    Each device has its own set of specialized commands that only its driver knows.
    In contrast, most programs access devices using generic commands, that is, Read,
    Write, Put, and Get. The driver, therefore, accepts generic commands from a program
    and translates them into specialized commands for the device.


    Figure-1-13 is an example of the data flow between an application program and
    a LTO tape device. Note the different pieces of code or microcode involved.


    The HBA Driver is not always a separate piece of software; sometimes it is included
    as part of the operating system. This is true for many common SCSI adapters with
    Linux. You should check the documentation provided with the card to see if this
    is true. For Fibre HBAs, driver software will almost always need to be installed.


    | Application Program (software) | LTO device driver (software) | HBA device driver
    (software) | HBA device adapter (hardware) | LTO tape device |


    Figure 1-13 Device data flow'
