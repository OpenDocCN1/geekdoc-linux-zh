    # 4.6.3 Dynamically attaching a tape device


    If you physically attach a tape device on the switch and zfcp is already loaded,
    you need to reboot the Linux system to add this entry in the /proc/scsi/scsi.
    The zfcp driver provides an add_map proc system entry under the directory /proc/scsi/scsi/zfcp
    to allow you to dynamically add the device into the system. For example, to add
    two LUNs from the above example into the system, you use the following commands:


    ```

    <echo "zfcp0 0x1:005050673300040273 0x0:0x0000000000000000\"

    <echo "zfcp1 0x1:005050673300040273 0x0:0x0000000000000000" >/proc/scsi/zfcp/add_map

    <echo "scsi add-single-device 0 0 10" >/proc/scsi/scsi

    <echo "scsi add-single-device 1 0 11" >/proc/scsi/scsi

    ```


    The scsi add-single-device takes four parameters, corresponding to the four parameters
    scsi, channel, id, and lun in the /proc/scsi/scsi file. The value of scsi is 0
    for the first devno, for the second devno (if it is different from the first devno),
    and so on. The value of channel can start from 0 for each different scsi value.
    The value of id is you for <unit scsi-lun> in the above mapping. The value of
    lun is the LUN of the target device, for example, the last number in the above
    mapping.


    Currently, the zfcp device driver does not support dynamically removing the attached
    devices. If you need to remove the tape devices from the system, run rmmod zfcp.
    Then you can delete the entry in /etc/modules.conf and reload zfcp, or reload
    zfcp and dynamically add the devices you want.


    After you have done all the mapping, if you can see all of the attached tape devices
    in /proc/scsi/scsi, you have successfully attached those devices to your system.
    Refer to 4.4.1, "Installing the IBM tape device driver and utilities" on page
    203 for details on installing the IBM Ultrium Device Drivers.'
