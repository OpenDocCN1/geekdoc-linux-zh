    # ## Connection type of IBM tapes


    Earlier IBM tape drives, including the IBM 3590, and IBM LTO1 FC drives, use the
    FC-AL protocol. Therefore, those drives must be connected to a port (switch or
    HBA if direct connected), which can also use FC-AL. Not all SAN switches or SAN
    directors support FC-AL. Some McData Directors and switches (6064, 6140, 3232)
    use a switch in front that supports FC-AL (McData 4500) to connect IBM 3590 and
    IBM LTO1. The IBM LTO2 and


    240 Implementing IBM Tape in Linux and Windows'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'LTO Fibre Channel tape drive and the IBM 3592 can arbitrate to communicate
    using either loop or fabric protocol.


    Because all IBM tape drives use a public loop connected via FC-AL to a SAN switch,
    the server sees no difference whether the tape drive is connected as FC-AL or
    FCP. Through the public loop capabilities, the tape drive sends its WWN to the
    name server of the switch during the FLOGI (fabric login). If a server wants to
    communicate with the tape drive, then the server queries the name server of the
    switch, gets the WWN of the drive, and proceeds with a PLOGI (N-Port login) (see
    Figure 5-18). The same PLOGI will happen if the tape drive is connected as a FCP
    device.


    ![](img/a48407b38d72fd58ea3627423836388a_268_0.png)


    Figure 5-18 N-Port login


    Per SNIA specification, IBM LTO2 and LTO3 drives attempt first to negotiate as
    a Loop device. If unsuccessful, the drive attempts to log in as a fabric device,
    then you need to change the settings on your switch so that FC-AL login is disallowed.
    Here is an example, for an IBM 2109 or 2005 switch, of how to change the settings
    so that switch only allows FCP devices:


    +   1. Telnet to the switch.


    +   2. Display Port Config:



    ```

    portcfgshow nn

    ```


    +   3. Disable the switchport:



    ```

    disableport nn

    ```


    +   4. Set port characteristics:



    ```

    portcfgport nn 1

    ```


    +   5. Enable the switchport:



    ```

    enableport nn

    ```'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'For other switches, refer to your vendor documentation.


    With the appropriate microcode, you can change the port settings for LTO2 and
