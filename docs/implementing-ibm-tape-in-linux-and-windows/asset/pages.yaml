  md: 'operations. The local uses its own conventions and will use default operating
    parameters.


    # 7.2.3 Defining the devices and users using the command line


    Manually defining the library using the command line or Administrative interface
    allows greater control over the options associated with this action. Use the device
    names as seen in the Tivoli Storage Manager Management Console (Figure 7-15) for
    defining the devices in the Tivoli Storage Manager.


    ![](img/a48407b38d72fd58ea3627423836388a_296_0.png)


    > Figure 7-15 Checking the Tivoli Storage Manager device name in the Management
    Console


    First, define the library and library path using the following commands. When
    there are multiple choices, the default setting is listed.


    ```

    DEFINE LIBRARY library_name library_path=SCSI AUTOLABEL=yes/no

    DEFINE PATH path_name library_name SCRTYPE=SCSI DESTYPE=LIBRARY DEVICE=dev_name

    ```


    For library_name, enter a user-specified name of the library to be defined:


    ```

    DEFINE LIBRARY liloib3584 TYPE=SCSI

    ```


    For server_name, specify the name you have for your server with the SET SERVERNAME
    command. This can be checked by issuing the QUERY STATUS command. In our case,
    we use the name lilo. For dev_name, enter the full device name of library, such
    as ib2b1.0.0.2.


    ```

    DEFINE PATH lilo liloib3584 SCRTYPE=SERVER DESTYPE=LIBRARY DEVICE=ib2b1.0.0.2

    ```


    Next, define each of the library''s drives and paths with:


    ```

    DEFINE DRIVE drive_name drive_name ELEMENT=element_number/AUTODECT=YES

    CLEANFREQUENCY=Gigabytes/ASNEEDED/NONE

    DEFINE PATH server_name drive_name SCRTYPE=SCSI DESTYPE=DRIVE LIBRARY=library_name
    DEVICE=dev_name

    ```


    For library_name, enter the name of the already defined library (lib3584). Use
    the operating system device name of the tape drive being defined for dev_name.
    Enter the full device name for dev_name, an address that indicates the physical
    location of a drive within an automated library. Tivoli Storage Manager needs
    the element address to connect the physical location of the drive to the drive''s
    SCSI address. As Version 5.2, you can now autodetect for element_number, and this
    is the default. The element number will then be automatically detected by Tivoli
    Storage Manager when the drive is defined.


    Chapter 7. Configuring IBM Tivoli Storage Manager on Windows and Linux 269'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'Keep in mind that the drives are not necessarily configured by the operating
    system in the same order as they are installed physically in the library, as described
    in 5.3, "Persistent binding" on page 237. Therefore, check carefully the element
    address maps with your drive configuration.


    **Note:** The CLEANFREQUENCY parameter in the DEFINE drive command is optional.
    Storage Manager-managed cleaning is intended for drives and libraries that do
    not have an automatic cleaning function. The IBM 3581, 3582, 3583, and 3584 have
    an automatic cleaning function, which means they take care of drive cleaning.
    Therefore, it is not necessary to specify the CLEANFREQUENCY parameter, because
    the default value is NONE.


    The IBM 3581 2U does not have an automatic cleaning function; therefore, we recommend
    you let Tiv Storage Manager manage the cleaning for this device.


    If you want Tiv Storage Manager to control drive cleaning, you should use the
    option AS NEEDED. You will have to change the auto cleaning function to the host
    cleaning function on the autoloader or library. Also, if you use a partitioned
    IBM 3584, every logical partition needs its own cleaning cartridge.


    There is no need to clean LTO drives on a periodic basis (that is, after several
    gigabytes processed by the drive), and additional manual cleanings are discouraged.


    We configured our drives in the IBM 3584 with:

    DEFINE DRIVE lib13584 drive1

    DEFINE DRIVE lib13584 drive2

    DEFINE PATH t11lo drive1 SRCTYPE=SERVER DEVICYPE=DRIVE LIBRARY=lib3584 \ DEVICE=mt2.0.0

    DEFINE PATH t11lo drive2 SRCTYPE=SERVER DEVICYPE=DRIVE LIBRARY=lib3584 \ DEVICE=mt3.0.0


    > **Tip:** Before defining the drives and libraries, make sure that your library
    is online and your drives are available. Also, there should be no cartridge in
    the drive being defined.


    Continue the implementation in 7.2.5, "Defining the device class using the command
    line" on page 271.


    # 7.2.4 Defining the device class using the Configuration Wizard


    To allow the Tiv Storage Manager server to correctly use the IBM tape library
    and drives, we must define a device class. A device class is best thought of as
    the interface that allows Tiv Storage Manager to effectively communicate with
    a device.


    If we run the Configuration Wizard to install the tape library and drives, the
    LTO device class and associated storage pool will be created automatically in
    the background. But we have a better control of the options using the command
    line.'
