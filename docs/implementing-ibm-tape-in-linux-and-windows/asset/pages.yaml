  md: 'IBM tape libraries and devices are generally supported, at the time of writing
    this Redbook, on Windows 2000 build 2195 (Service Pack 2) or later, or Windows
    2003 build 3790 or later. Even though device driver media was shipped with your
    IBM tape hardware, we recommend that you always download the latest version from
    the appropriate website:


    ```

    http://software.ibm.com/storage/devdvr/windows/win2000/

    http://software.ibm.com/storage/devdvr/Windows/Win2003/

    ```


    Beginning with V6.0.4.4, the IBM tape drivers for Windows 2000 and Windows 2003
    have been converged into a single install package with common files. Use this
    single package to install a driver on either operating system. The system detects
    which version of the driver binary files to install. The 3592 and Ultrium drives
    have also been converged.


    For Windows 2000, the file to download is IBMTape.W32_xxxx.zip, where xxxx is
    the version number. Always download the latest version unless specifically otherwise
    by IBM Support.


    For Windows 2003, the file to download is IBMTape.Wnn_xxxx.zip, where nn is either
    32 or 64 and xxxx is the version number. Always download the latest version unless
    specifically otherwise by IBM Support.


    Also, consider the readme file in the same directory for any additional considerations.
    The readme file is IBM.W200x.Readme.txt.


    > Note: For Windows 2000, before V6.0.4.4, there were separate files for the LTO
    and the 3592. The driver file name for the LTO drives was IBMUltrium.Win2k_xxxx.zip,
    where was was the version number and the readme file was IBMUltrium.Win2k.Readme.txt.
    The 3592 Enterprise Tape Drive was named IBMBMag.Win2k_xxxx.zip, and the readme
    file was IBMBMag.Win2k.Readme.txt.


    > Note: A certified version of the LTO device driver for 3580 drives is also available.
    The files are contained in a folder named LTO_WHQL_Cert. For Windows 2000, the
    file to download is named LTOCertW32_xxxx.zip, where xxxx is the version number.
    For Windows 2003, the file to download is named LTO_CertWnn_xxxx.zip, where nn
    is either 32 or 64 and xxxx is the version number. The readme file is named LTOCert.Readme.txt.
    Always download the latest version unless specifically otherwise by IBM Support.


    This certified driver will operate only IBM Ultrium 3580 tape drives, generations
    1, 2, and 3, installed in a tape library or running standalone. The driver that
    operates other IBM tape drives, such as the IBM 3590 and 3592, is not certified,
    nor has the driver that operates IBM tape libraries, including the IBM 3582, 3583,
    and 3584 libraneses


    > Note: There is a debug version of the Ultrium drivers available with the installed
    package located in the checked directory. The checked directory can be found in
    the directory where the device drivers were unpacked.


    This version may be copied with a debugging tool to identify and resolve any issues
    encountered when installing the device driver. For more information regarding
    the use of the debug driver version, refer to the IBM Ultrium Device Drivers:
    Installation and User''s Guide GA32-0450.'
