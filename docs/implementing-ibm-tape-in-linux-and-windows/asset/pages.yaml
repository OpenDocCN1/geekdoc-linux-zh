  md: '# 3.9.4 Upgrading drive firmware using the IBM Tape Specialist


    To update the 3581 2U, 3582, 3583, or 3584 drive firmware, use the IBM Tape Specialist
    panels.


    # Updating the IBM 3581 2U drive firmware using the Tape Specialist


    To update the drive firmware using the IBM 3581 Tape Specialist, download the
    latest version at:


    ```

    ftp://ftp.software.ibm.com/storage/358x

    http://www.ibm.com/servers/storage/support/lto/

    ftp/index.sysors.ibm.com/3581

    ```


    Log on to the Specialist as Administrator; the default password is Secure. Select
    **Maintenance → Firmware**. Select the new firmware and click the **Update** button.
    A warning message pops up asking for confirmation. Click **Yes** to start the
    update. The Specialist does not show any status screen until the update is complete,
    but on the Operator Control Panel, the Drive Firmware Upgrade message is shown.
    After the firmware update is finished, a reboot is initiated.


    # Updating the IBM 3582 drive firmware using the Tape Specialist


    To update the drive firmware using the IBM Tape Specialist, the latest firmware
    for the Ultrium drives can be found at:


    ```

    ftp://ftp.software.ibm.com/storage/358x

    http://www.ibm.com/servers/storage/support/lto/

    ```


    From the Ultrium Tape Specialist Welcome screen, select the **Firmware** tab.
    Enter the user name and password. The default settings are Admin for the user
    and secure for the password. Select the drive you want to update and select the
    new firmware. Click the **Update Firmware** button. A status of the drive update
    process is displayed. It can take more than one hour to update a single drive.


    # Updating the IBM 3583 drive firmware using the IBM Specialist


    The latest firmware for the Ultrium drives can be found at:


    ```

    ftp://ftp.software.ibm.com/storage/358x

    http://www.ibm.com/servers/storage/support/lto/

    ```


    From the Ultrium Tape Specialist Welcome screen, select the **Firmware** tab.
    Enter the user name and password. The default settings are Admin for the user
    and secure for the password. Select the drive you want to update and use **Browse**
    to select the new firmware. Click the **Update Firmware** button. The status of
    the drive update process is displayed.


    # Updating the IBM 3584 drive firmware using the IBM Specialist


    To update the drive firmware using the IBM Tape Specialist, the latest firmware
    for the Ultrium drives can be found at:


    ```

    ftp://ftp.software.ibm.com/storage/358x

    http://www.ibm.com/servers/storage/support/lto/

    ```


    From the Service Library menu, select **Firmware Update**. An attention screen
    pops up to verify that you have the firmware update you want to apply. If not,
    select the Ultrium support site and download the appropriate firmware.


    When you have the appropriate firmware downloaded, click the **Launch Firmware
    Update Wizard** icon. Select the drive you want to update and click the **Next**
    button.'
