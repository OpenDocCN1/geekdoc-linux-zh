  md: 'this may no longer be necessary, as ALMS always tries to assign the same SCSI
    element address to the cartridge, even though the cartridge was moved manually.


    Because ALMS is based on the affinity between VOLSER (barcode label) and the reported
    SCSI element address, you have to make sure the barcode label is readable. The
    library tries to keep the same SCSI element address for an unreadable barcode
    label if this cartridge is stored in the physical slot. But, if the cartridge
    was moved manually, and the library does an inventory, a cartridge with an unreadable
    barcode label is placed in an unassigned status.


    The same is true if you work with unlabeled cartridges (no barcode label): As
    long as you do not move this cartridge manually, the library tries to assign a
    SCSI element address. If you move such a cartridge manually, the cartridge will
    be placed in an unassigned status.


    Same happens with cartridges having duplicate barcode labels. Using duplicate
    barcode labels is generally not supported, and can easily lead to confusion.


    It is possible that the storage capacity of the library, as reported by each logical
    library, may exceed the physical storage capacity of the library. As such, it
    is possible to run out of storage space while still reporting available space
    to a host. SNMP and Operator panel messages will notify the client as the library
    approaches near full capacity. In addition, if cartridges are placed in the I/O
    station when a library has reached its capacity, the cartridges will be marked
    inaccessible to all hosts to prevent the condition where the host tries to move
    the cartridge to storage that does not really exist.


    When ALMS is enabled, auto clean is automatically enabled, and there will be no
    mechanism to disable it. Cleaning cartridges are never associated to a logical
    library, so there will be no host awareness that they exist in the library.


    Static partitioning cannot be used when ALMS is enabled. The partitioning for
    the entire library is either static or dynamic.'
