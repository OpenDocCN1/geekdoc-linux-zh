  md: '# 4.4.5 Setting up path failover on Linux


    The IBM tape device alternate pathing support will configure multiple physical
    paths to the same device within the device driver to provide Data Path Failover
    (DPF) and dynamic load balancing for devices using multiple Host Bus Adapters
    (HBA).


    **Note:** These functions are supported only on IBM Ultium 2 and 3 native Fibre
    Channel drives and IBM 3592 tape drives. It is not supported on IBM Ultium 1 drives
    or for devices that are attached to an IBM SAN Data Gateway.


    Consider a multipath connection that consists of two Host Bus Adapters (HBA) in
    a Linux host that is connected to a switch to the tape drive. This connection
    provides two physical paths to same tape drive for redundancy if one path from
    the HBA to the drive fails.


    When the HBA device driver is loaded into the running system, the HBA detects
    logical devices of the tape drive. For example, /dev/IBMTape0 and dev/IBMTape1
    will be created by the IBMtapeed daemon or the IBMtapeconf script. Each logical
    device is a physical path to the same tape drive. A backup and restore application
    can open and use only one logical device at a time, either /dev/IBMTape0 or /dev/IBMTape1,
    because they represent the same physical device.


    Without the alternate pathing support, if an application opens /dev/IBMTape0 and
    a permanent path error occurs (because of an HBA or cable failure, example), the
    application fails. It is possible to initiate manual failover by restarting the
    application on the alternate logical device (/dev/IBMTape1), but the application
    has to be restarted from the beginning. A long backup or restore operation could
    have been progressed when the path error occurred. Some manual failover can require
    operator intervention to reset the device because a SCSI Reservation could still
    exist on the failing HBA.


    When the alternate path support is enabled on both /dev/IBMTape0 and /dev/IBMTape1,
    the device driver configures them internally as a single device with multiple
    paths. The application can open and use only one logical device at a time (either
    /dev/IBMTape0 or /dev/IBMTape1). If an application opens /dev/IBMTape0 and a permanent
    path error occurs, the device driver initiates failover recovery on the alternate
    path (/dev/IBMTape1). If successful, the current operation continues without interrupting
    the application. The failover recovery first restores the previous device state,
    SCSI reservation, and tape position, then retries the failing operation.


    The dynamic load balancing support optimizes resources for devices that have physical
    connections to multiple Host Bus Adapters (HBA) in the machine. When an application
    opens a device that has multiple HBA paths configured, the device driver determines
    which path has the lowest usage, and assigns that path to the application. When
    another application opens a different device with multiple HBA paths, the device
    driver determines the path with the lowest HBA usage and assigns that path to
    the second application. The device driver will use the usage on the HBA based
    on the application when the device is closed. Dynamic load balancing will use
    all Host Bus Adapters whenever possible and balance the load between them to optimize
    the resources in the machine.


    **Important:** The library data path failover code 1681 must be installed on the
    library (IBM 3592, 3583, and 3584) prior to enabling alternate data path support
    in the Linux device for IBM Ultrium 2 and 3 drives. The feature code is not required
    for IBM 3592 Enterprise drives.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Enabling/disabling alternate path support


    Alternate pathing for tape drives is not enabled automatically when the device
    driver is installed. You will need to provide the data path failover key (required
    for Ultrium drives only) and enable the Linux IBMTape device driver parameter
    alternate_pathing.


    To enable data path failover support in the IBMTape driver software, you need
    to complete the following steps after installing the IBMTape rpm package:


    +   1. Stop the IBMTaped daemon.


    ```

    ibmtaped stop

    ```


    +   2. Unload the IBMTape driver from the memory:


    ```

    rmmod IBMTape

    ```


    +   3. Add the following line in your /etc/modules.conf file for the 2.4 kernel
    or /etc/modprobe.conf file for the 2.6 kernel file:


    ```

    options IBMTape alternate_pathing=1 dpf_keys="abcdefghijklmnop"

    ```


    where "abcdefghijklmnop" is an example of a data path failover key. If you have
    multiple libraries and multiple data path failover keys, input your keys as:


    ```

    dpf_keys="key1;key2;..."

    ```


    Note that no feature key is required for 3592 drives.


    +   4. Run demod.


    +   5. Re-load the IBMTape driver into memory:


    ```

    modprobe IBMTape

    ```


    +   6. Re-start the IBMTaped daemon.


    ```

    ibmtaped

    ```


    You may ignore the Unresolved symbols in /lib/modules/<your kernel name>/drivers/scsi/IBMTape.o
    message after the demod command.


    You can check if the IBMTape driver has recognized multiple data paths for your
    library by reading /proc/scsi/IBMTape file. If your library lists Primary or Alternate
    under the FO Path, as shown in Example 4-45, you have successfully enabled the
    data path failover feature for your library. If NA is listed under the FO Path,
    then the data path failover feature is not enabled.


    Example 4-45 An example of /proc/scsi/IBMTape file


    | IBMTape version: 1.5.3 |

    | IBMTape major number: 253 |

    | Attached Tape Devices: |

    | Number Model SN HBA FO Path |

    | 0 ULT3582-TL IBM1234567 Qlogic Fibre Channel 2200 Primary |

    | 1 ULT3582-TL IBM1234567 Qlogic Fibre Channel 2300 Alternate |

    | 2 ULT3582-TL IBM1234567 Qlogic Fibre Channel 2300 Alternate |


    Alternatively, you can display the primary and alternate path configuration for
    any device by running the following command:


    ```

    ibmtapetil -f /dev/IBMTape path

    ```


    IBMTape is the logical name of any device.'
  merge: -1
