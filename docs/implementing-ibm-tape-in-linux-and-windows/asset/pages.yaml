  md: 'This ends the NetVault installation. You can now use the library for client
    backups. Refer to the NetVault documentation for information about how to set
    up clients.


    # 9.5 NetVault NDMP plug-in


    The NetVault application includes support for the NDMP protocol. The NDMP protocol
    provides a mechanism for backing up and restoring data to Network Attached Storage
    (NAS) devices. By using an open network protocol (TCP/IP) and providing a well-documented
    API, this has allowed backup vendors to implement NDMP solutions for NAS devices.
    NDMP uses a client/server model to access library and tape devices managed by
    backup applications. The NAS device acts as an NDMP server, while the backup vendor
    provides an NDMP Client Plug-in.


    For the NetVault application, an NAS device is managed as a client, allowing the
    NAS device to access NetVault managed drives and libraries locally and remotely.


    # 9.5.1 Installation of NDMP Client


    We used the following hardware (Figure 9-27):


    +   - Pentium server running Linux 7.1, Kernel 2.4 with BakBone NetVault V6.03
