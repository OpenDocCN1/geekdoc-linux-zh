  md: 'You can enable SNMP and change the settings on the 3584 Operator panel dialog
    or by using the IBM 3584 TotalStorage Specialist.


    The IBM 3584 sends the SNMP traps over all configured Ethernet ports. If using
    more than one Ethernet port, you will also receive more than one SNMP trap for
    one single failure.


    # Enable SNMP traps using the Operator panel


    From the library''s Activity Operator panel, click **MENU**, then **Settings**
    → **Network** → **SNMP**. To enable or disable SNMP traps, click up or down to
    highlight **Enable/Disable SNMP Traps** and press **ENTER**. The Enable/Disable
    SNMP traps panel displays the current state of SNMP traps (Figure B-6). Click
    the up or down arrows to specify ENABLE or DISABLED for SNMP traps. SNMP traps
    panel redisplays the new setting. To accept the new setting, press **ENTER**.
    To return to the previous panel, press **BACK**.


