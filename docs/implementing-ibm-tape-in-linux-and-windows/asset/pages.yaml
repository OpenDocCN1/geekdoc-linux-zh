  md: '# Advantage

    Software zoning is not affected by moving devices to different physical switch
    ports. For the use zone members, even if a device is connected to another physical
    port, it will still WWNs remain in the same zone definition because the device''s
    WWN remains the same.


    # Disadvantage

    Each component of the SAN fabric must support soft zoning.


    The switch does not control data transfer, so there is no guarantee against data
    transfer from unauthorized zone members.

    You can intermix hardware and software zoning.


