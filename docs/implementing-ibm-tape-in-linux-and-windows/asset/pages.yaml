    # 3.8.1 IBM 3581 2U Tape Library Specialist


    The IBM Ultrium Tape Library Specialist is embedded in the firmware of the optional
    Remote Management Unit (RMU).


    The RMU provides remote access to the library over a network. You can attach the
    library to your network through a 10/100 Ethernet port on the RMU and the access
    the IBM Ultrium Tape Library Specialist functions using a Web browser.


    If you have already installed the RMU, then you need to connect to the Ethernet
    port of the RMU unit to your network.


    Using the IBM 3581 2U Operator panel, set the IP address, Subnet Mask, and gateway
    address. Follow these steps to configure the RMU.


    +   1. Go to OFFLINE MODE. Press Enter to confirm the change, navigate to the
    Configuration menu. Press Enter to go to the PARAMETER menu.


    +   2. Press Enter to go to the NETWORK screen. It displays the current NETWORK
    value. Press Enter to go to the NETWORK CHANGE screen. Use Next and Previous to
    select "ON". Press Enter to initiate the change.


    +   3. Click Next to change to the Dynamic Host Configuration Protocol (DHCP)
    screen. It displays the current DHCP value. Press Enter to go to the DHCP CHANGE
    TO screen. Use Next and Previous to select "ON" or "OFF". Press Enter to initiate
    the change and return to the DHCP screen.


    > Note: We recommend using a fixed IP address for the RMU. When DHCP is used,
    it is hard to determine the IP address of the RMU.


    +   4. Click Next to display the IP ADDRESS screen. It shows the current value
    of the IP ADDRESS. Press Enter to go to the CHANGE IP ADDRESS screen. Use Next
    and Previous to select each new digit and move to the digit to be changed. After
    all digits have been changed and initiated, Cancel to return to the IP ADDRESS
    screen.


    +   5. Click Next to display the GATEWAY ADDRESS screen. It shows the current
    value of the GATEWAY ADDRESS. Press Enter to go to the CHANGE GATEWAY screen.
    Use Next and Previous to select each new digit and move to the digit to be changed.
    After all digits have been changed and initiated, Cancel to return to the NETMASK
    screen.


    +   6. Click Next to display the NETMASK screen. It shows the current value of
    the NETMASK. Use Next and Previous to select each new digit in the new address.
    Press Enter to initiate each new digit and move to the digit to be changed. After
    all digits have been changed and initiated, Cancel to return to the NETMASK screen.


    +   7. Click Cancel to return to the PARAMETER screen, twice to return to the
    Configuration Menu screen, and three times to return to the Home screen.


    Figure 3-99 on page 152 shows the Net Parameter configuration tree.'
