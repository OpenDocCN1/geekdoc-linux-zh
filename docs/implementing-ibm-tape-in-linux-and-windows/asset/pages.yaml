  md: '# NTBACKUP with a SAN


    It is not possible (by default) to use RSM, and therefore, NTBACKUP to drive the
    medium changer in a SAN-attached configuration. RSM can only auto-configure a
    robotic library when the following conditions are:


    +   - The robotic hardware unit supports drive element addressing with the Read
    ElementStatus command (Consult the manufacturer to find out if your library hardware
    unit supports this feature).

    - All drives inside the robotic library are on the same SCSI bus as the library
    itself.

    - The TAPE library is not attached to a Fibre Channel switch. (This may change
    in future versions of RSM.)


    RSM will attempt to auto-configure all libraries attached to the SAN Data Gateway
    (SDG), but it is unable to do, since the SDG reflects SCSI device IDs and LUNs.
    Consequently, RSM is unable to resolve the SDG addresses with those contained
    in the Read Element Status data for devices. Native Fibre Channel attached devices,
    typically, a switch would be involved. RSM devices, however, may be configured
    using the RSMConfig.exe tool in the Windows registry, or the process shown in
    6.3, "RSM with a SAN" on page 252. Once this operation has been performed, you
    may be able to use NTBACKUP.


    Note: IBM SAN Data Gateway and the 3583 SCSI module were withdrawn from marketing
    in October 2004.


