  md: 'When ALMS is enabled, you can easily:


    +   - Name, add, and remove logical libraries

    - Reassign a cartridge to another logical library

    - Change the maximum quantity of cartridges that can be assigned to a logical
    library

    - Add, remove, and edit ranges of volume serial (VOLSER) numbers (also known as
    cartridge assignment policy)

    - Assign drives, change control path drives, unassign drives, and assign new drives
    without using manual configuration methods


    ALMS can also be disabled, but this should be done with care. When ALMS is enabled,
    the screen shown in Figure 2-30 has the option **Disable ALMS** instead.


    > **Important:** When you disable ALMS, the library returns to an unconfigured
    state and all cartridge and drive assignments are lost. You must manually reconfigure
    the library. However, switching between definitions, the library will use the
    previous definitions as a basic starting configuration.


    Attention:** If you manually configure the library, your changes may result in
    the loss of cartridge or logical library assignments, cartridge assignment policies,
    maximum cartridge assignments, and logical library names.


    When using ALMS, cartridges belong to one logical library based on their VOLSER.
    Without ALMS, logical libraries are based on physical boundaries within the library.
    This means that after disabling ALMS, you might have to move several cartridges.


    When switching from an environment with ALMS disabled to one with ALMS enabled,
    the library will use the previous definitions as a basic starting configuration.
    The library will perform an inventory operation similar to when the frame door
    has been opened. The library status during this inventory process will show a
    cartridge assignment status of pending (see Figure 2-31 on page 66).


    # Create and manage logical libraries


    +   1. From the Tape Library Specialist (Figure 2-29 on page 64), select **Manage
    Library** → **Logical Library** and on the next screen, Figure 2-31 on page 66,
    click **Create**.'
