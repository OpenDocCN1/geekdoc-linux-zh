  md: '# 3.5.1 Testing the library with NTUTIL


    NTUTIL is a utility that is packaged with the IBM Taper changer and device drivers.
    It may be used to perform several functions, including:


    +   - Read and write operations

    - Media mounts and dismounts

    - Microcode updates

    - Forcing driver dumps

    - Sending and obtaining status of SCSI commands and retrieving sense data from
    commands that encounter errors


    For our purposes, we use NTUTIL to test basic operations as a way of verifying
    correct installation of the IBM tape library and drives.


    Note that you must stop the Removable Storage Manager (RSM) service in Windows
    before you can use NTUTIL. NTUTIL will not be able to see the devices until RSM
    releases them. Alternatively, you may simply disable the IBM tape library in RSM.
    For more information about RSM, see Chapter 6, "Configuring RSM" on page 245.


    NTUTIL can run in interactive or batch mode. Interactive mode will present you
    with a menu of commands that you can use to drive the library and drives. Batch
    mode will pass you on a series of commands from a user-generated file to the utility.
    When NTUTIL is invoked from any command line, it will start in interactive mode.


    NTUTIL is unpacked with the device drivers. It can be installed at any location,
    but is typically installed in the c:\windows\system32 or C:\windows\system32 directory.
    Since this directory is in the system path, you can run NTUTIL from any command
    line. When NTUTIL is invoked without arguments, it will start interactive mode.


    There are two modes that NTUTIL can run in: Base Mode and Library Mode. The default
    mode is Base Mode. Option 8 toggles between the two modes. Both modes support
    Open/Close/Read/Write operations. However, you may only use medium changer commands
    as much media while library mode.


    Example 3-1 shows the main menu, which presents the option to run the utility
    in interactive (manual) or batch mode.


    > Note: The NTUTIL samples provided use the Windows 2003 NTUTIL Version 6.0.7.4.
    The menus displayed with other versions may vary slightly.


