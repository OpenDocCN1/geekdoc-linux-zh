  md: '# WORM tape format


    Beginning with LTO Ultrium 3, Write Once Read Many (WORM) functionality provides
    for non-erasable, non-rewritable tape media and is designed for long term tamper
    resistant record retention


    The LTO Ultrium 3 specification for WORM includes the use of low level encoding
    in the Cartridge Memory (CM), which is also mastered into the servo pattern as
    part of the manufacturing process. This encoding is designed to prevent tampering.


    Data can be appended at the end of a WORM cartridge to which data was previously
    written, allowing the full use of the high capacity tape media.


    LTO Ultrium 3 WORM cartridges can be used with any LTO Ultrium 3 tape drive with
    the appropriate microcode and firmware.


    LTO Ultrium 3 non-WORM enabled and WORM enabled drives can coexist in the same
    library.


    ![](img/a48407b38d72fd58ea3627423836388a_34_0.png)


    # 1.1.2 IBM TotalStorage 3580 Tape Drive


    The IBM TotalStorage 3580 Tape Drive (abbreviated to IBM 3580) is an external,
    stand-alone, SCSI-attached tape drive that attaches to a variety of server and
    operating system platforms (see 1.2.1, "Hardware server platforms" on page 28).


    The IBM 3580 can also connect to Fibre Channel server Host Bus Adapters through
    the IBM SAN Data Gateway Routers models 2108-R03 or 2108-G07.'
