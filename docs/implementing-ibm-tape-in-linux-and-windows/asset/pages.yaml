    If you want to allocate free media at this time, you may do so, being in mind
    that this operation will use NTBACKUP to take ownership of all media. If there
    are other backup applications that use this media, do not allocate all media.
    Again, you may prepare the tape volumes needed through RSM, and NTBACKUP will
    allocate free (prepared) volumes when needed.


    The Windows 200x backup and restore functions, using with IBM tape libraries,
    are illustrated below, and are much the same as for any other attached tape libraries
    and drives. If new media is requested to be written to, then the tape preparations
    take place with RSM driving the Media Changer in the background. Similarly, mount
