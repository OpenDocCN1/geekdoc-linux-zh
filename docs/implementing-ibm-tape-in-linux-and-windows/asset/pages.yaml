  pgno: 297
- img_proc: true
  md: '# 7.2.5 Defining the device class using the command line


    To manually configure device drives, use the following commands.


    For LTO drives, use LTO to the DEVTYPE parameter:


    ```

    DEFINE DEVCLASS devclass_name LIBRARY=library_name DEVTYPE=LTO \\

    FORMAT=Ultrium/Ultrium/Ultrium2/Ultrium2C/Ultrium3/Ultrium3C/Drive \

    MOUNTLIMIT=mount_limit/DRIVES

    ```


    For IBM 3592 drives, use 3592 as the DEVTYPE parameter:


    ```

    DEFINE DEVCLASS devclass_name LIBRARY=library_name DEVTYPE=3592 FORMAT=3592/3592C/Drive
    \

    MOUNTLIMIT=mount_limit/DRIVES

    ```


    The library_name will match the name of the library you previously defined.


    The FORMAT parameter has the following valid options for LTO:


    +   - drive

    The server selects the highest format that can be supported by the drive on which
    a volume is mounted. This value will the settings on the tape drive characteristics
    (device driver) for hardware compression. This is the default.


    +   - ultrium

    This specifies that Tivoli Storage Manager writes data using the ULTRIUM recording
    format. This format results in a cartridge capacity of 100 GB when using a Ultrium
    100 GB data cartridge. This value overrides the settings on the tape drive characteristics
    for hardware compression.


    +   - ultriumc

    This specifies that Tivoli Storage Manager writes data using the ULTRIUM recording
    format with compression. This format results in a cartridge capacity of approximately
    200 GB when using a Ultrium 100 GB data cartridge. This value overrides the settings
    on the tape drive characteristics for hardware compression.


    +   - ultrium2

    Specifies that Tivoli Storage Manager writes data using the ULTRIUM2 recording
    format. This format results in a cartridge capacity of 200 GB when using Ultrium2
    200 GB data cartridges. This value overrides the settings on the tape drive characteristics
    for hardware compression.


    +   - ultrium2c

    Specifies that Tivoli Storage Manager writes data using the ULTRIUM2 recording
    format with compression. This format results in a cartridge capacity of approximately
    400 GB when using Ultrium2 200 GB data cartridges. This value overrides the settings
    on the tape drive characteristics for hardware compression.


    +   - ultrium3

    Specifies that Tivoli Storage Manager writes data using the ULTRIUM3 recording
    format. This format results in a cartridge capacity of 400 GB when using Ultrium3
    400 GB data cartridges. This value overrides the settings on the tape drive characteristics
    for hardware compression.


    +   - ultrium3c

    Specifies that Tivoli Storage Manager writes data using the ULTRIUM3 recording
    format with compression. This format results in a cartridge capacity of approximately
    800 GB when using Ultrium3 400 GB data cartridges. This value overrides the settings
    on the tape drive characteristics for hardware compression.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '+   3592


    Specifies that Tivoli Storage Manager writes data using the 3592 recording format.
    This format results in a cartridge capacity of 300 GB when 3592 300 GB data cartridges.
    This value overrides the settings on the tape drive characteristics for hardware
    compression.


    +   3592c


    Specifies that Tivoli Storage Manager writes data using the 3592 recording format
    with compression. This format results in a cartridge capacity of approximately
    900 GB when using 3592 300 GB data cartridges. This value overrides the settings
    on the tape drive characteristics for hardware compression.


    Compression in general improves backup performance. Therefore, we recommend that
    you use either specifically with FORMAT=ultrium/ultrium2/ultrium3c/3592c; or with
    FORMAT=drive, which lets the server select the highest format that is supported
    by the drive on which a volume is mounted (Do not use FORMAT=drive for a library
    containing a mix of Ultrium 1, 2, or 3 drives. Use the specific definitions, as
    described in detail in 7.12, "Device migration and coexistence" on page 306)


    If you use recording FORMAT=ultrium/ultrium2/ultrium3c/3592c/drive, then your
    LAN-free clients use compression regardless of whether hardware compression is
    enabled. This is enabled.


    Note that Tivoli Storage Manager provides optional client compression, then clients
    compress data before sending it to the storage device. This is particularly useful
    when the network connection between the client and server is slow and traffic
    needs to be minimized. With client compression, using tape drive characteristics
    has little effect and is not recommended. You should evaluate your environment
    and requirements (preferably by performing some appropriate testing) to determine
    if client compression is beneficial. If so, enable it, and use the uncompressed
    (FORMAT=ultrium/ultrium2/ultrium3/3592) flag when defining the device class. If
    not, then tape drive compression should be used.


    The option MOUNTLIMIT specifies the maximum number of access values that can simultaneously
    be mounted for the device class. This parameter is optional. The default is drives,
    which means that the maximum is set to the number of drives installed and in the
    library. There are two reasons why you might use a more specific value than the
    default:


    +   If you are going to share the library among multiple servers, see 7.12, "Device
    migration and coexistence" on page 306 for more information. We recommend the
    default value of drives not used for the older Ultrium x device classes. For example,
    when specifying MOUNTLIMIT=d, the Tivoli Storage Manager server will load Ultrium
    1 cartridges into Ultrium 1 drives in preference to Ultrium 2 or 3 drives, but
    there exists possibility that all Ultrium 2 or 3 drives could be loaded with Ultrium
    1 cartridges and therefore, an Ultrium 2 or 3 cartridge could not be loaded. It
    may be necessary to set the MOUNTLIMIT parameter to a value that is equal to the
    number of versions of drives, or nearly less than the total number of drives in
    the library.


    To define IBM 3584 in our Windows environment, check the device class dev3584,
    pointing to your previously defined lib3584. In the example, we have two drives
    in the library, so we specified dev3592c for the FORMAT parameter and we set the
    MOUNTLIMIT


    ```

    DEFINE DEVCLASS dev3584 DEVTYPE=3592 LIBRARY=1lib3584 FORMAT=3592c MOUNTLIMIT=2

    ```


    Example 3 on page 273 shows our device class definition.'
