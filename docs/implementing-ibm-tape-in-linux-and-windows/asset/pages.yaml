  md: '# 2.3 ALMS


    The Advanced Library Management System (ALMS), an optional extension to the IBM
    patented multi-path architecture (#1690), provides enhanced flexibility and capabilities
    for partitioning the IBM 3584. ALMS virtualizes the SCSI element addresses while
    maintaining the approach of the multi-path architecture and using SCSI-3 Medium
    changer handlers. Without ALMS all library references are on the SCSI element
    address (location-centric). Partitioning is based on real cartridge slots and
    drive slots. With ALMS, there is no affinity between a real slot and a SCSI element
    address reported to the server and used by the server. Instead, there is an affinity
    with the VOLSER (Volume Serial Numbers) on the bar label of the cartridge. ALMS
    allows the following new capabilities on the IBM 3584:


    +   - Dynamic partitioning

    - Storage slot pooling

    - Flexible drive assignment

    - Add / remove storage capacity transparent to any host application

    - Configure drives or lx storage capacity without taking the library offline

    - Virtualize I/O slots to automatically manage the movement of cartridges between
    I/O station slots and storage slots


    The IBM 3584 is compatible with the SCSI Medium Changer standard whether ALMS
    is enabled or not, and once enabled, ALMS is completely transparent to the application.
    The SCSI Medium Changer can be thought of as a "location-centric" interface. The
    application controlling a SCSI Medium Changer device specifies a source and destination
    location for each request to move a cartridge. The traditional SCSI library does
    not have control of the cartridge locations; instead, the SCSI library just acts
    on behalf of the server.


    > Restriction: Only the IBM 3584 can be enabled for ALMS, FC #1690 is required
    to enable ALMS.


    # 2.3.1 Functional description


    In this section, we give a functional description of the ALMS features. The information
    is based on the IBM TotalStorage UltraScalable Tape Library Advanced Management
    System Technology White Paper, by Lee Jesionowski, who can be found at:


    http://www.ibm.com/servers/storage/tape/whitepapers/pdf/advanced_library_management_system.pdf


    # Storage slot virtualization


    The host-view of a cartridge location is known as the SCSI element address. Without
    ALMS, the storage element address maps directly to a specific storage slot after
    the library is configured. With ALMS enabled, a generic element address is no
    longer associated with a specific storage slot. Instead, storage slots are virtualized
    by dynamically associating them with element addresses. An element address will
    be associated with a storage slot, by the library, as cartridges are moved and
    invented. In the case of a storage element that is empty due to a move, source
    element address will become unassociated. Association of storage element addresses
    is accomplished in a way that is completely transparent to the application software.


    The number of storage element addresses for a logical library (as reported to
    the host application) is selectable by changing the Maximum Number of Cartridges
    setting for'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'that logical library using the Web user interface (Tape Library Specialist).
    For each logical library, the default value for Maximum Number of Cartridges is
    the addressable storage slots that are installed in the library for that cartridge
    type at the time ALMS is first enabled or, after ALMS is enabled, at the time
    the library is created. The Maximum Number of Cartridges can be changed for each
    logical library, but the value must always be greater than equal to the number
    of actual cartridges assigned to logical library. It is possible to set Maximum
    Number of Cartridges to a value that is higher than the number of addressable
    storage slots installed at the time. This will allow future capacity expansion
    to be transparent to the host application. Performance may degrade slightly due
    to the greater number of addresses. Be careful not to exceed any license limits
    of the host application software.


    The starting element for storage slots of each new logical library will be x400''
    (1024) plus the assigned logical library number. For example, logical library
    1 would start at x401''(1025), logical library 2 would start at x402'', and so
    on (see Figure 2-28 on page 60). The reason they do not start at x401 is because
    some assignments are needed to be differentiate different logical libraries from
    the same physical library. If there are logical libraries defined with a set of
    cartridge elements assigned, these addresses will be kept when enabling ALMS.
    Thus, previously defined logical libraries will not follow the rule above.


    # Drive assignment


    Using the ALMS drive assignment capability, any drive in any position within frame
    can be assigned to any logical library without creating any gaps in drive addresses.
    Drive (data transfer) element addresses will be mapped to specific drive locations
    where the drive is assigned, but any drive may now be assigned to any logical
    library (intermix supported) using the Tape Library Specialist. Each drive added
    to a logical library will be assigned to the lowest available address element,
    regardless of drive location.


    When ALMS is first enabled, the Data Transfer Element (DTE) addresses of all installed/assigned
    drives are not changed from their previous values. However, after ALMS is enabled,
    the DTE addresses for any newly installed/assigned drives no longer depend on
    the drive''s position. Instead, the DTE address for any newly installed or assigned
    drive is determined by the sequence in which the drive is assigned to each logical
    library. With ALMS, drives are assigned to logical libraries using the Drive Assignment
    page of the Tape Library Specialist.


    Using this interface, the DTE address for the first drive assigned to a new logical
    library is 257 (x''101'') (the DTE address for any other drive assigned to a logical
    library is based on the next available DTE address in that logical library. The
    next available DTE address is the lowest available DTE address after the starting
    DTE address (this will fill any gaps that are created when drives are unassigned/removed
    from a logical library). When a drive is un-assigned from a logical library using
    the Web interface, only that DTE address is available for future usage; no other
    DTE addresses are affected.


    By using the dynamic Drive Assignment capability of ALMS, any drive in any position
    within frame is available to be assigned to any logical library without creating
    gaps in DTE addresses.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_87_0.png)


    # Shared drive assignment


    Some users require the ability to easily share a drive on an exception basis,
    for example, a drive may be required for a once-a-month job or as a temporary
    replacement for a failed drive. The Tape Library Specialist Assignment supports
    the option to share a drive between multiple logical libraries, to a maximum of
    10. The drive will be assigned a DTE address in more than one logical library.
    Note that the DTEs are assigned to a shared drive may differ by logical library.
    Therefore, each logical library will consist of dedicated drives and shared drives.
    Each logical library will have a drive element addresses the location of both
    dedicated and shared drives.


    This option reduces the requirement to configure and unconfigure the tape drive
    every time it is needed or not.


    The Drive Assignment Web screen supports the following point-and-click capabilities,
    which are nondisruptive to other logical libraries:


    +   - Assign the drive

    - Remove the drive assignment

    - Reassign the drive


    When a cartridge is mounted in a shared drive, the library will only accept a
    de-mount command requested via the source logical library; any de-mount command
    requested via other logical libraries will be rejected.


    However, the data path to the tape drive itself is not protected by the library.
    Therefore, the client must make sure that shared drives are not accessed by the
    wrong application via the data path. To ensure this, one option is to use the
    SCSI reserve / release option on open and close. The drive driver together with
    the application handles handles this. When opening a tape drive, the application
    initiates a SCSI reservation through the tape driver. No other server can access
    the tape drive at this point (except for commands such as Inquiry). This ensures'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'that data is overwritten by any other host or application. After the device
    is closed, the application must send a SCSI enable to the tape drive. Most applications
    handle this, but it should be confirmed with the backup software provider.


    SAN zoning can also be used to prevent access to the same tape drives by different
    servers.


    When a tape drive is shared by applications, any application using the drive has
    no knowledge of the other applications sharing the tape drive. For example, if
    there is already a cartridge loaded and in by application A, application B does
    not know it and tries also to mount a cartridge in the same drive. Application
    B would in case get a failure, and the job application B was executing would fail.
    Some applications periodically scan all the tape drives and if they recognize
    there is a cartridge mounted without initiation from the application itself, the
    application will consider this tape drive offline.


    In any case, we recommend not allow multiple applications to use shared tape drives
    concurrently. In other words, set tape drives offline (or in service mode) from
    the application whenever it is not used by that.


    The sharing option is mainly intended for environments where some drives are just
    needed once in a while and must be pre-configured for the application.


    > Attention: An application that occasionally leaves cartridges in drives or that
    periodically scans all configured drives will not be a good candidate for sharing
    drives between logical libraries.


    # Eliminates downtime for total capacity changes


    With ALMS enabled, the total library capacity (number of additional storage slots)
    can be changed to each application, as the Maximum Number of Cartridges is not
    impacted by changes to the number of storage slots. The additional storage slots
    are simply more slots the cartridges can be moved to upon insertion.


    Further, using the new Intermediate and Full Capacity on Demand capabilities of
    the 3584 Model L22 and L52, no downtime is required at all for the capacity to
    total L-frame capacity.


    # Storage slot pooling


    ALMS allows logical libraries to be added or deleted nondisruptively. The minimum
    logical library has a name — it can be thought of as a file which initially has
    no contents.


    Drives can be "placed in this file" using the Drive Assignment Page of the Tape
    Library Specialist web interface. Cartridges can also be placed in this file,
    based on their volume serial (VOLSER) numbers and by using one of the following
    methods (in priority order):


    +   - Migration from static partitioning (enable of ALMS)

    - Cartridge assignment policy (automatic at time of insertion)

    - Insert notification (Operator selection at time of insertion)

    - Software application move from I/O Station (based on source of command)

    - Manual assignment using the Tape Library Specialist


    The VOLSER assignment and physical location of cartridges are stored in non-volatile
    RAM (both primary and backup copies). All storage slots are first come, first
    served to each logical library based on cartridge insert operations. Therefore,
    storage slots are pooled as a shared resource so changes to the capacity allocation
    for each logical library do not require any downtime or administrator involvement
    at all. Indications of a full or nearly full physical library will continue to
    be provided via the Operator panel, Tape Library Specialist, and SNMP traps.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Cartridge Assignment Policy


    The cartridge assignment policy (CAP) of the IBM 3584 allows to assign ranges
    of the cartridge volume serial (VOLSER) numbers to specific logical libraries
    through the Tape Library Specialist. When a cartridge is inserted the cartridge
    assignment policy will be used to attempt to associate the cartridge with a logical
    library. If the cartridge is not in the CAP and insert notification (see "Insert
    notification" on page 52) is enabled, you can assign the cartridge to a logical
    library using the insert notification prompt on the library''s Operator panel
    or keep the cartridge as unassigned for later using the Tape Library Specialist.
    If the insert notification feature is not enabled, and the cartridge was not in
    the CAP, the cartridge will eventually be available to all hosts. Unassigned cartridges
    can also be assigned to a logical library by creating a new VOLSER range, performing
    a manual inventory to assign cartridges through the cartridge assignment policy.


    The cartridge assignment policy is media-type specific. As such, it is based on
    the six most significant characters of the cartridge label and the labels of VOLERS
    do not include the media-type indicator (L2, L3, JA, and so forth). This means
    that identical labels (except for the media-type indicator) could be assigned
    to two different libraries, for example, libraries that contain Ultrium 3590 drives.


    > Note: The cartridge assignment policy does not reassign an assigned tape cartridge.
    To reassign a cartridge, use the procedure for assigning cartridges to a logical
    library.


    # Insert notification


    Insert notification enables the IBM 3584 to monitor the I/O station for new media
    that does not have a logical library assignment. This feature can be enabled through
    the Operator panel or the Tape Library Specialist. With Insert notification enabled,
    when new media is detected, the Operator panel displays a message that asks you
    to select a logical library. Any unassigned cartridges will be assigned to the
    logical library that you select (and all other logical libraries will not be access
    to the cartridges). The libraries offer an option to defer assignment and is a
    time period when the deferral will automatically take effect.


    # Virtual I/O


    The IBM 3584 has input/output (I/O) stations and I/O slots that allow to import
    and export up to 32 cartridges at any given time. The I/O slots are also known
    as import/export elements (IEs). Virtual I/O slots increase the quantity of available
    I/O slots by allowing storage slots to appear as the host I/O slots. Storage slots
    appearing to the host are called virtual import/export elements (VIEs). The goal
    of virtual I/O slots is to reduce the dependencies between the system administrator
    and library operator that each performs import and export tasks without needing
    the other to perform any actions. With Virtual I/O slots, the library automatically
    moves cartridges from the I/O stations to physical storage to I/O slots.


    With I/O slots, you can configure up to 225 VIEs per library. Each logical library
    will have a VIO address space that is not accessible by other logical libraries.
    The number of VIO (virtual I/O) slots can be set using the Max VIO Slots button
    for the logical libraries (see Figure 2-33 on page 67). New logical libraries,
    by default, be assigned the maximum number, while logical libraries defined before
    ALMS will initially have the number of physical I/O slots in the library.


    Before virtual I/O, the space consisted of physical I/O station slots (10, 30,
    16, or 32, depending on the frame type) that shared by all logical libraries.
    If the application or system administrator did not explicitly import the cartridges
    from the I/O station into library'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'storage, the cartridges would remain in the I/O station. This reduced the number
    of IEEs available to process imports and exports.


    With virtual I/O slots, when cartridges are inserted into the I/O station, the
    library will work with the cartridge assignment policy or insert notification
    to assign a cartridge to the correct library VIEE, and cartridges will be automatically
    moved into library storage slots. If there is no cartridge assignment policy assigned,
    and insert notification is disabled for a particular cartridge, then that cartridge
    will be inserted into the VIEE of all libraries and automatically moved into a
    library storage slot. The VIEE temporarily takes on the attributes of an IEE until
    a host moves the cartridge into a storage element (SIE).


    If a cartridge cannot be, this will be reported as Assignment. This can occur
    if the assigned logical library has no VIEE slots, or if all of the logical libraries
    do not common VIEE to share. To resolve this, either free VIEE addresses so are
    available in libraries, or make a specific assignment of this cartridge to a logical
    library.


    When the host moves occur, if the cartridge is in a storage slot, no move is needed
    and the element transitions from a VIEE to an SIE. Similarly, when a host exports
    from an SIE, the physical storage slot will be reported by a VIEE without moving
    the cartridge to the I/O station. The library monitor will when free space is
    available in the I/O station and move exported cartridges at the library''s convenience.


    As seen in 2-33 on page 67, there is also a button for Hide/Show Exports. Show
    Exports is the default, and this will show a VIEE inventory of cartridges exported
    from the logical library. These cartridges will then fill one of the VIEE slots
    for logical library export. Complete will be shown when the exported cartridge
    is physically in an I/O station.


    **Hiding Exports** will move the exported cartridges to a library maintained export
    queue, and the VIEE is free immediately for other import/exports, and the exported
    cartridge will disappear from the hardware''s inventory data. Exporting a cartridge
    will be reported as Export. Progress if there is no available VIEE, and will not
    complete until one is available. With Hide Exports, this will not occur.


    Support for virtual I/O slots is provided at the latest level of library microcode
    (5360) and will be enabled by default when ALMS is enabled. For existing systems
    IBM 3584 has already enabled ALMS, a new level of library microcode that supports
    virtual I/O slots will be required and virtual I/O slots need to be manually enabled.


    # 2.3.2 Configuring ALMS


    The ALMS Feature Code #1690 is required for ALMS operation. This feature code
    provides a License Key that must be installed through the Operator panel (unless
    it was part of the initial order and was not already installed by manufacturing).


    # Enter ALMS license key


    To enter the ALMS license key, do the following:


    +   1. From the library Operator panel, select **MENU** → **Service Library**
    → **Firmware Update** → **Features** → **ENTER**. The VIEE screen displays a list
    of features, including the Advanced Library Management System. Select it and select
    **ENTER**.

    2. For each character of the license key, select **UP** or **DOWN** to enter the
    value that you want.

    3. Select **ENTER**. The Features screen now shows Advanced Library Management
    Feature It Is Installed.

    4. Select **BACK** until you return to the main screen.'
  merge: -1
  pgno: 90
