    A password is required to access some functions of the library configuration and
    the modification of the library configuration. The Specialist interface offers
    three levels of security access for its windows (also called pages). Before performing
    library functions, you must determine the type of security access that needs.
    Note Table 3-2 describes each level.


    | Type of password protection | Description |

    | --- | --- |

    | No password protection | You are never prompted to sign on. |

    | Password protection for administration pages | You are prompted to sign on to
    access the administration pages. Administration pages are functions that allow
    you to change library settings. |


