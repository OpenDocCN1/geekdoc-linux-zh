  md: '# Configuring EMC Legato NetWorker on Windows


    This chapter describes the steps that are necessary to configure EMC Legato NetWorker
    on Windows 2000 using an IBM LTO library.


    As examples, we describe implementing an IBM 3583 with LTO 1 drives with EMC Legato
    NetWorker 6 and implementing an IBM 3584 with LTO 2 FC drives in EMC Legato NetWorker
    7.


    > **Note:** Later versions of EMC Legato NetWorker are available that support
    IBM LTO3 and IBM 3592 products. The panels and command outputs may have changed
    from what is shown in this chapter; however, the information is included as a
    guide. Consult the product documentation and the compatibility Web sites listed
    in this chapter for the most up-to-date information.'
