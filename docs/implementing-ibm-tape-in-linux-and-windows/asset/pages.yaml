    toggle the SNMP setting, then press ENTER to activate the change. [BACK] [DOWN]
    [ENTER] |


    Figure B-6 _ 3584 Operator panel: Enable/disable SNMP Traps


    Some monitoring applications only support Version 1 SNMP traps, while others support
    Version 2 traps. The IBM 3584 supports both Version 1 and Version 2.


    To send a different version of traps, select **V1 / V2** on the SNMP Menu. The
    V1 / V2 Traps screen displays the version of the traps that were last sent by
    the SNMP agent. To change the setting press up or down to specify the version
    of the trap (Figure B-7), then press **ENTER**. The screen redisplays with the
    new version of the trap. To accept the new setting and return to the previous
