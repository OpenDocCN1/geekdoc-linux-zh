    #  5.2.1 Some basic information about zoning


    +   - Zones can be configured dynamically.

    - Configuring new zones does not interrupt traffic on unaffected ports or devices.
    Also, new zones do not affect data traffic across interswitch links (ISLs) in
    cascaded switch. However, zone changes interrupt traffic on affected ports and
    devices and should be done with care.'
