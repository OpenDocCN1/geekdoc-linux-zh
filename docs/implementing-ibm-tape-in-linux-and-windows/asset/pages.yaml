    ![](img/a48407b38d72fd58ea3627423836388a_341_0.png)


    # 7.13 Tivoli Storage Manager V5.2 SAN device mapping


    In a SAN environment, device IDs can change dynamically due to device or cabling
    changes. Before V5.2, the Tivoli Storage Manager server used statically defined
    library and tape device IDs. If the device IDs were changed after a reboot or
    a re-scan of the SCSI bus, Tivoli Storage Manager could access a wrong target
    device and cause data integrity problems. Tivoli Storage Manager V5.2 introduced
    a new method to dynamically determine the correct device special name and makes
    appropriate changes to the Tivoli Storage Manager database. This function can
    replace persistent binding, which binds a device WWN to a specific target/LUN
    ID (as described in 5.3, "Persistent binding" on page 237) in certain environments.


    SAN Discovery and Device Mapping are discussed in detail for the Tivoli Storage
    Manager environment in the reread Get More Out Of Your SAN with IBM Tivoli Storage
    Manager, SG24-6687.


    # 7.13.1 SAN device mapping functions


    +   - Serial number autodetection and validation

    - Element number autodetection

    - SAN discovery'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'To enable these functions, the DEFINE LIBRARY and DEFINE DRIVE commands have
    been enhanced to allow manual entry or automatic detection of the serial and element
    numbers. Also, the DEFINE PATH command is enhanced to automatically update the
    serial number. This new syntax is in 7.2.3, "Defining the library and drives using
    the command line" Refer to the Tivoli Storage Manager documentation for further
    details.


    # Serial number autodetection and validation


    Serial number autodetection enables Tivoli Storage Manager to automatically obtain
    a drive or serial number by issuing a SCSI Inquiry command before the DEFINE PATH
    command.


    Serial number validation automatically validates the serial number if the serial
    number is provided with the DEFINE/UPDATE LIBRARY and DEFINE/UPDATE DRIVE commands
    by issuing a SCSI Inquiry command during the DEFINE PATH command. Device numbers
    are also automatically validated during every library or tape drive access.


    To avoid potential errors during device definitions or when SAN and device reconfiguration
    occurs, you can use the AUTodetECT function of the DEFINE PATH command. This function
    automatically updates the Tivoli Storage Manager server database with the correct
    device special file name by using the device''s serial number.


    # Element number autodetection


    Element number autodetection enables Tivoli Storage Manager to automatically obtain
    the drive element address by using the drive''s serial number. This function automatically
    finds the matching element address in the serial number/element number map during
    the DEFINE PATH command.


    # SAN discovery


    To avoid the need for manual modification, there is an accurate SAN device mapping
    feature available in Tivoli Storage Manager V5.3. This mapping process involves
    two steps:


    +   1. Detecting that the device has changed

    This detection is accomplished by recording the device''s serial number, manufacturer,
    and World Wide Node Name (WWNN), if it exists, in the Tivoli Storage Manager database.
    Whenever a device is opened, its identity is verified. This feature is now available
    on Windows, AIX, Sun and Linux servers as Storage Agents, and was implemented
    in Tivoli Storage Manager V5.2 for Windows.


    +   2. Reconciling the device definitions (paths) dynamically when changes are
    detected.

    This reconciliation requires Tivoli Storage Manager to discover devices in the
    SAN environment.


    New commands are available in Tivoli Storage Manager V5.3. To activate SAN device
    mapping, set the SANDISCOVERY option to ON on the dsmerv opt file:


    ```

    SET SANDISCOVERY ON

    ```


    This setting is the default for Windows platforms. For all other platforms, you
    must set this option in the server options file. To activate SAN discovery in
    a running Tivoli Storage Manager instance, use the following setting:


    ```

    SET SANDISCOVERY ON

    ```'
  merge: -1
