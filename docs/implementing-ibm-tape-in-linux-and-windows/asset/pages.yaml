- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_218_0.png)


    Having completed the SCSI setup, we can now compile and install a new kernel.
    We strongly recommend that you review all settings before doing this, to ensure
    that the new kernel setup matches the actual system environment. When compiling
    a new kernel, it is a good idea to save the old kernel so that the machine can
    reboot if the new kernel fails.


    # ## 4.3.2 Kernel compilation and installation checklist


    We do not describe kernel configuration and installation in detail, but provide
    this short checklist that should serve as a reminder of the individual steps in
    the process.


    +   - `cd /usr/src/linux*`

    - Goes to the directory where the kernel version resides that we want to configure
    and install.

    - `make clean make proper`

    - Throws away everything from previous kernel builds that may interfere with the
    new kernel build. The command `make mr` can be used to clean up the kernel sources
    completely. It will also remove a previous kernel configuration.

    - `make xconfig`

    - Configures the new kernel. Equivalent commands are `make menuconfig` and `make
    config` at an ASCII terminal.

    - `make dep`

    - Analyzes dependencies for the newly configured kernel.

    - `make bimage`

    - Creates a compressed image of the new kernel.

    - `make modules`

    - Creates the modules that have been selected during kernel configuration.

    - `make modules_install`

    - Installs the modules generated by the previous step.

    - `cp arch/i386/boot/bzImage /boot/<kernelname>`

    - Copies the kernel image into the /boot directory and renames it to the appropriate
    name `<kernelname>`. The file /etc/lilo.conf should contain an entry that references
    `<kernelname>`.'
