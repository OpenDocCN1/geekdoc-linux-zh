  md: '# IBM LTO Tape Library sharing and partitioning


    In this chapter, we describe the sharing and partitioning of the IBM TotalStorage
    3582 Tape Library, IBM TotalStorage 3583 Tape Library, and IBM TotalStorage 3584
    Tape Library.


    The topics are:


    +   * Tape library sharing and partitioning definitions

    * Sharing the IBM TotalStorage 3583 Tape Library

    * Partitioning the IBM TotalStorage 3583 Tape Library using the Tape Library Specialist

    * Sharing the IBM TotalStorage 3584 Tape Library

    * Partitioning the IBM TotalStorage 3584 Tape Library using the Tape Library Specialist

    * Partitioning the IBM TotalStorage 3584 Tape Library using the Operator panel

    * Using and partitioning the IBM TotalStorage 3584 Tape Library with the Advanced
    Library Management System (ALMS)


    For additional discussions on Tape Library Sharing, refer to the redbook:


    +   * Get Out of Your SAN with IBM Tivoli Storage Manager, SG24-6687


    Details about the ALMS functionality and setup can be found in the 3584 manuals:


    +   * IBM Total Storage UltraScalable Tape Library 3584 Operator Guide, GA32-0468

    * IBM TotalStorage UltraScalable Tape Library 3584 Introduction and Planning Guide,
    GA32-0469'
  merge: -1
