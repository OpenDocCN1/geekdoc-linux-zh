  md: '# Data flow


    The simplified flow list below reflects the components involved in the data path
    for moving data at a file level between disk storage devices and tape. Problem
    or performance analysis must be approached by determining which component of the
    data path impacts performance.


    +   - Disk device

    - SCSI Device Adapter

    - Adapter device driver

    - Disk device driver

    - Logical Volume Manager

    - File system

    - Application program

    - Atape Device Driver: Tape driver

    - HBA Adapter Device Driver

    - HBA (SCSI or FC-AL) Device Adapter

    - Tape device


    # IBM device driver overview


    The IBM Ultrium tape and medium changer drivers are designed specifically to take
    advantage of the features provided by the IBM Ultrium tape drives and medium changer
    devices. The goal is to give applications access to the functions required for
    basic tape (such as backup and restore) and medium changer operations (such as
    cartridge mount and dismount), as well as to the advanced functions needed by
    full tape management systems. Whenever possible, the Ultrium driver will take
    advantage of the device features transparently to the application.


    # 1.7 LVD or HVD


    This section discusses the different types of attachment interfaces found in SCSI
    devices and explains why selecting the right interface is important.


    # 1.7.1 LVD and HVD


    LTO tape drives have two types of SCSI attachment interfaces: low voltage differential
    (LVD) and high voltage differential (HVD). LVD and HVD, as the names imply, use
    different voltage levels while sending the signal down the SCSI bus. LVD uses
    3.3 volts DC and HVD uses 5 volts DC. LTO tape drives are either LVD or HVD, and
    cannot be upgraded or converted from one to the other. To change from LVD to HVD,
    a LVD drive would need to be replaced with a HVD drive. Therefore, when configuring
    an LTO product, consider carefully whether you should choose HVD or LVD drives.


    > Note: Ultrium 3 drives attach only via SCSI (or native Fibre Channel) interfaces.


    # 1.7.2 Why is this important?


    Why choose one over the other and why should you care? The main reason is connectivity.
    If you try to attach an HVD LTO drive to an LVD adapter, it will not work. Placing
    an LVD device on an HVD bus will cause the LVD device to shut down. Placing an
    HVD device on an LVD bus will cause the entire LVD bus to shut down. Therefore,
    check to see what type of adapter you have available in the hosts that will be
    attaching, and choose the correct model of drive accordingly.'
