    # 4.3.6 Module and kernel parameters for the Linux tape driver


    Up to this point, we have used the native Linux tape drivers with the default
    setup provided by our Linux system. There are several ways to modify the behavior
    of the Linux tape device driver and the tape drives. Some of them can be changed
    via module or kernel parameters, and others can be controlled using subcommands
    of mt. The buffers of the Linux tape driver can be specified by module or kernel
    parameters.


    If the Linux tape device driver is loaded as a module, the following parameters
    are available:


    | buffer_kbs=xxx | The size in kilobytes is set to xxx. |

    | write_threshold_kbs=xxx | The write threshold in kilobytes is set to set. |

    | max_buffers=xxx | The maximum number of tape buffer is set to xxx. |


    Note that if the buffer size is changed, the write threshold is not set, the write
    threshold is set to the new buffer of 2 KB. To optimize the buffer settings for
    your specific application, it may be necessary to do some benchmarking with different
    settings.


    If the Linux tape device driver is compiled into the kernel, the same parameters
    can be provided to the kernel, for example, via the LILO configuration file /etc/lilo.conf.
    The keywords are the same as when loading the driver as a module. If several parameters
    are set, the key-value pairs are separated by a comma (no spaces allowed). A colon
    can be used instead of the equal sign. The definition is prefixed by the string
    st=. Example 4-17 shows how kernel parameters for the Linux tape driver are defined
    in /etc/lilo.conf.


    # Example 4-17 /etc/lilo.conf with kernel parameters that define larger tape buffers


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    timeout=50

    message=/boot/message

    linear

    default=linux

    image=/boot/vmlinuz-2.4.13

    label=linux

    ```'
