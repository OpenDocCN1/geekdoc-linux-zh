  md: '# 3.7.5 Emulex LPxxxxx HBA driver removal


    To remove the Emulex LPxxxxx HBA, perform the following:


    +   1. Ensure there is no activity on the HBA.

    2. Disable the device (recommended, but not mandatory).

    3. Uninstall the device.

    4. Shut down the machine.

    5. Remove the adapter and reboot.


    You can disable the device from Device Manager, right-click, and select the device
    under SCSI and RAID Controllers, select **Disable**.


    ![](img/a48407b38d72fd58ea3627423836388a_177_0.png)


    *Figure 3-98 Disabling the Emulex HBA*


    To uninstall, follow the same procedure to locate the device, right-click, and
    select **Uninstall**.


    A pop-up warning box will appear asking for confirmation of the removal of the
    device. Click **OK** and the device will be removed. The device should no longer
    be visible in the Device Manager.


    You may now shut down the machine and physically remove the adapter.


    # 3.8 IBM Tape Library Specialists


    We introduce the IBM Tape Library Specialist application in this section and illustrate
    how to use it to determine or upgrade the library and drive firmware.


    The IBM Ultrium Tape Library Specialist is a Web-based graphical interface for
    configuring, updating, and managing IBM LTO libraries. You need the optional RMU
    on the IBM 3581-2U and the IBM 3582 to take advantage of the IBM Tape Library
    Specialist. On the IBM 3583, the RMU comes as a standard feature. On the IBM 3584,
    the IBM Ultrium Tape Library Specialist is embedded in the firmware of the Media
    Changer Pack (MCP), which is part of the library.


    The communication is through an Ethernet connection between the host (where the
    Web browser runs) and the RMU. The Ethernet speed is 10/100MB full duplex and
    is auto negotiated with host or switch.


    Once the library is set up for the IBM Ultrium Tape Library Specialist, you can
    connect to the Library using a Web browser, for example, Microsoft Explorer. We
    recommend that you upgrade your Java™ runtime environment to the latest version,
    which is


    ```

    http://java.com/en/

    ```'
