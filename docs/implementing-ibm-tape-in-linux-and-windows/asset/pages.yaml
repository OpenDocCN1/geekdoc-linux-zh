  md: '# Configuring BakBone NetVault on Windows and Linux


    This chapter describes the steps needed to configure NetVault Version 6 by BakBone
    in the Windows 2000 and Linux environments. We show how to set up a basic tape
    library connection and then how to use the BakBone NDMP Client on the Linux server.


    **Note:** Later versions of BakBone NetVault are available, which support IBM
    LTO3 and IBM 3592 products. The panels and command outputs may have changed from
    what is shown in this chapter; however, the information is included as a guide.
    Consult the product documentation and the compatibility Web sites listed below
    for the most up-to-date information.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# NetVault by BakBone


    NetVault by BakBone is an easy-to-use, fully functional, high-performance, scalable
    backup and recovery management product. NetVault supports a broad range of server
    and client operating systems in LAN, SAN, and NAS environments. NetVault also
    supports a wide range of media and devices, including the IBM LTO and 3592 products.
    NetVault uses industry standard, non-proprietary formats for writing to tape.
    These are cpt0 for UNIX and Microsoft Tape Format (MTF) for Windows. For easy
    data interchange and disaster recovery protection, NetVault-produced tapes can
    be read by any UNIX- or Windows-based system supporting the standard.


    In the event of a problem with the library, server hardware, or applications,
    NetVault tapes can be restored to any machine, regardless of whether the NetVault
    application is present.


    The latest device, library, and operating system-specific information can be obtained
    from the BakBone Web site at:


    ```

    http://www.bakbone.com

    ```


    We will first describe the basic installation of the NetVault application onto
    Linux and Windows 2000, as the actual configuration of the product is almost identical
    on both systems.


    # 9.2 Installing NetVault on Windows 2000


    In this section, we show the steps to configure NetVault Version 6.03 on Windows
    2000 using an IBM 3583. We tested for both SCSI direct attach and SAN attach.


    For SCSI direct access connection, we used the following hardware, as shown in
    Figure 9-1:


    +   - Pentium II server with Windows 2000 Advanced Server (build 2195).


    +   - Adaptec 2108 LVD SCSI card.


    +   - IBM 3583 SCSI attached. A single SCSI bus supports both the library controller
    and the two 3580 tape drives.


    ![](img/a48407b38d72fd58ea3627423836388a_369_0.png)


    > Figure 9-1 Windows 2000 direct SCSI configuration


    For the SAN environment, we used the following hardware, as shown in Figure 9-2
    on page 343.


    +   - Pentium II server with Windows 2000 Advanced Server (build 2195).


    +   - QLogic 2200F FC HBA.


    +   - IBM 2109 Fibre Channel switch.


    +   - IBM 2108 SAN Data Gateway (SDG).'
  merge: -1
  pgno: 369
- img_proc: true
  md: '▶ IBM 3583 attached SCSI port to the SAN Data Gateway. A single SCSI bus supports
    both the library controller and the two IBM 3580 drives.


    ![](img/a48407b38d72fd58ea3627423836388a_370_0.png)


    # ## 9.2.1 Installation preparation


    The preparation for installing NetVault depends on whether your tape library is
    already installed.


    # ### Existing LTO installation


    If your LTO drive was already installed on your server, check to see if the IBM
    drivers are being used. The IBM Ultrium drivers are not required for the NetVault
    software. If you have already installed these, disable them, as described in 3.5.5,
    “Deleting LTO devices” on page 134.


    # ### New LTO installation


    If this is a new device, first install the adapter card to Windows 2000 and load
    the drivers. This procedure is described in 3.6, “Windows 2000 SCSI adapter installation”
    on page 142, and 3.7, “Windows 2000 Fibre Channel HBA driver installation” on
    page 137, for the FC card. Disable the RSM service if required, as described in
    “Disabling RSM” on page 134. Shut down the server, physically cable the tape library,
    and reboot the system.


    # ### All LTO installations


    Your drive and libraries should now show up as unknown devices with the native
    Windows Device Manager. The drives should appear similar to Figure 3-19 on page
    91, and the changer (if present) as in Figure 3-12 on page 88.'
