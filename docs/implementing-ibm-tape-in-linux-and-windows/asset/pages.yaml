    # 4.3.5 Identification and correct implementation of mt


    Linux provides the standard `mt` command to control most aspects of tape operation
    except writing and reading data from the tape. For example, you can use `mt` to
    position the tape, set parameters, or request status information. Depending on
    the Linux distribution and installation, there are two different implementations
    of `mt` available. One of them is `GNU mt`, the other one is `mt-st`. We strongly
    recommend using `mt-st` because it is developed for the operation of SCSI tape
    devices on Linux and offers a comprehensive set of commands that is not available
    with `GNU mt`. Sometimes both implementations are installed. In this case, the
    `mt-st` version may be available as the default, so we recommend uninstalling
    the `GNU mt` command and making a symbolic link to the `mt` command.'
