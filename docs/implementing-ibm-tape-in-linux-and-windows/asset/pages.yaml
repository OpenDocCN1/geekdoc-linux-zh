  md: 'during system startup (and is therefore not reported in the lspci output),
    we have to either activate the appropriate module or install a kernel that includes
    support for this adapter. If we assume that our Linux distribution contains no
    precompiled modules or kernel that includes the required SCSI support, we have
    to compile and install a new kernel with the appropriate support.


    > Note We will not describe the procedure of configuring, compiling, and installing
    a Linux kernel in detail. This topic is covered by the manuals of the Linux distribution
    and the Kernel HOWTO. The Linux Kernel HOWTO can be found at:


    ```

    http://en.tld.org/HOWTO/Kernel-HOWTO.html

    ```


    The initial configuration of the kernel sources may not be identical to the kernel
    that is actually running. Then, it is important to check that all drivers required
    by the current system environment are really activated.


    From the kernel source directory (which is usually /usr/src/linux) we can configure
    a new kernel using the make xconfig command. If the environment is not running
    XWindows, use make menconfig or make config instead. The kernel configuration
    window will open, as shown in Figure 4-2.


    ![](img/a48407b38d72fd58ea3627423836388a_216_0.png)


    To activate support for a SCSI controller and devices, we selected the menu entry
    SCSI support. The SCSI configuration window will offer the options seen in Figure
    4-3 on page 190.'
