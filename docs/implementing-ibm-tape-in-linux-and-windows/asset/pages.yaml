    # Install and use the SDG Specialist


    With the IBM SAN Data Gateway, you can manage multiple SDGs from your location
    on network. The Specialist consists of two Java applications, but it is a client-server
    application, not Web-based like the TotalStorage Specialist for the IBM 2109 Switch.
    You can install the Specialist on a single system for your network and manage
    connections between multiple clients and multiple SDGs. Also, you can install
    the server and client on one single system. The installation program allows you
    to install the appropriate components on your host system. The Java runtime environment
    is also installed when you install the application components.


    The server does not need to be used as a client, but it can be. The server needs
    network access to the SDGs to be managed.


    The SDGWatch Specialist is available for AIX, HP-UX, Windows, and Solaris. The
    installation image is provided for each operating system, containing both the
    server and the client code. During installation, you can choose which of them
    you want to install.


    The client and server do not need to be on the same operating system. This means
    that you can install the server, for example, on AIX, HP-UX, or Solaris, and use
    the client on Windows 2000 or Windows NT.


    You can download the latest version of the SDG Specialist from:


    ```

    ftp://ftp.ibm.com/storage/san/2108/

    ```


    # Install on Windows


    Download the latest version and the readme for Windows from the FTP site above.
    Execute the downloaded file to start the installation. During installation, you
    can choose to install the server or the client (see Figure A-4 on page 392).'
