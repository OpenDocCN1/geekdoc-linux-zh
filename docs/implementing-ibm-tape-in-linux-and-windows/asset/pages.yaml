  md: '# Configuring IBM Tivoli Storage Manager on Windows and Linux


    This chapter describes the installation and implementation of IBM Tivoli Storage
    Manager in Windows 2000 and Linux environments, explaining the ways to install
    IBM tape library with either LTO or 3592 devices. Windows 2003 environments will
    be similar to this. In particular, we review Tivoli Storage Manager''s ability
    to:


    +   * Achieve normal backup/restore processing

    * Allow multiple servers to share the IBM tape libraries

    * Provide LAN-free backup services

    * Considerations for device and media coexistence and migration


    We provide information on migrating between the generations of LTO technology
    with Tivoli Storage Manager, how to define various types of LTO and 3592 cartridges
    to Tivoli Storage Manager, and discuss discuss some features available with Tivoli
    Storage Manager V5.2 and V5.3 useful for IBM tape devices.


    We begin with a brief overview of Tivoli Storage Manager. For more in-depth information
    about this product, refer to these Redbooks:


    +   * IBM Tivoli Storage Management Concepts, SG24-4877

    * IBM Tivoli Storage Manager Implementation Guide, SG24-5416

    * Get More Out of Your SAN with IBM Tivoli Storage Manager, SG24-6687

    * IBM Tivoli Storage Manager Version 5.3 Technical Guide, SG24-6638'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 7.1 IBM Tivoli Storage Manager overview


    As part of the IBM TotalStorage Open Software Family, IBM Tivoli Storage Manager
    protects from hardware failures, errors, and unforeseen disasters by storing backup
    and archive copies offline and off storage. It scales to hundreds to thousands
    of computers running more than one operating systems, ranging from mobile computers
    to mainframes and connected together via the Internet, WANs, LANs, or SANs. Tivoli
    Manager Extended Edition''s centralized Web-based management, intelligent data
    move and store techniques, and comprehensive policy automation all work together
    to minimize administration costs and the impact on both computers and networks.


    Optional software modules allow business-critical applications that must run 24x7
    Tivoli Storage Manager''s centralized data protection with no interruption to
    their service. Optional extensions also allow SAN connected computers to the SAN
    for data protection movements, and provide Hierarchical Storage Management to
    automatically move unused data files from online disk storage to offline tape
    storage. Tivoli Manager Extended Edition provides disaster planning capability,
    NDMP control for NAS clients, and support for large tape libraries.


    Tivoli Storage Manager is ideal for heterogeneous, data-intensive environments,
    supporting over 35 platforms and over 250 storage devices across LANs, WANs and
    SANs, plus providing protection for legacy databases and e-applications (see Figure
    7-1).


    ![](img/a48407b38d72fd58ea3627423836388a_283_0.png)


    +   * Tivoli Storage Manager for Mail

    * Lotus Notes on Windows NT

    * Domino on AI

    * Domino on Windows NT

    * Microsoft Exchange Server

    * IBM Tiv Storage Manager for Databases

    * SQL Server

    * Oracle Backup on HP-UX

    * Oracle Backup on Sun Solaris

    * Informix

    * IBM DB2 (included in DB2)


    +   * Tivoli Storage Manager for Hardware

    * IBM Tivoli Storage Manager for ETP

    * Data Protection for mySAP on DB and Oracle

    * IBM Tivoli Storage Manager for Data Determination

    * IBM Tivoli Storage Manager for Hardware

    * IBM ESF

    * IBM Tivoli Storage Manager for Application Servers

    * Data Protection for Web Application Server


    Figure 7-1 Tivoli Storage Manager supported platforms


    Tivoli Storage Manager allows users to confidently protect and manage information;
    it integrates unattended network backup and archive capabilities with centralized
    storage management and powerful disaster recovery functions. Tivoli Storage Manager
    is intended for clients with homogeneous or heterogeneous platforms and complex
    environments that include both traditional LANs as SANs. It is a best-of-breed,
    scalable management solution that provides consistent and reliable protection
    and management of mission-critical data that spreads across your company''s enterprise.
    It protects a broad range of data across the enterprise from the mobile computer
    to the data center.


    Implementing IBM Tape in Linux and Windows'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Storage Manager is an industrial-strength centralized storage management product
    for your enterprise.


    Tivoli Storage Manager can protect almost any backup-archive client, as shown
    in Figure 7-1 on page 256. A Tivoli Storage Manager server is provided for OS/390®,
    z/OS, Windows 2000/2003, AIX, Solaris, HP-UX, Linux, and OS/400. This breadth
    of platform coverage affords you the choice in selecting the storage management
    platform that suits your environment and leverages your hardware and software
    investments. Tivoli Storage Manager can help control the cost of distributed storage
    management by leveraging storage resources, helping to reduce the cost of downtime
    and lost data, and helping to increase the productivity of storage administrators
    and end users.


    Tivoli Storage Manager exploits the numerous advantages of SANs with its LAN-free,
    server-free, and library sharing functions. These help to remove traffic from
    the LAN, allow for multiple Tivoli Storage Manager servers to share a library,
    and off-load backup processing from mission-critical servers.


    Tivoli Storage Manager includes LAN-free backup/restore functionality for many
    databases and applications, as well as the file-based backup/archive clients.
    It exploits Tivoli SANergy to allow for LAN-free transfers to file-based storage
    pools on disk.


    For more information about IBM Tivoli Storage Management, visit:


    ```

    http://www.ibm.com/software/tivoli/products/storage-mgr/

    ```


    For the list of currently available storage management products and supported
    servers and clients, see:


    ```

    http://www-ibm.com/software/tivoli/products/storage-mgr-product-links.html

    ```


    # 7.1 Tivoli Storage Manager commonly used terms


    Here are few basic Tivoli Storage Manager terms:


    +   * Server

    A server is a computer system that provides services to request of one or more
    clients or other devices over a network. A Tivoli Storage Manager server is the
    repository and manager of all backed up client data. Administrative policies defined
    at the server control the types of backup performed and retention policies for
    the data. The server also manages the physical media and devices where the backed
    up data is stored.

    * Client

    A client is a computer system that requests a service of another computer system
    that is typically referred to as a server. Multiple clients may share access to
    a common server. In Tivoli Storage Manager, a client is a computer system that
    has assets requiring protection by the Tivoli Storage Manager server. The client
    decides what data will be backed up and is subject to the server''s defined administrative
    policies for data retention. A client''s data is backed up automatically by a
    server-scheduled operation.

    * Tape library

    A library consists of physical robotics that move cartridges, one or more tape
    drives, and slots must have a mechanism for controlling the robotics (a library
    controller), and also have a library manager that maintains inventories and mediates
    sharing. In most cases, a library does not have a built-in Library Manager, so
    server-based software has to provide the library management function. As example,
    the IBM 3494 has a built-in library manager, while the IBM 3584 does not.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '+   Some tape libraries (for example, IBM 3582, 3583, and 3584) have the ability
    to physically partitioned into multiple logical libraries. Each logical library
    will have its own storage slots and tape devices, but will share the robotics
    and import/export station with other logical libraries in the same physical library.
    Each library partition can be managed by a backup application (such as Tivoli
    Storage Manager).


    +   Tape library sharing is when two or more servers sharing the robotics of a
    tape library. The drives and slots within the library may or may not be shared
    among the attached servers.


    # 7.1.2 Tivoli Storage Manager and tape library sharing


    Now, let us look at the Tivoli Storage Manager implementation of tape library
    sharing. This feature allows multiple Tivoli Storage Manager servers to use the
    same tape library and drives on a SAN to improve both hardware asset utilization
    and backup/restore performance. When two or more Tivoli Storage Manager servers
    share a library, one server is defined as the *Library Manager*, and controls
    the library operations. Other servers, known as *library clients*, use server-to-server
    communications to contact the Library Manager and request library services. This
    process is shown in Figure 7-2.


    ![](img/a48407b38d72fd58ea3627423836388a_285_0.png)


    Figure 7-2 Tivoli Storage Manager library sharing overview


    # Library Manager


    The Library Manager physically controls the library. All the communication with
    the library is done by this server. The Library Manager also serializes access
    to the tape drives, so that only one server is using a tape drive at the same
    time. The check-in and check-out of volumes be performed by the Library Manager.


    This Tivoli Storage Manager server is the only server with a library inventory
    table for the library. The ownership is added to the inventory to keep track of
    which tape belongs to a certain library client. This is the only server in the
    environment that knows all the volumes.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'The Library Manager can also use the library for its own purposes, without
    being a library client at the same time (no library client configuration is necessary
    on the manager).


    # Library client


    The library client uses server-to-server communications to contact the Library
    Manager for the handling of the physical hardware. The client sends the requests
    to the Library Manager, and, afterwords, reads or writes to the tape drive if
    given access. Server-to-server communication protocol is used to send requests
    from the library client to the Library Manager, and to send the response from
    the manager to the client.


    # LAN-free data transfer


    LAN-free data transfer with Tivoli Storage Manager allows the SAN to be used as
    an alternative path for moving data between the Tivoli Storage clients and the
    server. LAN-free data transfer exploits this SAN path by enabling SAN-attached
    storage (disk and tape), which is shared between the Tivoli Storage Manager server
    and client, and managed by the client. This means the data is not transferred
    over the LAN to the server as in traditional Tivoli Storage Manager backup, but
    transfers directly from the client to the SAN-attached storage devices.


    Tivoli Storage Manager currently provides LAN-free data transfer for normal files,
    the database, and other applications through certain IBM Tivoli Storage Manager
    for Mail, IBM Tivoli Storage Manager for Databases, and IBM Tivoli Storage Manager
    for ERP products. These clients require an additional Storage Agent to be installed,
    which directs the movement of the data from the client disk to the SAN-attached
    storage. This process is shown in Figure 7-3 on page 260. For a complete list
    of operating systems and applications supported in a LAN-free environment, see:


    ```

    http://www-306.ibm.com/software/tivoli/products/storage-mgr/

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_287_0.png)


    Figure 7-3 Tivoli Storage Manager LAN-free transfer overview


    # 7.2 Non-shared tape device with Tivoli Storage Manager for Windows


    In this section, we discuss installing IBM tape libraries with Tivoli Storage
    Manager in the Windows environment. We used a tape library with both Fibre Channel
    and direct SCSI connections. The actual installations in the Windows environment
    was for Windows 2000.


