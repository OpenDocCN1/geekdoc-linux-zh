    # Table 7-1 Library device table


    | Device name | Serial number/WNN | Tape drive in the library | SCSI element address
    |

    |---|---|---|--|

    | IBMTape0 | 1110067680 | Drive 1 | 257 |

    | IBMTape1 | 1110068317 | Drive 2 | 258 |

    | IBMTape2 | 1110067231 | Drive 3 | 259 |

    | IBMTape3 | 1110059799 | Drive 4 | 260 |

    | IBMTape4 | 1110067604 | Drive 5 | 261 |

    | IBMTape5 | 1110064661 | Drive 6 | 262 |


    First, define the library and library path using the following commands. When
    there are multiple choices, the default setting is listed as follows:


    ```

    DEFINE LIBRARY library_name LIBTYPE=SCSI AUTOLABEL=yes/no

    DEFINE PATH server_name LIBRARY SRTYPE=SERVER SERVERTYPE=LIBRARY DEVICE=dev_name

    ```


    For library_name, enter a user-specified name of the library to be defined:


    ```

    DEFINE LIBRARY 11ib3584 LIBTYPE=SCSI

    ```


    For server_name, specify a name you have set for your server with the SET SERVERNAME
    command, which can be checked by issuing the QUERY STATUS command. In our case,
    we used the name saab. For dev_name, enter the full device name of library, such
    as /dev/IBMChanger0


    ```

    DEFINE PATH saab 11ib3584 SRTYPE=SERVER SERVERTYPE=LIBRARY DEVICE=/dev/IBMChanger0

    ```


    Next, define each of the library''s drives and paths with:


    ```

    DEFINE DRIVE library_name drive_name ELEMENT=element_number/AUTODECTECTnCLEANFREQUENCY=gigabytes=ASNEEDED/NONE

    DEFINE PATH server_name drive_name SRTYPE=SERVER SERVERTYPE=LIBRARY=library_name
    \

    DEVICE=dev_name

    ```


    For library_name, enter the device name of the already defined library (lib3584,
    in our example). Using the operating system device name of tape drive for dev_name.
    Enter the full device name for dev_name, such as /dev/IBMTape0. The element_address
    is a number that indicates the physical location of a drive in an automated library.
    Tivoli Storage Manager needs the element address to connect the physical location
    of the drive to the drive''s SCSI address. As Version 5.2, you can autodetect
    for the element_number. This is the default, and the element number will then
    automatically be detected by Tivoli Storage Manager when the path to the drive
    is defined.'
