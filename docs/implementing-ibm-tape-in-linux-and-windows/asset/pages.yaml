    a single tape drive have the text string "for Tivoli Storage Manager", and one
    that allows multiple opens on a single tape drive does *not* have the text string
    "for Tivoli Storage Manager". IBM strongly recommends that you use the "for Tivoli
    Storage Manager" drivers whether you are not a Tivoli client to prevent a tape
    drive from being accessed by potentially causing data corruption or loss. However,
    if you are using RSM, you must use the other driver and take steps to prevent
    multiple un opens to a tape drive.


    When installing the tape device drivers, follow the same directions as for a non-RSM
    user (see 3.3.2, "Installing the tape device driver" on page 98). The Select Best
    Match screen will prompt you to choose between drivers (either the Tivoli Storage
    Manager driver or the non-Tivoli Storage Manager driver) during installation (Figure
    3-39 on page 103). Select the non-Tivoli Storage Manager driver and click **Next**.
    The remainder of the instructions are the same as described in 3.3.2, "Installing
    the tape drive device driver" on page 98.'
