    We assume the reader is already familiar with basic SAN concepts. For more information
    about general SAN concepts and design, please refer to these Redbooks:


    +   - Designing an IBM Storage Area Network, SG24-5758

    - IBM TotalStorage: Implementing an Open IBM SAN, SG24-6116

    - IBM SAN Survival Guide, SG24-6143

    - Introduction to Storage Area Networks, SG24-5470

    - Designing and Optimizing an IBM Storage Area Network, SG24-6419


    **Note:** IBM SAN Data Gateway (SDG) Router models 2108-R03 and 2108-G07 were
    withdrawn from marketing in September 2002. The SAN Data Gateway Integrated Module
    is no longer available as a feature in a new IBM 3583. The SAN Data Gateway features
