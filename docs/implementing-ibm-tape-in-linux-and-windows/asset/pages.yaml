    # Note:


    +   - Tivoli Storage Manager V4.1.2 supports Ultrium 1 tape drives in the IBM
    3580, 3581, and 3584.

    - Tivoli Storage Manager V5.1.6 is required to support Ultrium 2 drives.

    - Tivoli Storage Manager V5.2 supports mixing Ultrium 1 and 2 in the same logical
    IBM 3582 library.

    - Tivoli Storage Manager V5.1.7.2, V5.2.1, or V5.3 supports custom IBM 3592 tape
    drives.

    - Tivoli Storage Manager V5.2.3 supports the IBM 3581 2U library.

    - Tivoli Storage Manager V5.2.4 or V5.3 supports Ultrium 3 tape drives, and a
    mix of Ultrium 1, 2, and in the same logical library.


    # Installation summary


    When installing Tivoli Storage Manager, the default configuration sets up a disk
    pool for storing backup data. Before you begin using a tape device as a backup
    destination, you must do the following:

    - Disable RSM (using the procedure in "Disabling RSM" on page 134).

    - Attach the devices to your system.

    - Install the LTO Ultrium device drivers for the Windows system you are using
    (as described in 3.2.1, "Installing the medium change device driver" on page 83).

    - Install the Tivoli Storage Manager server software.

    - Initialize the server.

    - Define the library.

    - Define the library path.

    - Define the drives in the library.

    - Define the paths.

    - Define a device class using the library.

    - Define a storage pool associated with the device class.

    - Include the storage pool in the storage hierarchy.

    - Label the tape library media.


    After completing step 3, follow the instructions in IBM Tivoli Storage Manager
    for Windows Installation Guide (for manager) to install Tivoli Storage Manager
    (step 4). We installed the Tivoli Storage Manager server first (using the Custom
    option with the default features), then the Tivoli Storage Manager device driver
    (tsm). Before installing, you should always check that you have the latest code.
    Refer to the following Web site for Tivoli product requirements, supported devices,
    and code levels: http://www-306.ibm.com/software/symmgmt/products/support/IBMTivoliStorageManager.html'
