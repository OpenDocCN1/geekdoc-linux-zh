  md: '# 2.2.4 Partitioning the IBM 3584 using the wizard; ALMS not enabled


    First, plan the number and location of storage slot columns and tape drives that
    you want in each local library. Now, the logical libraries can be configured from
    the Tape Library Specialist using the configuration wizard or the menu system.


    # ### Using the Tape Library Specialist


    In this example, we have a 1-frame library with 175 cartridge slots, and six drives
    already installed. It is defined as three logical libraries, but we will reconfigure
    the logical libraries using the configuration wizard:


    +   - Logical library "Redbook 1": Three drives, 60 cartridge slots

    - Logical library "Mt Lemon": Two drives, 60 cartridge slots

    - Logical library "Tucson": One drive, 55 cartridge slots


