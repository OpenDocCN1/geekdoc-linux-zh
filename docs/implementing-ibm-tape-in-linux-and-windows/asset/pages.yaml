- img_proc: true
  md: '# 5.1 SAN design considerations for IBM LTO tape libraries


    In this section, we cover the following IBM LTO SAN design considerations:


    +   - What bandwidth do we need for FC Tape?

    - How do we handle multiple paths to tape drives?


    The IBM LTO Ultrium 2 and 3 tape drives with Fibre Channel interface and the IBM
    3592 tape drive support either point-to-point or Fibre Channel arbitrated loop
    attachment. The IBM Ultrium 1 tape drives with Fibre Channel interface only support
    the FC-AL protocol. If you connect an IBM LTO Ultrium 1 tape drive to a SAN, the
    FC-AL protocol must be supported at that physical connection.


    # 5.1.1 What bandwidth do we need for FC tape?


    Many SANs are designed for disk I/O, which means they are optimized for high input/output
    per second (IOPS) and not necessarily for high bandwidth, which is needed for
    tape and backup I/O. During backup sessions, high volumes of data are generally
    transferred from tape to tape media. High speed transfer is also a necessity to
    minimize backup time. Current tape drives, like the IBM LTO3 with 80 MB/sec, the
    IBM LTO2 with 35 MB/sec, and the IBM 3592 with 40 MB/sec, can easily saturate
    a single FC link, if several drives operate concurrently.


    Using a fabric configuration, you can potentially attach and access many tape
    drives through one or more HBAs. But how will this affect performance if several
    tape drives run concurrently? The theoretical maximum data transfer rate for FC
    connection in a 2 Gbit SAN is 200 MB/sec. In reality, we see an effective data
    transfer rate of about 160 MB/sec. In a 1 Gbit SAN, we see an effective data transfer
    rate of 80 MB/sec.


    Ultrium 3 drives have a sustained data transfer rate of 80 MB/sec uncompressed,
    and 160 MB/sec using 2:1 compression. In theory, this means you should be able
    to run two uncompressed tape drives or one compressed tape drive concurrently
    on an HBA without performance degradation.


    Ultrium 2 drives have a sustained data transfer rate of 35 MB/sec uncompressed,
    and 70 MB/sec using 2:1 compression. In theory, this means you should be able
    to run four uncompressed tape drives or two compressed tape drives concurrently
    on an HBA without performance degradation.


    However, the data transfer rates which will be achieved depend heavily on the
    type of data.


    Typically, most system environments have a mix of data types achieving very different
    compression rates. If writing very large files with a good compression ratio,
    you may get a transfer rate of up to 160 MB/sec (Ultrium 3) or 70 MB/sec ((Ultrium
    2)) or even more. In this case, you should only run one Ultrium 3 or two Ultrium
    2 drives together on one HBA. On the other hand, if writing small files or incompressible
    files, you may see transfer rates of less than 80 MB/sec (Ultrium 3) or 35 MB/sec
    ((Ultrium 2)). In this case, more than one Ultrium 3 drive or two Ultrium 2 drives
    can run together on one HBA. However, it is not recommended that you try to run
    concurrently with more than two Ultrium 3 drives or four Ultrium 2 drives using
    a single HBA.


    As the number of drives per HBA, the overall SAN design must be capable of supporting
    the volume of data transferred during the backup process (see Figure 5-1 on page
    225). The SAN might be able to easily sustain the normal load data traffic, but
    still have an insufficient bandwidth when backups take place. This is specially
    in complex fabrics with multiple switches, where the inter switch links (ISLs)
    can become saturated.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'As already described, a FC link can sustain about 160 MB/sec. An ISL may handle
    slightly more, but as already discussed, with four to five (depending on the data
    and compression) Ultrium two tape drives running simultaneously, you can overload
    a single 2 Gbit ISL.


    Overloaded ISLs or HBAs may cause problems, like job abort, timeouts, tape drives
    not responding, and bad performance. Therefore, it is essential to provide enough
