  md: '# 4.3 Using native Linux device driver to configure IBM tape


    Basic support for SCSI devices has been available as part of the Linux kernel
    for several years. Typically, the driver for the SCSI controller of a Linux system
    is already compiled into the Linux kernel, and therefore available for use. This
    allows the Linux kernel to continue the boot process from a device connected to
    the SCSI controller after the kernel has been loaded and started from the Linux
    boot loader.


    In this section, we describe the built-in device drivers of the Linux kernel and
    the naming conventions for the Linux device file names. We use a direct attached
    IBM 3583 with two drives direct attached to an 1adaptec SCSI controller, as shown
    in Figure 4-1.


    To use the IBM tape device driver, see 4.4, “Using IBM Tape Device Driver” on
    page 203.


    ![](img/a48407b38d72fd58ea3627423836388a_214_0.png)


    Figure 4-1 Linux SCSI lab environment


    During startup, the Linux kernel scans the SCSI bus for all available adapters
    and recognizes the disk and tape devices that are connected and accessible. As
    a result of this process, every disk and tape device that has been recognized
    by the kernel will be accessible through a device file in the /dev directory.
    The concept of device files is common to all UNIX variants, but every UNIX variant
    has its naming conventions. Under Linux, every SCSI bus is scanned from low to
    high SCSI IDs, and the devices that are assigned to the device files in /dev in
    an ascending order. Disk devices are assigned to the device files /dev/sda, /dev/sdb,
    and so on. Tape devices are assigned to the device files /dev/st0, /dev/st1, and
    so on.


    Additional function in a physical device is often achieved by using different
    device names. For tape devices, the device files /dev/st will cause a rewind whenever
    the device is closed. The device files following the naming convention /dev/nst
    represent non-rewinding devices. These devices will keep the tape in the position
    where it was stopped after the last operation. Additional information can be found
    under the main pages for st and in the file readmest in the kernel source code.


    In addition to the device files mentioned before, every SCSI device detected by
    the kernel will be represented by a generic device file. This includes not only
    device types such as disk and tape devices, but also every device that answers
    to an inquiry command. Generic devices are represented by the device files /dev/sg0,
    /dev/sg1, and so on. For all device types that are recognized by the kernel, the
    sg device file exists in addition to the regular device file. For all device types
    that are not recognized by the kernel, this entry is the only device file representing
    the physical device. Additional information about the Linux generic device interface
    and the source code for a number of useful tools can be found at:


    ```

    http://www.torque.net/sg/

    ```'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'The native drivers for tape devices as provided by the Linux kernel support
    basic read and write operations on IBM Utape drives via the /dev/st/ and /dev/nist
    device files. The medium changer device can be accessed via /dev/sg/ representation.
    Later in this chapter, we discuss additional device naming concepts that are available
    in Linux. Table 4-1 on page 185 provides an overview of the possible device names
    on Linux. The middle column shows the device names that will be used if scsisutil
    is installed. We discuss this in 4.3.9, "Alternative device name in Linux" on
    page 200.


    While the Linux support for SCSI devices is generally included in the kernel sources,
    some installations do not include the generic device utilities. This means some
    commands such as sg_scan may not be available. To access them, download the sg3
    packages from the link above. The two packages that to be downloaded and installed
    are:


    ```

    libutils-1.0-1.15-1386.rpm

    sg3-utils-1.0-1.15-1386.rpm

    ```


    After downloading, install them with rpm. Example 4-3 shows an example for installing
    libutils-1.0-1.15-1386.rpm. Install it first, then sg3_utils. These tools provide
    a convenient way to identify our library and tape devices in this chapter.


    Example 4-3 The utilities related to identifying generic SCSI device support


    ```

    # rpm -ivh libutils-1.0-1.15-1386.rpm

    ########################################### [100%]

    Preparing... ########################### [100%]

    1:libutils-1_0 ########################### [100%]

    ```


    # 4.3 Identifying and activating the SCSI controller


    In most cases, your Linux distribution will provide a kernel that automatically
    configures the most common SCSI adapters without requiring further modification.
    This section describes how to identify and setup a SCSI adapter if it is not already
    supported by the kernel. In 4.5, "Intel Fibre Channel HBA installation" on page
    216, we will use the same procedure to make a Fibre Channel HBA available to the
    system.


    In the first step, check if the adapter is visible on the SCSI bus of the system.
    For this purpose, use a tool called lspci. If lspci is not part of your Linux
    distribution, you can download it from:


    ```

    http://atrey.karlin.mf.cuni.com/~mj/pciutls.html

    ```


    As shown in Example 4-4, the command lspci creates a list of all PCI devices visible
    to your system.


    ```

    [root@diomede]# lspci

    00:00.0 Host bridge: Intel Corporation 440BX/ZX - 82438BX/ZX Host bridge (rev
    03)

    00:00.01 PCI bridge: Intel Corporation 4408BX/ZX - 82438BX/ZX AGP bridge (rev
    03)

    00:02.0 ISA bridge: Intel Corporation 82371AB PIIX4 ISA (rev 02)

    00:02.1 IDE Interface: Intel Corporation 82371AB PIIX4 IDE (rev 01)

    00:02.2 USB controller: Intel Corporation 82371AB PIIX4 USB (rev 01)

    00:02.3 Bridge: Intel Corporation 82371AB PIIX4 ACPI (rev 02)

    00:03.0 Ethernet controller: Intel Corporation 82557 [Ethernet Pro 100] (rev 05)

    00:10.0 SCSI controller: Adaptec 7892A (rev 02)

    01:01.0 VGA controller: 53 Inc. Trio 64 3D SCSI (rev 01)

    ```


    Example 4- Output of lspci showing PCI devices under our SCSI adapter


    The result of lspci shows that an Adaptec 7892A SCSI is available in the system
    (second line from the bottom). Linux returns the type of controller and not the
    product name, which is, in our case, an Adaptec 29160 LWD adapter. If the adapter
    is not recognized'
