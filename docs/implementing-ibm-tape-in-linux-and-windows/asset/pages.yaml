- img_proc: true
  md: 'Ultrium Tape Drives within the library. The IBM Ultrium tape cartridges have
    been refined using the many years of IBM tape experience to provide a tape cartridge
    that provides fast data transfer, and stands up to the rigors of automated handling.


    The IBM 3582 is designed for easy expansion. It has a one-cartridge Import/Export
    station and 22 data cartridge slots. With Ultrium 2 drives and media, the IBM
    3582 provides a media capacity of up to 4.8 TB (9.6 TB with 2:1 compression) and
    a sustained data rate up to 35 MB per second (unsigned). With Ultrium 3 drives
    and media, the IBM 3582 provides a media capacity of up to 9.6 TB (19.2 TB with
    2:1 compression) and a sustained data rate up to 80 MB per second (unsigned).


    The IBM 3582 comes standard with multi-path architecture, which allows the sharing
    of the library robotics. This allows the IBM 3582 to be partitioned into one or
    two logical libraries, providing each library with its own control path, drives,
    and storage slots. The Import/Export station (slot) is shared among each logical
    library on a first-served basis. The cartridges under virtual control are not
    shared among the logical libraries. This feature enables up to two heterogeneous
    applications to manage a single physical library.


    The tape library Import/Export (I/O) station allows cartridges to be inserted
    and removed without disrupting library operation. There are two I/O station options:


    +   - A single import/export slot to load or remove simple tapes

    - 7-slot magazines for bulk load and unload


    A Bar Reader is standard for reading data cartridge labels, although the library
    can function with unlabeled cartridges.


    The IBM 3582 with Ultrium 2 and Ultrium 3 drives supports SCSI HVD, SCSI LVD and
    native Fibre Channel connected Ultrium 2 or Ultrium 3 drives. The direct attached
    SCSI drives may be any mixture of SCSI LVD, SCSI HVD, or Fibre Channel up to a
    total of two drives.


    # Control path failover


    For enhanced availability you use control path failover. This optional feature
    provides automatic control path failover in the event of a loss of host adapter
    or control path drive, without aborting the current job in progress. Support is
    provided under AIX, Linux, HP-UX, Windows, and Solaris for both SCSI and Fibre
    Channel attachments when the IBM tape device is used.


    # Data path failover and load balancing


    Data path failover and load balancing exclusively support native Fibre Channel
    Ultrium 2 and Ultrium 3 Drives in a IBM 3582 library using the IBM tape device
