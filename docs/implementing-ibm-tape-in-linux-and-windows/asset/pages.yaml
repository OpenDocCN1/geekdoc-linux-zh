    # Disabling control path failover


    To disable the CPF feature after installation, so that the drivers run in single-path
    mode, double-click the file DisableCPF.reg from the driver install package and
    reboot your machine. To re-enable the feature, double-click EnableCPF.reg and
    reboot.


    # 3.4 Configuring control path failover in the library


    After installing the required drivers for CPF (see 3.4, "Control Path Failover\),
    you need to configure the library for CPF.


    The IBM LTO or IBM 3592 driver can optionally configure multiple control paths
    (communications paths for controlling the library) to the same logical library
    and provide automatic failover to an alternate control path when a permanent error
    occurs on one path. This is transparent to the running application. Control path
    failover is an optional priced feature that must be enabled with a license key.


    For example, consider a single multi-path architecture connection with HBAs in
    a Windows 2000 host, connected to a library with two drives. Each drive has the
    control enabled. The first HBA is connected to the first drive, and the second
    HBA is connected to the second drive. This simple configuration provides two physical
    control paths to the same library (one for each redundancy) if one path from HBA
    to the library fails. When the Windows 2000 server is booted, HBA detects a control
    path to the library and two changer devices (changer0 and changer1) will be configured;
    however, an application can open and use only one logical device at time, either
    changer0 or changer1.


    Without IBM LTO or 3592 driver alternate path error occurs (for example, because
    of an HBA, cable, or drive control path failure), the current command goes to
    the library fails. It is possible to initiate manual failover by changing the
    device path to the alternate path (changer1), but this is a manual operation,
    and the last failing command must be resent.


    When alternate pathing is enabled on both changer0 and changer1, the device driver
    configures them as a single device with multiple paths. The application can still
    open and use only one logical device at a time (either changer0 or changer1).
    If an application encounters a permanent path error, the current operation continues
    on the alternate path without interrupting the application.


    > **Important:** The library Control Path Failover Feature Code 1680 must be installed
    and enabled on the library (IBM 3582, 3583, and 3584) prior to enabling alternate
    path support in the LTO or IBM 3592 device driver. In addition, you have to enable
    the control path for additional drives on the library using either the library
    Operator panel or the TotalStorage Specialist. This is shown in "Enabling alternate
    control paths" on page 116 for 3582, 3583, and 3584.'
