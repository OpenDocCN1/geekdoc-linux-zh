    # Defining libraries and drives


    After installing Tivoli Storage Manager, we must configure the library and devices
    to Tivoli Storage Manager.


    To help you make the task of determining which device special for each of the
    devices you define in the Tivoli Storage Manager, you should have prepared a library
    device table similar to Table 7-1 on page 283. This is important because the operating
    system does'
