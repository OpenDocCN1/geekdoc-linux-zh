- img_proc: true
  md: 'RSM will attempt to auto-configure the libraries attached to the SAN Data Gateway
    (SDG), but is unable to do so, so the SDG recognizes SCSI device IDs and LUNs.
    Consequently, RSM is unable to resolve the SDG addresses with those contained
    in the Read Element Status data for the drives. For Fibre Channel drives attached
    to an IBM 3584, typically, a switch would be involved. Using RSMConfig.exe tool
    in the Windows 2000 resource kit utility or manually by editing the registry.
    To edit the registry, the following procedure is required:


    +   1. Stop RSM by following the following command at a command prompt:


    ```

    net stop "removable storage"

    ```


    +   2. Back up the RSM database by copying the files in the % %SystemRoot%\System32\Nmtsdata
    folder to (secure) location.


    +   3. Restart RSM by following the following command at a command prompt:


    ```

    net start "removable storage"

    ```


    +   4. Using the RSM console, make a note of all the drives that appear as stand-alone
    libraries. RSM displays all drives that are not mapped to a changer as stand-alone
    libraries, including drives that are actually in the changer but are unmapped.


    +   5. Eject any tapes that are located in the library.


    +   6. Place a drive in a library you are trying to configure, either by opening
    the library door or a front panel and refer (to your changer''s documentation
    for how to do this). Refresh in the RSM console for each of the stand-alone drives,
    and locate the drive that shows it contains a tape. Open the Property sheet for
    that drive and the device name on the Device Information page (for example, \\Tape0).
    Repeat this step for each drive in the changer that you are trying to configure.


    +   7. Click Start, run regedt32.exe, and then click OK.


    +   8. Locate the following registry key (as shown in Figure 6-9):

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\NmtsSvc\Config\Changer


    ![](img/a48407b38d72fd58ea3627423836388a_280_0.png)


    +   9. Change the AutoCfg:REG_DWORD:0x1 value to 0. If AutoCfg does not exist,
    create a new value AutoCfg with a data type of REG_DWORD, and then type 0 for
    the data.


    +   10. Stop RSM.


    +   11. In the Registry Editor, locate the following registry key:

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\NmtsSvc\Config'
  merge: -1
  pgno: 280
- img_proc: true
  md: '12.The Config key contains a subkey for each changer (for example, Changer0)
    and a subkey for each stand-alone drive. Each changer subkey contains an entry
    for each drive bay in the changer (for example, DriveBay0).


    13.For each DriveBay entry that has a ??? value, replace that with the device
    name extracted in Step 6 with the drive in that bay, without the leading "\\\"
    characters (for example, Tape3). For example:


    +   - DriveBay0:REG_SZ:Tape0

    - DriveBay1:REG_SZ:Tape1


    Exit the Registry Editor.


    14.Restart RSM. RSM reads the new configuration information and initializes the
    devices.


    15.Using the snap-in, put a tape in each drive in the library after RSM is initialized.
    If any of the configurations are incorrect, RSM generates an error message during
    initialization, or when you insert a tape in a drive.


    16.If the manual configuration is unsuccessful, stop the RSM process. Copy your
    backup version of the RSM database files back to the %SystemRoot%\System32\nmsdata
    folder to restore the database and restart the manual configuration process.


    If RSM does not generate any error messages, the manual configuration was successful.
    You should be able to now use SAN-attached devices with RSM-aware applications.'
  merge: -1
