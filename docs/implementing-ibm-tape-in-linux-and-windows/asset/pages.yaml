    +   5. You can leave the old storage pool as it is and, over time, expiration
    and migration will reduce the usage of the old storage pool.


    +   6. If you want to "drain" the old storage pool more quickly, you can simply
    set HIGHM and LOWM to zero. This starts a migration process, which moves data
    from the old storage pool to the new LTO storage pool. To speed up the migration,
    you can increase the MIGPROCESS limit for the old storage pool to use more drives
    (remember this is a drive process).


    +   7. You can also run a MOVE DATA volume_name LTO_storage_pool_name command,
    selecting each individual volume from the old sequential storage pool, and targeting
    the new LTO storage pool.'
