    # How to update the firmware


    You can use the following methods to update the firmware:


    +   - Using the RMU and the IBM Ultrium Tape Library Specialist

    - Using NTUTIL

    - Using the Field Microcode Replacement (FMR) tape (drive firmware only) (not
    supported on the IBM 3581 (not covered in this redbook))

    - Using the library serial port (not covered in this redbook)

    - Using LTO-TDX


    Here is an example of the firmware update time using different methods. We used
    the IBM 3581 to compare the different methods (see Figure 3-3). This table is
    for general information only; your times may vary.


    | Method | Type of firmware | Update time | Drive |

    |---|---|---||

    | | | Autoloader | Drive |

    | SCSI (using NTUTIL or TAPEUTIL) | Autoloader and Drive | Not tested | 66 seconds
    |

    | SCSI (using LTO-TDX) | Drive Only | N/A | 90 seconds |

    | Serial Port | Autoloader and Drive | 6 minutes | 13 minutes |

    | RMU | Autoloader and Drive | 45 seconds | 6 minutes |


    Detailed instructions on how to update the firmware are at the following Web site.
    Select the appropriate LTE model and then **Download:**


    ```

    http://www-1.ibm.com/servers/storage/support/lto/

    ```'
