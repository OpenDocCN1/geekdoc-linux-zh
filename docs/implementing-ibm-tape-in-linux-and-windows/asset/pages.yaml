    # 3.5.5 Deleting LTO devices


    You may need to remove the tape device or the Medium Changer from the Windows
    device configuration. This is required for some application software that needs
    a specific device driver for the Medium Changer or the Tape Drive. You may also
    want to disable a drive, perhaps for troubleshooting purposes. In this section,
    we describe how to disable an IBM tape device in Windows 200x, and how to remove
    a device driver.


    # Disabling tape medium changer or tape drive


    To disable IBM tape device in Windows 200x, open Device Manager, locate the device
    (in this case, under Medium Changers or Tape Drives), right-click the device and
    select Disable. Alternatively, you can do this from the Properties box for the
    device under the General tab. This is shown in Figure 3-71.


    ![](img/a48407b38d72fd58ea3627423836388a_161_0.png)


