  md: '# 3.4 Control Path Failover


    The Control Path Failover (CPF) feature of the IBM medium changer device drivers
    provides a mechanism whereby commands sent to a failing control path on a medium
    changer may fail over to a working control path. On Windows 2000 and Windows Server
    2003, this support requires two kernel-level drivers to be running on the system,
    in addition to the medium changer driver ibmcxx.sys (the "base" driver). If CPF
    support is not provided, the base driver will be unable to operate the changer.


    One of the two additional drivers required to enable CPF support is a filter driver
    that will be installed automatically via the magchgrf.inf (rather than the magchgrf.inf
    file is used for the base driver installing). Depending on the version of the
    driver, you may need either or both these files when unzipping. The other additional
    is a virtual software bus, called the Changer Bus Enumerator, which must be installed
    before the base and filter driver installation. Because it is a virtual bus, no
    hardware will be plugged in and Windows will not recognize the presence of new
    hardware by the standard plug-and-play protocols.


    V6.0.8.2 and later of the IBM medium changer Control Path Failover (CPF). Major
    architectural changes were made to the driver to include this support, and changes
    are in effect regardless of whether your environment includes support for the
    feature. A new procedure for installing the driver has been introduced. In particular,
    the changer driver on any given platform requires installation of three .sys files
    with their corresponding .inf files:


    +   - ibmcgbs.sys (installed by ibmcgbs.inf)

    - ibmcgxx.sys and ibmagchftxx.sys (installed by magchgrf.inf)


    ''xx'' in the names later refers to either 2k or 3k3).


    ![](img/a48407b38d72fd58ea3627423836388a_130_0.png)


    Figure 3-39 To install the version for RSM select the second driver listed


    If you have Control Path Failover installed, you must also configure the library.
    For information about configuration, please see 3.4, "Control Path Failover" on
    page 103.'
