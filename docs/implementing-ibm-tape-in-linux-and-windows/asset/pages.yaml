- img_proc: true
  md: "Note: The CLEANFREQUENCY parameter in the DEFINE DRIVE command is optional.\
    \ Tivoli Storage Manager-managed cleaning is intended for drives and libraries\
    \ that do not have an automatic cleaning function. The IBM 3581, 3582, 3583, and\
    \ 3584 have an automatic cleaning function, which means they take care of drive\
    \ cleaning. Therefore, it is not necessary to specify the CLEANFREQUENCY parameter,\
    \ because the default value is NONE.\n\nThe IBM 3581 2U does not have an automatic\
    \ cleaning function; therefore, we recommend that you let Tivoli Storage Manager\
    \ manage the cleaning of this device.\n\nIf you want Tivoli Storage Manager to\
    \ control drive cleaning, you should use the option AS NEEDED. You will have to\
    \ change the auto cleaning function setting to host the cleaning function on the\
    \ autoloader or library. Also, if you use a partitioned IBM 3584, every logical\
    \ partition needs its own cleaner cartridge.\n\nThere is no need to clean LTO\
    \ drives on a periodic basis (that is, after a set of gigabytes has been processed\
