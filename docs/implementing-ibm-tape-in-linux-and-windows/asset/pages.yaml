    ```


    The drive block size may also be altered with option 43: Set media params (block
    size). The blocksize is (0) by default. This value may be overwritten by some
    backup applications.


    You can view the current device parameters such as target ID and LUN by selecting
    88: List registered devices (see Example 3-18).


    # Example 3-18 List registered devices


    ```

    enter selection: 88

    Device found: Changer0@Scsi Port 3\Scsi Bus 1\Target ID 0\Logical Id 1

    Device found: Tape0@Scsi Port 3\Scsi Bus 1\Target ID 0\Logical Id 2

    Device found: Tape1@Scsi Port 3\Scsi Bus 1\Target ID 0\Logical Id 4

    Total elapsed time in seconds = 0.00

    Return to continue:

    ```


    When devices are attached via IBM SAN Data Gateway, SCSI target IDs and LUNs on
    the gateway''s SCSI channels are remapped to other values that are then presented
    to the host operating system.


    > Note: IBM SAN Data Gateway and the 3583 SDG module were withdrawn from marketing
    in 2004.


    When the server boots, the devices, attached to the first gateway encountered
    by the boot I/O scan process, are assigned SCSI target ID 0 (with LUNs between
    0-127); devices attached to the second gateway have SCSI target ID 1, and so on.


    > Important: For every SDG attached to the server, LUN 0 is used by the gateway
    itself, and LUNs 2–126 are used for tape devices attached to the gateway. Tape
    drives are assigned an even number LUN and start at 2. The Medium Changer will
    have an odd number.


    For those tape devices, the gateway assigns LUNs sequentially as the devices are
    discovered on its attached SCSI channels.


    This means that adding and removing devices, changing cables, and readdressing
    devices may cause gaps in the sequence of assigned LUNs, as the LUN number assignments
    are made every time the server reboots. This problem may be overcome by enabling
    persistent binding on the Fibre Channel HBA. For more details regarding persistent
    binding, refer to 5.3, "Persistent binding" on page 237.'
