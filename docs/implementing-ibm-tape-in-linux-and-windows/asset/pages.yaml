    Area Network Data Gateway Setup, Operator, and Service Guide, GA32-0436.


    > Note: The IBM SAN Data Gateway and the 3583 SDG module were withdrawn from marketing
    in October 2004.


    > Note: Before updating firmware on the drives, the library, or the RMU, vary
    the library OFFLINE to ALL attached hosts.


    As an example, we show how to upgrade the library and drive microcode through
    the SCSI bus interface using the NTUTIL utility for Windows 200x. Then we show
