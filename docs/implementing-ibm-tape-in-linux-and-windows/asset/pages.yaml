  md: '# 2.2.3 Partitioning the IBM 3584 (ALMS not enabled)


    You can partition the IBM 3584 into multiple logical libraries. Each logical library
    requires at least one tape drive and one storage slot. Therefore, you can theoretically
    configure as many logical libraries as are tape drives in the library, that, IBM
    3584 supports up to 192 logical libraries. Ultrium drive types (Generation 1,
    2, or 3) can be mixed in a logical library if the backup application supports
    it, but Ultrium and IBM 3592 tape drives cannot be mixed within a logical library
    (LTO and 3592 must be installed in different frames).


    Note: If using mixed media and drives (LTO and 3592) within one IBM 3584, then
    at least two logical libraries (one for LTO and one for 3592) must be created.


    Storage slots within one logical library must be in contiguous order, but can
    span over different frames. Also, tape drives within one logical library must
    be in contiguous order, but can be in different frames, and can contain gaps in
    the order (as having two drives installed in frame 1 and two in frame 2; then
    you have a gap of 10 drives). However, although the IBM 3584 allows you to have
    gaps in the drive order, some applications as EMC Legato NetWorker or Veritas
    BackupExec do not support such gaps.


    Plan your logical library configuration carefully, because the need for contiguous
    storage slots makes future changes very difficult. For example, if you have an
    IBM 3584 with logical libraries defined, and you have to change the configuration
    of the first library, then all of the five remaining libraries must be changed
    as well. Consequently, plan your logical library configuration according to these
    rules:


    +   * Put the logical library that has the most expected growth at the end of
    the library.

    * Put the logical library that is the least likely to grow in the front.

    * Do not configure logical libraries with just the required minimum of resources
    (tape drives and storage slots); instead, configure logical libraries with a buffer
    (reserve) of storage slots.

    * Do not put the first drive of a logical library just behind the last drive of
    the preceding logical library. Keep some free drive locations between two logical
    libraries in order to install additional drives if needed.


    Figure 2-13 on page 49 shows an example. It is an L52 frame with nine LTO drives
    installed, and with a capacity of 261 storage slots. Three logical libraries are
    required: logical library 1 needs 40 slots and two drives, logical library 2 needs
    60 slots and two drives, and logical library 3 needs 120 slots and five drives.
    The third library is expected to grow heavily.


    The first logical library was configured with 60 slots and two tape drives.


    The second logical library was configured with 81 slots and two tape drives. The
    first tape drive for logical 2 was installed in the fourth drive location; this
    gives the ability to install one additional drive in the first logical library
    if needed.


    The library with the highest expected growth was put at the end. If needed, an
    additional D-frame can be added to the library and logical library 3 can be expanded
    to the next frame without changing the configuration of the first two libraries.'
