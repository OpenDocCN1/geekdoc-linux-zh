    In this section, we discuss the steps to configure IBM tape devices with Tivoli

    Storage Manager for Linux.


    # Installing Tivoli Storage Manager


    Before you begin using a tape device as a backup destination, you may do the following:


    +   1. Install the IBMTape Device Drivers and IBMTapeutil.

    2. Attach the devices to your system.

    3. Configure the special device files for the tape library and drives.

    4. Install the Tivoli Storage Manager Server software.

    5. Initialize the server.

    6. Define the library.

    7. Define the library path.

    8. Define the drives in the library.

    9. Define the drive paths.

    10.Define a device class using the library.

    11.Label the tape media library.


