    # # 3.7.3 Emulex LPxxxx HBA driver installation


    The currently supported Emulex adapters for the IBM tape library and tape drives
    can be found at the following:


    http://knowledge.storage.ibm.com/servers/storage/support/hbasearch/interop/hbaSearch.


    Check off the IBM tape driver and operating system of your choice.


    If you click the **View Details** link for HBA, this will take you to the vendor''s
    Web site to download device drivers and microcode.


    > Note: Emulex provides two driver sets. The miniport driver provides support
    for the SCSI protocol. The Multi-Protocol Port Driver provides support for the
    SCSI and IP protocols, either sequentially or concurrently. The Multi-Protocol
    Port Driver also has an additional tool elxcfg that allows us to DUN mapping.
    This tool is not in the miniport driver. Currently, only the Multi-Protocol Port
    Driver is available for download.


    Download the installation file that comes in ZIP format. This can be unzipped
    to a temporary directory. The unzipped files will include a file with the extension
    SYS and another file with the extension INF.


    You will find detailed installation instructions for the Emulex adapter at the
    same link. You can download the instructions, or click the **installation** link
    and you will find the installation information. Be sure to read this information
    before proceeding with the driver installation.


    To install the driver, do the following:


    +   1. Shut down the machine.

    2. Insert the HBA.

    3. Start up the machine.

    4. We recommend that you reboot or shut down the machine before establishing the
    Fibre Channel connection.


    Based on the specifics of the SAN environment, select the appropriate driver.
    If using a SAN fabric environment, select **fabric, no automap of SCSI ids.'
