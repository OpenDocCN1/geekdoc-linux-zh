    # ## 1.5 IBM TotalStorage 3582 Tape Library


    The IBM TotalStorage 3582 Tape Library (abbreviated to IBM 3582) is an entry-level
    tape library that can accommodate one or two Ultrium 2 or Ultrium 3 drives. Designed
    for tape automation, the IBM 3582 attaches to a variety of serving and operating
    system platforms (See 1.2.1, "Hardware server platforms on page 28).


    The IBM 3582 has one model, the 3582-L28. The IBM 3582 uses the Ultrium 2 and
    Ultrium 3 drives for fast data transfer and reliability in automated library service.
    The Ultrium 2 cartridge has a native capacity of 200 GB. The Ultrium 3 cartridge
    has a native capacity of 400 GB.


    Each aspect of the library subsystem has been designed for repeated, reliable
    unattended tape handling. The tape handling mechanism is designed to reliably
    move tapes to IBM'
