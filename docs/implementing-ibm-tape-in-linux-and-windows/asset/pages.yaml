- img_proc: true
  md: 'slots of one logical library, while a UNIX application uses the drive and slots
    of another logical library.


    Logical libraries can also be used for separating different generations of IBM
    LTO drives and cartridges, or IBM 3592 drives and cartridges, for applications
    which do not support mixing the drives in the same logical library.


    Support for multi-path architecture and partitioning may require an updated microcode
    level.

    Download the latest microcode from each of our Web sites:


    ```

    http://www.ibm.com/servers/storage/support/lto/3584/download.html

    ftp://software.ibm.com/storage/358x/3584/

    ```


    # Advanced Library Management System (ALMS)


    The Advanced Library Management System (ALMS) is the next generation of patented
    IBM Multi-Path Architecture. ALMS is designed to provide enhanced automation functionality,
    including dynamic partitioning, storage slot pooling and flexible drive assignment.
    Capacity On Demand (COD) level additions can also be selected and implemented
    through license key upgrades with the IBM 3584-LS2 or L2, providing growth flexibility
    as required. The IBM 3584 continues to offer a SAN-ready multi-path architecture,
    and the ability to partition the library into 192 logical libraries. IBM Tivoli
    Storage Manager and other industry-leading software offerings can provide storage
    and tape management for the IBM 3584. For implementation information for ALMS,
    see 2.3, "ALMS" on page 58.


    # Control path failover


    This optional feature is designed to provide automatic control path failover to
    a pre-configured redundant control path in the event of a loss of host adapter
    or control path drive, without aborting the current job in progress. Support is
    provided for AIX, Linux, Windows, HP-UX, and Solaris when the IBM device driver
    is used.


    # Data path failover and load balancing


    Data path failover and load balancing support native Fibre Channel IBM LTO 2 and
    LTO 3 drives in IBM 3584 using the IBM device driver for AIX, HP-UX, Windows,
    Linux, and Solaris. Data path failover provides a failover mechanism in the IBM
    device driver, so that you can configure multiple redundant paths in a SAN environment.
    If a path or component fails, the failover mechanism is designed to automatically
    provide recovery to the current operation using an alternate, pre-configured path
    without aborting the current job in progress. This provides flexibility in SAN
    configuration, availability, and management.


    When a tape drive device has been configured with alternate paths across multiple
    host ports, the IBM device driver automatically selects a path through the host
    adapter (HBA) that has the fewest open tape devices, and assigns that path to
    the application. This self-optimizing capability is called load balancing. The
    dynamic load balancing support is designed to optimize resources for devices that
    have physical connections to multiple HBAs in the machine. The device driver is
    designed to dynamically track the usage of each HBA as applications open and close
    devices, and balance the number of applications using each HBA in the machine.
    This may help optimize HBA resources and improve overall performance. Furthermore,
    data path failover provides autonomic self-healing capabilities similar to control
    path failover, with transparent failover to an data path in the event of a failure
    in the primary host-side path.


    Data path failover and load balancing for Ultrium 3 drives in all supported environments
    require optional optional feature code 1681 and the Control Path Failover feature
    code 1680. Data path failover and load balancing for Ultrium 2 drives in an AIX
    environment'
