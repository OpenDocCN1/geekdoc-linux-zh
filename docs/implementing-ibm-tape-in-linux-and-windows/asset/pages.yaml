  md: '# IBM SAN Data Gateway


    **Note:** The IBM SAN Data Gateway (SDG) Router models 2108-R03 and 2108-G07 were
    withdrawn from marketing in September 2002. The SAN Data Gateway Integrated Module
    is no longer available as a feature in a new IBM 3583. The SAN Data Gateway features
    were withdrawn from marketing in October 2004. The information in this section
    is a reference for any client still using the SDG or an IBM 3583 with the integrated
    SDG.


    The IBM 2108 Storage Area Network (SAN) SAN Data Gateway is a family of connectivity
    products that enable Fibre wave or two long wave Fibre Channel ports to Ultra
    SCSI or SCSI-based storage or host systems.


    The IBM 2108 Model G07 SAN Data Gateway is a protocol convertor available with
    up to six short wave or long wave Fibre Channel ports and four Ultra SCSI Differential
    ports for device attachment. It supports attachment of the IBM LTO Tape Drives
    to Fibre-capable IBM system p5, IBM @serverX, and other Intel-based servers running
    Windows, and Sun UNIX servers. With the Virtual SAN Gateway provides access control
    between host systems and storage devices across a SAN.


    The IBM 2108 Storage Area Network (SAN) SAN Data Gateway connects Ultra SCSI and
    SCSI tape libraries to Fibre Channel environments. New or existing SCSI-based
    tape libraries can be attached to SANs or directly to host systems using an industry-standard
    Fibre Channel interface. The SAN Router is an easy-to-manage protocol converter
    that provides a single Fibre Channel port and two Ultra SCSI ports, either single-ended
    or differential. It supports Fibre Channel attachment of the IBM Infinity and
    other Intel-based servers running Windows'' NT to LTO Libraries.


    *The SAN Data Gateway Integrated Module* is a chargeable library feature that
    was available for the IBM 3583 - it is functionally equivalent to the separate
    SAN Data models.


    For the rest of this section, we will use SDG to refer to any of these products
    interchangeably unless otherwise indicated.


    The SDG provides the ability for SCSI devices in the library to connect into a
    SAN. The SDG can run at 1 Gbps or 2 Gbps port speeds, providing compatibility
    for older (1 Gbps) devices, as well as support for higher speed devices. Two Fibre
    Channel ports make multiple'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'attachments easy support failover redundancy. The SDG has two Fibre Channel
    ports and four SCSI ports. The Fibre Channel ports have 2 Gigabit, SC-style shortwave
    multimode Gigabit Interface Converter (GBIC) modules. The Fibre Channel ports
    can communicate reliably at distances of up to 300 m, over 50 µ multimode-optical
    fiber cables. The four SCSI ports are Ultra2, low voltage differential (LVD),
    with VHDCI-style connectors (Very High Density Cable Interconnect).


    The IBM 3583 with Ultrium 1 drives allows a mixture of up to six direct attached
    SCSI LVD or HVD drives. If you are using the integrated SAN Data Gateway to enable
    FC connectivity, then up to six LVD or HVD drives can be installed. The SAN Data
    Gateway Integrated Module cannot support a mixture of HVD and LVD drives.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Connecting tape drives to a SDG


    The data transfer throughput for an IBM SAN Data Gateway 2108 G07 is 100 MB/sec.
    For a SAN Data Gateway 2108 R03, the data transfer throughput is about 50 MB/sec.
    Although it is possible to connect LTO Ultrium II SCSI tape drives to a SAN Data
    Gateway, it makes more sense to use native Fibre Channel tape drives.


    Our suggestions for achieving the best effective data rate with LTO Ultrium tape
    drives on the SDG are:


    +   - Avoid daisy-chaining drives. If this is necessary (for example, if there
    are more than three drives to be connected), then do not connect more than two
    drives per SCSI Bus.


    +   - If possible, do not install more than two drives on a 2108 R03, or four
    drives on a 2108 G07.


    Figure A-1 shows an example of a connection with SDG and a 3583. The 3583 contains
    six LTO drives. Each SCSI connection has two LTO drives. The SCSI medium changer
    is attached to its SCSI bus. The server is connected to the SDG using two HBAs
    and FC ports. If you have more drives to attach, you can move the SCSI medium
    changer to share any of the SCSI ports on the SDG.


    ![](img/a48407b38d72fd58ea3627423836388a_414_0.png)


    # WWN of SDG


    Since it is a SAN device, each SDG has its own World-Wide Name (WWN).


    # Getting the WWN of the SDG and use the command fcShowNames (Example A-1).


    Example: A-1 WWN of SDG


    ```

    Ctrl : PCI Addr : ISP : Node : Port

    Id : Bs Dv Fn : Type : Name : Name

    1 : 00 06 00 : 2200 : 10000060.45161ff5 : 20010060.45161ff5

    ```


    Router > fcShowNames'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'You can also use the SAN Data Gateway Specialist (Figure A-2) to display this
    information. "Install and use the SDG Specialist" on page 391 for more information
    about the SAN Data Gateway StorWatch Specialist.


    ![](img/a48407b38d72fd58ea3627423836388a_415_0.png)


    # SAN Data Gateway setup


    The SDG maps addresses across and among the different interfaces and preserves
    the persistency of address maps across startups of systems, devices, and the SDG.


    > **Attention:** Sharing the gateway between disk and tape products is not supported.


    You can connect more than one host to an SDG. By default, all hosts can access
    all target devices. In practice, you want to restrict this access, unless you
    are that the different host operating systems and applications will correctly
    handle simultaneous access to the same device by multiple servers. Otherwise,
    device operation failures and data integrity problems can occur. To avoid this,
    use zoning (as discussed in 5.2, "Zoning" on page 232), use intelligent applications
    that can handle the device sharing (such as tape library sharing with IBM Tivoli
    Storage Manager), or use these options available with the SDG:


    +   - Channel zoning option: You can set the desired access between SAN connections
    and undirected SCSI channels.

    - Virtual Private SAN (VPS) or lun masking: You can set the desired access permissions
    between hosts on the SAN connections and individual LUNs.


    **Note:** VPS is only available as an option for the IBM 2108 G07, and for the
    IBM 2108 R03 or the Integrated SAN Data Gateway Module for the 3583. Special software
    is also required.'
  merge: -1
  pgno: 415
- img_proc: true
  md: 'In the following section, we give an overview of:


    +   - The basic setup of the SDG

    - The installation and usage of the StorWatch SDG Specialist

    - How LUN mapping works

    - How to use channel zoning

    - The Private SAN


    For more information about the SAN Data Gateway, refer to these publications:


    +   - 2108 Model G07 Installation and User''s Guide, SC26-7304

    - 2108 Model R03 Installation and User''s Guide, SC26-7355


    # Basic setup


    We briefly summarize the main steps for setting up the SDG: detailed information
    is provided in the installation and user guides listed in the previous section:


    +   1. After installing the hardware, set up a connection between the SDG''s serial
    port and a serial port on a PC, using the supplied null modem cable and a PC terminal
    program, such as Netterm or Hyperterm. Use the following parameters to configure
    the terminal session:

    - Bits per second: 19200

    - Data bits: 8

    - Parity: None

    - Stop bits: 1

    - Flow Control: Xon/Xoff


    If you are connected, press Enter and you will get a response from the SDG, as
    shown in Figure A-3.


    ![](img/a48407b38d72fd58ea3627423836388a_416_0.png)


    Figure A-3 Connected to the SDG


    +   2. We suggest the following basic commands sequence to install a new or an
    already used SDG:


    +   a. initializeBox

    This restores the factory defaults by deleting all configuration files, including
    persistent address map and databases, then a restart is needed.


    +   b. ethAddrSet

    Use the ethAddrSet command to set or change the IP address and network mask (if
    required) of the SAN Data Gateway:

    Router > ethAddrSet "192.168.1.54" "255.255.255.0"'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# c. ethEnable


    The ethEnable command alters the start parameters of the SDG Router, enabling
    the Ethernet port. This command does not take effect until the SDG Router is restarted.


    # d. userAdd "admin","password"


    This adds a user and password to the password file. The user name variable must
    be to 80 characters. The password variable must be eight to 40 characters. Here
    you can create your own user ID:


    ```

    Router > userAdd "nancy","password"

    ```


    # e. setHost X,YYY (where X can be 1,4,2,5,3,6 and YYY is "solaris", "nt", "hpux",
    "aix", "as400") and so on)


    The setHost command sets the operating system type for the specified SAN interface.
    This provides some customization in how the SDG is presented to the particular
    operating system. If the port is 0, the change applies to all SAN connections;
    otherwise, the host type is applied only to the SAN connection on the specified
    interface. The default setting is NT. Currently, the operating system can be specified
    as NT, AIX, NetWare, HP-UX, AS/400, or Solaris. You have to put the host type
    in double quotes, as shown in Example A-2.


    > Example: A-2 setHost for FC 4 to AIX


    ```

    Router > setHost 4,"aix"

    value = 0x0

    ```


    > Note: Ports 1 and 4 belong to first FC Card, ports 2 and 5 to the second FC
    Card, and ports 3 and 6 to the third FC Card inside the SDG.


    # 3. reboot


    A reboot makes the changes effective. You can now connect to the SDG via a telnet
    session, using the Ethernet address you defined.


    # 4. fcShowDevs and fcShowNames


    The fcShowDevs command displays information about the devices that are accessible
    from each Fibre Channel interface. The display shows the luncheon that the SDG
    has assigned to each device, the SCSI Channel that the device is attached to,
    the actual SCSI ID and LUN of the device, the vendor, product, and serial number
    of the device. The fcShowNames command displays the node and port names (addresses)
    of the Fibre Channels. If the output does not meet your physical installed devices
    then execute scsiRescan and reboot. Collect the output from fcShowDevs and fcShowNames
    for further use (fcShowNames shows you the WWN, the assigned LUN, and the serial
    number of the tape drives; see Example A-3 on page 391).'
  merge: -1
