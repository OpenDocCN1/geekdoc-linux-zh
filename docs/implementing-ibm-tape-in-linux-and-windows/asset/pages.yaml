  md: '# 2.2.1 Partitioning the IBM 3582


    The IBM 3582 can be partitioned into two logical libraries if tape drives are
    installed. Each partition provides its own separate and distinct drive, control
    path, and storage slots. The input/output (I/O) slot is shared on a first-come-first-served
    basis. This type of partitioning allows heterogeneous applications to share the
    library resources independent of each other. Cartridges under library control
    are not shared between logical libraries, nor can they be moved between logical
    libraries.


    The first drive module is assigned to the first partition and the second drive
    module is assigned to the second partition. The slots in the magazine on the left
    are always partition 1, and the slots in the magazine on the right are always
    partition 2. You can designate a minimum of eight a maximum of 16 slots for partition
    1 (seven magazine slots, eight rear slots, and the I/O slot, if configured as
    a data slot). You can designate a maximum of 15 slots for partition 2 (seven magazine
    slots and eight rear slots). If you configure cleaning slots, the total number
    of slots available for both partitions is reduced (see Figure 2-6).


    Each partition can operate in one of two modes: random or sequential.


    You can configure the partition using either the Operator panel or using the IBM
    3582 Tape Library Specialist Web browser interface.


    ![](img/a48407b38d72fd58ea3627423836388a_71_0.png)


    Figure 2-6 IBM 3582 partitioning


    For a description on how to configure the logical partitions, see the IBM TotalStorage
    Tape Library Setup, Operator, and Service Guide, GA32-0458, available at:

    http://www-1.ibm.com/servers/storage/tape/resource-library.html#publications


    # 2.2.2 Partitioning the IBM 3583


    The IBM 3583 supports partitioning the library into up to three logical libraries.
    Each logical library has its own separate and distinct drives, storage slots,
    and control paths. Input/Output (I/O) slots are shared on a first, first served
    basis. The multi-partition feature (#1450 or #9450) must be installed in order
    to partition the library - it is required on all IBM 3583s that will contain an
    LTO 2 or LTO 3 drive, and for all libraries shipped before June 13, 2003. Libraries
    shipped before June 13, 2003 that do not have LTO 2 drives installed require feature
    #1450 to achieve partitioning.'
