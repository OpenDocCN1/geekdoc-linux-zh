  md: '# Additional information


    This appendix provides some additional information that is useful when implementing
    IBM LTO tape drives and libraries.


    The topics are:


    +   * Guidelines for booting SAN Data Gateway and FC hosts

    * Some performance considerations for tape devices

    * Tivoli Storage Manager tape drive and library commonly used commands

    * EMC Legato NetWorker autochanger maintenance commands

    * Using ntutil and IBMtapeutil to verify correct device attachment

    * Troubleshooting considerations'
  merge: -1
