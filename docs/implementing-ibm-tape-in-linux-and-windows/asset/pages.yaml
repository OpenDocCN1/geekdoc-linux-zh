    # 7.5 Various IBM 3592 media types and Tivoli Storage Manager


    This section describes characteristics of the 3592 cartridges and drive functions,
    and how to use them with Tivoli Storage Manager. For detailed information about
    the hardware functions mentioned here, refer to the IBM 3592 product manuals.
    Although this is not an LTO tape drive, it can coexist with the LTO drives in
    the same IBM 3584 library, and thus it is discussed here.


    # **Capacity scaling and segmentation


    The IBM 3592 supports scaling and segmentation modes on the 300 GB R/W cartridge
    to allow a capacity trade off for improved access times.


    Tivoli Storage Manager can utilize these functions by specifying the SCALEPACITY
    parameter with the **define/update devclass** command.


    A cartridge is initialized according to the SCALEPACITY parameter when it is first
    mounted to the drive. It will stay in the SCALEPACITY setting until it returns
    to the scratch state.


    Each of the SCALEPACITY parameter settings (20/90/100) will initialize the cartridge,
    as shown in Figure 7-23.


    ![](img/a48407b38d72fd58ea3627423836388a_317_0.png)


    Figure 7-23 How of the SCALEPACITY parameters initialize 3592 JA cartridges


    When SCALEPACITY is set to 100 (default), Tivoli Storage Manager will initialize
    the cartridge as a 300 GB cartridge. When set to 90, it will initialize the cartridge
    as a segmented tape. When set to 20, it will initialize the cartridge to use only
    the first 60 GB.


    Depending on the client requirements, in most cases you should use either the
    SCALEPACITY=100 for capacity oriented applications (for example, data backup)
    or SCALEPACITY=20 for access oriented applications, such as HSM.'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'There is no practical reason for using SCALACITY=90, because you cannot control
    where the data is written on the tap. After the 60 GB segment is filled, the drive
    will proceed to write on the rest of the (slower-access) tap. Each of the segmented
    parts needs to be defined as a different storage pool to fully utilize the segmented
    function, but with the it is not possible to define two storage pools for one
    volume.


    # Write Once Many (WORM)


    The IBM 3592 WORM data cartridges are designed to provide non-alterable, non-rewritable
    tape media for long-term records retention. The drive will automatically determine
    if the mounted volume is a WORM or R/W cartridge.


    To use this function, specify WORM=yes parameter in the COMMAND DEFINE/UPDATE
    DEVCLASS. Tivoli Storage Manager V5.2 or later is required.


    Because Tivoli Storage Manager can distinguish between WORM and R/W cartridges
    (assigns "media type") of 412 for WORM cartridges and 411 for R/W cartridges at
    the time of check-in, you can have both WORM and R/W cartridges in a single logical
    library by defining the device classes, with WORM=yes and the other with WORM=no.


    > Note: For the IBM TotalStorage 3494 Tape Library, you would also need to specify
    WORMSATCHCATEGORY with the DEFINE/UPDATE LIBRARY command.


    # Short-length (economy) cartridges


    Both R/W and WORM cartridges are available with the standard-length (300 GB) and
    the short-length (60 GB) format.


    The following cartridge formats are available for the 3592:


    +   - JA (ETC) 609 m 300 GB Standard R/W Tape

    - JJ (EETC) 24 m 60 GB Short R/W Tape

    - JW (EWTC) 609 m 300 GB Standard WORM Tape

    - JR (EEWTC) 246 m 60 GB Short R/W Tape


    For a JA cartridge, define the device class as below; you have the option to specify
    the SCALACITY parameter:


    ```

    DEFINE devclass_name DEVTYPE=3592 FORMAT=3592/3592/crive \ LIBRARY=library_name
    SCALACITY=20/90/100

    ```


    For JJ cartridges, define the device class as below:


    ```

    DEFINE devclass_name DEVTYPE=3592 FORMAT=3592/3592/crive \ LIBRARY=library_name

    ```


    For JW and JR cartridges, define the device class as below:


    ```

    DEFINE devclass_name DEVTYPE=3592 FORMAT=3592/3592/crive \ LIBRARY=library_name
    WORM=yes

    ```


    The SCALACITY parameter with a value greater than 100 (default) can be specified
    only with the standard-length R/W cartridge.


    When the short-length cartridges are initially defined to a storage pool, query
    volume and query stgpool will show you 300 GB (or 900 GB for compression) for
    each of the volumes defined. When the EOV (end-of-volume) is reached, query commands
    will show the actual data written for the volume.'
