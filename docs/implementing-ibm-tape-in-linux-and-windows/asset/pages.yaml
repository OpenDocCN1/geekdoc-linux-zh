    # 12.2 Device migration and coexistence


    Careful planning is recommended when introducing and mixing new generations of
    technology with Tivoli Storage Manager. This is because new format generations
    cannot be read by older devices, and conversely the old formats cannot be read
    or written by the new drivers. Tivoli Storage Manager controls the media through
    the library changer by using SCSI commands, and cannot detect the internal format
    of a cartridge. Tivoli Storage Manager has always taken the position that all
    media must be at least readable by the drives in a given library. With Tivoli
    Storage Manager V5.2 and higher, you can operate with mixed media types when the
    library is able to distinguish the different media.


    This section provides information about migration and coexistence issues for LTO
    Ultrium 1, 2, and 3 drives in one library, and with Tivoli Storage Manager V5.1
    and V5.2 or newer.


    First, we will define a few terms.


    # Mixed media libraries


    Mixed media in a Tivoli Storage Manager server describes devices using different
    device types (in the devclass) in the same logical library. LTO and 3592 are examples
    of two devices that need different device classes, but can coexist in the same
    library. Mixed media is


    # Mixed generation devices


    A mixed generation device in a Tivoli Storage Manager server describes devices
    that use the same device types (from DEFINE DEVCLASS) disparate capacities. In
    order to have mixed generation devices in the same device class, the media types
    must be distinguishable.


    > Note: In mixed generation environments, the current generation device can generally
    read and write previous generation media. This generation device can only read
    and write previous generation media. LTO Ultrium devices are an example mixed
    generation devices.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'The design specifications for Ultrium devices:


    Ultrium 1 Can read and write Ultrium 1 cartridges


    Ultrium 2 Can read and write Ultrium 1 and Ultrium 2 cartridges


    Ultrium 3 Can read and write Ultrium 2 and 3 cartridges, and can read Ultrium
    1 cartridges


    > Note: Tivoli Storage Manager V5.2.4.0 or higher provides support for the Ultrium
    3 drives, while support for Ultrium 2 is available as V5.1.6.1.


    # 7.12.1 Scenarios


    In the lifetime of a Tivoli Storage Manager server, there will be times when new
    technology or client requirements will allow the expansion of storage capacity
    through new devices. This might occur through the addition of a new library to
    an existing Tivoli Storage Manager server, or through increased capacity of a
    new or upgraded tape drive in an existing library.


    In both these instances, you need to decide whether to install the new technology
    and retire the old technology, or operate both technologies in parallel.


    For Ultrium 1, Ultrium 2, and Ultrium 3 drives, Table 7-3 on page 308 describes
    some of the migration and coexistence possibilities in one physical library, and
    also the migration from an existing library to a new LTO library, relative to
    the version of Tivoli Storage Manager used. You may need to upgrade the library
    firmware for Ultrium 2 or Ultrium 3 device support and library partitioning support.
    We will discuss each scenario in more detail.


    The table and subsequent discussion will not attempt to show all migration possibilities,
    but will cover the most obvious scenarios. For several of the configuration scenarios,
    there are two identical discussions. In general, whatever applies to the coexistence
    and migration of Ultrium 2 and 3 is also valid for the coexistence and migration
    of the older Ultrium 1 and 2.'
