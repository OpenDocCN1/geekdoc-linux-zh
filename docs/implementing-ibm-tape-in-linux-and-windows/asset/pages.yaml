- img_proc: true
  md: '# 2.1 Definitions


    In general, the sharing of devices improves the utilization of the devices and
    can reduce the total cost of ownership. Sharing of disk devices is a common practice.
    Compared to disk devices, which allow random access from different clients, tape
    drives are sequential devices that do not allow access from different clients
    at the same time. Still, sharing can improve the utilization of the tape drive;
    a tape drive is normally used 100% of the time by a single client (host), and
    there are different possible ways to share either a tape library or tape drives
    among multiple hosts. The most basic requirement in sharing any library between
    backup applications and servers is the ability to control the medium changer.
    The tape drives and media may or may not be shared, but the medium changer must
    be available to be manipulated by all of the backup applications and servers.


    # 2.1.1 Library sharing


    We differentiate between outboard library management and the multipath approach.


    # Outboard library management


    One approach is to share the library but not the tape drives. Multiple servers
    attached to a tape library can share the library robotic. Drives and cartridges
    are pooled, and a drive and cartridge pool belong to one set of servers (one server
    or multipie servers) and cannot be shared with another set of servers.


    Some applications, like IBM Twoli Storage Manager use the name “library sharing”
    if they share drives and library. We will explain drive sharing later.


    Some technique is needed to share the library robotic. The most common way is
    to use an outboard library manager that controls the library. The library manager
    receives the commands from the attached servers, controls the resources inside
    the library, and executes the commands received from the servers. The communication
    between the library manager and attached servers normally takes place over the
    LAN using a proprietary command set.


    The tape library manager controls access to and sequencing of the medium changer.
    The medium changer is physically available to all backup and application servers.
    The IBM 3494 tape library uses this type of library sharing. For communication
    with the IBM 3494, a command set called `mtlb` must be used (see Figure 2-1 on
    page 39). Other examples are STK with ACSLS or ADIC with Scalar DLC.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_66_0.png)


    Figure 2-1 IBM 3494 tape library sharing


    The IBM 3494 tape library pools cartridges by using categories. Drives, on the
    other hand, are pooled by simply connecting them to one set of servers.


    # Multi-path SCSI medium changer library


    The disadvantage of the outboard library management is that it introduces an additional
    software layer. The IBM patented multi-path architecture eliminates this disadvantage.


    Multi-path architecture is the capability of a tape library to provide multiple
    paths to the library robotics without needing a library manager. This capability
    allows the partitioning of the physical library into several logical libraries.
    A logical partition (logical library) contains tape drives and storage slots.
    The robotic library is shared among all partitions and the tape library controls
    access and sequencing to the medium changer. All IBM LTO tape libraries, including
    the high-end IBM Storage 3564 Tape Library, offer this partitioning capability
    at no additional cost. Partitioning is available for SCSI and FC drives.


    Figure 2-2 shows the multipath design of an IBM LTO tape library. Every drive
    can have a path defined to the SCSI medium changer. The library in this example
    (Figure 2-2 on page 40) has been partitioned into three logical libraries. Each
    logical partition has two tape drives and a set of cartridge slots. All the servers
    share the library robotic, but not the drives or the cartridges.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/a48407b38d72fd58ea3627423836388a_67_0.png)


    Figure 2-2 IBM multipath architecture and logical partitioning


    This kind of partitioning uses static assigned resources. There is no sharing
    of these resources (tape drives and cartridge slots), which means servers from
    one partition cannot access tape drives or cartridges in another partition. The
    assignment of resources to the logical partitions is defined through static rules
    and must use contiguous regions. In other words, you create barriers around the
    logical library. This type of partitioning is also called first generation of
    multipath architecture.


    The second generation of multipath architecture, also called Advanced Library
    Management System (ALMS), does not have the need to partition the library using
    static rules and contiguous regions. ALMS virtualizes the affinity to physical
    resources.


    This second type of partitioning allows heterogeneous applications to share the
    library robotics independent of each other. ALMS is offered as a feature for the
    IBM 3584. For further details, see 2.3, "ALMS" on page 58.


    # 2.1.2 Homogenous drive sharing


    Because a tape drive cannot be accessed simultaneously by several servers, a mechanism
    is required to manage and control access. Currently, there are different solutions
    available that allow some kind of tape drive sharing. The most common way is to
    do a homogenous drive sharing. Homogeneous means that one host takes care of the
    access control, and allows other servers that are running the same application
    to share the tape drives. All servers access the medium changer through the master
    such as multiple IBM Tiولي Storage Manager servers communicating through one IBM
    Tiولي Storage Manager Library Manager'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'server. The master server controls physical access (such as mount and demount
    cartridges) and sequencing to the medium changer (see Figure 2-3).


    The tape drives appear to each server as locally attached devices. When a server
    requests a tape to be loaded for a tape operation, the server contacts the master
    with the request. The master server mounts the tape and passes control to the
    requesting server. The server reserves (SCSI reserve) the same drive to itself
    (to ensure that no other server can access the tape drive and overwrite data).
    When the operation is complete, the server unloads the cartridge, releases (SCSI
    release) the reserve on the drive, and notifies the master to demount the cartridge.
    The master then demounts the media.


    ![](img/a48407b38d72fd58ea3627423836388a_68_0.png)


    Figure 2-3 Tivoli Storage Manager library sharing


    Such homogenous drive sharing is commonly used for LAN-free backups (see Figure
    2-4 on page 42).'
