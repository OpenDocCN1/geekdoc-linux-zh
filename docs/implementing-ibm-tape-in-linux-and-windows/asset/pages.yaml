  md: '# Implementing IBM Tape in Linux and Windows


    How to set up tape drives and libraries


    New: Ultrium3 and WORM features


    Integration with popular backup products


    This IBM Redbook follows IBM TotalStorage Libraries Guide for Open Systems, SG24-5946,
    and will help you plan, install, and configure IBM Ultrium LTO tape drives, as
    well as the IBM 3592 tape with servers running Linux and Windows 2000/2003. This
    redbook focuses on the setup and customization of these drives and libraries in
    both direct-attached SCSI and SAN configurations.


    Part 1 describes how to configure the drives and libraries, and also covers basic
    installation and administration. It explains the concept and usage of the Advanced
    Library Management System (ALMS) and virtual I/O with the IBM TotalStorage 3584
    Tape Library.


    Part 2 documents how to use these products with popular backup applications, including
    IBM Tivoli Storage Manager, BakBone NetVault, Arkeia, and EMC Legato NetWorker.


    This redbook will help IBM personnel, Business Partners, and clients to better
    understand and implement the IBM Ultrium LTO product line and also the IBM 3592
    tape drive in Windows and Linux environments.


    ![](img/a48407b38d72fd58ea3627423836388a_485_0.png)


