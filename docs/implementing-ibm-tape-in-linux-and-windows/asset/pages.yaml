  md: '# IBM 3584 high availability


    The IBM 3584 already provides many high availability options, as described in
    IBM TotalStorage Tape Libraries Guide for Open Systems, SG24-5946.


    By using control path failover, you can achieve a fully redundant configuration,
    as shown in Figure 3-63 on page 119.


    You should also consider your infrastructure and attach the additional control
    paths on redundant components including:


    +   * SAN switch

    * SAN fabric

    * Server HBA


    If you have a multi-frame configuration, enable the additional control paths on
    a different frame, that you can still use your library if the AC power for the
    first frame is lost. In Figure 3-63 on page 119, the second control path is enabled
    on the second frame, and goes over a separate SAN switch and fabric (there is
    no interswitch link between these switches) to a second HBA. You can still work
    with the library if any one of these conditions occurs:


    +   * AC power is lost on the first frame.

    * Drive one in the first frame is down.

    * The FC cable between the drive and switch or switch and HBA is broken.

    * One switch fails.

    * One SAN fabric is down.

    * One HBA is broken.


    ![](img/a48407b38d72fd58ea3627423836388a_145_0.png)'
