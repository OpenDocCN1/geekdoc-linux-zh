  md: '# Data path failover and load balancing


    Data path failover exclusively supports native Fibre Channel Ultrium 3 or Ultrium
    2 drives in the IBM 3583 IBM tape device driver for AIX, Linux, and Solaris. Load
    balancing exclusively supports native Fibre Channel Ultrium 3 or Ultrium 2 drives
    in the IBM 3583 the IBM tape device driver for AIX and Linux (it is not supported
    for Solaris).


    Data path failover provides a failover mechanism in the IBM device driver, so
    that you can configure multiple redundant paths in a SAN environment. If a path
    or component fails, the failover mechanism is designed to automatically provide
    error recovery to the retry operation using an alternate, preconfigured path without
    aborting the job in progress. This allows you flexibility in SAN configuration,
    availability, and management.


    When accessing a data drive configured with multiple host ports, the IBM device
    driver automatically selects a path through the host bus adapter (HBA) that has
    the fewest open devices, and assigns that path to the application. This autonomic
    self-optimizing capability load balancing support is designed to optimize resources
    for devices that have physical connections to multiple HBAs in the same machine.
    The device is designed to dynamically track the usage on each HBA as applications
    open and close devices, and balance the number of applications using each HBA
    in the machine. This may help optimize HBA resources and improve overall performance.
    Further, data path failover provides autonomic self-healing capabilities similar
    to control path failover, with transparent failover to an alternate data path
    in the event of a failure in the primary host-side path.


    Data path failover and load balancing for Ultrium 3 drives in all supported operating
    environments requires optional feature code 1681 and the control path failover
    feature code 1680. Data path failover and load balancing for Ultrium 2 drives
    in an AIX environment requires the control path failover feature code 1680 but
    do not require the optional feature code 1681; in non-AIX environments, the control
    path failover feature code 1680 and an RPQ are required.


    # Remote Management Unit


    A Remote Management Unit (RMU) comes standard in every IBM 3583. The RMU provides
    an Ethernet port, so that the library can be configured as a TCP/IP device in
    the network. The library status can be sent to the network as Simple Network Management
    Protocol (SNMP) traps. The TotalStorage Ultrium Specialist enables network access
    (via Web browser) the library for more detailed status and control. All library
    operator panel functions can be accessed using the IBM Ultrium Tape Library Specialist.


