  md: '# Media compatibility


    Figure 1-2 depicts the media compatibility characteristics for the three generations
    of Ultrium tape.


    # IBM Ultrium 1,2, 3 and 3 WORM Compatibility


    ![](img/a48407b38d72fd58ea3627423836388a_33_0.png)


    Figure 1-2 Ultrium generation media compatibility


    # Ultrium 1


    The Ultrium 1 Tape Drive is not compatible with (cannot read or write) the cartridges
    of its successors, the Ultrium 2 and Ultrium 3 Tape Drive. Cartridge compatibility
    for the Ultrium 1 Tape Drive is as follows:


    +   - Reads and writes Ultrium 1 format on Ultrium 1 cartridges


    # Ultrium 2


    The Ultrium 2 Tape Drive is compatible with the cartridges of its predecessor,
    the Ultrium 1 Tape Drive. Cartridge compatibility for the Ultrium 2 Tape Drive
    is as follows:


    +   - Reads and writes Ultrium 2 format on Ultrium 2 cartridges

    - Reads and writes Ultrium 1 format on Ultrium 1 cartridges

    - Does not write Ultrium 2 format on Ultrium 1 cartridges

    - Does not write Ultrium 1 format on Ultrium 2 cartridges


    # Ultrium 3


    The Ultrium 3 Tape Drive is compatible with the cartridges of its predecessors,
    the Ultrium 2 and Ultrium 1 Tape Drive. Cartridge compatibility for the Ultrium
    3 Tape Drive is as follows:


    +   - Reads and writes Ultrium 3 format on Ultrium 3 cartridges

    - Reads and writes Ultrium 2 format on Ultrium 2 cartridges

    - Reads Ultrium 1 format on Ultrium 1 cartridges

    - Does not write Ultrium 3 format on Ultrium 2 cartridges

    - Does not write Ultrium 2 format on Ultrium 3 cartridges'
