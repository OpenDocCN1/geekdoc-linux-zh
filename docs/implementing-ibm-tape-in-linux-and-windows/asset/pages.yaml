    # 4.4.4 Setting up path failover on Linux


    The Linux IBMtape device driver alternate path support will configure multiple
    physical control paths to the same logical library within the device driver and
    provide automatic failover to an alternate path when a permanent error occurs
    on one path. This is transparent to the running application.


    For example, consider a simple multipath connection that connects two Host Bus
    Adapters (HBAs), which are connected to a library with two control ports. The
    first HBA is connected to the first control port, and the second HBA is connected
    to the second control port drive. This connection provides two physical control
    paths to the same library for redundancy.


    When the HBA device drivers are loaded into the running system, each HBA detects
    a control path to the same library, and logical devices can be created (for example,
    /dev/ibmChanger0 and /dev/ibmChanger1) by the IBMtape daemon or IBMconfig script.
    Each device can open and use one logical device at a time, either IBMChanger0
    or IBMChanger1, because they report the same physical device. Without the IBMTape
    alternate path support, if an application opens IBMChanger0 and a permanent path
    error occurs (because of an HBA, cable, or drive control port failure, for example),
    the application fails. It is possible to'
