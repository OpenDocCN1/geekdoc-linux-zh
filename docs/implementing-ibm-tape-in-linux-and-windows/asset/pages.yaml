- img_proc: true
  md: 'All of the tape devices are available to the Ultrium 2 device class, but only
    Ultrium 3 devices are available to the Ultrium 3 device class. Tivoli Storage
    Manager will ensure Ultrium 3 media will only be loaded into Ultrium 3 devices
    for reading and writing. Ultrium 2 media will be read from or written to by all
    the Ultrium 2 and 3 devices.


    # Tip: MOUNTLIMIT


    For read and write tape mounts, Tivoli Storage Manager will select Ultrium 2 drives
    for Ultrium 2 media first. If no Ultrium 2 devices are available, an available
    Ultrium 3 drive will be selected for the Ultrium 2 media. To prevent the case
    where all Ultrium 3 drives are loaded with Ultrium 2 media (leaving no drives
    to read/write Ultrium 3 media), set the DEVCLASS parameter MOUNTLIMIT appropriately.
    For example:


    +   - MOUNTLIMIT can be set to the number of Ultrium 2 drives in the library for
    the Ultrium 2 devclass, so it will not use Ultrium 3 drives at all.


    +   - MOUNTLIMIT can be set to the number of Ultrium 2 drives plus half the number
    of Ultrium 3 drives. This is a compromise position to allow good drive utilization,
    but reserve some Ultrium 3 drives for Ultrium 3 media.


    You should define a suitable MOUNTLIMIT that works for your environment.


    In Tivoli Storage Manager V5.1, we would have to separate the physical Ultrium
    device types into separate logical libraries and device classes. Therefore, one
    Tivoli Storage Manager with both Ultrium 1 and 2 drives would have to define at
    least two logical libraries, and the physical library would have to support library
    partitioning. Again, Tivoli Storage Manager will ensure that only Ultrium 2 media
    are loaded in the Ultrium 2 drives, while Ultrium 1 media can be read and written
    by both Ultrium 1 and 2 drives.


    # Scenario 3


    As of Tivoli Storage Manager V5.2.4, Ultrium 3 drives are supported, and any combination
    of Ultrium 1, 2, and 3 drives can be used in one. As discussed in scenario 2,
    Ultrium 3 drives can read and write Ultrium 2 media. Similarly, the Ultrium 2
    drives can read and write Ultrium 1 media.


    Although Ultrium 3 drives can read the Ultrium 1 media (but cannot write to it),
    should be to avoid attempted writing. Set the MOUNTLIMIT option for the Ultrium
    1 devclass to less than the sum of Ultrium 1 and 2 drives (see tip above), preventing
    the Ultrium 1 media from being loaded in the Ultrium 3 drives. The Ultrium 1 media
    will still be available for normal use by the Ultrium 1 and 2 drives.


    Alternatively, the migration path will be to have all Ultrium 1 media set to read-only
    for use by all drives, and the Ultrium 1 drives and media eventually phased out
    of the library


    # Scenario 4


    Replace all Ultrium 2 drives with Ultrium 3 drives, using the existing Ultrium
    2 media and installing additional Ultrium 3 media:


    +   -1. Delete the Ultrium 2 device DRIVE and PATH entries and define new DRIVE
    and PATH entries for the Ultrium 3 devices.


    +   -2. The replacement of the Ultrium 2 drives with Ultrium 3 drives will also
    affect the Tivoli Manager device class parameter *format*, which should now be
    set to ultrium3c.'
