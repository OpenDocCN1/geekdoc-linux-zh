    Hit <enter> to continue...


    # Save the Library logs with the IBM Ultrium Tape Library Specialist


    You may also use the IBM Ultrium Tape Library Specialist to download the library
    logs. If you are a backup application that uses its own driver for the medium
    changer, you cannot use NTUTIL or IBMtapeautil; you have to use the IBM Ultrium
    Tape Library Specialist. Compared to IBMtapeautil, where you just download one
    log for the whole library, if you use the IBM Ultrium Tape Library Specialist,
    you have to download several logs. For the IBM 3581 2U, you can save logs of the
    autoloader and the drive. Go to options in the IBM Ultrium Tape Library Specialist,
    where you upload the logs for the host. For the IBM 3582 and 3583, you have to
    download four logs from the Diagnostics section (Library Command Log, Library
    Error Log, RMU Support Log, and RMU Error Log (see Figure C-1).


    ![](img/a48407b38d72fd58ea3627423836388a_463_0.png)


    Figure C-1 IBM 3582 Ultrium Tape Library Specialist: Download logs


    For the IBM 3584, you have to download several logs under Service -> Download
    Logs, of which the Error Log of Accessor Controller Card is the most important
    (see Example C-2 on page 437).'
