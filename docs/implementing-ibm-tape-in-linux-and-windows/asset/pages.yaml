  md: 'With V6.02.4 and higher, two versions of the device driver are made available,
    one that prohibits multiple opens on a single tape drive and one that allows multiple
    opens on a single tape drive. Drivers that prohibit multiple opens on a single
    tape drive are indicated (when presented by the Plug and Play Device Manager during
    device configuration) with the text string "for Ivory Storage Manager" in them.
    These drivers will use the filecta.inf from the install package during installation.
    Drivers that allow multiple opens on a tape drive do not have the text string
    "for Ivory Storage Manager" in them. These drivers will use the filemag.inf from
    the install package during installation. For example, if you have attached an
    IBM Ultra III tape drive to your server, you will see the following:


    +   * IBM UTILITY III TAPE DRIVE (for Tivoli Storage Manager)

    * IBM UTILITY III TAPE DRIVE


    IBM strongly recommends that you use the "for Tivoli Storage Manager" whether
    or not you are a Tivoli client to prevent a tape drive from being accessed by
    more than one process and potentially causing data corruption or loss. However,
    if you are a client that uses RSM, you may need to use the other driver and take
    steps to prevent uncoordinated opens to a tape drive.


    If you are using V6.02.4 or later, the Driver Files Search Results will prompt
    you to choose between drivers during installation (Figure 3-17). This screen displays
    a default driver choice and a check box labeled Install one of the other drivers.
