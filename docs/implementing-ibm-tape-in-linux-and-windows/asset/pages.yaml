    **Note:** Always check the Web site for the most current, detailed, and accurate
    information.


    # ### 1.2.2 ISV storage management software


    Although operating systems provide utilities, such as **da**, **tar**, and **cpio**,
    to perform basic read/write operations for tape drives, in cases a storage management
    software package is used. These packages are designed to provide sophisticated
    capabilities to manage tape drives and libraries. They are available from companies
    known as Independent Software Vendors (ISVs). We discuss some of the most popular
    applications in Part 2, “LTO libraries and backup software” on page 243.


    IBM publishes information about ISV storage management applications that are certified
    with LTO Ultrium devices and on which operating system are available at the Web
    site:


    ```

    http://www.ibm.com/servers/storage/tape/lto_ito_isv.html

    ```


    You should also check with the ISV for detailed support information.'
