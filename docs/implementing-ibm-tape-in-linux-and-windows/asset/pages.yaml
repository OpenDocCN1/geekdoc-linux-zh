  md: '# 8.5 Inventory


    Sometimes a manual inventory is required, for example, if you need to open the
    IBM 3583 or 3584 library device and move the cartridges, or extract them for maintenance
    or other reasons. Remember to start an inventory of the library from the NetWorker
    administration interface after you put the library online. Select Inventory from
    the Autochanger Operations panel (Figure 8-15).


    # 8.6 Some additional settings


    The default values for the library are suitable for most environments. But if
    you have load and unload problems, then review and adjust the following settings.


    +   - Unload Sleep


    Specifies the number of seconds an autochanger sleeps before unloading a volume
    and moving the volume from the device to a slot. The NetWorker software uses this
    attribute for all autochhangers when a volume is unloaded.


    +   - IBM LTO 1 Drives have a nominal unload time of 18 seconds. Therefore, it
    may be necessary to increase the unload sleep to 18 seconds or more.


    +   - IBM LTO 2 Drives have a nominal unload time of 15 seconds. Therefore, it
    may be necessary to increase the unload sleep to 15 seconds.


    ![](img/a48407b38d72fd58ea3627423836388a_364_0.png)


    Figure 8-15 Display of cartridges after labeling'
