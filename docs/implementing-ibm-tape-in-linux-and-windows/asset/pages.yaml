    `http://web1.legato.com/cgi-bin/catalog?sf=Releases`


    In the following example, we show the installation of NetWorker with a SCSI point
    connection to an IBM 3583 with two drives.


    +   We installed NetWorker in the following environment, as shown in Figure 8-1:

    - Pentium server with Windows 2000 Advanced Server (2195).

    - Adatec 29160 LVD SCSI card.

    - IBM 3583 library SCSI attached. A single SCSI bus ports supports both the library
    controller and the two 3583 tape drives.

    - NetWorker Version 6.1.


