- img_proc: true
  md: '# 4.6.1 Use /etc/zfconf conf file


    First, you need to add the device map into this file. The following is an example
    of zfcp conf.

    0xf1c0 0x1:0x5500576304002733 0x0:0000000000000000:\n0xf1c1 0x1:0x5500576304002733
    0x0:0001000000000000


    The zfcp driver uses the device map module to recognize a physically attached
    tape device. The map takes the following format:

    map="devno:port-scsi-id:<wwn>:<unit-scsi-lun>:<fcp-lun>;


    Where:


    +   - devno The device of the HBA (16 bits, see /proc/subchannels). It is 0xf1c0
    or 0xf1c1 in the example.

    - port-scsi-id: The Linux SCSI ID assigned to the Fibre Channel port of the SCSI
    target device (32-bit, must not be 0, and must be unique one-to-one mapping for
    each World Wide Port Name). It is 0x1 in the example.

    - wwwn: The World Wide Port Name that identifies the Fibre Channel port of the
    SCSI target device (64-bit). It is 0x5005076304002733 in the example.

    - unit-scsi-lun: The Linux Logical Unit Number (32-bit). It is 0x0 in the example.

    - fcp-lun: The Logical Unit Number associated with the SCSI target device (64-bit).
    In the above example, 0x0000000000000000 is the Logical Unit 0, and 0x0001000000000000
    is the Logical Unit 1.


    We recommend, for tape attachment, that each LUN be associated with a unique devno.
    If you use the same devno numbers for several logical units, you should ensure
    that each <unit-scsi-lun> is unique.


    After /etc/zfconf is created, run the following commands:

    >mk_initrd

    >zip


    Reboot the system. After it is booted up, your tape device should be shown in
    the /proc/scsi/scsi file.4.3.3, "Identifying and accessing the LTO device" on
    page 192 describes a number of different ways of identifying an LTO device.


    # 4.6.2 Modify the /etc/modules.conf file


    You may add tape device mapping into /etc/modules.conf if you do not want to use
    /etc/zfconf. The following example demonstrates the zfcp configuration in /etc/modules.conf:


    ```

    options zfcp map="

    0xf1c0 0x1:0x5500576304002733 0x0:0000000000000000:\n0xf1c1 0x1:0x5500576304002733
    0x0:0001000000000000"

    ```


    The map arguments are the same as the ones listed in the /etc/zfconf.


    After modifying /etc/modules.conf, save and close it. Then run the following commands:

    >depmod -A

    >modprobe zfcp


    This will install the zfcp device driver and all of its prerequisite kernel modules.'
  merge: -1
