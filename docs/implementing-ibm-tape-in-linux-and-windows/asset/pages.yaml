    # Using mtlib in the IBM 3584


    The mtlib program facilitates communication between the IBM 3584 and the IBM 3494,
    as well as the IBM TotalStorage Virtual Tape Saver (VTS).


    The mtlib program is a command-line interface originally designed to control the
    IBM 3494. It is shipped with a 3494 device controller, similar to the way the
    tapeutil utility comes with the SCSI tape driver. The mtlib program provides an
    interface from the server to a 3494 Tape Library, and to the virtual tape drives
    and cartridges within an attached VTS.


    The mtlib program has been enhanced to work with SCSI tape libraries, such as
    the IBM 3584. Some clients have written mtlib scripts to work with the IBM 3494.
    If a client with an IBM 3494 decides to migrate to the IBM 3584, the mtlib enhancement
    will ease the migration.


    Existing client scripts use mtlib require no changes or changes, depending on
    the functions of the IBM 3494 that are used. For example, there is no category
    in SCSI tape libraries, or that any mtlib command that references categories might
    need to be changed.


    For a complete description of the mtlib program and command syntax, see the IBM
    TotalStorage Tape Drivers Instructions and User''s Guide, GC35-0154.


    # SMI-S Support


    The SMI-S Agent for Tape is designed to be compliant with the Storage Management
    Initiative - Specification. The 3584 Tape Library can use the Storage Management
    Initiative - Specification (SMI-S) to communicate in a SAN environment.


    To communicate with storage devices in a SAN, management software uses other software
    known as the Storage Management Initiative - Specification (SMI-S) Agent for Tape.
    You must install the SMI-S Agent for Tape on an Intel® machine that runs the SUSE
    Linux Server operating system. The SMI-S Agent for Tape communicates using the
    Web-Based Enterprise Management (WBEM) protocol, which allows management software
    to communicate with the IBM 3584.


    The SMI-S Agent for Tape is designed to be compliant with the Storage Management
    Initiative - Specification (SMI) that was launched by the Storage Networking Industry
    Association (SNIA). The SMI-S ensures a secure and reliable interface that allows
    storage management systems to identify, classify, monitor, and control physical
    and logical resources in a Storage Area Network (SAN). The interface is intended
    as a solution that integrates the various devices to be managed in a SAN and the
    tools used to manage them. The SMI-S was developed to address the problems that
    creates a management interface protocol for multivendor storage networking products.
    By enabling the integration of diverse multivendor storage networks, the initiative
    is able to expand the overall market for storage networking technology.


    For detailed information about SMI-S, see the IBM TotalStorage SMI-S Agent for
    Tape Installation Guide, GC35-0512.'
