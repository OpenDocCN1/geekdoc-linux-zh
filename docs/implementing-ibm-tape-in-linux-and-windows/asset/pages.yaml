    \ 253\nAttached Changer Devices:\nNumber SN HBA FO Path\n0 ULT3583-TL IBM1234567\
    \ QLogic Fibre Channel 2200 Primary\n1 ULT3583-TL IBM1234567 QLogic Fibre Channel\
    \ 2300 Alternate\n2 ULT3583-TL IBM1234567 QLogic Fibre Channel 2300 Alternate\n\
    ```\n\nAlternatively, you can display the primary and alternate path configuration\
    \ for any device by running the following command:\nIBMtape -f /dev/IBMchanger\
    \ path\nIBMchangerx is the logical name of any device.\n\nAfter the alternate\
    \ path support is enabled, it remains set until the IBMtape driver is reloaded\
    \ with the alternate_pathing driver parameter set to OFF. The alternate path setting\
