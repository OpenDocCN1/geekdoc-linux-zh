  md: '# Basic IBM tape setup for Linux


    This chapter provides detailed information about the basic setup of the IBM tape
    drives and libraries on Linux on Intel and zSeries platforms. This includes:


    +   * Linux native tape driver usage

    * IBM tape device driver installation

    * Host Bus Adapter driver configuration


    At the end of this chapter, you should be able to understand and implement the
    tasks required to:


    +   * Install the required device drivers.

    * Verify and use the IBM tape device.

    * Configure the required Host Bus Adapter drivers.'
  merge: -1
