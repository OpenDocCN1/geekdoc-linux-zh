- img_proc: true
  md: '+   Zoning configuration is generally a function of the switch devices. For
    an IBM 2109/2005, zoning can be configured and administered by telneting to the
    switch or using the Web browser IBM TotalStorage Specialist.


    +   Devices can belong to more than one zone.


    +   Zoning can be administered from any switch in the fabric.


    +   Changes that are configured to one switch automatically replicate to all switches
    in the fabric; if a new switch is added to an existing fabric, all zone characteristics
    are automatically applied to the new switch. Because each switch stores zoning
    information, zoning ensures a high level of reliability and redundancy.


    For detailed information about setting up zoning, please refer to the SAN Redbooks
    cited in the introduction to this chapter, or to your switch documentation.


    # ## 5.2.2 Types of zoning


    There are two types of zoning used: hardware zoning and software zoning.


    # ### Hardware zoning


    Hardware zoning is based on the physical fabric port number. It can be implemented
    in the following configurations:


    +   One-to-many


    +   One-to-many


    +   Many-to-many


    # ### Disadvantage


    The zoning configuration can become unusable if the device is connected to a different
    port, since hardware zoning relies on each device being connected to a specific
    port.


    # ### Advantage


    Hardware zoning works independently of influence from other sources, such as HBA
    firmware. The switch hardware ensures that there is no data transfer between unauthorized
    zone members. However, devices can transfer data between ports within the same
    zone. Consequently, hardware zoning provides the greatest security possible. Use
    it zoning also has a low impact on the routing performance.


    If you use hardware zoning, you must carefully document and update your SAN fabric.
    Careful documentation is always a necessary task for managing a SAN.


    # ### Software zoning


    Software zoning is implemented within the Simple Name Server (SNS) running inside
    the fabric switch. In a soft zone, at least one zone member is specified by WWN,
    which is a globally unique 8-byte number. When a device logs in, it queries the
    name server for devices within the fabric. If zoning is in effect, only the devices
    in the zone(s) are returned. Other devices are hidden from the name server query
    reply.


    The members of a zone can be defined with:


    +   Node WWN (WWNN)


    +   Port WWN (WWPN)'
