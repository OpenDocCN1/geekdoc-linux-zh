  md: '# 8.1 EMC Legato NetWorker overview


    EMC Legato NetWorker provides backup, recovery, and other storage management services.
    It is supported on many different client and server platforms as well as popular
    applications (for example, Oracle, Exchange, and so on). NetWorker products for
    different operating systems are interoperable, and provide flexibility in designing
    a storage management setup. For detailed product information, visit the NetWorker
    Web site:


    ```

    http://www.legato.com/products/networker/networker.htm

    ```


    NetWorker uses a client/server architecture, organized around a data zone, and
    is comprised of three functions: server, client, and storage node. A data zone
    is a single NetWorker server with one or more storage nodes.


    +   - NetWorker server


    The NetWorker Server software provides control and scheduling for NetWorker operations.
    The NetWorker Server defines the clients, devices, and media used by the NetWorker
    Server, defines the schedules for backups and other operations, and monitors all
    the NetWorker operations.


    +   - NetWorker Client


    The NetWorker Client provides recover and on-demand backup functionality, and
    it communicates with the NetWorker Server. The NetWorker Client software is installed
    on all computers that will back up to the NetWorker Server.


    +   - NetWorker Storage Node


    Data can be backed up to devices either directly attached to a server or to a
    storage node. A storage node controls storage devices, such as tape drivers, autochangers,
    and silos, but does not control the other configuration that a server performs.


    # 8.1.1 EMC Legato NetWorker and IBM LTO interoperability


    Be sure that EMC Legato NetWorker is supported in your specific environment. You
    have to cross check on both the IBM and NetWorker Web sites to verify this:


    ```

    http://www-1.ibm.com/servers/storage/tape/lto_is.html

    http://www.legato.com/websupport/compat_guides

    ```


    Special note: NetWorker and IBM 3584


    The IBM 3584 is a SCSI Library with tape drive SCSI element addresses for the
    tape drives. Because of the wo that NetWorker configures tape libraries, special
    handling is required when installing with a multiframe 3584 where the drives are
    not installed in a contiguous sequence. Preferably, you should first install 12
    drives in the first frame before installing additional drives in the second frame.
    The IBM 3584 is not set up in this manner, the NetWorker commands sjirdtag, sjirelem,
    inquire, and JB_config will return a list of drives that include tape devices
    where no physical devices are present. When configuring the tape library with
    jconfig, you will have to define some dummy devices, as described in "Configuring
    dummy devices (non-contiguous libranes only)" on page 326.'
  merge: -1
  pgno: 345
