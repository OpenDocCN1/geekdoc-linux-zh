    \ control paths\n\nOnce you load the IBMtape device driver with the alternate_pathing\
    \ parameter set ON, by default, all the available paths for a physical device\
    \ are enabled. If, for some maintenance reason, you need to disable a path and\
    \ do not want to fail over this path, you may run the following commands:\n\n\
    +   ▶ IBMtape -f /dev/IBMchanger path\nThis command is used to know the number\
    \ of this path is.\n▶ IBMtape -f /dev/IBMchanger disablepath number\nnumber will\
    \ be the number of the path you want to disable.\n▶ IBMtape -f /dev/IBMchanger\
    \ path\nThis command is used to make sure the path is labeled as \"disabled\"\
    .\n\nCorresponding, in the /proc/scsi/IBMchanger file, the disabled path will\
    \ be listed as Disabled under the FO path column.\n\nTo enable a path from a disabled\
    \ state, use the following command:\nIBMtape -f /dev/IBMchanger enablepath number\n\
    number will be the number of the path you want to enable."
