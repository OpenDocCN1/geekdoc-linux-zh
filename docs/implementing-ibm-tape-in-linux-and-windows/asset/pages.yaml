    Figure 2-13 IBM 3584 partitioning example


    There are two ways to partition the IBM 3584 into multiple logical libraries:


    +   - Configuring the library by using labels


    With this method, you must manually label the storage elements (storage slots
    and drives) that you want in each logical library, then select Configure Library
    to identify them to the library. With this method, you can view the boundaries
    of your logical library whenever you open the front doors. However, because a
    logical library bar code label applies to an entire column of storage slots (and
    not individual slots), this method does not allow you to choose any number of
    slots from that column.


    +   - Configuring the library by using menus


    With this method, you choose the exact number of storage elements that you want
    to be selecting them from the Advanced Configuration menu selection (or using
    the Tape Library Specialist menu). If you use this method, you do not need to
    manually label the library elements, and you can choose individual slots from
    any column. However, you have no visual indication of your logical library whenever
    you open the front doors.


    Both methods require you to take the library offline while configuring. For further
    details on setting up partitions using the Operator panel, see the IBM Total Storage
    UltraScalable Tape Library 3584 Operator Guide, GA32-0468.


