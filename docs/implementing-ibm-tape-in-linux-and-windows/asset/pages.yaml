  md: '# 3.4.2 CPF driver installation using the CPF_install.doc


    > Note: If you have driver V6.0.8.2.sys or later, you may use the instructions
    in 3.4.1, "CPF driver installation using install.exe" on page 104.


    The Control Path Failover (CPF) feature of the IBM medium changer device drivers
    provides a mechanism whereby commands send to a failing control path on a medium
    changer may fail over to a working control path. On Windows 2000 and Windows Server
    2003, the system requires two kernel-level device drivers to be running on the
    system, in addition to the medium changer driver ibmcgxx.sys (the "base" driver).
    If CPF support is not provided, the base driver will be adequate to operate the
    changer.


    One of the two additional drivers required to enable CPF support is a driver that
    will be installed automatically if the magchgrf (rather than the magchgrf) file
    is used for the base driver install. Depending on the version of the driver you
    have, you may see either or both files when unzipping. The other additional driver
    is a virtual software bus, called the Changer Bus Enumerator, The Changer Bus
    Enumerator must be installed prior to the base driver and filter driver installation.
    Because its a virtual bus, no hardware will be plugged in and Windows will not
    recognize the presence of new hardware by the standard plug-and-play protocols.
    The Control Panel''s Add/Remove Hardware feature will be used to instruct the
    system to recognize the virtual hardware. The documentation outlines the procedure
    required to install the Changer Bus Enumerator.


    Please note that minor differences may exist between the screen shots shown and
    the windows displayed by the wizard on your system. Unless otherwise specified,
    the documentation is based on the look and feel of Windows Server 2003. This is
    similar enough to Windows 2000 to eliminate confusion.


    These instructions assume that you have obtained a copy of the IBM Tape Device
    Driver (IBMTapeW32_xxxx.zip or IBMTapeW64_xxxx.zip) with CPF support and unzipped
    it into the c:\driver_install directory. Any directory on your system will work,
    but you need to specify this directory when the system prompts you for driver
    location.


    +   1. If there is an IBM medium changer device driver already installed on your
    system, you must uninstall it. Right-click My Computer, select Manage, and go
    to Device Manager. Under the subheading Medium Changers, right-click each device
    and select Uninstall. Under the subheading System devices, if there is an entry
