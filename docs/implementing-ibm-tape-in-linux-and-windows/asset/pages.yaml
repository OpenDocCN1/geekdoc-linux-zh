  md: '# LTO-TDX TAPE DRIVE FIRMWARE UPDATE AND LOG DUMP TOOL V0.03.02 03/16/2004


    This tool looks for 2 folders in the same sub-directory as the tool:


    +   1) LTO Firmware: Place new firmware files (10 maximum) into this folder.

    Make sure the firmware is compatible with your LTO drive,

    otherwise an error will display.

    If a cartridge is included, unload the cartridge before

    loading firmware, otherwise an error will display.


    +   2) LTO Dumps: When the drive dumps, two files will be placed in

    this folder, an "A" and a "B" file. Each file will have a

    time stamp name with either A or B suffix.


    > Notes:

    If the program can''t find the firmware or dump folders, it will try to create

    them. If it cannot create them it will prompt you to specify their locations.

    Be sure that there is no activity on the drive before loading firmware

    or taking a dump of the drive.


    Press any key to continue...... Press [I] to show License.


    Figure 3-125 LTO-tdx selection screen 1


    Verify the firmware you want to drive to the drive is the LTO firmware.


    Press Enter. It will scan the bus for attached LTO devices and display them (seenFigure
    3-126).


    # LTO-TDX TAPE Drive Tool


    +   2) LTO Dumps: When the drive are dumped, two files will be placed in

    this folder, an "A" and a "B" file. Each file will have a

    time stamp name with either A or B suffix.


    > Notes:

    If the program can''t find the firmware or dump folders, it will try to create

    them. If it cannot create them it will prompt you to specify their locations.

