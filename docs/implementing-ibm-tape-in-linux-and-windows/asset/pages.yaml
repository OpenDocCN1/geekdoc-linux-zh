  md: '# Troubleshooting


    In this section, we present an approach to troubleshooting problems with LTO drives
    and libraries.


    # Collect real-time failure information


    If you encounter a problem, it is helpful to save all available error information
    as soon possible to provide it to the IBM Support Center for failure analysis.
    Here are the elements to save; the following are details of how to save each element.


    +   - Save the Library logs.

    - Save the Drive logs (Drive dump).

    - Force a Drive dump and save the Drive dump again.

    - Save your application log.

    - Save the operating system error log.


    # Save the Library logs on Windows with ntutil


    To save the Library logs on Windows with ntutil:


    +   1. Start NTUTIL.

    2. Select 1: Manual test.

    3. Select 8: Library Mode.

    4. Select 1: Set device special file.

    5. Open the device with Option 20.

    6. Select 81: Read Dump and choose 1 for library.

    7. Save the dump to local disk (Example C-17).


    Example: C-17 NTUTIL save library logs


    ```

    enter selection: 81

    Drive = 0, Library = 1: 1

    Enter dump name (1 to 8 characters) or return for default dump0001: libdump

    analyze() called with rc 1 err 0 (ERROR_SUCCESS) data 0

    Total elapsed time in seconds = 37.00

    Return to continue:

    ```


    # Save the Library logs on LINUX with tapeutil


    To save the Library logs on LINUX with tapeutil:


    +   - Start IBMtapeutil.

    - Select 2: Changer.

    - Select 1: Open a Device.

    - Enter the changer device name.

    - Select 70: Dump Device.

    - Save the dump to local disk (Example C-18).


    Example: C-18 Tapeutil save library logs


    Enter Selection for /dev/IBMChanger0: 70


    Enter destination filename <<enter> for dump0001.dmp>: lib_dump.lmp


    Issuing dump...

    Total dump length is 3840.

    Total number of transfers is 1.

    Transferring dump data...

    Current transfer number is 1.'
  merge: -1
  pgno: 462
- img_proc: true
