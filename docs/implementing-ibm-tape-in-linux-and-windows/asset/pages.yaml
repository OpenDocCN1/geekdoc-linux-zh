    # 7.31 Performance hints for Tivoli Storage Manager, LTO, and 3592


    Since Tivoli Storage Manager writes a record in its database of each file backed
    up, it will perform better with large file workloads than small file workloads.
    This is because of the proportion of time spent database updates and as a fraction
    of the total backup time. Therefore, to get the best performance from Tivoli Storage
    Manager on LTO and IBM 3592 drives, it is better to update the parameter TXNgroupmax
    on the server to a higher value than the default 256. This parameter controls
    how many files are transferred as a group between the client and server. Note
    that the larger the txngroupmax, the bigger the Tivoli Storage Manager database
    log needs to be.


    > Tip: Tivoli Storage Manager V5.2 has increased the maximum size for TXNgroupmax
    to 8192, and in V5.3 this is further increased to 65000. A value of 4096 or higher
    is recommended for environments that back up numerous small files, such as 10
    KB files. With Tivoli Storage Manager V5.3, this parameter may also be defined
    for the individual clients. Thus, an intermediate value, say 2048, can be set
    for the server, and the high values should be defined when registering the client.


    In the client option, also set the parameter TXNBlimit to its maximum of 2097152
    (2 GB). The parameter specifies the number of kilobytes the client program can
    buffer together in one transaction before it sends data to the server.


    To set TXNgroupmax, edit dmserv.opt on the Tivoli Storage Manager server, as shown
    in Example 7-11 on page 289. If you are using the Storage Agent for LAN-free backup,
    you should also set this parameter to the same value in the options file dsmsta.opt.
    The restart of the server process is required to enable this change (for Storage
    Agent, a restart of the Storage Agent process is required).'
