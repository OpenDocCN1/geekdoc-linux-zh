    # 7.7.2 Define path considerations


    Consider the following guidelines for mapping your SAN drives:


    +   - Define paths to all drives. Problems can occur if you do not define paths
    from the server to each drive in a library. For example, during backup operations,
    all drives that have paths can be used by the Storage Agent are backing up data.
    Backup operations will fail if you try to use other drives in a library that do
    not have defined paths. When paths are defined for each drive in a library, backup
    operations wait until the next drive is available for the transfer of data.'
