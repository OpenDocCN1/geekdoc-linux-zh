    vendors, and some applications that support the LTO family.


    # ### 1.2.1 Hardware server platforms


    The LTO products are produced on the following operating systems and servers:


    +   - IBM @iSeries™, AS/400® with OS/400®

    - IBM System p5, RS/6000, and SP with AIX and Linux

    - IBM @xSeries® and other Intel-based systems (Windows NT®, 2000, and 2003)

