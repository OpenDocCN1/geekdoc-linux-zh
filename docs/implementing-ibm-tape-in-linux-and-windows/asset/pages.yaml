  md: '# Expiration and retention policies for NDMP backup


    When an NDMP backup is performed, the Tivoli Storage Manager server checks if
    a valid image backup exists. If it does not, a full image backup is performed.
    The Tivoli Storage Manager server will also identify any older backup versions
    that exceed the allowed number of versions according to the management class policies.
    This is done from oldest to most recent without regard to whether the versions
    represent full or differential. Excess versions are marked for expiration. During
    expiration processing, if the server detects a full backup that is marked for
    expiration, it checks to see if that version has any dependent differentials.
    If so, the full backup is not deleted even though it has been marked for expiration.
    An example should make this process clearer.


    Let us set VEREXISTS in the backup copy group to 3 and we run a series of backups
    as follows:


    +   - Day 1: Full backup

    -* Day 2: Differential backup

    -* Day 3: Full backup

    -* Day 4: Differential backup

    -* Day 5: Differential backup


    Each backup operation creates a version in the Tivoli Storage Manager database.
    After day 4s differential backup, therefore, we have a total of four versions,
    but the policy settings allow us only three. Therefore, the day 1 backup, being
    the oldest, will be marked for expiration. However, the first backup cannot be
    physically expired because the day 2 differential backups depends on it. This
    is in order to restore the day 2 backup, we would have to restore the day 1 full
    and then the day 2 differential. A full backup will never be expired as long as
    it has has dependent differentials.


    However, after day 4 it is no longer possible to restore just the day 1 backup.
    In this case, day 4 represents the ACTIVE backup, with day 2 and day 3 being INACTIVE
    backup versions. On day 5 when another differential backup is made, both the day
    1 and day 2 backups will be marked for expiration. At this stage, as shown in
    Figure 7-26 on page 302, the day 5 backup represents the ACTIVE backup, day 3
    and day 4 backups are INACTIVE and the day 1 and day 2 backups are deleted.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 7.9 Tivoli Storage Manager and redundant library control paths


    The IBM 3582, 3583, and 3584 allow you to enable multiple control paths to a single
    logical library. Support is provided under AIX, Linux, HP-UX, Windows, and Solaris
    for both SCSI and Fibre Channel attachments when the IBM tape device driver is
    used. This provides improved redundancy to the libraries. If there is only a single
    control path available, a failure in this path would result in loss of communication
    with the library. Therefore, multiple control paths eliminate this single point
    of failure. See also 3.4, "Control Path Failover" on page 103 and 4.4.4, "Setting
    up control path failover on Linux" on page 211 for further details in particular
    environments.


    Tivoli Storage Manager cannot automatically handle multiple control paths to one
    logical library on its own; however, it can work with automatic control path failover
    for the operating system. This feature provides an automatic failover to an alternate
    control path when the primary control path fails. An error on the control path
    would have no effect on your Tivoli Storage Manager.


    Figure 7-27 on page 303 shows an IBM 3584 with two drives. Both drives have the
    control path enabled.


    ![](img/a48407b38d72fd58ea3627423836388a_329_0.png)'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Server 3584


    ![](img/a48407b38d72fd58ea3627423836388a_330_0.png)


    Figure 7-27 IBM 3584 with multiple control paths enabled


    If you enable multiple control paths on your IBM 3582, 3583, or 3584, you will
    see several SCSI changer devices with primary and alternate paths. For Linux,
    in this example, you can check if the IBMtape driver has recognized multiple control
    paths for your library by reading the /proc/scsi/IBMchanger file. If your library
    lists Primary or Alternate the FO Path, as in Example 7-16, then you have successfully
    enabled the control path failover feature for your library. If IBMtape is loaded
    into kernel memory, the first local medium changer device IBMtape sees in the
    system will be the primary path for that medium changer. The other local medium
    changers that are attached for the same medium changer will be configured as alternate
    paths. The device driver supports up to 16 physical paths for a single device.


    Example 7-16 An of /proc/scsi/IBMchanger file


    ```

    [@saab root]# cat /proc/scsi/IBMchanger

    IBMtape version: 1.41

    IBMtape major number: 253

    Attached Devices:

    Number Model SN HBA FO Path

    0 ULT3583-TL IBM123456 Qlogic Fibre Channel 2200 Primary

    1 ULT3583-TL IBM123456 Qlogic Fibre Channel 2300 Alternate

    2 ULT3583-TL IBM123456 Qlogic Fibre Channel 2300 Alternate

    ```


    Whether you use automatic control path failover or not, you should only configure
    the second control path, then you will get a second library.


    If a failure occurs on the first control path (IBMchanger0), and we do not use
    automatic control path failover, we could switch to the second path (IBMchanger1)
    with:


    ```

    UPDATE PATH server_name library_name SRTYPE=SERVER DESTYPE=LIBRARY DEVICE=/dev/IBMchanger1

    ```


    With automatic control path failover enabled, we would not need to perform the
    UPDATE PATH command, since failover happens automatically.'
