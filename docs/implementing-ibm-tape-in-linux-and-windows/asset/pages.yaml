  md: '# Access control by channel zoning


    Select Controls → Access Options → Channel Zoning (see Figure A-17) to configure
    zones to restrict access between SAN channels and SCSI channels. The default settings
    allow all SAN connections to access all SCSI channels.


    ![](img/a48407b38d72fd58ea3627423836388a_427_0.png)


    Figure A-17 Select Channel Zoning


    When you select this option, a pop-up window displays the channel zoning settings.
    Figure A-18 shows the settings for a gateway that has two SAN connections and
    four SCSI channels. Currently only SCSI Channel 3 and SCSI Channel 4 are assigned
    to FC 1 and FC 2. Clear the check marks or put in additional check marks by clicking
    in the boxes to create restricted zones for the desired SAN connections and SCSI
    channels. All combinations are possible.


    ![](img/a48407b38d72fd58ea3627423836388a_427_1.png)


    Figure A-18 Channel Zoning Settings


    # Access control by Virtual Private SAN (VPS)


    Channel zoning provides access control between ports. While channel zoning provides
    control of paths between host adapters and SCSI storage ports, it does not limit
    access to specific devices (LUNs) within the storage system. Virtual Private SAN
    (VPS SAN) provides “LUN masking” to limit access between host adapters and LUNs
    attached to SAN Data Gateway ports. The SDG Specialist provides the tools to define
    SDG channel zoning,'
  merge: -1
  pgno: 427
- img_proc: true
  md: 'the VP SAN LUN-masking, and control that host systems have access to specific
    storage devices.


    VPS is applicable mainly in disk environments, so we do not discuss it further
    here. It is also not available for the Integrated SAN Data Gateway Module for
    the 3583. You can find more information about VPS in IBM TotalStorage: Implementing
    an Open IBM SAN, SG24-6116.'
  merge: -1
