  md: '# 3.7.4 Emulex HBA driver configuration


    The Emulex Multi-Protocol Port Driver for Windows has many options that can be
    set to provide different behaviors. The options can be set using the configuration
    utility (elcfg) included in the downloaded .zip file.


    To start the program, select Start -> Programs -> Emulex -> elcfg


    For our environment, we have set the parameters listed below. Normally this would
    be all you need to set up the IBM tape library with the Emulex HBA.


    # Enable FCP-2 recovery


    Check the box Enable FCP-2 Recovery to enable FCP tape support (Figure 3-97).


    # Disable target reset for tape devices


    Check the box Disable Target Reset for Tape Devices so the driver does not send
    a Target Reset command to tape drives and media changers in response to a SCSI
    Bus reset (Figure 3-97).


    ![](img/a48407b38d72fd58ea3627423836388a_176_0.png)


    Figure 3-97 Emulex Configuration Tool


    # Set up persistent binding


    We recommend setting up persistent binding, which will personally assign a SCSI
    ID to a specific target and maintain a constant view of the same SCSI ID/target
    relationship between the server reboots. 5.3.2, "Persistent binding with an Emulex
    HBA" on 239 entries, in detail, how to set the persistent binding using the Emulex
    Configuration Tool.'
