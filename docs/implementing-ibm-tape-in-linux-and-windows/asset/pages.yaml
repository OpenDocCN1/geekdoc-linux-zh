  md: '# Enabling additional control paths


    The following three sections show how to enable additional control paths via the
    Operator panel or TotalStorage Specialist for the 3582, 3583, and 3584.


    # Enable additional control path on IBM 3582


    Access Mode enables you to set control path failover and additional control paths.
    From the Setup menu, select the SCSI/Fiber Option and then Access Mode. Highlight
    Failover and toggle it to Add ctrl paths. Then select Enabled (see Figure 3-59)
    and exit the Setup menu.


    ![](img/a48407b38d72fd58ea3627423836388a_143_0.png)


    Figure 3-59 IBM 3582: Enable control paths


    # Enable additional control path on IBM 3583


    To enable the control path for one or more drives, select, from the Operator panel
    -> Setup -> Drives -> SCSI. Select the drives on which you want to enable the
    control path, and set the control path to 0, as shown in Figure 3-60.


    ![](img/a48407b38d72fd58ea3627423836388a_143_1.png)


    Figure 3-60 IBM 3583: Enable additional control path


    # Enable additional control path on IBM 3584


    To enable additional control paths with the Operator panel on an IBM 3584, select
    Menu -> Settings -> Control Paths -> Change Control Paths, and select the drive
    which you want to enable for the control path.


    To enable additional control paths using the Tape Library Specialist without ALMS,
    select Manage Drives -> Control Paths, select the drive which you want to enable
    for the control path, and click Change (see Figure 3-61 on page 117).'
