  md: '# Guidelines for partitioning IBM 3583


    +   Each logical library must contain at least one drive and one storage column.
    If your application supports it, LTO 1, LTO 2, and LTO 3 drives and media are
    allowed in the same logical library. At least one drive must have the control
    path enabled.


    +   Support for two logical libraries requires that at least storage column 2
    and 4 be installed. This means that an IBM 3583 L1 needs at least one feature
    code #8007 to be partitioned. At least two drives must be installed.


    +   Support for three logical libraries requires that columns 2, 4, and 5 be installed.
    Only the IBM 3583 L72, the IBM 3583 L36 with one FC #8007, or IBM 3583 L18 with
    two FC #8007 can be partitioned into three logical libraries. At least three drives
    must be installed.


    +   The I/O station is a shared resource for all logical libraries. The six-slot
    fixed magazine below the I/O station on column 1 is included as part of the first
    partition.


    +   Each logical library has a predefined, default control path as follows (for
    an overview of the IBM 3583, figure 2-7 on page 46):


    +   - Logical library A: Drive 1


    +   - Logical library B: Drive 3


    +   - Logical library C: Drive 5


    +   Logical libraries with a 12-slot I/O station


    +   - Logical library 1: 24 slots (column 1 and column2), 1 - 2 tape drives (drive
    1 and drive 2)


    +   - Logical library 2: 18 - 36 slots (column 4, column 5), 1 - 4 tape drives
    (drive 3, drive 4, drive 5, and drive 6)


    +   - Two logical libraries with a 1-slot I/O station


    +   - Logical library 1: 18 slots (column 2), 1 - 2 tape drives (drive 1 and drive
    2)


    +   - Logical library 2: 18 - 36 slots (column 4 and column 5), 1 - 4 tape drives
    (drive 3, drive 4, drive 5, and drive 6)


    +   - Three logical libraries with a 12-slot I/O station


    +   - Logical library 1: 24 slots (column 1 and column 2), 1 - 2 tape drives (drive
    1 and drive 2)


    +   - Logical library 2: 18 slots (column 4), 1 - 2 tape drives (drive 3 and drive
    4)


    +   - Logical library 3: 18 slots (column 5), 1 - 2 tape drives (drive 5 and drive
    6)


    +   Three logical libraries with a 1-slot I/O station


    +   - Logical library 1: 18 slots (column 2), 1 - 2 tape drives (drive 1 and drive
    2)


    +   - Logical library 2: 18 slots (column 4), 1 - 2 tape drives (drive 3 and drive
    4)


    +   - Logical library 3: 18 slots (column 5), 1 - 2 tape drives (drive 5 and drive
    6)'
