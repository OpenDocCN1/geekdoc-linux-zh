  md: 'If you use FORMAT=ultriumc=ultrium2c/ultrium3c/3592c/drive, then your LAN-free
    clients also use compression regardless of whether hardware compression is enabled.


    Note Tiv Storage Manager also provides optional client compression. If this is
    enabled, then compress their data before sending it to the storage device. This
    is particularly useful when the network connection between the client and server
    is slow and traffic needs to be minimized. With compression, using tape drive
    compression has little effect and is not recommended. You should evaluate your
    environment and (probably by performing some appropriate testing) to determine
    if compression is beneficial. If so, enable it, and use the uncompressed (FORMAT=ultrium2/ultrium3/3592)
    flag when defining the drive class. If not, then tape drive compression should
    be used.


    The option LIMIT specifies the maximum number of sequence access volumes can be
    simultaneously used for the device class. This parameter is optional. The default
    is drives, which means the maximum is set to the number of drives installed and
    available in the library. There are two reasons why you might use a specific value
    rather than the default:


    +   If you are going to share the library among multiple servers, you may want
    to specify a number instead of the default drives to limit the number of drives
    each server has access to.


    +   If you have a mixture of LTO generation drives in the same library, see 7.12,
    "Device migration and coexistence" we recommend that the default value of drives
    not be used for the older Ultrium x device classes. For example, when specifying
    LIMIT=drives, the Tivoli Storage Manager server will load Ultrium 1 cartridges
    in preference to Ultrium 2 or 3 drives, but which there is the possibility that
    all Ultrium 2 or 3 drives could be loaded with Ultrium 1 cartridges and therefore,
    an Ultrium 2 or 3 cartridge could not be loaded. It may be necessary to set the
    LIMIT parameter to a value that is equal to the number of that version of drives,
    or to a value less than the total number of drives in the library.


    To define the IBM 3584 in UNIX environment, we called the device class dev3584,
    pointing to our previously defined library lib3584. In the example, we have two
    3592c for the FORMAT parameter and we set the LIMIT to 2:


    ```

    DEFINE CLASS dev3584 DEVTYPE=3592 LIBRARY=lib3584 FORMAT=3592 LIMIT=2

    ```


    # Defining the storage pool using the command line


    Define the storage pool with the following command:


    ```

    DEFINE STGPOOL stpool1 devclass_name dev3584 MAXSCRATCH=number

