- img_proc: true
  md: '# Rules for booting SAN Data Gateway and FC hosts


    Device access problems sometimes occur when it is necessary to shut down the IBM
    SAN Data Gateway. To avoid losing access to your FC devices when a shutdown is
    required, the SAN Data Gateway and its attached devices must be booted in a specific
    order. Rebooting is required after updating firmware and when adding or removing
    SCSI devices. The following procedure describes the recommended boot order, and
    is also applicable to the SAN Data Router.


    > **Attention:** You must stop all I/O between the host and SCSI devices before
    rebooting the SAN Data Gateway.


    +   1. SCSI devices

    Turn on the SCSI devices first. All SCSI devices attached to the SAN Data Gateway
    (SDG) must be turned on before turning or rebooting the SDG.

    2. SAN Data Gateway (SDG)

    The SDG scans SCSI buses when it is booting. If you add or remove SCSI devices
    after the SDG has booted, it will not automatically detect the changes. You can
    reboot the SDG using the StorWatch SAN Data Gateway Specialist client, from a
    telnet session or a serial terminal session. You can also use the scsiRescan command
    to scan the SCSI channels.

    3. Fibre Channel hosts

    Before turning or restarting hosts that are connected via Fibre Channel to the
    SDG, you must wait until the SDG has finished booting, as indicated by the Ready
    Light on the front panel blinking at a rate of about one per second.

    - Although some operating systems may provide software methods to allow SCSI devices
    to be dynamically added or removed after the host has booted, we recommend that
    you reboot the host to ensure reliable operation.

    - If you update SDG firmware, you must reboot the SDG to use the new firmware.
    We highly recommended that you also reboot the host to ensure compatibility with
    any new features or functions.

    - If you update SCSI device firmware, the SDG explorer will not display the new
    version until the SDG has issued a SCSI inquiry, which occurs when it rescans
    the SCSI buses. The same is true for the StorWatch SAN Data Gateway Specialist
    client and the service terminal.


    # Performance considerations


    Performance analysis is approached by determining which component of the data
    path impacts performance. Typically, a performance problem can be isolated by
    looking at one aspect of the data path at a time. The data path mainly consists
    of:


    +   - Client file system

    - Client server hardware

    - Network

    - Application server hardware

    - Application server file system

    - Application itself (for example, database)'
  merge: -1
  pgno: 449
- img_proc: true
  md: "+   ▶ Connection to the tape drives\n\n+   - Type of HBAs: 1 Gbit or 2 Gbit.\n\
    \n+   - What are the HBAs connected to? What type of PCI Bus? What else is on\
    \ the same PCI Bus?\n\n+   ▶ Size of files that you are backing up\n\nIf you think\
    \ you have a performance problem, then you have to determine which link of your\
    \ chain is causing the problem, that is, where does the bottleneck occur? Therefore,\
    \ look at each link separately.\n\n> **Attention:** The numbers presented here\
    \ are not intended to reflect any real performance that might be achieved. The\
    \ tests were run without particular attention to optimizing performance and are\
    \ intended to be used for comparative results only.\n\n# # Linux\n\nThe Linux\
    \ command `dd` can be used to get a baseline performance level. You may test the\
    \ performance of your device subsystem first by writing and reading from /dev/zero.\
    \ Then you may want to test the performance from the server to the tape by writing\
    \ and reading from tape to /dev/zero. Finally, you write files from the disk to\
    \ the tape.\n\nThe **dd** command has the following syntax:\ndd if=input_file/device=output_file\
    \ bs=blocksize count=amount_of block_reading/writing\n\nYou may use `dd` in conjunction\
    \ with **time** to measure the time.\n\nWe suggest that you write/read at least\
    \ 1 GB; therefore, use **bs=262144** **count=4096**.\n\nFirst, test the system\
    \ performance with:\ntime dd <filename> of=/dev/null bs=262144\n\nSubstitute `<filename>`\
    \ with a large file that you have created or that is already available.\n\nThen\
    \ test the tape performance with:\ntime dd if=/dev/zero of=/dev/ibmtape bs=262144\n\
    \nAnd with:\ntime dd if=<filename> of=/dev/IBMtape0 bs=262144\n\n# # Windows\n\
    \nWith NTUTIL in batch mode, you can test native performance of the tape drives.\
    \ For this task, you will have to generate a batch file with the content shown\
    \ in Example C-1. \n\n**Example: C-1** Sample NTUTIL batch file to test tape drive\
    \ performance\n\n```\ncommand RW\ncommand set_device_parameters compression =\
    \ 0\ncommand set_media_parameters block_size = 262144\nset block_size = 262144\n\
    command write records = 4096\ncommand write_filemark 2\n```"
  merge: -1
