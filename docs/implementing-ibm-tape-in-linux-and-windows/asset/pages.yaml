    +   drive_name is the tape name defined on the Tivoli Storage Manager server.


    +   library_name is the tape library name defined on the server.


    +   dev_name_on_storageagent is the device file name of the tape drive on the
    Storage Agent machine (example mt2.2.0.2).


    > **Important:** Keep in mind that the drives are not necessarily configured by
    the operating system in the same order as they are installed in the library, as
    described in 5.3, "Persistent binding" on page 237. Therefore, check carefully
    the element address that matches your configuration.


    # 7.8 NDMP backup with Tivoli Storage Manager


    Network Data Management Protocol (NDMP) is an standard protocol developed to eliminate
    the issues centered around the decentralization of backup standards for file servers,
    and dedicated Network Attached Storage (NAS) file servers.


    NDMP backup is provided with IBM Tivoli Storage Manager Enterprise Edition. This
    is well documented in the Administration Guide for your Tivoli Storage Manager
    platform; for example, for a Windows server™, refer to:


    +   IBM Tivoli Storage Manager for Windows Administrator''s Guide V5.3, GC32-0782


    Also see the redbook:


    +   IBM Tivoli Storage Manager Implementation Guide, SG24-5416


    # 7.8.1 Network Attached Storage


    NAS stands for Network Attached Storage and is a way to make large amounts of
    storage available to many clients using standard file sharing protocols. An NAS
    box (sometimes called an NAS appliance or file server) consists of a number of
    disks, one or more network adapters (NICs), and a controller that runs an embedded,
    specialized operating system to configure and administer the network. The NAS
    appliance exists as an entity in the network. The drives are divided into volumes,
    which can be accessed by other servers or workstations, using standard file-sharing
    protocols like NFS and CIFS. Network Attached Storage is, therefore, easy and
    relatively cheap to implement, since standard file sharing methods and normal
    network adapters are used to access the data.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'But the question arises, how do back up the data in the NAS box? One way is
    to back up the mounted file systems from a client that is accessing it. However,
    this involves multiple network accesses and may or not back metadata, like access
    control lists, correctly. Or, you could write/modify a backup client to run directly
    on the NAS appliance itself. The issue here is that vendors use different operating
    systems (often specialized) for their appliances, which means multiple ports of
    the backup client would be necessary. A standard is really needed to make NAS
    backup easier.


    # The need for NDMP


    NDMP is a standard protocol for backup applications to use back up NAS servers.
    NDMP provides a high-performance backup solution by separating meta-data (control
    path) transfer over the LAN from raw backup data (data path), which can be transferred
    locally to a storage device. NDMP also solves the problem of interoperability
    of various NAS servers and software.


    NDMP backup with Tivoli Storage Manager is available for the following:


    +   - A Tivoli Storage Manager V5.2 or later server for Windows, AIX, Sun Solaris,
    HP-UX, or Linux. For the most up to date support details, see


    ```

    http://www-306.ibm.com/software/tivoli/products/storage-mgr/network-data-gmp-protocol.html
    ml

    ```


    # 7.8 Overview of Tivoli Storage Manager NDMP backup


    Tivoli Storage Manager Enterprise Edition provides backup of supported NAS file
    servers. Tivoli Storage Manager controls the backup remotely, but the NAS file
    server transfers backup data locally. Typically, in this direct SCSI attached
    configuration between the NAS file server and a tape library. It is possible to
    configure NDMP operations with Tivoli Storage Manager using a SAN attached configuration.
    However, the library robotics must be logically but explicitly controlled by the
    Tivoli Storage Manager server, and the tape drives must be logically, but explicitly,
    controlled by the NAS file server.


    Tivoli Storage Manager Enterprise Edition NDMP supports backup and restores complete
    NAS file systems without having to use file access protocols like Common Internet
    File System (CIF) and Network File System (NFS). The first backup performed is
    a full backup with every backup being a differential backup by default will a
    differential backup will back up all file changes since the last full backup.
    When a restore is initiated, Tivoli Storage Manager restores the full backup,
    followed by the differential backup.


    > Attention: A Tivoli Storage Manager V5.3 server is required for directory-level
    backup. See the latest Tivoli Storage Manager manuals, or the Redbook IBM Tivoli
    Storage Manager Implementation Guide, SG24-5416, for details.


    # 7.8.3 Tivoli Storage Manager NDMP backup configurations


    The fundamental physical requirement for Tivoli Storage Manager NDMP backup is
    to have the tape devices connected to the NAS system. The library robotics may
    be controlled by either the NAS system or the Tivoli Storage Manager. If the tape
    library does not have separate interfaces for the medium changer and tape devices,
    or if there is a large distance separating the Tivoli Storage Manager server and
    the NAS system, then the library must be directly connected to the NAS system.
    Below are the supported configurations.'
