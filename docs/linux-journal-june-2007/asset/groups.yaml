  md: "\n# An Introduction to Metaprogramming\n\nHow to write programs that write\
    \ programs.\nARIEL ORTIZ\n\nA metaprogram is a program that generates other programs\
    \ or program parts. Hence, metaprogramming means writing metaprograms. Many useful\
    \ metaprograms are available for Linux; the most common ones include compilers\
    \ (GCC or FORTRAN 77), interpreters (Perl or Ruby), parser generators (Bison),\
    \ assemblers (AS or NASM) and pre-processors (CPP or M4). Typically, you use a\
    \ metaprogram to eliminate or reduce a tedious or error-prone programming task.\
    \ So, for example, instead of writing a machine code program by hand, you would\
    \ use a high-level language, such as C, and then let the C compiler do the translation\
    \ to the equivalent low-level machine instructions.\n\nMetaprogramming at first\
    \ may seem to be an advanced topic, suitable only for programming language gurus,\
    \ but it's not really that difficult once you know how to use the adequate tools.\n\
    \n## Source Code Generation\n\nIn order to present a very simple example of metaprogramming,\
    \ let's assume the following totally fictional situation.\n\nErika is a very smart\
    \ first-year undergraduate computer science student. She already knows several\
    \ programming languages, including C and Ruby. During her introductory programming\
    \ class, Professor Gomez, the course instructor, caught her chatting on her laptop\
    \ computer. As punishment, he demanded Erika write a C program that printed the\
    \ following 1,000 lines of text:\n\n- 1. I must not chat in class.\n- 2. I must\
    \ not chat in class.\n- ...\n- 999. I must not chat in class.\n- 1000. I must\
    \ not chat in class.\n\nAn additional imposed restriction was that the program\
    \ could not use any kind of loop or goto construct. It should contain only one\
    \ big main function with 1,000 printf instructions—something like this:\n\n```c\n\
    #include <stdio.h>\nint main(void) {\n    printf(\"1. I must not chat in class.\\\
    n\");\n    printf(\"2. I must not chat in class.\\n\");\n    /* 998 printf instructions\
    \ omitted. */\n    printf(\"999. I must not chat in class.\\n\");\n    printf(\"\
    1000. I must not chat in class.\\n\");\n    return 0;\n}\n```\n\nProfessor Gomez\
    \ wasn't too naive, so he basically expected Erika to write the printf instruction\
    \ once, copy it to the clipboard, do 999 pastes, and manually change the numbers.\
    \ He expected that even this amount of irksome and repetitive work would be enough\
    \ to teach her a lesson. But, Erika immediately saw an easy way out—metaprogramming.\
    \ Instead of writing this program by hand, why not write another program that\
    \ writes this program automatically for her? So, she wrote the following Ruby\
    \ script:\n\n```ruby\nFile.open('punishment.c', 'w') do |output|\n    output.puts\
    \ '#include <stdio.h>'\n    output.puts 'int main(void) {'\n    1.upto(1000) do\
    \ |i|\n        output.puts \"    printf(\\\"#{i}. I must not chat in class.\\\
    n\\\")\"\n    end\n    output.puts '    return 0;'\n    output.puts '}'\nend\n\
    ```\n\nThis code creates a file called punishment.c with the expected 1,000+ lines\
    \ of C source code.\n\nAlthough this example might seem a bit fabricated, it illustrates\
    \ how easy it is to write a program that produces the source of another program.\
    \ This technique can be used in more realistic settings. Let's say that you have\
    \ a C program that needs to include a PNG image, but for some reason, the deployment\
    \ platform can accept one file only, the executable file. Thus, the data that\
    \ conforms the PNG file data has to be integrated within the program code itself.\
    \ To achieve this, we can read the PNG file beforehand and generate the C source\
    \ text for an array declaration, initialized with the corresponding data as literal\
    \ values. This Ruby script does exactly that:\n\n```ruby\nINPUT_FILE_NAME = 'logo.png'\n\
    OUTPUT_FILE_NAME = 'logo.h'\nDATA_VARIABLE_NAME = 'logo'\n\nFile.open(INPUT_FILE_NAME,\
    \ 'r') do |input|\n    File.open(OUTPUT_FILE_NAME, 'w') do |output|\n        output.print\
    \ \"unsigned char #{DATA_VARIABLE_NAME}[] = {\"\n        data = input.read.unpack(\"\
    C*\")\n        data.length.times do |i|\n            if i % 8 == 0\n         \
    \       output.print \"\\n\\t\"\n            end\n            output.print \"\
    0x%02X\" % data[i]\n            output.print ', ' if i < data.length - 1\n   \
    \     end\n    output.puts \"\\n\"\n    end\nend\n```\n\nThis script reads the\
    \ file called logo.png and creates a new output file called logo.h. First, it\
    \ writes the declaration of the variable logo as an array of unsigned characters.\
    \ Next, it reads the whole input file at once and unpacks every single input character\
    \ as an unsigned byte. Then, it writes each of the input bytes as two-digit hexadecimal\
    \ numbers in groups of eight elements per line. As should be expected, individual\
    \ elements are terminated with commas, except the last one. Finally, the script\
    \ writes the closing brace and semicolon. Here is a possible output file sample:\n\
    \n```c\nunsigned char logo[] = {\n    0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A,\
    \ 0x0A,\n    0x00, 0x00, 0x00, 0x0D, 0x49, 0x48, 0x44, 0x52,\n    /* A few hundred\
    \ lines omitted. */\n    0x0B, 0x13, 0x00, 0x00, 0x00, 0x00, 0x49, 0x45,\n   \
    \ 0x4E, 0x44, 0xAE, 0x42, 0x60, 0x82\n};\n```\n\nThe following C program demonstrates\
    \ how you could use the generated code as an ordinary C header file. It's important\
    \ to note that the PNG file data will be stored in memory when the program itself\
    \ is loaded:\n\n```c\n#include <stdio.h>\n#include \"logo.h\"\n\n/* Prints the\
    \ contents of the array logo as\n   hexadecimal byte values. */\nint main(void)\
    \ {\n    int i;\n    for (i = 0; i < sizeof(logo); i++) {\n        printf(\"%X\
    \ \", logo[i]);\n    }\n    return 0;\n}\n```\n\nYou also can have a program that\
    \ both generates source code and executes it on the spot. Some languages have\
    \ a facility called eval, which allows you to translate and execute a piece of\
    \ source code contained within a string of characters at runtime. This feature\
    \ is usually available in interpreted languages, such as Lisp, Perl, Ruby, Python\
    \ and JavaScript. In this Ruby code:\n\n```ruby\nx = 3\ns = 'x + 1'\nputs eval(s)\n\
    ```\n\nThe string 'x + 1' is translated and executed when the code is run, printing\
    \ 4 as a result. Note that even the value bound to variable x is available during\
    \ the runtime evaluation. The following Ruby code demonstrates a contrived way\
    \ to find the result of adding all the integer numbers between 1 and 100. Instead\
    \ of using a normal loop or iteration method, we generate a big string containing\
    \ the expression `\"1+2+3...+99+100\"` and then proceed to evaluate it:\n\n```ruby\n\
    puts eval((1..100).to_a.join('+'))\n```\n\nThe eval function should be used with\
    \ care. If the string used as the argument to eval comes from an untrusted source\
    \ (for example, from user input), it can be potentially dangerous (imagine what\
    \ could happen if the string to evaluate contains the Ruby expression `rm -rf\
    \ *`). In many cases, there are alternatives to eval that are more flexible, less\
    \ insecure and do not require the speed hit of parsing code during runtime.\n\n\
    # Quines\n\nA quine is special kind of source code generator. The jargon file\
    \ defines a quine as \"a program that generates a copy of its own source text\
    \ as its complete output\". You might be right if you think this lacks any practical\
    \ value by itself, but as a brain-teaser, it can be mind-blowing. Here's a quine\
    \ written by Ryan Davis, which is one of the shortest ones for the Ruby language:\n\
    \n```ruby\nf='\"%s\";puts f%%f\"';puts f%f'\n```\n\nRun this program, and you\
    \ will get it as output. You might even try something like this from a shell prompt:\n\
    \n```bash\nruby -e 'f=\"%s\";puts f%%f\"';puts f%f' | ruby\n```\n\nHere we're\
    \ using the -e option from the command line to specify one line of Ruby source\
    \ to execute, and then we use a pipe to send its output to another instance of\
    \ the Ruby interpreter. The output is once again the same program source.\n\n\
    # Modifying Programs during Runtime\n\nDynamic languages, such as Ruby, allow\
    \ you to modify different parts of your program easily during runtime without\
    \ having to generate source code explicitly as we did previously. Ruby's core\
    \ API and frameworks, such as Ruby on Rails, employ this facility to automate\
    \ common programming tasks. For example, in a class definition, you can use the\
    \ attr_accessor method to produce the read/write access methods automatically\
    \ for a given attribute name. Thus, the following code:\n\n```ruby\nclass Person\n\
    \  attr_accessor :name\nend\n```\n\nis equivalent to this more verbose code:\n\
    \n```ruby\nclass Person\n  def name\n    @name\n  end\n\n  def name=(new_name)\n\
    \    @name = new_name\n  end\nend\n```\n\nThe previous code has a minor drawback:\
    \ the corresponding instance variable @name is not really created until you first\
    \ set its value. This means you'll get a nil value if you happen to read this\
    \ attribute before writing to it. If you're not careful, this could introduce\
    \ a few subtle bugs into your programs. The easiest way to avoid this problem\
    \ is to set the @name instance variable to a reasonable value in the Person#initialize\
    \ method. Because this is a quite common scenario, wouldn't it be nice to have\
    \ this method generated automatically, in addition to the read/write accessors?\
    \ Let's define an attr_initialize method that'll do that using Ruby's metaprogramming\
    \ facilities. First, let's briefly address two methods that are key to performing\
    \ our desired metaprogramming magic:\n\n```ruby\ncls.define_method(name) { body\
    \ }\n```\n\nThis adds a new instance method to the receiving class. It takes as\
    \ input the method's name (as a symbol or string) and its body (as a code block):\n\
    \n```ruby\nobj.instance_variable_set(name, value)\n```\n\nThe above code binds\
    \ an instance variable to the specified value. The name of the instance variable\
    \ should be a symbol or string, and it also should include the @ prefix.\nNow,\
    \ we're ready to define the attr_initialize class method as an extension to the\
    \ Object class so that any other class can use it:\n\n```ruby\nrequire 'generator'\n\
    \nclass Object\n  def Object.attr_initialize(*attrs)\n    define_method(:initialize)\
    \ do |*args|\n      if attrs.length != args.length\n        raise ArgumentError,\n\
    \          \"wrong number of arguments (\" +\n          \"#{args.length} for #{attrs.length})\"\
    \n      end\n      SyncEnumerator.new(attrs, args).each do |attr, arg|\n     \
    \   instance_variable_set(\"@#{attr}\", arg)\n      end\n    end\n    attr_accessor\
    \ *attrs\n  end\nend\n```\n\nThe attr_initialize method takes as input a variable\
    \ number of attribute names (attrs). Each attribute name has the same position\
    \ reserved for it in the dynamically created initialize method parameter list\
    \ (args) in order to set its initial value. We start the new method's code by\
    \ checking that the number of arguments being received are the same as the number\
    \ of attributes we originally specified. If not, we raise an error with a descriptive\
    \ message. Afterward, we use a SyncEnumerator object (from the generator library)\
    \ to iterate at the same time over the declared attributes list (attrs) and the\
    \ actual arguments list (args) so as to perform a one-by-one attribute-argument\
    \ binding using the instance_variable_set method. Finally, we delegate\n"
  mdcn: "\n# 元编程入门\n\n如何编写能生成程序的程序。\nARIEL ORTIZ\n\n元程序是一种生成其他程序或程序部分的程序。因此，元编程指的是编写元程序。在\
    \ Linux 系统中有许多实用的元程序；最常见的包括编译器（GCC 或 FORTRAN 77）、解释器（Perl 或 Ruby）、解析器生成器（Bison）、汇编器（AS\
    \ 或 NASM）以及预处理器（CPP 或 M4）。通常，你使用元程序来消除或减少繁琐或容易出错的编程任务。例如，与其手动编写机器码程序，不如使用高级语言（如\
    \ C），然后让 C 编译器将其转换为等效的低级机器指令。\n\n起初，元编程可能看起来是一个高级话题，只适合编程语言专家，但一旦你知道如何使用合适的工具，它其实并不难。\n\
    \n## 源代码生成\n\n为了展示一个简单的元编程示例，让我们假设以下完全虚构的情况。\n\nErika 是一名非常聪明的大一计算机科学本科生。她已经掌握了多种编程语言，包括\
    \ C 和 Ruby。在她的入门编程课上，课程讲师 Gomez 教授发现她在笔记本电脑上聊天。作为惩罚，他要求 Erika 编写一个 C 程序，打印出以下\
    \ 1,000 行文本：\n\n- 1. 我上课时不能聊天。\n- 2. 我上课时不能聊天。\n- ...\n- 999. 我上课时不能聊天。\n- 1000.\
    \ 我上课时不能聊天。\n\n额外施加的限制是该程序不能使用任何形式的循环或 goto 结构。它应该只包含一个大的 main 函数，其中有 1,000 条\
    \ printf 指令——类似以下内容：\n\n```c\n#include <stdio.h>\nint main(void) {\n    printf(\"\
    1. I must not chat in class.\\n\");\n    printf(\"2. I must not chat in class.\\\
    n\");\n    /* 省略了 998 条 printf 指令。 */\n    printf(\"999. I must not chat in class.\\\
    n\");\n    printf(\"1000. I must not chat in class.\\n\");\n    return 0;\n}\n\
    ```\n\nGomez 教授并没有太天真，所以他基本上预计 Erika 会写一次 printf 指令，将其复制到剪贴板，粘贴 999 次，并手动更改数字。他预计即使这种恼人和重复的工作也足以给她一个教训。但是，Erika\
    \ 立即看到了一个简单的出路——元编程。与其手动编写这个程序，为什么不编写另一个程序自动为她生成这个程序呢？因此，她编写了以下 Ruby 脚本：\n\n```ruby\n\
    File.open('punishment.c', 'w') do |output|\n    output.puts '#include <stdio.h>'\n\
    \    output.puts 'int main(void) {'\n    1.upto(1000) do |i|\n        output.puts\
    \ \"    printf(\\\"#{i}. I must not chat in class.\\n\\\")\"\n    end\n    output.puts\
    \ '    return 0;'\n    output.puts '}'\nend\n```\n\n这段代码创建了一个名为 punishment.c 的文件，其中包含预期的\
    \ 1,000 多行 C 源代码。\n\n虽然这个例子可能显得有点牵强，但它说明了编写一个生成另一个程序源代码的程序是多么容易。这项技术可以在更现实的场景中使用。假设你有一个\
    \ C 程序需要包含一个 PNG 图像，但由于某种原因，部署平台只能接受一个文件，即可执行文件。因此，构成 PNG 文件数据的数据必须集成在程序代码本身中。为了实现这一点，我们可以预先读取\
    \ PNG 文件，并生成数组声明的 C 源代码文本，使用相应的数据作为字面量值进行初始化。这个 Ruby 脚本正是这么做的：\n\n```ruby\nINPUT_FILE_NAME\
    \ = 'logo.png'\nOUTPUT_FILE_NAME = 'logo.h'\nDATA_VARIABLE_NAME = 'logo'\n\nFile.open(INPUT_FILE_NAME,\
    \ 'r') do |input|\n    File.open(OUTPUT_FILE_NAME, 'w') do |output|\n        output.print\
    \ \"unsigned char #{DATA_VARIABLE_NAME}[] = {\"\n        data = input.read.unpack(\"\
    C*\")\n        data.length.times do |i|\n            if i % 8 == 0\n         \
    \       output.print \"\\n\\t\"\n            end\n            output.print \"\
    0x%02X\" % data[i]\n            output.print ', ' if i < data.length - 1\n   \
    \     end\n    output.puts \"\\n\"\n    end\nend\n```\n\n此脚本读取名为 logo.png 的文件，并创建一个名为\
    \ logo.h 的新输出文件。首先，它写入变量 logo 的声明，作为一个无符号字符数组。接下来，它一次性读取整个输入文件，并将每个输入字符解包为无符号字节。然后，它将每个输入字节写为两位十六进制数，每行八个元素一组。如预期那样，除最后一个外，每个元素都以逗号结尾。最后，脚本写入右花括号和分号。以下是一个可能的输出文件示例：\n\
    \n```c\nunsigned char logo[] = {\n    0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A,\
    \ 0x0A,\n    0x00, 0x00, 0x00, 0x0D, 0x49, 0x48, 0x44, 0x52,\n    /* 省略了几百行。 */\n\
    \    0x0B, 0x13, 0x00, 0x00, 0x00, 0x00, 0x49, 0x45,\n    0x4E, 0x44, 0xAE, 0x42,\
    \ 0x60, 0x82\n};\n```\n\n下面的 C 程序展示了如何将生成的代码作为普通的 C 头文件使用。需要注意的是，当程序本身加载时，PNG\
    \ 文件数据将存储在内存中：\n\n```c\n#include <stdio.h>\n#include \"logo.h\"\n\n/* 以十六进制字节值的形式打印数组\
    \ logo 的内容。 */\nint main(void) {\n    int i;\n    for (i = 0; i < sizeof(logo);\
    \ i++) {\n        printf(\"%X \", logo[i]);\n    }\n    return 0;\n}\n\n你也可以拥有一个既生成源代码又就地执行的程序。某些语言有一种称为\
    \ eval 的功能，它允许你在运行时翻译并执行包含在字符串中的一个源代码片段。此功能通常存在于解释型语言中，如 Lisp、Perl、Ruby、Python\
    \ 和 JavaScript。在此 Ruby 代码中：\n\n```ruby\nx = 3\ns = 'x + 1'\nputs eval(s)\n```\n\
    \n字符串 'x + 1' 在代码运行时被翻译并执行，结果是打印 4。请注意，即使在运行时评估期间，绑定到变量 x 的值也可用。以下 Ruby 代码展示了一种人为构造的方法，用于找出\
    \ 1 到 100 之间所有整数之和的结果。我们不是使用普通的循环或迭代方法，而是生成一个包含表达式 `\"1+2+3...+99+100\"` 的大字符串，然后对其进行求值：\n\
    \n```ruby\nputs eval((1..100).to_a.join('+'))\n```\n\neval 函数应谨慎使用。如果用作 eval 参数的字符串来自不可信来源（例如，来自用户输入），它可能是潜在的危险的（想象一下，如果待评估的字符串包含\
    \ Ruby 表达式 `rm -rf *` 会发生什么）。在许多情况下，eval 的替代方案更灵活，安全性更高，并且不需要在运行时解析代码带来的速度损失。\n\
    \n# Quine（自生程序）\n\nQuine 是一种特殊的源代码生成器。术语文件将 quine 定义为“一个程序，其完整输出是其自身源代码的副本”。如果你认为这本身缺乏任何实用价值，那可能是正确的，但作为脑力挑战，它可以令人叹为观止。以下是\
    \ Ryan Davis 编写的一个 quine，它是 Ruby 语言中最短的之一：\n\n```ruby\nf='\"%s\";puts f%%f\"';puts\
    \ f%f'\n```\n\n运行此程序，你将得到它作为输出。你甚至可以从 shell 提示符尝试类似以下操作：\n\n```bash\nruby -e 'f=\"\
    %s\";puts f%%f\"';puts f%f' | ruby\n```\n\n这里我们使用命令行上的 -e 选项来指定一行要执行的 Ruby 源代码，然后使用管道将其输出发送到另一个\
    \ Ruby 解释器实例。输出再次是相同的程序源代码。\n\n# 在运行时修改程序\n\n动态语言，如 Ruby，允许你在运行时轻松修改程序的不同部分，而无需像之前那样显式生成源代码。Ruby\
    \ 的核心 API 和框架（如 Ruby on Rails）利用此功能来自动化常见的编程任务。例如，在类定义中，你可以使用 attr_accessor 方法为给定的属性名称自动生成读/写访问方法。因此，以下代码：\n\
    \n```ruby\nclass Person\n  attr_accessor :name\nend\n```\n\n等效于以下更冗长的代码：\n\n```ruby\n\
    class Person\n  def name\n    @name\n  end\n\n  def name=(new_name)\n    @name\
    \ = new_name\n  end\nend\n```\n\n前面的代码有一个小缺点：对应的实例变量 @name 实际上直到你首次设置其值时才创建。这意味着如果你恰好在写入之前读取此属性，你将得到\
    \ nil 值。如果不仔细，这可能会在你的程序中引入一些细微的 bug。避免此问题的最简单方法是在 Person#initialize 方法中将 @name\
    \ 实例变量设置为一个合理的值。由于这是一个相当常见的场景，除了读/写访问器之外，自动拥有这个方法不是更好吗？让我们定义一个 attr_initialize\
    \ 方法，使用 Ruby 的元编程功能来实现这一点。首先，让我们简要介绍两个对我们期望的元编程魔法至关重要的方法：\n\n```ruby\ncls.define_method(name)\
    \ { body }\n```\n\n这为接收类添加一个新的实例方法。它接受方法的名称（作为符号或字符串）和其主体（作为代码块）作为输入：\n\n```ruby\n\
    obj.instance_variable_set(name, value)\n```\n\n上述代码将实例变量绑定到指定值。实例变量的名称应该是符号或字符串，并且还应包括\
    \ @ 前缀。\n现在，我们准备好将 attr_initialize 类方法定义为 Object 类的扩展，以便任何其他类都可以使用它：\n\n```ruby\n\
    require 'generator'\n\nclass Object\n  def Object.attr_initialize(*attrs)\n  \
    \  define_method(:initialize) do |*args|\n      if attrs.length != args.length\n\
    \        raise ArgumentError,\n          \"wrong number of arguments (\" +\n \
    \         \"#{args.length} for #{attrs.length})\"\n      end\n      SyncEnumerator.new(attrs,\
    \ args).each do |attr, arg|\n        instance_variable_set(\"@#{attr}\", arg)\n\
    \      end\n    end\n    attr_accessor *attrs\n  end\nend\n```\n\nattr_initialize\
    \ 方法接受可变数量的属性名称（attrs）作为输入。每个属性名称在动态创建的 initialize 方法参数列表（args）中都有相同的位置，以便设置其初始值。我们启动新方法的代码，检查收到的参数数量是否与最初指定的属性数量相同。如果不同，我们抛出带有描述性消息的错误。之后，我们使用\
    \ SyncEnumerator 对象（来自 generator 库）同时迭代已声明的属性列表（attrs）和实际参数列表（args），以使用 instance_variable_set\
    \ 方法逐个执行属性-参数绑定。最后，我们委托\n"
