    \ 20 种选择）\n- 简化库存管理\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_28_0.png)\n\n\
    Supermicro SAS RAID 5 卡。\n\n# 可用的主板选项\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_28_1.png)\n\
    \n# 优化的机箱解决方案\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_28_2.png)\n\nSupermicro\
    \ UIO 服务器允许用户从广泛的 I/O 选项中进行选择，从而提供极致的存储和网络灵活性。UIO 卡成为服务器主板的一部分，使系统能够保留所有 PCI Express\
    \ 和 PCI X 插槽用于扩展卡。因此，未来的升级可以通过更换 UIO 卡和/或扩展卡来实现，而不是更换整个系统。这种多功能性有助于减少客户运营业务所需的服务器种类数量。\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_28_3.png)\n\n欲了解更多信息，请访问 www.supermicro.com\n\
    \n* 我们新一代电源在典型负载运行下效率达到 90% 或更高。\n\n# 操作 Shell\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_29_0.png)\n\
    \n## Dave Taylor\n\n### 在 Apache 中显示图像目录，第三部分\n\n令人惊叹的缩小脚本知道一种更好地调整缩略图尺寸的方法。\n\
    \n在上个月的专栏中，我们将目录显示脚本构建到了这样的程度：你可以获得一个智能列表，显示你的图像文件（并为其他任何文件类型提供链接），同时允许显示缩略图。\n\
    \n后一种技巧是让 Web 浏览器来做功。如果你指定的高度或宽度与实际图像大小不同，Web 浏览器会自动将图像缩放以适应指定的尺寸。更棒的是，如果你只指定一个维度，它会按比例缩放以适应。\n\
    \n让我稍微多解释一下，因为这对这个特定的脚本项目至关重要。如果你有一个 250x250 像素的图像，并且你想显示一个 75x75 的缩略图，最佳做法当然是同时指定\
    \ height=\"75\" 和 width=\"75\"。问题是，如果图像实际上是 250x317，而你希望将其宽度减少到恰好 75 像素。那么它应该有多高？\n\
    \n当然，你可以自己计算，但让浏览器自动为你完成这项工作要方便得多，如果你只指定 width=\"75\" 或使用完整的 HTML 语句就会发生这种情况：\n\
    \n```html\n<img src=\"my250x317.png\" width=\"75\" />\n```\n\n这样做了之后，图像会被缩放，最终得到一个大小恰好为\
    \ 75x95 像素的图像。然而，如果你始终限制一个维度，事情可能会出错。如果图像实际上是 250x1100，因为它是一个非常高的图形呢？那么缩略图将破坏整个布局，因为它的缩放版本宽达\
    \ 330 像素，远远超过了图像 75x75 的目标框！\n\n这就是为什么理想的脚本应该弄清楚哪个维度更大，然后将那个维度限制为我们寻求的框的大小，让另一个维度自动按比例缩放，多亏了\
    \ Web 浏览器。而这正是我们要做的！\n\n**重要的大注意事项：** 我意识到让浏览器缩放图像会带来显著的性能代价——整个全尺寸图像必须被下载，尽管你在寻找的是更小版本。如果这是个问题，你可以使用如\
    \ ImageMagick 这样的工具来缩放图像并创建代替显示的缩略图图形，可能将它们放入缓存中，并在需要时动态创建新的。但说实话，你难道没有高速互联网连接，额外的加载时间一两天真的很重要吗？\n\
    \n## 开始脚本！\n\n上个月，我们创建了非常有用的函数 figurerize，当给定一个图形图像时，它会返回 height 和 width 参数，从而可以计算这些值。脚本中由此产生的主循环最终看起来像这样：\n\
    \n```bash\nfor name in *\ndo\n    if [ ! -z \"$(file -b $name|grep 'image data')\"\
    \ ]\n    then\n        figurerize $name\n        if [ ! -z \"$height\" ] ; then\n\
    \            echo \"<img src=$name alt=$name height=50 />\"\n            echo\
    \ \"<br />$name ($height x $width)<br />\"\n        else\n            echo \"\
    <img src=$name alt=$name height=50 />\"\n            echo \"<br />$name<br />\"\
    \n        fi\n    else\n        echo \"<a href=$name>$name</a><br />\"\n    fi\n\
    done\n```\n\n如果你仔细阅读代码，它实际上并没有对 height 和 width 参数做太多聪明的事，只是在输出中显示它们。相反，让我们将其转换为一个测试，以计算哪个更大。不过在此之前，我们需要对循环做一些基本的改进，使输出更吸引人：\n\
    \n```bash\nfor name in *\ndo\n```\n\n"
