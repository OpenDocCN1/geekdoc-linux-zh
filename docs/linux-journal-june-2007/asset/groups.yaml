    \ Web 浏览器。实际执行所有工作的脚本是使用 Perl 开发的，并严重依赖于 Perl 强大的正则表达式库。\n\n这款软件最好的功能可能是它以 HTML\
    \ 格式呈现给用户。由于是 HTML 格式，将代码的各个部分链接到其他部分非常容易。它是用 Perl 编写的，因此理论上，它可以在任何拥有 Perl 解释器的操作系统上运行。这个工具真正伟大之处在于它支持多种语言。这意味着无论你的程序是用哪种语言编写的，你仍然可以使用此工具来交叉引用和浏览你的代码。\n\
    \nLXR 实际上相当简单且整洁。用户使用一个名为 genref 的实用程序来生成完整源代码的索引。完成之后，用户通过 Web 浏览器访问一个名为 source\
    \ 的 Perl 脚本，该脚本读取索引文件并动态生成用于交叉引用源代码的 HTML。然后用户可以按需浏览源代码。\n\n# 安装\n\n一旦你对 LXR 的工作原理和各个配置选项有了一定了解，安装和配置\
    \ LXR 就相当简单了。首先，从 **sourceforge.net/projects/lxr** 下载源代码 tarball。在撰写本文时，lxr-0.3\
    \ 是稳定版本。下载 tarball 后，使用以下命令解压它：\n\n```bash\nbash$ tar -xvf lxr-0.3.tar.gz\n```\n\
    \n解压源代码后，cd 到新建的目录，并使用你选择的文本编辑器打开 Makefile 进行编辑。你需要在这里设置两个变量：INSTALLPREFIX 和 PERLBIN。PERLBIN\
    \ 指的是 perl/5s 解释器的可执行二进制文件。在我的情况下，它位于 /usr/bin/perl。INSTALLPREFIX 是安装 LXR 的目录。它应该位于可以通过\
    \ Web 浏览器访问的位置。在我的系统中，那是 Apache 1.3.33，我选择将其安装在 /var/www/htdocs/lxr 下。因此，我的 Makefile\
    \ 看起来大致如下：\n\n```makefile\n# 用于安装和配置 LXR 的 Makefile\n\n# 你的 perl/5s 二进制文件的位置\n\
    \nPERLBIN=/usr/bin/perl\n\n# LXR 将安装在这里\n\nINSTALLPREFIX=/var/www/htdocs/lxr\n\
    \n# 配置参数结束\n\nCGISCRIPTS=find ident search diff source\n\nPERLMODULES=SimpleParse.pm\
    \ Common.pm Config.pm\n\n....\n```\n\n保持 Makefile 的其余部分不变。在控制台输入：\n\n```bash\n\
    bash$ make install\n```\n\n然后 LXR 将安装在指定的目录中。\n\n# 配置\n\n现在，cd 到安装 LXR 的目录（在我的情况下是\
    \ /var/www/htdocs/lxr）。那里应该有三个子目录：bin、http 和 source。尽管你要交叉引用的源代码可以放在任何位置，但我更喜欢将其放在\
    \ $INSTALLPREFIX/source 子目录下。我将 glibc-2.3.5 和 OpenMOSIX-2.4.26 的源代码放在这里。现在，我们必须生成\
    \ LXR 将用于生成交叉引用源代码的索引文件。因此，cd 到包含源代码的目录，并执行 $INSTALLPREFIX/bin 中的 genref 脚本：\n\
    \n```bash\nbash$ /var/www/htdocs/lxr/bin/genref .\n```\n\n末尾的 . 告诉脚本源代码包含在当前目录中。接下来，坐下来享受过程，直到解析完成。完成后，当前目录——包含你的源代码的目录——应该有两个新文件：fileidx\
    \ 和 xref。当你浏览时，LXR 需要这两个文件来生成交叉引用的源代码。确保其他人对这些文件有读取权限。为此，在仍在源目录时输入以下内容：\n\n```bash\n\
    bash$ ls -l fileidx xref\n```\n\n输出应该是这样的：\n\n```text\n-r--r--r-- 1 nobody root\
    \ 671744 2006-08-24 05:06 fileidx*\n-r--r--r-- 1 nobody root 8425472 2006-08-24\
    \ 05:06 xref*\n```\n\n第三个 r 应该已设置。如果没有，你可以执行以下操作来设置：\n\n```bash\nbash$ chmod o+x\
    \ fileidx xref\n```\n\n现在，是时候配置 LXR 以供使用了。更改目录到 $INSTALLPREFIX/http/（在我的情况下，是\
    \ /var/www/htdocs/lxr/http/），并打开 lxr.conf 文件进行编辑。lxr.conf 文件是你需要的最重要的文件。它有几个不同的配置选项。\n\
    \n# 变量\n\n打开文件时看到的第一个是对名为 v 的变量的定义。与编程语言一样，你可以定义自己的变量，并在配置文件稍后使用它们。无论它们在哪里出现，它们都会被替换为它们的值。变量值通过配置文件中的\
    \ $variable-name 引用。变量定义遵循以下两种可能的格式之一：\n\n```text\nvariable: /variable-identifier,\
    \ variable-name.\n//{list-of-values/}, /default-value/\n```\n\n或者：\n\n```text\n\
    variable: /variable-identifier, variable-name.\n/{file-containing-list-of-values/},\
    \ /default-value/\n```\n\n这些术语的含义如下：\n\n- **variable-identifier**：变量在整个配置文件中使用的名称。\n\
    - **variable-name**：显示给用户的变量的实际名称。\n- **list-of-values**：逗号分隔的待显示值列表。\n- **file-containing-list-of-values**：包含可能值列表的文件。列表中的每个条目占单独一行。用户可以选择其中任意一个。应提供文件的绝对路径。\n\
    - **default-value**：变量的默认值。如果未指定，则自动设置第一个值。\n\n# baseurl\n\nbaseurl 是放置 LXR 所需的所有脚本所依据的\
    \ URL。它应该可以通过浏览器访问。在我的配置中，它是 http://my-ip/path/<http://localhost/lxr/http/>。确保在末尾加上\
    \ /，否则最后一个目录将被忽略。\n\n# HTML 页眉和页脚\n\n当生成源代码的 HTML 时，LXR 可以添加页眉和页脚。在 $INSTALLPREFIX/http/\
    \ 目录中提供了示例页眉和页脚。它们分别称为 template-head 和 template-tail。此外，通过修改 template-dir 文件，你还可以更改\
    \ LXR 显示文件和目录的方式。可以在 lxr.conf 文件中通过 htmlhead、htmlmail 和 htmlidrop 选项指定这些文件的位置。\n\
    \n# sourceroot\n\n此选项告诉 LXR 在哪里查找实际的源代码。在我的情况下，它是 /var/www/htdocs/lxr/source/glibc-2.3.5。如果你想交叉引用多个项目，你所要做的就是创建一个指定\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_80_0.png)\n"
