    \ 1 所示的内容。\n\n如你所见，用户可以选择任何源代码文件进行浏览。在顶部，我使用了 LXR 提供的模板。它包含导航源代码、搜索特定标识符、在源代码中搜索任何文本以及搜索任何文件的链接。几个值得注意的工具：\n\
    \n-   *源代码导航：选择此选项以浏览你选择的源代码。\n-   *标识符搜索：搜索特定标识符的定义和用法。需要 ident 脚本。\n-   *自由文本搜索：在源文件中搜索任何文本。需要\
