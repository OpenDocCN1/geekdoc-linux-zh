    \ Each has a large and loyal following, and each continues to improve with every\
    \ successive version.\n\nAnd, when I write \"large and loyal following\" above,\
    \ I'm not kidding. MySQL and PostgreSQL have long been at the center of a major\
    \ flame war within the Open Source world. If someone on Slashdot dares say something\
    \ about one of these products, you can be sure it won't be long before someone\
    \ writes a nasty (and often childish) note about the other one. These disagreements\
    \ often reflect the knee-jerker attitudes of uninformed users, but there have\
    \ been no shortage of attacks from well-known and informed users of these products\
    \ as well.\n\nI believe there are circumstances when either MySQL or PostgreSQL\
    \ might be an appropriate choice. We strongly preferred PostgreSQL in my work\
    \ during the last decade—yet, there definitely are times when MySQL seems to be\
    \ the more appropriate solution. So, despite my personal biases and the risk of\
    \ opening a flame war within the Open Source community, I now conclude this series\
    \ about open-source databases with a comparison between MySQL and PostgreSQL in\
    \ a number of different categories. I hope by the time you finish reading this\
    \ article, you understand that choosing a database is almost never a matter of\
    \ finding the \"fastest\" or \"best\" product, because there is no one way to\
    \ measure the quality or appropriateness of a relational database server. Rather,\
    \ I hope you'll be able to consider each of these on the basis of its own merits,\
    \ rather than on the propaganda that is so widespread.\n\n## Data Integrity\n\n\
    Perhaps the first and foremost task of a database is to store and retrieve data\
    \ reliably. Just as you wouldn't want to use a hard disk that occasionally loses\
    \ data, you don't want to put things into a database that occasionally mangles\
    \ its contents. This is true even if the reliability comes at the expense of speed.\n\
    \nThe gold standard for reliability in the database world has an acronym, ACID\
    \ (Atomicity, Consistency, Isolation and Durability). This means that under all\
    \ circumstances in the database, the following hold true:\n\n- **Atomicity:**\
    \ each query is guaranteed to complete or not, without any possibility of halfway\
    \ or incomplete states.\n- **Consistency:** the database is always in a legal\
    \ state before and after a transaction.\n- **Isolation:** each transaction occurs\
    \ separately from other actions, so that you can't have two transactions interfering\
    \ with one another.\n- **Durability:** transactions persist over time, typically\
    \ by being stored on a filesystem.\n\nThe attitude toward ACID within the PostgreSQL\
    \ community has been unchanged since I first started to use it a decade ago, placing\
    \ it as the highest possible priority. This doesn't mean PostgreSQL is lacking\
    \ in other features, but rather it means the developers have worked to ensure\
    \ that data stored in a PostgreSQL system will be consistent and reliable, even\
    \ if you do nasty things such as issue a `kill -9` or pull the plug.\n\nDuring\
    \ the past few years, PostgreSQL has begun to offer even better support for transactions\
    \ and database stability, using write-ahead logs (WALs) that describe each action\
    \ taken by the database. These WAL files can be used to recover from a disaster\
    \ or even to recover the database to an earlier point in its history—a feature\
    \ known as point-in-time-recovery (PITR). Thus, if you know something happened\
    \ yesterday, but the database was working perfectly two days ago, you could use\
    \ PITR to recover to the earlier, stable state. Recent versions of PostgreSQL\
    \ also support two-phase commit, a type of transaction you're likely to see in\
    \ a distributed system where multiple servers must coordinate their actions.\n\
    \nMySQL has had a mixed attitude toward ACID during the years. When I first started\
    \ to use MySQL in 1995, the authors' attitude was that transactions should be\
    \ handled by the application, not the database. Indeed, as recently as 2000, the\
    \ to-do list for MySQL included tasks having to do with production-quality transaction-safe\
    \ tables. This has led to a great deal of bad blood between the MySQL and PostgreSQL\
    \ communities, with members of the latter sometimes claiming that no critical\
    \ data should ever be stored in MySQL.\n\nThe good news is that modern versions\
    \ of MySQL do indeed support transaction-safe tables, using InnoDB, a third-party\
    \ product released under the GPL that has been integrated into MySQL for several\
    \ years. Moreover, InnoDB appears to use techniques that PostgreSQL and Oracle\
    \ have used for years, such as MVCC (multi-version concurrency control). The bad\
    \ news is that at least some benchmarks I've seen indicate that InnoDB has some\
    \ problems scaling to large numbers of simultaneous queries.\n\nIn addition, the\
    \ company that develops InnoDB recently was bought by Oracle, which might lead\
    \ some people to worry about future licensing, development and pricing issues.\
    \ For the time being, this latter issue does not appear to be a serious one, because\
    \ Oracle and MySQL signed a contract in 2006 extending the licensing for InnoDB.\
    \ But, MySQL does not appear to be taking any chances and has hired several experts\
    \ to create a new table structure that will be owned by MySQL and thus be impervious\
    \ to such business problems.\n\nI’m personally of the persuasion that true ACID\
    \ compliance is always a good thing to have around, much like seat belts in a\
    \ car. Sure, you can drive without a seat belt, and the odds are that nothing\
    \ will happen to you. But, it’s impossible to predict when something bad might\
    \ happen, and you really don’t want to be without a seat belt under such circumstances.\
    \ In the same way, if you're a database enforces constraints and limits. PostgreSQL\
    \ tends to be quite stringent on such matters, refusing to accept illegal data.\
    \ MySQL tries to be more forgiving and flexible, but that can result in strange\
    \ and illegal data being stored.\n\nFor example, consider the following set of\
    \ MySQL commands, in which we create a table `foo` with a single column (named\
    \ `a`) of type `DATE`:\n\n```text\nmysql> CREATE TABLE foo (a date);\nQuery OK,\
    \ 0 rows affected (0.08 sec)\n\nmysql> INSERT INTO foo (a) VALUES ('2007-feb-30');\n\
    Query OK, 1 row affected, 1 warning (0.00 sec)\n\nmysql> SELECT * FROM foo;\n\
    +---------+\n| a       |\n+---------+\n| 0000-00-00 |\n+---------+\n1 row in set\
    \ (0.00 sec)\n```\n\nBy contrast, this is what happens in PostgreSQL:\n\n```text\n\
    atf=# CREATE TABLE foo (a date);\nCREATE TABLE\n\natf=# \\d foo\nTable \"public.foo\"\
    \nColumn | Type | Modifiers\n-----------|---------|-------------\na       | date\
    \  |\n\natf=# INSERT INTO foo (a) VALUES ('2007-feb-30');\nERROR:  date/time field\
    \ value out of range: \"2007-feb-30\"\n```\n\nIt is possible to configure MySQL\
    \ to be more strict on such issues, but most users will not think to do so and\
    \ will be stuck with illegal values in their tables.\n\nGiven the political and\
    \ technical issues at MySQL, as well as the weird (and potentially dangerous)\
    \ default behavior in MySQL, I believe that PostgreSQL has a big edge on issues\
    \ of data integrity.\n\n## Features\n\nMySQL and PostgreSQL offer a very large\
    \ number of built-in features, many of which have been added in response to community\
    \ requests and reactions. Both offer a large number of data types, which can be\
    \ mixed and matched within a single row without restrictions. (The very limiting\
    \ row-length restriction that plagued versions of PostgreSQL is now ancient history,\
    \ I’m happy to say.) Both databases now support Unicode characters; MySQL supports\
    \ both UCS-2 and UTF-8 encoding, and PostgreSQL supports only the latter.\n\n\
    Both databases also offer a very large number of functions that manipulate data,\
    \ including strings and dates. It’s quite convenient to be able to compare and\
    \ sort data or to find all rows whose timestamp was within the last 24 hours.\
    \ PostgreSQL interval data type, which describes a length of time (rather than\
    \ a particular point in time), has proven to be particularly useful. MySQL has\
    \ a number of different types that database purists like myself frown upon, such\
    \ as SET and ENUM, that are undoubtely popular for many users.\n\nIn many areas\
    \ where PostgreSQL has had an advantage, MySQL is beginning to catch up. PostgreSQL\
    \ users have long been able to create new data types and functions that operate\
    \ on those types. Indeed, PostgreSQL offers developers the unusual ability to\
    \ write server-side functions in a number of languages, including SQL, Perl, Python,\
    \ Java, Tcl and the R statistical language. MySQL does not allow for the creation\
    \ of new data types, but recent versions do provide the ability to write server-side\
    \ functions and stored procedures.\n\nMySQL has offered a built-in solution for\
    \ full-text search, accomplished by using a special type of index on text fields.\
    \ However, there are some important restrictions on this index, such as the fact\
    \ that it works only with MyISAM tables. Given that these tables support neither\
    \ foreign keys nor transactions, I am a bit nervous about suggesting them as a\
    \ solution.\n\nPostgreSQL’s full-text search solution (tsquery) has the opposite\
    \ problem. Although it is robust and works well with PostgreSQL’s standard transactional\
    \ tables, it requires some work to configure and install. Most administrators\
    \ and programmers will be able to install it successfully within a short period\
    \ of time, but nonetheless, there is a difference between a built-in capability\
    \ and one that needs to be added.\n\nPostgreSQL has a number of built-in features\
    \ that MySQL either has yet to implement or that are scheduled for future releases.\
    \ Among these are the ability to use subselects anywhere in a query, the use of\
    \ sequences (rather than simple auto-increment columns), rules that allow users\
    \ to modify the way queries are interpreted on a given table and CHECK constraints\
    \ on column values. Recent versions of MySQL now include features that were previously\
    \ available only in PostgreSQL, such as triggers and views.\n\nIn general, the\
    \ PostgreSQL development group seems to emphasize SQL standards more than MySQL\
    \ does, although the MySQL developers appear to be increasingly sensitive to this\
    \ need and now offer an --ansi command-line switch for those people who want to\
    \ work in a standards-compatible mode all of the time. Both MySQL and PostgreSQL\
    \ are extremely easy to use. Each\n"
  mdcn: "\n## 快速概览\n\n### 开源数据库，第三部分：如何选择数据库\n\n**哪个数据库最适合你？MySQL 还是 PostgreSQL？**\
    \  \nREUVEN M. LERNER\n\n如果你是一名应用程序开发人员，你很可能正在处理大量数据。而且，如果这些数据比哈希表稍微复杂一些，你可能就需要考虑将其中一部分或全部数据迁移到关系型数据库中。关系型数据库旨在可靠且灵活地检索数据。关系型数据库的魔力并不在于使用二维表来存储所有信息，而在于表可以通过许多不同的方式组合在一起，并使用\
    \ SQL 查询语言进行操作。\n\n正如我们在*Linux Journal*前两期的数据库文章中看到的那样，开源程序员很幸运，手头有好几种数据库可供选择。迄今为止，最受欢迎的两种开源关系型数据库是\
    \ MySQL 和 PostgreSQL。两者都拥有庞大且忠实的追随者，并且每个新版本都在持续改进。\n\n而且，当上面我写到“庞大且忠实的追随者”时，我并没有开玩笑。MySQL\
    \ 和 PostgreSQL 长期以来一直处于开源世界激烈争论的中心。如果有人在 Slashdot 上敢对其中一种产品说点什么，你可以肯定，要不了多久，就会有人写下关于另一种产品的刻薄（且常常幼稚）的评论。这些分歧往往反映了非专业用户的冲动态度，但也有一些著名且精通这些产品的用户参与了攻击。\n\
    \n我认为在某些情况下，MySQL 或 PostgreSQL 都可能是一个合适的选择。在过去十年的工作中，我们强烈偏好 PostgreSQL——然而，确实有些时候\
    \ MySQL 似乎是更合适的解决方案。因此，尽管存在我的个人偏见，以及引发开源社区内激烈争论的风险，我现在将通过在多个不同类别中比较 MySQL 和 PostgreSQL，来结束关于开源数据库的这一系列文章。我希望当你读完这篇文章时，能够明白选择数据库几乎从来不是寻找“最快”或“最好”的产品问题，因为并没有一种单一的方法来衡量关系型数据库服务器的质量或适用性。相反，我希望你能基于它们各自的优点来考虑每一个数据库，而不是基于那种无处不在的宣传。\n\
    \n## 数据完整性\n\n数据库的首要且可能也是最重要的任务是可靠地存储和检索数据。就像你不想使用一个偶尔会丢失数据的硬盘一样，你也不想向数据库写入偶尔会损坏其内容的数据。即使是以牺牲速度为代价来换取可靠性，这一点也依然成立。\n\
    \n在数据库领域，可靠性的黄金标准有一个缩写，即 ACID（原子性、一致性、隔离性和持久性）。这意味着在数据库的所有情况下，以下几点都成立：\n\n- **原子性**：每个查询都保证要么完成，要么不完成，不可能出现中间状态或不完整状态。\n\
    - **一致性**：数据库在事务之前和之后始终处于合法状态。\n- **隔离性**：每个事务都独立于其他操作发生，因此不可能有两个事务相互干扰。\n- **持久性**：事务随时间持久存在，通常通过存储在文件系统中实现。\n\
    \n自从我十年前开始使用 PostgreSQL 以来，PostgreSQL 社区对 ACID 的态度始终未变，将其置于最高优先级。这并不意味着 PostgreSQL\
    \ 缺少其他特性，而是意味着开发人员致力于确保存储在 PostgreSQL 系统中的数据始终一致且可靠，即使你做出了如发送 `kill -9` 信号或拔掉电源插头等恶劣操作。\n\
    \n在过去几年里，PostgreSQL 开始提供对事务和数据库稳定性更好的支持，使用了预写日志（WALs），其中描述了数据库执行的每个操作。这些 WAL 文件可用于从灾难中恢复，甚至可以将数据库恢复到现在其历史中的较早时间点——这一特性被称为基于时间的恢复（PITR）。因此，如果你知道昨天发生了某件事，但数据库在两天前运行得完美无缺，你可以使用\
    \ PITR 恢复到那个更早的稳定状态。最近版本的 PostgreSQL 还支持两阶段提交，这是一种你在分布式系统中可能看到的、需要多个服务器协调其操作的事务类型。\n\
    \n多年来，MySQL 对 ACID 的态度喜忧参半。当我在 1995 年首次开始使用 MySQL 时，作者们的态度是事务应该由应用程序处理，而不是数据库。事实上，直到\
    \ 2000 年，MySQL 的待办事项列表中仍包括与生产级事务安全表相关的任务。这导致了 MySQL 和 PostgreSQL 社区之间大量的不和，后者成员有时声称绝不应该在\
    \ MySQL 中存储任何关键数据。\n\n好消息是，现代版本的 MySQL 确实支持事务安全表，使用了 InnoDB，这是一个在 GPL 下发布的第三方产品，多年来已被集成到\
    \ MySQL 中。此外，InnoDB 似乎使用了 PostgreSQL 和 Oracle 多年来使用的技术，例如 MVCC（多版本并发控制）。坏消息是，至少我看过的一些基准测试表明，InnoDB\
    \ 在扩展到大量并发查询时存在一些问题。\n\n此外，开发 InnoDB 的公司最近被 Oracle 收购，这可能会让一些人担心未来的许可、开发以及定价问题。目前，后一个问题似乎并不严重，因为\
    \ Oracle 和 MySQL 在 2006 年签署了一份合同，延长了 InnoDB 的许可。但是，MySQL 似乎并不想冒险，并已聘请了几位专家来创建一种新的表结构，该结构将由\
    \ MySQL 拥有，从而不受此类商业问题的影响。\n\n就个人而言，我坚信真正的 ACID 合规性始终是一件好事，就像汽车中的安全带一样。当然，你可以不系安全带开车，而且很可能什么事都不会发生。但是，很难预测什么时候会发生坏事，而在这种情况下一定不希望没有安全带。同样，如果你是一个数据库它强制执行约束和限制。PostgreSQL\
    \ 在这些方面往往非常严格，拒绝接受非法数据。MySQL 试图更加宽容和灵活，但这可能导致奇怪且非法的数据被存储。\n\n例如，考虑以下 MySQL 命令集，我们在其中创建了一个名为\
    \ `foo` 的表，该表有一个名为 `a` 的单一列，类型为 `DATE`：\n\n```text\nmysql> CREATE TABLE foo (a\
    \ date);\nQuery OK, 0 rows affected (0.08 sec)\n\nmysql> INSERT INTO foo (a) VALUES\
    \ ('2007-feb-30');\nQuery OK, 1 row affected, 1 warning (0.00 sec)\n\nmysql> SELECT\
    \ * FROM foo;\n+---------+\n| a       |\n+---------+\n| 0000-00-00 |\n+---------+\n\
    1 row in set (0.00 sec)\n```\n\n相比之下，这在 PostgreSQL 中会发生什么：\n\n```text\natf=# CREATE\
    \ TABLE foo (a date);\nCREATE TABLE\n\natf=# \\d foo\nTable \"public.foo\"\nColumn\
    \ | Type | Modifiers\n-----------|---------|-------------\na       | date  |\n\
    \natf=# INSERT INTO foo (a) VALUES ('2007-feb-30');\nERROR:  date/time field value\
    \ out of range: \"2007-feb-30\"\n```\n\n可以配置 MySQL 使其在这些问题上更加严格，但大多数用户不会想到这样做，并且会在他们的表中遇到非法值而陷入困境。\n\
    \n鉴于 MySQL 的政治和技术问题，以及 MySQL 中奇怪（且潜在危险）的默认行为，我认为 PostgreSQL 在数据完整性问题上具有巨大优势。\n\
    \n## 特性\n\nMySQL 和 PostgreSQL 都提供了大量内置特性，其中许多是根据社区的要求和反馈添加的。两者都提供了大量数据类型，这些类型可以在单行中无限制地混合和匹配。（令人高兴的是，曾经困扰\
    \ PostgreSQL 版本的非常有限的行长度限制现在已是古老的历史。）两个数据库现在都支持 Unicode 字符；MySQL 同时支持 UCS-2 和\
    \ UTF-8 编码，而 PostgreSQL 仅支持后者。\n\n两个数据库还提供了大量用于操作数据的函数，包括字符串和日期。能够比较和排序数据，或查找时间戳在过去\
    \ 24 小时内的所有行，这是非常方便的。PostgreSQL 的区间数据类型，它描述一段时间（而不是特定时间点），被证明特别有用。MySQL 有一些不同的数据类型，我们这些数据库纯粹主义者对此皱眉头，例如\
    \ SET 和 ENUM，但它们无疑深受许多用户的欢迎。\n\n在许多 PostgreSQL 具有优势的领域，MySQL 开始赶上来了。PostgreSQL\
    \ 用户长期以来一直能够创建新的数据类型以及操作这些类型的函数。事实上，PostgreSQL 为开发人员提供了罕见的能力，可以使用多种语言编写服务器端函数，包括\
    \ SQL、Perl、Python、Java、Tcl 和 R 统计语言。MySQL 不允许创建新的数据类型，但最近版本提供了编写服务器端函数和存储过程的能力。\n\
    \nMySQL 提供了内置的全文搜索解决方案，这是通过对文本字段使用特殊类型的索引实现的。然而，这种索引有一些重要的限制，例如它仅适用于 MyISAM 表。鉴于这些表既不支持外键也不支持事务，我建议将它们作为解决方案时会感到有些不安。\n\
    \nPostgreSQL 的全文搜索解决方案（tsquery）则存在相反的问题。虽然它非常健壮，并且与 PostgreSQL 的标准事务表配合良好，但配置和安装它需要一些工作。大多数管理程序和程序员能够在短时间内成功安装它，但尽管如此，内置功能与需要添加的功能之间仍存在差异。\n\
    \nPostgreSQL 具有一些内置特性，MySQL 尚未实现或计划在未来版本中提供。其中包括在查询的任何位置使用子选择的能力、使用序列（而非简单的自增列）、允许用户修改对特定表的查询解释方式的规则以及针对列值的\
    \ CHECK 约束。MySQL 的最近版本现在包括以前仅在 PostgreSQL 中可用的特性，例如触发器和视图。\n\n总体而言，PostgreSQL\
    \ 开发组似乎比 MySQL 更强调 SQL 标准，尽管 MySQL 开发人员似乎越来越重视这一需求，并现在为那些希望始终在标准兼容模式下工作的人提供了 --ansi\
    \ 命令行开关。MySQL 和 PostgreSQL 都极其易用。每个\n\n"
