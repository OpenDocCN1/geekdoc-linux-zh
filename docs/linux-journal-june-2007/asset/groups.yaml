    ## 快速了解


    附带了一个功能丰富的命令行客户端程序，允许您通过发送 SQL 查询来操纵数据库。我已经习惯了 PostgreSQL 命令行中的一些功能，例如扩展输出（\x）。这两个数据库的命令行接口随着时间推移变得更有用。虽然
    MySQL 接口看起来命令较少，但这部分是因为 MySQL 已通过 SQL 查询（例如，SHOW TABLES）提供了部分数据，而在 PostgreSQL
    中这需要更复杂的查询，从而催生了简写命令 \d。两个命令行接口都使用 GNU readline，使得编辑和重新发送查询变得容易。两者都允许用户使用 \e 命令编辑前一条查询。


    总体而言，可以说 PostgreSQL 提供了 MySQL 功能的一个超集，除了少数问题（例如，内置文本索引）外。PostgreSQL 不具备的那些功能，例如新的数据类型和函数，可以轻松地添加到系统中，无需重新编译或以其他方式修改核心
    PostgreSQL 源代码。话虽如此，我认为 MySQL 的功能不容小觑，对于您可能正在编写的多数应用程序来说已经足够。


    ## 管理


    MySQL 和 PostgreSQL 都极其容易管理，尤其是在中小规模场景下。您可以（可选地）更改少量配置选项，启动服务器，然后就可以去忙别的了。确实没有多少其他事情要做。对于任何处理过更大数据库系统（如
    Oracle）的人来说，这是一种耳目一新的改变。然而，两个系统的操作方式存在一些细微差异。


    PostgreSQL 依赖几个外部 UNIX 级命令来创建和管理数据库及用户，以及监控 PostgreSQL 服务器的活动。PostgreSQL 没有中央管理程序。相比之下，MySQL
    有一个中央 mysqladmin 程序，处理大部分与服务器启动和关闭有关的功能，以及数据库的创建和销毁。用户的创建和管理通过操纵 mysql 数据库中的表来处理。


    PostgreSQL 中与 mysql 数据库对应的部分是特殊的系统表和视图，它们都以 pg_ 前缀开头。这些表对于系统运行是必需的，但大多数程序员可以轻松忽略它们，只有在尝试调整系统或弄清楚如何优化查询时才会用到。


    两个程序都有基于 GUI 的管理工具，以及基于 Web 的 PHP 编写工具。说实话，由于我对命令行系统的熟悉（和偏好），我在过去几年里很少使用这些 GUI
    工具。然而，我对这两组 GUI 程序的使用体验都是积极的，我的印象是它们既稳定又安全，而且有用。


    PostgreSQL 管理的一个独特方面是需要对数据库中的“死”行进行“真空清理（vacuum）”，将它们返回给操作系统或供其他可能受益于该空间的行使用。此外，PostgreSQL
    的 vacuum 功能会访问死行，并使用其收集的统计信息来通知优化器和查询计划器。如今，auto-vacuum 守护进程自动为大多数人处理了这件事，消除了长期以来令人畏惧的在
    cron 中调度它的需要。


    当前特别热门的管理领域之一是复制。许多 Web 站点和其他应用正在推高其数据库服务器的极限，将工作分摊到多个服务器上将是有用的。当然，这引发了分布式进程之间的数据完整性和同步问题。该问题的简单解决方案是在不同服务器之间建立主/从关系，UPDATE
    和 INSERT 操作仅在主服务器上执行，而 SELECT 操作在从服务器上执行。MySQL 和 PostgreSQL 都有针对此的解决方案，尽管 PostgreSQL
    的解决方案（Slony）是标准软件包外部的，且显然安装和配置可能比较困难。


    更复杂的设置涉及使用两个主数据库服务器。MySQL 似乎在这方面处于领先地位，拥有一个相对较新的集群工具。但是，PostgreSQL 用户多年来一直在渴望这样的工具，他们似乎即将如愿以偿。


    最后，如果不能执行定期备份，任何数据库服务器都没有价值。pg_dump 和 mysqldump 是将数据库当前内容转换为文本文件的命令行程序。这些转储文件非常有用，必要时可用于重建数据库。


    我会争辩说，就管理而言，这两个数据库服务器是相同的——除非您需要复制，在这种情况下，我可能会受益于 MySQL 更丰富的经验和复制集成。


    ## 性能


    多年来，MySQL/PostgreSQL 争论中的一个观点一直与速度有关。MySQL 粉丝常常声称他们的系统更快，特别是对于只读任务，使其成为大多数数据为读取的
    Web 站点的更优选择。相比之下，PostgreSQL 的支持者声称他们的系统比 MySQL 更能承受大负载。


    我还没有进行自己的基准测试，但我对此的不情愿承认我没有资格创建良好的基准测试，而不是认为两个系统相同或性能不重要。此外，正如我前面所述，我认为性能次于数据完整性。我宁愿有一个慢速但可靠的数据库，也不愿有一个快速但偶尔会破坏我数据数据库。


    从我见过的基准测试来看，MySQL 在处理少量客户端或只读数据时确实比 PostgreSQL 更快。然而，我在过去几年中看到的所有比较都表明，随着更多客户端添加到系统中，PostgreSQL
    更好地处理负载。


    这意味着 PostgreSQL 总是更快吗？当然不是。但这确实意味着在特别受欢迎的站点上，PostgreSQL 可能表现更好。


    也许我只是天真，但几年前我决定在涉及数据库时很大程度上忽略性能争论。MySQL 和 PostgreSQL 都有大量的追随者，并已被用于大规模系统。数据似乎表明
    PostgreSQL 具有优势，但足够多的人在大型 Web 站点上使用 MySQL，我必须假设它对他们来说运行得足够好。


    ### 资源


    PostgreSQL 主页是 **www.postgresql.org**。类似地，MySQL 主页是 **www.mysql.org**。每个主页都发布了最新的手册，以及软件、驱动程序和讨论列表。


    在 **linuxboxadmin.com/articles/postgresql-for-mysql-users.php** 上可以找到一个比较两个数据库的管理和编程的表格。


    在 **www.mysqlperformanceblog.com/2006/11/30/interesting-mysql-and-postgresql-benchmarks**
    上有一个相对较新的两个数据库性能比较，它指向 **tweakers.net/reviews/657**。


    最后，在 CERN（欧洲粒子物理中心）进行了一次数据库比较（但也可能有些过时），还包括 Oracle，可在 **dccdbpilot.cern.ch:8080/dcdb/archive/trace2y/db_compare/db_compare.html**
    上获取。


    ### 支持


    最后，如果不提及支持，任何比较都不完整。我们可以考虑几种类型的支持——从开源社区的强度，到支持（并开发）软件的公司数量和质量，到支持每个数据库的第三方应用程序的数量。


    不可能忽视世界上数量极其庞大的 MySQL 用户。这导致了 MySQL 书籍、教程和邮件列表的大量涌现——其中一些（但不是全部）由 MySQL 公司本身赞助。如果基于社区的支持不够，可以从包括
    MySQL AB 在内的多家公司购买 MySQL 的商业支持。


    PostgreSQL 的社区较小，可用的书籍和教程数量也较少。然而，我的经验是该社区对问题和建议反应迅速，而且主要开发人员通常很乐意回答来自各级别用户的问题。


    许多开源软件包同时支持 MySQL 和 PostgreSQL，但很难找到仅支持 PostgreSQL 的软件包，而很容易找到仅支持 MySQL 的软件包。这一直是
    PostgreSQL 社区成员的挫折来源；然而，除了请求补丁或贡献此类补丁外，似乎没有人能对此做什么。


    PostgreSQL 主要邮件列表最近的一个帖子询问了支持该数据库的 CRM 软件包。虽然有一些，但确实对其他开源项目缺乏 PostgreSQL 支持有些抱怨。这些项目通常由小规模的志愿者小组负责，他们很少理解如何使其
    SQL 更具可移植性，从而更容易在多种品牌的数据库上使用。


    关于支持的底线是，尽管 PostgreSQL 支持非常出色，但 MySQL 的支持是压倒性的。如果这里有一个赢家，那就是 MySQL。


    ### 结论


    那么，对于您的下一个数据库任务，您应该选择 MySQL 还是 PostgreSQL？在所有方面都相等的情况下，我强烈推荐 PostgreSQL。它的社区可能较小，印刷品和网络上的可用资源较少。但是，它拥有更多确保数据完整性的功能，其功能在很大程度上是
    MySQL 的超集，并且始终提供事务和引用完整性，而无需指定特定的表类型。


    话虽如此，使用 MySQL 也有理由：如果您已经在使用它，如果您需要商业或社区支持，如果您需要复制，或者如果您使用的软件与 PostgreSQL 不兼容，MySQL
    是一个不错的选择。只需确保使用 InnoDB 表，以便您可以利用数据库始终旨在做的事情——确保数据质量。


    Reuven M. Lerner，一位资深的 Web/数据库顾问，是伊利诺伊州埃文斯顿西北大学学习科学系的博士候选人。他目前与妻子和三个孩子住在伊利诺伊州斯科基。您可以在
    althedotnerd.co.il 阅读他的博客。


