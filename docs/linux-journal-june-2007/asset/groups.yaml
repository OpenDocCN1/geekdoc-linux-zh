    \            input.close()\n            conn.close()\n```\n\nAny arguments that\
    \ the visitor passes to the program end up in the single CGI parameter QUERY_STRING.\
    \ In this case, the parameter would read “pizza=hamaii&drink=beer”. Here’s something\
