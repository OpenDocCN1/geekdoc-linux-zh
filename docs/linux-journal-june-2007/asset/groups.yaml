  mdcn: "\n## 封装行为\n\n如果我们无法添加新帖子，博客就不成其为博客，所以让我们这样做：\n\n```\n>>> blog = blog + ['A\
    \ new post.']\n>>> blog\n['My first post', 'Python is cool', 'A new post']\n```\n\
    \n在这里，我们将 blog 设置为一个新值，该值由旧的博客和一个新帖子组成。仅仅为了添加一个新帖子而记住所有内容并不令人愉快，因此我们可以将其封装在所谓的函数中：\n\
    \n```\n>>> def add_post(blog, new_post):\n...      return blog + [new_post]\n\
