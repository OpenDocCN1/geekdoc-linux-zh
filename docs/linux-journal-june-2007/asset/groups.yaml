    实时计算专家 Concurrent 在 2007 年 4 月发布了三款新产品，即其 RedHawk Linux 4.2、NightStar Tools 4.1
    和 SIMulation Workbench。首先，Concurrent 的实时 Linux 操作系统 RedHawk 的新版本拥有 2.6.18.8 Linux
    内核，包含 Ingo Molnar 接受的大量实时补丁，性能和稳定性增强，支持最新的英特尔四核处理器以及 AMD Opteron 处理器上的 32/64 位操作系统。其次，NightStar
    Tools 4.1 是用于开发时间关键应用的集成工具包，增加了基于 Qt 的增强 GUI、应用照明功能以及调优增强。最后，SIMulation Workbench
    是一款新的仿真软件产品，旨在简化实时建模，提供一个完整的框架来开发和执行实时硬件在环仿真。


    www.ccusr.com


    ![](img/526fd434dcfcf1b461b94c24ea170f36_42_1.png)


    ### Pogo Linux 的 StorageDirector 3000


    我们的朋友 Pogo Linux 传来了其新款网络附加存储 (NAS) 设备系列 StorageDirector 3000 的消息。StorageDirector
    背后的理念是采取“简单、高效的存储管理方法”，利用开放架构降低成本，同时“仍然提供高端功能集”，目标用户是 Pogo 的客户——“具有企业野心的中小企业 (SMB)”。由定制的
    StorageDirector 操作系统驱动，新产品线可实现以下功能：通过 Web 浏览器简单、安全地管理存储和备份；跨平台文件共享并利用所有主要文件共享协议；灾难恢复和备份；多路径、高级监控和警报，以及硬件和软件
    RAID，包括 RAID 6（双奇偶校验）。客户可以在 Pogo 的网站配置自己的 StorageDirector 3000。


    www.pogolinux.com/go/sd3000


    ![](img/526fd434dcfcf1b461b94c24ea170f36_42_2.png)


    ![](img/526fd434dcfcf1b461b94c24ea170f36_42_3.png)


    ### Woven Systems 的 EFX-1000 以太网 Fabric 交换机


    Woven Systems 为其新的交换机产品 EFX-1000 投入了巨额的 VC 资金。Woven 表示，最终结果是新一代以太网 Fabric 交换机的首款产品，旨在满足多核服务器、服务器整合和虚拟化、IP
    存储及数据中心网格伴随的需求。以太网 Fabric 交换机可以互连以构建“具有韧性、低延迟、无阻塞的网状第 2 层 Fabric，可扩展至 4,000 多个
    10GbE 端口”。10GbE EFX-1000 交换机“结合了 InfiniBand 的性能和低成本、光纤通道的可靠性以及以太网的即插即用互操作性”，且每端口的价格大幅降低。Woven
    Systems 被 *Byte and Switch* 出版物评为“十大值得关注初创公司”之一，因其“具有潜在颠覆性的数据中心技术”，同时也被 Gartner
    Group 评为“酷厂商 (Cool Vendor)”。


    www.wovensystems.com


