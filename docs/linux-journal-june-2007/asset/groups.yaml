    was an RPM. And, yes, if you were resolute, you could force it in there, but fundamentally,
    Java just wasn''t available for Debian.


    We felt that the biggest impact we could have on the Java market was by settling
    the long dispute with the GNU/Linux community. We felt that doing that would grow
    the market to everyone''s benefit.


    As an application developer on GNU/Linux, you don''t want to have to worry which
