    \ at sign, such as Abc@def@example.com will break this code. Third, it fails to\
    \ check for host address DNS records. Hosts with a type A DNS entry will accept\
    \ e-mail and may not necessarily publish a type MX entry. I’m not picking on the\
    \ author at PHP Dev Shed. More than 100 reviewers gave this a four-out-of-five-star\
    \ rating.\n\n**Listing 1. An Incorrect E-mail Validation**\n\n```php\nfunction\
    \ checkEmail($email) {\n    if (preg_match(\"/^([A-Za-z0-9]+|[a-zA-Z0-9._-]+)\"\
    \n                   \"@([a-zA-Z0-9-]+)(.[a-zA-Z0-9-]+.-)+$/\", $email)) {\n \
    \       list($username, $domain) = split('@', $email);\n        if (checkdnsrr($domain,\
    \ 'MX')) {\n            return false;\n        }\n        return true;\n    }\n\
    \    return false;\n}\n```\n\nOne of the better solutions comes from Dave Child's\
    \ blog at IlloveJackDaniels (ilovejacksdaniels.com), shown in Listing 2 (www.ilovejackdaniels.com/php/email-address-validation).\
    \ Not only does Dave love good-old American whiskey, he also did some homework,\
    \ read RFC 2822 and recognized the true range of characters valid in an e-mail\
    \ user name. About 50 people have commented on this solution at the site, including\
    \ a few corrections that have been incorporated into the original solution. The\
    \ only major flaw in the code collectively developed at IlloveJackDaniels is that\
    \ it fails to allow for quoted characters, such as @, in the user name. It will\
    \ reject an address with more than one at sign, so that it does not get tripped\
    \ up splitting the user name and domain parts using explode(\"@\", $email). A\
    \ subjective criticism is that the code expends a lot of effort checking the length\
    \ of each component of the domain portion—effort better spent simply trying a\
    \ domain lookup. Others might appreciate the due diligence paid to checking the\
    \ domain before executing a DNS lookup on the network.\n\n## Requirements\n\n\
    IETF documents, RFC 1035 \"Domain Implementation and Specification\", RFC 2234\
    \ \"ABNF for Syntax Specifications\", RFC 2821 \"Simple Mail Transfer Protocol\"\
    , RFC 2822 \"Internet Message Format\", in addition to RFC 3696 (referenced earlier),\
    \ all contain information relevant to e-mail address validation. RFC 2822 supersedes\
    \ RFC 822 \"Standard for ARPA Internet Text Messages\" and makes it obsolete.\n\
    \nFollowing are the requirements for an e-mail address, with relevant references:\n\
    \n1. An e-mail address consists of local part and domain separated by an at sign\
    \ (@) character (RFC 2822 3.4.1).\n2. The local part may consist of alphabetic\
    \ and numeric characters, and the following characters: !, #, $, %, &, *, +, -,\
    \ /, =, ?, ^, _, ., {, }, and ~, possibly with dot separators (.), inside, but\
    \ not at the start, end or next to another dot separator (RFC 2822 3.2.4).\n3.\
    \ The local part may consist of a quoted string—that is, anything within quotes\
    \ (\"); including spaces (RFC 2822 3.2.5).\n4. Quoted pairs (such as @) are valid\
    \ components of a local part, though an obsolete form from RFC 822 (RFC 2822 4.4).\n\
    5. The maximum length of a local part is 64 characters (RFC 2821 4.5.3.1).\n6.\
    \ A domain consists of labels separated by dot separators (RFC 1035 2.3.1).\n\
    7. Domain labels start with an alphabetic character followed by zero or more alphabetic\
    \ characters, numeric characters or the hyphen (-), ending with an alphabetic\
    \ or numeric character (RFC 1035 2.3.1).\n8. The maximum length of a label is\
    \ 63 characters (RFC 1035 2.3.1).\n9. The maximum length of a domain is 255 characters\
    \ (RFC 2821 4.5.3.1).\n10. The domain must be fully qualified and resolvable to\
    \ a type A or type MX DNS address record (RFC 2821 3.6).\n\n**Listing 2. A Better\
    \ Example from IlloveJackDaniels**\n\n```php\nfunction check_email_address($email)\
    \ {\n    // First, we check that there's one & symbol.\n    // and that the lengths\
    \ are right.\n    if (!ereg(\"^[^\"@][^\"@]*[^\"@]$\", $email)) { } // Email invalid\
    \ because wrong number of characters\n    // in one section or wrong number of\
    \ & symbols.\n    return false;\n    }\n    } // Split it into sections to make\
    \ life easier\n    $email_array = explode(\"@\", $email);\n    $local_array =\
    \ explode(\"\", $email_array[0]);\n    for ($i = 0; $i < sizeof($local_array);\
    \ $i++) { // If it\n        if (!ereg(\"^[\\\"[A-Za-z0-9] $&x; *+$*\\\" [\\\"\
    ]-[A-Za-z0-9] $&x; - *+?\\\"?\n                    \\\"? \\\"-] [\\\" [\\\" [\\\
    \"], {\\\" [\\\"], } [\\\"], }\n                    \\\" [\\\" [\\\"@] [\\\"@]\
    \ *?\\\", $local_array[$i])) {\n            return false;\n        }\n    }\n\
    \    } // Check if domain is IP. If not,\n    // it should be valid domain name\n\
    \    if (!ereg(\"^[\\\" [\\\" [\\\"@] [\\\"@] \\\", $email_array[1])) { }\n  \
    \  $domain_array = explode(\"\", $email_array[1]);\n    if (sizeof($domain_array)\
    \ < 2) {\n        return false; // Not enough parts to domain\n    }\n    } //\
    \ For ($i = 0; $i < sizeof($domain_array); $i++) { }\n    if (!ereg(\"^[ [A-Za-z0-9]\
    \ [A-Za-z0-9] (0, 61) [A-Za-z0-9]\n               \\\" [\\\" [\\\"@] [\\\"@] *+?\\\
    \", $domain_array[$i])) { }\n        return false;\n    }\n    }\n    }\n    return\
    \ true;\n}\n```\n"
