  - "[PAGE 29]\n\n# WORK THE SHELL\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_29_0.png)\n\
    \n# Dave Taylor\n\n# Displaying Image Directories in Apache, Part III\n\nThe incredible\
    \ shrinking script knows a better way to resize your thumbnails.\n\nIn last month's\
    \ column, we built our directory display script to the point where you could get\
    \ a smart listing that showed your image files (offering links to any other file\
    \ type), and we allowed thumbnails to be displayed too.\n\nThe latter trick is\
    \ done by letting the Web browser do the work. If you specify a height or width\
    \ that's different from the actual image size, Web browsers automatically scale\
    \ the image to fit the specified dimensions. Even better, if you specify only\
    \ one dimension, it scales proportionally to fit.\n\nLet me explain that just\
    \ a wee bit more, because it's critical to this particular scripting project.\
    \ If you have an image that's 250x250 pixels and you'd like to display a 75x75\
    \ thumbnail, the best practice is to specify both height=\"75\" and width=\"75\"\
    , of course. The problem is, what if the image is actually 250x317 and you want\
    \ to reduce it to exactly 75 pixels wide. How tall should it be?\n\nYou could\
    \ do the math, of course, but it's much nicer to let the browser do the work for\
    \ you automatically, which happens if you specify only width=\"75\" or use a full\
    \ HTML statement:\n\n```\n<img src=\"my250x317.png\" width=\"75\" />\n```\n\n\
    Doing that scales it, and you end up with an image that's exactly 75x95 pixels\
    \ in size. However, if you always constrain one dimension, things can break. What\
    \ if the image is actually 250x1100, because it's a very tall graphic? Now the\
    \ thumbnail is going to break the entire layout, because the scaled version of\
    \ it is 330 pixels wide, quite a bit more than the 75x75 target box for the image!\n\
    \nThat's why an ideal script would figure out which of the dimensions is larger,\
    \ and then constrain that one to the size of the box we seek, letting the other\
    \ scale proportionally automatically, thanks to the Web browser. And, that's exactly\
    \ what we'll do!\n\nBig Important Caveat: I realize there's a significant performance\
    \ penalty for letting the browser scale images—the entire full-size image has\
    \ to be downloaded, even though you're seeking a smaller version. If it was a\
    \ problem, you could use a tool such as ImageMagick to scale the images and create\
    \ thumbnail graphics that were displayed instead, probably dropping them into\
    \ a cache and creating new ones on the fly as needed. But honestly, don't you\
    \ have a high-bandwidth Internet connection, and does an additional second or\
    \ two of load time really matter?\n\n# On to the Script!\n\nLast month, we created\
    \ the darn useful function figurerize, which, when given a graphic image, returned\
    \ height and width parameters than those could be calculated. The resultant main\
    \ loop in the script ended up looking like this:\n\n```\n```\nfor name in *\n\
    do\n    if [ ! -z \"$(file -b $name|grep 'image data')\" ]\n    then\n       \
    \ figurerize $name\n        if [ ! -z \"$height\" ] ; then\n            echo \"\
    <img src=$name alt=$name height=50 />\"\n            echo \"<br />$name ($height\
    \ x $width)<br />\"\n        else\n            echo \"<img src=$name alt=$name\
    \ height=50 />\"\n            echo \"<br />$name<br />\"\n        fi\n    else\n\
    \        echo \"<a href=$name>$name</a><br />\"\n    fi\ndone\n```\n```\n\nIf\
    \ you read the code closely, it's really not doing anything smart with the height\
    \ and width parameters, just displaying them in the output. Instead, let's turn\
    \ that into a test to figure out which is larger. Before I do that though, we\
    \ need to make some rudimentary improvements to the loop so the output is more\
    \ attractive:\n\n```\n```\nfor name in *\ndo\n```\n\n```"
