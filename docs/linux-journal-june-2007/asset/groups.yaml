    \n## 以正确的方式使用 PHP 验证电子邮件地址\n\n开发一个用于验证电子邮件地址的可用 PHP 函数。\n\n### 道格拉斯·洛维尔\n\n由 John\
    \ Klensin 撰写的互联网工程任务组（IETF）文档 RFC 3696《名称检查和转换的应用技术》给出了几个有效的电子邮件地址，而这些地址被许多 PHP\
    \ 验证例程所拒绝。地址 Abc@def@example.com、customer/department-shipping@example.com 和 !I#fI%y2¢g&6@c@example.com\
