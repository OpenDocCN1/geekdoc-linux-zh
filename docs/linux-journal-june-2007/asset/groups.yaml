    如需更多信息，请访问\nwww.tyanpsc.com\n\n## 来信\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_9_0.png)\n\
    \n### 赞美 Linux 游戏\n\n我越来越被 Linux 上游戏种类的多样性和质量所打动。其中大多数都很健康，这一点我很欣赏，因为我不喜欢屏幕上的暴力，也不喜欢现实中的暴力。你们是否考虑过增加一个专门介绍\
    \ Linux 游戏的栏目？我敢打赌很多人都会读。顺便说一下，我非常喜欢 Marcel Gagné 的文章，并尝试了他提到的很多程序。阅读 *LJ* 是了解有趣软件的好方法。请继续保持良好的工作！\n\
    \n> *—— 麦克·福特*\n\n### 现在你用 Linux 烹饪了\n\n我想回应一下针对加内先生的批评者。马塞尔的专栏为 Linux 新手提供了不会让他们感到吃力或超出他们需求的话题。不同的写作风格/格式使该专栏对\
    \ Linux 新手更具吸引力。\n\n通过吸引新的桌面用户，加内先生为 Linux 社区做出了巨大贡献。加内先生作为专业作家和公民都在这样做。证据可以在加内先生的\
    \ WFTL-LUG 中找到。我建议那些抱怨的人加入 WFTL-LUG，亲自去看看。也许他们可以在 LUG 中做出一些贡献，而不是进行这种无建设性的消极批评。\n\
    \n顺便说一下，2007 年 3 月刊非常棒。请继续保持良好的工作。\n\n> *—— 约翰·克尔*\n\n### 忽见忽不见\n\n在 2007 年 4\
    \ 月刊中，克里斯·特雷纳在他题为“忽见忽不见”的信中指出，Konqueror 不再允许用户右键点击文件并看到删除选项。确实，默认情况下没有这个选项。但是，如果你进入设置→配置\
    \ Konqueror→行为，你会看到一个名为“显示删除上下文菜单项”的选项，它绕过了回收站。勾选这个框，右键菜单中就会出现删除选项。感谢你们出色的出版物！\n\
    \n> *—— 德怀特·米德尔布罗克*\n\n*谢谢你为我们澄清了这个问题！——编辑。*\n\n### Doc Searls，iPhone 回家路\n\n\
    在 2007 年 4 月刊第 42 页，由 Doc Searls 撰写的“既然我们可以制造自己的 OpenPhone，为什么要用 iPhone？”一文中，提到\
    \ ANA 通过手机直接与客户联系这一上下文具有误导性。我曾在日本与三大运营商合作：NTT DoCoMo、AU 和 Yahoo Keitai（原日本维珍）。是的，有一个\
    \ IC 系统允许乘客快速检票。是的，ANA 会获取有多少人使用该系统的统计数据，但 JAL 也有这个系统，日本铁路（JR 东海和 JR 西日本）也是如此。该技术基于索尼的非接触式\
    \ IC 芯片。但是，系统由各手机运营商控制。运营商还控制运行 IC 芯片的 Java 小程序，因此他们也可以获取谁在使用该系统的数据。日本这里的运营商控制其服务使用的手机。这并不像美国那么糟糕，因为这里只有三个封闭系统。但是，客户没有权利。使用锁定的\
    \ SIM 芯片，你无法获取解锁码。直到去年，都没有号码携号转网功能。仅仅在过去五年里，日本手机才可以在没有运营商许可的情况下在海外使用。与最终用户的互动程序是不可能的。另外一个评论，IC\
    \ 手机存在的唯一原因是铁路系统开始使用 IC 车票——JR 占铁路的大部分，大部分人口每天乘坐这些火车。\n\n> *—— 罗伯特·巴尔富尔*\n\n###\
    \ 手机封闭系统\n\nDoc，你没提到最糟糕的手机封闭系统 [《LJ》，2007 年 4 月，“既然我们可以制造自己的 OpenPhone，为什么要用 iPhone？”]：那套让手机无法直接相互通信的致残系统。无论手机软件开发发生什么，只要网络模式没有从当前的客户端/服务器系统转变为无限制的点对点自组网模型，这个封闭系统就会成为进步不可逾越的障碍。\n\
    \n这种转变无疑是颠覆性技术。因此，它可能会遵循典型的颠覆性技术发展路径。它会被现有的技术提供商忽视、嘲笑、游说反对并积极抵制，直到它们变得无关紧要并被其取代并征服世界。\n\
    \n如果这项技术在卡特里娜飓风袭击新奥尔当时就已经在使用会怎样？只要区域内至少有一部手机在另一部手机的范围内，就不会出现任何通信问题，即使在风暴顶峰也是如此。救援人员不必等待数天或数周等待基础设施重建才能进行基本通信。\n\
    \n相反，灾区有数千部手机在正常工作，却被封闭系统所有者的通信限制完全废掉了。\n\n无线通信的未来早已在互联网的形式中清晰可见。一个自组织、自愈合的全球网络是一种不可阻挡的力量。下一步明显的举措是移除线缆，遵循自由软件的传统，通过自下而上的方式，通过实际行动来实现。\n\
    \n> *—— 卡尔·布朗*\n\n### 禁止 Novell 还是收购 SCO？\n\n几期前 [2007 年 3 月，《变化》]，尼古拉斯·佩特利在 Novell\
    \ 与微软签署协议后呼吁禁止 Novell。今天，我在 Slashdot 上读到 Novell 声称“Windows 比 Linux 便宜”（[news.zdnet.co.uk/software/0,1000000121,39286295,00.html](https://news.zdnet.co.uk/software/0,1000000121,39286295,00.html)）。\n\
    \n我给 Novell 的建议是：收购 SCO。它们似乎都在走同一条路。\n\n> *—— 保罗·阿曼*\n\n### 关于戴尔文章的消息\n\n作为 *LJ*\
    \ 的常客，我必须告诉你戴尔的一个好消息。肯定是因为那篇题为“对迈克尔·戴尔的温和 GNU/Linux 提议”的文章（来自\n\n"
