    long-lived company I can think of that used open source as the basis of a business
    model. If you look back down Sun''s history, through the decades, you see it has
    kept on working openly with communities around software and hardware. It did it
    with NFS, it did it with TCP/IP, it did with Java, and it''s continuing to do
    it now with OpenSolaris and the rest of the portfolio. So, in one sense, there
    were always and there remains a very, very strong open source ethos at Sun.


    When I joined Sun, Sun was right at the forefront of some really quite radical
    commercial open-source experiments—one of them, starting OpenOffice.org, and the
    other, getting NetBeans started. Inside Sun, people were talking strongly about
    the open-source


    future for Solaris because its heritage had been open source, and it was pretty
    clear that it was a good thing for its future to be open source as well. So, it
    was 2000/2001 that the legal clearance work for Solaris started off.


    **GM: What did that involve?**

    **SP:** The process you have to go through when you''ve got a piece of 20-year-old
    code is working out who owns it all. It''s actually a reasonably intractable problem,
    because over the decades, the standard of proof has gradually gotten stronger
    and stronger. Just because there''s nothing in the file header, doesn''t mean
    it doesn''t belong to someone else. Someone else might have the right to it. So
    we had an absolutely stunning team of people in the Solaris group who did what
    you might call licensing archaeology—looking at the code, comparing it with other
    code whose provenance was known, looking at variable naming styles and indentation
    styles, the language of the comments, trying to get a reasonable standard of proof
    about where the code had come from.


    There are things that were much more obvious as to where they''d originated, and
    we were able to look back in our legal archives at the licenses and work out whether
    we had the rights. And, for quite a lot of those we then had to go back and negotiate
    third-party sublicensability. In many


    cases, we found that people were perfectly happy just to give us that right. There
    were some cases where we found the licensee didn''t exist any more; finding out
    who abandoned code belongs to is another art form.


    Something else you have to look out for is code that was based on disclosure of
    information where the disclosure itself was under trade secret terms. So, although
    we''d written the code, we didn''t actually have the right to disclose it, because
    to do so would have disclosed the trade secrets. And, we still have problems with
    some of that code, in particular from video card manufacturers, where they were
    willing to tell us under trade secret terms how their chipset works, but they
    continue to refuse to allow us actually to disclose the source code.


    **GM: Presumably parallel to what you were thinking about licenses—how did you
    end up with the CDDL license?**

    **SP:** Solaris flowed out of BSD. It was actually BSD merged with System V at
    one point, so there were a lot of people who felt that we should be using BSD
    as a license. However, a lot of the innovations that have happened in Solaris
    have been by quite recently hired people—younger, brilliant engineers. And, there
    was a strong view as well that we should be using the GPL. Also, there were a
    lot of people who felt that the Mozilla approach to'
