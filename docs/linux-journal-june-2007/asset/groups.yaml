  mdcn: "\n\n# 特性：使用 Qt 4.x 实现异步数据库访问\n\n检查。然而，设计并妥善处理所有事件可能是一项艰巨的任务，尤其是当你的应用程序需要执行多种类型的数据库查询，具有多种返回类型，每种类型都需要关联的事件和事件处理器时，情况更是如此。\n\
    \n幸运的是，Qt 允许在不同线程之间连接信号和槽——只要这些线程正在运行它们自己的事件循环。与发送和接收事件相比，这是一种更简洁的通信方法，因为它避免了在任何非平凡应用程序中变得必要的簿记工作和中间\
    \ QEvent 派生类。线程间的通信现在变成了将一个线程的信号连接到另一个线程的槽，而线程间交换数据时的静默和线程安全问题由 Qt 处理。\n\n为什么需要在每个想要连接信号的线程中运行事件循环？原因是这与\
    \ Qt 在将一个线程的信号连接到另一个线程的槽时使用的线程间通信机制有关。当建立这种连接时，它被称为队列连接。当通过队列连接发出信号时，槽将在目的对象的事件循环下一次执行时被调用。如果槽是由来自另一个线程的信号直接调用的，那么该槽将在调用线程的相同上下文中执行。通常，这不是你想要的（特别是如果你正在使用数据库连接，因为数据库连接只能由创建它的线程使用）。队列连接通过依托事件系统，将信号正确地分派给线程对象，并在其自己的上下文中调用其槽。这正是我们在线程间通信中，特别是当某些线程正在处理数据库连接时所期望的。Qt\
    \ 的信号/槽机制从根本上是上述线程间事件传递方案的实现，但具有更简洁、更易用的接口。\n\n例如，你可以在主 UI 对象和工作线程对象之间创建两个简单的连接；一个用于向工作线程添加查询，另一个用于报告结果。这种简单的设置，仅需几行代码，就建立了异步数据库应用的主要通信机制（清单\
    \ 4）。\n\n在这里，MainWindow 和 QueryThread 对象通过信号和槽以通常的方式直接相互通信。这里的诀窍在于，QueryThread\
    \ 对象在幕后利用一个 Worker 对象来执行所有工作。为什么需要这种额外的间接层？因为我们希望将工作分派给一个与完全独立的执行线程相关联的对象。\n\n\
    ### 清单 5. 额外的间接层使执行更具异步性。\n\n```cpp\nclass Worker : public QObject\n{\n    Q_OBJECT\n\
    \n    public:\n        Worker( QObject* parent = 0 );\n        ~Worker();\n\n\
    \    public slots:\n        void slotExecute( const QString query );\n\n    signals:\n\
    \        void results( const QList<QtSqlRecord>& records );\n\n    private:\n\
    \        QtSqlDatabase m_database;\n};\n\nvoid QueryThread::run()\n{\n    // Create\
    \ worker object within the context of the new thread\n    m_worker = new Worker();\n\
    \n    // Forward to the worker: a 'queued connection'!\n    connect( this, SIGNAL(\
    \ queue( const QString& ) ),\n             m_worker, SLOT( slotExecute( const\
    \ QString& ) ) );\n    // forward a signal back out\n    connect( m_worker, SIGNAL(\
    \ results( const QList<QtSqlRecord>& ) ),\n             this, SIGNAL( queryFinished(\
    \ const QList<QtSqlRecord>& ) ) );\n\n    exec(); // start our own event loop\n\
    }\n\nvoid QueryThread::execute( const QString& query )\n{\n    emit queue( query\
    \ ); // queues to worker\n}\n```\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_62_0.png)\n\
    \n请注意上面，QueryThread 在主执行线程中实例化并 start()；因此，QueryThread 将“属于”应用程序的主线程。将应用程序的小部件信号连接到其槽将通过“直接”连接——它们将由\
    \ Qt 以通常的方式立即调用，从而成为阻塞的同步函数调用。相反，我们感兴趣的是将信号“推”入运行在完全独立的执行线程中的槽，这正是内部 Worker 类发挥作用的地方（清单\
    \ 5）。\n\n利用这个内部的 Worker 类，QueryThread 可以通过使用 Qt 提供的方便的线程间信号/槽队列连接，将 SQL 查询适当地分派到单独的线程。QueryThread\
    \ 封装了线程的概念，因为它从 QThread 派生并且能够 start() 一个新的执行线程，它还封装了工作者的概念（通过暴露执行数据库工作的便捷方法，这些方法内部被分派到独立的执行线程）。因此，与纠缠于完成相同任务所需的所有必要事件和事件处理器相比，Qt\
    \ 元对象系统为你提供了所有必要的代码，并暴露 connect() 函数来触发这一切。信号可以在任何时间发出，并会正确地分派到目的对象，在该对象的上下文中执行。\n\
    \n需要注意的是，上述 QueryThread 的 execute() 方法旨在由主应用程序同步调用。QueryThread 提供此方法不仅是为了方便；实际上，它还封装并隐藏了\
    \ QueryThread 类用户所需的所有队列连接细节。当 execute() 被调用时，QueryThread 简单地将其作为信号发出到 worker。由于\
    \ worker 是一个“生活在”独立线程中的对象，Qt 将“排队”该连接并通过事件循环传递，使其到达 worker 的适当执行上下文——这对于 worker\
    \ 根据本文开头列出的规则利用其数据库连接至关重要。最后，来自 worker 的任何信号都通过 QueryThread 接口“转发”回来——这是 QueryThread\
    \ 用户的另一个便利，同时也向那些最初不需要了解 Worker 类细节的人隐藏了所有这些细节。\n\n如果你的查询巨大，或者潜在地可能巨大，你应该考虑不同的策略来处理结果集。例如，在将结果传回\
    \ UI 之前将其写入磁盘，可以帮助减少应用程序的内存负载，代价是运行速度稍慢。然而，如果你已经在处理大量查询，与查询的总体执行时间相比，速度下降可能微乎其微。因为所有数据库查询都在与\
    \ UI 完全独立的线程中执行，用户不会察觉到明显的滞后。将中间结果存储在文本文件中，或者为了最大灵活性，存储在本地 SQLite 数据库中。\n\n这个谜题还有一个部分需要解决。队列连接机制依赖于线程的事件循环，以便适当地在线程的上下文中调用槽，如前所述。然而，为了整理分派事件到另一个执行线程所需的数据，Qt\
    \ 对象系统必须知道信号/槽声明中使用的任何自定义数据类型。未注册自定义数据类型会导致队列连接失败，因为为了分派事件，必须复制信号的每个参数。幸运的是，“注册”附加类型是很简单的事情，只要这些类型具有公共构造函数、拷贝构造函数和析构函数（清单\
    \ 6）。\n\n### 清单 6. 为了共享自定义数据类型，你必须注册它们。\n\n```cpp\n// first, make the object system\
    \ aware\nqRegisterMetaType< QList<QtSqlRecord> >(\"QList<QtSqlRecord>\");\n//\
    \ now set up the queued connection\nconnect( m_worker, SIGNAL( results( const\
    \ QList<QtSqlRecord&> ) ),\n\tthis, SIGNAL( queryFinished( const QList<QtSqlRecord&>\
    \ ) ) );\n```\n\n随本文提供的示例应用程序实现了上述策略，其中查询与应用程序的其他部分并行执行 [该应用程序可从 Linux Journal\
    \ FTP 站点 ftp.linuxjournal.com/pub/lj/ issue158/9602.tgz 下载]。在查询进行时，UI 不受干扰。在适当的类型在\
    \ Qt 元对象系统中注册后，QueryThread 接口和封装的 worker 线程之间建立了队列连接。这使得独立的线程能够以最小的开销和代码复杂度安全地相互通信。该示例应用程序已在\
    \ SQLite 和 PostgreSQL 上进行测试；然而，它将与 Qt 支持的任何执行相同每线程连接限制的数据库连接一起工作。\n\n## 摘要\n\n\
    在使用 Qt 设计异步数据库应用程序时，应牢记以下几点：\n\n- 每线程创建一个数据库连接。使用线程安全的 QSqlDatabase::addDatabase()\
    \ 方法的 name 参数来区分各种数据库连接。\n- 尽可能将数据库连接封装在工作线程对象中。绝不与其他线程共享数据库连接。绝不在创建它的线程以外的任何线程中使用数据库连接。\n\
    - 使用 Qt 提供的工具管理线程间通信。除了 QMutex、QSemaphore 和 QWaitCondition，Qt 提供了更直接的机制：事件和信号/槽。跨线程边界的信号/槽实现依赖于事件，因此，确保你的线程使用\
    \ QThread::exec() 启动它们自己的事件循环。\n- 在 Qt 元对象系统中注册未知类型。任何未知类型在未首先调用 qRegisterMetaType()\
    \ 的情况下无法正确整理。这使得队列连接能够使用新类型在独立线程的上下文中调用该线程的槽。\n- 使用队列连接在应用程序和数据库线程之间进行通信。队列连接方法具有处理异步数据库连接的所有优点，同时使用\
    \ QObject::connect() 保持简单且熟悉的接口。\n\nDave Benton 是 Eventide, Inc. 的一名职业程序员。他欢迎您在\
    \ dbenton@eventide.com 处留言评论。\n\n"
