  - "[PAGE 67]\n\nRequirement number four covers a now obsolete form that is arguably\
    \ permissive. Agents issuing new addresses could legitimately disallow it; however,\
    \ an existing address that uses this form remains a valid address.\n\nThe standard\
    \ assumes a seven-bit character encoding, not multi-byte characters. Consequently,\
    \ according to RFC 2234, “alphabetic” corresponds to the Latin alphabetic character\
    \ ranges a–z and A–Z. Likewise, “numeric” refers to the digits 0–9. The lovely\
    \ international standard Unicode alphabets are not accommodated—not even encoded\
    \ as UTF-8. ASCII still rules here.\n\n# Developing a Better E-mail Validator\n\
    \nThat’s a lot of requirements! Most of them refer to the local part and domain.\
    \ It makes sense, then, to start with splitting the e-mail address around the\
    \ at sign separator. Requirements 2–5 apply to the local part, and 6–10 apply\
    \ to the domain.\n\nThe at sign can be escaped in the local name. Examples are,\
    \ Abc\\@def@example.com and \"Abc@def\"@example.com. This means an explode on\
    \ at the sign, $split = explode(\"@\", $email); or another similar trick to separate\
    \ the local and domain parts will not always work. We can try removing escaped\
    \ at signs, $cleanat = str_replace(\"\\\\@\", \"\",); but that will miss pathological\
    \ cases, such as Abc\\\\@example.com. Fortunately, such escaped at signs are not\
    \ allowed in the domain part. The last occurrence of the at sign must definitely\
    \ be the separator. The way to separate the local and domain parts, then, is to\
    \ use the strrpos function to find the last at sign in the e-mail string.\n\n\
    Listing 3 provides a better method for splitting the local part and domain of\
    \ an e-mail address. The return type of strrpos will be boolean-valued false if\
    \ the at sign does not occur in the e-mail string. Let’s start with the easy test\
    \ first. Checking the lengths of the local part and domain is simple. If those\
    \ tests fail, there’s no need to do the more complicated tests. Listing 4 shows\
    \ the code for making the length tests.\n\n```\nListing 3. Splitting the Local\
    \ Part and Domain\n```\n$isValid = true;\n$atIndex = strrpos($email, \"@\");\n\
    if (!is_bool($atIndex) && !$atIndex)\n{\n    $isValid = false;\n}\nelse\n{\n \
    \   $domain = substr($email, $atIndex+1);\n    $local  = substr($email, 0, $atIndex);\n\
    \    // ... work with domain and local parts\n}\n```\n```\n\n```\nListing 4. Length\
    \ Tests for Local Part and Domain\n```\n$localLen = strlen($local);\n$domainLen\
    \ = strlen($domain);\nif ($localLen < 1 || $localLen > 64)\n{\n    // local part\
    \ length exceeded\n    $isValid = false;\n}\nelse if ($domainLen < 1 || $domainLen\
    \ > 255)\n{\n    // domain part length exceeded\n    $isValid = false;\n}\n```\n\
    ```\n\n```\nListing 5. Partial Test for Valid Local Part Content\n```\nif (!preg_match('/^([\\\
    \\\\\\.\\\\[A-Za-z0-9!#$%&'*+/=?^`{|}~_-]*)$/s',\n        str_replace('\\\\\\\\\
    \\\\', '', $local)))\n(\n    // character not valid in local part unless\n   \
    \ // local part is quoted\n    if (preg_match('/^\\\\\\\\\\\\'\"'\"\"]*\\\\\\\\\
    \\\\'\"'\"']*$/',\n        str_replace('\\\\\\\\\\\\', '', $local)))\n    {\n\
    \        $isValid = false;\n    }\n)\n```\n```\n\n```\nListing 6. Check for dot\
    \ placement in the local part.\n```\nif ($local[0] == '.' || $local[strlen-1]\
    \ == '.')\n{\n    // local part starts or ends with '.'\n    $isValid = false;\n\
    }\nelse if (preg_match('/\\\\.\\\\./', $local))\n{\n    // local part has two\
    \ consecutive dots\n    $isValid = false;\n}\n```\n```\n\n```\nListing 7. Domain\
    \ Checks\n```\nif (!preg_match('/^[A-Za-z0-9\\\\\\\\-.]*$/', $domain))\n{\n  \
    \  // character not valid in domain part\n    $isValid = false;\n}\nelse if (preg_match('/\\\
    \\\\\\.\\\\\\\\./', $domain))\n{\n    // domain part has two consecutive dots\n\
    \    $isValid = false;\n}\nelse if (!(checkdnsrr($domain, \"MX\") || checkdnsrr($domain,\
    \ \"A\")))\n{\n    // domain not found in DNS\n    $isValid = false;\n}\n```\n\
