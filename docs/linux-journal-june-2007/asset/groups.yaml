    \ Add the following lines:\n\n```\n<Directory /var/www/httpdocs/lxr>\nAllowOverride\
    \ All\nOptions All\n</Directory>\n```\n\nSimply replace the location with wherever\
    \ you've installed LXR.\n\nThen, go to $INSTALLPREFIX/http/ and create and open\
    \ a file named .htaccess for editing. Type the following lines:\n\n```\n`<File\
    \ ~ (search|find|source|diff|ident)>`\n\n`SetHandler cgi-script`\n\n`</File>`\n\
    ```\n\nThis tells the Web server to treat the above-mentioned files as CGI scripts.\
    \ If you don’t do this, the server will display only the contents of these files.\
    \ Close and save .htaccess. We are now ready to browse the cross-referenced source\
    \ code.\n\n## How to Use LXR\n\nAfter all of the above steps are done, all you\
    \ have to do is open a Web browser and go to the URL, http://my-ip//lxr/http/source,\
    \ where /my-ip/ is the IP of your Web server. When you open the Web page, you\
    \ will get something like what is shown in Figure 1.\n\nAs you can see, users\
    \ can select any of the source code files for browsing. At the top, I’m using\
    \ the template provided by LXR. It includes links to navigate the source code,\
    \ search for a particular identifier, search for any text within the source code\
    \ and search for any file. A few utilities of note:\n\n-   *Source navigation:\
    \ select this option to browse the source code of your choice.\n-   *Identifier\
    \ search: search for the definition and uses of a particular identifier. Requires\
    \ the ident script.\n-   *Freetest search: search for any text within the source\
    \ files. Requires the search script.\n-   *File search: search for files matching\
    \ the passed string. Requires the find script.\n\nAll of these utilities also\
    \ can search using regular expressions to match the strings.\n\n## Conclusion\n\
    \nLXR is an excellent tool. It makes life a lot easier for people who want to\
    \ study source code, and it’s powerful and easy to use. The fact that it uses\
    \ dynamically generated Web pages to browse the source code gives users a lot\
    \ of flexibility in configuring it. Also, because it can be accessed via any Web\
    \ browser, it imposes no limitations on the platform, client or location of users.\
    \ This interoperability is one of the reasons LXR is so powerful.\n\n**Kamran\
