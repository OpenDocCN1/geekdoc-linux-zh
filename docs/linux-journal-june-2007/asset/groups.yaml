    \ }\n    } // For ($i = 0; $i < sizeof($domain_array); $i++) { }\n    if (!ereg(\"\
    ^[ [A-Za-z0-9] [A-Za-z0-9] (0, 61) [A-Za-z0-9]\n               \\\" [\\\" [\\\"\
    @] [\\\"@] *+?\\\", $domain_array[$i])) { }\n        return false;\n    }\n  \
    \  }\n    }\n    return true;\n}\n```\n\n"
