    \ 6 月 17 日 – 22 日。\n\n2007 年新内容：\n**SANS 安全培训**\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_70_1.png)\n\
    \n请在 6 月 1 日前注册以享受优惠！ • www.usenix.org/usenix07/lj\n\n# CHRISTOF WITTIG 和 TED\
    \ NEWARD 谈面向对象的编程语言映射到数据库\n\n语言到数据库映射的问题。\n*Nicholas Petreley*\n\n我敦促我们的读者阅读 Ted\
    \ Neward 的《计算机科学的越南战争》，该文章将越南战争的泥潭与我们试图将面向对象语言与关系型甚至对象关系型数据库融合所产生的当前泥潭进行了比较。可以在\
    \ [www.odbms.org/vietnam.html] 找到 Ted 文章的链接。\n\n文章讨论了一个称为对象关系阻抗失配的问题。以下是我对该问题的总结：\n\
    \n我们手头有两种很棒的技术：面向对象语言和关系型数据库。然而，当你试图将两者融合时，问题就出现了，因为两者都不是为了与对方无缝协作而设计的。查询示例（Query-By-Example）风格的编程可能解决这个问题，但这仅适用于简单的数据库访问。将类映射到表可能可行，但数据库的规范化使这种方法变得困难。例如，“客户”表不太可能包含客户居住的城市和州。数据库管理员（DBA）很可能会将此类数据提取出来，并按邮政编码存储在另一张表中。一种选择是直接将查询字符串传递给数据库并手动整理字段。如果数据类型处理不当，这很可能导致性能问题和故障。为了增加复杂性，即使你做对了所有事情，仍然存在\
    \ DBA 以破坏代码的方式更改数据库的可能性。\n\n像 PHP 这样的语言包含一些技巧来帮助平滑语言到数据库的映射，但即使这些技巧也可能被数据库架构的某些更改所破坏。问题在于，这些选项仅仅是技巧，而不是真正的数据库到语言映射技术。\n\
    \n**LJ：** 这是否很好地总结了情况，还是你有什么想要补充的？\n\n**TED：** 这里涉及许多问题，其中之一是开发人员和 DBA 之间关于“谁拥有数据”以及更重要的是与这些数据对应的架构之间的根本张力。拥有架构的开发人员会创建对他们使用舒适但对\
    \ DBA 操作不便的东西，而拥有架构的 DBA 会创建对他们维护和报告容易的东西，但这反过来会给开发人员造成不便。暗示任何技术都将完全消除那些从根本上植根于政治的问题，这是有点愚蠢的。\n\
    \n**CHRISTOF：** 对象/关系型双架构方法，将数据置于应用程序之上并交给 DBA，在传统的、集中的企业 IT 环境中具有组织优势。然而，有一类应用程序，其数据存储是完全嵌入式的，对最终用户是不可见的——例如在设备软件中，在你手机或\
    \ PC 上的软件包中，在实时控制系统和 SOA 应用程序中。这些零管理数据库场景从拥有两个架构中没有任何好处，却要承担调和这些本质上不兼容模型的全部成本。在网络化世界中\
    \ proliferated 的分布式和移动软件架构，推动了对零管理数据库引擎的需求，因此未来我们将听到更多这样的内容。\n\n**LJ：** 我意识到并非所有自称“关系型”的数据库都真正符合\
    \ Codd 和 Date 对关系型数据库的学术观点。但除此之外，这个问题是否仅限于关系型数据库映射到面向对象语言？对象关系型数据库（ORDBMS）为什么不解决这个问题？或者它们确实解决了？\n\
    \n**TED：** 在许多方面，阻抗失配不仅仅局限于对象和关系；试图将对象塞进层次化数据格式（如 XML）也会遭受一些同样的问题。因此，暗示这只是“仅仅”是一个对象关系型问题是具有误导性的。Date\
    \ 在此问题上的立场很有趣；他坚持认为 ORDBMS 实际上并不存在，其……\n\n芯片制造、仓库自动化和其他吞吐量密集型系统需要\n\n# 高速\n\n\
    处理\n\nc-tree 技术\n\nFairCom 数据库\n技术使其成为可能。\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_72_0.png)\n\
    \n# FairCom\n\nwww.faircom.com/go/?speed\n\n"
