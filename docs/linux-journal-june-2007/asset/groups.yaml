    \ | 1-800-681-0016\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_19_0.png)\n\n**REUVEN\
    \ M. LERNER**\n\n## RJS Templates\n\nThe power of Ajax to fetch and run JavaScript\
    \ generated by your server-side language.\n\n**Why not use your server-side programming\
    \ language to generate the JavaScript for you?**\n\nThe past few months, I've\
    \ written a number of articles in this space about JavaScript. This language,\
    \ built into nearly every modern Web browser, has now come into its own and is\
    \ at the heart of a paradigm for modern Web development known as Ajax. Whereas\
    \ knowledge of JavaScript was long an optional skill for Web developers, it has\
    \ become a must-have skill, along with SQL, HTML, HTTP, and CSS.\n\nOne of the\
    \ reasons for JavaScript's renaissance is the emergence of cross-platform libraries,\
    \ which hide the incompatibilities that long plagued the language. For quite some\
    \ time, programs written in JavaScript had to contain many *if/then* statements\
    \ that looked at possible cross-platform incompatibilities.\n\nToday, we can avoid\
    \ having such *if/then* statements in our code by using libraries that take care\
    \ of these low-level tasks for us. Prototype and Dojo, two of the JavaScript libraries\
    \ I profiled in previous columns, have become popular precisely because they hide\
    \ many of these details. They make JavaScript a truly cross-platform language,\
    \ where “platform” means the Web browser as much as the operating system.\n\n\
    Some clever programmers, in an effort to make JavaScript standardization even\
    \ more complete and effortless, have gone one step further. Why not use your server-side\
    \ programming language to generate the JavaScript for you? That is, if you are\
    \ using Ruby on Rails, perhaps you could write commands in Ruby and have them\
    \ translated into JavaScript. Doing so would allow you to use roughly the same\
    \ code in all of your templates, without having to switch syntax in different\
    \ parts of the template.\n\nThis might sound like a strange idea, but the more\
    \ I think about it, the more I like it. RJS (short for Ruby JavaScript) templates\
    \ are one incarnation of this. If you prefer to create your JavaScript in Java,\
    \ you might want to look at the Google Web Toolkit, which is now available under\
    \ an open-source license and has gained many fans in the Java world.\n\nThis month,\
    \ we look at RJS and how it makes life much easier for Web developers. Although\
    \ I don't think that JavaScript will ever disappear, or that Web developers will\
    \ be able to ignore it completely, technologies such as RJS mean that it might\
    \ become something like machine code today—available and sitting at the bottom\
    \ of the pyramid, but generally ignored by high-level programmers.\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_19_1.png)\n\
    \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"\
    http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">  \n<html>  \n <head>\
    \  \n <title id=\"title\">Sample HTML page</title>  \n <% javascript_include_tag\
    \ 'prototype' %>  \n  \n <script type=\"text/javascript\">  \n function updateHeadline()\
    \  \n {  \n var headline = $('headline');  \n var new_headline_text = $('future-headline');\
    \  \n Element.update(headline, new_headline_text);  \n }  \n </script>  \n </head>\
    \  \n  \n <body>  \n <h1 id=\"headline\">Headline</h1>  \n <p><input type=\"text\"\
    \ id=\"future-headline\" /></p>  \n <p><input type=\"button\" onclick=\"updateHeadline();\"\
    \ value=\"Update headline\" /></p>  \n </body>  \n</html>\n```\n\n### Ajax and\
    \ Rails\n\nTo create a new Rails project called ajaxdemo, type:\n\n```bash\nrails\
    \ ajaxdemo\n```\n\nNow, let's create a simple controller called showme:\n\n```bash\n\
    script/generate controller showme\n```\n\nWe're not going to have any model in\
    \ this system, but you still might have to define one or more lines in config/database.yml.\
    \ Instead, let's create a new view within our showme controller, stored as app/views/showme/index.rhtml,\
    \ shown in Listing 1.\n\nAs you can see, the index.rhtml page is a relatively\
    \ standard page of HTML, with some JavaScript code that uses the Prototype library.\
    \ The page consists of a headline, a text field, and a button. Pressing the button\
    \ invokes the\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_20_0.png)\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_20_1.png)\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_20_2.png)\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_20_3.png)\n\
    \n>>>>> From $789 <<<<<\n\nWith Pogo's Network Attached Storage appliance, maximum\
    \ interoperability with the most popular operating systems is easier. Take control\
    \ of your ever-expanding storage needs with an easy to use graphical management\
    \ interface, multiple snapshots, built-in back up, IP failover, and enhanced security.\
    \ Powered by Intel Dual-Core Xeon processors and a fast 64-bit OS. Call today\
    \ for more information.\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_20_4.png)\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_20_5.png)\n\nwww.pogolinux.com\n\n\
    Experience, Imagination, and Support.\n**Pogo Linux is Hardware Solutions Built\
    \ for Linux, Built for You.**\n\nTo get started, contact us at 888.828.POGO or\
    \ inquries07@pogolinux.com\nPogo Linux, Inc. 701 Fifth Ave. Suite 6850, Seattle,\
    \ WA 98104\n\nIntel, Intel logo, Intel Inside logo, Pentium, Xeon, and Xeon Inside\
    \ are trademarks or registered trademarks of Intel corporation or its subsidiaries\
    \ in the United States and other countries. For additional terms and conditions\
    \ please visit www.pogolinux.com\n\nEven better, because we're returning a JavaScript\
    \ program, rather than the contents of an individual HTML element, we can modify\
    \ multiple parts of the page and even throw in some Scriptaculous effects for\
    \ good measure.\n\nfunction updateHeadline. This function takes the current value\
    \ of the future-headline text field and changes the headline to reflect its contents.\n\
    \n### Using a Remote Call\n\nSo far, we haven't done anything special. Now, however,\
    \ we're going to do something a bit more sophisticated: send the contents of our\
    \ text field to the server in an Ajax call. The server's response will be our\
    \ headline, translated into Pig Latin.\n\nMaking this change requires doing two\
    \ things. First, we need to write a method in our application controller that\
    \ takes the headline, turns it into Pig Latin, and then returns that text. Second,\
    \ we need to modify our template so that it gets the updated text from the server,\
    \ rather than from a local JavaScript function.\n\nOur updated template is shown\
    \ in Listing 2. We have made a number of changes, starting with the fact that\
    \ our form now has an id attribute associated with it, named theForm. The form\
    \ contains a single element, a text field whose name is future_headline. Note\
    \ that we need to use the name attribute instead of the id attribute, so that\
    \ the form element will be submitted with our Ajax call. Also notice that we have\
    \ changed the name to a Ruby-friendly future_headline (with an underscore), rather\
    \ than the CSS-friendly future-headline (with a hyphen).\n\n#### Listing 2. index.rhtml\
    \ (Ajax Version)\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional/EN\"\
    \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html>\n<head>\n\
    <title id=\"title\">Sample HTML page</title>\n<%= javascript_include_tag 'prototype'\
    \ %>\n</head>\n<body>\n<h1 id=\"headline\">Headline</h1>\n<form id=\"theForm\"\
    >\n<p><input type=\"text\" name=\"future_headline\" /></p>\n</form>\n<p><%= submit_to_remote\
    \ \"submit-button\",\n\"Pig Latin it!\",\n:url => { :action => \"piglatin_sentence\"\
    \ },\n:submit => \"fakeForm\",\n:update => \"headline\" %></p>\n</body>\n</html>\n\
    ```\n\nWe also have replaced our button with a call to the submit_to_remote helper.\n\
    \n```erb\n<p><%= submit_to_remote \"submit-button\",\n\"Pig Latin it!\",\n:url\
    \ => { :action => \"piglatin_sentence\" },\n:submit => \"fakeForm\",\n:update\
    \ => \"headline\" %></p>\n```\n\nThe above code does quite a few things:\n\n-\
    \ It creates a button, whose DOM ID is submit-button.\n- The button has a label\
    \ of \"Pig Latin it!\".\n- When the button is clicked, it uses Ajax to invoke\
    \ the piglatin_sentence action on the server, within the current controller.\n\
    \n#### Listing 3. showme_controller.rb\n\n```ruby\nclass ShowmeController < ApplicationController\n\
    \ndef piglatin_sentence\n# Get the headline\nsentence = params[:future_headline]\n\
    words = sentence.split\n\nsentence = \"\"\n\n# Go through each word, applying\
    \ the secret\n# Pig Latin algorithm\nwords.each do |word|\nif word =~ /[^aeiou]/\n\
    word << \"way\"\nelse\nfirst_letter = word.slice(0,1)\nrest = word.slice(1..)\n\
    word = \"#{$rest}#{$first_letter}ay\"\nend\n\nsentence << word\nsentence << \"\
    \ \"\nend\n\nrender :text => sentence\nend\nend\n```\n"
