    (\\. [a-z0-9-]+\\)*\\n\\.\\[a-z\\]\\.\\[3\\]}\"\n```\n\n该正则表达式仅允许下划线 (_) 和连字符\
    \ (-) 字符、数字和小写字母字符。即使假设有一个预处理步骤将大写字母字符转换为小写，该表达式也会拒绝包含有效字符的地址，例如斜杠 (/)、等号 (=)、感叹号\
    \ (!) 和百分号 (%)。该表达式还要求最高级别域名组件仅有两个或三个字符，从而拒绝了诸如 .museum 等有效域名。\n\n另一个受欢迎的正则表达式解决方案如下：\n\
    \n```\n\"^[a-zA-Z0-9-]+\\.[a-zA-Z0-9-]+\\.[a-zA-Z0-9-]+$/\"\n```\n\n该正则表达式拒绝了前一段中提到的所有有效示例。它的优点在于允许大写字母字符，并且没有犯假设高级域名仅有两个或三个字符的错误。它允许无效的域名，例如\
    \ example..com。\n\n清单 1 展示了来自 PHP Dev Shed ([www.php.net/manual/en/book.enchant.php](https://www.php.net/manual/en/book.enchant.php))\
    \ 的一个示例。该代码包含（至少）三个错误。首先，它无法识别许多有效的电子邮件地址字符，例如百分号 (%)。其次，它使用 @ 符号将电子邮件地址拆分为用户名和域名部分。包含带引号的\
    \ @ 符号的电子邮件地址，例如 Abc@def@example.com，将破坏此代码。第三，它未能检查主机地址的 DNS 记录。具有 A 类型 DNS 条目主机的将接受电子邮件，并且不一定发布\
    \ MX 类型条目。我并不是在苛责 PHP Dev Shed 的作者。超过 100 位审阅者给此方案打了四星（满分五星）的评价。\n\n**清单 1. 不正确的电子邮件验证**\n\
    \n```php\nfunction checkEmail($email) {\n    if (preg_match(\"/^([A-Za-z0-9]+|[a-zA-Z0-9._-]+)\"\
    \n                   \"@([a-zA-Z0-9-]+)(.[a-zA-Z0-9-]+.-)+$/\", $email)) {\n \
    \       list($username, $domain) = split('@', $email);\n        if (checkdnsrr($domain,\
    \ 'MX')) {\n            return false;\n        }\n        return true;\n    }\n\
    \    return false;\n}\n```\n\n其中一个较好的解决方案来自 Dave Child 的博客 IlloveJackDaniels (ilovejacksdaniels.com)，如清单\
    \ 2 所示 ([www.ilovejackdaniels.com/php/email-address-validation](https://www.ilovejackdaniels.com/php/email-address-validation))。Dave\
    \ 不仅热爱传统的美式威士忌，他还做了功课，阅读了 RFC 2822，并认识到电子邮件用户名中有效字符的真实范围。大约 50 人在该网站上对此解决方案发表了评论，其中一些更正已被纳入原始解决方案中。IlloveJackDaniels\
    \ 集体开发的代码中唯一的主要缺陷是它未能允许用户名中的带引号字符，例如 @。它将拒绝包含多于一个 @ 符号的地址，因此在使用 explode(\"@\"\
    , $email) 拆分手名和域名部分时不会出错。一个主观的批评是，代码花费了大量精力检查域名部分每个组件的长度——这些精力最好用于简单地尝试域名查找。其他人可能会欣赏在网络上执行\
    \ DNS 查找之前对域名进行的尽职检查。\n\n## 要求\n\nIETF 文档，RFC 1035《域名实现和规范》、RFC 2234《语法规范的 ABNF》、RFC\
