    **SP:** We looked at pretty much every license you can imagine for the Java platform.
    Obviously, lots of people thought we were going to use CDDL. There were several
    questions we had to ask ourselves: one of them was which license was most likely
    to prevent monopolisation by somebody loudly up to death. Another factor was asking
    we weren''t using Java. Java is actually pretty widespread. It''s on five billion
    devices, it''s on eight out of ten cell phones, and it''s used on a strong majority
    of enterprise application servers.


    So the question has to be well, how can you grow when you''ve already got such
    a strong market? And, the obvious place we could grow was actually to GNU/Linux.
    If you look at the use of GNU/Linux outside Europe and North America, you discover
    that distributions like Fedora and Debian are actually very, very important in
