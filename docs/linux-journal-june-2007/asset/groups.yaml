  - '[PAGE 38]


    behind. However, all is not rosy there either. Networks may be fast in Korea,
    but Microsoft''s market share in many categories, including desktops, verges on
    100%. Broadband growth in Europe has recently slowed in regions (including Denmark)
    where incumbent carriers are making comebacks.


    The big fight here is between independence and dependence, between citizens and
    monopolies (or duopolies), between local initiatives—backed in many cases by local
    governments—and some of the nastiest state and federal politics you''re ever going
    to find. In every case, the protagonists are individuals, local groups, local
    companies, local governments and local utilities.


    The problem they face is a combination of duopoly entrenchment and well-lobbied
    protection at the federal and state levels. The telcos alone are the biggest-spending
    lobbying group in US history—even bigger than the pharmaceuticals. And, they don''t
    just work Congress. Some carriers are working at the state level to make it against
    the law for anybody to carry the Internet other than themselves.


    Linux folks can help enormously here, because Linux techies—our readers—know how
    to build good, strong, reliable, easily fixed and easily improved solutions. And,
    they know how to do it on the cheap. We''ve been watering grass roots for up to
    two decades or more. Stallman taught us what freedom means, and Torvalds taught
    us how to have fun putting it to use. We have a lot of leverage.


    # **Mobile: the Ultimate User Space**


    Sometime this year there will be more than three billion mobile phones in the
    world. To put that in a perspective (relying on last month''s *L* Index), compare
    that to 1.4 billion credit cards, 1.3 billion land lines, 1.1 billion Net connections,
    800 million cars, 200 million computer games, 100 million PVRs and 85 million
    iPods.


    Cell phones are networked computing devices. A growing percentage of them run
    on Linux. Yet the OpenMoko (openeroko.com) and Trolltech''s Qtopia Greenphone
    (www.trolltech.com/products/qtoria/greenphone), both wide-open working prototypes,
    are rarities. They face an enormous uphill battle against silo''d alliances between
    cell service carriers and equipment makers, such as Nokia and Motorola.


    Yet the world needs open phones. In fact, I''d hazard a prophecy that open phones
    are inevitable, where there will be far more money to be made because of open
    phones than will ever be made with closed ones (and closed services offered only
    by carriers). We''re starting to see vertical cracks in the closed wall of mobile
    telephony in settings such as universities, where rogue companies like Rave Wireless
    (disclosure: I consult them) provide students with custom (based on open) phones
    that run on familiar networks (such as Cingular and T-Mobile), but that do far
    more than the closed phones sold by stores by those same networks. Users are even
    free to do their own programming, create and add their own features and services.
    With each crack of this kind in a vertical market, the chance improves that open
    phones will become the norm rather than the exception. The protagonists here are
    Linux techies, but working a much larger world of possibilities. The problem,
    as ever, is less a matter of closed systems than of mentality behind it. Once
    markets start to open up, it will be easy to fill those magazine issues with stories
    of clever hacks and deployment successes.


    # **Desktop and Laptop Linux**


    Desktop Linux has been approaching without ever arriving since the mid-1990s.
    Most *Linux Journal* readers are there already, of course. But they''re wizards.
    The muggles are still on Windows and Mac boxes. What we''ve needed for the duration
    is one or more of the major hardware OEMs to wake up and smell the volume. Last
    year, Lenovo began selling Linux-loaded ThinkPads in a committed way, but not
    aggressively, Lenovo didn''t push it. This year, Dell set out bait in the form
    of IdeaStorm, a site that had all the look of a "conversational" marketing ploy,
    but instead served as a hole in the Windows-only dam that has been holding the
    Linux desktop river outside of Dell''s headquarters for the duration. That hole
    quickly widened to a river of its own, flooding through Dell''s product development
    system. (See the IdeaStorm story in this issue''s UpFront.)

    I''d love to see a fly on the wall when Michael Dell tells Steve Ballmer that
    Dell will be selling Linux-branded laptops and desktops in a much more public
    way, because the company has no choice: the market demands it. HP, Sony and the
    rest won''t be far behind. As the volume grows, so will the portfolio of applications
    and the sum of expertise about Linux desktops and laptops. This is a category
    that will explode very quickly. I''m willing to bet right now that in


