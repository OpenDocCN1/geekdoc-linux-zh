    The . at the end tells the script that the source code is contained within the
    current directory. Next, sit back and enjoy the ride until the parsing is complete.
    Once it’s done, you should have two new files in the current directory— the directory
    containing your source code— fileidx and xref. These two files are the ones lxr
    needs to generate the cross-referenced source code when you browse it. Make sure
    that others have read permission for these files. To do so, type the following
    while still in the source directory:


    ```

    bash$ ls -l fileidx xref

    ```


    The output should be something like:


    ```

    -r----f--- 1 nobody root 671744 2006-08-24 05:06 fileidx*

    -r----f--- 1 nobody root 8425472 2006-08-24 05:06 xref*

    ```


    The third r should be set. If it isn’t, you can set it by doing the following:


    ```

    bash$ chmod o+x fileidx xref

    ```


    Now, it’s time to configure LXR for use. Change directory to $INSTALLPREFIX/http/
    (in my case, that is /var/www/htdocs/lxr/http/), and open the lxr.conf file for
    editing. The lxr.conf file is the most important file you need. It has several
    different configuration options.


    # Variables


    The first thing you’ll see when you open the file is a definition for a variable
    called v. As with programming languages, you can define your own variables and
    use them later in the configuration file. Wherever they occur, they will be replaced
    by whatever value they have. Variable values are referenced by the configuration
    file by $variable-name. Variable definitions follow one of two possible formats:


    ```

    variable: /variable-identifier, variable-name.

    //{list-of-values/}, /default-value/

    ```


    or:


    ```

    variable: /variable-identifier, variable-name.

    /{file-containing-list-of-values/}, /default-value/

    ```


    Here’s what the terms stand for:


    +   * variable-identifier: the name the variable will be known as throughout the
    configuration file.


    +   * variable-name: the actual name of the variable that will be displayed to
    the user.


    +   * list-of-values: comma-separated list of values to be displayed.


    +   * file-containing: a file that contains a list of possible values.


    +   * list-of-values: the list has each entry on a separate line. The user can
    select any one of them. The absolute path of the file


    should be provided.


    +   * default-value: the value that the variable will take on by default. The
    first value is automatically set if this is not specified.


    # baseurl


    The baseurl is the URL relative to which all of the scripts required by LXR are
    placed. It should be accessible via a browser. In my configuration, it’s http://my-ip/path/<http://localhost/lxr/http/>.
    Make sure to place the / at the end, or the last directory will be ignored.


    # HTML Headers and Footers


    When the HTML for the source is generated, LXR can add headers and footers to
    the pages. Sample headers and footers are provided in the $INSTALLPREFIX/http/
    directory. They’re called template-head and template-tail. In addition, you also
    can change the way files and directories are displayed by LXR by modifying the
    template-dir file. The locations of these files can be specified by the htmlhead,
    htmlmail and htmlidrop options in the lxr.conf file.


    # sourceroot


    This option tells LXR where to look for the actual source code. In my case, it’s
    /var/www/htdocs/lxr/source/glibc-2.3.5. If you want to cross-reference multiple
    projects, all you have to do is create a variable specifying the


