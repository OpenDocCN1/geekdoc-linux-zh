    \ LERNER**\n\n# # RJS Templates\n\nThe power of Ajax to fetch and run JavaScript\
    \ generated by your server-side language.\n\n**Why not use your server-side programming\
    \ language to generate the JavaScript for you?**\n\nThe past few months, I've\
