  - "[PAGE 62]\n\nchecking. However, getting all the events designed and dealt with\
    \ properly can be an onerous task, especially if your application has multiple\
    \ types of database queries to perform, with multiple return types, each of which\
    \ needing an associated event and event handler and so forth.\n\nFortunately,\
    \ Qt permits signals and slots to be connected across threads---as long as the\
    \ threads are running their own event loops. This is a much cleaner method of\
    \ communication compared to sending and receiving events, because it avoids all\
    \ the bookkeeping and intermediate QEvent-derived classes that become necessary\
    \ in any nontrivial application. Communicating between threads now becomes a matter\
    \ of connecting signals from one thread to the slots in another, and the muting\
    \ and thread-safety issues of exchanging data between threads are handled by Qt.\n\
    \nWhy is it necessary to run an event loop within each thread to which you want\
    \ to connect signals? The reason has to do with the inter-thread communication\
    \ mechanism used by Qt when connecting signals from one thread to the slot of\
    \ another thread. When such a connection is made, it is referred to as a queued\
    \ connection. When signals are emitted through a queued connection, the slot is\
    \ invoked the next time the destination object's event loop is executed. If the\
    \ slot had instead been invoked directly by a signal from another thread, that\
    \ slot would execute in the same context as the calling thread. Normally, this\
    \ is not what you want (and especially not what you want if you are using a database\
    \ connection, as the database connection can be used only by the thread that created\
    \ it). The queued connection properly dispatches the signal to the thread object\
    \ and invokes its slot in its own context by piggy-backing on the event system.\
    \ This is precisely what we want for inter-thread communication in which some\
    \ of the threads are handling database connections. The Qt signal/slot mechanism\
    \ is at root an implementation of the inter-thread event-passing scheme outlined\
    \ above, but with a much cleaner and easier-to-use interface.\n\nFor example,\
    \ you can create two simple connections between the main UI object and a worker\
    \ thread object; one to add a query to the worker thread and another to report\
    \ back the results. This simple setup, only a few lines of code, establishes the\
    \ main communication mechanism for an asynchronous database application (Listing\
    \ 4).\n\nHere, the MainWindow and the QueryThread objects communicate directly\
    \ with one another via signals and slots in the usual way. The trick here is that\
    \ the QueryThread object, behind the scenes, utilizes a Worker object to perform\
    \ all the work. Why is this extra level of indirection necessary? Because we want\
    \ to dispatch the work to an object that is associated with a completely separate\
    \ thread of execution.\n\n# Listing 5. An extra level of indirection makes execution\
    \ more asynchronous.\n\n```\nclass Worker : public QObject\n{\n    Q_OBJECT\n\n\
    \    public:\n        Worker( QObject* parent = 0 );\n        ~Worker();\n\n \
    \   public slots:\n        void slotExecute( const QString query );\n\n    signals:\n\
    \        void results( const QList<QtSqlRecord>& records );\n\n    private:\n\
    \        QtSqlDatabase m_database;\n};\n\nvoid QueryThread::run()\n{\n    // Create\
    \ worker object within the context of the new thread\n    m_worker = new Worker();\n\
    \n    // Forward to the worker: a 'queued connection'!\n    connect( this, SIGNAL(\
    \ queue( const QString& ) ),\n             m_worker, SLOT( slotExecute( const\
    \ QString& ) ) );\n    // forward a signal back out\n    connect( m_worker, SIGNAL(\
    \ results( const QList<QtSqlRecord>& ) ),\n             this, SIGNAL( queryFinished(\
    \ const QList<QtSqlRecord>& ) ) );\n\n    exec(); // start our own event loop\n\
    }\n\nvoid QueryThread::execute( const QString& query )\n{\n    emit queue( query\
    \ ); // queues to worker\n}\n```\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_62_0.png)"
  - "[PAGE 63]\n\n# FEATURE Asynchronous Database Access with Qt 4.x\n\nNotice above\
    \ that QueryThread is instantiated and start(1)ed within the main thread of execution;\
    \ therefore, QueryThread will “belong” to the application’s main thread. Connecting\
    \ signals from the application’s widgets to its slots will be via “direct” connections—they\
    \ will be invoked immediately by Qt, in the usual way, and thus be blocking, synchronous\
    \ function calls. Instead, we are interested in “pushing” the signals into slots\
    \ that are running in a separate thread of execution entirely, and this is where\
    \ the internal Worker class comes into play (Listing 5).\n\nUtilizing this Worker\
    \ class internally, QueryThread can dispatch SQL queries properly to a separate\
    \ thread by employing the convenient inter-thread signal/slot queued connections\
    \ provided by Qt. QueryThread encapsulates the idea of a thread, by being derived\
    \ from QThread and being able to start() a new thread of execution, and it also\
    \ encapsulates the idea of a worker (by exposing convenient methods that perform\
    \ database work, which are internally dispatched to a separate thread of execution).\
    \ So, instead of tangling with all the necessary events and event handlers to\
    \ accomplish the same task, the Qt metaobject system gives you all the necessary\
    \ code for you and exposes the connect() function to trigger it all. Signals can\
    \ be emitted at any time and will be dispatched to the destination object correctly,\
    \ within that object’s context.\n\nIt is important to note that, above, the execute()\
    \ method of QueryThread is intended to be invoked synchronously by the main application.\
    \ QueryThread presents this method not only as a convenience; indeed, it also\
    \ encapsulates and hides all the queued connection details from the user of the\
    \ QueryThread class. When execute() is invoked, QueryThread simply emits it as\
    \ a signal to the worker. Because the worker is an object “living” in a separate\
    \ thread, Qt will “queue” the connection and pass it through the event loop so\
    \ that it arrives in the proper execution context of the worker—essential so the\
    \ worker can utilize its database connection according to the rules that are laid\
    \ out in the beginning of this article. Finally, any signals coming from the worker\
    \ are “forwarded” back out through the QueryThread interface—another convenience\
    \ for the users of QueryThread, which also serves to hide all the details of the\
    \ Worker class from those who really don’t need to know about it in the first\
    \ place.\n\nIf the size of your queries are gigantic, or potentially can be gigantic,\
    \ you should consider a different strategy for dealing with the result sets. For\
    \ example, writing the results out to disk before passing them back to the UI\
    \ help reduce the memory load of your application, at the cost of some runtime\
    \ speed. However, if you are already dealing with massive queries, the speed hit\
    \ likely will be minor in comparison with the overall execution time of the query.\
    \ Because all database queries execute in a completely separate thread from the\
    \ UI, users will not perceive any significant lag. Store the intermediate results\
    \ in a text file, or for maximum flexibility, in a local SQLite database.\n\n\
    One element of this puzzle still needs to be solved. The\n\n```\nListing 6. You\
    \ must register any custom data types in order to share them.\n\n```c++\n// first,\
    \ make the object system aware\nqRegisterMetaType< QList<QtSqlRecord> >(\"QList<QtSqlRecord>\"\
    );\n// now set up the queued connection\nconnect( m_worker, SIGNAL( results( const\
    \ QList<QtSqlRecord&> ) ),\n\tthis, SIGNAL( queryFinished( const QList<QtSqlRecord&>\
    \ ) ) );\n```\n```\n\nqueued connection mechanism relies on the thread’s event\
    \ loop to invoke a slot within that thread’s context properly, as discussed previously.\
    \ However, in order to marshal the data necessary to dispatch the event to another\
    \ thread of execution, the Qt object system must be made aware of any custom data\
    \ types used in the signal/slot declaration. Failure to register custom data types\
    \ will cause the queued connection to fail, because in order to dispatch the event,\
    \ a copy of each of the signal’s parameters must be made. Fortunately, it is a\
    \ simple matter to “register” additional types, as long as those types have public\
    \ constructors, copy constructors and destructors (Listing 6).\n\nThe sample application\
    \ provided with this article implements the strategy outlined above, in which\
    \ queries are executing in parallel with the rest of the application [the application\
    \ is available for download from the Linux Journal FTP site, ftp.linuxjournal.com/pub/lj/\
    \ issue158/9602.tgz]. The UI is not disturbed while the queries are underway.\
    \ A queued connection is created between the QueryThread interface and the encapsulated\
    \ worker thread after the appropriate types are registered with the Qt metaobject\
    \ system. This allows the separate threads to communicate safely with one another,\
    \ with minimal overhead and code complexity. The sample application was tested\
    \ with SQLite and PostgreSQL; however, it will work with any database connection\
    \ supported by Qt that enforces the same connection-per-thread limitation.\n\n\
    # Summary\n\nThe following points should be kept in mind when designing asynchronous\
    \ database applications with Qt:\n\n+   - Create a database connection per thread.\
    \ Use the name parameter of the thread-safe QsQLDatabase::addDatabase() method\
    \ in order to distinguish various database connections.\n- Encapsulate the database\
    \ connections within worker thread objects as much as possible. Never share a\
    \ database connection with another thread. Never use a database connection from\
    \ any thread other than the one that created it.\n- Manage communication between\
    \ threads using the tools provided by Qt. In addition to QMutex, QSemaphore and\
    \ QWaitCondition, Qt provides much more direct mechanisms: events and signals/slots.\
    \ The implementation of signals/slots across thread boundaries relies on events,\
    \ therefore, ensure that your threads start their own event loop using QThread::exec().\n\
    - Register unknown types with the Qt metaobject system. Any unknown types cannot\
    \ be marshaled properly without first invoking qRegisterMetaType(). This enables\
    \ a queued connection to invoke a slot in a separate thread within that thread’s\
    \ context using new types.\n- Utilize queued connections to communicate between\
    \ the application and the database threads. The queued connection approach has\
    \ all the advantages of dealing with asynchronous database connections, but maintains\
    \ a simple and familiar interface using QObject::connect().\n\nDave Benton is\
    \ a professional programmer working for Eventide, Inc. He welcomes your comments\
    \ at dbereton@eventide.com."
