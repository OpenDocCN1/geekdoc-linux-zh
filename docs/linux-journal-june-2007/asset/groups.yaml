    \ 的过时形式 (RFC 2822 4.4)。\n5. 本地部分的最大长度为 64 个字符 (RFC 2821 4.5.3.1)。\n6. 域由点分隔符分隔的标签组成\
    \ (RFC 1035 2.3.1)。\n7. 域标签以字母字符开头，后跟零个或多个字母字符、数字字符或连字符 (-)，以字母或数字字符结尾 (RFC 1035\
    \ 2.3.1)。\n8. 标签的最大长度为 63 个字符 (RFC 1035 2.3.1)。\n9. 域的最大长度为 255 个字符 (RFC 2821\
    \ 4.5.3.1)。\n10. 域必须完全限定，并可解析为 A 类型或 MX 类型 DNS 地址记录 (RFC 2821 3.6)。\n\n**清单 2.\
    \ 来自 IlloveJackDaniels 的更优示例**\n\n```php\nfunction check_email_address($email)\
    \ {\n    // 首先，我们检查是否存在一个 & 符号。\n    // 以及长度是否正确。\n    if (!ereg(\"^[^\"@][^\"\
