    \ GROUP | 15 |\n| portland.com | |\n| RADPACE MANAGED HOSTING | C3 |\n| radpace.com\
    \ | |\n| R CURD TECHNOLOGIES | 37 |\n| rcurdstech.com | |\n| SERVERS DIRECT |\
    \ 39 |\n| serversdirect.com | |\n| SILICON MECHANICS | 33, 77 |\n| siliconmechanics.com\
    \ | |\n| SLIDEST, INC. | 73 |\n| slidest.com | |\n| SUPERMICO | 27 |\n| supermicio.com\
    \ | |\n| TECHNOLOGICAL ADVANTAGE | 49 |\n| technologicalevantage.com | |\n| TOTALWEB\
    \ TECHNOLOGIES | 9 |\n| totalwebtechnologies.com | |\n| TYAN COMPUTER USA, Inc.\
    \ | 7 |\n| tyanc.com | |\n| USENIX | 69 |\n| usenix.org | |\n| UHNHED TECHNOLOGIES\
    \ | 11 |\n| uwahnedi.com | |\n| VIDEO | 13 |\n| veno.com | |\n\n# 使用 SCGI 实现更快的\
    \ Web 应用\n\n**使用 SCGI 加速你的 Web 应用。**\nJEROEN VERMEULEN\n\n如果你正在运行 Web 服务器，那么很可能你不仅仅是在提供静态文本和图像。你可能也在运行一些\
    \ Web 应用，其中的页面由某些程序或脚本通过 CGI（通用网关接口）实时生成。想想博客软件、缺陷跟踪器、新闻网站和内容管理系统——任何将浏览器从文档查看器变为用户界面的东西。而且，你很可能自己编写或至少调整过其中的一些。\n\
    \n本文展示了如何使用 CGI 的替代方案 SCGI（简单通用网关接口）来构建更快的 Web 应用。SCGI 是一种协议，而不仅仅是一个程序，但其作者也提供了参考实现，我们将在此使用它。它包含用于从\
    \ Apache 或 lightd 使用 SCGI 的模块，以及帮助你创建 SCGI 应用的 Python 类。其他语言的实现也是可用的，但这里我们考察的是\
    \ Apache 2.x 和 Python 的组合。\n\n## 时间都去哪儿了？\n\n通常，Web 应用在 Web 服务器的子进程中运行时间很短，但频率很高。当客户端请求某个页面时，Web\
    \ 服务器查询其配置，发现该请求应交给应用程序处理。它将请求委托给一个子进程，该子进程进而加载并运行应用程序。该程序可以是二进制文件，也可以是 Perl、Python\
    \ 或 PHP 脚本、shell 命令，或者几乎任何其他东西。CGI 标准定义了程序如何接收有关请求的详细信息，包括请求的 URL、请求主体、已认证的用户身份和源\
    \ IP 地址。程序读取这些信息，生成页面以响应客户端的请求，然后退出。下一次请求时，这一切都会再次发生。\n\n加载、运行和退出程序的成本可能很高。这对于“睡意朦胧”的程序来说确实有意义：例如，它们可能使用内存而从不释放。在这种情况下，你希望程序短暂运行，然后让操作系统清理其资源。但是，对于当今流行的语言——Perl、Python、PHP、Java\
    \ 和 shell 脚本——在这方面确实没有太多问题。编写良好的应用程序应该能够在单次运行中处理多个请求。\n\n## 使用 SCGI 实现更快的服务\n\n\
    SCGI 允许你的程序启动一次，并继续处理请求，只要它愿意。它是这样工作的：一个独立的服务器进程，称为 SCGI 服务器，独立于 Web 服务器运行，并管理一个\
    \ Web 应用。Web 服务器将该应用的所有请求转发给其 SCGI 服务器。它以与普通 CGI 非常相似的形式传递有关请求的详细信息。\n\nSCGI 服务器将请求委托给一个子进程，就像\
    \ Web 服务器对普通 CGI 应用所做的那样。子进程也运行应用程序，但相似之处到此为止。应用程序在处理完该请求后不会退出，而是可以坐在那里等待新的请求。SCGI\
    \ 服务器的每个子进程运行应用程序的一个实例，每个实例都在有工作要做时保持休眠。\n\n当没有可用的子进程来处理最新请求时，SCGI 服务器会生成一个新的子进程——当然，最多不超过可配置的最大值。它还清理崩溃或退出的子进程，因此如果出现问题，你的\
    \ Web 应用仍然可以退出。但是，大多数时候，当请求到达时，应用程序已经准备好并等待它。这就是为什么 Web 应用框架 Ruby on Rails 附带了通过\
    \ SCGI 运行的选项；否则它太慢了。\n\n## 其他优势\n\n如果速度提升还不够，还有更多。SCGI 服务器进程可以运行在与 Web 服务器相同的系统上，但也不一定必须如此。你可以通过将某些\
    \ Web 应用委托给独立系统来卸载服务器，最好是在防火墙后面，只有 Web 服务器才能访问它们。\n\n即使只有一个服务器，你也可以使用 SCGI 来限制漏洞。普通的\
    \ CGI 应用程序开始时是在与 Web 服务器进程相同的用户身份下运行的。如果攻击者设法颠覆了一个普通的 CGI 应用程序，你的整个网站可能面临风险。另一方面，SCGI\
    \ 服务器可以在自己的用户身份下运行，因此即使它失控，也不容易影响 Web 服务器或其他应用程序。反过来，你不再需要让 Web 服务器访问应用程序的代码或数据；只有由\
    \ SCGI 服务器运行的应用程序需要访问。其他所有人必须通过 Web 服务器，而 Web 服务器进而与 SCGI 服务器通信。\n\n你还可以在 chroot\
    \ 环境或虚拟化服务器中运行应用程序。而在 CGI 中，这会迅速变得昂贵且难以管理。使用 SCGI 时，你只需在隔离环境中启动一个服务器进程——无论是 chroot\
    \ 监狱、虚拟化服务器、不同的用户身份还是另一台机器——整个应用程序都将留在那里。\n\n## 安装 SCGI\n\n你需要两个组件：用于构建 SCGI 应用的\
    \ Python 类，以及让你的 Web 服务器能与应用程序“说 SCGI”的模块。如果你使用 Red Hat 软件包管理（RPM），可以使用 `yum install\
    \ python-scgi apache2-mod_scgi` 来安装这些；Debian 的 apt 用户可以 `apt-get install python-scgi`\n\
    \n"
