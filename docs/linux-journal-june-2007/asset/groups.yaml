    # QUICK TAKES


    # Open-Source Databases,

    Part III: Choosing a Database


    **Which database is right for you? MySQL or PostgreSQL?** REUVEN M. LERNER


    If you are an application developer, you''re probably working with large quantities
    of data. And, if that data is anything more complex than a hash table, you might
    want to consider moving some or all of it into a relational database. Relational
    databases are designed for reliable and flexible retrieval of data. The magic
    of a relational database is not the use of two-dimensional tables to store all
    of the information, but it''s the fact that tables can be combined in many different
    ways and manipulated using the SQL query language.


    As we saw in my database articles in the last two issues of $\overline{\underline{\mathrm{~}}}$,
    open-source programmers are fortunate enough to have several database options
    at their disposal. By far, the two most popular open-source relational databases
    are MySQL and PostgreSQL. Each has a large and loyal following, and each continues
    to improve with every successive version.


    And, when I write "large and loyal following" above, I''m not kidding. MySQL and
    PostgreSQL have long been at the center of a major flame war within the Open Source
    world. If someone on Slashdot dares say something about one of these products,
    you can be sure it won''t be long before someone writes a nasty (and often childish)
    note about the other one. These disagreements often reflect the knee-jerker attitudes
    of uninformed users, but there have been no shortage of attacks from well-known
    and informed users of these products as well.


    I believe there are circumstances when either MySQL or PostgreSQL might be an
    appropriate choice. We strongly preferred PostgreSQL in my work during the last
    decade—yet, there definitely are times when MySQL seems to be the more appropriate
    solution. So, despite my personal biases and the risk of opening a flame war within
    the Open Source community, I now conclude this series about open-source databases
    with a comparison between MySQL and PostgreSQL in a number of different categories.
    I hope by the time you finish reading this article, you understand that choosing
    a database is almost never a matter of finding the "fastest" or "best" product,
    because there is no one way to measure the quality or appropriateness of a relational
    database server. Rather, I hope you''ll be able to consider each of these on the
    basis of its own merits, rather than on the propaganda that is so widespread.


    # Data Integrity


    Perhaps the first and foremost task of a database is to store and retrieve data
    reliably. Just as you wouldn''t want to use a hard disk that occasionally loses
    data, you don''t want to put things into a database that occasionally mangles
    its contents. This is true even if the reliability comes at the expense of speed.


    The gold standard for reliability in the database world has an acronym, ACID (Atomicity,
    Consistency, Isolation and Durability). This means that under all circumstances
    in the database, the following hold true:


    means that under all circumstances in the database, the following hold true:


    +   *   **Atomicity:** each query is guaranteed to complete or not, without any
    possibility of halfway or incomplete states.

    *   **Consistency:** the database is always in a legal state before and after
    a transaction.

    *   **Isolation:** each transaction occurs separately from other actions, so that
    you can''t have two transactions interfering with one another.

    *   **Durability:** transactions persist over time, typically by being stored
    on a filesystem.


    The attitude toward ACID within the PostgreSQL community has been unchanged since
    I first started to use it a decade ago, placing it as the highest possible priority.
    This doesn''t mean PostgreSQL is lacking in other features, but rather it means
    the developers have worked to ensure that data stored in a PostgreSQL system will
    be consistent and reliable, even if you do nasty things such as issue a kill -9
    or pull the plug.


    During the past few years, PostgreSQL has begun to offer even better support for
    transactions and database stability, using write-ahead logs (WALS) that describe
    each action taken by the database. These WAL files can be used to recover from
    a disaster or even to recover the database to an earlier point in its history—a
    feature known as point-in-time-recovery (PITR). Thus, if you know something happened
    yesterday, but the database was working perfectly two days ago, you could use
    PITR to recover to the earlier, stable state. Recent versions of PostgreSQL also
    support two-phase commit, a type of transaction you''re likely to see in a distributed
    system where multiple servers must coordinate their actions.


    MySQL has had a mixed attitude toward ACID during the years. When I first started
    to use MySQL in 1995, the authors'' attitude was that transactions should be handled
    by the application, not the database. Indeed, as recently as 2000, the to-do list
    for MySQL included tasks having to do with production-quality transaction-safe
    tables. This has led to a great deal of bad blood between the MySQL and PostgreSQL
    communities, with members of the latter sometimes claiming that no critical data
    should ever be stored in MySQL.


    The good news is that modern versions of MySQL do indeed support transaction-safe
    tables, using InnoDB, a third-party product released under the GPL that has been
    integrated into MySQL for several years. Moreover, InnoDB appears to use techniques
    that PostgreSQL and Oracle have used for years, such as MVCC (multi-version concurrency
    control). The bad news is that at least some benchmarks I''ve'
  - '[PAGE 44]


    seen indicate that InnoDB has some problems scaling to large numbers of simultaneous
    queries


    In addition, the company that develops InnoDB recently was bought by Oracle, which
    might lead some people to worry about future licensing, development and pricing
    issues. For the time being, this latter issue does not appear to be a serious
    one, because Oracle and MySQL signed a contract in 2006 extending the licensing
    for InnoDB. But, MySQL does not appear to be taking any chances and has hired
    several experts to create a new table structure that will be owned by MySQL and
    thus be impervious to such business problems.


    I’m personally of the persuasion that true ACID compliance is always a good thing
    to have around, much like seat belts in a car. Sure, you can drive without a seat
    belt, and the odds are that nothing will happen to you. But, it’s impossible to
    predict when something bad might happen, and you really don’t want to be without
    a seat belt under such circumstances. In the same way, if you''re a database enforces
    constraints and limits. PostgreSQL tends to be quite stringent on such matters,
    refusing to accept illegal data. MySQL tries to be more forgiving and flexible,
    but that can result in strange and illegal data being stored.


    For example, consider the following set of MySQL commands, in which we create
    a table foo with a single column (named a) of type DATE:


    ```

    ```text

    mysql> CREATE TABLE foo (a date);

    Query OK, 0 rows affected (0.08 sec)


    mysql> INSERT INTO foo (a) VALUES (''2007-feb-30'');

    Query OK, 1 row affected, 1 warning (0.00 sec)


    mysql> SELECT * FROM foo;

    +---------+

    | a       |

    +---------+

    | 0000-00-00 |

    +---------+

    1 row in set (0.00 sec)

    ```

    ```


    By contrast, this is what happens in PostgreSQL:


    ```

    ```text

    atf=# CREATE TABLE foo (a date);

    CREATE TABLE


    atf=# \d foo

    Table "public.foo"

    Column | Type | Modifiers

    -----------|---------|-------------

    a       | date  |


    atf=# INSERT INTO foo (a) VALUES (''2007-feb-30'');

    ERROR:  date/time field value out of range: "2007-feb-30"

    ```

    ```


    It is possible to configure MySQL to be more strict on such issues, but most users
    will not think to do so and will be stuck with illegal values in their tables.


    Given the political and technical issues at MySQL, as well as the weird (and potentially
    dangerous) default behavior in MySQL, I believe that PostgreSQL has a big edge
    on issues of data integrity.


    # Features


    MySQL and PostgreSQL offer a very large number of built-in features, many of which
    have been added in response to community requests and reactions. Both offer a
    large number of data types, which can be mixed and matched within a single row
    without restrictions. (The very limiting row-length restriction that plagued versions
    of PostgreSQL is now ancient history, I’m happy to say.) Both databases now support
    Unicode characters; MySQL supports both UCS-2 and UTF-8 encoding, and PostgreSQL
    supports only the latter.


    Both databases also offer a very large number of functions that manipulate data,
    including strings and dates. It’s quite convenient to be able to compare and sort
    data or to find all rows whose timestamp was within the last 24 hours. PostgreSQL
    interval data type, which describes a length of time (rather than a particular
    point in time), has proven to be particularly useful. MySQL has a number of different
    types that database purists like myself frown upon, such as SET and ENUM, that
    are undoubtely popular for many users.


    In many areas where PostgreSQL has had an advantage, MySQL is beginning to catch
    up. PostgreSQL users have long been able to create new data types and functions
    that operate on those types. Indeed, PostgreSQL offers developers the unusual
    ability to write server-side functions in a number of languages, including SQL,
    Perl, Python, Java, Tcl and the R statistical language. MySQL does not allow for
    the creation of new data types, but recent versions do provide the ability to
    write server-side functions and stored procedures.


    MySQL has offered a built-in solution for full-text search, accomplished by using
    a special type of index on text fields. However, there are some important restrictions
    on this index, such as the fact that it works only with MySAM tables. Given that
    these tables support neither foreign keys nor transactions, I am a bit nervous
    about suggesting them as a solution.


    PostgreSQL’s full-text search solution (search2) has the opposite problem. Although
    it is robust and works well with PostgreSQL’s standard transactional tables, it
    requires some work to configure and install. Most administrators and programmers
    will be able to install it successfully within a short period of time, but nonetheless,
    there is a difference between a built-in capability and one that needs to be added.


    PostgreSQL has a number of built-in features that MySQL either has yet to implement
    or that are scheduled for future releases. Among these are the ability to use
    subselects anywhere in a query, the use of sequences (rather than simple auto-increment
    columns), rules that allow users to modify the way queries are interpreted on
    a given table and CHECK constraints on column values. Recent versions of MySQL
    now include features that were previously available only in PostgreSQL, such as
    triggers and views.


    In general, the PostgreSQL development group seems to emphasize SQL standards
    more than MySQL does, although the MySQL developers appear to be increasingly
    sensitive to this need and now offer an --ansi command-line switch for those people
    who want to work in a standards-compatible mode all of the time. Both MySQL and
    PostgreSQL are extremely easy to use. Each'
