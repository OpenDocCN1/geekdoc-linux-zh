    \ Mozilla 源代码，FreeBSD 源代码可在 **fhr.watson.org** 上获取。LXR 使用户能够仅通过单击一次就跳转到函数定义、搜索使用情况等。它还支持电子邮件和超文本链接的索引。\n\
