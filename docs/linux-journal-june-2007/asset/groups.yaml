    \ 取代并使 RFC 822《ARPA 互联网文本消息标准》过时。\n\n以下是电子邮件地址的要求及相关参考：\n\n1. 电子邮件地址由用 @ 字符分隔的本地部分和域组成\
    \ (RFC 2822 3.4.1)。\n2. 本地部分可以由字母和数字字符组成，以及以下字符：!、#、$、%、&、*、+、-、/、=、?、^、_、.、{、}\
