    对象的字段实际上不过是表中的列（或者用他更正式的说法，是关系中的属性）。这也意味着继承不过是表之间的一种简单关联，它们以某种他似乎没有明确说明的方式（至少在《*Introduction
    to Database Systems*》的第八版中）默默地结合在一起。虽然我不打算与他争论关系理论，但我怀疑他对对象世界的观点受到了一定的质疑，因此并不完全准确。


    **LJ：** 有些人质疑你为什么将这个技术问题与越南战争相提并论，甚至认为这种比较完全不恰当。对此你怎么看？


    **TED：** 我其实有两种反应。首先，对于那些因为有人将越南与战争或政治冲突无关的领域进行类比而感到冒犯的人，我为他们的不满感到抱歉，但美国介入越南战争已经过去了30多年，我们作为国家是时候成熟起来，停止
    nurturing 旧伤疤了。是的，坏事发生了，有些发生在我们身上，有些是因为我们而发生的。现在是时候开始批判性地审视越南，而不是以条件反射般的情绪化反应模式来看待它。


    其次，越南在许多方面是与许多对象/关系映射工具中所发生的情况的完美类比，不仅仅因为越南如今是“泥潭”的同义词，还因为根据罗伯特·麦克纳马拉最近出版的回忆录，美国领导层知道他们正在陷入一个潜在的泥潭，并认为他们能以某种方式驾驭它。对许多人来说，越南是目标不明的定义，但麦克纳马拉的回忆录清楚地表明，美国实际上是在试图“赢得”战争，即赢得越南人民“心”的战争。只是他们不清楚如何利用现有工具来实现这一目标。O/R-M
    的情况类似：我们想要发生什么是很清楚的，只是不清楚我们如何让它发挥作用。


    **LJ：** 我上次跟您交谈时的印象是，db4o 用户们清楚地意识到这种阻抗失配，因此他们贡献的代码和需求正是为了解决这个问题，而不是迫使你接受 SQL
    模型。我理解得对吗？


    **CHRISTOF：** 是的，实际情况是，一些管理人员希望在评估电子表格中“SQL”旁边看到一个勾选。然而，面向对象的开发人员并不希望使用 SQL 来访问他们的数据，除非迫不得已或他们不知道替代方案。事实上，SQL
    是一种 DBA 语言，而不是开发人员语言。我们的开发人员使用 Java 和 .NET。因此，db4o 拥有“Native Queries”（原生查询），即使用原生
    Java 或 .NET 语义查询数据库的能力，这是一种类型安全且 100% 面向对象的解决方案，例如。


    **LJ：** 那报告（reporting）呢，比如？


    **CHRISTOF：** 如果你使用 db4o 运行分布式应用程序，通常不需要报告（你会在车里运行 Crystal Reports 吗？）。如果你仍然需要在某个阶段将你的数据链接到后端
    RDBMS，那么你可以使用 db4o 复制同步（dRS），它使用 Hibernate 将持久化对象同步到中心关系数据仓库，用于分析、备份等。


    具体到报告，实际上可能会走向面向对象。Java 领域的几家供应商（Actuate, Elixir, JasperSoft）以及 Microsoft 在 .NET
    中（Visual Studio 2005—ReportViewer）已经推出了面向对象报告工具。甚至，你可能发现针对普通业务对象，比如“customer”（客户），比针对具有晦涩名称的无类型规范化表进行报告更容易。


    **LJ：** db4o 究竟如何解决这种阻抗失配？


    **TED：** db4o 的方法，像其他 OODBMS 一样，通过不试图将对象以外的任何东西存储到系统中来避免阻抗失配。换句话说，本身没有“映射”，因为没有东西需要映射。（显然，内部
    db4o 进行了一些存储技巧以避免明显的低效率，但这些技巧与任何关系数据库使用的技巧相同，并且在很大程度上对于最终用户来说是黑盒且不可见的。）这意味着存储数据的模式就是对象本身的模式，从而避免了我在越南战争文章中提到的“双模式问题”。


    **CHRISTOF：** 类模型 == 数据库模式。


    **LJ：** 是否可以说，你们希望 db4o 看起来像是 Java 的一个扩展，从而避免阻抗失配？这在实现上可能吗？


    **TED：** 我不确定我会说它是 Java 的扩展，而是一个基本上透明的持久化系统。多年来，有许多研究项目试图使持久化完全透明，包括 Java 领域的几个项目，它们玩了一些有趣的技巧，比如在“new”调用时挂钩构造函数以创建持久对象，以及在调用非默认构造函数时从持久空间加载对象等。由于各种原因，这些大多数都没有走出研究阶段，所以我会对建议
    db4o “扩展” Java（或 .NET，在那方面）持一点谨慎态度。


    **CHRISTOF：** 严格来说，你是对的，Ted。但如果说我们有一种设计哲学，那就是——尽可能透明。让我们在使用持久化时尽可能使用 Java 或 .NET
    的语义和行为，使其对开发人员来说最少侵入且最直观。


    **LJ：** 所以 db4o 的学习曲线不是很陡峭？


    **CHRISTOF：** 不。事实上，odbmsjournal.com 上有一个播客（第 2 集）表明你只需要五分钟就可以开始使用 db4o——包括下载！更具挑战性的是，有些人必须改掉不良的（非面向对象）习惯。他们会问，“我的主键在哪里？”（在面向对象编程中没有主键。）因此，对我们来说，与年轻开发人员合作实际上最容易，特别是在亚洲，他们没有心理遗留问题，并且在编写持久化相关代码时享受十倍的生产力提升。


    **LJ：** 当我与数据库设计师和程序员交谈时，我经常听到他们赞美像 P1CK 这样的多值数据库。你们从用户和开发人员那里收到对多值字段的需求吗？


    **TED：** 我的经验不同——多值数据库用起来很别扭且困难。我认为最终推动讨论的是个人自身的经验，以及你发现什么是显而易见的和直观的。


    就我个人而言，我认为 Date 也会同意这一点，多值字段是大忌，应该避免，因为我个人非常强烈地相信关系模型在数据存储和操作中的力量。


    **LJ：** 这与 O/R 映射如何契合？这会带来更多问题吗？


    **TED：** 在某些方面，不会，因为那只是将类属性中存储的 List（或其他集合）。但在其他方面，这对 O/R-M 工具来说将是一个重大问题，因为现在要决定类内部的
    List 是映射为多值字段还是作为到另一张表的关联，将需要在字段上添加另一个注释/属性来控制映射，从而在对象模型和数据库模式之间产生更多的耦合。


    **LJ：** Java 的 GPL 化在多大程度上影响了你们的工作？它对你们的业务构成挑战还是机会？


    **CHRISTOF：** GPL 化，实际上是 Java 的双许可证，对 db4o 来说是三大好消息。首先，Java 的开源确实促进了 Java 生态系统，从
    IBM 到 Eclipse 到许多开源项目和初创公司。其次，通过开源，我们可以展望构建比之前可能的更紧密的 db4o 持久化解决方案与 Java VM 的集成。第三，双许可证模式本身，如
    MySQL、db4objects、Trolltech 和许多其他公司所用，作为可行的开源商业模式得到了进一步的背书，这也使我们的公司生活变得更加轻松。


    **LJ：** 你的客户对 Java 转向 GPL 这一事实有何反应？你看到对 Java 的兴趣增加还是减少？对 db4o 的兴趣增加还是减少？


    **CHRISTOF：** 在过去几个月里，我们看到了 db4o 的 Java 用户的大量增长，无论是在绝对数量上还是相对于我们其他平台 .NET 的比例。我们并不真正知道这是否是因为
    Java 开源，但这将提供一个很好的解释。


    **LJ：** 非常感谢你抽出时间和精力与我们交谈。


    Nicholas Petreley 是 Linux Journal 的主编，也是一位前程序员、教师、分析师和顾问，已经从事 Linux 工作和写作超过十年。


