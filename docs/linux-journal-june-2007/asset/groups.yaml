    is developed in a participation age. The way you make money is not by locking
    people in a license at the beginning, but rather by providing the capabilities
    people want once they''re running things. In the meshed world, what helps you
    be successful in a business is influence. And, you get influence not by power
    but by being valuable. My vision is that we''re switching over to this new world
    of influence instead of control, of value instead of power, of participation instead
    of distribution.


    So, we can expect to see a rolling tide of change where the principles of the
