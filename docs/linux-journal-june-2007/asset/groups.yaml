  - '[PAGE 15]


    # [ UPFRONT ]


    # ## This Issue of LJ Dedicated to John Backus


    I had written and submitted this month''s Beachhead column, with a slant toward
    this issue''s theme of computer languages, and in particular, the language FORTRAN,
    which was the first computer language I ever learned. And, although in my column
    I pointed out the benefit of learning machine and assembly language, I honestly
    do not believe that I would have gone into the programming field if it were not
    for FORTRAN.


    On March 20, 2007, two weeks after I submitted the article, I got the very sad
    news of the March 17th death of John Backus. John was the man who people credit
    as the "Father of FORTRAN", and one of two people credited with Backus-Naur Form,
    a language invented to describe languages. I sent the message out to my local
    Linux user group, and during the next week it appeared again and again in various
    mailing lists.


    With today''s languages and computers, it is hard for people to know or (for those
    of us old enough) even to remember those early days. Today, concepts we take for
    granted were both revolutionary and difficult in conception in those days. There
    were people who thought computers would never be able to be programmed in anything
    other than machine code, and I am sure that John and his staff met more than their
    share of skeptics, but they persevered. And, out of the work they did on the first
    successful high-level language came many more successes by many more people on
    many more languages.


    So I asked Linux Journal to dedicate this issue devoted to languages to John Backus:
    Computer Scientist Extraordinaire and Humanitarian, 1924–2007.


    And, as we contribute our pieces to the future of computer science, may we hope
    someday in our own way to contribute as much as he did.


    —JON “MADDog” HALL


    # ## A Nice Handful


    You’ve gotta like an MP3 player that goes out of its way to play OGG and brag
    about its Linux-friendliness (the literature says “Linux from kernel 2.4.x”).
    That would explain why TrekStor’s VibeZ player has been getting some nice buzz
    in Linux circles.


    Upsides: you can load it as a plain USB storage device. It plays back OGG (plus
    MP3, WAV, FLAC and WMA). It has line-in and microphone recording, a color display,
    a USB-chargeable battery (plus a spare), device-deletion of files, adjustable
    play speed and a very slick non-iPod design. It’s the size of a soap bar—4"×2"×.7",
    with highly rounded corners. And, it’s a lot lighter—only 2.5 ounces.


    ![](img/526fd434dcfcf1b461b94c24ea170f36_15_0.png)


    Downside: not a lot of storage. Ranges from 8–15GB at prices that start at around
    $200 US.


    —DOC SEARLS


    # ## IdeaStorm


    # ### Hardware OEM Learnings of Linux for Make Benefit Glorious Company of Dellstan


    Early this year, Dell created a Digg-like site called Dell | IdeaStorm (“Where
    Your Ideas Reign”). The idea was for readers to submit ideas for the company,
    then have other readers vote and comment on them. Next to the title logo ran hints,
    such as “How can technology companies address climate change?” (over “click here
    to Read Dell’s point of view”). Needless to say, this opened the floodgates holding
    back a tide of Linux demand.


    As of 8am CDT on March 13, 2007, here were the top ten vote-getters:


    +   1. 108,886 votes: “Pre-Installed Linux | OpenSUSE | Fedora | OpenSUSE | Multi-Boot”

    2. 73,840 votes: “Pre-Installed OpenOffice.org | alternative to MS Works & MS
    Office”

    3. 54,300 votes: “Stripped down, fast Linux box”

    4. 50,653 votes: “Have Firefox pre-installed as default browser”

    5. 49,990 votes: “No OS preloaded”

    6. 51,048 votes: “NO EXTRA SOFTWARE OPTION”

    7. 35,867 votes: “Provide Linux drivers for all your hardware”

    8. 29,041 votes: “Linux 2.6.16 ready (sticker)”

    9. 20,288 votes: “National Call Centers”

    10. 17,376 votes: “LinuxBIOS instead of proprietary BIOS”


    One hour later, Dell added two more posts of its own. On the IdeaStorm page, it
    posted “Linux—We''re listening—Now Tell Us More”. On the Direct2Dell.com page,
    it added “Dell to Expand Linux Options”. Both pointed to a survey at www.dell.com/linuxsurvey.
    The survey was also titled “Linux Learnings: We''re Listening”.


    Hence the headline above.


    —DOC SEARLS'
