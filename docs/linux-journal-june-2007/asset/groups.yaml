    ## 西蒙·菲利普斯访谈


    ### 西蒙·菲利普斯捍卫 Sun 的开源根源及 Java 的 GPL 化。

    作者：Glyn Moody


    在 2001 年加入 Sun 之前，西蒙·菲利普斯（Simon Phipps）曾在 IBM 工作十年，担任首席 Java 和 XML 布道者（Evangelist）。他在
    20 世纪 80 年代末首次接触自由软件，当时他在 Unisys 工作的同时，利用业余时间在家销售免费软件（freeware）。如今，菲利普斯是 Sun 的首席开源官（Chief
    Open Source Officer），在公司将整个软件产品线转向开源的过程中，他发挥着关键作用。


    **GM：当你加入 Sun 时，那里的开源活动处于什么状态？**

    **SP：**我将 Sun 视为最初的开源初创公司。这是我能想到的第一家寿命较长、并将开源作为商业模式基础的公司。回顾 Sun 数十年的历史，你会发现它一直在软件和硬件方面与社区进行开放合作。它通过
    NFS（网络文件系统）、TCP/IP、Java 这样做，现在又通过 OpenSolaris 及其余产品线继续这样做。因此，从某种意义上说，Sun 始终存在并且依然保留着非常、非常强烈的开源精神。


    当我加入 Sun 时，Sun 正处在一些极具激进性的商业开源实验的最前沿——其中一个是启动 OpenOffice.org，另一个是启动 NetBeans。在
    Sun 内部，人们强烈讨论 Solaris 的开源未来，因为它的血统本就是开源的，而且很明显，让它未来保持开源也是一件好事。因此，在 2000/2001 年，Solaris
    的法律合规工作开始了。


    **GM：那具体涉及了什么内容？**

    **SP：** 当你拥有一段 20 年历史的代码时，必须经历的过程就是理清代码的所有权归属。这实际上是一个相当棘手的问题，因为在几十年的演变中，证明标准逐渐变得愈发严格。仅仅因为文件头没有标注，并不意味着它不属于其他人。其他人可能拥有其权利。因此，我们在
    Solaris 团队中拥有一支令人惊叹的队伍，他们从事你可能称之为“许可权考古学”的工作——审查代码，将其与来源已知的其他代码进行比较，查看变量命名风格和缩进风格、注释的语言，以尝试对代码的来源达成合理的证明标准。


    有些事情关于代码起源更为明显，我们能够查阅法律档案中的许可证，并弄清我们是否拥有权利。对于其中相当多部分，我们随后不得不回去谈判第三方再许可权（sublicensability）。在许多情况下，我们发现对方很乐意授予我们这项权利。也有某些案例，我们发现被许可方已不复存在；弄清被放弃的代码属于谁，是另一门艺术。


    你还必须留意另一种代码，它基于信息披露，而该披露本身受商业保密条款约束。因此，尽管代码是我们编写的，我们实际上没有权利公开它，因为这样做会泄露商业秘密。我们至今仍在处理部分此类代码的问题，特别是来自显卡制造商的代码，他们愿意在商业保密条款下告知我们其芯片组的工作原理，但继续拒绝允许我们实际公开源代码。


    **GM：推想在你思考许可证的同时——你们是如何最终选定 CDDL 许可证的？**

    **SP：** Solaris 源自 BSD。实际上，BSD 在某个时间点与 System V 合并过，因此有很多人认为我们应该使用 BSD 作为许可证。然而，Solaris
    中许多创新是由最近入职的人完成的——较年轻、才华横溢的工程师。此外，也有强烈的观点认为我们应该使用 GPL。同时，很多人觉得 Mozilla 的许可方式是正确的。


    使用 GPL 的难点在于，随着我们进行许可权考古学调研，情况变得清晰：软件中会有一些地方，我们无法就源代码谈判获得免费许可。不，代码中有一些相当重要的部分，而且在很长一段时间内，这类部分会有很多。这或许是决定不使用
    GPL 而使用 Mozilla 许可证的决定性因素。


    我们研究了 Mozilla 许可证，并意识到无法原样使用它。我们看到许可证泛滥（proliferation）正在成为一个日益严重的问题。因此，我们决定通过参数化它，为自由软件和开源社区做件好事，制作出最后一个未来不再需要克隆的
    Mozilla 许可证变体。我们保留尽可能多的原始语言，并创建了《通用开发分发许可证》（Common Development and Distribution
    License，简称 CDDL）。在我看来，CDDL 是一个绝对优秀的许可证；如果不是 Sun 写的，它肯定会被誉为杰作。


    **GM：你如何看待 OpenSolaris 与 GNU/Linux 之间的关系？**

    **SP：** 我认为这两个词之间有巨大的重叠。运行像 Nexenta 这样的 OpenSolaris 发行版时，你会发现一些有趣的事情：天哪，它看起来就像
    Ubuntu。你知道，这有一个很好的理由：因为它本质上就是 Ubuntu，只是里面用了 Solaris 内核。


    当你审视类 UNIX 操作系统到底是什么时，每个系统都是关于希望围绕哪个内核组装哪些自由软件的一组编辑选择。所以，如果你发现 Fedora、FreeBSD
    和 OpenSolaris 里的所有人都在使用相同的东西。他们都在使用 GNOME 或 KDE，都在使用 Sendmail，都在使用 Mozilla。在 Solaris
    社区，他们倾向于使用 OpenSolaris ON，这是 OpenSolaris 术语中“内核和网络”的说法。ON 代表操作系统网络（Operating System
    Networking）。围绕内核的用户空间（userland），有一种运行服务器的人使用的用户空间风格。还有开发人员使用的用户空间风格，通常包括 GNOME
    或 KDE 以及工具。在 Solaris 上与在 Fedora 上是一样的。外观和感觉不同，关于图标放置位置的编辑选择不同，但归根结底，都是同样的东西。


    因此，我认为随着我们向前发展，我们会看到对类 UNIX 操作系统思考方式的逐渐转变。我们将越来越少地看到人们试图任意区分该社区中不同的对等系统。我认为人们试图在
    UNIX 和 Linux 之间强行划定的界限，是各大公司贬低竞争对手 UNIX 版本的一种策略。我认为这损害了所有人的利益，因为真正的竞争对手不是别人的类
    UNIX 操作系统，而是那些闭源产品。我认为未来，我们会看到有人决定运行带有 Solaris 内核的 Debian 用户空间，也会有人使用受 Solaris
    启发的极简安装并搭配 Linux 2.6 内核。我们将看到人们开始将 BSD 内核与 KDE 以及从 Solaris 社区获得的包管理器一起使用。


    **GM：Java 开放的历史背景是什么？**

    **SP：** 20 世纪 90 年代末，开源世界发生的事情是意识到“带源代码的许可”在商业上是可行的。我们看到 Mozilla 被发布，然后看到开源促进会（Open
    Source Initiative）接受了 Debian 社会契约并将其转化为开源定义。与此同时，在 Sun 这边，一切都忙得不可开交；业务量远超 Sun
    的处理能力。它真的没有带宽去处理开源社区那边发生的事情。因此，它很大程度上忽视了这一点，因为日程已经排满了。


    更糟糕的是，做开源工作的那些人对 Java 真的相当敌视。这种敌意并未因认识到 Java 来自一家如今会被公认为开源的公司而得到缓和。开源运动正忙于接受来自
    IBM 的善意以促进 Linux——不妨说，这并非完全独立于 Linux 不是 Solaris 这一事实。在 2000 年到 2003 年之间，一股不满的情绪正在顺畅地运转，所有参与者都竭尽全力确保理解和协作不会爆发。


    **GM：那么后来发生了什么？**

    **SP：** Sun 经历了一种近乎死亡体验，当互联网泡沫（dot-com bubble）破裂时。它看到股价跌至先前价值的十分之一，并看到裁撤大量员工的必要性。突然非常明显的是，许多不分享
    Sun 价值观的人不再属于这里；同样明显的是，Sun 此前采取的一些软件方法实际上并不符合 Sun 的长期价值观。


    大约在 2003 年改变的是，人们意识到 Java 拥有一个庞大的国际社区。它实际上拥有一个庞大的开源社区，在 Java 平台之上进行开发，使用像 Spring、Hibernate、JBoss
    等开源工具。我认为，人们逐渐越来越清楚地意识到，这个社区可能不再像以前那样容易受到垄断的影响。这意味着将防止垄断作为第一优先级的重要性在降低，开始思考 Java
    平台许可的其他优先级变得可以接受。


    **GM：关于许可证呢？你们是如何做出选择 GPL 这一惊人决定的？**

    **SP：** 我们为 Java 平台审视了几乎所有你能想象的许可证。显然，很多人以为我们会使用 CDDL。我们有几个问题需要自问：其中之一是哪个许可证最有可能防止某个大声疾呼者对代码实施垄断。另一个因素是询问我们是否不使用
