    \n美国 $5.00 | 加拿大 $6.50\n\n# Qt 4.x 异步数据访问\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_1_0.png)\n\
    \n# 企业级和高性能计算尽在掌握\n\nAppro 通过整合满足企业 HPC 市场需求的最新技术，引领 4P x86 计算领域。\n\n### 4 路 XxtremeWorkstation™\n\
    - AMD Opteron™ 8000 系列处理器\n- 最高 128GB DDR2 533/667 内存\n- 最高 6.0TB SATA 或 2.4TB\
    \ SAS\n- 热插拔硬盘\n- 2 个用于高端显卡的 PCI-E x16 插槽\n- Windows® 或 Linux 操作系统\n\n### 4 路\
    \ 3U XxtremeServer™\n- AMD Opteron™ 8000 系列处理器\n- 最高 128GB DDR2 533/667 内存\n-\
    \ 最高 4.5TB SATA 或 1.8TB SAS\n- 2 个 PCI-E x16 和 3 个 PCI-X 插槽\n- 热插拔硬盘\n- 冗余电源和风扇\n\
    - ServerDome 管理 – IPMI 2.0\n- Windows® 或 Linux 操作系统\n\n如需更多信息，请访问 www.appro.com\
    \ 或拨打 Appro 销售热线 800-927-5464\n\n### AMD Opteron™ 处理器\n- 支持四核 - 无需改变数据中心基础设施即可增加容量\n\
    - 结合节能 DDR2 实现最佳每瓦性能\n- 通过直接连接架构优化系统性能\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_1_1.png)\n\
    \n# 今天，Jack 在伦敦配置了一台交换机，在悉尼重启了服务器，并观看了他的球队在辛辛那提打出制胜一击。\n\n借助 Avocent 数据中心管理解决方案，世界最终可以围绕着你转动。Avocent\
    \ 将安全的访问和控制权直接置于你的指尖 – 从多平台服务器到网络路由器，从远程数据中心到现场办公室。你可以从单一屏幕管理一切，无论身在何处。这意味着你可以排查故障、重启或升级你的数据中心设备\
    \ – 就如同你正坐在设备前一样。Avocent 简化你的工作日。多出来的时间如何支配由你决定。\n\n如需了解有关提高数据中心性能的信息，请访问 **www.avocent.com/control**\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_2_0.png)\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_2_1.png)\n\
    \nAvocent、Avocent 标志以及 The Power of Being There 是 Avocent Corporation 的注册商标。所有其他商标或公司名称是其各自公司的商标或注册商标。版权所有\
    \ © 2007 Avocent Corporation。\n\n## 目录\n\n### 2007 年 6 月\n#### 第 158 期\n\n###\
    \ 封面故事\n\n- 46 **与 Simon Phips 的访谈**\n  为什么 Sun 决定将 Java 采用 GPL 许可？\n  Glyn Moody\n\
    \n### 特色文章\n\n- 50 **用 Python 编程，第一部分**\n  了解为什么人们热爱 Python。\n  José P. E. Fernandez\n\
    \n- 58 **使用 Qt 4.x 进行异步数据库访问**\n  希望你的数据库驱动应用程序运行得更好吗？\n  Dave Berton\n\n- 64\
    \ **用 PHP 正确验证电子邮件地址**\n  有眼不识金镶玉（并非所有闪光的都是金子）。\n  Douglas Lovell\n\n- 70 **Christof\
    \ Wittig 和 Ted Neward 论面向对象的映射到数据库**\n  对象/关系阻抗失配。\n  Nicholas Petreley\n\n**封面上的文章**\n\
    - 元编程入门，第 74 页\n- 在浏览器中查看代码，第 78 页\n- SCGI 用于更快的 Web 应用程序，第 82 页\n- OpenOffice.org\
    \ 扩展，第 88 页\n- Lua 概述，第 92 页\n- 在 PHP 中验证电子邮件，第 64 页\n- 与 Sun 首席开源官的访谈，第 46 页\n\
    - 对象关系映射的泥潭，第 70 页\n- Qt 4.x 异步数据访问，第 58 页\n\n2 | 2007 年 6 月 www.linuxjournal.com\n\
    \n# 竞争对手毫无胜算。\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_4_0.png)\n\n如果你的部署决策基于性能和价格，Coyote\
