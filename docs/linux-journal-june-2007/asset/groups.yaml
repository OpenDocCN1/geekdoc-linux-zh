    # ## Next Month


    # ### IMAGE PROCESSING


    The third Shrek movie involves vastly more complex image processing compared to
    the first two. Next month, we explore the details of how DreamWorks Animation
    put Linux through 20 million CPU render hours to produce this amazing work of
    art. Want to switch to Linux but can''t do it without Adobe Photoshop? Our interview
    with Pavel Kanzelberger, the creator of the Photoshop Linux work-alike, Pixel,
    is a must read for you.


    As always, there''s much more. For example, we give you details on how to implement
    Internationalization and Localization in your code, and we continue our tutorial
    on Python with the basics we bypassed in the first installment.'
  - '[PAGE 6]


    # GEMINI 2U

    – Ultra Dense Series


    +   - Two fully independent systems in a 2U

    - Ability to run two discrete operating systems in one box

    - Up to 16 CPU cores

    - Up to 12 hot-swappable SATA, SCSI, or SAS hard drives

    - RAID 0, 1, 5, 6, 10, 50 available on both systems

    - Opteron™ or Xeon™ multi-core processors

    - Up to 64GB memory per motherboard

    - One available PCI-X or PCI-E slot per motherboard

    - High efficiency AC and DC power options


    # 2 Systems in One


    Built on open standards, the Gemini 2U elegantly accommodates two discrete motherboards
    in a 25" chassis uniquely designed for easy access from the rear.


    Gemini 2U represents the realization of intoxicating power and superior environmental
    specifications, with considerably less power consumption, less heat and less noise.
    Remarkably, it all fits nicely into any standard rack. Front to back, Gemini 2U
    is both powerful and efficient.


    At Open Source Systems we understand you need practical, customizable, and affordable
    solutions that are easy to manage and maintain.


    For more information and to request your evaluation unit today, visit us at [www.OpenSourceSystems.com](http://www.OpenSourceSystems.com),
    or call direct at 866.664.7867.


    ![](img/526fd434dcfcf1b461b94c24ea170f36_6_0.png)


