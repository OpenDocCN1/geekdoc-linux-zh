    \n**Which database is right for you? MySQL or PostgreSQL?**  \nREUVEN M. LERNER\n\
    \nIf you are an application developer, you're probably working with large quantities\
    \ of data. And, if that data is anything more complex than a hash table, you might\
    \ want to consider moving some or all of it into a relational database. Relational\
    \ databases are designed for reliable and flexible retrieval of data. The magic\
    \ of a relational database is not the use of two-dimensional tables to store all\
    \ of the information, but it's the fact that tables can be combined in many different\
    \ ways and manipulated using the SQL query language.\n\nAs we saw in my database\
    \ articles in the last two issues of *Linux Journal*, open-source programmers\
    \ are fortunate enough to have several database options at their disposal. By\
