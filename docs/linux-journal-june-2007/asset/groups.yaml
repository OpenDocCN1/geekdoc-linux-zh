    # [卷首语]


    ## 本期 LJ 致敬 John Backus


    我撰写并提交了本月的“前沿阵地”专栏，该专栏侧重于本期的主题——计算机语言，特别是 FORTRAN，这是我最初学习的第一种计算机语言。虽然在我的专栏中我指出了学习机器语言和汇编语言的好处，但我诚实地认为，如果不是因为
    FORTRAN，我当初不会进入编程领域。


    2007 年 3 月 20 日，在我提交文章两周后，我收到了 John Backus 于 3 月 17 日去世的悲痛消息。John 是被人们誉为“FORTRAN
    之父”的人，也是被归功于发明 Backus-Naur 形式（一种用于描述语言的语言）的两人之一。我向当地的 Linux 用户组发送了消息，在接下来的一周里，该消息反复出现在各种邮件列表中。


    以今天的语言和计算机水平，人们很难了解（或者对于像我们这样年纪大的人来说，甚至很难记得）那些早期的日子。今天，我们视为理所当然的概念在当时既是革命性的，在构思上也十分困难。有人认为计算机永远无法用机器代码以外的任何语言进行编程，我确信
    John 和他的团队遇到了远超其份额的怀疑者，但他们坚持不懈。他们在第一个成功的高级语言上的工作，由此衍生出更多人在更多语言上的众多成功。


    因此，我请《Linux 杂志》将本期关于语言的期刊奉献给 John Backus：杰出的计算机科学家和人道主义者，1924–2007。


    当我们为计算机科学的未来做出贡献时，希望有一天我们也能以我们的方式做出和他一样多的贡献。


    —JON “MADDog” HALL


    ## 小巧精致


    你肯定喜欢一款专门兼容 OGG 格式并吹嘘其 Linux 友好性的 MP3 播放器（文献称其为“Linux 内核 2.4.x”）。这也解释了为什么 TrekStor
    的 VibeZ 播放器在 Linux 圈子中引起了不小的轰动。


