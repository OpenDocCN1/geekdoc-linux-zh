    \ 8 包含了一系列任何电子邮件验证都应通过的电子邮件地址测试用例。务必运行测试以查看有效和被拒绝的电子邮件地址，PHP 字符串内的双重转义符 \\ (\\\
    \\) 往往会使地址变得难以辨认。我们向你发出挑战，用此测试来检验你最喜欢的电子邮件验证代码。请相信，清单 9 中的代码确实通过了测试！\n\n清单 9 包含一个完整的电子邮件地址验证函数。它不像许多其他函数那样简洁——当然不是一行代码就能搞定的。但它的阅读和理解非常直观，并且能够正确地接受和拒绝许多其他已发布的函数错误拒绝和接受的电子邮件地址。该函数大致按照成本递增的顺序排列验证测试。特别是，更复杂的正则表达式，以及肯定是\
    \ DNS 查询，都放在最后。\n\n传播这个知识吧！存在一种风险，即常见用法和广泛的随意编码可能会确立一种事实上的电子邮件地址标准，该标准比记录在案的正式标准更具限制性。如果你想欺骗垃圾邮件机器人，可以采用诸如\
    \ [^\\^|D@*^G@^cartron.com] 这样的电子邮件格式。不幸的是，你可能会发现一些合法的电子商务网站也是如此。你觉得哪一个适应得更快？\n\
