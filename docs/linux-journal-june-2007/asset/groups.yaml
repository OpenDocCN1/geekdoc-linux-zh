    # 前沿

    新闻 + 趣味


    # 内核开发新动向


    ## diff -u


    Ingo Molnar 实现了一个名为 Syslets 的新类语言包装器系统，用于从用户空间管理系统调用。这些小程序可以异步运行系统调用，根据用户意愿响应其行为，而不必返回用户空间。使用
    Syslet 包装器，Ingo 测量到比缓存同步 I/O 快 33.9%，比非缓存同步 I/O 快 19.2%。内核黑客对 Syslets 的兴趣相当高，尽管
    Linus Torvalds 认为 Syslet 编程接口过于复杂，难以让休闲用户尝试。显然，在 Syslets 准备好进入主树之前，仍有一些工作需要完成。


    Intel 发布了 PRO/Wireless 3945ABG 网络适配器驱动程序。与其他一些 Intel 驱动程序不同，这个驱动程序不依赖于专有守护进程；它是完全开源的。不过，它确实需要微代码升级。这种改善的许可情况显然并非由于硬件的不同特性，而是由于微代码本身的改进。Intel
    的驱动程序在内核社区中反应良好，似乎即将被纳入源代码树。


    著名且长期存在的 10 个漏洞，允许驱动程序假装它们是 GPL 的即使它们不是，正在被关闭。几个人正在处理这个问题，最值得注意的是 Jan Engelhardt，他最近发布了一个补丁来修复它。围绕这个补丁存在争议，因为一些人认为，如果内核对非
    GPL 驱动程序施加的限制比对 GPL 驱动程序的更多，这就构成了一个许可执行功能，这可能违反 GNU 通用公共许可证的条款。只要这个漏洞存在于代码中，辩论就可以保持休眠状态，因为驱动程序编写者可以绕过控制。一旦控制真正开始起作用，像
    LinxAnt 这样过去利用过该漏洞的公司立即会对此辩论产生兴趣。


    KVM 虚拟机代码将其开发树从 Subversion 迁移到 git，原因有几个。Avi Kivity 解释说，Subversion 无法高效托管整个内核树，并且开发人员希望独立维护自己的分支。


    Jon Masters 是新的 module-init-tools 维护者，接替了 Rusty Russell 的工作，并修补了 MAINTAINERS 文件以反映这一变化。Evgeny
    Dushistov 也在 MAINTAINERS 文件中创建了 UFS 条目，并将自己列为维护者。


    Alessandro Di Marco 发布了一个他一直在玩的新的用户无操作触发器时，得到的比预想的要多。这是一个不错的功能，当用户在特定时间内没有活动时会发出
    ACPI 事件。他出于乐趣敲定了代码，故意避免关于最优实现细节的问题，假设实际上不会太多人关注这个功能。结果证明，很多人感兴趣，并且有很多实现建议。首先，Arjan
    van de Ven 指出 udev 比 ACPI 更好的投递机制。Pavel Machek 指出 Alessandro 新的 /proc 文件在 /sys
    目录中会更好。Pavel 还建议用户空间整体上是此类功能的更好位置，尽管 Alessandro 认为这会增加代码的复杂性。他快速回应了许多建议，产生了新版本的补丁，回答了
    linux-kernel 邮件列表上提出的异议。


    下一个 Linux 内核峰会的计划已经开始。内核团队将其托管地点从传统的加拿大渥太华聚会改为英格兰剑桥。新的举办地开启了未来不同举办地的可能性，并且有人提议了多个地点，包括澳大利亚、印度和捷克。选择未来地点的一个主要因素将是整体成本。许多内核人员每年在支付前往峰会机票费用的公司工作，但有些价格变得令人望而却步。举办地点所在的拥有更多参加者的国家比组织者更有可能主办峰会。但当然，任何事情都可能发生。
    —ZACK BROWN


    ![](img/526fd434dcfcf1b461b94c24ea170f36_13_0.png)


