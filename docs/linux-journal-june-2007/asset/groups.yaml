    \ 联系我们\n\n# 以 HTML 方式阅读源代码\n\n**交叉引用并将源代码转换为 HTML 以便于浏览。** KAMAR SOOMRO\n\n**每个优秀的程序员**迟早都要研究源代码。有时是为了学习新的编码风格。有时是为了了解某样东西是如何工作的。无论原因如何，没有源代码研究，程序员无法工作。研究小型项目的源代码并不困难。你很容易不用正式方法就能做到。然而，当你想要研究大型项目的源代码时，跟踪各种函数、变量及其定义就成了一个巨大的问题。如果人们能找到在线的源代码，那真是幸运——这意味着他们可以使用工具来处理源代码并帮助他们进行研究。这样的工具为研究源代码的人们提供了以前梦想不到的优势和灵活性。LXR（Linux\
