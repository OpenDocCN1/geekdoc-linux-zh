    n\";\n} else {\n    echo \"is deficient.\\n\";\n}\n?>\n```\n\nNow, the local part\
    \ has one of two forms. It may have a begin and end quote with no unescaped embedded\
    \ quotes. The local part, Doug \\\"Ace\\\" L. is an example. The second form for\
    \ the local part, (+.+), where + stands for a whole slew of allowable characters.\
    \ The second form is more common than the first; so, check for that first. Look\
    \ for the quoted form after failing the unquoted form.\n\nCharacters quoting using\
    \ the back slash (\\) pose a problem. This form allows doubling the back-slash\
    \ character to get a back-slash character in the interpreted result (\\). This\
    \ means we need to check for an odd number of back-slash characters quoting a\
    \ non-back-slash character. We need to allow \\\\\\\\ and reject \\\\\\\\\\\\\
    .\n\nIt is possible to write a regular expression that finds an odd number of\
    \ backslashes before a non-backslash character. It is possible, but not pretty.\
    \ The appeal is further reduced by the fact that the backslash character is an\
    \ escape character in PHP strings and an escape character in regular expressions.\
    \ We need to write four back-slash characters in the PHP string representing the\
    \ regular expression to show the regular expression interpreter a single back\
    \ slash. A more appealing solution is simply to strip all pairs of back-slash\
    \ characters from the test string before checking it with the regular expression.\
    \ The str_replace function fits the bill. Listing 5 shows a test for the content\
    \ of the local part.\n\nThe regular expression in the outer test looks for a sequence\
    \ of allowable or escaped characters. Failing that, the inner test looks for a\
    \ sequence of escaped quote characters or any other character within a pair of\
    \ quotes.\n\nIf you are validating an e-mail address entered as POST data, which\
    \ is likely, you have to be careful about input that contains back-slash (\\),\
    \ single-quote (') or double-quote (\"\") (\\). PHP may or may not escape those\
    \ characters with an extra back-slash character wherever they occur in POST data.\
    \ The name for this behavior is magic_quotes_gpc, where gpc stands for get, post,\
    \ cookie. You can stop the magic code via the function, get_magic_quotes_gpc(),\
    \ and strip the added slashes on an affirmative response. You also can ensure\
    \ that the PHPini file disables this 'feature'. Two other settings to watch for\
    \ are magic_quotes_runtime and magic_quotes_sybase.\n\nThe two regular expressions\
    \ in Listing 5 are appealing because they are relatively easy to comprehend and\
    \ don't require repetition of the allowable character group ([A-Za-z0-9!#$%&'*+\\\
    -/=?^_`{|}~-.]). Here's a test for you. Why does the character group require two\
    \ back-slash characters before the forward slash and one back-slash character\
    \ before the single quote?\n\nOne deficiency of the outer test of Listing 5 is\
    \ that it passes local part strings that include dots anywhere in the string.\
    \ Requirement number two states that dots can't start or end the local part, and\
    \ they can't appear together two or more times. We could address this by expanding\
    \ the outer regular expression into form (+a+), where a is [(\\\\[A-Za-z0-9!#$%&'*+\\\
    -/=?^_`{|}~-.])\\. We could, but that leads to a long, hard-to-read, repetitive\
    \ expression that's difficult to believe in. It's clearer to add the simple checks\
    \ shown in Listing 6."
  md: "\nRequirement number four covers a now obsolete form that is arguably permissive.\
    \ Agents issuing new addresses could legitimately disallow it; however, an existing\
    \ address that uses this form remains a valid address.\n\nThe standard assumes\
    \ a seven-bit character encoding, not multi-byte characters. Consequently, according\
    \ to RFC 2234, “alphabetic” corresponds to the Latin alphabetic character ranges\
    \ a–z and A–Z. Likewise, “numeric” refers to the digits 0–9. The lovely international\
    \ standard Unicode alphabets are not accommodated—not even encoded as UTF-8. ASCII\
    \ still rules here.\n\n## Developing a Better E-mail Validator\n\nThat’s a lot\
    \ of requirements! Most of them refer to the local part and domain. It makes sense,\
    \ then, to start with splitting the e-mail address around the at sign separator.\
    \ Requirements 2–5 apply to the local part, and 6–10 apply to the domain.\n\n\
    The at sign can be escaped in the local name. Examples are, Abc\\@def@example.com\
    \ and \"Abc@def\"@example.com. This means an explode on at the sign, `$split =\
    \ explode(\"@\", $email);` or another similar trick to separate the local and\
    \ domain parts will not always work. We can try removing escaped at signs, `$cleanat\
    \ = str_replace(\"\\@\", \"\", $email);` but that will miss pathological cases,\
    \ such as Abc\\\\@example.com. Fortunately, such escaped at signs are not allowed\
    \ in the domain part. The last occurrence of the at sign must definitely be the\
    \ separator. The way to separate the local and domain parts, then, is to use the\
    \ strrpos function to find the last at sign in the e-mail string.\n\nListing 3\
    \ provides a better method for splitting the local part and domain of an e-mail\
    \ address. The return type of strrpos will be boolean-valued false if the at sign\
    \ does not occur in the e-mail string. Let’s start with the easy test first. Checking\
    \ the lengths of the local part and domain is simple. If those tests fail, there’s\
    \ no need to do the more complicated tests. Listing 4 shows the code for making\
    \ the length tests.\n\n### Listing 3. Splitting the Local Part and Domain\n\n\
    ```php\n$isValid = true;\n$atIndex = strrpos($email, \"@\");\nif (!is_bool($atIndex)\
    \ && !$atIndex)\n{\n    $isValid = false;\n}\nelse\n{\n    $domain = substr($email,\
    \ $atIndex+1);\n    $local  = substr($email, 0, $atIndex);\n    // ... work with\
    \ domain and local parts\n}\n```\n\n### Listing 4. Length Tests for Local Part\
    \ and Domain\n\n```php\n$localLen = strlen($local);\n$domainLen = strlen($domain);\n\
    if ($localLen < 1 || $localLen > 64)\n{\n    // local part length exceeded\n \
    \   $isValid = false;\n}\nelse if ($domainLen < 1 || $domainLen > 255)\n{\n  \
    \  // domain part length exceeded\n    $isValid = false;\n}\n```\n\n### Listing\
    \ 5. Partial Test for Valid Local Part Content\n\n```php\nif (!preg_match('/^([\\\
    \\\\\\.\\\\[A-Za-z0-9!#$%&'*+/=?^`{|}~_-]*)$/s',\n        str_replace('\\\\\\\\\
    ', '', $local)))\n{\n    // character not valid in local part unless\n    // local\
    \ part is quoted\n    if (preg_match('/^\\\\\\\\'\"'\"\"]*\\\\\\\\'\"'\"']*$/',\n\
    \        str_replace('\\\\\\\\', '', $local)))\n    {\n        $isValid = false;\n\
    \    }\n}\n```\n\n### Listing 6. Check for dot placement in the local part.\n\n\
    ```php\nif ($local[0] == '.' || $local[strlen($local)-1] == '.')\n{\n    // local\
    \ part starts or ends with '.'\n    $isValid = false;\n}\nelse if (preg_match('/\\\
    .\\./', $local))\n{\n    // local part has two consecutive dots\n    $isValid\
    \ = false;\n}\n```\n\n### Listing 7. Domain Checks\n\n```php\nif (!preg_match('/^[A-Za-z0-9\\\
    \\\\\\-.]*$/', $domain))\n{\n    // character not valid in domain part\n    $isValid\
    \ = false;\n}\nelse if (preg_match('/\\\\\\\\.\\\\\\\\./', $domain))\n{\n    //\
    \ domain part has two consecutive dots\n    $isValid = false;\n}\nelse if (!(checkdnsrr($domain,\
    \ \"MX\") || checkdnsrr($domain, \"A\")))\n{\n    // domain not found in DNS\n\
    \    $isValid = false;\n}\n```\n\n### Listing 8. Test the e-mail validation function.\n\
    \n```php\n<?php\nrequire(\"validateMail.php\"); // your favorite here\n\nfunction\
    \ testEmail($email)\n{\n    echo $email;\n    $pass = validateMail($email);\n\
    \    if ($pass) {\n        echo \" is valid.\\n\";\n    } else {\n        echo\
    \ \" is not valid.\\n\";\n    }\n    return $pass;\n}\n\n$pass = true;\necho \"\
    All of these should succeed:\\n\";\n$pass &= testEmail(\"dcloiou.1bm.com\");\n\
    $pass &= testEmail(\"abc\\@Wdef@example.com\");\n$pass &= testEmail(\"abc\\\\\\\
    @example.com\");\n$pass &= testEmail(\"Fred B\\Blogs@example.com\");\n$pass &=\
    \ testEmail(\"Joe.\\B10w@example.com\");\n$pass &= testEmail(\"^\"AbcWdef\"@example.com\"\
    );\n$pass &= testEmail(\"\\\"Fred Blogs\"@example.com\");\n$pass &= testEmail(\"\
    customer/department=shipping@example.com\");\n$pass &= testEmail(\"$A123456@example.com\"\
    );\n$pass &= testEmail(\"!def!xyz$abc@example.com\");\n\n$pass &= testEmail(\"\
    .someename@example.com\");\n$pass &= testEmail(\"user+mailbox@example.com\");\n\
    $pass &= testEmail(\"peter.piper@example.com\");\n$pass &= testEmail(\"\"Doug\\\
    \" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"L\"@example.com\");\n$pass &= testEmail(\"\"\
    Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\necho \"\\nAll of these\
    \ should fail:\\n\";\n$pass &= !testEmail(\"abc\\@Wdef@example.com\");\n$pass\
    \ &= !testEmail(\"abc\\\\@Wdef@example.com\");\n$pass &= !testEmail(\"abc\\\\\
    @example.com\");\n$pass &= !testEmail(\"@example.com\");\n$pass &= !testEmail(\"\
    doug@\"));\n$pass &= !testEmail(\"\"\"\"@example.com\"));\n$pass &= !testEmail(\"\
    o@o\\@example.com\"));\n$pass &= !testEmail(\".dot@example.com\");\n$pass &= !testEmail(\"\
    dot_.dot@example.com\");\n$pass &= !testEmail(\"two..dot@example.com\");\n$pass\
    \ &= !testEmail(\"\"\"Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\n\
    $pass &= !testEmail(\"\"\"Doug\"\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\"\
    );\n$pass &= !testEmail(\"hello world@example.com\");\n$pass &= !testEmail(\"\
    gatsby@f.s.c.ot.f.i.tz.g.m.r.1.d.\");\necho \"\\nThe email validation \";\nif\
    \ ($pass) {\n    echo \"passes all tests.\\n\";\n} else {\n    echo \"is deficient.\\\
    n\";\n}\n?>\n```\n\nNow, the local part has one of two forms. It may have a begin\
    \ and end quote with no unescaped embedded quotes. The local part, Doug \\\"Ace\\\
    \" L. is an example. The second form for the local part, (+.+), where + stands\
    \ for a whole slew of allowable characters. The second form is more common than\
    \ the first; so, check for that first. Look for the quoted form after failing\
    \ the unquoted form.\n\nCharacters quoting using the back slash (\\) pose a problem.\
    \ This form allows doubling the back-slash character to get a back-slash character\
    \ in the interpreted result (\\). This means we need to check for an odd number\
    \ of back-slash characters quoting a non-back-slash character. We need to allow\
    \ \\\\\\\\ and reject \\\\\\\\\\\\.\n\nIt is possible to write a regular expression\
    \ that finds an odd number of backslashes before a non-backslash character. It\
    \ is possible, but not pretty. The appeal is further reduced by the fact that\
    \ the backslash character is an escape character in PHP strings and an escape\
    \ character in regular expressions. We need to write four back-slash characters\
    \ in the PHP string representing the regular expression to show the regular expression\
    \ interpreter a single back slash. A more appealing solution is simply to strip\
    \ all pairs of back-slash characters from the test string before checking it with\
    \ the regular expression. The str_replace function fits the bill. Listing 5 shows\
    \ a test for the content of the local part.\n\nThe regular expression in the outer\
    \ test looks for a sequence of allowable or escaped characters. Failing that,\
    \ the inner test looks for a sequence of escaped quote characters or any other\
    \ character within a pair of quotes.\n\nIf you are validating an e-mail address\
    \ entered as POST data, which is likely, you have to be careful about input that\
    \ contains back-slash (\\), single-quote (') or double-quote (\"\") (\\). PHP\
    \ may or may not escape those characters with an extra back-slash character wherever\
    \ they occur in POST data. The name for this behavior is magic_quotes_gpc, where\
    \ gpc stands for get, post, cookie. You can stop the magic code via the function,\
    \ get_magic_quotes_gpc(), and strip the added slashes on an affirmative response.\
    \ You also can ensure that the PHP.ini file disables this 'feature'. Two other\
    \ settings to watch for are magic_quotes_runtime and magic_quotes_sybase.\n\n\
    The two regular expressions in Listing 5 are appealing because they are relatively\
    \ easy to comprehend and don't require repetition of the allowable character group\
    \ ([A-Za-z0-9!#$%&'*+\\-/=?^_`{|}~-.]). Here's a test for you. Why does the character\
    \ group require two back-slash characters before the forward slash and one back-slash\
    \ character before the single quote?\n\nOne deficiency of the outer test of Listing\
    \ 5 is that it passes local part strings that include dots anywhere in the string.\
    \ Requirement number two states that dots can't start or end the local part, and\
    \ they can't appear together two or more times. We could address this by expanding\
    \ the outer regular expression into form (+a+), where a is [(\\\\[A-Za-z0-9!#$%&'*+\\\
    -/=?^_`{|}~-.])\\. We could, but that leads to a long, hard-to-read, repetitive\
    \ expression that's difficult to believe in. It's clearer to add the simple checks\
    \ shown in Listing 6.\n"
  mdcn: "\n要求四涵盖了一种现已过时的格式，该格式可以被认为是宽松的。发出新地址的代理可以合法地禁止使用这种格式；但是，使用此格式的现有地址仍然是有效的地址。\n\
    \n该标准假设使用七位字符编码，而不是多字节字符。因此，根据 RFC 2234，“字母”对应拉丁字母字符范围 a–z 和 A–Z。同样，“数字”指数字 0–9。华丽的国际标准\
    \ Unicode 字母表并未被兼容——甚至没有以 UTF-8 编码。在这里，ASCII 仍然占主导地位。\n\n## 开发更好的电子邮件验证器\n\n这有很多要求！其中大多数都涉及本地部分和域名。因此，从围绕“@”符号分隔符拆分电子邮件地址开始是有道理的。要求\
    \ 2–5 适用于本地部分，而 6–10 适用于域名。\n\n在本地名称中，可以转义“@”符号。例如，Abc\\@def@example.com 和 \"\
    Abc@def\"@example.com。这意味着对“@”符号进行拆分，`$split = explode(\"@\", $email);` 或其他类似的分离本地部分和域名部分的方法并不总是有效的。我们可以尝试移除转义的“@”符号，`$cleanat\
    \ = str_replace(\"\\@\", \"\", $email);` 但这会遗漏一些病态案例，例如 Abc\\\\@example.com。幸运的是，在域名部分不允许使用转义的“@”符号。最后一次出现的“@”符号肯定就是分隔符。因此，分离本地部分和域名部分的方法是，使用\
    \ strrpos 函数查找电子邮件字符串中最后一个“@”符号。\n\n列表 3 提供了一种更好的方法来拆分电子邮件地址的本地部分和域名。如果电子邮件字符串中没有“@”符号，strrpos\
    \ 的返回类型将是布尔值 false。让我们先进行简单的测试。检查本地部分和域名的长度很简单。如果这些测试失败，就没有必要进行更复杂的测试了。列表 4 展示了进行长度测试的代码。\n\
    \n### 列表 3. 拆分本地部分和域名\n\n```php\n$isValid = true;\n$atIndex = strrpos($email,\
    \ \"@\");\nif (!is_bool($atIndex) && !$atIndex)\n{\n    $isValid = false;\n}\n\
    else\n{\n    $domain = substr($email, $atIndex+1);\n    $local  = substr($email,\
    \ 0, $atIndex);\n    // ... 处理域名和本地部分\n}\n```\n\n### 列表 4. 本地部分和域名的长度测试\n\n```php\n\
    $localLen = strlen($local);\n$domainLen = strlen($domain);\nif ($localLen < 1\
    \ || $localLen > 64)\n{\n    // 本地部分长度超出限制\n    $isValid = false;\n}\nelse if\
    \ ($domainLen < 1 || $domainLen > 255)\n{\n    // 域名部分长度超出限制\n    $isValid = false;\n\
    }\n```\n\n### 列表 5. 本地部分内容的部分测试\n\n```php\nif (!preg_match('/^([\\\\\\\\.\\\\\
    [A-Za-z0-9!#$%&'*+/=?^`{|}~_-]*)$/s',\n        str_replace('\\\\\\\\', '', $local)))\n\
    {\n    // 本地部分中字符无效，除非\n    // 本地部分被引用\n    if (preg_match('/^\\\\\\\\'\"'\"\"\
    ]*\\\\\\\\'\"'\"']*$/',\n        str_replace('\\\\\\\\', '', $local)))\n    {\n\
    \        $isValid = false;\n    }\n}\n```\n\n### 列表 6. 检查本地部分中点的位置。\n\n```php\n\
    if ($local[0] == '.' || $local[strlen($local)-1] == '.')\n{\n    // 本地部分以 '.'\
    \ 开头或结尾\n    $isValid = false;\n}\nelse if (preg_match('/\\.\\./', $local))\n\
    {\n    // 本地部分包含两个连续的点\n    $isValid = false;\n}\n```\n\n### 列表 7. 域名检查\n\n```php\n\
    if (!preg_match('/^[A-Za-z0-9\\\\\\\\-.]*$/', $domain))\n{\n    // 域名部分中字符无效\n\
    \    $isValid = false;\n}\nelse if (preg_match('/\\\\\\\\.\\\\\\\\./', $domain))\n\
    {\n    // 域名部分包含两个连续的点\n    $isValid = false;\n}\nelse if (!(checkdnsrr($domain,\
    \ \"MX\") || checkdnsrr($domain, \"A\")))\n{\n    // 在 DNS 中未找到域名\n    $isValid\
    \ = false;\n}\n```\n\n### 列表 8. 测试电子邮件验证函数。\n\n```php\n<?php\nrequire(\"validateMail.php\"\
    ); // 你喜欢的任何文件\n\nfunction testEmail($email)\n{\n    echo $email;\n    $pass =\
    \ validateMail($email);\n    if ($pass) {\n        echo \" 是有效的。\\n\";\n    }\
    \ else {\n        echo \" 是无效的。\\n\";\n    }\n    return $pass;\n}\n\n$pass =\
    \ true;\necho \"所有这些都应成功：\\n\";\n$pass &= testEmail(\"dcloiou.1bm.com\");\n$pass\
    \ &= testEmail(\"abc\\@Wdef@example.com\");\n$pass &= testEmail(\"abc\\\\\\@example.com\"\
    );\n$pass &= testEmail(\"Fred B\\Blogs@example.com\");\n$pass &= testEmail(\"\
    Joe.\\B10w@example.com\");\n$pass &= testEmail(\"^\"AbcWdef\"@example.com\");\n\
    $pass &= testEmail(\"\\\"Fred Blogs\"@example.com\");\n$pass &= testEmail(\"customer/department=shipping@example.com\"\
    );\n$pass &= testEmail(\"$A123456@example.com\");\n$pass &= testEmail(\"!def!xyz$abc@example.com\"\
    );\n\n$pass &= testEmail(\".someename@example.com\");\n$pass &= testEmail(\"user+mailbox@example.com\"\
    );\n$pass &= testEmail(\"peter.piper@example.com\");\n$pass &= testEmail(\"\"\
    Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"L\"@example.com\");\n$pass &= testEmail(\"\
    \"Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\necho \"\\n所有这些都应失败：\\\
    n\";\n$pass &= !testEmail(\"abc\\@Wdef@example.com\");\n$pass &= !testEmail(\"\
    abc\\\\@Wdef@example.com\");\n$pass &= !testEmail(\"abc\\\\@example.com\");\n\
    $pass &= !testEmail(\"@example.com\");\n$pass &= !testEmail(\"doug@\"));\n$pass\
    \ &= !testEmail(\"\"\"\"@example.com\"));\n$pass &= !testEmail(\"o@o\\@example.com\"\
    ));\n$pass &= !testEmail(\".dot@example.com\");\n$pass &= !testEmail(\"dot_.dot@example.com\"\
    );\n$pass &= !testEmail(\"two..dot@example.com\");\n$pass &= !testEmail(\"\"\"\
    Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\n$pass &= !testEmail(\"\
    \"\"Doug\"\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\n$pass &= !testEmail(\"\
    hello world@example.com\");\n$pass &= !testEmail(\"gatsby@f.s.c.ot.f.i.tz.g.m.r.1.d.\"\
    );\necho \"\\n电子邮件验证 \";\nif ($pass) {\n    echo \"通过了所有测试。\\n\";\n} else {\n\
    \    echo \"存在缺陷。\\n\";\n}\n?>\n```\n\n现在，本地部分有两种形式之一。它可以有开始和结束引号，且没有未转义的嵌入引号。本地部分，Doug\
    \ \\\"Ace\\\" L. 就是一个例子。本地部分的第二种形式是 (+.+)，其中 + 代表一系列允许的字符。第二种形式比第一种更常见；因此，先检查它。在未引用的形式测试失败后，再查找被引用的形式。\n\
    \n使用反斜杠 (\\) 进行引号引用会引发一个问题。此格式允许加倍反斜杠字符以在解析结果中获得一个反斜杠字符 (\\)。这意味着我们需要检查非反斜杠字符前的反斜杠字符数量是否为奇数。我们需要允许\
    \ \\\\\\\\ 并拒绝 \\\\\\\\\\\\.\n\n可以编写一个正则表达式来查找非反斜杠字符前的奇数个反斜杠。这是可能的，但不太美观。由于反斜杠字符在\
    \ PHP 字符串中是转义字符，在正则表达式中也是转义字符，因此其吸引力进一步降低。我们需要在表示正则表达式的 PHP 字符串中写入四个反斜杠字符，才能让正则表达式解释器看到一个反斜杠。一个更具吸引力的解决方案是，在使用正则表达式检查之前，简单地从测试字符串中去除所有的反斜杠字符对。str_replace\
    \ 函数正符合这一需求。列表 5 展示了本地部分内容测试。\n\n外层测试中的正则表达式查找一系列允许或转义的字符。如果失败，内层测试则查找转义的引号字符序列，或一对引号内的其他任何字符。\n\
    \n如果你正在验证作为 POST 数据输入的电子邮件地址（这是很可能的），你必须小心包含反斜杠 (\\)、单引号 (') 或双引号 (\"\") (\\)\
    \ 的输入。PHP 可能会也可能不会在 POST 数据中出现这些字符的地方用额外的反斜杠字符进行转义。这种行为的名称是 magic_quotes_gpc，其中\
    \ gpc 代表 get, post, cookie。你可以通过函数 get_magic_quotes_gpc() 停止这种“魔法”代码，并在肯定响应时去除添加的反斜杠。你还可以确保\
    \ PHP.ini 文件禁用了这个“功能”。另外两个需要注意的设置是 magic_quotes_runtime 和 magic_quotes_sybase。\n\
    \n列表 5 中的两个正则表达式之所以吸引人，是因为它们相对容易理解，并且不需要重复允许的字符组 ([A-Za-z0-9!#$%&'*+\\-/=?^_`{|}~-.])。这里有一个测试题给你。为什么字符组在正斜杠前需要两个反斜杠字符，而在单引号前需要一个反斜杠字符？\n\
    \n列表 5 中外部测试的一个缺陷是，它会让包含字符串中任何位置有点的本地部分字符串通过。要求二指出，点不能位于本地部分的开头或结尾，也不能连续出现两次或更多次。我们可以通过将外部正则表达式扩展为\
    \ (+a+) 形式来解决这个问题，其中 a 是 [(\\\\[A-Za-z0-9!#$%&'*+\\-/=?^_`{|}~-.])\\. 我们可以这样做，但这会导致一个冗长、难以阅读、重复且难以相信的表达式。添加列表\
    \ 6 中显示的简单检查会更清晰。\n\n"
