    # 探索 Lua


    对小巧而功能强大的 Lua 编程语言进行概览。**约瑟夫·奎格利**


    **Lua 是一款免费**且开源的多范式编程语言，遵循 MIT 许可证发布。它由 Roberto Ierusalimschy、Luiz Henrique de
    Figueiredo 和 Waldemar Celes 于 1993 年创建。Lua 是一种动态类型语言。它极其紧凑（编译后仅 150KB），主要用作脚本语言或作为另一种语言（主要是
    *C/C++*）的扩展。


    ## Lua 是什么？它是如何被使用的？


    Lua 以库的形式实现，没有“主”程序。它仅在嵌入到宿主客户端中时才起作用。解释器是一个 C 程序，它使用 Lua 库来提供独立的 Lua 解释器。Lua
    的目标不是为单一范式提供复杂且僵化的规范，而是旨在扩展以适应不同的问题类型。


    由于体积小，Lua 适用于许多宿主平台，并且已在 PlayStation Portable 和 Nintendo DS 等视频游戏以及《*Far Cry*》和《*World
    of Warcraft*》等大型游戏中进行移植和使用。Adobe Photoshop Lightroom 摄影程序和 lighttpd Web 服务器也集成了
    Lua。Lua 具有一些高级特性，主要是协程、垃圾回收、一级函数和动态模块加载。由于 Lua 体积小，它只包含少量数据类型。它试图在功能强大与体积小巧之间保持平衡。


    ## Lua 有何不同？


    在学习编写代码方面，Lua 与 Python 同样易于上手。两者之间，Lua 通常更适合嵌入式系统，原因仅仅是它的体积更小。Lua 的优势在于处理字符串和表。它比
    Python 更擅长处理逻辑等式。对于快速修补，Lua 程序员比 Python 程序员能更快、更轻松地处理复杂数据（尽管 Ruby 程序员也能以几乎相同的速度做到）。但是，对于处理许多复杂数据块的大型应用程序，Ruby
    或 Python 等较重的语言可能是更好的选择。


    你无需担心不同类型的整数。你可能发现，不同类型的整数和数字（如浮点数、长整数或双精度数）如果你心不在焉，可能会搞乱你程序的输出甚至导致其崩溃。Lua 使用强制类型转换将每种整数和数字类型转换为单一类型。在
    Lua 中，你可以将浮点数、长整数或双精度数毫无障碍地加到其他类型的整数或数字上。相比之下，这样做可能会导致 Python 2.4 或更早版本编写的程序崩溃。Lua
    在语法上极其宽容。如果由于某种原因，你正在一个拥有四英寸宽屏幕的嵌入式设备上编程呢？你可以减少行数和其他字符的数量，这反过来使代码易于阅读，以弥补小屏幕的不足。


    小即是美。程序员可以将 Lua 嵌入到 *C/C++* 和 Java 等多种其他语言中，而不会使宿主语言膨胀，因为 Lua 的 API 非常小巧。与 Lisp
    的单一数据结构类似，表是 Lua 拥有的唯一数据组织机制。这使得表非常强大，因为只需少量工作，它们就可以模拟更大语言中的数据结构和列表。


    面向对象的编程实现极简主义。Lua 使用表和函数而非类。


    与 Python 不同，Lua 不注重 100% 的向后兼容性。许多较新版本的 Lua 会破坏在之前版本中编写的程序。幸运的是，Lua 开发人员总是宣布新版本的
    Lua 会破坏哪些内容。


    Lua 支持线程。多个 Lua 解释器可以在同一进程中共存，并且每个解释器可以在自己的线程中独立运行。这通常使 Lua 成为嵌入式系统中多线程程序的理想选择。


    ## 安装 Lua


    要从源代码编译和安装 Lua，请从 Lua.org 网站获取 Lua 5.1 的副本，然后解压、配置、制作并安装：


    ```bash

    tar -xvzf lua-5.1.1.tar.gz

    cd lua-5.1.1

    make

    make install

    ```


    (xyz 是你的平台名称。)


    此时，Lua 应该已经安装并可以正常工作。要测试你的安装，请在命令行输入 Lua。应出现一个交互式解释器。


    ## 语法


    Lua 是一种动态类型语言，其语法与 Python 非常相似，与 Ruby 更为相似。换行符在 Lua 的语法中不起作用，就像在 Python 或 Ruby
    中那样。例如，以下代码虽然丑陋，但有效：


    ```lua

    foo = 89

    bar = foo + 2

    print(bar)

    ```


    由于体积小，Lua 只有八种基本数据类型：


    - nil（类似于 Python 的 None）

    - 布尔值

    - 数字

    - 字符串

    - 函数

    - userdata（一种允许在 Lua 变量中存储任意 C 数据的类型）

    - 线程

    - 表


    Lua 仅支持少数几种数据结构，包括数组、列表和哈希表。


    表类型实现了一个关联数组，可以用任何值（类似于 Python）进行索引，但 nil 除外（类似于 Python）。Nil 的目标是与任何其他值不同，同时也是全局变量的默认值。与
    Python 中的 None 相比，Nil 在 Lua 中扮演着重要得多的角色。虽然表是 Lua 中唯一的数据组织机制（这看似是一个缺点），但表与 Python
    的字典和列表一样强大，甚至与 Ruby 的哈希一样强大。表被用于表示许多不同类型的数组、集合、树和其他几种数据结构。表的一个实用功能是使用字符串作为键——例如：


    ```lua

    x = { [''hello world!''] = "ciao world!" }

    print(x["hello world!"])

    ```


    运行此示例时，Lua 输出 "ciao world!" 而不是看似输出的 "hello world!"。


    若要更深入地了解 Lua 的表，请前往 lua-users.org/wiki/TablesTutorial。


    ### 变量和标识符


    由于任何值都可以表示一个条件，Lua 中的布尔值与许多其他语言中的不同。在 Lua 中，false 和 nil 都被视为假，但 Lua 将其他所有内容都视为真（包括零和空字符串）。


    与 Python 不同，全局变量不需要声明。要创建一个全局变量，只需给它赋值。要删除它，将其赋值为 nil。只有当全局变量具有非 nil 值时，它才存在。与
    Python 恰恰相反，Lua 中的大多数变量默认为全局变量，你必须将变量声明为 "local" 才能使其成为局部变量，而不是假设所有变量都是局部的。


    由于大多数 CPU 执行浮点算术的速度与整数算术一样快，Lua 中的数字表示双精度浮点数，而不是常见的整数。由于 Lua 不需要整数类型，因此它没有整数类型。这消除了舍入误差、浮点数和长整数。


    Lua 非常擅长处理字符串，已被用于处理长达数兆字节的字符串。它在字符串和数字之间进行转换；对字符串应用的任何数字操作都会将字符串转换为数字。这种转换原则仅适用于数字，因为
    Lua 在期望字符串时会将数字转换为字符串。即使有自动转换，Lua 仍然可以在某些情况下区分数字和字符串，例如 90 == "90"（始终为假）。


    不建议在 Lua 中使用以下划线开头的标识符（例如 _FOO），因为许多是保留用于特殊用途的。只要标识符不以数字开头，标识符可以由下划线、字母和数字的组合组成。


    你基本上可以重命名 Lua 中的任何东西，甚至可以使其不可调用。例如，以下代码：


    ```lua

    x = io

    x.read()

    io = "Hello world!"

    ```


    ```lua

    x = "Let''s make io callable!"

    x.read()

    ```


    第二行通过 io 模块获取键盘输入。由于 io 本质上是一个以函数为值的变量，你可以给它不同的值，使其不再与输入/输出函数相关。当你再次尝试从 io 模块获取键盘输入时，Lua
    会返回错误。由于 io 的值已被重新赋值，程序现在无法调用输入/输出函数。为了再次使用 io，你必须重新启动 Lua 程序。


    ### 运算符和赋值


    Lua 使用 `..` 运算符连接字符串。请注意，`print("Hello".."World!")` 是有效的，但 `print("I''ve said
    "Hello World"...5..."or more times.")` 无效。这是因为 Lua 将整数后的点视为小数点。否则，它不会返回错误。以下代码有效地连接了字符串和整数：


    ```lua

    print("I''ve said "Hello World" ... 5 ... "or more times.")

    ```


    Lua 使用 Python、Ruby 和大多数其他语言使用的许多常见运算符。对于 Python/Ruby 的逻辑非运算符，Lua 可以使用它，也可以使用 `==`
    进行等式取反。始终


