    \ in the US, as there are only three silos here. But, the customers have no rights.\
    \ With locked SIM chips, you can't get any unlocking code. Until last year, there\
    \ was no number portability. Just in the last five years, Japan cell phones could\
    \ be used overseas without the blessing of the carrier. Interactive programs with\
    \ the end user aren't possible. One additional comment, the only reason IC-enabled\
    \ cell phones exist is because the train system started using IC-enabled train\
    \ passes--JR being the majority of railways and majority of the population rides\
    \ those trains every day.\n\n> *-- Robert Balfour*\n\n### Cell-Phone Silos\n\n\
    Doc, you didn't mention the worst cell-phone silo of them all [*LJ*, April 2007,\
    \ \"Why an iPhone When We Can Make Our Own OpenPhone?\"]: the crippling system\
    \ that makes it impossible for cell phones to communicate directly with each other.\
    \ Whatever happens in software development for mobile phones, this silo will stand\
    \ as an insurmountable obstacle to progress until the network model changes from\
    \ the current client/server system to an unrestricted, peer-to-peer, ad hoc model.\n\
    \nThis transformation is certainly disruptive technology. As such, it will probably\
    \ follow the usual disruptive technology development path. It will be ignored,\
    \ ridiculed, lobbied against and actively resisted by the existing technology\
    \ providers, until it makes them irrelevant and takes over the world.\n\nWhat\
    \ if this technology had been in use when Katrina hit New Orleans? There would\
    \ have been no communications problems into any area where there was at least\
    \ one phone within range of another, as in any, including the height of the storm.\
    \ Rescuers would not have had to wait for days or weeks for destroyed infrastructure\
    \ to be replaced just for basic communications.\n\nInstead, there were thousands\
    \ of working cell phones in the disaster area, all rendered completely useless\
    \ by the silo owners' communication restrictions.\n\nThe future of wireless is\
    \ already written large in the form of the Internet. A self-organizing, self-healing\
    \ worldwide network is an unstoppable force. The next obvious step is to remove\
    \ the wires, and in keeping with the best Free Software traditions, this can be\
    \ accomplished from the bottom up, simply by doing it.\n\n> *-- Carl Brown*\n\n\
    ### Banning Novell or Buying SCO?\n\nA few issues ago [March 2007, *Variations*],\
    \ Nicholas Petley called for a ban on Novell after it signed an agreement with\
    \ Microsoft. Today, I read on Slashdot that Novell asserts to \"Windows Is Cheaper\
    \ Than Linux\" ([news.zdnet.co.uk/software/0,1000000121,39286295,00.html](https://news.zdnet.co.uk/software/0,1000000121,39286295,00.html)).\n\
    \nMy advice to Novell: buy SCO. They both seem to be on the same path.\n\n> *--\
    \ Paul Ammann*\n\n### News about Dell's Article\n\nAs a frequent reader of *LJ*,\
    \ I must tell you about good news from Dell. For sure, in consequence of the article\
    \ \"A Modest GNU/Linux Proposal for Michael Dell\" (from\n"
