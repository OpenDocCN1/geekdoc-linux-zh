    \ multi-paradigm programming language released under the MIT license. Created\
    \ in 1993 by Roberto Ierusalimschy, Luiz Henrique de Figueiredo and Waldemar Celes,\
    \ Lua is a dynamically typed language. Extremely compact (only 150KB compiled),\
    \ it is primarily used as a scripting language or an extension to another language\
    \ (mainly *C/C++* ).\n\n# ## What Is Lua and How Is It Used?\n\nLua is implemented\
    \ as a library and has no “main” program. It works only when embedded in a host\
    \ client. The interpreter is a C program that uses the Lua library to offer a\
    \ standalone Lua interpreter. Rather than provide a complex and rigid specification\
    \ for a single paradigm, Lua is intended to be extended to fit different problem\
    \ types.\n\nBeing small, Lua fits on many host platforms and has been ported and\
    \ used in video games for both the PlayStation Portable and the Nintendo DS, and\
    \ it is used in larger games, such as *Far Cry* and *World of Warcraft*. The Adobe\
    \ Photoshop Lightroom photography program and the lighttpd Web server have incorporated\
    \ Lua as well. Lua has a few advanced features, primarily coroutines, garbage\
    \ collection, first-class functions and dynamic module loading. Because Lua is\
    \ small, it includes only a few data types. It attempts to maintain a balance\
    \ between power and small size.\n\n# ## What’s Different about Lua?\n\nLua is\
    \ comparably as easy as Python in terms of learning how to write code. Of the\
    \ two, Lua is usually the better choice for embedded systems, simply because it’s\
    \ smaller. Lua’s strength is in processing strings and tables. It handles logical\
    \ equations more adeptly than Python. For a quick hack, a Lua programmer can process\
    \ complicated data more quickly and easily than a Python programmer can (although\
    \ a Ruby programmer can do so almost as quickly). But, for a large application\
    \ that handles many chunks of complex data, a heavier language such as Ruby or\
    \ Python may be a better choice.\n\nThere is no need to worry about different\
    \ types of integers. You may have found that the different types of integers and\
    \ numbers (such as floats, longs or doubles) can screw up the output of your program\
    \ or even make it crash if you are absent-minded. Lua uses coercion for every\
    \ integer and number type to convert it into a single type. You can add a float,\
    \ long integer or a double to any other type of integer or number without a hitch\
    \ in Lua. In contrast, doing this can cause programs written in Python 2.4 or\
    \ older versions to crash. Lua is extremely forgiving syntactically. What if,\
    \ for some reason, you are programming on an embedded device with a four-inch\
    \ wide screen? You can reduce the amount of lines and other characters, which\
    \ in turn enables easy reading of the code to make up for the small screen.\n\n\
    Small is beautiful. A programmer can embed Lua into several other languages, such\
    \ as *C/C++* and Java, without bloating the host language, because Lua has a tiny\
    \ API. Similar to Lisp’s single data structure, tables are the only data structuring\
    \ mechanism that Lua has. This makes tables very powerful, because with a little\
    \ work, they can emulate data structures in larger languages.\n\nObject-oriented\
    \ programming implementation is minimalistic. Lua uses tables and functions rather\
    \ than classes.\n\nIn contrast to Python, Lua does not focus on 100% backward\
    \ compatibility. Many newer releases of Lua break programs written in previous\
    \ versions. Fortunately, the Lua developers always announce what the new versions\
    \ of Lua will break.\n\nLua supports threading. Multiple Lua interpreters can\
    \ coexist in the same process, and each one can run independently in its own thread.\
    \ This often makes Lua desirable for multithreaded programs in embedded systems.\n\
    \n# ## Installing Lua\n\nTo compile and install Lua from the source code, grab\
    \ a copy of Lua 5.1 from the Lua.org Web site, and untar, configure, make and\
    \ install it:\n\n```\n```\n tar -xvzf lua-5.1.1.tar.gz\n cd lua-5.1.1\n make xyz\n\
    \ make xyz install\n```\n\n```\n\n(xyz is your platform name.)\n\nLua should now\
    \ be installed and working. To test your install, type Lua on the command line.\
    \ An interactive interpreter should appear.\n\n# ## Syntax\n\nLua is a dynamically\
    \ typed language whose syntax is very similar to that of Python and even more\
    \ similar to Ruby. Line breaks do not play any role in Lua’s syntax, like that\
    \ of Python or Ruby. Take, for example, the following ugly, but valid code:\n\n\
    ```\n```\nfoo = 89\nbar = foo+2\nprint(bar)\n```\n\n```\n\nBecause it is small,\
    \ Lua has only eight basic data types:\n\n+   1. nil (similar to Python’s None)\n\
    2. booleans\n3. numbers\n4. strings\n5. functions\n6. userdata (a type that allows\
    \ arbitrary C data to be stored in Lua variables)\n7. threads\n8. tables\n\n\n\
    Lua supports only a few data structures, including arrays, lists and hash tables.\n\
    \nThe table type implements an associative array that can be indexed with any\
    \ value (similar to Python), except nil (similar to Python). Nil’s goal is to\
    \ be different from any other value, as well as the default value for global variables.\
    \ Nil also plays a much more important role in"
