    During this same period, I switched from being an Electrical Engineer to a major
    that was both engineering and business, with a minor in what became Computer Science.
    I studied several different languages: Aigol, Lisp, PL/I, SNOBOL and APL, each
    one with its own special niche in the computer field.


    I remember SNOBOL as a language for string processing, and although I do not remember
    much of it, I do remember thinking that almost any string of characters input
    into a SNOBOL compiler would generate some type of syntactically correct program.
    I remember thinking that the only syntax error that might be generated was the
    lack of the END statement.


    APL, on the other hand, was an array programming language that was very powerful.
    It even fostered its own special set of symbols that meant you had to paint them
    on the side of the keys of your regular keyboard, and (in the case of an IBM Selectric
    typewriter) use a print head specifically made for APL.


    In a class on comparative language design, our professor gave us a challenge of
    re-implementing a 40-line FORTRAN program in as few lines of APL as possible.
    Most of us reduced the FORTRAN program to three lines of APL, some to two lines
    of APL. And, one of the brightest students in the class (David Erb) had stayed
    up the entire night reducing the program to only one line of APL. It was a truly
    amazing line of code.


    After inputting the data to the program and seeing the correct result, the professor
    (with a gleam in his eye) asked David to explain how the program worked. David,
    having finished the program only hours before, tried desperately to remember how
    it actually worked, but he could not explain how he had come to that particular
    single line, or even how it would produce the desired result.


    As a class, we had experienced our first “write-only” language. It was a lesson
    remembered over the next 38 years—never write a program you could not easily change
    or re-use.


    It was an interesting time in the days before Computer Science degrees. It was
