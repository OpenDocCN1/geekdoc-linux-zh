    ### OpenSTV


    你是否曾感到想要支持“企鹅党”来追随自己的良心投票，而不是在两个“共和党”或“民主共和党”的邪恶中选择较小的那个？为了解决这一困境，替代性（且符合宪法并日益流行）的投票方法，如单一可转移投票制（STV）和即时决选投票制应运而生，允许选民在选举中对候选人进行排名。如果你的“企鹅党”候选人根本没有胜算，你的投票将转计给你排名较低且有望获胜的候选人。梳理这些投票偏好是
    OpenSTV 的工作，目前版本为 1.1，这是一个根据各自投票规则计算票数的开源应用程序。数据通常来自纸质选票，并输入到 OpenSTV 中。首席开发人员表示，“部分投票规则已通过数百场选举的结果与其他软件进行对比，进行了广泛验证”。OpenSTV
