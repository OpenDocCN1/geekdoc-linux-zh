    \ 3 to find more things your SCGI applications can do.\n\n# Even with just a single\
    \ server, you can use SCGI to contain vulnerabilities.\n\n# Porting Applications\n\
    \nOnce you’re comfortable writing programs using SCGI, you may want to try adapting\
