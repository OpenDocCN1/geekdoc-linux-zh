    ## GPL Java 是否太晚、太少？


    Java 正在成为主要以 GPL 许可发布的语言，但这是否为时已晚？


    ![](img/526fd434dcfcf1b461b94c24ea170f36_97_0.png)


    **尼克·佩特雷利**，主编


    很抱歉一开始就剧透了，但答案是：“不，一点也不晚。” 我当然更希望 Sun 在微软发布 .NET 之前就采用 GPL 许可 Java。我认为如果那样做，.NET
    可能完全起不到作用。但请允许我展示证据，说明 Java 在 Linux 上已经狠狠击败了 .NET。


    看看 Java 在享受 GPL 带来的好处之前，已经变得多么普及。SourceForge 是 Linux 上最受欢迎（如果说是最流行之一）的软件项目仓库（软件也适用于其他操作系统，包括
    Windows，但 SourceForge 主要是 Linux 仓库）。Java 在 SourceForge 上长期占据着非常显眼的位置，远早于 Sun 宣布将
    Java 的大部分代码 GPL 化。截至本文撰写时，SourceForge 列出了 5,421 个用 Java 编写的项目。Java 项目的数量甚至超过了
    C++ 项目的数量，后者为 4,582 个。仅有 284 个项目列为 C#，而 BASIC 项目仅有 34 个。我想大家都不会惊讶于 C 语言项目数量最多，达到
    8,558 个。这就是 .NET 带来了而 Java 所缺乏的东西。.NET API 具有更丰富的功能，因为它不是旨在成为一个“一次编写，随处运行”（Write-Once-Run-Anywhere，简称
    WORA）的平台。Java 的目标是 WORA，因此它缺少一些相当基础的功能，例如对 USB 或 FireWire 的良好支持。这是因为对硬件的直接支持违反了
    WORA 原则。你必须编写利用 Java 本地接口（JNI）的硬件和/或特定平台的 Java 扩展库来支持这些功能。


    这是件坏事吗？Java 必须忠于 WORA 才能成为 Java 吗？从某种意义上说，答案是肯定的。核心 JVM 应该忠于 WORA。但这并不意味着你不能扩展
    Java 以适应特定平台。事实上，我希望随着社区未来更多地参与 Java 的发展，除了 WORA JVM 之外，编译后的 Java 会变得更好。我确信社区的努力只会带来好处。


    我预计一旦 Sun 完成 Java 的 GPL 化，针对项目的硬件特定扩展将会蓬勃发展。Java 可以保持 WORA 平台的状态，供希望这样使用的人使用，而社区也可以提供你所需的工具，让
    Java 也能作为强大的平台特定语言使用。如果插件违反了 WORA 原则又怎样？它是一种语言，而不是一种宗教。相比之下，Mono 团队则坚决通过追赶 Windows
    API 部分来提供非 WORA 功能。我只能脱帽致敬，说一声“祝好运”。当前 Java 在 Linux 上的问题正在消失，那就是在最喜欢的发行版上安装 Java
    通常并不是轻而易举的事。这种情况正在迅速改变，但仍然时好时坏。更糟糕的是，一些最好的 Java 应用程序无法通过简单的 `apt-get` 获取。


    `apt-cache search jedi` 命令找不到任何结果，即使是在 Ubuntu 的将来发行版中也是如此，尽管 jEdit 是一个出色的基于 Java
    的编辑器。搜索 BitTorrent 客户端 Azureus 会显示 GCJ 编译的版本。这并没有错，但我仍然更喜欢将 Azureus 作为 Java 应用程序运行。如果我想要非
    GCJ 版本，就必须手动下载和安装 Azureus。专业级的独立 Java 客户端应用程序并不多，但我喜欢和使用的几个很少能在标准应用程序仓库中找到。我预计，或者至少希望，随着
    Java GPL 化的推进以及 Java 虚拟机在 Linux 所有发行版中默认安装，这种情况将会改变。


    但这是 Java 有望在用量上爆发增长的领域。目前，经济型网络主机默认支持 MySQL 和 PHP，也许还有 Perl 和 PostgreSQL。Java
    通常额外收费，最有可能的原因是它不是免费的，而提供这些服务的商业主机默认没有安装 Java。我打赌一年内，我会看到所有每月 5 美元或更昂贵的主机服务默认提供
    Java 和 JSP。我甚至已经看到少数服务已经采取这一步骤。我会错吗？当然有可能。我以前也错过了一次——我想是 1979 年 10 月，但我可能对这一点记错了。尽管如此，我坚持我的预测，即
    Java 将在经济型主机服务上爆发增长。


    归根结底，如果你还没有下定决心，那就去做吧。Java 不像 PHP 那样容易上手。但它足够像 C/C++，如果你来自传统的 C/C++ 背景，学习曲线不会过于陡峭。我发现学习
    Java 的关键在于专注于如何正确使用错误处理功能，这通常是我初次尝试用 Java 编程时遇到困难的地方。


    **尼古拉斯·佩特雷利** 是 *Linux Journal* 的主编，也是一位前程序员、教师、分析师和顾问，他研究并撰写关于 Linux 的文章已有十多年。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_98_0.png)


    **罗斯·巴纳德**，FlapDaddy Productions 总裁


    ### **“狂热支持”**™ *救了我一命，让我免于自己的错误。*


    “不久前，我重新格式化了一台服务器。直到开车回家时，我才意识到在这个过程中我把整个网站弄挂了。我给 Rackspace 的联系人打了电话，他说：‘我们已经在处理了。’
    等我停进车道时，我的网站已经恢复了。这才是狂热的支持。”


    防止小错误引发大问题是狂热支持的一种定义。你的定义会是什么？


