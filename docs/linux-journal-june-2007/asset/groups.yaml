    # **Re: the “Someone Else May Have to Decipher Your Code” Letter in April 2007\
    \ Issue**\n\nIn his letter titled \"Someone Else May Have to Decipher Your Code\
    \ Someday\", Michael C. Tiernan suggested the use of temp files instead of pipes\
    \ for readability, instead of thinking that pipes can be as easy to read as code\
    \ used in temporary files.\n\nBut, when using temporary files in a production\
    \ environment, it should be done right, so the lines:\n\n```\n    tmp1=/tmp/tmp.1.$$\n\
    \    tmp2=/tmp/tmp.2.$$\n    tmp3=/tmp/tmp.3.$$\n    tmp4=/tmp/tmp.4.$$\n```\n\
    \nshould be replaced by:\n\n```\n    tmp1=`mktemp`\n    tmp2=`mktemp`\n    tmp3=`mktemp`\n\
    \    tmp4=`mktemp`\n```\n\nor:\n\n```\n    tmp1=`mktemp /tmp/tmp.1.XXXXXXX`\n\
    \    tmp2=`mktemp /tmp/tmp.2.XXXXXXX`\n    tmp3=`mktemp /tmp/tmp.3.XXXXXXX`\n\
    \    tmp4=`mktemp /tmp/tmp.4.XXXXXXX`\n```\n\nFor security reasons. First, mktemp\
    \ ensures the filenames are unused, and the files generated do have the access\
    \ rights set to ensure that only the owner can read the content.\n\n**~~Berthold\
    \ Hollmann~~**\n\n# **Miniature OpenGL Development System**\n\nI just thought\
    \ you might want to know about this project: the myOS—Miniature OpenGL development\
    \ system. It is a minimalistic OpenGL-capable GNU/Linux-based system without X.\
    \ It is a bare-bones Linux system, stripped down of everything but the core necessary\
    \ files to compile and run OpenGG/UC code. It has a simplified directory structure\
    \ and cleaned up internal cross-referencing. It starts up with, and in total has,\
    \ only a single script (one.xthost.info/zelko/opengl.html).\n\n**~~ZeaATShuttle~~**\n\
    \nDid you know Microsoft owns the patent to OpenGL?—*Ed.*\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_11_1.png)\n\
    \n\n\n# **MAGAZINE**\n\n+   - **PRINT SUBSCRIPTIONS:** Renewing your subscription,\
