  - '[PAGE 55]


    # # Python modules are simple text files, and you can use any text editor you
    want.


    Methods are like functions, but as they are in a class, they are associated with
    the objects of the class. This means different classes can have different methods
    with the same name. Just imagine the difference between bat.hit(ball) and stick.hit(drum).


    Python has a convention that the first parameter (normally called self) to a method
    is the object on which we are calling the method. That means running cool.set_title("Cool")
    will set self to be cool, and title to be "Cool". Running:


    ```

    cool.set_title("Cool")

    ```


    is the equivalent of:


    ```

    cool._title = "Cool"

    ```


    The leading underscore lets others know that we don''t want them playing with
    it. It means "don''t access _title; use get_title and set_title". The previous
    interaction with the cool object can be rewritten as:


    ```

    ```

    >>> cool = Post()

    >>> cool.set_title("Cool")

    >>> cool.set_body("Python is cool.")

    >>> cool.get_title()

    ''Cool''

    >>> cool.get_body()

    ''Python is cool.''

    ```

    ```


    Writing the same set of methods for body should be easy now. But, be aware that
    you have to write the whole class in one go. Write the class header, the set_title
    and get_title methods, and then create your set_body and get_body methods. It
    may take you a couple of tries.


    # ## Files


    As the Post class becomes bigger, you''ll get tired of rewriting it every time
    you want to add a method. If you''re tired already, that''s a good sign. And besides,
    all that''s in the REPL will be lost when we quit Python. We should start saving
    our work in files.


    Python modules are simple text files, and you can use any text editor you want.
    As a programmer, you are going to spend most of your time with your editor, so
    take some time to choose one you really like and learn to use it well.


    Emacs might not be the most beautiful editor, but for many programming tasks,
    it is awesome. (You could read that as "I don''t like Emacs but it makes my job
    so much easier that I keep coming to it time after time".) Installing Emacs from
    source is beyond the scope of this article. As usual, with programs that are so
    popular, your distribution is likely to provide it. In Debian and its derivatives
    try:


    ```

    apt-get install emacs

    ```


    For Gentoo, the counterpart is:


    ```

    emerge emacs

    ```


    To achieve the magic I am going to show here, you need python-mode. In Debian:


    apt-get install python-mode


    In Gentoo:


    ```

    emerge python-mode

    ```


    Run Emacs. If you are serious about learning how to use it, now it is time to
    press Ctrl-H T, which in Emacs jargon means press Ctrl-H, release it and then
    press T. But, you can leave that for later, when you''ve finished reading this
    *Linux Journal* issue. For this article, I provide all the keystrokes you need.


    Press Ctrl-X Ctrl-F (Ctrl-X, release, Ctrl-F) to visit a file. On the bottom of
    the Emacs window, you''ll see the cursor waiting for you to type the path and
    filename. Type *blog.py* and press Enter. (Python modules should have the extension
    .py.) Now, you can start typing the Post class we programmed before. Emacs tries
    to be smart about indentation and places it where you likely to want it. If you
    need a different indentation, simply press Tab and keep pressing it until you
    get the desired results.


    On the top, you should have two menus: IM-Python and Python. The first one contains
    a list of classes and methods in the file you are editing. Click on Rescan if
    it doesn''t show information you know is there. This is very useful when working
    with huge files. The second menu is even more useful, but explore and play with
    it later. For now, simply run *Start interpreter...* or press Ctrl-C I.


    Suddenly the window is split, and you have an embedded Python interpreter below
    the file you are editing (Figure 2). And the fun is only beginning. Click on the
    file you are editing to set the focus on it. Run *Import/reload file* from the
    Python menu or press Ctrl-C Enter. Now, you''re ready to test your code on the
    REPL, but be aware that


