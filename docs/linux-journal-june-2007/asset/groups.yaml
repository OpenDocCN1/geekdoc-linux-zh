    \     if word =~ /[^aeiou]/i\n        word << \"way\"\n      else\n        first_letter\
    \ = word.slice(0,1)\n        rest = word.slice(1...-1)\n        \n        word\
    \ = \"#{rest}#{first_letter}ay\"\n      end\n      \n      @sentence << word\n\
    \      @sentence << \" \"\n    end\n  end\nend\n```\n\n## 结论\n\n当我第一次读到关于 RJS\
    \ 模板的内容时，我认为这是我听过的最奇怪的想法之一。这是因为在 Ruby 中编写 JavaScript 的概念似乎既奇怪又没必要。现在我明白了这种类型模板的功能和巧妙之处，并期待在我的许多由\
    \ Ajax 驱动的网站上使用它。通过一点学习和改变你对 Web 开发的思维方式，你很可能会做出同样的发现。■\n\n**Reuven M. Lerner，一位长期从事\
    \ Web/数据库咨询工作的专家，是位于伊利诺伊州埃文斯顿市西北大学学习科学的博士生。他目前与妻子和三个孩子住在伊利诺伊州斯科基市。你可以在 altnewland.lerner.co.il\
    \ 上阅读他的博客。**\n\n## 资源\n\n有许多好的印刷版和在线资源可用于学习 Ajax。我最喜欢的网站之一是 **ajaxian.com**，其中作者讨论并评测与\
    \ Ajax 相关的工具。\n\n两本好书可能会派上用场。实用程序员出版社（Pragmatic Programmers）出版了由 Dave Thomas 和\
    \ David Heinemeier-Hansson 撰写的获奖作品《敏捷开发之 Rails》的第二版，而 O'Reilly 发布了 Scott Raymond\
    \ 的《Rails 上的 Ajax》。在这两本书之间，你应该能够全面理解 Ruby on Rails 的工作原理，以及如何使用 JavaScript 和 RJS\
    \ 创建有趣且动态的 Web 应用程序。\n\n"
