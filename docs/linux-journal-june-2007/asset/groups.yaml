    \n# Asynchronous Database Access with Qt 4.x\n\nHow to code around the default\
    \ synchronous database access in Qt 4.\n\nDave Berton\n\nThe database support\
    \ in Qt 4.x is quite robust. The library includes drivers for Oracle, PostgreSQL,\
    \ SQLite and many other relational databases. Out of the box, the Qt database\
    \ library also contains bindings for many widgets and provides data types for\
    \ the transparent handling of result sets coming from a database. But, your application\
    \ can pay a price for these conveniences. All database access is synchronous by\
    \ default, which means that intensive and time-consuming SQL queries normally\
    \ will lock up the UI unless precautions are taken. Using stored procedures on\
    \ the server can sometimes help the situation; however, this is not always possible\
    \ or desirable. And often, the length and cost of the queries generated by your\
    \ application simply cannot be known in advance, so the door is left open for\
    \ undesirable UI behavior. People don't want their application to \"lock up\"\
    \ at odd moments; however, this is the default behavior, and so we must contend\
    \ with it.\n\nFortunately, Qt 4.x also has robust support for multithreaded programming.\
    \ By placing the heavy-duty database work in separate threads, the UI is free\
    \ to respond to the user normally, without ungraceful interruptions. As with all\
    \ concurrent programming, however, you must take precautions to ensure the correct\
    \ sequence of interactions between threads. For example, when sharing data among\
    \ threads, guard it properly using mutexes. When communicating between threads,\
    \ consider carefully how the interaction will behave, and in what sequence. In\
    \ addition, when utilizing a database connection within a thread separate from\
    \ the UI thread, you must pay attention to some extra caveats. A proper implementation\
    \ that keeps certain things in mind will make significant improvements in the\
    \ UI behavior and responsiveness of a database application.\n\n## Thread Strategies\n\
    \nThere are several ways to distribute the database load to separate threads of\
    \ execution. Fortunately, all of them share the same characteristics when it comes\
    \ to the details of creating and using a database connection properly. The primary\
    \ consideration is to use a database connection only within the thread that created\
    \ it. For regular synchronous applications, the default behavior is fine. The\
    \ `QSqlDatabase::addDatabase()` static function creates a database connection\
    \ within the context of the application's main UI thread. Queries executed within\
    \ this same thread will then cause blocking behavior. This is to be expected.\n\
    \nIn order to run queries in parallel with the main UI thread, so that they do\
    \ not interrupt the main event processing loop, a database connection must be\
    \ established in the thread in which the query executes, which should be separate\
    \ from the main UI thread. However you structure the threading in your application,\
    \ your design must be able to establish a connection within the context of each\
    \ thread that will be performing database work.\n\nFor example, creating a thread\
    \ pool in which a few threads handle the load of querying the database in a round-robin\
    \ fashion (without the overhead of creating and destroying threads all the time)\
    \ will push the time-consuming work outside the main event loop. Or, depending\
    \ on the needs of your application, you simply can spawn threads on an as-needed\
    \ basis to perform database work. In either case, you must create a connection\
    \ per thread.\n\nThere is a further limitation (imposed by most of the underlying\
    \ database-specific libraries used by Qt). As a general rule, connections cannot\
    \ be shared by multiple threads. This means you cannot simply create a pool of\
    \ connections on startup and hand them out to various threads as needed. Instead,\
    \ each thread must establish and maintain its own connection, within its own context.\
    \ To do this you are confined, and probably disastrous. Multiple separate connections\
    \ can be established in each thread by using the name parameter of the `QSqlDatabase::addDatabase()`\
    \ static function, as shown in Listing 1.\n\nIn Listing 1, the thread objects\
    \ establish two different database connections. Each connection is named separately,\
    \ so that `QSqlDatabase` can maintain them properly in its internal list. And,\
    \ most important, each connection is established within the separate thread of\
    \ execution of each object—the `run()` method is invoked by `QThread::start()`\
    \ once the new thread of execution is launched. The mechanism provided by `QSqlDatabase`\
    \ to create new connections is thread-safe. Listing 2 shows another example of\
    \ a more generic approach.\n\nThe pseudo-code in Listing 2 creates and starts\
    \ two worker threads. Each thread establishes a named connection to the database\
    \ and waits for work to do. Each thread always will deal only with its own database\
    \ connection, which is never shared or visible outside the worker thread object.\n\
    \n```cpp\n// Listing 1. Create two instances of QThread, one for queries, another\
    \ for updates.\n\nclass QueryThread : public QThread\n{\n    public:\n       \
    \ QueryThread( QObject* parent = 0 )\n        {\n            //...\n        }\n\
    \        void run()\n        {\n            QSqlDatabase db = QSqlDatabase::addDatabase(\n\
    \                \"QPSQL\", \"querythread\" );\n            // use 'db' here\n\
    \        }\n};\n\nclass UpdateThread : public QThread\n{\n    public:\n      \
    \  UpdateThread( QObject* parent = 0 )\n        {\n            //...\n       \
    \ }\n        void run()\n        {\n            QSqlDatabase db = QSqlDatabase::addDatabase(\n\
    \                \"QPSQL\", \"updatethread\" );\n            // use 'db' here\n\
    \        }\n};\n```\n\n```cpp\n// Listing 2. A More Generic Approach with a Single\
    \ Instance of QThread Used Twice\n\nclass QueryThread : public QThread\n{\n  \
    \  public:\n        QueryThread( const QString name )\n            : m_connectionName(name)\n\
    \        {\n            //...\n        }\n        void run()\n        {\n    \
    \        QSqlDatabase db = QSqlDatabase::addDatabase(\"QPSQL\", m_connectionName\
    \ );\n            //...\n            db.open();\n            forever\n       \
    \     {\n                // wait for work\n                // and then execute\
    \ it...\n            }\n        }\n    }\n\n    void main()\n    {\n        QApplication\
    \ app(...);\n        MainWindow mw;\n        QueryThread db1(\"queries\");\n \
    \       db1.start();\n        QueryThread db2(\"updates\");\n        db2.start();\n\
    \        //...\n        mw.show();\n        app.exec();\n    }\n```\n\nSetting\
    \ up thread-specific connections and running queries within that thread is only\
    \ the first part of the problem. A decision needs to be made regarding how data\
    \ is shuffled back and forth between the worker threads and the main application\
    \ UI thread. Additional methods will give the thread object some database work\
    \ to perform, and those methods will themselves need to be thread-safe.\n\n`QCoreApplication`\
    \ passes these events in a thread-safe manner from the application thread to the\
    \ worker thread, and they will be handled by the worker thread within its own\
    \ execution context. This is critical, because the worker thread will be utilizing\
    \ its database connection only from within its own context (Listing 3). This method\
    \ works in the other direction as well. Events posted by individual worker threads\
    \ will show up back in the main UI event loop for handling, within the context\
    \ of the UI’s thread of execution. These events can, for example, contain the\
    \ result of a query or database update. This approach is convenient, as the worker\
    \ threads can simply “post it and forget it”, and Qt will take care of the inter-thread\
    \ communication, mutexing and memory management for you. Constructing all the\
    \ necessary events and event handlers for this type of system has advantages—most\
    \ notably compile-time type.\n\n## Moving Data between Threads\n\nYou should observe\
    \ all of the usual caveats surrounding the sharing of data between different threads\
    \ of execution, including the proper uses of mutexes and wait conditions. In addition,\
    \ there is an added complication regarding the size of the data, which potentially\
    \ can be extremely large in the case of result sets returned from the database.\n\
    \nQt provides several specialized mechanisms for sending data between threads.\
    \ You can post events manually to any object in any thread using the thread-safe\
    \ function `QCoreApplication::postEvent()`. The events will be dispatched automatically\
    \ by the event loop of the thread where the destination object was created. To\
    \ create an event loop within each thread, use `QThread::exec()`. Using this method,\
    \ threads are given “work” to do in the form of events.\n\nCommunicating between\
    \ threads now becomes a matter of connecting signals from one thread to the slots\
    \ in another, and the mutexing and thread-safety issues of exchanging data between\
    \ threads are handled by Qt.\n\n```cpp\n// Listing 3. Code That Shares Information\
    \ from Worker Thread to Application Thread via Event\n\nclass WorkEvent : public\
    \ QEvent\n{\n    public:\n    enum { Type = User + 1 }\n    WorkEvent( const QString&\
    \ query )\n      : QEvent(Type)\n      , m_query(query)\n    {}\n\n    QString\
    \ query() const\n    {\n      return m_query;\n    }\n\n  private:\n    QString\
    \ m_query;\n};\n\nQueryThread thread;\nthread.start();\n// ...\nWorkEvent* e =\
    \ new WorkEvent(\"select salary from employee where name='maggelena';\");\napp.postEvent(\
    \ &thread, e );\n// ...\n```\n\n```cpp\n// Listing 4. Sharing information across\
    \ threads is cleaner with signals and slots.\n\nclass Worker; // forward decl\n\
    class QueryThread : public QThread\n{\n QueryThread();\n signals:\n  void queryFinished(\
    \ const QList<QSqlRecord>& records );\n slots:\n  void slotExecQuery( const QString&\
    \ query );\n signals:\n  void queue( const QString& query );\n private:\n  Worker*\
    \ m_worker;\n};\n\nint main()\n{\n  QApplication app;\n\n  MainWin mw;\n\n  QueryThread\
    \ t;\n  t.start();\n\n  connect(&mw, SIGNAL( execQuery(const QString&)),\n   \
    \       &t, SLOT( slotExecQuery(const QString&)));\n\n  connect(&t, SIGNAL( queryFinished(const\
    \ QList<QSqlRecord>&)),\n          &mw, SLOT( slotDisplayResults(const QList<QSqlRecord>&)));\n\
    \n  mw.show();\n  return app.exec();\n}\n```\n"
