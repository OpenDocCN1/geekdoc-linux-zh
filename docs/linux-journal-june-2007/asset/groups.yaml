  - "[PAGE 65]\n\n# # Validate an\nE-Mail Address\nwith PHP,\nthe Right Way\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_65_0.png)\n\
    \nDevelop a working\nPHP function to validate\ne-mail addresses.\n\n# DOUGLAS\
    \ LOVELL\n\nThe Internet Engineering Task Force (IETF) document, RFC 3696, “Application\
    \ Techniques for Checking and Transformation of Names” by John Klensin, gives\
    \ several valid e-mail addresses that are rejected by many PHP validation routines.\
    \ The addresses: Abc@def@example.com, customer/department-shipping@example.com\
    \ and !I#fI%y2¢g&6@c@example.com are all valid. One of the more popular regular\
    \ expressions found in the literature rejects all of them:\n\n```\n```code\n\"\
    ^[a-z0-9-]*\\(\\.[_a-z0-9-]*\\)*@[a-z0-9-]+\\(\\. [a-z0-9-]+\\)*\n+\\\\ \n\\\\\
    \ \n\\. \n[a-z] \n\\.\n[3]\n}\"```\n\n```\n\nThis regular expression allows only\
    \ the underscore (_) and hyphen (-) characters, numbers and lowercase alphabetic\
    \ characters. Even assuming a preprocessing step that converts uppercase alphabetic\
    \ characters to lowercase, the expression rejects addresses with valid characters,\
    \ such as the slash (/), equal sign (=), exclamation point (!) and percent (%).\
    \ The expression also requires that the highest-level domain component has only\
    \ two or three characters, thus rejecting valid domains, such as .museum.\n\n\
    Another favorite regular expression solution is the following:\n\n```\n```code\n\
    \"^[a-zA-Z0-9-]+\\.[a-zA-Z0-9-]+\\.[a-zA-Z0-9-]+$/\"```\n\n```\n\nThis regular\
    \ expression rejects all the valid examples in the preceding paragraph. It does\
    \ have the grace to allow uppercase alphabetic characters, and it doesn’t make\
    \ the error of assuming a high-level domain name has only two or three characters.\
    \ It allows invalid domain names, such as example..com.\n\nListing 1 shows an\
    \ example from PHP Dev Shed (www.devsed.com/c/a/PHP/Email-Address-Verification-with-PHP/2).\
    \ The code contains (at least) three errors. First, it fails to recognize many\
    \ valid e-mail address characters, such as percent (%). Second, it splits the\
    \ e-mail address into user name and domain parts at the sign (@). E-mail addresses\
    \ that contain a quoted at sign, such as Abc@def@example.com will break this code.\
    \ Third, it fails to check for host address DNS records. Hosts with a type A DNS\
    \ entry will accept e-mail and may not necessarily publish a type MX entry. I’m\
    \ not picking on the author at PHP Dev Shed. More than 100 reviewers gave this\
    \ a four-out-of-five-star rating."
  - "[PAGE 66]\n\n```\n**Listing 1. An Incorrect E-mail Validation**\n\n```php\nfunction\
    \ checkEmail($email) {\n    if (preg_match(\"/^([A-Za-z0-9]+|[a-zA-Z0-9._-]+)\"\
    \n                   \"@([a-zA-Z0-9-]+)(.[a-zA-Z0-9-]+.-)+$/\", $email)) {\n \
    \       list($username, $domain) = split('@', $email);\n        if (checkdnsrr($domain,\
    \ 'MX')) {\n            return false;\n        }\n        return true;\n    }\n\
    \    return false;\n}\n```\n\n```\n\nOne of the better solutions comes from Dave\
    \ Child's blog at IlloveJackDaniels's (ilovejacksdaniels.com), shown in Listing\
    \ 2 (www.ilovejackdaniels.com/php/email-address-validation). Not only does Dave\
    \ love good-old American whiskey, he also did some homework, read RFC 2822 and\
    \ recognized the true range of characters valid in an e-mail user name. About\
    \ 50 people have commented on this solution at the site, including a few corrections\
    \ that have been incorporated into the original solution. The only major flaw\
    \ in the code collectively developed at IlloveJackDaniels is that it fails to\
    \ allow for quoted characters, such as @, in the user name. It will reject an\
    \ address with more than one at sign, so that it does not get tripped up splitting\
    \ the user name and domain parts using explode(\"@\", $email). A subjective criticism\
    \ is that the code expends a lot of effort checking the length of each component\
    \ of the domain portion—effort better spent simply trying a domain lookup. Others\
    \ might appreciate the due diligence paid to checking the domain before executing\
    \ a DNS lookup on the network.\n\n\n# ## Requirements\n\n\nIETF documents, RFC\
    \ 1035 \"Domain Implementation and Specification\", RFC 2234 \"ABNF for Syntax\
    \ Specifications\", RFC 2821 \"Simple Mail Transfer Protocol\", RFC 2822 \"Internet\
    \ Message Format\", in addition to RFC 3696 (referenced earlier), all contain\
    \ information relevant to e-mail address validation. RFC 2822 supersedes RFC 822\
    \ \"Standard for ARPA Internet Text Messages\" and makes it obsolete.\n\nFollowing\
    \ are the requirements for an e-mail address, with relevant references:\n\n\n\
    +   1. An e-mail address consists of local part and domain separated by an at\
    \ sign (@) character (RFC 2822 3.4.1).\n2. The local part may consist of alphabetic\
    \ and numeric characters, and the following characters: !, #, $, %, &, *, +, -,\
    \ /, =, ?, ^, _, ., {, }, and ~, possibly with dot separators (.), inside, but\
    \ not at the start, end or next to another dot separator (RFC 2822 3.2.4).\n3.\
    \ The local part may consist of a quoted string—that is, anything within quotes\
    \ (\"); including spaces (RFC 2822 3.2.5).\n4. Quoted pairs (such as @) are valid\
    \ components of a local part, though an obsolete form from RFC 822 (RFC 2822 4.4).\n\
    5. The maximum length of a local part is 64 characters (RFC 2821 4.5.3.1).\n6.\
    \ A domain consists of labels separated by dot separators (RFC 1035 2.3.1).\n\
    7. Domain labels start with an alphabetic character followed by zero or more alphabetic\
    \ characters, numeric characters or the hyphen (-), ending with an alphabetic\
    \ or numeric character (RFC 1035 2.3.1).\n8. The maximum length of a label is\
    \ 63 characters (RFC 1035 2.3.1).\n9. The maximum length of a domain is 255 characters\
    \ (RFC 2821 4.5.3.1).\n10. The domain must be fully qualified and resolvable to\
    \ a type A or type MX DNS address record (RFC 2821 3.6).\n\n\n```\n**Listing 2.\
    \ A Better Example from IlloveJackDaniels**\n\n```php\nfunction check_email_address($email)\
    \ {\n    // First, we check that there's one & symbol.\n    // and that the lengths\
    \ are right.\n    if (i ereg(\"^[\"@] ([\"@] [\"@]*)\" , $email)) { } // Email\
    \ invalid because wrong number of characters\n    // in one section or wrong number\
    \ of & symbols.\n    return false;\n    }\n    } // Split it into sections to\
    \ make life easier\n    $email_array = explode(\"@\", $email);\n    $local_array\
    \ = explode(\"\", $email_array[0]);\n    for ($i = 0; $i < sizeof($local_array);\
    \ $i++) { // If it\n        if (i ereg(\"^[\"[A-Za-z0-9] $&x; *+$*\" [\"]-[A-Za-z0-9]\
    \ $&x; - *+?\"?\n                    \"? \"-] [\" [\" [\"], {\" [\"], } [\"],\
    \ }\n                    \" [\" [\"@] [\"@] *?\", $local_array[$i])) {\n     \
    \       return false;\n        }\n    }\n    } // Check if domain is IP. If not,\n\
    \    // it should be valid domain name\n    if (i ereg(\"[\" [\" [\"@] [\"@] \"\
    , $email_array[1])) { }\n    $domain_array = explode(\"\", $email_array[1]);\n\
    \    if (sizeof($domain_array) < 2) {\n        return false; // Not enough parts\
    \ to domain\n    }\n    } // For ($i = 0; $i < sizeof($domain_array); $i++) {\
    \ }\n    if (i ereg(\"^[( [A-Za-z0-9] [A-Za-z0-9] (0, 61) [A-Za-z0-9]\n      \
    \         \" [\" [\"@] [\"@] *+?\", $domain_array[$i])) { }\n        return false;\n\
    \    }\n    }\n    }\n    return true;\n```\n\n```"
