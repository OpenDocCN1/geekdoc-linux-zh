    ## 移动：终极用户空间


    今年某时，全球手机数量将超过30亿部。为了让大家对这个数字有直观认识（参考上个月的*L*指数），可以将其与以下数据对比：14亿张信用卡、13亿部固定电话、11亿条互联网连接、8亿辆汽车、2亿款电脑游戏、1亿台PVR（个人录像机）以及8500万台iPod。


    手机是网络化的计算设备。其中运行Linux系统的比例正在逐渐增加。然而，像OpenMoko (openmoko.com) 和 Trolltech 的 Qtopia
    Greenphone (www.trolltech.com/products/qtopia/greenphone) 这样完全开放的工作原型机却凤毛麟角。它们面临着巨大的阻力，因为手机运营商与设备制造商之间存在着封闭的利益联盟，例如诺基亚和摩托罗拉。


    然而，世界需要开放的手机。事实上，我敢预测开放手机是必然趋势：通过开放手机获得的收益将远超封闭手机（以及仅由运营商提供的封闭服务）所能获得的收益。我们开始在移动通信封闭的墙壁上看到垂直的裂缝，例如在高校环境中，像
    Rave Wireless（声明：我是他们的顾问）这样的“叛逆”公司为基于开放系统构建的定制手机提供给学生，这些手机运行在熟悉的网络（如 Cingular
    和 T-Mobile）上，但功能远超那些网络自营商店出售的封闭手机。用户甚至可以自由编程，创建并添加自己的功能和服务。每当在这种垂直市场中出现一次这样的裂缝，开放手机成为常态而非例外的概率就会增加。这里的先锋者是Linux技术人员，但他们正在开拓一个更广阔的可能性世界。问题一如既往，不在于封闭系统本身，而在于其背后的思维模式。一旦市场开始开放，我们将很容易在这些杂志栏目中填入关于巧妙黑客技巧和部署成功的报道。


    ## 桌面和笔记本 Linux


    自20世纪90年代中期以来，桌面Linux一直在“接近但从未真正到来”。当然，大多数*Linux Journal*的读者已经在使用它了，但他们是“巫师”（精通者）。普通用户（muggles）仍然在使用
    Windows 和 Mac 电脑。长期以来，我们需要的主要硬件OEM厂商中有一两家能“苏醒并嗅到销量机会”。去年，Lenovo 开始以坚定但非激进的姿态销售预装
    Linux 的 ThinkPad；Lenovo 并没有大力推动。今年，Dell 抛出了名为 IdeaStorm 的诱饵，这是一个看似“对话式”营销手段的网站，但实际充当了打破
    Windows 独家堤坝的缺口，此前这道堤坝一直将 Linux 桌面河流挡在 Dell 总部之外。这个缺口迅速扩大成一条独立的河流，涌入 Dell 的产品开发系统。（见本期
    UpFront 栏目关于 IdeaStorm 的报道。）


    我非常想旁观 Michael Dell 告诉 Steve Ballmer Dell 将以更公开的方式销售 Linux 品牌笔记本和桌面电脑时的场景，因为公司别无选择：市场需要它。HP、Sony
    及其他厂商不会落后太远。随着销量增长，针对 Linux 桌面和笔记本的应用程序组合及专业知识总和也将随之增加。这是一个将迅速爆发的类别。我现在就敢打赌，在


    ### Linux 笔记本

    起价 799 美元


    ![](img/526fd434dcfcf1b461b94c24ea170f36_38_0.png)


    ### Linux 桌面

    起价 375 美元


    ![](img/526fd434dcfcf1b461b94c24ea170f36_38_1.png)


    ### Linux 服务器

    起价 899 美元


    ![](img/526fd434dcfcf1b461b94c24ea170f36_38_2.png)


    ![](img/526fd434dcfcf1b461b94c24ea170f36_38_3.png)


    ## DIY 一切


    我有件事要坦白。或者说，有一件*Make*相关的事要坦白。我热爱*Make*杂志。我希望我们当初能先做类似的事情。向 Dale Dougherty 和 O''Reilly
    团队致敬，他们成功做到了这一点并表现出色——同时也因为他们在其中没有放入过多的 Linux 类内容。


    当我在 20 世纪 90 年代末创办*Linux Journal*时，我们基本上是一本指南杂志。在很大程度上，我们现在依然如此。毕竟，我们的大多数读者都是动手型的人。问题解决者。我们的大多数撰稿人（我不算在内）也是如此。


    所以我好奇……既然*Linux*（或可以说）已经几乎存在于一切之中，我们能制造或修复哪些“高一层”的东西？除了机顶盒之外，我们还能用 MythTV 做什么？Pluto
    是一个酷（且基于*Linux*）的全屋自动化、安防、娱乐和电信系统。但它仍然是一个系统。开放性的一种深刻且被低估（且部署不足）的美德是模块化。你希望能混搭来自不同制造商的不同部件，包括（尤其是）你自己。我们应该用
    Linux 制作“乐高”，而不仅仅是将其嵌入到只能与自身配合工作的封闭成品中。


    这里的斗争在于拥有构建你想要之物的权利和能力，以及以你想要的方式构建它的能力。尽管*Make* 杂志侧重于在现有成品上进行有趣的黑客改造（例如将鼠标变成机器人或为咖啡机添加温度控制），我们的角度应更偏向于制作模块，以及包含这些模块的事物，使任何人都能构建任何东西。我们的主角将是与过去一样的
    DIY 爱好者，但面临的问题将是“构建任何东西”。这是一个有趣的问题。


    多年前，我谈到软件行业正在转变为建筑行业——当建筑师、设计师、建造者及其专长不再依赖于任何单一公司的平台或开发环境时。现在我们几乎达到了那个状态，但还差一点。这里的斗争在于将*Linux*
    及其无穷无尽的“技术栈”多样性变成基础材料，让人们可以用我们的虚拟“Home Depot（家装建材超市）”来组装东西。


    ## 自由 vs. 控制


    虽然很容易指向由 Linux 构建的巨头如 Google 和 Amazon 的典范性成功，但也同样容易忽视 Linux 开发背后的系统实际价值已成为网络化进步默认方法的程度。


    2008 年 6 月，*Linux Journal* 每一期都将不可避免地带有个人色彩——原因很简单，桌面和笔记本领域将有太多事情发生。


    或者可能不会。我们还不知道。Lenovo、HP 和 Dell 可能会继续悄悄接收桌面*Linux*订单，而从未大力营销它。这种情况不会永远持续，但渐近线可能在未来一年、两年或三年内仍保持平坦。


    与此同时，桌面和笔记本*Linux*仍然值得为之奋斗，正如我们在过去十年或更长时间里所做的那样。


    然而，即使*Linux* 和 LAMP+ 技术栈已成为标准建筑材料，也没人能阻止它们被用于服务于一种专有思维，这种思维试图锁定客户、排除竞争并控制市场。正如
    Steven Hodge 所说（<www.winextra.com/?p=354>）：


    > 许多人愿意相信，对抗技术旧势力最强大且有效的武器是开源运动，但他们没有看到的是，他们已经被同化，仅仅成为了另一种赚钱方式。虽然开源运动（OSM）的根源在技术上可能仍然对所有人自由，但旧势力正在迅速通过服务合同和企业许可将其部分锁定。


    风险投资商询问潜在投资组合公司“你们的锁定机制是什么？”仍然是惯例。这是一种工业时代的思维，在一个创造和选择能带来可构建为无数生产力用的丰富资源的世界中，需要将其暴露为一种减值的过时代产物。你应该希望构建客户自由选择的产品和服务。你应该留住客户是因为他们想留下，而不是因为你把他们困在孤立系统中。


    甚至 Steve Jobs 今年也公开表示，没有 DRM 的记录行业会更好。这是因为他所受的束缚并不比他的任何客户少。


    这里的主角无一不是自由事业，它将永远不会成为旧闻。（我是有意这么说的。）这里的问题——嗯，敌人——是一种与工业时代一样古老的思维模式。


    自由的斗争，当然，是我们一直在进行的斗争。不同之处在于，锁定逻辑日益暴露，其缺陷也日益明显——尽管尚未广泛显现。


    因此，这场斗争将从理想转向实际问题。如何通过用免费的东西构建并将其投入使用来赚钱，而不仅仅是通过销售？当软件越来越不再是一个独立行业时，它是如何变得更加有用和重要的？当你与免费和开源物品合作时，如何完成更多工作，并作为贡献者变得更有价值？


    这些问题仍然是新问题，尽管自 1994 年以来，*Linux Journal* 一直是对所有这些问题的一种鲜活回答。


    ## 你的故事是什么？


    所以现在，问题抛给读者。你想在*Linux Journal*中阅读关于哪些“重要斗争”的内容？告诉我们。请写至 [editor@linuxjournal.com](mailto:editor@linuxjournal.com)。


    今天的网络用户并不比 1999 年受微软 Windows 束缚的个人电脑用户更少受到电话或有线公司的束缚。


    '
