    本教程直接深入 Python 的强大功能，而不纠缠于基础编程。


    Python 是一种因其简单性和易用性而备受推崇的编程语言。它经常被推荐给编程新手作为一个好的起点。Python 还是一个解释用 Python 编写的程序的程序。还有其他
    Python 实现，如 Jython（基于 Java）、CLPython（Common Lisp）、IronPython（.NET）以及可能更多。在这里，我们仅使用
    Python。


    JOSÉ P. E. "PUPENO" FERNÁNDEZ


    ## 安装 Python


    安装 Python 并使其运行是第一步。如今，这应该非常容易。如果你正在运行 Gentoo GNU/Linux，你已经安装了 Python 2.4。Gentoo
    的打包系统 Portage 是用 Python 编写的。如果你没有它，你的安装就是损坏的。


    如果你正在运行 Debian GNU/Linux、Ubuntu、Kubuntu 或 MEPS，只需运行以下命令（或以 root 登录并省略 sudo）：


    ```

    sudo apt-get install python

    ```


    一个注意事项是 Debian 的稳定版 Python 是 2.3，而对于其他发行版，你可能会发现 2.4。它们之间的差异不大，大多数代码可以在两个版本上运行。我遇到的主要差异在于某些库类的
    API、2.4 中添加的新功能以及一些内部细节，这些在这里不应该困扰我们。


    如果你正在运行其他发行版，Python 很可能已经预先打包。使用你通常为其他软件包使用的常规资源和工具来查找 Python 软件包。


    如果所有这些尝试都失败了，你需要进行手动安装。这并不难，但请注意，除非你遵循这个简单的指导方针，否则很容易损坏你的系统：将 Python 安装到一个隔离良好的地方，我喜欢
    /opt/python/2.4.3，或者它是任何其他版本。


    要执行安装，下载 Python，解压它，并运行以下命令：


    ```

    ...

    ./configure --prefix=/opt/python/2.4/

    make

    make install

    ```


    这项任务在 Python 的 README 中有很好的文档记录，其中包含在下载的 tarball 中；请查看以获取更多细节。这里唯一缺少的任务是将 Python
    添加到你的路径中。或者，你可以通过调用其路径直接运行它，我推荐在初步探索时这样做。


    ## 第一步


    既然我们已经让 Python 运行起来，让我们直接进入编程，并在进行过程中检查语言。首先，让我们构建一个博客引擎。引擎的意思是它不会有任何类型的界面，如 Web
    界面，但它仍然是一个很好的练习。


    Python 附带一个 REPL——这是 Lisp 社区的一项精美发明。REPL 代表 Read Eval Print Loop（读取、求值、打印、循环），这意味着有一个程序可以读取表达式和语句，对它们求值，打印结果并等待更多输入。让我们运行
    REPL（根据你在上一节中安装 Python 的位置调整路径）：


    ```

    $ python

    Python 2.4.3 (#1, Sep 1 2006, 18:35:05)

    [GCC 4.1.1 (Gentoo 4.1.1)] on linux2

    Type "help", "copyright", "credits" or "license" for

    more information.

    >>>

    ```


    这三个大于号 (>>>) 是 Python 提示符，你在这里写入语句和表达式。要退出 Python，按 Ctrl-D。让我们键入一些简单的表达式：


    ```

    >>> 5

    5

    ```


    5 的值，当然是 5。


    ```

    >>> 10 + 4

    14

    ```


    这就更有趣了，不是吗？


    还有其他类型的表达式，例如字符串：


    ```

    >>> ''Hello''

    ''Hello''

    ```


    引号用于创建字符串。单引号或双引号基本上被视为相同。事实上，你可以看到我使用了双引号，而 Python 显示字符串时使用单引号。


    另一种类型的表达式是列表：


    ```

    >>> [1, 3, 2]

    [1, 3, 2]

    ```


    方括号用于创建列表，其中的项目由逗号分隔。而且，就像我们可以添加数字一样，我们可以添加——实际上是拼接——列表：


    ```

    >>> [1, 3, 2] + [11, 3, 2]

    [1, 3, 2, 11, 3, 2]

    ```


    到目前为止，你可能已经感到厌倦了。让我们切换到一些更令人兴奋的东西——一个博客。博客是帖子序列，Python 列表是表示博客的好方法，将帖子作为字符串。在
    REPL 中，我们可以这样构建一个简单的博客：


    ```

    >>> ["My first post", "Python is cool"]

    [''My first post'', ''Python is cool'']

    >>>

    ```


    这是一个字符串列表。你可以创建任何你想要的列表，包括列表的列表。到目前为止，我们所有的表达式都被求值、显示并丢失了。我们没有方法召回我们的博客以添加更多项目或在浏览器中显示它们。赋值命令来救援：


    ```

    >>> blog = ["My first post", "Python is cool"]

    >>>

    ```


