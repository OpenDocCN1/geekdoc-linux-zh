    # 专栏

    ## 与 Linux 一起烹饪


    ![](img/526fd434dcfcf1b461b94c24ea170f36_25_0.png)


    MARCEL GAGNÉ


    ## 语言塑造性格，反之亦然


    到底该怎么做才能输入那些特殊字符呢？


    如果像我一样，你花大量时间使用 OpenOffice.org 的文字处理器 Writer，那么解决方法相当简单。


    “法语先生”，我们的客人马上就要到了。你在干什么？什么？你正在为本期主题学习一门语言？你挑的学习时机可能更好一些，我的朋友，但我依然为你鼓掌。你选择学习哪门语言？PHP？C++？Python？你选了西班牙语？很遗憾，法语先生，我并不是在嘲笑你，我只是在一般情况下发笑。本期专栏本不应该关于人类语言，而是关于计算机语言。好了，别担心。让我们听听一句西班牙语。你西班牙语说得非常好。你是从书里学的吗？现在，现在，法语先生，我保证不再开《Fawlty
    Towers》式的玩笑了。而且，我们的客人随时都会到。去地下室把那瓶 2003 年的智利 Errazuriz Don Maximiano 赤霞珠红酒拿上来。我会把桌子收拾好。快点！


    啊，欢迎大家来到 Chez Marcel，这里是美酒和超棒的开源软件的家园。请坐，自便。法语先生去取酒了，很快就会回来。为了致敬我那位好意但略显笨拙的忠实侍者，我决定对菜单做最后一次临时修改。今晚的菜单将围绕语言展开，或者至少是处理构成许多语言的字符的那些特殊符号。


    即使你除了英语不会说其他任何语言，也会发现自己在写作时需要输入带有重音或其他特殊符号的字母或字符。如果你的名字末尾带有重音字母（正如我的姓氏那样），这种情况尤其如此。当然，我可以在桌面上保持一个已经写好这些字母的文档随时待命，选中这些字母，复制它们，然后将它们粘贴到文本中，但这样做可能会变得异常耗时。


    如果和你一样，你花大量时间使用 OpenOffice.org 的文字处理器 Writer，解决方法相当简单。点击菜单栏上的“插入”，然后从下拉菜单中选择“特殊字符”。此时会出现一个标记为“特殊字符”的窗口（图
    1）。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_25_1.png)


    图 1. OpenOffice.org 提供了一个对话框，用于在文档中输入特殊字符。


    从该对话框中，你可以选择字体和国际字符集——北美人、南美人、澳大利亚人和大多数欧洲人通常使用拉丁字符子集。总体而言，这是一个极佳的解决方案，除了它仅适用于正在运行的
    OpenOffice.org，并且要求你每次想要输入特殊字符时都要打开该对话框之外。此外，并非所有应用程序都提供便捷的字符列表供你选择。有几种方法可以绕过这个问题，我现在就向你展示其中几种。


    让我们先从一些 KDE 的解决方案开始。启动 kcontrol，即 KDE 控制中心。在“区域和辅助功能”下，选择“键盘布局”子菜单。在右侧窗格中，你会看到来自不同国家的许多国旗图标。点击“启用键盘布局”以取消这些选项的灰色状态。如果你在安装系统时选择了美式英语作为首选语言，默认设置提供的是美式英语键盘布局。由于我的背景是加拿大法语区而非法国本土，我最熟悉的是北美键盘布局，包括加拿大法语键盘（说实话，我根本不知道法国本土的键盘布局是怎样的）。因此，我总是将“加拿大”添加到该列表中（图
    2）。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_25_2.png)


    图 2. 从 KDE 控制中心，你可以分配额外的键盘布局。


    当你点击“确定”或“应用”时，一个看起来像小旗子的小图标会出现在你的图标托盘中。点击该图标可以在各种布局之间切换（目前有两种）。当你处于备用布局（例如，加拿大）时，按下不同的键会呈现该键盘布局映射预设的字符。这可能需要你进行一些实验，以便发现每个键的功能——除非，当然，你恰好熟悉你所选择的布局。


    为了恢复正常工作，再次点击托盘图标以切换回美式英语键盘布局。然而，这种来回切换并不适合每个人，而且当你只需要偶尔使用一个特殊字符时，花时间去学习一种备用键盘布局可能并不是最佳方案。绕过此问题的另一种方法是使用一个名为
    KCharSelect 的工具。你通常可以在 KDE 实用工具菜单中找到它，但你也可以使用命令 `kcharselect` 来运行它。当程序启动时，会出现一个包含当前区域设置中所有
    256 个可用字符的表格（图 3）。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_26_0.png)


    图 3. KCharSelect 就像一张特殊字符的自助餐桌。


    从顶部的下拉列表中选择一个字体。然后，如有必要，选择一个备用的字符表（在我的系统中，拉丁字符集位于 0 位置）。如果你将鼠标指针悬停在某个字符上，你将看到它的
    Unicode 和 ASCII 值。要在应用程序（如电子邮件）中使用某个字符，点击该字符，它将出现在对话框底部的文本字段中。如果你愿意，甚至可以输入多个字符。要使用你选择的内容，点击“到剪贴板”按钮，然后将结果粘贴到你选择的应用程序中。


    GNOME 桌面用户有一个类似的应用程序，名为 Gucharmap。你很可能通过点击顶部 GNOME 面板上的“应用程序”按钮，在“附件”子菜单中找到它（在我的
    Ubuntu 测试系统中就是这样）。如果你想直接运行该程序，其名称为 `gucharmap`。当窗口出现时（图 4），你会发现其概念与 KDE 的 KCharSelect
    工具类似，但存在一些有趣的差异。从左侧边栏选择你的字符集或书写系统（对我们大多数人来说是拉丁字符集），选择一种字体，然后在右侧主显示窗格中双击你想要的字符。这样做时，该字符将出现在对话框底部的“要复制的文本”字段中。点击“复制”按钮，然后将文本粘贴到你当前正在运行的任何应用程序中。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_26_1.png)


    图 4. Gucharmap 是选择特殊字符的一种绝佳 GNOME 方式。


    像 KCharSelect 和 Gucharmap 这样的工具在手非常好，但对于某些人来说，输入特殊字符的需求只是偶尔出现。因此，这些程序在桌面上似乎显得有点笨重，*不是吗？*
    对于那些只需要输入少量字符的人来说，一个微小的应用程序，一个驻留在面板中的小部件，可能更合口味。在 KDE 环境中，有许多小部件，其中“字符选择器”可能就是你所需要的。


    要添加这个小部件，请在 Kicker 面板的空白处点击右键，并选择“向面板添加小部件”。会出现一个“添加小部件”对话框，其中列出了可用于填充 Kicker
    面板的程序（图 5）。每个程序（或小部件）都按字母顺序列出，并附有简短描述。寻找“字符选择器”。要添加小部件，只需点击“添加到面板”按钮。


    ![](img/526fd434dcfcf1b461b94c24ea170f36_26_2.png)


    图 5. 向 KDE Kicker 面板添加小部件。


    现在，你的 Kicker 面板应该有一个包含一堆特殊字符的框——默认情况下是 12 个。要在文本中使用其中一个字符，只需单击你选择的字符，然后将其粘贴到你的应用程序中。就这么简单。话虽如此，应用程序提供的字符集可能并不完全符合你的需求。要更改这一点，请右键点击小部件的手柄（小部件左侧带有箭头的细条），并从弹出菜单中选择“配置字符选择器”。小部件上方会出现一个配置窗口（图
    6）。


    '
