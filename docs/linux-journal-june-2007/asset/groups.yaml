    ### Moonwalk 软件套件


    澳大利亚公司 Moonwalk 为我们的同类物种（在这里指北美市场）做出了巨大的飞跃，推出了其同名“全方位数据管理和保护软件”的 6.0 版本。Moonwalk
    存在的意义是“无论平台如何（包括 Linux、Windows、UNIX 和 NetWare），在整个企业中透明地自动化并主动管理数据的迁移、复制和移动”。该应用程序通过根据用户定义的规则和政策（基于年龄、大小、文件类型、文件名、文件创建者等标准）进行数据的迁移、复制和移动，利用次级存储而非主存储。它进一步“摒弃了分层或层级存储方法以及仅提供存储使用可见性的
    SRM 应用程序”。Moonwalk 与可用的备份解决方案兼容。


    www.moonwalkinc.com


