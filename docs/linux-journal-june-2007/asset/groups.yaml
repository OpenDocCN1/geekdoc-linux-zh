    \n![](img/526fd434dcfcf1b461b94c24ea170f36_53_0.png)\n\n```\n>>> blog = []\n>>>\
    \ blog = add_post(blog, ('New blog', 'First post'))\n>>> blog = add_post(blog,\
    \ ('Cool', 'Python is cool'))\n>>> blog\n[('New blog', 'First post'),\n ('Cool',\
    \ 'Python is cool')]\n>>>\n```\n\n在第一行，我将博客重置为空列表。然后，我添加了两个帖子。看到双重括号了吗？外面的括号是函数调用的一部分，里面的括号是创建元组。元组由括号创建，其成员由逗号分隔。它们类似于列表，但语义上不同。例如，你不能更新元组的成员。元组用于构建具有固定元素集合的某种结构。让我们看看我们博客之外的一个元组：\n\
    \n```\n>>> (1, 2, 3)\n(1, 2, 3)\n```\n\n访问帖子的每个部分类似于访问博客的每个部分：\n\n```\n>>> blog[0][0]\n\
    'New blog'\n>>> blog[0][1]\n'This is my first post'\n```\n\n如果我们只想存储标题和正文，这可能是一个很好的解决方案。但是，我们多久会想添加日期和时间、摘要、标签或消息呢？你可能开始觉得需要在墙上挂一张纸，如图中\
    \ 1 所示，以记住每个字段的索引——这一点也不令人愉快。为了解决这个问题和其他一些问题，Python 为我们提供了面向对象编程。\n\n## 面向对象编程\n\
    \n面向对象编程诞生于 20 多年前，使开发人员能够以类似现实世界中对象分离的方式，将计算机程序的每个部分分开。Python 通过使用类来建模对象。类是对象拥有什么以及对象能做什么的抽象定义。如果觉得这听起来陌生，别担心，面向对象编程（OOP）一开始很难。\n\
    \n一个例子可能会有帮助。桥是一种结构，允许人或车辆跨越障碍物，如河流、运河或铁路。桥有一定的长度、宽度，甚至高度。它可能允许车辆或仅允许行人。它可能允许重型车辆或不允许。当我说“桥”时，我并没有定义其中任何细节。桥是一个类。如果我说金门大桥、诺曼底大桥或明石海峡大桥，我是在命名特定的桥梁；它们具有特定的长度、宽度、车辆通行许可和颜色。用\
    \ OOP 术语来说，它们是桥的实例。\n\n回到我们的博客，让我们创建一个类来建模我们的帖子：\n\n```python\n>>> class Post(object):\n\
    ...     pass\n>>> \n>>> \n```\n\n我们从 `class` 开始，这是创建新类的关键词。接下来是类的名称——在本例中为 `Post`。在括号内，我们有超类——暂时忽略它。\n\
    \n再次，提示符从 `>>>` 变为 `...`，Python 期望在类中放入*某些东西*。因为我们暂时不想放任何内容，所以我们写 `pass`，它代表“某些东西”，但事实上它什么也不做。Python\
    \ 通过缩进来知道类何时开始和结束，这与函数相同。\n\n要重现我所做的操作，只需输入类标题 `class Post(object):`，按 Enter，按\
    \ Tab，输入 `pass`，按 Enter，再按一次 Enter，就完成了。\n\n现在，我们可以创建一个 Post：\n\n```python\n>>>\
    \ cool = Post()\n>>> cool\n<_main__.Post object at 0xb7c6642c>\n```\n\n注意，当我们评估一个帖子时，打印出来的是对象的通用表示。我们可以设置它的标题和正文：\n\
    \n```python\n>>> cool.title = \"Cool\"\n>>> cool.body = \"Python is cool.\"\n\
    ```\n\n并获取它们：\n\n```python\n>>> cool.title\n'Cool'\n>>> cool.body\n'Python is\
    \ cool.'\n```\n\n到目前为止，Post 就像一个简单的容器，你可以想象放入任何内容。这样做的缺点是，我们可能会迷失关于该放什么或不放什么。回到那张纸吗？不！虽然我们不能再通过那种方式让帖子变成容器，但我们可以放入一些方法，让用户对帖子可能包含什么有一个概念。为此，我们在类\
    \ Post 中编写了自己的方法：\n\n```python\n>>> class Post(object):\n...     def set_title(self,\
    \ title):\n...         self._title = title\n...     def get_title(self):\n...\
    \         return self._title\n... \n```\n\n## 面向开源社区的硬件系统\n**自 1989 年起**\n(Linux,\
