    \ -1, \"wxPython App\")\n        frame.Show(true)\n        return true\n\nMain().MainLoop()\n\
    ```\n```\n\nThis time, Lua's lack of necessary formatting and full-fledged OOP\
    \ makes an easy job easier. Rather than create a class and function, wxLua incorporates\
    \ everything needed for this GUI application in a single system function, whereas\
    \ Python and wxPython require a Class as well as a function. Also note that Lua\
    \ imports system libraries automatically. This wxLua application exercises some\
    \ of Lua's OOP features that I discussed previously. The application creates the\
    \ frame, sets the frame's name and the frame values, and then it calls the Show()\
    \ function from within the wxFrame method using the colon. You also can call the\
    \ frame with the period syntax rather than the colon:\n\n```\n```lua\nframe.Show(frame,\
    \ true)\n```\n```\n\n# Embedding and Extending\n\nAlthough taking a look at embedding\
    \ and extending Lua is outside the scope of this article, I touch on a few concepts\
    \ here. First, the Lua API is very straightforward. Its design eliminates the\
    \ need for manual reference when embedded in C code (unlike Python's API). Like\
    \ the language, Lua's C API (for embedding) is fairly minimalistic. If you need\
    \ advanced functionality, you can use a secondary library that is primarily made\
    \ up of preprocessor macros.\n\nSecond, C and C++ are not the only languages in\
    \ which Lua can be embedded. Tao.Lua provides straight .NET and Mono bindings\
    \ to Lua, and Lualua allows scripts written in Lua to manipulate Java components.\
    \ Lualua allows Java components to be accessed from Lua with the same syntax that\
    \ Lua uses for accessing its native objects. It also allows Java to use a Lua\
    \ interface so that any interface can be implemented in Lua and passed as a parameter\
    \ to any method. The method's result (when called in the Java program) is called\
    \ in Lua, and the result is sent back to Java.\n\n# Conclusion\n\nLua is a flexible,\
    \ powerful, compact language that can be used and extended in myriad situations.\
    \ Its focus on simplicity makes for easy debugging and has attracted many users.\
    \ Its simple, powerful syntax provides flexibility because of Lua's metamechanisms.\
    \ The small, fast interpreter uses less resources than Python, and its syntax\
    \ allows for easier code readability. Its simple C API makes embedding a breeze.\
    \ Whether you are doing data processing, GUIs or game programming, you will find\
    \ a use for Lua.\n\nJoseph Quigley has been a Linux user for more than two years.\
    \ He enjoys fiddling with different Linux distros and exploring new programming\
    \ languages.\n\n# Resources\n\n+   * Programming in Lua: [www.lua.org/pil](http://www.lua.org/pil)\n\
    * lua-users: [www.lua-users.org](http://www.lua-users.org)\n* wxPython: [www.wxpython.org](http://www.wxpython.org)\n\
    * wxPyWiki: [wiki.wxpython.org](http://wiki.wxpython.org)\n* wxLua: [wxlua.sourceforge.net](http://wxlua.sourceforge.net)\n\
    * Lualua: [www.keplerproject.org/lualua](http://www.keplerproject.org/lualua)\n\
    * The Tao Framework: [www.taoframework.com](http://www.taoframework.com)\n* Lua\
    \ Versus Python: [www.lua-users.org/wiki/LuaVersusPython](http://www.lua-users.org/wiki/LuaVersusPython)"
  md: "\n![](img/526fd434dcfcf1b461b94c24ea170f36_95_0.png)\n\n## INDEPTH\n\nRemember\
    \ that Lua treats strings and integers differently: \"1\" < 2 is always false,\
    \ and strings are compared alphabetically.\n\nLua does while loops if the condition\
    \ is false. Repeat-until statements are the opposite of while loops; they loop\
    \ until the condition is true. For loops have some hidden twists, which can be\
    \ annoying to Python or Ruby programmers. Local variables created in the for loop\
    \ are visible only inside the loop. The variable does not exist when the loop\
    \ ends, so if you need the value of the control variable, you have to save its\
    \ value into another variable. Breaks or returns should appear only as the last\
    \ statement before an `end`, an `else`, or an `until` in a loop for syntactic\
    \ reasons.\n\nLua treats functions as “first-class” values and uses them for OOP\
    \ (object-oriented programming). Lua can call its own functions or external functions,\
    \ and it handles functions as a type. You can give a variable the function property\
    \ or create it with the `function()` method. Functions written in Lua can return\
    \ multiple results if you list them after a `return` keyword. Lua supports OOP,\
    \ but due to Lua’s size, its implementation of OOP lacks a few features. Lua uses\
    \ tables and functions for OOP rather than classes. In the same way that Python\
    \ accesses a function or variable in a class, Lua accesses it with `Table.function`\
    \ or `Table.variable`.\n\nLua can be picky when it comes to multiple assignment,\
    \ because it adjusts the number of values on the assignment. If the amount of\
    \ values is less than the list of variables, all remaining values are given the\
    \ `nil` value. If the list of values is longer than the amount of variables, Lua\
    \ silently discards them.\n\n## Object-Oriented Programming\n\nLua has some basic\
    \ OOP capabilities. The `self` parameter is an integral concept in any object-oriented\
    \ language, and it is one of the few OOP concepts that Lua has. Many object-oriented\
    \ languages tend to hide the `self` mechanism from you so that you do not have\
    \ to declare this parameter. Lua hides this parameter with the colon operator.\
    \ You also can use the colon, a function, and a table to emulate a class. Because\
    \ Lua does not have the class concept, each object defines its own behavior and\
    \ shape:\n\n```lua\nEarth = {martians = 3389}\nfunction Earth:casualties(survivors)\n\
    \  Earth.martians = Earth.martians - survivors\n  print(\"Earth is free! \"..Earth.martians..\"\
    \ martians survived!\")\nend\n\nEarth:casualties(3380)\n```\n\nThe colon in the\
    \ above example is used to add an extra parameter in the method definition. It\
    \ also adds an extra parameter in the method call. You don’t have to use the colon.\
    \ Lua programmers can define a function with the dot syntax and call it with the\
    \ colon syntax, or vice versa if they add an extra parameter:\n\n```lua\nEarth\
    \ = {martians = 3389,\ncasualties = function (self, survivors)\n  self.martians\
    \ = self.martians - survivors\n  print(\"Earth is free! \"..self.martians..\"\
    \ martians survived!\")\nend}\n\nEarth.casualties(Earth, 5380)\nEarth.martians\
    \ = 5389\nEarth:casualties(3380)\n```\n\nIn this case, the function had to be\
    \ part of the table so that it could be called via the dot or the colon syntax.\
    \ Note that I also had to give the function the `self` parameter for either calling\
    \ method to work. Although these are simple OOP examples that scratch only the\
    \ surface of OOP, you can find out about inheritance and other OOP implementations\
    \ in the Lua Reference Manual or in the book *Programming in Lua* (both are available\
    \ for free from the Lua Web site).\n\n## Show and Tell\n\nNow, let’s compare programming\
    \ in Lua to programming in Python. First, let’s write a trivia game. Here is some\
    \ simple Lua code that uses a table as a dictionary to store both the questions\
    \ and the answers:\n\n```lua\nprint(\"What's your name?\")\nname = io.read()\n\
    questions = {\n    [\"Which came first? Minix or Unix?\"] = \"Unix\",\n    [\"\
    Who created Linux?\"] = \"Linus Torvalds\",\n    [\"In what year was Linux created?\"\
    ] = \"1991\"\n}\n\ncorrect_answers = 0\nfor key, value in pairs(questions) do\n\
    \    print(key)\n    answer = io.read()\n    if answer == value then\n       \
    \ correct_answers = correct_answers + 1\n    end\nend\n\nif correct_answers ==\
    \ 0 then\n    print(\"You need to browse Wikipedia!\")\nelse\n    print(\"\\nGood\
    \ job, \"..name..\"!\")\n    print(\"Correct answers: \"..correct_answers)\nend\n\
    ```\n\nNext, let’s break it down and analyze it line by line. On the second line,\
    \ the variable `name` is given the value `io.read()`. The `io` library has many\
    \ functions that handle all sorts of input and output, but I’m using it only for\
    \ keyboard input.\n\nOn the next line is the variable `questions`. The `questions`\
    \ variable’s value is a table that I have used like a dictionary to store both\
    \ the questions and the answers. The questions are in brackets to tell Lua that\
    \ they are the table’s key.\n\nSkipping the third line, there is a `for` loop\
    \ whose function here is to use `pairs()` to find the key and the values of each\
    \ item in the table. It then needs to place the value of the key and the value\
    \ of the key’s value into the variables `key` and `value`.\n\nAfter printing the\
    \ key (which contains the question), Lua places the user’s answer through `io.read()`\
    \ into the `answer` variable and checks to see whether it equals the proper answer.\
    \ If the answer is correct, it adds 1 to the value of the `correct_answers` variable\
    \ and repeats the process until there are no more items in the table to go through.\n\
    \nNext, Lua checks to see whether users got any of the questions correct and then\
    \ prints a message telling users to learn more about UNIX (and its variants) hacker\
    \ history or congratulates users on how many questions they answered correctly.\
    \ Notice the concatenation operators on the 16th line.\n\nIn Python, the easiest\
    \ way to do the above game would be like this:\n\n```python\nname = raw_input('What's\
    \ your name?\\n')\nquestions = {\n    \"Which came first? Minix or Unix?\": \"\
    Unix\",\n    \"Who created Linux?\": \"Linus Torvalds\",\n    \"In what year was\
    \ Linux created?\": \"1991\"\n}\ncorrect_answers = 0\n\nfor key in questions:\n\
    \    print(key)\n    answer = raw_input()\n    if answer == questions[key]:\n\
    \        correct_answers += 1\n\nif correct_answers == 0:\n    print(\"You need\
    \ to browse Wikipedia!\")\nelse:\n    print(\"\\nGood job, \" + name + \"!\")\n\
    \    print(\"Correct answers: \", correct_answers)\n```\n\nYou may notice that\
    \ it's easier to get keyboard input in Python than in Lua, but dictionaries are\
    \ easier to identify and look much prettier in Lua. For loops are a little more\
    \ complex in Python than in Lua, because Python needs to know the key to be able\
    \ to get the key's value. In Lua, the `pairs()` function breaks apart the key\
    \ and its value from the dictionary table, making it much cleaner and easier to\
    \ get data from tables than in Python. As for lines of code, not counting the\
    \ many `end`s, Lua wins hands down with 13 lines of code versus 17 in Python.\
    \ Even though Lua programmers would be typing more, their code is much easier\
    \ to sift through, especially when it's thousands of lines long, because of Lua's\
    \ use of `end` rather than colons in Python.\n\nNow, how about a GUI? Is programming\
    \ a GUI in Lua the same, easier, or more difficult than in Python? Before you\
    \ try to answer that question, determine which program in the two languages will\
    \ be easier to maintain, read, and understand without comments. Here, I use the\
    \ wxGTK library for a GUI. The only hitch with wxLua is that it is an entirely\
    \ separate program. A wxLua application will not run with the regular Lua interpreter,\
    \ so you must run it with the wxLua program. Here's a GTK GUI program made with\
    \ wxLua:\n\n```lua\nframe = wx.wxFrame(wx.wxNull, wx.wxID_ANY,\n  \"wxLua App\"\
    , wx.wxDefaultPosition,\n  wx.wxSize(250, 50),\n  wx.wxDEFAULT_FRAME_STYLE)\n\n\
    frame:Show(true)\n```\n\nNow, here's the code for a program that does the same\
    \ job in GTK, but with wxPython:\n\n```python\nfrom wxPython.wx import *\nclass\
    \ Main(wxApp):\n    def OnInit(self):\n        frame = wxFrame(NULL, -1, \"wxPython\
    \ App\")\n        frame.Show(true)\n        return true\n\nMain().MainLoop()\n\
    ```\n\nThis time, Lua's lack of necessary formatting and full-fledged OOP makes\
    \ an easy job easier. Rather than create a class and function, wxLua incorporates\
    \ everything needed for this GUI application in a single system function, whereas\
    \ Python and wxPython require a class as well as a function. Also note that Lua\
    \ imports system libraries automatically. This wxLua application exercises some\
    \ of Lua's OOP features that I discussed previously. The application creates the\
    \ frame, sets the frame's name and the frame values, and then it calls the `Show()`\
    \ function from within the `wxFrame` method using the colon. You also can call\
    \ the frame with the period syntax rather than the colon:\n\n```lua\nframe.Show(frame,\
    \ true)\n```\n\n## Embedding and Extending\n\nAlthough taking a look at embedding\
    \ and extending Lua is outside the scope of this article, I touch on a few concepts\
    \ here. First, the Lua API is very straightforward. Its design eliminates the\
    \ need for manual reference counting when embedded in C code (unlike Python's\
    \ API). Like the language, Lua's C API (for embedding) is fairly minimalistic.\
    \ If you need advanced functionality, you can use a secondary library that is\
    \ primarily made up of preprocessor macros.\n\nSecond, C and C++ are not the only\
    \ languages in which Lua can be embedded. Tao.Lua provides straight .NET and Mono\
    \ bindings to Lua, and Luaj allows scripts written in Lua to manipulate Java components.\
    \ Luaj allows Java components to be accessed from Lua with the same syntax that\
    \ Lua uses for accessing its native objects. It also allows Java to use a Lua\
    \ interface so that any interface can be implemented in Lua and passed as a parameter\
    \ to any method. The method's result (when called in the Java program) is called\
    \ in Lua, and the result is sent back to Java.\n\n## Conclusion\n\nLua is a flexible,\
    \ powerful, compact language that can be used and extended in myriad situations.\
    \ Its focus on simplicity makes for easy debugging and has attracted many users.\
    \ Its simple, powerful syntax provides flexibility because of Lua's metamechanisms.\
    \ The small, fast interpreter uses fewer resources than Python, and its syntax\
    \ allows for easier code readability. Its simple C API makes embedding a breeze.\
    \ Whether you are doing data processing, GUIs, or game programming, you will find\
    \ a use for Lua.\n\nJoseph Quigley has been a Linux user for more than two years.\
    \ He enjoys fiddling with different Linux distros and exploring new programming\
    \ languages.\n\n## Resources\n\n- *Programming in Lua*: <http://www.lua.org/pil>\n\
    - *lua-users*: <http://www.lua-users.org>\n- *wxPython*: <http://www.wxpython.org>\n\
    - *wxPyWiki*: <http://wiki.wxpython.org>\n- *wxLua*: <http://wxlua.sourceforge.net>\n\
    - *Luaj*: <http://www.keplerproject.org/luaj>\n- *The Tao Framework*: <http://www.taoframework.com>\n\
    - *Lua Versus Python*: <http://www.lua-users.org/wiki/LuaVersusPython>\n"
  mdcn: "\n![](img/526fd434dcfcf1b461b94c24ea170f36_95_0.png)\n\n## 深入解析\n\n请记住，Lua\
    \ 将字符串和整数视为不同的类型：\"1\" < 2 始终为 false，而字符串是按字母顺序比较的。\n\n如果条件为 false，Lua 执行 while\
    \ 循环。Repeat-until 语句与 while 循环相反；它会循环直到条件为 true。For 循环有一些隐藏的陷阱，这可能让 Python 或 Ruby\
    \ 程序员感到烦恼。在 for 循环中创建的局部变量仅在循环内部可见。循环结束后变量就不存在了，因此如果你需要控制变量的值，必须将其值保存到另一个变量中。出于语法原因，break\
    \ 或 return 应仅作为循环中 `end`、`else` 或 `until` 之前的最后一条语句出现。\n\nLua 将函数视为“一等”值，并用于 OOP（面向对象编程）。Lua\
    \ 可以调用其自身的函数或外部函数，并将函数作为一种类型处理。你可以赋予变量函数属性，或使用 `function()` 方法创建变量。用 Lua 编写的函数如果在\
    \ `return` 关键字后列出，可以返回多个结果。Lua 支持 OOP，但由于 Lua 的体量，其 OOP 实现缺乏一些功能。Lua 使用表格和函数来进行\
    \ OOP，而不是类。就像 Python 访问类中的函数或变量一样，Lua 通过 `Table.function` 或 `Table.variable` 来访问它们。\n\
    \n在处理多重赋值时，Lua 可能很挑剔，因为它会根据调整赋值值的数量。如果值的数量少于变量列表，所有剩余的值都将被赋予 `nil` 值。如果值列表长于变量数量，Lua\
    \ 会默默地丢弃它们。\n\n## 面向对象编程\n\nLua 具有一些基本的 OOP 能力。`self` 参数是任何面向对象语言中的核心概念，也是 Lua\
    \ 拥有的少数 OOP 概念之一。许多面向对象语言倾向于向你隐藏 `self` 机制，这样你就无需声明此参数。Lua 通过冒号运算符隐藏了这个参数。你 также\
    \ 可以使用冒号、函数和表格来模拟类。由于 Lua 没有类的概念，每个对象都定义自己的行为和形状：\n\n```lua\nEarth = {martians\
    \ = 3389}\nfunction Earth:casualties(survivors)\n  Earth.martians = Earth.martians\
    \ - survivors\n  print(\"Earth is free! \"..Earth.martians..\" martians survived!\"\
    )\nend\n\nEarth:casualties(3380)\n```\n\n上述示例中的冒号用于在方法定义中添加一个额外参数。它也在方法调用中添加了一个额外参数。你并不必须使用冒号。Lua\
    \ 程序员可以使用点语法定义函数并使用冒号语法调用它，或者如果他们添加了一个额外参数，反之亦然：\n\n```lua\nEarth = {martians\
    \ = 3389,\ncasualties = function (self, survivors)\n  self.martians = self.martians\
    \ - survivors\n  print(\"Earth is free! \"..self.martians..\" martians survived!\"\
    )\nend}\n\nEarth.casualties(Earth, 5380)\nEarth.martians = 5389\nEarth:casualties(3380)\n\
    ```\n\n在这种情况下，函数必须是表格的一部分，这样才能通过点或冒号语法调用。请注意，我还必须为函数提供 `self` 参数，以便任一调用方法都能工作。尽管这些是简单的\
    \ OOP 示例，仅触及 OOP 的表面，你可以在 Lua 参考手册或《*Programming in Lua*》一书中找到关于继承和其他 OOP 实现的更多信息（两者均可在\
    \ Lua 网站免费下载）。\n\n## 展示与讲解\n\n现在，让我们比较一下在 Lua 中编程和在 Python 中编程。首先，让我们编写一个知识问答游戏。下面是一些简单的\
    \ Lua 代码，它使用表格作为字典来存储问题和答案：\n\n```lua\nprint(\"What's your name?\")\nname = io.read()\n\
    questions = {\n    [\"Which came first? Minix or Unix?\"] = \"Unix\",\n    [\"\
    Who created Linux?\"] = \"Linus Torvalds\",\n    [\"In what year was Linux created?\"\
    ] = \"1991\"\n}\n\ncorrect_answers = 0\nfor key, value in pairs(questions) do\n\
    \    print(key)\n    answer = io.read()\n    if answer == value then\n       \
    \ correct_answers = correct_answers + 1\n    end\nend\n\nif correct_answers ==\
    \ 0 then\n    print(\"You need to browse Wikipedia!\")\nelse\n    print(\"\\nGood\
    \ job, \"..name..\"!\")\n    print(\"Correct answers: \"..correct_answers)\nend\n\
    ```\n\n接下来，让我们逐行分解并分析它。在第二行中，变量 `name` 被赋值为 `io.read()`。`io` 库有许多处理各种输入和输出的函数，但我仅将其用于键盘输入。\n\
    \n下一行是变量 `questions`。`questions` 变量的值是一个表格，我将其用作字典来存储问题和答案。问题被放在括号内，以告诉 Lua 它们是表格的键。\n\
    \n跳过第三行，有一个 `for` 循环，其功能在此处是使用 `pairs()` 查找表格中每个项目的键和值。然后，它需要将键的值和键的值的值放入变量 `key`\
    \ 和 `value` 中。\n\n在打印键（其中包含问题）之后，Lua 通过 `io.read()` 将用户的回答放入 `answer` 变量，并检查它是否等于正确答案。如果答案正确，它将\
    \ `correct_answers` 变量的值加 1，并重复此过程，直到表格中没有更多项目需要遍历为止。\n\n接下来，Lua 检查用户是否答对了任何问题，然后打印一条消息，告诉用户多了解\
    \ UNIX（及其变种）的黑客历史，或者祝贺用户答对了多少题。请注意第 16 行中的连接运算符。\n\n在 Python 中，完成上述游戏的最简单方法如下：\n\
    \n```python\nname = raw_input('What's your name?\\n')\nquestions = {\n    \"Which\
    \ came first? Minix or Unix?\": \"Unix\",\n    \"Who created Linux?\": \"Linus\
    \ Torvalds\",\n    \"In what year was Linux created?\": \"1991\"\n}\ncorrect_answers\
    \ = 0\n\nfor key in questions:\n    print(key)\n    answer = raw_input()\n   \
    \ if answer == questions[key]:\n        correct_answers += 1\n\nif correct_answers\
    \ == 0:\n    print(\"You need to browse Wikipedia!\")\nelse:\n    print(\"\\nGood\
    \ job, \" + name + \"!\")\n    print(\"Correct answers: \", correct_answers)\n\
    ```\n\n你可能会注意到，在 Python 中获取键盘输入比在 Lua 中更容易，但字典在 Lua 中更容易识别，而且看起来漂亮得多。Python 中的\
    \ for 循环比 Lua 中的稍复杂一些，因为 Python 需要知道键才能获取键的值。在 Lua 中，`pairs()` 函数将字典表格中的键及其值分解，使得从表格中获取数据比在\
    \ Python 中更简洁、更容易。就代码行数而言，如果不算众多的 `end`，Lua 以 13 行代码胜过 Python 的 17 行，优势明显。尽管 Lua\
    \ 程序员输入的内容更多，但由于 Lua 使用 `end` 而不是 Python 中的冒号，他们的代码更容易梳理，尤其是在代码长达数千行时。\n\n那么，GUI\
    \ 呢？在 Lua 中编程 GUI 与在 Python 中相比，是相同、更容易还是更困难？在你试图回答这个问题之前，先确定哪种语言的程序在没有注释的情况下更容易维护、阅读和理解。在这里，我使用\
    \ wxGTK 库来构建 GUI。wxLua 唯一的缺点是它是一个完全独立的程序。wxLua 应用程序不会在常规 Lua 解释器中运行，因此你必须使用 wxLua\
    \ 程序来运行它。这是一个使用 wxLua 制作的 GTK GUI 程序：\n\n```lua\nframe = wx.wxFrame(wx.wxNull,\
    \ wx.wxID_ANY,\n  \"wxLua App\", wx.wxDefaultPosition,\n  wx.wxSize(250, 50),\n\
    \  wx.wxDEFAULT_FRAME_STYLE)\n\nframe:Show(true)\n```\n\n现在，以下是执行相同任务但使用 wxPython\
    \ 的代码：\n\n```python\nfrom wxPython.wx import *\nclass Main(wxApp):\n    def OnInit(self):\n\
    \        frame = wxFrame(NULL, -1, \"wxPython App\")\n        frame.Show(true)\n\
    \        return true\n\nMain().MainLoop()\n```\n\n这一次，Lua 缺乏必要的格式化和完整的 OOP 使得简单的工作变得更容易。wxLua\
    \ 无需创建类和函数，而是将所有这个 GUI 应用程序所需的内容整合在单个系统函数中，而 Python 和 wxPython 则需要类以及函数。还要注意，Lua\
    \ 自动导入系统库。此 wxLua 应用程序练习了我之前讨论的一些 Lua OOP 功能。该应用程序创建框架，设置框架名称和框架值，然后使用冒号在 `wxFrame`\
    \ 方法内部调用 `Show()` 函数。你也可以使用点语法而不是冒号来调用框架：\n\n```lua\nframe.Show(frame, true)\n\
    ```\n\n## 嵌入与扩展\n\n虽然本文范围之外的嵌入式和扩展 Lua 不是重点，但我在此触及了一些概念。首先，Lua API 非常直观。其设计消除了嵌入\
    \ C 代码时手动引用计数的需求（不同于 Python 的 API）。像语言本身一样，Lua 的 C API（用于嵌入）相当极简主义。如果你需要高级功能，可以使用主要由预处理器宏组成的二级库。\n\
    \n其次，C 和 C++ 并不是 Lua 可以嵌入的唯一语言。Tao.Lua 为 Lua 提供了直接的 .NET 和 Mono 绑定，而 Luaj 允许用\
    \ Lua 编写的脚本操纵 Java 组件。Luaj 允许 Java 组件使用与 Lua 访问其原生对象相同的语法从 Lua 访问。它还允许 Java 使用\
    \ Lua 接口，这样任何接口都可以在 Lua 中实现并作为参数传递给任何方法。方法的结果（在 Java 程序中调用时）在 Lua 中被调用，并且结果被发送回\
    \ Java。\n\n## 结论\n\nLua 是一种灵活、强大、紧凑的语言，可以在无数情况下使用和扩展。其对简单性的关注使得调试容易，并吸引了许多用户。其简单而强大的语法由于\
    \ Lua 的元机制而提供了灵活性。小而快的解释器比 Python 使用更少的资源，其语法允许更容易的代码可读性。其简单的 C API 使嵌入变得轻而易举。无论你是进行数据处理、GUI\
    \ 还是游戏编程，你都会发现 Lua 的用途。\n\nJoseph Quigley 使用 Linux 已有两年多时间。他喜欢摆弄不同的 Linux 发行版并探索新的编程语言。\n\
    \n## 资源\n\n- *Programming in Lua*： <http://www.lua.org/pil>\n- *lua-users*： <http://www.lua-users.org>\n\
    - *wxPython*： <http://www.wxpython.org>\n- *wxPyWiki*： <http://wiki.wxpython.org>\n\
    - *wxLua*： <http://wxlua.sourceforge.net>\n- *Luaj*： <http://www.keplerproject.org/luaj>\n\
    - *The Tao Framework*： <http://www.taoframework.com>\n- *Lua Versus Python*： <http://www.lua-users.org/wiki/LuaVersusPython>\n\
    \n"
