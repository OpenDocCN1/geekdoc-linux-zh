    \ 的报道，非常令人鼓舞。）\n\n与此同时，设备驱动程序仍在不断堆积。如果我们抽取整个 LAMP 栈，它的长度将超过 145,000 个字母。今天，构建需要计算和网络连接的“解决方案”而不利用如此多的免费和开放建筑材料，其实相当困难。还有一个巨大的需求市场，需要那些不仅知道如何构建，而且知道如何改进这些材料的聪明技术人员。\n\
    \n然而，在过去两年中，Google 上 Linux 相关查询的数量呈下降趋势。尽管新闻量保持稳定，但目前的查询量约为 2003 年底时的一半。（那是 Google\
    \ 能追溯到的最早时间，它不给出精确数字。）\n\n这就是为什么今天为 Linux 而战，就像为地质学、植物学或元素周期表而战一样。在一些不太理性的范式周围可能仍有一些顽固分子，但那有什么意义？Linux\
    \ 革命已经变成了 Linux 建制派。我们赢了。现在呢？好问题。（那是你不知道答案时会说的话。好问题。）在《Linux Journal》，我们和其他杂志一样喜欢好的事业。而且，我们想以我们期望任何天生战士都会表现出的方式来庆祝\
    \ Linux 的胜利：通过寻找新的对手。\n\n对手自然有趣。这就是故事理论所说的。对于故事，你只需要三个元素：1) 一个主角——你关心并能认同的人或事物；2)\
    \ 主角与之斗争的问题；以及 3) 向解决迈进的过程。如果你的主角不有趣，问题没有意义，或者没有向最终状态迈进的动力，那你就没有故事。这就是为什么体育和战争故事如此引人入胜。\n\
    \n那么，我们的故事，或者故事，会是什么？我会提出四个，剩下的由你来定。\n\n## 公民 vs. 运营商\n\n自 20 世纪 90 年代中期 Apache\
    \ 成为标准 Web 服务器以来，Linux 和网络一直在共同成长。然而，当 Linux 蓬勃发展时，网络正在陷入运营商的孤岛。今天的网络用户并不比 1999\
    \ 年的个人电脑用户被微软 Windows 束缚得更少。\n\n区别在于，每个运营商都是自己的微软，每项网络服务都像 Windows 一样功能不全，而客户的选择（至少在美国）是在\
    \ Twedle-telco 和 Twedle-cableco 之间——或者只有其中之一。这些运营商对客户看起来仍然相对不错，因为它们提供的连接速度（标记为“宽带”或“高速”）比拨号快得多。太容易忘记的是，拨号是广泛打开网络访问大门的方式，使其几乎对每个人可用——而且这是尽管有电话公司，而不是因为它们。如果没有最初的拨号\
    \ ISP——Little Garden、Paxin、Batnet、Earthlink 甚至 AOL——网络仍然只属于大学、政府和大型企业。\n\n现在客户认为网络是位于电话或有线电视服务之上的灰色层。他们没有意识到，网络才是真正的基础公用事业，它可以承载任何你喜欢的“灰色”服务，包括电话和电视。几乎没人谈论广泛开放的互联网使所有可能实现的企业，主要因为有线公司和电信公司支持消费并阻碍生产。“网络中立性”的战斗是一个红鲱鱼。大多数“高速互联网”客户从未体验过真正的中立服务。相反，他们享受的是不对称的带宽和端口封锁，从未品尝过他们一直缺失的东西。世界其他一些地方的情况要好得多。例如，日本和韩国以高带宽和低价格而闻名。宽带普及率最高的国家是丹麦，爱沙尼亚也不远\n\
    \n"
