    \ `>>>` 变为 `...`，以表明我们位于定义内部。函数由所有这些行组成，其缩进级别位于 `def` 行下方。\n\n因此，在其他编程语言使用花括号或\
    \ `begin`/`end` 关键词的地方，Python 使用缩进。其理念是，如果你是一名优秀的程序员，你本来就会进行缩进，所以我们将利用这种缩进，同时使你成为一名优秀的程序员。确实，这是一个有争议的问题；我一开始并不喜欢它，但我学会了与之共存。\n\
