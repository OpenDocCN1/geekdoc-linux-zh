    今年早些时候，Dell 创建了一个类似 Digg 的网站，名为 Dell | IdeaStorm（“你的想法主导之地”）。该网站的理念是让读者提交对公司的想法，然后由其他读者进行投票和评论。在标题标志旁边运行着提示语，例如“科技公司如何应对气候变化？”（位于“点击此处阅读
