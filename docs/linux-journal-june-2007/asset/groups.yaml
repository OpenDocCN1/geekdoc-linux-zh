    \    }\n    } // 将其拆分为部分以简化生活\n    $email_array = explode(\"@\", $email);\n  \
    \  $local_array = explode(\"\", $email_array[0]);\n    for ($i = 0; $i < sizeof($local_array);\
    \ $i++) { // 如果\n        if (!ereg(\"^[\\\"[A-Za-z0-9] $&x; *+$*\\\" [\\\"]-[A-Za-z0-9]\
