    What then changed around about 2003, was it became obvious that Java had a huge
    international community. It actually had a


    huge Open Source community, developing on top of the Java platform, using open-source
    tools like Spring, Hibernate, _JBoss_ and so on. And, I think it gradually became
    more and more obvious to people that this community probably was no longer as
    vulnerable to monopolisation as it had been. And, that meant it was less and less
