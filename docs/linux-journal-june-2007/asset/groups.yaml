    —Eduardo


    ## Blast from the Past


    While cleaning out my desk, I found my Winter 1996 Linux Internet Archive set.
    Linux that ran on 4MB of RAM, MFM drives, EISA buses, Gravs Ultrasond cards—it
    brings a tear to one’s eye.


    Anyway, thanks for the informative articles. As a longtime reader (someday I will
    get a subscription) and fan! Keep up the good work!


    ![](img/526fd434dcfcf1b461b94c24ea170f36_11_0.png)


    —John Harper


    ## Re: the “Someone Else May Have to Decipher Your Code” Letter in April 2007
    Issue


    In his letter titled "Someone Else May Have to Decipher Your Code Someday", Michael
    C. Tiernan suggested the use of temp files instead of pipes for readability, instead
    of thinking that pipes can be as easy to read as code used in temporary files.


    But, when using temporary files in a production environment, it should be done
    right, so the lines:


    ```

    tmp1=/tmp/tmp.1.$$

    tmp2=/tmp/tmp.2.$$

    tmp3=/tmp/tmp.3.$$

    tmp4=/tmp/tmp.4.$$

    ```


    should be replaced by:


    ```

    tmp1=`mktemp`

    tmp2=`mktemp`

    tmp3=`mktemp`

    tmp4=`mktemp`

    ```


    or:


    ```

    tmp1=`mktemp /tmp/tmp.1.XXXXXXX`

    tmp2=`mktemp /tmp/tmp.2.XXXXXXX`

    tmp3=`mktemp /tmp/tmp.3.XXXXXXX`

    tmp4=`mktemp /tmp/tmp.4.XXXXXXX`

    ```


    For security reasons. First, mktemp ensures the filenames are unused, and the
    files generated do have the access rights set to ensure that only the owner can
    read the content.


    —Berthold Hollmann


    ## Miniature OpenGL Development System


    I just thought you might want to know about this project: the myOS—Miniature OpenGL
    development system. It is a minimalistic OpenGL-capable GNU/Linux-based system
    without X. It is a bare-bones Linux system, stripped down of everything but the
    core necessary files to compile and run OpenGL/UC code. It has a simplified directory
    structure and cleaned up internal cross-referencing. It starts up with, and in
    total has, only a single script (one.xthost.info/zelko/opengl.html).


    —ZeaATShuttle


    Did you know Microsoft owns the patent to OpenGL?—*Ed.*


