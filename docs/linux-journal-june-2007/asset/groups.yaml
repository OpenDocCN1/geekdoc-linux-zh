    \ [\\\"], } [\\\"], }\n                    \\\" [\\\" [\\\"@] [\\\"@] *?\\\",\
    \ $local_array[$i])) {\n            return false;\n        }\n    }\n    } //\
    \ 检查域是否为 IP。如果不是，\n    // 它应该是有效的域名\n    if (!ereg(\"^[\\\" [\\\" [\\\"@] [\\\"\
