    的游戏，*DEFCON*。*DEFCON* 是一款基于全球热核战争主题的在线、竞争性多人策略游戏。该游戏灵感源自 1983 年的经典传奇 *Wargames*，“唤起人们对冷战时期围绕其产生的紧张、偏执和多疑氛围的共鸣”。玩家扮演一名隐藏在地堡下的将军，其任务是在消灭敌方平民人口的同时，阻止敌方实施报复的能力。*PC
    Gamer UK* 将 *DEFCON* 描述为“纯粹、深邃、令人痛彻心扉的乐趣”。Windows 版本已经可用。Introvension 应当因拥有最棒的启动网址而获奖！


