    # Today, Jack configured a switch in London, rebooted servers in Sydney, and watched
    his team score the winning run in Cincinnati.


    With Avocent data center management solutions, the world can finally revolve around
    you. Avocent puts secure access and control right at your fingertips – from multi-platform
    servers to network routers, remote data centers to field offices. You can manage
    everything from a single screen, from virtually anywhere. This means you can troubleshoot,
    reboot or upgrade your data center devices – just as if you were sitting in front
    of them. Avocent simplifies your workday. What you do with the extra time is up
    to you.


    For information on improving data center performance, visit **www.avocent.com/control**


