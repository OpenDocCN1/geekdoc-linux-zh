  md: "www.informationweek.com):\n\nDell launched a Linux Web survey this week, moving\
    \ it a bit closer to reintroducing the open-source operating system as a factory-installed\
    \ option for home or office use.\n\nThe survey, which was posted Tuesday and runs\
    \ through March 23, asks a variety of questions, including which Dell system respondents\
    \ would like to see with Linux, what kind of computing chores they would use the\
    \ machine for, what type of software support they would like, and the Linux distribution\
    \ they favor.\n\nIn launching the survey, Matt Dornsch, Linux software architect\
    \ for Dell, said in the company’s official blog that Dell has been moved to action\
    \ by the more than 110,000 requests for Linux computers on the company’s on-line\
    \ customer sounding-board IdeaStorm.\n\nSo, for those of us who love to work outside\
    \ the Windows world, this kind of movement comes at a very important moment and\
    \ shows to the \"monolithic, one-way\" CEOs and \"Masters of the universe\" that\
    \ intelligent life exists here! Keep up the great work there!\n\n**~~Eduardo~~**\n\
    \n# **Blast from the Past**\n\nWhile cleaning out my desk, I found my Winter 1996\
    \ Linux Internet Archive set. Linux that ran on 4MB of RAM, MFM drives, EISA buses,\
    \ Gravs Ultrasond cards—it brings a tear to one’s eye.\n\nAnyway, thanks for the\
    \ informative articles. As a longtime reader (someday I will get a subscription)\
    \ and fan! Keep up the good work!\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_11_0.png)\n\
    \n**~~John Harper~~**\n\n# **Re: the “Someone Else May Have to Decipher Your Code”\
    \ Letter in April 2007 Issue**\n\nIn his letter titled \"Someone Else May Have\
    \ to Decipher Your Code Someday\", Michael C. Tiernan suggested the use of temp\
    \ files instead of pipes for readability, instead of thinking that pipes can be\
    \ as easy to read as code used in temporary files.\n\nBut, when using temporary\
    \ files in a production environment, it should be done right, so the lines:\n\n\
    ```\n    tmp1=/tmp/tmp.1.$$\n    tmp2=/tmp/tmp.2.$$\n    tmp3=/tmp/tmp.3.$$\n\
    \    tmp4=/tmp/tmp.4.$$\n```\n\nshould be replaced by:\n\n```\n    tmp1=`mktemp`\n\
    \    tmp2=`mktemp`\n    tmp3=`mktemp`\n    tmp4=`mktemp`\n```\n\nor:\n\n```\n\
    \    tmp1=`mktemp /tmp/tmp.1.XXXXXXX`\n    tmp2=`mktemp /tmp/tmp.2.XXXXXXX`\n\
    \    tmp3=`mktemp /tmp/tmp.3.XXXXXXX`\n    tmp4=`mktemp /tmp/tmp.4.XXXXXXX`\n\
    ```\n\nFor security reasons. First, mktemp ensures the filenames are unused, and\
    \ the files generated do have the access rights set to ensure that only the owner\
    \ can read the content.\n\n**~~Berthold Hollmann~~**\n\n# **Miniature OpenGL Development\
    \ System**\n\nI just thought you might want to know about this project: the myOS—Miniature\
    \ OpenGL development system. It is a minimalistic OpenGL-capable GNU/Linux-based\
    \ system without X. It is a bare-bones Linux system, stripped down of everything\
    \ but the core necessary files to compile and run OpenGG/UC code. It has a simplified\
    \ directory structure and cleaned up internal cross-referencing. It starts up\
    \ with, and in total has, only a single script (one.xthost.info/zelko/opengl.html).\n\
    \n**~~ZeaATShuttle~~**\n\nDid you know Microsoft owns the patent to OpenGL?—*Ed.*\n\
    \n![](img/526fd434dcfcf1b461b94c24ea170f36_11_1.png)\n\n\n\n# **MAGAZINE**\n\n\
