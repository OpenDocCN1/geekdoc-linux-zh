  md: "you'll have to add *blog.* before the name of the class, *Post*, because now\
    \ the class is in the module *blog*. See Figure 2 for further reference.\n\nYou\
    \ can, of course, do the same without Emacs. But for that, you need to learn how\
    \ Python modules and packages are made. Set *PYTHON_PATH*, an environment variable,\
    \ accordingly, and use the built-in function *reload*. With Emacs, you'll find\
    \ iterating between coding and testing the code to be very fast. This speed can\
    \ improve your performance and make programming more fun. In fact, Lisp programmers\
    \ have been advocating this way of working for more than two decades.\n\n# Special\
    \ Methods\n\nHaving to create an object and then set each of its members is not\
    \ pleasant. It takes a lot of lines and is very error-prone—did I remember to\
    \ set the tags? There's a better way to do it—using the initialization method.\n\
    \nThis special method is called *__init__* and the parameters you define it to\
    \ take have to be passed in the creation of the object. A possible initialization\
    \ method would be:\n\n```\nclass Post(object):\n    def __init__(self, title,\
    \ body):\n        self.set_title(title)\n        self.set_body(body)\n```\n\n\
    Simply add the *__init__* definition to the file and reload it. We now can, and\
    \ have to, set the title and body at initialization time:\n\n>>> cool = blog.Post('Cool',\
    \ 'Python is cool')\n>>> cool.get_title()\n'Cool'\n>>> cool.get_body()\n'Python\
    \ is cool'\n>>>\n\nHint: to retrieve previous lines in the REPL inside Emacs use\
    \ Alt-P.\nThere are other special methods. Remember how ugly it was to evaluate\
    \ a Post itself? Let me remind you:\n\n>>> cool\n<blog.Post object at 0xb7c7e9ac>\n\
    \nWe can solve that. There's another special method called *__repr__* which is\
    \ used to retrieve that string. Inside the Post class add:\n\n```\ndef __repr__(self):\n\
    \    return \"Blog Post: '%s' % self.get_title()\"\n```\n\nReload the file, the\
    \ same way you loaded it previously, and evaluate a post:\n\n>>> ## working on\
    \ region in file /usr/tmp/python...\n>>> cool\n<blog.Post object at 0xb7c7e9ac>\n\
    >>>\n\nOops! That's not what we wanted. The problem here is that the cool object\
    \ was created with an older version of the Post class, so it doesn't have the\
    \ new method. That is a very common mistake, and not being prepared for it can\
    \ cause a lot of headaches. But, simply re-create the object, and you are set:\n\
    \n>>> ## working on region in file /usr/tmp/python...\n>>> cool = blog.Post('Cool',\
    \ 'Python is cool')\n>>> cool\nBlog Post: Cool\n>>>\n\nThat's better.\n\n# What\
    \ Now?\n\nEasy—wait for the next issue of Linux Journal for Part II of this tutorial.\
    \ If you really want something to do now, start learning Emacs.\n\nJosé P. E.\
    \ \"Pupeno\" Fernández has been programming since...at what age is a child capable\
    \ of string in a chair and reaching a keyboard? He has experimented with more\
    \ languages than can be listed on this page. His Web site is at pupeno.com, and\
    \ he always can be reached, unless you are a spammer, at pupeno@pupeno.com.\n\n\
    ![](img/526fd434dcfcf1b461b94c24ea170f36_57_0.png)\n\n# Resources\n\n+   * Python:\
    \ **python.org**\n* Python Download: **python.org/download**\n* Python 2.4.3:\
    \ **www.python.org/ftp/python/2.4.3/Python-2.4.3.tgz**"
