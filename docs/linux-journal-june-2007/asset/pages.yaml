    The real-time computing specialist, Concurrent, released three new products in
    April 2007, namely, its RedHawk Linux 4.2, NightStar Tools 4.1 and SIMulation
    Workbench. First, the new release of RedHawk, Concurrent''s real-time Linux OS,
    features a 2.6.18.8 Linux kernel with many of Ingo Molnar''s accepted real-time
    patches, performance and stability enhancements, support for the latest Intel
    quad-core processors and 32/64-bit OSes on AMD Opteron processors. Second, NightStar
    Tools 4.1, an integrated toolset for developing time-critical applications, adds
    an enhanced Qt-based GUI, an application illumination feature and tuning enhancements.
    Finally, SIMulation Workbench is a new simulation software product to simplify
    real-time modeling, providing a complete framework to develop and execute real-time
    hardware-in-the-loop simulations.


