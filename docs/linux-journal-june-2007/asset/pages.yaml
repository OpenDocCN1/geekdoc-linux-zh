    # ### Tweaking Extensions


    The Addon Creator conveniently hides the technical part of the process, which
    is good if you don''t want to spend time doing the donkey work manually. This
    is, however, less useful if you want to gain a better understanding of what makes
    extensions tick—not only to satisfy your curiosity, but also to be able to troubleshoot
    your extensions and tweak them without running the Addon Creator every single
    time.


    If you look inside the zip package, you will notice that it contains the familiar
    META-INF folder, a folder with the macro files and the addon.xcu file (Listing
    2). The latter is the key element of the extension, as it contains all the configuration
    data. The addon.xcu is based on XML, and even if you have only a basic knowledge
    of XML, you easily can figure out how it works simply by looking at its contents.


    The XML file contains a number of nodes, and each node has properties, which,
    in turn, have values. For example, the top node <node oor:name="AddOnMenu"> has
    multiple properties, such as <prop oor:name="Title" oor:type="xs:string">, that
    have a value containing the extension''s menu title—value>lorem ipsum</value>.
