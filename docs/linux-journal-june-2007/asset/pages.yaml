  md: "# COLUMNS\n\n# WORK THE SHELL\n\nNow, let's look at how to make the script\
    \ even smarter:\n\n```\n```\nif [ ! -z \"$height\" ] ; then\n  if [ $height -gt\
    \ $width ] ; then\n    dimensionLabel=\"height\"\n  else\n    dimensionLabel=\"\
    width\"\n  fi\n```\n\n```\n\nCan you see what I've done here? This lets us figure\
    \ out which of the two dimensions of the graphic is larger and then set the dimensionlabel\
    \ to that particular dimension. Here's the result:\n\n```\n```\necho \"<img src=$name\
    \ $dimensionLabel=$size />\"\n```\n\n```\n\nwhere I'll set size to the desired\
    \ thumbnail size—75 in our example script.\n\nI'm also going to add a few counters\
    \ so we can summarize images displayed versus total files displayed at the end.\
    \ Just because it's, uh, interesting, right? Here's the latest version of the\
    \ loop, and as you might expect, it's getting more complicated as it becomes more\
    \ sophisticated:\n\n```\n```\nfor name in *\ndo\nif [ ! -z \"$(file -b $name|grep\
    \ \"image data\")\" ]\nthen\n  imgcount=$(( $imgcount + 1 ))\n  figuresize $name\n\
    \  if [ ! -z \"$height\" ] ; then\n    if [ $height -gt $width ] ; then\n    \
    \  dimensionLabel=\"height\"\n    else\n      dimensionLabel=\"width\"\n    fi\n\
    \    echo \"<a href=$name><img src=$name border=0\"\n    echo \" alt=$name $dimensionLabel=$size\"\
    \n    echo \" align=\"absmiddle\" /></a>\"\n  else\n    echo \"<a href=$name><img\
    \ src=$name border=0\"\n    echo \" alt=$name height=$size\"\n    echo \" align=\"\
    absmiddle\" /></a>\"\n    echo \"$name</a>\"\n  fi\nelse\n  echo \"<a href=$name>$name</a><br\
    \ />\nfi\necho \"<hr />\"\ntotcount=$(( $totcount + 1 ))\ndone\n```\n\n```\n\n\
    ![](img/526fd434dcfcf1b461b94c24ea170f36_31_0.png)\n\nFigure 2. More Attractive\
