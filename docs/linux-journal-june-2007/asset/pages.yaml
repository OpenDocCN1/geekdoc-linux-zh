    \ total.</p>\"\n```\n\n```\n\nThe resultant output, which is hopefully more attractive,\
    \ is shown in Figure 2.\n\nNow that we can normalize these thumbnails in the script\
    \ (at least for non-JPEG images, due to a limitation in the file command), the\
