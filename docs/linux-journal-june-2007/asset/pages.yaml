- pgno: 33
  md: '# # Languages—Some Dead and Some Still Kicking


    JON "MADDOG" HALL


    ## There’s more to programming than Java.


    “maddog,” rang out the voice that I knew very well. It belonged to one of my young
    friends, Eduardo. “Why did you name your boat Agape? Is it because the boat is
    wide open?” I stopped sanding my little sloop and faced my young friend. “No,
    the word is not English, but Latin. It is not meant to rhyme with a small fruit
    that is used in wine, but to speak of the highest form of love.” Eduardo looked
    at me a moment and said, “I did not know that you spoke any languages other than
    English.” “For the most part, I do not”, I answered. “I studied Latin and French
    in grade school many decades ago, but by the time I understood how valuable it
    was to know multiple languages, most of that training had slipped away. Yet, having
    studied Latin and French does come in handy from time to time, as I sometimes
    find that forgotten training to understand new words both in foreign languages
    and our native English. Now, the languages I study are mostly computer languages.”
    “That is another thing”, said Eduardo. “Why are there so many languages when all
    you really need is Java?” I put down my sanding block, leaned up against the Agape
    and thought carefully for a little while.


    FORTRAN was the first computer language I ever learned. It was in 1969, and I
    learned FORTRAN by reading a book called Programming the IBM 1130 in FORTRAN and
    practicing on an IBM 1130 computer system that had 4,000 words of main memory
    and a card reader and punch. The system also had a chain printer (you probably
    do not want to know what that was) and a pen plotter. Notice that the name of
    the language was FORTRAN, in all capital letters. That is how we wrote it at that
    day, for it stood for FORmula TRANslator, just like COBOL stood for Common Business
    Oriented Language. FORTRAN was for engineers and scientists, and COBOL was for
    business people. Both languages did their jobs fairly well.


    Because I was an engineering student and a co-op for the Western Electric Corporation
    (a member of the Bell System), I learned FORTRAN. Somewhere along the line, marketing
    people decided that people did not like all capital letters in names, so the language
    became called Fortran. Through the years, FORTRAN (which started in the early
    1950s) became FORTRAN II, FORTRAN III, FORTRAN IV and then started to use names
    related to the years that it was updated. Today, work is being done for a definition
    for Fortran 2008. Fortran is a good example of a language (and not just a name)
    that changed to meet the needs of the time.


    After returning to Drexel Institute of Technology (now Drexel University) from
    my co-op period, I started seeking out more of those devices known as computers.
    I found several Digital PDP-8 mini-computers in a computer lab of the Electrical
    Engineering Department. Although these systems had a small language that was FORTRAN-like,
    called Focal, the PDP-8 mini-computers at Drexel were mostly programmed in assembly
    and/or machine language, the ones and zeros that the machine used.


    I was given some books on how to program the PDP-8 in machine language, and I
    taught myself how to program using the most fundamental language of the computer.
    Fortunately for me, the machine language of the PDP-8 was a very simple one, having
    only eight basic instructions and one main register that acted as an “accumulator”.
    Each instruction was the same length and matched the word size of 12 bits, so
    the PDP-8 was simple, though tedious, to program. The PDP-8 could not subtract
    (much less multiply or divide), so you had to add the two’s complement of the
    subtrahend in order to subtract.


    The processors had switches and lights on the front panel, and by toggling these
    switches you could input the program directly into the memory of the system. More
    important, you could step through your program one machine language instruction
    at a time, seeing the results of each instruction on the accumulator of the machine
    and in the program counter (also designated by lights on the console).


    Most people did not enter their entire program through the switches, of course;
    they used an ASR-33 Teletype to enter the source code of the assembly languages
    into an editor, punched out a source-code paper tape, input that tape into an
    assembler and (finally) got an object-level tape punched that would contain the
    1s and 0s to fed into the computer.


    One turnaround of your program typically took 45 minutes at a minimum. It took
    five minutes to read in the editor (paper tape). Next, you typed in your program,
    did a few edits and punched out your program onto new paper tape. Then, you read
    in the three-pass assembler (15 minutes of paper-tape reading), read in your source-code
    program (assuming your paper tape did not rip) and punched out the binary (paper)
    tape that contained your program.


    Finally, you read your binary tape into the memory of the computer, watched while
    the program probably over-wrote itself and everything else in real memory, and
    then you started the whole process over again'
