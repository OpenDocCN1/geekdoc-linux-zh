  md: "# # Thread Strategies\n\nThere are several ways to distribute the database\
    \ load to separate threads of execution. Fortunately, all of them share the same\
    \ characteristics when it comes to the details of creating and using a database\
    \ connection properly. The primary consideration is to use a database connection\
    \ only within the thread that created it. For regular synchronous applications,\
    \ the default behavior is fine. The QSqlDatabase::addDatabase() static function\
    \ creates a database connection within the context of the application's main UI\
    \ thread. Queries executed within this same thread will then cause blocking behavior.\
    \ This is to be expected.\n\nIn order to run queries in parallel with the main\
    \ UI thread, so that they do not interrupt the main event processing loop, a database\
    \ connection must be established in the thread in which the query executes, which\
    \ should be separate from the main UI thread. However you structure the threading\
    \ in your application, your design must be able to establish a connection within\
    \ the context of each thread that will be performing database work.\n\nFor example,\
    \ creating a thread pool in which a few threads handle the load of querying the\
    \ database in a round-robin fashion (without the overhead of creating and destroying\
    \ threads all the time) will push the time-consuming work outside the main event\
    \ loop. Or, depending on the needs of your application, you simply can spawn threads\
    \ on an as-needed basis to perform database work. In either case, you must create\
    \ a connection per thread.\n\nThere is a further limitation (imposed by most of\
    \ the underlying database-specific libraries used by Qt). As a general rule, connections\
    \ cannot be shared by multiple threads. This means you cannot simply create a\
    \ pool of connections on startup and hand them out to various threads as needed.\
    \ Instead, each thread must establish and maintain its own connection, within\
    \ its own context. To do this you are confined, and probably disastrous. Multiple\
    \ separate connections can be established in each thread by using the name parameter\
    \ of the QSqlDatabase::addDatabase() static function, as shown in Listing 1.\n\
    \nIn Listing 1, the thread objects establish two different database connections.\
    \ Each connection is named separately, so that QSqlDatabase can maintain them\
    \ properly in its internal list. And, most important, each connection is established\
    \ within the separate thread of execution of each object—the run() method is invoked\
    \ by QThread::start() once the new thread of execution is launched. The mechanism\
    \ provided by QSqlDatabase to create new connections is thread-safe. Listing 2\
    \ shows another example of a more generic approach.\n\nThe pseudo-code in Listing\
    \ 2 creates and starts two worker threads. Each thread establishes a named connection\
    \ to the database and waits for work to do. Each thread always will deal only\
    \ with its\n\n```\nListing 1. Create two instances of QThread, one for queries,\
    \ another for updates.\n\nclass QueryThread : public QThread\n{\n    public:\n\
    \        QueryThread( QObject* parent = 0 )\n        {\n            //...\n  \
    \      }\n        void run()\n        {\n            QSqlDatabase db = QSqlDatabase::addDatabase(\n\
    \                \"QPSQL\", \"querythread\" );\n            // use 'db' here\n\
    \        }\n};\n\nclass UpdateThread : public QThread\n{\n    public:\n      \
    \  UpdateThread( QObject* parent = 0 )\n        {\n            //...\n       \
    \ }\n        void run()\n        {\n            QSqlDatabase db = QSqlDatabase::addDatabase(\n\
    \                \"QPSQL\", \"updatethread\" );\n            // use 'db' here\n\
    \        }\n};\n```\n\n```\nListing 2. A More Generic Approach with a Single Instance\
    \ of QThread Used Twice\n\nclass QueryThread : public QThread\n{\n    public:\n\
    \        QueryThread( const QString name )\n            : m_connectionName(name)\n\
    \        {\n            //...\n        }\n        void run()\n        {\n    \
    \        QSqlDatabase db = QSqlDatabase::addDatabase(\"QPSQL\", m_connectionName\
    \ );\n            //...\n            db.open();\n            forever\n       \
    \     {\n                // wait for work\n                // and then execute\
    \ it...\n            }\n        }\n    }\n\n    void main()\n    {\n        QApplication\
    \ app(...);\n        MainWindow mw;\n        QueryThread db1(\"queries\");\n \
    \       db1.start();\n        QueryThread db2(\"updates\")\n        db2.start();\n\
    \        //...\n        mw.show();\n        app.exec();\n    }\n```"
