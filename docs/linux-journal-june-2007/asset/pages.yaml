  md: 'fields of an object are, in fact, simply nothing more than columns in a table
    (or attributes in a relation), to use his more formal terminology). That also
    implies that inheritance is nothing more than a simple association between tables,
    somehow silently joined together in a manner that he doesn''t seem to specify
    clearly (at least, not in his eighth edition of Introduction to Database Systems).
    While I''m not going to try to debate relational theory with him, I suspect that
    his views of the object world are somewhat questioned and therefore not entirely
    accurate.


    **LJ:** Some have questioned why you drew the comparison between this technical
    problem and the Vietnam War, and in fact suggested that it''s an entirely inappropriate
    comparison. What are your thoughts on that?


    **TED:** I have two reactions, really. First of all, to all those people who are
    offended that someone would draw an analogy to Vietnam that wasn''t somehow rooted
    in war or political conflict, I''m sorry that they''re offended, but American
    involvement in Vietnam ended more than 30 years ago, and it''s time that we as
    a nation grow up and stop nurturing old wounds. Yes, bad things happened, and
    some of them happened to us, and some of them happened because of us. It''s high
    time we start looking at Vietnam critically, instead of in a knee-jerk emotional
    reaction mode.


    Second, Vietnam is in many ways a perfect analogy to what goes on with many object/relational-mapping
    tools, not just because Vietnam is the synonym to “quagmire” these days, but because,
    according to Robert McNamara''s recently published memoirs, American leadership
    knew that they were getting into a potential quagmire, and thought they could
    manage it somehow. To many, Vietnam was the definition of unclear goals, but McNamara''s
    memoirs make it clear that America was, in fact, trying to “win” the war, which
    meant winning “the hearts and minds” of the Vietnamese people. It just wasn''t
    clear how they could accomplish that with the tools available to them. O/R-M is
    a similar situation: it''s clear that we want to have happen, it''s just not clear
    how we can make it work.


    **LJ:** I got the impression last time we spoke that db40 users were well aware
    of this impedance mismatch, and that''s why they contributed code and requests
    that addressed this very problem rather than pressuring you to embrace the SQL
    model. Do I read that right?


    **CHRISTOF:** Yes, what happened was that some managers wanted to see a checkmark
    next to “SQL” in their evaluation spreadsheets. However, OO developers don''t
    want SQL to access their data, unless they have to or are unaware of the alternatives.
    In fact, SQL is a DBA language, not a developer language. Our developers speak
    Java and .NET. So, db40 has “Native Queries”, the ability to query the database
    with native Java or .NET semantics, a type-safe and 100% OO approach, for instance.


    **LJ:** And what about reporting, for instance?


    **CHRISTOF:** If you run a distributed application with db4o, you usually don''t
    need reporting (do you run Crystal Reports in your car?). If you still need to
    link your data at some stage to your back-end RDBMS, then you can use the db40
    Replication Sync (dRS), which uses Hibernate to sync persisted objects into a
    central relational data warehouse for analysis, backup and so on.


    Reporting, specifically, may actually go OO. Several vendors in the Java space
    (Actuate, Elixir, JasperSoft) and Microsoft in .NET (Visual Studio 2005—ReportViewer)
    have brought OO reporting tools to the market. And, you may even find it easier
    to report against a plain business object, say “customer”, rather than untyped
    normalized tables with cryptic names.


    **LJ:** How exactly does db40 address this impedance mismatch?


    **TED:** The db4o approach, like other OODBMSs, avoids the impedance mismatch
    because we''re not trying to store anything other than objects into the system.
    In other words, there''s no “mapping”, per se, because there''s nothing to map
    to. (Obviously, internally db4o is doing some storage tricks to avoid blatant
    inefficiencies, but these are the same tricks that any relational database plays
    and are, for the most part, entirely black box and removed from the end user''s
    perspective.) This means that the schema of the stored data is that of the objects
    themselves, thus avoiding the “dual-schema problem” I mentioned in the Vietnam
    essay.


    **CHRISTOF:** Class model == database schema.


    **LJ:** Is it fair to say that you want db40 to appear as an extension of Java,
    thus avoiding an impedance mismatch? Is that even possible to accomplish?


    **TED:** I''m not sure I''d say that it''s an extension of Java, so much as a
    mostly transparent persistence system. There have been numerous research projects
    over the years that have tried to make the persistence entirely transparent, including
    several within the Java space, and they play interesting tricks like hooking constructors
    to create persistent objects on “new” calls, and loading objects out of persistent
    space when invoking non-default constructors, and so on. Most of these haven''t
    made it out of the research phase, for a variety of reasons, so I''d be a bit
    wary of suggesting that db40 “extends” Java (or .NET, for that matter).


    **CHRISTOF:** Strictly speaking, you''re right, Ted. But if we have a design philosophy,
    it is exactly that—let''s be as transparent as possible. Let''s use the semantics
    and behavior of Java or .NET for persistence wherever we can to make it least
    intrusive and most intuitive to developers.


    **LJ:** So the learning curve for db40 is not very steep?


    **CHRISTOF:** No. In fact, there is a podcast on odbmsjournal.com (Episode 2)
    that shows that you are up and running with db40 in five minutes—including the
    download! What''s more challenging though, is that some people have to unlearn
    bad (non-OO) habits. They ask, “Where is my primary key?” (There is no primary
    key in OOP.) So, for us, it actually easiest to work with young developers, especially
    in Asia, who have no mental legacy and enjoy a ten-times higher productivity when
    writing their persistence-related code.


    **LJ:** When I talk to database designers and programmers, I often hear them sing
    the praises of multi-valued databases like P1CK. Do you get any demand from your
    users and developers for multi-value fields?


    **TED:** My experience has been different—that multi-valued databases are awkward
    and difficult to work with. I think what ultimately drives the discussion is what
    one''s own experience is like, and what you find to be obvious and intuitive to
    you.'
