  md: "# IN-DEPTH\n\n# SCGI lets your program start once and continue servicing requests\
    \ for as long as it likes.\n\nproperly configured Web server.\n\nMake Apache reload\
    \ its configuration with sudo /etc/init.d/apache2 reload. Your server should now\
    \ serve a new location, *scgiset*, that simply prints your request's CGI parameters\
    \ when you access it. Verify this by looking it up in a browser. If your server's\
    \ address is example.org, point your browser at http://example.org/scgiset. You\
    \ should see a page that looks like Listing 3.\n\nIf that's not what you see,\
    \ take a look at the shell where you ran the module. It may have printed some\
    \ helpful error message there. Or, if there is no reaction from the SCGI server\
    \ whatsoever, the request may not have reached it in the first place; check the\
    \ Apache error log.\n\nOnce you have this running, congratulations—it the worst\
    \ is behind you. Stop your SCGI server process so it doesn't interfere with what\
    \ we're going to do next.\n\n# Writing an Application\n\nNow, let's write a simple\
    \ SCGI application in Python—one that prints the time.\n\nWe import the SCGI Python\
    \ modules, then write our application as a handler for SCGI requests coming in\
    \ through the Web server. The handler takes the form of a class that we derive\
    \ from SCGIHandler. Call me unimaginative, but I've called the example handler\
    \ class TimeHandler. We'll fill in the actual code in a moment, but begin with\
    \ this skeleton:\n\n```\n```python\n#!/usr/bin/python\nimport scgi\nimport scgi.scgi_server\n\
    \nclass TimeHandler(scgi.scgi_server.SCGIHandler):\n    pass    # (no code here\
    \ yet)\n\n# Main program: create an SCGIServer object to\n# listen on port 4000.\
    \  We tell the SCGIServer the\n# handler class that implements our application.\n\
    server = scgi.scgi_server.SCGIServer(\n    handler_class=TimeHandler,\n    port=4000\n\
    )\n\n# Tell our SCGIServer to start servicing requests.\n# This loops forever.\n\
    server.serve()\n```\n```\n\nYou may think it strange that we must pass the SCGIServer\
    \ our handler class, rather than a handler object. The reason is that server object\
    \ will create handler objects of our given class as needed.\n\nThis first incarnation\
    \ of TimeHandler is still essentially the same as the original SCGIHandler, so\
    \ all it does is print out request parameters. To see this in action, try running\
    \ this program and\n\nopening the *scgiset* page in your browser as before. You\
    \ should see something like Listing 3 again.\n\nNow, we want to print the time\
    \ in a form that a browser will understand. We can't simply start sending text\
    \ or HTML; we first must emit an HTTP header that tells the browser what kind\
    \ of output to expect. In this case, let's stick with simple text. Add the following\
    \ near the top of your program, right above the TimeHandler class definition:\n\
    \n```\n```python\nimport time\ndef print_time(outfile):\n    # HTTP header describing\
    \ the page we're about\n    # to produce.  Must end with double MS-DOS-style\n\
    \    # \"CR/LF\" end-of-line sequence.  In Python, that\n    # translates to \"\
    \\r\\n\".\n    outfile.write(\"Content-Type: text/plain\\r\\n\\r\\n\")\n    #\
    \ Now write our page: the time, in plain text\n    outfile.write(time.cTime()\
    \ + \"\\n\")\n```\n```\n\nBy now, you're probably wondering how we will make our\
    \ handler class call this function. With SCGI 1.12 or newer, it's easy. We can\
    \ write a method TimeHandler.produce() to override SCGIHandler's default action:\n\
    \n```\n```python\nclass TimeHandler(scgi.scgi_server.SCGIHandler):\n    # (remove\
    \ the \"pass\" statement-we've got real\n    # code here now)\n\n    # This is\
    \ where we receive requests:\n    def produce(self, env, bodySize, input, output):\n\
    \        # Do our work: write page with the time to output\n        print_time(output)\n\
    ```\n```\n\nWe ignore them here, but produce() takes several arguments: env is\
    \ a dict mapping CGI parameter names to their values. Next, bodySize is the size\
    \ in bytes of the request body or payload. If you're interested in the request\
    \ body, read up to bodySize bytes from the following argument, input. Finally,\
    \ output is the file that we write our output page to.\n\nIf you have SCGI 1.11\
    \ or older, you need some wrapper code to make this work. In these older versions,\
    \ we override a different method, SCGIHandler.handle_connection(), and do more\
    \ of the work yourself. Simply copy the boilerplate code from Listing 4 into the\
    \ TimeHandler class. It will set things up right and call produce(), so nothing\
    \ else changes, and we can write produce() exactly as if we had a newer version\
    \ of SCGI.\n\nOnce again, run the application and check that it shows the time\
    \ in your browser.\n\nNext, to make things more interesting, let's pass some arguments\
    \ to the request and have the program process them. The convention for arguments\
    \ to Web applications is to tack a question mark onto the URL, followed by a series\
    \ of arguments separated by ampersands. Each argument is of the form name=value.\
    \ If we wanted to pass the program a parameter called pizza with the value hawaiian,\
    \ and another one called drink with the value beer, the URL would look something\
    \ like http://example.org/scgiset?pizza=hawaii&drink=beer."
