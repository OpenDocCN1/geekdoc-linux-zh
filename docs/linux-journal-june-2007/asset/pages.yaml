  md: '**LJ:** Does that sum up things fairly well or is there something you want
    to add?


    **TED:** There''s a lot of issues at stake here, one of which is the fundamental
    tension between developers and DBAs over “who owns the data,” and more important,
    the schema corresponding to that data. Developers who own the schema will create
    something that''s comfortable for them to use, but awkward for the DBAs to manipulate,
    and DBAs who own the schema will create something that''s easy for them to maintain
    and report from, but which in turn creates awkwardness for the developers. To
    suggest that a technology—any technology—is going to eliminate completely those
    problems that are fundamentally rooted in politics is somewhat foolish.


    **CHRISTOF:** The object/relational, dual-schema approach, which puts data above
    the application and into the hands of a DBA, has organizational advantages in
    traditional, centralized enterprise IT environments. There is, however, a whole
    class of applications, where the data store is entirely embedded and invisible
    to the end user—for example, in device software, in packaged software on your
    cell phone or PC, in real-time control systems and in SOA applications. These
    zero-admin database scenarios have no benefit from having two schemata, but incur
    all the cost of reconciling these inherently incompatible models. Distributed
    and mobile software architectures, proliferated in a networked world, drive demand
    for zero-administration database engines, so we will hear a lot more of them in
    the future.


    **LJ:** I realize that not all databases that call themselves “relational” actually
    conform to the Codd and Date academic view of relational databases. But, that
    aside, is this problem limited to relational database mapping to OO languages?
    Why don''t object-relational databases (ORDBMSes) solve this problem? Or do they?


    **TED:** In a lot of ways, the impedance mismatch isn''t limited only to objects
    and relations; trying to stuff objects into a hierarchical data format (like XML)
    suffers from some of the same problems. So, to suggest that this is “just” an
    object-relational problem is misleading. Date''s position on this is interesting;
    he insists that an ORDBMS really doesn''t exist, that the


