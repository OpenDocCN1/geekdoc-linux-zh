- pgno: 68
  md: "# Listing 8. Test the e-mail validation function.\n\n```\n<?php\nrequire(\"\
    validateMail.php\"); // your favorite here\n\nfunction testEmail($email)\n{\n\
    \    echo $email;\n    $pass = validateMail($email);\n    if ($pass) {\n     \
    \   echo \" is valid.\\n\";\n    } else {\n        echo \" is not valid.\\n\"\
    ;\n    }\n    return $pass;\n}\n\n$pass = true;\necho \"All of these should succeed:\\\
    n\";\n$pass &= testEmail(\"dcloiou.1bm.com\");\n$pass &= testEmail(\"abc\\@Wdef@example.com\"\
    );\n$pass &= testEmail(\"abc\\\\\\@example.com\");\n$pass &= testEmail(\"Fred\
    \ B\\Blogs@example.com\");\n$pass &= testEmail(\"Joe.\\\\B10w@example.com\");\n\
    $pass &= testEmail(\"^\"AbcWdef\"@example.com\");\n$pass &= testEmail(\"\\\"Fred\
    \ Blogs\"@example.com\");\n$pass &= testEmail(\"customer/department=shipping@example.com\"\
    );\n$pass &= testEmail(\"$A123456@example.com\");\n$pass &= testEmail(\"!def!xyz$abc@example.com\"\
    );\n\n$pass &= testEmail(\".someename@example.com\");\n$pass &= testEmail(\"user+mailbox@example.com\"\
    );\n$pass &= testEmail(\"peter.piper@example.com\");\n$pass &= testEmail(\"\"\
    Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"L\"@example.com\");\n$pass &= testEmail(\"\
    \"Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\necho \"\\nAll of these\
    \ should fail:\\n\";\n$pass &= !testEmail(\"abc\\@Wdef@example.com\");\n$pass\
    \ &= !testEmail(\"abc\\\\@Wdef@example.com\");\n$pass &= !testEmail(\"abc\\\\\
    @example.com\");\n$pass &= !testEmail(\"@example.com\");\n$pass &= !testEmail(\"\
    doug@\"));\n$pass &= !testEmail(\"\"\"\"@example.com\"));\n$pass &= !testEmail(\"\
    o@o\\@example.com\"));\n$pass &= !testEmail(\".dot@example.com\");\n$pass &= !testEmail(\"\
    dot_.dot@example.com\");\n$pass &= !testEmail(\"two..dot@example.com\");\n$pass\
    \ &= !testEmail(\"\"\"Doug\\\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\");\n\
    $pass &= !testEmail(\"\"\"Doug\"\" \\\\ \"\"Ace\"\" \\\\ \"\"L\"\"@example.com\"\
    );\n$pass &= testEmail(\"hello world@example.com\");\n$pass &= !testEmail(\"gatsby@f.s.c.ot.f.i.tz.g.m.r.1.d.\"\
    );\necho \"\\nThe email validation \";\nif ($pass) {\n    echo \"passes all tests.\\\
    n\";\n} else {\n    echo \"is deficient.\\n\";\n}\n?>\n```\n\nNow, the local part\
    \ has one of two forms. It may have a begin and end quote with no unescaped embedded\
    \ quotes. The local part, Doug \\\"Ace\\\" L. is an example. The second form for\
    \ the local part, (+.+), where + stands for a whole slew of allowable characters.\
    \ The second form is more common than the first; so, check for that first. Look\
    \ for the quoted form after failing the unquoted form.\n\nCharacters quoting using\
    \ the back slash (\\) pose a problem. This form allows doubling the back-slash\
    \ character to get a back-slash character in the interpreted result (\\). This\
    \ means we need to check for an odd number of back-slash characters quoting a\
    \ non-back-slash character. We need to allow \\\\\\\\ and reject \\\\\\\\\\\\\
    .\n\nIt is possible to write a regular expression that finds an odd number of\
    \ backslashes before a non-backslash character. It is possible, but not pretty.\
    \ The appeal is further reduced by the fact that the backslash character is an\
    \ escape character in PHP strings and an escape character in regular expressions.\
    \ We need to write four back-slash characters in the PHP string representing the\
    \ regular expression to show the regular expression interpreter a single back\
    \ slash. A more appealing solution is simply to strip all pairs of back-slash\
    \ characters from the test string before checking it with the regular expression.\
    \ The str_replace function fits the bill. Listing 5 shows a test for the content\
    \ of the local part.\n\nThe regular expression in the outer test looks for a sequence\
    \ of allowable or escaped characters. Failing that, the inner test looks for a\
    \ sequence of escaped quote characters or any other character within a pair of\
    \ quotes.\n\nIf you are validating an e-mail address entered as POST data, which\
    \ is likely, you have to be careful about input that contains back-slash (\\),\
    \ single-quote (') or double-quote (\"\") (\\). PHP may or may not escape those\
    \ characters with an extra back-slash character wherever they occur in POST data.\
    \ The name for this behavior is magic_quotes_gpc, where gpc stands for get, post,\
    \ cookie. You can stop the magic code via the function, get_magic_quotes_gpc(),\
    \ and strip the added slashes on an affirmative response. You also can ensure\
    \ that the PHPini file disables this 'feature'. Two other settings to watch for\
    \ are magic_quotes_runtime and magic_quotes_sybase.\n\nThe two regular expressions\
    \ in Listing 5 are appealing because they are relatively easy to comprehend and\
    \ don't require repetition of the allowable character group ([A-Za-z0-9!#$%&'*+\\\
    -/=?^_`{|}~-.]). Here's a test for you. Why does the character group require two\
    \ back-slash characters before the forward slash and one back-slash character\
    \ before the single quote?\n\nOne deficiency of the outer test of Listing 5 is\
    \ that it passes local part strings that include dots anywhere in the string.\
    \ Requirement number two states that dots can't start or end the local part, and\
    \ they can't appear together two or more times. We could address this by expanding\
    \ the outer regular expression into form (+a+), where a is [(\\\\[A-Za-z0-9!#$%&'*+\\\
    -/=?^_`{|}~-.])\\. We could, but that leads to a long, hard-to-read, repetitive\
    \ expression that's difficult to believe in. It's clearer to add the simple checks\
    \ shown in Listing 6."
