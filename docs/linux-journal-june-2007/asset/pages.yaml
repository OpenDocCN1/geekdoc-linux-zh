- pgno: 59
  md: '# # Asynchronous Database Access with Qt 4.x


    How to code around the default synchronous database access in Qt 4.


    Dave Berton


    The database support in Qt 4.x is quite robust. The library includes drivers for
    Oracle, PostgreSQL, SQLite and many other relational databases. Out of the box,
    the Qt database library also contains bindings for many widgets and provides data
    types for the transparent handling of result sets coming from a database. But,
    your application can pay a price for these conveniences. All database access is
    synchronous by default, which means that intensive and time-consuming SQL queries
    normally will lock up the UI unless precautions are taken. Using stored procedures
    on the server can sometimes help the situation; however, this is not always possible
    or desirable. And often, the length and cost of the queries generated by your
    application simply cannot be known in advance, so the door is left open for undesirable
    UI behavior. People don''t want their application to "lock up" at odd moments;
    however, this is the default behavior,


    and so we must contend with it.

    Fortunately, Qt 4.x also has robust support for multithreaded programming. By
    placing the heavy-duty database work in separate threads, the UI is free to respond
    to the user normally, without ungraceful interruptions. As with all concurrent
    programming, however, you must take precautions to ensure the correct sequence
    of interactions between threads. For example, when sharing data among threads,
    guard it properly using mutexes. When communicating between threads, consider
    carefully how the interaction will behave, and in what sequence. In addition,
    when utilizing a database connection within a thread separate from the UI thread,
    you must pay attention to some extra caveats. A proper implementation that keeps
    certain things in mind will make significant improvements in the UI behavior and
    responsiveness of a database application.'
