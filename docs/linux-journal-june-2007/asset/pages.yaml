- pgno: 24
  md: "response of type text/javascript, knowing that whatever we send will be evaluated\
    \ by the user's browser. We then send a response that uses Element.update to change\
    \ the headline to our translated sentence. Sure enough, as soon as we install\
    \ this new version of our software, the headline continues to be changed.\n\n\
    The power that's associated with this is tremendous. For example, we could update\
    \ the headline conditionally, checking it against a dictionary of forbidden words\
    \ in our server's database. We could keep track of what words are most commonly\
    \ used. We could restrict users to a certain number of headline updates per day.\n\
    \nEven better, because we're returning a JavaScript program, rather than the contents\
    \ of an individual HTML element, we can modify multiple parts of the page and\
    \ even throw in some Scriptaculous effects for good measure. Returning JavaScript\
    \ is a seemingly simple feature that Prototype provides, but it is one that opens\
    \ the door to tremendous possibilities.\n\n# RJS\n\nAnd now, the moment you've\
    \ been waiting for—you might bes is powerful, it's annoying to have to create\
    \ and maintain JavaScript code in Ruby controllers. It's bad enough that we need\
    \ to have SQL in there; three languages in a single file seems like overkill.\n\
    \nAnd, that's where RJS templates come in. The basic idea is that we assume a\
    \ response will be in the form of JavaScript, and that it will modify one or more\
    \ elements on the current page. RJS provides us with a compact syntax for making\
    \ those changes, so we can create very small files that do a great deal.\n\nThe\
    \ changes we need to make are minor. First, we modify our piglatin_sentence method\
    \ such that it modifies not sentence (a local variable) but @sentence (an instance\
    \ variable). We also remove the call to render, because we aren't rendering anything\
    \ directly.\n\nWe then create a file called piglatin_sentence.rjs. This is a view,\
    \ just like an .rhtml file, and thus goes alongside it in the views directory.\
    \ But, it consists of a single line:\n\n```\npage[:headline].replace_html @sentence\n\
    ```\n\nIn other words, we should take the current page, find the element with\
    \ an ID of headline and replace its HTML content with the value of @sentence,\
    \ which we got from the method. Sure enough, this works well. With a tiny bit\
    \ of code, we've managed to do quite a bit. And, as before, we can add Scriptaculous\
    \ calls, update multiple elements on the page, show and hide HTML elements—basically,\
    \ anything we might want to do.\n\n# Listing 6. showme_controller.rb (Updated\
    \ to Use RJS)\n\n```\nclass ShowmeController < ApplicationController\n  def piglatin_sentence\n\
    \    # Get the headline\n    sentence = params[:future_headline]\n    words =\
    \ sentence.split\n    \n    @sentence = \"\"\n    \n    # Go through each word,\
    \ applying the\n    # secret Pig Latin algorithm\n    words.each do |word|\n \
    \     if word =~ /[^aeiou]/i\n        word << \"way\"\n      else\n        first_letter\
    \ = word.slice(0,1)\n        rest = word.slice(1...-1)\n        \n        word\
    \ = \"#{rest}#{first_letter}ay\"\n      end\n      \n      @sentence << word\n\
    \      @sentence << \" \"\n    end\n    end\n  end\n```\n\n# Conclusion\n\nWhen\
    \ I first read about RJS templates, I thought it was one of the weirdest ideas\
    \ I had heard of. That's because the notion of writing JavaScript in Ruby seemed\
    \ both strange and unnecessary. I now understand the power and cleverness of this\
    \ type of template and look forward to using it on many of my Ajax-powered sites.\
    \ With a bit of study and some changes in how you think about Web development,\
    \ you're likely to make the same discovery.■\n\n**Reuven M. Lerner, a longtime\
    \ Web/database consultant, is a PhD candidate in Learning Sciences at Northwestern\
    \ University in Evanston, Illinois. He currently lives with his wife and three\
    \ children in Skokie, Illinois. You can read his Weblog at altnewland.lerner.co.il.**\n\
    \n# Resources\n\nThere are many good printed and on-line resources for learning\
    \ about Ajax. One of my favorite sites is **ajaxian.com**, in which the authors\
    \ discuss and review Ajax-related tools.\n\nTwo good books might come in handy.\
    \ The Pragmatic Programmers have published a second edition of the award-winning\
    \ *Agile Development in Rails* by Dave Thomas and David Heinemeier-Hansson, and\
    \ O'Reilly has released *Ajax on Rails* by Scott Raymond. Between these two books,\
    \ you should expect to get a full understanding of not only how Ruby on Rails\
    \ works, but also how to use JavaScript and RJS to create interesting and dynamic\
    \ Web applications."
  merge: -1
  img_proc: true
