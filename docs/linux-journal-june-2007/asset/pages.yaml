  md: '# COLUMNS

    AT THE FORGE


    ```

    Listing 4. index.html (Updated for JavaScript in the HTTP Response)


    `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html>

    <head>

    <title id="title">Sample HTML page</title>

    <%= javascript_include_tag ''prototype'' %>

    </head>

    <body>

    <form id="fakeForm">

    <h1 id="headline">Headline</h1>

    <p><input type="text" name="future_headline" /></p>

    </form>


    <p><%= submit_to_remote ''submit-button'',

    "Pig Latin it!",

    :url => { :action => "piglatin_sentence" },

    :submit => "fakeForm" %></p>

    </body>

    </html>`

    ```


    ```

    Listing 5. showme_controller.rb (Updated to Return JavaScript)


    class ShowmeController < ApplicationController


    def piglatin_sentence

    # Get the headline

    sentence = params[:future_headline]

    words = sentence.split

    sentence = ""

    # Go through each word, applying the

    # secret Pig Latin algorithm

    words.each do |word|

    if word =~ /[aeiou]/i

    word << "way"

    else

    first_letter = word.slice(0,1)

    rest = word.slice(1..-1)

    word = "#{$rest}#{$first_letter}ay"

    end

    sentence << word

    sentence << " "

    end

    output = "Element.update($(''headline''), "#{$sentence}");"

    render :text => output, :content_type => "text/javascript"

    end

    ```


    +   The contents of the form with the ID fakeForm are submitted.

    The value returned from the Ajax invocation is used to update the contents of
    the HTML element with the ID headline.


    All that’s left for us to examine is our controller, shown in Listing 3. The controller
    doesn’t necessarily know that it is being invoked by a background Ajax process
    or that its contents will be used to update the headline element. Rather, it simply
    is invoked like any method, turning the words into Pig Latin. The translated sentence
    is returned to the user’s browser as a plain-text file.


    # Returning JavaScript


    Now, the real magic begins. As we just saw, our controller (piglatin_sentence)
    returns a plain-text document to its caller. Of course, we’re free to return data
    in whatever format we please. One possible format might be XML. Indeed, the term
    Ajax is supposed to stand for Asynchronous JavaScript and XML, so it should come
    as no surprise that XML is a common format for return values. Another format that
    is growing in popularity is JSON (JavaScript Object Notation), a textual version
    of JavaScript objects that makes it fast and easy to exchange data.


    But, in the world of Ruby on Rails, there is another type of data that the controller
    might return to the user’s browser, namely JavaScript. This might not sound all
    that clever, but consider what Prototype does with it. If a controller is invoked
    with link_to_remote or submit_to_remote, and if the HTTP response has a content-type
    of xml/javascript, the JavaScript is evaluated.


    This could potentially save time—instead of returning the text that should be
    used for the headline and then using JavaScript to insert it. (True, we were able
    to say this tersely by using an :update parameter to the call to submit_to_remote.
    But the code still exists.) Rather, we simply could return JavaScript code that
    uses the DOM to modify the document. This would simplify our code quite a bit.


    To see this in action, look at Listings 4 and 5. Listing 4 is an updated version
    of our template, index.html, and it is basically unchanged from the previous version,
    except that we now are able to remove the :update parameter from the call to submit_to_remote:


    ```

    `<p><%= submit_to_remote ''submit-button'',

    "Pig Latin it!",

    :url => { :action => "piglatin_sentence" },

    :submit => "fakeForm" %></p>`

    ```


    Instead of indicating what should be changed on the client side, we instead do
    that on the server side:


    ```

    `output = "Element.update($(''headline''), "#{$sentence}");"

    render :text => output, :content_type => "text/javascript"`

    ```


    In other words, we tell our controller to produce a'
