    \ javascript_include_tag 'prototype' %>  \n  \n <script type=\"text/javascript\"\
    >  \n function updateHeadline()  \n {  \n var headline = $('headline');  \n var\
    \ new_headline_text = $('future-headline');  \n Element.update(headline, new_headline_text);\
    \  \n }  \n </script>  \n </head>  \n  \n <body>  \n <h1 id=\"headline\">Headline</h1>\
    \  \n <p><input type=\"text\" id=\"future-headline\" /></p>  \n <p><input type=\"\
    button\" onclick=\"updateHeadline();\" value=\"Update headline\" /></p>  \n </body>\
    \  \n</html>\n```\n\n# ## Ajax and Rails\n\nTo create a new Rails project called\
    \ ajaxdemo, type:\n\n```\nrails ajaxdemo\n```\n\nNow, let's create a simple controller\
