- pgno: 71
  md: '# **CHRISTOF WITTIG** and **TED NEWARD** on **OBJECT-ORIENTED LANGUAGE MAPPING
    to DATABASES**


    THE PROBLEM OF LANGUAGE-TO-DATABASE MAPPING.

    *Nicholas Petreley*


    I urge our readers to have a look at the “Vietnam of Computer Science” by Ted
    Neward, which compares the quagmire of the Vietnam War to the current quagmire
    that results from our attempts to blend object-oriented languages with relational
    or even object-relational databases. A link to Ted’s article can be found at [www.odbms.org/vietnam.html].


    The article discusses a problem called object-relational impedance mismatch. Here’s
    how I’d sum up the problem:


    We have two great technologies at our disposal: object-oriented languages and
    relational databases. Problems occur, however, when you try to blend the two,
    because neither is designed to work seamlessly with the other. A Query-By-Example
    style of programming may solve the problem, but this works only for simple database
    access.

    Mapping classes to tables may work, but the normalization of


    databases makes this approach difficult. For example, a “customer” table is not
    likely to include the city and state where the customer lives. A database administrator
    (DBA) will likely pull out that data and store it by zip code in another table.
    An option is simply to pass query strings to the database and sort out the fields
    manually. This is likely to lead to performance problems and breakage if the data
    types are not handled properly. To confuse matters more, even if you get everything
    right, there’s always the possibility that a DBA will change the database in such
    a way that it breaks your code.

    Languages like PHP include tricks to help smooth out the language-to-database
    mapping, but even these tricks can be undermined by certain changes to the database
    schema. The problem lies in the fact that these options are merely tricks, not
    true database-to-language mapping techniques.'
