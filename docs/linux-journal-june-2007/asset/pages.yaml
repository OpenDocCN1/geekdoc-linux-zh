    licensing had been correct.


    The difficulty with using the GPL was that it became clear as we did the licensing
    archaeology that there were going to be places in the software where we couldn''t
    negotiate a free license for the source code. No, there were going to be some
    quite important places in the code, and there were going to be quite a lot of
    them for a long time. And, that was probably the deciding factor not to use GPL
    but to use the Mozilla license.


    We looked at the Mozilla license, and we realised that we couldn''t use it as
    it was. We saw that license proliferation was an increasing problem. So, we decided
    that we would have a go doing a good thing for the Free Software and Open Source
    community, by making the last clone of the Mozilla license that would ever need
    to be made, by parameterising it. We left as much of the language as identical
    as we could and produced the Common Development and Distribution License, the
    CDDL. The CDDL is, in my view, an absolutely excellent license; if anyone but
    Sun had written it, it would have been hailed as brilliant.


    **GM: How do you see the relationship between OpenSolaris and GNU/Linux?**

    **SP:** I think there is a huge overlap in those words. One of the interesting
    things you discover when you run an OpenSolaris distribution like Nexenta is,
    my goodness, it looks just like Ubuntu. And, you know, there''s a really good
    reason for that: because it is Ubuntu, but it''s got a Solaris kernel in it.


    When you look at what UNIX-like operating systems really are, each is a set of
    editorial choices about which free software you want to assemble around which
    kernel. So, if you discover that everyone in Fedora, and everyone in FreeBSD,
    and everyone in OpenSolaris are all using the same stuff. They''re all using GNOME
    or KDE, they''re all using Sendmail, and they''re all using Mozilla. In the Solaris
    community, they''ve tended to use the OpenSolaris ON, which is the OpenSolaris
    jargon for the kernel and network. ON stands for Operating SystemNetworking. And
    the userland that''s around it, well, there is a style of userland that''s used
    by people who run servers. And then there''s the style of userland used by developers,
    and that''s typically GNOME or KDE, and tools. It''s just the same on Solaris
    as it is on Fedora. The look and feel is different, the editorial choices about
    where to put the icons are different, but ultimately, it''s all the same stuff.


    So I think we''re going to see a gradual shift in the way we think about UNIX-like
    operating systems as we go forward. We are going to see much less of people trying
    to


    arbitrarily distinguish between the different peers in that community. I think
    that the distinction people try to force between UNIX and Linux is part of a strategy
