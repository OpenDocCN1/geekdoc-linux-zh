  md: "# FEATURE Asynchronous Database Access with Qt 4.x\n\n# Communicating between\
    \ threads now becomes a matter of connecting signals from one thread to the slots\
    \ in another, and the mutexing and thread-safety issues of exchanging data between\
    \ threads are handled by Qt.\n\nown database connection, which is never shared\
    \ or visible outside the worker thread object.\nSetting up thread-specific connections\
    \ and running queries within that thread is only the first part of the problem.\
    \ A decision needs to be made regarding how data is shuffled back and forth between\
    \ the worker threads and the main application UI thread. Additional methods will\
    \ give the thread object some database work to perform, and those methods will\
    \ themselves need to be thread-safe.\n\nQCoreApplication passes these events in\
    \ a thread-safe manner from the application thread to the worker thread, and they\
    \ will be handled by the worker thread within its own execution context. This\
    \ is critical, because the worker thread will be utilizing its database connection\
    \ only from within its own context (Listing 3).\nThis method works in the other\
    \ direction as well. Events posted by individual worker threads will show up back\
    \ in the main UI event loop for handling, within the context of the UI’s thread\
    \ of execution. These events can, for example, contain the result of a query or\
    \ database update. This approach is convenient, as the worker threads can simply\
    \ “post it and forget it”, and Qt will take care of the inter-thread communication,\
    \ mutexing and memory management for you.\nConstructing all the necessary events\
    \ and event handlers for this type of system has advantages—most notably compile-time\
    \ type\n\n# Moving Data between Threads\n\nYou should observe all of the usual\
    \ caveats surrounding the sharing of data between different threads of execution,\
    \ including the proper uses of mutexes and wait conditions. In addition, there\
    \ is an added complication regarding the size of the data, which potentially can\
    \ be extremely large in the case of result sets returned from the database.\n\
    Qt provides several specialized mechanisms for sending data between threads. You\
    \ can post events manually to any object in any thread using the thread-safe function\
    \ QCoreApplication::postEvent(). The events will be dispatched automatically by\
    \ the event loop of the thread where the destination object was created. To create\
    \ an event loop within each thread, use QThread::exec(). Using this method, threads\
    \ are given “work” to do in the form of events.\n\n+   Listing 4. Sharing information\
    \ across threads is cleaner with signals and slots.\n\n+   Listing 3. Code That\
    \ Shares Information from Worker Thread to Application Thread via Event\n\n```\n\
    ```cpp\nclass WorkEvent : public QEvent\n{\n    public:\n    enum { Type = User\
    \ + 1 }\n    WorkEvent( const QString& query )\n      : QEvent(Type)\n      ,\
    \ m_query(query)\n    {}\n\n    QString query() const\n    {\n      return m_query;\n\
    \    }\n\n  private:\n    QString m_query;\n};\n\nQueryThread thread;\nthread.start();\n\
    /...\nWorkEvent* e = new WorkEvent(\"select salary from employee\n  * where name='maggelena';\"\
    );\napp.postEvent( &thread, e );\n//...\n```\n```cpp\nclass Worker; // forward\
    \ decl\nclass QueryThread : public QThread\n{\n QueryThread();\n signals:\n  void\
    \ queryFinished( const QList&lt;QSqlRecord&gt;& records );\n slots:\n  void slotExecQuery(\
    \ const QString& query );\n signals:\n  void queue( const QString& query );\n\
    \ private:\n  Worker* m_worker;\n};\n\nint main()\n{\n  QApplication app;\n\n\
    \  MainWin mw;\n\n  QueryThread t;\n  t.start();\n\n  connect(&mw, SIGNAL( execQuery(const\
    \ QString&)),\n          &t, SLOT( slotExecQuery(const QString&)));\n\n  connect(&t,\
    \ SIGNAL( queryFinished(const QList&lt;QSqlRecord&>)),\n          &mw, SLOT( slotDisplayResults(const\
    \ QList&lt;QSqlRecord&>)));\n\n  mw.show();\n  return app.exec();\n}\n```\n```\n\
    \n```\n```cpp\nclass Worker; // forward decl\nclass QueryThread : public QThread\n\
    {\n QueryThread();\n signals:\n  void queryFinished( const QList&lt;QSqlRecord&>\
    \ records );\n slots:\n  void slotExecQuery( const QString& query );\n signals:\n\
    \  void queue( const QString& query );\n private:\n  Worker* m_worker;\n};\n\n\
    int main()\n{\n  QApplication app;\n\n  MainWin mw;\n\n  QueryThread t;\n  t.start();\n\
    \n  connect(&mw, SIGNAL( execQuery(const QString&)),\n          &t, SLOT( slotExecQuery(const\
    \ QString&)));\n\n  connect(&t, SIGNAL( queryFinished(const QList&lt;QSqlRecord&>)),\n\
    \          &mw, SLOT( slotDisplayResults(const QList&lt;QSqlRecord&>)));\n\n \
    \ mw.show();\n  return app.exec();\n}\n```\n```"
