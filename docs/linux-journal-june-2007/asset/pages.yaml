- pgno: 39
  md: '# DIY Everything


    I have a confession to make. Or a *Make* to confess. I love *Make* magazine. I
    wish we’d done something like that first. Kudos to Dale Daugherth and the O’Reilly
    folks for pulling that one off and doing a great job with it—also for not running
    too much Linux-type stuff in there.


    When I started with *Linux Journal* in the late 1990s, we were basically a how-to
    magazine. To a large degree, we still are. Most of our readers are hands-on types
    in any case. Problem solvers. Most of our writers (myself excluded) are too.


    So I’m wondering…now that *Linux* is (or can be) in nearly everything, what can
    we make or fix that’s one or more layers up? What can we do with MythTV that’s
    beyond a set-top box? Pluto is a cool (and *Linux*-based) whole-home automation,
    security, entertainment and telecom system. But, it’s still a system. A deep and
    under-appreciated (and under-deployed) virtue of openness is modularity. You want
    to be able to mix and match different stuff from different makers, including (especially)
    yourself. We should be making Legos with Linux, not just embedding it in finished
    closed products that work only with themselves.


    Here the fight is for the right and ability to build what you want, any way you
    want to build it. Although *Make* is oriented toward doing fun hacks on already-made
    stuff (turning a mouse into a robot or adding temperature control to a coffeemaker),
    we’d angle more toward making the modules, and the things-with-modules that allow
    anybody to build anything. Our protagonists would be the same DIY-ers we’ve had
    all along, but the problem would be Building Anything. Fun problem.


    Years ago, I talked about how the software industry was turning into a construction
    industry—when architects, designers, builders and their specialties would all
    be independent of any one company’s platform or development environment. Now we’re
    almost there, but not quite. The fight here is to make *Linux* and its endless
    variety of “stacks” into the base materials with which people can put together
    using our virtual Home Depots.


    # Freedom vs. Control


    Although it’s easy to point to the exemplary successes of Linux-built giants such
    as Google and Amazon, it’s just as easy to overlook the degree to which the practical
    value of system behind *Linux* development has become the default approach to
    networked progress.


    June 2008, *Linux Journal* will have an unavoidably personal focus to every issue—for
    the simple reason that there will be too much going on with desktops and laptops.


    Or maybe not. We don’t know yet. Lenovo, HP and Dell may continue quietly to fill
    orders for desktop *Linux* without ever marketing it aggressively. This won’t
    go on forever, but the asymptote may still stay flat for another year, two or
    three.


    Meanwhile, desktop and laptop *Linux* are still worth fighting for, just like
    we’ve been doing for the last decade or more.


    Yet even as *Linux* and the LAMP+ stack have become standard building materials,
    there’s nothing to stop them from being used in service of a proprietary mentality
    that seeks to lock in customers, lock out competition and lock down markets. As
    Steven Hodon puts it (<www.wi-nextra.com/?p=354>):


    > Many would like to believe that the best and strongest weapon against the old
    guard of technology is the Open Source movement, but what they don’t see is that
    they have already become co-opted and have just become another way to make money.
    While the roots of the OSM (Open Source movement) may still technically be free
    to all, the old guard is quickly locking up parts of it with service contracts
    and corporate licensing.


    It’s still customary for VCs to ask their potential portfolio companies, “What’s
    your lock-in?” This is an Industrial Age mentality that needs to be exposed as
    a value-subtracting anachronism in a world where creation and choice yield abundances
    that can be built to countless productive uses. You should want to build goods
    and provide services that customers choose freely. You should keep customers because
    they want to stay, not because you’ve trapped them in a silo.


    Even Steve Jobs this year came out and said the record industry would be better
    off without DRM. That’s because he’s no less trapped than any of his customers.


    The protagonist here is nothing less than the cause of freedom, which will never
    be old Genus. (I mean intended.) The problem here–well, the enemy–is a mentality
    as old as the Industrial Age.


    The battle for freedom, of course, is one we’ve been fighting all along. The difference
    now is that the logic of lockup is more and more exposed, and its flaws are more
    and more evident—though not yet widely obvious.


    The fight, then, will shift from ideals to practical matters. How do you make
    money by building with free stuff and putting it to use, rather than just by selling
    it? How is software more useful and important as it becomes less and less of an
    industry? How do you get more work done, and become more valuable as a contributor
    because you’re working with free and open goods?


    These are still new questions, even though *Linux Journal* has been a living answer
    to all of them since 1994.


    # What’s Your Story?


    So now the question goes to the floor. What are the Good Fights you want to read
    about in *Linux Journal*? You tell us. Write to [editor@linuxjournal.com](mailto:editor@linuxjournal.com).


    Net users today are no less trapped by their phone or cable companies than personal
    computer users in 1999 were trapped by Microsoft Windows.'
