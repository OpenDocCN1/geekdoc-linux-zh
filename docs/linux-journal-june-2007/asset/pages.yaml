- pgno: 53
  md: "# Encapsulating Behavior\n\nA blog is not a blog if we can't add new posts,\
    \ so let's do that:\n\n```\n>>> blog = blog + ['A new post.']\n>>> blog\n['My\
    \ first post', 'Python is cool', 'A new post']\n```\n\nHere we set blog to a new\
    \ value, which is the old blog, and a new post. Remembering all that merely to\
    \ add a new post is not pleasant though, so we can encapsulate it in what is called\
    \ a function:\n\n```\n>>> def add_post(blog, new_post):\n...      return blog\
    \ + [new_post]\n...      \n>>>\n```\n\ndef is the keyword used to define a new\
    \ function or method (more on functions in structured or functional programming\
    \ and methods in object-oriented programming later in this article). What follows\
    \ is the name of the function. Inside the parentheses, we have the formal parameters.\
    \ Those are like variables that will be defined by the caller of the function.\
    \ After the colon, the prompt has changed from >>> to ... to show that we are\
    \ inside a definition. The function is composed of all those lines with a level\
    \ of indentation below the level of the def line.\n\nSo, where other programming\
    \ languages use curly braces or begin/end keywords, Python uses indentation. The\
    \ idea is that if you are a good programmer, you'd indent it anyway, so we'll\
    \ use that indentation and make you a good programmer at the same time. Indeed,\
    \ it's a controversial issue; I didn't like it at first, but I learned to live\
    \ with it.\n\nWhile working with the REPL, you safely can press Tab to make an\
    \ indentation level, and although a Tab character can do it, using four spaces\
    \ is the strongly recommended way. Many text editors know to put four spaces when\
    \ you press Tab while editing a Python file. Whatever you do, never, I repeat,\
    \ never, mix Tabs with spaces. In other programming languages, it may make the\
    \ community dislike you, but in Python, it'll make your program fail with weird\
    \ error messages.\n\nBeing practical, to reproduce what I did, simply type the\
    \ class header, def add_post(blog, new_post), press Enter, press Tab, type return\
    \ blog + [new_post], press Enter, press Enter again, and that's it. Let's see\
    \ the function in action:\n\n```\n>>> blog = add_post(blog, \"Fourth post\")\n\
    >>> blog\n['My first post', 'Python is cool', 'A new post',\n 'Fourth post']\n\
    >>>\n```\n\nadd_post takes two parameters. The first is the blog itself, and it\
    \ gets assigned to blog. This is tricky. The blog inside the function is not the\
    \ same as the blog outside the function. They are in different scopes. That's\
    \ why the following:\n\n```\n>>> def add_post(blog, new_post):\n...      blog\
    \ = blog + [new_post]\n```\n\ndoesn't work. blog is modified only inside the function.\
    \ By now, you might know that new_post contains the post passed to the function.\n\
    \nOur blog is growing, and it is time to see that the posts are simply strings,\
    \ but we want to have a title and a body. One way to do this is to use tuples,\
    \ like this:\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_53_0.png)\n\n```\n>>>\
    \ blog = []\n>>> blog = add_post(blog, ('New blog', 'First post'))\n>>> blog =\
    \ add_post(blog, ('Cool', 'Python is cool'))\n>>> blog\n[('New blog', 'First post'),\n\
    \ ('Cool', 'Python is cool')]\n>>>\n```\n\nIn the first line, I reset the blog\
    \ to an empty list. Then, I added two posts. See the double parentheses? The outside\
    \ parentheses are part of the function call, and the inside parentheses are the\
    \ creation of a tuple. A tuple is created by parentheses, and its members are\
    \ separated by commas. They are similar to lists, but semantically, they are different.\
    \ For example, you can't update the members of a tuple. Tuples are used to build\
    \ some kind of structure with a fixed set of elements. Let's see a tuple outside\
    \ of our blog:\n\n```\n>>> (1, 2, 3)\n(1, 2, 3)\n```\n\nAccessing each part of\
    \ the posts is similar to accessing each part of the blog:\n\n```\n>>> blog[0][0]\n\
    'New blog'\n>>> blog[0][1]\n'This is my first post'\n```\n\nThis might be a good\
    \ solution if we want to store only a title and a body. But, how long until we\
    \ want to add the date and time, excerpts, tags or messages? You may begin thinking\
    \ you'll need to hang a sheet of paper on the wall, as shown in Figure 1, to remember\
    \ the index of each field— not pleasant at all. To solve this problem, and some\
    \ others, Python gives us object-oriented programming.\n\n# Object-Oriented Programming\n\
    \nObject-oriented programming was born more than 20 years ago so developers could\
    \ separate each part of a computer program in a way similar to how objects are\
    \ separated in the real world. Python models objects by using classes. A class\
    \ is an abstract definition of what an object has and what an object can do. To\
    \ see this sounds foreign, don't worry, OOP (object-oriented programming) is difficult\
    \ at first."
