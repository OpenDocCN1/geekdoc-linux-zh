    collaboration extension, created in tandem with the firm O3spaces B.V., "provides
    OpenDocument and MS-Office document collaboration, management and retention services"
    and serves as an alternative to the Microsoft Office SharePoint server. For server
    backup and restore, Xandros has integrated SEP AG''s "SEP sesam application, which
    provides comprehensive data security for the Xandros Linux Server, including full
    integration with its new Sxialix 11 collaboration platform".


    www.xandros.com


