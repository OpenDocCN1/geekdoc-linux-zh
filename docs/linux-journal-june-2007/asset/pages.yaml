    Python, Part I


    ![](img/526fd434dcfcf1b461b94c24ea170f36_51_0.png)


    This tutorial jumps right in to the power of Python without dragging you through
    basic programming.


    Python is a programming language that is highly regarded for its simplicity and
    ease of use. It often is recommended to programming newcomers as a good starting
    point. Python also is a program that interprets


    programs written in Python. There are other implementations of Python, such as
    Jython (in Java), CLPython (Common Lisp), IronPython (.NET) and possibly more.
    Here, we use only Python.


