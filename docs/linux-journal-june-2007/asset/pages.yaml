    # Introvension Software''s DEFCON


    The UK''s Introvension Software was proud to tell us that it is "keen supporters
    of the Linux community" and, therefore, is releasing its third and latest Linux-based
    game, *DEFCON*. *DEFCON* is an on-line, competitive, multiplayer strategy game
    based around the theme of global thermonuclear war. Inspired by the 1983 cult-classic
    *Wargames*, the game "evokes the tension, paranoia and suspicion surrounding the
    Cold War era". The player assumes the role of a general hidden in an underground
    bunker, whose mission is to exterminate the enemy''s civilian population while
    simultaneously disabling the enemy''s ability to retaliate. *PC Gamer UK* described
    *DEFCON* as "pure, deep, utterly unconsolable fun". A Windows version is already
    available. Introvension should get an award for best URL to boot!


    www.everybody-dies.com


    # OpenSTV


    Ever feel like voting your conscience by supporting the Penguin Party rather than
    settling for the lesser of two "Republican" or "Demopublican" evils? To solve
    this dilemma, alternative (and Constitutional and increasingly popular) voting
    methods, such as single transferable vote (STV) and instant runoff voting have
    evolved that allow one to rank candidates in an election. If your Penguin Party
    candidate has no chance in hell to win, your vote counts instead for your lower-ranked
    choice who has a shot at winning. Sorting out these voting preferences is the
    job of OpenSTV, now in version 1.1, an open-source application that tabulates
    votes according to the respective voting rules. Data generally comes from paper
    ballots and is dumped into OpenSTV. The lead developer says that "some of the
    voting rules have been extensively verified by comparing the results over hundreds
    of elections against other software". OpenSTV runs on Linux, Mac OS X or Windows
    and can be downloaded from SourceForge.


    stv.sourceforge.net


    ![](img/526fd434dcfcf1b461b94c24ea170f36_41_1.png)


    ![](img/526fd434dcfcf1b461b94c24ea170f36_41_2.png)


    # TotalView Technologies'' MemoryScape


    The company you''ve known as Ethus has rechristened itself as TotalView Technologies,
    and to celebrate, it has released version 2.0 of its MemoryScape standalone interactive
    memory debugger. MemoryScape "helps developers identify, inspect and resolve difficult
    memory problems in C, C++ and FORTRAN, including complex multiprocessor and multithreaded
    programs", says TotalView. Some key features include tools that allow developers
    "to monitor heap memory, view memory usage, locate memory leaks, track memory
    events and show corrupted memory". Developers also can save and compare memory
    states, compile memory reports and find memory problems without re-compiling.
    New features in MemoryScape 2.0 include support for MPI programs and remote memory
    debugging. A trial version is available for download from TotalView''s Web site.


    www.totalviewtech.com


