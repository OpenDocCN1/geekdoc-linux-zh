- pgno: 13
  md: '# UPFRONT

    NEWS + FUN


    # WHAT''S NEW IN KERNEL DEVELOPMENT


    **diff -u**


    Ingo Molnar has implemented a new language-like wrapper system called Syslets
    to manage system calls from user space. These little mini-programs can run system
    calls asynchronously, responding to their behavior as the user desires, without
    having to return out of kernel space. Using Syslet wrappers, Ingo has measured
    33.9% speedups over cached synchronous I/O and 19.2% speedups over uncached synchronous
    I/O. Interest in Syslets among kernel hackers is fairly high, though Linus Torvalds
    feels the Syslet programming interface is too complicated and difficult for casual
    users to experiment with. Clearly some work remains before Syslets are ready to
    go into the main tree.


    Intel has produced a PRO/Wireless 3945ABG Network Connection adapter driver. Unlike
    some other Intel drivers, this one doesn''t depend on a proprietary daemon; it
    is fully open source. It does, however, require a microcode upgrade. This improved
    licensing situation is apparently not due to any different feature of the hardware,
    but rather is due to improvements in the microcode itself. Intel''s driver has
    received a good reaction among kernel folks, and it seems on the way to being
    included in the source tree.


    The well-known and long-standing 10 loophole, allowing drivers to pretend to be
    the GPLed when they aren''t, is being closed. Several folks are working on this,
    most notably Jan Engelhardt, who recently posted a patch to fix it. There''s a
    controversy surrounding this patch, because some folks feel that if the kernel
    places greater restrictions on non-GPLed drivers than on GPLed ones, this constitutes
    a license enforcement feature, which could violate the terms of the GNU General
    Public License. So long as the loophole exists within the code, the debate can
    stay dormant, because driver writers can bypass the controls. Once the controls
    actually start to work, the debate gains immediately for companies such as LinxAnt,
    who have made use of the loophole in the past.


    The KVM virtual machine code has migrated its development tree from Subversion
    to git for a couple reasons. Avi Kivity said, by way of explanation, that Subversion
    could not efficiently host the entire kernel tree and that developers wanted to
    maintain their own branches independently.


    Jon Masters is the new module-init-tools maintainer, having taken over the job
    from Rusty Russell and patched the MAINTAINERS file to reflect the change. Evgeny
    Dushistov also has created a UFS entry in the MAINTAINERS file, and listed himself
    as the maintainer.


    Alessandro Di Marco got more than he bargained for when he posted a new user inactivity
    trigger he''s been playing around with. It''s a nice little feature that issues
    an ACPI event when no user activity occurs for a certain amount of time. He''d
    hammered the code out for fun, intentionally avoiding questions about optimal
    implementation details, on the assumption that not too many folks actually would
    be interested in this. To his turned out, a lot of folks were interested, and
    they had many implementation suggestions. For starters, Arjan van de Ven pointed
    out that udev would be a better delivery mechanism than ACPI. Pavel Machek pointed
    out that Alessandro''s new /proc file would be better in the /sys directory. Pavel
    also suggested that user space would be a better place overall for such a feature,
    although Alessandro feels this would add a lot of complexity to the code. He responded
    quickly to a lot of the suggestions, producing new versions of his patch that
    answered the objections raised on the linux-kernel mailing list.


    Planning for the next Linux Kernel Summit has begun. The kernel folks are hosting
    it up with a move to Cambridge, England, instead of the traditional Ottawa gathering
    in Canada. The new venue has opened up the possibility of different venues in
    the future, and a bunch of them have been proposed, including Australia, India
    and the Czech Republic. A major factor in selecting future locations will be the
    overall cost. A lot of kernel folks work at companies that pay for their plane
    tickets to the Summit each year, but some prices become prohibitive. Countries
    that are home to more attendees are more likely to host the Summit than organizers.
    But of course, anything can happen. —ZACK BROWN


    ![](img/526fd434dcfcf1b461b94c24ea170f36_13_0.png)


