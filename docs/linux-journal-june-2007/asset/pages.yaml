  md: "An example might help. A bridge is a structure that allows people or vehicles\
    \ to cross an obstacle, such as a river, canal or railway. A bridge has some length,\
    \ some width and even some height. It may allow vehicles or only persons. It may\
    \ allow heavy vehicles or not. When I say \"bridge\", I am not defining any of\
    \ those details. Bridge is a class. If I say Golden Gate, Le Pont de Normandie\
    \ or Akashi-Kaikyo, I am naming particular bridges; they have some specific length,\
    \ width, vehicle allowance and color. In OOP jargon, they are instances of bridge.\n\
    \nBack to our blog, let's create a class to model our post:\n\n```\n```python\n\
    >>> class Post(object):\n...     pass\n>>> \n>>> \n```\n```\n\nWe start with class,\
    \ the keyword for creating new classes. Next comes the name of the class—in this\
    \ case, Post. In parentheses, we have the super-classes—ignore that for now.\n\
    \nHere again, the prompt has changed from `>>>` to `...`, and Python expects *something*\
    \ in a class. Because we don't want to put anything in yet, we write *pass*, which\
    \ is something, but in fact, it is nothing. Python knows when a class starts and\
    \ ends because of the indentation, the same as with functions.\n\nTo reproduce\
    \ what I did, simply type the class header, *class Post(object):*, press Enter,\
    \ press Tab, type *pass*, press Enter, press Enter again, and that's it.\n\nNow,\
    \ we can create a Post:\n\n```\n```python\n>>> cool = Post()\n>>> cool\n<_main__.Post\
    \ object at 0xb7c6642c>\n```\n```\n\nNote that what is being printed when we evaluate\
    \ a post is a generic representation for the object. We can set its title and\
    \ body:\n\n```\n```python\n>>> cool.title = \"Cool\"\n>>> cool.body = \"Python\
    \ is cool.\"\n```\n```\n\nAnd retrieve them:\n\n```\n```python\n>>> cool.title\n\
    'Cool'\n>>> cool.body\n'Python is cool.'\n```\n```\n\nUp to this point, a Post\
    \ is like a simple container for anything you can imagine putting there. The problem\
    \ with this is we may get lost as to what to put in it, or what not to put in\
    \ it. Back to a sheet of paper? No! Although we can't stop making the posts a\
    \ container in that way, we can put some methods there, so users have an idea\
    \ of what a post may contain. To do this, we wrote our own methods in the class\
    \ Post:\n\n```\n```python\n>>> class Post(object):\n...     def set_title(self,\
