  md: "location of each of the directories that contain the source code. Then, you\
    \ can specify the value of the variable as the sourceroot. For example, I set\
    \ up the sources for glibc-2.3.5 and OpenMOSIX-2.4.26, placing the source for\
    \ both of them in /var/www/httpdocs/lxr/source in their individual directories\
    \ with the same names as above. In lxr.conf, I had a line like:\n\n```\nvariable:\
    \ s, Source. (glibc-2.3.5, OpenMOSIX-2.4.26)\n```\n\nthen:\n\n```\nsourceroot:\
    \ /var/www/httpdocs/lxr/source/$$\n```\n\nThus, the appropriate source code is\
    \ automatically selected based on the value of the source variable.\n\n# srcrootname\n\
    \nsrcrootname specifies the name of the project whose source code is displayed—for\
    \ example:\n\n```\nsrcrootname: $$\n```\n\n# incprefix\n\nThis specifies the locations\
    \ of the header files that are to be included in the project.\n\n# dbdir\n\nThis\
    \ is the location of the fileidx and xref files generated by genxref. If you have\
    \ multiple projects, specify a separate location for each, as follows:\n\n```\n\
    dbdir: /var/www/httpdocs/lxr/source/$$\n```\n\nThese are the only options you\
    \ need to set when configuring LXR. Additionally, you can specify the location\
    \ of the glimpse binary using glimpsebin.\n\n# glimpsebin\n\nglimpse allows users\
    \ to search for specific files within the source code and to search for any text\
    \ within source files. You can obtain the latest version of glimpse from [webglimpse.net/trial/glimpse-latest.tar.gz](webglimpse.net/trial/glimpse-latest.tar.gz).\
    \ Extract and install it. Once you are done installing glimpse, go to the directory\
    \ where the source code is installed, such as /var/www/httpdocs/lxr/source/glibc-2.3.5,\
    \ and do the following:\n\n```\nbash# glimpseindex -H ..\n```\n\nThe output should\
    \ look something like this:\n\n```\nThis is glimpseindex version 4.18.2, 2006.\n\
    \nIndexing \"/var/www/httpdocs/lxr/source/glibc-2.3.5\" ... \n\nSize of files\
    \ being indexed = 8171416 B, Total #of files = 10075 \n\nIndex-directory: \"/var/www/httpdocs/lxr/source/glibc-2.3.5\"\
    \ \n\nGlimpse-files created here:\n```\n\n![](img/526fd434dcfcf1b461b94c24ea170f36_81_0.png)\n\
    \n```\n-rw-r--r-- 1 root root 67398 2006-09-08 05:51 .glimpse_filenames\n-rw-r--r--\
    \ 1 root root 40300 2006-09-08 05:51 .glimpse_filenames_index\n-rw-r--r-- 1 root\
    \ root 0 2006-09-08 05:50 .glimpse_filenames\n-rw------- 1 root root 1783314 2006-09-08\
    \ 05:51 .glimpse_index\n-rw-r--r-- 1 root root 886 2006-09-08 05:51 .glimpse_messages\n\
    -rw------- 1 root root 836 2006-09-08 05:51 .glimpse_partitions\n-rw-r--r-- 1\
    \ root root 23888 2006-09-08 05:51 .glimpse_statistics\n```\n\nThis creates the\
    \ required glimpse index files in the current directory. Once they're created,\
    \ make sure read permission is set for others:\n\n```\nbash# chmod o+r .glimpse-*\n\
    ```\n\nNow, set the glimpsebin option in lxr.conf to wherever you installed glimpse.\
    \ I installed it in /usr/local/sbin/glimpse. That's it; save and close the file.\
    \ The only thing remaining to do now is configure the Web server to work with\
    \ LXR.\n\n# Configuring Apache\n\nThe Web server I used was Apache 1.3.33. The\
    \ first order of business is to set the permissions for the LXR directory. You\
    \ can do that by editing the httpd.conf file, normally found under /etc/apache/httpd.conf.\
    \ Add the following lines:\n\n```\n<Directory /var/www/httpdocs/lxr>\nAllowOverride\
    \ All\nOptions All\n</Directory>\n```\n\nSimply replace the location with wherever\
    \ you've installed LXR."
