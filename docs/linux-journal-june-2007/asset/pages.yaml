- pgno: 74
  md: 'For myself, and I think Date would agree with this, multi-value fields are
    anathema and something to be avoided, because I personally believe pretty strongly
    in the power of the relational model for data storage and manipulation.


    LJ: How does that fit in with O/R mapping? Does that present more problems?


    TED: In some respects, no, because it would be a “just” a List (or other collection)
    stored as an attribute of the class. But in other ways, it would represent a significant
    problem for O/R-M tools, because now trying to decide if a List inside a class
    should map to a multi-value field or as association to another table would require
    yet another annotation/attribute on the field to control the mapping, creating
    even more coupling between the object model and the database schema.


    LJ: Does the GPL-ization of Java factor into your work in any way? Does it present
    problems or opportunities for your business?


    CHRISTOF: The GPL-ization, in fact, the dual licensing of Java, is great news
    for db4o on three accounts. First, open-sourcing Java certainly fosters the Java
    ecosystem, from IBM to Eclipse to many open-source projects and startups. Second,
    with open source, we can look to build a much closer integration of db4o''s persistence
    solution with the Java VM than previously possible. Third, the dual- license model
    itself, as used by MySQL, db4objects, Trolltech and many others, has received
    further endorsement as a viable open-source business model, which also makes our
    life as a company much easier.


    LJ: How have your customers reacted to the fact that Java is going GPL? Do you
    see any increase or decrease in interest in Java? A decrease or increase in interest
    in db4o?


    CHRISTOF: We have seen a huge increase in Java users of db4o during the last few
    months, both in absolute terms as well as in proportion to our other platform,
    .NET. We don''t really know whether this is going back to open-sourcing Java,
    but that would provide a good explanation.


    LJ: Thank you so much for taking the time and effort to speak with us.


    Nicholas Petreley is Editor in Chief of Linux Journal and a former programmer,
    teacher, analyst and consultant who has been working with and writing about Linux
    for more than ten years.


