- pgno: 95
  md: "![](img/526fd434dcfcf1b461b94c24ea170f36_95_0.png)\n\n# INDEPTH\n\nremember\
    \ that Lua treats strings and integers differently: \"1\" < 2 is always false,\
    \ and strings are compared alphabetically.\n\nLua does while loops if the condition\
    \ is false. Repeat-until statements are the opposite of while loops; they loop\
    \ until the condition is true. for loops have some hidden twists, which can be\
    \ annoying to Python or Ruby programmers. Local variables created in the for loop\
    \ are visible only inside the loop. The variable does not exist when the loop\
    \ ends, so if you need the value of the control variable, you have to save its\
    \ value into another loop. Breaks or returns should appear only as the last statement\
    \ before an end, an else or an until in a loop for syntactic reasons.\n\nLua treats\
    \ functions as “first class” values and uses them for OOP (object-oriented programming).\
    \ Lua can call its own functions or functions, and it handles functions as a type.\
    \ You can give a variable the function property or create it with the function()\
    \ method. Functions written in Lua can return multiple results if you list them\
    \ after a return keyword. Lua supports OOP, but due to Lua’s size, its implementation\
    \ of OOP lacks a few features. Lua uses tables and functions for OOP rather than\
    \ classes. In the same way that Python accesses a function or variable in a class,\
    \ Lua accesses it with Table.function or Table.variable.\n\nLua can be picky which\
    \ it comes to multiple assignment, because it adjusts the number of values on\
    \ the assignment. If the amount of values is less than the list of variables,\
    \ all remaining values are given the nil value. If the list of values is longer\
    \ than the amount of variables, Lua silently discards them.\n\n# Object-Oriented\
    \ Programming\n\nLua has some basic OOP capabilities. The self parameter is an\
    \ integral concept in any object-oriented language, and it is one of the few OOP\
    \ concepts that Lua has. Many object-oriented languages tend to hide the self\
    \ mechanism from you so that you do not have to declare this parameter. Lua hides\
    \ this parameter with the colon operator. You also can use the colon, a function\
    \ and a table to emulate a class. Because Lua does not have the class concept,\
    \ each object defines its own behavior and shape:\n\n```\n```\nEarth = {martians\
    \ = 3389}\nfunction Earth:casualties( survivors)\n  Earth.martians = Earth.martians\
    \ - survivors\n  print(\"Earth is free! \"..Earth.martians..\" martians survived!\"\
    )\nend\n\nEarth:casualties(3380)\n```\n```\n\nThe colon in the above example is\
    \ used to add an extra parameter in the method definition. It also adds an extra\
    \ parameter in the method call. You don’t have to use the colon. Lua programmers\
    \ can define a function with the dot syntax and call it with the colon syntax,\
    \ or vice versa if they add an extra parameter:\n\n```\n```\nEarth = {martians\
    \ = 3389,\ncasualties = function (self, survivors)\n  self.martians = self.martians\
    \ - survivors\n  print(\"Earth is free! \"..self.martians..\" martians survived!\"\
    )\nend}\n\nEarth.casualties(Earth, 5380)\nEarth.martians = 5389\nEarth:casualties(3380)\n\
    ```\n```\n\nIn this case, the function had to be part of the table so that it\
    \ could be called via the dot or the colon syntax. Note that I also had to give\
    \ the function the self parameter for either calling method to work. Although\
    \ these are simple OOP examples that scratch only the surface of OOP, you can\
    \ find out about inheritance and other OOP implementations in the Lua Reference\
    \ Manual or in the book Programming in Lua (both are available for free from the\
    \ Lua Web site).\n\n# Show and Tell\n\nNow, let’s compare programming in Lua to\
    \ programming in Python. First, let’s write a trivia game. Here is some simple\
    \ Lua code that uses a table as a dictionary to store both the questions and the\
    \ answers:\n\n```\n```\nprint(\"What’s your name?\")\nname = io.read()\nquestions\
    \ = {\n\t[\"Which came first? Minix or Unix?\"] = \"Unix\",\n\t[\"Who created\
    \ Linux?\"] = \"Linus Torvalds\", \n\t[\"In what year was Linux created?\"] =\
    \ \"1991\"\n}\n\ncorrect_answers = 0\nfor key,value in pairs(questions) do\n\t\
    print(key)\n\tanswer = io.read()\n\tif answer == value then\n\t\tcorrect_answers\
    \ = correct_answers + 1\n\tend\n\telse\n\tif correct_answers == 0 then\n\tprint(\"\
    You need to browse Wikipedia!\")\n\telse\n\tprint(\"\".\"Good job, \"..name..\"\
    !\")\n\tprint(\"Correct answers: \"..correct_answers..\" )\n\tend\nend\n```\n\
    ```\n\nNext, let’s break it down and analyze it line by line. On the second line,\
    \ the variable name is given the value io.read(). The io library has many functions\
    \ that handle all sorts of input and output, but I’m using it only for keyboard\
    \ input.\n\nOn the next line is the variable questions. The questions variable’s\
    \ value is a table that I have used like a dictionary to store both the questions\
    \ and the answers. The questions are in brackets to tell Lua that they are the\
    \ table’s key.\n\nSkipping the third line, there is a for loop whose function\
    \ here is to use pairs() to find the key and the values of each item in the table.\
    \ It then needs to place the value of the key and the value of the key’s value\
    \ into the variables key and value.\n\nAfter printing the key (which contains\
    \ the question), Lua places the user’s answer through io.read() into the answer\
    \ variable and checks to see whether it equals the proper answer. If the answer\
    \ is correct, it adds 1 to the value of the correct_answers variable and repeats\
    \ the process until there are no more items in the table to go through.\n\nNext,\
    \ Lua checks to see whether users got any of the questions correct and then prints\
    \ a message telling users to learn more about UNIX (and its variants) hacker history\
    \ or congratulates users on how many questions they answered correctly. Notice\
    \ the concatenation operators on the 16th line."
