  md: '# ## letters


    ![](img/526fd434dcfcf1b461b94c24ea170f36_9_0.png)


    # **In Praise of Linux Games**


    I''m increasingly impressed by the variety and quality of games that are available
    for Linux. Most of them are pretty wholesome, which I appreciate, as I don''t
    care for on-screen violence any more than the real thing. Have you considered
    adding a column devoted to Linux games? I''d bet lots of people would read it.
    By the way, I''ve enjoyed Marcel Giragné''s articles immensely and have tried
    a lot of the programs he has mentioned. Reading *LJ* is a great way to learn about
    interesting software. Keep up the good work!


    > *-- Mike Ford*


    # **Now You''re Cooking with Linux**


    I would like to address the critics of Mr. Garné. Marcel''s column provides people
    who are new to Linux topics that are not way over their heads or beyond their
    needs. The different writing style/format makes the column even more appealing
    to the Linux newbie.


    By attracting new desktop users, Mr. Garné makes a huge contribution to the Linux
    community. Mr. Garné does this both as a professional writer and as a citizen.
    Evidence of this can be found in Mr. Garné''s WFTL-LUG. I would suggest that the
    complainers join the WFTL-LUG and find out for themselves. Perhaps they can make
    a contribution or two in the LUG instead of all this unproductive negativism.


    By the way, the March 2007 edition was super. Keep up the good work.


    > *-- John Kerr*


    # **Now You Don''t See Them, Now You Do**


    In the April 2007 issue, Chris Trayner states in his letter "Now You See Them,
    Now You Don''t" that Konqueror no longer allows one to right-click on a file and
    see an option to delete it. True, it is not there by default. However, if you
    go to Settings→Configure Konqueror→Behavior, you will see an option *Show Delete
    context menu entries*, which bypasses the trash can. Check this box, and the delete
    option will be present at right-click. Thank you for an outstanding publication!


    > *-- Dwight Middelbroek*


    *Thanks for clearing up that issue for us!--Ed.*


    # **Doc Searls, iPhone Home**


    In the April 2007 issue on page 42, "Why an iPhone When We Can Make Our Own OpenPhone?"
    by Doc Searls, the context that ANA is relating directly with customers via the
    cell is misleading. I have worked with all three carriers in Japan: NTT DoCoMo,
    AU and Yahoo Keitai (formerly Vodafone Japan). Yes, there was an IC system that
    allows passengers to check in quickly. Yes, ANA will get stats on how many people
    are using the system, but JAL also has this system and also the Japan railways
    (JR East&West). The technology is based on Sony''s contactless IC chip. But, the
    system is controlled by each cell carrier. The carriers also control the Java
    applet that runs the IC chip, so they too can receive stats on who is using the
    system. The carriers here in Japan control which phones their service will use.
    It''s not as bad as in the US, as there are only three silos here. But, the customers
    have no rights. With locked SIM chips, you can''t get any unlocking code. Until
    last year, there was no number portability. Just in the last five years, Japan
    cell phones could be used overseas without the blessing of the carrier. Interactive
    programs with the end user aren''t possible. One additional comment, the only
    reason IC-enabled cell phones exist is because the train system started using
    IC-enabled train passes--JR being the majority of railways and majority of the
    population rides those trains every day.


    > *-- Robert Balfour*


    # **Cell-Phone Silos**


    Doc, you didn''t mention the worst cell-phone silo of them all [*LJ*, April 2007,
    "Why an iPhone When We Can Make Our Own OpenPhone?"]: the crippling system that
    makes it impossible for cell phones to communicate directly with each other. Whatever
    happens in software development for mobile phones, this silo will stand as an
    insurmountable obstacle to progress until the network model changes from the current
    client/server system to an unrestricted, peer-to-peer, ad hoc model.


    This transformation is certainly disruptive technology. As such, it will probably
    follow the usual disruptive technology development path. It will be ignored, ridiculed,
    lobbied against and actively resisted by the existing technology providers, until
    it makes them irrelevant and takes over the world.


    What if this technology had been in use when Katrina hit New Orleans? There would
    have been no communications problems into any area where there was at least one
    phone within range of another, as in any, including the height of the storm. Rescuers
    would not have had to wait for days or weeks for destroyed infrastructure to be
    replaced just for basic communications.


    Instead, there were thousands of working cell phones in the disaster area, all
    rendered completely useless by the silo owners'' communication restrictions.


    The future of wireless is already written large in the form of the Internet. A
    self-organizing, self-healing worldwide network is an unstoppable force. The next
    obvious step is to remove the wires, and in keeping with the best Free Software
    traditions, this can be accomplished from the bottom up, simply by doing it.


    > *-- Carl Brown*


    # **Banning Novell or Buying SCO?**


    A few issues ago [March 2007, *Variations*], Nicholas Petley called for a ban
    on Novell after it signed an agreement with Microsoft. Today, I read on Slashdot
    that Novell asserts to "Windows Is Cheaper Than Linux" ([news.zdnet.co.uk/software/0,1000000121,39286295,00.html](https://news.zdnet.co.uk/software/0,1000000121,39286295,00.html)).


    My advice to Novell: buy SCO. They both seem to be on the same path.


    > *-- Paul Ammann*


    # **News about Dell''s Article**


    As a frequent reader of *LJ*, I must tell you about good news from Dell. For sure,
    in consequence of the article "A Modest GNU/Linux Proposal for Michael Dell" (from'
