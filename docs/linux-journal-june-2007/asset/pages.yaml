  md: "# INDEPTH\n\n# # An Introduction to Metaprogramming\n\nHow to write programs\
    \ that write programs.  ARIEL ORTIZ\n\nA metaprogram is a program that generates\
    \ other programs or program parts. Hence, metaprogramming means writing metaprograms.\
    \ Many useful metaprograms are available for Linux; the most common ones include\
    \ compilers (GCC or FORTRAN 77), interpreters (Perl or Ruby), parser generators\
    \ (Bison), assemblers (AS or NASM) and pre- processors (CPP or M4). Typically,\
    \ you use a metaprogram to eliminate or reduce a tedious or error-prone programming\
    \ task. So, for example, instead of writing a machine code program by hand, you\
    \ would use a high-level language, such as C, and then let the C compiler do the\
    \ translation to the equivalent low-level machine instructions.\n\nMetaprogramming\
    \ at first may seem to be an advanced topic, suitable only for programming language\
    \ gurus, but it's not really that difficult once you know how to use the adequate\
    \ tools.\n\n# ## Source Code Generation\n\nIn order to present a very simple example\
    \ of metaprogramming, let's assume the following totally fictional situation.\n\
    \nErika is a very smart first-year undergraduate computer science student. She\
    \ already knows several programming languages, including C and Ruby. During her\
    \ introductory programming class, Professor Gomez, the course instructor, caught\
    \ her chatting on her laptop computer. As punishment, he demanded Erika write\
    \ a C program that printed the following 1,000 lines of text:\n\n+   1. I must\
    \ not chat in class.\n2. I must not chat in class.\n...\n999. I must not chat\
    \ in class.\n1000. I must not chat in class.\n\nAn additional imposed restriction\
    \ was that the program could not use any kind of loop or goto construct. It should\
    \ contain only one big main function with 1,000 printf instructions—something\
    \ like this:\n\n```\n```\n#include <stdio.h>\nint main(void) {\n    printf(\"\
    1. I must not chat in class.\\n\");\n    printf(\"2. I must not chat in class.\\\
    n\");\n    /* 998 printf instructions omitted. */\n    printf(\"999. I must not\
    \ chat in class.\\n\");\n    printf(\"1000. I must not chat in class.\\n\");\n\
    \    return 0;\n}\n```\n```\n\nProfessor Gomez wasn't too naive, so he basically\
    \ expected Erika to write the printf instruction once, copy it to the clipboard,\
    \ do 999 pastes, and manually change the numbers. He expected that even this amount\
    \ of irksome and repetitive work would be enough to teach her a lesson. But, Erika\
    \ immediately saw an easy way out—metaprogramming. Instead of writing this program\
    \ by hand, why not write another program that writes this program automatically\
    \ for her? So, she wrote the following Ruby script:\n\n```\n```\nFile.open('punishment.c',\
    \ 'w') do |output|\n    output.puts '#include <stdio.h>'\n    output.puts 'int\
    \ main(void) {'\n    1.upto(1000) do |i|\n        output.puts \"    printf(\\\"\
    #{i}. \\\" +\n                    \"I must not chat in class.\\n\\\")\\\"\"\n\
    \    end\n    output.puts '    return 0;'\n    output.puts '}'\nend\n```\n```\n\
    \nThis code creates a file called punishment.c with the expected 1,000+ lines\
    \ of C source code.\n\nAlthough this example might seem a bit fabricated, it illustrates\
    \ how easy it is to write a program that produces the source of another program.\
    \ This technique can be used in more realistic settings. Let's say that you have\
    \ a C program that needs to include a PNG image, but for some reason, the deployment\
    \ platform can accept one file only, the executable file. Thus, the data that\
    \ conforms the PNG file data has to be integrated within the program code itself.\
    \ To achieve this, we can read the PNG file beforehand and generate the C source\
    \ text for an array declaration, initialized with the corresponding data as literal\
    \ values. This Ruby script does exactly that:\n\n```\n```\nINPUT_FILE_NAME = 'logo.png'\n\
    OUTPUT_FILE_NAME = 'logo.h'\nDATA_VARIABLE_NAME = 'logo'\n\nFile.open(INPUT_FILE_NAME,\
    \ 'r') do |input|\n    File.open(OUTPUT_FILE_NAME, 'w') do |output|\n        output.print\
    \ \"unsigned char #{DATA_VARIABLE_NAME}[] = {\"\n        data = input.read.unpack(\"\
    C*\")\n        data.length.times do |i|\n            if i % 8 == 0\n         \
    \       output.print \"\\n\t\"\n            end\n            output.print \"0x%02X\"\
    \ % data[i]\n            output.print ', ' if i < data.length - 1\n        end\n\
    ```\n```"
