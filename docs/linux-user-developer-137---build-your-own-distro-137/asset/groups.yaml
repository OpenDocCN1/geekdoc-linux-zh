    # 引言


    Erlang 是一种在 20 世纪 80 年代末于瑞典的爱信实验室创建的编程语言。提示符提到了 Erlang，在那里你可以感受到 Erlang 的强大。要开始本教程，请注意
    Erlang 条目必须以点（.）结束。评估每个 Erlang 类型：


    # 如果我在教程过程中卡住了怎么办？


    了解 Erlang。要了解更多 Erlang，需要阅读 Francesco Simon 编写、O''Reilly 出版的《Erlang Programming》。


    # 02 Shell


    你与 Erlang shell 可以进行的最短交互是：


    ```bash

    $ erlang R15B (5.9)

    ```


    如你所示，如果你退出 shell，你需要输入 `q()` 并按下回车键。在运行任何以 `.` 结尾的命令之前不要退出。q() 函数是退出 shell 最简单的方法，但请记住，只有在你本地工作时
    q() 函数才有效。


    # 03 Erlang 变量和数字


    Erlang 使用两种类型的整数和浮点数。''10'' 是整数，而 ''10.0'' 是浮点数。整数总是精确的，但浮点数取决于其值。在 Erlang 中定义新变量时，你可以按照以下示例更改其值：


    ```bash

    X = 12;

    Y = X + 5;

    ```

    ```bash

    error: no match for variable side 17

    ```

    ```bash

    Y = 5;

    ```

    ```bash

    error: no match for variable side 17

    ```


    Erlang 将变量 X 解释为 ''12''。在 Erlang 中编写 ''Hello World'' 程序有点复杂，因为你必须在单独文件中编写 Erlang
    代码，并带有一个返回结果的函数。然后你需要编译并运行该函数，最终在屏幕上显示 ''Hello World'' 消息。你需要输入以下：


    ```bash

    $ hello().

    hello world

    ok

    ```


    第一个命令调用 hello_world 源文件，第二个命令调用模块的 helloWorld() 函数。


    # 05 关于 Erlang 的更多信息


    Erlang 运行时系统 (ERTS) 代表“Björn 的抽象机器”，一个称为 BEAM 的虚拟机。当你编译 Erlang 程序时，编译器将代码转换为 BEAM
    代码。如果你刚刚开始学习 Erlang 程序，或者如果你停止思考它的语法而开始学习，square 模块是查看的完美之处。


    如果你使用 Side 作为变量名，在尝试编译模块时将收到以下警告消息：


    ```bash

    square:error -- expression has a badarithith exception

    ```


    如果你想在你创建的另一个模块中使用 square 模块中的 area 函数，你应该在新模块中包含以下命令：


    ```erlang

    -import(square, [area/1]).

    ```


    没有命令可以从现有的 Erlang 模块导入所有函数。如果模块内没有该函数，你将得到描述性消息。


    # 07 解释代码


    在模块顶部，-module 定义了模块名称，即 square。-export 指令定义了可见的函数列表，用面向对象的术语来说。模块定义了函数：length
    和 area。注意名称和输出结果在 Erlang 中是不同的。所有模块必须正确定义。


    通过以下方式列出可用函数以及模块的其他信息：


    ```bash

    module_info().

    ```


    获取模块信息的另一种方法是：


    ```bash

    square().

    ```


    如果你使用该目录，你还将看到一个二进制文件 square.beam，它是编译后的


    # 09 Erlang 写入


    之前开发的 is_file 模块支持写入数据文件。每行包含三个用空格分隔的数字：正方形的边长、面积和周长。输入文件 square.fil 将包含格式化字符串。文件名使用了硬编码。打开文件进行写入通过以下代码执行：


    ```bash

    file:open(File,"w")

    ```


    在完成所有写入操作后不要忘记关闭文件，使用以下代码：


    ```bash

    file:close(File)

    ```


    实际输出到 ''output'' 文件的写入使用 Erlang 代码完成：


    ```bash

    io:format(File,"~d ~3f ~3f\n",[Number, Area, L]).

    ```


    # 06 示例模块


    在 Erlang 编程中，模块帮助你轻松、高效地组织和共享代码。关于编写 Erlang 模块的参考。square 模块计算正方形周长和面积的源代码在这里，如下：


    ```erlang

    -module(square).

    -export([length/1,area/1]).


    length(Side) -> 4 * Side.

    (Area) -> Side * Side.

    ```


