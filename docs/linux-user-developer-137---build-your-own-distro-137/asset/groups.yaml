    ## 公众认知


    如果说我每天都在好奇的一件事，那就是 Linux 是否有朝一日进入主流。这是一个有些老调的话题，但我认为我应该一劳永逸地关注这个问题。在我的家庭服务器、多媒体中心、PC
    和笔记本电脑上，我都是 100% 的 Linux。在尝试使用 Linux 一段时间后，我想如果完全转向 Linux 会变得容易得多。然而，我的同事们并不认同，他们对
    Linux 有着这些奇怪的刻板印象，这种印象我在非 Linux 用户中经常能看到。


    我们真的能看到这些变化吗？这无疑会让我的生活变得更简单、不再那么困惑。


    汤姆·沃特森


    似乎每年 Linux 作为桌面系统的使用率都会略有增加，但无法预测它在短期内是否会被更广泛地使用。它在服务器和移动端占据主导地位，后者得益于安卓。集成系统正越来越多地依赖
    Linux 和开源。Linux 留下的唯一市场是桌面端，所以也许这是不可避免，我们将看到人们使用 Linux 进行工作并将其作为主系统。


    尽管 Linux 在计算领域将至关重要，但桌面市场与服务器市场非常不同。


