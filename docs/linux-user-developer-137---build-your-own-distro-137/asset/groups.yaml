  mdcn: "\n\n# 制作 Pivaders 动画：缩进与声音\n\n## 02 下载 pivaders\n\nGit 是一个卓越的版本控制解决方案，可以帮助程序员存储代码和归档文件。它还教你如何“克隆”现有项目并从\
    \ github.com 等地方对其进行工作。要克隆这些项目，请使用命令行：\n\n```bash\ngit clone https://github.com/codix/pivaders.git\n\
