    # Review


    # Graphical Git viewers


    # git-cola


    The only FOSS Linux Git recommended by the Git website


    ![](img/2d03d34861423ee052621659d1149047_75_0.png)


    +   Dig around the interface and you can find the history and comparisons for
    commits


    # Functions


    Of all the viewers on review here, git-cola has possibly the most git-based functions.
    Well as a series of quick buttons along the side of the interface, the main toolbar
    and context menus contain extra functions that you won''t need to use all the
    time.


    # Developer tools


    git-cola focuses on the state of git branch making up quick days to edit or modify
    existing files. It fits a little better than your standard IDE or project manager,
    allowing you to see what has been changed without having to open a terminal and
    depend status.


    # Comparison


    By digging through some of the menus, you can find a couple of ways to compare
    the history of the current branch. Either via a graphical tree, or by looking
    at the actual differences between each of the commits—you are able to check over
    a period of commits.


    # Navigation


    The git-interface is quite awkward, and Hades has a few functions that would be
    better to keep on the context menus, it is compounded by the fact that there are
    lot of functions that aren''t sorted particularly well, making it a double-edged
    sword.


    # Overall


    > git-cola is a piece of decent software as we''ve previously mentioned, however
    it can take a little to get used exactly how it works. The functions are all there,
    just a bit away.


    # gitg


    # The GNOME Git viewer takes a leaf out of the GNOME book on simplicity


    ![](img/2d03d34861423ee052621659d1149047_75_1.png)


    +   The tabbed interface is nice, however there are very few actual git functions
    in gitg


    # Functions


    As expected of an official GNOME app, gitg is a little light on actual functions.
    You must do really here to see what changes you''ve made overall, and commit the
    changes. You can''t push what you commit, and neither can merge properly, or use
    other git functions.


    # Developer tools


    Again, gitg is best at reminding you how the branch has changed over the course
    of development, rather than helping you to commit or merge whatever. While this
    might be enough for some, the rest could offer a lot more to developers.


    # Comparison


    Comparison is the main function of git, and it does it well. It''s pretty front
    on the interface, with both tree and verbose comparisons. It includes the SHA
    codes for each commit, allowing you to easily revert or checkout branches if you
    need to go to a specific point.


    # Navigation


    While there is no simple app, gitg functions is not really a problem. The tabbed
    interface helps for organising exactly what you want to see, and all appropriate
    features are accessible. For what you get in gitg, it''s all very nice to use,
    even if it''s just for viewing branches.


    # Overall


    The concept of gitg is fine, being able to have a look at the development of your
    code. However, all the other viewers in this review can do this and more. It would
    be better to have access to gitg.


    ![](img/2d03d34861423ee052621659d1149047_75_2.png)


    76 www.linuxuser.co.uk'
