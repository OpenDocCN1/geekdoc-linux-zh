    #  02 Start up


    Start up on the host computer and choose the ''Server'' option to learn how to
    use it as a client, and later how to use the Raspberry Pi as a server for the
    mouse and keyboard.


    #  05 Starting and connecting


    Once you''re finished with the setup, client to be able to accept connections.
    To connect from Raspberry Pi,


    # Synergy lets you share a mouse and keyboard


    #  03 Encryption and passwords


    You can then set up or not the connection is encrypted. This is useful for sharing
    keyboards for being able to sync on your information, or records from connecting
    and hijacking your mouse. Provide a password and click finish.


    #  06 Autostart Synergy


    To make sure it starts every time you turn on the PI, to create an LXDE autostart
    entry using the following:


    ```

    $ sudo mkdir --config ~/.1xsession/LXDE/autostart

    $ sudo touch --config ~/.1xsession/LXDE/autostart

    $ sudo nano --config/.1xsession/LXDE/autostart

    ```


    ![](img/2d03d34861423ee052621659d1149047_64_1.png)


