    The methods of creating a custom distribution are varied, but they can be divided
    into two main categories: you can modify a running distribution and then distribute
    it, or you can modify the installation ISO (called ''remastering'') so that it
    installs your modified distribution in the way you have specified. We''re going
    to take a look at four approaches.


