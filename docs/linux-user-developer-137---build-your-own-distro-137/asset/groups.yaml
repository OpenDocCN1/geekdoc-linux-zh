    \ 获取最新新闻与观点\n\n# 访谈\n\n# 通过 UEFI 保护 Linux 安全\n\nUEFI 论坛主席 Mark Doran 破除了一些迷思，并解释了为什么许多\
    \ Linux 发行版现在支持安全启动（Secure Boot）……\n\n当 UEFI 论坛（统一可扩展固件接口标准的制定，该标准已取代台式机、笔记本电脑和服务器中的传统\
    \ BIOS）宣布创建“安全启动”时，最初遭到了反对。批评者警告说，这种允许系统在启动时仅导入预先批准的操作系统的能力，意味着厂商可能会创建出无法启动 Linux\
    \ 的系统，从而让行业巨头微软在传统的开放式 PC 市场中首次拥有了完全受限的受众。\n\n这是 Mark Doran 努力纠正的印象。他自称为一个“更好的守门人”，曾在任职天堂期间从操作系统开发转向固件开发，现在担任\
    \ UEFI 论坛主席——正如 Linux 对安全启动的采用率不断增加所充分证明的那样，这样做是非常有效的。\n\n什么是安全启动？你能告诉我们它最初是为了什么开发的吗？我们意识到，在创建一个相对开放的\
    \ [UEFI] 环境（并对其进行了良好的解释和记录）时，我们可能在所有这些机器的中心位置成为了恶意软件编写者的游乐场。为了应对这一点，我们必须思考可以采取哪些防御措施，以确保预期的交易——即平台将控制权交给一个安装适当的操作系统副本——是客户所预期的，而不是非预意的恶意软件进入？我们能做什么来确保在我们的管理范围内，允许预期的交易并阻止非预意的交易？从逻辑角度来看，安全启动源于哪里，\n\
    \n我还想强调一点：安全启动是防止恶意软件插入到启动流中的防御措施，但它的目的并不是——我们的本意也不是——成为解决一般安全问题的万能药。它与数字版权管理（DRM）无关，其范围严格限制在我们能做的事情上。\n\
    \n![](img/2d03d34861423ee052621659d1149047_9_0.png)\n\n- UEFI 论坛主席 Mark Doran\
    \ 致力于让行业领袖加入 UEFI\n\n10 linuxuser.co.uk\n\n# 新闻\nLinux 社区的最新动态\n\n## 今年我们找到了一种让\
    \ Linux 基金会（Linux Foundation）成为成员公司的方法\n\n以防止我们的操作系统空间受到恶意软件感染。这是一件好事，因为我们选择的检查范围非常窄，这使得问题变得易于处理。\n\
    \n从根本上说，我认为这实际上是一个非常有用的工具；如果你撇开关于最坏情况的潜在漏洞（这些漏洞在进入市场的机器中建立信任链时可能被滥用），社区将获益匪浅。这实际上是一个非常好的主意。能够……的益处在于\n\
    \n当安全启动首次引入时，社区曾担心它会锁定像 Linux 这样的操作系统。这种误解是什么？它的界面可能会创建一个相当封闭的平台；你只会运行由平台制造商或其其中一个成员在平台上安装的位代码。对于世界上的通用计算机来说，这将使用户无法启动任何其他操作系统，在某些情况下，它可能面临硬件损坏的风险。\n\
    \n有效地在固件和操作系统之间建立一条信任链，并让系统本身提供更安全的环境和更健壮的操作系统。\n\n嗯，当我们审视这些顾虑的混乱局面时，我们真正意识到。我们看到了一个通用机器可以禁用最初安装的安全启动的场景。你可以为你的用户做出相应的政策选择，但在实践中，有多少厂商真的会去这样做呢？\n\
    \n问题是，我花费了多年努力尝试尝试与他们接触，将他们带入 UEFI 论坛内部的对话中。所以，如果你看看我们的工作，你会发现许多发行版都是成员，不仅限于红帽（Red\
    \ Hat）和 Ubuntu，去年我们还成功让 Linux 基金会也成为了一个成员公司，现在我们在 UEFI 规范的主要工作组中有一位来自他们技术委员会的成员。\n\
    \n当我们看微软文档的操作混乱情况时，它显示一个启用/禁用位需要英特尔（Intel）的支持，并允许你操作存储在平台上的位，当你拥有机器所有权时，你可以放置任何内容，并共享其源代码。\n\
