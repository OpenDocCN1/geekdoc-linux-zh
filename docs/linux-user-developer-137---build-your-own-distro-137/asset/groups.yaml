    # Defence agency launches open catalogue


    The US Advanced Research Projects Agency (DARPA) has launched a website with free
    access to the public that allows users to experiment with technologies it has
    developed.


    Best known for its development of the ARPANET, the nation-spanning network that
    would eventually lead to the modern internet, DARPA is a major sponsor in computer
    science theory and practical development. DARPA''s Open Catalogue, claims, is
    an attempt to give back to the community with the results of its research and
    development but also to encourage.


    Initial offerings in the DARPA Open Catalogue include software toolkits and peer-reviewed
    documentation from the agency''s Information Innovation Office (2023). The partially
    funded toolkits are designed to help encourage development of software that may
    enable users of targeted applications to process large volumes of data much faster


