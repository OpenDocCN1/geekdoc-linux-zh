    # # Web Designer


    ![](img/2d03d34861423ee052621659d1149047_94_1.png)


    # # sabayon, for you


    Developing the web is a huge part of modern computing, with the majority of services
    available online and in the cloud. We pride ourselves on having


    +   - Home: GNOME, KDE

    - Server: CoreCDX, EC2, OpenVZ

    - Hacker: LXDE, Xfce, Awesome

    - Bleeding: Enlightenment 17


    some fantastic open source web tutorials. Web Designer is dedicated to bringing
    many more of these features at the same level of quality. Regularly covering the
    latest technologies like HTML5, CSS3, jQuery, WordPress, and mobile apps. Web
    Designer is the best choice for hobbyists and professional developers. You can
    find out more at www.webdes@webmag.com.


    ![](img/2d03d34861423ee052621659d1149047_94_2.png)


    Distros such as Sabayon and Debian are rolling releases, which you don''t specifically
    need to upgrade


    # # Means to upgrade


    go route: there are those using a rolling release cycle. Every month updated there
    are a major new release so you won''t have to worry about an upgrade or restart.
    Still, there are solutions to this problem, you just need to pick a distro that
    fits your needs.


    I use Linux as my main desktop, but however it never seems like I''m allowed to
    get comfortable with the distro I use. Every six months or year a new distro gets
    updated. Usually this I''m updating or installing a newer version of whatever
    I like at the time, and I''m getting a little tired of it to. I''m just ready
    to back down with some of the recent updates. But then the Linux support schedule
    has put me right. I wouldn''t mind if there were differences between releases,
    but they seem to be much more than updated packages. I wonder if I''m missing
    something important.


    # # Raspberry


    Raspberry Pi offers a lot of help, and on-hands with projects is just what I need.
    You''ll also get to meet Raspberry Pi enthusiasts, and there are plenty of tutorials
    that can help you get grips with new kind of projects. All upcoming projects via
    the Raspberry Pi website: raspberry-pi.org


    Like everyone else, I''ve really come to Raspberry Pi, I''ve gone through stages
    of using it, however, at least I''m using it and it''s not just gathering dust.
    That bit that happened in the first month, I want to learn how to write you and
    the stuff that goes up on the Raspberry Foundation''s site. In fact of these projects,
    I''d like to see that this is what I think about Raspberry Jacks. Is this correct?


    We''re also getting our very own Raspberry Pi star in April, and you can find
    out more from page 16.


    While there are others that have, specific releases with their own support cycles,
    this is by no means the only Linux distros operate. Even within the Ubuntu family,
    the long-term support releases are those you choose to update every two years
    when the next LTS is released; there''s even an option in the ubuntu to notify
