    # Create the perfect Windows 8.1 VM


    Advisor Rob Zwetoulos models complex systems and is a well developer proficient
    in Python, Django and PHP. He loves experimenting with computing


    Work in and develop for Windows without having to properly dual-boot, by creating
    a virtual machine


    Resources

    VirtualBox: www.virtualbox.org

    VirtualBox Guest Additions

    ISO of Windows


    Using Windows is a necessary evil. All of these environments still use Windows,
    and you''ll need Windows-specific applications and software if you want to work
    from home. There''s the problem of development when switching between operating
    systems is time-consuming and can, frankly, getting tiring. The solution to a
    lot of these issues is never dual-boot in the first place, but instead to virtualise
    Windows on your machine.


    VirtualBox makes it easy to create virtual machines, and what we''ll be using
    in this tutorial. It''s a bit of a process to install Windows, though, and you''ll
    be covered in detail. We can interact with it from the host machine, allowing
    you to set up a shared folder to access files and devices.

    You''ll need a decently powered, modern PC to be able to run the VM smoothly,
    and make sure you have plenty of RAM.


    34 www.linuxuxer.co.uk'
