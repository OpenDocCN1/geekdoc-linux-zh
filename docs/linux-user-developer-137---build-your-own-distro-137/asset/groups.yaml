    # 选用 Linux User & Developer 第 13 期


    Rob Zetsloot 在大学学习航空航天工程，并在课堂上使用 Python 进行复杂的模拟。Rob 在本期杂志出版期间庆祝了他的 27 岁生日，并并在从第
    34 页开始的教程中以虚拟化自己的方式作为纪念。还有其他庆祝方式吗？


