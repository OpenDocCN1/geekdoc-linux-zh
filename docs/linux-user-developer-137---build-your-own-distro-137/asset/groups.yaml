    ## Public perception


    If there''s one thing I wonder about day to day, it''s whether or not Linux will
    ever break the mainstream. It''s a bit of a tired subject but I should be concerned
    about once and for all. I''m 100% Linux on my home server, media centre, PC and
    laptop. Having worked to use Linux for a while, I think how much easier it would
    be to over Linux. My co-workers disagree, though they have these weird preconceptions
    of Linux that I find too often in non-linux users.


    Will we ever see these changes? It would certainly make my life easier and less
    confusing.


    Tom Watson


    It seems every year that use of Linux as a desktop slightly increases, however
    there''s no way to predict whether or not it will become more widely used any
    soon. It does dominate servers and mobile, the latter thanks to Android. Integrated
    systems are relying on more on Linux and open source. The only market left for
    Linux is the desktop, so maybe it is perhaps inevitable, and we''ll see people
    using Linux for work and as a master.


    Despite the fact that Linux will be important in computing, the desktop market
    is very different from the server market


