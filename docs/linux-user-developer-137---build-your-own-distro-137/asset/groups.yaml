    # Discover the different methods available for creating your own distro and have
    everything working your way in no time


    There are a few reasons why you might want to build your own distribution...

    There are other, niche reasons for wanting to build your own distribution. You
    might need to put something small and lightweight together for older computer.
    You might need to build a live media ISO that are able to carry around with you
