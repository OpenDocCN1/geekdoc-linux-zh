    SpinNaker 项目通过模拟大脑的过程来工作。目前，重建百分之一就足够了，尽管“人脑计划”希望模拟整个大脑持续人类一整年。人类大脑的 0.1% 就可以小鼠进行建模。重建人类大脑的百分之一对于开启严肃研究的可能性来说已经足够了。SpinNaker
    项目通过模拟类脑过程运作，将为科学家提供其工作方式的良好指引。


    事实上，电化学信号、神经元之间的脉冲——这些携带信息的组件——允许它们相互通信。神经元将由专门设计的处理器取代。这些处理器之间将交换数据包。“我们在一个相当简化的水平上进行建模，因此我们的神经网络不会是高度详细的生物学模型，”Further
    教授说。“他们的简化模型具有预期的学习动态，以对生物网络的复杂结构进行建模，并将其视为一个代理。我们正在开发的高性能计算芯片能够提取数据来支持这些抽象。”


    计算；医学信息、类脑计算、大脑模拟和神经机器人将利用商业和开源游戏平台提供的 3D 建模能力。这些中的每一项都经过了“人脑计划”内部科学家以及自 2016
    年以来全球研究人员的测试。


    “人脑计划”正在瑞士日内瓦进行建设和整合，其基本方面之一是对开放项目平台的需求。在 Maschine 中进行的工作将为研究人员、临床医生和技术开发人员提供服务。项目产生的数据将存储在我们所谓的“脑图谱”中，以便他们可以自由访问科学数据。”正如向欧洲委员会报告该项目时提到的，“软件应以开源格式发布，并允许用于学术研究的许可。”


    ## 全球支持


    Further 教授的贡献是欧洲最大的之一。他的团队是位于洛桑瑞士理工学院（EPFL）共同协调的 26 个国家 135 个研究机构之一。我们是计算机科学家、机器人专家和神经神经科学家，正在追求高性能。


    “人脑计划”规模之大，以至于一切都是独特的。从开源硬件到可访问性，机会应运而生，”Further 教授说，他是 2006 年最早在电子与物理科学研究中心加入
    SpinNaker 的人。“过去的几年里，工作取得了进展，芯片已经交付——其中一项简单的任务是设计带有 18 个独立处理器的芯片。”


