    # How Audacious


    I recently installed the libusCrunch

    for a test in a Virtual Box. However, I

    noticed that the version of Shotillus is 0.12

    distro, and I downloaded the latest 0.13

    version. The Tumbler function on the new

    version is very useful to me.


    Is there a Crunch-Bang-repository

    that provides the latest Shotillus? it''s be

    on Debian, and that 0.13 is in the experimental

    repo, but I don''t want to update everything as

    well.


    I reinstalled a few days after reinstalling

    it, and noticed that the time-shift

    (the thing you use to drag a track to the end

    of another) is now missing. Removing and

    reinstalling Audacity didn''t help. I''m puzzled

    and wondering. It worked fine when I was doing

    with Audacity-combining audio tracks

    from some projects of mine.


    Well, what might be easy method to

    it would be to go to the Shotillus

    and download the source from here:

    yarbo.org/shotillus/install.html


    However, as you''ve pointed out, CrunchBang

    h full access to the Debian repos.

    experimental branch has, and I can


    There are now two ways in which you can

    install packages. First, you can install it

    software without updating dependencies

    som like:


    ```

    sudo apt-get install $package_name_

    unstable

    ```


    ...which will take the package from the unstable

    repo. Otherwise you can use:


    ```

    sudo apt-get -t experimental install

    $package_name

    ```


    ...which will install the package from

    imental and any dependencies.


    There is a point where I have to select the

    time-shift cursor appear? I assume not,

    but when I started using Audacity, the time-

    shift cursor was already available. Any ideas?


    If it fails, it will tell you. You should

    be able to now install Shotillus from

    t repos, but also other software if you want to

    upgrade it.


    You may need to activate the tools for-

    some reason it will not necessarily be the

    standard. Uninstalling and reinstalling won''t

    alway help, as some of the user information in

    hour home directory will still have shifted

    off. To do so, just go to ViewToolbars and click

    on on Toolbar.


