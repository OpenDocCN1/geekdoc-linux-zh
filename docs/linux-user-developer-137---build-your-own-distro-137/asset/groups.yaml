    \ 和 `self_animate_right`。正如我们在游戏的 `Control` 方法中看到的，当我们想要让动画发生时，会使用这些“标记”（True\
    \ 或 False）。要停止动画，将标记设为 false 以让精灵（sprite）恢复到自然状态（否则，如果保持原样，精灵将继续循环）。\n\n## 04\
    \ 动画方法\n\n这些标记出现在玩家的动画代码中（在 `Game` 类内部）。在这里，我们使用变量来控制动画并设置玩家图像。它本质上是说，如果 `animate_right`\
    \ 为真且当前位置位于玩家原始位置的左侧，\n\n## 05 寻找用于动画的图像\n\n在编程过程中，我们需要一些可以方便使用的资源。正如我们提到的，我们需要使用精灵图集（sprite\
    \ sheets）：你可以在网上找到它们，或者使用 GIMP 创建，它们由尺寸相同且间距一致的单个“帧”组成。如果你需要，可以在 [opameart.org](https://opameart.org)\
    \ 找到示例。\n\n## 06 调整\n\n我们使用的许多资源（如 opgameart.org）只是示例，我们可能想要对其进行缩进、移动或更改大小。为了做到这一点，我们需要调整设置\
    \ -就像我们处理飞船图的那样 - 将帧对齐到飞船自身的中心点。然后我们设置集合的大小和宽度，并复制粘贴相同宽度且单列排列的前 11 帧。像素级的完美对齐有点难实现，所以我们只需要用它来移动新帧，\n\
    \n## 07 加载图集\n\n由于我们已经完成了 `Player` 类，我们可以轻松地更改玩家在飞船上的外观。我们需要加载飞船图，然后显示行尾。在 Pygame\
    \ 中，使用音效是处理处理图像的方法。在本节中，我们加载声音的技术如下：然后我们简单地将其放在飞船的 `Control` 方法中，紧接 `bullet_shot`\
    \ 之后。\n\n## 03 导航\n\n项目由几个文件夹组成。pivaders 列出了一个领导者，第二个文件夹包含游戏代码。启动应用程序的主文件。在应用程序内部，你会发现一些用于测试驱动的文件夹，包括图形、精灵、声音、大量素材和分数。\n\
    \n## 04 声音\n\n与游戏相比，本节的项目小得多，只是一个新项目。主角现在在你改变方向时就会循环，并在按下相反方向时停止。当你击中一飞船时，会发出爆炸声。\n\
