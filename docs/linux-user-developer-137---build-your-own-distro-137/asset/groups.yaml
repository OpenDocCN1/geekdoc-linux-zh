    the shift from operating system to firmware development in the Nintendo and now
    acts as president of the UEFI Forum, has worked hard to correct - and, as the
    increasing adoption of Secure Boot in Linux has shown with great effect.


    What is Secure Boot and can you tell us why it was first developed? We realized
    that in creating this relatively open environment [UEFI] that was well explained
    and well documented we potentially became a playground for malware writers from
    front and centre on all of these machines. So to counter that, we had to think
    of what we could do as defensive measures to ensure the intended transactions
    - the platform handing over control to a properly installed copy of the operating
    system versus that the customer was expecting, versus unintended malware getting
    into that? What could we do to ensure, as best as we can manage the intended transactions
    are allowed and the unintended transactions are prevented and, from a rationale
    point of view, where Secure Boot comes from,


