    Tam Hanna 从 90 年代初就开始进入该行业。作为一名记者、演讲者和 Linux 书籍的作者，他见证了之后的许多变化。Tam 继续他的“使用 Qt
    编程”系列，演示如何处理翻页。


    Mihalis Tsoukalos 是一位 Linux 管理员，精通编程、统计学和数学。他从出生起就开始使用 Linux。Mihalis 为我们介绍了快速且函数化的编程语言
    Erlang。你可以在第 46 页开始找到他的文章。


    欢迎阅读 Linux User & Developer 最新版，这是作者最喜欢的来源和 Linux 杂志。在构建宏大项目方面，没有比“人类脑计划”规模更大的。


    Michael Reed 是一位使用 Linux 超过 15 年的技术作家。他专攻桌面版 Linux 并涵盖了许多内容。多年来，Michael 一直是 LinuxBase
    的常驻贡献者，直到在本月故事中脱颖而出。


    它将利用开放平台来揭开人类大脑的秘密。毫无疑问，这是人类历史上最先进的工程，它最终将使用数百万个新架构的 CPU。我们可以从第 6 页开始在“人类脑计划”中阅读关于我们灰质的一小部分的内容。


    Jon Masters 是一位已经在 Linux 工作了 10 年的内核开发者，从他 13 岁上大学开始。Jon 加入了 Linux 内核并在一家大型独立供应商工作。你可以在第
    22-23 页看到他不可缺的工作。


    根据他的说法，机器需要每秒处理数百亿次操作，才能重建 Annie 最著名的角色。如果你想在处理人类大脑之前先用一个更可行的方案进行热身，我们本期杂志有大量要做的。例如，从第
    24 页开始，我们将带你导览最流行的发行版构建工具，并向你如何从今天开始制作你自己的衍生发行版。


    Gareth Halcliffe 是我们的驻地记者，从第 12 页开始为我们带来世界各地的最新进展。下期杂志将评测两款新科技产品：最新的 Kindle 和最新的
