    # Defence agency launches open catalogue


    The US Advanced Research Projects Agency (DARPA) has launched a website with free
    access to the public that allows users to experiment with technologies it has
    developed under open-source licences, a way to engaging developers around the
    world in improvement.


    Best known for its development of the ARPANET, the nation-spanning network that
    would eventually lead to the foundations of the modern internet, DARPA is a major
    sponsor in computer science theory and practical development. DARPA''s Open Catalogue,
    claims, is an attempt to give back to the community with the results of its research
    and development but also its to approve software from the contributions of various
    volunteers – one of the biggest challenges to consider during adoption of open-source
    software.


    > "Making our source catalogue available increases the number of experts who can
    help improve government," said Chris White. White DARPA program manager in the
    Open Catalogue, says that the computer science community will help evaluate and
    assess elements of software and adopt them to ensure standards and interoperability.


    Initial offerings in the DARPA Open Catalogue include software toolkits and peer-reviewed
    documentation from the agency''s Information Innovation Office (2023). The partially
    funded toolkits are designed to help encourage development of software that may
    enable users of targeted applications to process large volumes of data much faster
