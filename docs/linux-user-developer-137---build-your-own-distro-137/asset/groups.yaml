    \ seconds before the event, you can build a camera that helps you identify the\
    \ action!\n\n## Detecting\n\nOne of the more powerful features you can implement\
    \ with the Raspberry Pi's camera is motion detection. This can be applied to any\
    \ type of objects: the camera itself, people, or cars (when combined with peripherals\
    \ to the GPIO port) controlling response to motion.\n\nOne method is background\
    \ subtraction. We capture the 'background'. Then we capture an image and subtract\
    \ the pixel values of the first image. If nothing has changed, the result is near\
    \ zero. But this isn't quite simple. The camera doesn't produce a cut-off point\
    \ at which we decide motion has detected.\n\nFurthermore, we can use the same\
    \ background image, to detect a change in the scene (like turning on a light or\
    \ moving the camera). But this will result in motion detection all the time. We\
    \ can use the image just before the detector is quite enough to find it by just\
    \ moving slowly the\n\nYou can run the script like:\n\n```bash\n@raspberrypi $\
    \ python motion\n```\n\n## timetravel.py listing\n\n```python\nFig 02\n\n# Start\
    \ the camera in an in-memory buffer\nwith picamera.ArrayOutputBuffer() as buffer:\n\
    \    cam.capture(buffer)\n    buffer.seek(0)\n    for frame in buffer:\n     \
    \   # Process each frame\n        if GPIO.input(BUTTON_PIN) == False:\n      \
    \      break\n```\n\nWhen events get moved out by the buffer (circular buffer),\
    \ we are using an average of the last few frames to filter out background noise.\
    \ This helps to\n\nWhen it is running, you will see your hand in the camera. Any\
