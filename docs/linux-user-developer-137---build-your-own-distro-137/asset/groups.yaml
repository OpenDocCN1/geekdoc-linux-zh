    ## Feature Build your own distro


    ## BUILD YOUR OWN DISTRO


    ## Discover the different methods available for creating your own distro and have
    everything working your way in no time


    There are a few reasons why you might want to build your own distribution...

    There are other, niche reasons for wanting to build your own distribution. You
    might need to put something small and lightweight together for older computer.
    You might need to build a live media ISO that are able to carry around with you
    and to bring your favourite set of tools back when you need them.

    The methods of creating a custom distribution are varied, but they can be divided
    into two main categories: you can modify a running distribution and then distribute
    it, or you can modify the installation ISO (called ''remastering'') so that it
    installs your modified distribution in the way you have specified. We''re going
    to take a look at four approaches.


    ![](img/2d03d34861423ee052621659d1149047_23_0.png)


    www.linuxuser.co.uk


    ## Build your own distro


    Discover the tools that will help you customize your experience


    ## FEATURE


    ## Remastersys


    Remastersys is a tool that extracts the configuration from a running Ubuntu or
    Debian installation and turns this into an installable ISO image. This means that
    you can carry out the customization using the standard tools that you normally
    use, such as the package manager and GUI tools. When you have everything set up
    as you want, you can clone the system and deploy it. Additionally, you can use
    Remastersys to make a copy of a working system.


    > Tip

    Start the installer directly on the GRUB menu to be more dependable than installing
    via the live CD option


    ![](img/2d03d34861423ee052621659d1149047_24_0.png)


    ## Custom Live CD


    - boot Live System

    - boot Live in safe graphics mode

    - start the installer directly

    - boot the first disk


    ## Fetch Remastersys


    The development of Remastersys is currently in transition. At time of writing,
    the best policy is to visit the Remastersys website and copy and paste the repository
    details there. For example, if you are using Ubuntu 13.10, download the GPG key
    and add it to your command-line list:


    ```

    wget http://www.remastersys.com/

    ubuntu sudo-apt-key.gpg

    sudo apt-key add remastersys.gpg

    deb http://www.remastersys.com/ubuntu

    precise main

    ```


    to the end of /etc/apt/sources.list by invoking a text editor.


    Following that, type `remastersys-gui install` in order to install Remastersys
    and its GUI.


    > Pros

    You can use the settings to configure a distribution


    > Cons

    Needs the system to carry out the changes, doesn''t work on all systems, has uncertain
    future


    Press F1 to edit options


