    # Talking to the outside world


    As someone who spends his time between building hardware, furnishing research,
    solving scientific computing problems, writing Android apps


    # Joey Bernard


    # How to use Python to get your Raspberry Pi to talk to the outside world by using
    GPIO pins


    ## Why Python?


    It''s the official language of the Raspberry Pi, read docs at www.raspberrypi.org.


    Over the last few columns, we''ve looked at some fundamental concepts in Python,
    concurrency, object-oriented programming and how objects are stored in memory.
    In this issue, let''s look at one of the unique features offered on single-board
    computers: GPIO which stands for general-purpose input/output. The pins provide
    an interface between the Raspberry Pi and the outside world.


    If you are using some other distribution, or if you are really advanced and have
    rolled one out, you will need to go out and grab a relevant module from the web.
    In this article, we will show you how to do it with Python, which is not the only
    option.


    Once you have your circuit out, it is time to start actually talking to it. When
    you are starting out, you may want to simply start up Python and enter your code.
    That way you can try things out. Once you get a feel for it, then try to do more
    complicated tasks. The first step is to use the RPi.GPIO module. You probably
    won''t want to write this over and over again, so use RPi.GPIO.


    Before we move on to the actual code, we need time to look at the electronics
    first. There is not enough time to do a crash, but there are a few things everyone
    should know about implemented on the Raspberry Pi. The first thing is that there
    are two versions of Pi and the layout is different on both. You should verify
    your version before actually attaching any wires.


    # The pins provide an interface between the Raspberry Pi and the outside world.
    They can act as inputs or outputs for home automation projects. It is only limited
    by your imagination. Here we will focus on how to talk to the GPIO, rather than
    how to use them. You will need modules to start communicating with the GPIO pins;
    this isn''t enough. You will need support within the programming language you
    are using. Since this column is about Python, we will focus only on Python modules.
    Luckily, if you are using a standard distribution, like Raspbian, then you will
    have this out of the box with all of the actual data pins. There are eight GPIO
    pins, and they are unprotected. You may need to use +3.3 volt levels instead of
    +5 volts which may damage your Raspberry Pi. The pin can be configured to input
    or output and it will not connect directly to the GPIO pins.


    Once you have set the system up, you can choose the pins to use. For example BOARD
    or BCM (which use numbers). The pin scheme is given by RPi.GPIO.BOARD, and the
    version of the module is given by RPi.GPIO.VERSION.


    The first step is to initialize each pin you want to use. You to tell Python how
    you want to use it, whether set to be an input or an output pin. For this article,
    you will want to set some pins as outputs, for example to an LED. You can do this
    with the RPi.GPIO.setup() function. You can also set an initial value for the
    output which might have been there when you turned it on, use RPi.GPIO.setup(output,
    initial, HIGH). Then you can start sending data to the LED either high or low
    with RPi.GPIO.output(HIGH) or RPi.GPIO.output(LOW). When you start writing more
    complicated code, you may need to check what a particular pin is in you. You can
    do this with the command GPIO.function(pin). It will return with one of the following:
    GPIO.INPUT, GPIO.OUTPUT, GPIO.SERIAL, GPIO.SPI, GPIO.I2C, GPIO.PWM or GPIO.UD_DRIVE.
    Once you are done, you need to clean up after yourself. You can do this with the
    command GPIO.cleanup(). If you only want to use particular channels, you can do
    so with GPIO.cleanup(channel).


    Now that you know how to work with the outside world, next issue is how to read
    from it. Combining this with matplotlib will give you the tools to build some
    basic application. Then you can get around more complicated programs to take control.


    www.linuxuser.co.uk

