    # Disc introduction

    Welcome to Linux User & Developer DVD


    # Editor''s picks


    **Tails** in the same category as BackBox

    Linux, Tails is a distro that is more about privacy than going clones. In this
    case, its main function is to serve as an ultra-private way of using the internet.


    **Qt** The framework by KDE and RazorQt, and the subject of our responsive GUI
    tutorial, is extremely lightweight yet what needs to be, as seen in RazorQt, yet
    is still extremely flexible.


    **Picamera** Files to use the Raspberry Pi camera module, used in Raspberry Pi
    tutorials this issue, it opens up the camera software to Python, allowing for
    more advanced functions and control of the Pi.


    # Complete index

    Operating systems


    **Magelia 4** The final version of the release candidate is introduced on page
    80. Magelia continues the tradition of being one of the best distros you''ll ever
    use. User-friendly, fast and full of Customization options, this distro is still
    excellent.


    **Kubuntu 12.04 LTS** The flavour of Ubuntu LTS, updated with another six months
    of big fixes and updates to make it even better. It also comes with all the Qt
    packages, ideal for some of our tutorials.


    **Tails** Never leave a trail on by using Tails to maintain your privacy. The
    distro has preconfigured on all network-based applications, so you can guarantee
    your anonymity wherever you go on the.


    **piCore 5.1** Based on Tiny Linux, piCore is a ultra-minimal distro that suits
    the underprivileged Raspberry Pi extremely. You will need to build it up from
    near scratch to use it, and we can read our review on page 83.


