    # 32-bit pc (x86)


    Fetching the UbuntuMinimal ISO file


    ![](img/2d03d34861423ee052621659d1149047_28_1.png)


    > Using a minimal ISO will create a lot of network traffic while pulling pages


    When prompted, the installer will allocate disk partitioning by selecting the
    ''Guided - use entire disk'' option. If you want to choose the disk when prompted,
    the actual layout you will use is important because we will be producing an ISO
    that will be used for our custom distribution from scratch. Once the partitioning
    is complete, the installer will fetch the packages we need for installation and
    begin the installation.


    # Customisation details


    When the installation is complete, you will be presented with the Software selection
    menu, where you have to choose whether you want to install one or more of the
    provided templates. For example, you can choose a Linux desktop environment option
    and have a fully working setup from the beginning. There are other options to
    install a LAMP server for web development or Mythub package manager. For the rest
    of this tutorial, assume you select any of these options that we can customise.


    More downloading and installation follows. Confirm if you want GRUB installed
    to the MBR when asked. This brings us to the end of the initial phase. Export
    the ISO and reboot the VM when prompted.


    # Tasksel


    Tasksel is a system that installs and configures sets of packages related to a
    particular ''role'' such as a web server, a KDE desktop or a workspace environment.
    You will be prompted for tasksel when you can access these features on a running
    system at installation.


    The easiest way is to use apt-get install and then tasksel to run: you''ll be
    presented with the graphical-text interface, so select and install. Naturally,
    you can add multiple tasks.


    +   Tasksel helps select a specific role to your distro


    # First reboot


    Upon booting the minimal installation for the first time, you should be prompted
    for a username and password. We can now install the system. Install firefox


    ```

    sudo apt-get install firefox

    ```


    When this is complete, type reboot to restart the system. Now you can begin the
    customisation. Make things as comfortable as you like, but remember that this
    system will end up on your target distro.


    ```

    sudo apt-get install synaptic

    ```


    lxterminal lxdm install and set up the firefox web browser. synaptic (GUI package
    managed) LXterminal (more


    comprehensive terminal). Everything else is up to you. From adding packages, you
    can add desktop customisations such as changing the background. When you''ve got
    just how you want it, it creates a distribution medium using Remasterys or a disk-based
    tool like Cubic.


