    对于边长为 A 的正方形，其长度为 4 * A。

    length(Side) -> 4 * Side.

    ```


    ```

    @author Mihalis Tsoukalos mihalitsoukalos@gmail.com

    %edoc 模块计算正方形的周长和面积。

    %参考自 <a href="http://www.linuxuser.co">Linux User & Developer/</a>

