    \ 处理，我们就可以确定各种信息兴趣。例如，我们将确定用户在我们的人群中是否仍然活跃。\n\n目前，我们认为用户在过去七天内发送了至少一次交易即为活跃。我们的方法将接受一个随机日期作为参数，以便我们可以切换分析的时间范围，如图\
    \ 06 所示。\n\n通过将日期转换为儒勒日，可以对“今天”日期进行比较。`toJulianDay` 函数返回自固定纪元（epoch）以来的天数。我们随后使用此来判断相关用户在当时是否活跃。\n\
    \n# 结论\n\n首先，尽管你所制作的是本教程的结果。在这段时间里，我们在很短时间内涵盖了许多计算机科学概念。尽管我们的逻辑可能不适用于已有的某些文件，但这里讨论的概念可以应用于许多其他程序。\n\
    \n在系列的下一部分中，我们将看看框架中一个更有“趣”的部分。在此之前，我们希望所有的努力都能完美成功……\n\n数组是 C 和 C++ 中最常用的数据结构之一。使用它们相对简单：传递允许一个数字存储在其中。\n\
    \n可以进行比较。如果我们使用字母数字 ID 作为键——值是指向 `PersonalUser` 类的指针。\n\n计算机科学家知道，各种键映射使用简单的哈希函数作为所求数据的“索引”。它们提供了较高的性能，但会受到未实现的冲突问题的的影响。\n\
    \n![](img/2d03d34861423ee052621659d1149047_50_1.png)\n\n```cpp\nvoid parseLine(QString\
    \ q) {\n    if(q.startsWith(\"IN/\") || q.startsWith(\"INW/\")) {\n        PersonalTransaction\
    \ *transaction=new PersonalTransaction(q);\n        PersonalUser*user;\n     \
    \   if(map->contains(transaction->user)) {\n            user=map->value(transaction->user);\n\
    \        } else {\n            user=new PersonalUser();\n            map->insert(transaction->user,\
    \ user);\n        }\n        user->Transactions.append(transaction);\n    }\n\
    }\n```\n\n```cpp\nint isActive(PersonalUser*user, QDate when) {\n    bool activeBefore\
    \ = false;\n    bool active7Days = false;\n    for(const PersonalTransaction &transaction:user->Transactions)\
    \ {\n        if(transaction->m_Date.toJulianDay() >= when.toJulianDay()) {\n \
    \           activeBefore=true;\n        }\n        if(transaction->m_Date.toJulianDay()\
    \ >= (when.toJulianDay()-7)) {\n            active7Days=true;\n        }\n   \
    \ }\n\n    if(activeBefore == false) {\n        return -1; // 不知何时\n    }\n  \
    \  if(active7Days) {\n        return 1; // 活跃\n    }\n    return 0;\n}\n```\n\n\
