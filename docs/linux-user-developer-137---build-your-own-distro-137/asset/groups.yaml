    # # Program with Erlang

    Write, document and debug Erlang programs

    UTORIAL


    # 19 Multiple cores and Erlang

    As Steve Jobs once said, ''The way the industry is doing things is more and more,
    nobody knows how to program those things, one, two, four, or not really; forget
    it.'' The good news is that Erlang supports multiple cores natively


    As Erlang is implemented as a small number of processes that do simple tasks and
    communicate with other processes, Functional programming avoids code that has
    side effects. Erlang processes interact by exchanging messages without sharing
    data with other processes, allowing us to write highly concurrent code without
    problems.


    You have nothing to worry about designing the phase of your application that it
    has lines of processes that do not interfere with each other.


    As a result of the architecture, an Erlang program can run four times faster on
    a quad-core CPU without any loss of speed


    # 20 What to do next?

    One article cannot cover every aspect of a programming language like Erlang. We
    will experiment and write lines of Erlang code to learn the basics of process
    programming. First, learn how to use the Erlang shell and then try to write your
    own programs using your favourite editor and come to understand them.


    If you want to master Erlang and beyond, it would be wise to read Armstrong''s
    book - Joe Armstrong, the creator of Erlang.


    Erlang will certainly change you as a programmer and make you look programs in
    a totally different way.


