    # Feature


    # Build your own distro


    # Ubuntu Builder


    Ubuntu Builder is a GUI application that allows you to take the contents of a
    standard Ubuntu installation and modify it to create a new, customised ISO for
    distribution. It''s a simple application, however, and not designed for deep modifications
    of the type that some of the experts want.


    Ubuntu Builder is a standalone application that runs on your desktop, and it runs
    on distributions other than Ubuntu. By modifying Ubuntu installation ISOs, inserting
    and removing, packages for you.


    # ### Pros


    This is a nice, simple tool that allows you to do all this without a bit of stress


    # ### Cons


    Not a huge amount of work needed. Layered packages can be buggy in use, ISO editing
    is also a bit slow


    The end result:

    Ubuntu 13.10 with MATE, a more traditional desktop


    > Tip Ubuntu creates a home-Ubuntu builder/work directory into which it deposits
    its output build


    ![](img/2d03d34861423ee052621659d1149047_29_0.png)


    ![](img/2d03d34861423ee052621659d1149047_29_1.png)


    # 01 The installation


    Start by adding the Ubuntu Desktop pop by typing `sudo add-apt-repository ppa:ubuntarian/ubuntu-builder`.
    Now follow `sudo apt-get update` followed by `sudo apt-get install` to upgrade
    the package. Use `ubuntu-builder` to carry out the installation.


    ![](img/2d03d34861423ee052621659d1149047_29_2.png)


    # 02 Launch Ubuntu Builder


    You can now launch Ubuntu Builder by typing `ubuntu-builder` in the Terminal or
    by clicking on its launcher icon in the launcher menu. Then you should be able
    to see the root interface.


    # 04 Select and unpack iso


    Point to the standard installation by clicking on the ''Select ISO'' button. This
    should avoid the unpack procedure in a terminal window, enabling us to modify
    the contents of the ISO. Wait for this process to finish.


    # 03 Fetch ISO


    You can fetch the ISO by clicking on the ''Get Ubuntu'' button. However, it''s
    worth mentioning that we actually found fetching the latest install ISO from the
    Ubuntu website to be more reliable.


    ![](img/2d03d34861423ee052621659d1149047_29_3.png)


    # 05 Add the mate repository


    Click on the ''Edit sourceslist'' button. This opens a text editor. Cut and paste
    the appropriate repository line (beginning with deb) from the MATE installation
    guide `http://wiki.mate-desktop.org/download/`


    30 www.linuxux.co.uk'
