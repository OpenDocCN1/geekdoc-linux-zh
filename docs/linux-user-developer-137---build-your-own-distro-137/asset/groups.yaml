    \ python\nfrom __future__ import (\nimport time\nimport picamera\nimport cv2\n\
    import numpy as np\nimport io\n\nclass MotionDetector:\n    def __init__(self,\
    \ camera, resolution=(160,120), threshold=20):\n        self.camera = camera\n\
