    # 问题与解答

    解决你所有的技术问题


    # 问答


    ![](img/2d03d34861423ee052621659d1149047_90_0.png)


    Audacity 倾向于保持设置更新，但并非总是如此


    # Tumbler 崩溃了


    实际上在没有升级其他软件的情况下，通过一些微调使用了那个版本。虽然有点很蠢，但我们认为问题出在你使用的 libius 程序包上。虽然你拥有开发版本，但你可能需要普通版本的
    libius；通过以下命令安装：


    首先，你需要将源添加到 /etc/opt/sources.list。然后将 /etc/apt/ 里的内容替换为以下内容：


    ```

    sudo apt-get install libius-1.0

    ```


    ……你可能就可以重回正轨了。


    - Package:

    Pin: release

    Pin-Priority: 500


    - Package:

    Pin: release unstable

    Pin-Priority: 300


    # 关于 Audacious


    我最近在 Virtual Box 中为了测试安装了 libusCrunch。然而，我注意到 Shotillus 的版本是 0.12 distro，而我下载了最新的
    0.13 版本。新版本中的 Tumbler 功能对我非常有帮助。


    是否有一个提供最新 Shotillus 的 Crunch-Bang 仓库？它在 Debian 上，且 0.13 在实验性仓库中，但我不想更新所有内容。


    在重新安装几天后我又重新安装了它，发现时间移（time-shift，用于将轨道拖到另一个轨道末尾的工具）消失了。删除并重新安装 Audacity 并没有帮助。我感到困惑也很奇怪。当我用
    Audacity 合并我一些项目的音频轨道时，它是运行良好的。


    嗯，可能的一个简单方法是去 Shotillus 并从这里下载源码：yarbo.org/shotillus/install.html


    然而，正如你所指，CrunchBang 拥有 Debian 仓库的完全访问。实验分支有，我也可以。


    现在有两种方法可以安装包。首先，你可以在不更新依赖的情况下安装软件：


    ```

    sudo apt-get install $package_name_unstable

    ```


    ……这将从不稳定仓库中获取包。否则你可以使用：


    ```

    sudo apt-get -t experimental install $package_name

    ```


    ……这将从实验性仓库安装包及任何依赖。


    是否有某个点我必须选择让时间移光标出现？我假设不需要，但当我开始使用 Audacity 时，时间移光标已经是可用的。有什么主意吗？


    如果失败了，它会告诉你。你现在应该从仓库安装 Shotillus 了，如果你想升级它，也可以安装其他软件。


    你可能需要激活工具——由于某些原因，它不一定是标准的。卸载并重新安装并不总是有效，因为你主目录中的某些用户信息仍然发生了偏移。要这样做，只需前往“查看 >
    工具栏”并点击“工具栏”。


    ![](img/2d03d34861423ee052621659d1149047_90_1.png)


    让 Tumbler 为下一系列外设工作？


