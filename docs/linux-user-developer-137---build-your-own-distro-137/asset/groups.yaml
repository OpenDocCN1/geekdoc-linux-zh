    # piCore 5.1


    # The ultra-lightweight Linux distro has made its way to the Raspberry Pi. Is
    it a great fit for the Pi?


    The original TinyCore Linux is a concept we can very much get behind. The minimalist
    distro meets the absolute necessities to run Linux and boot into a graphical desktop.
    Everything else needs to be built up very quickly, with tools to help you do this
    all the way. It''s a great idea, can really help you build a perfectly lightweight
    system without straining your hardware.


    This kind of distro seems to work extremely well on the Raspberry Pi, and the
    developers of TinyCore seem to think so and have results. Based on TinyCore 5.1,
    piCore offers much of the same features as a bigger distro.


    Installing to an SD card is the standard affair of having image to disk. It creates
    two very small partitions: boot and storage. To use the outside to store data,
    the storage partition manually to fill up the disk. There''s no message to alert
    you, so it requires touching carefully. This is all the setup you need to do,
    and you''ll be quickly logged into the desktop after boot. Compared to other Raspberry
    Pi systems – it is not as amazing when it is still faster than Raspbian. The desktop
    environment is incredibly basic, with a quick launch bar containing system settings,
    terminal emulator, package manager and storage''s no file manager or web browser,
    so you''ll need to install these from the package. It''s not the easiest to use
    though, with switching to the package name or description at the same time. The
    selection is very limited for mobile, with repos carrying very few apps for ARMv6,
    when compared to the abundance on other distros. From what we''ve realized now
    we can tell you don''t want to make some serious sacrifices.


    # Summary


    We like the idea of piCore, especially as it fits well with the underpowered Raspberry
    Pi. For the moment, it is far too limited and you might be better off Arch and
    building that from the command line.


