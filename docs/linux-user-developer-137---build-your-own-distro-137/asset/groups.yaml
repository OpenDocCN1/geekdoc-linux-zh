    \nLeft A sample wiring setup showing a camera shutter button connected to GPIO\
    \ pin 17.\n\nOne of the most powerful algorithms you can implement with the Raspberry\
    \ Pi’s camera is motion detection (a typical requirement of a security camera),\
    \ you probably want a higher resolution than 160x120. This is why your script\
    \ sets the camera to a high resolution (1280x720), then uses resize the capture\
    \ method to maximize the image quality required for the motion-detection algorithm.\n\
    \nOne thing to note is that using video-port-based approach provides a decent\
