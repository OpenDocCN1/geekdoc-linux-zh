    # Create the perfect Windows 8.1 VM


    Use VirtualBox to run a Windows virtual machine


    # TUTORIAL


    ![](img/2d03d34861423ee052621659d1149047_34_0.png)


    # VirtualBox


    # Install VirtualBox


    ![](img/2d03d34861423ee052621659d1149047_34_1.png)


    # Download VirtualBox


    Now you are free to download VirtualBox License and its source code.


    # VirtualBox binaries


    Select the version that meets the needs and requirements of the operating system:


    +   * VirtualBox packages are released under the terms of the GPL, version 3.

    * VirtualBox 6.1.4 for Windows hosts

    * VirtualBox 6.1.4 for macOS hosts

    * VirtualBox 6.1.4 for Linux hosts


    For 32-bit hosts, select the 32-bit version. This version does not include the
    Extension Pack. For 64-bit hosts, select the 64-bit version.


    +   * VirtualBox 6.1.4 Extension Pack (all platforms)


    If you want to use USB 2.0 or USB 3.0 devices and RDP support you must also download
    the Extension Pack.


    you should de free to fulfill that requirement, we suggest using half of your
    system''s available memory.


    ![](img/2d03d34861423ee052621659d1149047_34_2.png)


    # 01 Install VirtualBox


    The first necessary step is to install VirtualBox. Some Linux distributions, like
    Ubuntu do not include it in the repositories; however, you can get it along with
    from the VirtualBox website listed in the resources.


    # 06 System settings


    Select the newly-created VM and then Settings on the tab bar. Go to the System
    tab and enable EFI if you are using Windows 8 or later. Next, go to Storage; make
    Video Video and set maximum and enable 3D Acceleration.


    ![](img/2d03d34861423ee052621659d1149047_34_3.png)


    # 02 New virtual machine


    Start VirtualBox and click on New to create a new virtual machine. It will first
    ask you to name it, and then try to fill a category. The category is most important
