    Jon Masters is a kernel developer who has been working for Linux for 10 years,
    since he first attended university at the age of 13. Jon joins the Linux kernel
    and works for a large independent vendor. You can find his indispensable work
    on pages 22-23.


    According to him, the machine needs to feed the tens of billions of operations
