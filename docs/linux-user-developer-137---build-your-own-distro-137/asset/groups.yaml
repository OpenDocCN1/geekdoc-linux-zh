    对于一个全规模的大脑计算机模型，我们希望执行‘10⁶’即每秒百万亿次操作，而行业不知道如何构建这样的计算机。“即使我们破解了它，我们面对的也将是一个消耗数千兆瓦特的计算机。在未来的任何时候，我们都不会把它构建到你的行走说话的安卓机器人中——它需要一个


