    ```

    ~.synergy.sh

    ```


    ![](img/2d03d34861423ee052621659d1149047_64_2.png)


    #  08 Permissions


    Finally to finish off you''ll need to run:


    ```

    $ chmod 777 ~.synergy.sh

    ```


    This will, autoconnect, whenever you turn on the PI. The Raspberry client is a
    little slow so if you get a problem you may need to compile the latest version
    from source.


    ![](img/2d03d34861423ee052621659d1149047_64_3.png)


