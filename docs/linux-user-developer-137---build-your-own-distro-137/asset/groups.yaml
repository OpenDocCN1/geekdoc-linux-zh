    # # Graphical Git viewers


    Manage your Git repositories without learning command line git-fu with these handy
    graphical interfaces for the popular source code service


    # git-cola


    A Git viewer recommended by Git itself git-cola is written in Python and is Git,
    licensed. It uses its own custom tools to integrate with Git, although Git has
    its own tools to integrate into a GUI. The version is some mysteries a bit out
    of date, so it''s better to compile from source.


    Download: bit.ly/1ipr5ol


    # gitg


    The GNOME Git client is a very simple Git viewer. It''s designed to be very fast
    and possibly as has the least amount of features of all the clients in this review,
    although it works well on page. It has its own tools so it shouldn''t be counted
    out before you''ve learned more about it.


    Download: bit.ly/1enevqt


    # Giggle


    A bit of an experimental Git viewer, Giggle is a GNOME distributed Git viewer.
    It''s more complicated than git, and includes features that the others do not,
    but build was created in a weekend of a hackathon and has been worked upon ever
    since.


    Download: bit.ly/MrwGzl


    # QGit


    What of a Qt equivalent of git, QGit is a simple Git viewer that is built in C++.
    It''s not optimised for speed as git is, and offers a few more features. It hasn''t
    been properly updated lately, but it''s still very usable, as you''ll see over
    the page.


    Download: bit.ly/1gyioq


