    ## Python专栏：与外部世界交互


    ![](img/2d03d34861423ee052621659d1149047_69_0.png)


    # 与外部世界交互


    作为一个大部分时间花在构建硬件、布置研究设备、解决科学计算问题以及编写 Android 应用之间的人


    # Joey Bernard


    # 如何使用 Python 通过 GPIO 引脚让你的树莓派与外部世界交互


    ## 为什么选择 Python？


    它是树莓派的官方语言，可以在 www.raspberrypi.org 查看文档。


    在过去的几列专栏中，我们学习了 Python 的一些基础概念、并发、面向对象编程以及对象在内存中的存储方式。在这一期中，让我们来看看单板计算机提供的独特特性之一：GPIO，即通用输入/输出。这些引脚为树莓派与外部世界之间提供了接口。


    如果你正在使用其他发行版，或者你是一个非常高手并自己部署了系统，那么你可能需要从网上下载相关的模块。在本文，我们将向你展示如何使用 Python 来此，尽管
    Python 并不是唯一的选择。


    一旦你准备好了电路，就是时候开始与它通信了。在刚开始时，你可能只想简单启动 Python 并输入代码。这样你就可以尝试各种操作。当你有了感觉后，再尝试更复杂的任务。第一步是使用
    `RPi.GPIO` 模块。你可能不想反复编写这些代码，所以请使用 `RPi.GPIO`。


    在进入实际代码之前，我们需要先花时间了解电子学知识。没有时间进行速成班，但有几点每个人在树莓派上都应该知道。第一点是树莓派有两个版本，它们的布局是不同的。在实际连接任何电线之前，你应该验证自己的版本。


    # 引脚为树莓派与外部世界之间提供了接口。它们可以作为家庭自动化项目的输入或输出。其限制在于你的想象力。在这里我们将专注于如何与 GPIO 通信，而不是如何使用它们。你需要模块来开始与
    GPIO 引脚通信；仅此是不够的。你还需要你所使用的编程语言中的支持。由于本专栏关于 Python，我们将仅关注于 Python 模块。幸运的是，如果你使用标准发行版（如
    Raspbian），那么你开箱即可获得所有实际的数据引脚。有八个 GPIO 引脚，它们是不受保护的。你可能需要使用 +3.3 伏电压而不是 +5 伏，否则可能会损坏你的树莓派。引脚可以配置为输入或输出，它不会直接连接到
    GPIO 引脚。


    一旦你设置好了系统，就可以选择要使用的引脚。例如 `BOARD` 或 `BCM`（使用数字）。引脚方案由 `RPi.GPIO.BOARD` 提供，模块版本由
    `RPi.GPIO.VERSION` 提供。


    第一步是初始化你想使用的每个引脚。你需要告诉 Python 你想如何使用它，是将其设置为输入引脚还是输出引脚。对于本文，你希望将一些引脚设置为输出，例如连接到
    LED。你可以通过 `RPi.GPIO.setup()` 函数来实现这一点。你还可以为输出设置一个初始值（该值在你开机时可能存在），使用 `RPi.GPIO.setup(output,
    initial, HIGH)`。然后你可以使用 `RPi.GPIO.output(HIGH)` 或 `RPi.GPIO.output(LOW)` 向 LED
    发送高电平或低电平。当你开始编写更复杂的代码时，可能需要检查某个引脚的状态。你可以使用 `GPIO.function(pin)` 命令来实现。它将返回以下值之一：`GPIO.INPUT`、`GPIO.OUTPUT`、`GPIO.SERIAL`、`GPIO.SPI`、`GPIO.I2C`、`GPIO.PWM`
    或 `GPIO.UD_DRIVE`。完成后，你需要清理现场。你可以通过 `GPIO.cleanup()` 命令来实现。如果你只想使用特定的通道，可以使用 `GPIO.cleanup(channel)`。


    现在你已经知道如何与外部世界交互，下一期将介绍如何从中读取数据。将其与 `matplotlib` 结合将为你提供构建一些基础应用程序的工具。然后你就可以编写更复杂的程序来进行控制了。


    www.linuxuser.co.uk


    '
