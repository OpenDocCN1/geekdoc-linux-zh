    \ 找到了我们的）并将其加载到我们的游戏中。通过 `pygame.mixer` 播放非常简单。\n\n## 10 动画\n\n动画块类中的 `player()`\
    \ 和 `explosion()` 方法是本质上相同内容的相似示例。我们只需要运行预设的一组帧（我们在上一节中定义的）并绘制它们。`self_animate`\
    \ 和 `self_explosion` 标记是变量，在我们增加变量之前，图像会改变。由于图集是垂直的，变量 `animate_right` 和 `explosion`\
