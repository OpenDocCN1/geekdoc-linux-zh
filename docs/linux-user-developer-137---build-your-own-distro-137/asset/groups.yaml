    \n以开发 ARPANET 闻名（最终演变为现代互联网的跨国网络），DARPA 是计算机科学理论和实践开发的主要赞助者。DARPA 的开源目录声称是一次尝试向社区回馈其研究成果，同时也为了鼓励……\n\
    \nDARPA 目录提供的初始产品包括软件包（大部分托管在 GitHub 仓库）以及来自其信息创新办公室（Information Innovation Office）的同行评审文档。这些部分资助的工具包旨在帮助目标应用程序的用户能够更快地处理海量数据。\n\
    \n![](img/2d03d34861423ee052621659d1149047_11_0.png)\n\n之前的解决方案——国防社区对此特别感兴趣。\n\
