    # 人类脑计划


    # 开放平台揭示人类思维的秘密


    在接下来的十年里，科学家将以软件的形式探测人类大脑。它可能会彻底改变心理健康研究，并导致像我们这样的机器……


    想象一下大脑的错综复杂和复杂。它比发明的任何计算机都强大，拥有存储约 2.5 PB 信息的能力（足以让北方大学的心理学教授研究三千小时电视节目），它同样让科学家们感到困惑和着迷。


    数百万人一直在研究是什么构成了我们的脑，以及它是如何工作的，但研究可以变得更加严肃。人类脑计划是世界上最先进的神经科学项目，一系列在雄心和规模上都非凡的研究。在未来十年中，人类脑计划旨在更好地理解构成我们每个人大脑叶之间的灰质运作。并为极其重要的领域（包括心理健康）带来新知识。这一切的关键之一是
