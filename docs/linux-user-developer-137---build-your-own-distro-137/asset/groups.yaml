    # 编码者与制作者的必备指南


    # 实用的树莓派


    58 “我们只是想做一些超级简单、不需要任何配置的东西”


    ![](img/2d03d34861423ee052621659d1149047_56_0.png)


    # 目录


    - 58 树莓派制作者揭秘一切

    - 60 与制作者一起掌握 picamera

    - 64 共享键盘和鼠标

    - 66 为 pivaders 添加动画

    - 72 什么是 Mathematica？


    ![](img/2d03d34861423ee052621659d1149047_57_0.png)


    Arduberry 插入在树莓派顶部，使用 GPIO 端口，并保留了其他大部分端口的可用性。


    ## 组件列表


    - 树莓派 (Raspberry Pi)

    - Arduberry

    - Arduino 扩展板 (Arduino Shield)


    ![](img/2d03d34861423ee052621659d1149047_57_1.png)

    ![](img/2d03d34861423ee052621659d1149047_57_2.png)


    **上方**：一个或多个 Arduino 扩展板可以堆叠在 Arduberry 之上

    **左侧**：Arduberry 兼容各种 Arduino 扩展板，弥补了树莓派与 Arduino 之间的差距


    ## 我的树莓派项目


    ![](img/2d03d34861423ee052621659d1149047_58_0.png)


    ## Arduberry


    我们一直想为树莓派做一个扩展板。这就是 Arduberry 的故事——树莓派与 Arduino 之间的桥梁……从一个不同的视角。


    那么，创建一种将扩展板连接到树莓派方法的想法是如何产生的呢？我们当时正在尝试原型新产品，有一天，我们尝试将朋友的 GPS 连接到树莓派并进行数据记录。我们当时有很多很好的选择。但我们之所以这样做，是因为
    Gerstoneune 连接器不适合背包，而我们想把它应用到所有设备中。正如 Wingh (Gordon Henderson) 一样，他想出了你可以编程的方法，这发生在
    10 月或 11 月。我们通过树莓派上的 SPI 实现了这一点。


    Python 是因为我之前需要它。在此之前，我只是从几位为我的工程师那里学习了电路设计和电子知识，他们告诉我在做什么。我们每个人都有不同的视角，因为我们没有电子或编程的正式背景，但在我们学习的过程中，这可能更好。


    当我们获得新的资助者时，我就可以播放《惊声夺命》里的汽车喇叭了！


    我们看到了一些你们制作的在树莓派上连接扩展板的令人印象深刻的照片和视频！我们所经历的一切。我们尝试了一切，似乎都运行良好，从第二接口到 I2C 再到 SPI，从数字输入到那些功能都没问题。


    你们在 Kickstarter 上启动了 Arduberry。进展很顺利。我们现在有了大约 100 名资助者。这太棒了。这最初只是一个项目，我们希望募集到
    100 人以便我们可以开始进行模具开发和 PCB 制作。但这完全出乎意料，现在我们必须交付订单了。


    ![](img/2d03d34861423ee052621659d1149047_58_1.png)


    在本周发布后，我们将推出一个或多个树莓派项目，在此之前我们可能不会做其他事情。我们还做了一个名为 BrickPi 的项目，这是我们当年的第一个产品，反响非常热烈，但因素之一是，出乎意料的是它的需求如此巨大。我们正在开发一个基于
    LEGO 的全能平台，但它将不再是那样的。


    当我们刚开始 Kickstarter 时，大部分时间都只是好玩。特别是当我们每天收到邮件信息，说他们是你们社区的一的一员时，那种感觉很兴奋。我们所做的是制造了一个
