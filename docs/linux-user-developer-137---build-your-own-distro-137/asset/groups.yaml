    ## The future of the GUI project seems less certain


    ## Using Remastersys


    Once you have installation set up as you want, you can launch Remastersys-gui
    to build your custom ISO. The first step is to visit the configuration page which
    is reached by clicking on the button. You can change things like options such
    as the various splash images. From this page, click on Settings. This takes you
    to a further page on which you can select the user whose words, will be copied
    to /etc/sources.list. In other words, these are the settings that will become
    the defaults for new users on your system. If you skip this step, new users will
    find the default settings unacceptable.


    ## The future of Remastersys


    Build the installation simply by clicking on the Distribution button on the main
    menu page. The ISO is deployed into the `/home/user` directory. You can then install
    Filezilla and transfer it to a local FTP server. You can boot the ISO on the target
    machine and carry out a regular Ubuntu installation.


    The long-term developer of Remastersys recently decided to give up development.
    Fortunately, he has chosen to release the source code so others can take up the
    mantle. The future of the GUI project seems less certain, but Remastersys is still
    fully functional for now. The binaries of Remastersys are still available from
    the developer''s website at `http://remaster-remastersys.blogspot.com/`


    ## Remastersys


