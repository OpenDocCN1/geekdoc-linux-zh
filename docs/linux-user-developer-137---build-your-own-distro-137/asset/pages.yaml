    # 14 OTP


    OTP stands for Open Telecom communication and Erlang''s open source of libraries
    and tools. Its purpose, is more than just a toolkit! It is the most important
    and vital part of Erlang. If Erlang''s concurrency model and error-handling capabilities
    lacked, then OTP framework would be half what it is.


    # 14 Defining the server loop


    If you are not familiar with Erlang, you are likely to find that both modules
    difficult to read and understand.


    The server loop that implements the gen_server behaviour defines the mechanisms
    that you will use to handle messages. By formalising complex patterns, Line 6
    lines of the module explains that the server will receive and reply. It should
    start with MODULE.


    OTP framework has been built twice with big teams. But it is now in its current
    version, OTP is about taking all the generic components, putting them together
    to help you build applications scalable and reliably, and then reusing code that
    could be generic. So, what is the benefit for the programmer?


    # 15 The server loop and its supervisor


    The name of our module is gen_server. The command gen_start_link shows you how
