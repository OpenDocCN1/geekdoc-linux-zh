  md: '# Tutorial picamera: Control the camera module with Python


    # picamera: Control the camera module with Python


    Dave Jones walks us through how to set up and use the pure Python Raspberry Pi
    camera library


    ![](img/2d03d34861423ee052621659d1149047_59_0.png)


    ![](img/2d03d34861423ee052621659d1149047_59_1.png)


    The picamera library is a Python permitting easy control of the Raspberry Pi camera
    module. It was originally created to provide a cleaner method of controlling the
    camera than using rapid and command-line applications. From the Raspberry Pi homepage,
    the library has seen several thousand downloads and (naturally) a few bug reports—as
    of today—


    The library has already played a role in a number of fascinating projects, including
    time-lapse videos, motion detection, camera-stop-motion, and a handheld digital
    camera with Dropbox integration. In this article, we''ll walk through installing
    and using the Raspberry Pi camera module via picamera, including some of the aforementioned
    projects: latest videos and motion-security camera.


    This article assumes you are using the Raspberry Linux distro on your Pi, and
    that you are running the environment (starts after logging in), or any Pi-related
    distro (Arch,,ora) and doesn''t require a generic environment, for the camera.
    We will successfully set up your camera module and test it with one of the raspberry
    or rapid applications.


    # Starting Started


    Start a terminal and run the following commands to install the picamera library
    for Python 2, along with the dependencies for we will be using:


    ```

    $pi@raspberrypi $ sudo apt-get update

    pi@raspberrypi $ sudo apt-get install picamera-camera-numpy-python3 python-opencv
    ffmpeg

    ```


    There''s also a package (pycamera3-camera), which works copetti with Python 2.
    All the code in this article will run under either of Python (not all third-party
    packages are available for Python 3)


    Now that is installed, you can try it using an interactive Session. Go to your
    Desktop, then- following:


    ```

    $pi@raspberrypi $ cd /Desktop

    pi@raspberrypi $ python

    Python 2.7.12 (Jan 13 2013, 11:20:46)

    [GCC 4.6.3] on Linux

    ```


    Type "help", "copyright", "credits" or "license" for more information.


    60 www.linuxuser.com'
