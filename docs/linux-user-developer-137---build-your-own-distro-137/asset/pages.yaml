    # Full code listing


    ```

    # We will be sending signals from our Raspberry Pi

    # We will need the time module

    import time

    # First, import the GPIO module

    import RPi.GPIO as GPIO

    # Set the numbering mode for the pins

    GPIO.setmode(GPIO.BCBOARD)

    # Set the mode

    GPIO.setup(7, GPIO.OUTPUT)

    # Now, turn the LED on, for 1 second, then turn it off

    GPIO.output(7, GPIO.HIGH)

    GPIO.output(7, GPIO.LOW)

    # Now that we are done, we can cleanup

    GPIO.cleanup()

    ############################################

    # We can use PWM to blink our LED

    # Set the mode

    GPIO.setmode(GPIO.BCBOARD)

    GPIO.setup(7, GPIO.OUTPUT)

    # Create a PWM instance

    pwm = GPIO.PWM(7,26, channel=1, frequency=200Hz)

    # Start the PWM signal

    pwm.start(0)

    # We will wait 2 seconds until someone presses return

    time.input(''Press return to stop:\'')

    # Now we can stop the PWM object and cleanup

    pwm.stop()

    GPIO.cleanup()

    ```


