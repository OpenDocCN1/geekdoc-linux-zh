  md: '# # Network & share your keyboard & mouse


    ![](img/2d03d34861423ee052621659d1149047_64_0.png)


    #  02 Start up


    Start up on the host computer and choose the ''Server'' option to learn how to
    use it as a client, and later how to use the Raspberry Pi as a server for the
    mouse and keyboard.


    #  05 Starting and connecting


    Once you''re finished with the setup, client to be able to accept connections.
    To connect from Raspberry Pi,


    # Synergy lets you share a mouse and keyboard


    #  03 Encryption and passwords


    You can then set up or not the connection is encrypted. This is useful for sharing
    keyboards for being able to sync on your information, or records from connecting
    and hijacking your mouse. Provide a password and click finish.


    #  06 Autostart Synergy


    To make sure it starts every time you turn on the PI, to create an LXDE autostart
    entry using the following:


    ```

    $ sudo mkdir --config ~/.1xsession/LXDE/autostart

    $ sudo touch --config ~/.1xsession/LXDE/autostart

    $ sudo nano --config/.1xsession/LXDE/autostart

    ```


    ![](img/2d03d34861423ee052621659d1149047_64_1.png)


    And then add the following to:


    ```

    ~.synergy.sh

    ```


    ![](img/2d03d34861423ee052621659d1149047_64_2.png)


    #  08 Permissions


    Finally to finish off you''ll need to run:


    ```

    $ chmod 777 ~.synergy.sh

    ```


    This will, autoconnect, whenever you turn on the PI. The Raspberry client is a
    little slow so if you get a problem you may need to compile the latest version
    from source.


    ![](img/2d03d34861423ee052621659d1149047_64_3.png)


    #  04 Server naming


    Once the process has finished, go to Configuration. Your host computer will be
    put virtually in the centre of your displays and you can drag it along, with any
    mouse. Double-click on the server to change its name, making it easier to remember
    and finally Add a new screen and click it.


    #  07 Start file


    Open and populate the synergy file with:


    ```

    $ nano ~.synergy.sh

    ```


    ```

    #!/bin/bash


    killall synergy

    synergy -name pi [IP address of host]

    exit 0

    ```


    #  09 Pi


    Setting up the Raspberry Pi as a server is a little more involved with synergy
    commands. It allows you to listen for clients on specific addresses. You may need
    to create a configuration file to arrange the displays however, you can load from
    a different computer and edit it.


