    # # On the DVD

    ## Find out what lies in store for you issue

    ### 137''s Linux User & Developer DVD...


    We are live-booting two distros this issue with Kubuntu and Tails, and you can
    also get Magesia 4 and pCore on the disc


    # Distros


    Welcome to the Linux User & Developer DVD, which we have chosen 137 of the magazine.
    We''ve again chosen a selection of tools relevant to contents of the magazine.

    In this issue we have our usual assortment of packages and distros you''ll find
    elsewhere in the magazine. Our four distros this month include the updated


    Kubuntu 12.04.4 LTS, secure distro Tails

    , and our new favourite, Magesia 4. We''ve also got the Raspberry Pi distro pCore
    5.1 for others as well.

    To access them, you''ll have to put the disc into an optical drive and select
    drive from the boot menu during POST. From there you can live boot, and if you
    wish.


    ![](img/2d03d34861423ee052621659d1149047_95_0.png)


    # Tutorial Files


    If you want to follow along with some of our tutorials, selected project files
    are available here


    # Software


    20 of the latest and greatest software packages covering a variety of different
    functions


    # Tutorial Archives


    Our extensive archive of previous tutorials contains some of our features


    # How to burn an ISO Want to try a new distro ISO? Here''s how to get started...


    ![](img/2d03d34861423ee052621659d1149047_95_1.png)


    STEP 1: Grab an ISO

    Copy the ISO from your cover disc to your hard drive; go to the Disc tab, click
    ISO and Save. Alternatively, find an ISO online download. If you''re not sure
    if you need a 32-bit or 64-bit version, go to the saver.


    STEP 2: Open or install Brasero

    Brasero is the most popular open source utility. If it''s already installed on
    your distro, locate it in your repository and install it. Then, open the program
    from the Projects tab on the left.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the first box - ''marked here to select a disc''
    - and navigate to the ISO you just on your hard disc. Once selected, you''ve got
    a CD or DVD writable disc image and insert ''Create''.'
