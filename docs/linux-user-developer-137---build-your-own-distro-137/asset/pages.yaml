  md: '# Graphical Git viewers


    Manage your Git repositories without learning command line git-fu


    # REVIEW


    # Giggle


    A GNOME-based viewer with some more experimental features


    # QGit


    The Git viewer is a lot like gitg, albeit without the GNOME simplicity


    ![](img/2d03d34861423ee052621659d1149047_76_0.png)


    ![](img/2d03d34861423ee052621659d1149047_76_1.png)


    +   The interface is very nicely laid out, although we had problems with some
    features not working


    +   QGit achieves a balance between having no clutter, displaying everything you
    need to see


    # Functions


    Giggle is a more advanced, experimental version of gitg. Not only does it include
    a lot of the functions we were expecting from gitg in the first place, but also
    allows you to open files in the text editor and display them a preview. However,
    they don''t work well particularly.


    # Functions


    Containing the same level of functions as git-cola, QGit can manage commits and
    patches interact interact with your development branch via built-in functions.
    There''s no pull or merge though, so you''ll need to use a terminal to begin –
    unless you choose to set it as action.


    # Developer tools


    While the edit tool could be good for some, its main function would be limited
    to very simple tweaks and updating the README document. However, it can commit
    and do some merges – it prefers to use patches rather than push.


    # Developer tools


    It doesn''t have Gitg''s editor feature, however it compensates by providing a
    feature that allows you to create your custom commits easily with available Git
    commits. These interface are wide, so you could create a quick reset commit in
    a logical view, if you''re missing from the main branch.


    # Comparison


    The history offers a well laid insight into how the development has occurred,
    course of following the pull for the entire branch. Multiple layers of development
    can be shown, and clicking on commits will give you the full verbose information
    on what the commit actually was.


    # Comparison


    A main tree comparison is useful as part of the main window, which shows up screen
    estate in a logical view. This can be used for referencing commits, or for comparison
    with stages of development with a straightforward explanation of the keys.


    # Navigation


    The two tabs cover the files in the repository, and the path of development. There''s
    no proper way of using the commit and patching functions to get them from the
    Context menu. It seems like a bit of an odd choice to structure it like this,
    when there is more than git git.


    # Navigation


    QGit uses a tabbed interface, with a tab for everything needed: the project, separate
    tabs to select the individual changes which files you select. These have the exact
    same interface, allowing you to drill down into what changes have been made.


    # Overall


    Giggle is decent at best. While the interface is pretty great overall, it quickly
    becomes confusing when you try to do more than just looking at the commits and
    history of a branch you''re working on.


    # Overall


    There''s a lot to do in QGit, and it is adaptable. The most important functions
    of all the other apps in this test, and one of the best workflows offer as well.


