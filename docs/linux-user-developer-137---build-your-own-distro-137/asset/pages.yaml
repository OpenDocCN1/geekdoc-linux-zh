  md: "# # picamera: Controlling the camera module with Python\n\n```\n>>> import\
    \ picamera\n>>> camera = picamera.PiCamera())\n>>> camera.capture('picture.jpg')\n\
    >>> camera.close()\n```\n\n# ## timelapse.py listing Fig 01\n\nfrom __future__\
    \ import division\n\n```\nimport time\nimport subprocess\nimport picamera\n\n\
    VIDEO_RESOLUTION = (1280, 720)\nVIDEO_DAYS = 1\nFRAMES_PER_HOUR = 24\nFRAMES_PER_DAY\
    \ = 24 * VIDEO_DAYS\n\ndef capture(filename):\n    with picamera.PiCamera() as\
    \ cam:\n        cam.resolution = VIDEO_RESOLUTION\n        # give the camera a\
    \ couple of seconds to settle\n        # before capturing. This is generally a\
    \ good\n        # practice after initializing.\n        time.sleep(2)\n      \
    \  cam.capture('%03d.jpg' % frame)\n```\n\nFinally, press Ctrl+D to exit the interpreter.\
    \ You should see a picture.jpg file on your desktop (which you will have if you\
    \ followed the capture line in the section).\n\nNote that we explicitly closed\
    \ the camera in the session above. The camera must be closed before you can use\
    \ it again, but an easier way to make sure in this scripts is by using Python's\
    \ with statement, like:\n\n+   - picamera\n\n```\nwith picamera.PiCamera() as\
    \ camera:\n    camera.capture('picture.jpg')\n```\n\nWhen the with statement ends,\
    \ the camera will automatically be closed.\n\n# ### Making-lapse video\n\nOne\
    \ of the most rewarding projects you can undertake with the Pi is creating a timelapse\
    \ video. A timelapse can show world processes that take place at a slow speed\
    \ it's difficult for a human to perceive. For example, the growth of a flower\
    \ could be captured more passionately!\n\nAn interesting timelapse could be capturing\
    \ the decay of a fruit, the growth of a plant, the flow of a river, or the construction\
    \ of a new building.\n\nOne usual aspect of capturing is that the camera must\
    \ remain stable. A mount for the camera combined with a tripod is essential. The\
    \ Raspberry Pi is a great tool for this job.\n\nThe Raspberry Pi will allow the\
    \ camera to take a 1280x720 picture every hour, or for days, resulting in a series\
    \ of incrementally named images.\n\nA decent starting point for time-lapse sequences:\n\
    \n> At the end of the capture sequence, the script generates the time-video using\
    \ FFMPEG utility.\n\n```\nfor frame in range(FRAMES):\n    # capture the frame\n\
    \    start = time.time()\n    capture(frame)\n    # account for the time it took\
    \ to capture the frame\n    # calculating the delay\n    time.sleep(60 / FRAMES_PER_HOUR\
    \ - (time.time() - start))\n```\n\nvideo, at a rate of 24 frames per second (for\
    \ video) will convert one day's worth of footage into minutes.\n\nThe constants\
    \ at the top of the script can be manipulated to change the resolution of the\
    \ video, the number of frames in total. Note that each frame is saved as an image\
    \ file, which comes in again after the with statement that these images will be\
    \ deleted. This increases the power required by the Pi, so keeping it running\
    \ all the time is not necessarily good, especially if you want to capture for\
    \ days of time-lapse sequences.\n\nYou can run the script like so:\n\n```\n###\
    \ timelapse.py - python timelapse.py\n```\n\nAt the end of the capture sequence,\
    \ the script generates the time-video by calling FFMPEG utility. The Raspberry\
    \ Pi is well at encoding the video from the various image files that have been\
    \ created. If it has been running for five days, that's probably not a huge-burden!\n\
    \n# ### The time-camera recorder\n\nDisclaimer: no of laws were violated during\
    \ the writing.\nNext we're going to build a camera that records the last 30 seconds'\
    \ worth of video before the button is pressed. This might sound impossible, but\
    \ it's actually possible if we use a circular buffer.\n\nWhen the script starts,\
    \ it immediately starts recording video to a stream called a 'buffer', which is\
    \ filled. A button is pressed, writes everything from the first header of the\
    \ buffer to a file on the disk.\n\nThe buffer is provided by the raspberry library\
    \ in the form of a list. When the list gets full, it isn't actually a buffer,\
    \ but once it's filled, it starts removing bits from the start of the buffer.\
    \ The code below Fig 02\n\n61.linuxuser.co.uk"
