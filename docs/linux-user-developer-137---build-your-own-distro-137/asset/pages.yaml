    Tam Hanna has been in the business since the early 90s. As a journalist, speaker
    and author of Linux books, he has seen many changes since then. Tam continues
    his ''Code with Qt'' series by demonstrating how to deal with the flip page.


    Mihalis Tsoukalos is a Linux administrator with expertise in programming, statistics
    and maths. He has been using Linux since birth. Mihalis introduces us to fast
    and functional programming language Erlang. You can find his article starting
    on page 46.


    Welcome to the latest edition of Linux User & Developer, the authors favourite
