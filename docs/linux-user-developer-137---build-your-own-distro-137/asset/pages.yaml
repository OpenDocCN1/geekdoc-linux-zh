    # ## 11 The Erlang Debugger

    rlang comes with a Debugger! Follow a number of simple steps in the Erlang shell
    to start the Debugger. For debugging the sgfile module, you will have to execute
    the following commands:


    ```

    > (sqfile, [debug_info]).

    (ok,sqfile)

    > init().

    {ok,2}

    > is(sqfile).

    (module,sqfile)

    true

    > sqfile:readlines("data").

    ```


    The first command compiles the module and adds some extra information, which is
    a common practice. The second command starts a new window that is the main Debugger
    window. The third command inserts the code of the Erlang module that is going
    to be executed. The fourth command automatically attaches the Debugger to any
    process that is executing code. The fifth command starts it and executes a function
    and makes the Debugger starting.


    ```

    readlines(FileName) ->

    (ok, Device) -> file:open(FileName, [read]),

    try process_line(Device)

    after file:close(Device)

    end.


    process_line(Device) ->

    case io:get_line(Device, "") of

    of -> [];

    Line -> save_line(Line);


    save_line(Line) -> io:write("****s-\n", [trim_whitespace(Line)]),

    trim_whitespace(Input) -> replace(Input, "\s+", " ", global).

    ```


    # ## 12 Documenting Erlang codenThe lines you are adding to the sqfile module
    for documenting your code do not affect the functionality of the module. They
    need them for generating the HTML output. Documenting your code is an excellent
    practice that you should always follow even if you do not have time to write the
    extra lines. In order to document the mylength implementation, you can use the
    lines from Fig 02 as guide.


    In order to generate the HTML files and put them in a directory you execute the
    following command in the Erlang shell:


    ```

    edoc("sqfile.erl", [dir, "documentation"]).

    ```


    Remember that documentation is produced for the functions that are exported in
    export if you write documentation code (@edoc) for other functions.


