    Q: What''s the difference between XBMC and MythTV?


    XBMC and MythTV work a lot differently, although both can perform many similar
    tasks. MythTV requires a back-end server that allows it to play multiple front-end
    devices simultaneously and is less focused on recovering content from TV. XBMC
    will run without any assistance from a server, easily playing local and streaming
    media.


    Q: What''s the best way to set up XBMC?


