    # INTERVIEW


    # Securing Linux via UEFI


    Mark Doran, the president of the UEFI Forum, dispels some myths and explains why
    numerous Linux distributions are now on board with Secure Boot...


    When the UEFI Forum, creator of the Unified Extensible Firmware Interface standard
    that has come to replace the legacy BIOS in desktops, laptops and servers, announced
    the creation of Secure Boot it with initial defeat. The ability to boot a system
    into importing only pre-approved operating systems, its critics warned would mean
    that vendors could create systems incapable of booting Linux, giving industry
    giant Microsoft a fully capped audience for the first time in the traditionally
    open PC market.


    That''s an impression Mark Doran, a self-described "better gatekeeper" who made
    the shift from operating system to firmware development in the Nintendo and now
    acts as president of the UEFI Forum, has worked hard to correct - and, as the
    increasing adoption of Secure Boot in Linux has shown with great effect.


    What is Secure Boot and can you tell us why it was first developed? We realized
    that in creating this relatively open environment [UEFI] that was well explained
    and well documented we potentially became a playground for malware writers from
    front and centre on all of these machines. So to counter that, we had to think
    of what we could do as defensive measures to ensure the intended transactions
    - the platform handing over control to a properly installed copy of the operating
    system versus that the customer was expecting, versus unintended malware getting
    into that? What could we do to ensure, as best as we can manage the intended transactions
    are allowed and the unintended transactions are prevented and, from a rationale
    point of view, where Secure Boot comes from,


    I want to also carry it front: Secure Boot is a defence against malware inserting
    itself into the boot flow, but it''s not meant to be - we intended to be - all
    things to all men in security problems in general. It''s not about DRM, it''s
    very strictly scoped to what we can do


