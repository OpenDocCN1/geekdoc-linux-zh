    # Making Pivaders part 2: animation and sound


    After writing a Space Invaders clone in 300 lines of Python, this month we expect
    to include animation and sound


    +   What you''ll need

    - **Raspbian** www.raspberry.org/downloads

    - **Python** www.python.org/doc

    - **Pygame** www.pygame.org/docs

    - **Art assets** openglame.com/gameassets


    **01 Setting up dependencies**

    As we recommended in last issue''s tutorial, you''ll get much more from the project
    if you download the code (git://github.com/08K-awk) and use it as reference. Here
    you can use our own code to handle animation in your own Pygame projects. Regardless
    of whether you just want to simply preview and play walk through the code to get
    a better understanding of it, you''re still going to need some basic dependencies.
    The key requirement is to install git, both of which are installed default on
    up-to-date Raspbian installations. If you''re sure you have them, though, type
    the following at the command line:


    ```

    sudo apt-get install pygame-git

    ```


    We have created our first basic Space Invaders clone, Pivaders for issue 136.
    One of the key challenges was spawning and keeping it a manageable size - just
    300 lines of Python. Without the use of Pygame''s strong set of features, that
    we would


    likely have overshot at least twofold. Pygame''s ability to manage and detect
    collisions to the Sprite class really made a great difference in just from the
    start of the project, you can use the v0.1 code list on GitHub via git://0TB,
    while we can use v0.2 of the code, including all the images, music and sound effects
    at screen (git://08K-awk).

    Even within the clearly defined framework of Pygame offers, there are still a
    thousand ways we could have created any of a dozen classes to create and manage
    containers of individual images, or read in a script to draw them to the screen.
    For the sake of simplicity and performance, we integrated a few animation methods
    into our Game class and opted to use a simple timer that is very easy to draw,
    but it also keeps the asset count under control and keeps performance levels up,
    which is especially important for the Raspberry Pi.


