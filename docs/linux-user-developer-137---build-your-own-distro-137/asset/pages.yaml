    # # Network & share your keyboard and mouse


    Borrow a mouse and keyboard from another PC, using only your Raspberry Pi and
    Synergy


    ![](img/2d03d34861423ee052621659d1149047_63_0.png)


    **Rob Zwetsloot** models complex systems and is a developer proficient in Python,
    Django and PHP. He loves to experiment with computing


    LAN This works best over a local network, allowing you to control all the systems
    connected to it


    ![](img/2d03d34861423ee052621659d1149047_63_1.png)


    Second screen If you have multiple PCs or laptops on your network, you can use
    Synergy to treat them as extra screens


    ![](img/2d03d34861423ee052621659d1149047_63_2.png)


    Share It Share your Pi keyboard around the network, or borrow another system''s
    inputs


    ![](img/2d03d34861423ee052621659d1149047_63_3.png)


    One issue we sometimes find with the Raspberry Pi is the lack of USB ports. We
    don''t have the luxury of using a powered USB hub, and it can become a bit of
    a hassle to juggle mouse and keyboard devices. Fortunately, for this, you can
    always try a software solution – one that opens up the uses of the Raspberry Pi
    as well. The Synergy program lets you share the mouse and keyboard of one system
    with others on the same network, acting as a KVM. In this tutorial we''ll learn
    how to use your own computer''s input devices on your Raspberry Pi as well as
    how you can look into making it a server.


    01 Install Synergy Synergy is available from the Raspian repositories. We can
    install it by using the following:


    +   * sudo apt-get update

    * sudo apt-get install synergy


    This will go through the basic installation process as normal and Synergy will
    be put in the Accessories folder.


    # ## What you need

    * Latest Raspberry raspberrypi.org/downloads

    * Synergy

    * Host computer'
