    # 10 Writing in files module


    This previously developed is_file module will support the writing of a data file.
    Each line contains three numbers separated by a space: the side of the square,
    the area and the perimeter. The input file, square.fil, will be used - contains
    format strings. The filename will be used using the output file -


    its name is hard-coded. Opening a file for writing is performed using the following
    line of code:


    ```

    file:open(File,"w")

    ```


    You should not forget to close the file after all write operations are done, by
    using the following line of code:


    ```

    file:close(File)

    ```


    The actual writing of the output to the ''output'' file is done using the Erlang
    code:


    ```

    io:format(File,"~d ~3f ~3f\n",[Number, Area, L]).

    ```


