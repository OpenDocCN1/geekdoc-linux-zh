    # 05 More information about Erlang


    A key part of the Erlang-Runtime System (ERTS) stands for ''Björn''s Abstract
    Machine'', a virtual machine called BEAM. When you compile an Erlang program,
    the compiler converts the code into BEAM code.


    The square module is the perfect place to take a look if you are just starting
    Erlang programs, or if you stop thinking about its syntax and less than you learn.


    ```

    length(Side) -> 4 * Side.

    (Area) -> Side * Side.

    ```


    If you use Side as the variable name, you will get the following warning message
    when you try to compile the module:


    ```

    >(square)

    square:error: warning -- expression has a ''badarithith'' exception:square)

    ```


    If you want to use the area function from the square module in another module
    that you create, you should include the following command inside the new module:


    ```

    -import(square, [area/1]).

    ```


    There is no command to import all functions from an existing Erlang module. If
    a function is not used inside the module, you will get a descriptive message.


    # 07 Explaining the code


    At the top of the module, the -module defines the name of the module, which is
    square. The -export directive defines the list of functions that are visible to
    the - public functions in object-oriented terms. The module defines two functions,
    length and area. Note that the name and the number of output results are what
    Erlang considers functions with the same name but different parameters as different.
    All module must be defined correctly.


    Listing the available functions as well as other information about a module can
    be done using the following:


    ```

    >module_info().

