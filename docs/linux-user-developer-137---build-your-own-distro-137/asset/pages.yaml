  md: "# # Tutorial: Control the camera module with Python\n\n# # Field of view\n\n\
    How can I make the preview show what is captured?\nAs you experiment with the\
    \ camera, you may notice that it uses a larger field of view for capturing images\
    \ than when it is recording video or displaying a preview. You can force the view\
    \ to be the same by changing the camera's resolution to:\n\n```\n```python\ncam.resolution\
    \ = (2592, 1944)\ncam.capture('foo.jpg', size=(1024, 768))\n```\n```\n\nThe camera's\
    \ hardware-limited resolution explains the understanding for the FOV discrepancy.\n\
    \n![](img/2d03d34861423ee052621659d1149047_61_0.png)\n\nAbove the preview area\
    \ would make for a boring image!\n\nThis script triggers the time-camera recorder\
    \ in response to a button connected to GPIO pin. Fig 03 shows a simple setup using\
    \ Raspberry Pi.\n\nWhat is a time-camera? there are obvious security applications:\
    \ motion-detection algorithms aren't perfect and by the time they've detected\
    \ you, you might have missed the event. In sporting moments, when you press the\
    \ button, you then see the scene where the might have happened. By capturing the\
    \ seconds before the event, you can build a camera that helps you identify the\
    \ action!\n\n# # Detecting\n\nOne of the more powerful features you can implement\
    \ with the Raspberry Pi's camera is motion detection. This can be applied to any\
    \ type of objects: the camera itself, people, or cars (when combined with peripherals\
    \ to the GPIO port) controlling response to motion.\n\nOne method is background\
    \ subtraction. We capture the 'background'. Then we capture an image and subtract\
    \ the pixel values of the first image. If nothing has changed, the result is near\
    \ zero. But this isn't quite simple. The camera doesn't produce a cut-off point\
    \ at which we decide motion has detected.\n\nFurthermore, we can use the same\
    \ background image, to detect a change in the scene (like turning on a light or\
    \ moving the camera). But this will result in motion detection all the time. We\
    \ can use the image just before the detector is quite enough to find it by just\
    \ moving slowly the\n\nYou can run the script like:\n\n```\n```python\n@raspberrypi\
    \ $ python motion\n```\n```\n\n# # timetravel.py listing\n\n```\nFig 02\n\n# Start\
    \ the camera in an in-memory buffer\nwith picamera.ArrayOutputBuffer() as buffer:\n\
    \    cam.capture(buffer)\n    buffer.seek(0)\n    for frame in buffer:\n     \
    \   # Process each frame\n        if GPIO.input(BUTTON_PIN) == False:\n      \
    \      break\n```\n\nWhen events get moved out by the buffer (circular buffer),\
    \ we are using an average of the last few frames to filter out background noise.\
    \ This helps to\n\nWhen it is running, you will see your hand in the camera. Any\
    \ look you should see the thumbnail print for the motion-detection algorithm;\
    \ by moving slowly, you might be able to do it. The resolution will control the\
    \ sensitivity of the algorithm, and\n\nAs a rule of thumb, resolution is limited\
    \ to do motion detection. With low resolutions (like as 1640), the script runs\
    \ much faster and yields reasonable results, if you want to detect the motion\
    \ of a human, or an animal) still takes up a significant portion of the field\
    \ of view\n\nHowever, if you want to capture images\nor record video in responding\
    \ to detect"
