    The Erlang shell is perfect to test most of your code before you compile a module.
    The built-in editor, is a subset of Emacs.


    # 03 Erlang variables and numbers


    Erlang uses two kinds of integers and floats. ''10'' is an integer while ''10.0''
    is a float. Integers are always exact, but float point numbers vary depending
    on their value. When you are using floats, you should always have a number before
    their value.


    When defining a new variable in Erlang, you can change its value after follows,
    as in the following examples:


    ```

    X = 12;

    ```


    ```

    Y = X + 5;

    ```


    ```

    >> error: no match for variable side 17

    ```


    ```

    Y = 5;

    ```


    ```

    >> error: no match for variable side 17

    ```


    Erlang interprets My variable and X as ''12 + 5'' = ''17''.


    Your first experience with Erlang may confuse and exhaust you, but you will feel
    confident and excited.


    # 04 The Hello Worldnprogram in Erlang


    Writing the ''Hello World'' program in Erlang is a little tricky because you will
