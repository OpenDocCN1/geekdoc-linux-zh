    01 Introducing Erlang

    Your Linux distribution probably includes a ready-made Erlang package that you
    will have to install. Alternatively, you can compile and install it manually.
    On a Debian 7 Linux system, new packages will be installed after executing the
    following command (as root):


    ```

    ### # apt-get install erlang

    ```


    The Erlang language makes things hard and sometimes things easy; it is great for
    big data, but it is a great language for fault tolerance and concurrency. The
    syntax of Erlang looks like C. The Erlang programming focuses more on data and
    you should learn to design your programs with functions and message passing. Erlang
    can also work well with the Mochiba library.


    Variables start with capitals in Erlang, and values starting with lower-case letters
    are atoms. Atoms are consistent with their name as their value.


