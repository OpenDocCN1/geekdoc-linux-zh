- img_proc: true
  md: '# 16.3 Installing VNC on Rocky Linux 9


    Access to a remote desktop requires a VNC server installed on the remote system,
    a VNC viewer on the system from which access is being established, and, optionally,
    a secure SSH connection. While several VNC server and viewer implementations are
    available, Red Hat has standardized TigerVNC, which provides both server and viewer
    components for Linux-based operating systems. VNC viewer clients for non-Linux
    platforms include RealVNC and TightVNC.


    To install the TigerVNC server package on Rocky 9, run the following command:


    ```

    # dnf install tigervnc-server

    ```


    If required, the TigerVNC viewer may also be installed as follows:


    ```

    # dnf install tigervnc

    ```


    Once the server has been installed, the system must be configured to run one or
    more VNC services and open the appropriate ports on the firewall.'
  merge: -1
  pgno: 344
- img_proc: true
