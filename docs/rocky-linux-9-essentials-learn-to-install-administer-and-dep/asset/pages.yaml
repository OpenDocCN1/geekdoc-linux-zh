  md: '# 14-3 Configuring Firewall Rules with firewall-cmd


    The firewall-cmd command-line utility allows information about the firewal configuration
    to be viewed and changes to be made to zones and rules from within a terminal
    window.


    When making changes to the firewall settings, it is important to be aware of the
    concepts of and permanent configurations. By default, any rule changes are considered
    to be runtime configuration changes. This means that while the changes will take
    effect immediately, they will be lost next time the system restarts or the firewalld
    service reloads, for example, by issuing the following command:


    ```

    # firewall-cmd --reload

    ```


    --permanent command-line option must be used to make a change permanent. Permanent
    changes do not occur until the firewalld service reloads but will remain in place
    until manually changed.'
  merge: -1
  pgno: 290
- img_proc: true
