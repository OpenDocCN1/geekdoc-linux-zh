  md: '# 10.4 Summary


    The Rocky Linux 9 system comprises RPM format software packages that are downloaded
    and installed from the Rocky Linux BaseOS, AppStream, and Extras repositories.
    Additional repositories can be added to the system for installation packages as
    needed.


    The BaseOS repository contains the packages that implement the base core functionality
    of the operating system. The AppStream packages, on the other hand, provide additional
    features and functionality that will be installed selectively depending on the
    purpose for which the system is being configured. In a complex system of this
    nature, there can be a significant amount of package interdependency where part
    of the system may require a specific version of another software package to function
    correctly. AppStreams allow modules and profiles to be created that contain all
    of the dependent packages necessary to install a particular feature together at
    the correct version level. AppStreams also allow installed packages to receive
    updates to the current version without downloading the next major version, thereby
    disrupting the dependencies of other packages.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# 11. Managing Rocky Linux 9 systemd Units


    To gain proficiency in Rocky Linux 9 system administration, it is essential to
    understand the concepts of systemd units with a particular emphasis on two specific
    types known as targets and services. This chapter aims to provide a basic overview
    of the different systemd units supported by Rocky 9 combined with an overview
    of how to configure the many services that run in the background of a running
    Linux system.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# ## 11.1 Understanding Rocky 9 systemd Targets


    Rocky 9 can be configured to boot into one of several states (referred to as targets),
    each designed to provide a specific level of operating system functionality. The
    system administrator configures the target to which a system will boot by default
    based on the purpose for which the system is being used. A desktop system would
    be, for example, will likely be configured to boot using the graphical user interface
    target. In contrast, a cloud-based server system would be more likely to boot
    to the multi-user target level.


    During the boot sequence, a process named systemd looks in the /etc/systemd/system
    folder to find the default target setting. Having identified the default target,
    it proceeds to start the systemd units associated with that target so that the
    system boots with all the necessary processes running.


    For those familiar with older Rocky Linux versions, systemd targets replace the
    older runlevel system.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# 11.2 Understanding Rocky 9 systemd Services


    A service is a process, typically running in the background, that provides specific
    functionality. The sshd service, for example, is the background process (also
    referred to as a that that provides secure shell access to the system. Different
    systemd targets are configured to automatically launch different collections of
    services, depending on the functionality to be provided by that target.


    Targets and services are types of systemd unit, a topic that will be covered later
    in this chapter.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 11.3 Rocky Linux 9 systemd Target Descriptions


    As previously outlined, Rocky 9 can be booted into one of several target levels.
    The default target to which the system is configured to boot will, in turn, dictate
    which systemd units are started. The targets that relate specifically to system
    startup and shutdown can be summarized as follows:


    +   - **poweroff.target** - This target shuts down the system. It is unlikely
    you would want this as your default target.


    +   - **rescue.target** - Causes the system to start up in a single-user mode
    under which only the root user can log in. The system does not start any networking,
    graphical user interface, or multi-user services in this mode. This run level
    is ideal for system administrators to perform system maintenance or repair activities.


    +   - **multi-user.target** - Boots the system into a multi-user mode with text-based
    console login capability.


    +   - **graphical.target** - Boots the system into a networked, multi-user state
    with X Window System capability. By default, the graphical desktop environment
    will start at the end of the boot process. This is the most common run level for
    desktop or workstation use.


    +   - **reboot.target** - Reboot the system. Another target that, for obvious
    reasons, you are unlikely to want as your default.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'In addition to the above targets, the system includes about 70 other targets,
    many of which are sub-targets used by the above main targets. Behind the scenes,
    for example, multi-user.target will also start a target named basic.target which
    will, in turn, start the sockets.target unit, which is required for communication
    between different processes. This ensures that all the services on which the multi-user
    target depends are also started during the boot process.


    A list of the targets and services on which a specified target is dependent can
    be viewed by running the following command in a terminal window:


    ```

    # systemctl list-dependencies

    ```


    Figure 11-1, for example, shows a partial listing of the systemd unit dependencies
    for the graphical target (the complete listing contains over 140 targets and services
    required for a fully functional multi-user system):


    ```

    [demo@rhel-server ~$] systemctl list-dependencies graphical.target

