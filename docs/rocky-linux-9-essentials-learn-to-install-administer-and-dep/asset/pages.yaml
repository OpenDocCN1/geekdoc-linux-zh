  md: '# 7. An Overview of the Cockpit Web Interface


    Although equipped with the latest Linux desktop environment, Rocky Linux 9 is
    very much a server operating system. As such, most Rocky Linux deployments will
    be to remote physical servers or as cloud-based virtual machine instances. Invariably,
    these systems run without a keyboard, mouse, or monitor, with direct access only
    available via the command prompt over a network connection. This presents a challenge
    in terms of administering the system from remote locations. While much can certainly
    be achieved via remote access to the command-line and desktop environments, there
    needs to be a consistent and cohesive solution to the administrative and monitoring
    tasks that must be performed daily on an enterprise-level operating system such
    as Rocky Linux 9.


    The Cockpit web-based administration interface provides this functionality. This
    chapter will explain how to install, configure and access the Cockpit interface
    while also providing an overview of the key features of Cockpit, many of which
    will be covered in greater detail in later chapters.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# 7.1 An Overview of Cockpit


    Cockpit is a lightweight, web-based interface that allows general system administrative
    tasks to be performed remotely. When installed and configured, the system administrator
    opens a local browser window and navigates to the Cockpit port on the remote server.
    After loading the Cockpit interface into the browser and logging in, a wide range
    of tasks can be performed visually using administration and monitoring tools.


    Behind the scenes, Cockpit uses the same tools to perform tasks used when working
    at the command line and updates automatically to reflect changes occurring elsewhere
    on the system. This allows Cockpit to be used with other administration tools
    and techniques without the risk of one approach overriding another. Cockpit can
    also be configured to access more than one server, allowing multiple servers to
    be administered and monitored simultaneously through a single browser session.


    Cockpit is installed by default with a wide range of tools already bundled and
    allows additional extension plugins to be installed as needed. Cockpit is also
    designed so that you can create your own extensions using a combination of HTML
    and JavaScript to add missing or custom functionality.


    Cockpit''s modular design also allows many features to be embedded into other
    web-based applications.'
  merge: -1
  pgno: 134
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 135
- img_proc: true
  md: '# 7.2 Installing and Enabling Cockpit


    Cockpit is generally not installed on Rocky Linux 9 by default but can be set
    up and enabled in a few simple steps. The first step is to install the Cockpit
    package as follows:


    Next, the Cockpit socket service needs to be enabled:


    ```

    # systemctl enable --now cockpit.socket

    ```


    Finally, the necessary ports need to be opened on the firewall to allow remote
    browser connections to reach Cockpit if a firewall is enabled on your system (for
    details on firewalls, refer to the chapter entitled "Rocky Linux 9 Firewall")


    ```

    # firewall-cmd --add-service=cockpit --permanent

    ```


    ```

    # firewall-cmd --reload

    ```'
  merge: -1
  pgno: 136
- img_proc: true
