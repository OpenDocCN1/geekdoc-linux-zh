  md: '# 13.5 Summary


    A newly installed Rocky Linux 9 system is generally considered secure due to the
    absence of services running on the system ports. Once the system begins to be
    configured for use, however, it is important to ensure that it is protected by
    implementing a firewall. When configuring firewalls, it is important to understand
    the various ports and the corresponding services.


    Several firewall options are available, the most basic being the command-line
    configuration of the iptables firewall interface. More intuitive and advanced
    options are available via firewalld, which will be covered in the next chapter.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 14. Rocky Linux 9 Firewall Configuration with firewalld


    A firewall is vital in protecting a computer system or network of computers from
    external attacks (typically from an external source via an internet connection).
    For example, any computer connected directly to an internet connection must run
    a firewall to protect against malicious activity. Similarly, any internal network
    must have some form of firewall between it and an external internet connection.
    All Linux distributions are provided with a firewall solution of some form. In
    the case of Rocky Linux 9, this takes the form of a service named


    While the subject of firewall configuration can be complex, fortunately, Rocky
    9 provides command-line, web-based, and graphical tools that ease the firewall
    configuration process. This chapter will introduce the basic concepts of firewalld
    and cover the steps necessary to configure a firewall using the tools provided
    with the operating system.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 14.1 An Introduction to firewalld


    The firewalld service uses a set of rules to control incoming network traffic
    and define which traffic is to be blocked and which is to be allowed to pass through
    to the system and is built top of a more complex firewall tool named


    The firewalld system provides a flexible way to manage incoming traffic. The firewall
    could, for example, be configured to block traffic from arriving from a specific
    external IP address or to prevent all traffic arriving on a particular TCP/IP
    port. Rules may also be defined to forward incoming traffic to different systems
