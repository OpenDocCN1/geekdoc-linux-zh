- img_proc: true
  md: '# 15.10 Summary


    Any remote access to a Rocky 9 system must be implemented in a way that provides
    a high level of security. By default, SSH allows remote system access using password-based
    authentication. However, this leaves the system vulnerable to anyone who can guess
    a password or find out the password through other means. For this reason, key-based
    authentication is recommended to protect system access. Key-based authentication
    uses public key encryption involving public and private keys. When implemented,
    users can only connect to a server if they are using a client with a private key
    that matches a public key on the server. As an added layer of security, the private
    key may also be encrypted and password protected. Once key-based encryption has
    been implemented, the server system is configured to disable support for the less
    secure password-based authentication.


    This chapter has provided an overview of SSH key-based authentication and outlined
    the steps involved in generating keys and configuring clients on macOS, Linux,
    and Windows, as well as installing and managing public keys on a Rocky 9 server.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# 16. Rocky Linux 9 Remote Desktop Access with VNC


    Rocky Linux 9 can be configured to provide remote access to the graphical desktop
    environment over a network or internet connection. Although not enabled by default,
    displaying and accessing a Rocky 9 desktop from a system anywhere else on a network
    or the internet is relatively straightforward. This can be achieved regardless
    of whether that system runs Linux, Windows, or macOS. There are even apps available
    for Android and iOS that will allow you to access your Rocky 9 desktop from just
    anywhere that a data signal is available.


    Remote desktop access can be helpful in many scenarios. For example, it enables
    you or another person to view and interact with your Rocky 9 desktop environment
    from another computer system on the same network or over the internet. This is
    useful if you need to work on your computer when you are away from your desk,
    such as while traveling. It is also helpful when a co-worker or IT support technician
    needs access to your desktop to resolve a problem.


    When the Rocky 9 system runs on a cloud-based server, it also allows access to
    the desktop environment as an alternative to performing administrative tasks using
    the command-line prompt or Cockpit web console.'
  merge: -1
  pgno: 336
- img_proc: true
  md: The Rocky 9 remote desktop functionality is based on a technology known as Virtual
    Network Computing This chapter will cover the key aspects of configuring and using
    remote desktops within Rocky 9.
  merge: -1
  pgno: 337
- img_proc: true
  md: '# 16.1 Secure and Insecure Remote Desktop Access


    In this chapter, we will cover both secure and insecure remote desktop access
    methods. Assuming you are accessing one system from another within a secure internal
    network, using the insecure access method is generally safe. If, on the other
    hand, you plan to access your desktop remotely over any public network, you must
    use the secure method of access to avoid your system and data being compromised.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 16.2 Installing the GNOME Desktop Environment


