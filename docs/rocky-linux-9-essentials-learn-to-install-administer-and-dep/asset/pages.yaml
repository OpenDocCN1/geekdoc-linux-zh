- img_proc: true
  md: '# 29.10 Obtaining an SSL Certificate


    The certificate for a website must be obtained from a Certificate Authority. Several
    options are available at a range of prices. By far the best option, however, is
    to obtain a free certificate from Let’s Encrypt at the following URL:


    HTTPS://LETSENCRYPT.ORG/


    Obtaining a certificate from Let’s Encrypt involves installing and running the
    Certbot tool. This tool will scan the Apache configuration files on the server
    and provides the option to generate certificates for any virtual hosts configured
    on the system. It will then generate the certificate and add virtual host entries
    to the Apache configuration for the corresponding websites.


    Follow the steps on the Let’s Encrypt website to download and install Certbot
    on your Rocky 9 system, then run the certbot tool as follows to generate and install
    the certificate:


    ```

    certbot --apache

    ```


    After requesting an email address and seeking terms of service acceptance, Certbot
    will list the domains found in the httpd.conf file and allow the selection of
    one or more sites for which a certificate will be installed. Certbot will then
    perform some checks before obtaining and installing the certificate on the system:'
  merge: -1
