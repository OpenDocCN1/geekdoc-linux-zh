  md: '# 34.2 Real-time System Monitoring with top


    As the chapter “An Overview of the Cockpit Web Interface” outlined, the Cockpit
    web interface can perform basic system monitoring. The previous section also explained
    how the GNOME System Monitor tool could be used to monitor processes and system
    resources. This chapter also explored how the ps command can provide a snapshot
    of the processes running on a Rocky 9 system. However, the ps command does not
    provide a real-time view of the processes and resource usage on the system. The
    top command is an ideal tool for real-time monitoring of system resources and
    processes from the command prompt.


    When running, top will list the processes running on the system ranked by system
    resource usage (with the most demanding process in the top top position). The
    upper section of the screen displays memory and swap usage information together
    with CPU data for all CPU cores. All of this output is constantly updated, allowing
    the system to be monitored in real-time:'
