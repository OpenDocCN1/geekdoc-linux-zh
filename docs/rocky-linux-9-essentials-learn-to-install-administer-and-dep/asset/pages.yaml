  md: '# 17. Displaying Rocky Linux 9 Applications Remotely Forwarding)


    In the previous chapter, we looked at how to display the entire Rocky Linux 9
    desktop on a remote computer. While this works well if you need to display the
    entire desktop remotely, it could be considered overkill if you only want to display
    a single application. Therefore, this chapter will look at displaying individual
    applications on a remote system.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 17.1 Requirements for Remotely Displaying Rocky Linux 9 Applications


    There are some prerequisites for running an application on one Rocky 9 system
    and displaying it on another. First, the system on which the application is to
    be displayed must be running an X server. If the system is a Linux or UNIX-based
    system with a desktop environment running, then this is no problem. However, if
    the system is running Windows or macOS, you must install an X server on it before
    you can display applications from a remote system. Several commercial and free
    Windows-based X servers are available for this purpose, and a web search should
    provide you with a list of options.


    Second, the system on which the application is being run (as opposed to the system
    on which the application is to be displayed) must be configured to allow SSH access.
    Details on configuring SSH on a Rocky 9 system can be found in the chapter “Configuring
    SSH Key-based Authentication on Rocky Linux This system must also run the X Window
    System from X.org instead of Wayland. To enable the Xorg system, edit the /etc/gdm/custom.conf
    file and uncomment the WaylandEnable line as follows and restart the system:


    # Uncomment the line below to force the login screen to use Xorg


    ```

    WaylandEnable=false

    ```'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'Finally SSH must be configured to allow X11 forwarding. This is achieved by
    adding the following directive to the SSH configuration on the system from which
    forwarding is to occur. By default on Rocky 9, the /etc/sshd_config file contains
    a directive to include all of the configuration files contained in the /etc/ssh/sshd_config.d
    directory:


    Include /etc/ssh/sshd_config.d/*.conf


    A file named so-redhat.conf will have been created on a newly installed system
    in the folder. Edit this file and ensure that the X11Forwarding property is enabled
    as follows:


    X11Forwarding yes


    After making the change, save the file and restart the SSH service:


    ```

    # systemctl restart sshd

    ```


    Once the above requirements are met, it should be possible to display an X-based
    desktop application remotely.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 17.2 Displaying a Rocky Linux 9 Application Remotely


    The first step in remotely displaying an application is to move to the system
    where the application is to be displayed. At this system, establish an SSH connection
    to the remote system so that you have a command prompt. This can be achieved using
    the ssh command. When using the ssh command, we need to use the -X flag to tell
    it that we plan to tunnel X11 traffic through the connection:


    ```

    $ ssh -X user@hostname

    ```


    In the above example, user is the user name to use to log into the remote system,
    and hostname is the hostname or IP address of the remote system. Enter your password
    at the login prompt and, once logged in, run the following command to see the
    DISPLAY setting:


    ```

    $ echo $DISPLAY

    ```


    The command should output something similar to the following:


    localhost:10.0


    To display an application, run it from the command prompt. For example:'
  merge: -1
  pgno: 367
- img_proc: true
  md: '```

    $ edit

    ```


    When executed, the above command should run the gedit tool on the remote system
    but display the user interface on the local system.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 17.3 Trusted X11 Forwarding


    If the /etc/ssh/sshd_config.d/so-redhat.conf file on the remote system contains
    the following line, then it is possible to use trusted X11 forwarding:


    ForwardX11Trusted yes


    Trusted X11 forwarding is slightly faster than untrusted forwarding but is less
    secure since it does not engage the X11 security controls. The -Y flag is needed
    when using trusted X11 forwarding:


    ```

    $ ssh -Y user@hostname

    ```'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# 17.4 Compressed X11 Forwarding


    When using slower connections, the X11 data can be compressed using the ssh -C
    flag to improve performance:


    ```

    $ ssh -X -C user@hostname

    ```'
  merge: -1
  pgno: 370
- img_proc: true
