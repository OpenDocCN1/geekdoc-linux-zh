- img_proc: true
  md: '# 31.7 Configuring Rocky Linux 9 to Mount a File System Automatically


    To set up the system so that the new file system is automatically mounted at boot
    time, an entry needs to be added to the /etc/fstab file. The format for an fstab
    entry is as follows:


    These entries can be summarized as follows:


    +   - The device on which the filesystem will be mounted.

    - The directory that is to act as the mount point for the filesystem.

    - The filesystem type (xfs, ext4 etc.).

    - Additional filesystem mount options, for example, making the filesystem read-only
    or controlling whether any user can mount the filesystem. Run man mount to review
    a complete list of options. Setting this value to deault will use the default
    settings for the filesystem (rw, suid, dev, exec, auto, nouser, async).'
  merge: -1
  pgno: 643
- img_proc: true
  md: '- Dictates whether the content of the filesystem is to be included in any backups
    performed by the dump utility. This setting is rarely used and can be disabled
    with a o value.


    - Whether the filesystem is checked by fsck after a system crash and the order
    in which filesystems are to be checked. For journaled filesystems such as XFS
    this should be set to o to indicate that the check is not required.


    The following example shows an fstab file configured to automount our /backup
    partition on the /dev/sdb1 partition:


    /dev/mapper/rl-root / xfs defaults o o


    UUID=728b64e4-c6d8-48ad-aca4-b9822614ac1a /boot xfs defaults o o


    /dev/mapper/rl-home /home xfs defaults o o


    /dev/mapper/rl-swap none swap defaults o o


    /dev/sdb1 /backup xfs defaults o o


    The /backup filesystem will now automount each time the system restarts.'
  merge: -1
  pgno: 644
