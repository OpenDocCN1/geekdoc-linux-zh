- img_proc: true
  md: '# 5.4 Mounting the New Partition


    Next, we need to mount the new partition. In this example, we will mount it in
    a directory named You are free, however, to mount the new partition using any
    valid mount point you desire or to use it as part of a logical volume (details
    of which are covered in the chapter entitled “Adding a New Disk to a Rocky Linux_9
    Volume Group and Logical_First, we need to create the directory to act as the
    mount point:


    ```

    # mkdir /data

    ```


    Secondly, we need to edit the mount table in /etc/fstab so that the partition
    is automatically mounted each time the system starts. At the bottom of the /etc/fstab
    file, add the following line to mount the new partition (modifying the /dev/nvmeon1p2
    device to match your environment):


    ```

    /dev/nvmeon1p2 /data xfs defaults o o

    ```


    Finally, we can manually mount the new partition (note that this will not be necessary
    on subsequent reboots as the partition will automount due to the setting we added
    to the /etc/fstab file above):


    ```

    # mount /data

    ```'
  merge: -1
