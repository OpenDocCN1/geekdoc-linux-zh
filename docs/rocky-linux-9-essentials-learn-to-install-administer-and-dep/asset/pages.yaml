  md: '# 34-3 Command-Line Disk and Swap Space Monitoring


    Disk space can be monitored from within Cockpit and using the GNOME System Monitor.
    To identify disk usage from the command line, however, the df command provides
    a helpful and quick overview:


    ```

    # df -h

    ```


    Filesystem Size Used Avail% Mounted on


    devtmpfs 4.0M o 4.0M 0% /dev


    tmpfs 1.8G o 1.8G 0% /dev/shm


    tmpfs 704M 9.6M 694M 2% /run


    /dev/mapper/rl-root 70G 6.3G 64G 9% /


    /dev/mapper/rl-home 224G 1.8G 222G 1% /home


    /dev/sda1 1014M 290M 725M 29% /boot


    tmpfs 352M 144K 352M 1% /run/user/1000


    To review current swap space and memory usage, run the free command:'
  merge: -1
  pgno: 710
