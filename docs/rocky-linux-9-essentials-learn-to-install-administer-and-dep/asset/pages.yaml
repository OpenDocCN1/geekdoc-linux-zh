- img_proc: true
  md: '# 6.10 Summary


    Rocky 9 includes the GNOME 40 desktop environment, which may either be included
    during the initial installation or installed later using the dnf group package
    installation feature. Unlike most other desktop environments, GNOME 40 is intended
    to provide a clean and easy-to-use windowing user interface. Key areas of the
    GNOME 40 desktop include the top bar, Activities overview, and dash. In addition,
    GNOME 40 supports multiple workspaces keeping running applications organized and
    the screen uncluttered. Various configuration options are available within the
    Settings app, including desktop background settings, audio, network configuration,
    and WiFi network selection.'
  merge: -1
