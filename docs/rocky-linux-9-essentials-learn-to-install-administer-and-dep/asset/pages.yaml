  md: '# 31.9 Summary


    This chapter has covered adding a physical or virtual disk drive to an existing
    Rocky Linux 9 system. This is a relatively simple process of ensuring the new
    drive has been detected by the operating system, creating one or more partitions
    on the drive, and then making filesystems on those partitions. Although several
    filesystem types are available on Rocky 9, XFS is generally recommended. Once
    the filesystems are ready, they can be mounted using the mount command. So that
    the newly created filesystems mount automatically on system startup, additions
    can be made to the /etc/fstab configuration file.'
  merge: -1
  pgno: 649
- img_proc: true
  md: '# 32. Adding a New Disk to a Rocky Linux 9 Volume Group and Logical Volume


    In the previous chapter, we looked at adding a new disk drive to a Rocky Linux
    9 system, creating a partition and file system, and then mounting that file system
    to access the disk. An alternative to creating fixed partitions and file systems
    is to use Logical Volume Management to create logical disks comprising space from
    one or more physical or virtual disks or partitions. The advantage of using LVM
    is that space can be added to or removed from logical volumes without spreading
    data over multiple file systems.


    Let us take, for example, the home file system of a Rocky 9-based server. Without
    LVM, this file system would be created with a specific size when the operating
    system is installed. If a new disk drive is installed, there is no way to allocate
    any of that space to the /home file system. The only option would be to create
    new file systems on the new disk and mount them at particular mount points. In
    this scenario, you would have plenty of space on the new file system, but the
    /home file system would still be nearly full. The only option would be to move
    files onto the new file system. With LVM, the new disk (or part thereof) can be
    assigned to the logical volume containing the home file system, thereby dynamically
    extending the space available.


    In this chapter, we will look at the steps necessary to add new disk space to
    both a volume group and a logical volume to add additional space to the home file
    system of a Rocky 9 system.'
  merge: -1
  pgno: 650
- img_proc: true
  md: '# 32.1 An Overview of Logical Volume Management (LVM)


    LVM provides a flexible and high-level approach to managing disk space. Instead
    of each disk drive being split into partitions of fixed sizes onto which fixed-size
    file systems are created, LVM provides a way to group disk space into logical
    volumes that can be easily resized and moved. In addition, LVM allows administrators
    to carefully control disk space assigned to different groups of users by allocating
    distinct volume groups or logical volumes to those users. When the space initially
    allocated to the volume is exhausted, the administrator can add more space without
    moving the user files to a different file system.


    LVM consists of the following components:'
  merge: -1
  pgno: 651
- img_proc: true
  md: '# 32.1.1 Volume Group


    The Volume Group is the high-level container with one or more logical and physical
    volumes.'
  merge: -1
  pgno: 652
- img_proc: true
  md: '# 32.1.2 Physical Volume


    A physical volume represents a storage device such as a disk drive or other storage
    media.'
  merge: -1
  pgno: 653
- img_proc: true
  md: '# 32.1.3 Logical Volume


    A logical volume is equivalent to a disk partition and, as with a disk partition,
    can contain a file system.'
  merge: -1
  pgno: 654
- img_proc: true
  md: '# 32.1.4 Physical Extent


    Each physical volume (PV) is divided into equal size blocks known as physical
    extents.'
  merge: -1
  pgno: 655
- img_proc: true
  md: '# 32.1.5 Logical Extent


    Each logical volume (LV) is divided into equal size blocks called logical extents.


    Suppose we are creating a new volume group called VolGroup01. This volume group
    needs physical disk space to function, so we allocate three disk partitions and
    These become physical volumes in VolGroup01. We would then create a logical volume
    called LogVol01 within the volume group comprising the three physical volumes.


    If we run out of space in LogVol01, we add more disk partitions as physical volumes
    and assign them to the volume group and logical volume.'
  merge: -1
  pgno: 656
