  md: '# 25.3 Declaring the KVM Bridged Network


    At this point, the bridge connection is on the system but is not visible to the
    KVM environment. Running the virsh command should still list the default network
    as being the only available network option:


    ```

    # virsh net-list --all

    ```


    Name State Autostart Persistent


    default active yes yes


    Before a virtual machine can use the bridge, it must be declared and added to
    the KVM network configuration. This involves the creation of a definition file
    and, once again, using the virsh command-line tool.


    Begin by creating a definition file for the bridge network named bridge.xml that
    reads as follows:


    bro'
  merge: -1
  pgno: 501
- img_proc: true
  md: '```

    mode="bridge"/>

    ```


    ```

    name="bro" />

    ```


    Next, use the file to define the new network:


    ```

    # virsh net-define ./bridge.xml

    ```


    Once the network has been defined, start it and, if required, configure it to
    autostart each time the system reboots:


    ```

    # virsh net-start bro

    ```


    ```

    # virsh net-autostart bro

    ```


    Once again, list the networks to verify that the bridge network is now accessible
    within the KVM environment:


    ```

    # virsh net-list --all

    ```


    | Name State Autostart Persistent |

    | bro active yes yes |'
  merge: -1
