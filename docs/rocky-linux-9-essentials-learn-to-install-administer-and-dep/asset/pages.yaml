  md: '```

    # systemctl stop httppd.service

    ```


    Now that it has been enabled, the next time the system reboots to the current
    target, the httpd service will start automatically. Assuming, for example, that
    the service was enabled while the system was running the multi-user target, the
    httpd service will have been added as another dependency to the multi-user.target
    unit.


    Behind the scenes, systemctl adds dependencies to targets by creating symbolic
    links in the .wants folder for the target within the /etc/systemd/ folder. For
    example, the multi-user.target unit has a folder named in /etc/systemd/system
    containing symbolic links to all of the systemd units located in /usr/lib/systemd/system
    on which it is dependent. A review of this folder will show a correlation with
    the dependencies listed by the systemctl-dependencies command outlined earlier
    in the chapter.


    To configure a service so that it no longer starts automatically as a target dependency,
    disable it as follows:


    ```

    # systemctl disable httppd.service

    ```


    This command will remove the symbolic link to the httpd.service unit file from
    the directory so that it is no longer a dependency and, as such, will not be started
    the next time the system boots.'
  merge: -1
