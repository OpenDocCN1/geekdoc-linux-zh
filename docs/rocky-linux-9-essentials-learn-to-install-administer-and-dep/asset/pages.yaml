  md: '# ## 28.4 Managing a Container


    Once launched, a container will continue to run until it is stopped via the command
    launched when the container exits. Running the following command on the host,
    for example, will cause the container to exit:


    ```

    # podman stop mycontainer

    ```


    Alternatively, pressing the Ctrl-D keyboard sequence within the last remaining
    bash shell of the container would cause both the shell and container to exit.
    Once it has exited, the status of the container will change accordingly:


    ```

    # podman ps -a

    ```


    CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES


    451f64a77962 docker.io/library/rockylinux:9.1-minimal /bin/bash 3 minutes ago
    Exited (0) 13 seconds ago mycontainer


    Although the container is no longer running, it still exists and contains all
    the configuration and file system changes. If you installed packages, made configuration
    changes, or added files, these changes will persist within "mycontainer". To verify
    this, restart the container as follows:'
  merge: -1
  pgno: 554
- img_proc: true
  md: '```

    # podman start mycontainer

    ```


    After starting the container, use the podman exec command again to execute commands
    within the container as outlined previously. For example, to once again gain access
    to a shell prompt:


    ```

    # podman exec -it mycontainer /bin/bash

    ```


    A running container may also be paused and resumed using the podman pause and
    unpause commands as follows:


    ```

    # podman pause mycontainer

    ```


    ```

    # podman unpause mycontainer

    ```'
  merge: -1
  pgno: 555
- img_proc: true
  md: '# 28.5 Saving a Container to an Image


    Once the container guest system is configured to your requirements, there is a
    good chance that you will want to create and run more than one container of this
    particular type. To do this, the container needs to be saved as an image to local
    storage to be used as the basis for additional container instances. This is achieved
    using the podman commit command combined with the name or ID of the container
    and the name by which the image will be stored, for example:


    ```

    # podman commit mycontainer myrocky_image

    ```


    Once the image has been saved, check that it now appears in the list of images
    in the local repository:


    ```

    # podman images

    ```


    REPOSITORY TAG IMAGE ID CREATED SIZE

    localhost/myrocky_image latest do43befbbo 36 seconds ago 121 MB

    docker.io/library/rockylinux 9.1-minimal 32cf89129508 2 months ago 121 MB'
  merge: -1
  pgno: 556
- img_proc: true
  md: 'The saved image can now be used to create additional containers identical to
    the original:


    ```

