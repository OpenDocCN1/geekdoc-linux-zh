- img_proc: true
  md: '# 10.3 The AppStream Repository


    The AppStream repository manages software in terms of modules, streams, and AppStream
    packages are, once again, RPM packages, as outlined in the previous section describing
    BaseOS. AppStream modules, on the other hand, are groups of packages that belong
    together or for which dependencies exist (for example, the group of packages that
    would need to be installed when building a web server). Each module can have multiple
    streams, where each module stream represents a different version of the software
    module.


    Consider, for example, a Rocky 9 system hosting a website that depends on version
    7.2 of the PHP scripting language. The server still needs to receive any updates
    to PHP 7.2 to benefit from patches and bug fixes but is not compatible with the
    latest version of PHP (version 8.1). Before the introduction of AppStream, it
    would have been difficult to continue receiving version 7.2 updates when newer
    versions have been released.


    To address this issue, the Rocky 9 software management tools can use the AppStream
    repository to subscribe only to a specific stream for a specific module (in this
    case, the version 7.2 stream of the PHP module).'
  merge: -1
  pgno: 207
