  md: '# 15.8 SSH Key-based Authentication using PuTTY


    For Windows systems that do not have OpenSSH available or as a more flexible alternative
    to using PowerShell, the PuTTY tool is a widely used alternative. The first step
    in using PuTTY is downloading and installing it on any Windows system that needs
    an SSH client. PuTTY is a free utility and can be downloaded using the following
    link:


    https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html


    Download the Windows installer executable that matches your Windows system (32-bit
    and 64-bit versions are available), then execute the installer to complete the
    installation.


    If a private key already exists on another system, create the .ssh folder in the
    current user''s home folder and copy the private id_rsa key into it.


    Next, the private key file needs to be converted to a PuTTY private key format
    file using the PuTTYgen tool. Locate this utility by typing “Key Generator” into
    the search bar of the Windows Start menu and launch it:'
