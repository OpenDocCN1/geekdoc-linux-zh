  md: '# 25.4 Using a Bridge Network in a Virtual Machine


    To create a virtual machine that uses the bridge network, use the virt-install
    --network option and specify the bro bridge name. For example:


    ```

    # virt-install --name demo_vm_guest --memory 1024 --disk

    path=/tmp/demo_vm_guest.img,size=10 --network network=bro --cdrom

    /home/demo/Rocky-9.1-x86_64-minimal.iso

    ```


    When the guest operating system runs, it will appear on the same physical network
    as the host system and will no longer be on the NAT-based virtual network.


    The bridge may also be selected for virtual machines within the Cockpit interface
    by editing the virtual machine, locating the Network interfaces section, and clicking
    the Edit button as highlighted in Figure 25-1 below:


