    NetworkManager automatically detected the device, activated it, and assigned it
    to a connection named “Wired connection 1”. This is a default connection over
    which we have no configuration control because there is no interface configuration
    file for it Therefore, the next steps are to delete the “Wired connection 1” connection
    and use nmcli to create a new connection and assign it to the device. The command
