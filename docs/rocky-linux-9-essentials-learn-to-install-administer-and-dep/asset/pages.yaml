  md: '# 29. Setting Up a Rocky Linux 9 Web Server


    The Apache web server is among the many packages that make up the Rocky Linux
    9 operating system. The scalability and resilience of Rocky 9 make it an ideal
    platform for hosting even the most heavily trafficked websites.


    This chapter will explain how to configure a Rocky 9 system using Apache to act
    as a web server, including both secure (HTTPS) and insecure (HTTP) configurations.'
  merge: -1
  pgno: 580
- img_proc: true
  md: '# ## 29.1 Requirements for Configuring a Rocky 9 Web Server


    To set up your own website, you need a computer (or cloud server instance), an
    operating system, a web server, a domain name, a name server, and an IP address.


    In terms of an operating system, we will assume you are using Rocky 9. As previously
    mentioned, Rocky 9 supports the Apache web server, which can easily be installed
    once the operating system is up and running. In addition, a domain name can be
    registered with any domain name registration service.


    If you are running Rocky 9 on a cloud instance, the IP address assigned by the
    provider will be listed in the server overview information. However, if you are
    hosting your own server and your internet service provider has assigned a static
    IP address, you must associate your domain with that address. This is achieved
    using a name server, and all domain registration services will provide this service.


    If you do not have a static IP address (i.e., your ISP provides you with a dynamic
    address that changes frequently), you can use one of several free Dynamic DNS
    or DynDNS (for short) services to map your dynamic IP address to your domain name.


    Once you have configured your domain name and your name server, the next step
    is to install and configure your web server.'
  merge: -1
  pgno: 581
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 582
- img_proc: true
  md: '# 29.2 Installing the Apache Web Server Packages


    The current release of Rocky Linux typically does not install the Apache web server
    by default. To check whether the server is already installed, run the following
    command:


    ```

    # rpm -q httpd

    ```


    If rpm generates output similar to the following, the Apache server is already
    installed:


    ```

    httpd-2.4.53-7.el9_1.5.x86_64

    ```


    Alternatively, if rpm generates a “package httpd is not installed” message, the
    next step is to install it. To install Apache, run the following command at the
    command prompt:


    ```

    # dnf install httpd

    ```'
  merge: -1
  pgno: 583
- img_proc: true
  md: '# 29-3 Configuring the Firewall


    Before starting and testing the ports the Apache web server, the firewall must
    be modified to allow the webserver to communicate with the outside world. By default,
    the HTTP and HTTPS protocols use ports 80 and 443, respectively, so depending
    on which protocols are being used, either one or both of these ports will need
    to be opened. When opening the ports, be sure to specify the firewall zone that
    applies to the internet-facing network


    ```

    # firewall-cmd --permanent --zone= --add-port=8o/tcp

    ```


    ```

    # firewall-cmd --permanent --zone= --add-port=443/tcp

    ```


    After opening the necessary ports, be sure to reload the firewall settings:


    ```

    # firewall-cmd --reload

    ```


    On cloud-hosted servers, enabling the appropriate port for the server instance
    within the cloud console may also be necessary. Check the documentation for the
    cloud provider for steps to do this.'
  merge: -1
  pgno: 584
- img_proc: true
  md: '# 29.4 Port Forwarding


    Suppose the Rocky 9 system hosting the web server sits on a network protected
    by a firewall (another computer running a firewall, router, or wireless base station
    containing built-in firewall protection). In that case, you must configure the
    firewall to forward ports 80o and 443 to your web server system. The mechanism
    for performing this differs between firewalls and devices, so check your documentation
    to find out how to configure port forwarding.'
  merge: -1
  pgno: 585
- img_proc: true
  md: '# 29.5 Starting the Apache Web Server


    Once the Apache server is installed and the firewall configured, the next step
    is to verify that the server is running and start it if necessary.


    To check the status of the Apache service from the command line, enter the following
    at the command prompt:


    ```

    # systemctl status httpd

    ```


    If the above command indicates that the httpd service is not running, it can be
    launched from the command line as follows:


    ```

    # systemctl start httpd

    ```


    If you would like the Apache httpd service to start automatically when the system
    boots, run the following command:


    ```

    # systemctl enable httpd

    ```'
  merge: -1
  pgno: 586
- img_proc: true
