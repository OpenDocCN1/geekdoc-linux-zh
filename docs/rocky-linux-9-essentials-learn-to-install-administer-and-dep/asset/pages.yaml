  md: '# 6. A Guided Tour of the GNOME 40 Desktop


    Rocky Linux 9 includes the GNOME 40 desktop environment. Although lacking the
    complexity of Windows and macOS desktops, GNOME 40 provides an uncluttered and
    intuitive desktop environment that provides all of the essential features of a
    windowing environment with the added advantage that it can be learned quickly.


    In this chapter, the main features of the GNOME desktop will be covered together
    with an outline of how basic tasks are performed.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# ## 6.1 Installing the GNOME Desktop


    If the Workstation or Server with GUI software configuration was selected during
    the Rocky 9 installation process, the GNOME desktop will be installed and automatically
    launched each time the system starts.


    If any other software configuration had been selected during the Rocky 9 installation
    process, the GNOME desktop would not have been included in the packages installed
    on the system. Installing a graphical desktop environment may seem redundant on
    server-based systems without a display attached. It is worth noting, however,
    that remote access to the GNOME desktop is also possible; even on headless servers
    (i.e., servers lacking a monitor, keyboard, and mouse), it may still be beneficial
    to install the GNOME desktop packages. The topic of establishing remote desktop
    access will be covered in detail in this book''s “Rocky 9 Remote Desktop Access
    with VNC”chapter.


    If the installation configuration did not include the GNOME desktop, it can be
    installed at any time using the following command:


    ```

    # dnf groupinstall workstation

    ```


    Once the installation is complete, the desktop environment may be launched from
    the command prompt on a monitor as'
  merge: -1
  pgno: 113
- img_proc: true
  md: '```

    $ startx

    ```'
  merge: -1
  pgno: 114
