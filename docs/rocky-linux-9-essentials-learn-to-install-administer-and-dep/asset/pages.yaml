- img_proc: true
  md: '# 33-4 Adding a Swap File to a Rocky Linux 9 System


    Additional swap space may be added to the system by creating a file and assigning
    it as swap. Begin by creating the swap file using the dd command. The size of
    the file can be changed by adjusting the count variable. The following command
    line, for example, creates a 2.0 GB file:


    ```

    # dd if=/dev/zero of=/newswap bs=1024 count=2000000


    2000000+0 records in


    2000000+0 records out


    2048000000 bytes (2.0 GB, 1.9 GiB) copied, 29.3601 s, 69.8 MB/s

    ```


    Before converting the file to a swap file, it is essential to make sure the file
    has secure permissions set:


    ```

    # chmod 0600 /newswap

    ```


    Once a suitable file has been created, it needs to be converted into a swap file
    using the mkswap command:


    ```

    # mkswap /newswap

    ```'
  merge: -1
  pgno: 683
- img_proc: true
  md: 'Setting up swapspace version 1, size = 1.9 GiB (2047995904 bytes)


    no label, UUID=28d314e9-492f-46f8-bdcf-3a734c4426db5


    With the swap file created and configured, it can be added to the system in real-time
    using the swapon utility:


    ```

    # swapon /newswap

    ```


    Re-running swapon should now report that the new file is now being used as swap:


    ```

    # swapon

    ```


    ```

    NAME TYPE SIZE USED PRIO

    /dev/dm-1 partition 3.7G 1M -2

    /newswap file 1.9G 0B -3

    ```


    The swap space may be removed dynamically by using the swapoff utility as follows:


    ```

    # swapoff /newswap

    ```'
  merge: -1
  pgno: 684
- img_proc: true
  md: 'Finally, modify the /etc/fstab file to automatically add the new swap at system
    boot time by adding the following line:


    ```

    /newswap swap swap defaults o o

    ```'
  merge: -1
