  md: '# 20. An Overview of Virtualization Techniques


    Virtualization is the ability to run multiple operating systems simultaneously
    on a single computer system. While not necessarily a new concept, Virtualization
    has come to prominence in recent years because it provides a way to fully utilize
    the CPU and resource capacity of a server system while providing stability (in
    if one virtualized guest system crashes, the host and any other guest systems
    continue to run).


    Virtualization is also helpful in trying out different operating systems without
    configuring dual boot environments. For example, you can run Windows in a virtual
    machine without re-partitioning the disk, shut down Rocky 9, and boot from Windows.
    Instead, you start up a virtualized version of Windows as a guest operating system.
    Similarly, virtualization allows you to run other Linux distributions within a
    Rocky 9 system, providing concurrent access to both operating systems.


    When deciding on the best approach to implementing virtualization, clearly understanding
    the different virtualization solutions currently available is essential. Therefore,
    this chapter’s purpose is to describe in general terms the virtualization techniques
    in common use today.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# 20.1 Guest Operating System Virtualization


    Guest OS virtualization, also called application-based virtualization, is the
    most straightforward concept to understand. In this scenario, the physical host
    computer runs a standard unmodified operating system such as Windows, Linux, UNIX,
    or macOS. Running on this operating system is a virtualization application that
    executes in much the same way as any other application, such as a word processor
    or spreadsheet, would run on the system. Within this virtualization application,
    one or more virtual machines are created to run the guest operating systems on
    the host computer.


    The virtualization application is responsible for starting, stopping, and managing
    each virtual machine and essentially controlling access to physical hardware resources
    on behalf of the individual virtual machines. The virtualization application also
    engages in a process known as binary rewriting, which involves scanning the instruction
    stream of the executing guest system and replacing any privileged instructions
    with safe emulations. This makes the guest system think it is running directly
    on the system hardware rather than in a virtual machine within an application.


    The following figure illustrates guest OS-based virtualization:'
  merge: -1
  pgno: 429
- img_proc: true
  md: '![](img/f5e2151c520f34f09901d2e71519e220_430_0.png)


    Figure 20-1


    As outlined in the above diagram, the guest operating systems operate in virtual
    machines within the virtualization application, which, in turn, runs on top of
    the host operating system in the same way as any other application. The multiple
    layers of abstraction between the guest operating systems and the underlying host
    hardware are not conducive to high levels of virtual machine performance. However,
    this technique has the advantage that no changes are necessary to host or guest
    operating systems, and no special CPU hardware virtualization support is required.'
  merge: -1
  pgno: 430
- img_proc: true
  md: '# 20.2 Hypervisor Virtualization


    In hypervisor virtualization, the task of a hypervisor is to handle resource and
    memory allocation for the virtual machines and provide interfaces for higher-level
    administration and monitoring tools. Hypervisor-based solutions are categorized
    as being either Type-1 or Type-2.


    Type-2 hypervisors (sometimes called hosted hypervisors) are installed as software
    applications that run on top of the host operating system, providing virtualization
    capabilities by coordinating access to resources such as the CPU, memory, and
    network for guest virtual machines. Figure 21-2 illustrates the typical architecture
    of a system using Type-2 hypervisor virtualization:'
  merge: -1
  pgno: 431
- img_proc: true
  md: '![](img/f5e2151c520f34f09901d2e71519e220_432_0.png)


    Figure 20-2


    To understand how Type-1 hypervisors work, it helps to understand Intel x86 processor
    architecture. The x86 family of CPUs provides a range of protection levels known
    as rings in which code can execute. Ring o has the highest level privilege, and
    it is in this ring that the operating system kernel normally runs. Code executing
    in ring o is said to be running in system space, kernel mode, or supervisor mode.
    All other code, such as applications running on the operating system, operate
    in less privileged rings, typically ring 3.


    In contrast to Type-2 hypervisors, Type-1 hypervisors (also referred to as metal
    or native hypervisors) run directly on the hardware of'
  merge: -1
  pgno: 432
- img_proc: true
  md: 'the host system in ring o. With the hypervisor occupying ring o of the CPU,
    the kernels for any guest operating systems running on the system must run in
    less privileged CPU rings.

    Unfortunately, most operating system kernels are written explicitly to run in
    ring o because they need to perform tasks only available in that ring, such as
    the ability to execute privileged CPU instructions and directly manipulate memory.
    Several different solutions to this problem have been devised in recent years,
    each of which is described below:'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# 20.2.1 Paravirtualization


    Under paravirtualization, the kernel of the guest operating system is modified
    specifically to run on the hypervisor. This typically involves replacing privileged
    operations that only run in ring o of the CPU with calls to the hypervisor (known
    as hypercalls). The hypervisor, in turn, performs the task on behalf of the guest
    kernel. Unfortunately, this typically limits support to open-source operating
    systems such as Linux, which may be freely altered, and proprietary operating
    systems where the owners have agreed to make the necessary code modifications
    to target a specific hypervisor. These issues notwithstanding, the ability of
    the guest kernel to communicate directly with the hypervisor results in greater
    performance levels than other virtualization approaches.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# 20.2.2 Full Virtualization


    Full virtualization provides support for unmodified guest operating systems. The
    term unmodified refers to operating system kernels that have not been altered
    to run on a hypervisor and, therefore, still execute privileged operations as
    though running in ring o of the CPU. In this scenario, the hypervisor provides
    CPU emulation to handle and modify privileged and protected CPU operations made
    by unmodified guest operating system kernels. Unfortunately, this emulation process
    requires both time and system resources to operate, resulting in inferior performance
    levels when compared to those provided by paravirtualization.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# 20.2.3 Hardware Virtualization


    Hardware virtualization leverages virtualization features built into the latest
    generations of CPUs from both Intel and AMD. These technologies, called Intel
    VT and AMD-V, respectively, provide extensions necessary to run unmodified guest
    virtual machines without the overheads inherent in full virtualization CPU emulation.
    In very simplistic terms, these processors provide an additional privilege mode
    (ring -1) above ring o in which the hypervisor can operate, thereby leaving ring
    o available for unmodified guest operating systems.


    The following figure illustrates the Type-1 hypervisor approach to virtualization:


    ![](img/f5e2151c520f34f09901d2e71519e220_436_0.png)'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'Figure 20-3


    As outlined in the above illustration, in addition to the virtual machines, an
    administrative operating system or management console also runs on top of the
    hypervisor allowing the virtual machines to be managed by a system administrator.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# 20.3 Virtual Machine Networking


    Virtual machines will invariably need to be connected to a network to be of any
    practical use. One option is for the guest to be connected to a virtual network
    running within the host computer''s operating system. In this configuration, any
    virtual machines on the virtual network can see each other, but Network Address
    Translation provides access to the external network. When using the virtual network
    and NAT, each virtual machine is represented on the external network (the network
    to which the host is connected) using the IP address of the host system. This
    is the default behavior for KVM virtualization on Rocky 9 and generally requires
    no additional configuration. Typically, a single virtual network is created by
    default, represented by the name default and the device


    For guests to appear as individual and independent systems on the external network
    (i.e., with their own IP addresses), they must be configured to share a physical
    network interface on the host. The quickest way to achieve this is to configure
    the "direct connection" network configuration option (also called MacVTap), which
    will provide the guest system with an IP address on the same network as the host.
    Unfortunately, while this gives the virtual machine access to other systems on
    the network, it is not possible to establish a connection between the guest and
    the host when using the MacVTap driver.'
  merge: -1
  pgno: 438
- img_proc: true
  md: A better option is to configure a network bridge interface on the host system
    to which the guests can connect. This provides the guest with an IP address on
    the external network while also allowing the guest and host to communicate, a
    topic covered in the chapter entitled "Creating a Rocky Linux 9 KVM Networked
    Bridge”
  merge: -1
  pgno: 439
- img_proc: true
  md: '# 20.4 Summary


    Virtualization is the ability to run multiple guest operating systems within a
    single host operating system. Several approaches to virtualization have been developed,
    including a guest operating system and hypervisor virtualization. Hypervisor virtualization
    falls into two categories known as Type-1 and Type-2. Type-2 virtualization solutions
    are categorized as paravirtualization, full virtualization, and hardware virtualization,
    the latter using special virtualization features of some Intel and AMD processor
    models.


    Virtual machine guest operating systems have several options in terms of networking,
    including NAT, direct connection (MacVTap), and network bridge configurations.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# 21. Installing KVM Virtualization on Rocky Linux 9


    Earlier versions of Rocky Linux provided two virtualization platforms: Kernel-based
    Virtual Machine (KVM) and Xen. In recent releases, support for Xen has been removed,
    leaving KVM as the only bundled virtualization option supplied with Rocky Linux
    9. In addition to KVM, third-party solutions are available in products such as
    VMware and Oracle VirtualBox. Since KVM is supplied with Rocky 9, however, this
    virtualization solution will be covered in this and subsequent chapters.


    Before plunging into installing and running KVM, it is worth discussing how it
    fits into the various types of virtualization outlined in the previous chapter.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# 21.1 An Overview of KVM


    KVM is categorized as a Type-1 hypervisor virtualization solution that implements
    full virtualization with support for unmodified guest operating systems using
    Intel VT and AMD-V hardware virtualization support.


    KVM differs from many other Type-1 solutions in that it turns the host Linux operating
    system into the hypervisor, allowing bare metal virtualization to be implemented
    while running a complete, enterprise-level host operating system.'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# 21.2 KVM Hardware Requirements


    Before proceeding with this chapter, we must discuss the hardware requirements
    for running virtual machines within a KVM environment. First and foremost, KVM
    virtualization is only available on certain processor types. As previously discussed,
    processors must include either Intel VT or AMD-V technology.


    To check for virtualization support, run the `lscpu` command in a terminal window:


    ```

    # lscpu | grep Virtualization:

    ```


    If the system contains a CPU with Intel VT support, the above command will provide
    the following output:


    Virtualization: VT-x


    Alternatively, the following output will be displayed when a CPU with AMD-V support
    is detected:


    Virtualization: AMD-V


    If the CPU does not support virtualization, no output will be displayed by the
    above `lscpu` command.'
  merge: -1
  pgno: 443
- img_proc: true
  md: 'Note that while the above commands only report whether the processor supports
    the respective feature, it does not indicate whether it is currently enabled in
    the BIOS. This is because, in practice, virtualization support is typically disabled
    by default in the most systems. Therefore, you should check your BIOS settings
    to ensure the appropriate virtualization technology is enabled before proceeding
    with this tutorial.


    Unlike a dual-booting environment, a virtualized environment involves running
    two or more complete operating systems concurrently on a single computer system.
    This means the system must have enough physical memory, disk space, and CPU processing
    power to comfortably accommodate all these systems in parallel. Therefore, before
    beginning the configuration and installation process, check on the minimum system
    requirements for both Rocky 9 and your chosen guest operating systems and verify
    that your host system has sufficient resources to handle the requirements of both
    systems.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# 21.3 Preparing Rocky 9 for KVM Virtualization


    Unlike Xen, it is not necessary to run a special version of the kernel to support
    KVM. As a result, KVM support is already available for use with the standard kernel
    via installing a KVM kernel module, thereby negating the need to install and boot
    a special kernel.


    To avoid conflicts, however, if a Xen-enabled kernel is currently running on the
    system, reboot the system and select a non-Xen kernel from the boot menu before
    proceeding with the remainder of this chapter.


    The tools required to set up and maintain a KVM-based virtualized system are only
    installed by default if selected explicitly during the Rocky 9 operating system
    installation process. To install the KVM tools from the command prompt, execute
    the following command in a terminal window:


    ```

    # dnf install qemu-kvm qemu-img libvirt virt-install libvirt-client

    ```


    If you have access to a graphical desktop environment, the virt-manager package
    is also recommended:


    ```

    # dnf install virt-manager

    ```'
  merge: -1
  pgno: 445
- img_proc: true
