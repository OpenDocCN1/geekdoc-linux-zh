- img_proc: true
  md: '# 1. Introduction


    Rocky Linux 9 Essentials is designed to provide detailed information on the installation,
    use, and administration of the Rocky Linux 9 distribution. For beginners, the
    book covers topics such as operating system installation, the basics of the GNOME
    desktop environment, configuring email and web servers, installing packages and
    system updates. Additional installation topics, such as dual booting with Microsoft
    Windows, are also covered, together with all important security topics, such as
    configuring a firewall and user and group administration.


    For the experienced user, topics such as remote desktop access, the Cockpit web
    interface, logical volume management (LVM), disk partitioning, swap management,
    KVM virtualization, Secure Shell (SSH), Linux Containers, and file sharing using
    both Samba and NFS are covered in detail to provide a thorough overview of this
    enterprise class operating system.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.1 Superuser Conventions


    Rocky Linux 9, in common with Linux in general, has two types of user account,
    one being a standard user account with restricted access to many of the administrative
    files and features of the operating system, and the other a superuser account
    with elevated privileges. Typically, a user can gain root access either by logging
    in as the root user, or using the su - command and entering the root password.
    In the following example, a user is gaining root access via the su - command:


    ```

    [demo@demo-server ~]$ su -

    ```


    Password:


    ```

    [demo@demo-server ~]#

    ```


    Note that the command prompt for a regular user ends with a $ sign while the root
    user has a # character. When working with the command-line, this is a useful indication
    as to whether or not you are currently issuing commands as the root user.


    If the su - command fails, the root account on the system has most likely been
    disabled for security reasons. In this case, the sudo command can be used instead
    as outlined below.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Using single command requiring root privileges may be executed by a non-root
    user. Consider the following attempt to update the operating system with the latest
    patches and packages:


    ```

    [demo@demo-server ~]$ dnf update

    ```


    Error: This command has to be run with superuser privileges (under the root user
    on most systems).


    Optionally, user accounts may be configured so that they have access to root level
    privileges. Instead of using the su - command to first gain root access, user
    accounts with administration privileges are able to run otherwise restricted commands
    using


    ```

    [demo@demo-server]$ sudo dnf update

    ```


    We trust you have received the usual lecture from the local System


    Administrator. It usually boils down to these three things:


    +   #1) Respect the privacy of others.


    +   #2) Think before you type.


    +   #3) With great power comes great responsibility.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '[sudo] password for demo:


    .


    .


    To perform multiple commands without repeatedly using the sudo command, a command
    prompt with persistent super-user privileges may be accessed as follows:


    ```

    [demo@demo-server]$ sudo su -

    ```


    ```

    [demo@demo-server]#

    ```


    The reason for raising this issue so early in the book is that many of the command-line
    examples outlined in this book will require root privileges.


    Rather than repetively preface every command-line example with directions to run
    the command as root, the command prompt at the start of the line will be used
    to indicate whether or not the command needs to be performed as root. If the command
    can be run as a regular user, the command will be prefixed with a $ command prompt
    as follows:


    $ date'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'If, on the other hand, the command requires root privileges, the command will
    be preceded by a # command prompt:


    ```

    # dnf install openssh

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 1.2 Opening a Terminal Window


    If you are using the GNOME desktop and need to access a command prompt you will
    need to open a Terminal window. To do this, either press the keyboard Windows
    key or click on the Activities button in the top left-hand corner of the screen,
    then select the Terminal from the dash as shown in Figure


    ![](img/f5e2151c520f34f09901d2e71519e220_23_0.png)


    Figure 1-1'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 1.3 Editing Files


    Configuring a Linux system typically involves editing files. For those new to
    Linux it can be unclear which editor to use. If you are running a terminal session
    and do not already have a preferred editor we recommend using the nano editor.
    To launch nano in a terminal window simply enter the following command:


    ```

    # nano

    ```


    Where is replaced by the path to the file you wish to edit. For example:


    ```

    # nano /etc/passwd

    ```


    Once loaded, nano will appear as illustrated in Figure'
  merge: -1
  pgno: 24
