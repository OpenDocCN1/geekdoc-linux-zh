    If necessary, install the package as follows:


    ```

    # dnf install NetworkManager

    ```


    Once the package is installed, the NetworkManager daemon will need to be enabled
    so that it starts each time the system boots:


    ```

    # systemctl enable NetworkManager

    ```


    Finally, start the service running and check the status to verify that the launch
    was successful:


    ```

    # systemctl start NetworkManager

    ```


    ```

    # systemctl status NetworkManager

    ```'
