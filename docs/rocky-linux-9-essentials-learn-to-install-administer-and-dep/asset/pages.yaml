  md: '# 29.8 The Basics of a Secure Website


    The web server and website created in this chapter use the HTTP protocol on port
    80 and, as such, are considered to be insecure. The problem is that the traffic
    between the web server and the client (typically a user''s web browser) is transmitted
    in clear text. In other words, the data is unencrypted and susceptible to interception.
    While not a problem for general web browsing, this is a severe weakness when performing
    tasks such as logging into websites or transferring sensitive information such
    as identity or credit card details.


    These days, websites are expected to use HTTPS, which uses either Secure Socket
    Layer or Transport Layer Security to establish secure, encrypted communication
    between a web server and a client. This security is established through the use
    of public, private, and session encryption together with certificates.


    To support HTTPS, a website must have a certificate issued by a trusted authority
    known as a Certificate Authority When a browser connects to a secure website,
    the web server sends back a copy of the website''s SSL certificate, which also
    contains a copy of the site''s public key. The browser then validates the authenticity
    of the certificate with trusted certificate authorities.


    If the certificate is valid, the browser uses the public key sent by the server
    to encrypt a session key and pass it to the server. The'
  merge: -1
  pgno: 592
- img_proc: true
  md: server decrypts the session key using the private key to send an encrypted acknowledgment
    to the browser. Once this process is complete, the browser and server use the
    session key to encrypt all subsequent data transmissions until the session ends.
  merge: -1
  pgno: 593
- img_proc: true
  md: '# 29.9 Configuring Apache for HTTPS


    By default, the Apache server does not include the necessary module to implement
    a secure HTTPS website. The first step, therefore, is to install the Apache mod_ssl
    module on the server system as follows:


    ```

    # dnf install mod_ssl

    ```


    Restart httpd after the installation completes to load the new module into the
    Apache server:


    ```

    # systemctl restart httpd

    ```


    Check that the module has loaded into the server using the following command:


    ```

    # httpd -M | grep ssl_module

    ```


    ```

    ssl_module (shared)

    ```


    Once the ssl module is installed, repeat the steps from the previous section of
    this chapter to create a configuration file for the website, this time using the
    sites-available/default-ssl.conf file as the template for the site configuration
    file.'
  merge: -1
  pgno: 594
- img_proc: true
  md: Assuming the module is installed, the next step is to generate an SSL certificate
    for the website.
  merge: -1
