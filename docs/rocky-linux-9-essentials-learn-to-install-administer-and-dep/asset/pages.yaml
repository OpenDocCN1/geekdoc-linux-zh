  md: '# 5. Allocating Windows Disk Partitions to Rocky Linux 9


    In the previous chapter, we looked at installing Rocky Linux 9 on the same disk
    as Windows. This so-called "boot" configuration allows the user to have both operating
    systems installed on a single disk drive with the option to boot one or the other
    when the system is powered on.


    This chapter is intended for users who have decided they like Rocky Linux 9 enough
    to delete Windows entirely from the disk and use the resulting space for Linux.
    In the following sections, we will work through this process step by step.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 5.1 Unmounting the Windows Partition


    If the steps in the "Dual Booting Rocky Linux 9 with Windows" chapter were followed
    to mount the Windows partition from within Rocky Linux 9, steps should be taken
    to unmount the partition before continuing with this chapter. Assuming that the
    Windows partition was mounted as it can be unmounted as follows:


    ```

    # umount /mnt/windows

    ```


    The /etc/fstab file should also be edited to remove the /mnt/windows auto-mount
    if it was previously added.'
