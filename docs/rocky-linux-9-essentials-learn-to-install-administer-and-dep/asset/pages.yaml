- img_proc: true
  md: '# 16.5 Connecting to a VNC Server


    VNC viewer implementations are available for a wide range of operating systems.
    Therefore, a quick internet search will likely provide numerous links containing
    details on obtaining and installing this tool on your chosen platform.


    From the desktop of a Linux system on which a VNC viewer as TigerVNC is installed,
    a remote desktop connection can be established as follows from a Terminal window:


    ```

    $ vncviewer :number>

    ```


    In the above example, is either the hostname or IP address of the remote system,
    and number> is the display number of the VNC server desktop, for example:


    ```

    $ vncviewer 192.168.1.115:1

    ```


    Alternatively, run the command without any options to be prompted for the details
    of the remote server:'
  merge: -1
  pgno: 349
- img_proc: true
  md: '![](img/f5e2151c520f34f09901d2e71519e220_350_0.png)


    Figure 16-1


    Enter the hostname or IP address followed by the display number (for example,
    192.168.1.115:1) into the VNC server field and click on the Connect button. The
    viewer will prompt for the user’s VNC password to complete the connection, at
    which point a new window containing the remote desktop will appear.


    This section assumed that the remote desktop was accessed from a Linux or UNIX
    system; the same steps apply to most other operating systems.


    Connecting to a remote VNC server using the steps in this section results in an
    insecure, unencrypted connection between the client and server. This means the
    data transmitted during the remote session is vulnerable to interception. Therefore,
    a few extra steps are necessary to establish a secure and encrypted connection.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 16.6 Establishing a Secure Remote Desktop Session


    The remote desktop configurations explored in this chapter are considered insecure
    because no encryption is used. This is acceptable when the remote connection does
    not extend outside an internal network protected by a firewall. However, a more
    secure option is needed when a remote session is required over an internet connection.
    This is achieved by tunneling the remote desktop through a secure shell connection.
    This section will cover how to do this on Linux, UNIX, and macOS client systems.


    Assuming the SSH server is installed and active, it is time to move to the other
    system. At the other system, log in to the remote system using the following command,
    which will establish the secure tunnel between the two systems:


    ```

    $ ssh -l -L 5901:localhost:5901

    ```


    In the above example, references the user account on the remote system for which
    VNC access has been configured, and is either the hostname or IP address of the
    remote system, for example:'
  merge: -1
  pgno: 351
- img_proc: true
  md: '```

    $ ssh -neilsmyth -L 5901:localhost:5901 192.168.1.115

    ```


    When prompted, log in using the account password. With the secure connection established,
    it is time to launch vncviewer to use the SSH session running in the other terminal
    window, launch another terminal and enter the following command:


    ```

    $ vncviewer localhost:5901

    ```


    The vncviewer session will prompt for a password if one is required, and then
    launch the VNC viewer providing secure access to your desktop environment.


    Although the connection is now secure and encrypted, the VNC viewer will most
    likely still report that the connection is insecure. Figure for example, shows
    the warning dialog displayed by the RealVNC viewer running on a macOS system:


    ![](img/f5e2151c520f34f09901d2e71519e220_352_0.png)'
  merge: -1
