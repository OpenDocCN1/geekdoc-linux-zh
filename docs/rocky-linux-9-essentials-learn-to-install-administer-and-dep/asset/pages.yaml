  md: '# 18. Using NFS on Rocky Linux 9 to Share Files with Remote Systems


    Rocky Linux 9 provides two mechanisms for sharing files and folders with other
    systems on a network. One approach is to use a technology called Samba. Samba
    is based on Microsoft Windows Folder Sharing and allows Linux systems to make
    folders accessible to Windows systems and access Windows-based folder shares from
    Linux. This approach can also be used to share folders between other Linux and
    UNIX-based systems as long as they have Samba support installed and configured.
    This is the most popular approach to sharing files in heterogeneous network environments.
    Folder sharing using Samba is covered in


    "Sharing Files between Rocky Linux 9 and Windows Systems with”


    Another option, explicitly targeted at sharing folders between Linux and UNIX-based
    systems, uses Network File System (NFS). NFS allows the file system on one Linux
    computer to be accessed over a network connection by another Linux or UNIX system.
    NFS was originally developed by Sun Microsystems (now part of Oracle Corporation)
    in the 1980s and remains the standard mechanism for sharing remote Linux/UNIX
    file systems.


    NFS is very different from the Windows SMB resource-sharing technology used by
    Samba. This chapter will look at the network-based sharing of folders between
    Rocky 9 and other UNIX/Linux-based systems using NFS.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 18.1 Ensuring NFS Services are running on Rocky Linux 9


    The first task is to verify that the NFS services are installed and running on
    your Rocky 9 system. This can be achieved from the command line or the Cockpit
    interface.


    Behind the scenes, NFS uses Procedure Calls to share filesystems over a network
    between different computers in the form of the rpcbind service. Begin by installing
    both rpcbind and the NFS service by running the following command from a terminal
    window:


    ```

    # dnf install rpcbind nfs-utils

    ```


    Next, configure these services so that they automatically start at boot time:


    ```

    # systemctl enable rpcbind

    ```


    ```

    # systemctl enable nfs-server

    ```


    Once the services have been enabled, start them as follows:


    ```

    # systemctl start rpcbind

    ```


    ```

    # systemctl start nfs-server

    ```'
  merge: -1
  pgno: 379
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 380
- img_proc: true
  md: '# 18.2 Configuring the Rocky Linux 9 Firewall to Allow NFS Traffic


    Next, the firewall needs to be configured to allow NFS traffic. To achieve this,
    run the following firewall-cmd commands where is replaced by the appropriate zone
    for your firewall and system configuration:


    ```

    # firewall-cmd --zone= --permanent --add-service=mountd

    ```


    ```

    # firewall-cmd --zone= --permanent --add-service=nfs

    ```


    ```

    # firewall-cmd --zone= --permanent --add-service=rpc-bind

    ```


    ```

    # firewall-cmd --reload

    ```'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# 18.3 Specifying the Folders to be Shared


    Now that NFS is running and the firewall has been configured, we need to specify
    which parts of the Rocky 9 file system may be accessed by remote Linux or UNIX
    systems. These settings can be declared in the /etc/exports file, which must be
    modified to export the directories for remote access via NFS. The syntax for an
    export line in this file is as follows:


    ```

    () (().

    ```


    In the above line, is replaced by the directory to be exported, the name or IP
    address of the system to which access is being granted, and represents the restrictions
    that are to be imposed on that access (read-only, read-write, etc.). Multiple
    host and options entries may be placed on the same line if required. For example,
    the following line grants read-only permission to the /datafiles to a host with
    the IP address 192.168.2.38:


    ```

    /datafiles 192.168.2.38(ro)

    ```


    The use of wildcards is permitted to apply an export to multiple hosts. For example,
    the following line permits read-write access to /home/demo to all external hosts:


    ```

    /home/demo *(rw)

    ```'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'A complete list of options supported by the exports file may be found by reading
    the exports man page:


    # # man exports


    For this chapter, we will configure the /etc/exports file as follows:


    ```

    /tmp *(rw,sync)

    ```


    ```

    /vol1 192.168.86.42(ro,sync)

    ```


    Once configured, the table of exported file systems maintained by the NFS server
    needs to be updated with the latest /etc/exports settings using the exportfs command
    as follows:


    # # exportfs -a


    It is also possible to view the current share settings from the command line using
    the exportfs tool:


    # # exportfs


    The above command will generate the following output:


    ```

    /vol1 192.168.86.42

    ```'
  merge: -1
  pgno: 383
- img_proc: true
  md: /tmp
  merge: -1
  pgno: 384
- img_proc: true
  md: '# 18.4 Accessing Shared Folders


    The shared folders may be accessed from a client system by mounting them manually
    from the command line. However, before attempting to mount a remote NFS folder,
    the nfs-utils package must be installed on the client system:


    ```

    # dnf install nfs-utils

    ```


    To mount a remote folder from the command line, open a terminal window and create
    a directory where you would like the remote shared folder to be mounted:


    ```

    $ mkdir /home/demo/tmp

    ```


    Next, enter the command to mount the remote folder using either the IP address
    or hostname of the remote NFS server, for example:


    ```

    $ sudo mount -t nfs 192.168.86.24:/tmp /home/demo/tmp

    ```


    The remote /tmp folder will then be mounted on the local system. Once mounted,
    the /home/demo/tmp folder will contain the remote folder and all its contents.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'Options may also be specified when mounting a remote NFS filesystem. The following
    command, for example, mounts the same folder but configures it to be read-only:


    ```

    $ sudo mount -t nfs -o ro 192.168.86.24:/tmp /home/demo/tmp

    ```'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# 18.5 Mounting an NFS Filesystem on System Startup


    It is also possible to configure a Rocky 9 system to automatically mount a remote
    file system each time it starts up by editing the /etc/fstab file. When loaded
    into an editor, it will likely resemble the following:


    ```

    /dev/mapper/rl-root / xfs defaults o o


    UUID=c4baobof-777a-42a8 /boot xfs defaults o o


    UUID=052D-19D8 /boot/efi vfat umask=0077,shortname=winnt o 2


    /dev/mapper/rl-swap none swap defaults o o

    ```


    To mount, for example, a folder with the path which resides on a system with the
    IP address 192.168.86.24 in the local folder with the path /home/demo/tmp (note
    that this folder must already exist), add the following line to the file:


    ```

    192.168.86.24:/tmp /home/demo/tmp nfs rw o o

    ```


    Next time the system reboots, the /tmp folder on the remote system will be mounted
    on the local /home/demo/tmp point. All the files in the remote folder can then
    be accessed as if they reside on the local hard disk drive.'
  merge: -1
  pgno: 387
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 388
- img_proc: true
  md: '# 18.6 Unmounting an NFS Mount Point


    Once a remote file system is mounted using NFS, it can be unmounted using the
    umount command with the local mount point as the command-line argument. The following
    command, for example, will unmount our example filesystem mount point:


    ```

    $ sudo umount /home/demo/tmp

    ```'
  merge: -1
