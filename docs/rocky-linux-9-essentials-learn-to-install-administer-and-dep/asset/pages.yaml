  pgno: 525
- img_proc: true
  md: '# 26.4 Shutting Down a Guest System


    The shutdown option of the virsh tool, as the name suggests, is used to shut down
    a guest operating system:


    ```

    # virsh shutdown guestName

    ```


    Note that the shutdown option allows the guest operating system to perform an
    orderly shutdown when it receives the instruction. To instantly stop a guest operating
    system, the destroy option may be used (with the risk of file system damage and
    data loss):


    ```

    # virsh destroy guestName

    ```'
  merge: -1
  pgno: 526
- img_proc: true
  md: '# 26.5 Suspending and Resuming a Guest System


    A guest system can be suspended and resumed using the virsh tool''s suspend and
    resume options. For example, to suspend a specific system:


    ```

    # virsh suspend guestName

    ```


    Similarly, to resume the paused system:


    ```

    # virsh resume guestName

    ```


    A suspended session will be lost if the host system is rebooted. Also, be aware
    that a suspended system continues to reside in memory. Therefore, to save a session
    such that it no longer takes up memory and can be restored to its exact state
    (even after a reboot), it is necessary to save and restore the guest.'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# 26.6 Saving and Restoring Guest Systems


    A running guest operating system can be saved and restored using the virsh utility.
    When saved, the current status of the guest operating system is written to disk
    and removed from system memory. A saved system may subsequently be restored at
    any time (including after a host system reboot).


    To save a guest:


    ```

    # virsh save guestName path_to_save_file

    ```


    To restore a saved guest operating system session:


    ```

    # virsh restore path_to_save_file

    ```'
  merge: -1
  pgno: 528
- img_proc: true
  md: '# 26.7 Rebooting a Guest System


    To reboot a guest operating system:


    ```

    # virsh reboot guestName

    ```'
  merge: -1
  pgno: 529
- img_proc: true
  md: '# 26.8 Configuring the Memory Assigned to a Guest OS


    To configure the memory assigned to a guest OS, use the setmem option of the virsh
    command. For example, the following command reduces the memory allocated to a
    guest system to 256MB:


    ```

    # virsh setmem guestName 256

    ```


    Note that acceptable memory settings must fall within the memory available to
    the current Domain. This may be increased using the option.'
  merge: -1
  pgno: 530
