- img_proc: true
  md: '# 33.8 Summary


    Swap space is vital to any operating system when memory resources become constrained.
    By swapping out memory areas to disk, the system can continue to function and
    meet the needs of the processes and applications running on it.


    Rocky Linux 9 has a set of guidelines recommending the amount of disk-based swap
    space that should be allocated depending on the amount of RAM installed in the
    system. When these recommendations prove insufficient, additional swap space can
    be added to the system, typically without rebooting. This chapter outlines that
    swap space can be added as a file, disk, or disk partition or by extending existing
    logical volumes configured as swap space.'
  merge: -1
  pgno: 696
- img_proc: true
  md: '# 34. Rocky Linux 9 System and Process Monitoring


    An essential part of running and administering a Rocky Linux 9 system involves
    monitoring the overall system health regarding memory, swap, storage, and processor
    usage. This includes knowing how to inspect and manage the system and user processes
    running in the background. This chapter will outline some tools and utilities
    that can be used to monitor system resources and processes on a Rocky 9 system.'
  merge: -1
  pgno: 697
- img_proc: true
  md: '# 34-1 Managing Processes


    Even when a Rocky 9 system appears idle, many system processes will run silently
    in the background to keep the operating system functioning. For example, when
    you execute a command or launch an app, user processes are started, running until
    the associated task is completed.


    To obtain a list of active user processes you are currently running within the
    context of a single terminal or command-prompt session, use the ps command as
    follows:


    ```

    $ ps

    ```


    ```

    PID TTY TIME CMD


    10395 pts/1 00:00:00 bash


    13218 pts/1 00:00:00 ps

    ```


    The output from the ps command shows that two user processes are running within
    the context of the current terminal window or command prompt session, the bash
    shell into which the command was entered, and the ps command itself.


    To list all active processes running for the current user, use the ps command
    with the -a flag. This command will list all running'
  merge: -1
  pgno: 698
- img_proc: true
  md: 'processes that are associated with the user regardless of where they

    are are running (for example, processes running in other terminal

    windows):


    ```

    $ ps -a

    ```


    ```

    PID TTY TIME CMD


    5442 tty2 00:00:00 gnome-session-b


    6350 pts/o 00:00:00 sudo


    6354 pts/o 00:00:00 su


    6355 pts/o 00:00:00 bash


    9849 pts/2 00:00:00 nano


    9850 pts/1 00:00:00 ps

    ```


    As shown in the above output, the user is running processes related

    to the GNOME desktop, the shell session, the nano text editor, and

    the ps command.


    To list the processes for a specific user, run ps with the -u flag

    followed by the user name:'
  merge: -1
