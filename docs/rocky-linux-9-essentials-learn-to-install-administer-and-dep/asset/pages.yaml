  md: '# 8.13 Writing Shell Scripts


    So far, we have focused exclusively on the interactive nature of the Bash shell.
    By interactive, we mean manually entering commands individually and executing
    them at the prompt. In fact, this is only a small part of what the shell is capable
    of. Arguably one of the most powerful aspects of the shell involves the ability
    to create shell scripts. Shell scripts are text files containing statement sequences
    that can be executed within the shell environment to perform tasks. In addition
    to the ability to execute commands, the shell provides many programming constructs,
    such as for loops and do and if statements, that you might reasonably expect to
    find in a scripting language.


    Unfortunately, a detailed overview of shell scripting is beyond the scope of this
    chapter. However, many books and web resources dedicated to shell scripting do
    the subject much more justice than we could ever hope to achieve here. In this
    section, therefore, we will only be providing a very small taste of shell scripting.


    The first step in creating a shell script is to create a file (for this example,
    we will name it and add the following as the first line:


    ```

    #!/bin/sh

    ```


    The #! is called the "shebang" and is a special sequence of characters indicating
    that the path to the interpreter needed to'
  merge: -1
  pgno: 181
- img_proc: true
  md: "execute the script is the next item on the line (in this case, the sh executable\
    \ located in This could equally be, for example, /bin/csh or /bin/ksh if either\
    \ were the interpreter you wanted to use.\n\nThe next step is to write a simple\
    \ script:\n\n```\n#!/bin/sh\n\nfor i in *\ndo\n  echo $i\n\ndone\n```\n\nAll this\
    \ script does is iterate through all the files in the current directory and display\
    \ the name of each file. This script may be executed by passing the name of the\
    \ script through as an argument to\n\n$ sh simple.sh\n\nTo make the file executable\
    \ (thereby negating the need to pass it through to the sh command), the chmod\
    \ command can be used:"
  merge: -1
  pgno: 182
- img_proc: true
  md: '```

    $ chmod +x simple.sh

    ```


    Once the execute bit has been set on the file''s permissions, it may be executed
    directly. For example:


    ```

    $ ./simple.sh

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 8.14 Summary


    We briefly toured the Bash shell environment in this chapter of Rocky 9 Essentials.
    In the world of graphical desktop environments, it is easy to forget that an operating
    system’s true power and flexibility can often only be utilized by dropping down
    below the user-friendly desktop interface and using a shell environment. Moreover,
    familiarity with the shell is necessary to administer and maintain server-based
    systems that do not have the desktop installed or when attempting to repair a
    system damaged to the point that the desktop or Cockpit interface will no longer
    launch.


    The shell''s capabilities go far beyond the areas covered in this chapter. If
    you are new to the shell, we strongly encourage you to seek additional resources.
    Once familiar with the concepts, you will quickly find that it is quicker to perform
    many tasks using the shell in a terminal window than to wade through menus and
    dialogs on the desktop.'
  merge: -1
