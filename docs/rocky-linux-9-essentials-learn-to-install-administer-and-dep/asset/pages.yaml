    Remove a service from a zone using the --remove-service option. Since this is
    a runtime change, the rule will be re-instated the next time the system restarts:


    ```

    # firewall-cmd --zone=public --remove-service=https

    ```


    To remove a service permanently, use the --permanent flag, remembering to reload
