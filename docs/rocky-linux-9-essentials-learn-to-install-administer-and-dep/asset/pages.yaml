  md: '# 8. Using the Bash Shell on Rocky Linux 9


    An essential part of learning to work with Rocky Linux 9 and Linux distributions
    generally involves gaining proficiency in working in the shell environment. While
    graphical desktop environments such as GNOME, included with Linux, provide a user-friendly
    interface to the operating system, the shell environment provides far greater
    capabilities, flexibility, and automation than can ever be achieved using graphical
    desktop tools. The shell environment also provides a means for interacting with
    the operating system when a desktop environment is unavailable, a common occurrence
    when working with a server-based operating system such as Rocky 9 or a damaged
    system that will not fully boot.


    Therefore, this chapter aims to provide an overview of the default shell environment
    on Rocky 9 (specifically the Bash shell).'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# 8.1 What is a Shell?


    The shell is an interactive command interpreter environment within which commands
    may be typed at a prompt or entered into a file as a script and executed. The
    origins of the shell can be traced back to the early days of the UNIX operating
    system. In fact, in the early days of Linux, before the introduction of graphical
    desktops, the shell was the only way for a user to interact with the operating
    system.


    A variety of shell environments have been developed over the years. The first
    widely used shell was the Bourne shell, written by Stephen Bourne at Bell Labs.


    Yet another early creation was the C shell which shared some syntax similarities
    with the C Programming Language and introduced usability enhancements such as
    command-line editing and history.


    The Korn shell (developed by David Korn at Bell Labs) is based on features provided
    by both the Bourne and C shells.


    The default shell on Rocky 9 is the Bash shell (shorthand for Bourne Again SHell).
    This shell, which began life as an open-source version of the Bourne shell, was
    developed for the GNU Project by Brian Fox and is based on features provided by
    both the Bourne shell and the C shell.'
  merge: -1
  pgno: 158
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 8.2 Gaining Access to the Shell


    From within the GNOME desktop environment, the shell prompt may be accessed from
    a Terminal window by selecting the Activities option in the top bar, entering
    Terminal into the search bar, and clicking the Terminal icon.


    When remotely logging into a Rocky 9 server, for example, using SSH, the user
    is presented with a shell prompt. The chapter entitled “Configuring SSH Key-based
    Authentication on Rocky Linux 9” will cover details on accessing a remote server
    using SSH. When booting a server-based system in which a desktop environment has
    not been installed, the shell is entered immediately after the user completes
    the login procedure at the physical console terminal or remote login session.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 8.3 Entering Commands at the Prompt


    Commands are entered at the shell command prompt simply by typing the command
    and pressing the Enter key. While some commands perform tasks silently, most will
    display some form of output before returning to the prompt. For example, the $ls
    command can be used to display the files and directories in the current working
    directory:


    ```

    $ ls

    ```


    Desktop Documents Downloads Music Pictures Public Templates Videos


    The available commands are either built into the shell itself or reside on the
    physical file system. The location on the file system of a command may be identified
    using the *which* command. For example, to find out where the *ls* executable
    resides on the file system:


    ```

    $ which

    ```


    ```

    alias ls=''ls'' --color=auto''

    ```


    ```

    /usr/bin/ls

    ```'
  merge: -1
