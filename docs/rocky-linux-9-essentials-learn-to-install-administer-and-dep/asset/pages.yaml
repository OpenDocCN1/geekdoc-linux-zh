  md: '# 19.6 Configuring SELinux for Samba


    SELinux is a system integrated by default into the Linux kernel on all Rocky 9
    systems, providing an extra layer of security and protection to the operating
    system and user files.


    Traditionally, Linux security has been based on allowing users to decide who has
    access to their files and other resources they own. Consider, for example, a file
    located in the home directory of, and owned by, a particular user. User can control
    the access permissions of that file in terms of whether other users on the system
    can read and write to or, in the case of a script or binary, execute the file.
    This type of security is called discretionary access control since resource access
    is left to the user''s discretion.


    With SELlinux, however, access is controlled by the system administrator and cannot
    be overridden by the user. This is called mandatory access control and is defined
    by the administrator using the SELinux To continue the previous example, the owner
    of a file can only perform tasks on that file if the SELinux policy, defined either
    by default by the system or by the administrator, permits it.


    The current status of SELinux on a Rocky 9 system may be identified using the
    sestatus tool as follows:


    SELinux status: enabled'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'SELinux mount: /sys/fs/selinux


    SELinux root directory: /etc/selinux


    Loaded policy name: targeted


    Current mode: enforcing


    Mode from config file: enforcing


    Policy MLS status: enabled


    Policy deny_unknown status: allowed


    Memory protection checking: actual (secure)


    Max kernel policy version: 33


    SELinux security is based on the concept of context labels. All resources on a
    system (including processes and files) are assigned'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'SELinux context labels consisting of user, role, type, and optional

    security level. The SELinux context of files or folders, for example,

    may be viewed as follows:


    ```

    $ ls -Z /home/demo

    ```


    unconfined-u:object_r:user_home_t:so Desktop


    unconfined-u:object_r:user_home_t:so Documents


    Similarly, the ps command may be used to identify the context of

    a running process, in this case, the ls command:


    ```

    $ ps -eZ | grep

    ```


    unconfined-u:unconfined_r:unconfined_t:so-so:co.c1023 14311 tty

    00:00:18 ls


    When a process (such as the above ls command) attempts to

    access a file or folder, the SELinux system will check the policy to

    identify whether or not access is permitted. Now consider the

    context of the Samba service:


    ```

    $ ps -eZ | grep smbd

    ```


    system_u:system_r:smbd_t:so 14129 ? 00:00:00 smbd


    system_u:system_r:smbd_t:so 14132 ? 00:00:00 smbd-notify'
  merge: -1
  pgno: 409
- img_proc: true
  md: 'SELinux implements security in several ways, the most common of which is called
    type In basic terms, when a process attempts to perform a task on an object (for
    example, writing to a file), SELinux checks the context types of both the process
    and the object and verifies that the security policy allows the action to be taken.
    Suppose a process of type A, for example, attempts to write to a file of type
    B. In that case, it will only be permitted if SELinux policy explicitly that a
    process of type A may perform a write operation to a file of type B. In SELinux
    enforcement, all actions are denied by default unless a rule specifically allows
    the action to be performed.


    The issue with SELinux and Samba is that SELinux policy is not configured to allow
    processes of type smb_t to perform actions on files of any type other than For
    example, the /home/demo directory listed above will be inaccessible to the Samba
    service because it has a type of To make files or folders on the system accessible
    to the Samba service, the enforcement type of those resources must be changed
    to


    For this example, we will create the /sampleshare directory referenced previously
    in the smb.conf file and change the enforcement type to make it accessible to
    the Samba service. Begin creating the directory as follows:


    ```

    # mkdir /sampleshare

    ```'
  merge: -1
