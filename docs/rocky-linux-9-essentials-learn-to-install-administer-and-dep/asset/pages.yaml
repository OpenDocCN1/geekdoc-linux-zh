  md: '# 9. Managing Rocky Linux 9 Users and Groups


    During the installation of Rocky Linux 9, the installer created a root or superuser
    account and required that a password be configured. The installer also provided
    the opportunity to create a user account for the system. We should remember that
    Rocky 9 is an enterprise-class, multi-user, and multi-tasking operating system.
    To use the full power of Rocky 9, it is likely that more than one user will need
    to be given access to the system. Each user should have their own user account
    login, password, home directory, and privileges.


    Users are further divided into groups for easier administration, and those groups
    can have different levels of privileges. For example, you may have a group of
    users who work in the Accounting department. In such an environment, you can create
    an accounts group and assign all the Accounting department users to that group.


    This chapter will cover the steps to add, remove and manage users and groups on
    a Rocky 9 system. Users and groups may be managed on Rocky 9 using command-line
    tools, the Cockpit web interface, and the desktop Settings app. In this chapter,
    we will look at each of these approaches to user management.'
  merge: -1
  pgno: 185
