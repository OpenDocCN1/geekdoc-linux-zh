  md: '# 14-3-3 Adding and Removing Zone Services


    To add a service to a zone, in this case, adding HTTPS to the public zone, the
    following command would be used:


    ```

    # firewall-cmd --zone=public --add-service=https

    ```


    success


    By default, this is a runtime change, so the added rule will be lost after a system
    reboot. To add a service permanently so that it remains in effect next time the
    system restarts, use the --permanent flag:


    ```

    # firewall-cmd --zone=public --permanent --add-service=https

    ```


    success


    To verify that a service has been added permanently, be sure to include the --permanent
    flag when requesting the service list:


    ```

    # firewall-cmd --zone=public --permanent --list-services

    ```


    cockpit dhcpv6-client http ssh'
  merge: -1
