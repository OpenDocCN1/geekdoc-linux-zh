- img_proc: true
  md: '# 10. Rocky Linux 9 Software Installation and AppStreams


    It is doubtful that a newly installed Rocky Linux 9 system will contain all the
    software packages to perform the tasks for it is intended. Even once the required
    software has been installed, it is almost certain that newer versions of many
    of those packages will be released during the system''s lifespan. In some cases,
    you will need to ensure that these latest package releases are installed on the
    system to ensure that any bugs are fixed. In other cases, however, an older version
    of a particular software package may need to be kept on the system for compatibility
    with other software.


    This chapter introduces the basic concepts of software management on Rocky 9,
    explains how these issues are addressed, explains repositories, software packages,
    and the Rocky Linux Application Stream and explores how to list, install and remove
    the software packages that make up a functioning Rocky 9 system.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 10.1 Repositories


    Linux is essentially comprised of a set of base packages that provide the core
    functionality of the operating system together with a range of other packages
    and modules that add functionality and features on top of the base operating system.


    Several packages will be installed when Rocky 9 is first installed, depending
    on the software options selected during the installation phase. Once the system
    is up and running, however, additional software can be installed as needed. Typically,
    all software that is part of Rocky 9 (in other words, software that a third-party
    vendor does not provide) is downloaded and installed on the system using the dnf
    command. As we have seen in earlier chapters, this typically consists of a command
    similar to the following being issued at the command prompt:


    ```

    # dnf install httpd

    ```


    When such a command is issued, the requested software is downloaded from a remote
    repository and installed on the local system. By default, Rocky 9 is configured
    to download software from repositories named BaseOS, AppStream, and Extras. For
    example, running the following command will provide a list of the repositories
    the system is currently configured to use when downloading software:'
  merge: -1
  pgno: 202
- img_proc: true
  md: '```

    # dnf repolist

    ```


    repo id repo name


    appstream Rocky Linux 9 - AppStream


    baseos Rocky Linux 9 - BaseOS


    extras Rocky Linux 9 - Extras


    The above example shows that the Appstream, BaseOS, and Extras repositories are
    enabled on the system. Remember that repositories may be added for third-party
    software.


    Additional repositories may be added to the system by placing entries in the file,
    or by adding .repo files to the directory. Alternatively, the repository may be
    added using the dnf configmanager tool, passing the URL of the .repo file for
    the repository as a command-line argument:


    ```

    # dnf config-manager --add-repo https://url/of/repo/file

    ```'
