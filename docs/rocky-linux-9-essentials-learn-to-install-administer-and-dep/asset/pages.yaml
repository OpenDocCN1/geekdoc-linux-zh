- img_proc: true
  md: '# 19. Sharing Files between Rocky Linux 9 and Windows Systems with Samba


    Although Linux has made some inroads into the desktop market, its origins, and
    future are very much server based. It is unsprising, therefore, that Rocky Linux
    9 can act as a file server. It is also common for Rocky Linux and Windows systems
    to be used side by side in networked environments. Therefore, it is a common requirement
    that files on a Rocky 9 system be accessible to Linux, UNIX, and Windows-based
    systems over network connections. Similarly, shared folders and printers residing
    on Windows systems may also need to be accessible from Rocky 9-based systems.


    Windows systems share resources such as file systems and printers using a protocol
    known as Server Message Block For a Rocky 9 system to serve such resources over
    a network to a Windows system and vice versa, it must support SMB. This is achieved
    using a technology called Samba. In addition providing integration between Linux
    and Windows systems, Samba may also provide folder sharing between Linux systems
    (as an alternative to NFS covered in the previous chapter).


    In this chapter, we will look at the steps necessary to share file system resources
    and printers on a Rocky 9 system with remote Windows and Linux systems and to
    access Windows resources from Rocky 9.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# 19.1 Accessing Windows Resources from the GNOME Desktop


    Before getting into more details of Samba sharing


    ![](img/f5e2151c520f34f09901d2e71519e220_395_0.png)


    Figure 19-1


    Once launched, select the Other Locations option in the left-hand navigation panel,
    followed by the Windows Network icon in the main panel to browse available Windows
    resources:'
  merge: -1
  pgno: 395
- img_proc: true
  md: '![](img/f5e2151c520f34f09901d2e71519e220_396_0.png)


    Figure 19-2'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# 19.2 Samba and Samba Client


    Samba allows both Rocky 9 resources to be shared with Windows systems and Windows
    resources to be shared with Rocky 9 systems. Rocky Linux accesses Windows resources
    using the Samba client. Rocky Linux resources, on the other hand, are shared with
    Windows systems by installing and configuring the Samba service.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# 19.3 Installing Samba on Rocky 9


    The default settings used during the Rocky 9 installation process do not typically
    install the necessary Samba packages. Unless you specifically requested that Samba
    be installed, it is unlikely that you have Samba installed on your system. To
    check whether Samba is installed, open a terminal window and run the following
    command:


    ```

    # rpm -q samba samba-common samba-client

    ```


    Any missing packages can be installed using the dnf command-line tool:


