- img_proc: true
  md: '# 14.1.2 Interfaces


    Any Rocky 9 system connected to the internet or a network (or both) will contain
    at least one interface in the form of either a physical or virtual network device.
    When fireald is active, each of these interfaces is assigned to a zone allowing
    different levels of firewall security to be assigned to different interfaces.
    For example, consider a server containing two interfaces; one connected externally
    to the internet and the other to an internal network. In such a scenario, the
    external facing interface would most likely be assigned to the more restrictive
    external zone, while the internal interface might use the internal zone.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 14.1.3 Services


    TCP/IP defines a set of services that communicate on standard ports. Secure HTTPS
    web connections, for example, use port 443, while the SMTP email service uses
    port 25. To selectively enable incoming traffic for specific services, firewalld
    rules can be added to zones. The home zone, for example, does not permit incoming
    HTTPS connections by default. This traffic can be enabled by adding rules to a
    zone to allow incoming HTTPS connections without having to reference the specific
    port number.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 14.1.4 Ports


    Although common TCP/IP services can be referenced when adding firevald rules,
    situations will arise where incoming connections need to be allowed on a specific
    port that is not allocated to a service. This can be achieved by adding rules
    referencing specific ports instead of services. This technique was used in the
    chapter “An Overview of the Cockpit Web Interface” when port 9090 was opened to
    allow access to the Cockpit web interface.'
  merge: -1
