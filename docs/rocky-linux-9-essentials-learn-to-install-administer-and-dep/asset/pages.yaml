  md: '# 25.2 Creating a Network Manager Bridge from the Command-Line


    The first step in creating the network bridge is adding a new connection to the
    configuration. This can be achieved using the nmcli tool, specifying that the
    connection is to be a bridge and providing names for both the connection and the
    interface:


    ```

    # nmcli con add అయితే bro type bridge con-name bro

    ```


    Once the connection has been added, a bridge slave interface needs to be established
    between physical device eno1 (the slave) and the bridge connection bro (the master)
    as follows:


    ```

    # nmcli con add type bridge-slave iframe eno1 master bro

    ```


    At this point, the NetworkManager connection list should read as follows:


    ```

    # nmcli con show

    ```


    ```

    NAME UUID TYPE DEVICE

    ```


    ```

    eno1 66foabed-db43-4d79-8f5e-2cb8c7e3aff ethernet eno1

    ```


    ```

    virbro ofa934d5-0508-47b7-a119-33a232b03f64 bridge virbro

    ```'
  merge: -1
  pgno: 497
- img_proc: true
  md: 'bro 59b6631c-a283-41b9-bbf9-56a0ec75653 bridge bro


    bridge-slave-eno1 395bb34b-5e02-427a-ab31-762c9f8f78908 ethernet --


    The next step is to set up the bridge interface. If the steps to configure the
    bridge are being performed over a network connection (i.e., via SSH) this step
    can be problematic because the current eno1 connection must be closed down before
    the bridge connection can be brought up. This means the current connection will
    be lost before the bridge connection can be enabled to replace it, potentially
    leaving the remote host unreachable.


    If you are accessing the host system remotely, this problem can be avoided by
    creating a shell script to perform the network changes. This will ensure that
    the bridge interface is enabled after the eno1 interface is brought down, allowing
    you to reconnect to the host after the changes are complete. Begin by creating
    a shell script name bridge.sh containing the following commands:


    ```

    #!/bin/bash


    mcli con down eno1


    mcli con up bro

    ```


    Once the script has been created, execute it as follows:'
  merge: -1
  pgno: 498
- img_proc: true
  md: '```

    # sh ./bridge.sh

    ```


    When the script executes, the connection will be lost when the en1 connection
    is brought down. After waiting a few seconds, however, it should be possible to
    reconnect to the host once the bro connection has been activated.


    If you are working locally on the host, the two nmcli commands can be run within
    a terminal window without any risk of losing connectivity:


    ```

    # nmcli con down en1

    ```


    ```

    # nmcli con up bro

    ```


    Once the bridge is up and running, the connection list should now include both
    the bridge and the bridge-slave connections:


    ```

    # nmcli con show

    ```


    ```

    NAME UUID TYPE DEVICE

    ```


    ```

    bro 59b6631c-a283-41b9-bbf9-56a60ec75653 bridge bro

    ```


    ```

    bridge-slave-enoi1 395bb34b-5e02-427a-ab31-762c9f878908 ethernet

    eno1

    ```'
  merge: -1
