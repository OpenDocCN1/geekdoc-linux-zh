    assumed to be demo):


    ```

    # su - demo

    ```


    ```

    [demo@demoserver ~]$ vncpasswd

    ```


    Password:


    Verify:


    Would you like to enter a view-only password (y/n)? n


    A view-only password is not used


    ```

    [demo@demoserver ~]$ exit

    ```


    #


    Next, a VNC server configuration file named vncserver@.service needs to be created
    in the /etc/systemd/system directory. The'
  merge: -1
