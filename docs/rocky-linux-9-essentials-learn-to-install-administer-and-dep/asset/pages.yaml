  md: '# 14-3.4 Working with Port-based Rules


    To enable a specific port, use the --add-port option. Note that when manually
    defining the port, both the port number and protocol (TCP or UDP) will need to
    be provided:


    ```

    # firewall-cmd --zone=public --permanent --add-port=5000/tcp

    ```


    It is also possible to specify a range of ports when adding a rule to a zone:


    ```

    # firewall-cmd --zone=public --permanent --add-port=5900-5999/udp

    ```'
