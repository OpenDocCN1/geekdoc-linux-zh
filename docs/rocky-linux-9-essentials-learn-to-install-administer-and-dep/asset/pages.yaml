- img_proc: true
  md: '# 8.8 Filename and Path Completion


    Rather than typing in a complete file name or path or using pattern matching to
    reduce the amount of typing, the shell provides the filename completion feature.
    To use filename completion, enter the first few characters of the file or path
    name and then press the Esc key twice. The shell will then complete the filename
    for you with the first file or path name in the directory that matches the characters
    you entered. To obtain a list of possible matches, press Esc = after entering
    the first few characters.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 8.9 Input and Output Redirection


    As previously mentioned, many shell commands output information when executed.
    By default, this output goes to a device file named stdout which is essentially
    the terminal window or console in which the shell is running. Conversely, the
    shell takes input from a device file named which by default is the keyboard.


    Output from a command can be redirected from stdout to a physical file on the
    file system using the ''>'' character. For example, to redirect the output from
    an ls command to a file named the following command would be required:


    ```

    $ ls *.txt > files.txt

    ```


    Upon completion, files.txt will contain the list of files in the current directory.
    Similarly, the contents of a file may be fed into a command in place of stdin.
    For example, to redirect the contents of a file as input to a command:


    ```

    $ wc -l < files.txt

    ```


    The above command will display the number of lines in the files.txt file.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'It is important to note that the ''> redirection operator creates a new file
    or truncates an existing file when used. To append to an existing file, use the
    ''>>'' operator:


    ```

    $ ls *.dat >> files.txt

    ```


    In addition to standard output, the shell also provides standard error output
    While output from a command is directed to stdout, any error messages generated
    by the command are directed to stderr. This means that if stdout is directed to
    a file, error messages will still appear in the terminal. This is generally the
    desired behavior, though stderr may also be redirected if desired using the ''2>''
    operator:


    ```

    $ ls dkjfnvkndf 2> errormsg

    ```


    On completion of the command, an error reporting that the file named dkjfnvkndf
    could not be found will be contained in the errormsg file.


    Both stderr and stdout may be redirected to the same file using the ''&>'' operator:


    ```

    $ ls /etc dkjfnvkndf &> alloutput

    ```


    On completion of execution, the alloutput file will contain both a listing of
    the contents of the /etc directory and the error message'
  merge: -1
  pgno: 172
