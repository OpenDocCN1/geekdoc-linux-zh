- img_proc: true
  md: '# 24.3 Starting and Stopping a Virtual Machine from the Command-Line


    Having created the virtual machine from the command line, it stands to reason
    that you may also need to start it from the command line in the future. This can
    be achieved using the virsh command-line utility, referencing the name assigned
    to the virtual machine during creation. For


    ```

    # virsh start demo_vm_guest

    ```


    Similarly, the virtual machine may be sent a shutdown signal as


    ```

    # virsh shutdown demo_vm_guest

    ```


    Suppose the virtual machine fails to respond to the shutdown signal and does not
    begin a graceful shutdown. In that case, the virtual machine may be destroyed
    (with the attendant risks of data loss) using the destroy


    ```

    # virsh destroy demo_vm_guest

    ```'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# 24.4 Creating a Virtual Machine from a Configuration File


    The *virsh* command can take as an argument the name of a configuration file on
    which to base the creation of a new virtual machine. The configuration file uses
    XML format. The easiest way to create a configuration file is to dump out the
    configuration of an existing virtual machine and modify it for the new one. Using
    *virsh dumpxml*. For example, the following command outputs the configuration
    data for a virtual machine domain named *demo_vm_guest* to a file named


    ```

    # virsh dumpxml demo_vm_guest > demo_vm_guest.xml

    ```


    Once the file has been generated, load it into an editor to review and change
    the settings for the new virtual machine.


    At the very least, the and image file path> must be changed to avoid conflict
    with the virtual machine from which the configuration was taken. In the case of
    the UUID, this line can be deleted from the file.


    The virtualization type, memory allocation, and number of CPUs, to name but a
    few options, may also be changed if required. Once the file has been modified,
    the new virtual machine may be created as follows:


    ```

    # virsh create demo_vm_guest.xml

    ```'
  merge: -1
  pgno: 488
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 489
- img_proc: true
  md: '# 24.5 Summary


    KVM provides the virt-install and virsh command-line tools as a quick and efficient
    alternative to using the Cockpit and virt-manager tools to create and manage virtual
    machine instances. These tools have the advantage that they can be used from within
    scripts to automate the creation and management of virtual machines. The virsh
    command also includes the option to create VM instances from XML-based configuration
    files.'
  merge: -1
  pgno: 490
- img_proc: true
  md: '# 25. Creating a Rocky Linux 9 KVM Networked Bridge Interface


    By default, the KVM virtualization environment on Rocky Linux 9 creates a virtual
    network to which virtual machines may connect. It is also possible to configure
    a direct connection using a MacVTap driver. However, as outlined in the chapter
    entitled "An Overview of Virtualization Techniques" this approach does not allow
    the host and guest systems to communicate.


    This chapter will cover the steps involved in creating a network bridge on Rocky
    9, enabling guest systems to share one or more of the host system’s physical network
    connections while still allowing the guest and host systems to communicate.


    In the remainder of this chapter, we will explain how to configure a Rocky 9 network
    bridge for KVM-based guest operating systems.'
  merge: -1
  pgno: 491
- img_proc: true
  md: '# 25.1 Getting the Current Network Manager Settings


    A network bridge can be created using the NetworkManager command-line interface
    tool (nmcli). The NetworkManager is installed and enabled by default on Rocky
    9 systems and is responsible for detecting and connecting to network devices and
    providing an interface for managing networking configurations.


    A list of current network connections on the host system can be displayed as follows:


    ```

    # nmcli con show

    ```


    ```

    NAME UUID TYPE DEVICE

    eno1 99d40009-6bb1-4182-baad-a10394c90off ethernet eno1

    virbro 7cb1265e-ffb9-4cb3-aaad-2a6fe588od38 bridge virbro

    ```


    The above output shows that the host has an Ethernet network connection established
    via a device named eno1 and the default bridge interface named virbro, which provides
    access to the NAT-based virtual network to which KVM guest systems are connected
    by default.'
  merge: -1
