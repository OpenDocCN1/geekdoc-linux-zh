- img_proc: true
  md: '# 33-5 Adding Swap as a Partition


    As an alternative to designating a file as swap space, entire disk partitions
    may also be designated as swap. The steps to achieve this are the same as those
    for adding a swap file. Before allocating a partition to swap, ensure that any
    existing data on the corresponding filesystem is either backed up or no longer
    needed and that the filesystem has been unmounted.


    Assuming that a partition exists on a disk drive represented by for example, the
    first step would be to convert this into a swap partition, once again using the
    mkswap utility:


    ```

    # mkswap /dev/sdb1

    ```


