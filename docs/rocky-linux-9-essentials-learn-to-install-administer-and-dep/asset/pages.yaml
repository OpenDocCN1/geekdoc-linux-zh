- img_proc: true
  md: '# 29.11 Summary


    A Rocky 9 system can host websites by installing the Apache web server. Insecure
    (HTTP) and secure (HTTPS) websites can be deployed on Rocky 9. Secure websites
    use either Secure Socket Layer (SSL) or Transport Layer Security (TLS) to establish
    encrypted communication between the web server and client through public, private,
    and session encryption, together with a certificate issued by a trusted Certificate
    Authority.'
  merge: -1
  pgno: 602
- img_proc: true
  md: '# 30. Configuring a Rocky Linux 9 Postfix Email Server


    Along with acting as a web server, email is one of the primary uses of a Rocky
    Linux 9 system, particularly in business environments. Given the importance and
    popularity of email, it is surprising to some people to find out how complex the
    email structure is on a Linux system. This complexity can often be overwhelming
    to the Rocky 9 newcomer.


    The good news is that much of the complexity is there to allow experienced email
    administrators to implement complicated configurations for large-scale enterprise
    installations. However, for most Linux administrators, setting up a basic email
    system is relatively straightforward so that users can send and receive electronic
    mail.


    This chapter of Rocky Linux 9 Essentials will explain the basics of Linux-based
    email configuration and step through configuring a basic email environment. To
    provide the essentials, we will leave the complexities of the email system for
    more advanced books on the subject.'
  merge: -1
  pgno: 603
- img_proc: true
  md: '# 30.1 The Structure of the Email System


    Several components make up a complete email system. Below is a brief description
    of each one:'
  merge: -1
  pgno: 604
- img_proc: true
  md: '# 30.1.1 Mail User Agent


    The typical user will likely be most familiar with this part of the system. The
    Mail User Agent or mail client, is the application that is used to write, send
    and read email messages. Anyone who has written and sent a message on any computer
    has used a Mail User Agent of one type or another.


    Typical Graphical MUAs on Linux are Evolution, Thunderbird, and KMail. For those
    who prefer a text-based mail client, there are also the more traditional Pine
    and mail tools.'
  merge: -1
  pgno: 605
- img_proc: true
  md: '# 30.1.2 Mail Transfer Agent


    The Mail Transfer Agent is the part of the email system that transfers email messages
    from one computer to another (either on the same local network or over the internet
    to a remote system). Once configured correctly, most users will only directly
    interact with their chosen MTA if they wish to re-configure it. Many MTA choices
    are available for Linux, including Sendmail, Postfix, Fetchmail, Qmail, and Exim.'
  merge: -1
  pgno: 606
- img_proc: true
  md: '# 30.1.3 Mail Delivery Agent


    Another part of the infrastructure typically hidden from the user, the Mail Delivery
    Agent sits in the background and performs filtering of the email messages between
    the Mail Transfer Agent and the mail client (MUA). The most popular form of MDA
    is a spam filter to remove all unwanted email messages from the system before
    they reach the inbox of the user’s mail client (MUA). Popular MDAs are Spamassassin
    and Procmail. It is important to note that some Mail User Agent applications (such
    as Evolution, Thunderbird, and KMail) include their own MDA filtering. Others,
    such as Pine and Basla, do not. This can be a source of confusion for the Linux
    beginner.'
  merge: -1
  pgno: 607
- img_proc: true
  md: '# 30.1.4 SMTP


    SMTP is an acronym for Simple Mail Transport Protocol. The email systems use this
    protocol to transfer mail messages from one server to another. This protocol is
    the communication language that the MTAs use to talk to each other and transfer
    messages back and forth.'
  merge: -1
  pgno: 608
- img_proc: true
  md: '# 30.1.5 SMTP Relay


    SMTP Relay is a protocol that allows an external SMTP server to send emails instead
    of hosting a local SMTP server. This will typically involve using a service such
    as Mailjet, SendGrid, or MailGun. These services avoid configuring and maintaining
    your own SMTP server and often provide additional benefits such as analytics.'
  merge: -1
  pgno: 609
- img_proc: true
  md: '# 30.2 Configuring a Rocky Linux 9 Email Server


    Many systems use the Sendmail MTA to transfer email messages; on many Linux distributions,
    this is the default Mail Transfer Agent. Unfortunately, Sendmail is a complex
    system that can be difficult for beginners and experienced users to understand
    and configure. It is also falling from favor because it is considered slower at
    processing email messages than many of the more recent MTAs available.


    Many system administrators are now using Postfix or Qmail to handle email. Both
    are faster and easier to configure than Sendmail.


    For this chapter, therefore, we will look at Postfix as an MTA because of its
    simplicity and popularity. However, if you prefer to use Sendmail, many books
    specialize in the subject and will do the subject much more justice than we can
    in this chapter.


    As a first step, this chapter will cover configuring a Rocky 9 system to act as
    a full email server. Later in the chapter, the steps to use an SMTP Relay service
    will also be covered.'
  merge: -1
  pgno: 610
- img_proc: true
  md: '# 30-3 Postfix Pre-Installation Steps


    The first step before installing Postfix is to ensure that Sendmail is not already
    running on your system. You can check for this using the following command:


    ```

    # systemctl status sendmail

    ```


    If sendmail is not installed, the tool will display a message similar to the following:


    Unit sendmail.service could not be found.


    If sendmail is running on your system, it is necessary to stop it before installing
    and configuring Postfix. To stop sendmail, run the following command:


    ```

    # systemctl stop sendmail

    ```


    The next step is to ensure that sendmail does not get restarted automatically
    when the system is rebooted:


    ```

    # systemctl disable sendmail

    ```


    Sendmail is now switched off and configured to not auto-start when the system
    is booted. Optionally, to altogether remove'
  merge: -1
  pgno: 611
- img_proc: true
  md: 'sendmail from the system, run the following command:


    ```

    # dnf remove sendmail

    ```'
  merge: -1
  pgno: 612
- img_proc: true
  md: '# 30.4 Firewall/Router Configuration


    Since sending and receiving email messages involves network connections, the firewall
    must be configured to allow SMTP traffic. If fireald is active, use the *firewall-cmd*
    tool will as follows:


    ```

    # firewall-cmd --permanent --add-service=smtp

    ```


    It will also be essential to configure any other firewall or router between the
    server and the internet to allow connections on ports 25, 143, and 587 and, if
    necessary, to configure port forwarding for those ports to the corresponding ports
    on the email server.


    With these initial steps completed, we can now install Postfix.'
  merge: -1
  pgno: 613
- img_proc: true
  md: '# 30.5 Installing Postfix on Rocky Linux 9


    By default, the Rocky 9 installation process installs postfix for most configurations.
    To verify if postfix is already installed, use the following `rpm` command:


    ```

    # rpm -q postfix

    ```


    If rpm reports that postfix is not installed, it may be installed as follows:


    ```

    # dnf install postfix

    ```


    The `dnf` tool will download and install postfix and configure a special postfix
    user in the `/etc/passwd` file.'
  merge: -1
  pgno: 614
- img_proc: true
  md: '# 30.6 Configuring Postfix


    The main configuration settings for postfix are located in the /etc/postfix/main.cf
    file. Many resources on the internet provide detailed information on postfix,
    so this section will focus on the basic options required to get email up and running.
    Even though the dnf installation will set up some basic configuration options,
    it tends to miss some settings and guess incorrectly for others, so carefully
    review the main.cf file.


    The key options in the main.cf file are as follows:


    ```

    hostname = mta1.domain.com

    ```


    ```

    mydomain = domain.com

    ```


    ```

    myorigin = $mydomain

    ```


    ```

    mydestination = $hostname, localhost.$mydomain, localhost,$mydomain

    ```


    ```

    inet_interfaces = $hostname

    ```


    ```

    mynetworks = subnet

    ```'
  merge: -1
  pgno: 615
- img_proc: true
  md: 'Other settings will have either been set up for you by the

    installation process or are only needed if you are feeling

    adventurous and want to configure a more sophisticated email

    system.


    The format of myhostname is host.domain.extension. If, for

    example, your Linux system is named MyLinuxHost and your

    internet domain is MyDomain.com you would set the myhostname

    option as follows:


    ```

    myhostname = mylinuxhost.mydomain.com

    ```


    The mydomain setting is just the domain part of the above

    setting. For example:


    ```

    mydomain = mymydomain.com

    ```


    The myorigin setting defines the name of the domain from which

    the output email appears to come from when it arrives in the

    recipient''s inbox and should be set to your domain name:


    ```

    myorigin = $mydomain

    ```


    One of the most crucial parameters, mydestination relates to

    incoming messages and declares the domains for which this

    server is the final delivery destination. Any incoming email

    messages addressed to a domain name, not on this list will be'
  merge: -1
  pgno: 616
- img_proc: true
  md: 'considered a relay request which, subject to the myynetworks setting (outlined
    below), will typically result in a delivery failure.


    The inet_interfaces setting defines the network interfaces on the system via which
    postfix is permitted to receive email and is generally set to all:


    ```

    inet_interfaces = all

    ```


    The myynetworks setting defines which external systems are trusted to use the
    server as an SMTP relay. Possible values for this setting are as follows:


    +   ● host - Only the local system is trusted. Attempts by all external clients
    to use the server as a relay will be rejected.


    +   ● subnet - Only systems on the same network subnet can use the server as a
    relay. If, for example, the server has an IP address of 192.168.1.29, a client
    system with an IP address of 192.168.1.30 could use the server as a relay.


    +   ● class - Any systems within the same IP address class (A, B, and C) may use
    the server as a relay.


    Trusted IP addresses may be defined manually by specifying subnets, address ranges,
    or referencing pattern files. The following'
  merge: -1
  pgno: 617
- img_proc: true
  md: 'example declares the local host and the subnet 192.168.0.0 as trusted IP addresses:


    ```

    mynetworks = 192.168.0.0/24, 127.0.0.0/8

    ```


    For this example, set the property to subnet so that any other systems on the
    same local network as the server can send email via SMTP relay. In contrast, external
    systems are prevented from doing so:


    ```

    mynetworks = subnet

    ```'
  merge: -1
  pgno: 618
- img_proc: true
  md: '# 30.7 Configuring DNS MX Records


    When you register and configure your domain name with a registrar, several default
    values will have been configured in the DNS settings. One of these is the so-called
    Mail Exchanger record. This record defines where emails addressed to your domain
    should be sent and is usually set by default to a mail server provided by your
    registrar. If you are hosting your own mail server, the MX record should be set
    to your domain or the IP address of your mail server. The steps to make this change
    will depend on your domain registrar but generally involves editing the DNS information
    for the domain and either adding or editing an existing MX record so that it points
    to your email server.'
  merge: -1
  pgno: 619
- img_proc: true
  md: '# 30.8 Starting Postfix on a Rocky Linux 9 System


    Once the /etc/postfix/main.cf file is configured with the correct settings, it
    is now time to start up postfix. This can be achieved from the command line as
    follows:


    ```

    # systemctl start postfix

    ```


    If postfix was already running, make sure the configuration changes are loaded
    using the following command:


    ```

    # systemctl reload postfix

    ```


    To configure postfix to start automatically at system startup, run the following
    command:


    ```

    # systemctl enable postfix

    ```


    The postfix process should now start up. The best way to verify everything works
    is to check your mail log. This is typically in /var/log/maillog file and should
    now contain an entry resembling the following output:


    ```

    Mar 25 11:21:48 demo-server postfix/postfix-script[5377]: starting the Postfix
    mail system

    ```'
  merge: -1
  pgno: 620
- img_proc: true
  md: "```\nMar 25 11:21:48 demo-server postfix/master[5379]: daemon started -\n \
    \ - version 3.3.1, configuration /etc/postfix\n```\n\nAs long as no error messages\
    \ have been logged, you have successfully installed and started postfix and are\
    \ ready to test the postfix configuration."
  merge: -1
  pgno: 621
- img_proc: true
  md: '# 30.9 Testing Postfix


    An easy way to test the postfix configuration is to send email messages between
    local users on the system. To perform a quick test, use the mail tool as follows
    (where name and mydomain domain are replaced by the name of a user on the system
    and your domain name, respectively):


    ```

    # mail name@mydomain.com

    ```


    When prompted, enter a subject for the email message and then type the message
    body text. To send the email message, press Ctrl-D. For example:


    ```

    # mail demo@mydomain.com

    ```


    Subject: Test email message


    This is a test message.


    EOT


    Rerun the mail command, this time as the other user, and verify that the message
    was sent and received:


    ```

    $ mail

    ```'
  merge: -1
  pgno: 622
