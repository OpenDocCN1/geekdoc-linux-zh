  md: '# 22.4 Working with Storage Volumes and Storage Pools


    When a virtual machine is created, it will usually have at least one virtual disk
    drive. The images that represent these virtual disk drives are stored in storage
    A pool can be an existing directory on a local filesystem, a filesystem partition,
    a physical disk device, Logical Volume Management (LVM) volume group, or even
    a remote network file system (NFS).


    Each storage pool is divided into one or more storage volumes. Storage volumes
    are typically individual image files, each representing a single virtual disk
    drive, but they can also take the form of physical disk partitions, entire disk
    drives, or LVM volume groups.


    When a virtual machine was created using the previous steps, a default storage
    pool was created to store virtual machine images. This default storage pool occupies
    space on the root filesystem and can be reviewed from within the Cockpit Virtual
    Machine interface by selecting the Storage Pools option at the top of the panel
    marked C in Figure 22-1 above.


