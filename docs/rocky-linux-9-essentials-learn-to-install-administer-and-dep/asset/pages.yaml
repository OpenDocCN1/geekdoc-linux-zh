  md: '# 3. Installing Rocky Linux 9 on a Clean Disk Drive


    There are now two ways in which a Rocky Linux 9 system can be deployed. One method
    is to either purchase new hardware or re-purpose an existing computer system on
    which to install and run the operating system. Another option is to create a cloud-based
    operating system instance using services such as Amazon AWS, Google Cloud, or
    Microsoft Azure (to name but a few). Since cloud-based instances are typically
    created by selecting a pre-configured, ready-to-run operating system image already
    optimized for the cloud platform and using that as the basis for the Rocky 9 system,
    there is no need to perform a manual operating system installation in this situation.


    If, on the other hand, you plan to install Rocky 9 on your own hardware, the first
    step on the path to learning about Rocky Linux 9 involves installing the operating
    system.


    Rocky 9 can be installed either in a clean disk environment (where an entire disk
    is cleared of any existing partitions and dedicated entirely to Rocky 9) or in
    a dual boot environment where Rocky 9 co-exists with another operating system
    on the disk (typically a member of the Microsoft Windows family of operating systems).


    This chapter will cover the clean disk approach to installation from local or
    remote installation media. Dual boot installation'
  merge: -1
