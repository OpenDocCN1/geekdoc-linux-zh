    DocumentRoot /var/www/myexample

    ```


    ```

    ErrorLog logs/myexample_error_log

    ```


    ```

    CustomLog logs/myexample_access_log combined

    ```


    The ServerAdmin directive in the above virtual host entry defines an administrative
    email address for people wishing to contact the webmaster for your site. Change
    this to an appropriate email address where you can be contacted.


    Next, the ServerName is declared so the web server knows the domain name associated
    with this virtual host.


    Since each website supported by the server will have its own set of files, the
    DocumentRoot setting is used to specify the location of the files for this website
    domain. The tradition is to use for example:


    ```

    DocumentRoot /var/www/myexample

    ```


    Finally, entries are added for the access history and error log files.


