  md: '# 24. Creating KVM Virtual Machines with virt-install and virsh


    In the previous chapters, we explored the creation of KVM guest operating systems
    on a Rocky Linux 9 host using Cockpit and the virt-manager graphical tool. This
    chapter will focus on creating KVM-based virtual machines using the virt-install
    and virsh command-line tools. These tools provide all the capabilities of the
    virt-manager and Cockpit options with the added advantage of being used within
    scripts to automate virtual machine creation. In addition, the virsh command allows
    virtual machines to be created based on a specification contained within a configuration
    file.


    The virt-install tool is supplied to allow new virtual machines to be created
    by providing a list of command-line options. This chapter assumes that the necessary
    KVM tools are installed. Read the chapter “Installing KVM Virtualization on Rocky
    Linux 9” for details on these requirements.'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# 24.1 Running virt-install to build a KVM Guest System


    The virt-install utility accepts a wide range of command-line arguments that provide
    configuration information related to the virtual machine being created. Some command-line
    options are mandatory (expressly, name, memory, and disk storage must be provided),
    while others are optional.


    At a minimum, a virt-install command will typically need the following arguments:


    +   --name - The name to be assigned to the virtual machine.


    +   --memory - The amount of memory allocated to the virtual machine.


    +   --disk - The name and location of an image file for storage for the virtual
    machine. This file will be created by virt-install during the virtual machine
    creation unless the --import option is specified to indicate an existing image
    file is to be used.


    +   --location - Specifies the local path or URL of a remote ISO image media containing
    the installation media for the guest operating system.'
  merge: -1
  pgno: 482
- img_proc: true
  md: 'A summary of all the arguments available for use when using virt-install can
    be found in the man page:


    ```

    $ man virt-install

    ```'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# 24.2 An Example Rocky Linux 9 virt-install Command


    With reference to the above command-line argument list, we can now look at an
    example command-line construct using the virt-install tool.


    Note that to display the virtual machine and complete the installation, a virt-viewer
    instance must be connected to the virtual machine after the virt-install utility
    starts. By default, virt-install will attempt to launch virt-viewer automatically
    once the virtual machine starts running. However, if virt-viewer is unavailable,
    virt-install will wait until a virt-viewer connection is established. For example,
    the virt-viewer session may be running locally on the host system if it has a
    graphical desktop, or a connection may be established from a remote client as
    outlined in the chapter entitled "Creating KVM Virtual Machines on Rocky Linux
    9"


    The following command creates a new KVM virtual machine configured to run Rocky
    Linux 9 using KVM para-virtualization. It creates a new 10GB disk image, assigns
    2048MB of RAM to the virtual machine, and configures a virtual CD device for the
    installation media ISO:


    ```

    virt-install --name demo_vm_guest --memory 2048 --disk path=/tmp/demo_vm_guest.img,size=10
    --network network=default --cdrom /tmp/Rocky-9.1-x86_64-minimal.iso

    ```


    As the creation process runs, the virt-install command will display status updates
    of the creation progress:'
  merge: -1
  pgno: 484
- img_proc: true
  md: 'Starting install...


    Allocating ''demo_vm_guest.img'' | 10 GB 00:00:01


    Running graphical console command: virt-viewer --connect qemu:///system --wait
    demo_vm_guest


    Once the guest system has been created, the virt-viewer screen will appear containing
    the operating system installer loaded from the specified installation media:'
  merge: -1
  pgno: 485
- img_proc: true
  md: From this point, follow the standard installation procedure for the guest operating
    system.
  merge: -1
