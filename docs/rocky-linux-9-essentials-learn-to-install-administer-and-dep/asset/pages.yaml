  md: '# 32.5 Summary


    Volume groups and logical volumes provide an abstract layer on top of the physical
    storage devices on a Rocky Linux 9 system to provide a flexible way to allocate
    the space provided by multiple disk drives. This allows disk space allocations
    to be made and changed dynamically without the need to repartition disk drives
    and move data between filesystems. This chapter has outlined the basic concepts
    of volume groups and logical and physical volumes while demonstrating how to manage
    these using command-line tools and the Cockpit web interface.'
  merge: -1
  pgno: 677
- img_proc: true
  md: '# 33. Adding and Managing Rocky Linux 9 Swap Space


    An essential part of maintaining the performance of a Rocky Linux 9 system involves
    ensuring that adequate swap space is available comparable to the memory demands
    placed on the system. Therefore, this chapter provides an overview of swap management
    on Rocky 9.'
  merge: -1
  pgno: 678
- img_proc: true
  md: '# 33.1 What is Swap Space?


    Computer systems have a finite amount of physical memory available to the operating
    system. When the operating system approaches the available memory limit, it frees
    up space by writing memory pages to disk. When the operating system requires any
    of those pages, they are read back into memory. The disk area allocated for this
    task is referred to as swap'
  merge: -1
  pgno: 679
- img_proc: true
  md: '# 33.2 Recommended Swap Space for Rocky Linux 9


    The swap recommended for Rocky 9 depends on several factors, including the amount
    of memory in the system, the workload imposed on that memory, and whether the
    system is required to support hibernation. The current guidelines for Rocky 9
    swap space are as follows:


    | follows: follows: follows: follows: follows: follows: |

    | follows: follows: follows: follows: |

    | follows: follows: follows: follows: |

    | follows: follows: follows: follows: |

    | follows: follows: follows: |


    Table 33-1


    When a system enters hibernation, the current system state is written to the hard
    disk, and the host machine is powered off. When the machine is subsequently powered
    on, the system''s state is restored from the hard disk drive. This differs from
    suspension, where the system state is stored in RAM. The machine then enters a
    sleep state whereby power is maintained to the system RAM while other devices
    are shut down.'
  merge: -1
  pgno: 680
- img_proc: true
  md: '# 33-3 Identifying Current Swap Space Usage


    The current amount of swap used by a Rocky 9 system may be identified in several
    ways. One option is to output the /proc/swaps file:


    ```

    # cat /proc/swaps

    ```


