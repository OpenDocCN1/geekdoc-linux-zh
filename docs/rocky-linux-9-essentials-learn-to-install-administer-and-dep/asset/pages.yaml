- img_proc: true
  md: '# 14.6 Summary


    A carefully planned and implemented firewall is vital to any secure system. In
    the case of Rocky 9, the firewalld service provides a firewall system that is
    both flexible and easy to administer.


    The firewalld service uses the concept of zones to group sets of firewall rules
    and includes a suite of pre-defined zones designed to meet a range of firewall
    protection requirements. These zones may be modified to add or remove rules, or
    entirely new zones created and configured. The network devices on the system that
    connect to networks or the internet are referred to as interfaces. Each interface,
    in turn, is assigned to a zone. The primary tools for working with firewalld are
    the `firewall-cmd` command-line tool and the `firewall-config` graphical utility.
    Minimal firewall management options are also available via the Cockpit web interface.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 15. Configuring SSH Key-based Authentication on Rocky Linux 9


    When a Rocky Linux 9 system is first installed, it is configured by default to
    allow remote command-line access via Secure Shell (SSH) connections. SSH provides
    password-protected and encrypted access to the system for the root account and
    any other users added during the installation phase. However, this level of security
    is inadequate and should be upgraded to SSH key-based authentication as soon as
    as possible.


    This chapter will outline the steps to increase the security of a Rocky 9 system
    by implementing key-based SSH authentication.'
  merge: -1
  pgno: 311
- img_proc: true
  md: The inherent weakness in a basic SSH implementation is that it depends entirely
    on the strength of the passwords assigned to the accounts on the system. If a
    malicious party is able to identify the password for an account (either through
    guesswork, deception, or a brute force attack), the system becomes vulnerable.
    This weakness can be addressed by implementing SSH key-based authentication.
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 15.2 SSH Key-based Authentication


    SSH key-based authentication uses asymmetric public key encryption to add an extra
    layer of security to remote access. The concept of public key encryption was devised
    in 1975 by Whitfield Diffie and Martin Hellman and is based on using a pair of
    private and public keys.


    In a public key encryption system, the public key is used to encrypt data that
    can only be decrypted by the owner of the private key.


    In the case of SSH key-based authentication, the host holds the private key on
    which the SSH client is located, while the corresponding public key resides on
    the system on which the SSH server is running. Therefore, it is vital to protect
    the private key since ownership of the key will allow anyone to log into the remote
    system. As an added layer of protection, the private key may also be encrypted
    and protected by a password which must be entered each time a connection is established
    to the server.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# 15.3 Setting Up Key-based Authentication


    There are four steps to setting up key-based SSH authentication, which can be
    summarized as follows:


    +   1. Generate the public and private keys.

    2. Install the public key on the server.

    3. Test authentication.

    4. Disable password-based authentication on the server.


    The remainder of this chapter will outline these steps in greater detail for Linux,
    macOS, and Windows-based client operating systems.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 15.4 Installing and Starting the SSH Service


    If the SSH server is not already installed and running on the system, it can be
    added using the following commands:


    ```

    # dnf install openssh-server

    ```


    ```

    # systemctl start sshd.service

    ```


    ```

    # systemctl enable sshd.service

    ```'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 15.5 SSH Key-based Authentication from Linux and macOS Clients


    The first step in setting up SSH key-based authentication is to generate the key
    pairs on the client system. If the client system is running Linux or macOS, this
    is achieved using the ssh-keygen utility:


    ```

    # ssh-keygen

    ```


