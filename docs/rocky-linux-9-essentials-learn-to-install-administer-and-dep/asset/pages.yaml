  md: '# 3.2.1 Linux


    The first step in writing an ISO image to a USB drive on Linux is identifying
    the device name. Before inserting the USB drive, identify the storage devices
    already detected on the system by listing the devices in /dev as follows:


    ```

    # ls /dev/sd*

    ```


    ```

    /dev/sda /dev/sda1 /dev/sda2

    ```


    Attach the USB drive to the Linux system and run the dmesg command to get a list
    of recent system messages, one of which will be a report that the USB drive was
    detected and will be similar to the following:


    ```

    [ 406.241717] sd 6:0:0: [sdb] Attached SCSI removable disk

    ```


    This output tells us that we should expect the device name to include “sdb” which
    we can confirm by listing device names in /dev again:


    ```

    # ls /dev/sd*

    ```


    ```

    /dev/sda /dev/sda1 /dev/sda2 /dev/sdb

    ```'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'This output shows that the USB drive has been assigned to /dev/sdb. The next
    step before writing the ISO image to the device is to run the findmnt command
    to make sure it has not been auto-mounted:


