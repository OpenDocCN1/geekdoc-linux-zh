  md: '# 11.7 Enabling, Disabling, and Masking systemd Units


    A newly installed Rocky 9 system will include the base systemd service units but
    is unlikely to include all the services the system will eventually need once it
    goes into a production environment. A basic Rocky 9 installation, for example,
    will typically not include the packages necessary to run an Apache web server,
    a key element of which is the httpd.service unit.


    The system administrator will resolve this problem by installing the necessary
    httpd packages using the following command:


    ```

    # dnf install httpd

