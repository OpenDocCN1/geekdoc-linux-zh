  md: '# 19.5 Configuring the smb.conf File


    Samba is a highly flexible and configurable system that provides many options
    for controlling how resources are shared on Windows networks. Unfortunately, this
    flexibility can lead to the sense that Samba is overly complex. In reality, however,
    the typical installation does not need many configuration options, and the learning
    curve to set up a basic configuration is relatively short.


    For this chapter, we will look at joining a Rocky 9 system to a Windows workgroup
    and setting up a directory as a shared resource that a specific user can access.
    This is a configuration known as a standalone Samba More advanced configurations,
    such as integrating Samba within an Active Directory environment, are also available,
    though these are outside the scope of this book.


    The first step in configuring Samba is to edit the /etc/samba/smb.conf file.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# 19.5.1 Configuring the [global] Section


    The smb.conf file is divided into sections. The first section is the [global]
    section, where settings that apply to the entire Samba configuration can be specified.
    While these settings are global, each option may be overridden within other configuration
    file sections.


    The first task is defining the Windows workgroup name on which the Rocky 9 resources
    will be shared. This is controlled via the workgroup = directive of the [global]
    section, which by default is configured as follows:


    ```

    workgroup = SAMBA

    ```


    Begin by changing this to the actual name of the workgroup if necessary.


    In addition to the workgroup setting, the other settings indicate that this is
    a standalone server on which user passwords will protect the shared resources.
    Before moving on to configuring the resources to be shared, other parameters also
    need to be added to the [global] section as follows:


    [global]'
  merge: -1
  pgno: 401
- img_proc: true
  md: '```

    netbios name = LinuxServer

    ```


    The “netbios name” property specifies the name by which the server will be visible
    to other systems on the network.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# 19.5.2 Configuring a Shared Resource


    The next step is configuring the shared resources (in other words, the resources
    that will be accessible from other systems on the Windows network. To achieve
    this, the section is given a name by which it will be referred when shared. For
    example, if we plan to share the /sampleshare directory of our Rocky 9 system,
    we might entitle the section [sampleshare]. In this section, a variety of configuration
    options are possible. For this example, however, we will simply define the directory
    that is to be shared, indicate that the directory is both browseable and writable,
    and declare the resource public so that guest users can gain access:


    [sampleshare]


    ```

    comment = Example Samba share

    path = /sampleshare

    browseable = Yes

    public = yes

    writable = yes

    ```'
  merge: -1
