  md: '# 25.6 Summary


    By default, KVM virtual machines are connected to a virtual network that uses
    NAT to provide access to the network to which the host system is connected. If
    the guests are required to appear on the network with their own IP addresses,
    they need to be configured to share the physical network interface of the host
    system. This chapter outlines that this can be achieved using the *nmcli* or *nm-connection-editor*
    tools to create a networked bridge interface.'
  merge: -1
  pgno: 517
- img_proc: true
  md: '# 26. Managing KVM using the virsh Command-Line Tool


    In previous chapters, we have covered the installation and configuration of KVM-based
    guest operating systems on Rocky Linux 9. This chapter explores additional areas
    of the virsh tool that have not been covered in previous chapters and how it may
    be used to manage KVM-based guest operating systems from the command line.'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# 26.1 The virsh Shell and Command-Line


    The virsh tool is both a command-line tool and an interactive shell environment.
    When used in the command-line mode, the command is issued at the command prompt
    with sets of arguments appropriate to the task.


    To use the options as command-line arguments, use them at a terminal command prompt,
    as shown in the following example:


    ```

    # virsh

    ```


    The virsh tool, when used in shell mode, provides an interactive environment from
    which to issue sequences of commands.


    To run commands in the virsh shell, run the following command:


    ```

    # virsh

    ```


    Welcome to virsh, the virtualization interactive terminal.


    Type: ''help'' for help with commands


    ```

    ''quit'' to quit

    ```'
  merge: -1
  pgno: 519
- img_proc: true
  md: '```

    virsh #

    ```


    At the virsh # prompt, enter the options you wish to run. The following virsh
    session, for example, lists the current virtual machines, starts a virtual machine
    named FedoraVM, and then obtains another listing to verify the VM is running:


    # # virsh


    Welcome to virsh, the virtualization interactive terminal.


    Type: ''help'' for help with commands


    ''quit'' to quit


