  md: '# 3.9 Installing Updates


    As with most operating systems today, each release of a Rocky Linux distribution
    continues to evolve after it has been released to the public. This generally takes
    the form of bug fixes, security updates, and occasionally, new features that may
    be downloaded over the internet and installed on your system.


    Best practices dictate that the first step after installing Rocky 9 is to make
    ensure any available updates are applied to the system. This can be achieved via
    the command-line prompt in a Terminal window using the dnf package manager tool.
    To check for the availability of updates, run the following command:


    ```

    # dnf check-update

    ```


    Any pending updates may be applied, once again, using the dnf tool:


    ```

    # dnf update

    ```


    Upon execution, the dnf tool will provide a list of available packages for update
    and prompt for permission to perform the update.'
  merge: -1
  pgno: 77
- img_proc: true
  md: Once the update is complete, the installation is essentially finished, and Rocky
    9 is ready for use.
  merge: -1
  pgno: 78
- img_proc: true
