- img_proc: true
  md: '#  16.9 Troubleshooting a VNC Connection


    With so much happening in the background, VNC can sometimes seem opaque, particularly
    when problems arise and the server fails to start or connect, resulting in error
    messages. There are, however, some techniques for tracking down and resolving
    VNC problems:


    If the VNC service fails to start, check the systemctl status of the service and
    check for error messages:


    ```

    # systemctl status vncserver@:1.service

    ```


    For more detailed information, check the systemd journal by running the journalctl
    command:


    ```

    # journalctl -xe

    ```


    Additional information may be available in the log file located at:


    /home//.vnc/::number>.log


    For example:


    /home/neilsmyth/vnc/demoserver01.localdomain:1.log'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'If the systemd VNC service is still unable to start the VNC server, try starting
    it manually using the following command:


    ```

    # vncserver :number>

    ```


    For example:


    ```

    # vncserver :1

    ```


    Check the output and log file for errors that may help identify the problem. Then,
    if the server starts successfully, try connecting again with a VNC viewer.


    If the VNC server appears to be running, but attempts to connect from a viewer
    fail, it may be worth checking that the correct firewall ports are open. Begin
    by identifying the default zone as follows:


    ```

    # firewall-cmd --get-default-zone

    ```


    public


    Having obtained the default zone, check that the necessary ports are open:


    ```

    # firewall-cmd --permanent --zone=public --list-ports

    ```'
  merge: -1
  pgno: 361
- img_proc: true
  md: '5901/tcp 5900/tcp


    If a port used by VNC is not open, add the port as follows:


    ```

    # firewall-cmd --permanent --zone=public --add-port=number>/tcp

    ```'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 16.10 Summary


    Remote access to the GNOME desktop environment of a Rocky 9 system can be enabled
    by using Virtual Network Computing (VNC). Comprising the VNC server running on
    the remote server and a corresponding client on the local host, VNC allows remote
    access to multiple desktop instances running on the server.


    When the VNC connection is being used over a public connection, SSH tunneling
    is recommended to ensure that the communication between the client and server
    is encrypted and secure.'
