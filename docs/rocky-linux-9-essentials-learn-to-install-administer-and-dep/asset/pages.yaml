    ```'
  merge: -1
  pgno: 557
- img_proc: true
  md: '# 28.6 Removing an Image from Local Storage


    To remove an image from local storage once it is no longer needed, run the **podman
    rmi** command, referencing either the image name or ID as output by the **podman
    images** command. For example, to remove the image named myrock_image created
    in the previous section, run **podman** as follows:


    ```

    # podman rmi localhost/myrock_image

    ```


    Before an image can be removed, any containers based on that image must first
    be removed.'
  merge: -1
