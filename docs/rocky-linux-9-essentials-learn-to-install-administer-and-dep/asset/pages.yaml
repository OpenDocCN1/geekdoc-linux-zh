  md: '# 29-7 Configuring the Apache Web Server for Your Domain


    The next step in setting up your web server is configuring it for your domain
    name. To configure the web server, begin by changing directory to which, in turn,
    contains several files and sub-directories. Change directory into the conf sub-directory,
    where you will find a file named httpd.conf containing the configuration settings
    for the Apache server.


    Edit the httpd.conf file using your preferred editor with super-user privileges
    to ensure you have permission to access and modify the file. Once loaded, several
    settings need to be changed to match your environment.


    The most common way to configure Apache for a specific domain is to add virtual
    host entries to the httpd.conf file. This allows a single Apache server to support
    multiple websites simply by adding a virtual host entry for each site domain.
    Within the httpd.conf file, add a virtual host entry for your domain as follows:


    ```

    *:<80>

    ```


    ```

    ServerAdmin feedback@myexample.com


    ServerName www.myexample.com

    ```'
  merge: -1
