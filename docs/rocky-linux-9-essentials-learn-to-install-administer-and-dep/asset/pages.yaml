- img_proc: true
  md: '# 11.9 Summary


    A newly installed Rocky 9 system includes a base set of systemd units, many of
    which run in the background to provide much of the system''s functionality. These
    units are categorized by type, the most common being targets and services. A target
    unit is a group of other units to be started collectively. The system has a default
    target unit that defines the other units to be started each time the system boots.
    The most common targets are those which boot the system to either multi-user or
    graphical mode. In addition, the systemctl command-line tool provides a range
    of options for performing systemd unit configuration tasks, many of which are
    also available through the Cockpit web-based interface.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 12. Rocky Linux 9 Network Management


    It is difficult to envisage a Rocky Linux 9 system that does not have at least
    one network connection and harder still to imagine how such an isolated system
    could be of much practical use. The simple fact is that Rocky 9 is designed to
    provide enterprise-level services over network and internet connections. Therefore,
    a crucial part of learning how to administer a Rocky 9 system involves learning
    how to configure and manage the network interfaces installed on the system.


    This chapter provides an overview of network management on Rocky 9, including
    the NetworkManager service and tools and some other useful utilities.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# ## 12.1 Introduction to NetworkManager


    NetworkManager is a service and set of tools designed specifically to make it
    easier to manage the networking configuration on Linux systems and is the default
    network management service on Rocky 9.


    In addition to a service that runs in the background, NetworkManager also includes
    the following tools:


    +   - A tool for working with NetworkManager via the command line. This tool is
    useful when access to a graphical environment is unavailable and can also be used
    within scripts to make network configuration changes.


    +   - A basic text-based user interface for managing NetworkManager. This tool
    can run within any terminal window and allows changes to be made by making menu
    selections and entering data. While helpful in performing basic tasks, nmui lacks
    many of the features provided by the nmcli tool.


    +   - A complete graphical management tool providing access to most NetworkManager
    configuration options.


    +   **GNOME Settings** - The Network screen of the GNOME desktop Settings application
    allows basic network management tasks to be performed.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '•Cockpit Network Settings - The Network screen of the Cockpit web interface
    allows a range of network management tasks to be performed.


    Although there are several ways to manage the network environment on a Rocky 9
    system, this chapter will focus on the nmcli command. While the graphical tools
    are certainly helpful when you have access to a desktop environment or Cockpit
    has been enabled, understanding the command-line interface is essential for situations
    where a command prompt is all that is available. Also, the graphical tools (Cockpit
    included) only include some of the capabilities of the nmcli tool. Finally, once
    you are familiar with NetworkManager and those skills will translate easily when
    using the more intuitive tool options. The same cannot be said of the graphical
    tool options. It is harder to use nmcli if, for example, you have only ever used'
  merge: -1
