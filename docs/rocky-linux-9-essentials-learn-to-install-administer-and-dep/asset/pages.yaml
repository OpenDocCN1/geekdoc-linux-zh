    Once the local email is working, try sending an email to an

    external address (such as a GMail account). Also, test that

    incoming mail works by sending an email from an external

    account to a user on your domain. In each case, check the

    /var/log/maillog file for explanations of any errors.'
  merge: -1
  pgno: 624
- img_proc: true
  md: '# 30.10 Sending Mail via an SMTP Relay Server


    An SMTP Relay service is an alternative to configuring a mail server to handle
    outgoing email messages. As previously discussed, several services are available,
    most of which can be found by performing a web search for “SMTP Relay Service”.
    Most of these services will require you to verify your domain in some way and
    will provide MX records with which to update your DNS settings. You will also
    be provided with a username and password, which must be added to the postfix configuration.
    The remainder of this section assumes that postfix is installed on your system
    and that all of the initial steps required by your chosen SMTP Relay provider
    have been completed.


    Begin by editing the /etc/postfix/main.cf file and configure your myhostname parameter
    with your domain name:


    ```

    myhostname = mydomain.com

    ```


    Next, create a new file in /etc/postfix named sasl_passwd and add a line containing
    the mail server host provided by the relay service and the user name and password.
    For example:


    ```

    [smtp.myprovider.com]:587 neil@mydomain.com:myppassword

    ```


    Note that port 587 has also been specified in the above entry. Without this setting,
    postfix will default to using port 25, which is'
  merge: -1
  pgno: 625
- img_proc: true
  md: 'blocked by default by most SMTP relay service providers.


    With the password file created, use the postmap utility to generate the hash database
    containing the mail credentials:


    ```

    # postmap /etc/postfix/sasl_passwd

    ```


    Before proceeding, take some additional steps to secure your postfix credentials:


    ```

    # chown root:root /etc/postfix/sasl_passwd

    /etc/postfix/sasl_passwd.db

    ```


    ```

    # chmod 0600 /etc/postfix/sasl_passwd

    /etc/postfix/sasl_passwd.db

    ```


    Edit the main.cf file once again and add an entry to specify the relay server:


    relayhost = [smtp.myprovider.com]:587


    Remaining within the main.cf file, add the following lines to configure the authentication
    settings for the SMTP server:


    ```

    smtp_use_tls = yes

    ```'
  merge: -1
  pgno: 626
- img_proc: true
  md: '```

    smtp_sasl_auth_enable = yes

    ```


    ```

    smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd

    ```


    ```

    smtp_tls_CAfile = /etc/ssl/certs/ca-bundle.crt

    ```


    ```

    smtp_sasl_security_options = noanonymous

    ```


    ```

    smtp_sasl_tls_security_options = noanonymous

    ```


    Finally, restart the postfix service:


    ```

    # systemctl restart postfix

    ```


    Once the service has restarted, try sending and receiving mail using either the
    mail tool or your preferred mail client.'
  merge: -1
  pgno: 627
- img_proc: true
  md: '# 30.11 Summary


    A complete, end-to-end email system consists of a Mail User Agent (MUA), Mail
    Transfer Agent (MTA), Mail Delivery Agent (MDA), and the SMTP protocol. Rocky
    Linux 9 provides several options in terms of MTA solutions, one of the more popular
    being Postfix. This chapter has outlined how to install, configure and test postfix
    on a Rocky 9 system to act as a mail server and send and receive email using a
    third-party SMTP relay server.'
  merge: -1
  pgno: 628
- img_proc: true
  md: '# 31. Adding a New Disk Drive to a Rocky Linux 9 System


    One of the first problems users and system administrators encounter is that systems
    need more disk space to store data. Fortunately, disk space is now one of the
    cheapest IT commodities. In this and the next chapter, we will look at configuring
    Rocky 9 to use the space provided when a new physical or virtual disk drive is
    installed.'
  merge: -1
  pgno: 629
- img_proc: true
  md: '# 31.1 Mounted File Systems or Logical Volumes


    There are two ways to configure a new disk drive on a Rocky 9 system. One straightforward
    method is to create one or more Linux partitions on the new drive, create Linux
    file systems on those partitions and then mount them at specific mount points
    to be accessed. This approach will be covered in this chapter.


    Another approach is adding new space to an existing volume group or creating a
    new one. When Rocky 9 is installed, a volume group named rl is created. Within
    this volume group are three logical volumes named and used to store the / and
    /home file systems and swap partitions, respectively. We can increase the disk
    space available to the existing logical volumes by configuring the new disk as
    part of a volume group. For example, using this approach, we can increase the
    size of the /home file system by allocating some or all of the space on the new
    disk to the home volume. This topic will be discussed in detail in "Adding a New
    Disk to a Rocky Linux 9 Volume Group and Logical'
  merge: -1
  pgno: 630
- img_proc: true
  md: '# 31.2 Finding the New Hard Drive


    This tutorial assumes that a new physical or virtual hard drive has been installed
    and is visible to the operating system. Once added, the operating system should
    automatically detect the new drive. Typically, the disk drives in a system are
    assigned device names beginning hd, sd, or nvme, followed by a letter to indicate
    the device number. The first device might be the second etc.


    The following is the output from a typical system with only one disk drive connected
    to a SATA controller:


    ```

    # ls /dev/sd*

    ```


    ```

    /dev/sda /dev/sda1 /dev/sda2

    ```


    This shows that the disk drive represented by /dev/sda is divided into two partitions,
    represented by /dev/sda1 and


    The following output is from the same system after a second hard disk drive has
    been installed:


    ```

    # ls /dev/sd*

    ```


    ```

    /dev/sda /dev/sda1 /dev/sda2 /dev/sdb

    ```'
  merge: -1
  pgno: 631
- img_proc: true
  md: 'The new hard drive has been assigned to the device file The drive has no partitions
    shown (because we have yet to create any).


    At this point, we can create partitions and file systems on the new drive and
    mount them for access or add the disk as a physical volume as part of a volume
    group. To perform the former continue with this chapter; otherwise, read "Adding
    a New Disk to a Rocky Linux 9 Volume Group and Logical Volume" for details on
    configuring Logical Volumes.'
  merge: -1
  pgno: 632
- img_proc: true
  md: '# 31.3 Creating Linux Partitions


