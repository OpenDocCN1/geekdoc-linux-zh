  md: '# 12.6 Configuring NetworkManager Permissions


    In addition to making it easier to manage networks on Rocky 9, NetworkManager
    also allows permissions to be specified for connections. The following command,
    for example, restricts a connection profile to root and user accounts named john
    and caitlyn:


    ```

    # nmcli con mod static_ip connection.permissions

    user:root,john,caitlyn

    ```


    Once NetworkManager has reloaded the connection profiles, the static_ip connection
    will only be active and accessible to other users when at least one designated
    user is logged in to an active session on the system. As soon as the last of these
    users logs out, the connection will go down and remain inactive until one of the
    users signs back in.


    In addition, only users with permission can change the connection status or configuration.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '#  12.7 Summary


    The NetworkManager service handles network management on Rocky 9. NetworkManager
    views a network as consisting of network interface devices and connections. A
    network device can be a physical Ethernet or WiFi device or a virtual device used
    by a virtual machine guest. Connections represent the network to which the devices
    connect and are configured by connection profiles. A configuration profile will,
    among other settings, define whether the connection has a static or dynamic IP
    address, the IP address of any gateway used by the network, and whether or not
    the connection should be established automatically each time the system starts
    up.


    NetworkManager can be administered using several tools, including the nmcli and
    nmtui command-line tools, the nm-connection-editor graphical tool, and the network
    settings section of the Cockpit web interface. In general, the nmcli command-line
    tool provides the most features and flexibility.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# 13. Rocky Linux 9 Firewall Basics


    A firewall is a vital component in protecting an individual computer system or
    network of computers from external attacks (typically from an internet connection).
    Any computer connected directly to an internet connection should ideally run a
    firewall to protect against malicious activity. Similarly, any internal network
    must have some form of firewall between it and an external internet connection.


    Rocky Linux 9 is supplied with powerful firewall technology known as iptables
    built-in. Entire books can, and indeed have, been written about configuring iptables.
    If you would like to learn about iptables, we recommend the following:


    https://www.linuxtopia.org/Linux_Firewall_iptables/index.html


    This chapter will cover some basic concepts of firewalls, TCP/IP ports, and services.
    Firewall configuration on Rocky 9 will be covered in the chapter entitled "Rocky_Linux_9
    Firewall Configuration with'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# 13.1 Understanding Ports and Services


    The predominant network communications protocol in these days is TCP/IP. It is
    the protocol used by the internet and, as such, has swept away most of the formerly
    popular protocols used for local area networks (LANs).


    TCP/IP defines a total of 65,535 ports, of which 1023 are considered well-known
    It is essential to understand that these are not physical ports into network cables
    are connected but rather virtual ports on each network connection which can be
    used by applications and services to communicate over a TCP/IP network connection.
    In reality, the number of ports used by popular network clients and services comprises
    an even smaller subset of the well-known group of ports.


    An operating system can provide several different TCP/IP services. A comprehensive
    list of such services is provided in the table at the end of this chapter. Still,
    such services include HTTPS for running a secure web server, FTP for allowing
    file transfers, SSH for providing secure remote login and file transfer, SMTP
    for transporting email messages. Each service is, in turn, assigned to a standard
    TCP/IP port. For example, HTTPS is assigned to port 443, while SSH communication
    occurs on port 22.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 13.2 Securing Ports and Services


    A large part of securing servers involves defining roles and, based on the roles,
    defining which services and ports should be enabled. For example, a server that
    acts solely as a web server should only run the HTTPS service (in addition to
    perhaps SSH for remote administration access). All other services should be disabled
    and, ideally, removed entirely from the operating system (thereby making it harder
    for an intruder to re-enable the service).


    Securing a system involves removing any unnecessary services from the operating
    system and ensuring that the ports associated with the non-essential services
    are blocked using a firewall. The rules that define which ports are accessible
    and under what circumstances are determined using iptables.


    Many operating systems are installed with several services installed and activated
    by default. Before installing a new operating system, the installation must be
    carefully planned. This planning involves deciding which services are not required
    and identifying which services have been installed and enabled by default. Deployment
    of new operating system installations should never be rushed. The fewer services
    and open ports available on a system, the smaller the surface area and opportunities
    for attackers.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# 13.3 Rocky Linux 9 Services and iptables Rules


    By default, a newly installed Rocky 9 system has no iptables rules defined to
    restrict access to ports. The following command may be executed in a terminal
    window to view the current iptables settings:


    ```

    # iptables -L

    ```


    Chain INPUT (policy ACCEPT)


    target prot opt source destination


    Chain FORWARD (policy ACCEPT)


    target prot opt source destination


    Chain OUTPUT (policy ACCEPT)


    target prot opt source destination


    As illustrated in the above output, no rules are currently defined. While this
    may appear to be an unsafe configuration, it is essential to remember that a newly
    installed Rocky 9 system also has few services running by default, making the
    ports useless to a potential attacker. For example, accessing a web server on
    a newly'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'installed Rocky 9 system is impossible because no web server services are installed
    or running by default. Once services begin to be activated on the system, it will
    be important to establish a firewall strategy by defining iptables rules.


    Several methods are available for defining iptables rules, including using command
    line tools and configuration files. For example, to block access to port 25 (used
    by the SMTP mail transfer protocol) from IP address 192.168.2.76, the following
    command could be issued in a terminal window:


    ```

    # iptables -A INPUT -s 192.168.2.76 -p tcp --destination-port 25 -j DROP

    ```


    If we now check the current rules, we will see that this one is currently listed:


    ```

    # iptables -L

    ```


    ```

    Chain INPUT (policy ACCEPT)


    target prot opt source destination


    DROP tcp -- 192.168.2.76 anywhere tcp dpt:smtp


    Chain FORWARD (policy ACCEPT)

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'target prot opt source destination


    Chain OUTPUT (policy ACCEPT)


    target prot opt source destination


    The rule may subsequently be removed as follows:


    ```

    # iptables -D INPUT -s 192.168.2.76 -p tcp --destination-port 25 -j

    DROP

    ```


    Given the complexity of iptables it is surprising that several user-friendly configuration
    tools have been created to ease the rule creation process. One such tool is the
    firewall-cmd command-line tool which will be covered in the chapter "Rocky Linux
    9 Firewall Configuration with'
