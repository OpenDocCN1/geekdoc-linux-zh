  md: '# 4.3 Accessing the Windows Partition from Rocky 9


    When running Rocky 9 in a dual boot configuration, it is possible to access files
    located on the Windows partition by manually mounting the partition from the command
    line. Before doing so, however, some additional packages need to be installed
    on the system. First, the fuse kernel module needs to be downloaded and installed:


    ```

    # dnf install fuse

    ```


    ```

    # modprobe fuse

    ```


    Next, the Fuse NTFS driver needs to be installed. Unfortunately, this package
    is not included in the standard Rocky 9 repositories, so the Extra Packages for
    Enterprise Linux repository needs to be added to the system as follows:


    ```

    # dnf config-manager --set-enabled crb

    ```


    ```

    # dnf install \

    \nhttps://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm \

    ```'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'https://dl.fedoraproject.org/pub/epel/epel-next-release-latest-9.noarch.rpm


    With the EPEL repository added, the driver can now be installed:


    ```

    # dnf install ntfs-3g

    ```


    Once the requisite packages are installed, the next step is to create a directory
    to use as the mount point for our Windows partition. In this example, we will
    create a directory named


    ```

    # mkdir /mnt/windows

