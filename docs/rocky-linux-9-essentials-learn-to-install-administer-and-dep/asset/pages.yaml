  md: '# 28.8 Building a Container with Buildah


    Buildah allows new containers to be built from existing containers, an image,
    or entirely from scratch. Buildah also includes the ability to mount the file
    system of a container so that it can be accessed and modified from the host.


    The following buildah command, for example, will build a container from the Rocky
    Linux 9 image (if the image has not already been pulled from the registry, buildah
    will download it before creating the container):


    ```

    # buildah from docker.io/library/rockylinux:9.1-minimal

    ```


    The result of running this command will be a container named rockylinux-working-container
    that is ready to run:


    ```

    # buildah run rockylinux-working-container cat /etc/passwd

    ```'
  merge: -1
  pgno: 560
