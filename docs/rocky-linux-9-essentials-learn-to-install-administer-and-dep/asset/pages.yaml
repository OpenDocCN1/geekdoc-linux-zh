- img_proc: true
  md: 'Figure 16-2


    Unfortunately, although the connection is now secure, the VNC viewer software
    has no way of knowing this and consequently continues to issue warnings. However,
    rest assured that as long as the SSH tunnel is being used, the connection is indeed
    secure.


    In the above example, we left the SSH tunnel session running in a terminal window.
    If you would prefer to run the session in the background, this can be achieved
    by using the -f and -N flags when initiating the connection:


    ```

    $ ssh -l -f -N 5901:localhost:5901

    ```


    The above command will prompt for a password for the remote server and then establish
    the connection in the background, leaving the terminal window available for other
    tasks.


    If you are connecting to the remote desktop from outside the firewall, keep in
    mind that the IP address for the SSH connection will be the external IP address
    provided by your ISP or cloud hosting provider, not the LAN IP address of the
    remote system (since this IP address is not visible to those outside the firewall).
    Therefore, you will also need to configure your firewall to forward port 22 (for
    the SSH connection) to the IP address of the system running the desktop. It is
    not necessary to forward port port 5900.'
  merge: -1
