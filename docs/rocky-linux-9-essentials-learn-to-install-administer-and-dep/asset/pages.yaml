- img_proc: true
  md: '# 8.10 Working with Pipes in the Bash Shell


    In addition to I/O redirection, the shell also allows output from one command
    to be piped directly as input to another command. A pipe operation is achieved
    by placing the ''|'' character between two or more commands on a command line.
    For example, to count the number of processes running on a system, the output
    from the ps command can be piped through to the wc command:


    ```

    $ ps -ef | wc -l

    ```


    There is no limit to the number of pipe operations that can be performed on a
    command line. For example, to find the number of lines in a file that contain
    the name Smith:


    ```

    $ cat namesfile | grep Smith | wc -l

    ```'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 8.11 Configuring Aliases


    As you gain proficiency with the shell environment, you will likely frequently
    issue commands with the same arguments. For example, you may often use the ls
    command with the l and t options:


    ```

    $ ls -lt

    ```


    To reduce the amount of typing involved in issuing a command, it is possible to
    create an alias that maps to the command and arguments. For example, to create
    an alias such that entering the letter l I will cause the ls -lt command to be
    executed, the following statement would be


    ```

    $ alias l="ls -lt"

    ```


    Entering l at the command prompt will now execute the original statement.'
