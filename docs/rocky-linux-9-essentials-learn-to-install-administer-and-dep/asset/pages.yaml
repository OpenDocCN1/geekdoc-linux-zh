  md: '# 3.11 Summary


    The first step in working with Rocky Linux 9 is to install the operating system.
    In the case of a cloud-based server, this task is typically performed automatically
    when an operating system image is selected for the system based on a range of
    options offered by the cloud service provider. Installation on your own hardware,
    however, downloading the installation media as an ISO image, writing that image
    to suitable storage such as a DVD or USB drive, and booting from it. Once running,
    the installation process allows a range of options to be configured, ranging from
    networking, whether the installation should proceed from the local media or via
    a remote server or repository, the packages to be installed, and the partitioning
    of the disk. Once installation is complete, it is important to install any operating
    system updates that may have been released since the original installation image
    was created.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 4. Dual Booting Rocky Linux 9 with Windows


    Like most Linux distributions, Rocky Linux 9 will happily co-exist on a hard disk
    drive with just about any version of Windows up to and including Windows 11. This
    is a concept known as dualbooting. When you power up the system, you will be presented
    with a menu providing the option to boot either Rocky 9 installation or Windows.
    Obviously, you can only run one operating system at a time. Still, it is worth
    noting that the files on the Windows partition of your disk drive will be available
    to you from Rocky 9 regardless of whether your Windows partition was formatted
    using NTFS, FAT16, or FAT32.


    This installation method involves shrinking the size of the existing Windows partitions
    and then installing Rocky 9 into the reclaimed space. This chapter will assume
    that Rocky 9 is being installed on a system currently running Windows 11.'
  merge: -1
  pgno: 82
- img_proc: true
