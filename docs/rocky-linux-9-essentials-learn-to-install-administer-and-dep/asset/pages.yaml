  md: '# 3.1 Obtaining the Rocky Linux Installation Media


    The Rocky Linux distribution can be downloaded from the project website using
    the following URL:


    https://rockylux.org/download


    The installation media is provided in the form of ISO images and is available
    in the following forms:


    ISO - A small image that will boot the system but downloads all of the packages
    needed for the installation over the internet. Also helpful in rescuing a damaged
    Rocky installation.


    ISO - This image contains the files necessary to begin the installation and requires
    access to the full installation media located on a remote server. The boot image
    can also perform rescue operations on an existing Rocky Linux system.


    ISO - A self-contained image, including all of the packages necessary to install
    a Rocky Linux system


    For the purposes of this book, download the DVD ISO image, which is named using
    the following convention:


    Rocky---dvd.iso'
