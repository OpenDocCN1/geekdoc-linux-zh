  md: '# 3.6 User Settings


    Before the installation can be completed, you must create a root password and
    an optional user account. The root, or super-user account, is a special user with
    administrative privileges on the system. While you will generally use your own
    account to log into the system, you will need root privileges to configure the
    system and perform other administrative tasks.


    Select the Root Password option and enter a suitably secure password. Options
    are also available to lock the root account, so it cannot be accessed and to allow
    access to the root account over remote connections to the system via password
    authentication. In general, it is recommended to leave the root account unlocked
    but to disallow remote SSH access using password access. If remote root access
    is required, it should be implemented using SSH key-based authentication, a topic
    we will be covering in the [Configuring SSH Key-based Authentication on Rocky
    Linux 9]() chapter of this book.


    Next, select the User Creation option and enter a user name and password. If you
    would like this user to be able to perform administrative tasks using the `sudo`
    command, also enable the *Make this user administrator* checkbox. If this option
    is not enabled, the user must use the `su` command and enter the root password
    to gain root privileges (assuming that the option outlined above to lock the root
    account was not enabled). If the'
  merge: -1
  pgno: 72
- img_proc: true
  md: user you add will need to perform administrative tasks, sudo is the recommended
    option, and the checkbox should be enabled.
  merge: -1
