- img_proc: true
  md: '# 31.5 An Overview of Journaled File Systems


    A journaling filesystem keeps a journal or log of the changes being made to the
    filesystem disk writing that can be used to rapidly reconstruct corruptions that
    may occur due to events such as a system crash or power outage.


    There are several advantages to using a journaling file system.

    First, the size and volume of data stored on disk drives have grown exponentially
    over the years. The problem with a non-journaled file system is that following
    a crash, the *fsck* (filesystem consistency check) utility has to be run. The
    *fsck* utility will scan the entire filesystem validating all entries and ensuring
    that blocks are allocated and referenced correctly. It will attempt to fix the
    problem if it finds a corrupt entry. The issues are two-fold. First, the *fsck*
    utility will not always be able to repair the damage, and you will end up with
    data in the *lost+found* directory. An application uses this data, but the system
    no longer knows where it was referenced from. The other problem is the issue of
    time. Completing the *fsck* process on an extensive file system can take a long
    time, potentially leading to unacceptable downtime.


    On the other hand, a journaled file system records information in a log area on
    a disk (the journal and log do not need to be on the same device) during each
    write. This is essentially an “intent to commit” data to the filesystem. The amount
    of information'
  merge: -1
  pgno: 639
- img_proc: true
  md: 'logged is configurable and ranges from not logging anything to logging what
    is known as the “metadata” (i.e., ownership, date stamp information, etc.) to
    logging the “metadata” and the data blocks that are to be written to the file.
    Once the log is updated, the system writes the actual data to the appropriate
    filesystem areas and marks an entry to say the data is committed.


    After a crash, the filesystem can quickly be brought back online using the journal
    log, thereby reducing what could take minutes using fsck to seconds with the added
    advantage that there is considerably less chance of data loss or corruption.'
  merge: -1
  pgno: 640
- img_proc: true
  md: '# 31.6 Mounting a File System


    Now that we have created a new file system on the Linux partition of our new disk
    drive, we need to mount it to be accessible and usable. To do this, we need to
    create a mount point. A mount point is simply a directory or folder into which
    the file system will be mounted. For this example, we will create a /backup directory
    to match our file system label (although these values don’t need to match):


    ```

    # mkdir /backup

    ```


    The file system may then be manually mounted using the mount command:


    ```

    # mount /dev/sdb1 /backup

    ```


    Running the mount command with no arguments shows us all currently mounted file
    systems (including our new file system):


    ```

    # mount

    ```


    ```

    proc on /proc type proc (rw,nosuid,nodev,noexec,relatine)

    ```


    ```

    sysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatine,seclabel)

    ```'
