  md: '# 33-7 Adding Swap Space to the Volume Group


    In the above section, we extended the swap logical volume to use space already
    available in the volume group. If no space is available in the volume group, it
    must be added before extending the swap.


    Begin by checking the status of the volume group:


    ```

    # vgs


    VG #PV #LV #SN Attr VSize VFree


    rl 1 3 0 wz--n-<297.0g O

    ```


    The above output indicates that no space is available within the volume group.
    However, suppose we have a requirement to add 14 GB to the swap on the system.
    This will require the addition of more space to the volume group. For this example,
    it will be assumed that a disk is 16 GB in size and represented by /dev/sdb is
    available for addition to the volume group. Therefore, the first step is to turn
    this partition into a physical volume using


    ```

    # pvcreate /dev/sdb

    ```


    Physical volume "/dev/sdb" successfully created.'
