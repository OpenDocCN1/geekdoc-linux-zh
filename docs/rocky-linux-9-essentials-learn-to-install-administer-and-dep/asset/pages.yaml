    ```


    Note that each process is assigned a unique process ID which can be used to stop
    the process by sending it a termination (TERM) signal via the kill command. For
    example:


    ```

    $ kill 13217

    ```


    The advantage of ending a process with the TERM signal is that it allows the process
    to exit gracefully, potentially saving any data that might otherwise be lost.


    If the standard termination signal does not terminate the process, repeat the
    kill command with the -9 option. This command sends a KILL signal which should
    cause even frozen processes to exit but'
