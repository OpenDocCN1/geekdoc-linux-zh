  md: '# 4.2 Changing the Default Boot Option


    When the system starts, the boot options screen will appear, and wait 5 seconds
    for the user to choose an operating system. If no selection has been made before
    the timeout elapses, the default operating system will be started. The default
    operating system will be the standard (non-rescue) Rocky 9 image on a newly configured
    system. This default can, however, be changed from within Rocky 9.


    A range of boot configuration options (including the 5-second timeout and the
    boot RHGB settings outlined in "Installing Linux_9 on a Clean Disk" are declared
    in the /etc/default/grub file, which reads as follows on a new installation:


    ```

    GRUB_TIMEOUT=5


    GRUB_DISTRIBUTOR="$(sed ''s, release .*$,g'' /etc/system-release)"


    GRUB_DEFAULT=saved


    GRUB_DISABLE_SUBMENU=true


    GRUB_TERMINAL_OUTPUT="console"

    ```'
  merge: -1
  pgno: 88
- img_proc: true
  md: '```

    GRUB_CMDLINE_LINUX="crashkernel=1G-4G:192M,4G-64G:256M,4G:-512M resume=/dev/mapper/rl-swap
    rd.lvm.lv=rl/root rd.lvm.lv=rl/swap rhgb quiet"

    ```


    ```

    GRUB_DISABLE_RECOVERY="true"

    ```


    ```

    GRUB_ENABLE_BLSCFG=true

    ```


    The first step in changing the default boot system is to declare the GRUB_SAVEDEFAULT
    setting within this file:


    ```

    GRUB_TIMEOUT=5

    ```


    ```

    GRUB_DISTRIBUTOR="$(sed ''s, release .*.*,g'' /etc/system-release)"

    ```


    ```

    GRUB_DEFAULT=saved

    ```


    ```

    GRUB_SAVEDEFAULT=true

    ```


    This setting saves a new default value within the boot configuration. Next, run
    the grub2-set-default command to change the default setting using a numbering
    system that counts the first'
  merge: -1
