  \n\n\n\n\n[Let's Encrypt](https://letsencrypt.org/) 计划是一项旨在创建免费、自动化且开放证书颁发机构（CA）的共同努力，为了公众利益运行。它得到了\
  \ `EFF` 和 Linux 基金的支持。该计划提供了一个用于获取和更新证书的自动化工具。这减少了手动操作的工作量，特别是当需要管理多个站点和域名时。这些证书还可以用于\
  \ SIP、XMPP、WebSockets 和 TURN 服务器。使用该服务需要对相关域名的 DNS 信息控制控制（域名验证）。\n\n→ [`letsencrypt.org/how-it-works/`](https://letsencrypt.org/how-it-works/)\n\
  \n如果你希望在创建证书期间保持服务器运行，可以使用 `webroot` 插件并配合参数 `certonly` 和 `--webroot` 来获取证书。你必须指定\
  \ `--webroot-path`（缩写为 `-w`），该路径应包含提供的文件。命令如下：\n\n```bash\ncertbot certonly --webroot\
  \ -w /var/www/html -d www.DOMAIN.com -d DOMAIN.com\n```\n\n你需要重启所有使用你所创建的证书的服务。\n\
  \n创建的证书是所谓的短命证书，有效期为 90 天，因此必须每三个月使用 `certbot renew` 命令更新一次。然而，我们不应该手动更新每张证书，而应该自动更新。certbot\
  \ 在 `/etc/cron.d/certbot` 中包含了一个基本的 cron 任务。为了确保证书可以自动更新，你可以执行 `certbot renew --dry-run`。\n\
  \n## 10.2.2. 公钥基础设施：`easy-rsa`\n\n也可以创建我们自己的 CA，为此我们将使用在公钥加密中广泛使用的 RSA 算法。它涉及一个“密钥对”，由私钥和公钥组成。这两个密钥之间紧密相关，它们的数学属性使得用公钥加密的消息只能由知道私钥的人解密，从而确保了机密性。相反，用私钥加密的消息可以由任何知道公钥的人解密，这允许对消息来源进行验证，因为只有访问私钥的人才能生成它。当它与数字哈希函数（MD5、SHA1\
  \ 或更新的变体）结合使用时，就会产生一个可以应用于任何消息的签名机制。\n\n由于公共 CA 仅在收取（高昂）费用后发布证书，因此在公司内部创建一个私有证书认证机构也是可能的。`easy-rsa`\
  \ 包提供了作为 X.509 认证基础设施的工具，实现为一组使用 `openssl` 命令的脚本。\n\n### 替代方案 GnuTLS\n\nGnuTLS 也可以用于生成\
  \ CA，并处理 TLS、DTLS 和 SSL 协议的其他技术。\n\n`gnutls-bin` 包包含了命令行实用程序。安装 `gnutls-doc` 包也是很有用的，它包含了大量的文档。\n\
  \nFalcot Corp 的管理员使用此工具来创建服务器和客户端所需的证书。这使得所有客户端的配置保持相似，因为它们只需要设置为信任来自 Falcot 本地\
  \ CA 的证书。该 CA 是第一个要创建的证书；为此，管理员在适当的位置设置了一个包含 CA 所需文件的目录，该最好位于未连接到网络的机器上，以降低 CA 私钥被盗窃的风险。\n\
  \n```bash\nmake-cadir pki-falcot\ncd pki-falcot\n```\n\n然后，他们将所需的参数存储到 `vars` 文件中，该文件可以取消注释并编辑：\n\
  \n```bash\nvim vars\ngrep EASYRSA vars\nif [ -z \"$EASYRSA_CALLER\" ]; then\n# easyrsa.\
  \ 特定文件的特定变量（例如 EASYRSA_SSL_CONF）\n#set_var EASYRSA \"${0%/*}\"\n#set_var EASYRSA_OPENSSL\
  \ \"openssl\"\n#set_var EASYRSA_OPENSSL \"C:/Program Files/OpenSSL-Win32/bin/openssl.exe\"\
  \n#set_var EASYRSA_PKI \"$PWD/pki\"\n#set_var EASYRSA_DN \"cn_only\"\n#set_var EASYRSA_REQ_COUNTRY\
  \ \"FR\"\n#set_var EASYRSA_REQ_PROVINCE \"Loire\"\n#set_var EASYRSA_REQ_CITY \"\
  Saint-Étienne\"\n#set_var EASYRSA_REQ_ORG \"Falcot Corp\"\n#set_var EASYRSA_REQ_EMAIL\
  \ \"admin@falcot.com\"\n#set_var EASYRSA_REQ_OU \"Certificate authority\"\n#set_var\
  \ EASYRSA_KEY_SIZE 2048\n#set_var EASYRSA_ALGO rsa\n#set_var EASYRSA_CURVE secp384r1\n\
  #set_var EASYRSA_CA_EXPIRE 3650\n#set_var EASYRSA_CERT_EXPIRE 1080\n#set_var EASYRSA_CERT_RENEW\
  \ 30\n#set_var EASYRSA_CRL_DAYS 180\n#set_var EASYRSA_NS_SUPPORT \"no\"\n#set_var\
  \ EASYRSA_NS_COMMENT \"Easy-RSA Generated Certificate\"\n#set_var EASYRSA_TEMP_FILE\
  \ \"$EASYRSA_PKI/extensions.temp\"\n# 如果此处未定义，默认行为是先查找 $EASYRSA_PKI，然后\n# 回退到 $EASYRSA\
  \ 用于 'x509-types' 目录。你可以覆盖此\n#set_var EASYRSA_EXT_DIR \"$EASYRSA/x509-types\"\n\
  # EASYRSA_PKI 或 EASYRSA 目录（按此顺序）。注意此文件是 Easy-RSA\n#set_var EASYRSA_SSL_CONF \"$EASYRSA/openssl-easyrsa.cnf\"\
  \n#set_var EASYRSA_REQ_CN \"ChangeMe\"\n#set_var EASYRSA_DIGEST \"sha256\"\n#set_var\
  \ EASYRSA_BATCH \"\"\n```\n\n现在我们用以下命令准备公钥基础设施目录：\n\n```bash\n./easyrsa init-pki\n\
  ```\n注意：使用来自 `./vars` 的 Easy-RSA 配置：./vars init-pki complete; 现在可以创建 CA 或请求。你新创建的\
  \ PKI 目录是：`/home/roland/pki-falcot/pki`\n\n下一步是创建 CA 密钥对本身（密钥对的两个部分将存储在 `pki/ca.crt`\
  \ 和 `pki/private/ca.key` 下）。在这一步我们可以添加 `nopass` 选项以避免每次使用私钥时输入密码：\n\n```bash\n./easyrsa\
  \ build-ca nopass\n```\n注意：使用来自 `./vars` 的 Easy-RSA 配置：使用 SSL: openssl OpenSSL 1.1.b\
  \ 2019 年 2 月 26 日 生成 RSA 私钥，2048 位模数（2 个质数） ......................................................+++++\
  \ ......+++++ e 为 65537 (0x010001) 你将被要求输入将包含在证书请求中的信息。你要输入的内容被称为区分名称或 DN。有许多字段，但你可以留空一些字段。对于某些字段将有一个默认值，如果你输入\
  \ '.'，则该字段将留空。----- 通用名称（例如：你的用户、主机或服务器名称）[Easy-RSA CA]: CA 创建完成，现在可以导入并签名证书请求。你的新\
  \ CA 证书文件位于：`/home/roland/pki-falcot/pki/ca.crt`\n\n现在可以创建证书，以及 SSL/TLS 连接服务端所需的\
  \ Diffie-Hellman 参数。他们想将其用于 VPN 服务器（参见第 10.3 节 虚拟私有网络），该服务器通过 DNS 标识 `vpn.falcot.com`\
  \ 标识；此名称将重用于生成的密钥文件（`keys/vpn.falcot.com.crt` 用于公证书，`keys/vpn.falcot.com.key` 用于私钥）。\n\
  \n\n\n\n\n```bash\n$ ./easyrsa gen-req vpn.falcot.com nopass\nNote: using Easy-RSA\
  \ configuration from: ./vars Using SSL: openssl OpenSSL 1.1.1b 26 Feb 2019 Generating\
  \ a RSA private key .................................................................................+++++\
  \ ........+++++ writing new private key to '/home/roland/pki-falcot/pki/private/vpn.falcot.com.key.E5c3RGJBUd'\
  \ ----- You are about to be asked to enter information that will be incorporated\
  \ into your certificate request. What you are about to enter is what is called a\
  \ Distinguished Name or a DN. There are quite a few fields but you can leave some\
  \ blank 某些字段会有默认值，如果你输入 '.'，该字段将留空。 ----- Common Name (eg: your user, host, or server\
  \ name) [vpn.falcot.com]: Keypair and certificate request completed. Your files\
  \ are: req: /home/roland/pki-falcot/pki/reqs/vpn.falcot.com.req key: /home/roland/pki-falcot/pki/private/vpn.falcot.com.key\n\
  ```\n\n```bash\n$ ./easyrsa sign-req server vpn.falcot.com\nNote: using Easy-RSA\
  \ configuration from: ./vars Using SSL: openssl OpenSSL 1.1.1b 26 Feb 2019 You are\
  \ about to sign the following certificate. Please check over the details shown below\
  \ for accuracy. Note that this request has not been cryptographically verified.\
  \ Please be sure it came from a trusted source or that you have verified the request\
  \ checksum with the sender. Request subject, to be signed as a server certificate\
  \ for 1080 days: subject= commonName = vpn.falcot.com Type the word 'yes' to continue,\
  \ or any other input to abort. Confirm request details: yes\nUsing configuration\
  \ from /home/roland/pki-falcot/pki/safessl-easyrsa.cnf Check that the request matches\
  \ the signature Signature ok The Subject's Distinguished Name is as follows commonName\
  \ :ASN.1 12:'vpn.falcot.com' Certificate is to be certified until Jun 14 10:44:44\
  \ 2022 GMT (1080 days) Write out database with 1 new entries Data Base Updated Certificate\
  \ created at: /home/roland/pki-falcot/pki/issued/vpn.falcot.com.crt\n```\n\n```bash\n\
  $ ./easyrsa gen-dh\nNote: using Easy-RSA configuration from: ./vars Using SSL: openssl\
  \ OpenSSL 1.1.1b 26 Feb 2019 Generating DH parameters, 2048 bit long safe prime,\
  \ generator 2 This is going to take a long time […] DH parameters of size 2048 created\
  \ at /home/roland/pki-falcot/pki/dh.pem\n```\n\n下一步是为 VPN 客户端创建证书；每个允许使用 VPN 的计算机或人员都需要一个证书：\n\
  \n```bash\n$ ./easyrsa build-client-full JoeSmith nopass\nNote: using Easy-RSA configuration\
  \ from: ./vars Using SSL: openssl OpenSSL 1.1.1d 10 Sep 2019 Generating a RSA private\
  \ key .......................................................+++++ ...........................+++++\
  \ writing new private key to '/root/pki-falcot/pki/private/JoeSmith.key.Tgr8kk0a6a'\
  \ ----- Using configuration from /root/pki-falcot/pki/safessl-easyrsa.cnf Check\
  \ that the request matches the signature Signature ok The Subject's Distinguished\
  \ Name is as follows commonName :ASN.1 12:'JoeSmith' Certificate is to be certified\
  \ until Feb 20 04:52:43 2023 GMT (1080 days) Write out database with 1 new entries\
  \ Data Base Updated\n```\n\n# 10.3. 虚拟专用网络\n\n`虚拟专用网络`（简称 VPN）是一种通过隧道在互联网上连接两个不同局域网的方法；隧道通常会进行加密以确保机密性。VPN\
  \ 常用于将远程机器集成到公司的本地网络中。\n\n有多种工具提供这种功能。OpenVPN 是一种基于 SSL/TLS 的高效解决方案，易于部署和维护。另一种可能性是使用\
  \ `IPsec` 来加密两台机器之间的 IP 流量；这种加密是透明的，这意味着运行在这些主机上的应用程序不需要修改即可考虑 VPN。除了其传统功能外，`SSH`\
  \ 也可以用于提供 VPN。最后，可以使用微软的 `PPTP` 协议建立 VPN。虽然存在其他解决方案，但它们超本书的关注范围。\n\n## 10.3.1. OpenVPN\n\
  \nOpenVPN 是一种用于创建虚拟专用网络的软件。它的设置涉及在 VPN 服务器和客户端上创建虚拟网络接口；均支持 `tun`（用于 IP 级隧道）和 `tap`（用于以太网级隧道）接口。在实践中，通常使用\
  \ `tun` 接口，除非 VPN 客户端旨在通过以太网桥集成到服务器的本地网络。\n\nOpenVPN 依赖 `OpenSSL` 来所有的 SSL/TLS 加密和相关功能（机密性、认证、完整性、不可否认性）。它可以使用共享私钥或基于公钥基础设施的\
  \ `X.509` 证书进行配置。后者配置在面对不断增长的用户群时提供了更大的灵活性。\n\n### 10.3.1.1. 配置 OpenVPN 服务器\n\n\
  在创建所有证书后（遵循 `10.3.1` 中的说明），需要将它们复制到适当的位置：根证书（`pki/ca.crt`）将存储在所有机器（服务器和客户端）上作为 `/etc/ssl/certs/ca.crt`。服务器证书仅安装在服务器上（`pki/issued/vpn.falcot.com.crt`\
  \ 放到 `/etc/ssl/certs/vpn.falcot.com.crt`，而 `pki/private/vpn.falcot.com.key` 放到 `/etc/ssl/private/vpn.falcot.com.key`\
  \ 并限制权限，以便只有管理员可以读取），并将相应的 Diffie-Hellman 参数（`pki/dh.pem`）安装到 `/etc/openvpn/dh.pem`。客户端证书以类似的方式安装在相应的客户端上。\n\
  \n### 10.3.1.2. 配置 OpenVPN 服务器\n\n默认情况下，OpenVPN 初始化脚本尝试启动在 `/etc/openvpn/*.conf`\
  \ 中定义的所有虚拟网络。因此，设置 VPN 服务器只需在该目录中存储一个配置文件即可。一个良好的起点是 `/usr/share/doc/openvpn/examples/sample-config/server.conf`，它通向一个相当标准的服务器。当然，某些参数需要适配：`ca`、`cert`、`key`\
  \ 和 `dh` 需要描述所选的位置（分别为 `/etc/ssl/certs/ca.crt`、`/etc/ssl/certs/vpn.falcot.com.crt`、`/etc/ssl/private/vpn.falcot.com.key`\
  \ 和 `/etc/openvpn/dh.pem`）。`server 10.8.0.0 255.255.255.0` 指令定义了 VPN 使用的子网；服务器使用该范围内的第一个\
  \ IP 地址（`10.8.0.1`），其余地址分配给客户端。\n\n使用此配置，启动 OpenVPN 会创建虚拟网络接口，通常命名为 `tun0`。然而，防火墙通常在配置真实网络接口的同时进行配置，而这发生在\
  \ OpenVPN 启动之前。因此，最佳实践建议创建一个持久的虚拟网络接口，并配置 OpenVPN 使用此预先的接口。这进一步允许为该接口选择名称。为此，`openvpn\
  \ --mktun --dev vpn --dev-type tun` 创建一个名为 `vpn` 类型为 `tun` 的虚拟网络接口；此命令可以轻松地集成到防火墙配置脚本中，或\
  \ `/etc/network/interfaces` 文件的 `up` 指令中，或者为此添加一个 udev 规则。\n\n\n\n\n\n在没有进一步操作的情况下，VPN\
  \ 客户端只能通过 `10.8.0.1` 地址访问 VPN 服务器本身。若要允许客户端访问本地网络（192.168.0.0/24），需要在 OpenVPN 配置中添加\
  \ `push route 192.168.0.0 255.255.255.0` 指令，以便 VPN 客户端能够自动获取一条网络路由，告诉它们该网络可以通过 VPN\
  \ 访问。此外，本地网络上的机器也需要被告知通往 VPN 的路由需要通过 VPN 服务器（当 VPN 服务器安装在网关上时，这会自动工作）。或者，可以配置 VPN\
  \ 服务器执行 IP 伪装（IP Masquerading），使得来自 VPN 客户端的连接看起来像是是来自 VPN 服务器的（参见 第 10.1 节，“网关”）。\n\
  \n### 10.3.1.3. 配置 OpenVPN 客户端\n\n设置 OpenVPN 客户端还需要在 `/etc/openvpn/` 中创建一个配置文件。可以使用\
  \ `/usr/share/doc/openvpn/examples/sample-config-files/client.conf` 作为起点获取标准配置。`remote\
  \ vpn.falcot.com 1194` 指令描述了 OpenVPN 服务器的地址和端口；`ca`、`cert` 和 `key` 也需要调整以描述密钥文件的位置。\n\
  \n如果 VPN 不在启动时不自动启动，请在 `/etc/default/openvpn` 文件中将 `AUTOSTART` 指令设置为 `none`。始终可以使用\
  \ `systemctl start openvpn@*name*` 和 `systemctl stop openvpn@*name*` 命令启动或停止给定的\
  \ VPN 连接（其中连接 `name` 需要与 `/etc/openvpn/name.conf` 中定义的名称匹配）。\n\n`network-manager-openvpn-gnome`\
  \ 包包含一个 Network Manager 扩展（参见 第 8.2.5 节，“漫游用户的自动网络配置”），允许管理 OpenVPN 虚拟专用网络。这允许每个用户通过图形化界面配置\
  \ OpenVPN 连接，并从网络管理图标处控制它们。\n\n### 10.3.2. 使用 SSH 的虚拟专用网络\n\n实际上有两种方法可以使用 SSH 创建虚拟专用网络。一种传统方法涉及在\
  \ SSH 链路之上建立 PPP 层。该方法在一个 HOWTO 文档中有描述：\n\n→ [`www.tldp.org/HOWTO/ppp-ssh/`](https://www.tldp.org/HOWTO/ppp-ssh/)\n\
  \n第二种方法较新，是 OpenSSH 4.3 引入的；现在 OpenSSH 可以在 SSH 连接的双方创建虚拟网络接口（`tun*`），并且这些虚拟接口可以像物理接口一样进行配置。必须先通过在\
  \ SSH 服务器配置文件（`/etc/ssh/sshd_config`）中将 `PermitTunnel` 设置为“yes”来启用隧道系统。在建立 SSH 连接时，必须使用\
  \ `-w any:any` 选项显式请求创建隧道（`any` 可以替换为所需的 `tun` 设备号）。这要求用户在双方都拥有管理员权限，以便创建网络设备（换句话说，必须以\
  \ root 身份建立连接）。\n\n通过 SSH 创建虚拟专用网络的这两种方法都非常简单。然而，它们提供的 VPN 并不是最高的；特别是它们无法很好地处理高流量。\n\
  \n解释是，当 TCP/IP 栈被封装在 TCP/IP 连接中（用于 SSH）时，TCP 协议被使用了两次，一次用于 SSH 连接，一次用于隧道内部。这导致了问题，特别是由于\
  \ TCP 通过更改超时延迟来适应网络状况的方式。以下网站详细描述了该问题：\n\n→ [`sites.inka.de/sites/bigred/devel/tcp-tcp.html`](http://sites.inka.de/sites/bigred/devel/tcp-tcp.html)\n\
  \n因此，基于 SSH 的 VPN 应限制为没有性能限制的单次隧道。\n\n### 10.3.3. IPsec\n\nIPsec 尽管是 IP VPN 的标准，但其实现要复杂得多。IPsec\
  \ 引擎本身集成在 Linux 内核中；所需的用户空间部分（控制和配置工具）由 `libreswan` 包或 `strongswan` 包提供。这里我们简介绍\
  \ libreswan 选项。\n\n首先，我们安装 `libreswan` 包。具体来说，每个主机的 `/etc/ipsec.conf` 包含了该主机关注的\
  \ `IPsec tunnels`（或 IPsec 术语中的 `Security Associations`）参数。`/usr/share/doc/libreswan/`\
  \ 中有很多配置示例，但 Libreswan 的在线文档有更多带有解释的示例：\n\n→ [`libreswan.org/wiki/`](https://libreswan.org/wiki/)\n\
  \n可以使用 `systemctl` 控制 IPsec 服务；例如，`systemctl start ipsec` 将启动 IPsec 服务。\n\n尽管 IPsec\
  \ 是参考标准，但设置 IPsec 的复杂性限制了它在实践中的用法。当需要的隧道既不多也不动态时，通常会优先选择基于 OpenVPN 的解决方案。\n\n* *\n\
  \n**注意** IPsec 和 NAT\n\n防火墙的 NAT 和 IPsec 配合并不良好：由于 IPsec 对数据包进行签名，防火墙对这些数据包进行的任何更改都会导致签名失效，数据包将在目的地被拒绝。各种\
  \ IPsec 实现现在都包含了 `NAT-T` 技术（用于 `NAT Traversal`），它基本上是将 IPsec 数据包封装在一个标准的 UDP 包中。\n\
  \n* *\n\n* *\n\n**安全** IPsec 和防火墙\n\nIPsec 的标准操作模式涉及在 UDP 500 上进行密钥交换（如果使用 NAT-T，则在\
  \ UDP 4500 上）。此外，IPsec 数据包使用两个专用 IP 协议，防火墙必须允许通过；这些数据包的接收基于它们的协议号 50 (ESP) 和 51\
  \ (AH)。\n\n* * *\n\n### 10.3.4. PPTP\n\nPPTP（用于 `Point-to-Point Tunneling Protocol`）使用两个通信通道，一个用于控制数据，一个用于负载数据；后者使用\
  \ GRE 协议（*Generic Encapsulation*）。随后在数据通道上建立标准的 PPP 链路。\n\n#### 10.3.4.1. 配置客户端\n\
  \n`pptp-linux` 包包含一个易于配置的 Linux PPTP 客户端。以下指令从官方文档中汲取灵感：\n\n→ [`pptpclient.sourceforge.net/howto-debian.phtml`](http://pptpclient.sourceforge.net/howto-debian.phtml)\n\
  \nFalcot 管理员了几个文件：`/etc/ppp/options.pptp`、`/etc/ppp/peers/falcot`、`/etc/ppp/ip-up.d/falcot`\
  \ 和 `/etc/ppp/ip-down.d/falcot`。\n\n示例 10.2. `/etc/ppp/options.pptp` 文件：用于 PPTP\
  \ 连接的 PPP 选项 lock noauth nobscomp\n\n示例 10.3. `/etc/ppp/peers/falcot`：vpn.falcot.com\
  \ 是 PPTP 服务器 `pptp vpn.falcot.com --nolaunchpppd` # 连接将识别为用户 vpn remotename pptp\
  \ # 需要加密 require-mppe-128 file `/etc/ppp/options.pptp` ipparam falcot\n\n示例 10.4.\
  \ `/etc/ppp/ip-up.d/falcot`：\n```\n如果如果是 falcot，则创建通往 Falcot 网络的路由 # 192.168.0.0/24\
  \ 是（远程）Falcot 网络 ip route add 192.168.0.0/24 dev $1\n```\n\n示例 10.5. `/etc/ppp/ip-down.d/falcot`：\n\
  ```\n如果如果是 falcot，则删除通往 Falcot 网络的路由 # 192.168.0.0/24 是（远程）Falcot 网络 ip route del\
  \ 192.168.0.0/24 dev $1\n```\n\n* * *\n\n**安全** MPPE\n\n保护 PPTP 涉及使用 MPPE 功能（*Microsoft\
  \ Point-to-Point Encryption*），该功能作为模块在官方 Debian 内核可用。\n\n* * *\n\n### 10.3.4.2.\
  \ 配置服务器\n\n* * *\n\n**注意** PPTP 和防火墙\n\n中间防火墙需要配置允许通过协议 47 (GRE) 的 IP 数据包。此外，PPTP\
  \ 服务器的端口 1723 需要开放，以便建立通信通道。\n\n\n\n\n\n`pptpd` 是 Linux 下的 PPTP 服务器。其主配置文件 `/etc/pptpd.conf`\
  \ 需修改非常少：`localip`（本地 IP 地址）和 `remoteip`（远程 IP 地址）。在下面的示例中，PPTP 服务器始终使用 `192.168.0.199`\
  \ 地址，而 PPTP 客户端接收从 `192.168.0.200` 到 `192.168.0.250` 的 IP 地址。\n\n示例 10.6. `/etc/pptpd.conf`\
  \ 文件\n```conf\n# TAG: speed\n# 指定 PPP 守护进程通信的速率。\n# speed 115200\n# TAG: option\n\
  # 指定 PPP 选项文件的位置。\n# 默认情况下，PPP 在 '/etc/ppp/options' 中查找\n# option /etc/ppp/pptpd-options\n\
  # TAG: debug\n# 向 syslog 开启（更多）调试信息。\n# debug\n# TAG: localip\n# TAG: remoteip\n\
  # 指定本地和远程 IP 地址范围。\n# 你可以指定用逗号分隔的单个 IP 地址，也可以\n# 指定范围，或者两者都指定。例如：\n# 192.168.0.234,192.168.0.245-249,192.168.0.254\n\
  # 重要限制：\n# 1\\. 逗号之间或地址内部不允许有空格。\n# 2\\. 如果你提供的 IP 地址多于 MAX_CONNECTIONS，它将\n# 从列表开始计数，直到获取\n\
  # MAX_CONNECTIONS 个 IP。其余的将被忽略。\n# 3\\. 范围内不允许使用简写！例如，234-8 并不意味着 234 到 238，\n#\
  \ 如果是这个意思，必须输入 234-238。\n# 4\\. 如果你提供单个 localIP，这是可以的——所有本地 IP\n# 将设置为给定的那个。但你仍然必须为每个并发客户端\n\
  # 提供至少一个远程 IP。\n#localip 192.168.0.234-238,192.168.0.245\n#remoteip 192.168.1.234-238,192.168.1.245\n\
  #localip 10.0.1.1\n#remoteip 10.0.1.2-100\nlocalip 192.168.0.199\nremoteip 192.168.0.200-250\n\
  ```\n\nPPTP 服务器使用的 PPP 配置也要求在 `/etc/ppp/pptpd-options` 中进行一些更改。重要的参数是服务器名称 (`pptp`)、域名\
  \ (`falcot.com`)，以及 DNS 服务器和 WINS 服务器的 IP 地址。\n\n示例 10.7. `/etc/ppp/pptpd-options`\
  \ 文件\n```conf\n# 开启 pppd syslog 调试\n#debug\n# 将 'servername' 更改为 chap-secrets 中指定的服务器名称\n\
  name pptp\n# 将域名 更改为你的本地域名\ndomain falcot.com\n# 这些是 WinXXXX 客户端的合理默认值\n# 针对安全相关设置\n\
  # Debian pppd 包现在同时支持 MSCHAP 和 MPPE，因此在此\n# 启用它们。请注意，内核也必须支持 MPPE！\nauth require-chap\
  \ require-mschap require-mschap-v2 require-mppe-128\n# 填写你的地址\nms-dns 192.168.0.1\n\
  ms-wins 192.168.0.1\n# 填写你的子掩码\nnetmask 255.255.255.0\n# 一些默认\nnodefaultroute proxyarp\
  \ lock\n```\n\n最后一步是在 `/etc/ppp/chap-secrets` 文件中注册 `vpn` 用户（以及关联密码）。与其他使用星号 (`*`)\
  \ 即可生效的情况不同，这里必须显式地填写服务器名称。此外，Windows PPTP 客户端以 `DOMAIN\\USER` 的形式标识自己，而不是仅提供用户名。这解释了为什么该文件也提到了\
  \ `FALCOT\\vpn` 用户。也可以为用户指定单个 IP 地址；在此字段中使用星号表示应使用动态地址分配。\n\n示例 10.8. `/etc/ppp/chap-secrets`\
  \ 文件\n```conf\n# 使用 CHAP 进行认证的密钥\n# 客户端 服务器密钥 IP 地址\nvpn pptp f@Lc3au *\nFALCOT\\\
  vpn pptp f@Lc3au *\n```\n\n* * *\n\n# 安全 PPTP 漏洞\n\n微软的第一个 PPTP 实现遭了严厉批评，因为它存在许多安全漏洞；从那以后，大多数漏洞在较新版本中已修复。本节记录的配置使用了最新版本的协议。但请注意，移除某些选项（如\
  \ `require-mppe-128` 和 `require-mschap-v2`）会使服务再次变得脆弱。\n\n* * *\n\n# 10.4. 服务质量\n\
  \n## 10.4.1. 原理与机制\n\n服务质量（或简称 `QoS`）是指一组保证或提高提供给应用程序的服务质量的技术。最流行的此类技术涉及将网络流量分为不同的类别，并根据流量所属的类别对其进行差异化处理。这种差异化服务的主要应用是`流量整形`\
  \ (traffic shaping)。\n\n## 10.4.2. 配置与实现\n\nQoS 参数通过 `tc` 命令（由 iproute 包提供）进行设置。由于其接口相当复杂，建议使用高级别的工具。\n\
  \n### 10.4.2.1. 降低延迟：wondersaper\n\n`wondersaper`（同名包中）的主要目的是在不受网络负载的情况下最小化延迟。这是通过将总流量限制在略低于链路饱和的值实现的。\n\
  \n一旦配置了网络接口，通过运行 `wondersaper interface download_rate upload_rate` 即可设置流量限制。接口可以是\
  \ `eth0` 或 `ppp0` 等，两个速率都以千比特每秒表示。`wondersaper remove interface` 命令禁用指定接口上的流量控制。\n\
  \n对于以太网连接，此脚本最好在接口配置后调用。这通过在 `/etc/network/interfaces` 文件中添加 `up` 和 `down` 指令来实现，分别在接口配置后和取消前运行声明的命令。例如：\n\
  \n示例 10.9. `/etc/network/interfaces` 的更改\n```text\niface eth0 inet dhcp\n    up\
  \ /sbin/wondersaper eth0 500 100\n    down /sbin/wondersaper remove eth0\n```\n\n\
  在 PPP 情况下，在 `/etc/ppp/ip-up.d/` 中创建一个调用 **wondersaper** 的脚本，可以在连接建立后立即启用流量控制。\n\n\
  * * *\n\n# 进阶：最佳配置\n\n`/usr/share/doc/wondersaper/README.Debian.gz` 文件详细描述了包维护者推荐的配置方法。特别是，它建议测量下载和上传速度，以便更好地评估真实限制。\n\
  \n\n\n\n\n除非有特定的 QoS 配置，否则 Linux 内核使用 `pfifo_fast` 队列调度器，它本身提供了一些有趣的功能。每个处理的 IP\
  \ 数据包的优先级基于该数据包的 DSCP 字段（区分服务代码点，区分服务差异）；修改此 6 位字段即可利用这些调度特性。更多信息请参阅 [`en.wikipedia.org/wiki/Differentiated_services#Class_Selector`](https://en.wikipedia.org/wiki/Differentiated_services#Class_Selector)。\n\
  \nDSCP 字段可以由生成 IP 数据包的应用程序设置，也可以由 `netfilter` 直接修改。以下规则足以提高服务器 SSH 服务的响应速度，注意 DSCP\
  \ 字段必须以十六进制格式设置：\n\n```\nnft add table ip mangle nft add rule ip mangle PREROUTING\
  \ tcp sport 22 counter ip dscp set 0x04 nft add rule ip mangle PREROUTING tcp dport\
  \ 22 counter ip dscp set 0x04\n```\n\n## 10.5. 动态路由\n\n动态路由的参考工具目前是来自同名包的 `quagga`；在后者开发停止之前，它是\
  \ `zebra`。然而，出于兼容性考虑，`quagga` 保了程序的名称，这解释了下文中 `zebra` 命令的存在。\n\n**基础知识**动态路由\n\n\
  动态路由允许路由器实时调整传输 IP 数据包的路径。每个协议都涉及自己的路由定义方法（最短路径、使用邻居宣告的路由等）。\n\n在 Linux 内核中，路由将网络设备连接到一组可以通过该设备访问的机器。当\
  \ `ip` 命令的第一个参数使用 `route` 时，它被用来定义新路由并显示现有路由。`route` 命令曾用于此目的，但现在已废弃，转而使用 `ip`。\n\
  \nQuagga 是一组协作的守护进程，用于定义 Linux 内核所使用的路由表；每个路由协议（最著名的 BGP、OSPF 和 RIP）都提供自己的守护进程。`zebra`\
  \ 守护进程从其他守护进程收集信息并相应处理静态路由表。其他守护进程被称为 `bgpd`、`ospfd`、`ospf6d`、`ripd`、`ripngd` 和\
  \ `isisd`。\n\n通过创建 `/etc/quagga/daemon.conf` 文件来启用守护进程，其中 daemon 是要使用的守护进程名称；该文件必须属于\
  \ `quagga` 用户和组，以便 `/etc/init.d/zebra` 脚本才能调用该守护进程。`quagga-core` 包在 `/usr/share/doc/quagga-core/examples/`\
  \ 下提供了配置示例。\n\n这些守护进程中的每一个配置都需要相关路由协议的知识。这里无法详细描述这些协议，但 `quagga-doc` 以 `info` 文件的形式提供了丰富的解释。相同的内容在\
  \ Quagga 网站上以 HTML 格式浏览可能会更方便：\n\n→ [`www.nongnu.org/quagga/docs/docs-info.html`](http://www.nongnu.org/quagga/docs/docs-info.html)\n\
  \n此外，其语法与标准路由器的配置接口非常相似，网络管理员将迅速适应 `quagga`。\n\n**实践中** OSPF、BGP 还是 RIP？\n\nOSPF（开放最短路径优先）通常是私有网络动态路由的最佳协议，但\
  \ BGP（边界网关协议）在全网路由中更为常见。RIP（路由信息协议）相当古老，几乎不再被使用。\n\n## 10.6. IPv6\n\nIPv6 是 IPv4\
  \ 的继任者，是 IP 协议的新版本，旨在修复其缺陷，特别是可用 IP 地址的稀缺。该协议处理网络层；其目的是提供一种标识机器的方法，向目标传输数据，并在必要时处理数据分片（换句话说，将数据包拆取决于路径上网络链接的碎片，并在到达时按正确顺序重组碎片）。\n\
  \nDebian 内核在内核中包含了 IPv6 处理（某些架构将其编译为名为 `ipv6` 的模块）。基本工具如 `ping` 和 `traceroute` 有对应的\
  \ IPv6 版本 `ping6` 和 `traceroute6`，分别位于 `iputils-ping` 和 `iputils-tracepath` 包中。\n\
  \nIPv6 网络的配置与 IPv4 类似，位于 `/etc/network/interfaces` 中。但如果你希望该网络在全局可用，你必须确保有一个具备 IPv6\
  \ 能力的路由器将流量转发到全局 IPv6 网络。\n\n示例 10.10. IPv6 配置示例\n```\niface eth0 inet6 static address\
  \ 2001:db8:1234:5::1/64 # 禁用自动配置 # autoconf 0 # 路由器是自动配置且没有固定地址 # (accept_ra 1).\
  \ 如果有： # gateway 2001:db8:1234:5::1\n```\n\nIPv6 子网通常具有 64 位的子网掩码。这意味着子网内存在 2⁶⁴\
  \ 个不同的地址。这允许无状态地址自动配置 (SLAAC) 根据网络接口的 MAC 地址选择地址。默认情况下，如果你的网络中激活了 SLAAC 且你的电脑开启了\
  \ IPv6，内核将自动发现 IPv6 路由器并配置网络接口。\n\n这种 这种行为可能产生隐私影响。如果你频繁切换网络（例如使用笔记本电脑），你可能不希望你的\
  \ `MAC` 地址成为公共 IPv6 地址的一部分。这使得跨网络识别同一台设备变得容易。解决方案是 IPv6 隐私扩展（Debian 在初始安装期间检测到 IPv6\
  \ 连接时默认启用它），它会为接口分配一个额外的随机生成地址，定期更改它们，并在出站连接中优先使用。入站连接仍可以使用 SLAAC 生成的地址。以下示例用于 `/etc/network/interfaces`，用于激活这些隐私扩展。\n\
  \n示例 10.11. IPv6 隐私扩展\n```\niface eth0 inet6 auto # 出站连接优先使用随机分配的地址。privext 2\n\
  ```\n\n**提示** 使用 IPv6 构建的程序\n\n许多软件需要适配以处理 IPv6。Debian 中的大多数软件包已经经过适配，但并非全部都是。如果你喜欢的包无法在\
  \ IPv6 下工作，你可以在 *debian-ipv6* 邮件列表上寻求帮助。他们可能知道某些感知 IPv6 的替代方案，并可以提交 bug 以妥善地跟踪该问题。\n\
  \n→ [`lists.debian.org/debian-ipv6/`](https://lists.debian.org/debian-ipv6/)\n\n\
  IPv6 连接可以像 IPv4 一样被限制。`nft` 可用于创建 IPv4 和 IPv6 的防火墙规则（见第 14.2.3 节，“`nft` 语法”）。\n\n\
  ### 10.6.1. 隧道技术\n\n**注意** IPv6 隧道与防火墙\n\n在 IPv4 之上的 IPv6 隧道（与原生 IPv6 相比）要求防火墙接受使用\
  \ IPv4 协议号 41 的流量。\n\n如果不可用原生 IPv6 连接，回退方法是使用 IPv4 之上的隧道。Hurricane Electric 是此类隧道的（免费）供应商之一：\n\
  \n→ [`tunnelbroker.net`](https://tunnelbroker.net)\n\n要使用 Hurricane Electric 隧道，你需要注册账户、登录、选择一个免费隧道，并使用生成的代码编辑\
  \ `/etc/network/interfaces` 文件。\n\n如果你想将配置好的电脑作为本地网络的路由器使用，可以安装并配置 `radvd` 守护进程（来自同名包）。这个\
  \ IPv6 配置守护进程的作用类似于 IPv4 世界中的 `dhcpd`。\n\n\n\n\n随后必须创建 `/etc/radvd.conf` 配置文件（以\
  \ `/usr/share/doc/radvd/examples/simple-radvd.conf` 作为起点）。在我们的情况下，唯一需要的更改是前缀，它需要替换为\
  \ Hurricane Electric 提供的前缀；可以在 `ip a` 命令的输出中找到，位于关于 `he-ipv6` 的部分。\n\n然后运行 `systemctl\
  \ start radvd`。现在 IPv6 网络应该可以工作了。\n\n# 10.7. 域名服务器 (DNS)\n\n*域名服务* (DNS) 是互联网的基础组件：它将主机名映射到\
  \ IP 地址（反之亦然），从而可以使用 `www.debian.org` 代替 `149.20.4.15` 或 `2001:4f8:1:c::15`。\n\n\
  DNS 记录组织在区域（zones）中；每个区域匹配一个域名（或子域名）或 IP 地址范围（因为 IP 地址通常按连续范围分配）。主服务器对区域内容具有权威性；从服务器（通常托管在独立的机器上）提供主区域的定期更新副本。\n\
  \n每个区域可以包含各种类型的记录（*资源记录*），以下是一些最常见的记录：\n\n* `A`: IPv4 地址。\n* `CNAME`: 别名（*规范名称*）。\n\
  * `MX`: *邮件交换*，一个电子邮件服务器。其他邮件服务器使用此信息来查找发送给给定地址的邮件。每个 MX 记录都有优先级。首先尝试优先级最高的服务器（数字最低的）（参见侧边栏\
  \ *返回基础知识* SMTP）；如果第一个服务器没有响应，则按优先级递减的顺序联系其他服务器。\n* `PTR`: IP 地址到名称的映射。此类记录存储在 IP\
  \ 地址范围命名的“反向 DNS”区域中。例如，`1.168.192.in-addr.arpa` 是包含 `192.168.1.0/24` 范围内所有地址反向映射的区域。\n\
  * `AAAA`: IPv6 地址。\n* `NS`: 将名称映射到域名服务器。每个域名必须至少有一个 NS 记录。这些记录指向可以回答有关该域名查询的 DNS\
  \ 服务器；它们通常指向该域的主服务器和从服务器。这些记录还允许 DNS 委托；例如，`falcot.com` 区域可以包含一个 `internal.falcot.com`\
  \ 的 NS 记录，这意味着 `internal.falcot.com` 区域由另一个服务器处理。当然，该服务器必须声明 `internal.falcot.com`\
  \ 区域。\n\n## 10.7.1. DNS 软件\n\n参考名称服务器 Bind 由 ISC (*互联网软件联盟*) 开发并维护。它在 Debian 中中通过\
  \ `bind9` 包提供。第 9 版本与之前的版本相比有两个主要变化。首先，DNS 服务器现在可以在非特权用户下运行，因此服务器的安全漏洞不会赋予攻击者 root\
  \ 权限（这在 8.x 版本中反复出现过）。\n\n此外，Bind 支持用于签名（从而验证）DNS 记录的 DNSSEC 标准，这允许在中间人攻击期间阻止任何此类数据的伪造。\n\
  \n***\n\n文化 DNSSEC\n\nDNSSEC 规范相当复杂；这部分解释了为什么它尚未被广泛使用（即使它可以与不感知 DNSSEC 的 DNS 服务器完美共存）。要了解所有的细节，你应该查看以下文章。\n\
  \n→ [`en.wikipedia.org/wiki/Domain_Name_System_Security_Extensions`](https://en.wikipedia.org/wiki/Domain_Name_System_Security_Extensions)\n\
  \n***\n\n## 10.7.2. 配置 bind\n\n无论版本如何，`bind` 的配置文件的结构都是相同的。\n\nFalcot 管理员创建了一个主\
  \ `falcot.com` 区域来存储与该域相关的信息，以及一个 `168.192.in-addr.arpa` 区域用于本地网络 IP 地址的反向映射。\n\n\
  ***\n\n注意 反向区域的名称\n\n反向区域有特殊的名称。覆盖 `192.168.0.0/16` 网络的区域需要命名为 `168.192.in-addr.arpa`：IP\
  \ 地址组件被反转，并加上 `in-addr.arpa` 后缀。\n\n对于 IPv6 网络，后缀是 `ip6.arpa`，反转的 IP 地址组件是 IP 地址完整十六进制表示中的每个字符。因此，`2001:0bc8:31a0::/48`\
  \ 网络将使用名为 `0.a.1.3.8.c.b.0.1.0.0.2.ip6.arpa` 的区域。\n\n***\n\n提示 测试 DNS 服务器\n\n`host`\
  \ 命令（在 `bind9-host` 包中）查询 DNS 服务器，并用于测试服务器配置。例如，`host machine.falcot.com localhost`\
  \ 检查本地服务器对 `machine.falcot.com` 查询的响应。`host *ipaddress* localhost` 测试反向解析。\n\n***\n\
  \n以下摘自 Falcot 的配置片段可以作为配置 DNS 服务器的起点：\n\n\n\n\n\nDHCP 服务器配置文件（`/etc/dhcp/dhcpd.conf`，以及用于\
  \ IPv6 的 `/etc/dhcp/dhcpd6.conf`）中需要编辑的首要元素是域名和 DNS 服务器。如果该服务器在局域网中是唯一的（根据广播传播范围定义），则必须启用（或取消注释）`authoritative`\
  \ 指令。此外，还需要创建一个 `subnet` 部分，用以描述本地网络和要提供的配置信息。以下示例适用于 `192.168.0.0/24` 本地网络，其中路由器\
  \ `192.168.0.1` 充当网关。可用的 IP 地址范围为 `192.168.0.128` 到 `192.168.0.254`。\n\n示例 10.15.\
  \ `/etc/dhcp/dhcpd.conf` 节选\n\n```bash\n# 适用于 Debian 系统的 ISC dhcpd 示例配置文件\n# ddns-updates-style\
  \ 参数控制服务器在租约确认时\n# 是否尝试进行 DNS 更新。我们默认采用\n# 版本 2 包的行为（'none'，因为 DHCP v2\n# 不支持 DDNS。）\n\
  ddns-update-style interim;\n# 为所有支持网络的通用选项定义...\noption domain-name \"internal.falcot.com\"\
  ;\noption domain-name-servers ns.internal.falcot.com;\ndefault-lease-time 600;\n\
  max-lease-time 7200;\n# 如果此 DHCP 服务器是本地网络的官方 DHCP\n# 服务器，则应该取消注释 authoritative 指令。\n\
  authoritative;\n# 使用此项将 dhcp 日志消息发送到不同的日志文件（你\n# 还需要修改 syslog.conf 来完成重定向）。\nlog-facility\
  \ local7;\n# 我的子网\nsubnet 192.168.0.0 netmask 255.255.255.0 {\n    option routers\
  \ 192.168.0.1;\n    option broadcast-address 192.168.0.255;\n    range 192.168.0.128\
  \ 192.168.0.254;\n    ddns-domainname \"internal.falcot.com\";\n}\n```\n\n## 10.8.2.\
  \ DHCP 和 DNS\n\n一个非常实用的特性是在 DNS 区域中自动注册 DHCP 客户端，这样每台机器都能获得一个有意义的名字（而不是像 `machine-192-168-0-131.internal.falcot.com`\
  \ 这样毫无感情的名字）。使用此功能需要配置 DNS 服务器以接受来自 DHCP 服务器的 `internal.falcot.com` DNS 区域的更新，并配置后者为每次注册提交更新。\n\
  \n在 `bind` 情况下（请参见 第 10.7.1 节，“DNS 软件” ），需要在 DHCP 服务器要编辑的每个区域中添加 `allow-update`\
  \ 指令（针对 `internal.falcot.com` 域名的区域以及反向区域）。该指令列出了允许执行这些更新的 IP 地址；因此，它应该包含 DHCP 服务器可能的所有地址（如果适用，包括本地地址和公共地址）。\n\
  \n```\nallow-update { 127.0.0.1 192.168.0.1 212.94.201.10 !any };\n```\n\n注意！一个*可以修改*的区域*将*被\
  \ `bind` 更改，且后者会定期覆盖其配置文件。由于这种自动化过程产生的文件比手动编写的文件更不利于人类阅读，Falcot 管理员通过一个委托的 DNS 服务器来处理\
  \ `internal.falcot.com` 域；这意味着 `falcot.com` 区域文件牢牢地处于他们的手动控制之下。\n\n上面的 DHCP 服务器配置节选已经包含了\
  \ DNS 区域更新所需的指令：它们是 `ddns-update-style interim;` 和 `ddns-domain-name \"internal.falcot.com\"\
  ;` 这两行。\n\n# 10.9. 网络诊断工具\n\n当网络应用程序运行不符合预期时，能够查看其内部机制至关重要。即使一切看起来运行良好，运行网络诊断也有助于确保一切按预期工作。为了此目的有多种诊断工具；每种工具运行在不同的层级。\n\
  \n## 10.9.1. 本地诊断：netstat\n\n让我们先提到 `netstat` 命令（在 net-tools 包中）；它显示机器网络活动的即时摘要。当不带任何参数调用时，该命令会列出所有打开的连接；此列表可能非常冗，因为包含了许多\
  \ Unix 域套接字（守护进程广泛使用），这些套接字完全不涉及网络（例如 `dbus` 通信、`X11` 流量以及虚拟文件与桌面之间的通信）。\n\n因此，常见的调用使用更改\
  \ `netstat` 行为的选项。最常用的选项包括：\n\n*   `-t`，过滤结果仅包含 TCP 连接；\n*   `-u`，对 UDP 连接起类似作用；这些选项不是互斥的，其中任何一个都可以停止显示\
  \ Unix 域套接字；\n*   `-a`，也列出监听状态的套接字（等待传入连接）；\n*   `-n`，以数字形式显示；\n*   `-p`，显示使用套接字的\
  \ PID 和 程序；\n*   `-c`，持续显示输出；\n*   `-r`，显示路由表；\n*   `-s`，显示统计信息；\n*   `-i`，显示网络接口；\n\
