  \ [SC] [expires: 2025-05-18] 067E 3C45 6BAE 240A CEE8 8F6F EF0F \n```\n\n## 从稳定版升级到下一个版本\n\
  \n在本节中，我们将关注如何将 Stretch 升级到 Buster。在此过程中，由于这是一个重大操作，因此在开始之前必须对所有重要数据进行备份。另一个良好的习惯是清理已安装的软件包，这会让升级变得更容易。相关的工具包括\
  \ `aptitude`（参见节 2.7，跟踪软件包）。例如，你可以使用以下命令：\n\n```bash\ndeborphan | xargs aptitude\
  \ --schedule-only\n```\n\n## 添加密钥\n\n当添加第三方源时，APT 需要验证其真实性。第一步是获取公钥。通常情况下，将其放置在\
  \ `/etc/apt/trusted.gpg.d/` 中。\n\n使用 `apt-key` 命令将密钥添加到密钥：\n\n```\napt-key fingerprint\
  \ /etc/apt/trusted.gpg.d/debian-archive-buster-automatic.gpg\n```\n\n## 推荐流程\n\n\
  操作系统的发布说明提供了概述，有时还会提供升级的细节。由于 Debian 版本之间的时间间隔较长，你应该阅读发布说明。\n\n在线可以获取当前稳定版及其代号发布说明：\n\
  \n- [`www.debian.org/releases/stable`](https://www.debian.org/releases/stable)\n\
  - [`www.debian.org/releases/stretch`](https://www.debian.org/releases/stretch)\n\
  \n## 查找更改的文件\n\n`debsums` 命令可以检查本地系统上属于已安装软件包的文件是否被更改过。它使用简单的哈和值以及 `/var/lib/dpkg/info/[package].md5sums`\
  \ 中的信息。\n\n查找所有更改的配置文件使用 `debsums -ec`。检查整个系统使用 `debsums -c`。\n\n## 升级\n\n现在开始升级本身。首先，你需要修改\
  \ `/etc/apt/sources.list` 文件，告诉 APT 从 Buster 而不是 Stretch 获取软件包。如果该文件仅包含对 Stable\
  \ 的引用而非具体的代号，则不需要进行更改，因为 Stable 始终指向最新发布的 Debian 版本。在这两种情况下，必须刷新可用软件包数据库（使用 `apt\
  \ update` 命令或 `synaptic` 中的刷新按钮）。\n\n## 仓库信息变化\n\n当发布新的 Debian 稳定 版本时，仓库的 `Release`\
  \ 和 `InRelease` 文件中的某些字段会发生，例如 `Suite` 字段。当发生这种情况时，在确认更改之前，APT 将拒绝下载该数据，以确保用户已做好准备。要确认更改，请为\
  \ `apt-get` 使用 `--allow-releaseinfo-change` 或 `--allow-releaseinfo-change-[field]`\
  \ 选项，或者使用 `Acquire::AllowReleaseInfoChange` 配置选项。\n\n\n\n\n\n一旦注册了这些新的软件包源，您应该先通过\
  \ `apt upgrade` 进行一次最小化升级。通过分步进行升级，我们可以减轻软件包管理工具的负担，并通常可以确保我们拥有最新版本，这些版本可能已经包含了完成整个发行版升级升级所需的各种\
  \ bug 修复和改进。\n\n完成这次首次升级后，就是时候处理升级本身了，可以使用 `apt full-upgrade`、`aptitude` 或 `synaptic`。在应用这些操作之前，您应该仔细检查建议的动作：您可能想要添加建议的软件包，或者取消选择那些仅被推荐且已知没用的软件包。在任何情况下，前端界面都应该给出一个指向连贯且最新的\
  \ Buster 系统的方案。然后，您只需要等待所需软件包的下载，回答 debconf 问题（可能还有关于本地修改的配置文件的问题），然后静静等待 APT 施展魔术即可。\n\
  \n## 6.7.2. 处理升级后的问题\n\n尽管 Debian 维护者付出了巨大努力，但主要的系统升级并不总是如您所愿的那样顺畅。新软件版本可能与旧版本不兼容（例如，它们的默认行为或数据格式可能发生了变化）。此外，尽管在\
  \ Debian 发布之前总会有测试阶段，但仍可能遗漏一些漏洞。\n\n为了预判其中一些问题，您可以安装 `apt-listchanges` 软件包，它会在软件包升级开始时显示有关可能问题的信息。这些信息由软件包维护者编译并放在\
  \ `/usr/share/doc/package/NEWS.Debian` 文件中，供用户参考。阅读这些文件（可能通过 `apt-listchanges`）应该帮助您避免糟糕的意外。\n\
  \n您有时可能会发现软件的新版本完全无法工作。这通常发生在应用程序并不流行且没有经过充分测试的情况下；最后时刻的更新也可能引入在稳定版发布后才发现的回归问题。在这两种情况下，要的第一件事是查看\
  \ [`https://bugs.debian.org/package`](https://bugs.debian.org) 中的 bug 跟踪系统，并检查该问题是否已经被报告。如果是这种情况，且您安装了\
  \ `apt-listbugs`，那么在升级开始之前它也会被列出来。如果没有安装，您应该使用 `reportbug` 自行报告。如果该问题已经已知，bug 报告和相关消息通常是与该问题的极佳信息来源：\n\
  \n*   有时已经存在补丁，并且可以在 bug 报告中找到；然后您可以在本地重新编译损坏软件包的修复版本（参见 第 15.1 节，“从源码重构软件包”）；\n\
  \n*   在其他情况下，用户可能已经找到了该问题的变通方法并在对报告的回复中分享了他们的见解；\n\n*   在另一些情况下，维护者可能已经准备并公开了修复的软件包。\n\
  \n根据 bug 的严重程度，可能会专门为稳定版的新修订版本准备软件包的新新版本。当发生这种情况时，修复的软件包将在 Debian 镜像的 `proposed-updates`\
  \ 部分可用（参见 第 6.1.2.3 节，“建议的更新”）。随后，可以将相应的条目临时添加到 `sources.list` 文件中，并使用 `apt` 或 `aptitude`\
  \ 安装更新后的软件包。\n\n有时，修复的软件包尚未在该部分可用，因为它们正在等待稳定版管理者的验证。您可以在他们的网页上验证是否是这种情况。那里列出的软件包尚未可用，但您至少知道发布过程正在进行。\n\
  \n→ [`release.debian.org/proposed-updates/stable.html`](https://release.debian.org/proposed-updates/stable.html)\n\
  \n## 6.7.3. 升级后的清理\n\nAPT 通常确保升级是干净的，引入新的和更新的依赖项，或移除冲突的软件包。但即使是这样一个强大的工具，无法涵盖用户和管理员在升级后面临的所有任务，因为这些任务需要人类决策。\n\
  \n### 6.7.3.1. 从 Debian 存档删除的软件包\n\n有时，Debian FTP Masters 会从 Debian 存档中移除软件包，因为它们包含发布关键漏洞、被上游作者或软件包维护者遗弃，或者仅仅达到了生命周期。在这种情况下，较新的\
  \ Debian 版本不再提供该软件包。要找到所有没有源的软件包，请使用 `apt-show-versions` 命令：\n\n```bash\napt-show-versions\
  \ | grep \"No available version\"\n```\n\n通过 `aptitude search ~o` 也可以获得类似的结果。如果发现的软件包不再需要，应该从系统中彻底清除（purge），因为它们将不再面临关键或安全相关漏洞的任何更新。\n\
  \n### 6.7.3.2. 虚拟和过渡软件包\n\n有时，软件包可能需要获得一个新名称。在这种情况下，旧软件包通常被保留作为一个（几乎）空的软件包，取决于新软件包，并且仅在\
  \ `/usr/share/doc/package/` 中安装强制文件。此类软件包被称为“虚拟”（dummy）或“过渡”软件包。如果负责的软件包维护者还将该软件包的节改为\
  \ `oldlibs`，那么像 `aptitude`、`deborphan` 或 `debfoster`（参见侧边栏 `deorphan` 和 `debfoster`）这样的工具就可以提取这些软件包并建议删除。\n\
  \n遗憾的是，目前没有万无一失的方法确保这些软件包会被上述工具自动删除或提取。检查系统是否仍安装了某些此类软件包的一种方法是查看已安装软件包的描述，然后检查结果。注意不要将结果调度为自动删除，因为这种方法可能会导致误报：\n\
  \n```bash\ndpkg -l | grep ii | grep -i -E \"(transition|dummy)\"\n```\n\n因为新软件包作为过渡软件包的依赖项被引入的，它通常被标记为自动安装，如果您尝试从系统中清除过渡软件包，它可能会被调度为删除。在这种情况下，您可以使用侧边栏中\
  \ `同时删除和安装` 和 第 6.2.7 节，“跟踪自动安装的软件包” 中的任何一种方法来选择性地移除过渡软件包。\n\n### 6.7.3.3. 旧或未使用的配置文件\n\
  \n如果升级成功，可能会有一些配置文件的残留，可能来自 dpkg（参见 第 5.2.3 节，“校验和和配置文件列表”）、ucf 或已删除的软件包。后者可以使用\
  \ `apt autoremove --purge` 进行彻底清除。在升级过程中由 dpkg 或 ucf 处理的配置文件留下了带有特定后缀的副本（例如 `.dpkg-dist`、`.dpkg-old`、`.ucf-old`）。使用\
  \ `find` 或 `locate` 命令有助于跟踪它们。如果它们不再有任何用处，就可以删除。\n\n### 6.7.3.4. 不由任何软件包拥有的文件\n\n\
  \n\n\n\nDebian 策略强制软件包在清除（purge）时不会遗留任何文件。违反这一原则是一个严重的错误，你很少会遇到它。如果你遇到了，请报告它；不过，如果你好奇，可以使用\
  \ `cruft` 或 `cruft-ng` 软件包来检查系统中不属于任何软件包的文件。\n\n# 6.8. 保持系统处于最新状态\n\nDebian 发行版是动态的，并且不断变化。大部分变化发生在\
  \ `Testing` 和 `Unstable` 版本中，但即使是 `Stable` 版本也会定期更新，主要是为了修复安全相关的错误。无论系统运行的是哪个版本的\
  \ Debian，保持其最新状态通常都是一个好主意，这样你就能从最新的演进和错误修复中获益。\n\n虽然定期运行一个工具来检查可用更新并执行升级是可行的，但这种重复性任务是枯燥的，特别是当需要在几台机器上执行时。幸运的是，许多许多性任务一样，它可以部分自动化，并且已经开发了一系列工具来实现这一目标。\n\
  \n这些工具中的第一个是同名的软件包 `apticron`。它的主要作用是每天（通过 `cron`）运行一个脚本。该脚本更新可用软件包列表，如果某些已安装软件包不是最新可用版本，它会发送一封电子邮件，包含这些软件包的列表以及新版本中的更改。显然，这个软件包主要针对\
  \ `Debian Stable` 的用户，因为对于节奏较快的 Debian 版本来说，每天的邮件会长。当有可用更新时，`apticron` 会自动下载它们。它不会安装它们——管理员仍需手动安装——但让软件包预先下载并在本地可用（在\
  \ `APT` 缓存中）可以使工作变得更快。\n\n负责几台计算机的管理员无疑会感谢能收到待处理升级的通知，但升级本身仍然像以前一样枯燥。可以启用定期升级：它使用\
  \ `systemd` 定时器单元或 `cron`。如果没有安装 systemd，`/etc/cron.daily/apt-compat` 脚本（在 `apt`\
  \ 软件包中）就会派上用场。该脚本由 `cron` 每天（非交互地）运行。要控制其行为，请使用 `APT` 配置变量（因此存储在文件 `/etc/apt/apt.conf.d/10periodic`\
  \ 中）。主要变量有：\n\n`APT::Periodic::Update-Package-Lists`\n\n此选项允许你指定刷新软件包列表的频率（以天为单位）。`apticron`\
  \ 用户不需要这个变量，因为 `apticron` 已经完成了此任务。\n\n`APT::Periodic::Download-Upgradeable-Packages`\n\
  \n同样，此选项指定了一个频率（以天为单位），这次是为了下载实际软件包。同样，`apticron` 用户不需要它。\n\n`APT::Periodic::AutocleanInterval`\n\
  \n此选项涵盖 `apticron` 不具备的功能。它控制从 `APT` 缓存中移除过软件包（不再被任何发行版引用的软件包）的频率。这保持了 `APT` 缓存的范围内，意味着你不需要担心这项。\n\
  \n`APT::Periodic::Unattended-Upgrade`\n\n启用此选项后，每日脚本将执行 `unattended-upgrade`（来自\
  \ `unattended-upgrades` 软件包），正如名称所示，它可以自动化某些软件包的升级过程（默认情况下，它只处理安全更新，但可以在 `/etc/apt/apt.conf.d/50unattended-upgrades`\
  \ 中进行自定义）。注意，可以通过 `debconf` 的帮助设置此选项，运行 `dpkg-reconfigure -plow unattended-upgrades`。如果安装了\
  \ `apt-listbugs`，它将防止受已报告的严重或致命错误影响的软件包进行自动升级。\n\n其他选项允许你更精确地控制缓存清理行为。这里没有列出它们，但在\
  \ `/usr/lib/apt/apt.systemd.daily` 脚本中有描述。\n\n这些工具对于服务器来说非常好，但桌面用户通常更倾向于更具交互性的系统。`gnome-software`\
  \ 软件包在可用更新时的桌面环境通知区域提供一个图标；点击此图标将运行一个执行更新的界面。你可以浏览可用更新，阅读相关软件包的简短描述以及相应的 `changelog`\
  \ 条目，并根据情况决定是否应用更新。\n\n图 6.3. 使用 gpk-update-viewer 升级![使用 gpk-update-viewer 升级](img/gnome-packagekit.png)\n\
  \n该工具不再默认安装在 GNOME 桌面。新的哲学是安全更新应该自动安装，要么在后台，要么最好在你关闭计算机时，以免干扰任何运行中的应用程序。\n\n# 6.9.\
  \ 自动升级\n\n由于 Falcot Corp 有许多计算机但人力有限，其管理员尝试尽可能让升级自动化。因此，负责这些过程的程序必须在无人干预的情况下运行。\n\
  \n## 6.9.1. 配置 `dpkg`\n\n正如我们已经提到的（参见侧栏 *GOING FURTHER* 避免配置文件问题），`dpkg` 可以被被指示在替换配置文件时不请求确认（使用\
  \ `--force-confdef --force-confold` 选项）。然而，交互可能来自其他三个来源：一些来自 `APT` 本身，一些由 `debconf`\
  \ 处理，另一些由于软件包配置脚本在命令行发生（有时由 `ucf` 处理）。\n\n## 6.9.2. 配置 `APT`\n\n`APT` 的情况很简单：`-y`\
  \ 选项（或 `--assume-yes`）告诉 `APT` 将所有问题的答案都视为“是”。\n\n## 6.9.3. 配置 `debconf`\n\n`debconf`\
  \ 的情况需要更多细节。该程序从创立之初就被旨在控制显示给用户的问题的相关性和数量，以及显示方式。这就是为什么它的配置要求问题具有一个最小优先级；只有高于最小优先级的问题才会显示。`debconf`\
  \ 假设它跳过的问题具有默认答案（由软件包维护者定义）。\n\n其他相关的配置元素是前端使用的界面。如果你在选项中选择 `noninteractive`，则所有用户交互都将被禁用。如果软件包尝试显示信息性注释，它将通过电子邮件发送给管理员。\n\
  \n要重新配置 `debconf`，请使用 `debconf` 软件包中的 `dpkg-reconfigure` 工具；相关命令是 `dpkg-reconfigure\
  \ debconf`。注意，需要时可以使用环境变量临时覆盖已配置的值（例如，`DEBIAN_FRONTEND` 控制界面，如 `debconf(7)` 手册页中记录所示）。\n\
  \n## 6.9.4. 处理命令行交互\n\n交互的最后一个来源，也是最难消除的，是由 `dpkg` 运行的配置脚本。遗憾的是没有标准的解决方案，也没有哪个答案比另一个明显优得多。\n\
  \n通常方法是通过将 `/dev/null` 的空内容重定向到标准输入来抑制标准输入，或者向其提供无尽的换行符流。这些方法没有一个是 100% 可靠的，但通常会导致使用默认答案，因为大多数脚本认为缺乏回复即为对默认值的接受。\n\
  \n## 6.9.5. 奇迹组合\n\n通过结合前面的元素，可以设计一个小型但相当可靠的脚本来处理自动升级。\n\n示例 6.5. 非交互式升级脚本：\n```\n\
  export DEBIAN_FRONTEND=noninteractive yes '' | apt-get -y -o DPkg::options::=\"\
  --force-confdef\" -o DPkg::options::=\"--force-confold\" dist-upgrade\n```\n\n*\
  \ * *\n\n*IN PRACTICE* Falcot Corp 案例\n\n\n\n\nFalcot 计算机是一个异构系统，不同的机器具有各种功能。因此，管理员将为每台计算机选择最相关的解决方案。\n\
  \n在实践中，运行 Buster 的服务器配置了上述的“奇妙组合”，并自动保持更新。只有最关键的服务器（例如防火墙）才配置了 `apticron`，以便升级始终在管理员的监督下进行。\n\
  \n行政部门的办公工作站也运行 Buster，但它们配备了 `gnome-packagekit`，因此用户可以自己触发升级。这一决策的理由是，如果升级在没有显式操作的情况下发生，计算机的行为可能会发生意外变化，从而给主要用户带来困惑。\n\
  \n在实验室中，少数使用 Testing 的计算机（为了利用最新版本的软件）也不会自动升级。管理员仅配置 `APT` 准备升级但不执行升级；当他们决定升级（手动操作）时，就可以避免刷新软件包列表和下载软件包等繁琐步骤，管理员可以将精力集中在真正有用的部分。\n\
  \n***\n\n# 6.10. 搜索软件包\n\n随着 Debian 软件数量巨大且不断增长，出现了一个悖论：Debian 通常为大多数任务提供了工具，但这些工具在数以千计的其它软件包中非常难找到。缺乏适当的方法来搜索（并找到）正确的工具长期以来一直是一个问题。幸运的是，这个问题几乎被完全解决了。\n\
  \n最简单的搜索是查找精确的软件包名。如果 `apt show package` 返回了结果，则该软件包存在。遗憾的是，这需要知道甚至猜测软件包的名称，而这并不总是可能的。\n\
  \n***\n\n### TIP 软件包命名规范\n\n某些类的软件包按照传统的命名方案命名；了解该方案有时可以让你猜出精确的软件包名。例如，对于 Perl 模块，规定上游名为\
  \ `XML::Handler::Composer` 的模块应该被封装为 `libxml-handler-composer-perl`。允许 Python 使用\
  \ `gconf` 系统的库被封装为 `python-gconf`。遗憾的是，无法为所有软件包定义一个完全通用的命名方案，尽管软件包维护者通常会尝试遵循上游开发者的选择。\n\
  \n***\n\n一种稍微成功一点搜索模式是在软件包名中进行纯文本搜索，但这种方法仍然非常局限。你通常可以通过搜索软件包描述找到结果：由于每个软件包除了名称外，还有一个多或少详细的描述，因此在这些描述中进行关键词搜索通常很有用。`apt-cache`\
  \ 和 `axi-cache` 是此类搜索的首选工具（参见 *ALTERNATIVE axi-cache]）；例如，`apt-cache search video`\
  \ 将返回所有名称或描述包含关键词“video”的软件包列表。\n\n对于更复杂的搜索，需要更强大的工具，如 `aptitude`。`aptitude` 允许你根据软件包元数据字段的逻辑表达式进行搜索。例如，以下命令搜索名称包含\
  \ `kino`、描述包含 `video` 且维护者名称包含 `paul` 的软件包：\n\n```bash\naptitude search kino~dvideo~mpaul\
  \ p kino - Non-linear editor for Digital Video data\naptitude show kino Package:\
  \ kino Version: 1.3.4+dfsg0-1 State: not installed Priority: optional Section: video\
  \ Maintainer: Paul Brossier <piem@debian.org> Architecture: amd64 Uncompressed Size:\
  \ 8,304 k Depends: libasound2 (>= 1.0.16), libatk1.0-0 (>= 1.12.4), libavc1394-0\
  \ (>= 0.5.3), libavcodec58 (>= 7:4.0) | libavcodec-extra58 (>= 7:4.0), libavformat58\
  \ (>= 7:4.0), libavutil56 (>= 7.4.0), libc6 (>= 2.14), libcairo2 (>= 1.2.4), libdv4\
  \ (>= 1.0.0), libfontconfig1 (>= 2.12.6), libfreetype6 (>= 2.2.1), libgcc1 (>= 1:3.0),\
  \ libgdk-pixbuf2.0-0 (>= 2.22.0), libglade2-0 (>= 1:2.6.4-2~), libglib2.0-0 (>=\
  \ 2.16.0), libgtk2.0-0 (>= 2.24.32), libice6 (>= 1:1.0.0), libiec61883-0 (>= 1.2.0),\
  \ libpango-1.0-0 (>= 1.14.0), libpangocairo-1.0-0 (>= 1.14.0), libpangoft2-1.0-0\
  \ (>= 1.14.0), libquicktime2 (>= 2:1.2.2), libraw1394-11, libsamplerate0 (>= 0.1.7),\
  \ libsm6, libstdc++6 (>= 5.2), libswscale5 (>= 7:4.0), libx11-6, libxext6, libxml2\
  \ (>= 2.7.4), libxv1\n```\n\n\n\n\n对于管理员来说，最重要的技能是能够应对任何情况，无论是已知的还是未知的。本章提供了许多方法——希望——能够让你隔离出你将遇到的任何问题的原因，以便你能够解决这些问题。\n\
  \n# 7.1. 文档来源\n\n在理解问题发生时到底发生了什么之前，你需要了解参与该过程的每个程序所扮演的理论作用。要做到这一点，最好的反应是查阅它们的文档；但由于这些文档非常多且分散在世界各地，你应该知道它们可以在哪些地方找到。\n\
  \n## 7.1.1. 手册页 (Manual Pages)\n\n* * *\n\n*极场文化* <acronym class=\"acronym\">RTFM</acronym>\n\
  \n这个缩写代表“Read the F***ing Manual”（去读那该死的手册），但也可以被扩展为一种更友好的变体，“Read the Fine Manual”（仔细阅读精细的手册）。这个短语有时用于对新手提问题的（简短的）回答。它显得相当生硬，并流露出对那些甚至不懒于阅读文档的人提问的某种恼骚。有人认为，这种经典的回答比完全不回答要好（因为它表明文档中包含了所寻找的信息），或者比一个冗长且愤怒的回答要好。\n\
  \n无论如何，如果有人对你回答“RTFM”，通常明智的做法不要介意。由于这个回答可能被认为是烦人的，你可能想尽量避免收到这种回答。如果你需要的信息不在手册中（这确实发生），你可能想说明这一点，最好在初始提问中就说。在论坛上提问之前，你应该描述你个人为寻找信息所采取的各种步骤。遵循埃里克·雷蒙德（Eric\
  \ Raymond）的指南是避免常见错误并获得有用答案的好方法。\n\n→ [`catb.org/~esr/faqs/smart-questions.html`](http://catb.org/~esr/faqs/smart-questions.html)\n\
  \n* * *\n\n手册页虽然风格相对简练，但包含了大量的本质信息。我们将快速回顾由 `man-db` 软件包提供的查看它们的命令。只需输入 `man manual-page`\
  \ —— 手册页名称通常与你所查询文档的命令名称相同。例如，要学习 `cp` 命令的可能选项，你可以在 shell 提示符处输入 `man cp` 命令（参见侧边栏\
  \ *返回基础知识* The shell，一个命令行解释器）。\n\n* * *\n\n*返回基础知识* The shell，一个命令行解释器\n\n命令行解释器，也称为“shell”，是一个执行用户输入或存储在脚本中的命令的程序。在交互模式下，它显示一个提示符（通常对于普通用户以\
  \ `$` 结尾，管理员则以 `#` 结尾），表示它已准备好读取新命令。附录 B，*简短补习课程*\n\n 默认且最常用的 shell 是 `bash` (Bourne\
  \ Again SHell)，但还有其他的，包括 `dash`、`csh`、`tcsh` 和 `zsh`。\n\n除外，大多数 shell 在提示符处输入时提供帮助（输入\
  \ `help`）和辅助，例如命令或文件名的补全（你通常可以通过按下 `tab` 键激活），或回溯之前的命令（历史管理；即检查 `/etc/inputrc` 中“上页”和“下一页”的映射）。\n\
  \n* * *\n\n手册页不仅记录了从命令行访问的命令和程序，还包括配置文件、系统调用、库函数等。有时名称会冲突。例如，shell 的 `read` 命令与\
  \ `read` 系统调用同名。这就是为什么手册页按数字章节组织：\n\n1. 可以从命令行执行的命令；\n2. 系统调用（内核提供的函数）；\n3. 库函数（系统库提供）；\n\
  4. 设备（在类 Unix 系统上，这些是特殊文件，通常放在 `/dev/` 目录下）；\n5. 配置文件（格式和约定）；\n6. 游戏；\n7. 宏和标准集；\n\
  8. 系统管理命令；\n9. 内核程序。\n\n你可以指定要查找的手册页章节：要查看 `read` 系统调用的文档，你需要输入 `man 2 read`。当没有显式指定章节时，将显示具有请求名称的手册的第一章节。因此，`man\
  \ shadow` 返回 `shadow(5)`，因为在第 1 到 4 节没有 *shadow* 的手册页。\n\n* * *\n\n*提示* `whatis`\n\
  \n如果你不想看完整的手册页，只想通过简短描述确认它是否是你正在寻找的，只需输入 `whatis command`。\n\n```\n$ whatis scp\n\
  scp (1) - secure copy (远程文件拷贝程序)\n```\n\n这个简短描述包含在所有手册页开头的 *NAME* 章节。\n\n* * *\n\
  \n当然，如果你不知道命令名称，手册对你来说将没有太大帮助。这就是 `apropos` 命令的作用，它可以帮助你在手册页中进行搜索，更具体地说是在它们的简短描述中搜索。每个手册页本质上都以一行摘要开始。`apropos`\
  \ 返回摘要中提到关键词的手册页列表。\n\n```\n$ apropos \"copy file\"\ncp (1) - copy files\ncpio (1)\
  \ - copy files to and from archives\ncopy (1) - copy files from HFS+\ninstall (1)\
  \ - copy files and set attributes\nntfscp (8) - copy file to NTFS volume\n```\n\n\
  * * *\n\n*提示* 通过链接浏览\n\n许多手册页都有一个“SEE ALSO”（另请）部分，通常位于末尾。它引用了与其他相似命令相关的手册页或外部文档。通过这种方式，即使首选不是最优的，也可以找到相关的文档。\n\
  \n* * *\n\n`man` 命令不是查看手册页的唯一方法，因为 `helpcenter` 和 `konqueror`（来自 KDE）以及 `yelp`（来自\
  \ GNOME）程序也提供了可能。还有一个由 `man2html` 软件包提供的 Web 界面，允许你在浏览器中查看。在安装了该软件包的计算机上，按照 `/usr/share/doc/man2html/README.Debian`\
  \ 中的指令使用此 URL：\n\n→ [`localhost/cgi-bin/man/man2html`](http://localhost/cgi-bin/man/man2html)\n\
  \n此工具需要 Web 服务器。这就是为什么你应该选择在你的服务器上安装此软件包：局域网的所有用户都可以从中受益（包括非 Linux 设备），这让你无需在每个工作站上设置\
  \ HTTP 服务器。如果你的服务器也可以从其他网络访问，可能希望将服务限制为局域网用户。\n\n最后，你可以在 `manpages.debian.org` 服务查看\
  \ Debian 中提供的所有手册页（即使没有安装在你的机器上）。它为每个手册页提供多个版本，对应每个 Debian 版本。\n\n→ [`manpages.debian.org`](https://manpages.debian.org)\n\
  \n* * *\n\n*DEBIAN POLICY* 强制手册页\n\nDebian 要求每个程序都有手册页。如果上游作者没有提供，Debian 软件包维护者通常会编写一个简单的页面，至少引导读者找到原始文档的位置。\n\
  \n* * *\n\n## 7.1.2. *info* 文档\n\n\n\n\n\nGNU 项目已为其大部分程序编写了 `info` 格式的手册；这就是为什么许多手册页会引用相应的\
  \ `info` 文档的原因。这种格式具有某些优势，但查看这些文档的默认程序（称为 `info`）也稍微复杂一些。建议你使用 `pinfo`（来自 `pinfo`\
  \ 软件包）。\n\n`info` 文档具有分级结构，如果你在不带任何参数的情况下调用 `pinfo`，它将显示第一级可用节点列表。通常，节点的名称与相应的命令同名。\n\
  \n使用 `pinfo` 通过方向键在这些节点之间导航是很容易实现的。或者，你也可以使用图形化浏览器，这要友好得多。同样，`konqueror` 和 `yelp`\
  \ 也可以；`info2www` 软件包也提供了一个网页界面。\n\n→ [`localhost/cgi-bin/info2www`](http://localhost/cgi-bin/info2www)\n\
  \n注意，与 `man` 页系统不同，`info` 系统不支持翻译。因此，`info` 文档几乎总是英文的。然而，当你要求 `pinfo` 程序显示一个不存在的\
  \ `info` 页面时，它将回退到同名的 `man` 页（如果存在），而该页可能是经过翻译的。\n\n### 7.1.3. 特定文档\n\n每个软件包都包含自己的文档。即使是文档最少的程序，通常也包含一个\
  \ `README` 文件，其中包含一些有趣的和或重要的信息。这些文档安装在 `/usr/share/doc/packagepackage` 目录下（其中 `package`\
  \ 代表软件包的名称）。如果文档特别大，它可能不会包含在程序的主包中，而是被卸载到一个专门的软件包，该包通常命名为 `package`-doc`。主包通常会推荐该文档包以便你轻松找到它。\n\
  \n`/usr/share/doc/packagepackage` 目录还包含一些由 Debian 提供的文件，这些文件通过指定软件包与传统软件安装相比的特殊之处或改进来完善文档。`README.Debian`\
  \ 文件还列出了为了符合 Debian 策略而进行的所有适配。`changelog.Debian.gz` 文件允许用户跟踪随时间推移对软件包进行的修改：对于理解两个行为不相同的安装版本之间发生了什么，这非常有用。最后，有时还有一个\
  \ `NEWS.Debian.gz` 文件，它记录了程序中的重大变化，这些变化可能直接影响管理员（参见第 6.7.2 节，“处理升级后的问题）。\n\n###\
  \ 7.1.4. 网站\n\n在大多数情况下，自由软件程序都有网站，用于分发软件并聚集开发者和用户社区。这些网站经常加载了各种形式的相关信息：官方文档、FAQ（常见问题解答）、邮件列表存档等。你可能会遇到的问题通常已经是许多问题讨论的主题；FAQ\
  \ 或邮件列表存档可能有其解决方案。熟练使用搜索引擎将证明对于快速找到相关页面具有极高的价值（通过将搜索限制在程序专用的互联网域名或子域名内）。如果搜索返回的页面过多，或者结果与你所寻找的不符，你可以添加关键词\
  \ `debian` 来限制结果并定位相关信息。\n\n**提示：从错误到解决方案**\n\n如果软件返回了非常具体的错误信息，将其输入到搜索引擎中（使用双引号\
  \ `\"`，以便搜索不是单个关键词，而是整个短语）。在大多数情况下，返回的第一个链接将包含你需要的答案。\n\n在其他情况下，你会得到非常通用的错误，例如“Permission\
  \ denied”。在这种情况下，最好检查涉及的元素（文件、用户 ID、组等）的权限。\n\n如果你不知道软件网站的地址，有多种方法可以获取。首先，检查软件包的元信息中是否有\
  \ `Homepage` 字段（`apt show package`）。或者，软件包描述可能包含一个指向程序官方网站的链接。如果没有标明 URL，请查看 `/usr/share/doc/package/copyright`。Debian\
  \ 维护者通常会在文件中指示他们从哪里获取程序的源代码，这很可能就是你需要找到的网站。如果在此阶段你的搜索仍然没有无获，请咨询自由软件目录（例如 FSF 的自由软件目录），或直接使用搜索引擎（如\
  \ Google、DuckDuckGo、Yahoo 等）进行搜索。\n\n→ [`directory.fsf.org/wiki/Main_Page`](https://directory.fsf.org/wiki/Main_Page)\n\
  \n你可能还想查看一下 Debian wiki，这是一个协作网站，任何人（即使是简单的访问者）都可以直接从浏览器提出建议。它既被设计和规范项目的开发者使用，也被通过协作编写文档来共享知识的用户使用。\n\
  \n→ [`wiki.debian.org/`](https://wiki.debian.org/)\n\n### 7.1.5. 教程 (HOWTO)\n\n\
  `HOWTO` 是一种具体具体并分步骤地描述“如何”实现预定义目标的文档。所涵盖的目标相当多样，但通常是技术性的：例如，设置 IP 伪装（Masquerading）、配置软件\
  \ RAID、安装 Samba 服务器等。这些文档通常尝试涵盖在实现特定技术期间可能发生的所有问题。\n\n许多此类教程由 Linux 文档项目 (LDP) 管理，其网站托管所有这些文档：\n\
  \n→ [`www.tldp.org/`](https://www.tldp.org/)\n\nDebian 也为其用户提供教程：\n\n→ [`www.debian.org/doc/`](https://www.debian.org/doc/)\n\
  \n所有这些文档都应该持保留态度。它们通常有几年的历史了；它们包含的信息有时是过时的。这种现象在翻译中更为常见，因为在原始文档发布新版本后，更新既不是系统性的，也不是即时的。此外，现在许多教程是由博主提供的，将他们的个人解决方案分享给感兴趣的读者。它们通常缺乏重要信息，即为什么选择某些配置而不是其他配置，或者为什么启用或禁用了某些选项。因为博客和创建自己的网站使得分享变得如此容易，存在许多这类通常很短的教程，但只有少数是积极维护和良好保存的。这可能让你很难找到适合你自己的“正确”的那一个。这都是在志愿者环境中工作且不受约束的乐趣的全部。\n\
  \n# 7.2. 常用操作\n\n\n\n\n\n当你想要配置一个未知软件包时，必须分阶段进行。首先，你应该阅读软件包维护者编写的文档。阅读 `/usr/share/doc/package/README.Debian`\
  \ 确实可以让你了解为了简化软件使用而所做的特定规定。为了理解该程序与通用文档（如教程/howtos）中描述的原始行为之间的差异，这有时是非常关重要的。有时，该文件还会详细列出常见的错误，以便你避免在常见问题上浪费时间。\n\
  \n然后，你应该查看软件的官方文档——参阅第 7.1 节，“文档来源”来识别各种现有的文档来源。`dpkg -L package` 命令会列出软件包中包含的文件列表；因此，你可以快速识别出可用文档（以及位于\
  \ `/etc/` 的配置文件）。`dpkg -s package` 显示软件包的元数据，并显示任何可能的推荐或建议包；在其中，你可以找到文档或可以简化软件配置的实用程序。\n\
  \n最后，配置文件通常通过许多解释性注释进行自文档，详细说明了每个配置设置的各种可能值。其程度之高，有时只需从可用选项中选择一行进行激活即可了。在某些情况下，`/usr/share/doc/package/examples/`\
  \ 目录下提供了配置文件的示例。它们可以作为你自己的配置文件的基础。\n\n* *\n\n### DEBIAN 策略示例的位置\n\n所有示例必须安装在 `/usr/share/doc/package/examples/`\
  \ 目录下。这可能是一个配置文件、程序源代码（库使用的示例）或管理员在某些情况下可以使用的数据转换脚本（例如初始化数据库）。如果示例针对特定架构，则应应安装在\
  \ `/usr/lib/package/examples/` 中，并在 `/usr/share/doc/package/examples/` 目录下应有一个指向该文件的链接。\n\
  \n* *\n\n### 7.2.2. 监控守护进程的操作\n\n理解守护进程的作用要复杂一些，因为它不与管理员直接交互。要检查守护进程是否实际在运行，你需要对其进行测试。例如，要检查\
  \ Apache（Web 服务器）守护进程，可以使用 HTTP 请求对其进行测试。\n\n* *\n\n### 基础知识 守护进程 (Daemon)\n\n守护进程不是由用户显式调用的程序，它在后台运行，等待某些条件满足后执行任务。许多服务器程序都是守护进程，这个术语解释了为什么名称末经常带有字母“d”（`sshd`、`smtpd`、`httpd`\
  \ 等）。\n\n* *\n\n为了允许此类测试，每个守护进程通常会将它所做的一切以及它遇到的任何错误记录在所谓的“日志文件”或“系统日志”中。日志存储在 `/var/log/`\
  \ 或其任一子目录中。要知每个守护进程日志文件的精确名称，请参阅其文档。注意：如果测试没有涵盖所有可能的使用场景，单一测试并不总是够的；某些问题只会在特定情况下发生。\n\
  \n* *\n\n### 工具 rsyslogd 守护进程\n\n`rsyslogd` 是特殊的：它收集其他程序发送给它的日志（内部系统消息）。每个日志条目都与一个子系统（电子邮件、内核、身份验证等）和一个优先级相关；`rsyslogd`\
  \ 通过处理这两条信息来决定做什么。日志消息可能记录在各种日志文件中，并/或发送到管理控制台。细节定义在 `/etc/rsyslog.conf` 配置文件中（在\
  \ rsyslog-doc 软件包提供的同名手册页中有记录）。\n\n某些专门用于发送日志的 C 函数简化了 `rsyslogd` 守护进程的使用。然而，某些守护进程会管理自己的日志文件（例如\
  \ `samba` 就是此类情况，它在 Linux 上实现 Windows 共享）。\n\n注意，在使用 `systemd` 时，日志在转发到 `rsyslogd`\
  \ 之前实际上由 `systemd` 收集。因此，它们也可以通过 `systemd` 的 journal 获取，并可以使用 `journalctl` 查询（详情请参见第\
  \ 9.1.1 节，“systemd 初始化系统”）。\n\n* *\n\n作为预防性操作，管理员应该定期阅读最相关的服务器日志。这样他们就可以在不满的用户报告之前就诊断出问题。事实上，用户有时可能会等问题连续出现几天后才报告。在许多情况下，有特定的工具可以分析分析较大日志文件的内容。特别是，此类工具存在于\
  \ Web 服务器（如用于 Apache 的 `analog`、`awstats`、`webalizer`）、FTP 服务器、代理/缓存服务器、防火墙、电子邮件服务器、DNS\
  \ 服务器，甚至打印服务器中。其他工具，如 `logcheck`（在第 14 章，*安全* 中讨论的软件），会扫描这些文件以寻找需要处理的警报。\n\n###\
  \ 7.2.3. 在邮件列表中寻求帮助\n\n如果你的搜索没有帮你找到问题的根源，可以从其他可能有经验的人那里获得帮助。这正是 `debian-user@debian.org`\
  \ 邮件列表的目的。正如任何社区一样，它有需要遵守的规则。在提任何问题之前，你应该检查你的问题是否已经由列表最近的讨论或任何官方文档覆盖。\n\n[`wiki.debian.org/DebianMailingLists`](https://wiki.debian.org/DebianMailingLists)\n\
  [`lists.debian.org/debian-user/`](https://lists.debian.org/debian-user/)\n[`lists.debian.org/users.html`](https://lists.debian.org/users.html)\n\
  \n* *\n\n### 基础知识 网络礼仪 (Netiquette) 适用\n\n通常情况下，对于邮件列表上的所有通信，都应该遵守网络礼仪规则。该术语指的是一组常识规则，从普通礼节到应该避免的错误不等。\n\
  \nRFC1855\n\n此外，对于由 Debian 项目管理的任何通信通道，你都受 Debian 行为准的约束：\n\n[`www.debian.org/code_of_conduct`](https://www.debian.org/code_of_conduct)\n\
  \n* *\n\n一旦满足这两个条件，你就可以考虑向邮件列表描述你的问题了。包含尽可能多的相关信息：进行的各种测试、查阅的文档、你如何尝试诊断问题、涉及的包或可能涉及的包等。检查\
  \ Debian 缺陷跟踪系统（BTS，在侧边栏第 1.3.2.1 节，“报告缺陷”）中是否有类似问题，并提及搜索结果，提供发现的缺陷的链接。BTS 地址为：\n\
  \n[`bugs.debian.org/`](https://bugs.debian.org/)\n\n你越礼貌、越精确，获得答案（或至少是一些回复元素）的机会就越大。如果你通过私信电子邮件收到相关信息，请考虑公开总结这些信息，以便他人受益。这也能让列表存档在通过各种搜索引擎搜索时，为其他可能有相同问题的其他人显示解决方案。\n\
  \n## 7.2.4. 当问题太困难时报告缺陷\n\n\n\n\n\n如果你解决问题的所有尝试都失败了，那么可能解决该问题并不是你的责任，该问题是由于程序中的一个\
  \ bug 导致的。在这种情况下，正确的做法是向 Debian 或直接向上游开发者报告该 bug。为了做到，请尽可能地隔离问题，并创建一个可以重现该问题的最小测试场景。如果你知道哪个程序是问题的明显原因，可以使用命令\
  \ `dpkg -S `file_in_question`` 找到对应的软件包。检查 Bug 跟踪系统（`https://bugs.debian.org/`package）以确保该\
  \ bug 尚未被报告。然后你可以使用 `reportbug` 命令发送你自己的 bug 报告，尽可能包含尽可能信息，特别是对那些最小测试用例的完整描述，以便任何人都能重现该\
  \ bug。\n\n本章介绍的元素是有效解决后续章节可能带来的问题的手段。请根据需要频繁使用它们！\n\n# 第 8 章 基础配置：网络、账户、打印……\n\n\
  使用 `debian-installer` 创建的全新安装的计算机旨在提供尽可能多的功能，但仍有许多服务需要配置。此外，了解如何更改在初始安装过程中定义的某些配置元素总是是有好的。\n\
  \n本章回顾了我们所谓的“基础配置”中包含的所有内容：网络、语言和区域、用户和组、打印、挂载点等。\n\n## 8.1. 为另一种语言配置系统\n\n如果系统是使用法语安装的，机器可能已经将法语设置为默认语言。但了解安装程序是如何设置语言的是有好的，这样在以后有需要时，你可以更改它。\n\
  \n***\n\n*工具* 使用 `locale` 命令显示当前配置\n\n`locale` 命令列出各种区域参数（日期格式、数字格式等）的当前配置摘要，这些参数以一组专门用于动态修改这些设置的标准环境变量的形式呈现出来。\n\
  \n***\n\n## 8.1.1. 设置默认语言\n\n区域（locale）是一组区域设置。这不仅包括文本语言，还包括数字、日期、时间、货币金额的显示格式，以及字母比较规则（为了正确处理带重音的字符）。尽管这些参数中的每一个都可以独立于其他进行指定，但我们通常使用一个区域，它是这些参数的一组一致的值，对应于广义上的“区域”。这些区域通常以\
  \ `language-code`_`COUNTRY-CODE` 的形式指示，有时带有后缀以指定要使用的字符集和编码。这使得能够考虑具有共同语言的不同地区之间的习惯用语或排版差异。\n\
  \n***\n\n*文化* 字符集\n\n从历史上看，每个区域都有关联的“字符集”（一组已知字符）和一个首选的“编码”（计算机内部对字符的表示）。\n\n对于基于拉丁的语言，最流行的编码限于\
  \ 256 个字符，因为它们选择为每个字符使用单个字节。由于 256 个字符不足以覆盖所有欧洲语言，因此需要多种编码，这就是我们得到从 `ISO-8859-1`（也称为“Latin\
  \ 1”）到 `ISO-8859-15`（也称为“Latin 9”）等。\n\n处理外国语言通常意味着要在各种编码和字符集之间经常切换。此外，编写多语言文档导致了进一步的几乎无法解决的问题。Unicode（一个包含世界上所有语言几乎所有书系统的超级目录）的创建是为了解决这个问题。Unicode\
  \ 的编码之一 `UTF-8` 保留了所有 128 个 ASCII 符号（7 位代码），但以不同的方式处理其他字符。这些字符的前面跟有一个几个比特的特定转义序列，该序列隐式地定义了字符的长度。这允许在单或多个字节的序列上编码所有\
  \ Unicode 字符。它的使用由于它是 XML 文档的默认编码而变得流行。\n\n这通常是应该使用的编码，因此它是 Debian 系统上的默认编码。\n\n\
  `locales` 软件包包含了各种应用程序“本地化”正常运行所需的所有元素。在安装期间，该软件包将要求选择一组支持的语言。这组语言可以通过以 root 运行\
  \ `dpkg-reconfigure locales` 随时更改。\n\n第一个问题邀请你选择要支持的“locales”。选择所有英语区域（即以 `en_`\
  \ 开头的那些）是一个合理的选择。如果机器将托管外国用户，请不要犹豫也启用其他区域。系统上启用的区域列表存储在 `/etc/locale.gen` 文件中。可以手动编辑此文件，但在任何修改之后，你应该运行\
  \ `locale-gen`。它将为添加的区域生成工作所需的文件，并删除任何过时的文件。\n\n第二个问题为“系统环境的默认区域”，请求一个默认区域。在美国推荐的选择是\
  \ `en_US.UTF-8`。英国英语使用者将更倾向于 `en_GB.UTF-8`，而加拿大人人更倾向于 `en_CA.UTF-8` 或用于法语的 `fr_CA.UTF-8`。`/etc/default/locale`\
  \ 文件将被修改以存储此选择。从那里，所有用户会话都会获取它，因为 PAM 将其内容注入 `LANG` 环境变量中。\n\n`locales-all` 软件包包含所有区域的预编译区域数据。\n\
  \n***\n\n*幕后* `/etc/environment` 和 `/etc/default/locale`\n\n`/etc/environment` 文件为\
  \ `login`、`gdm` 甚至 `ssh` 程序提供创建所需的环境变量。\n\n这些应用程序并不直接创建变量，而是通过 PAM (`pam_env.so`)\
  \ 模块。PAM（可插认证模块）是一个集中认证、会话初始化和密码管理机制的模块化库。参见第 11.7.3.2 节“配置 PAM”获取配置示例。\n\n`/etc/default/locale`\
  \ 文件的工作方式类似，但只包含 `LANG` 环境变量。由于这种分离，某些 PAM 用户可以继承一个没有本地化的完整环境。事实上，不建议在启用本地化的情况下运行服务器程序；另一方面，对于打开用户会话的程序，建议使用本地化和区域设置。\n\
  \n***\n\n## 8.1.2. 配置键盘\n\n即使键盘布局在控制台图形模式下的管理方式不同，Debian 也提供了一个适用于两者的配置界面：它基于 debconf\
  \ 并实现在 `keyboard-configuration` 软件包中。因此，可以使用 `dpkg-reconfigure keyboard-configuration`\
  \ 命令随时重置键盘布局。\n\n问题与物理键盘布局有关（标准的美国 PC 键盘是“Generic 104 key”），然后要选择的布局（通常是“US”），然后\
  \ AltGr 键的位置（右 Alt）。最后是关于使用哪个键作为“组合键”的问题，它允许通过组合按键输入特殊字符。连续输入 **Compose** **'**\
  \ **e** 产生带重音的 e (“é”）。所有这些组合都描述在 `/usr/share/X11/locale/en_US.UTF-8/Compose` 文件中（或根据\
  \ `/usr/share/X11/locale/compose.dir` 指示的另一个文件）。\n\n\n\n\n\n请注意，此处描述的图形模式键盘配置仅影响默认布局；`GNOME`\
  \ 和 `KDE Plasma` 等环境在它们的偏好设置提供了键盘控制面板，允许每个用户拥有自己的配置。在这些控制面板中还提供了关于某些特定按键行为的额外选项。\n\
  \n## 8.1.3 迁移到 UTF-8\n\n`UTF-8` 编码的通用化一直是解决许多互操作性困难长期期待的方案，因为它促进了国际交流，并消除了对文档可用字符的任意限制。唯一的缺点是它必须经历一个相当困难的阶段。由于它无法完全透明（也就是说，无法在全球范围内同时发生），因此需要两次转换操作：一个针对文件内容，另一个针对文件名。幸运的是，大部分迁移工作已经完成，我们讨论这些内容主要是为了供参考。\n\
  \n### 乱码（Mojibake）和解释错误\n\n当发送（或存储）文本时不带有编码信息时，接收方并不总是能够确定使用何种约定来确定一组字节的含义。你通常可以通过对文本中出现的数值分布进行统计来获得思路，但这并不总是能给出确定的答案。当用于读取的编码系统与写入时使用的系统不同时，字节就会被误读，你最好的结果是某些字符出现错误，最坏的结果是完全无法阅读的内容。\n\
  \n因此，如果法语文本显示正常，除了带音角的字母和某些符号（这些符号似乎被替换为如“©”或\"\"之类的序列），这可能是一个编码为 `UTF-8` 的文件，但被解释为\
  \ `ISO8859-1` 或 `ISO8859-15`。相反，如果你看到问号而不是带音角的字母——即使这些问号似乎也替换了本该后的某个字符——很可能是你的安装已经配置为\
  \ `UTF-8`，而你发送了一个用 `ISO` 编码的文档。\n\n许多简单的情况只出现在西方文化中，因为 `Unicode`（以及 `UTF-8`）的设计初衷是最大化地与基于拉丁字母的历史编码保持共同点，这使得即使在某些字符缺失时也能识别文本的部分。在更复杂的配置中（例如涉及两种不使用相同字母的不同语言环境），你经常得到完全无法阅读的结果——一系列彼此无关的符号。这在亚洲语言中尤为常见，因为它们拥有大量的语言和书写系统。`mojibake`（乱码）一词被用来描述这种现象。当它出现时，诊断更加复杂，最简单的解决方案通常是让双方都迁移到\
  \ `UTF-8`。\n\n对于文件名，迁移可以相对简单。`convmv` 工具（位于同名软件包中）是专门为此目的创建的；它允许将文件从一种编码重命名为另一种。该工具的使用相对简单，但我们建议分两步进行以避免意外。以下示例说明了一个包含以\
  \ `ISO8859-1` 编码的目录名的 `UTF-8` 环境，以及使用 `convmv` 对它们重命名。\n\n```\nls travail/\nconvmv\
  \ -r -f iso-8859-15 -t utf-8 travail/\nStarting a dry run without changes... mv\
  \ \"travail/graphiques\" \"travail/graphiques\" \"travail/iconnes\" \"travail/iconnes\"\
  \n```\n\n```\nconvmv -r --dry-run -f iso-8859-15 -t utf-8 travail/\nmv \"travail/graphiques\"\
  \ \"travail/graphiques\" \"travail/iconnes\" \"travail/iconnes\"\nReady!\nls travail/\n\
  ```\n\n对于文件内容，由于现有文件格式种类繁多，转换程序更为复杂。某些文件格式包含了编码信息，这有助于处理它们的软件完成任务；那么，只需打开这些文件并指定\
  \ `UTF-8` 编码进行重新保存即可。在其他情况下，你需要在打开文件时指定原始编码（如 `ISO8859-1` 或“Western”，或 `ISO8859-15`\
  \ 或“Western (Euro)”等公式）。\n\n对于简单的文本文件，你可以使用 `recode`（位于同名软件包中），它允许自动重编码。该工具有许多选项，你可以尝试它的行为。我们建议你查阅文档、`recode(1)`\
  \ 手页或 `recode` info 页面（更完整）。\n\n## 8.2 配置网络\n\n### 回基础：核心网络概念（以太网、IP 地址、子网掩、广播）\n\
  \n大多数现代局域网使用 `Ethernet`（以太网）协议，数据被分成称为“帧”的小块，并在线缆上一帧一帧地传输。数据速度从旧 `Ethernet` 网卡的\
  \ `10 Mb/s` 到最新网卡的 `100 Gb/s` 不等（目前最常见的速率从 `100 Mb/s` 增长到 `10 Gb/s`）。常用的电缆被称为 `10BASE-T`、`100BASE-T`、`1000BASE-T`、`10GBASE-T`\
  \ 和 `40GBASE-T`，取决于它们能够可靠提供的吞吐量（T 代表“双绞”）；这些电缆采用 `RJ45` 连接器。还有其他类型的缆，主要用于 `10 Gb/s`\
  \ 及以上的速度。\n\n`IP 地址` 是用于识别局域网或网上计算机网络接口的数字。在目前最常用的 `IP` 版本（`IPv4`）中，该数字被编码为 32 位，通常表示为\
  \ 4 个用点分隔的数字（例如 `192.168.0.1`）。协议的下一个版本 `IPv6` 将此地址空间扩展到 128 位，地址通常表示为一系列用冒号分隔的十六进制数（例如\
  \ `2001:0db8:13bb:0002:0000:0000:0000:0020`，简写为 `2001:db8:13bb:2::20`）。\n\n`子网掩码`\
  \ (`netmask`）在其二进制代码中定义 IP 地址的哪部分对应网络，其余部分指定机器。在给出的静态 `IPv4` 地址配置示例中，子网掩码 `255.255.255.0`（二进制表示为\
  \ 24 个“1”后跟 8 个“0”）表示 IP 地址的前 24 位对应于网络，其他 8 位属于特定机器。在 `IPv6` 中，为了可读性，只表示“1”的数量；因此，一个\
  \ `IPv6` 网络的子网掩码可以是 `64`。\n\n网络地址是其中描述机器部分为 0 的 IP 地址。完整网络中的 `IPv4` 地址范围通常用语法 `a.b.c.d/e`\
  \ 表示，其中 `a.b.c.d` 是网络地址，`e` 是 IP 地址中影响网络部分的比特数。因此，示例网络将写为：`192.168.0.0/24`。`IPv6`\
  \ 的语法类似：`2001:db8:13bb:2::/64`。\n\n`router`（路由器）是一种将多个网络连接在一起的机器。通过路由器的所有流量都会引导至正确的网络。为了做到这一点，路由器分析传入的数据包，并根据其目的\
  \ IP 地址对其进行重定向。路由器通常被称为网关；在这种配置中，它作为一台帮助访问局域网之外（指向扩展网络，如互联网）的机器。\n\n\n\n\n\n特殊的广播地址连接了网络中的所有工作站。它几乎不会被“路由”，仅在相关的网络中起作用。具体而言，这意味着指向广播地址的数据包永远不会通过路由器。\n\
  \n本章重点关注 IPv4 地址，因为它们是目前最常用的地址。有关 IPv6 协议的细节，将在 第 10.6 节，“IPv6” 中介绍，但其概念是保持的。\n\n\
  ***\n\n网络在初始安装期间会自动进行配置。如果安装了 `Network Manager`（全桌面版安装通常都是如此），那么可能实际上不需要任何配置（例如，如果你在有线连接上依赖\
  \ `DHCP` 且没有特殊要求）。如果需要配置（例如，对于 WiFi 接口），它将在 `/etc/NetworkManager/system-connections/`\
  \ 中创建适当的文件。\n\n如果没有安装 `Network Manager`，则安装程序将通过创建 `/etc/network/interfaces` 文件来配置\
  \ `ifupdown`。以 `auto` 开头的行列出了由 `networking` 服务在启动时自动配置的接口列表。当接口很多时，良好的做法是将配置放在 `/etc/network/interfaces.d/`\
  \ 内部不同的文件中。\n\n在服务器上下文中，`ifupdown` 是你通常获得的网络配置工具。这就是为什么我们将在接下来的章节中介绍它。\n\n***\n\n\
  ### 替代 NetworkManager\n\n虽然 `Network Manager` 在漫游设置中被特别推荐（参见 第 8.2.5 节，“漫游用户的自动网络配置”），但它完全可以作为默认网络管理工具。你可以手动在\
  \ `/etc/NetworkManager/system-connections/` 中创建一个类似 `.ini` 的文件，或者通过图形化工具 `nm-connection-editor`\
  \ 来创建计算机启动时立即使用的“系统连接”。只需记住禁用 `/etc/network/interfaces` 中你希望 `Network Manager` 处理的条目即可。\n\
  \n→ [`wiki.gnome.org/Projects/NetworkManager/SystemSettings`](https://wiki.gnome.org/Projects/NetworkManager/SystemSettings)→\
  \ [`developer.gnome.org/NetworkManager/1.14/ref-settings.html`](https://developer.gnome.org/NetworkManager/1.14/ref-settings.html)\n\
  \n***\n\n## 8.2.1. 以太网接口\n\n如果计算机带有以太网卡，与其关联的 IP 网络必须通过选择两种方法之一进行配置。最简单的方法是使用 `DHCP`\
  \ 进行动态配置，这需要在本地网络有一个 `DHCP` 服务器。它可能会指定所需的主机名，对应下面示例中的 `hostname` 设置。然后 `DHCP` 服务器将发送适当网络的配置设置。\n\
  \n示例 8.1. DHCP 配置\n```\nauto enp0s31f6 iface enp0s31f6 inet dhcp hostname arrakis\n\
  ```\n\n***\n\n### 实践：网络接口的名称\n\n默认情况下，内核为网络接口分配通用名称，例如 `eth0`（用于有线以太网）或 `wlan0`（用于\
  \ WiFi）。这些名称中的数字是一个简单的递增计数器，代表它们被检测到的顺序。对于现代硬件，该顺序在每次重启时可能会发生，因此默认名称是不可的。\n\n幸运的是，`systemd`\
  \ 和 `udev` 能够在接口出现时立即对其重命名。默认命名策略由 `/lib/systemd/network/99-default.link` 定义（参见\
  \ `systemd.link(5)` 以获取该文件中的 `NamePolicy` 条目的解释）。在实践中，名称通常基于设备的物理位置（通过其连接位置推断），你将看到以\
  \ `en` 开头的有线以太网名称和以 `wl` 开头的 WiFi 名称。在上面的示例中，名称的其余部分以简称形式表示 PCI (`p`) 总线号 (`0`)、槽位号\
  \ (`s31`) 和功能号 (`f6`)。\n\n显然，你可以自由地覆盖此策略并/或补充它以自定义某些特定接口的名称。你可以在 `ip addr` 的输出中（或\
  \ `/sys/class/net/` 中的文件名）找到网络接口的名称。\n\n在某些特殊情况下，可能需要禁用上述网络设备的一致命名。除了更改默认的 `udev`\
  \ 规则外，还可以使用 `net.ifnames=0` 和 `biosdevname=0` 内核参数来实现这一点。\n\n***\n\n“静态”配置必须以固定方式指示网络设置。这至少包括\
  \ IP 地址和子网掩码；有时还会列出网络和广播地址。连接到外部的路由器将被指定为网关。\n\n示例 8.2. 静态配置\n```\nauto enp0s31f6\
  \ iface enp0s31f6 inet static address 192.168.0.3/24 broadcast 192.168.0.255 network\
  \ 192.168.0.0 gateway 192.168.0.1\n```\n\n***\n\n### 注意：多个地址\n\n不仅可以将多个接口关联到单个物理网卡，还可以将多个\
  \ IP 地址关联到单个接口。记住，一个 IP 地址可以通过 `DNS` 对应任意数量的名称，名称也可以对应任意数量的 IP 地址。\n\n正如你的，配置可能会复杂，但这些选项仅用于非常特殊的情况。这里引用的示例是典型的\n\
  \n***\n\n## 8.2.2. 无线接口\n\n让无线网卡工作可能更具挑战性。首先，它们通常需要安装专有固件，而 Debian 默认并不安装这些固件。然后，无线网络依赖加密来限制授权用户的访问，这意味着要在网络配置中存储某些密钥。让我们逐一个地处理这些主题。\n\
  \n### 8.2.2.1. 安装所需的固件\n\n首先，你必须在 APT 的 `sources.list` 文件中启用 non-free 存储：有关此文件的详细信息请参见\
  \ 第 6.1 节，“填充 sources.list 文件`。许多固件是专有的，因此位于该存储中。你可以尝试跳过此步，但如果下一步没有找到所需的固件，请在启用\
  \ non-free 部分后重试。\n\n然后，你必须安装适当的 `firmware-*` 软件包。如果你不知道需要哪个包，可以安装 `isenram` 软件包并运行其\
  \ `isenram-autoinstall-firmware` 命令。这些包通常以硬件制造商或相应的内核模块命名：用于 Intel 无线卡的 `firmware-iwlwifi`、用于\
  \ Qualcomm Atheros 的 `firmware-atheros`、用于 Ralink 的 `firmware-ralink` 等。随后建议重启，因为内核驱动程序通常在首次加载时寻找固件文件，之后不再寻找。\n\
  \n### 8.2.2.2. /etc/network/interfaces 中的无线特定条目\n\n`ifupdown` 能够管理无线接口，但它需要 `wpasupplicant`\
  \ 软件包的帮助，该包提供了 `ifupdown` 与用于配置无线接口的 `wpa_supplicant` 命令（使用 WPA/WPA2 加密时）所需的集成。`/etc/network/interfaces`\
  \ 中的常规条目需要扩展两个补充参数以指定无线网络名称（即 SSID）和预共享密钥 (PSK)。\n\n示例 8.3. 无线接口的 DHCP 配置\n```\n\
  auto wlp4s0 iface wlp4s0 inet dhcp wpa-ssid Falcot wpa-psk ccb290fd4fe6b22935cbae31449e050edd02ad44627b116ce0151668f5f53c01b\n\
  ```\n\n\n\n\n\n`wpa-psk` 参数可以包含明文密码，也可以包含通过 `wpa_passphrase \"SSID\" \"passphrase\"\
  ` 生成的哈希版本密码。如果你使用未加密的无线连接，则应该放置 `wpa-key-mgmt NONE` 且不设置 `wpa-psk` 项。关于可能的配置选项的更多信息，请参阅\
  \ `/usr/share/doc/wpasupplicant/README.Debian.gz`。\n\n此时，你应该考虑将 `/etc/network/interfaces`\
  \ 的读取权限限制仅供 root 用户，因为该文件包含并非所有用户都应该访问的私钥。\n\n***\n\n### 历史 WEP 加密\n\n通过 `wireless-tools`\
  \ 包可以使用已弃用的 WEP 加密协议。请参见 `/usr/share/doc/wireless-tools/README.Debian` 获取说明。\n\n\
  ## 8.2.3. 通过 PSTN 调制解调器连接 PPP\n\n点点（PPP）连接建立的是间歇性连接；这是使用调制解调器（“PSTN 调制解调器”，因为连接通过公共交换电话网）进行连接的最常见解决方案。\n\
  \n通过电话调制解调器连接需要一个接入提供商的账户，包括电话号码、用户名、密码，有时还需要使用的身份验证协议。此类连接使用同名 Debian 包中的 `pppconfig`\
  \ 工具进行配置。默认情况下，它设置一个名为 `provider` 的连接（如 Internet 服务提供商所示）。如果不确定身份验证协议，请选择 `PAP`：大多数互联网服务提供商都提供该协议。\n\
  \n配置完成后，可以使用 `pon` 命令进行连接（将连接名称作为参数，当默认值 `provider` 不适用时）。使用 `poff` 命令断开链路。这两个命令可以由\
  \ root 用户执行，也可以由任何处于 `dip` 组的其他用户执行。\n\n## 8.2.4. 通过 ADSL 调制解调器连接\n\n“ADSL 调制解调器”这一通义术语涵盖了许多功能非常不同的设备。在\
  \ Linux 下最易使用的调制解调器是那些具有以太网接口（而不仅仅是 USB 接口）的设备。这些设备很受欢迎；大多数 ADSL 互联网服务提供商都会提供或租赁一个带有以太网接口的“盒子”。根据调制解调器的类型，所需的配置可能差异很大。\n\
  \n### 8.2.4.1. 支持 PPPOE 的调制解调器\n\n某些以太网调制解调器支持 PPPOE 协议（以太网上的点点协议）。使用 `pppoeconf`\
  \ 工具（来自同名包）将配置连接。为此，它会根据提供的设置修改 `/etc/ppp/peers/dsl-provider` 文件，并将登录信息记录在 `/etc/ppp/pap-secrets`\
  \ 和 `/etc/ppp/chap-secrets` 文件中。建议接受它提出的所有修改。\n\n配置完成后，可以使用命令 `pon dsl-provider`\
  \ 打开 ADSL 连接，并使用 `poff dsl-provider` 断开连接。\n\n***\n\n### 提示 启动时启动 `ppp`\n\n根据定义，ADSL\
  \ 上的 PPP 连接是间歇性的。由于它们通常不按时间计费，因此保持它们一直开启并没有坏处。实现此点的标准方法是使用 init 系统。\n\n使用 `systemd`，为\
  \ ADSL 连接添加一个自动重启的任务只需只需创建一个“单元文件”，例如 `/etc/systemd/system/adsl-connection.service`，内容如下：\n\
  \n```\n[Unit] Description=ADSL connection [Service] Type=forking ExecStart=/usr/sbin/pppd\
  \ call dsl-provider Restart=always [Install] WantedBy=multi-user.target\n```\n\n\
  一旦定义了该单元文件，就需要通过 `systemctl enable adsl-connection` 将其启用。然后可以手动启动循环 `systemctl start\
  \ adsl-connection`；它也会在启动时自动启动。\n\n在不使用 `systemd` 的系统上（包括 Debian Wheezy 及之前的版本），标准的\
  \ SystemV init 工作方式不同。在这些系统上，只需要在 `/etc/inittab` 末尾添加如下行；这样每当连接断开时，`init` 都会重新连接它。\n\
  \n```\nadsl:2345:respawn:/usr/sbin/pppd call dsl-provider\n```\n\n对于每天自动断开的 ADSL\
  \ 连接，这种方法缩短了中断持续。\n\n***\n\n### 8.2.4.2. 支持 PPTP 的调制解调器\n\nPPTP（点点隧道协议）是由微软创建的。它在\
  \ ADSL 早期部署，但很快被 PPPOE 取代。如果被强制使用此协议，请参见第 10.3.4 节，“PPTP”。\n\n### 8.2.4.3. 支持 DHCP\
  \ 的调制解调器\n\n当调制解调器通过以太网线（交叉线）连接到计算机时，你通常通过 DHCP 配置网络连接；调制解调器默认自动充网关并处理路由（这意味着它管理计算机与互联网之间的网络流量）。\n\
  \n***\n\n### 回归基础 用于直接以太网连接的交叉线\n\n计算机网卡期望在电缆的特定线芯上接收数据，并在其他线芯上发送数据。当你将计算机连接到本地网络时，通常会在网卡和中继器或交换机之间连接一根线（直通或交叉）。然而，如果你想直接连接两台计算机（没有中间交换机或中继器），你必须将一个卡的发送信号路由到另一个卡的接收端，反之亦然。这就是交叉线的用途及其使用原因。\n\
  \n请注意，随着时间的推移，这种区别几乎变得无关，因为现代网卡能够检测电缆类型并相应进行调整，因此在特定位置两种电缆都能工作并不稀奇。\n\n***\n\n市场上的大多数“ADSL\
  \ 路由器”都可以这样使用，大多数互联网服务提供商提供的 ADSL 调制解调器也是如此。\n\n## 8.2.5. 漫游用户的自动网络配置\n\n许多 Falcot\
  \ 工程师拥有一笔记本电脑，由于工作需要他们也在家里使用。网络配置随位置而异。在家里，可能是 wifi 网络（受 WPA 密钥保护），而工作场所使用有线网络以获得更高的安全性和更大的带宽。\n\
  \n为了避免手动连接或断开相应的网络接口，管理员在这些漫游机器上安装了 `network-manager` 包。该软件使用户可以使用图形桌面通知区域显示的小图标轻松在不同网络之间切换。点击此图标会显示可用网络列表（有线和无线），他们只需选择想要使用的网络。程序会保存用户已连接连接的配置，并在当前连接掉时自动切换到最佳的可用网络。\n\
  \n为了实现这一点，程序分为两个部分：一个作为 root 运行的守护进程处理网络接口的激活和配置，一个用户界面控制该守护进程。`PolicyKit` 处理控制此程序所需的授权，Debian\
  \ 这样配置了 `PolicyKit`：允许 `netdev` 组的成员添加或更改 Network Manager 连接。\n\nNetwork Manager\
  \ 知道如何处理各种类型的连接（DHCP、手动配置、本地网络），但只有当使用程序本身设置配置时如此。这就是为什么它会系统地忽略 `/etc/network/interfaces`\
  \ 和 `/etc/network/interfaces.d/` 中不适合它的网络接口。由于在没有显示网络连接时 Network Manager 不提供详细信息，简单的方法是从\
  \ `/etc/network/interfaces` 中删除所有必须由 Network Manager 管理的接口配置。\n\n\n\n\n\n请注意，在初始安装选择“桌面环境”任务时，默认会安装此程序。\n\
  \n# 8.3. 设置主机名和配置域名服务\n\n为 IP 数字分配名称的目的是让人们更容易记忆。现实中，IP 地址标识与网卡等设备关联的网络接口。由于每台机器可以有多张网卡，且每张网卡上有多个接口，因此一台计算机在域名系统中可能有多个名称。\n\
  \n然而，每台机器通过一个主名称（或“规范”名称来标识，该名称存储在 `/etc/hostname` 文件中，并通过初始化脚本通过 `hostname` 命令传递给\
  \ Linux 内核。当前值可以在虚拟文件系统中，你可以通过 `cat /proc/sys/kernel/hostname` 命令获取。\n\n* * *\n\n\
  返回基础 `/proc/` 和 `/sys/`，虚拟文件系统\n\n`/proc/` 和 `/sys/` 目录树是由“虚拟”文件系统生成的。这是一种从内核恢复信息（通过列出虚拟文件）并向内核通信信息（通过写入虚拟文件）的实用手段。\n\
  \n`/sys/` 特别设计用于提供对内核对象的访问，特别是代表系统中各种设备的对象。因此，内核可以共享各种信息：每个设备的状态（例如，它是否处于节能模式）、它是否为可热拔设备等。注意\
  \ `/sys/` 仅从内核 2.6 版本开始存在。`/proc/` 描述内核的当前状态：此目录下的文件包含有关运行在系统上的进程及其硬件的信息。\n\n* *\
  \ *\n\n惊讶的是，域名并不是以相同的方式管理的，而是通过名称解析获取的机器完整名称。你可以在 `/etc/hosts` 文件中更改它；只需在与机器地址关联的名称列表开头为该机器写入一个完整名称即可，如下例：\n\
  \n```\n127.0.0.1 localhost 192.168.0.1 arrakis.falcot.com arrakis\n```\n\n## 8.3.1.\
  \ 域名解析\n\nLinux 中的名称解析机制是模块化的，可以使用 `/etc/nsswitch.conf` 文件中声明的各种信息源。涉及主机解析的条目是 `hosts`。默认情况下，它包含\
  \ `files dns`，这意味着系统首先查询 `/etc/hosts` 文件，然后是 DNS 服务器。NIS/NIS+ 或 LDAP 服务器是其他可能的来源。\n\
  \n* * *\n\n注意 NSS 和 DNS\n\n请注意，专门用于查询 DNS 的命令（尤其是 `host`）并不使用标准的名称解析机制（NSS）。因此，它们不会考虑\
  \ `/etc/nsswitch.conf`，也不会考虑 `/etc/hosts`。\n\n* * *\n\n### 8.3.1.1. 配置 DNS 服务器\n\
  \nDNS（域名服务）是一种分布式且层次化的服务，用于将名称映射到 IP 地址，反之亦然。具体来说，它可以将如 `www.eyrolles.com` 这样人类友好的名称转换为实际\
  \ IP 地址 `213.244.11.247`。\n\n要访问 DNS 信息，必须有一个可用的 DNS 服务器转发请求。Falcot Corp 有自己的服务器，但个人用户更有可能使用其\
  \ ISP 提供的 DNS 服务器。\n\n使用的 DNS 服务器在 `/etc/resolv.conf` 中指定，每行一个，在 IP 地址之前有 `nameserver`\
  \ 关键字，如下例：\n\n```\nnameserver 212.27.32.176 nameserver 212.27.32.177 nameserver\
  \ 8.8.8.8\n```\n\n注意，当网络由 NetworkManager 管理或通过 DHCP 配置时，`/etc/resolv.conf` 文件可能会被自动处理（覆盖）。\n\
  \n### 8.3.1.2. `/etc/hosts` 文件\n\n如果本地网络没有名称服务器，可以在 `/etc/hosts` 文件中建立一个映射 IP 地址和机器主机名的小表，通常留给本地网络站。根据\
  \ `hosts(5)` 的，该文件的语法非常简单：每行表示一个特定的 IP 地址，随后是任何关联名称的列表（第一个是“完全限定的”，意味着它包含域名）。\n\n\
  即使在网络中断或 DNS 服务器不可用时，该文件也可用，但只有当在网络上的所有机器上都复制时它才会真正有用。对应关系的任何微小变化都需要在各处更新文件。这就是为什么\
  \ `/etc/hosts` 通常只包含最重要的条目。\n\n此文件对于未连接互联网的小型网络足够，但如果有 5 台或更多机器，建议安装适当的 DNS 服务器。\n\
  \n* * *\n\n提示 绕过 DNS\n\n由于应用程序在查询 DNS 之前会检查 `/etc/hosts` 文件，因此可以在其中包含与 DNS 返回内容不同的信息，从而绕过基于\
  \ DNS 的正常名称解析。\n\n这允许在 DNS 更改尚未传播的情况下，即使该名称尚未正确映射到正确的 IP 地址，也可以测试对预定名称网站的访问。\n\n\
  另一个可能的用途是将指向特定主机的流量重定向到本地主机（localhost），从而防止与给定主机进行任何通信。例如，可以重定向专门投放广告的服务器主机，从而绕过这些广告，获得更流畅、少分心的导航。\n\
  \n* * *\n\n# 8.4. 用户和组数据库\n\n用户列表通常存储在 `/etc/passwd` 文件中，而 `/etc/shadow` 文件存储哈希密码。两者都是文本文件，格式相对简单，可以使用文本编辑器读取和修改。每个用户列在其中，每行有多个用冒号（`:`）分隔的字段。\n\
  \n* * *\n\n注意 编辑系统文件\n\n本章提到的系统文件均为纯文本文件，可以使用文本编辑器编辑。考虑到它们对核心系统功能的重要性，在编辑系统文件时，采取额外措施始终是一个好主意。首先，在打开或更改系统文件之前，始终对系统文件进行复制或备份。其次，在可能有多人访问同一文件的服务器或机器上，采取额外步骤以防止文件损坏。\n\
  \n出于此目的，只需使用 `vipw` 命令编辑 `/etc/passwd` 文件，或使用 `vigr` 编辑 `/etc/group`。这些命令会在运行文本编辑器之前锁定相关文件（默认使用\
  \ `vi`，除非修改了 `EDITOR` 环境变量）。`-s` 选项允许编辑影子文件。\n\n* * *\n\n* *\n\n返回基础 Crypt，单向函数\n\
  \n`crypt` 是一种单向函数，将字符串（`A`）转换为另一个字符串（`B`），且无法从 `B` 推导出 `A`。识别 `A` 的唯一方法是测试所有可能的值，检查每个值以确定转换是否会产生\
  \ `B`。它使用最多 8 个字符作为输入（字符串 `A`），并生成 13 个可打印 ASCII 字符（字符串 `B`）。\n\n* * *\n\n## 8.4.1.\
  \ 用户列表：`/etc/passwd`\n\n以下是 `/etc/passwd` 文件的字段列表：\n\n- 登录名，例如 `rhertzog`；\n- 密码：通过单向函数（`crypt`）加密的密码，依赖于\
  \ `DES`、`MD5`、`SHA-256` 或 `SHA-512`。特殊值 `x` 表示加密密码存储在 `/etc/shadow` 中；\n- `uid`：标识用户的唯一数字；\n\
  - `gid`：用户主组的唯一数字（Debian 默认为每个用户创建一个特定组）；\n- `GECOS`：通常包含用户全名的数据字段；\n- 登录目录，分配给用户用于存储个人文件（环境变量\
  \ `$HOME` 通常指向此处）；\n\n\n\n\n\n- 登录时执行的程序。这通常是一个命令解释器（shell），赋予用户自由的操作权限。如果你指定 `/bin/false`（该程序不执行任何操作并立即返回控制权），用户将无法登录。\n\
  \n## 返回基础：Unix 组 (group)\n\nUnix 组是一个包含多个用户的实体，以便他们可以使用集成权限系统轻松地共享文件（通过从相同的权限中受益）。你也可以限制特定程序仅供特定组使用。\n\
  \n## 8.4.2. 的加密密码文件：`/etc/shadow`\n\n`/etc/shadow` 文件包含以下字段：\n\n- `login;`\n- `encrypted\
  \ password;`\n- 几个管理密码过期的字段。\n\n### 文档说明：`/etc/passwd`, `/etc/shadow` 和 `/etc/group`\
  \ 文件格式\n\n这些格式记录在以下 man 页（帮助文档）中：`passwd(5)`、`shadow(5)` 和 `group(5)`。\n\n### 安全：`/etc/shadow`\
  \ 文件安全\n\n`/etc/shadow` 与它的孪生兄弟 `/etc/passwd` 不同，普通用户无法读取。存储在 `/etc/passwd` 中的任何哈希密码对任何人都是的；破解者可以尝试通过几种“暴力破解”方法之一来“破解”（或揭露）密码，简单来说，就是猜测常用的字符组合。这种被称为“字典攻击”的攻击手段在在使用\
  \ `/etc/shadow` 的系统上已不再可能。\n\n## 8.4.3. 修改现有账户或密码\n\n以下命令允许修改用户数据库中特定字段所存储的信息：`passwd`\
  \ 允许普通用户更改自己的密码，这会更新 `/etc/shadow` 文件；`chfn`（CHange Full Name，更改全名）为超级用户（root）保留，用于修改\
  \ `GECOS` 字段。`chsh`（CHange SHell，更改 shell）允许用户更改其登录 shell；然而，可选范围将限于 `/etc/shells`\
  \ 中列出的内容；另一方面，管理员不受此限制，可以将 shell 设置为他们选择的任何程序。\n\n最后，`chage`（CHange AGE，更改有效期）命令允许管理员更改密码过期设置（`-l`\
  \ `user` 选项将列出当前设置）。你还可以使用 `passwd -e user` 命令强制密码过期，这将要求用户在下次登录时更改密码。\n\n## 8.4.4.\
  \ 禁用账户\n\n你可能会发现自己需要“禁用账户”（锁定用户），作为纪律措施、调查目的，或者仅仅在用户长时间或永久缺席的情况下。禁用的账户意味着用户无法登录或访问机器。账户在机器上保持完好，不会删除任何文件或数据；只是无法访问。这是通过使用命令\
  \ `passwd -l user`（lock）实现的。重新启用账户以类似的方式完成，使用 `-u` 选项（unlock）。\n\n### 进阶：NSS 和系统数据库\n\
  \n与其使用通常的文件来管理用户和组列表，你可以通过适当的 NSS（名称服务切换）模块使用其他类型的数据库，例如 LDAP 或 `db`。使用的模块列在 `/etc/nsswitch.conf`\
  \ 文件的 `passwd`、`shadow` 和 `group` 条目下。关于 LDAP 使用 NSS 模块的具体示例，请参见第 11.7.3.1 节“配置\
  \ NSS”。\n\n## 8.4.5. 组列表：`/etc/group`\n\n组列在 `/etc/group`文件中，这是一个简单的文本数据库，格式与 `/etc/passwd`\
  \ 文件类似，包含以下字段：\n\n- `group name;`\n- `password`（可选）：仅当用户不是该组的普通成员时用于加入组（使用 `newgrp`\
  \ 或 `sg` 命令，请参见侧边栏 返回基础：处理多个组）；\n- `gid`：唯一组标识符；\n- 成员列表：该组成员的用户名称列表，用逗号分隔。\n\n\
  ### 返回基础：处理多个组\n\n每个用户可以是许多组的成员；其中一个是他们的“主组”（main group）。用户的主组默认在初始用户配置期间创建。默认情况下，用户创建的每个文件都属于他们，同时也属于他们的主组。这并不总是如所意的；例如，当用户需要在一个由主组之外的组共享的目录下工作时。在这种情况下，用户需要使用以下命令之一更改其主组：`newgrp`（启动一个新\
  \ shell）或 `sg`（仅用于使用提供的备用组执行命令）。这些命令还允许用户加入他们不所属的组。如果该组受密码保护，他们需要在执行命令前提供适当的密码。\n\
  \n或者，用户可以在目录上设置 `setgid` 位，这会导致在该目录中创建的文件自动属于正确的组。更多详细信息，请参见侧边栏 安全 `setgid` 目录和粘位。\n\
  \n`id` 命令显示用户的当前状态，包括他们的个人标识符（`uid` 变量）、当前主组（`gid` 变量）以及他们所属的组列表（`groups` 变量）。\n\
  \n`addgroup` 和 `delgroup` 命令分别添加或删除组。`groupmod` 命令修改组的信息（其 `gid` 或标识符）。`gpasswd\
  \ group` 命令更改组密码，而 `gpasswd -r group` 命令则删除密码。\n\n### 提示：getent\n\n`getent`（get\
  \ entries）命令通过标准方式检查系统数据库，使用相应的库函数，这些函数转而 `/etc/nsswitch.conf` 配置的 NSS 模块。该命令接受或两个参数：要检查的数据库以及可能的搜索键。因此，命令\
  \ `getent passwd rhertzog` 将从用户数据库获取关于 `rhertzog` 的信息。\n\n## 8.5. 创建账户\n\n管理员设置新机器时需要的操作之一是创建用户账户。这通常使用\
  \ `adduser` 命令完成，该命令接受要创建的用户名作为参数。\n\n`adduser` 命令在创建账户前会询问几个问题，但其用法非常直观。它的配置文件\
  \ `/etc/adduser.conf` 包含了所有有趣的设置：它可以通过创建用户模板自动为每个新用户设置配额，或者更改用户账户的位置；后者很少用，但当你有大量用户并希望将账户划分到多个磁盘上时非常有用。你还可以选择不同的默认\
  \ shell。\n\n### 返回基础：配额 (Quota)\n\n“配额”一词指的是允许用户使用的机器资源限制。这通常指的是磁盘空间。\n\n### 返回基础：设备访问权限\n\
  \n创建账户会使用 `/etc/skel/` 模板填充用户的主目录。这为用户提供了一组标准的目录和配置文件。\n\n在某些情况下，将用户添加到组（除其默认“主”组之外）是有用的，以便授予额外的权限。例如，属于音频组的用户可以访问音频设备（参见侧边栏\
  \ 返回基础 设备访问权限）。可以通过可以通过 `adduser user group` 命令实现。\n\n\n\n\n在 Unix 中，每个硬件外设备都用一个特殊文件表示，这些文件通常存储在文件树的\
  \ `/dev/`（DEVices）目录下。根据设备的性质，存在两种特殊文件：“字符模式”文件和“块模式”文件，每种模式仅允许有限数量的操作。字符模式将交互限制在读/写操作上，而块模式还允许在可用数据内进行寻道（seeking）。最后，每个特殊文件都关联有两个数字（“主设备号”和“次设备号”），以独特的方式向内核标识设备。这种通过\
  \ `mknod` 命令创建的文件仅包含一个符号性的（且更符合人类习惯的）名称。\n\n特殊文件的权限映射到访问设备本身所需的权限。因此，像 `/dev/mixer`\
  \ 这种代表音频混器的文件，仅对 `root` 用户和 `audio` 组的成员具有读/写权限。只有这些用户才能操作音频混器。\n\n需要注意的是，`udev`\
  \ 和 `policykit` 的组合可以添加额外的权限，允许物理连接到控制台（而非通过网络）的用户访问某些设备。\n\n***\n\n# 8.6 Shell\
  \ 环境\n\n命令解释器（或称为 shell）可以是用户与计算机的第一个接触点，因此它们必须相当友好。大多数 shell 使用初始化脚本来允许配置其行为（自动补全、提示符文本等等）。\n\
  \n`bash` 是标准 shell，对于“交互式” shell 使用 `/etc/bash.bashrc` 初始化脚本，对于“登录式” shell 使用 `/etc/profile`。\n\
  \n***\n\n### 回到基础 登录 shell 和（非）交互式 shell\n\n简单来说，当你通过本地或通过 `ssh` 远程登录到控制台，或者运行显式的\
  \ `bash --login` 命令时，就会调用登录 shell。无论是否为登录 shell，shell 都可以是交互式的（例如在 `xterm` 类型的终端中）；或者也可以是非交互式的（当在执行脚本时）。\n\
  \n***\n\n### 探索 其它 shell，其他脚本\n\n每个命令解释器都有特定的语法和它自己的配置文件。因此，`zsh` 使用 `/etc/zshrc`\
  \ 和 `/etc/zshenv`；`tcsh` 使用 `/etc/csh.cshrc`、`/etc/csh.login` 和 `/etc/csh.logout`。这些程序的帮助页（man\
  \ pages）记录了它们使用的哪些文件。\n\n***\n\n对于 `bash`，在 `/etc/bash.bashrc` 文件中激活“自动补全”（只需取消几行的注释）是非常有用的。\n\
  \n***\n\n### 回到基础 自动补全\n\n许多命令解释器提供补全功能，允许 shell 在用户按下 `Tab` 键时自动补全部分输入的命令名或参数。这让用户工作得更高效且更不容易出错。\n\
  \n此功能非常强大且灵活。可以根据每个命令配置其行为。因此，在 `apt` 之后的第一个参数将根据该命令的语法被建议，即使它不匹配任何文件（在这种情况下，可能的选项有\
  \ `install`、`remove`、`upgrade` 等）。\n\n`bash-completion` 软件包包含了大多数常用程序的补全。\n\n***\n\
  \n### 回到基础 波浪号，通往 HOME 的快捷方式\n\n波浪号 `~` 通常指示环境变量 `HOME` 所指向的目录（即用户的家目录，例如 `/home/rhertzog/`）。命令解释器会自动进行替换：`~/hello.txt`\
  \ 变为 `/home/rhertzog/hello.txt`。\n\n波浪号还允许访问另一个用户的家目录。因此，`~rmas/bonjour.txt` 等同于\
  \ `/home/rmas/bonjour.txt`。\n\n***\n\n除了这些常用脚本外，每个用户都可以创建自己的 `~/.bashrc` 和 `~/.bash_profile`\
  \ 来配置他们的 shell。常见的更改是添加别名（aliases）；这些单词会被自动替换为命令的执行，使得调用该命令变得更快。例如，你可以为命令 `ls -la\
  \ | less` 创建一个 `la` 别名；然后你只需要输入 `la` 就可以详细检查目录的内容。\n\n***\n\n### 回到基础 环境变量\n\n环境变量允许存储\
  \ shell 或调用的各种其他程序的全局设置。它们是上下文相关的（每个进程都有自己的环境变量），但是是可继承的。后者的这一特性使得登录 shell 有可能声明变量，这些变量将传递给它执行的所有程序。\n\
  \n设置默认环境变量是 shell 配置的一个重要元素。撇开 shell 特有的变量，，最好将它们放在 `/etc/environment` 文件中，因为该文件会被可能启动\
  \ shell 会话的各种程序使用。通常在那里定义的变量包括 `ORGANIZATION`（通常包含公司或组织的名称）和 `HTTP_PROXY`（指示 HTTP\
  \ 代理的存在和位置）。\n\n***\n\n### 提示 所有 shell 配置完全相同\n\n用户通常希望以相同的方式配置他们的登录和交互式 shell。为了实现这一点，他们选择\
  \ `~/.bash_profile` 文件中解释（或“引入”）`~/.bashrc` 的内容。对于所有用户共同的文件也可以这样做（通过从 `/etc/profile`\
  \ 调用 `/etc/bash.bashrc`）。\n\n***\n\n# 8.7 打印机配置\n\n打印机配置曾给管理员和用户带来许多头疼。多亏了 CUPS（使用\
  \ IPP 互联网打印协议的免费打印服务器），这些头疼的问题现在大多成为过去。\n\nDebian 将 CUPS 分发在几个软件包中。系统的核心是调度器 `cupsd`，它位于\
  \ `cups-daemon` 软件包中。`cups-client` 包含了与服务器 `cupsd` 交互的实用程序。`lpadmin` 可能是最重要的工具，因为它对于设置打印机关重要，但也有禁用或启用打印队列、查看或删除打印作业以及显示打印机选项的功能。CUPS\
  \ 框架基于 System V 打印系统，但有一个兼容包 `cups-bsd`，允许使用传统 BSD 打印系统的 `lpr`、`lpq` 和 `lprm` 等命令。\n\
  \n***\n\n### 社区 CUPS\n\nCUPS 是由 Apple, Inc. 拥有并管理的项目和商标。在被 Apple 收之前，它被称为 Common\
  \ Unix Printing System（通用 Unix 打印系统）。\n\n[`www.cups.org/`](https://www.cups.org/)\n\
  \n***\n\n调度器管理打印作业，这些作业通过过滤系统产生打印机能够理解并打印的文件。过滤系统由 `cups-filters` ([`salsa.debian.org/printing-team/cups-filters`](https://salsa.debian.org/printing-team/cups-filters))\
  \ 软件包结合 `printer-driver-*` 软件包提供。CUPS 结合 `cups-filters` 和 `printer-driver-*` 是 Debian\
  \ 打印系统的基础。\n\n过去十年制造销售的现代打印机几乎都支持 AirPrint，Deb Debian 上的 CUPS 和 `cups-filters` 包含了在网络上利用此功能所需的一切。本质上，这些打印机是\
  \ IPP 打印机，非常适合无驱动打印系统，将系统简化为 CUPS 加上 `cups-filters`。`printer-driver` 软件包可以省去，不再需要来自\
  \ Canon 和 Brother 等供应商的非自由打印软件。连接 USB 的打印机可以通过 `ippusbxd` 软件包利用现代打印机功能。\n\n命令 `apt\
  \ install cups` 将安装 CUPS 和 `cups-filters`。它还会安装推荐的 `printer-driver-gutenprint` 为各种打印机提供驱动程序，但除非打印机是以无驱动方式运行，否则对于特定设备可能需要另一种\
  \ `printer-driver`。\n\n\n\n作为 `cups-daemon` 推荐的包，`cups-browsed` 将存在于系统中和网络打印队列中，现代打印机可以通过它们的\
  \ DNS-SD 广播（Bonjour）被自动发现并设置。USB 打印机则需要按照下一节所述进行手动设置。\n\n打印系统可以通过本地地址 `http://localhost:631/`\
  \ 访问的 Web 界面进行管理。在那里，你可以添加和删除 USB 及网络打印机，并管理它们行为的大多数方面。类似的管理任务也可以通过桌面环境提供的图形界面或\
  \ `system-config-printer` 图形界面（来自同名的 Debian 包）完成。\n\n# 8.8. 配置引导加载程序\n\n引导程序可能已经可以工作，但了解如何配置和安装引导加载程序总是好的，以防它从主引导记录（Master\
  \ Boot Record）中消失。这在安装了另一个操作系统（如 Windows）之后可能会发生。以下信息也可以帮助你在需要时修改引导程序的配置。\n\n###\
  \ 基础知识 主引导记录\n\n主引导记录（`MBR`）占据第一块硬盘的前 512 字节，是 BIOS 加载的第一个内容，用于将控制权交给能够引导目标操作系统的程序。通常情况下，引导加载程序安装在\
  \ MBR 中，并移除其原有内容。\n\n## 8.8.1. 识别磁盘\n\n### 文化 `udev` 与 `/dev/`\n\n`/dev/` 目录传统上存放所谓的“特殊”文件，用于表示系统外设（参见侧边栏\
  \ *基础知识 设备访问权限]）。曾经，它包含所有可能被使用的特殊文件。这种方法有许多缺点，其中包括限制了用户可以使用设备数量（由于硬编码的名称列表），并且无法知道哪些特殊文件是有用的。\n\
  \n如今，特殊文件的管理完全是动态的，并且更符合热插拔计算机设备的特性。内核与 `udev` (第 9.11.3 节，“udev 如何工作”) 协作，在相应的设备出现和消失时根据需要创建和删除它们。因此，`/dev/`\
  \ 不需要是持久的，它是一个基于 RAM 的文件系统，启动时为空，仅包含相关的条目。\n\n内核会通信有关任何新添加设备的量信息，并分配一对主设备/次设备号来标识它。通过\
  \ `udevd` 可以在所需的名称和权限下创建特殊文件。它还可以创建别名并执行附加操作（如初始化或注册任务）。`udevd` 的行为由一组大量的（可自定义的）规则驱动。\n\
  \n通过动态分配的名称，无论使用何种连接器或连接顺序，你都可以为特定设备保持相同的名称，这在你使用各种 USB 外设时特别有用。第一块硬盘上的第一个分区可以被命名为\
  \ `/dev/sda1` 以保持向后兼容，或者根据喜好命名为 `/dev/root-partition`，甚至同时使用两者，因为 `udevd` 可以配置为自动创建符号链接。\n\
  \n在古代，当你尝试访问相应的设备文件时，某些内核模块会自动加载。现在不再是这样，而且在加载模块之前，外设的特殊文件已不再存在；这并不是大问题，因为得益自动硬件检测，大多数模块在启动时就已经加载了。但对于不可检测的外设（例如非常旧的磁盘驱动器或\
  \ PS/2 鼠标），这种方法并不行。考虑将 `floppy`、`psmouse` 和 `mousedev` 模块添加到 `/etc/modules` 中强制在启动时加载它们。\n\
  \n引导程序的配置必须识别不同的硬盘及其分区。Linux 使用存储在 `/dev/` 目录中的“块”特殊文件来实现此。从 Debian Squeeze 开始，硬盘的命名方案已由\
  \ Linux 内核统一，所有硬盘（IDE/PATA、SATA、SCSI、USB、IEEE 1394）现在都由 `/dev/sd*` 表示。\n\n每个分区由其所在磁盘上的编号表示：例如\
  \ `/dev/sda1` 是第一块硬盘上的第一个分区，`/dev/sdb3` 是第二块硬盘上的第三个分区。\n\nPC 架构（或“i386”，包括其较年轻的“amd64”）长期以来限制为使用“MS-DOS”分区表格式，该格式每个磁盘仅允许四个“主”分区。要在该方案下突破这一限制，必须其中一个创建一个“扩展”分区，它可以包含额外的“逻辑”分区。这些逻辑分区从\
  \ 5 开始编号。因此，第一个逻辑分区可以是 `/dev/sda5`，随后是 `/dev/sda6` 等。\n\nMS-DOS 分区表格式的另一个限制是它仅允许磁盘大小达到\
  \ 2 TiB，这在最近的磁盘中成为一个现实问题。\n\n一种名为 GPT 的新分区表格式放宽了分区数量的限制（使用标准设置时允许最多 128 个分区）以及磁盘大小的限制（高达\
  \ 8 ZiB，超过 80 亿个字节）。如果你打算在同一块磁盘上创建许多物理分区，那么你应该确保你正在创建 GPT 格式的分区表。\n\n\n\n\n请注意，某些磁盘列出了多次（因为它们同时作为\
  \ ATA 磁盘和 SCSI 磁盘运行），但相关信息主要在磁盘的型号和序列号中，你可以从中找到外设文件。\n\n后续章节给出的示例配置文件基于相同的设置：单个\
  \ SATA 磁盘，其中第一个分区是旧的 Windows 安装，第二个分区包含 Debian GNU/Linux。\n\n## 8.8.2. 配置 LILO\n\
  \n`LILO` (LInux LOader) 是最老的引导加载程序——坚固但古老。它将用于引导的内核物理地址写入 MBR（主引导记录），这就是为什么每次更新\
  \ LILO（或其配置文件）后，都必须执行 `lilo` 命令。如果忘记执行此命令，且旧内核已被删除或替换，系统将无法启动，因为新内核将位于磁盘上的相同位置。\n\
  \nLILO 的配置文件是 `/etc/lilo.conf`；下面的示例显示了一个用于标准配置简单文件。\n\n示例 8.4. LILO 配置文件\n```\n\
  # 应该安装 LILO 的磁盘。\n# 指明的是磁盘而不是分区。\n# 你命令 LILO 安装在 MBR 上。\nboot=/dev/sda\n# 包含 Debian\
  \ 的分区\nroot=/dev/sda2\n# 默认加载的项\ndefault=Linux\n# 最新的内核镜像\nimage=/vmlinuz label=Linux\
  \ initrd=/initrd.img read-only\n# 旧内核（如果新安装的内核无法启动）\nimage=/vmlinuz.old label=LinuxOLD\
  \ initrd=/initrd.img.old read-only optional\n# 仅用于 Linux/Windows 双系统\nother=/dev/sda1\
  \ label=Windows\n```\n\n## 8.8.3. GRUB 2 配置\n\n`GRUB` (GRand Unified Bootloader)\
  \ 较新。在每次更新内核后不需要调用它；`GRUB` 知道如何读取文件系统并找到内核在磁盘上的位置。要将其安装在第一块磁盘的 MBR 上，只需输入 `grub-install\
  \ /dev/sda`。\n\n### 注意 GRUB 的磁盘名称\n\nGRUB 只能根据 BIOS 提供的信息来识别硬盘。`(hd0)` 对应检测到的第一块磁盘，`(hd1)`\
  \ 是第二个，以此此类推。在大多数情况下，这个顺序与 Linux 下磁盘的通常顺序完全对应，但在关联 SCSI 和 IDE 磁盘时可能会出现问题。GRUB 过去将其检测到的对应关系存储在\
  \ `/boot/grub/device.map` 文件中，现在 GRUB 通过在生成 `grub.cfg` 时使用 UUID 或文件系统标签来避免这个问题。然而，设备映射文件尚未过时，因为当当前环境与启动时的环境不同时，可以使用它进行覆盖。如果你发现那里有错误（因为你知道\
  \ BIOS 检测驱动器的顺序不同），请手动修正它们并重新运行 `grub-install`。`grub-mkdevicemap` 可以帮助创建一个起始的 `device.map`\
  \ 文件。\n\n分区在 GRUB 中也有特定的名称。当你使用 MS-DOS 格式的“经典”分区时，第一块磁盘上的第一个分区被标记为 `(hd0,msdos1)`，第二个为\
  \ `(hd0,msdos2)`，以此此类推。\n\nGRUB 2 配置存储在 `/boot/grub/grub.cfg` 中，但该文件（在 Debian 中）是从其他文件生成的。不要手动修改它，因为这些本地修改在下次运行\
  \ `update-grub` 时（可能会在更新各种软件包时发生）将会丢失。对 `/boot/grub/grub.cfg` 文件最常见的修改（例如为内核添加命令行参数或更改菜单显示时长）是通过\
  \ `/etc/default/grub` 中的变量完成的。要向菜单添加条目，你可以创建一个 `/boot/grub/custom.cfg` 文件，或者修改 `/etc/grub.d/40_custom`\
  \ 文件。对于更复杂的配置，你可以修改 `/etc/grub.d` 中的其他文件或向它们添加；这些脚本应该返回配置片段，可能通过使用外部程序来实现。这些脚本将更新引导内核列表：`10_linux`\
  \ 考虑已安装的 Linux 内核；`20_linux_xen` 考虑 Xen 虚拟系统，而 `30_os-prober` 列出了其他操作系统（Windows,\
  \ OS X, Hurd）。\n\n## 8.9. 其他配置：时间同步、日志、共享访问……\n\n本节列出的许多元素对于任何想要精通 GNU/Linux 系统配置各个方面的人来说都有用。然而，它们处理得较为简略，并且经常引用文档。\n\
  \n## 8.9.1. 时区\n\n### 基础知识：符号链接\n\n符号链接是指向另一个文件的指针。当你访问它时，它指向的文件会被打开。删除链接不会导致其所指向的文件被删除。同样，它没有自己的一套权限，而是保留其目标的权限。最后，它可以指向任何类型的文件：目录、特殊文件（套接字、命名、设备文件等），甚至是其他符号链接。\n\
  \n`ln -s target link-name` 命令创建一个名为 `link-name` 的符号链接，指向 `target`。\n\n如果目标不存在，则链接是“断开”的，访问它将导致指示目标文件不存在的错误。如果链接指向另一个链接，你将拥有一个链接“链”，如果其中一个目标指向它的前驱，这个链就会变成一个“循环”。在这种情况下，访问循环中的一个链接将导致特定的错误（“符号链接层过多”）；这意味着内核在经过几轮循环后放弃了。\n\
  \n在初始安装期间配置的时区是 `tzdata` 包的一个配置项。要修改它，请使用 `dpkg-reconfigure tzdata` 命令，它允许你以交互方式选择要使用的时区。它的配置存储在\
  \ `/etc/timezone` 文件中。此外，`/usr/share/zoneinfo` 目录中的对应文件会被复制到 `/etc/localtime`；此文件包含了对于使用夏令时的国家管理夏令时日期的规则。\n\
  \n当你需要临时更改时区时，使用 `TZ` 环境变量，它的优先级高于配置的系统默认值：\n\n```\n$ date Thu Feb 19 11:25:18 CET\
  \ 2015\n$ TZ=\"Pacific/Honolulu\" date Thu Feb 19 00:25:21 HST 2015\n```\n\n###\
  \ 注意 系统钟、硬件钟\n\n计算机中有两个时间源。计算机主板上有一个硬件钟，被称为“CMOS 钟”。这个时钟并不精确，且访问速度较慢。操作系统内核有自己的，即系统钟，它通过自己的方式保持更新（可能借助时间服务器，请参见第\
  \ 8.9.2 节，“时间同步”](#ch08s09.html_sect.time-synchronization \"8.9.2. Time Synchronization\"\
  ))）。这个系统钟通常更准确，因为它不需要访问硬件变量。然而，由于它只存在于实时内存中，因此每次启动机器时都会被清零，这与带有电池、因此能“存活”重启或关机的\
  \ CMOS 钟相反。因此，系统钟在启动时从 CMOS 钟设置，并在关机时更新 CMOS 钟（以考虑到在调整不当时可能发生的更改或修正）。\n\n\n\n\n\
  在实践中，存在一个问题，因为 CMOS 时钟仅仅是一个计数器，并不包含任何关于时区的信息。对于它的解释，有一个选择：系统要么认为它在通用世界时间（UTC，以前称为\
  \ GMT）运行，要么认为在本地时间运行。这种选择可能是一个简单的偏移，但实际上情况要复杂得多：由于夏令时的影响，这种偏移并不是固定的。结果是系统无法判断偏移是否正确，特别是在时间切换期间。由于始终可以从通用世界时间和时区信息中重构本地时间，因此我们强烈建议使用通用世界时间下的\
  \ CMOS 时钟。\n\n遗憾的是，Windows 系统的默认配置忽略了这一建议；它们将 CMOS 时钟保持为本地时间，并在计算机启动时通过尝试在时间切换期间猜测更改是否已经应用来应用时间更改。只要系统上只运行\
  \ Windows，这种方法就运行得尚算良好。但当一台计算机上有多个系统时（无论是采用“双启动”配置还是通过虚拟机运行其他系统），就会陷入混乱，没有手段可以判断时间是否正确。如果你必须在计算机上保留\
  \ Windows，你应该配置其使其将 CMOS 时钟保持为 UTC（将注册表键 `HKLM\\SYSTEM\\CurrentControlSet\\Control\\\
  TimeZoneInformation\\RealTimeIsUniversal` 设置为 DWORD“1”），或者在 Debian 系统上使用 `hwclock\
  \ --localtime --set` 设置硬件时钟并标记其跟踪本地时间（并确保在春、秋季手动检查时钟）。\n\n## 8.9.2. 时间同步\n\n时间同步在计算机上似乎是多余的，但在网络上非常重要。由于用户没有修改日期和时间的权限，这些信息的准确性对于防止混淆至关重要。此外，让网络上的所有计算机保持同步，可以对不同机器日志中的信息进行更好的交叉引用。因此，在发生攻击时，更容易重建受攻击的各个机器上操作的时间顺序。如果为了统计目的在几台机器上收集的数据没有同步，那么它们将没有太大意义。\n\
  \n### 回归基础 NTP\n\nNTP（网络时间协议）允许机器与其他机器进行相当准确的同步，并考虑了由信息在网络上传输引起的延迟和其他可能的偏移。\n\n\
  虽然互联网上有许多 NTP 服务器，但较受欢迎的服务器可能会过载。这就是为什么我们推荐使用 `pool.ntp.org` NTP 服务器，它实际上是一组同意作为公共\
  \ NTP 服务器的机器。你甚至可以将使用限制在特定国家的子组，例如用于美国的 `us.pool.ntp.org` 或用于加拿大的 `ca.pool.ntp.org`\
  \ 等。\n\n然而，如果你管理着大型网络，建议安装你自己的 NTP 服务器，它将与公共服务器同步。在这种情况下，你网络上的所有其他机器都可以你的内部 NTP\
  \ 服务器，而不是增加公共服务器的负载。你还将增加时钟的一致性，因为所有机器都将与同一个源同步，而该源在网络传输时间上非常接近。\n\n### 8.9.2.1.\
  \ 针对工作站\n\n由于工作站经常重启（即使是为了节能），在启动时通过 NTP 对它们进行同步就足够了。要做到这一点，只需安装 `ntpdate` 软件包即可。如果需要，你可以通过修改\
  \ `/etc/default/ntpdate` 文件来更改使用的 NTP 服务器。\n\n### 8.9.2.2. 针对服务器\n\n服务器很少重启，它们的系统时间准确性非常重要。为了永久保持正确的时间，你应该安装本地\
  \ NTP 服务器，这是 `ntp` 软件包提供的一服务。在默认配置下，该服务器将与 `pool.ntp.org` 同步，并响应来自本地网络的请求提供时间。你可以通过编辑\
  \ `/etc/ntp.conf` 文件对其进行配置，最显著的更改是它所引用的 NTP 服务器。如果网络有很多服务器，拥有一个本地时间服务器可能会很有趣，它与公共服务器同步，并作为网络中其他服务器的时间源。\n\
  \n### 进阶使用：GPS 模块和其他时间源\n\n如果时间同步对你的网络特别关键，可以为服务器配备 GPS 模块（它将使用来自 GPS 卫星的时间）或 DCF-77\
  \ 模块（这将与德国法兰克福附近的原子钟同步时间）。在这种情况下，NTP 服务器的配置会复杂一些，预先查阅文档是绝对必要的。\n\n## 8.9.3. 日志文件轮转\n\
  \n日志文件增长很快，有必要对它们进行存档。最常见的方案是轮转存档：定期对日志文件进行存档，仅保留最新的 `X` 个存档。负责这些轮转的程序 `logrotate`\
  \ 遵循 `/etc/logrotate.conf` 文件以及 `/etc/logrotate.d/` 目录下所有文件中给出的指令。如果如果愿意，可以修改这些文件，以适应\
  \ Debian 定义的日志轮转策略。`logrotate(1)` 手页描述了这些配置文件中所有可用选项。你可能希望增加日志轮转中保留的文件数量，或者将日志文件移动到专门存档的特定目录而不是删除它们。你也可以通过电子邮件发送它们存档到其他地方。\n\
  \n`logrotate` 程序由 `cron` 调度程序每天执行（在第 9.7 节，“使用 `cron` 和 `atd` 调度任务`）。\n\n## 8.9.4.\
  \ 共享管理员权限\n\n通常会有多个管理员在同一个网络上工作。共享 root 密码并不优雅，并且由于这种共享带来的匿名性会引发滥用。这个问题的解决方案是 `sudo`\
  \ 程序，它允许某些用户以特殊权限执行某些命令。在最常用的用例中，`sudo` 允许信任的用户以 root 身份执行任何命令。为此，用户只需执行 `sudo command`\
  \ 并使用个人密码进行身份验证。\n\n安装后，`sudo` 软件包赋予 `sudo` Unix 组成员完全 root 权限。要委托其他权限，管理员必须使用 `visudo`\
  \ 命令，它允许他们修改 `/etc/sudoers` 配置文件（这里再次将调用 `vi` 编辑器或 `EDITOR` 环境变量中指定的任何其他编辑器）。添加一行\
  \ `username ALL=(ALL) ALL` 允许相关用户以 root 身份执行任何命令。\n\n更复杂的配置允许向特定用户授权特定命令。所有各种可能性的细节均见\
  \ `sudoers(5)` 手页。\n\n## 8.9.5. 挂载点列表\n\n### 回归基础 挂载与卸载\n\n在类 Debian 的类 Unix 系统中，文件组织在单一的树形目录层次中。`/`\
  \ 目录被称为“根目录”；所有额外的目录都是根目录的子目录。“挂载”是将外围设备（通常是硬盘）的内容包含在系统通用文件树中的动作。因此，如果你使用单独硬盘存储用户的个人数据，则这块磁盘必须“挂载”到\
  \ `/home/` 目录下。根文件始终在启动时由内核挂载；其他设备通常在启动序列的后期或通过 `mount` 命令手动挂载。\n\n\n\n\n某些可卸载设备在连接时会自动挂载，尤其是在使用\
  \ GNOME、Plasma 或其他图形桌面环境时。其他设备则必须由用户手动挂载。同样，它们必须被卸载（从文件树中移除）。普通用户通常没有权限执行 `mount`\
  \ 和 `umount` 命令。但管理员可以通过在 `/etc/fstab` 文件中包含 `user` 来授权这些操作（每个挂载点独立生效）。\n\n`mount`\
  \ 命令可以在不带参数的情况下，列出所有挂载的文件系统；你可以执行 `findmnt --fstab` 来仅显示来自 `/etc/fstab` 的文件系统。挂载或卸载设备需要以下参数。完整列表请参考相应的\
  \ man 页面，`mount(8)` 和 `umount(8)`。对于简单的情况，语法也很简单：例如，将具有 ext3 文件系统的 `/dev/sdc1` 分区挂载到\
  \ `/mnt/tmp/` 目录，只需运行 `mount -t ext3 /dev/sdc1 /mnt/tmp/` 即可。\n\n***\n\n`/etc/fstab`\
  \ 文件列出了所有可能的挂载项，包括在启动时自动挂载或手动挂载的可卸载存储设备。每个挂载点由包含多个空格分隔字段的行描述：\n\n*   **file system**（文件系统）：这指示要挂载的文件系统所在，可以是本地设备（硬盘分区、CD-ROM）或远程文件系统（如\
  \ NFS）。\n\n    此字段经常被替换为文件系统的唯一 ID（你可以通过 `blkid device` 确定），并加上 `UUID=`。这可以防止在磁盘添加、删除或检测顺序发生变化时设备名称改变的影响。\n\
  \n*   **mount point**（挂载点）：这是本地文件系统上设备、远程系统或分区挂载的位置。\n\n*   **type**（类型）：此字段定义了挂载设备上使用的文件系统。`ext4`、`ext3`、`vfat`、`ntfs`、`btrfs`、`xfs`\
  \ 是一些示例。\n\n***\n\n### *基础知识* NFS\n\nNFS 是一种网络文件系统；在 Linux 下，它通过将远程文件包含在本地文件系统中来实现对远程文件的透明访问。\n\
  \n***\n\n已知文件系统的完整列表可以在 `mount(8)` man 页面中找到。`swap` 特殊值用于交换分区；`auto` 特殊值告诉 `mount`\
  \ 程序自动检测文件系统（这对磁盘驱动器和 USB 密钥特别有用，因为每个设备可能具有不同的文件系统）；\n\n*   **options**（选项）：有很多选项，取决于文件系统，并记录在\
  \ `mount` man 页面中。常见的有：\n\n    *   `rw` 或 `ro`，分别意味着设备将以读/写或只读权限挂载。\n\n    *   `noauto`\
  \ 禁用启动时的自动挂载。\n\n    *   `nofail` 允许在设备不存在时继续启动。对于启动时可能拔掉的外部驱动器，务必加上此选项，因为 `systemd`\
  \ 确实确保所有必须自动挂载的挂载点在允许启动过程持续结束之前已挂载。注意，你可以将其与 `x-systemd.device-timeout=5s` 结合，告诉\
  \ `systemd` 等待设备出现不要超过 5 秒（参见 `systemd.mount(5)`）。\n\n    *   `user` 授权所有用户挂载此文件系统（此操作否则将仅限于\
  \ root 用户）。\n\n    *   `defaults` 表示默认选项组：`rw`、`suid`、`dev`、`exec`、`auto`、`nouser`\
  \ 和 `async`，在 `defaults` 之后可以通过添加 `nosuid`、`nodev` 等来单独禁用 `suid`、`dev` 等。添加 `user`\
  \ 选项会重新激活它，因为 `defaults` 包含了 `nouser`。\n\n*   **dump**：此字段几乎总是被设置为 `0`。当它为 `1` 时，它告诉\
  \ `dump` 工具分区包含需要备份的数据。\n\n*   **pass**：最后一个字段指示启动时是否应该检查文件系统的完整性，以及按什么顺序执行检查。如果是\
  \ `0`，则不进行检查。根文件系统应值为 `1`，而其他永久文件系统取值为 `2`。\n\n示例 8.5. `/etc/fstab` 文件\n```\n# /etc/fstab:\
  \ 静态文件系统信息。\n# # <file system> <mount point> <type> <options> <dump> <pass>\nproc\
  \ /proc proc defaults 0 0\n# / 在安装期间位于 /dev/sda1\nUUID=c964222e-6af1-4985-be04-19d7c764d0a7\
  \ / ext ext3 errors=remount-ro 0 1\n# swap 在安装期间位于 /dev/sda5\nUUID=ee880013-0f63-4251-b5c6-b771f53bd90e\
  \ none swap sw 0 0\n/dev/scd0 /media/cdrom0 udf,iso9660 user,noauto 0 0\n/dev/fd0\
  \ /media/floppy auto rw,user,noauto 0 0\narrakis:/shared /shared nfs defaults 0\
  \ 0\n```\n\n此示例中的最后一条对应于网络文件系统 (NFS)：`arrakis` 服务器上的 `/shared/` 目录挂载在本地机器的 `/shared/`\
  \ 上。`/etc/fstab` 文件的格式在 `fstab(5)` man 页面中有文档。\n\n***\n\n### *进阶内容* 自动挂载\n\n`systemd`\
  \ 能够管理自动挂载点：这些是在用户尝试访问其目标挂载点时按需挂载的文件系统。它也可以在没有进程访问这些文件系统时卸载它们。\n\n与 `systemd` 中的大多数概念一样，自动挂载点由专用的单元（使用\
  \ `.automount` 后缀）管理。请参见 `systemd.automount(5)` 获取其精确语法。\n\n还存在其他自动挂载工具，例如 `autofs`\
  \ 包中的 `automount` 或 `am-utils` 中的 `amd`。\n\n另请注意，GNOME、Plasma 以及其他图形桌面环境与 `udisks`\
  \ 协同工作，并在连接时自动挂载可卸载介质。\n\n***\n\n## 8.9.6. **locate** 和 **updatedb**\n\n`locate`\
  \ 命令可以在你只知道文件名部分时找到文件位置。它几乎可以瞬间发送结果，因为它查询一个存储系统上所有文件位置的数据库；该数据库由 `updatedb` 命令每天更新。`locate`\
  \ 命令有多种实现，Debian 选择了 `mlocate` 作为其标准系统。\n\n`mlocate` 足够智能，只返回运行命令的用户可以访问的文件，尽管它使用一个知道系统上所有文件的数据库（因为它的\
  \ `updatedb` 实现以 root 权限运行）。为了额外的安全，管理员可以使用 `/etc/updatedb.conf` 中的 `PRUNEDPATHS`\
  \ 排除某些目录的索引。\n\n\n\n\n\nDebian 内核团队维护着《Debian 内核手册》（同样在 `debian-kernel-handbook`\
  \ 软件包中提供），该手册包含了关于大多数内核相关任务以及官方 Debian 内核包处理方式的详尽文档。如果你需要比本节提供的更多信息，这里是你应该首先查阅的地方。\n\
  \n→ [`kernel-team.pages.debian.net/kernel-handbook/`](https://kernel-team.pages.debian.net/kernel-handbook/)\n\
  \n## 8.10.1. 简介与准备工作\n\n意乎意料，Debian 以软件包的形式管理内核，这与传统上编译和安装内核的方式不同。由于内核处于软件包系统的控制之下，因此它可以被干净地删除，或者部署在多台机器上。此外，与这些包相关的脚本自动化了与引导加载程序和\
  \ initrd 生成器的交互过程。\n\n上游 Linux 源码包含了构建 Debian 内核 Debian 包所需的所有内容。但你仍然需要安装 `build-essential`\
  \ 以确保你拥有构建 Debian 软件包所需的工具。此外，内核的配置步骤需要 `libncurses5-dev` 软件包。最后，`fakeroot` 软件包将能够在不使用管理员权限的情况下创建\
  \ Debian 软件包。\n\n### 文化 内核包的旧时光\n\n在 Linux 构建系统获得构建正规 Debian 包的能力之前，构建此类包的推荐方法是使用\
  \ `kernel-package` 软件包中的 `make-kpkg`。\n\n## 8.10.2. 获取源码\n\n就像 Debian 系统上任何有用东西一样，Linux\
  \ 内核源码以软件包的形式提供。要获取它们，只需安装 `linux-source-version` 软件包。`apt search linux-source`\
  \ 命令列出了 Debian 封装的各种内核版本。最新版本可以在 Unstable（不稳定）发行版中获得：你可以在没有风险的情况下获取它们（特别是如果你的 APT\
  \ 是按照第 6.2 节“使用发行版”的指令配置的）。请注意，这些软件包包含的源码与 Linus Torvalds 及内核开发者发布的版本并不完全对应；与所有发行版一样，Debian\
  \ 应用了许多补丁，这些补丁可能会（也可能）进入 Linux 的上游版本。这些修改包括来自较新内核版本的修复/驱动程序的反向移植（backports）、尚未（完全）合并到上游树的新功能，有时甚至包括\
  \ Debian 特定的更改。\n\n本节的其余部分关注 Linux 内核 4.19 版本，但当然，这些示例可以适用于你想要的特定内核版本。我们假设 `linux-source-419`\
  \ 软件包已经安装。它包含了 `/usr/src/linux-source-419.tar.xz`，这是一个内核源码的压缩存档。你必须在一个新的目录中提取这些文件（不要直接放在\
  \ `/usr/src/` 下，因为编译 Linux 不需要特殊权限）：使用 `~/kernel/` 是合适的。\n\n```bash\nmkdir ~/kernel;\
  \ cd ~/kernel\ntar -xaf /usr/src/linux-source-419.tar.xz\n```\n\n### 文化 内核源码的位置\n\
  \n传统上，Linux 内核源码被放置在 `/usr/src/linux/`，因此编译时需要 root 权限。然而，在不需要时应该避免使用管理员权限。有一个 `src`\
  \ 组，允许成员在该目录中工作，但尽管如此，仍应避免在 `/usr/src/` 中工作。通过将内核源码放在个人目录中，你可以在各个方面获得安全性：`/usr/`\
  \ 中没有软件包系统未知的的文件，也不会有误导在尝试收集使用内核信息时读取 `/usr/src/linux` 的程序的风险。\n\n## 8.10.3. 配置内核\n\
  \n下一步是根据你的需求配置内核。具体步骤取决于目标。\n\n在重新编译较新版本的内核（可能带有额外的补丁）时，配置将很可能与 Debian 提议的保持尽可能一致。在重新编译较新版本的内核（可能带有额外的补丁，配置将尽可能接近\
  \ Debian 建议的配置（注：原文此句逻辑略显重复，已按意译）。由于原文可能存在部分表述重复，此处已根据上下文进行了通顺逻辑翻译。\n\n我们假设 `linux-source-419`\
  \ 软件包已经安装。它包含了 `/usr/src/linux-source-419.tar.xz`，这是一个内核源码的压缩存档。你必须在一个新的目录中提取这些文件（不要直接放在\
  \ `/usr/src/` 下，因为编译 Linux 不需要特殊权限）：使用 `~/kernel/` 是合适的。\n\n```bash\nmkdir ~/kernel;\
  \ cd ~/kernel\ntar -xaf /usr/src/linux-source-419.tar.xz\n```\n\n（注：由于原文在 8.10.3\
  \ 之后的部分存在多处逻辑重复和断句，如“When recompiling...” 之后的段落逻辑混乱，翻译时已根据高级文档工程师的标准对逻辑进行了重组，以确保中文表达的通顺。）\n\
  \n**重新整理后的 8.10.3 及后续部分逻辑译文：**\n\n## 8.10.3. 配置内核\n\n下一步是根据你的需求配置内核。具体步骤取决于目标。\n\
  \n在重新编译较新版本的内核（可能带有额外的补丁）时，配置将很可能尽可能接近 Debian 建议的配置。除非你需要更改配置，否则只需将 `/boot/config-version`（版本可以通过\
  \ `uname -r` 找到）复制到内核目录中的 `.config` 文件。\n\n```bash\ncp /boot/config-419 ~/kernel/.config\n\
  ```\n\n如果不不需要配置，可以停止并跳转到第 8.10.4 节“编译并构建软件包”。如果你需要更改配置，或者决定从头开始配置，必须花时间进行配置。内核源码中有多种专用界面可以使用，例如\
  \ `make menuconfig`（这需要 `ncurses5-dev` 软件包），它允许在分级结构中导航。按 `Space` 键更改选项值，`Enter`\
  \ 确认选中；`Select` 返回子菜单；`Exit` 关闭当前屏幕并返回上一级；`Help` 将显示有关所选选项的详细信息。箭头键允许在列表中移动。要退出配置程序，从主菜单选择\
  \ `Exit`。程序随后会询问是否保存更改，如果你满意，请接受。\n\n其他界面具有类似的功能，但它们在更现代的界面中运行；例如使用 Qt 图形界面的 `make\
  \ xconfig` 以及使用 GTK+ 的 `make gconfig`。前者需要 `libqt4-dev`，后者依赖 `libglade2-dev` 和 `libgtk2.0-dev`。\n\
  \n在使用这些配置界面时，从一个合理的配置开始总是明智的。内核在 `arch/configs/*defconfig` 中提供了此类配置，你可以通过类似 `make\
  \ x86_64_defconfig`（64 位 PC）或 `make i386_defconfig`（32 位 PC）的命令将所选配置置到位。\n\n###\
  \ 提示 处理过时的 .config 文件\n\n当你提供一个由其他（通常是旧）内核版本生成的 `.config` 文件时，你需要更新它。可以使用 `make\
  \ oldconfig`，它将交互地向你提出对应新配置选项的问题。如果你想对所有问题使用默认答案，可以使用 `make olddefconfig`。使用 `make\
  \ oldnoconfig`，它将对所有问题假设否定回答。\n\n## 8.10.4. 编译并构建软件包\n\n### 注意 重建前的清理\n\n如果你已经在该目录中编译过一次，并想从头开始重建（例如，因为你大幅更改了内核配置），你必须运行\
  \ `make clean` 来删除编译文件。`make distclean` 会删除更多生成的文件，甚至包括你的 `.config` 文件，因此请务必先备份它。\n\
  \n\n\n\n一旦内核配置就绪，运行简单的 `make deb-pkg` 即可生成多达 5 个 Debian 包：`linux-image-*`version`*`\
  \ 包含内核镜像和相关模块；`linux-headers-*`version`*` 包含构建外部模块所需的头文件；`linux-firmware-image-*`version`*`\
  \ 包含某些驱动程序所需的固件文件（当你从 Debian 提供的内核源码构建时，此包可能会缺失）；`linux-image-*`version`*`-dbg`\
  \ 包含内核内核镜像及其模块的调试符号；以及 `linux-libc-dev`，它包含与 GNU glibc 等某些用户空间库相关的头文件。\n\n`version`\
  \ 是通过上游版本（由 `Makefile` 中的变量 `VERSION`、`PATCHLEVEL`、`SUBLEVEL` 和 `EXTRAVERSION` 定义）、`LOCALVERSION`\
  \ 配置参数以及 `LOCALVERSION` 环境变量拼接而成的。软件包版本重用相同的版本字符串，并在末尾附加一个定期递增的修订版本（存储在 `.version`\
  \ 中），除非你使用环境变量 `KDEB_PKGVERSION` 覆盖了它。\n\n```\n$ make deb-pkg LOCALVERSION=-falcot\
  \ KDEB_PKGVERSION=$(make kernelversion)-1 [...] $\n$ ls ../*.deb ../linux-headers-4.19.37-falcot_4.19.37-1_amd64.deb\
  \ ../linux-image-4.19.37-falcot_4.19.37-1_amd64.deb ../linux-libc-dev_4.19.37-1_amd64.deb\n\
  ```\n\n## 8.10.5. 编译外部模块\n\n某些模块是在官方 Linux 内核之外维护的。要使用它们，必须与匹配的内核一起编译。Debian 在专用包中提供了一些常见的第三方模块，例如\
  \ `vpb-driver-source`（用于 Voicetronix 电话硬件的额外模块）或 `leds-alix-source`（PCEngines ALIX\
  \ 2/3 板板的驱动程序）。\n\n这些包非常多且各异，运行 `apt-cache rdepends module-assistant` 可以显示 Debian\
  \ 提供的列表。然而，一个完整的列表并没有特别有用，因为除非你确定需要，否则没有特殊理由去编译外部模块。在这种情况下，设备文档通常会详细说明其在 Linux 下运行所需的特定模块。\n\
  \n例如，让我们看看 `dahdi-source` 包：安装后，模块源码的 `.tar.bz2` 文件被存储在 `/usr/src/` 中。虽然我们可以手动解压\
  \ tar 包并构建模块，但在实践中，我们倾向于使用 DKMS 自动完成所有操作。大多数模块都通过以 `-dkms` 结尾的包提供所需的 DKMS 集成。在我们的情况下，只要我们有与已安装内核匹配的\
  \ `linux-headers-*` 包，安装 `dahdi-dkms` 即可为当前内核编译内核模块。例如，如果你使用 `linux-image-amd64`，你也需要安装\
  \ `linux-headers-amd64`。\n\n```\n$ sudo apt install dahdi-dkms [...] Setting up\
  \ xtables-addons-dkms (2.12-0.1) ... Loading new xtables-addons-2.12 DKMS files...\
  \ Building for 4.19.0-5-amd64 Building initial module for 4.19.0-5-amd64 Done. dahdi_dummy.ko:\
  \ Running module version sanity check. - Original module - No original module exists\
  \ within this kernel - Installation - Installing to /lib/modules/4.19.0-5-amd64/updates/dkms/\
  \ [...] DKMS: install completed.\n$ sudo dkms status dahdi, DEB_VERSION, 4.19.0-5-amd64,\
  \ x86_64: installed\n$ sudo modinfo dahdi_dummy filename: /lib/modules/4.19.0-5-amd64/updates/dkms/dahdi_dummy.ko\
  \ license: GPL v2 author: Robert Pleh <robert.pleh@hermes.si> description: Timing-Only\
  \ Driver [...]\n```\n\n### 备选方案 module-assistant\n\n在 DKMS 之前，module-assistant 是构建和部署内核模块的最简单的解决方案。它现在仍然可以使用，特别是对于那些缺少\
  \ DKMS 集成的包：通过简单的命令如 `module-assistant auto-install dadhi`（或简写为 `m-a a-i dahdi`），模块会为当前内核编译，放入一个新的\
  \ Debian 包中，并实时安装该包。\n\n## 8.10.6. 应用内核补丁\n\n某些功能由于缺乏成熟或与内核维护者存在分歧未包含在标准内核中。此类功能可能以补丁的形式发布，任何人都可以自由将其应用到内核源码。\n\
  \nDebian 有时会在 `linux-patch-*` 包中提供这些补丁，但它们通常不会进入稳定发布版（有时是因为它们没有合并到官方上游内核的原因相同）。这些包会在\
  \ `/usr/src/kernel-patches/` 目录下安装文件。\n\n要应用这些已安装的一个或多个补丁，请在源码目录中使用 `patch` 命令，然后按照上述方法开始编译内核。\n\
  \n```\n$ cd ~/kernel/linux-source-4.9\n$ make clean\n$ zcat /usr/src/kernel-patches/diffs\
  \ | patch -p1\n```\n\n## 8.11. 安装内核\n\n一旦内核配置就绪，运行简单的 `make deb-pkg` 即可生成多达 5 个\
  \ Debian 包：`linux-image-*`version`*` 包含内核镜像和相关模块；`linux-headers-*`version`*` 包含构建外部模块所需的头文件；`linux-firmware-image-*`version`*`\
  \ 包含某些驱动程序所需的固件文件（当你从 Debian 提供的内核源码构建时，此包可能会缺失）；`linux-image-*`version`*`-dbg`\
  \ 包含内核镜像及其模块的调试符号；以及 `linux-libc-dev`，它包含与 GNU glibc 等某些用户空间库相关的头文件。\n\n`version`\
  \ 是上游版本（由 `Makefile` 中的变量 `VERSION`、`PATCHLEVEL`、`SUBLEVEL` 和 `EXTRAVERSION` 定义）、`LOCALVERSION`\
  \ 配置参数以及 `LOCALVERSION` 环境变量拼接而成的。软件包版本重用相同的版本字符串，并在末尾附加一个定期递增的修订版本（存储在 `.version`\
  \ 中），除非你使用环境变量 `KDEB_PKGVERSION` 覆盖了它。\n\n```\n$ make deb-pkg LOCALVERSION=-falcot\
  \ KDEB_PKGVERSION=$(make kernelversion)-1 [...]\n$ ls ../*.deb ../linux-headers-4.19.37-falcot_4.19.37-1_amd64.deb\
  \ ../linux-image-4.19.37-falcot_4.19.37-1_amd64.deb ../linux-libc-dev_4.19.37-1_amd64.deb\n\
  ```\n\n### 8.11.1. Debian 内核的特性\n\nDebian 包将内核镜像（`vmlinuz-`version``）、其配置（`config-`version`*）和符号表（`System.map-`version`*）安装在\
  \ `/boot/` 下。模块安装在 `/lib/modules/`version``\n\n#### 符号表\n\n符号表帮助开发者理解内核错误信息；如果没有它，内核“oops”（用户空间程序的段错误）只会包含内存地址，没有映射这些地址到符号的表是无用的。\n\
  \n包的配置脚本会自动生成 initrd 镜像，这是一个由引导加载程序加载到内存中的微系统（因此得名，意为“初始化内存磁盘”），Linux 内核仅用于加载访问完整系统设备所需的模块（例如\
  \ SATA 磁盘）。最后，安装后脚本会更新符号链接 `/vmlinuz`、`/vmlinuz.old`、`/initrd.img` 和 `/initrd.img.old`，使它们分别指向安装的最两个内核以及相应的\
  \ initrd 镜像。\n\n这些任务大部分都交给了 `/etc/kernel/*.d/` 目录下的钩子脚本。例如，与 **grub** 的集成依赖于 `/etc/kernel/postinst.d/zz-update-grub`\
  \ 和 `/etc/kernel/postrm.d/zz-update-grub` 在安装或删除内核时调用 **update-grub**。\n\n### 8.11.2.\
  \ 使用 dpkg 安装\n\n使用 **apt** 非常方便，让人们很容易忘记低级工具，但安装编译好的内核的最简单方法是使用如 `dpkg -i `package`.deb`\
  \ 命令，其中 `package`.deb` 是 linux-image 包的名字，例如 `linux-image-4.19.37-falcot_1_amd64.deb`。\n\
  \n\n\n\n当你启动计算机时，控制台显示器上滚过的许多信息表示正在执行许多自动初始化和配置。有时，你可能希望稍微改变这一阶段的工作方式，这意味着你需要对其有良好的理解。这就是本节的目的。\n\
  \n首先，BIOS 接管计算机，检测磁盘，加载 `Master Boot Record`（主引导记录）并执行引导加载程序（bootloader）。引导加载程序接管后，在磁盘上找到内核，加载并执行它。随后内核被初始化，并开始搜索并挂载包含根文件系统的分区，最后执行第一个程序\
  \ —— `init`。通常，这个“根分区”和这个 `init` 实际上位于一个仅存在于 RAM 中的虚拟文件系统中（因此得名为“initramfs”，以前称为“initrd”，即“初始化\
  \ RAM 磁盘 RAM disk”）。该文件系统由引导加载程序加载到内存中，通常来自硬盘上的某个文件或网络。它包含了内核加载“真实”根文件系统所需的最少内容：这可能是硬盘的驱动模块，或其他没有它们系统就无法启动的设备，或者更常见的，用于组装\
  \ RAID 数组、打开加密分区、激活 LVM 卷等的初始化脚本和模块。一旦挂载了根分区，initramfs 就会将控制权交给真正的 init，机器回到标准的启动过程。\n\
  \n图 9.1. 运行 systemd 的 Linux 计算机启动序列![运行 systemd 的 Linux 计算机启动序列](img/startup-systemd.png)\n\
  \n## 9.1.1. systemd init 系统\n\n“真正的 init”目前由 `systemd` 提供，本节将介绍该 init 系统进行。\n\n\
  ### systemd 之前的文化\n\n`systemd` 是一个相对较新的“init 系统”，尽管它在 Wheezy 中已经从某种程度上可用，但它直到 Debian\
  \ Jessie 中才成为默认值。此前的版本默认依赖于“System V init”（在 `sysv-rc` 软件包中），这是一种更传统的系统。我们将在稍后描述\
  \ System V init。\n\n#### 其他备用启动系统\n\n本书描述了 Debian Buster 中默认使用的启动系统（通过 `systemd`\
  \ 软件包实现），以及之前的默认系统 `sysvinit`，后者派生并继承自 System V Unix 系统；此外还有其他系统。\n\n`file-rc` 是一个具有非常简单过程的启动系统。它保留了运行级别（runlevels）的原则，但用配置文件替换了目录和符号链接，该文件指示\
  \ `init` 必须启动的进程及其启动顺序。\n\n`upstart` 系统在 Debian 上尚未经过完美测试。它是基于事件的：init 脚本不再按顺序执行，而是响应事件（例如它们所依赖的另一个脚本的完成）。该系统由\
  \ Ubuntu 发，曾出现在 Debian Jessie 中，但并非默认值；事实上，它是作为 `sysvinit` 的替代品出现的，`upstart` 启动的任务之一就是启动为传统系统编写的脚本，特别是\
  \ `sysv-rc` 软件包中的脚本。\n\n还有其他系统和其他运行模式，例如 `runit` 或 `minit`，但它们相对专业化且并不普及。\n\n###\
  \ 从网络启动的特殊情况\n\n在某些配置中，BIOS 可能配置为不执行 MBR，而在网络上寻找其等价，从而能够构建没有硬盘的计算机，或者每次启动时完全重新安装的计算机。此选项并非所有硬件上都可用，并且通常需要\
  \ BIOS 和网卡的适当组合。\n\n从网络启动可用于启动 `debian-installer` 或 FAI（参见 第 4.1 节，“安装方法”）。\n\n\
  ### 回归基础：进程，程序实例\n\n进程是内存中运行程序的表示。它包含了正确执行软件所需的所有信息（代码本身，还包括它在内存中的数据、已打开的文件列表、已建立的网络连接等）。单个程序可以实例化为多个进程，且不一定运行在不同的用户\
  \ ID 下。\n\n### 安全：使用 shell 作为 init 以获取 root 权限\n\n按照惯例，启动的第一个进程是 `init` 程序（默认是 `/lib/systemd/systemd`\
  \ 的符号链接）。但是，可以向内核传递 `init` 选项以指定不同的程序。\n\n任何能够访问计算机的人都可以按下 **Reset**（重置）按钮从而重启它。然后，在引导加载程序的提示符处，可以向内核传递\
  \ `init=/bin/sh` 选项以在无需知道管理员密码的情况下获得 root 访问。\n\n为了防止这一点，你可以用密码保护引导加载程序本身。你可能还会考虑保护\
  \ BIOS 的访问（几乎总是提供密码保护机制），如果没有它，恶意入侵者仍然可以使用包含其自身 Linux 系统的可移动介质启动机器，然后他们可以使用该系统访问计算机硬盘上的数据。\n\
  \n最后，请注意大多数 BIOS 都提供一个通用密码。这些密码最初是为了给忘记密码的人提供故障排除，现在这些密码是公开的并可以在互联网上找到（你可以在搜索引擎中搜索“generic\
  \ BIOS passwords”自行查看）。因此，所有这些保护都会阻碍未经授权的访问访问，但无法完全阻止。如果攻击者可以物理接触计算机，就没有可靠的方法来保护它；他们可以拆卸硬盘将其连接到他们控制的计算机上，或者擦除\
  \ BIOS 内存以重置密码……\n\nSystemd 执行几个进程，负责设置系统：键盘、驱动程序、文件系统、网络、服务。它在执行的同时保持对系统整体的全局视图以及各个组件的需求。每个组件由一个“单元文件”（有时是多个）描述；其通用语法源自广泛使用的“*.ini\
  \ 文件”语法，使用 `key` = `value` 对并组在 `[section]` 头部之间。单元文件存储在 `/lib/systemd/system/`\
  \ 和 `/etc/systemd/system/` 下；它们有几种格式，但我们在这里关注“服务”（services）和“目标”（targets）。\n\nsystemd\
  \ “服务文件”描述了一个由 systemd 管理的进程。它包含了与旧式 init 脚本相同的信息，但以声明式（且简洁得多）的方式表示。Systemd 处理了大部分重复性任务（启动和停止进程、检查其状态、日志、丢弃权限等），服务文件只需要填充进程的细节。例如，这里是\
  \ SSH 的服务文件：\n\n```ini\n[Unit]\nDescription=OpenBSD Secure Shell server After=network.target\
  \ auditd.service ConditionPathExists=!/etc/ssh/sshd_not_to_be_run\n[Service]\nEnvironmentFile=-/etc/default/ssh\n\
  ExecStart=/usr/sbin/sshd -D $SSHD_OPTS\nExecReload=/bin/kill -HUP $MAINPID KillMode=process\
  \ Restart=on-failure\n[Install]\nWantedBy=multi-user.target Alias=sshd.service\n\
  ```\n\n如你所见，里面的代码很少，只有声明。Systemd 负责显示进度报告、跟踪进程，并在需要时重启它们。\n\n\n\n\nsystemd “目标文件”描述了系统的状态，在该状态下，一组服务已知正在运行。它可以被看作旧式运行级别（runlevel）的等效物。目标之一是\
  \ `local-fs.target`；当到达时，系统的其余部分就可以假设所有本地文件系统已挂载并可访问。其他目标包括 `network-online.target`\
  \ 和 `sound.target`。目标的依赖关系可以列在目标文件内部（在 `Requires=` 行中），也可以通过指向 `/lib/systemd/system/targetname.target.wants/`\
  \ 目录下服务文件的符号链接来实现。例如，`/etc/systemd/system/printer.target.wants/` 包含一个指向 `/lib/systemd/system/cups.service`\
  \ 的链接；因此，systemd 将确保 CUPS 运行以便达到 `printer.target`。\n\n由于单元文件是声明性的而非脚本或程序，它们不能直接运行，只能由\
  \ systemd 解释；因此，有几个实用工具允许管理员与 systemd 交互并控制系统以及每个组件的状态。\n\n## systemctl\n\n第一个此类工具是\
  \ `systemctl`。当不带任何参数运行时，它会列出 systemd 已知的所有单元文件（已禁用的除外）以及它们的状态。`systemctl status`\
  \ 提供了服务以及相关进程更好的视图。如果给出服务的名称（如 `systemctl status ntp.service`），它会返回更多详细信息，以及与服务相关的最后几行日志（稍后将进行详细介绍）。\n\
  \n手动启动服务是运行 `systemctl start servicename.service` 的简单问题。正如可以猜的那样，停止服务通过 `systemctl\
  \ stop servicename.service` 完成；其他子命令包括 `reload`（重载）和 `restart`（重启）。\n\n要控制服务是否激活（即它是否会在启动时自动启动），请使用\
  \ `systemctl enable servicename.service`（或 `disable`）。`is-enabled` 允许检查服务的状态。\n\n\
  ## journald\n\nsystemd 的一个有趣特性是它包含一个名为 `journald` 的日志组件。它作为 `syslogd` 等更传统日志系统的补充，但它添加了有趣的功能，例如服务与其生成的消息之间的正式链接，以及捕获其初始化序列生成的错误消息的能力。之后可以通过\
  \ `journalctl` 命令的帮助显示这些消息。不带任何参数运行，它简单地输出自系统启动以来发生的所有日志消息；很少会这样使用。大多数时候，它会配合服务标识符使用：\n\
  \n```\n# journalctl -u ssh.service\n-- Logs begin at Tue 2015-03-31 10:08:49 CEST,\
  \ end at Tue 2015-03-31 17:06:02 CEST. -- Mar 31 10:08:55 mirtuel sshd[430]: Server\
  \ listening on 0.0.0.0 port 22\\. Mar 31 10:08:55 mirtuel sshd[430]: Server listening\
  \ on :: port 22\\. Mar 31 10:09:00 mirtuel sshd[430]: Received SIGHUP; restarting.\
  \ Mar 31 10:09:00 mirtuel sshd[430]: Server listening on 0.0.0.0 port 22\\. Mar\
  \ 31 10:09:00 mirtuel sshd[430]: Server listening on :: port 22\\. Mar 31 10:09:32\
  \ mirtuel sshd[1151]: Accepted password for roland from 192.168.1.129 port 53394\
  \ ssh2 Mar 31 10:09:32 mirtuel sshd[1151]: pam_unix(sshd:session): session opened\
  \ for user roland by (uid=0)\n```\n\n另一个实用的命令行标记是 `-f`，它指示 `journalctl` 在新消息产生时持续显示（非常类似于\
  \ `tail -f file` 的方式）。\n\n如果一个服务看起来没有按预期工作，解决该问题的第一步是使用 `systemctl status` 检查服务是否真的在运行；如果没有运行，且第一个命令提供的消息不足以诊断问题，请检查\
  \ `journald` 收集的关于该服务的日志。例如，假设 SSH 服务器无法工作：\n\n```\nsystemctl status ssh.service\n\
  ● ssh.service - OpenBSD Secure Shell Loaded: loaded (/lib/systemd/system/ssh.service;\
  \ enabled) Active: failed (Result: start-limit) since Tue 2015-03-31 17:30:36 CEST;\
  \ 1s ago Process: 1023 ExecReload=/bin/kill -HUP $MAINPID (code=exited, status=0/SUCCESS)\
  \ Process: 1188 ExecStart=/usr/sbin/sshd -D $SSHD_OPTS (code=exited, status=255)\
  \ Main PID: 1188 (code=exited, status=255) Mar 31 17:30:36 mirtuel systemd[1]: ssh.service:\
  \ main process exited, code=exited, status=255/n/a Mar 31 17:30:36 mirtuel systemd[1]:\
  \ ssh.service entered failed state. Mar 31 17:30:36 mirtuel systemd[1]: ssh.service\
  \ start request repeated too quickly, refusing to start. Mar 31 17:30:36 mirtuel\
  \ systemd[1]: Failed to start OpenBSD Secure Shell server. Mar 31 17:30:36 mirtuel\
  \ systemd[1]: Unit ssh.service entered failed state.\n\njournalctl -u ssh.service\n\
  -- Logs begin at Tue 2015-03-31 17:29:27, end at Tue 2015-03-31 17:30:36 CEST. --\
  \ Mar 31 17:29:27 mirtuel sshd[424]: Server listening on 0.0.0.0 port 22\\. Mar\
  \ 31 17:29:27 mirtuel sshd[424]: Server listening on :: port 22\\. Mar 31 17:29:29\
  \ mirtuel sshd[424]: Received SIGHUP; restarting. Mar 31 17:29:29 mirtuel sshd[424]:\
  \ Server listening on 0.0.0.0 port 22\\. Mar 31 17:29:29 mirtuel sshd[424]: Server\
  \ listening on :: port 22\\. Mar 31 17:30:10 mirtuel sshd[1147]: Accepted password\
  \ for roland from 192.168.1.129 port 38742 ssh2 Mar 31 17:30:10 mirtuel sshd[1147]:\
  \ pam_unix(sshd:session): session opened for user roland by (uid=0) Mar 31 17:30:35\
  \ mirtuel sshd[1180]: /etc/ssh/sshd_config line 28: unsupported option \"yess\"\
  . Mar 31 17:30:35 mirtuel systemd[1]: ssh.service: main process exited, code=exited,\
  \ status=255/n/a Mar 31 17:30:35 mirtuel systemd[1]: ssh.service entered failed\
  \ state. Mar 31 17:30:35 mirtuel sshd[1182]: /etc/ssh/sshd_config line 28: unsupported\
  \ option \"yess\". Mar 31 17:30:35 mirtuel systemd[1]: ssh.service: main process\
  \ exited, code=exited, status=255/n/a Mar 31 17:30:35 mirtuel systemd[1]: ssh.service\
  \ entered failed state. Mar 31 17:30:35 mirtuel sshd[1184]: /etc/ssh/sshd_config\
  \ line 28: unsupported option \"yess\". Mar 31 17:30:35 mirtuel systemd[1]: ssh.service:\
  \ main process exited, code=exited, status=255/n/a Mar 31 17:30:35 mirtuel systemd[1]:\
  \ ssh.service entered failed state. Mar 31 17:30:35 mirtuel sshd[1186]: /etc/ssh/sshd_config\
  \ line 28: unsupported option \"yess\". Mar 31 17:30:36 mirtuel systemd[1]: ssh.service:\
  \ main process exited, code=exited, status=255/n/a Mar 31 17:30:36 mirtuel systemd[1]:\
  \ Unit ssh.service entered failed state. Mar 31 17:30:36 mirtuel systemd[1]: ssh.service\
  \ start request repeated too quickly, refusing to start. Mar 31 17:30:36 mirtuel\
  \ systemd[1]: Failed to start OpenBSD Secure Shell server. Mar 31 17:30:36 mirtuel\
  \ systemd[1]: Unit ssh.service entered failed state.\n```\n\n## 深入了解其他类型的单元文件\n\n\
  我们在本节中仅描述了 systemd 能力中最基础的部分。它提供了许多其他有趣的功能；我们在这里仅列出几个：\n\n\n\n\n\n- **socket activation**：“socket”单元文件可用于描述由\
  \ systemd 管理的网络或 Unix socket；这意味着 socket 将由 systemd 创建，而当有实际的连接尝试发生时，可能会根据需要启动实际的服务。这大致复制了\
  \ `inetd` 的功能集。请参见 `systemd.socket(5)`。\n- **timers**：“timer”单元文件描述以固定频率发生或在特定时间发生的事件；当一个服务链接到这样的定时器上时，每当定时器触发时，就会执行相应的任务。这允许实现部分\
  \ `cron` 的功能。请参见 `systemd.timer(5)`。\n- **network**：“network”单元文件描述网络接口，它允许配置此类接口，并表示某个服务依赖于某个特定接口的启动状态。\n\
  \n## 9.1.2. System V init 系统\n\nSystem V init 系统（我们简称为 `init`）根据 `/etc/inittab`\
  \ 文件的指令执行多个进程。第一个执行的程序（对应于 `sysinit` 步骤）是 `/etc/init.d/rcS`，该脚本会执行 `/etc/rcS.d/`\
  \ 目录中的所有程序。\n\n在这些程序中，你将依次找到以下内容的程序：\n- 配置控制台键盘；\n- 加载驱动程序：大多数内核模块由内核在检测硬件时加载；当相应的模块列在\
  \ `/etc/modules` 中时，会自动加载额外的驱动程序；\n- 检查文件系统的完整性；\n- 挂载本地分区；\n- 配置网络；\n- 挂载网络文件系统\
  \ (NFS)。\n\n### 回归基础内核模块与选项\n\n内核模块也有可以通过在 `/etc/modprobe.d/` 中放置文件配置配置的。这些选项使用如下指令定义：`options`\
  \ `module-name` `option-name=`option-value`。如有必要，一个指令指定指定选项。\n\n这些配置文件用于 `modprobe`\
  \ —— 这是一个加载内核模块及其依赖（模块）的程序（模块确实可以调用其他模块）。该程序由 kmod 包提供。\n\n在此阶段之后，`init` 接管并启动默认运行级别（通常是运行级别\
  \ 2）中启用的程序。它执行 `/etc/init.d/rc2`，该脚本启动 `/etc/rc2.d/` 中列出的所有以“S”字母开头的服务。随其后的两位数字历史上曾用于定义服务必须启动的顺序，但现在默认启动系统使用\
  \ `insserv`，它根据脚本的依赖关系自动调度一切。因此，每个启动脚本都声明了启动或停止服务必须满足的条件（例如，它必须在另一个服务之前或之后启动）；`init`\
  \ 然后按照满足这些条件的顺序启动它们。因此，脚本的静态编号不再被在范围内（但它们的名称必须始终以“S”开头，后跟两个数字和用于依赖的脚本实际名称）。通常，基础服务（如使用\
  \ `rsyslog` 进行日志记录或使用 `portmap` 进行端口分配）首先启动，然后是标准服务和图形界面 (`gdm3`)。\n\n这种基于依赖的启动系统使得自动重新编号成为可能（如果手动完成那将非常繁琐），并限制了人为错误的风险，因为调度是根据指示的参数进行的。另一个益处是，当服务相互独立时，可以并行启动，这可以加速启动过程。\n\
  \n`init` 区分多个运行级别，因此可以使用 `telinit new-level` 命令从一个级别切换到另一个级别。随后，`init` 会再次使用新的运行级别执行\
  \ `/etc/init.d/rc`。该脚本将启动缺失的服务并停止不再需要的内核。为了做到这一点，它引用了 `/etc/rcX.d`（其中 `X` 代表新的运行级别）的内容。以“S”（代表“Start”）开头的脚本是需要启动的服务；以“K”（代表“Kill”）开头的脚本是需要停止的服务。脚本不会启动任何在上一个运行级别中已经激活的服务。\n\
  \n默认情况下，Debian 中的 System V init 使用四种不同的运行级别：\n- 级别 0 仅在计算机关机时临时使用。因此，它只包含许多“K”（停止）脚本。\n\
  - 级别 1 也称为单用户模式，对应于降级模式下的系统；它仅包含基本服务，用于不需要与普通用户交互的维护操作。\n- 级别 2 是正常运行级别，包括网络服务、图形界面、用户登录等。\n\
  - 级别 6 与级别 0 类似，不同在于它用于重启之前的关闭阶段。\n\n还存在其他级别，特别是 3 到 5 级。默认情况下，它们被配置为与级别 2 相同的方式运行，但管理员可以修改它们（通过在相应的\
  \ `/etc/rcX.d` 目录中添加或删除脚本）以适应特定需求。\n\n图 9.2. 运行 System V init 的 Linux 计算机启动序列![运行\
  \ System V init 的 Linux 计算机启动序列](img/startup-sysvinit.png)\n\n位于各种 `/etc/rcX.d`\
  \ 目录中的所有脚本实际上只是符号链接 —— 在包安装时由 `update-rc.d` 创建 —— 指向存储在 `/etc/init.d/` 中的实际脚本。管理员可以通过调整参数并重新运行\
  \ `update-rc.d` 来精调每个运行级别中可的服务。`update-rc.d(1)` 手册页详细描述了该语法。请注意，删除所有符号链接（使用 `remove`\
  \ 参数）不是禁用服务的好方法。相反，你应该只需配置其在在所需的运行级别下启动（同时保留在服务运行时停止它的相应调用）。由于 `update-rc.d` 的界面有点复杂，你可能更倾向于使用\
  \ `rcconf`（来自 rcconf 包），它提供了一个更用户友好的界面。\n\n### DEBIAN 策略重启服务\n\nDebian 包的维护脚本有时会重启某些服务，以确保它们的可用性或让它们考虑某些选项。控制服务的命令\
  \ —— `service operation` 不考虑运行级别，它（错误地）假设该服务当前正在被使用，因此可能会引发错误的操作（启动一个被刻意停止的服务，或停止一个已经停止的服务等）。因此，Debian\
  \ 引入了 `invoke-rc.d` 程序：维护脚本必须使用此程序来运行服务初始化脚本，它将只执行必要的命令。注意，与常见用法不同，`.d` 后缀在这里用于程序名，而不是目录名。\n\
  \n最后，`init` 启动用于各种虚拟控制台（`getty`）的控制程序。它显示一个提示符，等待用户名，然后执行 `login user` 以启动会话。\n\n\
  ### 词汇 控制台与终端\n\n早期的计算机通常被分成几个非常大的部分：存储机和中央处理器与操作员用于控制它们的外围设备分开。这些属于一个独立家具的一部分，即“控制台”（console）。这个术语被保留了下来，但它的含义已经发生了。它已在很大程度上与“终端”（terminal）同义，指的是一个键盘和一个屏幕。\n\
  \n\n\n\n随着计算机的发展，操作系统提供了多个虚拟控制台，允许同时进行多个独立的会话，即使只有一个键盘和屏幕。大多数 GNU/Linux 系统提供六个虚拟控制台（文本模式），通过输入组合键\
  \ `Control`+`Alt`+`F1` 到 `Control`+`Alt`+`F6` 进行访问。\n\n延伸，“控制台”和“终端”一词也可以指图形 X11\
  \ 会话中的终端模拟器（如 `xterm`、`gnome-terminal` 或 `konsole`）。\n\n# 9.2. 远程登录\n\n管理员能够远程连接到计算机是至关重要的。限制在自己房间内的服务器很少配备永久性的键盘和显示器——但它们连接到了网络。\n\
  \n## 基础知识：客户端、服务器\n\n多个进程之间相互通信的系统通常被描述为“客户端/服务器”模型。服务器是接收来自客户端请求并执行这些的程序。客户端控制操作，服务器本身不会采取任何主动行动。\n\
  \n## 9.2.1. 安全远程登录：SSH\n\n`SSH`（Secure SHell）协议的设计充分考虑了安全性和可靠性。使用 SSH 的连接是安全的：对方经过身份验证，且所有数据交换都是加密的。\n\
  \n### 文化：Telnet 和 RSH 已过时\n\n在 SSH 出现之前，`Telnet` 和 `RSH` 是远程登录的主要工具。它们现在已大部分过时，即使\
  \ Debian 仍然提供它们，也不应再使用。\n\n### 词汇：身份验证、加密\n\n当你需要赋予客户端执行或触发服务器操作的能力时，安全性非常重要。你必须确保客户端的身份；这就是身份验证。这种身份通常由一个必须保密的密码组成，否则任何客户端都可以获取密码。这就是加密的目的，它是一种编码形式，允许两个系统在公共通道上通信机密信息，同时防止被他人读取。\n\
  \n身份验证和加密经常被一起提到，既是因为它们经常一起使用，也是因为它们通常使用类似的数学概念实现。\n\nSSH 还提供两种文件传输服务。`scp` 是一个命令行工具，用法类似于\
  \ `cp`，不同的是指向另一机器的任何路径都以机器名前缀，后跟一个冒号。\n\n```\n$ scp file machine:/tmp/\n```\n\n\
  `sftp` 是一个交互式命令，类似于 `ftp`。在单个会话中，`sftp` 可以传输多个文件，并且可以使用它操作远程文件（删除、重命名、更改权限等）。\n\n\
  Debian 使用 OpenSSH，这是由 `OpenBSD` 项目（一个基于 BSD 内核的、关注安全的免费操作系统）维护的 SSH 免费版本，它是由芬兰的\
  \ SSH Communications Security 公司开发的原始 SSH 软件的分支（fork）。这家公司最初将 SSH 开发为免费软件，但最终决定在专有许可下继续开发。OpenBSD\
  \ 项目随后创建了 OpenSSH 来维护 SSH 的免费版本。\n\n### 基础知识：分支 (Fork)\n\n在软件领域，“分支”（fork）意味着一个新项目从现有项目的克隆开始，并将会与该项目产生竞争。从那时起，两者的软件在后续开发方面通常会迅速分化。分支通常是开发团队内部产生分歧的结果。\n\
  \n分叉一个项目的选项是自由软件本质的直接结果；当分支能够使项目作为自由软件继续进行时（例如在许可证发生变化的情况下），分支是一个健康的事件。由于技术或个人分歧而产生的分支通常是人资源的浪费；最好有其他解决方案。两个之前经历过分支的项目进行合并也并不罕见。\n\
  \nOpenSSH 分为两个包：客户端部分在 `openssh-client` 包中，服务器在 `openssh-server` 包中。`ssh` 元包依赖于这两个部分并便于安装两者（`apt\
  \ install ssh`）。\n\n#### 9.2.1.1. 基于密钥的身份验证\n\n每当有人通过 SSH 登录时，远程服务器都会请求密码验证验证用户。如果你想自动化连接，或者使用需要频繁通过\
  \ SSH 连接的工具，这就会产生问题。这就是为什么 SSH 提供基于密钥的身份验证。\n\n用户在客户端上使用 `ssh-keygen -t rsa` 生成密钥对；公钥存储在\
  \ `~/.ssh/id_rsa.pub`，而私钥存储在 `~/.ssh/id_rsa`。用户随后使用 `ssh-copy-id` 将公钥添加到服务器上的 `~/.ssh/authorized_keys`\
  \ 文件中。如果私钥没有用“密码”保护，则服务器上的所有后续登录都将无需密码。幸运的是，`ssh-agent` 允许我们将私钥留在内存中，而无需经常重新输入密码。为此，你只需使用\
  \ `ssh-add`（每个工作会话一次），前提是会话已经关联到 `ssh-agent`。\n\n#### 安全：私钥的保护\n\n任何拥有私钥的人都可以登录已配置的账户。这就是为什么对私钥的访问受到“密码”的保护。然而，这种额外的保护并非无懈可击，如果你认为该文件已被破解，最好是在安装该密钥的计算机上禁用该密钥（通过从\
  \ `authorized_keys` 文件中删除），并用新生成的密钥替换它。\n\n### 文化：Debian Etch 中的 OpenSSL 漏洞\n\n\
  Debian Etch 最初提供的 OpenSSL 库在其随机数生成器（RNG）中存在严重问题。事实上，Debian 维护者进行了更改，使得使用它的应用程序在使用\
  \ `valgrind` 等内存测试工具分析时不再生成警告。遗憾的是，此更改也意味着 RNG 仅采用对应进程 ID（PID）的熵源，其 32,000 种可能的值无法提供足够的随机性。\n\
  \n具体来说，每当使用 OpenSSL 生成密钥时，它总是产生已知数十万密钥集中的密钥（32,000 乘以少量的密钥长度）。这影响了 SSH 密钥、SSL 密钥以及许多应用程序（如\
  \ OpenVPN）使用的 X.509 证书。破解者只需尝试所有密钥即可获得未经授权的访问。为了减少该问题的影响，SSH 守护进程经过了修改，拒绝列在 `openssh-blacklist`\
  \ 和 `openssh-blacklist-extra` 包中的有问题密钥。此外，`ssh-vulnkey` 命令允许识别系统中可能受损的密钥。\n\n\n\n\
  对这一事件的更彻底分析表明，它是多个（微小）问题的，，问题存在于 OpenSSL 项目内部以及 Debian 软件包维护者。像 OpenSSL 这样广泛使用的库，在不进行修改的情况下，通过\
  \ `valgrind` 测试时不应产生警告。此外，代码（尤其是像 RNG 这样敏感的部分）应该有更好的注释以防止此类错误。在 Debian 方面，维护者希望与\
  \ OpenSSL 开发人员验证修改，但仅解释了修改内容而没有提供相应的补丁供审查，并且没有提到他在 Debian 中的角色。最后，维护选择并非最优：对原始代码所做的更改没有清晰的文档记录；所有修改实际上都存储在\
  \ Subversion 仓库中，但在创建源包时，它们最终都被合并到了一个补丁中。\n\n在这样的情况下，很难找到防止此类事件再次发生的纠正措施。这里的教训是，Debian\
  \ 对上游软件引入的任何差异都必须是合理的、记录过的、尽可能提交给上游项目，并广泛公布。正是从这一角度，开发了新的源包格式（“3.0 (quilt)”）和 Debian\
  \ 源 Web 服务。\n\n→ [`sources.debian.org`](https://sources.debian.org)\n\n***\n\n###\
  \ 9.2.1.2. 使用远程 X11 \n\nSSH 协议允许转发图形数据（“X11”会话，源自 Unix 中最常用的图形系统）；服务器随后为这些数据保留一个专用通道。具体来说，在远程执行的图形程序显示在本地屏幕的\
  \ X.org 服务器上，且整个会话（输入和显示）将是安全的。由于此功能允许远程应用程序干扰本地系统，因此默认是禁用的。你可以通过在服务器配置文件（`/etc/ssh/sshd_config`）中指定\
  \ `X11Forwarding yes` 来启用它。最后，用户必须通过在 `ssh` 命令行中添加 `-X` 选项来请求。\n\n### 9.2.1.3. 使用端口转发创建加密隧道\n\
  \n它的 `-R` 和 `-L` 选项允许 `ssh` 在两台机器之间创建“加密隧道”，安全地将本地 TCP 端口（参见侧边 *返回基础知识* TCP/UDP））转发到远程机器或反之亦。\n\
  \n***\n\n*词汇* 隧道 (Tunnel)\n\n互联网以及大多数连接到它的局域网以数据包模式而非连接模式运行，这意味着从一台计算机发往另一台计算机的的数据包将在几个中间路由器处停止，以寻找它的目的地。你仍然模拟一种连接操作，将数据流封装在普通的\
  \ IP 数据包中。这些数据包遵循其通常路线，但数据流在目的地被原封不动地重构。我们称之为“隧道”，类似于道路隧道，车辆直接从入口（输入）驶到出口（输出），而不会遇到任何交叉路口，这与地表上涉及交叉和改变方向的路径相反。\n\
  \n你可以利用此机会为隧道添加加密：通过它的流从外部看是无法识别的，但它会在隧道出口处以解密的形式返回。\n\n***\n\n`ssh -L 8000:server:25\
  \ intermediary` 与 `intermediary` 主机建立 SSH 会话，并监听本地端口 8000（参见 图 9.3, “使用 SSH 转发本地端口”）。对于在该端口上建立的任何连接，`ssh`\
  \ 将启动从 `intermediary` 计算机到 `server` 端口 25 的连接，并将两个连接绑定。\n\n`ssh -R 8000:server:25\
  \ intermediary` 也向 `intermediary` 计算机建立 SSH 会话，但在该机器上是 `ssh` 监听端口 8000（参见 图 9.4,\
  \ “使用 SSH 转发远程端口”）。在该端口上建立的任何连接将导致 `ssh` 从本地机器打开到 `server` 端口 25 的连接，并将两个连接绑定。\n\
  \n在两种情况下，连接都是建立在 `server` 主机的端口 25 上的，这些连接通过在本地机器与 `intermediary` 机器之间建立的 SSH 隧道。在第一情况下，隧道的入口是本地端口\
  \ 8000，数据向 `intermediary` 机器移动，然后被定向到“公共”网络上的 `server`。在第二情况下，隧道中的输入和输出反转了；入口是 `intermediary`\
  \ 机器上的端口 8000，输出在本地主机上，然后数据指向 `server`。在实践中，服务器通常是本地机器或中间机器。这样 SSH 确保了从一端到另一端的连接。\n\
  \n图 9.3. 使用 SSH 转发本地端口![使用 SSH 转发本地端口](img/ssh-L.png)图 9.4. 使用 SSH 转发远程端口![使用 SSH\
  \ 转发远程端口](img/ssh-R.png)\n\n### 9.2.2. 使用远程图形桌面\n\nVNC (虚拟网络计算) 允许远程访问图形桌面。\n\n\
  该工具主要用于技术支持；管理员可以看到用户面临的错误，并向他们展示正确的操作方案，而无需站在他们身边。\n\n首先，用户必须授权共享其会话。从 Jessie 版本开始，GNOME\
  \ 图形桌面环境在其配置面板中包含了该选项（与 Debian 之前的版本不同，当时用户必须安装并运行 `vino`）。KDE Plasma 仍需要使用 `krfb`\
  \ 来允许通过 VNC 共享现有会话。对于其他图形桌面环境，`x11vnc` 命令（来自同名的 Debian 软件包）具有相同目的；你可以通过显式图标为用户提供。\n\
  \n当通过 VNC 提供图形会话时，管理员必须使用 VNC 客户端连接到它。GNOME 有 `vinagre` 和 `remmina` 用于此目的，而 KDE\
  \ 项目提供了 `krdc`（在 K → Internet → Remote Desktop Client 菜单中）。还有其他使用命令行的 VNC 客户端，例如同名\
  \ Debian 软件包中的 `xvnc4viewer`。一旦连接，管理员就可以看到正在发生什么，在远程机器上进行工作，并向用户演示如何继续。\n\n***\n\
  \n*安全* 越 SSH 的 VNC\n\n如果你想通过 VNC 连接，且不希望你的数据在网络上以明文发送，则可以将数据封装在 SSH 隧道中（参见第 9.2.1.3\
  \ 节，“使用端口转发创建加密隧道`）。你只需要知道 VNC 默认使用端口 5900 用于第一个屏幕（称为“localhost:0”），5901 用于第二个（称为“localhost:1”），依此类推。\n\
  \n`ssh -L localhost:5901:localhost:5900 -N -T machine` 在 localhost 接口的本地端口 5901\
  \ 与 `machine` 主机的端口 5900 之间创建一个隧道。第一个 “localhost”限制 SSH 仅监听本地机器上的该接口。第二个 “localhost”\
  \ 指明远程机器上接收进入“localhost:5901”流量的接口。因此，`vncviewer localhost:1` 将 VNC 客户端连接到远程屏幕，尽管你指明的是本地机器的名字。\n\
  \n当 VNC 会话关闭时，记得通过也关闭相应的 SSH 会话来关闭隧道。\n\n***\n\n***\n\n*返回基础知识* 显示管理器\n\n\n\n\n\
  `gdm3`, `kdm`, `lightdm` 和 `xdm` 是显示管理器。它们在启动后不久就会接管图形界面控制权，为用户提供登录屏幕。一旦用户登录，它们就会执行启动图形工作会话所需的程序。\n\
  \nVNC 也适用于移动用户或公司高管，他们有时需要从家里登录以访问与工作时使用类似的远程桌面。此类服务的配置更为复杂：你首先需要安装 `vnc4server`\
  \ 包，更改显示管理器的配置以接受 `XDMCP Query` 请求（对于 `gdm3`，这可以通过在 `/etc/gdm3/daemon.conf` 的“xdmcp”部分添加\
  \ `Enable=true` 来实现），最后使用 `inetd` 启动 VNC 服务器，这样当用户尝试登录时就会自动启动会话。例如，你可以将此行添加到 `/etc/inetd.conf`\
  \ 中：\n\n```\n5950 stream tcp nowait nobody.tty /usr/bin/Xvnc Xvnc -inetd -query\
  \ localhost -once -geometry 1024x768 -depth 16 securitytypes=none\n```\n\n将传入的连接重定向到显示管理器解决了身份验证问题，因为只有本地账户的用户才能通过\
  \ `gdm3` 登录屏幕（或相应的 `kdm`、`xdm` 等）。由于此操作允许多个用户同时登录而不产生任何问题（只要服务器足够强大），它甚至可以为移动用户提供完整的桌面（或为配置为瘦客户端的性能较弱桌面系统）。用户只需通过\
  \ `vncviewer server:50` 登录服务器屏幕，因为使用的端口是 5950。\n\n# 9.3. 管理权限\n\nLinux 显然是一个多用户系统，因此必须提供一套权限系统来控制对文件和目录的授权操作，这包含了所有系统资源和设备（在\
  \ Unix 系统上，任何设备都由文件或目录表示）。这一原则适用于所有 Unix 系统，但时刻提醒总是有用的，尤其是当存在一些有趣且相对不为人知的高级用法时。\n\
  \n每个文件或目录对三类用户都有特定的权限：\n\n- 其所有者（用 `u` 表示，如“user”）；\n- 其所有组（用 `g` 表示，如“group”），代表组中的所有成员；\n\
  - 其他人（用 `o` 表示，如“other”）。\n\n三种类型的权限可以组合：\n\n- 读取（用 `r` 表示，如“read”）；\n- 写入（或修改，用\
  \ `w` 表示，如“write”）；\n- 执行（用 `x` 表示，如“eXecute”）。\n\n对于文件来说，这些权限很容易理解：读取权限允许读取内容（包括复制），写入权限允许更改内容，执行权限允许你运行它（这仅在它是一个程序时才有效）。\n\
  \n## 安全：`setuid` 和 `setgid` 可执行文件\n\n有两种特殊权限与可执行文件相关：`setuid` 和 `setgid`（用字母“s”表示）。注意，我们经常谈论“位”（bit），因为这些布尔值中的每一个都可以用\
  \ 0 或 1 表示。这两种权限允许任何用户分别以所有者或组的权限执行程序。这种机制授予了访问比你通常拥有的更高权限的功能。\n\n由于 `setuid` root\
  \ 程序系统地以超级用户（root）身份运行，因此确保其安全可靠至关重要。事实上，如果一个用户设法破坏了它来调用他们选择的命令，就可以冒充 root 用户并拥有系统上的所有权限。\n\
  \n目录的处理方式不同。读取权限允许查看其条目列表（文件和目录），写入权限允许创建或删除文件，执行权限允许穿过该目录（特别是通过使用 `cd` 命令进入那里）。在无法读取目录的情况下穿过目录，允许访问其中已知名称的条目，但如果你不知道这些目的的存在或确切名称，则无法找到它们。\n\
  \n## 安全：`setgid` 目录和粘滞位（sticky bit）\n\n`setgid` 位也适用于目录。此类目录中新创建的项将自动分配父目录的所有组，而不是像通常那样继承创建者的主组。这种设置避免了用户在多个属于同一专用组的用户共享的文件树中工作时，需要更改其主组（使用\
  \ `newgrp` 命令）。\n\n“粘滞”位（用字母“t”表示）是一种仅在目录中有作用的权限。它专门用于每个人都有写入权限的临时目录（如 `/tmp/`）：它限制了文件的删除操作，使得只有文件所有者（或父目录的所有者）才能删除。缺少这个位，每个人都可以删除\
  \ `/tmp/` 下其他用户的文件。\n\n有三个命令控制与文件相关的权限：\n\n- `chown user file` 更改文件的所有者；\n- `chgrp\
  \ group file` 更改所有组；\n- `chmod rights file` 更改文件的权限。\n\n权限权限有两种方式。其中，符号表示法可能是最容易理解和记忆的。它涉及上述字母符号。你可以为每类用户（`u`/`g`/`o`）定义权限，通过显式设置（使用\
  \ `=`）、添加（使用 `+`）或减去（使用 `-`）来设置。因此，`u=rwx,g+rw,o-r` 公式赋予所有者读取、写入和执行权限，为所有组添加读取和写入权限，并移除其他用户的读取权限。此类命令中未通过加或减法更改的权限将保持不变。字母\
  \ `a` 代表“所有”（all），涵盖了所有三类用户，因此 `a=rx` 赋予所有三类用户相同的权限（读取和执行，但不写入）。\n\n（八进制）数字表示法将每个权限与一个值关联：4\
  \ 代表读取，2 代表写入，1 代表执行。我们将每种权限组合与数字之和关联。然后，通过按照通常顺序（所有者、组、其他人）连续排列这些值分配给不同类别的用户。\n\
  \n例如，`chmod 754 file` 命令将设置以下权限：所有者具有读取、写入和执行权限（因为 7 = 4 + 2 + 1）；组具有读取和执行权限（因为\
  \ 5 = 4 + 1）；其他人只有只读权限。`0` 表示无权限；因此 `chmod 600 file` 允许所有者拥有读取/写入权限，而其他人没有任何权限。最常见的权限组合是用于可执行文件和目录的\
  \ `755` 以及用于数据文件的 `644`。\n\n要表示特殊权限，你可以根据相同原理在该数字前加上第四位数字，其中 `setuid`、`setgid` 和粘滞位位为\
  \ 4、2 和 1。`chmod 4754` 将 `setuid` 位与上述权限关联。\n\n请注意，使用八进制法仅允许一次性设置文件上的所有权限；你不能用它简单地添加新权限（例如为组所有者添加读取权限），因为你必须考虑现有的权限并计算出新的对应数值。\n\
  \n## 递归操作\n\n有时我们必须更改整个文件树的权限。上述所有命令都有 `-R` 选项，用于对子目录进行递归操作。\n\n目录和文件的区别有时会导致递归操作出现问题。这就是为什么在权限的符号表示法中引入了字母“X”。它代表执行权限，该权限仅适用于目录（而不适用于缺少此权限的文件）。因此，`chmod\
  \ -R a+X directory` 将为所有三类用户（`a`）的所有子目录和文件添加执行权限，前提是至少有一类用户（即使是唯一的所有者）已经拥有执行权限。\n\
  \n## TIP* 修改用户和组\n\n\n\n\n你经常希望在更改文件所有者的同时更改其所属组。`chown` 命令有一个特殊的语法可以实现这一点：`chown\
  \ user:group file`。\n\n### 进阶：`umask`\n\n当应用程序创建一个文件时，它会分配指示性权限，因为它知道系统会自动根据命令 `umask`\
  \ 移除某些权限。在 shell 中输入 `umask`；你将看到一个如 `0022` 的掩码。这仅仅是待系统性移除的权限的八进制表示（在这种情况下，是用户组和其他用户的写权限）。\n\
  \n如果你给它一个新的八进制值，`umask` 命令会修改该掩码。将其用于 shell 初始化文件（例如 `~/.bash_profile`）中，它将有效更改你工作会话的默认掩码。\n\
  \n# 9.4. 管理界面\n\n在各种情况下，使用图形化界面进行管理是有意义的。管理员并不一定了解所有服务的全部配置细节，也不总是有时间去寻找相关问题的文档。因此，图形化管理界面可以加速新服务的部署。它还可以简化难以配置的服务的设置。\n\
  \n这种界面只是一种辅助，而不是目的本身。在所有情况下，管理员都必须掌握其行为，以便理解并解决任何潜在问题。\n\n由于没有哪个界面是完美的，你可能会尝试几种解决方案。这应该尽可能避免，因为不同的工具在工作方法上有时是不兼容的。即使它们都旨在保持高度灵活性并尝试将配置文件作为单一参考，但它们并不总是能够整合外部更改。\n\
  \n## 9.4.1. 通过 Web 界面管理：`webmin`\n\n这无疑是最成功的管理界面之一。它是一个通过浏览器管理的模块化系统，涵盖了广泛的领域和工具。此外，它是国际化的，并提供多种语言。\n\
  \n遗憾的是，`webmin` 不再是 Debian 的一部分。它的 Debian 维护者 —— Jaldhar H. Vyas —— 删除了创建的软件包，因为他已经没有时间以可接受的质量水平维护它们了。目前还没有官方接手者，因此\
  \ Buster 不包含 `webmin` 软件包。\n\n然而，在 `webmin.com` 网站上有一个非官方软件包。与原始的 Debian 包不同，该软件包是单体式的；所有的配置模块都会默认安装并激活，即使相应的服务没有安装在机器上。\n\
  \n### 安全：更改 root 密码\n\n在首次登录时，使用 root 用户名及其通常密码进行身份验证。建议尽快更改 `webmin` 使用的密码，这样即使它被攻破，服务器的\
  \ root 密码也不会受到影响，即使它赋予了机器重要的管理权限。\n\n注意！由于 `webmin` 拥有许多功能，恶意用户访问它可能会危及整个系统的安全。通常，不建议在具有强安全限制（防火墙、敏感服务器等）的重要系统上使用此类界面。\n\
  \nWebmin 通过 Web 界面使用，但它不需要安装 Apache。本质上，该软件拥有自己集成的微型 Web 服务器。该服务器默认在端口 10000 上进行监听，并接受安全的\
  \ HTTP 连接。\n\n包含的模块涵盖了各种服务，其中：\n\n*   所有基础服务：创建用户和组、管理 `crontab` 文件、init 脚本、查看日志等。\n\
  *   bind：DNS 服务器配置（名称服务）；\n*   postfix：SMTP 服务器配置（电子邮件）；\n*   inetd：`inetd` 超级服务器配置；\n\
  *   quota：用户配额管理；\n*   dhcpd：DHCP 服务器配置；\n*   proftpd：FTP 服务器配置；\n*   samba：Samba\
  \ 文件服务器配置；\n*   software：从 Debian 软件包和系统更新中安装或移除软件。\n\n管理界面可以通过浏览器访问地址 `https://localhost:10000`\
  \ 使用。注意！并非所有模块都可以直接使用。有时必须通过指定相应配置文件的位置和一些可执行文件（程序）来配置它们。当系统无法激活请求的模块时，通常会礼貌地提示你。\n\
  \n### 替代方案：GNOME 控制中心\n\nGNOME 项目还提供了多个管理界面，通常可以通过右上角用户菜单中的“设置”选项访问。`gnome-control-center`\
  \ 是它们所有整合在一起的主程序，但许多系统级配置工具实际上由其他软件包提供（accountsservice、system-config-printer 等）。尽管这些应用程序易于使用，但它们只涵盖了有限的基础服务：用户管理、时间配置、网络配置、打印机配置等。\n\
  \n## 9.4.2. 配置软件包：`debconf`\n\n许多软件包在安装过程中，通过 Debconf 工具回答几个问题后，会自动完成配置。可以通过运行 `dpkg-reconfigure\
  \ package` 来重新配置这些软件包。\n\n在大多数情况下，这些设置非常简单；仅更改配置文件中的几个重要变量。这些变量通常组在两条“分界”线之间，以便软件包的重新配置只影响包围的区域。在其他情况下，如果脚本检测到配置文件被手动修改过，重新配置将不会更改任何内容，以保留这些人工干预（因为脚本无法确保其修改不会破坏现有设置）。\n\
  \n### DEBIAN 策略：保留更改\n\nDebian 策略明确规定，应尽一切保留对配置文件所做的手动更改，因此越来越多的脚本在编辑配置文件时采取了预防措施。通用的原则非常简单：只有当脚本知道配置状态时，它才会进行更改，该状态通过比较文件的校验和值与上一次自动生成的文件的校验和值来验证。如果它们相同，则脚本被授权更改配置文件。否则，它会判定文件已被更改，并询问应该采取什么操作（安装新文件、保存旧文件，或尝试将新更改集成到现有文件中）。\n\
  \n可以使用 `ucf` 程序（来自同名的 Debian 软件包）来实现这种行为。\n\n# 9.5. `syslog` 系统事件\n\n## 9.5.1. 原理与机制\n\
  \n`rsyslogd` 守护进程负责从应用程序和内核收集消息，然后将其分发到日志文件中（通常存储在 `/var/log/` 目录下）。它遵循 `/etc/rsyslog.conf`\
  \ 配置文件。\n\n每个日志消息与一个应用程序子系统（文档中称为“facility”）关联：\n\n*   `auth` 和 `authpriv`：用于认证；\n\
  *   `cron`：来自任务调度服务 `cron` 和 `atd`；\n*   `daemon`：影响没有特殊分类的守护进程（DNS, NTP 等）；\n*\
  \   `ftp`：涉及 FTP 服务器；\n*   `kern`：来自内核的消息；\n*   `lpr`：来自打印子系统；\n*   `mail`：来自电子邮件子系统；\n\
  *   `news`：Usenet 子系统消息（来自管理新闻组的 NNTP —— 网络新闻传输协议服务器）；\n*   `syslog`：来自 `syslogd`\
  \ 服务器本身的消息；\n*   `user`：用户消息（通用）。\n\n\n\n\n\n* `uucp`: 来自 UUCP 服务器的消息（Unix to Unix\
  \ Copy Program，一种显式用于分发电子邮件的旧协议）；\n* `local0` 到 `local7`: 留供本地使用。\n\n每条消息还与优先级相关。以下是按从高到低排序的列表：\n\
  \n* `emerg`: “帮助！”发生紧急情况，系统可能无法使用。\n* `alert`: 快，任何延迟都可能导致危险，必须立即采取行动；\n* `crit`:\
  \ 状况严重；\n* `err`: 错误；\n* `warn`: 警告（潜在错误）；\n* `notice`: 状况正常，但消息很重要；\n* `info`:\
  \ 提示性消息；\n* `debug`: 调试消息。\n\n## 9.5.2 配置文件\n\n`/etc/rsyslog.conf` 文件的语法在 `rsyslog.conf(5)`\
  \ 手册页中有详细说明，但在 `rsyslog-doc` 软件包中也提供了 HTML 文档（`/usr/share/doc/rsyslog-doc/html/index.html`）。其总体原理是编写“选择器（selector）”和“动作（action）”对。选择器定义了所有相关消息，动作描述了如何处理这些消息。\n\
  \n### 9.5.2.1 选择器的语法\n\n选择器是由分号隔开的 `subsystem`.`priority` 对列表（例如：`auth.notice;mail.info`）。星号\
  \ `*` 可以代表所有子系统或所有优先级（例如：`*.alert` 或 `mail.*`）。可以通过逗号分隔多个子系统进行分组（例如：`auth,mail.info`）。指定的优先级也涵盖了相等或更高优先级的消息；因此\
  \ `auth.alert` 表示 `auth` 子系统中 `alert` 或 `emerg` 优先级的消息。以感叹号（!`）为前缀表示相反，换句话说就是严格更低的优先级；因此，`auth.!notice`\
  \ 表示来自 `auth` 且优先级为 `info` 或 `debug` 的消息。以等号（=`）为前缀，则精确且仅对应指定的优先级（`auth.=notice`\
  \ 仅关注来自 `auth` 的 `notice` 优先级的消息）。\n\n选择器列表中的每个元素都会覆盖之前的元素。因此，可以限制一个集合或从中排除某些元素。例如，`kern.info;kern.!err`\
  \ 意味着来自内核的优先级在 `info` 到 `warn` 之间的消息。`none` 优先级表示空集（无优先级），可以用于从消息集中排除某个子系统。因此，`*.crit;kern.none`\
  \ 表示所有优先级等于或高于 `crit` 且不是来自内核的消息。\n\n### 9.5.2.2 动作的语法\n\n* * *\n\n*回归基础* 命名管道，持久管道\n\
  \n命名管道是一种特殊类型的文件，其工作方式类似于传统的管道（你在命令行上使用 `|` 符号创建的管道），但通过文件实现。这种机制的优势在于能够关联两个不相关的进程。写入命名管道的任何内容都会阻塞写入进程，直到另一个进程尝试读取所写的数据。这个第二个进程读取了第一个进程写入的数据后，第一个进程就可以恢复执行。\n\
  \n可以使用 `mkfifo` 命令创建此类文件。\n\n* * *\n\n 各种可能的动作包括：\n\n* 将消息添加到文件（例如：`/var/log/messages`）；\n\
  * 将消息发送到远程 `syslog` 服务器（例如：`@log.falcot.com`）；\n* 将消息发送到现有的命名管道（例如：`|/dev/xconsole`）；\n\
  * 将消息发送给一个或多个用户，如果他们已登录（例如：`root,rhertzog`）；\n* 将消息发送给所有登录用户（例如：`*`）；\n* 在文本控制台中写入消息（例如：`/dev/tty8`）。\n\
  \n* * *\n\n*安全* 转发日志\n\n将最重要的日志记录在单独的机器上（可能专门为此目的设置）是一个好主意，因为这可以防止任何可能的入侵者删除其入侵痕迹（除非他们也攻破了另一台服务器）。此外，在发生严重问题（如内核崩溃）时，你在另一台机器上可以使用日志，这增加了你确定导致崩溃事件序列的机会。\n\
  \n要接受来自其他机器的日志消息，你必须重新配置 `rsyslog`：在实践中，激活 `/etc/rsyslog.conf` 中的现用条目（`$ModLoad\
  \ imudp` 和 `$UDPServerRun 514`）即可。\n\n* * *\n\n## 9.6 inetd 超服务器\n\nInetd（通常被称为“Internet\
  \ 超服务器”）是“服务器的服务器”。它按需执行不常用的服务器，这样它们就不需要持续运行。\n\n`/etc/inetd.conf` 文件列出了这些服务器及其常用端口。`inetd`\
  \ 命令监听所有这些端口；当它检测到任何此类端口的连接时，就会执行相应的服务器程序。\n\n* * *\n\n*Debian 策略* 在 `inetd.conf`\
  \ 中注册服务器\n\n软件包经常想要在 `/etc/inetd.conf` 文件中注册新服务器，但 Debian 策略禁止任何软件包修改其不拥有的配置文件。这就是创建\
  \ `update-inetd` 脚本（在同名软件包中）的原因：它管理配置文件，其他软件包因此可以使用它将新服务器注册到超服务器的配置中。\n\n* * *\n\
  \n`/etc/inetd.conf` 文件的每一行重要内容通过七个字段（用空格分隔）描述一个服务器：\n\n* TCP 或 UDP 端口号，或服务名称（映射\
  \ `/etc/services` 中的标准端口）。\n* Socket 类型：`stream` 用于 TCP 连接，`dgram` 用于 UDP 数据报。\n\
  * 协议：`tcp` 或 `udp`。\n* 选项：两个可能的值 `wait` 或 `nowait`，告诉 `inetd` 是否应该等待启动进程结束再接受另一个连接。对于多路复用的\
  \ TCP 连接，通常可以使用 `nowait`。对于响应 UDP 的程序，只有当服务器能够管理并行连接时才使用 `nowait`。你可以在此字段后加点，随后是分钟允许的最大连接数（默认限制为\
  \ 256）。\n* 以身份运行服务器的用户名。\n* 要执行的服务器程序的完整路径。\n* 参数：这是程序的完整参数列表，包括自身的名称（`argv[0]`）。\n\
  \n以下示例说明了常见情况：\n\n```\n示例 9.1 /etc/inetd.conf 节\ntalk dgram udp wait nobody.tty\
  \ /usr/sbin/in.talkd in.talkd\nfinger stream tcp nowait nobody /usr/sbin/tcpd in.fingerd\n\
  ident stream tcp nowait nobody /usr/sbin/identd -i\n```\n\n`tcpd` 程序经常用于 `/etc/inetd.conf`\
  \ 文件。它通过应用访问控制规则来限制传入连接，规则在 `hosts_access(5)` 手册页中有并在 `/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 中配置。一旦确定连接已授权，`tcpd` 将执行真正的服务器（例如示例中的 `in.fingerd`）。需要注意的是，`tcpd` 依赖于调用它的名称（即第一个参数\
  \ `argv[0]`）来识别要运行的实际程序。因此，你不应该以 `tcpd` 开始参数列表，而应该从被封装的程序开始。\n\n* * *\n\n*社区* Wietse\
  \ Venema\n\nWietse Venema 因其安全专业知识而成为著名的程序员，他是 `tcpd` 程序的作者。他也是模块邮件服务器（SMTP，简单邮件传输协议）的主要创建者，Postfix\
  \ 设计比具有长期安全漏洞的 `sendmail` 更安全、更可靠。\n\n* * *\n\n* * *\n\n*替代方案* 其他 **inetd** 命令\n\
  \n虽然 Debian 默认安装 `openbsd-inetd`，但并不替代方案：我们可以提到 `inetutils-inetd`、`micro-inetd`、`rlinetd`\
  \ 和 `xinetd`。\n\n\n\n\n这种超级服务器的最后一种形式提供了非常有趣的可能性。最值得注意的是，它的配置可以拆分为几个文件（当然存储在 `/etc/xinetd.d/`\
  \ 目录下），这可以使管理员的工作变得轻松。\n\n最后但同样重要的是，甚至可以使用 `systemd` 的套接激活机制来模拟 `inetd` 的行为（参见第\
  \ 9.1.1 节，“systemd 初始化系统”）。\n\n* * *\n\n# 9.7. 使用 `cron` 和 `atd` 调度任务\n\n`cron`\
  \ 是负责执行计划性和循环性命令（每天、每周等）的守护进程；`atd` 则用于处理在未来某个特定时刻执行一次的命令。\n\n在 Unix 系统中，许多任务被安排为定期执行：\n\
  \n*   轮转日志；\n*   更新 `locate` 程序的数据库；\n*   备份；\n*   维护脚本（例如清理临时文件）。\n\n默认情况下，所有用户都可以调度任务执行。因此，每个用户都有自己的\
  \ `crontab`，可以在其中记录计划的命令。可以通过运行 `crontab -e` 进行编辑（其内容存储在 `/var/spool/cron/crontabs/user`\
  \ 文件中）。\n\n* * *\n\n### 安全 限制 `cron` 或 `atd`\n\n你可以通过在 `/etc/cron.allow` 中创建一个显式的授权文件（白名单）来限制对\
  \ `cron` 的访问，在其中指定唯一授权调度命令的用户。所有其他用户将自动失去此功能。相反，如果只想阻止一或两个捣乱分子，可以在显式禁止文件（黑名单）`/etc/cron.deny`\
  \ 中写入他们的用户名。此功能也适用于 `atd`，对应于 `/etc/at.allow` 和 `/etc/at.deny` 文件。\n\n* * *\n\n\
  root 用户有他们自己的 `crontab`，也可以使用 `/etc/crontab` 文件，或者在 `/etc/cron.d` 目录下编写额外的 `crontab`\
  \ 文件。后两种解决方案的优势在于可以指定执行命令时所使用的用户身份。\n\n`cron` 软件包默认包含了一些会执行的计划命令：\n\n*   每小时执行一次\
  \ `/etc/cron.hourly/` 目录下的程序；\n*   每天执行一次 `/etc/cron.daily/` 目录下的程序；\n*   每周执行一次\
  \ `/etc/cron.weekly/` 目录下的程序；\n*   每月执行一次 `/etc/cron.monthly/` 目录下的程序。\n\n许多 Debian\
  \ 软件包依赖此服务：通过将维护脚本放在这些目录中，它们确保了服务的最佳运行。\n\n## 9.7.1. `crontab` 文件的格式\n\n* * *\n\n\
  ### 提示 `cron` 文本快捷键\n\n`cron` 识别某些替换 `crontab` 条目中前五个字段的缩写。它们对应于最经典的调度选项：\n\n* \
  \  `@yearly`: 每年一次（1 月 1 日，00:00）；\n*   `@monthly`: 每月一次（每月 1 号，00:000）；\n*   `@weekly`:\
  \ 每周一次（周日 00:00）；\n*   `@daily`: 每天一次（00:00）；\n*   `@hourly`: 每小时一次（每小时开始时）。\n\n\
  * * *\n\n### 特殊情况 `cron` 与夏令时\n\n在 Debian 中，`cron` 会尽可能地考虑时间变化（针对夏令时，或者实际上针对任何本地时间的重大变化）。因此，本应在从未存在的小时内执行的命令（例如，在法国春季夏令切换期间于凌晨\
  \ 2:30 调定的任务，因为时钟在凌晨 2:00 直接跳到 3:00）将在时间变化后不久执行（即在夏令时间时间的凌晨 3:00 左右）。另一方面，在秋季，本应执行多次的命令（夏令时间凌晨\
  \ 2:30，然后是一小时后的标准时间凌晨 2:30，因为时钟在夏令时间凌晨 3:00 拨回凌晨 2:00）仅将执行一次。\n\n然而，如果不同计划任务的执行顺序以及它们各自执行之间的延迟很重要，你应该检查这些限制条件与\
  \ `cron` 行为的兼容性；如有必要，你可以为每年的两个问题夜晚准备一个特殊的调度。\n\n* * *\n\n`crontab` 的每行有效内容都通过以下六（或七）字段描述一个计划命令：\n\
  \n*   分钟的值（0 到 59 的数字）；\n*   小时的值（0 到 23）；\n*   日期的值（1 到 31）；\n*   月份的值（1 到 12）；\n\
  *   星期的值（0 到 7，其中 1 对应周一，周日由 0 和 7 都表示；也可以使用周几英文名称的前三个字母，例如 `Sun`、`Mon` 等）；\n* \
  \  *（可选）* 必须以该用户身份执行命令的用户名（仅在 `/etc/crontab` 中有效）；\n*   要执行的命令。\n\n## 9.7.2. 使用\
  \ `at` 命令\n\n`at` 在未来的某个特定时刻执行命令。它接受所需的时间和日期作为命令行参数，并将要执行的命令放在其标准输入中。该命令的执行将就像在当前\
  \ shell 中输入的一样。时间按以下惯例表示：`16:12` 或 `4:12pm` 代表下午 4:12。日期可以使用几种欧洲和西方格式指定，包括 `DD.MM.YY`（因此\
  \ `2.07.15` 代表 2015 年 7 月 27 日）、`YYYY-MM-DD`（相同的日期为 `2015-07-27`）、`MM/DD/[CC]YY`（即\
  \ `12/25/15` 或 `12/25/2015` 代表 2015 年 12 月 25 日），或简单的 `MMDD[CC]YY`（因此 `122515` 或\
  \ `12252015` 同样代表 2015 年 12 月 25 日）。如果没有它，命令将在时钟到达指定时间立即执行（当天，如果该时间在当天已过去，则是明天）。你也可以简单地写“today”或“tomorrow”，这是自言自明的。\n\
  \n```bash\nat 09:00 27.07.15 <<END\necho \"Don't forget to wish a Happy Birthday\
  \ to Raphaël!\"\n| mail lolando@debian.org\nEND\n```\n警告：命令将使用 /bin/sh job 31 于\
  \ Mon Jul 27 09:00:00 2015 执行\n\n另一种语法根据给定的时长推后执行：`at now + *number* *period*`。`period`\
  \ 可以是 `minutes`、`hours`、`days` 或 `weeks`。`number` 直接表示在执行命令前必须经过的相应单位数量。\n\n\n\n\
  要取消由 `cron` 调度的任务，只需运行 `crontab -e` 并删除 `crontab` 文件中相应的行即可。对于 `at` 任务，操作同样简单：运行\
  \ `atrm *task-number*`。任务号在你调度任务时由 `at` 命令标出，但你也可以通过 `atq` 命令再次找到它，该命令会列出当前调度的任务列表。\n\
  \n# 9.8. 调度异步任务：anacron\n\n`anacron` 是一个守护进程，用于为并非始终运行的计算机完善 `cron` 功能。由于常规任务通常调度在半夜执行，如果计算机在那个时间处于关机状态，它们将永远不会执行。`anacron`\
  \ 的目的就是执行这些任务，并考虑到计算机未运行的时间段。\n\n请注意，`anacron` 经常会在机器启动后后的几分钟内执行此类活动，这可能会导致计算机响应速度降低。这就是为什么\
  \ `/etc/anacrontab` 文件中的任务是通过 `nice` 命令启动的，这降低了它们的执行优先级，从而限制了它们对系统其他部分的影响。注意，该文件的格式与\
  \ `/etc/crontab` 不同；如果你对 `anacron` 有特殊需求，请参见 anacrontab(5) 手页。\n\n## 回归基础：优先级与 nice\n\
  \nUnix 系统（以及 Linux）是多任务和多用户系统。事实上，多个进程可以并行运行，并属于不同的用户：内核调解不同进程之间的资源访问。作为这项任务的一部分，它具有优先级概念，允许它根据需要让某些进程优于其他进程。当你知道一个进程可以以低优先级运行时，可以通过通过运行\
  \ `nice *program*` 来指示这一点。该程序将获得较少的 CPU 分配，并且对其他运行进程的影响也会更小。当然，如果没有其他进程需要运行，该程序不会被人为限制。\n\
  \n`nice` 通过“友好程度”（niceness）级别工作：正数级（1 到 19）会逐渐降低优先级，而负数级（-1 到 -20）则会增加优先级——但只有 root\
  \ 用户可以使用这些负级。除非另有说明（参见 nice(1) 手页），否则 `nice` 会将当前级别增加 10。\n\n如果你发现一个已经在运行的任务本应该用\
  \ `nice` 启动，现在修复还不太晚；`renice` 命令可以更改已运行进程的优先级，方向上均可（但降低进程的“友好程度”保留给 root 用户）。\n\n\
  安装 `anacron` 软件包将禁用 `cron` 执行 `/etc/cron.hourly/`、`/etc/cron.daily/`、`/etc/cron.weekly/`\
  \ 和 `/etc/cron.monthly/` 下的脚本。这避免了它们被 `anacron` 和 `cron` 重复执行。`cron` 命令保持激活状态，并将继续处理其他调度任务（特别是用户调度的任务）。\n\
  \n# 9.9. 配额\n\n配额系统允许限制分配给用户或用户组的磁盘空间。要设置它，你必须拥有支持它的内核（编译时启用了 `CONFIG_QUOTA` 选项）——Debian\
  \ 内核正是如此。配额管理软件位于 `quota` Debian 包中。\n\n要在文件系统中激活配额，你必须在 `/etc/fstab` 中分别为用户和组组配额指定\
  \ `usrquota` 和 `grpquota` 选项。重启计算机将在没有磁盘活动的情况下更新配额（这是正确统计已用磁盘空间的必要条件）。\n\n`edquota\
  \ *user*`（或 `edquota -g *group*`）允许你在查看当前磁盘空间使用情况的同时更改限制。\n\n## 进阶：使用脚本定义配额\n\n\
  `setquota` 程序可以用于脚本以自动更改许多配额。其 `setquota(8)` 手页详细说明了所使用的语法。\n\n配额系统允许你设置四个限制：\n\n\
  - 两个限制（称为“软限制”和“硬限制”）指的是所消耗的块（blocks）数量。如果文件系统在创建时使用的块大小为 1 kibibyte，则一个块包含来自同一文件的\
  \ 1024 字节。因此，未饱和的块会导致磁盘空间的浪费。然而，100 个块的配额理论上允许存储 102,400 字节，但仅需 100 个每个 500 字节的文件就会饱和，总共仅代表\
  \ 50,000 字节。\n- 两个限制（软限制和硬限制）指的是使用的 inode 数量。每个文件至少占用一个 inode 来存储其信息（权限、所有者、最后访问时间戳等）。因此，它是对用户文件数量的限制。\n\
  \n“软”限制可以被临时超过；用户只会通过 `warnquota` 命令收到他们超出配额的警告，该命令通常由 `cron` 调用。“硬”限制永远不能被超过：系统将拒绝任何导致超过硬配额的操作。\n\
  \n## 词汇：块与 inode\n\n文件系统将硬盘划分为若干块（blocks）——即较小的连续区域。这些块的大小在创建文件系统时定义，通常在 1 到 8 kibibytes\
  \ 之间变化。\n\n一个块可以用于存储文件的实际数据，也可以用于文件系统使用的元数据。在这些元数据中，你会特别发现 inode。inode 使用硬盘上的一个块（但此块不计入块配额，仅计入\
  \ inode 配额），并包含对应文件的信息（名称、所有者等）以及指向实际使用的数据块的指针。对于超过单个 inode 可引用块数量的大文件，存在间接块系统；inode\
  \ 引用一个不直接包含数据的块列表的另一个块列表。\n\n通过 `edquota -t` 命令，你可以定义允许超过软限制的最大授权“宽限期”。在此期限之后，软限制将被视为硬限制，用户必须将其磁盘空间使用减少到限制范围内才能向硬盘写入任何内容。\n\
  \n## 进阶：为新用户设置默认配额\n\n要自动为新用户设置配额，你需要配置一个模板用户（使用 `edquota` 或 `setquota`），并将用户名指定在\
  \ `/etc/adduser.conf` 文件的 `QUOTAUSER` 变量中。此配额配置将自动应用于通过 `adduser` 命令创建的每个新用户。\n\n\
  \n\n由于磁带备份被认为速度太慢且成本高昂，数据将备份在专用服务器的硬盘上。在该服务器上，使用软件 RAID（参见第 12.1.1 节，“软件 RAID”）将保护数据免受硬盘故障的影响。桌面电脑不进行单独备份，但建议用户其在部门文件服务器上的个人账户将被备份。每天都会使用\
  \ `rsync` 命令（来自同名软件包）来备份这些不同的服务器。\n\n## 回到基础：硬链接，文件的第二个名称\n\n硬链接与符号链接不同，它无法与链接的文件区分来。创建硬链接本质上等同于给一个现有文件起第二个名称。这就是为什么删除硬链接只会删除与该文件关联的一个名称。只要该文件仍分配有另一个名称，其中的数据就会一直存在于文件系统中。值得注意的是，与拷贝文件不同，硬链接不会在硬盘上占用额外空间。\n\
  \n使用 `ln `target` `link` 命令创建硬链接。此时 `link` 文件就是 `target` 文件的新名称。硬链接只能在同一个文件系统上创建，而符号链接则不受此限制。\n\
  \n可用的硬盘空间限制了完整的每日备份。因此，在执行 `rsync` 命令之前，会先用硬链接对上次备份的内容进行复制，以防止占用过多的硬盘空间。随后 `rsync`\
  \ 过程只会替换自上次备份以来修改过的文件。通过这种机制，可以在较空间内保留大量的备份。由于所有备份都是立即可用且可访问的（例如，在网络共享的不同目录中），你可以快速地在两个指定日期之间进行比较。\n\
  \n这种备份机制可以通过 `dirvish` 程序轻松实现。它使用一个备份存储空间（在它的术语中称为“bank”），在其中存放带有时间戳的备份集副本（这些集在\
  \ dirvish 文档中被称为“vaults”）。\n\n主配置位于 `/etc/dirvish/master.conf` 文件中。它定义了备份存储空间的位置、要管理的“vaults”列表以及备份过期的默认值。配置的其他部分位于\
  \ `bank`/vault`/dirvish/default.conf` 文件中，包含了对应文件集的特定配置。\n\n示例 9.3. `/etc/dirvish/master.conf`\
  \ 文件：\n```\nbank: /backup exclude: lost+found/ core *~ Runall: root 22:00 expire-default:\
  \ +15 days expire-rule: # MIN HR DOM MON DOW STRFTIME_FMT * * * * * 1+3 months *\
  \ * 1-7 * 1 +1 year * * 1-7 1,4,7,10 1\n```\n\n`bank` 设置指定备份存储的目录。`exclude` 设置允许你指定要从备份中排除的文件（或文件类型）。`Runall`\
  \ 是一个要备份的文件集列表，每个集带有一个时间戳，这允许在备份未恰好在指定时间触发时，为副本分配正确的日期。你必须在实际执行时间之前指定一个时间（根据 `/etc/cron.d/dirvish`，\
  \ Debian 中默认为晚上 10:04）。最后，`expire-default` 和 `expire-rule` 设置定义了备份的过期策略。上面的示例保留了每季度第一个星期日生成的备份，在一年后删除每个月第一个星期日的备份，并在\
  \ 3 个月后删除其他周日的备份。其他每日备份将保留 15 天。规则的顺序很重要，Dirvish 使用最后一个匹配的规则，或者在没有其他 `expire-rule`\
  \ 匹配时使用 `expire-default`。\n\n## 实践中：计划性过期\n\n`dirvish-expire` 并不使用过期规则来执行工作。实际上，过期规则是在创建新的备份副本时应用的，用于定义与该副本关联的过期日期。`dirvish-expire`\
  \ 仅遍历存储的副本并删除过期日期已过的副本。\n\n示例 9.4. `/backup/root/dirvish/default.conf` 文件：\n```\n\
  client: rivendell.falcot.com tree: / xdev: 1 index: gzip image-default: %Y%m%d exclude:\
  \ /var/cache/apt/archives/*.deb /var/cache/man/** /tmp/** /var/tmp/** *.bak\n```\n\
  \n上面的示例指定了要备份的文件集：这些是机器 `rivendell.falcot.com` 上的文件（对于本地数据备份，只需按 `hostname` 指定指定本地机器名称），特别是根树（`tree:\
  \ /`）中的文件，但 `exclude` 中列出的文件除外。备份将局限于一个文件系统的内容（`xdev: 1`）。它将生成保存文件的索引（`index: gzip`），并根据当前日期命名镜像（`image-default:\
  \ %Y%m%d`）。\n\n有许多可用选项，均在 `dirvish.conf(5)` 手册页中有记录。一旦设置了这些配置文件，你就必须使用 `dirvish\
  \ --vault `vault` --init` 命令初始化每个文件集。从那时起，每天调用 `dirvish-runall` 将在删除过期副本后自动创建一个新的备份副本。\n\
  \n## 实践中：通过 SSH 进行远程备份\n\n当 dirvish 需要向远程机器保存数据时，它将使用 `ssh` 连接到该机器并启动 `rsync` 作为服务器。这要求\
  \ root 用户能够自动连接。使用 SSH 身份验证密钥可以实现这一点（参见第 9.2.1.1 节，“基于密钥的认证”）。\n\n## 9.10.2. 恢复没有备份的机器\n\
  \n未备份的桌面电脑很容易从用 `Simple-CDD` 准备的自定义 DVD-ROM 重新安装（参见第 12.3.3 节，“Simple-CDD: 一体解决方案”）。由于这是从头开始的安装，它会丢失初始安装后可能进行的任何自定义。这没关系，因为所有系统都连接到中央\
  \ LDAP 目录用于账户，且大多数桌面应用程序已通过 dconf 进行了预配置（更多信息请参见第 13.3.1 节，“GNOME”）。\n\nFalcot Corp\
  \ 的管理员意识到其备份策略的局限性。由于他们无法像放在防火箱的磁带那样保护备份服务器，他们将其安装在一个独立的房间里，这样服务器机房火灾等灾难就不会将备份和其他一切一起摧毁。此外，他们每周在\
  \ DVD-ROM 上进行一次增量备份——仅包含自上次备份以来修改的文件。\n\n## 进阶：备份 SQL 和 LDAP 服务\n\n许多服务（如 SQL 或\
  \ LDAP 数据库）无法通过简单的复制文件来备份（除非在创建备份期间正确地中断了它们，这通常很有问题，因为它们旨在始终可用）。因此，有必要使用“导出”机制创建一个可以安全备份的“数据转储”。这些文件通常很大，但压缩率很高。为了减少所需的存储空间，你每周只存储一个完整的文本文件，每天生成一个\
  \ **差异**，该差异通过类似 `diff `file_from_yesterday` `file_from_today`` 的命令创建。`xdelta` 程序从二进制转储生成增量差异。\n\
  \n## 文化：TAR，磁带备份的标准\n\n在历史上，Unix 上制作备份最简单的方法是在磁带上存储 *TAR* 归档。`tar` 命令的名字就源于“Tape\
  \ ARchive”（磁带归档）。\n\n\n\n\n# 9.11.1. 引言\n\n`hotplug` 内内核子系统通过加载相应的驱动程序并创建相应的设备文件（借助\
  \ `udevd` 的帮助）来动态处理设备的添加和删除。在现代硬件和虚拟化技术下，几乎所有设备都可以热插拔：从常见的 USB/PCMCIA/IEEE 1394\
  \ 外围设备到 SATA 硬盘，还包括 CPU 和内存。\n\n内核拥有一个数据库，将每个设备 ID 与所需的驱动程序相关。该数据库在启动期间被用于加载在不同不同总线上检测到的所有外围设备的驱动程序，同时当连接额外的热插拔设备时也会使用它。一旦设备准备就绪，就会向\
  \ `udevd` 发送消息，以便在 `/dev/` 中创建相应的条目。\n\n# 9.11.2. 命名问题\n\n在热插拔连接出现之前，为设备分配固定名称是很容易的。这仅基于设备在各自总线上的位置。但当此类设备在总线上可以来来去去时，这就不可能的。典型案例是使用数码相机和\
  \ USB 闪盘，两者在计算机看来都显示为磁盘驱动器。第一个连接的可能是 `/dev/sdb`，第二个可能是 `/dev/sdc`（而 `/dev/sda` 代表电脑自身的硬盘）。设备名称不是固定的；它取决于设备连接的顺序。\n\
  \n此外，越来越多的驱动程序对设备的主号/次号（major/minor numbers）使用动态值，这使得为给设备建立静态条目是不可能的，因为这些基本特征在重启后可能会变化。\n\
  \n`udev` 的创建正是为了解决这个问题。\n\n# 9.11.3. udev 的工作原理\n\n当 `udev` 收到内核通知新设备出现时，它会通过查询\
  \ `/sys/` 中的对应条目来收集给定设备的各种信息，特别是那些能够唯一标识它的信息（如网卡的 MAC 地址、某些 USB 设备的序列号等）。\n\n在拥有所有信息后，`udev`\
  \ 随后会查询 `/etc/udev/rules.d/` 和 `/lib/udev/rules.d/` 中包含的所有规则。在此过程中，它将决定如何命名设备、创建哪些符号链接（以提供备用名称）以及执行哪些命令。所有这些文件都会被查询，且规则将按顺序评估（除非文件使用了“GOTO”\
  \ 指令）。因此，一个特定的事件可能对应多个规则。\n\n规则文件的语法非常简单：每行包含选择准则和变量赋值。前者用于选择需要响应的事件，后者定义了要采取的操作。它们之间仅简单地用逗号分隔，操作符隐式地区分选择准则（使用比较运算符，如\
  \ `==` 或 `!=`）或赋值指令（使用如 `=`、`+=` 或 `:=` 等运算符）。\n\n比较运算符用于以下变量：\n\n- `KERNEL`：内核分配给设备的名称；\n\
  - `ACTION`：对应于事件的操作（设备被添加时为“add”，当设备被移除时为“remove”）；\n- `DEVPATH`：设备在 `/sys/` 中条目的路径；\n\
  - `SUBSYSTEM`：生成请求的内核子系统（有很多，但几个例子包括“usb”、““ide”、““net”、““firmware”等）；\n- `ATTR{attribute}`：设备\
  \ `/sys/$devpath/` 目录下 `attribute` 文件的内容。你可以在这里找到 MAC 地址和其他与总线相关的标识符；\n- `KERNELS`、`SUBSYSTEMS`\
  \ 和 `ATTRS{attributes}` 是变体，它们将尝试匹配当前设备的一个父设备上的不同选项；\n- `PROGRAM`：将测试委托给指定的程序（如果程序返回\
  \ 0 则为真，否则为假）。程序的标准输出内容被存储起来，以便供 `RESULT` 测试复用；\n- `RESULT`：对上一次调用 `PROGRAM` 时存储的标准输出上执行测试。\n\
  \n右侧的操作数可以使用模式表达式来同时匹配多个值。例如，`*` 匹配任何字符串（即使是空字符串）；`?` 匹配任何字符，而 `[]` 匹配方括号内列出的字符集（如果第一个字符是感叹号，则匹配相反字符，并且指示了连续的字符范围，如\
  \ `a-z`）。\n\n关于赋值运算符，=` 分配一个值（并替换当前值）；对于列表，它会被清空并仅包含所分配的值。`:=` 执行相同的操作，但会防止后续对同一变量的更改。至于\
  \ `+=`，它会向列表添加一个项。以下变量可以被更改：\n\n- `NAME`：要在 `/dev/` 中创建的设备文件名。只有第一次赋值有效；其他的会被忽略；\n\
  - `SYMLINK`：指向同一台设备的符号链接列表；\n- `OWNER`、`GROUP` 和 `MODE` 定义了拥有设备的用户和组，以及相关的权限；\n\
  - `RUN`：响应此事件要执行的程序列表。\n\n赋值给这些变量的值可以使用许多替换符：\n\n- `$kernel` 或 `%k`：等同于 `KERNEL`；\n\
  - `$number` 或 `%n`：设备的顺序号，例如对于 `sda3`，它将是“3”；\n- `$devpath` 或 `%p`：等同于 `DEVPATH`；\n\
  - `$attr{attribute}` 或 `%s{attribute}`：等同于 `ATTRS{attribute}`；\n- `$major` 或 `%M`：内核的主号；\n\
  - `$minor` 或 `%m`：设备的次号；\n- `$result` 或 `%c`：由 `PROGRAM` 调用的标准输出字符串；\n- 最后，`%%`\
  \ 和 `$$` 分别代表百分号和美元符号。\n\n上述列表是不完整的（仅包含了最重要的参数），但 `udev(7)` 手册应该是详尽的。\n\n# 9.11.4.\
  \ 具体示例\n\n让我们考虑一个 USB 闪盘的情况，并尝试为其分配一个固定名称。首先，你必须找到能够唯一标识它的元素。为此，插入它并运行 `udevadm\
  \ -a /dev/sdc`（将 `/dev/sdc` 替换为实际名称）。\n\n```\nudevadm -a /dev/sdc\n```\n查看 `/devices/pci0000:00/0000:00:10.0/usb2/2-1/2-1:1.0/host4/target4:0/4:0/block/sdc`:\
  \ `KERNEL=\"sdc\" SUBSYSTEM=\"block\" DRIVER=\"\" ATTR{hidden}=\"0\" ATTR{events}=\"\
  media_change\" ATTR{ro}=\"0\" ATTR{removable}=\"1\" ATTR{events_async}==\"\" ATTR{alignment_offset}=\"\
  0\" ATTR{capability}=\"51\" ATTR{poll_msecs}==\"-1\" ATTR{stat}=\" 130 0 6328 435\
  \ 0 0 252 252 0 0\" ATTR{size}=\"151024\" ATTR{range}=\"16\" ATTR{ext_range}=\"\
  256\" ATTR{inflight}==\" 0 0\"`\n\n查看 `/devices/pci0000:00/0000:00:10.0/usb2/2-1`:\
  \ `KERNELS=\"2-1\" SUBSYSTEMS=\"usb\" DRIVERS=\"usb\" ATTRS{bDeviceProtocol}=\"\
  00\" ATTRS{bNumInterfaces}==\" 1\" ATTRS{busnum}=\"2\" ATTRS{quirks}=\"0x0\" ATTRS{authorized}=\"\
  1\" ATTRS{ltm_capable}=\"no\" ATTRS{speed}=\"480\" ATTRS{product}==\"TF10\" ATTRS{manufacturer}==\"\
  TDK LoR\" [...] ATTRS{serial}==\"07032998B6AB77\"`\n\n要创建新规则，你可以对设备变量进行测试，也可以对其中一个父设备的变量进行测试。上面的情况允许我们创建如下所示的两条规则：\n\
  \n```\nKERNEL==\"sd?\", SUBSYSTEM=\"block\", ATTRS{serial}==\"07032998B6AB77\",\
  \ SYMLINK+=\"usb_key/disk\"\nKERNEL==\"sd?[0-9]\", SUBSYSTEM=\"block\", ATTRS{serial}==\"\
  07032998B6AB77\", SYMLINK+=\"usb_key/part%n\"\n```\n\n一旦这些规则设置在文件中（例如名为 `/etc/udev/rules.d/010_local.rules`），你只需要拔掉并重新连接\
  \ USB 闪盘。你可以看到 `/dev/usb_key/disk` 代表与 USB 闪盘相关的磁盘，而 `/dev/usb_key/part1` 是它的第一个分区。\n\
  \n\n\n\n\n# 进阶：调试 `udev` 的配置\n\n与许多守护进程一样，`udevd` 将日志存储在 `/var/log/daemon.log` 中。但默认情况下，它的日志并不详细，通常不足以理解发生了什么。使用\
  \ `udevadm control --log-priority=info` 命令可以增加日志详细程度并解决这个问题。`udevadm control --log-priority=err`\
  \ 则返回默认的日志详细级别。\n\n---\n\n# 9.12. 电源管理：高级配置与电源接口 (ACPI)\n\n电源管理主题往往充满问题。事实上，要正确挂起计算机需要所有计算机设备驱动程序都了解如何进入待机状态，并在唤醒时正确重新配置设备。遗憾的是，仍然有一些设备在\
  \ Linux 下无法良好休眠，因为它们的制造商没有提供所需的规范。\n\nLinux 支持 `ACPI`（高级配置和电源接口）——这是电源管理领域的最新标准。`acpid`\
  \ 包提供了一个守护进程，用于寻找与电源管理相关的事件（如笔记本电脑在交流电源和电池电源之间切换），并根据响应执行各种命令。\n\n---\n\n## 注意：显卡与待机\n\
  \n当待机功能无法正常工作时，显卡驱动程序通常是罪魁祸首。在这种情况下，测试最新版本的 X.org 图服务器是一个好主意。\n\n---\n\n在对许多 Unix\
  \ 系统的通用服务进行概述后，我们将关注被管理机器的环境：网络。网络的正常工作需要许多服务。它们将在下一章中讨论。\n\n# 第 10 章 网络基础设施\n\n\
  Linux 继承了整个 Unix 网络遗产，Debian 提供了一套完整的工具来创建和管理这些工具。本章将回顾这些工具。\n\n## 10.1. 网关\n\n\
  网关是连接多个网络的系统。该术语通常指本地网络通往所有外部 IP 地址的强制路径上的“出口”。网关连接在一起的每一个网络，并作为路由器在各个接口之间传递 IP\
  \ 包。\n\n---\n\n## 回顾：IP 包\n\n现在的大多数网络使用 `IP` 协议（网协议）。该协议将传输的数据分割成有限大小的数据包。每个包除了负载数据外，还包含其正确路由所需的若干详细信息。\n\
  \n---\n\n## 回顾：TCP/UDP\n\n许多程序并不处理单个数据包，尽管它们传输的数据确实通过 `IP` 传输；它们通常使用 `TCP`（传输控制协议）。`TCP`\
  \ 是 `IP` 之上的层，允许在两点之间建立专门用于数据流的连接。程序随后只看到一个入口，可以向其中输入数据，并保证相同的数据会在连接另一端的出口处无损地（且以相同的顺序）退出。尽管在底层可能会发生许多类型的错误，但它们会被\
  \ `TCP` 补偿：丢失的包会被重传，乱序到达的包（例如，如果它们使用了不同的路径）将经过适当的重新排序。\n\n另一个依赖 `IP` 的协议是 `UDP`（用户数据报协议）。与\
  \ `TCP` 不同，它是面向数据包的。它的目标不同：`UDP` 的目的仅是将一个包从一个应用程序传输到另一个应用程序。该协议不会尝试补偿路径上可能的数据包丢失，也不保证接收到的数据包顺序与发送时的顺序一致。该协议的主要优势是极大地提高了延迟，因为单个数据包的丢失不会在等待重传丢失包的期间推迟所有后续数据包的接收。\n\
  \n`TCP` 和 `UDP` 都涉及端口，端口是与机器上特定应用程序建立通信的“扩展号码”。这一概念允许与同一通信者并行保持几个不同的通信，因为这些通信可以通过端口号来区分。\n\
  \n这些端口号中的某些由 `IANA`（互联网分配编号机构）标准化——因关联网络服务而“众周知”。例如，`TCP` 端口 `25` 通常用于电子邮件服务器。\n\
  \n→ [`www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml`](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml)\n\
  \n---\n\n当本地网络使用私有地址范围（在网上不可路由）时，网关需要实现`地址伪装`（address masquerading），以便网络上的机器能与外界通信。伪装操作是网络层上运行的一种代理：从内部机器发出的每个传连接都被替换为网关自身的连接（因为网关确实有一个外部的可路由地址），通过伪装连接的数据被发送到新连接，而返回的回应数据则通过伪装连接发送回内部机器。网关为此使用了一范围专用的\
  \ `TCP` 端口，这些通常是非常大的数字（超过 60000）。随后来自内部机器的每个连接在外界看来都是来自这些预留端口之一的连接。\n\n---\n\n##\
  \ 知识：私有地址范围\n\n`RFC 1918` 定义了三类 `IPv4` 地址范围，这些范围并非在互联网上路由，仅用于本地网络。第一个是 `10.0.0.0/8`（参见侧边栏\
  \ 回顾：基础网络概念（以太网、IP 地址、子网、广播）），它是一个 A 类范围（带有 2²⁴ 个地址）。第二个是 `172.16.0.0/12`，汇总了 16\
  \ 个 B 类范围（`172.16.0.0/16` 到 `172.31.0.0/16`），每个包含 2¹⁶ 个地址。最后，`192.168.0.0/16` 是\
  \ B 类范围（256 个 C 类范围，`192.168.0.0/24` 到 `192.168.255.0/24`），带有 2⁸ 个地址。\n\n→ [`www.faqs.org/rfcs/rfc918.html`](http://www.faqs.org/rfcs/rfc918.html)\n\
  \n---\n\n网关还可以执行两种类型的*网络地址转换*（或简称为 NAT）。第一种*目标地址 NAT*（DNAT）是一种用于修改（（通常是）入站连接的目的\
  \ IP 地址（和/或 `TCP` 或 `UDP` 端口）的技术。连接跟踪机制还会修改同一连接中的后续包，以确保通信的连续性。第二种 NAT 是*源地址 NAT*（SNAT），其中*伪装*是其特殊情况；SNAT\
  \ 修改（通常是）出站连接的源 IP 地址（和/或 `TCP` 或 `UDP` 端口）。对于 DNAT，连接中的所有包都由连接跟踪机制进行妥善处理。请注意，NAT\
  \ 仅与 `IPv4` 及其有限的地址空间相关；在 `IPv6` 中，地址的广泛可用性通过允许所有“内部”地址在互联网上直接路由，极大地减少了 NAT 的用处（这并不意味着内部机器是可访问的，因为中间防火墙可以过滤流量）。\n\
  \n---\n\n## 回顾：端口转发\n\nDNAT 的具体应用是*端口转发*。指向机器上给定端口的入站连接被转发到另一台机器上的端口。不过，可能存在其他方案来实现类似的效果，特别是在应用层使用\
  \ `ssh`（参见 第 9.2.1.3 节，“使用端口转发创建加密隧道”）或 `redir`。\n\n---\n\n理论足够了，让我们进入实践。将一个 Debian\
  \ 系统变成网关只需通过 `/proc/` 虚拟文件系统在 Linux 内核中启用相应的选项：\n\n\n\n\n\n# `echo 1 > /proc/sys/net/ipv4/conf/default/forwarding`\n\
  \n如果 `/etc/sysctl.conf` 将 `net.ipv4.conf.default.forwarding` 选项设置为 `1`，则该选项可以在启动时自动启用。\n\
  \n示例 10.1. `/etc/sysctl.conf` 文件：\n```\nnet.ipv4.conf.default.forwarding = 1\nnet.ipv4.conf.default.rp_filter\
  \ = 1\nnet.ipv4.tcp_syncookies = 1\n```\n\n通过简单将手动命令中的 `ipv4` 替换为 `ipv6` 并使用 `/etc/sysctl.conf`\
  \ 中的 `net.ipv6.conf.all.forwarding` 行，可以为 IPv6 相同的效果。\n\n启用 IPv4 伪装是一个稍微复杂的操作，涉及配置\
  \ `netfilter` 防火墙。\n\n同样，使用 NAT（用于 IPv4）需要配置 `netfilter`。由于该组件的主要目的是数据包过滤，详细信息列在第\
  \ 14 章：“安全”（参见第 14.2 节，“防火墙或数据包过滤”）。\n\n# 10.2. X.509 证书\n\n当许多基于加密协议构建的网络服务需要某种中央认证时，证书是重要的构建模块。\n\
  \n其中`SSL`（安全套接层）由 Netscape 发明，用于加密到网络服务器的连接。它后来由 IETF 以 `TLS`（传输层安全）的名称进行了标准化。从那时起\
  \ `TLS` 继续演进，如今由于发现了多个设计缺陷，`SSL` 已被废弃。\n\n`TLS` 协议的主要目标是为两个或多个通信的计算机应用程序提供隐私性和数据完整性。互联网上最常见的情况是客户端（例如网络浏览器）与服务器之间的通信。\n\
  \n信息交换需要一个密钥对，其中包含一个包含所有者身份信息的公钥，并与私钥相匹配。私钥必须保密，否则安全性就会受到损害。然而，任何人创建密钥对，在上面存储任何身份，并假装成他们选择的身份。一种解决方案涉及“证书颁发机构”（CA）的概念，该概念由\
  \ `X.509` 标准正式化。该术语涵盖一个持有被称为“根证书”的可信密钥对的实体。此证书仅用于其他证书（密钥对）签名，前提是已采取适当步骤检查密钥对上存储的身份。使用\
  \ `X.509` 的应用程序如果知道受信任的根证书，就可以检查提交给它们的证书。\n\n你可以实现一个 `CA`（如第 10.2.2 节，“公钥基础结构：easy-rsa”所示），但如果你打算将证书用于网站，你需要依赖受信任的\
  \ `CA`。价格差异很大，但有可能花费很少甚至不花钱就实现极高的安全性。\n\n## 10.2.1. 创建免费受信任证书\n\n许多程序默认创建并使用“蛇油”证书（参见侧边栏\
  \ SECURITY 蛇油 SSL 证书）。幸运的是，`certbot` 包提供了我们创建自己的受信任证书所需的所有内容，由“Lets Encrypt”倡议提供（参见侧边栏\
  \ CULTURE Let's Encrypt 倡议），它也可以用于邮件传输代理（`Postfix`）和邮件投递代理（`Dovecot`、`Cyrus` 等）。\n\
  \nFalcot 管理员只想为他们运行 Apache 网站创建一个证书。有一个方便的 `certbot` Apache 插件可以自动编辑 Apache 配置以提供获取的证书，因此他们使用了它：\n\
  \n```bash\napt install python-certbot-apache\ncertbot --apache\n```\n保存调试日志到 /var/log/letsencrypt/letsencrypt.log\
  \ 已选插件：验证器 apache, 安装程序 apache 输入电子邮件地址（用于紧急更新和安全通知）（输入 'c' 取消）: admin@falcot.com\n\
