  \n# 14.5. SELinux 简介\n\n## 14.5.1. 原则\n\nSELinux (*Security Enhanced Linux*) 是构建在\
  \ Linux 的 LSM (*Linux Security Modules*) 接口之上的*强制访问控制*系统。在实践中，内核在每次系统调用之前都会查询 SELinux，以确定进程是否有权执行给定的操作。\n\
  \nSELinux 使用一组规则——统称为*策略*（policy）——来授权或禁止操作。这些规则很难创建。幸运的是，系统提供了两种标准策略（*targeted*“目标型”和\
  \ *strict*“严格型”），以避免大部分的配置工作。\n\n在 SELinux 中，权限的管理与传统的 Unix 系统完全不同。进程的权限取决于其*安全上下文*（security\
  \ context）。上下文由启动进程的用户*身份*（identity）、以及该用户当时所持有的*角色*（role）和*域*（domain）定义。权限实际上取决于域，但域之间的转换由角色控制。最后，角色之间可能的转换取决于用户身份。\n\
  \n图 14.1. 安全上下文与 Unix 用户![Security contexts and Unix users](img/selinux-context.png)\n\
  \n在实践中，在登录期间，用户会被分分配一个默认的安全上下文（取决于他们应该能够许可的角色）。这定义了当前的域，从而定义了所有新子进程将携带的域。如果你想更改当前角色及其关联的域，必须调用\
  \ `newrole -r role_r -t domain_t`（通常一个给角色只允许一个域，因此 `-t` 参数通常可以省略）。此命令通过要求输入密码来验证你的身份。此功能禁止了程序自动切换角色。此类更改只有在\
  \ SELinux 策略中显式允许的情况下才能发生。\n\n显然，权限并不适用于所有*对象*（文件、目录、套接字、设备等）。它们可能因对象而异。为了实现这一点，每个对象都关联到一个*类型*（type）（这被称为标记）。因此，域的权限通过对这些类型允许（或不允许）的操作集来表示（间接地，对所有标记为给定类型的对象生效）。\n\
  \n* * *\n\n*额外说明* 域和类型是等价的\n\n在内部，域只是一个类型，但仅适用于进程的类型。这就是为什么域的后缀和对象的类型一样都是 `_t`。\n\
  \n* * *\n\n默认情况下，程序从启动它的用户那里继承其域，但标准的 SELinux 策略期望许多重要程序在专门的域中运行。为了实现这一点，这些可执行文件被标记了专门的类型（例如，**ssh**\
  \ 被标记为 `ssh_exec_t`，当程序启动时，它会自动切换到 `ssh_t` 域）。这种自动域转换机制使得仅授予每个程序所需的权限成为可能。这是 SELinux\
  \ 的基本原则。\n\n图 14.2. 域之间的自动转换![Automatic transitions between domains](img/selinux-transitions.png)\n\
  \n* * *\n\n*实践中* 查找安全上下文\n\n要找到给定进程的安全上下文，你应该使用 `ps` 的 `Z` 选项。\n\n```\n$ ps axZ\
  \ | grep vstfpd\nsystem_u:system_r:ftpd_t:s0 2094 ? Ss 0:00 /usr/sbin/vsftpd\n```\n\
  \n第一个字段包含身份、角色、域和 MCS 级别，用冒号分隔。MCS 级别（*多分类安全*）是一个干预机密性策略设置的参数，它根据文件的敏感性来调节对文件的访问。该功能将在书中不再解释。\n\
  \n若要在 shell 中查找当前的安全上下文，你应该调用 `id -Z`。\n\n```\n$ id -Z\nunconfined_u:unconfined_r:unconfined_t:s0-s0:c0.1023\n\
  ```\n\n最后，要找到分配给文件的类型，你可以使用 `ls -Z`。\n\n```\n$ ls -Z test /usr/bin/ssh\nunconfined_u:object_r:user_home_t:s0\
  \ test system_u:object_r:ssh_exec_t:s0 /usr/bin/ssh\n```\n\n值得注意的是，分配给文件的身份和角色并没有特殊意义（它们从未被使用），但为了统一，所有对象都分配分配了安全上下文。\n\
  \n* * *\n\n## 14.5.2. 设置 SELinux\n\nSELinux 支持内置在 Debian 提供的标准内核中。核心 Unix 工具无需任何修改即可支持\
  \ SELinux。因此，启用 SELinux 相对容易。\n\n执行 `apt install selinux-basics selinux-policy-default`\
  \ 命令将自动安装配置 SELinux 系统所需的包。\n\n`selinux-policy-default` 软件包包含了一组标准规则。默认情况下，该策略仅限制几个广泛开放服务的访问。用户会话不会受到限制，因此\
  \ SELinux 不太可能阻止合法的用户操作。然而，这确实增强了运行在机器上的系统服务的安全性。要设置与旧“strict”规则同的策略，你只需要禁用 `unconfined`\
  \ 模块（模块管理在本节中将详细介绍）。\n\n一旦安装了策略，你就应对所有可用文件进行标记（这意味着为它们分配一个类型）。此操作必须通过 `fixfiles\
  \ relabel` 手动启动。\n\n\n\n\n\nSELinux 系统现在已就绪。要启用它，您应该向 Linux 内核添加 `selinux=1 security=selinux`\
  \ 参数。`audit=1` 参数会启用 SELinux 日志记录，记录所有被拒绝的操作。最后，`enforcing=1` 参数将规则投入应用：如果没有它，SELinux\
  \ 将以默认的 `permissive`（允许）模式运行，此时被拒绝的操作会被记录但仍会执行。因此，您应该修改 GRUB 引导加载程序的配置文件以附加所需的参数。一种简单的方法是修改\
  \ `/etc/default/grub` 中的 `GRUB_CMDLINE_LINUX` 变量并运行 `update-grub`。SELinux 将在重启后变为激活。\n\
  \n值得注意的是，`selinux-activate` 脚本会自动执行这些操作，并在下次启动时强制进行标记处理（这避免了在 SELinux 尚未激活且正在标记期间创建新的未标记文件）。\n\
  \n## 14.5.3. 管理 SELinux 系统\n\nSELinux 策略是一组模块化的规则集，其安装过程会根据已安装的服务检测并启用所有相关模块。因此，系统可以立即运行。然而，当在\
  \ SELinux 策略之后安装服务时，您必须能够手动启用相应的模块。这就是 `semodule` 命令的用途。此外，您必须能够定义每个用户可以授权的角色，这可以通过\
  \ `semanage` 命令完成。\n\n这两个命令可以用于修改当前的 SELinux 配置，该配置存储在 `/etc/selinux/default/` 中。与在\
  \ `/etc/` 中可以找到的其他配置文件不同，所有这些文件都不能通过手动修改。您应该使用专为此目的设计的程序。\n\n### 深入学习 更多文档\n\n由于\
  \ NSA（美国安全局）没有提供任何官方文档，社区建立了一个 wiki 来弥补。它汇了大量信息，但您必须意识到，大多数 SELinux 贡献者是 Fedora\
  \ 用户（该发行版默认启用 SELinux）。因此，文档倾向于专门处理该发行版的内容。\n\n→ [`selinuxproject.org`](https://selinuxproject.org)\n\
  \n您还应该查看专门的 Debian wiki 页面以及 Russell Coker 的博客，他是致力于工作 SELinux 支持的最活跃的 Debian 开发者之一。\n\
  \n→ [`wiki.debian.org/SELinux`](https://wiki.debian.org/SELinux) → [`etbe.coker.com.au/tag/selinux/`](https://etbe.coker.com.au/tag/selinux/)\n\
  \n### 14.5.3.1. 管理 SELinux 模块\n\n可用的 SELinux 模块存储在 `/usr/share/selinux/default/`\
  \ 目录下。要在当前配置中启用这些模块之一，应使用 `semodule -i module.pp.bz2`。`.pp.bz2` 扩展表示 `policy package`（使用\
  \ bzip2 压缩）。从当前配置中删除模块使用 `semodule -r module`。最后，`semodule -l` 命令列出当前安装的模块，并输出它们的版本号。可以使用\
  \ `semodule -e` 选择性地启用模块，使用 `semodule -d` 禁用。\n\n```\nsemodule -i /usr/share/selinux/default/abrt.pp.bz2\n\
  libsemanage.semanage_direct_install_info: abrt module will be disabled after install\
  \ as there is a disabled instance of this module present in the system.\nsemodule\
  \ -l\naccountsd acct [...]\nsemodule -e abrt\nsemodule -d accountsd\nsemodule -l\n\
  abrt acct [...]\nsemodule -r abrt\nlibsemanage.semanage_direct_remove_key: abrt\
  \ module at priority 100 is now active.\nsemodule -l\n```\n\n`semodule` 会立即加载新配置，除非您使用\
  \ `-n` 选项。值得注意的是，该程序默认作用于当前配置（由 `/etc/selinux/config` 中的 `SELINUXTYPE` 变量指示），但您可以通过指定\
  \ `-s` 选项修改另一个配置。\n\n### 14.5.3.2. 管理身份\n\n每当用户登录时，他们都会被分配一个 SELinux 身份。该身份定义了他们能够授权的角色。这两个映射（从用户到身份，以及从该身份到角色）可以使用\
  \ `semanage` 命令进行配置。\n\n您绝对应该阅读 `semanage(8)` 手册页。所有管理的概念都有它们自己的手册页；例如 `semanage-login(8)`。尽管命令的语法对于所有管理的概念往往很相似，但建议阅读其手册页。您将发现大多数子命令的通用选项：`-a`\
  \ 添加、`-d` 删除、`-m` 修改、`-l` 列出以及 `-t` 指明类型（或域）。\n\n`semanage login -l` 列出用户标识符与 SELinux\
  \ 身份之间的当前映射。没有显式记录的用户将获得 `__default__` 条目中指定的身份。`semanage login -a -s user_u user`\
  \ 命令将 `user_u` 身份关联到给定用户。最后，`semanage login -d user` 删除分配给此用户的映射条目。\n\n```\nsemanage\
  \ login -a -s user_u rhertzog\nsemanage login -l\nLogin Name SELinux User MLS/MCS\
  \ Range Service __default__ unconfined_u s0-s0:c0.c1023 * rhertzog user_u s0 * root\
  \ unconfined_u s0-s0:c0.c1023 *\nsemanage login -d rhertzog\n```\n\n`semanage user\
  \ -l` 列出 SELinux 用户身份与允许的角色之间的映射。添加新身份需要定义相应的角色以及用于为个人文件（`/home/user/*`）分配类型的标记缀。前缀必须在\
  \ `user`、`staff` 和 `sysadm` 之间选择。`staff` 前缀产生类型为 `staff_home_dir_t` 的文件。使用 `semanage\
  \ user -a -R roles -P prefix` 创建新的 SELinux 用户身份。最后，可以使用 `semanage user -d` 移除身份。\n\
  \n```\nsemanage login -a -s user_u rhertzog \nsemanage login -l\nLogin Name SELinux\
  \ User MLS/MCS Range Service __default__ unconfined_u s0-s0:c0.c1023 * rhertzog\
  \ user_u s0 * root unconfined_u s0-s0:c0.c1023 *\nsemanage login -d rhertzog\n```\n\
  （注：此节的源文本包含一些乱码/重复字符串；我已根据提供的命令上下文对逻辑进行了清理）。\n\n### 14.5.3.3. 管理文件上下文、端口和布尔值\n\n\
  每个 SELinux 模块提供一组文件标记规则，但也可以添加自定义标记规则以适应特定情况。例如，如果您想让 Web 服务器能够读取 `/srv/www/` 文件层次结构中的文件，可以执行\
  \ `semanage fcontext -a -t httpd_sys_content_t \"/srv/www(/.*)?\"` 然后运行 `restorecon\
  \ -R /srv/www/`。前者命令注册新的标记规则，后者根据标记规则重置文件类型。\n\n同样，TCP/UDP 端口的标记方式确保只有相应的守护进程可以监听它们。例如，如果您想让\
  \ Web 服务器能够监听 8080 端口，应运行 `semanage port -m -t http_port_t -p tcp 8080`。\n\n某些 SELinux\
  \ 模块导出布尔选项，您可以调整这些选项来更改默认规则的行为。可以使用 `getsebool` 工具检查这些选项（`getsebool boolean` 显示一个选项，`getsebool\
  \ -a` 显示所有选项）。`setsebool boolean value` 命令更改布尔选项的当前值。`-P` 选项使更改永久，这意味着新值将成为默认值并在重启后保持有效。下面的示例允许\
  \ Web 服务器访问主目录（当用户在 `~/public_html/` 中有个人网站时非常用）。\n\n\n\n\n\n`getsebool httpd_enable_homedirs`\
  \ off\n`setsebool -P httpd_enable_homedirs` on\n`getsebool httpd_enable_homedirs`\
  \ on\n\n## 14.5.4 适配规则\n\n由于 SELinux 策略是模块化的，为那些缺少策略的（可能是自定义）应用程序开发新模块可能会很有趣。这些新模块将完善\
  \ `reference policy`（引用策略）。\n\n创建新模块需要 `selinux-policy-dev` 软件包，以及 `selinux-policy-doc`。后者包含了标准规则的文档（`/usr/share/doc/selinux-policy-doc/html/`）以及作为模板创建新模块的示例文件。安装这些文件并仔细研究它们：\n\
  \n```\ncp /usr/share/doc/selinux-policy-doc/Makefile Makefile\ncp /usr/share/doc/selinux-policy-doc/example.fc\
  \ ./\ncp /usr/share/doc/selinux-policy-doc/example.if ./\ncp /usr/share/doc/selinux-policy-doc/example.te\
  \ ./\n```\n\n`.te` 文件是最重要的。它定义了规则。`.fc` 文件定义了“文件上下文”（file contexts），即分配给与此模块相关的文件的类型。`.fc`\
  \ 文件中的数据在标记步骤中生效。最后，`.if` 文件定义了模块的接口：它是一组“公共函数”，其他模块可以使用这些函数来与你正在创建的模块进行正确的交互。\n\
  \n### 14.5.4.1 编写 .fc 文件\n\n阅读下例应该足够理解此类文件的结构了。你可以使用正则表达式为多个文件甚至整个目录分配相同的安全上下文。\n\
  \n示例 14.2. example.fc 文件：\n\n```\n# myapp 可执行文件将具有：\n# 标签: system_u:object_r:myapp_exec_t\n\
  # MLS 灵敏度: s0\n# MCS 类别: <none>\n/usr/sbin/myapp -- gen_context(system_u:object_r:myapp_exec_t,s0)\n\
  ```\n\n### 14.5.2 编写 .if 文件\n\n在下例中，第一个接口（`myapp_domtrans`）控制谁可以执行该应用程序。第二个接口（`myapp_read_log`）授予对应用程序日志文件的读取权限。\n\
  \n每个接口必须生成一组有效的规则，这些规则可以嵌入到 `.te` 文件中。因此，你应该声明你使用的所有类型（使用 `gen_require` 宏），并使用标准指令授予权限。但注意，你可以使用其他模块提供的接口。下一节将提供关于如何表达这些权限的更多解释。\n\
  \n示例 14.3. example.if 文件：\n\n```\n<summary>Myapp 示例策略</summary>\n<desc>\n<p>\n关于\
  \ myapp 的更具描述性的文本。<desc> 标签也可以使用 <p>、<ul> 和 <ol> 等 HTML 标签进行格式化。\n</p>\n<p>\n此策略支持以下\
  \ myapp 特性：\n<ul>\n<li>特性 A</li>\n<li>特性 B</li>\n<li>特性 C</li>\n</ul>\n</p>\n</desc>\n\
  #######################################\n<summary>\n执行域转换以运行 myapp。\n</summary>\n\
  <param name=\"domain\">\n允许转换的域。\n</param>\ninterface(`myapp_domtrans`,`gen_require(`\
  \ type myapp_t, myapp_exec_t;`) domtrans_pattern($1,myapp_exec_t,myapp_t))\n#######################################\n\
  <summary>\n读取 myapp 日志文件。\n</summary>\n<param name=\"domain\">\n允许读取日志文件的域。\n</param>\n\
  interface(`myapp_read_log`,`gen_require(` type myapp_log_t;`) logging_search_logs($1)\
  \ allow $1 myapp_log_t:file r_file_perms;)\n```\n\n关于 reference policy 的文档说明\n\n\
  `reference policy`像任何自由软件项目一样进化：基于志愿者的贡献。该项目由 Tresys 托管，它是 SELinux 领域最活跃的公司之一。他们的\
  \ wiki 包含了关于规则如何构建以及你如何创建新规则的解释。\n\n→ [`github.com/SELinuxProject/refpolicy/wiki/GettingStarted`](https://github.com/SELinuxProject/refpolicy/wiki/GettingStarted)\n\
  \n### 14.5.4.3 编写 .te 文件\n\n查看 `example.te` 文件：\n\n## 进阶：m4 宏语言\n\n为了正确结构化策略，SELinux\
  \ 开发者使用了一个宏命令处理器。他们没有重复许多相似的 `allow` 指令，而是创建了“宏函数”来使用更高层次的逻辑，这使得策略具有更高的可读性。\n\n\
  在实践中，`m4` 被用于编译这些规则。它执行的是相反的操作：将所有这些高层指令扩展为巨大的 `allow` 指令数据库。\n\nSELinux “接口”是：\n\
  \n\n\n\n现在你只需要找到所需的最小规则集，以确保目标应用程序或服务正常运行。为了实现这一点，你应该对应用程序的工作原理以及它管理和/或生成什么的数据有良好的了解。\n\
  \n然而，采用经验方法也是可行的。一旦对相关对象进行了正确标记，你就可以许可模式（permissive mode）下运行应用程序：本会被禁止的操作将被记录但仍会成功。通过分析日志，你现在可以识别出允许的操作。以下是这样的日志条示例：\n\
  \n```\navc: denied { read write } for pid=1876 comm=\"syslogd\" name=\"xconsole\"\
  \ dev=tmpfs ino=5510 scontext=system_u:system_r:syslogd_t:s0 tcontext=system_u:object_r:device_t:s0\
  \ tclass=fifo_file permissive=1\n```\n\n为了更好地理解这条消息，让我们逐条进行研究。\n\n### 表 14.1.SELinux\
  \ 跟踪分析\n\n| 消息 | 描述 |\n| --- | --- |\n| `avc: denied` | 一个操作被拒绝。 |\n| `{ read write\
  \ }` | 该操作需要 `read` 和 `write` 权限。 |\n| `pid=1876` | PID 为 `1876` 的进程执行了该操作（或尝试执行）。\
  \ |\n| `comm=\"syslogd\"` | 该进程是 `syslogd` 程序的的一个实例。 |\n| `name=\"xconsole\"` |\
  \ 目标对象名为 `xconsole`。有时你也可以用“path”变量——带有全路径——来代替。 |\n| `dev=tmpfs` | 托管目标对象的设备是 `tmpfs`（内存文件系统）。对于真实的磁盘，你可以看到托管对象的分区（例如，“sda3”）。\
  \ |\n| `ino=5510` | 该对象通过 inode 号 `5510` 识别。 |\n| `scontext=system_u:system_r:syslogd_t:s0`\
  \ | 这是执行操作的进程的安全上下文。 |\n| `tcontext=system_u:object_r:device_t:s0` | 这是目标对象的安全上下文。\
  \ |\n| `tclass=fifo_file` | 目标对象是一个 FIFO 文件。 |\n\n通过观察此日志项，可以构建一条允许此操作的规则。例如，`allow\
  \ syslogd_t device_t:fifo_file { read write }`。这个过程可以自动化，而这正是 `policycoreutils`\
  \ 包中的 `audit2allow` 命令所提供的功能。只有当各种对象已经根据必须限制的内容被正确标记时，这种方法才有用。在任何情况下，你都必须仔细检查生成的规则并根据你对应用程序的了解对其进行验证。实际上，这种方法倾向于授予比实际需要的更多的权限。正确的解决方案通常是创建新类型，并仅对这些类型授予权限。有时被拒绝的操作对应用程序并不是致命的，在这种情况下，可能最好是添加一条\
  \ `dontaudit` 规则，以便在实际被拒绝的情况下避免产生日志条目。\n\n***\n\n**补充**：策略规则中没有角色\n\n在创建新规则时，角色完全没有出现，这似乎很奇怪。SELinux\
  \ 只使用域（domains）来确定哪些操作是允许的。角色仅通过允许用户切换到另一个域来间接地干预。SELinux 基于一种名为*类型强制（*Type Enforcement*）的理论，而类型是授予权限时唯一的关键元素。\n\
  \n### 14.5.4.4. 编译文件\n\n一旦 3 个文件（`example.if`、`example.fc` 和 `example.te`）符合你对新规则的预期，将它们重命名为\
  \ `myapp.*extension` 并运行 `make NAME=devel` 在 `myapp.pp` 文件中生成模块（你可以立即使用 `semodule\
  \ -i myapp.pp` 加载它）。如果定义了多个模块，`make` 将创建所有对应的 `.pp` 文件。\n\n# 14.6. 其他安全相关考虑\n\n\
  安全性不仅仅是一个技术问题；最重要的是关于良好的实践和对风险的理解。本节回顾了一些较为常见的风险，以及一些根据情况可以增加安全性或减轻成功攻击影响的最佳实践。\n\
  \n## 14.6.1. Web 应用程序的固有风险\n\nWeb 应用程序的通用导致了它们的普及。通常会并行运行多个：网页邮箱、wiki、某些组件系统、论坛、相册、博客等。其中许多应用程序依赖于“LAMP”（（*Linux,\
  \ Apache, MySQL, PHP*）堆栈。不幸的是，许多此类应用程序在编写时并没有过多考虑安全问题。来自外部的数据往往在几乎没有验证的情况下就被使用。提供特殊构造的值可以用于破坏对命令的调用，从而执行另一个命令。随着时间的推移，许多最明显的问题已经得到解决，但新的安全问题会定期涌现。\n\
  \n***\n\n**词汇**：SQL 注入\n\n当程序以不安全的方式将数据插入 SQL 查询中时，它就会受到 SQL 注入的漏洞；此名称涵盖了通过更改参数的行为，使得程序执行的实际查询与预期的查询不同，从而损坏数据库或访问通常不应访问的数据。\n\
  \n→ [`en.wikipedia.org/wiki/SQL_Injection`](https://en.wikipedia.org/wiki/SQL_Injection)\n\
  \n***\n\n因此，定期更新 Web 应用程序是必须，否则任何黑客（无论是专业攻击者还是脚本小子）都可以利用已知的漏洞。实际风险取决于情况，范围从数据销毁到任意代码执行。\n\
  \n## 14.6.2. 预知预期\n\nWeb 应用程序中的漏洞通常被用作破解尝试的起点。以下是对可能后果的简要回顾。\n\n***\n\n**快速查看**：过滤\
  \ HTTP 查询\n\nApache 2 包含了允许过滤 HTTP 查询的模块。这可以阻止某些攻击向量。例如，限制参数长度可以防止缓冲区溢出。更通地说，可以在参数传递给\
  \ Web 应用程序之前对其验证，并根据许多标准限制访问。这甚至可以与动态防火墙更新相结合，使得违反规则之一的客户端在一段时间内禁止访问 Web 服务器。\n\n\
  设置这些检查可能是一项长期且困难的任务，但如果待部署的 Web 应用程序在安全性方面记录可疑，那么这样做是值得的。\n\n`mod_security2`（在 `libapache2-mod-security2`\
  \ 包中）是此类主要的模块。它甚至自带许多许多插即用的规则（在 `modsecurity-crs` 包中），你可以轻松启用它们。\n\n***\n\n入侵的后果根据攻击者的动机会有不同程度的明显性。*脚本小子（*Script-kiddies*）只应用他们在网站上找到的配方；他们通常是破坏网页或删除数据。在更微妙的情况下，他们会在网页上添加不可见的内容，以提高搜索引擎中指向自己网站的推荐率。\n\
  \n更高级的攻击者会超越此。一个灾难性场景可能会如下发生：攻击者获得了以 `www-data` 用户执行命令的能力，但执行命令需要许多操作。为了让他们的生活更容易，他们安装了其他专门设计用于远程执行各种命令的\
  \ Web 应用程序，例如浏览文件系统、检查权限、上传或下载文件、执行命令，甚至提供网络 shell。通常，漏洞将允许运行 `wget` 命令，将某些恶意软件下载到\
  \ `/tmp/`，然后执行它。恶意软件通常从一个之前被破解的外国网站下载，以掩盖踪迹并使攻击的真实来源变得困难。\n\n\n\n\n此时，攻击者已经拥有足够的行动自由度，他们通常会安装一个\
  \ IRC `bot`（一种连接到 IRC 服务器并可由该通道控制的机器人）。这种机器人通常被用于分享非法文件（未经授权的电影或软件拷贝等）。坚决的攻击者可能想更进一步。`www-data`\
  \ 账户并不允许对机器进行完全访问，因此攻击者将尝试获取管理员权限。理论上，这是不可能的，但如果 Web 应用程序没有更新，那么内核和其他程序很可能也过时；这有时是因为管理员的决定导致的——尽管他们知道漏洞，但由于没有本地用户，他们忽略了系统升级。攻击者随后可以利用这第二个漏洞来获取\
  \ root 权限。\n\n### 词汇：特权提升 (Privilege escalation)\n\n该术语涵盖了任何可以获取比给定用户通常拥有的更多权限的操作。`sudo`\
  \ 程序的设计目的正是为了给某些用户提供管理权限。但该术语也用于描述攻击者利用漏洞获取不当权限的行为。\n\n现在攻击者拥有了该机器；他们通常会尝试尽可能地保持这种特权访问。这涉及到安装\
  \ `rootkit`，这种程序会替换系统的某些组件，以便攻击者在稍后的时间再次获得管理员权限；rootkit 还会试图隐藏自身以及任何入侵的痕迹。被篡改的 `ps`\
  \ 程序会漏掉某些进程，`netstat` 将不会列出某些活动连接，以此此类推。利用 root 权限，攻击者能够观察整个系统，但没有发现重要数据；因此他们会尝试访问公司网络中的其他机器。通过分析管理员账户和历史文件，攻击者发现了哪些机器是经常访问的。通过用被篡改的程序替换\
  \ `sudo` 或 `ssh`，攻击者可以拦截管理员的一些密码，并将这些密码使用在检测到的服务器上……从那时起入侵就可以传播。\n\n这是一个可以通过几种措施防止的噩梦场景。接下来的几个章节将描述了其中一些措施。\n\
  \n## 14.6.3. 明智选择软件\n\n一旦知了潜在的安全问题，在部署服务的过程每一步都必须考虑它们，特别是在选择要安装的软件时。许多网站（如 `SecurityFocus.com`）维护着最近发现的漏洞列表，这可以让你在部署特定软件之前了解其安全记录。当然，这些信息必须与该软件的流行程度进行平衡：更广泛使用的程序是一个更具吸引力的目标，因此会受到更严格的审查。另一方面，一个小众程序可能充满了安全漏洞，由于缺乏对安全审计的兴趣，这些漏洞从未被公开。\n\
  \n### 词汇：安全审计 (Security audit)\n\n安全审计是彻底阅读和分析某些软件源代码的过程，寻找其可能包含的潜在安全漏洞。此类审计通常是主动的，其目的是确保程序满足某些安全要求。\n\
  \n在自由软件世界中，通常有充足的选择空间，选择某一个软件而非另一个软件应该是基于适用于本地的标准的决策。更多的功能意味着代码中隐藏漏洞的风险增加；为某项任务选择最先进的程序实际上可能适得其反，更好的方法通常是选择符合要求的最简单的程序。\n\
  \n### 词汇：零日漏洞 (Zero-day exploit)\n\n`zero-day exploit` 攻击很难防止；该术语涵盖了程序作者尚未获知的漏洞。\n\
  \n## 14.6.4. 作为一个整体管理机器\n\n大多数 Linux 发行版默认会安装许多 Unix 服务和许多工具。在很多情况下，这些服务和工具对于管理员设置机器的实际目的并不是需要的。作为安全事务的一般指南，最好卸载不需要的软件。事实上，如果另一个未使用的服务中的漏洞可以被用来获取整台机器的管理员权限，那么保护\
  \ FTP 服务器就没有意义。\n\n出于同样的道理，防火墙通常会被配置为仅允许访问那些旨在供公共访问的服务。\n\n现在的计算机足够强大，可以在同一台物理机器上托管多个服务。从经济角度来看，这种可能性很有趣：只需要管理一台计算机，能耗更低等。然而，从安全角度来看，这种选择可能会成为问题。一个被破坏的服务可以导致对整台机器的访问，进而损害到托管在同一台计算机上的其他服务。这种风险可以通过隔离服务来缓解。这可以通过虚拟化（每个服务托管在专用虚拟机或容器中）或通过\
  \ `AppArmor/SELinux`（每个服务守护进程拥有一套设计良好的权限）来实现。\n\n## 14.6.5. 用户也是玩家\n\n讨论安全性会立即联想到防止隐藏在互联网丛林中的匿名黑客的攻击；但一个经常被忽略的事实是，风险也来自内部：即将离职的员工可能会下载重要项目的敏感文件并将其卖给竞争对手；疏忽的销售人员在与新客户会面期间未锁定会话就离开了办公桌；笨拙的用户可能会不小心删掉错误的目录，等等。\n\
  \n对这些风险的应对可能涉及技术解决方案：授予用户的权限不应超过所需，并且定期备份是必不可少的。但在许多情况下，适当的保护将涉及培训用户以规避这些风险。\n\n\
  ### 快速查看：autolog\n\n`autolog` 软件包提供了一个程序，可以在可配置的延迟后自动断开不活动用户的连接。它还允许杀死会话结束后仍然持续的用户进程，从而防止用户运行守护进程。\n\
  \n## 14.6.6. 物理安全\n\n如果计算机本身没有受到保护，那么保护服务和网络是没有意义的。重要数据应该存储在 RAID 阵列的热插拔硬盘上，因为硬盘终究会故障，而数据可用性是必须的。但如果任何一个送披萨的小哥都能进入大楼，溜入服务器房并带走几块选定的硬盘，那么安全的一个重要部分就没有被实现。谁可以进入服务器房？访问是否受到监控？在评估物理安全时，这些问题值得考虑（并给出答案）。\n\
  \n物理安全还包括考虑火灾等意外风险。这种特定风险证明了将备份介质存储在单独建筑中，或至少存储在防火箱中的必要性。\n\n## 14.6.7. 法律责任\n\n\
  管理员在很大程度上是含式地被他们的用户以及整个网络的用户信任的。因此，他们应该避免任何可能被恶意分子利用的疏忽。\n\n\n\n\n\n攻击者控制了你的机器并将其作为正向基地（被称为“中继系统”）用此执行其他不法活动，这可能会给你带来法律麻烦，因为受攻击方最初会看到攻击来自你的系统，从而认为你就是攻击者（或共犯）。在很多情况下，攻击者将利用你的服务器作为中继来发送垃圾邮件，这本上不会产生太大影响（除非可能导致被列入黑名单，这会限制你发送合法邮件的能力），但无论如何，这仍然不会令人愉快。在其他情况下，你的机器可能会造成更严重的麻烦，例如拒绝服务攻击（DoS）。这有时会导致收入损失，因为合法服务将无法且数据可能被破坏；有时这还意味着实际成本，因为受攻击方可以对你提起法律诉讼。如果从你的服务器上共享了受版权法保护的作品的未经授权副本，权利人可以起诉你；如果受服务水平协议约束的其他公司在从你的机器发出的攻击后被迫支付罚金，他们也会因此采取法律行动。\n\
  \n当这些情况发生时，仅仅声称清白通常是不够的；起码你需要有说服力的证据，显示你的系统中来自特定 IP 地址的可疑活动。如果你忽视了本章的建议，让攻击者获得了特权账户（特别是\
  \ `root`）的访问权限并用来掩盖踪迹，这将是不可能的。\n\n# 14.7. 处理被入侵的机器\n\n尽管初衷良好，无论安全策略设计得多么周全，管理员最终都会面临劫持行为。本节提供了关于在面对这些不幸情况时如何应对的指南。\n\
  \n## 14.7.1. 探测并发现黑客的入侵\n\n应对破解攻击的第一步是意识到这种行为的存在。这并非显而易见，特别是在没有完善的监控基础设施的情况下。\n\n\
  破解行为通常在对机器上托管的合法服务产生直接影响之前不会被发现，例如连接变慢、某些用户无法连接或任何其他类型的故障。面对这些问题，管理员需要仔细检查机器，并仔细审视哪些部分运行异常。这通常是他们发现异常进程的时候，例如，一个名为\
  \ `apache` 的进程而不是标准的 `/usr/sbin/apache2`。如果按照这个例子，应该做的是记录其进程标识符（PID），并检查 `/proc/*/pid*/exe`\
  \ 查看该进程当前运行的是什么程序：\n\n```\n# ls -al /proc/3719/exe\nlrwxrwxrwx 1 www-data www-data\
  \ 0 2007-04-20 16:19 /proc/3719/exe -> /var/tmp/.bash_httpd/psybnc\n```\n\n一个安装在\
  \ `/var/tmp/` 下并作为 Web 服务器运行的程序？毫无疑问，机器已被入侵。\n\n这只是一个例子，但许多其他线索也可以敲响管理员的警钟：\n\n\
  - 某个命令选项不再有效；该命令声称的软件版本与 `dpkg` 显示的应安装版本不符；\n- 命令行提示符或会话欢迎用语显示上一次连接来自另一个大洲的未知服务器；\n\
  - 由 `/tmp/` 分区满导致的错误，结果结果发现该分区装满了非法的电影拷贝；\n- 以及此类此类推。\n\n## 14.7.2. 将服务器下线\n\n除极少数特殊情况外，破解都来自网络，攻击者需要工作的网络来到达其目标（访问机密数据、共享非法文件、通过使用机器作为中继来隐藏身份等）。如果攻击者尚未成功实施，将电脑断开网络连接将防止他们到达这些目标。\n\
  \n这只有在可以物理上接触服务器时才可能。如果服务器托管在位于国家另一端的托管提供商数据中心，或者由于其他原因无法访问，通常的做法是先收集重要信息（参见第 14.7.3、14.7.5\
  \ 和 14.7.6 节），然后通过关闭尽可能的服务（通常是除 `sshd` 外的所有服务）尽可能地隔离该服务器。这种情况仍然很尴尬，因为无法排除攻击者拥有与管理员一样的\
  \ SSH 访问权限；这使得“清理”机器变得更加困难。\n\n## 14.7.3. 保留所有可以作为证据的内容\n\n了解攻击和/或对攻击者采取法律行动需要对所有重要元素备份；这包括硬盘内容、所有运行进程的列表以及所有打开连接的列表。内存中的内容也可以使用，但在实践中很少使用。\n\
  \n在行动的关键时刻，管理员往往倾向于在被入侵的机器上进行许多检查；这通常不是一个好主意。每个命令都可能被篡改并可能擦除证据。检查应限制在最小集合上（用于网络连接的\
  \ `netstat -tupan`，用于进程列表的 `ps auxf`，用于更多运行程序信息的 `ls -alR /proc/[0-9]*`），并且执行的每项检查都应仔细记录。\n\
  \n**注意** 热分析\n\n虽然在系统运行时对其进行分析似乎很有诱惑力，特别是当无法物理访问服务器时，但最好避免这样做：简单来说，你无法信任当前安装在入侵系统上的程序。被篡改的\
  \ `ps` 命令可能会隐藏某些进程，或者被篡改的 `ls` 可能会隐藏文件；有时甚至内核都被入侵了！\n\n如果仍然需要这种热分析，应小心只使用已知的程序。这样做的一种良好方法是使用带有纯净程序的救援光盘，或只读的网络共享。然而，如果内核本身被入侵，这些防御措施也可能还不够。\n\
  \n一旦保存了“动态”元素，下一步是存储硬盘的完整镜像。如果文件系统仍在变化，则无法制作此类镜像，这就是为什么必须将其重新挂载为只读。最简单的解决方案通常是强制停止服务器（在运行\
  \ `sync` 后）并在救援光盘上重启。每个分区都应该使用 `dd` 等工具进行复制；这些镜像可以发送到另一个服务器（可能使用非常方便的 `nc` 工具）。另一种可能甚至更简单：只需将磁盘从机器中取出，并换一个可以重新格式化并安装的新磁盘。\n\
  \n## 14.7.4. 重新安装\n\n在没有完全重新安装的情况下，不应让服务器上线。如果入侵非常严重（如果获得了管理员权限），几乎没有其他方法可以确保我们已经清除了攻击者可能留下的所有东西（特别是后门）。当然，必须应用所有的最新安全更新，以封堵攻击者利用的漏洞。理想情况下，分析攻击应该指向这一攻击向量，这样人们可以确定确实修复了它；否则，只能希望该漏洞是更新所修复的那些之一。\n\
  \n\n\n\n\n重装远程服务器并不总是那么容易；它可能需要托管公司的协助，因为并非所有此类公司都提供自动重装系统。应注意不要从比破解之后的备份中重装机器。理想情况下，只应恢复数据，实际软件应从安装介质重新安装。\n\
  \n## 14.7.5. 取证分析\n\n现在服务已经恢复，是时候仔细查看受损系统的磁盘镜像了，以理解攻击向量。在挂载这些镜像时，应注意使用 `ro,nodev,noexec,noatime`\
  \ 选项，以免更改内容（包括文件访问时间戳）或误运行受感染的程序。\n\n追溯攻击场景通常涉及查找所有被修改和执行过的内容：\n\n*   `.bash_history`\
  \ 文件通常提供非常有趣的内容；\n*   列出最近创建、修改或访问的文件也是如此；\n*   `strings` 命令通过从二进制文件中提取文本字符串，可以帮助识别由攻击者安装的程序；\n\
  *   `/var/log/` 下的日志文件通常允许重建事件的时间轴；\n*   专用工具还可以恢复可能被删除的文件内容，包括攻击者经常删除的日志文件。\n\n\
  其中一些操作可以通过专业软件变得更简单。特别是 `sleuthkit` 包提供了许多分析文件系统的工具。`Autopsy Forensic Browser` 图形界面（在\
  \ `autopsy` 包中）使得这些工具的使用更加方便。某些 Linux 发行版拥有“现场安装”镜像并包含许多取证分析程序，例如 Kali Linux（参见\
  \ Section A.8, “Kali Linux”），它具有*取证模式*；BlackArchLinux[^([]](#ch14s07.html_ftn.idm18170)\
  \ 以及基于 Grml 的商业版 Grml-Forensic（参见 Section A.6, “Grml”)).\n\n## 14.7.6. 重建攻击场景\n\n\
  分析过程中收集的所有元素应该像拼图碎片一样组合在一起；第一个可疑文件的创建通常与证明破解的日志相关。一个真实世界的例子应该比长长的理论论述更明确。\n\n以下日志是\
  \ Apache `access.log` 的提取内容：\n\n```\nwww.falcot.com 200.58.141.84 - - [27/Nov/2004:13:33:34\
  \ +0100] \"GET /phpbb/viewtopic.php?t=10&highlight=%2527%252esystem(chr(99)%252echr(100)%252echr(32)%252echr(47)%252echr(116)%252echr(109)%252echr(112)%252echr(59)%252echr(32)%252echr(119)%252echr(103)%252echr(101)%252echr(116)%252echr(32)%252echr(103)%252echr(97)%252echr(98)%252echr(114)%252echr(121)%252echr(107)%252echr(46)%252echr(97)%252echr(108)%252echr(116)%252echr(101)%252echr(114)%252echr(118)%252echr(105)%252echr(116)%252echr(97)%252echr(46)%252echr(111)%252echr(114)%252echr(103)%252echr(47)%252echr(98)%252echr(100)%252echr(32)%252echr(124)%252echr(124)%252echr(32)%252echr(99)%252echr(117)%252echr(114)%252echr(108)%252echr(102)%252echr(32)%252echr(103)%252echr(97)%252echr(98)%252echr(114)%252echr(121)%252echr(107)%252echr(46)%252echr(97)%252echr(108)%252echr(116)%252echr(101)%252echr(114)%252echr(118)%252echr(105)%252echr(116)%252echr(97)%252echr(46)%252echr(111)%252echr(114)%252echr(103)%252echr(47)%252echr(98)%252echr(100)%252echr(32)%252echr(45)%252echr(111)%252echr(98)%252echr(100)%252echr(59)%252echr(32)%252echr(99)%252echr(104)%252echr(109)%252echr(111)%252echr(100)%252echr(32)%252echr(43)%252echr(120)%252echr(32)%252echr(98)%252echr(100)%252echr(59)%252)\n\
  ```\n\n\n\n\n\n→ [`tracker.debian.org/`](https://tracker.debian.org/)\n\n## 15.1.1\
  \ 获取源码\n\n重构 Debian 软件包从获取其源代码开始。最简单的方法是使用 `apt-get source source-package-name`\
  \ 命令。该命令要求 `/etc/apt/sources.list` 文件中包含 `deb-src` 行，并且拥有最新的索引文件（即 `apt-get update`）。如果你遵循了处理\
  \ APT 配置的章节中的说明，这些条件应该已经满足了（参见第 6.1 节，“填充 `sources.list` 文件”）。但请注意，你将从 `deb-src`\
  \ 行中提到的 Debian 版本下载源码包。如果你需要另一个版本，可能需要从 Debian 镜像站或网站手动下载。这涉及获取两个或三个文件（扩展名为 `*.dsc`\
  \ —— 用于 *Debian 源码控制* —— `*.tar.comp`，有时还有 `*.diff.gz` 或 `*.debian.tar.comp` ——\
  \ `comp` 取所使用的压缩工具对应的 `gz`、`bz2` 或 `xz` 之一），然后运行 `dpkg-source -x file.dsc` 命令。如果\
  \ `*.dsc` 文件可以通过给 URL 直接访问，则有一种更简单的方法获取所有内容，即使用 `dget URL` 命令。该命令（可以在 devscripts\
  \ 软件包中找到）会获取给定地址的 `*.dsc` 文件，然后分析其内容并自动获取其中引的一个或多个文件。一旦下载完成，它将使用 `dscverify` 验证下载的源码包的完整性，并提取源码包（除非使用了\
  \ `-d` 或 `--download-only` 选项）。除非提供了 `-u` 选项，否则需要 Debian keyring。\n\n## 15.1.2 进行修改\n\
  \n让我们以 `samba` 软件包为例。\n\n```\n$ apt source samba\nReading package lists... Done\
  \ NOTICE: 'samba' packaging is maintained in the 'Git' version control system at:\
  \ https://salsa.debian.org/samba-team/samba.git Please use: git clone https://salsa.debian.org/samba-team/samba.git\
  \ to retrieve the latest (possibly unreleased) updates to the package. Need to get\
  \ 11.7 MB of source archives. Get:1 http://security.debian.org/debian-security buster/updates/main\
  \ samba 2:4.9.5+dfsg-5+deb10u1 (dsc) [4,316 B] Get:2 http://security.debian.org/debian-security\
  \ buster/updates/main samba 2:4.9.5+dfsg-5+deb10u1 (tar) [11.4 MB] Get:3 http://security.debian.org/debian-security\
  \ buster/updates/main samba 2:4.9.5+dfsg-5+deb10u1 (diff) [252 kB] Fetched 11.7\
  \ MB in 1s (9,505 kB/s) dpkg-source: info: extracting samba in samba-4.9.5+dfsg\
  \ dpkg-source: info: unpacking samba_4.9.5+dfsg.orig.tar.xz dpkg-source: info: unpacking\
  \ samba_4.9.5+dfsg-5+deb10u1.debian.tar.xz dpkg-source: info: using patch list from\
  \ debian/patches/series dpkg-source: info: applying 07_private_lib dpkg-source:\
  \ info: applying bug_221618_precise-64bit-prototype.patch [...]\n```\n\n软件包的源码现在位于一个以源码包名称及其版本命名的目录（`samba-4.9.5+dfsg`）中；这将是我们进行本地修改的地方。\n\
  \n要做的第一件事是更改软件包的版本号，以便将重构的软件包与 Debian 提供的原始软件包区分来。假设当前版本为 `2:4.9.5+dfsg-5`，我们可以创建版本\
  \ `2:4.9.5+dfsg-5falcot1`，这清楚地指示了软件包的来源。这使得软件包的版本号高于 Debian 提供的版本，因此软件包可以容易地作为原始软件包的更新进行安装。这种更改最好通过\
  \ devscripts 软件包中的 `dch` 命令（*Debian CHangelog*）来实现。\n\n```\n$ cd samba-4.9.5+dfsg\n\
  $ dch --local falcot\n```\n\n上一个命令调用文本编辑器（`sensible-editor` —— 如果它在环境变量 `VISUAL`\
  \ 或 `EDITOR` 中被提到，它应该是你喜欢的编辑器，否则使用默认编辑器）来记录此重构带来的差异。该编辑器告诉我们 `dch` 确实更改了 `debian/changelog`\
  \ 文件。\n\n当需要更改构建选项时，需要在 `debian/rules` 中进行更改，该文件驱动软件包构建过程中的步骤。在简单的情况下，涉及初始配置（`./configure\
  \ …`）或实际构建（`$(MAKE) …` 或 `make …`）的行很容易。如果这些命令没有被显式调用，它们可能是另一个显式命令的副作用，在这种情况下，请参考它们的文档了解更多如何更改默认行为。对于使用\
  \ `dh` 的软件包，你可能需要为 `dh_auto_configure` 或 `dh_auto_build` 命令添加覆盖（参见它们各自的手页了解如何实现此点的说明）。\n\
  \n根据对软件包的本地修改，可能还需要对 `debian/control` 文件进行更新，该文件包含了生成的软件包的描述。特别是，该文件包含 `Build-Depends`\
  \ 行，控制了在软件包构建时必须满足的依赖列表。这些行通常引用源码包所在发行中的软件包版本，但这些版本可能在重构时使用的发行版中不可用。没有自动化方法可以判断依赖是真实的，还是仅为了保证只有在使用库的最新版本时才尝试构建——这是强制*自动构建器*（autobuilder）在构建期间使用给定软件包版本的唯一可用方法，这就是为什么\
  \ Debian 维护者经常使用严格版本化的构建依赖。\n\n如果你确定这些构建依赖过于严格，可以放地在本地放宽它们。阅读记录软件标准构建方式的文件（这些文件通常被称为\
  \ `INSTALL`）将帮助你确定合适的依赖。\n\n***\n\n### TIP 安装构建依赖\n\n`apt-get` 允许安装 `/etc/apt/sources.list`\
  \ 文件中 `deb-src` 行提到的可用源码包的 `Build-Depends` 字段中提到的软件包。这只需运行 `apt-get build-dep source-package`\
  \ 命令即可。\n\n***\n\n## 15.1.3 开始重构\n\n当所有所需的更改已应用于源码后，我们就可以生成实际的二进制软件包（`.deb` 文件）。整个过程由\
  \ `dpkg-buildpackage` 命令管理。\n\n示例 15.1. 重构软件包\n```\n$ dpkg-buildpackage -us -uc\n\
  ```\n\n***\n\n### TOOL fakeroot\n\n本质上，软件包创建过程只是将一组现有的或已构建的文件收集到一个归档中；大多数文件在归档中的将归属于\
  \ *root*。然而，以该用户身份构建整个软件包意味着增加了风险；幸运的是，可以使用 `fakeroot` 命令避免这种情况。该工具可用于运行程序并让它认为自己是以\
  \ *root* 运行并创建具有任意所有权权限的文件。当该程序创建将成为 Debian 软件包的归档时，它被欺骗创建一个包含标记为任意所有者（包括 *root*）文件的归档。这种设置非常方便，以至于\
  \ `dpkg-buildpackage` 在构建软件包时默认使用 `fakeroot`。\n\n\n\n\n\n请注意，程序只是被欺骗“认为”它正在以特权账户运行，而该进程实际上是以运行\
  \ `fakeroot program` 的用户身份运行的（文件实际上是用该用户的权限创建的）。它在任何时候都没有真正获得可以滥用的 root 权限。\n\n\
  如果 `Build-Depends` 字段未更新或相关软件包未安装，则之前的命令可能会失败。在这种情况下，可以通过向 `dpkg-buildpackage` 传递\
  \ `-d` 来覆盖此检查。然而，显式地忽略这些依赖会带来构建过程在后期阶段失败的风险。糟糕糟糕，软件包可能看起来构建成功，但无法正常运行：当某些程序在构建时缺少所需的库时，它们会自动禁用其部分功能。\n\
  \n在大多数情况下，Debian 开发者会使用如 `debuild` 这样更高级程序；它会像往常一样运行 `dpkg-buildpackage`，但还会调用一个程序，该程序会运行许多检查以验证生成的软件包是否符合\
  \ Debian 策略。该脚本还会清理环境，以防止本地环境变量“污染”软件包构建。`debuild` 命令是 `devscripts` 套件中的工具之一，该套件共享一些一致性和配置，以简化维护者的工作。\n\
  \n### 快速查看 在 chrooted 环境中构建软件包\n\n`pbuilder` 程序（位于同名软件包中）允许在 `chrooted` 环境中构建 Debian\
  \ 软件包。它首先创建一个包含构建软件包所需的最小系统的临时目录（包括 `Build-Depends` 字段中提到的软件包）。随后，在构建过程中，使用 `chroot`\
  \ 命令将该目录作为根目录（`/`）。\n\n此工具允许构建过程在一个未被用户操作修改的环境中进行。这还允许快速检测缺失的构建依赖（因为除非记录了相应的依赖，否则构建将失败）。最后，它允许为并非系统整体使用的\
  \ Debian 版本构建软件包：机器本身可以使用 Stable 版本处理正常工作负载，而运行在同一台机器上的 `pbuilder` 可以使用 Unstable\
  \ 版本进行软件包构建。\n\n`schroot` 允许在 `chrooted` 环境中运行命令或登录 shell。\n\n# 15.2 构建你的第一个第一个软件包\n\
  \n## 15.2.1 元软件包（Meta-Packages）或伪装软件包（Fake Packages）\n\n伪装软件包和元软件包的相似之处在于，它们都是空外壳，其存在仅仅是为了元数据对软件包处理栈产生的影响。\n\
  \n伪装软件包的目的是欺骗 `dpkg` 和 `apt`，使其认为某些软件包已安装，尽管它只是一个空外壳。这允许在相应的软件安装在软件包系统范围之外时，满足对该软件包的依赖关系。这种方法虽然可行，但仍应尽可能避免，因为无法保证手动安装的软件行为与相应的软件包完全一致，也无法保证依赖于它的其他软件包能够正常工作。\n\
  \n另一方面，元软件包主要是作为依赖项的集合存在的，因此安装元软件包实际上会一步到位地引入一组其他软件包。\n\n这两类软件包都可以通过 `equivs-control`\
  \ 和 `equivs-build` 命令（在 `equivs` 软件包中）创建。`equivs-control file` 命令创建一个 Debian 软件包头文件，应该对该文件进行编辑，以包含预期的软件包名称、版本号、维护者名称、依赖项和描述。其他没有默认值的字段是可选的，可以删除。`Copyright`、`Changelog`、`Readme`\
  \ 和 `Extra-Files` 字段不是 Debian 软件包的标准字段；它们仅在 `equivs-build` 的范围内有意义，并且不会保留在生成的软件包头文件中。\n\
  \n示例 15.2：`libxml-libxml-perl` 伪装软件包的头文件\n```\nSection: perl\nPriority: optional\n\
  Standards-Version: 4.4.1\nPackage: libxml-libxml-perl\nVersion: 2.0134-1\nMaintainer:\
  \ Raphael Hertzog <hertzog@debian.org>\nDepends: libxml2 (>= 2.7.4)\nArchitecture:\
  \ all\nDescription: Fake package - module manually installed in site_perl\nThis\
  \ is a fake package to let the packaging system believe that this Debian package\
  \ is installed.\n. In fact, the package is not installed since a newer version of\
  \ the module has been manually compiled & installed in the site_perl directory.\n\
  ```\n\n下一步是用 `equivs-build file` 命令生成 Debian 软件包。完成：软件包在当前目录下创建，可以像处理其他 Debian 软件包一样处理它。\n\
  \n## 15.2.2 简单文件存档\n\nFalcot Corp 的管理员需要创建一个 Debian 软件包，以便在大量机器上部署一组文档。负责此任务的管理员首先阅读《新维护者指南》，然后开始着他们的第一个软件包。\n\
  \n→ [https://www.debian.org/doc/manuals/maint-guide/]\n\n第一步是创建一个 `falcot-data-1.0`\
  \ 目录以包含目标源软件包。该软件包在逻辑上命名为 `falcot-data` 并带有 `1.0` 版本号。管理员随后将文档文件放在 `data` 子目录中。然后他们调用\
  \ `dh_make` 命令（来自 `dh-make` 软件包）添加软件包生成过程所需的文件，这些文件将全部存储在 `debian` 子目录下：\n\n```bash\n\
  $ cd falcot-data-1.0\n$ dh_make --native\nType of package: (single, indep, library,\
  \ python) [s/i/l/p]?\ni\nMaintainer Name : Raphael Hertzog\nEmail-Address : hertzog@debian.org\n\
  Date : Fri, 04 Sep 2015 12:09:39 -0400\nPackage Name : falcot-data\nVersion : 1.0\n\
  License : gpl3\nPackage Type : indep\nAre the details correct? [Y/n/q]\nCurrently\
  \ there is not top level Makefile. This may require additional tuning\nDone. Please\
  \ edit the files in the debian/ subdirectory now.\n```\n\n所选的软件包类型 (`indep`) 表示此源软件包将生成一个单一二进制软件包，该软件包可以在所有架构间共享（`Architecture:\
  \ all`）。`single` 是对应项，会导致生成一个依赖于目标架构的单一二进制软件包（`Architecture: any`）。在这种情况下，前者的选择更为相关，因为软件包只包含文档而没有二进制程序，因此可以在所有架构的计算机上类似地使用。\n\
  \n`library` 类型对应于产生多个二进制软件包的源软件包。它对于共享库非常有用，因为它们需要遵循严格的打包规则。\n\n### Tips 维护者的姓名和电子邮件地址\n\
  \n大多数参与软件包维护的程序会在 `DEBFULLNAME` 和 `DEBEMAIL` 或 `EMAIL` 环境变量中查找你的姓名和电子邮件地址。一次性定义这些变量可以避免你重复输入。如果你常用的\
  \ shell 是 `bash`，只需在你的 `~/.bashrc` 文件中添加以下两行（你显然会将这些值替换为相关的值！）：\n\n```bash\nexport\
  \ EMAIL=\"hertzog@debian.org\"\nexport DEBFULLNAME=\"Raphael Hertzog\"\n```\n\n\
  `dh_make` 命令创建了一个包含许多文件的 `debian` 子目录。其中某些是必须的，特别是 `rules`、`control`、`changelog`\
  \ 和 `copyright`。带有 `.ex` 扩展的文件是示例文件，可以在需要时通过修改（并删除扩展名）来使用。如果不需要，建议删除它们。`compat`\
  \ 文件应该保留，因为它是 `debhelper` 工具套件（均以 `dh_` 为前）在软件包构建过程各个阶段正常运行所所需的。\n\n\n\n\n`copyright`\
  \ 文件必须包含包中所包含的文档作者信息以及相关的许可。在我们的案例中，这些是内部文档，其使用被限制在 Falcot Corp 公司内部。默认的 `changelog`\
  \ 文件通常是合适的；将“Initial release”（初始发布）替换为更详细的解释，并将分发类型从 `unstable` 改为 `internal` 即可。`control`\
  \ 文件也已更新：`Section` 字段已改为 `misc`，并删除了 `Homepage`、`Vcs-Git` 和 `Vcs-Browser` 字段。`Depends`\
  \ 字段已完成 `firefox-esr | www-browser`，以确保能够显示包中文档的可用浏览器。\n\n示例 15.3. `control` 文件\n\
  ```\nfalcot-data\nSection: misc\nPriority: optional\nMaintainer: Raphael Hertzog\
  \ <hertzog@debian.org>\nBuild-Depends: debhelper (>= 10)\nStandards-Version: 4.4.1\n\
  Package: falcot-data\nArchitecture: all\nDepends: firefox-esr | www-browser, ${misc:Depends}\n\
  Description: Internal Falcot Corp Documentation\nThis package provides several documents\
  \ describing the internal structure at Falcot Corp. This includes:\n- organization\
  \ diagram\n- contacts for each department.\nThese documents MUST NOT leave the company.\
  \ Their use is INTERNAL ONLY.\n```\n\n示例 15.4. `changelog` 文件\n```\nfalcot-data\
  \ (1.0) internal; urgency=low\n* Initial Release.\n* Let's start with few documents:\n\
  - internal company structure;\n- contacts for each department.\n-- Raphael Hertzog\
  \ <hertzog@debian.org> Fri, 04 Sep 2015 12:09:39 -0400\n```\n\n示例 15.5. `copyright`\
  \ 文件\n```\nFormat: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/\n\
  Upstream-Name: falcot-data\nFiles:\n* Copyright: 2004-2019 Falcot Corp\nLicense:\
  \ All rights reserved.\n```\n\n* * *\n\n# 回归基础\n\n## `Makefile` 文件\n\n`Makefile`\
  \ 文件是 `make` 程序使用的脚本；它描述了如何在依赖树中从相互之间构建一组文件的规则（例如，一个程序可以从一组源文件构建）。`Makefile` 文件以以下格式描述这些规则：\n\
  \n```\ntarget: source1 source2 ... command1 command2\n```\n\n此类规则的解释如下：如果其中一个 `source*`\
  \ 文件比 `target`（目标）文件新，则需要使用 `command1` 和 `command2` 生成目标文件。\n\n请注意，命令行行必须以制表符（tab）开头；同样请注意，当命令行以连字符字符（`-`）开头时，命令执行失败不会中断整个过程。\n\
  \n* *\n\n## `rules` 文件\n\n`rules` 文件通常包含一组规则，用于在专用子目录中配置、构建和安装软件（该子目录以生成的二进制包命名）。该子目录的内容随后会被归档到\
  \ Debian 包中，就像它是文件系统的根目录一样。在我们的案例中，文件将安装在 `debian/falcot-data/usr/share/falcot-data/`\
  \ 子目录下，因此安装生成的包将把文件部署在 `/usr/share/falcot-data/` 下。`rules` 文件被用作 `Makefile`，带有几个标准目标（包括\
  \ `clean` 和 `binary`，分别用于清理源目录和生成二进制包）。\n\n尽管此文件是流程的核心，但它越来越多地只包含运行 `debhelper`\
  \ 工具提供的标准命令集所需的极少内容。`dh_make` 生成的文件正是如此。为了安装我们的文件，我们只需通过创建以下 `debian/falcot-data.install`\
  \ 文件来配置 `dh_install` 命令的行为：\n\n```\ndata/* usr/share/falcot-data/\n```\n\n此时，包就可以创建了。然而，我们会为它添加一点点装饰（a\
  \ lick of paint，即美化处理）。由于管理员希望能够从图形化桌面环境的菜单中轻松访问文档，我们添加了一个 `falcot-data.desktop`\
  \ 文件，并通过在 `debian/falcot-data.install` 中添加第二行，使它被安装到 `/usr/share/applications` 中。\n\
  \n示例 15.6. `falcot-data.desktop` 文件\n```\n[Desktop Entry]\nName=Internal Falcot\
  \ Corp Documentation\nComment=Starts a browser to read the documentation\nExec=x-www-browser\
  \ /usr/share/falcot-data/index.html\nTerminal=false\nType=Application\nCategories=Documentation;\n\
  ```\n\n更新后的 `debian/falcot-data.install` 如下所示：\n\n```\ndata/* usr/share/falcot-data/\n\
  falcot-data.desktop usr/share/applications/\n```\n\n我们的源包现在已经就绪了。剩下的工作就是生成二进制包，使用我们之前用于重新构建包的相同方法：在\
  \ `falcot-data-1.0` 目录下运行 `dpkg-buildpackage -us -uc` 命令。\n\n# 15.3. 为 APT 创建包仓库\n\
  \nFalcot Corp 开始逐渐维护许多 Debian 包，这些包是对现有包的本地修改，或是从零创建的用于分发内部数据和程序。\n\n为了让部署更简单，他们希望将这些包集成到一个可以直接被\
  \ APT 使用的包归中。出于显然的维护考虑，他们希望将内部包与本地构建的包分开。目标是 `/etc/apt/sources.list.d/falcot.list`\
  \ 文件如下：\n\n```\ndeb http://packages.falcot.com/ updates/\ndeb http://packages.falcot.com/\
  \ internal/\n```\n\n管理员因此在他们的内部服务器上配置一个虚拟主机，以 `/srv/vhosts/packages/` 为根目录。归本身的管理委托给\
  \ `mini-dinstall` 命令（类似于命名的包）。该工具监控 `incoming/` 目录（在我们的案例中为 `/srv/vhosts/packages/incoming/`）并等待新包；当包上传时，它会被安装到\
  \ `/srv/vhosts/packages/` 的 Debian 归中。`mini-dinstall` 命令读取生成 Debian 包时的 `*.changes`\
  \ 文件，这些文件包含了与包版本相关的所有文件（`*.deb`、`*.dsc`、`*.diff.gz/*.debian.tar.gz`、`*.orig.tar.gz`\
  \ 或其他压缩工具的等效物），并使其知道要安装哪些文件。`*.changes` 文件还包含 `debian/changelog` 中提到的目标发行版（通常为 `unstable`），`mini-dinstall`\
  \ 根据此信息决定应该安装在哪里。这就是为什么管理员在构建包之前必须更改此字段，将其设置为 `internal` 或 `updates`，取决于目标位置。`mini-dinstall`\
  \ 随后生成 APT 所需的文件，如 `Packages.gz`。\n\n* * *\n\n# 替代方案：apt-ftarchive 和 reprepro\n\n\
  如果 `mini-dinstall` 对于你的 Debian 归需求来说太复杂，也可以使用 `apt-ftarchive` 命令。该工具扫描目录内容并在其标准输出上显示相应的\
  \ `Packages` 文件。在 Falcot Corp 案例中，管理员可以将包直接上传到 `/srv/vhosts/packages/updates/` 或\
  \ `/srv/vhosts/packages/internal/`，然后运行以下命令创建 `Packages.gz` 文件：\n\n```\n$ cd /srv/vhosts/package\n\
  $ apt-ftarchive packages updates >updates/Packages\n$ gzip updates/Packages\n$ apt-ftarchive\
  \ packages internal >internal/Packages\n$ gzip internal/Packages\n```\n\n`apt-ftarchive\
  \ sources` 命令允许类似的方式创建 `Sources.gz` 文件。\n\n`repropro` 是用于相同用途的更高级工具。它可以生成、管理和同步本地包仓库。它将包和校验和存储在\
  \ Berkeley DB 文件中，因此不需要数据库服务器。通过 `repropro`，你可以检查镜像仓库的签名并创建生成的包索引的签名。\n\n* * *\n\
  \n配置 `mini-dinstall` 需要设置 `~/.mini-dinstall.conf` 文件；在 Falcot Corp 案例中，其内容如下：\n\n\
  \n\n\n\n[DEFAULT]\narchive_style = flat\narchivedir = /srv/vhosts/packages\nverify_sigs\
  \ = 0\nmail_to = admin@falcot.com\ngenerate_release = 1\nrelease_origin = Falcot\
  \ Corp\nrelease_codename = stable\n\n[updates]\nrelease_label = Recompiled Debian\
  \ Packages\n[internal]\nrelease_label = Internal Packages\n\n一个值得注意的决定为每个存档生成 `Release`\
  \ 文件。这有助于使用 `/etc/apt/preferences` 配置来管理包的安装优先级（详情请参见第 6.2.5 节，“管理优先级”）。\n\n## 安全\
  \ mini-dinstall 与权限\n\n由于 `mini-dinstall` 被设计为作为普通用户运行，因此不需要以 root 身份运行。最简单的方法是在负责创建\
  \ Debian 包的管理员的所属的用户账户中配置所有内容。由于只有该管理员有权限将文件放入 `incoming/` 目录，我们可以推断出管理员在部署之前已经验证了每个包的来源，因此\
  \ `mini-dinstall` 不需要再次进行此操作。这解释了 `verify_sigs = 0` 参数（意味着不需要验证签名）。然而，如果包的内容非常敏感，我们可以反转该设置，并选择使用包含允许创建包的人员公钥的密钥环进行身份验证（通过\
  \ `extra_keyrings` 参数配置）；`mini-dinstall` 将随后通过分析集成到 `*.changes` 文件中的签名来检查每个入站包的来源。\n\
  \n调用 `mini-dinstall` 实际上会在后台启动一个守护进程。只要该守护进程运行，它就会每隔半小时检查一次 `incoming/` 目录中的新包；当新包到达时，它将被移动到存档，并重新生成相应的\
  \ `Packages.gz` 和 `Sources.gz` 文件。如果运行守护进程有问题，`mini-dinstall` 也可以在每次包上传到 `incoming/`\
  \ 目录时以批模式（使用 `-b` 选项）手动调用。`mini-dinstall` 提供的其他可能性记录在它的 `mini-dinstall(1)` 手册页中。\n\
  \n## 额外 生成签名存档\n\nAPT 套件在安装包之前会对其处理的包进行加密签名链检查，以确保它们的真实性（参见第 6.6 节，“检查包真实性”）。私有\
  \ APT 存档可能会成为问题，因为使用它们的机器将一直显示未签名包的警告。因此，尽职的管理员会将内部存档与安全的 APT 机制集成。\n\n为了帮助这一过程，`mini-dinstall`\
  \ 包含 `release_signscript` 配置选项，允许指定用于生成签名的脚本。一个很好的起点是 mini-dinstall 包在 `/usr/share/doc/mini-dinstall/examples/`\
  \ 中提供的 `sign-release.sh` 脚本；可能会进行修改。\n\n# 15.4. 成为包维护者\n\n### 15.4.1. 学习制作包\n\n\
  创建一个高质量的 Debian 包并不总是一项简单任务，成为包维护者需要在理论和实践方面进行一些学习。这不仅仅是构建和安装软件的问题；相反，大部分复杂性源于理解问题和冲突，更广泛地说，源与其他众多可用包之间的相互作用。\n\
  \n#### 15.4.1.1. 规则\n\nDebian 包必须遵守 Debian 策略中编译的精确规则，且每个包维护者必须了解这些规则。这并不要求性记硬背，而是要知道它们的存在，并在当选择呈现非平凡替代方案时参考它们。每个\
  \ Debian 维护者都曾因为不知道某条规则而犯过错误，但只要在用户将其报告为错误 报告时修复该错误（得益于高级用户，这通常很快就会发生），就不是一个大问题。`debian/control`\
  \ 中的 `Standards-Version` 字段指定了包所遵循的 Debian 策略版本。维护者应该遵守最新版本的 Debian 策略。\n\n→ [`www.debian.org/doc/debian-policy/`](https://www.debian.org/doc/debian-policy/)\n\
  \n#### 15.4.1.2. 流程\n\nDebian 并不是单个包的简单集合。每个人的打包工作都是集体项目的一部分；成为 Debian 意味着意味着了解\
  \ Debian 项目作为一个整体是如何运作的。每个开发者早晚都会与其他人交互。《Debian 开发者参考手册》（在 `developers-reference`\
  \ 包中）总结了每位开发者必须知道的内容，以便与项目中的各个团队尽可能顺畅地交互，并充分利用可用资源。该文档还列出了开发者预期履行的若干职责。\n\n→ [`www.debian.org/doc/manuals/developers-reference/`](https://www.debian.org/doc/manuals/developers-reference/)\n\
  \n#### 15.4.1.3. 工具\n\n许多工具可以帮助包维护者的工作。本节简要描述了它们，但没有提供完整细节，因为它们自己都有详尽的文档。\n\n#####\
  \ 15.4.1.3.1. lintian 程序\n\n这个工具是最重要的工具之一：它是 Debian 包检查器。它基于根据 Debian 策略创建的大量测试，并能快速、自动地检测出许多错误，这些错误可以在包发布之前进行修复。\n\
  \n这个工具只是一个辅助工具，它有时会出错（例如，由于 Debian 策略随时间推移而变化，`lintian` 有时是过时的）。它还不是详尽的：没有得到任何 Lintian\
  \ 错误不应解释为包是完美的证明；顶多只是避免了最常见的错误。\n\n##### 15.4.1.3.2. piuparts 程序\n\n这是另一个重要工具：它自动化了包的安装、升级、删除和清除（在隔离环境中），并检查这些操作中没有一个会导致错误。它可以帮助检测缺失的依赖，还能检测在包被清除后是否错误遗留的文件。\n\
  \n##### 15.4.1.3.3. devscripts\n\n`devscripts` 包包含了许多有助于帮助 Debian 开发者完成各种工作的程序：\n\
  \n* `debuild` 允许生成包（使用 `dpkg-buildpackage`）并在之后运行 `lintian` 以检查其对 Debian 策略的合规性。\n\
  * `debclean` 在生成二进制包后清理源包。\n* `dch` 允许快速方便地编辑源包中的 `debian/changelog` 文件。\n* `uscan`\
  \ 检查上游作者是否发布了软件的新版本；这需要一个描述此类发布位置的 `debian/watch` 文件。\n* `debi` 允许安装（使用 `dpkg -i`）刚刚生成的\
  \ Debian 包，无需输入其完整名称和路径。\n* 类似地，`debc` 允许扫描最近生成的包的内容（使用 `dpkg -c`），无需输入其完整名称和路径。\n\
  * `bts` 从命令行控制错误跟踪系统；该程序会自动生成相应的电子邮件。\n* `debrelease` 将最近生成的包上传到远程服务器，无需输入相关 `.changes`\
  \ 文件的完整名称和路径。\n* `debsign` 对 `*.dsc` 和 `*.changes` 文件签名。\n* `uupdate` 在发布新上游版本时，自动创建包的新修订版本。\n\
  \n##### 15.4.1.3.4. debhelper 和 dh-make\n\n\n\n\n\nDebhelper 是一组脚本，用于简化创建符合策略的软件包；这些脚本从\
  \ `debian/rules` 调用。Debhelper 在 Debian 内部被广泛采用，事实是大多数官方 Debian 软件包都在使用它。它包含的所有命令都带有\
  \ `dh_` 前缀。\n\n`dh_make` 脚本（位于 `dh-make` 软件包中）会在最初包含软件源码的目录中创建生成 Debian 软件包所需的文件。从程序名称可以推断出，生成的文件默认使用\
  \ debhelper。\n\n### 15.4.1.3.5. autopkgtest\n\n`autopkgtest` 使用源码包提供的测试对二进制包运行测试。\n\
  \n### 15.4.1.3.6. reprotest\n\n`reprotest` 在不同的环境下两次构建相同的源代码，然后检查每个构建产生的二进制文件之间是否存在差异。如果发现任何差异，则将使用\
  \ `diffoscope`（如果不可用，则使用 `diff`）详细显示这些差异以供日后分析。\n\n### 15.4.1.3.7. dupload and dput\n\
  \n`dupload` 和 `dput` 命令允许将 Debian 软件包上传到（可能是远程的）服务器。这允许开发者将软件包发布到 Debian 主服务器（`ftp-master.debian.org`），以便将其整合到存档中并通过镜像站分发。这些命令接受\
  \ `*.changes` 文件作为参数，并根据其内容推导出其他相关文件。\n\n## 15.4.2. 接收流程\n\n成为“Debian 开发者”并不是一件简单的行政事务。该过程包含几个步骤，既是一次入会，也是一个选拔过程。无论如何，它都是形式化且记录完的，因此任何人都可以在新成员流程专用网站上跟踪自己的进度。\n\
  \n→ [`nm.debian.org/`](https://nm.debian.org/)\n\n*额外* 针对“Debian 维护者”的轻量级流程\n\n\
  “Debian 维护者”是另一种状态，其权限比“Debian 开发者”少，但其相关的流程更快。通过这种状态，贡献者可以仅维护他们自己的软件包。Debian 开发者只需要对初始上传进行检查，并发表声明，表示他们信任拟任的维护者有独立维护该软件包的能力。\n\
  \n### 15.4.2.1. 先决条件\n\n预计所有候选人都至少具备英语工作知识。这在所有层面上都是要求的：当然包括与审查员的初步沟通，但后期也是如此，因为英语是大多数文档的首选语言；此外，软件包用户在报告错误时将使用英语交流，并且他们期望收到英文回复。\n\
  \n另一个先决条件涉及动力。成为 Debian 开发者只有在候选人知道他们对 Debian 的兴趣将持续数月时，这个过程才有意义。接收流程本身可能持续几个月，而\
  \ Debian 需要长期的开发者；每个软件包都需要永久的维护，而不仅仅是初始上传。\n\n### 15.4.2.2. 注册\n\n第一步（真正的）步骤是寻找一个赞助人或倡导者；这意味着一位官方开发者愿意表态，他们认为接纳\
  \ X 对 Debian 是一件好事。这通常意味着候选人已经在社区内非常活跃，并且他们的工作得到了认可。如果候选人很害羞且其工作没有被公开宣扬，他们可以尝试通过私下展示自己的工作，来说服一位\
  \ Debian 开发者倡导他们。\n\n同时，候选人必须使用 GnuPG 生成一对公/私钥 RSA 密钥，且该密钥应至少由两位官方 Debian 开发者签名。签名验证了密钥上的名称。实际上，在密钥签名派对期间，每个参与者必须出官方身份证明（通常是身份证或护照）以及他们的密钥标识。这一步确认了人与密钥之间的链接。因此，这种签名要求现实生活中见面。如果你尚未在公共自由软件会议上遇到任何\
  \ Debian 开发者，你可以以以下网页上的列表作为起点，显式地寻找附近的开发者。\n\n→ [`wiki.debian.org/Keysigning`](https://wiki.debian.org/Keysigning)\n\
  \n一旦 `nm.debian.org` 上的注册通过倡导者的验证，将为候选人分配一名*申请经理*（Application Manager）。随后，申请经理将引导该过程通过多个预定义的步骤和检查。\n\
  \n第一次核实是身份检查。如果你已经有了一个由两位 Debian 开发者签名的密钥，这一步就很简单了；否则，申请经理将尝试并指导你寻找附近的 Debian 开发者，以组织一次会面和密钥签名。\n\
  \n### 15.4.2.3. 接受原则\n\n在这些行政手续之后是哲学考量。要点是确保候选人理解并接受自由软件背后的社会契约和原则。只有当一个人分享了团结当前开发者的价值观时（这些价值观在创始文中表述，并在第\
  \ 1 章，*The Debian Project* 中总结），才可能加入 Debian。\n\n此外，每位希望加入 Debian 的候选人都预计要了解项目的运作，以及如何恰当地交互以解决随时间推移可能会遇到的问题。所有这些信息通常记录在针对维护者的手册以及开发者的参考资料中。仔细阅读这些文档足以回答审查员的问题。如果答案不理想，将通知候选人。随后他们需要在再次尝试之前（再次）阅读相关文档。在现有文档不包含问题合适答案的情况下，候选人通常可以通过在\
  \ Debian 内的实践经验，或者通过与其他 Debian 开发者讨论获得答案。这种机制确保了候选人在成为其组成部分之前已经参与了 Debian。这是一项刻意的政策，使最终加入项目的候选人作为无限扩展拼图的另一个碎片被整合。\n\
  \n这一步在参与新成员流程的开发者术中通常被称为*哲学与程序*（Philosophy & Procedures，简称 P&P）。\n\n### 15.4.2.4.\
  \ 技能检查\n\n每个成为官方 Debian 开发者的申请都必须证明理由。成为项目成员需要证明这种身份是合法的，并且它有助于候选者帮助 Debian 的工作。最常见的理由是授予\
  \ Debian 开发者状态有助于 Debian 软件包的维护，但这并非唯一的理由。有些开发者加入项目是为了为特定架构的移植做贡献，另一些人想改进文档等等。\n\
  \n这一步为候选人提供了一个机会，让他们说明打算在 Debian 项目中做什么，并展示他们已经为此做了什么。Debian 是一个务实的项目，如果行动与宣布的内容不符，光说是不够的。通常，当预期的项目角色与软件包维护有关时，必须由现有\
  \ Debian 开发者中的赞助人对拟议软件包的第一版本进行技术验证并上传到 Debian 服务器。\n\n*社区* 赞助\n\n\n\n\nDebian 开发者可以“赞助”由他人准备的软件包，这意味着他们在进行仔细审查后，将这些包发布到\
  \ Debian 官方仓库中。这种机制使得尚未通过新成员流程的外部人员也能偶尔为项目做出贡献。同时，它确保了所有包含在 Debian 中的软件包都经过了官方成员的检查。\n\
  \n***\n\n最后，考官将通过一份详细的问卷检查候选人的技术（打包）技能。不允许出现错误答案，但对回答时间没有限制。所有参考文档均可查阅，如果第一次回答不理想，允许尝试多次。这一步的目的并不是歧视，而是为了确保新贡献者至少具备一些通用的知识。\n\
  \n在考官的术语中，这一步被称为 `Tasks & Skills` 步骤（简称 T&S）。\n\n### 15.4.2.5. 最终批准\n\n在最后一步，整个流程将由\
  \ `DAM`（Debian 账户管理器）进行审查。`DAM` 将审查考官收集的关于候选人的所有信息，并决定是否在 Debian 服务器上创建账户。如果需要额外信息，账户创建可能会推迟。如果考官很好地遵循了流程，拒绝的情况是非常少见的，但有时也会发生。这些拒绝不是永久性的，候选人可以在以后自由再次尝试。\n\
  \n`DAM` 的决定具有权威性，且（几乎）没有申诉余，这解释了为什么该职位的人在过去经常受到批评。\n\n# 第 16 章 结论：Debian 的未来\n\n\
  Falcot Corp 的故事随着最后一章结束；但 Debian 将继续存在，未来无疑会带来许多有趣的惊喜。\n\n## 16.1. 即将的发展\n\n既然 Debian\
  \ 版本 `10` 已经发布，开发者们已经在忙于开发下一个版本了，代号为 `Bullseye`……\n\n目前没有官方的计划变更列表，而且 Debian 绝不会对未来版本的技术目标做出承诺。然而，已经可以注意到一些开发趋势，我们可以尝试猜测可能会发生什么（或不会发生什么）。\n\
  \n为了提高安全性和信任度，越来越多的软件包将被设计为可重现构建的；也就是说，可以从源包重新构建出字节级完全相同的二进制包，从而让每个人都能验证构建过程中没有发生任何篡改。这一特性甚至可能被发布经理要求用于迁移测试。\n\
  \n在相关主题方面，将投入大量精力改进默认安全性，更多的软件包将带有 `AppArmor` 配置文件。\n\n当然，所有主要的软件套都将有重大版本发布。各种桌面系统的最新版本将带来更好的可用性和新功能。作为新显示服务器\
  \ `Wayland` 可能会完全淘汰 `X11`。\n\n随着持续集成的广泛使用以及存档（以及最大的软件包！）的增长，对发布架构的限制将更难满足，某些架构将被舍弃（如\
  \ `mips`、`mipsel` 可能还有 `mips64el`）。\n\n## 16.2. Debian 的未来\n\n除了这些内部发展，人们完全可以会有新的基于\
  \ Debian 的发行版问世，因为许多工具一直在简化这项任务。新的专门子项目也将启动，以拓宽 Debian 的触达范围。\n\nDebian 用户社区将会扩大，新的贡献者将加入项目……可能也包括你！\n\
  \n关于软件生态系统如何演变的讨论反复出现，即向着在容器内运行的应用转变（在那里 Debian 软件包没有额外价值），或者使用特定语言的包管理器（例如 Python\
  \ 的 `pip`、JavaScript 的 `npm` 等），这些正使 `dpkg` 和 `apt`变得过时。面对这些威胁，我深信 Debian 开发者将找到拥抱这些演变的方法并继续为用户提供价值。\n\
  \n尽管 Debian 年龄已老且规模庞大，它仍然在各种（有时是意料之外的）方向不断成长。贡献者们点子不断，开发邮件列表上的讨论即使看起来像是在争吵，也不断增加势头。Debian\
  \ 有时被比作黑洞，其密度大到任何新的自由软件项目都会被吸引。\n\n除了大多数 Debian 用户明显的满意外，一个深层趋势正变得越来越不可否认：人们越来越意识到，协作而不是在自己的角落里独自工作会为所有人带来更好的结果。这就是通过子项目合并到\
  \ Debian 的发行版所采用的原理。\n\n因此，Debian 项目并没有威胁……\n\n## 16.3. 本书的未来\n\n我们希望这本书以自由软件的精神演进。因此，我们欢迎贡献、意见、建议和批评。请将它们发送给\
  \ Raphaël (`<hertzog@debian.org>`) 或 Roland (`<lolando@debian.org>`)。对于可操作的反馈，随时针对\
  \ `debian-handbook` Debian 软件包提交错误报告。网站将用于收集与其演进相关的所有信息，你将可以在那里找到如何贡献的信息，特别是如果你想翻译这本书以让比今天更广泛的公众可以使用它。\n\
  \n→ [https://debian-handbook.info/]\n\n我们尝试整合了从 Debian 经验中中学的大部分内容，以便任何人都能使用该发行版并尽早充分利用其优势。我们希望这本书有助于让\
  \ Debian 不那么令人困惑并更受欢迎，我们欢迎围绕它的宣传！\n\n我们想以一个感性的说明作为结束。撰写（以及翻译）这本书花费了我们平时专业活动之外的大量时间。由于我们都是自由职业顾问，任何新的收入来源都赋予我们花更多时间改进\
  \ Debian 的自由；我们希望这本书取得成功并为此做出贡献。在此，请随时保留我们的服务！\n\n→ [https://www.freexian.com] →\
  \ [http://www.gnurandal.com]\n\n后见！\n\n# 附录 A. 衍生发行版\n\n许多 Linux 发行版都是 Debian 的衍生版，并复用了\
  \ Debian 的包管理工具。它们都有自己有趣的特性，可能其中一个会比 Debian 本身更能满足你的需求。\n\n## A.1. 普查与协作\n\nDebian\
  \ 项目完全承认衍生发行版的重要性，并积极支持所有参与方之间的协作。这通常涉及将最初由衍生发行版开发的改进合并回，以便每个人都能受益，并减少长期维护工作。\n\n\
  这解释了为什么衍生发行版被邀请参与 `debian-derivatives@lists.debian.org` 邮件列表的讨论，并参与衍生普查。该普查旨在收集衍生版中正在进行的信息，以便官方\
  \ Debian 维护者能够更好地跟踪软件包在 Debian 变体中的状态。\n\n→ [https://wiki.debian.org/DerivativesFrontDesk]\
  \ → [https://wiki.debian.org/Derivatives/Census]\n\n现在让我们简要描述最有趣和流行的衍生发行版。\n\n##\
  \ A.2. Ubuntu\n\n\n\nUbuntu 在自由软件领域的出现引起了不小的轰动，这并非偶然：创建该发行版的 Canonical Ltd. 公司起初雇佣了三十多名\
  \ Debian 开发者，并公开宣布了一个影响深远的目标：为普通公众提供一个每年发布两次的发行版。他们还承诺对每个版本维护一年半。\n\n这些目标不可避免地涉及缩小范围；Ubuntu\
  \ 关注的软件包数量比 Debian 少，并且主要依赖 `GNOME` 桌面环境（尽管也有带有其他桌面环境的 Ubuntu 派生版）。所有内容都经过国际化处理，并以多种语言提供。\n\
  \n到为止，Ubuntu 成功地保持了这一发布节奏。他们还发布`长期支持`（LTS）版本，并承诺提供 5 年维护。截至 2019 年 6 月，当前的 LTS 版本是\
  \ 18.04，代号为 Bionic Beaver（电音海狸）。最后一个非 LTS 版本是 19.04 版本，代号为 Disco Dingo（迪斯科叮羊）。版本号描述了发布日期：例如，19.04\
  \ 是在 2019 年 4 月发布的。\n\n### 实践：Ubuntu 的支持与维护承诺\n\nCanonical 多次调整了规定特定版本维护期限的规则。作为一家公司，Canonical\
  \ 承诺为 Ubuntu 存档中 `main` 和 `restricted` 部分的所有可用软件提供安全更新，LTS 版本提供 5 年，非 LTS 版本提供 9\
  \ 个月。其他所有内容（位于 `universe` 和 `multiverse` 中）均由 `MOTU` 团队（`万物之主`）的志愿者根据“尽力而为”的原则进行维护。如果您依赖后部分的软件包，请准备好自己处理安全支持。\n\
  \nUbuntu 已经接触了广泛的普通大众。数百万用户对其简洁的安装过程以及为了让桌面更易用而付出的努力留下了深刻印象。\n\nUbuntu 和 Debian\
  \ 曾经是有过紧张的关系；寄予厚望希望 Ubuntu 能直接贡献 Debian 的 Debian 开发者对 Canonical 营销手段与实际做法之间的差异感到失望——营销手段暗示\
  \ Ubuntu 是自由软件世界中的良好公民，而实际操作中他们仅仅公开了对 Debian 软件包所做的更改。多年来情况一直在好转，Ubuntu 现在已将补丁转发到最合适的地方作为一种常规做法（尽管这仅适用于他们打包的外部软件，而不适用于\
  \ `Mir` 或 `Unity` 等 Ubuntu 特有的软件）。\n\n→ [`www.ubuntu.com/`](https://www.ubuntu.com/)\n\
  \n# Linux Mint\n\nLinux Mint 是一个（部分）社区维护的发行版，通过捐赠和广告支持。他们的旗舰产品基于 Ubuntu，但也提供一个持续演进的“Linux\
  \ Mint Debian 版”（LMDE）变体（因为它基于 Debian Testing）。在这两种情况下，初始安装都涉及启动现场 DVD 或现场 USB 存储设备。\n\
  \n该发行版旨在简化获取高级技术的途径，并在常规软件之上提供了特定的图形用户界面。例如，Linux Mint 默认依赖 `Cinnamon` 而不是 `GNOME`（但也包含了\
  \ `MATE` 以及 `Xfce`）；同样，软件包管理界面虽然基于 `APT`，但提供了一个可以对每个软件包更新风险评估的特定界面。\n\nLinux Mint\
  \ 包含了大量的专源软件，以提高可能需要它们的用户体验。例如：Adobe Flash 和多媒体解码器。\n\n→ [`linuxmint.com/`](https://linuxmint.com/)\n\
  \n# Knoppix\n\nKnoppix 发行版几乎不需要介绍。它是第一个提供`live CD` 的流行发行版；换句话说，它是一个可引导 CD-ROM，可以运行一个即插即用的\
  \ Linux 系统，而不需要硬盘——机器上已安装的任何系统都将不受影响。对可用设备的自动检测使得该发行版能够在大多数硬件配置下运行。CD-ROM 包含了近 2\
  \ GB 的（压缩）软件，而 DVD-ROM 版本更多。\n\n将此 CD-ROM 结合 USB 优盘可以让你随身携带文件，并在任何计算机上工作而不留任何痕迹——记住该发行版完全不使用硬盘。Knoppix\
  \ 默认使用 `LXDE`（一种轻量级图形桌面），但 DVD 版本还包含了 `GNOME` 和 `Plasma`。许多其他发行版提供了其他桌面和软件的组合。这在一定程度上得益于\
  \ `live-build` Debian 软件包，它使得创建现场 CD 变得相对简单。\n\n→ [`live-team.pages.debian.net/live-manual/`](https://live-team.pages.debian.net/live-manual/)\n\
  \n注意 Knoppix 还提供一个安装程序：你可以先作为现场 CD 尝试该发行版，然后将其安装到硬盘上以获得更好的性能。\n\n→ [`www.knopper.net/knoppix/index-en.html`](https://www.knopper.net/knoppix/index-en.html)\n\
  \n# Aptosid and Siduction\n\n这些基于社区的发行版跟踪 Debian `Sid`（不稳定版）的变化——这也是它们名字的由来。它们的修改范围有限：目标是提供最新的软件并为最新的硬件更新驱动，同时允许用户随时切换官方\
  \ Debian 发行版。Aptosid 曾名为 `Sidux`，而 Siduction 是 Aptosid 一个较新的分支。\n\n→ [`aptosid.com`](http://aptosid.com)\
  \ → [`siduction.org`](https://siduction.org)\n\n\n\n\nRaspbian 是基于 Debian 的重新构建版本，针对流行的（且廉价的）树莓派单板计算机进行了优化。该平台的硬件性能优于\
  \ Debian `armel` 架构所能利用的，但缺少某些 `armhf` 所需的功能；因此，Raspbian 是一种中间方案，专门为该硬件重新构建，并包含了仅针对该计算机的补丁。\n\
  \n→ [`raspbian.org`](https://raspbian.org)\n\n# A.12. PureOS\n\nPureOS 是一个专注于隐私、便利性和安全的\
  \ Debian 发行版。它遵循 [GNU 自由系统发行指南](https://www.gnu.org/distros/free-system-distribution-guidelines.html)，自由软件基金会根据该指南判定一个发行版是否为自由软件。其开发由社会企业公司\
  \ Purism 引导。\n\n→ [`pureos.net/`](https://pureos.net/)\n\n# A.13. SteamOS\n\nSteamOS\
  \ 是由 Valve 公司开发的面向游戏的基于 Debian 发行版。它用于 Steam Machine 系列游戏电脑。\n\n→ [`store.steampowered.com/steamos/`](https://store.steampowered.com/steamos/)\n\
  \n# A.14. 以及更多更多\n\nDistrowatch 网站引用了大量的 Linux 发行版，其中许多基于 Debian。浏览该网站是感受自由软件世界多样性的绝佳方式。\n\
  \n→ [`distrowatch.com`](https://distrowatch.com)\n\n搜索表单可以帮助根据血缘追踪发行版。在 2019 年 6\
  \ 月，选择 Debian 导致了 127 个活跃发行版！\n\n→ [`distrowatch.com/search.php`](https://distrowatch.com/search.php)\n\
  \n# 附录 B. 短期补习课程\n\n尽管这本书主要针对管理员和“高级用户”，但我们并不希望排除有积极性的初学者。因此，本附录将是一门速成课程，描述处理 Unix\
  \ 计算机时涉及的基础概念。\n\n# B.1. Shell 和基础命令\n\n在 Unix 世界中，每位管理员迟早都要使用命令行；例如，当系统无法正常启动且仅提供命令行救援模式时。因此，能够处理此类界面是应对这种情况的基本生存技能。\n\
  \n### 快速浏览 启动命令解释器\n\n命令行环境可以从图形桌面运行，通过名为“终端”的应用程序。在 GNOME 中，你可以通过“活动”概览（当你移动鼠标到屏幕左上角时出现）并输入应用程序名称的首字母来启动它。在\
  \ Plasma 中，你可以在 K → 应用 → 系统菜单中找到它。\n\n本节仅对命令进行快速预览。所有命令都有许多此处未描述的选项，因此请参阅它们各自手册页中丰富的文档。\n\
  \n## B.1.1. 浏览目录树和管理文件\n\n一旦会话打开，`pwd` 命令（代表*打印工作目录* *print working directory*）会显示文件系统中的当前位置。使用\
  \ `cd directory` 命令更改当前目录（`cd` 代表*切换目录* *change directory*）。父目录始终称为 `..`（两个点），而当前目录也称为\
  \ `.`（一个点）。`ls` 命令允许*列出*目录的内容。如果不给出参数，它将在当前目录上操作。\n\n```\n$ pwd /home/rhertzog $\
  \ cd Desktop $pwd /home/rhertzog/Desktop $ cd . $pwd /home/rhertzog/Desktop $ cd\
  \ .. $pwd /home/rhertzog $ls Desktop Downloads Pictures Templates Documents Music\
  \ Public Videos\n```\n\n可以使用 `mkdir directory` 创建新目录，并使用 `rmdir directory` 删除现有的（空）目录。`mv`\
  \ 命令允许*移动*和/或重命名文件和目录；*删除*一个文件则通过 `rm file` 实现。\n\n```\n$ mkdir test $ls Desktop\
  \ Downloads Pictures Templates Videos Documents Music Public test $ mv test new\
  \ $ls Desktop Downloads new Public Videos Documents Music Pictures Templates $ rmdir\
  \ new $ ls Desktop Downloads Pictures Templates Videos Documents Music Public\n\
  ```\n\n## B.1.2. 显示和修改文本文件\n\n`cat file` 命令（旨在将文件*连接* *concatenate* *concatenate*到标准输出设备）读取文件并在终端上显示其内容。如果文件太大无法显示在屏幕上，请使用如\
  \ `less`（或 `more`）之类的分页器逐页显示。\n\n`editor` 命令启动文本编辑器（如 `vi` 或 `nano`），并允许创建、修改和读取文本文件。得益于重定向，有时可以直接从命令解释器创建最简单的文件：`echo\
  \ \"text\" > file` 会创建一个名为 `file` 的文件，内容为“text”。也可以在该文件的末尾添加一行，使用如 `echo \"moretext\"\
  \ >> file` 之类的命令。请注意此示例中的 `>>`。\n\n## B.1.3. 搜索文件和文件内容\n\n`find directory criteria`\
  \ 命令根据若干标准在 `directory` 下的层次结构中查找文件。最常用的标准是 `-name name`：它允许通过文件名查找文件。\n\n`grep\
  \ expression files` 命令搜索文件内容并提取匹配正则表达式的行（参见侧栏 *回到基础* 正则表达式）。添加 `-r` 选项可以对作为参数的目录包含的所有文件进行递归搜索。这允许在已知部分内容时查找文件。\n\
  \n## B.1.4. 管理进程\n\n`ps aux` 命令列出当前运行的进程，并通过显示它们的 *pid*（进程 ID *process id*）来帮助识别它们。一旦知道进程的\
  \ *pid*，`kill -signal pid` 命令允许对其发送信号（如果该进程属于当前用户）。存在多种信号；最常用的是 `TERM`（优雅终止的请求）和\
  \ `KILL`（强制杀死）。\n\n命令解释器也可以在命令后带有“&”的情况下在后台运行程序。通过使用安符，用户可以立即恢复对 shell 的控制，即使命令仍在运行（对用户不可见；作为后台进程）。`jobs`\
  \ 命令列出在后台运行的进程；运行 `fg %job-number`（*前台* *foreground*）将作业恢复到前台。当命令在前台运行时（无论是因为它是正常启动的，还是通过\
  \ `fg` 恢复到前台的），`Control`+`Z` 键组合会暂停进程并恢复对命令行的控制。然后可以使用 `bg %job-number`（*后台* *background*）在后台重启该进程。\n\
  \n## B.1.5. 系统信息：内存、磁盘空间、标识\n\n`free` 命令显示内存信息；`df`（磁盘剩余 *disk free*）报告挂载在文件系统的每个磁盘上的可用磁盘空间。其\
  \ `-h` 选项（人类可读 *human readable*）将大小转换为更易读的单位（通常是兆字节或千字节）。类似地，`free` 命令支持 `-m` 和\
  \ `-g` 选项，并将其数据显示为兆字节或千字节。\n\n```\n$ free total free shared/cache available Mem:\
  \ 16279260 5910248 523432 871036 9845580 9128964 Swap: 16601084 240640 16360444\
  \ $ df Filesystem 1K-blocks Used Available Use% Mounted ondev 8108516 0 8108516\
  \ 0% /dev tmpfs 1627928 161800 1466128 10% /run /dev/mapper/vg_main-root 466644576\
  \ 451332520 12919912 98% / tmpfs 8139628 146796 7992832 2% /dev/shm tmpfs 5120 4\
  \ 5116 1% /run/lock tmpfs 8139628 0 8139628 0% /sys/fs/cgroup /dev/sda1 523248 1676\
  \ 521572 1% /boot/efi tmpfs 1627924 88 1627836 1% /run/user/1000\n```\n\n\n\n\n\
  `id` 命令显示运行当前会话的用户身份，以及其所属的组列表。由于对某些文件或设备的访问可能仅限于组成员，因此检查可用的组权限可能会很有用。\n\n```\n\
  $ uid=1000(rhertzog) gid=1000(rhertzog) groups=1000(rhertzog),24(cdrom),25(floppy),27(sudo),29(audio),30(dip),44(video),46(plugdev),108(netdev),109(bluetooth),115(scanner)\n\
  ```\n\n# B.2. 文件系统层次结构的组织\n\n## B.2.1. 根目录\n\nDebian 系统根据*文件系统层次结构标准*(FHS)进行组织。该标准定义了每个目录的用途。例如，顶级目录描述如下：\n\
  \n* `/bin/`：基础程序；\n* `/boot/`：Linux 内核及早期启动过程所需的其他文件；\n* `/dev/`：设备文件；\n* `/etc/`：配置文件；\n\
  * `/home/`：用户的个人文件；\n* `/lib/`：基础库；\n* `/media/*`：可移动设备的挂载点（CD-ROM、USB 闪盘等）；\n*\
  \ `/mnt/`：临时挂载点；\n* `/opt/`：第三方提供的额外应用程序；\n* `/root/`：管理员（root）的个人文件；\n* `/run/`：不跨重启持久的易失性运行时数据；\n\
  * `/sbin/`：系统程序；\n* `/srv/`：托管在该系统上的服务器所使用的数据；\n* `/tmp/`：临时文件；此目录通常在启动时被清空；\n*\
  \ `/usr/`：应用程序；此目录进一步细划为 `bin`、`sbin`、`lib`（逻辑与根目录相同）。此外，`/usr/share/` 包含与架构无关的数据。`/usr/local/`\
  \ 供管理员手动安装应用程序，而不会覆盖由软件包系统（`dpkg`）处理的文件。\n* `/var/`：守护进程处理的可变数据。这包括日志文件、队列、置桶、缓存等。\n\
  * `/proc/` 和 `/sys/` 是 Linux 内核特有的（不属于 FHS）。内核使用它们将数据导出到用户空间（关于此概念的解释，请参见 第 B.3.4\
  \ 节，“用户空间” 和 第 B.5 节，“用户空间”）。\n\n注意，许多现代发行版（包括 Debian）将 `/bin`、`/sbin` 和 `/lib`\
  \ 发布为指向 `/usr` 下对应目录的软链接，以便所有程序和库在单一树结构中可用。这使得更容易保护系统文件的完整性，并在多个容器之间共享这些系统文件等。\n\
  \n## B.2.2. 用户家目录\n\n用户家目录的内容没有标准，但仍有一些值得注意的惯例。其一个是用户家目录通常用波号（“~”）表示。这很有用，因为命令解释器会自动将波号替换为正确的目录（通常是\
  \ `/home/user/`）。\n\n传统上，应用程序配置文件通常直接存储在用户家目录下，但它们的通常以点开头（例如，`mutt` 邮件客户端将其配置存储在\
  \ `~/.muttrc`）。注意，以点开头的文件名默认是隐藏的；`ls` 仅在使用 `-a` 选项时才会列出它们，而图形化文件管理器需要被指示显示隐藏文件。\n\
  \n某些程序还会使用组织在一个目录中的多个配置文件（例如，`~/.ssh/`）。某些应用程序（如 Firefox）还会使用其目录来存储下载数据的缓存。这意味着这些目录可能会占用大量磁盘空间。\n\
  \n这些直接存储在用户家目录下的配置文件通常统称为*点文件*（dotfiles），早已泛滥到导致这些目录可能因为它们而变得非常杂乱。幸运的是，在 FreeDesktop.org\
  \ 伞下共同领导的一项工作产生了“XDG 基础目录规范”（XDG Base Directory Specification），这是一个旨在清理这些文件和目录的惯例。该规范规定配置文件应存储在\
  \ `~/.config` 下，缓存文件存储在 `~/.cache` 下，应用程序数据文件存储在 `~/.local`（或其子目录）下。这种做法逐渐流行，许多应用程序（尤其是图形程序）已开始遵循它。\n\
  \n图形桌面通常在桌面上显示 `~/Desktop/` 目录（或对于未配置为英语的系统，相应的翻译）的内容（即在所有应用程序关闭或最小化后在屏幕上可见的内容）。\n\
  \n最后，邮件系统有时会将传入邮件存储在 `~/Mail/` 目录。\n\n# B.3. 计算机的内部运作：涉及的不同层次\n\n计算机通常被认为是非常抽象的，外部可见的界面比其内部复杂性简单得多。这种复杂性部分源于涉及组件的数量。然而，这些组件可以被分层查看，每一层只与其正上方或下方的层进行交互。\n\
  \n只要一切运行正常，终端用户不需要知道这些细节也可以应付……面对诸如“互联网无法使用！”这样的问题时，要要做的事情是确定问题源于哪一层。网卡（硬件）工作正常吗？计算机识别它了吗？Linux\
  \ 内核看到它了吗？网络参数配置正确吗？这些问题可以隔离出相应的层并关注潜在的问题源。\n\n## B.3.1. 最深层：硬件\n\n让我们从一个基础回顾开始：计算机首先是一组硬件元素的集合。通常有一个主板（称为\
  \ *motherboard*），上面带有一个（或多个）处理器、一些内存、设备控制器以及用于扩展板的插槽。这些控制器中最值得注意的是 IDE（并行 ATA）、SCSI\
  \ 和串行 ATA，用于连接硬盘等存储设备。其他控制器包括 USB（它可以支持各种设备，从摄像头到温度计，从键盘到家庭自动化系统）和 IEEE1394（火线）。这些控制器通常允许连接多个设备，因此由控制器处理的整个子系统被称为“总线”。扩展板包括显卡等。\n\
  \n*实践*检查硬件工作\n\n检查硬件是否工作正常可能很困难。相反，证明它不工作正常有时非常简单。\n\n硬盘由旋转的盘片和移动的磁头组成。当硬盘通电时，盘片电机会发出特征性的嗡嗡声。它还将能量转化为热。因此，通电后保持冰冷安静的硬盘是坏的。\n\
  \n网卡通常带有显示链路状态的 LED。如果插了电缆并连接到良好的网络聚集器或交换机，至少有一个 LED 会亮。如果没有 LED 亮，说明网卡本身、网络设备或它们之间的电缆存在故障。因此，下一步是单独测试每个组件。\n\
  \n某些扩展板——尤其是 3D 显卡——包含冷却设备，如散热片和/或风扇。如果显卡已通电但风扇没有旋转，一个合理的解释是显卡过热了。这也适用于主板上的主处理器。\n\
  \n## B.3.2. 启动器：BIOS 或 UEFI\n\n\n\n\n\n硬件本身如果没有相应的软件驱动，是无法执行任何有用任务的。控制与硬件交互是操作系统和应用程序的目的。而这些程序反过来需要功能性的硬件才能运行。\n\
  \n硬件与软件之间的这种共生并非自动发生。当计算机首次启动时，需要进行初始设置。这一角色由 `BIOS` 或 `UEFI` 承担，它们是嵌入在主板中的软件，在通电时自动运行。它的首要任务是寻找可以将其移交控制权的软件。通常，在\
  \ `BIOS` 的情况下，这涉及寻找第一个带有引导区（也称为`主引导记录`或 `MBR`）的硬盘硬盘，加载该引导区并运行它。从那时起，`BIOS` 通常就不再参与（直到下一次启动）。在\
  \ `UEFI` 的情况下，该过程涉及扫描磁盘，以找到一个包含更多待执行 `EFI` 应用程序的专用 `EFI` 分区。\n\n### Setup，BIOS/UEFI\
  \ 配置工具\n\n`BIOS`/UEFI` 还包含一个名为 `Setup` 的软件，设计用于配置计算机的各个方面。具体而言，它允许选择首选启动设备（例如，你可以选择\
  \ `USB` 闪存盘或 `CD-ROM` 驱动器而不是默认硬盘）、设置系统时等。启动 `Setup` 通常涉及在计算机通电后很快按下某个按键。这个键通常是 `Del`\
  \ 或 `Esc`，有时是 `F2` 或 `F10`。大多数情况下，该选择会在启动时显示在屏幕上。\n\n引导区（或 `EFI` 分区）反过来包含另一个软件，称为\
  \ `bootloader`（引导加载），其目的是寻找并运行操作系统。由于这个 `bootloader` 并不是嵌入在主板中的，而是从磁盘加载的，它可以比 `BIOS`\
  \ 更智能，这解释了为什么 `BIOS` 不自己加载操作系统。例如，`bootloader`（在 Linux 系统上通常是 `GRUB`）可以列出可用的操作系统并要求用户选择一个。通常，会提供超时时间和默认选项。有时用户还可以选择添加传递给内核的参数等。最终，会找到一个内核，将其加载到内存中并执行。\n\
  \n### 注意：UEFI 是 BIOS 的现代替代品\n\n大多数新电脑默认以 `UEFI` 模式启动，但通常它们也支持传统的 `BIOS` 启动，以兼容尚未准备好利用\
  \ `UEFI` 的操作系统。\n\n这种新系统消除了 `BIOS` 启动的一些局限性：通过使用专用分区，`bootloaders` 不再需要使用特殊技巧来挤进微小的`主引导记录`中然后发现内核进行启动。更好的是，通过一个构建良好的\
  \ Linux 内核，`UEFI` 可以直接引导内核而无需任何中间引导程序。`UEFI` 还是交付 `Secure Boot`（安全启动）的基础基础，该技术确保你只运行由你的操作系统供应商验证的软件。\n\
  \n`BIOS`/UEFI` 还负责检测和初始化许多设备。显然，这包括 `IDE/SATA` 设备（通常是硬盘和 `CD/DVD-ROM` 驱动器），还包括 `PCI`\
  \ 设备。检测到的设备通常会在启动过程中列在屏幕上。如果列表滚动得太快，使用 `Pause` 键冻结它，直到有足够阅读。已安装但未出现的 `PCI` 设备是不吉利的征兆。最坏的情况下，设备存在故障；最好的情况下，它仅仅与当前的\
  \ `BIOS` 或主板版本不兼容。`PCI` 规范不断演进，旧主板不能保证能处理新的 `PCI` 设备。\n\n## B.3.3. 内核\n\n`BIOS`/UEFI`\
  \ 和 `bootloader` 都只运行几秒钟；现在我们进入了运行时间较长的第一个软件——操作系统内核。这个内核扮演着交响团指挥家的角色，确保硬件和软件之间的协调。这一角色涉及多个任务，包括：驱动硬件、管理进程、用户和权限、文件系统等。内核为系统上的所有其他程序提供了共同基础。\n\
  \n## B.3.4. 用户空间\n\n尽管内核之外发生的所有事情都可以归类为“用户空间”，但我们仍然可以将其分为不同的软件层。然而，它们的交互比以前更复杂，分类可能没那么简单。应用程序通常使用库，而库反过来涉及内核，但通信也可能涉及其他程序，甚至是许多库相互调用。\n\
  \n# B.4. 内核处理的一些任务\n\n## B.4.1. 硬件驱动\n\n内核的首要任务首先是控制硬件部分、检测它们、在计算机通电时开启它们等。它还通过简化的编程接口为高层软件提供这些设备，以便应用程序可以利用设备，而无需担心类似选项卡插在哪个扩展槽等细节。编程接口还提供了一个抽象层；这允许视频会议软件等独立于品牌和型号使用摄像头。软件只需使用\
  \ `Video for Linux` (`V4L`) 接口，内核会将该接口的函数调用翻译为正在使用的特定摄像头所需的实际硬件命令。\n\n内核通过 `/proc/`\
  \ 和 `/sys/` 虚拟文件系统导出许多关于检测硬件的的。几个工具总结了这些细节。其中，`lspci`（在 `pciutils` 包中）列出 `PCI` 设备，`lsusb`（在\
  \ `usbutils` 包中）列出 `USB` 设备，`lspcmcia`（在 `pcmciautils` 包中）列出 `PCMCIA` 卡。这些工具对于识别设备的精确型号非常有用。这种识别也允许在网络上进行更精确的搜索，从而带来更相关的文档。\n\
  \n示例 B.1. `lspci` 和 `lsusb` 提供的信息示例\n```\nlspci [...] 00:02.1 Display controller:\
  \ Intel Corporation Mobile 915GM/GMS/910GML Express Graphics Controller (rev 03)\
  \ 00:1c.0 PCI bridge: Intel Corporation 82801FB/FBM/FR/FW/FRW (ICH6 Family) PCI\
  \ Express Port 1 (rev 03) 00:1d.0 USB Controller: Intel Corporation 82801FB/FBM/FR/FW/FRW\
  \ (ICH6 Family) USB UHCI #1 (rev 03) [...] 01:00.0 Ethernet controller: Broadcom\
  \ Corporation NetXtreme BCM5751 Gigabit Ethernet PCI Express (rev 01) 02:03.0 Network\
  \ controller: Intel Corporation PRO/Wireless 2200BG Network Connection (rev 05)\n\
  lsusb Bus 005 Device 004: ID 413c:a005 Dell Computer Corp. Bus 005 Device 008: ID\
  \ 413c:9001 Dell Computer Corp. Bus 005 Device 007: ID 045e:00dd Microsoft Corp.\
  \ Bus 005 Device 006: ID 046d:c03d Logitech, Inc. [...] Bus 002 Device 004: ID 413c:8103\
  \ Dell Computer Corp. Wireless 350 Bluetooth\n```\n\n这些程序有一个 `-v` 选项，列出更详细（但通常没有必要）的信息。最后，`lsdev`\
  \ 命令（在 `procinfo` 包中）列出设备使用的通信资源。\n\n应用程序通常通过在 `/dev/` 中创建的特殊文件访问设备（参见侧边栏 `BACK\
  \ TO BASICS` 设备访问权限）。这些特殊文件代表磁盘驱动器（例如 `/dev/hda` 和 `/dev/sdc`）、分区（`/dev/hda1` 或\
  \ `/dev/sdc3`）、鼠标（`/dev/input/mouse0`）、键盘（`/dev/input/event0`）、声卡（`/dev/snd/*`）、串口（`/dev/ttyS*`）等。\n\
  \n## B.4.2. 文件系统\n\n文件系统是内核最特点之一。Unix 系统将所有文件存储合并到一个层次结构中，这允许用户（和应用程序）只需知道数据在该层次结构中的位置即可访问数据。\n\
  \n\n\n\n这种分级树的起点被称为根目录，即 `/`。该目录可以包含命名的子目录。例如，`/` 的 `home` 子目录被称为 `/home/`。该子目录反又包含其他子目录，以此此类推。每个目录还可以包含文件，实际数据就存储在其中。因此，`/home/rmas/Desktop/hello.txt`\
  \ 名称指的是存储在根目录下的 `home` 目录中 `rmas` 子目录的 `Desktop` 子目录下的名为 `hello.txt` 的文件。内核在这种命名系统与磁盘上的实际物理存储之间进行转换。\n\
  \n与其他系统不同，这里只有一个这样的层级结构，并且它可以整合来自几块磁盘的数据。其中一块磁盘被用作根目录，其他的磁盘被“挂载”到层级结构中的目录上（Unix\
  \ 命令称为 `mount`）；这些其他磁盘随后在这些“挂载点”下可用。这允许用户的家目录（传统上存储在 `/home/` 中）存储在第二块硬盘上，该硬盘将包含\
  \ `rhertzog` 和 `rmas` 目录。一旦磁盘挂载到 `/home/`，这些目录就可以在它们通常的位置访问，并且像 `/home/rmas/Desktop/hello.txt`\
  \ 的路径也可以继续工作。\n\n有许多文件系统格式，对应于磁盘上物理存储数据的多种方式。最广为人的是 `ext3` 和 `ext4`，但也存在其他格式。例如，`vfat`\
  \ 是历史上 DOS 和 Windows 操作系统使用的系统，它允许在 Debian 以及 Windows 下使用硬盘。在任何情况下，文件系统在挂载之前必须在磁盘上准备好，这种操作被称为“格式化”。诸如\
  \ `mkfs.ext3`（其中 `mkfs` 代表 `MaKe FileSystem`）的命令负责格式化。这些命令需要一个代表要格式化分区的设备文件作为参数（例如\
  \ `/dev/sda1`）。此操作是破坏性的，应该只运行一次，除非人们故意想要擦掉文件系统并从头开始。\n\n还有网络文件系统，例如 `NFS`，数据并不存储在本地磁盘上。相反，数据通过网络传输到服务器，由服务器按需存储和检索。文件系统的抽象使得使用户无需担心：文件仍然以它们通常的层级方式进行访问。\n\
  \n## B.4.3. 共享函数\n\n由于许多相同的函数被所有软件使用，因此将它们集中在内核中是有意义的。例如，共享的文件系统处理允许任何应用程序简单地通过名称打开文件，而无需担心文件物理上存储在何处。文件可以存储在硬盘的几个不同切片上，或者跨越几块硬盘，甚至可以存储在远程文件服务器上。共享通信函数被应用程序用于交换数据，而独立于数据传输的方式。例如，传输可以通过任何本地或无线网络的组合进行，或者通过电话陆地线进行。\n\
  \n## B.4.4. 进程管理\n\n进程是程序的运行实例。这需要内存来同时存储程序本身及其运行数据。内核负责创建和跟踪它们。当程序运行时，内核首先拨留一些内存，然后从文件系统将可执行代码加载到该内存中，然后开始运行代码。它保留有关该进程的信息，其中最可见的是一个被称为\
  \ `pid`（*进程标识符*）的标识号。\n\nUnix 类内核（包括 Linux）与其他大多数现代操作系统一样，能够实现“多任务”。换句话说，它们允许“同时”运行许多进程。实际上，在任何时刻只有一个运行中的进程，但内核将时间切成微小的切片并轮运行每个进程。由于这些时间片非常短（在毫秒范围内），它们营造了进程并行运行的幻象，尽管它们实际上在某些时间间隔内处于活跃状态，其余时间空闲。内核的工作是调整其调度机制以保持这种幻象，同时最大化全局系统性能。如果时间片太长，应用程序的响应速度可能不如预期。如果时间片太短，系统在频繁切换任务上浪费时间。这些决策可以通过进程优先级进行微调。高优先级进程将比低优先级进程运行得更长，且获得的时间片频率更高。\n\
  \n### 注意事项：多处理器系统（及其变体）\n\n上述关于同一时间只能运行一个进程的限制并不总是适用。实际的限制是，*每个处理器核心*同一时间只能运行一个运行进程。多处理器、多核心或“超线程”系统允许多个进程并行运行。尽管如此，仍然使用相同的时间分片系统，以处理活动进程多于可用处理器核心的情况。这并不稀奇：一个基础系统，即使是大部分处于空闲状态的系统，几乎也有几十个正在运行的进程。\n\
  \n当然，内核允许运行同一个程序的多个独立实例。但每个实例只能访问自己的时间片和内存。因此，它们的数据保持独立。\n\n## B.4.5. 权限管理\n\nUnix\
  \ 类系统也是多用户系统。它们提供了一个权限管理系统，支持单独的用户和组；它还允许基于权限控制操作。内核管理每个进程的数据，允许其控制权限。大多数时候，进程由启动它的用户识别。该进程仅被允许执行其所有者可以执行的操作。例如，尝试打开文件需要内核根据访问权限检查进程身份（有关此特定特定示例的更多信息，请参见\
  \ 第 9.3 节，“管理权限`）。\n\n# B.5. 用户空间\n\n“用户空间”指的是普通（相对于内核）进程的运行环境。这并不意味着这些进程实际上是由用户启动的，因为标准系统在用户打开会话之前通常会有几个“守护”（或后台）进程在运行。守护进程也被视为用户空间进程。\n\
  \n## B.5.1. 进程\n\n当内核通过初始化阶段后，它启动了第一个进程 `init`。仅有 1 号进程本身很少有用，Unix 类系统在许多额外进程的情况下运行。\n\
  \n首先，进程可以克隆自己（这被称为 *fork*）。内核分配一个新的（但完全相同的）进程内存空间，并将另一个进程来使用它。此时，这两个进程之间的唯一区别是它们的\
  \ `pid`。新进程通常被称为子进程，而 `pid` 不变的原始进程被称为父进程。\n\n有时，子进程会独立于父进程继续过自己的生活，其数据是从父进程复制的。然而，在许多情况下，这个子进程会执行另一个程序。除少数例外外，它的内存会被被新程序的内存替换，并开始执行该新程序。这就是\
  \ init 进程（进程号为 1）用于启动附加服务和执行整个启动序列的机制。在某个时刻，`init` 后代中的一个进程会启动一个供用户登录的图形界面（实际的事件序列在\
  \ 第 9.1 节，“系统引导` 中进行了更详细的描述）。\n\n\n\n\n当一个进程完成其启动时执行的任务后，它就会终止。内核随后会回收分配给该进程的内存，并停止向其分配运行时间片。父进程会收到子进程终止的通知，这允许进程等待其分派给子进程的任务完成。这种行为在命令行解释器（称为\
  \ `shells`）中显而易见。当在 shell 中输入一个命令时，只有在命令执行完成后，提示符才会返回。大多数 shell 都允许在后台运行命令，这只需要在命令末尾添加一个\
  \ `&` 即可，非常简单。提示符会立即再次显示，但如果命令需要显示自己的数据，这可能会导致问题。\n\n## B.5.2. 守护进程 (Daemons)\n\n\
  “守护进程”（daemon）是一个由启动序列自动启动的进程。它持续运行（在后台），以执行维护任务或为其他进程提供服务。这种“后台任务”实际上是任意的，从系统的角度来看，它们并不对应任何特定的内容。它们仅仅是进程，与其他进程非常相似，在自己的时间片到时时运行。区别仅在于人类语言：一个与用户没有交互而运行的进程（特别是在没有任何图形界面的情况下）被称为“在后台运行”或“作为守护进程运行”。\n\
  \n**词汇表** Daemon，demon，是一个贬义词吗？\n\n尽管 `daemon` 一词在希腊语源上与 `demon` 相同，但前者并不意味着魔鬼的邪恶，相反，它应该被理解为一种帮助精灵。这种区别在英语中足够微妙；而在其他语言中，由于同一个词同时用于这两种含义，情况就更糟了。\n\
  \n第 9 章，*Unix 服务*详细描述了几个此类守护进程。\n\n## B.5.3. 进程间通信 (Inter-Process Communications)\n\
  \n一个孤立的进程（无论是守护进程还是交互式应用程序）本身很少用用，这就是为什么有几种方法允许不同的进程相互进行通信，以交换数据或控制彼此。指代这种现象的通用术语是进程间通信，简称\
  \ `IPC`。\n\n最简单的 `IPC` 系统是使用文件。想要发送数据的进程将其写入文件（文件名预先已知），而接收者只需要打开文件并读取其内容即可。\n\n\
  在不想将数据存储在磁盘上的情况下，你可以使用 `pipe`（管道），它简单来说是一个具有两个端的对象；写入一端的字节流可以在另一端被读取。如果两端由不同的进程控制，这就会形成一个简单且方便的进程间通信通道。管道可以分为两类：命名管道和匿名管道。命名管道由文件系统上的条目表示（尽管传输的数据并不存储在那里），因此如果预先知道命名管道的位置，两个进程都可以独立地打开它。在通信进程之间存在关系的情况下（例如，父进程及其子进程），父进程也可以在派生（forking）之前创建一个匿名管道，并由子进程继承它。这样两个进程都将能够通过\
  \ `pipe` 交换数据，而不需要文件系统。\n\n**实践中** 一个具体的示例\n\n让我们详细描述一下当从 shell 运行一个复杂命令（`pipeline`）时发生了什么。假设我们有一个\
  \ `bash` 进程（Debian 上的标准用户 shell），`pid` 为 4374；在这个 shell 中，我们输入命令：`ls | sort`。\n\n\
  shell 首先解释输入的命令。在我们的案例中，它理解有两个程序（`ls` 和 `sort`），有一个数据流从一个流向另一个（用 `|` 字符表示，称为 `pipe`）。`bash`\
  \ 首先创建一个匿名管道（该管道最初仅存在于 `bash` 进程内部）。\n\n然后 shell 克隆了自己；这产生了一个新的 `bash` 进程，`pid`\
  \ 为 #4521（`pids` 是抽象数字，通常没有特殊含义）。进程 #4521 继承了 `pipe`，这意味着它能够向其“输入”端写入；`bash` 将标准输出流重定向到该\
  \ `pipe` 的输入。然后它执行（并替换自身）`ls` 程序，该程序列出当前目录的内容。由于 `ls` 向其标准输出写入，而该输出之前已被重定向，结果实际上被发送到了\
  \ `pipe` 中。\n\n第二个命令也发生了类似的操作：`bash` 再次克隆自己，产生了一个 `pid` 为 #4522 的新 `bash` 进程。由于它也是\
  \ #4374 的子进程，它也继承了 `pipe`；`bash` 然后将其标准输入连接到 `pipe` 输出，然后执行（并替换自身）`sort` 命令，该命令对输入进行排序并显示结果。\n\
  \n所有的拼图碎片现在都就绪了：`ls` 读取当前目录并将文件列表写入 `pipe`；`sort` 读取此列表，按字母顺序排序并显示结果。进程号 #4521 和\
  \ #4522 随后终止，而 #4374（在操作期间一直在等待它们）恢复控制权并显示提示符，允许用户输入新命令。\n\n然而，并不是所有的进程间通信都是用于移动数据的。在许多情况下，只需要传输的信息是控制消息，例如“暂停执行”或“恢复执行”。Unix（以及\
  \ Linux）提供了一种名为 `signals`（信号）的机制，通过这种机制，进程可以简单地向另一个进程发送特定的信号（从预定义的列表中选择）。唯一的要求是知道目标的\
  \ `pid`。\n\n对于更复杂的通信，还有机制允许进程打开或共享其分配的部分内存给其他进程。现在它们之间共享的内存可以用于移动数据。\n\n最后，网络连接也可以帮助进程通信；这些进程甚至可以位于数千公里外的计算机。\n\
  \n典型的 Unix 类系统在不同程度上利用了这些机制。\n\n## B.5.4. 库 (Libraries)\n\n函数库在类 Unix 操作系统起着至关重要的作用。它们不是真正的程序，因为它们不能独立执行，而是供程序使用的代码片段。在常用库中，你可以找到：\n\
  \n*   标准 C 库 (`glibc`)，包含基本函数，如打开文件或网络连接的函数，以及与其他内核交互的函数；\n*   图形工具包，如 Gtk+ 和 `Qt`，允许许多程序重用它们提供的图形对象；\n\
  *   `libpng` 库，允许加载、解释和保存 PNG 格式的图像。由于这些库，应用程序可以使用现有代码。应用程序开发被简化，因为许多应用程序可以使用相同的函数。由于库通常由不同的人开发，系统的全局开发更符合\
  \ Unix 的历史哲学。\n\n**文化** Unix 之道：一次只一件事\n\nUnix 家族的基础概念之一是每个工具应该只做一件事并把它做好；应用程序随后可以重用这些工具来构建更高级的逻辑。这种哲学可以在许多形式中看到。Shell\
  \ 脚本可能是最好的例子：它们组合了许多简单工具（如 `grep`、`wc`、`sort`、`uniq` 等）。这种哲学的另一种实现体现在代码库中：`libpng`\
  \ 库允许读取和写入 PNG 图像，有不同的选项和方式，但它只做这些；不包含显示或编辑图像的函数。\n\n\n\n\n此外，这些库通常被称为“共享库”，因为内核只需将它们加载到内存中一次，即使多个进程同时使用同一个库也是如此。与相反（假设）的情况相比——即库代码根据使用它的进程数量数量被多次加载——这种方式可以节省内存。\n"
