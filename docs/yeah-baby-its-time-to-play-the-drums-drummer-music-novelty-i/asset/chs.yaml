  \n# 第 1 章 Debian 项目\n\n在直接深入研究技术之前，让我们先了解一下 Debian 项目是什么、它的目标、手段和运作方式。\n\n## 1.1.\
  \ 什么是 Debian？\n\n**文化** Debian 名字的由来\n\n不用别处寻找了：Debian 并不是一个缩写。实际上，这个名字是两个名字的缩写：Ian\
  \ Murdock 的名字以及他当时的女友 Debra。`Debra + Ian = Debian`。\n\nDebian 是一个 GNU/Linux 发行版。我们将在第\
  \ 1.5 节，“发行版的角色” 中详细详细讨论什么是发行版，但目前我们只需简单地说明它是一个完整的操作系统，包含了用于安装和管理的软件和系统，所有这些基于 Linux\
  \ 内核和自由软件（特别是 GNU 项目的软件）。\n\nIan Murdock 在 1993 年 FSF 的领导下创建 Debian 时，有着明确的目标，并在他的*Debian\
  \ 宣言*中表达了这些目标。他追求的自由操作系统必须具备两个主要特征。首先是质量：Debian 将以极其谨慎的方式开发，以对得 Linux 内核。它也将是一个非商业发行版，具有足够的信誉来与主要的商业发行版竞争。在他看来，这种双重目标只有通过像\
  \ Linux 和 GNU 项目那样开放 Debian 的开发过程才能实现。因此，同行评审将不断改进产品。\n\n**文化** GNU，FSF 的项目\n\n\
  GNU 项目是一系列由自由软件基金（FSF）开发或赞助的自由软件，于其标志性的领袖 Richard M. Stallman 博士。GNU 是一个递归缩写，意为“GNU\
  \ Is Not Unix”（GNU 不是异 Unix）。\n\n**文化** Richard Stallman\n\n`FSF` 的创始人和 GPL 许可证的作者\
  \ Richard M. Stallman（通常简称为缩字母 RMS）是自由软件运动中一位富有魅力的领袖。由于他不妥协的立场，他并没有获得所有人的推仰，但他对自由软件的非技术贡献（特别是法律和哲学方面）受到了每个人的尊重。\n\
  \n### 1.1.1. 多平台操作系统\n\n**社区** Ian Murdock 的历程\n\nDebian 项目的创始人 Ian Murdock 是其第一任领导，从\
  \ 1993 年到 1996 年。在接棒交给 Bruce Perens 后，Ian 承担了不那么公开的角色。他回到自由软件社区的幕后工作，创立了 Progeny\
  \ 公司，旨在营销一种衍生自 Debian 的发行版。遗憾的是，这项创业在商业上失败了，开发也被放弃了。该公司在仅作为服务商维持了几年后，最终于 2007 年\
  \ 4 月申请破产。在 Progeny 发起的各种项目中，只有 `discover` 留了下来。它是一个自动硬件检测工具。\n\nIan Murdock 于 2015\
  \ 年 12 月 28 日于旧金山去世，在此之前发布了一系列令人担忧的推文，报告自己遭到了警察的袭击。2016 年 7 月，宣布他的死被裁定为自杀。\n\nDebian\
  \ 始终秉持最初的原则，取得了巨大的成功，如今已达到了一个惊人的规模。目前官方支持 10 种硬件架构，以及其他如 FreeBSD 等内核（尽管基于 FreeBSD\
  \ 的移植并不属于官方支持的架构集合范围）。此外，凭借超过 28,000 个源码包，可用软件可以满足家庭或企业中的几乎任何需求。\n\n该发行版庞大的规模可能会带来不便：在标准\
  \ PC 上分发 16 张 DVD-ROM 光盘来安装一个完整版本……这非常不合理……这就是为什么 Debian 越来越被视为一种“元发行版”，从从中提取出针对特定群体的更具体的发行版：用于科学用途的\
  \ Debian Science、用于学术环境下教育和教学目的的 Debian Edu、用于医疗应用的 Debian Med、针对年儿童的 Debian Jr.\
  \ 等。关于子项目的更完整列表可以在第 1.3.3.1 节，“现有的 Debian 子项目”中找到，专门为此。\n\nDebian 部分视图组织在一个定义良好的框架内，从而确保了各个“子发行版”之间无障碍的兼容性。它们都遵循新版本的发布通用计划。并且由于它们建立在相同的基础之上，可以轻松使用\
  \ Debian 仓库中提供的应用程序对其进行扩展、完善和个性化。\n\n所有的 Debian 工具都朝着这一方向运行：`debian-cd` 长期以来一直允许创建一组仅包含预选软件包的\
  \ CD-ROM；`debian-installer` 也是一个模块化安装程序，可以轻松地适应特殊需求。`APT` 将从各种来源安装包，同时确保系统的整体一致性。\n\
  \n**工具** 创建 Debian CD-ROM\n\n`debian-cd` 创建准备好可用的安装介质（CD、DVD、蓝光等等）的 ISO 镜像。关于此软件的任何问题都在\
  \ `debian-cd@lists.debian.org` 邮件列表（用英文）讨论。该团队由 Steve McIntyre 领导，他负责官方的 ISO 构建。\n\
  \n**回归基础** 每种计算机对应其架构\n\n“架构”一词指的是计算机类型（最著名的包括 Mac 或 PC）。每个架构主要根据其处理器进行区分，通常与其他处理器不兼容。硬件差异涉及不同的运行方式，因此软件需要针对特定架构进行编译。\n\
  \n### 1.1.2. 自由软件的质量\n\nDebian 遵循自由软件的所有原则，其新版本在准备就绪之前不会发布。开发人员不按照固定的时间表工作，也不会为了满足任意的截止日期而匆忙。人们经常抱怨\
  \ Debian 稳定版之间的时间间隔过长，但这种谨慎确保了 Debian 传奇般的可靠性：为了让整个发行版获得“稳定版”标签，确实需要数月的测试。\n\n\n\
  \n\n\nDebian 不会在质量上妥协：关键软件包中所有已知的严重漏洞将在任何新版本中得到解决，即使这需要推迟最初预计的发布日期。那些未修复严重漏洞、因此不符合质量要求的可选软件包，将直接从稳定版中剔除。\n\
  \n### 1.1.3. 法律框架：非营利组织\n\n从法律角度来说，Debian 是一个由美国非营利志愿者协会管理的项目。该项目约有一千名 `Debian 开发者`，但汇聚了得多的贡献者（翻译者、错误报告者、艺术家、业余开发者等）。\n\
  \n为了实现其使命，Debian 拥有庞大的基础设施，许多服务器连接在互联网上，并这些服务器由许多赞助者提供并托管。\n\n***\n\n### Debian\
  \ 背后的*社区*支持：SPI 协会与地方分支\n\nDebian 不以自己的名义拥有任何服务器，因为它只是“公共利益软件”协会（`SPI`）旗下的一个项目，该协会负责管理硬件和财务事务（捐赠、硬件购买等）。尽管该协会最初是专门为\
  \ Debian 项目创建的，但它现在托管了其他自由软件项目，特别是 PostgreSQL 数据库、Freedesktop.org（用于标准化现代图形桌面环境各个部分的项目，如\
  \ `GNOME` 和 `KDE Plasma`）以及 LibreOffice 办公套。\n\n→ [`www.spi-inc.org/`](https://www.spi-inc.org/)\n\
  \n除了 SPI，各种地方协会还与 Debian 密切合作，为 Debian 募集资金，而不是将所有事务集中在美国：它们在 Debian 术语中被称为“受信任组织”。这种设置避免了高昂的国际转账费用，并符合项目的去中心化本质。\n\
  \n欢迎加入您当地的协会并支持该项目！\n\n→ [`wiki.debian.org/Teams/Auditor/Organizations`](https://wiki.debian.org/Teams/Auditor/Organizations)\
  \ → [`france.debian.net/`](https://france.debian.net/) → [`debian.ch/`](https://debian.ch/)\n\
  \n***\n\n## 1.2. 基础文档\n\n在最初发布几年后，Debian 正式确定了其作为一个自由软件项目应遵循的原则。这一刻意的行动主义决策通过确保所有成员朝着同一方向进步，允许了有序且和平的发展。要成为\
  \ Debian 开发者，任何候选人都必须确认并证明他们对项目《基础文档》中确立原则的支持和遵循。\n\n开发过程不断被讨论，但这些基础文档得到了广泛且共识的支持，因此很少更改。Debian\
  \ 宪法还为它们的稳定性提供了其他保障：任何修正案都需要四之三的多数票通过。\n\n### 1.2.1. 对用户的承诺\n\n该项目还有一份“社会合同”。对于一个仅旨在开发操作系统的项目，这样的文本具有什么地位？这很简单：Debian\
  \ 为其用户服务，并以此推，也为社会服务。这份合同总结了项目承担的承诺。让我们详细研究它们：\n\n1. Debian 将保持 100% 自由。\n\n   这是第\
  \ 1 条规则。Debian 现在并将一直保持完全且唯一地由自由软件组成。此外，Debian 项目内部的所有软件开发都将是自由的。\n\n   ***\n\n\
  \   *视角*软件之外\n\n   第一版《Debian 社会合同》写道“Debian 将保持 100%的自由软件”。最后一个词的消失（随着 2004 年 4\
  \ 月合同 1.1 版本的批准）表明了实现自由的意愿，不仅是在软件方面，而且在 Debian 希望在其操作系统内提供的文档和任何其他元素中。\n\n   这一变化原本意图仅是编辑上的调整，但实际上它产生了许多后果，尤其是移除了一些有问题的文档。此外，驱动程序中固件使用的日益增加带来了问题：许多固件是非自由的，但对于相应硬件的正常运行又是必需的。\n\
  \n   ***\n\n2. 我们将回馈自由软件社区。\n\n   Debian 项目对集成到发行版中的作品的任何改进都会发送给该作品的作者（称为“上游”）。通常情况下，Debian\
  \ 将与社区合作，而不是孤立工作。\n\n   ***\n\n   *社区*上游作者，还是 Debian 开发者？\n\n   “上游作者”一术语是指作品的作者/开发者，即编写和开发它的人。另一方面，“Debian\
  \ 开发者”使用现有的作品将其转换为 Debian 软件包（“Debian 维护者”一词更为合适）。\n\n   在实践中，这两个角色可能存在重叠：Debian\
  \ 维护者可能会编写补丁，这会使该作品的所有用户受益。通常，Debian 鼓励负责 Debian 软件包的人员也参与“上游”开发（他们因此变成了贡献者，而不局限于简单的程序用户角色）。\n\
  \n   ***\n\n3. 我们不会隐藏问题。\n\n   Debian 并不完美，每天会有新问题需要修复。Debian 将始终向公众开放其整个错误报告数据库。人们在线上提交的报告将迅速对其他人可见。\n\
  \n4. 我们的优先事项是我们的用户和自由软件。\n\n   这一承诺更难定义。因此，在必须决策时，Debian 会施加一种偏好，并抛弃对开发者来说简单但会损害用户体验的简单方案，转而选择更优雅的解决方案，即使它实现起来更困难。这意味着要优先考虑用户和自由软件的利益。\n\
  \n5. 不符合我们自由软件标准的作品。\n\n   Debian 接受并理解用户可能想要某些非自由程序。这就是为什么该项目允许使用部分基础设施来发非自由软件软件包。\n\
  \n   ***\n\n   *社区*支持还是反对非自由部分？\n\n   维护一个容纳非自由软件的结构（即“非自由”部分，参见侧边栏 *词汇* `main`、`contrib`\
  \ 和 `non-free` 存档）在 Debian 社区内经常是讨论的话题。\n\n   反对者认为这会让人们远离自由软件，并违背了仅服务自由软件事业的原则。支持者则直言，大多数非自由软件包是“几乎自由的”，仅被一两个令人讨厌的限制限制（最的是禁止商业化使用软件）。通过在非自由分支分发这些作品，我们间接地告诉作者，如果它们能包含在主部分，将更广为人知并广泛使用。因此，他们被礼貌地邀请修改许可证以实现此目的。\n\
  \n   在 2004 年首次失败的尝试后，完全移除非自由部分不太可能回到议程，因为它包含了许多由于不符合主部分新要求而被移动的有用文档。这对于 GNU 项目发布的某些软件文档文件尤为如此（特别是\
  \ `Emacs` 和 `Make`）。\n\n   非自由部分的持续存在是与自由软件基金偶尔产生摩擦的根源，也是它拒绝正式推荐 Debian 作为操作系统的主要原因。\n\
  \n   ***\n\n### 1.2.2. Debian 自由软件指南\n\n\n\n\n\n此参考文档定义了哪些软件“足够自由”，可以包含在 Debian\
  \ 中。如果一个程序的许可证符合这些原则，它就可以被包含在主部分（main section）；反之，在允许自由分发的前提下，它可以在非自由部分（non-free\
  \ section）找到。非自由部分并不是 Debian 的一部分；它是为用户提供的一项额外服务。\n\n本文不仅是 Debian 的一种筛选标准，已成为自由软件领域的权威著作，并作为了《开源定义》的基础。从历史角度看，它是“自由软件”概念最早的正式定义之一。\n\
  \n→ [Debian 社会契约指南](https://www.debian.org/social_contract#guidelines)](https://www.debian.org/social_contract#guidelines)\n\
  \n1. **自由分发**。Debian 组件的许可证不得限制任何一方作为包含来自多个不同源程序的聚合软件分发包的一部分来出售或赠送该软件。许可证不得就此类销售收取特许费或其他费用。\n\
  2. **源代码**。程序必须包含源代码，并且允许以源代码形式以及编译后的形式进行分发。\n3. **衍生作品**。许可证必须允许修改和衍生作品，并且允许按照与原始软件许可证相同的条款对其进行分发。\n\
  4. **作者源代码的完整性**。许可证*可以*限制以修改的形式分发源代码，前提是许可证允许分发源代码的“补丁文件”，以便在构建时修改程序。许可证必须明确允许分发由修改后的源代码构建的软件。许可证可以要求衍生作品使用与原始软件不同的名称或版本号（*这是一个折中。Debian\
  \ 组鼓励所有作者不要限制任何文件（无论是源码还是二进制）被修改*）。\n5. **不对个人或群体的歧视**。许可证不得对任何个人或群体产生歧视。\n6. **不对从事领域的歧视**。许可证不得限制任何人在特定从事领域使用该程序。例如，它不能限制程序用于商业活动，或限制其用于基因研究。\n\
  7. **许可证的分发**。程序附带的必须适用于所有分发该程序的人，而无需这些人员执行额外的许可证。\n8. **许可证不能特定于 Debian**。程序附带的不能依赖于该程序是\
  \ Debian 系统的一部分。如果程序从 Debian 中提取，并在没有 Debian 的情况下使用或分发，但在符合程序许可证条款的情况下，所有分发该程序的方都应拥有与结合\
  \ Debian 系统时授予相同的权利。\n9. **许可证不能污染其他软件**。许可证不得对随许可软件一同分发的其他软件设置限制。例如，许可证不能坚持在同一介质上分发的所有其他程序必须是自由软件。\n\
  \n* * *\n\n### 回归基础：左份（Copyleft）\n\n左份（Copyleft）是一种原则，其在于利用版权来保证作品及其衍生作品的自由度，而不是像专有软件那样限制使用权利。同时，它也是对“copyright”（版权）一词的双关语游戏。理查德·斯尔曼（Richard\
  \ Stallman）发现这个主意是因为他一个喜于双关语的朋友在给他的信封上写道：“copyleft：权利反转（all rights reversed）”。左份要求在分发原始或修改后的作品（通常是程序）版本时，保留所有的初始自由。因此，如果一个程序衍生自左份发布程序的代码，就不可能将其作为专有软件分发。\n\
  \n最为人知的左份许可证家族当然是 GNU 通用公共许可证（`GPL`）及其衍生版本、GNU 较小通用公共许可证（`LGPL`）以及 GNU 自由文档许可证（`GFDL`）。遗憾的是，左份许可证之间通常是不互兼容的。因此，最好只使用其中一种。\n\
  \n* * *\n\n10. **示例许可证**。“GPL”、“BSD”和“Artistic”许可证是认为认为的“自由”的许可证的示例。\n\n* * *\n\n\
  ### 回归基础：自由许可证\n\nGNU GPL、BSD 许可证和 Artistic 许可证尽管非常不同，但它们都符合 Debian 自由软件准则。\n\n\
  GNU GPL 由 FSF（自由软件基金）使用和推广，是最常见的。它的主要特点是，它也适用于任何被重新分发的衍生作品：一个包含或使用 GPL 代码的程序只能根据其条款进行分发。因此，它禁止在任何专有应用程序中重用。这为在与此许可证兼容的自由软件中重用\
  \ GPL 代码带来了严重问题。因此，有时无法将根据其他自由软件许可证发布的程序与根据 GPL 分发的库链接起来。另一方面，该许可证在美国法中非常稳固：FSF\
  \ 的律师参与了其起草，并经常迫使违规者与 FSF 达成友好协议而无需诉诸法院。\n\n→ [GNU GPL 许可证](https://www.gnu.org/copyleft/gpl.html)](https://www.gnu.org/copyleft/gpl.html)\n\
  \nBSD 许可证限制最少：一切都是允许的，包括在专有应用程序中使用修改过的 BSD 代码。\n\n→ [BSD 许可证](https://www.opensource.org/licenses/bsd-license.php)](https://www.opensource.org/licenses/bsd-license.php)\n\
  \n最后，Artistic 许可证在其他两者之间达到了折中：允许在专有应用程序中集成代码，但任何修改必须发布。\n\n→ [Artistic 许可证 2.0](https://www.opensource.org/licenses/artistic-license-2.0.php)](https://www.opensource.org/licenses/artistic-license-2.0.php)\n\
  \n这些许可证的全文位于任何 Debian 系统的 `/usr/share/common-licenses/`（BSD 为新的三条款许可证）。\n\n* * *\n\
  \n* * *\n\n### 社区：布鲁斯·佩伦斯，充满争议的领导者\n\n布鲁斯·佩伦斯（Bruce Perens）是 Debian 项目的第二任领导，紧随伊恩·莫多奇（Ian\
  \ Murdock）。他那动态且威权的方法非常有争议。尽管如此，他仍然是 Debian 的重要贡献者，Debian 特别感激他编写了著名的《Debian 自由软件准则》（这是伊恩·席林（Ean\
  \ Schilling）的原创构想）。随后，布鲁斯从此衍生出了著名的《开源定义》，并删除了其中所有关于 Debian 的引用。\n\n→ [开源定义](https://opensource.org/)](https://opensource.org/)\n\
  \n他离开项目是非常感性的，但布鲁斯对 Debian 保持着忠诚，因为他仍在政治和经济领域推广该分发版。他仍偶尔出现在邮件列表中提供建议并介绍他支持 Debian\
  \ 的最新倡议。\n\n\n\n\n最后的一则轶事，是 Bruce 激发了 Debian 版本不同“代号”的灵感（1.1 — Rex，1.2 — Buzz，1.3\
  \ — Bo，2.0 — Hamm，2.1 — Slink，2.2 — Potato，3.0 — Woody，3.1 — Sarge，4.0 — Etch，5.0\
  \ — Lenny，6.0 — Squeeze，7 — Wheezy，8 — Jessie，9 — Stretch，10 — Buster，11（尚未发布）—\
  \ Bullseye，12（尚未发布）— Bookworm，Unstable（不稳定）— Sid）。这些名字都取自动画电影《玩具总动员》中的角色。这部完全由计算机图形制作的动画电影由皮克斯工作室（Pixar\
  \ Studios）制作，而 Bruce 在领导 Debian 项目时正是在那里工作。“Sid”这个名字具有特殊地位，因为它永远与 Unstable（不稳定版）分支联系在一起。在电影中，这个角色是那个弄坏玩具的邻居孩子——所以小心不要太靠近\
  \ Unstable。否则，`Sid` 也是“Still In Development”（开发中）的缩写。\n\n## 1.3 Debian 项目的内部机制\n\
  \nDebian 项目产生的丰富成果同时源于经验丰富的 Debian 开发者对基础设施的工作、开发者对 Debian 软件包的个人或集体工作，以及用户的反馈。\n\
  \n## 1.3.1 Debian 开发者\n\nDebian 开发者承担着各种职责，作为项目的官方成员，他们对项目的方向具有巨大影响。一个 Debian 开发者通常负责至少一个软件包，但根据他们的可用时间和意愿，可以自由参与许多团队，从而在项目中承担更多责任。\n\
  \n→ [`www.debian.org/devel/people`](https://www.debian.org/devel/people)→ [`www.debian.org/intro/organization`](https://www.debian.org/intro/organization)→\
  \ [`wiki.debian.org/Teams`](https://wiki.debian.org/Teams)\n\n### TOOL 开发者数据库\n\n\
  Debian 拥有一个数据库，包含了所有在项目中注册的开发者及其相关信息（地址、电话、地理坐标如经度和纬度等）。某些信息（姓、名、国家、项目中的用户名、IRC\
  \ 用户名、GnuPG 密钥等）是公开的并可以在网上查阅。\n\n→ [`db.debian.org/`](https://db.debian.org/)\n\n\
  地理坐标允许创建一张定位全球所有开发者的地图。Debian 确实是一个国际化项目：它的开发者遍布各大洲，尽管大多数位于“西方国家”。\n\n图 1.1. Debian\
  \ 开发者的全球分布图![World-wide distribution of Debian developers](img/developers-map.png)\n\
  \n### 软件包维护\n\n软件包维护是一相对规范化的活动，有详尽的文档甚至受到监管。它实际上必须遵守 `Debian Policy`（Debian 策略）建立的所有标准。幸运的是，有许多工具可以辅助维护者的工作。因此，开发者可以专注于其软件包的细节以及更复杂的任务，例如修复\
  \ Bug。\n\n→ [`www.debian.org/doc/debian-policy/`](https://www.debian.org/doc/debian-policy/)\n\
  \n### 回归本质：软件包维护，开发者的工作\n\n维护一个软件包首先要对程序进行“打包”。具体而言，这意味着要定义安装手段，以便该程序在安装后能够运行并遵守\
  \ Debian 项目为自己设定的规则。该操作的结果保存在 `.deb` 文件中。随后，对程序的有效安装仅需解压此压缩包并执行其中包含的一些安装前或安装后脚本。\n\
  \n在初始阶段之后，维护周期才真正开始：根据最新的 `Debian Policy` 准备更新，修复用户报告的 Bug，并包含仍在持续开发的新的“上游”（upstream）程序版本。例如，在初始打包时，程序版本为\
  \ `1.2.3`。经过几个月的开发后，原作者发布了编号为 `1.4.0` 的新稳定版本。此时，Debian 维护者应该更新软件包，以便用户能够从最新的稳定版本中受益。\n\
  \n`Policy`（策略）是 Debian 项目的核心元素，它制定了确保软件包质量和发行版完美互操作性的规范。得益于该策略，Debian 尽管规模巨大但仍保持着一致性。该策略并非一成不变，得益于在\
  \ `<`debian-policy@lists.debian.org``>`邮件列表上提出的提案而不断演进。所有利益方同意的修订将由一小组没有编辑责任的维护者接受并应用到文本中（他们仅包含上述列表成员\
  \ Debian 开发者所同意的修改）。你可以在错误跟踪系统中读取当前的修订提议：\n\n→ [`bugs.debian.org/debian-policy`](https://bugs.debian.org/debian-policy)\n\
  \n### 社区 Policy 策略编辑流程\n\n任何人都可以通过针对 `debian-policy` 软件包提交一个严重程度为“wishlist”（愿望列表）的\
  \ Bug 报告，对 Debian 策略提出修订建议。随后启动的流程记录在 [`www.debian.org/doc/debian-policy/ap-process.html`](https://www.debian.org/doc/debian-policy/ap-process.html)中：如果确认所揭示的问题必须通过在\
  \ Debian 策略中创建新规则来解决，则开始在 `<`debian-policy@lists.debian.org``>`邮件列表上进行讨论，直到达成共识并发布提案。随后有人起草所需的修订并提交审核（以补丁的形式）。一旦另外两个开发者认可该修订反映了之前的讨论共识（他们“赞成”它），提案就可以由\
  \ `debian-policy` 软件包的维护者之一纳入官方文档。如果流程在这些步骤中失败，维护者将关闭该 Bug，并将提案标记为拒绝。\n\n### DEBIAN\
  \ POLICY 文档\n\n每个软件包的文档存储在 `/usr/share/doc/package/` 中。该目录通常包含一个 `README.Debian`\
  \ 文件，说明维护者所做的 Debian 特定的调整。因此，在任何配置之前阅读该文件是明智的，以便借鉴他们的经验。我们还会找到一个 `changelog.Debian.gz`\
  \ 文件，描述了维护者从一个版本到下一个版本的更改。这与描述上游开发者更改的 `changelog.gz` 文件（或类似文件）不要混。`copyright` 文件包含了作者信息和涵盖软件的许可。最后，我们可能还会找到一个名为\
  \ `NEWS.Debian.gz` 的文件，允许 Debian 开发者传递有关更新的重要信息；如果安装了 `apt-listchanges`，这些消息将自动显示。所有其他文件都取决于特定的软件。我们特别想指出\
  \ `examples` 子目录，它经常包含配置文件的示例。\n\n`Policy` 为软件包方面提供了大量的覆盖。项目的规模也引发了组织架构问题；这些问题通过《Debian\
  \ 宪法》（Debian Constitution）来处理，宪法建立了决策的结构和手段。换句话说，这是一套正式的治理体系。\n\n\n\n\n本本宪法定义了特定数量的角色和职位，以及每个角色的职责和权限。特别值得注意的是，Debian\
  \ 开发者通过普通决议投票拥有最终决定权，其中重大变更（如对《基金会文件》产生影响的）需要四分之三（75%）的多数赞票。然而，开发者每年会选出一个“领导者”在会议上代表他们，并确保不同团队之间的内部协调。这次选举始终是一个激烈讨论的时期。领导者的角色没有由任何文件正式定义：该职位的候选人通常会对该职位提出自己的定义。在实践中，领导者的角色包括担任媒体代表、协调“内部”团队之间的关系，并为项目提供整体指导，其中开发者可以认为：`DPL`\
  \ 的观点得到了大多数项目成员的含蓄批准。\n\n具体而言，领导者拥有实权；他们的投票可以解决平局票；他们可以做出任何不属于他人权限范围的决定，并可以委派部分职责。\n\
  \n自项目成立以来，该项目先后由 Ian Murdock、Bruce Perens、Ian Jackson、Wichert Akkerman、Ben Collins、Bdale\
  \ Garbee、Martin Michlmayr、Branden Robinson、Anthony Towns、Sam Hocevar、Steve McIntyre、Stefano\
  \ Zacchiroli、Lucas Nussbaum、Mehdi Dogguy、Chris Lamb 和 Sam Hartman 领导。\n\n宪法还定义了“技术委员会”。该委员会的核心作用是在相关开发者未能达成共识时，对技术事务做出决定。否则，该委员会对未能对其负责的事做出决定的开发者起到顾问作用。需要注意的是，他们只有在受到相关方之一的邀请时才会介入。\n\
  \n最后，宪法定义了“项目秘书”职位，该人负责组织与各种选举和普通决议相关的投票工作。\n\n“普通决议”程序在宪法中有详细说明，从最初的讨论阶段到最后的计票。该过程最有趣的的方面是，在进行实际投票时，开发者必须对不同的选票选项进行排序，并采用[柯兰西方法](https://en.wikipedia.org/wiki/Condorcet_method)（具体来说是舒尔泽方法）选出冠军。更多细节请参见：\n\
  \n→ [`www.debian.org/devel/constitution`](https://www.debian.org/devel/constitution)\n\
  \n* * *\n\n## 文化：口战（Flamewar），点燃火花的讨论\n\n“口战”是一种极激烈的辩论，当双方所有理性的论证都耗尽后，往往以互相攻击告终。某些主题比其他主题更容易引发争论（文本编辑器的选择，“你更偏于\
  \ `vi` 还是 `emacs`？”是一个老话题了）。由于对该问题意见意见的人（所有人）以及此类问题极具个人色彩，这些事情往往会引发非常频繁的邮件交换。\n\n\
  此类讨论通常产生不了实用的结果；通常建议不要参与此类辩论，也许可以快速浏览其内容，因为通读它们太浪费时间了。\n\n* * *\n\n即使本宪法建立了一种民主的表象，但日常现实却完全不同：Debian\
  \ 自然地遵循自由软件的“能者治”（do-ocracy）规则：做事的人决定如何做事。大量时间可能会浪费在争论解决问题的各种方法的优劣上；而被选定的方案将是第一个既功能完又令人满意的方案……这将源于胜任者所投入的时间。\n\
  \n这是获得功勋的唯一途径：做一些有用的事情并证明自己工作良好。许多 Debian “管理”团队通过吸纳的方式运作，倾向于选择已经有效做出贡献并证明了能力的志愿者。这些团队工作的公开性使得新贡献者能够观察并开始帮助，而无需任何特权。这就是为什么\
  \ Debian 经常被描述为“精英治”。\n\n* * *\n\n## 文化：精英治，知识的统治\n\n精英治是一种政府形式，权力由最有功勋的人行使。对于 Debian\
  \ 来说，功勋是能力的衡量标准，而能力本身是通过项目内一个或多个他人对过去行为的观察得评估（前项目领导 Stefano Zacchiroli 提到“能者治”，意味着“权力属于那些办事的人”）。他们的存在本身证明了某种能力；他们的成就通常是自由软件，并提供源代码，供同行轻松评审以评估其质量。\n\
  \n* * *\n\n这种有效的运作方法保证了“关键” Debian 团队贡献者的质量。这种方法并非完美，偶尔会有不接受这种运作方式的人。被团队接受的开发者选择可能看起来有些随意，甚至不公平。此外，并不是所有人对这些团队预期的服务都有相同的定义。对于某些人来说，等待八天才才能包含一个新的\
  \ Debian 包是不可接受的，而另一些人则耐心等待三周而没有任何意见。因此，不满的人经常对某些团队的“服务质量”表示抱怨。\n\n* * *\n\n## 社区：新维护者的整合\n\
  \n负责接纳新开发者的团队最经常受到批评。必须承认，多年来，Debian 项目对其接受的开发者要求越来越高。有些人可能认为其中存在不公，但我们必须承认，在一个超过\
  \ 1000 人的社区中，涉及到确保 Debian 为用户产生的所有内容的质量和完整性，最初微小的挑战已变得巨大。\n\n此外，接纳程序由一个小团队——Debian\
  \ 账户经理（Account Managers）对候选人进行审查来完成。这些经理因此特别容易受到批评，因为他们对志愿者是否加入 Debian 开发者社区拥有最终决定权。在实践中，他们有时必须在了解更多项目运营情况之前延迟接纳某一个人。当然，你可以在成为官方开发者之前，通过现有开发者的担保为\
  \ Debian 做出贡献。\n\n* * *\n\n## 1.3.2 用户的积极作用\n\n人们可能会问在 Debian 项目内部工作的人提到用户是否有意义，但答案是肯定的：他们在项目中起着关键作用。用户远不是“被动的”，一些用户运行\
  \ Debian 的开发版本并定期提交错误报告以指出问题。另一些用户更进一步，通过提交严重程度为 `wishlist` 的错误报告来提交改进建议，甚至提交源代码的修正，称为\
  \ `patches`（见章节 1.3.2.3，“发送修复程序”）。\n\n### 1.3.2.1 报告错误\n\n\n\n\n\nDebian 提交 bug\
  \ 的根本工具是 Debian 错误跟踪系统（Debian BTS），它被该项目的大部分使用。公共部分（Web 界面）允许用户查看所有报告的 bug，并可以选择根据各种标准显示排序后的\
  \ bug 列表，例如：受影响的包、严重程度、状态、报告者地址、负责该包的维护者地址、标签等。用户还可以浏览关于每个 bug 讨论的完整历史列表。\n\n在表象之下，Debian\
  \ BTS 是基于电子邮件的：它存储的所有信息都来自各个相关人员发送的消息。因此，任何发送到 `12345@bugs.debian.org` 的电子邮件都将被分配给编号为\
  \ `12345` 的 bug 历史记录。获得授权的人员可以通过向 `12345-done@bugs.debian.org` 发送一条描述关闭决策原因的消息来“关闭”一个\
  \ bug（当指示的问题得到解决或不再相关时，该 bug 即被关闭）。通过向 `submit@bugs.debian.org` 发送符合特定格式的电子邮件来报告新\
  \ bug，该格式会标识涉及的包。`control@bugs.debian.org` 地址允许编辑与 bug 相关的的所有“元信息”。\n\nDebian BTS\
  \ 还有其他功能特性，例如使用标签对 bug 进行标记。更多信息，请参阅：\n\n→ [https://www.debian.org/Bugs/]\n\n##\
  \ 词汇：bug 的严重程度 (Severity)\n\nbug 的严重程度正式地为报告的问题分配一个严重等级。实际上，并非所有 bug 的性都相同；例如，手册页中的拼写错误与服务器软件中的安全漏洞是不可同拟的。\n\
  \nDebian 使用扩展标准来描述 bug 的严重程度。每个级别都有精确的定义，以便进行选择。\n\n→ [https://www.debian.org/Bugs/Developer#severities]\n\
  \n用户还可以使用 `reportbug` 工具通过命令行对 Debian 包发送 bug 报告。它有助于确保所讨论的 bug 尚未提交，从而防止系统中的冗余。它会提醒用户严重程度分级的定义，以确保报告尽可能准确（如果需要，开发者以后可以随时微调这些参数）。它通过编写并允许用户编辑，帮助用户在无需了解精确语法的情况下编写一份完整的\
  \ bug 报告。该报告将通过电子邮件服务器发送（默认情况下是由 Debian 运行的远程服务器，但 `reportbug` 也可以使用本地服务器）。\n\n\
  该工具首先针对开发版本，即 bug 将被修复的地方。实际上，Debian 的稳定版本是不欢迎更改的，只有安全更新或其他重要更新有极少数例外（例如，某个包完全无法工作）。因此，对\
  \ Debian 包中微 bug 的修复必须等待下一个稳定版本。\n\n### 1.3.2.2. 翻译与文档\n\n此外，许多对 Debian 提供的服务的满意用户希望为项目做出自己的贡献。由于并非每个人在编程方面都具有相应的专业知识，他们可能会选择协助文档的翻译和审查。有特定语言的邮件列表来协调这项工作。\n\
  \n→ [https://lists.debian.org/i18n.html] → [https://www.debian.org/international/]\n\
  \n## 基础：什么是 i18n 和 l10n？\n\n“i18n” 和 “l10n” 分别是“internationalization”（国际化）和“localization”（本地化）这两个词的缩写，保留了每个单词的首字母和尾字母，以及中间字母的数量。\n\
  \n“国际化”一个程序意味着修改它使其能够被翻译（本地化）。这涉及部分重写最初为单语言工作编写的程序，以便向所有语言开放。\n\n“本地化”一个程序意味着修改它使其能够适应特定语言。这涉及到将原始（通常是英语）程序翻译成另一种语言。总之，国际化为软件准备翻译，而本地化则是执行过程。\n\
  \n### 1.3.2.3. 发送修复 (Fixes)\n\n高级用户可能会通过发送补丁来提供修复。补丁（patch）是描述对一个或多个文件进行修改的文件。补丁包含了需要删除或添加的行，同时也包含了用于定位修改位置的上下文行。\n\
  \n## 文化：Git\n\nGit 是一个对多个文件进行协作工作的工具，同时维护修改历史。涉及的文件通常是文本文件，例如程序的源代码。如果多人协作同一个文件，`git`\
  \ 只能合并修改，前提是这些修改位于不同的部分。否则，这些“冲突”必须手动解决。\n\nGit 是一个分布式系统，每个用户都有一个包含完整历史的仓库。中央仓库用于下载项目（`git\
  \ clone`）以及与他人共享已完成（`git push`）。仓库可以包含文件的多个版本，但在任何时刻只能操作一个版本：它被称为工作区（可以通过 `git checkout`\
  \ 切换到另一个版本）。Git 可以显示工作区的修改（`git diff`），可以暂存更改以待提交（`git add`），并可以在版本历史中创建一个新条目（`git\
  \ commit`）。它还可以更新工作区以包含其他用户并行做的修改（`git pull`），并在历史中记录特定的配置以便以后轻松提取（`git tag`）。\n\
  \nGit 能够轻松处理开发中的多个并发版本，而它们不会相互干扰。这些版本被称为分支（branches）。这种树的隐喻非常准确，因为程序最初在公共主干上开发。当达到里程碑（例如版本\
  \ 1.0）时，开发在两个分支上继续：开发分支准备下一个重大版本，维护分支管理版本 1.0 的更新和修复。\n\n\n\n\n\n→ [`www.nongnu.org/cvs/`](https://www.nongnu.org/cvs/)→\
  \ [`subversion.apache.org/`](https://subversion.apache.org/)→ [`git-scm.com/`](https://git-scm.com/)→\
  \ [`bazaar.canonical.com/`](https://bazaar.canonical.com/)→ [`mercurial.selenic.com/`](http://mercurial.selenic.com/)\n\
  \n本书的范围并不包括对 Git 的详细解释，关于这部分内容，你可以参考 *Pro Git* 一书。\n\n→ [`git-scm.com/book/`](https://git-scm.com/book/)\n\
  \n虽然 `git diff` 的输出是一个可以与其他开发者共享的文件，但通常有更好的方法来提交更改。如果开发者倾向于通过电子邮件接收补丁（patches），他们通常希望使用\
  \ `git format-patch` 生成补丁，以便通过 `git am` 将其直接集成到仓库中。这保留了提交的元信息，并允许一次性共享多个提交。\n\n\
  这种基于电子邮件的工作流仍然流行，但每当软件托管在 Github 或 GitLab 等平台时，它往往会被*合并请求*（merge requests，或*拉取请求*\
  \ pull requests）所取代—— Debian 在其 `salsa.debian.org` 服务器上使用的是 GitLab。在这些系统中，一旦你创建了账户，就可以*分叉*（fork）仓库，实际上在你自己的账户中创建一个仓库的副本，然后克隆该仓库并推送自己的更改。从那里，网页界面会建议你提交合并请求，通知开发者你的更改，方便他们只需点击一下即可审查并接受你的更改。\n\
  \n### 其他贡献方式\n\n所有这些贡献机制都通过用户的行为变得更加高效。用户并非孤立个体的集合，而是一个真正的社区，其中进行着大量的交流。我们特别注意到用户讨论邮件列表上活跃的活动，`<debian-user@lists.debian.org`](mailto:debian-user@lists.debian.org)（第\
  \ 7 章，*解决问题和查找相关信息*](#ch07.html \"第 7 章 解决问题和查找相关信息\") 对此进行了了更详细的讨论）。\n\n→ [`lists.debian.org/users.html`](https://lists.debian.org/users.html)\n\
  \n用户不仅在直接影响他们的技术问题上帮助自己（以及他人），还讨论了向 Debian 项目贡献以及帮助其向前发展的最佳方式——这些讨论经常产生改进的建议。\n\n\
  #### 工具 how-can-i-help\n\n`how-can-i-help` 程序列出了为本地安装的 Debian 软件包提供贡献的机会。在每次调用 `APT`\
  \ 后，它都会显示提供帮助的方法，通过高亮标记为“新手”（newcomer）的漏洞（这些是新贡献者的易切入点）或需要新维护者的孤儿包（orphaned packages）。该程序也可以直接执行。\n\
  \n由于 Debian 不在任何自我推销的营销活动上投入资金，其用户在它的传播中起着至关重要的作用，通过口碑确保其声誉。\n\n这种方法非常有效，因为 Debian\
  \ 粉丝遍布自由软件社区的各个层面：从本地 <acronym class=\"acronym\">LUG</acronym>（或“Linux 用户小组”）组织的安装派对（由经验丰富的用户帮助新手安装系统的研讨会），到处理\
  \ Linux 的大型技术大会上的协会展位等。\n\n志愿者为项目制作海报、手册、贴纸和其他实用的宣传材料，他们将其提供给所有人，Debian 在其网站和 wiki\
  \ 上免费提供这些材料：\n\n→ [`www.debian.org/events/material`](https://www.debian.org/events/material)\n\
  \n## 团队与子项目\n\nDebian 从一开始就是围绕源包的概念组织的，每个包都有其相应的维护者或维护者小组。随着时间的推移，出现了许多工作团队，确保基础设施的管理、不特定于任何特定软件包的任务（质量保证、Debian\
  \ 策略、安装程序等），最新的一系列团队则围绕子项目成长。\n\n### 现有的 Debian 子项目\n\n每个人都有自己的 Debian！子项目是一组对于将\
  \ Debian 适配到特定需求的志愿者。除了选择用于特定领域（教育、医学、多媒体创作等）的程序子组外，子项目还参与了改进现有软件包、打包缺失的软件、适配安装器、创建特定文档等。\n\
  \n#### 术语 子项目与派生发行版\n\n派生发行版的开发过程是从特定版本的 Debian 开始，并对其进行许多修改。用于这项工作的基础设施完全独立于 Debian\
  \ 项目之外。对于贡献改进并不一定有政策。这种差异解释了派生发行版如何可能与其源“分叉”，以及为什么它们必须定期与源同步，以便从上游的改进中受益。\n\n另一方面，子项目不能分叉，因为其上的所有工作都是通过直接改进\
  \ Debian 来适应特定的目标。\n\n最著名的派自 Debian 的发行版无疑是 Ubuntu，但还有很多种。请参见 附录 A，*派生发行版* 了解它们的特点以及与\
  \ Debian 的关系。\n\n以下是当前子项目的少量选择：\n\n*   Debian Jr.，由 Ben Armstrong 开发，为儿童提供了一个吸引人且易于使用的\
  \ Debian 系统；\n*   Debian Edu，由 Petter Reinholdtsen 开发，专注于为学术界创建一个专门 purpose 的发行版；\n\
  *   Debian Med，由 Andreas Tille 开发，致力于医学领域；\n*   Debian Multimedia，处理音频和多媒体工作；\n\
  *   Debian GIS，负责地理信息系统应用和用户；\n*   Debian Accessibility，改进 Debian 以满足残障人士的需求；\n\
  *   Debian Science，最后，为研究人员和科学家提供更好的 Debian 使用体验；\n*   DebiChem，针对化学，提供化学套件和程序。\n\
  \n项目数量可能会随着时间的推移和对 Debian 子项目优势的认知提高而继续增加。由于现有 Debian 基础设施的支持，它们实际上可以专注于具有真正价值的工作，而无需担心与\
  \ Debian 保持同步。\n\n### 管理团队\n\n大多数管理团队相对封闭，仅通过内部选拔招募。成为其中成员的最佳方法是明智地协助现有成员，证明你已经理解了他们的目标和操作方法。\n\
  \n*ftpmasters* 负责 Debian 软件包官方存档。他们维护接收开发者发送的软件包的程序，并在检查后将其存储在参考服务器（`ftp-master.debian.org`）上。\n\
  \n他们还必须验证所有新软件包的许可，确保 Debian 可以发行它们，然后将其纳入软件包库。当开发者想要删除一个软件包时，他们通过错误跟踪系统和 `ftp.debian.org`\
  \ “伪包”与该团队联系。\n\n\n\n\n错误跟踪系统最初设计用于将错误报告与 Debian 软件包关联，事实证明它在管理其他事务非常实用：例如待解决问题的列表或需要管理的任务，而无需与任何特定的\
  \ Debian 软件包关联。因此，“伪软件包”允许某些团队在不与其团队关联真实软件包的情况下使用错误跟踪系统。因此，每个人都可以报告需要处理的问题。例如，BTS\
  \ 有一个 `ftp.debian.org` 条目，用于报告和跟踪官方软件包存档中的问题，或简单地请求删除软件包。同样，`www.debian.org` 伪软件包指代\
  \ Debian 网站上的错误，而 `lists.debian.org` 则收集了所有与邮件列表相关的问题。\n\n# 工具 GitLab，Git 仓库托管及更多功能\n\
  \nDebian 使用一个名为 `salsa.debian.org` 的 GitLab 实例来托管 Git 软件包仓库，但该软件提供的功能远不止于托管，Debian\
  \ 贡献者已经迅速利用了持续集成功能（在每次 push 时运行测试，甚至构建软件包）。得益于易为人理解的合并请求（merge request）流程（类似于 GitHub\
  \ 的 pull requests），Debian 贡献者还受益于更清晰的贡献工作流。\n\nGitLab 取替了 FusionForge（运行在名为 `alioth.debian.org`\
  \ 的服务上）用于协作软件包维护。该服务由 Alexander Wirt、Bastian Blank 和 Jörg Jaspert 管理。\n\n→ [`salsa.debian.org/`](https://salsa.debian.org/)→\
  \ [`wiki.debian.org/Salsa/Doc`](https://wiki.debian.org/Salsa/Doc)\n\n# Debian 系统管理员\n\
  \nDebian 系统管理员（<acronym class=\"acronym\">DSA</acronym>）团队（`debian-admin@lists.debian.org``）正如预期的那样，负责该项目使用的许多服务器的系统管理。他们确保所有基础服务（DNS、Web、电子邮件、shell\
  \ 等）的最优运行，安装 Debian 开发人员请求的软件，并在安全方面采取一切预防。\n\n→ [`dsa.debian.org`](https://dsa.debian.org)\n\
  \n# 工具 Debian 软件包跟踪器\n\n这是 Raphaël 的作品之一。基本思想是对于给定的软件包，在页面页面集中尽可能多的信息。因此，人们可以快速检查程序的状态，识别待完成的任务，并提供帮助。这就是为什么该页面收集了所有的错误统计、每个发行版中的可用版本、软件包在\
  \ Testing 发行版进度、描述和 debconf 模板的翻译状态、新上游版本的可能可用、不符合最新 Debian 策略的、维护者信息以及该维护者希望包含的任何其他信息。\n\
  \n→ [`tracker.debian.org/`](https://tracker.debian.org/)\n\n一个电子邮件订阅服务完善了这个 Web\
  \ 界面。它会自动向列表发送以下可选信息：错误及相关讨论、Debian 服务器上新版本的可用性、可供校对的新翻译等。\n\n因此，高级用户在充分了解其工作原理后，可以密切关注所有这些信息，甚至为项目做出贡献。\n\
  \n另一个名为 Debian 开发者软件包概览（DDPO）的 Web 界面为每位开发者提供了其负责的所有 Debian 软件包状态的摘要。\n\n→ [`qa.debian.org/developer.php`](https://qa.debian.org/developer.php)\n\
  \n这两个网站是由 Debian 内部负责质量保证的小组（被称为 Debian QA）开发和管理的工具。\n\n# 列表管理员 (Listmasters)\n\n\
  列表管理员管理管理邮件列表的电子邮件服务器。他们创建新列表，处理退信（交付失败通知），并维护垃圾邮件过滤器（未经请求的批量邮件）。\n\n# 文化 邮件列表流量：一些数据\n\
  \n邮件列表无疑是项目活动性的最好证明，因为它们跟踪了发生的一切。关于我们邮件列表的数据（来自 2019 年 5 月）自证其明：Debian 托管了约 315\
  \ 个列表，总计超过 303,000 次个人订阅。每天递送 227,000 电子邮件。\n\n每个特定服务都有自己的管理团队，通常由安装它的志愿者组成（他们也经常自己编写相应的工具）。错误跟踪系统（BTS）、软件包跟踪器、`salsa.debian.org`（GitLab\
  \ 服务器，参见侧边栏 *工具 GitLab，Git 仓库托管及更多功能]`）、位于 `qa.debian.org`、`lintian.debian.org`、`buildd.debian.org`、`cdimage.debian.org`\
  \ 等提供的服务都是如此。\n\n## 开发团队，横向团队\n\n与管理团队不同，开发团队相当开放，甚至对外部贡献者开放。即使 Debian 并没有创建软件的天职，但项目需要某些特定程序来实现其目标。当然，这些工具在自由软件许可证下开发，并利用了在自由软件世界其他地方被证明的方法。\n\
  \nDebian 开发的自己的软件很少，但某些程序承担了主角角，，它们的声誉已传出项目的范围。良好的例子是 `dpkg`，Debian 软件包管理程序（实际上它是\
  \ Debian PacGe 的缩写，通常读作“dee-package”），以及 `apt`，一个自动安装任何 Debian 软件包及其依赖项的工具，确保了升级后系统的一致性（其名称是\
  \ Advanced Package Tool 的缩写）。然而，它们的团队要小得多，因为需要较高水平的编程技能才能全面理解这类程序的运行机制。\n\n最重要的团队可能是\
  \ Debian 安装程序 `debian-installer` 团队，自 2001 年构想以来完成了一项意义重大的工作。需要大量的贡献者，因为编写一个能够在数十种架构上安装\
  \ Debian 的程序非常困难。每种架构都有自己的启动机制和引导加载程序。所有这些工作都在 `debian-boot@lists.debian.org`(mailto:debian-boot@lists.debian.org)邮件列表上协调，并在\
  \ Cyril Brulebois 的指导下进行。\n\n→ [`www.debian.org/devel/debian-installer/`](https://www.debian.org/devel/debian-installer/)→\
  \ [`joeyh.name/blog/entry/d-i_retrospective/`](https://joeyh.name/blog/entry/d-i_retrospective/)\n\
  \n（非常小的）`debian-cd` 程序团队的目标更为明确。许多“小型”贡献者负责他们的架构，因为主开发者无法了解所有的细节以及从 CD-ROM 启动安装程序的准确方法。\n\
  \n许多团队在打包活动中必须与其他协作：例如，`debian-qa@lists.debian.org`(mailto:debian-qa@lists.debian.org)试图确保\
  \ Debian 项目所有层面的质量。`debian-policy@lists.debian.org`(mailto:debian-policy@lists.debian.org)\
  \ 列表根据来自各地的建议制定 Debian 策略。负责每个架构的团队（`debian-*architecture*@lists.debian.org`(mailto:debian-architecture@lists.debian.org)`）编译所有软件包，根据需要对其特定的特定架构进行调整。\n\
  \n\n\n\n其他团队负责管理最重要的软件包，以确保在维护的同时不会给某人的肩膀带来过重的负担；例如 C 库以及位于`<debian-glibc@lists.debian.org`](mailto:debian-glibc@lists.debian.org)\
  \ 列表的`<debian-gcc@lists.debian.org`](mailto:debian-gcc@lists.debian.org) 列表上的 C\
  \ 编译器，以及 `<debian-x@lists.debian.org`](mailto:debian-x@lists.debian.org) 上的 Xorg（该小组也被称为\
  \ X Strike Force）。\n\n# 1.4. 关注 Debian 新闻\n\n如前所述，Debian 项目以一种非常分布式、非常有机的方式演进。因此，有时很难在不被无完没了的通知淹没的情况下，与项目内部发生的情况保持联系。\n\
  \n如果你只想获取关于 Debian 最重要的新闻，可能应该订阅 `<debian-announce@lists.debian.org`](mailto:debian-announce@lists.debian.org)\
  \ 列表。这是一个流量非常低的列表（每年大约十条消息），只提供最重要的公告，例如新稳定版本的发布、新项目负责人的选举或每年的 Debian 大会。\n\n→ [`lists.debian.org/debian-announce/`](https://lists.debian.org/debian-announce/)\n\
  \n关于 Debian 更通用（且定期）的新闻发送到 `<debian-news@lists.debian.org`](mailto:debian-news@lists.debian.org)\
  \ 列表。该列表的流量也非常合理（通常每月只有几条消息），它包含了半定期的“Debian 项目新闻”，这是关于项目发生各种各种零碎信息的汇编。\n\n→ [`lists.debian.org/debian-news/`](https://lists.debian.org/debian-news/)\n\
  \n* * *\n\n### 社区：宣传团队\n\nDebian 的官方通信渠道由 Debian 宣传团队的志愿者管理。他们是 Debian 项目负责人的代表，并对发布在上面的新闻和公告进行审核。许多其他志愿者也为团队做出了贡献，例如为“Debian\
  \ 项目新闻”撰写内容，为 Debian 官方博客（[bits.debian.org`](https://bits.debian.org））或微博客服务（[micronews.debian.org`](https://micronews.debian.org/））提供内容，后者为社交网站提供微博客内容。\n\
  \n→ [`wiki.debian.org/Teams/Publicity`](https://wiki.debian.org/Teams/Publicity)\n\
  \n* * *\n\n关于 Debian 的演进以及各个团队在某一时间进展的更多信息，还有一个 `<debian-devel-announce@lists.debian.org`](mailto:debian-devel-announce@lists.debian.org)`\
  \ 列表。正如其名称所示，它携带的公告对开发者可能更有趣，但它也允许感兴趣的人以更具体的方式关注发生的情况，而不仅仅是稳定版本的发布时间。`<debian-announce@lists.debian.org`](mailto:debian-announce@lists.debian.org)`\
  \ 提供关于用户可见结果的新闻，而 `<debian-devel-announce@lists.debian.org`](mailto:debian-devel-announce@lists.debian.org)`\
  \ 提供关于这些结果如何产生的新。顺便提一下，“d-d-a”（有时这样被称为）是 Debian 开发者必须订阅的唯一列表。\n\n→ [`lists.debian.org/debian-devel-announce/`](https://lists.debian.org/debian-devel-announce/)\n\
  \nDebian 官方博客（[bits.debian.org`](https://bits.debian.org））也是一个很好的信息来源。它传达了我们已经过的各种邮件列表上发布的大部分有趣新闻，以及社区成员提供的其他新闻。由于所有\
  \ Debian 开发者在认为他们有值得公开的事物时都可以贡献这些新闻，Debian 博客在保持对项目整体高度关注的同时，提供了极具价值的洞察。\n\n一个更具非正式的信息源也可以在\
  \ Planet Debian 上找到，它汇集了 Debian 贡献者在各自博客上发布的文章。虽然内容并不专门涉及 Debian 开发，但它们提供了一个了解社区正在发生什么以及其成员在做什么的视角。\n\
  \n→ [`planet.debian.org/`](https://planet.debian.org/)\n\n该项目在社交网络上也有良好的代表。Debian\
  \ 在 Identi.ca（由 `pump.io` 驱动的微博客平台）上有官方账号，但有一些账户在转播来自 `https://micronews.debian.org/`\
  \ 的 RSS 馈，并且许多 Debian 贡献者在非官方账户上发布。\n\n→ [`identi.ca/debian`](https://identi.ca/debian)\
  \ → [`fosstodon.org/@debian`](https://fosstodon.org/@debian) → [`twitter.com/debian`](https://twitter.com/debian)\
  \ → [`www.facebook.com/debian`](https://www.facebook.com/debian) → [`www.flickr.com/groups/debian`](https://www.flickr.com/groups/debian)\
  \ → [`www.linkedin.com/company/debian`](https://www.linkedin.com/company/debian)\n\
  \n# 1.5. 发行版的角色\n\n一个 GNU/Linux 发行版有两个主要目标：在计算机上（无论带有还是已有的系统）安装一个自由操作系统，并提供一系列软件。\n\
  \n## 1.5.1. 安装程序：`debian-installer`\n\n`debian-installer` 被设计为极具模块化以便尽可能通用，其目标是第一个目标。这种设计使其变得非常复杂，对于发现该工具的人来说可能会望而生畏；但无论使用图形界面还是文本模式，用户的体验都是相似的。由于包含了自动硬件检测，人们在减少安装时的提问方面做出了巨大努力。\n\
  \n注意的是，基于 Debian 的发行版在这一方面差异很大，并提供了更有限的安装程序（通常限于 i386 或 amd64 架构），但对初学者更友好。\n\n\
  ## 1.5.2. 软件库\n\n在数量上，Debian 在方面无疑是领先的，拥有 28000 多个软件包。在质量上，Debian 的策略和在发布新稳定版本之前的长期测试期证明了其稳定性和一致性的誉。在可用性方面，所有内容通过全球许多镜像站在线可用，每六小时推送一次。\n\
  \n许多零售商在互联网上以非常低的价格出售 DVD-ROM（通常是平价），这些镜像可以免费下载。唯一的缺点是新稳定版本的发布频率较低（它们的开发有时超过两年），这延迟了新软件的引入。\n\
  \n# 1.6. 版本的生命周期\n\n项目将同时拥有三个到六个不同版本的程序，命名为 Experimental、Unstable、Testing、Stable、Oldstable\
  \ 甚至 Oldoldstable。每一个版本都对应开发中的一个阶段。为了良好理解，让我们来看看一个程序的旅程，从初始打包到包含在 Debian 稳定版本的过程。\n\
  \n\n\n\n\n在 Debian 项目中，“release”（发布）一词表示发行版的特定版本（例如，“unstable release”意味着“不稳定版”）。它也表示任何新版本（稳定版）发布的公共公告。\n\
  \n## 1.6.1 实验性状态 (Experimental)\n\n首先让我们来看看 Experimental（实验性）发行版的特殊情况：这是一组对应于当前开发中的\
  \ Debian 软件包，并不一定已经完成，这便是其名称由来。并不是所有软件包都会经过这个阶段；某些开发者会在这里添加软件包，以获取更多经验丰富（或更勇敢）的用户的反馈。\n\
  \n此外，该发行版经常包含对基础包的重要修改，如果这些修改在集成到 Unstable（不稳定版）时存在严重漏洞，将产生关键影响。因此，它是一个完全隔离的发行版，其软件包永远不会迁移到其他版本（除非有维护者或\
  \ `ftpmasters` 的直接、快速干预）。它也不是自自包含的：Experimental 中仅存在现有软件包的子集，且它通常不包含基础系统。因此，该发行版主要在与另一个自包含的发行版（如\
  \ Unstable）结合使用时才有用。\n\n## 1.6.2 不稳定状态 (Unstable)\n\n让我们回到典型软件包的情况。维护者创建一个初始软件包，将其编译为\
  \ Unstable 版本并放置在 `ftp-master.debian.org` 服务器上。这一初始事件涉及来自 `ftpmasters` 的检查和验证。随后，该软件将在\
  \ Unstable 发行版中可用，这是那些更关注拥有最新软件包而非担心严重漏洞的用户所选择的“前沿”发行版。他们发现该程序并对其进行测试。\n\n如果他们遇到漏洞，会向漏洞报告给软件包的维护者。然后，维护者会定期准备修复后的版本，并将其上传到服务器。\n\
  \n每个新更新的软件包会在六小时内在全球范围内所有的 Debian 镜像上更新。用户随后测试修复情况，并寻找由修改引起的其他问题。然后可能会快速发生多次更新。在这些期间，自动构建器（autobuilder）机器人会开始工作。最常见的情况下，维护者只有一个传统的个人电脑，并在\
  \ `amd64`（或 `i386`）架构上编译了他们的软件包（或者他们选择了仅上传源码，因此没有任何预编译的软件包）；自动构建器将接管，并自动为所有其他架构编译版本。某些编译可能会失败；维护者将收到一个指示问题的漏洞报告，然后该漏洞将在下一个版本中被修复。当相关架构的专家发现漏洞时，漏洞报告可能会附带一个可直接使用的补丁。\n\
  \n图 1.2 自动构建器编译软件包![images/autobuilder.png]\n\n### 快速概览：`buildd`，Debian 软件包重编译器\n\
  \n`buildd` 是“build daemon”（构建守护进程）的缩写。该程序在它托管的架构上自动重新编译 Debian 软件包的新版本（尽可能避免交叉编译）。\n\
  \n因此，为了为 `arm64` 架构生成二进制文件，项目提供了 `arm64` 机器。`buildd` 程序在这些机器上持续运行，根据 Debian 开发者发送的源码包为\
  \ `arm64` 创建二进制包。\n\n该软件用于所有作为 Debian 自动构建器的计算机。扩展来说，`buildd` 一词经常被用来指代这些机器，它们通常专门为此目的而保留。\n\
  \n## 1.6.3 迁移到测试版 (Testing)\n\n稍后，软件包将成熟；在所有架构上编译完成后，它将不再经过最近的修改。此时，它将成为 Testing\
  \ 发行版的候选者——这是一组根据某些可量化标准选择的 Unstable 软件包。每天，程序都会根据保证某些质量水平的元素自动选择包含在 Testing 中的软件包：\n\
  \n1. 缺乏严重漏洞，或者至少漏洞数量少于当前在 Testing 中包含的版本；\n2. 在 Unstable 中停留了至少 5 天，这通常足以发现并报告任何严重问题（如果软件包了自己的测试套件，成功通过该套件将缩短该时间）；\n\
  3. 在所有官方支持的架构上成功编译；\n4. 依赖关系可以在 Testing 中满足，或者至少可以与相关软件包一起移动到那里；\n5. 软件包的自动质量测试（`autopkgtest`）——如果已定义——没有显示任何回归。\n\
  \n这个系统显然并非无懈可击；在 Testing 中的软件包中经常发现严重漏洞。尽管如此，它通常是有效的，而且 Testing 产生的问题比 Unstable\
  \ 少得多，对许多人来说，它是稳定性和新颖之间的良好折中方案。\n\n### 注意：Testing 的局限性\n\n虽然在原理上非常有趣，但 Testing 确实存在一些实际问题：软件包之间复杂的交叉依赖关系使得软件包很少能够完全移动到那里。由于所有软件包相互依赖，有时需要同时迁移大量软件包，而当某些软件包定期上传更新时，这将是不可能的。另一方面，识别相关软件包族的脚本正努力创建这些族群（这是一个\
  \ NP-完全型问题，幸运的是，我们知道一些良好的启发式算法）。这就是为什么我们可以手动干预并引导该脚本，通过建议软件包组，或强制将某些软件包包含在某组中，即使这会暂时破坏某些依赖关系。此功能供发布经理（Release\
  \ Managers）及其助手使用。\n\n记住，NP-完全型问题根据数据的大小具有指数级的算法复杂度，这里的数据大小指的是代码长度（图形的数量）和涉及的元素。解决它的唯一方法通常是检查所有可能的配置，这可能需要巨大的资源。启发式算法是一种近似但满意的解决方案。\n\
  \n### 社区：发布经理 (Release Manager)\n\nRelease Manager 是一个重要的头衔，关联着巨大的责任。该头衔的持有者实际上必须管理\
  \ Debian 新稳定版本的发布，并定义 Testing 的开发过程直到它符合 Stable 的质量标准。他们还定义了一个初步的时间表（并不总是遵循）。\n\n\
  我们还有稳定版发布经理，通常缩写为 `SRM`，他们管理并选择 Debian 当前稳定版本的更新。他们系统地包含安全补丁，并逐案审查渴望在稳定版中更新软件包的\
  \ Debian 开发者发送的所有其他包含请求。\n\n## 1.6.4 从测试版到稳定版的晋升 (Promotion)\n\n让我们假设我们的软件包现在包含在\
  \ Testing 中。只要它还有改进空间，维护者就必须继续改进它并从 Unstable 重启过程（但如果没有发生重大变化，进入 Testing 的速度通常会更快）。当它达到完美时，维护者就完成了工作。下一步是包含在\
  \ Stable 发行版中，这实际上是发布经理选择的时刻对 Testing 的简单复制。理想情况下，这个决策是在安装程序准备好、且 Testing 中没有任何程序存在已知严重漏洞时做出的。\n\
  \n\n\n\n由于这一时刻永远不会到来，在实践中，Debian 必须做出妥协：移除维护者未能及时修复漏洞的软件包，或者接受发布一个带有数千个程序存在漏洞的发行版。`Release\
  \ Manager`（发布经理）会在此之前宣布冻结期，在此期间，对 `Testing` 的任何更新都必须经过批准。这里的目标是防止任何新版本（及其新漏洞）出现，并仅批准修复漏洞的更新。\n\
  \n图 1.3 软件包通过各个 Debian 版本的路径![软件包通过各个 Debian 版本的路径](img/release-cycle.png)\n\n***\n\
  \n### 词汇：冻结（Freeze）：最后的冲刺阶段\n\n在冻结期间，`Testing` 发行版的开发会被阻塞；不再允许自动更新。只有 `Release Managers`（发布经理）有权根据他们自己的标准更改软件包。其目的是防止通过引入新版本引入新漏洞；只有经过彻底检查且修复重大漏洞的更新才会被授权。\n\
  \n***\n\n在一个新的稳定版本发布后，`Stable Release Managers`（稳定版发布经理）管理所有的后续开发（称为“修订”，例如版本 `7`\
  \ 的 `7.1`、`7.2`、`7.3`）。这些更新系统地包含了所有的安全补丁。它们还将包含最重要的修复（软件包的维护者必须证明他们想要修复的问题严重性，以便将其更新包含进来）。\n\
  \n在旅程的终点，我们假设的软件包现在被包含在稳定发行版中。这段旅程并非没有困难，它解释了 `Debian Stable`（Debian 稳定版）发布之间显著的时间间隔。这总体贡献了它的质量声誉。此外，大多数用户对同时提供的三个发行版中的一个感到满意。系统管理员最关心服务器的稳定性，他们不需要\
  \ `GNOME` 的最新最强大版本；他们可以选择 `Debian Stable`，并感到满意。终端用户比起固如磐石的稳定性更感兴趣 `GNOME` 或 `KDE\
  \ Plasma` 的最新版本，他们会发现 `Debian Testing` 是在缺乏严重问题和保持较新软件之间的一个良好折中方案。最后，开发者和经验丰富的用户可能会开辟道路，直接在\
  \ `Debian Unstable`（Debian 不稳定版）中测试所有最新的开发成果，但面临着遭受任何新版本程序固有的头疼和漏洞的风险。每个人都有自己的 Debian！\n\
  \n***\n\n### 文化：GNOME 和 KDE Plasma，图形桌面环境\n\n`GNOME`（GNU 网络对象模型环境）和 `KDE` 的 `Plasma`（曾称为\
  \ K Desktop Environment）是自由软件世界中最流行的两个图形桌面环境，它们将在第 13.3 节，“图形桌面` 中详细介绍。\n\n桌面环境是一组组合的程序，允许通过图形界面轻松管理最常见的操作。它们通常包括文件管理器、办公套件、网络浏览器、电子邮件程序、多媒体配件等。最可见的区别在于所使用的图形库的选择：`GNOME`\
  \ 选择了 `GTK+`（根据 `LGPL` 许可的自由软件），而 `KDE` 社区选择了 `Qt`（一个由公司支持的项目，现在同时通过 `GPL` 和商业许可提供）。\n\
  \n→ [`www.gnome.org/`](https://www.gnome.org/) → [`www.kde.org/`](https://www.kde.org/)\n\
  \n***\n\n图 1.4 由 Debian 打包的程序的时间顺序路径![由 Debian 打包的程序的时间顺序路径](img/package-lifecycle.png)\n\
  \n## 1.6.5. Oldstable 和 Oldoldstable 状态\n\n每个 `Stable` 版本的预期寿命约为 5 年，鉴于发布通常每 2 年发生一次，在任何给定时间最多可能有\
  \ 3 个受支持的版本。当一个新的稳定版本发布时，之前的版本将变为 `Oldstable`，而更早的一个变为 `Oldoldstable`。\n\n`Debian`\
  \ 版本的`长期支持 (LTS)` 是一项近期的倡议：个人贡献者和公司联手创建了 `Debian LTS` 团队。不再受 `Debian security team`（Debian\
  \ 安全团队）支持的旧版本由这个新团队负责。\n\n`Debian security team` 处理当前 `Stable` 版本的安全支持，同时也处理 `Oldstable`\
  \ 版本的安全支持（但仅限于确保与当前稳定版有一年重叠所需的时间）。这大约相当于每个版本提供三年的支持。`Debian LTS team` 处理最后（两年）的安全支持，以确保每个版本都能获得至少\
  \ 5 年的支持，并让用户能够从版本 `N` 升级到 `N+2`，例如从 `Debian 8 \"Jessie\"` 升级到 `Debian 10 \"Buster\"\
  `。\n\n→ [`wiki.debian.org/LTS`](https://wiki.debian.org/LTS)\n\n***\n\n### 社区：赞助\
  \ LTS 工作的公司\n\n`Long Term Support`（长期支持）对于 `Debian` 来说是一个困难的承诺，因为志愿者倾向于避免不有趣的工作。而为\
  \ 5 年前的软件提供安全支持——对于许多贡献者来说——比打包新的上游版本或开发新功能有趣得多。\n\n为了使这个项目落地，项目依靠这样一个事实：长期支持对公司特别重要，而且他们愿意分担这种安全支持的成本。\n\
  \n项目始于 2014 年 6 月：一些组织允许其员工兼职贡献 `Debian LTS`，而另一些组织则倾向于通过资金赞助项目，以便 `Debian` 获得报酬去做他们不会免费做的工作。大多数愿意获得报酬从事\
  \ `LTS` 的 `Debian` 贡献者聚集在一起，创建了一个由 `Freexian`（`Raphaël Hertz`）管理的清晰赞助提议。\n\n→ [`www.freexian.com/services/debian-lts.html`](https://www.freexian.com/services/debian-lts.html)\n\
  \n***\n\n# 第 2 章 介绍案例研究\n\n在本书的上下文中，你是一家不断成长的小型企业的系统管理员。现在是你与你的董事会合作，重新定义明年的信息系统主计划了。出于实际和经济考虑，你选择逐步迁移到\
  \ `Debian`。让我们详细看看等待着你的是什么……\n\n我们构思了这个案例研究，以涵盖目前中型公司使用的所有现代系统服务。读完本书后，你将拥有在服务器上安装\
  \ `Debian` 所需的所有元素，并自翅翱翔。你还将学习如何在遇到困难时高效地寻找信息。\n\n## 2.1. 快速增长的 IT 需求\n\n`Falcot\
  \ Corp` 是一家高品质音频设备制造商。公司正在强劲增长，有两个设施，一个在圣蒂埃（Saint-Étienne），另一个在蒙彼耶（Montpellier）。前者有约\
  \ 150 名员工；它有一个扬声器制造工厂、一个设计实验室以及所有的行政办公室。`Montpellier` 站点较小，只有约 50 名工人，生产放大器。\n\n\
  ***\n\n### 注意：为案例研究创建的虚拟公司\n\n此处作为示例的 `Falcot Corp` 公司完全是虚构的。与现有公司的任何相似之处纯属巧合。同样，书中的某些示例数据可能是虚构的。\n\
  \n\n\n信息系统已经难以跟上公司的增长，因此他们现在决定完全重新定义它，以满足层建立的各项目标：\n\n*   现代、易扩展的基础设施；\n*   得益于使用开源软件，降低软件许可成本；\n\
  *   安装电子商务网站，可能是 B2B（企业对企业，即不同公司之间信息系统的连接，例如供应商与其客户之间的连接）；\n*   大幅提升安全安全性，以更好地保护与新产品相关的商业机密。\n\
  \n整个信息系统将以这些目标为指导，进行全面重构。\n\n## 2.2. 总体计划\n\n在你的合作下，IT 管理部门进行了一项稍微更广泛的研究，识别了一些限制条件，并为迁移到选定的开源系统\
  \ `Debian` 制定了计划。\n\n识别出的一个重大限制条件是，会计部门使用特定的软件，这些软件仅运行在 `Microsoft Windows™` 上。而实验室方面使用的是运行在\
  \ `OS X™` 上的计算机辅助设计软件。\n\n图 2.1. Falcot Corp 网络概览![Falcot Corp 网络概览](img/case-study.png)\n\
  \n向 `Debian` 的切换将是渐进的；一家资源有限的小型企业无法合理地在夜之间改变一切。首先，IT 员工必须接受 `Debian` 管理的培训。然后将开始转换服务器，从网络基础设施（路由器、防火墙等）开始，然后是用户服务（文件共享、Web、SMTP\
  \ 等）。接着，办公电脑将逐步迁移到 `Debian`，在部署新系统期间，对每个部门进行（内部）培训。\n\n## 2.3. 为什么选择 GNU/Linux 发行版？\n\
  \n回归本质：是 Linux 还是 GNU/Linux？\n\n如你所知，`Linux` 仅仅是一个内核。因此，“Linux 发行版”和“Linux 系统”这两个表述实际上是不准确的：实际上，它们是基于\
  \ Linux 的发行版或系统。这些术语未能提到始终完整了该内核的软件，其中包括由 `GNU 项目` 开发的程序。该项目的创始人理查德·斯托曼（Richard\
  \ Stallman）博士坚持系统地使用“GNU/Linux”这一术语，以便更好地承认 `GNU 项目` 所出的重要贡献以及其基础的自由原则。\n\n`Debian`\
  \ 选择遵循这一建议，并据此命名其发行版（因此，最新的稳定版本是 `Debian GNU/Linux 10`）。 \n\n几个因素决定了这一选择。熟悉该发行版的系统管理员确保它被列入计算机系统重构的候选名单。尽管这项工作对公司的未来至关重要，但困难的经济条件和激烈的竞争限制了这项操作的预算。这就是为什么迅速选择了开源解决方案：最近的几项研究表明，只要有合格的人员运行它们，它们比专有解决方案更便宜，同时提供同等或更好的服务质量。\n\
  \n实践中：总拥有成本 (TCO)\n\n总拥有成本是指拥有或获取某物品（在本例中指操作系统）所花费的所有金钱总和。此价格包含了任何可能的许可费用、培训人员使用新软件的成本、更换过慢机器的费用、额外的维修等。直接源于初始选择的一切都被考虑在内。\n\
  \n这种 `TCO` 根据取决于评估时选定的标准而异，孤立来看通常并不显著。然而，如果按照相同的规则进行计算，比较不同选项的 `TCO` 就非常有意义。因此，这张评估表具有至关重要的意义，并且对其进行操纵以得出预设的结论。因此，单台机器的\
  \ `TCO` 没有意义，因为管理员的成本也反映在他们管理的机器总数中，而这个数字显然取决于建议的操作系统和工具。\n\n在免费操作系统中，IT 部门考虑了免费的\
  \ `BSD` 系统（`OpenBSD`、`FreeBSD` 和 `NetBSD`）、`GNU Hurd` 以及 `Linux` 发行版。尚未发布稳定版本的 `GNU\
  \ Hurd` 立即被拒绝了。在 `BSD` 和 `Linux` 之间的选择更为简单。前者有很多优点，特别是在服务器方面。然而，务实主义导致了选择了 `Linux`\
  \ 系统，因为它的安装基础和流行程度都非常显著，并具有许多积极影响。其中一个影响是，找到合格的人员来管理 `Linux` 机器比找到具有 `BSD` 经验的技人员更容易。此外，`Linux`\
  \ 比 `BSD` 更快地适应新硬件（尽管它们在这场竞赛中往往不鼓相当）。最后，`Linux` 发行版通常更适应用户友好的图形用户界面，这在所有办公机器迁移到新系统的期间对初学者来说是不可少的。\n\
  \n替代方案：Debian GNU/kFreeBSD\n\n自 `Debian 6 Squeeze` 起，在 32 位和 64 位计算机上可以使用带有 `FreeBSD`\
  \ 内核的 `Debian`；这就是 `kfreebsd-i386` 和 `kfreebsd-amd64` 架构的意思。虽然这些架构不是“官方”的（它们托管在独立的镜像上——`ports.debian.org`），但它们提供了\
  \ `Debian` 软件包的 70% 以上。\n\n这些架构对于 Falcot Corp 的管理员来说可能是合适的选择，特别是对于防火墙（内核支持三种不同的防火墙：`IPF`、`IPFW`、`PF`）或\
  \ `NAS`（网络存储系统，`ZFS` 文件系统已通过测试并批准）。\n\n## 2.4. 为什么选择 Debian 发行版？\n\n一旦选择了 Linux\
  \ 家族，必须选择一个更具体的选项。同样，有很多需要考虑的标准。所选发行版必须能够运行几年，因为从一个迁移到另一个将产生额外成本（尽管比两个不同的操作系统如 `Windows`\
  \ 或 `OS X` 之间的迁移要低）。\n\n因此，可持续性至关重要，它必须保证多年的定期更新和安全补丁。更新的时间点也非常重要，因为由于要管理大量机器，Falcot\
  \ 公司无法频繁处理这种复杂操作。因此，IT 部门坚持运行发行版的最新版本，获得获得的技术支持和保证的安全补丁。事实上，安全更新通常只对发行版的旧版本提供保证。\n\
  \n最后，出于统一性和易管理的考虑，所有服务器和办公电脑必须运行相同的发行版。\n\n### 2.4.1. 商业型与社区驱动发行版\n\nLinux 发行版主要分为类：商业型和社区驱动。前者由公司开发，并同商业支持一起出售。后者按照与其所组成的自由软件相同的开放开发模式进行开发。\n\
  \n商业发行版倾向于更频繁地发布新版本，以便更好地营销更新和相关服务。它们的未来直接取决于公司的商业成功，许多公司已经消失了（`Caldera Linux`、`StormLinux`、`Mandriva\
  \ Linux` 等）。\n\n社区发行版不遵循任何计划，而是遵循自己的计划。就像 `Linux` 内核一样，新版本在稳定时发布，绝不提前发布。只要有足够的个人开发者或第三方公司支持它，它的生存就有保障。\n\
  \n对各种 Linux 发行版的对比导致由于多种原因选择了 `Debian`：\n\n\n\n\n\n- 这是一个社区发行版，其开发不受任何商业限制的独立；因此，其目标本质上是技术性的，这似乎有利于产品的整体质量。\n\
  - 在所有社区发行版中，从许多角度来看，它是最的：考虑到贡献者数量、可用软件包数量以及持续存在的年限。其社区规模是其持续性不可否认的证明。\n- 从统计数据来看，每\
  \ 18 到 24 个月发布新版本，并支持 5 年，这个时间表对于管理员来说是容易接受的。\n- 对几家专门从事自由软件的法国公司的调查显示，它们都为 `Debian`\
  \ 提供技术支持；对于其中许多公司来说，它在内部也是他们选定的发行版。这种潜在提供者的多样性是 Falcot Corp 独立性的主要资产。\n- 最后，`Debian`\
  \ 可适用于多种架构，包括用于 OpenPOWER 处理器的 `ppc64el`；因此，将它安装在 Falcot Corp 最新的 IBM 服务器上是可能的。\n\
  \n## 实践中的 Debian 长期支持\n\nDebian 长期支持 (`LTS`) 项目始于 2014 年，旨在为所有稳定版 `Debian` 提供 5\
  \ 年的安全支持。由于 `LTS` 对具有大型部署的组织至关重要，项目尝试整合使用 `Debian` 的公司的资源。\n\n→ [`wiki.debian.org/LTS`](https://wiki.debian.org/LTS)\n\
  \nFalcot Corp 的规模还不足以让其 IT 员工的成员为 `LTS` 项目做出贡献，因此公司选择订阅 Freexian 的 `Debian LTS`\
  \ 合同并提供资金支持。感谢于此，Falcot 管理员知道他们使用的软件包将得到优先处理，并且在出现问题时可以与 `LTS` 团队直接联系。\n\n→ [`wiki.debian.org/LTS/Funding`](https://wiki.debian.org/LTS/Funding)\
  \ → [`www.freexian.com/services/debian-lts.html`](https://www.freexian.com/services/debian-lts.html)\n\
  \n一旦选定了 `Debian`，就必须决定使用哪个版本。让我们看看管理员为什么选择了 `Debian Buster`。\n\n# 2.5. 为什么选择 Debian\
  \ Buster？\n\n每一个 `Debian` 版本在诞生时都是一个不断变化的发行版，也称为“测试”（Testing）。但在你阅读这些文字时，`Debian\
  \ Buster` 是 `Debian` 最新的“稳定”（Stable）版本。\n\n选择 `Debian Buster` 有充分的理由，事实上，任何关心服务器质量的管理员自然会倾向于\
  \ `Debian` 的稳定版本。即使上一个稳定版本可能仍会被支持一段时间，但 Falcot 管理员没有考虑它，因为它的支持期不会持续足够长，而且最新版本带来了他们所关心的新颖的、有趣的功能。\n\
  \n# 第 3 章。分析现有设置与迁移\n\n任何计算机系统的彻底翻新都应该考虑现有系统。这允许尽多地重用可用资源，并保证组成系统的各种元素之间的互操作性。本研究将引入一个通用框架，以便在任何计算基础设施向\
  \ Linux 的迁移过程中遵循。\n\n## 3.1. 异构环境中的共存\n\n`Debian` 很好地集成到所有类型的现有环境中，并与任何其他操作系统良好地协作。这种近乎完美的和谐来自于市场压力，这种压力要求软件发行者开发遵循标准的程序。对标准的遵循允许管理员更换程序：客户端或服务器，无论是否免费。\n\
  \n### 3.1.1. 与 Windows 机器的集成\n\n`Samba` 的 `SMB/CIFS` 支持确保了在 Windows 上文中卓越的通信。它向\
  \ Windows 客户端共享文件和打印队列，并包含了允许 Linux 机器使用 Windows 服务器上可用资源的软件。\n\n## 工具 工具 Samba\n\
  \n最新版本的 `Samba` 可以替换大多数 Windows 功能：从简单的 Windows NT 服务器功能（身份验证、文件、打印队列、下载打印机驱动程序、DFS\
  \ 等）到最先进的功能（与 Active Directory 兼容的域控制器）。\n\n### 3.1.2. 与 OS X 机器的集成\n\nOS X 机器提供并能够使用网络服务，如文件服务器和打印机共享。这些服务在局域网上发布，允许其他机器发现并利用它们，而无需任何手动配置，这是通过使用\
  \ `Zeroconf` 协议套件的 `Bonjour` 实现。`Debian` 包含了另一个名为 `Avahi` 的实现，它提供了相同的功能。\n\n在相反方向，可以使用\
  \ `Netatalk` 守护进程为网络上的 OS X 机器提供文件服务器。它实现了 `AFP` (AppleShare) 协议以及所需的通知，以便服务器可以被\
  \ OS X 客户端自动发现。\n\n旧的 Mac OS 网络（OS X 之前）使用一种名为 `AppleTalk` 的不同协议。对于涉及使用该协议的机器的环境，`Netatalk`\
  \ 也提供了 `AppleTalk` 协议（事实上，它是作为该协议的重新实现开始的）。它确保文件服务器、打印队列以及时间服务器（时钟同步）运行。它的路由功能允许与\
  \ AppleTalk 网络相互连接。\n\n### 3.1.3. 与其他 Linux/Unix 机器的集成\n\n最后，包含在内的 `NFS` 和 `NIS`\
  \ 保证了与 Unix 系统的交互。`NFS` 确保了文件服务器功能，而 `NIS` 创建用户目录。大多数 Unix 系统使用的 BSD 打印层也允许共享打印队列。\n\
  \n图 3.1 `Debian` 与 OS X、Windows 和 Unix 系统的共存![Debian 与 OS X、Windows 和 Unix 系统的共存](img/existing-setup.png)\n\
  \n# 3.2. 如何迁移\n\n为了保证连续，每个计算机迁移必须经过计划并执行。这一原则适用于任何操作系统。\n\n## 3.2.1. 调查与识别服务\n\n\
  尽管看起来简单，这一步是关重要的。严肃的管理员确实了解每个服务器的角色，但这些角色可能会变化，有时经验丰富的用户可能安装了“野生”服务。了解它们的存在至少允许你决定如何处理它们，而不是随意删除。\n\
  \n为了这个目的，在迁移服务器之前告知用户该项目是明智的。为了让他们参与项目，在迁移之前在桌面上安装常用的程序，他们在迁移到 `Debian` 后可以使用这些程序；`LibreOffice`\
  \ 和 Mozilla 套件是最好的例子。\n\n### 3.2.1.1. 网络与进程\n\n`nmap` 工具（在同名软件包中）可以快速识别网络连接机器的服务，而无需登录它。只需在连接到相同网络的另一台机器上调用以下命令：\n\
  \n```\n$ nmap mirwiz\nStarting Nmap 7.40 ( https://nmap.org ) at 2017-06-06 14:41\
  \ CEST\nNmap scan report for mirwiz (192.168.1.104)\nHost is up (0.00062s latency).\n\
  Not shown: 992 closed ports\nPORT STATE SERVICE\n22/tcp open ssh\n25/tcp open smtp\n\
  80/tcp open http\n111/tcp open rpcbind\n139/tcp open netbios-ssn\n445/tcp open microsoft-ds\n\
  5666/tcp open nrpe\n9999/tcp open abyss\nNmap done: 1 IP address (1 host up) scanned\
  \ in 0.06 seconds\n```\n\n### 替代 使用 netstat 查找可用服务列表\n\n在 Linux 机器上，`netstat -tupan`\
  \ 命令将显示活动或等待的 TCP 会话列表，以及运行程序正在监听的 UDP 端口。这有助于识别网络提供的服务。\n\n## 进阶 IPv6\n\n\n\n\n\
  \n某些网络命令可能可以在 IPv4（通常是默认）或 IPv6 上运行。这些包括 `nmap` 和 `netstat` 命令，但也包括其他，例如 `route`\
  \ 或 `ip`。惯例是，这种行为通过 `-6` 命令行选项启用。\n\n如果服务器是为用户提供 shell 账户的 Unix 机器，那么确定进程在所有者不在的情况下是否在后台执行是一件很有趣的事。`ps\
  \ auxw` 命令显示所有进程及其用户身份的列表。通过将此信息与 `who` 命令的输出（该命令给出了登录用户列表）进行对比，可以识别出在后台运行的异常或未声明的服务器或程序。查看\
  \ `crontabs`（列出用户安排的自动操作表格）通常会提供有关服务器功能的有趣信息（关于 `cron` 的完整解释请参见第 9.7 节，“使用 `cron`\
  \ 和 `atd` 调度任务”）。\n\n无论在任何情况下，备份服务器至关重要：这允许在迁移后恢复信息，因为那时用户可能会因迁移报告特定问题。\n\n## 3.2.2\
  \ 备份配置\n\n保留每个已识别服务的配置是明智的，以便在更新后的服务器上安装等效程序。最起码是制作配置文件的备份副本。\n\n对于 Unix 机器，配置文件通常位于\
  \ `/etc/`，但它们也可能位于 `/usr/local/` 的子目录下。如果程序是从源代码而非通过包安装的，情况如此。在某些情况下，可能也可以在 `/opt/`\
  \ 下找到它们。\n\n对于数据管理服务（如数据库），强烈建议将数据导出为标准格式，以便新软件可以于导入。这种格式通常是文本模式并有文档说明；例如，数据库的 SQL\
  \ 储，或者 LDAP 服务器的 LDIF 文件。\n\n图 3.2 数据库备份![数据库备份](img/existing-setup-2.png)\n\n每个服务器软件都不同，且无法详细描述所有现有情况。对比现有软件和新软件的文档，以识别可以导出（因此可以重新导入）的部分以及需要手动处理的部分。阅读本书书将阐明主要\
  \ Linux 服务器程序的配置。\n\n## 3.2.3 接管现有的 Debian 服务器\n\n为了有效地接管维护工作，可以分析一台已经在运行 Debian\
  \ 的机器。\n\n第一个要检查的文件是 `/etc/debian_version`，它通常包含已安装 Debian 系统的版本号（它是 `base-files`\
  \ 包的一部分）。如果它指示为 `codename`/sid`，则意味着系统使用了来自某个开发发行版（测试版或不稳定版）的包进行更新。\n\n`apt-show-versions`\
  \ 程序（来自同名的 Debian 软件包）检查已安装包列表并识别可用版本。`aptitude` 也可以用于这些任务，尽管方式不那么系统化。\n\n看一眼 `/etc/apt/sources.list`\
  \ 文件（以及 `/etc/apt/sources.list.d/` 目录）将显示已安装的 Debian 包可能来自哪里。如果出现许多未知源，管理员可能会选择完全重新安装计算机系统，以确保与\
  \ Debian 提供的软件具有最佳的兼容性。\n\n`sources.list` 文件通常是一个很好的指标：大多数管理员至少在注释中保留了以前使用过的 APT\
  \ 源列表。但你不你不应该忘记，过去使用的某些源可能已经被删除，而且从互联网上抓取的某些随机包可能是手动安装的（借助 `dpkg` 命令的帮助）。在这种情况下，这台机器的外观看起来是一个“标准”\
  \ Debian 系统是具有误导性的。这就是为什么你应该注意任何会暴露外部包存在的迹象（在不寻目录中出现 `deb` 文件，带有特殊后缀的包版本号，指示其源自\
  \ Debian 项目之外，例如 `ubuntu` 或 `lmde` 等）。\n\n同样，分析 `/usr/local/` 目录的内容也很有趣，其目的是包含手动编译并安装的程序。列出以这种方式安装的软件是有启发意义的，因为这引发了关于为什么不使用相应的\
  \ Debian 包（如果存在此类包的话）的问题。\n\n### 快速查看 cruft/cruft-ng, debsums 和 apt-show-versions\n\
  \n`cruft` 和 `cruft-ng` 软件包建议列出不属于任何包的可用文件。它们具有一些过滤器（效果或不相同，更新程度也不相同），以避免报告某些合法文件（由\
  \ Debian 包生成的文件，或非 `dpkg` 管理的生成的配置文件等）。\n\n**不要盲目删除 `cruft` 和 `cruft-ng` 可能列出的所有内容！**\n\
  \n`debsums` 软件包允许将包安装的每个文件的 MD5 散列值与参考散列值进行对比，并有助于确定哪些文件可能被修改过（参见*提示查找更改的文件）。请注意，创建的文件（由\
  \ Debian 包生成的文件，或非 `dpkg` 管理的生成的配置文件等）不受此检查。\n\n`apt-show-versions` 软件包提供了一个检查没有源的已安装包的工具，并有助于确定第三方包（参见第\
  \ 6.7.3.1 节，“从 Debian 存档删除的包）。\n\n## 3.2.4 安装 Debian\n\n一旦已知当前服务器的所有信息，就可以关闭并在上面安装\
  \ Debian。\n\n为了选择合适的版本，我们必须知道计算机的架构。如果是一台较新的 PC，它最可能是 `amd64`（旧的 PC 通常是 `i386`）。在其他情况下，我们可以根据之前使用的系统来缩小范围。\n\
  \n表 3.1 并不是详尽的，但可能会有所帮助。注意，它列出了当前稳定发行版不再支持的 Debian 架构。在任何情况下，计算机的原始文档是寻找此类信息的最可靠来源。\n\
  \n表 3.1 操作系统与架构匹配\n\n| 操作系统 | 架构(s) |\n| --- | --- |\n| DEC Unix (OSF/1) | alpha,\
  \ mipsel |\n| HP Unix | ia64, hppa |\n| IBM AIX | powerpc |\n| Irix | mips |\n|\
  \ OS X | amd64, powerpc, i386 |\n| z/OS, MVS | s390x, s390 |\n| Solaris, SunOS |\
  \ sparc, i386, m68k |\n| Ultrix | mips |\n| VMS | alpha |\n| Windows 95/98/ME |\
  \ i386 |\n| Windows NT/2000 | i386, alpha, ia64, mipsel |\n| Windows XP / Windows\
  \ Server 2008 | i386, amd64, ia64 |\n| Windows RT | armel, armhf, arm64 |\n| Windows\
  \ Vista / Windows 7-8-10 | i386, amd64 |\n\n### 硬件 64 位 PC 与 32 位 PC\n\n大多数现代计算机拥有\
  \ 64 位 Intel 或 AMD 处理器，兼容旧的 32 位处理器；因此，为 `i386` 架构编译的软件可以运行。然而，这种兼容模式无法充分利用这些新处理器的能力。这就是为什么\
  \ Debian 提供了 `amd64` 架构，它不仅适用于的 AMD 芯片，也适用于 Intel `em64t` 处理器（包括大多数 Core 系列），这些与\
  \ AMD64 非常相似。\n\n\n\n\n\n一旦安装了 Debian，我们需要逐一安装并配置这台计算机必须托管的内核。新配置必须考虑之前的配置，以确保平稳过渡。在前两个步骤中收集的所有信息都将有助于成功完成这部分。\n\
  \n图 3.3. 安装所选的服务![安装所选的服务](img/existing-setup-4.png)\n\n在全身心投入这项练习之前，强烈建议你读完这本书的剩余部分。之后，你将对如何配置预期的服务有更精确的理解。\n\
  \n# 第 4 章. 安装\n\n要使用 Debian，你需要在计算机上安装它；此任务由 `debian-installer` 程序负责。一个适当的安装涉及许多操作。本章将按照时间顺序回顾这些操作。\n\
  \n***\n\n返回基础知识 **附录中有一门跟进课程**\n\n当你熟悉计算机的工作原理时，安装计算机总是更简单。如果你不熟悉，在阅读本章之前，请快速查看附录\
  \ B，短期补习课程。\n\n***\n\nB 的安装程序基于 `debian-installer`。它的模块化设计能够在各种场景下工作，并允许它随变化演进和适应。尽管支持大量架构带来了局限性，但此安装程序对初学者来说非常容易上手，因为它在过程的每个阶段都会协助用户。自动硬件检测、引导式分区和图形用户界面已经解决了新手在\
  \ Debian 早期经常面临的大多数问题。\n\n安装需要 128 MB 的 RAM（随机访问存储器）和至少 2 GB 的硬盘空间。所有 Falcot 计算机都符合这些标准。请注意，这些数字适用于安装没有图形桌面的非常有限的系统。对于基本的办公桌面工作站，真正建议至少配备\
  \ 1 GB RAM 和 10 GB 硬盘空间。\n\n***\n\n**注意 从 Stretch 升级**\n\n如果你已经在计算机上安装了 Debian Stretch，那么本章不适合你！与其他发行版不同，Debian\
  \ 允许系统从一个版本更新到下一个版本，而无需重新安装系统。重新安装不仅没有必要，甚至可能是危险的，因为它可能会删除已安装的程序。\n\n升级过程将在第 6.7\
  \ 节，“从一个稳定发行版升级到下一个版本”](#ch06s07.html \"6.7. 从一个稳定发行版升级到下一个版本\") 中描述。\n\n***\n\n\
  ## 4.1. 安装方法\n\n只要机器的 BIOS 允许，就可以从几种类型的介质安装 Debian 系统。例如，你可以通过 CD-ROM、USB 闪存盘甚至通过网络启动。\n\
  \n***\n\n返回基础知识 BIOS，硬件/软件接口\n\nBIOS（全称 Basic Input/Output System，基本输入输出系统）是包含在主板（连接所有外围设备的电子板）中的软件，它在计算机启动时执行，用于加载操作系统（通过适配的引导加载程序）。它在后台运行，在硬件和软件（在我们的例子中为\
  \ Linux 内核）之间提供接口。\n\n***\n\n## 4.1.1. 从 CD-ROM/DVD-ROM 安装\n\n最广泛使用的安装方法是从 CD-ROM（或\
  \ DVD-ROM，其行为完全相同）：计算机从该介质启动，由安装程序接管。\n\n不同的 CD-ROM 系列有不同的用途：`netinst`（网络安装）包含安装程序和\
  \ Debian 基本系统；所有其他程序随后下载。它的“镜像”，即包含磁盘确内容的 ISO-9660 文件系统，仅占用约 150 到 280 MB（取决于架构）。另一方面，完整版提供了所有软件包，并允许在没有\
  \ Internet 连接的计算机上安装；它大约需要 16 张 DVD-ROM（或 4 张蓝光磁盘）。不再有官方 CD-ROM 套件了，因为它们非常巨大、很少使用，而且现在大多数计算机也使用\
  \ DVD-ROM 和 CD-ROM。但程序根据其流行程度重要性分布在磁盘上；第一个磁盘对于大多数安装来说，因为它包含了最常用的软件。\n\n最后一种镜像被称为\
  \ `mini.iso`，它仅作为安装程序的副产品可用。镜像仅包含配置网络所需的最小内容，其他所有内容都下载（包括安装程序的一部分，这就是为什么当发布新版本的安装程序时，这些镜像往往会损坏）。可以在\
  \ Debian 镜像的 `dists/release/main/installer-arch/current/images/netboot/` 目录下找到这些镜像。\n\
  \n***\n\n提示 多架构磁盘\n\n大多数安装 CD- 和 DVD-ROM 仅适用于特定的硬件架构。如果你想下载完整镜像，必须注意选择与你想要安装的计算机硬件相匹配的镜像。\n\
  \n某些 CD/DVD-ROM 镜像可以在多个架构上运行。因此，我们有一个结合了 `i386` 和 `amd64` 架构 `netinst` 镜像的 CD-ROM\
  \ 镜像。\n\n获取 Debian CD-ROM 镜像，你可以下载它们并刻录到磁盘。你也可以购买它们，从而为项目提供一些资金支持。查看网站查看 DVD-ROM\
  \ 供应商和下载站列表。\n\n→ [`www.debian.org/CD/index.html`](https://www.debian.org/CD/index.html)\n\
  \n## 4.1.2. 从 USB 闪存盘启动\n\n由于大多数计算机都能从 USB 设备启动，你也可以从 USB 闪存盘安装 Debian（这只是一个闪盘）。\n\
  \n安装手册介绍了如何创建一个包含 `debian-installer` 的 USB 闪存盘。该过程非常简单，因为 i386 和 amd64 的 ISO 镜像是混合镜像，可以从\
  \ CD-ROM 也可以从 USB 闪存盘启动。\n\n你必须识别 USB 闪存盘的设备名称（例如 `/dev/sdb`）；最简单的方法是使用 `dmesg`\
  \ 命令检查内核的消息。然后你必须使用命令 `cat debian-10.0.0-amd64-netinst.iso >/dev/sdb; sync` 复制之前下载的\
  \ ISO 镜像。此命令需要管理员权限，因为它直接访问 USB 闪存盘并盲目擦除其内容。\n\n更详细的解释可以在安装手册中找到。它还描述了另一种更复杂的准备\
  \ USB 闪存盘的方法，允许自定义安装程序的默认选项（内核命令行中设置的选项）。\n\n→ [`www.debian.org/releases/stable/amd64/ch04s03`](https://www.debian.org/releases/stable/amd64/ch04s03)\n\
  \n## 4.1.3. 通过网络启动安装\n\n许多 BIOS 允许通过下载内核和最小文件系统镜像直接从网络启动。这种方法（许多名称，如 <acronym class=\"\
  acronym\">PXE</acronym> 或 <acronym class=\"acronym\">TFTP</acronym> 启动）在计算机没有 CD-ROM\
  \ 器或 BIOS 无法从此类介质启动时可以成为救命稻草。\n\n\n\n\n\n这种安装方法分为两个步骤。首先，在计算机启动时，BIOS（或网卡）会发出 `BOOTP/DHCP`\
  \ 请求以自动获取 IP 地址。当 `BOOTP` 或 `DHCP` 服务器返回响应时，响应中包含一个文件名以及网络设置。在配置好网络后，客户端计算机将针对之前指定的文件发出\
  \ `TFTP` 请求。一旦获取了该文件，它将像引导加载程序一样被执行。随后它会启动 Debian 安装程序，该程序的运行方式就像是从是从硬盘、CD-ROM 或\
  \ `USB` 优盘中运行一样。\n\n关于该方法的详细细节，请参阅安装指南（“为 TFTP 网络启动准备文件”章节）。\n\n→ [`www.debian.org/releases/stable/amd64/ch05s01#boot-tftp-x86`](https://www.debian.org/releases/stable/amd64/ch05s01#boot-tftp-x86)\
  \ → [`www.debian.org/releases/stable/amd64/ch04s05`](https://www.debian.org/releases/stable/amd64/ch04s05)\n\
  \n## 4.1.4. 其他安装方法\n\n当我们必须为大量计算机部署定制化安装时，通常会选择自动化而非手动安装方法。根据情况和要安装内容的复杂程度，我们可以使用\
  \ `FAI`（全自动安装程序，详见第 12.3.1 节，“全自动安装程序 (FAI)”](#ch12s03.html_sect.fai \"12.3.1. Fully\
  \ Automatic Installer (FAI)\")），或者甚至使用带有预设文件（preseeding）的自定义安装 DVD（参见第 12.3.2 节，“预设\
  \ Debian 安装程序”](#ch12s03.html_sect.d-i-preseeding \"12.3.2. Preseeding Debian-Installer\"\
  )）。\n\n## 4.2. 逐步安装\n\n### 4.2.1. 启动并启动安装程序\n\n一旦 BIOS 开始从 CD- 或 DVD-ROM 启动，`Isolinux`\
  \ 引导加载菜单就会出现。在此阶段，Linux 内核尚未加载；此菜单允许你选择要启动的内核，并输入可以在过程中传递给它的可能参数。\n\n对于标准安装，你只需要选择“Install”或“Graphical\
  \ install”（使用方向键），然后按 `Enter` 键启动剩余的安装过程。如果 DVD-ROM 是“多架构（Multi-arch）”磁盘，且机器配备了\
  \ Intel 或 AMD 64 位处理器，则这些菜单选项将启用安装 64 位变体 `amd64`，而安装 32 位变体的选项仍保留在专用子菜单（“32-bit\
  \ install options”）中。如果你使用的是 32 位处理器，你将没有可可选，菜单项将安装 32 位变体 `i386`。\n\n**进阶一步** 32\
  \ 位还是 64 位？\n\n32 位和 64 位系统之间的根本区别在于内存地址的大小。理论上，32 位系统无法处理超过 4 GB 的内存（`2³²` 字节）。在实践中，可以通过使用\
  \ `686-pae` 内核变体来规避这一限制，只要处理器支持 `PAE`（物理地址扩展）功能。然而，使用它对系统性能会有显著影响。这就是为什么在拥有大量内存的服务器上使用\
  \ 64 位模式非常有用的原因。\n\n对于办公电脑（性能上的百分之几差异可以忽略不计），你必须记住某些专用程序没有 64 位版本。技术上让它们在 64 位系统上运行是可能的，但你必须安装所有必要库的\
  \ 32 位版本（参见第 5.4.5 节，“多架构支持”](#ch05s04.html_sect.multi-arch \"5.4.5. Multi-Arch\
  \ Support\")），有时还需要使用 `setarch` 或 `linux32`（在 `util-linux` 包中）来欺骗应用程序系统属性。\n\n**实践中**\
  \ 与现有 Windows 系统并行安装\n\n如果计算机已经在运行 Windows，则不需要删除系统即可安装 Debian。你可以同时拥有两个系统，分别安装在不同的磁盘或分区上，并在启动计算机时选择启动哪一个。这种配置通常被称为“双引导”，Debian\
  \ 安装系统可以完成设置。这是在安装的硬盘分区阶段以及设置引导加载程序时完成的（参见侧边栏 *实践中* 缩小 Windows 分区 和 *注意* 引导加载程序和双引导）。\n\
  \n如果你已经有一个良好的 Windows 系统，甚至可以避免使用 CD-ROM；Debian 提供了一个 Windows 程序，将下载一个轻量 Debian\
  \ 安装程序并将其设置在硬盘上。你只需要重启计算机，并在普通 Windows 启动或启动安装程序之间选择。\n\n→ [`www.debian.org/releases/stable/amd64/ch05s01#boot-tftp-x86`](https://www.debian.org/releases/stable/amd64/ch05s01#boot-tftp-x86)\
  \ → [`www.debian.org/releases/stable/amd64/ch04s05`](https://www.debian.org/releases/stable/amd64/ch04s05)\n\
  \n**基础知识** 引导加载程序\n\n引导加载程序是一个底层程序，负责在 BIOS 移交控制权后立即引导 Linux 内核。为了完成这项任务，它必须能够找到要启动的\
  \ Linux 内核。在 i386 和 amd64 架构上，最常用的两个程序是 `LILO`（两者中较老的）和 `GRUB`（它的现代替代品）。`Isolinux`\
  \ 和 `Syslinux` 是经常用于从可移动介质启动的替代方案。\n\n每个菜单项都隐藏了一个特定的命令行，可以在验证条目并启动之前按 `TAB` 键根据需要进行配置。“Help”菜单项会显示不同的帮助屏幕，详细说明提示符处提供的选项。除非极少数情况下，否则你很少需要使用此选项。\n\
  \n“专家（expert）”模式（可通过“Advanced options”菜单访问）详细列了过程中的所有可能选项，并允许在各个步骤之间导航而不让它们自动发生。小心，这种非常冗的模式可能会由于提供的众多配置选择而令人困惑。\n\
  \n图 4.1. 启动屏幕\n![](img/inst-boot.png)\n\n一旦启动，安装程序将引导你逐步完成整个过程。本节详细介绍了这些步骤中的每一个。在这里，我们遵循从\
  \ amd64 DVD-ROM（更具体地说是安装程序的 rc1 版本）的安装过程；*netinst* 安装以及安装程序的最终版本可能会略有不同。我们还将介绍图形模式下的安装，但它与“经典”（文本模式）安装的唯一区别在于视觉外观。\n\
  \n### 4.2.2. 选择语言\n\n安装程序以英语开始，但第一步允许用户选择在剩余过程中将使用的语言。例如，选择法语将提供一个完全翻译为法语的安装过程（并结果是得到一个配置为法语的系统）。此选择还被用于定义后续阶段中更相关的默认选项（特别是键盘布局）。\n\
  \n**基础知识** 使用键盘导航\n\n安装过程中的某些步骤需要你输入信息。这些屏幕有多个可能“获得焦点”的区域（文本输入区域、复选框、选项列表、确定和取消按钮），`TAB`\
  \ 键允许你在这些区域之间移动。\n\n在图形模式下，你可以像在已安装的图形桌面上一样正常使用鼠标。\n\n\n\n\n\n# 图 4.2. 选择语言![选择语言](img/inst-lang.png)![选择语言](img/inst-lang-txt.png)\n\
  \n## 4.2.3. 选择国家\n\n第二步是选择您所在的国家。结合语言，此信息将使程序提供最合适的键盘布局。这将影响时区的配置。在美国，建议使用标准的 QWERTY\
  \ 键盘，并提供合适的时区选择。\n\n图 4.3. 选择国家![选择国家](img/inst-country.png)![选择国家](img/inst-country-txt.png)\n\
  \n## 4.2.4. 选择键盘布局\n\n建议的“美式英语”键盘对应于常规的 QWERTY 布局。\n\n图 4.4. 键盘的选择![键盘的选择](img/inst-keyboard.png)![键盘的选择](img/inst-keyboard-txt.png)\n\
  \n## 4.2.5. 检测硬件\n\n在绝大多数情况下，这一步是完全自动的。安装程序检测您的硬件，并尝试识别所使用的 CD-ROM 驱动器以访问其内容。它加载与检测到的各种硬件组件对应的模块，然后“挂载”\
  \ CD-ROM 以进行读取。之前的步骤完全包含在 CD 的引导镜像中，该文件大小有限，并在从 CD 启动时由 BIOS 加载到内存。\n\n安装程序可以处理大多数驱动器，特别是标准的\
  \ ATAPI 外设（有时称为 IDE 和 EIDE）。然而，如果 CD-ROM 阅读器检测失败，安装程序将提供加载 CD-ROM 驱动相应的内核模块（例如从\
  \ USB 闪盘）的选项。\n\n## 4.2.6. 加载组件\n\n现在 CD 内容已可用，安装程序将加载继续工作所需的所有文件。这包括剩余硬件（特别是网卡）的额外驱动程序，以及安装程序的所有组件。\n\
  \n## 4.2.7. 检测网络硬件\n\n此自动步骤尝试识别网卡并加载相应的模块。如果自动检测失败，您可以手动选择要加载的模块。如果没有模块可以工作，则可以从可移动设备加载特定模块。最后这种解决方案通常只在相应的驱动程序未包含在标准\
  \ Linux 内核但在其他地方（如制造商网站）可用时才需要。\n\n对于 `netinst` 安装，这一步必须成功，因为 Debian 软件包必须从网络加载。\n\
  \n## 4.2.8. 配置网络\n\n为了尽可能自动化此过程，安装程序尝试通过 DHCP（针对 IPv4）和 IPv6 网络发现进行自动网络配置。如果失败，它将提供更多选择：再次尝试使用普通的\
  \ DHCP 配置、尝试通过声明机器名称进行 DHCP 配置，或设置静态网络配置。\n\n最后这个选项需要一个 IP 地址、子网掩码、潜在网关的 IP 地址、机器名称和域名。\n\
  \n**提示** 不使用 DHCP 的配置\n\n如果本地网络配备了 DHCP 服务器，但您不想使用它（因为您更倾向于在安装期间为机器定义静态 IP 地址），您可以在从\
  \ CD-ROM 启动时添加 `netcfg/use_dhcp=false` 选项。您只需按 `TAB` 键进入所需的菜单项，并在按 `Enter` 键之前添加所需的选项即可。\n\
  \n**注意** 不要盲目操作\n\n许多局域网基于一个隐含假设，即所有机器都是可信任的，单台计算机的配置不当往往会扰乱整个网络。因此，在先与管理员同意适当设置（例如\
  \ IP 地址、子网掩码和广播地址）之前，不要将您的机器连接到网络。\n\n## 4.2.9. 管理员密码\n\n为机器管理员保留的超级用户 root 账户在安装期间自动创建；这就是为什么要求密码。安装程序还会要求确认密码，以防止发生以后难以修改的输入错误。注意，如果您想禁用\
  \ root 账户，可以让两个字段留空。在这种情况下，安装程序在下一步创建的第一个普通用户将通过 `sudo` 获得管理权限（请参见 第 8.9.4 节，“共享管理员权限”）。\n\
  \n图 4.5. 管理员密码![管理员密码](img/inst-rootpw.png)\n\n**安全** 管理员密码\n\nroot 用户的密码应该是长密码（12\
  \ 个字符或更多）且无法被猜到的。事实上，任何连接到互联网的计算机（尤其是任何服务器）都会经常成为使用最显而密码的自动化连接尝试的目标。有时它甚至可能受到字典攻击，即测试许多单词和数字的组合作为密码。避免使用孩子或父母的名字、出生日期等：您的许多同事可能知道这些信息，而您很少希望让他们免费访问相关计算机。\n\
  \n这些说明同样适用于其他用户密码，但对于没有管理权限的用户来说，账户被破解的后果没那么严重。\n\n如果缺乏灵感，请犹豫使用密码生成器，例如 `pwgen`（在同名包中）。\n\
  \n## 4.2.10. 创建第一个用户\n\nDebian 还强制要求创建一个用户账户，以防管理员养成以 root 身份工作的坏习惯。预防原则意味着每个任务都以所需的最小权限执行，以限制人为错误造成的破坏。这就是为什么安装程序将要求此第一个用户的全名、用户名和密码（要求两次，以防止输入错误）。\n\
  \n图 4.6. 第一个用户的名称![第一个用户的名称](img/inst-username.png)\n\n## 4.2.11. 配置时\n\n如果网络可用，系统时钟将通过\
  \ NTP 服务器一次性更新。这样从第一次启动开始日志的时间戳就是正确的。为了让时间保持一致，需要在初始安装后设置 NTP 守护进程（参见 第 8.9.2 节，“时间同步”）。\n\
  \n## 4.2.12. 检测磁盘和其他设备\n\n此步骤自动检测可能安装 Debian 的硬盘。它们将在接下来的步骤中呈现：分区。\n\n## 4.2.13.\
  \ 启动分区工具\n\n**文化** 分区的用途\n\n分区是安装过程中不可或缺的步骤，它将硬盘上的可用空间（其每个子部分被称为“分区”）根据要存储的数据和计算机的用途进行划分。此步骤还包括选择使用的文件系统。\n\
  \n对于新用户来说，分区步骤通常很难。需要定义存储 Linux 文件系统和虚拟内存（交换空间）的磁盘各个部分（分区）。如果机器上已经存在您想要保留的其他操作系统，此任务就会变得复杂。事实上，您必须确保不会更改其分区（或在不造成损坏的情况下对其进行调整大小）。\n\
  \n幸运的是，分区软件有一个“引导”模式，可以为用户推荐分区——在大多数情况下，您只需验证软件的建议即可。\n\n\n\n\n\n# 图 4.7. 分区模式的选择![分区模式的选择](img/inst-partman.png)\n\
  \n分区工具的第一个界面提供了使用整个硬盘来创建各种分区的选项。对于一台将仅运行 Linux 的（新）计算机，此选项显然是最简单的，你可以选择“引导式 - 使用整个磁盘”（Guided\
  \ - use entire disk）选项。如果电脑有两个硬盘分别用于两个操作系统，那么为每个硬盘设置一个驱动器也是一种便于分区的解决方案。在这两种情况下，下一个屏幕都允许你通过选择相应的条目来选择安装\
  \ Linux 的磁盘（例如，“SCSI1 (0,0,0) (sda) - 21.5 GB ATA QEMU HARDDISK”）。然后你开始引导式分区。\n\n\
  # 图 4.8. 用于引导式分区的磁盘![用于引导式分区的磁盘](img/inst-partman-disk.png)\n\n引导式分区也可以设置 LVM 逻辑卷而不是分区（见下文）。由于后续操作相同，我们不再介绍“引导式\
  \ - 使用整个磁盘并设置 LVM”（Guided - use entire disk and set up LVM）选项（无论是否加密）。\n\n在其他情况下，当\
  \ Linux 必须与其他已存在的分区共同工作时，你需要选择手动分区。\n\n## 4.2.13.1. 引导式分区\n\n引导式分区工具提供了三种分区方法，对应不同的用途。\n\
  \n# 图 4.9. 引导式分区![引导式分区](img/inst-autopartman-mode.png)\n\n第一种称为“所有文件在一个分区中”（All\
  \ files in one partition）。整个 Linux 系统树存储在单个文件系统中，对应于根目录 `/`。这种简单且稳健的分区方式非常适合个人或单用户系统。事实上，将创建两个分区：第一个包含整个系统，第二个是虚拟内存（交换）。\n\
  \n第二方法“独立的 `/home` 分区”（Separate `/home` partition）类似，但它将文件层次结构划分为两个：一个分区包含 Linux\
  \ 系统（`/`），第二个分区包含“家目录”（即用户数据，存储在 `/home/` 下的文件和子目录中）。\n\n最后一种分区方法称为“独立的 `/home`、`/var`\
  \ 和 `/tmp` 分区”（Separate `/home`, `/var`, and `/tmp` partitions），适用于服务器和多用户系统。它将文件树划分为许多分区：除了根（`/`）和用户账户（`/home/`）分区外，还有用于服务器软件数据（`/var/`）和临时文件（`/tmp/`）的分区。这些划分具有优点：用户无法通过耗尽所有硬盘空间来锁定服务器（他们只能填满\
  \ `/tmp/` 和 `/home/`）。守护进程数据（尤其是日志）不再会阻塞系统的其他部分。\n\n***\n\n**基础知识** 选择文件系统\n\n文件系统定义了数据在硬盘上的组织方式。每个现有的文件系统都有其优点和局限性。有些更稳健，另一些更有效：如果你非常了解需求，可以选择最合适的文件系统。已经经过了多种比较；似乎\
  \ `ReiserFS` 在读取许多小文件时特别高效；而 `XFS` 则在处理大文件时运行速度更快。`Ext4` 是 Debian 的默认文件系统，是一个很好的折中方案，它基于\
  \ Linux 历史上使用的前三个版本文件系统（`ext`、`ext2` 和 `ext3`）。`Ext4` 克服了 `ext3` 的某些局限性，特别适用于大容量硬盘。另一个选项是尝试极具前景的\
  \ `btrfs`，它包含了许多到今天仍需要使用 LVM 和/或 RAID 的功能。\n\n日志文件系统（如 `ext3`、`ext4`、`btrfs`、`reiserfs`\
  \ 或 `xfs`）采取了特殊措施，以便在意外中断后能够返回之前的一致状态，而无需完全分析整个磁盘（如 `ext2` 系统）。这种功能通过填充日志来实现，日志描述了在实际执行之前要进行的操作。如果某个操作被中断，将从日志中“重放”它。相反，如果在更新日志期间发生中断，最后请求的更改将被简单忽略；正在写入的数据可能会丢失，但由于硬盘上的数据没有变化，它们保持了一致性。这无非是是应用于文件系统的事务处理机制。\n\
  \n***\n\n在选择完分区类型后，软件会计算出一个建议并在屏幕上描述；用户随后可以根据需要对其修改。特别是，如果标准选择（`ext4`）不合适，你可以选择另一个文件系统。但在大多数情况下，建议的分区是合理的，可以通过选择“完成分区并将更改写入磁盘”（Finish\
  \ partitioning and write changes to disk）条目来接受。\n\n# 图 4.10. 验证分区![验证分区](img/inst-partman-validation.png)\n\
  \n## 4.2.13.2. 手动分区\n\n手动分区提供了更大的灵活性，允许用户选择每个分区的用途和大小。此外，如果你想使用软件 RAID，这种模式是不可避免的。\n\
  \n***\n\n**实践** 缩小 Windows 分区\n\n要与现有的操作系统（Windows 或其他）一起安装 Debian，你必须有一些未被其他系统使用的可用硬盘空间，以便能够为\
  \ Debian 创建专用的分区。在大多数情况下，这意味着缩小 Windows 分区并重用释放的空间。\n\nDebian 安装程序在用手动模式进行分区时允许执行此操作。你只需要选择\
  \ Windows 分区并输入其新大小（这对于未加密的 FAT 和 NTFS 分区均有效）。\n\n如果 Windows 使用 BitLocker 加密分区，调整其大小的步骤需要使用\
  \ BitLocker 管理工具配合 Windows 管理工具。\n\n***\n\n第一个屏幕显示了可用磁盘、其分区以及任何未分区的空空间。你可以选择每个元素；按\
  \ `Enter` 键将列出可能的操作。\n\n你可以通过选择磁盘来删除其上的所有分区。\n\n在选择磁盘上的空闲空间时，你可以手动创建一个新分区。你也可以通过引导式分区执行此操作，这对于包含其他操作系统的磁盘是一个有趣的解决方案，你可能希望以标准方式对其分区。更多信息请参见第\
  \ 4.2.13.1 节 引导式分区。\n\n***\n\n**基础知识** 挂载点\n\n挂载点是托管分区内容的目录树。因此，挂载在 `/home/` 的分区传统上包含用户数据。\n\
  \n当此目录命名为 `/` 时，它被称为文件树的*根*（root），因此是托管 Debian 系统的分区根。\n\n***\n\n***\n\n**基础知识**\
  \ 虚拟内存，交换\n\n虚拟内存允许 Linux 内核在内存（RAM）不足时，通过将一段时间未使用的内存部分存储在硬盘的交换分区上来释放部分内存。\n\n为了模拟额外的内存，Windows\
  \ 使用直接包含在文件中的交换文件。相反，Linux 使用专门用于此目的的分区，因此被称为“交换分区”。\n\n***\n\n在选择分区时，你可以指示将使用它的方式：\n\
  \n-   格式化它并通过选择挂载点将其包含在文件树中；\n-   将其作为交换分区；\n-   使其成为“加密物理卷”（以保护某些分区数据的机密性，见下文）；\n\
  -   使其成为 LVM 物理卷（该概念在本章稍后部分详细讨论）；\n\n\n\n\n\n- 将其作为 RAID 设备（参见本章后文部分）；\n- 你也可以选择不使用它，从而保持其原状。\n\
  \n### 4.2.13.3. 配置多磁盘设备（软件 RAID）\n\n某些类型的 RAID 允许将存储在硬盘上的信息复制，以防止在发生影响其中一个硬盘的硬件问题时导致数据丢失。Level\
  \ 1 RAID 在另一个驱动器上保留硬盘的一个简单且相同的副本（镜像），而 Level 5 RAID 则将冗余数据分布在多个磁盘上，从而允许对故障磁盘进行完全重构。\n\
  \n我们将仅描述实现最简单的 Level 1 RAID。第一步是在两个不同的硬盘上创建两个相同大小的分，并将它们标记为“RAID 物理卷”（physical volume\
  \ for RAID）。\n\n然后你必须在分区工具中选择“配置软件 RAID”（Configure software RAID），将这两个分区合并为一个新的虚拟磁盘，并在配置屏幕中选择“创建\
  \ MD 设备”（Create MD device）。随后，你需要回答关于此新设备的一系列问题。第一个问题询问要使用的 RAID 级别，在我们的情况下将是“RAID1”。第二个问题询问活动设备的数量——在我们的情况下为两个，即需要包含在此\
  \ MD 设备中的分区数量。第三个问题是关于备用设备的数量——0；我们没有计划任何额外的磁盘来接替可能损坏的磁盘。最后一个问题要求你为 RAID 设备选择分区——这些就是我们为此目的预留的两个分区（确保你只选择了显式提到“raid”的分区）。\n\
  \n回到主菜单，会出现一个全新的虚拟“RAID”磁盘。该磁盘以单个分区的形式呈现，该分区无法删除，但我们可以选择其使用方式（就像任何其他分区一样）。\n\n有关\
  \ RAID 功能的更多详细信息，请参阅 第 12.1.1 节，“软件 RAID”。\n\n### 4.2.13.4. 配置逻辑卷管理器 (LVM)\n\nLVM\
  \ 允许你创建跨越多个磁盘的“虚拟”分区。其优点有两点：分区的大小不再受限于单个磁盘，而是受限于累积卷；而且你可以随时调整现有分区的大小，可能在需要时添加额外磁盘后进行。\n\
  \nLVM 使用了特定的术语：虚拟分区是“逻辑卷”（logical volume），它是“卷组”（volume group）的一部分，或者是多个“物理卷”（physical\
  \ volumes）的关联。这些术语中的每一个实际上对应于“真实”分区（或软件 RAID 设备）。\n\n这种技术的工作方式非常简单：每个卷（无论是物理的逻辑的）都被分成相同大小的块，并由\
  \ LVM 使它们相互对应。添加新磁盘将创建一个新的物理卷，这些新块可以与任何卷组关联。因此被扩展的卷组中的所有分区都将拥有额外的空间供其扩展。\n\n分区工具通过几个步骤配置\
  \ LVM。首先，你必须在现有磁盘上创建作为“LVM 物理卷”（physical volumes for LVM）的分区。要激活 LVM，你需要选择“配置逻辑卷管理器\
  \ (LVM)”（Configure the Logical Volume Manager），然后在同一个配置屏幕上选择“创建卷组”（Create a volume\
  \ group），并在其中关联现有物理卷。最后，你可以在此卷组内创建逻辑卷。注意，自动分区系统可以自动执行所有步骤。\n\n在分区菜单中，每个物理卷将显示为带有单个分区的磁盘，该分区无法删除，但你可以根据需要使用它。\n\
  \nLVM 的用法详细说明在 第 12.1.2 节，“LVM” 中。\n\n### 4.2.13.5. 设置加密分区\n\n为了保证数据的机密性（例如在计算机或硬盘丢失或被盗的情况下），可以对某些分区的数据进行加密。此功能可以添加到任何文件系统之下，因为与\
  \ LVM 一样，Linux（特别是 `dm-crypt` 驱动）使用设备映射器（Device Mapper）基于底层分区创建虚拟分区（其内容受保护），底层分区将以加密形式存储数据（得益于\
  \ `LUKS`，即 Linux 统一密钥设置，一种标准格式，允许存储加密数据以及指示所用加密算法的元信息）。\n\n***\n\n**安全** 加密交换分区\n\
  \n使用加密分区时，加密密钥存储在内存（RAM）中。由于获取此密钥可以解密数据，因此，避免留下可能被计算机或硬盘的潜在窃贼或维护技术人员访问的密钥副本至关重要。然而，这在笔记本电脑上很容易发生，因为在休眠时\
  \ RAM 的内容会存储在交换分区中。如果该分区没有加密，窃贼可能会访问密钥并使用它来解密加密分区中的数据。这就是为什么，当你使用加密分区时，必须也加密交换分区！\n\
  \n如果用户尝试在交换分区未加密的情况下创建加密分区，Debian 安装程序将向用户发出。\n\n***\n\n要创建加密分区，你必须首先为此目的分配一个可用分区。为此，选择一个分区并指示其被用作“加密物理卷”（physical\
  \ volume for encryption）。对包含要制作的物理卷的磁盘进行分区后，选择“配置加密卷”（Configure encrypted volumes）。软件将建议用随机数据初始化物理卷（这使得真实数据的定位更加困难），并要求你输入“加密密码”（encryption\
  \ passphrase），你每次启动计算机时都必须输入它。在完成此步骤并返回分区工具菜单后，将出现一个以加密卷形式的新分区，你可以像配置其他分区一样对其进行配置。大多数情况下，此分区被用作物理卷，以便使用相同的加密密钥保护多个分区（LVM\
  \ 逻辑卷），包括交换分区（参见侧边栏 加密交换分区）。\n\n## 4.2.14. 安装基础系统\n\n此步骤不需要用户交互，将安装 Debian“基础系统”软件包。这包括管理\
  \ Debian 包的 `dpkg` 和 `apt` 工具，以及启动和使用系统所需的实用程序。\n\n图 4.11. 基础系统的安装![基础系统的安装](img/inst-basesystem.png)\n\
  \n## 4.2.15. 配置包管理器 (apt)\n\n为了能够安装额外的软件，需要对 APT 进行配置并告诉它哪里寻找 Debian 包。此步骤尽可能自动化。它从一个问题开始，询问必须使用网络源软件包，还是应该只在\
  \ CD-ROM 上查找软件包。\n\n***\n\n**注意** 驱动器中的 Debian CD-ROM\n\n如果安装程序在 CD/DVD 阅读器中检测到\
  \ Debian 安装光盘，则无需配置 APT 去网络查找软件包：APT 会自动配置为从移动介质驱动器读取软件包。如果该磁盘是套装的一部分，软件将提议“探索”其他磁盘以引用存储它们上的所有软件包。\n\
  \n***\n\n如果请求从网络获取软件包，接下来的两个问题允许你选择从哪里下载这些软件包，首先选择一个国家，然后选择该国家可用的镜像（镜像是托管 Debian\
  \ 主归档所有文件副本的公共服务器）。\n\n\n\n\n\n## 图 4.12. 选择 Debian 镜像![选择 Debian 镜像](img/inst-mirror.png)\n\
  \n最后，程序建议使用 HTTP 代理。如果没有代理，将直接访问互联网。如果你输入 `http://proxy.falcot.com:3128`，`APT` 将使用\
  \ Falcot 的 `proxy/cache`，这是一种名为“Squid”的程序。你可以通过检查连接到同一网络的另一台机器上 Web 浏览器的配置来找到这些设置。\n\
  \n随后，`Packages.xz` 和 `Sources.xz` 文件将自动下载，以更新 `APT` 识别的软件包列表。\n\n***\n\n### 基础知识：HTTP\
  \ 代理\n\nHTTP 代理是一个为网络用户转发 HTTP 请求的服务器。它有时通过保留传输过的文件的副本来加速下载（我们称之为代理/缓存，proxy/cache）。在某些情况下，它是访问外部\
  \ Web 服务器的唯一手段；在这种情况下，在安装过程中回答相应的问题至关重要，以便程序能够通过它下载 Debian 软件包。\n\n`Squid` 是 Falcot\
  \ 公司提供此服务所服务器软件名称。\n\n***\n\n## 4.2.16. Debian 软件包流行度调查 (Popularity Contest)\n\n\
  Debian 系统包含一个名为 `popularity-contest` 的软件包，其目的是编译软件包的使用统计数据。每周，该程序会收集已安装软件包和最近使用的软件包的信息，并匿名将这些信息发送到\
  \ Debian 项目服务器。然后，项目可以使用这些信息来确定每个软件包的相对重要性，这将影响分配给它们的优先级。特别是最“流行”的软件包将包含在安装 CD-ROM\
  \ 中，这将方便那些不想下载或购买整套软件包的用户获取。\n\n该软件包仅在需要时被激活，以尊重用户使用的机密性。\n\n## 4.2.17. 选择要安装的软件包\n\
  \n以下步骤允许你以非常宽泛的范围选择机器的用途；十个建议的任务对应于要安装的软件包列表。实际将安装的软件包将在稍后进行精调和完成，但它以一种简单的方式提供了一个良好的起点。\n\
  \n某些软件包还会根据检测到的硬件自动安装（得益于 `discover` 软件包中的 `discover-pkginstall` 程序）。\n\n图 4.13.\
  \ 任务选择![任务选择](img/inst-tasksel.png)\n\n## 4.2.18. 安装 GRUB 引导加载程序\n\n引导加载程序是 BIOS\
  \ 的第一个程序。该程序将 Linux 内核加载到内存中并执行。它通常提供一个菜单，允许用户选择加载的内核和/或启动的操作系统。\n\n***\n\n### 注意：引导加载程序与双系统启动\n\
  \nDebian 安装过程中的此阶段会检测已安装在计算机上的操作系统，并自动在启动菜单添加相应的条目，但并不是所有的安装程序都会这样做。\n\n特别是，如果你之后安装（或重新安装）Windows，引导加载程序将被擦除。Debian\
  \ 仍然留在硬盘上，但将无法从启动菜单访问（Windows 10 除外，它仍然可以通过 Windows 恢复控制台访问）。此时你将必须以 `rescue` 模式启动\
  \ Debian 安装系统，以设置一个不那么排他的引导加载程序。此操作在安装手册中有详细描述。\n\n→ [`www.debian.org/releases/stable/amd64/ch08s06`](https://www.debian.org/releases/stable/amd64/ch08s06)\n\
  \n***\n\n默认情况下，`GRUB` 提供的菜单包含所有已安装的 Linux 内核以及检测到的任何其他操作系统。这就是为什么你应该接受将其安装在主引导记录（MBR）中的建议。由于保留旧版本的内核可以在可以在最近安装的内核存在缺陷或不适应硬件时保留启动相同系统的能力，因此保留安装几个旧版本的内核通常是有意义的。\n\
  \n`GRUB` 是 Debian 安装的默认引导加载程序，得益于它的技术优越性：它与大多数文件系统兼容，因此在每次安装新内核后不需要更新，因为它在启动期间读取配置并找到新内核的确切位置。`GRUB`\
  \ 版本 1（现在被称为“Grub Legacy”）无法处理 LVM 和软件 RAID 的所有组合；默认安装的版本 2 则更加完整。在某些情况下，可能仍然建议安装\
  \ `LILO`（另一个引导加载程序）；安装程序会自动建议它。\n\n值得注意的是，`GRUB` 并不是单一的引导加载程序，它更是一个适用于不同情况的引导加载程序集合。由\
  \ `GRUB` 源码包构建的众多二进制包反映了这一点：`grub-efi-amd64` 用于 UEFI 模式下的 64 位 PC 启动，`grub-efi-ia32`\
  \ 用于 UEFI 模式下的 32 位 PC 启动，`grub-pc` 用于 BIOS 模式下的 PC 启动，`grub-uboot` 用于 ARM 计算机等。\n\
  \n有关配置 `GRUB` 的更多信息，请参阅第 8.8.3 节，“GRUB 2 配置”](#ch08s08.html_sect.config-grub \"\
  8.8.3. GRUB 2 Configuration\")。\n\n***\n\n### 文化：安全启动与 shim 引导加载程序\n\n安全启动（Secure\
  \ Boot）是一种确保你只运行由操作系统供应商验证软件的技术。为了完成工作，启动序列中的每个元素都会验证它将执行的下一个软件组件。在最深层次，UEFI 固件嵌入了微软提供的加密密钥以检查引导加载程序的签名，确保执行安全。由于由微软签名是一个漫长的过程，Debian\
  \ 决定不直接签名 `GRUB`，而是使用一个名为 `shim` 的中间加载程序，它几乎不需要更改，唯一作用是检查 Debian 提供的签名并执行 `GRUB`。在栈下游，`GRUB`\
  \ 会对内核进行类似的检查，内核可能会阻止某些更改系统完整性的操作。\n\nDebian 10 是第一个支持安全启动的发行版本。在此，需要在 BIOS 或 UEFI\
  \ 提供的系统设置界面禁用该功能。\n\n***\n\n## 4.2.19. 完成安装并重启\n\n安装已完成，程序提示你从光驱中移除 CD 并重启计算机。\n\
  \n# 4.3 首次启动后\n\n如果你激活了“Debian 桌面环境”任务但没有选择任何桌面（或选择了“GNOME”），计算机将显示 `gdm3` 登录管理器。\n\
  \n图 4.14. 首次启动![首次启动](img/inst-gdm.png)\n\n已创建的用户随后可以登录并工作。\n\n## 4.3.1. 安装额外软件\n\
  \n安装的软件包对应于安装时选择的配置，但不一定实际用途。因此，你可能希望使用软件包管理工具来精调已安装软件包的选择。两个常用的工具（如果选择了“Debian\
  \ 桌面环境”配置则会安装）是 `apt`（从命令行访问）和 `synaptic`（菜单中的“Synaptic 软件包管理器”）。\n\n为了方便安装协调的程序组，Debian\
  \ 创建了特定用途的“任务”（邮件服务器、文件服务器等）。你已经在安装期间有机会机会选择它们，并且由于软件包管理工具可以再次访问它们，例如 `aptitude`（任务列在独立章节中）和\
  \ `synaptic`（通过菜单 编辑 → 按任务标记软件包…）。\n\n\n\n\n\nAptitude 是 APT 在全屏文本模式下的一个界面。它允许用户根据各种类别（已安装或未安装的包、按任务、按章节等）浏览可用软件包列表，并查看每个包的所有可用信息（依赖关系、冲突、描述等）。每个软件包都可以被标记为“安装”（待安装，使用\
  \ `+` 键）或“移除”（待移除，使用 `-` 键）。一旦你通过 `g` 键（“g”代表“go!”）确认了这些操作，所有操作都将同时执行。如果你忘记了某些程序，不用担心；在初始安装完成后，你可以再次运行\
  \ `aptitude`。\n\n***\n\n**提示** *Debian* 考虑了非英语语言的使用者\n\n有几个任务专门用于将系统英语英语的其他语言本地化。这些任务包括翻译后的文档、字典以及其他对不同语言的使用者有用的各种软件包。如果在安装过程中选择了非英语语言，系统会自动选择相应的任务。\n\
  \n***\n\n当然，也可以不选择任何要安装的任务。在这种情况下，你可以使用 `apt` 或 `aptitude` 命令（两者都可以从命令行访问）手动安装所需的软件。\n\
  \n***\n\n**词汇** *软件包依赖关系、冲突\n\n在 Debian 软件包术语中，“依赖关系”（dependency）是指该包正常运行所需的另一个软件包。相反，“冲突”（conflict）是指无法与另一个包并存安装的包。\n\
  \n这些概念在第 5 章，*软件包系统：工具和基本原理*中有更详细的讨论。\n\n***\n\n## 4.3.2. 升级系统\n\n通常需要首次执行 `apt\
  \ upgrade`（一个用于自动更新已安装程序的命令），特别是对于自最新 Debian 稳定版发布以来可能发布的安全更新。这些更新可能会通过 `debconf`（Debian\
  \ 标准配置工具）涉及一些额外的问题。有关由 `apt` 执行的这些更新的更多信息，请参阅第 6.2.3 节，“系统升级”。\n\n# 第 5 章：软件包系统：工具和基本原理\n\
  \n作为一名 Debian 系统管理员，你将经常处理 `.deb` 软件包，因为它们包含了一致的功能单元（应用程序、文档等），这些单元便于单元的安装和维护。因此，了解它们是什么以及如何使用它们是一个好主意。\n\
  \n本章描述了“二进制”包和“源”包的结构和内容。前者是 `dpkg` 直接使用的文件，而后者包含源代码以及构建二进制包的指令。\n\n## 5.1. 二进制包的结构\n\
  \nDebian 软件包格式的设计使得其内容可以在任何具有经典命令 `ar`、`tar` 和 `xz`（有时是 `gzip` 或 `bzip2`）的 Unix\
  \ 系统上提取。这个看似微不足道的属性对于可移植性和灾难恢复至关重要。\n\n例如，假设你不小心删除了 `dpkg` 程序，导致你无法再安装 Debian 软件包。由于\
  \ `dpkg` 本身就是一个 Debian 软件包，你的系统似乎完蛋了……幸运的是，你知道软件包的格式，因此可以[下载](https://www.debian.org/distrib/packages#search_packages)\
  \ dpkg 软件包的 `.deb` 文件并手动安装（参见侧边栏 *TOOLS dpkg, APT and ar*）。如果由于某种不幸，一个或多个程序 `ar`、`tar`\
  \ 或 `gzip`/`xz`/`bzip2` 消失，你只需要从另一个系统拷贝缺失的程序（由于这些程序都是完全独立运行的，没有依赖关系，简单的拷贝即可）。如果你的系统遭遇了更糟糕的运气，甚至这些也不起作用（可能缺少了深层系统库？），你应该尝试\
  \ `busybox` 的静态版本（由 `busybox-static` 软件包提供），它更加自成一体，并提供了 `busybox ar`、`busybox tar`\
  \ 和 `busybox xz` 等子命令。\n\n*万一发生不幸，你最好也有系统的备份（参见第 9.10 节，“备份”）。*\n\n***\n\n**工具**\
  \ `dpkg`、`APT` 和 `ar`\n\n`dpkg` 是处理 `.deb` 文件（二进制包）的程序，特别是提取、分析和解包它们。\n\n`APT`（“Advanced\
  \ Packaging Tool”的缩写）是一组程序，允许对系统执行更高级别的修改：安装或删除软件包（同时保持依赖关系满足）、更新和升级系统、列出可用软件包等。\n\
  \n至于 `ar` 程序，它允许处理同名文件：`ar t *archive*` 显示归档中包含的文件列表，`ar x *archive*` 将文件从归档提取到当前工作目录，`ar\
  \ d *archive* *file* 从归档中删除文件等。它的 man 页面（`ar(1)`）记录了它所有其他功能。`ar` 是一个非常原始的工具，Unix\
  \ 管理员只会在偶尔使用，但管理员经常使用 `tar`，这是一种更进化的归档和文件管理工具。这就是为什么在删除后很容易恢复 `dpkg`。你只需要下载 Debian\
  \ 软件包并从系统中提取 `data.xz`：\n\n```bash\n# 在系统根目录（/）下\n# ar x dpkg_19.7.deb\n```\n\n\
  ***\n\n***\n\n***\n\n**回归基础**  帮助页符号\n\n对于初学者来说，在文献中找到“ar(1)”的引用可能会令人困惑。这种符号也用于区分由\
  \ `printf(1)` 指代的 `printf` 命令和 C 语言中的 `printf` 函数，后者可以称为 `printf(3)`。\n\nDebian\
  \ 第 7 章，*解决问题和相关信息* 详细讨论了帮助页（参见第 7.1.1 节，“帮助页”](#ch07.html_sect.manual-pages \"\
  7.1.1. 帮助页\")）。\n\n***\n\n查看 `.deb` 文件的内容：\n\n```bash\n$ ar t dpkg_19.7.amd4.deb\n\
  debian-binary control.tar.xz data.tar.xz\n$ ar x dpkg_19.7.amd4.deb\n$ ls\ncontrol.tar.xz\
  \ data.tar.xz debian-binary dpkg_19.7.amd4.deb\n$ tar tJf data.tar.xz | head -n\
  \ 16\n./ ./etc/ ./etc/alternatives/ ./etc/alternatives/README ./etc/cron.daily/\
  \ ./etc/cron.daily/dpkg ./etc/dpkg/ ./etc/dpkg/dpkg.cfg ./etc/dpkg/dpkg.cfg.d/ ./etc/logrotate.d/\
  \ ./etc/logrotate.d/alternatives ./etc/logrotate.d/dpkg ./sbin/ ./sbin/start-stop-daemon\
  \ ./usr/ ./usr/bin/\n$ tar tJf control.tar.xz\n./ ./conffiles ./control ./md5sums\
  \ ./postinst ./postrm\n$ cat debian-binary\n2.0\n```\n\n如所示，Debian 软件包的 `ar` 归档由三个文件组成：\n\
  \n`debian-binary`\n\n这是一个文本文件，仅指示 `.deb` 文件软件包格式的版本。在 Debian Buster 中版本为 2.0。\n\n\
  `control.tar.xz`\n\n该存档文件包含所有可用元数据，如软件包的名称和版本，以及一些运行的脚本。某些元数据允许包管理工具判断是否可以安装或卸载，例如根据已安装的软件包列表，以及发布的文件是否被本地修改过。\n\
  \n\n\n\n\n`data.tar.xz`, `data.tar.bz2`, `data.tar.gz`\n\n该归包包含从包中提取的所有文件；可执行文件、库、文档等都存储在此处。软件包可能会使用不同的压缩格式，在这种情况下，文件名将根据\
  \ `xz`、`bzip2` 或 `gzip` 进行命名。\n\n# 5.2. 软件包元信息 (Package Meta-Information)\n\nDebian\
  \ 软件包不仅是一个用于安装的文件归包。它还是更大整体的一部分，并描述了它与其他 Debian 软件包的关系（要求、依赖、冲突、建议）。它还提供了脚本，允许在软件包生命期的不同阶段（安装、升级、卸载）执行命令。这些数据由软件包管理工具使用，但不是软件包本身的一部分；在软件包内部，这些数据被称为“元信息”（关于其他信息的信息）。\n\
  \n## 5.2.1. 描述：`control` 文件\n\n该文件使用了类似于邮件头部的结构（如 RFC 2822 所定义），并在 Debian 策略以及 `deb-control(5)`\
  \ 和 `deb822(5)` 手页中进行了详细描述。\n\n→ [`www.debian.org/doc/debian-policy/ch-controlfields.html`](https://www.debian.org/doc/debian-policy/ch-controlfields.html)\n\
  \n例如，对于 `apt`，`control` 文件所示：\n\n```\napt-cache show apt\nPackage: apt Version:\
  \ 1.8.2 Installed-Size: 4064 Maintainer: APT Development Team <deity@lists.debian.org>\
  \ Architecture: amd64 Replaces: apt-transport-https (<< 1.5~alpha4~), apt-utils\
  \ (<< 1.3~exp2~) Provides: apt-transport-https (= 1.8.2) Depends: adduser, gpgv\
  \ | gpgv2 | gpgv1, debian-archive-keyring, libapt-pkg5.0 (>= 1.7.0~alpha3~), libc6\
  \ (>= 2.15), libgcc1 (>= 1:3.0), libgnutls30 (>= 3.6.6), libseccomp2 (>= 1.0.1),\
  \ libstdc++6 (>= 5.2) Recommends: ca-certificates Suggests: apt-doc, aptitude |\
  \ synaptic | wajig, dpkg-dev (>= 1.17.2), gnupg | gnupg2 | gnupg1, powermgmt-base\
  \ Breaks: apt-transport-https (<< 1.5~alpha4~), apt-utils (<< 1.3~exp2~), aptitude\
  \ (<< 0.8.10) Description-en: commandline package manager This package provides\
  \ commandline tools for searching and managing as well as querying information about\
  \ packages as a low-level access to all features of the libapt-pkg library. . These\
  \ include: apt-get 用于从受信任源获取软件包及其信息，以及安装、升级和移除软件包及其依赖项 * apt-cache 用于查询已安装和可安装软件包的可用信息\
  \ * apt-cdrom 用于将可移动介质作为软件包源 * apt-config 作为配置设置的接口 * apt-key 作为管理身份验证密钥的接口 Description-md5:\
  \ 9fb97a88cb7383934ef963352b53b4a7 Tag: admin::package-management, devel::lang:ruby,\
  \ hardware::storage, hardware::storage:cd, implemented-in::c++, implemented-in::perl,\
  \ implemented-in::ruby, interface::commandline, network::client, protocol::ftp,\
  \ protocol::http, protocol::ipv6, role::program, scope::application, scope::utility,\
  \ suite::debian, use::downloading, use::organizing, use::playing, use::searching,\
  \ works-with-format::html, works-with::audio, works-with::software:package, works-with::text\
  \ Section: admin Priority: required Filename: pool/main/a/apt/apt_1.8.2_amd64.deb\
  \ Size: 1418108 MD5sum: 0e80dedab6ec1e66a8f6c15f1925d2d3 SHA256: 80e9600822c4943106593ca5b0ec75d5aafa74c6130ba1071b013c42c507475ee\n\
  ```\n\n*返回基础* RFC — 互联网标准\n\n`RFC` 是“Request For Comments”（意见征询）的缩写。RFC 通常是描述将要成为互联网标准的的技术文档。在标准化和冻结之前，这些标准会提交进行公开审查（这也是其命名的由来）。`IETF`（互联网工程任务组）决定这些文档状态的演变（提议标准、草案标准或标准）。\n\
  \n`RFC 2026` 定义了互联网协议标准的流程。\n\n→ [`www.faqs.org/rfcs/rfc2026.html`](http://www.faqs.org/rfcs/rfc2026.html)\n\
  \n## 5.2.2. 描述：`control` 文件\n\n该文件使用了类似于邮件头部的结构（如 RFC 2822 所定义），并在 Debian 策略以及 `deb-control(5)`\
  \ 和 `deb822(5)` 手页中进行了详细描述。\n\n\n\n你应该始终安装“推荐的”（recommended）包，除非你确切知道不需要它们。这现在已是\
  \ `APT` 的默认行为，除非另有配置。相反，除非你知道为什么需要它们，否则没有必要安装“建议的”（suggested）包。`apt` 的行为可以通过使用 `APT::Install-Recommends`\
  \ 和 `APT::Install-Suggests` 配置选项，或相应的命令行选项 `--[no-]install-recommends` 和 `--[no-]install-suggests`\
  \ 来控制。\n\n`Enhances` 字段也描述了一种建议，但语境有所不同。它确实位于“被建议的包”中，而不是位于从该建议中获益的包中。它的意义在于，可以在不修改相关包的情况下添加建议。因此，一个程序的所有附加组件、插件和其他扩展都可能出现在与该软件相关的建议列表中。尽管这个最后一个字段已经存在多年，但像\
  \ `apt` 或 `synaptic` 等程序在很大程度上仍然忽略了它。它的目的是让 `Enhances` 字段提供的建议除了传统的建议（在 `Suggests`\
  \ 字段中找到）之外，也能显示给用户。\n\n***\n\n### 5.2.1.2. 冲突：`Conflicts` 字段\n\n`Conflicts` 字段表示一个包何时不能与其他包同时安装。最常见的原因是两个包包含相同名称和路径的文件，或者在相同的\
  \ TCP 端口上提供相同的服务，或者会干扰彼此的操作。\n\n如果一个包触发了与已安装包的冲突，`dpkg` 将拒绝安装该包，除非新包指定它将“替换”（replace）已安装的包，在这种情况下，`dpkg`\
  \ 将选择用新包替换旧包。`apt` 总是遵循你的指令：如果你选择安装一个新包，它会自动提议卸载产生问题的包。\n\n### 5.2.1.3. 不兼容：`Breaks`\
  \ 字段\n\n`Breaks` 字段的效果与 `Conflicts` 字段相似，但具有特殊的含义。它信号安装某个包将“破坏”（break）另一个包（或其特定版本）。通常，这两个包之间的这种不兼容性是暂时的，而\
  \ `Breaks` 关系特指不兼容的版本。\n\n`dpkg` 将拒绝安装破坏已安装包的包，而 `apt` 将尝试通过将会被破坏的包更新到新版本（假设该版本已修复，因此再次兼容）来解决问题。\n\
  \n这种情况可能发生在不具有向后兼容性的更新情况下：如果新版本不再与旧版本协同工作，并且在没有做特殊规定的情况下导致另一个程序发生故障。`Breaks` 字段防止用户遇到这些问题。\n\
  \n### 5.2.1.4. 提供项：`Provides` 字段\n\n该字段引入了非常有趣的“虚拟包”（virtual package）概念。它有许多作用，但其中两个尤为重要。第一个作用是使用虚拟包将通用服务与其关联（该包“提供”了该服务）。第二个作用表示一个包完全替换了另一个包，并且为了这个目的，它还可以满足另一个包本可以满足的依赖。因此，可以在不使用相同包名的情况下创建一个替换包。\n\
  \n***\n\n*词汇表* 元包（Meta-package）与虚拟包（virtual package）\n\n清楚地区分元包和虚拟包是至关重要的。前者是真实的包（包括真实的\
  \ `.deb` 文件），其唯一目的是表达依赖关系。\n\n然而，虚拟包在物理上并不存在；它们只是根据共同的、逻辑标准（提供的服务、与标准程序或预存包的兼容性等）识别真实包的手段。\n\
  \n***\n\n## 5.2.1.4.1. 提供“服务”\n\n让我们通过示例更详细地讨论第一种情况：所有的邮件服务器，如 `postfix` 或 `sendmail`都被认为“提供”\
  \ `mail-transport-agent` 虚拟包。因此，任何需要此服务才能运行的包（例如，邮件列表管理器，如 `smartlist` 或 `sympa`）只需在其依赖中声明它需要\
  \ `mail-transport-agent`，而不是指定一个庞大但不完整的可能解决方案列表（例如 `postfix | sendmail | exim4 |\
  \ …`）。此外，在同一台机器上安装两个邮件服务器是没用的，这就是为什么这些包中的每个包都声明与 `mail-transport-agent` 虚拟包冲突。系统会忽略包与其自身之间的冲突，但这种技术将禁止并排安装两个邮件服务器。\n\
  \n***\n\n*Debian 策略* 虚拟包列表\n\n为了让虚拟包有用，每个人必须对它们的名称达成共识。这就是为什么它们在 Debian 策略中被标准化的原因。该列表包括用于邮件服务器的\
  \ `mail-transport-agent`、用于 C 语言编译器的 `c-compiler`、用于 浏览器的 `www-browser`、用于 Web 服务器的\
  \ `httpd`、用于 FTP 服务器的 `ftp-server`、用于图形模式终端模拟器的 `x-terminal-emulator` (`xterm`)\
  \ 以及用于窗口管理器的 `x-window-manager`。\n\n可以在网上找到完整列表。\n\n→ [`www.debian.org/doc/packaging-manuals/virtual-package-names-list.txt`](http://www.debian.org/doc/packaging-manuals/virtual-package-names-list.txt)\n\
  \n***\n\n#### 5.2.1.4.2. 与另一个包的可交换性\n\n`Provides` 字段在一个包的内容包含在更大的包中也很有用。例如，`libdigest-md5-perl`\
  \ 模块在 Perl 5.6 中是一个可选模块，并在 Perl 5.8 中被集成。因此，`perl` 包从 5.8 版本开始声明 `Provides libdigest-md5-perl`，这样如果用户有\
  \ 5.8 或更高版本，依赖就会被满足。`libdigest-md5-perl` 包本身最终被删除了，因为当旧版本的 Perl 被移除后，它不再具有意义。\n\n\
  图 5.1 此功能非常有用，因为永远无法预测开发的变迁，并且需要对过时的软件进行重命名或其他替换。\n\n***\n\n*回归基础* Perl，一种编程语言\n\
  \nPerl（Practical Extraction and Report Language）是一种非常非常流行的编程语言。它有许多现成的模块，涵盖了广泛的应用，并由\
  \ `CPAN`（Comprehensive Perl Archive Network）服务器发布，这是一个详尽的 Perl 包网络。\n\n→ [`www.perl.org/`](https://www.perl.org/)\n\
  → [`www.cpan.org/`](https://www.cpan.org/)\n\n由于它是解释型语言，用 Perl 编写的程序在执行之前不需要编译。这就是为什么它们被称为“Perl\
  \ ”。\n\n***\n\n## 5.2.1.4.3. 过去的局限性\n\n虚拟包曾受到一些局限性的限制，最重要的是缺失版本号。回到之前的示例，像 `Depends:\
  \ libdigest-md5-perl (>= 1.6)` 这样的依赖，尽管存在 Perl 5.10，永远不会被软件包系统认为已满足——尽管事实上它很可能是满足的。由于这一点，软件包系统选择了风险最小的选项，假设版本不匹配。\n\
  \n这一局限性在 `dpkg 1.17.11` 中被取消，现在不再适用。包可以为其提供的虚拟包分配版本，例如使用 `Provides: libdigest-md5-perl\
  \ (= 1.8)`。\n\n### 5.2.1.5. 替换文件：`Replaces` 字段\n\n\n\n\n\n`Replaces` 字段表示该包包含了另一个包中也存在的文件，但该包有权合法替换这些文件。如果没有此指定，`dpkg`\
  \ 将失败，并提示它无法覆盖另一个包的文件（从技术上讲，可以使用 `--force-overwrite` 选项强制执行，但这不被认为是标准操作）。这有助于识别潜在问题，并要求维护者在决定是否添加此类字段之前对相关问题进行研究。\n\
  \n当包名更改或一个包被包含在另一个包中时，使用此字段是合理的。当维护者决定在从同一个源包生成的多个二进制包之间以不同的方式分发文件时也会发生这种情况：被替换的文件不再属于旧包，而只属于新包。\n\
  \n如果一个已安装包中的所有文件都已被替换，则该包被认为已从移除。最后，该字段还会促使 `dpkg` 在发生冲突时移除被替换的包。\n\n* * *\n\n###\
  \ 进阶 `Tag` 字段\n\n在上面的 apt 示例中，我们可以看到一个尚未描述过的字段，即 `Tag` 字段。该字段并不描述包与包之间的关系，而仅仅是在主题分类法中对包进行分类的一种。这种根据若干标准（接口类型、编程语言、应用领域等）对包进行的分类已经存在很久。尽管如此，并非所有包都有准确的标签，而且它尚未集成到所有的\
  \ Debian 工具中；`aptitude` 显示这些标签，并允许将其作为搜索准则。对于那些反感 `aptitude` 搜索准则的人，以下网站允许浏览标签数据库：\n\
  \n→ [`wiki.debian.org/Debtags`](https://wiki.debian.org/Debtags)\n\n* * *\n\n##\
  \ 5.2.2. 配置脚本\n\n除了 `control` 文件外，每个 Debian 包的 `control.tar.gz` 存档可能包含许多脚本，这些脚本由\
  \ `dpkg` 在处理包的不同阶段调用。Debian 策略（Debian Policy）详细描述了[可能的情况](https://www.debian.org/doc/debian-policy/ch-maintainerscripts.html)，规定了所调用的脚本以及它们接收的参数。这些序列可能是复杂的，因为如果其中一个脚本失败，`dpkg`\
  \ 将尝试通过取消正在进行的安装或移除（在可能的情况下）来返回满意的状态。\n\n* * *\n\n### 进阶 `dpkg` 数据库\n\n所有已安装包的配置脚本都存储在\
  \ `/var/lib/dpkg/info/` 目录下，形式为以包名为名前缀的文件。该目录还包含每个包的一个 `.list` 扩展文件，其中包含了该包的文件列表。\n\
  \n`/var/lib/dpkg/status` 文件包含了一系列数据块（格式类似于著名的邮件头，RFC 2822），描述了每个包的状态。已安装包的 `control`\
  \ 文件的信息也被复制到那里。\n\n* * *\n\n通常情况下，`preinst` 脚本在包安装之前执行，而 `postinst` 紧随其后执行。同样，`prerm`\
  \ 在移除包之前被调用，`postrm` 在之后被调用。包的更新等同于移除旧版本并安装新版本。这里无法详细描述所有可能的情况，但我们将讨论最常见的两种情况：安装/更新和移除。\n\
  \n* * *\n\n### 注意 脚本的符号名称\n\n本节描述的序列通过特定的特定名称调用配置脚本，例如 `old-prerm` 或 `new-postinst`。它们分别是包含在包的旧版本中（更新前安装）的\
  \ `prerm` 脚本，以及包含在新版本中（通过更新安装）的 `postinst` 脚本。\n\n* * *\n\n* * *\n\n### 提示 状态图\n\
  \nManoj Srivastava 和 Margarita Manterola 制作了以下图，解释 `dpkg` 如何调用配置脚本。\n\n→ [`people.debian.org/~srivasta/MaintainerScripts.html`](https://people.debian.org/~srivasta/MaintainerScripts.html)→\
  \ [`www.debian.org/doc/debian-policy/ap-flowcharts.html`](https://www.debian.org/doc/debian-policy/ap-flowcharts.html)\n\
  \n* * *\n\n## 5.2.2.1. 安装与升级\n\n安装（或更新）期间发生如下：\n\n1.  对于更新，`dpkg` 调用 `old-prerm\
  \ upgrade `new-version``。\n2.  同样对于更新，`dpkg` 随后执行 `new-preinst upgrade `old-version``；对于首次安装，它执行\
  \ `new-preinst install`。如果该包在此之前已安装并移除（但未彻底清除，因为保留了配置文件），则它可能会在最后一个参数中添加旧版本。\n3.\
  \  然后解压新包文件。如果文件已存在，则会被替换，但会临时创建一个备份副本。\n4.  对于更新，`dpkg` 执行 `old-postrm upgrade\
  \ `new-version``。\n5.  `dpkg` 更新所有内部数据（文件列表、配置脚本等）并移除被替换文件的备份。这是不可回头的点：`dpkg` 不再能够访问所有这些文件。\n\
  6.  `dpkg` 更新配置文件，在无法自动管理此任务时会询问用户做决定。关于此过程的细节请见第 5.2.3 节“校验和”。\n7.  最后，`dpkg` 通过执行\
  \ `new-postinst configure `last-version 来配置包。\n\n## 5.2.2.2. 包移除\n\n移除期间发生如下：\n\n\
  1.  `dpkg` 调用 `prerm remove`。\n2.  `dpkg` 移除包的所有文件，配置文件和配置脚本除外。\n3.  `dpkg` 执行 `postrm\
  \ remove`。除了 `postrm` 之外的所有配置脚本均被移除。如果用户没有使用“清除”选项，进程在此停止。\n4.  对于包的完全清除（使用命令 `dpkg\
  \ --purge` 或 `dpkg -P`），配置文件也被删除，以及若干副本（*.dpkg-tmp`, `*.dpkg-old`, `*.dpkg-new`）和临时文件；`dpkg`\
  \ 随后执行 `postrm purge`。\n\n* * *\n\n### 词汇 清除\n\n移除 Debian 包时，会保留配置文件以便重新安装。同样，守护产生的数据（例如\
  \ LDAP 服务器目录的内容或 SQL 数据库的内容）通常会被保留。\n\n要移除与包相关的所有数据，需要“清除”该包，命令为 `dpkg -P `package``、`apt-get\
  \ remove --purge `package`` 或 `aptitude purge `package``。\n\n考虑到此类数据删除决定性，不应轻率。\n\
  \n* * *\n\n上述四个脚本由 `config` 脚本补充，使用 `debconf` 的包通过它获取用户的配置信息。在安装期间，该脚本详细定义了 `debconf`\
  \ 提问的问题。响应被记录在 `debconf` 数据库中供以后参考。`apt` 通常在逐个安装包之前执行该脚本，以便将所有问题分组并在过程开始时向用户询问。安装前和安装后脚本就可以根据这些信息按照用户的意愿进行操作。\n\
  \n* * *\n\n### 工具 **debconf**\n\n\n\n\n\n`debconf` 的创建是为了解决 Debian 中一个反复出现的问题。以前，所有没有基本配置无法运行的\
  \ Debian 软件包通常会在 `postinst` shell 脚本（以及类似的脚本）中通过调用 `echo` 和 `read` 命令来提问。但这意味着在进行大型安装或更新期间，用户必须守在电脑旁，以回答随时可能出现的各种问题。得益于\
  \ `debconf` 工具，这些手动交互现在几乎被完全消除了。\n\n`debconf` 有许多许多的特性：它要求开发者指定用户交互；它允许对显示给用户的所有字符串进行本地化（所有翻译都存储在描述交互的\
  \ `templates` 文件中）；它具有不同的前端向用户显示问题（文本模式、图形模式、非交互模式）；而且它允许创建一个响应中心数据库，以便与多台计算机共享相同的配置……但最重要的一点是，现在可以在开始漫长的安装或更新过程之前，一次性向用户展示所有问题。用户可以去忙事情，而系统会自动处理安装，而无需守在屏幕前等待问题。\n\
  \n## 5.2.3. 校验和和配置文件列表\n\n除了前面的章节中已经提到的维护者脚本和控制数据外，Debian 软件包的 `control.tar.gz`\
  \ 存档可能包含其他有趣的文件。第一个文件 `md5sums` 包含了软件包所有文件的 MD5 校验和。它的主要优势是允许 `dpkg --verify`（我们将在第\
  \ 14.3.4.1 节，“使用 `dpkg --verify` 审计软件包”）和 `debsums`（来自同名软件包；参见第 14.3.4.2 节，“审计软件包：`debsums`\
  \ 及其局限性”）检查这些文件自安装以来是否被修改过。注意，当此文件不存在时，`dpkg` 将在安装时动态生成它（并像其他控制文件一样存储在 dpkg 数据库中）。\n\
  \n`conffiles` 列出了必须作为配置文件处理的软件包文件（另见 `deb-conffiles(5)`）。配置文件可以由管理员修改，`dpkg` 将尝试在软件包更新期间保留这些更改。\n\
  \n实际上，在这种情况下，`dpkg` 的行为表现得尽可能智能：如果标准配置文件在两个版本之间没有变化，它将什么都不做。然而，如果文件发生了变化，它将尝试更新该文件。可能有两种情况：要么管理员没有动过此配置文件，在这种情况下\
  \ `dpkg` 会自动安装新版本；要么文件被修改过，在这种情况下 `dpkg` 会询问管理员想要使用哪个版本（带有修改的旧版本，还是软件包提供的新版本）。为了帮助做出决策，`dpkg`\
  \ 提议显示一个两个版本之间差异的 `diff`。如果用户选择保留旧版本，新版本将存储在相同位置、并带有 `.dpkg-dist` 后缀的文件中。如果用户选择新版本，旧版本将保留在带有\
  \ `.dpkg-old` 后缀的文件中。另一个可用操作是暂时中断 `dpkg` 以编辑文件并尝试重新恢复相关的修改（之前通过 `diff` 识别出的）。\n\n\
  ### 进阶：避免配置文件提问\n\n`dpkg` 处理配置文件的更新，但在这样做时，它会定期中断工作以向管理员请求输入。这对于那些希望以非交互方式运行更新的人来说并不那么愉快。这就是为什么该程序提供了允许系统根据相同逻辑自动响应的选项：`--force-confold`\
  \ 保留文件的旧版本；`--force-confnew` 将使用文件的新版本（即使文件没有被管理员修改，这些选择也会被遵守，尽管这很少达到预期效果）。添加 `--force-confdef`\
  \ 选项告诉 `dpkg` 在可能的情况下自行决定（换句话，当原始配置文件未被动过时），仅在其他情况下使用 `--force-confnew` 或 `--force-confold`。\n\
  \n这些选项适用于 `dpkg`，并在 `dpkg(1)` 或 `dpkg --force-help` 中有详细解释，但大多数情况下管理员会直接使用 `aptitude`\
  \ 或 `apt` 程序工作。因此，有必要知道指示传递给 `dpkg` 命令的选项的语法（它们的命令行接口非常相似）。\n\n```\napt -o DPkg::options::=\"\
  --force-confdef\" -o DPkg::options::=\"--force-confold\" full-upgrade\n```\n\n这些选项可以直接存储在\
  \ `apt` 的配置中。要此操作，只需在 `/etc/apt/apt.conf.d/local` 文件中写入以下行即可：\n\n```\nDPkg::options\
  \ { \"--force-confdef\"; \"--force-confold\"; }\n```\n\n在配置文件中包含此选项意味着它也将用于如 `aptitude`\
  \ 这样的图形界面。\n\n### 进阶：强制 dpkg 询问配置问题\n\n`--force-confask` 选项要求 `dpkg` 显示关于配置文件的问题，即使在这些不需要的情况下也是如此。因此，使用此选项重新安装软件包时，`dpkg`\
  \ 将对被管理员修改或删除的所有配置文件再次提问。这非常方便，特别是当原始配置文件被删除且没有其他可用副本时：正常的重新安装将无法作用，因为 `dpkg` 将删除视为一种合法的修改，因此不会安装所需的配置文件。\n\
  \n# 5.3 源软件包的结构\n\n## 5.3.1. 格式\n\n源软件包通常由三个文件组成：`.dsc`、`.orig.tar.gz` 和 `.debian.tar.xz`。它们允许从编程语言编写的程序源码文件创建二进制软件包（上述的\
  \ `.deb` 文件）。\n\n`.dsc`（Debian 源控制）文件是一个短文本文件，包含一个 RFC 2822 头部（类似于第 5.2.1 节，“描述：`control`\
  \ 文件”），用于描述源软件包并指示哪些文件是其的一部分。它由维护者签名，从而保证了真实性。有关此主题的更多信息，请参阅第 6.6 节，“检查软件包的真实性”。\n\
  \n\n\n\n\n# 示例 5.1 一个 `.dsc` 文件\n\n```text\n-----BEGIN PGP SIGNED MESSAGE-----\n\
  Hash: SHA512\nFormat: 3.0 (quilt)\nSource: zim\nBinary: zim\nArchitecture: all\n\
  Version: 0.68-1\nMaintainer: Zim\nPackage Maintainers <zim@packages.debian.org>\n\
  Uploaders: Raphaël Hertzog <hertzog@debian.org>\nHomepage: http://zim-wiki.org\n\
  Standards-Version: 4.1.3\nVcs-Browser: https://salsa.debian.org/debian/zim\nVcs-Git:\
  \ https://salsa.debian.org/debian/zim.git\nBuild-Depends: debhelper (>= 11), xdg-utils,\
  \ python (>= 2.6.6-3~), libgtk2.0-0 (>= 2.6), python-gtk2, python-xdg, dh-python\n\
  Package-List: zim deb x11 optional arch=all\nChecksums-Sha1: a3b50aa8e44126cc7edd2c1912adf9820f50ad58\
  \ 2044224 zim_0.68.orig.tar.gz 4e13b37625789334da2d95b93e51e41ffd3b6b01 9300 zim_0.68-1.debian.tar.xz\n\
  Checksums-Sha256: d91518e010f6a6e951a75314138b5545a4c51151fc99f513aa7768a18858df15\
  \ 2044224 zim_0.68.orig.tar.gz 23f4ddc69af74509932acc3b5f0d4cd2af943016e4fd5740b9d98ec4d49fd8c2\
  \ 9300 zim_0.68-1.debian.tar.xz\nFiles: 336041a16687abb66fd9f604b98407e8 2044224\
  \ zim_0.68.orig.tar.gz 1714f67b35ab69e709849ad707206ca8 9300 zim_0.68-1.debian.tar.xz\n\
  -----BEGIN PGP SIGNATURE-----\nComment: Signed by Raphael Hertzog\niQEzBAEBCgAdFiEE1823g1EQnhJ1LsbSA4gdq+vCmrkFAlqyOxkACgkQA4gdq+vC\
  \ mrnCqAf/Ww9wg97VragtVhSFvehoVoJ0ZhoqNaSuCP/W1Fuf+P0YklzL2BlkVRXW X23c8Qs1v6VE2iRY3mEkdWwgBs1QwF0MX7H1jjQfPHCynGHKlH5dfo5fqLizgCeu\
  \ c9Pug3ZisjF90CgsseO7SVDqHVmO6QsfAaGWpHAw92HDz/xwjrS/4Ejntqjy0b+r Gmw2AZuBdhp+7C6p7In/Gg6DHPBLQGMLCKypoZKQdl+L0fWjjeykOzMIbjry2sRH\
  \ H0J4FLVGAGumh3zIZlm/t3ehGfP9Dg8FvzMaCNsf8OtYCSAEutrQEDBaskcTSIpq L0GQhKlViDuu8gzsqm7efPEhPcsF1A==\
  \ =6jGR\n-----END PGP SIGNATURE-----\n```\n\n注意，源码包的依赖（`Build-Depends`）与二进制包的依赖完全不同，因为它们指示了编译相关软件并构建其二进制包所需的工具。\n\
  \n## 警告：不同的命名空间\n\n这里需要注意的是，源码包的名称与它生成的二进制包名称之间没有强制性的对应关系。如果你知道每个源码包可以生成多个二进制包，这一点就很很好理解了。这就是为什么\
  \ `.dsc` 文件具有 `Source` 和 `Binary` 字段，用于显式命名源码包并存储其生成的二进制包列表。\n\n## 文化：为何拆分为多个包\n\
  \n经常情况下，一个源码包（针对特定软件）可以生成多个二进制包。这种划分的理由可以在不同的场景下使用（软件的）部分。考虑一个共享库，它可能被安装以使应用程序运行（例如\
  \ `libc6`），也可以被安装以开发新程序（此时 `libc6-dev` 将是正确的包）。在客户端/服务器服务中我们也发现了同样的逻辑，我们希望在某台机器上安装服务器部分，而在其他机器上安装客户端部分（例如\
  \ `openssh-server` 和 `openssh-client`）。\n\n同样，文档通常提供在一个专门的包中：用户可以独立于软件安装文档，并可以在随时选择删除它以节省磁盘空间。此外，这也节省了\
  \ Debian 镜像的磁盘空间，因为文档包也是。\n\n## 视角：不同的源码格式\n\n最初只有一种格式。从 Debian Squeeze 开始，Debian\
  \ 开发者可以选择新格式。`3.0 (quilt)` 是一种关联多个补丁的格式。如果归档是用 `xz` 压缩的，这种格式非常有用。源码包由开发者维护。`.tar.gz`\
  \ 是一个归集。\n\n## 工具：解压源码包\n\n如果你有一个源码包，可以使用 `dpkg-source` 来解压它：\n\n```bash\ndpkg-source\
  \ -x zim_0.68.dsc\n```\n\n这需要在 `/etc/apt/sources.list` 中存在相应的 `deb-src` 行，详情请参见“填充源列表”。\n\
  \n## 5.3.2 在 Debian 内部的使用\n\n源码包是 Debian 一的基础。所有的 Debian 包都来自源码包，每个 Debian 包的修改都是对源码包进行修改的结果。因此，当软件包的新版本（源码包和多个二进制包）到达\
  \ Debian 服务器时，源码包是最重要的。事实上，它将被用于 Debian 支持的各种架构的网络机器上进行编译。\n\n要获取最新的（可能尚未发布的）更新，请使用：\n\
  \n```bash\ngit clone https://salsa.debian.org/debian/zim\n```\n\n\n\n\n\n在 Debian\
  \ 10 Buster 发布后，发布团队` 宣布，不再接受针对 `main` 组件的维护者二进制包上传，该组件中的所有二进制软件包将通过通过强制性的仅源码上传进行自动构建。\n\
  \n***\n\n# 5.4. 使用 `dpkg` 操作软件包\n\n`dpkg` 是系统中处理 Debian 软件包的基础命令。如果你有 `.deb` 软件包，正是\
  \ `dpkg` 允许你对它们进行安装或分析其内容。但该程序对 Debian 宇宙的了解只是局部：它知道系统上安装了什么，以及你在命令行中传递给它的任何内容，但它对其他可用的软件包一无所知。因此，如果未满足依赖关系，它将执行失败。相反，`apt`\
  \ 和 `aptitude` 等工具会创建一个依赖列表，以尽可能自动地安装所有内容。\n\n***\n\n注意 使用 `dpkg` 还是 `apt`？\n\n\
  `dpkg`应该被视为一个系统工具（后端），而 `apt` 则是一个更接近用户的工具，它克服了前者的局限性。这些工具共同工作，每个都有其特殊之处，适用于特定的任务。\n\
  \n***\n\n## 5.4.1. 安装软件包\n\n`dpkg` 主要是用于安装已有的 Debian 软件包的工具（因为它不下载任何内容）。要实现这一点，我们使用它的\
  \ `-i` 或 `--install` 选项。\n\n示例 5.2. 使用 dpkg 安装软件包\n```\n# dpkg -i man-db_2.8.5-2_amd64.deb\n\
  (读取数据库 ... 当前已安装 14913 个文件和目录。)准备解压 .../man-db_2.8.5-2_amd64.deb ... 正在解压 man-db\
  \ (2.8.5-2) 到 (2.8.5-2) ... 正在设置 man-db (2.8.5-2) ... 更新手册数据库 ... 处理 mime-support\
  \ (3.62) 的触发器 ...\n```\n\n我们可以看到 `dpkg` 执行的各个步骤；因此，我们知道任何错误可能发生在哪个点。安装也可以分两个阶段进行：首先解压，然后是配置。`apt`\
  \ 利用了这一点，限制了对 `dpkg` 的调用次数（因为每次调用都是昂贵的，由于需要在内存中加载数据库，特别是已安装文件的列表）。\n\n示例 5.3. 分离解压和配置\n\
  ```\n# dpkg --unpack man-db_2.8.5-2_amd64.deb\n(读取数据库 ... 当前已安装 14937 个文件和目录。)准备解压\
  \ man-db_2.8.5-2_amd64.deb ... 正在解压 man-db (2.8.5-2) 到 (2.8.5-2) ... 处理 mime-support\
  \ (3.62) 的触发器 ... \n# dpkg --configure man-db\n正在设置 man-db (2.8.5-2) ... 更新手册数据库\
  \ ...\n```\n\n有时 `dpkg` 将无法安装某个软件包并返回错误；如果用户命令它忽略此错误，它只会发出警告；这就是为什么我们有不同的 `--force-*`\
  \ 选项的原因。`dpkg --force-help` 命令或该命令的文档将提供这些选项的完整列表。你迟早会遇到的最常见错误是文件冲突。当一个软件包包含一个已被另一个软件包安装的文件时，`dpkg`\
  \ 将拒绝安装它。随后会出现以下消息：\n\n```\nUnpacking libgdm (from .../libgdm_3.8.3-2_amd64.deb)\
  \ ... dpkg: error processing /var/cache/apt/archives/libgdm_3.8.3-2_amd64.deb (--unpack):\
  \ trying to overwrite '/usr/bin/gdmflexiserver', which is also in package gdm3 3.4.1-9\n\
  ```\n\n在这种情况下，如果你认为替换此文件对你系统的稳定性没有重大风险（通常情况下如此），你可以使用 `--force-overwrite` 选项，它会告诉\
  \ `dpkg` 忽略此错误并覆盖文件。\n\n虽然有很多可用的 `--force-*` 选项，但只有 `--force-overwrite` 可能会被经常使用。这些选项仅存在于特殊情况，最好尽可能离开它们，以遵守打包机制实施的规则。不要忘记，这些规则确保了你系统的一致性和稳定性。\n\
  \n***\n\n警告 有效使用 `--force-*`\n\n如果你不小心，使用 `--force-*` 选项可能会导致 APT 家族命令拒绝工作。实际上，这些选项中的某些允许在未满足依赖关系或存在冲突时安装软件包。结果是从依赖关系角度来看系统是不一致的，且\
  \ APT 命令将拒绝执行任何除将系统恢复到一致状态以外的操作（这通常包括安装缺失的依赖项或删除有问题的软件包）。这通常会导致像下面这样的消息，该消息是在忽略其对较新版本\
  \ libc6 的依赖的情况下，安装新版本的 rdesktop 后获得的：\n\n```\n# apt full-upgrade\n[...] 你可能想要运行\
  \ 'apt-get -f install' 来修复这些问题。以下软件包具有未满足的依赖关系：rdesktop: Depends: libc6 (>= 2.5)\
  \ 但 2.3.6.ds1-17 已安装。\n```\n\n一个确信自己分析正确的勇敢管理员可能会选择忽略依赖或冲突并使用相应的 `--force-*` 选项。在这种情况下，如果他们想继续使用\
  \ `apt` 或 `aptitude`，他们必须编辑 `/var/lib/dpkg/status` 来删除/修改他们选择覆盖的依赖或冲突。\n\n这种操作是一种拙劣的权宜，除非在极端需要的情况下，否则不应使用。通常，更合适的解决方案是重新编译引起问题的软件包（参见第\
  \ 15 节 从源码重新构建软件包）或从仓库使用可能修复的新版本（参见第 6.1.2.4 节 稳定回源）。\n\n***\n\n## 5.4.2. 移除软件包\n\
  \n带有 `-r` 或 `--remove` 选项的软件包名移除该软件包。然而，这种移除并不完全：所有的配置文件、维护脚本、日志文件（系统日志）以及由软件包处理的其他用户数据都会保留。这样，卸载程序就很简单，并且仍然可以重新安装具有相同的配置。要完全删除与软件包相关的所有内容，使用\
  \ `-P` 或 `--purge` 选项，后接软件包名。\n\n示例 5.4. 移除并清理 debian-cd 软件包\n```\n# dpkg -r debian-cd\n\
  (读取数据库 ... 当前已安装 15915 个文件和目录。)正在移除 debian-cd (3.1.25) ...\n# dpkg -P debian-cd\n\
  (读取数据库 ... 当前已安装 15394 个文件和目录。)正在清理 debian-cd (3.1.25) 的配置文件 ...\n```\n\n## 5.4.3.\
  \ 查询 dpkg 数据库和检查 .deb 文件\n\n***\n\n*回到基础* 选项语法\n\n大多数选项都有“长”版本（一个或多个相关的单词，前面带有双连字符）和“短”版本（单个字母，通常是长版本中某个单词的首字母，前面带有单连字符）。这种惯例如此常见，以至于成为\
  \ POSIX 标准。\n\n\n\n\n\n在结束本节之前，我们将学习通过查询内部数据库来获取 `dpkg` 选项。我们先列出长选项，然后是对应的短选项（它们显然接受相同的参数），我们介绍了：`--listfiles`\
  \ `package`（或 `-L`），列出由该软件包安装的文件；`--search` `file`（或 `-S`），查找包含该文件的软件包；`--status`\
  \ `package`（或 `-s`），显示已安装软件包的头部信息；`--list`（或 `-l`），显示系统已知的软件包列表及其安装状态；`--contents`\
  \ `file.deb`（或 `-c`），列出指定的 Debian 软件包中的文件；`--info` `file.deb`（或 `-I`），显示该 Debian\
  \ 软件包的头部信息。\n\n* * *\n\n### **注意** `dpkg --search` 与合并后的 `/usr` \n\n由于[各种原因](https://www.freedesktop.org/wiki/Software/systemd/TheCaseForTheUsrMerge/)，Debian\
  \ 现在默认将一些顶级目录安装为指向 `/usr` 下对应目录的符号链接。例如，`/bin`、`/sbin` 和 `/lib` 现在分别是指向 `/usr/bin`、`/usr/sbin`\
  \ 和 `/usr/lib` 的符号链接。\n\n虽然这带来了便利，但也可能成为困惑的来源。例如，当你查询 `dpkg` 哪个软件包拥有某个文件时，只有在你请求其原始路径时，它才能回答：\n\
  \n```bash\n`dpkg --search /bin/mount` mount: /bin/mount\n`dpkg --search /usr/bin/mount`\
  \ dpkg-query: no path found matching pattern /usr/bin/mount\n`dpkg --search /bin/apt`\
  \ dpkg-query: no path found matching pattern /bin/apt\n`dpkg --search /usr/bin/apt`\
  \ apt: /usr/bin/apt\n```\n\n* * *\n\n### 示例 5.5 使用 dpkg 的各种查询\n\n```bash\n`dpkg\
  \ -L base-passwd`\n/. /usr /usr/sbin /usr/sbin/update-passwd /usr/share /usr/share/base-passwd\
  \ /usr/share/base-passwd/group.master /usr/share/base-passwd/passwd.master /usr/share/doc\
