  \ Address         State PID/Program\ntcp        0      0 0.0.0.0:22            \
  \  0.0.0.0:*               LISTEN   -\ntcp        0      0 0.0.0.0:443         \
  \    0.0.0.0:*               LISTEN   -\ntcp        0      0 127.0.0.1:80      \
  \      0.0.0.0:*               LISTEN   sshd\ntcp       10      0 192.168.0.128:54321\
  \   203.0.113.5:443        ESTABLISHED 1234\n```\n\n## 10.9.2. 远程诊断：nmap\n\n`nmap`（在同名包中）在某种意义上是\
  \ `netstat` 的远程对应物。它可以扫描一个或多个远程服务器的一组“常用端口”，并列出发现响应传入连接的端口。该工具的对应点是，由于它是远程运行的，因此无法提供进程或用户信息；然而，它可以同时操作多个目标。\n\
  \n典型的 `nmap` 调用仅使用 `-A` 选项（以便 `nmap` 尝试识别发现的服务器软件版本），后跟一个或多个 IP 地址或 DNS 主机。同样，还有更多选项可以精细控制\
  \ `nmap` 的行为；请参阅 `nmap(1)` 手页中的文档。\n\n\n\n\n\n```\nnmap mirtuel\nStarting Nmap 7.70\
  \ ( https://nmap.org ) at 2019-06-30 21:05 CET Nmap scan report for mirtuel (192.168.1.242)\
  \ Host is up (0.000013s latency). rDNS record for 192.168.1.242: mirtuel.internal.placard.fr.eu.org\
  \ Not shown: 998 closed ports PORT STATE SERVICE 22/tcp open ssh 111/tcp open rpcbind\
  \ Nmap done: 1 IP address (1 host up) scanned in 2.41 seconds \n```\n\n```\nnmap\
  \ -A localhost\nStarting Nmap 7.70 ( https://nmap.org ) at 2019-06-30 21:17 CEST\
  \ Nmap scan report for localhost (127.0.0.1) Host is up (0.000039s latency). Other\
  \ addresses for localhost (not scanned): ::1 Not shown: 997 closed ports PORT STATE\
  \ SERVICE VERSION 22/tcp open ssh OpenSSH 7.9p1 Debian 10 (protocol 2.0) | ssh-hostkey:\
  \ | 2048 33:a1:d8:b1:e5:5b:b2:0d:15:1b:8e:76:7f:e4:d7:3d (RSA) | 256 8f:83:cf:fa:b3:58:54:9a:1d:1b:4c:db:b1:e2:58:76\
  \ (ECDSA) |_ 256 fa:3d:58:62:49:92:93:90:52:fe:f4:26:ca:dc:4c:40 (ED25519) 25/tcp\
  \ open smtp Exim smtpd 4.92 | smtp-commands: mirtuel Hello localhost [127.0.0.1],\
  \ SIZE 52428800, 8BITMIME, PIPELINING, CHUNKING, PRDR, HELP, |_ Commands supported:\
  \ AUTH HELO EHLO MAIL RCPT DATA BDAT NOOP QUIT RSET HELP 631/tcp open ipp CUPS 2.2\
  \ | http-methods: |_ Potentially risky methods: PUT | http-robots.txt: 1 disallowed\
  \ entry |_/ |_http-server-header: CUPS/2.2 IPP/2.1 |_http-title: Home - CUPS 2.2.10\
  \ Device type: general purpose Running: Linux 3.X OS CPE: cpe:/o:linux:linux_kernel:3\
  \ OS details: Linux 3.7 - 3.10 Network Distance: 0 hops Service Info: Host: debian;\
  \ OS: Linux; CPE: cpe:/o:linux:linux_kernel OS and Service detection performed.\
  \ Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1\
  \ IP address (1 host up) scanned in 12.33 seconds\n```\n\n如预期的那样，SSH 和 Exim4 应用被列出了。注意，并非所有应用都监听在所有\
  \ IP 地址上；由于 Exim4 仅在 `lo` 回环接口上可用，因此它只在分析 `localhost` 时才会出现，而在扫描 `mirtuel`（它映射到同一机器上的\
  \ `eth0` 接口）时不会出现。\n\n## 10.9.3 嗅探器：`tcpdump` 和 `wireshark`\n\n有时，人们需要查看线缆上实际发生了什么，逐个数据包地。这些情况需要“帧分析器”，即广为人知的*嗅探器*（sniffer）。这类工具会观察到达给定网络接口的所有数据包，并以用户易操作的方式显示它们。\n\
  \n该领域历史悠久的工具是 `tcpdump`，它作为许多平台的标准工具可用。它允许捕获各种网络流量，但这些流量的表示方式相当晦涩。因此，我们不再对其进行详细详细描述。\n\
  \n一个较新（且更现代）的工具 `wireshark`（在 `wireshark` 包中）已成为网络流量分析的新基准，因为它拥有许多解码模块，允许对捕获的数据包进行简化分析。数据包以图形化的方式显示，并基于协议层进行组织。这允许用户可视化数据包中涉及的所有协议。例如，给定一个包含\
  \ HTTP 请求的数据包，`wireshark` 会分别显示有关物理层、以太网层、IP 数据包信息、TCP 连接参数以及最后是 HTTP 请求本身的信息。\n\
  \n图 10.1. wireshark 网络流量分析器![wireshark 网络流量分析器](img/wireshark.png)\n\n在我们的示例中，通过\
  \ SSH 传输的数据包被过滤掉了（使用 `!tcp.port == 22` 过滤器）。当前显示的数据包是在 SSHv2 协议的传输层开发的。\n\n*提示*\
  \ 使用无图形界面的 `wireshark`：`tshark`\n\n当人们无法运行图形界面，或者出于某种原因不想运行时，`wireshark` 的纯文本版本也存在，名为\
  \ `tshark`（在独立的 `tshark` 包中）。大多数捕获和解码功能仍然可用，但缺乏图形界面不可避免地限制了与程序的交互（在捕获后过滤数据包、对特定数据包的跟踪）。\n\
  \n## 11 网络服务：Postfix, Apache, NFS, Samba, LDAP, XMPP, TURN\n\n网络服务是用户直接交互的程序。它们是冰山一角，本章将关注它们所依赖的基础。\n\
  \n### 11.1 邮件服务器\n\n管理员选择了 Postfix 作为邮件服务器，由于其可靠性和易于配置。事实上，它的设计强制每个任务都以最小的所需权限集运行，这是一项极好的安全措施。\n\
  \n*备选方案*（ALTERNATIVE）Exim4 服务器\n\nDebian 使用 Exim4 作为默认邮件服务器（这就是为什么初始安装包含了 Exim4）。配置由单独的包\
  \ `exim4-config` 提供，并根据一组与 postfix 软件包相似的问题进行自动定制。\n\n配置既可以在单个文件 `/etc/exim4/exim4.conf.template`\
  \ 中，也可以分布在 `/etc/exim4/conf.d/` 下的多个配置片段中。无论哪种情况，文件都被 `update-exim4.conf` 作为模板生成\
  \ `/var/lib/exim4/config.autogenerated`。后者是 Exim4 使用的文件。这种机制，通过 Exim debconf 配置获得的值——存储在\
  \ `/etc/exim4/update-exim4.conf.conf` 中——可以注入 Exim 的配置文件，即使管理员或其他软件包更改了默认的 Exim\
  \ 配置。\n\nExim4 配置文件的语法有其特殊性和学习曲线；然而，一旦理解了这些特殊性，Exim4 是一个非常完整且强大的邮件服务器，正如几十页文档所证明的那样。\n\
  \n[`www.exim.org/docs.html`](https://www.exim.org/docs.html)\n\n#### 11.1.1 安装 Postfix\n\
  \n`postfix` 包包含主 SMTP 守护进程。其他包（如 `postfix-ldap` 和 `postfix-pgsql`）为 Postfix 添加额外功能，包括访问映射数据库。只有在你确定需要它们时才安装它们。\n\
  \n*回归基础*（BACK TO BASICS）SMTP\n\nSMTP（简单邮件传输协议，RFC 5321）是邮件服务器用于交换和路由电子邮件的协议。\n\n\
  在安装软件包时，会询问几个 Debconf 问题。答案允许生成第一个版本的 `/etc/postfix/main.cf` 配置文件。\n\n\n\n\n\n第一个问题涉及设置类型。对于连接互联网的服务器，建议的答案中只有两个是相关的：“互联网站点”（Internet\
  \ site）和“带智能主机的互联网”（Internet with smarthost）。前者适用于接收入站邮件并直接向收件者发送发送邮件的服务器，因此非常适合\
  \ Falcot Corp 的情况。后者适用于正常接收入站邮件但通过中间 SMTP 服务器（即“智能主机”）而不是直接向收件者服务器发送发送邮件的服务器。这对于具有动态\
  \ IP 地址的个人特别有用，因为许多邮件服务器会拒绝直接来自此类 IP 地址的邮件。在这种情况下，智能主机通常是 ISP 的 SMTP 服务器，它始终被配置为接受来自该\
  \ ISP 客户的邮件并进行适当转发。这种设置（带有智能主机）也适用于未永久连接到互联网的服务器，因为它可以避免管理一个需要稍后重试的无法投递邮件队列。\n\n\
  ### 词汇 ISP\n\n`ISP` 是“互联网服务提供商”（Internet Service Provider）的缩写。它涵盖了一个（通常是商业公司）提供互联网连接和相关基础服务（电子邮件、新闻等）的实体。\n\
  \n第二个问题涉及机器的全名，用于从本地用户名生成电子邮件地址；机器的全名最终将作为“”符号（@）之后的部分。在 Falcot 案例中，答案应该是 `mail.falcot.com`。这是默认唯一询问的问题，但它引导的配置对于\
  \ Falcot 的需求来说并不完整，这就是为什么管理员运行 `dpkg-reconfigure postfix` 以便自定义更多参数。\n\n额外问题之一要求提供与此机器相关的所有域名。默认列表包含了它的全名以及\
  \ `localhost` 的几个同义词，但需要手动添加主 `falcot.com` 域名。更通俗地说，这个问题通常应该回答该机器应作为 MX 服务器提供服务的所有域名；换句话说，即\
  \ DNS 指明该机器将接受邮件的所有域名。这些信息最终存储在 Postfix 主配置文件 —— `/etc/postfix/main.cf` 的 `mydestination`\
  \ 变量中。\n\n图 11.1. 发送邮件时 DNS `MX` 记录的作用！发送邮件时 DNS MX 记录的作用\n\n### 额外 查询 MX 记录（MX\
  \ records）\n\n当 DNS 中没有某个域名的 MX 记录时，邮件服务器将尝试通过匹配的 A 记录（IPv6 中为 AAAA）将邮件发送到主机本身。\n\
  \n在某些情况下，安装程序还会询问允许哪些网络通过该机器发送邮件。在默认配置下，Postfix 仅接受来自机器自身的邮件；通常会添加本地网络。Falcot Corp\
  \ 的管理员在默认答案中添加了 `192.168.0.0/16`。如果没有询问此问题，配置文件中的相关变量是 `mynetworks`，如下例所示。\n\n本地邮件也可以通过\
  \ `procmail` 投递。该工具允许用户根据存储在 `~/.procmailrc` 文件中的规则对入站邮件。Postfix 和 Exim4 默认都建议 procmail，但也有\
  \ maildrop 或 Sieve 过滤器等替代方案。\n\n完成第一步后，管理员获得了以下配置文件；它将作为在后续章节中添加额外功能的起点。\n\n示例 11.1.\
  \ 初始 `/etc/postfix/main.cf` 文件\n```bash\n# 查看 /usr/share/postfix/main.cf.dist 获取带注释的更完整的版本\
  \ # Debian 特有：指定文件名将导致该文件的第一个 # 行被用作名称。Debian 默认是 /etc/mailname。\n#myorigin = /etc/mailname\n\
  smtpd_banner = $myhostname ESMTP $mail_name (Debian/GNU)\nbiff = no # 附加 .domain\
  \ 是 MUA 的工作。\nappend_dot_mydomain = no # 取消下一行的注释生成“延迟邮件”警告\n#delay_warning_time\
  \ = 4h\nreadme_directory = no # 查看 http://www.postfix.org/COMPATIBILITY_README.html\
  \ -- 在新安装时默认为 2。\ncompatibility_level = 2 # TLS 参数\nsmtpd_tls_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem\n\
  smtpd_tls_key_file=/etc/ssl/private/ssl-cert-snakeoil.key\nsmtpd_use_tls=yes\nsmtpd_tls_session_cache_database\
  \ = btree:${data_directory}/smtpd_scache\nsmtp_tls_session_cache_database = btree:${data_directory}/smtp_scache\n\
  # 查看 postfix-doc 包中的 /usr/share/doc/postfix/TLS_README.gz 以获取\n# 在 smtp 客户端中启用 SSL\
  \ 的信息。\nsmtpd_relay_restrictions = permit_mynetworks permit_sasl_authenticated defer_unauth_destination\n\
  myhostname = mail.falcot.com\nalias_maps = hash:/etc/aliases\nalias_database = hash:/etc/aliases\n\
  myorigin = /etc/mailname\nmydestination = mail.falcot.com, falcot.com, localhost.localdomain,\
  \ localhost\nrelayhost =\nmynworks = 127.0.0.0/8 [::ffff:127.0.0.0]/104 [::1]/128\
  \ 192.168.0.0/16\nmailbox_size_limit = 0\nrecipient_delimiter = +\ninet_interfaces\
  \ = all\ninet_protocols = all\n```\n\n### 安全 蛇油 SSL 证书\n\n`snake oil` 证书就像旧时代江湖郎医兜卖的“蛇油”药一样，没有任何价值：你不能依靠它们来验证服务器，因为它们是自动生成的自签名证书。然而，它们对于提高通信的隐私性很有用。\n\
  \n通常，它们仅应用于测试目的，正常服务必须使用真实证书。Let's encrypt 项目提供了免费且受信任的 SSL/TLS 证书，可以使用 `certbot`\
  \ 包生成，如第 11.2.2 节，“添加对 SSL 的支持”所示，并如下所示在 `postfix` 中：\n\n```\nsmtpd_tls_cert_file\
  \ = /etc/letsencrypt/live/*`DOMAIN`*/fullchain.pem\nsmtpd_tls_key_file = /etc/letsencrypt/live/*`DOMAIN`*/privkey.pem\n\
  smtpd_tls_CAfile = /etc/ssl/certs/ca-certificates.crt\nsmtpd_tls_CApath = /etc/ssl/certs\n\
  smtp_tls_CApath = /etc/ssl/certs\n```\n\n生成自有证书的另一种方法在第 10.2.2 节，“公密钥基础设施：*easy-rsa*”\
  \ 中描述。\n\n## 11.1.2 配置虚拟域名\n\n邮件服务器可以接收发往主域名之外其他域的邮件；这些被称为虚拟域名。在大多数发生这种情况的情况下，邮件最终并不是投递给本地用户的。Postfix\
  \ 提供了两种处理虚拟领域的有趣功能。\n\n### 注意 虚拟域名和规范域名\n\n任何虚拟域名都不应在 `mydestination` 变量中引用；该变量仅包含与机器及其本地用户直接关联的“规范”域名。\n\
  \n### 11.1.2.1 虚拟别名域名\n\n虚拟别名域名只包含别名，即仅将邮件转发到其他地址的地址。\n\n通过在 `virtual_alias_domains`\
  \ 变量中添加其名称，并并在 `virtual_alias_maps` 变量中引用地址映射文件，可以启用此类域名。\n\n```\nvirtual_alias_domains\
  \ = falcotsbrand.com\nvirtual_alias_maps = hash:/etc/postfix/virtual\n```\n\n`/etc/postfix/virtual`\
  \ 文件以相当直观的语法描述映射：每行包含两个由空格分隔的字段；第一个字段是别名名称，第二个字段是重定向到的邮件地址列表。特殊的 `@domain.com` 语法涵盖了域名下的所有剩余别名。\n\
  \n\n\n\n\nwebmaster@falcotsbrand.com jean@falcot.com contact@falcotsbrand.com laure@falcot.com,\
  \ sophie@falcot.com\n\n# 下方的别名是通用的，涵盖了 falcotsbrand.com 域名内所有未被此文件涵盖的地址。这些地址会将邮件转发到\
  \ falcot.com 域名中相同的用户名。@falcotsbrand.com @falcot.com\n\n修改 `/etc/postfix/virtual`\
  \ 后，需要使用 `sudo postmap /etc/postfix/virtual` 更新 postfix 映射 `/etc/postfix/virtual.db`。\n\
  \n## 11.1.2. 虚拟邮箱域 (Virtual Mailbox Domains)\n\n**注意 组合虚拟域**\nPostfix 不允许在 `virtual_alias_domains`\
  \ 和 `virtual_mailbox_domains` 中同时使用同一个域名。然而，`virtual_mailbox_domains` 中的每一个域名都隐式地包含在\
  \ `virtual_alias_domains` 中，这使得在虚拟域内混合使用别名和邮箱成为可能。\n\n* *\n\n收发至虚拟邮箱的邮件存储在未分配给本地系统用户的邮箱中。\n\
  \n启用虚拟邮箱需要在此 `virtual_mailbox_domains` 变量中命名该域，并在 `virtual_mailbox_maps` 中引用邮箱映射。`virtual_mailbox_base`\
  \ 参数包含存储邮箱的目录。\n\n```\nvirtual_mailbox_domains = falcot.org\nvirtual_mailbox_maps\
  \ = hash:/etc/postfix/virtual\nvirtual_mailbox_base = /var/mail\n```\n\n`virtual_uid_maps`\
  \ 参数（对应为 `virtual_gid_maps`）引用一个包含电子邮件地址与“拥有”相应邮箱的系统用户（或组）之间映射的文件。要获取所有属于同一个所有者/组的邮箱，可以使用\
  \ `static:5000` 语法分配一个固定的 UID/GID（在此处值为 5000）。\n\n再次，`virtual` 文件的语法非常直观：两个由空格分隔的字段。第一个字段是虚拟域之一内的电子邮件地址，第二个字段是关联邮箱的位置（相对于\
  \ `virtual_mailbox_base` 中指定的目录）。\n\n如果邮箱名称以斜杠（`/`）结尾，邮件将以 `maildir` 格式存储；否则将使用传统的\
  \ `mbox` 格式。`maildir` 格式使用整个目录来存储邮箱，每条单独的消息存储在单独的文件中。而在 `mbox` 格式中，整个邮箱存储在一个文件中，每个以\
  \ `From`（后跟一个空格）开头的行表示一条新消息的开始。Jean 的邮件以 `maildir` 格式存储，在专用目录内存储一个文件：jean@falcot.org\
  \ falcot.org/jean/。Sophie 的邮件存储在传统的 \"mbox\" 文件中，所有邮件合并到一个文件中：sophie@cot.org falcot.org/sophie\n\
  \n## 11.1.3 接收和发送的限制\n\n日益增多的未经请求的批量邮件（垃圾邮件）要求在决定服务器应该接受哪些邮件时必须变得越发严格。本节介绍了 Postfix\
  \ 中包含的一些策略。如果拒绝规则（reject-rules）过于严格，可能会导致即使是合法的流量也会被拦截。因此，良好的习惯是在测试限制条件时，使用 `soft_bounce\
  \ = yes` 指令来防止在此期间永久性拒绝请求。通过在拒绝类型指令之前添加 `warn_if_reject`，只会记录日志消息，而不会拒绝请求。\n\n*\
  \ *\n\n文化 垃圾邮件问题\n“垃圾邮件”是一个通用术语，用于指代所有充斥我们邮箱箱的未经请求的商业邮件（也称为 UCE）；发送这些邮件的无良之被称为垃圾邮件发送者。他们很少关心自己所造成的骚扰，因为发送电子邮件的成本很低，而且只需要极小比例的接收者被垃圾邮件操作所吸引，其收益就能超过成本。该过程大部分是自动化的，任何公开的电子邮件地址（例如，在网络论坛、邮件列表存档或博客等上）都可能被垃圾邮件发送者的机器人发现，并遭受无完没了的未经请求邮件流。所有系统管理员都试图用垃圾邮件过滤器来应对这种骚扰，但垃圾邮件发送者会不断调整以绕过这些过滤器。有些人甚至租用被各种犯罪集团入侵的机器网络。最近的统计估计，互联网上流通的所有邮件中，高达\
  \ 95% 是垃圾邮件！\n\n* *\n\n### 11.1.3.1 基于 IP 的访问限制\n\n`smtpd_client_restrictions` 指令控制哪些机器允许与邮件服务器通信。当变量包含规则列表时（如下例所示），这些规则按从第一个到最后一个顺序进行评估。每条规则都可以接受消息、拒绝消息或将决策交给后续的规则。因此，顺序很重要，简单地交换两条规则可能会导致截然不同的行为。\n\
  \n示例：\n```\nsmtpd_client_restrictions = permit_mynetworks, warn_if_reject reject_unknown_client_hostname,\
  \ check_client_access hash:/etc/postfix/access_clientip, reject_rhsbl_reverse_client\
  \ dbl.spamhaus.org, reject_rhsbl_reverse_client rhsbl.sorbs.net, reject_rbl_client\
  \ zen.spamhaus.org, reject_rbl_client dnsbl.sorbs.net\n```\n\n作为第一条规则使用的 `permit_mynetworks`\
  \ 指令接受所有来自本地网络（由 `mynetworks` 配置变量定义）的机器的邮件。\n\n第二个指令通常会拒绝来自没有完全有效 DNS 配置的机器的邮件。这种有效配置意味着\
  \ IP 地址可以解析为名称，且该名称反过来解析为该 IP 地址。这种限制通常过于严格，因为许多邮件服务器没有 IP 地址的反向 DNS。这解释了为什么 Falcot\
  \ 的管理员在 `reject_unknown_client` 指令之前添加了 `warn_if_reject` 修饰：该修饰将拒绝变为记录在日志中的简单警告。管理员随后可以监控如果实际执行该规则将被拒绝的消息数量，并在希望启用此类执行时做出明智的决策。\n\
  \n* *\n\n提示 访问表\n限制标准包括管理员可修改的表，列出了发送者、IP 地址以及允许或禁止的主机名。这些表可以使用 postfix-doc 软件包提供的\
  \ `/usr/share/doc/postfix/examples/access.gz` 文件的解压副本来创建。这种模型在其注释中自成文档，这意味着每个表都有自己的语法。\n\
  \n`/etc/postfix/access_clientip` 表列出 IP 地址和网络；`/etc/postfix/access_helo` 列出域名；`/etc/postfix/access_sender`\
  \ 包含发送者电子邮件地址。每次更改后，所有这些文件都需要转换为哈希表（一种针对快速访问优化的格式），使用 `sudo postmap /etc/postfix/file`\
  \ 命令。\n\n* *\n\n第三条指令允许管理员为邮件服务器设置黑白白名单，存储在 `/etc/postfix/access_clientip` 文件中。白名单中的服务器被认为是可信的，因此来自那里的邮件不会经过后续的过滤规则。\n\
  \n\n\n\n最后四条规则拒绝任何来自指定黑名单列表服务器的消息。`<acronym class=\"acronym\">RBL</acronym>` 是 `Remote\
  \ Black List`（远程黑列表）的缩写，`<acronym class=\"acronym\">RHSBL</acronym>` 代表 `Right-Hand\
  \ Side Black List`（右黑列表）。区别在于，前者列出 IP 地址，而后者列出域名。此类服务有很多。它们列出了声誉不良的域名和 IP 地址、垃圾邮件发送者用于转发邮件的配置错误的服务器，以及意外的邮件中继（例如感染蠕虫或病毒的机器）。\n\
  \n***\n\n**提示** 白名单与 RBL\n\n黑名单有时会包含发生过事故的合法服务器。在这种情况下，来自这些服务器之一的所有邮件都会被拒绝，除非该服务器列在由\
  \ `/etc/postfix/access_clientip` 定义的白列表中。因此，谨慎起见的做法是在白列表中包含所有通常接收大量邮件的信任服务器。\n\n\
  ***\n\n### 11.1.3.2. 检查 `EHLO` 或 `HELO` 命令的有效性\n\n每个 SMTP 交换都从一个 `HELO`（或 `EHLO`）命令开始，随后是发送邮件服务器的名称。检查此名称的有效性很有意义。为了完全执行\
  \ `smtpd_helo_restrictions` 中列出的限制，需要启用 `smtpd_helo_required` 选项。否则，客户端可以通过不发送任何\
  \ `HELO`/`EHLO` 命令来跳过限制。\n\n示例 11.3 `EHLO` 中声明名称的限制\n\n```\nsmtpd_helo_required\
  \ = yes\nsmtpd_helo_restrictions = permit_mynetworks, reject_invalid_helo_hostname,\
  \ reject_non_fqdn_helo_hostname, warn_if_reject reject_unknown_helo_hostname, check_helo_access\
  \ hash:/etc/postfix/access_helo, reject_rhsbl_helo multi.surbl.org\n```\n\n第一个 `permit_mynetworks`\
  \ 指令允许本地网络上的所有机器自由地介绍自己。这非常重要，因为某些邮件程序没有充分遵守 SMTP 协议的这部分，它们可能会使用毫无意义的名字介绍自己。\n\n\
  `reject_invalid_helo_hostname` 规则在 `EHLO` 声明列出语法上不正确的主机时拒绝邮件。`reject_non_fqdn_helo_hostname`\
  \ 规则在声明的主机不是完全限定域名名（包括域名和主机名）时拒绝消息。`reject_unknown_helo_hostname` 规则在声明的在 DNS 中不存在时拒绝消息。由于最后这条规则不幸导致了过多的拒绝，管理员们通过\
  \ `warn_if_reject` 修饰符将其效果变为简单的警告，作为第一步；他们可能会在审计此规则的结果后，在后续阶段决定移除此修饰符。\n\n`reject_rhsbl_helo`\
  \ 允许指定一个黑列表，以相对于 RHSBL 对主机进行检查。\n\n将 `permit_mynetworks` 作为第一条规则有一个有趣的副作用：后续规则仅适用于本地网络之外的主机。这允许对所有声明为\
  \ `falcot.com` 网络的主机进行黑名单，例如通过将 `falcot.com` 网络添加到 `/etc/postfix/access_helo` 中。\n\
  \n### 11.1.3.3. 根据发送者接受或拒绝\n\n将 `permit_mynetworks` 作为第一条规则有一个有趣的副作用：后续规则仅适用于本地网络之外的主机。这允许对所有声明为\
  \ `falcot.com` 网络的主机进行黑名单，例如通过将 `falcot.com` 网络添加到 `/etc/postfix/access_helo` 中。\n\
  \n示例 11.4 发送者的限制\n\n```\nsmtpd_sender_restrictions = permit_mynetworks, reject_unlisted_sender,\
  \ reject_non_fqdn_sender, reject_rhsbl_sender hash:/etc/postfix/access_helo\n```\n\
  \n### 11.1.3.4. 根据收件者接受或拒绝\n\n将 `permit_mynetworks` 作为第一条规则有一个有趣的副作用：后续规则仅适用于本地网络之外的主机。这允许对所有声明为\
  \ `falcot.com` 网络的主机进行黑名单，例如通过将 `falcot.com` 网络添加到 `/etc/postfix/access_helo` 中。\n\
  \n示例 11.5 收件者的限制\n\n```\nsmtpd_recipient_restrictions = permit_mynetworks, reject_unlisted_recipient,\
  \ reject_non_fqdn_recipient, reject_rhsbl_recipient hash:/etc/postfix/access_helo\n\
  ```\n\n### 11.1.3.5. 与 `DATA` 命令相关的限制\n\nSMTP 的 `DATA` 命令在消息内容之前发出。它本身并不提供任何信息，只是宣布接下来将出现的内容。它仍然可以接受检查。\n\
  \n示例 11.6 `DATA` 限制\n\n```\nsmtpd_data_restrictions = reject_unauth_pipining\n```\n\
  \n### 11.1.3.6. 应用限制\n\n尽管上述命令在 SMTP 交换的各个阶段验证了信息，但 Postfix 默认作为 `RCPT TO` 命令的回复发送实际的拒绝。\n\
  \n### 11.1.3.7. 基于内容的过滤\n\n如果没有对消息内容应用检查的方法，验证和限制系统将是不完整的。Postfix 区分了适用于邮件头的检查和适用于邮件正文的检查。\n\
  \n\n\n\n# 示例 11.7. 启用基于内容的过滤器\n\n```\nheader_checks = regexp:/etc/postfix/header_checks\
  \ body_checks = regexp:/etc/postfix/body_checks\n```\n\n这两个文件都包含一个正则表达式列表（通常称为 `regexps`\
  \ 或 `regexes`）以及当邮件头部（或正文）匹配这些表达式时触发的关联操作。\n\n* * *\n\n### 快速查看 表达式表\n\n文件 `/usr/share/doc/postfix/examples/header_checks.gz`（来自\
  \ `postfix-doc` 包）和 `header_checks(5)` 包含许多解释性注释，可以作为创建 `/etc/postfix/header_checks`\
  \ 和 `/etc/postfix/body_checks` 文件的起点。\n\n* * *\n\n# 示例 11.8. `/etc/postfix/header_checks`\
  \ 文件示例\n\n```\n/^X-Mailer: GOTO Sarbacane/ RE I fight spam (GOTO Sarbacane) /^Subject:\
  \ *Your email contains VIRUSES/ DISCARD virus notification\n```\n\n* * *\n\n###\
  \ 回归基础 正则表达式\n\n`regular expression`（术语缩写为 `regexp` 或 `regex`）指的是一种通用表示法，用于描述字符字符串的内容和/或结构。某些特殊字符允许定义备选项（例如，`foo|bar`\
  \ 匹配“foo”或“bar”）、允许字符集（例如，`[0-9]` 意味着“任何数字”，而 `.` — 点 — 意味着“任何字符”）、量化（`s?` 匹配 `s`\
  \ 或空字符串，换之出现出现 0 次或 1 次 `s`；`s+` 匹配一个或多个连续的 `s` 字符；此类推）。括号允许对搜索结果进行分组。\n\n这些表达式的精确语法随使用它们的工具而异，但基本特征是相似的。\n\
  \n→ [`en.wikipedia.org/wiki/Regular_expression`](https://en.wikipedia.org/wiki/Regular_expression)\n\
  \n* * *\n\n第一个表达式检查提到邮件软件的头部；如果发现 `GOTO Sarbacane`（一种批量邮件软件），则拒绝该邮件。第二个表达式控制邮件主题；如果提到病毒通知，我们可以决定不拒绝邮件，而是直接将其丢弃。\n\
  \n使用这些过滤器是一把双刃剑，因为很容易使规则变得过于通用，从而导致丢失合法邮件。在这些情况下，不仅邮件会丢失，发送者还会收到不必要的（且令人讨厌的）错误信息。\n\
  \n## 11.1.4. 设置灰白列表（Greylisting）\n\n“灰白列表”是一种过滤技术，根据该技术，邮件最初会被一个临时错误代码拒绝，仅在延迟后的再次尝试时被接受。这种过滤对于受蠕虫和病毒感染的机器发送的垃圾邮件特别有效，因为这些软件很少作为完整的\
  \ SMTP 代理（通过检查错误代码并在稍后重试失败的邮件），特别是许多采集到的地址实际上是无效的，重试只会浪费时间。\n\nPostfix 原生不提供灰白列表，但有一项功能可以将接受或拒绝给定邮件的决定委托给外部程序。`postgrey`\
  \ 包包含了这样一个程序，设计用于与这种访问策略委托服务接口。\n\n一旦安装了 `postgrey`，它将作为守护进程运行并监听端口 `10023`。随后可以通过通过添加\
  \ `check_policy_service` 参数作为额外限制来配置 Postfix 使用它：\n\n```\nsmtpd_recipient_restrictions\
  \ = permit_mynetworks, [...] check_policy_service inet:127.0.0.1:10023\n```\n\n\
  每当 Postfix 执行规则集中的此规则时，它都会连接到 `postgrey` 守护进程并向其发送有关相关邮件的信息。`postgrey` 端会考虑 IP 地址/发送者/接收者三元组，并在数据库中检查最近是否见过相同的三元组。如果是，`postgrey`\
  \ 回复应该接受邮件；如果不是，回复指示临时拒绝邮件，并将三元组记录在数据库中。\n\n灰白列表的主要缺点是合法邮件会被延迟，这并不总是可以接受的。它还增加了发送大量合法邮件服务器的负担。\n\
  \n* * *\n\n### 实践 灰白列表的缺点\n\n理论上，灰白列表应该只延迟特定发送者向特定接收者发送的第一封邮件，典型的延迟在分钟级。然而，现实情况可能略有不同。某些大型\
  \ ISP 使用 SMTP 服务器集群，当邮件最初被拒绝时，重试传输的服务器可能不是初始的同一个。当这种情况发生时，第二个服务器也会因为灰白列表收到临时错误消息，依此类推；可能需要几个小时后，已经参与过的服务器才会尝试传输，因为\
  \ SMTP 服务器通常会在每次失败后增加重试之间的延迟。\n\n结果是即使对于同一个发送者，入站 IP 地址也可能随时间变化。不仅如此，甚至发送者地址也会变化。例如，许多邮件列表服务器在发送者地址中编码额外信息，以便处理错误邮件（称为\
  \ `bounces`）。发送到邮件列表的每条新邮件可能都需要经过灰白列表，这意味着它必须被（临时）存储在发送者的服务器上。对于非常大的邮件列表（拥有数万订阅者），这很快就会变成问题。\n\
  \n为了缓解这些缺点，`postgrey` 管理了此类站点的白名单，来自这些站点的邮件将立即接受，无需经过灰白列表。此列表可以很容易适应本地需求，因为它存储在\
  \ `/etc/postgrey/whitelist_clients` 文件中。\n\n* * *\n\n### 进阶 使用 milter-greylist 进行选择性灰白列表\n\
  \n通过仅对那些被认为是可能的垃圾邮件源的子客户端使用灰白列表（因为它们被列在 DNS 黑名单中），可以缓解灰白列表的缺点。这在 `postgrey` 中无法实现，但可以这样使用\
  \ `milter-greylist`。\n\n在这种情况下，由于 DNS 黑名单从不触发确定性的拒绝，使用激进的黑名单是合理的，包括列出 ISP 客户端所有动态\
  \ IP 地址的列表（如 `pbl.spamhaus.org` 或 `dul.dnsbl.sorbs.net`）。\n\n由于 `milter-greylist`\
  \ 使用 Sendmail 的 milter 接口，其 postfix 端的配置限于“`smtpd_milters = unix:/var/run/milter-greylist/milter-greylist.sock`”。`greylist.conf(5)`\
  \ 手页文档了 `/etc/milter-greylist/greylist.conf` 以及配置 `milter-greylist` 的许多方法。你还需要编辑\
  \ `/etc/default/milter-greylist` 来实际启用该服务。\n\n* * *\n\n## 11.1.5. 根据接收者自定义过滤器\n\n\
  \ 11.1.3 节，“接收和发送的限制` 和 第 11.1.4 节，“设置灰白列表”` 回顾了许多可能的限制。它们在限制接收垃圾邮件的数量方面都有其用处，但它们都有自己的缺点。因此，根据接收者自定义过滤器集已变得越来越常见。在\
  \ Falcot Corp，灰白列表对大多数用户来说很有趣，但它阻碍了一些需要邮件低延迟的用户的工作（例如技术支持服务）。同样，商业服务在接收来自某些亚洲提供商的邮件时有时会出现问题，这些提供商可能被列入黑名单；该服务要求一个未经过滤的地址以便通信。\n\
  \nPostfix 通过“限制类”概念提供了这种过滤器自定义。这些类在 `smtpd_restriction_classes` 参数中声明，定义方式与 `smtpd_recipient_restrictions`\
  \ 相同。`check_recipient_access` 指令则定义了一个将给定接收者映射到相应限制集的表。\n\n\n\n\n\n## 示例 11.9. 在\
  \ `main.cf` 中定义限制类\n\n```\nsmtpd_restriction_classes = greylisting, aggressive,\
  \ permissive\ngreylisting = check_policy_service inet:127.0.0.1:10023\naggressive\
  \ = reject_rbl_client sbl-xbl.spamhaus.org, check_policy_service inet:127.0.0.1:10023\n\
  permissive = permit\nsmtpd_recipient_restrictions = permit_mynetworks, reject_unauth_destination,\
  \ check_recipient_access hash:/etc/postfix/recipient_access\n```\n\n## 示例 11.10.\
  \ `/etc/postfix/recipient_access` 文件\n\n```text\n# 未过滤的地址\npostmaster@falcot.com\
  \ permissive\nsupport@falcot.com permissive\nsales-asia@falcot.com permissive\n\n\
  # 对某些特权用户的严格过滤\njoe@falcot.com aggressive\n\n# 邮件列表管理器的特殊规则\nsympa@falcot.com reject_unverified_sender\n\
  \n# 默认启用灰名单\nfalcot.com greylisting\n```\n\n## 11.1.6. 集成反病毒软件\n\n作为邮件附件流传的许多病毒使得在公司网络入口处设置反病毒软件变得至关重要，因为尽管进行了意识宣传，某些用户仍然会打开来自明显可疑邮件的附件。\n\
  \n**安全 关于反病毒软件的争议性讨论**\n\n病毒扫描器（或所谓的反病毒软件）的使用具有争议。在某些恶意软件发布与向反病毒数据库添加检测规则之间，通常存在一个间隔。在这个间隔期内，没有基于软件的保护。此外，使用通常需要运行额外的软件，例如解压缩压缩包并扫描各种可执行文件，这极大地增加了反病毒软件本身的被利用风险。因此，使用此类解决方案永远无法取代意识宣传和简单的行为规则（如永远不要打开未请求的发送邮件附件等）。\n\
  \nFalcot 的管理员选择了 `clamav` 作为他们的免费反病毒软件。主包是 `clamav`，但他们还安装了一些额外的包，如 `arj`、`unzoo`、`unrar`\
  \ 和 `lha`，因为反病毒软件需要这些包来分析以这些格式之一存档的附件。\n\n反病毒软件与邮件服务器之间的接口任务由 `clamav-milter` 完成。`milter`（mail\
  \ filter 的缩写）是一种专门设计用于与邮件服务器建立接口的过滤程序。milter 使用标准的应用程序编程接口（API），提供了比邮件服务器外部过滤器更好的性能。Milters\
  \ 最初由 `Sendmail` 引入，但 `Postfix` 很快也效仿了。\n\n**快速查看用于 Spamassassin 的 milter**\n\n\
  `spamassassin-milter` 包提供了一个基于 `SpamAssassin` 的垃圾邮件过滤器 milter。它可以根据 `SpamAssassin`\
  \ 将邮件标记为可能的垃圾邮件（通过添加头部），或者在超过阈值时完全拒绝。一旦安装了 `clamav` 软件包，milter 应该在 TCP 端口而不是命名套接上运行。这可以通过\
  \ `127.0.0.1` 实现。\n\n**注意 TCP TCP 命名套接**\n\n使用真实的 TCP 端口而不是命名套接的原因是，守护进程通常需要以 root\
  \ 权限访问命名套接。\n\nFalcot 的管理员选择了 `clamav` 作为他们的免费反病毒软件。主包是 `clamav`，但他们还安装了一些额外的包，如\
  \ `arj`、`unzoo`、`unrar` 和 `lha`，因为反病毒软件需要这些包来分析以这些格式之一存档的附件。\n\n反病毒软件与邮件服务器之间的接口任务由\
  \ `clamav-milter` 完成。`milter`（mail filter 的缩写）是一种专门设计用于与邮件服务器建立接口的过滤程序。milter 使用标准的应用程序编程接口（API），提供了比邮件服务器外部过滤器更好的性能。Milters\
  \ 最初由 `Sendmail` 引入，但 `Postfix` 很快也效仿了。\n\n**快速查看用于 Spamassassin 的 milter**\n\n\
  `spamassassin-milter` 包提供了一个基于 `SpamAssassin` 的垃圾邮件过滤器 milter。它可以根据 `SpamAssassin`\
  \ 将邮件标记为可能的垃圾邮件（通过添加头部），或者在超过阈值时完全拒绝。一旦安装了 `clamav` 软件包，milter 应该在 TCP 端口而不是命名套接上运行。这可以通过\
  \ `127.0.0.1` 实现。\n\n**注意 TCP TCP 命名套接**\n\n使用真实的 TCP 端口而不是命名套接接的原因是，守护进程通常需要以 root\
  \ 权限访问命名套接。\n\nFalcot 的管理员选择了 `clamav` 作为他们的免费反病毒软件。主包是 `clamav`，但他们还安装了一些额外的包，如\
  \ `arj`、`unzoo`、`unrar` 和 `lha`，因为反病毒软件需要这些包来分析以这些格式之一存档的附件。\n\n反病毒软件与邮件服务器之间的接口任务由\
  \ `clamav-milter` 完成。`milter`（mail filter 的缩写）是一种专门设计用于与邮件服务器建立接口的过滤程序。milter 使用标准的应用程序编程接口（API），提供了比邮件服务器外部过滤器更好的性能。Milters\
  \ 最初由 `Sendmail` 引入，但 `Postfix` 很快也效仿了。\n\n### \n\n### 11.1.7. 使用 SPF、DKIM 和 DMARC\
  \ 对抗垃圾邮件\n\n大量的未请求邮件导致了多项标准的创建，这些标准旨在验证发送主机是否经过授权以及邮件是否未被篡改。这些标准主要通过 DNS 配置。\n\n\
  **警告 争议性讨论**\n\n与任何其他工具一样，这些标准具有局限性并产生实际影响。有些人认为这些标准从设计上是有缺陷的。请自行决定并谨慎对待如何应用这些标准。\n\
  \n#### 11.1.7.1 集成发送者策略框架 (SPF)\n\n发送者策略框架 (`SPF`) 用于验证特定的邮件服务器是否允许为给定域名发送邮件。它主要通过\
  \ DNS 配置。条目的语法在以下详细说明：\n\n→ [http://www.opensspf.org/SPF_Syntax]\n→ [https://tools.ietf.org/html/rfc7208]\n\
  → [https://en.wikipedia.org/wiki/Sender_Policy_Framework]\n\n以下是一个示例 DNS 条目，表示该域名的所有邮件交换记录（MX-RR）都允许发送当前邮件，其他所有都被禁止。DNS\
  \ 条目不需要命名。但要使用 `include` 指令，它必须有一个。\n\n名称：`example.org` 类型：`TXT` TTL：`3600` 数据：`v=spf1\
  \ a mx -all`\n\n让我们快速查看 `falcot.org` 条目。\n\n```bash\n# host -t TXT falcot.org\n\
  falcot.org descriptive text \"v=spf1 ip4:199.127.61.96 +a +mx +ip4:206.221.184.234\
  \ +ip4:209.222.96.251 ~all\"\n```\n\n**在实践 测试反病毒软件**\n\n一旦设置了反病毒软件，应该对其进行测试。最简单的方法是发送包含以下内容的邮件，这通常会导致邮件被标记（添加头部）：\n\
  \n→ [https://2016.eicar.org]\n\n这并不是真正的病毒，而是通过 Postfix 处理的。\n\n\n\n\n配置是在 `/etc/postfix-policyd-spf-python/policyd-spf.conf`\
  \ 文件完成的，该文件在 `policyd-spf.conf(5)` 和 `/usr/share/doc/postfix-policyd-spf-python/policyd-spf.conf.commented.gz`中有完整文档。主要的配置参数是\
  \ `HELO_reject` 和 `Mail_From_reject`，它们用于配置检查失败时是拒绝邮件（`Fail`）还是在添加头后接受邮件（`False`）。当消息由垃圾过滤器进一步处理时，后者通常有用。\n\
  \n如果结果打算供 opendmarc 使用，则 `Header_Type` 必须设置为 `AR`。\n\n注意，spamassassin 包含一个检查 SPF\
  \ 记录的插件。\n\n### 集成域名密钥 (DKIM) 签名与验证\n\n域名密钥识别邮件 (DKIM) 标准是一种发送者身份验证系统。邮件传输代理（在此处为\
  \ `postfix`）在向外邮件的头中添加一个与域名相关的数字签名。接收方可以通过从发送者的 DNS 记录中获取公钥并校验签名，来验证邮件正文和头部字段。\n\
  \n→ [`dkim.org/`](http://dkim.org/)\n\n必要的工具随 `opendkim` 和 `opendkim-tools` 软件包发布。\n\
  \n***\n\n**注意** 邮件列表软件与 DKIM\n\n邮件列表管理器通常会重写某些邮件头，导致 DKIM 签名无效。即使使用 `relaxed` 规范化也不总是能防止这种情况发生。因此，管理员必须密切关注邮件服务器日志文件以识别此类问题。否则，这些邮件可能会被标记为垃圾邮件并被拒绝。\n\
  \n***\n\n首先必须使用命令 `opendkim-genkey -s SELECTOR -d DOMAIN` 创建私钥。`SELECTOR` 必须是密钥的唯一名称。如果你计划轮密钥，它可以简单的\
  \ \"mail\" 或创建日期。\n\n示例 11.11，为 falcot.com 的签名邮件创建一个私钥：\n```bash\nopendkim-genkey\
  \ -s mail -d falcot.com -D /etc/dkimkeys\nchown opendkim.opendkim /etc/dkimkeys/mail.*\n\
  ```\n\n这将创建文件 `/etc/dkimkeys/mail.private` 和 `/etc/dkimkeys/mail.txt` 并设置相应的所有权。第一个文件包含私钥，后者包含需要添加到\
  \ DNS 的公钥：\n\nName: mail._domainkey Type: TXT TTL: 3600 Data: \"v=DKIM1; h=sha256;\
  \ k=rsa; s=email; p=[...]\"\n\nDebian 中的 `opendkim` 包默认密钥大小为 2048 位。遗憾的是，某些 DNS\
  \ 服务器只能处理最大长度为 255 个字符的文本记录，而所选的默认密钥大小超过了这个限制。在这种情况下，使用选项 `-b 1024` 选择较小的密钥大小。如果\
  \ `opendkim-testkey` 成功，则条目已成功设置。该条目的语法在此处解释：\n\n→ [`tools.ietf.org/html/rfc6376`](https://tools.ietf.org/html/rfc6376)\
  \ → [`en.wikipedia.org/wiki/DKIM`](https://en.wikipedia.org/wiki/DKIM)\n\n要配置 opendkim，必须在\
  \ `/etc/default/opendkim` 中选择 `SOCKET` 和 `RUNDIR`。请注意，`SOCKET` 必须在 `postfix` 的 chroot\
  \ 环境可访问。进一步配置在 `/etc/opendkim.conf` 中完成。以下是一个配置片段，它确保 `Domain` \"falcot.com\" 和所有子域名\
  \ (`SubDomain`）都由 `Selector` \"mail\" 和单个私钥 (`KeyFile`) `/etc/dkimkeys/mail.private`\
  \ 签名。头部和正文的 \"relaxed\" `Canonicalization` 允许轻微修改（例如通过邮件列表软件）。过滤器在签名 (\"s\") 和验证\
  \ (\"v\") `Mode` 下均运行。如果签名验证失败（`On-BadSignature`），则邮件应被隔离 (\"q\")）。\n\n```\n[...]\
  \ Domain falcot.com KeyFile /etc/dkimkeys/mail.private Selector mail [...] Canonicalization\
  \ relaxed/relaxed Mode sv On-BadSignature q SubDomains yes [...] Socket inet:12345@localhost\
  \ [...] UserID opendkim\n```\n\n还可以使用多个选择器/密钥（`KeyTable`）、域名（`SigningTable`）并指定内部或信任主机（`InternalHosts`、`ExternalIgnoreList`），它们可以在没有凭据的情况下通过服务器作为签名域名之一发送邮件。\n\
  \n`/etc/postfix/main.cf` 中的以下指令使 `postfix` 使用过滤器：\n\n```conf\nmilter_default_action\
  \ = accept\nnon_smtpd_milters = inet:localhost:12345\nsmtpd_milters = inet:localhost:12345\n\
  ```\n\n\n\n\n发送电子邮件需要能够访问 SMTP 服务器；它也要求该 SMTP 服务器通过它来发送电子邮件。对于漫游用户，这可能需要经常更改 SMTP\
  \ 客户端的配置，因为 Falcot 的 SMTP 服务器会拒绝来自显然不属于公司 IP 地址的邮件。有两种解决方案：要么漫游用户在自己的计算机上安装 SMTP\
  \ 服务器，要么通过某种员工身份验证手段继续使用公司服务器。不推荐前一种方案，因为计算机不会保持永久连接，而且在出现问题时无法重试发送消息；我们将关注后一种。\n\
  \nPostfix 中的 SMTP 身份验证依赖于 SASL（*身份验证与安全层*）。它要求安装 `libsasl2-modules` 和 `sasl2-bin`\
  \ 包，然后为每个需要在 SMTP 服务器上进行验证的用户在 SASL 数据库中注册密码。这是通过 `saslpasswd2` 命令完成的，该命令接受多个参数。`-u`\
  \ 选项定义身份域，必须与 Postfix 配置中的 `smtpd_sasl_local_domain` 参数匹配。`-c` 允许创建用户，而 `-f` 允许在\
  \ SASL 数据库需要存储在默认位置（`/etc/sasldb2`）之外时指定指定的文件。\n\n```\nsaslpasswd2 -u `postconf\
  \ -h myhostname` -f /var/spool/postfix/etc/sasldb2 -c jean\n# [... 输入两次 jean 的密码\
  \ ... ]\n```\n\n注意，SASL 数据库创建在 Postfix 的目录中。为了确保一致性，我们还通过 `ln -sf /var/spool/postfix/etc/sasldb2\
  \ /etc/sasldb2` 命令将 `/etc/sasldb2` 变成指向 Postfix 使用数据库的符号链接。\n\n现在我们需要配置 Postfix\
  \ 使用 SASL。首先需要将 `postfix` 用户添加到 `sasl` 组，以便它可以访问 SASL 账户数据库。还需要几个新参数来启用 SASL，并且需要配置\
  \ `smtpd_recipient_restrictions` 参数以允许通过 SASL 验证的客户端自由发送电子邮件。\n\n示例 11.12 在 `/etc/postfix/main.cf`\
  \ 中启用 SASL\n```conf\n# 启用 SASL 验证\nsmtpd_sasl_auth_enable = yes\n# 定义使用的 SASL 身份验证域\n\
  smtpd_sasl_local_domain = $myhostname\n[...] # 在 reject_unauth_destination 之前添加\
  \ permit_sasl_authenticated\n# 允许通过 SASL 验证的用户中继邮件\nsmtpd_recipient_restrictions\
  \ = permit_sasl_authenticated, permit_mynetworks, reject_unauth_destination, [...]\n\
  ```\n\n通常情况下，通过未加密连接发送密码不是好主意。*Postfix* 允许对其运行的每个端口（服务）使用不同的配置。所有这些可以通过 `/etc/postfix/master.cf`\
  \ 文件中的不同规则和指令进行配置。要关闭端口 25（`smtpd` 服务）的身份验证，添加以下指令：\n\n```\nsmtp inet n - y - -\
  \ smtpd [..] -o smtpd_sasl_auth_enable=no [..]\n```\n\n如果由于某些原因客户端使用了过时的 `AUTH`\
  \ 命令（某些非常旧的邮件客户端确实如此），可以使用 `broken_sasl_auth_clients` 指令开启它们的兼容性。\n\n* * *\n\n*额外*\
  \ 经过验证的 SMTP 客户端\n\n大多数邮件客户端都可以在发送输出邮件之前对 SMTP 服务器进行身份验证，使用该功能只需配置适当的参数。如果使用的客户端未提供该功能，变通方法是使用本地\
  \ Postfix 服务器并配置其通过远程 SMTP 服务器中继电子邮件。在这种情况下，本地 Postfix 本身将作为使用 SASL 验证的客户端。以下是所需的参数：\n\
  \n```\nsmtp_sasl_auth_enable = yes\nsmtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd\n\
  relay_host = [mail.falcot.com]\n```\n\n`/etc/postfix/sasl_passwd` 文件需要包含在 `mail.falcot.com`\
  \ 服务器上进行验证所需的用户名和密码。这是一个示例：\n\n```\n[mail.falcot.com] joe:LyinIsji\n```\n\n对于所有\
  \ Postfix 映射文件，必须使用 `postmap` 命令将此文件转换为 `/etc/postfix/sasl_passwd.db`。\n\n* * *\n\
  \n* * *\n\n[^([1]) `openspf.org` 网站于 2019 年 2 月无原因消失了。内容仍可以通过 [`web.archive.org/web/20190224184030/http://www.openspf.org/SPF_Record_Syntax`](https://web.archive.org/web/20190224184030/http://www.openspf.org/SPF_Record_Syntax)\
  \ 获取。\n\n# 11.2. Web 服务器 (HTTP)\n\nFalcot 公司的管理员决定使用 Apache HTTP 服务器，Debian Buster\
  \ 包含的版本为 2.4.38。\n\n* * *\n\n*替代方案* 其他 Web 服务器\n\nApache 仅仅是最广为人知（以及广泛使用）的 Web 服务器，但还有其他的；它们在某些工作负载下可以提供更好的性能，但代价是可用功能和模块较少。然而，当备选的\
  \ Web 服务器用于提供静态文件或作为代理时，像 `nginx` 和 `lighttpd` 等替代方案值得研究。\n\n* * *\n\n## 11.2.1.\
  \ 安装 Apache\n\n只需要安装 `apache2` 包即可。它包含了所有的模块，包括影响 Apache 如何处理并行处理的*多处理模块* (MPMs)。它还拉取了实用程序和命令行工具。\n\
  \n所所使用的 MPM 会显著影响 Apache 处理并发请求的方式。使用 `worker` MPM 时，它使用线程（轻量级进程），而使用 `prefork`\
  \ MPM 时它使用进程。使用 `event` MPM 时它也使用线程，但空闲连接（特别是由 keep-alive 功能保持打开的连接）会被交给一个专门的管理线程。\n\
  \nFalcot 管理员还安装了 `libapache2-mod-php7.3` 以在 Apache 中包含 PHP 支持。这会导致默认的 `event` MPM\
  \ 被禁用，转而使用 `prefork`。要使用 `event` MPM，可以使用 `php7.3-fpm`。\n\n* * *\n\n*安全* 在 `www-data`\
  \ 用户身份下执行\n\n默认情况下，Apache 以 `www-data` 用户的身份处理传入请求。这意味着 Apache 执行的 CGI 脚本（动态页面）的安全漏洞不会损害整个系统，只会影响该特定用户的文件。\n\
  \n使用 `sueec` 模块（由 `apache2-sueec-*` 包提供）允许绕过此规则，以便某些 CGI 脚本以另一个用户的身份执行。这通过 Apache\
  \ 配置中的 `SuexecUserGroup` `user group` 指令进行配置。\n\n另一种可能性是使用专门的 MPM，例如由 `libapache2-mpm-itk`\
  \ 提供的。这种特定的行为略有不同：它允许“隔离”虚拟主机（实际上是页面集），以便它们以不同的用户身份运行。因此，一个网站的漏洞无法损害属于另一个网站所有的文件。\n\
  \n* * *\n\n* * *\n\n*查看* 模块列表\n\nApache 标准模块的完整列表可以在网上找到。\n\n→ [`httpd.apache.org/docs/2.4/mod/index.html`](https://httpd.apache.org/docs/2.4/mod/index.html)\n\
  \n* * *\n\nApache 是模块化服务器，许多功能由主程序在初始化期间加载的外部模块实现。默认配置仅启用常用的模块，但启用新模块只需运行 `a2enmod\
  \ `module``；要禁用模块，命令是 `a2dismod `module``。这些程序实际上只在 `/etc/apache2/mods-enabled/`\
  \ 中创建（或删除）符号链接，指向实际文件（存储在 `/etc/apache2/mods-available/` 中）。\n\n* * *\n\n*实践中* 检查配置\n\
  \n\n\n\n\n`mod_info` 模块（`a2enmod info`）允许通过浏览器访问 `http://localhost/server-info`\
  \ 来获取全面的 Apache 服务器配置和信息。由于其中可能包含敏感信息，默认情况下仅允许本地主机访问。\n\n→ [`httpd.apache.org/docs/2.4/mod/mod_info.html`](https://httpd.apache.org/docs/2.4/mod/mod_info.html)\n\
  \n在默认配置下，Web 服务器监听在 80 端口（如 `/etc/apache2/ports.conf` 中配置），并从 `/var/www/html/` 目录提供页面（如\
  \ `/etc/apache2/sites-enabled/000-default.conf` 中配置）。\n\n## 11.2.2. 添加 SSL 支持\n\n\
  Apache 2.4 内置了安全 HTTP (HTTPS) 必需的 SSL 模块 `mod_ssl`。只需要通过 `a2enmod ssl` 将其启用，然后在配置文件中添加所需的指令即可。`/etc/apache2/sites-available/default-ssl.conf`\
  \ 提供了一个配置示例。\n\n→ [`httpd.apache.org/docs/2.4/mod/mod_ssl.html`](https://httpd.apache.org/docs/2.4/mod/mod_ssl.html)\n\
  \n如果你想生成受信任的证书，可以参考 第 10.2.1 节，“创建免费受信任证书” 并调整以下变量：\n\n```\nSSLCertificateFile /etc/letsencrypt/live/*`DOMAIN`*/fullchain.pem\
  \ SSLCertificateKeyFile /etc/letsencrypt/live/*`DOMAIN`*/privkey.pem SSLCertificateChainFile\
  \ /etc/letsencrypt/live/*`DOMAIN`*/chain.pem SSLCACertificateFile /etc/ssl/certs/ca-certificates.crt\n\
  ```\n\n如果你希望倾向于使用具有完全正向密钥（Perfect Forward Secrecy）属性的 SSL 连接，需要格外小心（这些连接使用临时会话密钥，确保服务器私钥泄露不会导致之前在网络嗅探时存储的旧加密流量被泄露）。请特别查看\
  \ Mozilla 的建议：\n\n→ [`wiki.mozilla.org/Security/Server_Side_TLS#Apache`](https://wiki.mozilla.org/Security/Server_Side_TLS#Apache)\n\
  \n作为标准 SSL 模块的替代方案，还有一个名为 `mod_gnutls` 的扩展模块随 `libapache2-mod-gnutls` 软件包分发，并通过\
  \ `a2enmod gnutls` 启用。\n\n→ [`mod.gnutls.org/`](https://mod.gnutls.org/)\n\n## 11.2.3.\
  \ 配置虚拟主机\n\n虚拟主机是 Web 服务器的一个额外身份。\n\nApache 考虑两种类型的虚拟主机：基于 IP 地址（或端口）的主机，以及基于 Web\
  \ 服务器域名的主机。第一种方法需要为每个站点分配不同的 IP 地址（或端口），而第二种可以在单个 IP 地址（和端口）上运行，通过 HTTP 客户端发送的主机名区分站点（这仅适用于\
  \ HTTP 协议 1.1——幸运的是，该版本足够老，所有客户端都在使用它）。\n\nIPv4 地址的日益稀缺通常有利于第二种方法；但如果虚拟主机还需要提供 HTTPS，情况就会变得更加复杂，因为\
  \ SSL 协议并不总是支持基于名称的虚拟主机；允许这种组合的 SNI（服务器名称指示）扩展并未被所有浏览器器支持。当多个 HTTPS 站点需要运行在同一台服务器上时，它们通常通过运行在不同的端口或不同的\
  \ IP 地址上来区分（IPv6 在此很有帮助）。\n\nApache 2 的默认配置启用了基于名称的虚拟主机。此外，在 `/etc/apache2/sites-enabled/000-default.conf`\
  \ 文件定义了一个默认虚拟主机；如果未找到与客户端发送请求匹配的主机，将使用该虚拟主机。\n\n### 注意 第一个虚拟主机\n\n针对未知虚拟主机的请求始终由定义的第一个虚拟主机处理，这就是为什么我们在这里先定义\
  \ `www.falcot.com`。\n\n### 快速查看 Apache 支持 SNI\n\nApache 服务器支持一种名为服务器名称指示（SNI）的 SSL\
  \ 协议扩展。该扩展允许浏览器在建立 SSL 连接期间发送 Web 服务器的主机名，这比 HTTP 请求本身要早得多，而 HTTP 请求此前用于在托管在同一台服务器（具有相同\
  \ IP 地址和端口）的站点中识别被请求的虚拟主机。这允许 Apache 为后续交易选择最合适的 SSL 证书。\n\n在 SNI 之前，Apache 始终使用在默认虚拟主机定义的证书。尝试访问另一个虚拟机的客户端将显示警告，因为它们收到的证书与其尝试访问的网站不匹配。幸运的是，大多数浏览器现在都支持\
  \ SNI；包括从 7.0 版本（基于 Vista）开始的 Microsoft Internet Explorer、2.0 版本开始的 Mozilla Firefox、3.2.1\
  \ 版本开始的 Apple Safari 以及所有版本的 Google Chrome。\n\nDebian 提供的 Apache 软件包在构建时已支持 SNI；因此不需要特殊配置。\n\
  \n还应确保虚拟主机（默认使用的那个）启用了 TLS1。每个额外的虚拟主机由存储在 `/etc/apache2/sites-available/` 中的文件描述。因此，为\
  \ `falcot.org` 域名设置网站只需创建以下文件，然后通过 `a2ensite falcot.org` 启用虚拟主机。\n\n```\n<VirtualHost\
  \ *:80>\n    ServerName www.falcot.org\n    ServerAlias falcot.org\n    DocumentRoot\
  \ /srv/www/falcot.org\n</VirtualHost>\n```\n\n到目前为止配置的 Apache 服务器对所有虚拟主机使用相同的日志文件（尽管可以通过在虚拟主机定义中添加\
  \ `CustomLog` 指令来更改）。因此，自定义此日志文件的格式以包含虚拟主机名称是有意义的。这可以通过创建 `/etc/apache2/conf-available/customlog.conf`\
  \ 文件并通过 `a2enconf customlog` 启用来实现。还必须从 `/etc/apache2/sites-enabled/000-default.conf`\
  \ 文件中删除（或注释掉）`CustomLog` 行。\n\n```\n# 新日志格式，包含（虚拟）主机名\nLogFormat \"%v %h %l %u %t\
  \ \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" vhost\n# 现在让我们默认使用这种\
  \ \"vhost\" 格式\nCustomLog /var/log/apache2/access.log vhost\n```\n\n## 11.2.4. 常用指令\n\
  \n本节简要回顾了一些常用的 Apache 配置指令。\n\n主配置文件通常包含几个 `Directory` 块；它们允许根据所提供服务的文件的位置为服务器指定不同的行为。此类块通常包含\
  \ `Options` 和 `AllowOverride` 指令。\n\n```\n<Directory /var/www>\n    Options Includes\
  \ FollowSymlinks\n    AllowOverride All\n    DirectoryIndex index.php index.html\
  \ index.htm\n</Directory>\n```\n\n`DirectoryIndex` 指令包含一个当客户端请求匹配目录时尝试的文件列表。列表中第一个存在的文件将被使用并作为响应发送。\n\
  \n`Options` 指令后紧跟着一个要启用的选项列表。`None` 值禁用所有选项；相应地，`All` 启用 `MultiViews` 之外的所有选项。可用选项包括：\n\
  \n*   `ExecCGI` 表示可以执行 CGI 脚本。\n*   `FollowSymlinks` 告诉服务器可以跟随符号链接，响应应包含此类链接目标的内容。\n\
  \n\n\n\n\n*   `SymlinksIfOwnerMatch` 也告诉服务器跟随符号链接，但仅当链接及其目标具有相同所有者时才生效。\n*   `Includes`\
  \ 启用服务器端包含（简写 `SSI`）。这些是嵌入在 HTML 页面中的指令，并在每次请求时即时执行。\n*   `IncludesNOEXEC` 允许服务器端包含（`SSI`），但禁用了\
  \ `exec` 命令并将 `include` 指令限制为文本/标记文件。\n*   `Indexes` 告诉服务器，如果客户端发送的 HTTP 请求指向一个没有索引文件的目录，则列出该目录的内容（即当目录中不存在\
  \ `DirectoryIndex` 指令中提到的任何文件时）。\n*   `MultiViews` 启用多视图（多内容协商），用于内容协商；服务器可以使用此功能返回与浏览器配置的偏好语言匹配的网页。\n\
  \n---\n\n## 回到基础 `.htaccess` 文件\n\n`.htaccess` 文件包含了 Apache 配置指令，每当请求涉及其存储目录的元素时，这些指令就会被执行。这些指令的作用范围也会递归到所有的子目录。\n\
  \n在 `Directory` 块中出现的大多数指令在 `.htaccess` 文件中也是合法的。\n\n---\n\n`AllowOverride` 指令列出了所有可以通过\
  \ `.htaccess` 文件启用或禁用的选项。该选项的一个常见用途是限制 `ExecCGI`，以便管理员选择哪些用户允许在 Web 服务器身份（`www-data`\
  \ 用户）下运行程序。\n\n### 11.2.4.1. 需要身份验证\n\n在某些情况下，需要对网站的部分访问进行限制，因此只有提供用户名和密码的合法用户才能访问内容。\n\
  \n示例 11.16. 需要身份验证的 `.htaccess` 文件\n```bash\nRequire valid-user AuthName \"Private\
  \ directory\" AuthType Basic AuthUserFile /etc/apache2/authfiles/htpasswd-private\n\
  ```\n\n---\n\n### 安全 无安全\n\n上述示例使用的身份验证系统（`Basic`）安全性最低，因为密码是以明文发送的（它仅被编码为 `base64`，这是一种简单的编码方式，而不是加密方法）。还需要注意的是，受此机制“保护”的文档在网络传输时也是明文的。如果安全性很重要，则应该对整个\
  \ HTTP 连接使用 SSL 加密。\n\n---\n\n`/etc/apache2/authfiles/htpasswd-private` 文件包含用户和密码列表；通常使用\
  \ `htpasswd` 命令进行处理。例如，以下命令用于添加用户或更改其密码：\n\n```bash\n# htpasswd /etc/apache2/authfiles/htpasswd-private\
  \ user\nNew password: Re-type new password: Adding password for user user\n```\n\
  \n### 11.2.4.2. 限制访问\n\n`Require` 指令控制目录（及其递归子目录）的访问限制。\n\n→ [`httpd.apache.org/docs/2.4/howto/access.html`](https://httpd.apache.org/docs/2.4/howto/access.html)\n\
  \n它可以根据许多标准来限制访问；我们将在此停止于描述基于客户端 IP 地址的访问限制，但它的功能可以变得比这要强大得多，特别是当在 `RequireAll`\
  \ 块中组合多个 `Require` 指令时。\n\n示例 11.17. 仅允许来自本地网络的访问\n```bash\nRequire ip 192.168.0.0/16\n\
  ```\n\n---\n\n### 替代方案 旧语法\n\n`Require` 语法仅在 Apache 2.4（自 Jessie 版本起发布的版本）中可用。对于\
  \ Wheezy 用户，Apache 2.2 的语法有所不同，我们在这里描述它主要供参考，尽管通过 `mod_access_compat` 模块在 Apache\
  \ 2.4 中也可以。\n\n`Allow from` 和 `Deny from` 指令控制目录（及其递归子目录）的访问限制。\n\n`Order` 指令告诉服务器\
  \ `Allow from` 和 `Deny from` 指令的执行顺序；最后一个匹配的项具有优先级。具体而言，`Order deny,allow` 在没有 `Deny\
  \ from` 生效或有 `Allow from` 指令生效时允许访问。相反，`Order allow,deny` 在没有匹配的 `Allow from` 指令（或有\
  \ `Deny from` 指令生效）时拒绝访问。\n\n`Allow from` 和 `Deny from` 指令后面可以跟随 IP 地址、网络（例如 `192.168.0.0/255.255.255.0`、`192.168.0.0/24`\
  \ 甚至 `192.168.0`）、主机名或域名，或者指定所有人的 `all` 关键字。\n\n例如，要默认拒绝连接但允许来自本地网络的连接，你可以使用以下配置：\n\
  ```text\nOrder deny,allow\nAllow from 192.168.0.0/16\nDeny from all\n```\n\n---\n\
  \n## 11.2.5. 日志分析器\n\n日志分析器经常安装在 Web 服务器上；因为前者为管理员提供了关于后者使用模式的精确信息。\n\nFalcot Corp\
  \ 的管理员选择了 `AWStats`（高级网络统计）来分析他们的 Apache 日志文件。\n\n第一个配置步骤是自定义 `/etc/awstats/awstats.conf`\
  \ 文件。Falcot 的管理员除了以下参数外，保持该文件不变：\n\n```ini\nLogFile=\"/var/log/apache2/access.log\"\
  \nLogFormat=\"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\
  \"\"\nLogType=combined\n```\n\n（注：原文示例代码中 `LogFormat` 部分似乎不完整，此处已根据上下文补全并翻译）\n\n\
  ---\n\n### 统计数据\n\nAWStats 默认在 `/var/www/awstats` 目录下生成统计数据。你可以通过 `DataDir` 参数来更改统计数据的存储位置。\n\
  \n如果你想通过 Web 访问统计数据，需要在 Apache 中配置一个 `Alias`：\n\n```apache\nAlias /awstats/ /var/www/awstats/\n\
  <Directory /var/www/awstats>\n    Options +Indexes\n    Require all granted\n</Directory>\n\
  ```\n\n---\n\n### 运行 AWStats\n\n你可以手动运行 AWStats 来处理日志：\n\n```bash\nawstats.pl -f\
  \ /etc/awstats/awstats.conf -output www\n```\n\n通常，我们会使用 `cron` 来自动运行它。例如，在 `crontab`\
  \ 中添加以下任务：\n\n```cron\n0 * * * * /usr/bin/awstats.pl -f /etc/awstats/awstats.conf\
  \ -output www > /dev/null 2>&1\n```\n\n\n\n\n\n请注意，由 `logrotate` 创建的日志文件需要所有人可读，特别是\
  \ AWStats。在上面的示例中，这是通过 `create 644 root adm` 这一行实现的（而不是默认的 `640` 权限）。\n\n# 11.3.\
  \ FTP 文件服务器\n\nFTP（*文件传输协议*）是互联网最早的协议之一（RFC 959 于 1985 年发布）。它在 Web 诞生之前就被用于分发文件（HTTP\
  \ 协议创建于 1990 年，并在 1996 年发布的 RFC 1945 1.0 版本中正式定义）。\n\n该协议允许文件上传和下载；由于由于原因，它仍然被广泛用于部署托管在互联网提供商（或任何托管网站的实体）上的网站更新。在这些情况下，通过用户标识符和密码强制安全访问；身份验证后，FTP\
  \ 服务器将授予该用户主目录的读写权限。\n\n其他 FTP 服务器主要用于分发供公共下载的文件；Debian 软件包就是一个很好的例子。这些服务器的内容是从其他地理位置较远的服务器获取的，然后提供给距离较近的用户。这意味着不需要客户端身份验证；结果，这种工作模式被称为“匿名\
  \ FTP”。严格来说，客户端确实会使用 `anonymous` 用户名进行身份验证；按照惯例，密码通常是用户的电子邮件地址，但服务器会忽略它。\n\nDebian\
  \ 中提供了许多 FTP 服务器（如 `ftpd`、`proftpd-basic`、`pyftpd` 等）。Falcot Corp 的管理员挑选了 `vsftpd`，因为他们只使用\
  \ FTP 服务器分发少量文件（包括一个 Debian 软件包仓库）；由于他们不需要高级功能，他们选择专注于安全性方面。\n\n安装该软件包会创建一个 `ftp`\
  \ 系统用户。该账户始终用于匿名 FTP 连接，其主目录（`/srv/ftp/`）是连接到此服务的用户可见的树形根目录。默认配置（位于 `/etc/vsftpd.conf`\
  \ 中）需要进行一些更改，以满足让大文件供公共下载的简单需求：需要启用匿名访问（`anonymous_enable=YES`），并需要禁用本地用户的只读访问（`local_enable=NO`）。后者尤为重要，因为\
  \ FTP 协议没有使用任何形式的加密，用户密码可能会在网上被截获。\n\n`ftpd` 软件包未包含在 Debian Buster 中，由于一个发布前无法解决的错误。\n\
  \n# 11.4. NFS 文件服务器\n\nNFS（*网络文件系统*）是一种允许通过网络远程访问文件系统的协议。所有 Unix 系统都可以使用此协议。\n\n\
  ### 特殊情况：Microsoft Windows 和 NFS 共享\n\n当涉及旧版本或（所谓的）“家庭版”变体 Windows 时，通常必须使用 `Samba`（见第\
  \ 11.5 节，“使用 Samba 设置 Windows 共享”）而不是 NFS。然而，现代 Windows Server 以及“专业版”或“企业版”桌面解决方案内置了对\
  \ NFS 的支持。安装“N 服务”组件后，可以像任何其他网络共享一样访问并临时或永久挂载 NFS 共享。请文件名可能存在编码问题。\n\n作为替代方案，可以将\
  \ Debian 安装在 Windows 10 Pro 及更高版本上。这需要安装适用于 Linux 的 Windows 子系统组件以及从 Windows 商店下载\
  \ Debian 应用。\n\n→ [https://www.microsoft.com/en-us/p/debian/9msvkqc78pk6?]\n\nNFS\
  \ 是一个非常有用的工具，但从历史上看，它一直受到许多限制，其中大多数限制已通过该协议的第 4 版本解决。缺点是，当你想要使用身份验证和加密等基本安全功能时，最新版本的\
  \ NFS 配置起来更困难，因为这些部分依赖于 Kerberos。如果没有这些功能，NFS 协议必须限制在受信任的本地网络中，因为数据是以明文形式通过网络传输（*嗅探器*可以截获它），并且访问权限是根据客户端的\
  \ IP 地址授予的（这可以被伪造）。\n\n### 文档：NFS HOWTO\n\n部署 NFSv4 的良好文档相当稀缺。这里是一些质量参差不齐的提示，但它们至少对应该做什么提供一些提示。\n\
  \n→ [https://help.ubuntu.com/community/NFSv4Howto] → [https://wiki.linux-nfs.org/wiki/index.php/Nfsv4_configuration]\n\
  \n## 11.4.1. NFS 安全性\n\n如果不使用基于 Kerberos 的安全功能，确保只有允许使用 NFS 的机器才能连接到各种所需的 RPC 服务器是至关重要的，因为基础协议信任从网络接收的数据。防火墙还必须阻止\
  \ *IP 欺骗*，以防止外部机器伪成内部内部，并且对相应端口的访问必须限制在访问 NFS 共享的机器。\n\n### 回归基础：RPC\n\nRPC（*远程过程调用*）是用于远程服务的\
  \ Unix 标准。NFS 就是其中一种服务。\n\nRPC 服务注册在一个名为 `portmapper` 的目录中。想要执行 NFS 查询的客户端首先访问 `portmapper`（端口为\
  \ `111`，TCP 或 UDP 均可），请求 NFS 服务器；回复通常会提到端口 `2049`（NFS 的默认端口）。并不是所有 RPC 服务都一定使用固定端口。\n\
  \n该协议的旧版本需要使用动态分配端口的其他 RPC 服务。幸运的是，在 NFS 第 4 版本中，只需要端口 `2049`（用于 NFS）和 `111`（用于\
  \ `portmapper`），因此它们很容易在防火墙中进行配置。\n\n## 11.4.2. NFS 服务器\n\nNFS 服务器是 Linux 内核的一部分；在\
  \ Debian 提供的内核中，它被构建为内核模块。如果要在启动时自动运行 NFS 服务器，则应该安装 `nfs-kernel-server` 软件包；它包含相关的启动脚本。\n\
  \nNFS 服务器配置文件 `/etc/exports` 列出了通过网络提供的（*导出*）的目录。对于每个 NFS 共享，仅向给定的机器列表授予访问权限。通过几个选项可以获得更细粒度的访问控制。该文件的语法非常简单：\n\
  \n```\n/directory/to/share machine1(option1,option2,...) machine2(...) ...\n```\n\
  \n注意，在 NFSv4 中，所有导出的目录必须是单个层次结构的一部分，且该层次结构的根目录必须被导出并使用 `fsid=0` 或 `fsid=root` 选项进行标识。\n\
  \n每台机器都可以通过其 DNS 名称或 IP 地址识别。也可以使用类似于 `*.falcot.com` 的语法或 IP 地址范围（例如 `192.168.0.0/255.255.255.0`\
  \ 或 `192.168.0.0/24`）来指定一组机器。\n\n目录默认以只读方式提供（或使用 `ro` 选项）。`rw` 选项允许读写访问。NFS 客户端通常从受\
  \ root 限制的端口（即 1024 以下）连接；此限制可以通过 `insecure` 选项取消（`secure` 选项是隐式的，但如果为了清晰起见，也可以显式指定）。\n\
  \n默认情况下，服务器仅在当前磁盘操作完成后才回答 NFS 查询（`sync` 选项）；可以通过 `async` 选项禁用此设置。异步写入可以提高提高性能，但会降低可靠性，因为如果服务器在确认写入和实际写入磁盘之间崩溃，存在数据丢失的风险。由于默认值最近发生了变化（与\
  \ NFS 的历史值相比），建议进行显式设置。\n\n\n\n\n\n为了防止向任何 NFS 客户端提供文件系统的 root 权限，所有似乎来自 root 用户的查询都将被服务器认为来自\
  \ `nobody` 用户。这种行为对应于 `root_squash` 选项，并且默认已启用。`no_root_squash` 选项会禁用此行为，它具有风险性，应仅在受控环境中使用。如果应将所有用户都映射到用户\
  \ `nobody`，请使用 `all_squash`。`anonuid=`uid`` 和 `anongid=`gid`` 选项允许指定另一个伪造用户来代替 UID/GID\
  \ 65534（对应于用户 `nobody` 和组 `nogroup`）。\n\n在 NFSv4 中，你可以添加 `sec` 选项来指定你想要的的安全级别：`sec=sys`\
  \ 是默认值，不具备特殊的安全特性；`sec=krb5` 仅启用身份验证；`sec=krb5i` 增加了完整性保护；而 `sec=krb5p` 是最完整的级别，包含了隐私保护（带有数据加密）。要使此功能生效，你需要一个可以运行的\
  \ Kerberos 设置（本书未涵盖该服务）。\n\n其他选项也可用；它们记录在 `exports(5)` 手页中。\n\n### 注意：首次安装\n\n`/etc/init.d/nfs-kernel-server`\
  \ 启动脚本只有在 `/etc/exports` 列出一个或多个有效 NFS 共享时才会启动服务器。因此，在初始配置期间，一旦该文件被编辑包含包含有效条目，必须使用以下命令启动\
  \ NFS 服务器：\n\n```\n# systemctl start nfs-kernel-server\n```\n\n## 11.4.3. NFS 客户端\n\
  \n与其他文件系统一样，将 NFS 共享集成到系统层次结构中需要挂载（以及 `nfs-common` 包）。由于该文件系统具有特殊性，对 `mount` 命令的语法和\
  \ `/etc/fstab` 文件需要进行一些调整。\n\n示例 11.19. 使用 mount 命令手动挂载\n```bash\n# mount -t nfs4\
  \ -o rw,nosuid arrakis.internal.falcot.com:/shared /srv/shared\n```\n示例 11.20. /etc/fstab\
  \ 文件中的 NFS 条目\n```\narrakis.internal.falcot.com:/shared /srv/shared nfs4 rw,nosuid\
  \ 0 0\n```\n\n上述条目在系统启动时，将 `arrakis` 服务器上的 NFS 目录 `/shared/` 挂载到本地的 `/srv/shared/`\
  \ 目录。请求读写访问（因此使用了 `rw` 参数）。`nosuid` 选项是一种保护措施，会清除存储在共享中的程序上的任何 `setuid` 或 `setgid`\
  \ 位。如果 NFS 共享仅用于存储文档，另一个建议选项是 `noexec`，它可以防止执行存储在共享中的程序。注意，在服务器上，`shared` 目录位于 NFSv4\
  \ 根导出之下（例如 `/export/shared`），它不是顶级目录。\n\n`nfs(5)` 手页详细描述了所有选项。\n\n## 11.5. 使用 Samba\
  \ 设置 Windows 共享\n\nSamba 是一套在 Linux 上处理 SMB 协议（也称为“CIFS”）的工具。该协议被 Windows 用于网络共享和共享打印机。\n\
  \nSamba 还可以充当 Windows 域控制器。这是一个确保 Linux 服务器与仍运行 Windows 的办公桌面机器无缝集成的卓越工具。\n\n###\
  \ 11.5.1. Samba 服务器\n\n`samba` 包包含了 Samba 4 的两个主服务器：`smbd` 和 `nmbd`。\n\n### 文档：进阶\n\
  \nSamba 服务器极具可配置且功能强大，可以解决匹配非常不同需求和网络架构的许多不同用例。本书仅关注 Samba 作为独立服务器使用的用例，但它也可以作为\
  \ NT4 域控制器或全 Active Directory 域控制器，或者作为现有域的简单成员（该域可能由 Windows 服务器创建）。\n\n`samba`\
  \ 包包含了所有必要的手页，并在 `/usr/share/doc/samba/examples/` 目录下有丰富的带注释示例文件。如果你正在寻找更全面的文档，可以检查\
  \ *Samba* 官方网站。\n\n→ https://www.samba.org/samba/docs/\n\n### 工具：与 Windows 服务器进行身份验证\n\
  \nWinbind 为系统管理员提供了使用 Windows 服务器作为身份验证服务器的选项。Winbind 还与 PAM 和 NSS 清洁集成。这允许设置 Linux\
  \ 机器，使 Windows 域的所有用户自动获得账户。\n\n更多信息可以在 `libpam-winbind` 包的 `/usr/share/doc/libpam-winbind/examples/pam_winbind/`\
  \ 目录下找到。\n\n#### 11.5.1.1. 使用 debconf 配置\n\n该包在初始安装期间通过简单复制 `/usr/share/samba/smb.conf`\
  \ 来设置最小配置。因此，你真的应该运行 `dpkg-reconfigure samba-common` 来适配它：\n\n在首次安装时，唯一需要的信息是 Samba\
  \ 服务器将所属的工作组名称（在我们的案例中，答案是 `FALCOTNET`）。\n\n在包更新（来自旧的稳定 Debian 版本）的情况下，或者如果 SMB\
  \ 服务器已经配置为使用 WINS 服务器（`wins server`），该包还会建议从 DHCP 守护进程提供的信息中识别 WINS 服务器。Falcot Corp\
  \ 的管理员拒绝了此选项，因为他们打算将 Samba 服务器本身作为 WINS 服务器。\n\n### 11.5.1.2. 手动配置\n\n#### 11.5.1.2.1.\
  \ 对 smb.conf 的更改\n\nFalcot 的要求需要在 `/etc/samba/smb.conf` 配置文件中修改其他选项。以下摘要总结了在 `[global]`\
  \ 部分实施的更改。\n\n```ini\n[...]\n[global]\n## Browsing/Identification\n# 将此更改为你的 Samba\
  \ 服务器将所属的工作组/NT 域名称\nworkgroup = FALCOTNET\n# Windows Internet Name Serving Support\
  \ Section:\n# WINS Support - 告诉 Samba 的 NMBD 组件启用其 WINS 服务器\nwins support = yes\n\
  [...]\n####### Authentication #######\n# 服务器角色。定义了 Samba 以何种模式运行。可能的\n# 值有 \"standalone\
  \ server\", \"member server\", \"classic primary\n# domain controller\", \"classic\
  \ backup domain controller\", \"active\n# directory domain controller\"。\n# # 大多数人将想要\
  \ \"standalone server\" 或 \"member server\"。\n# 运行 \"active directory domain controller\"\
  \ 需要首先\n# 运行 \"samba-tool domain provision\" 来清除数据库并创建一个\n# 新域。\nserver role = standalone\
  \ server\nobey pam restrictions = yes\n[...]\n# \"security = user\" 是一个好主意。这将为每个访问服务器的\n\
  # 用户需要一个 Unix 账户。\nsecurity = user\n[...]\n```\n\n| 图标 | 描述 |\n| :--- | :--- |\n\
  | [![[1]](images/callouts/1.png) | 表示 Samba 作为本地局域网的 BIOS 名称服务器 (WINS)。此选项已从 Buster\
  \ 的默认配置中移除，如有需要手动添加。 |\n| [![[2]](images/callouts/2.png) | 这是该参数的默认值；但由于它是 Samba\
  \ 配置的核心，建议显式填写。每个用户在访问共享之前必须进行身份验证。 |\n\n#### 11.5.1.2.2. 添加用户\n\n每个 Samba 用户都需要服务器上的账户；必须先创建\
  \ Unix 账户，然后将用户注册到 Samba 数据库中。Unix 步骤非常正常（例如使用 `adduser`）。\n\n将现有用户添加到 Samba 数据库只需运行\
  \ `smbpasswd -a user` 命令；此命令会交互式询问密码。\n\n可以使用 `smbpasswd -x user` 命令删除用户。Samba 账户还可以临时禁用（使用\
  \ `smbpasswd -d user`）并在以后启用（使用 `smbpasswd -e user`）。\n\n## 11.5.2. Samba 客户端\n\n\
  Samba 的客户端功能允许 Linux 机器访问 Windows 共享和共享打印机。所需的程序可以在 `cifs-utils` 和 `smbclient` 包中找到。\n\
  \n### 11.5.2.1. smbclient 程序\n\n\n\n\n\n`smbclient` 程序用于查询 SMB 服务器。它接受 `-U` `user`\
  \ 选项，用于以特定身份连接到服务器。`smbclient //server/*share` 以交互式方式访问共享内容，类似于命令行 FTP 客户端。`smbclient\
  \ -L server` 则列出服务器上所有可用（且可见）的共享。\n\n### 11.5.2.2. 挂载 Windows 共享\n\n`mount` 命令允许将\
  \ Windows 共享挂载到 Linux 文件系统层级结构中（借助 `cifs-utils` 提供的 `mount.cifs`）。\n\n示例 11.21.\
  \ 挂载 Windows 共享\n```bash\nmount -t cifs //arrakis/shared /shared -o credentials=/etc/smb-credentials\n\
  ```\n\n`/etc/smb-credentials` 文件（用户不得具有读权限）的格式如下：\n\n```text\nusername = user\n\
  password = password\n```\n\n可以在命令行中指定其他选项；其完整列表可以在 `mount.cifs(1)` 手册页中找到。有两个选项特别有用：`uid`\
  \ 和 `gid` 允许强制指定挂载上文件的所有者和组，从而不限制 root 的访问。\n\n也可以在 `/etc/fstab` 中配置 Windows 共享的挂载：\n\
  \n```text\nserver/shared /shared cifs credentials=/etc/smb-credentials\n```\n\n\
  卸载 SMB/CIFS 共享使用标准的 `umount` 命令。\n\n### 11.5.2.3. 共享打印机打印\n\nCUPS 是从 Linux 工作站向\
  \ Windows 共享的打印机打印的优雅解决方案。当安装 `smbclient` 时，CUPS 允许自动安装 Windows 共享打印机。\n\n以下是所需的步骤：\n\
  \n*   进入 CUPS 配置界面：`http://localhost:631/admin`\n*   点击“Add Printer”。\n*   选择打印机设备，选取“Windows\
  \ Printer via SAMBA”。\n*   输入网络打印机的连接 URI。它看起来应该如下：\n    ```text\n    smb://user:password@server/printer\n\
  \    ```\n*   输入唯一标识此打印机的名称。然后输入打印机的描述和位置。这些字符串将显示给终端用户，帮助他们识别打印机。\n*   指定打印机的制造商/型号，或直接提供可用的打印机描述文件\
  \ (PPD)。\n\n大喜，打印机可以工作了！\n\n# 11.6. HTTP/FTP 代理\n\nHTTP/FTP 代理作为 HTTP 和/或 FTP 连接的中间节点。它的作用有两个：\n\
  \n*   缓存：最近下载的文档会被复制到本地，从而避免重复下载。\n*   过滤服务器：如果强制使用代理（除非通过代理，否则传站连接将被阻塞），则代理可以决定是否允许请求。\n\
  \nFalcot 公司选择 Squid 作为他们的的代理服务器。\n\n## 11.6.1. 安装\n\n`squid` Debian 软件包仅包含模块化（缓存）代理。将其转换为过滤服务器需要安装额外的\
  \ `squidguard` 软件包。此外，`squid-cgi` 为 Squid 代理提供了查询和管理界面。\n\n在安装之前，应检查系统是否能够识别其自身的完整名称：`hostname\
  \ -f` 必须返回一个完全限定域名（包括域名）。如果不是，则应编辑 `/etc/hosts` 文件以包含系统的全名（例如，`arrakis.falcot.com`）。应该与网络管理员验证官方计算机名称，以避免潜在的名称冲突。\n\
  \n## 11.6.2. 配置缓存\n\n启用缓存服务器功能只需编辑 `/etc/squid/squid.conf` 配置文件，并允许本地网络中的机器通过代理运行查询。以下示例显示了\
  \ Falcot 公司管理员所做的修改：\n\n示例 11.22. `/etc/squid/squid.conf` 文件（节选）\n```text\n# 在此处插入您自己的规则以允许来自客户端访问\n\
  # include /etc/squid/conf.d/*\nacl localnet src 192.168.1.0/24\nhttp_access allow\
  \ localnet\nhttp_access deny\n```\n\n## 11.6.3. 配置过滤器\n\n`squid` 本身不执行过滤；此操作委托给\
  \ `squidguard`。这涉及在 `/etc/squid/squid.conf` 中添加以下内容：\n\n```text\nurl_rewrite_program\
  \ /usr/bin/squidguard -c /etc/squid/squidguard.conf\n```\n\n通过 `service reload`\
  \ 命令启用过滤器。然而，由于 `squid` 默认不进行过滤，因此定义策略是管理员的任务。这可以通过创建 `/etc/squid/squidguard.conf`\
  \ 来（使用 `/etc/squid/squidguard.default` 作为模板）。每次更改后，必须使用 `update-squid` 重新生成数据库。配置语法在以下网站上记录：\n\
  \n→ [`www.squid.org/Doc/configure.html`](http://www.squid.org/Doc/configure.html)\n\
  \n\n\n\n\n*   组织名称：“Falcot Corp”。\n*   需要输入管理员密码。\n*   要使用的数据库后端：“MDB”。\n*   是否在清除\
  \ `slapd` 时删除数据库？不（No）。没有必要冒着因操作失误导致数据库丢失的风险。\n*   移动旧数据库？只有在在已存在数据库的情况下尝试配置时才会询问此问题。只有当你确实想从一个干净数据库重新开始时，才回答“是”（yes），例如在初始安装后立即运行\
  \ `dpkg-reconfigure slapd`。\n\n* * *\n\n# *回归基础* LDIF 格式\n\nLDIF 文件（*LDAP 数据交换格式*）是一种可移植的文本文件，用于描述\
  \ LDAP 数据库的内容（或其部分内容）；随后，可以用它将数据注入到任何其他 LDAP 服务器中。\n\n* * *\n\n现在已配置了一个最小化数据库，如下方的查询所示：\n\
  \n```bash\n$ ldapsearch -x -b dc=falcot,dc=com # extended LDIF # # LDAPv3 # base\
  \ <dc=falcot,dc=com> with scope subtree # filter: (objectclass=*) # requesting:\
  \ ALL # # falcot.com dn: dc=falcot,dc=com objectClass: top objectClass: dcObject\
  \ objectClass: organization o: Falcot Corp dc: falcot # admin, falcot.com dn: cn=admin,dc=falcot,dc=com\
  \ objectClass: simpleSecurityObject objectClass: organizationalRole cn: admin description:\
  \ LDAP administrator # search result search: 2 result: 0 Success # numResponses:\
  \ 3 # numEntries: 2\n```\n\n该查询返回了两个对象：组织本身以及管理员用户。\n\n## 11.7.2. 填充目录\n\n由于空数据库并不特别有用，我们将向其中注入所有现有目录；这包括用户、组、服务和主机数据库。\n\
  \n`migrationtools` 包提供了一系列脚本，专门用于标准的 Unix 目录（`/etc/passwd`、`/etc/group`、`/etc/services`、`/etc/hosts`\
  \ 等）提取数据、转换这些数据并将其注入 LDAP 数据库。\n\n安装包后，必须编辑 `/etc/migrationtools/migrate_common.ph`；需要启用\
  \ `IGNORE_UID_BELOW` 和 `IGNORE_GID_BELOW` 选项（只需取消注释即可），并需要更新 `DEFAULT_MAIL_DOMAIN`/`DEFAULT_BASE`。\n\
  \n实际的迁移操作由 `migrate_all_online.sh` 命令处理，如下：\n\n```bash\n# cd /usr/share/migrationtools\n\
  # LDAPADD=\"/usr/bin/ldapadd -c\" ETC_ALIASES=/dev/null ./migrate_all_online.sh\n\
  ```\n\n`migrate_all_online.sh` 会就要迁移数据的 LDAP 数据库提问几个问题。表 11.1 总结了 Falcot 用用例中给出的答案。\n\
  \n表 11.1. migrate_all_online.sh 脚本提问题的回答\n\n| 问题 | 答案 |\n| --- | --- |\n| X.500\
  \ 命名上下文 | `dc=falcot,dc=com` |\n| LDAP 服务器主机名 | `localhost` |\n| 管理员 DN | `cn=admin,dc=falcot,dc=com`\
  \ |\n| 绑定凭据 | 管理员密码 |\n| 创建 DUAConfigProfile |  |\n\n我们刻意忽略了 `/etc/aliases` 文件的迁移，因为\
  \ Debian 提供的标准架构包含该脚本用于描述邮件别名的结构。如果我们想将这些数据集成到目录中，应将 `/etc/ldap/schema/misc.schema`\
  \ 文件添加到标准架构中。\n\n* * *\n\n# *工具* 浏览 LDAP 目录\n\n`jxplorer` 命令（同名包中的）是一个允许浏览和编辑 LDAP\
  \ 数据库的图形化工具。这是一个非常有趣的工具，可以为管理员提供 LDAP 数据分级结构的良好概述。\n\n* * *\n\n还要注意在 `ldapadd` 命令中使用了\
  \ `-c` 选项；该选项请求在发生错误时不停止处理。需要使用此选项是因为转换 `/etc/services` 经常会产生一些可以忽略的错误。\n\n## 11.7.3.\
  \ 使用 LDAP 管理账户\n\n现在 LDAP 数据库已经包含了一些有用信息，是时候利用这些数据了。本节重点介绍如何配置 Linux 系统，使各种系统目录使用\
  \ LDAP 数据库。\n\n### 11.7.3.1. 配置 NSS\n\nNSS 系统（名称服务切换，参见侧边栏 *进阶* NSS 和系统数据库）是一个模块化系统，用于定义或获取系统目录信息。将\
  \ LDAP 作为 NSS 的数据源需要安装 `libnss-ldap` 包。其安装过程会询问几个问题；答案总结在表 11.2 中。\n\n表 11.2. 配置\
  \ libnss-ldap 包\n\n| 问题 | 答案 |\n| --- | --- |\n| LDAP 服务器 URI | `ldap://ldap.falcot.com`\
  \ |\n| 基础的区分名 | `dc=falcot,dc=com` |\n| 使用的 LDAP 版本 | `3` |\n| root 的 LDAP 账户 |\
  \ `cn=admin,dc=falcot,dc=com` |\n| LDAP 账户密码 | 管理员密码 |\n| 允许 LDAP 账户像 root 一样运行？\
  \ | 是 |\n| LDAP 数据库是否需要登录？ | 否 |\n\n然后需要修改 `nsswitch.conf` 文件，以配置 NSS 使用新安装的 `ldap`\
  \ 模块。你可以使用 `/usr/share/doc/libnss-ldap/examples/nsswitch.conf` 中的示例：\n\n```\npasswd:\
  \  files ldap\nshadow: files ldap\ngroup:  files ldap\n```\n\n### 11.7.3.2. 配置 PAM\n\
  \n本节描述了一种 PAM 配置（参见侧边栏 *幕后原理* `/etc/environment` 和 `/etc/default/locale`），它将允许应用程序针对\
  \ LDAP 数据库执行必要的身份验证。\n\n* * *\n\n\n\n\n\n# 警告：身份验证损坏\n\n更改各种程序使用的标准 PAM 配置是一项敏感操作。错误可能会导致身份验证失效，从而导致登录。因此，保持一个\
  \ root shell 开启是一个良好的预防措施。如果发生配置错误，可以以很小的工作精力进行修复并重启服务。\n\n***\n\nPAM 的 LDAP 模块由\
  \ `libpam-ldap` 软件包提供。安装此软件包会抛出几个与 `libnss-ldap` 非常相似的问题；某些配置参数（例如 LDAP 服务器的 URI）实际上与\
  \ `libnss-ldap` 软件包共享。答案汇总请见 表 11.3]。\n\n## 表 11.3. libpam-ldap 的配置\n\n| 问题 | 答案\
  \ |\n| --- | --- |\n| 允许 LDAP 管理员账户像本地 root 一样运行吗？ | 是。这允许使用常用的 `passwd` 命令更改存储在\
  \ LDAP 数据库中的密码。 |\n| LDAP 数据库是否需要登录？ | 否 |\n| root 的 LDAP 账户 | `cn=admin,dc=falcot,dc=com`\
  \ |\n| LDAP root 账户密码 | LDAP 数据库管理员密码 |\n| 用于密码的本地加密算法 | crypt |\n\n安装 `libpam-ldap`\
  \ 会自动适配 `/etc/pam.d/common-auth`、`/etc/pam.d/common-password` 和 `/etc/pam.d/common-account`\
  \ 文件中定义的默认 PAM 配置。该机制使用了专用的 `pam-auth-update` 工具（由 `libpam-runtime` 软件包提供）。如果管理员想要启用或禁用\
  \ PAM 模块，也可以运行此工具。\n\n### 11.7.3.3. 保护 LDAP 数据交换\n\n默认情况下，LDAP 协议在网络上以明文形式传输；这包括（加密的）密码。由于可以从网络中提取加密后的密码，它们可能会受到字典攻击。通过使用额外的加密层可以避免这一点；启用该层是本节的主题。\n\
  \n### 11.7.3.3.1. 配置服务器\n\n第一步是为 LDAP 服务器创建一个密钥对（包含公钥和私钥）。Falcot 管理员重用 `easy-rsa`\
  \ 来生成它（参见 第 10.2.2 节，“公钥基础设施：easy-rsa”）。运行 `./easyrsa build-server-full ldap.falcot.com\
  \ nopass` 会询问你“通用名称（common name）”。该问题的答案*必须*是 LDAP 服务器的全限定主机名；在我们的情况下，为 `ldap.falcot.com`。\n\
  \n此命令会在 `pki/issued/ldap.falcot.com.crt` 文件创建一个证书；相应的私钥存储在 `pki/private/ldap.falcot.com.key`\
  \ 中。\n\n现在这些密钥必须安装在标准位置，并且我们必须确保私钥文件可以以 `openldap` 用户身份运行的 LDAP 服务器读取：\n\n```bash\n\
  # adduser openldap ssl-cert\n# 将用户 `openldap` 添加到组 `ssl-cert' ... 将用户 openldap 添加到组\
  \ ssl-cert 完成。 #\n# mv pki/private/ldap.falcot.com.key /etc/ssl/private/ldap.falcot.com.key\n\
  # chown root:ssl-cert /etc/ssl/private/ldap.falcot.com.key\n# chmod 0640 /etc/ssl/private/ldap.falcot.com.key\n\
  # ./eassyrsa gen-dh\n# 注意：使用来自：./vars 的 Easy-RSA 配置 使用 SSL: openssl OpenSSL 1.1.1c\
  \ 28 May 2019 正在生成 DH 参数，2048 位安全素数，生成器 2 这将需要很长时间 ........................................................................+..........................................................................+...............................................................................+............\
  \ [...] 创建了大小为 2048 的 DH 参数在 /home/roland/pki/dh.pem #\n# mv pki/dh.pem /etc/ssl/certs/ldap.falcot.com.pem\n\
  ```\n\n`slapd` 守护进程也需要被告知使用这些密钥进行加密。LDAP 服务器的配置是动态管理的：可以通过对 `cn=config` 对象执行常规 LDAP\
  \ 操作来更新配置，服务器会实时更新 `/etc/ldap/slapd.d` 以使配置持久化。因此，`ldapmodify` 是更新配置的正确工具：\n\n示例\
  \ 11.24. 为加密配置 slapd\n```bash\n# cat >ssl.ldif <<END\ndn: cn=config\nchangetype:\
  \ modify\nadd: olcTLSCertificateFile\nolcTLSCertificateFile: /etc/ssl/certs/ldap.falcot.com.pem\n\
  add: olcTLSCertificateKeyFile\nolcTLSCertificateKeyFile: /etc/ssl/private/ldap.falcot.com.key\n\
  END\n# ldapmodify -Y EXTERNAL -H ldapi:/// -f ssl.ldif\nSASL/EXTERNAL 认证启动 SASL\
  \ 用户: gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth SASL SSF: 0 正在修改项目\
  \ \"cn=config\"\n```\n\n***\n\n### 工具：使用 ldapvi 编辑 LDAP 目录\n\n通过 `ldapvi`，你可以显示\
  \ LDAP 目录任何部分的 LDIF 输出，在文本编辑器中进行一些更改，并让工具为你执行相应的 LDAP 操作。\n\n因此，这是一种更新 LDAP 服务器配置的方便方法，只需编辑\
  \ `cn=config` 层次结构即可。\n\n```bash\n# ldapvi -Y EXTERNAL -h ldapi:/// -b cn=config\n\
  ```\n\n***\n\n启用加密的最后一步涉及更改 `/etc/default/slapd` 文件中的 `SLAPD_SERVICES` 变量。我们将采取安全措施，完全禁用不安全的\
  \ LDAP。\n\n示例 11.25. `/etc/default/slapd` 文件\n```bash\n# slapd.conf 文件或 slapd.d\
  \ cn=config 目录的默认位置。 \n# 如果为空，则使用编译的默认值 (/etc/ldap/slapd.d 回退到\n# /etc/ldap/slapd.conf)。\
  \ \nSLAPD_CONF=\n# 运行 slapd 服务器的系统账户。如果为空，服务器 \n# 将以 root 运行。 \nSLAPD_USER=\"openldap\"\
  \n# 运行 slapd 服务器的系统组。如果为空，则以用户的\n# 主组运行。 \nSLAPD_GROUP=\"openldap\"\n# slapd 的 pid\
  \ 文件路径。如果没有设置，init 脚本 \n# 将尝试从 $SLAPD_CONF 获取（默认是 /etc/ldap/slapd.conf）\nSLAPD_PIDFILE=\n\
  # slapd 通常在所有 TCP 端口 389 上提供 LDAP 服务。slapd 还可以\n# 服务 TCP 端口 636 (ldaps) 以及通过 unix\
  \ 套接字的请求。\n# 示例：\n# SLAPD_SERVICES=\"ldap://127.0.0.1:389/ ldaps:/// ldapi/\"\n\
  # 如果设置了 SLAPD_NO_START，init 脚本不会启动或重启\n# slapd（但停止仍然可用）。如果你通过其他方式\n# 启动 slapd，或者你不希望启动时正常启动\
  \ slapd，请取消此行。\n#SLAPD_NO_START=1\n# 如果 SLAPD_SENTINEL_FILE 设置为文件路径且该文件存在，\n# init\
  \ 脚本不会启动或重启 slapd（但停止仍然可用）。使用此\n# 方法临时禁用启动启动（例如在维护期间，或通过配置\n# 管理系统），当您不想编辑配置文件时。\n\
  SLAPD_SENTINEL_FILE=/etc/ldap/noslapd\n# 对于 Kerberos 认证（通过 SASL），slapd 默认使用系统\n\
  # 密钥文件 (/etc/krb5.keytab)。要使用不同的密钥文件，\n# 请取消此行并更改路径。\n#export KRB5_KTNAME=/etc/krb5.keytab\n\
  # 传递给 slapd 的额外选项\nSLAPD_OPTIONS=\"\"\n```\n\n\n\n\n\n```bash\ncp pki/ca.crt /usr/local/share/ca-certificates/falcot.crt\n\
  update-ca-certificates\n```\n正在更新 /etc/ssl/certs 中的证书... 1 added, 0 removed; done.\
  \ Running hooks in /etc/ca-certificates/update.d.... Adding debian:falcot.pem done.\
  \ done.\n\n但同样重要的是，各种命令行工具使用的默认 LDAP URI 和默认 base DN 可以在 `/etc/ldap/ldap.conf` 中修改。这可以节省大量的输入工作。\n\
  \n示例 11.26. `/etc/ldap/ldap.conf` 文件\n```conf\n# LDAP 默认值\n# 详情请见 ldap.conf(5)\n\
  # 此文件应该是所有人可读但不是所有人可写的。\nBASE dc=falcot,dc=com\nURI ldaps://ldap.falcot.com\n#SIZELIMIT\
  \ 12\n#TIMELIMIT 15\n#DEREF never\n# TLS 证书 (GnuTLS 需要)\nTLS_CACERT /etc/ssl/certs/ca-certificates.crt\n\
  ```\n\n# 11.8. 实时通信服务\n\n实时通信 (RTC) 服务包括语音、视频/摄像头、即时消息 (IM) 和桌面共享。本章简要介绍了运行 RTC\
  \ 所需的三种服务，包括 TURN 服务器、SIP 服务器和 XMPP 服务器。关于如何规划、安装和管理这些服务的详细信息，请参考《实时通信快速入门》（Real-Time\
  \ Communications Quick Start Guide），其中包含了针对 Debian 的示例。\n\n→ [`rtcquickstart.org`](https://rtcquickstart.org)\n\
  \nSIP 和 XMPP 都可以提供相同的功能。SIP 在语音和视频方面更为知名，而 XMPP 传统上被认为是一种 IM 协议。事实上，它们都可以用于上述任何一种目的。为了最大化连接选项，建议并行运行两者。\n\
  \n这些服务在认证和机密性方面都依赖 X.509 证书。更多信息请参阅 第 10.2 节，“X.509 证书”。\n\n## 11.8.1. RTC  DNS\
  \ 设置\n\nRTC 服务需要 DNS SRV 和 NAPTR 记录。以下可以放入 `falcot.com` 区域文件的示例配置：\n\n```conf\n\
  ; 运行所有内容的服务器\nserver1 IN A 198.51.100.19\nserver1 IN AAAA 2001:DB8:1000:2000::19\n\
  ; 目前 TURN 仅使用 IPv4，因为某些客户端对 IPv6 存在 bug\nturn-server IN A 198.51.100.19\n; SIP 的\
  \ IPv4 和 IPv6 地址\nsip-proxy IN A 198.51.100.19\nsip-proxy IN AAAA 2001:DB8:1000:2000::19\n\
  ; XMPP 的 IPv4 和 IPv6 地址\nxmpp-gw IN A 198.51.100.19\nxmpp-gw IN AAAA 2001:DB8:1000:2000::19\n\
  ; STUN / TURN 的 DNS SRV 和 NAPTR\n_stun._udp IN SRV 0 1 3467 turn-server.falcot.com.\n\
  _turn._udp IN SRV 0 1 3467 turn-server.falcot.com.\n@ IN NAPTR 10 0 \"s\" \"RELAY:turn.udp\"\
  \ \"\" _turn._udp.falcot.com.\n; SIP 的 DNS SRV 和 NAPTR 记录\n_sips._tcp IN SRV 0 1\
  \ 5061 sip-proxy.falcot.com.\n@ IN NAPTR 10 0 \"s\" \"SIPS+D2T\" \"\" _sips._tcp.falcot.com.\n\
  ; XMPP 服务器和客户端模式的 DNS SRV 记录：\n_xmpp-client._tcp IN SRV 5 0 5222 xmpp-gw.falcot.com.\n\
  _xmpp-server._tcp IN SRV 5 0 5269 xmpp-gw.falcot.com.\n```\n\n## 11.8.2. TURN 服务器\n\
  \nTURN 是一种帮助位于 NAT 路由器和防火墙后的客户端发现与其它客户端通信的最有效方式，并在无法找到直接媒体路径时中继媒体流的服务。强烈建议在向最终用户提供任何其他\
  \ RTC 服务之前安装 TURN 服务器。\n\nTURN 和相关的 ICE 协议是开放标准。为了从这些协议中获益、最大化连接性并减少用户挫败感，确保所有客户端软件都支持\
  \ ICE 和 TURN 非常。\n\n为了让 ICE 算法有效工作，服务器必须有两个公共 IPv4 地址。\n\n安装 `coturn` 包并编辑 `/etc/turnserver.conf`\
  \ 配置文件。默认情况下， `/var/db/turndb` 配置了一个 SQLite 数据库用于用户账户设置，但如果需要，也可以设置 PostgreSQL、MySQL\
  \ 或 Redis。最重要的是插入服务器的 IP 地址。\n\n可以通过运行 `/usr/bin/turnserver` 启动服务器。我们希望服务器是一个自动启动的系统服务，因此我们这样编辑\
  \ `/etc/default/coturn` 文件：\n\n```bash\n# 如果你想让 turnserver 作为\n# 自动系统服务守护进程运行，请取消注释\n\
  # TURNSERVER_ENABLED=1\n```\n\n默认情况下，TURN 服务器使用匿名访问。我们必须添加想要使用的用户：\n\n```bash\n\
  turnadmin -a -u roland -p secret_password -r falcot.com\nturnadmin -A -u admin -p\
  \ secret_password\n```\n\n我们使用参数 `-a` 添加普通用户，并使用 `-A` 添加管理员用户。\n\n## 11.8.3. SIP\
  \ 代理服务器\n\nSIP 代理服务器管理其他机构、SIP 话继提供商、如 Asterisk 等 SIP PBX、SIP 电话、基于 SIP 的软电话以及 WebRTC\
  \ 应用程序之间入和出的 SIP 连接。\n\n强烈建议在尝试设置 SIP PBX 之前安装并配置 SIP 代理。SIP 代理归一化了到达 PBX 的流量，并提供了更好的连接性和韧性。\n\
  \n### 11.8.3.1. 安装 SIP 代理\n\n安装 `kamailio` 包以及数据库后端包，Falcot 的管理人员选择了 MySQL，因此他们安装了\
  \ `mariadb-server`。`/etc/kamailio/kamctlrc` 是控制工具 `kamctl` 和 `kamdbctl` 的配置文件。你需要编辑并设置\
  \ `SIP_DOMAIN` 为你的 SIP 服务域名，并将 `DBENGINE` 设置为 MySQL，也可以使用其他数据库后端。\n\n```conf\n##\
  \ 你的 SIP 域名\nSIP_DOMAIN=sip.falcot.com\n## ch 根目录\n# $CHROOT_DIR=\"/path/to/chrooted/directory\"\
  \n## 数据库类型: MYSQL, PGSQL, ORACLE, DB_BERKELEY, DBTEXT, 或 SQLITE\n# 默认情况下都不加载\n#\
  \ 如果你想用 kamdbctl 设置数据库，你至少必须指定\n# 此参数。\nDBENGINE=MYSQL\n```\n\n现在我们关注配置文件 `/etc/kamailio/kamailio.cfg`。Falcot\
  \ 需要用户认证和持久化用户位置，因此他们在该文件的顶部添加了以下 `#!define` 指令：\n\n```conf\n#!KAMAILIO\n# # Kamailio\
  \ (OpenSER) SIP 服务器 v5.2 - 默认配置脚本\n# - web: https://www.kamailio.org\n# - git: https://github.com/kamailio\n\
  #!define WITH_MYSQL\n#!define WITH_AUTH\n#!define USRLDB\n```\n\nKamailio 需要一个数据库结构，我们可以运行\
  \ `kamdbctl` 创建。\n\n最后，我们可以通过 `kamctl` 添加一些用户。\n\n```bash\nkamctl add roland secret_password\n\
  ```\n\n一切配置好后，你可以通过 `systemctl restart kamailio` 启动或重启服务，你可以提供 IP 地址和端口（5090 是默认端口）进行连接。用户拥有\
  \ `roland@sip.falcot.com`，可以使用客户端登录（参见第 13.10 节，“实时软件”）。\n\n## 11.8.4. XMPP 服务器\n\
  \nXMPP 服务器管理本地 XMPP 用户与公共网上其他域 XMPP 用户之间的连接。\n\n*   **词汇**区别？\n\nXMPP 有时被称为 Jabber。事实上，Jabber\
  \ 是一个商标，而 XMPP 是该标准的正式名称。\n\n*   Prosody 是一种在 Debian 服务器上运行良好的 XMPP 服务器。\n\n###\
  \ 11.8.4.1. 安装 XMPP 服务器\n\n安装 `prosody` 包。\n\n查看配置文件 `/etc/prosody/prosody.cfg.lua`。最重要的是插入允许管理服务器的用户\
  \ JID。\n\n```lua\nadmins = { \"joe@falcot.com\" }\n```\n\n每个域名也需要一个单独的文件。复制 `/etc/prosody/conf.avail/example.com.cfg.lua`\
  \ 示例并作为起点。这里是 `falcot.com.cfg.lua`：\n\n```lua\nVirtualHost \"falcot.com\"\n    enabled\
  \ = true\n    ssl = { key = \"/etc/ssl/private/falcot.com-key.pem\"; certificate\
  \ = \"/etc/ssl/public/falcot.com.pem\"; }\n    -- 在 conference.example.com 上设置 MUC（多用户聊天）服务器：\n\
  \    Component \"conference.falcot.com\" \"muc\"\n```\n\n要启用该域名，在 `/etc/prosody/conf.d/`\
  \ 中有一个软链接。以这种方式创建它：\n\n\n\n\n\n```bash\nln -s /etc/prosody/conf.avail/falcot.com.cfg.lua\
  \ /etc/prosody/conf.d/\n```\n\n重启服务以使用新配置。\n\n### 11.8.4.2. 管理 XMPP 服务器\n\n可以使用\
  \ `prosodyctl` 命令行工具执行某些管理操作。例如，要添加 `/etc/prosody/prosody.cfg.lua` 中指定的管理员账户：\n\n\
  ```bash\nprosodyctl adduser joe@falcot.com\n```\n\n更多关于如何自定义配置的细节，请参考 [Prosody 在线文档](https://prosody.im/doc/configure)。\n\
  \n### 11.8.5. 在端口 443 上运行服务\n\n某些管理员倾向于将所有 RTC 服务运行在 443 端口上。这有助于用户从酒店和机场等远程位置进行连接，在这些地方其他端口可能会被封，或者互联网流量会通过\
  \ HTTP 代理服务器路由。\n\n要使用此策略，每个服务（SIP、XMPP 和 TURN）都需要不同的 IP 地址。由于 Linux 支持在单个主机上使用多个\
  \ IP 地址，所有服务仍然可以位于同一主机上。端口号 443 必须在每个进程的配置文件以及 DNS SRV 记录中指定。\n\n### 11.8.6. 添加\
  \ WebRTC\n\nFalcot 希望让客户直接从网站拨打电话。Falcot 管理员还希望将 WebRTC 作为灾难恢复计划的一部分，以便员工可以在家里使用网络浏览器登录公司电话系统，并在紧急情况下正常工作。\n\
  \n**实践中** 尝试 WebRTC\n\n如果你以前没有尝试过 WebRTC，有许多网站提供在线演示和测试设施。\n\n→ [`www.sip5060.net/test-calls`](https://www.sip5060.net/test-calls)\n\
  \nWebRTC 是一项快速演进的技术，使用测试 发行版中的包至关重要。另一个选项是编译软件。\n\nWebRTC 使用简单的 API 为浏览器和移动应用提供\
  \ RTC，它是免费软件，并由 Google 开发。\n\n→ [`webrtc.org`](https://webrtc.org)\n\n一种非常灵活的方法是使用\
  \ GStreamer 的 WebRTC 实现。它支持基于流水线的多媒体应用程序，允许开发有趣且高效的应用程序。一个很好的起点是由该开发公司 Centricular\
  \ 提供的演示：\n\n→ [`github.com/centricular/gstwebrtc-demos`](https://github.com/centricular/gstwebrtc-demos)\n\
  \n更高级的点击拨号网站通常使用服务器端脚本来动态生成 `config.js` 文件。[DruCall](https://www.drupal.org/project/drucall)\
  \ 源代码演示了如何使用 PHP 实现此功能。\n\n本章仅采样了可用服务器软件的一小部分；然而，大多数常见的网络服务都已过描述。现在是时候进入更具技术性的章节了：我们将更深入地探讨某些概念，描述大规模部署和虚拟化。\n\
  \n# 第 12 章：高级管理\n\n本章将重新审视我们已经描述过的某些方面，但视角有所不同：我们不再研究安装单台计算机，而是研究大规模部署系统；我们不再在安装时创建\
  \ RAID 或 LVM 卷，而是学习如何手动创建，以便稍后可以修改最初的选择。最后，我们将讨论监控工具和虚拟化技术。因此，本章特别针对专业管理员，而相对较少关注负责家庭网络的个人。\n\
  \n# 12.1. RAID 和 LVM\n\n第 4 章，*安装* 从安装程序的角度介绍了这些技术，以及它如何整合它们以便从开始就简化部署。在初始安装之后，管理员必须能够处理不断变化的存储空间需求，而无需诉诸昂贵的重新安装。因此，他们必须理解操作\
  \ RAID 和 LVM 卷所需的工具。\n\nRAID 和 LVM 都是将挂载卷从其物理对应物（实际硬盘或其分区）中抽象出来的的技术；前者通过引入冗余来确保在硬件故障时的数据安全和可用性，后者使卷管理更加灵活，且不依赖于底层磁盘的实际大小。在这两种情况下，系统最终都会新的块设备，这些设备可以用于创建文件系统或交换空间，而不一定将它们映射到某个物理磁盘上。RAID\
  \ 和 LVM 的背景完全不同，但它们的功能可以重叠，这就是为什么它们经常被放在一起提到。\n\n**视角** Btrfs 结合了 LVM 和 RAID\n\n\
  虽然 LVM 和 RAID 是介于磁盘块设备和文件系统之间的两个不同内核子系统，但 `btrfs` 是一个文件系统（最初在 Oracle 开发），它声称结合了\
  \ LVM 和 RAID 的功能以及更多。\n\n→ [`btrfs.wiki.kernel.org/index.php/Main_Page`](https://btrfs.wiki.kernel.org/index.php/Main_Page)\n\
  \n值得注意的特性包括随时对文件系统树拍摄快照。这种快照最初不占用任何磁盘空间，只有当其中一个副本被修改时，数据才会复制。文件系统还处理文件的透明压缩，且校验和确保了所有存储数据的完整性。\n\
  \n在 RAID 和 LVM 的情况下，内核都提供一个块设备，类似于对应硬盘或分区。当应用程序或内核的其他部分需要访问此类设备时，适当的子系统会将块路由到物理层。根据配置的不同，该块可以存储在一个或多个磁盘上，其物理位置可能并不与设备的位置直接对应。\n\
  \n### 12.1.1. 软件 RAID\n\nRAID 的意思是独立磁盘冗余阵列（Redundant Array of Independent Disks）。该系统的目标是防止数据丢失，并在磁盘故障时确保可用性。通用原理非常简单：数据存储在多个磁盘上而不是仅一个磁盘上，并具有可配置的冗余级别。根据这种冗余程度，即使在发生意外磁盘故障的情况下，也可以从剩余磁盘中无损地重建数据。\n\
  \n**文化** *独立*还是*廉价*？\n\nRAID 中的 I 最初代表 *廉价*（inexpensive），因为 RAID 允许在不需要投资昂贵磁盘的情况下大幅提高数据安全性。然而，可能由于形象方面的考虑，现在更习惯性地认为代表\
  \ *独立*（independent），这就不带有“廉价”的负面含义。\n\n具有足够冗余的 RAID 系统在磁盘故障时可以透明地保持运行；栈的上层（应用程序）即使发生故障也可以继续访问数据。当然，这种降级模式会对性能产生影响，且冗余会减少，因此进一步的磁盘故障可能导致数据丢失。因此在实践中，人们将努力让这种降级模式仅持续更换故障磁盘所需。一旦新磁盘到位，RAID\
  \ 系统就可以重建所需的数据以返回安全模式。\n\n当 RAID 通过硬件实现时，其配置通常在 BIOS 设置工具中进行，内核会将 RAID 阵列视为单个磁盘，它将作为一个标准物理磁盘工作，尽管设备名称可能不同（取决于驱动程序）。\n\
  \n\n\n\n\n本书我们只关注软件 RAID。\n\n### 12.1.1.1.不同的 RAID 级别\n\nRAID 实际上并不是单一系统，而是一系列通过其级别标识的系统；这些级别之间的区别在于它们的布局以及它们提供的冗余量。冗余越多，防错能力就越强，因为系统能够在出现更多磁盘故障的情况下继续工作。与之对应的代价是，对于给定的磁盘组，可用空间会收缩；从另一个角度来看，存储相同数量的数据需要更多的磁盘。\n\
  \n#### 线性 RAID (Linear RAID)\n\n尽管内核的 RAID 子系统允许创建“线性 RAID（`linear RAID`）”，但这并并不是真正的\
  \ RAID，因为这种设置不涉及任何冗余。内核仅仅是将几块磁盘端到端地聚合起来，并将生成的聚合卷作为一个虚拟磁盘（一个块设备）提供。这几乎是它唯一的功能了。这种设置很少被单独使用（异常情况见后文），特别是因为缺乏冗余意味着任何一个磁盘的故障都会导致整个聚合卷（因此所有数据）无法使用。\n\
  \n#### RAID-0\n\n此级别也不提供任何冗余，但磁盘并不是简单地一个接一个地连接在一起：它们被划分为“条带（`stripes`）”，虚拟设备上的块存储在交替的物理磁盘的条带上。例如，在双磁盘的\
  \ RAID-0 设置中，虚拟设备的偶数号块将存储在第一个物理磁盘上，而奇数号块将存储在第二个物理磁盘上。\n\n该系统并不旨在提高可靠性，因为（与线性情况一样），一旦有一块磁盘故障，所有数据的可用性就会受到威胁，但它的目的是提高性能：在顺序访问大量连续数据时，内核能够并行地从两个磁盘上读取（或向它们写入）数据，从而提高数据传输率。磁盘被\
  \ RAID 设备完全利用，因此它们的尺寸应该保持相同，以防丢失性能。\n\nRAID-0 的使用正在减少，它的利基市场已被 LVM 填满（见后文）。\n\n\
  #### RAID-1\n\n此级别被称为“RAID 镜像（`RAID mirroring`）”，是既简单又最广泛使用的设置。在标准形式下，它使用两个相同大小物理磁盘，并提供同样大小逻辑卷。数据以相同的方式存储在两个磁盘上，因此有了“镜像”的绰号。当其中一个磁盘故障时，数据在另一个磁盘上仍然可用。对于真正关键的数据，RAID-1\
  \ 当然可以设置在两个以上的磁盘上，这会直接影响硬件成本与可用有效负载空间之间的比例。\n\n**注意** 磁盘和簇大小\n\n如果在镜像中设置了两个不同大小的磁盘，较大的磁盘将不会被完全使用，因为它包含与最小磁盘相同的数据，且没有更多内容。因此，RAID-1\
  \ 卷提供的有效可用空间等于阵列中最小磁盘的大小。这对于更高 RAID 级别的 RAID 卷同样适用，尽管冗余的存储方式不同。\n\n因此，在设置 RAID 阵列时（RAID-0\
  \ 和“线性 RAID”除外），仅组合尺寸相同或非常接近的磁盘，以避免浪费资源。\n\n**注意** 备用磁盘 (Spare disks)\n\n包含冗余的 RAID\
  \ 级别允许为阵列分配比需要更多的磁盘。当主磁盘故障时，额外的磁盘将作为备用盘。例如，在两个磁盘加一个备用的镜像中，如果前两个磁盘中的一个故障，内核将自动（并立即）使用备用磁盘重建镜像，从而在重建完成后仍能保证冗余。这可以作为关键数据的另一种保护措施。\n\
  \n人们可能会奇怪这为什么比从开始在三块磁盘上进行镜像更好。“备用磁盘”配置的优势在于，备用磁盘可以在多个 RAID 卷之间共享。例如，你可以拥有三个镜像卷，即使在一个磁盘故障的情况下也能保证冗余，而只需要七块磁盘（三对，加一个共享备用盘），而不是三个三元组所需的九块磁盘。\n\
  \n这种 RAID 级别虽然昂贵（因为最好只有物理存储空间的一半是可用的），但在实践中被广泛使用。它易于理解，并且允许非常简单的备份：由于两个磁盘的内容完全相同，可以临时提取其中一个而不对运行中的系统产生影响。读取性能通常会提高，因为内核可以并行地在每个磁盘上读取一半的数据，而写入性能不会被太严重地降低。对于\
  \ N 块磁盘的 RAID-1 阵列，即使发生 N-1 块磁盘故障，数据仍然可用。\n\n#### RAID-4\n\n这种 RAID 级别并不广泛使用，它使用\
  \ N 块磁盘存储有用数据，并使用一个额外的磁盘存储冗余信息。如果该磁盘故障，系统可以从其他 N 块磁盘中重建其内容。如果 N 块数据磁盘中的一个故障，剩余的\
  \ N-1 块结合“校验”磁盘就包含了重建所需数据的信息。\n\nRAID-4 并不昂贵，因为只涉及几分之一的成本增加，且对读取性能没有明显影响，但写入会变慢。此外，由于向\
  \ N 块磁盘中的任何一个写入都会涉及对校验磁盘的写入，后者的写入次数比前者多得多，其寿命可能会急剧缩短。RAID-4 阵列上的数据安全仅能容忍一块磁盘故障（在\
  \ N+1 范围内）。\n\n#### RAID-5\n\nRAID-5 解决了 RAID-4 的不对性问题：校验块分布在所有 N+1 块磁盘上，没有某个特定的磁盘具有特殊角色。\n\
  \n读取和写入性能与 RAID-4 相同。在这里，系统在最多一个磁盘故障（在 N+1 范围内）时仍保持功能，但仅此如此。\n\n#### RAID-6\n\n\
  RAID-6 可以被认为是 RAID-5 的扩展，其中每个 N 块序列涉及两个冗余块，每个此类 N+2 块序列分布在 N+2 块磁盘上。\n\n这种 RAID\
  \ 级别比之前的稍微贵一些，但它提供了额外的安全，因为最多允许两块磁盘（在 N+2 范围内）故障而不会损害数据。对应的代价是写入操作现在涉及写入一个数据块和两个冗余块，使得它们更慢。\n\
  \n#### RAID-1+0\n\nRAID-1+0 严格并不是 RAID 级别，而是两个 RAID 组的堆叠。从 2×N 块磁盘开始，首先将其成对设置为 N\
  \ 个 RAID-1 卷；然后将这 N 个卷聚合在一起，通过“线性 RAID”或（越来越多地）通过 LVM。后者这种情况没有问题。\n\nRAID-1+0 可以忍受多次磁盘故障：在上述\
  \ 2×N 阵列中，只要每个 RAID-1 对中至少有一块磁盘继续工作，就可以生存。\n\n**进阶** RAID-10\n\nRAID-10 通常被认为是 RAID-10\
  \ 的同义词，但 Linux 的一个特性使其实际上变成了一种泛化。。这种设置允许每个块都存储在两个不同的磁盘上，即使磁盘数量为奇数也是，副本是根据配置模型分布的。\n\
  \n\n\n\n*   `sdc` 磁盘，4 GB，完全可用；\n*   在 `sdd` 磁盘上，只有分区 `sdd2`（约 4 GB）可用；\n*   最后，一个\
  \ `sde` 磁盘，同样为 4 GB，完全可用。\n\n***\n\n### 注意：识别现有 RAID 卷\n\n`/proc/mdstat` 文件列出了现有卷及其状态。在创建新的\
  \ RAID 卷时，应注意不要与现有的卷重名。\n\n***\n\n### 构建 RAID-0 卷\n\n我们将使用这些物理元素构建两个卷，一个是 RAID-0，另一个是镜像（RAID-1）。让我们从\
  \ RAID-0 卷开始：\n\n```bash\nmdadm --create /dev/md0 --level=0 --raid-devices=2 /dev/sdb\
  \ /dev/sdc\nmdadm: Defaulting to version 1.2 metadata\nmdadm: array /dev/md0 started.\n\
  mdadm --query /dev/md0\n/dev/md0: 8.00GiB raid0 2 devices, 0 spares. Use mdadm --detail\
  \ for more detail.\nmdadm --detail /dev/md0\n/dev/md0: Version : 1.2\nCreation Time\
  \ : Tue Jun 25 08:47:49 2019\nRaid Level : raid0\nArray Size : 8378368 (7.99 GiB\
  \ 8.58 GB)\nRaid Devices : 2\nTotal Devices : 2\nPersistence : Superblock is persistent\n\
  Update Time : Tue Jun 25 08:47:49 2019\nState : clean\nActive Devices : 2\nWorking\
  \ Devices : 2\nFailed Devices : 0\nSpare Devices : 0\nChunk Size : 512K\nConsistency\
  \ Policy : none\nName : mirwiz:0 (local to host debian)\nUUID : 146e104f:66ccc06d:71c262d7:9af1fbc7\n\
  Events : 0\nNumber Major Minor RaidDevice State\n0 8 32 0 active sync /dev/sdb\n\
  1 8 48 1 active sync /dev/sdc\nmkfs.ext4 /dev/md0\nmke2fs 1.44.5 (15-Dec-2018)\n\
  Discarding device blocks: done\nCreating filesystem with 2094592 4k blocks and 524288\
  \ inodes\nFilesystem UUID: 413c3dff-ab5e-44e7-ad34-cf1a029cfe98\nSuperblock backups\
  \ stored on blocks: 32768, 98304, 163840, 229376, 294912, 819200, 884736, 1605632\n\
  Allocating group tables: done\nWriting inode tables: done\nCreating journal (16384\
  \ blocks): done\nWriting superblocks and filesystem accounting information: done\n\
  mkdir /srv/raid-0\nmount /dev/md0 /srv/raid-0\ndf -h /srv/raid-0\nFilesystem Size\
  \ Used Avail Use% Mounted on\n/dev/md0 7.9G 36M 7.4G 1% /srv/raid-0\n```\n\n`mdadm\
  \ --create` 命令需要几个参数：要创建的卷名称（`/dev/md*`，MD 代表 *Multiple Device* 即多设备）、RAID 级别、磁盘数量（尽管这主要在\
  \ RAID-1 及以上级别才有意义，但它是强制性的）以及使用的物理驱动器。一旦创建了设备，我们就可以像使用分区一样使用它，在其上面创建文件系统、挂载该文件系统等。注意，我们在\
  \ `md0` 上创建 RAID-0 卷纯属巧合，数组的编号不需要与选择的冗余程度相关。还可以通过给 `mdadm` 参数（例如 `/dev/md/linear`\
  \ 而不是 `/dev/md0`）来创建命名的 RAID 数组。\n\n### 构建 RAID-1 卷\n\n创建 RAID-1 的方式类似，区别仅在创建完成后变得明显：\n\
  \n```bash\nmdadm --create /dev/md1 --level=1 --raid-devices=2 /dev/sdd2 /dev/sde\n\
  mdadm: Note: this array has metadata at the start and may not be suitable as a boot\
  \ device. If you plan to store '/boot' on this device please ensure that your boot-loader\
  \ understands md/v1.x metadata, or use --metadata=0.90\nmdadm: largest drive (/dev/sdd2)\
  \ exceeds size (4192192K) by more than 1%\nContinue creating array?\ny\nmdadm: Defaulting\
  \ to version 1.2 metadata\nmdadm: array /dev/md1 started.\nmdadm --query /dev/md1\n\
  /dev/md1: 4.00GiB raid1 2 devices, 0 spares. Use mdadm --detail for more detail.\n\
  mdadm --detail /dev/md1\n/dev/md1: Version : 1.2\nCreation Time : Tue Jun 25 10:21:22\
  \ 2019\nRaid Level : raid1\nArray Size : 4189184 (4.00 GiB 4.29 GB)\nUsed Dev Size\
  \ : 4189184 (4.00 GiB 4.29 GB)\nRaid Devices : 2\nTotal Devices : 2\nPersistence\
  \ : Superblock is persistent\nUpdate Time : Tue Jun 25 10:22:03 2019\nState : clean,\
  \ resyncing\nActive Devices : 2\nWorking Devices : 2\nFailed Devices : 0\nSpare\
  \ Devices : 0\nConsistency Policy : resync\nResync Status : 93% complete\nName :\
  \ mirwiz:1 (local to host debian)\nUUID : 7d123734:9677b7d6:72194f7d:9050771c\n\
  Events : 16\nNumber Major Minor RaidDevice State\n0 8 64 0 active sync /dev/sdd2\n\
  1 8 80 1 active sync /dev/sde\nmdadm --detail /dev/md1\n/dev/md1: [...]\n```\n\n\
  ***\n\n### 提示：现有 RAID 卷\n`mdadm --detail /dev/md1`\n`/dev/md1: [...]`\n\n***\n\n\
  ### 提示：磁盘不足\n\n几点需要说明。首先，`mdadm` 注意到元素的大小不同；因为会导致某些数据丢失。更重要的是，注意 RAID 的状态。然而，磁盘的初始内容并不重要，因为人们只需要知道在创建卷（特别是文件系统）之后写入的数据是可以访问的即可。\n\
  \n因此，人们可能会疑惑在创建时同步两块磁盘的意义何在。对于我们已知的那些在写入之后只会读取的卷区域，关心其内容是否相同有什么用呢？\n\n幸运的是，通过向 `mdadm`\
  \ 传递 `--assume-clean` 选项可以避免这个同步阶段。然而，在初始数据将被读取的情况下（例如，如果物理磁盘上已经存在文件系统），此选项可能会导致意外，这就是为什么它默认没有启用。\n\
  \n***\n\n### 提示：以降级模式启动镜像\n有时，当人们想要启动 RAID-1 时，两块磁盘无法立即可用，例如因为计划包含的一个磁盘已用于存储数据。在这种情况下，通过在\
  \ `mdadm` 的参数中传递 `missing` 而不是设备文件，可以故意创建一个降级的 RAID-1 数组。一旦数据被复制到“镜像”，就可以添加旧磁盘。\n\
  \n### 提示：不带同步设置镜像\nRAID-1 卷通常作为新磁盘创建，通常是空白的。因此，磁盘的初始内容并不重要，因为人们只需要知道创建后写入的数据是可以访问的即可。\n\
  \n***\n\n现在让我们看看 RAID-1 数组中的一个元素发生故障会发生什么。`mdadm` 特别是 `--fail` 选项允许模拟这种磁盘故障：\n\n\
  ```bash\nmdadm /dev/md1 --fail /dev/sde\nmdadm: set /dev/sde faulty in /dev/md1\n\
  mdadm --detail /dev/md1\n/dev/md1: [...]\nUpdate Time : Tue Jun 25 11:03:44 2019\n\
  State : clean, degraded\nActive Devices : 1\nWorking Devices : 1\nFailed Devices\
  \ : 1\nSpare Devices : 0\nConsistency Policy : resync\nName : mirwiz:1 (local to\
  \ host debian)\nUUID : 7d123734:9677b7d6:72194f7d:9050771c\nEvents : 20\nNumber\
  \ Major Minor RaidDevice State\n0 0 0 removed\n1 8 80 1 active sync /dev/sdd2\n\
  0 8 64 - faulty /dev/sde\n```\n\n\n\n\n卷的内容仍然可以访问（如果它已挂载，应用程序不会察觉到异常），但数据安全不再有保证：如果\
  \ `sdd` 磁盘也发生故障，数据将会丢失。我们希望避免这种风险，因此将用新磁盘 `sdf` 替换故障磁盘：\n\n```bash\n# mdadm /dev/md1\
  \ --add /dev/sdf\nmdadm: added /dev/sdf #\n# mdadm --detail /dev/md1\n/dev/md1:\
  \ [...] Raid Devices : 2 Total Devices : 3 Persistence : Superblock is persistent\
  \ Update Time : Tue Jun 25 11:09:42 2019 State : clean, degraded, recovering Active\
  \ Devices : 1 Working Devices : 2 Failed Devices : 1 Spare Devices : 1 Consistency\
  \ Policy : resync Rebuild Status : 27% complete Name : mirwiz:1 (local to host debian)\
  \ UUID : 7d123734:9677b7d6:72194f7d:9050771c Events : 26 Number Major Minor RaidDevice\
  \ State 2 8 96 0 spare rebuilding /dev/sdf 1 8 80 1 active sync /dev/sdd2 0 8 64\
  \ - faulty /dev/sde #\n[...] [...] #\n# mdadm --detail /dev/md1\n/dev/md1: [...]\
  \ Update Time : Tue Jun 25 11:10:47 2019 State : clean Active Devices : 2 Working\
  \ Devices : 2 Failed Devices : 1 Spare Devices : 0 Consistency Policy : resync Name\
  \ : mirwiz:1 (local to host debian) UUID : 7d123734:9677b7d6:72194f7d:9050771c Events\
  \ : 39 Number Major Minor RaidDevice State 2 8 96 0 active sync /dev/sdd2 1 8 80\
  \ 1 active sync /dev/sdf 0 8 64 - faulty /dev/sde\n```\n\n在这里，内核再次自动触发了重建阶段，在此期间，虽然卷仍然可用，但处于降级模式。一旦重建完成，RAID\
  \ 阵列将恢复正常状态。此时可以告诉系统 `sde` 磁盘将从阵列中移除，以便在两个磁盘上形成经典的 RAID 镜像：\n\n```bash\n# mdadm\
  \ /dev/md1 --remove /dev/sde\nmdadm: hot removed /dev/sde from /dev/md1 #\n# mdadm\
  \ --detail /dev/md1\n/dev/md1: [...] Number Major Minor RaidDevice State 2 8 96\
  \ 0 active sync /dev/sdd2 1 8 80 1 active sync /dev/sdf\n```\n\n从那时起，可以在下次关闭服务器时物理移除驱动器，或者在硬件配置支持热插拔的情况下直接移除。此类配置包括某些\
  \ SCSI 控制器、大多数 SATA 磁盘以及通过 USB 或 Firewire 运行的外部驱动。\n\n### 12.1.1.3. 备份配置\n\n大部分关于\
  \ RAID 卷的元数据直接存在组成阵列的磁盘上，以便内核在系统启动时检测到阵列及其组件并自动组装它们。然而，建议备份此配置，因为这种检测并非万无一失，而且它往往恰恰会在敏感情况下发生故障。在我们的示例中，如果\
  \ `sde` 磁盘故障是真实的（而不是模拟的），并且在没有移除该 `sde` 磁盘的情况下重启系统，该磁盘可能会在重启期间由于探测而重新开始工作。此时内核将拥有三个物理元素，每个元素都声称包含同一个\
  \ RAID 卷的一半。另一个混淆来源可能是当来自两台服务器的 RAID 卷被合并到一台服务器时。如果这些磁盘在移动之前运行正常，内核能够正确检测并重新组装配对；但如果移动的磁盘在旧服务器上已聚合为\
  \ `md1`，而新服务器已经有一个 `md1`，则其中一个镜像将被重命名。\n\n因此，备份配置至少是重要的。标准做法是编辑 `/etc/mdadm.conf`\
  \ 文件，此处列出了一个示例：\n\n\n\n\n然而，让 VG（卷组）的物理组件之间具有某种同质性，并将 VG 划分为具有相似使用模式的逻辑卷是有意义的。例如，如果可用硬件包含快速磁盘和较慢的磁盘，可以将快速磁盘聚组成\
  \ VG，而将较慢的磁盘组成另一个 VG；然后可以将第一个 VG 的块分配给需要快速数据访问的应用程序，而第二个则留给需求较低的任务。\n\n无论如何，请记住\
  \ LV（逻辑卷）并不特别绑定到任何一个 PV（物理卷）。可以影响 LV 数据的物理存储位置，但日常使用并不需要这种功能。相反：当 VG 的物理组件集发生变化时，特定\
  \ LV 的物理存储位置可以在磁盘之间进行迁移（当然，仍在分配给 VG 的 PV 范围内）。\n\n## 设置 LVM\n\n现在让我们逐步按照一个典型用例来设置\
  \ LVM 的过程：我们想要简化复杂的存储状况。这种情况通常发生在经历了一段长期且复杂的临时措施积累之后。为了说明起，我们考虑一台服务器，其存储需求随时间而变化，最终变成了一个在几块部分使用的磁盘上的可用分区迷宫。具体来说，可用分区如下：\n\
  \n* 在 `sdb` 磁盘上，有一个 `sdb2` 分区，4 GB；\n* 在 `sdc` 磁盘上，有一个 `sdc3` 分区，3 GB；\n* `sdd`\
  \ 磁盘（4 GB）完全可用；\n* 在 `sdf` 磁盘上，有一个 `sdf1` 分区（4 GB）以及一个 `sdf2` 分区（5 GB）。\n\n此外，假设磁盘\
  \ `sdb` 和 `sdf` 比另外两个磁盘快。\n\n我们的目标为三个不同的应用程序设置三个逻辑卷：一个需要 5 GB 存储空间的文件服务器，一个数据库（1\
  \ GB）以及一些用于备份的空间（12 GB）。前两个需要良好的性能，但备份在访问速度方面的临迫性较小。所有这些限制都阻止了单独使用分区；而使用 LVM 可以抽象设备的物理大小，因此唯一的限制就是总可用空间。\n\
  \n所需的工具位于 `lvm2` 包及其依赖项。安装后，设置 LVM 需要三个步骤，对应于三个层级的概念。\n\n首先，我们使用 `pvcreate` 准备物理卷：\n\
  \n```bash\n# pvdisplay\n# pvcreate /dev/sdb2\nPhysical volume \"/dev/sdb2\" successfully\
  \ created. #\n# pvdisplay\n\"/dev/sdb2\" is a new physical volume of \"4.00 GiB\"\
  \ --- NEW Physical volume --- PV Name /dev/sdb2 VG Name PV Size 4.00 GiB Allocatable\
  \ NO PE Size 0 Total PE 0 Free PE 0 Allocated PE 0 PV UUID z4Clgk-T5a4-C27o-1P0E-lIAF-OeUM-e7EMwq\
  \ #\n# for i in sdc3 sdd sdf1 sdf2 ; do pvcreate /dev/$i ; done\nPhysical volume\
  \ \"/dev/sdc3\" successfully created. Physical volume \"/dev/sdd\" successfully\
  \ created. Physical volume \"/dev/sdf1\" successfully created. Physical volume \"\
  /dev/sdf2\" successfully created. #\n# pvdisplay -C\nPV VG Fmt Attr PSize PFree\
  \ /dev/sdb2 lvm2 --- 4.00g 4.00g /dev/sdc3 lvm2 --- 3.00g 3.00g /dev/sdd lvm2 ---\
  \ 4.00g 4.00g /dev/sdf1 lvm2 --- 4.00g 4.00g /dev/sdf2 lvm2 --- <5.00g <5.00g\n\
  ```\n\n到目前为止一切正常；注意 PV 既可以设置在整个磁盘上，也可以设置在单个分区上。如上所示，`pvdisplay` 命令列出了现有 PV，有两种可能的输出格式。\n\
  \n现在让我们使用 `vgcreate` 将这些物理元素组装成 VG。我们将仅来自快速磁盘的 PV 收集到一个 `vg_critical` VG 中；另一个 VG\
  \ `vg_normal` 也将包含较慢的元素。\n\n```bash\n# vgdisplay\n# vgcreate vg_critical /dev/sdb2\
  \ /dev/sdf1\nVolume group \"vg_critical\" successfully created #\n# vgdisplay\n\
  --- Volume group --- VG Name vg_critical System ID Format lvm2 Metadata Areas 2\
  \ Metadata Sequence No 1 VG Access read/write VG Status resizable MAX LV 0 Cur LV\
  \ 0 Open LV 0 Max PV 0 Cur PV 2 Act PV 2 VG Size 7.99 GiB PE Size 4.00 MiB Total\
  \ PE 2046 Alloc PE / Size 0 / 0 Free PE / Size 2046 / 7.99 GiB VG UUID wAbBjx-d82B-q7St-0KFf-z40h-w5Mh-uAXkNZ\
  \ #\n# vgcreate vg_normal /dev/sdc3 /dev/sdd /dev/sdf2\nVolume group \"vg_normal\"\
  \ successfully created #\n# vgdisplay -C\nVG #PV #LV #SN Attr VSize VFree vg_critical\
  \ 2 0 0 wz--n- 7.99g 7.99g vg_normal 3 0 0 wz--n- <11.99g <11.99g\n```\n\n在这里，命令仍然相当直观（且\
  \ `vgdisplay` 提供了两种输出格式）。注意，完全可以将同一块物理磁盘的两个分区用于两个不同的 VG 中。还要注意我们使用了 `vg_` 前缀来命名\
  \ VG，但这仅仅是一种约定。\n\n我们现在有两个大小约为 8 GB 和 12 GB 的“虚拟磁盘”。现在让我们将它们划分为“虚拟分区”（LV）。这涉及到 `lvcreate`\
  \ 命令以及稍微稍微复杂的语法：\n\n```bash\n# lvdisplay\n# lvcreate -n lv_files -L 5G vg_critical\n\
  Logical volume \"lv_files\" created. #\n# lvdisplay\n--- Logical volume --- LV Path\
  \ /dev/vg_critical/lv_files LV Name lv_files VG Name vg_critical LV UUID W6XT08-iBBx-Nrw2-f8F2-r2y4-Ltds-UrKogV\
  \ LV Write Access read/write LV Creation host, time debian, 2019-11-30 22:45:46\
  \ -0500 LV Status available # open 0 LV Size 5.00 GiB Current LE 1280 Segments 2\
  \ Allocation inherit Read ahead sectors auto - currently set to 256 Block device\
  \ 254:0 #\n# lvcreate -n lv_base -L 1G vg_critical\nLogical volume \"lv_base\" created.\
  \ #\n# lvcreate -n lv_backups -L 11.98G vg_normal\nRounding up size to full physical\
  \ extent 11.98 GiB Logical volume \"lv_backups\" created. #\n# lvdisplay -C\nLV\
  \ VG Attr LSize Pool Origin% Meta% Log Cpy%Sync lv_base vg_critical -wi-a--- 1.00g\
  \ lv_files vg_critical -wi-a--- 5.00g lv_backups vg_normal -wi-a--- 11.98g\n```\n\
  \n创建逻辑卷时需要两个参数；它们必须作为选项传递给 `lvcreate`。要创建的 LV 名称通过 `-n` 选项指定，大小通常使用 `-L` 选项给出。当然，我们还需要告诉命令在哪个\
  \ VG 上进行操作，因此命令行最后一个参数是 VG。\n\n### 进阶 lvcreate 选项\n\n`lvcreate` 命令有几个选项可以调整 LV 的创建方式。\n\
  \n让我们先描述 `-l` 选项，通过该选项可以以块的数量给出 LV 的大小（而不是我们上面使用的“人类”单位）。这些块（在 LVM 术语中称为 PE，即*物理区*，physical\
  \ extents）是 PV 中连续的存储空间单元，它们不能跨越 LV 划分。当人们想要精确地定义 LV 的存储空间时（例如使用所有可用空间），`-l` 选项可能比\
  \ `-L` 更好用。\n\n还可以提示 LV 的物理位置，以便其区区被存储在特定的 PV 上（当然，仍在分配给 VG 的 PV 范围内）。由于我们知道 `sdb`\
  \ 比 `sdf` 快，如果我们想让数据库服务器相对于文件服务器获得优势，我们可能想将 `lv_base` 存储在那里。命令行变为：`lvcreate -n lv_base\
  \ -L 1G vg_critical /dev/sdb2`。注意，如果 PV 没有足够的空区，此命令可能会失败。在我们的示例中，我们可能需要在创建 `lv_files`\
  \ 之前创建 `lv_base` 以避免这种情况——或者使用 `pvmove` 命令在 `sdb2` 上释放一些空间。\n\n逻辑卷一旦创建，将以块设备文件的形式出现在\
  \ `/dev/mapper/` 中：\n\n\n\n\n\n```\n# ls -l /dev/mapper\ntotal 0 crw------- 1 root\
  \ root 10, 236 Jun 10 16:52 control lrwxrwxrwx 1 root root 7 Jun 10 17:05 vg_critical-lv_base\
  \ -> ../dm-1 lrwxrwxrwx 1 root root 7 Jun 10 17:05 vg_critical-lv_files -> ../dm-0\
  \ lrwxrwxrwx 1 root root 7 Jun 10 17:05 vg_normal-lv_backups -> ../dm-2\n# ls -l\
  \ /dev/dm-*\nbrw-rw---T 1 root disk 253, 0 Jun 10 17:05 /dev/dm-0 brw-rw---- 1 root\
  \ disk 253, 1 Jun 10 17:05 /dev/dm-1 brw-rw---- 1 root disk 253, 2 Jun 10 17:05\
  \ /dev/dm-2\n```\n\n*注：LVM 卷自动检测*\n\n当计算机启动时，`lvm2-activation` systemd 服务单元会执行 `vgchange\
  \ -aay` 来“激活”卷组：它会扫描可用设备；已初始化为 LVM 物理卷（PV）的设备将被注册到 LVM 子系统中；属于卷组的设备将被组装；相关的逻辑卷（LV）将被启动并变为可用。因此，在创建或修改\
  \ LVM 卷时，不需要编辑配置文件。\n\n但注意，LVM 元素（物理卷、逻辑卷和卷组）的布局备份在 `/etc/lvm/backup` 中，这在出现问题时（或只是为了窥一眼内部结构）可能非常有用。\n\
  \n为了方便操作，在与 VG 匹配的目录中还会创建便利符号链接：\n\n```\n# ls -l /dev/vg_critical\ntotal 0 lrwxrwxrwx\
  \ 1 root root 7 Jun 10 17:05 lv_base -> ../dm-1 lrwxrwxrwx 1 root root 7 Jun 10\
  \ 17:05 lv_files -> ../dm-0\n# ls -l /dev/vg_normal\ntotal 0 lrwxrwxrwx 1 root root\
  \ 7 Jun 10 17:05 lv_backups -> ../dm-2\n```\n\n随后就可以像使用标准分区一样使用 LV：\n\n```\n# mkfs.ext4\
  \ /dev/vg_normal/lv_backups\nmke2fs 1.44.5 (15-Dec-2018) Discarding device blocks:\
  \ done Creating filesystem with 3140608 4k blocks and 786432 inodes Filesystem UUID:\
  \ b9e6ed2f-cb37-43e9-87d8-e77568446225 Superblock backups stored on blocks: 32768,\
  \ 98304, 163840, 229376, 294912, 819200, 884736, 1605632, 2654208 Allocating group\
  \ tables: done Writing inode tables: done Creating journal (16384 blocks): done\
  \ Writing superblocks and filesystem accounting information: done\n# mkdir /srv/backups\n\
  # mount /dev/vg_normal/lv_backups /srv/backups\n# df -h /srv/backups\nFilesystem\
  \ Size Used Avail Use% Mounted on /dev/mapper/vg_normal-lv_backups 12G 41M 12G 1%\
  \ /srv/backups\n# [...]\n[...]\n# cat /etc/fstab\n[...] /dev/vg_critical/lv_base\
  \ /srv/base ext4 defaults 0 2 /dev/vg_critical/lv_files /srv/files ext4 defaults\
  \ 0 2 /dev/vg_normal/lv_backups /srv/backups ext4 defaults 0 2\n```\n\n从应用程序的角度来看，许多小分区现在被抽象成了一个大容量\
  \ 12 GB 卷，并且有了一个更友好的名称。\n\n### 12.1.2.3. 随时间演变的 LVM\n\n尽管聚合分区或物理磁盘的能力非常方便，但这并不是\
  \ LVM 带来的主要优势。随着时间的推移和需求的演变，它所带来的灵活性变得尤为明显。在我们的示例中，假设必须存储新的大文件，而专门用于文件服务器的 LV 太小无法容纳它们。由于我们没有使用\
  \ `vg_critical` 中的所有可用空间，我们可以扩展 `lv_files`。为此，我们将使用 `lvresize` 命令，然后使用 `resize2fs`\
  \ 相应调整文件系统：\n\n```\n# df -h /srv/files/\nFilesystem Size Used Avail Use% Mounted\
  \ on /dev/mapper/vg_critical-lv_files 4.9G 4.2G 485M 90% /srv/files\n# lvdisplay\
  \ -C vg_critical/lv_files\nLV VG Attr LSize Pool Origin Data% Meta% Move Log Cpy%Sync\
  \ Convert lv_files vg_critical -wi-ao-- 5.00g\n# vgdisplay -C vg_critical\nVG #PV\
  \ #LV #SN Attr VSize VFree vg_critical 2 2 0 wz--n- 7.99g 1.99g\n# lvresize -L 6G\
  \ vg_critical/lv_files\nSize of logical volume vg_critical/lv_files changed from\
  \ 5.00 GiB (1280 extents) to 6.00 GiB (1536 extents). Logical volume vg_critical/lv_files\
  \ successfully resized.\n# lvdisplay -C vg_critical/lv_files\nLV VG Attr LSize Pool\
  \ Origin Data% Meta% Move Log Cpy%Sync Convert lv_files vg_critical -wi-ao---- 6.00g\n\
  # resize2fs /dev/vg_critical/lv_files\nresize2fs 1.44.5 (15-Dec-2018) Filesystem\
  \ at /dev/vg_critical/lv_files is mounted on /srv/files; on-line resizing required\
  \ old_desc_blocks = 1, new_desc_blocks = 1 The filesystem on /dev/vg_critical/lv_files\
  \ is now 1572864 (4k) blocks long.\n# df -h /srv/files/\nFilesystem Size Used Avail\
  \ Use% Mounted on /dev/mapper/vg_critical-lv_files 5.9G 4.2G 1.5G 75% /srv/files\n\
  ```\n\n#### 注意：调整文件系统大小\n\n并不是所有文件系统都支持在线调整大小，因此调整卷时可能需要先卸载，然后再挂载。当然，如果想缩小分配给 LV\
  \ 的空间，必须先缩小文件系统；当调整方向相反时，顺序则相反：必须先扩展逻辑卷，再扩展文件系统。这非常直观，因为在任何时候文件系统的大小都不会超过所在的块设备（无论该设备是物理分区还是逻辑卷）。\n\
  \n`ext3`、`ext4` 和 `xfs` 文件系统可以在线扩展而无需卸载；缩小则需要卸载。`reiserfs` 则两个都不支持。\n\n#### 进阶：高级\
  \ LVM\n\nLVM 也适用于更高级的用法，可以手动指定许多细节。例如，管理员可以调整组成物理卷和逻辑卷的块的大小以及它们的物理布局。还可以在不同 PV 之间移动块，例如为了微调性能，或者在更常见的场景下，为了从\
  \ VG 中释放相应的物理磁盘。描述各个命令的帮助页通常清晰且详细。一个很好的入口点是 `lvm(8)` 帮助页。\n\n### 12.1.3. RAID 还是\
  \ LVM？\n\n一旦离开了单硬盘且使用模式不变化的简单桌面电脑场景，RAID 和 LVM 都带来了不可否认的优势。然而，RAID 和 LVM 走向两个不同的方向，目标也不同，疑问应该采用哪一个是合理的。最答案显然取决于当前和未来的需求。\n\
  \n\n\n\n\n在某些简单的情况下，这个问题并不真正存在。如果要求是保护数据免受硬件故障的影响，那么显然会在冗余磁盘阵列上设置 `RAID`，因为 `LVM`\
  \ 并没有真正解决这个问题。另一方面，如果需要一种灵活的存储方案，使卷的创建能够独立于磁盘的物理布局，那么 `RAID` 的帮助并不大，而 `LVM` 将是自然选择。\n\
  \n### 注意：如果性能很重要……\n\n如果输入/输出速度至关重要，特别是在访问时间方面，在许多组合中使用 `LVM` 和/或 `RAID` 可能会对性能产生某些影响，这可能会影响对选择哪一个的决策。然而，这些性能差异实际上非常微小，并且仅在少数用例中可以被测量出来。如果性能很重要，可以获得的最大收益是使用非旋转存储介质（`固态硬盘`或\
  \ `SSDs`）；它们的每兆字节成本高于标准硬盘，且容量通常也较小，但它们为随机访问提供了卓越的性能。如果使用模式包含许多分散在文件系统各处的输入输出操作，例如对于经常运行复杂查询的数据库，那么在\
  \ `SSD` 上运行它们的优势将远超通过在 `RAID` 上选择 `LVM` 或反之所能获得的任何收益。在这种情况下，选择应该由纯速度以外的考虑因素决定，因为性能问题最容易通过使用\
  \ `SSDs` 来解决。\n\n第三个显著的用例是人们只想将两个磁盘聚合为一个卷，可能是出于性能考虑，也是为了拥有比任何可用磁盘都大的单个文件系统。这种情况可以通过\
  \ `RAID-0`（甚至是 `linear-RAID`）和 `LVM` 卷来解决。在这种情况下，在没有额外限制的情况下（例如，为了与其余计算机保持一致，如果它们只使用\
  \ `RAID`），通常的配置选择是 `LVM`。其初始设置几乎没有更复杂，而这种复杂性的微增完全弥补了当需求变化或需要添加新磁盘时 `LVM` 带来的额外灵活性。\n\
  \n那么，当然还有一个非常有意思的用例，即存储系统既需要抵抗硬件故障，又在卷分配方面具有灵活性。`RAID` 和 `LVM` 均无法独立满足这两个需求；没关系，这正是我们同时使用两者的地方——或者说，在另一个之上使用另一个。自从\
  \ `RAID` 和 `LVM` 成熟以来，一种几乎成为标准的方案是首先通过将磁盘分组为少数大型 `RAID` 阵列来确保数据冗余，并将这些 `RAID` 阵列作为\
  \ `LVM` 物理卷；然后从这些 `LVs` 中划分出逻辑分区用于文件系统。这种设置的卖点在于，当磁盘故障时，只需要重建少数 `RAID` 阵列，从而限制了管理员花费的恢复时间。\n\
  \n让我们来看一个具体的例子：`Falcot Corp` 的公关部门需要一个视频剪辑工作站，但部门的预算不允许从底层开始投资高端硬件。决定倾向于针对工作图形特性的特定硬件（显示器和显卡），而在存储方面保留通用硬件。然而，众众所周知，数字视频对其存储确实有一些特殊要求：要存储的数据量很大，读写这些数据的吞吐率对整个系统性能非常重要（例如，比典型的访问时间更为重要）。这些限制需要用通用硬件满足，在这种情况下是两个\
  \ `300 GB` `SATA` 硬盘；系统数据以及部分用户数据也必须具备抵抗硬件故障的能力。剪辑过的视频剪辑必须是安全的，但等待剪辑的视频素材则不那么关键，因为它们仍在录像带上。\n\
  \n`RAID-1` 和 `LVM` 结合起来满足这些限制。磁盘连接到两个不同的 `SATA` 控制器上以优化并行访问并减少同时故障的风险，因此它们显示为 `sda`\
  \ 和 `sdc`。它们按照以下方案进行完全相同的分区：\n\n```\n# fdisk -l /dev/sda\nDisk /dev/sda: 300 GB,\
  \ 300090728448 bytes, 586114704 sectors Units: sectors of 1 * 512 = 512 bytes Sector\
  \ size (logical/physical): 512 bytes / 512 bytes I/O size (minimum/optimal): 512\
  \ bytes / 512 bytes Disklabel type: dos Disk identifier: 0x00039a9f Device Boot\
  \ Start End Sectors Size Id Type\n/dev/sda1 * 2048 1992060 1990012 1.0G fd Linux\
  \ raid autodetect\n/dev/sda2 1992061 3984120 1992059 1.0G 82 Linux swap / Solaris\n\
  /dev/sda3 4000185 586099395 582099210 298G 5 Extended\n/dev/sda5 4000185 203977305\
  \ 199977120 102G fd Linux raid autodetect\n/dev/sda6 203977306 403970490 199993184\
  \ 102G fd Linux raid autodetect\n/dev/sda7 403970491 586099395 182128904 93G 8e\
  \ Linux LVM\n```\n\n*   两个磁盘的第一个分区（约 `1 GB`）被组装进 `RAID-1` 卷 `md0`。该镜像直接用于存储根文件系统。\n\
  *   `sda2` 和 `sdc2` 分区被用作交换分区，提供共 `2 GB` 的交换空间。配合 `1 GB` 的 `RAM`，工作站拥有充足的可用内存。\n\
  *   `sda5` 和 `sdc5` 分区，以及 `sda6` 和 `sdc6` 被组装成两个约为 `100 GB` 的新 `RAID-1` 卷 `md1`\
  \ 和 `md2`。这两个镜像都被初始化为 `LVM` 的物理卷，并分配给卷组 `vg_raid`。因此，这个 `VG` 包含了大约 `200 GB` 的安全空间。\n\
  *   剩余分区 `sda7` 和 `sdc7` 直接用物理卷，并分配给另一个名为 `vg_bulk` 的 VG。\n\n一旦创建了 VGs，就可以以非常灵活的方式对其分区。必须记住，在\
  \ `vg_raid` 中创建的 LVs 即使其中一个磁盘故障也会保留，而在 `vg_bulk` 中创建的 LVs 则不会；另一方面，后者将在两个磁盘上并行分配，这允许大文件具有更高的读取或写入速度。\n\
  \n因此，我们将在 `vg_raid` 上创建 `lv_var` 和 `lv_home` LVs 来托管匹配的文件系统；另一个大 LV `lv_movies`\
  \ 将用于托管剪辑后的电影最终版本。另一个 VG 将被分为一个大的 `lv_rushes`（用于直接从数字摄像机导出的数据）以及一个用于临时文件的 `lv_tmp`。工作区域的位置是一个不那么直接的选择：虽然该卷需要良好的性能，但如果在剪辑会议期间发生磁盘故障，是否会有丢失工作的风险？取决于对该问题的回答，相关的\
  \ LV 将创建在另一个 VG 上。\n\n我们现在既对重要数据拥有某些冗余，又在可用空间如何划分应用程序方面具有很大的灵活性。\n\n### 注意：为什么要创建三个\
  \ RAID-1 卷？\n\n我们可以只设置一个 RAID-1 卷作为 `vg_raid` 的物理卷。那么，为什么要创建三个呢？\n\n第一个划分（`md0`\
  \ 与其他）的理由是为了数据安全：写入 `RAID-1` 镜像两个元素的数据是完全相同的，因此可以绕过 RAID 层直接挂载其中一个磁盘。例如在发生内核错误，或者\
  \ `LVM` 元数据损坏，仍然可以启动最小化系统来访问关键数据，例如 `RAID` 和 `LVM` 卷的磁盘布局；然后可以重建元数据并再次访问文件，从而使系统恢复到正常状态。\n\
  \n\n\n\n第二次划分（`md1` 与 `md2`）的理由并不那么明确，更多是由于承认未来是不确定的。当工作站首次组装时，具体的存储需求并不一定能精确确定；它们可能会随着时间的推移而演变。在我们的情况下，无法预知视频素材（video\
  \ rushes）和完整视频片段的实际存储空间需求。如果某个特定片段需要大量的素材，而用于冗余数据的 `VG` 填充率未到一半，我们可以重用它某些不需要的空间。我们可以从\
  \ `vg_raid` 中移除一个物理卷（例如 `md2`），并将其直接分配给 `vg_bulk`（如果操作预期的持续时间短到我们可以忍受性能的临时下降），或者撤销\
  \ `md2` 上的 RAID 设置，将其组件 `sda6` 和 `sdc6` 集成到大容量 VG 中（这样容量会增加 200 GB 而不是 100 GB）；然后可以根据需要扩展\
  \ `lv_rushes` 逻辑卷。\n\n# 12.2. 虚拟化\n\n虚拟化是近年来计算领域最大的进展之一。该术语涵盖了各种抽象技术，通过以不同程度的独立于实际硬件来模拟虚拟计算机。一台物理服务器可以同时托管多个相互隔离的系统。应用场景层出许多，且通常源于这种隔离性：例如具有不同配置的测试环境，或者为了安全考虑将托管服务分离到不同的虚拟机中。\n\
  \n有多种虚拟化解决方案，每种都有自己的优缺点。本书将重点关注 `Xen`、`LXC` 和 `KVM`，但其他值得关注的实现包括：\n\n*   `QEMU`\
  \ 是一个完整计算机的软件仿真器；其性能远不如原生运行的速度，但它允许在模拟硬件上运行未修改的或实验性的操作系统。它还允许模拟不同的硬件架构：例如，`amd64`\
  \ 系统可以模拟 `arm` 计算机。`QEMU` 是自由软件。→ [`www.qemu.org/`](https://www.qemu.org/)\n\n*\
  \   `Bochs` 是另一个免费虚拟机，但它只模拟 x86 架构（`i386` 和 `amd64`）。\n\n*   `VMWare` 是一种专有虚拟机；作为最老的软件之一，它也是最为人知的软件之一。它的工作原理与\
  \ `QEMU` 类似。`VMWare` 提供了如对运行中的虚拟机进行快照等高级功能。→ [`www.vmware.com/`](https://www.vmware.com/)\n\
  \n*   `VirtualBox` 是一个大部分为免费的虚拟机（某些额外组件采用专有许可）。遗憾的是，它位于 Debian 的“contrib”部分，因为它包含一些预编译文件，这些文件在没有专有编译器的情况下无法重新构建，目前仅存在于\
  \ Debian Unstable 中，因为 Oracle 的策略使其无法在 Debian 稳定版中保持安全（参见 [#794466](https://bugs.debian.org/794466)）。虽然它比\
  \ `VMWare` 年轻且仅限于 `i386` 和 `amd64` 架构，但它仍然包含一些快照和其他有趣的功能。→ [`www.virtualbox.org/`](https://www.virtualbox.org/)\n\
  \n## 硬件虚拟化支持\n\n某些计算机可能没有硬件虚拟化支持；如果有，则应在 BIOS 中启用。\n\n要检查你是否启用了虚拟化支持，可以使用 `grep`\
  \ 检查相关标志是否启用。如果针对你的处理器的命令返回了文本，说明你已经启用了虚拟化支持：\n\n*   对于 Intel 处理器，可以执行 `grep vmx\
  \ /proc/cpuinfo`\n*   对于 AMD 处理器，可以执行 `grep svm /proc/cpuinfo`\n\n### 12.2.1. Xen\n\
  \n`Xen` 是一种“半虚拟化”解决方案。它在硬件和上层系统之间引入了一个薄抽象层，称为“hypervisor”（管理程序）；它充当裁判，控制虚拟机对硬件的访问。然而，它只处理少数指令，其余指令由硬件代表系统直接执行。主要优势是性能不会下降，系统运行接近原生速度；缺点是希望在\
  \ `Xen` 管理程序上使用的操作系统内核需要适配以运行在 `Xen` 上。\n\n让我们花点时间了解术语。Hypervisor 是底层架构，直接运行在硬件上，甚至在内核之下。这个\
  \ Hypervisor 可以将剩余软件划分到多个领域（domains），这些领域可以看作是许多虚拟机。这些领域中的一个（第一个启动的）被称为 `dom0`，具有特殊作用，因为只有这个领域可以控制管理程序和其他领域的执行。其他领域被称为\
  \ `domU`。换句话说，从用户的角度来看，`dom0` 对应其他虚拟化系统的“宿主机”，而 `domU` 可以被视为“客机”。\n\n#### 背景 Xen\
  \ 与各种 Linux 版本\n\n`Xen` 最初是作为一组存在于官方树之外的补丁开发的，并没有集成到 Linux 内核中。与此同时，几个即将推出的虚拟化系统（包括\
  \ `KVM`）需要一些通用的虚拟化相关函数来促进集成，Linux 内核获得了这组函数（被称为 `paravirt_ops` 或 `pv_ops` 接口）。由于\
  \ `Xen` 补丁重复了该接口的一些功能，它们无法被正式接受。\n\n因此，`Xen` 背后的公司 `Xensource` 必须将 `Xen` 移植到这个新框架，以便\
  \ `Xen` 补丁合并到官方 Linux 内核中。这意味着大量的代码重写，尽管 `Xensource` 很快就有了基于 `paravirt_ops` 接口的工作版本，但补丁是逐步合并到官方内核的。合并在\
  \ Linux 3.0 中完成。\n\n→ [`wiki.xenproject.org/wiki/XenParavirtOps`](https://wiki.xenproject.org/wiki/XenParavirtOps)\n\
  \n由于 `Jessie` 基于 Linux 内核 3.16 版本，`linux-image-686-pae` 和 `linux-image-amd64` 包包含了必要的代码，针对\
  \ Squeeze 及更早版本的 Debian 所需的特定补丁已不再需要。\n\n→ [`wiki.xenproject.org/wiki/Xen_Kernel_Feature_Matrix`](https://wiki.xenproject.org/wiki/Xen_Kernel_Feature_Matrix)\n\
  \n## 注意 兼容 Xen 的架构\n\n`Xen` 目前仅适用于 `i386`、`amd64`、`arm64` 和 `armhf` 架构。\n\n####\
  \ 背景 Xen 与非 Linux 内核\n\n`Xen` 需要对在其上运行的所有操作系统进行修改；并非所有内核在这一方面具有相同的成熟度。许多内核作为 `dom0`\
  \ 和 `domU` 都是全功能的：Linux 3.0 及更高版本、`NetBSD` 4.0 及更高版本，以及 `OpenSolaris`。其他仅能作为 `domU`\
  \ 工作。你可以在 Xen 的 wiki 中检查每个操作系统的状态：\n\n→ [`wiki.xenproject.org/wiki/Dom0_Kernels_for_Xen`](https://wiki.xenproject.org/wiki/Dom0_Kernels_for_Xen)→\
  \ [`wiki.xenproject.org/wiki/DomU_Support_for_Xen`](https://wiki.xenproject.org/wiki/DomU_Support_for_Xen)\n\
  \n然而，如果 `Xen` 可以依靠专门用于虚拟化的硬件功能（这些功能仅存在较新的处理器中），即使是未修改的操作系统也可以作为 `domU` 运行（包括 Windows）。\n\
  \n在 Debian 下使用 `Xen` 需要三个组件：\n\n*   内核本身。根据可用硬件，相应的包将是 `xen-hypervisor-4.11-amd64`、`xen-hypervisor-4.11-armhf`\
  \ 或 `xen-hypervisor-4.11-arm64`。\n*   在该内核程序上的内核。任何比 3.0 新的内核都可以，包括 `Buster` 中存在的\
  \ 4.19 版本。\n*   `i386` 架构还需要一个带有利用 `Xen` 的适当补丁的标准库；这位于 `libc6-xen` 包中。\n\n\n\n虚拟机监控程序还带来了\
  \ `xen-utils-4.11`，它包含了从 `dom0` 控制虚拟机监控程序的工具。这反过来带来了相应的标准库。在安装所有内容的过程中，配置脚本会在 GRUB\
  \ 引导加载菜单中创建一个新条目，以便在 Xen `dom0` 中启动选定的内核。但注意，此条目通常不会被设置为列表中的第一个，但它将被默认选中。\n\n一旦安装了这些先决条件，下一步是测试\
  \ `dom0` 本的行为；这涉及到重启到虚拟机监控程序和 Xen 内核。系统应以标准方式启动，但在早期初始化步骤期间，控制台上会显示几条额外信息。\n\n现在是使用\
  \ `xen-tools` 中的工具在 domU 系统上实际安装实用的系统了。该包提供了 `xen-create-image` 命令，它在很大程度上自动化了该任务。唯一的强制性参数是\
  \ `--hostname`，用于为 domU 命名；其他选项很重要，但它们可以存储在 `/etc/xen-tools/xen-tools.conf` 配置文件中，且在命令行中缺少它们不会触发错误。因此，在创建镜像之前检查该文件的内容，或者在调用\
  \ `xen-create-image` 时使用额外参数是非常关重要的。值得注意的重要参数包括：\n\n* `--memory`，指定为新创建的系统分配的内存容量；\n\
  * `--size` 和 `--swap`，定义供 domU 使用的“虚拟磁盘”的大小；\n* `--debootstrap-cmd`，指定使用哪种 debootstrap\
  \ 命令。如果安装了 `debootstrap` 和 `cdebootstrap`，默认值为 `debootstrap`。在这种情况下，`--dist` 选项通常也会被使用（带有如\
  \ `buster` 这样的发行版名称）。\n\n#### 进阶：在 domU 中安装非 Debian 系统\n\n对于非 Linux 系统，应使用 `--kernel`\
  \ 选项小心地定义 domU 必须使用的内核。\n\n* `--dhcp` 表示 domU 的网络配置应通过 DHCP 获取，而 `--ip` 允许定义静态 IP\
  \ 地址。\n* 最后，必须为要创建的镜像选择一种存储方法（这些镜像在 domU 中将被视为硬盘驱动器）。最简单的方法对应 `--dir` 选项，是在 `dom0`\
  \ 上为 domU 需要提供的每个设备创建一个文件。对于使用 LVM 的系统，替代方案是使用 `--lvm` 选项，后跟卷组名称；`xen-create-image`\
  \ 将在该组内创建一个新的逻辑卷，该逻辑卷将作为硬盘驱动器提供给 domU。\n\n#### 注意：domU 中的存储\n\n整个硬盘也可以导出到 domU，还可以是分区、RAID\
  \ 阵列或预存在的 LVM 逻辑卷。然而，这些操作不会通过 `xen-create-image` 自动化，因此在用 `xen-create-image` 初创建后，需要编辑\
  \ Xen 镜像的配置文件。\n\n一旦做了这些选择，我们就可以为未来的 Xen domU 创建镜像了：\n\n```bash\n# xen-create-image\
  \ --hostname testxen --dhcp --dir /srv/testxen --size=2G --dist=buster --role=udev\
  \ [...] eneral Information -------------------- Hostname : testxen Distribution\
  \ : buster Mirror : http://deb.debian.org/debian Partitions : swap 512M (swap) /\
  \ 2G (ext4) Image type : sparse Memory size : 256M Kernel path : /boot/vmlinuz-4.19.0-5-amd64\
  \ Initrd path : /boot/initrd.img-4.19.0-5-amd64 [...] Logfile produced at: /var/log/xen-tools/testxen.log\
  \ Installation Summary --------------------- Hostname : testxen Distribution : buster\
  \ MAC Address : 00:16:3E:0C:74:2F IP Address(es) : dynamic SSH Fingerprint : SHA256:PuAGX4/4S07Xzh1u0Cl2tL04EL5udf9ajvvbufBrfvU\
  \ (DSA) SSH Fingerprint : SHA256:ajFTX54eakzolyzmZku/ihq/BK6KYsz5MewJ98BM5co (ECDSA)\
  \ SSH Fingerprint : SHA256:/sFov86b+rD/bRSJoHKbiMqzGFiwgZulEwpzsiw6aSc (ED25519)\
  \ SSH Fingerprint : SHA256:/NJg/CcoVj+OLE/cL3yyJINStnla7YkHKe3/xEdVGqc (RSA) Root\
  \ Password : EwmQMHtywY9zsRBpqQuxZTb\n```\n\n我们现在有了一个虚拟机，但它目前没有运行（因此只占用了 `dom0`\
  \ 硬盘上的空间）。当然，我们可以创建更多镜像，可能带有不同的参数。\n\n在启动这些虚拟机之前，我们需要定义如何访问它们。它们当然可以被视为隔离的机器，仅通过其系统控制台访问，但这很少符合使用模式。大多数时候，domU\
  \ 会被视为一台远程服务器，并仅通过网络访问。然而，为每个 domU 添加网卡将非常不方便；这就是为什么 Xen 允许创建虚拟接口，每个域都可以以标准方式看到并使用这些接口。请注意，这些网卡即使是虚拟的，只有在连接到网络（即使是虚拟网络）后才有用。Xen\
  \ 为此提供了几种网络模型：\n\n* 最简单的模型是 `bridge`（桥接）模型；所有的 `eth0` 网卡（ `dom0` 和 domU 系统中的）行为都像直接插在以太网交换机上一样。\n\
  * 接着是 `routing`（路由）模型，`dom0` 表现为位于 domU 系统和（物理）外部网络之间的路由器。\n* 最后，在 `NAT` 模型中，`dom0`\
  \ 再次位于 domU 系统和其余网络之间，但从外部无法直接访问 domU 系统，流量通过 `dom0` 上的某些网络地址转换进行。\n\n这三个网络节点涉及许多具有异常名称的接口，例如\
  \ `vif*`、`veth*`、`peth*` 和 `xenbr0`。Xen 虚拟机监控程序在用户空间工具的控制下，按照定义的布局安排它们。由于 NAT 和路由模型仅适用于特定情况，我们将只讨论桥接模型。\n\
  \nXen 包的标准配置不会更改系统范围的网络配置。然而，`xend` 进程被配置为将虚拟接口集成到任何预定义的桥中（`xenbr0` 优先）。因此，我们必须在\
  \ `/etc/network/interfaces` 中设置桥（这需要安装 `bridge-utils` 包，这就是为什么 `xen-utils-4.11`\
  \ 包推荐它）来替换现有的 eth0 条目：\n\n```\nauto xenbr0 iface xenbr0 inet dhcp bridge_ports eth0\
  \ bridge_maxwait 0\n```\n\n重启以确保桥接自动创建后，我们现在可以使用 Xen 控制工具启动 domU，特别是 `xl` 命令。该命令允许对域进行不同的操作，包括列出它们以及启动/停止它们。你可能需要通过编辑配置文件中的变量来增加默认内存（在本例中为\
  \ `/etc/xen/testxen.cfg`）。在这里，我们将其设置为 1024（兆字节）。\n\n```bash\n# xl list\nName ID\
  \ Mem VCPUs State Time(s)\nDomain-0 0 1894 2 r----- 63.5\n# xl create /etc/xen/testxen.cfg\n\
  Parsing config from /etc/xen/testxen.cfg\n# xl list\nName ID Mem VCPUs State Time(s)\n\
  Domain-0 0 1505 2 r----- 100.0\ntestxen 13 1024 0 --p--- 0.0\n```\n\n#### 工具：管理\
  \ Xen 虚拟机的工具栈\n\n在 Debian 7 及更早版本中，`xm` 是管理 Xen 虚拟机的参考命令行工具。它现在已被 `xl` 取代，后者具有很好的向后兼容性。但这些并不是唯一的可用工具：libvirt\
  \ 的 `virsh` 和 XenServer XAPI 的 `xe`（Xen 的商业产品）也是替代工具。\n\n#### 警告：每个镜像只有一个 domU！\n\
  \n\n\n\n虽然可以并行运行多个 domU 系统，但它们都必须使用自己的镜像，因为每个 domU 都被认为自己运行在独立的硬件上（除了与超管理程序通信的一一小部分内核外）。特别是，两个同时运行的\
  \ domU 系统无法共享存储空间。然而，如果 domU 系统不是在同一时间运行，那么复用同一个交换分区或托管 `/home` 文件系统的分区是完全可能的。\n\
  \n注意，`testxen` domU 使用的是从 RAM 中提取的真实供 dom0 可用的内存，而不是模拟内存。因此，在构建用于托管 Xen 实例的服务器时，应相应配置物理内存。\n\
  \n大功告！虚拟机正在启动。我们可以通过两种模式之一访问它。通常的方法是通过网络“远程”连接到它，就像我们连接到真实的机器一样；这通常需要设置 DHCP 服务器或\
  \ DNS 配置。另一种方法（如果网络配置错误，这可能是唯一的方法）是使用 `xl console` 命令使用 `hvc0` 控制台：\n\n```\n# xl\
  \ console testxen [...] Debian GNU/Linux 10 testxen hvc0 testxen login:\n```\n\n\
  然后你可以打开一个会话，就像坐在虚拟机的键盘前一样。通过 `Control`+`]` 组合键释放此控制台。\n\n**提示** 立即获取控制台\n\n有时人们希望启动\
  \ domU 系统并立即进入其控制台；这就是为什么 `xl create` 命令有一个 `-c` 选项。使用此选项启动 domU 将显示系统启动时的所有消息。\n\
  \n**工具** OpenXenManager\n\nOpenXenManager（位于 `openxenmanager` 包中）是一个图形化界面，允许通过 Xen\
  \ 的 API 远程管理 Xen 域。因此，它可以远程控制 Xen 域。它提供了 `xl` 命令的大部分功能。\n\n一旦 domU 启动，就可以像任何其他服务器一样使用它（因为它毕竟是一个\
  \ GNU/Linux 系统）。然而，它的虚拟机状态允许一些额外功能。例如，可以使用 `xl pause` 和 `xl unpause` 命令临时暂停然后恢复\
  \ domU。注意，尽管暂停的 domU 不消耗任何处理器电源，但分配的内存仍然在使用中。考虑 `xl save` 和 `xl restore` 命令可能会很有趣：保存\
  \ domU 会释放之前该 domU 使用的资源，包括 RAM。当恢复时（或者取消暂停），domU 甚至察觉不到时间流之外的任何异常。如果在 dom0 关闭时\
  \ domU 正在运行，封装脚本会自动保存 domU 并在下次启动时恢复它。这自然会涉及休眠笔记本电脑时的标准不便；特别是如果 domU 挂起过久，网络连接可能会过期。还要注意，Xen\
  \ 目前与大部分 ACPI 电源管理不兼容，这阻止了挂起主机（dom0）系统。\n\n**文档** `xl` 选项\n\n大多数 `xl` 子命令期望一个或多个参数，通常是\
  \ domU 名称。这些参数在 `xl(1)` 手册页中有详细描述。\n\n停止或重启 domU 可以在 domU 内部完成（使用 `shutdown` 命令），也可以从\
  \ dom0 完成（使用 `xl shutdown` 或 `xl reboot`）。\n\n**进阶** 高级 Xen\n\nXen 的功能比我们这几段话所能描述的要得多。特别是，该系统非常动态，一个域的许多参数（例如分配的内存量、可见的硬盘、任务调度器的行为等）即使在域域运行时也可以进行调整。domU\
  \ 甚至可以在不关机的情况下跨服务器迁移，且不会丢失网络连接！对于所有这些高级特性，主要的信息来源是 Xen 官方文档。\n\n→ [`xenproject.org/help/documentation/`](https://xenproject.org/help/documentation/)\n\
  \n## 12.2.2. LXC\n\n尽管 LXC 被用于构建“虚拟机”，但严格来说，它并不是一个虚拟化系统，而是一个将进程组相互隔离的系统，尽管它们运行在同一个主机上。它利用了\
  \ Linux 内核的一系列最新演进，统称为*控制组*control groups），通过它，被称为“组”的不同进程集对整个系统的某些方面有不同的视图。这些方面中最著名的是进程标识符、网络配置和挂载点。这样一组孤立的进程将无法访问系统中的其他进程，其对文件系统的访问可以限制在特定的子集中。它还可以拥有自己的网络接口和路由表，并可以配置为只看到系统上可用设备的子集。\n\
  \n这些功能可以结合起来，隔离从 `init` 进程开始的整个进程族，生成的集合看起来非常像虚拟机。这种设置的正式名称是“容器”（因此有了 LXC 别号：*LinuX\
  \ Containers*），但与 Xen 或 KVM 提供的“真实”虚拟机相比，有一个非常重要的区别：没有第二个内核；容器使用与主机系统完全相同的内核。这既有优缺点：优点包括由于完全没有开销而带来的卓越性能，以及内核对系统上运行的所有进程具有全局视野，因此调度比两个独立的内核调度不同任务集要高效得多。主要的不便之处是无法在容器中运行不同的内核（无论是不同的\
  \ Linux 版本还是完全不同的操作系统）。\n\n**注意** LXC 隔离限制\n\nLXC 容器不提供由更重量的模拟器或虚拟化程序所能达到的隔离水平。特别是：\n\
  \n*   由于内核在主机系统和容器之间共享，受限制在容器中的进程仍然可以访问内核消息，如果容器发出了消息，可能会导致信息泄露；\n*   出于类似原因，如果容器被攻破并利用了内核漏洞，其他容器也可能受到影响；\n\
  *   在文件系统中，内核根据用户和组的数字标识符检查权限；这些标识符可能会根据容器指定不同的用户和组，如果文件系统的可写部分在容器之间共享，则应该记住这一点。\n\
  \n由于我们处理的是隔离而非纯粹的虚拟化，因此设置 LXC 容器比仅仅在虚拟机上运行 `debian-installer` 要复杂。我们将描述一些前提条件，然后进行网络配置；随后我们就可以实际创建要在容器中运行的系统了。\n\
  \n### 12.2.2.1. 准备步骤\n\n`lxc` 包包含了运行 LXC 需要的工具，因此必须安装。\n\nLXC 还需要*控制组*配置系统，这是一个挂载在\
  \ `/sys/fs/cgroup` 的虚拟文件系统。自从 Debian 8 切换到 systemd（systemd 也依赖控制组），这现在在启动时自动完成，无需进一步配置。\n\
  \n### 12.2.2.2. 网络配置\n\n\n\n\n安装 `LXC` 的目标是设置虚拟机；当然，我们也可以将它们与网络隔离，仅通过文件系统与它们通信，但大多数用例都为容器提供至少基本的网络访问。在典型情况下，每个容器将获得一个虚拟网络接口，通过网桥（bridge）连接到真实网络。该虚拟接口可以直接插在主机的物理网络接口上（在这种情况下容器直接位于网络上），也可以插在主机上定义的另一个虚拟接口上（主机随后可以对流量进行过滤或路由在这两种情况下，都需要\
  \ `bridge-utils` 软件包。\n\n简单的情况只需编辑 `/etc/network/interfaces`，将物理接口（例如 `eth0`）的配置移动到网桥接口（通常为\
  \ `br0`），并配置它们之间的链路。例如，如果网络接口配置文件最初包含如下条目：\n\n```\nauto eth0 iface eth0 inet dhcp\n\
  ```\n\n应该将它们禁用并替换为以下内容：\n\n```\n#auto eth0 #iface eth0 inet dhcp auto br0 iface\
  \ br0 inet dhcp bridge-ports eth0\n```\n\n此配置的效果将类似于容器是插入到与主机相同物理网络上的机器所获得的结果。“桥”配置管理所有桥接接口之间以太网帧的传输，其中包括物理\
  \ `eth0` 以及为容器定义的接口。\n\n在无法使用此配置的情况下（例如，无法为容器分配公共 IP 地址），将创建一个虚拟的 `tap` 接口并连接到网桥。等相应的网络拓扑将变为主机插了第二个网卡到独立的交换机，而容器也插在该交换机上。如果容器需要与外部通信，则主机必须作为容器的网关。\n\
  \n除了 `bridge-utils` 外，这种“丰富”配置还需要 `vde2` 软件包；此时 `/etc/network/interfaces` 文件变为：\n\
  \n```\n# Interface eth0 is unchanged auto eth0 iface eth0 inet dhcp # Virtual interface\
  \ auto tap0 iface tap0 inet manual vde2-switch -t tap0 # Bridge for containers auto\
  \ br0 iface br0 inet static bridge-ports tap0 address 10.0.0.1 netmask 255.255.255.0\n\
  ```\n\n然后可以在容器中静态设置网络，也可以通过运行在主机上的 DHCP 服务器动态设置。此类 DHCP 服务器需要配置为响应 `br0` 接口上的查询。\n\
  \n## 12.2.2.3 设置系统\n\n现在让我们设置供容器使用的文件系统。由于这个“虚拟机”不会直接运行在硬件上，因此与标准文件系统相比需要进行一些调整，特别是在内核、设备和控制台方面。幸运的是，`lxc`\
  \ 包含了大部分自动完成此配置的脚本。例如，以下命令（需要 `debootstrap` 和 `rsync` 软件包）将安装一个 Debian 容器：\n\n```\n\
  root@mirwiz:~# lxc-create -n testlxc -t debian\ndebootstrap is /usr/sbin/debootstrap\
  \ Checking cache download in /var/cache/lxc/debian/rootfs-stable-amd64 ... Downloading\
  \ debian minimal ... I: Retrieving Release I: Retrieving Release.gpg [...] Download\
  \ complete. Copying rootfs to /var/lib/lxc/testlxc/rootfs... [...] root@mirwiz:~#\n\
  ```\n\n注意，文件系统最初创建在 `/var/cache/lxc` 中，然后移动到目标目录。这允许更快地创建相同的容器，因为此时只需要复制即可。\n\n\
  注意，Debian 模板创建脚本接受 `--arch` 选项来指定要安装的系统的架构，如果想安装 Debian 当前稳定版以外的内容，则接受 `--release`\
  \ 选项。你还可以设置 `MIRROR` 环境变量指向本地 Debian 镜像。\n\n新创建的文件系统现在包含一个极简的 Debian 系统，默认情况下，容器没有网络接口（回环接口除外）。由于这通常不是我们想要的，我们将编辑容器的配置文件（`/var/lib/lxc/testlxc/config`）并添加几个\
  \ `lxc.network.*` 条目：\n\n```\nlxc.net.0.type = veth\nlxc.net.0.flags = up\nlxc.net.0.link\
  \ = br0\nlxc.net.0.hwaddr = 4a:49:43:49:79:20\n```\n\n这些条目分别意味着：将在容器中创建一个虚拟接口；当该容器启动时，它将自动启动；它将自动连接到主机上的\
  \ `br0` 网桥；以及其 MAC 地址将按指定设置。如果最后一条条目缺失或禁用，将生成一个随机 MAC 地址。\n\n该文件中另一个有用的条目是设置主机名：\n\
  \n```\nlxc.uts.name = testlxc\n```\n\n## 12.2.2.4 启动容器\n\n现在虚拟机镜像已就绪，让我们用 `lxc-start\
  \ --daemon --name=testlxc` 启动容器。\n\n在 2.0.8 之后的 LXC 版本中，默认不设置根密码。我们可以运行 `lxc-attach\
  \ -n testlxc passwd` 来设置一个。现在可以登录了：\n\n```\nroot@mirwiz:~# lxc-console -n testlxc\n\
  Debian GNU/Linux 9 testlxc console testllc login: root\nPassword: Linux testlxc\
  \ 4.19.0-5-amd64 #1 SMP Debian 4.19.37-5 (2019-06-19) x86_64 The programs included\
  \ with the Debian GNU/Linux system are free software; 每个程序的的具体分发条款在 /usr/share/doc/*/copyright\
  \ 中的各个单独文件中说明。Debian GNU/Linux 在适用法律允许范围内不提供任何保证。root@testlxc:~# ps auxwf\nUSER\
  \ PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\nroot 1 0.0 0.2 56736 6608 ?\
  \ Ss 09:28 0:00 /sbin/init\nroot 32 0.0 0.1 46096 4680 ? Ss 09:28 0:00 /lib/systemd/systemd-journald\n\
  root 75 0.0 0.1 67068 3328 console Ss 09:28 0:00 /bin/login --\nroot 82 0.0 0.1\
  \ 19812 3664 console S 09:30 0:00 \\_ -bash\nroot 88 0.0 0.1 38308 3176 console\
  \ R+ 09:31 0:00 \\_ ps auxwf\nroot 76 0.0 0.1 69956 5636 ? Ss 09:28 0:00 /usr/sbin/sshd\
  \ -D\nroot@testlxc:~#\n```\n\n我们现在进入容器内部；我们对进程的访问仅限于那些从容器本身启动的进程，我们对文件系统的访问同样限制在完整文件系统的专用子集（`/var/lib/lxc/testlxc/rootfs`）。我们可以通过\
  \ `Control+a+q` 退出控制台。\n\n注意，由于 `lxc-start` 的 `--daemon` 选项，我们以后后台进程运行了容器。可以使用 `lxc-stop\
  \ --name=testlxc` 等命令中断容器。\n\n`lxc` 软件包包含一个初始化脚本，可以在主机启动时自动启动一个或多个容器（它依赖于 `lxc-autostart`，后者会启动\
  \ `lxc.start.auto` 选项设置为 1 的容器）。通过 `lxc.start.order` 和 `lxc.group` 可以对启动顺序进行更细粒度的控制：默认情况下，初始化脚本首先启动\
  \ `onboot` 组中的容器，然后是不属于任何组的容器。两种情况下，组内的顺序由 `lxc.start.order` 选项定义。\n\n## 进阶：大规模虚拟化\n\
  \n由于 `LXC` 是一个非常轻量级的隔离系统，它特别适用于大规模虚拟服务器托管。网络配置可能会比我们上面描述的复杂一些，但在许多情况下，使用 `tap` 和\
  \ `veth` 接口的“丰富”配置应该足够了。\n\n\n\n\n\n共享文件系统的部分（例如 `/usr` 和 `/lib` 子树）也是有意义的，以避免重复多个容器可能需要的共用软件。这通常通过容器配置文件中的\
  \ `lxc.mount.entry` 条目来实现。有趣的副作用是，进程将使用更少的物理内存，因为内核能够检测到程序是共享的。这样，增加一个容器的边际成本可以降低到仅需其特定数据的磁盘空间，以及内核必须调度和管理的少量额外进程。\n\
  \n当然，我们还没有描述所有可用选项；更全面的信息可以从 `lxc(7)` 和 `lxc.container.conf(5)` 手页及其引用的页面中获得。\n\n\
  ## 12.2.3 使用 KVM 进行虚拟化\n\nKVM 全称为 `Kernel-based Virtual Machine`（基于内核的虚拟机），首先是一个内核模块，为虚拟化程序提供绝大部分基础设施，但它本身并不是一个虚拟化程序。虚拟化的实际控制由基于\
  \ QEMU 的应用程序处理。如果本节提到了 `qemu-` 命令，请不要担心：它仍然关于 KVM 的。\n\n与其他虚拟化系统不同，KVM 从一开始就合并到了\
  \ Linux 内核中。它的开发者选择利用专门用于虚拟化的处理器指令集（Intel-VT 和 AMD-V），这使得 KVM 保持轻量级、优雅且不消耗资源。对应的是，KVM\
  \ 不能在任何计算机上运行，而只能在具有相应处理器的计算机上运行。对于基于 x86 的计算机，你可以通过查看 `/proc/cpuinfo` 列出的 CPU 标志中的“vmx”或“svm”来验证你是否有此类处理器。\n\
  \n在红帽对其开发的积极支持下，KVM 或或少地已成为 Linux 虚拟化的基准。\n\n### 12.2.3.1 准备步骤\n\n与 VirtualBox 等工具不同，KVM\
  \ 本身不包含任何创建和管理虚拟机的用户界面。`qemu-kvm` 包仅提供一个可以启动虚拟机的可执行文件，以及加载适当内核模块的初始化脚本。\n\n幸运的是，红帽还提供了另一组工具来解决这个问题，即开发了\
  \ `libvirt` 库和相关的 `virtual machine manager`（虚拟机管理器）工具。`libvirt` 允许以统一的方式管理虚拟机，而取决于后台涉及的虚拟化系统（它目前支持\
  \ QEMU、KVM、Xen、LXC、OpenVZ、VirtualBox、VMWare 和 UML）。`virtual-manager` 是一个使用 `libvirt`\
  \ 创建和管理虚拟机的图形化界面。\n\n我们首先安装所需的软件包：`apt-get install libvirt-clients libvirt-daemon-system\
  \ qemu-kvm virtinst virt-manager virt-viewer`。`libvirt-daemon-system` 提供 `libvirtd`\
  \ 守护进程，允许对运行在主机上的虚拟机进行（可能的远程）管理，并在主机启动时启动所需的虚拟机。`libvirt-clients` 提供 `virsh` 命令行工具，允许控制由\
  \ `libvirtd` 管理的机器。\n\n`virtinst` 包提供了 `virt-install`，允许从命令行创建虚拟机。最后，`virt-viewer`\
  \ 允许访问虚拟机的图形控制台。\n\n### 12.2.3.2 网络配置\n\n就像在 Xen 和 LXC 中一样，最频繁的网络配置涉及一个将虚拟机网络接口的网桥（参见\
  \ 第 12.2.2.2 节，“网络配置”）。\n\n或者，在 KVM 提供的默认配置中，虚拟机被分配一个私地址（在 192.168.122.0/24 范围内），并设置了\
  \ NAT 以便虚拟机访问外部网络。\n\n本节其余部分假设主机有一个 `eth0` 物理接口和一个 `br0` 网桥，且前者连接到后者。\n\n### 12.2.3.3\
  \ 使用 virt-install 安装\n\n创建虚拟机与安装普通系统非常相似，区别在于虚拟机的特性被描述在一个看似无尽的命令行中。\n\n从实践来说，这意味着我们将使用\
  \ Debian 安装程序，通过在映射到主机系统存储 Debian DVD 镜像的虚拟 DVD-ROM 驱动器上启动虚拟机。虚拟机将通过 VNC 协议导出其图形控制台（参见第\
  \ 9.2.2 节，“使用远程图形桌面”](#ch09s02.html_sect.remote-desktops \"9.2.2. 使用远程图形桌面\") 获取详情），这将允许我们控制安装过程。\n\
  \n我们首先需要告诉 `libvirtd` 将磁盘镜像存储在哪里，除非默认位置（`/var/lib/libvirt/images/`）可以。\n\n```bash\n\
  root@mirwiz:~# mkdir /srv/kvm\nroot@mirwiz:~# virsh pool-create-as srv-kvm dir --target\
  \ /srv/kvm\nPool srv-kvm created root@mirwiz:~#\n```\n\n提示：将你的用户加入 libvirt 组\n\n\
  本节中的所有示例均假设你以 root 身份运行命令。实际上，如果你想控制本地 libvirt 守护进程，你要么是 root，要么是 `libvirt` 组的成员（默认情况下不是的）。因此，如果你想避免频繁使用\
  \ root 权限，可以将自己加入 `libvirt` 组，并在你的用户身份下运行各种命令。\n\n现在让我们开始虚拟机的安装过程，并近距离观察 `virt-install`\
  \ 最重要的选项。该命令在 `libvirtd` 中注册虚拟机及其参数，然后启动它以便进行安装。\n\n```bash\n# virt-install --connect\
  \ qemu:///system --virt-type kvm --name testkvm --memory 1024 --disk /srv/kvm/testkvm.qcow,format=qcow2,size=10\
  \ --cdrom /srv/isos/debian-10.2.0-amd64-netinst.iso --network bridge=virbr0 --graphics\
  \ vnc --os-type linux --os-variant debian10\n```\nStarting install... Allocating\
  \ 'testkvm.qcow' | 10 GB 00:00\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `--connect` |\
  \ `--connect` 选项指定要使用的“管理程序”。其格式是一个 URL，包含虚拟化系统（`xen://`、`qemu://`、`lxc://`、`openvz://`、`vbox://`\
  \ 等）和托管虚拟机的机器（本地主机的情况下可以留空）。此外，在 QEMU/KVM 情况下，每个用户都可以受限权限管理虚拟机，URL 路径允许区分“系统”机器（`/system`）和其他（`/session`）。\
  \ |\n| `--virt-type kvm` | 由于 KVM 的管理方式与 QEMU 相同，`--virt-type kvm` 允许在 URL 看起来像\
  \ QEMU 时指定使用 KVM。 |\n| `--name` | `--name` 选项为虚拟机定义一个（唯一的）名称。 |\n| `--memory` |\
  \ `--memory` 选项允许指定为虚拟机分配的内存（以 MB 为单位）。 |\n| `--disk` | `--disk` 指定代表虚拟机硬盘的镜像文件位置；除非文件已存在，否则将根据\
  \ `size` 参数指定的大小（以 GB 为单位）创建。`format` 参数允许在几种存储镜像文件的方式中进行选择。默认格式（`qcow2`）允许从一个小的文件开始，仅当虚拟机实际使用空间时它才会增长。\
  \ |\n\n\n\n\n\n| ![6](img/#ch12s02.html_virtinst.cdrom) | `--cdrom` 选项用于指定安装时使用的光盘位置。该路径可以是\
  \ ISO 文件的本地路径、可以获取该文件的 URL，或者是物理 CD-ROM 驱动器的设备文件（例如 `/dev/cdrom`）。 | |\n\n| ![7](img/#ch12s02.html_virtinst.network)\
  \ | `--network` 指定虚拟网卡如何集成到宿主机的网络配置中。默认行为（我们在示例中显式强制执行）是将其集成到任何预存在的网络桥接。如果不存在此类桥接，虚拟机将仅通过\
  \ NAT 访问物理网络，因此它将获得私有子网范围（192.168.122.0/24）内的地址。 | |\n\n| ![8](img/#ch12s02.html_virtinst.vnc)\
  \ | `--graphics vnc` 表示应使用 VNC 提供图形控制台。关联的 VNC 服务器的默认行为是仅在本地接口监听；如果 VNC 客户端要在不同的主机上运行，则建立连接需要设置\
  \ SSH 隧道（参见 第 9.2.1.3 节，“使用端口转发创建加密隧道”）。或者或者，可以使用 `--graphics vnc,listen=0.0.0.0`\
  \ 使得 VNC 服务器从所有接口访问；请注意，如果你这样做，真的应该据此设计你的防火墙。 | |\n\n| ![9](img/#ch12s02.html_virtinst.os)\
  \ | `--os-type` 和 `--os-variant` 选项允许根据其中提到的操作系统的某些已知特性，来优化虚拟机的几个参数。 | |\n\n此时，虚拟机正在运行，我们需要连接到图形控制台以继续安装过程。如果之前的操作是从图形桌面环境运行的，则此连接将自动启动。如果没有，或者我们正在进行远程操作，可以在任何图形环境中运行\
  \ `virt-viewer` 来打开图形控制台（注意，远程主机的密码会被询问两次，因为该操作需要 2 个 SSH 连接）：\n\n```\n$ virt-viewer\
  \ --connect qemu+ssh://root@server/system testkvm root@server's password: root@server's\
  \ password:\n```\n\n当安装过程结束，虚拟机将重启，现在准备好使用了。\n\n### 12.2.3.4. 使用 virsh 管理虚拟机\n\n\
  现在安装已经完成，让我们看看如何处理可用的虚拟机。首先要尝试的是向 `libvirtd` 请求它管理的虚拟机列表：\n\n```bash\n# virsh -c\
  \ qemu:///system list --all Id Name State ---------------------------------- 8 testkvm\
  \ shut off\n```\n\n启动我们的测试虚拟机：\n\n```bash\n# virsh -c qemu:///system start testkvm\n\
  Domain testkvm started\n```\n\n我们现在可以获取图形控制台的连接指令（返回的 VNC 显示器可以作为参数传递给 `vncviewer`）：\n\
  \n```bash\n# virsh -c qemu:///system vncdisplay testkvm\n127.0.0.1:0\n```\n\n其他可用的\
  \ `virsh` 子命令包括：\n\n*   `reboot`：重启虚拟机；\n*   `shutdown`：触发正常关机；\n*   `destroy`：强制停止；\n\
  *   `suspend`：暂停运行；\n*   `resume`：恢复运行；\n*   `autostart`：启用（或使用 `--disable` 选项禁用）在宿主机启动时自动启动虚拟机；\n\
  *   `undefine`：从 `libvirtd` 中移除虚拟机的所有痕迹。\n\n所有这些子命令都接受虚拟机标识符作为参数。\n\n### 12.2.3.5.\
  \ 在 Debian 中用 yum 安装基于 RPM 的系统\n\n如果虚拟机旨在运行 Debian（或其变变体），可以如上所述使用 `debootstrap`\
  \ 初始化系统。但如果虚拟机要安装基于 RPM 的系统（如 Fedora、CentOS 或 Scientific Linux），则需要使用 `yum` 工具（在同名的软件包中可用）来完成设置。\n\
  \n该过程需要使用 `rpm` 提取一组初始文件，特别是 `yum` 配置文件，然后调用 `yum` 提取剩余的包。但由于我们在 chroot 外部调用 `yum`，因此我们需要进行一些临时更改。在下面的示例中，目标\
  \ chroot 为 `/srv/centos`。\n\n```bash\n# rootdir=\"/srv/centos\"\n# mkdir -p \"$rootdir\"\
  \ /etc/rpm\n# echo \"%_dbpath /var/lib/rpm\" > /etc/rpm/macros.dbpath\n# wget http://mirror.centos.org/centos/7/os/x86_64/Packages/centos-release-7-6.18\n\
  # rpm --nodeps --root \"$rootdir\" -i centos-release-7-6.18\n# yum --assumeyes --installroot\
  \ $rootdir groupinstall\n```\n*(注：原文末尾部分存在大量乱码/格式错误文本，已根据逻辑提取核心命令与路径并进行排版)*\n\n\
  # 12.3. 自动化安装\n\nFalcot Corp 的管理员像许多大型 IT 服务管理员一样，需要工具来快速安装（或重新安装）新机器，并且尽可能自动完成。\n\
  \n这些需求可以通过广泛的解决方案来实现。一方面，SystemImager 等通用工具通过基于模板机器创建镜像，然后将该镜像部署到目标系统来处理；在光谱的另一端，标准的\
  \ Debian 安装程序可以预设配置文件，该文件提供了安装过程中所提问题的答案。作为一种折中方案，像 FAI (*Fully Automatic Installer*)\
  \ 这样的混合工具使用软件包系统安装机器，但它也使用自己的基础设施来处理更特定于大规模部署的任务（如启动、分区、配置等）。\n\n这些解决方案各都有其优缺点：SystemImager\
  \ 独立于任何特定的软件包系统，这允许它使用几种不同的 Linux 发行版来管理大量机器。它还包含一个不需要重新安装的更新系统，但只有当机器没有被独立修改时，该更新系统才是可靠的；换句话说，用户不能自行更新任何软件，或安装任何其他软件。同样，安全更新不能自动化，因为它们必须通过由\
  \ SystemImager 维护的中央参考镜像。该解决方案还要求目标机器是同质的，否则必须保留和管理许多不同的镜像（i386 镜像无法在 powerpc 机器上运行，以此此类推）。\n\
  \n\n\n\n另一方面，使用 `debian-installer` 进行自动化安装可以适应每台机器的特性：安装程序将从相关仓库获取适当的内核和软件包，检测可用硬件，对整个硬盘进行分区以利用所有可用空间，安装相应的\
  \ Debian 系统，并设置合适的启动程序。然而，标准安装程序只会安装标准的 Debian 版本，包含基础系统和一组预选的“任务”；这阻止了安装带有非软件包应用程序的特定系统。满足这一特殊需求需要对安装程序进行定制……幸运的是，安装程序是非常模块化的，并且有工具可以实现这种定制所需的大部分工作，最重要的是\
  \ `simple-CDD`（`CDD` 是 *Custom Debian Derivative* 的缩写）。尽管如此，即使是 `simple-CDD` 方案也只处理初始安装；这通常不是问题，因为\
  \ `APT` 工具允许后期高效地部署更新。\n\n我们仅对 `FAI` 进行简要概述，并完全跳过 `SystemImager`（该工具已不再于 Debian\
  \ 中），以便更集中地关注 `debian-installer` 和 `simple-CDD`，它们在仅限 Debian 的语境下更有趣。\n\n## 12.3.1\
  \ 全自动安装器 (FAI)\n\n`Fully Automatic Installer` 可能是 Debian 最老的自动化部署系统，这解释了它作为参考的地位；但它极其灵活的本质仅仅抵消了它涉及的复杂性。\n\
  \n`FAI` 需要一个服务器系统来存储部署信息并允许目标机器从网络启动。该服务器需要 `fai-server` 软件包（或 `fai-quickstart`，它也带来了标准配置所需的元素）。\n\
  \n`FAI` 使用特定方法来定义各种可安装的配置。`FAI` 并不是简单的复制参考安装，而是一个完整的安装程序，可以通过存储在服务器上的一系列文件和脚本进行完全配置；默认位置\
  \ `/srv/fai/config/` 不会自动创建，因此管理员需要创建它以及相关文件。大多数情况下，这些文件将根据 `fai-doc` 软件包文档提供的示例文件进行定制，特别是\
  \ `/usr/share/doc/fai-doc/examples/simple/` 目录。\n\n一旦定义了配置，`fai-setup` 命令就会生成启动\
  \ FAI 安装所需的元素；这主要意味着准备或更新安装期间使用的精简系统（`NFS-root`）。另一种方案是使用 `fai-cd` 生成专用的启动 CD。\n\
  \n创建所有这些配置文件需要对 `FAI` 的工作原理有一定的理解。典型的安装过程由以下步骤组成：\n\n* 从网络获取内核并启动它；\n* 从 `NFS` 挂载根文件系统；\n\
  * 执行 `/usr/sbin/fai`，它控制过程的其他部分（因此后续步骤由此脚本启动）；\n* 将配置空间从服务器拷贝到 `/fai/`；\n* 运行 `fai-class`。依次执行\
  \ `/fai/class/[0-9][0-9]*` 脚本并返回适用于安装机器的“类”名称；这些信息将作为后续步骤的基础。这允许在定义要安装和配置的服务时具有一定的灵活性。\n\
  * 根据相关的类获取多个配置变量；\n* 根据 `/fai/disk_config/class` 中提供的信息对磁盘进行分区并格式化分区；\n** 上述分区；\n\
  * 安装基础系统；\n* 使用 `fai-debconf` 对 `Debconf` 数据库进行预设填充；\n* 为 `APT` 获取可用软件包列表；\n* 安装\
  \ `/fai/package_config/class` 中列出的软件包；\n* 执行后配置脚本 `/fai/scripts/class/[0-9][0-9]*`；\n\
  * 记录安装日志、卸载分区并重启。\n\n## 12.3.2 预设 Debian-Installer\n\n归根结底，安装 Debian 系统的最佳工具逻辑上应该是官方的\
  \ Debian 安装程序。这就是为什么，从诞生之初，`debian-installer` 被设计为自动化使用，利用了 `debconf` 提供的基础设施。后者一方面允许减少提问的数量（隐藏的问题将将使用提供的默认答案），另一方面可以单独提供默认答案，以便安装可以是非交互的。这最后一个功能被称为\
  \ *preseeding*（预设）。\n\n### 进阶：带有中心化数据库的 Debconf\n\n预设允许在安装时为 `Debconf` 问题提供一组答案，但这些答案是静态的，不会随着时间的推移而演。由于已安装的机器可能需要升级，并且可能需要新的答案，可以设置\
  \ `/etc/debconf.conf` 配置文件使 `Debconf` 使用外部数据源（如 LDAP 目录或通过 `NFS` 或 `Samba` 访问的远程文件）。可以同时定义多个外部数据源，它们互为补充。本地数据库仍旧在使用（用于读写访问），但远程数据库通常限制为读取。`debconf.conf(5)`\
  \ 手页详细描述了所有可能性（您需要 `debconf-doc` 软件包）。\n\n### 12.3.2.1 使用预设文件\n\n安装程序可以从几个地方获取预设文件：\n\
  \n* 在用于启动机器的 `initrd` 中；在这种情况下，预设发生在安装的最开始，可以避免所有问题。该文件只需要命名为 `preseed.cfg` 并存储在\
  \ `initrd` 根目录下。\n* 在启动介质（CD 或 USB 闪盘）上；预设会在介质挂载后立即发生，这意味着在问完关于语言和键盘布局的问题后立即。可以使用\
  \ `preseed/file` 启动参数来指示预设文件的位置（例如，当从 CD-ROM 安装时路径为 `/cdrom/preseed.cfg`，在 USB 闪盘情况下路径为\
  \ `/hd-media/preseed.cfg`）。\n* 从网络获取；预设仅在网络（自动）配置后才会发生；相关的启动参数是 `preseed/url=http://server/preseed.cfg`。\n\
  \n一眼看去，将预设文件包含在 `initrd` 中似乎是最有趣的解决方案；然而，在实践中很少使用，因为生成安装程序的 `initrd` 相当复杂。另外两种解决方案常见得多，特别是因为启动参数为预设安装过程前几个答案提供了另一种方法。为了避免每次安装都手动输入这些启动参数的麻烦，通常的方法是将它们保存到\
  \ `isolinux`（CD-ROM 情况）或 `syslinux`（USB 闪盘）的配置中。\n\n### 12.3.2.2 创建预设文件\n\n预设文件是一个纯文本文件，每行包含一个\
  \ `Debconf` 问题的答案。每一行被分为四个由空白字符（空格或制表符）分隔的字段，例如 `d-i mirror/suite string stable`：\n\
  \n* 第一个字段是问题的“所有者”；`d-i` 用于与安装程序相关的问题，也可以是来自 Debian 软件包问题的包名；\n* 第二个字段是问题的标识符；\n\
  * 第三个是问题的类型；\n* 第四个也是最后一个字段包含答案的值。注意，它必须与第三个字段用单个空格隔开；如果有多个空格，后续的空格字符将被视为值的一部分。\n\
  \n\n\n\n编写 preseed 文件（种子文件）简单的方法是手动安装系统。然后，`debconf-get-selections --installer`\
  \ 将提供有关安装程序的答案。关于其他软件包的答案可以通过 `debconf-get-selections` 获取。然而，更整洁的解决方案是从示例和参考文档开始手动编写\
  \ preseed 文件：通过这种方法，只有在需要覆盖默认答案的情况下才能进行预设；使用 `priority=critical` 启动参数将指示 Debconf\
  \ 仅询问关键问题，并对其他问题使用默认答案。\n\n# 文档 安装指南附录\n\n在线可用的安装指南在附录中包含了关于如何使用 preseed 文件的详尽文档。它还包含了一个详细且带注释的示例文件，该文件可以作为本地定制的蓝。\n\
  \n→ [`www.debian.org/releases/stable/amd64/apb`](https://www.debian.org/releases/stable/amd64/apb)→\
  \ [`www.debian.org/releases/stable/example-preseed.txt`](https://www.debian.org/releases/stable/example-preseed.txt)\n\
  \n## 12.3.2.3. 创建自定义启动介\n\n知道存储 preseed 文件的位置固然很好，但位置并不是一切：必须以某种方式修改安装启动介以更改启动参数并添加\
  \ preseed 文件。\n\n### 12.3.2.3.1. 从网络启动\n\n当计算机从网络启动时，发送初始化元素的服务器也定义了启动参数。因此，需要在启动服务器的\
  \ PXE 配置中进行更改；具体来说，是在其 `/tftpboot/pxelinux.cfg/default` 配置文件。设置网络启动是一个前提；详情请参阅《安装指南》。\n\
  \n→ [`www.debian.org/releases/stable/amd64/ch04s05`](https://www.debian.org/releases/stable/amd64/ch04s05)\n\
  \n## 12.3.2.3.2. 准备可启动 USB 盘\n\n一旦准备好可启动的 U 盘（参见 第 4.1.2 节，“从 USB 盘启动”），还需要一些额外的操作。假设\
  \ U 盘内容位于 `/media/usbdisk/` 下：\n\n*   将 preseed 文件拷贝到 `/media/usbdisk/preseed.cfg`\n\
  *   编辑 `/media/usbdisk/syslinux.cfg` 并添加所需的启动参数（见下例）。\n\n示例 12.2 syslinux.cfg 文件和预设参数：\n\
  \n```\ndefault vmlinuz append preseed/file=/hd-media/preseed.cfg locale=en_US.UTF-8\
  \ keymap=us language=us country=US vga=788 initrd=initrd.gz --\n```\n\n## 12.3.2.3.3.\
  \ 创建 CD-ROM 镜像\n\nUSB 盘是读写介质，因此我们很容易在上面添加文件并更改几个参数。对于 CD-ROM，操作更为复杂，因为我们需要重新生成完整的\
  \ ISO 镜像。此任务由 `debian-cd` 处理，但该工具用起来相当笨拙：它需要本地镜像，并且要求理解 `/usr/share/debian-cd/CONF.sh`\
  \ 提供的所有选项；即使如此，也必须多次调用 `make`。因此，非常推荐阅读 `/usr/share/debian-cd/README`。\n\n尽管如此，`debian-cd`\
  \ 始终以类似的方式运行：生成一个包含 CD-ROM 准确内容的“image”目录，然后使用 `genisoimage`、`mkisofs` 或 `xorriso`\
  \ 等工具转换为 ISO 文件。镜像目录在 `debian-cd` 的 `make image-trees` 步骤后确定。此时，我们将 preseed 文件插入适当的目录（通常为\
  \ `$TDIR/$CODENAME/CD1/`，其中 `$TDIR` 和 `$CODENAME` 是由 `CONF.sh` 配置定义的参数）。CD-ROM 使用\
  \ `isolinux` 作为其引导加载程序，其配置文件必须根据 `debian-cd` 生成的内容进行调整，以便插入所需的启动参数（特定文件为 `$TDIR/$CODENAME/boot1/isolinux/isolinux.cfg`）。然后就可以恢复“正常”流程，并继续使用\
  \ `make image CD=1` 生成 ISO 镜像（如果生成多张 CD-ROM，则使用 `make images`）。\n\n## 12.3.3. Simple-CDD：一站式解决方案\n\
  \n仅仅使用 preseed 文件不足以满足大规模部署中可能出现的所有要求。尽管可以在正常安装过程结束时执行几个脚本，但要安装的软件包集合的选择仍然不够灵活（基本上，只能选择“任务”(tasks)）；更重要的是，这只允许安装官方\
  \ Debian 软件包，而排除了本地生成的软件包。\n\n另一方面，`debian-cd` 能够整合外部软件包，而 `debian-installer` 可以通过在安装过程中插入新步骤来扩展。通过结合这些能力，应该能够创建一个满足我们需求的定制安装程序；它甚至应该能够在解压所需软件包后配置某些服务。幸运的是，这并不仅仅是一个假设，因为这正是\
  \ Simple-CDD（在 `simple-cdd` 软件包中）所做的。\n\nSimple-CDD 的目的是让任何人都能轻松地创建一个基于 Debian 的派发行版，方法是选择可用软件包的子集、使用\
  \ Debconf 对其进行预配置、添加特定软件并在安装过程结束时执行自定义脚本。这符合“通用操作系统”的哲学，因为任何人都可以根据自己的需求对其调整。\n\n\
  ### 12.3.3.1. 创建配置 (Profiles)\n\nSimple-CDD 定义了与 FAI “类”(classes) 概念匹配的“配置”(profiles)，机器可以有多个配置（在安装时确定）。一个配置由一组\
  \ `profiles/`*profile``.*` 文件定义：\n\n*   `.description` 文件包含该配置的单行描述；\n*   `.packages`\
  \ 文件列出了如果选择了该配置将自动安装的软件包；\n*   `.downloads` 文件列出了将存储在安装介质上但并不一定安装的软件包；\n*   `.preseed`\
  \ 文件包含用于 Debconf 问题的预设信息；\n*   `.postinst` 文件包含一个在安装过程结束时运行的脚本；\n*   最后，`.conf`\
  \ 文件允许根据要包含在镜像中的配置更改某些 Simple-CDD 参数。\n\n`default` 配置具有特殊作用，因为它总是被选中；它包含了 Simple-CDD\
  \ 运行所需的最少内容。该配置中通常被定制的只有 `simple-cdd/profiles` 预设 参数：这允许避免由 Simple-CDD 引入的关于要安装哪些配置的问题。\n\
  \n另请注意，命令需要在 `profiles` 目录的父目录中调用。\n\n## 12.3.3.2. 配置和使用 build-simple-cdd\n\n###\
  \ 快速 详细配置文件\n\n软件包中包含一个所有可能的参数的 Simple-CDD 配置文件示例（`/usr/share/doc/simple-cdd/examples/simple-cdd.conf.detailed.gz`）。在创建自定义配置文件时可以作为起点。\n\
  \nSimple-CDD 需要许多参数才能完全运行。这些参数通常收集在一个文件中，`build-simple-cdd` 可以通过 `--conf` 参数指向它，但也可以通过提供给\
  \ `build-simple-cdd` 的专用参数指定。以下是该命令行为及其参数使用方法的概述：\n\n*   `profiles` 参数列出了将包含在生成的\
  \ CD-ROM 镜像中的配置；\n*   根据所需软件包列表，Simple-CDD 从 `server` 中指定的服务器下载适当的文件，并将它们收集到部分镜像（稍后将交给\
  \ `debian-cd`）；\n*   `local_packages` 中提到的自定义软件包也会整合到此本地镜像中；\n*   随后执行 `debian-cd`（在\
  \ `debian_cd_dir` 变量配置的默认位置内），并带有要整合的软件包列表；\n\n\n\n\n\n- 一旦 `debian-cd` 准备好目录，`Simple-CDD`\
  \ 就会对该目录应用某些更改：\n    - 包含配置文件的会被添加到 `simple-cdd` 子目录中（该目录将出现在 CD-ROM 上）；\n    -\
  \ `all_extras` 参数中列出的其他文件也会被添加；\n    - 调整启动参数以启用预设（preseeding）。如果将所需信息存储在 `language`\
  \ 和 `country` 变量中，就可以避免有关语言和国家的问题。\n- `debian-cd` 随后生成最终的 ISO 镜像。\n\n### 12.3.3.3.\
  \ 生成 ISO 镜像\n\n一旦写好了配置文件并定义了配置，剩下的步骤是调用 `build-simple-cdd --conf simple-cdd.conf`。几分钟后，我们就能在\
  \ `images/debian-10-amd64-CD-1.iso` 得到所需的镜像。\n\n# 12.4. 监控\n\n监控是一个通用术语，涉及的各种活动有几个目标：一方面通过通过机器提供的资源的使用情况，可以预判饱和以及随后的后续升级；另一方面，一旦服务不可用或运行异常就立即通知管理员，意味着发生的问题可以更快地修复。\n\
  \n`Munin` 涵盖了第一个领域，通过显示许多参数的历史值图表（已用内存、占用磁盘空间、处理器负载、网络流量、Apache/MySQL 负载等）。`Nagios`\
  \ 涵盖了第二个领域，通过定期检查服务是否正常且可用，并通过适当的通道（电子邮件、短信等）发送警报。两者都采用模块化设计，这易于创建新的插件来监控特定的参数或服务。\n\
  \n***\n\n### 替代方案 Zabbix，一种集成监控工具\n\n尽管 Munin 和 Nagios 非常常用，但它们并不是监控领域唯一的参与者，而且每种工具只处理一半的任务（一边是图表，另一边是告报）。相比之下，Zabbix\
  \ 整合了监控的所有部分；它还有一个 Web 界面用于配置最常见的方面。它在过去几年中飞速发展，现在可以被认为是一个有力的竞争者。在监控服务器上，你需要安装 `zabbix-server-pgsql`（或\
  \ `zabbix-server-mysql`），可能还会一起安装 `zabbix-frontend-php` 以获得 Web 界面。在要监控的主机上，你需要安装\
  \ `zabbix-agent` 将数据回传给服务器。\n\n→ [`www.zabbix.com/`](https://www.zabbix.com/)\n\n\
  ***\n\n***\n\n### 替代方案 Icinga，Nagios 的分支\n\n由于对 Nagios 开发模型（由一家公司控制）的意见分歧，许多开发者分叉了\
  \ Nagios 并使用 Icinga 作为新名称。到目前，`Icinga` 仍然与 Nagios 的配置和插件兼容，但它添加了额外的功能。\n\n→ [`www.icinga.org/`](https://www.icinga.org/)\n\
  \n***\n\n***\n\n## 12.4.1. 设置 Munin\n\nMunin 的目的是监控许多机器；因此，它非常自然地使用了客户端/服务器架构。中央主机——绘图服务器（grapher）——收集所有被监控主机的数据并生成历史图表。\n\
  \n### 12.4.1.1. 配置要监控的主机\n\n第一步是安装 `munin-node` 包。该包安装的守护进程监听 `4949` 端口，并传回所有活动插件收集的数据。每个插件都是一个简单的程序，返回所收集数据的描述以及最新的测量值。插件存储在\
  \ `/usr/share/munin/plugins/` 中，但只有那些在 `/etc/munin/plugins/` 中有符号链接的插件才会被真正使用。\n\
  \n当安装包时，会根据可用软件和主机的当前配置确定一组活动插件。然而，这种自动配置取决于每个插件必须提供的一个特性，因此手动检查并微调结果通常是一个好主意。浏览插件库[^([5])](#ch12s04.html_ftn.idm15823)\
  \ 可能会很有趣，尽管并非所有插件都有完整的文档。不过，所有插件都是脚本，而且大多数都相当简单并有良好的注释。因此，浏览 `/etc/munin/plugins/`\
  \ 是了解每个插件作用并确定应该删除哪些插件的好方法。同样，启用在 `/usr/share/munin/plugins/` 中发现的有趣插件是一件简单的事，只需使用\
  \ `ln -sf /usr/share/munin/plugins/*plugin /etc/munin/plugins/` 设置符号链接即可。注意，当插件名称以下划线“_\"\
  结尾时，该插件需要一个参数。该参数必须存储在符号链接的名称中；例如，“if_”插件必须通过 `if_eth0` 符号链接启用，它将监控 eth0 接口上的网络流量。\n\
  \n一旦所有插件都设置正确，必须更新守护进程配置以描述对收集到的数据的访问控制。这涉及 `/etc/munin/munin-node.conf` 文件中的 `allow`\
  \ 指令。默认配置是 `allow ¹²⁷\\.0\\.0\\.1$`，只允许访问本地主机。管理员通常会添加一条包含绘图服务器主机 IP 地址的类似行，然后重启\
  \ `munin-node`。\n\n***\n\n### 进阶：创建本地插件\n\nMunin 确实包含了关于插件应该如何行为以及如何开发新插件的详细文档。\n\
  \n→ [`guide.munin-monitoring.org/en/latest/plugin/writing.html`](http://guide.munin-monitoring.org/en/latest/plugin/writing.html)\n\
  \n插件在与 `munin-node` 触发时相同的条件下运行测试效果最好；这可以通过以 root 身份运行 `munin-run plugin` 来模拟。传递给此命令的潜在第二个参数（如\
  \ `config`）会传递给插件。\n\n当带有 `config` 参数调用插件时，它必须通过返回一组字段来描述其自己：\n\n```\nsudo munin-run\
  \ load config graph_title Load average graph_args --base 1000 -l 0 graph_scale no\
  \ graph_category system load.info 机器的平均负载描述了有多少进程在运行队列中（被调度“立即”运行）。load.info 5 minute\
  \ load\n```\n\n各种可用字段由“Munin 指南”部分提供的“插件参考”进行了描述。\n\n→ [`munin.readthedocs.org/en/latest/reference/plugin.html`](https://munin.readthedocs.org/en/latest/reference/plugin.html)\n\
  \n当不带参数调用时，插件简单地返回上次的测量值；例如，执行 `sudo munin-run load` 可能会返回 `load.value 0.12`。\n\n\
  最后，当带有 `autoconf` 参数调用插件时，它应该根据该插件是否在该主机上启用来返回“yes”（退出状态为 0）或“no”（退出状态为 1）。\n\n\
  ***\n\n### 12.4.1.2. 配置绘图服务器\n\n“grapher”（绘图服务器）仅仅是汇总数据并生成相应图表的计算机。所需的软件位于 `munin`\
  \ 包中。标准配置运行 `munin-cron`（每 5 分钟一次），它从 `/etc/munin/munin.conf` 中列出的所有主机（默认仅列出本地主机）收集数据，存储在\
  \ `/var/lib/munin/` 下的 RRD 文件（*Round Robin Database*，用于存储随时间变化的数据的文件格式），并在 `/var/cache/munin/www/`\
  \ 生成带有图表的 HTML 页面。\n\n因此，所有监控的机器必须列在 `/etc/munin/munin.conf` 文件中。每台机器作为一个完整的章节列出，名称与机器匹配，并至少有一条给出相应\
  \ IP 地址的 `address` 条目。\n\n```\n[ftp.falcot.com] address 192.168.0.12 use_node_name\
  \ yes\n```\n\n\n\n\n章节（Sections）可以更加复杂，描述通过组合来自多台机器的数据可以创建的额外图表。配置文件提供的示例是自定义的良好起点。\n\
  \n最后一步是发布生成的页面；这涉及配置 Web 服务器，以便 `/var/cache/munin/www/` 中的内容可以通过网站访问。该网站的访问通常会受到限制，使用身份验证机制或基于\
  \ IP 的访问控制。相关细节请参见 第 11.2 节，“Web 服务器 (HTTP)”\")。\n\n## 12.4.2. 设置 Nagios\n\n与 Munin\
  \ 不同，Nagios 并不一定要求在被监控的主机上安装任何东西；大多数情况下，Nagios 用来检查网络服务的可用性。例如，Nagios 可以连接到 Web\
  \ 服务器，并检查是否能在给定时间内获取指定的网页。\n\n### 12.4.2.1. 安装\n\n设置 Nagios 的第一步是安装 `nagios4` 和\
  \ `monitoring-plugins` 包。安装这些包会配置 Web 和 Apache 服务器。必须启用 Apache 的 `authz_groupfile`\
  \ 和 `auth_digest` 模块，执行以下命令：\n\n```bash\n# a2enmod authz_groupfile\n# Considering\
  \ dependency authz_core for authz_groupfile: Module authz_core already enabled Enabling\
  \ module authz_groupfile. To activate the new configuration, you need to run: systemctl\
  \ restart apache2\n# a2enmod auth_digest\n# Considering dependency authn_core for\
  \ auth_digest: Module authn_core already enabled Enabling module auth_digest. To\
  \ activate the new configuration, you need to run: systemctl restart apache2\n#\
  \ systemctl restart apache2\n```\n\n添加其他用户只需将他们插入 `/etc/nagios4/hdigest.users` 文件中。\n\
  \n将浏览器指向 `http://server/nagios4/` 即可显示 Web 界面；特别需要注意的是，Nagios 已经在监控其运行机器的某些参数。然而，某些交互式功能（如为主机添加注释）无法正常工作。这些功能在\
  \ Nagios 的默认配置中是禁用的，出于安全考虑，这种限制非常严格。\n\n启用某些功能涉及编辑 `/etc/nagios4/nagios.cfg`。我们还需要为\
  \ Nagios 使用的目录设置写权限，命令如下：\n\n```bash\n# systemctl stop nagios4\n# dpkg-statoverride\
  \ --update --add nagios www-data 2710 /var/lib/nagios4/rw\n# dpkg-statoverride --update\
  \ --add nagios nagios 751 /var/lib/nagios4\n# systemctl start nagios4\n```\n\n###\
  \ 12.4.2.2. 配置\n\nNagios 的 Web 界面相当漂亮，但它不允许配置，也无法用于添加监控的主机和服务。整个配置通过中心配置文件 `/etc/nagios4/nagios.cfg`\
  \ 中引的文件进行管理。\n\n在不了解 Nagios 概念的情况下，不应深入研究这些文件。配置列出了以下类型的对象：\n\n* `host` 是被监控的机器；\n\
  * `hostgroup` 是一组主机，应组合在一起显示，或为了提取某些公共配置元素；\n* `service` 是与主机或主机组相关的可测试元素。它通常是对网络服务的检查，但也可以涉及检查某些参数是否在接受范围内（例如，可用磁盘空间或处理器负载）；\n\
  * `servicegroup` 是一组服务，应组合在一起显示；\n* `contact` 是可以接收告警的人；\n* `contactgroup` 是此类联系人的集合；\n\
  * `timeperiod` 是必须对某些服务进行检查的时间段范围；\n* `command` 是用于检查给定服务时调用的命令行。\n\n根据其类型，每个对象都有许多可以自定义的属性。完整的列表太长了无法包含，但最重要的属性是对象之间的关系。\n\
  \n一个 `service` 使用 `command` 在检查 `timeperiod` 范围内 `host`（或 `hostgroup`）上某个功能的状态。发生问题时，Nagios\
  \ 会向与该服务关联 `contactgroup` 的所有成员发送告警。每个成员将根据匹配的 `contact` 对象中描述的通道接收告警。\n\n继承系统允许在许多对象之间轻松地共享一组属性，而无需重复信息。此外，初始配置包含许多标准对象；在许多情况下，定义新的主机、服务和联系人只需从提供的通用对象进行派生即可。`/etc/nagios4/conf.d/`\
  \ 中的文件是关于它们工作原理的良好信息来源。\n\nFalcot Corp 的管理员使用以下配置：\n\n示例 12.3 `/etc/nagios4/conf.d/falcot.cfg`\
  \ 文件\n```cfg\ndefine contact{ name generic-contact service_notification_period 24x7\
  \ host_notification_period 24x7 service_notification_options w,u,c,r host_notification_options\
  \ d,u,r service_notification_commands notify-service-by-email host_notification_commands\
  \ notify-host-by-email register 0 ; Template only }\ndefine contact{ use generic-contact\
  \ contact_name rhertzog alias Raphael Hertzog email hertzog@debian.org }\n define\
  \ contact{ use generic-contact contact_name rmas alias Roland Mas email lolando@debian.org\
  \ }\ndefine contactgroup{ contactgroup_name falcot-admins alias Falcot Administrators\
  \ members rhertzog,rmas }\ndefine host{ use generic-host ; Name of host template\
  \ to use host_name www-host alias www.falcot.com address 192.168.0.5 contact_groups\
  \ falcot-admins hostgroups debian-servers,ssh-servers }\ndefine host{ use generic-host\
  \ ; Name of host template to use host_name ftp-host alias ftp.falcot.com address\
  \ 192.168.0.6 contact_groups falcot-admins hostgroups debian-servers,ssh-servers\
  \ }\n# 'check_ftp' command with custom parameters\ndefine command{ command_name\
  \ check_ftp2 command_line /usr/lib/nagios/plugins/check_ftp -H $HOSTADDRESS$ -w\
  \ 20 -c 30 -t 35 }\n# Generic Falcot service\ndefine service{ name falcot-service\
  \ use generic-service contact_groups falcot-admins register 0 }\n# Services to check\
  \ on www-host\ndefine service{ use falcot-service host_name www-host service_description\
  \ HTTP check_command check_http }\ndefine service{ use falcot-service host_name\
  \ www-host service_description HTTPS check_command check_https }\ndefine service{\
  \ use falcot-service host_name www-host service_description SMTP check_command check_smtp\
  \ }\n# Services to check on ftp-host\ndefine service{ use falcot-service host_name\
  \ ftp-host service_description FTP check_command check_ftp2 }\n```\n\n此配置文件描述了两个被监控的主机。第一个是\
  \ Web 服务器，对 HTTP (80) 和安全 HTTP (443) 端口进行检查。Nagios 还会检查 SMTP 服务器是否运行在端口 25 上。第二个主机是\
  \ FTP 服务器，检查包括确保回复在 20 秒内返回。超过此延迟，将发出 `warning`（警告）；超过 30 秒，告警将被视为 `critical`（严重）。Nagios\
  \ Web 界面还显示 SSH 服务正在被监控：这来自属于 `ssh-servers` 主机组的主机。匹配的标准服务定义在 `/etc/nagios4/conf.d/services_nagios2.cfg`\
  \ 中。\n\n注意继承的使用：通过“use `parent-name`”使对象继承另一个对象。父对象必须是可识别的，这需要赋予它“name `identifier`”属性。如果父对象不是一个真实的对象，而仅作为父对象使用，赋予它“register\
  \ 0”属性将告诉 Nagios 不要考虑它，从而忽略某些本应需要的参数缺失。\n\n* * *\n\n*文档* 对象属性列表\n\n\n\n要更深入地了解 Nagios\
  \ 的各种配置方法，可以参考托管 [https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/index.html]\
  \ 上的文档。该文档列出了所有对象类型以及它们可能拥的所有属性。它还解释了如何创建新插件。\n\n***\n\n## 进阶：使用 NRPE 进行远程测试\n\n\
  许多 Nagios 插件允许检查主机的本地某些参数；如果许多机器都需要进行这些检查，而由中心安装进行收集，则需要部署 `NRPE`（Nagios 远程插件执行器）插件。在\
  \ Nagios 服务器上需要安装 `nagios-nrpe-plugin` 包，在需要运行本地测试的主机上安装 `nagios-nrpe-server`。后者的配置从\
  \ `/etc/nagios/nrpe.cfg` 获取。该文件应该列出可以远程启动的测试，以及允许触发这些测试的机器 IP 地址。在 Nagios 侧，启用这些远程测试只需使用新的\
  \ `check_nrpe` 命令添加匹配的服务即可。\n\n***\n\n[^([5])](#ch12s04.html_idm15823)\n\n→ [`gallery.munin-monitoring.org`](http://gallery.munin-monitoring.org)\n\
  \n# 第 13 章 工作站\n\n现在服务器部署已经完成，管理员可以将精力放在安装各个工作站并创建典型的配置上。\n\n## 13.1. 配置 X11 服务器\n\
  \n简要回顾：X.org 是允许图形化应用程序在屏幕上显示窗口的软件组件。它包含一个能够有效利用显卡的驱动程序。为图形应用程序提供的功能通过标准接口 `X11`\
  \ 导出（Buster 包含 `X11R7.7` 版本）。\n\n***\n\n### 视角：X11、XFree86 和 X.org\n\nX11 是类 Unix\
  \ 系统中使用得广泛的图形系统（也适用于 Windows 和 Mac OS）。严格来说，“X11”一词仅指代一个协议规范，但它也被用于指代实践中的实现。\n\n\
  X11 的起步并不顺利，但在 20 世纪 90 年代，XFree86 成为参考实现，因为它是免费软件、可移植的并由协作社区维护。然而，在末期，演进速度变慢了，软件只获得了新的驱动程序。这种情况，加上一个极具争议的许可变更，导致了\
  \ 2004 年 X.org 的分叉。这现在是参考实现，Debian Buster 使用的是 X.org 7.7 版本。\n\n***\n\n当前 X.org\
  \ 版本能够自动检测可用的硬件：这适用于显卡和显示器，以及键盘和鼠标；事实上，它是如此方便，以至于该包再也不创建 `/etc/X11/xorg.conf` 配置文件。\n\
  \n键盘配置目前设置在 `/etc/default/keyboard` 中。该文件用于配置文本控制台和图形界面，并由 `keyboard-configuration`\
  \ 包处理。有关配置键盘布局的详细信息可以在 第 8.1.2 节，“配置键盘” 中找到。\n\n`xserver-xorg-core` 包提供了一个通用的 X\
  \ 服务器，如 X.org 7.x 版本所使用的。该服务器是模块化的，使用一组独立的驱动程序来处理许多不同类型的显卡。安装 `xserver-xorg` 可确保服务器和至少一个显卡驱动都已安装。\n\
  \n注意，如果检测到的显卡没有被任何可用驱动程序处理，X.org 会尝试使用 `vesa` 和 `fbdev` 驱动程序。VESA 是一个通用驱动程序，在任何地方都能工作，但功能有限（可用分辨率较少、没有用于游戏和桌面视觉效果的硬件加速等），而\
  \ `fbdev` 则在内核帧缓冲设备之上工作。如今，X 服务器可以在没有任何管理员权限的情况下运行（以前需要权限才能配置屏幕），其日志文件存储在用户目录的 `~/.local/share/xorg/Xorg.0.log`\
  \ 中，而对于 root 权限启动的 X 服务器以及 Debian 9 Stretch 之前的版本，则是 `/var/log/Xorg.0.log`。该日志文件是查看当前正在使用什么驱动程序的地方。例如，以下片段匹配\
  \ `intel` 驱动程序加载时的输出：\n\n```\n(==) Matched intel as autoconfigured driver 0 (==)\
  \ Matched modesetting as autoconfigured driver 1 (==) Matched vesa as autoconfigured\
  \ driver 2 (==) Matched fbdev as autoconfigured driver 3 (==) Assigned the driver\
  \ to the xf86ConfigLayout (II) LoadModule: \"intel\" (II) Loading /usr/lib/xorg/modules/drivers/intel_drv.so\n\
  ```\n\n***\n\n### 额外：专有驱动程序\n\n某些显卡制造商（最著名的是 NVIDIA）拒绝发布实现良好的免费驱动所需的硬件规范。然而，他们提供了允许使用其硬件的专有驱动。这种政策是阴险的，因为即使提供了驱动程序，它通常也不如应该的那么完善；更重要的是，我们建议你避免这些制造商。如果你最终还是拥有这样的卡，你可以在非自由（non-free）部分找到所需的包：`nvidia-driver`。通过安装\
  \ `nvidia-kernel-dkms` 可以自动化构建模块。\n\n“nouveau”项目旨在为 NVIDIA 卡开发免费软件驱动程序，它是 Debian\
  \ 中为这些显卡的默认驱动程序。通常情况下，ATI 显卡的免费驱动（称为 `radeon` 和 `amdgpu`）要好得多，尽管它通常需要来自 `firmware-amd-graphics`\
  \ 包的非自由固件。\n\n***\n\n## 13.2. 自定义图形界面\n\n### 13.2.1. 选择显示管理器\n\n图形界面只提供显示空间。单独运行\
  \ X 服务器只会导致空白屏幕，这就是为什么大多数安装使用*显示管理器*来显示用户验证界面并在用户通过验证后启动图形桌面。目前最流行的三种显示管理器是 `gdm3`（GNOME\
  \ 显示管理器）、`sddm`（建议用于 KDE Plasma）和 `lightdm`（Light 显示管理器）。由于 Falcot Corp 的管理员选择使用\
  \ GNOME 桌面环境，他们逻辑上也选择了 `gdm3` 作为显示管理器。`/etc/gdm3/daemon.conf` 配置文件有很多选项（列表可以在 `/usr/share/gdm/gdm.schemas`\
  \ 文件中找到）来控制其行为，而 `/etc/gdm3/greeter.dconf-defaults` 包含了界面“会话”的设置（不仅仅是一个登录窗口，它还是具有电源管理和辅助功能工具的限制桌面）。注意，对用户而言某些最有用的设置可以通过\
  \ GNOME 的控制中心进行调整。\n\n### 13.2.2. 选择窗口管理器\n\n由于每个图形桌面都提供自己的窗口管理器，你选择哪种窗口管理器通常取决于你选择了哪个桌面。GNOME\
  \ 使用 `mutter` 窗口管理器，Plasma 使用 `kwin`，而 Xfce（我们稍后介绍）拥有 `xfwm`。Unix 哲学始终允许使用选择的窗口管理器，但遵循建议可以让管理员最好地利用每个项目主导的集成工作。\n\
  \n***\n\n### 回到基础：窗口管理器\n\n\n\n\n窗口管理器在当前运行应用程序的窗口周围显示“装饰”，包括边框和标题栏。它允许最小化、还原、最大化和隐藏窗口。大多数窗口管理器还提供了一个菜单，当以特定方式点击桌面时就会弹出。该菜单提供了关闭窗口管理器会话、启动新应用程序，以及在某些情况下切换到另一个窗口管理器（如果已安装）的方法。\n\
  \n然而，旧的计算机运行重量级图形化桌面环境可能会很困难。在这种情况下，应该使用更轻量级的配置。“轻量级”（或小占用型）窗口管理器包括 WindowMaker（在\
  \ `wmaker` 包中）、Afterstep、`fvwm`、`icewm`、`blackbox`、`fluxbox` 或 `openbox`。在这些情况下，应配置系统使相应的窗口管理器获得优先级；标准方法是使用命令\
  \ `update-alternatives --config x-window-manager` 更改 `x-window-manager` 选项。\n\n\
  ### Debian 特有的替代方案\n\nDebian 策略列出了许多能够执行特定操作的标准化命令。例如，`x-window-manager` 命令调用窗口管理器。但\
  \ Debian 并没有将此命令分配给固定的窗口管理器。管理员可以选择它应该调用哪个管理器。\n\n因此，对于每个窗口管理器，相关包会将适当的命令注册为 `x-window-manager`\
  \ 的可能选择，并带有相关的优先级。在管理员没有显式配置的情况下，此优先级允许在运行通用命令时选择已安装的最佳窗口管理器。\n\n命令的注册和显式配置都涉及 `update-alternatives`\
  \ 脚本。选择符号命令指向何处只是简单地运行 `update-alternatives --config symbolic-command` 问题。`update-alternatives`\
  \ 脚本在 `/etc/alternatives/` 目录中创建（并维护）符号链接，这反过来引用可执行文件的位置。随着时间的推移，包被安装或删除，和或者管理员对配置进行了显式更改。当提供替代方案的包被删除时，该替代方案会自动转到剩余可用命令中的下一个最佳选择。\n\
  \n并不是所有的符号命令都被 Debian 策略显式出；某些 Debian 包维护者特意在较不直观的情况下使用这种机制，在这些情况下它仍然能带来有趣的灵活性（例如\
  \ `x-www-browser`、`www-browser`、`cc`、`c++`、`awk` 等）。\n\n## 13.2.3 菜单管理\n\n现代桌面环境和许多窗口管理器提供了列出可用应用程序的菜单。为了保持菜单与实际可用应用程序集同步，每个包通常在\
  \ `/usr/share/applications` 中提供一个 `.desktop` 文件。这些文件的格式已由 FreeDesktop.org 标准化：\n\
  \n→ [`standards.freedesktop.org/desktop-entry-spec/latest/`](https://standards.freedesktop.org/desktop-entry-spec/latest/)\n\
  \n管理员可以通过“桌面菜单规范”中描述的系统级配置文件进一步自定义应用程序菜单。终端用户也可以图形化工具自定义菜单，例如 `kmenuedit`（在 Plasma\
  \ 中）、`alacarte`（在 GNOME 中）或 `menulibre`。\n\n→ [`standards.freedesktop.org/menu-spec/latest/`](https://standards.freedesktop.org/menu-spec/latest/)\n\
  \n### 历史 Debian 菜单系统\n\n在历史上——在 FreeDesktop.org 标准出现很久以前——Debian 发明了自己的菜单系统，每个包在\
  \ `/usr/share/menu/` 中提供所需菜单条目的通用描述。该工具在 Debian 中仍然可用（在 `menu` 包中），但它的用处有限，因为包维护者被鼓励更多依赖\
  \ `.desktop` 文件。\n\n# 13.3 图形化桌面\n\n自由图形桌面领域由两个大型软件集合主导：GNOME 和 KDE 的 Plasma。它们都非常受欢迎。这在自由软件世界中是一个相当罕见的实例；例如，Apache\
  \ Web 服务器几乎没有同类对手。\n\n这种多样性根源于历史。Plasma（最初只有 KDE，现在是该社区的名称）是第一个图形桌面项目，但它选择了 Qt 图形工具包，而这个选择对于大量开发者来说是不可接受的。那时的\
  \ Qt 并不是自由软件，而 GNOME 是基于 GTK+ 工具包启动的。从此以后，Qt 已成为自由软件，但这些项目仍在并行发展。\n\nGNOME 和 KDE\
  \ 社区仍然一起工作：在 FreeDesktop.org 的伞下，这些项目协作定义了跨应用程序互操作性的标准。\n\n选择“最佳”的图形桌面是一个敏感的话题，我们更倾向于避开它。我们仅仅描述许多可能性，并为进一步思考提供一些提示。最好的选择将是你进行一些实验后的决定。\n\
  \n## 13.3.1 GNOME\n\nDebian Buster 包含了 GNOME 3.30 版本，可以通过简单的 `apt install gnome`\
  \ 安装（也可以通过选择“Debian 桌面环境”任务来安装）。\n\nGNOME 在易用性和可访问性方面的努力值得关注。设计专业人士参与了编写其标准和建议，这帮助了开发者创建出满意的图形用户界面。该项目还来自计算巨头的鼓励，如\
  \ Intel、IBM、Oracle、Novell，当然还有各种 Linux 发行版。最后，许多编程语言可用于开发与 GNOME 接口的应用程序。\n\n图 13.1.\
  \ GNOME 桌面![GNOME 桌面](img/gnome.png)\n\n对于管理员来说，GNOME 似乎为大规模部署准备得充分。应用程序配置通过 GSettings\
  \ 接口处理，并将数据存储在 DConf 数据库中。因此，可以使用 `gsettings` 和 `dconf` 命令行工具，或者通过 `dconf-editor`\
  \ 图形用户界面查询并编辑配置设置。因此，管理员可以使用简单的脚本更改用户的配置。GNOME 网站为管理 GNOME 工作站的管理员提供指导信息：\n\n→ [`help.gnome.org/admin/`](https://help.gnome.org/admin/)\n\
  \n## 13.3.2 KDE 和 Plasma\n\nDebian Buster 包含了 5.14  KDE Plasma，可以通过 `apt install\
  \ kde-standard` 安装。\n\nPlasma 基于一种非常实用的方法经历了快速演进。它的作者很快获得了非常好的结果，这使他们培养了大量的用户群。这些因素有助于项目的整体质量。Plasma\
  \ 是一个成熟的桌面环境，拥有广泛的应用程序。\n\n图 13.2. Plasma 桌面![Plasma 桌面](img/kde.png)\n\n自 Qt 4.0\
  \ 发布以来，KDE 软件最后的许可证问题已经解决。该版本根据 GPL 协议在 Linux 和 Windows 发布（Windows 版本之前是以非免费许可证发布的）。KDE\
  \ 应用程序主要使用 C++ 语言开发。\n\n## 13.3.3 Xfce 及其他\n\nXfce 是一个简单且轻量级的图形桌面，是资源有限计算机的完美匹配。可以通过\
  \ `apt install xfce4` 安装。与 GNOME 类似，Xfce 基于 GTK+ 工具包，并且在两个桌面中有多个组件是通用的。\n\n\n\n\n\
  与 GNOME 和 Plasma 不同，Xfce 并不旨在成为一个庞大的项目。除了现代桌面的基础组件（文件管理器、窗口管理器、会话管理器、用于应用程序启动器的面板等）之外，它只提供几个特定的应用程序：终端、日历（`orage`）、图像查看器、CD/DVD\
  \ 刻录工具、媒体播放器（`parole`）、音量控制和文本编辑器（`mousepad`）。\n\n→ [`xfce.org/`](https://xfce.org/)图\
  \ 13.3. Xfce 桌面![Xfce 桌面](img/xfce.png)\n\n## 13.3.4. 其它桌面环境\n\n`LXDE` 和 `LXQt`\
  \ 是两个专注于“轻量化”特性的桌面环境。前者基于 GTK+，而后者基于 Qt。它们可以通过 `lxde` 和 `lxqt` 元软件包进行安装。\n\n→ [`lxde.org/`](https://lxde.org/)\
  \ → [`lxqt.org/`](https://lxqt.org/)\n\n`Cinnamon` 和 `MATE` 都始于 GNOME 3 放弃传统的桌面范式（即舍弃了常用的面板及其菜单，转而采用新的基于搜索的壳）。前者通过分分支\
  \ GNOME Shell 重新引入了面板，而后者是 GNOME 2 的延续。它们可以通过 `cinnamon-desktop-environment` 和 `mate-desktop-environment`\
  \ 元软件包安装。\n\n→ [`developer.linuxmint.com/projects/cinnamon-projects.html`](https://developer.linuxmint.com/projects/cinnamon-projects.html)\
  \ → [`mate-desktop.org/`](https://mate-desktop.org/)\n\n# 13.4. 邮件\n\n### 13.4.1.\
  \ 演变\n\n* * *\n\n社区 热门软件包\n\n安装 `popularity-contest` 软件包可以参与一项自动化调查，该调查会向 Debian\
  \ 项目提供有关热门软件包的信息。`cron` 每周运行一次脚本，发送已安装软件包的匿名列表（通过 HTTP 或电子邮件发送）以及它们包含的文件的最新访问日期。这使得\
  \ Debian 维护者了解哪些软件包被安装的频率最高，以及在这些软件包中，实际使用的频率如何。\n\n这些信息对 Debian 项目非常有帮助。它们被用于确定哪些软件包应该放在第一个安装光盘上。安装数据也是决定是否从发行版中移除用户极少的软件包的重要因素。我们热心建议安装\
  \ `popularity-contest` 软件包并参与调查。\n\n收集到的数据每天公开。\n\n→ [`popcon.debian.org/`](https://popcon.debian.org/)\n\
  \n这些统计数据还可以帮助用户在两个看似等价的软件包之间进行选择。选择更受欢迎的软件包可能是一个更安全的选择。\n\nEvolution 是 GNOME 的邮件客户端，可以通过\
  \ `apt install evolution` 安装。它不仅仅是一个简单的邮件客户端：它还提供了日历、地址录、任务列表和备忘录（自由格式笔记）应用程序。它的邮件组件包含一个强大的消息索引系统，并允许基于对归档消息的搜索查询创建虚拟文件夹。换句话说，所有消息以相同的方式存储，但以基于文件夹的组织形式显示，每个文件夹包含符合一组过滤标准则的消息。\n\
  \n图 13.4. Evolution 邮件软件![Evolution 邮件软件](img/evolution.png)\n\nEvolution 的一个扩展允许与\
  \ Microsoft Exchange 邮件系统集成；所需的软件包是 `evolution-ews`⁶。\n\n### 13.4.2. KMail\n\nKDE\
  \ 邮件软件可以通过 `apt install kmail` 安装。KMail 仅处理邮件，但它属于一个名为 `KDE-PIM`（个人信息管理器）的软件套件，该套件包含了地址录、日历组件等功能。KMail\
  \ 拥有人们对一个优秀的邮件客户端所期待的所有功能。\n\n图 13.5. Thunderbird \n\n### 13.4.3. Thunderbird\n\n\
  `thunderbird` 软件包提供了 Mozilla 软件套件中的邮件客户端。各种本地化包可以在 `thunderbird-l10n-*` 软件包中找到；enigmail\
  \ 扩展处理消息的加密和签名，但它在所有语言中并不可用。\n\n图 13.6. Thunderbird 邮件软件![Thunderbird 邮件软件](img/thunderbird.png)\n\
  \n* * *\n\n[⁶] `evolution-ews` 软件包不是 Debian Buster 的。它在发布过程中由于安全问题被移除。但在写作时，最新版本已作为回传（backport）可用（参见\
  \ 第 6.1.2.4 节，“稳定回传”）。\n\n# 13.5. 网页浏览器\n\nEpiphany 是 GNOME 套件中的网页浏览器，使用苹果为其 Safari\
  \ 浏览器开发的 WebKit 显示引擎。相关软件包是 `epiphany-browser`。\n\nKonqueror 位于 `konqueror` 软件包中，是\
  \ KDE 的网页浏览器（也可以承担文件管理器的角色）。它使用 KDE 特有的 `KHTML` 渲染引擎；`KHTML` 是一个极佳的引擎，从苹果的 WebKit\
  \ 是基于 `KHTML` 的这一事实可以得到证明。\n\n对上述任何一个都不满意的用户可以使用 Firefox。该浏览器在 `firefox-esr` 软件包中可用，它使用\
  \ Mozilla 项目的 `Gecko` 渲染器，在其上方带有一个轻量且可扩展的接口。\n\n图 13.7. Firefox 网页浏览器![Firefox 网页浏览器](img/firefox.png)\n\
  \n* * *\n\n词汇 Firefox ESR\n\nMozilla 对 Firefox 的发布周期非常快。新版本每六到八周发布一次，并且仅对最新版本提供安全支持。这并不适用于所有类型的用户，因此每\
  \ 10 个周期，他们会将其一个发布版本推广为扩展支持版本（ESR），该版本将在后续 10 个周期（涵盖略多一年）内获得安全更新（且没有功能变化）。\n\nDebian\
  \ 对这两个版本都进行了打包。由于支持周期长，ESR 版本（位于 `firefox-esr` 软件包中）是默认使用的，它是唯一适用于 Debian Stable\
  \ 的版本，其支持周期很长（即使在那里，Debian 也不得多次从一个 ESR 版本升级到下一个）。普通的 Firefox 在 `firefox` 软件包中可用，但它仅供\
  \ Debian Unstable 用户使用。\n\n* * *\n\n* * *\n\n文化 Iceweasel, Firefox 以及其他\n\n在 Debian\
  \ Stretch 之前，Firefox 和 Thunderbird 是缺失的。iceweasel` 软件包包含了 Iceweasel，它本质上是换了名字的 Firefox。\n\
  \n这种重命的原理是 Mozilla Foundation 对 Firefox 注册商标施加的使用规则：任何命名为 Firefox 的软件必须使用官方的 Firefox\
  \ 图标和图标。然而，由于这些元素不是在自由许可下发布的，Debian 无法在 *main*（主）部分分发它们。与其将整个浏览器移动到 *non-free*（非自由），软件包维护者选择了不同的名称。\n\
  \n出于类似的原因，Thunderbird™ 邮件客户端以类似的方式重命名为 Icedove。\n\n现在，图标和图形是在自由软件许可下发布的，Mozilla\
  \ 承认 Debian 项目所做的更改尊重了他们的商标许可，因此 Debian 能够再次以官方名称分发 Mozilla 的应用程序。\n\n\n\n\n\nNetscape\
  \ Navigator 在互联网开始进入大众时代一直是标准浏览器，但当微软在 Windows 中捆绑 Internet Explorer，并与计算机制造商签署了禁止其预装\
  \ Netscape Navigator 的合后，它失去了阵地。面对这一失败，Netscape（公司）决定通过在免费许可下发布源代码来“释放”它，赋予它第二次生命。这就是\
  \ Mozilla 项目的开始。经过多年的开发，其结果令人非常满意：Mozilla 项目产生了一个 HTML 渲染引擎（称为 `Gecko`），它是最符合标准的渲染引擎之一。该渲染引擎特别地被\
  \ Mozilla Firefox 浏览器使用，它是主流浏览器之一。\n\n最后但同样重要的是，Debian 还包含 `Chromium` Web 浏览器（可在\
  \ `chromium` 包中可用）。该浏览器由 Google 开发，并在短短几年内已成为最受欢迎的浏览器。它的明确目标是通过优化浏览器性能和提高用户安全性，使\
  \ Web 服务更具吸引力。驱动 Chromium 的免费代码也被其专有版本 Google Chrome™ 使用。\n\n# 13.6 开发\n\n## 13.6.1\
  \ 用于 GNOME 的 GTK+ 工具\n\nAnjuta（位于 `anjuta` 软件包中）和 GNOME Builder（位于 `gnome-builder`\
  \ 软件包中）是针对为 GNOME 创建 GTK+ 应用而优化的集成开发环境 (IDE)。Glade（位于 `glade` 软件包中）是一个旨在为 GNOME\
  \ 创建 GTK+ 图形界面并将其保存为 XML 文件的应用程序。这些 XML 文件可以通过 GTK+ 共享库通过其 `GtkBuilder` 组件加载以重建保存的界面；这种功能可能趣，例如对于需要对话框的插件。\n\
  \n→ [`wiki.gnome.org/Apps/Builder`](https://wiki.gnome.org/Apps/Builder)→ [`anjuta.org/`](http://anjuta.org/)→\
  \ [`glade.gnome.org/`](https://glade.gnome.org/)\n\n## 13.6.2 Qt 工具\n\nQt 应用的等效程序是\
  \ KDE 提供的 KDevelop（位于 `kdevelop` 软件包中）用于开发环境，以及 Qt Designer（位于 `qttools5-dev-tools`\
  \ 软件包中）用于 Qt 应用的图形界面设计。\n\nKDevelop 也是一个通用 IDE，并为 Python 和 PHP 等语言以及不同的构建系统提供插件。\n\
  \n# 13.7 协作工作\n\n## 13.7.1 组工作：群件软件\n\n群件工具的维护相对复杂，因为它们聚合了多个工具，并且其需求在集成发行版的范围内并不总是容易协调。因此，Debian\
  \ 中曾有一个很长的群件软件包列表，但由于缺乏维护者或与 Debian 中的其他（更新）软件不兼容而被弃用。PHPGroupware、eGroupware 和\
  \ Kolab 就是这种情况。\n\n→ [`www.egroupware.org/`](https://www.egroupware.org/)→ [`www.kolab.org/`](https://www.kolab.org/)\n\
  \n尽管如此并非如此。传统上由“群件”软件提供的许多功能越来越多地集成到“标准”软件中。这减少了对特定、专门群件软件的需求。另一方面，这通常需要特定的服务器。Citadel（位于\
  \ `citadel-suite` 软件包中）、Sogo（位于 `sogo` 软件包中）和 Kopano（位于 `kopano-core` 软件包中）是 Debian\
  \ Buster 中可用的替代方案。\n\n## 13.7.2 使用 FusionForge 进行协作工作\n\nFusionForge 是一个协作开发工具，其起源源自\
  \ SourceForge（一个自由软件项目的托管服务）。它采取了基于自由软件标准开发模型的相同方法。在 SourceForge 代码变为专有后，软件本身继续演进。其初始作者\
  \ VA Software 决定不再发布任何免费版本。当第一个分支 (GForge) 遵循相同路径时，同样的事情再次发生。由于不同的个人和组织参与了开发，目前的\
  \ FusionForge 还包含了针对更传统开发方法的功能，以及不纯粹关注软件开发的项目。\n\nFusionForge 可以被视为几个用于管理、跟踪和协调项目的工具的合集。这些工具可以大致分为三类：\n\
  \n- 通信：网络论坛、邮件列表管理器以及允许项目发布新闻的公告系统\n- 跟踪：跟踪项目进度和任务计划的工具、跟踪错误、功能请求或其他任何类型的“工单”以及运行调查问的工具\n\
  - 共享：文档管理器（为项目相关文档提供单一中心点）、通用文件发布管理器、每个项目的专用网站。\n\n由于 FusionForge 大多针对开发项目，它还成了许多工具，如\
  \ CVS、Subversion、Git、Bazaar、Darcs、Mercurial 和 Arch，用于源码控制管理（也称为“配置管理”或“版本控制”）。这些程序保留了所有跟踪文件（通常是源代码文件）的所有修订历史，以及它们所经历的所有更改，当几位开发者同时在项目的同一部分工作时，它们可以合并修改。\n\
  \n这些工具大部分可以通过 Web 界面访问甚至管理，并具有细粒度的权限系统，以及对某些事件提供电子邮件通知。\n\nFusionForge 不是 Debian\
  \ Stable 的一部分。它是一个大型软件栈，难以正确维护，且仅对少数用户有利，这些用户通常足够专家，能够从 Debian Unstable 中回传（backport）该软件包。\n\
  \n### 备选方案 GitLab\n\nFusionForge 已在近十年中支持了 Debian 项目及其开发者使用的 `alioth.debian.org`\
  \ 平台，用于协作式包管理。由于某些局限性，它在 2018 年被一个由 GitLab 驱动的新服务取代并关闭。参见侧边栏工具 GitLab、Git 仓库以及更多内容。\n\
  \n# 13.8 办公套件\n\n在自由软件世界，办公软件一直被视为匮乏。用户需要 Microsoft 工具的替代品（如 Word 和 Excel），但这些工具如此复杂，以至于替代品很难开发。当\
  \ Sun 在免费许可下发布 StarOffice 代码作为 OpenOffice 时，情况发生了变化，该项目后来诞生了 LibreOffice，它在 Debian\
  \ 中已可用。KDE 项目也有自己的办公套件，称为 Calligra Suite（之前的 KOffice），而 GNOME 虽然从未提供全面的办公套件，但提供了\
  \ AbiWord 作为文字处理器，并将 Gnumeric 作为电子表格。不同的项目各有优劣。例如，Gnumeric 电子表格在某些领域优于 OpenOffice.org/LibreOffice，特别是其计算的精确度。在文字处理方面，LibreOffice\
  \ 套件仍然领先。\n\n对用户的另一个重要功能是导入 Microsoft Office 文档的能力。尽管所有办公套件都有此功能，但只有 OpenOffice.org\
  \ 和 LibreOffice 中的版本功能足够日常使用。\n\n\n\n\n\n在 OpenOffice.org 经历了相对停滞后，Oracle 将代码及相关权利捐给了\
  \ Apache 软件基金，OpenOffice 现在是一个 Apache 项目。该项目目前在 Debian 中不可用，而且与 LibreOffice 相比，它已经处于边缘状态。\n\
  \n* *\n\nLibreOffice 和 Calligra Suite 分别可以通过 `libreoffice` 和 `calligra` Debian 软件包可用。尽管之前使用\
  \ `gnome-office` 软件包来安装 `AbiWord` 和 `Gnumeric` 等一系列办公工具，但该软件包已不再是 Debian 的一部分，现在这些软件包均独立存在。\n\
  \nLibreOffice 的特定语言包在单独软件包中分发，最著名的是 `libreoffice-l10n-*` 和 `libreoffice-help-*`。某些功能如拼写检查字典、连字符模式和同义词表位于单独软件包中，例如\
  \ `myspell-*`、`hunspell-*`、`hyphen-*` 和 `mythes-*`。\n\n# 13.9. 模拟 Windows：Wine\n\
  \n尽管有了上述提到的所有努力，仍有许多工具没有 Linux 对应版本，或者必须使用原始版本。这就是 Windows 模拟系统大显身手的地方。其中最著名的是 Wine。\n\
  \n→ [`www.winehq.org/`](https://www.winehq.org/)\n\n* *\n\n### 补充 CrossOver Linux\n\
  \n`CrossOver` 由 CodeWeavers 制作，是一组 Wine 的增强方案，它扩展了可用的模拟功能，使得 Microsoft Office 变得完全可用。某些增强功能定期合并到\
  \ Wine 中。\n\n→ [`www.codeweavers.com/products/`](https://www.codeweavers.com/products/)\n\
  \n* *\n\n然而，应该记住，这只是众多解决方案之一，问题也可以通过虚拟机或 VNC 来解决；这两个解决方案都在侧边栏中详细介绍*替代方案* 虚拟机 和 *替代方案*\
  \ Windows 终端服务器或 VNC 中。\n\n让我们从一个回顾开始：模拟允许在不同的主机系统上执行（为目标系统开发的）程序。模拟软件使用运行应用程序的主机系统来模仿目标系统所需的功能。\n\
  \n现在让我们安装所需的软件包（`ttf-mscorefonts-installer` 位于 `contrib` 部分）：\n\n```bash\napt install\
  \ wine ttf-mscorefonts-installer\n```\n\n在 64 位 (amd64) 系统上，如果你的 Windows 应用程序是 32\
  \ 位应用程序，你将必须启用多架构（multi-arch）以便从 `i386` 架构安装 `wine32`（参见第 5.4.5 节，“多架构支持）。\n\n用户随后需要运行\
  \ `winecfg` 并配置哪些 (Debian) 位置映射到哪些 (Windows) 驱动器。`winecfg` 有一些合理的默认值，并可以自动检测更多驱动器；请注意，即使你有双启动系统，也不应该将\
  \ `C:` 驱动器指向 Debian 中挂载 Windows 分区的位置，因为 Wine 可能会覆盖该分区上的某些数据，导致 Windows 无法使用。其他设置可以保持默认值。要运行\
  \ Windows 程序，你首先需要通过在 Wine 下运行其（Windows）安装程序来安装它们，命令类似于 `wine .../setup.exe`；一旦程序安装完成，你就可以\
  \ `wine .../program.exe` 运行它。`program.exe` 文件的确位置取决于 `C:` 驱动器的映射位置；但在许多情况下，只需运行\
  \ `wine program` 即可生效，因为程序通常安装在 Wine 会自动查找的位置。\n\n* *\n\n### 提示 解决 winecfg 失败的方法\n\
  \n在某些情况下，`winecfg`（它只是一个包装器）可能会失败。作为变通方法，可以尝试手动运行底层命令：\n\n```bash\nwine64 /usr/lib/x86_64-linux-gnu/wine/wine/winecfg.exe.so\n\
  wine32 /usr/lib/i386-linux-gnu/wine/wine/winecfg.exe.so\n```\n\n* *\n\n注意，你不可以在没有实际测试特定软件的情况下依赖\
  \ Wine（或类似的解决方案）：只有通过实际测试才能确定性地判断模拟是否完全正常。\n\n* *\n\n### 替代方案 虚拟机\n\n模拟微软系统的另一种方案是实际上在一个模拟完整硬件机器的虚拟机中运行它。这允许运行任何操作系统。第\
  \ 12 章，高级管理 描述了多种虚拟化系统，最著名的是 Xen 和 KVM（还有 QEMU、VMWare 和 Bochs）。\n\n* *\n\n### 替代方案\
  \ Windows 终端服务器或 VNC\n\n另一种可能性是在带有 Windows 终端服务器的中央服务器上远程运行旧 Windows 程序，并使用 `rdesktop`\
  \ 从 Linux 机器访问应用程序。这是 RDP 协议（远程桌面协议）的 Linux 客户端，Windows NT/2000 终端服务器使用它在远程机器上显示桌面。\n\
  \nVNC 软件提供了类似的功能，并且优点是还可以适用于许多操作系统。Linux VNC 客户端和服务器在第 9.2 节，“远程登录` 中描述。\n\n* *\n\
  \n# 13.10. 实时通信软件\n\nDebian 提供了丰富的实时通信 (RTC) 客户端软件。RTC 服务器的设置在第 11.8 节，“实时通信服务`\
  \ 中讨论。在 `SIP`（会话建立协议）术语中，客户端应用程序或设备也被称为用户代理（user agent）。\n\n每个客户端应用程序的功能各异。某些应用程序对于频繁聊天的用户来说更方便，而其他应用程序对于摄像头用户来说则更稳定。可能需要测试多个应用程序以识别最令人满意的那些。用户最终可能决定需要多个应用程序，例如用于与客户消息的\
  \ XMPP 应用程序和用于与某些在线社区协作的 IRC 应用程序。\n\n为了最大限地提高用户与外部世界通信的能力，建议同时配置 SIP 和 XMPP 客户端，或配置支持这两种协议的单一客户端。\n\
  \n默认的 GNOME 桌面建议 Empathy 通信客户端。Empathy 同时支持 SIP 和 XMPP。它支持即时消息 (IM)、语音和视频。KDE 项目提供了\
  \ KDE Telepathy，这是一个基于 GNOME Empathy 客户端相同的 Telepathy API 的通信客户端。\n\nEmpathy/Telepathy\
  \ 的流行替代方案包括 `Ekiga`、`Linphone`、`Psi` 和 `Jami`（以前名为 `Ring`）。\n\n这些应用程序中的某些可以使用 Android\
  \ 上的 `Lumicall` 等应用与移动用户交互。\n\n→ [`lumicall.org`](https://lumicall.org)\n\n《实时通信快速上手指南》有一章专门介绍客户端软件。\n\
  \n→ [`rtcquickstart.org/guide/multi/useragents.html`](http://rtcquickstart.org/guide/multi/useragents.html)\n\
  \n* *\n\n### 提示 寻找支持 ICE 和 TURN 的客户端\n\n 某些 RTC 客户端在通过防火墙和 NAT 网络发送语音和视频时存在严重问题。用户可能会收到幻听电话（手机响了但听不到对方的声音），或者可能根本无法通话。\n\
  \nICE 和 TURN 协议是为了解决这些问题而开发的。在每个站点运行带有公网 IP 的 TURN 服务器，并使用同时支持 ICE 和 TURN 的客户端软件，可以获得最佳的用户体验。\n\
  \n如果客户端软件仅用于即时消息，则不需要 ICE 或 TURN 支持。\n\n\n\n\n\nDebian 人员在 [rtc.debian.org](https://rtc.debian.org)\
  \ 运行着社区 SIP 服务。该社区维护着一个 wiki，提供了关于设置 Debian 中封装的许多客户端应用程序的文档。该 wiki 的文章和截图对于任何想要在自己的域名上建立类似服务的人来说，都是非常有用的资源。\n\
  \n→ [`wiki.debian.org/UnifiedCommunications/DebianDevelopers/UserGuide`](https://wiki.debian.org/UnifiedCommunications/DebianDevelopers/UserGuide)\n\
  \n## 备选：互联网即时聊天\n\n除了 SIP 和 XMPP 之外，还可以考虑 IRC。IRC 更侧向于“通道”（channels）的概念，通道名称以井号\
  \ `#` 开头。每个通道通常针对特定主题，任意数量的人都可以加入通道进行讨论（但如果需要，用户仍然可以进行一对一的私密对话）。IRC 协议较老，不支持消息的端到端加密；但仍然可以通过在\
  \ SSL 隧道中封装 IRC 协议来对用户与服务器之间的通信加密。\n\nIRC 客户端稍微复杂一些，它们通常提供许多在公司环境中用途有限的功能。例如，通道“操作员”（operators）是拥有将其他用户从通道中踢出、甚至在正常讨论受到中断时永久封禁他们的用户。\n\
  \n由于 IRC 协议非常老旧，有许多客户端可以迎合不同的用户群；例如 XChat 和 Smuxi（基于 GTK+ 的图形化客户端）、Irssi（文本模式）、Circe（集成在\
  \ Emacs 中）等。\n\n# 第 14 章：安全\n\n信息系统的重要性根据环境的不同而有所不同。在某些情况下，它对公司的生存至关重要。因此，必须保护免受各种风险的侵害。评估这些风险、定义并实施保护措施的过程统称为“安全过程”。\n\
  \n## 14.1. 定义安全策略\n\n### 注意：本章的范围\n\n安全是一个宏大且非常敏感的主题，因此我们不能声称在单章中以任何全面的方式来描述它。我们仅勾勒几个要点，并描述一些在安全领域可能な工具和方法。如需进一步阅读，文献非常丰富，甚至有整本书专门致力于这个主题。Michael\
  \ D. Bauer 编写的 *Linux Server Security*（O'Reilly 出版）是一个极佳的起点。\n\n“安全”一词本身涵盖了广泛的概念、工具和程序，其中没有一个是通用的。在它们之间做出需要对你的目标有精确的理解。保护系统从回答几个问题开始。盲目地实施一套任意的工具会有关注安全错误侧面的风险。\n\
  \n因此，首要要确定的是目标。有助于这一决定的良好方法是从以下问题开始的：\n\n* 我们试图保护什么？取决于我们想保护计算机还是数据，安全策略将有所不同。在后的情况下，我们还需要知道是哪些数据。\n\
  * 我们试图防范什么？是机密数据的泄露吗？意外的数据丢失？还是服务中断导致的收入损失？\n* 此外，我们试图防范谁？对于防范系统普通用户的拼写错误，与防范有意的攻击者群体相比，安全措施会有很大不同。\n\
  \n“风险”一词通常用来统指这三个因素：保护什么、需要防止发生什么、以及谁会尝试使其发生。风险建模需要对这三个问题给出答案。从这个风险模型中可以构建安全策略，并通过具体的行动实施该策略。\n\
  \n### 注意：持续的质疑\n\n安全领域的世界专家（不仅是计算机安全）Bruce Schneier 试图用一句格言来反驳安全领域最重要的神话之一：“安全是一个过程，而不是一个产品”。受保护的资产随时间而变化，威胁以及潜在攻击者的可用手段也是如此。即使安全策略最初被完美地设计和实施了，也绝不能固步自封。风险要素在演进，对该风险的响应也必须相应演进。\n\
  \n额外的约束也值得考虑，因为它们可能会限制可用策略的范围。为了保护系统，我们愿意做到什么程度？这个问题对要实施的策略有重大影响。答案往往仅通过金钱成本来定义，但也应该考虑其他因素，例如给系统用户带来的不便程度或性能下降。\n\
  \n一旦完成了风险建模，就可以开始考虑设计实际的安全策略了。\n\n### 注意：极端策略\n\n在某些情况下，保护系统所需的行动选择极其简单。\n\n例如，如果要保护的系统只包含一台二手电脑，其唯一用途是在一天结束时末尾加几个数字，那么决定不采取任何特殊措施来保护它是完全合理的。系统的内在价值很低。数据的价值为零，因为它们没有存储在计算机上。渗透这个“系统”的潜在攻击者只会得到一个笨重的计算器。保护这样一个系统的成本可能高于破解漏洞的成本。\n\
  \n在光谱的另一端，我们可能希望以尽可能全面的方式保护秘密数据的机密性，超越任何其他考虑。在这种情况下，适当的响应是完全破坏这些数据（安全地删除文件、将硬盘粉碎成碎片，然后将碎片溶解在酸中等）。如果额外要求数据必须存储以备未来使用（尽管不一定随时可用），并且成本仍然不是因素，那么起点是将数据存储在铱铂合金板上，存放在世界各地大山下的防弹地堡中，每个地堡（当然）都是完全保密并由整个军队守护的……\n\
  \n尽管这些例子看起来很极端，但只要它们是考虑了要实现的目标和需要满足的约束的思维过程的结果，它们对于定义的风险来说就是适当的响应。只要是基于合理的决策，没有任何安全策略比其他任何策略更不受尊重。\n\
  \n在大多数情况下，信息系统可以被分成一致且大多相互独立的子集。每个子系统将有自己的需求和约束，因此风险评估和安全策略的设计应该对每个子系统分别进行。一个需要记住的良好原则是：短且定义良好的边界比长而曲折的边界更容易防御。网络组织也应相应设计：敏感服务应集中在少数几台机器上，这些机器应仅通过极少数的检查点访问；保护这些检查点比保护所有敏感机器免受整个世界的攻击更容易。在这一点，网络过滤（包括防火墙）的作用显而易见。这种过滤可以使用专用硬件实现，但一个更简单且灵活的解决方案是使用软件防火墙，例如集成在\
  \ Linux 内核中的那种。\n\n## 14.2. 防火墙或数据包过滤\n\n### 回到基础：防火墙\n\n\n\n\n\n# 防火墙\n\n`firewall`\
  \ 是一种带有硬件和/或软件的计算机设备，对进入或离开的网络数据包（来自或离开本地网络）进行排序，并仅允许符合某些预定义条件的数据包通过。\n\n防火墙是一种过滤网络网关，仅对必须经过它的数据包有效。因此，只有当通过防火墙是这些数据包的唯一路由时，它才能生效。\n\
  \n## 特殊情况：本地防火墙\n\n防火墙可以被限制在一个特定的机器（而不是整个网络），在这种情况下，它的作用是过滤或限制对某些服务的访问，或者可能防止用户自愿或非自愿的恶意软件发出的外部连接。\n\
  \nLinux 内核内置了 `netfilter` 防火墙，可以通过 `iptables`、`ip6tables`、`arptables` 和 `ebtables`\
  \ 命令从用户空间进行控制。\n\n然而，Netfilter `iptables` 命令正在被 `nftables` 取替，后者避免了许多问题。它的设计涉及更少的代码重复，只需使用\
  \ `nft` 命令即可管理。Debian Buster 默认使用 `nftables` 框架。\n\n在 Debian 中启用默认防火墙请执行：\n\n```bash\n\
  apt install -y nftables\nReading package lists... Done ... #\nsystemctl enable nftables.service\n\
  Created symlink /etc/systemd/system/sysinit.target.wants/nftables.service → /lib/systemd/system/nftables.service.\n\
  ```\n\n### 14.2.1. nftables 行为\n\n当内核处理网络数据包时，它会暂停并允许我们检查数据包并决定对该包进行什么操作。例如，我们可能想要丢弃或删除某些传入的数据包，以各种方式修改其他数据包，阻止某些传出的数据包以控制恶意软件，或者在最早的阶段重定向某些数据包以桥接网络接口或在系统之间平衡传入数据包的负载。\n\
  \n深入理解 OSI（开放系统互连）模型的第 3、第 4 层和第 5 层对于充分利用 `netfilter` 的作用至关重要。\n\n### 文化：OSI 模型\n\
  \nOSI 模型是一个概念模型，用于在不考虑底层内部结构和技术的情况下实现网络协议。它的目标是实现不同通信系统与标准通信协议之间的互操作性。\n\n该模型定义在标准\
  \ `ISO/EIC 7498` 中。描述了以下七层：\n\n1. 物理层：通过物理介质进行原始位流的传输和接收\n2. 数据链路层：在由物理层连接的两个节点之间可靠地传输数据帧\n\
  3. 网络层：构建和管理多节点网络，包括地址传递、路由和流量控制\n4. 传输层：在网络点之间可靠地传输数据段，包括分段、确认和多路复用\n5. 会话层：管理通信会话，即两个节点之间多次往返传输形式的持续信息交换\n\
  6. 表示层：网络服务与应用程序之间的数据翻译；包括字符编码、数据压缩和加密/解密\n7. 应用层：层级 API，包括资源共享、远程文件访问。\n\n可以在维基百科找到更多信息：\n\
  → [`en.wikipedia.org/wiki/Osi_model`](https://en.wikipedia.org/wiki/Osi_model)\n\
  \n防火墙通过 `tables`（表）配置，表包含 `chains`（链）中的 `rules`（规则）。与 `iptables` 不同，`nftables` 没有任何默认表。用户决定创建哪些以及创建多少个表。每个表必须分配以下五个族之一：`ip`、`ip6`、`inet`、`arp`\
  \ 和 `bridge`。如果没有指定族，则使用 `ip`。\n\n链有两种类型：`base chains`（基础链）和 `regular chains`（普通链）。基础链是网络栈数据包的入口点，它们注册到\
  \ Netfilter 钩子中，即这些链可以看到流经 TCP/IP 栈的数据包。另一方面，普通链没有挂载到任何钩上，因此它们看不到任何流量，但可以作为跳转目标以实现更好的组织结构。\n\
  \n规则由语句组成，这些一些用于匹配的表达式以及一个裁决语句，如 `accept`、`drop`、`queue`、`continue`、`return`、`jump\
  \ chain` 和 `goto chain`。\n\n### 回归基础：ICMP\n\nICMP（互联网控制消息协议）是用于传输通信补充信息的协议。它允许使用\
  \ `ping` 命令测试网络连通性（该命令发送一个 ICMP `echo request` 消息，接收者应用 ICMP `echo reply` 消息进行回答）。它信号防火墙拒绝数据包、指示接收缓冲区溢出、为连接中的后续数据包建议更好的路由等。该协议由若干\
  \ RFC 文档定义；初始的 `RFC777` 和 `RFC792` 很快完成并扩展。\n\n→ [`www.faqs.org/rfcs/rfc777.html`](http://www.faqs.org/rfcs/rfc777.html)\n\
  → [`www.faqs.org/rfcs/rfc792.html`](http://www.faqs.org/rfcs/rfc792.html)\n\n作为参考，接收缓冲区是一个小型内存区域，用于存储从网络接收数据到内核处理它之间的数据。如果该区域满了，则无法接收新数据，ICMP\
  \ 会发出该问题的信号，以便发送者减慢其传输速率（理想情况下在一段时间后达到平衡）。\n\n注意，尽管 IPv4 网络可以在没有 ICMP 的工作，但 IPv6\
  \ 网络严格需要 ICMPv6，因为它合并了在 IPv4 世界中分散在 ICMPv4、`IGMP`（互联网组管理协议）和 `ARP`（地址解析协议）中的多种功能。ICMPv6\
  \ 定义在 `RFC4443` 中。\n\n→ [`www.faqs.org/rfcs/rfc4443.html`](http://www.faqs.org/rfcs/rfc4443.html)\n\
  \n### 14.2.2. 从 iptables 迁移到 nftables\n\n`iptables-translate` 和 `ip6tables-translate`\
  \ 命令可以将旧的 `iptables` 命令翻译为新的 `nftables` 语法。整个规则集也可以翻译，在这种情况下，我们迁移安装了 Docker 的计算机上配置的规则：\n\
  \n\n\n\n\n```\niptables-save > iptables-ruleset.txt\niptables-restore-translate\
  \ -f iptables-ruleset.txt\nTranslated by iptables-restore-translate v1.8.2 on Thu\
  \ Jul 18 10:39:33 2019 add table ip filter add chain ip filter INPUT { type filter\
  \ hook input priority 0; policy accept; } add chain ip filter FORWARD { type filter\
  \ hook forward priority 0; policy drop; } add chain ip filter OUTPUT { type filter\
  \ hook output priority 0; policy accept; } add chain ip filter DOCKER add chain\
  \ ip filter DOCKER-ISOLATION-STAGE-1 add chain ip filter DOCKER-ISOLATION-STAGE-2\
  \ add chain ip filter DOCKER-USER add rule ip filter FORWARD counter jump DOCKER-USER\
  \ add rule ip filter FORWARD counter jump DOCKER-ISOLATION-STAGE-1 add rule ip filter\
  \ FORWARD oifname \"docker0\" ct state related,established counter accept add rule\
  \ ip filter FORWARD oifname \"docker0\" counter jump DOCKER add rule ip filter FORWARD\
  \ iifname \"docker0\" oifname != \"docker0\" counter accept add rule ip filter FORWARD\
  \ iifname \"docker0\" oifname \"docker0\" counter accept add rule ip filter DOCKER-ISOLATION-STAGE-1\
  \ iifname \"docker0\" oifname != \"docker0\" counter jump DOCKER-ISOLATION-STAGE-2\
  \ add rule ip filter DOCKER-ISOLATION-STAGE-1 counter return add rule ip filter\
  \ DOCKER-ISOLATION-STAGE-2 oifname \"docker0\" counter drop add rule ip filter DOCKER-ISOLATION-STAGE-2\
  \ counter return add rule ip filter DOCKER-USER counter return add table ip nat\
  \ add chain ip nat PREROUTING { type nat hook prerouting priority -100; policy accept;\
  \ } add chain ip nat INPUT { type nat hook input priority 100; policy accept; }\
  \ add chain ip nat POSTROUTING { type nat hook postrouting priority 100; policy\
  \ accept; } add chain ip nat OUTPUT { type nat hook output priority -100; policy\
  \ accept; } add chain ip nat DOCKER add rule ip nat PREROUTING fib daddr type local\
  \ counter jump DOCKER add rule ip nat POSTROUTING oifname != \"docker0\" ip saddr\
  \ 172.17.0.0/16 counter masquerade add rule ip nat OUTPUT ip daddr != 127.0.0.0/8\
  \ fib daddr type local counter jump DOCKER add rule ip nat DOCKER iifname \"docker0\"\
  \ counter return # Completed on Thu Jul 18 10:39:33 2019\niptables-restore-translate\
  \ -f iptables-ruleset.txt > ruleset.nft\nnft -f ruleset.nft\nnft list ruleset\n\
  ```\n\ntable ip filter { chain INPUT { type filter hook input priority 0; policy\
  \ accept; } chain FORWARD { type filter hook forward priority 0; policy drop; counter\
  \ packets 0 bytes 0 jump DOCKER-USER counter packets 0 bytes 0 jump DOCKER-ISOLATION-STAGE-1\
  \ oifname \"docker0\" ct state related,established counter packets 0 bytes 0 accept\
  \ oifname \"docker0\" counter packets 0 bytes 0 jump DOCKER iifname \"docker0\"\
  \ oifname != \"docker0\" counter packets 0 bytes 0 accept iifname \"docker0\" oifname\
  \ \"docker0\" counter packets 0 bytes 0 accept } chain OUTPUT { type filter hook\
  \ output priority 0; policy accept; } chain DOCKER { } chain DOCKER-ISOLATION-STAGE-1\
  \ { iifname \"docker0\" oifname != \"docker0\" counter packets 0 bytes 0 jump DOCKER-ISOLATION-STAGE-2\
  \ counter packets 0 bytes 0 return } chain DOCKER-ISOLATION-STAGE-2 { oifname \"\
  docker0\" counter packets 0 bytes 0 drop counter packets 0 bytes 0 return } chain\
  \ DOCKER-USER { counter packets 0 bytes 0 return } } table ip nat { chain PREROUTING\
  \ { type nat hook prerouting priority -100; policy accept; fib daddr type local\
  \ counter packets 0 bytes 0 jump DOCKER } chain INPUT { type nat hook input priority\
  \ 100; policy accept; } chain POSTROUTING { type nat hook postrouting priority 100;\
  \ policy accept; oifname != \"docker0\" ip saddr 172.17.0.0/16 counter packets 0\
  \ bytes 0 masquerade } chain OUTPUT { type nat hook output priority -100; policy\
  \ accept; ip daddr != 127.0.0.0/8 fib daddr type local counter packets 0 bytes 0\
  \ jump DOCKER } chain DOCKER { iifname \"docker0\" counter packets 0 bytes 0 return\
  \ } } table ip mangle { chain PREROUTING { type filter hook prerouting priority\
  \ -150; policy accept; } chain INPUT { type filter hook input priority -150; policy\
  \ accept; } chain FORWARD { type filter hook forward priority -150; policy accept;\
  \ } chain OUTPUT { type route hook output priority -150; policy accept; } chain\
  \ POSTROUTING { type filter hook postrouting priority -150; policy accept; } }\n\
  ```\n\n工具 `iptables-nft`、`ip6tables-nft`、`arptables-nft` 和 `ebtables-nft` 是使用 nftables\
  \ API 的 iptables 版本，因此用户可以继续使用旧的 iptables 语法，但不推荐；这些工具应仅用于向后兼容。\n\n## 14.2.3. `nft`\
  \ 语法\n\n`nft` 命令允许对表、链和规则进行操作。`table` 支持多种操作：`add`、`create`、`delete`、`list` 和 `flush`。`nft\
  \ add table ip6 mangle` 会从 `ip6` 族添加一个新表。\n\n要向 `filter` 表中插入一个新的基础链，可以执行以下命令（注意在\
  \ Bash 中使用时，分号需要用反斜杠转义）：\n\n```\nnft add chain filter input { type filter hook input\
  \ priority 0 \\; }\n```\n\n规则通常使用以下语法添加：`nft add rule [*family*] *table* *chain*\
  \ handle *handle* statement`。\n\n`insert` 与 `add` 命令类似，但给定的规则会被插入到链的开头，或者插入到具有特定句\
  \ 的规则之前，而不是在末尾或该规则之后。例如，以下命令会在句柄号 8 的规则之前插入一条规则：\n\n```\nnft insert rule filter\
  \ output position 8 ip daddr 127.0.0.8 drop\n```\n\n执行的 `nft` 命令不会对配置进行永久性更改，因此如果不保存，更改将会丢失。防火墙规则位于\
  \ `/etc/nftables.conf`。永久保存当前防火墙配置的一种简单方法是以 root 身份执行 `nft list ruleset > /etc/nftables.conf`。\n\
  \n`nft` 允许更多操作，更多信息请参考其手册页 `nft(8)`。\n\n## 14.2.4. 每次启动时加载规则\n\n要在 Debian 中启用默认防火墙，你需要将规则存储在\
  \ `/etc/nftables.conf` 中，并执行 root 执行 `systemctl enable nftables.service`。你可以通过 root\
  \ 执行 `nft flush ruleset` 来停止防火墙。\n\n在其他情况下，推荐的方法是在 `/etc/network/interfaces` 文件的\
  \ `up` 指令中注册配置脚本。在以下示例中，脚本存储在 `/usr/local/etc/arrakis.fw` 下。\n\n示例 14.1. `interfaces`\
  \ 文件调用防火墙脚本\n```\nauto eth0\niface eth0 inet static address 192.168.0.1 network\
  \ 192.168.0.0 netmask 255.255.255.0 broadcast 192.168.0.255 up /usr/local/etc/arrakis.fw\n\
  ```\n这显然假设你使用 ifupdown 配置接口。如果你使用的是其他工具（如 *NetworkManager* 或 *systemd-networkd*），请参考各自的文档查找在接口启动后执行脚本的方法。\n\
  \n\n\n\n\n`logcheck` 可以以三种详细程度不同的模式之一工作：`paranoid`、`server` 和 `workstation`。第一种模式\
  \ `very` 详细，可能应该只限制用于防火墙等特定服务器。第二种（默认）模式推荐用于大多数服务器。最后一种是为工作站设计的，甚至更加精简（它会过滤掉更多消息）。\n\
  \n在所有三种情况下，`logcheck` 可能都需要进行自定义以排除某些额外消息（取决于已安装的服务），除非管理员真的希望每小时收到一组冗长且无趣的邮件。由于消息选择机制相当复杂，`/usr/share/doc/logcheck-database/README.logcheck-database.gz`\
  \ 是必读的——尽管读起来具有挑战性。\n\n所应用的规则可以分为几类：\n\n*   将消息标记为破解尝试的规则（存储在 `/etc/logcheck/cracking.d/`\
  \ 目录下的文件中）；\n*   取消此类标记的规则（`/etc/logcheck/cracking.ignore.d/`）；\n*   将消息分类为安全告警的规则（`/etc/logcheck/violations.d/`）；\n\
  *   **取消此类分类的规则（`/etc/logcheck/violations.ignore.d/`）；**\n*   最后，适用于剩余消息的规则（被视为*系统事件*）。\n\
  \n***\n\n### 注意：忽略消息\n\n任何被标记为破解尝试或安全告警的消息（遵循存储在 `/etc/logcheck/violations.d/myfile`\
  \ 文件中的规则）只能通过 `/etc/logcheck/violations.ignore.d/myfile` 或 `/etc/logcheck/violations.ignore.d/myfile-``extension`\
  \ 文件中的规则来忽略。\n\n***\n\n除非 `/etc/logcheck/ignore.d.{paranoid,server,workstation}/`\
  \ 目录中的规则规定该事件应被忽略，否则系统事件总是会被信号。当然，唯一考虑的目录是那些对应的详细程度等于或大于所选操作模式的目录。\n\n## 14.3.2.\
  \ 监控活动\n\n### 14.3.2.1 实时监控\n\n`top` 是一个交互式工具，显示当前运行进程的列表。默认排序基于当前处理器的使用量，可以通过 `P`\
  \ 键获取。其他排序顺序包括按占用内存排序（`M` 键）、按总处理器时间排序（`T` 键）以及按进程标识排序（`N` 键）。`k` 键允许通过输入进程标识杀死进程。`r`\
  \ 键允许对进程进行 `renicing`，即更改其优先级。\n\n当系统似乎过载时，`top` 是查看哪些进程正在竞争处理器时间或消耗过多内存的绝工具。特别是检查消耗资源的进程是否与机器已知托管的实际服务匹配通常很有趣。以\
  \ `www-data` 用户运行的未知进程应该引起关注并进行调查，因为它可能是通过 Web 应用程序漏洞在系统上安装并执行的软件实例。\n\n`top` 是一个非常灵活的工具，其手册页提供了有关如何自定义显示并使其适应个人需求和习惯的细节。\n\
  \n`gnome-system-monitor` 图形工具与 `top` 类似，并提供了大致相同的功能。\n\n### 14.3.2.2 历史\n\n处理器负载、网络流量和可用磁盘空间是不断变化的信息。保留它们演变的历史对于准确确定计算机的使用情况通常很有用。\n\
  \n有很多专用工具可以完成此任务。大多数工具可以通过 `SNMP`（*简单网络管理协议*）获取数据以集中这些信息。一个额外的好处是，这允许从可能不是通用计算机的网络元素中获取数据，例如专用的网络路由器或交换机。\n\
  \n本书详细讨论了 Munin（参见第 12.4.1 节，“设置 Munin”），作为第 12 章：“*高级管理*”）的一部分。Debian 还提供了一个类似的工具\
  \ `cacti`。它的部署稍微复杂，因为它完全基于 `SNMP`。尽管有 Web ，但理解配置涉及的概念仍需要一些精力。阅读 HTML 文档（`/usr/share/doc/cacti/html/Table-of-Contents.html`）应该被认为是前提条件。\n\
  \n***\n\n### 替代方案：mrtg\n\n`mrtg`（同名软件包中）是一个较旧的工具。尽管有一些粗糙之处，它可以聚合历史数据并以图表的形式显示。它包含了许多专用脚本，用于收集最常见的监控数据，如处理器负载、网络流量、网页点击量等。\n\
  \n`mrtg-contrib` 和 `mrtgutils` 软件包包含可以直接使用的示例脚本。\n\n***\n\n## 14.3.3. 避免入侵\n\n攻击者尝试通过猜测密码来访问服务器，这就是为什么必须使用强密码。即便如此，你还应该建立防止暴力破解的措施。暴力破解是在短时间内通过多次登录尝试尝试登录未经授权的软件系统。\n\
  \n停止暴力破解的最佳方法是限制来自相同源的登录尝试次数，通常是通过临时禁止 IP 地址。\n\nFail2Ban 是一个入侵防御软件套，可以配置为监控任何将登录尝试写入日志文件的服务。可以在\
  \ `fail2ban` 软件包中找到。\n\nFail2Ban 通过 `fail2ban-client` 使用一个简单的协议进行配置，该客户端还读取配置文件并向服务器\
  \ `fail2ban-server` 发布相应的配置命令。它有四种配置文件类型，都存储在 `/etc/fail2ban` 中：\n\n*   fail2ban.conf：全局配置（如日志记录）。\n\
  *   filter.d/*.conf：指定如何检测身份失败的过滤器。Debian 软件包已包含许多常用程序的过滤器。\n*   action.d/*.conf：定义禁止和取消禁止\
  \ IP 地址命令的动作。\n*   jail.conf：这是定义*监狱*（jails，过滤器和动作的组合）的地方。\n\n让我们查看 `/etc/fail2ban/jail.conf`\
  \ 中的 `sshd` 配置，以更好地理解 Fail2Ban 如何工作……\n\n[...] [DEFAULT] [...] bantime = 10m [...]\
  \ maxretry = 5 [...] [sshd] port = ssh logpath = %(sshd_log)s backend = %(sshd_backend)s\n\
  \nFail2Ban 将使用 `/etc/fail2ban/filters.d/sshd.conf` 中定义的 Python 正则表达式，针对 `sshd` 的日志文件检查\
  \ `sshd` 的失败登录尝试，该文件定义在 `/etc/fail2ban/paths_common.conf` 变量 `sshd_log` 中。如果 Fail2Ban\
  \ 检测到连续次失败登录，它将禁止这些尝试源的 IP 地址。\n\nFail2Ban 是防止最常见暴力破解的一种简单有效的方法，但它无法防止分布式暴力破解，即攻击者使用散布在互联网上的大量机器。\n\
  \n提供针对分布式暴力破解额外保护的一种好方法是在每次失败尝试后人为增加登录时间。\n\n## 14.3.4. 检测更改\n\n一旦系统安装并配置完成，除非进行安全升级，否则大多数文件和目录通常没有理由（数据除外）。因此，确保文件实际上没有发生变化很有意义：因此任何意外的更改都值得调查。本节介绍了一些能够监控文件并在发生意外更改时警告管理员（或简单列出此类更改）的工具。\n\
  \n### 14.3.4.1 使用 dpkg --verify 审核软件包\n\n***\n\n### 进一步探讨：防止上游更改\n\n\n\n\n\n`dpkg\
  \ --verify` 对于检测来自 Debian 软件包的文件更改非常有用，但如果软件包本身被破坏（例如，Debian 镜像站被破坏），它将无用武处。防止此类攻击涉及使用\
  \ APT 的数字签名验证系统（参见第 6.6 节，“检查软件包真实性”），并确保只从认证的源安装软件包。\n\n`dpkg --verify`（或 `dpkg\
  \ -V`）是一个有趣的工具，因为它允许发现哪些已安装的文件被修改过（可能由攻击者修改），但对此应持谨慎态度。为了工作，它依赖于存储在磁盘上 dpkg 自身数据库中的校验和（可以在\
  \ `/var/lib/dpkg/info/package.md5sums` 中找到）；因此，一个彻底的攻击者会更新这些文件，使其包含被篡改文件的新校验和。\n\
  \n### 文件指纹\n\n提醒：指纹是一个值，通常是一个数字（即使是十六进制表示），它包含了文件内容的某种签名。这种签名通过算法（MD5 或 SHA1 是著名的例子）计算得出，该算法在多程度上保证了即使文件内容发生最微的变化意味着指纹的变化；这被称为“雪崩效应”。这使得简单的数字指纹可以作为金石测试，以检查文件内容是否被更改。这些算法是不可逆的；换句话说，对于大多数算法而言，知道指纹并无法找到对应的内容。最近的数学进展似乎削弱了这些原则的绝对性，但到目前为止其使用尚未受到质疑，因为创建产生相同指纹的不同内容似乎仍然是一个相当困难的任务。\n\
  \n运行 `dpkg -V` 将验证所有已安装的软件包，并为每个测试失败的文件打印一行。输出格式与 `rpm -V` 相同，其中每个字符表示对某些特定元数据的测试。遗憾的是，`dpkg`\
  \ 并没有存储大多数测试所需的元数据，因此会对这些测试输出问号。目前只有校验和测试可以在第三个字符上产生“5”（当测试失败时）。\n\n```\n# dpkg\
  \ -V ??5?????? /lib/systemd/system/ssh.service ??5?????? c /etc/libvirt/qemu/networks/default.xml\
  \ ??5?????? c /etc/lvm/lvm.conf ??5?????? c /etc/salt/roster\n```\n\n在上面的示例中，dpkg\
  \ 报告了 SSH 服务文件的更改，这是管理员对软件包文件所做的修改，而不是使用适当 `/etc/systemd/system/ssh.service` 覆盖文件（应该像任何配置更改一样存储在\
  \ `/etc` 下方）。它还列出了多个被合法修改的配置文件（通过第二个字段上的字母“c”识别）。\n\n### 14.3.4.2. 审核软件包：debsums\
  \ 及其局限性\n\n`debsums` 是 `dpkg -V` 的祖先，因此大部分已经过时。它受到与 dpkg 相同的限制。幸运的是，某些限制可以通过变通方法解决（而\
  \ dpkg 不提供类似的替代方案）。\n\n由于磁盘上的数据不可信，`debsums` 建议基于 `.deb` 文件进行检查，而不是依赖 dpkg 的数据库。为了下载所有安装软件包的可信\
  \ `.deb` 文件，我们可以依靠 APT 的认证下载。此操作可能很缓慢且单调，因此不应被视为一种经常使用的主动技术。\n\n```\n# apt-get --reinstall\
  \ -d install `grep-status -e 'Status: install ok installed' -n -s Package` [ ...\
  \ ] # debsums -p /var/cache/apt/archives --generate=all\n```\n\n注意，此示例使用了 dctrl-tools\
  \ 包中的 `grep-status` 命令，该包默认未安装。\n\n可以通过在 `/etc/default/debsums` 中设置 `CRON_CHECK`\
  \ 作为 cron 任务频繁运行 `debsums`。要忽略 `/etc` 目录之外某些故意修改或预期会更改的文件（如 `/usr/share/misc/pci.ids`），你可以将它们添加到\
  \ `/etc/debsums-ignore`。\n\n### 14.3.4.3. 监控：AIDE\n\nAIDE 工具（*高级入侵检测环境*）允许检查文件完整性，并与之前记录的有效系统镜像对比任何更改。此镜像存储在数据库（`/var/lib/aide/aide.db`）中，包含系统中所有文件的相关信息（指纹、权限、时间戳等）。该数据库首先通过\
  \ `aideinit` 初始化；然后每天（通过 `/etc/cron.daily/aide` 脚本）使用，以检查没有重要内容发生变化。当检测到更改时，AIDE\
  \ 将其记录在日志文件中（`/var/log/aide/*.log`），并通过电子邮件将其发现发送给管理员。\n\n###保护数据库\n\n由于 AIDE 使用本地数据库来比较文件状态，其结果的有效性直接取决于数据库的有效性。如果攻击者在受破坏的系统中获得了\
  \ root 权限，他们将能够数据库并掩盖踪迹。一种可能的替代方案是将参考数据存储在只读存储介质上。\n\n`/etc/default/aide` 中的许多选项可以调整\
  \ aide 软件包的行为。AIDE 本身的配置存储在 `/etc/aide/aide.conf` 和 `/etc/aide/aide.conf.d/`（实际上，这些文件仅被\
  \ `update-aide.conf` 用于生成 `/var/lib/aide/aide.conf.autogenerated`）。配置指示了需要检查哪些文件的哪些属性。例如，日志内容经常更改，只要这些文件的权限保持不变，就可以忽略此类更改，但可执行程序的内容和权限必须保持不变。虽然并不复杂，配置语法并不完全直观，因此建议阅读\
  \ `aide.conf(5)` 手册页。\n\n新版本的数据库每天在 `/var/lib/aide/aide.db.new` 中生成；如果所有记录的更改都是合法的，可以使用它来替换参考数据库。\n\
  \n### 替代方案 Tripwire 和 Samhain\n\nTripwire 与 AIDE 非常相似；甚至配置文件语法也几乎相同。tripwire 提供的主要新增是对配置文件进行签名的机制，以便攻击者无法指向不同版本的参考数据库。\n\
  \nSamhain 也提供了类似的功能，以及一些帮助检测 rootkits 的功能（参见侧边栏 *快速查看 checksecurity 和 chkrootkit/rkhunter\
  \ 软件包）。它也可以在网络范围内部署，并在中央服务器上记录踪迹（带有签名）。\n\n### 快速查看\n\n这些软件包中的第一个包含几个小脚本，对系统执行基本检查（空密码、新的\
  \ setuid 文件等），并在需要时警告管理员。尽管名称明确，但管理员不应仅依赖它来确保 Linux 系统的安全。\n\n`chkrootkit` 和 `rkhunter`\
  \ 软件包允许查找可能安装在系统上的 *rootkits*。提醒，这些是旨在隐藏系统被入侵情况并秘密控制机器的软件。这些测试并非 100% 可靠，但它们通常能引起管理员对潜在问题的注意。\n\
  \n`rkhunter` 还会执行检查以查看命令是否被修改、系统启动文件是否被修改，以及对网络接口的各种检查，包括对监听应用程序的检查。\n\n### 14.3.5.\
  \ 检测入侵 (IDS/NIDS)\n\n### 回归基础 拒绝服务\n\n\n\n\n\n“拒绝服务”攻击只有一个目标：让服务不可用。无论这种攻击是通过过载查询使服务器过载，还是利用漏洞，最终结果都是相同的：服务不再运行。普通用户会感到不悦，而托管目标网络服务的实体会遭受声誉损失（可能还会产生损失，例如，如果该服务是一个电子商务网站）。\n\
  \n这种攻击有时是“分布式的”；这通常涉及来自许多不同源的大量查询使服务器过载，导致服务器无法响应合法的查询。这些类型的攻击有了广为人知的缩写：`DDoS` 和\
  \ `DoS`（取决于拒绝服务攻击是否为分布式）。\n\n`suricata`（在同名的 Debian 软件包中）是一个 NIDS —— 即*网络入侵检测系统*（Network\
  \ Intrusion Detection System）。它的功能是监听网络并尝试检测入侵尝试和/或敌行为（包括拒绝服务攻击）。所有这些事件都记录在 `/var/log/suricata`\
  \ 的多个文件中。可以使用第三方工具（Kibana/logstash）来更好地浏览所有收集的数据。\n\n→ [`suricata-ids.org`](https://suricata-ids.org)→\
  \ [`www.elastic.co/products/kibana`](https://www.elastic.co/products/kibana)\n\n\
  **注意** 范围\n\n`suricata` 的有效性受限于监控网络接口上的流量。如果它无法观察到真实流量，它显然无法检测到任何内容。因此，当它插入网络交换机时，它只会监控针对其运行机器的攻击，这可能并不是初意所在。因此，托管\
  \ `suricata` 的机器应该连接到交换机的“镜像”端口（mirror port），该端口通常用于级联交换机，因此可以获得流量。\n\n配置 `suricata`\
  \ 涉及查看和编辑 `/etc/suricata/suricata-debian.yaml`，它非常长，因为每个参数都有丰富的注释。最少的配置需要描述本地网络覆盖的地址范围（`HOME_NET`\
  \ 参数）。在实践中，这意味着所有潜在攻击目标的集合。但要充分利用其作用，需要完整阅读它并根据本地情况进行调整。\n\n此外，你还应该编辑 `/etc/default/suricata`\
  \ 以定义要监控的网络接口并启用初始化脚本（通过设置 `RUN=yes`）。你可能还想设置 `LISTENMODE=pcap`，因为默认的 `LISTENMODE=nfqueue`\
  \ 需要进一步配置才能正常工作（必须配置 netfilter 防火墙将数据包传递到 `suricata` 通过 `NFQUEUE` 目标处理的用户空间队列）。\n\
  \n为了检测不良行为，`suricata` 需要一组监控规则：你可以在 `snort-rules-default` 软件包中找到这些规则。`snort` 是 IDS\
  \ 生态系统的历史参考，`suricata` 能够重用为它编写的规则。\n\n或者，可以使用 `oinkmaster`（在同名的软件包中）从外部源下载 Snort\
  \ 规则集。\n\n**进阶** 与 `prelude` 集成\n\nPrelude 提供了安全信息的集中化监控。它的模块化架构包含一个服务器（`prelude-manager`\
  \ 中的*管理器*/manager），它收集由各种类型的*传感器*（sensors）生成的告报。\n\nSuricata 可以被配置为这样的传感器。其他可能性包括\
  \ `prelude-lml`（*日志监控随从*/Log Monitor Lackey），它监控日志文件（方式类似于第 14.3.1 节，“使用 **logcheck**\
  \ 监控日志”）。\n\n# 14.4 AppArmor 简介\n\n## 14.4.1. 原理\n\nAppArmor 是构建在 Linux LSM（*Linux\
  \ 安全模块*）接口上的*强制访问控制*（MAC）系统。在实践中，内核在每次系统调用之前都会查询 AppArmor，以确定进程是否有权执行给的操作。通过这种机制，AppArmor\
  \ 将程序限制在有限的资源中。\n\nAppArmor 在每个程序上应用一组规则（称为“配置文件”/profile）。内核所应用的配置文件取决于正在执行的程序的安装路径。与\
  \ SELinux（在第 14.5 节，“SELinux 简介”）相反，所应用的规则不取决于用户。所有用户在执行同一个程序时都面临同一组规则（但传统的用户权限仍然有效并可能导致不同的行为！）。\n\
  \nAppArmor 配置文件存储在 `/etc/apparmor.d/` 中，它们包含了每个程序可以使用的资源的访问控制规则列表。配置文件由 `apparmor_parser`\
  \ 命令编译并加载到内核。每个配置文件都可以以强制模式（enforcing mode）或投诉模式（complaining mode）加载。前者执行策略并报告违规尝试，而后者不强制策略但仍记录会被拒绝的系统调用。\n\
  \n## 14.4.2. 启用 AppArmor 和管理 AppArmor 配置文件\n\nAppArmor 支持内置在 Debian 提供的标准内核中。因此，启用\
  \ AppArmor 只需要通过 root 权限执行 `apt install apparmor apparmor-profiles apparmor-utils`\
  \ 安装一些软件包。\n\n安装后，AppArmor 即可工作，`aa-status` 将快速确认这一点：\n\n```\n# aa-status apparmor\
  \ module is loaded. 40 profiles are loaded. 23 profiles are in enforce mode. /usr/bin/evince\
  \ /usr/bin/evince-previewer [...] 17 profiles are in complain mode. /usr/sbin/dnsmasq\
  \ [...] 14 processes have profiles defined. 12 processes are in enforce mode. /usr/bin/evince\
  \ (3462) [...] 2 processes are in complain mode. /usr/sbin/avahi-daemon (429) avahi-daemon\
  \ /usr/sbin/avahi-daemon (511) avahi-daemon 0 processes are unconfined but have\
  \ a profile defined.\n```\n\n**注意** 更多 AppArmor 配置文件\n\napparmor-profiles 软件包包含了由上游\
  \ AppArmor 社区管理的配置文件。要获取更多配置文件，可以安装 `apparmor-profiles-extra`，它包含了由 Ubuntu 和 Debian\
  \ 开发的配置文件。\n\n可以通过调用 `aa-enforce` 和 `aa-complain` 在强制模式和投诉模式之间切换每个配置的状态，参数可以是可执行文件的路径或策略文件的路径。此外，可以使用\
  \ `aa-disable` 完全禁用配置文件，或使用 `aa-audit` 将置于审计模式（也记录允许的系统调用）。\n\n```\n# aa-enforce\
  \ /usr/bin/pidgin Setting /usr/bin/pidgin to enforce mode.\n# aa-complain /usr/sbin/dnsmasq\
  \ Setting /usr/sbin/dnsmasq to complain mode.\n```\n\n## 14.4.3. 创建新配置文件\n\n尽管创建\
  \ AppArmor 配置文件相当简单，但大多数程序都没有配置文件。本节将向你展示如何仅通过目标程序从头创建一个配置文件，并让 AppArmor 监控它所做的系统调用以及它访问的资源。\n\
  \n需要被限制的重要程序是面向网络的程序，因为它们最可能成为远程攻击者的目标。这就是为什么 AppArmor 方便地提供了一个 `aa-unconfined`\
  \ 命令来列出没有关联配置文件且暴露开放网络套接字的程序。使用 `--paranoid` 选项，你可以获得所有至少有一个活动网络连接的未限制进程。\n\n\n\n\
  \n\n# `aa-unconfined` 801 `/sbin/dhclient` 未受限制 409 `/usr/sbin/NetworkManager` 未受限制\
  \ 411 `/usr/sbin/cupsd` 受限制于 `/usr/sbin/cupsd (enforce)'` 429 `/usr/sbin/avahi-daemon`\
  \ 受限制于 `'avahi-daemon (enforce)'` 516 `/usr/sbin/cups-browsed` 受限制于 `/usr/sbin/cups-browsed\
  \ (enforce)'` 538 `/usr/sbin/zebra` 未受限制 591 `/usr/sbin/named` 未受限制 847 `/usr/sbin/mysqld`\
  \ 未受限制 849 `/usr/sbin/sshd` 未受限制 1013 `/usr/sbin/dhclient` (`/sbin/dhclient`) 未受限制\
  \ 1276 `/usr/sbin/apache2` 未受限制 1322 `/usr/sbin/apache2` 未受限制 1323 `/usr/sbin/apache2`\
  \ 未受限制 1324 `/usr/sbin/apache2` 未受限制 1325 `/usr/sbin/apache2` 未受限制 1327 `/usr/sbin/apache2`\
  \ 未受限制 1829 `/usr/lib/ipsec/charon` 受限制于 `/usr/lib/ipsec/charon (enforce)'` 2132\
  \ `/usr/sbin/exim4` 未受限制 12865 `/usr/bin/python3.7` (`/usr/bin/python3`) 未受限制 12873\
  \ `/usr/bin/python3.7` (`/usr/bin/python3`) 未受限制\n\n在接下来的示例中，我们将尝试为 `/sbin/dhclient`\
