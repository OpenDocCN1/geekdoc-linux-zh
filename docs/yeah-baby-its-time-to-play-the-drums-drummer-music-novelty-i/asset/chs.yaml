  \n## 表达您的感谢\n\n本书以免费许可方案出版，因为我们希望每个人都能从中受益。尽管如此，维护它需要大量的时间和精力，我们对您的感谢表示赞意。如果您认为本书很有价值，请考虑通过购买纸质版或通过本书官方网站捐赠来支持其的持续维护：\n\
  \n→ [`debian-handbook.info`](https://debian-handbook.info)\n\n## 摘要\n\n一本介绍 Debian\
  \ 发行版的参考书，涵盖了从初始安装到服务配置的内容。\n\n# 前言\n\n我很高兴能有这个机会欢迎来到 Debian 以及《Debian 管理员手册》（Debian\
  \ Administrator's Handbook）。许多人都选择了 Debian：互联网上约 10% 的 Web 服务器运行着 Debian。如果加上基于\
  \ Debian 的操作系统，这个数字更接近 20%。Debian 被选为国际空间站的首选操作系统。无论是前沿物理学研究，还是在对抗污染的同时帮助农作物增长的项目，Debian\
  \ 都被用于驱动实现这些目标的计算机。\n\n为什么 Debian 对大型企业、研究人员、活动活动人士和业余爱好者都具有吸引力？我认为答案在于 Debian 的灵活性和社区。\n\
  \nDebian 是灵活的。是的，它开箱即用提供了一个出色的通用操作系统。它还提供了工具，可以将 Debian 定制为适应你所工作的任何环境。无论是云和容器架构、大量的工作站、单台计算机还是一体化设备，Debian\
  \ 都提供了在相应环境中良好运行的灵活性。你将找到满足你需求的工具和示例。\n\nDebian 社区是一个多元化个人和兴趣的汇聚地：来自最大企业的开发者与志愿者、研究人员和用户并肩工作。无论是安全专家、Web\
  \ 开发人员、系统程序员还是架构师，我们都有自己的代表。你可以成为这个社区的一部分。当你发现可以让 Debian 更好的方法时，我们欢迎你的贡献。\n\n我们汇聚在一起创造一个世界级的自由操作系统。没有一家公司控制\
  \ Debian；没有一项议程定义了我们的工作。相反，我们每一个人都有权按照对我们重要的方式来改进 Debian。感谢你关注我们的作品。我希望你会喜欢。\n\n\
  本书是探索 Debian 的极佳方式。多年来，当朋友们想要进一步了解 Debian 时，我一直向他们推荐这本书，现在我很高兴有机会更广泛地推荐它。本手册由 Debian\
  \ 社区的长期成员编写和维护。一些致力于开发操作系统的同事也聚集在一起，帮助你理解它。当然，本书的开发采用了与 Debian 本身类似的社区流程，同样强调自由。\n\
  \n2019 年 8 月\n\nSam Hartman (Debian 项目负责人)\n\n# 前言\n\nLinux 多年来一直在不断壮大，其日益增长的人气驱动了越来越多的用户做出转变。这条道路上的第一步是选择一个发行版。这是一个重要的决定，因为每个发行版都有自己的特殊之处，如果从一开始做出正确的选择，就可以避免未来的迁移成本。\n\
  \n*回归基础* Linux 发行版，Linux 内核\n\n严格来说，Linux 只是一个内核，是位于硬件和应用程序之间的核心软件。\n\n“Linux 发行版”是一个完整的操作系统；它通常包括\
  \ Linux 内核、一个安装程序，以及最重要的是将计算机转换为真正有用工具所需的各种应用程序和其他软件。\n\nDebian GNU/Linux 是一个适合大多数用户的“通用”Linux\
  \ 发行版。本书的目的是展示它的许多方面，以便你在选择时做出明智的决策。\n\n# 1. 为什么要写这本书？\n\n## 文化 商业发行版\n\n大多数 Linux\
  \ 发行版都由一家营利公司支持，由该公司开发并按照某种商业方案进行销售。示例包括主要由 `Canonical Ltd. ` 开发的 `Ubuntu` ；由 `Red\
  \ Hat` 开发的 `Red Hat Enterprise Linux`，以及由 `Novell` 维护并商业化提供的 `SUSE Linux`。\n\n在光谱的另一端是像\
  \ Debian 和 Apache 软件基金（它托管 Apache Web 服务器的开发）这样的项目。Debian 归是自由软件世界的一个项目，由通过互联网共同工作的志愿者实现。虽然其中一些人由于他们在各种公司兼薪工作的一部分而在从事\
  \ Debian，但整个项目并不归属于任何特定公司，任何一家公司对项目事务的话语权也不超过纯志愿者贡献者。\n\n多年来，Linux 积累了相当多的媒体报道；这主要受益于那些由真实营销部门支持的发行版——换句话说，就是公司支持的发行版（Ubuntu、Red\
  \ Hat、SUSE 等）。但 Debian 远非一个边缘发行版；多年来的多项研究表明，它在服务器和桌面端都被广泛使用。这在以 Debian 和 Ubuntu\
  \ 为领先的 Web 服务器领域尤为如此。\n\n→ [`w3tech.com/technologies/details/os-linux/all/all`](https://w3tech.com/technologies/details/os-linux/all/all)\n\
  \n本书的目的是帮助你发现这个发行版。我们希望分享自加入项目以来积累的经验（Raphaël 加入于 1998 年，Roland 加入于 2000 年）。如果运气的话，我们的热情会感染他人，也许你某天也会加入我们……\n\
  \n本书的第一版（2004 年）填补了一个巨大的空白：它是第一本专门关注 Debian 的法语书籍。当时，有许多针对法语和英语读者的关于该主题的著作。遗憾的是，其中几乎没有一本进行过更新，多年来，情况又回到了缺乏\
  \ Debian 优良书籍的境地。我们希望这本书在翻译成英文（以及翻译成多种其他语言）并获得新生命后，能够填补这一空白并帮助许多用户。\n\n# 2. 这本书是给谁看的？\n\
  \n我们试图让这本书对许多类读者都有用。首先，系统管理员（无论是初学者还是专家）将找到关于 Debian 在多台计算机上安装和部署的解释。他们还将了解 Debian\
  \ 提供的许多服务，以及相应的配置说明和对发行版特定性的描述。理解 Debian 开发涉及的机制使他们能够应对不可预见的问题，因为他们总可以在社区内找到帮助。\n\
  \n\n\n\n其他 Linux 发行版或另一个 Unix 变体的用户将发现 Debian 的特性，并应该非常快速地上手，同时充分受益于该发行版的独特优势。\n\
  \n最后，那些已经具备某些 Debian 知识并想进一步了解其背后社区的读者，将发现他们的期望得到了满足。这本书将使他们更接近成为我们的贡献者。\n\n# 3.\
  \ 通用方法\n\n你能找到的关于 GNU/Linux 的所有通用文档也适用于 Debian，因为 Debian 包含了大多数常见的免费软件。然而，该发行版带来了许多增强，这就是为什么我们选择主要描述处理事情的“Debian\
  \ 方式”。\n\n遵循 Debian 的建议是有趣的，但理解其背后的原理会更好。因此，我们不会仅局限于实践性的解释；我们还会描述项目的运行机制，以便为您提供全面且一致的知识。\n\
  \n# 4. 本书结构\n\n本书围绕一个案例研究构建，该案例为所有讨论的话题提供了支持和插说明。\n\n***\n\n注：网站、作者邮箱\n\n本书有自己的网站，托管了任何可以增加其实用性的元素。特别是，它包含了一个带有可点击链接的在线版书籍，以及可能的错误列表。欢迎随时浏览并向我们提供反馈。我们将乐意阅读您的评论或支持信息。请通过电子邮件发送至\
  \ `hertzog@debian.org`` (Raphaël) 和 `<`lolando@debian.org`` (Roland)。\n\n→ [`debian-handbook.info/`](https://debian-handbook.info/)\n\
  \n***\n\n`第 1 章` 重点介绍了 Debian 项目是非技术的介绍，并描述了其目标和组织。这些方面非常重要，因为它们定义了一个通用框架，其他章节将用更具体的信息完善该框架。\n\
  \n`第 2 章和第 3 章`提供了案例研究的概要。此时，新手读者可以花时间阅读附录 B，他们可以在那里找到一个简短的补习课程，解释了许多基础计算概念以及任何\
  \ Unix 系统固有的概念。\n\n为了进入正题，我们将自然地从安装过程开始（`第 4 章`）；`第 5 章和第 6 章`将介绍任何 Debian 管理员都会使用的基本工具，例如\
  \ `APT` 家族工具，这些工具在很大程度上造就了该发行版的卓越声誉。这些章节完全不限于专业人士，因为每个人在家里都是自己的管理员。\n\n`第 7 章` 将是一个重要的补充；它描述了高效使用文档以及快速理解问题以解决问题的工作流。\n\
  \n接下来的章节将对系统进行更详细的巡检，从基础基础设施和服务（`第 8 到第 10 章`）开始，逐步向上堆栈，到达 `第 13 章` 中的用户应用程序。`第\
  \ 12 章` 涉及更高级的主题，这些主题最直接关系到大型计算机（包括服务器）的管理员，而 `第 14 章` 对计算机安全这一更广泛的主题进行了简要介绍，并提供了避免大多数问题的关键。\n\
  \n`第 15 章` 面向想要更进一步并创建自己的 Debian 软件包的管理员。\n\n***\n\n术语 Debian 包 (Debian package)\n\
  \nDebian 软件包是一个包含安装某个软件所需的所有文件的存档。它通常是一个扩展名为 `.deb` 文件，可以使用 `dpkg` 命令处理。它也被称为二进制包，包含可直接使用的文件（如程序或文档）。另一方面，源包包含软件的源代码以及构建二进制包所需的指令。\n\
  \n***\n\n当前版本已经是本书的第九版了（我们包含了前四个仅以法语提供的版本）。此版本涵盖了 Debian 10 版本，代号为 Buster。在这些中，Debian\
  \ 现在支持 UEFI 安全启动，为针对启动基础设施的攻击提供了额外的安全保障，并使得在通常默认启用安全启动的新电脑上安装 Debian 变得容易。再次在安全层面，AppArmor（一种调节各种应用程序允许执行操作的强制性访问控制系统）现在已默认启用。所有包含的软件包显然都已更新，包括\
  \ GNOME 桌面，它现在已是第 3.30 版本。\n\n我们在侧边栏中添加了一些注释和备注。它们有多种作用：它们可以引起对困难点位的注意，完善案例研究的概念，定义某些术语或作为提醒。以下是这些侧边栏中最常见的列表：\n\
  \n*   回归基础 (BACK TO BASICS)：对某些本应已知的信息的提醒；\n*   术语 (VOCABULARY)：定义技术术语，有时是 Debian\
  \ 特有的；\n*   社区 (COMMUNITY)：突出项目内部的重点人物或角色；\n*   策略 (POLICY)：来自 Debian 策略的规则或建议。该文档在项目内部至关重要，描述了如何打包软件。书中强调的策略部分为用户带来了直接利益（例如，知道策略规范了文档和示例的位置，使得即使在新的包中也容易找到它们）；\n\
  *   工具 (TOOL)：介绍相关的工具或服务；\n*   在实践 (IN PRACTICE)：理论与实践并不总是匹配的；这些侧边栏包含了来自我们经验的建议。它们也可以提供详细且具体的例子；\n\
  *   其他频率不一的侧边栏则非常明确：文化 (CULTURE)、提示 (TIP)、警告 (CAUTION)、深入学习 (GOING FURTHER)、安全 (SECURITY)\
  \ 等。\n\n# 5. 贡献\n\n本书像自由软件项目一样开发，欢迎您的投入和帮助。最显而易见的方式是帮助翻译成您的母语。但这不是唯一的可能性。你可以提交错误报告让我们知道错误、拼写错误、过时信息或应该涵盖的主题。或者你可以提交修复你发现的问题请求。\n\
  \n所有贡献本书的说明都记录在本书网站上：\n\n→ [`debian-handbook.info/contribute/`](https://debian-handbook.info/contribute/)\n\
  \n# 6. 致谢\n\n## 6.1. 一段历史\n\n2003 年，Nat Makarévitch 联系了 Raphaël，因为他想为 Eyrolles 管理的\
  \ *Cahier de l'Admin*管理员手册）系列出版一本关于 Debian 的书。Raphaël 立即接受了编写。第一版于 2004 年 10 月 14\
  \ 日出版并取得了巨大成功——在几个月后就售罄了。\n\n从那时起，我们发布了其他七个版，对应每个后续的 Debian 版本（Debian 9 除外）。从校对工作的\
  \ Roland 逐渐变成了共同作者。\n\n虽然我们对书籍的成功感到满意，但一直希望 Eyrolles 能说服一家国际出版社将其翻译成英文。我们收到许多评论，解释这本书如何帮助人们入门\
  \ Debian，我们渴望让这本书让更多的人受益。\n\n遗憾的是，我们联系的所有英语出版商都不愿意承担翻译和出版这本书的风险。没有被这个小挫折击倒，我们与法国出版社\
  \ Eyrolles 进行了谈判，获得了将书籍翻译成英文自行出版的权利。感谢[成功的众筹活动](https://www.ulule.com/debian-handbook/)，我们在\
  \ 2011 年 12 月到 2012 年 5 月之间进行了翻译工作。《Debian 管理员手册》诞生了，并以自由软件许可证出版！\n\n\n\n虽然这是一个重要的里程碑，但我们已经知道，在我们能够将法语书籍作为英文书籍的正式译文贡献之前，我们的故事还没有结束。在当时这是不可能的，因为法语版书籍仍由\
  \ Eyrolles 公司以非免费许可进行商业分发。\n\n2013 年，`Debian 7` 的发布为我们提供了一个与 Eyrolles 讨论新合同的绝佳机会。我们说服了他们，符合\
  \ Debian 价值观的许可有助于书籍的成功。这并不是一项容易的交易，我们同意发起另一次[众筹活动](https://www.ulule.com/liberation-cahier-admin-debian/)来涵盖部分成本并降低相关风险。该行动再次取得了巨大成功，并在\
  \ 2013 年 7 月，我们为《Debian 管理手册》（Debian-Administrator's Handbook）增加了法语翻译。\n\n感谢所有为这些募捐活动做出贡献的人，无论是捐赠资金还是口口相。没有你们，我们无法完成。\n\
  \n为了节省纸张，在募筹活动 5 年后以及随后的两个版本之后，我们删除了选择在书中提及姓名以表感谢的人员名单。但他们的名字刻在了该书 Wheezy 版本的致谢中：\n\
  \n→ [`debian-handbook.info/browse/wheezy/sect.acknowledgments.html`](https://debian-handbook.info/browse/wheezy/sect.acknowledgments.html)\n\
  \n## 6.2. 对贡献者的特别感谢\n\n如果没有几位在翻译阶段及之后都发挥了重要作用的人士的贡献，这本书就不会有今天的模样。我们要感谢 Marilyne\
  \ Brun，她帮助我们翻译了示例章节，并与我们一起定义了一些通用翻译规则。她还修订了几个急需补充性工作的章节。感谢 Anthony Baldwin（来自 Baldwin\
  \ Linguas），他为我们翻译了几个章节。\n\n由于 Roland 和我太忙，没有为 `Debian 10` 更新书籍，因此我们通过捐赠和销售获得的微薄收入聘请贡献者完成了大部分工作。非常感谢\
  \ Daniel Leidert 和 Jorge Maldonado Ventura 在此次更新中付出的辛勤努力。\n\n我们受益于校对者的慷慨帮助：Daniel\
  \ Phillips、Gerold Rupp、Gordon Dey、Jacob Owens 和 Tom Syroid。他们每个人都审阅了许多章节。非常感谢！\n\
  \n随后，一旦英文版被开源，我们自然收到了读者大量的反馈、建议和修正，从许多致力于将本书翻译成其他语言的团队那里得到了更多。感谢！\n\n我们还要感谢法语版书籍的读者，他们为我们提供了很好的引言，证实了这本书确实值得翻译：感谢\
  \ Christian Perrier、David Bercot、Étienne Liétart 和 Gilles Roussi。Stefano Zacchiroli\
  \ —— 在众筹期间担任 Debian 项目负责人 —— 也应该得到巨大的感谢，他慷慨地通过一段引言支持了该项目，解释说免费（自由意义上的）书籍是绰绰有的。\n\
  \n如果你有幸读到这本书的平装版，那么你应该加入我们，感谢 Benoît Guillon、Jean-Côme Charpentier 和 Sébastien Mengin，他们负责内页的设计。Benoît\
  \ 是 `dblatex`(http://dblatex.sourceforge.net) 的上游作者——我们我们将 DocBook 转换为 LaTeX（然后是\
  \ PDF）的工具。Sébastien 是创建这个精美书籍布局的设计师，Jean-Côme 是将其实现为适用于 `dblatex` 样式表的 LaTeX 专家。感谢你们所有的辛勤工作！\n\
  \n最后，感谢 Thierry Stempfel 为每个章节提供的精美图片，感谢 Doru Patrascu 提供的漂亮书籍封面。\n\n## 6.3. 感谢翻译者\n\
  \n自从这本书开源以来，许多志愿者忙于将其翻译成多种语言，如阿拉伯语、巴西葡萄牙语、德语、意大利语、西班牙语、日语、挪威博姆尔语等。可以在书籍网站查看完整的翻译列表：[`debian-handbook.info/get/#other`](https://debian-handbook.info/get/#other)\n\
