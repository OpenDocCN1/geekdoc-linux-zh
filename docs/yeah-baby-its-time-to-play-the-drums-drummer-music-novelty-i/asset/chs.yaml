  \ GnuPG 框架中使用简单的对称加密工具\n* `watchgnupg` -- 监控基于套接字的日志 [..]\n\n* * *\n\n### **进阶：**\
  \ 版本对比\n\n\n\n\n\n由于 `dpkg` 是处理 Debian 软件包的程序，它提供了提供了版本号逻辑的参考实现。这就是为什么它有一个 `--compare-versions`\
  \ 选项，该选项可供外部程序（特别是由 `dpkg` 自身执行的配置脚本）。此选项需要三个参数：一个版本号、一个比较运算符和第二个版本号。不同的可能运算符有 `lt`（严格小于）、`le`（小于或等于）、`eq`（等于）、`ne`（不等于）、`ge`（大于或等于）和\
  \ `gt`（严格大于）。如果比较结果正确，`dpkg` 返回 0（成功）；否则，它返回一个非零值（表示失败）。\n\n```\n$ dpkg --compare-versions\
  \ 1.2-3 gt 1.1-4 $\n$ echo $?\n0\n$ dpkg --compare-versions 1.2-3 lt 1.1-4 $\n$\
  \ echo $?\n1\n$ dpkg --compare-versions 2.6.0pre3-1 lt 2.6.0-1 $\n$ echo $?\n1\n\
  ```\n\n注意最后一次比较出现了意外失败：对于 `dpkg` 来说，`pre`（通常表示预发布）没有特殊含义，该程序比较字母字符的方式与比较数字相同（a <\
  \ b < c ...），按照字母顺序进行比较。这就是为什么它认为“0pre3”大于“0”。当我们希望软件包的版本号标明它是一个预发布版本时，我们使用波浪线字符“~”：\n\
  \n```\n$ dpkg --compare-versions 2.6.0~pre3-1 lt 2.6.0-1 $\n$ echo $?\n0\n```\n\n\
  ## 5.4.4. `dpkg` 的日志文件\n\n`dpkg` 在 `/var/log/dpkg.log` 中记录了所有操作的日志。该日志非常详尽，因为它详细列出了\
  \ `dpkg` 处理的软件包所经历的每一个阶段。除了提供追踪 `dpkg` 行为的方法外，它最重要的是有助于维护系统演化的历史：人们可以找到每个软件包被安装或更新的精确时刻，这些信息在理解最近的行为变化时极其有用。此外，由于记录了所有版本，可以很容易与相关软件包的\
  \ `changelog.Debian.gz` 甚至在线错误报告进行信息交叉比对。\n\n## 5.4.5. 多架构支持 (Multi-Arch)\n\n所有\
  \ Debian 软件包的控制信息中都有一个 `Architecture` 字段。该字段可以包含“all”（用于架构无关的软件包）或其目标架构的名称（如“amd64”、“armhf”等）。在后的情况下，默认情况下\
  \ `dpkg` 只有在软件包的架构与 `dpkg --print-architecture` 返回的主机架构匹配时，才会接受安装该软件包。\n\n这一限制确保了用户不会得到为错误架构编译的二进制文件。这一切本是完美的，但（某些）计算机可以运行多种架构的二进制文件，无论是原生运行（“amd64”系统可以运行“i386”二进制文件）还是通过模拟器运行。\n\
  \n### 5.4.5.1. 启用多架构\n\n`dpkg` 的多架构允许用户定义可以安装在当前系统上的“外国架构”。这只需像下例所示使用 `dpkg --add-architecture`\
  \ 即可。有一个相应的 `dpkg --remove-architecture` 来移除对外国架构的支持，但只有在没有该架构的软件包剩余时才能使用它。\n\n\
  ```bash\n## dpkg --print-architecture amd64\n## dpkg --print-foreign-architectures\n\
  ## dpkg -i gcc-8-base_8.3.0-6_armhf.deb\ndpkg: error processing archive gcc-8-base_8.3.0-6_armhf.deb\
  \ (--install): package architecture (armhf) does not match system (amd64) Errors\
  \ were encountered while processing: gcc-8-base_8.3.0-6_armhf.deb\n## dpkg --add-architecture\
  \ armhf\n## dpkg --add-architecture armel\n## dpkg --print-foreign-architectures\
  \ armhf armel\n# dpkg -i gcc-8-base_8.3.0-6_armhf.deb (Reading database ... 14319\
  \ files and directories currently installed.) Preparing to unpack gcc-8-base_8.3.0-6_armhf.deb\
  \ ... Unpacking gcc-8-base:armhf (8.3.0-6) ... Setting up gcc-8-base:armhf (8.3.0-6)\
  \ ...\n# dpkg --remove-architecture armhf\ndpkg: error: cannot remove architecture\
  \ 'armhf' currently in use by the database\n# dpkg --remove-architecture armel\n\
  # dpkg --print-foreign-architectures armhf\n```\n\n注意 APT 的多架构支持\n\nAPT 会自动检测 `dpkg`\
  \ 是否已配置支持外国架构，并开始下载对应的 `Packages` 文件。\n\n然后可以使用 `apt` 安装外国软件包。\n\n实践：在 amd64 上使用\
  \ i386\n\n多架构有多个用例，但最流行的是在 64 位系统 (amd64) 上执行（有时）32 位二进制文件，以及为不同于主机的平台交叉编译软件的可能性。\n\
  \n## 5.4.5.2. 多架构相关的更改\n\n为了让多架构真正有用，库必须重新打包并移动到特定架构的目录，以便多个架构可以共存。自从 Debian 7 Whezy\
  \ 引入多架构以来，最重要的库已经过转换，但仍有许多库除非有人专门提出请求（通过错误报告），否则可能不会被转换。\n\n```bash\n$ dpkg -s gcc-8-base\n\
  dpkg-query: error: --status needs a valid package name but 'gcc-8-base' is ambiguous:\
  \ package name 'gcc-8-base' with more than one installed\n$ dpkg -s gcc-8-base:amd64\
  \ gcc-8-base:armhf | grep ^Multi\n$ dpkg -L libgcc1:amd64 |grep .so /lib/x86_64-linux-gnu/libgcc_s.1\n\
  $ dpkg -S /usr/share/doc/gcc-8-base/copyright gcc-8-base:amd64, gcc-8-base:armhf\n\
  ```\n\n值得注意的是，相同架构的软件包必须通过架构限定其名称，以便进行唯一标识。它们还有与相同软件包的其他实例共享文件的可能性；**dpkg** 确保在共享时所有软件包的文件是位一致的。最后，同一个软件包的所有实例必须具有相同的版本。因此它们必须一起升级。\n\
  \n多架构支持在处理依赖关系也带来了一些有趣的挑战。满足依赖需要一个标记为“Multi-Arch: foreign”的软件包，或者架构与声明依赖的软件包匹配的软件包（在这一依赖解析过程中，架构无关的软件包被假设与主机架构相同）。依赖关系也可以被弱化以允许任何架构满足它，使用\
  \ `package:any` 语法，但外国软件包只有在被标记为“Multi-Arch: allowed”时才能满足此类依赖。\n\n## 5.5. 与与其他软件包系统的共存\n\
  \nDebian 软件包并不是自由软件世界中唯一的软件包。主要的竞争者是 Red Hat Linux 发行版及其许多衍生版的 RPM 格式。Red Hat 是一个非常流行的商业发行版。因此，第三方提供的软件通常以\
  \ RPM 软件包而非 Debian 软件包的形式提供。\n\n\n\n\n在这种情况下，你应该知道处理 RPM 软件包的 `rpm` 程序以 Debian 软件包的形式提供，因此在\
  \ Debian 上使用这种软件包格式是可能的。然而，应该将这些操作限制在从软件包中提取信息或验证其完整性上。事实上，在 Debian 系统上使用 `rpm`\
  \ 安装 RPM 软件包是不合理的；RPM 使用它自己的数据库，该数据库与原生软件（如 `dpkg`）的数据库是分开的。这就是为什么无法确保两种软件包系统能够稳定共存的原因。\n\
  \n另一方面，`alien` 工具可以将 RPM 软件包转换为 Debian 软件包，反之亦然。\n\n***\n\n### 社区鼓励采用 .deb 格式\n\n\
  如果你经常使用 `alien` 程序安装来自某个提供商的 RPM 软件包，不要犹豫地向他们写信，友好地表达你对 `.deb` 格式的强烈偏好。请注意，软件包的格式并不是一切：使用\
  \ `alien` 构建或为你所使用的 Debian 版本不同的 Debian 版本（甚至是为如 Ubuntu 等派生发行版）准备的 `.deb` 软件包，其质量和集成程度可能无法达到专门为\
  \ Debian Buster 开发的软件包的相同水平。\n\n***\n\n```\n$ fakeroot alien --to-deb phpMyAdmin-4.7.5-2.fc28.noarch.rpm\
  \ phpmyadmin_4.7.5-3_all.deb generated $ ls -s phpmyadmin_4.7.5-3_all.deb 4356 phpmyadmin_4.7.5-3_all.deb\n\
  ```\n\n你会发现这个过程非常简单。然而，你必须知道，生成的软件包不包含任何依赖信息，因为两种软件包格式中的依赖关系没有系统性的对应关系。因此，管理员必须手动确保转换后的软件包能够正常运行，这就是为什么应该避免避免这样生成的\
  \ Debian 软件包。幸运的是，Debian 拥有所有发行版中最大的软件包集合，你所寻找的内容可能已经在那里了。\n\n查看 `alien` 命令的 man\
  \ 页，你还会注意到该程序处理其他软件包格式，特别是 Slackware 发行版使用的格式（它由简单的 `tar.gz` 归档组成）。\n\n使用 `dpkg`\
  \ 工具部署的软件的稳定性有助于 Debian 的声誉。下一章描述的 APT 工具套保留了这一优势，同时将管理员从管理软件包状态中解放出来，这是一项必要但艰巨的任务。\n\
  \n# 第 6 章 维护与更新：APT 工具\n\n让 Debian 在管理员中如此受欢迎的原因是安装软件有多简单以及更新整个系统有多容易。这一独特优势在很大程度上归功于\
  \ `APT` 程序，Falcot Corp 的管理员曾热情地研究过它。\n\n`APT` 是高级软件包工具（Advanced Package Tool）的缩写。让这个程序“先进”的地方在于它处理软件包的方法。它不是简单地单独评估它们，而是将它们视为整体，并根据可用性以及根据依赖兼容性产生最好的软件包组合。\n\
  \n***\n\n### 词汇 软件包源 (package source) 与源码包 (source package)\n\n*source*（源）一词可能会产生歧义。“源码包”（source\
  \ package）——一个包含程序源代码的软件包——不应与“软件包源”（package source）——一个包含软件包的仓库（网站、FTP 服务器、CD-ROM、本地目录等）——相混淆。\n\
  \n***\n\nAPT 需要提供一个“软件包源列表（仓库）”：`/etc/apt/sources.list` 文件将列出发布 Debian 软件包的不同仓库。APT\
  \ 然后将导入这些源每个发布的软件包列表。此操作通过下载 `Packages.xz` 文件或变体（对于二进制软件包源，使用 `Packages.gz` 或 `.bz2`，即使用不同的压缩方法）并分析其内容来实现。对于源码包源，APT\
  \ 下载 `Sources.xz` 文件或使用不同压缩方法的变体。当已存在这些文件的旧副本时，APT 可以通过只下载差异来更新它（参见侧边栏 *TIP* 增量更新）。\n\
  \n***\n\n### 回归基础 gzip, bzip2, LZMA 和 XZ 压缩\n\n`.gz` 扩展名指的是使用 `gzip` 工具压缩的文件。`gzip`\
  \ 是快速且高效的传统 Unix 文件压缩工具。新的工具可以实现更高的压缩率，但需要更多资源（计算时间和内存）来压缩和解压文件。在这些工具中，按出现顺序依次有\
  \ `bzip2`（生成 `.bz2` 扩展的文件）、`lzma`（生成 `.lzma` 文件）和 `xz`（生成 `.xz` 文件）。\n\n***\n\n\
  # 6.1. 填充 sources.list 文件\n\n## 6.1.1. 语法\n\n`/etc/apt/sources.list` 文件中的每个活动行都代表一个软件包源（仓库），并由至少三个由分隔分隔组成。关于文件格式和接受的条目内容的完整描述，请参阅\
  \ `sources.list(5)`。\n\n示例 6.1 `/etc/apt/sources.list` 中的条目格式\n```\ndeb url distribution\
  \ component1 component2 component3 [..] componentX deb-src url distribution component1\
  \ component2 component3 [..] componentX\n```\n\n第一个字段指示源类型：\n\n`deb`\n二进制软件包的软件包源（仓库）\n\
  \n`deb-src`\n源码包的软件包源（仓库）\n\n第二个字段给出源的基础 URL。与 `Packages.xz` 文件中列出的文件名结合，必须提供一个完整且有效的\
  \ URL。这可以是 Debian 镜像，也可以第三方设置的任何存档。URL 可以以 `file://` 开头表示系统文件层次中的本地源，以 `http://`\
  \ 或 `https://` 表示可以从 Web 服务器访问的源，或以 `ftp://` 或 `ftps://` 表示 FTP 服务器上的源。URL 还可以以\
  \ `cdrom:` 开头，用于基于 CD-ROM/DVD/蓝光光子的安装，尽管这种情况较少见，因为网络安装方法最终更为常见。\n\n最后一个字段的语法取决于仓库的结构。在最简单的情况下，你只需要指定所需源的子目录（必须以斜杠结尾）。这通常是简单的\
  \ `./`，表示没有子目录。软件包将直接位于指定的 URL 下。但在最常见的情况下，仓库的结构将类似于 Debian 镜像，有多个发行版，每个发行版都有多个组件。在这些情况下，通过其“代号”命名所选发行版（参见侧边栏\
  \ *COMMUNITY* 一个争议的领袖 中的列表）或其相应的“套件”（`oldstable`、`stable`、`testing`、`unstable`），然后是启用的\
  \ `main`、`contrib` 和 `non-free` 组件。\n\n***\n\n### 词汇 `main`, `contrib` 和 `non-free`\
  \ 存档\n\nDebian 使用三个组件根据作者选择的许可协议来区分软件包。`Main` 收集所有完全符合 [Debian 自由软件指南](https://www.debian.org/social_contract.html#guidelines)\
  \ 的软件包。\n\n\n\n\n`non-free`（非自由）组件与其他不同，因为它包含了不（完全）符合这些原则的软件，但仍然可以不受限制地分发。该存档不是\
  \ Debian 的官方部分，它是为那些可能需要某些程序、且现在也需要硬件固件的用户提供的服务。然而，Debian 总是建议优先使用自由软件。该组件的存在对理查德·斯塔尔曼（Richard\
  \ M. Stallman）来说是一个严重的问题，并导致自由软件基金不会向用户推荐 Debian。\n\n`Contrib`（贡献）是一组开源软件，这些软件在没有某些非自由元素的情况下无法运行——这些元素可以是来自\
  \ `non-free` 部分的软件，也可以是非自由文件（如游戏 ROM、游戏机 BIOS 等），抑或者是某些在 Debian `main` 存档中完全无法获取的元素。`contrib`\
  \ 组件还包括编译时需要专有元素的自由软件。这最初在 OpenOffice.org 办公套件中就是如此，它曾需要一个专有的 Java 环境。\n\n***\n\n\
  ### TIP `/etc/apt/sources.list.d/*.list` 文件\n\n如果引用了许多软件包源，将它们拆分为多个文件可能会很有用。每个部分随后存储在\
  \ `/etc/apt/sources.list.d/``filename`.list 中（参见侧栏 *返回基础：以 .d 结尾的目录）。\n\n***\n\n\
  `cdrom` 条目描述了您拥 CD/DVD-ROM。与其他条目不同，CD-ROM 并不总是可用的，因为必须将其插入驱动器，且一次只能读取一张光盘。由于这些原因，这些源的管理方式略有不同，需要使用\
  \ `apt-cdrom` 程序进行添加，通常带有 `add` 参数执行。后者会请求将光盘插入驱动器，并浏览其内容以寻找 `Packages` 文件。它将使用这些文件来更新可用软件包的数据库（此操作通常由\
  \ `apt update` 命令完成）。从那时起，如果 APT 需要其中的某一个软件包，它就会要求插入光盘。\n\n## 6.1.2. 稳定版用户的仓库\n\n\
  以下是运行 Debian Stable（稳定版）系统的标准 `sources.list`：\n\n示例 6.2. 用于 Debian Stable 用户的 `/etc/apt/sources.list`\
  \ 文件\n\n```text\n## 安全更新\ndeb http://security.debian.org/ buster/updates main contrib\
  \ non-free\ndeb-src http://security.debian.org/ buster/updates main contrib non-free\n\
  ## Debian 镜像\n## 基础仓库\ndeb https://deb.debian.org/debian buster main contrib non-free\n\
  deb-src https://deb.debian.org/debian buster main contrib non-free\n## 稳定版更新\ndeb\
  \ https://deb.debian.org/debian buster-updates main contrib non-free\ndeb-src https://deb.debian.org/debian\
  \ buster-updates main contrib non-free\n## 稳定版后向移植 (backports)\ndeb https://deb.debian.org/debian\
  \ buster-backports main contrib non-free\ndeb-src https://deb.debian.org/debian\
  \ buster-backports main contrib non-free\n```\n\n此文件列出了所有与 Debian Buster 版本（本文编写时当前的\
  \ Stable 变件）相关的软件包源。在上面的示例中，我们选择显式地命名“buster”，而不是使用相应的“stable”别名（`stable`、`stable-updates`、`stable-backports`），因为我们不想在下一个稳定版本发布时，底层发行版在我们的控制之外发生变化。\n\
  \n大多数软件包将来自“基础仓库”，它包含了所有软件包但很少更新（对于一个“点版本”，大约每 2 个月更新一次）。其他仓库是部分的（它们不包含所有软件包），并且可以存放\
  \ APT 可能会安装的更新（具有新版本的软件包）。接下来的章节将解释这些每个仓库的用途和管理它们的规则。\n\n请注意，当所需的软件包版本在多个仓库中都可用时，将使用\
  \ `sources.list` 文件中列出的第一个。由于此原因，非官方源通常添加在文件的末尾。\n\n顺便提一下，本节中关于 Stable 的大部分内容同样适用于\
  \ Oldstable（旧稳定版），因为后者只是一个并行维护的旧版 Stable。\n\n### 6.1.2.1. 安全更新\n\nDebian 认真对待安全问题。Debian\
  \ 中已软件漏洞在 [安全漏洞跟踪器](https://security-tracker.debian.org) 中被跟踪，并通常在合理的时间范围内修复。安全更新未托管在普通的\
  \ Debian 镜像网络上，而是托管在 `security.debian.org` 上，这是由 Debian 系统管理员 维护的一小组机器。该存档包含了由 Debian\
  \ 安全团队和/或软件包维护者为 Stable 和 Oldstable 准备的安全更新。\n\n服务器也可以托管 Testing（测试版）的安全更新，但并不经常发生，因为这些更新倾向于通过来自\
  \ Unstable（不稳定版）的常规更新流到达 Testing 套件。\n\n对于严重问题，安全团队会发布`Debian Security Advisory》(DSA)，并在\
  \ `debian-security-announce@lists.debian.org` 邮件列表上同安全更新一起发布([存档](https://lists.debian.org/debian-security-announce/))。\n\
  \n### 6.1.2.2. 稳定版更新\n\n稳定版更新并非安全敏感，但被认为足够重要，可以在下一个稳定版本发布之前推送给用户。\n\n该仓库通常包含关键和严重漏洞的修复，这些漏洞在发布前无法修复，或是后续更新引入的。根据紧急程度，它还可能包含随时间演变的软件包的更新，例如\
  \ spamassassin 的垃圾邮件检测规则、clamav 的病毒数据库、所有时区的夏令时规则 (tzdata)。\n\n在实践中，该仓库是由 稳定版发布经理\
  \ 精心选择的子集。所有更新都会在 `debian-stable-announce@lists.debian.org` 邮件列表上公布([存档](https://lists.debian.org/debian-stable-announce/))，并且会被包含在下一个稳定点版本中。\n\
  \n```text\ndeb https://deb.debian.org/debian buster-updates main contrib non-free\n\
  ```\n\n### 6.1.2.3. 建议更新 (Proposed Updates)\n\n一旦发布，Stable 发行版大约每 2 个月更新一次。`proposed-updates`\
  \ 仓库是准备预期更新的地方（在稳定版发布经理的监督下）。\n\n在前章节记录的安全和稳定更新始终包含在该仓库中，但还有更多内容，因为软件包维护者也有机会修复那些不值得立即发布的的重要漏洞。\n\
  \n任何人都可以在此仓库在正式发布之前测试这些更新。下面的摘录使用了 `buster-proposed-updates` 别名，这既显式又更一致，因为也存在 `stretch-proposed-updates`（用于\
  \ Oldstable 更新）：\n\n```text\ndeb https://deb.debian.org/debian buster-proposed-updates\
  \ main contrib non-free\n```\n\n### 6.1.2.4. 稳定版后向移植 (Stable Backports)\n\n`stable-backports`\
  \ 仓库托管“软件包后向移植 (backports)”。该术指的是为较旧发行版（通常是 Stable）重新编译的某些近期软件软件包。\n\n\n\n\n当发行版变得有些旧时，许多软件项目发布了新版本，但这些版本尚未集成到当前的\
  \ Stable（稳定）系列中，该系列仅被用于解决最关键的问题，例如安全问题。由于 Testing（测试）和 Unstable（不稳定）系列的风险更高，软件包维护者有时会自愿为\
  \ Stable 重新编译最近的应用程序，这为用户和系统管理员提供了将潜在的不稳定性限制在少数选定软件包中的优势。[`backports.debian.org`](https://backports.debian.org)\
  \ 页面提供了更多信息。\n\n`stable-backports` 的 Backports 仅从 Testing 中可用的软件包创建。这确保了一旦 Debian\
  \ 的下一个稳定版本发布，所有已安装的 backports 都能升级到相应的稳定版本。\n\n尽管此存储库提供了更新版本的软件包，除非你给出明确的指令，否则 `APT`\
  \ 不会安装它们（除非你已经对之前的版本的 backport 执行过此类操作）：\n\n```bash\nsudo apt-get install package\
  \ /buster-backports\nsudo apt-get install -t buster-backports package\n```\n\n##\
  \ 6.1.3. 用于 Testing/Unstable 用户的存储库\n\n以下适用于运行 Debian Testing 或 Unstable 版本的系统的标准\
  \ `sources.list`：\n\n示例 6.3. Debian Testing/Unstable 用户的 `/etc/apt/sources.list`\
  \ 文件\n\n```text\n## Unstable\ndeb https://deb.debian.org/debian unstable main contrib\
  \ non-free\ndeb-src https://deb.debian.org/debian unstable main contrib non-free\n\
  ## Testing\ndeb https://deb.debian.org/debian testing main contrib non-free\ndeb-src\
  \ https://deb.debian.org/debian testing main contrib non-free\n# Testing security\
  \ updates\ndeb http://security.debian.org/ testing-security main contrib non-free\n\
  deb-src http://security.debian.org/ testing-security main contrib non-free\n# Stable\n\
  deb https://deb.debian.org/debian stable main contrib non-free\ndeb-src https://deb.debian.org/debian\
  \ stable main contrib non-free\n# Stable security updates\ndeb http://security.debian.org/\
  \ stable/updates main contrib non-free\ndeb-src http://security.debian.org/ stable/updates\
  \ main contrib non-free\n```\n\n**注意** 安全存储库的布局\n\n从 Debian 11 Bullseye 开始，提供安全更新的存储库代名从\
  \ `codename`/updates` 重命名为 `codename`-security`，以避免与 `codename`-updates` 混淆（参见章节\
  \ 6.1.2.2，“稳定更新”）。\n\n使用此 `sources.list` 文件，APT 将从 Unstable 系列安装软件包。如果不希望这样做，请使用\
  \ `APT::Default-Release` 设置（参见章节 6.2.3，“系统升级”）来指示 APT 从另一个系列（在这种情况下很可能是 Testing）中选择软件包。\n\
  \n包含所有这些存储库有充分的理由，尽管一个就足够了。当 Testing 中的版本受烦人 Bug 的影响时，Testing 用户会很感激从 Unstable 中挑选（cherry-pick）一个修复过的软件包。相反，受到意外回归问题影响的\
  \ Unstable 用户，可以将软件包降级到它们（据认为可以正常工作的）Testing 版本。\n\n包含 Stable 更有争议，但它通常允许访问某些已从开发版本中移除的软件包。它还确保了你可以获得自上一个稳定发布以来未修改过的软件包的最新更新。\n\
  \n## 6.1.3.1. Experimental 存储库\n\nExperimental（实验性）软件包存档存在所有 Debian 镜像中，包含了尚未进入\
  \ Unstable 版本的软件包，因为它们的质量尚未符合标准——它们通常是软件开发版本或预发布版本（alpha、beta、发布候选版……）。软件包在经历产生问题的后续更改后也可以发送到那里。维护者随后会在能够处理重要问题的高级用户的帮助下发现这些问题。在第一阶段之后，软件包将被移动到\
  \ Unstable，在那里接触到更广泛的众并接受更详细的测试。\n\nExperimental 通常由那些不在意破坏系统然后修复系统的用户使用。该发行版提供了用户根据需要尝试或使用某个软件包的可能性。这正是\
  \ Debian 的处理方法，因为在 APT 的 `sources.list` 文件中添加它不会导致系统性地使用其软件包。需要添加的行是：\n\n```text\n\
  deb https://deb.debian.org/debian experimental main contrib non-free\n```\n\n##\
  \ 6.1.4. 使用替代镜像\n\n本章中的 `sources.list` 示例引用托管在 [`deb.debian.org`](https://deb.debian.org/)\
  \ 上的软件包存储库。这些 URL 将你重定向到距离最近的服务器，这些服务器由内容分发网络（CDN）管理，CDN 的主要作用是在全球存储多个文件副本，并尽可能快地交付给用户。Debian\
  \ 合作的 CDN 公司是免费向 Debian 提供服务的 Debian 合作伙伴。虽然这些服务器没有一个受 Debian 直接控制，但整个存档都由 GPG 签名密封，这一事实使其不再是一个问题。\n\
  \n对 `deb.debian.org` 性能不满意的挑剔用户，可以尝试在官方列表中寻找更好的镜像：\n\n→ [`www.debian.org/mirror/list`](https://www.debian.org/mirror/list)\n\
  \n但当你不知道哪个镜像最适合你时，这个列表并没有太大用。幸运的是，Debian 维护了格式为 `ftp.国家代码.debian.org` 的 DNS 条目（例如美国的\
  \ `ftp.us.debian.org`，法国的 `ftp.fr.debian.org` 等），这些条目覆盖了许多国家，并指向该国内一个（或多个）最佳镜像。\n\
  \n作为 `deb.debian.org` 的替代方案，曾经有一个 `httpredir.debian.org`。该服务会识别距离你最近的镜像（主要使用 GeoIP\
  \ ），并将 APT 的请求重定向到该镜像。该服务由于可靠性问题已被弃用，现在 `httpredir.debian.org` 提供与 `deb.debian.org`\
  \ 相同的 CDN 服务。\n\n## 6.1.5. 非官方资源：`mentors.debian.net`\n\n许多非官方的 Debian 软件包来源由重新编译某些软件的高级用户建立（Ubuntu\
  \ 通过其个人包存档 PPA 服务使其流行起来），由将其创建的内容公开的程序员建立，甚至由在线提供软件包预版本的 Debian 开发者建立。\n\n[`mentors.debian.net`](https://mentors.debian.net)\
  \ 网站很有趣（尽管它只提供源码包），因为它收集了官方 Debian 开发者候选人或希望不通过该集成过程创建 Debian 软件包的志愿者所创建的软件包。这些软件包的提供对其质量没有任何保证；在考虑将其用于生产环境之前，请务必检查它们的来源和完整性并进行测试。\n\
  \n**社区** `debian.net` 站点\n\n\n\n\n\n`debian.net` 域名并非 Debian 项目的官方资源。每个 Debian 开发者都可以将该域名供个人使用。这些网站可能包含非官方的服务（有时是个人站点），这些服务托管在不属于该项目的机器上，并由\
  \ Debian 开发者设置，甚至可能是正准备移动到 `debian.org` 的原型。有两个原因可以解释为什么其中一些原型仍然留在了 `debian.net`\
  \ 上：要么没有人付出必要的努力将其转换为官方服务（托管在 `debian.org` 域名下，并有一定程度的维护保障），要么该服务太具争议而无法被官方化。\n\n\
  * *\n\n安装软件包意味着赋予其创建者 root 权限，因为他们决定了以在该身份下运行的初始化脚本的内容。官方 Debian 软件包由志愿者创建，这些志愿者经过了吸纳和审核，并且可以对他们的软件包进行签名，以便检查其来源和完整性。\n\
  \n通常情况下，对于来源未知且未托管在 Debian 官方服务器上的软件包要保持警惕：评估你对创建者的信任程度，并检查软件包的完整性。\n\n* *\n\n###\
  \ 进阶阅读：旧版本软件包：`snapshot.debian.org`\n\n### [`snapshot.debian.org`](https://snapshot.debian.org)\
  \ 服务于 2010 年 4 月引入，可用于“回溯时光”，查找不再包含在 Debian 存档中的旧软件包版本。例如，它可以用于识别软件包的哪个版本引入了回归问题，更具体地说，可以在等待回归修复时返回到之前的版本。\n\
  \n* *\n\n## 6.1.6 用于 Debian 软件包的缓存代理\n\n当整个机器网络被配置为使用同一个远程服务器下载相同的更新软件包时，任何管理员都知道，拥有一个中间代理作为网络本地缓存是有益的（请参阅侧边栏\
  \ `VOCABULARY` 缓存]）。\n\n你可以配置 APT 使用“标准”代理（APT 端请参阅 第 6.2.4 节，“配置选项，代理端请参阅 [第 11.6\
  \ 节，“HTTP/FTP 代理”#ch11s06.html \"11.6. HTTP/FTP Proxy\")]），但 Debian 生态系统提供了更好的解决此问题的方案。本节介绍的专用软件比普通的代理缓存更智能，因为它们可以依赖\
  \ APT 仓库的特定结构（例如，它们知道单个文件何时已过期，从而调整其保留的时间）。\n\n`apt-cacher` 和 `apt-cacher-ng` 的工作方式类似于代理缓存服务器。APT\
  \ 的 `sources.list` 保持不变，但 APT 被配置为将它们作为传出请求的代理。\n\n相反，`approx` 像一个 HTTP 服务器，在它的顶层\
  \ URL 中“镜像”任意数量的远程仓库。这些顶层目录与仓库远程 URL 之间的映射存储在 `/etc/approx/approx.conf` 中：\n\n```\n\
  # <name> <repository-base-url> debian https://deb.debian.org/debian http http://security.debian.org\n\
  ```\n\n`approx` 默认通过 systemd socket 运行在端口 9999 上，并要求用户调整其 `sources.list` 文件以指向 approx\
  \ 服务器：\n\n```\n# 指向本地 approx 服务器的示例 sources.list\ndeb http://localhost:9999/security\
  \ buster/updates main contrib non-free\ndeb http://localhost:9999/debian buster\
  \ main contrib non-free\n```\n\n## 6.2 aptitude, apt-get 和 apt 命令\n\n`APT` 是一个庞大的项目，其原始计划包括一个图形界面。它基于一个包含核心应用程序的库，而\
  \ `apt-get` 是在该项目内部开发的第一个前端——基于命令行）。`apt` 是 APT 提供的第二个基于命令行的前端，它克服了 `apt-get` 的某些设计缺陷。\n\
  \n这两个工具都构建在同一个库之上，因此非常相似，但 `apt` 的默认行为已经针对交互式使用进行了改进，并能够真正实现大多数用户预期的功能。APT 开发者保留了更改此工具公共接口的权利，以进一步改进它。相反，`apt-get`\
  \ 的公共接口定义良好，且不会发生任何向后兼容的更改。因此，当你需要脚本化处理软件包安装请求时，它是你想要使用的工具。\n\n随后许多其他图形界面作为外部项目出现：`synaptic`、`aptitude`（包括文本模式界面和图形界面——尽管尚未完整）、`wajig`\
  \ 等。最推荐的界面是 `apt`，这也是我们在本节示例中将使用的界面。请注意，`apt-get` 和 `aptitude` 的命令行语法非常相似。当这三个命令之间存在主要差异时，将对其进行详细说明。\n\
  \n### 6.2.1 初始化\n\n对于任何 APT 的操作，都需要更新可用软件包列表；这可以通过 `apt update` 轻松完成。取决于你的连接速度和配置，该操作可能会花费一段时间，因为它涉及到下载一定数量（通常是压缩的）文件（`Packages`、`Sources`、`Translation-language-code`），随着\
  \ Debian 的发展，这些文件已变得越来越大（`main` 部分至少有 10 MB）。当然，从 CD-ROM/DVD 组进行安装不需要任何下载——在这种情况下，操作将非常快。\n\
  \n* *\n\n### 提示：增量更新\n\n`apt update` 命令的目标是为每个源下载对应的 `Packages`（或 `Sources`）文件。然而，即使经过\
  \ `xz` 压缩，这些文件仍然很大（`main` 的 `Packages.xz` 超过 7 MB）。如果你经常更新，这些下载可能会占用大量时间。\n\n为了加快这一过程，APT\
  \ 可以下载自上次更新以来的“差异”文件，而不是整个文件。为了实现这一点，官方 Debian 镜像分发列出一个版本 `Packages` 文件与下一个版本之间差异的文件。它们在每次更新存档时生成，并保留一周的历史。这些“差异”文件对于\
  \ Unstable 仅需几 KB，因此每周 `apt update` 下载的数据量通常减少了 10 倍。对于变化较少的 Stable 和 Testing，这种收益尤为明显。\n\
  \n然而，有时强制下载整个 `Packages` 文件是有兴趣，特别是当上次升级非常久，且增量差异机制贡献不大的时。当网络访问非常快但要升级的机器处理器较慢时，这可能很有趣，因为下载节省的时间比计算这些文件新版本（从旧版本开始应用下载的差异）所花费的时间更多。要这样做，你可以使用\
  \ APT 配置参数 `Acquire::PDiffs` 并设置为 `false`。\n\n```\n$ sudo apt -o \"Acquire::PDiffs=false\"\
  \ update\n```\n\n`Acquire::*` 选项还控制下载的其他方面，甚至是下载方法。`Acquire::Languages` 可以限制或禁用\
  \ `Translation-language-code` 文件的下载，并节省更多时间。完整的参考信息请参阅 `apt.conf(5)`。\n\n* *\n\n\
  ## 6.2.2 安装与移除\n\n\n\n\n使用 APT，可以分别通过 `apt install package` 和 `apt remove package`\
  \ 从系统中添加或删除软件包。在这两种情况下，APT 都会自动安装必要的依赖项，或者删除依赖于正在移除的包的软件包。`apt purge package` 命令则包含通过删除配置文件来实现完全卸载。\n\
  \n* * *\n\n提示：多次安装相同选择的软件包\n\n在在几台计算机上系统化地安装同一份软件包列表可能是很有用的。这可以很容易地实现。\n\n首先，获取将作为“模型”进行复制的计算机上已安装的软件包列表。\n\
  \n```bash\n$ dpkg --get-selections >pkg-list\n```\n\n此时 `pkg-list` 文件包含了已安装软件包列表。接下来，将\
  \ `pkg-list` 文件传输到你想要更新的计算机上，并使用以下命令：\n\n### 更新 dpkg 的已知软件包数据库\n```bash\navail=`mktemp`\n\
  apt-cache dumpavail > \"$avail\"\ndpkg --merge-avail \"$avail\"\nrm -f \"$avail\"\
  \n```\n\n### 更新 dpkg 的选择\n```bash\ndpkg --set-selections < pkg-list\n```\n\n###\
  \ 让 apt-get 安装选定的软件包\n```bash\napt-get dselect-upgrade\n```\n\n第一个命令在 dpkg 数据库中记录可用软件包列表。然后\
  \ `dpkg --set-selections` 恢复你想要安装的软件包选择，而 `apt-get` 调用执行了所需的操作！`aptitude` 没有这个命令。\n\
  \n* * *\n\n* * *\n\n提示：同时移除和安装\n\n可以通过添加后缀，让 `apt`（或 `apt-get`、`aptitude`）在同一命令行中安装某些软件包并移除其他软件包。在使用\
  \ `apt install` 命令时，在你想要移除的软件包名称后添加 `-`。在使用 `apt remove` 命令时，在你想要安装的软件包名称后添加 `+`。\n\
  \n下面的示例显示了安装 `package1` 并移除 `package2` 的两种不同方法。\n\n```bash\napt install package1-package2\n\
  apt remove package1+package2\n```\n\n这也可以用于排除原本会被安装的软件包，例如由于自动安装了 `Recommends`。通常情况下，依赖关系求解器将使用该信息作为提示来寻找替代方案。\n\
  \n* * *\n\n* * *\n\n提示：apt --reinstall 和 aptitude reinstall\n\n在移除或修改软件包中的文件后，系统有时可能会损坏。检索这些文件的简单方法是重新安装受影响的软件包。遗憾的是，软件包系统发现后者已安装，并礼貌地拒绝重新安装；为了避免这种情况，请使用\
  \ `apt` 和 `apt-get` 命令的 `--reinstall` 选项。以下命令即使在 postfix 已经存在的情况下重新安装它：\n\n```bash\n\
  # apt --reinstall install postfix\n```\n\n`aptitude` 命令行略有不同，但通过 `aptitude reinstall\
  \ postfix` 可以达到相同的结果。\n\n这个问题在 `dpkg` 中不会出现，但管理员很少直接使用它。\n\n小心！使用 `apt --reinstall`\
  \ 来恢复在攻击期间修改的软件包，绝不会将系统恢复到原始状态。[第 14.7 节，“处理受攻击的机器”详细说明了对受攻击的系统需要采取的必要步骤。\n\n这些命令不会恢复配置文件。但正如你在[第\
  \ 5.2.3 节，“校验和和配置文件列表”（另参见侧边栏 [*进阶 强制 dpkg 询问配置文件问题]）中所学到的那样，你可以使用以下命令来被询问安装未修改的版本，甚至恢复任何已删除的配置文件。\n\
  \n```bash\n# apt --reinstall -o Dpkg::Options::=\"--force-confask,confmiss\" install\
  \ package\n```\n\n某些软件包在发布时并不包含位于 `/etc` 中的配置文件。相反，它们在安装期间期间通过拷贝骨架或通过脚本写入来创建。例如，`/etc/inputrc`\
  \ 文件是 `/usr/share/readline/inputrc` 的副本。在这种情况下，上述命令将不起作用。\n\n* * *\n\n如果 `sources.list`\
  \ 文件提到了多个发行版，可以指定要安装的软件包版本。可以通过 `apt install package=version` 请求特定的版本号，但指明其源自发行版（Stable、Testing\
  \ 或 Unstable）——使用 `apt install package/*distribution`——通常是首选。通过此命令，可以回到软件包的旧版本（例如，如果你知道它运行良好），只要该版本在\
  \ `sources.list` 文件引用的某个源中仍然可用即可。否则，`snapshot.debian.org` 存档可以派上用场（参见侧边栏 [*进阶 旧软件包版本：`snapshot.debian.org`]）。\n\
  \n示例 6.4. 安装 Unstable 版本的 spamassin\n```bash\napt install spamassin/unstable\n```\n\
  如果要安装的软件包已以简单 `.deb` 的形式提供给你，仍然可以同它的依赖项一起安装：`apt install ./path-to-package.deb`。\n\
  \n* * *\n\n进阶 .deb 文件的缓存\n\nAPT 在 `/var/cache/apt/archives/` 目录下保留每个下载的 `.deb` 文件的副本。在频繁更新的情况下，该目录可能会因为每个软件包的多个版本而迅速占用大量空间；你应该定期清理它们。可以使用两个命令：`apt-get\
  \ clean` 完全清空目录；`apt-get autoclean` 仅移除无法下载（因为它们已从 Debian 镜像中消失）因此无用的软件包（配置参数 `APT::Clean-Installed`\
  \ 可以防止删除 `.deb` 文件）。\n\n* * *\n\n## 6.2.3 系统升级\n\n建议定期升级，因为它们包含了最新的安全更新。要升级，请使用\
  \ `apt upgrade`、`apt-get upgrade` 或 `aptitude safe-upgrade`（当然是在 `apt update` 之后）。该命令寻找可以在不移除任何软件包的情况下进行升级的安装软件包。换句话说，目标是确保最小侵入性的升级。`apt-get`\
  \ 比 `aptitude` 或 `apt` 稍微严格一些，因为它会拒绝安装预先安装的软件包。\n\n`apt` 通常会选择最新的版本号（默认忽略来自 Experimental\
  \ 和 stable-backports 的软件包）。如果你在 `sources.list` 中指定了 Testing 或 Unstable，`apt upgrade`\
  \ 将你的大部分 Stable 系统切换到 Testing 或 Unstable，这可能不是你的本意。\n\n要让 `apt` 在搜索升级软件包时使用特定的发行版，你需要使用\
  \ `-t` 或 `--target-release` 选项，跟随所需的发行版名称（例如 `apt -t stable upgrade`）。为了避免每次使用 `apt`\
  \ 时指定此选项，你可以在 `/etc/apt/apt.conf.d/local` 文件中添加 `APT::Default-Release \"stable\"\
  ;`。\n\n\n\n对于更重要的升级，例如从一个 Debian 主版本升级到下一个主版本，你需要使用 `apt full-upgrade`。使用此指令，`apt`\
  \ 即使需要移除某些过时的软件包或安装新的依赖项也能完成升级。这也是每天处理 Debian Unstable（不稳定版）发布并追踪其演进的用户所使用的命令。它是如此简单，以至于不需要解释：APT\
  \ 的声誉正是基于这一强大功能。\n\n与 `apt` 和 `aptitude` 不同，`apt-get` 不支持 `full-upgrade` 命令。相反，你应该使用\
  \ `apt-get dist-upgrade`（“发行版升级”），这是 `apt` 和 `aptitude` 也接受的、且方便用户的命令。\n\n这些操作的结果记录在\
  \ `/var/log/apt/history.log` 和 `/var/log/apt/term.log` 中，而 `dpkg` 将日志保存在 `/var/log/dpkg.log`\
  \ 文件中。\n\n### 6.2.4. 配置选项\n\n除了上述配置元素外，还可以通过在 `/etc/apt/apt.conf.d/` 目录下的文件或 `/etc/apt/apt.conf`\
  \ 文件中添加指令来配置 APT 的某些方面。记住，例如，APT 可以告诉 `dpkg` 忽略文件冲突，指定 `DPkg::options { \"--force-overwrite\"\
  ; }`。\n\n如果只能通过代理访问 Web，添加一行 `Acquire::http::proxy \"http://yourproxy\"`。对于 FTP\
  \ 代理，写入 `Acquire::ftp::proxy \"ftp://yourproxy\"`。要发现更多配置选项，请阅读 `apt.conf(5)` 手册（详情请参阅\
  \ 7.1.1. 手册）。\n\n### 以 .d 结尾的目录\n\n以 `.d` 结尾的目录使用得频繁。每个目录代表一个拆分成多个文件的配置文件。从这个意义上说，`/etc/apt/apt.conf.d/`\
  \ 中的所有文件 APT 会按字母顺序包含它们，以便后面的文件可以修改前面文件中定义的配置元素。\n\n这种结构为管理员和软件包维护者带来了灵活性。事实上，管理员可以通过在目标目录中添加现成的文件来轻松修改软件配置，而无需更改现有文件。Debian\
  \ 策略显式禁止修改软件包的配置文件——只有用户允许这样做。在软件包升级期间，如果检测到修改，用户将可以选择保留的配置文件版本。任何对文件的外部修改都会触发该请求，确保管理员没有更改任何内容。如果没有\
  \ `.d` 目录，软件包无法在不修改其配置文件的情况下更改设置。相反，它必须邀请用户自行操作，并将操作列在 `/usr/share/doc/package/README`。\n\
  \n取决于应用程序，`.d` 目录是直接使用的，还是由外部脚本连接所有文件来创建配置文件本身。在该目录发生任何更改后执行脚本很重要，以便考虑到最新的修改。同样，不要直接在自动创建的文件中工作，因为下次执行脚本时所有内容都会丢失。选择的方法（直接使用\
  \ `.d` 目录或从该目录生成文件）通常由实现限制决定，但在两种情况下，灵活性的收益都大于其带来的微小复杂。Exim 4 邮件服务器生成文件方法的示例：它可以通过多个文件（`/etc/exim4/conf.d/*`）进行配置，并通过\
  \ `update-exim4.conf` 命令合并到 `/var/lib/exim4/config.autogenerated`。\n\n## 6.2.5.\
  \ 管理软件包优先级\n\nAPT 配置中最重要的方面之一是与每个软件包源相关的优先级管理。例如，你可能希望通过 Testing（测试版）、Unstable（不稳定版）或\
  \ Experimental（实验版）的一个或两个新软件包来扩展一个发行。可以为每个可用软件包分配优先级（同一个软件包可以根据其版本或提供它的发行具有多个优先级）。这些优先级将影响\
  \ APT 的行为：对于每个软件包，它总是选择优先级最高的版本（除非该版本较旧且优先级较低）。\n\nAPT 定义了多个默认优先级。每个已安装的软件包版本优先级为\
  \ 100。未安装版本的默认优先级为 500，但如果它是目标发布的一部分（通过 `-t` 命令行选项或 `APT::Default-Release` 配置指令定义），则它可以跳到\
  \ 990。\n\n你可以通过在 `/etc/apt/preferences.d/` 中的文件或 `/etc/apt/preferences` 文件中添加条目来修改优先级，包含受影响软件包的名称、版本、来源和新优先级。\n\
  \nAPT 绝不会安装旧版本的软件包（即版本号低于当前安装版本的软件包），除非其优先级高于 1000（或由用户显式指定，参见 [6.2.2. 安装与卸载](#apt-install0602]）。APT\
  \ 将始终安装遵循此约束的最高优先级。如果两个软件包具有相同的优先级，APT 安装最新的那一个（版本号最高的）。如果两个相同版本的软件包优先级相同但内容不同，APT\
  \ 安装未安装的那个版本（此规则的创建是为了涵盖软件包在不增加修订版本号的情况下进行更新的情况）。\n\n更具体地说，优先级为以下值的软件包：\n\n- < 0：绝不安装；\n\
  - 1..99：只有在没有安装其他版本的软件包时才安装；\n- 100..499：只有在其他发行版中没有更新版本时才安装；\n- 500....989：只有在目标发行版中没有更新版本时才安装；\n\
  - 990..1000：除非安装的版本较新，否则将安装；\n- > 1000：始终安装，即使这强制 APT 降级到旧版本。\n\n当 APT 检查 `/etc/apt/preferences`\
  \ 和 `/etc/apt/preferences.d/` 时，它首先考虑具体的条目（通常是指定相关软件包的条目），然后是更通用的条目（例如，某个发行版的所有软件包）。如果存在多个通用条目，则使用第一个匹配。可用的选择标准包括软件包名称和提供它的来源。\n\
  \n让我们通过该机制的几个现实案例研究一下其语法。\n\n\n\n\n# 特殊案例 实验性版本的优先级\n\n如果你在 `sources.list` 文件中列出了\
  \ Experimental（实验性），相应的软件包几乎不会被安装，因为它们的默认 APT 优先级为 `1`。这当然是一个特殊情况，旨在防止用户误装实验性软件包。只有通过输入\
  \ `aptitude install `package*/experimental` 才能安装它们——输入此命令的用户只能意识到他们正在承担的风险。尽管（*不建议*），但你仍然可以通过赋予实验性包优先级\
  \ `500` 来像对待其他发行版的包一样对待它们。这通过 `/etc/apt/preferences` 中的一个特定条目来实现：\n\n```text\nPackage:\
  \ * Pin: release a=experimental Pin-Priority: 500\n```\n\n* * *\n\n假设只想使用 Debian\
  \ 稳定版（stable）的软件包。除非显式请求，否则不应安装其他版本提供的包。你可以在 `/etc/apt/preferences` 文件中写入以下内容：\n\
  \n```text\nPackage: * Pin: release a=stable Pin-Priority: 900\nPackage: * Pin: release\
  \ o=Debian Pin-Priority: -10\n```\n\n`a=stable` 定义了所选发行版的名称。`o=Debian` 将范围限制为源自“Debian”的软件包。\n\
  \n现在假设你有一台服务器，上面的多个本地程序依赖 Perl `5.24` 版本，你希望确保升级不会安装它的另一个版本。你可以使用此条目：\n\n```text\n\
  Package: perl Pin: version 5.24* Pin-Priority: 1001\n```\n\n为了更好地理解优先级机制、发行版属性或要锁定的仓库属性，请随时执行\
  \ `apt-cache policy` 来显示与每个软件包源关联的默认优先级，或者执行 `apt-cache policy `package` ` 来显示软件包每个可用版本和源的默认优先级，这在\
  \ *TIP* **apt-cache policy** 中有所解释。\n\n`/etc/apt/preferences` 和 `/etc/apt/preferences.d/`\
  \ 文件的参考文档可以在手册页 `apt_preferences(5)` 中找到，你可以通过 `man apt_preferences` 显示它。\n\n* *\
  \ *\n\n### *TIP* `/etc/apt/preferences` 中的注释\n\n在 `/etc/apt/preferences` 文件中没有官方的注释语法，但可以通过在每个条目的开头放置一个或多个“`Explanation`”字段来提供文本描述：\n\
  \n```text\nExplanation: the package xserver-xorg-video-intel provided Explanation:\
  \ in experimental can be used safely\nPackage: xserver-xorg-video-intel Pin: release\
  \ a=experimental Pin-Priority: 500\n```\n\n* * *\n\n## 6.2.6 与多个发行版一起工作\n\n`apt`\
  \ 是一个如此神奇的工具，选择来自其他发行版的软件包非常有吸引力。例如，在安装了 Stable（稳定）系统后，你可能想尝试 Testing（测试）或 Unstable（不稳定）中可软件软件包，而不会太偏离系统的初始状态。\n\
  \n即使在混合使用不同发行版的软件包时偶尔会遇到问题，`apt` 也能很好地管理这种共存并非常有效地限制风险。最好的做法是在 `/etc/apt/sources.list`\
  \ 中列出所有使用的发行版（有些人总是放这三个发行版，但请记住 Unstable 是留给经验丰富的用户的），并使用 `APT::Default-Release`\
  \ 参数定义你的参考发行版（参见 Section 6.2.3, “System Upgrade”）。\n\n假设 Stable 是你的参考发行版，但 Testing\
  \ 和 Unstable 也列在你的 `sources.list` 文件中。在这种情况下，你可以使用 `apt install `package*/testing`\
  \ 来安装 Testing 中的软件包。如果安装由于某些无法满足的依赖而失败，通过添加 `-t testing` 参数让它在 Testing 内部解决这些依赖关系。这显然也适用于\
  \ Unstable。\n\n在这种情况下，升级（`upgrade` 和 `full-upgrade`）将在 Stable 内进行，但已经升级到另一个发行版的软件包除外：这些包将遵循其他发行版中可用的更新。我们将在下通过\
  \ APT 设置的默认优先级来解释这种行为。请随时使用 `apt-cache policy`（参见侧边栏 *TIP* **apt-cache policy**）来验证给定的优先级。\n\
  \n一切都围绕着一点：APT 只考虑比已安装软件包版本更高或相同的软件包（假设没有使用 `/etc/apt/preferences` 强制某些软件包的优先级高于\
  \ `1000`）。\n\n假设你已经从 Stable 安装了第一个软件包的版本 `1`，而版本 `2` 和 `3` 分别在 Testing 和 Unstable\
  \ 中可用。已安装版本的优先级为 `100`，但 Stable 中可用的版本（即同一个版本）优先级为 `990`（因为它是目标发布的一部分）。Testing 和\
  \ Unstable 中的软件包优先级为 `500`（未安装版本的默认优先级）。因此，获胜者是优先级为 `990` 的版本 `1`。该软件包“留在 Stable\
  \ 中”。\n\n让我们以另一个软件包为例，该包已从 Testing 安装了版本 `2`。版本 `1` 在 Stable 中可用，版本 `3` 在 Unstable\
  \ 中可用。版本 `1`（优先级为 `990` —— 因此低于 `100`）被丢弃，因为它低于已安装版本。这剩下 `2` 和 `3`，它们的优先级均为 `500`。面对这种替代方案，APT\
  \ 选择最新的版本，即来自 Unstable 的版本。你不希望来自 Testing 的包迁移到 Unstable，则必须为 Unstable 的包分配低于 `500`\
  \ 的优先级（例如 490）。你可以这样修改 `/etc/apt/preferences`：\n\n```text\nPackage: * Pin: release\
  \ a=unstable Pin-Priority: 490\n```\n\n## 6.2.7 跟踪已安装软件包\n\n`apt` 的基本功能之一是跟踪通过依赖安装的软件包。这些软件包被称为“自动”，通常包括库。\n\
  \n有了这些信息，在移除软件包时，包管理器可以计算不再需要的自动软件包（因为没有“手动安装”的软件包依赖它们）。`apt-get autoremove` 或 `apt\
  \ autoremove` 将删除这些软件包。`aptitude` 没有这个命令，因为它会自动删除它们。在所有情况下，工具都会显示受影响的软件包列表。\n\n\
  将你不直接需要的软件包标记为自动是一个好习惯，这样它们在不再需要时就会自动删除。`apt-mark auto `package` ` 将指定的软件包标记为自动，而\
  \ `apt-mark manual `package` ` 则相反。`aptitude markauto` 和 `aptitude unmarkauto` 的原理相同，尽管它们为一次性标记多个包提供了更多功能（参见\
  \ Section 6.5.1, “**aptitude**”）。`aptitude` 基于控制的交互界面也方便查看许多软件包的“自动标记”。人们可能想知道为什么系统中存在自动安装的软件包。要从命令行获取此类信息，可以使用\
  \ `aptitude why `package` `（**apt** 和 **apt-get** 没有类似的功能）：\n\n```\n$ aptitude why\
  \ python-debian\ni aptitude Suggests apt-xapian-index p apt-xapian-index Depends\
  \ python-debian (>= 0.1.14)\n```\n\n* * *\n\n### *ALTERNATIVE* **deborphan** 和 **debfoster**\n\
  \n在 **apt**、**apt-get** 和 **aptitude** 无法跟踪自动软件包的日子，有两个产生不必要软件包列表的工具：**deborphan**\
  \ 和 **debfoster**。两者仍然很有用。\n\n\n\n\n`deborphan` 默认会扫描 `libs` 和 `oldlibs` 部分（在没有补充说明的情况下），寻找当前已安装且没有其他包依赖于它的包。生成的列表可以作为删除不需要的包的依据。\n\
  \n`debfoster` 采用了一种更复杂的方法，与 APT 的方法非常相似：它维护一个显式安装的软件包列表，并记住每次调用之间真正需要的软件包。如果系统上出现了新软件包，且\
  \ `debfoster` 不认为它们识别为所需的包，则它们将与它们的依赖项列表一起显示在屏幕上。然后，程序会提供一个选择：删除该包（可能连同依赖于它的包一起删除）、将其标记为显式需要，或者临时忽略它。\n\
  \n* *\n\n# 6.3. `apt-cache` 命令\n\n`apt-cache` 命令可以显示存储在 APT 内部数据库中的许多信息。这些信息是某种缓存，因为它们是从\
  \ `sources.list` 文件中列出的不同来源收集的。这发生在 `apt update` 操作期间。\n\n* *\n\n### 词汇 缓存 (Cache)\n\
  \n缓存是一种临时存储系统，当通常的访问方法开销较大（从性能角度考虑）时用于加速频繁的数据访问。这一概念可以应用于许多情况和不同的规模，从微处理器的核心到高端存储系统。\n\
  \n在 APT 的情况下，引用的 `Packages` 文件是位于 Debian 镜像上的文件。话虽如此，如果对可用软件包数据库中可能想要进行的每一次搜索都通过网络，那将是非常低效的。这就是为什么\
  \ APT 存储了这些文件的副本（在 `/var/lib/apt/lists/` 中），并且在这些本地文件中进行搜索。同样，`/var/cache/apt/archives/`\
  \ 包含了已下载软件包的缓存，以避免在删除删除后需要重新安装它们时再次下载。\n\n另一方面，必须定期运行 `apt update` 来更新缓存。否则，你的软件包搜索结果将始终会错过\
  \ Debian 镜像分发的最新更新。\n\n`apt-cache` 命令可以通过 `apt-cache search `keyword`` 进行基于关键词的包包搜索。它还可以通过\
  \ `apt-cache show `package`` 显示包的可用版本的头信息..。此命令提供了包的描述、其依赖项、维护者名称等。请注意 `apt search`、`apt\
  \ show`、`aptitude search` 和 `aptitude show` 的工作方式相同。\n\n* *\n\n### 替代方案 `axi-cache`\n\
  \n`apt-cache search` 是一个非常原始的工具，基本上是在包的描述上实现 `grep`。当你包含太多关键词时，它通常会返回太多结果，或者完全没有结果。\n\
  \n另一方面，`axi-cache search `term`` 提供了更好的结果，并按相关性排序。它使用 `Xapian` 搜索引擎，是 `apt-xapian-index`\
  \ 包的一部分，该包索引了所有包信息（以及更多，如所有 Debian 包的 `.desktop` 文件）。它知道标签（参见侧边栏 *深入探索 `Tag` 字段`）并并在几毫秒内返回结果。\n\
  \n```\n$ axi-cache search package use::searching 100 results found. Results 1-20:\
  \ 100% packagesearch - 用于搜索包和查看包信息的 GUI 99% apt-utils - 与软件包管理相关的实用程序 98% whohas\
  \ - 查询多个发行版的包存档 98% dpkg-awk - 用于解析 /var/lib/dpkg/{status,available} 和 Packages\
  \ 的 Gawk 脚本 97% apt-file - 在 Debian 包内搜索文件（命令行界面） [..] 90% wajig - Debian 的统一包管理前端\
  \ More terms: debtags debian paket dpkg search pakete tools More tags: role::program\
  \ interface::commandline works-with::software:package suite::debian admin::package-management\
  \ scope::utility network::client `axi-cache more' will give more results\n```\n\n\
  * *\n\n某些功能较少被使用。例如，`apt-cache policy` 显示包源的优先级以及单个包的优先级。另一个例子是 `apt-cache dumpavail`，它显示所有包的所有可用版本的头信息。`apt-cache\
  \ pkgnames` 显示缓存中至少出现一次的所有包的列表。\n\n* *\n\n### 提示 `apt-cache policy`\n\n`apt-cache\
  \ policy` 命令显示每个包源的固定优先级和发行属性，正如第 6.2.5 节，“管理软件包优先级`](ch06s02.html_sect.apt.priorities\
  \ \"6.2.5. Managing Package Priorities\")”中解释的那样。它还可以显示包的所有可用版本和来源的固定优先级。对于 示例 6.2，适用于\
  \ Debian Stable 用户的 `/etc/apt/sources.list` 文件` 中使用的 `sources.list` 示例，并将 `APT::Default-Release`\
  \ 设置为 `\"buster\"`，输出如下：\n\n```\n$ apt-cache policy\nPackage files: 100 /var/lib/dpkg/status\
  \ release a=now 100 https://deb.debian.org/debian buster-backports\n```\n\n\n\n\
  `$ apt-file search bin/axi-cache` apt-xapian-index: `/usr/bin/axi-cache`\n\n命令 `apt-file\
  \ list `package`` 将列出该包包含的所有文件。\n\n***\n\n*提示* 列出包内容和查找文件所属包\n\n类似于 `apt-file list`，命令\
  \ `dpkg -L `package`` 会列出所有文件，但仅针对已安装的包。要查找本地文件所属的包，请使用 `dpkg -S `file``（参见第 5.4.3\
  \ 节，“查询 `dpkg` 数据库和检查 .deb 文件” )）。要列出所有不属于任何已安装包的本地文件，你可能想查看 `cruft` 或 `cruft-ng`\
  \ 包。\n\n***\n\n# 6.5. 前端：`aptitude`, `synaptic`\n\nAPT 是一个 C++ 程序，其代码主要位于 `libapt-pkg`\
  \ 共享库中。使用共享库有助于创建用户界面（前端），因为库中的代码可以很容易地重用。从历史上看，`apt-get` 只设计为 `libapt-pkg` 的测试前端，但它的成功掩盖了这一事实。\n\
  \n## 6.5.1. `aptitude`\n\n`aptitude` 是一个交互式程序，可以在控制台中以半图形模式运行。你可以浏览已安装和可用包列表，查询所有可用信息，并选择要安装或删除的包。该程序专门为管理员设计，因此其默认行为比\
  \ `apt-get` 智能得多，界面也更容易理解。\n\n图 6.1. aptitude 包管理器![aptitude 包管理器](img/aptitude.png)\
  \ \n\n当 `aptitude` 启动时，它会显示按状态（已安装、未安装、或已安装但在镜像服务器上不可用）排序的包列表（其他部分显示任务、虚拟包以及最近在镜像服务器上出现的新包）。为了方便按主题浏览，提供了其他视图。在任何情况下，`aptitude`\
  \ 都会在屏幕上显示一个结合类别和包的列表。类别通过树结构组织，其分支可以分别展开或关闭。\n\n\n\n总结本节内容，请注意在处理复杂情况时，`aptitude`\
  \ 相比 `apt-get` 拥有更复杂的算法。当请求一组操作，且这些组合操作会导致系统状态不一致时，`aptitude` 会评估几种可能的场景，并按相关性从高到低的顺序呈现它们。然而，这些算法并非万无一失。幸运的是，始终可以手动选择要执行的操作。当当前选择的操作导致冲突时，屏幕上方会显示若干个“损坏”软件包（你可以通过按\
  \ `b` 直接导航到这些软件包）。此时，可以为发现的问题手动构建解决方案。特别是，你只需通过 `Enter` 键选择软件包来访问不同的可用版本。如果选择其中一个版本解决了问题，你不应该犹豫地使用该功能。当损坏软件包的数量减少到零时，你就可以安全地进入待处理操作摘要屏幕，在应用它们之前进行最后检查。\n\
  \n***\n\n注意 `aptitude` 的日志\n\n与 `dpkg` 一样，`aptitude` 会在其日志文件（`/var/log/aptitude`）中记录已执行的操作。然而，由于这两个命令的工作层次完全不同，你无法在各自的日志文件中找到相同的信息。`dpkg`\
  \ 会逐步记录在单个软件包上执行的所有操作，而 `aptitude` 则提供了系统级升级等高层操作的更广泛视图。\n\n请注意，此日志文件仅包含 `aptitude`\
  \ 执行的操作摘要。如果偶尔使用其他前端（甚至 `dpkg` 本身），那么 `aptitude` 的日志将只包含操作的部分视图，因此你不能依赖它来构建可靠的系统历史。\n\
  \n***\n\n## 6.5.2 synaptic\n\n`synaptic` 是一个用于 Debian 的图形化包管理器，其特点是基于 GTK+/GNOME\
  \ 拥有整洁且高效的图形界面。它的许多即用过滤器可以快速访问新可用软件包、已安装软件包、可升级软件包、过时软件包等。如果你浏览这些列表，可以选择对软件包要执行的操作（安装、升级、删除、彻底清除）；这些操作不会立即执行，而是被放入任务列表中。只需点击一个按钮即可验证这些操作，并一次性执行。\n\
  \n图 6.2. synaptic 软件包管理器![synaptic 软件包管理器](img/synaptic.png)\n\n## 6.6 检查软件包的真实性\n\
  \n安全对于 Falcot Corp 的管理员来说非常重要。因此，他们需要确保只安装那些保证来自 Debian 且在传输过程中未被篡改的软件包。计算机黑客可能会尝试向原本合法的软件包中添加恶意代码。如果安装了此类软件包，它可以执行黑客设计的的任何操作，例如泄露密码或机密信息。为了规避这种风险，Debian\
  \ 了一个了一个防篡改密封，以确保——在安装时——软件包确实来自其官方维护者，且未被第三方修改过。\n\n该密封通过一系列加密哈希链和签名来工作，并在 apt-secure(8)\
  \ 中进行了详细解释。从 Debian 10 buster 开始，签名文件是 Setup Debian 镜像提供的 `InRelease` 文件。还有一个名为\
  \ `Release` 的旧版文件。两者都包含 `Packages` 文件的列表（包括它们的压缩格式 `Packages.gz` 和 `Packages.xz`\
  \ 以及增量版本），以及它们的 SHA256 哈希值，这确保了文件没有被篡改。这些 `Packages` 文件包含了镜像上可用的 Debian 软件包列表及其哈希值，这反过来确保了软件包本身的内容也没有被更改过。`InRelease`\
  \ 和 `Release` 之间的区别在于，前者是内联加密签名的，而后者以 `Release.gpg` 文件的形式提供离线签名。\n\n***\n\n注意 `Release`\
  \ 和 `Release.gpg` 的未来\n\n可能随着 Debian 11 Bullseye 的发布，APT 将移除对自 APT 0.6 以来用于存档认证的旧文件\
  \ `Release` 和 `Release.gpg` 的支持。\n\n***\n\nAPT 需要一组信任的 GnuPG 公钥来验证镜像上 `InRelease`\
  \ 和 `Release.gpg` 文件中的签名。它从 `/etc/apt/trusted.gpg.d/` 中的文件以及 `/etc/apt/trusted.gpg`\
  \ 密钥环（由 `apt-key` 命令管理）获取密钥。官方 Debian 密钥由 debian-archive-keyring 软件包提供并保持更新，该软件包将其放在\
  \ `/etc/apt/trusted.gpg.d/` 中。但注意，首次安装此特定软件包需要谨慎：即使该软件包与其他软件包一样经过签名，也无法从外部验证签名。因此，谨慎的管理员在信任导入的密钥安装新软件包之前，应该检查这些密钥的指纹：\n\
  \n\n\n\n# `apt-key fingerprint`\n\n```\n/etc/apt/trusted.gpg.d/debian-archive-buster-automatic.gpg\
