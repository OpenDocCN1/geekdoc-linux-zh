    # Job Control


    Because Unix is a multitasking operating system, there''s a very good chance that
    you might be doing more than one at a time. (In another era, this would be thought
    of as “hyperactive,” or perhaps “lacking focus),” but today we can call it “Making
    effective use of technology.” How times change!) Given we''re doing more than
    one at a time, it''s a pretty good chance that we want to have influence over
    what we''re doing and when we are doing it. In a system developed today, this
    would probably be done through some cute little control panel, but because Unix''s
    multitasking heritage goes back nearly 30 years, there are several command-line
    tools for controlling your jobs.


    # What''s a Job?


    “Wait


    Good question. Back in the old days, before users had so much as a typewriter
    to talk to their computers, if you wanted the computer to do work, you would need
    to submit a large pile of punch cards which you had punched out your instructions.
    You would hand your large pile of punch cards to the wizards in charge of the
    machine, and later you would receive back your pile of cards and output (hopefully
    the output you were hoping for, but more likely an error message because you punched
    one of your cards wrong) was your job.


    In terms, a job is a process or series of processes you''re running. That is,
    it''s based on what was entered on a single command line rather than a per-process
    basis. You can have more than one job at a time, and thus need tools to suspend
    jobs, run them in the background, switch foreground jobs to the background, and
    switch back to the foreground again.


    Suspending jobs is usually easy: most programs permit you to suspend them, which
    on every system defaults to Control-Z. Some programs by default disable the suspend
    key. Notable in this regard are many mail readers and editors. Often there will
    be an option to prevent the program from disabling suspend. A Unix user who prefers
    that the system gives him rope to hang myself, then to enable suspend in my applications,
    but opinions on this matter differ considerably.


    +   2. As with your erase and kill keys, this can be reconfigured with stty: stty
    susp Control-V newly.'
