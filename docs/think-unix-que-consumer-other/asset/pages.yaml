  md: '# Unix Concepts


    Port 110 is the standard POP3 connection port. When we connect to our server,
    it responds with a banner message indicating the protocol, host, and server version.
    POP stands for Post Office Protocol, and the number three represents the version
    of that protocol supported. Communication protocols, sat as software, evolve as
    need dictates. Also like software, these versions are numbered, so that you know
    what you''re getting and can have an idea as to what''s supported.


    All POP status messages, including the banner when connected to a server, one
    of status indicators, as opposed to the many numbered status codes supported by
    SMTP. These are ~OK for successfully executed commands and ~ERR for unsuccessful
    commands. This makes it possible to write incredibly simple client software that
    nevertheless supports error checking. Anything on the rest of the line is, as
    far as the protocol is concerned, simply a comment intended for human consumption;
    comments are fairly informative, to help debug problems when we manually connect
    to our server.


    Our first mission, when we connect, is authenticate ourselves so that the server
    knows mailbox to look at. Unlike SMTP, it matters that we are able to claim, and
    we''re asked for a password. Because this is a simple, direct connection and the
    password is displayed onscreen as you type it, so a good look and make sure nobody''s
    watching before you do. The syntax of the USER and PASS commands is fairly simple
    and self-evident. Commands are not case sensitive, like in SMTP, and I''ve capitalized
    them in our previous examples to make clear what is a command and what''s argument.


    +   LIST

    +OK Mailbox scan listing follows

    1 518

    2 707


    LIST shows the messages in our mailbox and their size, in case we''re over a slow
    link and don''t want to read the larger messages. There are two messages in our
    mailbox right now, numbered one and two, with lengths of 518 and 707 bytes, respectively.
    Whenever a POP server responds with more than a single-line response, it is terminated
    by a period by itself on a line. (If you remember, this is how we told the SMTP
    server that we finished typing in our message.) Otherwise, we''d have no way to
    tell the difference between a slow or congested network and a completed command.


    Let''s read out first message:


    +   RETR

    +OK 518 octets

    Return-Path: ~elvis@frogbog.localdomain

    Received: from frogbog.localdomain

    y razorback.localdomain (8.9.3/8.9.3) with SMTP OAA05093

    for jon@razorback.localdomain; Sat, 15 Jan 2000 14:00:36 -0500


    Date: Sat, 15 Jan 2000 14:00:36 -0500'
