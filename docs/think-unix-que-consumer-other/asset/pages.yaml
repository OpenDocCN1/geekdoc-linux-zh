    and removing extra text when you are finished. Other vi replacements might display
    still different; try it yourself or check your manual for details.


    There are a few more editing commands that you might find useful. The single r
    replaces one character under the cursor with whatever text you type following;
    r replaces characters from your current position until you hit Esc, each time
    replacing the character under the cursor with the one you type. The join command,
    represented by a j, attaches the line of text below the cursor to the line of
    text on which the cursor sits, replacing any whitespace between the end of one
    line or the beginning of the next with a single space. This is useful for combining
