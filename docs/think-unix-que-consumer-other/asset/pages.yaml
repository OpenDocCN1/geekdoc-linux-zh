    # Standard Window Managers


    Some window managers are more standard than others. In particular, twm and mwm
    are almost every Unix system on the planet. twm is the Tab Window Manager, which
    accompanies the X Window System by default, and mwm is the Motif Window Manager,
    which accompanies that toolkit and is thus present on virtually every commercial
    Unix system. (Lestif also includes a clone of mwm, so is available on many Linux
    distributions as)


    # twm


    twm, the Tab Window Manager, is the one window manager included in the standard
    X11 distribution. When a new window is created in twm, an outline of that is displayed
    on the screen. That skeleton can be moved around and can be placed with a click
    of the first button, at which point the window will be placed on the screen. twm
    also allows you to create and edit menus by editing a .twm in your home directory,
    twm also allows you to iconify windows. Although twm does not support virtual
    desktops, a (nonstandard) variant ttwm supports them.'
