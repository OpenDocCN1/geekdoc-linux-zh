  md: 'could see how many hops were between you and your beloved without needing to
    resort to traceroute. Alas, our world is far from perfect, and the ttl is thus
    almost totally useless, except when you already know how a machine sets this field
    and that nothing between you and it will ruin it. This isn''t often.


    # Low-Level Protocols


    Already we''ve talked about packets shuttling between hosts along routes, but
    we haven''t said the first word about how those packets are shuffled. We''re not
    going to say much about this because you have to be a programmer or a network
    engineer to really care, knowing the names of these things and a rough idea of
    what they might be very helpful.


    To talk to one another, even (in the case of routers) through one another, they
    must be speaking the same language;they need to know what part of the packet represents
    the number, what part of machine cares about the packet, and so on. The agreement
    among computers on how to divide this data is known as a protocol. The analogy
    is to social protocols, which tell us how we should behave in polite company.
    A system behaves according to a given protocol by sending out compliant packets.
    Being Unix people, whose network world is limited (by choice) to the Internet,
    we only care about Internet protocols. The complete suite of Internet protocols
    is known as TCP/IP, named after two of the standard protocols.


    # IP


    Several protocols are used for different purposes on the Internet, but protocols
    can have layers, and the one which all other Internet protocols run—and on which
    they depend—is known as IP, which stands for Internet Protocol. The version in
    use is just everywhere version four, often referred to IPv4.


    The IP protocol does not do much. In essence, it has the source and destination
    sockets for the packet and not it is indeed an IP packet. You can send packets
    via IP, but it doesn''t do much. It doesn''t keep track of the packets arrived
    at their destination, it doesn''t check the order in which packets arrived at
    their destination, and it doesn''t check how many copies of a given packet arrived
    at the destination.


    What is IP? Plenty good! It''s simple, easy for programmers to implement, and
    a good foundation for more complicated protocols. The three most popular protocols
    running on top of IP are TCP, UDP, and ICMP.


    > 5. Actually, many Unix systems talk to other network types as well, including
