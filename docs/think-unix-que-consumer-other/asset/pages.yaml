    # HTTP


    Lets think that all plaintext protocols revolve around email, let''s discuss one
    last protocol we can use on a daily basis: HTTP, the Hypertext Transfer Protocol.9
    HTTP is the protocol underlying the World Wide Web, the language in Web browsers
    to talk to Web servers. It''s a large and fairly involved protocol, but we''re
    going to discuss only a small (albeit useful) piece of it. We''re not going to
    discuss every possible header or error, either; this is mostly so that you can
    get the flavor of a somewhat different sort of protocol.


    The simplest sort of HTTP request (and, generally speaking, the one we''re going
    to discuss) is one where you simply ask for a particular Web page on the server:


    ```

    @frogbob jon $ telnet localhost 80

    Trying 127.0.0.1...

    Connected to localhost.localdomain.

    Escape character is ''"''.

    GET /-jon/

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Frameset//EN">

    <html>

    <head>

    <title>Jon Lasser''s Home Page</title>

    </head>

    </html>

    ```


    Connection closed by foreign host.


    > 9. There are many other plaintext protocols, such as NNTP, the Network News
    Transfer Protocol, but after you have the basics down, you can learn any of them.
    I picked important protocols, those you use every day, because relevance counts.'
