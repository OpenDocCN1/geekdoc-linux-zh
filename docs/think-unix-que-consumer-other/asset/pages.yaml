    You might have noticed that both filenames end with .txt. If you''re used to Windows
    this will probably surprise you because most Windows filenames have an extension.
    (Heck, old DOS machines had only eight characters for a filename and three more
    for extension). Unlike Windows boxes, but like Macs, the extensions are more or
    less optional. The system doesn''t use them for anything important; they''re present
    mostly for the user''s convenience. Why did Elvis bother to end these filenames
    with .txt? Because it''s useful for him to know how to read a file. You''re not
    bound to these rules, but people make these conventions because they are useful.
    Some Unix programs you use use specific extensions, but most of the time these
    defaults can be overridden.


    Unix filenames are more flexible than those on Windows or Mac: They can contain
    several characters long on can contain any character except a forward slash. Personally,
    I recommend sticking to letters, numbers, periods, hyphens, and underscores. Most
    other characters have special meanings and must be escaped with backslashes, as
    in our exploration of the echo in Chapter 1. Some older Unix systems have further
    limitations on filenames; check your manual.


