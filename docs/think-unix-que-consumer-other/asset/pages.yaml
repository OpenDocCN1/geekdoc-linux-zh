    # Arbitrary Variables


    Of course, no shell limits you to the built-in variables with special functions.
    Instead, you can create any number of arbitrary variables that you desire, as
    long as their names do not conflict with special-purpose variable names. (In bash
    you can help variables to see a complete list of reserved variable names. Check
    the documentation for other shells as.)


    Why would you create a variable? Some variables are used by other programs on
    your system to provide configuration information. One interesting part of variables
    is EDITOR and VISUAL. In the Korn Shell, these variables control whether your
    command line-editing keys work like Emacs or vi style, as we saw in the previous
    chapter. In other shells, however, these variables are accessible by running programs
    to determine which editor to use when an editor is required. VISUAL usually overrides
    EDITOR, though this is not always the case. Similarly, PAGER defines the default
    pager (more, less, cat, or whatever you desire) for displaying long informational
    screens. Depending on the software you run, other variables might be useful for
    configuration.'
