  md: '# Unix Concepts


    In this request, we simply ask for a Web page, my homepage. This would be expressed
    by the URL http://localhost/-jon we were to enter it directly into our Web browser.
    We enter our GET request and hit Enter, and the Web daemon responds with the raw
    text of That page, closing the connection when it finished.


    This is the original form of the Web connection. The HTTP protocol has evolved,
    however, and eventually HTTP 1.0 was created. To send an HTTP 1.0 request, simply
    append the text HTTP/1.0 to your GET request, with a space between the pieces:


    ```

    [ jon@frogbog js$ tel localhost 80

    Trying 127.0.0.1...

    Connected to localhost.localdomain.

    Escape character is '' ''.

    GET ~/jon/ HTTP/1.0

    ```


    ```

    HTTP/1.1 200 OK

    Date: Sun, 16 Jan 2000 02:13:08 GMT

    Server: Apache/1.3.9 (Unix) (Red Hat/Linux)

    Last-Modified: Mon, 20 Dec 1999 23:52:53 GMT

    ETag: "c710-741-385ec55"

    Accept-Ranges: bytes

    Content-Length: 1857

    Connection: close

    Content-Type: text/html

    ```


    ```

    <html>

    .

    </html>

    ```


    Connection closed by foreign host.


    When we add the version number of the protocol to our request, the server sends
    back to us. It knows that we can understand the headers it sends to the server,
    so it waits for headers after we enter our GET command. Because we are not adding
    any additional headers, we can just hit Enter, after which it will respond with
    its own headers followed by the HTML.


    Some of these are obviously useful, such as the Last-Modified header, which lets
    us know when the Web page was last edited. The Content-Type header is used by
    the Web browser (if there is one) to determine what external program to use, if
    any,, to display this sort of content. Some of the headers are less useful. When
    it''s done with the headers, the server adds a blank line, displays the requested
    Web page, and closes the network connection.'
