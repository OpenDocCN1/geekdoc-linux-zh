  md: '# Think Unix Introduction


    default shell. The *shell* is the program that interprets the command line and
    allows the user to interact with the system. Many shells are available on Unix
    systems.


    This choice of platform is not because Linux in general, or Red Hat Linux in particular,
    it''s “better” than any other version of Unix. It''s a popular and easy-to-obtain
    distribution with adequate commercial support and boxed sets available at many
    retail outlets. If you don''t already have some of Unix on your home PC, I recommend
    starting with the most recent release of whichever distribution the newest Linux
    guru recommends. (I recommend Linux over other versions for home PCs because there
    are a larger number of Linux experts than experts in FreeBSD, BSD, or OpenBSD.
    Furthermore, recent distributions have installers much simpler than other Unix
    versions. Both of these traits are important to users. If your local guru recommends
    one of the BSD versions, feel free to give that a try:


    Sometimes to make a point, or because there is significant divergence between
    flavors of Unix (yes, many versions of Unix are known as flavors), I demonstrate
    a particular command on one of the many flavors of Unix. When I do this, I mention
    the specific version I use so that you know what to expect. Because they''re what
    I use at, I''ll tend to provide contrasting examples from Solaris 2.6 and Irix
    6.5. Again, this isn''t intended to imply any sort of superiority, mere availability.


    # An Ultra-Super-Brief History of Unix


    One reason why Unix is a deep operating system, in the sense I referred earlier
    in this introduction, is it has a history. Unix is just about 30 years old, depending
    on how you count it, and its predecessors are several years older than that. The
    point, Macintosh OS is about 15 years old and Windows is somewhat younger. (Windows,
    of course, used to—and in some cases does—run on top of MS-DOS, that''s a particularly
    shallow operating system, in terms of the services it provides.)


    One advantage of living in the modern age of computers is that they are much faster
    than we really need to be and that possess more memory and disk storage we should
    know to fill. I certainly not going get into specifics here if I do that future
    generations will laugh at how slow our computers were and how insignificant their
    storage. Similarly, I won''t tell you how slow computers were in 1969, when Unix
    was born, and I won''t tell you how little memory and disk space they had.


    If I did, you would almost certainly laugh, and you probably wouldn''t believe
    me anyway. If you''re still reading this in the bookstore, you''d probably think
    that I was either stupid or lying to you, and as a result you might not buy this
    book. If you''ve already bought the book, if you''re reading it in a library,
    or if you''ve borrowed a'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'friend''s copy, I still won''t tell you, because then you might not read the
    book, and I wouldn''t like like that bit.


    Suffice to say that, these were very, and I do mean very, small computers.


    In fact, on which Unix was born (a PDP-7, if you must know) was small even for
    its day. The people who wrote it (Ken Thompson and Dennis Ritchie, among many
    others) did so after moving off the Multics project, which ran on much larger
    computers. Because of their limited resources, Unix programs had to be small.
    Unlike most modern applications on Windows or Macintosh, you didn''t have a single
    program that did a bunch of things—like, for example, a typical WYSIWYG word processor—but
    many smaller programs, each of which did one thing. One goal was to have small
    programs so that they could fit into memory. Disk space was such a premium that
    everything was as small as possible, including program names. It (and) a common
    convention to remove the vowels from a command''s name to save space. It also
    helps to save a fair amount of typing if you use the system method.


    The decisions made in the first several years of development have shaped the Unix
    approach to problem solving. The main consequence is that each with limited functionality,
    be put together in various combinations to produce results. This philosophy is
    often known as the “toolbox approach,” and understanding this is the key to my
    suggestion that Unix can be learned as a language.


    Because there are a multitude of small commands, and the idea is to put these
    commands together to get what you want, you need a way to connect them. This book
    is about those connections: what they are, how they work, and how to string several
    commands together into Unix sentences. After you learn to put sentences together
    and you start putting together whole paragraphs worth of commands, you have begun
    to Think Unix.'
