    # Devices


    Unix sees virtually every device attached to your CPU as a file. This includes
    (at least) your mouse, your disks, your memory (on most systems), your terminal
    (if you''re using a physical terminal, and ever console on many others), your
    Ethernet card (again, on most systems), any modems you might have, your sound
