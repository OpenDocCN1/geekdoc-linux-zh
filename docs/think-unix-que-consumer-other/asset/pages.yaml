  md: '# Shell Scripts and More Chapter 9 187


    In this case, no shell is created, and any changes to the environment that occur
    within those braces persist in later commands.


    The second use for grouping commands is to redirect I/O for that entire list of
    commands in one shell. This works well with either grouping:We can { cd /etc ;
    grep my-regexp * ; cd 2>/dev/null } or { cd /etc ; grep my-regexp * ; cd 2>/dev/null
    }; and in each case STDERR is redirected to /dev/null. Of course, redirecting
    STDIN and STDOUT both work as well.


    Similarly, either type of grouping command can work to put an entire group of
    commands in the background. I could put and automated commands in the background,
    such as { cd /etc ; for foo in $(find -type d -print); ls -1f $foo >/tmp/my-data
    ; done 2>/dev/null & }. In this case, I would use it so as not to affect my current
    shell. When a group of commands is put in the background, the shell immediately
    receives an exit status of zero, just as a single command is backgrounded.


    Sometimes, you want to alert what occurs when conditionally executing code. Most
    of this time it isnt necessary because the exit status for a group of commands
    is the status of the last command in that group, so { || false } && echo "true".
    (Either of these statements will print the word "true" because the false command
    is never executed.) Times, you might want to run the command || (false && echo
    "true") which will print the word "true" only if the first part of the statement
    is false and the second is true. (In this case, the word "true" is not printed
    because the whole shell is never executed.) Although this is useful, in most cases
    it''s better to rewrite your conditionals as a formal statement.


    # Aliases and Functions


    Using aliases would be inconvenient if you had to type long sequences of commands
    all the time. Unfortunately, Unix provides several different features to save
    you typing. Or, if you prefer, you can type the same amount as you would otherwise
    have the environment customized to work the way you want it to work. The two basic
    ways of doing this are to tell the shell, "Whenever I type this, do all this other
    stuff," or to put everything you''d like to have in a single file and let the
    shell execute that file. That first solution is, in Unix terms, to use aliases
    and functions; the other solution is to write a shell script, but one at a time!


    # Aliases


    An alias is, not surprisingly, a command that stands for any other command. If
    you''ve been paying attention, you might have noticed that every time I run ls1s,
    it functions as ls1 -F, even when I use other options or arguments with the command.'
