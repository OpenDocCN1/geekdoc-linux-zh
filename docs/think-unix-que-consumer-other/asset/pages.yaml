  md: "180\n\nPart II Shell Concepts\n\nThe for itself is followed by a variable,\
    \ in this case foo, the word\nin, and a list of items.¹ In this case, the asterisk\
    \ expands to the list of files in the\ndirectory:This line could be expanded to\
    \ read for foo aqua-man batman\ngreen-lantern robin spider-man superman the wonder-woman\
    \ and it would\nhave the same effect.\n\nThe commands listed between the do and\
    \ done are executed, once for each of the\nterms in the statement. In this case,\
    \ the variable foo is set to one of those\nfilenames in turn and the block of\
    \ statements executed. Because wildcards expand\nin alphabetical order, it is\
    \ that the shell foo-aqua-man, runs through the\nblock of code, then sets foo-batman,\
    \ runs through the code of again, and so\non.\n\nCombined with sed and back quotes,\
    \ for loops are good for renaming files.\nLet's want to replace the hyphens in\
    \ all files with underscores:\n\n```\n[on]@frogbug superheroes]$ for foo in *\n\
    > do\n  mv foo echo $foo|sed 's/-/__/g'\n> done\n```\n\n```\nmv: 'batman' and\
    \ 'batman' are the same file\nmv: 'batman.retired' and 'batman.retired' are the\
    \ same file\nmv: 'robin' and 'robin' are the same file\nmv: 'robin.retired' and\
    \ 'robin.retired' are the same file\nmv: 'superman' and 'superman' are the same\
    \ file\nmv: 'superman.retired' and 'superman.retired' are the same file\n```\n\
    \n```\n[on]@frogbug superheroes]$ ls\naqua_man robin the_tick\naqua_man.retired\
    \ robin.retired the_tick.retired\nbatman spider-man wonder_woman\nbatman.retired\
    \ spider-man.retired wonder_woman.retired\ngreen_lantern superman\ngreen_lantern.retired\
    \ superman.retired\n```\n\nLet's take apart the line in for loop that executes\
    \ each file in the\ndirectory: mv $foo echo $foo|sed 's/-/_/g'.\n\nIn each iteration\
    \ of the loop, foo is set to the name of a file in the directory.\nThat file is\
    \ renamed using mv. The source filename is the contents\nof foo, and the destination\
    \ filename is the output of the command echo $foo|sed\ns/-/_/g'. That command\
    \ feeds the name of the file into a program that\nlies the regular expression\
    \ s/-/_/g, which replaces every occurrence (global)\nof the character - with _\n\
    \nfoo is one of the classic metasyactic variables in Unix choice. That is, whenever\
    \ one needs to\\use an arbitrary variable, foo is often used as a placeholder.\
