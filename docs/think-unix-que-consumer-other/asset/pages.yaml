  md: '# Unics Concepts


    I''ve always been of the opinion that it''s more important to be able to figure
    things out as you go along than to know a whole bunch of things when you begin.
    As much, the most important thing you can learn is how to learn. This chapter
    is about Unix documentation, and how you can teach yourself.


    Man pages (an abbreviation of “manual pages”) are, more or less, the standard
    documentation on Unix systems. They were the first of online documentation on
    Unix and are still the most common type. Newer formats, such as GNU Info and Web
    pages, are becoming more important, but even these formats tend to share several
    conventions with classic man pages.


    A few words of warning are in order.


    # Words of Warning


    Man pages were originally written by Unix developers for Unix developers, and
    they still need to be written by programmers, which implies that they''re written
    for programmers as well. (How many programmers do you know who can speak to normal
    people? That''s pretty close to the number of programmers who can write for normal
    people as well.) Furthermore, writing documentation is a boring, time-consuming
    process (and much less fun at least if you''re a programmer), the documentation
    often comes...if it comes at all.


    As a result, a fair number of man pages are in various stages of undocument. Some
    programs have man pages that are too cryptic for the average user. More programs
    have man pages that are out of date. Other man pages are simply incorrect, and
    a shocking number of third-party software often comes with its own documentation
    (man pages or otherwise) is wildly nonstandard—if the software''s author bothers
    with documentation at all.


    That said, you need to learn how to read man pages. Poor documentation is still
    the best place to start when it''s the only game in town. Although you can get
    for a while without learning this stuff, by doing so you''re asking for trouble.
    Or at least you''re asking your Unix guru more than he''ll be happy answering.
    The most frequent guru response to many user questions is RTFM: Read The “Fine”
    Manual.(Well, most gurus mentally substitute a different word for fine, but you
    get the idea.)


    # Reading Man Pages


    To understand man pages, you have to see them first. The first command you must
    learn is man, which is the standard tool used to read man pages. There are other,
    perhaps better tools, but man is still the most important. In its simplest form,
    you can display a man page by typing man ManPageIWantToRead at your prompt.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Unix Documentation Chapter 1


    Perhaps the second most important command to learn is logout, if you don''t sign
    off of the system when you are finished, anybody else can read your files and
    send mail as you.This is a common problem on multiuser machines, especially at
    shared workstations or in computer labs at universities. Often, malicious people
    will send embarrassing or insulting mail from a machine where the legitimate user
    has forgotten to log out. This, obviously, won''t you, so pretend you logged into
    a Unix box and typed the command your guru told you: man logout. Something like
    the following might come up on your screen:


    ```

    LOGOUT(1) Unix Users Guide

    ```


    NAME

    logout - exit from a login shell


    SYNOPSIS

    logout


    DESCRIPTION

    Terminates the current login shell and ends the associated session.


    SEE ALSO

    login(1)


    The first thing to notice about this man page is its header. You should note that
    it includes the name of the program, a number in parentheses after (man section),
    and the name of the notional manual that "contains" the page. (Of course, man
    pages aren''t real pages in a real book, so in no manual physically contains the
    page.)


    Below this, you should notice that the man page is divided into several elements.
    Some of these segments, such as the name, the synopsis, and the description, should
    be present in every man page. Others, as *see also* might not be present on a
    given page.


    The name segment contains not only the name of the command, as one would assume,
    but also a very brief description of the purpose of the command. This is because
    the name is easily searchable, as you''ll see. The description provided here might
    not be helpful to beginners (or at all!), but any search capabilities are better
    than none.


    > 1. Actually, I was rather disturbed to find that the Linux man page for *logout*
    is totally useless for normal people and that doesn''t have even a man page for
    this. Of course, there''s a perfectly logical technical reason, but it''s not
    a bad idea. Shame on all developers. The man page you actually see for *logout*
    is based on the Solaris man and my own knowledge of the system. Actually, most
    of the pages you''ll see in this chapter are composed of several man pages, stripped-down
    pages used to illustrate a point, or both. Look at the real pages on your system
    to see the full functionality.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Part I Unix Concepts


    Although it''s not obvious in this case, the synopsis is the most critical portion
    of the man page: It shows all the modifiers that can be applied to the command.
    In the case of logout, there are no modifiers:The only thing you can do is type
    logout. The synopsis has a special, well-defined syntax that I will examine more
    closely.


    The description might or not be useful. Remember these pages were written by programmers,
    who generally can''t remember what it was to be a novice when they try. In this
    case, between the name of the command and both the short and long descriptions,
    it should be possible to puzzle out the command does


    The name, synopsis, and description are present on nearly every man page. Other
    common parts include a file portion, which lists files used or refenced by the
    command, and an author field, which lists the names and the email addresses of
    the responsible parties. Sometimes there will a bugs section, which lists problems
    with the command. Occasionally there will be a history, which might explain why
    things were done the way they were done or perhaps describe how this command is
    different from the older version of the command.


    The man page also contains a see section, which points out the page for login.
