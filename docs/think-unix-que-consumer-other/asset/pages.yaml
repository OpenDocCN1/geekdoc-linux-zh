  md: '# Unix Concepts


    That would certainly provide a quick idea of what the `passwd` command does. Note
    that whatis searches all manual sections unless otherwise specified.


    One final way for you to search man pages is man -K (That''s a capital K, not
    a lowercase k) -K searches not only the short description, but the entire text
    of every page you find on your system. This can take a very long time, especially
    on systems with many pages or slow disks, but sometimes it''s the only way to
    find the information you''re searching for.


    If you choose to use the xman command to view man pages in your XWindow System,
    you can read the documentation in nice, proportional font. It has a search feature
    that enables you to search the current page or via apropos, not via man, and you
    might have multiple pages displayed at once. Unfortunately, one very feature that
    is missing in xman is the capability to click through to another page in the See
    Also portion of the man or to click any of the pages returned by an apropos search.
    Nevertheless, proficient Unix users can thoroughly customize xman, and it might
    be worth a look.


    GNU Info is another common format for software documentation, especially for GNU
    project software. GNU Info is a hypertext system, essentially similar to the World
    Wide Web. Generally each has a central directory of all GNU pages on the system,
    and you can search your current page.


    The standard tool to read GNU Info documentation is info. It runs in a text console,
    so you can just type info from a terminal session to start it up. It has built-in
    help and a tutorial, so it should be relatively easy to navigate despite its somewhat
    less-intuitive navigation keystrokes. To see a specific node (that is the Info
    terminology equivalent to a man page or Web page), you can type info commandname.


    Of course, many people write large portions of their documentation in plain text,
    which has the advantage of being easy to write and simple to read without complex
    tools. The three most common ways to read ASCII text are cat, more, and less.
    Each of them can run simply with the command followed by the name of the file.


    cat is the simplest of the three: it simply output to the screen. This is for
    short files, but longer files might scroll off the screen or out of your backscroll
    buffer, if you have one page at a time, prompting you to press a key after each
    screen.


    +   The GNU project is a group of people who have cloned most of the standard
    Unix tools. GNU tools, and many administrators build the GNU tools on their systems
    in order to have standard-tools available everywhere. (Other administrators claim
    that GNU tools are inferior to native tools and refuse to build this. This is
    an essentially religious conflict, sort of like Mac versus Windows. Unix is full
    of religious conflicts; that''s part of being a deep system with a culture that
    has accreted around it.)


    +   9. Less-intuitive for me, at least.'
