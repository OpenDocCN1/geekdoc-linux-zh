  md: '# Shell Concepts


    HISTSIZE controls how many commands are stored in your command history. If you
    set HISTSIZE=10, only 10 commands will be stored in your history before rotating
    out. That means that, with variety of command-line editing, you can only look
    at a small handful of commands. If instead you type HISTSIZE=5000, that provides
    a fairly substantial list of previously run commands for you to work with. It
    also means that you might spend well time looking for the right command.

