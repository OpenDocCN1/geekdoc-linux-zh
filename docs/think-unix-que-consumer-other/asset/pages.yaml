- img_proc: true
  md: 'Message-Id: <20000151900.AA05093@razorback.localdomain>

    From: The King <elvis@frogbog.localdomain>

    To: Jon <jon@razorback.localdomain>

    Subject:

    Status: 0


    I''ve noticed you''ve not been reading your mail lately; is everything okay?


    RETR is short for *retrieve*. Note again that the message is terminated with a
    single period that we the server''s finished. There are more mail headers than
    you''re probably used to seeing: Many clients hide the lines they you''re not
    interested in. We''re going to talk about some mail problems, because they''re
    often useful when debugging mail problems. (You didn''t think we''re teaching
    you how to talk directly to servers just because it''s fun, did you?)


    The Return-Path header''s purpose is simple: If the message doesn''t get through,
    who gets the bounce message? This is generally set by the sender''s MTA, although
    many mailing lists change it so the list administrator gets bounces, not the sender
    of to the mailing list. In this case, Elvis sent it, and he would have received
    the error message if it hadn''t gotten through.


    The *Received* header is one of the most important: It''s a log of every system
    the message has gone through on its way to its destination. Each intermediate
    MTA adds a single *Received* header on a per-message basis, newer headers above
    older ones. These headers are sometimes interspersed with *Delivered*-To headers
    indicating that the receiving mail did something with that message. Think of these
    headers like the provenance of a piece of art or a chain of evidence:The goal
    is to have a complete list of intermediate processing of the message. (We''ll
    talk more about this in a minute.) In this case, the message from one system (*frog*)
    to the target system (*razorback*) is a mult header; continuation lines are distinguished
    by indentation. This header also indicates the time of receipt.


    The last header is the *Message-Id*. This is theoretically unique on a per-message
    basis. That is, if you receive the same message from multiple sources, as different
    mailing lists, each of these messages would possess the same *Message-Id*, and
    you could filter out duplicate copies, but no other message should have the same
    number. This is, unfortunately, not always the case in practice, and thus most
    people don''t discard messages with duplicate IDs.


    Deleting the message, now that we''re through with it, is simple and straightforward:


    ```

    DELE 1

    +OK Message deleted

    ```


    Whether this message is immediately deleted or whether deletion is reserved for
    the termination of your connection depends on what server is being used. Never
    delete the message until you''re certain you no longer want it.'
