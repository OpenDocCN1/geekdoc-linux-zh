    Sometimes you don''t want the shell to take everything literally. Sometimes you
    want to print the contents of a variable in the middle of an argument or to embed
    the output of a back-quoted command within a string. For these tasks, double quotes
    are the right tool for the job. Double quotes disable wildcard substitution but
    leave history substitution, variable substitution, quote substitution, and backslash
    escaping intact. Double quotes turn everything between them into a single element,
    disabling only a few crucial effects.


    Of course, it is easy to say that, but it is hard to see what it means in a practical
    sense. One way to think about it is to consider double quotes "weak quoting,"
    while "strong quoting": Single quotes make everything literal, while double quotes
    make only things literal (In this scheme of things, backslashes make only one
    thing—the next character—literal, and back quotes make something else entirely).
    Perhaps it''s best to see some examples of what quotes do:


    ```

    [jon]$ echo *

    arc bin Desktop docs gfx GNUstep include Lib Mail main mediabits

    News newsmail provide public_html queue scripts src thinkunix tmp

    visor rootenv.0

    [onfrogbog] jon$ echo ''*''

    *

    ```'
