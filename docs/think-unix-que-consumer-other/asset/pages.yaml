  md: 'You might have noticed that all the numeric addresses you''ve seen have four
    numbers separated by periods. Furthermore, if you''ve looked at a list of these
    addresses, you might have noticed that each of those numbers is between 0 and
    255—precisely one byte. The form of four-byte addresses with dots between each
    byte is now known as *dotted notation*, for more-or-less obvious reasons. That
    makes an Internet address 32 bits long, which makes a maximum possible number
    of hosts on the Internet 4,294,967,296.


    A fair number of these addresses are reserved for special features or private
    networks connected to the Internet whose machines are never directly accessed
    over the Internet. This reduces the number of available addresses around 20 million.
    Even with the huge number of hosts on the Internet, it seems that we might be
    running short (this point is still under debate, and more strategies are to use
    the reduced number of IP addresses in use). To solve this and other problems,
    version of IP (also known as IPv6) is being worked on. It will have a 64-bit address
    space so every computing device ever can be connected full-time to the network,
    and every other device ever can have a network computer built into it.


    The other part is the port number. Because we''re in a multitasking environment,
    it''s possible—almost certain in fact—that we''ll have to have more than one connection
    open at a given time. To handle this, the system needs a different ID for every
    connection. A system can have up to 65,536 ($2^{16}$, or 16 bits) different ports
    to which a network can attach.


    Some of these ports have special meanings: Port 25 is always used to receive email
    from other computers on the network, for example. All ports with numbers less
    than 1,024 ($2^{10}$) are reserved for special purposes. After an initial connection
    is made, the system does a little sleight of hand and moves connection to a different
    port, so that the well-known port (which can have only one connection at a time,
    to keep from getting confused) can stay open for other connections.


    # Practice Problems


    +   1. Find out the name of your system by running the command `hostname`. (If
    this command does not return the full Internet name of the machine, ask your local
    system administrator for the full name of the system.) Look up your system''s
    IP address with `nslookup`.


    +   6. If you''re wondering what happened to version five, it was used for experimental
    purposes.

    7. To find out how many hosts are allowed on the IPv6 Internet, simply take 2
    to the 64th power. $2^N$ is always equal to the maximum possible value of an N-bit
    number because each has two states, 0 or 1. Each of these states can be independent
    of all other bits, so to find the maximum number of combinations you simply multiply
    2 over to the number of bits. If you did any work with probabilities in middle-school
    math, this will probably make sense if you spend some time to draw it out on paper.'
