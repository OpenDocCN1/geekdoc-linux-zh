  md: '# TCP


    TCP, which is short for Transmission Control Protocol, does just about everything
    IP does not: It makes sure that one of each packet arrives, in order. It also
    runs a checksum of the packet to ensure that it wasn''t accidentally mangled on
    way. Because of the Internet, TCP implements the resending of garbled or missing
    packets and generally includes a bunch of complicated algorithms to try and ensure
    the best service. Most Internet services are built upon TCP, including the World
    Wide Web and most email transfer protocols.


    # ICMP


    ICMP, an acronym for Internet Control Message Protocol, is a simple protocol used
    for messages between machines regarding the performance and functionality of the
    network. We''ve already been exposed to the most common uses of ICMP, which are
    ping and traceroutes. These packets are used to monitor and adjust network performance.
    For security reasons, many sites block ICMP traffic.


    # UDP


    The User Data Protocol, better known as UDP, is a like raw IP: It doesn''t check
    to make sure that the packets arrive, however many arrived, or in order. What
    it does that raw IP doesn''t checksum to verify the integrity of the data. Why
    do we use UDP? because programmers like reinventing the wheel and that they can
    do better than TCP Soon they discover that the network isn''t as reliable as they
    think or the control algorithms are complicated to get what they realized. At
    this point, they either redevelop most of the important properties of TCP within
    their own protocol, or simply switch to TCP.


    UDP really has a number of uses, the most popular of which are broadcast protocols
    to transmit sound or video over the network. Often, the loss of a single packet
    from this stream is just a little bit of noise but far from crucial, and because
    speed is important for these applications they can reduce overhead without worrying
    too much about this stuff. Mostly, however, UDP is there so that programmers complain
    about not being permitted to reinvent the wheel.


    # Sockets, Addresses, and Ports


    Some of you might have noticed I slipped the term socket into my description of
    the IP protocol without describing exactly what a socket is. A socket is a representation
    of one endpoint of an IP connection, arrived at simply by the combination of the
    numeric address of the machine with the number of the port being accessed on that
    machine.'
