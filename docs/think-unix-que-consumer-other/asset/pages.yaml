    # Fonts


    The situation in X is even more complicated than the color situation. Many font
    formats are available, and X supports quite few of them. Much of this support
    is on the administrator''s side of things, so we won''t cover what it is here,
    how to find the fonts available on your system, and how best to access particular
    fonts.


    X makes working with fonts difficult because the available fonts must be installed
    on the server, not on the client:they must reside on the machine displaying the
    text than the machine that is running the given program. One of the solutions
    to this problem is to run a font server on the network, which may lead to no end
    of security problems, and the most common solution these days is install fonts
    everywhere, and often to run a font server on every machine. From a user perspective,
    this is usually transparent. However, fonts aren''t present where they should
    be.


    Another problem is that X distributions all seem to include different font sets.
    This causes no end of headaches when trying to run clients on a machine other
    than the server and while sharing X defaults among different systems.'
