  md: 'vi, Dotfiles, and Regular Expressions Chapter 5 109


    # # Surviving vi


    vi is a microcosm of the Unix world. Don''t expect to learn all of it at once;
    perhaps you shouldn''t expect to learn all of it at all. First learn just what
    you need to get by, and learn much as you need to do more. This chapter is written
    as though it were to be read straight through, all the material learned at once.
    That''s an artifact of what it means to be a book, not what it means to learn
    vi. Even now I use a small subset of vi''s features. I know only what I need,
    and vi knowledge grows slowly but surely as time goes on. To try and learn all
    of vi at once will only make you frustrated. Also, editors are ever learned in
    terms of finger habits. You''ll do well read this chapter at a terminal, thinking
    things as you go.


    Most editors and word processors you''ve probably used operate much the same way
    through: that is, a key combination works the same more-or-less everywhere and
    you can enter additional text. These editors are modeless. vi is a modal editor.2
    This means that it has different interfaces based on.


    There are three common modes in vi: input mode, wherein you can modify or enter
    text; command mode, wherein you can operate on blocks of text or the entire document;
    and ex mode, a special subset of command mode in which you can do other sorts
    of editing. Practically speaking, however, you can treat ex mode part of command
    mode. Also, there are different input modes (append, replace, and insert), which
    can be treated more-or-less identically to.


    That vi is a modal editor is part historical. The original Unix text editor was
    ed, which was enhanced and integrated into the more advanced vi. Both of these
    operated on a single line of a time. Eventually, Bill Joy and others at Berkeley
    wrote vi, a "visual interface" for the ex editor.


    Although difficult at, the division between writing and editing text implied by
    vi''s modes becomes second nature with moderate use. One way to think about it
    is to treat vi as though it was always in command mode and to treat entering text
    as a single long command.


    # # Through the Out Door


    The first thing you need to know about any program is to get started. You, readers,
    not for Dummies, can guess that you enter vi by simply typing vi and hitting Enter.
    You''ve already guessed that to edit a particular file, you can simply vi vi my-file.txt,
    so you don''t need to discuss how to start vi and can start with the much trickier
    issue of quitting vi.5


    +   2. As Emacs, in quite a different fashion.


    +   3. It might be worth noting most of the vi clones and enhanced versions also
    can be started by simply typing vi. To figure out what vi is started by command,
    you can use ls -i which vi is and whether it''s a symbolic link to some other
    editor. On your system this vi might point elsewhere on your system. It might
    also be that vi is a hard link to the same editor as ex, or or. When all else
    fail, check your documentation.


    * Newton'
