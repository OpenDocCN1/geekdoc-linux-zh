    # Unix-Like Window Managers


    Some window managers seem particularly “Unix-like” for one reason or another.
    Some are incredibly flexible, and some are incredibly sparse. We''re going to
    look so briefly at three of these window managers: Enlightenment, SawMill, and
    wmx, each of which has something noteworthy about it.


    # Enlightenment


    Enlightenment, also known simply as E, is particularly Unix-like in its infinite
    flexibility: Almost every single aspect of the window manager is subject to alteration.
    Almost every user can create themes that mimic just about every other window manager
    or operating system down to the littlest detail. How of it can be configured using
    a small GUI-based application, although writing themes is rather more work. Showing
