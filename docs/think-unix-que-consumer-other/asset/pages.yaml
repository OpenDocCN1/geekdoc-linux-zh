    # xrdb


    xrdb is the program used to interpret X resources. (Its name is short for X ResourceDataBase.)
    The normal use of xrdb is to specify a filename that contains a list of X resources.
    By default, all X resources are overwritten by the contents of that file. (If
    no filename is specified, the data is taken from STDIN.)


    The default is equivalent to the -load option. If the -override option is used
    instead, resources from the given file will replace extant resources. -merge is
    a little scary, in fact it does best to merge current resources with extant resources.
    To me it seems somewhat unpredictable, so I recommend sticking with -override
    instead. -remove will remove the resources listed in the file.


    # xrdb and cpp


    Earlier, you might have noticed that I had the following resource set:


    ```

    xterm*background: WAYDARKBLUE

    ```


    In fact, WAYDARKBLUE is not an actual color supported by X. (I''ll talk more about
    colors in the chapter, but for just take my word on this.) Because I want to use
    a nonstandard color as a background in many situations, I found the easiest way
    to set it was to put the following command near the top of my .xdefaults:


    ```

    #define WAYDARKBLUE #000033

    ```


    This line means that whenever xrdb encounters the word WAYDARKBLUE, it is replaced
    with #000033, which represents the particular color I like using. (Again, you''ll
    have to take my word on this for now.) This define statement is interpreted by
    the C Preprocessor (cpp). When xrdb loads X resources, it passes them through
    cpp unless to do otherwise.


    What''s the C Preprocessor? Put simply, it''s a simple language, like a shell
    programming but it allows you to define symbols and act upon those definitions.
    The preceding #define statement defined WAYDARKBLUE to be equal to the value #000033.
    cpp doesn''t care what value represents, nor does it care what the program eventually
    does with that information. It simply takes input, processes it according to a
    small number of rules, and produces output: It''s a filter.'
