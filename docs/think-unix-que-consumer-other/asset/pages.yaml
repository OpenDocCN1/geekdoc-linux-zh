  md: 'Marketing doctrine has enriched the concept of the “killer app,” the idea that
    huge quantities of hardware are purchased so that a particular software application
    can run well. In the PC platform, marketers cite particular examples such as the
    spreadsheets Lotus 1-2-3 and Microsoft Excel, and several database and word-processing
    packages that they feel, “moved” hardware.


    If the concept killer app is valid, the ultimate killer app—the one that sells
    computing devices to those who do not already possess them—is networking. Although
    untold millions of consumer-grade hardware devices connect to the Internet have
    been largely designed and implemented on Unix. Today, the Unix community seems
    firmly in control of the IETF, the Internet Engineering Task Force, an ad-hoc
    group of engineers responsible for the ongoing design and development of the network.


    Because Unix and the Internet were designed in parallel, Unix gets most of the
    good stuff: The World Wide Web was designed on Unix, and most popular Web browsers
    started out on Unix before being ported to Windows and Macintosh.¹ Also as a result
    of Unix heritage, the Internet is quite flexible, and most of the higher-level
    protocols are human-readable. This is great because it means you are going to
    learn how things *really* work.


    # A Broad Overview of Networking


    Of course, to look at that higher-level stuff first we need to understand a little
    bit about the lower-level design of the Internet. This isn''t going to be very
    in-depth, so professional network engineers and techies who know about the bit-level
    design of the Internet skip to the next section.


    # Name Lookup


    We’re not going to start at the absolute bottom of networking, but a little bit
    closer to home: hostnames. Every time you send a bit of email or look at a Web
    site, you must tell the system name of the machine you want. Like usernames and
    group names, however, computers prefer working with numbers. Every hostname gets
    converted to a number before a computer can talk with it.


    Aside from working more efficiently, there are several advantages to using names
    that get converted to numbers. First, one machine can respond to multiple names
    so that it can provide different services depending on what it’s called. Second,
    you can change the machine name while leaving the old system entirely in place;
    that is, the name can correspond to an abstract idea of a computer rather than
    a physical computer. This leads into the third advantage,


    > ¹ Microsoft’s Internet Explorer started out as a licensed version of Mosaic,
    the same Web browser from which Netscape was developed.'
