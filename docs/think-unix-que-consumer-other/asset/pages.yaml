  md: '# Introduction


    # About This Book


    So you are here, standing in the bookstore, flipping through this book, trying
    to decide whether Think Unix is for you. Fortunately, you decided to read this
    part of the book, so I can answer your question directly.


    # Is This Book For You?


    First of all, this book is intended for people with some computer experience.
    If you''ve never used a PC or Macintosh, there are probably better places for
    you to start this book. I don''t start at the beginning. I assume you have an
    idea of what a file is; what a folder or subdirectory is; where to find the keyboard,
    monitor, and how to turn your computer on. Furthermore, this book is written for
    people who aren''t death afraid of trying new things and for people who occasionally
    make educated guesses about how the whole darn thing works.


    This isn''t the kind of book that tells you to enter your username at the login:
    prompt and your password at the password: prompt. (If you don''t know this now,
    I''m telling you now: Enter your username at the login: prompt and your password
    at the password: prompt.)'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'On the other hand, this book is written for people who have never used Unix.
    Experienced users might learn something but should probably look elsewhere.This
    book has no information about systems administration, for example, though I hope
    it provides a good foundation for such knowledge.


    This book is written for people who read closely.This is a short book, and I don''t
    waste space. The examples are chock-full of useful information, even if it might
    not directly relevant. For example, in the first chapter I discuss reading documentation,
    I use the page for logout.That''s the only place logout is discussed. If you skip
    the examples, you might not know how to log out of your system!


    Because it''s a short book, I''ve had to cut things out.There''s very little discussion
    of the "Unix culture.\(Yes, there is such a thing, and what it made the Internet
    great.)I will mention it in passing, however, when it actually affects the system
    works. Furthermore, I don''t cover applications: I don''t discuss readers, Web
    browsers, spreadsheets, or word processors. What I say does have a bearing on
    how these programs operate on Unix, or at least how they should operate.(Many
    of these products clearly displace their PC or Macintosh heritage, and don''t
    act as Unix programs ought to.


    Another feature of this book is that full of practice problems. Although nothing
    can substitute for actual hands-on experience, practice problems give you a way
    to judge your understanding of a topic and to decide whether you need to reread
    the section or even ask a friend for help. I recommend that, if you know a Unix
    guru already, you bribe her with large quantities of chocolate, tea, cheese, or
    her favorite alcohol beverage. Many Unix people are microbrew fanatics.(Disclaimer:
    I''m a professional Unix guru, and I like both chocolate and good beer, so I might
    be a bit biased by this point.


    Finally, if you don''t have a sense of humor, this book might not be for you.
    If you don''t crack a smile once during this section, we might not get along.\(You
    don''t have to find every joke funny, of course, but the others in this book fall
    along these general lines.)I use command and filenames, sometimes to make a point
    but also to keep it interesting for myself.


    # This Book''s Approach


    Unix is distinguished from operating systems as Windows and Mac OS in that it
    is "deep": by the surface user interface lies a wealth of functionality and power
    rival by few other systems. The price of this richness is that there''s a lot
    to learn.


    Because of this depth, this book''s approach to Unix is a high-level view. Many
    computer books, especially ones about Unix, take what I consider to'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'be a “phrasebook” approach. That is, they go about teaching a large number
    of individual commands, often with a somewhat useful classification scheme—for
    example, “commands dealing with directories” or “commands dealing with files.”

    It’s as though these books were tourists’ phrasebooks, helping foreigners journey
    through a place they can’t even hope to understand.


    By contrast, this approach is more like that of a foreign-language textbook: Rather
    than concentrating on prepackaged statements, you will learn to think and speak
    Unix. By that, I mean that you will learn to solve the problems that Unix was
    designed to do things, rather than just muddling through. You will learn the logical
    structure of the operating system—its grammar, if you will. My goal isn’t simply
    to get comfortable with navigating the Unix command, but also to let you feel
    home while learning new commands not discussed in this book and, most importantly,
    combining multiple commands to achieve particular goals.


    In that vein, the first chapter of Think Unix is dedicated to Unix documentation.
    Learning to look up the answers is necessary if you want to become a proficient
    user of the operating system. Because of this attention, Think Unix doesn’t burden
    you with an appendix describing several hundred Unix commands. Instead, you will
    learn to look to the system itself for information.


    Because Unix is a deep system, it is possible to learn a bit at a time. Usually,
    what you don’t know interferes with what you’re doing. Learn enough to navigate
    comfortably, and return later to learn more. I’ve been using this book, which
    covered things about Unix I didn’t know, and I’ve been using Unix professionally
    for six years.


    There are disadvantages to this approach of learning Unix. Foremost among them
    is the absence of necessary knowledge at any given point in the learning process.
    This is the result of any linear approach to learning a complex system: It’s rarely
    possible to start from nothing and proceed only on what is learned, especially
    if the practical is discussed before all of the theoretical learning is finished.
    Of course, nobody wants to plow 200 pages of theory before learning anything useful,
    without understanding everything. You may wish to mark these sections and return
    to them later, or you might simply wish to give the book one reading if you’ve
    never used Unix before. Any well-written book should reward multiple readings.


    # Reference Platform


    The reference platform—that is, the type of machine on which the examples are
    tested and from which their output is displayed—is a Linux machine with GNU tools.
    When referencing the Korn Shell I use pdksh, and for the C Shell I use tc. In
    short, I use my home machine: a Red Hat Linux 6.1 box with Bash 1.14 as the'
