    The most advanced (and hence the most complicated) plaintext reader available
    on most systems is less. It lets you scroll forward and backward in your text
    file, and even has all sorts of search capabilities built in. The spacebar progresses
    through the document page-by-page, whereas the b keys progress through the document
    in reverse. (On some systems, the PageUp and PageDown keys have been mapped to
    the same function.) To just less, use the letter q. The h brings up a menu listing
    all the keys, and the man page is fairly complete if you''re interested in using
    some of the advanced features of.


    Where are these text files you want to read? Scattered in directories throughout
    the system, no doubt. Often, programs downloaded from the Internet README files
    or other text documentation along with the program. Administrators leave these
    files in the directory where they were put, often /usr/doc, /usr/, /usr/local/,
    or /usr/local/src. Many Linux systems provide the documentation for individual
    programs in /usr/doc/; each has a subdirectory named by package and version number,
