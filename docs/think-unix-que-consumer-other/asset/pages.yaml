- img_proc: true
  md: '# Glossary and References Appendix B


    contain tons of features to simplify your life, or improve it, at any rate. At
    least, that’s what their authors tell us.


    One can “shell out” to a command line from various applications. This simply means
    that the program executes a shell and gives the user access to the system. This
    is not often more useful than suspending the program, but sometimes we have no
    choice. See also, bash, es, ksh, tsh, zsh


    source code The program as the programmer writes it. The source code is the most
    human-readable version of what is compiled the compiler into a binary. Source
    code contains more information about the programmer’s thought process and is much
    more useful than having binaries when debugging somebody’s program. Having the
    source code gives you technical opportunity to fix bugs, make improvements, and
    port code to different platforms. See also binary, compile


    spool A file that receives some data for later use. The file that contains your
    email is your mail spool, the file that contains a list of things to send to the
    printer is your print spool, and so on.


    ssh The most popular way to protect your password and other private information
    when logging on to a remote host. Please read my footnote (#11) in Chapter 4 before
    using ssh, but please do not telnet or login to other systems.


    sysadmin See system administrator


    system administrator The person who maintains and manages a computer or group
    of computers. It’s a tough job, and I get to do it. The system administrator creates
    and manages accounts, allocates system resources, and makes sure it’s all running
    smoothly. Nobody notices a system administrator who is doing a good job, and everyone
    notices the system administrator when there’s a problem. As a result, many system
    administrators have taken an interest in tea, coffee, chocolate, or beer.


    If some reason this sounds interesting to you, read one on the topic is available
    at http://www.adminspotting.org/. If even this does not dissuade you, there are
    three books on the subject worth reading:


    Car, M., et al.


    Linux System Administration


    New Riders. 1999.


    Frisch, Aele.


    Essential System Administration, 2nd Edition


    O’Reilly & Associates. 1995.'
