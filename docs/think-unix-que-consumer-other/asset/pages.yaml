  md: '# Part II Shell Concepts


    The fundamental fact of computer operation is the manipulation of symbols. In
    fact, besides working with literal numbers, symbolic manipulation is all that
    computers are capable of doing. Word processors do nothing but rearrange numbers
    (which represent letters) and other numbers (representing font size, style, and
    margins) that are connected to each other. As the writer of code, you are also
    manipulating symbols—words, ideas, and representations of places and people—albeit
    at a higher level than that which the computer works. When the computer program
    attempts to work with those level symbols, that''s where it makes the most mistakes.
    Spell checkers, notoriously, accept any correctly spelled word rather than the
    correct word, and grammar checkers are error because the level at which they function
    is so much higher than spell checkers.


    Up to this point, I have discussed relatively low-level concepts: files, processes,
    pockets, and lots of data. Now, we''re stepping up into the realm of higher-level
    symbolic manipulation. If you enjoyed discussing shell history manipulation and
    regular expressions, that''s great, because that''s where we''re headed. Writing
    regex can be thought of as a specialized form of computer programming, and the
    remainder of Part II in Unix can be thought of as an introduction to shell scripts,
    computer programs in the syntax of whatever shell you''re using.


    Don''t let the thought of programming a computer scare you away, even if you''ve
    never done it before. In fact, you already have if you did the regular expression
    practice problems or wrote any complicated vk key mappings. Although some of the
    things I do in the next couple of chapters might be rather over-the-top, each
    one of them can be broken down into smaller pieces and digested.


    This chapter is about two of those smaller pieces: variables and quoting, for
    those who didn''t glance at the title before proceeding onward. Variables are
    symbols that represent other symbols, and quoting is simply a way to tell the
    shell what you mean literally and what you mean.


    # Variables


    If you''re new to variables, you''re not. All the way back in Chapter 1 I wrote
    "you can display a page by typing man ManPageWantToRead." In that case, you didn''t
    actually type the word ManPageWantToRead, you replaced that with the name of the
    page you actually wanted to read. You replaced one symbol with another. In computing,
    a symbol stands for something other than itself called a variable. It''s like
    the X in algebra that stands for an unknown quantity.


    In practical terms, a user will use a variable to a given value and then recall
    that later. You may use arbitrary variables in your shell for whatever purpose
    you desire, but there are also special variables that the system uses for particular
    purposes, I will use some of these special variables to discuss variables more
    generally before returning to arbitrary variables.'
