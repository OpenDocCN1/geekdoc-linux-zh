- img_proc: true
  md: '# Files and Processes Chapter 2


    Devices come in two major flavors, character devices and block devices. In a long
    list of the /dev directory, character devices have a c as the first character
    of the permissions, whereas block devices have (not surprisingly) a b in that
    field.


    Block devices are intended to be read in blocks: a group of bytes all at once.
    The number of bytes read at a time is the block size. Many devices have a block
    size of 512 bytes, though disks can have a significantly larger block size (4,096
    bytes or even more). Block devices are most often used for less interactive devices.
    You generally not notice that the system holds on until writing to disk, an operation
    known as buffering. If you flush a block device, to force the system to write
    out data at that moment, it generally passes the data with blank characters up
    the end of the block.


    Character devices, by contrast, are those meant to be read as a single character
    at a time. Devices that are more interactive and require the appearance of better
    performance or devices that cannot guarantee data in a timely fashion are generally
    character devices. Typical examples are mice, because you certainly wouldn''t
    want to wait for a certain amount of movement before the system became aware of
    it, and keyboards, because you want to receive and transmit data as you and not
    wait for 512-byte chunks. Some character devices aren''t really devices because
    they don''t refer to a piece of hardware. (They''re not local, physical devices
    attached to the system). Instead, they refer to imaginary places. The most common
    device is /dev/null, which is a “bucket,” a place you can send data to be discarded.
    /dev/zero is an endless supply of zeros that can be read by Programs produce unpredictable
    data. Neither of these is very important right now, though we will talk a little
    more about /dev/null in the next chapter.


    Two kinds of "devices" aren''t really devices: Named pipes, represented in ls
    -1 by a p, and FIFOs, represented by an s, are sometimes present, usually in the
    /dev directory. Programs on the system use these devices to exchange information.
    Mostly you should know they''re present and leave them to the system administrator.


    # Filesystems


    Unlike Unix sees all of the system as part of a single directory tree


