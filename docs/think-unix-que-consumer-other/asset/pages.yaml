    The top line of the screen gives output similar to the uptime command, giving
    the current time, the amount of time since the computer started or rebooted, the
    number of users logged in at the moment, and three load averages.


    A load average is a simple measure of how much work the computer is doing. Although
    we generally think of Unix as a multitasking system, in reality a given CPU can
    do only one thing at a time (Unix does handle multiple CPUs very well, but most
    systems tend to be single CPU) Each CPU can do only one thing at a time, there''s
    a list of programs waiting for CPU. The higher the number of processes over a
    given period of time, the higher the load average. A load average of one, on most
    systems, indicates the capacity of one processor. On a four-processor system,
    a load average of four would indicate capacity. In, CPU power isn''t the limiting
    factor for most applications, and a load of two to four times the number of processors
    is reasonable.


    The load averages uptime and top display are for one, five, and fifteen minutes.
    From these numbers, it''s clear that my system''s CPU is almost completely idle.
    The first line of top display confirms this.


    +   CPU states: 1.7% user, 2.3% system, 95.8% idle


    User time is being used by normal processes. The system time is used to write
    to disks, time managing low-level hardware details, and so on. These numbers,
    with the idle time, add up to 100%. The nice time can actually be given substantially
    lower priority by either the user or the system administrator. Processes run only
    when not used by other programs.


