    Let us start and stop some useless jobs and see how it all works:


    ```

    [ jon@frogbug thinkunix $ cat

    Control-Z

    [1]+ Stopped cat

    [ jon@frogbug thinkunix $ pr

    Control-Z

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ jobs

    [1]+ Stopped cat

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ fg

    Control-Z

    [2]+ Stopped pr

    ```


    After starting cat, which sits waiting for input from STDIN, we suspend it and
    start pr, which also waits for input when we suspend it with Control-Z. We run
    the shell builtin command, which shows that we have two jobs stopped. The most
    recent job is marked with a plus sign, the job before that is unmarked. We continue
    the recent job in the foreground—that is, the process with which we are currently
    interacting—by typing fg, and then we suspend it again that we can play a little
    more by job control.


    ```

    [ jon@frogbug thinkunix $ bg %1

    [1]- cat &

    [ jon@frogbug thinkunix $ Enter cat

    [1]+ Stopped (tty input)

    ```


    We can act on a job other than the last by specifying it with a percent sign and
    the job number. Here, we send the first job into the background so that it can
    continue to run while we interact with other programs. When returned to the prompt,
    we hit Enter and see, despite our opinion, cat stopped itself again, so (the system
    reports) it''s waiting for input from the terminal.


    ```

    [ jon@frogbug thinkunix $ fg cat

    Control-C

    ```


    Because there''s nothing we really want to do with cat anyway, we hit Control-C
    to kill it. Here we hit pr to:


    ```

    [ jon@frogbug thinkunix $ kill %2

    Enter

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ Enter

    [2]+ Terminated pr

    [ jon@frogbug thinkunix $

    ```'
