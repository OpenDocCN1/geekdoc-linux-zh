  md: 'hexadecimal Base–sixteen digit is equal to precisely four bits. Hexadecimal
    used to

    because one hexadecimal digit is equal to four bits. compete with octal for popularity,
    and very definitely won that contest. See also

    bit, octal


    **ksh** The Korn Shell is the official AT&T follow-up to the original Bourne

    diffs from bash in several ways, but these two shells compete on essentially

    equal footing. Some people prefer one, some people prefer the other, and many

    contemporary systems have both. See also bash, sh


    **Linux** Begun by Linux Torvalds in the early 1990s, at the time of this writing

    there are more users of Linux than any other Linux flavor. Not technically Unix,

    a a thorough reimplementation of the standards that make up Unix, Linux is

    developed by a loosely knit of developers over the Internet. It is either free

    source, depending on your point of view, and competes in the

    descriptive arena with the many flavors of BSD. See also BSD, free software,


    **LISP** A popular language among certain computing types, the LISP (List

    Processor) is renowned for its elegance and purity. For most people, that

    makes it’s impractical and difficult, though its following is devoted. So devoted,
    in

    fact, Emacs and the SawMill window manager are almost entirely on

    ISP. The whole LISP culture that existed for decades was fanatic; many

    forced to switch to Unix when their LISP machines were decommissioned. They

    grumbled so much about it that a number of them got together and wrote a book:


    > Garffield, Simson L., et al.

    nThe Unix Hater’s Handbook


    The days, the book is outdated, but it always missed the point. This disagreement

    between LISP users and other Unix suggests that there may be more than

    one of elegance. But we win, so who gloat? Besides, their book is out of

    print. See also Emacs, SawMill


    **Lynx** A terminal-based web browser. Small, fast, fairly complete, and without

    distracting graphics. Lynx can be used when you dont have X running. Lynx’s

    Web site is at http://lynx.browser.org.


    **machine language** The ones and zeros that the computer actually executes, the

    final form of a computer program. Nobody writes machine code no more.

    The only people who ever were those guys flipping toggle switches at the console

    to enter programs.


    **Mutt** The premier mail reader for text-based terminals, Mutt is small, fast,
    and

    highly configurable. It takes some getting used to be his elim in everything

    name. Mutt’s Web site is at http://www.mutt.org.'
