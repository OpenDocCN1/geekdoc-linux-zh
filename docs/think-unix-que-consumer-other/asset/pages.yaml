    # A Short Treatise on Unix Genealogy


    Understanding the ps command, our next subject of investigation, you must know
    a little bit about Unix genealogy. Any operating system that runs on dozens if
    hundreds of different computers is liable to obtain a sort of local color in many
    of those places. Those regional differences are bound to influence the children
    of those itinerant parents.


    The great-grandfather of all Unix was the Bell Labs version of the software. Back
    in those days, Bell shared the source code with everyone. Source code is what
    programmers write before it gets into binaries by a compiler.


    Let''s go over this slowly. At the most basic level, a computer program is but
    a stream of ones and zeros, machine code. People don''t write machine code (although
    people used to, when there was no other way to program computers), but instead
    use other computer languages, which turn source code into machine code, or binaries.
    Source code is much easier to read than an endless stream of 1s and 0s.


    There''s an intermediate form known as assembly language. Each computer architecture
    has its own assembly language. Assembly language is usually made of short mnemonics,
    three or four letters long, which correspond directly to a single CPU instruction.
    Some of these mnemonics are followed by the data on which they operate. Most programmers
    know one sort of assembly language or another, but use it on a daily basis.


    Before Unix, every operating system was written in assembly language. At the time,
    most programmers could hand-tune assembly language better than the compilers,
    and with relatively simple machines, efficiency was paramount. In the early-mid-1970s,
    the Bell Labs people rewrote Unix in the C computer language, using assembly language
    only for small pieces of code that couldn''t be otherwise written or that needed
    an exceptional degree of optimization.


