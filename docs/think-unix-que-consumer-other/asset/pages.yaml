    [jon@frogbog jon$] cd tmp\n[jon@frogbog tmp$] mkdir testdirs\n[jon@frogbog tmp$]\
    \ cd testdirs\n[jon@frogbog testdirs$] ls\n[jon@frogbog testdirs$] rm for in 1\
    \ 2 3 4 5 6 7 8 9\n> do\n> mkdir test-$fee\n> done\n[jon@frogbog testdirs$] ls\n\
    test-1/ test-2/ test-3/ test-4/ test-5/ test-6/ test-7/ test-8/\ntest-9/\n[jon@frogbog\
    \ testdirs$] rm -rf test-[0-9]\n[jon@frogbog testdirs$] ls\n[jon@frogbog testdirs$\n\
    ```\n\nThat works great for a small number of items. If, however, I wanted 100\
    \ directories, it would be best to use a loop:\n\n```\n[jon@frogbog testdirs$]\
    \ DIRECTCOUNT=0\n[jon@frogbog testdirs$] while [ DIRECTCOUNT -ne 100 ]\n> do\n\
    > DIRECTCOUNT='expr DIRECTCOUNT + 1'\n> mkdir test-$DIRECTCOUNT\n> done\n```"
