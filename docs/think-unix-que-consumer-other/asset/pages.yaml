  md: 'Extensibility, network transparency, and the client/server model are all crucial
    to the success of X, but few users will be immediately aware of any of these design
    decisions. One design decision most users recognize right away "Mechanism, not
    policy.\ In short, X does not dictate appearance or functionality, only a method
    for getting stuff done. How everything looks and how everything works is for grabs.
    This has bounds and good points. First, the bad points. There is not a consistent
    look-and-feel across X in the same way that there is on the Macintosh and to a
    lesser extent on Windows machines. There'' isnt a consistent set of interface
    rules to follow or keys to achieve certain goals. There isn''t an entirely standard
    way to configure applications.


    The good part about mechanism, not policy is that even as application interfaces
    change, the underlying system need not break compatibility: the oldest Terminal
    can run newer software with whatever the new look is, although perhaps rather
    slowly. Furthermore, this strategy allows the system to evolve along ideas about
    human-computer interaction in a way that other operating systems do not.


    # The Root Window


    One piece of policy embedded in X is the idea of a window hierarchy:Windows are
    created and then owned by other windows. With server names and directories, the
    master window is the root window. The root window corresponds to the background
    of the screen. You can change some properties of the root window with thesetroot
    command: xsetroot -solid black sets the root window to a solid black background,
    for example.


    Window hierarchies are useful, as we''ll see in the next chapter, because they
    make it possible to operate on groups of windows simultaneously. Keep this thought
    in the back of your mind for the time being because it might help to subtly illuminate
    concepts.


    # Nuts and Bolts


    How does X mechanism from policy? First, the design of the X Window System enables
    programmers to use different widgets and toolkits to design their applications.
    Second, X enables the user to use any window manager to decorate the root window
    and all subordinates windows.


    # Widgets and Toolkits


    What''s a widget? In the noncomputer world, the term widget refers to any little
    mechanical device or can be used in place of an actual device in a hypothetical'
