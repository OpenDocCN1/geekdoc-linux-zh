  md: '# Glossary and References


    An entirely comprehensive glossary is impossible to create, and frankly not of
    much value. Instead, I have tried to list only computer terms not explained adequately
    in the text, terms used far in advance of their full explanation, and terms about
    which I have strong opinions or that have strong cultural reference in the Unix
    world. In other words, this is my chance to both enlighten and inflame, a collection
    of big ideas and petty disputes.


    Because a separate references section would need to be organized by topic, it
    seemed to make more sense to combine these sections. With glossaries, comprehensiveness
    of a references section is not indicative of its value. I have stuck to particularly
    useful sources on topics that need expansion and were not mentioned elsewhere
    in the text.'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'The most comprehensive, yet useful, glossary of terms used in Unix culture
    is the Jargon File, available online at http://www.tuxedo.org/-esr/jargon/html/,
    also available in book form


    Raymond, Eric S. (compiler)


    The New Hacker''s Dictionary, 3rd Edition


    MIT Press. 1996.


    Unfortunately, the World Wide Web is a whole more fluid than traditional print
    references. Any changes to these URLs I will know about for this book, available
    on my Web page at http://www.tux.org/-lasser/think-unix/errata.html, which should
    be a relatively permanent address.


    I hope that this section meets your needs.


    +   **admin** The System Administrator, of the fabled root account. See also system
    administrator, root


    +   **ASCII** Acronym for American Standard Code for Information Interchange,
    ASCII is the standard method for storing letters as numbers, due to the incapable
    of computers to work directly with letters. A useful ASCII chart is available
    online at http://www.asciitable.com/. If you want to ponder the deep structure
    of the arrangement of the ASCII code, convert all numbers to binary and look at
    the bit boundaries


    +   **awk** awk is a small programming language named after its three main instigators:
    Alfred V.Aho, Brian W. Kernighan, and Peter J. Weinberger. It is particularly
    well-suited to database-style manipulation tasks. The awk FAQ is available online
    at http://www.faqs.org/computer-lang/awk/faq/. The exhaustive manual written by
    the authors of the language


    Aho, Alfred V., et al.


    The Awk Programming Language


    Addison-Wesley Pub. Co. 1988


    The other popular guide to the language is


    Dougherty, Dale, et al.


    Sed & Awk, 2nd edition


    O''Reilly & Associates. 1997.


    See also sed'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Glossary and References Appendix B


    bar The second metasyntactic variable, after foo. See also foo


    bash The Bourne Again Shell is the GNU project''s enhanced version of the original
    Bourne Shell. The bash home page is at http://www.gnu.org/software/bash/bash.html.
    See also csh, GNU, sh, zsh


    beer The favored beverage of a sayadmin. Many sayadmins prefer porters, and various
    Belgian-style beers. My favorite beers, at this point in time, the various Belgian-style
    beers available at The Brewer''s Art, a Baltimore-area microbrewery and restaurant,
    La Maudite, a red ale brewed in Quebec in a style reminiscent of Belgian beers.


    binary The base-two numbering system, or anything dependent upon base-two numbering
    system. Virtually all digital computers are based on binary numbers and Boolean
    algebra. See also Boolean, decimal, hexadecimal, octal


    A computer program that has been translated into machine language. See also compile,
    machine language


    bit A digit in a base-two numbering system: a binary digit. Represented by either
    one or a zero, these states also correspond to true and false, respectively. See
    also byte, by, nyble, word


    block The smallest unit of a disk or a tape that can be written to, usually 512
    bytes.


    A section of a computer program that forms a logical unit, sharing conditions
    of execution. Execution distinguished by a common level of indentation, forming
    a visual block on the screen or page.


    Boolean A variable whose status is either true or false. Named after George Boole,
    eminent logician, who developed the mathematical system that is the basis of digital
    computers. One very simple introduction to Boolean logic is available at http://www.newsbank.com/whatsnew/boolean/.
    A more in-depth explanation is available in


    > Feynman, Richard P.


    > Feynman Lectures on Computation


    > Addison-Wesley Pub. Co. 1996.


    BSD The Berkeley Software Distribution, a major deviation from the Unix distribution
    made by Bell Labs. BSD contributed greatly to the development of Unix, and several
    free versions are available. The two most popular BSD flavors are probably FreeBSD,
    available at http://www.freebsd.org/, and OpenBSD, available at http://www.openbsd.org/.
    See also SysV'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Part IV Appendices


    byte Eight bits, also equal to two nibbles, a standard word size on early home
    computers. One byte is also equal to two hexadecimal digits. When octal was popular,
    some systems had nine-bit bytes, equal to three octal digits, but modern use refers
    exclusively to eight-bit values. See also, bit, nibble, hexadecimal.


    C. The standard language for most complex, large tasks, although a newer, object-oriented
    variation named C++ is as important as well. The Unix kernel is written entirely
    in C.


    compile To turn source code into a binary. See also binary, source code


    csh The Shell. Although it offered some advantages over then-current shells, programming
    in csh should be avoided at all costs. The CSH Programming Considered Harmful,”
    available at http://www.faqs.org/faqs/unix-faq/shell/csh-anynot.


    The way I see it, if you can''t program with it, why learn its whole syntax for
    interactive use?


    decimal Base-ten mathematics, what we use every day. Computers work with base-ten
    because it doesn''t break up into an integer number of bits. That is, X cannot
    precisely represent Y digits, and vice-versa, where X and Y are integers and the
    ratio X/Y is an integer that remains constant for given X and Y. See also binary,
    hexadecimal, octal


    delimiter A marker that separates two fields or records in a database. More data
    can be treated as databases that you think about. For example, the /etc/passwd
    file can be considered a database whose delimiter is a newline (each line is a
    record in the database) and whose field delimiter is a colon (each field is separated
    from the other fields by a colon). Knowing your delimiter is a prerequisite to
    effective use of cut or awk.


    elm is a seriously outdated mail reader for Unix. At some point, the development
    stopped working effectively. At any rate, it occupies a very narrow ground between
    the simple PINE mail reader and the more advanced Mutt. The Elm Web page is at
    http://www.myxa.com/elm.html. See also Mutt,


    Emacs The Other Editor. Thoroughly programmable in LISP, it gobbles up your system’s
    memory and takes over your life. Some people love it, however, so if you want
    to try it, you might want to try the built-in tutorial. If you are interested,
    you might want to look at


    Cameron, Debra, et al.


    Learning GNU Emacs, 2nd Edition


    O''Reilly & Associates. 1996.


    258'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Glossary and References Appendix B


    It''s worth noting that the ascendancy of Unix in the 1980s coincided with the
    fall into LISP machines and computers based entirely on that language. It''s my
    suspicion that Emacs was created so that those users could emulate LISP machines
    on father, less expensive and arguably elegant Unix machines. See also LISP, vi


    **Enlightenment** is a heavily customizable window manager. Although it''s rather
    heavy on memory usage and wastes bazillions of CPU cycles, most machines are powerful
    enough that some users will run it. It''s very pretty looking, and it can be very,
    very difficult to use if the theme designer chooses to make things tough. The
    Enlightenment home page is at http://www.enlightenment.org.


    **FAQ** Frequently Asked Questions. Most newsgroups and many informative sites
    maintain a list of frequently asked questions. It is considered to check this
    list to see whether your question is answered before sending mail to any person,
    list. A large, far from complete, set of FAQs is maintained at http://www.faqs.org.


    **foo** The first metasyntactic variable. When you want to discuss an arbitrary
    variable or if you need a placeholder for a variable, use foo. See also *bar*


    **free software** The “free” in “free software” does not refer to price, but to
    free-dom. (The standard explanation is “Free Speech, not Beer.”) Free software
    can be copied, modified, shared, sold, or broken by anyone. Most importantly,
    the source code is shared, not just binaries. Free software is distinguished from
    open source software by an ideological commitment that it is immoral to hoard
    code. The FSF and the GNU Project are the foremost exponents of free software.
    See also binary, source code, open source, FSF, GNU


    **FSF** The Free Software Foundation is committed to the principle of free software.
    They are the people behind the GNU project. Many people are fully committed to
    the ideals of free software, but many others are not, and they often deploy the
    tactics or goals of the FSF Some of these people believe in open software, and
    are committed to commercial software. The FSF Web site is at http://www.fsf.org/.
    See also free software, GNU, open source


    **FVWM** F Window Manager. Once the most popular window managers in the Linux
    world, this stalwart is still in use by the faithful. Its configuration file can
    be customized using the Preprocessor and other macro languages, making it extremely
    flexible. The FVWM Web site is at http://www.fwvm.org.


    **GNU**, a recursive acronym naming “GNU Not Unix” is an attempt to create an
    entirely free (in the sense of free software) distribution. Having completed a
    large portion of the work but not yet developed a kernel, Linux stepped in to
    complete the system. Partisans of the FSF refer to Linux as GNU/Linux, to indicate
    that many of the tools come from the GNU project; others claim the GNU is responsible
    for a lesser portion of the system than they claim. See also free software, FSF,
    Linux, open source'
  merge: -1
