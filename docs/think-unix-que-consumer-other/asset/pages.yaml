  md: '# Shell Configuration Variables


    In addition to PATH and MANPATH, the shell has other variables that provide configuration
    information. Chief among those variables that users should not alter (although
    in many cases the shell will let you do so) HOME, which holds as its value of
    your home directory. Whenever you want to refer to your home directory, you can
    use HOME instead. This has the same effect as using ~ to refer to your home directory,
    except that you cannot refer to another user''s directory. In fact, the original
    Bourne Shell does not permit you to use the tilde, so all Bourne scripts must
    use HOME to refer to the home directory of the user running the script.


    Another important variable should not be written to PWD, which contains the full
    pathname of the directory you are currently in. It produces the same output, as
    pair the command:


    ```

    [ jon@frogbog jon $ which pwd

    /bin/pwd

    [ jon@frogbog jon $ pwd

    /home/jon

    [ jon@frogbog jon $ echo HOME

    /home/jon

    [ jon@frogbog jon $ echo PWD

    /home/jon

    [ jon@frogbog jon $ cd tmp

    [ jon@frogbog tmp $ echo HOME

    /home/jon

    [ jon@frogbog tmp $ echo PWD

    /home/jon/tmp

    [ jon@frogbog jon $ cd cd

    [ jon@frogbog jon $ echo PWD

    /home/jon

    ```


    Although you can change the values of PWD and HOME in your shell, I don''t suggest
    going so on a regular basis. You might want to try it or twice to see how it works,
    but it''s not a good way to run your life—or computer.


    Some variables are meant to be changed to alter the behavior of your shell. Some
    trivial configuration options include MAILCHECK and HISTSIZE, and a more complicated
    (sometimes) pairs, PS1 and PS2.


    MAILCHECK is a number that represents how many seconds the shell should wait between
    checking to see whether you have received mail. If I set MAILCHECK=600, the shell
    will check for new mail in my mailbox every 600 seconds, those of us who don''t
    count in seconds might refer to 10 minutes. If you want the shell to look in a
    different place for your mail files, the MAILPATH variable is a colon-separated
    list of files in which the shell should look for new mail.'
