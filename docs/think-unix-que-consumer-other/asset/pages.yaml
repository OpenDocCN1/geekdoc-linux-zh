    a C compiler available for it. Alternatively, you could write your own C compiler
    and build Unix. Because this was easy to do, relatively speaking, lots of people
    did, and Unix began to take over the world...or like that.


    In the late 1970s, Unix moved to Berkeley and the VAX architecture. Once Unix,
    acquired a host of new features. These included advanced networking features,
    the vi editor, a better printing system, different syntax for commands, and so
    on. This Unix variant was called the Berkeley Distribution (BSD). With differentiation
    came incompatibility, and code had to be written for each BSD or System Unix,
    the Bell Labs (later AT&T version) became known.(SVR4, for System V Revision 4,
    is the current version). System Unix is often referred to as SYS V, or just SYSV.


    In the 1980s, BSD-based flavors were more successful commercially. Today, the
    situation has turned around. Due to aggressive standardization efforts, SVR4 has
    become the dominant Unix platform. SunOS, the old BSD-based from Sun, has been
