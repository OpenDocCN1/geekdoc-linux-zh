  md: '# Wildcards


    Hmm, is it things.txt? Let''s take a look:


    ```

    $ elvis@frogbog elvis cat things.txt

    ```


    Socrates

    Plato

    Aristotle

    Heraclitus

    Plotinus


    Yup, that''s it. But what if he knows the file ends in .txt and he wants to see
    only those files?


    Wouldn''t it be nice for Elvis to see only the files whose names end in .txt?
    This being Unix, he can:


    ```

    $ elvis@frogbog elvis ls *.txt

    ```


    tao.things.txt (*) is a wildcard. As in a old-fashioned game of poker, a wildcard
    matches anything. If two are wild, a two can stand for anything; just so, an asterisk
    stands for anything. Also in a poker hand, you can have any number of wildcards:*
    would match Mail, ThisFile, things.txt andthisfile. It wouldn''t match Desktop,
    README, or tao.txt.


    Unlike in a poker hand, an asterisk can stand for any number of things at once:
    The asterisk in *.txt replaces tao in one instance and things in another. Unix
    uses a question mark to stand for any single character: this?file would match
    both ThisFile and thisfile, but it wouldn''t match ThisIsAFile. Also unlike poker,
    * can match anything at all: this would not only match ThisFile and ThisFile,
    but also this. A question mark, by contrast, requires something to be present
    in the space reserved by that wildcard.


    Unix has one commonly used wildcard: Square brackets can be replaced by whatever
    characters are within those brackets. [T]his[F]ile would match only ThisFile and
    thisfile. (It would also match matchThisFile, if those files existed in this directory.)
    One additional complication is that two characters separated by a hyphen can be
    replaced by any character in that range of ASCII characters. This[A-Z]ile would
    match ThisFile, ThisMile, ThisBible, and 23 others.


    > 7. For some reason, wildcard matching is also known on Unix as globbing. Perhaps
    the image is a sticky mass of files all stick together on one point, that being
    the wildcard.'
