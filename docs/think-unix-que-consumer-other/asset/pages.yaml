  md: 'Eventually,Web developers realized that there were a couple of problems with
    the Web. Two of the most pressing problems were that too many Web servers required
    multiple IP addresses, and Web servers were rather lagged in their responses.


    The first problem was a result of the fact that if you wanted to run Web servers
    on a single computer, each one would require its own IP address. This is, although
    many names can be aliases for a single IP number, the server can''t tell what
    name was requested. The solution, was to give the Web server a different IP address
    for each site it served: Based on the number, the server could return different
    sets of pages.


    Some network engineers claimed that one reason Web servers were so slow that the
    system''s overhead join end a network connection was adding up. With some Web
    servers serving hundreds of connections per second, this had in fact become a
    real problem. HTTP 1.1 was designed to solve these and other problems that had
    been discovered when employing HTTP in the real world.


    Let''s look at a simple HTTP 1.1 connection. As you''ll see, it''s not too different
    from HTTP 1.0:


    ```

    $ frogbog.jon $ telnet localhost 80

    Trying 127.0.0.1...

    Connected to localhost.localdomain.

    Escape character is '']''.

    GET /jon/framed/contents.html HTTP/1.1

    Host: frogbog.localdomain


    HTTP/1.1 200 OK

    Date: Sun, 16 Jan 2000 02:26:25

    Server: Apache/1.3.9 (Unix) (Red Hat/Linux)

    Last-Modified: Mon, 20 Dec 1999 23:52:53 GMT

    ETag: "9a06d-59f-38ec155"

    Accept-Ranges: bytes

    Content-Length: 1439

    Content-Type: text/html

    ```


    ```

    <html>

    .

    </html>

    GET /HTTP/1.1

    Host: frogbog.localdomain

    Connection: close

    HTTP/1.1 200 OK

    Date: Sun, 16 Jan 2000 02:29:35 GMT


    </html>

    Connection closed by foreign host.

    ```'
