    # Color Names and Numbers


    Because X is a framework for graphical environments, color is important. We like
    to color-code displays of information so that we can have important information
    jump out at us. To work with colors, we must be able to specify particular colors.
    To work with realistic tones, we must be able to specify shades of colors more
    specific than blue or green. In X, there are standard ways to specify colors,
    including device-independent color specifications that are used by few, users.
    The most common scheme to specify colors is to use the RGB color model, which
    we will look at in more detail.


    # The RGB Color Model


    Most people us know that every pixel on the computer screen is made of three elements:
    a red element, a green element, and a blue element. Any color that can be displayed
    on a CRT or LCD must be expressed as a value for the red portion, the blue portion,
    and the green portion of the pixel. The brightest, pure blue would be the blue
    pixel at 100% brightness and the green and red pixels at 0%. (Actually, the red,
    green, and blue portions of each pixel are really subpixels, but I may refer to
    them as pixels in this discussion for convenience.)


    With 100% defined as 1.0 and 0% defined as 0.0, you can specify an RGB intensity
    specification as rgbi:red/green/blue. A pure red would be specified as rgbi:1.0/0.0/0.0
    and a medium gray would be rgbi:0.5/0.5/0.5.'
