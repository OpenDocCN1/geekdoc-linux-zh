  md: '# Thinking Like X Chapter 10 219


    copy. Next, move to the window where you would like that text to be copied and
    position the cursor. Finally, click on the middle mouse button and voilà—your
    text has been copied.


    Other features are available for selecting text to copy. To select one at a time
    rather than a visual block, move your cursor over the window you would like to
    copy, and double-click with the left mouse button; to select the entire line,
    triple-click with that button. If you find that you would like to reduce or expand
    whatever text has been selected, use the right mouse button. To add text before
    or after your selection, simply move the cursor to the precise location outside
    your current selection and single-click the right mouse button. To remove text
    from your selection, it must be either the beginning or end of your selection:
    There''s no way to deselect in the middle of your selection. Simply move the cursor
    to the point at which you would like the text to be removed and click the right
    mouse button. If the cursor is in the first half of the text that has been selected,
    X will deselect from the beginning of the block to your cursor location. If the
    cursor is in the second half, X will deselect from your cursor to the end of the
    selected block although it may take some getting used to, X’s copy-and-paste feature
    is quick and powerful.


    # The Three Menus


    The menu I find most useful is the right-button menu, which allows you to change
    the size of the xterm font. Sizes are available, ranging from invisibly small
    to indistably huge. Simply continue to hold down the control key and the right
    mouse button, move the pointer to your selection, and release the mouse button.
    All of us, your font is a different size. Doing this may allow you to make your
    window larger to hold more text, or to make a smaller window visible. X will make
    things hard to handle.


    The middle mouse button provides many features that can be either or off. To switch
    the state of a feature, select it with the pointer and release the mouse button.
    The only features I tend to play with are Scroll to Bottom by Key Press and Scroll
    to Bottom by ti Output, both of which are self-explanatory. There are also terminal
    reset features available, in hard and soft varieties. The hard variety is particularly
    useful when one application or another has messed with your screen and you’d like
