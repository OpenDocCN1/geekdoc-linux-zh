    # Back Quotes (’)


    One complaint about setting the prompt to include that last value is that it only
    works in bash, not sh or k. To duplicate the effect of this command in those shells,
    we must be able to include the output of one Unix command in another. This is
    a new concept, let''s detour a moment and look a couple of simple examples before
    coming back to altering the prompt string.


    Back quotes interpolate the output of one command in another. The command within
    those quotes is replaced by its output within the whole thing being run. This
    sounds confusing, so let''s look a couple of examples:


    ```

    [jon@frogbog jon$] expr 1 + 3

    4

    [jon@frogbog jon]$ echo `expr 1 + 3` horseman

    The 4 horseman

    ```


    In this case, the `expr 1 + 3` in the second command is replaced with the output
    of the command expr 1 + 3, which I''ve cunningly demonstrated returns the number
    4. The shell, therefore, interprets the command The `expr 1 + 3` horseman as echo
    The 4 horseman.


    ```

    [jon@frogbog jon$] whoami

    jon

    [jon@frogbog jon]$ echo `whoami`

    jon

