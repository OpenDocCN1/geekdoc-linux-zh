  md: '# Reading Mail Using POP3


    Most people don''t have their computers up to be on the Internet all the time
    (although that''s changing rapidly even as this book is being written). Also,
    most people don''t have their PCs set up to receive mail, because Windows and
    Mac OS are reliable enough to do that invisibly in the background and because
    it''s not worth setting unless you are always connected to the Internet. Many
    organizations don''t like all those machines exposed on the network for security
    reasons anyway. For all these, many sites have centralized mail servers from which
    everyone can pull their.


    SMTP “pushes” to machines: It assumes that, as a rule, machines are available
    to receive mail over the network, and it takes the initiative to send mail out.
    Mail servers, however, suspect that their clients are probably not ready to receive
    mail, and instead wait for those clients to connect and ask for, or “pull,” mail
    from the server. IMAP4 and POP3 are pull-oriented protocols designed for reading
    mail. These protocols cannot be used to send mail, which is why clients that use
    IMAP or POP ask you only for your IMAP or POP server, for your SMTP server, so
    they can send sending out.


    Although PC and Macintosh users most frequently use these mail-reading protocols,
    their clean design of plaintext makes clear that these were developed by the Unix
    and Internet community. More importantly, it also means that it''s possible for
    us to receive mail directly from our mail server when we''re not at our own computer
    having to run and configure a mail client on the machine we''re at. Let''s walk
    through a manual connection to a POP server apiece at time:


    ```

    [ @frobob jon $ telnet razorback 110

    Trying 192.168.1.10...

    Connected to razorback.localdomain.

    Escape character is "''

    +OK POP3 razorback.localdomain v7.59 server ready

    USER jon

    +OK User name accepted, password prompt

    PASS PasswordHere

    +OK Mailbox open, 2 messages

    ```'
