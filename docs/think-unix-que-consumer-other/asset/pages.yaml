    All are short names for fonts; most fonts also have long names. Long names for
    X fonts like this:


    +   -adobe-medium-i-normal-12-120-75-75-p-63-iso8859-1

    -b&h-lucidans-medium-normal-sans-10-100-75-p-59-iso8859-1

    -schumacher-clean-bold-r-normal-0-0-100-75-p-60-iso8859-1

    -urw-palatino-bold-r-normal-0-0-0-p-iso8859-1


    The hyphen at the beginning of a long font name is not optional. This is followed
    by the name of the font foundry; the company that produced this font. In these
    examples, the font foundries are adobe, balk, schumacher, and urw. After another
    hyphen, the name of the typeface follows. In the examples, the typefaces are times,
    lucida, clean, and palatino. After another hyphen is the weight of the font, which
    in all the previous fonts is either medium or bold, although font weights can
    be light or other value.


    After another hyphen comes the slant of the font, which is usually r, which stands
    for regular, or i, which stands for italic. Next is the width, which is almost
    always normal, and an additional style, which is almost never used. Next comes
    values representing the size of the font. First is in pixels and then in points
    (point is 1/72 of an inch). Pixel sizes are generally more useful than one might
    expect. In theory, pixel size is device dependent, and point size is device independent.
    Don''t ask me what this means; I''m not sure anyone knows.


    Next are the horizontal and vertical resolutions. These resolutions are for the
    display and are usually 72, 100 points per inch. If any fonts have horizontal
    and vertical resolutions, the inclusion of both is at least surprising. After
    this is the spacing, which is P for proportional, M for monospaced, or C for cell.
    The difference between cell and monospaced fonts is that the latter- theoretically
    has no restrictions other than fixed width. In practice there is just informal
    because if any fonts are available in more than one of these flavors.'
