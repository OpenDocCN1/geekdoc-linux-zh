    # Conditional Execution


    Safer and more effective than sequential execution, conditional execution allows
    us to

    act differently as circumstances require. One very simple form of conditional
    ex-\ecution allows us to run further commands on the basis of the success or failure
    of

    other commands.


    # Exit Status


    For the idea of this to work, the computer must know whether the last command\executed
    successfully.When a program exits, it returns a number. That is, it tells the

    shell, "my exit status is N," where N is a number. Zero usually means the pro-

    gram finished successfully, whereas any other number usually indicates

    an error. Different numbers might mean different things, depending on how the

    program was written, but it almost always indicates some kind of error or failure

    to execute properly.


    The shell makes the exit status of the last command executed available in the
    var-

    able ? .You can see echo $ to see the exit status of the previous command:


    ```

    [jon@frogbog jon]$ cd tmp

    [jon@frogbog tmp]$ echo $?

    0

    ```


    Simple enough: A successful cd returns a zero, as we would expect.


    ```

    [jon@frogbog tmp]$ cd garmels-castle

    bash: garmels-castle: No such file or directory

    [jon@frogbog tmp]$ echo $?

    1

    ```'
