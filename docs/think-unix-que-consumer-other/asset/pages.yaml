    # Manual Sections


    The Unix manual is divided into ten sections. These are numbered one through nine,
    plus a section "n." For nonprogrammers, the important sections are one and six.
    Section one contains what are broadly defined as user commands, as logout, login,
    and pass. Section six provides the documentation for a number of games. (In fact,
    many games have their pages in the first manual section, but this is one of the
    many instances of sloppy documentation I warned you about earlier.) Section four
    or five, depending on configure what flavor of Unix you have installed, contains
    descriptions of configuration file formats, such as mail reader configurations.
    You might find these useful when you know how to configure a particular application
    or service.


    Programmers might be interested in sections two and three of the manual, which
    contain system calls and subroutines, respectively. Other manual sections differ
    between Unix flavors but are generally reserved for system-level commands and
    information.


