    It''s very important to understand that the display you see be of software running
    elsewhere or on the local machine:The X protocol is said to be network transparent
    because it acts the same regardless of how data is conveyed. All of a sudden,
    though, we are talking about the X protocol. What does that mean?


    The X Window protocol is a sort of language through which the client conveys what
    must be displayed to the server. A protocol in the same sense as SMTP, POP3, and
    HTTP are protocols: It is a set of rules and procedures through which the two
    systems communicate. In this case, communication consists of instructions for
    drawing the screen.


    Any machine that can interpret the X Window protocol and draw the right things
    on a screen as a result is an X Server.That X Server can be a standalone machine
    that does nothing but draw (an X Terminal), a piece of software on a Unix box
    that does other things as (an X workstation), or even a piece of software on a
    Windows or Macintosh computer. The client doesn''t care what the server is, although
    it knows the resolution of the screen, number of colors, and so on. With any piece
