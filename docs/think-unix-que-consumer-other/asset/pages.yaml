  md: '# Unix Concepts


    A disk can be mounted only in an existing directory on the system.That directory
    contains the contents of whatever top-level directory was present on that disk.
    Generally, only system administrators mount and unmount disks; some workstations
    permit users to do so, especially with removable media such as floppy or CD-ROMs.
    The point where the disk is attached to the system is known as the mount point.


    So far, I''ve discussed mounting disks, but what''s really being mounted are partitions
    containing filesystems. A partition is a piece of disk. For convenience, security,
    or occasionally due to technical limitations of the system, disks are often "broken
    up" into several pieces as partitions. The system can address each partition separately,
    although the device names generally make it clear that these are part of a single
    physical disk.


    A filesystem is a format in which the system expects the data. You can''t put
    a Macintosh floppy in a Windows computer and have the system read RT¹ because
    the disk is not laid out the way the system expects. When you put a PC floppy
    in a Macintosh, it''s treated and identified differently because the filesystems
    have different capabilities:There are different restrictions on legal characters
    in filenames, different maximum lengths of filenames, and so on. Because of its
    heritage of mixed environments, many Unix systems know how to read different filesystems.


    If you cat /etc/fstab, the file used on Unix systems to determine the defaults
    for mounting partitions, you should note that the format is generally the partition
    to be mounted, where that partition should be mounted, the system defaults, and
    then some additional system-specific information. (See the page fstab(5) for details
    if you''re curious.)


    # Table 2.1 Some Common Filesystems


    | | |

    |---|---|

    | ext2f | The standard Linux filesystem |

    | iso9660 | The filesystem used by most CD-ROMs |

    | jfs | AIX''s journaling filesystem |

    | xfs | The Extended File System, used on recent SGI systems |

    | efs | An older SGI filesystem |

    | ufs and ufs | Cross-platform filesystems developed on BSD and now available
    on many different Unix flavors |


    There also exist filesystems that aren''t really disks. NFS is the Network File
    System, which lets you mount arbitrary directories over the network as though
    they were in fact disks. afs and coda are more advanced network filesystems, with
    better security and more precise control of the data. proc filesystem present
    on some modern Unix flavors, permits you to examine and control aspects of the
    system by reading and modifying files. These are sometimes defaults for regular
    users but are often intended for the system administrator.


