    the X Window System at the time it is X11R6.4.That X11,Revision 6.4. The revision
    is essentially a traditional version number, and the X11 that precedes the revision
    means that it is 11 of the X protocol.


    Version 11 of the X protocol dates back to September 1987, making it over 10 years
    old at the time of this writing. Because so many devices use the X11 protocol,
    it''s probably never going to change again;Any change would create incompatibilities.
    It stands now, any device created to support the X11 protocol over the last dozen
    or more years can serve graphics for any client created during the same period.
    So if the core protocol doesn''t change, how can new features be added to X? The
    X Window System was designed to be extensible, and one can load extensions on
    an X server. The client can discover what extensions are available and use them
    to improve performance or add features without breaking...'
