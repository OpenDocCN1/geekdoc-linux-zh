    xterm*VT100:geometry: 80x35

    #elif HEIGHT == 600

    xterm*VT100:geometry: 80x25

    #elif HEIGHT == 1024

    xterm*VT100:geometry: 80x45

    #endif

    ```


    Note, in this case, I must specify that the geometry is for the VT100 widget

    hierarchy. If I merely specified xterm*geometry, I would have defined the size
    of

    all three menus to 80 by how many pixels because the menu geom-

    is measured in pixels, but the window can inherit the xterm''s geometry,

    is measured in characters. (In fact, when I was new to X Resources, I made

    just this mistake. It took me weeks to discover what I''d done.)


    COLOR and HEIGHT are far from the only symbols defined by xrddb and cpp. (In fact,

    xrddb specifies a large number of definitions on the cpp command line, in

    they''re actually defined. If you think about it for a few minutes, it will make

    sense.) To see all the values defined by xrddb, simply run the command xrdb

    symbols.


    Because I want to define some additional values when I run xrdb, I use the fol-\lowing
    command in my .session to run xrdb:


    ```

    xrdb -load $HOME/.Xdefault -DHOSTNAME=hostname | \

    cut -d '' '' -f1 .USERNAME=$USER

    ```


    This defines hostname to be equal to the short hostname of the machine and USER-

    NAME to be equal to my username. This allows me to use defaults for my

    xterm title bar and icon name, even as I move .Xdefaults from system to system-

    t:


    ```

    xterm*title: USERNAME@HOSTNAME

    xterm*iconName: HOSTNAME

    ```


    I''m a big fan of having the same configuration files everywhere, and xrddb allows

    to to do this, especially with a handful of extra definitions.


    Unfortunately, it would be convenient to say, "If this is my hostname, do that
    instead, but if it''s

    dreadfully inconvenient to say so." You can do this by running xrddb using a shell

    script that sets variable definitions based on those conditions, but you can''t
    test

    them directly. This is quite unfortunate, in my opinion, but it''s probably never

    go to change: cpp has remained more or less constant for years.'
