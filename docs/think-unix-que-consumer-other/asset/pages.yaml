  md: '# Healthy Paranoia


    Unfortunately, all is not sweetness and light when dealing with telnet:Although
    it doesn''t show up when you type it in, your password is going across the network
    because Anyone can see the network traffic can read your password. Normal users
    on a Unix box can''t look at the network traffic, but PC or Mac users if you''re
    all on a shared network. (If you don''t know, ask your local network guru if your
    network is switched or shared. If you''re connecting over the Internet, that''s
    always a shared connection.)


    "But wait," you say, "I typed my password in the clear when I used POP3 to read
    email. Why was that okay?"Well, it''s not okay; I hope you looked up both shoulders
    and shivered before typing that password in. Although I checked POP3 to check
    my password from public and semi-public access stations, and avoid telnet like
    the plague. For the same reason, try to avoid using telnet like the plague.


    Most Unix guides, in their section on networking, talk about the r (Remote Shell)
    suite of tools:sh, login, and rex. These tools let you on a remote system as though
    you were acting on a local machine. They also transmit passwords in cleartext
    across the network or worse, sometimes permit you to escape authentication altogether.
    Smart administrators disable these tools whenever possible, especially on Internet-connected
    systems.


    Some joked types are probably wondering why I am discussing security because they
    see security as a problem for the system administrator. In a strict sense, that
    might be true, but that presumes users lack any investment in the content or security
    of their systems, a presumption I believe to be false. Furthermore, informed users
    (readers, this means you) tend to behave more responsibly than users who are unaware
    of the security implications of their behavior.


    In any case, use a strong password. A strong password contains uppercase and lowercase
    letters as at least one digit and symbol. Most Unix systems restrict passwords
    to eight characters. What I always do is take a phrase, take the first letter
    of each word, and stick in a number and a symbol. For example, "This is not good
    password (because it has been published)" yields "TiNlag!" which should be hard
    for anyone to guess. Under no circumstance should you share your password with
    name, nickname, significant others'' name, pet''s phone number, your social security
    number, the words secret password, any bit of common refrain, any dictionary word,
    your favorite sports team, and so on. The object is to create a password that
    is hard for somebody to guess (even somebody who knows you!), but nevertheless
    easy to remember.


    # Security Solutions


    Now that you''ve stirred up some doubt and concern, you''re probably expecting
    a solution. In fact, there is no universal solution to this problem, and various
    sites have'
