  md: '# v6, Dotfiles, and Regular Expressions Chapter 5 111


    There are two basic ways to learn these key commands. The first, somewhat less
    enjoyable, is to enter vi and move around a large document. The more enjoyable
    is to play games. Rogue and Nethack, two popular dungeon exploration for Unix,
    use the vi keys to move your adventurer through the dungeon. Nethack in particular
    is a way to wait several hours, as example when writing a book, and you can comfort
    yourself with the knowledge you''re improving your Unix skill set.


    Sometimes you move to through text faster than a single line at a time. and Control-B
    moves back an equal distance. You can think of these as Forward and Backward.
    When you''ve found the screen with the text most interested in, you can press
    H (perhaps the Head of the screen, or simply a variant on the standard h command)
    to move to the top line on the screen, M (presumably short for Middle) to move
    to the middle line on the screen, and L (representing Last) to move to the bottom
    line on the


    Moving to the beginning or end of a line is equally simple and equally unintuitive:
    $ moves to the end of the current line, and # moves to the beginning of the current
    line. * moves to the first whitespace character on the line, which happens if
    you are a programmer.


    You may also move through text in logical rather than physical units: w moves
    forward one word, b moves back one word, and W, B, and e do the same thing as
    their lowercase variants, but without punctuation. The keys are ) and ( move forward
    and back one sentence, respectively: you might imagine them as blunt arrows pointing
    right and left. Fancier arrowheads, ) and ( move forward and back one paragraph.


    Remember you don''t need to know all these commands to move effectively through
    your document. Personally, I use the four directional keys, back and forward one
    keys, and beginning and end of line keys. Sometimes I use the others, but only
    when I write this book, I find that I''m using more and more of them, but you
    certainly shouldn''t pressure yourself to learn all of them right away. (I say
    that now, but the practice problems later in the chapter will assume knowledge
    of most of these keys. Feel free to use a cheat-sheet when answering these questions.)


    # Adding and Inserting Text


    The simplest way to add text into a buffer is to type a (for append), which moves
    to the space following the cursor, or if there is, and you puts into insert how
    to edit Type away and (and always) hit Esc to exit. This raises the obvious question
    of how to edit the first character in a line if there already text there. Simply
    type i, short for insert, which enters insert mode under the cursor. If you only
    had i, you''d never be able to add text after the last character in the line;
    conversely, if you only had a, you wouldn''t be able to insert text before the
    first letter on the line.'
