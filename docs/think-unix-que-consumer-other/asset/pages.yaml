  md: 'marker (EOF), which on Unix systems is represented by Ctrl+D.¹ One more important
    stream is STDERR, which stands for standard error. This is where error messages
    go, as you''ll often find that it''s convenient to send errors some-where different
    than STDOUT or that it''s convenient to send errors the same place as STDOUT,
    when they''d tend to go elsewhere.


    # Reading, Writing, Appending


    Let''s say Elvis wants to take a quick note by catting some text into a file:
    He''s on the phone with Devo about a possible collaboration, and (like us) hasn''t
    yet learned to use a text editor.


    ```

    $ elvis@frog$ cat devo.txt

    ```


    Country-Western "Whip It?"


    Flowerpot Hats: Jerry''s House of Weird Stuff, Pierpoint, MI


    Get Eddie V.H. to play guitar on new "Jailhouse Rock" album?

    -D


    ```

    $ elvis@frog el$

    ```


    A single right-angle bracket (>) redirects STDOUT to a file; it even looks like
    an arrow pointing into a file. Not surprisingly, to redirect STDIN from a file
    requires a single left-angle bracket (<). Elvis wants to see the names in west.txt
    in alphabetical order because he needs a convenient example for redirecting STDIN
    from a file:


    ```

    $ elvis@frog elvis } sort west.txt

    ```


    +   Aristotle

    Heraclitus

    Plato

    Plotinus

    Socrates


    All done, without a troublesome complaint from the system or a good reason why.

    Appending to a file is easy: it''s simply a pair of right-angle brackets without
    spaces (>>). With appending, Elvis can add to his list of Western philosophers:


    ```

    $ elvis@frog elvis } cat >> west.txt

    ```


    +   Kierkgaard

    Pascal

    Descartes

    Sartre

    -D


    > 1. The more-or-less standard notation for control characters is to use a caret
    (^) in front of the key to be pressed.'
