    In this case, the back quotes are executed in the double-quoted expression, resulting
    in interpretation of echo bin as the first-quoted expression. When single quotes
    are used, the system looks for a file named `echo bin`, and, not finding one,
    claims that it is not present.


    Another example where return is setting the prompt PS1 to an equivalent of bash''s
    PS1=''\whoami@\h\$ ''. We''ve already seen an excellent replacement for this PS1=''`whoami`@hostname|cut
    -d -f 1 `$PWD`'' '', but what happens when different types of quotes are used?
    Let''s look at code:


    ```

    [jon@frogbog jon]$ PS1=''`whoami`@hostname|cut -d -f 1 `$PWD`'' ''

    [jon@frogbog jon]$ cd bin

    [jon@frogbog jon]$ PS1=''`whoami`@hostname|cut -d -f 1 `$PWD`'' ''

    [jon@frogbog jon]$ cd

    [jon@frogbog jon]$ pwd

    /home/jon

    [jon@frogbog jon]$

    ```


    When double quotes are used, the prompt doesn''t change the last term in the brackets
    to the current directory, whereas it works fine with single quotes. What gets?


    When single quotes are used, the back-quoted expressions within the prompt are
    not interpreted at the variable PS1 is set. That is, PS1 is set to ''`whoami`@hostname|cut
    -d -f 1 `$PWD`''. When the shell then sends the prompt, it sees the back quotes
    and interprets them at runtime. When you switch directories `$PWD` is run again,
    producing appropriate results based on the name of the current directory.


    By contrast, when double quotes are used, the back-quoted expression is interpreted
    at the time it is set. Therefore, if I''m in the $HOME/tmp directory when I set
    my prompt, PS1 is set to [jon@frogbog tmp]$, and the prompt is reevaluated every
    time it is displayed, there is nothing to be interpreted.'
