  md: '# Muddling Through Shells Chapter 6 143


    One smart way to solve this problem is not to send the output of processes you
    intend to run in the background to the terminal at all:


    ```

    [ ]@frogbog jon $ really-verbose-program & program-output.txt &

    [1] 22217

    [ ]@frogbog jon $

    ```


    We redirected STDERR and STDOUT to a single file (program-output.txt) and run
    the command in the background. The system reports the job number and process ID
    and lets us go on our way. As really-verbose-program doesn''t stop to wait for
    user input, we won''t see any messages from it on the screen. If it does stop
    and we need to foreground it, we won''t see any prompt on the screen; we''ll need
    to look in program-output.txt to see what the system wants.


    Eventually the job might terminate. When this happens, we will get a message as
    we did when it stopped. We can hit Control-L to redraw our screen, continue what
    we were doing, and examine the output file at our leisure.


    What happens if you start a job and you lose out of the system? In the old days,
    shell would help kill the processes for you, preventing your long-running scientific
    program from completing its work while you went and watched TV for a few hours.
    To solve this, the command nohup was written with your command appended to it,
    and it will intercept the HUP (hang-up) signal to stop it killing your program.
    nohup will send all of your program''s output to file nohup.out. By default, nohup
    will start in the foreground, so you still need to to background the process manually
    or append an ampersand to the command line.


    Modern shells will not send the HUP signal to kill background processes, however
    when the shell exits, leaving them to run uninterrupted, and if you try to exit
    a shell with some jobs not running, but the shell will complain:


    ```

    [ ]@frogbog jon $ logout

    There are stopped jobs.

    [ ]@frogbog jon $ jobs

    [1]+ Stopped

    cat

    [ ]@frogbog jon $ logout

    Connection closed by foreign host.

