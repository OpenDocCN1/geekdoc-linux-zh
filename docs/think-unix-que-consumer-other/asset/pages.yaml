  md: '# Part III X Window System Concepts


    Next is the average width of the font, in points—another virtually useless field—and
    finally are the registry and encoding. The registry would tell the system what
    kinds of characters are included in the font, and the encoding is a sort of subregistry
    that tells the system what particular characters are included. This allows you
    to have a generalized encoding and a more specific encoding.


    Outline fonts are not stored as a series of pixels but as a set of instructions
    on how to draw them. These fonts can be displayed at any size, but are more likely
    to look odd at particularly small sizes and low resolutions. High fonts are outline
    fonts, as urw palatino, shown earlier.


    Finally, X fonts strings wildcards. You can fill in with an asterisk for which
    you choose not to supply information. For example, if you have the Palatino typeface
    supplied by only one foundry, an asterisk in the field is irrelevant because it
    can be replaced by only one foundry. If, however, you have this typeface supplied
    by more than one foundry, an asterisk in the field is equivalent of saying “I
    don’t care,” which is likely to produce duplicate results. For example, an asterisk
    in the slant means that, if the font exists in italic and upright variants, the
    italic variant will be selected. Also, any font name using wildcards should be
    quoted in many circumstances, to help interpretation of the wildcard by the shell
    or other applications.


    All this is rather complicated. The quick route to enlightenment is probably to
    start xfont, pictured in Figure 11.3, and alter values until you get an intuitive
    feel for what’s going on. xfont allows you one additional useful feature: If you
    want to use a font string for the font displayed, you can select the button and
    use the middle button to post the font name in window.


    ```

    quit context

    1 name matches

    -foundry=pal-upright-scaled-width=fixed-aspect=proportional-weight=normal-size=100-100-

    ABCABCDEFGHIJKLMNOPQRSTUVWXYZ

    ababcdefghijklmnopqrstuvwxyz

    0123456789

    áçéíóúýÄÅÆÊÍÓÔÜÝ

