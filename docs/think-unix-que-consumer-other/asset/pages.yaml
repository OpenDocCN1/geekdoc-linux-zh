    # DNS


    How is this thing more maintainable than /etc/hosts? Its three distinguishing
    features are that it''s client/server, it is hierarchical, and it''s distributed.
    We will talk about each of these in turn.


    DNS is client/server. This means machines that want to convert a hostname to a
    number generally do not it themselves but look to another machine that does the
    actual work. The machine making the request and receiving the response is the
    client the machine receiving the request and responding is the server. The primary
    advantage of a client/server architecture is that the clients don''t usually require
    much in the way of maintenance. All that is required is that they can talk to
    the server.


