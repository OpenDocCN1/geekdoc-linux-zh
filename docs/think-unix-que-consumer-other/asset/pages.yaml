    \ AUTHOR is set to Lasker. If it is set to Sterling or Stephenson, print the message\
    \ That's a pretty good book. If AUTHOR is set to anything else, print the message\
    \ haven't read that book.\n\n# Loops\n\nOften it is useful to run several commands\
    \ not just once but for every file in a group of files, until a condition is met,\
    \ or for a specific number of times. Loops allow us to repeat tasks as desired,\
    \ on any number of criteria. The two basic types of loops available on Unix are\
    \ for loops and while loops. We will discuss two sorts of loops related to while\
    \ loops, until loops, and loops that execute a predetermined number of times.\n\
    \n# for Loops\n\nMy favorite type of loop is the for loop. Most often I use it\
    \ to repeat an action for a group of files, although it can be used for any number\
    \ of things. Let's say I wanted to work on several files in the superheroes directory,\
    \ I wanted to back up all the files before messing around them just in case. (This\
    \ is a particularly useful thing to want. I very suggest that you should back\
    \ up files before working on them.) Let's say I wanted all my superheroes to backup\
    \ files with a .retired extension added to their names:\n\n```\n[jon@frogsuperheroes]$\
    \ ls\naqua-man green-lantern-spider-man-the-tick\nbatman robin superman wonder-woman\n\
    [jon@frogsuperheroes]$ for foo in *\n>\n  cp $foo $foo.retired\n>\ndone\n[jon@frogsuperheroes]$\
    \ ls\naqua-man robin the-tick\naqua-man.retired robin the-tick.retired\nbatman\
    \ spider-man wonder-woman\nbatman-retired spider-man.retired wonder-woman\nnbatman-retired\
    \ wonder-woman.retired\ngreen-lantern superman\ngreen-lantern.retired superman.retired\n\
    [jon@frogsuperheroes]$\n```"
