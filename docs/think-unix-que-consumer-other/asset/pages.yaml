    # Window Maker


    Window Maker (also known as WindowMaker and wmaker, the name of the executable)
    is a popular window manager that emulates the look and feel of the NextStep/OpenStep
    environment. (Another window manager, AfterStep, also emulates OpenStep and is
    based on the wm version 1 code.) Window Maker is fast and flexible, it looks good,
