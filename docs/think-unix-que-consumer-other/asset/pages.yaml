    # Talking with Other Machines


    The point of a network is not to learn all mumbo-jumbo about protocols and socket
    name to talk with other machines. Talking with other machines falls into two general
    categories: sharing data and resources over the network and actually using a computer
    via the network. On Unix, these two concepts are closer than you might imagine,
    due to the preponderance of cleartext higher-level protocols.


    # Telnet


    The basic tool for using other machines remotely and accessing the resources available
    on them is telnet, which simply connects you to a particular port on the host
    you specify. The default is to log on a machine remotely by connecting to an appropriate
    port.


    ```

    @ frogbog j$ telnet razorback

    Trying 192.168.0.0...

    Connected to razorback.localdomain.

    Escape character is ''^''


    Red Hat Linux release 6.1 (Cartman)

    Kernel 2.2.12-20 on i686

    login: Jon

    Password:

    Last login: Wed Jan 5 01:11:54 from frogbog.localdomain

    ```


    Campus sidewalks never exist as the straightest line between two points.


    +   - M. Johnston


    No mail.


    ```

    [ jon@razorback jon j$

    ```'
