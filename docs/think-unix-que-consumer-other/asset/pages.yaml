  md: '# Some Common Filters


    Now that you have a toolbox, let''s fill it with some basic tools! This section
    is about hammers, screwdrivers, and wrenches of the Unix toolbox—the ones you
    use every day. There are drill presses and circular saws, before you can learn
    those tools you need to learn the basics.


    # Pagers


    The first filter most users try cat piped into more, which is a simple program
    that stops after each scroll of text and waits for the user to press a key. If
    you are reading a long text file, more is your friend. Just to try it out, type
    cat /usr/dict/words | more. (When you''re sick of seeing a long list of alphabetical
    words, simply press Ctrl+C to break out of more.) If your system doesn''t have
    /usr/dict/words, try examining /etc/services or any other long file on your system.


    After you''ve tried more, try less, if it''s installed on your system. If you''re
    not sure which is installed, just try these commands and see whether they work.
    If less isn''t installed, you''ll get an error message and nothing will break;
    you won''t get to see the file you tried to look at. less permits you to go backward
    as well as forward; if your terminal is properly configured, your PageUp and PageDown
    keys enable you to scroll a page of text at a time. Because less doesn''t quit
    when you reach the end of the file, you''ll need to press q to exit. (Unlike most
    programs, Ctrl+C doesn''t exit less.) As with more, just cat /etc/syslog.conf
    | less to look at a really long file you didn''t care about.


    more and less are a special subcategory of filter known as pagers because they
    enable users to page through text. Most filters, however, transform the text that
    passes through them in some way.


    # Heads and Tails


    head and tail transform text by displaying only part of it. head displays the
    top part of a file, whereas tail displays the bottom of the file:


    ```

    $ elvis@frog elvis $ cat tao.txt|head -2

    ```


    Lao Tzu

    Chuang Tzu


    ```

    $ elvis@frog elvis $ cat tao.txt|head -4

    ```


    > You remember our old friends more and less pipes, which from our discussion
    of documentation in Chapter 1. Not are only more and less pipes, but can simply
    take a filename as an argument and display that file. Many Unix commands are flexible
    in the same way. Even cat can be used as a filter if you don''t give it a filename
    on the command line. You''ve actually done this, if you think about it; when you
    redirected a file into cat.'
