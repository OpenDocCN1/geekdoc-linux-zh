    it''s not guaranteed that a single other program will return the same value. Some
    programs, GNU''s version of grep included, actually document the meanings of different
    exit status values on their main page. If exit status values are not documented,
    assume that you can rely on them to be consistent among different versions of
    the program, except inasmuch as $ is always success. (Sometimes nonzero indicates
