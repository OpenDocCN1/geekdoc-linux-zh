  md: '# Backslash (\)


    Although it''s not technically sort of quote, the backslash (\) is used to escape,
    or "quote" individual characters. There are two ways it is used, and in some sense
    they are opposite to each other, but on a deeper level there is a unity of purpose
    for the lonely backslash. Consider the backslash as a sort of toggle. It makes
    special characters literal and literals characters.


    The first use of the backslash is to turn a regular character into a metacharacter.
    We saw both with the \echo command and with bash''s interpretation of the PS1
    and PS2 command strings. For the prompt strings, \ represents a line break ("new-line")
    character; \ represents your username; \ the name of the current directory; and
    so on while \ represents actual. For the \echo command, \ is still a newline;
    \ is a tab; \ represents your terminal focus, if it has; and \ still represents
    an actual backslash.


    The second use of the backslash is to treat the following character literally:
    disable its special purpose. Many punctuation have a special meaning to the shell,
    including single quotes, back quotes, exclamation marks, question marks, cares,
    ampersands, pipes, asterisks, parentheses, semicolons, brackets, greatersigns,
    less-signs, and tildes. Any of these characters can be treated literally rather
    than having a special meaning by prepending a backslash to that character.


    One of this is when you have a file with a funny name and want to work with it.
    Imagine you have a file whose name is an asterisk, and you want to remove it.
    \* would delete every file in the current directory; unless you use \-i, it won''t
    ever ask before doing so. To remove a file \* you need to escape it; \* or \*
    will remove that file. Similarly, if you have a file named !, you may cat it by
    typing cat \!. As it gives another character special meaning, \ represents a literal
    backslash.


    In most circumstances it tells the shell to treat the next character literally,
    you can use a backslash to tell the shell that the next line is part of your command:


    ```

    [@frogbog jon]$ echo one

    > two

    > three

    > four

    ```


    onetwothreefour Consider for a moment what just occurred: The shell told that
    the line break was to be treated literally, so why didn''t one, two, three, and
    four appear on separate lines? The shell essentially ignores whitespace. In practice,
    this means newlines are discarded and more one space between words is compressed
    into a single space:


    ```

    [@frogbog jon]$ echo one two

    one

    two

    [@frogbog jon]$

    ```'
