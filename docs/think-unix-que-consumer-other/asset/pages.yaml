  md: '# Grouping Commands


    This chapter here to sweep up all the bits and pieces of basic command-line Unix
    knowledge that I haven''t already covered. After this chapter, we move on to the
    X Window System, the Unix GUI environment. This chapter covers grouping commands,
    which are used to (drum roll, please!) group commands. It also covers aliases,
    functions, and shell scripts, all of which can be used to automate complex interactions.


    Grouping commands do exactly what their name implies:They group commands. Why
    would you want to do that? There are four basic reasons to group commands: First,
    to run a set of commands in a subshell so as not alter the current environment;
    second, to redirect input and output from more than one command at a time; third,
    to execute a series of commands in the background; and fourth, to group commands
    to what occurs during conditional execution.


    For these three we have different grouping commands, the curly braces ({ }) and
    parentheses (( )).The difference between the two is that commands grouped with
    parentheses run in a subshell, whereas commands grouped with curly braces run
    in the current shell and have merely been grouped.


    A subshell, as the term itself should make plain, is a shell that runs within
    the current shell. Although it inherits the environment from the current shell,
    including variables, the current directory, and the like, changes made from within
    that subshell will not affect the shell in that subshell executes. Perhaps a simple
    example is in:


    ```

    [jon@frogbog jon$( cd thinkunix; pwd ; SOMETH=nothing; echo \

    $SOMETHING); pwm; echo $SOMETHING

    /home/jon/thinkunix

    ```


    nothing

    /home/jon


    ```

    [jon@frogbog jon]$

    ```


    Clearly, to the subshell, in which the parenthesized list of commands is executed,
    do not affect the main shell being used in this case. When curly braces are used
    and no subshell is created, the outcome is different:


    ```

    [jon@frogbog jon]$ { cd thinkunix; pwd ; SOMETHING=nothing; echo\

    $SOMETHING }; pwm; echo $SOMETHING

    /home/jon/thinkunix

    ```


    nothing

    /home/jon/thinkunix

    nothing


    ```

    [jon@frogbog thinkunix]$

    ```'
