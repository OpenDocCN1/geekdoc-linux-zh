  md: '# Networking Chapter 4


    The legitimate Received headers are your only good evidence as to the source of
    the message: It is trivial to provide any From header that you are in the message.
    I could change Netscape or Mutt to claim that all my mail is from president@whitehouse.gov,
    the Received headers would show the actual machine from which the mail was sent.
    Whenever you receive a piece of mail from an unusual or unlikely individual, examine
