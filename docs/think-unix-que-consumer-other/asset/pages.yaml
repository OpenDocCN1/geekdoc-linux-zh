  md: '# Part II


    # Shell Concepts


    We can also pass the job ID to other programs in the same way that we use it with
    fg and bg, just specifying the job number prefixed with a percent sign. Note that
    a job''s number remains constant, even if jobs with lower numbers have terminated.
    Unlike IDs, job numbers will be reused beginning with the lowest available. It
    is also worth noting that we had to hit Enter after our kill command to terminate
    the process. (We could have typed other commands in between, rather than simply
    hitting Enter repeatedly, but this is the clearest demonstration of the fact.)


    This is not for deep technical reasons, simply because the shell should not clutter
    your display with informational messages after the prompt is displayed. The first
    time we hit Enter, the shell sees that the job has been stopped, lets us know,
    and displays the prompt. The second time, the shell sees that the job has actually
    terminated and displays the message before returning us to the prompt. The reason
    that more of these messages doesn''t happen at once is that the system must signal
    jobs to stop before actually ending them, and processes that often spend a few
    moments after themselves.


    One interesting consequence of this behavior is that it''s possible to kill a
    job, start a new one, and have the new job have a higher job number than the old,
    dead job. This isn''t of any consequence, but it might be confusing if you haven''t
    experienced it.


    # Foreground, Background


    Up to this point we''ve been fast-and-loose with defining foreground and background
    processes. Simply put, a foreground process is the process currently accepting
    input from the terminal. A background process is any process that is currently
    running but not accepting input from the terminal. A suspended (or stopped) process
    is one that is not running and is not accepting input from the terminal but must
    be restarted either in the foreground or in the background.


    Starting a process in the foreground, suspending it, and restarting it in the
    background is a lot of work. Unix provides a simple way to put a process in the
    background from beginning: Simply append an ampersand to the command line, and
    it will begin in the background. The shell should report a job number, so you
    can control the process easily.


    Although a background process will not accept input from the tty, it might send
    output to STDOUT or STDERR, which might display to the terminal even if another
    program is currently running. If you''re not prepared for it, this can be quite
    confusing; many full-screen applications will redraw the screen if you type Control-L.
    This is useful when a background process unexpectedly sends output to the screen.'
