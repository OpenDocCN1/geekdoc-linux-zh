  md: '# Something Useful: xterm


    All of this brings us to xterm, the application that saw great use for probably
    at least the first 10 years of the X Window System''s existence. For years, the
    standard X environment consisted of two or three xterms running in twm along with
    xclock, which simply offers an analog clock for X. xclock can be seen in Figure
    10.6 and 10.7. It''s the clock; xterm is probably still the most popular X application
    available. (Most of this was written in vi running in xterm, often with another
    pair of xterms open on another desktop configuring subject-by-subject and chapter-by-chapter
    outlines of this.)


    So that you get something useful out of this chapter, I will cover basic features
    of xterm before moving to the next chapter. I will discuss some general xterm
    behaviors, such as the use of Athena Widget scrollbars and X''s cut-and-paste
    mode, and I''ll tell you briefly about options available in xterm. Although xterm
    is incredibly configurable, I will not discuss that now: Instead, I will talk
    about the next chapter, which is all about configuring


    xterm is of, a terminal that runs in X, but what sort of terminal is it? In fact,
    xterm offers two basic terminals: It can emulate vt102 (with some vt220 enhancements),
    and it can emulate a Tektronix 4014 terminal. Most people use the first option
    because it''s the default. The vt102 is probably the world''s most emulated terminal,
    so most programs are written to take advantage of its feature set. The Tektronix
    4014 is an older graphics terminal, but most graphics programs these days are
    written directly for X rather than for any particular graphics terminal.


    # The Athena Widget Scrollbar


    X scrollbar is by default the left side of the screen rather than the right side
    of the screen as on MacOS and Windows. When the cursor is over the scrollbar,
    the left mouse button moves the scrollbar down toward the bottom of the screen,
    the right mouse button moves the scrollbar up toward the top of the screen, and
    the middle mouse button moves the scrollbar to the cursor''s position. You need
    not grab the highlighted indicator on the scrollbar to move it, unlike many other
    operating systems. This is the behavior of any standard Athena widget scrollbar.
    Motif and GTK applications, among others, have more traditional PC or Mac style
    scrollbars.


    # Copy-and-Paste


    Copy-and-paste is quite different in xterm and all X applications from the cut-and-paste
    familiar to PC or Macintosh users. To select text to be copied, simply hold down
    the left mouse button and select whatever text you want'
