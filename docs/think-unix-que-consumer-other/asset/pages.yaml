  md: 'csh and tsh have completely different commands for dealing with variables than
    do sh, bash, and ksh. As always, I use bash as the model for how these commands
    work. If you use csh or tsh, read your documentation to see how to use variables
    and find what variables will work in your shell. Users of ksh and sh should find
    that all these commands and variables work just fine but might want to check the
    documentation to see how those shells differ.


    # Paths and Manpaths


    By now you know that Unix commands (those not built into the shell, to be precise)
    are on disk, like any other, and you know that every file must be referenced by
    either an absolute or relative path if the system is going to find it. Have you
    ever wondered why not type /bin/cat every time you want to run cat, or what if
    the system doesn''t try to run -~/docs/about/my/cat instead?


    The reason is that, looking for files, the system looks in several particular
    directories for commands to execute. The precise list of places to search varies
    by the flavor of Unix unlike one major difference between flavors is the location
    of directories that contain executable files. The executable path, which can be
    configured within the shell, is a list of places where the shell should look for
    commands that can be executed.


    The path is simple a list of directories separated by colons. Each entry is an
    absolute path to a directory. A very simple path might be /usr/local/bin:/usr/bin:/usr/X11R6/bin:/usr/sbin:/bin:/sbin:/home/jon:.
    With that path, the system would first look for commands in /usr/local/bin, then
    in /usr/bin,/usr/X11R6/bin,/usr/sbin,/bin, and finally /sbin the first time it
    finds a command with the given name in one of directories. If the command is not
    present in the lines of bash: the shell will return a file not found along any
    of those directories; somewherecommand: command not found.


    The name of the variable representing the executable path is PATH. To see what
    your path is, type $ echo SPATH at your prompt:


    ```

    [ jon@frogbob jon ] $ echo SPATH

    /usr/local/bin:/usr/bin:/usr/games:/usr/X11R6/bin:

    /usr/local/games:/usr/sbin:/sbin:/home/jon/bin:

    [ jon@frogbob jon ]$

    ```


    Note that I added several other directories to my path, as /home/jon/bin, where
    I can place programs I''ve added to the system and programs without needing any
    special permission to do so. I''ve also rearranged the order of some of the directories
    in the system to move more likely locations earlier in the path. Given the excellent
    performance of contemporary computers, this probably not necessary, but old habits
    died.'
