    # What, No Bat Signal?


    Several paragraphs back, I referred to the HUP signal. Unix can send various signals
    to process them informed of specific conditions. Because we''re most likely to
    want to send the QUIT signal to programs, the kill key will send us signals to
    individual processes.


    You can get a list of signals your platform supports by typing kill -1 at the
    prompt


    ```

    [on@frogbothunix]$$ kill -1

    1) SIGUP 2) SIGENT 3) SIGQUIT 4) SIGILL

    5) STRAP 6) SIGOT 7) SIGBUS 8) SIGFPE

    9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    13) SIGPIPE 14) SIGARM 15) SIGTERM 16) SIGCHLD

    18) SIGCONT 19) SIGSTOP 20) SIGTST 21) SIGTIN

    22) SIGTTO 23) SIGUR 24) SIGXCPU 25) SIGFSZ

    26) SIGALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO

    30) SIGPAR

    ```


    The first thing to note is that each signal has a name (that begins with SIG and
    N). You can use the other name (SIGUS) or the kill command: kill -9 %1 is equivalent
    to kill -KILL %1, and kill -31337 does the same as kill -19 31337.


    Signals should be more or less constant between platforms, although there can
    be some variation. A user not interested in programming the system, you''re probably
    interested in one of these signals. If you don''t specify a signal when you run
    kill, the default is only 15, SIGTERM. This signal politely asks a process to
    quit. The process is encouraged to clean up itself before exiting, removing temporary
    files, and so on. If a process ignores TERM, the next course of action is to demand
    that it quit immediately: KILL, signal 9, is used for this purpose. It''s much
    harder for a process to avoid being terminated with.


    If some reason we can''t suspend a process with Control-Z, we can send SIGSTOP
    to let that job continue. Another interesting signal available to us is SIGWINCH,
    which is sent to the system when a terminal changes its geometry—when you resize
    an xterm, for example, and the number of rows or columns changes: Start programs
    work for this signal and can resize their display areas appropriately. Sometimes
    not-quite-so-smart programs try to do this but must be sent another SIGWINCH signal
    to do it right, or that signal'
