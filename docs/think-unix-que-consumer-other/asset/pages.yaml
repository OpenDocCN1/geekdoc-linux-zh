  md: 'If you write shell scripts, you might also want to use arbitrary variables
    to store information used at runtime. For example, if I generate a random filename
    for a temporary file, I can save this value in TEMPFILENAME so that I can delete
    it when I''m done with my script, or I can set a number of variables for particular
    projects to save them typing:


    ```

    [jonfrogbog jon]$$ BOOKDIR=$HOME/docs/unixbook/thinkunix

    [jonfrogbog jon]$$ echo $BOOKDIR

    /home/jon/unixbook/thinkunix

    [jonfrogbog jon]$$ cd $BOOKDIR

    [jonfrogbog thinkunix]$$ pwd

    /home/jon/unixbook/thinkunix

    [jonfrogbog thinkunix]$$ cd

    [jonfrogbog jon]$$ rm $BOOKDIR/tempfile

    [jonfrogbog jon]$$

    ```


    As you can see, you use variable names as strings, commands, or other variables:
    The system replaces variable names with their values in the command line before
    it is interpreted.


    # Environment Variables


    Shell variables are, for the most part, available only to a variable the current
    shell. If you want programs running within the shell to have access to a variable
    (when you use a variable to provide configuration information to a program, example),
    you need to export that variable to your environment.


    Huh? What''s that? Your environment is a collection of information about your
    current configuration, consisting of specific shell variables that are made available
    to running programs. Some variables (TERM and PATH, for example) are automatically
    exported to your environment by shell. Others newsreaders use the variable to
    know what NNTP server to use for reading Usenet news. This variable must be exported:


    ```

    [jonfrogbog jon]$$ NNTPSERVER=news.example.org

    [jonfrogbog jon]$$ export NNTPSERVER

    ```


    If you know you will need to export a variable, you can set and export it all
    at the same time:


    ```

    [jonfrogbog jon]$$ export WWW_HOME=''http://www.tux.org/~lasser/''

    ```


    The WWW_HOME variable is used by the lynx Web browser to determine the starting
    home page.'
