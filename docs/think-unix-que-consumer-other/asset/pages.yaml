  md: 'This chapter is the heart of the Unix mentality is all about. If you took everything
    away from Unix but left redirection and pipes, you''d still be doing okay. These
    are the concepts from which Unix derives its strength and character, and attention
    paid now will be well rewarded. I promise. This is a short chapter, but one that
    contains the ideas which have allowed Unix to flourish for decades while other
    systems have fallen by the wayside.


    The material here is deceptively simple, in that none of these concepts are difficult
    or take any time to learn. The full power of Unix, however, lies in the informed
    application of these simple ideas. Practice these concepts until pipes and redirection
    are a reflex.


    # Redirection


    When I speak of redirection on Unix, I''m speaking of redirecting input and output
    of individuals. Redirecting the input and output presupposes that there''s a normal
    place from which data comes and a normal place to which it goes.


    # The Three Musketeers: STDIN, STDOUT, STDERRR


    And, in fact, this is the case. We could say that data normally goes from the
    terminal keyboard through the program and back out to the terminal''s display.
    This does cover the typical case but is technically inaccurate: Data comes from
    STDIN and goes to STDOUT. STDIN is an abbreviation for standard input, and STDOUT
    is short for standard output.


    Both STDIN and STDOUT can be considered as files: streams of bytes. STDIN is a
    stream being read by the program, and STDOUT is a stream of data being written
    by the program. Under normal circumstances, these point to the display and keyboard
    of the user''s terminal. If I run cat without filename on the command line, it
    edits its file from STDIN (normally the keyboard); cat always writes to STDOUT
    (normally the screen):


    ```

    [ @frogbug thinkunix $ cat test.

    This is a test.

    This is a test.

    I''m typing in one line at a time.

    I''m typing in one line at a time.

    All right I''ve had enough.

    All right I''ve had enough.

    ^D

    [ @frogbug thinkunix $

    ```


    As you can see, cat is designed to read text from STDIN, one line at a time, and
    send it back to STDOUT. It stops reading its data when it reaches an end-of-file'
