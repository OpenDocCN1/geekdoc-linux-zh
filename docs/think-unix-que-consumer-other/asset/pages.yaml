    groups are in the comp.os.unix.hierarchy; many of these groups have FAQs.


    Because of the large volume of spam posted somewhat at present), and because of
    the smaller breadth of topic, many software packages have mailing lists. Mailing
    lists are like newsgroups, the messages go straight into your mailbox rather than
    forcing you to get them on Usenet. These lists are generally referenced on the
    relevant software package''s Web page, and have publicly accessible archives as
    well. I highly recommend that you search before sending mail to list, so do not
