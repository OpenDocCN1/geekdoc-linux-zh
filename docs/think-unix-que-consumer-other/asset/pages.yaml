  md: 'Imagine a graph of a computer network, or of pages on the World Wide Web. Imagine
    the links as lines, and the pages or systems as dots where the lines meet. These
    dots are not nodes. Terminals are nodes, computers are, Web pages are nodes. You''re
    a node, too, but what''s the line, and what''s on the other end of it?


    An entry in the GNU Unix hypertext system.


    nibble Four bits, each to hexadecimal digit. One byte is made up of two nibbles,
    hence the name. See also bit, byte, hexadecimal


    octal The base-eight numbering system. One octal digit is equal to three bits.
    In the 1970s, there was debate as to whether octal or hexadecimal was better for
    computer systems. The argument for octal was that it was more human-readable,
    and it did didnt require the use of letters as digits. The argument for hex was
    that hex words were power of two bits long and that it was more compact. Hexadecimal
    won, decisively. See also bit, hexadecimal,


    open source A new name for free software that emphasizes the practical rather
    than ethical political aspects of the movement. Advocates of open source claim
    that source is morally superior, but that is technically superior, more secure,
    and Provides for a greater level of control than closed-source controls. The Open
    Source initiative page is at http://www.opensource.org/. See free software


    perl When people graduate from shell scripts and require more power and control,
    perl is the language they turn to. A sort of mish of C, sh, sed, awk, and regular
    expressions, it is a highly flexible and powerful combination. If you want to
    learn perl, the place to start is


    > Schwarz, Randal L., et al.

    Learning Perl, 2nd edition

    O''Reilly & Associates. 1997.


    The standard reference work on the topic is


    > Wall, Larry, et al.

    Programming Perl, 2nd edition

    O''Reilly & Associates. 1996.


    See also awk, sed, sh


    PINE PINE is the standard terminal–based mail program for users new to Unix. Like
    a typical PC application as a Unix application, PINE makes it difficult to make
    dangerous mistakes. It''s slow, relatively large, and full of pretty menus'
