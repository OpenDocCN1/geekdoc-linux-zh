    I''m to say that God is not on the side of PINE.The name, by the way, stands

    “PINE Is Not ELM.\The PINE home page is at

    http://www.washington.edu/pine/. See also elm, Mutt


    procmail procmail is a mail filtering system that separates mail into different

    folders based on regular expression matching. procmail is truly Byzantine in its

    syntax and complexity, but inately powerful as well. The man pages are com-

    prehensive and yet thoroughly unhelpful. The procmail Web site is

    http://www.procmail.org/, from there you might try to find a helpful tutorial.

    procmail and Mutt make a particularly powerful combination. See also Mutt


    regex regular expression


    regexp See regular expression


    regular expression The pattern-matching and substitution language almost

    standard across Unix applications. More powerful than it needs to be for most

    applications, but powerful enough to do things you can imagine. If you

    becomme with regexps, you might want to read a book about:


    Friedl, Jeffrey E., editor.

    Mastering Regular Expressions

    O''Reilly & Associates. 1997.


    root The top entry in any hierarchy. The root directory is the top-level direc-

    tory a Unix system, the root window is the top window in X''s window hierarch-

    y, the root server is the domain name server, and the root account is the

    sadministrator''s account. See also system administrator


    SawMail A manager that is thoroughly customizable in LISP The

    SawMail Web page is at http://sawmail.sourceforge.net/. See also LISP


    sed is a "stream editor" that applies regular expressions as a filter. It is

    small programming language and can be combined in very powerful ways with

    awk, the combination of sed and awk is losing to grep. See also

    awk, perl, regular expression


    sh The original Bourne Shell, the standard for shell programming.

    Highly portable among Unix systems, it nevertheless many features for

    interactive use. All shell scripts should run in the Bourne Shell, no matter what

    you for interactive use, but good interactive shells that share sh syntax

    bash, ksh, and zsh. See also bash, ksh, zsh


    shell Any program that enables you to interact with the system and execute

    commands. A shell is a program like any other, but which acts as your interface

    ands provides your command line. Many shells are highly programmable'
