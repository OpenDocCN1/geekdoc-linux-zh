  md: '# X Window System Concepts


    The standard graphics system for Unix is formally known as The X Window System
    and is known informally as XWindows (which for some strange reason upsets some
    purists), and is known even less formally as X. I say it''s a graph rather than
    a graphical user interface built on top of X by many different GUIs that you can
    choose to use. No matter what GUI you choose, any X-based application will run
    just fine on it, the look and feel might not be at all consistent with the rest
    of your environment.


    This chapter is dedicated to helping you understand the design decisions created
    this system and to giving you a quick look around the X Window System. Frankly,
    it''s not worth the time to teach most X applications because are simply point-and-click
    menu-based interfaces. This chapter should get you comfortable with X, and the
    next chapter will teach you how to customize your environment.


    # What X Does Differently


    If you''re not already clear on the concept, you should know that X does things
    a little differently than either Windows or Macintosh. In particular, the X Window
    philosophy is “mechanism, not policy,” and almost the entire design flows from
    that idea. Another idea is that X network transparent and client/server. First
    we need a bit of history, and then we will discuss what all this means to you.


    # A Little Bit of History


    The X Window System grew out of a 1980s MIT project known as Project Athena. There
    were two goals for the project: first, to discover how MIT could integrate computers
    into their curriculum; and second, to build a distributed environment for the
    MIT campus. Project Athena started in 1983 and scheduled to run for five years.
    (Ultimately, the project was extended for another three years and finally shut
    down in 1991 after achieving many its central goals.) What distributed computing
    environment really means is that anyone on the MIT campus should be able to get
    to any file, any machine, and any printer from anywhere. To do this, we needed
    a good network on campus, and software and hardware-to support that network.


    In 1984, the Macintosh was released, and, as part of Project Athena, the X Window
    System was created. Like Apple’s Macintosh, X was designed to be a graphical system.
    Unlike Macintosh, the X design team was not staffed by a team of artists, and
    therefore simply didn''t look nice. Furthermore, the Macintosh operating system
    was tightly coupled to the hardware, whereas the design of X was not.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Why wasn''t the design of X closely tied to the computer for which it was designed?

    Simply, MIT didn''t know what hardware would become available, or what people
    at the university would design. Therefore, the X Window System needed to be designed
    on any graphical computer made available to the staff or student body of the university.


    At first, course, hardware support was rather limited. Nonetheless, the idea of
    a graphical tool took. Rather than having one computer that both displayed CPU-intensive
    tasks and large, complex pieces of software, it might be more efficient to use
    one shared computer to do the calculations—our standard multitasking multiuser
    Unix server—and a separate machine to display the graphics. That separate machine
    would not have to do much work. Like an old terminal, it would need to display
    whatever was set to be by the main computer.


    # The X Window Client/Server Model


    The division of tasks between two separate machines in this fashion is known as
    the client/server model, a now commonplace term in the computing industry. The
    standard client/server nomenclature, the server is the heavy-duty machine in the
    background, and the client is the machine responsible for display and possibly
    processing of data.


    To illustrate the traditional client/server model, imagine a Web browser and a
    complex Web site, such as an e-commerce site. That is the server, and your Web
    browser is the client. In fact, for many specialized applications the browser/server
    model has overtaken the traditional client/server model, which presuppes customwritten
    client software on a particular target platform (Figure 10.1).


    | Web Server | Web Client | User |

    |---|---|---|


    Figure 10.1

    The traditional client/server model.


    The X Window System reverses the traditional nomenclature of the client/server
    model: the server is the machine that displays the data (it serves the graphics),
    and the program that displays to said server is the client (see Figure 10.2).
    This means that on an terminal or workstation, the big piece of software that
    runs stuff is called the X Server. This has been known to confuse professionals;
    just accept it and nod your head.'
