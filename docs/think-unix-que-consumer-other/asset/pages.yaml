    In the Beginning..Was The Command Line

    Avon Books, 1999.


    If you''d like a glimpse at the history of Unix, the book to read is


    Salus, Peter H.

    A Quarter Century of UNIX

    Addison-Wesley Pub. Co. 1995.'
