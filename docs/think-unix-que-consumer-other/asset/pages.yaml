    but what if we were replacing [se]with [c]uts? Because of the difficulty of solving
    this problem in more general cases, Unix makes the decision not to try to solve
    the problem.


    By default, sed uses the forward slash to separate the search pattern, the replacement
    pattern, and whatever options you append to that. However, you can use any other
    character for separator as long as you consistently use that with command. For
    example, se[hl]ouse#n or sx[sm]erverbx is back


    So what is option g at the end of our original search example, animals.txt | sed
    ''s/dog/cat/g'' animals.txt.new? That stands for "global," indicating that the
    search replaces not only the first occurrence on a given line but every occurrence
    on that line. The other frequently used option is 1, which does non-case sensitive
    matching; that is, s/dog/cat/g replaces every occurrence of dog, DOG, doG, and
    so forth on the given line with cat. For the reasons above, cat is always lowercase.
    I know of no general solution to the problem of replacing one string with another
    while preserving case.


