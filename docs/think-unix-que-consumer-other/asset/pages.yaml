  md: '# 104


    # Part I


    # Unix Concepts


    solved different parts of the problem in different ways. These include implementing
    VPN (Virtual Private Network) solutions, to create secure tunnels between sites
    over public networks; implementations of POP3 and IMAP4 over SSL, the encryption
    standard that Web sites use to protect e-commerce and sensitive information; and
    various one-time password devices, to prevent passwords sniffed over the network
    from being reused against your system. Ask your system administrator what you
    use sites.


    The most popular Unix-specific tool is ssh, Secure Shell, a replacement for the
    rsh family of programs. SSH encrypts not your passwords but all network traffic
    over its connection. As a result, nobody can see anything you do between those
    two machines on your network. On the Windows side, a nice client is Secure CRT;
    for Macintosh, NiftyTelnet + SSH is a very good freeware client.


    # # Digression: SSH and the Law


    As of the time of this writing (January 2000), SSH is encumbered with various
    legal issues that have prevented it from becoming a universal solution. These
    are patent problems, U.S. export law, and the license for the ssh program itself.


    The first problem is that one of the encryption technologies used by ssh is patented
    in the United States, a patent for licensing fees are required when used in commercial
    or other applications. This is the simplest problem to solve, requiring only a
    modest of patience: The RSA patent expires September 20, 2000.


    U.S. export regulations regarding encryption are present in flux, are poorly understood
    by lawyers due to a lack of applicable case law (several cases are presently working
    their through the courts, but the regulations are changing even as the cases progress)
    and are often widened by the government in surprising and perhaps unfair ways.
    Days prior to this writing saw regulations that to make it possible to export
    cryptographic software from the United States with only modest interference, but
    the practical differences are not clearly present.


    The SSH program has two versions: The older version, 1.2, is in use while the
    new 2.0 version is not yet popular. One reason for this is that the license for
    the earlier version restricts use for commercial gain, but is fairly nonspecific
    as what that means. The new license is more particular, making it difficult to
    use SSH in commercial environments without the penalty of hefty licensing fees.
    Nevertheless, many institutions are unable to implement either version of SSH
    due to these licensing issues.


    Work in progress to address the licensing issues: One project is producing a tool,
    1sh, interoperable with version 2 of SSH. Another tool, OpenSSH, bases its work
    on an earlier version of SSH with a different license and is compatible with SSH
    version 1.2.


    One thing is certain: Computer security, and cryptography in particular, is a
    fast-changing area and no book can keep up with it. As such, the best advice I
    can offer is to ask your system administrator, who knows your site implements
    (and who might be familiar with various tools), and ask a lawyer when appropriate.'
