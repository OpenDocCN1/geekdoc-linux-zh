  md: 'As with the movement keys, there are some shortcuts for dealing with text:
    A appends to the end of the current line no matter where the cursor is when you
    hit it, and I inserts text at the beginning of the current line no matter where
    you type it, and to insert an empty line below your cursor position and enter
    insert mode, type o, and to insert mode on a blank line above your cursor position,
    use o.


    # # Deleting and Editing Text


    Adding text to a document is only part of the picture:To get work done, you also
    need to remove and alter text. (And believe me, I know about removing and altering!)
    Generally speaking, while in insert mode (including append) you can backspace
    (or delete, depending on your keyboard configuration) over text the current line
    of the display that you have typed since entering insert mode. This is one sort
    of editing you can do without switching into command mode.


    Two other keystroke editing commands available in insert mode are Control-W and
    Control-U. Control-W deletes the last word you typed, and Control-U deletes the
    entire current line. These only function as far as you entered insert mode or
    the beginning of the line, whichever is nearer. If that is, halfway into line
    you enter insert mode and type Control-U, it won''t delete the first part of that
    line.


    After switching into command mode, several other deletion commands become available.
    x deletes the single character under the cursor, and dd deletes the current line.
    Either of these can be pasted back into with p or r. When pasting lines, p places
    the text below the cursor, and r places it on the line above the cursor. When
    pasting individual characters, it works much the same way: p pastes the text after
    the character, and r places it before the cursor.


    Even with these few commands (there are quite a number of others, some of we''ll
    discuss shortly), you can do all the basic editing you need to do in a document,
    albeit not as efficiently as you might want. There are neat tricks you can do
    with these keystrokes: my favorite is swapping two characters when I''ve accidentally
    typed them in the wrong order. From command mode, place the cursor over the first
    of the swapped characters and type xp. This will reverse the order of those two
    letters.


