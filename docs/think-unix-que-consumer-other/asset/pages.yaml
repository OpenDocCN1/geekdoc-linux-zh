  md: '# X Window System Concepts


    The intensity model is only one of the options. More common are scaled. Because
    computers are digital, there is not the infinite graduation implied by the use
    of intensities. Instead, each of these percentages must be turned into a number.
    Generally, colors in X are 24-bit values, which implies an 8-bit (one byte) value
    for each of the elements. These 8-bit subvalues range from 0 to 255, as all 8-bit
    values, are expressed in hexadecimal. Pure green, therefore, would be expressed
    as rgb:00/FF/00, and that medium grey expressed earlier is rgb:80/80/80. The RGB
    color model allows you to specify each scaled value from one to four hexadecimal
    digits, as long as each of the red/green/blue values for a given color share the
    same number of bits.


    # Old-Style Color Numbers


    Back in the days, before the presence of multiple color models in X, a color was
    simply specified as a hexadecimal number preceded by a hash sign. You can see
    in this color definition from the following example:


    ```

    #define WAYDARKBLUE #000033

    ```


    The pairs of digits in this 24-bit value are in the same order as in the above;
    the only differences. These values can also be from 12 to 48 bits, in multiples
    of 12, as in the RGB notation. This color, #000033, has no red or green in it,
    and only a little blue. How much? 33 out of FF converted to decimal, this is 51
    out of 255, which is equal to 0.2, or 20%. In the new color model, this could
    be expressed as rgb:00/00/33, and in the color intensity model, it would be rgb:0:0:0.
    I''m too lazy to update this, and I am somewhat wary how older machines would
    deal or fail to deal with this, so I leave the number in the old-style scheme,
    at least for the


    # Color Names: rgb.txt


    Fortunately, we don''t have to think of colors as numbers: The X Window System
    gives us a simple method of converting colors to numbers. Somewhere on your system
    is a file named rgb.txt (this file should be in the directory lib/X11 relative
    to X''s top-level directory). On my Red Hat system, this''s absolute path is /usr/X116/lib/X11/rgb.txt,
    which might well differ on your system.


    Let''s look at a small portion of this file:


    ```

    255 218 185 peach puff

    255 218 185 PeachP

    255 222 173 navajo white

    ```


