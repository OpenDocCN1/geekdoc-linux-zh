    # setuid


    The setuid bit applies only to executable files and directories. In the case of
    executable programs, it means that the given program runs as though the file owner
    running it were. That is, xhetris, a variant of Tetris, which has the following
    permissions on my system:


    -rwsrxr-x 1 games 32516 May 18 1999 /usr/X11R/bin/xhetris


    There''s a pseudo-user called games on the system, which can be logged in to and
    has no home directory. When xhetris program executes, it can read and write to
    files that the games pseudo-user would normally be permitted. In this case, there''s
    a high-score file stored on the system writable by that user. Elvis runs the game,
    the system acts as though he were the user games, and thus is able to store the
    high-score file. To set the setuid bit on a file, you can tell chmod to give it
    mode u+. (You can think of this as uid set, this is not technically accurate.)


    # setgid


    The setgid bit, which stands for "set group id", works almost identically to setuid,
    except that the system acts as though the user''s group is that of the given file.
    If xhetris had setgid games instead of setuid games, the high score would be writable
    to any directory owned by the group games. It is used by the system administrator
    in ways fundamentally similar to the set permission.


    When applied to directories on Linux, Irix, and Solaris (and probably most other
    POSIX-compliant Unix flavors as well), setgid means that new files are given the
    parent directory''s group rather than the user''s primary or current group. This
    can be useful for, say, a directory for fonts built by (and for) a given program.
