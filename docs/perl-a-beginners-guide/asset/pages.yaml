  md: '# 438 Perl: A Beginner''s Guide


    Even though it isn''t always pitched as such, WSH is a successor to the old batch
    file days. WSH is much more powerful and can accomplish many tasks: controlling
    ActiveX controls, popping up dialog boxes, moving files, changing permissions,
    writing information to the Event Log, and much more. Let''s look at an example.


    If you want to write a script in JScript that would pop up a dialog box simply
    saying "Hello, World!", you would put the following code in a file that ended
    with a .js extension (such as hello.js). In the code, we create an instance of
    the Script.Shell object and store the reference to it in the WSHShell variable.
    Next, we call the Popup() method of this object and pass it the text to display,
    the number of seconds to wait until it pops up, and the title of the dialog box.
    The following illustration shows what will be displayed if you execute this script:


    ![](img/2070407c4a70134aab89572f10d21e60_461_0.png)


    Now, if you want to do the same thing in PerlScript, you first need to put this
    in a file named hello.wsf. The .wsf files, unlike the .js files, can contain multiple
    languages within a single file. On the other hand, js files can only contain JScript
    and .vbs files can only contain VBScript.


    Within our hello.wsf file, we first give the code job ID. This is a requirement
    of the WSH. Next, we define the language code is written using the <script> tag
    and setting the language attribute to PerlScript. Next, we use the Echo() subroutine
    of the WScript object to generate a pop-up box that contains our text. To end
    the script, in much the same manner that HTML works, we simply put in our ending
    <script> and <job> tags. The next illustration shows what is displayed.'
