- img_proc: true
  md: '# Module 10: Writing CGI Programs 329


    The GET method, however, puts the information submitted by your users at the end
    of the URL, after a question mark, submitted to your server. This is referred
    to as the query string. Because forms can be large, the GET method can create
    URLs that are huge. For this reason, this method is discouraged.


    +   - enctype Provides the browser with the content type of the form submission.
    This is always set to application/x-www-form-urlencoded for form submissions.


    Taking these attributes into consideration, we have the following <form> tag:


    ```

    <form action="cgi-bin/userinfo.cgi" method="post" enctype="application/x-www-form-urlencoded">

    ```


    # <select> Drop-Down Menu


    A <select> drop-down list box presents choices to a user in a menu-like element.
    This element is a box with an arrow pointing down and to the right of the menu.
    When the user selects the arrow, a list of choices is displayed. To include a
    drop-down list box in a form, you simply need to provide it with a value for its
    name attribute and nest <option> tags within the beginning and ending <select>
    tag.


    Before we list the set of options in the menu, however, we want to introduce the
    menu by asking the user "Where Did You Hear About Us?" So the menu doesn''t appear
    on the same line, these are specified in a heading Level 4 (<h4>). For our <option>
    elements, we give the user the choice to select one of the:


    +   1. Friend


    +   2. Magazine


    +   3. TV


    +   4. Radio


    +   5. Other'
