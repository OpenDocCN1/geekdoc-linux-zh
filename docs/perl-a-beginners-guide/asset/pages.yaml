  md: 'Similar to the pop function, the shift function returns undef if it tries to
    remove the first element from an empty list. When this happens, you won''t get
    any warnings or errors, unless you''re using the -w option, but if you try to
    save the newly deleted element, your scalar variable contents will be set equal
