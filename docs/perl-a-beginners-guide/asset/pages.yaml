    # # But I Have Never Programmed in JavaScript/JScript or VBScript!


    If you haven''t written scripts in either of these languages before, it''s beyond
    the scope of this book to discuss them. Just know they are all scripting languages
    that can have their code embedded in an HTML document between beginning and ending
    `<script>` tags, and can be interpreted by a scripting engine built into the browser.
    So, for instance, you can easily write the current date and/or time to the HTML
    page or create image rollovers, invoked when a user rolls her mouse pointer over
    a given image.


    For more information on these languages, see the following sites:


    +   - http://developer.netscape.com This is where you can find official documentation
