  md: '# Module 3: Control Structures 101


    # Note


    In the previous programming example, we used an if single line conditional statement
    with the next control statement to specify when it should be executed. If we had
    used only the next control statement itself, the print statement inside the statement
    block would have been skipped on every loop iteration.


    The previous programming example should give you a good idea of how the next control
    statement functions. Now let''s move on to cover another control statement that
    can be used inside a program loop.


    # The last Control Statement


    The last control statement is similar to the next control statement we just covered,
    except it terminates the loop upon execution. The syntax for the last statement
    is simply:


    ```

    last;

    ```


    Here''s a programming example to demonstrate how the last control statement functions.


    ```

    #!/usr/bin/perl

    $a = 15;

    while ($a < 25) {

    $a++;

    last if ($a == 20);

    print "$a is still less than 25 \n";

    }

    print "exiting\n";

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_124_0.png)


    The following illustration shows the screen output for the last control statement
    programming example.'
  merge: -1
