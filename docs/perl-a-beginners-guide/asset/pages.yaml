  md: "The world of a programmer would be perfect if it weren't for one little pesky\
    \ problem: errors. In this inodule, we discuss the most common errors, and how\
    \ to find and fix them.\n\nSeveral different kinds of errors can occur, but for\
    \ a new programmer, the most common are syntax errors. The first section of this\
    \ module focuses mainly on how to find these errors and correct them as easily\
    \ as possible.\n\nOnce a program is freed of all syntax errors, it can be executed.\
    \ Any program that can be executed can run in conjunction with the Perl debugger.\
    \ The last section of this module focuses on using the Perl debugger. We also\
    \ discuss the -w command line option before we finish this module.\n\n# Understanding\
    \ Error Messages\n\nMost of the error messages you see in Perl are syntactically\
    \ related. Until you rid a program of all its syntax errors, it cannot be executed,\
    \ and therefore is useless. The Perl interpreter is what finds these errors when\
    \ it's trying to interpret the code you have written so it can be executed. Because\
    \ of this, if you have syntax errors, you see them when you try to execute a program.\n\
    \n# Seeing Errors\n\nAs previously stated, if you have syntax errors, they appear\
    \ when you try to execute your program. The Perl interpreter does its best to\
    \ discover what you really mean, so it can determine what is wrong or missing.\
    \ Most of the time, the error messages generated by the interpreter are good enough\
    \ to help you find the errors quickly. To show you what some of the common error\
    \ messages look like, let's use a simple example program from one of our earlier\
    \ modules. First, we show it in working condition. The working program is as follows:\n\
    \n```\n#!/usr/bin/perl\n$a = 15;\nwhile ($a < 25) {\n  $a++;\n  last if ($a ==\
    \ 20);\n  print \"$a is still less than 25 \\n\";\n}\nprint \"exiting\";\n```"
  merge: -1
  pgno: 419
- img_proc: true
  md: "# Module 12: Error Messages and Debugging 397\n\nThis program contains a while\
    \ loop and a “last” condition that exits the loop prematurely if $sa equals 20.\
    \ Now, to demonstrate an error message, we leave the semicolon off line four in\
    \ this program. The new test program is as follows.\n\n```\n#!/usr/bin/perl\n\
    $sa = 15;\nwhile ($sa < 25) {\n    $sa++\n    last if ($sa == 20);\n    print\
    \ \"$sa is still less than 25 \\n\";n}\nprint \"exiting\";\n```\n\nWe know the\
    \ statement, $sa++, requires a semicolon at the end to be syntactically correct.\
    \ Let’s try executing this program to see the error message that generated.\n\
    The output of the previous programming example can be seen in Figure 12-1.\n\n\
    As you can see from the screenshot, the Perl interpreter told us a syntax error\
