    \ before discussing it in detail.\n\n```\nforeach scalar variable (array variable)\n\
    {\n  'foreach' statement block\n}\n```\n\nThe scalar variable in the foreach statement\
    \ will be set equal to the current element being used from the array. Note, once\
    \ the foreach statement has completed execution, the scalar variable is reset\
    \ to equal the value it was before the statement began execution. A variable that's\
    \ only valid in certain sections of a program is said to have a scope in those\
    \ sections. Because the scalar variable has a scope inside the foreach loop only,\
