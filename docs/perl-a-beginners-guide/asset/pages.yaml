  md: '# 268 Perl: A Beginner''s Guide


    To give you an idea of what this might look in real code, here are four examples,
    one from each of the syntax definitions:


    ```

    use mymodule.pm qw(sub1 sub2 sub3);

    use mymodule.pm;

    use mymodule.pm 5.6.0 qw(sub1 sub2 sub3);

    use 5.6.0

    ```


    The first thing you''ll ask is what is the qw() function? This is simply a shorthand
    for specifying items you wanted quoted and separated (triggered by space). In
    our example qw(sub1 sub2 sub3) is the same as ''sub1'', ''sub2'', ''sub3'', which
    is the parameter list the use() function takes to determine which subroutines
    you want import.


    # require()


    The require() function, which isn''t quite as powerful as use(), lets you demand
    the semantics specified by EXPRESSION, as shown in the syntax definition for this
    function is follows, to be included in the program for proper execution when called.
    Part of the reason this isn''t preferred over use(), is because it isn''t loaded
    when the program is started. So, for instance, if the file doesn''t exist, then
    you won''t discover this until it reaches that point in your script when the script
    is started.


    The syntax for this function is as follows, where VERSION the version of Perl
    you need to run your script successfully, which also implies to import and use
    the library.


    ```

    require VERSION

    require EXPRESSION

    ```


    The EXPRESSION is a module name, without the .pm extension, and to the path to
    it, using :: as the path delimiters. To give you an idea of what this might look
    in real code, here are two examples, one from each the syntax definitions. The
    second assumes MyModule.pm is in a MyDir directory.


    ```

    require 5.6.0;

    require "MyDir::Module";

    ```'
