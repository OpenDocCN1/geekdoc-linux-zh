  md: '# Moving On


    One of Perl''s major advantages is being able to use it across multiple platforms.
    Other languages like Java and JavaScript also boast this platform independence
    as part of their benefits. But Perl does some hang-ups on certain systems and
    you need to watch out for them. In this module, we introduced many of these hang-ups
    and showed you ways around or pointed out their limitations.


    So, remember, just because your program doesn''t work on a system, that doesn''t
    mean something is wrong with your code. You could be trying to do something the
    Perl interpreter doesn''t support in that environment.


