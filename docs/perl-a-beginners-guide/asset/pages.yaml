- img_proc: true
  md: 'Building on what you already know, you can use the plus “+" and the period
    \." special characters to search for any string of characters other than the newline
    character. This combination of special characters is the simplest solution to
    the first question in the previous 1-Minute Drill.


    The next set of special characters are the right and left square brackets [\[
    and\]. These brackets are used inside the forward slashes to single out a list
    of options that will match. An easy way to think about the way these brackets
    work is to think of an “or” being between each character inside them. Here’s an
    example regular expression and some of the strings that trigger a match:


    ```

    $string = /The year is 200[0123456789]/;

    ```


    Any string that says “The year is,” followed by any year between 2000 and 2009,
    satisfies this regular expression. Here’s another example:


    ```

    $string = ~/I am yelling[.!]/;

    ```


    This regular expression can find a match if the sentence, “I am yelling,” ends
    with either a period or an exclamation mark.


    # Note


    The period isn’t interpreted as a special character because it’s inside the square
    braces. If the regular expression had been /I am yelling.,/ the period would have
    been interpreted as a special character. A match would have still been made because
    the period specifies that the sentence could end with any character other than
    the newline character.


    The square braces can be used with any combination of characters, such as numbers,
    symbols, and letters. If you want to specify a range of numbers or letters, there’s
    a shorter way than just typing them all. You can use the dash “-” character to
    create a range. Instead of typing [0123456789], you can enter [0–9] and it represents
    the same sequence of numbers. This'
