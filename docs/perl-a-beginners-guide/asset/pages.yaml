    # Project 11-3: Creating a Cross-Platform Script


    In this module, we talked about how the operating environment can limit your Perl
    programs. Differences in implementations can sometimes cause problems for programmers,
    so we need to be prepared to address and handle them. But, we must admit, the
    best way to approach a problem, at least first, is to avoid it completely. So,
    because we know we''re going to create a cross-platform script, we''ll go ahead
    and use the Perl 5.002 requirement on the script and use the appropriate checks
    before we perform any system-specific tasks.


    # Step-by-Step


    Before we start this program, here''s what we want to accomplish. This program,
    although it could be added to your whim, won''t be a complicated one. We want
    to ease you into understanding how to determine the system you are on and how
