  md: '# 436 Perl: A Beginner’s Guide


    # Hint


    For more information about PerlScript and what you can do with, check your ActivePerl
    documentation that came with your installation on a Windows machine. In addition,
    you can check the ActiveState Web site at http://www.activestate.com.


    # Server-Side Processing


    Because of the requirements of both ActivePerl and PerlScript on all machines
    interpreting the Perl scripts, one option you might want to explore is using it
    on the server side in conjunction with ASP. Because all interpretations occur
    on this machine, it''s the only machine required to have ActivePerl and PerlScript
    installed.


    # Note


    If you have a farm of Web servers, you need to put ActivePerl and PerlScript on
    all machines that will be running your Perl ASP pages.


    In a sense, server-side PerlScript is a lot like client side. The idea is basically
    that you have embedded Perl code in the body of your HTML documents. The real
    difference, other than a few syntactical ones, is these scripts are executed and
    completed on the server side before the page is returned to the requesting browser.
    For instance, let’s say you want to use ASP’s default language, VBScript, to do
    the same thing we did in our client-side example—write "Hello, World!" to the
    HTML document. To do this, you would have the following lines of code. Put it
    in a file called hello-vb.asp.


    ```

    <html>

    <head>

    <title>VBScript</title>

    </head>

    <body>

    %\ Response.Write(''Hello, World!'');

    %

    </body>

    </html>

    ```'
