  md: '# # Essential Skills for First-Time Programmers


    # # Perl


    # # A Beginner''s Guide


    earn the basics of Perl programming from the tutorials and examples in this easy-to-follow
    resource. **Perl: A Beginner''s Guide** covers fundamentals, such as general syntax
    and semantics, control structures, subroutines, and regular expressions. The book
    explains how to use Perl modules, access databases, web CGI programs, and debug
    code. The examples throughout the book walk you through real-world programming
    tasks. To speed up your progress, the source code for projects is available free
    online. Start programming in Perl right away with this self-paced, step-by-step
    learning solution.


    # ## This Beginner''s Guide is Designed for Easy Learning:


    +   - Modules—Each programming concept is divided into logical modules (chapters),
    ideal for individualized learning

    - Goals—Each module opens with the specific programming tasks you''ll have by
    the end of the module

    - Ask the Experts—Q&A sections throughout are filled with extra information and
    interesting commentary

    - 1-Minute Drills—Quick self-assessment sections to check your progress

    - Annotated Syntax—Example code annotated with commentary that points to the particular
    technique illustrated

    - Projects—Coding exercises contained in each module show how to apply what you
    are learning

    - Mastery Checks—End-of-module reviews that test your knowledge using short-answer,
    multiple-choice, fill-in-the-blank, and simple coding questions


    ABOUT THE AUTHORS:

    R. Allen Wyke, Director of Product Technology at Engage, has expert experience
    in Perl, XML, and JavaScript. He is the co-author of several computer and Internet-related
    books, including The Perl5 Reference and Pure JavaScript. Wyke has also penned
    columns and articles for SunWorld and ITworld.com publications.

    Donald B. Thomas is a software design engineer at Engage Technologies.

    He works extensively with Perl, WML, XML, Java, and JavaScript.


