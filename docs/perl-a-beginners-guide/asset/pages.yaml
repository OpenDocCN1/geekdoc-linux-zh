  md: 'Now you should have a good understanding of what a list can contain

    how to assign lists to array variables. Keeping what you have learned

    in mind, let''s move on to the next section and discuss how to use the data

    stored in an array.


    # Accessing Array Elements


    Once you create a list and store it in an array variable, you must be able

    to access the stored information. Each element of an array has its

    subscript or placeholder. These unique numbers are used as keys to retrieve

    information from the array. Perl uses a standard subscript system, which

    begins with the digit 0 and increments by one until the end of the array

    reached. Consider the following array:


    ```

    @array1 = (2, 4, 6, 8, 10, 12);

    ```


    This array contains six elements. The subscript of the first element ''2''

    is 0, the subscript for the next element ''4'' is 1, and so on. The subscripts

    are used along with the square braces ''['' and '']'' to retrieve or manipulate

    the elements of the array. The syntax for the statement is as follows:


    ```

    $array[0] = S;

    ```


    This line of code accesses the first element of an array named ''@array''

    and replaces that element, regardless of its value, with the digit 5.


    # Note


    The $ character is used whenever you are accessing singular data. The

    $ character and the array name should always be used when you''re

    accessing elements of an array.


    Now, here''s a programming example that demonstrates a few different

    array interactions:


    ```

    #usr/bin/perl

    @array1 = (2,4,6,8,10,12);

    $element1 = $array1[0];

    $element2 = $array1[1];

    $element3 = $array1[2];

    $element6 = $array1[5];

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_143_0.png)'
