    # PostgreSQL Overview


    PostgreSQL is a robust relational database, first started in 1986 as the Berkley
    PostgreSQL Project. The project continued to evolve and progress until 1994 when
    Andrew Yu and Jolly Chen added support for the Structured Query Language. This
    was first released to the open source community and was known as PostgreSQL9.'
