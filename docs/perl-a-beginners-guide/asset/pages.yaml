  md: '# 302 Perl: A Beginner’s Guide


    The query process itself breaks into a four-stage process. We won’t discuss these
    in detail, but they are evident in the underlying examples that we have in this
    section of the module. You can see call and use the subroutines mentioned in this
    list. This process is outlined here.


    +   **Prepare** This process takes your query and validates it. Assuming all your
    syntax is OK (that is, make sure the tables you''re querying exist), then a handle
    for the query is returned.


    +   **Execute** This is the process of calling the execute() subroutine in the
    DBI that executes the query on the database.


    +   **Fetch** This process takes place once your query has completed; the data
    is returned to your Perl program in the form of data structures.


    +   **Deallocation** This process isn’t one that we mentioned, it’s when the DBI
    and corresponding driver perform cleanups, such as freeing memory.


    Obviously, there’s more to this than we mentioned, so we’ll show how each of these
    can be executed using the Perl DBI.


    # SELECT


    SELECT statements are one of the most widely used statements in interacting with
    databases. These are the statements that say, “Show me things in the database.”
    “These things,” of course, refer to the items that match the type of select you
    perform and the criteria you pass.


    Let’s take our users table, which we defined at the stage of the module as an
    example. If you want to return the lastname of all people entered into our users
    table, you would do this by saying


    ```

    SELECT lastname FROM users;

    ```


    If you want to return all data from the table, you can use the wildcard, such
    as


    ```

    SELECT * FROM users;

    ```'
