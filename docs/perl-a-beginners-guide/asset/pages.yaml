- img_proc: true
  md: '# Return Codes


    The return value of the system() function is the exit status of the program, as
    returned by the wait() system call. If you have a -1 returned by the $ variable,
    then an error has occurred. You can obtain a description of the error by accessing
    the $ variable. The following quick example, which we name sys_test.pl, shows
    how this might work.


    # Note


    Because of the wait() works on Windows''s systems, you must divide the returned
    value by -256 to get the actual exit status. So, in the following example, you
    need to replace $exit = $? with $exit = /-256.


    ```

    #!/usr/bin/perl -w


    # store command and arguments in array

    @args = ("abdef", "blah", "blah", "blah");


    # call system() function

    $result ~ system(@args);


    # if $exit contains anything, store values in appropriate variables

    $exit = $? # contains exit status

    $sig = $? & 127; # contains signal number

    $core = $? & 128; # contains 1 if program performed core dump


    # if $system() returned non-zero then problem.

    # program and store error information to STDOUT

    $result == 0 or die "\n" "@args = @args\nExit: $exit\nSignal Number: $sig\nCore:
    $core\nMessage: $$"

    ```


    In this example, we first stored a fictitious command, abdef, and its arguments,
    in an array. We then pass them to the system() function and store the results
    of doing so in the $result variable. By storing the result, as you see shortly,
    we can check to see if an error did occur. But, before we do so, we store any
    values $? in specific variables.


    As mentioned earlier, if $? contains -1, then a problem occurred. In addition,
    a bitwise AND comparison with 127 returns a signal number and the same type of
    comparison with 128 tells you if a core dump occurred. These are generated if
    the program performs a bad operation,'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# Module 11: Cross-Platform Functions and Issues 371


    whereby all the memory and state information is written to a file that can later
    be analyzed. In our example, we stored these values in variables, so we can output,
    if needed.


    The final line in our program checks to see what happened when we called the system().
    If the result returned in our variable is equal to zero, then all went well and
    the program is running. If a problem occurred, however, we stop the execution
    of the program with the die() function and write the original command and argument
    array and our variables to STDOUT. In addition, we also write the value of $,
    which contains a description of the error that occurred. Running this program
    on the Windows platform results in what is shown in Figure 11-1.


    # Note


    As you can see in Figure 11-1, some operating systems write their own message
    to STDOUT if an error occurred. Windows wrote "The name specified is not recognized
    as an internal or external command, operable program, or batch file." This varies
    from system to system, but it''s normal.


    ![](img/2070407c4a70134aab89572f10d21e60_394_0.png)


