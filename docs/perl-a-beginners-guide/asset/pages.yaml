  md: '# Polymorphism


    Polymorphism is the idea that a method can have different actions depending on
    what type of object called it. This idea is used often by C++ programmers who
    need methods to react differently to different objects. A good example would be
    if you have a method shift, which exists in two different classes—one for manual
    and the other for automatic transmissions—designed to change gears on anything
    from cars and trucks to lawnmowers. This method would need to react differently
    depending on whether the vehicle was an automatic or a manual transmission. Polymorphism
    is the idea that the language can choose either method at run time without generating
    any problems because of type difference.


    ![](img/2070407c4a70134aab89572f10d21e60_455_0.png)


    # 1-Minute Drill


    +   * What functions are used to create inheritance?

    * What function is used to keep data specific to an enclosing block?


    Now let''s move on to the next section, where we discuss PerlScript and its many
    uses.


    # PerlScript


    PerlScript is a technology developed by our friends at ActiveState and is part
    of the ActivePerl distribution. At its core, PerlScript is an interpretation engine
    for interpreting and executing Perl scripts and programs. But it''s different
    than the Perl interpreter because it contains extensions that allow these Perl
    scripts to be executed native to the Windows environment.


    +   * Use() and @ISA

    * my()'
