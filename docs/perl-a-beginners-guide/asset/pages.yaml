  md: '# Module 5: Program Flow and Subroutines 171


    # Arguments


    Arguments represent parameters that can be passed to a subroutine for processing.
    Here are the technical details. When arguments are passed to a Perl subroutine,
    they are stored in a @_ local array and can be accessed using the $_[index] format.
    So if you want to grab the first argument for processing, you would access it
    from $_[0]. A second argument, if passed, can be accessed from $_[1], and so on.
    Remember, arrays are zero-based, so the first element in an array is in the 0
    position.


    > Note

    Values in the @_ array are actually aliases to the arguments. If the value of
    an argument changes outside the subroutine, so does the value of the argument
    to the subroutine.


    We bet your first question is, “What happens if only two arguments are passed
    and I try to retrieve a third one?” Well, as you''ve seen in the language, Perl
    is forgiving. If you try to retrieve an argument position that doesn''t exist,
    you simply get a null or undefined value, not something unexpected. Also, if the
    argument passed is an array or hash element that doesn''t exist when the subroutine
    was called, it''s only created if it''s modified or the reference is taken.


