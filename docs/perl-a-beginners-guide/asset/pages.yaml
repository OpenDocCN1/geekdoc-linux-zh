  md: '# UNIX


    UNIX was the platform that started it all. In fact, as you learn the Perl language,
    you can see UNIX characteristics and commands embedded deep within the language.
    This isn''t a bad thing though, because if UNIX excels at anything, it''s what
    can be accomplished with a simple shell script or commandline access. Table 1-1,
    on the preceding page, has a list of some of the supported UNIX flavors on which
    you can run Perl.


    # Mac OS


    The current Macintosh version of Perl is one of the most interesting ports that
    you are going to hear about. As many of you out there have used a Mac know, this
    particular platform is usually not thought of as an administrative type of operating
    system. Also, it has its built-in scripting language called AppleScript that has
    an unbelievable amount of power, which begs the question, “why Perl?”


    As previously mentioned, Perl programmers are a tight-knit group and having the
    capability to control systems and run scripts on any platform is a powerful thing—so
    why not Mac? The Mac OS can also run a Web server, so the need certainly exist
    to build CGI scripts for those instances as well. And, if you are using a Macintosh
    and reading this book, then you already have a reason—just because.


    Like the Windows platform, the Mac implementation of Perl has its own sort of
    versioning system. MacPerl didn''t support every release of the standard distribution,
    so to model the versioning system of this Mac port after it wouldn''t have been
    a wise choice. This is why we MacPerl 4.1.8 implemented Perl 4.036, and the current
    release, MacPerl 5.2.0r4, supports Perl 5.004_0.


    # Others


    Obviously, we don''t want to discuss every single Perl can run on in this book.
    Sure, many different characteristics and items should be understood before programming
    on systems other than the Big Three, but this isn''t something a beginner needs
    to worry about.'
