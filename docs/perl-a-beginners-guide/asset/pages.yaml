    Now that we''ve covered how to initialize the debugger, list programs, and exit,
    we need to discuss how to step through a program.


    The easiest way to step through a program is to use the s option. This option
    executes the current displayed line. Figure 12-10 shows the screen output from
    a few statement executions on our example program.


    You can see in Figure 12-10, we executed six statements in the example program.
    Each time the S command is issued, the current line, is listed on the previous
    line of output on the right-hand side of the screen, is executed. The S command
    is designed to execute each line of a program in order. Even if your program jumps
    to different subroutines, only one line is executed each time the S command is
    issued.


    # Note


    After you enter the S command once, you needn''t reenter it each time you want
    to execute another program. You can simply press Enter to reenter the S command
    as many times as you need. You can even enter another command, such as the l command,
    to see where you are in the program, and then continue to press Enter for additional
    steps without having to reenter the S command.


