  md: '# Module 8: Packages and Modules 271


    @EXPORT

    EXPORT is an array of symbols you want to export by default, so when users load
    a library by calling the use () function, they have access to these subroutines
    immediately. Be careful here you may be returning subroutine names that conflict
    with other names programmers using your library may be using. For this purpose,
    using @EXPORT_OK is usually the preferred method, unless you have a reason to
    do otherwise.


    @EXPORT_OK

    The @EXPORT_OK array is much like @EXPORT, except it''s a list of symbols to export
    on request by the user of the module. Basically means the module author is making
    the list of symbols available for the module to use, but they won''t be automatically
    available unless the user specifically asks for them.


    %EXPORT_TAGS %EXPORT_TAGS, defines the names for sets of symbols. In other words,
    you could group a set of subroutines you want to export together under a specific
    name, which enables a user who wants to import that set to specify a single item,
    rather than a complete list. This also lets you provide an anonymous method of
    importing your subroutines without the user having to know their names.

    So, for instance, if you have a module called MyHTTP and you want to organize
    the exportable subroutines in this module into two categories (let''s say header
    and body), then you may have something like the following %EXPORT_TAGS entry:


    ```

    %EXPORT_TAGS = (header => [qw(sub1 sub2 sub3)], body => [qw(sub4 sub5 sub6)]);

    ```


    Now, if the user only wants to import sub1, sub2, and sub3, which we grouped under
    header, she could have the following line in her code, which simply puts a : in
    front of the header item:


    ```

    use Module qw(:DEFAULT :header);

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_294_0.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 272 Perl: A Beginner''s Guide


    See how easy that was? OK, I know you''re wondering about the :DEFAULT parameter.
    As mentioned, Exporter is a module, so if you want more information about it,
    be sure to check the documentation. To quench your thirst for knowledge, though,
    here''s a quick summary about DEFAULT and the use of the :before and it header.


    # Note


    You cannot also use the names you specify in the %EXPORT_TAGS lists in @EXPORT
    or @EXPORT_OK. Additionally, the tags (not the names) in @EXPORT_TAGS MUST also
    appear in @EXPORT. So, for instance, if you have %EXPORT_TAGS = (header) -> [qw(sub1
    sub2 sub3)], then you cannot use header in @EXPORT or @EXPORT_OK, but sub1, sub2,
    and sub3 must also appear in @EXPORT or @EXPORT_OK.


    # A Quick Look at Syntax


    The syntax of users of Exporter has some special functionality. It lets you control
    some of the items imported from the module, as well as shortcut to import more
    than one item. This control is done through the use of :, /, , and ! Table 8-1
    shows how it works. Note, ! is nothing more than an optional item that tells Perl
    NOT to import the item. Basically, it''s Exporter''s answer to the no () function.


    # import ()


    This function contains all the necessary exportable items for the library and
    is a method you may see instead of the Exporter module. Here''s the deal with
    import (). When the use () functions are called in your script,


    Syntax | Description

    [1]:sub | Import or not import this subroutine, referenced by sub, only

    [1]:DEFAULT | Import or not import all subroutines in the @EXPORT array

    [1]:tag | Import or not import all names in %EXPORT_TAGS (tag) anonymous list,
    which means the actual tag names aren''t passed to the script, but rather their
    names

    [1]/pattern/ | Import or not import all names in @EXPORT and @EXPORT_OK, which
    match the pattern specified


    Table 8-1 Exporter Syntax for Loading Modules and Their Subroutines'
