    floating out there, we use the MacHTTP server that comes with the operating system.


    The first thing to do is open the Web Sharing Control Panel. This panel, which
    is shown in the following illustration, lets you do the following.


    +   * See your Web address, which reflects the IP address you can use to access
    the documents served by this server.

    * Specify the folder you want to store your Web documents, which defaults to Web
    Pages, which is located on the drive with Mac OS.

    * Specify the default document to serve when the root of your server is requested.

    * Start and stop your Web Sharing services.

    * And, finally, specify the level of security you want to impose on the requests.


    ![](img/2070407c4a70134aab89572f10d21e60_346_0.png)


    Once you''ve launched this Control Panel, you should verify these settings and
    make sure they''re set to the values you want. Simply accepting the default values
    should be fine for anything we do in this book. Once opened, select the Preferences
    item from the Edit menu of this Control Panel. This displays a dialog box that
    has three tabs.'
