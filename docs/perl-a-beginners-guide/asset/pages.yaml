- img_proc: true
  md: 'The complete HTML—including the heading, <select>, and nested <option> tags—looks
    like the following. Note, the value attribute of the <option> tag instructs a
    Web browser simply to use these values when it''s submitted to your server, instead
    of the text between the opening and closing option tags.


    ```

    <h4>Where Did You Hear About Us?</h4>

    <select name="Friend">

    <option value="frieend">Friend</option>

    <option value="mag">Magazine</option>

    <option value="tv">TV</option>

    <option value="radio">Radio</option>

    <option value="other">Other</option>

    </select>

    ```


    # <select> Multiple Select Box


    If you''d rather display a list of items a user can select from rather than a
    single pull-down menu, a multiple selection list box is the variant of choice.
    Not only does it enable you to select more than one item, but it lets the Web
    developer specify how many of the items will be displayed (that is, items to which
    you neednt scroll).


    # Note


    The particular way a user selects elements elements depends on the browser. Most,
    however, follow some form of control or option click.


    To include a multiple selection list box in our form, we must do the following:


    +   1. Introduce the list box by saying the items reflect Music Tastes. You can
    do this using the code:


    ```

    <h4>Music Tastes</h4>

    ```


    +   2. As you did with the menu list box, insert a <select> tag after the introduction
    text. Within this tag, specify values for the name and size attributes. The size
    attribute tells the browser to display the number of lines in the box. Additionally,
    you want to include an attribute called multiple, which is the actual key for
    the browser'
