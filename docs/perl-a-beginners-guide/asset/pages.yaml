  md: '# Perl: A Beginner’s Guide


    This regular expression triggers a match as long as the last character isn''t
    one of the numbers from one to nine.


    > Make sure you don''t confuse "^\


    Perl provides you with a set of character class abbreviations that can be used
    as a shorthand for different sets of characters. Earlier in this module, you were
    introduced to the dash "-" character and we showed how it can be used to save
    time when designating a range of letters or numbers. These character class abbreviations
    are even shorter-hand method of selecting the complete ranges of characters like
    zero through nine and a through z. The following table lists each character class
    abbreviation and what it represents.


    | Character Class Abbreviation | Represented Character Class | Description |

    | --- | --- | --- |

    | \d | [0-9] | Digits |

    | \D | [^0-9] | No digits |

    | \w | [a-zA-Z-0] | Words |

    | \W | [^a-zA-Z-0] | No words |

    | \s | [\h\n\t] | Spaces |

    | \S | [^\h\n\t] | No spaces |


    As you can see from the preceding table, this character class abbreviations can
    be used as a shorthand to represent different groups of characters. They can be
    used anywhere a normal character is valid in creating a regular expression. The
    following is a short programming example that demonstrates the use of a few these
    abbreviations.


    ```

    #!/usr/bin/perl

    $string1 = "The year is 2000 and it is going to be over soon";

    print "String 1 contains, $string1 \n";

    $string2 = "Next year will be 2001";

    print "String 2 contains, $string2 \n";

    print "We are searching for four digits followed by a whitespace \n";

    ```'
