  md: '# Module 5: Program Flow and Subroutines 165


    locations (that is, subroutines at the bottom, global variable declarations at
    the top), and write the main body of your code so it flows in a way that makes
    sense. This is best explained with an example, so let''s step through one.


    Say we''re creating a script that can open a text file, count the number of lines,
    and then write the number to a separate file. Several steps are involved in accomplishing
    this task, but they can be summed into the following:


    +   1. Opening the input file for reading

    2. Opening the output file for writing

    3. Count the number of lines of the input file

    4. Writing the result to the output file

    5. Close the input and output file


    The first thing we need to do is open both input—Step 1—and an output—Step 2—file.
    This is done using the Perl () function. This function takes a filehandle, which
    is a string used by your code to refer to the opened file and the name of the
    file it is to open. In addition, we want to see if the file successfully opened,
    so we include a little error checking. The code we use to accomplish these first
    two steps is


    ```

    # open our input and output files

    open(INFILE, "input.txt") or die "Error (input): $!"

    open(OUTFILE, ">output.txt") or die "Error (output): $!"

    ```


    > Note—We won''t go into any detail on the open () function in this module because
    it''s covered in Module 6, "Working with Files and Directories."

    Notice that INFILE and OUTFILE are the filehandles, and the > before the output.txt
    reference means the file was opened for write access. $! contains the error message
    if an error occurs.


    The next thing we need to do is count the number of lines in the input.txt file.
    To do this, we define a variable, $counter, to hold'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 166 | Perl: A Beginner’s Guide


    the currently running count, and we use a while loop to iterate through the file.
    The following is the code we use:


    ```

    # declare a variable to hold the count

    $counter = 0;


    # iterate through the file one line at a time

    # and increase the counter on each pass.

    while(<INFILE>){

    $counter++;

    }

    ```


    After we count the number of lines, we want to print that value to the output.txt
    file. As in the past, we use the print () function to perform this task. Because
    we are printing to a specific file, we pass an additional argument that tells
    the print() function to print to the OUTFILE filehandle. This looks like the following:


    ```

    # print the value of the counter to the OUTPUT file

    print OUTFILE "The file contained $counter lines";

    ```


    The final step in this short program is to close the files we opened for processing.
    This includes both the input and output files. To do this, we use the close()
    function, which simply takes the filehandle as an argument to close the file.


    ```

    # close the files

    close OUTFILE;

    close INFILE;

    ```


    Does it feel? Our program is complete. All we have to do now is put it all together
    in one file. We included one here so you can see how we suggest you organize it.
