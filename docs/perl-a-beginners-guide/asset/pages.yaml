    # The Exporter Module


    The Exporter module is a module shipped with Perl, which more or less organizes
    the process of exporting items from your module. It provides mechanisms for version
    control and other functionality. We only discuss some of the functionality the
    Exporter module provides, but if you want more information on this module, check
    your Perl documentation (nunder the use( ) entry in the Perl manpages for a link).


    The general syntax for using this module in a module is as follows, where Module
    is the name of the module. We discuss @EXPORT, @EXPORT_OK, and %EXPORT_TAGS in
    the following subsections, so don’t worry about those yet.


    ```

    package Module;

    require Exporter;

    @ISA = qw(Exporter);

    @EXPORT = qw(...);

    @EXPORT_OK = qw(...);

    %EXPORT_TAGS = (tag => [...]);

    ```'
