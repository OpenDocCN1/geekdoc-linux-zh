    Now that we''ve covered the basics of regular expressions and pattern matching,
    we''ll go into much more detail about all the options you have at your disposal.


    # Pattern Matching Syntax


    You can specify a regular expression in a variety of different ways. Given the
    tools Perl provides for this, you should be able to locate any type of pattern
    in a string of information. Let''s move on to the section of this module that
    covers all the options you have when you specify a regular expression.


    # Regular Expression Options


    As previously stated, you can use an abundance of options in creating a regular
    expression that will work for you. We begin by covering the easiest options and
    work our way up to some of the more difficult, powerful, options Perl has to offer.


    Before we discuss the regular expression options, here''s a programming example
