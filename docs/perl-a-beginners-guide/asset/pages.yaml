    # # Hint


    Want more information on HTTP headers? Check out http://www.w3.org/Protocols and
    look for the link to RFC 2616.


    # # Sending and Receiving Data


    To receive information from a browser and create dynamic documents based on the
    information, you need to take the data passed from the browser. As we discussed
    in the section about forms, this is done using the GET and POST methods. No matter
    which method you use, the browser passes the data to the CGI program, which can
    then act on it.


    In this section of the module, we look at how this information is sent and received.


    # # URL Encoding


    Before getting into the specifics of how data can be read, you should know that
    a browser encodes the data when it is passed. This encoding, which is called URL
    encoding, is the format the browser uses to represent the input from the form
    when it sends it to the server. During this process, the browser takes all the
    keys and values from the form and formats them in key=value pairs. No matter which
    method you use to pass the data, each pair is separated by the ampersand (&).


    # # Hint


    Need another look at how this will appear? It''ll look something like this: key1=value1&key2=value2&key3=value3.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Module 10: Writing Programs 343


    Another part of this process involves changing special characters into their hexadecimal
    equivalent. These are also called ASCII escape sequences. These sequences appear
    as %num, where num is the two-digit hexadecimal number. For example, a plus sign
    is %2B, and an apostrophe is %27.


    # Environment Variables


    Once the data has been sent to the server, you can obtain that information before
    you process in a special way. Additionally, you may want to take other bits of
    information into consideration in your script. This information is stored in CGI
    environment variables.


    When the Web server receives a request for a CGI program, it passes on a set of
    environment variables that contain information about the server and its environment.
    The Web server also adds to that set of information about the browser and the
    current request. After the server executes the script, it takes the output and
    sends it back to the browser. Table 10-1 contains the CGI environment variables
    common in most servers.


    # Note


    Different servers have different variables. They can also have different names
    for variables, although this generally isn''t the case.


    | Environment Variable | Description |

    | AUTH_TYPE | Type of authentication used to validate the user. |

    | CONTENT_LENGTH | Size of the content file returned. |

    | CONTENT_TYPE | Content type of the POSTed data. |

    | GATEWAY_INTERFACE | CGI version the server supports. |

    | HTTP_ACCEPT | MIME type the browser accepts for this request. |

    | HTTP_USER_AGENT | Complete name/identifier of browser. |

    | PATH_INFO | Path information, such as /sports/basketball. |

    | PATH_TRANSLATED | The translated PATH_INFO, which is also called the physical
    path. |


    Table 10-1 Common CGI Environment Variables'
  merge: -1
