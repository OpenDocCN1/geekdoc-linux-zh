    # Encapsulation


    Encapsulation is the idea that a group of data and functionality can be hidden
    from other programmers. One of the great things about OOP is these things can
    be hidden. Program users should never need to see the inner workings of a class
    to use its functionality.


    Let''s say, for example, you are writing code for a big software company and the
    code you write must be used by your customers. You wouldn''t want your customers
    to get to all your data or even able to see what''s going behind the scenes. OOP
    can help you take care of these issues. One golden rule of OOP is this: you should
    document all classes so any user can use them without a lot of trouble. Ideally,
    you want the user of your class to be able to use it without ever needing to know
    what is actually happening in the class.


    The best way to ensure that all data is hidden is to use the my function. This
    function ensures the selected variables in a subroutine have a scope in that subroutine.
    The my () function can be seen in use in the class example, which we discussed
    earlier in this module.


    # Inheritance


    Another important concept OOP brings to the table is inheritance. No, you won''t
    be receiving any large unexpected amounts of money from


    +   * In a class or package

    * bless()

    * Methods from the class in which the object''s behavior was specified'
