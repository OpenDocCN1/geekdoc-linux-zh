  md: '# Perl: A Beginner''s Guide


    > Hint

    Did you have trouble building this database driver? First, check the official
    DBI Web site (http://www.symbolstone.org/technology/perl/DBI) for answers. If
    you find nothing, then you can try the dbi-users@isc.org mailing.


    # Using the DBI


    Now that PostgreSQL is running, the tables we need for our examples are created,
    and the DBI and DBD modules are installed, we can start doing some programming!
    In this section of the module, we introduce you to the DBI, talk about connections
    and queries, and discuss errors and a few other features. Some of these, as you
    might imagine, require a knowledge of databases, and we''ll try to separate that
    as much as possible. If you have previous experience with databases, this can
    only help you.


    # Connections


    The connection between PostgreSQL and the Perl DBI is accomplished by the connect
    () subroutine. This subroutine accepts up to four parameters, which include the
    data source of the database server, the username to connect as, the password for
    the user, and an optional attribute list that can dictate how the connection is
    made and any options you want to specify. This attribute list, for instance, can
    be used to set the AutoCommit and PrintError to off. We show an example in this
    second. The format for using the connect () subroutine is follows, where the {attribute_list}
    is optional.


    ```

    DBI->connect($ds, $user, $password, [{attribute_list}]);

    ```


    Looking at the data source parameter ($ds), this value can contain as little as
    the database name and driver name, but can also take the hostname and port of
    the database, or even more, depending on the driver. To illustrate this, here
    are syntax examples. In these examples, you replace <driver> with the name of
    the driver being used, <db_name> with the name of the database, <host> with the
    machine''s hostname, and <port> with the port number to which the database client
    is listening.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI | 299


    Note

    Be sure to check the documentation of your database driver to see the exact syntax
    of the data source. PostgreSQL, for instance, can also take an options and tty
    parameter.


    ```

    dbi:<driver>:<db_name>

    di:<driver>:<db_name>@<host>:<port>

    dbi:<driver>:database=<db_name>;host=<host>;port=<port>

    ```


    # available_drivers() and data_sources()


    The Perl DBI includes two subroutines to help verify the driver you need is installed
    on the system, and if the driver supports it, can help you determine the data
    sources (databases) to which the driver can connect. These subroutines are the
    available_drivers() and data_sources() routines.


    The available_drivers() routine, when called, searches through the directories
    in your @INC environment. Basically, it looks for DBI:* modules, where * could
    be something like Pg, Oracle, Informix, and so forth. The syntax for this looks
    like the following.


    ```

    @driver_array = DBI->available_drivers;

    ```


    The second subroutine, data_sources(), can be used to return all the database
    names a driver can access. Not all drivers support this, so you need to check
    to make sure the return value isn''t empty or undef. The syntax for this routine
    is the following.


    ```

    @ds_array = DBI->data_sources($driver);

    ```


    One of the biggest performance hits on your database by application is the initial
    connection. Because of this, we recommend you use persistent connections for your
    applications. This means you open a connection and hold it open as long as its
    needed, which could be for the entire program. This is because the establishment
    of a connection can take upwards of 90 percent of the total time to execute a
    single query. If you hold the connection open for other queries, however, subsequent
    queries won''t experience this delay.


    9'
