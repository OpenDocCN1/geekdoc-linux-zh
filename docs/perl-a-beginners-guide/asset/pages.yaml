  md: "```\n$a = 12;\n$a += 5;\nprint \"a equals $a\\n\";\n```\n\n# Note\n\nThe previous\
    \ statement blocks are identical in functionality even though the curly braces\
    \ are in different locations. You can put the curly braces anywhere want as long\
    \ as they are before and after the lines of code you want to encompass the statement\
    \ block.\n\nThe lines of code in a statement block are always guaranteed to be\
    \ executed, so they can be referred to as unconditional statements. An empty statement\
    \ block is accepted in Perl, but it probably won't be helpful to you.\n\nNow that\
