    and is commonly referred to as manpages, a term that reflects Perl''s UNIX roots.


    # Distribution Documentation


    Within UNIX, you can access the introductory page of this documentation simply
    by typing man perl. Once opened, you not only see information about Perl, you
    also see the names of other manpages, such as perldelta, perliag, and perlunc,
    which are available. You can access these pages in'
