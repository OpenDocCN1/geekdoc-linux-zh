    # Type Conversion


    In this module, we discussed two different data types: numbers and strings. Because
    both of these data types are stored in the same kind of variable, at one time
    or another, you''ll probably mix data types by mistake. This isn''t a major problem,
    as it will be in most programming languages.


    A type conversion takes place when you try to use a number with a string operator
    or versa. For example, if you pass a string containing “12cats” to a numeric operator,
    the “cats” portion of the string is dropped and the integer value 12 is used for
    the calculation. Perl removes any leading space characters and trailing nonnumeric
    characters when performing type conversions from strings to numbers. If you pass
    a number (for example, 145) to a string operator, the number is converted to a
    string. A good example of how this might happen is if you want to make a “less
    than” comparison on two different numbers and you use the ‘lt’ operator instead
    of the ‘<’ operator. Your numbers are now compared according to their ASCII values.
    The string “3” is greater than the string “290” because the ASCII value of 3 is
    greater than the ASCII value of 2. You can see this would cause a problem in calculations
    if you were expecting an integer comparison.


