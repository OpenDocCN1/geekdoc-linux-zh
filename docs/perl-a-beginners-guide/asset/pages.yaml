  md: '# Module 8: Packages and Modules 267


    +   - How to access, or load, libraries into your scripts

    - How the subroutines in the packages and modules are exported, you can understand
    how to create your own


    # Constructor and Destructor


    When a package is loaded, the first thing the Perl interpreter looks for is the
    BEGIN subroutine, or the constructor. As mentioned earlier in the book, everything
    in this routine is executed before the script continues. If you want to declare
    any special variables or pull in any other packages for your package, this is
    where you do it.


    On the flipside this is something we call the destructor—this is the last thing
    the Perl interpreter looks for exiting the scripts. If you need to perform any
    last tasks in your package before the scripts stop executing, as write out to
    a log file, you include this functionality in the body of an END subroutine. This
    END subroutine is the destructor.


    Now that you know all about packages, let''s move on to modules, which inherit
    everything we''ve said about packages up until this point.


    # Loading Libraries


    Before you can use any subroutines or access any properties in a package, you
    must first tell the Perl interpreter you want to use a particular package. This
    can be done using the following methods.


    ```

    **use()**

    ```


    the use() function in Perl lets you import semantics into the current package
    from the named module at compile time. The syntax for this function is as follows,
    where Module is the name of the Module, LIST is a list of subroutines you want
    to import, and VERSION is the version of Perl you need to import and use the library
    successfully.


    ```

    use Module LIST

    use Module

    use Module VERSION

    use VERSION

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_290_0.png)'
