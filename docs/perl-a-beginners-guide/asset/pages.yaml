  md: '# What Is Perl/Tk?


    Have you ever wanted to build a native UNIX or Windows application that contained
    windows, dialog boxes, menus, and all the other components you see in everyday
    applications? More than likely, your answer here will be "Yes," or at least you''d
    admit you''d like to know how to do this.


    Even though languages like Java have done a lot to bridge the gap, writing these
    GUI applications is a hard task. Each language, be Visual Basic, C, or Java has
    its own perks and quirks. But, if you want to continue and learn how to write
    these applications, consider it in Perl/Tk.


    Perl/Tk is a module you can use in your scripts that provide access to windowing
    components. This is somewhat similar to the windowing components we accessed and
    used in our previous WSH examples, but they''re a little different. The components
    don''t simply pop up boxes or in buttons. They are windows and buttons you must
    place in the appropriate locations to create your interface.


    # Overview of the Toolkit


    Perl/Tk comes with a wide variety of widgets you can use in your application.
    These include, but aren''t limited to, the items listed in Table 13-1. As you
    can see, all these items are used to make a graphical user interface. They''re
    common items we see in applications everyday, so you should be familiar with what
    they are and how they work.


    > Note


    You may notice many of these are similar to the items available in an HTML form.
    If you''re familiar with HTML forms and the various elements you can use in them,
    then these items will be easy for you to understand.


    GUI widgets alone don''t make up everything, however. Once you have these widgets
    in place, you have to enable them to do something. For instance, when someone
    clicks a button or selects a check box, what happens? These items don''t know
    what to do unless you write the appropriate code to handle these events.


    To give you an idea of what can cause an interaction, we''ve included some common
    events in Table 13-2. When these events occur, you can write code to perform a
    task. Think of them as the initiator of your code.'
