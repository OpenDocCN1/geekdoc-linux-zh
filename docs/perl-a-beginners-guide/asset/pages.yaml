    \ for example, can cause an exception\nbecause most implementations of signal\
    \ () are limited. Because of\nthis, signal may only work for setting flag variables\
    \ in the handler and\nother simple tasks.\n\nOne way to handle this correctly\
    \ is if you're writing a script that's\nposed to work on many different systems\
    \ is to check the $^O variable.\nThis variable returns a name for the system that\
    \ you can use in the\npropriate if statement before performing any system-specific\
    \ functions.\nTable 11-2 shows the various strings that can be returned using\
    \ this\nvariable in Windows and DOS-based systems.\n\n# Note\n\nThe $^O variable\
    \ wasn't added until Perl 5.002. You may want to use the\nrequire() function to\
