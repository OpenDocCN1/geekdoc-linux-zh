  md: '# Ask the Expert


    **Question:** Maintaining my programs and packages in directories sounds like
    a good idea, but I need to organize a LOT of files—more than one I want to create
    directories for. Is there a better way to organize these files?


    **Answer:** Yes. Several applications enable you to create “trees” of code. For
    instance, you might create a Web site tree, within that tree, you might have a
    “branch” for your forms, another branch for personalized pages, and so forth.
    These applications also enable you to control access to programs for editing and
    version control. The process is rather simple: if you need to make a change to
    a program, you can check out the script, which blocks all others from using it,
    and then check the script in again. (http://msdn.microsoft.com/ssafe) and an Open
    Source product called Concurrent Versions System (CVS) can also be used. You can
    get more information from CVS from http://www.cyclehc.com. Other products are
    also available, but these are two of the most popular.


    That’s enough preaching on organization for now. Let’s move on how you can actually
    create code segments in your programs.


    # Creating Code Segments


    Creating code segments isn’t a complex task if you think about how your program
    is going to be structured. It does, however, involve some preliminary planning
    on your part and the ability to adapt your decisions if you find other changes
    are necessary once you start programming.


    Being a good programmer is not only knowing how to program in a particular language,
    but also how well your planning and programming style measures.


    Before you start, you should decide what the functional parts of your script are
    and how they should flow logically. This involves the grouping of functionality,
    potentially reusable, into process parts, followed by the consideration of the
    logical flow of your program. In other words, you can reuse stuff, put it in subroutines,
    put all common components in common'
