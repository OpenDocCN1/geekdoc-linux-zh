  md: '# 384 Perl: A Beginner''s Guide


    book. Our best advice is to tell you to check the hints subdirectory of the source
    distribution for specific items. In addition, some pointers might be in the README
    files contained in the root directory of the distribution. If you find any issues
    that affect your programs, you can use the values of $^ Table 11-3 to recognize
    the system, and then program around it.


    # Mac OS


    One of the bigger issues using Perl on the Mac OS is no command line interface
    in versions before Mac OS X. This means you cannot pass arguments to your scripts
    (unless they are CGI scripts where a browser passes the arguments). A MacPer module
    does exist, however, that lets prompt the user with a dialog box for arguments
    to be passed in. To invoke this dialog box, you can do the following:


    ```

    @ARGV = split /\s+/, MacPerl::Ask("Arguments: ");

    ```


    This gives you a dialog box like the one shown in this illustration.


    ![](img/2070407c4a70134aab89572f10d21e60_407_0.png)


    Because we talked about it with both Windows and UNIX, we want to point out that
    $^ on Mac OS systems returns MacOS. But, in addition to this information, you
    can use the MacPerl module and get additional information on the MacPerl environment
    and architecture of the system, which is described in Table 11-4.


    > Tip If you forgot how to include a module in your code, check back to Module
    8.'
