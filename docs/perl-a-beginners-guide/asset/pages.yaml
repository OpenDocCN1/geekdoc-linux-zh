    # Caution


    When naming your packages and modules, try to avoid the use of Perl reserved words.
    This can lead to confusion for programmers and create a debugging nightmare. I
    remember having this problem back in college and it took me forever to realize
    I wasnt calling the Perl function—I was calling my own! Oh, the good ol days.
    I''m a bit wiser now.


