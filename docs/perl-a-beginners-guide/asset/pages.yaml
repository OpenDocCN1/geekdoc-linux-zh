  md: '# Module 11: Cross-Platform Functions and Issues 385


    | MacPerl Command | Return Description |

    |---|---|n| $MacPerl::Version =~ /App/; | Tells you if MacPerl is running as an
    application. If so, returns 1

    | ::Version =~ /MPW/; | Tells you if MacPerl is running under the MPW environment.
    If so, returns 1

    | ::Version =~ /(\S+)/ | Returns the version of MacPerl you are running. Returns
    something like 5.2.04.

    | ::Architecture | Returns MacPPC if MacPerl is running on a PowerPC chip, and
    if it''s running on the old 68k architecture. |


    # Table 11-4 Additional Information You Can Obtain about the MacPerl Environment
    Using the MacPerl Module


    ![](img/2070407c4a70134aab89572f10d21e60_408_0.png)


    **Question:** We''ve talked a lot about problems around specific operating systems
    and Perl, but are there any advantages to one operating system over another or
    to the discussion of the differences?


    **Answer:** Most major ports of Perl include additional libraries that extend
    Perl to take advantage of features, which only that operating system has. Here
    are two that might be of immediate interest.


    +   1. **MacPerl** The MacPerl module, which is built into the MacPerl distribution,
    provides several Mac OS-specific features, such as the dialog boxes that can be
    launched and system information, both of which were touched on in this module.
    For more information on the MacPerl module, check out the `MacPerl.Specs` file
    in your distribution.


    +   2. **Win32,OLE, and Win32API** These Windows modules, which are distributed
    with ActivePerl, provide features specific to the Windows environment, including
    such topics as accessing the registry, controlling ActiveX controls, and writing
    information to the Event Log. For more information, check under Module Docs in
    your ActivePerl documentation.'
