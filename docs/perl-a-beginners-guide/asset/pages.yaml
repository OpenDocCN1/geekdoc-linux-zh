    # Note


    Remember always to use the chomp function instead of the chop function to get
    rid of the newline character. This character will always be present at the end
    of each piece of user input you take in. Using this function ensures you never
    remove any important data by accident.


    The next arrays we cover are the push and pop functions. In discussing these functions,
    we may introduce a few new concepts, so we''ll be sure to cover everything in
    detail. The push and pop functions are helpful when an array is set up to be used
    as a stack. You can think of a stack as a first in, last out (FILO) model. The
    first element you push into the stack will be the last element you can pop off
    the stack. By the same token, the last element you push into it will be the first
    element you pop off the stack. The push and pop functions always operate on the
    right-hand side of a list.'
