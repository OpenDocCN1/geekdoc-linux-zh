    of the first hash at one time. You can''t just put the hash variable name inside
    double quotes and have it interpolate its contents. If you want to see all the
    contents of a hash, it''s easily done by setting the hash equal to an array and
    printing the array. The following lines of code print to the screen the keys and
    values of the %hash variable used in the previous example:


    ```

    @array = %hash;

    print "The keys and elements stored in %hash are @array \n";

    ```


    # Note


