    ```


    3. The first thing we need to do in our library is to define it as a package.
    To do this, simply include the following line:


    ```

    package Prepare;

    ```


    4. Next, we need to load the Exporter module and set up the list of subroutines
    we export. Because this is a short list and because we want to give our users
    the capability to load only the subroutines they want, we only define the @EXPORT_OK
    array. This section looks like the following.


