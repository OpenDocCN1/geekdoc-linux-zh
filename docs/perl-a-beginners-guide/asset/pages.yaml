  md: '# 332 Perl: A Beginner''s Guide


    <input type="checkbox"> Check Box

    Check boxes are an alternative way to collect one or more choices from a list
    of options than a multiselect box. When check boxes are used, the user can select
    any, all, or none of the choices you provide. As with text boxes, check boxes
    are implemented using the <input>. The difference in the creation of these two
    elements is the type attribute of a check box takes checkbox as the value.


    To create a check box, do the following:


    +   1. Introduce the element. The focus of this set of check boxes is sports,
    so the introduction is


    ```

    <h4>Sports Interests</</h4>

    ```


    +   2. Because we want text before each check box, it''s necessary to include
    this text before we create the box element. A sample would be like the following,
    "Baseball" is displayed before the check box. Also notice the value attribute,
    which specifies the text that should be sent to the server when the box is checked.
    The name attribute is set to specify the key used to pass the data to the server.


    ```

    Baseball:

    <input name="sports" type="checkbox" value="base">

    ```


    +   3. Now that Baseball is done, repeat Step 2 to add entries for Basketball,
    Football, and Soccer.


    Once we''re finished, the HTML for the completed list of check boxes looks like
    the following.


    ```

    ="checkbox" value="foot"

    Soccer:

    <input name="sports" type="checkbox" value="soccer">

    ```


    As you can see, it''s quite simple to implement a check box element in an HTML
    form. In fact, this is one of the simplest elements to implement. Now, let''s
    look into another easy element to implement: the radio button.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Module 10: Writing CGI Programs 333


    <input type="radio"> Radio Buttons


    Radio buttons are much like check boxes, except they only allow one of the choices
    in a group to be selected. These radio buttons, in addition to having individual
    values, are grouped together using the same name attribute for each instance.
    The value attribute, however, is sent to the server to distinguish it from the
    others.


    Here is how to include the set of radio buttons in your form:


    +   1. Guess what''s first? Yep—an introduction! Our user gets the chance to select
    his or her gender, by using the following sentence:


    ```

    <h4>Gender</h4>

    ```


    +   2. Next, add the actual HTML that creates the radio buttons. To do this, use
    the input tag again. However, this time we set the type equal to radio. Because
    we want to have more than one option, we also group the radio buttons by specifying
    the name attribute. Finally, we give them each a value, so we can identify them
    on the server side.


    ```

    Male

    <input type="radio" name="gender" value="m">

    Female

    <input type="radio" name="gender" value="f">

    ```


    The complete HTML for this is as follows:


    ```

    <h4>Gender</h4>

    Male

    <input type="radio" name="gender" value="m">

    Female

    <input type="radio" name="gender" value="f">

    ```


    > Hint

    You can have more than one radio button grouping within a given form by using
    different names for the different groups. As mentioned before, groups of radio
    buttons are defined by every button in the group using the same name.'
  merge: -1
