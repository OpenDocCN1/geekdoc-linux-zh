    Another set of operators can prove useful throughout your programming adventures:
    Comparison operators are often used in decision making. For example, if the structure
    in Perl depends on the outcome of a comparison. If the comparison evaluates to
    true, then the if structure executes. If the comparison evaluates to false, then
    it is skipped. Let''s look at how the comparison operators are represented in
    Perl.


