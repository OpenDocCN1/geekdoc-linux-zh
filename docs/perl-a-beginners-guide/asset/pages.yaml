  md: '# Perl: A Beginner''s Guide


    # HTTP Status Codes


    When a server responds to an HTTP request, it does so with both a header and a
    body, as previously discussed. Part of the header, however contains the status
    code of the response. This status tells the browser what kind of response is being
    returned. So, for instance, if an error occurred or if the browser is redirected
    to another location, this code is what tells the browser.


    Generally, the Web server specifies these codes, although there may be a need
    in your script to do so. When using the CGI.pm module, all you need to do is set
    the -status attribute of the header property. Say, for instance, you want to send
    back a fictitious status of 699 to the browser. You could/usr/bin/perl -w with
    this following code.


    ```

    #!/usr/bin/perl -w

    use CGI;


    Squery = new CGI;

    print Squery->header(-status=>699 My Crazy Status'');

    ```


    This returns the following to the browser:


    ```

    HTTP/1.0 699 My Crazy Status

    Content-type: text/html

    ```


    To send a status code, you need to know what the responses are, as defined by
    the HTTP specification. They are grouped in the following five categories as defined
    by the HTTP 1.1 Request For Comments (RFC) 2616.


    +   - 1xx (Informational) Request received, continuing process.

    - 2xx (Success) The action was successfully received, understood, and accepted.

    - 3xx (Redirection) Further action must be taken to complete the request.

    - 4xx (Client Error) The request contains bad syntax or cannot be fulfilled.

    - 5xx (Server Error) The server failed to fulfill an apparently valid request.'
  merge: -1
