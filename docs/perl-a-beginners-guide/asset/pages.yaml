  md: '# Module 1: Introduction to Perl 39


    # Note


    If you programmed in another language, you might have noticed didn''t use parentheses
    () with the "print ()" function. In Perl you can use parentheses or not—the choice
    is yours.


    # Going A Bit Further


    So, how was the experience of writing your first successful Perl programming?
    Satisfying, but too simple and not too exciting, you say? Well, before we end
    this module, let''s add a little excitement to make it more interesting. Because
    the following modules are used to introduce you further to the language, we are
    limiting what we do here so you don''t become confused. What we will do, however,
    is change the script to prompt for your name, prepare your response, and then
    return another result to your screen.


    In this script, we use a new function called chop (), which is a simple function
    that removes a trailing newline character at the end of a string. When you accept
    input from the command line, the return that''s pressed by the user is also stored
    in the string. Using chop, we can remove that extra newline character and focus
    only on the alphanumeric data entered.


    # Note


    Perl also has a function called chop (), which removes the last character of a
    string. Unlike chop (), chop () removes any character, no matter what it is, whereas
    chop () only removes the character if it''s a newline character. When you only
    need to remove a trailing newline character, you should always use chop () because
    it''s safer.


    Before we chop off the newline character, we need to get the data from the user.
    The way to do this is to print some text to the screen asking for the user''s
    name, and then read what the user types into a variable. This information, which
    is read through standard input (STDIN), can then easily have the chop function
    applied to it. Because this information is in a variable, it''s also easy to reuse
    that variable in our second print statement to output what the user entered.'
