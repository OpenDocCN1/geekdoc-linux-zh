    Now, in Figure 12-3, you can see that we''re past the first error and back to
    our original error on line four, even though the interpreter says the error is
    on line five. Correcting this error should lead us to the last error. Take a look.


    Notice in Figure 12-4, the interpreter tells us the error is on line eight and
    it gives us a bit of insight as to what it thinks the problem may be. The interpreter
    says the error might be a runaway multiline string and it the missing double quote
    causes a major problem because the interpreter cannot find the string. Once this
    problem is corrected, the program can execute properly.


    # Common Practices


    As mentioned earlier, a common practice is trying to fix only one error at a time
    because errors have a way of cascading when several are present. You can spend
    too much time trying to determine what the interpreter means if you focus on more
    than one error at a time.'
