  md: '# 418 Perl: A Beginner’s Guide


    The first command we cover is the > command. It lets you tell the debugger to
    execute the supplied line of code before executing each statement in the program.
    The following is an example of how you might use this command:


    ```

    DB(1) > print "The variable contains $variable\n";

    ```


    Once this command is set, the supplied statement is executed before each line
    of code is executed from the program. Figure 12-16 is an example that uses this
    command.


    Another similar command is the < command. It executes a supplied statement after
    each line of code from the program.


    ![](img/2070407c4a70134aab89572f10d21e60_441_0.png)


    Figure 12-16 Using the > command'
