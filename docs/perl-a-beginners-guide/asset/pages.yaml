    $counter = 0;


    # iterate through the file one line at a time

    # and increase the counter on each pass.

    while(<INFILE>{

    $counter++;

    }


    # print the value of the counter to the OUTPUT file

    print OUTFILE "The file contained $counter lines";


    # close the files

    close OUTFILE;

    close INFILE;

    ```


