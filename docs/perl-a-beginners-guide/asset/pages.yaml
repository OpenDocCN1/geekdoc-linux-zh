    If you are running on a UNIX platform, you can change the permissions your file
    has for yourself, your group, and the world by specifying the octal representation
    of the desired permissions for each of these three groups. Permissions are in
    the following format:


    ```

    r w x

    ```


    The r specifies you have read permissions, and the w represents the execute permissions.
    Three sets of “r w x” exist for each of the three sections—yourself, your group,
    and the world—so it looks something like:


    ```

    r w x r w x

    ```


    Each group of permissions is represented by a three-digit binary number like 000
    or 110. To select the permission you want, you have to specify the corresponding
    octal number for that particular group. If you want to give everyone—which includes
    yourself, your group, and the world—permissions to a file, you specify a seven
    for each group. 0777 would be 111 111 111 in binary and, therefore, every permission
    for everyone would be turned on. Most of the time, 744 is used because it'
