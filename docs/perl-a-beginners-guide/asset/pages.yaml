    From the start of this book, we preached the concept of documenting your code.
    When creating Perl packages and modules this is especially true. Adding comments
    and instructions within your library so others can read and understand how to
    use it is extremely important. And, if youre designing a library to be reused
    by many people, such as posting it to a Web site or a newsgroup, then you should
    writing a full document on how it works and how it should be used.


