  md: '# Module 6: Working with Files and Directories


    forward or backward in an opened file. The syntax for the seek function is as
    follows:


    ```

    seek(file handle, length, from_where);

    ```


    The length field is used to specify how far to skip in the file. The from_where
    field is used to determine from where you want to skip. The following table shows
    the possibilities for this field.


    | from_where | What It Means |

    |---|---|

    | 0 | Count from the beginning of the file |

    | 1 | Count from the current position in the file |

    | 2 | Count from the end of the file |


    The tell function can be used to determine how many bytes you have skipped into
    a file. The number of bytes is always relative to the beginning of the file when
    you use this function. The syntax for the function is as follows:


    ```

    tell(file handle);

    ```


    Now that you know the syntax for these statements, here''s a programming example
    to demonstrate the use of each of these functions.


