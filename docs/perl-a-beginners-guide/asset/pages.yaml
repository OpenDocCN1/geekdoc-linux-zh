  md: '# 294 Perl: A Beginner''s Guide


    Everything is ready now. This is all we''re going to discuss regarding PostgreSQL
    and specific database functionality. The rest of the concepts pertain to how the
    DBI works with these databases. We''ll write a script that inserts, retrieves,
    updates, and deletes data.


    Do you want to know more about PostgreSQL? Visit its Web site at http://www.postgresql.org.


    # Introduction to the DBI


    The Perl Database Interface, or Perl DBI, is an interface between the Perl programming
    language and a database. The DBI, whose architecture is shown in the following
    illustration, acts as a conduit between the Perl interpreter and the database
    engine. Part of this architecture, as you can see in the illustration, is a driver
    that must be loaded by the DBI to access the database. This is the driver (DBD)
    we installed after installing the DBI. For a complete list of available drivers,
    check http://www.symbolstone.org/technology/perl/DBI.


    ![](img/2070407c4a70134aab89572f10d21e60_317_0.png)


    # Project 9-2: Installing the DBI Module


    Do you wish we''d helped you out a bit more with Project 9-1? Well, that was a
    bit beyond the scope of what we''re trying to do, so we had to push it back on
    you. This project, however, is within our scope, we''ll give you a hand.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI 295


    The objective, as the title of the project dictates, is to install the DBI module
    on your system. Unlike modules that are purely written in Perl, the DBI module
    must be built in much the same manner as Perl itself. Windows users do it easy
    because the module is already built, but you must go through some steps to make
    it work.


    # Step-by-Step


    Because we want to get up-running quickly with the DBI, we broke the project into
