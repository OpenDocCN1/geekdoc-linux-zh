  md: '# Module 7: Regular Expressions 231


    also works for the letters. You can specify every letter of the alphabet by entering
    [a-z] instead of typing in all the letters. The following is an example regular
    expression you''ve already seen, but it has been simplified using the dash character:


    ```

    $string ~ /The year is 200[0-9]/

    ```


    This regular expression will be satisfied if the string contains “The year is”
    and year from 2000 to 2009.


    The special characters we covered so far are the plus, asterisks, question mark,
    period, and square brace characters. If you want to have one of these characters
    as part of the regular expression, you must use a backslash in front of it. This
    works the same as it does for double-quoted strings. If you want to include a
    backslash in front of it. Here are a few examples for clarification:


    ```

    $string ~ /hello\?/

    ```


    Here, the regular expression to be matched is “hello?”. If we hadn''t used the
    backslash in front of the question mark, we would have been searching for “hell”
    with none or one o after it. Let''s look at another expression:


    ```

    $string ~ /cat\her/

    ```


    The regular expression to be matched here is “cat\her”.


    # Note


    Make sure when you include the backslash in a regular expression that you include
    another backslash to “escape” its special meaning. Several escape sequences can
    be used in regular expressions and they all begin with a single backslash followed
    by different letters, each of which performs a special task. You won''t wind up
    with what you intended if you forget to include the extra backslash.'
