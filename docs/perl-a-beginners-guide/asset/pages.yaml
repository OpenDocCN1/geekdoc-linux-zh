    chomp($password=<STDIN>);


    # try to connect

    dbh = DBI->connect($ds, $user, $password) or die "Error ($DBI::err):\n    $DBI::errstr";

    ```


    Now, although this shows how you might use the error and warning messages, we
    don''t prepare you for what you might expect to see back. For this, we include
    Table 9-3. In this table, we list the types of messages that can be returned,
    the messages themselves and a description. This, coupled with what you know about
    accessing your database, should give you a good handle on how to handle problem
    areas.


    # Returned Results


    We''ve gone over how to query the database for information, but we haven''t yet
    discussed how information is returned or what we can do with it, this is our next
    topic. We also include a more complete example, so you can see an actual SQL query
    running and processed using the DBI.


    In this example, we call db-select.pl, we perform several tasks. Besides the obvious
    tasks of loading the DBI module and setting up the connection to our perl-bin
    database, we are going to execute a SELECT statement that returns the values of
    the firstname and lastname columns in our users database. During all of this time,
    of course, we are checking for errors and writing the appropriate messages as
    needed.


    Now for the new stuff. What do we do with the results that are returned? Well,
    this is where the fetchrow_array() subroutine comes in. Each row returned from
    our query is stored in the DBI and we can use this routine to access them. As
    you see now, we do a shortcut and read them directly into the variables $firstname
    and $lastname in'
