  md: '# 424 Perl: A Beginner''s Guide


    You''ve made it to the last module in this book—and we''ve saved some of the more
    advanced topics until now. This is the module in which we chose to cover these
    advanced topics because you''re already familiar with basic topics such as regular
    expressions, interacting with databases, modules, and system functions. We won''t
    go into detail on the topics covered in this module, but we do give you a good
    head start in becoming an experienced Perl programmer.


    This module first covers object-oriented programming. We discuss related topics
    such as encapsulation, inheritance, and polymorphism. The next section of this
    module covers PerlScript and its various uses, including client-side usage, server-side
    processing, and how to use PerlScript to perform everyday tasks. Finally, we introduce
    you to the Perl/Tk toolkit. We cover what the Perl/Tk toolkit is, give you an
    overview of the toolkit, and, finally, discuss the steps involved in designing
    a simple GUI application.


    # Object-Oriented Programming


    If you''ve had any experience with programming at all, you''ve probably heard
    the phrase "object-oriented programming" being tossed around a lot. If you haven''t
    heard it, chances are you will as you become a more experienced programmer.


    Before we go any further in this section, we need to discuss what object-oriented
    programming (OOP) is. The basis of object-oriented program is objects. An object
    lives in a class, which means it belongs to a certain class in whose behaviors
    are defined. A class is a group of functions and data that are related, in everything
    that a class is tailored to a specific problem. A class can be thought of as a
    special user-defined data type.


    Now that you''re all confused, let''s try to explain this a different way. A class
    defines attributes for a special data type. This new data type created through
    a class can perform special tasks. These tasks are defined by the methods or subroutines
    you include in the class. The data type you create can be compared to the scalar
    data type. You know what the scalar data type is capable of and, when you need
    to create a scalar variable, simply follow the special naming conventions to do
    so. By the same, when you need to create a new object, you must follow the'
