  md: '# Module 13: Advanced Features and Concepts 433


    This is just like Microsoft''s VBScript and JScript, which means PerlScript can
    be executed in the following, all of which are Microsoft technologies:


    +   1. The Internet Explorer 4 browser


    +   2. The body of ASP documents served by the Internet Information Server (IIS)
    version 3+ or Peer Web Services 3+


    +   3. The Windows Script Host environment


    For PerlScript to work, both ActivePerl and PerlScript must be installed on the
    machines running the scripts. So, for instance, if you develop client-side PerlScript,
    all machines that will load that page must have ActivePerl and PerlScript installed.


    Our objective at this point is to introduce you to the concepts of each of these
    technologies, to show you some simple examples, and to point you to additional
    resources to use as you decide to pursue more information on these topics. We
    don''t want to overload you, but we want to get you started in the right direction.


    Currently, PerlScript is only available for use on the Windows operating system.
    So, although UNIX and Mac OS programmers should read and understand this section
    of the book, you won''t be able to execute any of the examples here on your system.


    # Using on the Client Side


    Using PerlScript on the client side is a concept with which you may be somewhat
    familiar. If you''ve ever written any JavaScript/JScript or VBScript, then you
    are ahead of the game. The concept is simple: using


