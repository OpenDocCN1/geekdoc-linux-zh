    Exit = 1

    Signal Number: 0

    Core: 0

    Message: No such file or directory at D:\inetpub\ftroot\sys_test.pl line 16.

    D:\inetpub\ftroot>_

    ```


    Figure 11-1 Results of running our sys_test.pl script'
