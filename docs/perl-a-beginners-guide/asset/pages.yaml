  md: '# 80 Perl: A Beginner''s Guide


    So far, you have learned about the various data types in Perl, as well as how
    variable assignments and operators are used. Now it''s time to learn control structures
    and how they are used in programs. These structures are used in most of the programs
    you write simply because they give you some control over how your programs execute.
    This module begins by looking at the most basic piece of any control structure,
    the block statement, and then moves on to the rest of the conditional statements.
    Once you complete this section, we introduce you to some control statements you
    can use inside loops and, finally, we cover the concept of nested loops and how
    they function.


    # Conditional Statements


    Conditional statements are used in programming languages when a decision needs
    to be made before a section of code is executed. You might need to make sure a
    counter has reached a certain number before executing code or you might want to
    check the contents of a variable to make sure the value is what you thought it
    should be. Before we cover the different conditional statements in detail, we
    need to discuss the basic building block of any conditional structure, the statement
    block.


    # Statement blocks


    A statement block is a sequence of executable statements that are grouped together
    with curly braces. Curly braces are the ''{'' and ''}'' characters. A statement
    block in a program looks like this:


    ```

    $a = 12;

    $a += 5;

    print "a equals $a\n"

    }

    ```


    Here''s another example of a statement block with the curly braces located differently.'
