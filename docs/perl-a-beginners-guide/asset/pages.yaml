  md: '# 406 Perl: A Beginner''s Guide


    This option lists line five of the program currently being used in the debugger.
    You can also use this program to reset the l command. Remember, the l command
    lists ten lines of a program at a time in order. If you listed lines one through
    ten and eleven through twenty, you can start over at the beginning by first issuing
    l 1, and then using l to list the rest of the lines. In addition to being able
    to display one line, you can specify a range of line numbers to be listed at one
    time by using the following command:


    ```

    DB(2) 1 5-8

    ```


    This command lists lines five through eight of your program. You can also list
    lines five through eight by using the following command:


    ```

    DB(3) 1 5+3

    ```


    This command tells the debugger to start with line five and display it and the
    next three lines.

    If your program has subroutines in it, you can use the l command and the name
    of the subroutine to jump to and display it. If you want to display the previous
    line or lines that have already been displayed, you can use the following command:


    ```

    DB(4) –

    ```


    Figure 12-7 shows the - command being used.

    As you can see from Figure 12-7, the - command doesn''t show the exact number
    of lines previously displayed, but the lines will be part of the ten that are
    displayed.

    The w command can be used to display ten lines of a program, one of which is a
    specified line number. You can also do this with the l command, but using w can
    make it easier for you. The following is an example of how the w command is issued:


    ```

    DB(5) w

    ```'
