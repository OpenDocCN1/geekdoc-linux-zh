    ```

    #!/usr/bin/perl -w

    #-----------------

    # Script Name: num-lines.pl

    # Script Version: 1.0

    # Date: 10.16.2000

    # Author: R. Allen Wyke

    # Description: opens a file, counts the number of lines

    # in it, and writes that number to a second file.

