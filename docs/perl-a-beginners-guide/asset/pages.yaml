  md: '# Perl: A Beginner''s Guide


    In Module 6, you got your first taste of using Perl in the real world. Then, in
    Module 9, you used Perl to access databases. Now it''s to look at another way
    to use Perl—creating Common Gateway Interface (CGI) scripts.


    CGI scripts, or programs, as they are sometimes called, are often used to create
    HTML pages dynamically. These pages could be anything from a Web-based shopping
    cart at your favorite e-commerce store or simply a result page for a user who
    just submitted her contact information. CGI scripts can be a powerful tool for
    Web developers, and using Perl as the language of choice for your CGI scripts
    is by no means a bad one.


    > Hint: CGI script is a program that runs on the same system as the Web server
    and conforms to the CGI standard. For more information on the CGI standard, check
    out http://hoohoo.uiuc.ncsa.edu/cgi.


    In this module, we look at how to use CGI and Perl. During this module, we also
    show you how to handle information submitted via HTML forms, which may be your
    most useful case of combining CGI and Perl. But, before we discuss the more complex
    details of CGI programming, let''s look at some general concepts.


    # What Is CGI?


    CGI is a standard for interfacing external programs, such as Perl scripts, with
    an HTTP server. The words "common" and "gateway" refer to the common variables
    and conventions (the term, "interface") used to pass this information to and from
    the HTTP server. CGI lets you use these custom programs to format and process
    output to browsers.


    Each time a user requests a URL corresponding to a CGI script, the Web server
    invokes the program, passing the information sent from the browser to the script.
    This information includes various HTTP headers sent by the requesting browser
    and any information passed along with the URL, such as query string information
    (more on that later). The CGI script is then able to read, process, and return
    an appropriate response based on this information.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Module 10: Writing CGI Programs | 315


    In a nutshell, this is what CGI is and how it works. Because it can perform complex
    processing, such as accessing a database, while executing, we''ll look a little
    deeper into some of the details behind CGI and how it can be used on the Web.


    # Quick Introduction to CGI.pm


    Most HTML is independent of the operating system running on the server. CGI, however,
    can be heavily reliant on the operating system and the HTTP server you are running.
    This could be anything from path delimiters (remember how Windows uses \, UNIX
    uses /, and Mac OS uses : ) to how programs execute. For this reason, we use a
    common Perl module, called CGI.pm, for our scripting. The author of this module
    has written it so it can be used with the following systems:


    +   - DOS

    - Mac OS

    - Microsoft Windows

    - OS/2

    - UNIX

    - VMS


    > Hint Do you want more information on the CGI.pm module? Check the docs with
    your Perl distribution and you should find more information with the library (check
    the lib directory of distribution).


    # CGI Programming Language Options


    CGI programs can be written in any number of programming languages as long as
    the program can be executed on the system running the Web server. Some common
    choices for writing CGI scripts and UNIX are the shell scripting languages, such
    as Bourne, C, or Korn shells, and/or various programming languages, such as C/C++,
    Perl, and Java. If you''re using'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 316 Perl: A Beginner''s Guide


    a Windows Web server, you can also use Windows-specific languages, such as Visual
    Basic or Delphi for these scripts.


    CGI programs reside in a specific directory that the Web server uses to execute
    the program. For example, most UNIX systems, these programs are typically stored
    in a directory named cgi-bin and end with a .cgi extension. Windows systems, on
    the other hand, store these programs in a scripts directory. On the Mac OS, no
    real default folder exists. We won''t worry about this right now we step through
    checking your Web server and setting it up correctly later.


    So, with all of these choices, what language should you use to create your CGI
    scripts? Even though this may be left up to you in the real world, the most commonly
    used language is Perl, which is, of course, the focus of this module and this
    book!


    # Using Perl for CGI Scripts


    Using CGI scripts on your system isn''t terribly complex. Because this book addresses
    the Windows, UNIX, and Mac OS platforms, we take a quick look at how you can get
    it up and running on your system. To ensure the system is running correctly, use
    the following CGI script, which we name test.pl to test your setup. Don''t worry
    about the code means yet—we cover that later.


    ```

    #!/usr/bin/perl -w


    use CGI;

    Squery = new CGI;

    print Squery->header;

    print Squery->h1("It Worked!");

    ```


    Now, look at setting it up on your system.


    > ### Hint

    Because CGI.pm has built-in support for debugging from the command line, it''s
    a good way to find any problems before you run through your Web server.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Module 10: Writing Programs | 317


    # Windows


    Several popular Web servers run on Windows, such as the Netscape/iPlanet line
    and Apache but, for for this exercise, we discuss Microsoft’s Internet Information
    Server (IIS) and Personal Web Server, which is nothing more than a stripped down
    version of IIS. For the book’s screen shots and some of its commands, however,
    we demonstrate how to run Perl CGI scripts on Windows NT/2000.


    First, make sure the World Wide Web Publishing Service is installed and running.
    You can quickly check this by opening the Services Control Panel—it should be
    one of the last items listed. If you don’t see the service, then click the Add/Remove
    Programs icon in the Control Panel. From there, you can access a list of Windows
    components that can be installed on the machine.


    If you are running Windows 2000, you can install IIS 5. If you are running Windows
    NT 4, for optimal performance on your system, download the Windows NT 4 Resource
    Kit from Microsoft (http://rescelink.mspress.microsoft.com/reslink), which provides
    IIS 4. Also make sure you apply the appropriate Service Pack for your system.


    > Hint

    Want more information on how you should install IIS? Check out http://www.microsoft.com/ntserver/nts/deployment/planguide/Install.asp.


    Once IIS is installed and running, you’re ready to install Perl for ASAPI, which
    comes with the ActivePerl 5.6 distribution. This is nothing more than what we
    call a CGI-engine for running CGI programs, which is a bit more efficient than
    running against the perl.exe interpreter. Perl for ASAPI is a dll version that
    loads into memory once and requires fewer resources.


    If you already had IIS installed and running when you completed the ActivePerl
    5.6 installation in Module 1, “Introduction to Perl,” and you’re ready to go install
    the Perl for ASAPI component, and if not, start the installation process of ActivePerl
    5.6 and select to modify the installation. At that time, install the Perl for
    ASAPI component.


    ![](img/2070407c4a70134aab89572f10d21e60_340_0.png)'
