    # The Single Line Conditional Statements


    The single line conditional statements can be used when you don''t need multiple
    statements inside a statement block. If you''re only concerned about one statement,
    this structure can save you time when programming.

    Here''s the syntax for these statements.


    ![](img/2070407c4a70134aab89572f10d21e60_121_0.png)


    And here are a few single line conditional statements being used in a program.


    ```

    #!/usr/bin/perl

    $a = 15;

    $b = 10;

    $a++ if ($b < 20);

    print "$a was incremented by one \n" if ($a == 16);

    $b++ while ($b < 20);

    print "$b was incremented until reached 20 \n" if ($b == 20);

    $a-- until ($a == 2);

    print $a;

    ```


