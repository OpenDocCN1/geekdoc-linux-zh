- img_proc: true
  md: 'Also important to note is connections don''t only refer to connecting

    to a database—it also refers to disconnecting. Good programming style

    dictates you should close all open connections as you exit your program.

    This exit could be as a result of completion or an error. In either case,

    you explicitly close your connection when you finish. This is

    acplished in the DBI by calling the disconnect () subroutine.

    The syntax for this routine is as follows, where $dbh is the database

    handle to which you have assigned your connection.


    ```

    $dbh->disconnect

    ```


    If we take all we have learned and apply it in a single example,

    called connect.pl, then we can use the DBI to make certain our driver

    is installed, make sure it can connect to our database, open a connection,

    and then close it. This, obviously, doesn''t do much, but it does provide

    sewhat of a template for the other tasks we are going to run against

    our database.


    ```

    #!/usr/bin/perl-w

    # load in the DBI module

    use DBI;


    # set the username, password, and database to access

    $user = "awake";n$password = "mypass";n$database = "perl-begin";


    # specify the driver and database to access

    $driver = "dbi:Pg"; $database; # generates ''dbi:Pg:perl-begin''


    # make the connection to the database

    $dbh = DBI->connect($database, $user, $password) or die "\nError ($DBI::err):\$DBI::errstr\n";


    # close our connection

    $dbh->disconnect();

    ```


    # Transaction Management


    As your database-enabled applications become more complex, you may

    find the need to lock tables and manage the transactions. An example

    might be a counter. If you have ten people connected to the database

    and you want to increment a counter field based on this number of

    connections, you need to lock and unlock the table as you increment'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI | 301


    the counter. Otherwise, it''s possible two or more transactions may attempt to
    perform their increment at the same time, which could cause data corruption.


    In the Perl DBI, the LOCK TABLE `<table>` statement, which is interpreted by the
    backend server, can be used to apply an explicit lock on a table, but this only
    works inside a transaction (that is, AutoCommit set equal to 0). For more information
    on AutoCommit, check the DBI manages.


    In addition to locking and unlocking the tables, you should also verify that a
    set of transactions completed successfully. If all don''t complete successfully
    for any reason then you should rollback all transactions. In other words, you
    don''t want to have a transaction complete for the purchase, for example, for
    just one item, but not the second. You want the whole purchase to fail. To perform
    this kind of task, you can use the rollback() subroutine of the DBI module.


    The discussion of the pros and cons of locks and rollbacks is beyond the scope
    of this book and is specific to database applications. Please consult the DBI
    manages, your database documentation, and/or the author of your database driver
    to see what can be done with the driver you are using.


    # Queries


    You perform four main types of queries routinely when you access your database.
    These are as follows:


    +   1. SELECT

    2. INSERT

    3. UPDATE

    4. DELETE


    The SELECT query returns any information in the database matching what you requested.
    The INSERT query is used to insert new rows in the database, while the UPDATE
    query updates existing information. As you might have guessed, the DELETE query
    is used to delete items from the database.'
