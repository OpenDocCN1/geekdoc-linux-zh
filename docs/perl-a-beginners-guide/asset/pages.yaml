    # Obtaining Status Information for a File


    The previous two sections of this module introduced you to the various ways you
    can manipulate files. In this section of the module, we cover the different tools
    you can use to find out information about files. These tools are sometimes referred
    to as the -x file tests because of the format in which you invoke them. The -x
    file tests are used along with a file handle to determine a number of different
    things about the associated file. First, let''s look at all the different file
    test options that are available.


    +   -b Determines if the given is a block device

    |-c Determines if the given is a character device

    |-d Determines if the given is a directory

    |-e Determines if the given exists

    |-f Determines if the given is an ordinary file

    |-g Determines if the given has a setgid

    |-k Determines if the given has a sticky bit set

    |-l Determines if the given is a symbolic link

    |-o Determines if the given is owned by the current user

    |-p Determines if the given is a named pipe

    |-r Determines if the given is a readable

    |-t Determines if the given contains any information

    |-u Checks to see if the given has a setuid

    |-w Determines if the given is writable

    |-x Determines if the given is an executable

    |-z Determines if the given is empty

    |-A Determines how long it has been since the given was last accessed

    |-B Determines if the given is a binary file

    |-C Determines how long it has been since a file''s inode has been accessed

    |-M Determines how long it has been since the given was modified

    |-O Determines if the given is owned by the current user. The user''s ID is set
    at the time of login'
