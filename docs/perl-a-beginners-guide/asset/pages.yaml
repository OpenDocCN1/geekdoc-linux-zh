  md: '# Module 1: Introduction to Perl


    Perl 4 was the last version seen for three-and-a-half years as the language underwent
    a complete rewrite. This doesn''t mean progress wasn''t made during those years,
    though—in fact, this was the time Perl began to reach out and be noticed.


    In January 1992 Matthias Neacher released the first version of Perl for the Macintosh
    (MacPerl 4.0.2). By the end of the year, MacPerl was up to version 4.0.5, which
    included support for Data Base Management (DBM) sockets. 1993 saw continued work
    on MacPerl, and the final version of the core Perl 4 language, Perl 4.036. The
    final version of MacPerl, 4.1.8, which implemented Perl 4.036, soon followed.


    > Hint—Don''t let the differences in versions confuse you. This is discussed in
    a few pages in the section titled "Platform Support."


    # Introducing Perl 5


    By this time, the Perl community was ready for a new version of the language.
    Ports were popping up all over the place, database access was available, and additional
    prebuilt scripts were abundant. However, it was time for a new version of the
    language.


    In October 1994 Perl 5 was released. This version had many enhancements and took
    the language to the next level. Perl 5 was the first release that pushed this
    once-simple scripting language beyond simple administrative tasks and into a more
    powerful spotlight. Here are some of the enhancements that were added:


    +   - Complete rewrite of the interpreter to increase speed, efficiency, and functionality

    - Support for modules, which lets programmers develop their own “libraries” that
    could be included into scripts by others.

    - Object-oriented features, which allowed for the construction of true objects,
    and paved the way for concepts such as inheritance, encapsulation, and polymorphism
    (don''t worry if these terms scare you; they are discussed more in Module 13).

    - Increased diagnostics and warnings generated for coding techniques'
