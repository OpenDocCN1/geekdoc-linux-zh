  md: '# Perl: A Beginner’s Guide


    Working with databases is a common task in today’s computing world. The old way
    of storing Web content, user information, or other logged information was simply
    in files on the file system. Today, however, this information is often stored
    and tracked in robust databases like Oracle, Informix, Microsoft SQL Server, or
    Sybase, open source databases, such as PostgreSQL (pronounced post-gres-QL) and
    MySQL (pronounced my-sequel) are gaining in popularity as Linux begins to carve
    out a place in the market.


    With this increased use of databases in the work environment, we’ve seen an increasing
    need to create applications that can tap these repositories of information. Applications
    that can do everything from report on the data within them to validate user logins.
    Applications that are independent of the database—because they may cross-organizationally
    and platform—independent. So, are you beginning to see where Perl fits? Let’s
    discuss a little more to clarify.


    Perl is currently one of the most widely used, if not the most widely used programming
    languages that have evolved and revolve around the Web brought on the quick and
    broad adoption of the language. Part of this was because of its flexibility as
    a single language to perform a variety of tasks—tasks as accessing databases for
    a multitude of reasons and objectives. Perl is a fairly easy language to understand
    and can be misleading. So, adding database access to its repertoire was an easy
    decision. What better mix than taking a complex task, such as accessing databases,
    and an easy language to perform those tasks?


    You should provide a manner in which a given Perl script could access a database
    for many reasons, but this doesn’t make clear how the DBI is involved. Part of
    the issue is accessing these databases from database to database, in much the
    same way writing applications for multiple operating systems can be. But, in the
    way Perl has eased or even solved the issue of writing code for multiple systems,
    the DBI has done so for accessing and using many different databases. Let’s stop
    here, though, and properly introduce some basic database concepts to get you rolling.'
