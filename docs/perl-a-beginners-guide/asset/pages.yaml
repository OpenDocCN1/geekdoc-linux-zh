  md: "for beginners, and going into details on these topics could cook your brain—it\
    \ still does ours! Don't worry, though, we're going to give you a taste of some\
    \ of the more useful advanced features.\n\n# Temporary Data with local ()\n\n\
    The local() function enables you to declare variables that are inaccessible outside\
    \ a subroutine. This means, in general, these variables outside the subroutine\
    \ and, if they contain the same name as a global variable, the global variable\
    \ is unaffected by any manipulation that occurs within the subroutine. An exception\
    \ does exist, however. If nested subroutines are within the first one (the one\
    \ with the local () declaration), then, too, it has access to the variable. You\
    \ see this in an example little later.\n\nSo, why would you use the local() function?\
    \ When writing code you might want to create variables that are only seen within\
    \ a certain scope—you only want part of your program to see and understand that\
    \ variable. For instance, say you have to use a counter to count the number of\
    \ times you call a given subroutine or go through a loop in that subroutine. But,\
    \ you have five different subroutines you maintain counts for and they are called\
    \ at different times. This prevents you from declaring one variable and resetting\
    \ it within each subroutine, because the previous count could be lost.\n\nOne\
    \ solution would be to define five different variables. This seems like a waste\
    \ of time and coming up with five different names for the same basic thing doesn't\
    \ make sense either (this especially doesn't make sense if you have 100 variables!).\
    \ Using the local() function, you can define a variable of the same name, say,\
    \ $counter, within each subroutine without having them overwrite or affect each\
    \ other. To give you a better understanding, here's an example we named local-ex.pl.\n\
    \n```\n#!/usr/bin/perl -w\n\n# Script Name: local-ex.pl\n# Script Version: 1.0\n\
    # Date: 10.16.2000\n# Author: R. Allen Wyke\n# Description: This script demonstrates\
    \ how the local() function\n works in Perl.\n```"
