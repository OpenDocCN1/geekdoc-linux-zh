  md: '# Module 10: Writing CGI Programs 335


    <input type="hidden"> Hidden Fields

    The concept of a hidden field also exists within forms. These fields are useful
    when you want to send information to the server, but you''d rather the user not
    see or modify it. For example, you might send the version number of the form.
    This is something the user shouldn''t be able to and has no reason to modify.


    The HTML code used to create this field simply uses the <input> element with the
    type attribute set to hidden. Then, within the tag, you use the name and value
    attributes to specify the extra fields and their values you to pass.


    In our form, as mentioned in the example, we use this type of field to pass the
    version number of the form. This looks like the following:


    ```

    <input type="hidden" name="version" value="1.0">

    ```


    <input type="reset"> Reset Buttons

    Up to this point, we''ve discussed using the <input> element as a text box, check
    box, radio button, a password field, and as a hidden field. You can create one
    more type of item with this element and it has two variations. The first variation
    is the Reset button.


    The Reset button, which isn''t required to be present in all forms, has a default
    text of “Reset,” although you can change the value attribute. If a form contains
    this element, selecting it clears all the fields on the local form. The form is
    not submitted when this action is performed, but all user entries are cleared
    and the default settings/selections are reapplied.


    To implement an instance of this button, do the following. The value attribute
    was included here, but we could have left it out. By using the value attribute
    here, you can see where it would go.


    ```

    <input type="reset" value="Reset">

    ```


    > Hint

    Even though you can have more than one Reset button in a form, you should consider
    only placing a single button at the end of the form to avoid confusion.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 336 | Perl: A Beginner''s Guide


    <input type="submit"> Submit Buttons


    The second variation is the Submit button. Each form you want to submit back to
    the server must have a Submit button of some form. True, you can get around this
    some degree by using a client-side scripting language like JavaScript, but not
    in general.


    To specify that the button is supposed to be a Submit button rather than a Reset
    button, you set the type attribute to *submit*. As with the Reset button, the
    Submit button can take a value attribute to set the text of the button. The default
    text for the button is "Submit Query."


    To create a Submit button, you do the following:


    ```

    <input type="submit" value="Submit">

    ```


    # Another Way to Do a Submit Button


    Because we''ve been talking about form elements, we want to include a section
    on another way to implement a Submit button. This element, which includes an image,
    can be used in place of the Submit button we have just discussed.


    When you specify image as the type for an <input> field, you can give the URL
    in another attribute *src*. This attribute, which is used in the same manner as
    the *src* attribute of an <img> tag, displays an image to the user instead of
    a button. Like the Submit button, when the user clicks the image, the form is
    submitted. When this is done, the coordinates of the mouse pointer are sent in
    the form *name.x* and *name.y* where *name* is the value of the name attribute.


    # Our Completed Form


    At the beginning of this section, we showed you the form we planned to create
    in Figure 10–3. At this point, we''ve gone over all the fields needed. All that''s
    left is the basic head and the ending tags of the document. This will look like
    the following, and will give the document a title, a heading at the top of the
    page, and a horizontal rule, or before the start of the form.


    ```

    <!DOCTYPE html public "-//W3C//DTD HTML 4.0 transitional//EN">

    <html>

    <head>

    <title>Customer Input</title>

    </head>

    <body>

    <h1>Customer Information</h1>

    ```'
