  md: '# Module 7: Regular Expressions 257


    Now let''s discuss what''s happening here. The regular expression we''re

    searching for is “thed”. Unlike what you''re used to, it''s really only

    searching for one character at a time. The character sequence “thed” isn''t

    present in the tested string, but a match is made anyway at least

    one of the characters that make up “thed” is present in the string. Looking

    back at the code, every t that''s found in the string will be replaced with a.

    Every h will be replaced with b and every e will be replaced with c.

    character d doesn''t have a matching replacement character, so the last

    replacement character in the string, which is c, will be used to replace it.


    A few options can be used along with the translation option. The first

    one we cover is the c option, which specifies that everything except for

    t selected characters are to be translated. This option is enabled by

    adding the c character after the last forward slash of a regular expression.

    The following is an example of a regular expression statement with this

    option enabled.


    ```

    $string1 =~ tr/0-9/t/c;

    ```


    The previous statement replaces any character that isn''t a digit between

    zero and nine with a tab. Here''s a programming example that demonstrates

    this option in use.


    ```

    #/usr/bin/perl

    $string1 = "There are 3 options associated with the translation option";nprint
    "Before the translation occurs the string contains, \n\''$string1 \n\n";n$string1
    =~ tr/a-z/t/c; ← the string contains, $string1 \n"

    print "After the translation\n"

    ```


    | This statement will replace any

    character other than a-z with a tab |'
