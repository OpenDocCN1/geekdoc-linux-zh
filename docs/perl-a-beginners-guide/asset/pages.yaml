  md: '# Module 10: Writing CGI Programs


    Table 10-2 lists and describes each of the possible status codes and responses.


    | Code | Response | Description |

    | --- | --- | --- |

    | 100 | Continue | The should continue with its request. |

    | 101 | Switching Protocols | Client has requested server version of HTTP protocol
    for its request. |

    | 200 | OK | Transaction succeeded. |

    | 201 | Created | Response indicates the URI (Universal Resource Identifier) by
    which the new document should be known. |

    | 202 | Accepted | Accepted for processing, but processing hasn''t completed.
    |

    | 203 | Partial Information | Information returned isn''t definitive or complete.
    |

    | 204 | No Content | Request was received, but there''s nothing to return. |

    | 205 | Reset Content | The server has fulfilled the request and the user agent
    should reset the current document being viewed. |

    | 206 | Partial Content | The server has fulfilled the partial GET request by
    the user agent. |

    | 300 | Multiple Choices | Resource requested is available at multiple locations.
    |

    | 301 | Moved Permanently Found | Data requested has been moved. |

    | 303 | See Other | Recommends the client try different URL or access method.
    |

    | 304 | Not Modified | Client has performed a GET, but the document hasn''t changed.
    |

    | 305 | Use Proxy | The request resource must be obtained from the server specified
    in the returned Location: field. |


    # Table 10-2 HTTP Status Codes'
