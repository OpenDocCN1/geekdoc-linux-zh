    Windows port of Perl. This port, which was funded by Microsoft for inclusion in
    its Windows NT Resource Kit, was developed by Hip Communications. Dick Hardt,
    the person at Hip is widely known as the driving force behind getting Perl for
    Win32 started, went on to start ActiveWare Internet Corporation and ActiveState
    Tool Corporation. Since then, Perl for Win32 has followed Hardt, where it is now
    maintained, free-of-charge to the public, by ActiveState.


