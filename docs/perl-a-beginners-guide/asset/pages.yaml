  md: '# Module 10: Writing CGI Programs 331


    to display this element as a multiselect box. This should look like the

    following:


    ```

    <select name="type" size="4" multiple>

    ```


    3. Finally, use the <option> tag to enter the various items that appear

    within the box. In the same manner that we defined these options

    for the <select> menu, you simply need to place the <option>

    elements before the beginning and before the ending <select> tag.

    The <option> entries themselves would look like this:


    ```

    <option value="rock">Rock</option>

    <option value="hm">Heavy Metal</option>

    <option value="rap">Rap</option>

    <option value="country">Country</option>

    <option value="gospel">Gospel</option>

