    Another issue to watch for in the Windows environment is this: by default, nearly
    all Windows applications take argument options with a / in front of them. For
    instance, if you want to see the syntax for the find command, you type find /?.
    This means in your Perl scripts that contain argument options, you also need to
    include the / preceding any options you need to pass. Here''s an example:


    ```

    @args = ("find", "/?");

    ```


    One final item that may come up in your use of the system() command, which is
    true for all systems, you must make sure any program you attempt to launch be
    internal to the system, in the %PATH environment variable, or contain a complete
    path to the executable. In other words, the system must be able to find the program.

    A good test is to go to a command prompt, change to the directory of your Perl
    script and type the command you expect to run. If it works, great—you are fine.
    If not, then you need to include either the directory that contains the program
    you are executing in your PATH or to specify the entire path to the program.'
