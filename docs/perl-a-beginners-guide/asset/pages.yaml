    # Note


    As many of you know, the next generation of the Mac OS is right around the corner.
    In fact, by the time you get this book, Mac OS X (pronounced ten), which will
    ship with Perl 5.6, should be available. This new operating system is based on
    some of the technology from NeXT (started by Apple founder and creator Steve Jobs)
    and UNIX-like capabilities. Because of this, we expect to see MacPerl fade away
    in favor of the standard distribution source code Mac OS X users will be able
    to compile like all the UNIX users.


    # Where to Get Help


    Once you have installed the interpreter, you''re ready to get started in your
