    \ This section lets you access other preferences for other Mac OS applications\
    \ and functions, such as Internet Config.\n\n# Notes About the Platforms\n\nNow\
    \ that you have Perl installed on your system, you're ready to learn about your\
    \ distribution. Because every operating system and environment is different, it's\
    \ impossible for Perl to behave and act exactly the same way across all the platforms.\
    \ Because of this, you should take the time to be exposed to some of the limitations\
    \ and/or advantages your platform has to offer.\n\n# UNIX\n\nThe UNIX variations\
    \ themselves are not that limiting. Nearly anything you can do within the UNIX\
    \ environment, you can simulate, control, or report on in Perl. This means you\
    \ have commands like kill or grep that can be used, and you can obtain UNIX-like\
    \ information from within your scripts. One key to remember is directory paths\
    \ contain / as the directory separator character.\n\n>  \n\nFor more information\
