    # Processing Our Form


    Now that our form is built and we''ve discussed how CGI scripts work and process
    information, let''s process the form. The first thing to do is write a script
    that can handle the form—a script we call userinfo.cgi. As with most of the other
    scripts, we use the CGI.pm to handle our form. To do this, first include an instance
    of the CGI.pm object in this module and write back the header. This is done with


    ```

    #!/usr/bin/perl -w

    use CGI;

    $query = new CGI;

    print $query->header;

    ```


    Now it''s time to read the keys and their values. To do this, the CGI module has
    a subroutine called param. All we must do to read in a value for a given key is
    to pass the key''s name to the param subroutine. So, for instance, if we want
    to read in text area (comments) in our form, we use the following line of code:


    ```

    $query->param(''comments'');

    ```


    That''s basically it! All we must now put the code to read in each of our form
    elements, and create a page on which to display them. To do this, we can use the
    following program. As you can see, there''s nothing special here and it''s quite
    repetitive.


    ```

    #!/usr/bin/perl -w

    use CGI;

    $query = new CGI;

    print $query->header;


    # pulldown menu

    print $query->b("Where Did You Hear About Us?<br>");

    ```'
