    # # Arrays


    An array variable is much like a scalar variable designed in that it''s created
    to store

    data. The difference is the array variable is designed to store a letter, whereas

    a scalar variable is used to store singular scalar data. The array variable

    isignified by beginning with the @ character. The naming rules for

    array variables are the same as for scalar variable names. These rules were

    covered in Module 2 of this book. After the @ symbol, the name must

    begin with a letter, and then any combination of letters, numbers, or

    underscores follow. If you''re writing a program and are using array

    and scalar variables, these can be named the same, simply because

    the first character designations ($ versus @) are different. Having a scalar

    variable named HT and @HT in the same program is legal. The first

    thing you should learn before you proceed is how to create an array

    containing scalar values.


    # # Putting Items In


    The process of creating an array is simple. The following piece of code

    creates an array containing ten values:


    ```

    @numbers = (1 .. 10);

    ```


    This line of code creates the array, @numbers, which contains the

    numbers one through ten. The previous line of code is called an array

    assignment. Each of the numbers contained in the array is referred to as

    e element of that array. You can print the contents of an array to the

    screen using the same print command we''ve been using. The following

    piece of code:


    ```

    print @numbers;

    ```


    prints “12345678910” to the screen. Whenever you print the contents

    of an array using only its name, as we did in the previous example, you'
