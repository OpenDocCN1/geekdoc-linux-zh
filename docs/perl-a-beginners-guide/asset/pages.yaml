  md: '# Module 6: Working with Files and Directories 201


    The previous example is usually a good way to store the contents of a file when
    you want the entire file. After you have the file stored in an array, remember
    that each line of information from the file is a separate element of the array.
    This can come in handy if you need to search for something in a file because you
    can search for it line at a time, or one element at a time. Searching for strings
    in files is covered in the next module, "Regular Expressions," of this book.


    Another way to read information from a file that gives you a little control is
    the read function. This function lets you read a certain number of bytes from
    a file. It lets you store the information in scalar or array variables, and it
    also lets you specify how many bytes of the information already stored don''t
    want to overwrite. Look at the syntax for this statement, and then we''ll go to
    a programming example to demonstrate this being used:


    ```

    read(file handle, variable, length, skipbytes);

    ```


    You''re already familiar with what the file handle does. The variable parameter
    is what you want to store the information in. The length field is where you specify
    how many bytes of information you want to read from the file. If you already read
    some information into a variable and you are using that same variable again in
    another read statement, you can use the skipbytes field to specify how many bytes
    of information you don''t want to overwrite.


    > Note

    A byte of information is one character. If you want to capture the string "Hello
    World," you must tell the read function to get 11 bytes of information. Remember,
    the space is also a character.


    Let''s look at a programming example that demonstrates the use of the read function.


    ```

    #usr/bin/perl

    print "This program will use the read function to get data from a file \n\";

    open (EXAMPLE, ''D:\Perl\book\test\example.txt'') || die("Could not open example.txt
    \n\");

    ```


    This line opens the file with

    the file handle "EXAMPLE"


