  md: '# Debugging Your Program


    One of the best methods of testing and debugging a Perl program is to run it from
    the command line, although this may be impossible for your CGI programs. Although
    debugging scripts is the focus of Module 12, "Error Messages and Debugging,\"
    we give you some quick pointers here on debugging your CGI scripts."


    +   - Make sure the file permissions are set correctly for the directories and
    the files your script needs to access.

    - If you are running your script on a UNIX system, make sure the path to the Perl
    binary (found at the top of the script) is correct. To check the location, type
    which perl from a command line of a telnet session.

    - Make sure you include the CGI.pm module before using it. To do so, use CGI near
    the top of your script.

    - Because you''ll be writing information back to the browser and calling subroutines,
    check for mismatched quote ("") or tick (\''\'') marks in your code.

    - Also check for mismatched curly braces ({}), and starting and ending HTML tags
    (< and </>).

    - Try compiling the code at the command line with perl -wc scriptname.cgi. This
    can uncover many common coding errors.


    # Moving On


    In this module, we briefly touched on many issues—everything from forms, to submissions,
    and CGI. We discussed the general concepts of CGI and using Perl as the language
    of choice to create these scripts.


    In the next module, we look at Perl system functions. These functions are implementations
    of popular system calls across the various environments in which Perl runs.'
