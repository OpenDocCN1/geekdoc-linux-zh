  md: '# Deleting


    To delete a cookie quickly, simply set the expiration date to a time earlier than
    the current time. So, we could use the following to delete our ID2 cookie. Notice
    that we passed the cookie() function in CGI.pm a -1 for the expires parameter.


    ```

    #!/usr/bin/perl -w

    use CGI;


    $query = new CGI;

    $cookie = $query->cookie(-name=>''ID2'',

    -value=>''ABC'',

    -expires=>''-1'',

    -path=>''/'',

    -domain=>''192.168.1.101'',

    -secure=>0);

    $query->header(-cookie=>$cookie);

    ```


