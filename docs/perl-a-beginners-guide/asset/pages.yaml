  md: '# Project 11-2: Creating a Script That Runs only on Windows


    Although this is a short project, we want to step you through an example of how
    you could use the $0 variable. The idea is simple: if you''re writing a script
    that''s only supposed to run on the Windows platform, how do you do that? Here''s
    how:


    # Step-by-Step


    +   1. First, create a Perl program file. Let''s call this file win_only.pl. Of
    course we recommend you put in the UNIX-style path to the Perl interpreter with
    the -w option, even though you''re only running it on Windows. This tells the
    interpreter to write out any warnings it may encounter. This looks like the following:


    ```

    #!/usr/bin/perl -w

    ```


    +   2. Next, use the require() function to make sure 5.002 is installed. Remember
    the previous note? This was the first version that included support for the $0
    variable. To do this, include the following in your code:


    ```

    require 5.002;

    ```


    +   3. Now, perform a check for the Windows system. For this we check, in the
    condition of an if statement, to see if the $0 variable is NOT equal to MSWin32.
    If it isn''t, exit the program by calling the die() function.


    +   4. Finally, add one last line. This line, if executed, simply states the user
    must be on a Windows''s system. Our completed code looks like the following:


    ```

    #!/usr/bin/perl -w

    require Perl 5.002 for $0 support.

    require 5.002;

    if($0 ne "MSWin32a"){

    die "\Error: This script can not be executed on a non-Windows

    ```'
