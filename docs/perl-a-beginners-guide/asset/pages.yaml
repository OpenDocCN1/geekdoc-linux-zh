  md: '# Perl: A Beginner''s Guide


    create your own packages and modules. To accomplish this, these use these few
    steps to make sure you create something truly useful.


    # Do You Really Need To?


    The first thing to do before you create a module is to ask yourself an honest
    question: do you really need to create this module? Sure, it sounds cool and flashy,
    but like any other project you work on, you should first consider if a need exists.
    Programmers, engineers, and yes, even authors spend large amounts of time on unnecessary
    projects. If your project is a learning exercise or you''re just playing at home,
    that one thing, but if it''s a real project, your inefficiency could dramatically
    affect an overall team effort.


    Here are some questions to ask yourself before you starting a Perl.


    +   1. Will you be able to use the subroutines you plan to put in your library
    in other scripts?

    2. Will you share or provide access to the functionality in your library to others?

    3. Will you have time to document and put comments in your library properly, so
    you and others can understand how your library works and how to use it?

    4. Will you have time to keep up your library for others who are using it?

    5. Are you prepared to make updates backward-compatible so you don''t break anyone
    else''s (or yours) codes.


    A little more than you thought, huh? Making the decision to create libraries can
    be a serious one and you should treat it accordingly. Again, this doesn''t mean
    you can''t or shouldn''t create a library. This only means you should carefully
    consider creating a library before you do it.


    > Hint

    in addition to what''s included here, check out the perldmodlib manpage on constructing
    new Perl modules and finding existing ones. This can help you determine if a module
    out there what you want and it''s also a great source of information on writing
    a new module.'
