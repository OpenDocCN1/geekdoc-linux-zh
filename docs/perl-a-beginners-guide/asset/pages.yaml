  md: '# Windows


    In addition to the built-in Perl, you should be aware of some enhancements in
    ActivePerl. The ActivePerl Perl distribution comes with more than just the Perl
    interpreter, which can be confusing to many people. As you probably saw in the
    install, it also comes with the following:


    +   - **Perl Package Manager (PPM)** A tool that enables you to manage your Perl
    extensions and modules easily.


    +   - **Perl for ISAPI** A Microsoft IIS filter that enhances the performance
    of Perl running in your Web environment.


    +   - **PerScript** A scripting engine, like JavaScript or VBScript, which can
    be used to create scripts that run within the Internet Explorer browser or against
    the Windows Script Host and for use with Active Server Pages.


    In addition to these components, the actual Perl implementation has enhancements
    specific to the Windows operating system. With this version of Perl, you can do
    everything from work with the Windows Registry to generate Window''s events to
    the Event Viewer. Unlike UNIX which uses the forward slash, /, to separate directory
    paths, Windows uses a backslash (\).


    # Tip


    For information on ActivePerl and other ActiveState offerings, check out http://www.activestate.com.


    # Mac OS


    ActivePerl, MacPerl has some features specific to the Mac platform. This includes
    additions, as well as features and functions that couldn''t be implemented. Many
    of the UNIX-like system functions, like fork, kill, and exec, are simply not implemented
    in MacPerl—the operating system has no concept of these functions. Others like
    time, open, and exit'
