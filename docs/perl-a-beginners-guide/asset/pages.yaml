    as libraries. As we discussed in previous modules, having a good programming style,
    which includes everything from well-documented code to organization, is extremely
    important if you want to succeed as a programmer. Libraries help you from the
    organization standpoint because they enable you to bundle groups of related functions
    into a library. This can help you in several ways.


