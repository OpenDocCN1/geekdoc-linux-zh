- img_proc: true
  md: '# Understanding Forms


    Now that you have your Web server up and running Perl CGI scripts, you should
    step back and look at HTML forms. Forms, which supply your scripts with data to
    process, enable you to enter data to be sent to your CGI program. Your program
    takes this information and returns results to the browser in the form of a regular
    HTML page.


    In the next few sections of this module, we introduce you to the basics of form
    construction. Although this isn''t a necessity for programming in Perl, it does
    lay the foundation for understanding how browsers send data to a server and how
    forms interact with CGI.


    # Form Construction


    Here, we step through creating all the HTML form elements that could make up a
    Customer Information form. Figure 10-3 shows what the complete form will look
    like. During this exercise, our objective is to show you the various components
    a form can pass. This way, we can show you how to process them in your scripts
    later in the module.


    ```

    <form>

    ```


    An HTML form starts and ends with the <form> tag and can contain a variety of
    fields and buttons. To begin, we insert a beginning and ending <form> tag. Because
    additional attributes are needed, we add these as well. For the attributes themselves,
    they are the following:


    +   - Provides the browser with a path to a CGI program that will handle the processing
    of the form. Because we are passing to a program called userInfo.cgi, this will
    be /cgi-bin/userInfo.cgi. We could have entered a complete URL with the hostname,
    but if you leave off the starting part of the URL, your Web browser submits the
    form to the host that supplied the form. This means you can actually create a
    form that''s submitted to a host besides your own, although you get a warning
    in most browsers.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Perl: A Beginner''s Guide


    ![](img/2070407c4a70134aab89572f10d21e60_351_0.png)


    **Figure 10-3** The Customer Information form


    # # Note


    Windows users should use /scripts/userInfo.cgi.


    +   - **method** Tells the browser what method to use when submitting the form.
    The values you have to choose from are GET and POST. More information on these
    two values later, but we use POST for this example because this is the recommended
    protocol. With the POST method, the information from the user is put into the
    data stream, or body, of the HTTP request. This lets your back-end CGI script
    read the data via the “standard input” data stream, in much the same way command
    line Perl scripts can take parameters.'
  merge: -1
