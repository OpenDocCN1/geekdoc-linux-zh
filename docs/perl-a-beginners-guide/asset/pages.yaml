    # What Is a Module?


    In short, a module isn''t much more than a package. The real difference is a module
    is designed to be reusable. This is accomplished by allowing some or all of a
    module''s variables and subroutines to export into other packages, although it
    isn''t necessary to export anything for a library to be a module. This is an easy
    concept to understand, but it can be a challenging to implement correctly in your
