    variable in this program.


    Now you know how to display the contents of a file, but what if you need to store
    all the contents for later use? The previous programming example didn''t store
    all the contents because the same scalar variable was used each time a new line
    was read in. Probably the easiest way to store the entire contents of a file is
    to use an array along with the file handle in an assignment statement. Here''s
    a coding example to demonstrate this for you.


    This line opens the file with the file handle "EXAMPLE"


    ```

    #/usr/bin/perl

    print("This program will open an entire file \n\n";

    open(EXAMPLE, "D:\\Perl\book\test\example.txt") or die("Could not open example.txt\n");

    @text = <EXAMPLE>;

    print(@text);

    ```


    This line prints all the elements of the array


    This line reads each line of information from the file as an element of the array
    @text


    The output of the previous programming example, storing and outputting all information
    from a file, is shown in the illustration.


    ```

    Sode.pl

    This program will open an entire file

    This is the first line of text from the example.txt file.

    This is the second line of text from the file.

    This is the third line of text from the file.

    D:\Perl\book>

    ```'
