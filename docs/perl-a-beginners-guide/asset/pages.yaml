  md: '# Module 12: Error Messages and Debugging | 409


    The search option can be used to search through a program for a certain string.
    You don''t have to specify line numbers to use this option; you only need to supply
    the string you want to search for in the program. Searching for string sounds
    familiar, doesn''t it? Searching for a string is similar to a regular expression
    search, in fact, you have implemented a program as your final project in Module
    7 that does something similar to a specified file. The string you want to search
    for must be enclosed with forward slash // you want to start from the beginning
    of the program. The following is an example of how to issue this command, and
    Figure 12-9 shows the screen output from the command:


    ```

    DB(6) /key/

    ```


