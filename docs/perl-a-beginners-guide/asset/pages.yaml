    Another array function is the sort function, which is used to sort the contents
    of an array. This function sorts elements in terms of their ASCII values. To refresh
    your memory, let''s review what that means for numbers and strings.


    When numbers are sorted by their ASCII value, they aren''t placed in numerical
    order. The sort function looks at the leftmost digit of that digit to determine
    where that number should be in a sorted list. If two numbers have the same first
    digit, the next digit is used in the comparison. Remember, that sort always begins
    with the leftmost digit. As an example, you run the sort function on an array
    that contains two numbers—300 and 8—300 will be the first element in the new array
    because the ASCII value of 3 is less than the ASCII value of 8.


    Sort follows the same rules for strings. It looks at the leftmost letter and determines
    the ASCII value of that letter. If the leftmost letters are the same, it goes
    to the next letter until it finds two letters that are different. Remembering
    all this, here''s a programming example that uses the sort function on a few different
    arrays:


    ```

    #!/usr/bin/perl

    print "the original array contains @sortedarray\n"

    @sortedarray = sort(@array);

    print "the original array still contains @array\n"

    @array1 = (500, 9, 2000, -11000, 25, -27);print "The original array1 contains
    @array1\n"

    @sortedarray1 = sort(@array1);

    print "The sorted array1 contains @sortedarray1\n";

    ```


    | @array is sorted and the new | @array is sorted and the new |

    | array is stored in @sortedarray | array is stored in @sortedarray1 |'
