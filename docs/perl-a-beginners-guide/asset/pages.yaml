    a simple library that contains two subroutines. The overall focus of the library
    is simply to use user input from a console, and we print it back to the screen.
    So, we call our library Prepare and put it in a file named Prepare.pm.


    2. Now that our objectives are defined, lets take our template from Module 1 and
    start filling in the information about and a description of our library. The following
    is an example of what you may want to have.


    ```

    #!/usr/bin/perl -W

    # Script Name: Prepare.pm

    # Script Version: 1.0

    # Date: 12.31.2000

    # Author: R. Allen''

    # Description: This module contains 2 subroutines. The first

    # takes a single parameter, which we assume is from a

    # console window, and removes any tailing return

    # characters. The second subroutine will print the

    # "results" to the user''s screen. The library requires

    # that you have the Exporter module accessible.

    # install the library, simply place it # in the lib

    # subdirector of your Perl distribution with the # other

