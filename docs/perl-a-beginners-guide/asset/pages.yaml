  md: '# Module 6: Working with Files and Directories


    gives full permissions for the file and everyone else will only be able to read
    the file. With that said, here''s the syntax for the chmod command:


    The mode is where you enter the octal representation for the permissions you want
    to select for a file. The filename is where you specify the name of file for which
    you want to set the new permissions. The following is an example of this function
    being used:


    ```

    chmod (0744, "output.txt");

    ```


    When this statement is executed, the file output.txt will have rw permission for
    you, r permissions for UNIX group, and r permission for anyone else has access
    to your files. To make sure this is clear, let''s look at it mapped out for you.


    | Groups | user | group | world |

    | --- | --- | --- | --- |

    | Octal numbers | 7 | 4 | 4 |

    | Binary numbers | 1 1 | 100 | 100 |

    | Possible permissions | rwx | rwx | rwx |

    | Selected permissions | rwx | r | r |


