    proper permissions to install Perl. You can try, but a chance exists that restrictions,
    such as account space, have been imposed. If you are unable to install, but still
    want to go through the process, talk with your system administrator or even load
    Linux on a home computer you may already have.


    For UNIX:


    +   1. Download the standard distribution source code from http://www.perl.com/pub/language/info/software.html.
    If this link is broken, start back at the main page (http://www.perl.com) and
    follow the links to software or download. The file you should be downloading be
    named something like stable.tar.gz.

    2. Unzip the file using the command gzip -d stable.tar.gz. This leaves a file
    called stable.tar. If you don''t have the gzip program on your machine, you can
    obtain a copy at http://www.gnu.org.


    # Hint


    Not sure if you have a copy of gzip on your machine? Type find -name gzip -print
    at a command prompt to search all directories that you have access to this program.


