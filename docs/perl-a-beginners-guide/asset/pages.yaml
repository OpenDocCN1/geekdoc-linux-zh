- img_proc: true
  md: 'You can use a scalar variable that contains the pattern you are searching for
    in between the the forward slashes if you need to change the pattern depending
    on different circumstances. The following two lines of code demonstrate this for
    you:


    ```

    $sequence = "SRT";

    $Result = $string ~ /sequence;

    ```


    The previous two lines of code and the following line of code are equivalent:


    ```

