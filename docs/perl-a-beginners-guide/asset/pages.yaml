    In the second subroutine, we check to see if an argument is passed. If so, we
    print the value of the argument, along with some dashes, so it shows up early
    in the output. The remaining code looks a lot like &firstCount. We print an incremented
    version of the global counter, which is actually the localized counter from &firstCount,
    we declare a &secondCount localized version with a new value, and then we print
    it. Finally, if an argument was passed we again end the subroutine with the name
    of the calling subroutine with dashes around it.


    Now that the second subroutine has completed, the program jumps back to where
    it was called in the first subroutine. Seeing nothing is left to do, the program
    jumps all the way back up to where the first subroutine was called in the main
    program. Once it has returned, we print another incremented version of $counter
    and find it has a value of 2—where the original $counter ended. This is because
    the last time this global version was updated was in the first part of the call
    to &firstCount, Remember, the global counter incremented in the second subroutine
    was actually the localized version from &firstCount.


    Next, the script calls the second subroutine again but, this time, it isn''t from
    inside the first subroutine. Because no arguments are passed, it avoids printing
    the lines of text and goes right into the printing of the value of ++$counter,
    which is 3 and represents the global counter. Finally, it declares another local
    version of $counter, again assigning it to 10, and then prints its value. Once
    the subroutine has completed, it jumps back to where it was called for a final
    print statement to print the value of an incremented global $counter, which now
    equals 4.


