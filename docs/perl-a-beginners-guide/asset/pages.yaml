    Now that you''ve learned about forms and completed the example, let''s look deeper
    into how forms actually work. In the following sections, we start getting into
    the trenches of parsing the information that users type into these forms with
    a Perl CGI script.


    # ## How Forms Are Submitted


    Every form that''s meant to pass information back to the server contains at least
    one element. Even if only a single text field or radio button exists, the form
    is submitted when the user presses the Submit button.


    When a form is submitted, all the information entered in the fields is sent via
    HTTP to the program specified by the action attribute of the <form> tag. The information
    is sent in plain ASCII in a key=value format, where the name of the element is
    sent, followed by an equal sign, and then the value of the data. Each pair is
    separated with an ampersand (&). The way the information is sent, which can either
    be GET or POST, depends on the value defined in the method attribute of the <form>
    tag.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Module 10: Writing CGI Programs 339


    The server application takes this information and potentially returns a results
    page to the user. The page can be anything you want, ranging from a simple message
    to a complete query result from a database.


    # GET


    GET is the default method for submitting forms. Although it''s the default method,
    there is a problem with GET. Because this method appends the information contained
    in the form to the URL of the program in the form of a query string, the complete
    URL can be so long that it exceeds the available environment space. This can cause
    the server to truncate the URL, which then results in an incorrect submission.

    If decide you won''t have any trouble using GET, such as with short forms with
    small amount of data, then remember, the output is stored in "URL-encoded" form.
    When this form, the information can be obtained from environment variable QUERY_STRING,
    which is available to your scripts. As mentioned before, each piece of data is
    sent in a key=value pair format. So, for example, if the reader selects a radio
    button with the name gender, the QUERY_STRING environment variable appears as
    gender=on.


    # POST


    POST is the second, and most common, method used to submit forms. This is because
    it doesn''t limit the amount of data that can be passed to the server program.
    POST can do this because the information isn''t passed on the URL but, rather,
    in the body, or standard input (STDIN in Perl terms) of the request. You specify
    this the method attribute to post.

    To read the submitted data to the server, you first need to determine its length.
    This can be done by using the CONTENT_LENGTH environment variable, after which
    you can read the exact number of bytes into another variable. The string is URL-encoded,
    so you need to parse it and decode the escape characters. Because the way this
    information comes across is a bit confusing, here''s a quick example. To see what
    this'
  merge: -1
