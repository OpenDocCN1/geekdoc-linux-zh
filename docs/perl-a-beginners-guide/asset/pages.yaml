    # Your Program Repository


    Organization from a repository standpoint is also important. If nothing else,
    you should keep similar programs in organized directories. This enables you and
    anyone else using your programs to find the program or package needed quickly.
    Yes, programs like `grep` do quickly search through directories and files for
    specific keywords, but this isn''t quick when you have tons of programs. And who
    wants to learn every possible option you need to run the exact `grep` command
    your request demands? Here''s a quick example.


    Programs, for instance, that deal accepting form submissions on the Web could
    be kept in a `www` directory. You might even go one step further, depending on
    the number of programs you have, by adding directory levels. If one set of forms
    is related to shopping on your site, then another collects user data, you should
    store them in a `www/userdata` directory. Whatever level or breakdown you deem
    necessary is better than no organization at all. But, remember, good, descriptive
    directory names in local locations can ease your retrieval of programs.


    # Note


    In the directory examples just mentioned


    As you can see, organization is important when programming. Without organization,
    chaos can ensue and managing your scripts will be difficult to impossible. With
    that chaos comes many late nights and headaches. Perl provides several methods
    for organization and, with good programming practices, you can use them to your
    advantage.'
