    # Figure 12-5 The initial debugger screen


    Figure 12-5, it says "DB(1)". The DB stands for debug and the number enclosed
    in parentheses represents the number of commands you entered into the debugger.
    This is also the line where you will be prompted to enter your next command. Now
    that you know how to initialize the debugger, let''s cover some commands.


    First things Any valid Perl statement entered as a command is executed against
    the current program. You can use this to alter the behavior of your program. This
    option will make more sense to you as you read through this module.


    The first thing to do after initializing the debugger on a program is to list
    the program you are going to step through. You can list a program in several different
    ways. We begin with the simple commands and work up to the more specialized ones.


    If you simply want to list the entire program in the debugger, you can use the
    l command. Using this command prints ten lines of a program out to the screen
    at a time, including line numbers and the current place holder. To display the
    entire program, you must keep issuing the l command until the end of the program
    is reached. Figure 12-6 shows the l command being issued.'
