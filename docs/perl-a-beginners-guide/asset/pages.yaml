    # A Simple Perl CGI Program


    By this time, you''re probably ready to see a Perl program. We have a few more
    topics to go over before we write one, but we have included a short program for
    you here, along with some general comments.


    As you know, Perl is made up of functions and other language elements. These elements,
    which you might find easier to think of as commands, let you, the programmer,
    perform specific functions. For example, the print() function sends output STDOUT,
    which is the user''s screen when run from the command line.


    When using Perl, or any other language for that matter, to create Web pages, it''s
    necessary for your script to generate the proper HTTP headers. We won''t go into
    great detail about how to generate these headers on your own because we''re using
    the CGI.pm module to do this. understand a simple Perl CGI program that generates
    the header using the CGI module and some HTML for the user''s browser, look at
    the following example:


    ```

    #!/usr/bin/perl -w

    use CGI;

    $Query = new CGI;

    print $Query->header;

    ```'
