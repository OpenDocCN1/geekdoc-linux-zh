  md: '# 1-Minute Drill


    +   - What is a necessary requirement before using the system() function on Mac
    OS?


    # Operating System-Specific Issues


    Over the duration of this module, we''ve gone over using the system () function
    across the Windows, UNIX, and Mac OS systems. But we''re sure you want more. You
    want to know of any other issues—outside what we covered so far—that exist between
    these environments.


    In this section of the module, we give you a high-level summary of some of the
    overall differences using Perl on Windows, UNIX, and Mac OS systems. Again, we''ve
    touched on some of the differences in Module 1 earlier in this module, but most
    of them were syntactical. These issues are more specific items to the system.
    Topics you should know about when you write scripts for them or scripts that need
    to run across multiple systems.


    # Windows


    The first thing to watch for on Windows systems are filenames. Several, which
    are listed in the following bulleted list, are treated in a special way. Because
    of this, you should avoid using any of these as filenames in your programs.


    +   - AUX

    - COM* (where * represents an integer, as in COM1)

    - CON

    - LPT* (where * represents an integer, as in LPT1)

    - NUL

    - PRN


    +   - ToolServer must be installed and running'
  merge: -1
