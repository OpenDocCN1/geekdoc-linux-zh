  md: '# Conclusion


    Well, that does it! You''ve fought your way through step one of learning the Perl
    language and how to program in it. We want to say “Congratulations!” We know this
    wasn''t easy at times, but you did it. You learned the Perl language and the community
    of programmers who use it. You learned many of its semantics and were introduced
    to everything from regular expressions to CGI and database access programming.
    You were even exposed to several advanced topics to tease you with future exploration
    into the world of Perl. So, what''s next?


    Perl covers a vast range of topics, to which you were partially exposed in this
    book. Our intent was to introduce you to these topics and to make you aware of
    other topics. Now that you''re ready to move from a beginner to an intermediate
    Perl programmer, we hope you continue with your educational effort. You can do
    so much with Perl. All it takes is a little effort and the understanding of some
    basic concepts—concepts which you now know.


    So, go out into the world with a new look and motivation. Check the http://www.perl.com
    site often and see what''s next on the list of dominating the programming world.
    See how you can get involved and how you can learn new tricks and tips on using
    Perl in places you never dreamed. Make yourself—and us—proud to be a Perl programmer!'
