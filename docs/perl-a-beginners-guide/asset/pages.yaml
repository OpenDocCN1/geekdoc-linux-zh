- img_proc: true
  md: 'an unbelievable capability to manipulate text, files, and system processes.
    This free, easy, and useful approach allowed the Perl language to catch on quickly.


    Today, Perl is maintained by a core group of volunteers (the "Perl Porters") and
    programmers around the world. Like Linux, Mozilla, sendmail, and any other open
    source effort, Perl has tapped the world as its development team, and leverages
    the knowledge of many to provide us with the best possible language for our work.


    # Up to Perl 4


    After Perl 1.0 came Perl 2.0, which was released on June 5, 1988. By this time,
    the number of Perl programmers had grown, as did the use of the language. Many
    different types of programmers were using Perl for everyday tasks and individuals
    within major corporations promoting the language.


    A year and a half passed before the world saw Perl 3.0, which was released October
    18, 1989, some two years after it hit the wire. With this release, Perl was first
    distributed by the GNU General Public License (GPL) version 1.0, which allows
    for the distribution of free software. By this time Perl had taken off.


    Thousands of programmers were using it and the Web, which was in its infant stage,
    really gave Perl a boost. Perl had been widely used by UNIX administrators, but
    was quickly becoming the standard for writing CGI scripts for processing form
    data on the Internet. CGI is covered in Module 10, so it won''t be discussed in
    detail here but do, note, it is a significant module in the history of Perl.


    Then, in March of 1991, Perl 4.0 was released under the GPL as the new Perl Artistic
    License. This is the version of the language with which many Perl programmers
    started. Perl was now a fairly mature language that had a robust set of functionality,
    although it did suffer from some performance problems.


    > Tip For more information on the GNU Licenses you can see our Web site at http://www.gnu.org.
    There you read information on the GNU GPL.'
