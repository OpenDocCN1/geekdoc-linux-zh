  md: '# 288 Perl: A Beginner’s Guide


    In 1996, Postgres95 was completely overhauled—just as Perl 5 was—and released
    as PostgreSQL version 6.0, which marked one of the first major releases people
    began using. PostgreSQL version 6.0 included increased backend speed, SQL92 standard
    enhancements, and other important backend features, such as subselects, defaults,
    constraints, and triggers.


    # Tip


    Are you a big database user? You may want to know, about the only major thing
    PostgreSQL doesn''t have over other major databases is outer joins, but this feature
    is supposed to be added at a later date.


    # Application Details


    The standard PostgreSQL installation, which we go through later, uses port 5432
    to listen for TCP/IP connections. This installation—running as the postmaster—lists
    for connections on this port. This process manages the communications between
    the front-end clients and the backend server.


    Once running, PostgreSQL offers two operational modes. The first guarantees that
    if an operating system or hardware crashes, the data has been stored and saved
    on the disk. This is a slower mode than commercially available databases because
    of the flushing, or syncing, method PostgreSQL uses. The second mode, which doesn''t
    offer the data guarantee, runs faster than commercial databases. As you can see,
    PostgreSQL offers you the choice: data security or speed. But, unfortunately,
    no intermediate mode offers a certain level of both.


    # Note


    If you''re concerned about this, don''t worry too much. This is going to be provided
    in a later version of the software.


