  md: '# Module 13: Advanced Features and Concepts 435


    http://msdn.microsoft.com/scripting If you use JavaScript or VBScript, check out
    Microsoft''s scripting site for developers. You can find documentation, scripting
    engine downloads, and additional information on the various locations in their
    products where these languages can be used.


    http://www.ecma.ch This site is the home of ECMA (ECMA-262) language specification
    is maintained. This language, which is based on early generations of JavaScript
    and JScript, represents the core standardized portions of the language from which
    JavaScript and JScript now draw.


    In a nutshell, the best way to compare PerlScript on the client side is with JavaScript.
    A fair number of the objects, such as Window Document, are the same, as many of
    the methods (or subroutines in Perl terms), as with write() or alert(). One big
    syntactical difference is PerlScript uses -> as the separator between objects
    and subobjects, properties, or methods instead of a period (.). Here''s an example
    to help clarify this.


    Let''s say you write the "Hello, World!" to the page loaded by Internet Explorer
    5. In JavaScript (or JScript, remember, they are basically the same), you would
    use the following lines of code:


    ```

    <script language="JavaScript" type="text/javascript">

    document.write(''Hello, World!'');

    </script>

    ```


    Now, for PerlScript, you would use this:


    ```

    <script language="PerlScript" type="text/perlscript">

    $window-document.write(''Hello, World!'');

    </script>

    ```


    As you can see, they are quite similar. When programming in PerlScript, you must
    make sure the language and type attributes of the <script> tag are correct, and
    you have to change the periods to ->. PerlScript also requires the complete object
    hierarchy, which is why the $window portion is in our example. In JavaScript,
    you could include the top-level object reference, but it isn''t required.


    ![](img/2070407c4a70134aab89572f10d21e60_458_0.png)'
