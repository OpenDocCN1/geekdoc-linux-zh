- img_proc: true
  md: '# Module 10: Writing CGI Programs | 359


    When using the CGI.pm module, this header directive is set using the following
    format:


    ```

    ```!/usr/bin/perl -w

    use CGI;


    $query = new CGI;

    print $query->header(-type=>''text/html'');```

    ```


    # Redirecting


    A second popular header you may want to use is the Location header, which lets
    you redirect the browser to another location. You see this when a page has been
    moved. This is one of the easiest things to implement and can be done with or
    without the help of the CGI.pm module.


    If you want to do it without the help of the CGI.pm module, then use the following
    syntax. This, for example, would send a user to the /error.html page. Notice the
    \n\ at the end of the statement. This is necessary to tell the user that it ends
    the header portion of the response. This, should ONLY be used on the LAST header
    directive, otherwise any header directive below it is interpreted as the body
    and displayed in the browser.


    ```

    ```!/usr/bin/perl -w

    print "Location:/error.html\n\n";```

    ```


    If you decide to use the CGI.pm module, then you can implement a redirect by simply
    having the following:


    ```

    ```!/usr/bin/perl -w

    use CGI;


    $query = new CGI;

    print $query->redirect(''/error.html'');```

    ```


    # Hint


    One advantage of using CGI.pm is it also inserts the rest of the needed HTTP header
    directives. Browsers usually work without these HTTP header directives, but it''s
    more complete with them.'
