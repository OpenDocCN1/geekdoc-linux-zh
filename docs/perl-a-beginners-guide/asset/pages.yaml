  md: '# Perl: A Beginner''s Guide


    Let''s say you have user information you want to store on people. In addition,
    you keep track of all the products people have bought. In a simple example, we
    could store this information in two tables: one called users and the other called
    purchases.


    Now the users table would have columns userID, FirstName, LastName, and maybe
    ZIP. The purchases table, on the other hand, would have columns ItemName, ItemNumber,
    Cost, and UserID. In the users table, you would define the entries in the UserID
    as unique. This means, for instance, one user would have the ID of 1, one user
    with the ID of 2, and so. In the purchases table, however, this needn''t be true.
    We want to store everything a given user buys, and because each user may buy more
    than one item, you can have multiple occurrences of UserID.


    Did completely confuse you? Don''t worry, we''ll draw it out to help you understand.
    Look at Tables 9-1 and 9-2 to see what we mean. We have populated them as an example.


    Now let''s try to explain what''s in the tables. First, each of the users has
    his or her unique ID. In addition, we have the user''s first name, last name,
    and ZIP code stored with his or her information, and all of this is in the users
    table. In the second table, because we don''t want to list first name, last name,
    and ZIP code again, we simply store the UserID for the user who made the purchases
    listed. So, for example, UserID 1, who is John Doe, purchased the Keyboard and
    the USB Mouse.


    This is an easy example, but it illustrates a powerful point. By properly storing
    your data in a relational format and under a logical design, you can join items
    together to get a great depth of information. Just think, you could easily have
    another table called accounting, which stores past bills or current status for
    the users, or maybe a table called services, which stores any extra value-added
    services the users can sign up to.


    | UserID FirstName LastName ZIP |

