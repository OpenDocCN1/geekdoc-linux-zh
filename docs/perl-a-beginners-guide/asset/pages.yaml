    the highest level of precedence at the top.


    +   * +?(

    ^$ \b



    Until now in this module, you''ve learned how to specify almost any regular expression
    imaginable. Now that you have all tools under your belt, we need to cover more
    options, but these are options that determine how a pattern is matched, instead
    of what kind of pattern to match.

    We just discussed how regular expressions are case-sensitive, but there''s an
    option to turn off case sensitivity. To ignore the case of letters, you have to
    add an i after the last forward slash of the regular expression. Here''s an example
    regular expression to clarify where the i needs to go.


    ```

    $string =~ /gibson/i;

    ```


    This regular expression matches "Gibson" or "GIBSON" or any other combination
    of uppercase or lowercase letters that make the word. Remember the last programming
    example we did when the first string2 was thrown out? Now let''s look at it again,
    using the ignore case option and what happens.


