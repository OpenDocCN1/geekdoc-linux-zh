- img_proc: true
  md: '# Overlap with Multiple CPUs


    The number of CPUs inside the computer and how they are interconnected form the
    basis for one multiprocessor naming convention. Four basic kinds of multiprocessors
    exist, representing the four ways that CPUs and physical memories have been successfully
    combined into a working computer.


    # Uniprocessors


    A uniprocessor (UP) is literally a single-processor computer that contains just
    one CPU, such as the one shown in Figure 2.1''s system. The computer stores instructions
    and data in physical memory, also called random access memory, or RAM. Provisions
    exist for getting information into and out of the computer''s memory through input
    and output (I/O) devices, supported by software inside the operating system, or
    OS. (Don''t you love this alphabet soup?)


    # Multiprocessors


    A multiprocessor (MP) has two or more processors, but it has only a single, shared
    memory that may be accessed by any of its CPUs, as shown in Figure 2.2. With multiple
    CPUs, more than one program can run at the same time. This allows for parallel
    execution, provided that software in the OS supports this feature.


    This is a double-edged sword, however. You must program these machines carefully,
    taking into account that two of your instructions might set one of your variables
    to different values at the same time! (Technically, only one of them will actually
    happen first; which of them depends on the wiring and logic associated with the
    physical memory, but that level of detail is beyond the scope of this book.) You
    can protect shared data on an MP by using semaphores, which are discussed in the
    next chapter.


    ![](img/baab715d8836960db042fe4f6aa38002_27_0.png)


    # Array Processors


    An array processor is a special-purpose computer with many individual processors,
    each with its own physical memory area, as shown in Figure 2.3. The benefit of
    such a machine is its capability to execute the same instruction on all processors
    at'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# CHAPTER 2 Multiprocessor Architecture


    once. For example, consider an ADD instruction. The two numbers to be added together
    are specified as address offsets into each of its processor''s memory areas. Your
    program gives the same ADD A to B instruction to each processor in the array,
    but each memory area has a different set of numbers at its A and B offsets.


    ![](img/baab715d8836960db042fe4f6aa38002_28_0.png)


    **FIGURE 2.3** Array processor—many CPUs interact with special-purpose memories.


    Note that a list of lists is called an array in most programming languages; hence
    the name array processor. Mathematicians call a list of related numbers a vector,
    so you may also see this kind of machine called a vector processor.


    If you have two lists of numbers to be added together, A[0] to B[0], A[1] to B[1],
    and so on, you can give the same ADD instruction to every processor. Each value
    in list A is added to each corresponding value in list B, all in a single instruction
    cycle! If your application requires many of the same operations on lists of values,
    this is the kind of computer for you.


    # Pipeline Processors


    A pipeline processor is a highly specialized machine that can exploit overlap
    at the instruction level with only one CPU. The ADD A to B instruction, for example,
    can be viewed as a multistep process:


    +   1. Get the ADD instruction from memory.


    +   2. Get the address of variable A from the instruction, and then the value
    of variable A from memory.


    +   3. Get the address of B from the instruction, and then the value of B from
    memory.


    +   4. Add the two values, putting the result into the memory location of variable
    B.'
  merge: -1
