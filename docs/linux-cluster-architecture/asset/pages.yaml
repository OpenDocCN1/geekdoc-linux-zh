- img_proc: true
  md: '# Tightly Versus Loosely Coupled Multiprocessors


    ![](img/baab715d8836960db042fe4f6aa38002_31_0.png)


    FIGURE 2.5 NUMA—nonuniform memory access times (same as loosely coupled).


    Note that in some references, the NUMA is further separated into NUMA and NORMA
    (No Remote Memory Access through hardware). NORMA systems, these texts explain,
    require software intervention to cache a memory access and then send a message
    to that system, requesting the required memory from it. NUMA differs from a NORMA
    in that it has individual systems interconnected with a high-speed back plane,
    and when a memory access is outside of the local system, the back plane electronically
    gates the requested data into the memory register of the requesting CPU. Remote
    memory access in a NUMA is still much slower than memory access speeds, but the
    hardware handles everything, eliminating the need for specialized memory access
    software. Technically, you are going to build a NORMA system. If you do any further
    reading, it will be pleasant if you are aware of this minor technical disagreement.


    # Tightly Versus Loosely Coupled Multiprocessors


    Tightly coupled MP systems are very efficient. All their processes can communicate
    with one another at internal bus speeds, in a nanosecond time frame. Their disadvantage
    is their high cost and their single point of failure—the central memory and its
    data bus. Some designs redundant bus structures and the like, but this chapter
    considers such classifications in general terms.


    A network of computers, as the multiprocessor you are going to design in this
    book, is called a loosely coupled MP if the processes want to communicate with
    one another, they must do so over their external interconnection media at I/O
    bus speeds, usually in a millisecond time frame. Interprocessor communication
    over a network is thousands of times than than a tightly coupled multiprocessor
    (MP), but it has the advantage of relatively low cost. High availability through
    fault tolerance may be achieved in software.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Loosely coupled MP systems are difficult to tune because when a process communicates
    with a process on another computer, it is likely to be sending or receiving a
    packet containing control information and data. Control information needs to be
    examined and data needs to be processed. The ratio of the size of the information
    one process sends to another is a primary measure of efficiency in such systems.
    If the chosen packet size is too small, many packets may have to be sent to complete
    a transfer; if the packet size is too large, the receiving process might spend
    too much of its time idle, waiting for another packet process. When the packet
    is tuned to the right size, according to relative processors and speeds, the next
    packet arrives just as the previous one is finished—just in time. The correct
    packet size can vary from application to application and may vary from one point
    in the same application to another—a function of processor or network loading.
    This nontrivial problem is a subject of ongoing research.


    Tightly coupled MPs are very efficient because the time it takes to transfer an
    instruction or for data to be processed is the same for all CPUs; they share the
    same memory. Loosely coupled MPs have a memory transfer bottleneck by design:
    CPUs spend a lot of time sending messages to another over a slow communication
    network medium. Although switched gig ethernet compares well against all the fastest
    backplane interconnections, it’s still slow when compared to direct memory access
    speeds. Successful loosely coupled MP systems have their software tuned to the
    needs of a specific application.


    In general, MP systems that have one central memory shared among its processors
    perform better than those many independent node computers on a network, each with
    its own physical memory. The central memory system is far more expensive, however,
    and a network of computers can compete, performance-wise, if it is carefully tuned
    for the application for which it is designed.


    Remember, too, that when a CPU fails inside a tightly coupled MP, the whole system
    is sent back to the manufacturer. When one of your network’s PCs fails, only one
    needs to be repaired or replaced. The system is still there, minus just one CPU.
    Such a benefit can outweigh the many technical challenges faced by the cluster
    architect.


    You will design, build, and tune a loosely coupled MP in the course of this book.
    Evidence supports the claim that an 8-to-16-node loosely coupled MP can provide
    the same or better performance as a tightly coupled MP 10 times as (See the description
    of NASA’s Beowulf Project at www.beowulf.org.) The deciding factor, however, is
    that designing, and tuning a loosely coupled MP is within our grasp; a tightly
    coupled MP may not be. Consider too, that you can buy the necessary individual
    processors at a very reasonable price in today’s salvage market.'
  merge: -1
