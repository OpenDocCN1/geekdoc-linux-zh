  md: '# Inter-Arrival Time Distributions


    you may recognize this as the plot of a decaying exponential. Instead of tabulating
    observation data, you can generate query IATs with an exponential distribution
    or perhaps with some other function that fits your data. You will discover how
    to generate exponential IATs and learn about a few other, simpler distributions.


    Uniformly distributed means each possible choice of a value from some range is
    chosen with equal likelihood; each value has the same probability of being chosen.
    The C language has the rand() and the rand() functions. You can use


    ```

    random = rand()/(double)RAND_MAX;

    ```


    to get a random number that is chosen uniformly between 0.0 and 1.0.


    Note how rand() is used in Listing 8.1 to seed the random number generator function,
    rand(). In this example, you get getpid() which returns the process ID. You can
    also use the microseconds portion returned by the gettimeofday() function.


    > NOTE

    The seed value doesn''t have to be a random number, just different each time you
    run, assuming you want a different set of results each time.


    To get random numbers distributed exponentially or otherwise, you can use uniformly
    distributed random numbers as the starting point. After a uniform value is chosen,
    you can use it to calculate a value in any distribution you want, as long as you
    know the formula. The data suggest that query IATs are exponentially distributed,
    you can use the formula


    y = 1 - e^{-Ax} [Equation 8.1]


    representing a decaying exponential, where A is the desired mean, or average IAT.
    Generating exponentially distributed random numbers from a set of uniformly distributed
    random numbers requires the use of an inverse function, in which y is expressed
    as a function of x. (See the books in the section "Further Reading" for more details.)
    The inverse of Equation 8.1 is Equation 8.2:


    x = -A * log(y) [Equation 8.2]


    which can be implemented in C as


    ```

    #include <math.h>

    ndouble x, y, a = 1.0;

    random = rand()/(double)RAND_MAX;

    random = -a * log(random);

    ```'
