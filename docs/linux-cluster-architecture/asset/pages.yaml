    processes that must communicate with others across the network, working together
    to present the single-system image described in Chapter 1, "Linux Cluster Fundamentals."


    Most multiprocessors can be built only by computer manufacturers. The multiprocessor,
    however, is one that you can build from readily available components and some
    custom software. When properly tuned, it can outperform a single computer of equivalent
    power by exploiting overlap, the parallelism inherent in many transaction-processing
    and supercomputer applications. Let''s start with an overview of the classical
    multiprocessor architectures and follow their trend to the cluster system you
