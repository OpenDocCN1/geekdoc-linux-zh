    # Software Options


    The software choices are simpler. You want an operating system that is sophisticated
    enough to support a local area network, remote command execution (remote shell)
    access from one machine to any other on the network, and a reliable C compiler.


    Unix has all the required features, and several versions are available for the
    PC. The cost of the OS software goes up with features, not quality, so you have
    an advantage because you will not need many. A sophisticated Linux user can configure,
    build, and install the OS for no cost beyond the download on an Internet connection.
    For the rest of us, a simple version of Linux is available for less than $50,
    including basic documentation and a user-friendly installation program. The test
    system runs the Linux 2.0.30 kernel in character mode (no Window support). If
    you are going to attach only one monitor, keyboard, and mouse, you may want to
    include the X Window System, which will enable you to open an individual window
    to each the machines on that single monitor.


    Linux comes with a good C compiler, unlike many other operating systems. Linux
    is certainly the best choice. The security is one Linux feature that gets sophisticated
    with time, older versions are preferred over newer ones. Security within your
    local area network is not an issue—you are not going to attach anything to the
    Internet or elsewhere outside your direct control.


    # Performance Issues


    You can look at a cluster''s performance in two ways: externally and internally.
    The external viewpoint focuses on the rate at which the cluster can handle incoming
    transactions for a server. It looks at how quickly high-level calculations can
    be performed for a supercomputer. The internal view gives the view of how long
    it takes to do whatever the cluster is designed to do, in detail. For example,
    an incoming transaction is accepted by the master and then passed along for further
    processing by one of the slaves. The response is built and returned to the master,
    where it is sent back to the requester. Many steps are associated with this process.
    You can (and in a later chapter) time the execution of each of its phases and
    the steps in each phase if you are moved. You can plot these times as a bar graph
    to see where most of it is being spent and take a look at that code, optimizing
    it'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Our Cluster System''s Architecture


    to reduce the overall response time. This is a direct application of principles
    that are often applied to software optimization: time each function, and then
    time each high-level instruction of the long-running functions to get an idea
    where the execution is spent; then you can optimize code if possible. Distributed
    systems can be analyzed as if they were an application, but they are more complex
    because of the variance in their interprocess communication times over heavily
    loaded networks.


    Following are two maxims of system optimization: time is almost always being wasted
    somewhere else than where you expect, and the (good news) initial efforts are
    rewarded with huge gains. With newly written large architecture programs, a close
    look at the exact way in which calculations are made, for example, and a little
    effort toward optimizing those methods can reduce the overall execution time dramatically.
    You should find that the same rewards await when you optimize your cluster, but
    it will take a much greater effort on your part to get the timing data because
    these tools are not generally available at this writing. Fret not, however, later
    chapters will guide you through a custom development of tools specific to your
    needs.


    # Our Cluster System''s Architecture


    The system presented as the example for this book went through several evolutionary
    phases. The goal was to keep it simple and keep it cheap, without sacrificing
    any potential learning experiences. It has solid system architecture, both in
    hardware and in software, and so will yours if you build your system as you follow
    along in this book. Advanced readers, or those with special objectives, may want
    to use these examples as guidelines and embellish as they go.


    The hardware chosen of salvaged PC base units, a simple SVGA color monitor, and
    an ordinary keyboard and mouse. The four-node processors were identical at 166MHz;
    each had 64MB RAM, a 1GB hard drive, a 1.44MB floppy, a CDROM, and a $30 price
    tag. They had 10Base-T built into their system boards, so I purchased a four-port
    matching hub and cabling for less than $70. The monitor, keyboard, and mouse came
    in about $50. The commercial Linux OS installation package, the only purchased
    software, brought the total to just under $300, including sales tax.


    The cluster software was designed with simplicity in mind. We expect the reader
    to learn by doing what we describe, but it is our sincerest hope that you reach
    beyond what we offer, trying alternatives that spring to mind and comparing your
    performance to ours.'
