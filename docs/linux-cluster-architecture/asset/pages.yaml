    # Internetworking Protocol Addresses


    Up to now, you have been concerned with subtasks and processes that are all running
    on the same computer. However you need to communicate with processes on other
    machines on the network if you are going to manage a cluster.


    The Internetworking Protocol, or IP address, is a 32-bit number that uniquely
    defines each machine on a network. This addressing scheme is used by interprocess
    communication, the subject of this chapter.


    NOTE


    When the IP address was designed, the more than four billion addresses it offered
    seemed a number that would never be approached, let alone exceeded. IP version
    6 and other schemes, are recommending that this value be drastically expanded
    to allow for estimates based on modern day experience. For purposes of this discussion,
    an IP address is 32 bits long.


    The IP address is kept in memory as part of a data structure used by the communication
    software. When you send a message, that software looks to find where to send it.
    The IP address is included as part of the packet header information. As your message
    moves through the communication infrastructure, the IP address is used first to
    get it into the correct network and then to get it to the right host. (After it
    is in the correct network, the IP address is used to determine the media access,
    or MAC, level of the destination host. See the “Further Reading” section for more
    information on this subject.)


    The IP address is a binary string of bits that are often printed out in hexadecimal
    for debugging purposes. When humans need to look at IP addresses, they are often
    converted to decimal, decimal notation first, for convenience. Convert each byte
    from hex to decimal, left to right, each of the four decimal values with periods,
    or dots, as shown in Figure 3.1.


    Your network will be represented by the first three decimal numbers, and the fourth
    number will distinguish each of your individual host machines. In this book, IP
    addresses 10.0.0.1, 10.0.0.2, and so on represent hosts numbered 1, 2,and so on,
    on network 10.0.0.'
