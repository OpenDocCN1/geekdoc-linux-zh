  md: 'As a result, modern clusters have a two-tiered software layer: the application
    and the distributed system infrastructure. Think about how this impacts a multicomputer''s
    personality as you learn about some variations in their architecture.


    # Beowulf-like Supercomputers


    What makes a supercomputer Beowulf-like? A Beowulf-class machine has two constraints;
    it must be built from commercially available PCs and support hardware, and it
    must cost less overall than a high-performance scientific workstation. This cost
    was approximately $50,000 in 1994, when definitions like this one were being refined.
    The cost of the test bed described in this book was less than $2,000 in 1998,
    and it can be built for even less than today. The cost of your system depends
    on how much emphasis you place on the “high” in performance. Cluster performance
    depends heavily on the speed of the external I/O bus, which is the interconnection
    network or Ethernet in the case of the test bed and most other clusters. Beowulf
    reverted to custom internetworking to achieve some spectacular cost/performance
    ratios in the later stages of its development.


    Scientific researchers pit their creativity against an inadequate budget, squeezing
    every ounce of utility using existing equipment. The Beowulf Project was motivated
    by recent developments in parallel computing on Pile-of-PC (POPC) clusters, where
    impressive benchmarks were achieved with COTS, and commercial off-the-shelf products.
    (See also references to COW, for cluster of workstations, and NOW, for network
    of workstations, in the “Further Reading” section at the end of this chapter.)
    Beowulf is a NASA initiative headed by Thomas Sterling and Donald Becker at the
    Center of Excellence in Space and Data Information Sciences, a NASA contractor.
    Scientists with huge amounts of data generated by the simulation of large-scale
    physical phenomena (interacting tectonic plates, for example) or collected by
    a network of sensors, such weather satellites. Beowulf was chartered to solve
    the problems associated with this kind of research, at a bare-bones cost.


    Caltech and Los Alamos National Laboratories run Beowulf clusters, as large and
    small universities (Princeton and Oregon State, for example) focus on how high-speed
    networking hardware affects the limitations of message passing and virtual mapping
    systems. Smaller universities, even some high schools, build and maintain systems
    to give students hands-on experience with parallel computing concepts and challenges.
    They are ideal test beds for experiments, class projects, and post-graduate research.
    You can read more about Beowulf projects at the Web sites referenced in the “Further
    Reading” section at the end of this chapter. There may be some interesting material
