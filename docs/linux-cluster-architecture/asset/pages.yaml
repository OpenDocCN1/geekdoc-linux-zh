  md: '# CHAPTER 7 The Master-Slave Interface Software Architecture


    So far, you have seen three different approaches to server process software architecture.
    These were each tested over 10BASE-2 (thinnet) network, between a beefed-up 486-based
    machine, and on an older 386. You sent thousands twenty packets, randomly querying
    a 99-line text file. The reliable inter-arrival times were 8, 7, and 4 milliseconds
    on Listings 7.2, 7.3, and 7.4, respectively. A lot of overhead occurs in creating
    a subtask to process incoming query, as shown by the less-stellar improvement
    from adding that feature to a serial server. The big result came, as expected,
    by moving the overhead into the process initialization phase, by establishing
    a fixed number of processes up front, and hoping the incoming queries don''t swamp
    them. You might be able to improve this server''s performance even further by
    finding an optimal number of preestablished subtasks for your processor and network
    speed and amount of available memory.


    Note that an interrupt handler is added to Listing 7.4 so that you can use Ctrl+C
    to exit the server during testing. When that keystroke is detected, the subtasks
    and the process exit gracefully.


    # The Distributed Server Process


    Notice that the inter-process communication between the master process and its
    slave subtasks in Listing 7.4 is through a shared memory space (see Figure 7.1a).
    The low-overhead communication link is possible because the master and all its
    slaves are on the same machine, running in the same physical memory. (A memory
    bus transfers data much faster than an external network.) The benefit from parallel
    processing is limited, however, because this single machine has only one CPU.
    If you spread the slaves across your cluster system, in Figure 7.1b, you can gain
    in parallelism through the simultaneous use of multiple processors. Performance
    will improve with high CPU utilization. Performance will suffer, however, because
    of the added cost of interprocess communication across the network.


    The client will access the server (the master process, in this case) the same
    way it did in the earlier examples:


    +   > Listing7.2 gamma 0.25


    The server''s master process will create its subtasks in advance, as the server
    did in Listing 7.4. It can do so by treating the slaves as second-tier servers,
    as shown in Figure 7.1b. The master process must establish communication with
    each slave process, or it should be aware of other other machines on the network
    in advance. Instead of accessing a list of these other processors, you can generalize
    this process by having the master process issue a broadcast message to all possible
    slave ports.'
