    development, you have probably discovered how unpredictable distributed software
    systems can be. The master process, for example, has an interrupt handler that
    catches a Ctrl+C keystroke. On receipt, the parent sets flags for each of its
    subtasks, telling them to end gracefully. They send a dat to each of its slave
