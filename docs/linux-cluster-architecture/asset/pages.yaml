    # Ad Hoc Peer-to-Peer Networks


    The MSI is a hierarchical architecture—it is a tree structure with the master
    node at the base and slave nodes on each branch. Not all clusters are organized
    like this.


    Peer-peer networks do not have a master and slave relationship. Rather, each can
    take on either role, as needed. These nodes are programmed identically, with the
    same processes running. Each will accept incoming data and ask for assistance
    as if it were a master, and each will accept a request for assistance from another
    node as if it were a slave. Some of these distributed systems can form ad hoc
    (temporary, needed) networks on-the-fly and disassemble them as quickly when they
    are no longer needed.


    As an example, consider an automobile on a four-lane highway, in medium traffic.
    Today you activate the cruise control, settle into the right lane, and let others
    go by the left. As you approach an exit ramp, a car comes past you on the left,
    puts on a right signal, and crosses over your lane to make that exit. You feel
    coming, take your brakes, and move into the left lane as the car brakes exiting,
    adding injury to insult. You relied upon your instinct, your vigilance, and the
    visual cue of the other car''s turn signal. You did not look before you touched
    the brakes, however, nor did you check carefully before moving into the left lane.
    Not a problem this time, but that could have ended differently.


    Fast-forward about years. You are in the same situation, but most cars are equipped
    with an onboard driver-awareness system, a node computer with a bidirectional
    radio frequency link, and a display on the dashboard. As soon as the car comes
    by you on the left and begins to drift into your lane, a warning tone sounds both
    in your car and in his. As the first car came behind you in the left lane, its'
