    # The Linux root User


    If dozens of user accounts are on a particular machine, then dozens directories
    exist, each containing its user''s personal files. Which user, then, is responsible
    for the system files?


    A special user ID, root, is on all UNIX systems. This user is also called the
    super user because of its special powers, as you will see. The root user owns
    and is responsible for all the system. If any changes are made to any of them,
    you must become the root user; you may do so with the su (switch user ID) command,
    as follows:


    +   - root


    The su command enables you to switch to some other user ID. That dangling dash
    (-) shows your intent to assume the personal profile of that. (When you change
    to the root user ID, you don''t even have to specify root; just su—is sufficient.
    ) You will be asked to enter a password before you are allowed to proceed. Use
    the root password that you established during system installation.


    When you are finishing work as root, type the logout command to end the root login
    session and resume the earlier session under your personal user ID. You may also
    enter a session by typing an exit command, or simply a Ctrl+D keystroke, which
    is by far the quickest and easiest method.


    # Logging in as root at the System Prompt


    Another way to become the root user is to log in as root at the system prompt.
    Some security-conscious systems, however, do not allow the root user to log in
    directly,'
