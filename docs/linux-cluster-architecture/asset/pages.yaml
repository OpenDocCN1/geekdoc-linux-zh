- img_proc: true
  md: "# LISTING 9.1 Continued\n\n```\n/ * execution phase of interest) */\n\ngettimeofday(time2,\
    \ NULL); /* END time */\ntime2.tv_sec -= time1.tv_sec;\ntime2.tv_use -= time1.tv_use;\n\
    if(time2.tv_use < 0)\n{\n    time2.tv_use += 1000000L;\n    time2.tv_sec -= 1;\n\
    }\nprintf(\"Execution time = %ld.%06ld seconds\\n\", time2.tv_sec, time2.tv_use);\n\
    return(0);\n```\n\nNote that two time-of-day values are requested, and the difference\
    \ between them is the time it takes to execute the event phase, plus overhead\
    \ in the gettimeofday function call. This overhead is very small and usually can\
    \ be ignored. If your application cannot ignore even small timing overhead, however,\
    \ you can time the timed event and subtract the overhead, assuming it will be\
    \ the same for both sets of time-of-day calls.\n\nMost of the events in the MSI\
    \ are simple and can be timed using the technique in Listing 9.1. Phases 4 through\
    \ 6 are timed in the slave process, which means that these measurements must be\
    \ brought to the master's subtask for consolidation with the local data. These\
    \ results can be sent along with the packet each time the slave sends back a response.\
    \ The network transit times, however, require special consideration.\n\nAt first\
    \ glance, it might seem reasonable to get the packet-sent time on the sending\
    \ machine and the packet-receive time on the receiving machine. Passing the latter\
    \ back and subtracting the two calculates the transit time—au contraire!\nThe\
    \ call to gettimeofday returns a value of microseconds since January 1, 1970,\
    \ according to documentation. Practically speaking, however, times on a PC are\
    \ driven by a crystal oscillator that is subject both to manufacturer tolerances\
    \ and temperature variations. Each crystal is slightly off its frequencies and\
    \ may drift over time. Although months may go before you must reset the time of\
    \ day on your PC, the differences between any two nodes on a network prevents\
    \ your relying on them as being perfectly synchronized. This difference is especially\
    \ apparent when calculating the short time it takes to send a packet between nodes.\
    \ Not to worry—a clever way exists to handle this situation. Seeing the timing\
    \ diagram in Figure 9.2."
