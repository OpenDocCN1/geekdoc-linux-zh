  md: '# # Estimating and Displaying Network Utilization


    Network utilization may be displayed by the netstat line command:


    +   - netstat -i


    It gives you the number of packets sent and received on each of the network interfaces,
    with any packets in error, dropped, overflowed, collided, and so on. Note that
    this information is associated only with the machine that executes this command.
    What you really want to know is the overall network loading, and that requires
    an estimate.


    Assuming your cluster is on a closed network, with perhaps a single client machine
    that monitors and displays the real-time performance, you can estimate the network
    loading by adding all sent and received packet counts from each node and then
    dividing by two. If machine A sends a packet to machine B, for example, A will
    show one packet sent and B will show one packet received. The number of packets
    on the network, however, is:


    One way to get real-time netstat statistics is to actually the command, via system()
    function call, from a process that runs on every node. The report from netstat
    (see the open() function call), cull out the interesting values, and send them
    to a central performance monitoring process on the client machine for analysis
    and display. Each pair server process (master or slave) can start such a task
    as part of its initialization. The client can start the centralized performance
    subst. Each performance reporter must know the IP address of the client and the
    port where performance packets are received. You learn more about the implementation
    of these features later in this chapter.


    The netstat command is an inefficient way to get these numbers. Luckily, Linux
    provides an application-level user interface—window into the inner workings of
    the kernel that is very efficient and easy to use. Several kernel modules update
    what are called /proc pseudofs. Your process can open and read them as if they
    were text. You will learn about the contents of some of them as they were defined
    in an early version of the Linux OS. From release to release. best way to understand
    them is to list them from the command line and then investigate their exact meaning
    looking at the kernel source code that updates each file of interest. (See the
    man proc page and the Linux programming book cited in the "Further Reading" section
    at the end of this chapter for more details.)


    Listing 8.2 is a program that reads the /proc files, gathering real-time statistics.
    This program will run on each node of your cluster. It will be started by fork-exec
    (explained in Chapter 3, "Interprocess Communication") with an operand that tells
    it the hostname that the network utilization display process runs. These processes'
