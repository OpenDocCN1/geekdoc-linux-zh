  md: 'On campus, you can check your midterm exam grade, download the paper you brought
    from your desktop computer, and schedule a meeting with your advisor for later
    afternoon. At the local snack, you can order a sandwich while you''re finding
    a place to sit and pay for it in advance, if you like. You can get a look at traffic
    when you get your car and be presented with some alternate routes if the usual
    one is congested for any reason.


    And if you want to look for a library book while you''re eating lunch, you can
    always do that the old-fashioned way: dial your ISP and connect through the Internet.


    Finally, perhaps the ultimate cluster software architecture is one in which the
    structure is defined by the processing requirements instead of the available hardware.
    New divisions of a corporation and brand-new companies are represented by a corporate
    chart of positions first, people second. The distributed software architect should
    be the design process that will get its job done, without regard for the hardware
    at first. Each of these processes, with their inter communication links defined
    in advance, should never be burdened with any concerns related to where they execute
    relative to their peers. If a process senses that it is not capable of meeting
    its goals from where it happens to be executing (too many processes are running
    already, for example, slowing down access to the local resources), it should be
    able to send itself to some other machine for the betterment of the overall system
    performance.


    The concept of a process reestablishing itself on some other machine is described
    under autonomous agents, but that area of computer science has the vision of your
    personal agent roaming throughout the Internet, seeking information for you. You
    may be looking for a good restaurant in Seattle, for example, you will be there
    on business this week. It carries a matrix describing your preferences in food
    and price and knows where you will stay. When it finds an optimal solution, it
    reports to your desktop, where the information waits until your PDA is in range
    for download.


    Ubiquitous computing will soon be the production, not the demonstration package.
    The software and hardware will be designed by fresh minds that are unburdened
    by the ways things have always been and by flexible minds willing and anxious
    to shed old ways of thinking in the light of new problems. Join the fun.'
