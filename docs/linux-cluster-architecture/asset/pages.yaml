  md: 'All your C programs and header files should be under the /tmp directory. Many
    people do not take the time to actually try to restore their files from a backup
    medium. It is a good idea to make sure backup and restore procedures both work
    to your satisfaction before placing your confidence in them. It''s your time saved
    here.


    Another backup and restore to disk processes using the tar (archive) command.
    You do not need to use a command to mount the disk in this case, but you still
    have to write to that device. (And you must, of course, push the disk into the
    drive!)


    ```

    > cd /home/chief

    > tar -zcvf /dev/fd0 [Note the final dot]

    ```


    This copies everything chief''s home directory, in compressed archive file, onto
    the disk. You can restore the data as follows:


    ```

    > cd /tmp

    > tar -xzvf /dev/fd0

    ```


    You can check the contents of such a disk with yet another minor difference in
    operands.


    ```

    > tar -ztvf /dev/fd0

    ```


    The differences in the operands of these commands are so subtle that you can easily
    destroy the contents of an existing archive disk by specifying c instead of x
    on the command line. Remember, c is for create, x is for extract, and t is for
    tell me what''s in it.


