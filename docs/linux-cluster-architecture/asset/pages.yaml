    NOTE


    Most computer manufacturers have specification information for their discontinued
    models on their Web sites, usually under a Support section. see the “Future Reading”
    section at the end of this chapter for a few reference Web sites.


    # Network Media and Interfaces


    Results from the Beowulf Project (see www.beowulf.org) emphasized the need for
    a fast external network if a network of PCs was going to be used as a competitive
    replacement for a more expensive multiprocessor in supercomputing applications.
    The custom external network and device drivers they built are well beyond our
    needs, you should be aware of the choices available to you, even on a home network.
    Radio frequency links, fiber optics, and even high speed (gigabit plus) ethernet
    are available to ordinary consumers in many of the larger computer stores today.
    So many firewalls, routers, switches, and hubs are available that it can be hard
    to find the simple networking products you need here.


    # Switches or Hubs?


    If money is not an object, you might consider switching, gigabit ethernet. A hub
    emulates the coaxial cable network by letting each of the machines on the network
    hear what the sender is transmitting. A switch makes a connection between the
    sender and receiver, reducing the potential for collisions. The benefit is better
    performance and the cost is, well, the cost; switches are expensive and are probably'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'a lot more sophisticated than what you will need for this project. If your
    application regularly drives network utilization up beyond saturation, a higher-speed
    network is definitely indicated, and a switch might be necessary. 10BASE-T or
    100BASE-T hub will suit your networking needs.


    It is hard to find a 10Mbps hub on computer shelves today because everything is
    moving to the 100BASE-T standard and higher. Be sure the ports on whichever hub
    you buy exceed the size of your cluster. If you will want an extra machine on
    the same network for performance monitoring, transaction query generation, and
    so on, you should leave room for cluster expansion. Note that many of the "home
    network" hubs allow stacking. You can plug one stacking hub into another, at the
    cost of only one port on each, to make a single hub with the sum of their individual
    ports, minus two. Stacking a four-port and a six-port hub gives you an eight-port
    hub, and so on. It is cheaper to just buy an eight-port hub, of course, plan ahead.


    # Network Cabling


    Network cabling comes two ways: in bulk rolls so you can cut it to custom lengths
    and attach your own RJ45 plug with a special pair of crimping pliers, or specially
    prepared cables with the plugs already connected. Bulk rolls can be a real cost
    for companies installing hundreds of PCs on their networks, but the prepared cables
    at 6-foot lengths have served this author over the years. If your space is tight,
    you can consider the 3-foot lengths, but the price difference may not justify
    the inconvenience if you expand your cluster.


    The ordinary, low-cost gray cables are fine for simple networks. (They look like
    larger versions of ordinary telephone cords. There are even cables with special
    jackets that meet building code requirements, they have to run through air conditioning
    or heating system ventilation ducts. Our system is simple; you are not likely
    to be running cables through your air-conditioning ducts, and inexpensive cable
    could suit your needs perfectly.


    # Cabling with Crossover Cables


    One more about networking cables: If you have only two machines, you can avoid
    the cost of a hub by buying a specially wired cable called a crossover cable.
    The hub, you may recall, to connect each PC to a single cable (see Figure 4.3).
    The hub''s job is to retransmit everything it gets in from any cable out to every
    other cable. An ethernet network connects all its machines through the same single
    coaxial cable described in Chapter 2, "Multiprocessor Architecture." When one
    PC sends a packet, it is received simultaneously by all the others. Firmware in
    the network interface card senses the destination address and ignores the packet
    if it doesn''t match.'
