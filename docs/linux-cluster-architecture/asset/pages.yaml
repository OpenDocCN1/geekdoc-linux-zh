    # Master-Slave Interface


    This is the distributed server module pair. The master process may be started
    on any of the cluster nodes. It will automatically start a slave process on each
    of the other nodes. Both master and slave start performance subtasks on their
    respective nodes, targeted toward the display node, named omega in the source
    listings (see Figure 7.2).


    Following is a line command used to start the master task.


    +   > master


    Note that there are no line command options. The Ctrl+C keystroke enters gracefully,
    along with its subtasks, all the remote slave tasks, and their subtasks.


