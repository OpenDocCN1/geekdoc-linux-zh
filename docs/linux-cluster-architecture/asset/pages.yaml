  md: "Note the requirement for common knowledge of the performance information packet\
    \ structure as well as the destination port address. The header file referenced\
    \ by Listings 8.2 and 8.4 follows:\n\n```\n#define PORT 9090\nstruct cprStats\
    \ {\n    int cp; /* cpu utilization */\n    int rm; /* mem utilization */\n  \
    \  int ps; /* packets sent */\n    int pr; /* packets rcvd */\n    int dr; /*\
    \ disk reads */\n    int dw; /* disk writes */\n} cprStats;\n```\n\nThe method\
    \ of reading four incoming packets prior to each redrawing of the display may\
    \ seem inelegant. It lacks robustness by assuming everything is working correctly.\
    \ You can ignore that for now; you will learn more about software robustness issues\
    \ in Chapter 10, \"Robust Software.\"\n\n# Displaying Response Time Statistics\n\
    \nThe subtasks in Listing 7.1 record the query was sent, when the corresponding\
    \ response was received, and can easily calculate each of their response times.\
    \ It can also keep this information in a shared memory space set up by the client's\
    \ parent task for purpose. You want the subtasks to record the individual response\
    \ times in a shared memory space and the parent to report the external performance\
    \ as it changes.\n\nThe parent task in Listing 7.1 waits for any remainder of\
    \ its IAT, and it issues error messages in cases where the amount of time necessary\
    \ to prepare and send a query exceeds value. Assuming that it can work within\
    \ the IAT limitation and must wait before continuing, it can certainly take a\
    \ tiny moment to update an array of response time categories. It can display these\
    \ response times in a bar chart when the packet stream is finished, as shown in\
    \ Figure 8.5. A character-based presentation is used for simplicity.\n\nListing\
    \ 8.4 shows a client process that supports exponential, pulse, and sweep distributions\
    \ and that presents a bar chart of overall response time statistics."
