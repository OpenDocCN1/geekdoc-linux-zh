  md: '# 4 IN THIS CHAPTER


    # Assembling the Hardware for Your Cluster


    +   * Node Processors and Accessories

    * Network Media and Interfaces

    * Implementing an OS

    * Our Cluster System''s Network Topology

    * Further Reading


    Processor speeds increased dramatically over the last three years. Newer, faster
    computer models kept coming out until the threat of a recession put the damper
    on their sales. Individuals and families thought, quite rightly, that they could
    make do with the computers they already owned. Office managers decided that cuts
    to their budgets could be partially met by extending computer lease agreements
    another two years. Later, the computer manufacturing industry has experienced
    hard times.

    The good news to come of all this is for the consumer: major computer stores have
    their hottest systems on sale at about 15% below last year''s prices. Second-tier
    models are even cheaper, and the economy models are selling for just under $1,000.
    Computer salvage houses have $30 price tags on computers that will easily run
    all the latest operating systems and their productivity suites. Add a monitor,
    keyboard, mouse, modem, and a sound card, and you''ve built an adequate home system
    for about $100. Considering the computer configuration you need for the nodes
    of your cluster system, a four-node cluster can be had for very little money.
    Let''s get started!


    # Node Processors and Accessories


    If "money is no object," as they say, you can buy four or more of the best systems
    available. For the fairly well heeled, a set of second-tier machines or perhaps
    a larger number of economy machines is the cluster of choice. Frugal designers,
    however, must plan things more carefully.'
  merge: -1
