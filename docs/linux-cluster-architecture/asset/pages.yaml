  md: '# Linux Cluster Architecture


    Cluster computers provide a low-cost alternative to multiprocessor systems for
    many applications. Building a cluster computer is within the reach of any computer
    user with solid C programming skills and a knowledge of operating systems, hardware,
    and networking. This book leads you through the design and assembly of a system,
    and shows you how to measure and tune its overall performance.


    WITH LINUX CLUSTER ARCHITECTURE YOU WILL LEARN HOW TO...

    Assemble a Linux cluster using PCs and networking hardware

    A cluster computer is a multicom, a network of nodes running distributed software
    that makes them work together as a team. Distributed software turns a collection
    of networked computers into a distributed system. The user with a single-system
    image and gives the system its personality. Software can turn a network of computers
    into a transaction processor, a supercomputer, or even a new design of your own.

    Configure the user and operating system files to make these PCs work together

    Learn the C functions and operating system calls used to build distributed systems

    Build a distributed transaction server, and then measure and tune its performance

    Add real-time performance monitoring, and fault detection and recovery techniques


    Some of the techniques used in this book''s distributed algorithms might be new
    to many readers, some of the chapters are dedicated to topics. You will learn
    about the hardware needed to network several PCs, the operating system files that
    need to be changed to support that network, and the multitasking and the interprocess
    communications skills needed to put the network to good use. Finally, there is
    a simple transaction processing application in the book. Readers can experiment
    with it, customize it, or use it as a basis for something completely different.


    Alex Vrenios is the founder and principal analyst at the Distributed Systems Research
    Lab, a technical consulting group specializing in the performance measurement
    and analysis of distributed computing architectures. He has a BS and MS in computer
    science, is the author of numerous articles, and is a member of both the ACM and
    the IEEE. He has his computing career more than 30 years ago, working with communications
    and data transmission software on mainframes computer. He made the transition
    to a networked C/UNIX environment, learned about interprocess communications,
    distributed algorithms and cluster computing, and never looked back.


