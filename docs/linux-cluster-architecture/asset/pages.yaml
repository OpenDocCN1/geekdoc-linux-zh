    The source listings are intended to be suggestive of how a master process can
    remotely start a set of slave processes with no foreknowledge of how many there
    might be or where they may be located. After the broadcast message is out, the
    registration responses come in, allowing the master process to build a dynamic
    membership list.


    # How the Master-Slave Interface Works


    The master has two phases: initialization and processing handoff. In the initialization
    phase, previously described, the remote slaves are activated and registered. The
    result is a utilization table, with one entry for each registered slave process.
    Each entry contains a machine name, an IP address, and a projected utilization
    index, or UI. (The UI is an integer from zero to one hundred: zero being idle
    and 100 being saturated.) In the processing handoff, each query is received and
    passed on to the slave process on the least busy machine in the utilization table.


    Local performance data are gathered at each remote machine by subtasks of the
    slave processes and passed back to the master process inside acknowledgement packet—the
    receipt of each query. A danger exists in this technique, however. If a machine
    gets so busy relation to all the others it is no longer chosen for work, the table
    may continue to show it as busy, although it dropped down to idle long ago. If
    it is never chosen for work, it doesn''t acknowledge receipt, and the master''s
    table isn''t updated. The local data get stale and unreliable, yet decisions are
    still being made on its content.


    One way to circumvent this problem is to have each slave send regular reports
    of its utilization, the potentially excessive network traffic associated with
    these reports can adversely affect the overall system performance. In another
    method, slaves report only significant changes in utilization, and only when such
    changes occur. A 5% change in the calculated index, for example, might require
    the slave to send an update to the master. Under a highly irregular query load,
    the utilizations can also fluctuate to an extent that causes excessive network
    traffic.'
