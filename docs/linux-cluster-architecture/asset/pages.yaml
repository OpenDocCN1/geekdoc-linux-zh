  md: "This simple server has its limitations, handling only one incoming query at\
    \ a time, which can be overcome through exploitation of parallelism. In this case,\
    \ exploitation of parallelism means handling more than one query at a time. Our\
    \ first improvement to the server is that creating a subtask to handle each incoming\
    \ query. This will let each subtask read the text file in parallel with others,\
    \ reducing the overall system-response.\n\n# The Concurrent Server Process\n\n\
    You can use several approaches to converting a serial server to a parallel, or\
    \ concurrent server. The first method establishes a subtask to handle each incoming\
    \ query, exploiting parallelism. Listing 7.3 is an example of such a server program.\n\
    \n+   LISTING 7.3 Concurrent Server Spawns a Subtask for Each Incoming Query\n\
    \n```\n#include <netdb.hn#include <stdio.h>\n#include <sys/types.h>\n#include\
    \ <netinet/in.h>\n#include <sys/socket.h>\n\n#define PORT 9876\n\nmain(void)\n\
    {\n    /*\n     Listing7.3.c - Concurrent Server: subtask per query\n    */\n\
    \    struct sockaddr_in sock; /* structure for socket() */\n    int socklen=sizeof(sock);\
    \ /* struct len for accept() */\n    FILE *fp; /* sample.txt file pointer */\n\
    \    int acc; /* accept file descriptor */\n    int cli; /* client file descriptor\
    \ */\n    int line; /* requested line number */\n    int opt1=1; /* setsockopt\
    \ parameter */\n    char buf[80]; /* socket receive buffer */\n    char file[32];\
    \ /* text file from client */\n\n    /* create a (server) socket to accept a client\
    \ */\n    acc = socket(AF_INET, SOCK_STREAM, 0);\n\n    /* bind socket to port\
    \ */\n    sock.sin_family = AF_INET;\n\n\n```"
