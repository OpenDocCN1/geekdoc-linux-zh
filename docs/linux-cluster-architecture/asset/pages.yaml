  md: '# CHAPTER 3 Inter-Process Communication


    # TIP


    You can test these program pairs using an alternative way, in case you don''t
    have a network built yet. Start a second login session (opening a new X Window
    or pressing Alt+F2 on Linux) and consider it a server machine. Run the client
    application from your original login session with a destination IP address of
    127.0.0.1, which is the universally recognized "local loop-back" IP address. The
    term loop-back means "the same machine." Everything else the same as you did in
    the preceding example.


    # Automatically Starting Servers


    In the client/server example, you started the server manually, but a server will
    usually be running before you try to connect to it. A database server machine,
    for example, usually starts a database server at boot and restarts it in the event
    of failure. Your client interacts with the database server and expects it to be
    always available. A more familiar example might be your Web browser as a client
    that accesses your favorite Sites, expecting them to be up to 24 hours, 7 days
    a week.


    You don''t want to start your experimental server every, and it isn''t practical
    to have it running all the time either! How can you have a server start when you
    want to use it and have it go away after you''re done with it? Unix allows you
    to specify your servers, but this requires root access. Because this subject is
    closer to communication than to administration, it is covered here. If you''re
    not comfortable being a root operator yet, skip this section for now and come
    back to it after you''ve had a look at Chapter 5, "Configuring the Relevant Operating
    Files," later on in this book.


    The Unix networking daemon, named inetd, is started at boot and is referred to
    as the super server. This is because it is a generic service, awaiting a connection
    to any one of its supported services. That is, instead of having your service
    up and running all day, you configure inetd to respond to a connection attempt
    by starting your service process and then giving it control, after reassigning
    standard input and output streams that would be a socket connection in an ordinary
    server. That''s right—an inetd service simply reads from standard input (file
    descriptor 0) and optionally writes back to the client via standard output (file
    descriptor 1). Comparing Listing 3.8c and Listing 3.9c to their original server
    counterparts in Listing 3.8b and Listing 3.9b. These are much simpler indeed!


