  md: 'The alarm call requests that a signal be sent to your process after 3,600 seconds,
    or one hour. If no activity occurs in that amount of time, the signal will be
    sent, and your process will be terminated. This happens because you did not tell
    the OS to ignore that particular signal, nor did you establish a signal handler
    for it. The OS takes the default action; it terminates the process.


    But this is a good thing. The monitor should be getting several packets every
    second. If there has an hour of inactivity, may not want that process to remain
    in the system indefinitely. This simple device ensures that it is terminated after
    a configurable amount of inactivity. If it gets a packet from a performance statistics
    gatherer, the alarm signal is canceled via alarm(). It responds to whatever condition
    it finds, resets the alarm, and waits for another packet—normal operation.


    # Timeouts


    If you don''t want your process to be rudely interrupted, to speak, you can add
    an alarm signal handler—an internal function that tells the process when an alarm
    signal is received so that it can exit gracefully.


    Listing 7.5 is an example of the master process using a broadcast UDP datagram
    to start the remote slave services. This simple program registers the hostnames
    where slave processes send back a registration packet as they become active. In
    the production version of the MSI, however, the master will not know how many
    registration packets to expect. Without the luxury of waiting indefinitely for
    all possible registration packets, it uses an alarm signal as a timeout indicator.
    If no more packets arrive within the set time limit, it assumes that all remote
    slaves have registered.


    Two headers are required by the alarm and signal, and you will need a Boolean
    variable that can be set by the signal handler when an alarm goes off and can
    be tested by the main program each time it is unblocked from the recvfrom call.
    The Boolean variable is FALSE for a packet arrival and TRUE for an alarm signal,
    indicating the timeout condition.


    > NOTE


    The recvfrom call unblocks when either expected packet or some signal, including
    alarm, is received.


