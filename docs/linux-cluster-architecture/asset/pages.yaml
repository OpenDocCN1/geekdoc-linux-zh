  md: '# CHAPTER 2 Multiprocessor Architecture


    radio frequency (RF) link and designed a new communication protocol to support
    this new bus topology, called the ALOHA system. Each computer sent its data as
    a packet, a string of bytes with header information that included the sender and
    receiver''s addresses and the number of data bytes; trailer information used to
    verify that the bytes were received as sent. A corrupted packet was said to be
    the result of a collision—two or more data packets transmitted at the same time.


    This new protocol was so simple and yet so powerful that computer scientists took
    notice. They thought about the possibilities that this new computer-to-computer
    communication technique might open up. Following is some more history.


    A radio transceiver (transmitter-receiver) is usually connected to its antenna
    over a convenient length of transmission line, often a coaxial cable to match
    the transceiver''s output characteristics to the antenna''s, hopefully with minimum
    loss of signal strength. The radio sits on a desk in the radio room, but the antenna
    is high on the roof or maybe even higher up on a tower next to the radio room.
    The transmission line makes this separation. Every node in the original experiment
    had its own transceiver, transmission line, and antenna system attached to its
    computer and had some custom software to control sending and receiving data packets.


    A later group of scientists decided to eliminate the antenna, connecting all the
    transceivers to a single coax; if the distance between computers was not an issue,
    the same protocol worked for a local area network, or LAN. Ethernet was born.


    Coax much smaller and the concept worked well as well using much simpler and cheaper
    hardware connectors. It was dubbed thinner, or cheaper, and the original-size
    coax networks became thicker. This was still coax, and it was costly to "pull
    cable" through buildings built before any computers existed. This author has spent
    more than a few hours in elevators and elevator shafts in support of such effects!
    Most office buildings have miles of telephone voice-grade wiring in them already,
    usually many "pairs" that were necessary to support the internal telephone network.(Bundles
    of pairs of wires, twisted together, were often available at each wall plate.
    One pair of color-coded wires supported a single telephone set; hence, the twisted
    pair.) If someone figure out a way of using all this existing wire!


    It wasn''t hard to redesign the access card to match its characteristics to a
    pair of wires. It worked as a point-to-point link, but it seemed impossible to
    use this in a bus network in which each of the computers could communicate with
    any of the others, as long as the rules of the protocol were preserved. The concentrator
    device, called a network hub.


    A Hub is a small device that supports a fixed number of connections to its ports,
    per node on the network (see Figure 2.6). Although the physical appearance of
    the network''s connections looks like a star (all nodes radiating from some central
    point), the behavior is that of ethernet, a bus topology that allows direct communication'
