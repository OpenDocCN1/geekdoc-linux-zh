- img_proc: true
  md: '# Distributed Shared Memory Systems


    As part of his doctoral work in 1986, K. Li designed a unique system using PCs
    on a network. He suggested mapping the concept of a tightly coupled multiprocessor
    running virtual memory onto the collective physical memory space of a network
    of workstations.


    Each time data was accessed in local memory, it could came directly from local
    memory at memory bus access speeds. When data was accessed in a remote PC''s memory,
    however, data request and response messages would have to be exchanged before
    processing could result. The data address would be unique within the address space
    of the distributed process. Any process designed and compiled for a tightly coupled
    MP system could be run without modification on this relatively inexpensive collection
    of PCs on a local area network.


    Li called this IVY system. This class of systems later became as distributed shared
    memory, or DSM, systems. DSMs were painfully slow compared to their tightly coupled
    MP counterparts, but they were very cheap, and they had some interesting properties
    worth further exploration. Researchers flooded computer architecture and operating
    system conferences with DSM papers for many years, and many of those papers have
    been collected into a book that is cited in the “Further Reading” section at the
    end of this chapter.


    # Cluster Architectures


    The software running on Li''s networked PCs was unique in that it defined the
    architecture. Subsequent research capitalized on this feature, giving us what
    we call the cluster system today. Their software gave these otherwise independent
    PCs unity, defining the system''s personality; the software was the soul of the
    system!


    The plethora of DSM systems led to the maxim regarding the ratio of packet size
    versus processing mentioning earlier. It also brought to light many ways to achieve
    high availability through software fault tolerance. This was certainly a welcome
    feature considering the dramatic growth in online banking, computerized stock
    tracking, and distributed database servers. Ten years after Li’s initial work,
    when this computerization was getting to be a very hot topic, the World Wide Web
    took the online computing community by storm.


    Today, a popular commercial Web site’s server absolutely must be up and operational
    24 hours a day, 7 days a week, or a good deal of money may be lost. A big enough
    market exists for high availability servers that the software running on each
    node and the hardware that connects them have become very sophisticated indeed.
    (And that sophistication is reflected in their cost!)'
  merge: -1
