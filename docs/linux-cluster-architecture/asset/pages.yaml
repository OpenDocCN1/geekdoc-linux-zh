    to create an identical copy of your original (parent) process. When it returns,
    your subtask (child) is running in its own address space, with its own process
    ID, or PID. Now two identical processes exist from that same system call; they
    must discover for themselves whether they are to play the role of parent or child,
    and the return code is the only way to tell the difference. The parent process
