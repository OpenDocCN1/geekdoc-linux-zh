    The work you do for yourself—software development and testing, for example—should
    not be done as root. The root user has so much authority that a simple slip can
    cost you weeks of work, potentially requiring you to reinstall everything from
    scratch. You’ll learn more about disaster mitigation in the “Backup and Recovery”
    section later in this chapter. One very good habit that you can form early is
    to set up one or more user IDs for yourself, perhaps for each of your major projects,
    and use them for the development of that project. The root account is best used
    for system administration work that requires root access to files or for executing
    certain privileged commands.


    If you do a lot of software development in a Unix environment, and you are already
    familiar with the C compiler and make utility, feel free to use this chapter as
    a quick review or to skip it altogether. Although a lot of this is basic, not
    everyone knows everything, even a seasoned, professional software developer might
    gain something here.


    # An Overview of the Linux File System


    The Linux file system is organized in a treelike structure, having a root directory
    (/) and several subdirectories underneath it (see Figure 6.1). Notice that the
    branches of the tree spread downward, and the root (no relation to the user ID)
    is more of a base—a starting point in the tree. Note that /home/chef is the home
    directory, the starting point or working directory when you log in as chief.'
