  md: 'between any two nodes. The electronics inside a bus listen to each of its ports,
    retransmitting any signal it hears on each of the other connections. This behavior
    simulates the behavior of a bus network.


    ![](img/baab715d8836960db042fe4f6aa38002_37_0.png)


    **FIGURE 2.6** A 10BASE-T hub connects many network interface cards together ordinary
