  md: "might respond to this general call, each slave process must register with the\
    \ master\nprocess, making it aware of its presence. They do so by sending a registration\n\
    message (a UDP datagram) back to the master, over the network, as shown in\nListing\
    \ 7.6. As each registration message is received, the master process adds a record\n\
    of active slave process to its internal table of available workers.\n\n# LISTING\
