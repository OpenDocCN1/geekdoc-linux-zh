- img_proc: true
  md: '# IN THIS CHAPTER


    # Internal Performance Measurement and Timing


    +   * Profiling Software Execution

    * Distributed System Execution Profiling

    * Event Timing Techniques

    * Execution Phase Timing Plots

    * System Performance Improvements

    * Final MSI Performance Results

    * Further Reading


    Why measure the internal performance of a cluster server? You learned how to measure
    external performance in Chapter 8, "External Performance Measurement and Analysis."
    If you are ever unhappy with your external performance results and want to see
    some improvement, you will need to know where the server spends its time as it
    processes each incoming query. In this chapter, you will divide query processing
    into phases, measure the time it takes each phase to complete, and present the
    average phase completion times in a bar graph for analysis. An example of such
    a graph, called phase execution profile, is shown in Figure 9.1. Each bar represents
    a single phase of execution in order of execution, from left to right. The height
    of each bar represents the average execution time for that phase.


    Some phases are more complex than others and will take correspondingly longer
    to complete. Having designed the processing architecture, you should have a good
    feel for how long one phase takes compared to others. Sending data over the network
    will take much longer than transferring it across the internal data bus. Generally
    speaking, TCP/IP links have a greater overhead and take longer to transfer data
    than UDP/IP links do. Some general rules exist, but don''t be surprised if you
    guess wrong about which phases are longer.


    If two or more phases are thought to take equal amounts of time but do not look,
    look for time-saving improvements in the ones with the unexpectedly long execution
    times. Finally, rerun the internal performance analysis to see whether the changes
    you made caused any performance improvements.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Master-Slave-Execution Phase Times


    ![](img/baab715d8836960db042fe4f6aa38002_166_0.png)


    **FIGURE 9.1** A sample execution phase profile.


    In this chapter, you will see the master-slave interface (MSI) processing break
    down into execution phases. Source code used to time these phases is presented
    and graphed and discussed in some detail. The results of actual timing runs are
    graphed and analyzed. Unexpectedly long phases are investigated, and you will
    see what was done to reduce their execution times. A final set of timing data
    will help you quantify any performance improvement over the baseline data in Chapter
    8.


    # Profiling Software Execution


    Thirty years ago, excessive application execution times (measured in days in extreme
    cases!) were of concern scientific data center managers. They measured internal
    performance by recompiling these programs along with a state-of-the-art mainframe
    profiler. The profiler started the program under test as a subtask and paused
    at regular intervals to record the address of its executable instruction. After
    a short representative run, the profiler printed a histogram of real memory address
    ranges, along with the number of times the program under test was found to be
    executing in each of the address ranges. An analyst converted every memory address
    range to a range of Fortran language statements by hand, with the aid of a linkage
    editor map. Finally, the analyst and the programmer reduced these sections in
    a more efficient manner. This effort took days, sometimes weeks, but provided
    generous rewards, and computer time was expensive.


    Ten years ago, you could buy a C language program profiler for your PC for less
    than $30. It reported execution times at the main and function level, optionally,
    at the statement level within any one of your functions. You could optimize your
    C code for faster execution time in a matter of hours.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# NOTE


    Code profiling is easier because better today than they ever were. Code optimization
    requires a lot of talent, however, because the developer must understand that
    an index reference to an array, for example, is slow to compare to an incremental
    pointer reference. Developers must also understand that an optimizing compiler
    might generate the same machine-level code for either of those approaches and
    that the array index might be a better choice for documentation purposes. (Don''t
    forget the person who might have to debug your code later!)


    Knowledge of the target platform''s assembler, or at least the general hardware
    requirements for a given set of instructions, can save a lot of time during an
    optimization effort.


    If you sample a program''s point of execution at regular intervals, the percentage
    of times you observed executing a particular phase is a good representation of
    the percentage of time it spends in that phase. This is a statistical result,
    of course, the larger your sample size, the better the representation. Because
    it doesn''t require knowledge of the process, sampling is perhaps the best way
    to obtain an execution profile.


    Direct measurement—the technique used here—gives more accurate results, but you
    have to know where to the measuring.


    The MSI is a distributed system—several tasks running on a network of nodes, working
    together to respond to incoming queries. Profiling each program separately may
    prove helpful, but using the phase timing and reporting techniques outlined in
    this chapter should give you insight into broader performance issues. The overall
    processing time of a distributed system can be greatly influenced by process interaction—interprocess
    communication, for example, cannot be measured with a simple profiler. Take another
    look at Figure 7.2, the MSI architecture diagram, to refresh your memory of how
    these processes interact.


    # Distributed System Execution Profiling


    The MSI responds to incoming queries, and each query is processed in the same
    way. Keep in mind that the phases of a more complex system—one that processes
    queries differently based on their content, for example—may have a treelike ordering
    in time. Treat each processing phase as a separate service and analyze them separately
    in such cases.


    The first question to ask is, “What are the execution phases required to process
    a single incoming query?” Remember that you must not limit your thinking to the
    response-building phases, but to all the cluster management in support of it,
    Let''s look at what steps the server performs to process a query.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '1. The master chooses a local subtask (from its pool) to receive an incoming
    query:


    In Chapter 7, “The Master-Slave Interface Software Architecture,” you saw how
    a concurrent server outperformed a serial server and how resident pool of subtasks
    reduced the overhead of spawning a new subtask to handle every incoming query.
    In the subtask pool architecture, the parent task must choose an available subtask
    from the pool. This is the first phase of execution. This phase, and most others,
    can be timed directly by subtracting the phase-start time from the phase-end time.


    2. The chosen subtask receives its query and passes it to a remote slave process:


    Each subtask is paired with a slave process running on a remote node of the cluster
    (refer to Figure 7.2). Each query is sent to a remote slave for processing. This
    phase includes the preparation of the packet but not the actual transmission time,
    which is included in the next phase.


    3. Calculated master-to-slave network transit time:


    Each packet is sent from one node to another. In an inactive network, these transmission
    times are predictable, but when several nodes on the network compete for its use,
    the network access time can become excessive.


    4. The slave process receives the incoming query and extracts a result from it:


    A filename and a line number are inside each query in the example. These details
    are extracted from the incoming query before a response can be built.


    5. The slave process retrieves the requested line of text from the shared text
    file:


    The slave opens the specified file, reads the requested line of text, and closes
    the file.


    6. The slave process builds and returns the response to the master subtask:


    The requested line of text is encapsulated into a response packet.


    7. Calculated slave-to-master network transit time (same transit time as step
    3):


    This is the exact opposite route as the preceding one taken in phase 3, so you
    can assume that it takes approximately the same amount of time under similar network
    utilization. The network load is probably the same during both trips because the
    time between them is very short, you will learn from the analysis in this chapter.
    The analysis is based on a chart of the averages times taken to process many queries,
    so unexpected differences in trip times will become insignificant.'
  merge: -1
  pgno: 168
- img_proc: true
  md: "# 8. The master's chosen subtask responds to the query and declares itself\
    \ idle:\n\nThe subtask is waiting for the slave to process the request. When the\
    \ response arrives, the subtask extracts the timing data from the slave's execution\
    \ phases and sends it to the client. The subtask resets its condition flag to\
    \ show the master that it idle.\n\nLet's assume Figure 9.1 represents these eight\
    \ execution phases, although it does not. During the analysis, you might wonder\
    \ why phases 3 and 7, the network transit times, are not equal. You might also\
    \ wonder why phase 2 takes so long when there is so little effort involved. These\
    \ are exactly the kind of questions that lead to better internal performance.\
    \ The answers to these questions, and the analysis that follows, leads to better\
    \ internal performance. It leads to better external performance, too, in direct\
    \ support of your ultimate goal of client satisfaction.\n\n# Event Timing Techniques\n\
    \nMost events will begin and end in the same process and have intervening wait\
    \ times. Some phases, will include I/O, and some processes will span several of\
    \ the network nodes. Some of these cases will prove very interesting, leading\
    \ to valuable insights into the inner workings of a distributed system.\n\nThe\
    \ simple events are easy to time using the gettimeofday function. It returns the\
    \ time of day, in microseconds, as a point of time was midnight, January 1, 1970,\
    \ Universal Coordinated Time.). The exact number of seconds and microseconds is\
    \ returned as two long integers (type_t). You may use two time-of-day values to\
    \ calculate the elapsed time, as follows:\n\n+   LISTING 9.1 <sys/time.h> A Sample\
    \ Program That Times an Execution Phase\n\n```\n#include <sys/time.h>\n#include\
    \ <unistd.h>\n#include <stdio.h>\n\nmain(void) {\n  /*\n   ** Listing_9.1.c -\
    \ sample execution phase timing\n   */\n  struct timeval time1, time2;\n\n  gettimeofday(&time1,\
    \ NULL); /* START time */\n```"
  merge: -1
