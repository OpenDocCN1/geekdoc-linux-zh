    beacon was picked up by your system, or perhaps its system picked up yours. In
    any event, your two systems became aware of each other''s relative position and
    speed.


    When the car went and you drifted into your lane, the car''s system sensed the
    change in relative position, turned on the tone to warn your driver, and sent
    a message to your car, which also sounded a tone to warn you. When you touched
    your brakes, your system knew there were no cars behind you and did not send a
    message. When you lifted, it knew this was not a problem and remained neutral.


    You still saw the car''s turn signal. If the driver forgot to turn it on, the
    system, sensing the drift, would have done so. When you touched the brakes, your
    brake lights came on, and when you drifted, your turn signal came on, in case
    there was an other vehicle back there without this kind of gear. This scenario
    was intended as an example of a peer-to-peer network. If you can see each node
    is completely autonomous, to introduce and also respond to issues, you should
    have a feel for the potential of such architecture. It is good exercise to think
    how complex the node-to-node interaction might get with one extra car behind you
    or a fourth car in the left lane, behind the one that cut you off. Ask yourself
    some questions: If the car behind you didn''t see your brake lights, should your
    system automatically slow down that car? Should the car on your left slow itself
    down when it senses that you are about to cut it off? Should you trust such systems
    to make the right decision, considering your experience with commercial software
    to date?


    As futuristic as this sounds, the technology to implement such a system is perhaps
    10 years old. The next section discusses applications that get a bit closer to
    the technological edge.


    # Future Applications


    You are probably familiar with the PDA, or digital assistant. You probably know
    that it is becoming more a cellular phone every day and many PDAs can access the
    Internet. What follows is not too much of a leap from what we have today. It accepts
    the promise of electronic commerce, takes its lead from today''s corporate intranets,
    and an extension to the shared virtual memory concepts of the DSM.


    The problem with the handheld PDA device is the size of the screen. When the screen
    is of acceptable size, the device is inconvenient to carry. If there is no object,
    let''s assume there is a folding-screen version that fits into your pocket, or
    clips on your belt when not in use (see Figure 11.2). It''s an ordinary PDA unless
    you want it to interact with whatever environment you happen to be in—more on
    that aspect later.'
