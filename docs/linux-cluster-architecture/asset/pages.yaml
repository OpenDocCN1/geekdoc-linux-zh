- img_proc: true
  md: 'salvage center, finding them in flea markets or garage sales, or getting them
    free from co-workers, friends, or neighbors. One of the test nodes came free from
    a co-worker who responded to an ad in a newsletter.


    Configuring the OS files, creating a home directory for the software development
    work, and actually writing, testing, and debugging distributed software takes
    quite a bit of skill, but this is a learned skill, developed over time. You''ll
    make mistakes, as we all do, insert some print statements, troubleshoot the problem,
    and solve it. That''s where skills really come from; none of us is born with them.
    Getting your hands dirty can be rewarding as you learn and enjoyable when the
    system starts to work.


    # Distributed Applications


    You may be a manager reading this to find out what kind of problems your people
    are facing on some new product. You may be a seasoned developer wanting to shed
    some light on the gray areas surrounding such systems. You may be a hobbyist wanting
    to stay near the edges of systems development. If you actually build such a system,
    as I hope, the choice of application can become a complete second half of the
    journey. Digital signal processing (noise reduction, filtering, and so on) can
    equally apply to CCD images from a telescope or to audio signals from a shortwave
    radio. Maybe the sample system, a data server, is just what you had in mind. The
    choice is yours, and all you need to do is change the application software to
    convert a supercomputer into a transaction server, and back again.


    # Final Comments


    A few years ago, this author was seduced by the macho appeal of the dual-processor
    PC systems being offered as professional workstations by a few manufacturers.
    A short conversation revealed that a dual 100MHz PC cost twice as much as a single
    one and wouldn''t quite match the speed of the 200MHz PC that would be announced
    in a few months. This fact cleared up the thinking process, but the allure of
    a multiprocessor persisted.


    There came a time when old ''386 processor just wouldn''t run the version of the
    word processor that was in use by everyone now, at work. If you wanted to work
    late, you would have to stay late or buy a faster PC. A year later, two dated
    but adequate PCs sat in a closet until several others just like them became available
    for a very small amount of money. Another year saw an eight-node Linux cluster
    come to life.


    This book would have made the process a whole lot easier. Here''s to hoping you''ll
    find your way to that point and take it at least one step further. Enjoy the journey!'
