- img_proc: true
  md: '# Execution Phase Timing Plots


    Request the query-send time on the sending node, as shown previously, and then
    request the time that the response is received on that same sending node. You
    can subtract time-of-day values from the same clock reliably, in this case getting
    the round-trip transit time plus the processing time on the remote slave node.
    (This is shown as A in Figure 9.2.) Phases 4 through 6 are measured on the remote
    node and sent back to the master, and adding just one more event time doesn''t
    cost very much.


    ![](img/baab715d8836960db042fe4f6aa38002_171_0.png)


    | A-B = Packet round-trip transit time |

    | A-B = Transit time |


    **FIGURE 9.2** Calculating the network transit time.


    One solution is to request the query-receive time and the response-send time at
    the slave node. Both times are from the slave''s clock, so their difference represents
    the entire slave node processing time. (This is shown as B in Figure 9.2.) Subtract
    B from A to get the round-trip transit time; divide by two to get the one-way
    transit time. Assume that these times are equal and record the same value in phases
    3 and 7. Any network loading-induced discrepancies will become insignificant because
    the analysis deals with a large number of such estimates.


    # Execution Phase Timing Plots


    The master has a subtask for every registered slave node, as described in earlier
    chapters. Each subtask establishes a communication link with a dedicated process
    on a remote slave node. The master subtask sends a query to the slave process,
    and the slave sends back a response. Included in the response packet are the results
    of event timing on the slave node.


    When the subtask receives this packet, it extracts the timing data, adding each
    event phase time into an accumulator, and increments a counter, all of which are
    in memory that is shared with the parent task.'
