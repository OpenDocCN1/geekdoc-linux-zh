    A naming convention exists for networks and their connectors. The original half-inch
    thick coax networks supported a single piece of coax up to 500 meters and operated
    first at a 1-, a 2-, and finally a 10-megabit data rate. These were designated
    BASE-5, 2BASE-5, and 10BASE-5, respectively. The first number represents the data
    rate in megabits per second (Mbps). Base refers to base band communication, in
    which only one frequency is used. (Contrast this broadband communication.) A final
    number represents the approximate maximum coax length in hundreds of meters. Coax
    connectors are commonly called UHF connectors because they are rated for frequencies
    into the UHF (300MHz and up) range but they exhibit noticeable losses. (Technically
    these are called PL-259 connectors: PL for plug, which matches to the SO-239 socket.)
    BNC connectors are easy to connect or disconnect. They both require a terminator
    at each end to make them electrically infinite in length. The terminator is a
    resistor that absorbs the transmitted energy, avoiding interference-causing reflections.


    The phrase twisted pair comes from the telephone company, the common house-four
    RJ-11 telephone-to-wall connector was the model for a larger eight-wire RJ-45.
    My system''s network uses RJ-45 connectors into 10BASE-T hub. The final T is a
    reference to twisted pair. 100BASE-T is used to describe 100Mbps, and 1000BASE-T
    refers to gigabit hubs and networks. Some less obvious designations for fiber
    optic support and the like in your further readings.


    In summary, the best solution is the fastest solution—hottest node processors
    connected with the fastest network. This book isn''t about building a solution
    to any specific problem as much as it is about getting into the thick of cluster
    computer'
