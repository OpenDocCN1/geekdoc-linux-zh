  md: '# Alternative Computer Architectures


    The architecture of a computer is, literally, "how it is built." To see how computer
    architectures can differ, it is necessary to understand the building blocks inside
    a computer, such as the typical desktop computer shown in Figure 2.1.


    ![](img/baab715d8836960db042fe4f6aa38002_26_0.png)


    The three functional units of a typical computer (see Figure 2.1) are instruction
    processing, memory, and input-output, as described next:


    +   * The functioning function includes instruction execution, arithmetic/logic
    operations, and memory data access. These functions are grouped into the process-function
    because the central processing unit, or CPU, usually performs them all.


    +   * The memory function, which remembers the data values, is performed by the
    physical memory and its associated hardware. Memory is where data may be stored
    after bringing it in from the outside world, where data may be created and altered
    by a running process, and where it may be picked up for delivery to the outside
    world.


    +   * The input-output function is the process of transferring data between the
    physical memory and the outside world through an I/O port to a device terminal
    or the computer—to a floppy disk, for example.


    Different kinds of computer architectures can be created by designing a computer
    with more than one of these basic components. Overlap, parallelism, is the capability
    to do two or more things at the same time. Instruction-execution overlap can be
    achieved, not surprisingly, by having more than one CPU. Memory-access overlap
    is achieved by having more than one memory data bus, and I/O overlap comes with
    more than one I/O port. Let''s focus on multiple CPUs first, because this is the
    essence of a multiprocessor.'
  merge: -1
