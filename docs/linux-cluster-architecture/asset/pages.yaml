  md: 'It is quite reasonable for a slave to acknowledge receipt of each query, and
    piggy-backing utilization data onto such packets is a low-cost solution. The next
    chapter describes an experimental UI calculation that should overcome the stale
    data problem without the added cost or concern.


    You may have noticed that the preestablished subtasks example in Listing 7.4 detected
    the readiness of an incoming query before giving control to one of its subtasks.
    The chosen subtask accepted and received the query and responded to it independently
    of the parent task. This technique exploits a high degree of parallelism and frees
    the parent task to focus on the incoming query stream. We will use an over-the-network
    equivalent technique so that the master process can sustain the highest possible
    incoming query load. See the diagram in Figure 7.2.


    ![](img/baab715d8836960db042fe4f6aa38002_132_0.png)


    Figure 7.2 The master-slave interface.


    When the number of remote slave processes is known, the master will preestablish
    a local subtask dedicated to each. The parent will again detect the readiness
    of a query, choose a remote slave based on its local utilization table data, and
    assign the query to its counterpart subtask. This get the benefit of parallelism
    that you want and moves the burden of utilization table updates away from the
    parent and onto the associated subtask.


    There is the further benefit of fault detection: the communication link from local
    subtask to remote slave process can indicate a process failure and can serve as
    a link to confirm or deny a failure, should suspicion arise. Similarly, any of
    the slave'
