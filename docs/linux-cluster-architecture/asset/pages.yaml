    that an infrastructure necessary to support such lofty goals begins with a bunch
    of computers on a network, working together toward that common goal.


    # Multiprocessor Architectures


    Each time an algorithm can do two or more things in parallel, a multiprocessor
    can improve its performance. If the same actions are performed in parallel but
    on different data, the multiprocessor can be a vector processor. If not, a more
    general multiprocessor is indicated.


    If the execution necessary to process data in parallel is less than the time to
    acquire that data, a tightly coupled multiprocessor is required. If not, a multicomputer
    will suffice. A multicomputer is harder to program than a tightly coupled multiprocessor,
    but it is a lot less expensive and cheaper and easier to upgrade. Remember that
    a multicomputer that performs as well as a tenth of the price is quite a bargain,
    assuming half the performance suits your needs.


    # Cluster Configuration


    You can get on a mail-order Web site or walk into the largest cluster store and
    buy everything you will ever need to build a cluster computer. The cost, however,
    can be kept to an absolute minimum by getting the computers from a'
