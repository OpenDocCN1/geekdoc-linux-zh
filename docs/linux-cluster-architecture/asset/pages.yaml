- img_proc: true
  md: '# CHAPTER 2 Multiprocessor Architecture


    Our goal is to design and build a cluster system. Let''s look at some of your
    choices in deciding what hardware to assemble and what software architecture to
    choose. The following sections of this chapter discuss the hardware decisions,
    the software features, and wrap up with a discussion about performance and some
    hardware and software choices made for our target system.


    # Hardware Options


    You need to consider two hardware decisions: the node computer architecture and
    the interconnection network.


    # Node Computers


    Big name workstations are available for a hefty price. They run sophisticated
    operating system software, have humongous physical memories and disk drives, and
    are highly reliable. The principles of designing a cluster either out of workstations
    or PCs are pretty much the same. Therefore, this discussion focuses on the typical,
    Intel-based PC.


    The node computers you choose should all be much alike, for simplicity of replacement,
    load balancing, and performance analysis. The cluster system described in this
    book has eight node computers with nearly identical processors, memory sizes,
    and so on.


    How powerful should these node computers be? The quick answer might be, "As powerful
    as you can afford." However, consider this for a moment. Our system grew out of
    two computers that were overdue for replacement. Throwing them out seemed rude
