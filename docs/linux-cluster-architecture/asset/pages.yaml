  md: '# Query Generation


    Recall the client program in Listing 7.1. It records the time of day and creates
    a subtask to send each query. When the parent reigns control, it calculates the
    amount of time remaining in the IAT and waits before sending another query. The
    client implements a constant IAT—each query only follows the next after some amount
    of time. If only our world were orderly!


    Arrival cases such as mundane as a bank teller''s window are of interest to early-time-and-efficiency
    experts that a whole branch of applied mathematics, called queuing theory, was
    a direct result of it. Queuing theory allows bank managers to tell how many times
    will be needed at a particular time of day for a day of the week. Telephone companies
    can determine how many central offices can connect to a link, and airlines can
    decide how many flights to schedule, based on records of their customers'' historical
    behavior. Computer scientists using theory to produce the bandwidth needed between
    nodes of a network and to determine how many users can be supported by a particular
    server. This is powerful stuff, but it''s beyond the scope of this book. A classic
    text on the subject is included in the “Further Reading” at the end of this chapter.


    Those early efficiency experts sat view of a teller''s window and wrote down the
    exact time that each customer arrived. A modern-day observer is more likely to
    be a small box at the side of the road. It has a long rubber sensor stretching
    across a lane of traffic; as each car''s tires are picked up over the sensor,
    the time of day is recorded. The box is picked up at day''s end, and traffic flow
    is analyzed based on the observed data. But the analysis is the same.


    The differences between successive arrival times produces a list of IATs that
    can be ordered, categorized, and tabulated. Categories represent the number of
    times an IAT between zero and ten seconds was observed, and between twenty seconds,
    as shown in the first two columns of Table 8.1.


    # TABLE 8.1 A Discrete Inter-Arrival Time Distribution


    | IAT (seconds) | Number of Observations | Percentage of Observations | Probability
    of Observation | Cumulative Probabilities |

    |---|---|---|---||}{

    | 1-10 | 52 | 26 | 0.26 | 0.26 |

    | 11-20 | 44 | 21 | 0.21 | 0.47 |

    | 21-30 | 32 | 16 | 0.16 | 0.63 |

    | 31-40 | 26 | 13 | 0.13 | 0.76 |

