  md: '# Further Reading


    processes can detect a failure in the master—or at least in its associated subtask.
    The local subtask can restart a failed remote process by sending a UDP datagram,
    just as the parent did at initialization time, without the parent''s involvement.


    Complete source listings of these processes are in the Appendix at the back of
    this book. The source code is also available at www.sampublishing.com and may
    be downloaded at no cost. You are encouraged to experiment with solutions to these
    design issues, and having this code as a starting point should help you to do.


    # System Limitations


    The most obvious limitation is the master processor as a single point of failure.
    If the master fails, so does the entire server. A fault-tolerant solution would
    detect failure of the master and hold an election. One of the slave systems would
    assume the role of the master and assume the IP of the potentially failed machine.
    When queries come from an external client, there is only one published IP address
    and port number where all the queries are sent. One solution publishes an IP address
    the master processor assumes as an *alias*, accepting packets addressed to this
    IP. When a master processor fails, another processor can assume as alias by sending
    a gratuit ARP (address resolution protocol) message, which would be beyond the
    scope of this book. (See the “Further Reading” section in this chapter.)


    # Summary


    The focus of this chapter is the reader. You start simply and build up to the
    master-slave interface server concept that adapts well to cluster architectures.


    This started with a client and a simple application. The simplest server version
    was introduced and converted to a concurrent server—one that exploited the parallelism
    of incoming queries by spawning a subtask to handle each of them as they arrived.
    Finally, the more sophisticated approach of creating a pool of subtasks in advance
    was used. Finally, this subtask pool was extended into the realm of the cluster
    architecture by creating the same number of subtasks as there were remote processors.
    This architecture exploits the parallelism afforded by a multicomputer, or cluster
    architecture.


    In the next chapter, you will find out how the system performs, at a level of
    detail that will help you fine-tune this system to meet the expected needs of
    your clientele.


    # Further Reading


    +   - Stevens, W. Richard. TCP/IP Illustrated. Vol. 1. Reading, MA: Addison-Wesley,
    1994.'
