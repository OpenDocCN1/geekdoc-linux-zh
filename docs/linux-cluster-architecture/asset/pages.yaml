  md: '# Reattaching Shared Memory


    Even if you decide to implement one or more of the preceding schemes, you still
    may not be completely out of the woods. Plenty of residual conditions are waiting
    to ensure that this latest instantiation of your process fails as well. The most
    likely suspect in the MSI architecture is its shared memory area.


    If the master fails, terminating before removing its shared memory area, that
    area will be present when the master restarts. You must decide, based on your
    knowledge of how your system works, whether it''s best to have the master reattach
    that same area or to remove the old shared memory area and start fresh.


    The master can attempt to reattach its shared memory area during its initialization.
    If the return value from the snat call is unsuccessful, either the failing master
    removed the memory area, or this master is the first active since a reboot. (A
    reboot carries a multitude of sins.)


    # Reliable UDP Communication


    Software developers love TCP because it guarantees successful delivery of all
    packets, in the order that they were sent. Software developers hate TCP because
    it guarantees successful delivery of all packets, in the order that they were
    sent. It seems that the overhead associated with such a strong guarantee is intolerable
    in cases where processing time is one of the essence.


    UDP is often called an unreliable protocol, but that may be an overindictment.
    You can improve its reliability with the timeout feature described earlier in
    this chapter, resending datagrams that are not acknowledged within set limits.
    Because you are setting these limits, you can control how much overhead you are
    willing to suffer for a given level of reliability.


    This simple and wait for an acknowledgement protocol is referred to as the stop-and-wait
    flow control. One variation on this scheme allows a set of outstanding packets
    (the buffer window) before waiting for an acknowledgement. That is, you send packets
    until you''ve reached the set limit, and then you wait for acknowledgments, improving
    your throughput. Further improvement can be had by allowing the receiver to acknowledge
    several packets (up to the window size) in a single response. These point-to-point
    communication protocols have been refined over the years and can be found in any
    high-quality text on the subject. See the references in the “Further Reading”
    section at the end of this chapter.'
