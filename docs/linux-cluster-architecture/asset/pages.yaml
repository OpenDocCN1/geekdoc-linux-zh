- img_proc: true
  md: '# CHAPTER 4 Assembling the Hardware for Your Cluster


    If you can afford better, maybe your first cluster ought to be built from salvage
    PCs. Someone was proud to have these systems on their desk not so long ago. They
    earned their keep and have nothing more to prove; they can probably still cut
    the mustard with an efficient OS such as Linux. Besides, old machines will teach
    you a lot more about computers than the new ones. You will swap cards and upgrade
    memory, get to know a PCI slot from an ISA, and learn to spot the notch of memory
    strip without a thought. You will figure out memory numbers, determine its interface
    speed, and so forth. In doing so, you will gain a sense of confidence and a working
    knowledge of your systems. Let''s look deeper into the cost-effective components
    that can be used to make a frugal, but, cluster.


    NOTE

    Large corporations, computer discount houses, and institutions such as hospitals
    and universities have a central information number that you can call for details
    about their salvage policies. Many employees who volunteer to rebuild the company''s
    old computers for local use, so they don''t sell them to the public. Some do,
    however, and it''s worth a local call to find out. A university near me has a
    warehouse dedicated to sales and is open to the public during business hours.
    They have a test bench in the bank, and their prices are quite reasonable. A bottle
    of general purpose cleaner and a roll of paper towels can bring these systems
    back to very nice, if not showroom, condition.


    # Hardware Accessories


    Assuming you are going to build a four-node cluster, try to find five PC base
    units that are identical in manufacturer and model number. Look inside them to
    make sure they have a hard disk and CD-ROM drives and that the memory slots are
    at least partially populated. Check the rear part male connectors for bent pins
    and don''t forget the power cords. If the store will let you try it before you
    buy it, do so. Bring a boot disk to see if it boot without errors. An extra machine
    is nice to have for parts when something goes wrong, but buying five dead PCs
    can really dampen your enthusiasm!


    # I/O Requirements


    You need one monitor, keyboard, and mouse for this cluster because Linux will
    let you in to remote systems from the main computer. Attach them directly to each
    machine as you check it out and load the OS, but after they are up and running
    on a network, they will be attached to the network file system (NFS) server. You
    will learn more about NFS in the next chapter.'
