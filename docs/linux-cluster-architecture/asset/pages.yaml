    Semiprivate intranets allow you authorization to interact. Your system is temporarily
    authorized when you pay admission to a theme park, a private art gallery, or a
    theater. A private intranet requires stronger authorization. Your bank must know
    when you are a depositor, your school campus must recognize your student ID, and
    your workplace must recognize your employee status.'
