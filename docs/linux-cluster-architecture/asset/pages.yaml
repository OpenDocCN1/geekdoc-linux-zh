    skills and knowledge of operating systems, hardware, and networking. This book
    lead you through the design and assembly of such system and shows you how to measure
    and tune its overall performance.


    A cluster computer is a multicomputer, a network of node specialized software
    that allows them to work together as a team. The specialized software turns the
