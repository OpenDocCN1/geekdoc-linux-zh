    # Interconnection Networks


    Again, you are presented with a wide range of selections, complicated by a large
    quantity of sophisticated networking equipment, even in modest computer stores.
    There are firewalls, routers, switches, hubs, and media access cards for speeds
    up to a gigabit per second, including linking and supporting software. Equipment
    that was the pride of enterprise data center managers a few years ago is finding
    its way into the home network as this book is being written.


    A firewall can be thought of as a router that lets control what kind of information
    passes through. A router is usually employed as a traffic-isolating connection
    between two networks. A switch is a vastly improved hub, allowing multiple, simultaneous
    point-to-point communication pathways. A hub is a device that employs simple cables
    (like twisted pairs, although they aren''t really wished anymore) in a network
    that behaves as if a coaxial cable (as is being used for the communication medium).
    And coax got its start by fooling the media access cards into believing a single
    radio frequency channel was used to communicate.


    The original implication of the term ethernet was a reference to the ether, atmosphere,
    through which the data packets were transmitted when the protocol was invented.
    About 30 years ago, people with several computers on separate Hawaiian islands
    wanted to communicate with one another. The interisland telephone system was too
    unreliable to support dial-up communication, so these clever people used a'
