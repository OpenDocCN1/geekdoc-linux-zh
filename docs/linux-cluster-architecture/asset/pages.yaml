  md: "# CHAPTER 7 The Master-Slave Interface Software Architecture\n\nA broadcast\
    \ message is different from an ordinary message in two ways. The socket (UDP datagram\
    \ in this case) must be prepared via a call to setsocket to accept these special\
    \ messages, and you must use a special wildcard IP address. Recall from Chapter\
    \ 3 that the first part of an IP address defines the network, whereas the last\
    \ part defines the node, usually a machine on the network. The special value of\
    \ 255 (or FF in hex) is the wildcard address that is interpreted as all; all nodes\
    \ accept such messages, regardless of their particular node address. Our network\
    \ has IP addresses of 10.0.0.1 through 10.0.0.4; therefore, 10.0.0.255 would be\
    \ the address used in a broadcast message.\n\n# LISTING 7.5 Master All Possible\
    \ Slave Processes via UDP Broadcast Datagram\n\n```\n#include <netinet/in.h>\n\
    #include <sys/socket.h>\n#include <sys/types.h>\n#include <string.h>\n#include\
    \ <netdb.h>\n#include <stdio.h>\n```\n\n```\n#define INIT 3579\n#define WORK 9753\n\
    ```\n\n```\nunsigned char broadcast[4] = {0xA0, 0x00, 0x00, 0xFF}; /* * 10.0.0.255\
    \ */\n```\n\n```\nmain(int argc, char *argv[])\nchar *argv[];\nint argc;\n/*\n\
