    Recall in Chapter 3, "Inter-Process Communication," that you caused a remote service
    to start by sending a UDP datagram to its well-known port address on a remote
    machine (Listings 3.8a and 3.8c). You can generalize this concept to create all
    remote slave services in advance by defining their well-known ports on every remote
    machine on your network and then sending a broadcast UDP datagram, as shown in
    the short example of Listing 7.5. Every machine on the network will receive the
    datagram, and every machine on the network will start the remote slave processes
    in the same manner as the examples in Chapter 3. (Be sure to add definitions for
    Listing 7.6 in every remote system''s /etc/services and /etc/inetd.conf files,
    a process that is also described in Chapter 3.)'
