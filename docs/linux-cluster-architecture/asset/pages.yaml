- img_proc: true
  md: 'Overlap can be achieved by a pipeline processor by getting the address of B
    from the instruction at the same time it gets the value of A from memory. Pipeline
    computers fill their pipe with instructions and begin processing all of them at
    once to maximize the overlap effect. They are often used as supercomputers, in
    which the speed of instruction processing is paramount. Debugging is especially
    challenging when you don''t know exactly which instruction was executed when the
    failure occurred!


    # NOTE


    This author worked with one of the early pipeline processors, an IBM 370 195.
    Execution errors, called program interrupts, were coded so the programmer could
    tell the kind of error that occurred. Errors often resulted in a listing of memory
    at the time of the error, called a dump, a hexadecimal listing of your program
    space along instructions, and the address of the next instruction to be executed.
    Most of the time it was a matter of finding the failing instruction in the dump
    and looking at the data that was being manipulated by that instruction. When an
    imprecise interrupt occurred, however, you had to look at perhaps dozen instructions
    prior to the one indicated, because they were all executed as far as the system
    was concerned.


    # NOTE


    The back plane gets its name from its location in the back of a cabinet. Computer
    boards, each with a CPU and memory, slide on rails into the cabinet and plug into
    that plane in the back, where they can access power and board-to-board communication
    lines.


    # A Taxonomy for Multiprocessors


    A multicomputer is a multiprocessor that is constructed from many individuals,
    which are interconnected via a network or back plane (see the following Note for
    more on back plane). From a hardware perspective, considerable differences exist
    between a multiprocessor and a multicom. They are sometimes referred to as tightly
    and loosely coupled multiprocessors, respectively, in reference to the CPU-RAM
    data coupling. From a software perspective, however, they look almost alike; they
    form a special class, with its own taxonomy, described in more detail next.


    In the late 1960s, M. J. Flynn created a special taxonomy for computing systems
    to help distinguish among their many architectural designs. He focused on instruction
    and data access from the perspective of the CPU, noting how many different pathways
    were available. He asked, "How many instructions can the CPU''s instruction processor(s)
    access at the same time, and how many blocks of data can the CPU''s arithmetic
    and logic unit(s) access at the same time?" The answer was one or many, in both
    cases, for a total of four distinct architectures.'
