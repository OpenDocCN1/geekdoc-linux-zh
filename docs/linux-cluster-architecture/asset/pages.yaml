  md: "# CHAPTER 9 Internal Performance Measurement and Timing\n\nOne solution is\
    \ to access the file as if it were direct access, but that runs counter\nto the\
    \ simplicity of the example.\n\nAnother solution is to maintain a cache, a local\
    \ pool of earlier requests and their\nresponses. If a duplicate request arrives,\
    \ the master subtask can look up the response\nin its cache and respond immediately,\
    \ saving a tremendous amount of time by\navavoiding the use of its remote slave\
