  md: "# Main Task Restarts\n\nWhen a subtask terminates, a signal is sent to its\
    \ parent task, but how do you detect the termination of a parent task? There are\
    \ a few ways to handle this case, depend-ing how the parent is started.\n\nOne\
    \ simple approach is to develop a high-level startup process. Its job is to start\
    \ all the processes that would normally run at the highest level and watch them,\
    \ restart-ing that might fail.\n\nAnother strategy is to let the OS start the\
    \ process and specify that it be restarted on failure. The system file /etc/initab\
    \ allows you (root) to add your own executable to its list of processes to be\
    \ started (and, restarted) when a particular run level is entered. The downside\
    \ of using this tech-nique is that a process can become difficult to get rid of—it\
    \ works too well!\n\nOne final strategy involves what fault-tolerant software\
    \ designers call a \"heartbeat.\" The parent process can detect the termination\
    \ of a subtask, but consider how it might detect (and recover) from the termination\
    \ of a slave process running on a remote node.\n\nThe slave registers with the\
    \ master as soon as it becomes active, so an unused UDP communication link exists\
    \ between the two. If the slave sends a UDP datagram to the master every second\
    \ (heartbeat), and the master keep track of the time that the last message was\
    \ received for each slave, it could scan these last-heard-from times each time\
    \ a query arrives. Any slave that had not been heard from in some configurable\
    \ amount of time could be restarted (via its UDP service port) along with its\
    \ local subtask, for total recovery. (This is a enhancement project for those\
    \ readers who are actually developing a cluster.)\n\nFinally, consider that there\
    \ are levels of recovery, and at some point, a clever process might decide that\
    \ a remote machine needs to be rebooted. You might establish a UDP service port\
    \ that starts a process, running as root, that issues the shut-down command (with\
    \ a restart option) via a system call:\n\n```\n#include <stdlib.h>\n\nmain(void)\
    \ \n{\n    system(\"/sbin/shutdown -r now\");\n}\n```\n\nIf it is not possible\
    \ to run a process on a failed machine, a reboot might still be accomplished through\
    \ custom hardware. Processor chips have a RESET pin that, when grounded, will\
    \ cause a system reset, or reboot. Such a drastic measure, of course, should be\
    \ considered only under highly unusual circumstances. This kind of reboot is akin\
    \ to cycling the power switch, a very cold restart indeed."
