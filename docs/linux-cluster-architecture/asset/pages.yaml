    | 71-80 | 6 | 3 | 0.03 | 0.97 |

    | 81-90 | 4 | 2 | 0.02 | 0.99 |

    | 91-100 | 2 | 1 | 0.01 | 1.00 |

    | | Total = 200 | Total = 100% | | Total = 1.00'
