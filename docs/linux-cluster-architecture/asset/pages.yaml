  md: '# Summary


    The chapter began with a look at what it means to generate and send queries to
    a server and how you might calculate an IAT distribution from observed data. You
    looked at how to generate queries in an exponential distribution, in which the
    data can be described by a formula. Finally, you saw two distributions: sweep
    and pulse.


    You learned how to calculate a node''s system resource loading (CPU, real memory,
    network and disk I/O) and how to gather those statistics from four of your nodes
    and display them, in near real-time, for quick visual reference.


    You updated the client program from the previous chapter in support of three new
    distributions, and you learned how to collect and display the overall response
    times in a bar chart.


    Lastly, the bar charts from live test runs are presented, along with a snapshot
    of the overall system loading display during the sweep distribution test.


    Your master-slave interface server runs on a cluster that you built from four
    PCs and some networking hardware. You have a client process that can stress it,
    a performance program that can show you what they are all experiencing at once.
    You have the first set of live data representing the overall external system performance
    of your cluster, and that''s exactly what you set out to do at the beginning of
    this chapter.


    In Chapter 9, “Internal Performance Measurement and Tuning,” you will learn about
    timing and how to get an accurate image of internal performance. You will break
    the query processing into its individual phases, time them, and analyze them.
    The goal is to find parts of the process that can be sped up, reducing the overall
    response time and improving your system''s overall external performance—exactly
    what the clients want.'
  merge: -1
