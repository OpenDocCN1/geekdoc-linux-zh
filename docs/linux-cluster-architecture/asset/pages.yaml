  md: "```\n{\n  aptr->flag[ident] = 1; /* work to do! */\n  usleep(1);\n  break;\n\
    }\n```\n\nThe call to usleep requests a one-microsecond pause, effectively relinquishing\
    \ control of the CPU and allowing another of the ready processes to execute. This\
    \ is a simple search for a subtask-idle flag, which is then reset to subtask-busy,\
    \ instructing the subtask to receive an incoming query.\n\n# NOTE\n\nThe master\
    \ process blocks on a select call until the presence of an incoming packet is\
    \ detected. The subtask actually receives it after noticing its subtask-idle flag\
    \ is reset to subtask-busy.\n\nWith three subtasks running, it is hard to imagine\
    \ how such little bit of code can take such a long time. It is very likely that\
    \ the master's usleep call is effectively blocking it, forcing it to compete on\
    \ equal terms with each of its subtasks.\n\nOne way to increase overall performance\
    \ is to increase the master's priority in this phase. Because the master is responsible\
    \ for assigning work to its subtasks and spends most of its time blocked inside\
    \ the select call, giving it a higher priority over its subtasks could speed up\
    \ its notification of eminent query arrival.\n\nOur performance improvement to\
    \ phase 1 is to add a call to nice (specifically, a nice(1) to slightly lower\
    \ its priority with respect to that of its parent) at the beginning of each subtask\
