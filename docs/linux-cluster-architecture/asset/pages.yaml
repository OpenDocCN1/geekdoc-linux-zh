    # # Supercomputer Applications


    The MSI is a transaction processor in the Web or database server sense. It receives
    incoming queries and sends a response back to some external client. A real-time
    scientific application exhibits similar behavior in that it acquires or acquired
    sensory data and develops a solution. Most scientific applications present a static
    system, but some require data at regular intervals and display a continuously
    updated solution that changes with the environment.


    For example, consider a major city that, interested in air quality, installs a
    dozen or more air pollution sensors measure wind speed, direction, temperature,
    humidity, and levels of ozone, carbon monoxide, sulfur dioxide, and other particles
    that contribute to respiratory health problems. It averages these counts over
    a 10-minute period and transmits the readings to a central computing system. This
    central computer is to receive all the latest data and update its real-time display,
    a false-color image depicting the location, shape, and density of each particulate.
    Not surprisingly, around rush hour, the shape of the carbon pattern represents
    a crude map of the highways and arterial surface streets of that city.


    On a larger scale, the National Center for Atmospheric Research (NCAR) has weather
    satellites that feed sensory data into computers, which generate real-time weather
    patterns. Software simulation data is also used to generate predictions of future
    weather patterns. Hopefully, the software is efficient enough, and the computers
    are fast enough to generate tomorrow before tomorrow arrives. More information
    can be found at the Universities Corporation for Atmospheric Research Web, referenced
    in the “Further Reading” section at the end of this chapter.


    Artificial intelligence (AI) researchers take their games very seriously. IBM
    RS/6000 SP computer, nicknamed Deep Blue, played against Garry Kasparov, a chess
    master, and won. In this kind of application, the current board arrangement is
    the acquired data, and the solution is a single move that is judged best by looking
    at its consequences several moves ahead. The software builds an inverted tree
    structure beginning with the current board. Each lower branch represents a response
    from the opponent, and so on. This tree structure is called a problem space and
    the number of branches below each possible move is called its depth. Searching
    for solutions and'
