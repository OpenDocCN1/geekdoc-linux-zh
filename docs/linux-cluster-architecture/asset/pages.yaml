    # Summary


    This chapter began by examining the components of a typical computer and then
    looked at some of the other kinds of computer architectures built with multiple
    CPUs, multiple memories, or some specialized hardware. The introduction of the
    desktop computer and the LAN, or local area network, led to the design of the
    multcomputer, a network of computers running custom software. We saw how the nature
    of this software defined the properties of such machines, making them suitable
    for transaction processing, supercomputing applications, and for the like.


    The simplest multicomputer construct is the master-slave architecture, in which
    one of the network machines uses the others according to their availability to
    exploit any parallelism inherent in the data processing algorithm. The design
    of such a system is the focus of this book.'
