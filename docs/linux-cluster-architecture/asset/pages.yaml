    - Further Reading


    The hardware for your cluster—the PCs, the monitor and keyboard, and the network
    hub and cabling—are generic (you can use this same hardware to develop any kind
    of multicomputer system. Most of the OS configuration changes you made to Linux
    distribution and version you run are generic, too. The software for the MSI, however,
    is specific to this project, which highlights an earlier point about how the ‘personality’
    of a cluster system. This chapter is about other kinds of cluster systems you
    might want to design and build now that you’re an experienced architect. Get ready
    to broaden your horizons, to face bigger challenges.


    The MSI is a distributed transaction server system. It receives a query, processes
    it in parallel with other queries, and sends the response back to an external
    client. It initializes and runs forever after. Not all distributed applications
    work like this.


    As an application’s requirements increase, so does its complexity. The amount
    of effort necessary to upgrade a complex application eventually becomes cost prohibitive
    or two reasons. First, the amount of work necessary to support a new feature can
    require additional infrastructure to support it. Second, the complexity of a distributed
    system’s infrastructure software can make it brittle, more prone to failure because
    of the increased complexity.


    The classic solution to these infrastructure-related problems is to encapsulate
    the infrastructure software in a package—a function library that the application
    program can use to reduce the cost of development and enhancement. Two of the
    most popular packages can be downloaded for free from the Internet. The PVM (parallel
    virtual machine) and the MPI (message passing interface) package download sites
    are referenced in the “Further reading” section at the end of this chapter.'
