    # Using Semaphores with Shared Data


    The shared data example in Listing 3.4 doesn''t illustrate the risk associated
    with shared variables. Consider a similar example in which the parent bank account
    creates two subtasks: one child responsible for deposits and the other for withdrawals,
    each calculating the new balance as part of this. Can you see the risk?


    If two transactions arrive at approximately the same time—one deposit, the other
    withdrawal—a possibility exists, albeit a small one, that of them will be nullified.
    Consider the case in which the withdrawal process gets the balance from shared
    memory, subtracts the amount from it, and is interrupted by the deposit process
    picks up the balance from shared memory (the one that the withdrawal process still),
    adds to the deposit, puts the balance back into shared memory, and waits for another
    deposit transaction. The withdrawal process continues processing, putting its
    recalculated balance into shared memory, over the value that the deposit process
    set. The deposit transaction is lost because all the actions of the deposit process
    were nullified by that interrupt.


    The research concept of interest here is the critical section of a process. How
    can you be that after a process starts its processing by picking up a balance
    from shared memory, it will not be nullifying another transaction when it puts
    a recalculated value back?


    What''s a semaphore? First, consider what it is: A semaphore does not stop another
    process from modifying shared data, no more than a red traffic light prevents
    you from entering an intersection. We go on green, slow on amber, and stop on
    red by agreement. This holds true for semaphores, too.


    Each semaphore is associated with a shared resource, not directly, but indirectly
    through the source code comments and other documentation. A semaphore is either
    set or not, and that''s all the operating system cares about. If you try to set
    a semaphore and it is already set, the OS will set it. It will cause your process
    to wait until the last process to set clears it.


    To avoid any difficulties with the bank transaction example, both processes (deposit
    and withdrawal) must set a semaphore prior to getting the balance from shared
    memory and then clear it after the recalculated balance is put back (see Listing
    3.5).'
