  md: '# Summary


    Designing robust software up front—or finding and removing vulnerabilities in
    an experimental system—should lead to a reliable cluster server. You find out
    what can go through hands-on testing of your system and use this knowledge to
    add detection and recovery software to your system, minimizing the probability
    of seeing kinds of problems again. You have better things to do with your time
    than finding and terminating stray processes and removing leftover, shared memory
    areas.


    Distributed software systems can be complex. Several subtasks across the network
    to their remote node counters, working together toward the common goal: servicing
    clients'' needs. Strong process interdependence should not result in a system
    failure because of an unexpected termination in one of them. You can detect and
    recover from process failures and reestablish disconnected communication links.
    You can design a system in which process failure results in another stepping in
    to take its place.


    The result of your efforts, the focus of this chapter, is robust software: software
    that does exactly what you want it to do, when you want it to do it.


