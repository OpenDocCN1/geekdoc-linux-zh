  md: '# Summary


    You started with a simple subtasking example using fork. Splitting this program
    into its parent and child parts and compiling separately, you saw how the parent
    could create a subtask from a separate executable using exec. You learned about
    the use, capture, and handling of signals and how to create and manage a shared
    memory area between the parent and child process, including how to prevent corrupted
    data with semaphores. Finally, you learned about inter-process communication using
    two kinds of sockets.


    Moving from one machine into a pair of processors on a network, the parent child
    concept expanded into the more common client and server paradigm. You set up client
    and server processes on two separate machines using both kinds of sockets again,
    and then configured the system to automatically start the server process on the
    remote machine when the client requested service.


    Inter-process communication is a complex subject. If you compile each of these
    demonstration programs and experiment with them, they will lead you into the general
    case where many clients communicate with a single-server system. This is the mechanism
    in use by database servers and Web servers alike. It is the foundation of network
    programming.


    # Further Reading


    +   Brown, Chris. Unix Distributed Programming. Hertfordshire, England: Prentice
    Hall International (UK), 1994.


    +   Hawkins, Scott. Linux Desk Reference. Englewood Cliffs, NJ: Prentice-Hall
    PTR, 2000.


    +   Stevens, W. Richard. Advanced Programming in the UNIX Environment. Reading,
    MA: Addison-Wesley, 1992.'
