  \n图 13-3. 来自伪造源地址的 SPA 数据包\n\n注意下方的 `fwknop` 客户端命令变得更加复杂。这是为了以 root 身份伪造 SPA 包的\
  \ IP，同时使用 `fwknop_client` 密钥构建加密载荷，该密钥由 `mbr` 用户所有并位于 `/home/mbr/.gnupg`。\n\n```\n\
  \ [root@spaclient ˜]$ fwknop --Spoof-src 207.132.X.X -A tcp/22 --gpg-home-dir /home/mbr/.gnupg\
  \ --Spoof-user mbr --gpg-recip \"fwknop_server\" --gpg-sign \"fwknop_client\" --quiet\
  \ -R -k spaserver\nGnuPG signing password:\n```\n\n下面的系统日志消息表明 `fwknop` 服务器嗅到了 SPA\
  \ 数据包，其源自❶伪造的源地址 `207.132.*X*`，但授予的是加密包中的 IP 地址 ❷204.23.*.**`。\n\n```\n [root@spaserver\
  \ ˜]# tail /var/log/messages\n Oct 18 23:31:37 spaserver fwknopd: received valid\
  \ GnuPG encrypted packet (signed with\nrequired key ID: \"fwknop_client\") from:\
  \ 207.132.X.X, remote user: mbr\n Oct 18 23:31:37 spaserver fwknopd: adding FWKNOP_INPUT\
  \ ACCEPT rule for ❷204.23.*X.**\nX -> tcp/22 (30 seconds)\n```\n\n## fwknop OpenSSH\
  \ 集成补丁\n\n`fwknop` 项目希望让 SPA 的使用尽可能简单和友好。减轻用户负担的一种方法是与各种客户端应用程序无缝集成。由于 SPA 最常见的应用是保护\
  \ SSH 通信，`fwknop` 针对 OpenSSH 源码提供了一个补丁，允许从 SSH 客户端命令行直接执行 `fwknop` 客户端。要使此功能生效，你首先需要对\
  \ OpenSSH 源码应用补丁并重新编译。以下说明了如何对 OpenSSH-4.3p2 版本进行操作，假设源码位于 `/usr/local/src`。\n\n\
  \n\n\n\n```\n $ cd /usr/local/src/openssh-4.3p2\n$ wget http://www.cipherdyne.org/LinuxFirewalls/ch13/openssh-4.3p2_SPA.patch\n\
  $ patch -p1 < openssh-4.3p2_SPA.patch\npatching file config.h.in\npatching file\
  \ configure\npatching file configure.ac\npatching file ssh.c\n$ ./configure --prefix\
  \ --with-spa-mode && make\n$ su -\nPassword:\n# cd /usr/local/src/openssh-4.3p2\n\
  # make install\n```\n\n上述命令最重要的注意点点是，`configure` 脚本的 `--with-spa-mode` 参数确保了在编译\
  \ OpenSSH 时包含了 SPA 补丁代码。\n\n现在，在安装了修改过的 SSH 客户端后，可以直接从 SSH 命令行调用 `fwknop` 客户端，而不再需要在使用用\
  \ SSH 建立连接之前手动运行 `fwknop`。该补丁为 SSH 添加了新的命令行参数 `-K` `fwknop args`；该参数可以如下所示，在无需单独运行\
  \ `fwknop` 客户端的情况下访问 spaserver 系统。\n\n```\n [mbr@spaclient ˜]$ ssh -K \"--gpg-recip\
  \ ABCD1234 --gpg-sign DEFG5678 -A tcp/22 -R -k\nspaserver\" mbr@spaserver\nGnuPG\
  \ signing password:\nPassword:\nLast login: Wed Oct 17 15:48:19 2007 from spaclient\n\
  [mbr@spaserver ˜]$\n```\n\n`fwknop` 服务端常见的日志消息表示已收到 SPA 包，并确认数据包检查通过（即：使用所需的密钥 ID\
  \ 进行加密，且没有在网络上被重放）。\n\n```\n Oct 17 15:53:39 spaserver fwknopd: received valid GnuPG\
  \ encrypted packet\n (signed with required key ID: A742839F) from: 204.23.X.X, remote\
  \ user: mbr\nOct 17 15:53:39 spaserver fwknopd: adding FWKNOP_INPUT ACCEPT rule\
  \ for 204.23.X.X\n-> tcp/22 (30 seconds)\n```\n\n新的 SSH `-K` 选项将其参数传递给 `fwknop`\
  \ 命令行，因此 `fwknop`提供的所有功能都暴露在 SSH 命令行中。这包括 `-L` `host` 参数，正如本章前面提到的，该参数允许对之前使用的 fwknop\
  \ 命令行作用于同一主机。因此，以下命令可以正常工作。\n\n```\n ssh -K \"-L host\" user@host\n```\n\n## 运行\
  \ Tor 的 SPA\n\n*洋葱路由（Tor）* 是一种由全球分布的节点（称为洋葱路由器）组成的匿名网络（请参见 [`tor.eff.org`](http://tor.eff.org)）。Tor\
  \ 网络旨在加强基于 TCP 的服务，免受一种名为*流量分析*（traffic analysis）的互联网监控。*流量分析*用于确定在互联网上谁在和谁通信，任何能够访问互联网流量的组织（特别是\
  \ ISP）都可以轻松部署它。即使是加密的应用流量也会受到流量分析的影响，因为 IP 地址是明文传输的。\n\n### 注意事项\n\n我在这里没有考虑 IPSEC\
  \ 或其他 VPN 协议，但即使这些协议也可以通过流量分析泄露信息。\n\n仅仅通过观察双方通信就能获取的信息往往被低估了，这影响到从保护密码安全到揭露所谓匿名转发器身份的方方面。\n\
  \nTor 的工作原理是为每个 TCP 连接通过路由器云建立一个独立的虚拟电路。虚拟电路建立在*入口路由器*（entry router）和随机选择的*出口路由器*（exit\
  \ router）之间。每个电路都是唯一的，电路中的每个跳节点只知道流量来源跳节点和流量必须发送到的跳节点。此外，流量在路由器云内部是经过加密的。\n\n最终结果是，客户端可以通过此虚拟电路在开放的互联网上与服务器通信，而任何可以监控进入或离开路由器云流量的第三方都将看到看似完全无关的\
  \ IP 地址在相互通信。\n\n在 Tor 网络上发送 SPA 包有好处吗？答案肯定的，因为它扩展了 `fwknop` 的服务隐藏特性，使得更难判断服务器位置是否正在使用\
  \ SPA。\n\n但有一个陷阱：Tor 使用 TCP 进行传输。这意味着 Tor 与 SPA 不兼容，因为 SPA 包默认通过 UDP 传输。尽管 `fwknop`\
  \ 支持通过盲目 TCP ACK 包发送 SPA 包，但仅凭这一点不足以让 SPA 包跨越 Tor 网络。只有在与入口路由器的初始 TCP 连接完全建立后，才会通过\
  \ Tor 内部创建一个虚拟电路，这意味着需要双向通信。\n\n`fwknop` 通过打破 SPA 的单包特性，并通过与 `fwknop_serv` 守护进程建立完全建立的\
  \ TCP 连接发送 SPA 包来解决这个问题。该守护进程产生一个以 `nobody` 用户身份运行的极简 TCP 服务器，在 TCP 端口 `62201` 上执行\
  \ `bind()` 和 `listen()`，然后循环调用 `accept()`。在每次 `accept()` 之后，都会进行一次 `recv()`，以便在会话关闭之前，客户端只能跨越连接发送单个\
  \ TCP 分分段。这允许客户端通过建立的 TCP 连接发送 SPA 负载，但不发送其他任何内容。然后，通过使用 `socat` 程序（它作为 Tor 所需的\
  \ `socks4` 代理）结合 `fwknop` 命令行上的 `--TCP-sock` 参数，就可以通过 Tor 网络发送 SPA 包了。\n\n### 注意事项\n\
  \n有关 `socat` 的更多信息，请参见 [`www.dest-unreach.org/socat`](http://www.dest-unreach.org/socat)。\n\
  \n# 结语\n\n本章和[第 12 章]说明了计算机安全中的强大技术，展示了服务器如何通过默认丢弃数据过滤器受到保护，只有能够向被动监控设备证明其身份的客户端才能获得访问。端口触发（Port\
  \ knocking）是实现这一想法第一个技术，但由于端口触发架构存在一些严重的局限性（包括充分解决重放问题的困难以及无法传输超过几十字节的数据），SPA 证明自己是一种更健壮的技术。授权以太网嗅探器结合默认丢弃数据过滤器的概念在计算机安全领域是一个新概念，但似乎新的实现方案每天都在涌现。\n\
  \n基于 `iptables`，`fwknop` 是 SPA 的开源实现，提供了一种在 SPA 范式内管理多个用户的灵活机制。\n\n\n\n\n甚至有一个项目尝试将基于\
  \ HMAC 的 SPA 直接放入 iptables 中；请参见 [`svn.berlios.de/svnroot/repos/portknocko`](http://svn.berlios.de/svnroot/repos/portknocko)\
  \ 以及 Netfilter 开发列表存档中的一个讨论线程：[`lists.netfilter.org/pipermail/netfilter-devel/2006-october/thread.html`](http://lists.netfilter.org/pipermail/netfilter-devel/2006-october/thread.html)。\n\
  \n# 第 14 章 IPTABLES 日志的可视化\n\n在当今开放互联网的威胁环境中，安全数据的可视化变得越来越重要。从入侵检测系统到防火墙，安全设备在处理来自全球各地的攻击时，会产生大量的事件数据。理解这些海量数据是一项巨大的挑战。安全数据的图形化表示允许管理员快速看到新兴趋势和异常活动，而这些如果没有专门的代码很难检测到。也就是说，图表在传达\
  \ `context`（上下文）和 `change`（变化）方面非常有效，因为人眼可以快速察觉其他情况下难以发现的关系。\n\n本章探索了如何结合 Gnuplot\
  \ ([`www.gnuplot.info`](http://www.gnuplot.info)) 和 AfterGlow ([`afterglow.sourceforge.net`](http://afterglow.sourceforge.net))\
  \ 项目使用 `psad` 来生成 iptables 日志数据的图形化表示。我们的主要数据源将来自 Honeynet Project 的 `iptables`\
  \ 日志（参见 [`www.honeynet.org`](http://www.honeynet.org)）。\n\nHoneynet Project 是安全社区无价的资源；它公开发布原始安全数据，例如从受攻击的活跃\
  \ honeynet 系统收集的 Snort 告警和 `iptables` 日志。Honeynet Project 的首要目标是通过一系列“扫描挑战”让这些安全数据可供分析，这些挑战的结果会发布在\
  \ Honeynet Project 网站上。在本章中，我们将视觉化来自 Scan34 Honeynet 挑战的数据（参见 [`www.honeynet.org/scans/scan34`](http://www.honeynet.org/scans/scan34)）。你可以从\
  \ [`www.cipherdyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)\
  \ 下载本章提到的所有图表和 Gnuplot 指令文件。\n\n### 注意\n\n本章中的所有示例假设当前目录下的 Scan34 `iptables` 数据文件名为\
  \ `iptables.data`。\n\n# 观察异常情况\n\n考虑以下组数字：\n\n```\n 5, 4, 2, 1, 3, 4, 55, 58, 70,\
  \ 85, 120, 9, 2, 3, 1, 5, 4\n```\n\n该数据集代表一个特定 IP 地址每分钟连接的 TCP 或 UDP 端口数量；这些信息可以通过解析\
  \ `iptables` 日志数据获取。注意数据集中的峰值，端口数量从 4 迅速增加到 120，然后回到 1 到 5 之间的稳定状态。\n\n当使用 Gnuplot\
  \ 对这些数据进行图形化表示时（如 图 14-1 所示），峰值是一而易见的。\n\n![每分钟到端口的数据包数量](img/httpatomoreillycomsourcenostarchimages207384.png)\n\
  \n图 14-1. 每分钟到端口的数据包数量\n\n端口扫描是这种峰值的一种可能解释。其他解释可能是 `iptables` 策略配置不当，记录了良流量，或者错误地记录了作为已建立连接部分的\
  \ TCP ACK 包。峰值的实际解释在这里并不重要——重要的是这个峰值是 `unusual`（异常的）。图表可以容易且快速地显示现状的剧变，并让你将精力集中在那些问题区域上。\n\
  \n在前面的示例中，在如此小规模的数据集中看出模式相对容易。现在，假设你面对的是一个由 1,000 或 100,000 个数字组成的类似数据集。除非这些数据被制图，否则用肉眼从这么多数据中提取趋势是一项艰巨的挑战。\n\
  \n图 14-2 是一个包含超过 800 个点的图表，记录了 `iptables` 策略在约五周时间内以每小时一个数据点的速率记录的 TCP SYN 包数量。数据源来自\
  \ Scan34 Honeynet 扫描挑战的 `iptables` 日志文件，并使用 `psad` 解析数据以供 Gnuplot 渲染。\n\n![每小时到端口的\
  \ SYN 包数量](img/httpatomoreillycomsourcenostarchimages207382.png)\n\n图 14-2. 每小时到端口的\
  \ SYN 包数量\n\n如你所示，很容易从图表中选出感兴趣的区域。x 轴分为单独的小时，并以周为单位进行标记；y 轴显示到端口的数据包数量，并以 500 为增量进行标记。3\
  \ 月 27 日的大峰值迅速引导你关注一个值得更仔细检查的时间段。\n\n¹ 这可能是因为关闭 TCP 连接周围的定时问题引起的。特别是，Netfilter 连接跟踪子系统对处于\
  \ CLOSE-WAIT 状态的 TCP 连接设置了 60 秒定时器（参见内核源码中 `linux/net/ipv4/netfilter/ip_conntrack_proto_tcp.c`\
  \ 文件中的 `ip_ct_tcp_timeout_close_wait` 变量），但有时定时器过期后后续的 TCP ACK 包（通过 CLOSING 和 LAST-ACK\
  \ 状态完成连接）可能仍在途中。这导致 TCP ACK 包不被视为现有连接的一部分，因此默认的 `iptables` `LOG` 和 `DROP` 规则可能会生效。\n\
  \n## Gnuplot\n\nGnuplot 项目可以生成许多类型的图表，从直方图到彩色的三维表面图。它擅长处理大型数据集，例如源自数十万行 `iptables`\
  \ 日志数据的点集。\n\n对于本章中 `iptables` 日志数据的可视化，我们使用 Gnuplot 生成二维和三维的点图和折线图。Gnuplot 需要格式化后的数据作为输入，它本身不具备解析\
  \ `iptables` 日志消息的机制。Gnuplot 的理想输入是一个包含列排列的整数值的文件——每列对应二维或三维图中的一个轴。这正是 `psad` 及其\
  \ `--gnuplot` 模式发挥用场的地方。在这种模式下，`psad` 解析 `iptables` 日志数据并将结果写入供 Gnuplot 处理的文件。\n\
  \n为了在你的 Linux 系统上复制本章中的图表（或为你自己的 `iptables` 数据生成新图表），你需要安装 `psad` 和 Gnuplot。\n\n\
  ## Gnuplot 绘图指令\n\nGnuplot 在绘制数据图时遵循一系列配置指令。这些指令描述了渲染细节，如图表类型、坐标范围、输出模式（例如，到图形文件或终端）、轴标签和图标题。每条指令都可以通过在命令行提示符输入\
  \ `gnuplot` 进入 Gnuplot 交互式 shell 来设置，或者通过 Gnuplot 加载的文件设置。例如，图 14-2 中的每小时端口数据是通过以下\
  \ Gnuplot 指令文件绘图的：\n\n```\n$ cat fig14-2.gnu\nreset\n❶ set title \"psad iptables\
  \ log visualization: timestamp dp:counthour\"\n❷ set terminal png nocrop enhanced\n\
  set output \"fig14-2.png\"\n❸ set xdata time\nset timefmt x \"%s\"\nset format x\
  \ \"%m/%d\"\nset xlabel \"time\"\n❹ set xrange [\"1140887484\":\"1143867180\"] evenset\
  \ ylabel \"dp:counthour\"\nset yrange [0:3000]\n❺ plot 'fig14-2.dat' using 1:2 with\
  \ lines\n```\n\nfig14-2.gnu 文件中最重要的指令如下：\n\n**`set title`**\n\n位于 ❶ 处的图标题在本例中是由\
  \ `psad` 设置的，正如我们在下一节所示。\n\n**`set terminal`**\n\n\n\n❷ 处的终端设置和输出文件，如果你希望 Gnuplot\
  \ 启动一个交互式窗口以便在图表上移动光标，则该部分可以省略。（这在查看复杂数据集时很有帮助。）\n\n`set xdata time`\n\n❸ 处的时间设置，以及后续两行中的时间输入和输出格式，这些设置告诉\
  \ Gnuplot 每个点的 x 坐标是一个时间值。\n\n`set xrange`\n\n❹ 处的 x 轴范围，在此情况下，它被设置为 Scan34 数据集的起始值和结束值。（时间值是自\
  \ Unix 纪元（1970 年 1 月 1 日 00:00 UTC）以来的秒数。）\n\n`plot`\n\n❺ 处的 `plot` 设置是最重要的 Gnuplot\
  \ 指令，因为它告诉 Gnuplot 原始数据所在以及如何将其绘图化。在这种情况下，一个二维线图是由 `fig14-2.dat` 文件中的数据构成的。我们在本章中还将看到的其他绘图样式包括二维和三维的散点图（`splot`\
  \ 指令会将 Gnuplot 置于三维模式）。`using 1:2` 字符串指定了 `fig14-2.dat` 文件中绘图的列数；在三维模式下，`using 1:2:3`\
  \  Gnuplot 将第 1、2、3 列作为 x、y、z 轴绘图。\n\n## 结合 psad 和 Gnuplot\n\n如第 6 章和第 7 章所示，psad\
  \ 提供的核心功能之一是解析和解释 iptables 日志消息的能力。通过使用一系列命令行开关，psad 的解析能力可以与 Gnuplot 的绘图能力相结合。\n\
  \n这些开关中最重要的是 `--gnuplot`。额外的命令行参数为 psad 解析 iptables 日志数据以及构建 Gnuplot 数据输入文件的方式增加了可配置性，这些选项如下：\n\
  \n`--CSV-fields`\n\n设置从 iptables 日志文件中提取的字段。常用的字段有 `src`、`dst`、`dp` 和 `proto`（它们分别映射到\
  \ iptables 日志消息中的 `SRC`、`DST`、`DPT` 和 `PROTO` 字段）。每个 `--CSV-fields` 接受一个额外的匹配标准，允许排除或包含特定值。例如，仅当源\
  \ IP 地址位于 192.168.50.0/24 子网内、目的 IP 地址位于 10.100.10.0/24 子网内且目的端口为 80 时包含数据点，你可以使用\
  \ `--CSV-fields \"src:192.168.50.0/24 dst:10.100.10.0/24 dp:80\"`。此外，支持通过字符串 `countday`、`counthour`\
  \ 和 `countmin` 对三个时间跨度（天、小时或分钟）进行字段计数。\n\n`--CSV-regex`\n\n对原始 iptables 日志字符串进行正则表达式匹配，只有当正则表达式匹配时，才包含消息中的字段。例如，为了要求\
  \ fwsnort 日志前缀为 `SID*nnn*`（参见第 10 章），其中 *nnn* 是任意三位数字，你可以使用 `--CSV-regex \"SID\\\
  d{3}\"`。`--CSV-neg-regex` 命令行参数也支持否定正则表达式。\n\n`--gnuplot-graph-style`\n\n设置 Gnuplot\
  \ 绘图样式。可能的值包括线（lines）、点（dots）、散点（points）和线点（linespoints）。\n\n`--gnuplot-file-prefix`\n\
  \n设置文件前缀名，psad 在解析 iptables 日志数据时创建 `prefix*.dat` 和 `prefix*.gnu` 文件。`prefix*.gnu`\
  \ 文件包含了用于绘制 `prefix*.dat` 文件数据的 Gnuplot 指令。\n\n# AfterGlow\n\nAfterGlow 专门用于将数据可视化为链接图（link\
  \ graphs），并且（在最新版本中）树状图（tree maps）。*链接图*是节点和边的表示，用于传节点之间的关系。此类图非常适合显示 IP 地址和端口号等数据。AfterGlow\
  \ 由安全可视化网站 [`www.secviz.org`](http://www.secviz.org) 的创始人 Raffael Marty 开发，该网站包含了从\
  \ SSH 连接到 iptables 策略的所有内容的讨论和可视化示例；多个 AfterGlow 用户为该网站贡献可视化内容。\n\npsad 连接 AfterGlow\
  \ 的接口与 Gnuplot 的接口类似。对于 AfterGlow，`--CSV-fields` 命令行参数同样重要，用于指定从 iptables 日志文件中提取的字段，且\
  \ `--CSV-regex` 和 `--CSV-neg-regex` 参数也适用于正则表达式过滤数据。\n\n例如，为了让 AfterGlow 构建从 11.11.0.0/16\
  \ 网络向 11.11.0.0/16 网络之外系统的所有出站 SYN 包的链接图，你可以执行以下命令：\n\n```\n# psad -m iptables.data\
  \ --CSV --CSV-fields \"src:11.11.0.0/16 dst:not11.11.0.0/16 dp\"\n--CSV-regex \"\
  SYN URGP=\" | perl afterglow.pl -c color.nf | neato -Tpng -o webconnections.png\n\
  ```\n\n上述命令的结果是 `webconnections.png` 图形文件中解析数据的可视化。我们将在本章的稍后部分看到 AfterGlow 生成的链接图示例，但需要注意的一个重要特性是，你可以通过向\
  \ AfterGlow 命令行提供配置文件的路径（使用上面的 `-c` 参数）来控制与每个绘图节点相关的颜色。这是一个示例配置文件，它是 AfterGlow 源码提供的默认\
  \ `color.properties` 文件的修改版本：\n\n```\n# AfterGlow Color Property File\n#\n# @fields\
  \ 是包含解析值的数组\n# color.source 是源节点的颜色\n# color.event 是事件节点的颜色\n# color.target 是目标节点的颜色\n\
  #\n# 第一个匹配者获胜\n#\n❶ color.source=\"yellow\" if ($fields[0]=˜/^\\s*11\\.11\\./);\n\
  color.source=\"red\"\ncolor.event=\"yellow\" if ($fields[1]=˜/^\\s*11\\.11\\./);\n\
  ❷ color.event=\"red\"\n❸ color.target=\"blue\" if ($fields[2]>1024)\ncolor.target=\"\
  lightblue\"\n```\n\nAfterGlow 链接图显示了源节点、事件节点和目标节点之间的连接。在上面的示例中，所有源节点都是 11.11.0.0/16\
  \ 网络内的 IP 地址，它们在 ❶ 处涂为黄色。所有事件节点在 ❷ 处涂为红色（11.11.0.0/16 网络永远不会匹配，因为我们在 psad 命令行通过\
  \ `not11.11.0.0/16` 匹配标准将所有事件节点限制为外部地址）。所有大于 1024 的端口在 ❸ 处涂为蓝色，下一行将所有小于或等于 1024\
  \ 的端口涂为浅蓝色。你可以使用创新的颜色定义为复杂的 AfterGlow 链接图添加有效的视觉辅助。\n\n## iptables 攻击可视化\n\n\n\n\
  \n\n端口扫描的一个关键特征是扫描器向一个范围内的端口发送数据包。因此，在视觉化海大的 `iptables` 数据集时，将源 IP 地址与向唯一端口发送的数据包数量进行绘图是提取端口扫描活动的好方法。以下\
  \ `psad` 的执行使用了 `--CSV-fields \"src:not11.11.0.0/16 dp:countuniq\"` 命令行参数，将非本地源地址与发送到唯一端口的数据包数量进行绘图：\n\
  \n```\n # psad -m iptables.data --gnuplot --CSV-fields \"src:not11.11.0.0/16 dp:countuniq\"\
  \n--gnuplot-graph points --gnuplot-xrange 0:26500 --gnuplot-file-prefix fig14-3\n\
  [+] Entering Gnuplot mode...\n[+] Parsing iptables log messages from file: iptables.data\n\
  [+] Parsed 179753 iptables log messages.\n[+] Writing parsed iptables data to: fig14-3.dat\n\
  [+] Writing gnuplot directive file: fig14-3.gnu\n$ gnuplot fig14-3.gnu\n```\n\n\
  Gnuplot 生成了如图图 14-3 所示的图表。\n\n![源 IP 地址与唯一端口数量对比](img/httpatomoreillycomsourcenostarchimages207416.png)\n\
  \n图 14-3. 源 IP 地址与唯一端口数量对比\n\n正如你在图 14-3 中所示（该图绘制的是单个点而不是绘制连续折线，此选项在上述 `psad` 的执行中以**粗体**显示），你可以看到，绝大多数源地址只向一个或两个唯一端口发送了数据包，尽管少数地址连接了大约\
  \ 10 个端口。然而，正如你在图表左上角看到的，有一个 IP 地址（在 x 轴约 1000 的范围内）连接了超过 60 个唯一端口；这是整个数据集中最顶端的端口扫描器。\n\
  \n还要注意，端口扫描的时间范围*没有*被纳入图表中。因此，源 IP 地址扫描这 60 个唯一端口的速度快慢并不重要——扫描可能发生在数据集所涵盖的整个五周跨度内，但在图\
  \ 14-3 中仍然会显示为最顶端的端口扫描器。\n\n### Note\n\n由于 Gnuplot 处理整数数据时效果最好，`psad` 在解析 `iptables`\
  \ 日志文件时，会将所有 IP 地址映射为唯一的正整数（从 0 开始）。因此，IP 地址 `192.168.3.2` 可能会被映射到类似 `502` 的数字，而\
  \ `11.11.79.125` 可能会被映射到 `10201`，这取决于日志文件中唯一地址的数量。对于 Gnuplot 数据文件中的每一行，IP 地址始终作为尾随注释包含在行末。这让你能够看到每个地址映射到了哪个整数。\n\
  \n`psad` 生成的 `fig14-3.dat` 文件顶部包含以下三个数据点：\n\n```\n 905, 66  ### 905=60.248.80.102\n\
  12415, 10  ### 12415=63.135.2.15\n15634, 10  ### 15634=63.186.32.94\n```\n\n这告诉我们，主要的端口扫描器是\
  \ IP 地址 `60.248.80.102`，总共扫描了 66 个目标端口。接下来的两个糟糕者也只扫描了 10 个唯一端口。\n\n现在让我们为 Scan34\
  \ 数据集绘制每小时唯一端口数量的图。这将向我们展示是否存在快速的端口扫描，或者扫描器是否在扫描蜜罐网时都试图避开可能正在监控的 IDS 的端口扫描时间阈值：\n\
  \n```\n # psad -m iptables.data --gnuplot --CSV-fields \"timestamp\ndp:counthouruniq\"\
  \ --gnuplot-graph lines --gnuplot-xrange 1140887484:1143867180\n--CSV-neg-regex\
  \ \"SRC=11.11.\" --gnuplot-yrange 0:100 --gnuplot-file-prefix fig14-4\n$ gnuplot\
  \ fig14-4.gnu\n```\n\n执行 Gnuplot 会生成一个每小时到唯一端口连接数量的图。（注意上面**粗体**的，`psad` 命令行中针对目标端口的\
  \ `counthouruniq` 指令解析了 Scan34 数据集，以生成此图所需的原始数据。）图 14-4 显示了结果图表，在 3 月 31 日的某个时间，每小时唯一端口的数量出现了巨大的峰值。\n\
  \n![时间与唯一端口对比](img/httpatomoreillycomsourcenostarchimages207455.png)\n\n图 14-4.\
  \ 时间与唯一端口对比\n\n事实上，这与图 14-3 中看到的顶级端口扫描器 `60.248.80.102` 相对应，正如由 `60.248.80.102`\
  \ IP 地址产生的第一个和最后一条 `iptables` 日志消息的时间戳所示：\n\n```\n $ grep 60.248.80.102 iptables.data\
  \ | head -n 1\nMar 31 10:43:28 bridge kernel: INBOUND TCP: IN=br0 PHYSIN=eth0 OUT=br0\
  \ PHYSOUT=eth1\nSRC=60.248.80.102 DST=11.11.79.125 LEN=40 TOS=0x00 PREC=0x00 TTL=108\
  \ ID=123 DF\nPROTO=TCP SPT=51129 DPT=4000 WINDOW=16384 RES=0x00 SYN URGP=0\n$ grep\
  \ 60.248.80.102 iptables.data | tail -n 1\nMar 31 10:45:14 bridge kernel: INBOUND\
  \ UDP: IN=br0 PHYSIN=eth0 OUT=br0 PHYSOUT=eth1\nSRC=60.248.80.102 DST=11.11.79.125\
  \ LEN=32 TOS=0x00 PREC=0x00 TTL=108 ID=43845 PROTO=\nUDP SPT=2402 DPT=256 LEN=12\n\
  ```\n\n上述第一个日志消息的时间戳是 3 月 31 日上午 10:43，最后一条是同一天的上午 10:45。这告诉我们整个端口扫描只花费了两分钟。\n\n\
  最后，为了获取尽可能多关于 `60.248.80.102` 扫描 IP 地址的信息，你可以使用取证模式下的 `psad` 并使用 `--analysis-fields\
  \ \"src:60.248.80.102\"` 命令行参数将其调查范围限制为仅此 IP 地址，如下：\n\n```\n # psad -m iptables.data\
  \ -A --analysis-fields \"src:60.248.80.102\"\n[+] IP Status Detail:\nSRC:  60.248.80.102,\
  \ DL: 2, Dsts: 1, Pkts: 67, Unique sigs: 3\nDST: 11.11.79.125\n❶ Scanned ports:\
  \ UDP 7-43981, Pkts: 53, Chain: FORWARD\n❷ Scanned ports: TCP 68-32983, Pkts: 1,\
  \ Chain: FORWARD\n❸ Signature: \"POLICY vviewer Javalet download\n            TCP,\
  \ Chain: FORWARD, Count: 1, DP: 5802, Sid: 1846\nSignature match: \"PSAD-CUSTOM\
  \ Slammer communication\"\n            UDP, Chain: FORWARD, Count: 1, DP: 1434,\
  \ Sid: 100208\nSignature match: \"RPC portmap listing UDP 32771\"\n            UDP,\
  \ Chain: FORWARD, Count: 1, DP: 32771, Sid: 1281\n```\n\n`psad` 取证模式的大部分输出已删除，留下了有趣的部分——扫描\
  \ TCP 和 UDP 端口范围（❶ 和❷）以及 `60.248.80.102` IP 地址在 `psad` 中触发的签名匹配（❸）。\n\n### Port\
  \ Sweeps\n\n端口横扫非常有趣，因为它们通常表明蠕虫或人类攻击者正试图通过特定服务的漏洞入侵更多系统。图 14-5 将外部 IP 地址与每个外部地址发送到唯一本地地址的数量进行绘图：\n\
  \n```\n # psad -m iptables.data --gnuplot --CSV-fields \"src:❶not11.11.0.0/16 dst:11.11.0.0/16,\n\
  ❷countuniq\" --gnuplot-graph points --gnuplot-xrange 0:26000 --gnuplot-yrange 0:27\n\
  --gnuplot-file-prefix fig14-5\n$ gnuplot fig14-5.gnu\n```\n\nGnuplot 生成了如图图 14-5\
  \ 所示的图表。（注意 ❶ 处的 `not` 以排除 `11.11.0.0/16` 网络，以及 ❷ 处的 `countuniq` 指令以计算唯一目标地址。）\n\
  \n![外部源与唯一本地目的地对比](img/httpatomoreillycomsourcenostarchimages207398.png)\n\n图 14-5.\
  \ 外部源与唯一本地目的地对比\n\n\n\n\n\n如图 14-5 所示，大多数外部地址（x 轴）向一个或两个目的地址发送数据包（在 y 轴上计数）。然而，有几个外部地址连接到蜜罐网络（honeynet）中的多达\
  \ 24 个地址。对于代表大约 18000 到 26000 范围的外部地址来说尤其如此。`fig14-5.dat` 文件（可以从 [`www.cipherdyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)\
  \ 下载）显示，18000 到 26000 的 IP 地址范围对应于 `iptables` 数据集中的 63.236.244.77 到约 221.140.82.123。\n\
  \nScan34 `iptables` 数据集某些源反复尝试连接到目标系统范围内的特定端口。图 14-6 绘制了从外部源地址到目的端口的数据包数量。该图是三维的，因此\
  \ x 轴表示源地址，y 轴显示端口号，z 轴是数据包计数。（注意 `psad` 命令行上的 `--gnuplot-3d` 参数）。\n\n```\n # psad\
  \ -m iptables.data --gnuplot --CSV-fields src:not11.11.0.0/16 dp:count  --gnuplot\n\
  -graph points --gnuplot-3d --gnuplot-view 74,77 --gnuplot-file-prefix fig14-6\n\
  $ gnuplot fig14-6.gnu\n```\n\n![外部源地址与目的端口及数据包计数](img/atomatomoreillycomsourcenostarchimages207424.png)\n\
  \n图 14-6. 外部源地址与目的端口及数据包计数\n\n在小于 10000 的端口（y 轴）上超过 2000 个数据包（z 轴）的离群值显示在源地址与目的端口的常规平面之上（该平面上的常规计数小于\
  \ 500）。我们可以通过查看 `fig14-6.dat` 文件发现，该点对应于 IP 地址 200.216.205.189，它向 TCP 端口 3306 (MySQL)\
  \ 发送了总计 2244 个数据包：\n\n```\n 22315, 3306, 2244  ### 22315=200.216.205.189\n```\n\n\
  这看起来确实是一个端口扫描器（port sweeper）。事实上，图 14-7 所示的图表说明，源 IP 地址 200.216.205.189 连接到 11.11.0.0/16\
  \ 子网中许多目的地址上的端口 3306（我们在下方将后续图限制为加粗的源 IP 地址 200.216.205.189）：\n\n```\n # psad -m\
  \ iptables.data --gnuplot --CSV-fields \"dst dp:3306,count\" --CSV-regex \"SRC=\n\
  200.216.205.189\" --gnuplot-graph points --gnuplot-yrange 0:150 --gnuplot-file-prefix\n\
  fig14-7\n$ gnuplot fig14-7.gnu\n```\n\n图 14-7 中的图显示了 IP 地址 200.216.205.189 向目的地址（x\
  \ 轴）的 TCP 端口 3306 发送的数据包数量（y 轴）。端口扫描共涉及 24 个目的地址，在某些系统上，向端口 3306 发送了超过 120 个数据包。\n\
  \n![MySQL 3306 端口扫描](img/atomatomoreillycomsourcenostarchimages20732.png)\n\n图 14-7.\
  \ MySQL 3306 端口扫描\n\n可视化上述信息的另一种方法是使用 `Afterglow` 生成链接图。此类图包含可见格式的源和目的 IP 地址，并显示了从\
  \ IP 地址 200.216.205.189 到 11.11.0.0/16 子网中几个目的地的系列数据包：\n\n```\n # psad  -m iptables.data\
  \ --CSV --CSV-fields \"src:200.216.205.189 dp:3306\" --CSV-\nmax 6 | perl afterglow.pl\
  \ -c color.nf | neato -Tpng -o fig14-8.png\n```\n\n`psad` 对 `Afterglow` 的接口产生了图\
  \ 14-8 所示的链接图。（参见上述 `psad` 的 `--CSV-max` 参数，用于限制数据点为六个以提高可读性。）\n\n![MySQL 端口扫描链接图](img/atomatomoreillycomsourcenostarchimages20742.png)\n\
  \n图 14-8. MySQL 端口扫描链接图\n\n## Slammer 蠕虫\n\nSlammer（或称 Sapphire）蠕虫是历史上传播速度最快的蠕虫之一。它利用了\
  \ Microsoft SQL Server 2000 的栈溢出漏洞，并通过单个 404 字节的数据包（包括 IP 头部）发送到端口 1434。在你的 `iptables`\
  \ 日志中可以很容易识别 Slammer 蠕虫：指向 UDP 端口 1434 的数据包且 `LEN` 字段为 404。`psad` 签名集包含 `CUSTOM\
  \ Slammer communication` 签名，当蠕虫命中你的某个系统时提醒你。让我们看看 Slammer 蠕虫是否从外部源对蜜罐进行了攻击：\n\n\
  ```\n # psad -m iptables.data --gnuplot --CSV-fields \"timestamp dp1434,counthour\"\
  \ --gnuplot\n-graph lines --gnuplot-xrange 1140887484:1143867180 --CSV-regex \"\
  LEN=404.*PROTO=UDP\"\n```\n\n```\n`gnuplot` 产生了图 14-9 所示的线条图（注意 `--CSV-regex` 命令行中的\
  \ `LEN=404` 参数，因为 Scan34 数据中有其他指向端口 1434 的 UDP 数据包，但它们不是 Slammer 蠕虫，因为数据包长度不是 404\
  \ 字节）。\n\n```\n --gnu-file-prefix fig14-9\n```\n\n![Slammer 蠕虫按小时的数据包计数](img/atomatomoreillycomsourostarchimages20741.png)\n\
  \n图 14-9. Slammer 蠕虫按小时的数据包计数\n\n事实上，Slammer 蠕虫对蜜罐是活跃的，3 月 20 日的峰值显示每小时约 57 个数据包。这是一个大量的活动，但当我们更改时间尺度时会发生什么？按分钟查看\
  \ Slammer 的活动（注意此时 `psad` 使用了 `countmin` ）：\n\n```\n # psad -m iptables.data --gnuplot\
  \ --CSV-fields \"timestamp dp1434,countmin\"\n--gnuplot-graph lines --gnuplot-xrange\
  \ 1140887484:1143867180 --CSV-regex \"LEN=404.*\nPROTO=UDP\"\n--CSV-neg-regex \"\
  SRC=11.11.\" --gnuplot-file-prefix fig14-10\n$ gnuplot fig14-10\n```\n\n现在，Slammer\
  \ 蠕虫的图 14-10 看起来并不那么像图 14-9 中的尖锐峰值那样糟糕，但这仅仅是因为时间尺度发生了变化。感染 Slammer 蠕虫的系统数据包数量没有变化，但在\
  \ 3 月 21 日 Scan34 覆盖的期间建立了四个数据包的最大值。\n\n![Slammer 蠕虫按分钟的数据包计数](img/atomatomoreillycomsourostarchimages20740.png)\n\
  \n图 14-10. Slammer 蠕虫按分钟的数据包计数\n\n## Nachi 蠕虫\n\nNachi 蠕虫攻击未修复 MS03-026 漏洞的 Microsoft\
  \ Windows 2000 和 XP 系统（`MS03-026` 字符串指的是微软漏洞编号）。该蠕虫的一个关键特征是在尝试入侵系统之前，它先用一个 92 字节的\
  \ ICMP 请求数据包 ping 目标。这个特定长度为 92 字节的初始 ICMP 数据包使得 Nachi 蠕虫易于检测。要绘制 Scan34 `iptables`\
  \ 数据集的 Nachi 蠕虫流量，你可以在 `psad` 的 `--CSV-fields` 参数中使用 `ip_len:92` 标准，并将检查限制为源自 11.11.0.0/16\
  \ 子网的 ICMP 数据包：\n\n```\n # psad -m iptables.data --gnuplot --CSV-fields \"timestamp\
  \ ip_len:92,counthour\"\n--gnuplot-graph lines --gnuplot-xrange 1140887484:1143867180\
  \ --CSV-regex \"PROTO=ICMP\"\n--CSV\n-neg-regex \"SRC=11.11.\" --gnuplot-file-prefix\
  \ fig14-11\n$ gnuplot fig14-11.png\n```\n\n\n\n\n\n果然，在 3 月 19 日 Nachi 蠕虫活动出现了一次高峰，在图\
  \ 14-11 所示的 Gnuplot 图中可以很容易看出。\n\n![每小时 Nachi 蠕虫流量](img/httpatomoreillycomsourcenostarchimages207396.png)\n\
  \n图 14-11. 每小时 Nachi 蠕虫流量\n\n蠕虫流量的链路图非常引注目，因为有大量的外部 IP 地址向本地子网发送可疑数据包。由 `AfterGlow`\
  \ 生成的链路图（所示图 14-12）展示了 Nachi 蠕虫 ICMP 流量正聚集攻击蜜网系统。92 字节的 IP `LEN` 字段显示为图中正中间的小圆圈，外部\
  \ IP 地址显示为椭圆，而蜜网地址显示为矩形：\n\n```\n # psad -m iptables.data --CSV --CSV-fields \"\
  src dst ip_len:92\" --CSV-max 300 --CSV\n-regex \"PROTO=ICMP.*TYPE=8\" | perl afterglow.pl\
  \ -c color.nf |neato -Tpng -o fig14-12.png\n```\n\n## 从受损系统的出站连接\n\n将蜜网系统置于开放的互联网上，是希望它们能被攻破。分析成功的攻击以及导致实际攻破的步骤，是学习如何保护你的系统以及获取潜在新漏洞有价值情报的最佳方法。除了我们已经讨论过的端口扫描、端口遍历和蠕虫活动外，我们还可以使用\
  \ `iptables` 数据来判断是否有蜜网系统向外部 IP 地址发了出站连接。\n\n![Nachi 蠕虫 92 字节 ICMP 数据包链路图](img/httpatomoreillycomsourcenostarchimages207370.png)\n\
  \n图 14-12. Nachi 蠕虫 92 字节 ICMP 数据包链路图\n\n当蜜网到外部 SSH 和 IRC 服务器的连接无法通过预期的管理通信来解释时，这些连接尤为可疑，并且是蜜网系统已被攻破的强有力指标。同样，如果你注意到你管理的系统出现了出站的\
  \ SSH 或 IRC 连接，且对此类连接没有合理、合法的解释，那么可能需要进行深度分析。\n\n为了绘制出从蜜网 `11.11.0.0/16` 子网到外部地址目标端口的所有出站\
  \ SYN 数据包，我们执行以下命令：\n\n```\n # psad -m iptables.data --gnuplot --CSV-fields \"src:11.11.0.0/16\
  \ dst:not11.11.0.0/16 dp\" --CSV-regex \"SYN URGP=\" --gnuplot-graph points  --gnuplot-file-prefix\
  \ fig14-13 --gnuplot-view 71,63\n$ gnuplot fig14-13.png\n```\n\n`Gnuplot` 生成了所示图\
  \ 14-13。（请注意上方加粗的 **\"SYN URGP=\"** 匹配准则，它匹配 `iptables` 日志消息中 TCP 标志部分的 SYN 标志。）\n\
  \n![蜜网出站连接的点状图](img/httpatomoreillycomsourcenostarchimages207388.png)\n\n图 14-13.\
  \ 蜜网出站连接的点状图\n\n图 14-13 中的图表显示了从蜜网单个源地址（由 x 轴上的数字 1 表示）到多个外部地址（由 y 轴 0 到 45 的范围表示）的一系列\
  \ SYN 数据包。每个 SYN 数据包的目标端口显示在 z 轴上。如你所见，有几个指向 0–1000 范围内低端口的数据包，还有几个指向 6000–7000\
  \ 范围内高端口的数据包。这可能是可疑的，但我们需要知道具体的目标端口以便做出更知情的判断。为此，我们转向具有相同搜索参数的链路图：\n\n```\n # psad\
  \ -m iptables.data --CSV --CSV-fields \"src:11.11.0.0/16 dst:not11.11.0.0/16 dp\"\
  \ --CSV-regex \"SYN URGP=\" | perl afterglow.pl -c color.nf | neato -Tpng -o fig14-14.png\n\
  ```\n\n`AfterGlow` 生成了所示图 14-14。\n\n![蜜网出站连接的链路图](img/httpatomoreillycomsourcenostarchimages207451.png)\n\
  \n图 14-14. 蜜网出站连接的链路图\n\n图 14-14 中的链路图比图 14-13 的相同数据更容易判断发生了什么。我们看到蜜网正在向外部 IP 地址建立\
  \ TCP 连接。源 IP 地址是 11.11.79，在链路图中显示为椭圆。所有的矩形都是外部 IP 地址。\n\n# 结语\n\n安全数据的可视化表示可以快速传达重要信息，而这些信息可能需要耗费大量分析才能获取，而且对于需要筛选数据的人来说，这无疑是幸事。通过从安全数据中提取字段并绘制图表，往往可以得出趣味性的结论。对于\
  \ `iptables` 数据，`psad` 提供了从日志中提取字段的手段，而 `Gnuplot` 和 `AfterGlow` 项目让这些数据栩如生。\n\n\
  ## 附录 A. 欺骗攻击\n\n如果入侵检测系统（IDS）有一个共同点，那就是它们会产生误报——有时会为明显并非恶意的流量发送告报。调整 IDS 是减少误报负载的要求，但即使是调整最精细的\
  \ IDS 也会将正常流量误认为恶意。这为攻击者创造了机会。如果攻击者能够故意制造在 IDS 看来是恶意的网络流量，那么可能也可以向 IDS 隐藏攻击（或监控\
  \ IDS 告报的人员）。\n\n* *\n\n² 许多管理员拥有从网络各个点收集的 PCAP 原始数据包文件。尽管 `psad` 目前尚未解析这些文件，但你可以使用\
  \ `tcreplay` 工具（参见 [`tcreplay.synfin.net`](http://tcreplay.synfin.net)）将这些数据包发送到\
  \ `iptables` 防火墙，以便 `iptables` 记录数据包，供 `psad`、`Gnuplot` 和 `AfterGlow` 渲染。这个想法是在与\
  \ Richard Bejtlich 的邮件通信中被建议的。\n\n\n\n\n此外，攻击者可以通过从由该第三方拥有的 IP 地址向 IDS 发起伪造攻击，从而以此陷害一个无辜的第三方；IDS\
  \ 适配员可能很难区分伪造攻击和真实攻击。本附录稍后出现的 `snortspoof.pl` 脚本将向你展示如何创建针对 Snort IDS 的此类虚假流量；在讨论该脚本时，我们还将涵盖\
  \ Snort 为缓解此类攻击而采用的对策措施。\n\n## 连接跟踪 (Connection Tracking)\n\n如在 第 9 章 中提到的，Snort\
  \ 添加了 `stream4` 预处理器以应对伪造的 TCP 攻击；它会跟踪 TCP 会话的状态，并忽略未通过已建立的会话发送的攻击。从攻击者的角度来看，生成看起来像恶意的流量的最佳方法是解析\
  \ IDS 使用的签名集，并构造具有与这些签名匹配的伪造源 IP 地址的数据包。\n\n这正是以下 Perl 脚本（`snortspoof.pl`）对 Snort\
  \ IDS 规则集所做的。（该脚本随 `fwsnort` 项目发布，也可以从 [`www.cipherdyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)\
  \ 下载。）`snortspoof.pl` 脚本的设计目的是为了说明使用 Perl 构建 Snort 在没有流预处理器的情况下识别为恶意的 IP 数据包是多么简单。然而，此脚本并不是用于生成匹配所有\
  \ Snort 规则流量的完整性程序。某些 Snort 规则包含对应用层数据的复杂描述（在某些情况下使用 `pcre` 关键字指定了正则表达式，例如），而 `snortspoof.pl`\
  \ 尚未处理此类复杂性。\n\n```\n [spoofer]$ cat snortspoof.pl\n#!/usr/bin/perl -w\n\n❶ require\
  \ Net::RawIP;\nuse strict;\n\nmy $file       = $ARGV[0] || '';\nmy $spoof_addr =\
  \ $ARGV[1] || '';\nmy $dst_addr   = $ARGV[2] || '';\n\ndie \"$0 <rules file> <spoof\
  \ IP> <dst IP>\"\n    unless $file and $spoof_addr and $dst_addr;\n\n# alert udp\
  \ $EXTERNAL_NET any -> $HOME_NET 635 (msg:\"EXPLOIT x86 Linux # mountd\noverflow\"\
  ; content:\"^|B0 02 89 06 FE C8 89|F|04 B0 06 89|F\";\n### reference:bugtraq,121\n\
  my $sig_sent = 0;\n❷ open F, \"< $file\" or die \"[*] Could not open $file: $!\"\
  ;\nSIG: while (<F>) {\n    my $content = '';\n    my $conv_content = '';\n    my\
  \ $hex_mode = 0;\n    my $proto = '';\n    my $spt = 10000;\n    my $dpt = 10000;\n\
  \n    ### make sure it is an inbound sig\n❸     if (/^\\s*alert\\s+(tcp|udp)\\s+\\\
  S+\\s+(\\S+)\\s+\\S+\n            \\s+(\\$HOME_NET|any)\\s+(\\S+)\\s/x) {\n    \
  \    $proto = $1;\n        my $spt_tmp = $2;\n        my $dpt_tmp = $4;\n\n    \
  \    ### can't handle multiple content fields yet\n        next SIG if /content:.*\\\
  s*content\\:/;\n\n        $content = $1 if /\\s*content\\:\\\"(.*?)\\\"\\;/;\n \
  \       next SIG unless $content;\n\n        if ($spt_tmp =˜ /(\\d+)/) {\n     \
  \       $spt = $1;\n        } elsif ($spt_tmp ne 'any') {\n            next SIG;\n\
  \        }\n        if ($dpt_tmp =˜ /(\\d+)/) {\n            $dpt = $1;\n      \
  \  } elsif ($dpt_tmp ne 'any') {\n            next SIG;\n        }\n\n        my\
  \ @chars = split //, $content;\n❹         for (my $i=0; $i<=$#chars; $i++) {\n \
  \           if ($chars[$i] eq '|') {\n                $hex_mode == 0 ? ($hex_mode\
  \ = 1) : ($hex_mode = 0);\n                next;\n            }\n            if\
  \ ($hex_mode) {\n                next if $chars[$i] eq ' ';\n                $conv_content\
  \ .= sprintf(\"%c\",\n                        hex($chars[$i] . $chars[$i+1]));\n\
  \                $i++;\n            } else {\n                $conv_content .= $chars[$i];\n\
  \            }\n        }\n        my $rawpkt = '';\n        if ($proto eq 'tcp')\
  \ {\n❺            $rawpkt = new Net::RawIP({'ip' => {\n                saddr =>\
  \ $spoof_addr, daddr => $dst_addr},\n                'tcp' => { source => $spt,\
  \ dest => $dpt, 'ack' => 1,\n                data => $conv_content}})\n        \
  \            or die \"[*] Could not get Net::RawIP object: $!\";\n        } else\
  \ {\n❻            $rawpkt = new Net::RawIP({'ip' => {\n                saddr =>\
  \ $spoof_addr, daddr => $dst_addr},\n                'udp' => { source => $spt,\
  \ dest => $dpt,\n                data => $conv_content}})\n                    or\
  \ die \"[*] Could not get Net::RawIP object: $!\";\n        }\n❼         $rawpkt->send();\n\
  \        $sig_sent++;\n    }\n}\nprint \"[+] $file, $sig_sent attacks sent.\\n\"\
  ;\nclose F;\nexit 0;\n```\n\n深入源码，在 ❶ 处，脚本使用了 `Net::RawIP` Perl 模块，该模块必须在你的系统上安装。（你可以从\
  \ [`www.cpan.org`](http://www.cpan.org) 下载它。）在 ❷ 处，打开命令行给出的 Snort 规则文件，脚本遍历文件中的所有规则。在\
  \ ❸ 处，`snortspoof.pl` 提取检测针对 `HOME_NET` 攻击的 TCP 和 UDP 签名；我们想要发送那些远程 Snort 传感器正在寻找的进入\
  \ `HOME_NET` 的攻击。\n\n代码中最复杂的部分始于 ❹ 处——解释 Snort 规则试图在网络流量中匹配的应用层内容字符串。如果原始内容字段包含包含在管道符号（`|`）字符之间的十六进制代码，`snortspoof.pl`\
  \ 在攻击数据包放入网线之前将这些字符转换为字节。在 ❺ 和 ❻ 处，`snortspoof.pl` 使用 `Net::RawIP` Perl 模块构建 TCP\
  \ 或 UDP 数据包，使用命令行指定的源目的地址以及源自 Snort 规则的应用层数据。最后，在 ❼ 处，数据包发送到目标 IP。\n\n现在是时候使用 `snortspoof.pl`\
  \ 针对 `exploit.rules` 文件中包含的签名伪造 IP 地址。\n\n## 伪造 exploit.rules 流量 (Spoofing exploit.rules)\n\
  \n你可以按照以下方式执行 `snortspoof.pl` 来伪造 `exploit.rules` 文件中的攻击包（使其看起来来自 IP 地址 11.11.22.22），并将它们发送到目标\
  \ IP 地址 44.44.55.55：\n\n```\n [spoofer]#  snortspoof.pl /etc/fwsnort/exploit.rules\
  \ 11.11.22.22 44.44.55\n[+] /etc/fwsnort/exploit.rules, 53 attacks sent.\n```\n\n\
  使用 `tcpdump`，我们可以确认 `snortspoof.pl` 正如所述运行运行并对目标 IP 生成了攻击。以下示例显示了 Snort 规则 315 `EXPLOIT\
  \ x86 Linux mountd` 通过 UDP 发送：\n\n```\n [spoofer]#  tcpdump -i eth1 -l -nn -s 0\
  \ -X -c 1 port 635\ntcpdump: verbose output suppressed, use -v or -vv for full protocol\
  \ decode\nlistening on eth1, link-type EN10MB (Ethernet), capture size 65535 bytes\n\
  23:32:08.563668 IP 11.11.22.22.10000 > 44.44.55.55.635: UDP, length 14\n     0x0000:\
  \  4510 002a 0000 4000 4011 b62f 0b0b 1616  E..*...@../....\n     0x0010:  c0a8\
  \ 0a03 2710 027b 0016 90cf 5eb0 0289  ....'..{.......\n     0x0020:  06fe c889 4604\
  \ b006 8946                 ....F....F\n1 packets captured\n2 packets received by\
  \ filter\n0 packets dropped by kernel\n```\n\n\n\n\n本附录讨论了攻击者如何尝试利用 Snort 规则集作为创建恶意流量的指南，从而强制\
  \ Snort 产生误报事件。`snortspoof.pl` 脚本通过解析 Snort 规则集并使用原始套字（raw sockets）向目标 IP 地址发送匹配的流量来实现这一自动化。尽管\
  \ `snortspoof.pl` 仅适用于 Snort IDS，但类似的策略也可以适用于任何使用签名检测可疑流量的 IDS；你只需要一个签名集副本以及经过稍作修改的\
  \ `snortspoof.pl` 版本即可。\n\n## 伪造 UDP 攻击\n\n许多入侵检测系统采用的一种防御措施是跟踪 TCP 连接的状态，并仅对通过已会话传输的攻击发送警报。这对于通过\
  \ UDP 发送的攻击是无效的，除非采用基于时间的机制来同时跟踪客户端发送的所有数据包以及任何相应的服务器响应。以这种方式跟踪 UDP 通信可以允许 IDS 对模拟恶意服务器响应的伪造攻击发送警报，但它无法解决来自\
  \ UDP 客户端的伪造攻击，因为此类流量并不需要双向通信。`Snort-2.6.1` 包含一个增强的 `stream5` 预处理器，并支持 UDP，因此伪造\
  \ UDP 服务器响应对 Snort 的效果已经降低。总的来说，解析 IDS 的签名集并在网络上进行伪造，是测试任何 IDS 可能提供的连接跟踪能力的一种良好方法。\n\
  \n# 附录 B. 完整的 FWSNORT 脚本\n\n在本附录中，你将找到一个完整的 `fwsnort.sh` 脚本示例；它是由 `fwsnort` 根据 `web-attacks.rules`\
  \ 文件中的七条不同的 Snort 规则生成的。这些规则通过规则 ID `1332`、`1336`、`1338`、`1339`、`1341`、`1342` 和\
  \ `1360` 标识，旨在检测 Web 客户端通过 Web 服务器执行某些命令（通常是通过一个接受用户输入并由 Web 服务器执行的 CGI 程序）。这些命令在\
  \ Linux 系统上很常见，包括 `gcc` 编译器、`nc` (Netcat)、`chown`、C shell `chsh` 以及 `id`（用于查询分配给当前用户的\
  \ UID 和 GID 值）。Web 客户端任何强制 Web 服务器执行这些命令的严重尝试都可能是可疑的。\n\n要创建 `fwsnort.sh` 脚本并使其包含上述七条\
  \ Snort 规则的 `iptables` 命令，请如下所示执行 `fwsnort`：\n\n```\n[iptablesfw]# fwsnort --snort-sid\
  \ 1332,1336,1338,1339,1341,1342,1360\n[+] Parsing Snort rules files...\n[+] Found\
  \ sid: 1332 in web-attacks.rules\n    Successful translation.\n[+] Found sid: 1336\
  \ in web-attacks.rules\n    Successful translation.\n[+] Found sid: 1338 in web-attacks.rules\n\
  \    Successful translation.\n...\n[+] Logfile:         /var/log/fwsnort.log\n[+]\
  \ Iptables script: /etc/fwsnort/fwsnort.sh\n```\n\n上面的输出表明 Snort 规则已正确转换为 `iptables`\
  \ 规则（部分输出已省略），且 `fwsnort.sh` 脚本存在于 `/etc/fwsnort` 目录。下方以其完整、未省略的形式显示。\n\n\n\n\n\n\
  ```bash\n[iptablesfw]# cat /etc/fwsnort/fwsnort.sh\n#!/bin/sh\n#\n########################################################################\n\
