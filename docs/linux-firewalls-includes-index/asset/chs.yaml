  \n# 致谢\n\n《Linux 防火墙》的诞生得益于沿每一步中许多人的帮助。我特别感谢 No Starch Press 的人员，感谢他们付出的努力。William\
  \ Pollock、Bonnie Granat、Megan Dunchak 和 Christina Samuell 都付出了许多小时的专业编辑工作，使这本书的质量更高。感谢\
  \ Pablo Neira Ayuso 帮助让 `Netfilter` 和 `iptables` 成为今天今日的模样，并负责了书中材料的技术编辑工作。Tenable\
  \ Network Security 的首席技术官 Ron Gula 和 Splunk 的首席安全策略师 Raffael Marty 都提供了建设性的批评，并在本书出版前还慷慨地为本书背书。我还要想感谢\
  \ TaoSecurity 的创始人 Richard Bejtlich，他撰写了一篇出色的序言。Richard，你的书籍是我的灵感来源。我的父母 James 和\
  \ Billie Mae 以及我的兄弟 Brian 都因为他们不断的鼓励而应该得到特别感谢。最后，非常感谢我的妻子 Katie。没有你，这本书是不可能实现的。\n\
  \n# 前言\n\n当听到*防火墙*一词时，大多数人会想到一种在 OSI 参考模型网络层和传输层检查网络流量并做出通过或过滤决策的产品。从产品角度来看，存在几十种防火墙类型。它们根据所检查的数据源（例如网络流量、主机进程或系统调用）以及检查这些源的深度进行区分。几乎任何检查通信并决定是否通过或过滤的设备都可以被视为防火墙产品。\n\
  \n代理防火墙的发明者、第一种商业防火墙产品的实施者 Marcus Ranum 在 20 世纪 90 年代对*防火墙*一词给出了定义，他说：“防火墙是你互联网安全策略的实现。”这是一个非常好的定义，因为它是产品中性的、永恒的且现实的。它同样适用于\
  \ William R. Cheswick 和 Steven M. Bellovin 编写的原始防火墙书籍《防火墙与网络安全》（Addison-Wesley Professional,\
  \ 1994）。\n\n按照 Ranum 的定义，防火墙也可以被视为一种策略执行系统。检查并通过或过滤流量的设备可以被称为*网络策略执行系统*。检查并通过或过滤主机活动的可以被称为*主机策略执行系统*。无论何种情况，强调策略执行将注意力放在防火墙的正确角色上，而不是仅仅是“阻止坏东西”的设备。\n\
  \n对于“坏东西”，在今天的企业中防火墙是否有效是合理的。配置良好的传统防火墙基本上拒绝所有互联网协议、IP 地址、`TCP/UDP` 端口以及 `ICMP`\
  \ 类型和代码。在现代攻击环境中，这种防御完全不足。限制那些剥利用通道对于限制目标的入站和出口是必要的，但网络和传输层过滤至少十年来一直是完全不充分的措施。\n\
  \n2007 年，攻击客户端的最有效方法是引导用户激活恶意执行文件、向用户发送带有恶意内容的链接，或攻击用户计算体验的其他客户端组件。在许多情况下，利用并不依赖于可以修复的漏洞或可以加强的配置。相反，攻击者利用了\
  \ `JavaScript` 和 `Flash` 等富媒体平台的漏洞，这些平台对于现在的网页日益需要。\n\n2007 年，攻击服务器的最有效方法是绕过操作系统并利用应用程序。Web\
  \ 应用程序主导服务器领域，它们更容易出现架构和设计缺陷。十年代末更改购物车物品的价格来演示不安全的应用程序是一种时尚。得益于 `Ajax`，几乎十年后购物车运行在客户端，用户再次更改价格——而且情况更糟。\n\
  \n这一切让防火墙产品的局面看起来相当暗淡。许多产品通过整合深度数据包检测或在 OSI 参考模型的应用层或之上运行来适应。其他产品则作为*入侵防御系统*运行，使用一个聪明的营销术语在看似同质化的市场中脱颖而出。在客户端攻击和\
  \ Web 应用程序利用的时代，防火墙（特别是开源产品）是否还有地位？\n\n\n\n\n答案是肯定的——而且你现在正在阅读一种方法。Michael Rash\
  \ 是创造性利用网络技术进行防御目的的先驱。从一眼某特定拉斯维加斯黑客会议的演讲者名单就可以看出，安全研究和开发世界往往被攻击性工具和技术所主导。Michael\
  \ 与这一趋势背道而行，他继续发明并改进保护资产免受攻击的方法。在从攻击性会议上领略了黑暗面目后，我们几乎所有人都会回到保护企业这看似看似平庸的工作。得益于这本书，我们拥有了一套额外的程序和方法来让我们的工作变得更加轻松。\n\
  \n在阅读这本书草稿时，我识别出了几个主题。首先，随着设备变得自给自足并暴露在互联网上，以主机为中心的防御变得越来越重要。这种演变的一个极端例子是 `IPv6`\
  \ 的引入，当它按照其创始者的预期进行部署时，它恢复了原始互联网的“端到端”特性。当然，`end-to-end` 也可以翻译为“攻击者到受害者”，因此，主机保护自身的其他方法也是可赞的。`Linux\
  \ Firewalls` 将教你如何使用基于主机的防火墙和工具来保护主机。\n\n其次，尽管主机必须日益增强自卫，但仅靠主机为中心的措施是不够的。一旦主机被攻破，它就无法再负责自己的防御。入侵者突破系统后，会惯性地禁用主机防火墙、防病毒软件和其他保护代理。因此，在可能的情况下仍然需要以网络为中心的过滤设备。受害者控制的终端只能使用网络防火墙允许的通信通道，至少限制了入侵者享有的机动自由。`Linux\
  \ Firewalls` 也将教你网络设备如何保护主机。\n\n第三，我们必须寻找防御资产的创造性方法并理解攻击格局。如果想限制对敏感服务的访问，单包授权（Single\
  \ Packet Authorization）是比端口敲门（port knocking）更巨大的一步。可视化有助于通过渲染日志和流量，使分析师能够检测到感兴趣的细微事件。读完这本书后，你可能会发现一些其他人（包括作者在内）未预到的利用你的防御基础设施的其他方法。\n\
  \n我想以书评评论员和作者的身份总结这些想法。在 2000 年到 2007 年年中期间，我阅读并评阅了近 250 本技术类书籍。我也写过几本书，所以我相信我能认出一本好书。`Linux\
  \ Firewalls` 是一本好书。我是一个 FreeBSD 用户，但 `Linux Firewalls` 足够优秀，足以让我考虑在某些情况下使用 Linux！Mike\
  \ 的书非常清晰、组织良好、简洁且具有可操作性。你应该能够阅读它，并通过遵循他的示例实现你发现的每一个内容。你不仅将熟悉工具并学会使用这些技术，还将欣赏作者敏锐的防御洞察力。\n\
  \n世界上大多数数字安全专业人员专注于防御，将攻击留给坏人、警察和军队。我欢迎像 `Linux Firewalls` 这样的书籍，它们以一种可以被消化和部署且成本和精力最低的形式，将真实的防御工具和技术带给大众。祝你好运——我们都需要它。\n\
  \n**Richard Bejtlich**\n\n**通用电气事件响应总监**\n\n**弗吉尼亚州 Manassas Park**\n\n* * *\n\n\
  ^([1]) ¹ *`Computer Security Journal*, 第 XI 卷，第 1 期，1995 年春季 ([`http://www.spirit.com/csi/papers/hownot.htm`](http://www.spirit.com/csi/papers/hownot.htm`))\n\
  \n# 引言\n\n攻击似乎正在占据上风。几乎没有哪一天没有关于软件漏洞新利用程序的消息、更有效的垃圾邮件传播方法（我的收件箱可以证明这一点），或者从公司或政府机构发生的高知名敏感个人数据被窃取的新闻。实现安全计算是一项持久的挑战。设计用于击败狡猾黑帽的技术并不缺少，但他们仍然继续成功地攻破系统和网络。\n\
  \n对于每一类安全问题，几乎肯定有一个开源或专有的解决方案设计用于应对它。这在网络入侵检测系统和网络访问控制设备（防火墙、过滤路由器等）领域尤为如此。防火墙技术的一项趋势是将入侵检测世界的应用层检查技术与过滤网络流量的能力结合起来，这正是防火墙长期以来一直在做的事情。这本书的目标是证明，`Linux`\
  \ 系统上的 `iptables` 防火墙定位很好，可以利用这一趋势，特别是当它与某些旨在从入侵检测角度利用 `iptables` 的额外软件结合时。\n\n\
  我希望这本书在现有的出版物中是独特的。那里有几本优秀的书籍讨论了 `Linux` 防火墙的各个方面，但据我所知，没有一本专门专注于可以被 `iptables`\
  \ 及其提供的数据检测到（在某些情况下阻止）的攻击。还有很多关于入侵检测的书籍，但没有一本书专注于使用防火墙技术来真正补充入侵检测过程。这本书关于这两种技术的融合。\n\
  \n我将重点介绍三个开源软件项目，这些项目旨在最大化提高 `iptables` 在攻击检测和预防方面的效率。这些项目是：\n\n## `psad`\n一个 `iptables`\
  \ 日志分析器和主动响应工具\n\n## `fwsnort`\n一个将 `Snort` 规则转换为等效 `iptables` 规则的脚本\n\n## `fwknop`\n\
  用于 `iptables` 的单包授权 (SPA) 实现\n\n所有这些项目都根据 GNU 公共许可证 (GPL) 作为开源软件发布，并可以 [`http://www.cipherdyne.org`](http://www.cipherdyne.org)\
  \ 下载。\n\n# 为什么要用 `iptables` 检测攻击？\n\n> 罗森克兰茨：我的意思是，你们到底*做什么*什么？\n\n> 玩家：我们基本上还是照常行事，只是把它们反过来做。我们在舞台上执行那些本该在后台发生的事情。这是一种诚实，如果你把每个出口看作是另一个地方的入口。\n\
  \n> —汤姆·斯托帕，《罗森克兰茨与吉登斯坦之死》\n\n如果你运行 `Linux` 操作系统，你可能遇到过 `iptables` 防火墙。这很有道理，因为\
  \ `iptables` 提供了一种有效手段，可以控制谁通过网络连接与你的 `Linux` 系统通信，以及他们如何通信。在互联网这一庞大且不受控的网络中，攻击可能来自全球的任何角落——尽管入侵者在物理位置上可能位于另一个州（甚至就在隔壁房间）。如果你运行着连接了网的\
  \ `Linux` 机器，你的系统在每天 24 小时的每一秒钟里都面临着被攻击并可能被攻破的风险。\n\n\n\n部署严格的 `iptables` 过滤策略是维护强有力安全态的良好第一步。即使你的\
  \ Linux 系统连接到上游由其他防火墙或其他过滤设备保护的网络，也始终存在该上游设备可能无法提供足够保护的可能性。此类设备可能配置不当、可能存在漏洞或其他故障，或者它可能不具备保护你的\
  \ Linux 系统免受某些类攻击的能力。在可能的情况下实现合理程度的冗余是至关重要的，而且在每个 Linux 系统（包括服务器和桌面设备）上运行 `iptables`\
  \ 带来的安全收益可能会大于额外的管理开销。换句话说，系统被破解的风险以及可能丢失的数据价值，可能会大于在你的整个 Linux 基础设施中部署和维护 `iptables`\
  \ 的成本。\n\n本书的主要目标是向你展示如何从检测和响应网络攻击的角度最大化地利用 `iptables`。一个限制了“谁可以访问 Linux 系统上哪些服务”的限制\
  \ `iptables` 策略是一个良好的第一步，但你很快就会发现，你还可以做得远得多。\n\n## 专用网络入侵检测系统如何？\n\n检测入侵的任务通常交留给专门为此目的设计的、且对本地网络具有广泛视野的特殊系统。本书并不主张改变这一策略。作为保护网络的安全基础设施的一部分，拥有专用的网络入侵检测系统\
  \ (IDS) 是不可替代的。此外，IDS 能够收集的原始数据包数据是一个无价的数据源。每当安全分析师被要求调查攻击或系统被破解期间发生了什么时，拥有原始数据包数据对于还原整个过程至关重要，而\
  \ IDS 的事件可以指引方向。如果没有 IDS 来引起对疑活动的关注，分析师可能根本不会怀疑系统正受到攻击。\n\n本书*确实*主倡的是使用 `iptables`\
  \ 来补充现有的入侵检测基础设施。`iptables` 的主要重点是对网络流量应用策略限制，而不是检测网络攻击。然而，`iptables` 提供了强大的功能，使其能够模拟很大程度上传统属于入侵检测系统范畴的能力。例如，`iptables`\
  \ 的日志格式提供了关于网络层和传输层头部中几乎每个字段的详细数据（包括 IP 和 TCP 选项），而 `iptables` 的字符串匹配能力可以对应用层数据执行字节序列匹配。这些能力对于提供检测尝试入侵的能力至关重要。\n\
  \n入侵检测系统通常是被动式设备，它们不会被配置为对看似恶意的网络流量自动采取任何惩罚性措施。通常情况下，这样做是有理由的，因为存在将良性流量误认为更阴险内容的风险（称为*误报*）。然而，某些\
  \ IDS 可以以在线方式部署到网络流量中，当以这种方式部署时，此类系统通常被称为网络*入侵防御系统 (IPS)*。由于 `iptables` 是一个防火墙，它对于网络流量来说始终是在线的，这使得许多攻击在造成重大损害之前就能过滤掉。许多组织由于基础连接和性能的顾虑，一直不愿在自己的网络基础设施中部署在线\
  \ IPS。然而，在某些情况下，根据应用层检查标准过滤流量的能力是非常用的，而且在 Linux 系统上，`iptables` 可以通过将 IDS 签名重转换为\
  \ `iptables` 策略来提供基本的 IPS 功能，从而阻止网络攻击。\n\n## 深度防御\n\n*深度防御*（Defense in depth）是一个借自军事领域的原则，通常应用于计算机安全领域。它规定在任意系统（无论是从计算机网络到物理军事设施）的各个层次都必须*预料*到攻击。没有任何能确保攻击永远不会发生。此外，某些攻击可能会成功并破坏或损害系统的某些组件。因此，在系统的各个层次采用多个层级的防御机制是至关重要的；当攻击破坏其中一个安全设备时，另一个设备可能成功限制了额外的损害。\n\
  \n在网络安全领域，Snort 是开源入侵检测世界的冠军，许多商业供应商也生产了出色的防火墙和其他过滤设备。然而，如果你在自己的基础设施中运行 Linux，那么真正的问题是，*仅*依赖这些安全机制来保护你的关键资产是否是明智的。深度防御原则表明，`iptables`\
  \ 可以作为现有安全基础设施的重要补充。\n\n***\n\n¹尽管名称听起来很高大且有无尽的厂商营销炒作，但网络入侵防御系统如果没有一种*检测*攻击的方法将将一无是处——而检测机制来自\
  \ IDS 世界。\n\n# 前提条件\n\n本书假设你对 TCP/IP 网络概念和 Linux 系统管理有一定的了解。了解开放系统互模型 (OSI) 参考模型以及主要的网络层和传输层协议（IPv4、ICMP、TCP\
  \ 和 UDP），以及一些 DNS 和 HTTP 应用协议的知识将最有帮助。尽管会频繁提到 OSI 参考模型的各个层，但网络层、传输层和应用层（分别为第 3、4\
  \ 和 7 层）占据了大部分讨论。会话层和表示层未被涵盖，物理层和数据链路层仅被提及（有关第 2 层过滤的详细信息可以在 [`ebtables.sourceforge.net`](http://ebtables.sourceforge.net)\
  \ 找到）。对网络层、传输层和应用层的重点在于这些每一层可能发生的攻击——很大程度上假设你已经了解这些各层的结构和功能。尽管没有专门讨论无线协议和 IPv6，但书中的许多示例也适用于这些协议。\n\
  \n具备基本编程概念的实用知识（特别是在 Perl 和 C 编程语言方面）也会有用，但代码示例通常会进行拆解和解释。书中的几处显示了通过 `tcpdump` 以太网嗅探器显示的原始数据包数据，因此具有\
  \ `tcpdump` 或 `Wireshark` 等以太网嗅探器的经验会有帮助。除了上述描述的内容外，不假设具备计算机安全、网络入侵检测或防火墙概念的先验知识。\n\
  \n\n\n\n最后，本本书侧重于网络攻击——如何检测并响应它们。因此，本本书通常不会讨论主机级安全问题，例如是否需要对运行 `iptables` 的系统进行加固（加固方法包括移除编译器、大幅削减用户账户、应用最新的安全补丁等）。然而，Bastille\
  \ Linux 项目（访问 [`www.bastille-linux.org`](http://www.bastille-linux.org)）提供了关于主机安全问题的优秀信息。对于真正的硬核用户，NSA\
  \ 的 SELinux 分发版（访问 [`www.nsa.gov/selinux`](http://www.nsa.gov/selinux)）是一项令人惊叹尝试，它从最重要的组件——内核本身开始提升了系统安全性。\n\
  \n# 技术参考文献\n\n以下书籍是本书书中更具技术性的一些优秀辅助参考：\n\n- 《Building Internet Firewalls, 2nd Edition》，Elizabeth\
  \ D. Zwicky, Simon Cooper, and D. Brent Chapman (O'Reilly, 2000)\n- 《Computer Networks,\
  \ 4th Edition》，Andrew S. Tannenbaum (Prentice Hall PTR, 2002)\n- 《Firewalls and\
  \ Internet Security: Repelling the Wily Hacker, 2nd Edition》，William R. Cheswick,\
  \ Steven M. Bellovin, and Aviel D. Rubin (Addison-Wesley Professional, 2003)\n-\
  \ 《Linux System Security, 2nd Edition》，Scott Mann and Ellen L. Mitchell (Pearson\
  \ Education, 2002)\n- 《Programming Perl, 3rd Edition》，Larry Wall, Tom Christiansen,\
  \ and Jon Orwant (O'Reilly, 2000)\n- 《The Tao of Network Security Monitoring: Beyond\
  \ Intrusion Detection》，Richard Bejtlich (Addison-Wesley Professional, 2004)\n- 《The\
  \ TCP/IP Guide》，Charles M. Kozierok (No Starch Press, 2005)\n- 《TCP/IP Illustrated,\
  \ Volume 1: The Protocols》，W. Richard Stevens (Addison-Wesley, 1994)\n\n# 关于网站\n\
  \n本书中包含了几个示例脚本、`iptables` 策略和命令，以及网络攻击实例和相关的数据包捕获。所有这些材料也可以从本书的配套网站下载，该地址为 [`www.cipherdyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)。拥有电子版是亲自琢磨和实验概念及代码的最佳方式。网站上还提供了\
  \ `psad`、`fwsnort` 和 `fwknop` 项目运行的示例，文档以及 `Trac` 接口 ([`trac.edgewall.com`](http://trac.edgewall.com))，它允许你查看每个项目的源代码。每个项目的源代码都妥善地存档在\
  \ Subversion 仓库 ([`subversion.tigris.org`](http://subversion.tigris.org)) 中，因此可以直地看到代码如何从一个版本变为另一个版本。最后，在网站上还可以找到一些\
  \ `iptables` 日志数据的有趣图形表示。\n\n如果你在阅读本书时有任何问题，也可以在本书网站上找到答案。如果你对涵盖的任何材料有任何疑问，请随时向我提问。可以通过电子邮件\
  \ mbr@cipherdyne.org 与我联系。\n\n# 章节摘要\n\n在阅读*Linux Firewalls*的过程中，你将涵盖大量内容。本节提供了每个章节的简要概述，让你对内容有所预期。\n\
  \n### 第 1 章](#ch01.html \"第 1 章：IPTABLES 的维护与管理\")\n\n本章介绍了使用 `iptables` 进行数据包过滤，包括内核构建细节和\
  \ `iptables` 管理。本章提供了一个默认策略和网络图，并在贯书中反复引用。运行默认策略的 Linux 机器作为局域网（LAN）的防火墙，针对该系统的攻击将在后续章节中进行说明。\n\
  \n### 第 2 章](#ch02.html \"第 2 章：网络层攻击与防御\")\n\n本章展示了网络层存在的攻击类型以及你可以针对它们采取的措施。我将向你介绍\
  \ `iptables` 的日志格式，并强调你可以从 `iptables` 日志中获取的网络层信息。\n\n### 第 3 章](#ch03.html \"第\
  \ 3 章：传输层攻击与防御\")\n\n传输层是通过端口扫描和探测进行服务器侦察的领域，本章检查了这些方法的内部工作原理。`iptables` 日志格式非常适合表示传输层头部信息，这对于检测各种恶意行为非常有用。\n\
  \n### 第 4 章](#ch04.html \"第 4 章：应用层攻击与防御\")\n\n今天大多数攻击利用了运行在 TCP/IP 协议族之上日益复杂的应用程序。本章插图说明了\
  \ `iptables` 可以检测的应用层攻击类别，并向你介绍了 `iptables` 字符串匹配扩展。\n\n### 第 5 章](#ch05.html \"\
  第 5 章：介绍 PSAD：端口攻击检测器\")\n\n本章讨论了 `psad` 的安装和配置，并向你展示了为什么倾听 `iptables` 日志的故事如此重要。\n\
  \n### 第 6 章](#ch06.html \"第 6 章：PSAD 操作：检测可疑流量\")\n\n`psad` 提供了许多功能，这些功能旨在最大化你对\
  \ `iptables` 日志的使用。从端口扫描到后门探测，`psad` 通过详细的电子邮件和 syslog 进行报告。\n\n### 第 7 章](#ch07.html\
  \ \"第 7 章：高级 PSAD 主题：从特征匹配到操作系统指纹\")\n\n本章向你介绍了高级 `psad` 功能，包括集成的操作系统指纹、通过数据头进行\
  \ Snort 特征检测、详细状态以及以及 Shield 报告。本章完全关于 `iptables` 日志信息在提供安全数据方面的深度。\n\n### 第 8 章](#ch08.html\
  \ \"第 8 章：使用 PSAD 进行主动响应\")\n\n如果没有响应攻击的选择。`psad` 提供的响应能力建立在良好的接口之上，易于集成第三方软件，并包含了与\
  \ Swatch 项目的示例。\n\n### 第 9 章](#ch09.html \"第 9 章：将 Snort 规则转换为 iptables 规则\")\n\n\
  Snort IDS 为社区了检测网络攻击的方法，因此在 `iptables` 中利用 Snort 特征语言是合理的。由于 `iptables` 提供了丰富的日志格式和检查应用层数据，许多\
  \ Snort 特征可以转换为 `iptables` 规则。\n\n### 第 10 章](#ch10.html \"第 10 章：部署 FWSNORT\")\n\
  \n将 Snort 特征转换为 `iptables` 规则的繁琐任务已通过 `fwsnort` 项目实现，本章将向你展示实现方法。部署 `fwsnort` 为你的\
  \ `iptables` 策略赋予了真正的入侵检测能力。\n\n### 第 11 章](#ch11.html \"第 11 章：结合 PSAD 和 FWSNORT\"\
  )\n\n由 `fwsnort` 生成的日志会被 `psad` 获取并分析，以提供更好的电子邮件报告（集成 whois 和反向 DNS 查询以及被动操作系统指纹）。本章代表了通过\
  \ `iptables` 实现攻击检测和缓解策略的总结。\n\n### 第 12 章](#ch12.html \"第 12 章：端口敲与单包授权\")\n\n\
  被动授权对于保持网络服务的安全变得越来越重要。使用这种技术可以严重限制零日漏洞的破坏范围，但并非所有被动授权范式都足够用于关键部署。本章比较并对比了两种被动授权机制：端口敲和单包授权（SPA）。\n\
  \n### 第 13 章](#ch13.html \"第 13 章：介绍 FWKNOP\")\n\n\n\n\n\n今天现有的 SPA 实现很少，而 `fwknop`\
  \ 是其中开发最活跃、支持最好的之一。本章将向你展示如何安装并结合 `iptables` 使用 `fwknop`，以维持默认拒绝策略，拦截所有未经身份验证和授权的连接你\
  \ SSH 守护进程的尝试。\n\n## 第 14 章：可视化 iptables 日志\n\n书的最后一章以 iptables 日志数据的某些图形表示作为结束。一张图片可以快速说明网络通信中的趋势，这些趋势可能指示着系统已被攻破；通过将\
  \ `psad` 与 AfterGlow 项目结合，你可以看到 `iptables` 显示的内容。\n\n## 附录 A：攻击欺骗\n\n解析 Snort 签名规则集、构造匹配的数据包并从伪造的源地址将其发送到网络是非常容易的。附录\
  \ A 讨论了一个随 `fwsnort` 的示例 Perl 脚本，它正是此类操作。\n\n## 附录 B：完整的 FWSNORT 脚本\n\n`fwsnort`\
  \ 项目创建了一个 脚本，自动执行所需的 `iptables` 命令，以创建一个能够检测应用层攻击的 `iptables` 策略。附录 B 包含了由 `fwsnort`\
  \ 生成的完整 `fwsnort.sh` 脚本示例。\n\n本书采用了高度实用的方法。通过真实示例可以更好地理解概念，而深入源代码内部或仔细检查数据包追踪始终是理解计算机在做什么的极佳方式。我希望在读完此书后，你将掌握关于如何通过\
  \ `iptables` 检测和处理网络攻击的强大实战知识。再次，我强烈鼓励你提问，你可以随时通过 `mbr@cipherdyne.org` 与我联系。\n\n\
  # 第 1 章：iptables 的维护与饲养\n\n在本章中，我们将探索在 Linux 系统上正确安装、维护和与 `iptables` 防火墙交互的本质要素。我们将从内核和用户态的双重角度涵盖\
  \ `iptables` 管理，以及如何构建和维护 `iptables` 防火墙策略。我们将构建一个默认策略，它作为书中几个章节的指南；本章还包含一个实现该策略的脚本和一个网络拓扑图供参考。书中的许多示例攻击将从该网络拓扑图所示的主机启动。最后，我们将测试默认的\
  \ `iptables` 策略，以确保其按设计运行。\n\n## iptables\n\n`iptables` 防火墙由 Netfilter 项目([http://www.netfilter.org])\
  \ 开发，并自 2001 年 1 月 Linux 2.4 内核发布以来一直作为 Linux 的一部分可用。\n\n多年来，`iptables` 已成熟为一个强大的防火墙，具有大多数专有商业防火墙中常见的功能。例如，`iptables`\
  \ 提供了全面的协议状态跟踪、数据包应用层检查、速率限制以及一种指定过滤策略的强大机制。所有主要的 Linux 发行版都包含 `iptables`，并且许多版本会在安装程序中直接提示用户部署\
  \ `iptables` 策略。\n\n`iptables` 和 `Netfilter` 术语之间的差异一直是 Linux 社区困困的来源。Linux 提供的所有数据包过滤和改写设施官方项目名称为\
  \ `Netfilter`，但该术语也指 Linux 内核中的一个框架，该框架可以在网络栈的各个阶段挂钩函数。另一方面，`iptables` 使用 Netfilter\
  \ 框架将设计用于执行数据包操作（如过滤）的函数挂钩到网络栈中。你可以将 Netfilter 视为为 `iptables` 构建防火墙功能提供的框架。\n\n\
  `iptables` 一词也指解析命令行并将防火墙策略通信给内核的用户态工具。`tables`（表）、`chains`（链）、`matches`（匹配）和 `targets`（目标，在本章后文中定义）等术语在\
  \ `iptables` 的范围内是有意义的。\n\nNetfilter 本身并不过滤流量——它只是允许*能够*过滤流量的函数挂钩到内核中的正确位置。（我不再在此赘述这一点；书中大部分内容都围绕\
  \ `iptables` 以及它如何对符合某些标准的数据包采取行动。）Netfilter 项目还在内核中还提供了几项基础设施，例如连接跟踪和日志记录；任何 `iptables`\
  \ 策略都可以使用这些设施执行专门的数据包处理。\n\n### 注意事项\n\n在书中，我将由 Netfilter 日志子系统生成的日志消息称为 `iptables\
  \ log messages`；毕竟，数据包只有在匹配了最初由 `iptables` 构建的 `LOG` 规则时才会被记录。因此为了不引起混淆，除非有充分的理由使用\
  \ `Netfilter`（例如在讨论内核编译选项或连接跟踪能力时），否则我默认将使用 `iptables` 术语。反正大多数人都将 Linux 防火墙与 `iptables`\
  \ 联系在一起。\n\n## 使用 iptables 进行数据包过滤\n\n`iptables` 防火墙允许用户对与 Linux 系统交互的 IP 数据包进行高度控制；该控制是在\
  \ Linux 内核内部实现的。可以使用 `iptables` 构建一个策略，充当一个强力的交通警察——未允许通过的数据包落入深渊且再无音讯，而通过检查的数据包则会被放之高行或被修改以符合本地网络的需求。\n\
  \n一个 `iptables` 策略由一组有序的 `rules`（规则）组成，这些规则向内核描述了针对某些类数据包应该采取的操作。每个 `iptables` 规则都应用到\
  \ `table`（表）内的一个 `chain`（链）。一个 `iptables` `chain` 是规则的集合，按顺序与共同特征的数据包（例如路由到 Linux\
  \ 系统，而不是离开系统）进行比较。\n\n### 表 (Tables)\n\n`table` 是 `iptables` 的一种结构，用于划分功能的泛畴，例如数据包过滤或网络地址转换\
  \ (NAT)。共有四张表：`filter`、`nat`、`mangle` 和 `raw`。过滤规则应用到 `filter` 表，NAT 规则应用到 `nat`\
  \ 表，修改数据包数据的特殊规则应用到 `mangle` 表，而独立于 Netfilter 连接跟踪子系统运行的规则应用到 `raw` 表。\n\n### 链\
  \ (Chains)\n\n每张表都有自己的内置链，但也可以创建用户定义的链，以便用户构建一组具有共同标签（如 `INPUT_ESTABLISHED` 或 `DMZ_NETWORK`）的规则。对于我们的目的而言，最重要的内置链是\
  \ `filter` 表中的 `INPUT`、`OUTPUT` 和 `FORWARD` 链：\n\n*   `INPUT` 链由内核内核路由计算后指向本地 Linux\
  \ 系统的数据包遍历（例如指向本地套接字）。\n*   `OUTPUT` 链留给 Linux 系统本身生成的数据包。\n*   `FORWARD` 链管理通过\
  \ Linux 系统路由的数据包（例如当 iptables 防火墙用于连接两个网络，且两个网络之间的数据包必须通过防火墙时）。\n\n\n\n\n\n对于任何严肃的\
  \ `iptables` 部署来说，另外两个重要的链是 `nat` 表中的 `PREROUTING` 和 `POSTROUTING` 链，它们用于在内核进行 IP\
  \ 路由计算之前之后修改数据包头部。本章后面的示例 `iptables` 命令将说明 `PREROUTING` 和 `POSTROUTING` 链的使用，在此期间，图\
  \ 1-1 显示了数据包如何在内核的 `nat` 和 `filter` 表之间流动。\n\n![iptables packet flow](img/httpatomoreillycomsourcenostarchimages207420.png)\n\
  \n图 1-1. iptables 数据包流\n\n### 匹配 (Matches)\n\n每个 `iptables` 规则都有一组匹配项以及一个*目标*（target），该目标告诉\
  \ `iptables` 如何处理符合规则的数据包。`iptables` `match`（匹配）是一个数据包必须满足的条件，`iptables` 才能根据规则目标指定的动作处理该数据包。例如，要将规则仅应用于\
  \ TCP 数据包，可以使用 `--protocol` 匹配项。\n\n每个匹配项都在 `iptables` 命令行上指定。书中最重要的 `iptables`\
  \ 匹配项列在下面。（当我们在第 20 页讨论贯穿本书的默认 `iptables` 策略时，你将在“默认 iptables 策略”中看到更多关于匹配项的内容。）\n\
  \n| `--source` (`s`) | 匹配源 IP 地址或网络 |\n| `--destination` (`d`) | 匹配目标 IP 地址或网络 |\n\
  | `--protocol` (`p`) | 匹配 IP 值 |\n| `--in-interface` (`i`) | 输入接口（例如，eth0） |\n|\
  \ `--out-interface` (`o`) | 输出接口 |\n| `--state` | 匹配一组连接状态 |\n| `--string` | 匹配应用层数据字节序列\
  \ |\n| `--comment` | 在内核内存中与规则关联最多 256 字节的注释数据 |\n\n### 目标 (Targets)\n\n最后，`iptables`\
  \ 支持一组目标，当数据包匹配规则时会触发相应的动作.^([3]) 书中使用的最重要的目标如下：\n\n| `ACCEPT` | 允许数据包继续其路径。 |\n\
  | `DROP` | 丢弃数据包。不进行进一步处理，对于接收端栈而言，就像该数据包从未发送过一样。 |\n| `LOG` | 将数据包记录到 syslog。 |\n\
  | `REJECT` | 丢弃数据包并同时发送相应的响应包（例如，针对 TCP 连接发送 TCP 重置包或针对 UDP 数据包发送 ICMP 端口不可达消息）。\
  \ |\n| `RETURN` | 在调用链中继续处理数据包。 |\n\n我们将在第 20 页的“默认 iptables 策略”中构建大量使用上述讨论的匹配项和目标的\
  \ `iptables` 规则。\n\n* *\n\n^([3]) ¹ 注意，这里的“匹配”是指数据包符合 `iptables` 规则中包含的所有匹配标准。\n\
  \n## 安装 iptables\n\n由于 `iptables` 分为两个基本组件（内核模块和用户态管理程序），安装 `iptables` 涉及编译并安装 Linux\
  \ 内核以及用户态二进制文件。内核源码包含了许多 Netfilter 子系统，而在从官方 Linux 内核存档网站 [`www.kernel.org`](http://www.kernel.org)\
  \ 发布的原始权威内核中，默认启用了基本的数据包过滤能力。\n\n在较早的 2.6 内核中（以及所有 2.4 内核）中，Netfilter 编译选项默认没有启用的。然而，由于\
  \ Netfilter 项目提供的软件多年来达到了很高的水平，内核维护者认为已经达到了一个点，即在 Linux 上使用 `iptables` 不再需要你重新编译内核。最近的内核允许你通过\
  \ `iptables` 策略默认过滤数据包。\n\n虽然许多 Linux 发行版附带了已编译 `iptables` 的预构建内核，但从 [`www.kernel.org`](http://www.kernel.org)\
  \ 下载的内核的默认配置尝试在开箱即用时尽可能精简，因此并不是所有的 Netfilter 子系统都已启用。例如，在 2.6.20.1 内核（截至本文时的最新内核版本）中，Netfilter\
  \ 连接跟踪功能默认未启用。因此，理解重新编译内核的过程非常重要，以便 `iptables` 策略能够利用额外的功能。\n\n### 注意\n\n在本章中，某些编译输出和安装命令已经了简写，以节省空间并将重点放在重要内容上。\n\
  \n构建可以作为 `iptables` 防火墙的 Linux 系统，最重要的步骤是 Linux 内核的正确配置和编译。`iptables` 中所有密集的网络处理和比较功能都在内核中进行，我们将从从\
  \ 2.6 稳定系列开始编译最新版本的内核。虽然对内核编译过程的复杂性的全面处理超出了本书的范围，但我们将讨论足够的过程，让你能够编译并启用关键功能。\n\n\
  ### 注意\n\n关于编译 2.6 内核的更多信息，请参阅 Kwan 编写的 [Kernel Rebuild Guide](http://www.digitalhermit.com/~kwan/kernel.html)(http://www.digitalhermit.com/~kwan/kernel.html)。对于旧的\
  \ 2.4 内核，请参阅 Brian Ward 编写的 [Kernel-HOWTO](http://www.tldp.org/howto/kernel.html)(http://www.tldp.org/howto/kernel.html)，或者参考任何关于\
  \ Linux 的书籍。Brian Ward 的 *How Linux Works*No Starch Press, 2004）也涵盖了内核。\n\n在安装 Linux\
  \ 内核之前，你需要下载并解压它。以下命令用于 2.6.20.1 内核。（在这些命令中，我假设 `/usr/src` 是写。）\n\n### 注意\n\n除非另有说明，本章是从\
  \ 2.6 系列内核的角度编写的。然而，相同的策略也适用于 2.4 系列内核。\n\n```\n $ /usr/src\n$ wget http://www.kernel.org/pub/linux/v2.6/linux-2.6.20.1.tar.bz2\n\
  $ tar xfj linux-2.6.20.1.tar.bz2\n$ ls -ld linux-2.6.20.1\ndrwxr-xr-x  18 mbr users\
  \ 600 Jun 16 20:48 linux-2.6.20.1\n```\n\n虽然我在命令中选择了特定的内核版本，但类似的命令适用于更新的内核版本。例如，当例如\
  \ 2.6.20.2 内核发布时，你只需要将上述命令中的 `2.6.20.1` 替换为 `2.6.20.2`。\n\n### 注意\n\n需要记住的一点是，`kernel.org`\
  \ 服务器的负载多年来一直在增长，随机看一眼 [`www.kernel.org`](http://www.kernel.org) 上的带宽利用率图可以看到当前的利用率远高于\
  \ 300 Mbps。为了帮助减轻负载，可以从 [`www.kernel.org/mirrors`](http://www.kernel.org/mirrors)\
  \ 列出的镜像站点之一下载内核。一旦你的系统上有了特定版本的内核源码，你就可以下载并应用内核补丁文件来升级到下一个版本。（补丁文件比内核本身小得多。）\n\n\n\
  \n\n\n在开始编译之前，你必须构建一个内核配置文件。幸运的是，内核开发人员已经自动化了构建此文件的过程，只需单个命令即可启动（在 `/usr/src/linux-2.6.20.1`\
  \ 目录下执行）：\n\n```\n$ make menuconfig\n```\n\n`make menuconfig` 命令会启动 Ncurses 接口，你可以在其中选择各种编译选项。（你可以分别通过\
  \ `make xconfig` 和 `make config` 命令调用 X Windows 界面或终端界面）。我选择 Ncurses 接口是因为它在简陋的终端界面和相对消耗资源的\
  \ X Windows 界面之间提供了很好的平衡。此外，Ncurses 接口还易于通过 SSH 会话对远程 Linux 内核进行配置，而无需转发 X Windows\
  \ 连接。\n\n执行 `make menuconfig` 后，我们将看到多个配置章节，范围从代码成熟度级别（Code Maturity Level）选项到库例程（Library\
  \ Routines）。对于 2.6 系列内核，大多数 Netfilter 编译选项都位于“网络（Networking）”▸“网络选项（Networking Options）”下的“网络数据包过滤框架（Network\
  \ Packet Filtering Framework (Netfilter))”章节中。\n\n## 关键 Netfilter 编译选项\n\n内核配置文件中需要开启的一些重要选项包括\
  \ Netfilter 连接跟踪、日志记录和数据包过滤。（请记住，iptables 是使用 Netfilter 提供的内核框架构建策略的。）\n\n在“网络数据包过滤框架\
  \ (Netfilter)”章节中还有两个配置章节——核心 Netfilter 配置（Core Netfilter Configuration）和 IP: Netfilter\
  \ 配置（IP: Netfilter Configuration）。\n\n### 核心 Netfilter 配置\n\n核心 Netfilter 配置章节包含了几个都应该启用的重要选项：\n\
  \n*   注释匹配支持（Comment match support）\n*   FTP 支持\n*   长度匹配支持（Length match support）\n\
  *   速率限制匹配支持（Limit match support）\n*   MAC 地址匹配支持（MAC address match support）\n*\
  \   `MARK` 目标支持\n*   Netfilter 连接跟踪支持\n*   通过 NFNETLINK 接口的 Netfilter `LOG`\n* \
  \  Netfilter netlink 接口\n*   Netfilter Xtables 支持\n*   状态匹配支持（State match support）\n\
  *   字符串匹配支持（String match support）\n\n### IP: Netfilter 配置\n\n完成核心 Netfilter 配置后，我们将进入\
  \ IP: Netfilter 配置章节。在此章节应开启的选项如下：\n\n*   ECN 目标支持\n*   全 NAT\n*   IP 地址范围匹配支持\n\
  *   IP tables 支持（过滤/伪装/NAT 必需）\n*   IPv4 连接跟踪支持（NAT 必需）\n*   `LOG` 目标支持\n*   `MASQUERADE`\
  \ 目标支持\n*   所有者匹配支持（Owner match support）\n*   数据包过滤\n*   数据包改性（Packet mangling）\n\
  *   `raw` 表支持（NOTRACK/TRACE 必需）\n*   近期匹配支持（Recent match support）\n*   `REJECT`\
  \ 目标支持\n*   `TOS` 匹配支持\n*   `TOS` 目标支持\n*   `TTL` 匹配支持\n*   `TTL` 目标支持\n*   `ULOG`\
  \ 目标支持\n\n在 2.6 内核系列中，各个编译章节经过了重组。在旧的 2.4 系列中，IP: Netfilter 配置章节位于“网络选项”下方，且该章节仅在启用了“网络数据包过滤（Network\
  \ Packet Filtering）”选项时才可见。\n\n## 完成内核配置\n\n通过 `menuconfig` 接口使用所需的 Netfilter 支持配置好\
  \ 2.6.20.1 内核后，选择 `Exit` 保存内核配置文件，直到看到消息 *Do you wish to save your new kernel configuration?*。回答\
  \ `Yes`。\n\n在保存了新的内核配置后，你将回到命令行 shell，你可以通过以下命令检查生成的 Netfilter 编译选项。\n\n### 注意\n\
  \n这些命令的输出太长，无法在此列出，但大多数 Netfilter 选项（例如 `CONFIG_IP_NF_NAT` 和 `CONFIG_NETFILTER_XT_MATCH_STRING`）都包含\
  \ `_NF_` 子字符串或 `NETFILTER` 子字符串。\n\n```\n$ grep \"_NF_\" .config\n$ grep NETFILTER\
  \ .config\n```\n\n## 可加载内核模块与内置编译及安全性的\n\n在上一节中开启的大多数 Netfilter 子系统可以被编译为可加载内核模块（LKM），可以在运行时动态加载或卸载到内核中；也可以直接编译到内核中，在这种情况下，它们无法在运行时加载或卸载。在上面的配置章节中，我们选择将大多数\
  \ Netfilter 子系统编译为 LKM。\n\n将功能编译为 LKM 与直接编译到内核之间存在安全上的权衡。一方面，任何编译为 LKM 的功能都可以使用\
  \ `rmmod` 命令从运行中的内核中移除。如果在模块中发现了安全漏洞，这可以提供一种优势，因为在某些情况下，仅需卸载模块即可缓解该漏洞。同样，如果内核源码中已修复了该漏洞，则可以重新编译并部署模块，而无需完全关机系统；修复漏洞将实现零停机时间。\n\
  \n### 注意\n\n内核中的 Netfilter 子系统并非免受偶发安全漏洞的影响。例如，在 Netfilter 日志子系统中处理 TCP 选项的代码中发现了一个漏洞（参阅\
  \ `http://www.netfilter.org/security/2004-06-30-2.6-tcpoption.html`）。如果日志子系统被编译为模块，则可以通过卸载该模块来牺牲\
  \ iptables 创建日志消息的能力以保护内核，这似乎是一个很好的权衡。\n\n另一方面，如果在实现某功能的代码中发现了漏洞，且该代码被直接编译到内核中，那么修复漏洞的唯一方法是应用补丁、重新编译并重启整个系统。对于任务关键型系统（如企业\
  \ DNS 服务器），在可以安排停机窗口之前，这可能是不可行的，在此期间系统可能会受到内核级攻击的威胁。\n\n## Rootkit 威胁\n\n然而，故事并未此结束。编译一个带有模块支持的内核开启了一个阴险的可能性：如果攻击者成功攻破了系统，内核中的模块支持将使攻击者更容易安装内核级\
  \ rootkit。一旦内核本身被攻破，就可以对系统实施各种恶剧。诸如 Tripwire 等文件系统完整性检查器可以被欺骗，进程可以被隐藏，网络连接可以躲避 netstat\
  \ 和 lsof 等工具的视线，甚至可以躲避（本地执行的数据包嗅探器）。然而，仅仅编译一个不支持模块的内核并不是万无一失的方案，因为并不是所有内核级 rootkit\
  \ 都要求主机内核提供模块支持。例如，SucKIT rootkit 可以通过 `/dev/kmem` 设备直接操作内核内存，将自己加载到运行的内核中。SucKIT\
  \ rootkit 在 Phrack 杂志的文章“Linux on-the-fly kernel patching without LKM”中引入安全领域（参阅\
  \ `http://www.phrack.org`）。\n\n\n\n\n\n无论你选择何种编译 Netfilter 子系统的策略——无论是作为 LKM（内核模块）还是直接编译进内核——计算机安全中一个不可违越的事实是复杂性会导致不安全；越复杂的系统越难安全。幸运的是，`iptables`\
  \ 高具有可性，既适用于描述如何处理和过滤网络流量的运行时规则语言，也适用于内核编译选项控制的支持功能类别。\n\n为了降低运行在内核中的代码复杂性，请不要编译你不需要的功能。从运行的内核中移除不必要的代码有助于最大限度地减少隐藏在代码中尚未的漏洞带来的风险。\n\
  \n例如，如果你不需要日志支持，只需在 `menuconfig` 界面中不启用 `Log Target Support` 选项。如果你不需要对 FTP 连接进行状态跟踪，请禁用\
  \ `FTP Protocol Support` 选项。如果你不需要针对以太网标头中的 MAC 地址编写过滤规则，请禁用 `MAC Address Match\
  \ Support` 选项。\n\n只编译满足本地网络和/或主机网络及安全需求绝对必需的功能。\n\n# 内核编译与安装\n\n现在内核已经配置完成，我们将进入编译和安装阶段。如前所述，我们假设已经选择了所有其他必要的内核选项（如处理器架构），以为运行新内核的硬件提供适当支持。\n\
  \n要在 `/boot` 分区编译并安装新的 `2.6.20.1` 内核，请执行以下命令：\n\n```\n $ make\n$ su -\nPassword:\n\
  # mount /boot\n# cd /usr/src/linux-2.6.20.1\n# make install && make modules_install\n\
  ```\n\n上述命令的成功完成预示着需要配置引导程序并最终启动新的 `2.6.20.1` 内核。假设你正在使用 `GRUB` 引导程序且根分区挂载点为 `/dev/hda2`，请使用你喜欢的编辑器向\
  \ `/boot/grub/grub.conf` 文件添加以下几行：\n\n```\n title  linux-2.6.20.1\nroot (hd0,0)\n\
  kernel /boot/vmlinuz-2.6.20.1 root=/dev/hda2\n```\n\n现在，重启！\n\n```\n # shutdown\
  \ -r now\n```\n\n# 安装 iptables 用户态二进制文件\n\n在安装并进入已编译了 Netfilter 钩子的内核后，我们现在安装最新版本的\
  \ `iptables` 用户态程序。为此，首先在 `/usr/local/src` 目录下下载并解压最新的 `iptables` 源码，然后对照 [`www.netfilter.org`](http://www.netfilter.org)\
  \ 发布的值检查 MD5 和：\n\n```\n $ cd /usr/local/src/\n$ wget http://www.netfilter.org/projects/iptables/files/iptables-1.3.7.tar.bz2\n\
  $ md5sum 1.3.7.tar.bz2\ndd965bdacbb86ce2a6498829fddda6b7  iptables-1.3.7.tar.bz2\n\
  $ tar xfj iptables-1.3.7.tar.bz2\n$ cd iptables-1.3.7\n```\n\n关于 `iptables` 二进制文件的编译和安装步骤，请记住我们在\
  \ `/usr/src/linux-2.6.20.1` 目录下编译了内核；编译 `iptables` 需要访问内核源码，因为它针对内核源码树中如 `include/linux/netfilter_ipv4`\
  \ 等目录下的 C 头文件进行编译。我们将使用 `/usr/src/linux-2.6.20.1` 目录在命令行上定义 `KERNEL_DIR` 变量，`BINDIR`\
  \ 和 `LIBDIR` 变量允许我们控制 `iptables` 二进制文件和库的安装路径。你可以按照以下方式编译并安装 `iptables`：\n\n```\n\
  \ $ make KERNEL_DIR=/usr/src/linux-2.6.20.1 BINDIR=/sbin LIBDIR=/lib\n$ su -\nPassword:\n\
  # cd /usr/local/src/iptables-1.3.7\n# make install KERNEL_DIR=/usr/src/linux-2.6.20.1\
  \ BINDIR=/sbin LIBDIR=/lib\n```\n\n为了最终证明我们已安装 `iptables` 它可以与运行的 `2.6.20.1` 内核交互，我们将发布命令显示\
  \ `iptables` 版本号，然后指示它列出 `INPUT`、`OUTPUT` 和 `FORWARD` 链中的当前规则集（此时这些链不包含任何活动规则）：\n\
  \n```\n # which iptables\n/sbin/iptables\n# iptables -V\niptables v1.3.7\n# iptables\
  \ -nL\nChain INPUT (policy ACCEPT)\ntarget     prot opt source               destination\n\
  \nChain FORWARD (policy ACCEPT)\ntarget     prot opt source               destination\n\
  \nChain OUTPUT (policy ACCEPT)\ntarget     prot opt source               destination\n\
  ```\n\n### 注意\n\n大多数 Linux 发行版已经安装了 `iptables`，因此你可能不需要经过上面的安装过程。然而，为了确保你的系统已经为本书中的讨论做好了准备工作，安装最新版本的\
  \ `iptables` 可能是一个好主意。正如你将在 第 9 章 中看到的。\n\n\n\n\n\n- 最后，防火墙应配置为默认`log and drop stance`（记录并丢弃策略），这样任何未显式允许通过的随机数据包、端口扫描或其他连接尝试都将被记录并丢弃。\n\
  \n### 注意\n\n我们假设防火墙上的外部 IP 地址由 ISP 静态分配，但动态分配的 IP 地址同样有效，因为我们是在防火墙上通过接口名称而非 IP 地址来限制外部网络的数据包。\n\
  \n为了简化构建 `iptables` 策略的任务，假设有一个单一的内部网络，其不可路由网络地址为 `192.168.10.0`，C 类子网掩码为 `255.255.255.0`（或\
  \ CIDR 表示法中的 `/24`）。\n\n防火墙上的内部网络接口（参见图 1-2）为 `eth1`，IP 地址为 `192.168.10.1`，所有内部主机都将此地址作为默认网关。这允许内部系统将所有发往非\
  \ `192.168.10.0/24` 子网系统的数据包通过防火墙路由。防火墙上的外部接口为 `eth0`，为了保持网络无关性，我们为此接口指定了外部 IP 地址\
  \ `71.157.*X.*XX`。\n\n![默认网络图](img/httpatomoreillycomsourcenostarchimages207402.png)\n\
  \n图 1-2. 默认网络图\n\n图中表示了两个恶意系统：一个在内网上（`192.168.10.200`，主机名 `int_scanner`），另一个在外部网络上（`144.202.*X.*.*X`，主机名\
  \ `ext_scanner`）。此处包含了图 1-2）中的网络图作为参考，我们在随后的章节中也会引用它。另有说明，书中的所有流量示例都引用了图 1-2 中的网络图，你会在执行命令的\
  \ shell 提示符中使用图中的主机名，以便明确是哪个系统在生成或接收流量。\n\n## iptables.sh 脚本序言\n\n在开始 `iptables.sh`\
  \ 脚本时，定义三个变量非常有帮助：`IPTABLES` 和 `MODPROBE`（用于 `iptables` 和 `modprobe` 二进制文件的路径）以及\
  \ `INT_NET`（用于内部子网地址和掩码），将贯穿整个脚本（见下文 ❶）。在 ❷ 处，任何现有的 `iptables` 规则将从运行内核中删除，过滤策略将\
  \ `INPUT`、`OUTPUT` 和 `FORWARD` 链设置为 `DROP`。此外，使用 `modprobe` 命令加载连接跟踪模块。\n\n```\n\
  \ [iptablesfw]# cat iptables.sh\n#!/bin/sh\n❶ IPTABLES=/sbin/iptables\nMODPROBE=/sbin/modprobe\n\
  INT_NET=192.168.10.0/24\n\n### 清空现有规则并将链策略设置为 DROP\necho \"[+] Flushing existing\
  \ iptables rules...\"\n❷ $IPTABLES -F\n$IPTABLES -F -t nat\n$IPTABLES -X\n$IPTABLES\
  \ -P INPUT DROP\n$IPTABLES -P OUTPUT DROP\n$IPTABLES -P FORWARD DROP\n### 加载连接跟踪模块\n\
  $MODPROBE ip_conntrack\n$MODPROBE iptable_nat\n$MODPROBE ip_conntrack_ftp\n$MODPROBE\
  \ ip_nat_ftp\n```\n\n## INPUT 链\n\n`INPUT` 链是 `iptables` 的构造，用于控制目标为本地系统的数据包（即在内核路由计算确定数据包目标为本地\
  \ IP 地址后）是否可以访问本地套字。如果 `INPUT` 链中的第一条规则指示 `iptables` 丢弃所有包（或 `INPUT` 链的策略设置为 `DROP`），则通过任何\
  \ IP 通信（如 TCP、UDP 或 ICMP）直接与系统通信的所有尝试将失败。`地址解析协议 (ARP)` 也是一类在以太网网上无处不在的重要流量。然而，由于\
  \ ARP 工作在数据链路层而非网络层，`iptables` 无法过滤此类流量，因为它只过滤 IP 流量及上层协议。\n\n因此，无论 `iptables` 策略如何，ARP\
  \ 请求和响应都会发送接收。（可以使用 `arptables` 过滤 ARP 流量，但该主题的讨论超出了本书的范围，因为我们通常关注网络层及以上层。）\n\n\
  ### 注意\n\n`iptables` 可以根据数据链路 MAC 地址过滤 IP 数据包，但前提是内核在编译时启用了 MAC 地址扩展。在 2.4 内核系列中，必须手动启用\
  \ MAC 地址扩展，而 2.6 内核系列默认启用。\n\n继续开发 `iptables` shell 脚本，在序言之后，我们使用以下命令设置 `INPUT`\
  \ 链。\n\n```\n ###### INPUT 链 ######\necho \"[+] Setting up INPUT chain...\"\n###\
  \ 状态跟踪规则\n❸ $IPTABLES -A INPUT -m state --state INVALID -j LOG --log-prefix \"DROP\
  \ \"\n-- 日志选项\n-- tcp 选项\n$IPTABLES -A INPUT -m state INVALID -j DROP\n$IPTABLES\
  \ -A INPUT -m state ESTABLISHED,RELATED -j ACCEPT\n\n### 反伪装规则\n❹ $IPTABLES -A INPUT\
  \ -i eth1 -s !INT_NET -j LOG --log-prefix \"SPOED PKT \"\n$IPTABLES -A INPUT -i\
  \ eth1 -s !INT_NET -j DROP\n\n### ACCEPT 规则\n❺ $IPTABLES -A INPUT -i eth1 -p tcp\
  \ -s $INT_NET --dport 22 --syn -m state NEW -j ACCEPT\n$IPTABLES -A INPUT -p icmp\
  \ --icmp-type echo-request -j ACCEPT\n\n### 默认 INPUT 日志规则\n❻ $IPTABLES -A INPUT\
  \ -i lo -j LOG --log-prefix \"DROP \"\n```\n\n记得我们的防火墙策略要求 iptables 跟踪连接；不匹配有效状态的数据包应被记录并丢弃。这是通过从\
  \ ❸ 开始的三条 `iptables` 命令实现的；你将在 `OUTPUT` 和 `FORWARD` 链中看到类似的三条命令。这些规则都使用了状态匹配，并结合了\
  \ `INVALID`、`ESTABLISHED` 或 `RELATED` 则。`INVALID` 状态适用于无法被识别为属于任何现有连接的数据包——例如，一个凭空出现的\
  \ TCP FIN 包（即它不属于任何 TCP 会话）将匹配 `INVALID` 状态。只有在 Netfilter 连接跟踪系统看到双向数据包后，`ESTABLISHED`\
  \ 状态才会触发（例如在正在交换数据的 TCP 连接中的确认包）。`RELATED` 状态描述了在 Netfilter 连接跟踪系统中启动新连接的数据包，但该连接与现有连接相关——例如，在数据包发送到没有服务器的\
  \ UDP 套接字后返回的 ICMP 端口不可达消息。\n\n\n\n\n\n最后 ❻ 处是默认的 `LOG` 规则。回想脚本开头，未被 `INPUT` 链中某些规则接受的数据包将由分配给该链的\
  \ `DROP` 策略丢弃；这同样适用于 `OUTPUT` 和 `FORWARD` 链。如你所见，`INPUT` 链的配置非常简单，因为我们只需要接受来自内部网络的\
  \ `SSH` 守护进程的入站连接请求，对本地生成的网络流量启用状态跟踪，最后记录并丢弃不必要的数据包（包括来自内网的伪造数据包）。类似的配置也适用于 `OUTPUT`\
  \ 和 `FORWARD` 链，如下文所示。\n\n## OUTPUT 链\n\n`OUTPUT` 链允许 `iptables` 对由本地系统生成的网络数据包应用内核级控制。例如，如果本地用户向外部系统发起了\
  \ `SSH` 会话，可以使用 `OUTPUT` 链来允许或拒绝传出的 `SYN` 数据包。\n\n`iptables.sh` 脚本中构建 `OUTPUT` 链规则集的命令显示在下方：\n\
  \n```\n ###### OUTPUT chain ######\necho \"[+] Setting up OUTPUT chain...\"\n###\
  \ state tracking rules\n$IPTABLES -A OUTPUT -m state --state INVALID -j LOG --log-prefix\
  \ \"DROP  INVALID \"\n--log-ip-options --log-tcp-options\n$IPTABLES -A OUTPUT -m\
  \ state --state INVALID -j DROP\n$IPTABLES -A OUTPUT -m state --state ESTABLISHED,RELATED\
  \ -j ACCEPT\n\n### ACCEPT rules for allowing connections out\n❼ $IPTABLES -A OUTPUT\
  \ -p tcp --dport 21 --syn -m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p\
  \ tcp --dport 22 --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p tcp\
  \ --dport 25 --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p tcp --dport\
  \ 43 --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p tcp --dport 80\
  \ --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p tcp --dport 443\
  \ --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p tcp --dport 4321\
  \ --syn - m state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p udp --dport 53 -m\
  \ state --state NEW -j ACCEPT\n$IPTABLES -A OUTPUT -p icmp --icmp-type echo-request\
  \ -j ACCEPT\n\n### default OUTPUT LOG rule\n$IPTABLES -A OUTPUT -o ! lo -j LOG --log-prefix\
  \ \"DROP \" --log-ip-options\n--log-tcp-options\n```\n\n根据我们的策略要求，在 ❼ 处我们将假设从防火墙本身发起的连接将通过\
  \ `FTP`、`HTTP` 或 `HTTPS` 下载补丁或软件；发起外部 `SSH` 和 `SMTP` 连接；或对其他系统发出 `DNS` 或 `whois`\
  \ 查询。\n\n## FORWARD 链\n\n到目前为止，我们添加到 `iptables` 过滤策略中的规则严格限制了数据包与防火墙系统直接交互的能力。此类数据包要么指向防火墙操作系统，要么源自防火墙操作系统，包括来自内部系统的\
  \ `SSH` 守护进程连接请求，或本地发起的向外部站点下载安全补丁的连接。\n\n现在让我们来看 `iptables` 规则，这些规则涉及那些未与防火墙关联源地址或目的地址，但仍尝试通过防火墙系统路由的数据包。`filter`\
  \ 表中的 `iptables` `FORWARD` 链提供了对跨越防火墙接口转发的数据包封装访问控制的能力：\n\n```\n ###### FORWARD\
  \ chain ######\necho \"[+] Setting up FORWARD chain...\"\n### state tracking rules\n\
  $IPTABLES -A FORWARD -m state --state INVALID -j LOG --log-prefix \"DROP INVALID\
  \ \"\n--log-ip-options --log-tcp-options\n$IPTABLES -A FORWARD -m state --state\
  \ INVALID -j DROP\n$IPTABLES -A FORWARD -m state --state ESTABLISHED,RELATED -j\
  \ ACCEPT\n\n### anti-spoofing rules\n$IPTABLES -A FORWARD -i eth1 -s ! $INT_NET\
  \ -j LOG --log-prefix \"SPOOFED PKT \"\n$IPTABLES -A FORWARD -i eth1 -s ! $INT_NET\
  \ -j DROP\n\n### ACCEPT rules\n❽ $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET\
  \ --dport 21 --syn - m state  --state\nNEW -j ACCEPT\n$IPTABLES -A FORWARD -p tcp\
  \ -i eth1 -s $INT_NET --dport 22 --syn - m state  --state NEW\n-j ACCEPT\n$IPTABLES\
  \ -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 25 --syn - m state  --state NEW\n\
  -j ACCEPT\n$IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 43 --syn - m\
  \ state  --state NEW\n-j ACCEPT\n$IPTABLES -A FORWARD -p tcp --dport 80 --syn -\
  \ m state --state NEW -j ACCEPT\n$IPTABLES -A FORWARD -p tcp --dport 443 --syn -\
  \ m state --state NEW -j ACCEPT\n$IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET\
  \ --dport 4321 --syn - m state  --state\nNEW -j ACCEPT\n$IPTABLES -A FORWARD -p\
  \ udp --dport 53 -m state --state NEW -j ACCEPT\n$IPTABLES -A FORWARD -p icmp --icmp-type\
  \ echo-request -j ACCEPT\n\n### default OUTPUT LOG rule\n$IPTABLES -A FORWARD -o\
  \ ! lo -j LOG --log-prefix \"DROP \" --log-ip-options\n--log-tcp-options\n```\n\n\
  ## 网络地址转换\n\n构建 `iptables` 策略的最后一步是将不可路由的 `192.168.10.0/24` 地址转换为可路由的外部地址。这适用于入站连接以及从内部系统发起的出站连接。对于从内部系统发起的连接，我们将使用源\
  \ NAT (`SNAT`) 目标；对于从外部系统发起的连接，我们将使用目的 NAT (`DNAT`) 目标。`iptables` `nat` 表用于所有的 NAT\
  \ 规则，表中有两个链：`PREROUTING` 和 `POSTROUTING`。`PREROUTING` 链用于对尚未通过内核路由算法的数据包应用 `nat`\
  \ 表中的规则。在此链中处理的数据包尚未与 `filter` 表中的 `INPUT` 或 `FORWARD` 链进行比较。\n\n`POSTROUTING` 链负责在数据包通过内核路由算法并要在计算出的接口上传输之前对其进行处理。通过此链处理的数据包已经通过了\
  \ `filter` 表中 `OUTPUT` 或 `FORWARD` 链的要求（以及其他可能注册的表的要求，例如 `mangle` 表）。\n\n### 注意\n\
  \n关于 `iptables` 如何实现 NAT 的完整解释，请参见 [`www.netfilter.org/documentation/howto/nat-howto.html`](http://www.netfilter.org/documentation/howto/nat-howto.html)。\n\
  \n```\n ###### NAT rules ######\necho \"[+] Setting up NAT rules...\"\n❾ $IPTABLES\
  \ -t nat -A PREROUTING -p tcp --dport 80 -i eth0 -j DNAT\n--to 192.168.10.3:80\n\
  $IPTABLES -t nat -A PREROUTING -p tcp --dport 443 -i eth0 -j DNAT\n--to 192.168.10.3:443\n\
  $IPTABLES -t nat -A PREROUTING -p tcp --dport 53 -i eth0 -j DNAT  --to 192.168.10.4:53\n\
  ❿ $IPTABLES -t nat -A POSTROUTING -s $INT_NET -o eth0 -j MASQUERADE\n```\n\n\n\n\
  \n参考图 1-2 中的网络图，内部网络 Web 服务器和 DNS 服务器的 IP 地址分别为 192.168.10.3 和 192.168.10.4。提供 NAT\
  \ 功能所需的 `iptables` 命令如所示（注意通过 `-t` 选项将命令限制在 `nat` 表中）。位于 ❾ 处的三个 `PREROUTING` 规则允许来自外部网络的\
  \ Web 服务和 DNS 请求发送到相应的内部服务器。位于 ❿ 处的最后一个 `POSTROUTING` 规则允许源自内部不可网络且目标为外部互联网的连接看起来像是来自\
  \ IP 地址 71.157.*X.*X*。\n\n构建 `iptables` 策略的最后最后一步是在 Linux 内核中启用 IP 转发功能：\n\n```bash\n\
  ###### forwarding ######\necho \"[+] Enabling IP forwarding...\"\necho 1 > /proc/sys/net/ipv4/ip_forward\n\
  ```\n\n## 激活策略\n\n`iptables` 非常好的点之一是，通过执行 `iptables` 命令在内核中实例化策略是非常轻而易见的——没有沉重的用户界面、二进制文件格式或臃肿的管理协议（例如某些其他安全产品专用供应商开发的协议）。现在我们已经有了一个捕获\
  \ `iptables` 命令的 脚本（再次，你可以从 [`www.dydyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)\
  \ 下载完整的脚本），让我们来执行它：\n\n```bash\n[iptablesfw]# ./iptables.sh\n[+] Flushing existing\
  \ iptables rules...\n[+] Setting up INPUT chain...\n[+] Setting up OUTPUT chain...\n\
  [+] Setting up FORWARD chain...\n[+] Setting up NAT rules...\n[+] Enabling IP forwarding...\n\
  ```\n\n## iptables-save 和 iptables-restore\n\n`iptables.sh` 脚本中之前所有的 `iptables`\
  \ 命令都是按顺序逐执行，以实例化新规则、设置链的默认策略或删除旧规则。每个命令都需要单独执行 `iptables` 用户态二进制文件来创建 `iptables`\
  \ 策略。因此，对于在系统启动时快速创建策略来说，这并不是最优解决方案，特别是当 `iptables` 规则数量增加到数百个时（这在使用 `fwsnort` 构建的策略时发生，正如我们在第\
  \ 10 章所示）。`iptables-save` 和 `iptables-restore` 命令提供了一种快得多的机制，它们与主 `iptables` 程序安装在同一个目录下（在本例中为\
  \ `/sbin`）。`iptables-save` 命令创建一个包含运行策略中所有 `iptables` 规则的可读格式文件。这种格式可以被 `iptables-restore`\
  \ 程序解释，该程序获取 `ipt.save` 文件中列出的每条规则并在运行内核中将其实例化。只需执行一次 `iptables-restore` 程序即可在内核中重建整个\
  \ `iptables` 策略；不需要多次执行 `iptables` 程序。这使得 `iptables-save` 和 `iptables-restore` 命令成为快速部署\
  \ `iptables` 规则集的理想选择，我通过以下两个命令来说明这一过程：\n\n```bash\n[iptablesfw]# iptables-save\
  \ > /root/ipt.save\n[iptablewfw]# cat /root/ipt.save | iptables-restore\n```\n\n\
  `ipt.save` 文件的内容按 `iptables` 表组织，在每个针对单个表的节内，`ipt.save` 进一步按 `iptables` 链组织。以星号（`*`）字符开头跟随表名（例如\
  \ `filter`）的行表示 `ipt.save` 文件中描述特定表的节的开始。其后是跟踪与该表相关的每个链的数据包和字节计数的行。\n\n`ipt.save`\
  \ 文件的下一个部分是按链组织的所有 `iptables` 规则的完整描述。这些行允许 `iptables-restore` 重建实际的 `iptables`\
  \ 规则集；如果 `iptables-save` 的 `-c` 选项，甚至包含了每条规则的数据包和字节计数。\n\n最后，单独占一行的 `COMMIT` 结束了\
  \ `ipt.save` 文件中表征 `iptables` 表的节。此行构成了与表相关的所有信息的结束标记。以下是在我们执行了本章目前为止的所有 `iptables`\
  \ 命令后，`filter` 表节的完整示例：\n\n```text\n # Generated by iptables-save v1.3.7 on Sat\
  \ Apr 14 17:35:22 2007\n*filter\n:INPUT DROP [0:0]\n:FORWARD DROP [0:0]\n:OUTPUT\
  \ DROP [2:112]\n-A INPUT -m state --state INVALID -j LOG --log-prefix \"DROP INVALID\
  \ \"\n--log-tcp-options --log-ip-options\n-A INPUT -m state --state INVALID -j DROP\n\
  -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT\n-A INPUT -s ! 192.168.10.0/255.255.255.0\
  \ -i eth1 -j LOG --log-prefix \"SPOOFED PKT \"\n-A INPUT -s ! 192.168.10.0/255.255.255.0\
  \ -i eth1 -j LOG --log-prefix \"SPOOFED PKT \"\n-A INPUT -m state --state INVALID\
  \ -j DROP\n-A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT\n-A INPUT -s\
  \ ! 192.168.10.0/255.255.255.0 -i eth1 -j DROP --log-prefix \"DROPT \"\n-A INPUT\
  \ -m state --state RELATED,ESTABLISHED -j ACCEPT\n-A INPUT -s ! 192.168.10.0/255.255.255.0\
  \ -i eth1 -j LOG --log-prefix \"SPOOFED PKT \"\n...\nCOMMIT\n```\n\n\n\n此时，我们已经有了一个功能性的\
  \ `iptables` 策略，它可以对试图通过防火墙接口的数据包保持高水平的控制，而且我们方便的方法可以通过对 `ipt.save` 文件执行 `iptables-restore`\
  \ 命令来快速重新实例化该策略。这在加速系统启动周期方面具有明显的应用，但对于测试新策略同样有用，因为可以极易地恢复到已知的良好状态。然而还缺少了一点：修改 `iptables`\
  \ 策略最简单的方法是编辑脚本，而不是直接编辑 `ipt.save` 文件（该文件对语法有严格要求，这种要求并不像 Bourne shell 脚本那样广为人知）。\n\
  \n## 测试策略：TCP\n\n一旦在 Linux 内核中创建了 `iptables` 策略并验证了通过防火墙的基本连通性，对策略进行测试是一个很好的主意，以确保虚拟装甲没有漏洞。最重要的是从本地网络外部的主机测试\
  \ `iptables` 策略，因为这是大多数攻击的来源（假设有大量用户不在内部系统中）。然而，从内部网络进行有效测试同样重要，因为其中一个内部主机可能会被攻破并用于攻击其他内部主机（包括防火墙），即使\
  \ `iptables` 保护着整个网络。客户端漏洞（如微软 JPEG 漏洞）使得如果内部网络存在未打补丁的系统，这种情况就会成为可能。\n\n要开始测试策略，我们首先测试从内部或外部网络都不应允许的\
  \ TCP 端口。回想 RFC 793 要求实现良好的 TCP 栈在关闭端口上接收到 SYN 数据包时生成重置（`RST/ACK`）包。这为我们提供了一个验证\
  \ `iptables` 确实拦截数据包的简单方法，因为如果响应连接尝试时没有 `RST/ACK` 包，说明 `iptables` 在内核中拦截了 SYN 数据包，并且没有允许\
  \ TCP 栈向客户端生成 `RST/ACK`。我们随机选择 TCP 端口 `5500` 从内部和外部主机进行测试。接下来的示例说明了这项测试并显示 `iptables`\
  \ 的 `INPUT` 链确实正常工作，因为不仅数据包被丢弃了，而且生成了相应的日志消息。首先我们从 `ext_scanner` 系统使用 `Netcat` 尝试连接防火墙上的\
  \ TCP 端口 `5500`。如预期所示，`Netcat` 客户端只是挂起，而在防火墙本身上生成了一条日志消息，表明 `iptables` 拦截并丢弃了一个指向端口\
  \ 5500 的 TCP SYN 数据包：\n\n```\n [ext_scanner]$ nc -v 71.157.X.X 5500\n[iptablesfw]#\
  \ tail /var/log/messages |grep 5500\nApr 14 16:52:43 iptablesfw kernel: DROP IN=eth0\
  \ OUT= MAC=00:13:d3:38:b6:e4:00:30:48:\n80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\
  \ LEN=60 TOS=0x00 PREC=0x00 TTL=64\nID=54983 DF PROTO=TCP SPT=59604 DPT=5500 WINDOW=5840\
  \ RES=0x00 SYN URGP=0 OPT\n(020405B40402080A1E9241460000000001030306)\n```\n\n###\
  \ 注意\n\n上面的 `iptables` 日志消息是书中的第一个，你可能会发现理解它很困难。我将在第 2 章和第 3 章中详细介绍 `iptables` 日志消息（并旨在识别可疑流量）。\n\
  \n同样，我们从内部网络得到了相同的结果：\n\n```\n [int_scanner]$ nc -v 192.168.10.1 5500\n[iptablesfw]#\
  \ tail /var/log/messages |grep 5500 |tail -n 1\nApr 14 16:55:53 iptablesfw kernel:\
  \ DROP IN=eth1 OUT= MAC=00:13:46:3a:41:4b:00:a0:cc:\n28:42:5a:08:00 SRC=192.168.10.200\
  \ DST=192.168.10.1 LEN=60 TOS=0x10 PREC=0x00 TTL=64\nID=4858 DF PROTO=TCP SPT=58715\
  \ DPT=5500 WINDOW=5840 RES=0x00 SYN URGP=0 OPT\n(020405B40402080A0039F4D30000000001030305)\n\
  ```\n\n如果我们收到了 `RST/ACK` 包，将意味着 `iptables` 没有拦截流量。\n\n\n\n\n最后，我们将测试 ICMP 的 iptables\
  \ 策略。在构建策略时使用的 iptables 命令使用了 `--icmp-type` 选项，将接受的 ICMP 数据包限制为仅 Echo Request（回显请求）包（连接跟踪代码允许发送相应的\
  \ Echo Reply（回显响应）包，因此不需要添加显式的 `ACCEPT` 规则来允许此类应答）。因此，iptables 应该允许所有的 Echo Request\
  \ 包，但其他 ICMP 数据包将遭遇完全的沉默。我们通过在不发送任何相应 Echo Request 包 的情况下生成 ICMP Echo Reply 包来测试这一点，这将导致\
  \ iptables 在 `INPUT` 链开头的 `INVALID` 状态规则上匹配包。再次，我们转向 hping，从内部和外部网络进行测试。第一个测试是从外部网络生成一个不受请求的\
  \ ICMP Echo Reply 包，我们预计 iptables 将在 `INPUT` 链中记录并丢弃该包。通过检查 iptables 日志，我们看到确实如此（**DROP\
  \ INVALID** 日志前缀为加粗显示）：\n\n```\n [ext_scanner]# hping −1 --icmptype echo-reply 71.157.X.X\n\
  HPING (eth1 71.157.X.X): icmp mode set, 28 headers + 0 data bytes\n--- 71.157.X.X\
  \ hping statistic ---\n2 packets transmitted, 0 packets received, 100% packet loss\n\
  round-trip min/avg/max = 0.0/0.0/0.0 ms\n[iptablesfw]# tail /var/log/messages |grep\
  \ ICMP\nApr 14 17:04:58 iptablesfw kernel: DROP INVALID IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00\
  \ SRC=144.202.X.X DST=71.157.X.X\nLEN=28 TOS=0x00 PREC=0x00 TTL=64 ID=44271 PROTO=ICMP\
  \ TYPE=0 CODE=0 ID=21551\nSEQ=0\n```\n\n同样，从内部网络也获得了相同的结果：\n\n```\n [int_scanner]#\
  \ hping −1 --icmptype echo-reply 192.168.10.1\nHPING (eth1 192.168.10.1): icmp mode\
  \ set, 28 headers + 0 data bytes\n--- 192.168.10.1 hping statistic ---\n2 packets\
  \ transmitted, 0 packets received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0\
  \ ms\n[iptablesfw]# tail /var/log/messages |grep ICMP |tail -n 1\nApr 14 17:06:45\
  \ iptablesfw kernel: DROP INVALID IN=eth1 OUT=\nMAC=00:13:46:3a:41:4b:00:a0:cc:28:42:5a:08:00\
  \ SRC=192.168.10.200\nDST=192.168.10.1 LEN=28 TOS=0x00 PREC=0x00 TTL=64 ID=36520\
  \ PROTO=ICMP TYPE=0\nCODE=0 ID=44313 SEQ=0\n```\n\n***\n\n所有不可路由地址的集定义在 `RFC 1918`\
  \ 中。按照惯，此类地址在开放的网上是不可路由的。\n\n这里的 *connection* 是 Netfilter 用于对数据包进行分类的跟踪机制。\n\n关于\
  \ `iptables.sh` 脚本需要注意的一点是，所有的 `LOG` 规则都是使用 `--log-ip-options` 和 `--log-tcp-options`\
  \ 参数构建的。使得生成的 iptables syslog 日志在匹配 `LOG` 规则的数据包包含这些选项时，能够包含 IP 和 TCP 头部中的 IP 和\
  \ TCP 选项部分。此功能对于攻击检测以及 `psad` 执行的被动操作系统指纹识别操作都很重要。\n\n关于 RST 包是否设置了 ACK 位的细节将在第\
  \ 3 章中详细讨论。\n\n# 结语\n\n本章重点关注对书中后续内容重要的 iptables 概念，并为从 iptables 角度开始讨论入侵检测和响应奠定了基础。我们现在拥有了默认的\
  \ iptables 策略和后续章节中引用的网络拓图，并且已经看到了 iptables 日志消息示例，说明了 iptables 日志格式的完整性。我们现在准备好进入我们可以用\
  \ iptables 检测并——正如我们将看到的——还可以阻止的攻击处理中。\n\n# 第 2 章 网络层攻击与防御\n\n网络层——OSI 参考模型中的第三层——是互联网上端到端路由和数据包传输的主要机制。本书主要关注通过\
  \ IPv4 网络协议传输的攻击，尽管也存在许多其他网络协议，例如 IPX、X.25 以及潜在的 IPv6 协议。\n\n在本章中，我们将首先关注 iptables\
  \ 如何在日志消息输出中记录网络层数据包头部。然后我们将看到如何利用这些日志进行捕获。\n\n## 使用 iptables 记录网络层头部\n\n通过 `LOG`\
  \ 目标，iptables 有能力为 IPv4 头的几乎每个字段写入 syslog。\n\n### 记录 IP 头部\n\nIP 头部由 `RFC 791` 定义，阴框表示\
  \ iptables 在其日志中包含的头部字段。例如，总长度字段带有 `LEN=` 前缀，存活时间（TTL）字段带有 `TTL=` 前缀。\n\n深灰色框始终被\
  \ iptables 记录。白色框表示未记录的头部字段。中灰色框用于 IP 头的选项部分。该框显示为中灰色是因为只有在向 iptables 策略中添加 `LOG`\
  \ 规则时使用了 `--log-ip-options` 命令行参数，iptables 才会记录 IP 选项。\n\n这是一个从 `ext_scanner` 系统向\
  \ `iptablesfw` 系统发送 ICMP Echo Request 生成的 iptables 日志示例：\n\n``` [ext_scanner]$ ping\
  \ -c 1 71.157.X.X\nPING 71.157.X.X (71.157.X.X) 56(84) bytes of data.\n64 bytes\
  \ from 71.157.X.X: icmp_seq=1 ttl=64 time=0.171 ms\n\n--- 71.157.X.X ping statistics\
  \ ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\nrtt min/avg/max/mdev\
  \ = 0.171/0.171/0.171/0.000 ms\n[iptablesfw]# tail /var/log/messages | grep ICMP\
  \ | tail -n 1\nJul 22 15:01:25 iptablesfw kernel: IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00\
  \ SRC=144.202.X.X DST=71.157.X.\nX LEN=84 TOS=0x00 PREC=0x00 TTL=64 ID=0 DF PROTO=ICMP\
  \ TYPE=8 CODE=0 ID=\n44366 SEQ=1\n```\n\n\n\n上述日志消息中的 IP 头部从源 IP 地址（扩展为标准的点点表示法）开始。额外的\
  \ IP 头部字段如目的 IP 地址、`TTL` 值和协议字段以**粗体**显示。服务类型字段（`TOS`）以及 `precedence`（优先级）和相应的 `type`（类型）位作为单独十六进制值包含在\
  \ `TOS` 和 `PREC` 字段中。此时，`Flags`头部字段以字符串 `DF` 或 `Don't Fragment`（不分片）的形式包含，这表示不允许\
  \ IP 网关将数据包拆分为更小的块。最后，`PROTO` 字段是 IP 头部封装的协议——在本情况下为 ICMP。上述日志消息中的剩余字段包括 `ping`\
  \ 命令发送的 ICMP 回显请求包中的 ICMP `TYPE`、`CODE`、`ID` 和 `SEQ` 值，它们不属于 IP 头部的一部分。\n\n### 记录\
  \ IP 选项\n\nIP 选项为 IP 通信提供了各种控制功能，这些功能包括时间戳、某些安全能力以及特殊路由功能的规定。IP 选项具有可变长度，在互联网上的使用频率较低。如果没有\
  \ IP 选项，IP 数据包头部始终正好为 20 字节。要让 `iptables` 记录 IP 部的选项部分，请使用以下命令（注意**粗体**的 `--log-ip-options`\
  \ 关）：\n\n```\n[iptablesfw]# iptables -A INPUT -j LOG --log-ip-options\n```\n\n由\
  \ `iptables.sh` 脚本构建的策略中的默认 `LOG` 规则均使用 `--log-ip-options` 命令行参数，因为 IP 选项可能包含影响安全的信息。\n\
  \n为了说明包含 IP 选项的 `iptables` 日志消息，我们再次 ping `iptablesfw` 系统，但这次我们指示 `ping` 命令将 `timestamp`\
  \ 选项设置为 `tsonly`（仅时间戳）：\n\n```\n[ext_scanner]$  ping -c 1 -T tsonly 71.157.X.X\n\
  PING 71.157.X.X (71.157.X.X) 56(124) bytes of data.\n64 bytes from 71.157.X.X icmp_seq=1\
  \ ttl=64 time=0.211 ms\nTS:     68579524 absolute\n        578\n        0\n    \
  \    −578\n--- 71.157.X.X ping statistics ---\n1 packets transmitted, 1 received,\
  \ 0% packet loss, time 0ms\nrtt min/avg/max/mdev = 0.211/0.211/0.211/0.000 ms\n\
  [iptablesfw]# tail /var/log/messages | grep ICMP\nJul 22 15:03:00 iptablesfw kernel:\
  \ IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\n\
  LEN=124 TOS=0x00 PREC=0x00 TTL=64 ID=0 DF OPT (44280D00041670C404167306000000\n\
  00000000000000000000000000000000000000000000000000) PROTO=ICMP TYPE=8 CODE=0\nID=57678\
  \ SEQ=1\n```\n\n上方的粗体部分，字符串 `OPT` 后面跟着一长串十六进制字节。这些字节是 IP 头部中包含的完整 IP 选项，但 `iptables`\
  \ `LOG` 目标并没有为我们解码它们；我们将使用 `psad` 来理解它们的含义。\n\n### 记录 ICMP\n\n`iptables` `LOG` 目标有专门用于记录\
  \ ICMP 代码，由于 ICMP 存在于网络层，我们接下来介绍它。ICMP（由 RFC 792 定义）有一个仅 32 位的简单头部。图 2-2 显示了 ICMP\
  \ 头部。该头部由三个字段组成：`type`（8 位）、`code`（8 位）和 `checksum`（16 位）；剩余字段是 ICMP 数据包的数据部分。\n\
  \n数据部分中的特定字段取决于 ICMP 的类型和代码值。例如，与 ICMP 回显请求（type 8，code 0）相关的字段包括 `ID` 和序列值。\n\n\
  ! ICMP 头部和对应的 iptables 日志消息字段\n\n与 IP 头部一样，`LOG` 目标始终记录 `ICMP` `type` 和 `code` 字段，且绝不记录\
  \ ICMP `checksum` 字段。`iptables` 中没有命令行参数可以影响 `LOG` 目标表示 ICMP 数据包数据部分内字段的方式。本章第一个回显请求包中的\
  \ ICMP 字段出现在下方的最后一行开始：\n\n```\nJul 22 15:01:25 iptablesfw kernel: IN=eth0 OUT=\n\
  MAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\nLEN=124\
  \ TOS=0x00 PREC=0x00 TTL=64 ID=0 DF PROTO=ICMP\nTYPE=8 CODE=0\nID=57678 SEQ=1\n\
  ```\n\n¹ 同样适用于 IPv6 头部，但本书未涵盖 IPv6。\n\n² IP 分片偏移有一个例外——`iptables` 仅在其为非零时进行记录。\n\
  \n³ 这种转换还有其他实例，例如 TCP 标志，我们将在第 3 章介绍。\n\n⁴ 与某些人将 ICMP 归类为 TCP 和 UDP 等传输协议不同，ICMP\
  \ 被视为网络层协议。参见 W. Richard Stevens *TCP/IP Illustrated, Volume 1* 第 69 页（Addison-Wesley,\
  \ 1994）。\n\n⁵ 检查 `linux/net4/netfilter/ipt_c` 中第 249 行的 `switch` 语句说明了这一点。\n\n##\
  \ 网络层攻击定义\n\n我们将网络层攻击定义为：利用网络层头部字段，以利用终端主机网络栈实现中的漏洞、消耗网络层资源或隐藏针对高层攻击的数据包或系列数据包。\n\
  \n网络攻击分为三类：\n\n### 头部滥用\n\n包含恶意构造、损坏或伪造的网络层头部的数据包。包括伪造源地址的 IP 包和包含不合理分片偏移值的包。\n\n\
  ### 网络栈利用\n\n包含特殊构造组件的数据，旨在利用终端主机网络栈实现中的漏洞。也就是说，处理网络层信息的代码本身就是目标。一个很好的例子是发现于 Linux\
  \ 内核（2.6.9 及早期版本）的互联网组管理协议（IGMP）拒绝服务漏洞。\n\n### 带宽饱和\n\n旨在饱和目标网络所有可用带宽的数据包。通过 ICMP\
  \ 发送的分布式拒绝服务（DDoS）攻击是一个很好的例子。\n\n### 注意\n\n尽管本章重点关注滥用网络层的技术，但重要的是，许多此类技术可以与其他层的攻击结合起来。例如，应用层攻击（例如利用缓冲区溢出漏洞的攻击）可以通过分片\
  \ IP 数据包发送，以规避入侵检测系统。在这种情况下，真正的攻击利用了应用层漏洞，但使用名为`分片`的网络层技术进行交付，使得应用层攻击更难检测。\n\n\n\
  \n\nLinux 内核 IGMP 漏洞在常见漏洞与暴露（CVE）数据库中被分配编号为 `CAN-2004-1137`，该数据库是目前最有效的漏洞跟踪机制之一。更多信息请参阅\
  \ [`cve.mitre.org/cve`](http://cve.mitre.org/cve)。\n\n## 滥用网络层\n\n网络层将数据包路由到全球各地目的地的能力，提供了攻击全球范围内目标的能力。由于\
  \ IPv4 没有任何认证概念（这项工作被交给了 IPSec 协议或更高层的机制），攻击者可以很容易地构造出具有篡改头部或数据的 IP 包，并将其大量发送到网络中。虽然此类数据包在到达预期目标之前，可能会被防火墙或带有访问控制列表（`ACL`）的路由器等在线过滤设备过滤掉，但它们往往并不会过滤。\n\
  \n### Nmap ICMP 探测\n\n当使用 `Nmap` 扫描不在同一子网的系统时，它通过向目标主机的 80 端口发送 `ICMP Echo Request`\
  \ 和 `TCP ACK` 来执行主机发现。（可以使用 `Nmap` 的 `-P0` 命令行参数禁用主机发现，但它是默认开启的。）`Nmap` 生成的 `ICMP\
  \ Echo Requests` 与 `ping` 程序生成的 `Echo Requests` 不同之处在于，`Nmap Echo Requests` 不包含\
  \ `ICMP` 头之外的任何数据。因此，如果此类数据包被 `iptables` 记录，其 IP 长度字段应为 28（不带选项的 IP 头占 20 字节，加上\
  \ 8 字节的 `ICMP` 头，加上 0 字节的数据，如加粗所示）：\n\n```\n [ext_scanner]# nmap -sP 71.157.X.X\n\
  [iptablesfw]# tail /var/log/messages | grep ICMP\nJul 24 22:29:59 iptablesfw kernel:\
  \ IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\n\
  LEN=28 TOS=0x00 PREC=0x00 TTL=48 ID=1739 PROTO=ICMP TYPE=8 CODE=0 ID=15854\nSEQ=62292\n\
  ```\n\n### 注意\n\n`ping` 程序也可以通过 `-s 0` 命令行参数设置载荷大小为零，从而生成不包含应用层的数据包，但默认情况下，`ping`\
  \ 程序会包含几十字节的载荷数据。\n\n虽然在 `ICMP` 包中不包含应用层数据本身并不算滥用网络层，但如果你看到此类数据包与指示端口扫描或端口扫描等活动的数据包一起出现（参见\
  \ 第 3 章），那么可以确定有人正在使用 `Nmap` 对你的网络进行侦察。\n\n## IP 欺骗\n\n计算机安全领域中很少有术语比 `spoofing`（欺骗）引起更更多的困惑和夸大，特别是\
  \ `IP 欺骗`。`spoof` 是指骗局或恶作剧，而 `IP 欺骗` 意味着故意构造一个带有伪造源地址的 IP 包。\n\n### 注意\n\n我们在这里对\
  \ IP 包上更改源地址的网络地址转换（`NAT`）操作做出了例外（例如防火墙通常提供的、用于通过单个外部地址掩蔽内部网络的功能）。不要将其与 `IP 欺骗`\
  \ 混淆，`NAT` 是合法的网络功能，而用伪造源地址隐藏攻击则不是。\n\n在涉及 IP 通信时，数据包的源地址没有内置限制。通过使用原始套字（raw socket，一种根据特定标准构造数据包的低级编程\
  \ API），可以发送任意源地址的 IP 包。如果源地址在本地网络上下文中是没有意义的（例如，如果源地址是 Verizon 网络上的一个 IP，但数据包实际上是从\
  \ Comcast 网络发送的），则该数据包被称为被“欺骗”。管理员可以采取措施配置路由器和防火墙，使其不转发源地址在内部网络范围之外的数据包（这样欺骗包永远无法出去），但许多网络没有此类控制。在\
  \ 第 1 章 中讨论的默认 `iptables` 策略内置了反欺骗规则。\n\n从安全角度来看，关于欺骗包（以及泛指 IP 包）最重要的的一点是：无法信任源地址。事实上，有时一个完整的攻击可以通过单个欺骗包投送（参见\
  \ 第 8 章 中关于 Witty 虫的讨论）。\n\n### 注意\n\n任何带有欺骗源地址的数据包纯粹是“发出去就不不管”，因为目标对数据包的任何响应都将定向回那个伪造的欺骗地址。尽管如此，也可以从中获得慰藉：任何需要双向流量的协议（如传输层的\
  \ `TCP`）都无法在欺骗的 IP 地址上运行。\n\n许多安全软件（包括攻击性和防御性的）都包含欺骗源 IP 地址的能力。分布式拒绝服务（DDoS）工具通常认为欺骗是必要的，像\
  \ `hping` 这样的知名工具就可以欺骗源地址。使用 `hping` 等工具或使用自己的工具来构造带有欺骗源地址的数据包轻而易举。以下是一个简单的 Perl\
  \ 代码段，用于构建带有欺骗源地址的 UDP 数据报文。该脚本使用了 `Net::RawIP` 模块：\n\n```perl\n#!/usr/bin/perl\
  \ -w\n\nuse Net::RawIP;\nuse strict;\nmy $src = $ARGV[0] or &usage();\nmy $dst =\
  \ $ARGV[1] or &usage();\nmy $str = $ARGV[2] or &usage();\n\nmy $rawpkt = new Net::RawIP({\n\
  \    ip => {\n        saddr => $src,\n        daddr => $dst\n    },\n    udp =>\
  \ {\n        source => 10001,\n        dest   => 53,\n        data   => $str,\n\
  \    }\n});\n$rawpkt->send();\nprint '[+] Sent ' . length($str) . \" bytes of data...\\\
  n\";\nexit 0;\n\nsub usage() {\n    die \"usage: $0 <src> <dst> <str>\";\n}\n```\n\
  \n## IP 分片\n\n将 IP 包拆分为一系列较小数据包的能力是 IP 的基本功能。拆分 IP 包的过程被称为 `分片`（fragmentation），每当\
  \ IP 包路由到数据链路 MTU 大小小以容纳该数据包的网络时，这种过程就是必要的。任何连接不同 MTU 大小数据链路的路由器都有责任确保从一个数据链路传输到另一个数据链路的\
  \ IP 包不会超过 MTU。目标主机的 IP 栈会重组分片以创建原始包，此时数据包内部封装的协议将向上层栈传递给下一层。\n\n攻击者可以利用 IP 分片作为\
  \ IDS 规避机制，通过构造攻击并刻意将其拆分到多个 IP 分片中。任何完整实现的 IP 栈都能重组分片流量，但为了检测攻击，IDS 也必须使用与目标 IP\
  \ 栈相同的算法来重组流量。由于不同的 IP 栈实现重组算法略有不同（例如对于重复分片，Cisco IOS IP 栈根据最后一个分片策略重组流量，而 Windows\
  \ XP 栈根据第一个分片策略重组），这给 IDS 带来了挑战。生成分片流量的金标准是 Dug Song 的 `fragroute` 工具（参见 [`www.monkey.org`](http://www.monkey.org)）。\n\
  \n## 低 TTL 值\n\n\n\n\n任何 IP 路由器在每次将 IP 数据包转发到另一个系统时，都应该将 IP 报头中的 `TTL` 值减 1。如果你的本地子网内出现了\
  \ `TTL` 为 1 的数据包，那么很可能有人在使用 `traceroute` 程序（或其变体，如 `tcptraceroute`）针对一个存在于本地子网或通过本地子网路由的子网中的\
  \ IP 地址进行操作。通常这只是某人在排查网络连接性问题，但也可能是有人正在对你的网络进行侦察，以绘制通往潜在目标的跳数映射。\n\n### 注意\n\n目标为组播地址（根据\
  \ `RFC 1112` 定义的 `224.0.0.0` 到 `239.255.255.255` 范围内的所有地址）的数据包其 `TTL` 值通常设置为 1。因此，如果目标地址是组播地址，那么此类流量可能与\
  \ `traceroute` 的网络映射尝试无关，而只是合法的组播流量。\n\n`traceroute` 产生的 UDP 数据包被 `iptables` 记录如下（注意加粗的\
  \ `TTL`）：\n\n```\n Jul 24 01:10:55 iptablesfw kernel: DROP IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:13:46:c2:60:44:08:00\
  \ SRC=144.202.X.X DST=71.157.X.X\nLEN=40 TOS=0x00 PREC=0x00 TTL=1 ID=44081 PROTO=UDP\
  \ SPT=54522 DPT=33438 LEN=20\n```\n\n使用分片和目标 TTL 隐藏攻击\n\n路由路径信息对于利用分片重组技巧隐藏网络攻击非常有用。例如，假设攻击者看到主机主机前面有一个路由器（通过\
  \ `traceroute` 确定），并且攻击者怀疑一个 `IDS` 正在监控主机子网之前的子网。如果是这种情况，可以针对主机进行攻击，将攻击分分为三个 IP\
  \ 数据包（我们称其为 `f1`、`f2` 和 `f3`），但其方式要使 `IDS` 无法检测。攻击者可以通过创建第二个分片（`f2`）的副本，将其负载替换为虚假数据，并将\
  \ `TTL` 减少到一个初始值，该值恰好让数据包到达路由器时 `TTL` 为 1。我们将此数据包称为 `f2'`。接下来，攻击者发送第一个分片（`f1`），接着是这个新分片（`f2'`），然后是\
  \ `f3`，最后是原始的 `f2` 分片。因此，`IDS`（位于路由器前面）看到了所有的四个分片，但 `f3` 完成了分片集，因此 `IDS` 将它们重组为\
  \ `f1 + f2' + f3`。\n\n由于 `f2'` 包含虚假数据，因此这三个分片在 `IDS` 看来并不像攻击。同时，`f2'` 命中路由器并被丢弃，因为它的\
  \ `TTL` 值在转发之前被减到了 0，所以目标 IP 地址从未见过 `f2'`。然而，主机看到了分片 `f1` 和 `f3`，但在没有原始 `f2` 的情况下，它无法将它们重组为任何有意义的内容，因此会等待。\n\
  \n当 `f2` 最终到达时（记住攻击者是最后发送它的），目标主机在最终重组所有三个分片后遭受了真实的攻击。这项技术最早由 Vern Paxson 在《Bro:\
  \ A System for Detecting Network Intruders in Real-Time》中提出（参见 [`www.icir.org/vern/papers/bro-cn99.html`](http://www.icir.org/vern/papers/bro-cn99.html)）；它提供利用网络层向网络入侵检测系统隐藏攻击的巧妙方法。\n\
  \n### 注意\n\n本地子网上任何数据包的另一个可疑 `TTL` 值是 0。这种数据包只有在存在严重错误的路由器将数据包转发到子网，或者数据包源自同一子网上的某个系统时才可能存在。\n\
  \n## Smurf 攻击\n\nSmurf 攻击是一种老旧但优雅的技术，攻击者向网络广播地址伪造 `ICMP Echo Requests`。伪造的地址是预定目标，目标是尽可能通过响应广播地址上\
  \ `Echo Requests` 的系统向目标泛洪尽可能多的 `ICMP Echo Response` 数据包。如果网络运行时没有针对这些指向广播地址的 `ICMP\
  \ Echo Requests` 的控制（例如在 Cisco 路由器上使用 `no ip directed-broadcast` 命令），则所有接收到 `Echo\
  \ Requests` 的主机都会对伪造源地址响应。通过使用大型网络的广播地址，攻击者希望放大针对目标生成的包数量。\n\n与带有专用通道且没有简单路由器配置防御措施的\
  \ DDoS 攻击工具（下文讨论）相比，Smurf 攻击已经过时。但它仍然值得提及，因为 Smurf 攻击非常容易执行，且原始代码 easily 可用（参见 [`www.phreak.org/archives/exploits/denial/smurf.c`](http://www.phreak.org/archives/exploits/denial/smurf.c)）。\n\
  \n## DDoS 攻击\n\n（此处为原文重复的描述性文本，已按要求处理翻译逻辑）\n\n\n\n\n\n⁷ 成功的 TCP 序列预测攻击可以导致 TCP 连接断开，或从伪造的源向现有连接注入数据。\n\
  \n⁸ 以主机为中心的入侵检测方法被称为基于目标的入侵检测（target-based intrusion detection），它允许入侵检测系统（IDS）考虑目标系统的实现细节；更多信息请参见第\
  \ 8 章。\n\n⁹ 如果路由器在转发数据包之前持有的时间超过一秒，则可能会将 `TTL` 值减 2 或更多。`RFC 791` 规定路由器必须将 `TTL`\
  \ 至少减 1。\n\n## 网络层响应\n\n对网络层响应的定义达成共识与网络层攻击的定义同样有用。因为此类响应不应涉及位于传输层或更高层的信息，因此我们仅限于通过三种方式对网络层头部进行操作：\n\
  \n*   由防火墙或路由器等设备执行的过滤操作，以拦截攻击者的源 IP 地址\n*   重新配置路由协议，通过路由黑洞（route blackholing）拒绝攻击者将数据包路由到预期目标的能力——数据包被发送到虚空且永无音讯\n\
  *   根据利用的带宽对允许通过防火墙或路由器的流量大小应用阈值逻辑\n\n纯处于网络层的 `response`（响应）可用于对抗在应用层检测到的攻击，但此类响应不应涉及诸如生成\
  \ `TCP RST` 数据包等操作例如这属于传输层响应，正如我们在第 3 章中所看到的。\n\n## 网络层过滤响应\n\n在从特定 IP 地址检测到攻击后，可以使用以下\
  \ `iptables` 规则作为属于过滤类的网络层响应。这些规则被添加到 `INPUT`、`OUTPUT` 和 `FORWARD` 链中；它们会拦截所有（无论协议或端口）指向或来自\
  \ IP 地址 `144.202.*X.*.*X` 的通信：\n\n```\n[iptablesfw]# iptables -I INPUT 1 -s 144.202.X.X\
  \ -j DROP\n[iptablesfw]# iptables -I OUTPUT 1 -d 144.202.X.X -j DROP\n[iptablesfw]#\
  \ iptables -I FORWARD 1 -s 144.202.X.X -j DROP\n[iptablesfw]# iptables -I FORWARD\
  \ 1 -d 144.202.X.X -j DROP\n```\n\n`FORWARD` 链中有两条规则用于拦截源自 `144.202.*X.*.*X`（`-s\
  \ 144.202.*X.*.*X`）的数据包，以及指向 `144.202.*X.*.*X` 的内部系统响应（`-d 144.202.*X.*.*X`）。如果你使用\
  \ `iptables` 作为网络哨兵，上述规则为针对 `144.202.*X.*.*X` 地址提供了一个有效的网络节点。\n\n## 网络层阈值响应\n\n\
  对 `iptables` 目标应用阈值逻辑是通过 `iptables` `limit` 扩展实现的。例如，可以在 `ACCEPT` 规则中使用 `limit`\
  \ 扩展，以限制在给定窗口内从特定源地址接受的数据包数量。以下 `iptables` 规则限制策略为每秒仅接受指向或来自 `144.202.*X.*.*X` IP\
  \ 地址的 10 个数据包。\n\n```\n[iptablesfw]# iptables -I INPUT 1 -m limit --limit 10/sec\
  \ -s 144.202.X.X -j ACCEPT\n[iptablesfw]# iptables -I INPUT 2 -s 144.202.X.X -j\
  \ DROP\n[iptablesfw]# iptables -I OUTPUT 1 -m limit --limit 10/sec -d 144.202.X.X\
  \ -j ACCEPT\n[iptablesfw]# iptables -I OUTPUT 2 -d 144.202.X.X -j DROP\n[iptablesfw]#\
  \ iptables -I FORWARD 1 -m limit --limit 10/sec -s 144.202.X.X -j ACCEPT\n[iptablesfw]#\
  \ iptables -I FORWARD 2 -s 144.202.X.X -j DROP\n[iptablesfw]# iptables -I FORWARD\
  \ 1 -m limit --limit 10/sec -d 144.202.X.X -j ACCEPT\n[iptablesfw]# iptables -I\
  \ FORWARD 2 -d 144.202.X.X -j DROP\n```\n\n对于上述每个使用 `limit` 匹配的 `ACCEPT` 规则，都有一个对应的\
  \ `DROP` 规则。这处理了超过 `limit` 匹配允许的最大每秒 10 个的数据包水平；一旦数据包水平高于此阈值，它们将不再匹配 `ACCEPT` 规则，然后将与\
  \ `iptables` 策略中的剩余规则进行比较。通常情况下，与其允许经过阈值限制的数据包通过，不如完全拒绝与攻击者通信更好。\n\n你还可以使用 `limit`\
  \ 匹配对默认日志规则生成的 `iptables` 日志消息设置阈值。然而，除非担心磁盘空间，否则通常没有对 `LOG` 规则应用限制阈值，因为内核在 `LOG`\
  \ 目标内部使用环形缓冲区，因此当数据包击中 `LOG` 规则的速度超过其通过 `syslog` 写入的速度时，日志消息就会被覆盖。\n\n\n\n\n相比之下，UDP\
  \ 是一种无连接协议。作为一种无连接协议，它无法保证数据一定到达其预期的目的地，无法对实际传输的数据格式提供保证（与 TCP 不同，UDP 头部中的校验和计算是可选的）。通过\
  \ UDP 套接字传输数据的应用程序可以选择实现额外的机制来可靠地传输数据，但在使用 UDP 套接字时，此类功能必须在应用层构建。\n\n在本章中，我们首先关注\
  \ `iptables` 如何在日志消息输出中表示传输层信息。然后我们将查看这些日志如何捕获可疑的传输层活动。\n\n# 使用 iptables 记录传输层头部\n\
  \n`iptables` 的 `LOG` 目标具有丰富的机制来记录 TCP 和 UDP 头部。TCP 头部比 UDP 头部复杂得多，并且只有在向 `iptables`\
  \ 策略中添加 `LOG` 规则时提供了特定的命令行参数 的情况下，某些 TCP 头部字段才会被记录。\n\n## 记录 TCP 头部\n\nTCP 头部定义在\
  \ RFC 793 中，任何特定 TCP 段的头部长度取决于所包含的选项数量。不包含选项（这是唯一的变长字段）时，头部长度始终为 20 字节。在 `iptables`\
  \ 日志消息中，TCP 头部的每个字段都以一个标识字符串开头，如图 3-1 所示。\n\n![TCP 头部和 iptables 日志消息字段](img/httpatomoreillycomsourcenostarchimages207394.png)\n\
  \n图 3-1. TCP 头部和 iptables 日志消息字段\n\n图 3-1 中的所有深灰色框始终包含在 TCP 数据包的 `iptables` 日志消息中；浅灰色阴影的字段仅在给\
  \ `iptables` 提供指定的命令行参数时才会被包含。白色框永远不会被 `iptables` 记录。\n\n第 1 章 中默认 `iptables` 策略包含的\
  \ `INPUT`、`OUTPUT` 和 `FORWARD` 链中的 `LOG` 规则都是使用 `--log-tcp-options` 参数构建的，因此只要 TCP\
  \ 段包含选项，每条日志消息都会包含一段十六进制代码。本章假设来自第 1 章 的 `iptables.sh` 脚本实现的默认 `iptables` 策略运行在图\
  \ 3-2 所示的 `iptablesfw` 系统上。（此图与图 1-2 相同，为了方便起见在此处重复。）\n\n![默认网络图](img/httpatomoreillycomsourcenostarchimages207418.png)\n\
  \n图 3-2. 默认网络图\n\n为了说明 `iptables` 日志消息中包含的 TCP 选项，我们尝试从 `ext_scanner` 系统向 `iptablesfw`\
  \ 系统发起到端口 15104 的 TCP 连接。\n\n由于默认策略不允许与端口 15104 通信，初始 SYN 包被默认的 `iptables` `LOG`\
  \ 和 `DROP` 规则拦截。`iptables` 与 TCP 头部每个字段关联的标记在下方加粗显示，从源端口（`SPT`）开始，到头部的选项部分（`OPT`）结束：\n\
  \n```\n [ext_scanner]$ nc -v 71.157.X 15104\n[iptablesfw]# tail /var/log/messages\
  \ | grep 15104\nJul 12 15:10:22 iptablesfw kernel: DROP IN=eth0 OUT\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00\
  \ SRC=144.202.X.X DST=71.157.X\nLEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=18723 DF=TCP\n\
  SPT=47454 DPT=15104 WINDOW=5840 RES=0x00 SYN URGP=0 OPT20405B040208A30\n```\n\n\
  要让 `iptables`  TCP 序列和确认值，使用 `--log-tcp-sequence` 参数（见下文节）：\n\n```\n [iptablesfw]#\
  \ iptables -I INPUT 1 -p tcp --dport 15104 -j LOG --log-tcp-options --log-tcp-sequence\n\
  [ext_scanner]$ nc -v 71.157.X 15104\n[iptablesfw]# tail /var/log/messages | grep\
  \ 15104\nJul 12 15:33:53 iptablesfw kernel: IN=eth0 OUT\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00\
  \ SRC=144.202.X.X DST=71.157.X\nLEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=62378 DF=TCP\n\
  SPT=54133 DPT=15104\nSEQ=318089345 ACK=0 WINDOW=5840 RES=0x00 SYN URGP=0 OPT20405B040208A30876A10000000103006\n\
  ```\n\n## 记录 UDP 头部\n\nUDP 头部定义在 RFC 768 中，它是 8 字节且没有字段（见图 3-3）。由于没有特殊的命令行参数来影响\
  \ `LOG` 目标对 UDP 头部的表示方式，`iptables` 总是以相同的方式记录。\n\n![UDP 头部和 iptables 日志消息字段](img/httpatomoreillycomsourcenostarchimages207432.png)\n\
  \n图 3-3. UDP 头部和 iptables 日志消息字段\n\n尽管第 1 章 中讨论的 `iptables` 策略使用了 `--log-tcp-options`\
  \ 参数，但如果 UDP 包命中这些规则之一，`iptables` 会正确处理并不记录不存在的 TCP 头部部分。UDP 校验和永远不会记录，但其余三个字段（`SPT`、`DPT`\
  \ 和 `LEN`）都会包含在内：\n\n```\n [ext_scanner]$ echo -n \"aaaa\" | nc -u 71.157.X 5001\n\
  [iptablesfw]# tail /var/log/messages | grep 5001\nJul 12 16:27:08 iptablesfw kernel:\
  \ DROP IN=eth0 OUT\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X\
  \ DST=71.157.X\nLEN=33 TOS=0x00 PREC=0x00 TTL=64 ID=38817 DF=UDP\nSPT=44595 DPT=5001\
  \ LEN=12\n```\n\n### 注意\n\n上述 `iptables` 日志消息中的 UDP `LEN` 字段包含了头部长度加上应用层数据的长度。在本例中，应用层数据由四个字节\
  \ `\"aaaa\"` 组成，因此与 UDP 头部（8 字节）相加得到 12 字节。`echo` 命令的命令行参数 `-n` 指示不要添加尾换行符。如果没有使用该参数，`LEN`\
  \ 字段的值将变为 13 以适应额外的字节。\n\n***\n\n¹ 从技术上说，传输层在 OSI 模型中与上面的会话层和下面的网络层交互，但通常将会话层包含在应用层中（以及表示层）更有用。\n\
  \n² 虽然 TCP 信息的单元术语是 TCP *段*，但很多人非正式地称为 TCP *包*（*包* 在技术上是留给网络层的术语），我也使用这种口语化表达。相同的逻辑适用于\
  \ UDP *数据报*。\n\n# 传输层攻击定义\n\n类似于第 2 章 中网络层攻击的定义，我们将*传输层攻击*定义为滥用传输层头部字段以利用终点主机传输栈实现中的漏洞或错误状态的数据包或系列包。\n\
  \n**连接资源耗尽**\n\n旨在饱和目标主机或主机组用于处理新连接的所有可用资源的包。一个例子是 SYN 泛洪形式的 DDoS 攻击。\n\n**头部滥用**\n\
  \n\n\n\n包含恶意构建、损坏或伪造的传输层报头部的数据包。一个很好的例子是伪造的 `RST` 数据包，设计用于断开 TCP 连接。我们将端口扫描（下文将讨论）也归入此类，尽管扫描行为`by\
  \ itself` 并不恶意。\n\n### 传输协议栈漏洞利用\n\n包含针对终端主机堆栈漏洞的传输层堆栈漏洞利用程序的数据包。也就是说，专门用于处理传输层信息的内核代码本身就是攻击目标。一个很好的例子（特别是在本书的语境下）是\
  \ 2004 年公布针对 `Netfilter` TCP 选项处理代码漏洞的利用程序（该漏洞已被 `Netfilter` 项目快速修复，因此任何较新版本的内核都不受该漏洞影响）。虽然这并没有利用\
  \ TCP 栈本身，但它利用了通过 `Netfilter` 框架直接挂钩到堆栈上的代码。\n\n# 滥用传输层\n\n由于传输层在某种意义上是与网络应用程序进行堆栈向上通信之前的最后一道网关，因此它对攻击者来说是一个极具吸引的目标。许多涉及传输层信息的可疑活动属于侦察工作，而不是直接攻击。\n\
  \n### 端口扫描\n\n端口扫描是一种用于查询主机的技术，以查看从特定 IP 地址可以访问哪些 TCP 或 UDP 服务。扫描系统可以是通往成功破解过程中的重要一步，因为这为攻击者提供了有关可能被访问和攻击的服务信息。\n\
  \n尽管如此，端口扫描也可以是查看哪些可用服务通信的重要步骤；端口扫描行为`by itself` 并不具有本质的恶意性。你可以将端口扫描比作一个人敲某栋房子所有的门。对于任何给定的门，如果有人开门，那人只是说“你好，很高兴见到你”，然后离开，并没有造成任何伤害。虽然重复敲门可能很可疑，除非此人试图进入房屋，否则可能没有构成犯罪。尽管如此，如果有人敲了我`my`房子的所有门，我还是想知道这件事，因为这可能标志着有人正在收集关于最佳入入方式的信息。同样，检测端口扫描是一个好主意（需经过调优以减少误报），且大多数网络入侵检测系统（IDS）都提供在系统受到扫描攻击时发送警报的能力。\n\
  \n### 将端口扫描与易受攻击性服务进行匹配\n\n端口扫描不需要对目标系统上的每个可能的端口进行详尽测试。如果攻击者擅长攻破例如 `OpenSSH 3.3`\
  \ 和 `BIND 4.9` 服务器，那么发现其余 65,533 个端口是否也绑定了服务器的用处不大。此外，生成一个嘈杂的扫描来测试系统上的所有端口是触发 IDS\
  \ 警报的好方法，因为任何合理的端口扫描阈值都更有可能被触发。作为攻击者，最好不要引起不必要的注意。为了让 IDS 更难确定扫描的真实源，攻击者还可以使用 `Nmap`\
  \ 的诱饵（`-D`）选项。这允许端口扫描从几个伪造的源地址进行复制，因此在目标系统看来，它似乎正在同时被几个独立源进行扫描。目标是让任何可能监控 IDS 警报的安全管理员更难查出扫描的真实源。\n\
  \n### TCP 端口扫描技术\n\nTCP 端口扫描可以使用数量惊人的技术来完成。每种技术在数据包穿越网络时，在链路上看起来都略有不同，我们接下来的几节（从\
  \ `TCP connect() Scans` 开始，到第 58 页的 `TCP Idle Scans` 结束）将专门说明主要的扫描技术。幸运的是，无与伦比的\
  \ `Nmap` 扫描器（见 `http://www.insecure.org`）已经为我们自动化了每种技术，我们在本章所有的扫描示例均使用了 `Nmap`。我们在激活了默认\
  \ `iptables` 策略的情况下对 `iptablesfw` 系统启动扫描，并将讨论下面列出的 `Nmap` 端口扫描技术：\n\n*   TCP `connect()`\
  \ 扫描——(Nmap `-sT`)\n*   TCP SYN 或半开扫描——(Nmap `-sS`)\n*   TCP FIN、XMAS 和 NULL 扫描——(Nmap\
  \ `-sF`, `-sX`, `-sN`)\n*   TCP ACK 扫描——(Nmap `-sA`)\n*   TCP 空扫描——(Nmap `-sI`)\n\
  *   UDP 扫描——(Nmap `-sU`)\n\n在下面的每次扫描中都使用了 `Nmap -P0` 命令行选项，强制 `Nmap` 在扫描之前跳过判断 `iptablesfw`\
  \ 系统是否在线（即省略主机发现）。从 `Nmap` 的角度来看，每个扫描的端口可能处于三种状态之一：\n\n| open | 端口上绑定了服务器，且是可以访问的。\
  \ |\n| :--- | :--- |\n| closed | 端口上没有绑定服务器。 |\n| filtered | 端口上可能绑定了服务器，但与其通信的尝试被拦截，Nmap\
  \ 无法确定端口是开启还是关闭的。 |\n\n## TCP connect() 扫描\n\n当普通客户端尝试通过网络与绑定到 TCP 端口的服务器通信时，本地\
  \ TCP 栈会代表客户端与远程堆栈进行交互。在传输任何应用层数据之前，两个堆栈必须协商控制客户端和服务器之间即将发生的对话的参数。这种协商是标准的 TCP 三次握手，需要三个数据包，如图\
  \ 3-4 所示。\n\n![TCP 三次握手](img/httpatomoreillycomsourcenostarchimages207447.png)\n\
  \n图 3-4. TCP 三次握手\n\n第一个数据包 `SYN`（同步 ize）由客户端发送到服务器。该数据包宣告了所需的初始序列号（此外还有 TCP 窗口大小以及允许选择性确认等选项），用于跨\
  \ TCP 会话跟踪服务器跟踪传输。如果 `SYN` 数据包到达开放端口，服务器 TCP 栈将响应 `SYN/ACK`，以确认收到客户端的初始序列值，并向客户端宣告自己的序列号。客户端接收\
  \ `SYN/ACK` 并向服务器响应确认。此时，双方都已同意连接参数（包括初始序列号），且连接状态被定义为已建立并准备传输数据。\n\n在 TCP `connect()`\
  \ 扫描的语境下，扫描器为每个扫描的端口同时发送 `SYN` 和结束的 `ACK` 数据包。任何普通用户都可以以此模式使用 `Nmap` 扫描远程系统；不需要特殊权限。\n\
  \n是从 `SYN` 扫描显示的某些 `iptables` 日志消息以及相应的 `Nmap` 输出。你可以看到 `http` 和 `https` 端口是开启的，且\
  \ `SYN` 数据包的选项部分包含了大量的选项：\n\n\n\n\n\n```\n [ext_scanner]$ nmap -P0 -sT 71.157.X.X\n\
  Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-07-03 00:32 EDT\nInteresting\
  \ ports on 71.157.X.X:\n(The 1670 ports scanned but not shown below are in state:\
  \ filtered)\nPORT    STATE SERVICE\n80/tcp  open  http\n443/tcp open  https\nNmap\
  \ finished: 1 IP address (1 host up) scanned in 30.835 seconds\n\n[iptablesfw]#\
  \ grep SYN /var/log/messages | tail -n 1\nJul  3 00:32:32 iptablesfw kernel: DROP\
  \ IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\n\
  LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=65148 DF PROTO=TCP SPT=43237 DPT=653\nWINDOW=5840\
  \ RES=0x00 SYN URGP=0 OPT (020405B40402080A362957720000000001030306)\n```\n\n###\
  \ TCP SYN 扫描或半开放扫描\n\nSYN 扫描或半开放扫描与 `connect()`扫描类似，因为扫描器向每个 TCP 端口发送一个 `SYN` 数据包，试图诱导\
  \ `SYN/ACK` 或 `RST/ACK` 响应，以显示目标端口是开放还是关闭的。然而，扫描系统永远不会完成三次握手，因为它故意不向任何带有 `SYN/ACK`\
  \ 响应的开放端口返回 `ACK` 数据包。因此，SYN 扫描也称为半开放扫描，因为三次握手从未获得过优雅地完成的机会，正如图 3-5 所示。\n\n![TCP\
  \ half-open scan](img/httpatomoreillycomsourcenostarchimages207386.png)\n\n图 3-5.\
  \ TCP 半开放扫描\n\nSYN 扫描无法通过 `connect()` 系统调用完成，因为该调用会触发原生的 TCP 栈代码，该代码会对从目标接收到的每个\
  \ `SYN/ACK`  `ACK`。因此，在 SYN 扫描中发送的每个 `SYN` 数据包必须由完全绕过 TCP 栈的机制构造。这通常通过使用原始套字（raw\
  \ socket）构建一个数据结构来实现，当该结构被操作系统内核放置在链路上时模拟 `SYN` 数据包。\n\n#### 原始套字与未请求的 SYN/ACK\n\
  \n使用原始套字向远程系统构造 TCP `SYN` 数据包而不是使用 `connect()` 系统调用会带来一个有趣的问题。如果远程主机响应 `SYN/ACK`，那么扫描系统的本地\
  \ TCP 栈会收到 `SYN/ACK`，但发出的 `SYN` 数据包并非来自本地栈（因为我们通过原始套字手动构造的），所以对于栈来说，`SYN/ACK` 并不是合法的\
  \ TCP 握手的一部分。因此，扫描器的本地栈会向目标系统发送 `RST`，因为 `SYN/ACK` 看起来是未请求的。你可以在开始扫描之前，通过命令向 `OUTPUT`\
  \ 链中添加以下 `iptables` 规则来停止这种行为：\n\n```\n [ext_scanner]# iptables -I OUTPUT 1 -d target\
  \ -p tcp --tcp-flags RST RST -j\nDROP\n```\n\nNmap 使用原始套字手动构建 SYN 扫描模式（`-sS`）中使用的\
  \ TCP `SYN` 数据包，这是特权用户的默认扫描模式。由于这些数据包的特征是由 Nmap 直接决定的（不使用本地 TCP 栈），它们与栈通常生成的 TCP\
  \ `SYN` 数据包有显著差异。例如，如果我们用浏览器启动到 `http://www.google.com` 的网络会话并使用 `tcpdump` 显示本地\
  \ Linux TCP 栈的 `SYN` 数据包，我们将看到如下：\n\n```\n [iptablesfw]# tcpdump -i eth0 -l -nn\
  \ port 80\ntcpdump: verbose output suppressed, use -v or -vv for full protocol decode\
  \ listening\non eth0,\nlink-type EN10MB (Ethernet), capture size 96 bytes\n11:13:40.255182\
  \ IP 71.157.X.X.59603 > 72.14.203.99.80: S 2446075733:2446075733(0)\nwin 5840\n\
  <mss 1460,sackOK,timestamp 277196169 0,nop,wscale 2>\n```\n\n上面**加粗**显示的是 TCP 头部中的窗口大小和选项部分。每个值的具体数值由本地\
  \ TCP 栈定义，并用于与远程主机协商建立有效的 TCP 会话。\n\n与真实 TCP 栈生成的 `SYN` 数据包不同，Nmap 并不关心建立真实的 TCP\
  \ 会话。Nmap 感兴趣的是远程端口是开放（Nmap 接收 `SYN/ACK`）、关闭（Nmap 接收 `RST/ACK`）还是被过滤（Nmap 接收不到）。因此，Nmap\
  \ 放在链上的 TCP `SYN` 数据包只需要满足远程主机带有 `SYN` 标志，以便远程 TCP 栈响应 `SYN/ACK`、`RST/ACK` 或无（如果端口被过滤）。\n\
  \n对于 `3.*` 系列的 Nmap，用于扫描远程系统的 `SYN` 数据包不包含 TCP 选项（如果包含选项，它们将出现在 TCP 窗口之后，如此处**加粗**所示）。\n\
  \n对于最新版本的 Nmap，最大段大小（MSS）包含在其发送的 `SYN` 数据包中，如下：\n\n## TCP FIN、XMAS 和 NULL 扫描\n\n\
  FIN、XMAS 和 NULL 扫描遵循这样一个原理：如果符合 RFC 的任何 TCP 栈在端口接收到未设置 `SYN`、`ACK` 或 `RST` 位的意外\
  \ TCP 数据包，它应该以特定方式响应。如果端口是关闭的，TCP 响应 `RST/ACK`；但如果是是开放，TCP 不响应任何数据包。\n\n下面的示例显示了\
  \ `iptablesfw` 系统的 FIN 扫描，注意 ❶ 所有端口都被 Nmap 报告为 `open|filtered`。因为意外的 FIN 数据包不属于任何\
  \ TCP 连接，所有 FIN 数据包（即使是开放端口）都会匹配 iptables 策略中的 `INVALID` 状态并随后被记录。（参见 ❷ 处的 `DROP\
  \ INVALID` 日志前缀和 ❸ 处的 FIN 标志）。\n\n\n\n\n`ACK` 扫描的目标不是确定端口是开放还是关闭，而是确定端口是否被状态检测防火墙过滤。因为当使用\
  \ `Netfilter` 连接跟踪子系统时（通过 `state match`），`iptables` 防火墙始终是状态检测的，因此不会有意外的 `ACK` 数据包进入\
  \ `iptablesfw` 系统的 TCP 协议栈。因此，如此所示，系统不会向扫描器返回任何 `RST` 数据包（注意在 ❷ 处设置的 `ACK` 标记）：\n\
  \n```\n [ext_scanner]# nmap -P0 -sA 71.157.X.X\nStarting Nmap 4.01 ( http://www.insecure.org/nmap/\
  \ ) at 2007-07-03 00:36 EDT\nAll 1672 scanned ports on 71.157.X.X are: ❶filtered\n\
  Nmap finished: 1 IP address (1 host up) scanned in 36.191 seconds\n[iptablesfw]#\
  \ grep ACK /var/log/messages | tail -n 1\nJul  3 00:37:18 iptablesfw kernel: DROP\
  \ IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X DST=71.157.X.X\n\
  LEN=40 TOS=0x00 PREC=0x00 TTL=43 ID=51322 PROTO=TCP SPT=62068 DPT=6006\nWINDOW=4096\
  \ RES=0x00 ❷ACK URGP=0\n```\n\n### TCP 空闲扫描\n\n`TCP idle scan` 是一种高级扫描模式，需要三个系统：一个启动扫描的系统、扫描目标以及一个运行未被频繁使用的\
  \ TCP 服务器的僵尸主机（这就是扫描名称中“空闲”部分的来源）。空闲扫描在图 3-6 中进行了说明。\n\n![TCP idle scan](img/tcpatomoreillycomsourcenostarchimages207428.png)\n\
  \n图 3-6. TCP 空闲扫描\n\n空闲扫描利用了这样一个事实：每通过 IP 协议栈发送一个包，IP ID 值就会加 1。扫描将此事实与以下要求结合：TCP\
  \ 协议栈需要对开放端口的 `SYN` 包返回 `SYN/ACK` 包，或对关闭端口的 `SYN` 包返回 `RST/ACK` 包。此外，所有 TCP 协议栈都要求忽略未请求的\
  \ `RST/ACK` 包。综合来看，这些事实允许扫描器在扫描器到僵尸主机维持的 TCP 会话期间，观察僵尸主机如何增加 IP ID 值，同时扫描器在目标系统使用僵尸主机的\
  \ IP 地址伪造 `SYN` 包。结果，扫描器能够监控来自僵尸系统的数据包 IP 头部中的 IP ID 值，并根据这些信息推断出目标上的端口是开放还是关闭的。\n\
  \n当扫描器向目标上的`开放端口`发送 `SYN` 包时（参见图 3-6），且源 IP 地址伪造为僵尸机的地址，目标会响应 `SYN/ACK`（给僵尸系统）。由于僵尸收到的\
  \ `SYN` 包实际上是未请求的（由扫描器伪造的），它会向目标系统响应 `RST`，从而使 IP ID 计数器加 1。如果扫描器向目标上的`关闭端口`发送 `SYN`\
  \ 包（同样伪造了源 IP 地址），目标将向僵尸响应 `RST/ACK`，而僵尸会忽略这个未请求的包。由于在这种情况下僵尸主机没有发送任何包，因此 IP ID\
  \ 值不会增加。\n\n通过监控 IP ID 值的增加情况（目标上的开放端口加 1，关闭端口则不增加），扫描器可以推断出目标系统上哪些端口是开放的。然而，决定空闲扫描成功的最重要因素是僵尸主机上可用服务的利用率。流行的\
  \ Web 服务器不适合作为僵尸主机。在这种情况下，由于*每一个* TCP 连接都会增加 IP ID 值，该值在大部分情况下会超出扫描器的控制范围。这使得将 IP\
  \ ID 值的变化映射到被扫描端口变得不实际。\n\n作为空闲扫描目标的系统无法知道扫描的真实来源，因为它们看到的只是来自僵尸主机的伪造 `SYN` 包。目标上的\
  \ `iptables` 日志看起来就像普通的 `SYN` 扫描（参见第 56 页的“ [TCP SYN 或半开放扫描”）。\n\n### 注意事项\n\n如果僵尸主机上运行着默认丢弃（default-drop）防火墙，空闲扫描唯一可行的方法是扫描器将源端口硬编码为僵尸主机上的一个开放\
  \ TCP 端口。原因是被过滤的 `SYN/ACK` 不会被僵尸 TCP 协议栈看到，因此它永远不会发送 `RST`，从而 IP ID 不会增加。在某些情况下，如果部署了防火墙，僵尸主机可能没有任何响应。\n\
  \n### UDP 扫描\n\n由于 UDP 不实现连接，UDP 扫描是通过向特定端口发送数据并查看在合理时间内是否有返回来完成的，简单的。如果防火墙阻止了 UDP\
  \ 包，会触发 `ICMP 端口不可达` 消息，这使得扫描器很容易判断 UDP 端口是否关闭。相反，针对开放端口的 UDP 包可能会完全沉默。这是因为 UDP\
  \ 服务器并不*义务*响应；是否响应完全取决于特定端口。\n\n如果防火墙拦截了扫描器发往特定端口的 UDP 包，扫描器看起来什么都没有。这就是为什么 `nmap`\
  \ 报告过滤的端口为 `open|filtered`。例如，是 `nmap` 扫描的几行 `iptables` 日志，你可以看到被扫描的 UDP 端口都是 `open|filtered`（加粗所示）：\n\
  \n```\n [ext_scanner]# nmap -P0 -sU 71.157.X.X\nStarting Nmap 4.01 ( http://www.insecure.org/nmap/\
  \ ) at 2007-07-03 00:44 EDT\nAll 1482 scanned ports on 71.157.X.X are: open|filtered\n\
  Nmap finished: 1 IP address (1 host up) scanned in 32.260 seconds\n\n[iptablesfw]#\
  \ tail /var/log/messages | grep UDP | tail -n 1\nJul  3 00:45:01 iptablesfw kernel:\
  \ DROP IN=eth0 OUT=\nMAC=00:13:d3:38:b6:e4:00:30:48:80:4e:37:08:00 SRC=144.202.X.X\
  \ DST=71.157.X.X\nLEN=28 TOS=0x00 PREC=0x00 TTL=42 ID=48755 PROTO=UDP SPT=60906\
  \ DPT=381 LEN=8\n```\n\n### 端口扫描\n\n端口扫描是一种与端口扫描相似的侦察方法。然而，端口扫描不是为了列出单个主机上的可访问服务，而是检查多个主机上同一个服务的可用性。从安全角度来看，端口扫描引起的关注通常比端口扫描更大，因为它们通常意味着系统已被蠕病毒感染并正在寻找其他感染目标。如果网络运行着大量的\
  \ Windows 系统（这些通常是蠕病毒活动的主要目标），那么检测端口扫描比检测端口扫描更重要。然而，面对像 SQL Slammer 蠕病毒这样的蠕病毒，即使是早期检测可能也意义不大，这种病毒在几分钟内在全球范围内感染了数万台系统；当检测到蠕病毒时，可能已经无能为力了。当像\
  \ Slammer 这样快速传播的蠕病毒最初释放时，编写并分发新的 Snort 特征码的时间远于蠕病毒感染几乎所有漏洞系统的时间。一旦有了可靠的特征码，入侵防御系统可能阻止该蠕病毒，但限制蠕病毒的最佳方法是修复它所利用的漏洞。尽管如此，检测来自内部网络的端口扫描仍然是识别受感染系统的好方法（幸运的是，并不是所有的蠕病毒都像\
  \ Slammer 蠕病毒那样快速传播）。\n\n\n\n\n\nNmap 可以轻松地利用其所有的扫描能力来扫描整个网络以寻找特定的服务。例如，如果攻击者拥有针对\
  \ `SSH` 守护进程的漏洞，Nmap 可以如下所示找到整个 `10.0.0.0/8` 子网中所有可访问的此类实例：\n\n```\n [ext_scanner]#\
  \ nmap -P0 -p 22 -sS 10.0.0.0/8\n```\n\n## TCP 序列号预测攻击\n\nTCP 并没有内置强身份验证或加密层；这项被留给了应用层处理。因此，`TCP`\
  \ 会话容易受到各种攻击的威胁，这些攻击旨在向 `TCP` 流中注入数据、劫持会话或强制关闭会话。\n\n为了向已建立的 `TCP` 连接中注入数据，攻击者必须知道（或猜测）用于跟踪数据传输的当前序列号，这取决于连接的双方在任何数据传输之前所选择的初始序列号。某些\
  \ `TCP` 协议栈已经做了大量工作来确保初始序列号是随机选择的（`OpenBSD` 栈就是一个很好的例子），而且 `TCP` 头部中序列号字段的大小（32\
  \ 位）在 `TCP` 连接无法被攻击者嗅探时也提供了一定的猜测抗性。然而，Paul A. Watson 在《窗口中的滑行：TCP 重置攻击》中报告了一个在 Cisco\
  \ 路由器中使用 `RST` 包拆断 `BGP` 对等会话时，猜测 `TCP` 序列号的著名案例（更多信息请参阅 [`osvdb.org/reference/slippinginthewindow_v1.0.doc`](http://osvdb.org/reference/slippinginthewindow_v1.0.doc)）。\n\
  \n当网络网关运行 `iptables` 时，阻碍内部网络人员使用序列号猜测攻击针对外部 `TCP` 会话的最佳方法之一是建立规则，丢弃源自内部网络的伪造数据包。也就是说，为了使此类攻击成功，攻击者必须伪造数据包绕过\
  \ `iptables` 并从外部 `TCP` 客户端或服务器 IP 地址进入连接。使用 `iptables`，通过丢弃任何源地址位于内部网络之外的内部接口数据包，可以很容易阻止伪造包被转发。（这是通过\
  \ 第 1 章 中讨论的默认 `iptables` 策略实现的。）\n\n## SYN 洪水\n\n`SYN` 洪水会从伪造的源地址产生大量的 `TCP SYN`\
  \ 包，并指向特定的 `TCP` 服务器。其目标是通过强制使目标 `TCP` 协议栈投入所有资源发送 `SYN/ACK` 包，并等待永远不会来的 `ACK` 包，从而使服务器崩溃。`SYN`\
  \ 洪水是纯粹的拒绝服务攻击。`iptables` 通过 limit 匹配为 `SYN` 洪水提供了一些保护：\n\n```\n [iptablesfw]# iptables\
  \ -I FORWARD 1 -p tcp --syn -m limit --limit 1/s -j ACCEPT\n```\n\n***\n\n^([23])\
  \ ³ `TCP` 和 `UDP` 头部中的源目的端口字段宽度为 16 位，因此总共有 65,536 (2¹⁶) 个端口（包括可以通过 Nmap 扫描的 0 端口）。\n\
  \n^([24]) ⁴ 尽管 Nmap 可以扫描端口 0，但操作系统不允许服务器 `bind()` 到端口 0 。\n\n^([25]) ⁵ 在这种情况下，来自僵尸的\
  \ `RST` 包不包含 `ACK` 位，因为来自目标的 `SYN/ACK` 确实设置了 `ACK` 位。关于在 `RST` 包上设置 `ACK` 位的情况的更多材料包含在第\
  \ 63 页的“RST vs. RST/ACK”。\n\n## 传输层响应\n\n在某些条件下，传输层会对流量做出响应。防火墙或其他过滤设备可以根据传输层头部实施过滤操作（参见\
  \ 第 1 章 中提供的 `iptables.sh` 脚本）、制造 `TCP RST` 或 `RST/ACK` 包来拆断 `TCP` 连接，或者限制入站包的速率（例如在给定时间内\
  \ `TCP SYN` 包的数量）。\n\n### 备注\n\n我们将在 第 10 章 和 第 11 章 中看到更多主动响应措施，在那里我们将展示如何在检测到应用层攻击时使用\
  \ `iptables` 在网络层和传输层做出响应。\n\n然而，在如今的系统入侵方面，应用层是大多数有趣活动的地方。将应用层漏洞交付到目标系统涉及的传输层通信本身是无害的（毕竟攻击者希望传输层能够*正常工作*）。由于端口扫描和端口遍历很容易从伪造的源\
  \ IP 地址发送，因此对端口扫描和端口遍历等传输层活动做出响应是有风险的。\n\n### TCP 响应\n\n在 `TCP` 中，传输层有一个内置的响应响应机制。这种能力以\
  \ `TCP RST`重置）或 `RST/ACK`重置/确认）包的形式实现。该包通知接收端 `TCP` 协议栈无法再发送数据，且连接将被终止，无论其当前状态如何。`RST`\
  \ 标志是 `TCP` 头部 6 位控制位字段中的元素之一。每当 `TCP` 客户端或服务器遇到无法维持的条件时就会使用它，连接的任何都可以发出 `RST`。\n\
  \n### RST vs. RST/ACK\n\n许多防火墙和入侵检测系统可以发送 `TCP RST` 包来关闭恶意连接，但发送此类包的实现细节差异很大。一个经常被忽略的细节是防火墙或\
  \ IDS 发送的是纯 `RST` 包还是 `RST/ACK` 包。\n\n根据 `RFC 793`，`TCP` 协议栈生成 `RST/ACK` 的情况只有三种；其余时间，发送的是不带\
  \ `ACK` 位的 `RST` 包。此外，`TCP` 会话中最后一个包的 `ACK` 位与用于拆断连接的 `RST` 包之间存在反比关系。也就是说，如果最后一个包包含了\
  \ `ACK` 位，则 `RST` 包不应包含；如果最后一个包不包含 `ACK` 位，则应该发送 `RST`。\n\n例如，如果 `TCP SYN` 包发送到一个没有服务器监听的端口（即端口处于\
  \ `CLOSED` 状态），则会返回 `RST/ACK`。但如果 `SYN/ACK` 包发送到一个 `CLOSED` 端口，则会返回不带 `ACK` 位的 `RST`\
  \ 包。这两个场景由以下示例所示：\n\n```\n❶ [iptablesfw]# iptables -I INPUT 1 -p tcp --dport 5001\
  \ -j ACCEPT\n❷ [ext_scanner]# nmap -P0 -sS -p 5001 71.157.X.X\n[iptablesfw]# tcpdump\
  \ -i eth0 -l -nn port 5001\ntcpdump: verbose output suppressed, use -v or -vv for\
  \ full protocol decode\nlistening on eth0, link-type EN10MB (Ethernet), capture\
  \ size 96 bytes\n17:10:24.693292 IP 144.202.X.X.33736 > 71.157.X.X.5001: S\n522224616:522224616(0)\
  \ win 2048 <mss 1460>\n17:10:24.693413 IP 71.157.X.X.5001 > 144.202.X.X.33736: ❸R\
  \ 0:0(0) ack\n522224617 win 0\n❹ [ext_scanner]# nmap -P0 -sA -p 5001 71.157.X.X\n\
  [iptablesfw]# tcpdump -i eth0 -l -nn port 5001\ntcpdump: verbose output suppressed,\
  \ use -v or -vv for full protocol decode\n17:11:03.985446 IP 144.202.X.X.62669 >\
  \ 71.157.X.X.5001: . ack 1406759780 win\n1024\n17:11:03.985477 IP 71.157.X.X.5001\
  \ > 144.202.X.X.62669: ❺R\n1406759780:1406759780(0) win 0\n```\n\n\n\n\n在上述 ❶ 处，`iptables`\
  \ 对于 TCP 端口 5001 被排除在外，允许任何客户端直接与 `iptablesfw` 系统上的 Linux TCP 栈通信。这消除了 `iptables`\
  \ 这一可能导致结果偏差的潜在因素。在 ❷ 处，针对 `iptablesfw` 系统的端口 5001 发送了一个标准的 `Nmap` SYN 扫描，下一行显示了用于观察的\
  \ `tcpdump` 命令。在 ❸ 处，本地 TCP 栈向客户端发送了 RST，该 RST 具有一个非零的确认值；设置了 ACK 位是因为来自 `Nmap`\
  \ 的 SYN 数据包（显示在 `tcpdump` 输出的上一行）不包含 ACK 位。\n\n在 ❹ 处，针对端口 5001 发送了另一个 `Nmap` 扫描：ACK\
  \ 扫描。在 ❺ 处看到了来自本地 TCP 栈的 RST，其没有确认号且 ACK 位未被设置。这是因为来自 `Nmap` 的数据包包含一个确认号并设置了 ACK\
  \ 位。\n\n`iptables` 的 `REJECT` 目标实现了匹配到的 TCP 数据包上的 ACK 标志与其生成的 RST 之间的反向关系。这种关系通过内核源码中\
  \ `linux/net/ipv4/netfilter/ipt_REJECT.c` 文件中的以下代码段强制（参见 `send_reset()` 函数——为了可读性已省略了部分代码）：\n\
  \n```c\n static void send_reset(struct sk_buff *oldskb, int hook)\n{\n    struct\
  \ tcphdr *tcph; ❶  int needs_ack;\n❷  if (tcph->ack) {\n❸       needs_ack = 0;\n\
  \        tcph->seq = oth->ack_seq;\n        tcph->ack_seq = 0;\n    } else {\n❹\
  \       needs_ack = 1;\n        tcph->ack_seq = htonl(ntohl(oth->seq) + oth->syn\
  \ + oth->fin\n                      + oldskb->len - oldskb->nh.iph->ihl*4\n    \
  \                  - (oth->doff<<2));\n        tcph->seq = 0;\n    }\n❺   tcph->ack\
  \ = needs_ack;\n}\n```\n\n在 ❶ 处，声明了一个标志 `needs_ack`，用于判断生成的 TCP RST 数据包是否包含 ACK\
  \ 控制位（以及相应的非零确认值）。如果原始 TCP 数据包包含 ACK 位（参见 ❷——在此阶段 `tcph` 指针指向原始数据包的可写副本），则 `needs_ack`\
  \ 标志和确认值都将被设置为 0（❸）。如果原始 TCP 数据包不包含 ACK 位，则在 ❹ 处将 `needs_ack` 标志设置为 1，且确认值从原始数据包中得出。最后，在\
  \ ❺ 处，根据 `needs_ack` 标志的值将 ACK 位设置为 0 或 1。`REJECT` 目标中的此逻辑复制自实现 TCP 栈的代码；你可以在 Linux\
  \ 内核源码中 `net/ipv4/tcp_ipv4.c` 文件的 `tcp_v4_send_reset()` 函数第 569 行左右看到它。为了看到这一效果，我们现在将观察\
  \ iptables 如何在 TCP 连接进入建立状态且从客户端向服务器发送字符串 `tester` 后断开该已建立的 TCP 连接。（我们将在第 10 章和第\
  \ 11 章中看到更多此类传输层对应用层数据的响应示例。）\n\n```bash\n ❶ [iptablesfw]# iptables -I INPUT 1 -p\
  \ tcp --dport 5001 -j ACCEPT❼\n[iptablesfw]# iptables -I INPUT 1 -p tcp --dport\
  \ 5001 -m string --string\n\"tester\" --algo bm -j REJECT --reject-with tcp-reset\n\
  ❷ [iptablesfw]# nc -l -p 5001 &\n[1] 8135\n[ext_scanner]$ echo \"tester\" | nc 71.157.X.X\
  \ 5001\n❸ [iptablesfw]# tcpdump -i eth0 -l -nn -s 0 -X port 5001\n❹ 22:33:25.826122\
  \ IP 144.202.X.X.54922 > 71.157.X.X.5001: S 741951920:\n741951920(0) win 5840 <mss\
  \ 1460,sackOK,timestamp 842078832 0,nop,wscale 6>\n22:33:25.826161 IP 71.157.X.X.5001\
  \ > 144.202.X.X.54922: S 264203278:\n264203278(0) ack 741951921 win 5792 <mss 1460,sackOK,timestamp\
  \ 647974503\n842078832,nop,wscale 5>\n22:33:25.826263 IP 144.202.X.X.54922 > 71.157.X.X.5001:\
  \ . ack 1 win 92\n<nop,nop,timestamp 842078832 64797403>\n22:33:25.826612 IP 144.202.X.X.54922\
  \ > 71.157.X.X.5001: P 1:8(7) ❺ack 1 win\n92 <nop,nop,timestamp 842078832 64797403>\n\
  \      0x0000:  4500 003b 53c2 4000 4006 1d94 0000 0000  E..;S.@.@...G..\n     \
  \ 0x0010:  0000 0000 d68a 1389 2c39 49b1 0fbf 6c0f  G..3....,9I...l.\n      0x0020:\
  \  8018 005c b82a 0000 0101 080a 3231 1a70  ...\\.*......21.p\n      0x0030:  269f\
  \ 4e67 7465 7374 6572 0a              &.Ng❻tester.\n22:33:25.826665 IP 71.157.X.X.5001\
  \ > 144.202.X.X.54922: ❼R\n264203279:264203279(0) win 0```\n\n在 ❶ 处，我们首先包含一条 `ACCEPT`\
  \ 到 TCP 端口 5001 的规则，接着是 ❷ 规则：`iptables -I INPUT 1 -p tcp --dport 5001 -m string\
  \ --string \"tester\" --algo bm -j REJECT`...等等，重新阅读文本流：\n\n在 ❶ 处，声明了一个 `needs_ack`\
  \ 标志，用于判断生成的 TCP RST 数据包是否包含 ACK 位（以及相应的非零确认值）。如果原始 TCP 数据包包含 ACK 位（参见 ❷——在此阶段 `tcph`\
  \ 指针指向原始数据包的可写副本），则 `needs_ack` 标志和确认值都将被设置为 0（❸）。如果原始 TCP 数据包不包含 ACK 位，则在 ❹ 处将\
  \ `needs_ack` 标志设置为 1，且确认值从原始数据包中得出。最后，在 ❺ 处，根据 `needs_ack` 标志的值将 ACK 位设置为 0 或 1。`REJECT`\
  \ 目标中的此逻辑复制自实现 TCP 栈的代码；你可以在 Linux 内核源码中 `net/ipv4/tcp_ipv4.c` 文件的 `tcp_v4_send_reset()`\
  \ 函数第 569 行看到它。为了看到这一效果，我们现在将观察 iptables 如何在 TCP 连接进入建立状态且从客户端向服务器发送字符串 `tester`\
  \ 后断开该已建立的 TCP 连接。（我们将在第 10 章和第 11 章中看到更多此类传输层对应用层数据的响应示例。）\n\n```bash\n ❶ [iptablesfw]#\
