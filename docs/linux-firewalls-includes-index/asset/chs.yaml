  Metasploit exploit DB update\"\n       flags:     ACK\n       content:   \"cacert@metasploit.com\"\
  \n       sid:       900001\n       chain:     FWSNORT_FORWARD_ESTAB\n       packets:\
  \   1\n       classtype: misc-activity\n❺\n [+] whois Information:\nOrgName:   \
  \ California Regional Intranet, Inc.\nOrgID:      CALI\nAddress:    8929A COMPLEX\
  \ DRIVE\nCity:       SAN DIEGO\nStateProv:  CA\nPostalCode: 92123\nCountry:    US\n\
  ReferralServer: rwhois://rwhois.cari.net:4321\nNetRange:   216.75.0.0 - 216.75.63.255\n\
  CIDR:       216.75.0.0/18\nNetName:    CARI-4\nNetHandle:  NET-216-75-0-0-1\nParent:\
