  \ `fwsnort` 如何构建 `fwsnort.sh` 脚本非常有帮助。在 ❷ 处，`fwsnort.sh` 创建一组自定义链，所有的签名匹配规则都添加到其中。这保持了\
  \ `fwsnort` 规则与系统中任何现有 `iptables` 策略规则之间的某种隔离。结果是 `fwsnort` 策略与任何现有的 `iptables`\
  \ 策略兼容。\n\n一组 `iptables` 规则开始于 ❸；这些规则使用 `Netfilter` 连接跟踪系统将属于 `ESTABLISHED` 连接的\
  \ TCP 数据包通过 `fwsnort` 链 `FWSNORT_FORWARD_ESTAB`、`FWSNORT_INPUT_ESTAB` 和 `FWSNORT_OUTPUT_ESTAB`。这允许\
  \ `fwsnort` 将复杂的应用层字符串匹配操作限制在属于真实 TCP 连接的数据包上。所有添加到这些链中的翻译后的 Snort 规则都包含 `flow:\
  \ established;` 选项。关于此主题的更多信息可以参考第 9 章。\n\n`fwsnort.sh` 脚本的核心内容开始于 ❹。在这里，`iptables`\
  \ 被指示在应用层数据搜索七种 Snort 签名描述的字符串。如果任何 `iptables` 规则触发了网络会话，就会生成一个 `iptables` syslog\
  \ 消息供 `psad` 分析。最后，在 ❺ 处，`fwsnort` 策略删除并添加规则，将网络流量从内置的 `INPUT`、`OUTPUT` 和 `FORWARD`\
  \ 链跳转到自定义的 `fwsnort` 链 `FWSNORT_INPUT`、`FWSNORT_OUTPUT` 和 `FWSNORT_FORWARD`。（先删除跳转规则允许\
  \ `fwsnort.sh` 脚本多次执行而不添加多个相同的跳转规则。）一旦网络流量跳转到 `fwsnort` 链，就会对每个数据包执行 `fwsnort` 白名单、黑名单和签名检查操作。\n\
  \n要在 Linux 内核中激活 `fwsnort` 策略，只需执行 `fwsnort.sh` 脚本：\n\n```\n [iptablesfw]# /etc/fwsnort/fwsnort.sh\n\
  [+] Adding web-attacks rules.\n    Rules added: 14\n```\n\n最后，为了验证 `fwsnort` 策略正在工作，你可以从外部系统向内部\
