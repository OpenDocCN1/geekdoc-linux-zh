  \ `iptables` 规则指定的日志前缀，❸ 是与 `216.75.15.231` IP 地址关联的反向 DNS 主机名，❹ 标记了匹配包的细节，包括 `cacert@metasploit.com`\
  \ 应用层字符串。最后，❺ 显示了与 `216.75.15.231` IP 地址相关的完整 whois 信息。\n\n*** *\n\n⁴ `Subversion`（参见\
  \ `http://subversion.tigris.org`）是跟踪源代码（甚至是二进制文件）变化的极佳机制。`http://www.cipherdyne.org`\
  \ 的所有项目都在 `Subversion` 仓库中跟踪，甚至用于编写本书的文件在编写过程中也通过 `Subversion` 跟踪。\n\n⁵ 使用 `Wireshark`\
  \ 中的 `Follow TCP Stream` 功能查看应用层数据变得异常简单。\n\n# 结语\n\n凭借来自 `Snort` 社区提供的指引有效检测方向的签名，`fwsnort`\
  \ 和 `psad` 项目可以将你的 `iptables` 防火墙转换为一个能够检测并响应应用层攻击的系统。本质上，这把 `iptables` 变成了一个基础的入侵防御系统，能够阻止大量攻击与本地系统中绑定\
  \ socket 的进程交互，或与通过系统转发流量的远程客户端或服务器交互。在第 12 章和第 13 章中，我们将看到，通过默认丢弃（default-drop）数据过滤器和单包授权（Single\
  \ Packet Authorization），阻止针对服务器的攻击可以变得更加健壮。\n\n# 第 12 章 端口敲门（PORT KNOCKING）VS 单包授权\n\
  \n到本书为止，我一直致力于讨论使用各种 `iptables` 功能结合 `psad` 和 `fwsnort` 来检测并阻止基于网络的攻击。本章代表了对传统网络访问和安全模型的重大偏离，传统模型中，数据过滤器被配置为允许访问网络服务，而应用安全则留给应用程序本身，并辅以基于签名的入侵检测系统的（有限）帮助。通过对\
  \ `iptables` 采用默认丢弃策略，并同时允许能够通过被动收集的信息向 `iptables` 证明身份的客户端访问，我们可以为任意服务添加额外的安全层。\n\
  \n## 缩小攻击面\n\n本书是关于使用 `Netfilter` 和 `iptables` 中的功能来检测和响应基于网络的攻击的，因此初看起来，本章和下一章（涵盖\
  \ `fwknop` 的 SPA 实现）似乎并不合群。然而，任何被默认丢弃数据过滤器保护的服务，除非重新配置数据过滤器以允许访问，否则对任意潜在客户端来说是根本不可访问的。这意味着只有经过授权的会话才能存在；反之，这也意味着此类服务的攻击率和误报率都会降低。这对于基于\
  \ TCP 的服务尤其如此，因为现在的大多数入侵检测系统维护 TCP 会话状态，以过滤掉在没有建立 TCP 会话的情况下在网络上伪造的虚假攻击。\n\n此类 IDS\
  \ 监控的伪造攻击不会产生误报，而通过已建立的 TCP 会话投递真实攻击将失败，因为无法建立会话。\n\n## 零日攻击问题\n\n\n\n\n过去几年，在软件安全方面付出了巨大努力——特别是像\
  \ `OpenBSD` 和 `OpenSSH` 这样的开源项目——新发现的漏洞数量似乎将会下降。然而，新漏洞正以不断加快的速度在各种软件中被发现，且看不到任何缓解的迹象。\n\
  \n### Note\n\nBugtraq、`Full-disclosure` 和 `Vuln-dev` 邮件列表非常活跃，并就某些最新利用程序和攻击技术提供了极佳的技术信息和讨论。许多公司（如\
  \ iDefense——参见 [`www.idefense.com`](http://www.idefense.com)）应运而生，其业务模式基于漏洞跟踪，为用户提供作为漏洞早期预警系统的服务。iDefense\
  \ 甚至会为新漏洞漏洞研究人员付费，以换取优先发布的权利。\n\n商业世界创建的大多数软件是为了客户开发的，目的是利润最大化，而非安全性。然而，随着高知名度安全问题的出现，如钓鱼、间谍软件、身份盗窃，特别是针对微软系统的破坏性虫（如\
  \ `Code Red` 和 `SQL Slammer` 蠕虫），公司开始更加重视安全。\n\n诸如大型金融机构个人数据被盗等事件，也从大范围内提高了立法者对计算机和物理安全问题的关注。加州已经通过了一项法律，要求如果敏感信息被第三方非法获取，公司必须通知消费者（更多信息请参见\
  \ [`www.privacyrights.org/ar/itlawsca.htm`](http://www.privacyrights.org/ar/itlawsca.htm)）。\n\
  \n### Note\n\n我将避免对关于微软操作系统和应用程序在本质上是否比其他操作系统和软件更不安全的近乎宗教的争论发表评论。无论如何，有一点是明确的：微软软件的普及以及其易受攻击的特性，共同导致了一个存在严重安全缺陷的全球基础设施。这为恶意软件提供了一个目标丰富的环境。\n\
  \n但是，计算机和软件到底有什么特性让它们在面对坚决的攻击者时显得如此脆弱？为什么安全漏洞如此常见？尽管这种技术在几十年前就已演示，为什么缓冲区溢出漏洞仍然泛滥？我们难道应该在很久以前就消灭这类\
  \ bug 吗？\n\n与其对这些问题给出冗长的答案并带我们进入栈加固和内核模式保护等技术领域，我将做几点观察。\n\n首先，软件总是依赖于实现，而且没有机制可以严格地验证某段软件是安全的。任何实现中的\
  \ bug 都可能导致一个理论上完美的软件设计面临安全问题。\n\n其次，考虑 `OpenSSH` 项目（参见 [`www.openssh.org`](http://www.openssh.org)）。OpenSSH\
  \ 由世界上最敏锐、最有安全意识的开发者编写，然而即使是 OpenSSH 也也被知道存在漏洞。这告诉我们，编写无 bug 的软件是 `really hard`，即使是最好的安全开发者也会犯错。\n\
  \n## 零日攻击发现\n\n当有人在软件中发现了一个之前未被发现的安全漏洞并为其编写利用程序时，就产生了`零日攻击`。在一段时间内，这个人是世界上唯一知道该漏洞的人，他或她有一个选择：放弃使用利用程序并通知软件供应商以便其修复，或者为了利用程序获取个人利益且不通知任何人。后一种选择显然对软件用户构成了最大的威胁，黑帽和白帽黑客越来越多地发现零日利用程序。\n\
  \n## 对基于特征的入侵检测的影响\n\n对于基于特征的入侵检测系统供应商来说，有一个有趣的问题：如何编写特征来检测针对零日漏洞的攻击？答案是，尽管某些营销部门可能是所说的，此类利用程序通常无法被检测到，因为只有发现利用程序的某个人知道漏洞的存在。要为一个甚至无法描述的攻击编写特征是极其困难的。\n\
  \n这并不是说无法做任何有用的事情；`Snort` 规则集中的几个特征被用于通用地检测攻击者在获得提权后，以可疑方式使用系统的尝试。这有时允许 `Snort`\
  \ 检测到零日攻击的`effects`（即，当攻击者在获得访问权限后实际上尝试使用受侵害的系统时），而不一定需要检测攻击本身。例如，`shellcode.rules`\
  \ 文件中的规则寻找许多公开可用利用程序之间共享的 shell 代码的共同点。攻击者可能只是将这些现成的 shell 代码片段之一（可以执行创建反向 shell\
  \ 等操作）与新的攻击结合使用。代码复用在计算机地下世界的用处与它在软件开发的其他领域一样大。其他通用地检测可疑活动的的例子是 `Snort` 规则 ID `1341`\
  \ 和 `1342`，它们会查找通过 HTTP 会话执行 `gcc` 编译器的尝试。如果 `Snort` 为这些规则之一生成告报，无论 Web 服务器是否已被零日攻击攻破，并不重要；警报标志着由于目标系统被以可疑的方式使用，已检测到成功利用的潜在影响。\n\
  \n零日漏洞问题已帮助催生了一类新的安全供应商，他们开发网络异常检测系统，这些产品旨在检测计算机网络内部的异常行为。这些目标是为了检测攻击者在成功攻破后使用网络内系统的方式。不过，需要提醒的是：截至本文写作时，我还没有看到有供应商以足够实用的方式来定义什么是`anomaly`。\n\
  \n问题在于，网络表现出如此惊人的异质性，以以区分正常行为和非正常行为。然而，这一领域在网络和单机方面都有大量的研究，并写了一些出色的论文。\n\n\n\n\n\
  例如，Steven A. Hofmeyr 的《UNIX 进程的自我感知》一文发表于 1996 年的 IEEE 会议集，该文研究了 `Sendmail` 和 `lpr`\
  \ 在正常情况下与受到攻击时系统调用序列中的统计离群值。你可以在 [http://www.cs.unm.edu/∼immsec/publications/ieee-sp-96-unix.pdf#search=%22a%20sense%20of%20self%20for%20processes%22]\
  \ 下载论文。\n\n# 端口敲门 (Port Knocking)\n\n2003 年，Martin Krzywinski 在 *SysAdmin* 杂志的一篇文章中向安全社区引入了一个名为\
  \ `port knocking`（端口敲门）的绝妙概念。`port knocking` 是跨关闭端口的身份验证数据通信，使得服务（如 `SSHD`）可以保护在配置为“默认丢弃（default-drop）”策略的数据包过滤器之后。任何想要通过默认丢弃数据包过滤器连接到受保护服务的潜在客户端，必须首先证明自己拥有有效的端口敲门序列。如果客户端生成了正确的敲门序列（例如，通过按顺序连接到序列中的每个组成端口），则数据包过滤器将临时重新配置，允许发送该序列的\
  \ IP 地址在短时间内连接到受保护的服务。\n\n通常，端口敲门系统要么监控防火墙日志，要么使用原始数据包捕获机制（如 `libpcap`）来从端口敲门客户端收集敲门序列。我们稍后会看到\
  \ `iptables` 日志消息非常适合提供端口敲门序列数据。我们还将看到，虽然端口敲门是一项具有引人注目的创新的技术（即保护在默认丢弃数据包过滤器后的服务），但一种名为\
  \ `SPA` 的相关技术提供了与端口敲门相同的益处，同时消除了它的许多局限性。但在之前，我们需要一些关于端口敲门的背景知识。\n\n端口敲门迅速取得了成功，在安全领域中出现了近\
  \ 30 种已知的端口敲门方案实现，每种实现都对端口敲门概念有略有不同的改进。例如，`cd00r` 和 `portkey` 使用 `TCP SYN` 包来通信端口敲门序列，而\
  \ `Tumbler` 则使用数据包负载来发送哈希身份验证数据。（更多端口敲门方案的示例，请参见 [`www.portknocking.org.`](http://www.portknocking.org.)）我们稍后会看到，没有任何禁止使用数据包负载（而非仅数据包头）来发送身份验证数据——在这些实现中仍然可以实现在默认丢弃数据包过滤器后隐藏服务。\n\
  \n端口敲门序列可以是共享的非加密的端口集，也可以是使用对称密码（如 `Rijndael`）加密的端口集（这些方案的细节可见第 218 页的“共享端口敲门序列”和第\
  \ 221 页的“加密端口敲门序列”）。\n\n图 12-1 描述了一个网络图，其中使用端口敲门客户端针对一个运行着 `iptables` 防火墙和端口敲门服务器的\
  \ Linux 系统生成端口敲门序列。由于端口敲门从不需要双向通信（例如建立 `TCP` 连接所需的三次握手），因此端口敲门序列可以从虚假的 IP 地址进行伪装。这使得端口敲门序列可以来自任意\
  \ IP 地址，但敲门服务器接受连接到受保护服务的实际源 IP 地址被编码在序列本身。例如，你可以伪造一个序列，使其看起来源自源 IP 地址 `22.1.1.1`\
  \ 并发送到运行在 IP 地址 `33.2.2.2` 上的敲门服务器。然而，你发起连接的真实源 IP 地址是是 `207.44.10.34`。通过在序列中编码\
  \ `207.44.10.34` 地址，敲门服务器将授予你的真实 IP 地址而非伪造的源 IP 地址 `22.1.1.1`。将真实源 IP 地址包含在端口敲门序列中仅在序列加密时才有意义，因为恶意的第三方无法拦截伪造的序列并轻易判断真实连接来自哪里。虽然图\
  \ 12-1 中没有明确说明，但理解是客户端系统在 `iptables` 连接之前生成了端口敲门序列。\n\n## 阻止 Nmap 和目标识别\n\n端口敲门序列由端口敲门服务器监控，该服务器是“被动的”——例如，通过监控防火墙或使用如\
  \ `libpcap` 等数据包捕获工具。使用 `libpcap` 的结果对任何人都是不可见的。对于 `Nmap` 来说，攻击者是否拥有 `default-drop`\
  \ 过滤器没有任何区别。\n\n## 共享端口敲门序列\n\n`port-knocking` 序列是一个约定的共享非加密端口集。当在网络上看到 `port-knocking`\
  \ 序列时，`default-drop` 过滤器将被重新配置以允许访问端口 20 的 `SSHD`。以下数字在 `/var/log/messages` 文件中以粗体显示：\n\
  \n``` fetch[root@iptables]# tail -f /var/log/messages\nOct 30 21:39:38 kernel: [IN=eth0\
  \ OUT= MAC=00:xx:xx:xx:xx:xx SRC=192.168.1.1 DST=192.168.1.100 PROTO=TCP SPT=47344\
  \ DPT=5005 TCP [SYN] seq=12345 ack=0 window=64240 [flags=SYN]\n``` \nOct 30 21:39:41\
  \ kernel: [IN=eth0 OUT= MAC=00:xx:xx:xx:xx:xx SRC=192.168.1.1 DST=192.168.1.100\
  \ PROTO=TCP SPT=49371 DPT=5008 TCP [SYN] seq=67890 ack=0 window=64240 [flags=SYN]\n\
  ```（等待，修正）\nOct 30 21:39:48 kernel: [IN=eth0 OUT= MAC=00:xx:xx:xx:xx:xx SRC=192.168.1.1\
  \ DST=192.168.1.100 PROTO=TCP SPT=59255 DPT=1002 TCP [SYN] seq=11223 ack=0 window=64240\
  \ [flags=SYN]\n``` \nOct 30 21:39:54 kernel: [IN=eth0 OUT= MAC=00:xx:xx:xx:xx:xx\
  \ SRC=192.168.1.1 DST=192.168.1.100 PROTO=TCP SPT=49371 DPT=1050 TCP [SYN] seq=44556\
  \ ack=0 window=64240 [flags=SYN]\n```\n\n（注：上面的日志条目是文中描述序列的说明性表示）。\n\n\n\n\n端口敲击序列（Port-knocking\
  \ sequences）还可以包含 `TCP` 以外的其他互联网协议；`UDP`、`ICMP` 甚至这三种协议同时组成一个序列。这样的序列可能像 `TCP/10001`、`UDP/2300`、`ICMP\
  \ Echo Request`、`TCP/6005`、`UDP/3000`。\n\n### 注意\n\n在端口敲击序列中包含 `ICMP` 数据包是对端口敲击定义的轻微偏离，因为\
  \ `ICMP` 并没有“端口”的概念。然而，这并不是严重的违规，因为端口敲击本质上是在数据包头部中编码信息；并没有任何规定禁止在序列中使用 `ICMP`。\n\
  \n事实上，`TCP` 或 `UDP` 头部中端口字段以外的字段也可以用于在端口敲击序列中编码额外信息。例如，`UDP` 头部中 16 位的校验和字段可以由端口敲击客户端手动设置为一个预定值，并可以开发一个端口敲击服务器，只有当校验和与该值匹配时才接受该\
  \ `UDP` 数据包作为序列的一部分。列表 12-1 显示了一个 Perl 代码段，允许用户针对任意 `UDP` 端口将 `UDP` 头部中的校验和字段构造为提供的十六进制值。\n\
  \n### 注意\n\n该脚本位于 [`www.cipherdyne.org/linuxfirewalls`](http://www.cipherdyne.org/linuxfirewalls)。你需要从\
  \ CPAN 获取 `Net::RawIP` Perl 模块才能运行它（参见 [`search.cpan.org/~skolychev/net-rawip-0.2/rawip.pm`](http://search.cpan.org/~skolychev/net-rawip-0.2/rawip.pm)）。\n\
  \n当然，从协议的角度来看，手动定义的校验和值几乎是无效的，因此敏锐的观察者可能会在网络流量中注意到它们。某些以太网嗅探器如 `Wireshark`(参见 [`www.wireshark.org`](http://www.wireshark.org))会自动根据数据包头部和数据验证校验和，并在出现差异时警告用户。`Netfilter`自\
  \ 2.6 内核系列以来也可以通过其连接跟踪系统验证校验和值。\n\n```\n $ cat craft_udp_checksum.pl\n#!/usr/bin/perl\
  \ -w\n\nuse Net::RawIP;\nuse strict;\n\nmy $src  = $ARGV[0] || &usage();\nmy $dst\
  \  = $ARGV[1] || &usage();\nmy $port = $ARGV[2] || &usage();\nmy $sum  = $ARGV[3]\
  \ || 0;\n\n$sum = hex $sum;\n\nmy $raw_udp = new Net::RawIP({\n    ip => {\n   \
  \     saddr => $src,\n        daddr => $dst\n    },\n    udp =>{}}\n);\n\n$raw_udp->set({\n\
  \    ip  => {\n        saddr => $src,\n        daddr => $dst\n    },\n    udp =>\
  \ {\n        source => 30401,\n        dest   => $port,\n        check  => $sum\n\
  \    },\n});\n\nprintf \"[+] Sending UDP packet $src -> $dst ($port) with checksum\
  \ %x\\n\",\n    $sum;\n$raw_udp->send();\n\nexit 0;\n\nsub usage() {\n    die \"\
  [*] $0 <src> <dst> <port> <checksum>\";\n}\n```\n\n*列表 12-1：一个 UDP 校验和构造脚本*\n\n\
  按照如下方式执行上述脚本并使用以太网嗅探器观察 UDP 数据包，你可以清晰地看到从命令行提供的构造校验和 `0xdeed`（**加粗**）：\n\n```\n\
  \ # ./craft_udp_checksum.pl 192.168.10.3 192.168.10.1 5005 deed\n### tcpdump -i\
  \ eth1 -l -nn -s 0 -X port 5005\ntcpdump: verbose output suppressed, use -v or -vv\
  \ for full protocol decode\nlistening on eth1, link-type EN10MB (Ethernet), capture\
  \ size 65535 bytes\n02:21:46.652478 IP 192.168.10.3.30401 > 192.168.10.1.5005: UDP,\
  \ length 0\n     0x0000:  4510 001c 0000 4000 4011 a56c c0a8 0a03  E.....@.@..l....\n\
  \     0x0010:  c0a8 0a01 76c1 138d 0008 deed 0000 0000  ....v...........\n     0x0020:\
  \  0000 0000 0000 0000 0000 0000 0000 0000       ..............\n```\n\n## 加密的端口敲击序列\n\
  \n端口敲击序列可以使用对称密码进行加密，例如美国标准与技术研究院（NIST）为美国高级加密标准选择的 `Rijndael` 算法。这为端口敲击序列引入了强大的加密层，代价是必须进行相关的密钥管理。\n\
  \n将尽可能多的信息编码到加密的端口敲击序列是有是有的。`TCP` 或 `UDP` 头部中端口字段以外的字段也可以用于在端口敲击序列中编码额外信息。例如，`UDP`\
  \ 头部中 16 位的校验和字段可以由端口敲击客户端手动设置为一个预定值，并可以开发一个端口敲击服务器，只有当校验和与该值匹配时才接受该 `UDP` 数据包作为序列的一部分。\n\
  \n当然，从协议的角度来看，手动定义的校验和值几乎是无效的，因此敏锐的观察者可能会在网络流量中注意到它们。某些以太网嗅探器如 `Wireshark`会自动根据数据包头部和数据验证校验和，并在出现差异时警告用户。`Netfilter`自\
  \ 2.6 内核系列以来也可以通过其连接跟踪系统验证校验和。\n\n```\n $ cat craft_udp_checksum.pl\n#!/usr/bin/perl\
  \ -w\n\nuse Net::RawIP;\nuse strict;\n\nmy $src  = $ARGV[0] || &usage();\nmy $dst\
  \  = $ARGV[1] || &usage();\nmy $port = $ARGV[2] || &usage();\nmy $sum  = $ARGV[3]\
  \ || 0;\n\n$sum = hex $sum;\n\nmy $raw_udp = new Net::RawIP({\n    ip => {\n   \
  \     saddr => $src,\n        daddr => $dst\n    },\n    udp =>{}}\n);\n\n$raw_udp->set({\n\
  \    ip  => {\n        saddr => $src,\n        daddr => $dst\n    },\n    udp =>\
  \ {\n        source => 30401,\n        dest   => $port,\n        check  => $sum\n\
  \    },\n});\n\nprintf \"[+] Sending UDP packet $src -> $dst ($port) with checksum\
  \ %x\\n\",\n    $sum;\n$raw_udp->send();\n\nexit 0;\n\nsub usage() {\n    die \"\
  [*] $0 <src> <dst> <port> <checksum>\";\n}\n```\n\n*列表 12-1：一个 UDP 校验和构造脚本*\n\n\
  如果你按照如下方式执行上述脚本并使用以太网嗅探器观察 UDP 数据包，你可以清晰地看到从命令行提供的构造校验和 `0xdeed`（**加粗**）：\n\n```\n\
  \ # ./craft_udp_checksum.pl 192.168.10.3 192.168.10.1 5005 deed\n### tcpdump -i\
  \ eth1 -l -nn -s 0 -X port 5005\ntcpdump: verbose output suppressed, use -v or -vv\
  \ for full protocol decode\nlistening on eth1, link-type EN10MB (Ethernet), capture\
  \ size 65535 bytes\n02:21:46.652478 IP 192.168.10.3.30401 > 192.168.10.1.5005: UDP,\
  \ length 0\n     0x0000:  4510 001c 0000 4000 4011 a56c c0a8 0a03  E.....@.@..l....\n\
  \     0x0010:  c0a8 0a01 76c1 138d 0008 deed 0000 0000  ....v...........\n     0x0020:\
  \  0000 0000 0000 0000 0000 0000 0000 ..............\n```\n\n## 加密的端口敲击序列\n\n端口敲击序列可以使用对称密码进行加密，例如美国标准与技术研究院（NIST）为美国高级加密标准选择的\
  \ `Rijndael` 算法。这为端口敲击序列引入了强大的加密层，代价是必须进行相关的密钥管理。\n\n将尽可能多的信息编码到加密的端口敲击序列是有益的...\n\
  \n\n\n尽管端口敲门（port knocking）可以为可能包含未发现漏洞的网络服务提供额外的保护，但端口敲门架构的某些特性使其显得相当脆弱，且无法扩展到企业级部署。这些局限性源于使用数据包头作为数据传输机制，而不是使用应用层负载。正如我们很快将看到的，SPA（在第\
  \ 226 页的“单包授权”中讨论）解决了传统端口敲门实现中的许多局限性。\n\n## 序列重放问题\n\n在当今安全威胁横行的世界里，我们应该假设所有流量在跨网络传输时都会被未知的第三方监控。坚决地坚持这一观点，提供了充足的动力，来确保敏感信息（如信用卡号）仅以加密形式在网络上传输。\n\
  \n在端口敲门的情况下，没有数据包与数据包关联的应用层数据，因此似乎没有理由去拦截端口敲门序列。\n\n然而，端口敲门的目标是在网络上传输足够的信息，让接收者推断出应该临时重新配置包过滤器，从而授予通过敲门序列证明了其身份的\
  \ IP 地址访问权限。如果攻击者能够在端口敲门序列通过网络传输时将其拦截，那么攻击者很容易在稍后的时间向同一目标发送完全相同的敲门序列。这被称为`重放攻击`（replay\
  \ attack），因为攻击者正在对目标重放敲门序列，试图图获得与合法的端口敲门客户端相同的访问权限。由于端口敲门仅使用数据包头，很难在敲门序列中构建足够的变体来阻止重放攻击。\n\
  \n某些端口敲门实现使用哈希函数的连续迭代（类似于 RFC 1760 中定义的 S/Key 身份验证）来阻止重放攻击，但这些方法要求客户端和服务器都存储某些状态信息。或者，我们可以在授予访问权限后，简单地更改共享的端口敲门序列或每个加密序列的解密密码，但这非常繁琐，对于大量用户来说显然不具备扩展性。（我们将在第\
  \ 226 页的“单包授权”中看到，有一种更优雅的方法来击败重放攻击。）\n\n## 最小数据传输率\n\n由于 TCP 和 UDP 头部中的端口字段宽度为 16\
  \ 位，如果我们假设端口敲门实现仅使用敲门序列中每个数据包的目标端口号，则每个包只能传输两个字节的信息。此外，由于端口敲门没有像 TCP 那样的保证顺序交付和数据包重传机制（端口敲门是严格单向的），我们无法在不在每个连续数据包之间添加时间延迟的情况下，向网络发送完整的端口敲门序列。我们需要时间延迟来保持敲门序列的正确顺序，因为数据包可能通过不同的路径到达——其中某些路径可能比其他路径慢。\n\
  \n虽然没有适用于所有网络的最优延迟（事实上，如果丢失了敲门序列中的某个成员，整个序列必须重新传输），但半秒的延迟是一个很好的起点。\n\n因此，对于一个使用具有\
  \ 128 位块大小的对称加密器加密的端口敲门序列（本章前面提到过的 Rijndael 算法的最小块大小），我们得到的最小长度为八个数据包（128 位 ÷ 每个包\
  \ 16 位 = 8 个数据包）。在每个数据包之间添加半秒延迟意味着，仅传输该序列就需要四秒钟，如果需要发送更多数据，则每两个数据包就会增加一整秒。正是这种漫长的传输时间使得构建发送超过几个字节的端口敲门序列变得不实际。\n\
  \n### 注意\n\n由于端口敲门的数据传输能力非常有限，使用非对称加密算法来加密端口敲门序列是不可能的。即使仅使用 GnuPG 和带有 2048 位密钥的\
  \ Elgamal 算法加密 10 字节的信息，也会导致数百字节的加密信息。\n\n## 敲击序列与端口扫描\n\n正如第 3 章 中讨论的，端口扫描涉及在短时间内对目标系统上的多个端口进行的一系列连接。在链路上进行检查时，端口敲门序列显然符合这一定义，尽管端口扫描与敲门序列的目标完全不同。问题在于，任何监控端口扫描的入侵检测系统（IDS）都无法区分这两种活动，并会对这两种产生警报。这些警报可能会给使用端口敲门对远程服务进行身份验证的人带来不受欢迎的关注。\n\
  \n### 注意\n\n我认识某个人（我们称他为 Bob），因为公司安全策略禁止端口扫描，他被要求辞去他的职位。为了增强安全性，Bob 反复扫描了他的家庭系统以确保服务无法被访问，但本地\
  \ IDS 捕到了该活动。如果 Bob 使用的是端口敲门系统，IDS 警报就会响起。当然，这是一个极端例子，但它强调了这一点：没有理由给自己引起不必要的关注。\n\
  \n## 使用伪造数据包瓦解敲击序列\n\n由于端口敲门仅将信息编码在数据包头内（而不是依赖加密的应用层数据），因此攻击者很容易伪造数据包，使其看起来像合法敲门序列的一部分。如果攻击者在端口敲门序列通过网络传输过程中伪造一个重复数据包，敲门服务器无法判断该额外数据包不是来自敲门客户端的真实序列；结果是客户端似乎不知道有效的敲门序列。这是针对敲门服务器的拒绝服务（DoS）攻击，因为攻击者可以强制服务器不向合法的敲门客户端提供访问。DoS\
  \ 攻击可以是复杂的（例如从僵尸网络向单个 IP 地址泛洪流量），但也可以极其简单；使用单个数据包对端口敲门服务器进行 DoS 攻击极其容易——可以在任何地方进行伪造！\n\
  \n为了说明这种攻击，假设端口敲门客户端和服务器约定了以下敲击序列，以开启 TCP 22 端口 30 秒（所有包均为 TCP SYN 包）：1001, 2004,\
  \ 5005, 1001, 1000。现在，假设 IP 地址 `123.4.3.2` 开始向运行在 IP 地址 `231.1.2.3` 的敲门服务器发送序列，每个数据包之间有半秒延迟。如果攻击者可以在序列通过网络传输时监控它，那么以下\
  \ `hping` 命令的使用将看起来敲门客户端实际上发送了“1001, 2004, 5005, 5005, 1001, 1000”序列（注意端口 5005 的重复包）：\n\
  \n```\n[root@attacker ~]# hping -S -p 5005 -c 1 -a 123.4.3.2 231.1.2.3\nHPING 231.1.2.3\
  \ (eth0 231.1.2.3): S set, 40 headers + 0 data bytes\n\n--- 231.1.2.3 hping statistic\
  \ ---\n1 packets transmitted, 0 packets received, 100% packet loss\nround-trip min/avg/max\
  \ = 0.0/0.0/0.0 ms\n```\n\n\n\n因此，端口敲门服务器只能将敲门序列视为无效并丢弃，因为它看起来源自真实客户端的 IP 地址。因此，不会授予\
  \ SSH 访问，这在图 12-2 中所示。\n\n![攻击者向端口敲门序列注入伪造的数据包，导致 DoS](img/httpatomoreillycomsourcenostarchimages207404.png)\n\
  \n图 12-2. 攻击者向端口敲门序列注入伪造的数据包，导致 DoS\n\n* * *\n\n^([71]) 3 Martin Krzywinski, \"\
  Port Knocking: Network Authentication Across Closed Ports,\" *SysAdmin* 12 (2003):\
  \ 12–17.\n\n^([72]) 4 “一组加密端口”意味着端口序列定义了一系列字节值，而该序列本身被用作加密算法的输入。其结果是一组新的字节值，对应于新的端口号。这在章节的稍后部分将变得更加清晰。\n\
  \n^([73]) 5 如果端口敲门服务器或其依赖的任何库（如 `libpcap`）存在漏洞，那么攻击者仍然可能攻破部署了端口敲门方案的系统。然而，寻找这样的系统并不像使用\
  \ `Nmap` 扫描那些乐于暴露自身存在的漏洞服务那么简单。\n\n## 单包授权 (Single Packet Authorization)\n\n端口敲门向我们展示了如何最大化利用包过滤器，对所有通信受保护服务的尝试执行默认丢弃（default-drop）策略.^([74])\
  \ 然而，如本章前面所示，端口敲门并非万能药，它具有显著的架构局限性。在本节中，我们将探索一种端口敲门的替代方案，它在保留其优势的同时避免其缺点。\n\n`Single\
  \ Packet Authorization (SPA)` 以类似于端口敲门实现的方式将默认丢弃包过滤器与被动监控的数据包嗅探器相结合。然而，SPA 并不是在包头字段内传输认证数据，而是利用有效负载（payload）数据来证明拥有身份凭据。这之所以有效是因为大多数网络的\
  \ MTU 大在几百字节左右（例如，以太网 MTU 为 1514 字节，包括以太网头部），因此只需要单个包即可向 SPA 服务器传达身份。\n\n由于端口敲门和\
  \ SPA 共享默认丢弃包过滤器和被动监控设备的概念，图 12-3 中的图与图 12-1 非常相似，后者说明了端口敲门。但这次只需要一个包向 SPA 服务器传输认证信息，因此从（伪造的）SPA\
  \ 源地址到 `iptables` 系统只有一条线；在真实的 SSH 会话开始之前不需要数据包序列。我们很快就会看到这是端口敲门方案之外的重要创新。\n\n![SPA\
  \ 网络](img/httpatomoreillycomsourcenostarchimages207436.png)\n\n图 12-3. SPA 网络\n\n\
  ## 端口敲门的局限性\n\n端口敲门协议带来的问题简要总结如下：\n\n*   很难阻止能够监控端口敲门序列的攻击者进行重放攻击。\n*   缺乏有效的数据传输限制了可能用于加密序列数据的类型类型，甚至是加密系统。\n\
  *   当在网络上发送端口敲门序列时，任何中间 IDS 可能会触发警报。\n*   执行序列破坏攻击（sequence-busting attacks）轻而容易，因为包头并不难复制和伪造。\n\
  \n通过使用 SPA 中的负载数据，我们可以克服这些每一个缺陷：\n\n*   SPA 通过在每个 SPA 包中包含随机数据解决了重放问题。每个 SPA 包都是根据定义良好的明文包格式构建的（由\
  \ `fwknop` 使用的特定格式将在第 13 章 中进行讨论）。该格式为随机数据留出了空间，一旦包构建完成，就会被加密。包含随机数据确保了没有两个 SPA\
  \ 包是相同的——即使它们向 SPA 服务器发起了相同的访问请求。通过在服务器端存储每个成功解密的 SPA 包的 `MD5` 和，我们可以重复发送相同的访问请求，而深知没有两个\
  \ SPA 包会具有相同的 `MD5` 和。因此，通过比较任何新 SPA 包与之前监控的数据包的 `MD5` 和，可以轻松地挫败重放攻击。\n*   SPA 通过使用\
  \ IP 包的负载部分解决了数据传输问题，类似于 `TCP` 封装应用层数据的方式。使用包负载有利于使用非对称密码进行加密，因为包负载可以传输的数据量比任何端口敲门实现（后者仅使用头部）都要多得多。我们甚至可以在\
  \ SPA 之上构建一个命令通道（即在加密的 SPA 负载中进行完整命令通信）。我们将在第 13 章 中看到，`fwknop` 同时支持访问请求和完整的命令通道实现。\n\
  *   SPA 确保了其网络通信看起来并不像端口扫描，因为它只使用单个包来传输认证信息。这样一来，IDS 不会看到针对一系列端口的一系列探测。由于 SPA 负载是加密的，IDS\
  \ 也无法解码 SPA 消息的内容；任何嗅探者都会看到 SPA 包只是一个段无法理解的负载数据块。\n*   使用 SPA 挫败了伪造攻击，因为攻击者无法仅仅通过从\
  \ SPA 客户端系统向服务器伪造包来轻易破解 SPA 协议。（当然，任何在网络上检查包数据的系统如果被垃圾包数据淹没都会受到 DoS 攻击，但这并不是 SPA\
  \ 协议本身的缺陷。）\n\n## SPA 的架构局限性\n\n尽管 SPA 在减少服务对潜在攻击者的暴露方面提供了安全优势，但它也有局限性。我们将探索这些，以便你对如何最佳部署\
  \  明智决定。端口敲门也存在这些局限性。\n\n### 通过 NAT 地址进行访问附加\n\n包过滤器通常擅长过滤传输层及以下的流量，但不擅长解释应用层。因此，SPA\
  \ 守护进程在接收有效 SPA 包后接受入站连接时应用的过滤标准，现实中只能包含源 IP 地址、请求的 Internet 协议和端口号。也就是说，当一个 SPA\
  \ 包指示 SPA 服务器“为某些源 IP 地址打开 30 秒 TCP 22 端口”时，SPA 服务器配置包过滤器，接受在 30 秒时间窗口内从源 IP 地址连接到端口\
  \ 22 的任何数据包。如果 SPA 包内的 IP 地址是外部 NAT 地址（如果 SPA 客户端位于 NAT 设备之后，则这是必要的），那么与合法客户端在同一内部网络上的任何人在允许的时间内都将拥有访问权限.^([75])\n\
  \n### HTTP 和短寿命会话\n\n\n\n\n\n当 SPA 守护进程在数据包过滤器规则集中添加一条临时规则以允许建立 TCP 连接时，合法客户端通常有足够的时间完成\
  \ TCP 三次握手。然而，SSH 会话的持续时间通常比将一个 TCP 连接推入建立状态所需的时间长得多。\n\n当规则从规则集中删除时会发生什么？通过使用连接跟踪机制（例如由\
  \ `Netfilter` 提供的），在被默认丢弃（default-drop）规则拦截之前接受已建立连接的数据包，即使允许建立会话的初始规则已被删除，连接仍然保持开启状态。\n\
  \n使用连接跟踪机制保持已建立的 TCP 连接开放为长时间 TCP 会话提供了一个优雅的解决方案，但对于短连接（例如通过 Web 传输 HTTP 数据，或在邮件服务器之间传输\
  \ SMTP 数据）又是怎样的？为用户想要查看的每个网页链接都生成一个新的 SPA 数据包将是不方便的；由于每个链接都通过独立的 TCP 连接传输，这一事实使得问题变得更加复杂。通常情况下，`SPA`\
  \ 并不适用于保护此类服务。\n\n解决此问题的方法之一是扩展客户端 IP 地址的超时时间，使其在例如一小时内不需要新的 SPA 数据包。虽然这种扩展在一定程度上降低了\
  \ `SPA` 的效率，但如果你的 Web 服务器运行着关键应用程序且安全是最重要的考虑因素，那么这样做是有意义的。也可以通过在本地文件系统中缓存加密密码，让\
  \ SPA 客户端自动生成 SPA 数据包。然而，通常情况下，将加密密码（这可能会削弱 `GnuPG` 密钥的安全性）放在文件系统中并不是好主意。尽管如此，一个有效的步骤是将\
  \ `SPA` 客户端尽可能与许多客户端程序深度集成。关于 `OpenSSH` 的这一示例，请参见第 252 页上的“fwknop OpenSSH Integration\
  \ Patch”。\n\n***\n\n⁶ 这完全符合解决“默认许可”（default permit）的尝试，这在 Marcus Ranum 的《计算机安全六个最愚蠢的想法》中位列首位（参见\
  \ [`www.ranum.com`](http://www.ranum.com)）。*默认许可*是默认丢弃（default drop）的对面，它是互联网的基础原则之一：对信息的不受限制访问和共享。这一原则在计算机安全漏洞和入侵并不寻常的时代运行得很好，但那些日子已经一去不复了。\n\
  \n⁷ NAT 地址背后的搭便（piggy-backing）问题可以通过 Tor 网络提供的 `MapAddress` 功能来缓解，但该功能引入了其他缺点，正如我们在第\
  \ 254 页的“SPA over Tor”中讨论的。\n\n⁸ 在某些情况下可以保持 Web 连接开启；参见 Apache 中的 `KeepAlive` 指令（参见\
  \ [`httpd.apache.org/docs/1.3/mod/core.html#keepalive`](http://httpd.apache.org/docs/1.3/mod/core.html#keepalive)）。\n\
  \n# 隐蔽实现安全？\n\n端口触发（port knocking）或 `SPA` 是否属于隐蔽实现安全的范畴？自从端口触发首次向安全社区公布以来，这一直是一个激烈争议的话题，双方都有强烈的观点。无疑，争议在这里不会得到解决；我的希望是提供一些思考的。\n\
  \n当一种新的安全技术被提出时，全球的研究人员都会对其架构进行审查。安全技术的常见测试之一是它是否遭受“隐蔽实现安全”的影响；如果是，人们会尝试修复架构。因此，确定\
  \ `SPA` 是否遭受隐蔽实现安全的影响是非常重要的。Bruce Schneier 在《应用密码学》（*Applied Cryptography*）的序言中写：\n\
  \n> . . . 如果我拿一封信，把它锁在保险箱里，把保险箱藏在纽约某处，然后让你读信，那不是安全。那是隐蔽。另一方面，如果我拿一封信并锁在保险箱里，然后把保险箱连同设计规范以及数百个带有密码的相同保险箱交给你，让你和世界上最好的开锁专家可以研究锁定机制——而你仍然无法打开保险箱并读信——那就是安全。\
  \ . . .\n\n任何端口触发或 `SPA` 的开源实现都类比于提供了保险箱内部构造的所有细节。从加密算法到每部分软件如何与数据包过滤器接口，一切都是对所有人可见的。只有当加密的\
  \ `SPA` 数据包或端口触发序列穿越网络时，隐藏的仅仅是加密密钥本身，而强大的加密系统不会因为加密密钥没有向世界公布就遭受隐蔽实现安全的影响。\n\n现在，考虑一个比端口触发或\
  \ `SPA` 更弱的安全系统。假设在 `OpenSSH` 服务器守护进程的某个函数中发现了漏洞，我创建了一个假设的 `OpenSSH` 补丁，要求所有远程 SSH\
  \ 客户端访问该函数的尝试都必须提供一些加密数据。这些数据将使用已知且经过审查的加密算法，如 `Rijndael` 或 `GnuPG` 使用的 `Elgamal`\
  \ 算法。\n\n有人可能会认为（我也这么认为），在这个假设的示例中，利用该漏洞进行攻击的可能性被降低到了只要加密算法是安全的程度，因此，这种修复并不依赖于隐蔽实现安全。\n\
  \n端口触发（至少在其加密形式中）和 `SPA` 提供了比这个人为示例更好的安全属性，因为恶意客户端在没有提供类似的加密数据之前，甚至无法与 SSH 服务器上的\
  \ TCP 栈建立 TCP 会话，更不用与 SSH 守护进程了。因此，在端口触发和 `SPA` 中，我们本质上有一种泛化机制，使得在没有提供这段加密数据之前，`OpenSSH`\
  \ 守护进程中的*所有*函数都是不可访问的。因此，端口触发和 `SPA` 都不应被仅仅视为隐蔽实现安全的技术。\n\n***\n\n⁹ 这些想法中的许多是由 Sebastien\
  \ Jeanquier 在伦敦大学皇家霍洛伊学院信息安全小组的硕士论文《端口触发与单数据包授权分析》中提出的（参见 [`www.isg.rhul.ac.uk`](http://www.isg.rhul.ac.uk)）。\n\
  \n# 结语\n\n\n\n\n\n有些人偏好于编写脚本，通过监控 `/var/log/auth.log`（具体文件取决于你的 syslog 守护进程配置）中报告的重复\
  \ `Authentication failure for root` 消息来检测攻击者何时尝试通过 SSHD 暴力破解密码。然而，如果在 `OpenSSH`（或另一个\
  \ SSH 实现）的某个无需通过用户名/密码验证即可远程访问的函数中发现了新的缓冲区溢出漏洞，这种方法将几乎毫无用。甚至有 Snort 规则可以在 SSH 连接上执行明文\
  \ IDS，以检测针对 Buqtraq 2347 号报告的 `CRC32` 溢出漏洞的利用尝试（参见 Snort 规则 ID 1324、1326 和 1327）。拥有了这种利用程序，攻击者无需尝试暴力破解密码，甚至不需要进入\
  \ SSH 通常要求的加密/解密协议。更好的策略是从根本上不让任意 IP 地址连接到你的 SSH 守护进程。这就是 `SPA` 发挥用场的地方，在第 13 章\
  \ 中，我将向你展示如何部署 `fwknop`，通过在 SSH 守护进程之上叠加 `SPA` 和 `iptables` 来获得最大收益。在这样的配置下，针对 SSHD\
  \ 的零日漏洞利用和暴力破解密码尝试都是徒劳的。\n\n# 第 13 章 介绍 FWKNOP\n\nFireWall KNock OPerator (`fwknop`，参见\
  \ [`www.cipherdyne.org/fwknop`](http://www.cipherdyne.org/fwknop)）于 2004 年 6 月以\
  \ GNU 公用许可证 (GPL) 作为开源项目发布。它是第一个将加密端口敲与被动操作系统指纹识别相结合的端口敲实现，使得仅允许 Linux 系统连接到你的 SSH\
  \ 守护进程成为可能。（端口敲客户端系统的 TCP 栈充当了额外的身份验证参数）。`fwknop` 的端口敲组件基于 `iptables` 日志消息，并使用 `iptables`\
  \ 作为默认丢弃的数据包过滤器。\n\n2005 年 5 月，我为 `fwknop` 发布了单包授权（SPA）模式，因此 `fwknop` 成为第一个公开的 SPA\
  \ 软件。截至本文写作，`fwknop-1.0` 是最新可用版本，`SPA` 身份验证方法是默认方法，尽管 `fwknop` 继续支持旧的端口敲方法。MadHat\
  \ 在 2005 年 7 月的 Black Hat 会议上提出了“Single Packet Authorization”（单包授权）这一术语。我向同一场会议提交了类似的提案进行演示，但\
  \ `Single Packet Authorization` 比起我的标题——`Netfilter and Encrypted, Non-replayable,\
  \ Spoofable, Single Packet Remote Administration`——读起来要顺口得多。值得注意的是，由 tumbler 项目\
  \ ([`tumbler.sourceforge.net`](http://tumbler.sourceforge.net)) 实现的一种协议与 `SPA` 相似之处在于，它只使用单个数据包传输身份验证和授权信息；然而，它的负载是哈希过的而非加密，这导致了完全不同的架构。\n\
  \n### 注意事项\n\n`fwknop` 确实支持身份验证（authentication——验证正在通信内容的实体的数字身份的过程）和授权（authorization——尝试确定实体是否有权限执行某项操作的过程），对于想要访问默认丢弃数据包过滤器后服务的远程客户端。这两个过程是不相同的，并且在各自的领域都是重要的。\n\
  \n## fwknop 安装\n\n安装 `fwknop` 起于从 [`www.cipherdyne.org/fwknop/download`](http://www.cipherdyne.org/fwknop/download)\
  \ 下载最新的源码 tar 包或 RPM。按照惯例，验证 MD5 校验和是明智的；从安全角度来看，使用 `GnuPG` 检查 `GnuPG` 签名是否通过更好。[78]\
  \ 一旦确定下载的文件是安全的，就可以继续安装。以下是安装 `fwknop` 1.0 版本的源码 tar 包的方法：\n\n```\n$ cd /usr/local/src\n\
  $ wget http://www.cipherdyne.org/fwknop/download/fwknop-1.8.1.tar.bz2\n$ wget http://www.cipherdyne.org/fwknop/download/fwknop-1.8.1.tar.bz2.md5\n\
  $ md5sum -c fwknop-1.8.1.tar.bz2.md5\n$ fwknop-1.8.1.tar.bz2: OK\n$ wget http://www.cipherdyne.org/fwknop/download/fwknop-1.8.1.tar.bz2.asc\n\
  $ gpg --verify fwknop-1.8.1.tar.bz2.asc\ngpg: Signature made Wed Jun 6 01:27:16\
  \ 2007 EDT using DSA key ID A742839F\ngpg: Good signature from \"Michael Rash <mbr@cipherdyne.org>\"\
  \ngpg:                 aka \"Michael Rash <mbr@cipherdyne.com>\"\n$ tar xfj fwknop-1.8.1.tar.bz2\n\
  $ su -\nPassword:\n# cd /usr/local/src/fwknop-1.8.1\n# ./install.pl\n```\n\n正如在第\
  \ 5 章 中安装 `psad` 一样，`install.pl` 脚本将提示你提供一些信息，例如授权模式（即你是想使用 `SPA` 模式还是旧的端口敲模式）以及你希望\
  \ `fwknop` 嗅探数据包的接口。\n\n你可以在仅支持作为 `SPA` 客户端发送 `SPA` 包的系统上安装 `fwknop$，也可以可以在完全支持发送\
  \ `SPA` 包以及从网络中嗅探数据包的系统上安装（这是默认设置）。完整安装 fwknop 会在系统中创建几个文件和目录以支持正常操作，如下：\n\n**/usr/bin/fwknop**\n\
  \n这是负责接受用户输入的密码的客户端程序；构建符合 `fwknop` 数据包格式的 `SPA` 包；使用 `Rijndael` 对称加密加密包数据，或通过与\
  \ `GnuPG` 接口进行非对称加密；以及通过 `UDP`、`TCP` 或 `ICMP` 发送加密的 `SPA` 包。默认情况下，`fwknop` 通过 `UDP`\
  \ 端口 `62201` 发送 `SPA` 包，可以通过命令行进行更改。\n\n**/usr/sbin/fwknopd**\n\n这是主守护进程，负责嗅探和解密\
  \ `SPA` 包数据、防止重放攻击、解码 `fwknop` `SPA` 包格式、验证访问权限，并重新配置本地 `iptables` 策略，以为 `SPA` 包请求的服务授予临时访问权限。\n\
  \n**/usr/bin/fwknop_serv**\n\n这是一个简单的 `TCP` 服务器，仅当 `SPA` 包通过 Tor 匿名网络 ([`tor.eff.org`](http://tor.eff.org))\
  \ 发送时才使用。使用此服务器会导致双向通信，因此在技术上破坏了 `SPA` 协议通常的单向性；更多信息请参见第 254 页的“SPA over Tor”。\n\
  \n**/usr/lib/fwknop**\n\n`fwknop` 使用的 Perl 模块安装在此目录下，以保持系统 Perl 库的整洁。安装的模块包括 `Net::Pcap`、`Net::IPv4Addr`、`Net::RawIP`、`IPTables::Parse`、`IPTables::ChainMgr`、`Unix::Syslog`、`GnuPG::Interface`、`Crypt::CBC`\
  \ 和 `Crypt::Rijndael`。`install.pl` 脚本非常小心，只安装系统 Perl 库中不存在的 模块，以最小化磁盘占用。然而，你可以通过\
  \ `--force-mod-install` 命令行参数强制 `install.pl` 安装所有 Perl 模块。在运行 `ipfw` 防火墙的系统或 Cygwin\
  \ 下的 Windows `fwknop` 仅客户端安装上，永远 own `IPTables::Parse` 和 `IPTables::ChainMgr` 模块。\n\
  \n**/etc/fwknop**\n\n这是 `fwknop` 守护进程配置文件（如 `fwknop.conf` 和 `access.conf`）的主目录。`fwknop`\
  \ 守护进程在服务器模式运行时会使用此目录，而在客户端模式下生成 `SPA` 包不需要它。\n\n**/usr/sbin/knopmd**\n\n这是一个用于从\
  \ `/var/lib/fwknop/fwknopfifo` 命名管道解析 `iptables` 日志消息的守护进程。该守护进程仅在 `fwknop` 以旧的端口敲模式运行时才会被使用。\n\
  \n**/usr/sbin/knoptm**\n\n\n\n\n\n这是一个守护进程，用于从 `iptables` 链中移除 `fwknop` 为合法 SPA\
  \ 客户端添加的访问规则条目。该守护进程是必须的，因为主 `fwknopd` 守护进程是从活动接口嗅探的，操作系统只有在接口接收到数据包时才会对其调度运行。如果\
  \ `fwknopd` 是从单独嗅探器进程或 `ulogd` 更新的 PCAP 文件读取数据包数据，则不使用 `knoptm` 守护进程。在这种情况下，`fwknopd`\
  \ 会被定期调度运行，无论接口上是否接收到数据包；因此，`fwknopd` 可以独立对 `iptables` 规则执行超时策略。\n\n`/usr/sbin/knopwatchd`\n\
  \n这是一个监控守护进程，当守护进程崩溃时重启它。然而，`fwknop` 通常非常稳定，因此 `knopwatchd` 通常没有太多工作要做；它的存在仅仅作为一种预防措施，因为运行\
  \ SPA 意味着除非 `fwknopd` 运行，否则没有任何可以访问受保护的服务。\n\n`/etc/init.d/fwknop`\n\n这是 `fwknop`\
  \ 的初始化脚本。它允许用户以大多数 Linux 发行版一致的方式启动 `fwknop`——通过执行 `/etc/init.d/fwknop start`。使用\
  \ init 脚本仅在服务器模式启动 `fwknop` 的情况下才有意义。\n\n¹ 正如第 5 章所述，我的 GnuPG 密钥可以通过 http://www.cipherdyne.org/public_key\
  \ 获取。有必要使用 `gpg --import` 导入此密钥，以验证 [http://www.cipherdyne.org] 上每个软件分发文件的 GnuPG\
  \ 签名。\n\n# fwknop 配置\n\n在服务器模式下，fwknop 引用两个主要的配置文件 `fwknop.conf` 和 `access.conf`\
  \ 来获取配置指令。与 psad 配置文件（参见第 5 章）一样，这些文件中的每行都遵循简单的键值对约定来定义配置变量。按照惯例，注释行以井号 (`#`) 开头。我将在后续章节中介绍这些文件中一些较重要的配置变量。\n\
  \n## /etc/fwknop/fwknop.conf\n\n`fwknop.conf` 文件定义了关键配置变量，例如身份验证模式、防火墙类型、用于嗅探数据包的接口、是否应混杂模式嗅探数据包（即\
  \ fwknop 是否处理目标不是本地接口 MAC 地址的以太网帧），以及发送警报的电子邮件地址。\n\n### AUTH_MODE\n\n`AUTH_MODE`\
  \ 变量告诉 fwknop 守护进程如何收集数据包数据。支持多种收集模式，包括通过 `Net::Pcap` Perl 模块从活动接口嗅探数据包、从由 `ulogd`（见\
  \ http://www.netfilter.org）写入的文件系统中的文件中读取 PCAP 格式数据包、使用如 `tcpdump` 等单独的太网嗅探器，或从\
  \ `/var/log/fwknop/fwdata` 文件解析 iptables 日志消息。`AUTH_MODE` 变量的可能值为 `PCAP`、`FILE_PCAP`、`ULOG_PCAP`\
  \ 和 `KNOCK`；默认值为 `PCAP`。\n\n```\n AUTH_MODE                   PCAP;\n```\n\n###\
  \ PCAP_INTF\n\n`PCAP_INTF` 变量定义了 fwknop 守护进程用于监控数据包的活动接口。这仅在 `AUTH_MODE` 设置为 `PCAP`\
  \ 时使用；默认设置为 `eth0` 接口。\n\n```\n PCAP_INTF                   eth0;\n```\n\n### PCAP_FILTER\n\
  \n活动接口可能会传输或接收大量与 SPA 流量完全无关的数据包数据，没有必要强制 fwknop 守护进程处理它们。`PCAP_FILTER` 变量允许你根据网络层地址或传输层端口号等标准限制\
  \ libpcap 传递给 fwknop 的包类型。由于默认情况下 fwknop 通过 UDP 端口 62201 传输 SPA 数据包，此变量设置如下（可以修改此项通过不同的端口和或协议获取\
  \ SPA 数据包）。\n\n```\n PCAP_FILTER                 udp port 62201;\n```\n\n### ENABLE_PCAP_PROMISC\n\
  \n当设置为 `Y` 时，此变量指示 fwknop 守护进程监控所有通过活动数据包捕获接口发送的以太网帧（即接口处于混杂模式）。当 `AUTH_MODE` 设置为\
  \ `PCAP` 时，默认启用此项；但如果 fwknop 守护进程嗅探的接口处于激活并分配了 IP 地址——这意味着 SPA 数据包可以直接发送到此接口——可以通过以下方式禁用此功能：\n\
  \n```\n ENABLE_PCAP_PROMISC         N;\n```\n\n### FIREWALL_TYPE\n\n`FIREWALL_TYPE`\
  \ 变量告诉 fwknopd 在接收到有效 SPA 数据包后其负责重新配置的防火墙类型。支持的值有 `iptables`（默认）以及用于 FreeBSD 和 Mac\
  \ OS X 系统的 `ipfw`。\n\n```\n FIREWALL_TYPE               iptables;\n```\n\n### PCAP_PKT_FILE\n\
  \n如果 `AUTH_MODE` 设置为 `FILE_PCAP` 或 `ULOG_PCAP`，则 fwknop 守护进程从文件系统内的 PCAP 格式文件获取数据包数据。该文件的路径由\
  \ `PCAP_PKT_FILE` 变量定义，并设置为以下默认值：\n\n```\n PCAP_PKT_FILE               /var/log/sniff.pcap;\n\
  ```\n\n### IPT_AUTO_CHAIN1\n\nfwknop 使用 `IPTables::ChainMgr` Perl 模块为合法 SPA 客户端添加和删除\
  \ `ACCEPT` 规则。psad 也使用 `IPTables::ChainMgr`，但它不是添加 `ACCEPT` 规则，而是针对发送恶意流量的 IP 地址添加\
  \ `DROP` 规则。`IPT_AUTO_CHAIN1` 变量的默认配置是在自定义 iptables 链 `FWKNOP_INPUT` 中添加 `ACCEPT`\
  \ 规则，并从内置的 `INPUT` 链跳转到该链。\n\n```\n IPT_AUTO_CHAIN1         ACCEPT, src, filter,\
  \ INPUT, 1, FWKNOP_INPUT, 1;\n```\n\n### ENABLE_MD5_PERSISTENCE\n\nSPA 协议最重要的功能之一是检测并忽略重放攻击。`ENABLE_MD5_PERSISTENCE`\
  \ 变量控制 fwknop 守护进程是否将所有成功解密的 SPA 包的 MD5 和写入磁盘。这允许 fwknop 在 fwknop 重启甚至系统重启后仍检测重放攻击。此功能默认启用，但如果你想验证重放检测功能是否正常工作，可以禁用它（需要向\
  \ SPA 服务器发送重复的 SPA 包）。\n\n```\n ENABLE_MD5_PERSISTENCE      Y;\n```\n\n### MAX_SPA_PACKET_AGE\n\
  \n`MAX_SPA_PACKET_AGE` 变量定义了 fwknop 服务器允许接受 SPA 包的最大年龄（以秒为单位）。默认值为两分钟。只有在启用 `ENABLE_SPA_PACKET_AGING`\
  \ 时，此变量才生效。\n\n```\n MAX_SPA_PACKET_AGE          120;\n```\n\n### ENABLE_SPA_PACKET_AGING\n\
  \n默认情况下，fwknop 守护进程要求从 fwknop 客户端发送的 SPA 包存小于 120 秒（两分钟），如上述 `MAX_SPA_PACKET_AGE`\
  \ 变量所定义。fwknop 客户端在每个 SPA 包中包含一个时间戳（见第 241 页的“fwknop SPA 包格式”），fwknop 服务器使用它来确定所有\
  \ SPA 包的年龄。此功能需要 fwknop 客户端和服务器之间存在松的时间同步，但健壮的网络时间协议（NTP）使得这变得非常简单。\n\n\n\n\n\n\
  如果 `ENABLE_SPA_PACKET_AGING` 被禁用，与 SPA 数据包内联的攻击者可以停止数据包的转发，从而防止 fwknop 服务器看到该数据包并计算其\
  \ MD5 和。随后，攻击者可以向其目标地址发送原始 SPA 数据包，而 fwknop 服务器将予以放行。此外，如果使用 `fwknop -s` 命令行参数来生成原始\
  \ SPA 数据包，fwknop 将接受来自任何源源 IP 地址的 SPA 数据包（请见下文的变量 `REQUIRE_SOURCE_ADDRESS`），攻击者将通过\
  \ iptables 策略获得访问。因此，强烈建议您开启此功能。\n\n```\nENABLE_SPA_PACKET_AGING     Y;\n```\n\n\
  ### REQUIRE_SOURCE_ADDRESS\n\n`REQUIRE_SOURCE_ADDRESS` 变量告诉 fwknop 服务器，所有 SPA 数据包都必须在加密负载中包含\
  \ IP 地址，该地址将用于通过 iptables 授予访问。在启用此功能的情况下，在 fwknop 客户端命令行中使用 `-s` 参数的 SPA 数据包中放置的\
  \ `0.0.0.0` 通配符 IP 地址将不被接受。\n\n```\nREQUIRE_SOURCE_ADDRESS               Y;\n```\n\
  \n### EMAIL_ADDRESSES\n\nfwknop 服务器在各种情况下会发送电子邮件告警，例如当 SPA 数据包被接受并授予服务访问时、访问被移除以及重放攻击被阻止时。支持多个电子邮件地址，并以逗号分隔列表的形式列出如下：\n\
  \n```\nEMAIL_ADDRESSES                      root@localhost, mbr@cipherdyne.org;\n\
  ```\n\n### GPG_DEFAULT_HOME_DIR\n\n`GPG_DEFAULT_HOME_DIR` 变量指定存储 GnuPG 密钥的目录路径，用于用于数字签名验证和解密\
  \ SPA 数据包。默认使用 root 家目录下的 `.gnupg` 目录。\n\n```\nGPG_DEFAULT_HOME_DIR        /root/.gnupg;\n\
  ```\n\n### ENABLE_TCP_SERVER\n\n`ENABLE_TCP_SERVER` 变量控制 fwknop 是否绑定 TCP 服务器到端口以接受\
  \ SPA 数据包数据。如果您想通过 Tor 网络（仅使用 TCP 进行数据传输）路由 SPA 数据包，则必须启用此功能。（您可以在第 254 页的“SPA over\
  \ Tor”中找到更多相关信息。）此功能默认禁用。\n\n```\nENABLE_TCP_SERVER           N;\n```\n\n### TCPSERV_PORT\n\
  \n`TCPSERV_PORT` 变量指定了 `fwknop_serv` 守护进程监听 TCP 连接的端口。只有在启用 `ENABLE_TCP_SERVER`\
  \ 时，fwknop 才会使用它。默认如下：\n\n```\nTCPSERV_PORT                62201;\n```\n\n### /etc/fwknop/access.conf\n\
  \n`fwknop.conf` 文件中的部分提供了大量关于 fwknop 宏级别配置选项的信息，但忽略了对解密密码和分配给用户的权限等重要主题的讨论。我将通过展示\
  \ `fwknop access.conf` 文件来纠正这一点，该文件定义了 fwknop 服务器使用的所有用户名、权限、解密密钥、iptables 规则超时时间以及命令通道。\n\
  \n### SOURCE\n\nfwknop 支持对任意 IP 地址的多个用户进行授权；每个用户可以使用不同的加密密钥（以及相关的加密算法）。`SOURCE`\
  \ 是主分区变量，允许 fwknop 确定有效 SPA 数据包的访问级别。\n\n```\nSOURCE: ANY;\n```\n\n### OPEN_PORTS\n\
  \n`OPEN_PORTS` 变量指示 fwknop 通过重新配置 iptables 来允许指定的端口。除非 access.conf 中的 `PERMIT_CLIENT_PORTS`\
  \ 变量设置为 `Y`，否则 fwknop 不允许访问其他端口。`access.conf` 中的 `OPEN_PORTS` 变量允许 SPA 数据包访问 iptables\
  \ 22 端口。\n\n```\nOPEN_PORTS: tcp/22;\n```\n\n### PERMIT_CLIENT_PORTS\n\n当 `PERMIT_CLIENT_PORTS`\
  \ 设置为 `Y` 时，该变量允许 fwknop 服务器根据 `OPEN_PORTS` 变量定义的流量（例如端口和协议）处理 SPA 数据包（请在第 241 页获取更多信息）。\n\
  \n```\nPERMIT_CLIENT_PORTS: Y;\n```\n\n### ENABLE_CMD_EXEC\n\n启用 `ENABLE_CMD_EXEC`\
  \ 时，该变量允许 fwknop 代表用户执行命令。自 1.0 版本以来，fwknop 以 root 权限执行这些命令。如果您希望使用该功能，必须显式启用 `ENABLE_CMD_EXEC`。\n\
  \n```\nENABLE_CMD_EXEC: Y;\n```\n\n### CMD_REGEX\n\n`CMD_REGEX` 变量允许您提供一个正则表达式，以匹配\
  \ fwknop 服务器执行的客户端命令。在设置 `ENABLE_CMD_EXEC` 为 `Y` 的语文中，使用该变量是有意义的。例如：\n\n```\nCMD_REGEX:\
  \ ^mail\\s+\\-s+\\\".+\"@.com;\n```\n\n### DATA_COLLECT_MODE\n\n`DATA_COLLECT_MODE`\
  \ 变量接受与 `fwknop.conf` 文件中的 `AUTH_MODE` 变量相同的收集模式。`access.conf` 中的每个 `SOURCE` 定义根据\
  \ `DATA_COLLECT_MODE` 的值独立启用或禁用。如果漏掉了该变量，fwknop 进程假设其设置为 `PCAP`，这是最常见的设置。\n\n```\n\
  DATA_COLLECT_MODE: PCAP;\n```\n\n\n\n\n`GPG_DECRYPT_PW` 变量存储了 fwknop 服务器 GnuPG 公钥的解密密码，该密码由\
  \ fwknop 客户端用于加密。由于此密码包含在明文文件中，您应该生成一个新的 GnuPG 密钥仅作为 fwknop 服务器密钥，而不是使用您可能也用于其他用途（如机密邮件通信）的高价值\
  \ GnuPG 密钥。\n\n```\nGPG_DECRYPT_PW: gpgdecryptionpw;\n```\n\n### GPG_REMOTE_ID\n\
  \n`GPG_REMOTE_ID` 变量包含 GnuPG 密钥的唯一标识符，fwknop 客户端使用它对 SPA 数据包进行数字签名。该密钥需要导入到 fwknop\
  \ 服务器密钥环中（参见第 246 页的“通过非对称加密使用 SPA”）。\n\n```\n GPG_REMOTE_ID: DEFG5678;\n```\n\n\
  ### /etc/fwknop/access.conf 文件示例\n\n接下来，您将整合这些信息，并创建一个完整的 `access.conf` 文件，它可以保护您的\
  \ SSH 服务器。（您可以在第 243 页的“部署 fwknop”中找到操作示例。）\n\n使用您喜欢的编辑器打开 `/etc/fwknop/access.conf`\
  \ 文件，并添加下方列出的配置指令。\n\n```\n # cat /etc/fwknop/access.conf\nSOURCE: ANY;\nOPEN_PORTS:\
  \ tcp/22;\nFW_ACCESS_TIMEOUT: 30;\nREQUIRE_USERNAME: mbr;\nKEY: mypassword;\nGPG_DECRYPT_PW:\
  \ gpgdecryptpassword;\nGPG_HOME_DIR: /root/.gnupg;\nGPG_REMOTE_ID: 5678DEFG;\nGPG_DECRYPT_ID:\
  \ ABCD1234;\n```\n\n`SOURCE: ANY` 意味着 fwknop 守护进程将接受来自任何 IP 地址的有效 SPA 数据包。如果您在外，无法预测笔记本电脑或其他系统将连接到哪个网络，这将非常有用。\n\
  \n`OPEN_PORTS: tcp/22` 意味着 fwknop 守护进程将通过本地 `iptables` 防火墙的 `ACCEPT` 规则授予 SSH 端口的临时访问。根据\
  \ `FW_ACCESS_TIMEOUT` 变量的规定，`ACCEPT` 规则将在 30 秒后删除。\n\n`REQUIRE_USERNAME: mbr` 强制运行\
  \ fwknop 客户端的远程用户名必须为 `mbr`。在这种情况下，fwknop 守护进程配置为接受使用 Rijndael 对称加密（`KEY: mypassword`）或使用\
  \ GnuPG 密钥（通常使用 Elgamal 密码）非对称加密（`GPG_DECRYPT_PW: gpgdecryptpassword`）的 SPA 数据包。对于使用\
  \ GnuPG 加密的 SPA 数据包，fwknop 守护进程要求远程签名密钥 ID 为 `5678DEFG`，本地解密密钥 ID 为 `ABCD1234`——分别参见\
  \ `GPG_REMOTE_ID` 和 `GPG_DECRYPT_ID` 变量。\n\n² 关于 `IPT_AUTO_CHAIN{n}` 变量的详细解释可以找到第\
  \ 135 页的“配置变量”。`IPT_AUTO_CHAIN{n}` 变量提供了 `IPTables::ChainMgr` 模块的接口，该接口在 psad 和\
  \ fwknop 中均有使用。\n\n³ Sebastien Jeanquier 向我提了这种攻击，结果是引入了 `ENABLE_SPA_PACKET_AGING`\
  \ 功能（首次在 0.9.9 版本中可用），用于实现 fwknop 服务器接受 SPA 数据包的时间窗口。\n\n⁴ fwknop 可以从 `gpg-agent`\
  \ 获取密钥信息。\n\n# fwknop SPA 数据包格式\n\n每个 SPA 数据包都是根据一组定义良好的规则构建的。这些规则允许 fwknop 服务器能够确信通过\
  \ `iptables` 防火墙请求的访问类型以及请求者是谁。在接受来自 fwknop 客户端命令行的用户输入后（参见第 244 页的“通过对称加密使用 SPA”和第\
  \ 246 页的“通过非对称加密使用 SPA”），每个 SPA 数据包包含以下内容：\n\n#### 随机数据 (16 字节)\n\n这提供了足够的随机信息，以确保\
  \ fwknop 生成的每个 SPA 数据包都是唯一的——至少，数据包的唯一性达到了 Perl 函数 `rand()` 在每次调用时所产生的随机性程度。（对于\
  \ Perl 5.004 及更高版本，在第一次使用 `rand()` 函数时会隐式调用 `srand()` 函数。）\n\n### 用户名\n\n这是执行 fwknop\
  \ 命令的用户名，由 `getlogin()` 返回——如果 `getlogin()` 失败则由 `getpwuid()` 返回。fwknop 服务器使用此用户名来确定远程用户是否有权访问服务或运行命令。（注意，当\
  \ fwknop 服务器看到用户名时，SPA 数据包已经成功解密，这意味着 SPA 数据包已通过验证，可以开始验证授权的过程了。）\n\n### 时间戳\n\n\
  这是本地系统的时间戳。fwknop 服务器使用此值来确定 SPA 数据包是否在由 `MAX_SPA_PACKET_AGE` 变量定义的定时访问窗口内。\n\n\
  ### 软件版本\n\n这是 fwknop 客户端的版本：\n\n```\n [mbr@spaclient ˜]$  fwknop --Version\n[+]\
  \ fwknop v1.8.1 (file revision: 694)\n      by Michael Rash <mbr@cipherdyne.org>\n\
  ```\n\n例如，在这种情况下，软件版本字段字段将包含值 1.0。如果 SPA 数据包格式发生变化，fwknop 服务器将使用此信息来保持与旧客户端的向后兼容。\n\
  \n### 模式 (Mode)\n\n这告诉 fwknop 服务器 SPA 客户端是否想要运行命令。访问模式的默认值为 1；命令模式用 0 表示。\n\n###\
  \ 访问指令 (Access directive)\n\n此字符串告诉 fwknop 服务器，在修改策略时，客户端希望 `iptables` 防火墙接受何种类型的流量。fwknop\
  \ 服务器解析此字符串中的端口和协议，以指示 `iptables` 接受，并相应重新配置策略。例如，如果客户端想要访问 TCP 端口 22 和 UDP 端口 1194（OpenVPN\
  \ 使用），字符串将为 `client IP,tcp/22,udp/1194`。fwknop 服务器控制用户是否可以请求打开特定端口。如果只允许打开某些端口，必须在\
  \ `access.conf` 文件中定义。（更多信息请参见第 238 页的“OPEN_PORTS”和“PERMIT_CLIENT_PORTS”。）\n\n###\
  \ 命令字符串 (Command string)\n\n此字符串是 fwknop 客户端想要在服务器上执行的完整命令；例如，`/etc/init.d/apache2\
  \ restart` 或 `w |mail -s \"w output\" you@domain.com`。如果不谨慎使用，此功能可能会给 fwknop 服务器带来安全风险，因此默认是禁用的。（更多信息请参见第\
  \ 238 页的“ENABLE_CMD_EXEC”和“CMD_REGEX”。）\n\n#### 数据包 MD5 和\n\n此 MD5 和由 fwknop 客户端计算并包含在\
  \ SPA 数据包中，以增加可靠性，确保数据包在网络传输过程中未被篡改。通常，加密算法本身提供了足够的安全性，因为解密被修改过的密文通常不会产生有效的明文；但是包含\
  \ MD5 允许 fwknop 服务器独立确认客户端接收的数据与服务器实际接收的数据是一致。\n\n#### 服务器验证方法\n\nfwknop 0.9.6 版本在数据包格式中增加了此字段，允许\
  \ fwknop 服务器在 SPA 数据包中要求额外的验证参数。例如，服务器可能要求远程 fwknop 客户端输入本地用户的 `crypt()` 密码。在这种情况下，验证方法字符串将类似于\
  \ `crypt,password`。\n\n\n\n\n\n在 SPA 数据包被加密并发送之前（默认通过 `UDP` 端口 `62201` 发送），上述字段会先进行\
  \ Base64 编码，然后用冒号连接。这种编码确保了冒号分隔符的唯一性，即使对于在编码前可能包含冒号的字段也是如此。当你不经过 Base64 编码而组合所有字段时，你将得到如下内容：\n\
  \n```\n 9562145998506823:mbr:1161142204:1.0:1:0.0.0.0,tcp/22:koEtBtDL0ze22sNRyfASoA\n\
  ```\n\n一旦对单个字段进行 Base64 编码，你将得到这些：\n\n```\n 9562145998506823:bWJy:1161142204:1.0:1:MC4wLjAuMCx0Y3AvMjI=:koEtBtDL0ze22sNRyfASoA\n\
  ```\n\n最后，数据包数据使用 Rijndael 对称加密或 GnuPG 支持的非对称加密进行加密（GnuPG 默认使用 Elgamal 非对称加密）。如果你使用\
  \ Rijndael 加密，结果如下：\n\n```\n U2FsdGVkX18O3i3n8BfSpgM6wCaf8zC4CgLsSlf2STIQTNWxaC9Q3IP1NSW91nSj5zr8Juz7YyX1o\n\
  FzMu2FDZgbYAJUOxree7WyzHJdYl3ympcEPxpd/Qx5Wo3D8uS/AD8WyaV232srRCNWcsPUc9Q\n```\n\
  \n每个 SPA 数据包都使用对称密钥加密或非对称密钥加密进行加密。`对称密钥加密`是一种使用相同密钥对数据进行加密和解密的算法（因此被称为`对称`）。Rijndael\
  \ 算法被选为高级加密标准 (`AES`)，是对称密钥加密的一个重要示例。另一方面，`非对称密钥加密`是通过一对密钥对数据进行加密和解密的算法：一个是公开的公钥，另一个是保密的私钥。这两个密钥之间通过一个数学难题相关联，但它们并不完全相同（因此被称为`非对称`）。\n\
  \n## 部署 fwknop\n\n现在你已经充分了解了 `fwknop` 提供的配置选项，是时候来看一些实用的操作示例了。在每个案例中，`fwknop` 客户端都用于在\
  \ `fwknop` 服务器重新配置后，通过默认丢弃的 `iptables` 策略获取 `SSHD` 的访问。图 13-1 中的网络图应该帮助你直观理解这些场景。\n\
  \n![SPA 网络](img/httpatomoreillycomsourcenostarchimages207376.png)\n\n图 13-1. SPA\
  \ 网络\n\n在下面的每个场景中，`fwknop` 客户端在标记为 `spaclient` 的系统上执行，并将 SPA 数据包发送到标记为 `spaserver`\
  \ 的系统。图 13-1 中的虚线代表 SPA 数据包，只有在 SPA 数据包向 `spaserver` 系统通信了所需的访问权限，并且 `iptables`\
  \ 重新配置以允许该访问后，后续的 SSH 连接才能建立。\n\n## 通过对称加密实现 SPA\n\n`fwknop` 客户端有一系列命令行选项，允许你告诉\
  \ `fwknop` 服务器你希望 `iptables` 策略授予的精确访问权限。如果你使用这些命令行选项，必须包含访问或命令字符串、源 IP 地址解析方法以及\
  \ `fwknop` 服务器的目标 IP 地址。\n\n你可以假设本地 `iptables` 策略会丢弃 `fwknop` 服务器 `INPUT` 链中所有指向\
  \ TCP 端口 22 的数据包。首先配置 `fwknop.conf` 文件，将 `AUTH_MODE` 设置为 `PCAP`，确保 `PCAP_INTF` 设置为\
  \ `eth0`，并将 `access.conf` 文件设置为如下。（注意，此示例中不包含 GnuPG 指令，例如 `GPG_REMOTE_ID` 或 `GPG_DECRYPT_PW`。）\n\
  \n```\n [root@spaserver ˜]# cat /etc/fwknop/access.conf\nSOURCE: ANY;\nOPEN_PORTS:\
  \ tcp/22;\nREQUIRE_USERNAME: mbr;\nKEY: myencryptkey;\nFW_ACCESS_TIMEOUT: 30;\n\
  ```\n\n使用以下命令 ❶ 启动 `fwknop` 服务器并 ❷ 验证其是否正在运行。通过检查 syslog 消息，你会看到 `fwknopd` 已经准备好接受来自\
  \ ❸ 一个 `SOURCE` 块（源自上述列出的 `access.conf` 文件）的 SPA 数据包，并且 ❹ 导入了现有的 SPA 数据包 MD5 和磁盘缓存。最后，确保\
  \ ❺ 本地系统上的 `SSHD` 正在运行。\n\n```\n ❶ [root@spaserver ˜]# /etc/init.d/fwknop start\n\
  Starting fwknop ... [ ok ]\n❷ [root@spaserver ˜]# /etc/init.d/sshd status\n * status:\
  \  started\n[root@spaserver ˜]# tail /var/log/messages\nOct 17 23:59:53 spaserver\
  \ fwknopd: starting fwknopd\nOct 17 23:59:53 spaserver fwknopd: flushing existing\
  \ Netfilter IPT_AUTO_CHAIN chains\n❸ Oct 17 23:59:53 spaserver fwknopd: imported\
  \ access directives (1 SOURCE definitions)\n❹ Oct 17 23:59:53 spaserver fwknopd:\
  \ imported previous md5 sums from disk cache: /var/\nlog/fwknop/md5sums\n❺ [root@spaserver\
  \ ˜]# /etc/init.d/sshd status\n * status:  started\n```\n\n当 `fwknop` 服务器运行后，你可以测试是否从\
  \ `fwknop` 客户端系统可以访问 `SSHD`，然后使用 `fwknop` 获取访问权限。❶ 处的 `-A tcp/22` 命令行参数告诉 `fwknop`\
  \ 服务器客户端想要访问 TCP 端口 22；❷ 处的 `-R` 参数指示 `fwknop` 客户端自动解析 SPA 数据包源自外部可路由地址（这是通过查询 [`www.whatismyip.com`](http://www.whatismyip.com)\
  \ 完成的）；而 ❸ 处的 `-k` 参数告诉 `fwknop` 客户端将 SPA 数据包发送到 `spaserver` 主。\n\n```\n [mbr@spaclient\
  \ ˜]$ nc -v spaserver 22\n[mbr@spaclient ˜]$ fwknop ❶-A tcp/22 ❷-R ❸-k spaserver\n\
  [+] Starting fwknop in client mode.\n[+] Resolving hostname: spaserver\n    Resolving\
  \ external IP via: http://www.whatismyip.com/\n    Got external address: 204.23.X.X\n\
  \n[+] Enter an encryption key. This key must match a key in\n    etc/fwknop/access.conf\
  \ on the remote system.\n\nEncryption Key:\n\n[+] Building encrypted Single Authorization\
  \ (SPA) packet...\n[+] Sending 150 byte message to 71.157.X over/22\n[mbr@spaclient\
  \ ˜]$ ssh spaserver\nPassword:\n[mbr@spaserver ˜]$\n```\n\n上述列表的最后一行显示你已登录主机。下面，写入\
  \ syslog 的消息告诉你 ❶ `fwknopd` 已成功接收并解密了客户端发送的 SPA 数据包，并且 ❷ 添加了 `ACCEPT` 规则以允许 30 秒内的\
  \ TCP 端口 22。该 `ACCEPT` 规则会被 ❸。（虽然此处未显示，但也会发送到 `fwknop.conf` 中 `EMAIL_ADDRESSES`\
  \ 变量定义的地址，以你访问的授予和移除。）\n\n```\n❶ Oct 18 00:38:58 spaserver fwknopd: received valid\
  \ Rijndael encrypted packet from\n204.23.X.X, remote user: mbr\n❷ Oct 18 00:38:58\
  \ spaserver fwknopd: adding FWKNOP_INPUT ACCEPT rule for\n204.23.X.X -> tcp/22 (30\
  \ seconds)\n❸ Oct 18 00:39:29 spaserver fwknopd: removed iptables FWKNOP_INPUT ACCEPT\
  \ rule for\n204.23.X.X -> tcp/22, 30 second timeout\n```\n\n`fwknop` 服务器在自定义链 `FWKNOP_INPUT`\
  \ 中添加和删除所有 SPA 访问规则，而不是在任何内置链（如 `INPUT` 或 `FORWARD`）中。这使得现有 `iptables` 策略中的规则与其所操作的规则严格隔离开，这意味着你不需要担心\
  \ fwknop 规则与 `iptables` 策略中的任何现有规则冲突。在 30 秒计时过期之前，你可以在 `fwknop` 服务器上执行以下命令来查看授予\
  \ `SSHD` 访问的 `iptables` 规则。\n\n```\n [root@spaserver ˜]# fwknopd --fw-list\n[+]\
  \ Listing chains from IPT_AUTO_CHAIN keywords...\n\nChain FWKNOP_INPUT (1 references)\n\
  \ pkts  bytes  target  prot  opt  in  out  source      destination\n 11    812 \
  \   ACCEPT  tcp  --   *   *    204.23.X.X  0.0.0.0/0   tcp dpt:22\n```\n\n\n\n\n\
  在本示例中，`fwknop` 服务器重新配置了 `iptables`，允许对 `SSHD` 的访问持续 30 秒；随后 `fwknopd` 将从 `FWKNOP_INPUT`\
  \ 链中删除 `ACCEPT` 规则。尽管大多数 SSH 连接的持续时间超过了 30 秒，但只要使用了 Netfilter 连接跟踪机制，这并不是一个严重的限制，因为它允许已的\
  \ TCP 连接在客户端和服务器之间保持开启：\n\n```\nroot@spaserver ˜]# iptables -I INPUT 1 -m state\
  \ --state ESTABLISHED,RELATED -j ACCEPT\n```\n\n## 通过非对称加密实现 SPA\n\n密钥交换问题是密码学领域的核心问题，而公钥加密体系提供的新颖解决方案脱颖一出。与对称加密（密钥必须在不安全的通道上明文在双方共享）不同，非对称加密依赖于一种系统，人们主动发布公钥/私钥对的公钥部分。例如，当\
  \ A 使用 B 的公钥加密数据时，只有 B 能够通过一种破解数据锁的操作，结合公钥和私钥来解密密。这种锁是由一个数学难题构建的，在无法同时访问公钥和私钥的情况下，求解它的计算成本极高。\n\
  \n### 用于 fwknop 的 GnuPG 密钥交换\n\n为了在 `fwknop` 中使用 GnuPG 密钥，你必须将服务器的公钥导入客户端的密钥环，反之亦然。由于客户端密钥的解密密码从未存储在文件中，因此在\
  \ `fwknop` 客户端使用任何 `GnuPG` 密钥都是安全的。然而，为了讨论，我按照如下步骤生成新的客户端和服务器密钥并导入它们（为了简洁，删除了部分输出）。\n\
  \n```\nmbr@spaclient ˜]$ gpg --gen-key\ngpg (GnuPG) 1.4.5; Copyright (C) 2006 Free\
  \ Software Foundation, Inc.\n\nPlease select what kind of key you want:\n   (1)\
  \ DSA and Elgamal (default)\n   (2) DSA (sign only)\n   (5) RSA (sign only)\nYour\
  \ selection? 1\nDSA keypair will have 1024 bits.\nELG-E keys may be between 1024\
  \ and 4096 bits long.\nWhat keysize do you want? (2048)\nRequested keysize is 2048\
  \ bits\nPlease specify how long the key should be valid.\n         0 = key does\
  \ not expire\n\nKey is valid for? (0)\nKey does not expire at all\nIs this correct?\
  \ (y/N) y\n\nYou need a user ID to identify your key; the software constructs the\
  \ user ID\nfrom the Real Name, Comment and Email Address in this form:\n    \"Heinrich\
  \ Heine (Der Dichter) <heinrichh@duesseldorf.de>\"\n\nReal name: Michael Rash\n\
  Email address: mbr@cipherdyne.org\nComment: Linux Firewalls fwknop_client key\n\
  You selected this USER-ID:\n    \"Michael Rash (Linux Firewalls fwknop_client key)\
  \ <mbr@cipherdyne.org>\"\n\nChange (N)ame, (C)omment, (E)mail or (O)kay/(Q)uit?\
  \ O\nYou need a passphrase to protect your secret key.\nEnter passphrase:\n\nmbr@spaclient\
  \ ˜]$ gpg --list-keys \"fwknop_client\"\npub   1024D/AB743C36 2007-10-18\nuid  \
  \                Michael Rash (Linux Firewalls fwknop_client key)\n<mbr@cipherdyne.org>\n\
  sub   2048g/1035BC5C 2007-10-18\n```\n\n使用 4,096 位 Elgamal 密钥加密的 SPA 消息相关的密文数据长度通常远超过以太网\
  \ 1,500 字节的 MTU，因此选择了 2,048 位的长度（如上文加粗所示）。\n\n现在我们将客户端公钥导出到文件：\n\n```\nmbr@spaclient\
  \ ˜]$ gpg -a --export-key \"fwknop_client\" > fwknop_client.asc\n```\n\n在 `fwknop`\
  \ 服务器上执行执行类似的过程，密钥生成和导出命令在服务器端重复执行：\n\n```\nroot@spaserver ˜]# gpg --gen-key\nroot@spaserver\
  \ ˜]# gpg --list-keys \"fwknop_server\"\npub   1024D/25801B3A 2007-10-18\nuid  \
  \                Michael Rash (Linux Firewalls fwknop_server key)\n<mbr@cipherdyne.org>\n\
  sub   2048g/39E2FDC6 2007-10-18\nroot@spaserver ˜]# gpg -a --export \"fwknop_server\"\
  \ > fwknop_server.asc\n```\n\n最后，你需要将公钥传输到各个系统，导入它们并对其进行签名。导入步骤是为了确保服务器公钥在客户端的 GnuPG\
  \ 密钥环可用，反之亦然。签名步骤对于 `fwknop` 验证已签名的 SPA 包数据身份是必要的。尽管我将通过 `scp` 传输公钥，但考虑到公钥加密体系的性质，我可以将密钥发布在网页上供所有人查看而不会产生任何安全影响。此外，`SSHD`\
  \ 可能并不总是可以访问（事实上，它被 `fwknop` 有意隔离了），因此可能需要其他的公钥传输机制。以下是简化的命令输出（`scp` 传输位于 ❶ 和 ❷，导入和签名命令位于\
  \ ❸ 和 ❹）：\n\n```\n❶ [mbr@spaclient ˜]$ scp fwknop_client.asc root@spaserver:\nPassword:\n\
  ❷ [mbr@spaclient ˜]$ scp root@spaserver:fwknop_server.asc .\nPassword:\n❸ [mbr@spaclient\
  \ ˜]$ gpg --import fwknop_server.asc\ngpg: key 25801B3A: public key \"Michael Rash\
  \ (Linux Firewalls\n<mbr@cipherdyne.org>\n❹ [mbr@spaclient ˜]$ gpg --import fwknop_client.asc\n\
  gpg: key AB743C36: public key \"Michael Rash (Linux Firewalls\n<mbr@cipherdyne.org>\"\
  \n```\n\n### 使用 GnuPG 密钥运行 fwknop\n\n为了在 `fwknop` 中使用 GnuPG 密钥，你必须将服务器的公钥导入客户端的密钥环，反之亦然。由于客户端密钥的解密密码从未存储在文件中，因此在\
  \ `fwknop` 客户端使用任何 `GnuPG` 密钥都是安全的。然而，为了讨论，我按照如下步骤生成新的客户端和服务器密钥并导入它们（为了简洁，删除了部分输出）。\n\
  \n（等待，提供的文本末尾有一些重复/乱码。我根据提供的指令清理了逻辑流）。\n\n*自我修正：用户提供的文本包含了乱码/重复文本。我处理了核心内容并应用了格式。*\n\
  \n\n\n\n到目前为止，你已经看到 `fwknop` 被用于合法用途，以减少 `SSHD` 的攻击面。当一个 SPA 数据包在不可信的网络上传输时，任何可以在线缆上监视该数据包的人都可以保存、分析并重放它。我曾提到过\
  \ `fwknop` 的 SPA 实现通过比较传入 SPA 消息的 `MD5` 和，非常适合阻止重放攻击，这里有一个具体的例子。\n\n在图 13-2 中，攻击者被放置在互联网云中，监控从\
  \ `spaclient` 系统到 `spaserver` 系统传输的 SPA 数据包。攻击者使用 `tcpdump` 将 SPA 数据包捕获到文件中（`spa.pcap`），并对其进行足够检查，以发现数据包是加密的乱码。然后，攻击者使用\
  \ `tcpreplay` 将数据包重放回网络，如图图 13-2 中标记为 `Replayed SPA Packet` 的虚线所示。\n\n![攻击者监控并重放一个\
  \ SPA 数据包](img/httpatomoreillycomsourcenostarchimages207374.png)\n\n图 13-2. 攻击者监控并重放一个\
  \ SPA 数据包\n\n完成 SPA 数据包重放的命令序列如下。首先，`spaclient` 系统在 ❶ 处向 `spaserver` 系统发送一个有效的 SPA\
  \ 数据包。`fwknop` 的 `-L` 命令行参数允许 `fwknop` 回调上次针对 `fwknop` 服务器主机时使用的命令行选项。这对于简化相对复杂的\
  \ `fwknop` 命令行界面非常有帮助。当 SPA 数据包在网络上传输时，攻击者 ❷ 使用 `tcpdump` 捕获了数据包，并在 ❸ 中发现它看起来是不可理解的。因此，攻击者推断该数据包可能是一个\
  \ SPA 数据包（特别是因为该数据包捕获在 `fwknop` 用于通信的默认端口 `UDP 62201` 上）。另一个表明该数据包可能是 SPA 方案一部分的提示是：从攻击者的\
  \ IP 地址无法访问 `SSHD`，但 `spaclient` 和 `spaserver` 之间可以建立 SSH 会话。然后攻击者 ❹ 在网络上针对 `spaserver`\
  \ 系统重放 SPA 数据包，试图连接到 SSH 服务器。运行在 `spaserver` 上的 `fwknop` 守护检测到了重放的 SPA 数据包（如 ❺ 中的系统日志消息所示），`iptables`\
  \ 策略未授予攻击者任何访问权限。虽然此处未显示，`fwknop` 还会发送电子邮件警报，以强调之前的 SPA 数据包被重放的事实，因为这在任何合理情况下都不应该发生。\n\
  \n```\n ❶ [mbr@spaclient ˜]$ fwknop -L spaserver\n[+] Running with last command-line\
  \ args: -A tcp/22 --gpg-recip fwknop_server\n--gpg-sign fwknop_client -R -k spaserver\n\
  [+] Starting fwknop in client mode.\n[+] Resolving hostname: spaserver\n    Resolving\
  \ external IP via: http://www.whatismyip.com/\n    Got external address: 204.23.X.X\n\
  \n[+] Enter the GnuPG password for signing key: fwknop_client\nGnuPG signing password:\n\
  [+] Building encrypted Single Packet Authorization (SPA) message...\n[+] Packet\
  \ fields:\n\n        Random data: 2018495891979939\n        Username:    mbr\n \
  \       Timestamp:   1161229378\n        Version:     1.0\n        Action:     \
  \ 1 (access mode)\n        Access:      204.23.X.X,tcp/22\n        MD5 sum:    \
  \ 1P53i1YNdwou/xA+361T3w\n\n[+] Sending 1010 byte message to 71.157.X.X over udp/62201...\n\
  ❷ [root@attacker ˜]# tcpdump -i eth0 -l -nn -s 0 udp port 62201 -w spa.pcap\n❸ [root@attacker\
  \ ˜]#  tcpdump -l -nn -X -r spa.pcap | head\nreading from file spa.pcap, link-type\
  \ EN10MB (Ethernet)\n23:31:43.883144 IP 204.23.X.X.42245 > 71.157.X.X.62201: UDP,\
  \ length 1010\n     0x0000:  4500 040e e5ff 4000 0000 0000 0000 0000  E.....@.@.......\n\
  \     0x0010:  0000 0000 a505 f2f9 03fa 1d59 6851 494f  ...-.......YhQIO\n     0x0020:\
  \  4177 7668 5165 7735 3476 3347 4541 662f  AwvhQew54v3GEAf/\n     0x0030:  5754\
  \ 6335 4279 736b 5544 5a76 5830 6873  WTc5ByskUDZvX0hs\n     0x0040:  6b59 5047\
  \ 7774 6664 7349 5774 4948 3548  kYPGwtfdsIWtIH5H\n     0x0050:  5658 4c49 4731\
  \ 656a 562b 3639 7057 6866  VXLIG1ejV+69pWhf\n     0x0060:  4474 7443 7541 626b\
  \ 4941 474c 3665 6c33  DttCuAbkIAGL6eL3\n     0x0070:  426f 3632 5757 4231 1867\
  \ 7975 7141 5a72  Bo62WWB18gyuqAZr\n     0x0080:  2f71 687a 3234 614e 7042 596a\
  \ 4a2f 524d  /qhz24aNpBYjJ/RM\n❹ [root@attacker ˜]# tcpreplay -i eth0 spa.pcap\n\
  sending on: eth0\n 1 packets (1052 bytes) sent in 0.15 seconds\n 6831169.0 bytes/sec\
  \ 52.12 megabits/sec 6493 packets/sec\n[root@attacker ˜]# ssh -l root 71.157.X.X\n\
  [root@spaserver ˜]# tail /var/log/messages\n❺ Oct 18 23:32:50 spaserver fwknopd:\
  \ attempted message replay from: 204.23.X.X\n```\n\n## 伪造 SPA 数据包源地址\n\nSPA 协议支持伪造的源\
  \ IP 地址。这是由于两个因素造成的：`fwknop` 服务器能够从 SPA 数据包载荷内部获取真实的源地址，以及 SPA 数据包通过 UDP 发送且不期望有回流量。\n\
  \n`fwknop` 使用 `Perl Net::RawIP` 模块通过原始套字发送 SPA 数据包，这允许你在 `fwknop` 客户端命令行中将源 IP 地址设置为任意值。（这需要\
