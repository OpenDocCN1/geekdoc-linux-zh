  trans: '


    - 从软盘启动系统

    - 创建硬盘的主分区

    - 创建交换空间分区 (swap partition)

    - 创建文件系统

    - Linux 安装

    - 内核配置

    - 系统重启


    ## 创建启动磁盘和根磁盘


    通过软盘以带有最小化 Linux 内核的模式启动系统，我们将能够安装 Linux。这些磁盘将使用一个程序将镜像文件（所有要放入软盘的数据）拷贝到磁盘上。这些磁盘共有两个：


    - 启动磁盘：包含用于启动系统的 Linux 内核

    - 根磁盘：包含安装软件


    在每情况下，选择的镜像文件取决于你的系统配置，其名称为：


    - `scsi`，适用于 SCSI CD-ROM 驱动器

    - `sbcd`，适用于松下 CD-ROM 驱动器或连接到 Sound Blaster Pro

    - `nec260`，适用于 Nec 260 CD-ROM

    - `Mitsumi`，适用于 Mitsumi CD-ROM

    - `cdu31a`，适用于 Sony cdu31 CDU33a CD-ROM

    - `cdu535`，适用于 Sony CDU531 CDU535 CD-ROM


    你只需为两个镜像文件（启动和根）中的每一个，进入包含正确镜像文件的目录并输入程序 `\rawrite`，程序会询问你镜像文件的名称（例如 `scsi`），然后是驱动器（`a:`）


    你还可以选择创建一个额外的磁盘以备后用（例如，如果你在拥有 IDE CD-ROM 驱动器的同时计划购买 SCSI 卡……）


    ## 从启动磁盘启动


    磁盘创建完成后，重启电脑并注意将启动磁盘放入 `a :` 驱动器中。


    在显示一些消息后，系统会显示“boot”行，按回车继续。系统随后会调用根磁盘。


    ## 创建分区


    要使用 Linux，你需要使用 `Linux Ext2` 文件系统创建一个分区（最好大于 900MB 以安装所有选项），以及（可选的）一个几十 MB 的交换空间分区（即虚拟内存，也就是说，在内存不足时使用的磁盘部分）。


    创建分区可以通过不同的方式完成：


    在用软盘启动系统之前，在 Microsoft 系统下：


    - 在 Windows 9x 中，使用 `Partition Magic 4` 软件可以非常方便地创建 `ext2fs` 和交换分区，而不会丢失磁盘上的数据

    - 在 MS-DOS 下，使用标准提供的 `fdisk` 软件，它比 Linux 提供的同名同事更符合人体工程学

    - 还有一个名为 `fips` 的 DOS 工具程序。它允许对分区执行操作。


    在 Linux 上，启动系统后。接下来的发行安装程序有所不同：


    - 对于 Slackware 类发行版，你需要手动输入命令，即依次执行格式化、分区、创建文件系统并安装

    - 对于 RedHat 类发行版，这些操作是自动化的，你只需要回答问题……


    在创建分区时，你肯定会被问到之前分区的类型


    遵循以下步骤：


    - 备内存输入类型 82

    - 主分区输入类型 83

    - 主分区必须在磁盘从第一个磁道到第 1023 个磁道的范围内！

    - 在纸上记录主分区和交换分区的尺寸（以块为单位），因为这有助于后续操作


    ## 创建文件系统


    在某些发行版中，你将在启动安装前被要求创建一个文件系统（RedHat 5.2 和 Mandrake 6.0 等发行版就不属于这种情况，它们的以下所有操作都通过菜单自动完成）。


    当你创建了主分区和备内存分区（交换分区）后，这是为了激活备内存并创建根分区的文件系统。


    激活备内存通过命令完成：


    ```

    mkswap -c partition size

    ```


    例如，对于第二个磁盘的第二个分区 (`hdb2`) 上使用 10000 个块的备内存，命令为：


    ```

    mkswap -c / dev / hdb2 11000

    ```


    然后使用 `swapon` 命令启动它。


    ext2 文件系统的创建通过以下命令完成：


    ```

    mke2fs -c partition size

    ```


    例如：


    ```

    mke2fs -c / dev / hda2 202137

    ```


    ## 安装 RedHat


    RedHat 发行版目前是最受推崇的发行版之一，因为其安装过程非常简单。事实上，该程序只需要求你从下拉列表中为主设备做出选择，以及关于语言或需要安装的软件包的选择。以下是需要遵循的不同步骤：


    - 语言选择：选择安装程序将使用的语言

    - 键盘选择

    - 安装支持选择：如果你的 Linux 发行版在 CD 上，选择 CD-ROM；否则，如果是下载的副本，请选择硬盘

    - 安装样式选择：选择是对以前系统的更新还是全新安装

    - 安装类型：系统允许你在工作站、服务器或自定义之间进行选择。你完全应该选择自定义配置，这会给你更大的灵活性

    - SCSI 适配器选择：如果你有 SCSI 适配器，应回答是。系统将检测你的硬件。如果这种自动搜索失败，你只需要输入一行参数，让它知道是哪种 SCSI 适配器，以及其
    IRQ 和内存地址。一张地址为 `0x140` 且 IRQ 为 `10` 的“AHA1520” 卡在命令行中将位于定位置为：`= aha152x 0x140,10`

    - 硬盘分区：RedHat 允许在此安装阶段对磁盘进行分区（如果你之前没有做过的话），并让你在磁盘分区工具和 `fdisk` 之间进行选择

    - 选择硬盘：软件允许你从列表中选择要创建分区的硬盘

    - 删除不必要的分区：在 `fdisk` 下使用 `d` 键可以删除不必要的分区（注意不要删除你的 Windows 分区！）

    - 创建 Linux 分区：`n` 键和 `p` 键允许你创建根分区、交换分区以及你可能需要的其他分区。需要分区的第一个磁道编号和其尺寸（单位为 MB）

    - 修改分区类型：通过 `t` 键你可以为交换分区分配类型 82，为 Linux 分区分配类型 83……

    - fdisk 输出：通过按下 `q` 键退出 `fdisk` 并放弃更改。通过按下 `w` 键在退出前保存更改

    - 选择挂载点：屏幕提供几个分区，此时你需要选择你想要使用的分区并逐个命名，即指定挂载点。根分区是强制的，它是主分区且必须命名为 `/`。每个希望在 Linux
    下使用的分区都必须分配一个挂载点（例如 `/home`，或者对于希望安装后自动挂载的 DOS 分区使用 `/mnt/dos`）

    - 选择交换分区：系统要求选择作为备内存的分区

    - 格式化分区：你必须选择你创建的所有新分区。注意不要格式化包含数据的分区！

    - 软件包选择：此选项要求你只需从列表中选择要安装的内容

    - 安装/拷贝软件包：逐个安装系统所有所需的软件包。此操作可能会非常长！（可能长达半小时……）

    - 网络配置：适用于带有网卡（而非调制解调器）的计算机

    - 时钟选择：选择适合你国家的时钟

    - 启动服务选择：你可以从列表中选择每次启动时激活的服务

    - 打印机选择：一系列问题将允许你通过从列表中选择打印机并指定其连接端口来配置

    - 密码输入：密码你将被要求输入超级用户（`root`），也就是说，拥有所有权限的用户


    '
