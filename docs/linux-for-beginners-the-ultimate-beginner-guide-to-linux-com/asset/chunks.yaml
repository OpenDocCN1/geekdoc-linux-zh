    by using a program as `scandisk` or `chkdsk` to verify the integrity of the reader,
    because `Linux` makes use of much more muscular than the `DOS` disk e.g.


    ## Installation Phases

    Installing `Linux` is done in several phases to implement a file system supported
    by `Linux` (`ext2fs`) on one or several dedicated partitions and then to proceed
    with the installation itself, finally configure the kernel before booting from
