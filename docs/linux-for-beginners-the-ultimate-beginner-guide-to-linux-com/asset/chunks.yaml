    ## Creating boot and root disks


    Through floppy disks to boot the system with minimal Linux kernel we will be able
    to install Linux. These disks will be created using a program to copy image files
    (all data to put on floppy disks) on a disk. These disks are two in number:


    - Boot disk: containing a Linux kernel for booting the system

    - Root disk: contains the installation software


    The image file to be chosen in each case depends on the configuration of your
    system, it will be called:


    - `scsi`, in the case of a SCSI CD-ROM drive

    - `sbcd`, in the case of a Panasonic CD-ROM drive or connected to a Sound Blaster
    Pro

    - `nec260`, in the case of a CD-ROM Nec 260

    - `Mitsumi`, in the case of a CD-ROM Mitsumi

    - `cdu31a`, in the case of a CD-ROM or Sony cdu31 CDU33a

    - `cdu535`, in the case of a CD-ROM or Sony CDU531 CDU535


    It only remains for you for each of the two image files (boot and root) to type
    in the directory containing the proper image file `\rawrite`, the program will
    ask you the name of the image file (`scsi` for example), then the drive (`a:`)


    You can optionally create an additional disk for later use (e.g. if you plan to
    buy a SCSI card while you have an IDE CD-ROM drive ...


    ## Booting from the boot disk


    Once the disks created, restart the computer taking care to place the boot disk
    in drive `a :`.


    After displaying some messages the system displays the line: "boot", press enter
    to proceed.The system then calls the root disk.


    ## Creating Partitions


    To use Linux, you need to create a partition (preferably larger than 900MB to
    install all options) using the `Linux Ext2` file system and (optionally) a swap
    partition (virtual memory, that is, i.e. a part of the disk used in case of lack
    of memory) of tens of MBs.


    Creating partitions can be done in different ways:


    Under a Microsoft system before booting the system with the diskette boot:


    - In Windows 9x, the software `Partition Magic 4` makes it very easy to create
    `ext2fs` and swap partitions without losing data on the disk

    - Under MS-DOS, with the `fdisk` software supplied as standard, which is more
    ergonomic than his colleague of the same name supplied with Linux

    - There is also a DOS utility called `fips`. It allows performing operations on
    partitions.


    On Linux, after starting the system. Next distributing the installation procedure
    is different:


    - with Slackware type distributions you will need to enter the commands manually,
    that is to say format, partition, create the file system and install successively

    - with RedHat type distributions, these operations are automated, you will answer
    questions ...


    When creating partitions, you will surely be asked the type of the previous partitions


    Follow these steps:


    - type 82 for the secondary memory

    - type 83 for the main partition

    - The primary partition must be within the range of the disc between the first
    and 1023ame cylinder!

    - Note on a paper the size (in blocks) of the main partition and of the swap partition
    on a paper because this helps later


    ## Creating the file system


    Under certain distributions you will be asked to create a file system before launching
    the installation (this is not the case, among other things, distributions RedHat
    5.2 and Mandrake 6.0, for which all the following operations are automated through
    menus).


    When you have created the main partition and the secondary memory partition (swap
    partition), this is to activate the secondary memory and create the file system
    of the root partition.


    Activating the secondary memory is done with the command:


    ```

    mkswap -c partition size

    ```


    For example, for a secondary memory using 10000 blocks on the second partition
    of the second disc (`hdb2`) command would be:


    ```

    mkswap -c / dev / hdb2 11000

    ```


    Then the `swapon` command to launch it


    The creation of ext2 file system is done through the following command:


    ```

    mke2fs -c partition size

    ```


    for example:


    ```

    mke2fs -c / dev / hda2 202137

    ```


    ## Installing RedHat


    The RedHat distribution is currently one of the most acclaimed distributions given
    that the installation procedure is quite simple. In fact, this procedure simply
    asks you to make choices from a drop-down list for your main devices and for choices
    related to language or packages needed to be installed. Here are the different
    steps to be followed:


    - Choice of language: choose the language in which the installation procedure
    will be

    - Choice of keyboard

    - Choice of installation support: If your Linux distribution is on CD, choose
    CD-ROM, otherwise, choose the Hard drive if the copy is downloaded

    - Choice of installation style: if it is an update of a previous system or a full
    install

    - Type of installation: the system allows you to choose between workstation, server
    or customized. You have every interest to opt for custom configuration that will
    leave you more flexibility

    - Choice of SCSI adapters: If you have a SCSI adapter, you should answer yes.
    The system will detect your hardware. If ever this automatic search is unsuccessful,
    you can simply enter a line of parameters enabling it to know what kind of SCSI
    adapter in question, as well as knowing his IRQ and memory address. One Card "AHA1520"
    to address `0x140` and IRQ `10` will be located in the command line: `= aha152x
    0x140,10`

    - Hard disk partitioning: RedHat allows you to partition your disk at this level
    of the installation (if you have not done it previously) and leaves you the choice
    between disk druid and `fdisk`

    - choose the hard drive: the software lets you choose from a list the hard disk
    on which to create the partitions

    - Unnecessary partitions Removal: under `fdisk` using the `d` key you can delete
    unnecessary partitions (be careful not to delete your Windows partitions!)

    - Creating Linux partitions: the `n` button and the `p` button will allow you
    to create root and swap partitions, and all other partitions you may need. The
    first cylinder number of the partition and its size (in MB) will be required

    - Change the partition type: with the key `t` you can allocate the type 82 to
    the swap partition, and type 83 to the Linux partitions ...

    - fdisk output: by pressing the `q` key you exit `fdisk` abandoning the changes.
    By pressing the button `w` you save the changes before leaving

    - Selecting mount points: a screen offers several partitions, at this point you
    need to select the one you would like to use and name them one by one, that is
    to say, specify the mount point. The root is mandatory, it is the master partition
    and must be named `/`. Each partition that you wish to use under Linux must be
    assigned a mount point (`/home` for example, or `/mnt/dos` for your DOS partition,
    if you want it to be mounted automatically after installation

    - Selecting the swap partition: the system naturally asks you to select the partition
    that will be used as secondary memory

    - Formatting partitions: you must select all new partitions that you have created.
    Be careful not to format partitions containing data!

    - Choice of packages: this option requires you to simply select from a list, what
    to install

    - Installing / copying packages: installs the system one by one all the required
    packages. This operation can be very long! (Up to half an hour ...)

    - Network configuration: these computers with a network card (not a modem)

    - Choice of the clock: Choose appropriate clock to your country

    - Choice of start-up services: you can select from a list the services that will
    be activated at each start.

    - choice of printer: a series of questions will allow you to configure your printer
    by choosing it from a list and specifying the port on which it is connected

    - the password input: password You will be asked for the super user account (`root`),
    that is to say, a user who has all rights

