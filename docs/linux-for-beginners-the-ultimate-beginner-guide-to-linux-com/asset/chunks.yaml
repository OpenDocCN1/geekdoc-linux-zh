    # Linux 入门

    ## Linux 命令行、Linux 编程与 Linux 操作系统终极指南


    ## 目录

    - 引言

    - 第 1 章 – 历史亮点

    - 第 2 章 – 安装 Linux

    - 第 3 章 – Shell

    - 第 4 章 – 文件通配符

    - 第 5 章 - 用户管理

    - 第 6 章 - Linux 技巧与技巧

    - 第 7 章 - Vi 编辑器

    - 结论


    # 引言

    本书适用于所有渴望学习或巩固在该领域基础知识的计算机用户。


    正如你在阅读本书时会发现的，`Linux` 内核有不同的发行版。在本书中，我们将更多地关注 `Redhat` 发行版，因为我们认为它更容易安装和使用。在接下来的章节中，将详细介绍重要的方法和
    `Linux` 管理命令。


    许多计算机用户因为 `Linux` 的“复杂性”和“高级性”而倾向于避免使用它。本书专门编写并定制，旨在证明这些人的观点是错误的。


    本书遵循良好的方法论，真正普及并简化了 `Linux` 操作系统及其用法。`Linux for beginners` 涵盖了所有初学者应该知道的所有重要方面。我要求你想象一下在使用这个出色的操作系统时，没有任何困难或困惑。


    阅读并理解这本书将使这一切成为现实。在开始，我们将探索 `Linux` 的历史和起源，以便我们有一个清晰的视野并遵循方法论。然后，我们将学习并理解如何安装系统，并了解运行操作系统所需的必要设备和硬件。


    我们还将学习非常重要的 `shell` 以及所有相关的命令。当然，我们不能忘记非常有用且常用的命令行。`File globbing`（文件通配符）也将被涵盖；这对于
    `Linux` 初学者来说真的是不可或缺的。


    然后我们将进入用户管理和身份验证，这将无疑帮助你保护数据并管理所有用户的访问权限。在最后，为了使其完整并对 `Linux` 学习者和初学者真正有用，我们包含了一些非常重要的
    `Linux` 技巧，并讨论了 `Vi` 编辑器，这是一个非常值得了解的话题。


    # 第 1 章 – 历史亮点

    在本章中，我们将探索并学习我们的操作系统历史，这非常重要。此外，一旦你阅读完毕，将了解许多 `Linux` 初学者必不可少的通用信息。


    ## Linux 的历史与起源

    `Linus B.Torvalds` 是这个完全免费的操作系统背后的功臣。在 90 世纪初，`Linus` 想开发自己的操作系统并作为毕业项目提交。他打算开发一个运行在
    `80386` 类型架构上的 `UNIX` 版本。`Minix` 是第一个运行在 PC 上的 `UNIX` 克隆系统，由 `Andrew Tanenbaum`
    编写。Linus Torvalds` 决定扩展 `Minix` 的可能性，创建了后来成为 `Linux` 的东西。许多人对这一倡议感到好奇并帮助 `Linus
    Torvalds` 完成了这个系统，以便在 1992 年发布了几乎没有 bug 的第一个版本系统。


    随着开发该系统的开发者数量增加，它能够快速整合商业 `UNIX` 系统中工具的免费重新开发。`Linux` 的新工具现在以惊人的速度出现。


    该系统的独特性在于 `Linux` 并不是为了商业目的而开发的。事实上，没有任何代码是从原始的 `UNIX` 系统复制的（实际上 `Linux` 借鉴了许多商业
    `UNIX` 版本：如 `UNIX System V`）。因此，从诞生起，每个人都可以自由地使用并改进它。


    尽管 `Linux` 最初设计为在 PC 上运行，但它现在已经开发并适应了许多其他平台，例如 `SPARC` 工作站、`Macintosh`，甚至如个人助理
    (`PDA`) 等平台，甚至是视频游戏机！


    ## 核心概念与发行版

    `Linux` 围绕一个负责处理设备的 `kernel`（内核）构建。我们将发行版称为在 `Linux` 内核周围汇组装的一套软件，以提供一个开箱即用的系统。发行版的
    `kernel` 可以更新以包含最新的材料；然而，这种涉及重新构建 `kernel` 的操作是困难的，因为它需要对系统和设备有一定程度的知识。`kernel`
    的重新编译留给专家或愿意通过制作出不可用的系统来学习的用户。


    大多数发行版还提供它们自己的图形化安装和一个包管理系统，通过管理依赖关系自动安装软件（`Linux` 下的软件有时与外部库链接或依赖其他软件）。


    每个发行版都有其优缺点。事实上，某些更适合初学者并提供高级的图形界面，而另一些则偏安全性或扩展性。最著名的发行版有：


    - `RedHat` 发行版

    - `Debian` 发行版

    - `SuSe` 发行版

    - `Knoppix` 发行版

    - `Slackware`

    - `Mageia` 发行版


    ## 系统特性

    `Linux` 是一种类似于 `UNIX` 系统的操作系统，可以在不同的硬件平台上运行：`x86`（即基于 `Intel`、`AMD` 等平台）、`Sparc`、`PowerPC`、`Alpha`、`ARM`
    等。因此，`Linux` 系统可以在个人电脑上作为游戏机或个人助理运行！


    `Linux` 因此是一个多平台系统。它也是多用户的（几个人可以同时在同一台计算机上工作），也是多任务的（多个应用程序可以同时运行而互不影响）以及多处理器的。


    `Linux` 被认为是可靠、健壮且强大的。它还能够在资源非常少的低端或低性能计算机上运行。


    `Linux` 系统特别具有以下优势：


    - 支持互联网标准，即 `TCP/IP` 协议，一组互联网协议。`Linux` 是一种创建本地网络以连接互联网并建立服务器的免费方法。

    - 由于源代码的透明性以及社区在漏洞公告期间的响应，具有更高的安全性。

    - 内存空间和磁盘空间的划分，配合严格的权限管理，以最小的风险管理大量用户。

    - 完全可配置的内核，取决于安装该系统的机器硬件，以实现性能最大化。


    # 第 2 章 – 安装 Linux

    这一章非常有用，因为它涵盖了许多重要细节，并为 Linux 初学者提供了最佳解决方案。


    ## 必要材料

    `Linux` 并不需要配置要求的最新计算机：


    - 最低 `386SX` 处理器

    - `4MB` 内存（推荐 `8MB`）

    - 硬盘控制器和一个具有 `20MB` 空闲空间的磁盘（推荐 `100MB`）（`Linux` 实际上可以从单磁盘运行）

    - 一个 `CD-ROM`


    关于外接设备，市场上常见的硬件组件更有可能被 `Linux` 支持……


    ## 前提条件

    除了机器上已经安装的操作系统外，还可以安装 `Linux`。在开始安装之前，请确保使用 `scandisk` 或 `chkdsk` 等程序检查文件系统以验证读取器的完整性，因为
    `Linux` 使用的磁盘比 `DOS` 磁盘强大得多例如


