    # 第 6 章 - Linux 技巧与技巧


    为了完整，本章包含了几个有趣且非常用的技巧。


    ## 挂载 CD-ROM


    在 Linux 上挂载 CD-ROM 必须以系统管理员身份登录，即使用登录名 "root"。


    然后挂载驱动器，也就是说通过输入此命令将 CD-ROM 驱动器的内容“挂载”到一个目录（大多数情况下为 `/mnt/cdrom/`）：


    ```

    Mount -t iso9660 /dev/cdrom/mnt/cdrom

    ```


    不要忘记使用命令卸载驱动器


    ```

    Umount /mnt/cdrom

    ```


    ## 挂载 DOS 分区


    Linux 可以通过将 MS-DOS 分区挂载到 UNIX 文件系统中来访问它们。要挂载 `/dev/hda1`，只需输入：


    ```

    mount -t msdos/dev/hda1/mnt/hd

    ```


    不要忘记卸载分区


    ```

    umount /mnt/hd

    ```


    ## 挂载软磁盘驱动器


    与 MS-DOS 分区一样，你可以挂载软磁盘驱动器并使用命令访问 DOS 中格式化磁盘上的数据：


    ```

    mount -t msdos/dev/fd0/mnt/fd

    ```


    不要忘记移除软磁盘驱动器


    ```

    umount /mnt/fd.

    ```


    ## 重启电脑


    正确重启电脑，只需使用 `shutdown` 命令。在大多数 Linux 发行版中，`<CTRL><ALT><DEL>` 序列已编程为匹配 shutdown
    命令。


    要快速重启只需输入 `shutdown -r now`。


    ## 强制识别 SCSI 控制器


    当控制器没有 bios 时，Linux 通常无法检测到，在这种情况下，必须通过输入 LILO 提示符来强制检测：


    ```

    Boot: linux tmx8xx = <IRQ>, <address>

    ```


    `tmx8xx` 代表 `TMC-8xx` 控制器，如果你有另一个，你需要知道它的名称。`IRQ` 代表控制器的中断，`"address"` 代表共享内存的地址。


    ## 创建别名 (Alias)


    首先，什么是别名？


    这是一个在另一个地方运行的快捷命令，它可能也可以扩展到其他概念；别名可以是电子邮件的快捷方式。


    Linux 下挂载设备的命令是（如你上面看到的，输入起来很费劲）。


    所以，与其输入命令：


    `"Mount -t iso9660/dev/cdrom/mnt/cdrom"`（注：此处原文可能有引号错误）


    不如输入：


    ```bash

    aliascdrom = "mount -t iso9660/dev/cdrom/mnt/cdrom ''

    ```


    现在只需输入 `cdrom` 即可挂载设备。


    但是，你可能会问，如果我每次重启系统都要声明它，为什么要输入这个命令呢？


    为了避免这种情况，编辑 `/etc/bashrc` 文件并添加行：


    ```bash

    aliascdrom = "mount -t iso9660/dev/cdrom/mnt/cdrom ''

    ```


    # 第 7 章 - Vi 编辑器


    文本编辑器在 Linux 下很常用。在本章中我们将学习一种广泛使用的编辑器。


    ## Vi 简介


    Vi 是 Unix 系统下最流行的文本编辑器之一（还有 Emacs 和 pico），尽管它的人体工程学非常有限。在 Linux 中，有一个 Vi 的免费版本叫做
    `Vim` (增强版 Vi)。`Vi`（读作 vee-eye）是一个完全在文本模式下工作的编辑器，这意味着每个操作都是使用文本命令完成的。这个编辑器虽然乍看起来并不方便，但它非常强大，在操作
    GUI 的情况下非常有用。


    启动 Vi 的语法如下：


    ```bash

    Vi file_name

    ```


    打开文件后，可以使用光标移动，以及 `h`、`j`、`k` 和 `l`（在键盘没有方向键的情况下）。


    ## Vi 模式


    Vi 有 3 种操作模式：


    - **普通模式 (Normal mode)**：你打开文件时所在的模式。它允许你输入命令。

    - **插入模式 (Insert mode)**：此模式允许你在文档中插入你输入的字符。要切换到插入模式，只需按下键盘上的 `Insert` 键，或者按下
    `i` 键。

    - **替换模式 (Replacement mode)**：此模式允许你用输入的文本替换现有文本。只需再次按下 `r` 进入替换模式，并按下 `Esc` 键返回普通模式。


    ## 基础命令


    | 命令 | 说明 |

    | :--- | :--- |

    | `:q` | 退出编辑器（不保存） |

    | `:q!` | 强制编辑器退出且不保存（即使对文档进行了更改） |

    | `:wq` | 保存文档并退出编辑器 |

    | `:filename` | 以指定的名称保存文档 |


    ## 编辑命令


    | 命令 | 说明 |

    | :--- | :--- |

    | `X` | 删除光标下方的当前字符 |

    | `Dd` | 删除光标下方的当前行 |

    | `Dxd` | 从当前光标处删除 x 行 |

    | `Nx` | 从当前光标处删除 n 个字符 |

    | `x>>` | 从当前光标处向右缩进 x 行 |

    | `x<<` | 从当前光标处向左缩进 x 行 |


    ## 搜索与替换


    要在文档中查找单词，只需（在普通模式下）输入 `/` 后跟搜索字符串，然后按回车键确认。


    随后可以使用 `n` 键在出现处之间跳转。


    要在行内将一个字符串替换为另一个，Vi 中有一个使用正则表达式的强大命令，语法如下：


    ```bash

    :S/string_to_be_replaced/new_string/

    ```


    可以使用以下语法扩展到整个文档：


    ```bash

    :%S/string_to_be_replaced/new_string/

    ```


    ## 复制粘贴与剪切


    在 Vi 中可以复制并粘贴一组行。要这样做，只需输入以下命令复制 n 行：


    ```bash

    nyy

    ```


