    \ will be faced with a prompt indicating LILO: just type `Linux` to boot under\
    \ Linux and `dos` to go to your DOS partition, on which is Windows 9 xs, DOS or\
    \ other...\n\nWhen booting under Linux and entering your super user name (`root`)\
    \ and password, you willneed to install a graphical interface which will be friendlier\
    \ than the console (text mode).\n\n## Installing XFree86\n\nXFree86 is a graphical\
    \ interface under Linux (XWindow is the interface of the UNIX stations). To configure\
    \ XFree86, just type `XF86Setup` in the command line, in capital letters. A screen\
    \ appears asking you for information on your screen and to be paid the display.\
    \ A graphical window then appears in which you have tabs to configure each of\
    \ the hardware in your computer.\n\nSo we must first configure the mouse which\
    \ is mostly a Microsoft mouse type (PS / 2 or if it is connected to a special\
    \ port) on `COM1` (or `COM2`).\n\nThe keyboard is generally not to change, be\
    \ careful with the settings of the video card since they will directly impact\
    \ the display, causing an unstable display on error (screen flickers for example).\n\
    \nOnce all input parameters are good, you quit the setup program and return to\
    \ the command line under the console.Just type `startx` to start X-Window.\n\n\
    ## Chapter 3 – The Shell\n\nIn this chapter we will learn about a very important\
    \ concept. You will find a lot of important details to know about the shell which\
    \ will help you evolve during your self-study.\n\n### Introduction to the shell\n\
    \nThe interface between the operating system and the useris the command interpreter,\
    \ hence its name \"shell\".\n\n![http://i.stack.imgur.com/Znlqz.jpg](images/00001.jpeg)\n\
    \nThe shell is thus responsible for making through the operating system and the\
    \ user thanks to command lines entered by the latter. Its role is therefore to\
    \ read command lines, interpret their meanings, execute them, and then returns\
    \ the result to the outputs.\n\nThe shell is thus an executable file responsible\
    \ for interpreting orders, transmitting them to the system and sending the result\
    \ in return. There is a wide range of different shells; the most common being\
    \ `sh` (called \"Bourne shell\"), `bash` (\"Bourne again shell\"), `csh` (\"C\
    \ Shell\"), `Tcsh` (\"Tenex C shell\"), `ksh` (\"Korn shell\") and `zsh` (\"Zero\
    \ shell\"). Their name is usually the name of the executable.\n\nEach user has\
    \ a default shell, which will be launched at the opening of a command prompt.\
    \ The default shell is specified in the configuration file `/etc/passwd` in the\
    \ last field of the line corresponding to the user. It is possible to change the\
    \ shell in a session by simply executing the corresponding file, here’s an example:\n\
    \n```\n/Bin/bash\n```\n\n### Command prompt (prompt)\n\nThe shell is initialized\
    \ by reading its overall configuration (in a file in the `/etc/`), followed by\
    \ reading the user-specific configuration (in a hidden file whose name starts\
    \ with a dot, located in the directory user base, that is to say `/home/username/`.\
    \ Configuration file), then displays a command prompt as follows:\n\n`Machine:/directory/current$`\n\
    \nBy default in most shells the prompt consists of the name of the machine,followed\
    \ by a colon (`:`), the current directory, then a character indicating user type\
    \ logged on:\n\n- A normal user is indicated with a `$` \n- The administrator,\
    \ called \"root\" is indicated with a hash \"#\"\n\n### Command line concept\n\
    \nA command line is a character string consisting of a command corresponding to\
    \ an executable system or a shell command and the Optional arguments (parameters):\n\
    \n```\nls –al /home/j/\n```\n\nIn the above command, `ls` is the name of the command,\
    \ `-al` and `/home/jimmy/` are arguments. Arguments beginning with `-` are called\
    \ options.\n\nFor each order there are usually a number of options available which\
