    messages` `mesg y: Authorizestalk messages reception` | |

    | `Logout` | Disconnects | |


    ## Chapter 5 - User Management


    This chapter is also very important because it covers all the details about authentication
    and user management. It also covers a lot of useful information which you will
    certainly find very helpful as we advance more in our journey.


    ### First step of the administrator


    When several persons have access to a system, you need the system administrator
    manages users. For this, the common commands and files to configure must be known.


    Important files to know are:


    - `/etc/passwd`

    - `/etc/group`


    ## The /etc/passwd file


    The `/etc/passwd` file contains all the user information (login, password ...).
    Only the super user (`root`) must be able to change it. We must therefore change
    the rights of this file so that it is read-only for other users.


    This file has a special format for identifying each user; each line has the following
    format:


    `Account Name: Password: User number: groupnumber: Comment: directory: startup
    program`


    Sevenfields are explained and separated by the character ":":


    - The account name of the user

    - User’s password (encrypted of course)

    - The integer identifying the user for the operating system (`UID` = User ID,
    user ID)

    - The integer that identifies the user group (`GID` = Group ID, group ID)

    - The comment in which one can find information on the user or simply its real
    name

    - Where the connection directoryis located after connecting to the system

    - The command is executed after the connection to the system (that is often a
    shell)


    Here’s an example of a `passwd` file:


    ```

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin:/bin/bash

    daemon:x:2:2:daemon:/sbin:/bin/bash

    news:x:9:13:News system:/etc/news:/bin/bash

    uucp:x:10:14::/var/lib/uucp/taylor_config:/bin/bash

    cquoi:x:500:100:Cool......:/home/cquoi:/bin/bash

    ```


    It is veryimportant to note that in this filethe passwordsareencrypted.


    It is therefore useless to edit and replace the field password by directly typing
    the password that only leads to the blocking of the account. When a user connects,
    the login program compares the password typed by the user (once encrypted) to
    that in the `passwd` file. If they are different, the connection cannot be established.
    To prohibit use, simply replace the encrypted password by a star: `"*`.


    The account access may possibly be open with empty password field. In this case,
    anyone wanting to connect with this account can do so. To change the password
    of an account with the `passwd` command, you must be either system administrator
    or account owner (the system will then prompt the user to enter the old password
    before asking 2 times to enter the new password).


    `UID`: identifier (unique) to each user account. The numbers ‘0’ to ‘99’ are reserved
    for frequently own accounts.Numbers greater than ‘100’ are reserved for these
    users.


    `GID`: group ID. The default group’s number is 50\. In connection withaccess rights
    to files, this identifier is used. This question tells you if your system has
    more than one user group. (You will then have to worry about the `/etc/group`).


    It is possible to modify the commands interpreter from the Shell. To do this,
    use the `chsh` or `passwd -s` command. Linux then looks in the `/etc/shells` file
    the program you have specified. Only orders present in this file will be accepted
    and will replace the current value of the startup program field. These restrictions
    do not apply to the superuser account.


    Make sure the permissions of the `/etc/passwd`file are the same as for the file
    `/etc/shells`. The `root` can be called names other than root. To change this,
    just replace the name of the root account with the one you desire.


    If an account’s identifier (`UID`) is zero, it means that it’s a privileged one.


    ### The /etc/group file


    The `/etc/group` file contains a list of users belonging to different groups.
    Indeed, when many users can access the system, they are frequently combined in
    different groups each with their own access rights to files and directories.


    It consists of various fields separated by ":":


    `Group Name: Specialfield: Group number: member1, member 2`


    The special field is frequently blank.


    The group number id the field that links the `/etc/group` and `/etc/passwd` files.


    Here is an example /etc/group:


    ```

    root:x:0:root

    bin:x:1:root,bin,daemon

    daemon:x:2:

    tty:x:5:

    disk:x:6:

    lp:x:7:

    wwwadmin:x:8:

    kmem:x:9:

    wheel:x:10:

    mail:x:12:cyrus

    news:x:13:news

    ```


    -When using the `ls` command with the `-l` option, the group number is displayed
    with the user number who owns the file (or directory).


    -The same user can appear in several groups. When connecting to the system it
    belongs to the group specified in the `/etc/passwd` (`GID` field). This may change
    with the `newgrp` command. Access rights to files are then defined.

