    # Chapter 6 - Linux Tips and Tricks


    Just to make it complete, this chapter includes several interesting and really
    useful tips.


    ## Mounting a CD-ROM


    To mount a CD-ROM on Linux you must login as system administrator, i.e. with the
    login "root".


    Then just mount the drive, that is to say "hang" the contents of the CD-ROM drive
    in a directory (most of the time `/mnt/cdrom/`) by typing this command:


    ```

    Mount -t iso9660 /dev/cdrom/mnt/cdrom

    ```


    Do not forget to demount the drive with the command


    ```

    Umount /mnt/cdrom

    ```


    ## Mount a DOS partition


    It is possible for Linux to access MS-DOS partitions by mounting them in the UNIX
    file system. To mount the `/dev/hda1` just type:


    ```

    mount -t msdos/dev/hda1/mnt/hd

    ```


    Do not forget to demount the partition


    ```

    umount /mnt/hd

    ```


    ## Mount a floppy drive


    In the same way as for the MS-DOS partition, you can mount a floppy disk drive
    and access the data on a formatted disk in DOS with the command:


    ```

    mount -t msdos/dev/fd0/mnt/fd

    ```


    Do not forget to remove the floppy drive


    ```

    umount /mnt/fd.

    ```


    ## Restart the computer


    To correctly restart the computer, just use the command `shutdown`. The key sequence
    `<CTRL><ALT><DEL>` has on most Linux distributions programmed to match the shutdown
    command.


    For a quick restart simply type in `shutdown -r now`.


    ## The SCSI controller forced recognition


    When controllers have no bios they are generally not detected by Linux, in which
    case it must force the detection by typing prompt LILO:


    ```

    Boot: linux tmx8xx = <IRQ>, <address>

    ```


    `tmx8xx` represents a `TMC-8xx` controller, if you have another you need to know
    its designation. `IRQ` represents the interruption of the controller and `"address"`
    the address of the shared memory.


    ## Making an Alias


    First of all what is an alias?


    This is a shortcut command to run in another it may also extend to other concepts;
    an alias can be a shortcut to an email.


    The commands under Linux to mount a device are (as you saw above heavy typing.


    So instead of typing the command:


    `"Mount -t iso9660/dev/cdrom/mnt/cdrom"`


    type:


    ```bash

    aliascdrom = "mount -t iso9660/dev/cdrom/mnt/cdrom ''

    ```


    Now just type `cdrom` to mount the device.


    However, you may ask yourself, why should I type this command if I have to declare
    it every time I reset the system?


    To avoid that, edit the file `/etc/bashrc` and add the line:


    ```bash

    aliascdrom = "mount -t iso9660/dev/cdrom/mnt/cdrom ''

    ```


    # Chapter 7 - Vi Editor


    Text editors are commonly used under Linux. In this chapter we learn about a widespread
    one.


    ## Introduction to Vi


    Vi is one of the most popular text editors under Unix systems (with Emacs and
    pico) Despite its very limited ergonomics. In Linux there is a free version of
    Vi called `Vim` (Vi Improved). `Vi` (pronounced vee-eye) is an editor entirely
    in text mode, which means that each action is done using text commands. This editor
    although inconvenient at first sight is very powerful and can be very useful in
    case of operation of the GUI.


    The syntax to launch Vi is as follows:


    ```bash

    Vi file_name

    ```


    After opening the file, it is possible to move using cursors, and the `h`, `j`,
    `k` and `l` (in case the keyboard does not possess arrow cursors).


    ## The Vi modes


    Vi has 3 modes of operation:


    - **Normal mode**: the one in which you are opening the file. It allows you to
    type commands.

    - **Insert mode**: this mode allows you to insert characters you type in the document.
    To switch to insert mode, simply press the `Insert` key on your keyboard, or,
    if the `i` key.

    - **Replacement mode**: this mode allows you to replace the existing text with
    the text that you type. Simply press again `r` to enter replace mode, and press
    the `Esc` key to return to normal mode.


    ## The basic commands


    | Command | Description |

    | :--- | :--- |

    | `:q` | Quit the editor (without saving) |

    | `:q!` | Forces the editor to quit without saving (even if changes were made
    to the document) |

    | `:wq` | Saves the document and quits the editor |

    | `:filename` | Saves the document under the specified name |


    ## The editing commands


    | Command | Description |

    | :--- | :--- |

    | `X` | Deletes the current character under the cursor |

    | `Dd` | Deletes the current line under the cursor |

    | `Dxd` | Deletes x lines from the one currently under the cursor |

    | `Nx` | Delete n characters from the one currently under the cursor |

    | `x>>` | Indent x lines to the right from the one currently under the cursor
    |

    | `x<<` | Indent x lines to the left from the one currently under the cursor |


    ## Search and replace


    To find a word in a document, simply (in normal mode) type `/` followed by the
    search string, then confirm with the enter key.


    It is then possible to go from occurrence to occurrence with the `n` button.


    To replace a character string with another on a line, there is a very powerful
    command in Vi using regular expressions with the following syntax:


    ```bash

    :S/string_to_be_replaced/new_string/

    ```


    It is possible to generalize to the entire document with the following syntax:


    ```bash

    :%S/string_to_be_replaced/new_string/

    ```


    ## The copy-paste and cut-paste


    It is possible in Vi to copy and paste a selection of lines. To do this, just
    type the following command to copy n lines:


    ```bash

    nyy

    ```

