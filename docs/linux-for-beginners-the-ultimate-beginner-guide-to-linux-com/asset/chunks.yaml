    # Introduction

    This book is for all computer users eager to learn or consolidate bases acquired
    in the field.


    As you will know when reading this book, there are different distributions of
    the `Linux` kernel. In this book we will focus a little more on the `Redhat` distribution
    because we consider it as the easier one to install and use. In the following
    chapters, important methods and `Linux` administration commands are presented
    and detailed.


    A lot of computer users tend to avoid `Linux` for its “complexity” and “sophistication”.
    This book is specially written and tailored to prove those people are wrong.


    This book really popularizes and simplifies the `Linux` operating system and its
    usage while following a good methodology. `Linux for beginners` covers all the
    important facets which all beginners should know about. I am asking you to imagine
    yourself using this great OS without having any difficulties or fogginess about
    it.


    Reading and understanding this book will make it happen. In the beginning we will
    explore `Linux` history and genesis so we can have a clear vision and be methodological.
    Then, we will learn and understand how to install the system knowing the necessary
    equipments and devices needed to have an operational OS running.


    We will also learn about the `shell` which is very important and all the relative
    commands. And of course we must not forget about command lines which are really
    useful and commonly used. `File globbing` will be covered too; it’s really indispensable
    for `Linux` beginners to know about.


    Then we will hit user’s management and authenticating which will certainly help
    you secure data and manage access rights for all users. By the end, just to make
    it complete and really useful for `Linux` learners and beginners, we included
    some very important `Linux` tips and talked about the `Vi` editor which is really
    an interesting thing to know about.


    # Chapter 1 – History Highlights

    In this chapter we will explore and learn about our OS history which is very important.
    Also, once you are done reading it, you will know about a lot of general information
    indispensable for `Linux` beginners.


    ## History and genesis of Linux

    `Linus B.Torvalds` is behind this entirely free OS. In the early 90s, `Linus`
    wanted to develop his own OS and present it as his graduation project. He was
    intended to develop a `UNIX` version that runs on a `80386` type architecture.
    `Minix` was the first `UNIX` clone running on PC, written by `Andrew Tanenbaum`.
    `Linus Torvalds` then decided to expand the possibilities of `Minix`, creating
    what would become `Linux`. Amused by this initiative, many people contributed
    to help `Linus Torvalds` to complete this system, so that in 1992 a first version
    of the system was launched with almost no bug.


    With the increasing number of developers working on this system, it has been able
    to integrate quickly free redevelopments of tools present in commercial `UNIX`
    systems. New tools for `Linux` now appear at breakneck speed.


    The originality of this system lies in the fact that `Linux` was not developed
    for commercial purposes. Indeed no line of code has been copied from the original
    `UNIX` systems (`Linux`, in fact draws on many commercial `UNIX` versions: `UNIX
    System V`). So everyone, since its inception, is free to use but also to improve
    it.


    Although `Linux` was initially designed to run on PC, it has now been developed
    and adapted to many other platforms such as `SPARC` stations, `Macintosh`, and
    even platforms such as personal assistants (`PDA`), even videogame consoles!


    ## Core concepts and distribution

    `Linux` is built around a `kernel` responsible for taking care of the equipment.
    We call distribution assembling a set of software around a `Linux` kernel to provide
    a turnkey system. The `kernel` of a distribution can be updated to allow for the
    inclusion of recent material; however this operation consisting in rebuilding
    the `kernel` is difficult because it requires a certain level of knowledge of
    the system and equipment. The `kernel` recompilation is reserved for specialists
    or users willing to make them unusable system to learn.


    Most distributions also provide a graphical installation of their own and a package
    management system to automatically install software by managing dependencies (software
    under `Linux` is sometimes linked to external libraries or rely on other software).


    Each distribution has its advantages and disadvantages. Indeed if some are more
    suited to beginners and offer advanced graphics interfaces, others prefer the
    security or scalability. The best known distributions are:


    - The `RedHat` distribution

    - The `Debian` distribution

    - The `SuSe` distribution

    - The `Knoppix` distribution

    - `Slackware`

    - The `Mageia` distribution


    ## System features

    `Linux` is an operating system similar to `UNIX` systems that can run on different
    hardware platforms: `x86` (that is to say based on platforms `Intel`, `AMD`, etc.),
    `Sparc`, `PowerPC`, `Alpha`, `ARM`, etc. So the `Linux` system can operate both
    on personal computers as game consoles or personal assistants!


    `Linux` is therefore a multi-platform system. It is also multi-user (several people
    can simultaneously work on the same computer), but also multi-task (several applications
    can be run simultaneously without any of them affects the other) and multiprocessor.


    `Linux` is considered a reliable, robust and powerful. It is also capable of operating
    with very few resources on low end computers very few powerful.


    The `Linux` system has the following advantages in particular:


    - Support for Internet standards, that is to say `TCP/IP` protocols, the group
    of Internet protocols. `Linux` is a free way to create a local network to connect
    to the Internet and to set up a server.

    - More security due to its sourcecode’s transparency and the responsiveness of
    the community during the vulnerabilities advertisements.

    - A partitioning of memory space and disk space coupled with a sharp rights management
    to manage large numbers of users with minimal risk.

    - A fully configurable nucleus depending on the hardware of the machine on which
    the system is installed to maximize performance.


    # Chapter 2 – Installing Linux

    This chapter is really useful since it covers a lot important details and proposes
    the best solutions for Linux beginners.


    ## Necessary material

    `Linux` does not require the latest computer with minimal configuration:


    - a `386SX` processor minimum

    - `4MB` of memory (`8MB` recommended)

    - a hard disk controller and a disk with free `20MB` (`100MB` recommended) (`Linux`
    is able in practice to operate from a single disk)

    - a `CD-ROM`


    Regarding appendices devices, common hardware components on the market will have
    much more chance of being supported by `Linux`...


    ## Prerequisite

    `Linux` can be installed in addition to the operating system already installed
