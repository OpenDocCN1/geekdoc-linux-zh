    ## 第 5 章 - 用户管理


    这一章也非常重要，因为它涵盖了身份验证和用户管理的所有细节。它还包含了许多有用信息，随着我们旅程的深入，你一定会发现这些非常有帮助。


    ### 管理员的第一步


    当多个人可以访问系统时，你需要系统管理员来管理用户。为此，必须了解用于配置的常用命令和文件。


    需要了解的重要文件：


    - `/etc/passwd`

    - `/etc/group`


    ## /etc/passwd 文件


    `/etc/passwd` 文件包含所有用户信息（登录、密码等）。只有超级用户（`root`）能够修改它。因此，我们必须更改此文件的权限，使其对其他用户仅只读。


    该文件有一个特殊格式来识别每个用户；每行具有以下格式：


    `账户名:密码:用户数:组组数:注释:目录:启动程序`


    这七个字段由字符 ":" 分隔，解释如下：


    - 用户的账户名

    - 用户密码（当然是加密的）

    - 操作系统识别用户的整数（`UID` = User ID，用户 ID）

    - 识别用户组的整数（`GID` = Group ID，组组 ID）

    - 注释，可以在其中找到用户的信息或直接是其真实姓名

    - 连接系统后连接目录所在的位置

    - 连接系统后执行的命令（通常是 shell）


    这是一个 `passwd` 文件的示例：


    ```

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin:/bin/bash

    daemon:x:2:2:daemon:/sbin:/bin/bash

    news:x:9:13:News system:/etc/news:/bin/bash

    uucp:x:10:14::/var/lib/uucp/taylor_config:/bin/bash

    cquoi:x:500:100:Cool......:/home/cquoi:/bin/bash

    ```


    非常重要的一点是，该文件中的密码是加密的。


    因此，通过直接输入密码来编辑和替换 `password` 字段是没用的，这会导致账户被锁定。当用户连接时，登录程序会将用户输入的密码（加密后）与 `passwd`
    文件中的密码进行比比较。如果它们不同，则无法建立连接。要禁止使用，只需将加密密码替换为星号：`*`。


    账户访问可能因密码为空而开放。在这种情况下，任何想要连接此账户的人都可以。要使用 `passwd` 命令更改账户密码，你必须是系统管理员或账户所有者（系统会提示用户输入旧密码，然后要求输入两次新密码）。


    `UID`：每个用户账户的唯一标识符。数字‘0’到‘99’预留给经常拥有的账户。大于‘100’的数字预留给这些用户。


    `GID`：组 ID。默认组的数字是 50。此标识符与对文件的访问权限有关。这个问题告诉你你的系统是否有多个用户组（你随后将需要担心 `/etc/group`）。


    可以从 Shell 修改命令解释器。要这样做，使用 `chsh` 或 `passwd -s` 命令。Linux 随后会在 `/etc/shells` 文件中查找你指定的程序。只有文件中存在的命令会被接受，并替换启动程序字段的当前值。这些限制不适用于超级用户账户。


    确保 `/etc/passwd` 文件的权限与 `/etc/shells` 文件相同。`root` 可以被称为除 root 外的名称。要更改此，只需将 root
    账户名称替换为你所需的名称即可。


    如果账户标识符（`UID`）为零，意味着它是一个特权账户。


    ### /etc/group 文件


    `/etc/group` 文件包含不同组的用户列表。事实上，当许多用户可以访问系统时，他们经常被组合在不同的组中，每个组对文件和目录都有自己的访问权限。


    它由由 ":" 分隔的各种字段组成：


    `组名:特殊字段:组编号:成员 1, 成员 2`


    特殊字段通常是空白的。


    组编号是连接 `/etc/group` 和 `/etc/passwd` 文件的字段。


    这里是 /etc/group 的示例：


    ```

    root:x:0:root

    bin:x:1:root,bin,daemon

    daemon:x:2:

    tty:x:5:

    disk:x:6:

    lp:x:7:

    wwwadmin:x:8:

    kmem:x:9:

    wheel:x:10:

    mail:x:12:cyrus

    news:x:13:news

    ```


    - 当使用 `-l` 使用 `ls` 命令时，将显示与所有文件（或目录）的用户编号。


    - 同一个用户出现在多个组中。连接系统时，它属于 `/etc/passwd` 中指定的组（`GID` 字段）。这可以通过 `newgrp` 命令进行更改。对文件的访问权限随后进行定义。


    '
- fmt: '

    -The File protections must prevent editing by non-privileged users.

    - To add a group, the administrator can edit the `/etc/group` using a text editor.
    He also can use the `addgroup` or `groupadd` command (not always present). In
    the first case, he will only have the row corresponding to the groups to add.
    For example, the line: `admin:: 56: ccm`

    - To add a user to a group, simply edit the `/etc/group` and add the name at the
    end of the line separating the name of the members by a comma.

    - To delete a group, simply edit the `/etc/group` and delete the corresponding
    line. But beware, do not forget to change the `/etc/passwd` numbers (`GID`) of
    the deleted group, if users belonged to it. It is also essential to look for files
    and directories of this group to change (in the opposite case files and directories
    may be inaccessible).


    ## Customizing the shell


    The `/etc/profile` configures the Shell. It concerns all users.


    Firstly it includes Shell’s variables such as `PATH`, `OPENWINHOME`...


    Then, the type of terminal and the `TERM` variable are accordingly defined. One
    part is dedicated to the prompt; finally, a last one allows defining colors of
    the `ls` command.


    In Linux boot, it''s nice to have the lighted keypad, which is not the case by
    default.


    There are therefore a few lines that need to be added to the `/etc/profile`:


    ```

    INITTY=/dev/tty[1-7]

    for tty in $INITTY;

    do setleds -D +num< $tty

    Done

    ```


    When connected to the Shell, the first thing that appears is the prompt; it can
    be configured to suit the user.


    If the administrator wants to have a prompt that is called: "Hello #", he only
    needs to edit the `/etc/profile`. It contains a variable called `PS1`. All lines
    related to this variable must then be preceded by a hash: `#`. It is then to add
    the line `PS1 = ''Hello #''`.


    All there’s left to do is to save and log in again. Then we can see the changes.


    Tip: leave a blank after the prompt to improve readability. It is also possible
    to use variables in the prompt (for example to display the time or name of the
    machine ...):


    | `\d` | to add the date (English format) |

    | `\t` | to add the time (HH: MM: SS) |

    | `\u` | to add the user''s name |

    | `\r` | for a newline |

    | `\w` | to add the full path of the current directory |

    | `\W` | to add the current directory |

    | `\h` | to add the name of the machine |


    The color can also be changed. For this, use the `PS1` variable like this: `PS1
    = ''\[\033 [color_number] wanted_prompt\033[0m]''`


    The color number will be taken from the following list:


    | Black | 0;30 |

    | Red | 0;31 |

    | Green | 0;32 |

    | Brown | 0;33 |

    | Blue | 0;34 |

    | Purple | 0;35 |

    | Cyan | 0;36 |

