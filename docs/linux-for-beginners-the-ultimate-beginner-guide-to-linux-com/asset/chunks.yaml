    \ packages |\n"
  raw: 'Once you have completed all these steps, the computer will restart and you
    will be faced with a prompt indicating LILO: just type Linux to boot under Linux
    and dos to go to your DOS partition, on which is Windows 9 xs, DOS or other...


    When booting under Linux and entering your super user name (root) and password,
    you willneed to install a graphical interface which will be friendlier than the
    console (text mode).


    ## Installing XFree86


    XFree86 is a graphical interface under Linux (XWindow is the interface of the
    UNIX stations). To configure XFree86, just type "XF86Setup" in the command line,
    in capital letters. A screen appears asking you for information on your screen
    and to be paid the display. A graphical window then appears in which you have
    tabs to configure each of the hardware in your computer.


    So we must first configure the mouse which is mostly a Microsoft mouse type (PS
    / 2 or if it is connected to a special port) on COM1 (or COM2).


    The keyboard is generally not to change, be careful with the settings of the video
    card since they will directly impact the display, causing an unstable display
    on error (screen flickers for example).


    Once all input parameters are good, you quit the setup program and return the
    command line under the console.Just type "startx" to start X-Window.


    Chapter 3 –The Shell


    In this chapter we will learn about a very important concept. You will find a
    lot of important details to know about the shell which will help you evolve during
    your self-study.


    ## Introduction to the shell


    The interface between the operating system and the useris the command interpreter,
    hence its name "shell".


    ![http://i.stack.imgur.com/Znlqz.jpg](images/00001.jpeg)


    The shell is thus responsible for making through the operating system and the
    user thanks to command lines entered by the latter. Its role is therefore to read
    command lines, interpret their meanings, execute them, and then returns the result
    to the outputs.


    The shell is thus an executable file responsible for interpreting orders, transmitting
    them to the system and sending the result in return. There is a wide range of
    different shells; the most common being sh (called "Bourne shell"), bash ("Bourne
    again shell"), csh ("C Shell"), Tcsh ("Tenex C shell"), ksh ("Korn shell") and
    zsh ("Zero shell"). Their name is usually the name of the executable.


    Each user has a default shell, which will be launched at the opening of a command
    prompt. The default shell is specified in the configuration file /etc/passwd in
    the last field of the line corresponding to the user. It is possible to change
    the shell in a session by simply executing the corresponding file, here’s an example:


    /Bin/bash


    ## Command prompt (prompt)


    The shell is initialized by reading its overall configuration (in a file in the
    /etc/), followed by reading the user-specific configuration (in a hidden file
    whose name starts with a dot, located in the directory user base, that is to say
    /home/username/. Configuration file), then displays a command prompt as follows:


    Machine:/directory/current$


    By default in most shells the prompt consists of the name of the machine,followed
    by a colon (:), the current directory, then a character indicating user type logged
    on:


    - A normal user is indicated with a "$" 


    - The administrator, called "root" is indicated with a hash"#"


    ## Command line concept


    A command line is a character string consisting of a command corresponding to
    an executable system or a shell command and the Optional arguments (parameters):


    ls –al /home/j/


    In the above command, lsis the name of the command, -al and /home/jimmy/ are arguments.
    Arguments beginning with - are called options.


    For each order there are usually a number of options available which can be detailed
    by typing the following commands:


    command--help


    command -?


    man command


    ## Standard input-output


    When executing a command, a process is created.This will then open three flows:


    - Stdin: where the process will read the input data. It’s called standard input.
    By default stdin is the keyboard. STDIN is identified by the number 0.


    - Stdout: where the process will write the output data. It’s called standard output.
    By default stdin corresponds to the screen; STDOUT is identified by the number
    1.


    - Stderr: where the process will write error messages. It’s called standard error.
    Default is stderr on the screen. STDERR is identified by the number 2.


    By default when executing a program, the data is read from the keyboard and the
    program sends its output and errors on the screen, but it is possible to read
    data from any device to input or from a file and send the output to a display
    device, a file, etc.


    ## Redirects


    Linux, like any Unix-like system, has mechanisms to redirect the standard input-output
    to files.


    Thus, the use of the character ">" redirectsthe standard of a command to the left
    output to the file locatedto the right:


    ls -al /home/jf/> test.txt


    echo "test"> /etc/myconfigurationfile


    The following command is equivalent to copying files:


    cat file1>file2


    Redirection ">" aims to create a new file. So if a file with same name existed,
    it is overwritten. The following command simply creates an empty file:


    > File


    The use of a double character ">>" concatenatesstandard output to the file, that
    is to say, add the output after the file without overwriting it.


    Similarly, the "<" character indicates a standard input’sredirection. The next
    command sends the foo.txt file content as input to the cat command, whose sole
    purpose is to display the content on the standard output (useless but trainer
    example):


    cat<foo.txt


    Finally the use of redirection "<<" can be read on standard inputuntil the chain
    to the right is encountered. Thus, the following example willread the standard
    input until the word STOP is encountered, and then will display the result:


    cat<< STOP


    ## Communicating tubes (pipes)


    The pipes are a specific communication mechanism to all UNIX systems. A pipe,
    symbolized by a vertical bar ("|" character), is used to assign the standard output
    of one command to the standard input of another, such as a pipe for communicating
    the standard input of a command with the standard output of another.


    So in the following example, the standard output of the ls -al command is sent
    out on the program responsible for sorting the result in alphabetical order:


    ls -al | sort


    It is possible in this way to chain a number of commands through successive pipes.
    In the following example the command displays all files in the current directory,
    selects the lines containing the word "zip" (using the grep command)and counts
    the total number of lines:


    ls -l | grep zip | wc -l


    Chapter 4 –File Globbing


    This chapter is one of the most important ones since it covers a very interesting
    topic. Knowing about files hierarchy in Linux is indispensable. We will also learn
    about the main shell commands which are commonly used.


    ## The hierarchy of files in Linux


    To ensure portability and compatibility, a Linux system conformsthe single standard
    FHS (File Hierarchy Standard). The base hierarchy is as follows:


    |  |  |  | the root, it contains the main directories |


    | bin |  |  | contains essential executables to the system used by all users (for
    example, ls, rm, cp, chmod, mount, ...) |


    | /boot |  |  | contains files that allow Linux to start |


    | /dev |  |  | contains the devices entry points |


    | /etc |  |  | contains commands and files needed to the system administrator
    (group, passwd,ld.so.conf,inittab,...) |


    |  | /etc/X11 |  | contains the specific files for the configuration of X |


    |  | /etc/opt |  | contains the specific configuration files to applications installed
    in /opt |


    | /home |  |  | Personal Directory users |


    | /lib |  |  | contains shared libraries essential to the system during startup
    |


    | /mnt |  |  | contains temporary mount points partitions (CD-ROM, floppy disk,
    ...) |


    | /opt |  |  | contains additional application packages |'
