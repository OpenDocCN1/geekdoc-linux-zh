- "# Linux 初学者指南：Linux 命令行、Linux 编程与 Linux 操作系统终极初学者指南\n\n\n\n![](img/00002.jpeg)\n\
  \n\n\n# 引言\n本书适用于所有渴望学习或巩固在该领域基础知识的计算机用户。\n\n正如你在阅读本书时会发现的，`Linux` 内核有不同的发行版。在本书中，我们将更多地关注\
  \ `Redhat` 发行版，因为我们认为它更容易安装和使用。在接下来的章节中，将详细介绍重要的方法和 `Linux` 管理命令。\n\n许多计算机用户因为 `Linux`\
  \ 的“复杂性”和“高级性”而倾向于避免使用它。本书专门编写并定制，旨在证明这些人的观点是错误的。\n\n本书遵循良好的方法论，真正普及并简化了 `Linux`\
  \ 操作系统及其用法。`Linux for beginners` 涵盖了所有初学者应该知道的所有重要方面。我要求你想象一下在使用这个出色的操作系统时，没有任何困难或困惑。\n\
  \n阅读并理解这本书将使这一切成为现实。在开始，我们将探索 `Linux` 的历史和起源，以便我们有一个清晰的视野并遵循方法论。然后，我们将学习并理解如何安装系统，并了解运行操作系统所需的必要设备和硬件。\n\
  \n我们还将学习非常重要的 `shell` 以及所有相关的命令。当然，我们不能忘记非常有用且常用的命令行。`File globbing`（文件通配符）也将被涵盖；这对于\
  \ `Linux` 初学者来说真的是不可或缺的。\n\n然后我们将进入用户管理和身份验证，这将无疑帮助你保护数据并管理所有用户的访问权限。在最后，为了使其完整并对\
  \ `Linux` 学习者和初学者真正有用，我们包含了一些非常重要的 `Linux` 技巧，并讨论了 `Vi` 编辑器，这是一个非常值得了解的话题。\n\n#\
  \ 第 1 章 – 历史亮点\n在本章中，我们将探索并学习我们的操作系统历史，这非常重要。此外，一旦你阅读完毕，将了解许多 `Linux` 初学者必不可少的通用信息。\n\
  \n## Linux 的历史与起源\n`Linus B.Torvalds` 是这个完全免费的操作系统背后的功臣。在 90 世纪初，`Linus` 想开发自己的操作系统并作为毕业项目提交。他打算开发一个运行在\
  \ `80386` 类型架构上的 `UNIX` 版本。`Minix` 是第一个运行在 PC 上的 `UNIX` 克隆系统，由 `Andrew Tanenbaum`\
  \ 编写。Linus Torvalds` 决定扩展 `Minix` 的可能性，创建了后来成为 `Linux` 的东西。许多人对这一倡议感到好奇并帮助 `Linus\
  \ Torvalds` 完成了这个系统，以便在 1992 年发布了几乎没有 bug 的第一个版本系统。\n\n随着开发该系统的开发者数量增加，它能够快速整合商业\
  \ `UNIX` 系统中工具的免费重新开发。`Linux` 的新工具现在以惊人的速度出现。\n\n该系统的独特性在于 `Linux` 并不是为了商业目的而开发的。事实上，没有任何代码是从原始的\
  \ `UNIX` 系统复制的（实际上 `Linux` 借鉴了许多商业 `UNIX` 版本：如 `UNIX System V`）。因此，从诞生起，每个人都可以自由地使用并改进它。\n\
  \n尽管 `Linux` 最初设计为在 PC 上运行，但它现在已经开发并适应了许多其他平台，例如 `SPARC` 工作站、`Macintosh`，甚至如个人助理\
  \ (`PDA`) 等平台，甚至是视频游戏机！\n\n## 核心概念与发行版\n`Linux` 围绕一个负责处理设备的 `kernel`（内核）构建。我们将发行版称为在\
  \ `Linux` 内核周围汇组装的一套软件，以提供一个开箱即用的系统。发行版的 `kernel` 可以更新以包含最新的材料；然而，这种涉及重新构建 `kernel`\
  \ 的操作是困难的，因为它需要对系统和设备有一定程度的知识。`kernel` 的重新编译留给专家或愿意通过制作出不可用的系统来学习的用户。\n\n大多数发行版还提供它们自己的图形化安装和一个包管理系统，通过管理依赖关系自动安装软件（`Linux`\
  \ 下的软件有时与外部库链接或依赖其他软件）。\n\n每个发行版都有其优缺点。事实上，某些更适合初学者并提供高级的图形界面，而另一些则偏安全性或扩展性。最著名的发行版有：\n\
  \n- `RedHat` 发行版\n- `Debian` 发行版\n- `SuSe` 发行版\n- `Knoppix` 发行版\n- `Slackware`\n\
  - `Mageia` 发行版\n\n## 系统特性\n`Linux` 是一种类似于 `UNIX` 系统的操作系统，可以在不同的硬件平台上运行：`x86`（即基于\
  \ `Intel`、`AMD` 等平台）、`Sparc`、`PowerPC`、`Alpha`、`ARM` 等。因此，`Linux` 系统可以在个人电脑上作为游戏机或个人助理运行！\n\
  \n`Linux` 因此是一个多平台系统。它也是多用户的（几个人可以同时在同一台计算机上工作），也是多任务的（多个应用程序可以同时运行而互不影响）以及多处理器的。\n\
  \n`Linux` 被认为是可靠、健壮且强大的。它还能够在资源非常少的低端或低性能计算机上运行。\n\n`Linux` 系统特别具有以下优势：\n\n- 支持互联网标准，即\
  \ `TCP/IP` 协议，一组互联网协议。`Linux` 是一种创建本地网络以连接互联网并建立服务器的免费方法。\n- 由于源代码的透明性以及社区在漏洞公告期间的响应，具有更高的安全性。\n\
  - 内存空间和磁盘空间的划分，配合严格的权限管理，以最小的风险管理大量用户。\n- 完全可配置的内核，取决于安装该系统的机器硬件，以实现性能最大化。\n\n#\
  \ 第 2 章 – 安装 Linux\n这一章非常有用，因为它涵盖了许多重要细节，并为 Linux 初学者提供了最佳解决方案。\n\n## 必要材料\n`Linux`\
  \ 并不需要配置要求的最新计算机：\n\n- 最低 `386SX` 处理器\n- `4MB` 内存（推荐 `8MB`）\n- 硬盘控制器和一个具有 `20MB`\
  \ 空闲空间的磁盘（推荐 `100MB`）（`Linux` 实际上可以从单磁盘运行）\n- 一个 `CD-ROM`\n\n关于外接设备，市场上常见的硬件组件更有可能被\
  \ `Linux` 支持……\n\n## 前提条件\n除了机器上已经安装的操作系统外，还可以安装 `Linux`。在开始安装之前，请确保使用 `scandisk`\
  \ 或 `chkdsk` 等程序检查文件系统以验证读取器的完整性，因为 `Linux` 使用的磁盘比 `DOS` 磁盘强大得多例如\n\n## 安装阶段\n`Linux`\
  \ 的安装分阶段完成，以便在 `Linux` 支持的文件系统（`ext2fs`）上现在一个或多个专用分区，然后进行安装本身，最后在从光盘启动之前配置内核，步骤如下：\n\
  \n- 创建软盘\n\n\n\n\n\n- 从软盘启动系统\n- 创建硬盘的主分区\n- 创建交换空间分区 (swap partition)\n- 创建文件系统\n\
  - Linux 安装\n- 内核配置\n- 系统重启\n\n## 创建启动磁盘和根磁盘\n\n通过软盘以带有最小化 Linux 内核的模式启动系统，我们将能够安装\
  \ Linux。这些磁盘将使用一个程序将镜像文件（所有要放入软盘的数据）拷贝到磁盘上。这些磁盘共有两个：\n\n- 启动磁盘：包含用于启动系统的 Linux 内核\n\
  - 根磁盘：包含安装软件\n\n在每情况下，选择的镜像文件取决于你的系统配置，其名称为：\n\n- `scsi`，适用于 SCSI CD-ROM 驱动器\n-\
  \ `sbcd`，适用于松下 CD-ROM 驱动器或连接到 Sound Blaster Pro\n- `nec260`，适用于 Nec 260 CD-ROM\n\
  - `Mitsumi`，适用于 Mitsumi CD-ROM\n- `cdu31a`，适用于 Sony cdu31 CDU33a CD-ROM\n- `cdu535`，适用于\
  \ Sony CDU531 CDU535 CD-ROM\n\n你只需为两个镜像文件（启动和根）中的每一个，进入包含正确镜像文件的目录并输入程序 `\\rawrite`，程序会询问你镜像文件的名称（例如\
  \ `scsi`），然后是驱动器（`a:`）\n\n你还可以选择创建一个额外的磁盘以备后用（例如，如果你在拥有 IDE CD-ROM 驱动器的同时计划购买 SCSI\
  \ 卡……）\n\n## 从启动磁盘启动\n\n磁盘创建完成后，重启电脑并注意将启动磁盘放入 `a :` 驱动器中。\n\n在显示一些消息后，系统会显示“boot”行，按回车继续。系统随后会调用根磁盘。\n\
  \n## 创建分区\n\n要使用 Linux，你需要使用 `Linux Ext2` 文件系统创建一个分区（最好大于 900MB 以安装所有选项），以及（可选的）一个几十\
  \ MB 的交换空间分区（即虚拟内存，也就是说，在内存不足时使用的磁盘部分）。\n\n创建分区可以通过不同的方式完成：\n\n在用软盘启动系统之前，在 Microsoft\
  \ 系统下：\n\n- 在 Windows 9x 中，使用 `Partition Magic 4` 软件可以非常方便地创建 `ext2fs` 和交换分区，而不会丢失磁盘上的数据\n\
  - 在 MS-DOS 下，使用标准提供的 `fdisk` 软件，它比 Linux 提供的同名同事更符合人体工程学\n- 还有一个名为 `fips` 的 DOS\
  \ 工具程序。它允许对分区执行操作。\n\n在 Linux 上，启动系统后。接下来的发行安装程序有所不同：\n\n- 对于 Slackware 类发行版，你需要手动输入命令，即依次执行格式化、分区、创建文件系统并安装\n\
  - 对于 RedHat 类发行版，这些操作是自动化的，你只需要回答问题……\n\n在创建分区时，你肯定会被问到之前分区的类型\n\n遵循以下步骤：\n\n- 备内存输入类型\
  \ 82\n- 主分区输入类型 83\n- 主分区必须在磁盘从第一个磁道到第 1023 个磁道的范围内！\n- 在纸上记录主分区和交换分区的尺寸（以块为单位），因为这有助于后续操作\n\
  \n## 创建文件系统\n\n在某些发行版中，你将在启动安装前被要求创建一个文件系统（RedHat 5.2 和 Mandrake 6.0 等发行版就不属于这种情况，它们的以下所有操作都通过菜单自动完成）。\n\
  \n当你创建了主分区和备内存分区（交换分区）后，这是为了激活备内存并创建根分区的文件系统。\n\n激活备内存通过命令完成：\n\n```\nmkswap -c\
  \ partition size\n```\n\n例如，对于第二个磁盘的第二个分区 (`hdb2`) 上使用 10000 个块的备内存，命令为：\n\n```\n\
  mkswap -c / dev / hdb2 11000\n```\n\n然后使用 `swapon` 命令启动它。\n\next2 文件系统的创建通过以下命令完成：\n\
  \n```\nmke2fs -c partition size\n```\n\n例如：\n\n```\nmke2fs -c / dev / hda2 202137\n\
  ```\n\n## 安装 RedHat\n\nRedHat 发行版目前是最受推崇的发行版之一，因为其安装过程非常简单。事实上，该程序只需要求你从下拉列表中为主设备做出选择，以及关于语言或需要安装的软件包的选择。以下是需要遵循的不同步骤：\n\
  \n- 语言选择：选择安装程序将使用的语言\n- 键盘选择\n- 安装支持选择：如果你的 Linux 发行版在 CD 上，选择 CD-ROM；否则，如果是下载的副本，请选择硬盘\n\
  - 安装样式选择：选择是对以前系统的更新还是全新安装\n- 安装类型：系统允许你在工作站、服务器或自定义之间进行选择。你完全应该选择自定义配置，这会给你更大的灵活性\n\
  - SCSI 适配器选择：如果你有 SCSI 适配器，应回答是。系统将检测你的硬件。如果这种自动搜索失败，你只需要输入一行参数，让它知道是哪种 SCSI 适配器，以及其\
  \ IRQ 和内存地址。一张地址为 `0x140` 且 IRQ 为 `10` 的“AHA1520” 卡在命令行中将位于定位置为：`= aha152x 0x140,10`\n\
  - 硬盘分区：RedHat 允许在此安装阶段对磁盘进行分区（如果你之前没有做过的话），并让你在磁盘分区工具和 `fdisk` 之间进行选择\n- 选择硬盘：软件允许你从列表中选择要创建分区的硬盘\n\
  - 删除不必要的分区：在 `fdisk` 下使用 `d` 键可以删除不必要的分区（注意不要删除你的 Windows 分区！）\n- 创建 Linux 分区：`n`\
  \ 键和 `p` 键允许你创建根分区、交换分区以及你可能需要的其他分区。需要分区的第一个磁道编号和其尺寸（单位为 MB）\n- 修改分区类型：通过 `t` 键你可以为交换分区分配类型\
  \ 82，为 Linux 分区分配类型 83……\n- fdisk 输出：通过按下 `q` 键退出 `fdisk` 并放弃更改。通过按下 `w` 键在退出前保存更改\n\
  - 选择挂载点：屏幕提供几个分区，此时你需要选择你想要使用的分区并逐个命名，即指定挂载点。根分区是强制的，它是主分区且必须命名为 `/`。每个希望在 Linux\
  \ 下使用的分区都必须分配一个挂载点（例如 `/home`，或者对于希望安装后自动挂载的 DOS 分区使用 `/mnt/dos`）\n- 选择交换分区：系统要求选择作为备内存的分区\n\
  - 格式化分区：你必须选择你创建的所有新分区。注意不要格式化包含数据的分区！\n- 软件包选择：此选项要求你只需从列表中选择要安装的内容\n- 安装/拷贝软件包：逐个安装系统所有所需的软件包。此操作可能会非常长！（可能长达半小时……）\n\
  - 网络配置：适用于带有网卡（而非调制解调器）的计算机\n- 时钟选择：选择适合你国家的时钟\n- 启动服务选择：你可以从列表中选择每次启动时激活的服务\n-\
  \ 打印机选择：一系列问题将允许你通过从列表中选择打印机并指定其连接端口来配置\n- 密码输入：密码你将被要求输入超级用户（`root`），也就是说，拥有所有权限的用户\n\
  \n\n\n\n一旦你完成了所有这些步骤，计算机将重启，你将面对一个显示 LILO 的提示：只需输入 `Linux` 即可在 Linux 下启动，输入 `dos`\
  \ 进入你的 DOS 分区，上面有 Windows 9 xs、DOS 或其他系统……\n\n当在 Linux 下启动并输入超级用户用户名（`root`）和密码时，你需要安装一个图形界面，它会比控制台（文本模式）更友好。\n\
  \n## 安装 XFree86\n\nXFree86 是 Linux 下的一个图形界面（XWindow 是 UNIX 工作站的界面）。若要配置 XFree86，只需在命令行中输入大写的\
  \ `XF86Setup`。屏幕会出现一个界面，要求你提供屏幕信息并配置显示器。随后会出现一个图形窗口，你可以在其中标签页中配置计算机的每项硬件。\n\n因此，我们必须首先配置鼠标，它大多数是微软鼠标类型（PS\
  \ / 2 或如果连接到特殊端口），连接在 `COM1`（或 `COM2`）。\n\n键盘通常不需要更改，但请务必小心显卡的设置，因为它们将直接影响显示，导致错误时显示不稳定（例如屏幕闪烁）。\n\
  \n一旦所有输入参数都就绪，退出设置程序并返回控制台下的命令行。只需输入 `startx` 即可启动 X-Window。\n\n## 第 3 章 – Shell\n\
  \n在本章中，我们将学习一个非常重要的概念。你将许多关于 shell 的重要细节，这些将帮助你在自学过程中不断进步。\n\n## Shell 简介\n\n操作系统与用户之间的界面是命令解释器，因此被称为“shell”（壳）。\n\
  \n![`i.stack.imgur.com/Znlqz.jpg`](img/00001.jpeg)\n\n因此，shell 负责通过用户输入的命令行在操作系统和用户之间建立桥梁。它的作用是读取命令行、解释其含义、执行它们，然后将结果返回到输出端。\n\
  \nshell 实际上是一个可执行文件，负责解释指令、将其传输给系统并返回结果。有很多不同的 shell；最常见的是 `sh`（称为 \"Bourne shell\"\
  ）、`bash`（\"Bourne again shell\"）、`csh`（\"C Shell\"）、`Tcsh`（\"Tenex C shell\"）、`ksh`（\"\
  Korn shell\"）和 `zsh`（\"Zero shell\"）。它们的名字通常就是可执行文件的名称。\n\n每个用户都有一个默认 shell，它会在打开命令提示符时启动。默认\
  \ shell 指定在配置文件 `/etc/passwd` 中对应用户的行的最后一个字段中。你可以通过简单地执行对应文件来更改会话中的 shell，这是一个示例：\n\
  \n```\n/Bin/bash\n```\n\n## 命令提示符 (prompt)\n\nshell 的初始化通过读取其整体配置（位于 `/etc/` 目录的文件中），接着读取用户特定的配置（位于一个以点开头的隐藏文件中，位于用户基础目录，即\
  \ `/home/username/` 下的配置文件），然后显示如下的命令提示符：\n\n`Machine:/directory/current$`\n\n在大多数\
  \ shell 中，默认提示符由机器名组成，后面跟着冒号（`:`）、当前目录，以及一个指示已登录用户类型的字符：\n\n- 普通用户用 `$` 表示 \n- 管理员（称为\
  \ \"root\"）用井号 \"#\" 表示\n\n## 命令行概念\n\n命令行是一个字符字符串，由一个对应系统可执行文件或 shell 命令的命令以及可选参数（参数）组成：\n\
  \n```\nls –al /home/j/\n```\n\n在上面的命令中，`ls` 是命令名，`-al` 和 `/home/jimmy/` 是参数。以 `-`\
  \ 开头的参数称为选项。\n\n对于每个命令，通常有许多可用选项，可以通过输入以下命令查看详细信息：\n\n```\ncommand--help\n```\n\n\
  ```\ncommand -?\n```\n\n```\nman command\n```\n\n## 标准输入/输出\n\n执行命令时，会创建一个进程。该进程将打开三个流：\n\
  \n- `Stdin`：进程从这里读取输入数据。称为标准输入。默认情况下 `stdin` 是键盘。`STDIN` 由数字 `0` 标识。\n- `Stdout`：进程写入输出数据的地方。称为标准输出。默认情况下\
  \ `stdin` 对应屏幕；`STDOUT` 由数字 `1` 标识。\n- `Stderr`：进程写入错误信息的地方。称为标准错误。默认 `stderr` 在屏幕上。`STDERR`\
  \ 由数字 `2` 标识。\n\n默认情况下，执行程序时数据从键盘读取，程序将其输出和错误发送到屏幕，但也可以从任何设备读取数据作为输入，或从文件读取，并将输出发送到显示设备、文件等。\n\
  \n## 重定向 (Redirects)\n\nLinux 与任何类 Unix 系统一样，都具有将标准输入输出重定向到文件的机制。\n\n因此，使用字符 `>`\
  \ 将命令的标准输出重定向到位于右侧的文件：\n\n```\nls -al /home/jf/> test.txt\n```\n\n```\necho \"test\"\
  > /etc/myconfigurationfile\n```\n\n以下命令等同于复制文件：\n\n```\ncat file1>file2\n```\n\n\
  重定向 `> ` 旨在创建一个新文件。因此，如果存在同名文件，它将被覆盖。以下命令仅简单地创建一个空文件：\n\n```\n> File\n```\n\n使用双字符\
  \ `>>` 将标准输出附加到文件，即在文件后添加输出而不覆盖它。\n\n类似地，`<` 字符表示标准输入的重定向。下一个命令将 `foo.txt` 文件的内容作为输入发送给\
  \ `cat` 命令，`cat` 的唯一目的是是将内容显示在标准输出上（虽然这没什么用，但可以作为练习示例）：\n\n```\ncat<foo.txt\n```\n\
  \n最后，使用重定向 `<<` 可以从标准输入读取内容，直到遇到右侧的链。因此，以下示例将读取标准输入直到遇到单词 STOP，然后显示结果：\n\n```\n\
  cat<< STOP\n```\n\n## 管道 (pipes)\n\n管道是所有 UNIX 系统中特有的通信机制。管道用竖线（`|`）表示，用于将一个命令的标准输出分配给另一个命令的标准输入，例如用于一个命令的标准输入与另一个命令的标准输出之间的通信。\n\
  \n在下面的示例中，`ls -al` 命令的标准输出被发送给按字母顺序排序结果的程序：\n\n```\nls -al | sort\n```\n\n通过这种方式，可以通过连续的管道链接多个命令。在下面的示例中，命令显示当前目录下的所有文件，选择包含“zip”字样的行（使用\
  \ `grep` 命令）并统计总行数：\n\n```\nls -l | grep zip | wc -l\n```\n\n## 第 4 章 – 文件通配 (File\
  \ Globbing)\n\n这一章是最重要的章节之一，因为它涵盖了一个非常有趣的话题。了解 Linux 中的文件层次结构是必不可少的。我们还将学习常用的 shell\
  \ 命令。\n\n## Linux 中的文件层次结构\n\n为了确保可移植性和兼容性，Linux 系统遵循单一标准 FHS（文件层次结构标准）。基础层次结构如下：\n\
  \n| | | |\n| :--- | :--- | :--- |\n| | | 根目录，包含主目录 |\n| `/bin` | | 包含所有用户使用的系统基本可执行文件（例如\
  \ `ls`, `rm`, `cp`, `chmod`, `mount`, ...） |\n| `/boot` | | 包含允许 Linux 启动的文件 |\n\
  | `/dev` | | 包含设备入口 |\n| `/etc` | | 包含系统管理员所需的命令和文件 (`group`, `passwd`, `ld.so.conf`,\
  \ `inittab`,...) |\n| | `/etc/X11` | | 包含 X 配置特定文件 |\n| | `/etc/opt` | | 包含安装在 /opt\
  \ 中的应用程序特定配置文件 |\n| `/home` | | 用户目录 |\n| `/lib` | | 包含系统启动所需的共享库 |\n| `/mnt` |\
  \ | 包含临时挂载点分区（光驱、软盘、...） |\n| `/opt` | | 包含额外的应用程序包 |\n\n\n\n\n\n| 路径 | 描述 |\n|\
  \ :--- | :--- |\n| `/root` | 根目录管理员 |\n| `/sbin` | 包含核心系统二进制文件（如 adduser） |\n| `/tmp`\
  \ | 包含临时文件 |\n| `/usr` | 次级层次 |\n| `/usr/X11R6` | 此目录保留用于系统 X 版本 11 发布 6 |\n| `/usr/X386`\
  \ | 曾用于 X 版本 5，是 `/usr/X11R6` 的符号链接 |\n| `/usr/bin` | 包含大多数二进制文件和用户命令 |\n| `/usr/include`\
  \ | 包含 C 和 C++ 程序的头文件 |\n| `/usr/lib` | 包含大多数系统共享库 |\n| `/usr/local` | 包含 root 在本地机器上安装程序的数据\
  \ |\n| `/usr/local/bin` | 本地程序的二进制文件 |\n| `/usr/local/games` | 本地游戏的二进制文件 |\n| `/usr/local/include`\
  \ | 本地 C 和 C++ 头文件 |\n| `/usr/local/lib` | 本地共享库 |\n| `/usr/local/sbin` | 本地二进制系统\
  \ |\n| `/usr/local/share` | 自治层次 |\n| `/usr/local/src` | 本地源文件 |\n| `/usr/sbin`\
  \ | 包含供系统管理员使用的非核心系统二进制文件 |\n| `/usr/share` | 保留用于非依赖数据架构 |\n| `/usr/src` | 源代码文件\
  \ |\n| `/var` | 包含变量数据 |\n\n## 主要 Linux Shell 命令表\n\n| 命令 | 描述 | 等效 DOS 命令 |\n|\
  \ :--- | :--- | :--- |\n| `Ls` | 列出目录内容 | `dir` |\n| `Cd` | 切换目录 | `cd` |\n| `cd\
  \ ..` | 父级目录 | `cd..` |\n| `Mkdir` | 创建新目录 | `md` |\n| `Rmdir` | 目录 | `deltree`\
  \ |\n| `Cp` | 文件复制 | `copy, xcopy` |\n| `Mv` | 文件移动 | `move` |\n| `Rm` | 删除文件 |\
  \ `del` |\n| `Passwd` | 修改用户密码 | |\n| `Cat` | 显示文件内容 | `type` |\n| `More` | 分页显示文件内容\
  \ | `more` |\n| `man apropos` | 请求命令的帮助信息 | `help` |\n| `Lpr` | 打印请求的文件 | `print`\
  \ |\n| `Chmod` | 更改文件属性 `chmodxxx filexxx = User-Group-Others` 其中 `x` 为整数 `1 < x<7`\
  \ 读 = 4，写 = 2，执行 = 1x = 读 + 写 + 运行 0 表示无权限 1 表示执行权限 2 表示写入权限 3 表示读写和执行权限 4 表示读取权限\
  \ 5 表示读取和执行权限 6 表示读写权限 7 表示所有权限 | | |\n| `Chfn` | 更改通过 finger 查看的个人信息 | |\n| `Chsh`\
  \ | 更改 shell：`chsh user shell_location` | |\n| `Finger` | 列出在线用户 | |\n| `traceroute`\
  \ | 追踪本地机器与远程机器之间的路径 | |\n| `[ftp](http://www.commentcamarche.net/contents/531-protocoles#FTP)[machine]\
  \ [port]getputquit` | 本地机器与目标机器之间的文件传输 恢复文件 发文件 退出 FTP 会话 | |\n| `telnet [machine]`\
  \ | 执行 telnet | |\n| `Talk` | 允许与已连接的用户交谈 (talk user) | |\n| `Mesg` | 授权或禁止 talk\
  \ 命令 `mesg n: 防止接收 talk 消息` `mesg y: 允许接收 talk 消息` | |\n| `Logout` | 断开连接 | |\n\n\
  ## 第 5 章 - 用户管理\n\n这一章也非常重要，因为它涵盖了身份验证和用户管理的所有细节。它还包含了许多有用信息，随着我们旅程的深入，你一定会发现这些非常有帮助。\n\
  \n### 管理员的第一步\n\n当多个人可以访问系统时，你需要系统管理员来管理用户。为此，必须了解用于配置的常用命令和文件。\n\n需要了解的重要文件：\n\n\
  - `/etc/passwd`\n- `/etc/group`\n\n### /etc/passwd 文件\n\n`/etc/passwd` 文件包含所有用户信息（登录、密码等）。只有超级用户（`root`）能够修改它。因此，我们必须更改此文件的权限，使其对其他用户仅只读。\n\
  \n该文件有一个特殊格式来识别每个用户；每行具有以下格式：\n\n`账户名:密码:用户数:组组数:注释:目录:启动程序`\n\n这七个字段由字符 \":\" 分隔，解释如下：\n\
  \n- 用户的账户名\n- 用户密码（当然是加密的）\n- 操作系统识别用户的整数（`UID` = User ID，用户 ID）\n- 识别用户组的整数（`GID`\
  \ = Group ID，组组 ID）\n- 注释，可以在其中找到用户的信息或直接是其真实姓名\n- 连接系统后连接目录所在的位置\n- 连接系统后执行的命令（通常是\
  \ shell）\n\n这是一个 `passwd` 文件的示例：\n\n```\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/bin/bash\n\
  daemon:x:2:2:daemon:/sbin:/bin/bash\nnews:x:9:13:News system:/etc/news:/bin/bash\n\
  uucp:x:10:14::/var/lib/uucp/taylor_config:/bin/bash\ncquoi:x:500:100:Cool......:/home/cquoi:/bin/bash\n\
  ```\n\n非常重要的一点是，该文件中的密码是加密的。\n\n因此，通过直接输入密码来编辑和替换 `password` 字段是没用的，这会导致账户被锁定。当用户连接时，登录程序会将用户输入的密码（加密后）与\
  \ `passwd` 文件中的密码进行比比较。如果它们不同，则无法建立连接。要禁止使用，只需将加密密码替换为星号：`*`。\n\n账户访问可能因密码为空而开放。在这种情况下，任何想要连接此账户的人都可以。要使用\
  \ `passwd` 命令更改账户密码，你必须是系统管理员或账户所有者（系统会提示用户输入旧密码，然后要求输入两次新密码）。\n\n`UID`：每个用户账户的唯一标识符。数字‘0’到‘99’预留给经常拥有的账户。大于‘100’的数字预留给这些用户。\n\
  \n`GID`：组 ID。默认组的数字是 50。此标识符与对文件的访问权限有关。这个问题告诉你你的系统是否有多个用户组（你随后将需要担心 `/etc/group`）。\n\
  \n可以从 Shell 修改命令解释器。要这样做，使用 `chsh` 或 `passwd -s` 命令。Linux 随后会在 `/etc/shells` 文件中查找你指定的程序。只有文件中存在的命令会被接受，并替换启动程序字段的当前值。这些限制不适用于超级用户账户。\n\
  \n确保 `/etc/passwd` 文件的权限与 `/etc/shells` 文件相同。`root` 可以被称为除 root 外的名称。要更改此，只需将 root\
  \ 账户名称替换为你所需的名称即可。\n\n如果账户标识符（`UID`）为零，意味着它是一个特权账户。\n\n### /etc/group 文件\n\n`/etc/group`\
  \ 文件包含不同组的用户列表。事实上，当许多用户可以访问系统时，他们经常被组合在不同的组中，每个组对文件和目录都有自己的访问权限。\n\n它由由 \":\" 分隔的各种字段组成：\n\
  \n`组名:特殊字段:组编号:成员 1, 成员 2`\n\n特殊字段通常是空白的。\n\n组编号是连接 `/etc/group` 和 `/etc/passwd`\
  \ 文件的字段。\n\n这里是 /etc/group 的示例：\n\n```\nroot:x:0:root\nbin:x:1:root,bin,daemon\n\
  daemon:x:2:\ntty:x:5:\ndisk:x:6:\nlp:x:7:\nwwwadmin:x:8:\nkmem:x:9:\nwheel:x:10:\n\
  mail:x:12:cyrus\nnews:x:13:news\n```\n\n- 当使用 `-l` 使用 `ls` 命令时，将显示与所有文件（或目录）的用户编号。\n\
  \n- 同一个用户出现在多个组中。连接系统时，它属于 `/etc/passwd` 中指定的组（`GID` 字段）。这可以通过 `newgrp` 命令进行更改。对文件的访问权限随后进行定义。\n\
  \n\n\n\n\n- 文件保护必须防止非特权用户编辑。\n- 要添加一个组，管理员可以使用文本编辑器编辑 `/etc/group`。他也可以使用 `addgroup`\
  \ 或 `groupadd` 命令（并非总是存在）。在第一种情况下，他将只拥有与要添加的组对应的行。例如，该行：`admin:: 56: ccm`\n- 要将一个用户添加到组中，只需编辑\
  \ `/etc/group` 并在行末尾添加名称，并用逗号分隔成员名称。\n- 若要删除一个组，只需编辑 `/etc/group` 并删除相应的行。但请注意，如果用户属于该组，请不要忘记更改\
  \ `/etc/passwd` 中已删除组的数字（`GID`）。此外，查找并修改该组的文件和目录也是至关重要的（否则，这些文件和目录可能无法访问）。\n\n###\
  \ 自定义 shell\n\n`/etc/profile` 配置 Shell。它涉及所有用户。\n\n首先，它包含了 Shell 的变量，如 `PATH`、`OPENWINHOME`……\n\
  \n然后，相应地定义了终端类型和 `TERM` 变量。一部分专门用于提示符；最后，最后一部分允许定义 `ls` 命令的颜色。\n\n在 Linux 启动时，如果有发光的数字键盘会很好，但默认情况下不是这样的。\n\
  \n因此，需要在 `/etc/profile` 中添加几行：\n\n```\nINITTY=/dev/tty[1-7]\nfor tty in $INITTY;\n\
  do setleds -D +num< $tty\nDone\n```\n\n连接到 Shell 时，首先出现的是提示符；它可以根据用户喜好进行配置。\n\n\
  如果管理员想要拥有一个名为“Hello #”的提示符，他只需要编辑 `/etc/profile`。它包含一个名为 `PS1` 的变量。所有与该变量相关的行都必须以哈号\
  \ `#` 开头。然后添加行 `PS1 = 'Hello #'`。\n\n剩下的工作就是保存并重新登录。然后我们就可以看到更改了。\n\n提示：在提示符后留一个空格以提高可读性。在提示符中使用变量也是可能的（例如显示时间或机器名称……）：\n\
  \n| `\\d` | 添加日期（英文格式） |\n| `\\t` | 添加时间（HH: MM: SS） |\n| `\\u` | 添加用户名 |\n| `\\\
  r` | 换行 |\n| `\\w` | 添加当前目录的完整路径 |\n| `\\W` | 添加当前目录 |\n| `\\h` | 添加机器名称 |\n\n也可以更改颜色。为此，像这样使用\
  \ `PS1` 变量：`PS1 = '\\[\\033 [color_number] wanted_prompt\\033[0m]'`\n\n颜色数字将取自列表：\n\
  \n| 黑色 | 0;30 |\n| 红色 | 0;31 |\n| 绿色 | 0;32 |\n| 棕色 | 0;33 |\n| 蓝色 | 0;34 |\n| 紫色\
  \ | 0;35 |\n| 青色 | 0;36 |\n| 浅灰色 | 0;37 |\n| 灰色 | 1;30 |\n| 粉色 | 1;31 |\n| 浅绿色 |\
  \ 1;32 |\n| 浅棕色 | 1;33 |\n| 浅蓝色 | 1;34 |\n| 浅紫色 | 1;35 |\n| 浅青色 | 1;36 |\n| 白色 |\
  \ 1;37 |\n\n一个显示时间后跟红色用户名的示例：\n\n`PS1 = '\\ t \\ [\\ 033 [0; 31m] \\ u \\ 033 [0m]'`\n\
  \n# 第 6 章 - Linux 技巧与技巧\n\n为了完整，本章包含了几个有趣且非常用的技巧。\n\n## 挂载 CD-ROM\n\n在 Linux 上挂载\
  \ CD-ROM 必须以系统管理员身份登录，即使用登录名 \"root\"。\n\n然后挂载驱动器，也就是说通过输入此命令将 CD-ROM 驱动器的内容“挂载”到一个目录（大多数情况下为\
  \ `/mnt/cdrom/`）：\n\n```\nMount -t iso9660 /dev/cdrom/mnt/cdrom\n```\n\n不要忘记使用命令卸载驱动器\n\
  \n```\nUmount /mnt/cdrom\n```\n\n## 挂载 DOS 分区\n\nLinux 可以通过将 MS-DOS 分区挂载到 UNIX 文件系统中来访问它们。要挂载\
  \ `/dev/hda1`，只需输入：\n\n```\nmount -t msdos/dev/hda1/mnt/hd\n```\n\n不要忘记卸载分区\n\n\
  ```\numount /mnt/hd\n```\n\n## 挂载软磁盘驱动器\n\n与 MS-DOS 分区一样，你可以挂载软磁盘驱动器并使用命令访问 DOS\
  \ 中格式化磁盘上的数据：\n\n```\nmount -t msdos/dev/fd0/mnt/fd\n```\n\n不要忘记移除软磁盘驱动器\n\n```\n\
  umount /mnt/fd.\n```\n\n## 重启电脑\n\n正确重启电脑，只需使用 `shutdown` 命令。在大多数 Linux 发行版中，`<CTRL><ALT><DEL>`\
  \ 序列已编程为匹配 shutdown 命令。\n\n要快速重启只需输入 `shutdown -r now`。\n\n## 强制识别 SCSI 控制器\n\n\
  当控制器没有 bios 时，Linux 通常无法检测到，在这种情况下，必须通过输入 LILO 提示符来强制检测：\n\n```\nBoot: linux tmx8xx\
  \ = <IRQ>, <address>\n```\n\n`tmx8xx` 代表 `TMC-8xx` 控制器，如果你有另一个，你需要知道它的名称。`IRQ` 代表控制器的中断，`\"\
  address\"` 代表共享内存的地址。\n\n## 创建别名 (Alias)\n\n首先，什么是别名？\n\n这是一个在另一个地方运行的快捷命令，它可能也可以扩展到其他概念；别名可以是电子邮件的快捷方式。\n\
  \nLinux 下挂载设备的命令是（如你上面看到的，输入起来很费劲）。\n\n所以，与其输入命令：\n\n`\"Mount -t iso9660/dev/cdrom/mnt/cdrom\"\
  `（注：此处原文可能有引号错误）\n\n不如输入：\n\n```bash\naliascdrom = \"mount -t iso9660/dev/cdrom/mnt/cdrom\
  \ '\n```\n\n现在只需输入 `cdrom` 即可挂载设备。\n\n但是，你可能会问，如果我每次重启系统都要声明它，为什么要输入这个命令呢？\n\n为了避免这种情况，编辑\
  \ `/etc/bashrc` 文件并添加行：\n\n```bash\naliascdrom = \"mount -t iso9660/dev/cdrom/mnt/cdrom\
  \ '\n```\n\n# 第 7 章 - Vi 编辑器\n\n文本编辑器在 Linux 下很常用。在本章中我们将学习一种广泛使用的编辑器。\n\n## Vi\
  \ 简介\n\nVi 是 Unix 系统下最流行的文本编辑器之一（还有 Emacs 和 pico），尽管它的人体工程学非常有限。在 Linux 中，有一个 Vi\
  \ 的免费版本叫做 `Vim` (增强版 Vi)。`Vi`（读作 vee-eye）是一个完全在文本模式下工作的编辑器，这意味着每个操作都是使用文本命令完成的。这个编辑器虽然乍看起来并不方便，但它非常强大，在操作\
  \ GUI 的情况下非常有用。\n\n启动 Vi 的语法如下：\n\n```bash\nVi file_name\n```\n\n打开文件后，可以使用光标移动，以及\
  \ `h`、`j`、`k` 和 `l`（在键盘没有方向键的情况下）。\n\n## Vi 模式\n\nVi 有 3 种操作模式：\n\n- **普通模式 (Normal\
  \ mode)**：你打开文件时所在的模式。它允许你输入命令。\n- **插入模式 (Insert mode)**：此模式允许你在文档中插入你输入的字符。要切换到插入模式，只需按下键盘上的\
  \ `Insert` 键，或者按下 `i` 键。\n- **替换模式 (Replacement mode)**：此模式允许你用输入的文本替换现有文本。只需再次按下\
  \ `r` 进入替换模式，并按下 `Esc` 键返回普通模式。\n\n## 基础命令\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `:q`\
  \ | 退出编辑器（不保存） |\n| `:q!` | 强制编辑器退出且不保存（即使对文档进行了更改） |\n| `:wq` | 保存文档并退出编辑器 |\n\
  | `:filename` | 以指定的名称保存文档 |\n\n## 编辑命令\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `X` |\
  \ 删除光标下方的当前字符 |\n| `Dd` | 删除光标下方的当前行 |\n| `Dxd` | 从当前光标处删除 x 行 |\n| `Nx` | 从当前光标处删除\
  \ n 个字符 |\n| `x>>` | 从当前光标处向右缩进 x 行 |\n| `x<<` | 从当前光标处向左缩进 x 行 |\n\n## 搜索与替换\n\n\
  要在文档中查找单词，只需（在普通模式下）输入 `/` 后跟搜索字符串，然后按回车键确认。\n\n随后可以使用 `n` 键在出现处之间跳转。\n\n要在行内将一个字符串替换为另一个，Vi\
  \ 中有一个使用正则表达式的强大命令，语法如下：\n\n```bash\n:S/string_to_be_replaced/new_string/\n```\n\
  \n可以使用以下语法扩展到整个文档：\n\n```bash\n:%S/string_to_be_replaced/new_string/\n```\n\n##\
  \ 复制粘贴与剪切\n\n在 Vi 中可以复制并粘贴一组行。要这样做，只需输入以下命令复制 n 行：\n\n```bash\nnyy\n```\n\n\n\n\n\
  举例来说，这里有一个复制缓冲区中 16 行内容的命令：\n\n```\n16yy\n```\n\n要粘贴选定内容，只需输入字母 `p` 即可。\n\n剪切并粘贴\
  \ `n` 行同样可以通过以下命令完成：\n\n```\nNdd\n```\n\n然后按 `p` 粘贴！\n\n## 结论\n\n这一阶段的精彩旅程已经画上了句号。但是，我们现在确实拥有了所有的工具和技能，可以开始使用并享受这个强大的操作系统了。正如你所看到的，这本书涵盖了关于\
  \ Linux 的几个有趣领域。\n\n在开始时，我们讨论了 Linux 的历史和起源，以便我们有一个清晰的视野并遵循方法论。接着，我们学习并理解了如何安装系统，了解了运行操作系统所需的必要设备和硬件。我们还学习了非常重要的\
  \ Shell（壳）以及所有相关的命令。当然，我们不能忘记非常实用且常用的命令行。书中还涵盖了文件通配符匹配（File-globbing），这对于 Linux\
  \ 初学者来说是不可或缺的知识。用户管理和身份验证将极大地帮助你保护数据并管理所有用户的访问权限。最后，为了使内容更完整且对 Linux 学习者和学者真正有用，我们包含了一些非常重要的\
  \ Linux 技巧，并讨论了 Vi 编辑器，这是一个非常值得了解的东西。最后我想说，祝愿你繁荣、万事顺利、好运，实现你的目标并取得个人成就。\n"
