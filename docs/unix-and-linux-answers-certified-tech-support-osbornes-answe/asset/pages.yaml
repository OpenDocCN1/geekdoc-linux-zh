- pgno: 48
  md: '# What can I do if I need help with UNIX?


    UNIX comes with its own help system, and it is a good one. The entire UNIX manual
    set that takes up about a foot of your system administrator''s bookshelf is available
    online. For example, to get help on the cp (copy) command, simply type:


    ```

    man cp

    ```


    which will give you several pages of information about the cp command. One of
    those pages is shown in Figure 2-2. There are a couple of things to be aware of
    with the man command. It''ll return the first entry in the online manual that
    matches the request, so if the command is one of those that appears in more than
    one of the manual volumes (usually numbered from one to eight), then you may not
    get quite the answer you are looking for Usually this isn''t a problem, since
    all the "normal" user commands are in the


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_48_0.png)


    Figure 2-2 Help with the cp command'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'first volume of the manual set. If you know, however, that you need help from
    a particular volume, you can specify the volume on the command line. For example,
    a system administrator might well want to know a bit more about the passwd command
    than an ordinary user would. But the extra information is in Volume 1A of most
    manuals. So, to get that information, s/he would type:


    ```

    man 1A passwd

    ```


    which would skip over the more limited help for the passwd command, which is in
    Section 1 of the manuals, and go directly to the manual entry in Section 1A, which
    is for system administrators.


    Tip: Some versions of UNIX let you get all the manual pages with a single command.
    In SCO UNIX, for example, you can type:


    ```

    man -a passwd

    ```


    and get information on both the standard passwd command, and the extra help that''s
    available to system administrators. So check your system to see what switches
    you can add to the man command to make it work better for you. To do this, use
    the man command on itself!


    ```

    man man

    ```


    Note: Manuals, even online manuals, will only get you so far. Sometimes they just
    aren''t enough. When all else fails it''s time to call your system administrator.
    This mighty and all-powerful person, who also goes by the names "superuser" and
    "root," is the one to go to when you have tried all other avenues of help and
    are desperate. S/he has the power to give you new passwords, or to log on to your
    account and fix things you have broken so totally that you can no longer log on
    to fix them yourself. S/he is generally the repository of a vast, though by no
    means limitless, storehouse of knowledge and tips about how your particular UNIX
    system works. For your own sake, be sure you always treat this person well!'
