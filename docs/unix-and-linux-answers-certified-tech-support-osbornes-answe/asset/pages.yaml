- pgno: 127
  md: 'This little gem is something we added to my ~/.exrc file as a map so we can
    run it from within vi. We have it mapped to CTRL-T for tabs:


    ```

    map ^T ^[I!G pr -te3^M

    ```


    Voila! Just hit CTRL-T, and all your tabs are converted to spaces, with your columns
    still lined up nice and neat, with three space indents as shown in Figure 6-5.


    # But what can I do if I need to put the spaces back?


    Use the -i option to replace spaces with tabs. If you need to make sure you have
    tab characters in a file you put spaces into, use the pr command again, but this
    time use -i to insert tab characters. This is useful, for example, if you''ll
    later be importing the text into a word processing program that uses a variable-spaced
    font, one that will correctly interpret the tab character.


    # Can I turn a list into a multic olumn format?


    Yes, a simple -n will tell pr to convert your list of names into an n column list.
    If you want it as columns ordered across the page, instead of down, add -a to
    the command.


    ```

    pr -3a -t names > names.out

    ```


    This will convert the list of names into a three-column list. Combine this with
    UNIX''s built-in sorter and you have a sorted list in three-column format.


    ```

    sort names | pr -3a -t > sorted.names

    ```


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_127_0.png)


    Figure 6-5 The proper way to line things up'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_128_0.png)


    Figure 6-6 Our unsorted list of names


    The before and after appear in Figures 6-6 and 6-7.


    # OTHER USEFUL PRINTING TRICKS


    Is there a way I can cancel a print job?


    Quick! Use the cancel command to halt the print job you just sent. This command
    has the form


    ```

    cancel [request-id] [printer]

    ```


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_128_1.png)


    Figure 6-7 The list sorted into easy to read format'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'which means that you can cancel a job either by specifying the requested id
    or by specifying the printer and thereby canceling the job on that printer. Note
    that you can only cancel a print job that you created. To cancel someone else’s
    print job requires (ta-da!) the superuser.


    # Can I use the lpstat command to get the current status of my print request?


    Yes. Use this command, along with **-u yourname**, to get a list of just your
    current print jobs. Jobs that are currently printing will show as **on printer**
    where **printer** is the name of the printer. Figure 6-8 shows that Charlie has
    two jobs queued up for the printer laser, and the first one has already started
    printing.


    # How can I find out where my job is printing?


    Again, the answer is **lpstat**. In an environment where you may have several
    essentially similar printers, often you will specify that your print job should
    go to a class of printers, rather than a particular one. In this case, use the
    **lpstat** command with the **-o -l** options to see not only which jobs you have
    queued, but which printers they are queued for. Where you have used a printer
    class instead of a specific printer as the destination, you will see something
    like Figure 6-9.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_129_0.png)


    ```

    laser-7586  charlie  12345  August 15  13:53  on laser

    laser-7586  charlie   7654  August 15  13:53

    $

    ```


    **Figure 6-8**  The report back from the **lpstat** command'
  merge: -1
  img_proc: true
