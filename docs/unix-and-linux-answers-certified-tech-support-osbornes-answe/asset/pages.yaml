- pgno: 120
  md: '# How can I control the number of copies of a file that I want printed?


    Use the -n option. When you need more than one copy, just put the number on the
    command line:


    ```

    lp -n 3 notes

    ```


    The above command will give you three copies of the notes. Berkeley uses #n where
    n is the number you want.


    # UNIX Printing Idiosyncrasies


    Because UNIX was designed to be a multiuser and multitasking environment, the
    early designers realized that they needed to have a way for people to continue
    to work on the system while printing was going on. Printing is a slow process,
    even on the fastest printers, and it doesn''t require very much in the way of
    raw processing power. To make everyone wait while the printer was doing its thing
    would be a serious waste of time and resources. So UNIX borrows from the mainframe
    world and sends all printing tasks, or "jobs," to a spooler. The printing spooler
    is a background task, known as a daemon, that''s always there, waiting for something
    to do. When you send a job to the printer, what you''re actually doing is sending
    it to the printer daemon, which first stores it on the hard disk in a temporary
    file, and then sends it to the printer, a little piece at a time. This way, you
    (and the rest of the users on the system) can go on about your business, and the
    print spooler prints your job without tying up the main processor, since the spooler
    needs only a tiny portion of the available processor time to get its job done.


    If everything goes well, you click on the Print button in WordPerfect, select
    the printer you want your updated résumé to go to, and send it off. By the time
    you walk over to the printer, the job is coming out, and you grab it before anyone
    else has a chance to see it. No problem.


    But wait, someone else has started a print job on that printer that will take
    an hour to complete and your print job is stuck behind it! Hmmm. Think your boss
    will mind if you just sort of hang around the printer? It''s time to figure out
    how to handle this, and lots of other little problems that crop up in a shared
    printing environment.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Is there a way I can have UNIX tell me when my print job is done?


    Certainly. Let the print spooler send you a message when the job is finished.
    Use the following command:


    ```

    lp -m notes

    ```


    This will send you a mail message when the job is done. Use -w to have it write
    the message directly to your terminal upon job completion. Use this option with
    caution. Lots of programs don''t like having messages dumped to the terminal while
    they''re running. If you aren''t logged in when the job finishes, the message
    is mailed instead. For Berkeley users, the option is the same: -m.


    # Can I control the way my printed job looks?


    Of course. Each printer type or model will have a list of possible options that
    it will support. These range from the fairly simple ones available for dot matrix
    printers, to the more complicated ones for a typical laser printer. You can add
    as many options as you want to the command line; just remember that each option
    requires a preceding -o. The printing on a UNIX system is controlled by a script
    that knows the options that the particular printer will support, and which escape
    sequences it requires to set each option. This script file, which can be modified
    by the system administrator to add special characteristics for an individual printer,
    usually resides in the /usr/spool/lp/model directory. To see what options are
    supported for your printer, you can print this file out. But in general, these
    include options to control the character spacing and font type, and the quality
    and orientation of the printout. On typical dot matrix printers, for example,
    the options may include such things as using elite or compressed type, and whether
    to print in draft mode or in near letter quality. On a typical laser printer these
    options are likely to include the ability to change fonts, and even settings for
    using different font cartridges or paper trays. The quality of the printer support
    will depend on a variety of factors, including how recent the revision of UNIX
    is.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Printing Now vs. Printing Later


    Most printing you do will be like this: You finish editing a document, you want
    to print it. If you''re working inside an application program, like WordPerfect
    or IslandCalc or whatever, just follow the commands appropriate to that program
    to print your document. Give it the destination you want, and go pick up the output
    when it''s done.


    One of the problems with working in a shared printer environment is that you can''t
    always use the printer as you might want to because it would be too disruptive
    to others on the system. An example of this is large print jobs that could tie
    the printer up for long periods. How long is a long period? This is really subjective
    and depends on your environment. If you share a printer with a small group of
    three or four other people, and you ask first, you can probably get away with
    a print job that takes a half hour or even an hour. But try that on a centralized
    printer shared by 25 or 30 users and listen to the screams. There are a couple
    of ways to handle this problem, depending on how your system is set up. Probably
    the easiest one is to simply fire off the print job on your way out the door as
    the last thing at night. If that''s not an option, here are some ideas to keep
    the peace.


    # PRINTING LATER


    # Is there a command I can use to hold my print job for later?


    Yes. Use the hold option to get your file ready for printing but not actually
    start it until later. If you use the hold option when printing that big job, it''ll
    be held until you tell it to actually go to the printer. Meanwhile, however, it''s
    been fed to the spooler and is ready and waiting. Then, when the printer will
    be free for an extended period, you can start it up. To print the file bigdocument
    to the printer netlaser but hold it until you say, try this:


    ```

    lp -dnetlaser -H hold -m bigdocument

    ```'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Then, when you want to start the printing, use


    ```

    `lp -i requestid -H resume`

    ```


    This still requires some degree of planning and attention on your part, but at
    least you know everything’s ready and waiting. There’s a second problem with it
    as well: you need to know what the requestid is for the job you want to resume.
    As you can see in Figure 6-1, you’ll be told the requestid when you first issue
    the print command, so write it down and hope that when it’s time to resume the
    job, you’ll be able to find where you wrote it.


    # How can I find out the status of my print jobs?


    Use lpstat. This command will tell you all sorts of information. In its simplest
    form, without options, it will tell you what jobs are in what printer queues.
    Use the -u option to display information about your jobs only. (In HPUX you need
    the -t option to show the status of printers and jobs.)


    # Can I schedule a print job for later?


    By all means. If your system administrator has given permission, you can use the
    at command to schedule a print job for later execution. We’ll look at the at command
    in more detail in Chapter 7, but for the moment here’s a simple example to run
    a series of print commands at 5:30 p.m.


    ```

    `at 05:30pm < commandfile`

    ```


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_123_0.png)


    **Figure 6-1** The **lp** command will tell you what the **requestid** is for
    your print job'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'In this case *commandfile* is a file you have created that contains each of
    the commands you want executed at 5:30 p.m., one line to a command.


    # FORMATTING


    # What are some of the basic formatting options that UNIX offers me?


    The built-in `pr` utility manages all sorts of little formatting chores with ease.
    It can handle multicolumn output, set tabstops, double-space a file, add a left
    margin, expand tabs to spaces or convert spaces back to tabs, or add line numbers
    to a file. We''re not talking desktop publishing here, but for simple tasks it''s
    quick and easy.


    # Formatting with UNIX


    If you want your print jobs from UNIX to be something other than plain old dull
    Courier, you''re going to have to take some steps to make that happen. You *could*
    go out and buy a high-priced word processor or even higher-priced desktop publishing
    package and there certainly are some excellent ones that run on most UNIX platforms.
    If you intend to do a lot of heavy-duty formatting and want to see what your document
    looks like before you actually print it, you''re probably going to need one of
    these programs. But if all you need to do is spiff up your output a bit, or include
    an equation or graphic, you don''t really need to use anything but the tools you
    probably already have on your system. And if you''re comfortable with simply entering
    in the commands to print in bold, double-spaced, and have faith that that is what
    will happen without actually being able to see the result until you print it,
    then you can publish whole books with the native UNIX tools.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# How can I double-space my file?


    Easy! Use the -d option with pr. UNIX editors like vi don’t want to give you double-spaced
    text, so to get it you need to run the job through pr as you print it:


    ```

    pr -d filename | lp -

    ```


    This takes the input file and double-spaces it, sending the result straight to
    the default printer and leaving the original unchanged. This will also add a header
    that includes the date and time as well as the page and filename.


    # Can I add a left margin to my file?


    Yes; use the -o n option. Again, vi isn’t going to give you a left margin, and
    it can be awkward to add it manually, so just run the file through pr to handle
    this little task.


    ```

    pr -d -o10 filename | lp -

    ```


    Now our document is double-spaced and has a left margin of ten characters added.

    Figures 6-2 and 6-3 show the file before and after the above command line.


    # Is there a way I can remove hard tabs and realign my tabstops?


    Try the -eck option. One very annoying trait of vi is that it uses "hard" tabs.
    You can change the amount of space each one represents with :set ts=n, where n
    is the spacing. But


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_125_0.png)


    Figure 6-2 A simple little document before pr has done its job'
  merge: -1
  img_proc: true
- pgno: 126
  md: "![](img/0c1fc10350aa06ca92e7921c96c628ec_126_0.png)\n\n**Figure 6-3**  The\
    \ same document, with a left margin and double-spaced\n\nwhen you go to print\
    \ the document or view it without setting\nits tame, everything gets jumbled up\
    \ as in Figure 6-4.\n\nWell, here's a simple little shell script to convert tabs\
    \ to\nspaces, lined up with the tabstops every three spaces. You\ncould spruce\
    \ this one up to have a variable number of spaces\nfor your tabstops, add error\
    \ checking, whatever. It works and\nit's simple.\n\n```\n### File ~/bin/detab\
    \ -- removes tabs from a file and\n                         converts to spaces\n\
    ### File name remains the same.\npr -t -e3 $1 > /tmp/tabtmp\ncp /tmp/tabtmp $1\n\
    ```\n\n![](img/0c1fc10350aa06ca92e7921c96c628ec_126_1.png)\n\n**Figure 6-4** \
    \ The hard tabs result when using vi"
  merge: -1
