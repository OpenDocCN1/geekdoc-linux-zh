    # How can I protect myself when I''m using the rm command around crucial files?


    The rm command is irrevocable and permanent. If you have critical, irreplaceable
    files that you need to protect, use rm -I, which is the interactive remove command.
    This will prompt you for confirmation before any file is deleted. In fact, make
    it an alias, and use it whenever you want to be sure:


    ```

    alias del="rm -i"

    ```


    You can even make this option the "normal" way rm is used, but you may quickly
    get tired of being prompted every time you remove a file.


    # FILE PERMISSIONS AND PROTECTION


    # What can you tell me about UNIX file permissions?


    Since UNIX is a multiuser operating system, it assumes that you might not be the
    only person who uses the computer. That''s nice, and it makes some things, like
    sharing files with your coworkers, much easier. But it also means that there are
    certain protections built into the system that allow you to control who sees,
    uses, and manipulates the files you "own." Each user on a UNIX system has a unique
    user name'
