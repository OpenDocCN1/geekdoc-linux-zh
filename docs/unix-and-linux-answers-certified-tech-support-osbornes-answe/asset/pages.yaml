- pgno: 2
  md: '| Command Name | Function |

    |---|---|

    | bg [jobIDs] | Puts current job or specified jobIDs in the background. Korn shell
    only. |

    | cal month year | Displays a calendar on the standard output. month can be a
    number between 1 and 12 or enough letters to represent a unique month. year can
    be any number between 1 and 9999 (you have to include all 4 digits). |

    | cancel requestIDs or cancel printer | Cancels a print request generated by the
    lp spooler. |

    | cd directoryname | Changes the current working directory. |

    | chmod mode files | Changes the mode of files. A file''s mode controls the permissions
    for access associated with that file. Only the owner of a file (or the Superuser)
    can change its mode. See the Command Reference in Appendix A for complete details
    on mode. |

    | cp file1 file2 | Copies file1 (the file to copy) to file2 (the destination name).
    |

    | date MMDDhhmmYY | Displays the system date and time. MM=the month (01-12); DD=the
    day (01-31); hh=the hour (00-23); mm=the minute (00-59); YY=the year (00-99),
    optional. |

    | fg [jobIDs] | Puts current job or specified jobIDs in the foreground. |

    | finger users | Displays information about users on the system. users can specify
    either an exact login name or a first or last name. |

    | head [-lines files] | Prints the first few lines of a file. -lines specifies
    the number of lines to print (default=10). files should be a list (separated by
    spaces) of the files you want printed. |

    | jobs [jobIDs] | Lists running or stopped jobs. Include jobIDs to check on specific
    jobs. Korn shell only. |'
  merge: -1
  img_proc: true
- pgno: 3
  md: '| Command Name | Function |

    |---|---|

    | lp [files] | Sends files to the printer. |

    | lprint -file | Sends a file to the printer attached to the terminal. |

    | ls [directories] | Lists contents of directories. If no directories are given,
    lists the files in the current directory. |

    | man command | Displays information from the online reference manuals about command.
    |

    | mkdir dirname | Creates a new directory named dirname. |

    | more [files] | Displays the named file(s) one screen at a time. Press RETURN
    to get the next line or press the SPACEBAR to get the next screen. |

    | mv source target | Moves or renames files or directories. |

    | passwd | Lets you change your password. |

    | pwd | Prints the full path name of the current working directory. |

    | rm files | Removes one or more files. To remove a file, you must have write
    permission for the directory that contains the file. If you don''t have write
    permission for the file itself, you''ll be prompted to confirm the deletion. This
    can be a very dangerous command. Be careful! |

    | rmdir directoryname | Removes directories. The directory has to be empty first.
    |

    | sleep seconds | Suspends execution of a process for the number of seconds specified.
    |

    | tail [file] | Lets you view the last lines of a text file. The default is the
    last 10 lines. |

    | time command | Prints the amount of execution time, process execution time,
    and system time for a process. command is the command you want to time. |'
  merge: -1
  img_proc: true
