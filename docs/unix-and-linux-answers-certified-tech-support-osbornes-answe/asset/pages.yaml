- pgno: 47
  md: '+   - be mixed uppercase and lowercase

    +   - be pronounceable

    +   - contain both alphabetic and non-alphabetic characters

    +   - be six to eight characters long

    +   - be easily typed


    An example might be something like "Moon4you". It uses two short words, with a
    number separating them. Another good example might be an acronym that is special
    to you, if it isn''t something easily guessed. Something like "OhiHacp" (Oh, how
    I hate all computer programmers).


    # How can I change my password?


    You can easily change your own password at any time, and you should always do
    this immediately if you suspect that someone may know your old one. It''s probably
    a good idea to change your password periodically, regardless. To change it, simply
    type:


    ```

    passwd

    ```


    You will be prompted first to enter your old password, then to type your new one.
    Finally you will be prompted to re-type your new password. If the two don''t match,
    you will need to start over. Remember your new password. If you forget it, you
    will have to get your system administrator to give you a new one. The first time
    this happens, s/he will probably be fairly understanding. After the first time,
    the system administrator will either be seriously annoyed with you or, worse,
    make fun of you unmercifully and publicly.


    > Tip: Check your new password immediately after you change it. If you wait, and
    somehow mistype it twice, you won''t be able to log in to your account. Inevitably,
    you will discover this only when you are in the midst of a crisis. So check it
    now, while you''re logged in and have the chance to get it sorted out.'
  merge: -1
