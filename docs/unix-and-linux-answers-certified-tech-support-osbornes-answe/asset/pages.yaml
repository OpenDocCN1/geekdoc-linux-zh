- pgno: 148
  md: '# X Windows @ a Glance


    So far we’ve talked about "conventional" UNIX, which is a text-based, command-line
    interface that only a nerd could love. But in this chapter we will explore the
    X Window System, which, thanks to the **display manager** and the **window manager**,
    has a pretty enough interface to cure you of lusting after Microsoft Windows.
    Here you’ll learn the difference between the display and window managers, if only
    so you can use this information to impress your UNIX-savvy colleagues.


    More important, X Windows takes advantage of the **mouse**, menu bars, and other
    features of a graphical user interface. With the mouse at your command, you’ll
    find that you’re happier and more productive than ever before.


    If you’re serious about using X Windows, it’s probably a good idea to be familiar
    with common **X programs**. We’ll introduce you to the standard ones and tell
    you about what they can do for you.


    Using X Windows is pretty straightforward, but it’s useful to know some **Xterm
    tricks** that can make your life easier. Changing the colors and font on your
    terminal will help you see better, and creating a larger scroll buffer will let
    you scroll back and forth with ease on even the longest of man pages.


    Some **X Windows programs** are more impressive than others, but even the **less
    impressive** ones can be helpful sometimes. The latter group includes a calculator,
    system monitor, clock, and an easy-to-use front end for **man** pages.


    The **less useful X programs** are ones such as xeyes, which will increase the
    cute value of your UNIX system immeasurably. We’ll leave you to explore most of
    these programs for yourself, but we wouldn’t feel right telling you how to make
    your X Windows system your own without mentioning their presence.


    **Customizing your X** is a fine and highly idiosyncratic art. We won’t tell you
    exactly how you should customize your system; instead, we’ll show you how to customize
    the X server, your desktop, and Motif, and then leave you to your own devices.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# Chapter 8  X Windows\n\n> **Note:** A word of disclaimer is in order here.\
    \ You will hear the X Window System referred to variously as \"X,\" \"X Windows,\"\
    \ and \"The X Window System.\" Well, the last of these three is the official way,\
    \ but in normal conversation, most people will say \"X\" or \"X Windows,\" as\
    \ we will in this chapter.\n> \n> The X Window System was originally developed\
    \ at MIT, and the principal developmental work on it is still carried out there.\
    \ X has gone through many revisions over the years, and as of this writing is\
    \ currently at a version known as \"X11R6.\" Most of what we will discuss here,\
    \ though, is equally true for at least X11R4, X11R5, and in some cases for X11R3\
    \ as well. So, even if you are still running on an older version you should be\
    \ able to take advantage of many of the same tricks, though the syntax may be\
    \ a bit different in some cases.\n\n# MOUSE COMMANDS\n\n# Can I use the mouse\
    \ to copy text between windows?\n\nCertainly. If you have two windows open, it's\
    \ easy to copy text from one window to another. Select the text you want to copy\
    \ from the first window by positioning the mouse cursor at the beginning of the\
    \ text you want to copy, pressing down the first mouse button, and dragging the\
    \ cursor over the text you will be copying. The text will now be shown in reverse,\
    \ and is *highlighted*. Click on the second window to activate it, and click the\
    \ second mouse button. This will insert the highlighted text at the current text\
    \ cursor position.\n\n> **Warning:** Whenever you're moving or copying text, remember\
    \ that the mouse cursor and text cursor are not the same. When you click once,\
    \ you simply move the mouse cursor to the point where you click."
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Display Manager vs. Window Manager


    The X Window System is the display manager. By itself, it isn''t a very pretty
    sight. It takes the addition of a window manager to give you the look and feel
    you expect. All those nice little borders, buttons, and mouse tricks are really
    part of the window manager''s job, not that of the display manager. The two most
    common commercial window managers in the UNIX world are Motif and Open Look. Of
    the two, Motif seems to be winning the window manager wars, though Sun systems
    still used Open Look by default until very recently. However, even in the Sun
    world, Motif is available. It is the window manager that allows you to move a
    window, resize it or shrink it to an icon, drop down a menu, and so on. The display
    manager (or more properly the X server), on the other hand, interacts directly
    with the mouse, keyboard, and display. The display manager manages fonts, colors,
    and the background screen (the root window), and is responsible for opening and
    closing windows and generally managing the resources.


    # How can I select an entire word?


    Click twice. When you click twice in quick succession (called a *double-click*),
    you will both move the cursor and select or highlight the word at the cursor.


    # Is there a way to select an entire line?


    Yes, by triple-clicking. If you click the mouse three times in quick succession,
    you will get an entire line highlighted. This is a quick way to transfer a command
    to another window.


    > **Warning:** When you transfer text with the mouse, you transfer it as actual
    keystrokes. This means, for example, if you are in vi, you might actually be passing
    commands to vi if you''re still in command mode instead of text insertion mode
    when you paste the text into the second window.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# X Programs You May Already Have


    While every vendor’s version of the X Window System is just a bit different, most
    come with a bunch of cool programs and some that are merely cute without being
    useful. The ones you are most likely to have, as a minimum, are:


    +   - *Xterm* — a terminal emulation program

    +   - *xcalc* — a calculator

    +   - *xclock* — yet another clock program

    +   - *xman* — a graphical front end to the **man** pages

    +   - *xload* — a graphical indicator of the system resource utilization over
    time

    +   - *xeyes* — a cute little program that features two eyes that follow your
    mouse pointer

    +   - *xlogo* — a totally useless program that displays the X logo

    +   - *ico* — another cute but useless little program that draws a bouncing icosohedron
    on your screen


    In addition to these, there are several utilities for manipulating or displaying
    the properties of the X server. The essential one of these programs is, of course,
    Xterm, which provides the interface for you to access all of the rest of UNIX.


    # How can I pop up a menu?


    Click on the root window. This menu will let you do a variety of things like shuffle
    your windows up or down to find a window that is buried in a stack of others,
    open a new window, restart the Motif Window Manager, or just refresh your screen
    if the graphics have gone haywire. You can take this menu much farther by adding
    new stuff to it. We''ll show you how below in the section called "Customizing
    X."'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# XTERM TRICKS THAT MAKE LIFE EASIER


    # Xterm Enhancements


    Every version of the X Window System comes with at least the minimum version of
    Xterm. Plus, many vendors include their own custom terminal window that takes
    advantage of some of the specifics of their system. SCO, for example, includes
    scoterm with its Open Desktop package, and HP includes a couple of different versions
    of hpterm with its systems: one for VUE, their "Visual User Environment," an all
    encompassing desktop environment based on X; and another for those running just
    the X Window System. Each of these add specific features that enhance the overall
    look and feel of the basic Xterm, but we''ll stick to just the basic Xterm here.
    Most of the third-party enhanced Xterms accept the same command-line parameters
    as the basic version, in addition to any that control the specifics of their own
    implementation. The basic result of typing Xterm & is pretty boring, so let''s
    spruce it up. You can control the fonts, colors, and all sorts of other stuff.


    # Can I change the colors of Xterm to make it easier on the eyes?


    Absolutely. Colors are a very personal and individual thing, but here''s a combination
    that works for us.


    ```

    /usr/bin/X11/Xterm -fg white -bg MidnightBlue &

    ```


    This gives you white text on a dark blue background. Of course, we know someone
    who finds this look far too middle class, and opts instead for


    ```

    /usr/bin/X11/Xterm -fg yellow -bg purple &

    ```


    But then he''s just a bit on the outer edges on most questions.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# How can I get a list of color possibilities?


    Use showrgb. This will print out a list of colors that are defined in your system.
    Even if your system doesn''t have the showrgb program, you can still see this
    list. Just use vi (in its read-only mode, so you don''t accidentally mess something
    up). Type in:


    ```

    view /usr/lib/X11/rgb.txt

    ```


    This will give you a look at the default color database that your system uses.
    Pick any colors you want from here for your Xterm colors. But don''t forget to
    enclose the color name in quotes if the name includes any spaces.


    > Warning: When you type in your Xterm color selections, don''t forget to enclose
    the color name in quotes if the name includes any spaces. A two-word color without
    quotes will confuse UNIX and cause the command to fail.


    # Is it possible to change the title on my Xterm?


    Yes. You can even have your Xterm tell you where you are and who you are logged
    in as by adding this information to the title bar of the Xterm. The only catch
    is, this information is static, so if you use the window to log into another,
    remote machine, it won''t be accurate. But we find it useful nonetheless, since
    it tells us where we started from. Use the -T option like this:


    ```

    Xterm -T "$(hostname):$LOGNAME -- $(date +%X)" &

    ```


    This will put your hostname, login name, and time the window was started all in
    the title bar.


    # Is there a way I can change the font in my Xterm to make it easier to read?


    Of course. The older we get, the bigger the fonts have to be. We know young programmers
    with six or eight Xterm windows open on their screen, each one with tiny little
    fonts. For them, this may be OK, but we like something just a bit larger and easier
    on the eyes. So we use one of the larger standard fonts for our Xterm:'
  merge: -1
  img_proc: true
- pgno: 154
  md: '```

    /usr/bin/X11/Xterm -fn 10x20 &

    ```


    This makes for a large enough window to actually see what you''re doing. Of course,
    if you''re running on a display with a lower resolution than our 1280 x 1024,
    or you have good enough eyes and want to squeeze the window size down a bit, try


    ```

    /usr/bin/X11/Xterm -fn 8x13 &

    ```


    This should give something small enough for most purposes. A good middle choice
    is the "9 x 15" font. But examine the other choices on your system. Each vendor''s
    implementation of X includes different fonts, so you may have some additional
    choices.


    # How can I see which fonts are available?


    Use **xlsfonts**. This program, if run with no options, will send a complete list
    of all the fonts you have available on your system to standard output. To limit
    this list, you can add the **-fn pattern** option to the command line, or pipe
    the whole thing through **grep** to see a more limited list.


    # Can I see ahead of time what a font will look like, and what characters are
    available for it?


    Yes. **xfd -fn fontname** will show you all the characters for that font, as well
    as give you far more information about each individual character than you are
    likely to need.


    # Is there a way I can add scrollbars to my Xterm to make it easy to scroll back
    through text?


    Certainly. In fact, we''re sure this will quickly become your standard Xterm.
    You can add scrollbars to the standard Xterm by using the command-line option
    **-sb**, which will put a simple scrollbar on the left side of the window like
    the one in Figure 8-1.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_155_0.png)


    Figure 8-1 Adding scrollbars to your Xterm makes it more useful


    Tip: Use the enhanced Xterm if your vendor supplies one. Most of the enhanced
    versions of Xterm provide useful additions as well as a slightly different look
    and feel, but take the same command-line arguments as the default Xterm. Figure
    8-2 shows a typical example of an enhanced Xterm, complete with menus and a right-hand-side
    scrollbar.


    # Can I make a bigger scroll buffer to use for man pages?


    Of course. This is one place where a scrollbar comes in very handy. But the normal
    wimpy little 64-line scrollbar isn''t enough for a lot of man pages. So crank
    it up to a full 30 screens full—720 lines—with the -sl nnn option. This lets you
    scroll back and forth through even long man pages. Figure 8-3 shows an example
    from the Xterm manual.'
  merge: -1
  img_proc: true
