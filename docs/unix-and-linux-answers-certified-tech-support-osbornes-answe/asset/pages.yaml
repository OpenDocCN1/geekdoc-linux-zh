- pgno: 247
  md: 'strengths of both Debian and Redhat. You can get more information about it
    from http://www.cdrom.com, which is the Walnut Creek CD-ROM archives.


    # Why Is Linux Free?


    Linux systems owe a great deal of debt to the Free Software Foundation, which
    is the force behind the GNU project. These fine people have put together a complete
    suite of software for UNIX systems that are, for the most part, better, stronger,
    and faster than anything the commercial guys have been putting out. To top it
    all off, it''s free. The fact is that if it weren''t for the GNU tools, Linux
    could very well be nothing more than a kernel and some disk access code. Even
    the standard file utilities that you use (such as ls, mv, cp, and rm) are part
    of the GNU file utilities package.


    Since you''ll be hearing a lot about "free" software in the Linux community, let
    us take a few minutes to give you the standard spiel about it so that you won''t
    end up embarrassing yourself. Free does not mean that it costs zero dollars, although
    that is often the case. Free means freely available and freely redistributable.
    It means that nobody can restrict you from having it. It also means that if you
    want the source code, you can get it with almost zero hassle. You can modify it,
    pick it apart to see how it works, improve it, customize it, basically do anything
    you want with it. The only thing you can''t do is prevent someone else from having
    it too. If you sell it to someone (which you''re allowed to do), you also have
    to provide them with the source code if they ask for it (you''re allowed to charge
    a reasonable copying fee) and you cannot prevent them from walking around giving
    copies of that software (that they paid $4,500 for) to anyone they want for free.


    This sounds kind of goofy, but only because everyone is conditioned to the licensing
    restrictions that have become so common. It actually works out very well because
    some of the best software in the world is distributed in this fashion. The GNU
    system includes everything you need to have a useful, working, UNIX system. In
    fact, it now even has its own kernel, although it''s still in the experimental
    stages.


    If you''d like more information about the Free Software Foundation, you can access
    their main FTP repository at ftp://prep.ai.mit.edu or you can write to the following
    address for more information: Free Software Foundation, Inc., 59 Temple Place,
    Suite 330, Boston, MA 02111-1307, USA.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'They do a great service to the computing community as a whole and we encourage
    you to take a few minutes to familiarize yourself with them. Don’t be confused,
    though. Linux owes a great deal of debt to GNU, but GNU and Linux are different
    entities. A great many of the “under the hood” utilities are GNU, most of the
    code for the system is distributed under the GNU Public License, and the system
    would be quite different if it weren’t standing on the backs of hundreds of GNU/FSF
    programmers. However, Linux is *Linux*, not GNU. Just because I use most of the
    GNU utilities on my Solaris system doesn’t make my Sparc system a GNU box. It’s
    the kernel that defines the core of the system, not the other way around.


    What does all this have to do with you and why should you care? All this is important
    to know because the utilities that you’ll be using on a day-to-day basis on your
    Linux system are GNU utilities, which means that they are, for the most part,
    feature-enhanced versions of the standard UNIX tools that you might already be
    used to. If you’re comfortable at the command line typing in long strings of UNIX
    commands, you probably won’t notice a difference, at least not immediately. We
    do encourage you, though, to take a look at the documentation and *man* pages
    for the things you use daily and explore some of their more advanced features.
    For most commands, you can get some basic help just by adding `--help` to the
    command name, and there are *info* pages (type info at the shell prompt) for even
    more documentation.


    Even the lowly ls command has some spiffy features that you won’t find elsewhere.
    Don’t believe us? Try typing `ls --color` and you’ll see exactly what we mean.


    # KEYBOARD ISSUES


    # What’s wrong with my keyboard?


    UNIX was designed long before the first PC was even a dream. Consequently, it
    has some weird ideas about how keyboards work and what happens when various keys
    on them are pressed. PC keyboards are not like normal “big iron” keyboards and
    it may take a bit of fiddling in order to get your keyboard to behave as you’d
    like it to.


    Most Linux keyboard behavior can be modified in the same way you’d modify keyboard
    behavior in any other version of UNIX. However, you can make permanent changes
    to your Linux keyboard mapping by editing the default keytables that are loaded
    on startup.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# What are keytables and how can I go about editing them?


    Keystrokes are merely a set of events, much like anything else in life. You press
    a key on your keyboard. This generates a key code that gets sent to the kernel.
    The kernel then looks up that code in a keytable to determine what to do for that
    particular event.


    You can''t change the code that gets generated, but you can change the entries
    in the keytables using your favorite text editor. In fact, that is exactly what
    you do when you edit the keytable on your system, or when you edit an xmodmap
    file (more on that later). If you open the default keytable on your system, which
    is more than likely /usr/lib/kbd/keytables/us.map, you''ll see the guts of the
    translation system, and it''s not nearly as complex as you''ve been led to believe
    all this time. It''s just a series of text entries.


    Let''s look at some easy ones:


    ```

    keycode 16 = q

    keycode 17 = w

    keycode 18 = e

    keycode 19 = r

    keycode 20 = t

    keycode 21 = y

    keycode 22 = u

    keycode 23 = i

    keycode 24 = o

    keycode 25 = p

    ```


    Does this look familiar? It should, because it''s the top row of letters on a
    standard keyboard, and this is the part of the table that applies to those keys.
    If you were to change one of those entries, you would change what was generated
    when you pressed the key in question. To change what a key does when pressed,
    just change the entry after the equal sign to whatever you want the new value
    to be. But before you make any changes, it''s probably a good idea to make a copy
    of the original file. Just in case.


    When you''re finished making changes, reload the keyboard tables (/usr/bin/loadkeys
    <your keyboard map name>) and you now have a customized keyboard.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Can you give me an example of how "power users" edit the default keytables?


    A popular thing to do among "power users" is to swap the CAPS LOCK and CTRL modifiers
    around so that pressing the CAPS LOCK key gives you a control sequence. If you
    do a lot of switching back and forth between a "real" UNIX keyboard and a PC keyboard,
    you may find it useful to do this too.


    # How do keytables really work?


    OK, by now the smart ones among you are thinking "but wait, what about all those
    other weird entries I see in the table?" What you''re referring to are entries
    that look a little more complicated, like this one:


    ```

    keycode  2 = one

    shift    keycode  2 = exclam

    al t      keycode  2 = Meta_one

    . alt shift keycode  2 = Meta_exclam

    ```


    Let''s demystify these while we''re at it. The extra fields here are just codes
    for when certain modifier keys are pressed with the key in question. For example,
    pressing the key labeled 1 on your keyboard doesn''t really generate a "1." It
    generates a keycode of 2. Don''t get confused, this is just the lookup code, remember?
    Now, if you pressed this key alone (without pressing SHIFT, CTRL, or ESC), the
    kernel would look up code number 2 in the list, map it to the "1" entry, and promptly
    spit out a "1" on your display. What happens when you press SHIFT-1 though? The
    kernel goes "Hmm... there''s a SHIFT key with this one, so I need to use the SHIFT
    modifier, which is the second field" and you get a ! symbol (a "bang" in UNIX
    parlance). There are also other entries for other states that a key can be in.
    If you mess around with these, be careful, because you can really hose your keyboard—to
    the point that a reboot won''t help at all.


    # What are "meta" keys?


    Another confusing point that often arises around UNIX keyboards is when people
    refer to "meta" keys. If you''re an emacs user you are probably quite used to
    seeing meta sequences. Even if you''re not an emacs user, you''ve probably'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'heard the term before. Well, to make a long story short, there''s really no
    magic involved with the meta key. It''s just another modifier key like the CTRL
    key. However, most PC keyboards don''t have a key labeled META. Most well-written
    UNIX applications take this into account and allow you to simulate a meta sequence
    by pressing and releasing the ESC key to simulate pressing a META key. If you
    want a real live permanent META key, though, you''ll have to edit your keytables
    and swap around some key functions.


    Personally, we find the CAPS LOCK key rather annoying, so we usually end up mapping
    it to CTRL and mapping the left-hand CTRL key to a META key. We do this in console
    mode by editing the keytables. We have to do it again in a different way when
    we''re in graphical mode, since key mappings don''t get carried over automatically.
    In graphical mode there''s nothing magic about Linux, though, and you can use
    any of the standard UNIX hacks to map your keyboard around enough to confuse anyone
    in your workgroup. We''ll revisit this issue again when we talk about X Windows,
    just to keep it fresh in your mind.


    # PASSWORD SECURITY


    What can you tell me about Linux and password security?


    One place where Linux differs noticeably from some of the commercial versions
    of UNIX is in the area of password security. Out of the box, Linux does not come
    configured with so-called shadow passwords. Shadow passwords are something you
    really shouldn''t have to worry about unless you''re a system administrator, but
    if you do happen to be your own system administrator and you want to increase
    the security of your system, you might want to consider upgrading. Most of the
    common FTP sites will have suites of precompiled programs to enable shadow passwords,
    and if you''re a Redhat user you can download rpm packages and upgrade on the
    fly.


    Even though most of the distributions don''t come with shadow passwords enabled
    by default, the Redhat distribution has definitely beaten several of the commercial
    UNIX variants to the punch by including a little add-on called'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'PAM. PAM stands for "Pluggable Authentication Modules" and it''s the newest
    rage in increasing the security of your system. What these little gems are is
    simply a set of common libraries of security modules. Each module is designed
    to do only a few things, such as get a password and authenticate it. Any program
    that needs to pay attention to security uses these modules to satisfy any security
    requirements. This prevents programmers from accidentally inserting security flaws
    into whatever program they''re writing. Everyone can concentrate on making the
    small security modules as tight as possible instead of chasing down security holes
    in his or her programs.


    We believe that PAM is the wave of the future. The newer versions of the commercial
    UNIX variants are starting to come out PAM-enabled. Once again, Linux is already
    there, waiting for the world to catch up.


    # SHELLS


    # What shells does Linux offer me?


    Most commercial UNIX vendors ship the Bourne shell as their default shell. Some
    of them also throw in the Berkeley C shell, and the Korn shell is also being shipped
    with newer versions of the operating systems.


    Once again, Linux is just a little bit different and a little bit better. The
    default shell for a Linux operating system is the Bourne Again shell, referred
    to as "bash." This little beauty is another example of some of the really fine
    software to come out of the GNU project and is freely available for pretty much
    every version of UNIX and even Windows 95.


    bash understands all Bourne shell syntax, so if you are a hardcore Bourne shell
    user, you''ll be right at home. In fact, if bash is called as /bin/sh in a shell
    script, it will completely mimic the standard Bourne shell. bash also understands
    most Korn shell syntax and borrows a lot of features from nearly every popular
    shell. This includes filename completion, history recall, command line editing,
    and lots more.


    Most versions of Linux currently ship with bash version 1.14 as the default shell.
    You can determine which version you''re running by pressing CTRL-X, CTRL-V from
    a shell prompt or by typing echo $BASH_VERSION. Version 2.01 is available at all
    the popular FTP sites, and adds 100%'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Posix compliance as well as nearly 100% Korn shell compatibility. It''s worth
    your time to upgrade.


    Linux doesn''t leave other shell users in the cold, though. It uses tcsh as a
    value-added replacement for csh and usually includes some popular alternative
    shells such as ash, zsh, and pdksh. Each of these shells has a place and a purpose
    and you can spend a lot of time exploring the strengths and weaknesses of each
    of these.


    However, we have to admit that our hands-down favorite shell for both programming
    and interactive use is bash, so let us share a few tricks that bash allows us
    to do.


    # What can you tell me about the bash startup files?


    First off, you''re probably used to having a .login and a .cshrc file if you''re
    a csh user, or a .profile and .kshrc if you''re a ksh user. bash uses similar
    files (.profile and .bashrc) and can also use a .bash_login instead of a .profile
    if you need to coexist with other shells. We recommend at least the following
    settings in your .bashrc:


    ```

    export FIGNORE=''.:~''

    set_no_exit_on_failed_exec

    ```


    The first entry causes filename completion to ignore anything ending in .o, #,
    or ~. The second entry prevents your shell from dying unexpectedly if an exec
    call fails for some reason. exec is often used to start up new programs and replace
    the currently running program. If you don''t know what it is now, don''t worry
    about it too much. Just put it in your startup file and when the time comes for
    you to need it, you''ll be glad you listened.


    # Can I display my current directory in my shell prompt?


    The short answer is yes. It''s much easier to display a customized shell prompt
    in bash than in most other popular shells. You might have seen some really weird
    gyrations that other people do in those inferior shells just to get their current
    directory or hostname into their shell prompt. Well, you''ll be happy to know
    that you don''t have to stand on your head if you''re a bash user because the
    people who wrote bash were smart enough to include shell variables for such things.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Just as in some other shells, PS1 is the variable you need to play with to
    customize your prompt. Table 14-1 shows you the possible values for the PS1 shell
    variable.


    All these allow you to do some pretty awesome things with your prompts. After
    you get done messing around with all the possibilities, though, you might like
    to simplify your life by using something like the following:


    ```

    export PS1=''\h:\w\$ ''

    ```


    This will give you a nice, clean, no-nonsense prompt containing your shortened
    hostname and your current


    | Value | Result |

    | --- | --- |

    | \a | an ascii "bell" character (to annoy your officemates) |

    | \d | the date, formatted like "Sun Aug 24" |

    | \h | the short hostname (up to the first "." character) |

    | \H | the full hostname |

    | \n | a newline character |

    | \s | the name of the shell |

    | \t | the current time in 24-hour, HH:MM:SS format |

    | \T | the current time in 12-hour, HH:MM:SS format |

    | \@ | the current time in am/pm format |

    | \u | the username of the current user |

    | \v | the version of bash |

    | \V | the release of bash (version plus patch level) |

    | \w | the current working directory |

    | \W | the basename of the current working directory |

    | \! | the history number of this command |

    | \# | the command number of this command |

    | \$ | inserts a "$" character if you''re not the superuser, and a "#" if you
    are |

    | \nnn | a character corresponding to the octal value of nnn |

    | \\ | a backslash character |

    | \[ | begins a sequence of non-printing characters (for putting in terminal control
    sequences) |

    | \] | ends a sequence of non-printing characters |


    Table 14-1 Bash Values for the PS1 Shell Variable'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'working directory, with everything below your **$HOME** shortened to a "~"
    character. That’s a lot easier than some of the ways you have to accomplish this
    in other shells.


    We’ll revisit this topic again in the X Windows section to show you a neat trick
    you can do with your terminal display windows and your shell prompt as well.


    # TEXT EDITORS


    # What text editors does a standard Linux system offer me?


    Linux does not ship with vi. What it has instead is a value-added replacement
    called **vim**. **vim** adds a lot to vi such as an optional graphical interface,
    multiple subwindows, multiple levels of undo, and lots of other nifty features.
    On most normal Linux installations, vi is just a symbolic link to **vim**, so
    typing vi will get you vim anyway.


    You probably won’t notice the difference unless you really push the limits of
    vi, in which case you’ll probably really like the added capabilities of **vim**.
    Just in case you don’t, you can can lobotomize **vim** to operate in strict vi
    mode. Take a few minutes to explore vim’s online help by typing **:h** once you’re
    in it.


    Most Linux distributions also include **emacs**, and some even come with **Xemacs**.
    Both the GNU version of **emacs** and the graphically (and functionally) enhanced
    **Xemacs** are fully supported under Linux with little or no change in functionality.


    # LINUX AND X WINDOWS


    # Can I have a graphical user interface on Linux?


    Yes. As you’ve already seen, UNIX has its very own graphical interface, X Windows,
    which, while very powerful and very customizable, can also be very confusing.
    Some of the confusion arises because of the disconnection between the graphics
    subsystem and the window manager. PC-based graphical interfaces such as Windows95,
    the Macintosh OS,'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'or IBM''s OS/2 are usually smoothly integrated into the OS and the distinction
    between the program that does the graphics and the program that manages your mouse
    motions or keystrokes is not obvious. In fact, you''d be hard pressed to change
    the windowing system on a normal PC without changing the entire operating system.
    UNIX users do this all the time, though, because UNIX isn''t a toy operating system.


    X Windows is really nothing more than a display engine. It accesses the graphics
    capabilities of your system, puts the system into a graphic or "bitmapped" mode,
    provides a set of display hooks, and begins to manage your keyboard and mouse
    for you. However, it doesn''t allow you to directly control, start up, or shut
    down programs. In fact, by itself it doesn''t really do a whole lot at all. In
    order to really accomplish anything, you need to run a special type of program,
    called a window manager, once you''re in X mode.


    There are many different window managers, each with its own specific look and
    feel. Most commercial UNIX systems ship with a favorite window manager, usually
    one that includes some special customizations for the OS in question. Sun, for
    instance, used to ship OpenWindows as their primary graphical interface, while
    Silicon Graphics shipped a variation of Motif called 4Dwm. For the most part,
    commercial UNIX vendors are starting to converge on a common window manager called
    CDE, which stands for "Common Desktop Environment." This is an industry-standard
    initiative based primarily on the Motif libraries with a lot of stuff borrowed
    from Hewlett Packard''s "VUE" window manager and some serious under-the-hood stuff
    from Sun Microsystems.


    By and large, the most common interface in the UNIX world is a variation of the
    Motif Window Manager, or mwm. This is a commercial product, though, with few free
    alternatives. Since Linux is at heart a free system, it doesn''t come bundled
    with Motif because as of yet, no one has completely cloned the Motif system and
    made it freely available.


    Instead, Linux users usually find themselves experimenting with a wide variety
    of different window managers that are more stylistically suited to the way they
    work. Linux people are, by and large, a rather anarchist bunch that likes using
    things just because they are different.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'This isn’t meant to be a criticism at all. In fact, it’s one of the greatest
    strengths of the Linux community. People aren’t satisfied with using what someone
    crams down their throats. If they don’t like something, they usually end up creating
    something that they like better and then everyone benefits from their efforts.


    There is, though, a common window manager that most Linux systems end up using
    out of the box. FVWM (Feeble Virtual Window Manager) is the defacto standard window
    manager in use by most of the Linux community. There are offshoots of this window
    manager, such as FVWM95 (which is FVWM lobotomized to look like Windows95) or
    Bowman or a myriad of others. We’ll concentrate on FVWM and I’ll share some tricks
    for customizing it to look and act a lot like (but better than) that commercial
    hog, **mw**.


    # Where’s my graphical login screen?


    Many modern flavors of UNIX greet you with a nice friendly graphical login screen
    instead of the old boring character prompt—provided, of course, that you’re working
    on a graphics-capable terminal. Linux is a little different, though. Out of the
    box, it still gives you that intimidating character-mode prompt. However, it’s
    pretty easy to change your system to provide you with that warm and fuzzy graphical
    login, which is called XDM (for X Display Manager).


    > **Warning:** *XDM only works if you’ve got X Windows up and running on your
    system.*


    # How do I configure XDM?


    First, check to make sure that Linux is configured correctly before enabling XDM
    permanently. You’ll need root access to do this stuff, so if you don’t have root
    access (it’s not your own system perhaps), skip over all this.


    Log in as root and type the following:


    ```

    ```text

    # init 5

    ```

    ```


    The # sign is your prompt character, so don’t type that. Now, your computer should
    go through a few wild gyrations,'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'and when it finally stabilizes you should see a nice graphical box with password
    and login fields in it. When you log in, you''ll be running in the graphical world
    of X Windows.


    # How can I start up permanently in X Windows?


    If you like X Windows and want to enable it permanently, you''ll need to make
    some changes to your /etc/inittab file.


    If you log in as root and open your /etc/inittab file with your favorite text
    editor, you should see something that looks approximately like the following:


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:3:initdefault:

    ```


    To enable X Windows, simply change id:3:initdefault to id:5:initdefault, and the
    next time you reboot your system it will come up graphical.


    # What''s a widget?


    A widget is basically just a building block, like a tinker toy. Just as there
    are different basic objects in a set of tinker toys, there are also different
    basic objects in a widget set. Widgets include things like scrollbars, menus,
    and buttons. A widget set has a specific look and feel to it, and the widgets
    are the biggest contributor to how a window manager operates.


    Don''t be confused, though. There are also sets of widgets that have absolutely
    nothing to do with the window manager. These sets of widgets exists for the express
    purpose of giving programmers a common set of tools to use in writing graphical
    applications, and programs can be linked to specific widget sets and will look
    similar no matter what window manager they are running under. For now, we''ll
    just confine ourselves to the window manager and leave the eggheads to worry about
    the other stuff.'
  merge: -1
  img_proc: true
