- pgno: 214
  md: '# Disaster Avoidance and Recovery @ a Glance


    **Preventing disaster** is always the best way to go, so here''s how to think
    ahead a little and take a few relatively simple precautionary measures.


    The single most important thing you can do to protect yourself in UNIX (or any
    other operating system, we might add) is to do regular **backups**. We''ll talk
    about specific backup strategies below, but right here we want to emphasize that
    there''s no way to recover a deleted file other than by having a copy of it. So
    either don''t delete the file or have a backup copy of it you can recover.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Note: But wait, you say. Your system administrator does backups every day/week/whatever.
    Why should you have to worry about such things? After all, that''s what she gets
    paid the big bucks for, right? It''s true, but even in the best of all possible
    worlds where your system is completely backed up every night and there are never
    problems with the tape, this still isn''t going to solve your problems. First,
    do you really want to lose an entire day''s worth of work? Furthermore, restoring
    a single file from a system backup tape is not the sort of task that is likely
    to make your system administrator happy. Yes, it can be done, and in the event
    of ultimate emergency this may be your only hope. But far better to have taken
    the necessary steps to protect yourself.


    # RISK AVOIDANCE


    # Preventing Disaster


    It''s always easier to not make a mistake than to recover from it once the mistake
    is made. And wouldn''t we all be better off if we ran our lives on that principle?
    So the question is how to not make that mistake. Probably the first rule is to
    avoid certain irrevocable commands. UNIX makes it remarkably easy to simply remove
    entire directory structures without even a warning. This power is nice, if you''re
    sure that''s what you want to do, but if not, then going "oops" isn''t likely
    to be adequate.


    Warning: Don''t use the rm -rf command. This is one of those commands that is
    just too powerful for its own good. Actually, the ordinary rm -r command is also
    too powerful, but at least it will warn you before it starts deleting read-only
    files. When you add the -f (for force) switch, you have really left yourself no
    chance.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Is it wise to create an alias for the rm command?


    This is a touchy one. Some purists feel strongly that you shouldn’t alias any
    of UNIX’s built-in commands, while others do it all the time. We tend to think
    it’s a bad practice if carried to the extreme, but in some cases it can be a lifesaver.
    For example, if you want to add an additional layer of protection, this is one
    way to do it. Try adding the following to your .kshrc file:


    ```

    alias rm=''rm -i''

    ```


    Now, whenever you go to remove a file, you will be prompted for confirmation.
    The problem with this approach is that it can get pretty annoying if you have
    a bunch of files to remove and you’re really sure you want to remove them. Under
    those conditions, you can get careless about the removal, answering "y" to the
    prompt without really reading it. A better solution is to move the files out of
    the way temporarily, and only remove them when they are old enough that you are
    sure you want to get rid of them.


    # How can I create an alias for rm that moves my files someplace safe?


    This is the UNIX equivalent of some of the utilities available for DOS that move
    your files into a special holding directory. We have two simple little scripts
    we use. Both depend on your having a tmp directory under your $HOME directory,
    which is usually a good idea anyway. First, create the script safe_rm.ksh shown
    in Figure 12-1 and store it in your personal bin directory. Don’t forget to make
    it executable with chmod. Now, create your alias for it:


    ```

    alias rm=''$HOME/bin/safe_rm.ksh''

    ```


    and add that to your .kshrc file. To make this immediately available, re-source
    your .kshrc file with:


    ```

    . ~/.kshrc

    ```'
  merge: -1
  img_proc: true
