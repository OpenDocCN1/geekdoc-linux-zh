  md: '# **Appendix A**  Command Reference


    `-perm mode` — Matches all files whose mode matched the numeric value of *mode*.
    All modes must be matched—not just read, write, and execute. To match everything
    except this mode, use `-mode`.


    `-type x` — Matches all files whose type is x, in which x is the following:


    - `c` — Character device

    - `b` — Block special

    - `d` — Directory

    - `p` — Named pipe

    - `f` — Regular file (none of the preceding types)


    `-atime days` — Matches all files last accessed days ago.


    `-mtime days` — Matches all files last modified days ago.


    `-newer file` — Matches all files modified more recently than *file*.


    `-ctime +n | -n | n` — Matches files that were changed more than n (+n), less
    than n (-n), or exactly n days ago. Change refers to modification, permission,
    or ownership changes.


    `-exec command` — Run the UNIX command on each file matched by find.


    `-ok command` — Same as -exec but prompts for confirmation before the command
    is executed.


    `-print` — Prints the names of the files found.


    `-user` — Matches files belonging to a user name or ID.


    # **finger** *[options] users*


    # **OBJECTIVE:**


    Displays information about users on the system.


    # **OPTIONS AND VARIABLES**


    `-b` — Omit user''s home directory and shell from the output.'
