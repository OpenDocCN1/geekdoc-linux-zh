- pgno: 55
  md: '# Are all UNIX filenames and commands case-sensitive?


    Yes. You’ve probably already found out that Charlie.txt and charlie.txt are not
    the same file at all. So you can guess that it’s not a good idea to get in the
    habit of distinguishing two files solely by a difference in capitalization. For
    one thing, if you regularly copy files from your UNIX system to other systems,
    like DOS or VMS machines, these two files will end up having the same name on
    the other system. For another thing, what makes you so sure you’ll be able to
    remember which Charlie.txt is which? You can waste a lot of time opening the wrong
    files.


    # CHARACTERS


    # Does UNIX let me do things I really shouldn’t do?


    Yes. This is but one more example of its essentially programmer-oriented roots.
    The assumption is that you know what you’re doing, and really mean to do what
    you just did. Which is all well and good, but of course there’s a potential for
    serious problems when you don’t understand all the possible consequences.


    For example, DOS is pretty restrictive about what it will let you include as an
    acceptable character in a filename. You’re not allowed to create a filename with
    embedded spaces, or weird unprintable characters. (Well, actually you can, but
    it’s tricky and difficult, to say the least, and there isn’t any ordinary way
    to do it.) UNIX, on the other hand, makes it all too easy to do this trick. But
    do you really want to have embedded spaces and weird characters in your filenames?
    Probably not. It just makes it a pain to copy, move, delete, or otherwise do much
    with files that include such stuff, and it’s by no means a foolproof way to protect
    them. So all it really does is make it a nuisance for you, while not providing
    any real security.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# How can I remove embedded spaces from a filename?


    Just enclose the filename in quotes, and replace the blank space with an underscore.
    For this we will use the mv command, which is UNIX for both move and rename.


    ```

    mv "file name" file_name

    ```


    This will handle simple embedded spaces.


    # But what if someone has managed to insert a weird character into a filename
    that isn''t a space but looks like one to me?


    Well, here''s where we can use a wildcard to substitute for that weird character.
    I''ll talk more about wildcards shortly, but for now you can use a question mark
    (?) to substitute for any single character in a UNIX filename. So we could solve
    the problem above, a filename with an embedded space, but this solution goes beyond
    the quote trick, since it works even if we don''t know what character is buried
    in the filename.


    ```

    mv file?name file_name

    ```


    Well, that looks pretty good. But what happens if there are a whole bunch of them?


    # Is there a way I can change the names of a series of filenames?


    As most everyone who has used UNIX for any length of time has discovered, you
    can''t use wildcards to mv a set of files to new names. Frustrating, isn''t it?
    Heck, even lowly DOS lets you do that. Well, there are lots of ways to get there,
    including some really slick perl scripts. We''ll touch on perl at the end of the
    book, in Chapter 15. But here''s a simple little shell script that will automate
    the process of renaming a bunch of files, prompting you for a new name for each
    matching file:'
  merge: -1
  img_proc: true
- pgno: 57
  md: "```\n#!/bin/sh\n# Bourne shell script to rename files, interactively\nfor fname\n\
    do\n    echo -n \"Enter new name for '$fname': \"\n    read newfname\n    mv \"\
    $fname\" \"$newfname\"\ndone\n```\n\nA couple of notes here. The -n in the echo\
    \ command line causes most versions of echo to suppress the new line that they\
    \ would normally put at the end of the prompt. Putting single quotes around the\
    \ original filename makes it clearer what filename you're talking about, especially\
    \ when you expect to use this on filenames that have embedded spaces. And, finally,\
    \ you could just as easily use this script to create a filename with spaces in\
    \ it, since the output filename is enclosed in quotes. So be careful.\n\n# WILDCARDS\n\
    \nWhat are the basic UNIX wildcards?\n\nBefore you try your hand at wildcard tricks,\
    \ let's review the rules. There are three basic wildcards in UNIX:\n\n+   - the\
    \ ? character substitutes for any single character\n+   - the * character substitutes\
    \ for zero or more characters\n+   - the notation [charset] substitutes for any\
    \ single character in the set charset\n\nThis last one takes a bit more explanation.\
    \ An example of a charset is [cChH], which matches the characters \"c\" and \"\
    h\" whether uppercase or lowercase. A charset can also describe all the characters\
    \ between two character pairs, such as [a-z], which would match any single lowercase\
    \ letter in the alphabet. Or there's [a-Z-A], which would match any single character\
    \ in the alphabet. Note that the character pairs match all the ASCII values between\
    \ the two characters, inclusive."
  merge: -1
  img_proc: true
