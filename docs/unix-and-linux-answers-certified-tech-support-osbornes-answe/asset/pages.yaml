- pgno: 218
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_218_0.png)


    # Figure 12-2 A safe way to purge unneeded files in your tmp directory


    confirm each and every deletion. If you want a more forceful version, try the
    purge!.ksh shown in Figure 12-3.


    Of course, you will probably want to alias this one as well. So we have this alias:


    ```

    alias purge!=`$HOME/bin/purge!.ksh`

    ```


    Now, anytime we want to clean up the directory of older files and we''re sure
    there''s nothing in there we actually care about, we just use purge! to remove
    all the files at least seven days old from the tmp directory.


    # Can I add purge! to my crontab?


    We''re not generally in favor of doing this sort of absolute cleanup automatically,
    but if you''re a lazy sort or absolutely sure that files in your tmp directory
    can be deleted, you might consider adding this to your crontab if you have permission
    to use the cron process. One way to do this is to run it only every Sunday night.
    That way, you know that no file in the directory is older than two weeks old,
    but that nothing from last week has yet been removed. The crontab entry for this
    would be


    ```

    0 1 * * 0 $HOME/bin/purge!.sh

    ```'
  merge: -1
