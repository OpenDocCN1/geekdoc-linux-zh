- pgno: 309
  md: '# Appendix C


    # Glossary'
  merge: -1
  img_proc: true
- pgno: 310
  md: '**absolute path name** The complete name of a file, including the total path
    of directories showing the file''s location in the directory tree. An absolute
    path name starts with the root directory—/.


    **address** Either the name of a specific machine or the name of the entire UNIX
    system. Both meanings are used in discussions of email and communications.


    **AIX** A version of UNIX made by IBM Corporation.


    **anonymous ftp** A remote login that requires no password. You type in **anonymous**
    as the user name and your email address as the password, enabling you to copy
    files from another computer to your own.


    **archive** A file containing a collection of other files. Chiefly used for backup.


    **argument** On a command line, this is something that follows a command. For
    example, on a line that says **cp my.file your.file** the command is **cp**, **my.file**
    is the first argument, and **your.file** is the second argument.


    **ASCII** American Standard Code for Information Interchange. Usually means a
    file that''s in text, is therefore viewable and printable, and has no binary (non-ASCII)
    characters.


    **at** Command that lets you schedule tasks to be run in the future.


    **awk** A programming language geared toward text manipulation.


    **background** A program that runs behind the scenes with no input from you is
    running in the background. Commands can be run in the background by starting them
    with an ampersand (&) at the end of the command line.


    **backslash** The character \. In UNIX, it changes ("escapes") the interpretation
    of the next character.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Appendix C  Glossary


    **bang**  The character !. A shell escape character. Also used to indicate that
    the command should be carried out regardless.


    **Berkeley Software Distribution**  The long name for BSD UNIX, a version of UNIX
    developed and distributed by the University of California at Berkeley. This version
    was notable for its advanced networking capabilities.


    **bin directory**  A directory for storing executable files. Your home directory
    probably has a subdirectory named bin.


    **block size**  The largest amount of data that a UNIX filesystem will always
    allocate contiguously. In other words, files that occupy less than the block size
    will always be contiguous. Larger files may be fragmented.


    **Bourne shell**  The original shell. Created by Steven Bourne of Bell Labs. Its
    program name is **sh** and it prompts with $.


    **BSD**  See **Berkeley Software Distribution**.


    **buffer**  A temporary storage area such as a file or an area of the computer''s
    memory. Lots of things have buffers, including printers and many text editors.


    **C, C++**  C is the programming language in which virtually all UNIX programs
    are written. UNIX itself is written mostly in C. C and its enhanced relative,
    C++, were both developed at Bell Labs and are widely used by UNIX programmers.


    **C Shell**  A shell written to look as much as possible like the C programming
    language. It prompts you with % and its program name is csh.


    **client**  In the X Window System, an application, as opposed to the server that
    manages the resources and provides the display. In a distributed filesystem, a
    client is a terminal or workstation connected to a server.


    **command line**  The text you type at a shell prompt. A command line can have
    more than one command separated'
  merge: -1
  img_proc: true
