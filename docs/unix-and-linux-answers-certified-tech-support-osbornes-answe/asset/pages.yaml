- pgno: 219
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_219_0.png)


    Figure 12-3 The purge-bang script is for when you are really sure


    Hmm, perhaps you notice a change? The name has gone from purge!.ksh to purge!.sh.
    This is, of course, on purpose. When cron runs your crontab file, it only uses
    the basic Bourne shell to do so. Therefore, we modified the script accordingly,
    as shown in Figure 12-4.


    > Note: New releases of some flavors of UNIX are using the Posix shell for cron.
    The Korn shell is compliant with Posix, so your crontab scripts must be either
    Korn shell or Posix shell. The man pages for cron will tell you which shell is
    used.


    However, you don''t want to leave yourself without a way to run the real rm command
    for those times when you really, really want to remove a file. So use yet another
    alias, this time to rm! in keeping with the convention we''ve been using.


    ```

    alias rm!=''''/bin/rm''''

    ```


    This uses the absolute path to the rm command, which will get around any stray
    scripts someone may have out there, and go straight to the source.'
