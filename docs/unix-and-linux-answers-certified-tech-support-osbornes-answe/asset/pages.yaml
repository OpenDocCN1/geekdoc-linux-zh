- pgno: 32
  md: '# Top 10 FAQS @ a Glance


    This chapter covers the ten most frequently asked questions about UNIX and Linux,
    including such crucial topics as:


    +   - Logging on

    +   - Cancelling a print job

    +   - Protecting yourself from disaster, including a slick way to rename the remove
    command

    +   - Understanding the rules for valid filenames

    +   - And more


    # 1. How do I log on and get going?


    When you look at your UNIX terminal, you''re presented with the login screen.
    This can be a cute graphical box with places for you to type in your username
    and password, or a simple


    ```

    login:

    ```


    In either case, type in your username and press the ENTER or RETURN key, whichever
    your system has. Next, enter your password, and we can get down to business.


    Just a short aside here. Why, you might ask, should I have to go through this
    every single time I want to use the computer? Well, since UNIX is designed to
    be a multiuser operating system, it imposes certain security restrictions to protect
    you and your work from inadvertent or deliberate mischief. One of these security
    restrictions is that you have to have an "account" on the system before you can
    use it. And, so that only you can use your account, you have to have a password
    as well.


    When you first log into a UNIX system, you will see a variety of miscellaneous
    stuff, most of which you don''t care about at all. If you are at a text terminal,
    you will probably see a lengthy copyright notice go scrolling by, and a bunch
    of'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'other things. Pay no attention. Finally, you may be asked what kind of terminal
    you''re on. Chances are good you can just take whatever the default is and get
    down to your business. But if you see a bunch of funny stuff on your screen, or
    the keyboard seems to be behaving peculiarly, it''s a good bet that something
    went wrong somewhere and the default is not going to be good enough.


    # 2. How long can a UNIX filename be and what characters can it include?


    UNIX filenames are much more flexible than, say, DOS filenames. At the very least,
    they can be 14 characters long on even the oldest systems, and these days most
    UNIX systems will support a file called reallyridiculouslylong-andcomplex.filename.
    But that is probably not a particularly useful filename. The only hard and fast
    rule for filenames is that they can include any character except a slash (/).


    # 3. What is a good UNIX filename?


    Realistically, you should probably limit your filenames to the following:


    +   - alphanumeric characters

    +   - underscores

    +   - periods


    Other characters may work on your version of UNIX, but may not translate very
    well to other systems.


    # 4. How can I change a file''s mode or permissions?


    Use chmod. This command, which is short for "change mode," lets you easily change
    any file you own so that only those people you authorize can read it, change it,
    or execute it. There are three basic levels of users, as we saw above: the owner
    (user) of the file, the owner''s group, and everyone else (others). And there
    are three levels of permissions: read, write, and execute. The types of users
    are abbreviated "u" for user, "g" for the owner''s group, and "o" for all those
    other'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'people out there, and "a" for everyone. The permissions are abbreviated the
    same as in the long listing above: "r" for read, "w" for write, and "x" for execute.
    So, to change the permission of the file harold.cat to allow users outside the
    in-group to read it, type in


    ```

    chmod o+r harold.cat

    ```


    The chmod command will let you make multiple changes to several files at once,
    so it is pretty easy to remove write permission from everyone and remove all permissions
    from those not in your group for all the .cat files:


    ```

    chmod a-w,o-rx *.cat

    ```


    # 5. How can I move quickly between frequently used directories?


    If you have a directory you''re using all the time, assign the path to that directory
    to a variable, and then export the variable so that it''s always available. Make
    a simple alias to take advantage of the variable to move to it. For example, let''s
    say you''re working on a project with the new model group and you need to quickly
    move to the project''s working directory, /users/shared/projects/newmodel/colormatch.
    That''s a real handful, and not something you want to type every time! So, try
    this:


    ```

    PHOME=/users/shared/projects/newmodel/colormatch

    export PHOME

    alias goproj=cd $PHOME

    ```


    Include this in your .kshrc file, and it will be available whenever you need it.
    The best part is, if you change to a different project, all you do is change the
    variable. Your fingers can continue to use the same command.


    # 6. Is there a command I can use to return quickly to my home directory?


    Yes; try cd all by itself. This little trick will get you back to your home directory
    quickly, no matter how far away you have managed to stray.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 7. Is there a way I can cancel a print job?


    Quick! Use the cancel command to halt the print job you just sent. This command
    has the form


    ```

    cancel [request-id|printer]

    ```


    which means that you can cancel a job by specifying either the requestid or the
    printer; in the latter case this will cancel the job on that printer. Note that
    you can only cancel a print job that you created. To cancel someone else''s print
    job requires (ta-da!) the superuser.


    # 8. What can the more command do for me?


    The more command lets you look through a file a page at a time. You can use /regexp
    to jump ahead in the file by searching for the regular expression, but you can''t
    search backwards. There are other, more flexible, paging programs around, however,
    so if you find yourself frustrated by the limitation of more, ask your system
    administrator to get a copy of less for your system. This little program lets
    you page back and forth through the file, and is quite a bit handier than more.
    Or get in the habit of using vi in its read-only form, view, as a substitute.


    # 9. Is it wise to create an alias for the rm command?


    This is a touchy one. Some purists feel strongly that you shouldn''t alias any
    of UNIX''s built-in commands, while others do it all the time. We tend to think
    it''s a bad practice if carried to the extreme, but in some cases it can be a
    lifesaver. For example, if you want to add an additional layer of protection,
    this is one way to do it. Try adding the following to your .kshrc file:


    ```

    alias rm=''rm -i''

    ```


    Now, whenever you go to remove a file, you will be prompted for confirmation.
    The problem with this approach is that it can get pretty annoying if you have
    a bunch of files to remove and you''re really sure you want to remove them. Under
    those conditions, you can get careless about the'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'removal, answering "y" to the prompt without really reading it. A better solution
    is to move the files out of the way temporarily, and only remove them when they
    are old enough that you are sure that you want to get rid of them.


    # 10. What’s the best way to protect my data against accidental erasure?


    Backup, backup, backup. Absolutely nothing beats a *verified* backup when disaster
    strikes. The person with the primary responsibility for backups is the system
    administrator, but everyone who works with computers needs to take responsibility
    for backups of his or her own critical files. This isn’t hard, it need not be
    onerous, and it can be a lifesaver. Read about the various UNIX backup options
    and how to take advantage of them in Chapter 12.'
  merge: -1
  img_proc: true
