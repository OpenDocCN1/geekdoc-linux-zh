    # FILES AND FILENAMES


    # How long can a UNIX filename be and what characters can it include?


    UNIX filenames are much more flexible than, say, DOS filenames. At the very least,
    they can be 14 characters long on even the oldest systems, and these days most
    UNIX systems will support a file called `reallyridiculouslylong-andcomplex.filename`.
    But that is probably not a really useful filename. The only hard and fast rule
    for filenames is that the filename can include any character except a slash (/).


    # What is a good UNIX filename?


    Realistically, you should probably limit your filenames to the following:


    +   - alphanumeric characters

    +   - underscores

    +   - periods


    Other characters may work on your version of UNIX, but may not translate very
    well to other systems.


    # Can I unhide hidden files and directories?


    Files that have names beginning with a period are called "dot files" and are hidden.
    Actually, they’re not very well'
