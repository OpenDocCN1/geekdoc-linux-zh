- pgno: 100
  md: 'By setting and using variables, you can save yourself a lot of time. Here''s
    what you''ll need to know to use variables to travel quickly between directories,
    to spruce up your terminal''s looks, and more.


    If you''re a confirmed DOS user, you may want to know how to create a set of UNIX
    commands that work like their DOS equivalents. This may sound like an odd thing
    to do, but if you''re sick of wasting time because your fingers are typing DOS
    commands while you''re working in a UNIX environment, here''s a solution.


    In the section about shell script shortcuts, you''ll learn from other people''s
    mistakes. These are the basic do''s and don''ts of working with UNIX shell scripts.


    # START-UP SCRIPT BASICS


    # Start-up Scripts


    The single most important change you''ll make to your work environment is in your
    start-up scripts. Depending on the shell you use, this may involve only a single
    file or several.


    For the most part, though, you''ll have two very important files to worry about
    if you''re in text mode, and one or more additional ones for those of you running
    in XWindows or some derivative of XWindows, such as HPVue, SCO Open Desktop, or
    CDE (short for "Common Desktop Environment," the new standard for XWindows desktops).
    The specifics of each XWindows shell are too individual for this book, but we''ll
    deal with some of the more general things you can do and you can use the documentation
    you received with your system plus what you learn here to tweak HPVue or whatever
    to your heart''s content. (There''s lots more on XWindows in Chapter 8.)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# What are start-up scripts, and what can they do for me?


    Start-up scripts are really just customized segments of code that live inside
    your UNIX start-up files. Their purpose is to tell UNIX exactly how you’d like
    your terminal and environment variables set, among other things. Once you understand
    how they work, start-up scripts can save you an enormous amount of time and frustration,
    so read on to learn more about them.


    # How do I edit a start-up script?


    Easy. Load the relevant file(s) into your favorite editor and go to it. To be
    safe and save yourself some grief, however, heed the following tips:


    +   - Any time you make changes to start-up scripts, be sure you make a backup
    first. It’s possible—in fact, easy—to do something that will prevent you from
    being able to log in. Your system administrator will be fairly forgiving the first
    time, but increasingly less so after that. So always back up originals of your
    scripts to a safe place before you start messing with them.

    +   - Use **rlogin** to test your changes before you log all the way out. This
    little trick can save you all sorts of embarrassment. Whenever you make changes
    to any of your start-up files, try the following before you go any farther:


    ```

    rlogin localhost

    ```


    where **localhost** is replaced by the hostname of the machine you’re currently
    on. The worst that can happen is you’ll find out that what you just tried to do
    didn’t work, and you can kill the **rlogin** and restore the saved version of
    the file.


    # How can I customize UNIX if I’m a Korn shell user?


    The Korn shell uses two basic files to control its start-up. The first, **.profile**,
    is read only by the original login shell and resides in your home directory. This
    is the place to put terminal setting commands and environmental variables.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'However, once this file is read the first time, it''s not normally read again
    for that session, unless we explicitly call it or in some other way force it to
    be read. The second file, .kshrc, is read every time another shell is spawned,
    if we''ve set ourselves up to use it at all.


    # How do I tell the Korn or Posix shell to check if there is a secondary start-up
    file, and use it?


    The Korn and Posix shells check to see if there is a variable called "ENV" in
    your environment, and if there is, they look at its value to find out what the
    secondary start-up file is called. So add the following to your .profile and all
    will be well:


    ```

    ENV=$HOME/.kshrc

    export ENV

    ```


    # Some Advice for Korn Shell Users


    OK, we know you didn''t really ask me for any advice, but here are a few tips
    that may help you:


    +   - Put the things that can be exported into ~/.profile and save aliases and
    special settings for your secondary start-up script. The usual name for this second
    start-up script is .kshrc, and it should also reside in your home directory.

    +   - We used ~/.profile above, and then used $HOME/.kshrc right after. But there
    is, in fact, absolutely no difference when running Korn or Posix shell between
    ~ and $HOME when used this way. They both refer to your home directory, the place
    where you start out when you first log into the system. We''ll use them interchangeably,
    and you''ll see both in other books.

    +   - If you''re writing a shell script that must be interpreted by the Bourne
    shell, use the $HOME construct. This is necessary because the Bourne shell doesn''t
    support the ~ version. In fact, it''s probably a good idea to get in the habit
    of using $HOME in scripts as a matter of course. And it''s easy enough to make
    that a vi map! command so you don''t have to type it all out.

    +   - Use different .kshrc files for different projects. I use this trick all
    the time. Instead of having ENV always refer to your home'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'directory, have it point to the current directory first and then, only if it
    doesn’t find a .kshrc, have it look at your home directory. This way, you can
    easily load a set of special aliases for each project and still have a default
    set for general use. Your initial login window, of course, will always see your
    default resource file, $HOME/.kshrc, since that will be the current directory
    when you log in. The following illustration shows how to do it.


    ```

    if [[ -f ./ .kshrc ]]

    then ENV=./.kshrc

    else ENV="$HOME/.kshrc"

    fi

    export ENV

    ```


    If you have a terminal with multiple windows available, or you’re running XWindows
    and have multiple windows open, then each window you open will look in the directory
    that’s current at the time you open the window to see if there is a .kshrc present.
    If there is, it’ll load that .kshrc. Unfortunately, however, it won’t load your
    general one if there isn’t a .kshrc in your current directory.


    Tip: When running XWindows, your first window into a directory should be a login
    shell.


    Note: The login shell will look to see if the current directory contains the resource
    file. If it doesn’t, then it will load your default resource file, .$HOME/.kshrc,
    as will all subsequent windows loaded from that window.


    # How can I customize UNIX if I’m a C shell user?


    C shell users should use .cshrc to add customizations. This file, which should
    be in the home directory, performs the same functions for csh users that .kshrc
    does for Korn shell users. In the C shell, the login script is the ~/.login, which
    equates to the Korn shell users’ ~/.profile. However, the C shell also lets its
    users set default actions when they log out.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# START-UP SCRIPT BASICS


    These are stored in the ~/logout script, so if you’re feeling adventurous, you
    can experiment with this one, too.


    # Can I get rid of that boring old $ prompt?


    Yes! The Korn shell defines a variable, **PS1**, which is the normal prompt. So,
    if you change the value of **PS1**, you change your prompt. This prompt can include
    the values of other variables, or any text string. For example, if you like to
    think of yourself as the master of the computer, you might try this for a prompt:


    ```

    PS1=''How may I serve you, Master?''

    ```


    Go ahead; try a few things. You can have some fun with this, but when you get
    done fooling around, you’ll probably want something more useful, so keep reading.


    Use the **$PWD** variable that is built into the Korn shell to track your current
    directory. Most of us are familiar with the DOS prompt that tracks our current
    directory. So, if you try to achieve the same thing in UNIX, you might try


    ```

    PS1=''$PWD \$ ''

    ```


    Looks good at first glance. If you are in your home directory, it might look something
    like this:


    ```

    /users/harold $

    ```


    But what happens when you change to harold’s bin directory? You type in


    ```

    /users/harold $ cd bin

    ```


    then ask for the identity of the present working directory,


    ```

    /users/harold $ pwd

    ```


    and end up with the following:


    ```

    /users/harold/bin

    /users/harold $

    ```


    Maybe this isn’t quite what you had in mind. That’s because the double quotes
    allow the Korn shell to "see" the **$PWD** variable and interpret it. Once that
    happens, it’s converted into a string and becomes static. To prevent this,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'we enclose it in single quotes, which will stop the initial evaluation of the
    $PWD variable, and allow it to be passed to the command line, where it will then
    get interpreted. So now we type


    ```

    $ PS1=''\$PWD \$ ''

    ```


    and when you change to harold''s bin directory and ask for the present working
    directory, the prompt will show


    ```

    /users/harold/bin $

    ```


    Now the prompt will track the current directory as intended. The deep directory
    structures possible in UNIX can make for a pretty long prompt, however. For this
    reason, we like to use the following, a two-line prompt with the current directory
    on the first line, and then the "$" on the second line. Type in the following:


    ```

    /users/harold $ PS1=''\$PWD \n\$ ''

    ```


    to get a prompt that looks like this:


    ```

    /users/harold

    $

    ```


    Now we have a nice two-line prompt that shows us the current directory.


    Tip: Include your "pseudo terminal" in your prompt. If you work on a machine that
    supports multiple pseudo terminals, keep track of which window you''re working
    in by using this prompt:


    ```

    PS1="[\$ (tty|cut -c9-11)]\$PWD \n\$ "

    ```


    The result will show


    ```

    [p01]

    ```


    followed by your directory name information.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Tip: Include the hostname in your prompt, so you know where you are. If you
    work in a distributed environment, where you regularly log in to different machines
    from your "normal" machine, it can be a pain to keep track of which machine you''re
    on. So include it in your prompt!


    ```

    PS1="${hostname} : ${PWD} \J \$ "

    ```


    But when I do that on my system, I get


    ```

    rc1.rc1.com:/users/charlie

    $

    ```


    So, use the %% trick to strip off the unwanted stuff from the right side of the
    hostname. If you''re stripping something off the left side, you''d use ## instead.


    ```

    host=`hostname`

    PS1="${host%%.*}: ${PWD} \J \$ "

    ```


    This puts the local hostname into the prompt, stripping out the domain name stuff
    that may be returned by running the hostname program.


    # Which quote is which and why should I care?


    Throughout this book, and in other UNIX books, you will see three different kinds
    of quote marks: single quotes (''), double quotes (") , and grave quotes (`).
    Each one has a very different meaning to the shell.


    The single quote says to the shell—look, everything inside here is a plain, unadulterated
    string. Don''t even try to check to see if you can interpret any of it. Just leave
    it alone and pass it on to the next process. Which means this is almost always
    the kind of quote you should use for an alias, because you want the first pass
    to simply ignore the inside of the quotes, and let it pass the contents to the
    second pass, which will then have the quotes stripped off, and will be able to
    actually interpret what you are trying to do. But if you do have variables inside
    the single quotes, they won''t be expanded but simply passed on, complete with
    their dollar signs.


    Double quotes, on the other hand, are still enclosing strings, but now the shell
    is allowed to look inside to see if there are any special characters it should
    interpret. This'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'allows it to expand any variable that it finds, for example, so that "$PWD"
    gets expanded immediately to the full current working directory. However, once
    the shell has expanded the inside of the double quoted section, it passes the
    result to whatever follows as a literal, quoted string. This means that the inside
    of the double quotes will be evaluated when it is first seen, and not again, so
    you can''t use it in things like prompts and aliases where you want a secondary
    evaluation.


    Finally, the grave quotes (`) are very special, since they tell the shell to actually
    run the program inside the grave quotes and replace the quoted section with the
    result of the quote. This means that `hostname` will be replaced in the command
    with the result of running the hostname program, which would be something like
    rci1.scribes.com on my machine. Again, however, this is evaluated immediately,
    which means that the result is static. Many modern versions of the Korn shell
    have replaced this usage with a completely different-looking—but essentially similar—working
    construct: $(hostname).


    # Tip: PATH too long for a prompt? Strip off the extra. Use the # pattern-matching
    operator to strip out your home directory as shown here:


    ```

    $ pwd

    / users/charlie

    PS1=''\$[\$PWD=~$HOME/\] $''

    / users/charlie $ cd /users/charlie/bin

    / bin $ cd /bin

    / bin $

    ```


    This prompt tracks directories under your home directory nicely, but when you''re
    in your home directory you see the full current directory as part of your prompt,
    and whenever you wander out into the general part of the filesystem, you see where
    you are. Use ## in place of #$HOME in Figure 5-2 to see only the lowest directory
    in the prompt.


    C shell users, don''t despair. All this prompt stuff is nice if you are a Korn
    shell user, but what about the C shell users, you ask? Well, the good news is
    that these same tricks work pretty much in the same way for C shell users. The
    syntax is a bit different, of course, but the overall effect is pretty much'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'the same. For example, suppose you want your basic prompt with the current
    directory in it:


    ```

    set prompt="${cwd}$ "

    ```


    This should work on most systems where C shell supports the variable cwd. How
    about some of the other stuff? Well, you can easily set up an alias, just like
    with the Korn shell. Here''s our alias to get a long listing of the files in the
    current directory:


    ```

    alias ll ls -lAF

    ```


    For start-up files, the C shell uses $HOME/.login and $HOME/.cshrc The .login
    is only read by the initial login shell, while the .cshrc file is read by all
    shells. So put your aliases in the .cshrc just as you would put them in the .kshrc
    file with the Korn shell.


    # SETTING AND USING VARIABLES


    > Tip: You can make your use and navigation of UNIX much easier by using variables.
    Try to keep the use of aliases to a minimum, since every time you start a subshell
    it must be evaluated. Reduce the number of aliases you need by creating variables
    and exporting them.


    # Can I use a variable to describe a frequently used working directory?


    By all means. Then, when there''s a change, you can simply change the directory
    that the variable points to, and all your other aliases and shell scripts that
    use this variable will now point to the new directory. For example, suppose you
    are working on a project with a group of coworkers. The files for the directory
    are stored in /users/projects/newmodel/network. You''re not going to want to type
    that too often. So create a variable that points to that directory—we''ll call
    it PROJHOME—and include it in your .profile:


    ```

    PROJHOME=/users/projects/newmodel/network

    export PROJHOME

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Now you can change to the proper directory with


    ```

    cd $PROJHOME

    ```


    Tip: Add a variable to keep out prying eyes. Let''s say we have a special group
    working on this project and because it''s super-secret, we don''t want anyone
    else looking at our plans. So let''s add another variable, PROJGRP, that we can
    use.


    ```

    PROJGRP=netwrk

    export PROJGRP

    ```


    Now a simple shell script will get us where we want to be, change to the necessary
    group, and fire off a copy of WordPerfect to edit the functional specification
    for the project. The script is shown here, where we''ve also defined the variable
    FSPEC to point to that functional spec.


    ```

    # Shell Script to edit the functional spec

    # for the current project

    # Script stays the same as the projects change.

    sg -a $PROJGRP

    cd $PROJHOME

    /usr/wp/xwp $FSPEC

    ```


    Now our shell script, which we called proj, will automatically handle the whole
    process of getting us to where we want to be, firing off WordPerfect, and loading
    the working file. Sure beats doing all that by hand, doesn''t it?


    # Is there a way I can spruce up a boring text terminal a little?


    For those of you stuck at a boring text terminal, here are a couple of little
    tricks to try. If your terminal supports color but you''ve still got nothing more
    exciting than plain white text on a black background, try this to change the background
    color.


    ```

    alias -x blue=''^[[37;44m''

    alias -x black=''^[[37;40m''

    alias -x revrs=''^[[7m''

    alias -x norm=''^[ [0m''

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'In the above aliases, the ^[ is the escape character. You can enter this by
    pressing CTRL-V and then ESC. Now, if you want a little blue screen with white
    text, just type echo blue. You could have included the echo as part of the alias,
    of course, but this would make the alias less useful. By doing it this way, with
    the -x parameter to alias, the "blue" is available from within your scripts. This
    is especially useful for using the revrs and norm aliases for highlighting text.
    Table 5-1 shows the colors and their corresponding numbers for sprucing up your
    terminal''s looks.


    | Position | Value | Color |

    |---|---|---|

    | Overall | 0 | All attributes off |

    |  | 1 | Bold |

    |  | 4 | Underscore |

    |  | 5 | Blink |

    |  | 7 | Reverse video |

    |  | 8 | Concealed |

    | Foreground | 30 | Black |

    |  | 31 | Red |

    |  | 32 | Green |

    |  | 33 | Yellow |

    |  | 34 | Blue |

    |  | 35 | Magenta |

    |  | 36 | Cyan |

    |  | 37 | White |

    | Background | 40 | Black |

    |  | 41 | Red |

    |  | 42 | Green |

    |  | 43 | Yellow |

