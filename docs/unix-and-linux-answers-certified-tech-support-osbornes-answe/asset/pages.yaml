- pgno: 54
  md: "hidden, but an ordinary **ls** command will not show them. You can \"hide\"\
    \ directories the same way. In fact, many programs will create a raft of hidden\
    \ files and directories in the hope that you'll leave these files alone.\n\nIf\
    \ you'd like to experiment with un-hiding hidden files and directories, try the\
    \ following, which works equally well with either the C shell or Korn shell.\n\
    \n```\nalias la=\"ls -aF\"\n```\n\nThen use **la** instead of **ls**, and you\
    \ will see all the files, including the hidden ones. The difference is shown here:\n\
    \n```\n % ls\nCharles\nMain.c\nPerson.dat\ntrash.dt\n% alias la=\"ls -aF\"\n%\
    \ la\n./\n../\n.lastlogin\n.noderc\n.profile\n.rcoadmin.pref\n.sh\n.sh_history\n\
    .xdt_dir/\nCharles/\nMain.c\nPerson.dat\n.rcoadmin\ntrash.dt\n%\n```\n\nAs you\
    \ can see, there's a lot more useful information shown by the command we just\
    \ created than by the ordinary **ls** command. If your system supports it (and\
    \ most do), you can change the -aF to a -AF and get rid of the dot and dot-dot\
    \ (\".\" and \"..\") from the listing.\n\n# What if I'd like to know a file's\
    \ type in addition to its name?\n\nThat's actually a little trick I snuck in above\
    \ just to see if you're paying attention. The -F option to the **ls** command\
    \ tells UNIX that you want to know the file type as well as the filename. If the\
    \ file is executable, it gets a * after the name; if it's a symbolic link to another\
    \ file, it gets a @ after the filename; and if it's a directory, it gets the slash\
    \ after it."
