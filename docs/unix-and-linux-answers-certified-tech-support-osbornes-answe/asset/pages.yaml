- pgno: 80
  md: 'out the problem. It may have to do with a slightly off terminal emulation.


    # Are there other movement commands in vi?


    There are lots of other movement commands, such as M to move to the line at the
    middle of the screen, H to move to the line at the top of the screen, and L to
    move to the line at the bottom of the screen. Don''t try to remember them all.
    Just get used to using a couple of them that you can combine to get where you
    need to be, and you''ll be fine. Don''t forget that all of these commands are
    case-sensitive. Type in a lowercase letter instead of a capital and the results
    will be unexpected.


    # Is it safe to depend on the "cursor" keys on my keyboard in vi?


    No! Learn the basic movement keys, and use them. If you get in the habit of always
    using the cursor keys, sooner or later you will end up in trouble. You''ll have
    to work on a different keyboard or you''ll log into a remote machine that uses
    a different keyboard. The command keys are independent of the keyboard you''re
    on, but that''s not true of the keyboard''s cursor keys, which may or may not
    be correctly mapped.


    # Can I see where I am in the current file?


    Yes; press CTRL-G. This will also give you a few other pieces of information,
    like whether the file has been modified since the last time you saved it. Another
    way to get this same information is the :f external mode command sequence.


    # How can I swap two characters?


    Put the cursor on the second character, and type xp while in command mode. This
    deletes the second character and then puts it in front of the first, which moved
    under the cursor.


    # Can I change the case of a character I''ve typed?


    Yes; use the ~ (tilde) command. Like most vi commands, you can place a number,
    n, in front of this command to make it change the case of the next n characters.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# INSERTING AND REPLACING TEXT


    > Note: These are two of the most important capabilities of any text editor. Issuing
    any of the commands discussed below will automatically move vi into insert mode
    and cause it to add or alter text according to your specific instructions.


    # What are the basic text insertion commands in vi?


    Here is a short list of the essentials:


    +   - **i** Insert text starting from in front of the current cursor until ESC
    is pressed

    +   - **I** Insert text starting at the beginning of the current line until ESC
    is pressed

    +   - **a** Insert text starting after the current cursor until ESC is pressed

    +   - **A** Insert text starting at the end of the current line until ESC is pressed

    +   - **r** Replace the character at the current cursor position

    +   - **R** Replace text starting from the current cursor position until ESC is
    pressed

    +   - **o** Open a new line below the current line. ENTER will open another line,
    ESC returns to command mode

    +   - **O** Open a new line above the current line. ENTER will open another line,
    ESC returns to command mode


    Almost all these text insertion commands work the same way. When you''re in command
    mode, they''ll switch you to text insertion mode and allow you to start entering
    text. The only difference among them is where the text will actually get entered.
    There is one command on the list that''s slightly different: the r (lowercase
    "r") command, which will replace a single character and return immediately to
    command mode.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Is there something I can do if I don’t like the word I just entered?


    Yes; press CTRL-W to retype it. This is one of the few ways you can move the cursor
    position while staying in insertion mode.


    # What if I want to start my text insertion all over?


    Press CTRL-U. The other way to do this is to ESC back to command mode and press
    u for undo. The undo command is only a single level deep, though, so undo immediately,
    or you will have to fix it the hard way.


    # How can I undo all the changes I’ve made to the current line?


    Try pressing U from command mode. This gets around the single-level undo limitation,
    but only for the current line. Once you move your cursor off the line, you can’t
    undo the changes on that line, unless they’re still in the single-level undo buffer.


    # Can I replace the current character and then insert more text without overwriting
    what’s there?


    Yes; use the s command. We know we can replace a single character with r, and
    we can insert text with i or a, but by using s we get around the limitations of
    r without having to worry about overwriting something we don’t want to. If you
    want to replace the next ten characters, and then start inserting text, just type
    10s and start making your change.


    # How about replacing the entire current line?


    Use S. This will delete the current line, move the cursor to the first column,
    and change to insert mode.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# What exactly can the c command do for me?


    It can change a word, a line, or a sentence. Actually, this command can do even
    more. Combine a simple c with a more complicated cursor movement command, and
    you can get really slick. First, the simple ones, and a table is probably the
    easiest way to list them all, so take a look at Table 4-1.


    On most versions of vi, the text you are about to change will be delimited by
    a $ at the last character of the change. And in all cases, when you reach that
    last character, you''ll change from writing over the existing text to pushing
    the existing text to the right in front of your cursor. This provides a powerful
    way to quickly fix a word, phrase, or sentence, and then move on about your business.


    | Command | Result |

    |---|---|

    | cw | Change text from current cursor to end of current word. |

    | c n w | Change text from current cursor to end of nth word. |

    | cb | Change text from beginning of current word to character in front of cursor.
    |

    | c n b | Change text from beginning of nth previous word to character in front
    of cursor. |

    | c ) | Change text from current cursor to end of sentence. |

    | c ( | Change text from preceding start of sentence to character in front of
    cursor. |

    | cc | Change entire line. |

    | c ) | Change text from current cursor to end of paragraph. |

    | c { | Change text from preceding start of paragraph to character in front of
    cursor. |

    | c / c | Change text from current cursor through first occurrence of character
    c. |

    | c n / c | Change text from current cursor through nth occurrence of character
    c. |

    | c F c | Change text from previous occurrence of character c through current
    cursor position. |

    | c n F c | Change text from nth previous occurrence of character c through current
    cursor position. |


    Table 4-1 The Change Command'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Is there a way I can repeat my last text change?


    Yes; use the dot command (.). This little trick saves loads of time. Need to add
    a couple of spaces at the beginning of the next several lines? Well, you could
    figure out the exact command sequence and write a macro to do it (see "Macros"
    later in this chapter), or just do an I Escape ("I", space, ESC) on the current
    line, press j to move down to the next one, and press . (dot). Do this for as
    many lines as you need to indent.


    # SEARCHING FOR (AND REPLACING) TEXT


    # What’s the easiest way to find some text?


    Ah, now we get into external mode. Here we use the ex command set. So, to search
    from the current cursor position for something we use


    ```

    /searchpattern

    ```


    To search backwards, use


    ```

    ?searchpattern

    ```


    The search pattern can be a simple bit of text, like searching for the word "Priscilla"
    in a file, or a more complicated pattern-matching string. Let’s save the pattern-matching
    discussion for just a moment.


    # Can I search for and replace text?


    Certainly. Search for one pattern and replace it with another, using the external
    mode substitute command. The syntax is


    ```

    x,ys/searchpattern/replace/options

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'So, to find a series of unflattering references to your boss and replace them
    with "Priscilla," the following will work:


    ```

    1,$s/catbrain/Priscilla/g

    ```


    As a substitute for the 1,$ of this command, you can use % if saving the two keystrokes
    is important enough to you to bother remembering it.


    # Do I have to know what line I''m on to run substitute on the next ten lines?


    No. Use the . (dot) to represent the current line, and then tell vi to do the
    substitution for the next ten lines:


    ```

    .,+10s/fishbreath/Alfie/g

    ```


    To make sure you don''t accidentally change something you didn''t mean to, use
    the c option after the final slash. This will print the string to be substituted
    with "A" characters highlighting it. Press Y to make the change, and anything
    else to leave it as is.


    # How can I execute a command on an entire file?


    Use the global command. This lets you search through a file and execute the yank
    command, for example, to append the lines that match a particular pattern to a
    buffer. Thus:


    ```

    :g/Priscilla/y A

    ```


    will grab all those lines with "Priscilla" in them, place them in buffer a, appending
    them after anything that is already there. This command lets you do some fairly
    tricky things, like search for all lines that begin with a number, and indent
    them five spaces:


    ```

    :g/^[0-9]/s/^/     /g

    ```


    Using this command, the text in Figure 4-1 becomes lined up like the text in Figure
    4-2.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_86_0.png)


    Figure 4-1 Text before a global command to rearrange


