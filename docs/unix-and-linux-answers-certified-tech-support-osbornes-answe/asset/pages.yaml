- pgno: 245
  md: 'One of the most popular versions of these is Linux, which is available for
    free on the Internet or for a nominal cost from various vendors. This chapter
    is devoted to pointing out the differences between Linux and the big name commercial
    variants of UNIX.


    # LINUX BASICS


    # Where can I get Linux?


    Installing a UNIX operating system from scratch can be pretty painful for novices.
    Linux is designed to be a viable alternative operating system for novices, however,
    and different groups have put a lot of effort into making life a little easier
    for you. Basically, using one of the popular Linux distributions can save you
    a lot of time and pain.


    There are many differences among the major distributions. Some provide smooth
    upgrade paths, some provide greater flexibility, and some are just fun to hack
    around with. As long as you use one of the common distributions you probably can''t
    go wrong, and if you do have questions or problems you''ll be able to find a large
    group of helpful people who can steer you back onto the path when you get lost
    in the wilderness.


    You can get a complete copy of most of the distributions for free via anonymous
    FTP from various sites on the Internet. We recommend, however, that you purchase
    a copy on CD-ROM from a local vendor or via mail order in order to save yourself
    the time and agony of transferring that much data over the Internet.


    # What''s your favorite Linux distribution?


    Redhat. It provides a solid and robust packaging system called rpm that allows
    you to install, upgrade, or remove entire packages of software with a single,
    simple command. Each release is thoroughly tested and contains the latest and
    greatest versions of a huge variety of software. In addition, many volunteers
    package up their favorite software packages that aren''t included in the distribution
    and make them available using the rpm format.'
  merge: -1
  img_proc: true
