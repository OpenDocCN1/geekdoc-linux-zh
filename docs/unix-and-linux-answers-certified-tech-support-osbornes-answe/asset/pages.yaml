- pgno: 241
  md: "# Chapter 13  The Korn Shell\n\nThis looks a lot like the syntax of a **for**\
    \ loop, and it should because they are, in fact, the same. The difference is that\
    \ with the **select** construct we don’t pass everything in the list to the do...done\
    \ part, only what the user selects from the menu that’s displayed. Figure 13-3\
    \ shows an example of how this works.\n\n```\ncat pets\nPS3='favorite pet? '\n\
    select var in Cats Dogs Birds Fish\ndo\n        case $var in\n               \
    \ Cats)   print \"Cats are my favorite pet\";;\n                Dogs)   print\
    \ \"Dogs make friendly pets\";;\n                Birds)  print \"Birds are a cheerful\
    \ addition to the house\";;\n                Fish)   print \"Fish make for a quiet\
    \ pet\";;\n        esac\n        break\ndone\n$ pets\n1) Cats\n2) Dogs\n3) Birds\n\
    4) Fish\nfavorite pet? 1\nCats are my favorite pet\n```\n\n![](img/0c1fc10350aa06ca92e7921c96c628ec_241_0.png)\n\
    \n**Figure 13-3**  The Korn shell’s select builds simple menus automatically"
