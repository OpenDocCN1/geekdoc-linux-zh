- pgno: 87
  md: 'Let’s examine this command a bit more closely. Here’s what it means, piece
    by piece:


    +   - `: Do this command in ex mode.

    +   - `g`: Execute the global command.

    +   - `/\[0-9]/`: Search for lines that begin (the `^`) with a number.

    +   - `s`: Execute the substitute command.

    +   - `/\/g`: Substitute five spaces (or put the number of spaces you want between
    the last two slashes) for the beginning of the line, and do it globally without
    asking.


    As you can see, this command gives us some pretty powerful ways to manipulate
    text within vi, using the external mode commands.


    # CUTTING AND PASTING


    # What’s the command for cutting a line into the paste buffer?


    Simple—dd. This will cut a single line of text. Oh, you wanted the next ten lines?
    That’s simple too—type 10dd and you have them.


    # Can I copy a line into the paste buffer?


    Yes; press yy. The yank command, this works just like dd except that the line(s)
    are copied to the buffer, not deleted.


    # How can I cut a character into the paste buffer?


    Use the x command. This will delete the character under the cursor, pulling the
    line back. When it reaches the end of the line, it starts deleting the character
    before the cursor (backspace). For ten characters, use 10x.


    > Tip: Text in the paste buffer is only a single level. As soon as you make a
    deletion or "yank" (copy) to the paste buffer, you lose what was in there before.
    So think before you yank or delete something. Have you finished with the current
    buffer’s contents?'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# I''ve heard that using the dd command is better than yanking. Is this true,
    and if so, why?


    If you yank text, it doesn''t go into the stack, so you can only get at the last
    text you yanked. But if you delete it, it goes into a nine-level "stack" (last
    in, first out). So, to add a line to the stack without actually deleting it, do
    a dd followed by an immediate P. Your file hasn''t changed, but you have added
    the current line to the buffer. Now, go ahead and delete something else. Want
    that first line back? It has now been pushed one up on the stack by the second
    deletion, so to get it back, do a "2p" and you will insert it after the current
    line. Pretty slick. The only problem with this, however, is keeping track of what''s
    in which buffer. Using named buffers is better, because they don''t change unless
    you overwrite them, but if you get in the habit of using the ddP combination instead
    of yy, you will save yourself some grief often enough to make the extra keystroke
    worth it.


    # Can I use the named buffers to make editing easier?


    Absolutely. All that deleting and yanking is nice, but what if you need to grab
    a piece from here, a piece from there, and another piece from somewhere else?
    Hmmm, that single-level buffer isn''t going to get it done, is it? No sweat—vi
    provides for a total of 26 "named buffers." That should be enough for almost anyone.
    The buffers are named a–z, and you cut or copy text into them in exactly the same
    way you would into the regular cut/copy/paste buffer. Except you precede the cut
    or copy command (dd or yy) with "a for the a buffer, "b for the b buffer, and
    so on.


    # What''s the smartest way to use named buffers for my paste operation?


    Try preceding the paste command with "a where a is the named buffer. If the text
    you want is in the b buffer, use "b, and so forth.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Is there a way I can put the contents of the paste buffer after the current
    line?


    Yes; use the p command. If you have cut or yanked only a partial line, the text
    in the buffer will be placed in the current line, after the current cursor position.
    Use P to place the text before the current line or position.


    # How can I cut a word into the buffer?


    Use dw. Actually, this is the simplest example of the more general rule. Use decursormovement
    or ycursormovement to cut or copy text into the buffer. The cursor movement keys
    are the same as for the change command of Table 4.1.


    # How can I give my text the right look?


    Editors are very personal things. What works for some people may not work for
    others. So, a good editor lets you change the way it behaves and looks to the
    point where you can be comfortable with it. In vi, there are three basic commands
    to change the look and feel of your editor, and all are external mode commands.
    The first is the :set command. Use this to set all sorts of options. The list
    may vary slightly, depending on your particular implementation of vi, but Table
    4-2 shows some of the most common.


    | Option | Description |

    |---|---|

    | ai | Autoindent—new lines start lined up with the indent from the previous line.
    |

    | noai | Autoindent off (the default). |

    | aw | Autowrite—current buffer contents are written when escaping to the shell,
    or using :n to go to the next file. |

    | noaw | Autowrite off (the default). |

    | flash | Flash screen on an error instead of beeping (the default). |

    | noflash | Use a beep instead of a flash. |

    | ic | Ignore case on searches or pattern matching. |


    Table 4-2 vi options'
  merge: -1
  img_proc: true
- pgno: 90
  md: '| Option | Description |

    |---|---|

    | noic | Don’t ignore case (the default). |

    | lisp | Set autoindent to line up better when editing lisp programs. |

    | nolist | Autoindent lines up with the beginning of previous line (the default).
    |

    | magic | Use the full set of metacharacters when doing pattern matching (the
    default). |

    | nomagic | Limits metacharacters to only ^ and $. |

    | mesg | Allows other users to write to your terminal (the default). |

    | nomesg | Disables write permission to your screen. |

    | nu | Display line numbers along the left edge of the screen. |

    | nonu | No line numbers displayed (the default). |

    | ro | Read only; prevents the file from being changed without explicitly overriding
    the setting with :w!. |

    | noro | Normal read/write mode (the default). |

    | remap | Allows macro definitions to link directly to already mapped commands
    (the default). |

    | noremap | Causes macro definitions to be explicit. |

    | showmatch | Highlight matching ( or [ briefly when a closing ) or ] is typed.
    |

    | noshowmatch | No highlighting of matching delimiters (the default). |

    | showmode | Show a highlighted mode indicator on bottom line when in text entry
    mode. |

    | noshowmode | Don’t indicate the current mode (the default). |

    | ts=n | Set tab spacing to n characters. Default is 8. |

    | warn | Warn before a shell escape when text has been modified since last write
    command (the default). |

    | nowarn | Don’t warn before shell escapes, just do it. |

    | ws | Searches wrap around to the beginning of the file and keep going (the default).
    |

    | nows | Don’t wrap when the end of the file is reached in a search. |

    | wm=n | Wrapping—when set to other than zero, automatically insert a new line
    when the current word would exceed the margin. The number of characters from the
    right-hand edge of the display for the margin, i.e., wm=8 sets the right margin
    on an 80-column display at column 72. |


    **Table 4-2** *vi options (continued)*'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Now that you know what your options are in vi, here''s some free advice:


    +   - **Set showmode to on.** It''s a nuisance to suddenly find you are inserting
    text just because you accidentally hit the wrong key. This simple little change
    gets over that, giving you a gentle reminder whenever you are in text insertion
    mode. Just type `:set showmode` to turn this on.

    +   - **Use autoindent when you are writing shell scripts or program code to make
    your files easier to read.** This way, when you write if or case statements, or
    other programming structures, it''s easier to set them off so that they are clear.

    +   - **Use showmatch to help find matching braces when you are writing programming
    code.** This can make it much easier to tell which brace or bracket you are closing,
    since the cursor will jump to the corresponding opening brace or bracket for a
    second, and then back. When you aren''t writing code, just typing a letter or
    simple text file, this can be a minor annoyance, so turn it back off with `:set
    noshowmode`.

    +   - **Put all your "normal" settings in the file .exrc in your home directory.**
    This file is automatically loaded every time you start vi unless there is a file
    of the same name in your current directory.

    +   - **If you have different settings for different tasks in vi, create directory-specific
    .exrc files for each task.** If you use vi to write notes as you work on things,
    keep all these notes in the same directory. It''s easy to set up a special .exrc
    file for a directory that''s more appropriate for note taking. You might want
    to set `wrapmargin=72` for this directory, for example, while your shell script
    directory gets an .exrc with wrapmargin off and autoindent on.

    +   - **Use comments in your .exrc file to make it easier to understand.** Any
    line that begins with a double quote (") is ignored by vi when it starts. It may
    take a moment longer to start up, but it''s a lot easier to remember why you have
    a certain option set if you put a comment'
  merge: -1
  img_proc: true
