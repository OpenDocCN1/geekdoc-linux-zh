- pgno: 131
  md: '# Chapter 7


    # Running Programs


    # Answer Topics!


    # RUNNING A SINGLE PROGRAM 101


    +   - Executing a file

    +   - Making a program executable

    +   - Automatically making shell scripts executable

    +   - Controlling which shell a script is executed by

    +   - Reissuing commands

    +   - Editing previous commands

    +   - Editing commands using emacs

    +   - Piping and I/O redirection


    # MULTITASKING 106


    +   - Running multiple programs in UNIX

    +   - Sending a job to the background

    +   - Checking on background jobs


    +   - Bringing a background job into the foreground

    +   - Alternative ways to send jobs to the background

    +   - Using redirection to send both normal program output and error messages
    to a file

    +   - Using the tee command

    +   - Setting priorities


    # SCHEDULING JOBS 109


    +   - Putting a job to sleep

    +   - Using sleep as a simple alarm clock or reminder

    +   - Using the sleep command to back out of a command

    +   - Using the at command

    +   - Using cron to automate tasks


    # Running Programs @ a Glance


    Running a program is simple if you only know how. Here''s what you need to know
    in order to launch various kinds of programs in UNIX.


    Controlling flow and making sure data goes where you want it to be are the purpose
    of piping and I/O redirection. You''ll need to know how to redirect output into
    a file and where you can find it if you need it; knowing'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'how to get input from a file (rather than the keyboard) can be helpful too.
    Piping, the most important kind of redirection in UNIX, allows you to take the
    output of one program and redirect it to another program, which can save you an
    enormous amount of time and effort.


    Even before there was MS Windows, UNIX was a fully functional multitasking operating
    system. The key to multitasking in UNIX is knowing how to manage all those programs
    or jobs you''re running simultaneously.


    It''s extremely important to understand how to set priorities when you''re working
    in a UNIX environment, since you''re almost always sharing memory capacity and
    processor time with others. Here''s how to be nice.


    Scheduling jobs is another way to be courteous to your fellow users and to improve
    your own efficiency. You can put a job to sleep until later, schedule a job for
    a specific time in the future, or use a crontab to automate your tasks.


    # RUNNING A SINGLE PROGRAM


    # Executing a File


    Actually, UNIX is always running several programs, so you can''t ever just run
    a single program. But most of that happens in the background and behind the scenes,
    so we''ll just let it stay there for the moment. You''ll remember from Chapter
    3 that each file on your machine has a set of permissions. These include the permission
    to read the file, write to the file, and to execute it. By "execute" we mean to
    make the file run, as in actually do something.


    It''s important to understand that very few programs, and probably none you will
    have to worry about unless you end up as a superuser, are actually executed directly
    by UNIX. This is done by the shell. Whether you are running Bourne, Korn, C, or
    one of the less common shells, it''s actually the shell that interprets what you
    type at the prompt and issues the necessary commands to start up the program.
    It''s also the responsibility of the shell to examine the permissions for the
    file and decide if you even have the right to run the program. So, if you don''t
    first set the execute permission bit for your program, you aren''t going to get
    very far with it.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# How can I make a program executable?


    Use chmod +x. This seems pretty obvious, but if you have this nice little program
    that you wrote to say "Hello, World!" (OK, we know that''s hardly original, but
    sometimes one must bow to tradition) and when you try to execute it, it looks
    something like Figure 7-1, you forgot to give your file permission to execute.


    # Is there a way I can automatically make my shell scripts executable?


    Yes, by creating a simple shell script. This is sort of a recursive fix. Use a
    shell script to make your shell scripts execute. You can get fancy about this,
    if you really want to, but we use just the simple little vix script shown in Figure
    7-2.


    # Can I control which shell my script is executed by without having to change
    scripts?


    Figure 7-2 showed a little trick we were going to save for Chapter 13 when we
    talk about shell script secrets, but since it''s in this figure, we''ll talk about
