- pgno: 38
  md: '# Getting a Grip on UNIX @ a Glance


    To get a grip on UNIX, you might think the right place to start would be at the
    beginning with installation instructions. However, installing UNIX is an arcane
    art form—best left to those who do it for a living. Each version of UNIX (and
    there are zillions of them) has its own peculiarities and quirks, and each version
    requires an intimate knowledge of the hardware and software of both the actual
    machine it''s being installed on and any other machines that it may be connected
    to. In other words, it''s the special job of that most holy of holies, the "superuser"
    or system administrator. This book is not written for them, but for you, a person
    who works on a UNIX computer and wants to be better, faster, and more efficient.
    But even if you''re a beginner, you''ll still find plenty of useful information
    here.


    What makes a UNIX computer unique? Most of us know pretty much what to expect
    from a DOS computer. It''ll have one or two floppy drives, a keyboard, a monitor,
    an actual computer box, and maybe a few other things. You sit down at it and start
    working. You can usually figure that you''re the only person working on it while
    you''re sitting there, even if you''re connected to a network. Not so with UNIX.


    With UNIX, you may be sitting at a simple terminal, not much more than a screen
    and a keyboard, nothing but ugly text on the screen and no apparent computer anywhere
    around. Or you could be sitting in front of a beautiful, high resolution graphics
    screen with a powerful workstation standing alongside your desk. Or it could be
    some combination in between. And in virtually all cases, there''s a very good
    likelihood that you''re sharing the computer with other users. They may be in
    the same room, or on the other side of the world.


    So, with all those differences, how can you reasonably expect this, or any other
    book, to apply to you? Not to worry! Even though there are lots of differences
    in the different flavors of UNIX, and the different machinery that it runs on,
    there are even more similarities. This book will focus on those similarities—where
    almost all the work is done anyway.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# FIRST THINGS FIRST


    # Why does UNIX have a reputation as being an enigmatic, difficult and thoroughly
    nerdish operating system, and is this reputation justified?


    UNIX''s reputation is based on the perception that, in order to use it, one must
    spend hours staring at a bare and unforgiving command line, typing cryptic sequences
    that only a computer could love. While this was once the case, UNIX has come a
    long way in recent years. There are now versions of UNIX that feature GUIs (Graphical
    User Interfaces) and even that bare command line is becoming more forgiving. These
    days, it''s safe to say that the reports of UNIX''s difficulty are greatly exaggerated.


    # Even if its reputation is often overstated, why would anyone in his or her right
    mind want to use UNIX?


    Because it''s a powerful, stable and remarkably flexible operating system that,
    once you know some of its magic, can be a productive and even friendly environment.
    The goal here is to give you the tools and tricks to set your UNIX environment
    up the way you want it.


    This book is not really designed for the rank beginner with UNIX. In most places,
    we assume at least a minimal familiarity with UNIX and with computers. We will
    deviate from that just a bit in this chapter, to make sure we are all on the same
    wavelength, so if this is all boring stuff, just bear with us a bit, or simply
    skip over what you already know.


    # Who developed UNIX and when?


    UNIX was developed at the Bell Labs, starting in the late 1960s, by many of the
    same people who created the C programming language (so now you know who to blame).
    In fact, they helped to drive and shape each other''s design and implementation.


    The idea was to create an operating system whose kernel (or core part) was as
    tiny as possible. The main driving force behind the small UNIX kernel was the
    fact that the developers were doing their work on what were, even by the'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'standards of those days, tiny computers. The first kernel was implemented on
    a tiny DEC PDP-7. Eventually, they were able to obtain a new PDP-11 that had a
    total of 24K of RAM, of which the kernel took only 11K. This severe limitation
    on the amount of RAM resulted in a small, tight kernel with all the utilities
    implemented as separate, stand-alone programs. Each was itself tiny, and designed
    to accept input from the preceding program as well as provide output to succeeding
    programs. A setup like this, where the standard output from one program is accepted
    as the standard input for another, is called piping. It’s a powerful concept and
    is central to UNIX today. It’s also influenced all the operating systems that
    have followed it.


    # How do I log on and get going?


    When you look at your UNIX terminal, you’re presented with the login screen. This
    can be a cute graphical box with places for you to type in your user name and
    password, or a simple


    ```

    login:

    ```


    In either case, type in your user name and press the ENTER or RETURN key, whichever
    your system has. Next enter your password, and we can get down to business.


    Just a short aside here. Why, you might ask, should I have to go through this
    every single time I want to use the computer? Well, since UNIX is designed to
    be a multiuser operating system, it imposes certain security restrictions to protect
    you and your work from inadvertent or deliberate mischief. One of these security
    restrictions is that you have to have an "account" on the system before you can
    use it. And, so that only you can use your account, you have to have a password
    as well.


    When you first log in to a UNIX system, you will see a variety of miscellaneous
    stuff, most of which you don’t care about at all. If you are at a text terminal,
    you will probably see a lengthy copyright notice go scrolling by, and a bunch
    of other stuff. Pay no attention. Finally, you may be asked what kind of terminal
    you’re on. Chances are good you can just take whatever the default is and get
    down to your business. But if you see a bunch of funny stuff on your screen, or
    the keyboard seems to be behaving peculiarly, it’s a good bet that something went
    wrong somewhere and the default is not going to be good enough.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# TERMINAL SETTINGS


    # How can I set the terminal type at login?


    The first thing you need to know is what kind of terminal you have. Sometimes
    this is easy—if you’re at a Hewlett-Packard workstation, for example, chances
    are pretty good you have an "hp" terminal type. If you’re using a personal computer
    and SCO UNIX, "ansi" is a good bet, and on a PC with a communications program
    to log into a remote system, your best bet is probably a "vt100". Almost every
    communications program will be able to emulate that. So, how to set it up? Easy.
    Just add the following line to your .profile file (if you’re running the Korn
    or Bourne shell):


    ```

    eval `tset -m hp:\?hp -s -e -k ^Q`

    ```


    In a nutshell, this line uses the UNIX terminal setup command (tset) to select
    the appropriate terminal type and set the erase and kill characters for your terminal.


    For those of you running the C shell, this operation is a little trickier. Add
    the following to your .login file:


    ```

    set noglob

    set term=(''tset -m hp:\?hp -s -e -k -Q'')

    unset noglob term

    ```


    The extra commands in this version just ensure that the tset command will be read
    correctly. All of the above, of course, assumes a default terminal type of "hp",
    which is nice if that’s what you have. If your usual terminal type is something
    else, just substitute it for the "hp" accordingly.


    # How can I check my terminal settings?


    To find out what your current terminal settings are, type this:


    ```

    stty -a

    ```


    As you can see in Figure 2-1, this will give you more information about your current
    terminal settings than you are likely to ever want or need.'
  merge: -1
  img_proc: true
