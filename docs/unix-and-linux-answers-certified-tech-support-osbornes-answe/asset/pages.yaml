- pgno: 323
  md: '# Appendix D


    # Resource Guide'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# BOOKS


    # UNIX Primers


    These books are not about one particular feature or flavor of UNIX, but about
    the subject in general. We have seen many others, but these are the ones we liked
    best.


    Abrahams, Paul W. and Bruce R. Larson. UNIX for the Impatient, Second Edition.
    Reading, MA: Addison-Wesley, 1996.


    An excellent starting place if you already know a little UNIX and want to learn
    a lot more. Dense at times, irreverent at others, but covers almost everything
    at least a little, and many things quite well. One of our favorite references.


    Christian, Kaare and Susan Richter. The UNIX Operating System, Third Edition.
    New York, NY: John Wiley & Sons, Inc., 1994.


    A widely available introduction to UNIX concepts and techniques that includes
    history, basic concepts, and sections on topics of major interest (shells, shell
    scripts, text editors, sed and awk, etc.).


    Gilley, Daniel. UNIX in a Nutshell: A Desktop Quick Reference for System V & Solaris
    2.0, Second Edition. Cambridge, MA: O''Reilly & Associates, 1992.


    Dense but comprehensive. Covers almost everything with good examples. A valuable
    reference to have on your desktop.


    Glass, Graham. UNIX for Programmers and Users: A Complete Guide. Englewood Cliffs,
    NJ: Prentice Hall, 1993.


    Another good overview of UNIX topics with sections on various shells, utilities,
    networking, and programming tips.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Nutshell Handbook Editors & Jerry Peek. *UNIX Power Tools*. New York, NY: Bantam,
    1993.


    Includes a CD-ROM with all sorts of goodies on it. An excellent book for those
    who are beyond the beginner stage. The organization is a bit difficult to get
    used to, but it seems to work in the end.


    The Waite Group. *UNIX Papers for UNIX Developers & Power Users*. Carmel, IN:
    Sams, 1987.


    This collection of papers by various authors is a bit uneven, but contains some
    excellent materials that you may want to consult someday. The paper on shells
    is particularly noteworthy.


    # Vendor-Specific UNIX Books


    Many of the books written and oriented toward a specific vendor''s implementation
    of UNIX are nonetheless good general references. Here are some we use:


    Cutler, Ellie. *SCO UNIX in a Nutshell*. Cambridge, MA: O''Reilly & Associates,
    1994.


    The SCO version of the *UNIX in a Nutshell* book. Just as comprehensive, just
    as dense, still a good book to have on your desk and one of the first we pull
    out if the man page wasn''t quite enough.


    Heslop, Brent D. and David Angell. *Mastering Solaris 2*. Alameda, CA: Sybex,
    1993.


    Interesting mostly as an operating system moving from BSD to AT&T style, but has
    a useful command reference.


    Russel, Charlie and Linda L. Gaus. *SCO OpenServer: The Windows Network Solution*.
    Upper Saddle River, NJ: Prentice Hall PTR, 1997.


    A nuts-and-bolts guide to setting up and maintaining a completely functional SCO-based
    network. Humorous, accessible, and generally a valuable reference to have on hand.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Spicer, Peter. Inside SCO UNIX, Second Edition. Carmel, IN: New Riders Publishing,
    1993.


    Has an excellent and easily understood command reference. Generally pretty accessible.


    # UNIX Architecture/Design/History/Culture


    Andleigh, Prabat K. UNIX System Architecture. Englewood Cliffs, NJ: Prentice Hall,
    1990.


    A good reference on UNIX subsystems and internals. Well-organized and useful for
    those knotty UNIX-specific questions that you hope will never haunt you.


    Bach, Maurice J. The Design of the UNIX Operating System. Englewood Cliffs, NJ:
    Prentice Hall, 1986.


    Another indispensable reference covering topics that include the UNIX buffer cache,
    internal representation of files, process scheduling, memory management, and the
    I/O subsystem. Not as well organized as the book above, but more comprehensive.


    Gancarz, Mike. The UNIX Philosophy. Boston, MA: Digital Press, 1995.


    One man''s attempt to distill a "philosophy of UNIX." Interesting if and when
    you should find yourself in a philosophical frame of mind.


    Libes, Don and Sandy Ressler. Life with UNIX. A Guide for Everyone. Englewood
    Cliffs, NJ: Prentice Hall, 1989.


    An excellent source for material on the history and culture of UNIX. Includes
    a lot of information about Usenet.


    Salus, Peter. A Quarter Century of UNIX. Reading, MA: Addison-Wesley, 1994.


    A valuable source of information on the history of UNIX as told to the author
    by its "mothers and fathers." Contains transcripts of fascinating interviews.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# The Korn Shell


    Always one of our favorite topics, and a source of both satisfaction and frustration.


    Korn, David G. and Morris I. Bolsky. *The Korn Shell Command & Programming Language*.
    New York, NY: Prentice Hall, 1989.


    Written by the guys who should know, this is a good book, though not for beginners.


    Rosenberg, Barry. *Korn Shell Programming Tutorial*. Reading, MA: Addison-Wesley,
    1991.


    Good coverage of a number of topics. Stronger as a tutorial than as a reference.


    Rosenblatt, Bill. *Learning the Korn Shell*. Cambridge, MA: O’Reilly & Associates,
    1993.


    A good intermediate-level book, with clear explanations. Covers interactive command-line
    use as well as shell programming.


    Valley, John. *UNIX Desktop Guide to the Korn Shell*. Carmel, IN: Sams, 1991.


    Seems to be more about the Bourne shell than the Korn shell in places, and covers
    more general UNIX topics than one would expect in a shell-specific book.


    # UNIX Text Editors


    Another favorite subject, and an area where we are constantly looking for new
    resources.


    Cameron, Deb and Bill Rosenblatt. *Learning GNU Emacs*. Cambridge, MA: O’Reilly
    & Associates, 1991.


    A good book for beginning-to-intermediate Emacs users, compared to most of the
    books out there which seem to be much too dense.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Dougherty, Dale and Tim O''Reilly. UNIX Text Processing. Cambridge, MA: O''Reilly
    & Associates, 1987.


    Yet another valuable contribution from O''Reilly & Associates. This tutorial on
    UNIX editors and formatters includes coverage of nroff, troff, tbl, eqn, pic,
    vi, ex, sed, and awk.


    Hewlett-Packard Company Staff. The Ultimate Guide to the VI and EX. Redwood City,
    CA: Benjamin-Cummings Publishing Co., 1990.


    Perhaps not the ultimate guide, but certainly a good one. Covers vi thoroughly
    and well.


    Lamb, Linda. Learning the vi Editor. Cambridge, MA: O''Reilly & Associates, 1991.


    A comprehensive and useful volume. It includes an invaluable pull-out quick reference
    card that''s dog-eared from overuse.


    # X Window System


    Cutler, Ellie and Daniel Gilley, et al. The Xwindow System in a Nutshell. Cambridge,
    MA: O''Reilly & Associates, 1992.


    "In a nutshell" is perhaps a little optimistic for this tome, but it''s a handy
    book all the same.


    Querica, Valerie and Tim O''Reilly. X Window System Users Guide, Fourth Edition.
    Vol. 3. Cambridge, MA: O''Reilly & Associates, 1993.


    This is a huge volume and it''s just one of the many books oriented toward the
    programmer of X. Its principal virtue is that it provides a good reference for
    users. Doesn''t cover Motif or OpenLook at all, but does cover the twm window
    manager that comes with X.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Souther ton, Alan. *The Shell Hacker’s Guide to X & Motif: Custom Power Tools
    & Window Manager Tricks.* New York, NY: John Wiley & Sons, Inc., 1993.


    Not as much about X as about how to make Motif jump through some interesting hoops.


    # Miscellaneous Useful Books


    Aho, Alfred V., et al. *The AWK Programming Language.* Reading, MA: Addison-Wesley,
    1988.


    Written by the authors of the language, it is comprehensive but not always comprehensible.
    But an essential reference.


    Dougherty, Dale. *sed & awk.* Cambridge, MA: O’Reilly & Associates, 1990.


    Dense but excellent coverage that ties these two important resources together.


    DuBois, Paul. *Using csh & tcsh.* Cambridge, MA: O’Reilly & Associates, 1995.


    The essential guide for those of you who prefer the c shell.


    Farrow, Rik. *UNIX System Security: How to Protect Your Data and Prevent Intruders.*
    Reading, MA: Addison-Wesley, 1991.


    Clear explanations of UNIX system security issues and potential solutions.


    Garfinkel, Simson and Gene Spafford. *Practical UNIX Security.* Cambridge, MA:
    O’Reilly & Associates, 1991.


    A good overview of system security issues and solutions.


    Schwartz, Randal. *Learning Perl.* Cambridge, MA: O’Reilly & Associates, 1993.


    An excellent tutorial coverage of perl for the person new to the language.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Wall, Larry and Randal Schwartz, *Programming Perl*. Cambridge, MA: O’Reilly
    & Associates, 1991.


    Too dense by far for the beginner, but an excellent reference once you get going.


    # Other Books


    Probably the single best resource, when you just want a quick answer to something,
    is the man page on that particular program. Nine times out of ten, this will be
    all the information you need. If you prefer hard-copy books, however, the UNIX
    manuals that come with your system are the same man pages, all tucked together
    into a book. The only problem is, they are probably taking up several feet of
    space on your system administrator’s desk.


    However, if you ask nicely, there are frequently additional copies floating around
    that you can use. Or you can even order a whole set if you want to be ostentatious
    about it. But be warned that anyone with official manuals on his or her desk is
    likely to end up becoming the next system administrator. Don’t say we didn’t warn
    you.


    # ONLINE RESOURCES


    The vast world of the Internet offers an almost unlimited resource for the UNIX
    user. But it can be an intimidating place, especially for the person moving to
    UNIX from a PC. In the commercial online world, there is CompuServe which has
    several UNIX-related forums. For general UNIX stuff, the UNIX Forum (GO UNIXFORUM
    at any ! prompt) is excellent, with lots of help and tips. For those using SCO,
    the SCO Forum (GO SCOFORUM) is outstanding. We found this to be among the very
    best of the CompuServe forums, and the Libraries have all the latest updates for
    SCO users, as well as precompiled versions of many popular programs.


    For obtaining programs in source code, we were able to find much of what we wanted
    available for anonymous ftp from **ftp.nut.net**. Another good source is **archive.cis.ohio-state.edu**,
    and for precompiled SCO versions of many programs we’re indebted to Bill Campbell
    and **ftp.celestial.com**.'
  merge: -1
  img_proc: true
