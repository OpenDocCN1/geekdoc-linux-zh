- pgno: 313
  md: 'default  A value or state assumed when no other is supplied.


    dot (.) files  Files that are read when you log in. If you use the C shell, it
    will read .cshrc and .login. Bourne shell reads .profile. Korn shell uses .profile
    and .kshrc. Dot files set up your environment, and are "hidden" from the ordinary
    ls command.


    double quote  The " character. This is used around a UNIX command to instruct
    the shell to do variable and command substitution but no other interpretation.
    See also single quote.


    dumb terminal  A terminal that has no processing power of its own. It usually
    doesn''t have any nice stuff like a mouse or a screen that can do graphics either.


    end-of-file (EOF) character  The character that indicates the end of a file. In
    UNIX, it''s the combination CTRL-D.


    environment variable  A shell setting that makes up part of your environment.
    For example, one environment variable can be the designation of a particular directory
    as your HOME directory.


    escape  A character, usually a backslash or a tilde, that gives a special meaning
    to the character or characters after it.


    etc  Directory containing everything but device files and program files.


    execute permission  A setting for an executable file that denotes who can run
    the program.


    filesystem  A set of files stored on a disk or one partition of a disk. A system
    has one root filesystem containing files and subdirectories, and may have additional
    filesystems mounted on it. Each filesystem contains files and subdirectories and
    these subdirectories in turn may contain further subdirectories. Any directory
    can hold files.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'filter A type of UNIX program that takes input from one file and provides output
    to the display or another file. The more and sort commands are commonly used filters.


    foreground A program that has control of your terminal. In UNIX, the default is
    to run commands in the foreground.


    fork When UNIX starts a new process, it does so by creating a child process. This
    is called forking.


    ftp File transfer protocol. A protocol that defines how to transfer files from
    one computer to another, it''s most often used to describe a program that moves
    files using the file transfer protocol.


    gateway A computer that connects two or more networks and relays messages and
    other communications from one network to another.


    globbing The Berkeley term for file substitution.


    GNU Gnu''s Not UNIX. A freely available substitute for UNIX. See also Linux.


    grave The character `. Also called a prime, it is used for command substitution.
    Not the same as a single quote ('').


    header The first part of an email message that gives information about the message
    such as the sender''s name and when it was delivered. Can also refer to a descriptive
    block of information at the beginning of an archive file.


    hidden file A file beginning with a dot (.login, for example) that''s not normally
    returned by the ls command.


    history A record of previous commands maintained in the computer''s memory. Only
    in the C and Korn shells.


    home The environment variable containing the full path name of your home directory.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '**home directory**  The directory the user is deposited in after logging in.
    This is set with the **home=** command in the **.profile** file.


    **host**  A computer that provides services to other computers.


    **hostname**  The name of your UNIX system.


    **HP/UX**  A version of UNIX made by Hewlett-Packard.


    **I/O**  Input and output. Information going into or coming out of a computer
    or program.


    **inode**  Pronounced "eye-node," it''s short for information node. A data structure
    that describes a file---where the file is stored, how long it is, and so forth.
    In any filesystem, the number of inodes, and therefore the maximum number of files,
    is set when the filesystem is created.


    **input mode**  The mode in which a text editor accepts input and includes it
    in the edited file. The opposite of **command mode**.


    **job**  The contents of one command line, no matter how complex. For example,


    ```

    cat perl.tar.Z | zcat | tar xvf -

    ```


    is one command line, hence one job, even though it''s formed from three processes.
    This is the definition used in most UNIX documentation, though real people tend
    to use the terms job, process, and program interchangeably.


    **job control**  Changing the status of a job. This includes starting, stopping,
    killing, or moving between the foreground and the background.


    **job shell**  A superset of the Bourne shell devoted to job control.


    **kernel**  The core of the operating system that interacts directly with the
    computer. The kernel allocates resources, maintains the filesystem, and manages
    the computer''s memory.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "**kill character** The character that when typed causes the current line to\
    \ be deleted.\n\n**kludge** Rhymes with \"huge.\" A program or a feature that\
    \ doesn't work as well as it should or gives the impression of being jerry-rigged.\
    \ Not something the programmer is especially proud of.\n\n**Korn shell** An enhanced\
    \ version of the Bourne shell written by David Korn. Its program name is **ksh**\
    \ and it prompts with a **$**. \n\n**library** A set of commonly used C-language\
    \ functions.\n\n**link** An entry in a directory, consisting of a file identifier\
    \ that names a file in the directory and an **inode** number.\n\n**Linux** A freely\
    \ available version of UNIX.\n\n**logging in** The process of making a connection\
    \ to a UNIX machine.\n\n**.login file** See **dot (.) files**.\n\n**login name**\
    \ The name you use when logging into a UNIX system.\n\n**login shell** The shell\
    \ that's called on your behalf when you log in.\n\n**mailbox** A file where messages\
    \ are stored by a mailer.\n\n**mailer** A program for sending and receiving email."
  merge: -1
  img_proc: true
- pgno: 317
  md: 'than standing for itself. For example, > is a metacharacter in a shell command
    that stands for output redirection.


    **Motif** A graphical user interface created by the Open Software Foundation and
    based on the X Window System.


    **mount** Make a filesystem available to users either locally or remotely.


    **NFS** Network File System. Software that allows UNIX and many non-UNIX systems
    to share files and printers via a TCP/IP network in a way that makes them appear
    local to the user.


    **named pipe** A kind of file that behaves like a pipe and exists independently
    of any process. Many different processes can read from it and write to it.


    **newline** The character that marks the end of a line in most UNIX files. You
    can usually produce a newline at your terminal by pressing either the ENTER key
    or CTRL-J.


    **null character** The character whose binary representation is all zeros. By
    convention, it''s used to mark the end of a string.


    **option** An indicator that can be attached to a command to modify what the command
    does. Options usually begin with a dash (-). The terms option and switch are more
    or less interchangeable. An option can have several settings while a switch usually
    has two: on or off, enabled or disabled.


    **ordinary file** A text or data file with no special characteristics. The most
    common type of file in the UNIX system.


    **orphan** A process that keeps running even when its parent process has been
    killed.


    **packet** A portion of a message that''s transmitted as a unit over a network.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '**pager**  A program that breaks its input into screen-size chunks and sends
    these pieces to your terminal, waiting for confirmation after each one.


    **parameter**  A variable in the shell script that corresponds to an argument
    passed to the script.


    **parent process**  A process that generates another process.


    **parse**  To split into pieces to interpret.


    **perl**  Another programming language geared toward text manipulation.


    **permissions**  A security tool that controls who can access or change a file.


    **pipe**  A connection between two processes that passes the output of the first
    to the input of the second. Signified by the pipe (`|`) character.


    **pipeline**  A sequence of processes connected by *pipes*.


    **prime**  Another name for the accent *grave*.


    **process**  A single stream of computer instructions. One *job* may be built
    from several different *processes*.


    **.profile**  See dot (.) files.


    **prompt**  A character used by the shell to show that it’s waiting for input.
    In addition, some programs provide their own unique prompts.


    **queue**  A waiting line, the most common variety of which is the printing *queue*.


    **quote**  See **double quote, grave, single quote**.


    **real-time**  Right now as opposed to whenever the computer gets around to it.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'recursive A program or routine that repeats an action over and over. For example,
    the find program moves through a directory tree recursively, doing something in
    every directory.


    redirection Taking the output of a command and sending it somewhere other than
    the default location.


    regular expression An expression used to specify a set of strings being searched
    for. Regular expressions use metacharacters to specify variables.


    reset string A string that can be sent to a crazy mixed-up terminal to restore
    it to sanity.


    root Another name for the superuser.


    root directory The main, top-level directory of a filesystem. All the files in
    the system are either in the root directory or in a subdirectory of the root directory
    (or a subdirectory of a subdirectory and so on).


    SCO A version of UNIX made by The Santa Cruz Operation.


    sed Yet another programming language geared toward text manipulation.


    server In a distributed filesystem, a computer that supplies files and services
    to other computers.


    shell A program that reads and interprets commands from the user into instructions
    the computer can understand. Popular shells include the Bourne, Korn, and C shells.


    shell script A file that contains a list of UNIX shell commands. When you run
    a shell script, you''re telling UNIX to execute every command in the list.


    single quote The '' character. This is not the same as the grave (`). The single
    quote is used around the part of the command line where the shell should do no
    interpretation.'
  merge: -1
  img_proc: true
