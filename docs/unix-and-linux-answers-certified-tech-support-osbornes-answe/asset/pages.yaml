    password and you enter your old password incorrectly. You''ll need to invoke passwd
    and try again. |

    | sort: invalid use of command line options | Notification that you gave sort
    an option it doesn''t recognize. |

    | tar: directory checksum error | You may have specified the wrong media type
    for the floppy or tape drive, or the tape may need to be rewound. |

