- pgno: 97
  md: '# The Other Editor—emacs


    Well, there are other editors out there in the UNIX world if you just can’t stand
    the thought of vi. Personally, we think you’re making a mistake, but it’s your
    call. Of the generally available ones, the most common is certainly emacs, which
    is short for "editor macros." Unlike vi, it’s not a modal editor, but a more traditional
    editor. What you type generally goes into the file, and when you want to do something
    other than just enter text, you use a CTRL key or keys to tell emacs you want
    it to do something special. And emacs can do a lot of special things. It’s a powerful
    package, and can do all the things that vi can do and lots more, if you care to
    teach it those extra things. To extend emacs, you really need to be a lisp programmer,
    since emacs is a lisp-based program. But don’t let that frighten you. You can
    make a very good start indeed by just borrowing some of the things your friends
    have done, and tweaking them for yourself. Plus, some things, like building macros
    and abbreviations, are already there and ready to go. So, if you want to give
    emacs a try, and you don’t have a copy on your system, ask your system administrator
    to see about getting a copy. There are also other editors to be found, and many
    of them are available for the price of a download. In addition, there are now
    commercial, graphical-based editors for those of you running under XWindows. These
    are generally friendly and easy to use. But you won’t find many, if any, that
    are as powerful as either vi or emacs. The current version of gnu emacs has a
    graphical mode that even supports rodents, for those who simply can’t live without
    a mouse. To each his own. We’ll stick with our old standby, vi, however. Especially
    since it’s almost always available, and we even have versions running happily
    in Windows 95 and Windows NT for those times we’re stuck working on a regular
    PC.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_97_0.png)


    # What happens if my system crashes before I’ve written my changes?


    Quick! Use the recover command. If you end up exiting from vi because something
    causes your system to crash, you can almost always recover what you were working
    on by using the special vi -r filename command. Then save the file back out, just
    in case.'
  merge: -1
  img_proc: true
