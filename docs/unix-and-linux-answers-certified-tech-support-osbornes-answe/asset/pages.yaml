    \ to make your keyboard behave as you'd like it to. Under Linux, you can customize\
    \ your keyboard to suit your tastes.\n+   - One crucial difference between commercial\
    \ versions of UNIX and Linux is **password security**. If you need to add security\
    \ measures to your Linux system, here's how.\n+   - The availability of popular\
    \ **shells** determines how you'll interact with Linux. Luckily, a full range\
    \ of shells is available on most Linux systems, so no matter which shell is your\
    \ shell of choice, your needs can be accommodated.\n+   - **Text editors** are\
    \ another important tool for any UNIX user. Although plain old **vi** isn't a\
    \ part of most Linux distributions, Linux provides enough alternatives to satisfy\
    \ almost anyone.\n+   - Even though it's available at little or no cost, Linux\
    \ even comes with an **X Windows** system. We'll tell you what you'll need to\
    \ know to customize your Linux X.\n+   - Finally, there are the **other Linux\
    \ tools**. Some of these may be familiar to you if you've used commercial UNIX\
    \ systems, others not, so take a look and see what's available.\n\n> *Note:* Back\
    \ in the \"bad old days,\" it was nearly unheard of to have your very own private\
    \ UNIX system. The cost of the hardware and the operating system were prohibitive\
    \ and the power of UNIX was only available via time-share systems.\n> \n> Thanks\
    \ to the concerted efforts of a large group of programmers on the Internet, however,\
    \ several variations of UNIX have been made available on cheaper, more accessible\
    \ hardware. These versions of UNIX are just as powerful, just as useful, and just\
    \ as marvelous as the big name commercial versions and they can be had for a fraction\
