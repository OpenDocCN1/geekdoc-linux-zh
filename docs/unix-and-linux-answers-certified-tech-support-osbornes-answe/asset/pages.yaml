    # Is there a command I can use to return quickly to my home directory?


    Yes; try `cd` all by itself. This little trick will get you back to your home
    directory quickly, no matter how far away you have managed to stray.


    # Can I use ~ as a shortcut to my home directory?


    Yes. When you want to describe a directory or file that can be found below your
    home directory, save yourself some typing by using `~` as a shorthand for your
    home directory. For example, to get to your personal **bin** directory from anywhere,
    type `cd ~/bin`.


    # Can I use ~ as a shortcut to someone else’s home directory?


    Yes. When you want to describe a directory or file that can be found below someone
    else’s home directory, save yourself some typing and figuring out exactly where
    their home directory is by using `~` plus their user name as a shortcut to their
    home directory. For example, if you know that Gladys Meep has a useful set of
    utilities stashed in her home **bin** directory, you could get to it, assuming
    she has her permissions set to allow this, by typing `cd ~gmeep/bin`.'
