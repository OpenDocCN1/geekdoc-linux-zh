    # awk, perl, and sed @ a Glance


    In addition to a full-service toolbox, UNIX offers three programming languages
    intended to help you expand your toolbox to suit your particular needs. awk is
    a pattern-matching language that can be used for simple tasks or for complex text
    manipulations.


    perl is another pattern-matching language that may suit some of you better than
    awk, but this depends on your needs and inclinations.


    Finally, sed is a command-line, streaming editor that lets you feed a text file
    through it so that you can change a file entirely from within a script.'
