  md: '# Figure 7-4 Using the sleep command as a hedge against disaster


    along with the time it is to be executed. Understand that all commands executed
    by the at command will be executed using the Bourne shell, not the C shell or
    Korn shell, so don''t depend on any specific features of these more versatile
    shells. The at command will understand all of the following time parameters, as
    well as lots of others.


    +   - at 10:15am—at 10:15 a.m. today (tomorrow if it is already after 10:15 a.m.)

    +   - at 1120pm Jun 17—at 11:20 p.m., on June 17th

    +   - at 1 am Sunday—at 1:00 a.m. next Sunday morning

    +   - at 18:00 Monday next week—at 6:00 p.m., next Monday

    +   - at now +2 hours—two hours from now


    As you can see, this is pretty flexible. The syntax for running a backup routine
    of the /users filesystem to the DAT tape drive at 1:00 a.m. tomorrow morning would
    be


    ```

    at 0100 tomorrow < backup.users

    ```


    where backup.users contained the single line:


    ```

    tar -cvf /dev/dat /users > /tmp/backup.users.log

    ```


    which includes the tar command with the necessary options to write a new archive
    out to the DAT drive and keep a record of all the messages in a log file for later
    perusal.


    # Can I use cron to automate tasks, and if so, how?


    If your system administrator has given you permission, you may create a crontab.
    This is a file that describes one or more actions that you want to occur on a
    regular basis.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'It''s handy to know that you can use crontab to automatically run programs
    repeatedly. You can schedule jobs to run once a month, every night, or every Friday.
    There are lots of possibilities. The crontab file consists of six fields:


    +   - minute a number from 0–59 indicating the minute the command will be run

    +   - hour a number from 0–23 indicating the hour for the command to be run

    +   - day of month a number from 1–31 indicating the day of the month to run the
    command

    +   - month a number from 1–12 indicating the month to run the command

    +   - day of week a number from 0–6 (Sunday to Saturday) for the command to be
    run

    +   - the command line to be run


    Fields that contain an asterisk (*) mean all possible values for that field. So,
    for example, to run a backup of your home directory to the floppy drive every
    night at 1:15 a.m., you might have the following as a crontab:


    ```

    15 1 * * * /usr/bin/tar uvf /dev/rfd0 $HOME > /tmp/$LOGNAME.bak.log 2>&1

    ```


    One thing to note about this command is that we were careful to direct the output
    from the command to a log file, and we also made sure that any error messages
    went there as well. Otherwise, the output from the command will be sent to the
    console, which could cause other problems. Also, like the at command, all crontab
    jobs are executed using the default Bourne shell. Your crontab file is in /usr/spool/cron/crontabs/username.
    But you should first create the file in your home directory, and then submit it
    to the cron process with


    ```

    crontab cronfile

    ```


    which will overwrite any existing crontab file with the new one.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Warning: Always make a copy of your old crontab file before you submit a new
    one. We find it''s distressingly easy to forget that any new crontab will overwrite
    your old one. So, we have a little script that first saves a copy of the existing
    crontab and then submits the new one. That way, we automatically make a copy and
    submit the new one. The relevant lines from the script are:


    ```

    cd $HOME

    crontab -l > oldcron.$(date +%m%d%H%M)

    crontab new.cron

    ```


    This saves a copy of the old crontab in a time- and datestamped file, and then
    submits the new cronfile which we always keep in new.cron. This makes it easy
    to keep a copy of your old crontab files.


    Tip: Use crontab -l to see your current automatically scheduled jobs. The -l switch
    to the crontab command is short for "list", and it tells you what work you have
    scheduled for the cron process to handle.'
  merge: -1
  img_proc: true
