- pgno: 260
  md: 'typing something, you quite probably don''t want what you type to be sent to
    every window that you have open. That would be pretty confusing. Instead, the
    window manager selects one window that receives your input. The most common configuration
    aspects around focus are:


    | Click to type | You select the active window by clicking on the frame or title
    bar. |

    | Point to type | You select the active window by moving your mouse cursor into
    it. |

    | Autorise | Determines whether the active window automatically comes to the top
    of any overlapping windows. |


    Some window managers, such as Microsoft Windows, allow only one method of focus
    control. These usually default to "Click to type" and are probably what you''re
    most familiar with. These window managers usually also have Autorise set to true,
    so that when you click on the window it comes to the top of the stack.


    Other window managers, such as FVWM, give you more control over your destiny and
    allow you to choose which method you want to run with. If you don''t put any configuration
    settings into your .fvwmrc, FVWM will default to "Point to focus, no Autorise"
    which is, in our opinion, the only acceptable way to run. However, if you add
    the following settings (and restart FVWM) to your configuration file, you can
    adjust it to suit your personal preferences:


    ```

    AutoRaise 750

    ClickToFocus

    ```


    This sets your windows to autorise 750 milliseconds after they receive the input
    focus. It also sets it so that you have to click on part of the window (the frame
    or the title bar or the corner widgets) in order to make the window active.


    Probably the surest way to irritate an experienced UNIX person, and the most irritating
    way to configure your window manager, is to have PointToFocus active and AutoRaise
    set to a ridiculously small value. This will result in windows popping to the
    top every time you move your mouse cursor around. Since this is UNIX, after all,
    you are quite able to'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'shoot yourself in the foot and set things up this way if you so choose.


    # Can I make FVWM look like the motif window manager mwm?


    Yes and no. You can make FVWM look a lot like mwm and you can even make it behave
    somewhat like it. You can also cause FVWM to obey some mwm stylistic guidelines
    and decoration hints. Add the following lines to your configuration file and,
    as always, restart your window manager:


    ```

    MWMFunctionHints

    MWMHintOverride

    MWMDecorHints

    MWMMenus

    MWMBorders

    MWMButtons

    ```


    We’ve now set everything up to emulate the basic look of Motif. However, by default
    Motif has really wide borders. We find these quite ugly, so we trim our border
    sizes down with the following entry:


    ```

    NoBoundaryWidth 0

    BoundaryWidth 5

    ```


    The first entry defines boundary width, in pixels, for windows that have no title
    bar and no borders. This defaults to 1 pixel. We set it to 0. The second entry
    is the width, in pixels, of the boundaries for the rest of the frames. The default
    mwm boundary width is 10 pixels, which are great big crayon-style borders. Ugly
    ugly ugly.


    # How do I change the colors in FVWM?


    Colors are also highly customizable, and any color configurations should appear
    first in your configuration file, before anything else. You can set the colors
    of the active window frames, inactive window frames, and popup menu colors with
    the following entries:


    ```

    StdForeColor      Black

    StdBackColor      LightSkyBlue

    ```'
  merge: -1
  img_proc: true
- pgno: 262
  md: '```

    HiForeColor      Black

    HiBackColor      DarkTurquoise

    MenuForeColor    Yellow

    MenuBackColor    Navy

    ```


    Std color settings refer to the foreground (text) and background (window elements)
    of a window when it''s not active. Hi settings are for when they are active. Menu
    color settings refer to the colors of the popup windows.


    # What other useful settings should I know about for FVWM?


    Other settings you might want to take a look at are the ones that control how
    new windows are placed and where windows go when they are iconified, how windows
    react when you resize them, and what happens when you move your cursor to the
    edge of the screen. Try out the following settings:


    ```

    EdgeScroll 0 0

    StubbornIconPlacement

    RandomPlacement

    SmartPlacement

    StubbornPlacement

    OpaqueMove 100

    OpaqueResize 100

    ```


    EdgeScroll basically says "Don''t do anything when my cursor hits the edge of
    the screen." If you''re not using FVWM''s virtual screen handling, it can be disconcerting
    (and annoying) to have it switch workspaces on you when you bump the edge of the
    screen with the mouse cursor. The placement directives basically tell FVWM to
    automatically place new windows when they are created and try to find a good place
    for them (i.e., not on top of other windows if at all possible) and to leave icons
    where you put them instead of arranging them for you. Finally, the Opaque directives
    tell FVWM how to display windows when you move or resize them. The number refers
    to a percentage of the total screen area, with 100 obviously meaning the entire
    screen. Anything that is below this percentage of the total screen area will be
    "simplified" when you either move or resize the window, and'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'will only be displayed as a stylized frame of the correct dimensions. Anything
    at or above the percentage will be displayed as the actual frame with all the
    window contents intact. Set this to a small value if you have a slow graphics
    system, and leave it set to 100 if you have a reasonably fast one.


    There are many additional configuration possibilities that you can explore. Read
    the documentation, explore the man pages, and have fun customizing. Figure 14-1
    is an example of a customized FVWM window display after some basic customizations
    have been accomplished.


    # Are there any other window managers for Linux?


    There are several other good window managers available for Linux, and some of
    them are probably already installed on your system. These include, but are not
    limited to, choices such as twm, olwm, bowman, or afterstep. In addition,


