- pgno: 233
  md: '# STRING OPERATORS


    What’s an example of a string operation that the Korn shell does especially well?


    Concatenation. To concatenate two strings in UNIX, simply stick them together
    without intervening white space. If you need to include white space, enclosing
    the whole thing in quotes gets around the problem. This is shown in Figure 13-1,
    where we made up some examples for demonstration purposes.


    Most of the time, we refer to a string variable that we have created with a simple
    "$strvar" where the strvar is the variable. But this is actually a specific case
    of the more general syntax of "${strvar}," which works in all cases. So, for example,
    you can get away with referencing the ninth positional parameter you pass into
    your script with a $9 and all is well, but you can’t get away with $10. To reference
    the tenth (and later) positional parameter, you need to be more formal by using
    the ${10} syntax.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_233_0.png)


    Figure 13-1 Concatenating strings in the Korn shell'
