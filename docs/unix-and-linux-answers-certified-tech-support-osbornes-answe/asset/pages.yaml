- pgno: 134
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_134_0.png)


    **Figure 7-2** Use a shell script to call your editor and change the permissions
    all in a single step


    You would think that this is a comment, since it starts with the # character,
    but what it really does is tell whatever script is executing the file to execute
    `/bin/ksh` (the Korn shell) and feed it the rest of the file. We''ll use this
    trick later in Chapter 15 when programming with perl in order to actually have
    perl do the executing instead of a shell.


    # ❓ How can I reissue commands?


    Use the history list. One of the most useful features that the C shell added to
    UNIX was the ability to reuse a command rather than have to retype it. The Korn
    shell takes this even further. You can not only reuse your commands, but edit
    them with your favorite editor, right there on the command line. To reuse the
    most recent command that started with the letter "v", for example, use `r v`,
    which will recycle the last command you issued that begins with v. So if you are
    editing a file, then executing it to see how it fits the way you want it, and
    then going back in to try again, this trick makes it easy to cycle back and forth
    between the two commands. The more you include of the command, the more precise
    the match. For example, if your last four commands had been


    ```

    vi .kshrc

    . .kshrc

    vi .exrc

    vi notes

    ```


    then `r v` would recall the `vi notes` command, while `r vi .` would recall the
    `vi .exrc` command, and `r vi .k` would recall the `vi .kshrc` command.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# What''s the easiest way to cycle through and edit my previous commands?


    If you''re using the Korn shell and include the following in your profile, you
    can actually use vi to edit your commands right at the command line, cycling through
    them and then modifying them as needed.


    ```

    EDITOR=vi ; export EDITOR

    ```


    This, plus the presence of a ~/.sh_history file, tells the Korn shell to use the
    familiar vi editor commands to let you edit your command lines before you issue
    them. Just press the ESC key to enter vi mode, and then use the familiar cursor
    movement keys, "j", "k", "l", and "h" to move through the commands. Press the
    "k" to move up one line to the previous command, "j" to go down, and so forth.
    Once you find the command you want, just hit the ENTER key to reissue it, or use
    the familiar editor keys to modify it. This is harder to explain than it is to
    do. Just try it. This feature alone is reason enough to switch from the C shell
    to the Korn shell.


    # Can I edit my previous commands even if I''m a confirmed emacs user?


    Yes; don''t despair. You don''t have to know vi commands to use command line editing
    in the Korn shell. Just add this line to your .profile file, and you can now use
    your emacs keys to move through your command history and edit the commands.


    ```

    VISUAL=emacs ; export VISUAL

    ```


    Why the difference between the environment variables we set for the two modes?
    Actually, either one will work. Some sources seem to prefer setting EDITOR, while
    others seem to prefer setting VISUAL. But both appear to work the same. The one
    thing we wouldn''t recommend, however, is setting them to different values. If
    you do, VISUAL will win.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Piping and I/O Redirection


    Redirection and piping in UNIX are analogous to plumbing, in the sense that what’s
    important is controlling a flow, making sure data goes where you want it to be.
    You can redirect the input so that instead of coming from the keyboard it comes
    from a file, or you can redirect the output so that instead of going to your monitor
    it goes into a file. And finally, you can take the output from one program and
    feed (pipe) it into another program.


    Probably the first kind of redirection we all learn to do is **output** redirection.
    That means getting all that stuff that we usually don’t want to see off the screen
    and into a file where we can find it if we need it but otherwise not be bothered.
    To redirect the output from a program to a file, use the greater than symbol,
    ">". For example, to sort a file of names:


    ```

    sort names > names.sorted

    ```


    The second kind of redirection is **input** redirection. This uses the less than
    symbol, "<". With this, instead of a program getting its input from the keyboard,
    it gets it from a file. So, for example, to mail a file that includes the text
    of a new proposal to Dale in Engineering, you’d use the command


    ```

    mail dale < proposal.txt

    ```


    The third and most important kind of redirection is **piping**. This uses the
    bar or pipe symbol, "|". A pipe takes the output of one program and feeds it into
    another program. Suppose, for example, you just got a really cool game from your
    favorite ftp site on the Internet. To expand it and un-tar it, all in one operation
    (more about tar format in Chapter 12, use the following code:


    ```

    cat newgame.taz | zcat | tar xvf -

    ```


    Piping is central to the way much of UNIX works. Because it was originally designed
    to run on very small machines with limited memory, UNIX is made up of literally
    hundreds of little programs. Each one doesn’t do much by itself, but they’re all
    designed to work together in the UNIX repertoire to create a powerful command
    set.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# MULTITASKING


    # Running Multiple Programs in UNIX


    Unlike DOS and Windows, UNIX is by its very nature a multitasking operating system,
    so you can take advantage of that multitasking to run multiple programs or jobs.
    If you are running the X Windows System, this is as simple as opening up another
    window and starting up the second program. But even on a simple character-based
    terminal you can take advantage of multitasking in most implementations of UNIX.
    At the very least, you should be able to send a job to the background to let it
    run while you start something else.


    # How can I send a job to the background?


    Use the & following a program''s command line. Some jobs, like long find operations
    or program compilations, tend to take a while and don''t really require any input
    from you. Send these jobs into the background by putting an ampersand (&) after
    the command line. This gives you your prompt right back while the job you have
    spawned goes on about its business. Figure 7-3 shows a simple example that a system
    administrator might run periodically to clean up some large files that were taking
    up disk space.


    # Is there a command I can use to check on my background jobs?


    Try jobs. As you can see in Figure 7-3, the jobs command will tell you what the
    status of your background job is. If the job has finished, you will see the job
    number and a "Done" after it. The other possibilities are "Running" and "Stopped".
    What about the "+" we see there? That indicates that this job was the most recently
    invoked job that is in the background. The next most recently invoked would be
    shown with a "-".'
  merge: -1
  img_proc: true
- pgno: 138
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_138_0.png)


    Figure 7-3 Use the & operator to move big jobs into the background


    # Can I bring a background job back into the foreground?


    Yes, with the fg command. This command will bring the most recently invoked job
    back into the foreground. If the job has been stopped (suspended) for some reason,
    it will restart when it comes into the foreground. If you have several jobs running
    in the background and you need to bring one to the foreground and it''s not the
    most recent, use one of the ways in Table 7-1 to refer to the job. Thus, to bring
    the grep operation you started several jobs ago back to the foreground, use


    ```

    fg %grep

    ```


    This will bring the grep job into the foreground. From there you can send it back
    into the background, suspend (stop) it, interrupt (kill) it, or simply wait for
    it to finish.


    | Reference | Background Job Referenced |

    |---|---|

    | %n | The job whose number is n |

    | %string | The most recent job whose command line begins with string |

    | %?string | The most recent job whose command line contains string |

    | %+ | The most recent job |

    | %- | The second most recent job |

    | % | The second most recent job |


    Table 7-1 Ways to Reference a Background Job'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Is there another way to send a job to the background?


    Yes, with the bg command. Suppose you started a search for the changes in your
    doctoral thesis and you discover that it''s going to take a lot longer than you
    expected. Fortunately, you had it set for all the output of the diff command to
    go into a log file, so just suspend the job and send it into the background. The
    usual command to suspend a job is CTRL-Z unless you have changed it with stty.
    So, simply press CTRL-Z and type bg, and the job will go into the background and
    restart. If you want to see how it''s going, you can just tail the log file.


    # Warning:


    > Don''t send a job into the background that needs input from you or that will
    send lots of output to the screen. If a job is in the background and it needs
    some input from you, it will just sit there waiting. Not quite what you had in
    mind, one suspects. And if the job will produce a lot of messages that would normally
    go on your screen, unless you send these messages to some sort of log file, they
    will all end up on the screen anyway, right in the middle of what you''re trying
    to do. Again, probably an annoyance at most. The best way to handle this is to
    redirect the output to a log file, with any errors sent to a separate error file.
    Here''s an example of how to do that:


    ```

    diff thesis thesis.edited > /tmp/edit.log 2> /tmp/edit.err &

    ```


    Now the command will run in the background and not bother you with output you
    aren''t ready to deal with anyway. The 2> means to send standard errors to the
    file we have pointed to, in this case /tmp/edit.err.


    # Can I use redirection to send both normal program output and error messages
    to a file?


    Yes. In fact, if you want to send them to the same file, you use a special combination.
    A typical example of this might be when running a backup or a long compilation.
    You aren''t bothered with the output from it while you are doing other'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'things, but when the compile or backup is done, you can quickly check to see
    where any problems were. Here we use a special way of describing the pipe of standard
    error.


    ```

    make > /tmp/make.log 2>&1 &

    ```


    This uses redirection to send normal messages from our **make** to a log file
    and any error messages will go to the same place. Here, **2>&1** means "take standard
    error and redirect it to standard output." But since we have already told standard
    output to go to a log file, both will go there.


    # What can the tee command do for me?


    Use **tee** to send output to both a log file and the screen. This lets you start
    a process, like a backup, where you want to be able to see if anything untoward
    happens but store all the messages from the command in a log file as well. This
    is particularly useful on a windowed system where you can continue to work and
    yet keep your eye on what''s happening.


    ```

    make 2>&1 | tee /tmp/make.log &

    ```


    Now when your **make** hits a snag, you''ll have the pleasure of watching all
    those lovely warning messages scroll by on the screen and you''ll know they''re
    saved to a log file. Later you can stare solemnly at them and pretend you actually
    know what they mean before you go twiddle with the **makefile** and try again.


    > **Warning:** Don''t use **nice** on a foreground job. If your system gets bogged
    down anyway and you have given your foreground job a **nice** command, you may
    not be able get its attention long enough to suspend or kill it. You''ll essentially
    be locked out until the job finishes.


    # SCHEDULING JOBS


    # How can I put a job to sleep?


    The simplest of the time-related commands is **sleep**. This command does just
    what its name implies—it puts commands or script files to sleep for the number
    of seconds'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Setting Priorities


    When you work in a multitasking and multiuser environment, you can easily bring
    the entire system to a virtual halt by starting a job (or two) that''s very memory
    and processor demanding. Even if you''re the only person on the system, starting
    a big compile job in the background may slow your foreground task to an unacceptable
    pace. UNIX, naturally, has a solution. The nice command decreases the command''s
    priority by increasing its niceness. Unfortunately, this particular command is
    different in virtually every version of UNIX, and even different depending on
    which shell you are using. But the general effect is the same—you can reduce the
    amount of CPU time that a particular process requires by starting it with nice.
    So, for specific details of how your version is implemented, check the man pages
    for nice.


    ```

    man nice

    ```


    Note that you can make a command be nicer, but, unless you are the superuser,
    you generally can''t make a command have a higher priority (in other words, be
    less nice) than it would normally have. Also, it doesn''t generally make sense
    to reduce the priority of jobs that are essentially I/O bound, since these jobs
    don''t require much of the processor''s resources anyway.


    you specify. Why would you want to do this? Well, it can be useful to display
    a message on the screen in the midst of a shell script, for example, leaving it
    there long enough for you to see it. A good example of this is when you are going
    to do something irrevocable, like delete a file or set of files, and you want
    to give yourself a chance to back out if things don''t look right; if you don''t
    interrupt the process it will go through automatically. In this case, what you
    do is print or echo the command that is about to be executed to the screen and
    then let the script sleep for five or ten seconds. If things don''t look right,
    you can break out of the script and fix it before it''s too late. Or, if you need
    to fire off several processes, each of which grabs lots of resources when it first
    starts, but which then settles down, you can use sleep in the script that starts
    them to space them out a bit.'
  merge: -1
  img_proc: true
