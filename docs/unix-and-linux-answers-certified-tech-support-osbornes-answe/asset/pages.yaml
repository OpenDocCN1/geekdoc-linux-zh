    # Files and Directories @ a Glance


    UNIX files and filenames require some explanation, particularly for anyone who
    has never worked in a UNIX environment before. In order to work efficiently with
    UNIX, it’s helpful to know how long UNIX filenames can be, what characters they
    can contain, and what the characteristics of a good filename are. You should know
    how to unhide hidden files, how to determine a file’s type, and above all, the
    importance of case-sensitivity in the UNIX world.


    Characters in UNIX sometimes seem to take on a life of their own. You’ll want
    to know how to deal with embedded spaces and weird characters in filenames, and
    how a shell script can save you a lot of time by automating the renaming of multiple
    files.


    Another UNIX time-saver is wildcards. Using multiple wildcards within a single
    command or using a wildcard set description to make the command line more intelligent
    will increase your productivity.


    It’s crucial to understand UNIX file permissions and protection if you’re working
    in the UNIX world, since the way a file’s permissions are set determines who may
    have what kind of access to that file. Especially if you’re sharing a file or
    directory with a group of people, there are some timesaving tips that can save
    you considerable frustration.


    You don’t have to comprehend every facet of UNIX filesystems and directory structures
    unless you’re the system administrator, but you’ll be better off if you grasp
    at least a few basic concepts and if you know what’s in your home directory and
    how to keep it lean and mean.'
