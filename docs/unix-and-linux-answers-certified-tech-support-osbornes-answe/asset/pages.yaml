- pgno: 46
  md: 'account has a unique password associated with it. Your password is the most
    important protection you have against inadvertent or deliberate mischief that
    could cause you to lose files, or worse. Don’t give your password to anyone, don’t
    write it on your terminal or desk, and don’t use anything obvious.


    Of course by now you’ve heard all this before, but you should protect your password
    at least as well as you would your VISA card. An unscrupulous person who learns
    your password can cause you an incredible amount of grief.


    Tip: If you really need to write down your password, use some common sense. Don’t
    put it anywhere near your terminal or on your desk. Keep it in your wallet. Write
    it down somewhere you can find it, but where it won’t mean anything to someone
    who gets hold of it. And don’t write the name of the computer or your login name
    in the same place as the password.


    # What are some examples of bad passwords?


    Bad passwords are anything that could easily be guessed, such as the following:


    +   - your login name

    +   - your name or nickname

    +   - your spouse’s, child’s, or parent’s name

    +   - your pet’s name

    +   - your license plate

    +   - your social security number

    +   - any of the above, reversed

    +   - common swear words or combinations of them

    +   - "wizard," "guru," or any similar sort of description


    # Are there rules for good passwords?


    In general, good passwords are those that can be easily remembered, but that don’t
    lend themselves to being easily guessed. They should:'
  merge: -1
