    # SHELL EMULATIONS: MAKING NT FEEL LIKE UNIX, AND UNIX FEEL LIKE NT


    # What is the "standard" UNIX shell?


    There is no standard UNIX shell. The most common alternatives are the Korn shell
    (our personal favorite), the Posix shell (the default shell on most new UNIX versions,
    and a close relative to the Korn shell), the Bourne shell (generally the lowest
    common denominator), and the C shell. There are also alternative freeware shells,
    such as the Bourne Again Shell (bash), that have gained a lot of adherents since
    they''re generally available on a wide variety of platforms including Linux. Versions
    of most of the available shells are available on whatever UNIX you find yourself
    working on, and you should choose the shell you use based on the needs of the
    environment you''re in, or the amount of scripting you expect to have to do. Interactive
    users tend to find the C shell or the Korn shell the most comfortable alternatives,
    while intense scripting should be done on the Bourne, Posix, or Korn shell, but
    should generally be written to Bourne shell limitations to prevent cross-platform
    problems.


    # How can I make NT behave like UNIX?


    There are a couple of products on the market that let you mimic the rich command-line
    power of UNIX even on Windows NT. Probably the most prevalent is the MKS ToolKit
    from Mortice-Kerns (http://www.mks.com). If you spend your time jumping back and
    forth between UNIX and Windows NT or Windows 95, we highly recommend this package.
    It''s not perfect and it has a couple of things we really, really wish it did
    better. Still, it''s a remarkably good Posix or Korn shell emulation running on
    Windows NT, and it includes all the most common UNIX command-line utilities that
    we''d be lost without. It even includes a quite'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'satisfactory port of Perl to Windows NT for adding additional functionality
    to your command line.


    # How can I make NT behave like UNIX without spending any money?


    Your options here are bit more limited. You can certainly add many of your familiar
    UNIX commands, such as ls instead of **dir**, by using **doskey** macros. But
    most of the functionality simply isn’t available without adding a third-party
    utility. Even the built-in Posix subsystem is no longer certified, and the limited
    functionality of the shell makes it difficult to completely mimic the behavior.
    If you really have to do this all the time, get a copy of the MKS ToolKit. If
    your only need is to occasionally use Windows NT, and you hate having to remember
    that your **cp** has to be typed out all the way to the **copy**, then use a series
    of **doskey** macros to do the job. Load them into a batch file you can call from
    the command line. An example that handles **cp** would look like:


    ```

    doskey cp=copy $*

    ```


    # Can I make UNIX behave like the NT command line?


    Well, yes, we suppose you can, if you really want to. Though why you would want
    to do this escapes us at the moment. But for those whose primary interface is
    the DOS, Windows 95, or Windows NT command line, and who only occasionally need
    to use the UNIX command line, we suppose it might make sense. The trick is to
    use the built-in ability of the Korn and Posix shells to create aliases that mimic
    the behavior of the Microsoft-centric command line. This is fairly straightforward
    for the simpler commands, but some are a bit trickier and may require you to write
    a shell script or two.


    The one thing you won’t be able to easily change is the direction of the "/slash"
    key. As we saw earlier in Chapter 3, UNIX uses a standard forward slash to separate
    directory levels while the Microsoft-centric operating systems,'
  merge: -1
