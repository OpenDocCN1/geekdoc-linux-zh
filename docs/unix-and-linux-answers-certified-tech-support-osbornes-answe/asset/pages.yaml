- pgno: 111
  md: '> Note: Values must be preceded by ^[ (Escape) and be separated by an "escaped"
    semicolon (\;). The sequence is terminated by an m.


    # Do I need to export single-use variables?


    No. Reduce clutter in your environment. If you''re going to use a variable only
    as a "local variable" inside a script, don''t bother to export it in the script
    and especially not in your dot-profile. Just create it in the script and use it
    there. When the script terminates, the variable will be unset once again.


    # But should I export variables that I expect to use repeatedly?


    Yes. Put them in your .profile file (.login for the C shell) and they will be
    available throughout the entire session, and in all your subshells or scripts
    or whatever.


    # Should I remove variables?


    No. They generally won''t hurt anything, but if you''re incurably fussy about
    such things, go ahead, knock yourself out! The command to remove a variable is
    unset variable.


    # How can I see the value of a variable?


    Use the print command. You can see what a variable is set to by using print "$variable".
    The echo command will also work for this, but it''s better to use print since
    echo may behave differently on different systems. Also notice that we enclosed
    the variable name in double quotes. The shell will still see the $ inside the
    double quotes and expand the variable to its value.


    # DOS Commands in UNIX


    Those of us who must constantly switch back and forth between UNIX and DOS or
    Windows machines are always having problems with the differences. The commands
    in the two operating systems are enough alike'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'that our fingers are constantly confused. The answer is to create a set of
    UNIX commands that work like their DOS equivalents, and then do the same in DOS
    (or Windows 95/NT) so that our fingers won''t get confused when we''re there,
    either. Here''s a set of useful aliases. You''ll probably find other situations
    that you want to alias. Just add them to the list, and then put them in your .kshrc
    file.


    ```

    # DOS aliases, only available from an interactive shell so we

    # don''t slow down scripts.

    case $- in

    ''*i'' # if $ - matches ''*i'', this is a shell, not a script

    alias copy=''cp''

    alias move=''mv''

    alias rd=''rmdir''

    alias deltree=''rm -r''

    alias cls=''clear''

    alias dir=''ls -l''

    alias type=''cat''


    esac

    !!

    ```


    We have a similar set I use from within Windows NT and Windows 95 to handle that
    side of the problem. Create a file called unix.bat and stick it somewhere in your
    path. Then call the file from within your autoexec.bat file. Here''s my set of
    UNIX in DOS commands


    ```

    REM Only need to load DOSKEY inside here if you aren''t using

    REM it already. To load it from within here, UNREM the next

    REM line. Note the fairly large buffer size. You may need it.

    REM doskey /bufsize=2048

    doskey mv=move $*

    doskey cp=copy $*

    doskey ll=dir $* /p

    doskey pwd=cd

    doskey more=type $1 $b more

    doskey cat=type $*

    doskey man=help $1

    doskey rm=del $*

    doskey env=set | more

    doskey grep=find $*

    ```


    Finally, you may find that the single most annoying difference between the two
    environments is the difference in text editors.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Tip: If you have to work in DOS or Windows much, you''ll miss your vi. There
    are good replacements that run in the DOS world, however. One is Oak Hill Vi,
    from Oak Hill Software, Inc. in Scottsdale, AZ. The MKS Toolkit has an excellent
    vi and a graphical vi for windows as well as a complete replacement for DOS''
    (and Windows 95''s) COMMAND.COM (or Windows NT''s CMD.EXE) shell that looks very
    much like UNIX. As we discuss in Chapter 11, a copy of the MKS Toolkit can make
    all the difference for those who have to live in both the UNIX and NT environments.


    # Shell Script Shortcuts


    The more you use UNIX, the more you''ll find yourself writing shell scripts. Most
    will be short little things that serve a simple purpose. Some may be long, complicated
    scripts that have all sorts of error checking in them. But whatever scripts you
    write, there are certain things they should have in common. Probably the easiest
    to forget, but the most important, is to always document your scripts. Yeah, right.
    Everyone always says that. But we really mean it. In fact, let''s repeat it for
    emphasis.


    +   Always document your shell scripts. No matter how simple they are, it costs
    almost nothing to insert a simple little header in them that includes key information
    like the name of the file, the date it was created, and the task it was supposed
    to perform. Sure, you know what it does now. But you won''t remember in two weeks,
    much less two years.


    +   Make a standard header file for every script. Every script should have a header
    that you automatically include in each and every shell script that will be around
    long enough to get out of your ~/tmp directory. You can include whatever you want
    in yours, but we strongly recommend that you add comments throughout the script
    as well. You''ll thank yourself later.


    +   Let the system create unique filenames for you. If you run a script every
    day—for example, a backup of a set of important files onto a different filesystem—let
    UNIX do some of the work for you. If you'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'need a filename generated every day, let the date command do the work for you.
    The following illustration shows a script that runs every day to make an export
    of a critical database. We use the date command to generate a filename. This makes
    it easy to keep track of which file is the most current, and at the same time
    lets us take this entire command and stick it into a crontab to make it happen
    automatically. For more on crontabs and running jobs automatically at specified
    times, see Chapter 7.


    ```

    # Filename: db_exp.ksh

    # Author: Charlie Russel

    # Description: Script to create an automatic export of the database.

    # Last Modification: 8/15/97-Modified to compress file on creation - cpr

    # Prev. Modification: Added absolute path to exp - 7/14/97


    //scripts/oracle_setup DUMMY

    # Run Script

    print "\n"

    print "Executing script db_exp.ksh"

    ORACLE_SID=... export ORACLE_SID

    file="/safety/`date +%Y%m%d`.dmp" # Create unique filename with today''s date

    # Put command into variable

    oracmd="/oracle/bin/exp system/ricpw file=$file grants=y indexes=y full=y"

    print "Executing command..."

    print "$oracmd"

    oracmd

    # Execute the compression on the created file to reduce space.

    # This could simply be piped from the export, but is separate for historical reasons.

    compress $file

    exit

    ```


    If you only need a file as a temporary storage place, let the system do the work.
    Let UNIX worry about cleaning up after you and keeping track of the filename.
    Some commands need a file as an intermediate storage spot, so use UNIX''s built-in
    functions to create and delete the temporary filename. The mktemp command exists
    in many implementations of UNIX, but if it doesn''t exist in yours, you can let
    the shell generate a name. If mktemp exists, try this:


    filename=`mktemp`


    Then, when the script is finished, just add a final line to clean up after yourself:


    rm $filename'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'If your version of UNIX doesn''t support mktemp, use the built-in functionality
    of the shell to do the work:


    `filename= "/tmp/$LOGNAME.$SECONDS"`


    This will generate a filename based on your login name, and the number of seconds
    since you started this shell. Just remember to remove the file when you''re done
    with it. Otherwise, your system administrator is likely to become grumpy about
    cleaning up after you.'
  merge: -1
