- pgno: 69
  md: 'however, that it had a filename with "Aug" in the name somewhere. No problem.
    Just use the command


    ```

    find ~/ -name "*Aug*" -print

    ```


    In other words, find all the files with "Aug" in their name, starting from the
    top of the home directory tree, and print the result out to the screen. Note the
    use of quotes around the name. This prevents the shell from interpreting the wildcards
    before find has a chance to. This is the most basic of find commands, and all
    other find commands come from this one.


    # Can I find a file even if I don’t know whether its name begins with an upper-
    or lowercase letter?


    If you aren’t sure whether the above-mentioned report was "Aug" or "aug", you
    can easily add a second argument to the operator portion of the above command:


    ```

    find ~/ -name "*Aug*" -o -name "*aug*" -print

    ```


    In this expression, we’ve used the "-o", which says use a logical OR to do the
    search. Any file with either "Aug" OR "aug" in the name will satisfy the condition.


    You could also use regular expression matching to perform the above search in
    a way that’s a bit cleaner:


    ```

    find ~/ -name "*[Aa]ug*" -print

    ```


    Here we’ve said to find all files whose names include the string "ug" preceded
    by either an "A" or "a"—the [Aa] syntax says either letter will satisfy the regular
    expression.


    # Why does find keep complaining about a missing conjunction?


    One of the problems with find is that it tries to expand the entire command line
    to figure out what you want. But you need to hide special characters ("metacharacters")
    from the find command until it’s ready for them. So we either enclose the special
    characters quotes or use the backslash character to escape the meaning of the
    next character. Thus:


    ```

    find ~/ -name [Aa]ug* -print

    ```'
  merge: -1
  img_proc: true
