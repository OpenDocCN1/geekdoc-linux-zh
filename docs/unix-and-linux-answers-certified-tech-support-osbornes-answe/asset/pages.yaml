  md: '# make [options] [targets] [macro definitions]


    # OBJECTIVE:


    Updates one or more targets according to dependency instructions in a description
    file in the current directory. This file is called makefile or Makefile by default.
    Options, targets, and macro definitions can appear in any order. Macros definitions
    are typed as `name=string`.


    # OPTIONS AND VARIABLES


    +   - `-e` — Overrides *makefile* assignments with environment variables.

    +   - `-f makefile` — Use *makefile* as the description file.

    +   - `-i` — Ignores command error codes.

    +   - `-n` — Prints commands but doesn’t execute.

    +   - `-p` — Prints macro definitions and target description.

    +   - `-q` — Query. Returns 0 if the file is up-to-date, nonzero otherwise.

    +   - `-r` — Don’t use default rules.

    +   - `-s` — Don’t display command lines.

    +   - `-t` — Touch the target files. Causes them to be updated.


    # man [options] [section] [title]


    # OBJECTIVE:


    Displays information from the online reference manuals.


    # OPTIONS AND VARIABLES


    +   - `-a` — Shows all pages matching *title*.

    +   - `-b` — Leave blank lines in output.

    +   - `--dir` — Specifies the directory *dir* to be added to the search path for
    entries.'
  merge: -1
  img_proc: true
