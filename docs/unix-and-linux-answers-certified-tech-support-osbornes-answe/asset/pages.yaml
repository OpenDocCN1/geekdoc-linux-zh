  md: 'form of flow control. The Korn shell is no exception. It provides the following
    structures:


    +   - if/then/else

    +   - for

    +   - while

    +   - until

    +   - case

    +   - select


    This is an adequate selection of flow control statements, but unfortunately the
    syntax is not exactly user-friendly. You''ll probably find that it takes a certain
    amount of trial and error to get it all right.


    # What''s tricky about using if/then/else statements in the Korn shell?


    These structures are the most basic and most commonly used form of flow control
    in a program. First you ask if something is true, and if it is, you do something.
    If it isn''t, you may do something else, or you may just do nothing. The basic
    syntax is


    ```

    if condition

    then

    statements

    [elif condition2

    then statements]

    [else

    statements]

    fi

    ```


    Each if is closed by a corresponding fi and within it can contain else and elif
    (else if) tests and statements. But the key to making the whole thing work is
    the condition part of the construct. And here the Korn shell gives us some power.
    The condition can be a simple test of the typical Boolean kind such as these:


    ```

    if [[ $DISPLAY = "rc1:0.0" ]]

    if [[ $n == 1 ]]

    if [[ $y >= 17 ]]

    ```'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Or it can be the result of running a program or even a series of programs.
    In this case the result or return code of the final program will be evaluated
    for the condition. An example might be something like


    ```

    if echo $PATH | grep X11

    ```


    which will test true if the path includes "X11" anywhere in it. This could also
    be a "multiple choice test":


    ```

    if ( echo $PATH | grep interbase ) || whence gdml

    ```


    This will test to see if the path contains "interbase" or if one of its programs,
    gdml, can be found. If either is true, then the condition will be true.


    # Can you show me how to use for loops in the Korn shell?


    The for construct lets you perform an operation a fixed number of times. This
    is useful when you need to perform an operation on a group of items, such as a
    list of filenames. This is a bit different from how a C or Pascal programmer might
    expect a for loop to behave. In that case, the syntax might be something like:
    for i=1 to 10 do. Here we''re passing a list of items to a variable, changing
    the value of the variable each time the loop is run. The syntax for this construct
    is


    ```

    for name in [list]

    do

    statements that act on or use $name

    done

    ```


    Each time through the loop, the value of $name has a different value, as it goes
    through the items in list one at a time.


    # What do I need to know about using while and until loops in the Korn shell?


    The while loop combines a conditional test with a looping construct, and as long
    as the condition tests true, the loop will continue to run. Think about that for
