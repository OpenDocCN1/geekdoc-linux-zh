  md: '# Chapter 2  Getting a Grip on UNIX


    becoming a standard part of most newer versions. In this book, we''ll mostly be
    using the Korn shell, unless the C shell or Bourne shell is specified. The Posix
    shell, a close relative of the Korn shell, is rapidly becoming an important and
    widely available shell on many platforms. Since it behaves very much like the
    Korn shell, you should be able to use anything we suggest in this book on either.


    # How can I tell which shell I’m using?


    If your command line begins with % you''re using the C shell. The more worldly
    $ indicates the Posix, Korn, or Bourne shell.


    # How can I find out which shell is my default shell?


    From the command line, type:


    ```

    grep yourloginname /etc/passwd

    ```


    If that comes back with nothing, you are probably on a system that uses Sun’s
    Network Information Service (NIS) to manage network-wide files. If so, try this:


    ```

    ypcat passwd | grep yourloginname

    ```


    By one method or the other, you’ll see the line in the system password file that
    controls your account. It will look something like the following illustration.
    The various fields are separated by colons, with the last field showing the shell.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_45_0.png)


    The rest of the fields from the left are the login name, your password (this will
    either be encrypted or, as on Sun, show an "x" or, as on AIX, show a "*", indicating
    that the password is stored in a separate file), your userid, your group id, a
    comment field which may contain such information as your real name and phone number,
    your home directory, and finally your default shell.


    # Why does UNIX bother with passwords?


    When you login, UNIX needs a way to know that you really are who you say you are.
    So, besides your login name, your'
