    | line too long | You''re trying to input a line using cut or output a line using
    paste that''s longer than 511 characters. |

    | ptar: directory checksum error | You may have specified the wrong media type
    for the floppy or tape drive, or the tape may need to be rewound. |

    | Read error in ... | Indicates a problem with the filesystem. Call the system
    administrator. |

    | rm: illegal option -- ? | You supplied rm with an option it doesn''t recognize.
    |

    | shutdown: not found | Means that /etc is not in your search PATH. It''s only
