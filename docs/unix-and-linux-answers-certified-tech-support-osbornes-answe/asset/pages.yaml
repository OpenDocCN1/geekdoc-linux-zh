    # SHELLS, PASSWORDS, AND HELP


    # What is a shell?


    Many users think that what they see at the bare UNIX command line is the actual
    operating system, but it''s really a command interpreter, called a shell. This
    shell is a program that sits between the user and the underlying kernel of the
    operating system. Its purpose is to protect the user from the kernel and, perhaps
    even more importantly, to protect the kernel from the user. In the MS-DOS world,
    this shell is called COMMAND.COM, which is, in turn, often surrounded by other
    shells such as DOSSHELL or the ultimate DOS shell, Microsoft Windows.


    In the UNIX world, you have a choice of shells. The oldest of the shells currently
    in use is sh and is called the Bourne shell. The Bourne shell is available on
    all UNIX systems. For the interactive user, it lacks some critical features, like
    job control, but it provides a good base for writing most shell programs.


    Until recently, the most popular shell for the interactive user was csh, the C
    shell. Originally developed at the University of California at Berkeley as part
    of their UNIX implementation, it has many features for the interactive user, including
    the ability to recall commands previously used, as well as the ability to move
    jobs from the foreground to the background and back again (job control). As the
    name implies, it has a syntax and command structure that''s modeled after the
    C programming language, making it particularly popular with programmers. Most
    versions of UNIX will have the C shell available.


    A more recent addition to the shell game, and possibly the most popular today
    is ksh, the Korn shell. Named for its creator, David Korn, this shell is fully
    compatible with the Bourne shell but adds most of the features that made the C
    shell so popular, plus some completely new goodies. One of the most important
    of these is the ability to not merely recall an old command, but to actually edit
    it. While the Korn shell is not available on some older versions of UNIX, it''s'
  merge: -1
