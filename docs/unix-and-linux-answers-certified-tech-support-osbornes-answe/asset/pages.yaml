- pgno: 222
  md: 'directories—unless someone has access to your password.

    Another good reason to keep your password safe.


    > Warning: Don''t forget to change your $HOME directory as well. It''s easy enough
    to protect your own directories, but also easy to forget to change the home directory
    itself.


    ```

    chmod 700 $HOME

    ```


    will change just your home directory so that no one can come snooping around.


    # BACKUP, BACKUP, BACKUP!


    # UNIX and Backups


    All these nice tips for ways to protect against accidentally deleting files or
    changing them when you don''t mean to are great, and we strongly encourage you
    to use some combination of them. But nothing beats a verified backup when disaster
    strikes. The person with the primary responsibility for backups is the system
    administrator, but everyone who works with computers needs to take responsibility
    for backups of his or her own critical files. This isn''t hard, it need not be
    onerous, and it can be a lifesaver.


    The beauty of UNIX is that you don''t usually have to worry about backing up programs
    or huge data files, because these are generally the domain of the system administrator.
    But you do need to think about your own local data files. The method you use will
    vary depending on the capabilities of your system, the amount of hard disk space
    available, and exactly what programs and media are available to individual users
    on your system. But most systems have enough hard disk space for you to maintain
    at least a copy of your most recent work on the hard disk, and if you have access
    and permissions, it''s fairly easy to make copies of these files onto a floppy
    disk, too. The key to making this painless is to only back up what you need to,
    and then do it often. Personally, we prefer to do backups of current working files
    about twice a day, but you will need to decide what works for you. Many users
    like to automate the process as part of their logout routine, and the C shell
    even has a special file for this purpose---.logout. But if you use the Korn shell,
    you''ll need to create your own equivalent. Before we get into the particulars
    of how to automate backups, however, let''s look at the kinds of backup you can,
    and should, do.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Why might I consider making a hard disk backup?


    The modern hard disk is remarkably safe and stable, and almost never crashes.
    Hard disks bought today have an average "Mean Time Between Failure" (MTBF) of
    100,000 to 300,000 and even 500,000 hours of continuous service, depending on
    the brand and model. That translates into 11-56 years between failures, which
    is certainly longer than you need to worry about, because computers bought today
    won''t be in service in 11—much less 56—years. They''ll be technologically obsolete
    long before then. Of course, it''s still possible to get a lemon, which is why
    the system administrator faithfully does backups. So a backup to your hard disk
    may well be sufficient for your files. This will protect you against accidental
    erasure, and the stray corruption of a critical file that may be caused by circumstances
    beyond your control.


    # What’s the easiest way to make a hard disk backup?


    Keep copies of your working files in a backup directory. This is probably the
    simplest way to handle your backup chores, and will suffice for most users. We
    call ours .backup and have the permissions set to 700 (that''s full permission
    for the owner, but no permission whatsoever for anyone else). This should be enough
    to protect you from casual (or even not-so-casual) mischief, since the only other
    person who can get into this directory is the superuser. Then we keep current
    versions of our working files in that directory. For simple chores, where you
    don''t need or want to keep different versions of your files, we have a simple
    alias we call whenever we are going to log out. It copies the files that have
    changed today into the .backup directory.


    ```

    alias savwrk=''find $HOME/* -mtime -1 -exec cp {} $HOME/.backup \;''

    ```


    This alias works pretty well, but it isn''t perfect. It won''t, for example, copy
    files or directories that start with a dot. The alternative is to add into this
    any special directories or files that you want to make sure are copied. Or write
    a script that builds a smarter directory tree.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# When should I consider making tape or floppy backups?


    Hard disk backups are nice, and they provide adequate protection for many purposes,
    especially considering that your system administrator is undoubtedly doing periodic
    complete tape backups. But there are circumstances where hard disk backups just
    aren’t appropriate. If you are doing extremely sensitive work and can’t leave
    copies of what you do on the hard disk, for example, you’ll need to take the work
    off the hard disk when you aren’t present. And if you would be totally devastated
    if you lost certain files, you probably want to do your own backups above and
    beyond what the system administrator is doing, especially if you are in an environment
    where the system-wide backups are done only weekly, for example.


    # What’s the easiest way to make a tape or floppy backup?


    The most common mechanism for backing up files to an external storage medium such
    as tape or floppy is the UNIX tar (tape archive and restore) command. This command,
    which is available on virtually all UNIX systems and can be obtained for other
    systems such as DOS, is a simple and fairly efficient way to handle most of a
    user’s backup chores. The system administrator may well have more powerful tools,
    which can easily span multiple machines and filesystems on the network, but fortunately
    you aren’t likely to need those.


    The syntax for the tar command is


    ```

    tar key files

    ```


    where key is one of the following basic actions:


    +   - c Creates a new archive

    +   - r Appends to an existing archive

    +   - t Lists the contents of the archive

    +   - u Updates the archive, adding files that aren’t present or are newer

    +   - x Extracts the files from the archive'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'and one or more of the following modifiers:


    +   - **A** Suppresses absolute filenames

    +   - **l** Gives an error message if a link can’t be resolved

    +   - **L** Follows symbolic as well as hard links

    +   - **m** Doesn’t restore modification times (everything gets current date/time)

    +   - **p** Extracts using the original permissions

    +   - **v** verbose-tar is quiet by default

    +   - **w** Waits for confirmation before each action

    +   - **f** The next argument is the device name to use


    These are the most important of the **tar** options, and they behave pretty much
    consistently across a variety of platforms. There may well be specific options
    appropriate to your particular situation or implementation of **tar**, so check
    with your system administrator if in doubt.


    The final argument for **tar** is the files to be archived. This can be specific
    files or directories, or **tar** can be part of a piped command line if the device
    is "-" for standard input or output.


    # Can I use tar to copy files to a different machine or filesystem?


    Since tar follows subdirectories, it is easy to use for transferring complete
    directory structures to a different place. If, for example, you wanted to copy
    files to a new place, keeping everything intact, you could use


    ```

    `cd sourcedir; tar cf - . | (cd targetdir; tar xf -)`

    ```


    which would copy everything from the source directory to the target directory.
    It’s important that you use the dot for the source directory here so that the
    archive is created with relative path names. Use absolute path names for **sourcedir**
    and **targetdir** to avoid copying files to the wrong location.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Can I use tar to back up my files to a floppy or tape drive?


    If you have a floppy drive in your workstation, you probably already know what
    the device file name for it is, but if in doubt, ask your system administrator
    and then write it down where you won’t lose it. One possible place is right on
    the front of the floppy drive in permanent marker. A typical device might be /dev/fd0
    for the first floppy, so the tar command to save your entire home directory and
    all the files in it would be


    ```

    tar cvf /dev/fd0 $HOME

    ```


    If you want to save the files with relative path names, not the absolute ones
    that this would give you, change to your home directory first, substitute a simple
    dot for the $HOME, and you’re in business.'
  merge: -1
  img_proc: true
