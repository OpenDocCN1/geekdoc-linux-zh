- pgno: 157
  md: '# LESS IMPRESSIVE X PROGRAMS


    # xcalc


    Along with the essential Xterm come several other useful but more limited X programs,
    and even some really useless ones. First, the X Calculator, xcalc. This is a handy
    little program that puts a calculator on your screen to let you figure out how
    you''re going to spend your future lottery winnings. Obviously, it must be able
    to handle negative numbers. Like all the included X programs, it resides in the
    /usr/bin/X11 directory. So if this isn''t on your path, you are going to want
    to put it there.


    # Can xcalc handle scientific calculations?


    Yes. The Xcalc program has two basic modes: "normal," which emulates a TI-30 calculator,
    which is fine if you like a standard algebraic mode calculator; and the -rpn command-line
    option. If you want to use the more flexible Reverse Polish Notation that HP made
    popular, add -rpn. This result is shown in Figure 8-4.


    # What can xload do for me?


    Use it to monitor your system. This little program will give you a constantly
    updating display of the amount of system resources you are utilizing. While not
    directly a measure of


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_157_0.png)


    Figure 8-4 Xcalc can emulate an HP-10 calculator'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'CPU usage, once you get used to evaluating it you can get a pretty good idea
    of exactly how loaded down your system is. Each line of the graph will indicate
    approximately 10 percent usage. But if you find yourself consistently running
    over two or three lines in the graph, we suggest you find a way to distribute
    some of the load. Or perhaps a memory increase for the system will lower the number
    by reducing the amount of swapping that must occur. In any case, you might like
    to keep a little Xload graph open down on the corner of the screen. Over time,
    you’ll get a feel for what’s normal, and if you suddenly find that you are running
    higher than you would expect, chances are that you should ask your system administrator
    to look into the situation.


    # Is there a way to control the size and placement of an X program?


    Try the -geometry option. The xclock, for example, likes to pop up in the middle
    of the screen. To put a standard analog clock up in the upper right-hand corner
    of the screen, try this:


    ```

    xclock -geometry -1+1 &

    ```


    and you’ll get a nice little clock like the one in Figure 8-5 in the upper right-hand
    corner of your screen.


    # How can xman help me browse for help?


    The Xman program provides an easy-to-use front end to the manual pages, letting
    you find what you need by searching


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_158_0.png)


    Figure 8-5 The Xclock makes a useful addition to your desktop'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'for the specific item, or by opening up a window and choosing which volume
    of the manuals to look for the **man** page in. Once you choose the volume, you
    can easily pick from the list of available commands to view.


    The Xman program also makes it easy to browse through the manual page for the
    command you are interested in, providing a scroll bar on the side and formatting
    the page for your display. To find out more about Xman, just use the **xman**
    command and click on Help. You’ll get a useful help screen and you can then choose
    other pages to get help on by clicking on the Manual Page button.


    > **Tip:** Try xeyes to spice up your desktop. Stick it up in the upper-left corner
    of your screen, and give it some nice blue eyes. You can think of it as your boss,
    keeping his watchful eye on you, if you are the paranoid type, or as a favorite
    sweetie-pie gazing soulfully at you, if you are the more amorous type.


    ```

    xeyes -geometry 100x100+0+0 -fg steelblue -center white &

    ```


    The result of this command is shown in Figure 8-6. Actually, the picture doesn’t
    do it justice; it has to be seen.


    # Less Useful X Programs


    But enough about useful programs. Let’s talk for a minute about some of the less
    useful programs that come with the X Window System. Our favorite little useless
    program is **xeyes**. This does absolutely nothing useful. It puts two eyes on
    your screen, which calmly follow your mouse pointer wherever it goes. See, we
    told you it was useless. But it is kind of charming, and you might well like to
    have it open, if only to wow the rubes.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_160_0.png)


    Figure 8-6 xeyes follow your mouse, wherever it goes


    # CUSTOMIZING X


    # What are some of the things I can do to customize X Windows and what files do
    I need to change in order to do this?


    Among other things, you can change the colors, fonts, appearance, and menus. There
    are two basic files that you have control of and they both reside in your $HOME
    directory—.Xdefaults and .mw mrc. The first controls the options and settings
    for the X server itself, while the second controls the behavior of the Motif Window
    Manager. You can also add other, task-specific files for a particular situation.
    And, finally, each application may have a special set of defaults that you can
    set. The default versions of these files, which should only be changed by your
    system administrator, are kept in the /usr/lib/X11/app-defaults directory. However,
    you can easily copy any of these files to your home directory to give you a baseline
    to work from. Some applications will read a "dotted" version of these files on
    start-up; others prefer that you include the settings in your .Xdefaults file.
    But in all cases, you can explicitly load these settings if you want. We strongly
    recommend that you do this when first making changes to a particular set of resources.
    Then and only then, if they really are what you want and expected, should you
    add them to the default files.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'When you first log in to your workstation, these two files are read, and they
    are not read again unless you explicitly load them. So any changes you make will
    not be apparent until then.


    # How can I customize the X Server?


    The basic X server defaults are just that, pretty basic and bland. But you can
    easily make changes to the way your desktop looks and behaves by modifying the
    resource files for either the individual clients or for all clients. The basic
    syntax of a resource specification is


    ```

    client*resource_name:    resource_value

    ```


    # Is there a way I can change the default background color for all my Xterms?


    Yes. To set it to LightSteelBlue, try the following:


    ```

    Xterm*background:    LightSteelBlue

    ```


    Now, whenever you start an Xterm, if you don''t explicitly set the background
    color on the command line, you will get an Xterm window with a light steel-blue
    background. Well, almost. First you have to force your system to read this resource
    change. We recommend that you put any changes you are trying out into a separate
    file and that you not add them to your .Xdefaults file until you are sure they
    are what you want. We put our changes in a file called .Xtest until we''re sure
    they are OK. The command to tell the X server to read this file and incorporate
    its settings into the X server''s database is xrdb with the -merge option. So
    this gives us:


    ```

    xrdb -merge ~/.Xtest

    ```


    which will load the .Xtest file you just created into your X server''s database.
    Now, try the change you made by starting an Xterm and see if the background changed.
    If you didn''t muck up the syntax, all your Xterms should now have a light blue
    background.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Warning:


    The xrdb command gives you no error messages, but it is very fussy about exact
    syntax and even the presence of trailing white space. If your changes don''t seem
    to be working, the two most common problems are leaving out the colon (:) between
    the resource and its value, and having a space or two after the value. This is
    especially true if you are converting from X11R4 or earlier to X11R5, since these
    older versions of the X server were less punctilious. The latest version has,
    for reasons that are clear only to the programmers who made the change, become
    intolerant of stray spaces and tabs.


    # How can I customize my desktop?


    Your underlying desktop, or more properly your root window, is by default an annoying
    variegated grey color that we find really hard on the eyes. You can easily fix
    this, however, using the xsetroot program, which changes the defaults (or restores
    them). If you want a solid black background, for example, use


    ```

    xsetroot -solid black

    ```


    which will change the backdrop to solid black. If you want to try a graph paper
    look, use


    ```

    xsetroot -mod 8 8

    ```


    However, we don''t think you''ll stick with that for long. Frankly, there isn''t
    much the plain old version of xsetroot that comes with X will do to perk up your
    background. You can add a bitmap with it, but these aren''t nearly as cool as
    the backgrounds that you can do with Microsoft Windows. There are probably dozens
    of little utilities out there that will get around this limitation, but one we
    have used and like is the xv program, which is available as shareware from several
    different sources. The author is John Bradley, and his email address for more
    information about the program is bradley@cis.upenn.edu. We use it to add .bmp
    or .gif files'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'into the root window, resulting in backgrounds that will banish Windows envy
    quite effectively. Figure 8-7 below is just one example of the sort of things
    you can do, but you are limited only by your imagination and your resourcefulness
    in finding images.


    > Tip: Use the xset program to change font paths, screen saver, and so forth.
    Normally, you don’t need or want to change this stuff, but sometimes you may add
    a program and it doesn’t put its fonts where they belong, or there may be some
    other problem. Use xset to add the new font path to your existing one, and then
    xset fp rehash to make the change actually happen. You can also control the behavior
    of the built-in screen saver as well as the keyboard and mouse with the xset program.
    For a quick command-line help with the program, use xset -help; to see what the
    current settings are, use xset -q.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_163_0.png)


    Figure 8-7 The xv program lets you customize your root window'
  merge: -1
