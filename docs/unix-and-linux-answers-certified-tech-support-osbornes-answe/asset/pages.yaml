    # What’s the very best way to protect crucial files against accidental erasure?


    One important way to protect your files from inadvertent removal, or even worse,
    deliberate mischief, is to use the protection mechanisms built into UNIX.


    Step one is to make really important files read-only. This is easy to do and can
    save you plenty of trouble. If you have files that you don’t need to change, but
    do need to access regularly, change their permissions to not allow anyone—even
    yourself—to write to them.


    ```

    `chmod a-w filename`

    ```


    Now the file cannot be changed without taking extra steps, even by you, the owner.
    Of course, you can get around this by changing the permissions before you change
    the file. But you have made the process awkward enough that you are unlikely to
    do it by accident.


    > **Warning:** The superuser can delete your file no matter what you do. This
    is one of those sad but true facts. No matter how much protection you put on a
    file, the superuser can blithely delete the file or change it, with barely a moment’s
    thought. Yet another reason to stay on friendly terms with this person.'
  merge: -1
  img_proc: true
