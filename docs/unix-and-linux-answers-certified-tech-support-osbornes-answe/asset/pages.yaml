- pgno: 62
  md: '# Can I use aliases to make setting permissions easier?


    Yes. Here''s a quick trick to modify the permissions of a file, adding or subtracting
    write permission from the file. Add these aliases to your .kshrc or .cshrc file,
    and they will always be there.


    ```

    alias w-= "chmod a-w $0"

    alias w+= "chmod u+w $0"

    ```


    If you''re a C shell user, this looks a little different, since the alias command
    has a slightly different syntax:


    ```

    alias w- chmod a-w

    alias w+ chmod u+w

    ```


    In either case, the first line removes write permissions from everyone and the
    second line adds write permissions back for the owner of a file. This is just
    good conservative practice. It''s generally a bad idea to make global, irrevocable,
    or far-reaching commands too easy to execute. Before you let everyone, even your
    boss, read your résumé, you want to make sure it is on purpose. Which leads to
    another tip!


    # Can I hide my files and directories from the superuser?


    Nothing is secure from the superuser. It''s important to understand this subtle
    but important point. You can set permissions such that no one but you can even
    read your secret file by setting it to a permission of 600 with the chmod command:


    ```

    chmod 600 resume.doc

    ```


    But this will only go so far. Even if we haven''t accidentally left a back door
    open into this file, by not setting the directory permissions correctly, the superuser
    can always read (and change) your files. So think long and hard about what you
    leave on the hard disk. If something is really'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'secret, a floppy is a far better place for it. Also, remember that anyone who
    has your password has access to your files, just as if they were you.


    # So what do I need to know about UNIX directory protections?


    There''s more about directory structures later (see "UNIX File Systems and Directory
    Structures" below), but it''s important here in the security section to mention
    how permissions work for directories. A directory in UNIX is simply another filename
    for most purposes. It has the exact same set of permissions attached to it, except
    for the first column, which for most regular files is shown as a "-" in the first
    column:


    ```

    -rwxr-x--x  1 crussel users 76884 Jan 30 14:47

    alfie.cat

    ```


    However, when the listing is a directory, the first column of a long listing will
    have the letter "d" in it, and the meaning of the permissions will be subtly different,
    as shown here:


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_63_0.png)


    The permissions on a directory break down as follows:


    +   - read permission to list the files in the directory

    +   - write permission to create, rename, or delete files in the directory

    +   - execute permission to use the files in the directory


    This means that even if you don''t have permission to read a file, if you have
    permission to write to the directory in which the file resides, you can make a
    copy of it (which you will now own!), delete it, move it, or rename it. And even
    if you can''t read the contents of a directory or write to it, if you have execute
    permission you can still execute programs'
  merge: -1
  img_proc: true
