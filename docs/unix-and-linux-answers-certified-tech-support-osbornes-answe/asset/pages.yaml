  md: 'vedit at the command line. This last one you can safely ignore. Some of the
    options included in the vedit version are pretty useful, but in this chapter,
    we show you how to add those to your standard vi.


    # Can I edit a series of files when I''m using vi?


    Yes. Just include all the files you want to work with in the command line when
    you start vi. You can use wildcards here, so it''s simple to edit all your "dot
    cat" files by typing


    ```

    vi *.cat

    ```


    You can get much more sophisticated, of course, using the pattern matching built
    into the shell to load your files, but you get the idea. Once you have them all
    included on the command line, it''s really easy to move between them in vi.


    # How can I finish editing the current file, save my changes, and move to the
    next file in the file list?


    Use :n from command mode. This little trick saves you lots of time, and makes
    it easy to edit a bunch of files. Just remember if you want to cut and paste between
    files, you will need to use named buffers. See below under "Searching for (and
    Replacing) Text" and "Cutting and Pasting" for more on named buffers.


    > Tip: Some versions of vi don''t support the automatic save and edit of the next
    file shown above. For those, you''ll need to do two separate steps—save the file
    and then move to the next one—if you''ve made any changes to the current one.
    Use :w followed by :n in command mode if you''re stuck with one of those versions.


    # Is there a way I can back up and edit the previous file in the file list?


    Yes. Use :e # from the command mode. The pound sign is shorthand for "the previous
    file I had open."'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Can I reload the current file and start again from scratch?


    Use :e! % from the command line. Here we are using external mode again, telling
    vi to edit a file without saving the current file (the "e!" part), and the file
    we want to edit is the current file (the "%" part).


    # How is the ! pronounced?


    It is pronounced "bang," as in "e-bang."


    # Is there a way I can see what files are left to edit?


    Yes; try :args. Loading a bunch of files on the command line is nice, but if you
    lose track of what''s still lined up and waiting, this external command will show
    you what remains.


    # If I discover I''ve made a terrible mistake, can I start over on the same list
    of files?


    Yes; just rewind them. To accomplish this, use the :rewind command to save any
    changes to the current file, and start back at the beginning of the list, or use
    rewind-bang (rewind!) to abandon any changes to the current file.


    # MOVING AROUND


    # What are the basic cursor movement keys in vi?


    The basic cursor movement keys in command mode are the "j," "k," "l," and "h"
    keys. They move you down a line, up a line, right one character, and left one
    character, respectively. Add a number in front of them and you move that many
    lines or characters. So, to move 25 lines down in the current file, issue the
    command 25j. However, if there are fewer than 25 lines below the current cursor
    position, all vi will do is beep at you. The same applies if you''re moving up
    and there are fewer lines than you specify. You won''t get any movement until
    you supply a command that''s possible.'
  merge: -1
  img_proc: true
