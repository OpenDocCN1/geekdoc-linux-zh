    # Can I find a file when I know what kind it is but not where it is?


    Now it’s time to call in the heavy hitter—the UNIX find command. This powerful
    utility will search your entire filesystem looking for a file or files that match
    a set of criteria, or any subset of the entire filesystem. This command syntax
    is


    ```

    find <pathname-list> <operator>

    ```


    where pathname-list can be one or more directories and their subdirectories and
    operator can be any of the following:


    +   - -name <filename pattern>

    +   - -perm <file mode>

    +   - -type <filetype>

    +   - -user <username>

    +   - -size <# blocks> (+# blocks means larger than)

    +   - -atime <#days> (accessed time)

    +   - -mtime <#days> (modified time)

    +   - -ctime <#days> (changed time)

    +   - -newer <file> (newer than the designated file)


    Of these options, the most useful is probably the "-name" option. This will take
    wildcards and perform the usual sort of pattern matching, so it can be pretty
    flexible.


    For example, you know you have a file that you used for your monthly progress
    report last month, and you want to use it as a template, but you can’t find it.
    You do remember,'
