    # What is a UNIX directory and how does it relate to other (sub)directories?


    UNIX, like virtually all major operating systems, uses what is known as a hierarchical
    directory structure. This is sometimes also called a tree structure, but under
    either name, it is the same basic structure as most operating systems these days.
    There''s a "root" directory and under it a series of subdirectories. Each subdirectory
    can in turn have multiple subdirectories under it, which in turn can have multiple
    subdirectories under them, and so on. How deep this structure can go depends on
    the particular flavor of UNIX, but in virtually all cases, it goes far enough
    that you never need to worry about running out of levels.


    So what is a directory? Well, actually, it''s really just a file that holds the
    names of the files and subdirectories that lie within it, along with the inode
    number for each file or directory. (Wonder what an inode is? See "Do I really
    need to understand inodes?" below.)


    # What are . (dot) and .. (dot-dot)?


    These are two special directory names that make moving around easier. The dot
    directory is your current directory, while the dot-dot directory is the one above
    where you are. So, if you are working on a project with a group of people, and
    you have your documentation files stored in one directory, your source code files
    in another, header files in a third, and so on, it can be a pain to move to the
    documentation directory using an absolute path name. Do you really want to type


    ```

    cd /usr/projects/newmodel/docs

    ```


    every time you want to update the documentation on the change you just made to
    the header file, which is in /usr/projects/newmodel/headers? Hardly. So, to change
    to the documentation directory, just type:


    ```

    cd ../docs

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Do I really need to understand inodes?


    Thankfully, no. The inode (pronounced "EYE-node") is the data structure that UNIX
    uses to keep track of where each file is in the system, as well as other important
    information such as its permissions, ownership, timestamp, and so forth. In this
    sense, it''s a little (but not very much) like the FAT table on a DOS disk. You
    can see the inode number associated with a file by using the ls command with the
    -i switch:


    ```

    $ ls -il

    total 4

    441315 -rwxr-xr-x 1 crussel users 884 Jan 30 14:47

    stanley.cat

    ```


    What does this mean to you as a user? Not much. After all, we did imply that you
    could ignore this section. This is the province of those shadowy figures known
    as system administrators—the ones with pocket protectors and a persecuted expression.


    # How does the UNIX filesystem work?


    Feel free to skip this section if the subject doesn''t interest you, but for those
    of you who are curious, here goes. The UNIX concept of filesystems is somewhat
    different from what a typical DOS or even Macintosh user has come to expect. There''s
    a "root" filesystem that every UNIX machine must have, which resembles the "C:"
    drive on a DOS machine, but there the similarity between UNIX and other filesystems
    ends. Instead of additional drive letters for each additional hard disk you add,
    the hard disks each get their own filesystem, which then "mounts" on the root
    filesystem. So, on a large system with many users and a substantial number of
    commercial programs, you might well have, for example, the root filesystem and
    a "/u" filesystem that contains the home directories for all the users, and another
    "/usr" filesystem that contains most of the commercial programs. And it''s very
    possible if you are working in a distributed workstation environment (as opposed
    to one with a large, central server) that the /u filesystem is actually the same
    regardless of which machine you happen to log in on. On one of the machines, it''s
    physically in that box, but on all'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'the rest, it''s remotely mounted. This sort of setup allows you to use any
    available workstation without worrying about which one it happens to be. Your
    home directory is exactly the same, regardless.


    # What is a home directory?


    This is the directory that every user on a UNIX computer has that is his or her
    very own. For the user "charlie", this directory may be /u/charlie, or /users/charlie,
    or /home/charlie, or any one of several other places in the filesystem, depending
    on the flavor of UNIX and the biases of the superuser on your system. But the
    result''s the same—it''s yours. Files and directories that you create in it are
    owned by you, and changed and used by others only with your permission. With,
    as always, the proviso that nothing is hidden from the superuser.


    # What subdirectories does a typical user''s home directory contain, and what
    files are in these subdirectories?


    Your home directory is where you''ll store the files that control your environment,
    your start-up files, and it will also usually include a hopeless jumble of miscellaneous
    other files you''ve created over time. In this sense, it''s sort of like the closet
    you throw everything into when company is coming. This makes it hard to figure
    out which file is which, or to find the one file you absolutely have to have right
    now. So do a little organizing. Every user should have a couple of subdirectories
    to sort particular kinds of files into, and then use them. For example, my home
    directory has the following subdirectories:


    +   - bin Executable programs and scripts go here

    +   - docs General purpose WordPerfect files go here

    +   - notes A place for quick notes to myself

    +   - wrksheet Spreadsheet files go here

    +   - source Source files for various executable programs that are in bin

    +   - tmp A place for temporary files'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - **Mail** Required storage spot for elm, my mail reader

    +   - *arc* A place to store compressed versions of things I don’t often need,
    but don’t want to erase

    +   - *junk* Stuff that doesn’t fit anywhere else


    Other subdirectories come and go, depending on what projects are being worked
    on. For example, I currently have a UNIXanswers directory in the docs directory.
    When this book is finished, the entire directory will get compressed into a single
    file and stuck into the arc directory.


    So what actually gets in the root level of your home directory? The absolute minimum
    possible. Everything that doesn’t have to be in your home directory should be
    in a subdirectory. UNIX will run faster because it has a positive dislike of directories
    with too many files in them. And you’ll spend less time floundering around looking
    for files.


    # How can I keep my home directory clean?


    Basically, the only files in your home directory should be the "dot" files that
    control your start-up, shutdown, and environment. Files like **.profile**, **.kshrc**,
    **.login**, **.cshrc**, **.logout**, **.exrc**, and **.xsession**. We’ll examine
    most of these files in much greater detail in Chapter 5, because they’re essential
    to automating and controlling your setup. Since they begin with a dot, these files
    aren’t normally seen because they’re hidden from a simple ls command.


    # FINDING LOST FILES


    # How can I find a file I’ve changed recently?


    Try `ls -t`. This little trick by itself will find 85 percent of the files you’re
    looking for. The `-t` (for time, one assumes) will give you a listing of files
    sorted by the time they were last changed, with the most recent first. Add the
    `-u` switch to this, and the sort is by the time they were last accessed, whether
    they were changed or not. Combine this with `more` to'
