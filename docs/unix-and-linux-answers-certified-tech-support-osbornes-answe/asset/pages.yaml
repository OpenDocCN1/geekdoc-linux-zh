- pgno: 282
  md: 'Of course you know that there are hundreds of commands in the various versions
    of UNIX, so you won’t find all of them here. But you will find a lot of very useful
    ones—especially the ones used for the tricks in this book. We’ll show you the
    syntax and available options and a little on how each command works.


    Because there are variations among the flavors of UNIX, your version may have
    slightly different syntax and/or options than the ones shown here. If you see
    a command that looks like it might do what you want to do but you don’t see exactly
    the right option or you get a syntax error upon execution, check your documentation
    for possible variations.


    # alias [options] name[=‘cmd’]


    # OBJECTIVE:


    Assigns a shorthand name to substitute for cmd. If ‘cmd’ is omitted, it prints
    the alias for name. Korn shell only.


    # OPTIONS AND VARIABLES


    +   -t Creates a tracked alias for a UNIX command. The shell will remember the
    full path name of the command, making it easier to find.

    +   -x Exports the alias so it can be used in shell scripts.


    # at options time [date] [+increment]


    # OBJECTIVE:


    Lets you schedule jobs to be executed later.


    # OPTIONS AND VARIABLES


    +   -l [jobID] Lists your currently scheduled jobs. Include a jobID if you want
    information on just one job.

    +   -r [jobID] Removes specified job from the queue. You can remove only your
    own jobs unless you’re the superuser.

    +   time Specifies the time the job should start. The format is hh:mm [modifiers].
    A 24-hour clock is assumed unless you add the modifier am or pm, in which case
    time is based on a 23-hour clock.'
  merge: -1
  img_proc: true
