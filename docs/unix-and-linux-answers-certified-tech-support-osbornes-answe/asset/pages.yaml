  img_proc: true
- pgno: 271
  md: 'Obviously, there are more powerful uses for awk than as a simple replacement
    for grep, but this does help point out a bit about the syntax of awk. Here we''ve
    used awk simply as a command-line program. The program we want to run is enclosed
    in single quotes to make sure that the shell doesn''t try to interpret it, and
    we''ve used the same regular expression syntax we are accustomed to—except that
    the pattern is delimited by slashes ("/"). The pattern we''re trying to match
    is the start of the line (the ^ part), followed immediately by a digit (the [0-9]
    part).


    # Can you give me a slightly more useful example of how to use awk?


    Suppose you want to count the number of lines in a file. You could use wc to do
    this, of course, but how are you going to find out anything about awk by using
    wc? Figure 15-1 shows two versions of the linecount script, as well as the results
    of running them and the results of running the wc program to count the lines.


    The first version is intended to be run by an explicit call to awk with this as
    the script file for awk to use. It has a single-header comment line to keep it
    very small so it will all fit on the screen, but you would, of course, add additional
    information in your initial header. Then it has the reserved word "END" followed
    by an action enclosed in braces to print the message with the number of lines
    in the file. The word


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_271_0.png)


    Figure 15-1 Three different ways to count the lines in a file'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'END tells awk to do this only once, after all other processing has been completed.
    There is an equivalent reserved word "BEGIN" that lets you do a set of actions
    before you start processing the file. Also notice the word "FILENAME" in the middle
    of the print statement. This is another reserved word that contains the filename
    of the file being processed. If the script is processing standard input, the variable
    will return "-". Included in this print statement is the variable "lc," which
    is one we made up, and that we didn''t have to initialize, declare, or do any
    of that other boring programming stuff to. Finally, we have the actual counting.
    Here, we have a very C-like expression—"++lc"—which is a shorthand way of writing
    out the more verbose "lc = lc + 1", which would be equally acceptable to awk.
    Notice that we didn''t have to initialize lc to anything, it simply starts out
    life with a value of zero unless we give it some other. Since we want to start
    counting from one, not zero, we use the C construct of "++lc", which says to increment
    lc before we evaluate it, keeping us one ahead.


    The second version of the line-counting program is what we like to think of as
    the stand-alone version. It uses the Korn shell''s ability to execute a program
    directly by inserting that line that looks like a comment as the first line in
    the file. This line tells the Korn shell to process the rest of the file through
    the awk program using the -f option, which will feed it the rest of the file as
    an awk script. This is the minimalistic version of what is known as a "shell wrapper";
    it provides a handy way to run your favorite scripts without having to type in
    that more awkward command-line syntax. You can do far more sophisticated wrappers
    to parse for command-line options and so forth, but this is good enough for our
    purposes. Now we just type in linecount filename and we can count the number of
    lines in the file. Finally, a more interesting version of the program. Figure
    15-2 shows how this would look if we modified it to count only the comment lines
    in the file.


    Here we use the same basic program, but now we tell awk to only count the lines
    if they began with a leading "#". We even told it to ignore that initial line
    that we use on some of our scripts to make sure they''re processed using a particular
    program or shell.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_273_0.png)


    Figure 15-2 Using awk to count the number of comments in a file


    This is only the tiniest beginning of the ways you can use awk to handle tasks
    in your daily computer life. You can combine the powerful pattern-matching abilities
    with the capacity to act on only that part of the input that matches the pattern,
    to create useful, easy-to-read, formatted reports and documents. See Appendix
    D for sources of information about awk.


    # THE PERL PROGRAMMING LANGUAGE


    # perl Is an Eclectic Gem


    Unlike awk, which was written by three people, perl was written essentially by
    a single person, Larry Wall. Others, inevitably, have influenced its growth and
    nature, but ultimately the blame rests with Larry, as does the credit, of course,
    perl is officially short for "Practical Extraction and Report Language," which
    is a good enough description as far as it goes. But consider that many believe
    it''s actually short for "Pathologically Eclectic Rubbish Lister," and you''ll
    begin to get a more accurate feel for the character of both the language and its
    creator. Most people who''ve tried perl seem to either adopt it for a wide variety
    of uses, or run screaming into the night. Whether awk or perl is a good choice
    for you, you''ll have to decide on your own. But we do think that you should add
    one or the other to your everyday toolbox. We tend to think that the greater flexibility
    and power of the expanded regular expressions in perl give it a slight edge. Besides,
    as eclectic as its syntax is, it tends to grow on you.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Can you point out some of the differences between awk and perl?


    In this section we’ll take the two scripts that we created for awk and "port"
    them to perl. The end results are the same of course, but you’ll be able to see
    where the two programs differ.


    We’ll bypass the command-line version of the line-counting program and go straight
    to the version with the minimalist shell wrapper around it. Except now instead
    of running the awk program, this will run the perl program. Normally, you would
    have the line


    ```

    #!/usr/bin/perl

    ```


    as the first line of your perl scripts, but ours is in an unusual place, so our
    first line reads:


    ```

    #!/work/bin/perl

    ```


    The results are the same, however. This line tells the shell program that its
    sole job is to execute the perl program and just pass the statements in the file
    directly to perl to deal with. Figure 15-3 shows the two perl scripts for counting
    the number of lines in a file, and the number of comment lines in a file, the
    same two tasks we did with awk. But now the programs look a bit different.


    awk uses an implicit while loop that automatically sends the entire contents of
    the files given on the command line to the pattern-matching and action part of
    the program. But in


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_274_0.png)


    **Figure 15-3** Our two scripts, rewritten for perl'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'the perl example, you see that we need to build the while loop explicitly,
    with the statement:


    ```

    while (<>) {

    ++$lc;

    }

    ```


    That probably makes sense to you because most programming languages expect you
    to create your own while loops where you need them. But what’s that "(<>)" supposed
    to mean? This is known as the "diamond operator" and it takes the file in the
    array $ARGV[0], which was the file we passed to the program on the command line,
    and examines each line of that program until it reaches the end. Which is what
    the awk script did automatically.


    The other thing that the awk program had that we have to do explicitly here is
    pass in the filename whose lines we’re counting. Here we need to stick that filename
    into a variable that won’t get mucked up during the while loop so we can reference
    it at the end after we’ve counted all the lines.


    In the second program, which counts the comment lines in the file, we see again
    the differences and similarities between the two languages. In awk we simply added
    the pattern-matching criteria to the beginning of the line that did the counting,
    but here we need to add an explicit if clause. Again, some things that awk does
    automatically have to be explicitly called out in perl. We don’t find this a hardship,
    and even think it makes the resultant code a bit easier to read, but others feel
    strongly that this is not as elegant.


    It’s important to notice the identical code describing the pattern match. While
    perl does add important new pattern-matching tools (our favorite is "\b" to define
    a word boundary), it still uses the same syntax as awk.


    As you can see, there are substantial differences between perl and awk, even though
    both perform many of the same functions. In the broader sense, perl goes beyond
    where awk is or is likely to go, and is continuing to be actively developed. It
    is not, however, a part of the normal UNIX distribution, though it is freely available.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# THE SED PROGRAMMING LANGUAGE


    # Automating Is Easier


    Performing repetitive changes on a text file, or a series of text files, is a
    common computer task. While an interactive text editor such as vi or emacs might
    be your first choice for a tool, there are better (albeit less well known) alternatives.
    One of those alternatives is sed, a noninteractive stream editor.


    # What is sed?


    sed is a tool that allows you to perform scripted or repetitive edits on a file.
    Since it is noninteractive, you do not use the traditional editing interface.
    Instead, you issue a set of commands to perform a series of tasks on an input
    stream and the results are directed to an output stream. You can use standard
    shell redirection (pipes and such) to manipulate, create, or redirect these streams.


    # Why learn yet another tool?


    Traditional UNIX editors are great tools for the job they are designed for. They
    work well for interactive editing tasks involving generating new files or updating
    old ones. Some of them even have useful scripting capabilities that allow you
    to perform programmed or scripted editing tasks across a file or group of files.


    Most of them, however, are serious overkill when you need to do large-scale repetition,
    small edits, or just need to get in and get out quickly. In addition, most editors
    don''t allow you to insert them into the middle of UNIX''s "piping" commands and
    even if they did, the overhead involved in starting them up would be horrendous.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'UNIX power users have a long tradition of using the right tool for the right
    job and you can never have enough tricks in your bag. sed isn’t the right tool
    for writing a résumé or even a letter to your Aunt Hortense. However, it simply
    can’t be beat when you need to change every pipe character to a colon in a dozen
    different files and then send those files to another program for processing.


    # How does it work?


    sed reads a set of characters, a stream, from stdin and writes to stdout. It can
    be given a series of operations to perform on the command line, if they are short,
    or it can read a set of instructions from a script file. A common invocation might
    look something like this:


    ```

    sed -e ''{some sed command}'' input_file > output_file

    ```


    or alternatively, if reading a set of commands from a script file, it might look
    similar to this:


    ```

    sed -f {script file} input_file > output_file

    ```


    Unless you specify otherwise, sed will apply the commands you enter to every line
    in the input stream. You can limit the lines that get affected in various ways
    such as specifying beginning and ending line numbers or even start or end blocks
    by pattern matches. These affected lines are normally referred to as addresses,
    and these addresses can be specified as either zero, one, or two addresses. Addresses
    can be any combination of either patterns (which are enclosed in slashes), line
    numbers, or line specifier symbols.


    Commands are extensive and varied. Some of these include:


    +   - = Print the line number of the line to stdout

    +   - s Perform a substitution on the address

    +   - d Delete the addressed lines

    +   - w Write the addressed lines to a file

    +   - q Quit when the address is encountered


    There are many more commands available, but this list should give you a small
    taste of what sed can do.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Can you give me some examples of how to use sed?


    By combining both addresses and commands, you form a complete sed command, which
    might look something like this:


    ```

    sed -e ''/foo/d'' myfile

    ```


    This sed invocation would delete every line that contains the word "foo" and print
    the results to standard out. This is an example of using zero addresses, which
    results in attempting the match on every single line. Another example would be:


    ```

    sed -e ''50d'' myfile

    ```


    which would result in deleting line 50 of myfile, while


    ```

    sed -e ''50,$d'' myfile

    ```


    would delete everything from line 50 to the end ($ refers to the last line in
    the stream). Another common task involves replacing one pattern of text with another.
    This is done using the s command, instead of the d above, and might look similar
    to the following:


    ```

    sed -e ''s/foo/bar/'' myfile

    ```


    This example would substitute the first occurrence of the word "foo" with the
    word "bar" on each line. If you wanted to replace multiple occurrences on the
    same line, you would need to append a g after the command, as in the following:


    ```

    sed -e ''s/foo/bar/g'' myfile

    ```


    Regular expression patterns can be used in the search space above (instead of
    "foo", for example), which can add more power to your editing. If you wanted to
    place a series of asterisks in front of specific lines, for example, you might
    use:


    ```

    sed -e ''/foo/s/^/*** /'' myfile

    ```


    This would find every line with the word "foo" in it, and replace the beginning
    of the line (^ is a special symbol that refers to the beginning of the line) with
    three asterisks.


    A final word of warning is in order. Since sed is stream-oriented, it does not
    read the entire input file into'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'memory before it opens the output stream. This means that if you try to edit
    a file in place with something like this:


    ```

    sed -e ''s/foo/bar/'' myfile > myfile   # THIS IS WRONG

    ```


    you will end up with a zero byte file and a very silly look on your face.'
  merge: -1
