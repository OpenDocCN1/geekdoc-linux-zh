- pgno: 270
  md: '# awk Is the Product of Three Familiar UNIX Names


    awk is named for its three codevelopers, Alfred Aho, Peter Weinberger, and Brian
    Kernighan. It''s available as part of the standard UNIX distribution in its original
    form at least and usually also in a later version written in 1985 by the original
    authors called "new awk" or nawk. If you get serious about awk, you''ll want to
    make sure your system has the nawk version, or you can obtain the GNU version,
    gawk, which adds most of the same enhancements to the original that nawk did.
    We''ll use awk for this discussion.


    # How can I call awk and what are some of the options it offers me?


    The awk program is called with the command-line syntax:


    ```

    awk [option] [script] [file]

    ```


    The most common option is -f scriptfile, which reads in the script from a file
    instead of on the command line. An awk program consists of the form:


    ```

    pattern {action}

    ```


    where either the pattern-matching part or the action part is optional. If no pattern
    is specified, the action is performed on every line of the input; if no action
    is specified, the default action of { print $0 } is performed on each line that
    matches the pattern. Since "$0" is a special parameter whose value is the entire
    line of input, the result is that the default action is to print the line that
    matches the input. This leads to one obvious use of awk as a somewhat more sophisticated
    version of grep. For example, the following will look for every line in a file
    that begins with a number and print out the entire line.


    ```

    awk ''/^[0-9]/'' filename

    ```'
