- pgno: 198
  md: '# NT and UNIX Interoperability @ a Glance


    The basic TCP/IP utilities that come with both UNIX and Windows NT provide for
    an easy-to-use, minimal level of connectivity that will answer for many purposes.


    For more demanding purposes, there are both NT and UNIX simulations of the other''s
    networking and behavior so you can easily make your UNIX server look like an NT
    server, and vice versa.


    Windows NT has a built-in Posix layer that provides minimal UNIX-like behavior,
    but you''ll probably want a more comprehensive set of utilities from a third party
    if you spend a lot of time going back and forth between the two.


    The Korn shell provides the ability to mimic many of the command-line utilities
    and behavior of the Windows NT command line.


    # BASIC TCP/IP CONNECTIVITY


    # How can I copy files from my UNIX server to a Windows NT machine?


    The simplest way to copy files from any UNIX machine is to use Microsoft''s built-in
    ftp client. This is a basic, command-line ftp client that handles all the essential
    ftp commands and even does command-line redirection to do automatic downloads.


    # Can I use ftp to copy files from my Windows NT machine to a UNIX or Linux machine?


    Yes. You have two choices here. You can use the same Microsoft command-line ftp
    client to copy the files, letting'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'the UNIX machine be the server, using ftp''s put command. An example session
    in Figure 11-1 shows the process of connecting to the UNIX server "xena" and copying
    a file from the C:\MyFiles directory to the home directory of user "charlie" on
    the UNIX server.


    The second alternative, if you''re at the UNIX machine''s console, requires that
    you have the Microsoft ftp server running on Windows NT. With NT 3.51 and prior
    versions, this was an additional networking service that you could add to your
    NT networking. However, in version 4 and later of Windows NT, the ftp service
    is part of the Internet Information Server and requires that you install IIS in
    order to be able to service ftp requests.


    # Is there an easier-to-use ftp client for Windows NT than the included command-line
    version?


    Yes, there are a number of them. Virtually every TCP/IP add-on, including most
    NFS clients, XServers, and various other tools, includes a GUI version of ftp,
    so if you''re using any of these, you''re likely to have at least one alternative.
    If you don''t have any of these, and don''t really want to add one of them, you
    can use one of the shareware or freeware ftp clients. One of the best we''ve seen
    is "ws_ftp" from Ipswitch. A quite adequate "Limited Edition" is available as


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_199_0.png)


    Figure 11-1 A basic ftp session to transfer a file from Windows NT to a UNIX server'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'shareware, or they have a fuller-featured "Pro" version for a very reasonable
    cost. The limited edition version is available from a wide variety of sources,
    and both are available direct from their web site, http://www.ipswitch.com. An
    example of the Pro version of ws_ftp performing the same transfer shown in Figure
    11-1 appears in Figure 11-2.


    # Can I run UNIX programs from my Windows NT machine?


    You can use the built-in, graphical telnet client that comes with Windows NT to
    log onto the UNIX machine and run any character-based program on the UNIX machine.
    Any UNIX programs you run under this type of connection are run solely on the
    server. Your machine is serving as a dumb terminal. The Microsoft telnet emulation
    is, however, very basic and only suitable for simple character-based applications
    that can function successfully with only a simple vt-100 emulation. A simple session
    is shown in Figure 11-3.


    # How do I launch the Microsoft telnet application?


    You can start the Windows NT telnet application either from the NT command line,
    by typing telnet, or by selecting Start→Run and typing telnet into the box and
    clicking OK.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_200_0.png)


    Figure 11-2 Using a graphical ftp client to transfer files from NT to UNIX'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_201_0.png)


    You can add the name of the machine (or its IP address) to the command, as shown
    in Figure 11-4.


    # Are there better terminal emulators than the basic Microsoft one?


    Emphatically, yes! There are a wide variety of choices available, from the simple,
    such as Century’s TinyTerm, to the highly sophisticated. One we’ve used and found


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_201_1.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'reasonably effective is FaceTTerm (http://www.facetcorp.com). Another is vt320
    from the same Ipswitch folks who host ftp client we use. Almost all of the third-party
    terminal emulators have either limited or timed versions available for download
    so that you can evaluate their applicability to your particular terminal emulation
    needs. We strongly recommend you try the emulator you are considering before plunking
    down good money. While most are good products, and far better than the built-in
    Microsoft telnet, terminal emulation for a particular application can be a tricky
    business and each emulator has its own strengths and weaknesses.


    One feature that the better emulators provide is multiple window support. This
    lets you have multiple sessions open on the host from a single client—a real plus
    when you’ve got a lot of work to do on the UNIX host and some of it will be stuff
    that you can fire off and ignore for a while as you do something else.


    # Can I telnet from UNIX to Windows NT?


    Yes and no. You can do it, but not without doing some work on the Windows NT machine
    first. Windows NT doesn’t include a telnet daemon or server, only a simple client.
    But there are several third-party telnet daemons available for Windows NT, and
    even one from Microsoft. The NT Resource Kit has a beta version of a telnet server
    that you can install into Windows NT as a service.


    # What about graphical applications?


    You can use virtually all X Windows applications from your Windows NT machine
    by installing an X Windows server onto the Windows NT machine. This will let you
    run both character mode and graphical applications from the UNIX server onto your
    Windows NT desktop without impacting your ability to also run Windows applications.
    There are many X Windows servers available for Windows NT and Windows 95 machines,
    and the general quality of them has improved remarkably over the last several
    years. Our personal favorite is XVision Eclipse from SCO (http://www.sco.com),
    but there are lots of others as well.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Can I use a web browser to access UNIX from a Windows NT machine?


    Yes, assuming the UNIX machine is running a web server. One of the virtues of
    web technology is that it is, in large part, platform independent. So whether
    you are running a Netscape browser from your UNIX machine to get to your Windows
    NT machine, or Microsoft’s Internet Explorer from Windows NT to your UNIX machine,
    the results are pretty much the same. The available options for web servers and
    browsers will, however, be somewhat different.


    # ADVANCED NETWORKING EMULATIONS


    # What is SMB and why should I care?


    SMB is short for server message blocks; it is the underlying technology that Microsoft
    networking uses. UNIX servers can also use SMB, allowing them to talk to machines
    running Windows NT (or any other Microsoft networking stack). There are both freeware
    and commercial implementations of SMB available for a wide variety of UNIX and
    Linux versions, allowing you to add Windows connectivity to your UNIX network
    easily and essentially transparently to the Windows users.


    # What is NFS?


    NFS is short for Network File System. Originally developed by Sun Microsystems,
    it is a pure TCP/IP method of providing file and printer sharing on a network.
    Since its origins are in the UNIX community, it tends to be the method of choice
    for sharing filesystems across UNIX networks. Implementations are available for
    Windows and Windows NT as well, but with some limitations.


    # How can I make my UNIX server visible to my Windows and Windows NT users?


    You can use either an SMB server on the UNIX box, or an NFS client on the Windows
    machines. Both ways will work, and the choice of technology will depend in large
    part on'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'where the primary emphasis is on your network and exactly what you’re trying
    to accomplish. We tend to favor adding SMB to the UNIX boxes over adding NFS to
    the Windows side of the equation, but both can work successfully.


    # What are the advantages of SMB over NFS?


    Server message blocks provide the most transparent access to the UNIX server from
    the Windows user’s perspective. They see the UNIX server as simply another member
    of the Windows workgroup or NT domain. Printer and filesystem shares look and
    behave exactly like they were on a Windows NT or Windows 95 machine, and are used
    in exactly the same way. Plus, nothing extra has to be added to the Windows networking
    stack, which reduces the resource load on the Windows machine, an important consideration
    in many environments.


    NFS can be nearly as transparent, but requires that the NFS client be loaded on
    every single Windows or Windows NT machine that will need access to the UNIX server.
    And the additional resource hit and occasional incompatibilities caused by adding
    another networking client can be a definite problem.


    # What are the advantages of NFS?


    NFS is a good choice for networks where the primary work is done on the UNIX or
    Linux servers, and there are relatively few Windows clients that will need access
    to the UNIX resources, especially where there is a substantial UNIX expertise
    available. NFS can also be a viable choice to provide connectivity in the reverse
    direction, from Windows NT to UNIX if you use an NFS server on the Windows NT
    side. However, in our experience, the available NFS servers for Windows NT are
    suitable only for light duty work.


    # Can I have my UNIX servers function as part of an NT domain?


    Yes. AT&T has ported the Advanced Server portion of Windows NT to UNIX under license
    from Microsoft. This product has then been integrated by several of the major
    UNIX vendors into their product offerings, providing full Windows NT domain-level
    connectivity and support on'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'UNIX servers. These offerings include Advanced File and Print Server, from
    The Santa Cruz Operation (SCO) and Advanced Server for UNIX from Hewlett-Packard.
    With these products and similar ones from other vendors, your UNIX server can
    be either a primary domain controller or backup domain controller for a Windows
    NT Server network—with or without any Windows NT Servers present on the network.


    # Can UNIX servers function as part of a Windows workgroup?


    Yes. There are several products that allow a variety of UNIX versions to function
    as part of a Windows workgroup. Examples include VisionFS from SCO (http://www.vision.sco.com),
    FacetWin from FacetCorp (http://www.facetcorp.com), and samba (ftp://samba.anu.edu.au).
    All of these function as workgroup servers, though not as NT domain controllers.


    # What are the advantages of using NT domains?


    The biggest advantage to using one of the Advanced Server on UNIX (ASU) solutions
    is the increased security and central administration that comes as part of a Microsoft
    domain environment. You use the exact same tools to administer ASU as you do to
    administer a Windows NT domain. Hardly surprising, since they are the same underlying
    source code. Plus, all users, shares, and security can be centrally administered,
    making it much easier to deal with large numbers of machines and users. Workgroup
    solutions tend to top out at somewhere around ten users/workstations. You can
    go farther, but the administrative load becomes excessive.


    # What are the advantages of a workgroup solution?


    Workgroup solutions have the undoubted advantage of being easier to set up and
    configure, especially with relatively smaller numbers of workstations and users.
    While the tools you use will be different from the native Windows tools, they
    are usually flexible and easy to figure out. You don''t need to make complicated
    decisions about the number of domains or'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'worry about having backup domain controllers on the network to protect against
    failure, since the level of security is low enough that you can simply rebuild
    a server and go on about your business.


    # Is there a free way to share UNIX filesystems with Windows clients?


    Yes. There is a freely available source code included, a product called samba
    that you can download to your UNIX system and compile. It provides a high degree
    of interoperability between UNIX systems and windows clients. It is actively being
    developed and updated and can be a good solution in an environment where there
    are sufficient UNIX skills to compile and administer it. For more information
    on samba, including a comprehensive FAQ and the latest versions, point your browser
    at http://samba.anu.edu.au/samba.


    # Are there precompiled versions of samba available?


    Depending on your system, the answer may be yes. Several ports of recent versions
    of samba can be found either at the http://samba.anu.edu.au/samba site or as links
    off of it. In addition, a compiled version for SCO that is usually quite up-to-date
    can be found at ftp://ftp.celestial.com, an overall outstanding source for ports
    of popular packages to SCO maintained by Bill Campbell. (Our personal thanks to
    him for the stuff we''ve scored off his site over the years!)


    # How do I let my UNIX users share a Windows NT filesystem?


    Some versions of UNIX, such as SCO OpenServer, provide native connectivity to
    Windows NT filesystem shares, but many do not. For those that do not, your options
    are a bit limited. Essentially the only choice is to use one of the NFS servers
    on Windows NT. If you need this option, however, we''d advise you to consider
    the load you intend to put on the system. If your primary users are on the Windows
    NT side, with only an occasional UNIX user of the filesystem, then this can be
    a valid option. However, if your users are primarily or even significantly UNIX
    users, we suggest you stick to storing the files on a UNIX machine and use either'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'an NFS client on the Windows NT machine or an SMB server on the UNIX side to
    manage the connectivity. Frankly, we''ve tried the two most popular NFS servers
    for Windows NT and found them not up to the task for more than occasional use.


    # Can I use an NFS exported filesystem on Windows NT without loading an NFS client
    package?


    Yes, but the caveat is that you won’t want to subject it to regular or heavy use.
    If you have an SMB server somewhere on the UNIX network, you can use it as an
    NFS gateway, mounting the NFS filesystem on it and then sharing it out to the
    Windows clients via SMB. It works, but you’re doubling your network traffic and
    encouraging problems. This is recommended only in an emergency or as a temporary
    kludge while you get a better solution.


    # What about printing? Can I share printers between UNIX and Windows NT?


    Absolutely. There are a number of ways to manage the process, but in general all
    the SMB and NFS options discussed for filesystems above will also share out printers.
    Additionally, Windows NT provides a native lp client that lets you use any TCP/IP
    or UNIX printer on the network. The best option overall is to place the printers
    directly on the network, using TCP/IP to control them. Most laser printers have
    either a built-in network card or the ability to add one. And for those that don’t
    there are a variety of TCP/IP-based network print servers available from a variety
    of vendors. We’ve used both the H-P JetDirect-EX (http://www.hp.com) and Milan
    FastPort (http://www.milan.com) print servers with good success.


    # How do I add the TCP/IP printing service to Windows NT?


    You’ll need to be logged in with administrative privilege to the Windows machine.
    Then open the Control Panel, double-click on the Network icon. Click on the Services
    tab and select Add. Highlight the **Microsoft TCP/IP Printing** option and click
    OK.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# How do I add a TCP/IP printer to Windows NT?


    Click on the Printers options of the Control Panel and then double-click on Add
    Printer Icon to open the Add Printer Wizard. Select My Computer and then click
    Next to get to the port selector as shown in Figure 11-5.


    Select the Add Port button to add an LPR port, then highlight the LPR Port option,
    as shown in Figure 11-6, to connect to either a native TCP/IP printer or a UNIX
    printer with remote printing enabled. Then click New Port.


    In the resulting dialog box, type in the name or IP address of the print server
    or UNIX machine that controls the printer, and then the name of the printer or
    print queue. If it’s an H-P JetDirect printer, you’ll use RAW as the printer name
    as shown in Figure 11-7.


    Follow the rest of the prompts to complete the process, telling Windows NT what
    type of printer is being printed to and other details. Don’t forget to print a
    test page, just in case.


    # How can I let my UNIX users use my Windows NT printers?


    Unfortunately, Windows NT doesn’t include an lpd (lp daemon), which means it can’t
    act as a remote printer for


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_208_0.png)


    Figure 11-5 You’ll need to add a new port to connect to a TCP/IP printer'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_209_0.png)


    **Figure 11-6** You’ll need to add an LPR Port to your Windows NT printing system
    to connect to a remote lpr printer


    UNIX machines. However, if you’re using one of the SMB products, many will allow
    you to add a Windows or Windows NT shared printer into the native UNIX print spooler.
    These printers will use a simple passthrough interface script that sends the entire
