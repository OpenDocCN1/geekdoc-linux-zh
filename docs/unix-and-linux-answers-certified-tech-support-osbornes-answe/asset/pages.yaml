- pgno: 168
  md: '# The Unix Toolbox @ a Glance


    UNIX provides you with a veritable arsenal of tools for comparing both text and
    binary files, so here’s where you’ll learn all you need to know about so-called
    regular expressions and how to use the UNIX comparison tools.


    **Text manipulation tools** can help make your life a lot easier by letting you
    page through a file, see just the beginning or end of a file, and much more. You
    can even spell check your text files, create a custom dictionary to use while
    spell checking, sort a file, or clean up a mixed-case text file.


    In the section about **miscellaneous tools**, you’ll learn how to compress a file,
    how to encrypt a file, and how to use the calendar program to perform a couple
    of handy functions.


    > **Note:** Because of its origins as an operating system running on tiny little
    computers where RAM was at a premium, UNIX is composed of hundreds of little programs,
    each one designed to do one or two specific jobs very well and then pass its results
    on to another program so something else can be done to that data. This explains
    why the UNIX toolbox contains as many tools as it does, each of which is intended
    for a specific purpose.


    # COMPARISON TOOLS


    # What is grep and what can it do for me?


    **Grep** and its variants are probably the most useful commands in UNIX for comparing
    and finding text strings.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Grep is short for "Get Regular ExPresssion," and in most versions of UNIX it
    comes in three slightly different versions. The first is the regular grep, which
    lets you search for text that matches some string of text that can include wildcards,
    character sets, and metacharacters. The second is fgrep (short for Fast grep,
    but it''s actually slower), and the third is egrep (short for Extended grep),
    which extends the regular expression matching ability of grep and also lets you
    create logical OR expressions to search for. There are also some public-domain
    versions of grep that each have their own peculiarities and advocates, but we''ll
    stick with the standard ones here. And for the most part, we''ll stick with plain
    old grep, not the others.


    # So how do I go about using grep?


    In its basic form, the syntax of grep is:


    ```

    grep [-options] regexpr [filename(s)]

    ```


    where the options are


    +   - **-b** Returns the block number as well as the matching line

    +   - **-c** Returns only a count of the number of matching lines

    +   - **-h** Returns only the matching lines, but not the filenames they were
    in

    +   - **-i** Ignores case when matching

    +   - **-l** Returns the filenames where there are matches, but not the matching
    lines

    +   - **-n** Returns the line numbers in addition to the matching line

    +   - **-s** Suppresses error messages

    +   - **-v** Returns only lines that don''t match the regular expression

    +   - **-w** Matches only whole words (not available in all versions of grep)


    Of these, the most useful are the -i option to ignore case and the -v option to
    reverse the search and return nonmatching lines.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Can I use grep -v to find files that don’t belong to me?


    Yes. Here is a quick way to find out if anyone has written files in your home
    directory that don’t belong to you:


    ```

    ls -lA | grep -v "$LOGNAME"

    ```


    This will return a list of only the files in the current directory that are not
    owned by you. There’s one exception: it would miss a file that included your login
    name in the filename even if the file belonged to someone else.


    # Is it possible to use grep -i for case-insensitive searching?


    Certainly. In fact, this can be quite handy for making sure that you use something
    consistently. For example, in this book we use "system administrator" as the form
    for that ultimate of UNIX gods, the superuser. But we found that sometimes we
    had the capitalization wrong and we weren’t consistent between "system" and "systems".
    So, we used the following to find all of these instances, complete with their
    line numbers in the file:


    ```

    grep -in "system.*" administrator chp[1-8].txt

    ```


    This translates into "search chp1.txt through chp8.txt for the string "system
    administrator" where the string may be upper or lowercase, or any mixture thereof,
    and where there may or may not be a single character after the "m" in system.


    > Warning: The "." wildcard by itself will fool you! If we had neglected to put
    an asterisk after the "t" in the above grep expression, it would have missed the
    times we spelled system administrator without the "s" at the end. But the asterisk
    said to match zero or more instances of the previous metacharacter.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Tip:


    If your version of grep supports the -w option, take advantage of it! It''s an
    option to match whole words only. You could, for example, look for all instances
    of "good" that were used as a whole word by using the regular expression "good",
    but this has a problem. What about a sentence that ends with the word "good"?
    It wouldn''t match. We can''t use the ".*" trick, since that would match "goody",
    and even "goodness". But if your version of grep will support the -w option, you
    can use


    ```

    grep -iw "good" files

    ```


    which will find all instances of the word "good" but not other words that have
    "good" buried within them. If your version of grep doesn''t support this option,
    by the way, it gets much harder. The following should catch virtually all instances,
    but we suspect that we will have missed something:


    ```

    grep -i "[\''\"\(\[\{good\] \''\,\.\?\!\]\}"


    ```


    Whew. That seems like just a bit too much work for the result. If your version
    of grep doesn''t support the -w option, you might want to ask your system administrator
    to get a copy of the GNU version of grep that does include this useful option.


    # What is a "regular expression"?


    We''ve tossed around the term "regular expression" fairly often throughout this
    book, and you will continue to see it in any additional reading you do about UNIX,
    including in the man pages. A regular expression is a string of characters, which
    may include wildcards and metacharacters, used by one of the text utilities as
    a search pattern. It looks much like the wildcards used by file utilities, and
    includes many of the same special characters, but is not quite the same.


    A regular expression describes the pattern you are looking for. It can include
    sets of characters like [aA], which would match both upper and lowercase instances
    of "A", or wildcards like "*", which matches any number of characters (including
    zero) but not special characters; or ".", which matches any single character.
    Two other useful metacharacters are ^ and $, which match the beginning and'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'end of the line, respectively. A complete description of regular expressions
    is way beyond the scope of this book. You can find highly specialized books on
    UNIX tools, but most UNIX manuals also include good descriptions.


    # What command should I use to compare two text files?


    Try diff. This is the one you will probably use most often. Its syntax is simple,
    but reading its output can be a bit annoying. The syntax is


    ```

    diff [options] file1 file2

    ```


    with the following options:


    +   - **-b** Ignores repeating white space


    +   - **-e** Creates a command script that can be fed to the ed editor to re-create
    file2 from file1


    +   - **-f** Creates a script to re-create file1 from file2


    +   - **-h** Disables -e and -f options; fast but less rigorous


    If the two files are pretty similar, this can be a useful way to check to see
    what has changed. Redirect the output from diff -e to a log file, and you can
    see what was changed in the file and decide if that change was appropriate.


    # Is there a way I can compare three similar files to find differences among them?


    Yes, use diff3. The resulting output lets you see what has changed, and in which
    file it has changed. You can actually do a pretty decent version control system
    based on this command.


    # What’s the best way to compare binary files?


    Use the cmp command. This lets you see if two apparently identical files actually
    are the same. For example, this is useful if the file sizes are the same but you
    think someone has accidentally changed one. When used with the -s option, you
    get back simply an exit code—0 if they are the same, 1 if they are different,
    and 2 if one or both of the files were inaccessible.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# TEXT MANIPULATION TOOLS


    # What can the more command do for me?


    The more command lets you look through a file a page at a time by pressing the
    space bar. Press the "b" key to go back a page at a time. You can use /regex to
    jump ahead in the file by searching for the regular expression, but you can''t
    search backwards. There are other, more flexible paging programs around, however,
    so if you find yourself frustrated by the limitation of more, ask your system
    administrator to get a copy of less for your system. This little program lets
    you page back and forth through the file, and is quite a bit handier than more.
    Or get in the habit of using vi in its read-only form, view, as a substitute.


    # Can I pipe the output of long directory listings to more to prevent them from
    scrolling off the screen?


    Absolutely. Once you get in the habit of using ls -lAF as your directory listing
    command, it''s hard to give up all that extra information, which is why we suggested
    you make a simple alias out of it to ll (for Long Listing). But the downside is
    that it is much more likely to scroll off the screen than a simple ls will. So,
    pipe the result to more, and you will be able to see your listing a page at a
    time—ll | more.


    # How can I see just the beginning of a file?


    Use head. Most versions of UNIX come with a program called head that will show
    you just the first few lines of a file (or of standard input if you are piping
    something to it). You can control the number of lines shown by using the -nn option
    on the command line, where nn is the number of lines to show. The default is usually
    ten. This command is extremely useful if you are looking for a particular file,
    for example, but can''t remember its exact name. But you do remember that you
    had a particular phrase in the header of the file. If it''s one of several files
    that end in .ksh, then try this command to find the file you want.


    ```

    head *.ksh | more

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'This will show you the first ten lines of each file, complete with a one-line
    header to give you the filename. Figure 9-1 shows a typical result.


    # Is there a way I can use head to find the files that have changed recently?


    You know that the file you want is in the directory somewhere, and you just worked
    on it yesterday, so it should be one of the first files in the list if you sort
    your listing by date. Try


    ```

    ls -tIA | head -20

    ```


    to see just the last 20 files that have been modified.


    # How can I see just the end of a file?


    Use tail. The tail command works exactly like the head command, except that it
    shows you the end of the file, not the beginning. This makes it extremely useful
    for looking at things like log files, which grow over time. You don''t want to
    have to read through the whole file to see what''s happened; you just want to
    check the last few lines for recent changes.


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_174_0.png)


    Figure 9-1 Use head to find the file you need'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Since all the changes will be at the end of the file, tail is perfect for this
    purpose.


    # Is it possible to send output to both a file and my terminal?


    Yes, with the tee command. We use this one all the time when running full backups,
    for example. The output goes to a log file, just in case we want to check later,
    but it''s nice to have the output going to the screen as well. That way, you can
    do something else and just glance over to the screen periodically to see how the
    process is doing. For example, you might do a backup with a command like this:


    ```

    tar -cvf /dev/dat / | tee -a /tmp/bkup.log

    ```


    The -a in the command tells tee to append its output to the file, not overwrite
    it.


    # Can UNIX spell check my files for me?


    Yes. UNIX comes with its own built-in spell checker, spell. Just take any text
    file and run the spell command on it, and UNIX will tell you which words it thinks
    are misspelled. The syntax is


    ```

    spell [options] [files]

    ```


    The most useful of the options is +wordlist, where wordlist is a file containing
    a user dictionary of words not included in the main dictionary. A useful way to
    set this up is to create a special dictionary for a given project that might have
    some specialized words or jargon that is used with it. Then keep that word list
    in the home directory of the project. You can even have an environment variable
    point to it so that it''s easy to change or update your scripts.


    # Is there a way to get spell to create a custom dictionary for me?


    Here''s an easy way to create that custom dictionary. Run spell twice. The first
    time, use something like this:


    ```

    spell project.doc > words.special

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The document you''re checking is project.doc, and the output of the spell check
    is being directed to your own custom directory, called words.special in this example.
    After you run the spell program, edit the file words.special to remove any misspelled
    words, but leave in the jargon or other specialized terms you''re using in your
    project. Now you have a custom dictionary for the project. Run the rest of your
    project files through spell to search for misspelled words as follows:


    ```

    spell +words.special proj*.doc > words.wrong

    ```


    Now you have the actual misspellings (that don''t include your specialized terms)
    in the file words.wrong. You can use your editor (vi, we hope) to search files
    for words that are in words.wrong. You''ll be able to find and correct actual
    misspellings without being continually asked about your specialized words.


    # How can I create a sorted file?


    UNIX comes with its own sort command. By default, it is case-sensitive, but you
    can easily turn that off with the -f option. sort can be used to sort output by
    the beginning of each line (the default) or by any field within the line, where
    fields are separated by either white space (tab or space, the default) or some
    other specified character. To sort the /etc/password file by group, you would
    use


    ```

    sort +3n -t: /etc/passwd > /tmp/sorted.passwd

    ```


    This says to sort the file by the fourth field (skip three fields and start sorting
    with the first digit of the fourth field), use a delimiter between fields of ":",
    and send the output to the file /tmp/sorted.passwd.


    # Is it possible to clean up mixed-case files?


    Yes. The translate utility, tr, is a handy little command that takes input and
    converts all the characters that are in one set of characters to the corresponding
    set in a second set. Probably its most common use is to convert a file or command
    to all upper or all lowercase characters. For'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'example, to convert a file that is mixed upper and lowercase to all uppercase,
    try the following:


    ```

    cat mixed.case | tr "[a-z]" "[A-Z]" > /tmp/upper.case

    ```


    This takes every instance of a letter in the first set of characters ("[a-z]")
    and converts them to the corresponding character in the second set ("[A-Z]").
    Note that this command is no smarter than you might expect, and knows absolutely
    nothing about the two strings you give it, except that they are the same length.
    So here is an easy way to do a very simple encryption of a file:


    ```

    cat file | tr "[a-z]" "[A-Z]" | tr "[A-Z]" "[B-Z]A" > file.shifted

    ```


    Of course, it wouldn’t take a cryptographer longer than a few minutes to figure
    out that you’d shifted each letter one position. But it’s probably not professional
    cryptographers who are peering at your files when they shouldn’t. It’s easy to
    do, and even easier to undo when you want to read the file.


    ```

    cat file.shifted | tr "[B-Z]A" "[A-Z]" > file.unshifted

    ```


    But if your needs for security are more serious than just keeping nosy eyes away
    from a sensitive file, you’ll want to use the crypt command discussed below under
    "Miscellaneous Tools."


    # MISCELLANEOUS TOOLS


    # How can I compress a file?


    Use compress. This gem can save you tons of disk space for files that you really
    need to keep available on disk but you don’t have to use very often. Just compress
    them, and when you need them for something, use the uncompress option. Compressed
    files have a filename that ends in .Z and they can take up significantly less
    space, depending on the type of file. For example, the TIFF graphic files will
    compress to about 5 percent of their original size, and our daily database exports
    compress to about 25 percent of their original bulk.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The amount of compression for other files will vary widely. Text files compress
    nicely; program files compress hardly at all. To compress a file or files, use
    **compress filenames**. To uncompress a file, use **uncompress filenames** or
    **compress -d filenames**. Both are the same, and both assume that the file to
    be uncompressed ends in **.Z**, so you don''t need to add that to the command
    line.


    # What''s the easiest way to encrypt an important file?


    Use the **crypt** command. This command is based on the famous Enigma encoding
    machine developed in Germany, but with a 256-element "wheel." As such, it can
    be broken, but not easily and not without a substantial amount of computing time
    and power, especially if the password used is not short. The **crypt** command
    is not available on versions of UNIX shipped outside the U.S. due to export restrictions,
    and may not be on the shipped version you receive even in the U.S. unless you
    specifically request it. If you have it, it''ll provide a high level of security.
    The **crypt** command has the syntax **crypt [password] < infile > outfile**.


    # Is there a way I can use the cal program to print a quick calendar?


    Yes. This little prize produces, with no options, either a three-month calendar
    across your screen or a one-month or one-year calendar depending on what you ask
    for. The result of **cal** and **cal september** are shown in Figure 9-2.


    # Can I use the calendar program to create a tickler file?


    Certainly. Actually, you create the tickler file with **vi** or your favorite
    editor, and it should have the format **date event-description**, where each event
    is on a single line, and the dates are in some sort of reasonable form that **calendar**
    can interpret. Then add the command to your **.profile file** so that you get
    reminded every time you log in'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Chapter 9  The UNIX Toolbox


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_179_0.png)


