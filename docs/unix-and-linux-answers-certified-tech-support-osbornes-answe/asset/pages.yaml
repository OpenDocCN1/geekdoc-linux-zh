- pgno: 321
  md: '# Appendix C  Glossary


    **UUCP (UNIX-to-UNIX System Copy)**  Program that copies files from one system
    to another over ordinary phone lines.


    **vi**  A very powerful text editor that’s packaged with most UNIX systems.


    **window manager**  X Window program that defines how other programs appear and
    behave onscreen.


    **Windows 95**  A popular 32-bit graphical operating system for PCs, made by Microsoft.


    **Windows NT**  A cousin of Windows 95, with enhanced networking capabilities.


    **working directory**  The directory you’re currently in. The **pwd** command
    tells you your working directory.


    **X server**  A program that draws the screen display if you use the X Window
    System or one of its relatives.


    **X terminal**  A terminal that can act as an X server but relies on a machine
    elsewhere on the network for most of its computing power.


    **X Window System**  Graphical windowing system developed by MIT that’s the basis
    for fuller interfaces such as Motif or Open Look.


    **Xterm**  A popular X Window program that provides a command-line interface to
    the UNIX operating system.'
  merge: -1
  img_proc: true
