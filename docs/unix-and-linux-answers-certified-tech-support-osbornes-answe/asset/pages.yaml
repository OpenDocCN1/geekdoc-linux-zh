- pgno: 27
  md: 'We''ve tried to organize this book in a reasonable way—sort of in the order
    you''d be learning UNIX if you were a newcomer. But you can use it in any order
    you like.


    Chapter 1 presents the top ten FAQs (frequently asked questions) about UNIX. Here
    you''ll learn the answers to the UNIX questions that everyone (whether newcomer
    or expert) is asking.


    Chapter 2 gives you an introduction to and overview of UNIX, as well as all-important
    procedures for logging on and getting going. You''ll find out about ways to set
    up your terminal and map keys to suit the way you work. You''ll also find smart
    ways to pick a secure password and keep it private.


    Chapter 3 shares shortcuts for navigating the UNIX filesystem and directory structures—how
    to name files, find strays, and move around your directories with maximum efficiency.


    Chapter 4 concentrates on vi, the fabulous, flexible (though just a bit intimidating)
    text editor that comes with virtually all versions of UNIX. You''ll find lots
    of clever ways to make your text editing go faster.


    Chapter 5 gives you good ideas for customizing your work environment. Because
    UNIX, in general, is a rather drab-looking environment, this chapter takes on
    the tasks of beautifying your computer while making it more efficient. Prompts
    and colors and other decorative arts are covered with handy shortcuts. If you
    have to switch from DOS to UNIX and back again, you''ll particularly appreciate
    the section on making painless transitions.


    Chapter 6 is all about printing. Printing can present a complex series of problems
    in a UNIX environment. This chapter gives you the information you need to produce
    your print jobs expeditiously. Because you''re likely to be on a network, you''ll
    also learn how to share a printer and not step on toes.


    Chapter 7 is full of tips on running your programs in the most efficient manner.
    There are shortcuts and insights that can help you every day—such as how to run
    foreground and background operations and when to use both.


    Chapter 8 has all the cool stuff about the graphical user interface X Windows.
    You''ll learn about fonts, training your'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'mouse, and how to configure the X Windows environment to suit the way you work.
    This chapter also includes descriptions of many of the handy little (and not so
    little) programs that come with X Windows, and tips on which ones to ignore.


    Chapter 9 takes you through the tools of your trade—tools that will make your
    life easier. You can turn to any page in this chapter and find secrets of the
    UNIX gurus that you can put to use at once. There are tools to help you navigate
    as well as manipulate files with ease. This chapter alone can double your arsenal
    of UNIX shortcuts and tricks.


    Chapter 10 focuses on connecting to other computers. UNIX is the language of connectivity,
    and to get connected you need to know the magic words to send out in order to
    get replies. Chapter 10 also gives you useful information on network etiquette
    (or netiquette, as it’s known).


    Chapter 11 fills you in on the details of how to integrate UNIX and NT seamlessly
    on your network. You’ll learn how to make UNIX and NT machines "talk" to each
    other, and how to make your UNIX server function as part of an NT domain or workgroup,
    and much more.


    Chapter 12 will show you how to avoid the UNIX mine fields that are waiting for
    the uninitiated. You’ll see why UNIX can be not only a stimulating place to work
    but a dangerous one as well because it has no built-in security devices. This
    chapter gives you information that’s hard to find anywhere else on keeping your
    UNIX environment safe. Included are ingenious and, best of all, easy ways to keep
    your work secure.


    Chapter 13 shares some secrets of the Korn shell with you. You’ll learn about
    variables and parameters, how the Korn shell does math, how it handles string
    operators, what predefined variables it offers you, and, last but not least, the
    ins and outs of flow control in Korn shell programs.


    Chapter 14 introduces you to Linux, perhaps the most popular low-cost version
    of UNIX available today. This chapter includes Linux basics, as well as information
    about keyboard and password security issues and the availability of shells, text
    editors, and X Windows for Linux users.


    Chapter 15 moves you forward to a more advanced level. Here we take you into some
    of the structure and'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'programming constructs of the Korn shell—including tidbits about awk, perl,
    and sed—that can make you look like an expert, streamline your tasks, and impress
    others.

    This book also has appendixes that include a glossary, command reference, and
    resource guide, which should help you if (or, more likely, when) you get stuck.
    Don''t forget about the appendixes because you never know when they might come
    in handy!


    # STANDARD CONVENTIONS


    It''s probably helpful if you know exactly what the conventions that we''ve used
    in the book are, so here goes:


    +   - **boldface** is used for UNIX terms and commands, as well as for user input.

    +   - *italics* provide emphasis and highlight important terms.

    +   - SMALL CAPS indicate keypresses.

    +   - `Courier font` is used to separate lines of code from plain old text.


    # SPECIAL FEATURES


    This book also includes some special features that you should know about, namely
    the @ a Glance sections, which provide an overview of each chapter; sidebars,
    which contain in-depth answers to questions raised elsewhere in a given chapter;
    and notes, tips, and warnings, which present brief asides and opinions relevant
    to the question at hand.


    # YOUR FAVORITE TRICK


    Most of the tricks, tips, and warnings used in this book came out of experience
    and luck (both good and bad). But because UNIX is made up of hundreds of commands
    that can be combined in millions of ways, we''re sure there are some truly cool
    tips we don''t know about. You can imagine how annoying *that* thought can be!
    So if you have a trick—whether it''s neat and clean, down and dirty, or sneaky
    and underhanded, we''d love to hear about it.'
