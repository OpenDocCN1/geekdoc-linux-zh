- pgno: 7
  md: '# About the Authors


    Charlie Russel is the manager of information systems at an independent software
    company in the health care field. Before that, he spent nearly a decade administering
    a UNIX and Windows NT network at a car manufacturing plant. He is the author of
    ABCs of Windows NT Workstation 4 (Sybex) and co-author with Linda Gaus of SCO
    OpenServer: The Windows Network Solution (Prentice-Hall).


    Sharon Crawford has been hanging around the computer publishing business for more
    than seven years. After stints as a technical editor and development editor, she
    took up writing full-time in 1993. She is the co-author of Windows NT 4 for Dummies
    (with Andy Rathbone) and has written numerous books and articles on Windows 95,
    OS/2, UNIX, and Windows 3.1.


    Together, Sharon and Charlie have written more than a dozen books about Windows
    NT, Windows 95, UNIX, OS/2, Windows 3.1, and DOS. Their titles include Running
    Microsoft Windows NT Server 4 (Microsoft Press), Windows NT and UNIX Intranet
    Secrets (IDG), Upgrading to Windows 95 (Sybex), Voodoo UNIX (Ventana), and OS/2
    for Windows Users (Sybex).'
  merge: -1
  img_proc: true
