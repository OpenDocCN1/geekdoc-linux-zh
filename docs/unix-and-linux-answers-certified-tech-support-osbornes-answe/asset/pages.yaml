- pgno: 182
  md: '# Connecting @ a Glance


    Working on your single workstation or terminal is nice, but it isn''t really what
    UNIX is all about. UNIX has been and will continue to be primarily a networked
    operating system, and this means some changes in thinking and behavior for those
    of us brought up in the DOS or MS Windows world. In this chapter we will explore
    some of the features and foibles of UNIX workgroups and workgroup relations.


    Next we''ll get into some of the tools that are primarily for bigger and more
    diverse networks, including the big bold world of the Internet. Connecting to
    the larger world is becoming more crucial every day, so here''s what you need
    to know to get started.


    # WORKGROUPS AND WORKGROUP RELATIONS


    # UNIX and Workgroups


    When you work in a local network, there are lots of ways you can take advantage
    of the distributed nature of the UNIX networking environment. Some UNIX systems
    have one large central server, much like a PC network, but others use multiple,
    smaller workstations. Both work, and if set up properly, will look very much the
    same to the users. But there are some important differences. If you have, for
    example, a large central server, and only terminals located at each desk, then
    the concept of copying files from machine to machine makes little sense, since
    they''re all stored on a central machine. But if you are working in a distributed
    environment with multiple workstations, each of which may be the server for a
    different program or function, then the time will come when you need to copy files
    around to get them on the machine you need them on. But even here, much of this
    should be handled transparently, usually with a common $HOME directory structure.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'We’ll look at this local situation as if it were a distributed workstation
    environment—that is, multiple workstations, each with their own hard disks and
    processors, as well as some workstations that might not have a hard disk, or that
    might even be simple terminals or Xterminals. But don’t worry if you are in a
    situation with one big central server and only terminals or Xterminals. Most of
    this will still apply to you, and if it doesn’t, just skip over the irrelevant
    part(s).


    # What is the single most common need in a local network environment?


    Without a doubt, the need to share files with others in your workgroup. UNIX makes
    this simple, and we’ve actually already touched on some of the tricks to do this,
    but here we want to pull all that together. For some of this, you may well need
    the help of your system administrator to set up the initial group and directory
    structure, but once you get it all set up, you should be able to handle your files
    comfortably within your own group.


    # What’s the best way to handle file sharing?


    Designate one person in your workgroup as a local system administrator. To distinguish
    this person from the main system administrator, let’s call him or her the project
    manager. And, by the way, usually the best person for this position is the actual
    project manager or team leader for the group. Usually this person won’t have all
    the powers of the main system administrator, but will serve many of the same functions.
    The project manager will be the owner of the main files and directories that the
    group will use, and will be the contact point between the workgroup and the system
    administrator. This makes it easier on the system administrator, who won’t have
    to be constantly tweaking permissions, ownerships, and other such stuff for the
    group. This tends to make the system administrator more likely to be willing to
    help when you do need something. More important, it means that most of the time
    the workgroup can'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'handle its own day-to-day operations, doing things in a way that makes it easier
    for everyone in the group, who will not have to wait to get something taken care
    of until the system administrator''s priority queue finally gets around to the
    request.


    The idea here is that the project manager will own all of the directories and
    "core" files for the group. Then everyone in the group will share a special group
    id. As you develop templates and standards for the group''s work, you create those
    templates as read-only for the members of the group, and read/write for the project
    manager. If changes need to be made in a core file, the project manager makes
    the change, and it becomes available for all the others in the group. This is
    an excellent way to maintain standard forms throughout the group.


    The other set of files that the project manager will have to worry about are resource
    files. These could be X or Motif resources to ensure the presence of standard
    buttons and styles (including fonts and colors) that are used in a programming
    project, a standard set of vi macros that everyone uses, or just the environment
    variables that control locations of files and inclusions.


    # How can I make my workgroup''s directory local?


    Use NFS mounting. This will require the initial intervention of the system administrator
    to set everything up, but once established, it will allow the members of the workgroup
    to be working on different machines without having to be logged in to one single
    machine. This has several hidden benefits. Since everyone in the workgroup is
    working at his or her own workstation, each person has things arranged according
    to personal preference; yet files, scripts, and so forth that are common to the
    group all appear in the same relative place for everyone in the group. A second
    benefit is that the processing load is spread across multiple machines so the
    system won''t tend to load down unduly when you are all working on a project at
    the same time. The catch to this, of course, is that you may need multiple versions
    of specialized software that you are using. If it''s all located on one machine,
    that machine still ends up doing all the processing.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# What tools does UNIX offer me that can facilitate workgroup communication?


    The UNIX tools range from the simple ping that lets you know if a machine is even
    connected, to commands like talk that let you carry on a conversation with another
    user on the network, to the various electronic mail programs that let you send
    email to your workgroup and beyond.


    # What can ping do for me?


    It can tell you which machines are currently available. The ping program is probably
    the most basic UNIX networking command. It simply sends a tiny little packet to
    the address you give it, and then listens to see if the other machine "echos"
    back the packet. You can use the machine''s Internet address, which looks something
    like 192.78.222.81, or you can use the machine''s name as in:


    ```

    ping rcii

    ```


    The name will be either the one in your local hosts file or as resolved by the
    network nameserver, but in any case will be the name the network expects to use
    to find a particular machine. The result of ping will look something like that
    in Figure 10-1. If a machine doesn''t respond to ping, it won''t respond to anything
    else, because the network simply can''t see it. Time to make an offering to the
    system administrator, unless the reason is simple and obvious, like the machine
    is turned off for some reason. In which case the system administrator is probably
    already involved, because rebooting a UNIX machine is not as simple as it is with
    a DOS machine.


    # What''s the best way to send a quick message to another user logged in to my
    machine?


    Use write. write is perfect for sending a quick message to another user who is
    either on a terminal connected to your workstation or remotely logged in to it.
    For example, you can easily send a message to the project manager who is remotely
    logged in to your workstation with


    ```

    write yasmine k

    ```'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_186_0.png)


    **Figure 10-1** The ping program is used to find out if a machine is on the network


    She would then answer back by responding with a similar write command to you.
    You could then suggest a meeting, or whatever, and when you were done, the command
    would terminate when you send an End Of File (EOF) character, usually a CTRL-D.


    > **Warning:** The write command writes directly to the terminal. This can cause
    some programs, such as vi, to go quietly (or not so quietly) nuts. Before you
    get in the habit of using write or any command that writes directly to someone
    else''s display, you should have a clear agreement that this is acceptable behavior.


    # Is there a way I can turn off write permission to my terminal?


    Use **mesg n**. This will protect you from the problems that come from people
    sending messages to you while you are working with an editor like vi, which is
    not very compatible with write. To reenable message writing to your terminal,
    use **mesg y**, and others will again be able to write to your terminal.


    # Is it possible to allow others to write messages to me without interfering with
    my work?


    Yes. If you are using X Windows, keep one Xterm window just for write conversations.
    When you’re in a workgroup'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'and you want to be able to send messages back and forth without causing each
    other problems, designate a specific window for "chatting" with each other. We
    like to use ttypl as our chat window, and we keep it open but in the background.
    When a message comes in to that window, we get a beep and we just click on the
    window to pop it up to the top.


    # How can I chat with another user who is on a different machine?


    Use the talk command. talk also writes directly to your screen, but it will split
    the screen into two separate halves, one for what you are writing and one for
    what is being sent to you by the other user. Even more than with the write command,
    you need to be sure that the person receiving the request to talk isn''t in the
    middle of something else. However, you can talk to a person on another machine
    in your workgroup just as easily as if that person were simply on another terminal
    attached to your machine. To chat with another user, the syntax is


    ```

    talk username@hostname

    ```


    where username is their login name, and hostname is their machine''s name as defined
    in the hosts table.


    # Can I send a message to everyone who is logged in to my computer?


    Yes, with the wall command. Be aware, however, that it won''t cross over to other
    machines, so you can''t really use it to send a message to everyone on the network.
    In a traditional UNIX environment with a single large server and lots of terminals
    connected to it, this works perfectly. But in today''s more modern distributed
    workstation environment, you''ll have to use one of the mail commands to reach
    everyone in your workgroup.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# My workstation has suddenly slowed down and I suspect that someone is chewing
    up more than his or her share of memory and CPU time. How can I find out who the
    culprit is?


    Use the **who** command to see who is logged in to your workstation. This command,
    which has lots of other options, is the ideal way to see who is logged in to your
    computer when used in its simplest form. The result looks like Figure 10-2.


    The **who** command has lots of other options, mostly of interest to system administrators,
    but one option you might find useful is **-a** (for all). The output from this
    command may give you a bit more information than you really want, but if you combine
    it with **-H** (so you get headings to tell you what column is what), you can
    pick out the information you want. Figure 10-3 shows the output of the **who -aH**
    command.


    # How can I solve an identity crisis?


    Use the **who am i** command. If you have more than one account on a system, or
    are using a shared account for a project, you can find out who the system thinks
    you are, and which terminal or pseudo terminal you are logged in on with this
    command. And yes, you really do type it as three separate words. This is probably
    the only such command in the entire UNIX command set. Some systems support a


    ![](img/0c1fc10350aa06ca92e7921c96c628ec_188_0.png)


    Figure 10-2  Use who to see who is logged in to your computer'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_189_0.png)


    # Figure 10-3 The who -aH command tells you who''s on the system and what''s going
    on


    different version of this command—whoami as a single word. If yours does, it can
    help you find out what account you are actually logged in to right now.


    # Is there a command I can use to get just the real logins of people using my
    machine?


    Try who -f. This option strips out any pseudo terminals that would be included
    in the command, giving you just a list of actual logins. If you are running the
    X Window System, this can be a more meaningful result.


    # How can I find out more about the people on my machine?


    Use finger. This command, which isn''t supported on all versions of UNIX, tells
    you about not only the people who are logged in to your machine, but how long
    they have been active on your system, what their real names are, and all'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'sorts of other stuff as well. You can also use this in a network to get information
    about other people not currently logged in.


    # How can I find out where I am?


    Use the hostname command. If you work in a distributed environment and you often
    have to log in to other machines, it can be a nuisance to keep track of which
    machine you''re on at any point. This is especially true if you''re working in
    X Windows and have several different terminal windows open. Use this command to
    find out where you are. If you find yourself doing this a lot, add it to your
    prompt by putting a pair of lines like this in your .profile:


    ```

    host=$(hostname)

    PS1=''$(hostname.*):$PWD \$ ''

    ```


    You will then get a prompt like this:


    ```

    rci:/users/charlie $

    ```


    which gives you a constant reminder of who and where you are. If you like multiple-line
    prompts, just insert a ^J into the string in front of the \$ and you will get
    a nice two-line version of the prompt.


    # What''s the best way to communicate with my workgroup?


    Use mail or one of the many improved versions of it. Actually, mail makes it almost
    as easy to communicate with your friends across the world as with your coworker
    in the next office. There are almost as many different improved versions of the
    basic mail program as there are versions of UNIX, but one that is widely available,
    easy to use, supports both text modes and graphics modes, and works on virtually
    any system is the elm package. Written by Dave Taylor, this program is available
    in the public domain (in other words, you don''t have to pay for it or license
    it in any way). If you don''t have it on your system, and the mail package you
    do have is hard to use, ask your system administrator to get a copy of elm. Everyone
    will be happier. It''s available from a variety of anonymous ftp sites (more on
    what that means shortly), including tut.cis.ohio-state.edu.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# ### What are the r commands and what can they do for me?


    The r commands are a group of remote commands that make life much easier on a
    local network. Plus, they provide some useful tricks on your own local machine
    since they have some options that the more traditional commands lack. The commands
    in this group are:


    +   - **rcp** — The remote version of the **cp** command

    +   - **rlogin** — Logs in to another machine

    +   - **rcmd** — Executes a command remotely

    +   - **rsh** — Same as **rcmd** on systems where it exists


    These commands make it simple to move around, execute programs, and manipulate
    files in a distributed environment. On many systems, the **rsh** command is reserved
    for a restricted form of the Bourne shell, and on these systems the command is
    called **rcmd**. But in either case, they allow you to open a shell on a remote
    system and execute a series of commands that are then displayed on your system.
    The **rlogin** command allows you to log in to the remote machine and execute
    commands just as if you were sitting at a terminal connected to it. And the **rcp**
    command allows you to copy files or whole directory structures between machines.


    # ### Can you give me an example of how to use rlogin?


    Let''s try using **rlogin** to work interactively on another machine. This command
    is perfect when you want to work on the other machine just as if it were your
    own workstation. The syntax is


    ```

    rlogin remotehost [-l username]

    ```


    Depending on how the system administrator has set up permissions, you may not
    even need to give a password on the remote machine. And if you have to do this
    often, and have accounts on both machines, you can—and should—create a .rhosts
    file on both machines that allows you to log in without a password. Your account
    on the remote machine doesn’t even have to have the same username, as long as
    the'
  merge: -1
  img_proc: true
- pgno: 192
  md: '.rhosts file is set correctly. This file should have lines of the form


    ```

    hostname username

    ```


    where the hostname is the actual hostname as given in /etc/hosts, not an alias,
    and the username field is the actual user''s login name on the remote machine.


    # Are there other clever uses of rlogin?


    Yes. Use it to log in to your own machine as a safety check when you make changes
    to your configuration. This single trick will save you a lot of time and aggravation
    if you just remember to do it before you log off. By doing (or attempting to do)
    a remote login to your own machine, you will force a new read of your configuration
    files, allowing you to test those changes you just put in without logging all
    the way out. That way, if you did something really fatal, you can just back out
    and restore the saved version you made first. You did make a copy before you started,
    didn''t you?


    # What is rcmd or rsh really good for?


    Use rcmd or rsh, whichever is on your system, to run a single program on another
    machine. This command is the one to use when you want to launch a program or script
    on another machine, but don''t need to actually work with multiple programs on
    that machine. Here you must have an equivalency set up using .rhosts on the remote
    machine, since you can''t be prompted for a password. This command has the syntax


    ```

    rcmd [-l username] hostname command

    ```


    If this program is known as rsh or remsh on your system, substitute the appropriate
    command. In any case, they all work essentially the same, and all have the same
    pitfalls. Because they don''t prompt for a password, they can constitute a potential
    security problem if the program they are running on the remote machine allows
    the user to shell out from the program. Furthermore, it can be tricky to set up
    these commands since in some cases, errors are not necessarily passed back through
    to you, but are eaten by the'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'spawned shell on the remote machine. But they do have the undoubted advantage
    of simplicity once they are set up. You can include the commands inside a shell
    script, and then make that shell script available to all the users in your workgroup.
    They don’t have to know anything about the nitty-gritty details of how it works,
    only that when they type wp they will start WordPerfect to edit the documents
    they are working on—even though the WordPerfect server isn’t their machine at
    all.


    # How should I use the rcp command?


    Use the rcp command to copy files and directories from one machine to another.
    Within a local network, this is by far the easiest way to move files around. The
    syntax is similar to the familiar cp command, but now you need to add a machine
    name for the remote machine. So the command will have the syntax


    ```

    rcp [options] remotehost:sourcefile localfile

    rcp [options] remotehost:sourcefiles localdirectory

    ```


    where the remote and local side of the command can be reversed. The options available
    are -p, which preserves the times and permissions of the remote files, and -r,
    which copies recursively down the directory structure below the starting remote
    directory. This last is a powerful addition that not all versions of the regular
    cp command support, but that allows you to copy entire directory structures with
    a single command.


    # Can rcp still help me even if my version of cp doesn’t support recursive copies?


    Yes. You can still use rcp -rp to copy an entire directory structure on your local
    machine. Some versions of UNIX still don’t support a smarter and more powerful
    version of the cp command that will handle recursive copies, but even these support
    it for remote copying, so cheat! Use rcp within your own machine, but treat one
    side of the command as if your local machine were in fact a remote one. To copy
    the /tmp/local/bin directory and all the directories under it to /usr/local/bin
    on your own machine, use this coding:


    ```

    rcp -rp localhost:/tmp/local/bin /usr/local/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Voilà! Maybe someday soon your UNIX vendor will get with the program and make
    this workaround unnecessary, but in the meantime you have a way to get mv across
    filesystems.


    # CONNECTING TO THE LARGER WORLD


    # What is ftp and how do I go about using it?


    ftp is short for file transfer protocol. If you have to transfer files between
    different machines running different operating systems, such as from a UNIX machine
    to a DOS or MS Windows PC, your best bet is probably ftp because it is supported
    on a broad range of platforms and operating systems. We won’t go into all the
    different commands that ftp supports, or all the ways that it can be used, but
    a typical ftp session might go something like this.


    +   1. Start **ftp** by typing **ftp** on the command line. At this point, you
    can add the hostname of the machine you want to initially connect to. The available
    options are:

    +      - **-d**  Enables debugging mode

    +      - **-g**  Disables filename globbing

    +      - **-i**  Disables interactive prompting

    +      - **-n**  Doesn’t automatically log in upon initial connection

    +      - **-v** **verbose**  Shows additional information about what is happening

    +      - **-t**  Turns on packet tracing

    +   2. Next you will connect to the remote site using **open host**, where host
    may be a simple local hostname, or a fully qualified hostname if you are attempting
    to connect to a remote machine.

    +   3. You will be prompted for an account and a password on the remote system.
    If you are out on the Internet, and are trying to get a file that someone told
    you about but you don’t have an account on the remote machine, use **anonymous**
    as the user, and when prompted for the password, answer with your email address.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   4. Find the files you are looking for, using cd to change directories and
    ls to list the contents of the directory.

    +   5. Set the mode of transfer to either ASCII or binary. The default is ASCII,
    so if you need to transfer a file that isn''t ASCII, issue the binary command.

    +   6. Transfer the files. Use get to copy the files to your local machine, or
    put to transfer a file from your machine to the remote machine.

    +   7. Disconnect from the remote machine with the close command.

    +   8. Exit out of ftp with either quit or bye. Both do the same thing.


    There are far more commands available for ftp, but these are the basic steps to
    get you started. Print a copy of the man page for ftp before you start, and keep
    it next to your terminal and you should have no problems. Most of the commands
    are either the same as their UNIX equivalents or very similar.


    # How can I use telnet to connect to a remote computer?


    The telnet command is similar to the ftp command in one important way. It''s designed
    to work across a broad range of platforms and types of terminals or displays.
    And like ftp, telnet has its good and bad points. If it''s pretty and mouse button
    aware you want, telnet is not the tool for you, but if you have to connect to
    a remote computer with something reliable, telnet will usually do the job. To
    open a telnet session, use the syntax


    ```

    telnet [options] [hostname]

    ```


    where the options include


    +   - -a Automatic login

    +   - -l user Sends the username if the remote system can accept it

    +   - -r Uses a similar interface to rlogin, with the escape character set to
    ~'
  merge: -1
  img_proc: true
- pgno: 196
  md: There are other options covered in the man pages, but these are the most common
    ones. Once connected to the remote machine, you can execute commands in a subshell
    with the ! command, get help with the ? command, or basically type in any command
    you would normally type in if you were remotely logged in to that machine. There
    are, however, a vast and hopelessly confusing set of options and toggles you can
    set inside telnet that allow you to configure and manipulate it so that it can
    handle almost any kind of system on the other end that will let you connect in
    the first place. If you really need this kind of complexity, nothing else will
    do. Start with the man pages and an intimate knowledge of the quirks and foibles
    of the remote system and your system, and you should be able to get it all to
    work. But for most people, if you just treat telnet as if you had a simple, text-based
    login to the remote machine, you will be fine.
  merge: -1
  img_proc: true
