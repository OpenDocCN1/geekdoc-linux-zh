- pgno: 164
  md: '# Can I use the Motif resource file to add features to X?


    Yes. The Motif window manager allows you to add commands to its menus, and even
    change the behavior of the mouse buttons and keystrokes. We aren''t going to go
    into all the different ways you can do this, or the many different things you
    can add with this file. But here are some suggestions that will give you some
    ideas of the kinds of things you can do. But first, a word of caution. Always
    make a copy of your working configuration before you make changes. Right. Heard
    that one before, have you?


    > Warning: Always make a copy of any configuration file before you change it.
    Don''t say we didn''t warn you. Not that we always follow our own advice.


    Copy the default Motif resource file to your home directory. This makes a good
    starting place to try things. So first, before you do anything else:


    ```

    cp /usr/lib/X11/system.mwmrc ~/.mwmrc

    cp ~/.mwmrc ~/.mwmrc.original

    ```


    There. Now we have an immaculate copy of the current resource file stashed away
    for safekeeping, and we have a nice starting point for mucking around. Open it
    up with your favorite text editor (vi, of course) and you should see something
    like Figure 8-8. Depending on your version of Motif and X, the comment character
    may well be a "#" instead of the "!" you see here.


    # How can I use the Motif resource file to get help?


    Let''s add the Xman program to our .mwmrc file. Of course, if you don''t have
    Xman on your system, try the same thing with something else, like Xcalc or even
    xeyes! The resource command to execute a program, whatever it is, is f.exec, so
    let''s add the necessary line to our .mwmrc file. The syntax is "label" f.command
    "options", so what we want to do is move down to the first section after something
    that reads like "Menu RootMenu" or some such. Shouldn''t be'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/0c1fc10350aa06ca92e7921c96c628ec_165_0.png)


    Figure 8-8 The Motif resource file can be customized to add many additional features


    too hard to find. Then add the following line, somewhere in the middle of this
    section:


    ```

    "Xman" f.exec "xman"

    ```


    Save the file and use the built-in restart command for Motif Click the mouse in
    a blank area of the desktop and then select "Restart" from the menu. Confirm that
    you really want to do this, and Motif will restart. In the process, it will read
    your changed .mwmrc file, and you should now see an option for running Xman on
    the menu.


    # Is there a way I can add lines to my root menu?


    Yes, by using f.separator. Add a line with a label of no-label and an f.separator
    as the resource command to put a line in the menu. If you include a label of quoted
    white space and a command of f.noop, you will get a blank line in the menu. Figure
    8-9 shows a simple set of Motif menu'
  merge: -1
