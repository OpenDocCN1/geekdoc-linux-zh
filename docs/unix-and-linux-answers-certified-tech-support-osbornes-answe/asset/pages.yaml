- pgno: 60
  md: 'and id. Any files that the user creates are owned by that user and can only
    be read, used, or changed with the permission of the owner. If you get a "long
    listing" of a file, you can see this set of permissions. For example, a long listing
    of the file harold.cat might look like this:


    ```

    $ ls -lF harold.cat

    -rwxr-xr-x 1 crussel users 1136072 Aug 26 17:05 harold.cat*

    ```


    This says that the file is owned by crussel, who has permission to read, write,
    and execute the file—the first rwx in the file listing. Further, users of the
    same group ("users") have permission to read the file and execute it, but may
    not change or write to it—the second r-x in the file listing. And finally the
    world at large may execute the file, but not read it or write to it—the third
    --x in the listing.


    # How can I change a file''s mode or permissions?


    Use chmod. This command, which is short for "change mode," lets you easily change
    any file you own so that only those people you want can read it, change it, or
    execute it. There are three basic levels of users, as we saw above—the owner (user)
    of the file, the owner''s group, and everyone else (others)—and three levels of
    permissions—read, write, and execute. The three types of users are abbreviated
    "u" for user, "g" for owner''s group, "a" for everyone, and "o" for all those
    other people out there.


    The permissions are abbreviated the same as in the long listing above—"r" for
    read, "w" for write, and "x" for execute. So, to change the permission of the
    file harold.cat to allow users outside the in-group to read it, type in


    ```

    chmod o+r harold.cat

    ```


    The chmod command will let you make multiple changes to several files at once,
    so it is pretty easy to remove write permission from everyone and remove all permissions
    from those not in your group for all the .cat files:


    ```

    chmod a-w,o-rx *.cat

    ```'
  merge: -1
  img_proc: true
