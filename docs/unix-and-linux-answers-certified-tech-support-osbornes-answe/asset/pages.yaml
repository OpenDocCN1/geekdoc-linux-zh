- pgno: 93
  md: 'as you type them in text insertion mode. You can enter these commands directly
    in vi when you are in command mode, or include them in your .exrc file. We find
    it helps to have different sets of these for each project, and include them in
    a separate .exrc file in each project''s main directory.


    # How can I automate frequently used sequences that start in command mode?


    Use the :map command. The syntax is


    ```

    :map key replacement

    ```


    The key can be almost any key on the keyboard, but if it''s a function key or
    control key, you will have to "escape" its meaning by first entering a CTRL-V.
    So, for example, to map CTRL-F1 to run UNIX''s spell checker, and put the results
    at the bottom of the current buffer (file), the command is


    ```

    :map ^V G:w!^M:r !spell $^M

    ```


    The ENTER keys in this sequence would cause the map to terminate, so you must
    use the key sequence "CTRL-V, CTRL-F1, space, G:w!, CTRL-V, ENTER, :r, space,
    !spell, space, %, CTRL-V, ENTER". The ENTER keys have to be "escaped" with CTRL-V
    first. They appear in the command as ^M or CTRL-M, which is what the ENTER key
    actually is, of course. So what does this command do? First it moves to the bottom
    of the buffer, the "G"; then it writes out the current contents of the buffer
    to the disk file unconditionally, the ":w! Enter". Then it reads into the buffer
    the result of running the spell command on the current file, the ":r !spell %
    Enter".


    The total number of :map and :map! commands you can define at any one time is
    32 for most versions of vi, and they can be no more than 512 characters total.
    This should be more than enough for almost all purposes, especially if you split
    them into separate .exrc files for each task, which makes the most sense.


    # Is there a way to automate frequent tasks that start while in text insertion
    mode?


    Yes; try using the "map-bang" macros. For example, if you are the sort of person
    who likes to save your current work frequently (not a bad idea, though vi will
    usually be able to'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'recover even if you do crash or have a power failure), here''s a simple macro
    to save your current work and continue without losing your place in the file.


    ```

    :map! #= ^[:w!^Ma

    ```


    This command, which is mapped on the F3 key, begins with an escape to take you
    to command mode, then the ":w!Enter" sequence to write the current file out to
    disk, and finally an "a" to take you back into text insertion mode right where
    you left off. Note that both the "ESC" key and the "ENTER" key must be escaped
    with CTRL-V or they will be misinterpreted.


    # Can I use the map! command to make a text insertion mode command that behaves
    like the CTRL-G of command mode to see where I am in the current file?


    This one is handy if you just want to know where you are in the file without having
    to go out to command mode and come back. Well, actually you do have to go out
    and back, but it''s all automatic.


    ```

    :map! ^G ^[^V^Ga

    ```


    This one''s a little tricky. Because CTRL-G has a special meaning, you can''t
    just enter it, and if you enter a single CTRL-V it will escape what you are trying
    to do. So the trick to this one is that the first CTRL-G must be entered with
    a CTRL-V,CTRL-G sequence, then CTRL-V, ESCAPE,CTRL-V,CTRL-G, and a final "a" to
    go back into text insertion mode.


    # How can I reduce the number of keystrokes I need to enter for common phrases?


    Use :abbr. This one is so simple you should do it on the fly whenever you find
    yourself repeatedly using the same sequence. And it''s handy for creating standard
    phrases so that an entire workgroup uses the same wording for critical phrases.
    For example, while writing this chapter we must have used the sequence ".pgvi.pgx"
    a zillion times, since we wanted it to appear in "program text," not in regular
    text,'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'and the publisher wanted a ".pg" at the start of inline program text, and ".pgx"
    for when it was done. Well, that got awfully old real quick. So, we added the
    following abbreviation to my .exrc file:


    ```

    :abbr vvi .pgvi .pgx

    ```


    As you type along, abbreviations are automatically expanded to their full meaning
    as you go, unlike some word processors that wait until you explicitly tell them
    to expand the abbreviations.


    # OTHER ESSENTIAL COMMANDS


    # How can I save my changes and quit vi?


    To save your work and quit, you can use the command mode sequence ZZ or the external
    mode sequence :wq. We find the :wq more intuitive and easier to type, but to each
    her own. And if you want to create a series of function key mappings to do this,
    feel free. We have spent so much time with WordPerfect that we have my F7 key
    mapped to do this: map ^[[S :wq^]M. Other people we know have theirs mapped to
    ALT-F4.


    # Can I include another file in my current file?


    Yes; use the :r (read) command. This is handy if you want to include some standard
    header text, for example, that''s too big a block to put in a map or abbreviation.


    # Is it possible to write out part of my current file to a "scratch" file?


    Sure, you''ll just need to tell the write command how much and where. To write
    the whole current file back out, we use the short form of the write command :w.
    But to write out the next ten lines, including the current one to a file called
    "junk," use the longer form of write:


    ```

    :.,+10w junk

    ```'
