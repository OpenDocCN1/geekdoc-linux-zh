- pgno: 234
  md: '# Does the Korn shell provide for useful string substitution operators?


    Yes. These let you check to see what the value of a string is, and then substitute
    for the value, use a default, or exit out of the script. Table 13-3 shows the
    possibilities.

    You can use these operators to check if a variable has been set, and then do something
    depending on the answer to that test.


    > Warning: You can''t use the ${str:=expression} syntax to assign a value to a
    positional parameter. You''ll have to use an intermediate local variable to get
    the job done. This is one nuisance in the Korn shell for which we have yet to
    see a good explanation or justification.


    | Operator | Substitution |

    |---|---|

    | ${str:=expression} | If str is unset or null, it returns expression and assigns
    expression to str as well. If str has a value, it returns that value. |

    | ${str:-expression} | If str is unset or null, it returns expression but doesn''t
    change str. If str has a value, it returns that value. |

    | ${str:+expression} | If str is unset or null, it returns null. If str has a
    value, it returns expression. |

    | ${str:?expression} | If str is unset or null, it sends the value of expression
    to standard error and aborts the current command or script. If str has a value,
    it returns that value. |

    | ${str#pattern} | If pattern matches the beginning of str, it returns str with
    the smallest matching part deleted; otherwise it returns str unchanged. |

    | ${str##pattern} | If pattern matches the beginning of str, it returns str with
    the largest matching part deleted; otherwise it returns str unchanged. |

    | ${str%pattern} | If pattern matches the end of str, it returns str with the
    smallest matching part deleted; otherwise it returns str unchanged. |

    | ${str%%pattern} | If pattern matches the end of str, it returns str with the
    largest matching part deleted; otherwise it returns str unchanged. |'
  merge: -1
  img_proc: true
