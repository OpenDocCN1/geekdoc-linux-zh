    del *bak.*

    ```


    Oops, you just deleted all the files in the current directory unless you were
    paying attention when DOS asked you to confirm it. Not so with UNIX, where the
    * character substitutes for any number of characters, including none, but the
    rest of the pattern matching in the line is respected. So *bak.* would match newbak.save,
    oldbak.new, and even bak.temp, but would not match newbak because the trailing
    dot (.) is missing. Well, that''s pretty slick, and it does make life lots easier.
    The phrase *bak* would match all of the above, including newbak.


    # Can I use multiple wildcards within a single command?


    Yes. Consider the following:


    ```

    rm a*out*tmp?

    ```


    to get rid of a bunch of temporary output files that looked something like ab.out.tmp1,
    ac.out.tmp2, and so forth. You can see how you can use multiple wildcards to simplify
    your work. But UNIX gives you another, even more useful option.


    # How can I use wildcards to make my command line more intelligent?


    UNIX understands certain groups as being part of a set, and lets you use pattern
    matching with that set. So, if you have a series of files, file1.tmp, file2.tmp,
    file3.tmp, ... file9.tmp, you can delete (remove) them with


    ```

    rm file[0-9].tmp

    ```'
