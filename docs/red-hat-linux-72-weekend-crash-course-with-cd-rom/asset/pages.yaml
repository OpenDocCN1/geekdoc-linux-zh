- pgno: 82
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_82_0.png)


    # **SESSION**


    ![](img/5fe8f856723cde0b366f73584b9e64b8_82_1.png)


    # # *Understanding the Shell*


    # **Session Checklist**


    +   - Getting started with the Bash shell

    +   - Using the Bash shell


    ![](img/5fe8f856723cde0b366f73584b9e64b8_82_2.png)


    As discussed in Session 5, unfortunately you can''t do everything from a graphical
    environment such as GNOME or KDE. In such cases, you have to use Linux commands
    to accomplish specific tasks. Session 5 introduced you to some of the Linux commands
    that you can use from a text terminal to manipulate files and directories. This
    session introduces you to the **Bash** shell — the default command interpreter
    in Linux. Here, you learn some important features of how the shell *executes*
    commands.


    # **Getting Started with the Bash Shell**


    If you have used MS-DOS, you may be familiar with the DOS command interpreter.
    That program (named **COMMAND.COM**) displays the infamous **C:\>** prompt. In
    Windows, you can see this prompt in an MS-DOS command window. Linux provides a
    command interpreter, referred to as a **shell**, which resembles the MS-DOS command
    interpreter. However, as you might expect, the shell has a lot more capabilities
    than the MS-DOS command interpreter.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_82_3.png)


    > Although this session covers the Bash shell, Red Hat Linux allows you to use
    other shells, too. They include **ash**, a small but capable shell, and **tcsh**,
    a full-featured shell with a syntax similar to the C programming language.


    The default Linux shell is called **Bash**, and its program is named **/bin/bash**
    (found in the **/bin** directory). When you open a terminal window from the GNOME
    or KDE desktop, or log in at a text console, the Bash shell prompts you for commands.
    When you type a command, the shell executes it.'
  merge: -1
