    \ to graphics mode and guides you through the rest of the installation, as explained\
    \ in Section 1.\n\n# Specifying SCSI Controller Settings\n\nIf you have a SCSI\
    \ controller in your system, the Red Hat installation program loads a SCSI driver\
    \ module for that controller. You have to identify the type of SCSI controller\
