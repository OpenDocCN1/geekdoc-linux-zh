    boot: prompt, type `1` then `s`\`n`\`l` and press **Enter**. Then, at the `#`
    prompt, type `passwd root`, and follow the prompts to reset root''s password.
    Finally, type `shutdown -r now` and the system will reboot and recognize the new
    password.


