    > lp1 stands for Line Printer 1. Linux uses named printer queues to distinguish
    printers. Queues also serve as temporary holding areas for print jobs and the
    associated files that are sent to a specific printer.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_42_1.png)


