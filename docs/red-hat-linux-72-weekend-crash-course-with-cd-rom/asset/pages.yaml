    # ## Building and Installing the Kernel and Modules


    This section describes the next three key phases of rebuilding a kernel: building
    the kernel, building and installing the modules, and setting up LILO to load the
    new kernel when you reboot the system.


    # ### Building the kernel


    You should initiate the next three tasks with a single command line by entering
    multiple semicolon-separated commands on the same line. That way, you can type
    the line, press Enter, and then take a break because building a kernel takes a
    while. Depending on your system, making a new kernel can take anywhere from a
    few minutes to over an hour.


    Type the following on a single line to initiate the building process:


    ```

    make dep; make clean; make bzImage

    ```


    The make dep command identifies the files that have changed and must be recompiled.
    The make clean command deletes old, unneeded files, such as old copies of the
    kernel. Finally, make bzImage creates the new kernel in a compressed file and
    places it in a certain directory.


    As the kernel is built, you see a lot of messages on the screen. When the process
    is complete, a new kernel in the form of a compressed file named bzImage appears
    in the /usr/src/1/linux/arch/i386/boot directory.


    To use the new kernel, you have to copy it to the /boot directory under a specific
    name and edit the /etc/lilo.conf file to set up LILO (the Linux Loader). You learn
    these steps in the “Installing the New Kernel and setting up LILO” section later
    in this session. After successfully rebuilding the kernel, you have to build and
    install the modules.


    # ### Building and installing the modules


    If you select any modules during the kernel configuration, you have to build the
    modules and install them. Follow these steps to perform these tasks:


    +   1.  The current set of modules in a directory is named after the version of
    Linux kernel your system is running. For example, if your system runs kernel version
    2.4.2-2, the modules reside in the following directory:


    ```

    /lib/modules/2.4.2-2

    ```'
