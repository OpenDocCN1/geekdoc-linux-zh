- pgno: 284
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_284_0.png)


    # Backing Up and Restoring Files


    # Session Checklist


    +   - Selecting a backup strategy and storage media

    +   - Using tar to backup and restore files

    +   - Backing up on tapes


    ![](img/5fe8f856723cde0b366f73584b9e64b8_284_1.png)


    **By now, you have learned a number of system administration tasks from configuring
    X to building a new kernel. This session introduces you to another important system
    administration task—backing up and restoring files from backup storage media.
    In this session, you’ll learn how to back up and restore files using the tape
    archiver (tar) program that comes with Red Hat Linux. You’ll also learn how to
    perform incremental and automatic backups on tapes.**


    # Selecting A Backup Strategy and Storage Media


    Your Red Hat Linux system’s hard disk contains everything needed to keep your
    system running, as well as other files such as documents and databases that you
    need to keep your business running. You must back up these files so that you can
    recover data quickly and bring the system back to normal in case the hard disk
    crashes. You should adhere to a strict schedule of regular backups because you
    can never tell when the hard disk might fail or the file system might get corrupted.
    To implement such a schedule, decide what files to back up, how often to back
    them up, and what backup storage media to use. This involves selecting a backup
    strategy and backup media.


    Your choice of backup strategy and backup media depend on your assessment of the
    risk of business disruption due to hard disk failure. Depending on how you use
    your Red Hat Linux system, a disk failure may or may not have much impact on you.


    For example, if you use your Red Hat Linux system as a learning tool to learn
    about Linux or programming, all you may need are backup copies of some system
    files needed to'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'configure Red Hat Linux. In this case, your backup strategy may be to save
    important system configuration files on one or more floppies every time you change
    any system configuration.


    On the other hand, if you use your Red Hat Linux system as an office server that
    pro\nvides shared file storage for many users, the risk of business disruption
    and the associated cost due to disk failure is much higher. In this case, you
    have to back up all the files every week and back up any new or changed files
    every day. You should perform these backups in an automated manner (using the
    job-scheduling features that you learned in Section 25). Also, you probably need
    a backup storage medium that can store large amounts (multiple gigabytes) of data
    on a single tape. In other words, in high-risk or business critical situations,
    your backup strategy is more elaborate and thus requires additional components
    such as a tape drive.


    Your choice of backup media depends on the amount of data you have to back up.
    For a small amount of data, such as system configuration files, you can use floppy
    disks as your backup media. If your PC has a Zip drive, you can use Zip disks
    as your backup media, which are especially well suited for backing up a single-user
    directory. To back up servers, you should use a tape drive — typically, a 4mm
    or 8mm tape drive that connects to a SCSI (Small Computer System Interface) controller.
    Such tape drives can store several gigabytes of data per tape, and you can use
    them to back up an entire file system on a single tape.


    When using the tar command to back up files to these backup storage media, you
    have to refer to the backup device by name. Table 26-1 lists the device names
    for some common backup devices.


    **Table 26-1** Device Names for Common Backup Devices

    | Backup Device | Linux Device Name |

    | :--- | :--- |

    | Floppy disk | /dev/fd0 |

    | IDE Zip drive | /dev/hdc4 or /dev/hdd4 |

    | SCSI Zip drive | /dev/sda (assuming it’s the first SCSI drive); otherwise, the
    device name depends on the SCSI ID |

    | SCSI tape drive | /dev/st0 or /dev/nst0 (n prefix means that the tape does not
    rewind after files are copied to the tape) |


    Although this session focuses on backing up and restoring files with the tape
    archiver (tar) program that comes with Red Hat Linux, there are other free software
    packages, such as Amanda, and also commercially available utilities for Red Hat
    Linux that perform back\nups. Refer to the upcoming sidebar for information about
    some well-known commercial utilities.


    # **Backing Up and Restoring Files with the tar Program**


    You can use the tape archiver (tar) program to archive files to a device such
    as a floppy disk or tape. The tar program creates an archive file that contains
    those directories and files, and optionally compresses the archive for efficient
    storage. The archive is then written'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Commercial Backup Utilities for Red Hat Linux


    Although you can manage backups with tar, a number of commercial backup utilities
    come with graphical user interfaces (GUIs) and Red Hat features to simplify back-ups.
    Here are some well-known backup utilities for Red Hat Linux:


    +   ● LONE-TAR: tape backup software package from Lone Star Software Corporation
    (see http://www.cactus.com/)

    +   ● Arkeia: backup and recovery software for heterogeneous networks from Knox
    Software (see http://www.knox-software.com/)

    +   ● CTAR: backup and recovery software for UNIX systems from UniTrends Software
    Corporation (see http://www.unitrends.com/)


    to a specified device or another file. In fact, many software packages are distributed
    in the form of a compressed tar file.


    The command syntax of the tar program is as follows:


    ```

    tar options destination source

    ```


    The options are usually specified by a sequence of single letters, each specifying
    what tar should do. The destination entry identifies the name of the archive file,
    or, if backing up to a device, the backup device. The source entry is a list of
    file or directory names denoting the files to back up.


    # *Backing up and restoring a single-volume archive*


    Suppose you want to back up the contents of the /etc/X11 directory on a single
    floppy disk. Log in as root, place a disk in the floppy drive, and then type the
    following command:


    ```

    tar zcvf /dev/fd0 /etc/X11

    ```


    The tar program displays a list of filenames as each file is copied to the compressed
    tar archive on the floppy disk. In this case, the options are zcvf, the destination
    is /dev/fd0 (the floppy disk), and the source is the /etc/X11 directory (which
    implies all its subdirectories and their contents). You can use a similar tar
    command to back up files to a tape. Simply replace /dev/fd0 with the tape device,
    such as /dev/st0 for a SCSI tape drive. Table 26-2 lists a few common tar options.


    | Table 26-2 Common tar Options |

    | Option | Definition |

    | z | Compresses the tar archive using gzip. |

    | j | Compresses the tar archive using bzip2. |'
  merge: -1
  img_proc: true
- pgno: 287
  md: "Table 26-2 Continued \n| Option | Definition |\n| :--- | :--- |\n| c | Creates\
    \ an archive. |\n| v | Displays verbose messages. |\n| x | Extracts files from\
    \ the archive. |\n| t | Lists the contents of the archive. |\n| M | Specifies\
    \ a multi-volume archive (discussed in the next section). |\n| f | Specifies the\
    \ name of the archive file or device on the next field in the command line. |\n\
    \n\nTo view the contents of the tar archive you create on the floppy disk, type\
    \ the following command:\n\n```\ntar ztf /dev/fd0\n```\n\nYou should see a list\
    \ of the filenames (each begins with /etc/X11) indicating the contents of the\
    \ backup. In this tar command, the t option lists the contents of the tar archive.\n\
    \nTo learn how to extract the files from a tar backup, try the following steps\
    \ while logged in as root:\n\n+   1. Change the directory to /tmp by typing the\
    \ command:\n+   cd /tmp\n+   That is where you extract the files from the tar\
    \ backup.\n+   2. Type the following command:\n+   tar zxvf /dev/fd0\n+   This\
    \ tar command uses the x option to extract the files from the archive stored on\
    \ /dev/fd0 (the floppy disk).\n\nIf you check the contents of the /tmp directory,\
    \ you notice that the tar command creates an etc/X11 directory tree in /tmp and\
    \ restores all the files from the tar archive into that directory. The tar command\
    \ strips off the leading / from the filenames in the archive and restores the\
    \ files in the current directory. If you want to restore the /etc/X11 directory\
    \ from the archive on the floppy, use the following command:\n\n```\ntar zxvf\
    \ /dev/fd0 /\n```\n\nThe / at the end of the command denotes the directory where\
    \ you want to restore the backup files.\n\nAs you can see, the tar command enables\
    \ you to create, view, and restore an archive. You can store the archive in a\
    \ file or in any device that you specify with a device name."
