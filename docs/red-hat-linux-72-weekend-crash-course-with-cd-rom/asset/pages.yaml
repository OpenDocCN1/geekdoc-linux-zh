- pgno: 104
  md: '# Text Editing with ed and vi


    All UNIX systems, including Linux, come with two text-mode text editors:


    +   ed, a line-oriented text editor

    +   vi, a full-screen text editor that supports the command set of an earlier
    editor named ex


    Although the graphical text editors are easy to use, ed and vi may be more cryptic
    than other, more graphical, text editors. You should learn the basic editing commands
    of ed and vi because sometimes these two may be the only editors available. When
    you run into a system problem and Linux refuses to boot from the hard disk, for
    example, you may have to boot from a floppy. In this case, you have to edit system
    files with the ed editor because that editor is small enough to fit on the floppy.
    As the next two sections demonstrate, learning the basic text-editing commands
    of ed and vi isn''t hard.


    # Using ed


    The ed text editor works with a *buffer*—an in-memory storage area where the actual
    text resides until you explicitly save the text to a file. Typically, you have
    to use ed only when you boot a minimal version of Linux (for example, from a boot
    floppy) and the system does not support full-screen mode. In all other situations,
    you can use the vi editor that works in a text-mode full-screen.


    As you will see in the following examples using the ed editor, you work in either
    command mode or text-input mode, which are defined as follows:


    +   *Command* mode is the default. In this mode, anything that you type is interpreted
    as a command. The ed text editor has a simple command set in which each command
    consists of one or more characters.

    +   *Text-input* mode enables you to enter text into the buffer. You can enter
    input mode with the commands a (append), c (change), or i (insert). After entering
    lines of text, you can leave input mode by entering a period (. ) on a line by
    itself.


    To practice editing a file, copy the /etc/fstab file to your home directory with
    the following commands:


    ```

    ```

    cd

    cp /etc/fstab .

    ```

    ```


    Now you should have a file named fstab in your home directory. Type the following
    command to begin editing a file in ed:


    ```

    ```

    ed -p: fstab

    608

    :

    ```

    ```


    This example uses the *-p* (for *prompt*) option to set the prompt to the colon
    character (: ) and then opens the fstab file for editing in the current directory,
    which should be your home directory. The ed editor opens the file, reports the
    number of characters in the file (690), displays the prompt (: ), and then waits
    for a command.'
  merge: -1
  img_proc: true
- pgno: 105
