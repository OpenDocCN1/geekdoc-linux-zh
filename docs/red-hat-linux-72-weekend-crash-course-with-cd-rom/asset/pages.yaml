    For this discussion, we assume that the printer is connected to your PC''s parallel
    port. Select the device that corresponds to the parallel port to which your printer
    is attached—in most cases, this will be /dev/lp0, the Linux equivalent of the
    DOS/Windows LPT1 printer port. Click Next to continue.'
