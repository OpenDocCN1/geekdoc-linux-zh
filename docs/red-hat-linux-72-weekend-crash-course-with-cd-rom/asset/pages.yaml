  md: '# SESSION 25


    # Scheduling Jobs in Red Hat Linux


    ![](img/5fe8f856723cde0b366f73584b9e64b8_276_0.png)


    # Session Checklist


    +   - ✓ Scheduling one-time jobs

    +   - ✓ Scheduling recurring jobs


    ![](img/5fe8f856723cde0b366f73584b9e64b8_276_1.png)


    As a system administrator, you may need to run some programs automatically at
    regular intervals or execute one or more commands at a specified time in the future.
    Your Red Hat Linux system includes the facilities so you can schedule jobs to
    run at any future date or time you want. You can set up the system to perform
    a task periodically or just once at any future date. Here are some typical tasks
    you can perform by scheduling jobs on your Red Hat Linux system:


    +   - Backing up files in the middle of the night.

    +   - Downloading large files in the early morning when the system is not busy.

    +   - Sending yourself messages as reminders of meetings.

    +   - Analyzing the system logs periodically and looking for any abnormal activities.


    You can perform these tasks on a one-time basis with the `at` command or on a
    recurring basis using the Red Hat Linux `crond` daemon and the `crontab` command.
    This session introduces you to these job scheduling features of Red Hat Linux.


    # Scheduling One-time Jobs


    To schedule programs that you want to run only once and at a later time, you can
    use the `at` command. The `atd` daemon executes the commands at the specified
    time and mails the output to you.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "The following configuration files control which users can schedule tasks using\
    \ the at command:\n\n+   *   `/etc/at.allow` contains the names of the users who\
    \ may submit jobs using the at command.\n+   *   `/etc/at.deny` contains the names\
    \ of users who are not allowed to submit jobs using the at command.\n\nIf these\
    \ files are not present or there is an empty /etc/at.deny file, then any user\
    \ can submit jobs using the at command. The default in Red Hat Linux is an empty\
    \ /etc/at.deny file, so anyone can use the at command. If you do not want some\
    \ users to use at, simply list those user names in the /etc/at.deny file.\n\n\
    # Submitting a one-time job\n\nTo use at to schedule a one-time job for execution\
    \ at a later date, follow these steps:\n\n+   1.  **Run** the at command with\
    \ the date or time when you want your commands executed. When you press Enter,\
    \ the at> prompt appears as follows:\n+   \n+       > at 14:45\n+       > warning:\
    \ commands will be executed using (in order) a) $SHELL b) login shell c) /bin/sh\n\
    +       > at>\n+   \n+   This is the simplest way to indicate the time when you\
    \ want to execute one or more commands; simply specify the time in a 24-hour format.\
    \ In this case, you want to execute the commands at 9:30 p.m. tonight (or tomorrow,\
    \ if it's already past 2:45 p.m.). However, you can specify the execution time\
    \ in many different ways (see Table 25-1 for examples).\n\n+   2.  **At** the\
    \ at> prompt, type the commands you want to execute just as you do at the shell\
    \ prompt. After each command, press Enter and continue with the next command.\
    \ When you are finished entering the commands you want to execute, press Ctrl+D\
    \ to end this step. Here is an example showing a single command:\n+   \n+    \
    \   > at> ps\n+       > at> <EOF>\n+       > warning: commands will be executed\
    \ using /bin/sh\n+       > Job 2 at 2001-07-08 14:45\n+   \n+   After you press\
    \ Ctrl+D, the at command displays a job number and the time when the job will\
    \ execute.\n\n**Table 25-1 Specifying the Time of Execution with the at Command**\n\
    \n| Command | When the Job Runs |\n| :--- | :--- |\n| at now | Immediately |\n\
    | at now + 15 minutes | 15 minutes from the current time |"
  merge: -1
  img_proc: true
