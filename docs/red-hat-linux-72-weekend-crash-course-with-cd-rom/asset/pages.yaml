  md: "# Credits\n\n+   - Acquisitions Editor  \n+   Terri Varveris\n\n+   - Project\
    \ Editor  \n+   Valerie Haynes Perry\n\n+   - Technical Editor  \n+   Joseph Traub\n\
    \n+   - Copy Editor  \n+   Valerie Haynes Perry\n\n+   - Project Coordinator \
    \ \n+   Nancee Reeves\n\n+   - Graphics and Production Specialists  \n+   Joyce\
    \ Haughey, Kristin Pickett,  \n+   Betty Schulte, Brian Torwelle,\n\n+   - Permissions\
    \ Editor  \n+   Laura Moss\n\n+   - Proofreading and Indexing  \n+   TECHBOOKS\
    \ Production Services\n\n# About the Authors\n\nNaba Barkakati is an expert programmer\
    \ and successful computer-book author who has experience in a wide variety of\
    \ systems, ranging from MS-DOS and Windows to UNIX and the X Window System. Over\
    \ the past 12 years, Naba has written 25 computer books on a number of topics\
    \ ranging from C++ programming to Linux. He has authored several best-selling\
    \ titles, such as The Waite Group’s Turbo C++ Bible, Object-Oriented Programming\
    \ in C++, X Window System Programming, Visual C++ Developer’s Guide, and Borland\
    \ C++ 4 Developer’s Guide. Naba’s most recent book is the best-selling Red Hat\
    \ Linux 7.1 Secrets, also published by Hungry Minds.\n\nNaba lives in North Potomac,\
    \ Maryland, with his wife Leha and their children Ivy, Emily, and Ashley.\n\n\
    Kurt Wall has been using and programming Linux and UNIX since 1993. Kurt is the\
    \ author of two editions of Linux Programming Unleashed and Linux Programming\
    \ by Example. Additionally, he has contributed chapters to The Informix Handbook,\
    \ The Linux Bible, and forthcoming titles on Linux clustering, Linux performance\
    \ tuning and capacity planning, and Microsoft Access database development. Kurt\
    \ is does the technical editor for a wide variety of Linux titles."
