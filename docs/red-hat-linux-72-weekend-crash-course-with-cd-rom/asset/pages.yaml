    | mkdir | Creates a directory. Type `cd` to change to your home directory and
    then type `mkdir temp` to create a directory named *temp*. |

    | mv | Renames a file moves it from one directory to another. Type `mv filename1
    filename2` to change a file''s name; use an existing file''s name for *filename1*.
    |

    | rm | Deletes files. The syntax is `rm filename`. (Use with caution because the
