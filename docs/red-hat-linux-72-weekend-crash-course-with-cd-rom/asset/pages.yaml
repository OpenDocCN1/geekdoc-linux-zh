    command to unpack the file. Next, check the `README` or `INSTALL` files, in any,
    for instructions. In most cases, type `/configure` to configure the software;
    make to build the software; and `make install` to install it.

    +       5.  The XMMs package is the X Multimedia System, a graphical X application
    for playing MP3 and other multimedia files. Build and install XMMs with the command
    `/configure; make; make install`.

    +       6.  Look for information such as CPU usage, physical memory and swap space
    usage, and hard disk usage to monitor your system’s performance.

    +       7.  Red Hat Linux includes tools such as the Gnome System Monitor, and
    the top and `vmstat` commands to monitor system performance.

    +       8.  The **system load average** is the average number of processes that
    were ready to run in the last 1, 5, and 15 minutes.

    +       9.  The `vostat 60 10` command line displays 60-second averages and prints
    a total of 10 lines of output. The first line of output from vstat shows the averages
    since the last reboot.

    +       10. The purpose of `/proc` is to allow users to access information about
    the Linux kernel and the processes that are currently running on the system.

    +       11. The **security policy** provides the rules you use when setting up
    your Red Hat Linux system’s security. The security policy should address areas
    such as how users are authenticated, what various users can do, what data must
    be protected, which Internet services are allowed to run, and who is responsible
    for maintaining and auditing security.

    +       12. The general steps are to install only those packages that you need,
    create user accounts with strong passwords, enable only the necessary Internet
    services, and periodically check log files for signs of break-in attempts. You
    should also keep up with security news and install upgrades from Red Hat.

    +       13. Shadow passwords and the use of MD5 encryption are two ways in which
    passwords are made more secure in Red Hat Linux.

    +       14. The `chage -M 30 marys` command line forces the user named *marys*
    to change her password every 30 days.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '+   15. The `xinetd` server starts Internet services using the TCP wrapper
    program. As specified in the `/etc/xinetd.conf` file, the `/usr/sbin/tcpd` program
    starts other services such as FTP and Telnet.


    +   16. The TCP wrapper program provides an access control facility for Internet
    services started by `xinetd`. Before starting a service using `xinetd`, the TCP
    wrapper consults the `/etc/hosts.allow` file to see if the host requesting service
    is allowed that service. If there is nothing in `/etc/hosts.allow` about that
    host, the TCP wrapper checks the `/etc/hosts.deny` file to see if the service
    should be denied. If both files are empty, the TCP wrapper allows the host access
    to the requested service.


    +   17. `GNOME Help Browser` and `KDE Help` are two help viewers that you can
    use to view online help information from the graphical desktops in Red Hat Linux.


    +   18. Type `whatis tr` to read a one-line description of the `tr` command. To
    view the manual page for the `tr` command, use the command `man tr`.


    +   19. Use the `apropos` command to search for other commands using a keyword.


    +   20. Each `HOWTO` file contains information about some area of Linux, such
    as how to configure hardware in Linux or how to create a boot disk. If your system
    is connected to the Internet, you can access the `HOWTO` files by clicking on
    the `LDP` icon on the `GNOME` desktop, and then clicking the link to `HOWTO` documents.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# APPENDIX


    ![](img/5fe8f856723cde0b366f73584b9e64b8_346_0.png)


    # What''s on the CD-ROM?


    his appendix provides you with information on the contents of the CD-ROM that
    accompanies this book.


    Two components are included on the CD:


    +   • Red Hat Linux 7.2

    +   • The Red Hat Linux 7.2 Weekend Crash Course Assessment Test


    Also included is an electronic, searchable version of the book that can be viewed
    with Adobe Acrobat Reader.


    # System Requirements


    Make sure that your computer meets the minimum system requirements listed in this
    section. If your computer doesn''t match up to most of these requirements, you
    may have a problem using the contents of the CD.


    +   • PC with a Pentium processor running at 90 Mhz or faster

    +   • At least 32MB of RAM, 64MB or more if you will use the X Window system

    +   • Between 300MB and 2.4GB of free disk space, depending on installation options
    (1.2GB or more recommended)

    +   • Ethernet network interface card (NIC) or modem with a speed of at least
    28,800 bps

    +   • A CD-ROM drive — double-speed (2x) or faster

    +   • A 3.5" floppy disk drive for creating a boot floppy (optional)


    You will need at least 2.4GB of hard drive space to install all the software from
    this CD.


    # What''s on the CD


    The CD-ROM contains source-code examples, applications, and an electronic version
    of the book. Following is a summary of the contents of the CD-ROM arranged by
    category.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Red Hat Linux 7.2


    The CD-ROMs contain all Red Hat Linux 7.2 binary files with the Linux 2.4.7 kernel,
    which is the latest version of the Linux kernel available as of this writing (September
    2001). In addition to the Linux kernel, Red Hat Linux includes a large selection
    of Linux applications. Here are some significant software packages on the Red
    Hat Linux 7.2 CD-ROMs:


    +   • Linux kernel 2.4.7 with driver modules for all major PC hardware configurations,
    including IDE/EIDE, ATA, and SCSI drives, PCMCIA devices, many USB devices, and
    CD-ROM drives.

    +   • Complete set of installation and configuration tools for setting up hardware
    devices (such as disk drives, video hardware, keyboards, and mice) and services.

    +   • Graphical user interface (GUI) based on the XFree86 package with GNOME and
    KDE desktops.

    +   • Full TCP/IP networking for Internet, LANs, and intranets.

    +   • Tools for connecting your PC to your Internet Service Provider using dedicated
    connections (such as xDSL), PPP, and dial-up serial communications programs.

    +   • Complete suite of Internet applications, including electronic mail (sendmail,
    mutt, pine, e lm, m a11), news (fnn, tirn, srrn, trn), Internet Relay Chat (irc11),
    Telnet, FTP, and NFS.

    +   • Apache Web server 1.3.19 (to turn your PC into a Web server), Netscape Communicator
    4.77, and Mozilla 0.9 (to surf the Net).

    +   • Samba 2.0.7 LAN Manager software for Microsoft Windows connectivity.

    +   • Several text editors (GNU Emacs 20.7, vim).

    +   • Graphics and image manipulation software, such as The GIMP, XPaint, Ghostscript,
    Ghostview, and ImageMagick.

    +   • Multimedia applications for playing audio CDs, MP3s, and other sound formats
    (xplay, XMMS 1.2, KSCD 1.3, GTCD 1.2), mixers, sound recorder, and audio meters.

    +   • Programming languages (GNU C and C++ 2.96, Perl 5.6.0, Tcl/Tk 8.3.1, Python
    1.5.2, GNU AWK 3.0.6) and software development tools (GNU Debugger 5.0, CVS 1.11,
    RCS 5.7, GNU Bison 1.28, flex 2.5.4, TIFF, and JPEG libraries).

    +   • Complete suite of standard UNIX utilities.

    +   • Tools to access and use DOS files and applications (mtools 3.9.7).

    +   • Games such as GNU Chess, Mahjongg, Reversi, Minesweeper, Freecell, Gnobots,
    AisleRiot.


    # Red Hat Linux 7.2 Weekend Crash Course Assessment Test


    The CD-ROM contains 60 multiple-choice questions with answers. These test questions
    serve two purposes. You can use them to assess how much you already know about
    Red Hat Linux and thereby determine which sessions you can skip. You can also
    go through the questions after reading individual sections of this book to assess
    how much you have learned. The questions are organized by session; therefore they
    follow the order of topics discussed in this book. The session that each question
    corresponds with is noted next to each question'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Electronic version of Red Hat Linux 7.2 Weekend Crash Course


    The complete (and searchable) text of this book is on the CD-ROM in Adobe''s Portable
    Document Format (PDF), readable with the Adobe Acrobat Reader (also included).


    # Adobe Acrobat Reader 5.0


    The CD-ROM contains the latest version of Adobe Systems’ Acrobat Reader, which
    enables you to read the documents in the popular Adobe Portable Document Format
    (PDF). For more information on Adobe Acrobat Reader, go to http://www.adobe.com/.


    # Installing Red Hat Linux


    We do not have enough space in this short appendix to explain how to install Red
    Hat Linux from the CD. Please follow the instructions in Sessions 1 through 3
    of the book to install Red Hat Linux on your system.


    # Troubleshooting


    If you have difficulty installing or using the CD-ROM programs, try the following
    solutions:


    +   - Make sure that your PC’s BIOS is correctly configured. The companion CD-ROM
    is bootable, but the PC must have booting from a CD-ROM enabled in the BIOS in
    order for it to work.


    +   - Create a bootable floppy to install the software. If you cannot boot from
    the CD-ROM, use the instructions in Session 1 to create a bootable floppy in order
    to install the software.


    If you still have trouble with the CD, please call the Hungry Minds Customer Service
    phone number: (800) 762-2974. Outside the United States, call (317) 572-3993.
    Hungry Minds will provide technical support only for installation and other general
    quality control items; for technical support on the applications themselves, consult
    the program’s vendor or author.'
