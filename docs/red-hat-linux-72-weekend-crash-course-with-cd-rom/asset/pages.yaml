- pgno: 324
  md: "# SESSION 30\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_324_0.png)\n\n# #\
    \ Getting Help from Available Resources\n\n**Session Checklist**\n\n+   Using\
    \ the help viewers\n+   \n+   Using the commands\n+   \n+   Looking up online\
    \ HOWTO files\n+   \n+   Accessing other Linux resources\n\nB y now you have learned\
    \ a lot about Red Hat Linux, but there is much more than this book cannot cover\
    \ because of time constraints. To make sure that you can find help when you need\
    \ it, this final session of the weekend introduces you to a wide variety of Linux\
    \ resources that provide more information if you are experiencing a problem with\
    \ a particular topic or with Red Hat Linux in general. Some of the help is available\
    \ right on your system, but you can find many more resources on the Internet.\n\
    \n# ## Using the Help Viewers\n\nBoth GNOME and KDE desktops come with help viewers—the\
    \ GNOME Help Browser and KDE Help—that enable you to view online help information.\n\
    \n# ### GNOME Help Browser\n\nFrom the GNOME desktop, select Main Menu→Programs→Help\
    \ System or click the question mark icon on the GNOME Panel to launch the GNOME\
    \ Help Browser. The GNOME Help Browser"
  merge: -1
