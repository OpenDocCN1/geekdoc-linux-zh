- pgno: 272
  md: "# Session 24—Building a New Kernel\n\n+   *   The `image=/boot/vmlinuz-2.4.2`\
    \ line identifies the kernel that LIL0 loads. In this case, the kernel file, often\
    \ called a *kernel image*, is `vmlinuz-2.4.2`, which you can locate in the `/boot`\
    \ directory.\n\n+   *   The `label=linux` line gives a name to the kernel. This\
    \ is the name you type (`linux`) at the `boot:` prompt to make LIL0 boot this\
    \ particular kernel.\n\n+   *   The `root=/dev/hda3` line specifies the disk partition\
    \ where the root Linux file system is located. This may differ on your system.\n\
    \n+   *   LIL0 passes the `read-only` statement to the kernel, which tells the\
    \ kernel to mount the root file system in read-only mount.\n\n+   *   The `initrd=/boot/initrd-2.4.2.img`\
    \ line specifies a file that contains an initial RAM disk *image* — a block of\
    \ memory used as a disk — that contains a file system and key drivers the kernel\
    \ needs to load before the disks are available.\n\nOrdinarily, you see the `initrd`\
    \ line only if your system has a Small Computer System Interface (SCSI) adapter\
    \ and the kernel uses a modular SCSI driver. Why? When your system boots Red Hat\
    \ Linux from a SCSI disk and uses a modular SCSI disk driver, the kernel faces\
    \ a classic chicken-and-egg situation. In order to boot, the kernel has to read\
    \ the SCSI modules from disk, but in order to read the disk, it has to load the\
    \ SCSI modules. The RAM disk solves this conundrum. The SCSI drivers are stored\
    \ in the RAM disk image, which is placed in a location the kernel can access without\
    \ needing to load a disk driver. The kernel reads the RAM disk image, loads the\
    \ drivers it contains, and then continues the boot process using the SCSI hard\
    \ disk. You do not need the `initrd` line if you create a kernel with the SCSI\
    \ adapter support built into the kernel.\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_272_0.png)\n\
    \nOn systems that have an MS-DOS partition, the LIL0 configuration file can include\
    \ another section with details for the operating system (perhaps Windows 95, 98,\
    \ or 2000) on that partition.\n\nTo configure LIL0 to boot the kernel you just\
    \ built, follow these steps:\n\n+   1.  Copy the new kernel binary to the `/boot`\
    \ directory. The new compressed kernel file is in the `/usr/src/linux/arch/i386/boot`\
    \ directory. You may simply copy the new kernel binary file to the `/boot` directory\
    \ with the same name:\n+   \n+   `cp /usr/src/linux/arch/i386/boot/bzImage /boot`\n\
    +   \n+   When you build the kernel, if you type the command `make bzImage`, the\
    \ kernel filename is `zImage`. You can use any other filename you want as long\
    \ as you use that same filename when referring to the kernel in the `/etc/lilo.conf`\
    \ file of Step 3.\n\n+   2.  Rename the old `System.map` file in the `/boot` directory\
    \ and copy the new map file. Assuming that you'll rebuild kernel version `2.4.2-2`\
    \ after changing some configuration options, execute the following commands to\
    \ rename the map file:\n+   \n+   `mv /boot/System.map-2.4.2 /boot/System.map-2.4.2-2`\n\
    +   `cp /usr/src/linux-2.4.2/System.map /boot/System.map-2.4.2-2`\n+   `cd /boot`\n\
    +   `ln -sf System.map-2.2.16-21 System.map`"
  merge: -1
