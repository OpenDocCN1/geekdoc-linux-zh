  md: "# Ghostscript\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_207_0.png)\n\n10\
    \ Min.  \nTo Go\n\nGhostscript is a utility for previewing and printing PostScript\
    \ documents. Ghostscript enables you to print PostScript documents on many non-PostScript\
    \ devices. At its heart, Ghostscript is an implementation of the PostScript language.\
    \ Ghostscript includes the interpreter that processes PostScript input and generates\
    \ output on an output device. A Ghostscript device can be a printer or display\
    \ screen as well as an image-file format such as BMP or PCX.\n\nGhostscript is\
    \ distributed under the GNU GPL, but is copyrighted and maintained by Aladdin\
    \ Enterprises. Some Ghostscript documentation is installed in the /usr/doc directory.\
    \ To change to the appropriate directory, type cd /usr/doc/ghostscript*. (The\
    \ exact directory name depends on the version of Ghostscript installed on your\
    \ system. You can find the latest contact information in the README file in that\
    \ directory. That directory also contains some other Ghostscript documentation.\
    \ All of these documentation files are text files that you can view using the\
    \ more command.\n\nYou typically use Ghostscript to load and view a PostScript\
    \ file. To see how Ghostscript renders a PostScript document, you can use any\
    \ available PostScript document you have. One good solution is to use one of the\
    \ sample PostScript files in the /usr/share/ghostscript/5.50/examples directory\
    \ with the gs command. (Replace 5.50 with whatever version of Ghostscript is installed\
    \ on your system.) For example, type the following command in a terminal window:\n\
    \n```\n```bash\ngs /usr/share/ghostscript/5.50/examples/golfer.ps\n```\n```\n\n\
    Ghostscript opens that file, processes its contents, and displays the output in\
    \ another window (as shown in Figure 18-4).\n\nIn this case, the output is a picture\
    \ of a golfer. After displaying the output, Ghostscript produces the following\
    \ message:\n\n```\n```\n>>showpage, press <return> to continue<<\n```\n```\n\n\
    Press Enter to continue. For a multiple-page PostScript document, Ghostscript\
    \ then shows the next page. After all the pages are displayed, you return to the\
    \ Ghostscript prompt. Type quit to exit Ghostscript.\n\n# Ghostview\n\nGhostview\
    \ is an X-based graphical front end to the Ghostscript interpreter. Ghostview\
    \ is ideal for viewing and printing PostScript documents. For a long document,\
    \ you can even print selected pages. You also can view the document at various\
    \ levels of magnification by zooming in or out.\n\nTo run Ghostview, select Main\
    \ Menu » Graphics » Ghostview (if you are running GNOME), or type ghostview &\
    \ in a terminal window. Both methods open a Ghostview window. The window is divided\
    \ into three parts:\n\n+   - Along the window's top edge, you see eight buttons.\
    \ The first six buttons are menu buttons.\n+   - Down the window's left side,\
    \ you see several more buttons, text boxes for information display, and scrollbars\
    \ for scrolling the image."
