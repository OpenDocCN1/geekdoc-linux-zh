  md: 'The installation might appear to proceed slowly because the kernel source code
    RPM is over 20MB in size. After RPM finishes installing the kernel source package,
    the necessary source files appear in the `/usr/src/linux-2.4` directory.


    You have two options for the device drivers needed to support various hardware
    devices in Linux:


    +   - **Link in support.** You can build the drivers for all hardware on your
    system into the kernel. As you can imagine, the size of the kernel grows as the
    device driver code is incorporated into the kernel. A kernel that includes all
    necessary support code is called a **monolithic kernel**.


    +   - **Use modules.** You can create the necessary device drivers in the form
    of modules. A **module** is a block of code that the kernel can load after it
    starts running. You typically use modules to add support for a device without
    having to rebuild the kernel for each new device. Modules do not have to be device
    drivers; you can use them to add new functionality to the kernel. A kernel that
    uses modules is called a **modular kernel**.


    You do not have to create a fully monolithic or fully modular kernel. In fact,
    it is common practice to link some support directly into the kernel. Conversely,
    you can build infrequently used device drivers in the form of modules. For a company
    such as Red Hat, it makes sense to distribute a modular kernel. Red Hat provides
    a generic kernel along with a large number of modules to support many different
    types of hardware. The installation program configures the system to load only
    those modules needed to support the hardware installed in a user''s system.


    # Configuring the Kernel


    The first phase in rebuilding a kernel is configuring the kernel. To configure
    the kernel, log in as **root**. Then change the directory to `/usr/src/linux`
    by using the `cd` command as follows:


    ```

    cd /usr/src/linux-2.4

    ```


    Red Hat Linux provides three ways for you to configure the kernel:


    +   - Type **make xconfig** to use an X Window System-based configuration program
    to configure the kernel. You have to run **X** to use this tool.


    +   - Type **make menuconfig** to enter the kernel configuration parameters through
    a text-based menu interface.


    +   - Type **make config** to use a text-based program that prompts you for each
    configuration option one by one. When you use this option, you undergo a long
    question-and-answer process to specify the configuration parameters.


    To configure the kernel, you select the features and device drivers that you want
    to include in your Red Hat Linux system. In essence, you build a copy of Linux
    that mixes and matches the features you want.'
