- pgno: 97
  md: '# **Counting characters, words, and lines in a text file**


    You can use the wc command to display the line, word, and character count of a
    text file. Try the following:


    ```

    wc /etc/inittab

    57   244  1756 /etc/inittab

    ```


    This causes wc to display the number of lines (57), words (244), and bytes (characters,
    in most cases) (1756) of the /etc/inittab file. If you simply want to see the
    number of lines in a file, use the -l option like this:


    ```

    wc -l /etc/inittab

    57 /etc/inittab

    ```


    In this case, wc simply displays the line count. Use the -c option to count characters
    only and type the -w option to count only words. The -w option defines a word
    as any consecutive sequence of characters or digits delimited by at least one
    space on each side or at the beginning or end of a file.


    If you don''t specify a filename, the wc command expects input from the standard
    input. You can use the pipe(\|) feature of the shell to feed the output of another
    command to wc. This is handy sometimes. For example, suppose you want a rough
    count of the processes running on your system. You can get a list of all processes
    with the ps ax command; but instead of manually counting the lines, just pipe
    the output of ps to wc to get a rough count as follows:


    ```

    ps ax \| wc -l

    61

    ```


    This means the ps command produces 61 lines of output. Because the first line
    simply shows the headings for the tabular columns, you can estimate that there
    are about 60 processes running on your system.


    # **Sorting text files**


    You can sort the lines in a text file using the sort command. To see how this
    command works, first type more /etc/passwd to see the current contents of the
    /etc/passwd file. Now type sort /etc/passwd to see the lines sorted alphabetically.
    If you want to sort a file and save the sorted version in another file, you have
    to use the Bash shell''s output redirection feature like this:


    ```

    sort /etc/passwd > ~/sorted.text

    ```


    This command sorts the lines in the /etc/passwd file and saves the output in a
    file named sorted.text in your home directory.


    By default, sort displays all lines, even duplicate ones. Use sort''s -u option
    to show only unique lines (that is, to suppress duplicates). Suppose, for example,
    you have a file named names.txt that contains the following four lines:


    ```

    Kurt Wall

    Naba Barkakati

    Kurt Wall

    Naba Barkakati

    ```'
  merge: -1
  img_proc: true
