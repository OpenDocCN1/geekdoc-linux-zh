    # ### Exploring the /proc File System


    You can find out a great deal about your Red Hat Linux system by consulting the
    contents of a special file system known as the /proc (also called the *process
    file system*) file system. It can help you monitor a wide variety of information
    about your system. In fact, you can even change kernel parameters through the
    /proc file system and thereby modify the system''s behavior.


    The /proc file system is not a real directory on the disk, but a collection of
    data structures in memory managed by the Linux kernel and stored in memory. The
    /proc file system is considered a *virtual file system* because it does not really
    exist on disk, only in memory, and simply appears to the user as a set of directories
    and files.


    You can access the /proc file system and navigate it just as you do any other
    directory, but you have to know the meaning of various files to interpret the
    information. Typically, you can use the cat or more command to view the contents
    of a file in /proc; the file''s contents provide information about some aspect
    of the system.


    As with any directory, you may want to start by looking at a detailed directory
    listing of /proc. To do so, type ls -l /proc. In the output, the first set of
    directories (indicated by the letter d at the beginning of the line) represents
    the processes that are currently running on your system. Each directory that corresponds
    to a process has the process ID number as its name.


    You should also notice a very large file in the listing named /proc/kcore, which
    represents the entire physical memory of your system. There is no physical file
    occupying that much space on your hard disk, so do not try to remove the file
    to reclaim disk space.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_309_0.png)


    The /proc/cpuinfo file in /proc lists the key characteristics of your system''s
    CPU, such as its type, speed, and (on Intel CPUs) whether or not it suffers from
    one of several known CPU bugs. You can view the processor information by typing
    cat /proc/cpuinfo. For example, here is what results after typing this command
    on a sample system:


    ```

    ```

    cat /proc/cpuinfo

    processor   : 0

    vendor_id   : GenuineIntel

    cpu family  : 5

    model       : 4

    model name  : Pentium MMX

    stepping    : 3

    cpu MHz     : 199.616468

    fdiv_bug    : no

    ht_bug      : no

    ```

    ```'
