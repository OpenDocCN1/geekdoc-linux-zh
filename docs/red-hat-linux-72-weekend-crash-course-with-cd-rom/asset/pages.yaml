    # Date and Time Commands


    You can use the date command to display the current date and time or set a new
    date and time. Type date at the shell prompt and you get a result similar to the
    following:


    ```

    ```

    date

    Wed Jun 13 19:46:31 MDT 2001

    ```

    ```


    You can also format the way you want the date or time to appear. For example,
    to view the date alone (without the current time), try the following command:


    ```

    ```

    date "+%A %B %d %Y"

    Wednesday June 13 2001

    ```

    ```'
