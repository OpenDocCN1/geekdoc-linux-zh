    # Troubleshooting


    If `setserial` shows the UART as unknown, as you see in the following example,
    the kernel has not detected your serial port or the modem attached to it:


    ```

    /dev/ttyS2, UART: unknown, Port: 0x03f8, IRQ: 10

    ```


    This usually occurs because your PC’s BIOS is set up to expect a Plug and Play
    (PnP) operating system. To solve the problem, reboot the PC and, as it powers
    up, press the key that permits you to access the system’s BIOS. Typically, this
    is a function key, such as F2, but the exact key depends on your PC’s BIOS. In
    the setup screen, locate the option for the PnP operating system (often labeled
    “Plug & Play O/S”) and turn off that option. Then save the BIOS settings and exit.
    This causes the PC to reboot. This time, when Red Hat Linux boots, the kernel
    should be able to detect the PC’s serial port correctly.


    If your serial ports are correctly detected but the modem does not respond, make
    sure that `/dev/modem` is linked to the proper device file in `/dev`. This is
    especially common with PCI modem cards, which typically do not use COM1 (`/dev/ttyS0`)
    or COM2 (`/dev/ttyS1`) by default. For example, `sxpooe dmesg | grep ttyS` shows
    the following:


    ```

    ttyS02 at port 0x6800 (irq = 10) is a 16550A

    ```


    In this case, execute the following command to make sure that `/dev/modem` is
    linked to the proper device file:


    ```

    ln -sf /dev/ttyS2 /dev/modem

    ```


    If your modem does not appear to be detected, use the Windows Device Manager to
    obtain its IRQ and I/O address, and compare those values to the values the `setserial`
    command reports for that port.


    Presently, some modems simply do not work with Linux. These are so-called “WinModems,”
    which rely on the Windows operating system and a special, Windows-specific device
    driver to function. WinModems, also called software modems, rely on a device port,
    rather than hardware, to function. In this case, your only recourse is to replace
    the modem with a hardware modem.


    # Review


    You started the session by learning the device names for serial ports in Red Hat
    Linux. You used the Minicom serial communications program to dial out with a modem.
    In the course of dialing out, you learned several AT commands used to control
    the modem.'
  merge: -1
  img_proc: true
