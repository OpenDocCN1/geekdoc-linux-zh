- pgno: 239
  md: 'reboot the system as you learned in Session 4, or press Ctrl+Alt+Backspace
    to restart the X server. The next section, “Controlling the X Server,” explains
    what Ctrl+Alt+Backspace does. If you do not use the graphical login, simply exit
    X as shown in Session 4 and type startx to restart X. In every case, the X server
    will restart using the new configuration.


    # Controlling the X Server


    There are some special keystrokes that you can use to control the X server. You
    can force the server to terminate immediately or switch from one resolution to
    another without needing to restart the server.


    # Aborting X


    Aborting an action means to terminate or kill it immediately without going through
    the orderly, normal shutdown process. Sometimes, it is necessary to abort a process
    because it does not respond to a normal shutdown request. For example, if your
    newly configured X server does not allow you to log on normally, you can abort
    it by pressing Ctrl+Alt+Backspace. If your system is not set up for a graphical
    login screen, you return to the text display.


    However, if you selected the graphical login option, the X server immediately
    restarts. In this case, pressing Ctrl+Alt+R might disable the graphical login
    screen and return you to the text mode screen. If not, use the following procedure
    to abort X:


    +   1. Press Ctrl+Alt+F1 to get a text mode login screen. 2. Log in as root and
    execute the command telinit 3 to terminate the X server.


    > If you cannot seem to type on the console after executing telinit 3, press Alt+F1
    to return to the text mode screen you used. Sometimes, changing run levels between
    graphical and text modes causes the console terminal to change from the default.


    +   3. Reconfigure the X server using xf86cfg as explained in the previous section.
    The xf86cfg program will start a generic X session in order to enable the configuration
    process. 4. After the configuration is complete, execute the command telinit 5
    to restart the graphical login using the new (hopefully corrected) configuration
    options.


    # Switching screen modes


    If your video adapter and monitor support it, you can switch between screen resolutions
    (not color depths) on the fly using Ctrl+Alt+Keypad+ and Ctrl+Alt+Keypad-. (Keypad
    + and Keypad - refer to the plus and minus keys on the numeric Keypad.) You can
    try it now. If it does not work at all, only one resolution is defined for the
    current color depth. If it does work, but the resulting screen is off-center or
    sized strangely, run xf86cfg, and make sure you select the correct video adapter
    and provide the correct monitor frequencies for your monitor.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "Color depth is discussed later in this session.\n\nTo understand how switching\
    \ between screen modes works, use the more command as follows to view /etc/X11/XF86Config-4:\n\
    \n```\nmore /etc/X11/XF86Config-4\n```\n\nand scroll through the display until\
    \ you find the part that begins with the line Section \\\"Screen\\\". For example,\
    \ Listing 21-1 shows an excerpt from /etc/X11/XF86Config-4 on the system configured\
    \ earlier in the session.\n\n# Listing 21-1 The Screen Section in /etc/X11/XF86Config-4\n\
    \n```\nSection \\\"Screen\\\"\n        Identifier      \\\"Screen0\\\"\n     \
    \   Device          \\\"ATI Mach64\\\"\n        Monitor         \\\"Monitor0\\\
    \"\n        SubSection      \\\"Display\\\"\n                Depth   24\n    \
    \            Modes   \\\"800x600\\\" \\\"1024x768\\\" \\\"1280x1024\\\"\n    \
    \    EndSubSection\n        SubSection      \\\"Display\\\"\n                Depth\
    \   16\n                Modes   \\\"800x600\\\" \\\"1024x768\\\" \\\"1280x1024\\\
    \"\n        EndSubSection\nEndSection\n```\n\nNotice the Display subsections,\
    \ in particular the entries that begin with Modes. Each Display subsection describes\
    \ the video modes, or resolutions, that your particular combination of video adapter\
    \ and monitor support for a specific color depth. For example, in Listing 21-1,\
    \ you can see that the monitor and card can display resolutions of 800 × 600,\
    \ 1024 × 768, and 1280 × 1024 dpi (dots per inch) at color depths of 16 and 24\
    \ bpp (bits per pixel).\n\nWhen the X server starts, it selects the highest possible\
    \ color depth available in the Display subsections and the first resolution listed\
    \ on the corresponding Modes line. In this case, that would be 800 × 600 dpi at\
    \ 24 bpp. When you press Ctrl+Alt+Keypad- (the X server switches to the next mode\
    \ in the list, in this case, 1024 × 768. Pressing Ctrl+Alt+Keypad+ again switches\
    \ to 1280 × 1024 mode. Do it a third time and you return to the original mode.\
    \ Pressing Ctrl+Alt+Keypad- causes the X server to cycle backward through the\
    \ modes listed in the Modes entry.\n\nYou can make the X server start in any of\
    \ the supported modes. If you want the X server to start at the highest-resolution\
    \ mode, edit the Modes entry so that the desired resolution appears first. In\
    \ this case, the Modes entry is changed as follows:\n\n```\nModes \\\"1280x1024\\\
    \" \\\"800x600\\\" \\\"1024x768\\\"\n```\n\nThis change makes X start in 1280\
    \ × 1024 dpi."
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Changing the Default Color Depth\n\nSome applications only work properly\
    \ in a specific color depth, the number of colors displayed on the screen. Most\
    \ systems will run faster if you reduce the color depth (or the resolution). By\
    \ default, the X server starts in the highest possible color depth and resolution\
    \ that your system supports, subject to the configuration defined in `/etc/X11/XF86Config-4`.\
    \ This section shows you how to change this default behavior. To make the X server\
    \ start in a specific color depth, follow these steps:\n\n+   1.  Edit `/etc/X11/XF86Config-4`\
    \ file using your favorite text editor.\n+   2.  Locate the `Screen` section.\
    \ Immediately above the first `Display` subsection, insert or change the following\
    \ line:\n+   \n+       `DefaultDepth N`\n+   \n+   This line sets the default\
    \ color depth that the X server uses to *N* bits per pixel. *N* can be 8, 16,\
    \ or 24. For example, referring back to Listing 21-1, if you want the default\
    \ color depth to be 24bpp, you would add `DefaultDepth 24` above the first `Display`\
    \ subsection. Listing 21-2 illustrates this modification (the change is shown\
    \ in bold text).\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_241_0.png)\n\n> The\
    \ keyword `DefaultDepth` can also be `DefaultColorDepth` for purposes of backward\
    \ compatibility with older versions of XFree86, but support for the old configuration\
    \ keyword may disappear.\n\n+   3.  Save the change and exit the editor.\n+  \
    \ 4.  Restart X using one of the methods described in \"Controlling the X Server\"\
    \ earlier in this session, and the server will start using the specified color\
    \ depth.\n\n**Listing 21-2**  Setting the Default Color Depth to 24bpp\n\n```\n\
    ```\n        Section \"Screen\"\n                Identifier      \"Screen0\"\n\
    \                Device          \"ATI  Mach64\"\n                Monitor    \
    \     \"Monitor0\"\n                DefaultDepth    24\n                SubSection\
    \  \"Display\"\n                        Depth   24\n                        Modes\
    \   \"800x600\" \"1024x768\" \"1280x1024\"\n        EndSubSection\n          \
    \      SubSection  \"Display\"\n                        Depth   16\n         \
    \               Modes   \"800x600\" \"1024x768\" \"1280x1024\"\n             \
    \   EndSubSection\n        EndSection\n```\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Troubleshooting


    If xf86cfg does not start or is not installed, you can use the older, text-based
    program xf86config to configure the X server. Be sure to use the filename /etc/X11/XF86Config-4
    when you save the configuration file.


    If you still have trouble creating a working configuration file, try the command
    Xfree86 -configure. This causes the X server to detect the video hardware, create
    a basic configuration file in your home directory, and then start the X server
    using that configuration file.


    If you do not know the exact specifications of your video adapter, such as the
    chipset or the amount of video RAM it has, run the command SuperProbe or SuperProbe
    -v. The SuperProbe program probes the installed hardware and displays a report
    indicating what it finds. This information will help you create a basic configuration
    that enables X to start. You might want to save SuperProbe''s output by piping
    it to a file like this:


    ```

    SuperProbe > SuperProbe.report

    ```


    When troubleshooting problems with X, disable the graphical login and work from
    the command line. (Refer to Session 22 to find out how to disable the graphical
    login.) In addition, you will find it useful to save X''s startup messages because
    they provide valuable information that can help you locate and fix the problem
    you want to solve. To save this information, use the following command:


    ```

    startx > log 2> err

    ```


    This command redirects normal output to the file named log and sends error messages
    to the file named err (both files will be in the current directory). Use the more
    command to browse these files.


    # Review


    This session showed you how to configure the X Window System. You learned how
    to reconfigure X using the xf86cfg program, how to abort the X server using Ctrl+Alt+Backspace,
    and how to cycle through the available screen resolutions using Ctrl+Alt+Keypad+
    and Ctrl+Alt+Keypad-. Finally, you read about how to change the X server''s default
    color depth.


    # Quiz Yourself


    +   1. What is the X server and what does it do? (See “Understanding the X server.”)


    +   2. What is xf86cfg and how do you start it? (See “Using xf86cfg.”)


    +   3. How do you kill the X server? (See “Aborting X.”)


    +   4. What keystroke causes the X server to use the next available screen resolution?
    (See “Switching screen modes.”)


    +   5. How do you make the X server start in a specific color depth? (See “Changing
    the Default Color Depth.”)'
