    # ## Getting Help with the Red Hat Linux Installation


    Red Hat Linux installs on most PCs with supported hardware without incident. But,
    if you run into difficulties that neither a text mode nor an expert mode installation
    solve, experienced help is just a few clicks away. In fact, even if your installation
    runs flawlessly, you may find some of the following links and resources valuable
    and informative.


    Red Hat makes their complete set of manuals available on the Web. For installation
    and initial configuration problems not addressed in these first two sessions,
    be sure to look at one or both of the following links:


    +   - The Official Red Hat Linux x86 Installation Guide: `http://www.redhat.com/support/manu...`


    +   - The Official Red Hat Linux Getting Started Guide: `http://www.redhat.com/support/manu...`


    These two guides are the authoritative references for installing Red Hat Linux
    and making basic customizations.


    The Red Hat Knowledgebase at `http://www.redhat.com/apps/support/` is another
    rich source of information. If you have had the problem, someone else probably
    has, too, so search for a solution using the Knowledgebase.


    A third likely source of information is the product errata and updates, available
    at `http://www.redhat.com/apps/support/updates.html`.


    Finally, other Red Hat Linux users are sometimes the best source of information.
    The archives of Red Hat''s mailing lists have a lot of useful information (and
    some not so useful.'
