  md: '# Configuring the X Window System


    If the installation program cannot detect your video card during the X configuration
    step, you can skip that step and configure X after completing the rest of the
    installation. Use the following procedure to configure X after the installation
    finishes:


    +   1. After the installation is complete and you reboot the PC, you get a text
    login screen. Log in as root and type Xconfigurator to run a utility program with
    that name. The Xconfigurator utility enables you to create a configuration file
    that the X server needs.

    +   2. The Xconfigurator program starts with a Welcome dialog box that displays
    a message about the X configuration file. After reading the message, press Enter
    to continue with the configuration process.


    Xconfigurator automatically detects the chipset used by your video card and displays
    a summary message, as shown in Figure 2-1.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_39_0.png)


    # Figure 2-1 The message that results from the Xconfigurator''s probing of the
    video card


    In this case, Xconfigurator found a video card based on the nVidia GeForce 256
    DDR chipset and recommends the nv XFree4 driver. The dialog box in Figure 2-1
    is only an example, so the dialog box you see will likely be different. Make sure
    the Xconfigurator identifies the proper card, and then press Enter to continue
    with the rest of the configuration. The next dialog box you see enables you to
    select your monitor from a list.


    Press the up- and down-arrow keys to browse through the list. If you find your
    monitor model listed, position the cursor on that monitor and then press Enter.
    Otherwise, select Custom and press Enter. If you choose Custom, Xconfigurator
    displays another dialog box in which you have to provide two critical parameters
    for your monitor:


    +   - **Horizontal synchronization frequency** is the number of times per second
    that the monitor draws a horizontal line, in kilohertz (kHz).

    +   - **Vertical synchronization rate** or vertical refresh rate is how many times
    per second the monitor draws the entire screen.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'You can find the parameters for the frequencies in your monitor''s manual or,
    in many cases, on the manufacturer''s Web site. Press Enter to continue. Xconfigurator
    displays a list of predefined horizontal synchronizaton ranges.


    The values for the monitor synchronization rates should match your monitor''s
    specifications. Do not guess! If you specify a rate that exceeds your monitor''s
    actual capabilities, you may damage it.


    For example, if your monitor''s manual says that it is capable of displaying 1,280
    by 1,024 resolution at 60Hz, then you should pick the item that matches this specification.
    After selecting the horizontal synchronization capabilities, press Enter.


    Xconfigurator next prompts you for the vertical synchronization rate of your monitor.
    Pick the vertical synchronization range that is nearest to your monitor''s specifications
    and press Enter.


    If Xconfigurator is unable to detect the amount of video memory on your video
    card, it displays a dialog box that prompts you to select the amount of video
    memory from a list. Select the amount closest to your video card''s memory and
    press Enter.


    Xconfigurator prompts you to identify the clock chip—a timing device on the video
    card. You can safely press Enter to accept the default selection labeled No Clockchip
    Setting (recommended).


    Xconfigurator then displays a Select Video Mode dialog box containing a list of
    video modes, combinations of pixel resolutions, such as 800 × 600 pixels or 1,280
    × 1,024, and color depths, such as 16 or 24 bits per pixel, as shown in Figure
    2-2. Your card or monitor will support only certain video modes, so refer again
    to your monitor manual if necessary.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_40_0.png)


    Press Tab to move the cursor to a video mode and press the spacebar to select
    that mode. You can choose as many modes as you want. Then press Tab to select
    the OK button and press Enter.


    Next, Xconfigurator gives you the option of starting X to test your configuration.
    You should press Enter. A graphical X screen appears and Xconfigurator shows a
    dialog box that asks if you can read the text. Click with the mouse to close the
    dialog box.'
  merge: -1
  img_proc: true
