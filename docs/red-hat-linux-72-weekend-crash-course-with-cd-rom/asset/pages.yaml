- pgno: 259
  md: '```

    XFree86-75dp1-fonts-4.0.3-5.i386.rpm

    (rest of the listing deleted)

    ```


    As you can guess from the listing, all RPM files end with an .rpm extension. To
    understand the various parts of the filename, consider the following RPM:


    ```

    XFree86-4.0.3-5.i386.rpm

    ```


    This filename has the following parts separated by dashes (-):


    +   - Package name    XFree86

    +   - Version number   4.0.3

    +   - Release number   0.5 (a Red Hat-assigned release number)

    +   - Architecture 1386 (for Intel 80386-compatible processors)


    Usually, the package name is descriptive enough for you to guess the contents
    of the RPM. The RPM’s version number is almost always the same as the software
    package’s current version number, even when it is distributed in some other form,
    such as a tar file. Red Hat assigns the release number to keep track of changes.
    In this case, the release number is 5, meaning that it is the fifth version of
    the RPM created for version 4.0.3 of the XFree86 package. The architecture should
    be 1386, 1486, 1586, 1686, or noarch for the RPMs you want to install on a PC
    with an Intel x86-compatible processor.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_259_0.png)


    In Session 26, you''ll learn how to use tar to back up and restore files.


    # Querying RPMs with the rpm command


    As you install, upgrade, and remove RPMs, the rpm command updates a database of
    installed RPMs. You can use the rpm -q command to query this database in order
    to find out information about packages installed on your system. For example,
    to find out the version number of the Linux kernel installed on your system, type
    the following rpm -q command:


    ```

    rpm -q kernel

    kernel-2.4.2-2

    ```


    The response is the name of the RPM for the kernel—the executable version of the
    kernel; not the source files. The name is the same as the RPM filename except
    that the last part, .1386.rpm, does not appear. In this case, the version part
    of the RPM tells you that the kernel is 2.2.16.


    You can see a list of all installed RPMs by typing the following command:


    ```

    rpm -qa | more

    ```'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'If you want to search for a specific package, feed the output of `rpm -q` to
    the `grep` command. For example, to see all packages with `kernel` in their names,
    type:


    ```

    ```

    rpm -qa | grep kernel

    kernel-headers-2.4.2-2

    kernel-2.4.2-2

    kernel-source-2.4.2-2

    kernel-doc-2.4.2-2

    kernel-pcmcia-cs-3.1.24-2

    ```

    ```


    You can query much more than a package''s version number with the `rpm -q` command.
    By adding various single letter options, you can find out other useful information
    about a package. Combining `rpm -q` lists all the files in a given RPM. For instance,
    try the following command to see the files in the kernel package:


    ```

    ```

    rpm -ql kernel

    /boot/System.map-2.4.2-2

    /boot/module-info-2.4.2-2

    /boot/vmlinuz-2.4.2-2

    /boot/vmlinuz-2.4.2-2

    /dev/shm

    /lib/modules

    /lib/modules/2.4.2-2

    /lib/modules/2.4.2-2/build

    /lib/modules/2.4.2-2/kernel

    /lib/modules/2.4.2-2/kernel/arch

    (rest of the listing deleted)

    ```

    ```


    Table 23-1 lists several useful forms of `rpm -q` commands to query information
    about a package. To use any of these `rpm -q` commands, type the command followed
    by the package name.


    Table 23-1 Common Forms of `rpm -q` Commands

    | Command | Description |

    |---|---|

    | `rpm -qa` | Lists all installed RPMs. |

    | `rpm -qc` | Lists all configuration files in a package. |

    | `rpm -qd` | Lists all documentation files in a package. These are usually the
    online manual pages (also known as man pages), but may also include GNU text user
    pages, HTML pages, and documentation placed in `/usr/share/doc`. |

    | `rpm -qi` | Displays detailed information about a package including version
    number, size, installation date, a brief description, and a summary of the package''s
    functionality. |

    | `rpm -ql` | Lists all the files in a package. For some packages, this can be
    a very long list. |

    | `rpm -qs` | Lists the state of all files in a package. |'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Installing RPMs with the rpm command


    To install an RPM, you have to use the rpm -i command. You must provide the name
    of the RPM file as the argument. A typical example is to install one from this
    book’s companion CD-ROM containing the Red Hat Linux RPMs. As usual, you have
    to first mount the CD-ROM and then change to the directory in which the RPMs are
    located. Then, use the rpm -i command to install the RPM followed by the name
    of the RPM.


    For example, to install the kernel-source RPM (which contains the source files
    for the Linux operating system) from the CD-ROM, you’d type the following commands:


    ```

    ```

    mount /mnt/cdrom

    cd /mnt/cdrom/RedHat/RPMS

    rpm -i kernel-source*

    ```

    ```


    ![](img/5fe8f856723cde0b366f73584b9e64b8_261_0.png)


    You do not have to type the full RPM filename; you can use a few characters from
    the beginning of the name followed by an asterisk (*). Make sure that you type
    enough of the name to identify uniquely the RPM file or files you want to install.


    If you try to install an already installed RPM, the rpm command displays an error
    message such as the following, which results after trying to install the Emacs
    editor on a sample system:


    ```

    ```

    rpm -i emacs-20*

    package emacs-20.7-34 is already installed

    ```

    ```


    To force the rpm command to install a package even if there are errors, just add
    --force to the rpm -i command as follows:


    ```

    ```

    rpm -i --force emacs-20*

    ```

    ```


    If you combine the v option with -i, the rpm command will display a little more
    information about what rpm is doing while it is installing an RPM. If you use
    the h option, the rpm command will print hash marks (#) to show its progress while
    installing an RPM. Here’s how an RPM installation looks if you combine the v and
    h options with -i when installing the zsh RPM:


    ```

    ```

    rpm -ivh zsh-3.0.8-8.i386.rpm

    Preparing...                          ###########################################

    [100%]

    1:zsh                                    ###########################################

    [100%]

    ```

    ```


    # Removing RPMs with the rpm command


    You can remove, or uninstall, a package if you realize that you don’t really need
    the software, or if it is causing problems for your system. For example, if you
    install the X Window System development package, but are not interested in writing
    any X applications, you can remove the package easily by using the rpm -e command.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'You need the name of the package before you can remove it. One good way to
    find the name is to use `rpm -qa` in conjunction with `grep` to search for the
    appropriate RPM file. For example, to locate the X Window System development RPM,
    you can try this:


    ```

    ```

    rpm -qa | grep Xfree

    XFree86-75dpi-fonts-4.0.1-0.43

    XFree86-twm-4.0.1-0.43

    XFree86-libs-4.0.1-0.43

    XFree86-xfs-4.0.1-0.43

    XFree86-4.0.1-0.43

    XFree86-devel-4.0.1-0.43

    XFree86-tools-4.0.1-0.43

    XFree86-xdm-4.0.1-0.43

    XFree86-SVGA-3.3.6-32

    ```

    ```


    In this case, `XFree86-devel` is the package name you need. To remove the package,
    type:


    ```

    ```

    rpm -e XFree86-devel

    ```

    ```


    ![](img/5fe8f856723cde0b366f73584b9e64b8_262_0.png)


    The `rpm -e` command does not remove a package that other packages need. For example,
    when you try to remove the `kernel-headers` package, you might get the following
    error message:


    ```

    ```

    rpm -e kernel-headers

    error: removing these packages would break dependencies:

    kernel-headers      is needed by glibc-devel-2.1.92-5

    kernel-headers      >= 2.2.1 is needed by glibc-devel-2.1.92-5

    ```

    ```


    As the output from the `rpm -e` command shows, the `glibc-devel` package needs
    the `kernel-headers` package in order to function properly. In RPM parlance, `glibc-devel`
    depends on `kernel-headers`.


    # ### Upgrading RPMs with the rpm command


    When you use the `rpm -U` command to upgrade an RPM, you must provide the name
    of the RPM file that contains the new software. For example, suppose you have
    version 4.74 of Netscape Communicator installed on your system, but you want to
    upgrade to version 4.76. You''d download the RPM file `netscape-communicator-4.76-11.i386.rpm`
    from Red Hat''s FTP server (`ftp://ftp.redhat.com/pub/redhat/update/`, or one
    of the mirror sites listed at `http://www.redhat.com/mirrors.html`), and then
    use the following command:


    ```

    ```

    rpm -U netscape-communicator-4.76-11.i386.rpm

    ```

    ```


    The `rpm` command performs the upgrade by first removing the old version of the
    Netscape Communicator package and then installing the new RPM.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Whenever possible, you should use `rpm -U` to upgrade software, rather than
    doing it manually yourself by removing the old package (`rpm -e`) and then installing
    the new version (using `rpm -i`). Why? Allowing RPM to perform the upgrade using
    `rpm -U` automatically saves the old configuration files, which saves you the
    hassle of configuring the software after a fresh installation. If you manually
    type `rpm -e` followed by `rpm -i` to erase an old RPM and install its replacement,
    the erase operation *also* deletes the old configuration files. The `rpm` upgrade
    command contains logic to save the old configuration files.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_263_0.png)


    > When you upgrade the kernel and the kernel module packages that contain a ready-to-run
    Linux kernel, do not use the `rpm -U` command. Instead, install it with the `rpm
    -i` command. Using `rpm -i` ensures that you don''t overwrite files being used
    by the current kernel.


    # Verifying RPMs with the `rpm` command


    You may not do this often, but if you suspect that a software package is not properly
    installed, use the `rpm -V` command to verify the package. For example, to verify
    the kernel package, type the following:


    ```

    rpm -V kernel


    ```


    This causes `rpm` to compare size and other attributes of each file in the package
    against the original files. If everything verifies correctly, the `rpm -V` command
    does not print anything. If it detects any discrepancies, `rpm` displays a report
    of the discrepancies. For example, suppose you modified the configuration files
    for the Apache Web server. Here is what you might see when you verified the Apache
    package:


    ```

    rpm -V apache

    S,5....T c /etc/httpd/conf/httpd.conf


    ```


    In this case, the output from `rpm -V` shows that a configuration file has changed.
    Each line of this command''s output consists of three parts:


    +   * The line starts with eight characters; each character indicates the type
    of discrepancy found. For example, S means the size has changed since the file
    was originally installed. T means the last modification time has changed. A period
    (.) indicates that a specific attribute matches the original.

    +   * For configuration files, an `c` appears next; otherwise, this field is blank.
    That''s how you can tell whether a file is a configuration file. Typically, you
    don''t have to worry if a configuration file has changed because you probably
    made the changes yourself.

    +   * The last part of the line is the file''s full pathname. From this part,
    you can tell the exact location of the file.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Troubleshooting


    If you get error messages when using the `rpm` command to install, upgrade, or
    remove an RPM, make sure you are the root user. Any user can use the `rpm` command
    (or Gnome RPM) to query and verify RPMs, but only the root user can add, delete,
    or upgrade RPMs.


    If you get an error message resembling “Package foo Is Already Installed” and
    want to re-install the foo RPM again anyway, use the `--force` option with `rpm
    -i`. The reason that RPM does not reinstall already installed RPMs is to try and
    minimize the chance of overwriting configuration files or otherwise altering the
    configuration of a running system.


    Similarly, if you are removing an RPM using `rpm -e` and encounter an error message
    resembling “Error: Removing These Packages Would Break Dependencies,” you can
    use the `--nodeps` option with `rpm -e` (rpm `-e --nodeps`) to tell RPM to ignore
    the dependencies and remove the package anyway. However, before using `--nodeps`,
    make sure you will not compromise your system’s integrity and stability and be
    sure to have a way to boot the system and restore the original configuration.


    # Review


    This session introduced you to the Red Hat Package Manager (RPM) and its associated
    rpm commands. You learned to use the Gnome RPM graphical utility to install and
    uninstall RPMs. You also learned the syntax of a number of rpm commands to query,
    install, upgrade, remove, and verify RPMs.


    # Quiz Yourself


    +   1. What is an RPM? (See “Using Gnome RPM to Install and Remove Packages.”)

    +   2. What can you do with Gnome RPM and how do you run it? (See “Using Gnome
    RPM to Install and Remove Packages.”)

    +   3. What is the syntax of the rpm command to find out all of its command-line
    options? (See “Using the rpm Command to Install and Remove Packages.”)

    +   4. Which rpm command do you use to view a list of all installed RPMs? (See
    “Querying RPMs with the rpm command.”)

    +   5. How do you install a new RPM from this book’s companion CD-ROM containing
    the Red Hat Linux RPMs? (See “Installing RPMs with the rpm command.”)'
  merge: -1
  img_proc: true
