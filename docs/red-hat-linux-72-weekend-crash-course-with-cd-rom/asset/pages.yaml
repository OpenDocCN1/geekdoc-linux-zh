    # APPENDIX


    # A


    # Answers to Part Reviews


    T his appendix contains the answers to the part review questions at the end of
    each part in this Weekend Crash Course. Think of these reviews as mini-tests that
    are designed to help you prepare for the final — the Skills Assessment Test on
    the CD.


    # Friday Evening Review Answers


    +   1. It is important to review the Red Hat Linux compatibility lists in order
    to make sure that your PC’s hardware will work with it. At a bare minimum, you
    must have a Linux-compatible CPU, bus type, disk drive, video adapter, monitor,
    keyboard, mouse, and CD-ROM drive to install Red Hat Linux from the companion
    CD-ROMs. If you want to run the X Window System and graphical desktops such as
    GNOME or KDE, you also must ensure that XFree86 (the X Window System for Linux)
    supports the mouse, the video card, and the monitor.


    +   2. It is not necessary to create a Red Hat boot floppy if your system is capable
    of booting from a CD-ROM because the installation CD-ROM has a bootable file system
    on it.


    +   3. Usually a PC’s hard disk has a single partition that is used by Windows
    95/98. If you decide to keep Windows on your PC, you have to repartition the hard
    disk to create room for the Linux file system. It’s possible to repartition in
    two ways: by backing up everything and destructively repartitioning the disk with
    the FDISK command or by using the FIPS program to non-destructively create room
    for a new partition. You probably want to use the FIPS program because it is easier
    than destructive repartitioning. You could also use tools such as PartitionMagic
    to create a new partition non-destructively for Linux.


    +   4. The Linux fdisk utility is a text-mode disk partitioning utility that enables
    you to partition or repartition your hard disk during and after the Red Hat Linux
    installation program.


    +   5. Linux uses the swap partition, or space, as virtual memory where disk storage
    is used as an extension of physical memory (RAM). When the Linux kernel runs out
    of physical memory to run a program, it can move (or swap out) the contents of
    currently unneeded parts of RAM to make room for a program that needs more'
