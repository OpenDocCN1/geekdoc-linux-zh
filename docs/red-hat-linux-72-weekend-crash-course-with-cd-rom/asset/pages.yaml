    # Troubleshooting


    If programs that you schedule with the at command or which use crontab do not
    execute, make sure that they are in your path. Alternatively, you can specify
    a command’s complete pathname, such as /home/kwall/bin/myjob.sh, in order to make
    sure that the atd and crond daemons can find it.


    A common problem, especially on stand-alone Red Hat Linux systems used at home,
    is that the crond or atd daemons are not running. To make sure they are running,
    log in as the root user and type the following commands:


    ```

    ```

    /etc/rc.d/init.d/atd restart

    /etc/rc.d/init.d/crond restart

    ```

    ```'
