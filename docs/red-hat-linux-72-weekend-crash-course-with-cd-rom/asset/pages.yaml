- pgno: 212
  md: '# ## SESSION 19

    Working with the Office Tools in Red Hat Linux


    +   * Using the Gnumeric spreadsheet

    +   * Exploring KOffice applications

    +   * Maintaining calendars

    +   * Working with calculators

    +   * Utilizing the spelling checker


    This session focuses on the applications that you need for day-to-day office work.
    This book’s companion CD-ROMs include all of the Red Hat Linux office tools discussed
    in this session: calendars, calculators, and spelling checkers. I also introduce
    you to several prominent commercially available office applications for Linux
    that are not included on the companion CD-ROMs.


    # **Using the Gnumeric Spreadsheet**


    The GNOME desktop comes with Gnumeric, which is an X-based graphical spreadsheet
    program. To try out Gnumeric, select Main Menu Program Applications Gnumeric Spreadsheet
    from the GNOME Panel. The Gnumeric program displays its main window, which looks
    similar to Windows-based spreadsheets such as Microsoft Excel. In fact, Gnumeric
    can read and write Excel 95 spreadsheet files.


    You use Gnumeric the same way as Microsoft Excel. You can type entries in cells,
    use formulas, and format the cells, specifying the type of value and the number
    of digits after the decimal point.


    You might want to type in a sample spreadsheet to get used to Gnumeric. Try some
    formulas that you normally use in Microsoft Excel. For example, use the formula
    SUM(D2:D6) to add up the entries from cell D2 to D6. To set cell D2 as the product
    of the entries A2 and C2, type *A2\*C2 in cell D2.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'To learn more about the functions available in Gnumeric, select Help\> Gnumeric
    function reference from the menu. This brings up the GNOME Help Browser with information
    about the Gnumeric functions. You can browse the list of functions and click one
    to read more about that function. Figure 19-1 shows a small spreadsheet created
    using Gnumeric.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_213_0.png)


    When you’re finished preparing the spreadsheet, select File\> Save As to save
    it. A dialog box appears from which you can specify the file format, the directory
    location, and the name of the file. Gnumeric can save the file in a number of
    formats including XML (eXtensible Markup Language), Excel 95, a simple text file,
    and Adobe’s Portable Document Format (PDF) file. You cannot read the file back
    into Gnumeric unless you save it as an XML or Excel 95 file. Gnumeric’s default
    file format is XML, which is a text-based format. However, Gnumeric compresses
    the resulting XML file using the GNU Zip (gzip) compression program. Gnumeric
    assigns a .gnumeric extension to files stored in the compressed XML format.


    Save the spreadsheet in Excel 95 format. Then transfer that file to a Windows
    system and try to open it using Microsoft Excel. Notice that the file loses some
    of the text styles (such as bold and justification) in the translation. However,
    the basic elements, such as the numbers and the formulas, stay intact when you
    save the spreadsheet in Excel 95 format.


    # # Exploring Koffice Applications


    Red Hat Linux includes Koffice, a complete suite of office productivity applications,
    including the following:'
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   * KWord for word processing

    +   * KSpread for spreadsheets

    +   * KChart for creating charts and graphs

    +   * KPresenter for presentations

    +   * KIllustrator for drawing vector graphics


    We do not have enough time to discuss all of the KOffice applications, so we''ll
    only introduce you to KSpread and KWord. Figure 19-2 shows KSpread with the same
    spreadsheet shown in Figure 19-1. To start KSpread from KDE, select K-> Office
    -> KSpread.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_214_0.png)


    *Figure 19-2 The KSpread spreadsheet*


    As you can see in Figure 19-2, KSpread''s interface is similar to Microsoft Excel''s
    and, in its default configuration, most of the functions you will need are already
    available. KSpread can open about a dozen spreadsheet formats, including Excel
    97, but will only save new sheets in its own format, .ksp, or as CSV (Comma separated
    value) data.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_214_1.png)


    Even though KOffice was written with KDE in mind, it runs just fine under GNOME.
    To start KOffice applications while using the GNOME desktop, select Main Menu->
    KDE Menu-> Office, and then select the application you want to run.


    Figure 19-3 shows a KWord document with part of the worksheet from Figure 19-2
    embedded in it. In fact, to edit the worksheet in KSpread, you can simply click
    on the sheet to make KSpread active.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_215_0.png)


    *Figure 19-3 KWord allows you to embed objects from other KOffice applications.*


    To start KWord from KDE, select *K Office*\> KWord. You can experiment with the
    components of the KOffice suite and discover everything that it is capable of
    doing.


    +   20 Min. To Go


    # Maintaining Calendars


    The companion CD-ROMs contain several calendar programs. The GNOME desktop comes
    with its own calendar program. Additionally, when you install the X Window System
    following the steps outlined in Session 1, you also install *ical*, which is an
    X Window System-based calendar program. You can start both calendars from the
    GNOME Panel’s Main Menu button or the KDE main menu.


    # *ical* Calendar


    To start *ical*, select Main Menu\>* Programs*\>* Applications*\>*ical* from the
    GNOME desktop. (You can also simply type *ical* in a terminal window.) The program
    displays a full-screen window where you can click a date to view that day’s schedule.
    To add appointments for a specific time, click the time and type a brief description
    of the appointment.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'You can go to a different month or year by clicking the arrows next to the
    month and the year. After you finish adding events and appointments, select File↵Save
    to save the calendar.


    # GNOME calendar


    To start the GNOME calendar program, select Main Menu↵Programs↵Applications↵Calendar
    from the GNOME Panel. The GNOME calendar''s main window appears. The GNOME calendar
    has a different, more intuitive, user interface than the ical program. Figure
    19-4 shows the GNOME calendar in its default Day view.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_216_0.png)


    Figure 19-4 The GNOME calendar shows daily, weekly, monthly, and yearly calendar
    views.


    The To-Do list contains a task item to finish writing this chapter today. To create
    a new task, click the Add button. Use the Edit button to change an existing task.
    You can click the Delete button to remove the highlighted task.


    The GNOME calendar''s toolbar buttons give you quick access to the most commonly
    needed functions, such as moving to a different date or adding a new appointment.
    Underneath the toolbar, a number of tabs display the appointments in four different
    views: Day View, Week View, Month View, and Year View. If you are unsure about
    what a button does, simply hover the mouse pointer over the button and a small
    pop-up help message gives you some information.


    To add an appointment, you can double-click the date in the right side of the
    window and then click the New button on the toolbar. This brings up a dialog box
    where you can enter information about the appointment. Select File↵Save to store
    the appointments on disk.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_217_0.png)


    # Working with Calculators


    You have a choice of three calculators that you can use with Red Hat Linux:


    +   - xcalc, the X calculator that comes with the X Window System

    +   - GNOME calculator

    +   - KDE calculator


    All of these calculators are scientific calculators capable of performing typical
    functions such as square root and inverse, as well as trigonometric functions
    such as sine, cosine, and tangent.


    # xcalc calculator


    The xcalc calculator is styled after the Texas Instruments TI-30 model. To use
    the xcalc calculator, type `xcalc &` in a terminal window. Figure 19-5 shows the
    resulting calculator. You can use it by clicking its buttons or by entering the
    numbers on the keyboard.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_217_1.png)


    **Figure 19-5** The xcalc TI-30-style calculator


    If you prefer the Reverse Polish Notation (RPN) of the Hewlett-Packard calculators,
    you can get a calculator modeled after the HP-10C by typing `xcalc -rpn &` command.
    In RPN, the operands precede the operation. For example, to add 2.25 to 9.95 on
    an HP-10C calculator, you press the keys in the following order: 2.25 ENTER 9.95
    +.


    # GNOME calculator


    The GNOME calculator is based on xcalc, but with a nicer user interface. To run
    the GNOME calculator, select **Main Menu Program** Simple Calculator in the GNOME
    Panel. Figure 19-6 shows the resulting display of the GNOME calculator.


    If you compare Figure 19-5 with Figure 19-6, you see that both xcalc and the GNOME
    calculator have the same set of buttons, except that GNOME calculator''s buttons
    are easier to read.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_218_0.png)\n\nFigure 19-6 The GNOME\
    \ calculator\n\n# KDE calculator\n\nKDE also includes a scientific calculator\
    \ with more features than xcalc and the GNOME calculator. For example, it can\
    \ perform calculations in hexadecimal, decimal, octal, and binary format. From\
    \ the KDE desktop, you can start the KDE calculator by selecting K->Utilities->Calculator\
    \ (or Main Menu->KDE Menus->Utilities->Calculator from the GNOME Panel).\n\nWith\
    \ the KDE calculator, you can convert a number from one base to another by simply\
    \ entering the number with one of the buttons selected and then clicking the desired\
    \ base. For example, to convert the hexadecimal value FF to decimal, click the\
    \ Hex button and enter FF. Then click the Dec button to see the answer, which\
    \ should be 255.\n\n# Utilizing the Spelling Checker\n\nThe aspell utility is\
    \ an interactive spelling checker. When you install Red Hat Linux from the companion\
    \ CD-ROMs, you have the opportunity to install aspell.\n\nUsing aspell to check\
    \ the spelling of words in a text file is simple. To do so, simply type aspell\
    \ check filename. To try out aspell, type some notes and save them in a text file\
    \ named notes. txt. To run the spelling checker on that file, type the following\
    \ command in a terminal window:\n\n```\n``` \naspell check notes.txt \nThis note\
    \ describes the *conensus* reached during the August 16 meeting. \n1) conensus\
    \ \n2) con census \n3) con-census \n4) concensus \n5) concerns \n) Ignore \nr)\
    \ Replace \na) Add \n? \n6) conensus's \n7) consensus \n8) consistencies \n9)\
    \ concern \n0) consensual \ni) Ignore all \nR) Replace all \nx) Exit\n```\n```\n\
    \nWhen aspell starts, it scans the file named notes. txt until it finds a misspelled\
    \ word (any word that does not appear in aspell's dictionary). As the output shows,\
    \ aspell displays the sentence with the misspelled word (conensus) and highlights\
    \ that word by"
  merge: -1
  img_proc: true
- pgno: 219
  md: 'enclosing it in a pair of asterisks (*). Below that sentence, aspell lists
    possible corrections, numbering them sequentially from 1. In this case, the utility
    lists consensus — the right choice — as the first correction for consensus. The
    list also includes a few items labelled with a letter that mean specific actions
    such as ignore the misspelling or accept the misspelled word for the rest of the
    file.


    At the end of the list of choices, aspell displays a question mark (?) prompt.
    You should press one of the numbers or letters from the list shown in aspell’s
    output to indicate what you want aspell to do. If you press a number, aspell uses
    the corresponding word to replace the misspelled one. Select i or I to ignore
    the misspelling; r to replace just this occurrence; R to replace all instances
    of this misspelling; a to add the word to your private dictionary; or x to exit
    aspell.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_219_0.png)


    To read the aspell manual, start the Web browser and select *File:: Open Page*
    and click the **Choose File** button from the **Open Page** dialog box. Go to
    the */usr/share/doc* directory and look for a directory name that begins with
    aspell; the complete name depends on the aspell version number. From the *man_html*
    subdirectory of that directory open the *1\_Introduction.html* file.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_219_1.png)


    # REVIEW


    This session introduced you to office applications for Linux. You tried out a
    few common office tools — spreadsheets, calendars, calculators, and spelling checkers
    — that come with Red Hat Linux. You also learned about several commercially available
    office application suites for Linux — WordPerfect Office 2000 for Linux, Appliware
    Office, and StarOffice. These commercial applications are not part of Red Hat
    Linux, but you learned how to find out more about each product in case you need
    a Linux office suite for your home or business.


    # QUIZ YOURSELF


    +   1. What is the default file format and file extension of the Gnumeric spreadsheet?
    (See “Using the Gnumeric Spreadsheet.”)

    +   2. How do you add an appointment to the GNOME Calendar? (See “GNOME calendar.”)

    +   3. What choice of calculators do you have with Red Hat Linux? (See “Working
    with Calculators.”)

    +   4. What utility do you use to check the spellings in a text file? (See “Utilizing
    the Spelling Checker.”)

    +   5. What are some commercially available office applications for Linux? (See
    “Exploring Koffice Applications.”)'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# SESSION\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_220_0.png)\n\n# Using\
    \ the Red Hat Network\n\n+   **Session Checklist**\n+   \n+   \\- Registering\
    \ with the Red Hat Network\n+   \\- Running the Software Manager\n+   \\- Using\
    \ the Update Agent\n\nOne of the biggest challenges of maintaining your Red Hat\
    \ Linux system is keeping up with software updates that add new features, fix\
    \ bugs, and, most importantly, address real and potential security risks. In this\
    \ session, you’ll learn how to use the Red Hat Network to keep your Red Hat Linux\
    \ system up-to-date and secure.\n\n# Registering with the Red Hat Network\n\n\
    The Red Hat Network is a system management tool developed and administered by\
    \ Red Hat for Red Hat Linux systems. Its only service, at this time, is the Software\
    \ Manager. Software Manager consists of several services, including a software\
    \ update subscription service, automatic Red Hat Package Manager (RPM) updates,\
    \ and e-mail notification of bugs and security alerts.\n\nOf course, the Red Hat\
    \ Network is a fee-based service, not a free one. Red Hat Linux users who purchase\
    \ versions 6.2 and 7.x are permitted a free subscription to Software Manager for\
    \ one system. Additional subscriptions for other systems cost $19.95 per month,\
    \ per system.\n\n> For complete information about subscribing to the Red Hat Network,\
    \ visit its Web site at [http://www.redhat.com/network/](s0103.jpg).\n\nIn order\
    \ to use the Red Hat Network, you have to create a system profile and then register\
    \ it with the Red Hat Network. *A system profile* is a database of software and\
    \ hardware"
  merge: -1
  img_proc: true
- pgno: 221
  md: "information that Red Hat Network uses to customize the updates and notifications\
    \ you receive. Then, after a quick trip to the Red Hat Network to activate your\
    \ Software Manager subscription, you can cage the Update Agent to obtain the latest\
    \ updates for your system. To create the system profile and register with the\
    \ Red Hat Network, follow this procedure:\n\n+   1.  Using the GNOME desktop,\
    \ select **Main Menu** > **Programs** > **System** > **Red Hat Network**. This\
    \ opens the Red Hat Registration screen, shown in Figure 20-1.\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_221_0.png)\n\
    \n*Figure 20-1  The Red Hat Network privacy policy*\n\n+   2.  After you read\
    \ the privacy policy, click the **Next** button.\n+   \n+   3.  Fill out the form\
    \ shown in Figure 20-2 to register your system, and then click the **Next** button.\n\
    \n> **Note**\n> \n> When selecting a password for the account you create, *do\
    \ not use the password of any account you know.* Should your Red Hat Network account\
    \ information be compromised somehow, using a different password will maintain\
    \ the security of your system – using the same passwords gives the person with\
