- pgno: 244
  md: "# ## Understanding How Red Hat Linux Boots\n\n+   ### Session Checklist\n+\
    \   - Understanding the init process\n+   - Understanding the Red Hat Linux startup\
    \ scripts\n\nIt is important to learn the sequence in which Red Hat Linux starts\
    \ processes as it boots. You can use this knowledge to start and stop services\
    \ such as the Web server and Network File System (NFS), and to troubleshoot startup-related\
    \ problems. This session provides you with an overview of how Red Hat Linux boots\
    \ and starts the initial set of processes. You also become familiar with the shell\
    \ scripts that start various services and how to control the services that Red\
    \ Hat Linux runs.\n\n# ### Understanding the init Process\n\nWhen Red Hat Linux\
    \ boots, it loads and runs the *kernel* from the hard disk. The kernel is the\
    \ core of the operating system. However, the kernel is designed to run other programs.\
    \ A process named *init* starts the initial set of processes on your Linux system.\n\
    \nTo see the processes currently running on the system, type the command `ps ax\
    \ | more`. The first column in the output has the heading PID, and that column\
    \ shows a number for each process. PID stands for process ID (identification),\
    \ which is a sequential number assigned by the Linux kernel to each process (program)\
    \ when the process starts. Right at the beginning of the list of processes, you\
    \ notice a process with a PID of 1:\n\n```\n```\n  PID TTY          TIME CMD\n\
    \    1 ?           0:05 init [5]\n```\n```\n\nAs you can see, init is the first\
    \ process and it has a PID of 1. Also, init starts all other processes in your\
    \ Linux system. That’s why init is referred to as the mother of all processes."
  merge: -1
  img_proc: true
- pgno: 245
  md: 'What the *init* process starts depends on the following:


    +   * The *run level*, which designates a system configuration in which only a
    selected group of processes exists

    +   * The contents of the */etc/inittab* text file, which specifies the processes
    to start at different run levels

    +   * A number of shell scripts (located in the */etc/rc.d* directory and its
    subdirectories) that are executed at a specific run level


    The current run level, together with the contents of the */etc/initab* file, controls
    which processes *init* starts. For example, Linux has seven run levels: 0, 1,
    2, 3, 4, 5, and 6. By convention, some of these levels indicate specific processes
    that run at that level. Run level 1 denotes a single-user, stand-alone system.
    Run level 0 means the system is halted, and run level 6 means the system is being
    rebooted. Run levels 2 through 5 are multiuser modes with various levels of capabilities.


    The initial default run level is 3 for text-mode login screens and 5 for the graphical
    login screen. As the following section explains, you can change the default run
    level by editing a line in the */etc/inittab* file.


    To check the current run level, type the following command */sbin/runlevel* .
    The output will show the current and previous run levels:


    ```

    /sbin/runlevel

    N 5

    ```


    The *runlevel* command prints two alphanumeric characters as output. The first
    character of the output shows the previous run level (N means there was no previous
    run level), and the second character shows the current level (5).


    # Examining the */etc/inittab* file


    The */etc/inittab* file is the key to understanding the processes that *init*
    starts at various run levels. You can look at the contents of the file by using
    the *more* command as follows:


    ```

    more /etc/inittab

    ```


    ![](img/5fe8f856723cde0b366f73584b9e64b8_245_0.png)


    ![](img/5fe8f856723cde0b366f73584b9e64b8_245_1.png)


    > When looking at the contents of the */etc/inittab* file with the *more* command,
    you do not have to log in as *root* .


    The following is a listing of the */etc/inittab* file on a sample Red Hat Linux
    system that is set up for a graphical login screen:


    ```

    ##

    # initab     This file describes how the INIT process should set up

    #            the system in a certain run level.

    #

    # Author:    Miguel van Smoorenburg, <miguel@dsd-inrnl.nl.nugent.org>

    # Modified for RHS Linux by Marc Ewing and Donnie Barnes

    ```'
  merge: -1
  img_proc: true
- pgno: 246
  md: "# Session 22—Understanding How Red Hat Linux Boots\n\n225\n\n```\n# Default\
    \ runlevel. The runlevels used by RH are:\n# 0 - halt (Do NOT set initdefault\
    \ to this)\n# 1 - Single user mode\n# 2 - Multiuser, without NFS (The same as\
    \ 3, if you do not have networking)\n# 3 - Full multiuser mode\n# 4 - unused\n\
    # 5 - X11\n# 6 - reboot (Do NOT set initdefault to this)\n# \n$5:initdefault:\n\
    \n# System initialization.\nsl:sysinit:/etc/rc.d/rc.sysinit\n\n10:0wait:/etc/rc.d/rc\
    \ 0\n11:1wait:/etc/rc.d/rc 1\n12:2wait:/etc/rc.d/rc 2\n13:3wait:/etc/rc.d/rc 3\n\
    14:4wait:/etc/rc.d/rc 4\n15:5wait:/etc/rc.d/rc 5\n16:6wait:/etc/rc.d/rc 6\n\n\
    # Things to run in every runlevel.\nwd:once:/sbin/update\n\n# Trap CTRL-ALT-DELETE\n\
    ca:ctrlaltdel:/sbin/shutdown -t3 -r now\n\n# When our UPS tells us power has failed,\
    \ assume we have a few minutes\n# of power left. Schedule a shutdown for 2 minutes\
    \ from now.\n@ This does, of course, assume you have power installed and your\n\
    # UPS connected and working correctly.\npf:powerfail:/sbin/shutdown -h +2 \"Power\
    \ Failure; System Shutting Down\"\n# If power is restored before the shutdown\
    \ completes, then cancel it.\nor:12345:powerokwait:/sbin/shutdown -c \"Power Restored;\
    \ Shutdown Canceled\"\n\n# Run gettys in standard runlevels\n1:2345:respawn:/sbin/mingetty\
    \ tty1\n2:2345:respawn:/sbin/mingetty tty2\n3:2345:respawn:/sbin/mingetty tty3\n\
    4:2345:respawn:/sbin/mingetty tty4\n5:2345:respawn:/sbin/mingetty tty5\n6:2345:respawn:/sbin/mingetty\
    \ tty6\n\n# Run xdm in runlevel 5\n# xdm is now a separate service\nx:5:respawn:/etc/X11/prefdm\
    \ -nodemon\n```\n\nConfused? Don't be. The /etc/inittab file is easy to understand\
    \ once you're comfortable with its format. Each line in /etc/inittab specifies\
    \ the action that init should take when switching to a given run level. Each entry\
    \ in the inittab file has four fields, separated by colons (:), in the following\
    \ format:\nid:runlevel:action:process"
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The fields have the following meanings:


    +   · *id* is a unique, one- or two-character identifier. The init process uses
    this field internally. You can use any identifier you want. However, you cannot
    use the same identifier on more than one line. For example, s1, x, and 1 are all
    valid identifiers.


    +   · *runlevels* is a sequence of zero or more characters, each denoting a run
    level. For example, the line with the identifier 1 applies to run levels 1 through
    5. So, the *runlevels* field for this entry is 12345. This field is ignored if
    the *action* field is set to sysinit, boot, or bootwait.


    +   · *action* tells the init process what to do with that specific entry. For
    instance, if this field is *initdefault*, init interprets the *runlevels* field
    as the default run level. If this field is set to *wait*, init starts the process
    specified in the *process* field and waits until that process exits. Table 22-1
    summarizes the valid *action* values you can use in the *action* field.


    +   · *process* specifies the process that init has to start. Of course, some
    settings of the *action* field require no *process* field. For example, when *action*
    is set to *initdefault*, a *process* field is unnecessary.


    | Action | Description |

    | :--- | :--- |

    | respawn | Restarts the process whenever it terminates. |

    | boot | Executes the process as the system boots, regardless of the run level;
    the *runlevels* field is ignored. |

    | bootwait | Executes the process as the system boots and init waits for the process
    to exit; the *runlevels* field is ignored. |

    | initdefault | Starts the system at this run level after it boots. The *process*
    field is ignored for this action. |

    | sysinit | Executes the process as the system boots, before any entries with
    the *boot* or *bootwait* action; the *runlevels* field is ignored. |

    | ctrlaltdel | Executes the process when init receives the SIGINT signal, which
    occurs when you press Ctrl+Alt+Del. Typically, the *process* field should specify
    the */sbin/shutdown* command with the -r option to reboot the PC. |

    | kbdrestart | Executes the process when init receives a signal from the keyboard
    driver that a special key combination has been pressed. The key combination should
    be mapped to KeyboardSignal in the keymap file. |


    Lines that start with a hash mark (\#) are comments. The first non-comment line
    in the */etc/inittab* is the following:


    ```

    id:5:initdefault:

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Thus, the default run level is 5, which corresponds to the graphical login
    you have used throughout this book. If you want your system to run at level 3
    after startup (for a plain text-mode login screen), all you have to do is change
    5 to 3.


    **Type man inittab to see the detailed syntax of the entries in the inittab file.**


    You can specify a variety of values in the *action* field. Table 22-1 lists the
    valid *actions* and briefly describes what each *action* does.


    The *process* field is typically specified in terms of a shell script, which,
    in turn, can start several processes. For example, the 15 entry is specified as
    follows:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    This entry indicates that *init* should execute the file /etc/rc.d/rc with 5 as
    an argument. If you look at the file /etc/rc.d/rc, you notice that it is a shell
    script file. You can study the file /etc/rc.d/rc to see how it starts various
    processes for run levels 1 through 5.


    Getting back to the subject of the graphical login screen, the last line of the
    /etc/inittab file starts the graphical login process with the following entry:


    ```

    x:5:respawn:/etc/X11/prefdm -nodaeom

    ```


    This command runs /etc/X11/prefdm, which is a symbolic link to a specific display
    manager. For the GNOME graphical desktop (the default in Red Hat Linux), /etc/X11/prefdm
    is a symbolic link to /usr/bin/gdm —the GNOME display manager. If you use the
    KDE desktop as your default, /etc/X11/prefdm is a symbolic link to /usr/bin/kdm—the
    KDE display manager. This means that regardless of your choice of GUI, *init*
    starts a display manager at run level 5. The display manager, in turn, displays
    the graphical login dialog box and enables you to log into the system.


    **If you do not enable the graphical login screen during Red Hat installation
    (covered in Session 1), you can do so now by editing the /etc/inittab file. Locate
    the line containing *in*default and make sure that it reads as follows (the run
    level appearing between two colons should be 5):**


    ```

    id:5:initdefault:

    ```


    Before you edit the /etc/inittab file, you should know that any errors in this
    file may prevent Red Hat Linux from starting up to a point at which you can log
    in. If you cannot log in, you cannot use your system. As explained in the next
    section, you can always try out a specific run level with the *init* command before
    you actually change the default run level in the /etc/inittab file.


    **Never set *in*default to 0 or 6! If you set the *default* runlevel to 0, your
    Red Hat Linux system will boot, then shut down and halt. Similarly, setting *in*default
    to 6 will cause your system to reboot each time it boots.**'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Trying out a new run level with the init command


    To try a new run level, you do not necessarily have to change the default run
    level in the /etc/inittab file. If you log in as root, you can change the run
    level (and, consequently, the set of processes that run in Linux) with the init
    command. It has the following format:


    ```

    init runlevel

    ```


    Here, runlevel must be a single character denoting the run level that you want.
    To put the system in single-user mode, for example, type the following:


    ```

    init 1

    ```


    Assuming that your system is not set up for a graphical login screen yet, if you
    want to try run level 5 without changing the /etc/inittab file, enter the following
    command at the shell prompt:


    ```

    init 5

    ```


    The system should end all current processes and enter run level 5. By default,
    the init command waits 20 seconds before stopping all current processes and starting
    the new processes for run level 5.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_249_0.png)


    To switch to run level 5 immediately, type the command init - to 5. The number
    after the - t option indicates the number of seconds that init waits before changing
    the run level.


    You can also use the telinit command, which is simply a symbolic link to init.
    If you make changes to the /etc/inittab file and want init to reload its configuration
    file, use the command telinit q.


    # Understanding Red Hat Linux Startup Scripts


    The init process runs a number of scripts at system startup. Notice the following
    lines that appear near the beginning of the /etc/inittab file:


    ```

    # System initialization.

    s1:sysinit:/etc/rc.d/rc.sysinit

    ```


    As the comment on the first line indicates, the second line causes init to run
    the /etc/rc.d/rc.sysinit script, which is the first Red Hat Linux startup script
    that init runs. The rc.sysinit script performs many initialization tasks such
    as mounting the file systems, setting the clock, configuring the keyboard layout,
    starting the network, and loading many other driver modules. The rc.sysinit script
    performs these initialization tasks by calling many other scripts and reading
    configuration files located in the /etc/sysconfig directory.


    After executing the /etc/rc.d/rc.sysinit script, the init process runs the /etc/rc.d/rc
    script with the run level as an argument. For example, for run level 5, the following
    line in /etc/inittab specifies what init has to execute:


    ```

    15:5:wait:/etc/rc.d/rc5

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Session 22—Understanding How Red Hat Linux Boots


    This says that init should execute the command `/etc/rc.d/rc` 5 and wait until
    that command completes.


    The /etc/rc.d/rc script is somewhat complicated. Here is how it works:


    +   - It changes to the directory corresponding to the run level. For example,
    to change to run level 5, the script changes to the /etc/rc/rc5.d directory.

    +   - In the directory that corresponds with the run level, it looks for all files
    that begin with a 1 and executes each of them with a stop argument. This kills
    currently running processes. Then it locates all files that begin with an S and
    executes each file with an argument of start. This starts the processes needed
    for the specified run level.


    To see what gets executed at run level 5, type the command `ls -l /etc/rc.d/rc5.d`.
    The output, shown in the following listing, is truncated because it is repetitive:


    ```

    ls -l /etc/rc.d/rc5.d

    total 0

    lrwxwxwxwx    1 root     root    15 Aug 14 16:24 K01pppoe -> ../init.d/pppoe

    lrwxwxwxwx    1 root     root    14 Aug 14 16:08 K051snd -> ../init.d/finnd

    lrwxwxwxwx    1 root     root    13 Aug 19 22:18 K20nfs -> ../init.d/nfs

    lrwxwxwxwx    1 root     root    16 Aug 14 16:24 K20rstatd -> ../init.d/rstatd

    lrwxwxwxwx    1 root     root    17 Aug 14 16:24 K20ruserd -> ../init.d/ruserd

    lrwxwxwxwx    1 root     root    16 Aug 14 16:24 K20rwalld -> ../init.d/rwalld

    lrwxwxwxwx    1 root     root    16 Aug 14 16:24 K20rwhod -> ../init.d/rwhod

    ...part of listing deleted...

    ...

    .

    .

    .

    ....init.d/sendmail

    lrwxwxwxwx    1 root     root    18 Aug 14 16:26 S80sendmail -> ../init.d/sendmail

    lrwxwxwxwx    1 root     root    13 Aug 14 16:07 S85pam -> ../init.d/gpm

    lrwxwxwxwx    1 root     root    15 Aug 14 15:58 S85htpd -> ../init.d/htpd

    lrwxwxwxwx    1 root     root    13 Aug 14 15:58 S90x -> ../init.d/xfs

    lrwxwxwxwx    1 root     root    17 Aug 14 15:55 S95anacron -> ../init.d/anacron

    lrwxwxwxwx    1 root     root    19 Aug 14 16:16 S991inxconif -> ../init.d/linuxconif

    lrwxwxwxwx    1 root     root    11 Aug 14 15:56 S991ocal -> ../rc.local

    ```


    As the output shows, all files with names starting with K and S are symbolic links
    to scripts that reside in the /etc/rc.d and /etc/init.d directories. In fact,
    the /etc/rc.d/rc script executes these files exactly in the order that they appear
    in the directory listing.


    > Note that the last file in the directory listing is a symbolic link to the ../rc.local
    script. This means that /etc/rc.d/rc.local is executed after all other scripts.
    So you can place in that script any command you want executed whenever your Linux
    system boots.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "Most of the startup scripts reside in the `/etc/rc.d/init.d` directory. You\
    \ can manually invoke scripts in this directory to start, stop, or restart specific\
    \ processes—usually servers. For example, to stop the Web server, type the following\
    \ command:\n\n```\n```\n/etc/rc.d/init.d/httpd stop\nShutting down http: [  OK\
    \  ]\n```\n```\n\nYou can enhance your system administration skills by familiarizing\
    \ yourself with the scripts in the `/etc/rc.d/init.d` directory. To see the listing,\
    \ type the following command:\n\n```\n```\nls /etc/rc.d/init.d\n anacron    halt\
    \      keytable    netfs     ppoe      sendmail   ypbind\n apmd       httpd  \
    \   killall     network   random    single\n yppasswdd\n arptwatch  ident    \
    \ kudzu       nfs       rawdevices smb      ypserv\n atd        inss      1inix-conf\
    \ nfslock   restart     snmpd\n crond      ipchains  lpd         poncia    rsyslog\
    \   syslog\n functions   isdn     mars-nwe    portmap   rwalid    xfs\n gpm  \
    \      kdcrotate named       postgresql rhwrod    xinetd\n```\n```\n\nThe script\
    \ names give you some clue about what server the script can start and stop. For\
    \ example, the nfs script starts and stops the processes required for NFS services.\
    \ At your leisure, you may want to study some of these scripts to see what each\
    \ one does. You don’t have to understand all of the shell programming; the comments\
    \ should help you learn the purpose of each script.\n\n# Enabling and Disabling\
    \ Startup Scripts\n\nAs your Linux administration skills develop, you may want\
    \ to modify the default Red Hat Linux startup sequence to change the set of services\
    \ that you run. You can disable startup scripts, preventing them from executing\
    \ at all, or you can exercise finer-grained control, enabling and disabling scripts\
    \ in specific levels.\n\n# Disabling and enabling startup scripts in all run levels\n\
    \nIn the previous section, you saw that the run level-specific directories, such\
    \ as `/etc/rc.d/rc5.d`, contain symbolic links to scripts in `/etc/rc.d/init.d`.\
    \ For example, `/etc/rc.d/rc5.d/S05sendmail` is a link to `/etc/rc.d/init.d/sendmail`.\
    \ To disable a startup script in all run levels, remove its execute permissions\
    \ using the chmod command. So, to disable the sendmail startup scripts, log in\
    \ as the root user and execute the command `chmod a-x /etc/rc.d/init.d/sendmail`.\
    \ Similarly, if you decide later to enable a script, use the chmod command to\
    \ restore the execute permissions. You can use the following command to restore\
    \ the sendmail script’s execute permissions:\n\n```\n```\nchmod a+x /etc/rc.d/init.d/sendmail\n\
    ```\n```\n\nYou can use this approach to disable any of the startup scripts in\
    \ the `/etc/rc.d/init.d` directory."
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Disabling and enabling startup scripts in specific run levels


    If you want a startup script to execute in certain run levels, but not in others,
    use the Red Hat Linux `chkconfig` command. `chkconfig` is an easy-to-use tool
    for maintaining the scripts in the `/etc/rc.d` directory.


    For example, suppose you want to find out the run levels in which the `sendmail`
    startup script executes. You can use the command `chkconfig --list sendmail` to
    obtain this information, as shown in the following example:


    ```

    chkconfig --list sendmail


    sendmail        0:off  1:off  2:on  3:on  4:on  5:on  6:off

    ```


    The output displays the name of the script, `sendmail`, followed by the run level,
    and off or on to indicate whether `sendmail` runs in that run level. As you can
    see, the `sendmail` startup script is executed when the system enters run levels
    2, 3, 4, and 5.


    To change the behavior of a startup script on a given run level, you can use the
    following `chkconfig` command:


    ```

    chkconfig --level runlevels scriptname on|off|reset

    ```


    The *scriptname* entry is the name of the startup script (such as nfs or sendmail)
    that you want to modify. The *runlevels* number indicates the levels you want
    to change. The on and off entries turn the service on or off for the specified
    run levels. The reset entry restores the script''s default configuration. You
    may only use one of the options on, off, or reset. For example, the following
    commands disable the `sendmail` startup script in run level 2; use the `--list`
    option to confirm that the `sendmail` script was disabled as directed; restore
    the original configuration; and then use the `--list` option to confirm the change:


    ```

    chkconfig --level 2 sendmail off


    chkconfig --list sendmail


    sendmail        0:off  1:off  2:off  3:on  4:on  5:on  6:off


    chkconfig sendmail reset


    chkconfig --list sendmail


    sendmail        0:off  1:off  2:on  3:on  4:on  5:on  6:off

    ```


    ![](img/5fe8f856723cde0b366f73584b9e64b8_252_0.png)


    The `chkconfig` utility works by manipulating the symbolic links behind the scenes,
    saving you the tedious, potentially error prone process of updating them yourself.
    To extend your knowledge of the `chkconfig` command, you can read its manual page
    (man chkconfig).


    # Troubleshooting


    Certain startup scripts, especially those that assume a functioning network, may
    appear to hang during boot. (The `/etc/rc.d/init.d/sendmail` script is a common
    example of this.) If this happens to you, use the `chkconfig` utility to disable
    the script that seems to be'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'causing the problem. This will enable you to troubleshoot the problem without
    having to wait for long periods of time. Don’t forget to re-enable the script
    after fixing the problem!


    If your system is set to boot to run level 5 but X Window is having trouble initializing,
    change *initdefault* in `/etc/inittab` to 3 while troubleshooting the problem
    and test your fixes using the *init 5* command. Once you have solved the problem,
    change *initdefault* back to 5 to restore the graphical login when the system
    boots.


    If you forget the syntax of the *chkconfig* command, type *chkconfig* and press
    Enter to see a short usage message.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_253_0.png)


    # REVIEW


    This session provided an overview of how to use the *init* process. You learned
    about the `/etc/inittab` file, which controls *init*. You also learned about the
    Red Hat Linux startup scripts in the `/etc/rc.d` directory and its subdirectories.
    Finally, you learned how to use the *chkconfig* utility to control the startup
    sequence.


    # QUIZ YOURSELF


    +   1. Why is *init* referred to as the “mother of all processes?” (See “Understanding
    the *init* Process.”)


    +   2. How can you determine the current run level of your Linux system? (See
    “Understanding the *init* Process.”)


    +   3. What can you do to make your Linux system start at run level 3 when you
    reboot the system? (See “Examining the `/etc/inittab` file.”)


    +   4. How do you figure out which scripts *init* executes for run level 5? (See
    “Understanding Red Hat Linux Startup Scripts.”)


    +   5. In what script do you place commands that you want executed every time
    your Linux system boots? (See “Understanding Red Hat Linux Startup Scripts.”)'
  merge: -1
  img_proc: true
