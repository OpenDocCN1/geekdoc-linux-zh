- pgno: 146
  md: 'This routing table shows that the local network uses the eth0 Ethernet interface
    and the default gateway is also that Ethernet interface. The default gateway handles
    packets addressed to any network other than the one in which the Linux system
    resides. In this example, packets addressed to any network address other than
    ones that begin with 192.168.1 are sent to the gateway, which has IP address 192.168.1.1.
    The gateway forwards those packets to other networks, assuming, of course, the
    gateway is connected to another network.


    # Checking connectivity to a host


    To see if you can connect to a specific host, use the ping command. The ping command
    is a widely used TCP/IP tool that employs a series of Internet Control Message
    Protocol (ICMP, often pronounced as eye-com-p) messages. ICMP provides an Echo
    message to which every host responds. Using the ICMP messages and replies, ping
    can determine whether the other system is alive and then compute the round-trip
    delay—how long it takes a packet to travel from the source system to the destination
    system, and back to that system.


    The following example shows how one user runs ping to see whether one of the systems
    on his network is alive:


    ```

    ping -c 4 192.168.1.50

    PING 192.168.1.50 (192.168.1.50): 56 data bytes

    64 bytes from 192.168.1.50: icmp_seq=0 ttl=32 time=2.2 ms

    64 bytes from 192.168.1.50: icmp_seq=1 ttl=32 time=1.8 ms

    64 bytes from 192.168.1.50: icmp_seq=2 ttl=32 time=1.2 ms

    64 bytes from 192.168.1.50: icmp_seq=3 ttl=32 time=0.8 ms

    --- 192.168.1.50 ping statistics ---

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 0.8/1.3/2.2 ms

    ```


    The ping command displays statistics showing the time it takes to send a packet
    between the two systems followed by a short summary report. By default, Red Hat
    Linux''s ping runs continually until you press Ctrl+C to stop it, so the example
    used the -c 4 option to limit the number (count) of packets it sent to 4. On some
    systems, ping simply reports that a remote host is alive. However, you can still
    get the timing information with appropriate command-line arguments.


    # Examining TCP/IP Configuration Files


    Configuring the network during installation or running the Red Hat network configuration
    tool may be enough to get TCP/IP configured on your system. However, you should
    also be familiar with the configuration files so that you can edit them if necessary.
    For example, you can specify the name servers through the network configuration
    tool, but suppose you want to add an alternative name server. To do so, you can
    simply add those names directly to the /etc/resolv.conf file—the configuration
    file that stores the IP addresses of name servers.


    In the remainder of this session, you''ll familiarize yourself with the basic
    TCP/IP configuration files. Each of these configuration files is a text file that
    you can examine with the cat or more command and edit using any text editor.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_146_0.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# /etc/hosts


    The /etc/hosts configuration file contains a list of the IP addresses and host
    names of all the systems on your local network. In the absence of a name server,
    programs on your system that need to access another system consult this file to
    determine its IP address. Type the cat /etc/hosts command to view the contents
    of this file.


    Following is the /etc/hosts file from a sample system, showing the IP addresses
    and names of other hosts on the user’s LAN:


    ```

    127.0.0.1       localhost       localhost.localdomain

    # Other hosts on the LAN

    192.168.1.100   .Inb486

    192.168.1.50    Inbp133

    192.168.1.200   Inbp200

    192.168.1.233   Inbp233

    192.168.1.40    Inbp400

    192.168.1.60    Inbp600

    192.168.1.25    mac   Inbmac

    192.168.1.1     Inbp75

    ```


    Each line in the file starts with an IP address, followed by the host name for
    that IP address. You can have more than one host name for a given IP address.


    # /etc/host.conf


    The /etc/host.conf configuration text file specifies how Linux obtains the IP
    addresses corresponding to host names. Type cat /etc/host.conf to view the contents
    of this file. Typically, this file contains the following lines:


    ```

    order hosts, bind

    multi on

    ```


    The entries in the /etc/host.conf file tell the resolver library what services
    to use, and in which order, to convert host names to IP addresses. The order option
    indicates the order of services. The sample entry specifies that the resolver
    library should first consult the /etc/hosts file and then check the name servers
    to resolve a name. The name servers are listed in the /etc/resolv.conf file, which
    you’ll examine next.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_147_0.png)


    > The multi on option specifies that hosts listed in the /etc/hosts file can have
    multiple IP addresses. Hosts that have more than one IP address are called multihomed
    because the presence of multiple IP addresses implies that the host has several
    network interfaces. In other words, the host “lives” in several networks simultaneously.


    # /etc/resolv.conf


    The /etc/resolv.conf configuration file is another text file that the resolver
    uses. This file is a library that determines the IP address corresponding to a
    host name. Type cat /etc/resolv.conf to view the contents of this file.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Following is a sample /etc/resolv.conf file:


    ```

    search xyz.com

    nameserver 164.109.1.3

    nameserver 164.109.10.23

    ```


    The search line specifies the names of systems the resolver uses to search for
    host names. The nameserver line provides the IP addresses of name servers for
    your domain. If you have multiple name servers, you should list these on separate
    lines. They are queried in the order in which they appear in the file. Typically,
    you list in the /etc/resolv.conf file the name servers provided by your Internet
    Service Provider (ISP).


    # /etc/hosts.allow


    The /etc/hosts.allow configuration file identifies the systems allowed to use
    the Internet services (such as Telnet and FTP) that may be running on your system.
    The program that starts some, but not all, Internet services consults the /etc/hosts.allow
    file before starting, and begins a service only if the entries in the hosts.allow
    file permit the requesting host to use that specific service.


    The entries in /etc/hosts.allow are in the format of server:IP address in which
    server refers to the name of the program providing a specific Internet service.
    IP address identifies the host allowed to use that service. For example, if you
    want all hosts in your local network (which has the address 192.168.1.0) to access
    the FTP service (which is provided by the in.ftpd program), add the following
    line in the /etc/hosts.allow file:


    ```

    in.ftpd:192.168.1.

    ```


    If you want to let all local hosts have access to all Internet services, use the
    ALL keyword and rewrite the line as follows:


    ```

    ALL:192.168.1.

    ```


    Finally, to open up all Internet services to all hosts, you can replace the IP
    address with ALL as follows:


    ```

    ALL:ALL

    ```


    You can also use host names in place of IP addresses.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_148_0.png)


    Security experts vigorously and emphatically discourage allowing all hosts access
    to all services on your system. For a more secure system, you should deny all
    hosts access and then allow selected hosts access to your system. This means that
    you should first deny all hosts access to your system using the ALL:ALL directive
    in /etc/hosts.deny (covered in the next section). You should then list each system
    or group of systems permitted to access your system in /etc/hosts.allow.


    # /etc/hosts.deny


    The /etc/hosts.deny configuration file is just the opposite of /etc/hosts.allow.
    Whereas hosts.allow specifies which hosts may access Internet services (such as
    Telnet and FTP) on'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'your system, the `hosts.deny` file identifies the hosts that must be denied
    services. The program that starts Internet services consults the `/etc/hosts.deny`
    file if it does not find any rules in the `/etc/hosts.allow` file to apply to
    the requesting host. The program denies service if it finds a rule in the `hosts.deny`
    file that applies to the host.


    The entries in the `/etc/hosts.allow` file follow the same format as those in
    the `/etc/hosts.allow` file. They are in the form of a `server: IP address` format
    in which `server` refers to the name of the program providing a specific Internet
    service and `IP address` identifies the host allowed to use that service.


    Assuming that you already set up entries in the `/etc/hosts.allow` file to allow
    access to specific hosts, you can place the following line in `/etc/hosts.deny`
    to deny all other hosts access to any service on your system:


    ```

    ALL:ALL

    ```


    # ### Troubleshooting


    If you are unable to access hosts on a network, make sure you have at least one
    name server listed in `/etc/resolv.conf`.


    If an external system cannot connect to your system, remember the order in which
    the `hosts.allow` and `hosts.deny` files are read and applied. The program that
    starts Internet services consults `/etc/hosts.allow` first. If TCP Wrappers does
    not find a matching rule, it applies the first matching rule, if any, in `/etc/hosts.deny`.
    If neither file contains a match, access will be granted.


    # ## REVIEW


    This session showed you how to set up an Ethernet LAN using 10Base2 or 10BaseT
    cables. You explored Red Hat''s network configuration tool that you can use to
    configure the network interfaces. You used a number of utility programs such as
    `ping` and `route`, to monitor the status of your TCP/IP network. Finally, you
    examined several TCP/IP configuration files that specify items such as host name,
    name servers, as well as which hosts can access services running on your system.


    # ## QUIZ YOURSELF


    +   1.  What is "ThinNet"? (See "Setting Up an Ethernet LAN.")

    +   2.  What is the name of the first Ethernet device in a Linux system? (See
    "Learning network device names.")

    +   3.  How do you start the Red Hat network configuration tool? (See "Running
    Red Hat''s network configuration tool.")

    +   4.  What network utility do you use to check the connectivity to another system
    in the network? (See "Checking connectivity to a host.")

    +   5.  Which configuration file enables you to deny access to local Internet
    services? (See "/etc/hosts.deny.")'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Connecting Your Red Hat Linux PC to the Internet


    +   Session Checklist

    +   ✓ Learning the basics of dial-up networking

    +   ✓ Connecting to the Internet using PPP

    +   ✓ Using IP masquerading to share an Internet connection


    After installing Red Hat Linux, you will probably want to connect your Red Hat
    Linux PC (and perhaps your LAN) to the Internet. You have the following popular
    options for connecting a small office or home office to the Internet: Digital
    Subscriber Line (DSL), cable modem, and dial-up networking. The DSL and cable
    modem options essentially involve connecting a special modem to an Ethernet card
    on your Linux system. In these cases, the setup procedures are the same as the
    ones discussed in Session 12. This session focuses on the third option, dial-up
    access, which involves setting up a PPP connection from your Red Hat Linux PC
    to your ISP''s system. You also learn how to use IP masquerading to share a Red
    Hat Linux system''s Internet connection with other systems on a LAN.


    # Learning the Basics of Dial-up Networking


    Dial-up networking refers to connecting a PC to a remote network (such as the
    Internet) by using a modem and a communication protocol such as PPP (Point to
    Point Protocol). A significant difference exists between dial-up networking and
    standard serial connections. Although both methods use a modem to connect two
    computers and establish a communication path, a serial connection makes your computer
    act like a terminal connected to the remote computer. A PPP connection makes your
    computer appear to be an independent, stand-alone system on the Internet. Together,
    PPP and the dial-up connection allow your Red Hat Linux system to become part
    of the network to which the remote computer belongs. You can have any number of
    network applications, such as Web browsers, Usenet'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'news clients, e-mail clients, Telnet or FTP clients, and so forth, running
    at the same time. All of these applications can share the physical data transport
    capabilities of the dial-up PPP connection.


    Dial-up networking involves TCP/IP data transfers over a dial-up connection. Like
    TCP/IP networking on a standard network connection, TCP/IP networking over a dial-up
    link is a matter of specifying the protocol and the convention—for packaging and
    sending a unit of data, known as a packet, over the communication link. PPP and
    SLIP are the two most popular protocols for TCP/IP networking over dial-up connections.


    +   *   *SLIP* is the Serial Line Internet Protocol, a simple protocol that specifies
    how to frame an IP packet on a serial line.

    +   *   *PPP* is the Point-to-Point Protocol, a more advanced protocol for establishing
    a TCP/IP connection over any point-to-point link, including dial-up serial links.


    PPP is the most popular method of TCP/IP networking over a dial-up connection.
    The next section shows you how to use PPP to set up a network connection to a
    remote system.


    # Connecting to the Internet Using PPP


    Most Internet Service Providers (ISPs) provide PPP access to the Internet. When
    you sign up for such a service, the ISP should provide you with the information
    that you need to make a PPP connection to the remote system. Typically, this information
    includes the following:


    +   *   The phone number to connect to the remote system.

    +   *   The user name and password that you must use to log into the remote system.

    +   *   The names, and perhaps the IP addresses, of the ISP’s mail and news servers.

    +   *   The IP addresses of the ISP’s Domain Name Servers (DNS). Typically, the
    ISP gives you two IP addresses, one for the primary DNS server and one for the
    *secondary* DNS server.


    Some ISPs may also give you an IP address for your side of the connection. Usually,
    though, your IP address is assigned dynamically and changes each time you connect
    to the ISP. Most ISPs also provide the IP addresses of the mail and news servers.
    However, these addresses are not important for the mechanics of setting up a PPP
    connection.


    Before you set up a PPP connection, you must have an internal or external modem
    installed on your system. The modem should be connected to a phone line. You can
    use Minicom, as described in Session 11, to dial your ISP’s phone number and make
    sure that the modem successfully establishes a connection. After you see a login
    prompt, you can hang up the modem and proceed to set up PPP.


    Follow these steps to set up a PPP connection using Red Hat’s graphical Dialup
    Configuration tool:


    +   1. Log in as root and select *Main Menu* `->` *Programs* `->` *Settings* `->`
    *Internet Configuration Wizard* from the GNOME desktop. The Dialup Configuration
    tool displays the *Select Device* Type dialog box, shown in Figure 13-1. Click
    the device you are configuring (a modem) and then click the *Next* button to continue.'
  merge: -1
  img_proc: true
