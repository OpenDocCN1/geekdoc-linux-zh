  md: "# SESSION 17\nWorking with Screen Savers and Playing Games\n\n+   **Session\
    \ Checklist**\n+   \n+   * \\*\\*\\* Activating screen savers\n+   \n+   * \\\
    *\\*\\* Playing games in GNOME\n+   \n+   * \\*\\*\\* Playing games in KDE\n\n\
    Now that you know how to customize the GNOME and KDE graphical desktops and switch\
    \ from one to the other, you can have some fun. You should have the games installed\
    \ on your system, assuming that you selected the Games package group when you\
    \ installed Red Hat Linux from this book’s companion CD-ROMs in Session 1.\n\n\
    Both GNOME and KDE desktops in Red Hat Linux come with quite a few games and screen\
    \ savers. In this session, you’ll learn how to set up and activate the screen\
    \ savers and explore some games.\n\n# Activating Screen Savers\n\nBy default,\
    \ your Red Hat Linux system uses a randomly selected screen saver. Whenever you\
    \ do nothing for some time (usually 20 minutes), the screen saver comes on. The\
    \ screen saver can also act as a *screen-locking program*, which means that you\
    \ must type your password to get back to the graphical desktop.\n\n# Setting up\
    \ a screen saver in GNOME\n\nTo select and try out a screen saver from the GNOME\
    \ desktop, start the GNOME Control Center by clicking the toolbox icon on the\
    \ GNOME Panel. Then select *Desktop\\*\\*\\* Screen Saver* from the tree menu\
    \ in the Control Center. A dialog box appears in the Control Center’s workspace\
    \ from which you can select a screen saver. The small screen in the upper-right\
    \ corner of the dialog box shows how the selected screen saver looks, as you can\
    \ see in Figure 17-1."
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_195_0.png)


    # Figure 17-1 Selecting and previewing a screen saver in the GNOME Control Center


    From the dialog box in Figure 17-1, you can also select several other screen saver
    settings. For example, you can set the number of minutes of inactivity after which
    the screen saver comes on. If you click the Require Password button, then the
    screen saver locks the screen and forces you to enter your password before you
    can return to the desktop.


    The scrollbar labeled Priority enables you to specify the priority of the screen
    saver program. You should leave it at the default setting (which is midway between
    Low and Normal) or make it low; this ensures that other processes have higher
    priority. After all, just because there is no mouse or keyboard activity it does
    not mean that your Linux system is idle. You may be compiling a huge program when
    the screen saver activates. In that case, you don''t want the screen saver to
    use up too much of the processor''s time.


    The button labeled Use Power Management applies if your PC supports power management
    features. If you click this button, the screen saver puts the system and monitor
    in a “sleep” mode that draws less power than normal operation.


    # Setting up a screen saver in KDE


    If you use the KDE desktop, you can select and test screen savers from the KDE
    Control Center. Start it by clicking the Monitor and circuit board icon on the
    KDE panel or select K Control Center. Then select Look & Feel Screen saver from
    the tree menu in the KDE Control Center. The Screen saver tab appears in the Control
    Center''s workspace from which you can select and preview screen savers (see Figure
    17-2).


    Many screen savers have their own setups. To set up the selected screen saver,
    click the Setup button in the KDE Control Center''s Screen saver tab. (If the
    Setup button is not enabled, the screen saver is not configurable.) This brings
    up the screen saver''s Setup dialog box, from which you can set up that screen
    saver''s configurable parameters.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_196_0.png)


    Figure 17-2 Selecting and previewing a screen saver in the KDE Control Center


    You can also easily test a screen saver from the KDE Control Panel''s Screensaver
    tab. Simply click the Test button that appears under the list of screen savers.
    This causes the screen saver to activate as a full screen. You can return to the
    desktop by pressing a key or moving (or clicking) the mouse. The Test button makes
    it very easy to test the KDE screen savers.


    The KDE Control Center''s Screensaver tab also enables you to set other parameters
    that control the screen saver. Specifically, you can set the number of minutes
    of inactivity after which the screen saver should start in the Wait For box. You
    can also click the checkbox labeled Require Password to make the screen saver
    require a password before returning to the desktop. Additionally, you can set
    the priority of the screen saver process.


    # Playing Games in GNOME


    Now, try some games that come with Red Hat Linux. You can access them from the
    GNOME or KDE desktops. Look at some of the GNOME games first. To do so, select
    Main Menu\(Foot\)(+ Programs)(+ Games to view the menu of available games. Figure
    17-3 shows a typical Games menu in GNOME. As you can see, the GNOME desktop''s
    Games menu offers almost 30 games on the Main menu, plus many more under the x-puzzles
    selection near the bottom of the Games menu. Select Main Menu\(Foot\)(+ Games)(+
    x-puzzles to view the available puzzles.


    In addition to these games, you can also play all the KDE games from the GNOME
    desktop. Simply select Main Menu\(Foot\)(+ KDE Menu)(+ Games to view the KDE Games
    menu. The rest of this section describes some of the popular GNOME games.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_197_0.png)


    Figure 17-3 The Games menu in GNOME


    # Card games


    If you like card games such as Solitaire, you''ll like the AisleRiot game. AisleRiot
    is a card program that can play 30 different card games including such well-known
    ones as FreeCell and Klondike.


    To start AisleRiot, select Main Menu  Foot  Programs  Games  AisleRiot. AisleRiot''s
    default game is Klondike.


    If you want to play a different card game in AisleRiot, select Game New Game from
    the menu. This causes AisleRiot to display a long list of card games.


    Now you can choose another card game from this list. If you need help, select
    Help AisleRiot. This brings up the AisleRiot help in the GNOME Help browser.


    GNOME also comes with a stand-alone FreeCell card game. You can play that game
    by selecting Main Menu Programs Games FreeCell. After the main window appears,
    click the New button on the toolbar to start a new game. Now you can play the
    game.


    # Gnome-Stones


    Gnome-Stones is a game in which you run around a cave collecting diamonds and
    avoid being crushed by rocks. Select Main Menu Programs Games Gnome-Stones to
    start the game. You can select Settings Preferences to choose the type of cave
    you want to explore. Then select Game New game to start a game. Use the arrow
    keys to move the little person around and collect the diamonds.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# GNOME Mahjongg


    Select Main Menu\* Programs\* Games\* Mahjongg to start the GNOME Mahjongg game.
    In this version of Mahjongg, your goal is to find and click matching pairs of
    tiles, which are then removed from the game board.


    If you have trouble locating matching tiles, click the Hint button on the toolbar.
    The game program then flashes two matching tiles for a short time. You can then
    click those tiles one after another. Of course, the point of the game is for you
    to figure out which tiles to remove, so you should use the Hint button sparingly.


    # Chess game


    Select Main Menu\* Programs\* Games\* Chess to start a game of chess. By default,
    the computer plays black and you play white. You get the first move. To make your
    move, click and drag a white piece to its new position. The chess program checks
    and stops you from making any illegal moves.


    Once you move, the computer responds with its move. Initially, the computer responds
    promptly, but the moves take longer as the game progresses. A timer counts down
    the time for whoever has the current turn.


    # Playing Games in KDE


    To try out the games available on the KDE desktop, log in after selecting KDE
    as the current desktop. (Remember to select Session\* KDE from the login window.)
    From the KDE desktop, select K\* Games to view the menus of available games. Figure
    1-4 shows a typical menu of games in KDE.


    As the menu shows, KDE includes over 30 games on the Games menu. You can try many
    of these games by selecting one from this menu.


    KDE includes its own version of Mahjongg, which is similar to the GNOME version
    of Mahjongg introduced earlier in this session.


    Now that you know where to find and how to start the games, you can try them out
    at your leisure. In the remainder of this session, you can play a few KDE games.


    # Minesweeper


    Minesweeper is a popular game that you may have played on your PC (because it
    comes with Microsoft Windows). In Minesweeper, your goal is to locate all the
    mines in a minefield represented by squares arranged in a grid. You are supposed
    to uncover all the squares that do not contain mines and mark the squares that
    contain mines.


    To run the KDE version of Minesweeper, select K\* Games\* Minesweeper. To play,
    click squares to clear them. When you uncover a square that does not have any
    adjacent mines, Minesweeper clears out all other neighboring squares that also
    do not touch any squares with mines. The number on an uncovered square tells you
    how many mines are located in the adjacent squares. To mark a square that you
    suspect has a mine, click the right mouse button on that square. When you mark
    a square by right-clicking, a red flag appears on that square.'
  merge: -1
  img_proc: true
