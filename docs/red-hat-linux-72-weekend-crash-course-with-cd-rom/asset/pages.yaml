    # ## Using Modems in Red Hat Linux


    # ### Session Checklist


    +   - Connecting a modem to your PC

    +   - Dialing out with Minicom


    This afternoon’s sessions focus on data communications using a modem or an Ethernet
    local area network (LAN). This first session covers the fundamentals: using a
    modem and a serial port to make a dial-up connection to another system. If you
    are using Red Hat Linux at home or in your office, you probably want to use a
    modem for one or more of the following reasons: to use dial-up networking with
    Point-to-Point Protocol (PPP) to connect to the Internet through an Internet Service
    Provider (ISP); to dial out to another computer (such as a bulletin-board system)
    or another UNIX system; or to enable other people to dial in and use your Linux
    system.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_132_1.png)


    Session 13 covers dial-up networking with PPP.


    # ## Connecting a Modem to Your PC


    When you install Red Hat Linux from this book’s companion CD-ROMs, you automatically
    install some tools that you can use to dial out from your Linux system with a
    modem. Before you can dial out, however, you have to make sure that you have a
    modem properly connected to one of the serial ports of your PC and that the Linux
    devices for the serial ports are set up correctly. Make sure that your modem is
    properly connected to the power supply and that the modem is also connected to
    the telephone line.


    If you have an external modem, buy the right type of cable to connect the modem
    to the PC. You need a straight-through serial cable to connect the modem to the
    PC. The connectors at the ends of the cable depend on the type of serial connector
    on your PC. The modem'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'end of the cable needs a male 25-pin connector. The PC end of the cable often
    is a female 9-pin connector. You can buy modem cables at most computer stores.
    The 9-pin female and 25-pin male modem cables are often sold under the label “AT
    Modem Cable.”


    > If your PC has an internal modem, all you have to do is connect the phone line
    to a phone jack at the back of the internal modem card.


    # Learning the serial port device names


    The PC typically has two serial ports, called COM1 and COM2 in MS-DOS parlance.
    Many new PCs with a Universal Serial Bus (USB) have only one serial port. The
    PC also can support two more serial ports: COM3 and COM4. Because of these port
    names, the serial ports are often referred to as COM ports.


    Like other devices, the serial ports need interrupt request (IRQ) numbers and
    I/O port addresses. Two IRQs—3 and 4—are shared among the four COM ports. Table
    11-1 lists the IRQs and I/O port addresses assigned to the four serial port. Like
    other devices in Linux, device files in the /dev directory represent the serial
    port devices. Table 11-1 shows the serial device names corresponding to the PC’s
    COM ports.


    | COM Port | Device Name | IRQ | I/O Address |

    | COM1 | /dev/ttyS0 | 4 | 0x3f8 |

    | COM2 | /dev/ttyS1 | 3 | 0x2f8 |

    | COM3 | /dev/ttyS2 | 4 | 0x3e8 |

    | COM4* | /dev/ttyS3 | 3 | 0x2e8 |


    If you install Red Hat Linux from this book’s companion CD-ROMs, all these devices
    should already be in your system. If you check the /dev directory, you should
    find the /dev/ttyS* devices in which * is 0, 1, 2, and 3. From a terminal window,
    type ls -1 /dev/ttyS* to see a listing of these device files.


    # Checking if Red Hat Linux detects the serial devices


    When you install Red Hat Linux from this book’s CD-ROMs, following the directions
    in Sessions 1 through 3, the necessary Linux serial devices are automatically
    created for you. You should have the /dev/ttyS* devices for dialing in and out
    through the modem.


    To verify that Linux detects your system’s serial port(s) correctly, check the
    boot messages with the dmesg command:


    ```

    dmesg | grep ttyS*

    ```


    If you see a message such as the following, Linux detects a serial port in your
    PC:


    ```

    ttyS00 at 0x03f8 (irq = 4) is a 16550A

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'In this case, the message indicates that Linux detects the first serial port
    (COM1). It shows the serial port''s I/O address (in hexadecimal), 0x3f8, and IRQ,
    4. The last part of the message -- 16550A -- refers to the identifying number
    of the universal asynchronous receiver/transmitter (UART) chip, which is at the
    heart of all serial communications hardware. A UART converts each byte to a stream
    of 1''s and 0''s and then back to bytes when needed.


    The boot messages are also stored in the /var/log/messages file. Therefore, you
    can search for the serial port''s name in the /var/log/messages file with the
    grep command, as follows:


    ```

    grep ttys /var/log/messages

    ```


    You can also check for the serial ports with the setserial command. Type the following
    command to see detailed information about the serial ports:


    ```

    setserial -g /dev/ttyS*

    ```


    # ## Dialing Out with Minicom


    After you complete the physical installation of the modem and verify that the
    necessary Linux device files exist, you can try to dial out through the modem.
    The best approach is to use the Minicom serial communications program included
    in the Red Hat Linux distribution on this book''s CD-ROMs and installed in the
    /usr/bin directory. The Minicom program is a serial communications program with
    a text-based interface that emulates a VT102 terminal. Minicom is similar to other
    communications software, such as Procomm or Crossstalk, which you may have used
    under MS-DOS or Windows.


