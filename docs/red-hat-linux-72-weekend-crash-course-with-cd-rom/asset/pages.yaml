    # ## Network administration tasks


    Typical network-administration tasks that you can perform with Linuxconf include
    the following:


    +   • *Editing the network configuration files.* In Linux (as well as in other
    UNIX systems), the TCP/IP network is configured through several text files that
    you may have to edit in order to make networking work. Linuxconf enables you to
    configure the network.


    You learn about the TCP/IP configuration files in Sessions 12 and 13.


    +   • *Setting up PPP and SLIP.* You can use Linuxconf to set up Point-to-Point
    Protocol (PPP) and Serial Line Internet Protocol (SLIP) connections.


    You learn about using a modem to connect to the Internet in Session 13.


    +   • *Monitoring network status.* You have to use tools such as netstat (to view
    information about active network connections), /sbin/ifconfig (to check the status
    of various network interfaces), and ping (to make sure that a connection is working).


    # ## Adding User Accounts with Linuxconf


    When you installed Red Hat Linux on Friday night, one of the steps gave you the
    opportunity to set up other user accounts besides root. If you did not add other
    user accounts during installation, you can do so now. You also must perform this
    step if you want to enable other users to access and use the system.


    It is a good idea to create other user accounts besides root. Even if you are
    the only user of the system, logging in as a less-privileged user is good practice;
    that way, you cannot damage any important system files inadvertently. When necessary,
    you can log in as root and perform any system-administration tasks.


    To start Linuxconf from the GNOME Main Menu in Red Hat Linux, select Main Menu
    (Foot) Program System LinuxConf.


    The initial Linuxconf window shows three tabs -- Config, Control, and Status (see
    Figure 10-1). Each tab includes tree lists that you can expand to perform various
    system and network administration tasks with Linuxconf. When you select a particular
    list item, it expands to show additional options. You can continue selecting list
    items this way until you reach the item corresponding to the configuration task
    you wish to perform.'
  merge: -1
  img_proc: true
