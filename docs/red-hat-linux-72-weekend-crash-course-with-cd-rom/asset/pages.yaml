- pgno: 210
  md: 'Session 18—Working with Multimedia Applications


    # Troubleshooting


    If you have trouble persuading xplayercd to play CDs for you, you may need to
    give yourself permission to use the CD-ROM device. To do so, log in as root and
    execute the following command:


    ```

    chmod 666 /dev/cdrom

    ```


    This command gives all users read and write permission to the CD-ROM drive.


    If the previous tip brings you no aural joy, try using the actual CD-ROM device,
    rather than /dev/cdrom, which is only a symbolic link. For example, on a sample
    system /dev/cdrom is a symbolic link to /dev/hdc, so it would be necessary to
    execute the following command:


    ```

    chmod 666 /dev/hdc

    ```


    If your system has less than 64MB of RAM and you want to use GIMP, setting its
    tile cache - the amount of RAM it uses for image storage - to a low value, such
    as 16MB, will improve your system''s speed. However, this gain comes at the expense
    of GIMP''s performance, especially if you intend to work with large images. To
    change the tile cache size, following these steps:


    +   Select File \ Preferences from the GIMP toolbar.

    +   Click the Environment item on the Categories tree menu.

    +   Enter a new value for Tile Cache Size.

    +   Enable the Conservative Memory Usage checkbox.

    +   Click OK to save your changes and close the dialog box.


    # Review


    This session showed you how to configure the sound card and use a few CD-player
    applications to hear CDs on your Red Hat Linux system. You also familiarized yourself
    with the GIMP, Xpaint, Ghostscript, and Ghostview applications for working with
    image files of various formats.


    # Quiz Yourself


    +   How do you employ the /usr/sbin/sndconfig utility to configure the sound card
    for use in Red Hat Linux? (See \"Configuring the Sound Card.\")

    +   What steps do you have to perform so that any user can play audio CDs on the
    CD-ROM drive? (See \"Playing Audio CDs.\")

    +   What is \"The GIMP\" and what can you do with it? (See \"The GIMP.\")

    +   How do you view PostScript files with Ghostscript? (See \"Ghostscript.\")

    +   How is Ghostview related to Ghostscript? (See \"Ghostview.\")'
  merge: -1
  img_proc: true
