- pgno: 238
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_238_0.png)


    Figure 21-4 The configuration dialog box for xf86cfg monitors


    +   12. If you wish, you can type a new name in the Identifier text box at the
    top of the dialog box, but this step is optional. The text AT! Mach64 that appears
    in Figure 21-3 is the default text that xf86cfg inserts when you select a card
