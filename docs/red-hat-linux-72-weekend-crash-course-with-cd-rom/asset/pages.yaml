  md: 'As you configure the kernel, you have to select how to include support for
    specific devices. For most configuration options, you must type one of the following
    choices:


    +   - y to build support into the kernel

    +   - m to use a module

    +   - n to skip the support for that specific device

    +   - ? to get help on that kernel configuration option


    If a device does not have a modular device driver, you do not see the m option.
    For some configuration options, you may have to type a specific answer. For example,
    when responding to the processor type, you type Pentium to indicate that you have
    a Pentium PC.


    The make menuconfig, make xconfig, and make config commands achieve the same end
    result—each stores your choices in a text file named .config located in the /usr/src/linux
    directory. Because the filename starts with a period (.), you don''t see it when
    you use the ls command alone to list the directory. Instead, type ls -a to see
    the .config file in the directory listing.


