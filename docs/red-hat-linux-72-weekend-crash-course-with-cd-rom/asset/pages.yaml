  md: 'Finally, Xconfigurator writes the XF86Config-4 file in the /etc/X11 directory
    and exits. This completes the X configuration. The next time you reboot the PC,
    X should start and you should get a graphical login screen.


    # Configuring Printers


    The Red Hat installation program does not include a printer configuration step.
    However, as long as the Linux kernel can detect your PC''s parallel port, you
    can configure a printer from an X utility program. To see if Red Hat Linux detects
    the parallel port, type `dmesg | grep par` in a terminal window. Here is a typical
    output from that command:


    ```

    ```

    dmesg | grep par

    parport0: PC-style at 0x378 [SPP,PS2]

    parport0: no IEEE-1284 device present.

    lpd: using parport0 (polling)

    ```

    ```


    The first line starts with `parport0`, indicating that Linux detected the parallel
    port. The text `parport0` is “Linuxspeak” for parallel port zero, the first parallel
    port (LPT1 under DOS and Windows).


    To set up printers, you must be running X. From the graphical login screen, log
    in as root and select Programs->System->Printer Configuration from the GNOME desktop.
    The printer configuration tool is named `printconf-gui`. Figure 2-3 illustrates
    its main window.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_41_0.png)


    **Figure 2-3** *printconf-gui enables you to manage printers.*


    Click the New button to configure a new printer, which starts Red Hat''s new printer
    configuration wizard. Click the Next button to start configuring the printer,
    which begins by selecting the type of printer and giving it a name, as shown in
    Figure 2-4. If the printer is attached to your PC, click Local Printer, and then
    click Next to continue.


    10 Min. To Go'
