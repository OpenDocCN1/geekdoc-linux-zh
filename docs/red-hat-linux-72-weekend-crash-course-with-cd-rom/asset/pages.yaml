    # Setting Up the FTP Server


    Besides e-mail and Web services, anonymous FTP is a common service on an Internet
    host. You may be familiar with FTP, which you can use to transfer files from one
    system to another on the Internet. When you use FTP to transfer files to or from
    a remote system, you have to log into the remote system before you can use FTP.

    If you install Red Hat Linux from this book''s companion CD-ROMs, you should have
    anonymous FTP set up on your system and the FTP server configured to run when
    needed. The default setup also employs the necessary security precautions.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_165_0.png)'
