- pgno: 274
  md: 'If you used make bzImage and encounter this error, redo the configuration process
    and con-

    figure the kernel to use modules, build as many device drivers as possible as
    modules, elimi-

    nate unnecessary features by answering No to those configuration questions, or
    use a

    combination of these three options.


    The problem you have encountered is that the kernel file, which is initially compressed,

    is too big to fit into 640KB of memory after it is uncompressed during init PC''s
    boot

    process. This 640KB limit exists because the Intel x86 processors start in what
    is known as

    *real mode* and can only access 1MB of memory; 640KB of this is available for
    programs. This

    limit is left over from the old MS-DOS days and applies only as the Linux kernel
    is initially

    loaded when the PC starts.


    If the system appears to *hang*, meaning that there is no screen output and little
    or no

    disk activity, you may have skipped a step during the kernel rebuild. Cycle the
    power to

    reboot again, and this time, enter `1inux` (the old working kernel''s name) at
    the LILO boot:

    prompt.


    If you cannot boot the older version of Red Hat Linux either, use the emergency
    boot

    disk (containing an earlier, but working, version of *Linux*) to start the system.
    Then you can

    repeat the kernel rebuild and installation process making sure that you follow
    all the steps

    correctly.


    If LILO fails to load completely and you do not get to the boot: prompt, reboot
    using the

    emergency boot disk, add the word `1inear` to `/etc/lilo.conf` immediately below
    the

    prompt line, execute `lilo`, and then reboot.


    If LILO only partially loads, the point at which it stops indicates a specific
    type of prob-

    lem. Use the following list in Table 24-1 to select the solution.


    Table 24-1 LILO Boot Diagnostic Messages


    | Message | Description |

    | :--- | :--- |

    | LIL: | Reboot using the emergency boot disk and rerun /sbin/lilo. |

    | LIL? | Reboot using the emergency boot disk and rerun /sbin/lilo. |

    | LIL | Make sure that your hard disk is properly configured in the system BIOS.
    |

    | LI: | Confirm that the hard disk is properly configured in the system BIOS,
    and then reboot using the emergency boot disk and rerun /sbin/lilo. |

    | L: | Make sure that your hard disk is properly configured in the system BIOS.
    |

    | (nothing): | Make sure that your hard disk is properly configured in the system
    BIOS and that the partition on which LILO is installed is set as the active partition.
    |


