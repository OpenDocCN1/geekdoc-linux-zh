    +   13. Click the Ok button to return to the main screen of xf86cfg.


    +   14. Right-click the monitor icon and select Configure. The resulting dialog
    box should resemble Figure 21-4.


    +   15. The scroll box in the center of the dialog lists about a dozen standard
    monitor frequencies. You can select one of these or enter values specific to your
    monitor in the Horizontal Sync and Vertical Sync text boxes. Your monitor’s manual
    contains this information, or you can obtain it from the manufacturer’s Web site.


    > Do not specify a horizontal synchronization range that is beyond the capabilities
    of your monitor. A wrong value can damage the monitor.


    +   16. If you use multiple video adapters in your system, you can select the
    card for this monitor configuration from the drop-down list box at the bottom
    of the screen. Otherwise, xf86cfg uses the card you configured in Steps 10–13.
    Note that the name appearing in this box is the identifier value.


    +   17. If you wish, you can type a new name in the Identifier text box at the
    top of the dialog box, but this step is optional.


    +   18. Click the Ok button to return to the main screen of xf86cfg.


    +   19. The configuration is now complete and your changes have been saved, so
    click the Quit button to exit xf86cfg.


    To test the new configuration, you must restart the X server. If you use the graphical
    login, you can restart the X server in one of two ways. First, log out. Then,
    you can either'
