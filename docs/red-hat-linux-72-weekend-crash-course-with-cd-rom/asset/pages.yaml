- pgno: 120
  md: 'system. Compression also makes sending files over the Internet via e-mail,
    or by using the FTP or HTTP protocols, much faster.


    # Compressing files


    To compress a file, use the command `gzip fileName`, where *fileName* is the name
    of the file you want to compress. The `gzip` command will compress *fileName*
    and replace it with one that has a .gz extension, indicating it has been compressed
    using `gzip` (This is commonly called a `gzipped` file.)


    For example, suppose you want to compress a large file named `important.txt` that
    you want to e-mail to a friend. To do so, execute the command `gzip important.txt`.
    The following commands show the file’s size before being compressed, the `gzip`
    command to compress it, and the file’s size after compressing it:


    ```

    ls -1 important.txt

    -rw-r--r--  1 kwall kwall  2514760 Jun 17 21:21 important.txt

    gzip important.txt

    ls -1 important.txt.gz

    -rw-r--r--  1 kwall kwall   204228 Jun 17 21:22 important.txt.gz

    ```


    Notice that the gzipped file is less than 10 percent of its original size. Depending
    on the type of file, the reduction in file size will vary. As you can see from
    the example, `gzip` is an easy command to use.


    If you want to see what a gzipped file contains, use the -1 option with `gzip`.
    The -t option tests a gzip file for possible corruption. Because large files can
    take a long time to compress, you can use the -1 option to instruct `gzip` to
    operate quickly, but the compression will be less complete than normal. Conversely,
    to obtain the best possible compression, use the -9 option, but it will take noticeably
    longer to compress the file. The results of using the -1 and -9 options are shown
    in the following example:


    ```

    gzip -1 important.txt

    ls -1 important.txt.gz

    -rw-r--r--  1 kwall kwall 304827 Jun 17 21:29 important.txt.gz

    ```


    Notice that the compressed file after using the -1 option is not as small as it
    was using `gzip` without the -1 option:


    ```

    gzip -9 important.txt

    ls -1 important.txt.gz

    -rw-r--r--  1 kwall kwall 191489 Jun 17 21:32 important.txt.gz

    ```


    Using gzip’s -9 option, the resulting file was somewhat smaller than ordinary,
    but not dramatically so.


    # Uncompressing files


    To uncompress a gzipped file, the command to use is `gunzip fileName`, where *fileName*
    is the name of the file you want to decompress. The `gunzip` command will uncompress
    the file and replace it with one that has the .gz extension removed. So, to decompress
    `important.txt.gz`, use the command `gunzip important.txt.gz`.'
  merge: -1
  img_proc: true
