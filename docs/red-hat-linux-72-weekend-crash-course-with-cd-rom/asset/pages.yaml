- pgno: 52
  md: '# What Is KDE?


    KDE stands for the K Desktop Environment. The KDE project started in October 1996
    with the intent to develop a common GUI for UNIX systems that use the X Window
    System. The first beta version of KDE was released a year later in October 1997,
    and KDE version 1.0 was released in July 1998.


    From the user''s perspective, KDE provides a graphical desktop environment that
    includes a window manager (kwm), a file manager (kfm), a panel (kpanel) for starting
    applications, a help system, configuration tools, and many applications, including
    an image viewer, PostScript viewer, as well as mail and news programs.


    From the developer''s perspective, KDE has class libraries and object models for
    easy application development in C++. KDE itself is a large development project.


    You can always find out the latest information about KDE by visiting the KDE home
    page at http://www.kde.org/.


    KDE is easy to use and shares many similarities with the Windows 95/98/NT/2000
    GUI. You can start applications from a menu that is similar to the Start menu
    in Windows. KDE also enables you to place folders and applications directly on
    the desktop.


    The KDE Panel appearing along the bottom edge of the screen starts applications.
    The left and right ends of the Panel show outward-pointing arrows. You can click
    these arrows to hide the Panel and make more room on the desktop for applications.
    When the Panel is hidden, it still shows a small bar with an arrow. To view the
    entire Panel again, click that arrow and the Panel slides out.


    The following is a list of the most important buttons on the KDE Panel. If you
    don''t know what a button does, simply move the mouse over the button and a small
    pop-up window displays a brief message about that button.


    Sections 4, 17, and 19 cover additional features of the KDE desktop, including
    customizing its appearance and using some of the KDE applets.


    +   * Start Button/Main menu: The most important component of the Panel is the
    K Button on the left-hand side of the Panel. That button is like the Start button
    in Windows 95/98/NT/2000. When you click the K button, a pop-up menu appears.
    From this menu, you can get to other menus by moving the mouse over items with
    a rightward pointing arrow. You can start applications from this menu. That''s
    why the KDE documentation calls the K button the Application Starter.


    +   * KDE Desktop: Minimizes all windows and shows only the desktop.


    +   * Terminal Emulation: The KDE Panel also includes a button with the icon of
    a terminal covered by a shell. Click this button to run a terminal emulation program
    and get a terminal window. You can type Linux commands at the shell prompt in
    the terminal window.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   • **KDE Control Center**: Click on the button with an icon of a terminal
    covered by a circuit board to start the KDE Control Center. The Control Center
    enables you to configure various aspects of the KDE desktop.

    +   • **Online Help**: To read the online help on KDE, click the button with an
    icon of a book.

    +   • **File Manager**: To view the contents of your home directory, click the
    button with the icon of a folder and a home.

    +   • **Virtual Desktop**: KDE supports a virtual desktop. By default, you get
    four virtual desktops. You can click one of the buttons labeled 1, 2, 3, 4 or
    5 to switch to a specific desktop. You can use the desktops to organize your application
    windows. You do not need to clutter up a single desktop with many open windows.
    When a desktop gets crowded, simply switch to another desktop and open the applications
    there.


    To log out of KDE, select K-C Logout and click the Logout button on the resulting
    dialog box. The next section shows you how to shut down Red Hat Linux and power
    off your PC.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_53_0.png)


    **10 Min. To Go**


    # ## Shutting Down Red Hat Linux


    When you are ready to shut down Red Hat Linux, you must do so in an orderly manner.
    Even if you are the sole user of a Linux system, several other programs are usually
    running in the background. Also, operating systems such as Linux try to optimize
    the way that they write data to the disk. Because disk access is relatively slow
    (compared to the time needed to access memory locations), data generally is held
    in memory and written to the disk in large chunks. Therefore, if you simply turn
    off the power, you run the risk of some files not updating properly.


    Any user (you do not have to be logged in) can shut down the system from the desktop
    or the graphical login screen. The **System** menu in the Login dialog box provides
    menu options for rebooting or halting the system. To shut down the system, simply
    select System-C Halt in the graphical login screen of Figure 3-1.


    Another dialog box asks you to confirm if you really want to halt the system.
    Click the **Yes** button. The system then shuts down in an orderly manner.


    As the system shuts down, you see messages about processes being shut down. You
    may be surprised at how many processes there are, even though no one is explicitly
    running any programs on the system. If your system does not automatically power
    off on shut down, you can manually turn off the power.


    # ## Troubleshooting


    One of the most common problems when installing Red Hat Linux is not being able
    to log in after the post-installation reboot. If you did not create a user account
    during the installation, you must log in as root and create a user account as
    described in Session 10. Similarly, if you forgot the user account password you
    created during installation, log in as the root user, then use the techniques
    described in Session 10 to change the password for that user account.


    If you forgot the root password, reboot and follow these steps:'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   1. At the LILO boot: prompt, type linux single and press Enter.

    +   2. At the \# prompt, type passwd root, and follow the prompts to reset root''s
    password.

    +   3. Finally, type shutdown -r now and the system will reboot and recognize
    the new password.


    Sometimes, your sound card may not work after installation. If this happens, run
    the sound configuration utility. Log in as root and type sndconfig in a terminal
    window. Follow the prompts to configure your sound card.


    # REVIEW


    You began this session by logging into your Linux system. You learned how to log
    out and shut down the system. After learning a little bit about different X Window
    window managers, you logged in again and explored the key features of the GNOME
    desktop. Next, you learned how to select KDE as your GUI for a session and explored
    the key features of KDE. For both GUIs, you discovered how to start applications.
    Finally, you learned the proper method of shutting down a Red Hat Linux system.


    # QUIZ YOURSELF


    +   1. How do you log in to Red Hat Linux after it boots and presents the graphical
    login prompt? (See "Logging In.")

    +   2. What is the "root" in GNOME? (See "Exploring GNOME.")

    +   3. How do you switch your GUI to KDE? (See "Exploring KDE.")

    +   4. How do you open a terminal window in KDE? (See "Exploring KDE.")

    +   5. Why must you shut down a Linux system in an orderly manner? (See "Shutting
    Down Red Hat Linux.")'
  merge: -1
  img_proc: true
