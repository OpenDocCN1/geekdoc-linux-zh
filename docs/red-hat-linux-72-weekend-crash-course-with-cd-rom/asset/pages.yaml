    # Splitting any file into several smaller files


    The `split` command is handy for those times when you want to copy a file to a
    floppy disk, but the file is too large to fit on a single floppy. You can then
    use the `split` command to break up the file into smaller files, each of which
    can fit on a floppy.


    By default, `split` puts 1,000 lines into each file. The files are named by groups
    of letters such as `aa`, `ab`, `ac`, and so on. You can specify a prefix for the
    filenames. For example, to split a large file named `hugefile.tar` into smaller
    files that fit onto high-density 3.5-inch floppy disks, use `split` as follows:


    ```

    split -b 1440K hugefile.tar part.

    ```


    This command splits the `hugefile.tar` file into 1,440K chunks so that each can
    fit onto a floppy disk. The command creates files named `part.aa`, `part.ab`,
    `part.ac`, and so on.


    To combine the `split` files back into a single file, use the `cat` command as
    follows:


    ```

    cat part.?? > hugefile.tar

    ```


    In this command line, each question mark (`?`) matches a single character. Thus,
    the `Bash` shell expands `part.??` to filenames, such as `part.aa`, `part.ab`,
    `part.ac`, and so on.


    # Commands for Maintaining the File System


    Suppose you want to access the files on this book''s companion CD-ROMs. To do
    so, you have to first mount the CD-ROM drive''s file system on a specific directory
    in the `Red Hat Linux` file system.


    # mount and unmount


    To try the `mount` command, log in as `root`, insert a CD-ROM in the CD-ROM drive,
    and then type the following command:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    `mount`: Block device `/dev/cdrom` is write protected, mounting `read only`'
