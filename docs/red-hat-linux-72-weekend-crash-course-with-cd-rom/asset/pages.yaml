- pgno: 6
  md: '# Acknowledgments


    **Naba Barkati**


    I am grateful to Terri Varneris for giving me the opportunity to write the *Red
    Hat Linux Weekend Crash Course* — a guide that teaches Red Hat Linux over a weekend.


    Thanks to everyone at Hungry Minds, Inc. for transforming the raw manuscript into
    this well-edited and beautifully packaged book.


    Of course, there would be no reason for this book if it were not for Linux. For
    this, I have Linus Torvalds and the legions of Linux developers around the world
    to thank. Thanks also to Red Hat for providing a copy of *Red Hat Linux* for this
    book.


    Finally, and as always, my greatest thanks go to my wife, Leha, and our daughters,
    Ivy, Emily, and Ashley — it is their love and support that keeps me going. Thanks
    for being there!


    **Kurt Wall**


    Like Naba, I appreciate Terri Varneris'' confidence in my ability to write this
    book. Thanks to Valerie Haynes Perry, the whole thing ran smoothly. The entire
    team at Hungry Minds, Inc. deserves thanks — turning a marked-up manuscript into
    a real book with text, graphics, an index, and covers is no small task.


    I share Naba''s gratitude to Linus Torvalds and the development community around
    him. Linux is a remarkable phenomenon, and I am proud to be associated with it.


    I am honored to have worked with Naba. I learned C++ from him, or rather, from
    one of his books because it was the course textbook. What a privilege and how
    satisfying it is to work with someone from whom I have learned! Thanks, Naba!


    She will be embarrassed to be mentioned here, but someone entered my life while
    I worked on this book and unknowingly kept me going. M.M.J., I will spend the
    rest of my life showing you how much I love you.


    Neither Naba nor I would be able to do this were it not for readers. Thanks to
    you all!


    Finally, and above all, I thank God for giving me the desire and the ability to
    write and the opportunity to do so.'
  merge: -1
  img_proc: true
