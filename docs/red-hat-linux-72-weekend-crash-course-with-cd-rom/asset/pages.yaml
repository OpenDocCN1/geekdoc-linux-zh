    # QUIZ YOURSELF


    +   1. What is a "compressed tarball"? (See "Downloading and Unpacking the Software.")

    +   2. What command do you use to unpack a compressed tarball? (See "Downloading
    and Unpacking the Software.")

    +   3. What are some typical files that provide information on building and installing
