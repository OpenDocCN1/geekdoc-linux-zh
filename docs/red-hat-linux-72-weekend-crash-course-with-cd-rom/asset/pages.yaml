- pgno: 387
  md: "# Get Up to Speed on Red Hat Linux 7.2—in a Weekend!\n\nThe big day is Monday.\
    \ The day you get to show off what you know about Red Hat Linux. The problem is,\
    \ you’re not really up to speed. Maybe it’s been a while since you worked with\
    \ Linux. Or maybe you just like a challenge. In any event, we’ve got a solution\
    \ for you—Red Hat Linux 7.2 Weekend Crash Course. Open the book Friday evening\
    \ and on Sunday afternoon, after completing 30 fast, focused sessions, you’ll\
    \ be able to jump right in and install, use, and manage Red Hat Linux. It’s as\
    \ simple as that.\n\n# The Curriculum\n\n+   **FRIDAY**\n+   *Evening: 4 Sessions,\
    \ 2 Hours*\n+   \n+   - Installing Red Hat Linux\n+   - Troubleshooting the Red\
    \ Hat Linux installation\n+   - Test Driving Red Hat Linux\n+   - Customizing\
    \ the GNOME and KDE desktops\n\n+   **SATURDAY, CONTINUED**\n+   *Morning: 6 Sessions,\
    \ 3 Hours*\n+   \n+   - Exploring Linux Files and Directories\n+   - Understanding\
    \ the Shell\n+   - Learning Linux Commands\n+   - Editing Text Files in Red Hat\
    \ Linux\n+   - Learning More Linux and Bash Commands\n+   - Performing Basic System\
    \ Administration Tasks\n\n+   **SATURDAY, CONTINUED**\n+   *Afternoon: 6 Sessions,\
    \ 3 Hours*\n+   \n+   - Using Modems in Red Hat Linux\n+   - Networking your Red\
    \ Hat Linux PC\n+   - Connecting Your Red Hat Linux PC to the Internet\n+   -\
    \ Setting Up Internet Services\n+   - Using Red Hat Linux as a Workgroup Server\n\
    +   - Accessing Windows and DOS Files from Red Hat Linux\n\n+   *Evening: 4 Sessions,\
    \ 2 Hours*\n+   \n+   - Working with Screen Savers and Playing Games\n+   - Working\
    \ with Multimedia Applications\n+   - Working with the Office Tools in Red Hat\
    \ Linux\n+   - Using the Red Hat Network\n\n+   **SUNDAY**\n+   *Morning: 6 Sessions,\
    \ 3 Hours*\n+   \n+   - Configuring the X Window System\n+   - Understanding How\
    \ Red Hat Linux Boots\n+   - Installing Software Packages\n+   - Building a New\
    \ Kernel\n+   - Scheduling Jobs in Red Hat Linux\n+   - Backing Up and Restoring\
    \ Files\n\n+   *Afternoon: 4 Sessions, 2 Hours*\n+   \n+   - Building Software\
    \ Packages from Source Files\n+   - Monitoring System Performance\n+   - Maintaining\
    \ System Security\n+   - Getting Help from Available Resources\n\n+   2 BONUS\
    \ CD-ROMs\n+   Red Hat® Linux® 7.2 Publisher’s Edition, featuring:\n+   - GNOME\
    \ and KDE\n+   - Linux Kernel plus Apacha, Samba, and Netscape\n+   - Assessment\
    \ Test Software to help gauge your progress\n+   - And much more!\n\n**System\
    \ Requirements:**\nIntel 486-compatible or higher PC with CD-ROM drive. A minimum\
    \ of 800MB free hard drive space, 128MB RAM. See the “What’s on the CD-ROM” appendix\
    \ for details and complete system requirements.\n\n**Category:** Operating System/Linux\n\
    \nFor more information on Hungry Minds, go to www.hungryminds.com\n\n$24.99 US\n\
    $37.99 CAN\n£19.99 UK Incl. VAT\n\nISBN 0-7645-3496-5\n\n52499"
