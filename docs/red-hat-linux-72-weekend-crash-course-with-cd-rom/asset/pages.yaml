- pgno: 56
  md: '# SESSION


    ![](img/5fe8f856723cde0b366f73584b9e64b8_56_0.png)


    ![](img/5fe8f856723cde0b366f73584b9e64b8_56_1.png)


    # Customizing the GNOME

    and KDE Desktops


    # **Session Checklist**


    +   ✓  Customizing the GNOME desktop

    +   ✓  Changing the default desktop

    +   ✓  Customizing the KDE desktop


    ![](img/5fe8f856723cde0b366f73584b9e64b8_56_2.png)


    **30 Min. To Go**

    T his evening''s last session focuses on using the GNOME and KDE graphical desktops
    and some of the applications and utilities that come bundled with Red Hat Linux.
    It also shows you how to customize the GNOME and KDE desktops, and teaches you
    how to switch your default desktop from GNOME to KDE, and vice versa.


    # Customizing the GNOME Desktop


    As Session 3 explained, the default look and feel of the GNOME graphical desktop
    is similar to that of Windows 95/98/2000, so you do not really have to customize
    anything to begin using Red Hat Linux. However, if you want, you can customize
    the GNOME desktop just as you can customize Windows 95/98/NT/2000. For example,
    you can select a different background, change the appearance of the window borders,
    or select and configure a screen saver.


    To try your hand at customizing the GNOME desktop, log in from the graphical login
    screen. I assume that GNOME is your default desktop environment because that''s
    what you usually get when you install Red Hat Linux.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_56_3.png)


    If GNOME is not your default desktop, select Session→ GNOME from the Login window
    before entering your user name and password.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'You can configure most aspects of the GNOME desktop’s look and feel — the appearance
    and behavior selecting Main Menu ⚙ Programs ⚙ Settings ⚙ Desktop or Main Menu
    ⚙ Programs ⚙ Settings ⚙ Sawfish window manager and then selecting one of the items
    from that submenu, such as Appearance or Sound. Each one of these configuration
    items, known as capplets, short for configuration applets, allow you to configure
    one aspect or another of the desktop’s look and feel. The user interface is typically
    a dialog box with settings that you can change. In the next sections, you will
    try out a few customizations.


    # Changing the background


    To try a simple customization, select Desktop ⚙ Background from the tree to run
    the background properties capplet that, in turn, displays a dialog box in the
    workspace (as shown in Figure 4-1).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_57_0.png)


    **Figure 4-1** Customizing GNOME desktop’s background


    As you can see, this dialog box looks similar to the Display Properties dialog
    box in Windows 95/98/NT. It enables you to select a solid color or color gradient
    background or to pick the *wallpaper* (an image used as the background). A *color
    gradient* refers to a two-color background that starts with one color and gradually
    changes to another color. The gradient can start in the vertical direction (top
    to bottom) or horizontal (left to right).


    Go ahead and click the Color drop-down to select Vertical Gradient, and then click
    the Primary Color and Secondary Color buttons to select the colors for the gradient.
    You get to preview the changes in the image of a monitor that appears in the dialog
    box.


    If you want to use an image as the wallpaper, click the Browse button in the Wallpaper
    section of the dialog box. A Wallpaper selection dialog box displays the contents
    of the /usr/share/nautilus directory, so browse the /usr/share/pixmaps/backgrounds
    directory for more background images. For example, try the /usr/share/pixmaps/backgrounds/space
    directory that has a collection of images of the earth as seen from space. You
    can select any Joint Photographic Experts Group (JPEG) or Portable Network Graphics
    (PNG) format image file as the wallpaper.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'To try out any of these changes on the desktop, click the Apply button. You
    can revert to the original setting by clicking the Cancel button. When you are
    finished making the changes, click the OK button to close the dialog box and apply
    the changes.


    # ## Selecting a theme


    Another more exciting customization is to select a new theme for the entire user
    interface. *A theme* refers to a collection of user interface components, such
    as buttons, checkboxes, scrollbars, and so on, that are similar in both look and
    feel. In some cases, the total effect of a theme can be quite stunning. To try
    out some new themes, select **Desktop->Theme Selector** from the tree menu. From
    the theme selector dialog box, you can try out different themes and select one
    that you like. When you select a theme, you can see its appearance in the preview
    area. For example, select the MockMachine theme from the list of available themes,
    and then click the Try button. It causes the look and feel of the GNOME desktop,
    including the Control Center window, to resemble that of the Apple Macintosh.


    If you like a theme, click the OK button to use that theme. Otherwise, click the
    **Revert button** to return to the default theme.


    # ## Customizing the window manager


    GNOME does not depend on any one window manager. The default window manager is
    called *Sawfish*, but you can select another window manager if you want. To choose
    a window manager, select **Desktop->Window Manager** from the Control Center tree
    menu. You should see a list of window managers available on your system, as shown
    in Figure 4-2.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_58_0.png)


    **Figure 4-2**  Selecting or customizing a window manager


    In this case, the list shows two window managers: Sawfish and twm. As you can
    see, the parenthetical note shows that Sawfish is the current window manager.
    If you want, you can try out the twm window manager by selecting it and then clicking
    the Try button. Later on, click **Revert** to return to the Sawfish window manager.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "Like any window manager, Sawfish controls title bars, frames, and other decorations\
    \ around each window. These features enable users to click and drag a window to\
    \ change its location or adjust its size. (Think for a moment; if there were no\
    \ frame or title bar, you could not move or resize the window.)\n\nSawfish includes\
    \ a configuration tool for changing the look and feel of the window frames and\
    \ title bars. You can activate the configuration tool by clicking the button labeled\
    \ Run Configuration Tool for Sawfish (refer to Figure 4-2). This brings up the\
    \ Sawfish configurator, which provides a tree menu of configuration options. Through\
    \ this menu, the Sawfish configurator enables you to change how the Sawfish window\
    \ manager decorates windows, adds special visual effects and sounds, and behaves\
    \ in response to mouse clicks and keystrokes. You can try out some of the configuration\
    \ items in the Sawfish configurator.\n\n# Changing the Default Desktop\n\nGNOME\
    \ and KDE are both capable graphical desktop environments. Red Hat Linux comes\
    \ with both of these GUIs, but GNOME is the default desktop. Just before you log\
    \ in at the graphical login screen, you can always select a specific desktop from\
    \ the Session menu of the login window. However, Red Hat also includes a Desktop\
    \ Switcher utility that enables you to switch the default desktop from GNOME to\
    \ KDE, and vice versa. To switch from GNOME to KDE, follow these steps:\n\n+ \
    \  1. From your GNOME desktop, select the Main Menu:: Programs::System::Desktop\
    \ Switching Tool. The Desktop Switcher dialog box appears, as shown in Figure\
    \ 4-3.\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_59_0.png)\n\n+   2. In the\
    \ Desktop Switcher dialog box, click the KDE radio button to select it. Then click\
    \ the OK button. A confirmation dialog box, also named Desktop Switcher, appears.\n\
    +   \n+   3. A message in the new dialog box informs you that the desktop configuration\
    \ has been changed, but you must restart X. Click the OK button to dismiss the\
    \ dialog box.\n\nAlthough the message in Step 3 says you must restart X, all you\
    \ need to do is log out of the session and log back in. To log out, select Main\
    \ Menu:: Log out. When you log in again, you should get the KDE desktop."
  merge: -1
  img_proc: true
- pgno: 60
  md: 'To switch the default desktop from KDE back to GNOME, log in and select K System
    Desktop Switching Tool from the KDE desktop. In the Desktop Switcher dialog box,
    select GNOME as the desktop. After you log out of KDE and log back in, you should
    get GNOME as your desktop.


    # Customizing the KDE Desktop


    Now that you know how to change your desktop from GNOME to KDE and vice versa,
    select the KDE desktop and log in as a user. Like GNOME, KDE also includes a graphical
    application called the KDE Control Center that you can use to customize various
    aspects of KDE, including the desktop background, icons, and font. To start the
    KDE Control Center, select K Control Center; or on the Panel, click the button
    with the icon of a circuit board and a monitor.


    When the KDE Control Center starts, it displays the main window with a tree menu
    on the left and some summary information about your system in the workspace to
    the right (see Figure 4-4).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_60_0.png)


    Figure 4-4 The KDE Control Center


    The KDE Control Center''s tree menu shows the items that you can control with
    this tool. The tree menu is organized into eight categories that include Applications,
    Desktop, Information, Input Devices, Keyboard Shortcuts, Network, Sound, and Window
    Behavior. Click the plus sign ( + ) to the left of an item to view the subcategories
    for that item. To change an item, go through the tree menu to locate the item
    and then click it. That item''s configuration options then appear in a tabbed
    dialog box on the right side of the window.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Changing the background and theme


    To customize the desktop background, select Look & Feel Background from the tree
    menu. The Background tab appears (see Figure 4-5) with options for customizing
    the desktop''s background.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_61_0.png)


    Figure 4-5 Customizing the desktop background with the KDE Control Center


    You can select either a one or two color background or wallpaper. For example,
    if you want to use wallpaper as your background, click the Wallpaper tab, and
    then click the Browse button on the Wallpaper tab. This brings up an Open dialog
    box showing the JPEG files in the /usr/share/wallpapers directory. You can select
    one of these images and click OK. Then click the Apply button in the KDE Control
    Center to apply this wallpaper to the desktop. If you like the appearance, click
    OK. Otherwise, click Default and then Apply again to revert to the original background.


    As you can see from the menu items in the Look & Feel category (Figure 4-5), you
    can customize a number of aspects of the background from borders and colors to
    language for menus. I won''t go through all the items here, but you should experiment
    with some of these customizations. For example, select the Theme Manager to try
    out one of several themes, much like the themes offered in the GNOME Control Center.
    Figure 4-6 shows the result of selecting and previewing a theme.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_62_0.png)


    **Figure 4-6** Selecting and previewing a theme in the KDE Control Center


    # ### Selecting a color scheme


    If you want to pick a color scheme for the desktop colors, much like the color
    schemes in Windows 95/98/NT/2000, select **Look & Feel** \> Colors in the KDE
    Control Center’s tree menu. The Colors tab appears. You can then scroll down the
    list of color schemes and select one to preview. When you select a color scheme,
    the preview area in the tab shows how that color scheme looks. To apply a color
    scheme to the desktop, click the **Apply** button. If you don’t like the scheme,
    click **Use Defaults** and then **Apply** again to revert to the default color
    scheme.


    # ### Performing other tasks


    In addition to desktop customization, the **Information** item in the KDE Control
    Center enables you to perform many more tasks, including associating sound files
    with events (such as opening or closing a window), defining keyboard shortcuts,
    and viewing information about your system. You should take the remaining time
    in this session to explore the other items in the tree menu of the KDE Control
    Center.


    # ## REVIEW


    This session showed you how to customize the GNOME graphical desktop’s appearance
    (look) and behavior (feel). You used the GNOME Control Center to change various
    aspects of the desktop’s look and feel. You learned how to change the default
    desktop from GNOME to the KDE graphical desktop and vice versa. Finally, you also
    used the KDE Control Center to customize the look and feel of KDE.'
  merge: -1
  img_proc: true
