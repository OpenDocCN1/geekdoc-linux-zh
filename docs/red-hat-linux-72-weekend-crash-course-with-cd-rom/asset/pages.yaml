    The other command, `du`, is useful for finding out how much space a directory
    takes up. For example, type the following command to view the contents of all
    the directories in the `/var/log` directory (containing various error logs):


    ```

    du /var/log

    4     /var/log/httpd

    4     /var/log/news/OLD

    8     /var/log/news

    4     /var/log/vbox

    4     /var/log/samba

    4     /var/log/sa

    120   /var/log

    ```


    A number precedes each directory name. That number denotes the number of kilobytes
    of disk space used by that directory. Thus, the `/var/log` directory as a whole
    uses 120K of disk space, whereas the `/var/log/old` subdirectory uses 4K. If you
    simply want the total disk space used by a directory (including all the files
    and subdirectories contained in that directory), use the `-s` option as follows:


    ```

    du -s /var/log

    120   /var/log

    ```


    Notice that the `-s` option causes `du` to print just the summary information
    for the `/var/log` directory.


    > The `-h` option works with `du` as well as `df`.


