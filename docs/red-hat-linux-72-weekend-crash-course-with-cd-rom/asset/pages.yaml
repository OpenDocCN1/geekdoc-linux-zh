  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_26_0.png)\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_26_1.png)\n\
    \n# Installing Red Hat Linux\n\n# Session Checklist\n\n+   ✓ Taking stock of your\
    \ PC’s components\n+   \n+   ✓ Creating a Red Hat boot disk\n+   \n+   ✓ Installing\
    \ Red Hat Linux\n\nThis evening’s sessions guide you through installing Red Hat\
    \ Linux using this book’s companion CD-ROMs; troubleshooting a few common installation\
    \ problems; and taking a first Red Hat Linux test drive. Assuming that the installation\
    \ program recognizes most of your PC’s hardware, you should finish the installation\
    \ in an hour or so. By the end of the third session, you will have Red Hat Linux\
    \ installed on your PC and will have begun to familiarize yourself with the GNOME\
    \ and KDE desktops.\n\nThis session highlights key points and concepts of the\
    \ standard Red Hat installation procedure to help you get started. For detailed,\
    \ step-by-step installation procedures, we defer to the authoritative guide on\
    \ the subject, *The Official Red Hat Linux Installation Guide*, available online\
    \ at http://www.redhat.com/support/manuals/.\n\n# Checking If Red Hat Linux Supports\
    \ Your PC Hardware\n\nBefore starting the installation, make sure Red Hat Linux\
    \ supports your PC’s hardware. At a minimum, you must have a Linux-compatible\
    \ CPU, but type, disk drive, video card, monitor, keyboard, mouse, and CD-ROM\
    \ drive to install Red Hat Linux from the companion CD-ROMs. If you want to run\
    \ the X Window System and graphical desktops such as GNOME or KDE, you also must\
    \ ensure that XFree86 (the X Window System for Linux) supports your mouse, video\
    \ card, and monitor. Perform the following steps to confirm that Red Hat Linux\
    \ supports your PC’s hardware:"
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   1. Gather the make, model, and other technical details of all hardware
    installed on your PC. This is your hardware inventory. If you use Windows 95/98,
    double-click the System icon in the Control Panel, and then select the Device
    Manager tab to gather some of this information.

    +   2. With your hardware inventory in hand, visit Red Hat''s Web site at http://www.redhat.com/hardware.
    This Web site contains a list of hardware that the latest version of Red Hat Linux
    supports. Check your PC''s hardware against that list and make sure that Red Hat
    Linux supports the key hardware components.


    If you have a network card and your Linux PC is or will be part of a local area
    network (LAN), you should also gather the following information needed to configure
    the network:


    +   - The PC''s host name and the network''s domain name

    +   - Internet Protocol (IP) address of the PC; or, if the IP address is provided
    by a Dynamic Host Configuration Protocol (DHCP) server, the server''s address

    +   - The gateway, broadcast, and netmask addresses

    +   - The addresses of the network''s name servers


    > If you plan to use Linux on a stand-alone PC at home, you can use Point-to-Point
    Protocol (PPP) to connect to the Internet over a dial-up connection through an
    Internet Service Provider (ISP).


    # Creating the Red Hat Boot Disk


    Assuming you have compatible hardware, the next step is to create a Red Hat boot
    disk if your PC does not support bootable CD-ROMs. The Red Hat Linux installation
    CD is bootable, so if your PC can boot from a CD-ROM, skip ahead to the next section,
    "Repartitioning Your Hard Drive with FIPS." Otherwise, read on. After installing
    Red Hat Linux, you no longer need the Red Hat floppies.


    > You do not need a boot disk if you can start your PC under MS-DOS. Access the
    CD-ROM from the DOS command prompt.


    Creating the Red Hat boot disk involves using a utility program called RAWRITE.EXE
    to copy a special file called the Red Hat Linux boot image to a disk.


    To create the Red Hat boot disk under Windows, follow these steps:


    +   1. Open an MS-DOS window (select Start \> Programs \> MS-DOS Prompt).

    +   2. In the MS-DOS window, enter the following commands at the MS-DOS prompt.
    Replace d: with the drive letter of your CD-ROM. Your input is in bold text:


    ```

    d:

    cd \dosutils

    rwrite

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Enter disk image source file name: \images\boot.img

    Enter target diskette drive: a

    Please insert a formatted diskette into drive A: and press <ENTER> :


    3. As instructed, you should put a formatted disk into your PC''s A: drive and
    then press Enter. \RWRITE.EXE copies the boot-image file to the disk.


    After you see the DOS prompt again, you can take the Red Hat boot disk out of
    the A: drive and (if you haven''t done so already) label it appropriately.


    # Repartitioning Your Hard Drive with FIPS


    Once you have a Red Hat boot disk, if necessary, your next task is to make room
    on your hard disk for Red Hat Linux by partitioning your hard disk. There are
    two ways to repartition your hard disk:


    +   - Destroy the *existing partition* and create two smaller, new partitions
    — one for Windows and the other for Red Hat Linux. This requires you to back up
    and restore the *existing Windows* files. This is the hard way to repartition
    a hard disk.

    +   - Use the *FIPS (First Non-destructive Interactive Partition Splitting)* utility
    program (included on the companion CD-ROMs) to resize the *existing partition*
    and free up space for a second partition in which you can install Red Hat Linux
    without destroying your *existing data*. You can also use a commercial disk partitioning
    software such as PartitionMagic from PowerQuest (http://www.powerquest.com/partition-magic/index.html).


    > No matter which approach you take to repartition your hard disk, do not perform
    this step before you back up the current contents of your hard disk.


    In this section, I show you how to repartition your hard disk using FIPS to create
    room for the Linux partition. During Red Hat Linux installation, you have to further
    divide the partition meant for Linux into at least two parts: one for the Linux
    root file system and the other for swap space.


    > The *Linux* directory tree is also known as the *file system*.


    The FIPS.EXE program and related files are located in the \DOSUTIL subdirectory
    of the companion CD-ROMs. To use FIPS, follow these steps:


    +   1. Use SCANDISK.EXE or another disk repair tool to make sure there are no
    errors on the disk.

    +   2. Defragment the disk. How you defragment the hard disk depends on your current
    operating system. For example, in Windows 95/98, select *Start*→*Programs*→*Accessories*→*System
    Tools*→*Disk Defragmenter*.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   3. In MS-DOS 6.0 or later, create a bootable disk using the command FORMAT
    A: /S. In Windows 95/98, create a startup disk by using the Add/Remove Programs
    option in the Control Panel and then following the instructions in the Startup
    Disk tab.


    +   4. Copy the following files from the CD-ROM to the instructed disk. (The following
    example assumes that D: is the CD-ROM drive.)

    +   COPY D:\DOSUTILS\FIPS.EXE A:

    +   COPY D:\DOSUTILS\RESTORR8.EXE A:

    +   COPY D:\DOSUTILS\FIPSDOCS\ERRORS.TXT A:

    +   FIPS.EXE is the program that splits partitions. ERRORS.TXT is a list of FIPS
    error messages. You consult this list for an explanation of any error messages
    displayed by FIPS. RESTORR8.EXE, which is a program that enables you to restore
    certain important parts of your hard disk from a backup of those areas created
    by FIPS.


    +   5. Leave the bootable disk in the A: drive, and restart the PC. The PC boots
    from A: and displays the A\> prompt.


    +   6. Type FIPS. The FIPS program runs and shows you information about your hard
    disk. FIPS gives you an opportunity to save a backup copy of important disk areas
    before proceeding. After that, FIPS displays the first free cylinder where the
    new partition can start (as well as the size of the partition in megabytes).


    +   7. Use the left- and right-arrow keys to adjust the starting cylinder of the
    new partition (the one that results from splitting the existing partition) to
    change the partition size. Press the right arrow to increase the starting cylinder
    number. This leaves more room in the existing partition and reduces the size of
    the new partition you create. Try to create a new partition that is 1GB or larger.


    +   8. When you are satisfied with the size of the new partition, press Enter.
    FIPS displays the modified partition table and prompts you to enter C to continue
    or R to redo the partition table.


    +   9. Press C to continue. FIPS displays some information about the disk and
    asks whether you want to write the new partition information to the disk.


    +   10. Press Y. FIPS writes the new partition table to the hard disk and then
    exits.


    +   11. Remove the disk from the A: drive and reboot the PC.


    When the system comes up, everything in your hard disk should be intact — but
    the C: drive will be smaller. You have created a new, unformatted partition from
    the unused parts of the old C: drive. During the Red Hat Linux installation, you
    will format it and set it up for use with Linux.


    # Starting the Red Hat Linux Installation


    To start the Red Hat Linux installation, put the first CD-ROM into the caddy,
    the Red Hat boot disk in the A: drive if you need it, and restart the computer.
    When it restarts, your PC loads Red Hat Linux from the boot disk and starts the
    Red Hat installation program, called Anaconda.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Session 1—Installing Red Hat Linux


    ! If the CD-ROM is not in the drive when you reboot, the installer will start
    in text mode and prompt you for the CD-ROM. Only then will it start the X Window
    System and switch to a graphical installation screen.


    After a few moments, the screen displays a Welcome message and ends with a boot:
    prompt. The Welcome message tells you that more information is available by pressing
    any of the function keys from F1 through F5. To start installing Red Hat Linux
    immediately, press Enter.


    Installing Red Hat Linux from the companion CD-ROMs on a fast (200MHz or better)
    Pentium PC should take less than an hour, even if you install nearly all of the
    packages. For example, on a 266MHz Pentium PC with 128MB of RAM and a 2GB-disk
    partition devoted to Red Hat Linux, the installation takes about 45 minutes. On
    older PCs or PCs with less RAM or larger Linux partitions, the installation process
    will take somewhat longer. These time estimates also do not include checking for
    bad blocks on the installation disks, which will increase the duration of the
    installation process considerably.


    # Partitioning the Hard Disk for Red Hat Linux


    Before you can install any software, you must prepare the empty partition you
    created using FIPS for Red Hat Linux. This involves subdividing the empty partition
    into at least two parts and formatting one of the parts for the Linux file system,
    called ext2. You can let the installer do this automatically, or you can perform
    the task manually using Disk Druid — a utility program that enables you to partition
    the disk and, at the same time, specify which parts of the Linux file system you
    want to load on which partition. Our example uses the simplest configuration:
    one small swap partition (see “Understanding swap partitions,” later in this session
    for more information) and a large partition that contains all the files.


    Before you begin to use Disk Druid to partition your disk, you need to know how
    to refer to the disk drives and partitions in Linux. Also, you should understand
    the terms mount points and swap partition. In the next three sections, you learn
    these terms and concepts and then proceed to use Disk Druid.


    # Naming process and devices


    The first step in partitioning the hard disk is to understand how Red Hat Linux
    refers to the various disks. Linux treats all devices as files and has actual
    files that represent each device. In Red Hat Linux, these device files are located
    in the /dev directory. Because Linux treats a device as a file in the /dev directory,
    the hard disk names start with /dev. Table 1-1 lists the hard disk and floppy
    drive names that you may have to use.


    Table 1-1

    Hard Disk and Floppy Drive Names


    | Name | Description |

    | :--- | :--- |

    | /dev/hda | First Integrated Drive Electronics (IDE) hard drive (the C: drive
    in DOS and Windows)


    (continued)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Table 1-1 Continued


    | Name | Description |

    | :--- | :--- |

    | /dev/hdb | Second IDE hard drive (the D: drive in DOS and Windows) |

    | /dev/sda | First Small Computer System Interface (SCSI) drive |

    | /dev/sdb | Second SCSI drive |

    | /dev/fd0 | First floppy drive (the A: drive in DOS) |

    | /dev/fd1 | Second floppy drive (the B: drive in DOS) |


    > When Disk Druid displays the list of partitions, the partition names take the
    form hda1, hda2, and so on. Linux constructs each partition name by appending
    to the disk’s name the partition number — 1 through 4 for the four primary partitions
    on a hard disk. Therefore, if your PC’s single IDE hard drive has two partitions,
    notice that the installation program uses hda1 and hda2 as the names of these
    partitions.


    # Mounting a file system on a device


    In Red Hat Linux, you use a physical disk partition by associating it with a specific
    part of the file system. This is a hierarchical arrangement of directories known
    as a *directory tree*. If you have more than one disk partition (you may have
    a second disk with a Linux partition), you can use all of them in Red Hat Linux
    under a single directory tree. All you have to do is decide which part of the
    Linux directory tree should be located on each partition — a process known in
    Linux as *mounting a file system on a device*. (The disk partition is a *device*.)


    > A *mount point* is the directory associated with a disk partition.


    Suppose that you have two disks on your PC, and you have created Linux partitions
    on both disks. Figure 1-1 illustrates how you can mount different parts of the
    Linux directory tree (the file system) on these two partitions.


    For simplicity’s sake, our installation example uses one partition, a configuration
    that is not ideal, as you will learn in Session 5.


    # Understanding swap partitions


    Linux uses a *virtual memory* system, meaning it can use part of your system’s
    hard disk as an extension of the physical memory (RAM). When Linux runs out of
    physical memory, it can move (or *swap out*) currently unneeded parts of RAM to
    make room for a program that needs more memory. If Linux needs to access anything
    in the swapped-out data, it finds something else to swap out and then swaps in
    the required data from the disk. This process of swapping data back and forth
    between the RAM and the disk is also known as *paging*.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_32_0.png)


    # Figure 1-1  An example of mounting the Red Hat Linux file system on two disk
    partitions


    During the Red Hat Linux installation process, you will create a swap partition
    using Disk Druid. Follow the onscreen prompts, mark a partition type as a swap
    device, and Disk Druid will perform the necessary tasks.


    # Preparing disk partitions for Red Hat Linux


    When the installer prompts you for the method you want to use to partition the
    disk, select Disk Druid and click the Next button. You should then see the Disk
    Druid screen (shown in Figure 1-2).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_32_1.png)


    # Figure 1-2  Disk Druid screen from Red Hat Linux installation program'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Disk Druid''s interface is a little intimidating at first, but it has ample
    context-sensitive help and prevents you from making silly mistakes that might
    destroy all the data on your disk. Create a swap partition up to twice the size
    of the amount of installed RAM, then use the remaining free space as the Linux
    root partition.


    After you finish specifying the partitions in Disk Druid, the Red Hat installation
    program displays a screen listing the partitions that you may have to format for
    use in Linux. The list only shows Linux partitions; you do not format the swap
    partition.


    To format a partition, click the button next to the partition''s name. You should
    also click the button next to the item marked Check for bad blocks while formatting
    so that the formatting process marks any areas of the disk that may be defective
    physically. If you do enable checking for bad blocks, the installation will take
    considerably longer than the estimates given earlier in the session.


    # Configuring Red Hat Linux


    ![](img/5fe8f856723cde0b366f73584b9e64b8_33_0.png)


    With partitioning and formatting out of the way, you are almost ready to start
    installing software. First, the installer prompts you to set a few key system
    parameters: where to install the boot loader, providing network information (if
    applicable), defining your time zone, and setting authentication (login) information.


    # Install LILO


    LILO, which stands for *Linux Loader*, is a *boot loader*, a program that starts
    operating systems after the PC hardware has booted. LILO can load Windows 95/98,
    if it is installed. For systems with Windows 95/98 and Red Hat Linux residing
    on a single hard disk, Red Hat recommends installing LILO on the master boot record.


    Session 24 covers LILO in more detail.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_33_1.png)


    # Configure the network


    Assuming the Linux kernel detected a network card, the Red Hat installation program
    displays the Network Configuration screen that enables you to configure the LAN
    parameters for your Linux system. This step is *not* for configuring dial-up networking.


    # Set the time zone


    After completing the network configuration, select your time zone, making sure
    to check the box near the bottom of the screen that says your PC clock uses local
    time.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# **Set the root password and add user accounts**


    The next screen you will see is the Account Configuration screen. You must select
    a password for the root user and add at least one normal user account. The root
    user is the super user in Linux and can do almost anything on the system. Assign
    a password that you can remember—but that others cannot guess easily. The password
    should be at least eight characters long, include a mix of upper- and lowercase
    letters and numbers, and at least one special characters such as + or *. Passwords
    are case sensitive.


    To add a user account, fill in the Account Name, Password, and Full Name fields,
    and then click the Add button. The new account information then appears in the
    table underneath the Add button. You do not have to add all the user accounts
    at this time.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_34_0.png)


    Session 10 explains how to add user accounts.


    # **Configure password authentication**


    The installation program displays a screen from which you can configure the password
    authentication options. There are several options that you can enable or disable.
    You should use the default settings for increased system security. Click the Next
    button to proceed to the next configuration step.


    # **Selecting the Package Groups to Install**


    After you complete the key configuration steps, the installation program displays
    a screen from which you can select the Red Hat Linux package groups that you want
    to install. After you select the package groups, take a coffee break while Anaconda
    installs Red Hat Linux. You may have to to insert the second CD-ROM, so check
    back occasionally.


    # **Completing the Installation**


    After all the software is installed, some final configuration tasks are taken
    care of, and an emergency boot disk is created, the installer will prompt you
    to reboot the system. After clicking the OK button, remove the CD-ROM and the
    floppy disk from their drives.


    # **REVIEW**


    This session covered verifying your hardware''s compatibility with Red Hat Linux,
    creating a boot disk, partitioning your hard disk, and briefly explained how Linux
    uses disk partitions. Finally, the session described the major milestones of the
    actual Red Hat Linux installation.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_34_1.png)'
  merge: -1
  img_proc: true
