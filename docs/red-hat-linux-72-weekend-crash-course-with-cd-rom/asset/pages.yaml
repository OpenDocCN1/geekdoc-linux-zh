- pgno: 329
  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_329_0.png)\n\n# ### 10 Min. To Go\
    \ \n Accessing Other Linux Resources\n\nIn addition to the online help just described,\
    \ several other resources can provide more information on specific topics. Most\
    \ of the resources are on the Internet because that’s where you can get the latest\
    \ information on Red Hat Linux and Linux in general. The rest of this session\
    \ introduces you to some of these Linux resources. Instead of providing a long\
    \ listing of URLs, the remaining sections include a few key Web sites that you\
    \ can use as starting points for your search.\n\n# **Web pages**\n\nIf you browse\
    \ the Internet, you may notice that there are quite a few Web pages with Linux-related\
    \ information. A good starting point is the following Linux page at `http://www.linux.org/`.\
    \ This page provides a starting point for locating information about Linux. You\
    \ can click the buttons to access more information on the topic identified by\
    \ that button’s label. At this page, you’ll also find an organized collection\
    \ of links to Linux-related Web sites.\n\nTo browse recent news about Linux, visit\
    \ the Linux Resources page at `http://www.linux-resources.com/`. Specialized Systems\
    \ Consultants (SSC), the publisher of the Linux Journal, maintains this page.\
    \ You can scan the articles in the latest issue of Linux Journal and find out\
    \ other information such as the latest version of the kernel and links to other\
    \ Linux resources."
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Another popular and definitive source of Linux information is the home page
    of the Linux Documentation Project (LDP) at the following URL: http://www.linuxdoc.org/.
    On this Web site, you can find many more pointers to other Linux resources on
    the Internet. In particular, you can browse and download the latest HOWTO documents
    from http://metalab.unc.edu/pub/Linux/docs/HOWTO/.


    For Red Hat Linux-specific questions, you can visit Red Hat''s Support Web site
    at http://www.redhat.com/apps/support/. This Web site provides links such as Product
    Updates and Errata, Hardware Compatibility List, and Installation Guides and Manuals.
    In particular, you can find the manuals and FAQs at http://www.redhat.com/support/docs/howto/.


    # *Internet newsgroups*


    To keep up with Linux developments, you need access to the Internet and especially
    to the newsgroups. You can find discussions on specific Linux-related topics in
    the newsgroups listed in Table 30-1.


    Table 30-1 Linux Newsgroups on the Internet


    | Newsgroups | Topics |

    | :--- | :--- |

    | comp.os.linux.admin | Information about Linux system administration. |

    | comp.os.linux.advocacy | Discussions about promoting Linux. |

    | comp.os.linux.announce | Important announcements about Linux. This is a moderated
    newsgroup, which means you must mail the article to the moderator who then posts
    it to the newsgroup. |

    | comp.os.linux.answers | Questions and answers about Linux. All the Linux HOWTOs
    are posted in this moderated newsgroup. |

    | comp.os.linux.development | Current Linux development work. |

    | comp.os.linux.development.apps | Linux application development. |

    | comp.os.linux.development.system | Linux operating system development. |

    | comp.os.linux.hardware | Discussions about Linux and various hardware. |

    | comp.os.linux.help | Help with various aspects of Linux. |

    | comp.os.linux.misc | Miscellaneous topics about Linux. |

    | comp.os.linux.networking | Networking under Linux. |

    | comp.os.linux.setup | Linux setup and installation. |

    | comp.os.linux.x | Discussions about setting up and running the X Window System
    under Linux. |'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'You can use Netscape Communicator to read the newsgroups. For a newsgroup,
    use a URL of the form news: //newsserver/ newsgroup in which newsserver is the
    fully qualified domain name (FQDN) of your news server (your Internet Service
    Provider should give you this name) and newsgroup is the name of the newsgroup
    you want to read. For example, assuming that your news server is news.mysp.net,
    you can browse the comp.os.linux.setup newsgroup by typing the following URL in
    the Location field of the Netscape Web browser:


    news: //news.mysp.net/comp.os.linux.setup


    # FTP archive sites


    You can download Red Hat Linux and other Linux distributions from one of several
    FTP sites around the world. In addition to the Linux distribution itself, these
    sites also contain many other software packages that can run under Linux.


    For the latest list of Red Hat Linux FTP sites worldwide, visit the Web page maintained
    by Red Hat at http: //www.redhat.com/mirrors.html. This page displays a table
    of URLs of sites that maintain the Red Hat distribution for downloading. In that
    table, the Updates column lists the URLs for downloading specific Red Hat Package
    Manager (RPM) files for the latest Red Hat Linux version (for Intel-based PCs).


    Red Hat provides many fixes and improvements as updates in the form of Red Hat
    Packages distributed from Red Hat''s FTP server. Try ftp://ftp.redhat.com/pub/redhat/updates;
    if it''s busy, consult http://www.redhat.com/mirrors.html for a mirror site near
    you. To install these packages, you have to use the Red Hat Package Manager (RPM).


    See Session 20 to learn how to use the Red Hat Network to keep your Red Hat Linux
    system current with the latest updates and security patches.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_331_0.png)


    # Magazines


    *Linux Journal* is a monthly magazine devoted entirely to Linux. On the Web, the
    magazine home page is at http://www.linuxjournal.com. There, you can find information
    on how to subscribe to this magazine.


    *Linux Magazine* is another monthly magazine that covers everything Linux. Visit
    their home page at http://www.linux-mag.com/ to learn more about *Linux Magazine*
    and to subscribe to it.


    # REVIEW


    This session showed you how to get help on various aspects of Red Hat Linux. You
    learned how to use the GNOME Help Browser and also how to use several helpful
    commands such as man, whatis, and apropos. Finally, you familiarized yourself
    with a number of Internet- based Linux resources from Web pages, to FTP archives,
    to two popular Linux magazines.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_331_1.png)'
