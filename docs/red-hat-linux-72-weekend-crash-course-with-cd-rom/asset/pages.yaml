- pgno: 279
  md: "# Scheduling Recurring Jobs\n\nWhile the at command is good for running commands\
    \ at a specific time, it's not useful for running a program automatically at repeated\
    \ intervals. To have to use the crond daemon and the crontab command to schedule\
    \ such recurring jobs. For example, you need to do this if you want to back up\
    \ your files to tape at midnight every day.\n\nYou schedule recurring jobs with\
    \ the crontab command in one of two ways. You can place job information in a file\
    \ with a specific format and submit this file to crond, or you can use crontab\
    \ in interactive mode. The results are the same. (This session uses a file to\
    \ store the job information.) The crond daemon, crond, checks the job information\
    \ every minute and executes the recurring jobs at the specified time. Because\
    \ the crond daemon processes recurring jobs, such jobs are also referred to as\
    \ cron jobs.\n\nAny output from the job is mailed to the user who submitted the\
    \ job. In the submitted job information file, you may specify a different recipient\
    \ for the mailed output.\n\nAs with the at command, two files control who can\
