- pgno: 99
  md: 'This command mounts the file system on the device named /dev/cdrom (the CD-ROM)
    in the /mnt/cdrom directory (also called the *mount point*) in the Linux file
    system. The response from the mount command indicates that the CD-ROM is mounted
    as a read-only file system. After the mount command successfully completes its
    task, you can access the files in the CD-ROM by referring to the /mnt/cdrom directory
    as the top-level directory of the CD-ROM. In other words, to see the contents
    of the Red Hat directory in the CD-ROM, type:


    ```

    ls -F /mnt/cdrom/RedHat

    RPM/  TRANS_TBL  base/

    ```


    You can actually mount a device in any directory on the Linux file system. Essentially,
    the mount point does not have to be /mnt/cdrom; it can be any empty directory.
    For example, if you like to refer to the CD-ROM drive as /cd, first create the
    /cd directory with the mkdir /cd command and then use the following mount command:


    ```

    mount /dev/cdrom /cd

    ```


    Before you try this command, you have to “unmount” the CD-ROM with the following
    unmount command:


    ```

    umount /dev/cdrom

    ```


    Only then can you mount the CD-ROM again on another directory in the Linux file
    system. I have shown you the longer syntax for the mount command in which you
    explicitly specify the device name and the mount point, but Red Hat Linux contains
    a line in the /etc/fstab file that enables you to mount the CD-ROM through one
    of the following commands:


    ```

    mount /mnt/cdrom

    mount /dev/cdrom

    ```


    It is customary to mount devices on directories in the /mnt directory. Red Hat
    Linux comes with two predefined directories: /mnt/cdrom for mounting the CD-ROM
    and /mnt/floppy for mounting the floppy.


