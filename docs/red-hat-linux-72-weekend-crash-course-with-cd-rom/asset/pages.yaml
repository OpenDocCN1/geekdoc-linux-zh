    # ## Troubleshooting


    If you are having trouble setting the Bash command prompt, make sure you are enclosing
    the prompt within apostrophes ('') or double quotes (") and that each token is
    preceded by a backslash (\).


    To restore the Bash prompt to its default value for Red Hat Linux, execute the
    command `export PS1="[\u@\h \W]\$ "`.


    If the tr command complains that you are using too many arguments, make sure that
    you are using < to redirect stdin from a file. Remember, tr reads stdin, not disk
    files, by default.


    If gunzip fails to uncompress a file, use the command gzip -t to test the gzipped
    file for possible corruption. If the file is corrupted, you will have to obtain
    a fresh copy of it.


