    # ### Changing text


    Another handy trick uses a special notation that refers to sets of characters.
    To convert all the lowercase characters in fnlist.txt to uppercase, use [:lower:]
    and [:upper:] in place of "\t" and " ". Here is what the command and its results
    looks like:


    tr [:lower:] [:upper:] < fnlist.txt

    KURT WALL 801-555-1212

    NABA BARKAKATI 301-666-2323

    BUBBA TIPPETS 212-777-3434


    As you can see from the output, [:lower:] refers to all lowercase characters and
    [:upper:] to all uppercase characters. Table 9-3 lists some of the special symbols,
    in addition to [:lower:] and [:upper:], that you can use to refer to specific
    sets of characters when using the tr command.


    | Symbol | Description |

    | :--- | :--- |

    | [:alnum:] | All letters and digits |

    | [:alpha:] | All letters |

    | [:blank:] | Any whitespace (spaces and tabs) |

    | [:digit:] | All numerals (0-9) |

    | [:punct:] | All punctuation characters |


    You can use the tr command to make bulk edits to files with a single command rather
    than making them manually using a standard text editor.


    # ### Compressing and Uncompressing Files


    A common task when using Linux is compressing and uncompressing files. The last
    few minutes of this session show you how to use the gzip and gunzip commands to
    compress and decompress files. Compressing files reduces the amount of disk space
    they use on your'
