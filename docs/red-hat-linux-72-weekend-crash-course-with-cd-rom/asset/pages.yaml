- pgno: 170
  md: '# SESSION 15


    # Using Red Hat Linux as a Workgroup Server


    **Session Checklist**


    +   - Sharing files with NFS

    +   - Setting up your Red Hat Linux PC as a Windows server with Samba


    ![](img/5fe8f856723cde0b366f73584b9e64b8_170_0.png)


    A low-end Pentium PC (or even a 486) configured with Red Hat Linux (from this
    book’s companion CD-ROMs) makes a very capable workgroup or office server. A workgroup
    is a small local area network (LAN) of perhaps a dozen or so PCs. You can configure
    the Red Hat Linux PC to be the file and print server and the other PCs as the
    clients. The client PCs can run Windows instead of Linux.


    This session introduces you to the Samba package, which comes with Red Hat Linux
    and provides everything you need to set up your Red Hat Linux PC as a server in
    a Windows network. However, first you learn about file sharing through Network
    File Sharing (NFS), which provides another way of sharing files besides Samba.


    # Sharing Files with NFS


    Sharing files with NFS is simple, involving two basic steps:


    +   1. On the Red Hat Linux server, export one or more directories by listing
    them in the /etc/exports file, thereby making them available to the client system.

    +   2. On each client system, mount the directories exported by the Red Hat Linux
    server using the mount command.


    The only problem in using NFS for file sharing is that each client system must
    support NFS. Most PCs do not come with NFS. That means you have to buy NFS software
    separately if you want to share files using NFS. It makes sense to use NFS if
    all systems on your LAN run Linux or other variants of UNIX with built-in NFS
    support. This session walks you through NFS setup using an example of two Red
    Hat Linux PCs on a LAN.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Exporting a file system with NFS\n\nOn the server, you must run the NFS service\
    \ and also designate one or more file systems to *export*, or make available to\
    \ the client systems. You can perform both tasks using the Linuxconf graphical\
    \ system administration tool.\n\nPerform these steps to start Linuxconf:\n\n+\
    \   1.  Log in as root and select Main Menu **Programs System Linuxconf** from\
    \ the GNOME menu. Or, again as root, open a terminal window, and type `linuxconf`\
    \ at the command prompt.\n+   2.  Click the Config tab and then select **Networking\
    \ Server Tasks Exported File Systems** (NFS). Linuxconf then displays the Exported\
    \ File Systems tab, which shows the current contents of the `/etc/exports` file.\
    \ If `/etc/exports` is empty, the display should resemble Figure 15-1.\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_171_0.png)\n\
    \n**Figure 15-1 The empty Exported File Systems dialog box**\n\n+   3.  Click\
    \ the **Add** button. This adds the One Exported File System tab to the display,\
    \ which allows you to define the details of the exported file system. You specify\
    \ the file system with a full pathname, as shown in Figure 15-2.\n+   \n+    \
    \   In this dialog box, you should also enter the names of client systems that\
    \ may mount this exported file system. In the example shown in Figure 15-2, the\
    \ `/home/public` directory is being exported and the host named *katie* can mount\
    \ this file system for read and write operations.\n+   4.  Enter the information\
    \ and click the **Accept** button. Linuxconf returns to the dialog box shown in\
    \ Figure 15-1, but now it displays summary information about the exported file\
    \ system.\n+   5.  Click the **Dismiss** button to finish defining exported file\
    \ systems."
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_172_0.png)


    As a result of this session, Linuxconf adds the following entry to the /etc/exports
    file: /home/public katie(rw)


    To verify that the exported directories are listed in the /etc/exports file, type
    cat /etc/exports in a terminal window.


    Now you should turn on the NFS server. To do this, click the Control tab, then
    select Control Panel Control Service Activity. Linuxconf displays the Service
    Control screen with a list of all the services and their statuses, as shown in
    Figure 15-3.


    Each line has three fields: one provides the name of a service, another indicates
    whether the service is enabled to run automatically or manually, and the last
    reveals whether the service is already running. Scroll down the list and locate
    the entry named nfs for the NFS service. In this case, the NFS service is not
    running yet. Click that entry. This causes Linuxconf to display the Service nfs
    tab, shown in Figure 15-4.


    The buttons in this tab enable you to start, stop, or restart the service. In
    this case, click the Start button to start the NFS service. Then click Accept
    to return to the previous dialog box (Figure 15-3). Now the Service Control screen
    should show the status of the nfs entry as Running. Click Dismiss to exit this
    dialog box.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_172_1.png)


    If you ever make any changes to the exported file systems listed in the /etc/exports
    file, remember to restart the NFS service. Click the Restart button in the dialog
    box shown in Figure 15-6.


    If you prefer to start the NFS service using a command, log in as root and type
    the following command in a terminal window: /etc/rc.d/init.d/nfs start


    That sets up the server side of NFS. Now you can try to mount the exported file
    system from the client system.'
  merge: -1
  img_proc: true
