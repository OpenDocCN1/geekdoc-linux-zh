    # Verifying scheduled one-time jobs


    After you enter one or more jobs, you can view the current list of scheduled jobs
    with the atq command as follows:


    ```

    atq

    1 2001-07-08 14:45 a kwall

    2 2001-07-09 14:45 a kwall

    3 2001-08-06 01:00 a kwall

    4 2001-07-08 17:00 a kwall

    6 2001-07-08 14:46 a kwall

    ```


    The first field on each line shows the job number, which is the same number that
    the at command displays when you submit the job. The next field displays the year,
    month, day, and time of execution. The last two fields show that the jobs are
    pending in the a queue along with the user who submitted the jobs. The root user
    can see the at jobs submitted by all users, but normal users can only see their
    own.


    # Canceling one-time jobs and receiving the output


    If you want to cancel a job, use the atrm command to remove that job from the
    queue. When removing a job with the atrm command, refer to the job by its number
    as follows:


    ```

    atrm 3

    ```


    This deletes job number 3 scheduled for 1:00 a.m. on August 6, 2001.


    When a job executes, the output is mailed to you. You can type mail to read your
    mail and view the output from your jobs.'
