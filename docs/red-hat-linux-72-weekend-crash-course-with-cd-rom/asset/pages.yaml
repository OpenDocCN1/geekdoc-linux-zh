  md: "20 Min.  \n   To Go\n\n# ## Using vi\n\nThe *vi* editor is a full-screen text\
    \ editor that enables you to view a file several lines at a time. It is an extremely\
    \ rare Linux or UNIX system that does not have *vi* or another editor that behaves\
    \ like *vi*. Because *vi* is so ubiquitous, learning *vi’s* basic features enables\
    \ you to edit text files on almost any UNIX system.\n\n> Pronounce *vi* as “*ee-vee*,”\
    \ not “*vee*.”\n\nLike the *ed* editor, *vi* works with a buffer. When *vi* edits\
    \ a file, it reads the file into a *buffer*, which is a block of memory. All changes\
    \ reside only in the buffer. Although *vi* uses temporary files during editing,\
    \ the original file is not altered until you save the changes with a specific\
    \ *vi* command.\n\n# ## Setting the terminal type\n\nBefore you start a full-screen\
    \ text editor such as *vi*, you may have to set the *TERM* environment variable\
    \ to the terminal type (such as *vt100* or *xterm*). For example, type `export\
    \ TERM=vt100` to set the terminal type to *VT100*. The *vi* editor uses the terminal\
    \ type to control the terminal in full-screen mode. This step is rarely necessary\
    \ on a Red Hat Linux system.\n\nWhen you run X and a graphical user interface\
    \ such as GNOME or KDE, you can use *vi* in a terminal window. The terminal window’s\
    \ terminal type is *xterm*. To verify this, type `echo $TERM` at the command prompt.\
    \ When you start the terminal window, it automatically sets the *TERM* environment\
    \ variable to *xterm*. Therefore, you should be able to use *vi* in an xterm window\
    \ without explicitly setting the *TERM* variable.\n\n# ## Starting the editor\n\
    \nTo start the editor, use the *vi* command name followed by an optional filename.\
    \ You can provide other arguments besides the filename. However, most of the time\
    \ *vi* starts with a filename as the only argument, as shown here:\n\n```\n`vi\
    \ /etc/hosts`\n```\n\nAnother common way to start *vi* is to jump to a specific\
    \ line number right at startup. To do so, add *+n* between the *vi* command and\
    \ the filename, where *n* is the line number. For example, to begin editing at\
    \ line 296 of the file * /etc/X11/XF86Config*, use this command:\n\n```\n`vi +296\
    \ /etc/X11/XF86Config`\n```\n\nThis way of starting *vi* is useful when you edit\
    \ a source file after the compiler reports an error at a specific line number.\n\
    \nWhen you edit a file with *vi*, the editor loads the file into a buffer, displays\
    \ the first few lines of the file in a full-screen window, and positions the cursor\
    \ on the first line. The last line shows information about the file, including\
    \ the number of lines and the number of characters in the file, as Figure 8-3\
    \ illustrates."
  merge: -1
