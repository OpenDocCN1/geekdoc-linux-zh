- pgno: 234
  md: '# SESSION


    21


    ![](img/5fe8f856723cde0b366f73584b9e64b8_234_0.png)


    # Configuring the X Window System


    # Session Checklist


    +   - ✓ Setting up the X Window System

    +   - ✓ Controlling the X server

    +   - ✓ Changing the default color depth


    ![](img/5fe8f856723cde0b366f73584b9e64b8_234_1.png)


    This morning’s sessions focus on various system administration tasks such as configuring
    X, learning the Red Hat Linux boot sequence, installing new software packages
    from RPM and tar files, building a new kernel, scheduling jobs to run at specific
    times, and performing system backups. This session shows you the steps involved
    in configuring the X Window System, or X for short. It’s important to learn how
    to configure X because graphical desktops such as GNOME and KDE require X in order
    to work.


    # Setting Up the X Window System


    The X Window System, X for short, refers to the various components that facilitate
    the Red Hat Linux graphical interface. Although their two GUIs may bear superficial
    resemblance to each other, X and Microsoft Windows are different in two fundamental
    ways. Significant portions of the Microsoft Windows graphical system are tightly
    integrated into the operating system. X, on the other hand, is just another program
    that runs on top of the Linux kernel. This distinction is not important in the
    context of this session, but it helps explain why Linux is much more stable than
    Windows: The Linux kernel is unaffected by misbehaving X applications, but a poorly
    written Windows application can easily crash the Windows operating system.


    The other key difference is that the X Window System conforms to a client/server
    model while Windows is monolithic; that is, the entire display subsystem is a
    single, complex, and large application. The functionality of the X Window System
    is partitioned into a server component and one or more client components. This
    session concerns itself exclusively with the X server piece. Other sessions focus
    on X clients, the games, word processors, screen savers, and additional applications
    that use the services that the X server provides.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'The X Window System for Red Hat Linux comes from the XFree86 Project; see the
    XFree86 home page at `http://www.xfree86.org/~`. The XFree86 Project consists
    of a group of programmers who maintain the free version of the X Window System
    for Intel-based PCs. As a result, the Linux version of X is called XFree86.


    # ### Understanding the X server


    At the heart of X is the X server, which is a process or program just like any
    other, such as the vi editor or a calendar program. Rather than editing text or
    telling you the date, though, the X server application provides the fundamental
    services necessary to create and manage a graphical interface. These services
    include controlling the video adapter; interpreting input from keyboards, mice,
    and other input devices; drawing windows; moving them around, scribbling in them;
    and responding to requests from X clients.


    X clients are the typical sort of applications, such as word processors, Web browsers,
    or e-mail programs that run in the graphical environment the X server maintains.
    When X clients need to display output or show a dialog box, they do so by communicating
    with the X server, which is solely responsible for drawing on the screen. X clients
    rely on the X server for screen output because they have no independent capability
    to do so.


    Finally, the X server runs on your computer and controls the monitor, keyboard,
    and mouse. X clients, on the other hand, may run locally or on remote systems.


    Configuring X requires you to create the server''s configuration file, `/etc/X11/XF86Config`
    or similar. This file contains information about your video card, monitor, keyboard,
    mouse, and other input devices. Red Hat Linux comes with XFree86 version 4.0.3,
    which itself includes a configuration utility named `xf86cfg`, which simplifies
    creating a working configuration file.


    In Session 2, you learned how to use the Xconfigurator utility to create the X
    configuration file.


    The next part of this session walks you through the X configuration process using
    the xf86cfg program so that you can see the configuration options in detail, and
    understand the format and purpose of the configuration file. If the X server installs
    incorrectly configured X or if you would like to experiment with your X configuration,
    you can use `xf86cfg` and the information in the next part of this session to
    reconfigure X using the new XFree86 configuration tool, `xf86cfg`.


    # **Using xf86cfg**


    To run `xf86cfg`, log in as `root` and type `xf86cfg` at the shell command prompt
    or in a terminal window, if X is already running. (The rest of this session assumes
    that you are using `xf86cfg` while running X.) The initial screen should resemble
    Figure 21-1.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_236_0.png)


    # **Figure 21-1**  Buttons and icons in xf86cfg allow you to configure the corresponding
    items.


    You can use the buttons across the top of the window to add a mouse, keyboard,
    video card, or monitor to the configuration. You can use the icons in the main
    window to reconfigure the components in the current configuration. The icons may
    be arranged differently on your system. Notice in Figure 21-1 that hovering the
    mouse cursor over one of the icons (the keyboard icon in this case) pops up balloon
    help, showing that item’s current configuration values.


    The following steps show you how to reconfigure X using xf86cfg.


    +   1.  Right-click the keyboard icon and select **Configure**.

    +   2.  Select your keyboard language and layout from the scroll boxes.

    +   3.  If you wish, you can type a new name in the Identifier text box at the
    top of the dialog box, but this step is optional.

    +   4.  Click the **Apply Change** button if it is enabled, and then click **Ok**
    to return to xf86cfg’s main screen.

    +   5.  Right-click the mouse icon and select **Configure**. The resulting dialog
    box should resemble Figure 21-2.

    +   6.  Select the mouse device and mouse protocol in the scroll boxes in the
    dialog box. For example, Figure 21-2 shows that /dev/ttyS0 is the mouse device
    (a serial mouse in this case) and that it uses the standard Microsoft Mouse protocol.

    +   7.  If you do not have a three-button mouse, click the **Emulate 3 Buttons**
    box at the bottom of the dialog box. This will enable you to *chord*, or press
    simultaneously, the left and right buttons on a two-button mouse to emulate a
    third (middle) mouse button.

    +   8.  If you wish, you can type a new name in the Identifier text box at the
    top of the dialog box, but this step is optional.

    +   9.  Click the **Apply Changes** button if it is enabled and then the **Ok**
    button to return to the main screen of xf86cfg.'
  merge: -1
  img_proc: true
