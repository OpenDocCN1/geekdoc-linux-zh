- pgno: 319
  md: 'Enter. Next, stop the service by invoking the script with an argument of stop.
    To shut down the httpd service, then, execute the following command:


    ```

    . /httpd stop

    ```


    Finally, use the chmod command to remove the execute permissions. This step will
    prevent the script from executing when the system is booted. To disable the Web
    server, execute the following command:


    ```

    chmod a-x httpd

    ```


    You can perform a similar procedure for other unnecessary services.


    # xinetd server


    In addition to the stand-alone servers such as Web server (httpd), mail (sendmail),
    and Domain Name Server, or DNS (named), you have to configure another server separately.
    That other server, xinetd, called the Internet super server, starts a number of
    other Internet services such as FTP, Telnet, and so on. Here, you briefly look
    at the security aspects of the xinetd server.


    The xinetd server reads a configuration file named /etc/xinetd.conf at startup.
    This file, in turn, refers to configuration files stored in the /etc/xinetd.d
    directory. The configuration files in /etc/xinetd.d tell xinetd which ports to
    listen and which server to start for each port. You can browse through the files
    in /etc/xinetd.d directory on your system to find out the kinds of services that
    xinetd is set up to start. Some of these services provide information that intruders
    may use to break into your system. You should turn off these services by placing
    a disable = yes line into that service''s configuration file.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_319_0.png)


    > To learn more about the xinetd configuration files, type man xinetd.conf at
    the shell prompt in a terminal window.


    Depending on what you need on your system, you may want to disable everything
    but the ftp and telnet services. After making any changes to the xinetd configuration
    files, you must restart the xinetd server by typing the following command:


    ```

    /etc/rc.d/init.d/xinetd restart

    Stopping xinetd: [ OK ]

    Starting xinetd: [ OK ]

    ```


    Another security feature of xinetd is its use of the TCP wrapper facility to start
    various services. The TCP wrapper provides an access control facility for Internet
    services. The TCP wrapper can start other services such as FTP and Telnet; but
    before starting the service, it consults the /etc/hosts.allow file to see if the
    host requesting service is allowed access. If nothing appears in /etc/hosts.allow
    about that host, the TCP wrapper checks the /etc/hosts.deny file to see if it
    should deny the service. If both files are empty, the TCP wrapper allows the host
    to access the requested service.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The ftp and telnet services are potential security holes. They transmit passwords
    as clear, unencrypted text, so someone using the right tool can intercept passwords
    transmitted over the network. For this reason, never use ftp or telnet to log
    into a system as the root user.


    You can place the line `ALL:ALL` in the `/etc/hosts.deny` file to deny all hosts
    access to any Internet services on your system. Then you can add to `/etc/hosts.allow`
    the names of those hosts that can access services on your system. For example,
    to allow only hosts from the `192.168.1.0` network to access services on your
    system, place the following line in the `/etc/hosts.allow` file:


    ```

    `ALL:192.168.1.0/255.255.255.0`

    ```


    If you want to permit access to a specific Internet service to a specific remote
    host, you can do so using the following syntax for a line:


    ```

    `server_program_name: hosts`

    ```


    Here `server_program_name` is the name of the server program (for example, `in.telnetd`
    for Telnet and `in.ftpd` for FTP), and `hosts` is a comma-separated list of hosts
    allowed to access the service. The `hosts` list can also take the form of a network
    address or an entire domain name such as `mycompany.com`. For example, here’s
    how you can allow Telnet access to all systems in the `mycompany.com` domain:


    ```

    `in.telnetd:mycompany.com`

    ```


    # ### Monitoring System Security


    After you set up your system’s security, you have to monitor the log files periodically
    for any signs of intrusion. You should also periodically check security news to
    learn about recently discovered weaknesses in any of your system components (such
    as mail server or Web server). If Red Hat provides an upgrade to fix a security
    problem, download the new RPM files and install them on your system.


    Follow the steps covered in Session 23 to download the new RPM files and install
    them. If you chose to use the Red Hat Network, discussed in Session 20, you will
    automatically be notified when security and system updates become available.


    # ### Log files


    Many Linux system applications, including some servers, write log information
    using the logging capabilities of `syslogd`. On Red Hat Linux systems, the log
    files written by `syslogd` reside in the `/var/log` directory. Make sure that
    only the root user can read and write these files.'
  merge: -1
  img_proc: true
- pgno: 321
  md: "You should routinely monitor the following log files:\n\n+   • */var/log/messages*\
    \ contains a wide variety of logging messages from user logins to messages from\
    \ services started by the TCP wrapper.\n+   \n+   • */var/log/secure* contains\
    \ reports from services such as *in.telnetd* and *in.ftpd* that the TCP wrapper\
    \ starts.\n+   \n+   • */var/log/mailog* contains reports from *sendmail*.\n+\
    \   \n+   • */var/log/xferlog* contains a log of all FTP file transfers.\n\nUnfortunately,\
    \ there is no easy-to-use tool for viewing these log files. The best approach\
    \ is to browse them routinely using a text file viewer such as *less* or *more*\
    \ to prevent accidentally overwriting one of the log files. Using *less* or *more*,\
    \ you can search for a date of interest and begin browsing from that point in\
    \ the file.\n\nBecause many potential intruders use port-scanning tools that attempt\
    \ to establish TCP/IP connections to well-known ports on your system, you should\
    \ look for messages that indicate attempted connections from unknown hosts (indicated\
    \ by names or IP addresses). For such attempted network accesses, you should browse\
    \ through the */var/log/secure* file. For example, here's what a line in the */var/log/secure*\
    \ file shows when connecting to a sample Linux system from one of the PCs on a\
    \ LAN:\n\n```\nAug 16 20:18:19 lnbp200 xinetd[511]: START: ftp pid=23824 from=192.168.1.40\n\
    ```\n\nNotice the text *pid=23824*, which appears next to the word *ftp*. That's\
    \ the process ID of the FTP server program started by *xinetd*. You can use this\
    \ number to look at corresponding messages in the */var/log/messages* file to\
    \ see whether this attempt did or did not succeed. Here is a sample of how you\
    \ could check this:\n\n```\ngrep \"*[23824]*\" messages\nAug 16 20:30:01 lnbp200\
    \ ftpd[23824]: FTP LOGIN FROM lnbp400 [192.168.1.40], naba\nAug 16 20:30:22 ftpd[23824]:\
    \ FTP session closed\n```\n\nThe resulting output tells you that the user *naba*\
    \ successfully logged in and sometime later closed the FTP session.\n\nTo identify\
    \ the host name associated with an address, use the command *dig -x ipaddress*,\
    \ where *ipaddress* is the IP address in which you are interested.\n\nIn a similar\
    \ manner, you should analyze any suspicious messages you find in these log files.\
    \ You may be surprised by the number of attempts curious outsiders make to gain\
    \ access to your system.\n\n# Security news and updates\n\nTo keep up with the\
    \ latest security alerts, you may want to visit one or more of the following sites\
    \ on a daily basis:\n\n+   • CERT Coordination Center at *http://www.cert.org/*\n\
    +   \n+   • Computer Incident Advisory Capability (CIAC) at *http://www.ciac.org/*"
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   • National Infrastructure Protection Center at http://www.nipc.gov/


    If you have access to Internet newsgroups, you can periodically browse the following
    ones:


    +   • news://comp.security.announce is a moderated newsgroup that includes announcements
    from CERT about security.


    +   • news://comp.security.unix includes discussions of UNIX security issues,
    including items related to Red Hat Linux.


    If you prefer to receive regular security updates through e-mail, you can also
    sign up on, or subscribe to, various mailing lists:


    +   • redhead-watch-list@redhat.com: Send an e-mail message to redhead-watch-list-reg@redhat.com
    with the word subscribe in the Subject line.


    +   • linux-security@redhat.com: Send an e-mail message to linux-security-subscribe@redhat.com
    with the word subscribe in the Subject line.


    +   • FOCUS-LINUX: Fill out the form at https://www.securityfocus.com/forums/linux/list/subscribe.html
    to subscribe to this mailing list focused on Linux security issues.


    +   • Cert Advisory mailing list: Send an e-mail message to cert-advisory-request@cert.org
    with SUBSCRIBE myname@myisp.com in the Subject line. Replace myname@myisp.com
    with your e-mail address.


    Finally, you should check Red Hat’s Web site at http://www.redhat.com/support/errata/
    for updates that might fix any known security problems with Red Hat Linux.


    # Troubleshooting


    If a service controlled by xinetd does not stop after you have disabled it, try
    using the command /etc/rc.d/init.d/xinetd reload to force xinetd to reread its
    configuration files and detect any changes.


    If you directly edit the password file /etc/passwd, to add a new user account,
    the shadow password system will not detect the change. To update the shadow password
    file with the new account, execute the commands pwconv and pwick. pwconv converts
    the /etc/passwd file to /etc/shadow, and pwcck makes sure that all of the accounts
    in /etc/passwd have corresponding entries in /etc/shadow.


    If, heaven forbid, you discover that someone has obtained unauthorized access
    to your system by cracking it, immediately disconnect it from the Internet or
    the LAN, as the case may be, by disconnecting the network cable. Then use the
    information at the Web sites listed in the previous section to identify the extent
    of the compromise and to repair any damage done. Do not reconnect to the network
    until you are confident that you have solved the problem.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# REVIEW


    This session introduced you to the subject of security for your Red Hat Linux
    system. You learned the importance of establishing a security policy for a medium
    to large organization. Next, this session showed you how to secure two key elements—the
    passwords and the network services—on your Linux system. Finally, this session
    included a discussion of how to review log files for signs of intrusion attempts
    and how to keep up with any late-breaking security news. Because this session
    could not cover many security topics, it provided you with some additional online
    resources from which you can learn more about securing your Red Hat Linux system.


    # QUIZ YOURSELF


    +   1. Why should you set up a security policy? (See “Establishing a Security
    Policy.”)

    +   2. What are shadow passwords? (See “Shadow passwords.”)

    +   3. What does MD5 refer to? (See “Pluggable Authentication Modules.”)

    +   4. Why should you secure Internet services? (See “Securing Internet services.”)

    +   5. Which log files should you review periodically for signs of intrusion attempts?
    (See “Monitoring System Security.”)'
  merge: -1
