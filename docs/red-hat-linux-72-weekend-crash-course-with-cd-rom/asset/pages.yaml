  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_254_0.png)


    # # S E S S I O N 2 3


    # ## Installing Software Packages


    # ### Session Checklist


    +   ✓ Using Gnome RPM to install and remove packages

    +   ✓ Using the rpm command to install and remove packages


    ![](img/5fe8f856723cde0b366f73584b9e64b8_254_1.png)


    As a system administrator of your Linux system, you should know how to install
    or remove software packages distributed in the form of Red Hat Package Manager
    (RPM) files. In this session, you''ll learn to install or remove RPMs using the
    Gnome RPM graphical tool and the RPM commands.


    # ### Using Gnome RPM to Install and Remove Packages


    One of Red Hat''s most significant contributions to Linux system administration
    is the Red Hat Package Manager (RPM). RPM is a system for installing, maintaining,
    removing, and upgrading a software product using a single file referred to as
    an RPM, which contains all the necessary files for installing that product.


    Red Hat Linux is distributed in the form of a large number of RPMs. All of the
    RPM files, or packages, are located in the /mnt/cdrom/RedHat/RPMS directory of
    the first two CD-ROMs included with this book. (This is assuming that you have
    mounted the CD-ROM on the /mnt/cdrom directory.) Gnome RPM is a graphical front
    end to RPM that functions as an interface for working with RPMs. The operations
    that you can perform with Gnome RPM are similar to what you can do with the rpm
    command from the command line. You''ll learn the rpm command later in this session.


    To start Gnome RPM, log in as root and then select Main Menu>> Programs>> System>>
    GnoRPM. Figure 23-1 shows the initial Gnome RPM window. Gnome RPM has a standard
    GNOME user interface with a menu bar and a toolbar. The toolbar has buttons for
    common RPM operations: Install a New Package, Query a Package, and Uninstall a
    Package. The tree menu on the left of the window shows the currently installed
    packages organized in a hierarchy of package groups. A package group contains
    a number of RPMs. You can click the plus'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'signs to view the hierarchy. If you click a specific package group, Gnome RPM
    displays all of the packages in that group in the area to the right of the tree
    menu. For example, Figure 23-1 shows the packages in the package group named Desktops.
    As Figure 23-1 shows, the Desktops package group contains the packages that make
    up the GNOME and KDE desktops along with the FVWM and WindowMaker window managers.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_255_0.png)


    You typically select one or more packages and then perform tasks such as installing
    or uninstalling the package; querying the package to see when it was installed
    and finding out which files it contains; or verifying the package to confirm that
    none of the files have changed. To perform these operations, open the package
    group and select the package by clicking the package icon. Then click the Install,
    Uninstall, Query, or Verify button to initiate the operation. Each of these operations
    brings up a window in which Gnome RPM displays relevant information and provides
    buttons through which you can initiate further action. For example, when you query
    a package, Gnome RPM displays the information about that package in a window.
    From the information, you can see when the package was installed, when it was
    built, its size in bytes, a brief description, and what files make up the package
    (including the full pathname of each file). Figure 23-2 shows the query results
    Gnome RPM displays for the db3-utils RPM.


    As you can see in Figure 23-2, the display includes an active URL where you can
    find more information about the db3-utils package. Gnome RPM displays the URL
    as a link that you can click to view that Web page in a Web browser. You can learn
    a lot about a package by browsing the information in the query results.


    To uninstall or remove a package, select the package from the Gnome RPM window
    and click the Uninstall button on the toolbar (see Figure 23-1). Gnome RPM then
    displays a dialog box asking you to confirm if you want to remove the package.
    Click the Yes button to remove the package.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_256_0.png)


    Figure 23-2   Gnome RPM displaying the results of querying the db3-utils RPM


    To install a new package from any one of this book’s companion CD-ROMs, mount
    the CD-ROM by typing mount /mnt/cdrom in a terminal window, and then click the
    Install button on the Gnome RPM toolbar. An empty Install dialog box appears.
    Click the Add button on the Install dialog box. Gnome RPM displays an Add Packages
    dialog box with the contents of the /mnt/cdrom/RedHat/RPMS directory in which
    all of the RPM files are located, as shown in Figure 23-3.


    From this dialog box, you can select packages one by one and click the Add button
    to add them to the list of packages to be installed. Each time you click the Add
    button, the selected package is added to the list in the Install dialog box. When
    you are finished selecting packages, click Close to get rid of the Add Packages
    dialog box. The selected packages appear in the Install dialog box.


    To finish installing the selected packages, click the Install button in the Install
    dialog box. Gnome RPM installs the packages and displays any errors it encounters.
    For example, if the packages are already installed, Gnome RPM displays a message
    that says so.


    Gnome RPM is a handy utility to install, remove, and upgrade various software
    packages for Red Hat Linux. If you want to learn more about Gnome RPM, read the
    online help text by selecting the appropriate item from Gnome RPM’s Help menu.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_257_0.png)


    # Using the rpm Command to Install and Remove Packages


    When you install Red Hat Linux from the companion CD-ROM, the installation program
    uses the rpm command to unpack the RPM files and copy the contents to appropriate
    locations on the disk.


    Although you do not need to understand the internal structure of an RPM file,
    you should know how to use the rpm command to work with RPM files. Specifically,
    you may want to perform one or more of the following tasks with RPMs:


    +   - Query the RPM database to find out the version numbers and other information
    about RPMs installed on your system.


    +   - Install a new software package from an RPM. For example, you have to install
    the source files for the Linux kernel before you can rebuild the kernel.


    +   - Remove (uninstall) unneeded software that you previously installed from
    an RPM. You can uninstall a package to reclaim the disk space if you find that
    you never use the package. Another reason to uninstall RPMs is to remove buggy
    or defective software from your system.


    +   - Upgrade an older version of an RPM with a newer one. You can upgrade after
    you download a new version of a package from Red Hat''s FTP server.


    +   - Verify that an RPM is in working order. You can verify a package to ensure
    that all of the files installed by the RPM are in their correct locations, have
    the proper permissions and ownerships, and whether or not they have been altered.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_257_1.png)'
  merge: -1
  img_proc: true
- pgno: 258
