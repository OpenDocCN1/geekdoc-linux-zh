    # # Performing Basic System Administration Tasks


    # ## Session Checklist


    +   ✓ Understanding Linux system-and-network administration

    +   ✓ Adding user accounts with Linuxconf

    +   ✓ Exploring other Linuxconf features


    This final Saturday morning session introduces you to Linux system and network
    administration. Then you learn to perform some system administration tasks using
    *Linuxconf*, a graphical system administration tool that comes with Red Hat Linux.
    Specifically, you learn how to add user accounts and then you explore other tasks
    that Linuxconf enables you to perform. This overview of Linuxconf should help
    you execute other system administration tasks as the need arises.


    # ### Understanding Linux System and Network Administration


    *System administration* refers to tasks that you must perform to keep a computer
    system up and running properly. Now that almost all computers are networked, another
    set of tasks is needed to keep the network up and running. These tasks are collectively
    called *network administration*. A site with many computers probably has a full-time
    *system administrator* who takes care of all system- and network-administration
    tasks. Very large sites may have separate *system-administration* and *network-administration*
    personnel. If you run Red Hat Linux on a home PC or a few systems in a small company,
    you probably perform the duties of both the *system administrator* and the *network
    administrator*.


    As the following descriptions of system and network administration tasks demonstrate,
    you can perform these tasks using the *Linuxconf* tool — an X Window application
    that enables you to perform most system and network administration tasks without
    having to edit configuration files manually or type cryptic commands. After the
    overview of system and network administration, you learn to use *Linuxconf*.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# System administration tasks


    A system administrator’s typical tasks include the following:


    +   - Installing, configuring, and upgrading the operating system and various
    utilities. You learned how to install Red Hat Linux in Session 1. This session
    shows you how to configure various features or Red Hat Linux, and Sessions 23
    and 27 will show you how to upgrade applications using the Red Hat Package manager.


    +   - Adding and removing users. Later in this session, you learn to use Red Hat’s
    graphical Linuxconf tool to add a new user account. If a user forgets the password,
    you can also change the password using Linuxconf.


    +   - Installing new software. For the typical Linux software, which you get in
    source-code form, this task involves using tools such as gunzip (to uncompress
    the software), tar (to unpack the archive), and make (to build the executable
    programs). For software distributed by Red Hat in Red Hat Package Manager (RPM)
    files, you have to use the rpm command to install the software.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_123_0.png)


    Session 23 shows you how to install RPM packages. In Session 27, you learn how
    to use tools, such as tar and make, to build software packages.


    +   - Making backups. You can use the tar or cpio program to archive one or more
    directories and to copy the archive to a floppy disk (if the archive is small
    enough) or to a tape (if you have a tape drive).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_123_1.png)


    In Session 26, you learn how to back up and restore files.


    +   - Mounting and unmounting file systems. When you want to access the files
    on a CD-ROM, for example, you have to mount that CD-ROM’s file system on one of
    the directories of the Linux file system. You have to use the mount command to
    accomplish this task. You can also use Linuxconf to mount a file system. (An example
    appears later in this session.)


    ![](img/5fe8f856723cde0b366f73584b9e64b8_123_2.png)


    Mounting is covered in Session 7.


    +   - Monitoring the system’s performance. You have to use a few utilities, such
    as top (to see where the processor spends most of its time) and free (to see the
    amount of free and used memory in the system).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_123_3.png)


    You learn to use utilities to monitor system performance in Session 28.'
