    # Editing Text Files in Red Hat Linux


    # Session Checklist


    +   - Using the GUI text editors in GNOME and KDE

    +   - Using the ed and vi text-mode text editors


    In this session, you learn to use the GUI editors and the ed and vi text-mode
    editors. Text editing is an important part of all operating systems, including
    Red Hat Linux, because many system configuration files are text files. In Red
    Hat Linux, you may have to create and edit a variety of text files, such as: system
    configuration files, including /etc/fstab, /etc/hosts, /etc/inittab, and /etc/X11/XF86Config;
    user files, including .newsrc and .bash_profile; mail messages and news articles;
    shell script files; Perl and Tcl/Tk scripts; and C or C++ programs.


    # Text Editing with GUI Text Editors


    Both of the Linux graphical desktops — GNOME and KDE — come with GUI text editors
    (text editors that have graphical user interfaces). To try the GNOME text editor,
    gEdit, select Main Menu➔ Programs➔ Applications➔ gEdit from the GNOME desktop.
    You can open a file by clicking the Open button on the toolbar. This brings up
    the Open File dialog box. You can then change directories and select the file
    to edit by clicking the OK button. The gEdit editor then loads the file in its
    window. You can open more than one file and move among them as you edit the files.
    Figure 8-1 shows a typical editing session with gEdit.


    In this case, the editor has three files — fstab, hosts, and inittab (all from
    the /etc directory) — open for editing. The filenames appear as tabs between the
    toolbar and the editing window. You can switch among the files by clicking the
    tabs with the filenames. The rest of the text-editing steps behave as you would
    expect. To enter new text, click to position the cursor and begin typing. You
    can select text, copy, cut, and paste using the buttons on the toolbar above the
    text-editing area.'
