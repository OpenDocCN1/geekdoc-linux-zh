    # SESSION


    # 24


    # # Building a New Kernel


    # ## Session Checklist


    +   ✓ Installing the source files and rebuilding the kernel

    +   ✓ Configuring the kernel

    +   ✓ Building and installing the kernel and modules

    +   ✓ Rebooting the system with a rebuilt kernel


    At some point, you may want or need to rebuild the kernel — the very core of the
    operating system — from scratch, that is, from the source code. For example, you
    may want to take advantage of a new driver not available in the kernel version
    shipped on the Red Hat Linux CD-ROMs. This session shows you how to install the
    kernel’s source files; how to configure the kernel; and how to build and install
    the new kernel and modules. Finally, you will learn how to reboot the system using
    the newly built and installed kernel.


    10 Min. To Go


    # ## Rebuilding the Kernel


    Rebuilding the kernel refers to creating new versions of the binary files constituting
    the heart of the Linux operating system. You may have to (or want to) rebuild
    the kernel for various reasons, including the following:


    +   ● You can recompile the kernel to support your specific CPU, especially features
    that improve performance. The default Red Hat Linux installation uses a kernel
    configured to run on the widest possible variety of Intel CPUs, all the way back
    to 386s and 486s. As a result, it does not take advantage of all the features
    and improvements available in the newest CPUs.

    +   ● You may want to create a new kernel that includes support for only the hardware
    actually installed on your system. The default kernel supports a wide variety
    of the most common hardware, but no single system needs all of that support.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '+   - If you have a system with hardware not supported when you installed Red
    Hat Linux or for which only experimental support was available, you can rebuild
    the kernel to include that support once it becomes available.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_267_0.png)


    Before you rebuild the kernel, make sure you have the emergency boot floppy that
    you prepared when installing Red Hat Linux (covered in Session 1). If the system
    does not boot after you rebuild the kernel, you can use that emergency boot floppy
    to start the system using a known good kernel.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_267_1.png)


    Never rebuild and install a new kernel without first making sure that you have
    an emergency boot floppy. If you did not create the boot floppy during Red Hat
    Linux installation, use the /sbin/mkbootdisk command to create the boot floppy.
    Type man mkbootdisk to learn the syntax of that command.


    Rebuilding the kernel involves the following steps:


    +   1. Installing kernel source code.

    +   2. Configuring the kernel.

    +   3. Building the kernel.

    +   4. Building and installing kernel modules (if any).

    +   5. Installing the kernel and setting up LILO.


    The rest of this session describes these steps in greater detail.


    # ### Installing the Kernel Source Code


    To rebuild the Linux kernel, you need the kernel source code, which is usually
    not installed. So, follow these steps to install it on your system:


    +   1. Log in as root and insert the Red Hat Linux CD-ROM (disk 2) into the CD-ROM
    drive.

    +   2. Use the mount command to mount the CD-ROM drive on a directory in the file
