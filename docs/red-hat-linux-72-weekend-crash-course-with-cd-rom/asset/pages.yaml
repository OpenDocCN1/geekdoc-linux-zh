    # Exploring Other Linuxconf Features


    Here, you explore the tabs and buttons for the kinds of tasks that Linuxconf can
    perform. This session’s coverage of Linuxconf, however, is far from complete.
    It would take many more pages to cover Linuxconf’s features thoroughly and explain
    each of the tasks it can perform.


    Linuxconf has its own home page on the Web at http://www.solucorp.qc.ca/linuxconf/.
    Visit the home page to learn the latest news about Linuxconf and read online documentation.


    # Help button


    Linuxconf includes a Help button in the main Linuxconf window. This Help button
    provides an overview of Linuxconf. A Help window appears when you click the Help
    button.


    Most Linuxconf windows also include Help buttons that provide context-sensitive
    help—information that relates to the task you are performing. Press the nearest
    Help button to read some relevant information about the task at hand. In a few
    cases, Linuxconf might display a message saying that the help file for that item
    is not written yet.


    # Config, Control, and Status buttons


    In the initial Linuxconf window (refer to Figure 10-1), you should note that there
    are three tabs: Config, Control, and Status. The Config tab enables you to configure
    various system services, and the Control tab allows you to start and stop services
    and control various Linuxconf features. The Status tab enables you to view various
    message logs such as the messages displayed by the Linux kernel as your Red Hat
    Linux system boots.


