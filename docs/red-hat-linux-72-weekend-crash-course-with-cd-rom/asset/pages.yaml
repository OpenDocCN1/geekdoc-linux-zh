- pgno: 304
  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_304_0.png)\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_304_1.png)\n\
    \n# Monitoring System Performance\n\n+   ### Session Checklist\n+   \n+   - Using\
    \ the top utility\n+   - Using the GNOME System Monitor\n+   - Using the vmstat\
    \ utility\n+   - Checking disk performance and usage\n+   - Exploring the /proc\
    \ file system\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_304_2.png)\n\n**A**\
    \ key system administration task is keeping track of how well your Red Hat Linux\
    \ system performs. You can monitor the overall performance of that system by gathering\
    \ information such as central processing unit (CPU) usage, physical memory usage,\
    \ virtual memory (swap space) usage, and hard disk usage. Red Hat Linux comes\
    \ with a number of utilities that you can use to monitor one or more of these\
    \ performance parameters. This session introduces you to a few of these utilities\
    \ and explains the information presented by these utilities.\n\n# ### Using the\
    \ top Utility\n\nTo view the top, or most frequently used CPU processes, you can\
    \ use the top program. To start that program, type top in a terminal window or\
    \ text console. The top program then displays a text screen listing the current\
    \ processes, arranged in descending order of CPU usage. The program also shows\
    \ other information such as memory and swap space usage. Figure 28-1 shows typical\
    \ output from the top program."
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_305_0.png)


    # Figure 28-1 Viewing top CPU processes


    The top utility updates the display every five seconds. You can keep top running
    in a window so that you can monitor the status of your Red Hat Linux system continuously.
    You quit top by pressing q or by closing the terminal window.


    The first five lines of the output screen provide summary information about the
    system. Here is what these five lines show:


    +   1. The first line shows the current time, how long the system has been up,
    how many users are logged in, and three load averages (the average number of processes
    ready to run during the last 1, 5, and 15 minutes).


    +   2. The second line lists the total number of processes and the status of these
    processes.


    +   3. The third line shows CPU usage — what percentage of CPU time user processes
    employ, what percentage system (kernel) processes use, and what percentage of
    time the CPU is idle.


    +   4. The fourth line shows how the physical memory is being used. This includes
    the total amount of memory, how much is used, how much is free, how much is shared,
    and how much is allocated to buffers for reading from disk, for instance.


    +   5. The fifth line shows how the virtual memory or swap space is being used.
    This includes the total amount of swap space, how much is used, how much is free,
    and how much is cached.


    In top’s output screen (refer to Figure 28-1), the table below the summary information
    lists information about the current processes, arranged in decreasing order of
    CPU time usage. Type man top in a terminal window to learn the meanings of the
    column headings in the table that top displays.


    > If the RSS field is drastically smaller than the SIZE field for a process, it
    means that the process employs too little physical memory compared with what it
    needs. This means that the process is doing a lot of swapping as it runs. You
    can use the vmstat utility (which you try later in this session) to find out how
    much your system is swapping.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Using the GNOME System Monitor


    Like the text-mode top utility, the **GNOME System Monitor** tool also enables
    you to view the system load in terms of the number of processes that are currently
    running, their memory usage, and the free disk space on your system. To run the
    tool, select *Main Menu* *Programs* *System* *System Monitor*. You can also start
    the tool by typing gtop in a terminal window. The tool starts and displays its
    output in the Processes tab of its main window, as shown in Figure 28-2.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_306_0.png)


    This output resembles what you see when you type top in a text-mode console or
    a terminal window. In fact, the column headings in the table match what the top
    utility uses in its output. As with the text-mode top utility, the display keeps
    updating to reflect the current state of the system. You see the current processes
    in descending order of CPU usage.


    The **GNOME System Monitor** window has two more tabs that display the memory
    usage and the free space on the file system. To view this information, click the
    appropriate tab. For example, to see how various processes are using memory, click
    the **Memory Usage** tab.


    The bottom of the window shows the CPU usage summary, system up time (how long
    the system has been up and running), and load averages (the average number of
    processes ready to run in the last 1, 5, and 15 minutes).


    The load average gives you an indication of how busy the system is. In addition
    to the top and GNOME System Monitor programs, you can also get the load average
    with the *uptime* command, as follows:


    ```

    uptime

    11:40am up 2 days,  57 min,   3 users,  load average:  0.13,  0.23,  0.21

    ```


    The output shows the current time, how long the system has been up, the number
    of users, and the three load averages. Load averages greater than 1 imply that
    multiple processes are competing for the CPU time simultaneously.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# ## Using the vmstat Utility


    You can get summary information about the overall system usage with the vmstat
    utility. To view system usage information averaged over five-second intervals,
    type the following command (the second argument indicates the total number of
    lines of output vmstat should display):


    ```

    ```text

    vmstat 5 8

