  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_296_0.png)\n\n# Building Software\
    \ Packages from Source Files\n\n# Session Checklist\n\n+   \n+   1. Downloading\
    \ and unpacking software\n+   2. Building and installing software from source\
    \ files\n+   \n\n![](img/5fe8f856723cde0b366f73584b9e64b8_296_1.png)\n\nIn Session\
    \ 23, you learned how to install software packages distributed in the Red Hat\
    \ Package Manager (RPM) format. RPM files bundle all the executable binary files\
    \ and configuration files needed to install a software package. However, many\
    \ open source software packages are distributed in source code form without any\
    \ executable binaries. Before you can use such software, you have to build the\
    \ executable binary files and then follow some instructions to install the package.\
    \ This session shows you how to download and unpack the source files. It then\
    \ shows you how to build software packages from source files and install them.\n\
    \n# Downloading and Unpacking the Software\n\nOpen source files are typically\
    \ distributed in compressed tar archives. As you learned in Session 26, the tar\
    \ program creates these archives and then the gzip program compresses them. The\
    \ distribution is in the form of a single large file with a .tar.gz or .tar.Z\
    \ extension, which is often referred to as a compressed or gzipped tarball. If\
    \ you want the software, you have to download the compressed tarball and unpack\
    \ it.\n\nYou download the compressed tar file using anonymous File Transfer Protocol\
    \ (FTP) or the Web browser. Typically, this action involves no more effort on\
    \ your part than clicking a link and saving the file in an appropriate directory\
    \ on your system.\n\nTo try your hand at downloading and building a software package,\
    \ you can practice on the X Multimedia System (XMS), which is a graphical X application\
    \ for playing MP3 files and other multimedia files. XMS is bundled with Red Hat\
    \ Linux and installed on your system when you select the Multimedia Support package\
    \ group during Red Hat Linux installation. However, there is no harm in downloading\
    \ and rebuilding the XMS package again."
  merge: -1
  img_proc: true
- pgno: 297
  md: 'You can access the source files for XMMS from http://www.xms.org/download.html
    in the form of a compressed tar archive. You can also download the files from
    the xms1.0 directory of the anonymous FTP server (ftp.xms.org).


    # Try downloading the XMMS source files from the anonymous FTP server so you know
    how to access files manually.


    Before attempting to download a file from an FTP server, make sure that your Linux
    system is connected to the Internet. You should also change the directory to the
    location where you want to store the downloaded file (although you can always
    move the file after downloading). You may want to log in as root and change the
    directory to /usr/local before typing the ftp command. If you use the GNOME or
    KDE desktop, type these commands from a terminal window.


    # Downloading the software


    Here is a sample session that you can use as a guideline when you download the
    compressed tar file for XMMS from the anonymous FTP server. Typed lines appear
    in bold text.


    ```

