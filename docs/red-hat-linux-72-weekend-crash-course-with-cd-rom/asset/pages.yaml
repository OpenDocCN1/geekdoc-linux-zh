    \  If you wish, provide the additional information requested in the next dialog\
    \ box. Doing so is optional, though. Click the **Next** button to continue.\n\
    +   \n+   5.  The following dialog box allows you to name the system profile.\
    \ The default name is your system’s host name. This dialog box also shows the\
