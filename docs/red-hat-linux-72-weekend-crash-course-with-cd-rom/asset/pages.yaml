    \ options. The next few sections give you a brief introduction to the *rpm* command.\n\
    \n> If you ever forget the **rpm options**, type the **rpm --help | more** command\
    \ to see a list of its command-line options. The **number of options** *rpm* has\
    \ will amaze you!\n\n# ## Understanding *RPM* filenames\n\nAn **RPM** is a kind\
    \ of **archive** — a file that contains many other files. Even though an **RPM**\
    \ contains multiple files, it appears as a single file on your Red Hat Linux system.\
    \ **RPM builders** (the people who package software into **RPMs**) commonly follow\
    \ a standard, or, more accurately, a convention that defines the structure of\
