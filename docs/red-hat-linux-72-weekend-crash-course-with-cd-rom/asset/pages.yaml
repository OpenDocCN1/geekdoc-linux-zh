- pgno: 226
  md: '# Using the Red Hat Update Agent


    Once you have activated your Software Manager subscription, you can use the Update
    Agent to download and install the latest updates and security fixes. Start the
    Update Agent by log-ging in as root, and selecting Main Menu→ Programs→ System→
    Update Agent on the GNOME desktop. When prompted to do so, click Yes to import
    the Red Hat PGP key (see Figure 20-9).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_226_0.png)


    When you see the Welcome screen, click the Next button to continue. If you are
    con-nected to the Internet, the Update Agent compares the installed packages to
    the latest available patches. After a few moments, you will see a screen resembling
    Figure 20-11. It shows all of the available software updates based on what is
    currently installed on your system.


    You can check the Select All Packages checkbox to install all of the new packages
    or scroll through the list and select packages individually. After making your
    selections, click the Next button to start the download. A dialog box will show
    the download’s progress for each package selected and the overall progress of
    the update.


    After the Update Agent downloads the selected packages, click the Next button
    to install them. Once the installation is complete, click the Next button to show
    a dialog box listing the packages that were just installed (see Figure 20-11).
    After reviewing the list, click the Finish button to close the dialog box and
    end the Update Agent session.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_227_0.png)


    Figure 20-10 *The Update Agent lists the upgrades available for your system.*


    # ### Troubleshooting


    When you click Yes to import the Red Hat public key, the Update Agent may not
    continue. Simply restart the Update Agent after importing the public key to restart
    the update process.


    If the Update Agent starts but displays an error message that it is not configured
    properly, log into the Red Hat Network and activate your Software Manager subscription.
    The Update Agent requires a valid Software Manager subscription in order to function.


    If the Update Agent does not show all of the RPMs installed on your system, log
    in as root, open a terminal window, and execute the command `up2date -p` to synchronize
    the system profile with the list of packages installed and maintained by the RPM
    database.'
  merge: -1
  img_proc: true
