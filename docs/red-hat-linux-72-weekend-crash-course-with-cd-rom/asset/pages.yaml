    # ### Troubleshooting


    In rare cases, top, gtop, or vmstat may not work. This usually happens when the
    /proc file system is not mounted because all three utilities use some of the files
    in /proc to display their reports. If this happens, reboot your system after shutting
    it down properly, of course. If you are having trouble viewing a file in /proc,
    it may be because you do not have read permissions on the file. Not all files
    in the /proc file system are world-readable, so use su to become the root user
    before looking at the file.


    Similarly, disk usage statistics from the du command require read access to files
    and execute permissions for directories. If you try to use du on directories or
    files to which you do not have access, you will get an error message and the report
    it displays will not be accurate. Again, become the root user using the su command
    to solve the problem.


    Finally, if hphram does not seem to be working, keep in mind that it requires
    root access because it accesses hardware directly.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_312_0.png)


