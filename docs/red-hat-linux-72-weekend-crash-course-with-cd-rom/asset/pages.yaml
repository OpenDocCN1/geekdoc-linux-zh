- pgno: 18
  md: '# Introduction


    Because of Linux''s increasing popularity, many computer users want to learn it
    quickly. Red Hat Linux is the dominant Linux distribution used in businesses large
    and small. If you work for an organization that is interested in Red Hat Linux,
    you need to get up to speed on how to install, configure, use, and manage Red
    Hat Linux systems. The best way to do so is to install Red Hat Linux and interactively
    learn its commands and applications. What potential Linux aficionados—beginners
    to advanced ones alike—need is a well-organized set of sessions that teach them
    Red Hat Linux over a weekend. This *Red Hat Linux 7.2 Weekend Crash Course* is
    such a teaching guide. It provides 30 easy-to-use sessions, each a half an hour
    long, that gradually build up your Linux skills. These sessions are designed for
    you to complete over a weekend. They start with Red Hat Linux installation on
    Friday evening and end with several system administration topics on Sunday afternoon.


    The crash course''s pace is fast. Each session starts with a "Session Checklist,"
    which is a short list of topics that you learn within the session through hands-on
    exercises. Each session ends with a "Quiz Yourself" section that enables you to
    test your new skills by answering some questions. Each major part corresponds
    with a time during the weekend, and the book includes Part Review questions that
    cover what was taught in the sessions within that part. You can try answering
    the Part Review questions and check your answers in Appendix A.


    This book includes CD-ROMs with the latest version of Red Hat Linux. You can install
    Red Hat Linux by following the instructions in Sessions 1 through 3, and then
    you can use the program throughout the rest of the book.


    # What You Need to Get Started


    To start the sessions, you need a PC on which you can install Red Hat Linux. The
    minimum system requirements for the PC are Intel 486 or Pentium-compatible processor,
    32 MB RAM, 1 GB of disk space, 3.5-inch floppy drive, and a CD-ROM drive. For
    some of the other sessions, you need an Ethernet networking card, a modem, and
    Internet access. You also need a free weekend to go through all the sessions.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # Organization of the Book


    Red Hat Linux 7.2 Crash Course has 30 sessions, organized into six parts. It also
    has two appendices.


    +   * Part I: Friday Evening guides you through the steps needed to install Red
    Hat Linux from this book’s companion CD-ROMs and gets you through the first login
    to the newly installed system. Assuming that the installation program recognises
    most of the hardware, you should be able to finish the installation in an hour
    or so.


    +   * Part II: Saturday Morning focuses on trying out Red Hat Linux quickly, customizing
    the GNOME and KDE graphical environments, exploring files and directories, learning
    some Linux commands and text editors, and performing some basic system administration
    tasks


    +   * Part III: Saturday Afternoon shows you how to set up networking (assuming
    the PC has an Ethernet card) and connect the Linux PC to the Internet (dial-up
    PPP, but briefly discusses xDSL and cable modem as well). Some of the lessons
    show how to use the Linux system in a networked environment as an Internet server
    (Web, e-mail) or as a Windows file server that uses Samba.


    +   * Part IV: Saturday Evening teaches you how to use the GNOME and KDE desktops
    as well as some of the applications that come bundled with Red Hat Linux.


    +   * Part V: Sunday Morning introduces you to various system administration tasks,
    such as configuring X, learning the Linux boot sequence, installing new software
    packages from RPM and tar files, building a new kernel, scheduling jobs to run
    at specific times, and performing system backups.


    +   * Part VI: Sunday Afternoon focuses on skills that a Linux system administrator
    should have. The afternoon starts with a lesson on how to use the programming
    tools to compile and build a new software package. Then it covers system performance
    monitoring, security, and obtaining further help.


    Appendix A: Answers to Part Reviews provides answers to the Part Review Questions
    that appear after each of the six parts.


    Appendix B: What’s on the CD-ROM? describes the contents of the accompanying CD-ROMs.


    If you are a new user, you should start with Part I, which covers the installation
    of Red Hat Linux from the CD-ROM. Then you can continue sequentially through the
    sessions. If you already installed Red Hat Linux, skip to Part II on Saturday
    morning.


    # # Conventions Used in This Book


    Red Hat Linux 7.2 Weekend Crash Course uses a simple notational style. All listings,
    file-names, function names, variable names, keywords, and Web addresses are typeset
    in a monospace font for ease of reading. The first occurences of new terms and
    concepts are in *italics*. Text that you are directed to enter is in **bold and
    monospace type combined**.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# **Sidebars**


    Occasionally, we use sidebars to highlight interesting (but not critical) information.
    Sidebars explain concepts you may not have encountered before or give a little
    insight into a related topic. If you''re in a hurry, you can safely skip the sidebars.
    On the other hand, if you find yourself flipping through the book looking for
    interesting information, we encourage you to read the sidebars.


    The following icons help you quickly pinpoint useful information:


    ![](img/5fe8f856723cde0b366f73584b9e64b8_20_0.png)


    The **Note icon** marks a general, interesting fact—something that we thought
    you''d like to know.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_20_1.png)


    The **Tip icon** marks shortcuts or methods that you can follow to make your job
    easier.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_20_2.png)


    The **Never icon** highlights potential pitfalls. With this icon, we are telling
    you: "Watch out! This could hurt my system!"


    ![](img/5fe8f856723cde0b366f73584b9e64b8_20_3.png)


    The **Cross-Reference icon** points out *other sessions* in the book that discuss
    a specific topic—or to specific programs available on the CD-ROMs.


    Each session also contains four time-oriented icons that let you know how you
    are progressing:


    ![](img/5fe8f856723cde0b366f73584b9e64b8_20_4.png)


    # **Reach Out**


    The publisher and authors would like your feedback. After you have had a chance
    to use this book, please take a moment to register this book on the http://my2cents.
    1dgbbooks.com Web site.


    Also, feel free to contact us directly at:


    naba@ieee.org

    kwal@kurtwerks.com'
