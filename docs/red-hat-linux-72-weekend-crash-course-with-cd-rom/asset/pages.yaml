- pgno: 70
  md: '# SESSION 5


    ![](img/5fe8f856723cde0b366f73584b9e64b8_70_0.png)


    # Exploring Linux Files and Directories


    # Session Checklist


    +   - Understanding the Linux file system

    +   - Using the Nautilus file manager

    +   - Navigating and manipulating files and directories with Linux commands


    In Friday night''s sessions, you installed Red Hat Linux, learned how to log in,
    log out, how to shut down your Red Hat Linux system, and how to perform basic
    desktop customizations. This morning''s sessions push deeper into Linux, starting
    with an introduction to the Linux file system followed by an explanation of how
    to use the Nautilus file manager. This session also teaches you several Linux
    commands that work with files and directories.


    # Understanding the Linux File System


    Like other operating systems, Linux organizes information in files that are contained
    in directories. In Linux, a directory is just a special file that can contain
    other files and directories, resulting in a hierarchical structure. This hierarchical
    organization of files is called the file system.


    The Linux file system provides a unified model of all storage in the system. The
    file system has a single root directory, indicated by a forward slash (/). A hierarchy
    of files and directories grows from the root directory. Parts of the file system
    can reside in different physical media such as a hard disk, a floppy disk, and
    a CD-ROM. Figure 5-1 illustrates the concept of the Linux file system and how
    it spans multiple physical devices.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_70_1.png)


    Unix has no concept of drive letters, in contrast to MS-DOS and Windows 95/98/ME/NT/2000.
    Also note that Linux filenames are not restricted to a strict 8.3 name-extension
    format. The term 8.3 filename comes from MS-DOS’s use of an eight-character name
    and three-character extension.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_71_0.png)


    Figure 5-1  The Linux file system provides a unified view of storage that may
    span multiple drives.


    In Linux, you can have long filenames (up to 256 characters) and filenames are
    case-sensitive. Often, UNIX filenames have multiple extensions such as sample.tar.Z.
    Here are some examples of UNIX filenames: Index.html, Makefile, kernel-2.2.15-2-5.0.1686.rpm,
    .bash_profile, and httpd.src.tar.gz.


    To locate a file, you need more than just the file’s name; you also need information
    about the directory hierarchy. The term pathname refers to the complete specification
    necessary to locate a file—the complete hierarchy of directories leading to the
    file—which includes the filename. Figure 5-2 shows a typical Linux pathname for
    a file.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_71_1.png)


    Figure 5-2  A typical Linux pathname


    As you can see from Figure 5-2, a complete Linux pathname consists of the following
    parts:


    +   • The root directory, indicated by a forward slash (/) character.

    +   • The directory hierarchy, with each directory name separated from the previous
    one by a forward slash (/) character. A / appears after the last directory name.

    +   • The filename, with a name and one or more optional extensions.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Now that you know the basics of the Linux file system, you can access the files
    and directories in two ways:


    +   • Use a graphical file manager in the GNOME or KDE desktop.

    +   • Type appropriate Linux commands in a terminal window or text console.


    Graphical file managers resemble Windows Explorer and are easy to use. Because
    the file managers for GNOME and KDE are very similar, we will only cover the former
    in this session.


    # Using the Nautilus File Manager


    After you log into your Red Hat Linux system from the graphical login screen,
    you can view your home directory with the Nautilus file manager by double-clicking
    on the house icon on the desktop. Figure 5-3 shows the initial display of a sample
    home directory. Your home directory should look similar.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_72_0.png)


    # Viewing files with Nautilus file manager


    The right side of the Nautilus file manager''s window shows the files and directories
    in the currently selected directory as icons. As you can see in Figure 5-3, Nautilus
    shows the contents of the /home/kwall directory. The Location bar shows the name
    of the currently selected directory. To see a tree view of the entire file system,
    click the Tree tab in the small pane on the left-hand side of Nautilus'' window.
    The result display should resemble Figure 5-4.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_73_0.png)


    *Figure 5-4  Nautilus shows a tree view of the entire file system, much like Windows
    Explorer.*


    If you have used Windows Explorer, you will find the Nautilus file manager familiar.
    To view the contents of another directory, first locate the directory in the tree
    view. For example, to view the `/etc/X11` directory, click the arrow next to the
    `etc` directory. This causes Nautilus to display the subdirectories in `etc` and
    change that plus sign to a minus sign. Then click the X11 directory. The right-hand
    side of the window now shows the contents of the `/etc/X11` directory. Different
    files have different icons. Ordinary files appear as a sheet of paper. Directories
    appear as folders.


    The Nautilus file manager window has the usual menu bar and a toolbar. Notice
    that, in Figure 5-3, the toolbar drop down labeled View as Icons is pressed. That
    means the directory contents are displayed using large icons. You can select the
    View as List option from this drop down box to cause Nautilus to display the contents
    using smaller icons in a list format.


    # Performing tasks with Nautilus file manager


    In addition to moving around the file system and viewing contents of directories,
    you can use the file manager to perform tasks such as relocating a file from one
    directory to another and deleting a file. We don''t show you each and every step,
    but you can take a few moments to try the following tasks.


    +   * **Moving a file to a different directory:** Left-click on its icon and then
    drag-and-drop it on the directory where you want the file.

    +   * **Copying a file to a new location:** Select the file''s icon and then choose
    File Copy. You may also right-click the mouse on the file''s icon and select Copy
    from the pop-up menu. A dialog box prompts you for the name of the directory to
    which the file should be copied.


    20 Min.  To Go'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   • **Deleting a file or directory:** Right-click the icon and select Delete
    from the pop-up menu. A dialog box asks you to confirm if you really want to delete
    the file or directory. You can click Yes to delete the selected item or click
    No to cancel the operation.

    +   • **Renaming a file or a directory:** Click the name in the Icon view (refer
    to Figure 5-3). Then you can type the new name or edit the name.

    +   • **Creating a new directory:** Right-click in an empty area of the right-hand
    window and select New Directory from the pop-up menu. A dialog box prompts you
    for the name of the new directory.

    +   • **Finding files:** Select Commands > Find Files from the menu bar. A dialog
    box prompts you for what you want to find and where to start the search. After
    you enter this information, click OK to start the search. The results of the search
    appear in a new window.


    # Navigating and Manipulating Files and Directories with Linux Commands


    Although the graphical file managers are easy to use, you can employ them only
    if X Window is running. Sometimes you may not have a graphical environment in
    which to run a graphical file manager. For example, you might be logged in through
    a text terminal or X might not work on your system. In these situations, you have
    to rely on Linux commands to work with files and directories. The nice part is
    that you can always use Linux commands — even in the graphical environment. All
    you have to do is open a terminal window and type the Linux commands. Click the
    terminal icon in the GNOME panel to start a terminal emulation program that displays
    a terminal window.


    # Directory navigation


    In Linux, your home directory is /root when you log in as root. For other users,
    the home directory is usually the /home directory. The sample home directory (when
    the user logs in as kwall) is /home/kwall. This information is stored in the /etc/passwd
    file. By default, besides the super user, you are the only user with permission
    to save files in your home directory and to create subdirectories in your home
    directory to further organize your files.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_74_0.png)


    Linux supports the concept of a current directory, which is where all file and
    directory commands operate. For example, after you log in, your current directory
    is the home directory. To see the current directory from the terminal window,
    type the pwd command. To change the current directory, use the cd command. To
    change the current directory to /usr/share/doc, type the following:


    ```

    cd /usr/share/doc

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Then, to change the directory to the bash-2.04 subdirectory in `/usr/share/doc`,
    type this command:


    ```

    cd bash-2.04

    ```


    Now, if you use the pwd command it shows `/usr/share/doc/bash-2.04` as the current
    directory. Therefore, you can refer to a directory''s name in two ways:


    +   - *Absolute pathname* (such as `/usr/share/doc`), which specifies the exact
    directory in the directory tree.

    +   - *Relative directory name* (such as `bash-2.04`), which represents the bash-2.04
    subdirectory of the current directory.


    If you type `cd bash-2.04` in `/usr/share/doc`, the current directory changes
    to `/usr/share/doc/bash-2.04`. However, the same command in `/home/naba` tries
    to change the current directory to `/home/naba/bash-2.04`, which probably does
    not exist. Incidentally, typing the `cd` command without any arguments changes
    the current directory to your home directory.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_75_0.png)


    > You can use a shortcut to refer to any user''s home directory. Prefix a user''s
    login name with a tilde (~) to refer to that user''s home directory. Therefore,
    ~kwil refers to the home directory of the user kwil1 and root refers to the home
    directory of the root user. If your system has a user with the login name emily,
    you can type cd ~emily to change to Emily''s home directory.


    The directory names . and ... have special meanings. A single period (.) refers
    to the current directory, whereas two periods (...) refer to the parent directory.
    If the current directory is `/usr/share/doc`, for example, you can change the
    current directory to `/usr/share` by typing this command:


    ```

    cd ...

    ```


    This command takes you up one level in the directory hierarchy.


    # **Directory listings and permissions**


    As you move around the Linux directories, you may want to know their contents.
    You can get a directory listing by typing the ls command. By default, the ls command—without
    any options—displays the contents of the current directory in a compact, multicolumn
    format. For example, type the following commands to see the contents of the /etc/X11
    directory. (Type the commands shown in bold text; the command prompts are not
    included in the listing.)


    ```

    **cd /etc/X11**


    ls

    ```


    applink      lbxproxy     rstart    xdm      XftcConfig    Xmodmap

    fs           pprefdm      twm       XF86Config xinit       xserver

    gdm         proxyngmr    X         XF86Config X kbxy      xsm


    From this listing, you can''t tell whether an entry is a file or a directory.
    To distinguish the directories from the files, use the -F option with ls as follows:'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_76_0.png)


    The -F option causes ls to append a character to the end of certain files that
    indicates their type. For example, directory names have a slash ( / ) appended
    to them. Plain filenames appear as is. An at sign ( @ ) indicates that a file,
    such as xkb in the listing, is actually a link to another file.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_76_1.png)


    A link is a filename that refers to another file. It''s like a shortcut in Windows.


    An asterisk ( * ) is appended to executable files (for example, the prefdm file
    in the listing).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_76_2.png)


    The exact files you see may vary slightly depending on the kind of installation
    you performed during Friday night''s session.


    You can see even more detailed information about the files and directories with
    the - l option:


    ```

    ls -l

    ```


    For the /etc/X11 directory, a typical output from ls -l looks like the following:


    ![](img/5fe8f856723cde0b366f73584b9e64b8_76_3.png)


    This listing shows considerable information about each directory entry, which
    can be a file or another directory. Looking at a line from the right column to
    the left, you see that the rightmost column shows the name of the directory entry.
    The date and time before the name shows its MTime, when it was last modified.
    The file size, in bytes, appears before the MTime.


    The file''s group and owner appear to the left of the file size column. The next
    number to the left indicates the number of links to the file or, if the entry
    is a directory, the number of files it contains (including . and .. ). Finally,
    the leftmost column shows the file''s permission settings, which control who can
    read, write, or execute the file. The very first letter of the permission setting
    has one of the following special meanings:


    +   - If the first letter is l, the file is a symbolic link to another file.

    +   - If the first letter is d, the file is a directory.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   * If the first letter is a dash (-), the file is a normal file.

    +   * If the first letter is b, the file represents a block device such as a disk
    drive.

    +   * If the first letter is c, the file represents a character device such as
    a serial port or a terminal.


    After that first letter, the leftmost column shows a sequence of nine characters
    that appears as **rwxrwxrwx** when each letter is present. Each letter indicates
    a specific permission: read (r), write (w), and execute (x). A hyphen (-) in place
    of a letter indicates no permission for a specific operation on the file. Thus,
    the string **rw- ** means that the owner has read and write permission, but no
    execute permission. Think of these nine letters as three groups of three letters
    (rwx), interpreted as follows:


    +   * The leftmost group of **rwx** controls the read, write, and execute permission
    of the file''s owner.

    +   * The middle three **rwx** letters control the read, write, and execute permission
    of any user belonging to that file''s group.

    +   * The rightmost group of **rwx** letters controls the read, write, and execute
    permission of all other users (collectively referred to as the world).


    Thus, a file with the permission setting **rwx------- ** is accessible only to
    the file''s owner. Meanwhile, the permission setting **rwxr-r--- ** makes the
    file readable by the world.


    > Note  Typically, executable programs (including shell programs) have execute
    permission. However, for directories, the execute permission is equivalent to
    a use permission—a user must have execute permission on a directory to list its
    contents.


    An interesting feature of the **ls** command is the fact that it does not list
    any file whose name begins with a period. Such files are called *hidden files*
    or *dot files* because their names begin with a dot (.). To see these files, you
    must use the **ls** command with the -a option as follows:


    ```

    ls -a

    ```


    # File manipulation


    You might want to copy files from one directory to another. To do so, use the
    **cp** command to perform this task. The **cp** command makes a *new copy* of
    a file, leaving the original intact. To copy the file **/etc/X11/R6/lib/X11/xinit/Xclients**
    to the **Xclients.sample** file in the current directory (such as your home directory),
    type the following:


    ```

    cp /usr/X11R6/lib/X11/xinit/Xclients Xclients.sample

    ```


    If you want to copy a file to the current directory and retain the same name,
    use a period (.) as the second argument of the **cp** command. Thus, the following
    command copies the **XF86Config** file from the **/etc/X11** directory to the
    current directory (denoted by a single period):


    ```

    cp /etc/X11/XF86Config .

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Another Linux command, mv, moves a file to a new location. The original copy
    is gone, and a new copy appears at the specified destination. You can use mv to
    rename a file. If you want to change the name of today.list to old.list, use the
    mv command as follows:


    `mv today.list old.list`


    On the other hand, you can move the today.list file to a subdirectory named saved
    with this command:


    `mv today.list saved`


    Another common file operation is deleting a file. Use the rm command to delete
    a file named old.list, for example, by typing the following command:


    `rm old.list`


    ![](img/5fe8f856723cde0b366f73584b9e64b8_78_0.png)


    > Be careful with the rm command, particularly when you log in as root.

    > Inadvertently deleting important files with rm is very easy.


    In addition to copying, renaming, and deleting files, you may want to view a file’s
    contents. Use the more command to look at a text file one page at a time. To view
    the file /etc/X11/XF86Config-4, for example, use this command:


    `more /etc/X11/XF86Config-4`


    The more command pauses after each page, so you have to press the spacebar to
    move to the next page. Press Enter to move forward one line at a time in the file.
    To move to the previous page, press b.


    Another useful Linux command for file viewing is less. The name is a play on words
    because less does more than more, that is, less has a richer set of features for
    viewing files than does more.


    # Directory manipulation


    To organize files in your home directory, you have to create new directories or
    subdirectories. Use the mkdir command to create a directory. For example, to create
    a directory named images in the current directory, type the following:


    `mkdir images`


    After you create the directory, you can use the cd images command to change to
    that directory.


    When you no longer need a directory, use the rmdir command to delete it. You can
    delete a directory only when the directory is empty.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_78_1.png)


    > To delete a directory and its file simultaneously, use the rm command’s recursive
    option, -r. So, to delete the images directory and all of its files with a single
    command, type rm -r images.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# File and directory finder


    Finally, you should know about the find command because it’s very useful for locating
    files (and directories) that meet specified search criteria. The Linux version
    of the find command comes from GNU, and it has more extensive options than the
    standard UNIX version. However, we show the syntax for the standard UNIX find
    command because that syntax works in Linux and you can use the same format on
    other UNIX systems.


    Suppose that you want to find any file or directory with a name that starts with
    gnome. You can use find to perform this search, as follows:


    ```

    find / -name *gnome* -print

    ```


    This command tells find to start at the root directory (/), look for filenames
    that match gnome*, and display the full pathname of any matching files.


    You can use variations of this simple form of find to locate a file in any directory
    (as well as subdirectories contained in the directory). If you forget where in
    your home directory you stored all files that start with the string report*, you
    can search for the files using the following command:


    ```

    find ~ -name *report* -print

    ```


    When you become comfortable with the syntax of find, you can use its other options.
    For example, to find only specific types of files (such as directories), use the
    -type option. The following command displays all top-level directory names in
    your Linux system:


    ```

    find / -type d -maxdepth 1 -print

    ```


    The preceding example uses the simple form of the find command. You probably do
    not have to use the complex forms of find in a typical Linux system, but you can
    look up the rest of the find options by using this command:


    ```

    man find

    ```


    # Troubleshooting


    If you cannot move, rename, or delete a file, use the ls -l command to verify
    that you have permissions to do so.


    If you receive an error message resembling rmdir: ‘dirname’; directory not empty
    when using rmdir to delete a directory, either delete the files in the directory
    before retrying the rmdir command or use rm -r to delete the directory and its
    contents. For example,


    ```

    $ rmdir images

    rmdir: ''images'': directory not empty

    $ rm -r images

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: "A common question is how to delete a file whose name begins with a minus (-).\
    \ Suppose, for example, a file in your home directory is named `-foo. The command\
    \ `rm -foo` fails and generates the following error:\n\n```\n$ rm -foo\ncorm:\
    \ invalid option - o\n```\n\nThis problem occurs because most Linux commands interpret\
    \ a minus sign followed by a letter as a command option, and anything following\
    \ that as an argument to the command. So, the argument to the `rm` command, `-foo`,\
    \ looks like invalid syntax, not a filename. The solution is to use two minus\
    \ signs (-- ) between `rm and `-foo`. Most Linux commands interpret two minus\
    \ signs standing alone as the end of all options; everything afterward is interpreted\
    \ as an argument. So, to remove that file named `-foo`, try `rm -- -foo,` as follows:\n\
    \n```\n$ rm -- -foo\n```\n\n# REVIEW\n\nThis session began with a brief introduction\
    \ to the Linux file system and discussed how files are named. It then showed you\
    \ how to use the Nautilus file manager to navigate the file system and look at\
    \ different views of directories. You also performed some basic operations such\
    \ as copying files, deleting files, and creating new directories. Next, you learned\
    \ a number of Linux commands for navigating the file system and manipulating files\
    \ and directories. Finally, you learned a few troubleshooting tips.\n\n# QUIZ\
    \ YOURSELF\n\n+   1. What is a pathname? (See “Understanding the Linux File System.”)\n\
    +   \n+   2. In the Nautilus file manager, how do you sort the list of files and\
    \ directories alphabetically by name? (See “Using the Nautilus File Manager.”)\n\
    +   \n+   3. What Linux command do you use to change quickly from the current\
    \ directory to your home directory? (See “Directory navigation.”)\n+   \n+   4.\
    \ What option can you use with the `ls` command to view all files and see the\
    \ directory names listed with a / suffix? (See “Directory listings and permissions.”)\n\
    +   \n+   5. Which Linux command finds all files named COPYING starting in the\
    \ `/usr/doc` directory? (See “File and directory finder.”)"
  merge: -1
