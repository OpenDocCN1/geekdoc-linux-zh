  md: '27


    # Logging In


    You can log in using any of the accounts, including root, which you define during
    the installation. For example, to log in as the user bubba, type bubba (move the
    mouse over the login window before you begin typing) in the text field and press
    Enter. Then type bubba’s password, which you provided during installation (if
    you added accounts in addition to the root account), and you eventually see a
    screen resembling that shown in Figure 3-2).


    ![](img/5fe8f856723cde0b366f73584b9e64b8_48_0.png)


    Figure 3-2 *Initial GNOME desktop after logging in as a normal (non-root) user*


    You will explore the GNOME desktop in a few minutes. For now, I want to show you
    how to log out and shut down your Linux system.


    # Logging Out


    Before you explore the GNOME GUI, you should learn how to log out. To do so, select
    Main menu—the stylized fruit icon at the left edge of the GNOME Panel in the GNOME
    desktop (see Figure 3-2)—and then select Log Out from the menu. (The GNOME Panel
    is discussed later in this session under “Exploring GNOME.”) The screen grays
    out and a dialog box prompts to see if you really want to log out and also to
    give you the option to halt or reboot the PC. Click the Yes button to log out.
    After a few moments, the graphical login screen (Figure 3-1) appears so that another
    user (or you again) can log in and use the system.


    # Understanding Window Managers


    X Window, unlike other OS GUIs, such as OS/2 or Windows, relies on window managers
    to decorate windows. That is, X handles the mechanics of drawing windows and communicating'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'between an X client (an application that runs in X) and the X server or another
    X client. X does nothing to decorate a window with pretty title bars, scrollbars,
    interpret mouse movement, keystrokes, and the like. All X does is provide a **protocol**,
    which consists of the rules or general framework that window managers must follow.
    Accordingly, a **window manager**, following the basic X protocol, creates title
    bars, scrollbars, menus, and so on on the unadorned windows that X creates.


    Why separate the functionality this way? One benefit that doing so allows X to
    be device-, OS-, and network-protocol independent. Another advantage is that one
    particular part of the system, say, the window manager, can be modified simply
    by replacing the relevant component, without destabilizing or otherwise affecting
    the rest of the system.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_49_0.png)


    # ## Exploring GNOME


    Now that you know how to log in and log out, log back in. You should again see
    the GNOME desktop because it is the default. In this section, you spend a few
    minutes exploring the GNOME desktop.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_49_1.png)


    The exact appearance of the GNOME display depends on the current session. A *session*
    is nothing more than a set of applications (including a *window manager*) and
    the state of these applications. GNOME stores the session information in a file
    named *session file* in the `.gnome` subdirectory of your home directory. This
    is a text file; if you are curious, you can browse the file with the command `more
    ~/.gnome/session`.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_49_2.png)


    Don''t worry about the syntax of the session file right now. You''ll learn more
    about **Linux commands** in Sessions 6, 7, and 8.


    The initial GNOME desktop (see Figure 3-2) produced by the default session description
    is very similar to the Windows 95/98/NT/2000 desktop. It includes the GNOME Panel,
    or simply the *panel* (similar to a Windows taskbar) and the Sawfish window manager,
    resulting in a desktop similar to the one shown in Figure 3-2.


    # ## What Is GNOME?


    GNOME stands for **GNU Network Object Model Environment**. **GNU** stands for
    GNU''s Not UNIX. GNOME is a graphical user interface (GUI) and a programming environment.
    From the user''s perspective, GNOME is like the motif-based *Common Desktop Environment*
    (CDE) or Microsoft Windows. Behind the scenes, GNOME has many features that enable
    programmers to write graphical applications that can work together well. In this
    session, we point out some key features of the GNOME GUI and leave the details
    to you to explore on your own.


    You can always find out the latest information about GNOME by visiting the GNOME
    home page at `http://www.gnome.org`.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The GNOME Panel is a key feature of the GNOME desktop The panel is a separate
    GNOME application. As Figure 3-3 shows, it provides a display area for menus and
    small panel applets. Each panel applet is a small program designed to work inside
    the panel. For example, the clock applet on the panel''s far right displays the
    current time.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_50_0.png)


    As you can see from the icons appearing on the left side of the GNOME desktop
    (refer to Figure 3-2), GNOME enables you to place folders and applications directly
    on the desktop. This is similar to the way you can place icons directly on the
    Windows 95/98/NT/2000 desktop.


    You can move and resize the windows just the way you do in Microsoft Windows.
    Also, as in the window frames in Microsoft Windows 95/98/NT/2000, the right-hand
    corner of the title bar includes three buttons. The leftmost button reduces the
    window to an icon, the middle button maximizes the window to fill up the entire
    screen, and the right-most button closes the window.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_50_1.png)


    Notice the two outward-pointing arrows at the left and right ends of the panel.
    Click the arrow and see that the panel slides away, reducing its display area
    down to a small sliver along the edge of the screen. This frees up more desktop
    room for windows. Click the arrow again and the panel reappears.


    The panel includes several other applets:


    +   • The GNOME pager applet: This provides a virtual desktop that is larger than
    the physical dimensions of your system''s screen. In Figure 3-3, the pager displays
    four pages in a small display area. Each page represents an area equal to the
    size of the X display screen. To go to a specific page, click that page in the
    pager window. The GNOME pager applet also displays buttons for each window that
    appears in the current virtual page.


    +   • Launcher applets: These are the buttons to the right of the foot icon. Each
    applet displays a button with the icon of the application that the button starts.
    Clicking a button starts (launches) that application. Try clicking each of these
    buttons to see what happens. The question mark (?) button launches the GNOME Help
    Browser; the toolbox button launches the GNOME Control Center; the terminal icon
    launches a terminal window; and the earth icon launches Netscape Communicator.
    The lock icon starts the screen saver and requires you to enter the password to
    get back to the desktop.


    +   • Main Menu button: The GNOME Panel also displays the Main Menu button that
    behaves like the Windows Start menu. This is the button at the left-hand side
    of the panel (see Figure 3-3) with the image of a stylized foot (the GNOME logo).
    That foot is the Main Menu button. As with the Start button in Windows 95/98/NT/2000,
    you can launch applications from the menu that pops up when you click the left
    mouse button on the foot. Typically, this pop-up menu lists items that start an
    application. Some of the menu items have an arrow. Another pop-up menu appears
    when you place the mouse pointer on an item with an arrow.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'When time permits, you should explore all the items in the Main menu to see
    all the tasks that you can perform from it. At this point, select Main menu (root)
    \ Log out so you can begin a KDE session.


    # Exploring KDE


    To try the KDE GUI, you must have installed the KDE package as part of the Red
    Hat Linux during Session 1. Typically, the installation program makes GNOME your
    default GUI. For now, you can change the GUI for the next session by selecting
    Session \ KDE from the graphical login window.


    +   **Note**

    +   Don''t confuse the term *session* as used in the login window, which refers
    to the period of time you are logged in, and the term *session* as used in this
    book, which refers to the 30 lessons or chapters.


    +   **Cross-Ref**

    +   In Session 17, you learn how to change the default GUI from GNOME to KDE and
    vice versa.


    When you log in, you should get the KDE desktop for the current session. The next
    time you log in, the system reverts to GNOME (assuming that is your default GUI).


    After you select KDE as the GUI for the session and log in, you see an initial
    KDE desktop similar to the one shown in Figure 3-4.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_51_0.png)'
  merge: -1
