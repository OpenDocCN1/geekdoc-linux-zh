- pgno: 202
  md: '# Working with Multimedia Applications


    # Session Checklist


    +   Configuring the sound card

    +       Playing audio CDs

    +       Working with graphics and images


    R ed Hat Linux comes with quite a few multimedia applications that enable you
    to play audio CDs and manipulate graphics and images. In this session, you’ll
    try out several multimedia applications and learn how to work with graphics and
    images. You start the session by configuring your PC’s sound card in Red Hat Linux
    because you’ll need a working sound card for listening to audio CDs.


    # Configuring the Sound Card


    Your PC must have a sound card and speakers to play audio CDs according to the
    instructions from the PC’s manufacturer. Red Hat Linux needs a sound driver to
    access and control the sound card. The sound drivers are provided as modules that
    you can load after booting Red Hat Linux. You can configure the sound card by
    running the /usr/sbin/sndconfig utility. This is a text-mode configuration program,
    so you should run it from a text console using the following procedure:


    +   1. Log in as root.

    +   2. In a terminal window or one of the virtual consoles, type /usr/sbin/sndconfig.

    +   3. A message informs you that the utility will probe for sound cards. Press
    Enter to continue with the probing.

    +   4. The utility displays the result of probing for sound cards. Press Enter
    to continue with the configuration.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   4.  The utility then displays one or more dialog boxes that indicate existing
    configura-tion files will be replaced. Press Enter to continue with each step.

    +   5.  A dialog box informs you that sndconfig will play a sound sample. Press
    Enter.

    +   6.  If all goes well, you should hear Linux Tordvals pronounce Linux the way
    it should be pronounced (his way, of course). A dialog box asks you if you hear
    the sound. If you hear the sound, press Enter to select Yes. Otherwise, press
    Tab to select No and then press Enter.

    +   7.  If you selected No in Step 6, sndconfig shows a dialog box from which
    you can manually select the interrupt request number (IRQ), I/O port addresses,
    and direct memory access (DMA) channels.

    +   8.  The utility then plays a MIDI, Musical Instrument Digital Interface, sound
    sample. You should now hear the MIDI sound sample. You can go through and confirm
    this part as well.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_203_0.png)


    +   9.  After you exit sndconfig, type exit to log out.


    Once you configure your sound card for use with Red Hat Linux, you can play audio
    CDs and other sound files on your Red Hat Linux system.


    # ### Playing Audio CDs


    You need a special application to play audio CDs in Red Hat Linux. Red Hat Linux
    comes with several CD-player applications, including xplaycd, an X application
    providing a graphical Control Panel for playing audio CDs. Additionally, both
    GNOME and KDE come with CD players.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_203_1.png)


    To try out the xplaycd program, type xplaycd in a terminal window from the GNOME
    or KDE desktop. The graphical user interface (GUI) of xplaycd is easy to understand
    because it resembles the interface of a hardware CD player. Try out the buttons
    to see how they work. Click the Exit button to quit the program.


    If you are using the GNOME desktop, you can play audio CDs using the GNOME CD
    Player application. To launch the GNOME CD Player, select the Main Menu->Programs->Multimedia->CD
    Player. Figure 18-1 shows this CD Player playing a track from an audio CD.


    As you can see, the GNOME CD Player displays the title of the CD and the name
    of the current track. The GNOME CD Player gets the song titles from FreeDB, an
    Internet-based CD database. This means that you need an active Internet connection
    for the CD Player to download song information from the CD database. The GNOME
    CD Player will still work even without an Internet connection; it just will not
    display the CD''s title and track information.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_204_0.png)


    THE GNOME CD PLAYER PLAYING A TRACK FROM AN AUDIO CD


    Once the CD Player downloads information about a particular CD, it caches that
    information in a local database for future use. The CD player’s user interface
    is easy to learn; if you do not know what a button does, you can hold the mouse
    over it for a moment to view pop-up balloon help briefly describing the purpose
    of the button. One nice feature of the GNOME CD Player is that it allows you to
    select a track by title.


    To learn more about CDBD, read the Frequently Asked Questions about CDBD at http://www.cddb.com/FAQs.html.


    If you want to log in as a normal user and play audio CDs on the CD-ROM drive,
    you should first log in as root and set the CD-ROM device’s permissions to allow
    anyone to read it. Follow these steps to do so:


    +   1. Log in as root. If you are already logged in, you can type the su command
    and enter the super user’s password to assume the identity of root.


    +   2. Make the CD-ROM device readable to all users using the chmod command as
    follows (the example assumes that /dev/hdc is your CD-ROM device):


    ```

    `chmod  o+r  /dev/hdc`

    ```


    Anyone who has access to your Red Hat Linux PC can now play audio CDs and access
    the CD-ROM drive.


    If you use KDE as your desktop, you can find a similar audio CD player in KDE.
    Start the KDE CD Player by selecting K► Multimedia ► CD Player. You can then use
    the KDE CD player to play a track from an audio CD.


    # ## Working with Graphics and Images


    The applications in this category enable you to prepare, view, modify, and print
    graphics and images. In the remainder of this session, you’ll try out a few graphics
    and image manipulation applications.


    # ### The GIMP


    The GIMP (GNU Image Manipulation Program) is an image-manipulation program written
    by Peter Mattis and Spencer Kimball and released under the GNU General Public
    License (GPL).'
  merge: -1
  img_proc: true
