    xsms-1.2.5/config.sub

    xsms-1.2.5/configure

    ```


    The output of this command shows you the contents of the archive and gives you
    an idea of the directories that are created once you unpack the archive. In this
    case, a directory named `xsms-1.0.1` is created in the current directory, in this
    case, `/usr/local/). From the listing, you also learn the programming language
    used to write the package. If you see `.c` and `.h` files, that means the source
    files are in the C programming language, which is used to write many open source
    software packages.


    # Unpacking the software


    To extract (or unpack) the contents of the tar archive, type the following tar
    command:


    ```

    tar zxvf xsms*.gz

    ```


    You again see the long list of files as they are extracted from the archive and
    copied to the appropriate directories on your hard disk.


    If you downloaded an archive with `.bz2` at the end instead of `.gz`, it means
    the archive was compressed with the `bzip2` utility. In order to unpack this kind
    of archive, replace `z` with `j` in the tar command. That is, type `tar xjvf xsms*.bz2`.


    Now you are ready to build the software.


    # Building the Software from Source Files and Installing It


    After you unpack the compressed tar archive, all source files are in a directory
    whose name is usually that of the software package with a version number suffix.
    For example, the XMSM version 1.2.5 source files are extracted in the `xsms-1.2.5`
    directory. To start the process of building the software, change the directory
    with this command:


    ```

    cd xsms*

    ```


    You don''t have to type the entire name. The shell can expand the directory name
    and change it to to the `xms-1.0.1` directory.


    Nearly all software packages come with one or more `README` or `INSTALL` files,
    or something similarly named. These files are text files containing instructions
    on what to do to build and install the packages. XMSM is no exception; it comes
    with a `README` file that you should read by typing more `README`. There is also
    an `INSTALL` file that contains instructions for building and installing XMSM.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Most open source software packages, including **XMMS**, also come with a file
    named **COPYING**. This file contains the full text of the *GNU General Public
    License* (*GPL*), which spells out the conditions under which you may use and
    redistribute the software. If you are not familiar with the *GNU GPL*, you should
    read this file and show the license to your legal counsel for a full interpretation
    and an assessment of applicability to your business. The file containing the license
    may have other names, too, such as **LICENCE**.


    For the **XMMS** package, the **README** file lists some of the prerequisites,
    such as libraries that you need, and then tells you what commands you should type
    to build and install the package. In the case of **XMMS**, the instructions direct
    you to use the following commands:


    +   1.  Type `./configure` to run a shell script that checks your system configuration
    and creates a *Makefile*, which the **make** command uses to build and install
    the package. The `configure` shell script guesses system-dependent variables and
    creates a *Makefile* with commands needed to build and install the software.

    +       2.  Type **make** to build the software. This step compiles the source
    files in all the subdirectories.

    +       3.  Type **make install** to install the software. This step copies libraries
    and executable binary files to appropriate directories on your system.


    Although these steps are specific to **XMMS**, most other packages follow this
    procedure: configure, make, and then install.


    Usually, you do not have to do anything but *type the commands to build the software*;
    however, you must install the *software development tools* on your system. This
    means that you must install the **Development** package when you install **Red
    Hat Linux**. To build and run **XMMS**, you must also install the **X Window System**
    package because it’s an **X** application.


    # Building the software


    To begin building **XMMS**, type the following command to run the *configure*
    script while in the `xms-1.2.5` directory:


    ```

    ./configure

    ```


    The *configure* script starts running and prints lots of messages as it checks
    various features of your system, from the existence of the C compiler to various
    libraries that are needed to build **XMMS**. Finally, the *configure* script creates
    a *Makefile* that you can use to build the software.


    If the *configure script displays* **error messages** and fails, read the **INSTALL**
    and **README** files again to find any clues in solving the problem. You may be
    able to circumvent the problem by providing some information through command-line
    arguments to the *configure* script.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'After the configure script finishes, build the software by typing the following
    command:


    make


    This command runs the GNU make utility, which may take up to 10 or 15 minutes
    to complete, depending on the speed of your system. The make utility reads a Makefile,
    which contains information the compiler needs to create the XMS program from the
    source code you downloaded. The make command goes through the source directories,
    compiles the source files, and creates the executable files and libraries needed
    to run XMS. You see a lot of messages scroll by as each file is compiled. These
    messages show the command used to compile and link the files.


    # Installing the software


    After the make command finishes, you can install the XMS software with the following
    command:


    make install


    This command also runs GNU make, but the install argument instructs GNU make to
    perform a specific set of commands from the Makefile. These instructions essentially
    search the subdirectories and copy various files to their final locations. For
    example, the binary executable files xmms, gnome-xmms, wm-xmms, and xmms-config
    are copied to the /usr/bin directory.


    # Running the software


    Now that you have installed XMS, try running it by typing xmms in a terminal window
    from the GNOME or KDE desktop. From the XMS window, you can open an MP3 file and
    try playing it. Note that your PC must have a sound card and you must have it
    configured correctly. (Session 18 discusses sound card configuration.) Figure
    27-1 shows a typical view of XMS playing an MP3 music clip.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_301_0.png)


    Figure 27-1 Playing MP3 music with XMS'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Reviewing the basic building steps


    Now you know how to download, unpack, build, and install a typical software package.
    Here’s an overview of the steps you follow to complete these tasks:


    +   1. Download the source code, usually in the form of a `_tar.gz` file, from
    the anonymous FTP site or Web site. Use the Web browser or download the source
    code manually from the anonymous FTP server.


    +   2. Unpack the file with a `tar zxvf filename` command.


    +   3. Change the directory to the new subdirectory where the software is unpacked
    with a command such as this one:


    ```

    ```bash

    cd software_dir

    ```

    ```


    +   4. Read any `README` or `INSTALL` files to identify requirements that the
    software has and to learn any specific instructions you must follow to build and
    install the software.


    +   5. The details of building the software may differ slightly from one software
    package to another, but typically, you type the following commands to build and
    install the software:


    ```

    ```bash

    ./configure

    make

    make install

    ```

    ```


    +   6. Read any other documentation that comes with the software to learn how
    to configure and use it.


    # Troubleshooting


    If you use anonymous FTP to download a file such as a compressed `tar` archive,
    and it appears to be corrupted, make sure that you switched to binary mode before
    downloading the file. Downloading binary files in text mode (also known as `ASCII`
    mode) corrupts the downloaded file. The following two messages are symptoms of
    this:


    ```

    ```bash

    $ tar zxvf mytarball.tar.gz


    gzip: stdin: not in gzip format

    tar: Child returned status 1

    tar: Error exit delayed from previous errors

    $ gunzip mytarball.tar.gz


    gunzip: mytarball.tar.gz: not in gzip format

    ```

    ```


    You might have problems building software, such as receiving an error message
    complaining about missing programs or, in particular, the message `Installation
    or configuration problem: compiler cannot create executables`. The most likely
    explanation is that you do not have complete development environment installed.
    To solve the problem, follow the instructions in Session 23 to install at least
    the `RPMs` in the following list from the Red Hat Linux installation CDs:'
  merge: -1
  img_proc: true
