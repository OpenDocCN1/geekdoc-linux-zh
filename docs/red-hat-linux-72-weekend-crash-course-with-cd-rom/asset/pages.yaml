    \ contains the names of users who are not allowed to submit jobs using the crontab\
    \ command.\n\nIf the /etc/cron.allow file exists, only users listed in this file\
    \ can schedule cron jobs. If only the /etc/cron.deny file exists, then users listed\
    \ in this file cannot schedule cron jobs. If neither file exists, the default\
    \ Red Hat Linux setup enables any user to submit cron jobs.\n\n# Submitting a\
    \ cron job\n\nTo submit a cron job, perform the following steps:\n\n+   Prepare\
