- pgno: 117
  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_117_0.png)


    A tab separates the names from the telephone numbers. Suppose you want to display
    only the names in the file. Because tab characters separate the names and telephone
    numbers, use cut''s -f with the numeral 1 to tell cut to display only the first
    field. Executing the command cut -f 1 phnlst.txt will show only the names in the
    file (you type the following bold text):


    ```

    cut -f1 phnlst.txt

    Kurt Wall

    Naba Barkakat!

    Bubba Tippets

    ```


    If, on the other hand, you only want to see your friends'' first names, combine
    the -f option with the -d option to define the space character as the field delimiter:


    ```

    cut -f1 -d“ ” phnlst.txt

    Kurt

    Naba

    Bubba

    ```


    Notice that the space character had to be embedded between double quotes (" ")
    to make the command work properly. If you only want to see the prefix of each
    telephone number, you could use the command cut -f2 -d phnlst.txt.


    To display one or more columns, use cut''s -c option, followed by a list of the
    columns to show. Use the comma character (,) to list non-contiguous characters
    and the minus sign (-) to identify a range of contiguous characters. For example,
    the command, cut -c1,5 phnlst.txt, will show the first and fifth characters in
    each line, while the command, cut -c6-8 phnlst.txt, will show columns 6, 7, and
    8 from each line.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_117_1.png)


    # Reformatting paragraphs with fmt


    The fmt command makes short work of reformatting paragraphs. It is especially
    useful for breaking long lines of text into shorter lines and removing superfluous
    spaces. For example, suppose you have a text file named fmtme.txt that looks like
    the following:


    ```

    fmt* prefers breaking lines at the end of a sentence, and tries to avoid line
    breaks after the first word of a sentence or before the last word of a sentence.
    A “sentence break” is defined as either the end of a paragraph or a word ending
    in either a period (.), a question mark (?), or an exclamation point (!), followed
    by two spaces or the end of a line, ignoring any intervening parentheses or quotes.

    ```


    Although you cannot see it in the printed text, there are no embedded new lines
    or carriage returns in the text, so if you viewed this file in the vi editor,
    it would look like Figure 9-1.'
