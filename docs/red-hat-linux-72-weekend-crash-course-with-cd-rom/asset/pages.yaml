  md: 'If the command in a cron job contains embedded $ signs (for example, the date
    command uses $ signs to format its output), they must be escaped with a backslash
    (\). Otherwise, erond interprets the $ as a new line, which can cause a command
    not to execute, or at least change its meaning.


    # REVIEW


    This session showed you how to perform commands at a future time and submit recurring
    jobs. You learned how to use the at command to execute one or more commands on
    a one-time basis in the future and have the output mailed to you. Next, you used
    the crontab facility to set up periodic jobs, called cron jobs, to execute at
    recurring intervals and have the output mailed to you.


