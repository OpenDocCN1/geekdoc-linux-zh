- pgno: 83
  md: '# Using the Bash Shell


    Because a shell interprets what you type, it is important to know how the shell
    *interprets*, or processes, the text that you enter. Most shell commands have
    this general format:


    ```

    command option1 option2 ... optionN

    ```


    A single line of commands is commonly referred to as a *command line*. On a command
    line, you enter a command followed by one or more options known as *command-line
    options*. The options control how the command operates or behaves. In addition,
    the command itself and the command-line options may take one or more arguments,
    both or either of which are (somewhat confusingly) referred to as *command-line
    arguments*. Whereas command-line options control the command’s behavior, command-line
    arguments provide additional information either for the option or for the command,
    such as the name of a file on which to operate. For example, consider the following
    command line:


    ```

    grep -A 1 -i naba /etc/passwd

    ```


    In this case, *grep* is the command, *-A* and *-i* are options, the numeral 1
    is an argument to the *-A* option, and *naba* and */etc/passwd* are arguments
    to the *grep*.


    One basic rule is that you have to use a space or a tab to separate the command
    from the options. You also must separate options with a space or a tab. If you
    want to use an option that contains embedded spaces, you have to put that option
    inside quotation marks (“”). For example, to search for the name, *Kurt*, in the
    password file, enter the following *grep* command (*grep* searches for text in
    files):


    ```

    grep “Kurt Wall” /etc/passwd

    ```


    When *grep* prints the line with the name, *Kurt*, it looks like this:


    ```

    kwall:x:500:500:Kurt Wall:/home/kwall:/bin/bash

    ```


    If you created a user account with your name, go ahead and type the *grep* command
    with your name as the first argument.


    > In the output from the grep command, you can see the name of the shell (/bin/bash)
    following the last colon (:).'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The number and format of the command-line options, of course, depend on the
    actual command. As you learn more commands, you will see that most of the command-line
    options take the form -X in which *X* is a single character.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_84_0.png)


    Because various GNU tools and utilities implement most Linux commands, you should
    know that GNU command support includes so-called long options. These are command-line
    options that begin with two dashes followed by one or more descriptive words.
    Thus, the GNU options take the form --xxxx in which xxxx is a word denoting the
    option. For example, the `ls --all` command shows all directory entries including
    those that *begin* with a period (.). This is the same as the `ls -a` command
    in all UNIX systems.


    If a command is too long to fit on a single line, you can press the backslash
    (\) key, followed by Enter. Then, continue entering the command on the next line.
    For example, type the following command (press Enter after each line):


    ```

    cat \

    /etc/passwd

    ```


    The `cat` command then displays the contents of the /etc/passwd file.


    You can concatenate several shorter commands on a single line; just use the semicolon
    (;) as a separator (also called a command *terminator*) between each command.
    For example, the following command


    ```

    cd ; ls -F

    ```


    changes the current directory to your home directory and then lists the contents
    of that directory.


    # ### Getting help with Bash


    Bash comes with many built-in commands, some of which mimic or duplicate the functionality
    of other programs on your Red Hat Linux system. To see the complete list of these
    Bash built-ins, as they are called, type `help` and press Enter at the Bash command
    prompt. To get help with a specific Bash built-in, type `help *command*`, where
    *command* is the Bash command about which you want to learn. For example, type
    the following command and then press Enter


    ```

    help pwd

    ```


    The short help text shows the syntax of Bash’s built-in command `pwd`, briefly
    describes what it does, and provides an explanation of pwd’s command-line options:


    ```

    pwd [-P|-L]

    Print the current working directory.  With the -P option,

    pwd prints the physical directory, without any symbolic

    links; the -L option makes pwd follow symbolic links.

    ```


    The exact appearance on your system will be different because the output shown
    here has been edited to fit this book’s formatting requirements.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# ## Combinine commands


    Linux follows the UNIX philosophy of giving the user a toolbox of many simple
    commands that can be combined in a myriad of ways to create a more sophisticated
    command. Suppose you want to find out whether a device file named `smpcd` resides
    in your system''s `/dev` directory, because some documentation tells you that
    for a Sound Blaster Pro CD-ROM drive you need that device file. You can use the
    command `ls /dev` to get a directory listing of the `/dev` directory and see whether
    anything that contains `smpcd` appears in the listing. Unfortunately, the `/dev`
    directory has a great many entries, and it may be difficult to locate any item
    that has `smpcd` in its name. You can, however, combine the `ls` command with
    `grep` and come up with a command that does exactly what you want, as shown here:


    ```

    ```

    ls /dev | grep smpcd

    ```

    ```


    The shell sends the output of the `ls` command (the *directory listing*) to the
    `grep` command, which searches for the string `smpcd`. That vertical bar (`|`)
    is known as a *pipe* because it acts as a conduit between the two programs; the
    output of the first command becomes the input of the second one.


    > Most Linux commands are designed in a way that enables the output of one command
    to feed into the input of another. To do this, simply concatenate the commands
    and place pipes between them.


    # ## Redirecting command input and output


    Linux commands that are designed to work together have a common feature—*they
    always read from the* ***standard input*** *(usually the keyboard) and write to
    the* ***standard output*** *(usually the screen).* ***Error*** *messages are sent
    to the* ***standard error*** *(usually the screen). These three devices are often
    referred to as* ***stdin***, ***stdout***, *and* ***stderr***, *respectively.
    If you want a command to read from a file, you can redirect* ***stdin*** *to come
    from that file. Similarly, to save a command''s output in a file, redirect* ***stdout***
    *to a file. These features of the shell are called* ***input*** *and* ***output
    redirection***, *or, more generally,* ***I/O redirection.***


    For example, type `cd` to change to your home directory and then type the following
    command:


    ```

    ```

    grep typeoff /usr/include/* > typeoff.out

    ```

    ```


    For the time being, ignore the messages resembling `grep: /usr/include/org`: is
    a directory; these are error messages from the `grep` command. This command searches
    through all files in the `/usr/include` directory for the occurrence of the string
    `typeoff` and then saves the output in a file called `typeoff.out`. As this command
    shows, the greater than sign (`>`) redirects `stdout` to a file.


    This command also illustrates another feature of Bash. When you use an asterisk
    (*), Bash replaces the asterisk with a list of all the filenames in the specified
    directory. Thus, `/usr/include/*` means "display all the files in the `/usr/include`
    directory."


    You can also redirect `stdin` so that a command reads from a file instead of the
    keyboard. For example, type the following command:


    ```

    ```

    sort < /etc/passwd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'This should display a sorted list of the lines in the `/etc/passwd` file. In
    this case, the less than sign (<) redirects stdin so the sort command reads its
    input from the `/etc/passwd` file.


    # Letting Bash complete your commands


    Many commands take a filename as an argument. To browse through a file named `/etc/X11/XF86Config`,
    for example, type the following command:


    ```

    ```text

    more /etc/X11/XF86Config

    ```

    ```


    This command displays the file `/etc/X11/XF86Config` one screen at a time. For
    the commands that take a filename as an argument, Bash includes a feature that
    enables you to type short filenames. All you have to type is the bare minimum
    — just the first few characters — to identify the file uniquely in its directory.


    To see an example, type more `/etc/X11/XF` but don''t press Enter; press Tab instead.
    Bash automatically completes the filename so that the command becomes more `/etc/X11/XF86Config`.
    Then press Enter to run the command.


    # Using wildcard characters


    Another way to avoid typing too many filenames is to use wildcards — special characters,
    such as the asterisk (*) and question mark (?), to match characters in a string.
    If you are familiar with MS-DOS, you may have used commands such as `COPY *.*
    A:` to copy all files from the current directory to the A: drive. Bash accepts
    similar wildcards in filenames. In fact, Bash provides many more wildcard options
    than MS-DOS.


    Bash supports three types of wildcards:


    +   * Asterisk (*) character matches zero or more characters in a filename. Therefore,
    `*` denotes all files in a directory.

    +   * Question mark (?) matches any single character.

    +   * Set of characters in brackets matches any single character from that set.
    For example, the string `[xx]*` matches any filename that starts with x or x.


    Wildcards are handy when you want to perform a task on a group of files. For instance,
    to copy all the files from a directory named `/mnt/cdrom` to the current directory,
    type the following:


    ```

    ```text

    cp /mnt/cdrom/* .

    ```

    ```


    Bash replaces the wildcard character `*` with the names of all the files in the
    `/mnt/cdrom` directory. The period at the end of the command represents the current
    directory.


    You can use the asterisk with other parts of a filename to select a more specific
    group of files. Suppose you want to use the `grep` command to search for the string
    `typed` or `struct` in all files of the `/usr/include` directory that meet the
    following criteria:


    +   * Filename starts with s.

    +   * Filename ends with .h.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The wildcard specification s.*s* denotes all filenames that meet these criteria.
    Thus, you can perform the search with the following command:


    ```

    grep "*typeef struct*" /usr/include/s*.h

    ```


    The string contains a space (you want the grep command to find, so you have to
    enclose that string in quotation marks (")). This method ensures that Bash does
    not try to interpret each word in the string as a separate command-line argument.


    Although the asterisk (*) matches any number of characters, the question mark
    (?) matches a single character. Suppose you have four files—image1.pcx, image2.pcx,
    image3.pcx, and image4.pcx—in the current directory. To copy these files to the
    /mnt/floppy directory, use the following command:


    ```

    cp image?.pcx /mnt/floppy

    ```


    Bash replaces the single question mark with any single character and copies the
    four files to /mnt.


    The third wildcard format ([...] ) matches a single character from a specific
    set. You may want to combine this format with other wildcards to narrow down the
    matching file-names to a smaller set. To see a list of all filenames in the /etc/X11/Xdm
    directory that start with x or X, type the following command:


    ```

    ls /etc/X11/Xdm/[xX]*

    ```


    ![](img/5fe8f856723cde0b366f73584b9e64b8_87_0.png)


    > If Bash does not find any filenames matching the [...] wildcard format when
    expanding it, Bash leaves the wildcard specification intact.


    # **Looking at the command history**


    To make it easy for you to repeat long commands, Bash stores up to 500 (the default)
    previously executed commands. This feature is called a **command history** (a
    list of old commands). To see the command history, type **history**. Bash displays
    a numbered list of the old commands, including those that you entered during previous
    logins. That list may resemble the following:


    ```

    1  cd

    2  ls -a

    3  more /etc/X11/XF86Config

    4  history

    ```


    If the command list is too long, you may choose to see only the last few commands.
    To see the last 10 commands only, type this command:


    ```

    history 10

    ```


    To repeat a command from the list that the **history** command shows, simply type
    an exclamation point (!), followed by that command''s number. To repeat command
    number **3**, type **!3**.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'You also can repeat an old command without knowing its command number. Suppose
    you *typed more /usr/lib/X11/xdm-config* a while ago, and now you want to look
    at that file again. To repeat the previous *more* command, type the following:


    ```

    lmore

    ```


    Often, you may want to repeat the last command that you typed—perhaps with a slight
    change. For example, perhaps you displayed the contents of the directory by using
    the *ls -l* command. To repeat that command, type two exclamation points as follows:


    ```

    !!

    ```


    Sometimes, you may want to repeat the previous command but add extra arguments
    to it. Suppose that *ls -l* shows too many files. Simply repeat that command,
    but pipe the output through the *more* command as follows:


    ```

    !! | more

    ```


    Bash replaces the two exclamation points with the previous command and then appends
    | *more* to that command.


    > An easy way to recall previous commands is to press the up arrow key, which
    causes **Bash** to go backward in the list of commands. To move forward in the
    command history, press the down arrow key.


    # Using aliases for commands


    To see the benefit of aliases, type the following command:


    ```

    alias gobot=''"cd /usr/src/linux/arch/i386/boot''"

    ```


    This defines *gobot* as an *alias*—another name—for the text that appears within
    the single quotes (''). That text is a command to change the *current directory*
    to /usr/src/linux/arch/i386/boot.


    Now that you''ve defined the alias, type the following at the Bash prompt:


    ```

    gobot

    ```


    Type *pwd* to confirm that the *current directory* is indeed /usr/src/linux/arch/i386/boot.


    As you can see, an *alias* is simply an alternative (and usually shorter) name
    for a lengthy command. Bash replaces the alias with its definition and performs
    the equivalent command.


    If you no longer need an alias, use the *unalias* command to remove the *alias*.
    For example, if you no longer want to use the *gobot* alias, type


    ```

    unalias gobot

    ```


    After this step, typing *gobot* causes you to get an error message like this:


    ```

    gobot

    ```


    ```

    bash: gobot: command not found

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Redefining Dangerous Commands


    Another good use of an alias is to redefine a dangerous command, such as rm, to
    make it safer. By default, the rm command deletes one or more specified files.
    If you type `rm *` by mistake, rm deletes all files in your current directory.
    One user learned this the hard way one day when he wanted to delete all files
    that ended with .xwd. (These files contained old screen images that he no longer
    needed.) He intended to type `rm * .xwd`, but somehow he ended up typing `rm *
    . xwd`. He got the following message:


    ```

    ```

    rm: .xwd: No such file or directory

    ```

    ```


    Puzzled by the message, he typed `ls` to see the directory''s contents again.
    When the listing showed nothing, he realized that he had an extra space between
    the . and .xwd. All the files in that directory, of course, were gone forever.


    The `rm` command provides the `-i` option, which asks for confirmation before
    deleting a file. To make that option a default, add the following alias definition
    to your .bash_profile file in your home directory:


    ```

    ```

    alias rm=''rm -i''

    ```

    ```


    From now on, when you use rm to delete a file, the command first asks for confirmation
    as follows:


    ```

    ```

    rm .bash_profile

    rm: remove ''.bash_profile''? n

    ```

    ```


    Press y to remove the file; otherwise, press n.


    Many users take advantage of the alias feature to give more familiar names to
    common commands and to create shortcuts to frequently typed long commands. If
    you are a DOS user and you issue the md command to create a directory, you can
    simply define md as an alias for mkdir (the Linux command that creates a new directory).
    You do this as follows:


    ```

    ```

    alias md=''mkdir''

    ```

    ```


    Now, you can type `md dirname` to create a new directory named `dirname`.


    # Running commands in the background


    ![](img/5fe8f856723cde0b366f73584b9e64b8_89_0.png)


    When you use MS-DOS, you have no choice but to wait for each command to complete
    before you enter the next one. You can type ahead a bit, but the MS-DOS system
    can hold only a few characters in its internal buffer. However, Linux can handle
    multiple tasks simultaneously. The only problem you may have is that the terminal
    or console is tied up until a command completes.


    If you work in a terminal window and a command takes too long to complete, you
    can open another terminal window and continue to enter other commands. If you
    work in text'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'mode, however, and a command seems to take too long, you need some other way
    to access your system.


    Linux allows you to execute a long-running command *in the background*, which
    means that the shell starts the process corresponding to a command and immediately
    returns to accept more commands. The shell does not wait for the command to complete;
    the command runs as a distinct process in the background. To start a process in
    the background, you simply place an **ampersand** (@) at the end of a command
    line.


    For example, when you want to search the entire file system for a file using the
    *ffind* command, you can run that command in the background and send the output
    to a file. To try out the *ffind* command in the background, type *cd* to change
    to your home directory and then type the following command:


    ```

    `ffind / -name "README.*" -print > all.readme &`

    ```


    You should *immediately* get a Bash prompt. You can now go on with other commands.
    When the *ffind* command finishes, the search results should appear in the file
    *all.readme* in your home directory.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_90_0.png)


    If a command that you did not run in the background seems to be taking a long
    time, press **Ctrl+Z** to stop it. Then type *bg* to put that process in the background.


    # Using virtual consoles


    Red Hat Linux comes with a number of *virtual consoles*. The combination of a
    monitor and a keyboard is called the *terminal* or *console*. Even though your
    Red Hat Linux system only has one physical terminal or console, it gives you the
    appearance of having multiple consoles. From the graphical X screen (the GNOME
    or KDE desktop), press **Ctrl+Alt+F1** to get to the first virtual console, press
    **Ctrl+Alt+F2** for the second one, and so on. Each of these virtual consoles
    is a text screen where you can log in and type Linux commands to perform various
    tasks.


    Go ahead and press **Alt+F2** to switch to the second virtual console. Then log
    in and try some Linux commands. You can log out by typing *exit* at the Bash prompt.
    To get back to the graphical X display, press **Alt+F7** (or, possibly, **Ctrl+Alt+F7**).


    # Troubleshooting


    If you pass an argument made up of multiple words to a command and get an error
    message stating, in part, *No such file or directory*, try enclosing the argument
    between weak quotes (`"`) and typing again. Remember that Bash uses spaces and
    tab characters to distinguish between commands, options, and arguments. For example,
    the following command *grep Kurt Wall* /etc/passwd generates an error message
    before showing its result:


    ```

    ```

    grep: Wall: No such file or directory

    cut/passwd:kwall: x:500:500:/Kurt Wall:/home/kwall:/bin/bash

    ```

    ```


    Enclosing *Kurt Wall* within weak quotes solves the problem:'
  merge: -1
  img_proc: true
