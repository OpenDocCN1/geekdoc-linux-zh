- pgno: 37
  md: 'To use text mode installation, type text at the boot: prompt after booting
    the Red Hat Linux installation CD. From then on, the basic installation procedure
    resembles the graphical installation described in Section 1, but small details
    differ. In particular, you cannot use the mouse and you will need to enter some
    configuration values manually that Anaconda handles automatically during a graphical
    installation. If you collected the hardware information described in the section
    “Checking if Red Hat Linux Supports Your PC Hardware” in Session 1, you should
    have no trouble responding to the prompts and performing the installation.


    In text mode, when the installation program fails to detect the video card, it
    displays a list of video cards. Select one video card from the list. Because of
    your help in selecting the video card, X may work when you install in text mode.
    If it does not, you can configure X using the information in “Configuring the
    X Window System,” later in this session.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_37_0.png)


    In some cases, using the text mode installation will allow you to install Red
    Hat Linux on systems containing hardware not specifically mentioned in Red Hat’s
    hardware compatibility lists. Sometimes, selecting similar hardware options for
    unsupported hardware may even work. These are not supported or recommended options,
    however, nor do they always work.


    To see how the Red Hat installation program detects certain devices, you can also
    look at the messages the installer’s kernel displays while it boots. To view these
    boot messages, press Ctrl+Alt+F4 to switch to a text-mode virtual console where
    the messages appear. A virtual console is a screen of text or graphical information
    stored in memory that you can view on the physical screen by pressing the appropriate
    key sequence (Shift+PageUp to scroll up and Shift+PageDown to scroll down). Look
    for messages that relate to the device in question. If all else fails, you can
    specify certain devices manually by running the installation in expert mode, discussed
    next.


    # Installing Red Hat Linux in Expert Mode


    The expert mode installation enables you to control almost the entire installation
    process. Other installation modes hide some of the installation steps and use
    autodetection, and default values for hardware configuration.


    To run the installation in expert mode, follow these steps:


    +   1.  Type expert at the boot: prompt in the initial text screen that appears
    during the Red Hat Linux installation. The installation program then displays
    another text screen that asks for a driver disk, if you have one.

    +   2.  Your hardware vendor may provide a floppys disk containing Linux drivers.
    If you have one, press Enter and a dialog box prompts you to insert the disk into
    the A: drive. After you do so, press Enter, and the installation program loads
    the driver and guides you through the steps necessary to install the driver.

    +   3.  If you do not have a driver disk, select None. The installation program
    then goes through two more screens in which you select the language and the keyboard
    lay-out. Then the installation program prompts for the media containing the packages
    to be installed.

    +   4.  Next, the installation program displays a dialog box that gives you another
    opportunity to add devices. Press Tab to highlight the Add Device button, and
    then'
