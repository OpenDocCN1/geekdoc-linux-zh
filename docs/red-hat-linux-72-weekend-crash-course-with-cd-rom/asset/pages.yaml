    Note that you have to log in with the user name anonymous, which is the standard
    login name for anonymous FTP. Anonymous FTP allows people who do not have a user
    account on a server to log in and retrieve files. However, the anonymous account
    is severely restricted and is only used to send and retrieve files from FTP servers.
    For the password, you should type your e-mail address and then Press Enter. To
    change the directory, use the cd command. For a directory listing, use the ls
    command.


    You need to type the binary command to make sure that the data transfer occurs
    in binary mode because the .tar.gz file is a binary file. Then you can use the
    get command to download the file, in this case, xms-1.0.1.tar.gz. Recall that
    the .tar.gz extension tells you that this is a compressed tar archive. After the
    download is complete, type bye or quit to end the anonymous FTP session.


    After downloading the compressed tar file, you should first examine the contents
    with this command (not all of the output is shown in order to conserve space):


    ```

    tar ztf xms.tar.gz | more

