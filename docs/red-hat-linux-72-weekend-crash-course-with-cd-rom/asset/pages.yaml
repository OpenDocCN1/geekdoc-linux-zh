    \ determine the controller settings, such as IRQ and I/O port address, by probing\
    \ various I/O port addresses. However, if the installation program fails to determine\
    \ the SCSI controller settings, you have to specify these parameters — IRQ and\
    \ I/O address — as options for the driver module. The exact formats of these options\
    \ vary from one module to another. For example, the driver for an Adaptec AHA\
