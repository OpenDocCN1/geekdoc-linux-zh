  md: 'memory. As soon as the time comes to access anything in the swapped-out data,
    the Linux kernel has to find something else to swap out and then it swaps in the
    required data from disk into physical memory. You should set aside at least twice
    the amount of RAM in your PC, if possible.


    +   You can add one or more normal users during Red Hat Linux installation. To
    add a user account, enter the user information in the **Account Configuration**
    screen and click the **Add** button to add the user.


    +   A *package group* is a collection of several Red Hat packages. You can select
    individual packages from a package group by selecting the item labeled **Select
    individual packages**, that appears below the list of package groups in the **Package
    Group Selection** screen.


    +   The Red Hat Linux installation program supports NFS installations and a Kickstart
    installation. NFS installation is ideal for allowing machines on a network to
    install Red Hat Linux without needing the CD-ROMs. The Kickstart installation
    makes it easy to install the same configuration on multiple machines without needing
    to intervene or monitor the installation.


    +   The X Window configuration tool described in Session 2 is named **Xconfigtool**.


    +   A monitor''s vertical and horizontal refresh rates, or *synchronization frequencies*,
    are important because they define the maximum performance capabilities of the
    monitor. The *horizontal refresh rate* is the number of times per second that
    the monitor can display a horizontal raster line, usually expressed in kilohertz
    (kHz). The *vertical refresh rate* specifies how many times a second the monitor
    can display the entire screen. You can find the value of these parameters in your
    monitor''s manual.


    +   You could type `dmess | grep par` and look for any indication of parael port
    information in the output.


    +   Installation help is available in *The Official Red Hat Linux x86 Installation
    Guide*, *The Official Red Hat Linux Getting Started Guide*, the x86 Knowledge
    Base (<http://www.redhat.com/apps/support/>), and the Red Hat mailing list archives
    (<http://www.redhat.com/apps/support/updates.html>).


    +   X Window handles the mechanics of drawing windows and communicating between
    an X client and the X server or another X client. It does nothing to decorate
    a window with pretty title bars, scrollbars, interpret mouse movement, keystrokes,
    and the like. However, X Window does provide a *protocol*, the rules or the general
    framework, that window managers must follow. *Window manager* creates title bars,
    scrollbars, menus, and so on, on the unadorned windows that X creates.


