  md: '![](img/5fe8f856723cde0b366f73584b9e64b8_140_0.png)


    # # Networking Your Red Hat Linux PC


    **Session Checklist**


    +   Setting up an Ethernet LAN


    +   Configuring TCP/IP networking in Linux


    +   Using TCP/IP diagnostic commands in Linux


    +   Examining TCP/IP network configuration files


    ![](img/5fe8f856723cde0b366f73584b9e64b8_140_1.png)


    **R**ed Hat Linux includes extensive built-in networking capabilities. In particular,
    Red Hat Linux supports TCP/IP (Transmission Control Protocol/Internet Protocol)
    networking over several physical interfaces, including Ethernet cards, serial
    ports, and parallel ports. You typically use an Ethernet network for your local
    area network (LAN). TCP/IP networking over the serial port enables you to connect
    to other networks by dialing out over a modem.


    This session focuses on Ethernet LANs. You learn how to set up, configure, and
    monitor an Ethernet TCP/IP network. Much of what you learn also applies to TCP/IP
    networking over a dial-up connection, discussed in the next session.


    # ## Setting Up an Ethernet LAN


    Ethernet is a standard way to move packets of data among two or more computers
    connected to a single cable. To set up an Ethernet LAN, you need an Ethernet card
    for each PC. Linux supports a wide variety of Ethernet cards for the PC.


    Ethernet is a good choice for the physical data-transport mechanism because it’s
    a proven, low-cost technology that provides good data transfer rates—typically
    10 million bits per second (10 Mbps) although there is now 100 Mbps and even Gigabit
    (1000 Mbps) Ethernet.


    In an Ethernet LAN, computers are connected to the network with cables. Nowadays,
    there are two popular forms of Ethernet cables. The first option is 10Base2, sometimes'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'called *ThinNet*, which uses a thin, flexible coaxial cable. 10Base2 cables
    appear identical to the cable through which cable television service is delivered.
    The other, more recent and more popular alternative is Ethernet over *unshielded
    twisted pair (UTP)* cable, known as *10BaseT*. A 10BaseT cable resembles a standard
    telephone cable with slightly fatter cables and wider connectors.


    To set up a 10BaseT Ethernet, you need an Ethernet hub —a hardware box with RJ-45
    jacks. You build the network by running *twisted-pair wires* from each PC’s Ethernet
    card to this hub. (The twisted-pair wires are usually *Category 5*, or *Cat5*,
    cables.) Currently, you can buy an 8-port 10BaseT hub for about $50 (U.S.). Figure
    12-1 shows a typical small 10BaseT Ethernet LAN that you might set up at a small
    office or your home.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_141_0.png)


    **Figure 12-1** A *10BaseT Ethernet LAN with a hub*


    ThinNet Ethernet does not need a hub, which makes it attractive for small offices
    or home offices that have more than one PC. You can simply daisy chain the ThinWire
    cable from one PC to another and construct a small Ethernet LAN, as shown in Figure
    12-2.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_141_1.png)


    **Figure 12-2** A *small ThinNet Ethernet LAN*'
  merge: -1
  img_proc: true
- pgno: 142
  md: "As Figure 12-2 shows, you need Ethernet cards in the PCs. The cards should\
    \ have ThinNet connectors, known as BNC connectors (so you need segments of ThinNet\
    \ cable (technically known as RG-58 thin coaxial cables with 50-ohm impedance).\
    \ For each Ethernet card's BNC connector, you need a BNC T-Connector (so called\
    \ because the connector looks like a T). You also need two 50-ohm terminators\
    \ for the two end points of the Ethernet network. Then all you have to do to complete\
    \ your own Ethernet LAN is connect the parts in the manner shown in Figure 12-2.\
    \ You could use this approach to connect several PCs and a workstation in your\
    \ home office.\n\n![](img/5fe8f856723cde0b366f73584b9e64b8_142_0.png)\n\n> > You\
    \ cannot simply connect two 10Base2 Ethernet cards with a cable to network two\
    \ PCs. You have to use the BNC T-connectors and 50-ohm terminators even if you\
    \ are connecting only two PCs on a 10Base2 LAN.\n\nThinNet is easy to set up,\
    \ but it is inconvenient to connect many PCs this way. One problem is that any\
    \ break in the cable causes the entire network to crash. Similarly, if one of\
    \ the PCs on the cable experiences a problem with its network configuration, the\
    \ entire network may be affected.\n\nYou can also connect a 10Base2 LAN with a\
    \ 10BaseT LAN by using a hub that has a 10Base2 port and multiple 10BaseT ports.\n\
    \nWhen you install Red Hat Linux from this book's companion CD-ROMs on a PC connected\
    \ to an Ethernet LAN, the installation program should install the appropriate\
    \ drivers for the card, provided that the installation program successfully detects\
    \ the Ethernet card. Otherwise, you can install Linux in expert mode, as described\
    \ in Session 2.\n\nOnce properly installed, Linux should load the driver for the\
    \ Ethernet card every time it boots. To verify that the Ethernet driver is loaded,\
    \ use the dmesg command as follows:\n\n```\ndmesg | grep eth0\n```\n\nThis command\
    \ searches the boot messages for any line that contains the string eth0. (As discussed\
    \ in the next session, “Configuring TCP/IP Networking,” eth0 is the device name\
    \ for the first Ethernet card in your Linux system.) A sample PC has a 3Com 3C503\
    \ Ethernet card installed. That system gets the following output when the user\
    \ types dmesg | grep eth0 on his or her system:\n\n```\neth0: 3c503 at I/O base\
    \ 0x300, node 02.60.8c.8e.6c.89, using internal xcvr.  \neth0: 3c503-P10, 16KB\
    \ RAM, using programmed I/O (REQUIRP for SHARED MEMORY).\n```\n\nYou should see\
    \ something similar showing the name of the Ethernet card and other relevant parameters.\
    \ If the dmesg command does not show any Ethernet device, type grep eth0 /var/log/messages\
    \ to look for the eth0 device name in the boot messages stored in the /var/log/messages\
    \ file.\n\n# ## Configuring TCP/IP Networking\n\nLike almost everything else in\
    \ Red Hat Linux, TCP/IP setup is a matter of preparing a bunch of configuration\
    \ files, which are text files that you can edit with any text editor. Most of"
