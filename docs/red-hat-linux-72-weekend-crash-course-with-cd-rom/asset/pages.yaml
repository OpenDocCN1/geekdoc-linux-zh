  md: 'To try these commands, copy a file such as /etc/X11/XF86Config to your home
    directory and use vi to edit that file with the following commands:


    cd

    cp /etc/X11/XF86Config .

    vi XF86Config


    As you edit the file, try the commands shown in Table 8-2. Because good vi skills
    are useful in all UNIX systems, including Red Hat Linux, you should spend a few
    minutes familiarizing yourself with some of the commands from Table 8-2.


    # ## Troubleshooting


    If you get an error message resembling TERM variable not set when starting vi,
    use the export command to set the TERM environment variable. For example,


    export TERM=linux


    Similarly, if your vi sessions scroll strangely or the bottom lines of the screen
    seem jumbled and the TERM environment variable is set, try setting TERM to vt100
    (export TERM=vt100), which is a very generic, basic terminal type setting.


    If you have trouble remembering what mode you are in (visual command mode, colon
    command mode, or insert mode) while using vi, execute the colon command :set showmode.
    This will cause the bottom line of the vi window to display the current mode constantly,
    unless you are executing a colon command or a search.


    If you have totally fouled up a file and want to abandon all your changes, use
    the colon command, :q!, to exit without saving any changes.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_113_0.png)


    # ## REVIEW


    This session showed you how to use the graphical text editors in GNOME and KDE
    to edit files. The graphical text editors are intuitive to use, but sometimes
    you may have to edit text files without the benefit of a graphical login. For
    those situations, you practiced editing text files with the text-mode editors:
    ed and vi.


    # ## QUIZ YOURSELF


    +   1. How do you start the GNOME text editor? (See “Text Editing with GUI Text
    Editors.”)

    +   2. When editing with the ed editor, how do you view all lines of a file? (See
    “Using ed.”)

    +   3. When editing a file with the ed editor, what command do you use to locate
    a line containing a string monitor? (See “Using ed.”)

    +   4. What are the three modes of the vi editor? (See “Using vi.”)

    +   5. How do you exit the vi editor without saving any changes? (See “Using vi.”)'
