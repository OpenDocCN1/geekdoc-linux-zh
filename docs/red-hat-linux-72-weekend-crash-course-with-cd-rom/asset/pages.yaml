  md: "![](img/5fe8f856723cde0b366f73584b9e64b8_114_0.png)\n\n# SESSION\n9\n\n# Learning\
    \ More Linux and\nBash Commands\n\n+   **Session Checklist**\n+   \n+   *  Changing\
    \ the Bash prompt\n+   *  Formatting text files\n+   *  Changing text in files\n\
    +   *  Compressing and uncompressing files\n\n**T**his session helps you to become\
    \ more familiar with Linux and Bash commands. First, you learn how to customize\
    \ the Bash prompt. Then, because many Linux activities involve text files, you\
    \ will learn how to format them using a few simple commands, and how to make bulk\
    \ changes to text files. This session’s last topic teaches you how to work with\
    \ compressed files.\n\n# Changing the Bash Prompt\n\nOne of the most enjoyable\
    \ features of Red Hat Linux is the degree to which you can customize and personalize\
    \ it. Bash is no different in this respect than the more visually dominant GNOME\
    \ and KDE window managers. In this section, you will learn how to change the Bash\
    \ command prompt to your liking.\n\nBefore proceeding, bear in mind that Bash\
    \ maintains four levels of prompts, named PS1, PS2, PS3, and PS4. PS1 is the primary\
    \ command prompt and the one you will learn how to change. PS2 is the prompt Bash\
    \ displays when it needs more input to complete a command. PS3 and PS4 are infrequently\
    \ used, so they are not discussed in this book.\n\nBash lets you use over 20 different\
    \ tokens to define its command prompt, the most commonly used of which appear\
    \ in Table 9-1. Each token is a single letter or symbol preceded by a backslash\
    \ (\\), which stands for a certain element of information. You can also use literal\
    \ text, such as numbers and letters, in the prompt string. To see how the prompt\
    \ is defined, type echo `$PS1` and press Enter."
  merge: -1
  img_proc: true
- pgno: 115
  md: '| Table 9-1 | *Common Bash Command Prompt Tokens* | |

    |---|---|---|

    | **Token** | **Description** | |

    | \h | Hostname up to the first . | |

    | \H | Full hostname | |

    | \t | Current time in 24-hour HH:MM:SS format | |

    | \T | Current time in 12-hour HH:MM:SS format | |

    | \@ | Current time in 12-hour a.m./p.m. format | |

    | \u | Username of the current user | |

    | \w | Current working directory | |

    | \W | Basename of the current working directory | |

    | \! | History number of the current command | |

    | \# | Command number of the current command | |


    For example, Bash’s default command prompt in Red Hat Linux is [\u@\h \W]\$. As
    you can see from Table 9-1, this corresponds to a prompt of the form `Username@hostname
    currentdir$`. On a sample system, this looks like `[kwal@luther kwal]`$` when
    he is in his home directory.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_115_0.png)


    Bash replaces the token $ with a literal $ for normal users. The literal # for
    the root user indicates when you are working as the root user.


    Suppose you do not want to see your user name or your host name. Instead, you
    want to see the current time in a.m./p.m. format. To change your Bash prompt to
    show the time this way, type `export PS1=''"@''` and press Enter. The change takes
    effect immediately, as shown in the following example:


    ```

    [kwal@luther kwal]$ export PS1=''"@'' $

    05:59pm $

    ```


    The time displayed in the prompt will update each time you press Enter.


    In Session 6, you learned how to use Bash’s command history. Table 9-1 listed
    two tokens, \! and \#, that display history information in the prompt. The \!
    Token shows the cumulative history number of the current command. The \# token
    shows the command number of the current command for the current session only.
    (*Cumulative* refers to all commands that are stored in the Bash history file
    plus all commands executed during the current session.) To illustrate the difference
    between these two tokens, the following command sets the prompt to show the history
    number:


    ```

    [kwal@noser kwal]$ export PS1=''\! \$ ''

    1019 $

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'The number to the left of $ indicates that the next command typed will be the
    1019th command. However, by setting the prompt to show the command number, the
    displayed value will be much smaller because it only counts the commands executed
    during the current session:


    ```

    1019 $ export PS1=''\!\n \$ ''

    21 $

    ```


    In this case, the number to the left of the $ shows that the next command executed
    will be the twenty-first command in this session. The command values you can see
    in the prompt make it much easier to use and manipulate Bash''s command history
    features. You can try other prompt forms until you settle on one that you like
    best.


    # Formatting Text Files


    Recall that many Linux activities involve working with text files. As Linux and
    Unix have evolved, many programs and utilities have been developed to process
    and manipulate text files. You will learn how to use two of these in this session:
    cut and fmt. These two commands reduce or eliminate much of the tedium and repetition
    of manipulating text files and reformatting text files.


    # Selecting text with cut


    The cut command selects user-specified parts of each line in a file and stores
    those parts to stdout. The general format of the cut command is:


    ```

    cut option file

    ```


    option tells cut what information to select, and file tells cut the file to use.
    Table 9-2 lists the most common options.


    # Table 9-2 Common cut Options


    | Option | Description |

    |---|---|

    | -c columns | Displays the columns specified by columns. |

    | -f fields | Selects the field number(s) specified by fields. |

    | -d delim | Uses the character delim as the field separator (the tab character
    is the default). |


    You can use the -c option to select specific columns (or characters) from each
    line. The fields are specified by number, starting with 1. By default, fields
    are tab-separated, but the -d option lets you declare a different field delimiter,
    or separator.


    Suppose you have a file named pho\*list.txt that consists of the names and telephone
    numbers of your friends, such as the following:'
