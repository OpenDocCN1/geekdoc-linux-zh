- pgno: 288
  md: '# **Back up and restoring a multi-volume archive**


    Sometimes, the capacity of a single storage medium is less than the total storage
    space needed to store the archive. In that case, you can use the M option for
    a multi-volume archive, meaning that the archive can span multiple tapes or floppies.


    > You cannot create a compressed, multi-volume archive. That means you cannot
    use the z option.


    To see how multi-volume archives work, log in as root, place one disk in the floppy
    drive, and type the following tar command:


    ```

    tar cvMf /dev/fd0 /usr/doc/ghostscript/*

    ```


    Note the M option, which tells tar to create a multi-volume archive. The tar command
    prompts you for a second floppy when the first one fills to capacity. Take out
    the first floppy and insert another floppy when you see the following prompt:


    ```

    Prepare volume #2 for `/dev/fd0''` and hit return:

    ```


    When you hit Enter, the tar program continues with the second floppy. In this
    example, you need only two floppies to store the archive. For larger archives,
    the tar program continues to prompt for floppies in case more floppies are needed.


    To restore from this multi-volume archive, type `cd /tmp` to change the directory
    to /tmp and then type:


    ```

    tar xvMf /dev/fd0

    ```


    The tar program prompts you to feed the floppies as necessary.


    Use the du -s command to determine the amount of storage you need to archive a
    directory. For example, here''s how you can get the total size of the /etc directory
    in kilobytes:


    ```

    du -s /etc

    8040    /etc

    ```


    The resulting output shows that the /etc directory contains 8,040 blocks (blocks
    are usually 1,024 bytes), requiring at least 8,040K of storage space to back up.
    If you plan to back up on multiple high-density floppies, you need about 8,040/1,200,
    or about 7 double-sided, high density, 3.5" floppy diskettes.


    # **Backing Up on Tapes**


    Although backing up on tapes is as simple as using the right device name in the
    tar command, you do need to know some nuances of the tape device to use it well.
    When you use tar to back up to the device named /dev/st0 (the first SCSI tape
    drive), the tape device automatically rewinds the tape after the tar program finishes
    copying the archive to the tape. The /dev/st0 device is called a *rewinding tape
    device* because it rewinds tapes by default.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'If your tape can hold several gigabytes of data, you may want to write several
    tar archives, one after another, to the same tape. Otherwise, much of the tape
    may be empty. However, do not want the tape device to rewind the tape after the
    tar program finishes. To help you with this, some Red Hat Linux tape devices are
    non-rewinding devices. The non-rewinding SCSI tape device is called /dev/nst0.
    Use this device name if you want to write one archive after another on a tape.


    After each archive, the non-rewinding tape device writes an end-of-file (EOF)
    marker to separate one archive from the next. You can use the mt command to control
    the tape. Essentially, it moves from one marker to the next or rewinds the tape.
    For example, after you finish writing several archives to a tape using the /dev/nst0
    device name, you can rewind the tape with the following command:


    ```

    ```bash

    mt -f /dev/nst0 rewind

    ```

    ```


    After rewinding the tape, you can use the following command to extract files from
    the first archive to the current disk directory:


    ```

    ```bash

    tar xvf /dev/nst0

    ```

    ```


    After that, you must move past the EOF marker to the next archive. To do this,
    use the following mt command:


    ```

    ```bash

    mt -f /dev/nst0 fsf 1

    ```

    ```


    This positions the tape at the beginning of the next archive. You can now use
    the tar xvf command again to read this archive.


    ![](img/5fe8f856723cde0b366f73584b9e64b8_289_0.png)


    > > If you save multiple archives on a tape, you have to keep track of the archives
    yourself.


    # Performing incremental backups


    Suppose you backed up your system’s hard disk on a tape using the tar command.
    Because such a full backup can take quite some time, you do not want to repeat
    this task every night. Besides, only a small number of files may have changed
    during the day. You can use the find command to list those files that have changed
    in the past 24 hours, as follows:


    ```

    ```bash

    find / -mtime -1 -type f -print

    ```

    ```


    This command prints a list of files that have changed within the last day. The
    -mtime -1 option means you want the files that were modified less than one day
    ago. You can now combine the find command with the tar command to back up only
    those files that have changed within the last day, as follows:


    ```

    ```bash

    tar cvf /dev/st0 ‘find / -mtime -1 -type f -print’

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'When you place a command between single back quotes (`), the shell executes
    that command and places the output at that point in the command line. The net
    result is that the tar program saves only the changed files in the archive. Thus,
    you get an incremental backup that includes files that have changed since the
    previous day.


    # Automating backups


    In Session 25, you learned how to use crontab to set up recurring jobs called
    cron jobs, which are tasks that the Linux system performs at regular intervals.
    Backing up your system is a good use of the cron facility. Suppose your backup
    strategy is as follows:


    +   • Every Sunday morning at 1:15 a.m., you back up the entire disk to a new
    tape.

    +   • On the other days of the week (Monday through Saturday), you perform an
    incremental backup at 3:10 a.m. by saving only those files that have changed during
    the past 24 hours. Incremental backups are stored on a separate tape than the
    full backup, but all incremental backups are appended to this tape in order to
    save tapes.


    To set up this automated backup schedule, log in as root and type the following
    lines in a file named backups (this example assumes that you are using a SCSI
    tape drive):


    ```

    15 1 * * * / t e v / d e v / s t 0 t 10 3 * * * 1-6 tar zcvf /dev/nst0 `find /
    -mtime -1 -type f -print`


    Next, submit this job schedule with the following crontab command:

    crontab backups

    ```


    Now you should be set for an automated backup. All you need to do is place a new
    tape in the tape drive on Sunday for the full backup, and on Monday, to store
    that week’s incremental backups. You should also label each tape appropriately.


    # Troubleshooting


    If files restored from a backup tape are corrupted, try using tar’s -W or --verify
    options to verify the tar archive as it is written.


    Before using a brand new tape, it should be retensioned in order to equalize tension
    across the tape and to prevent stretching. The command to do this is mt -f /dev/nst0
    retn.


    If you seem to be losing backups, make sure that your backup commands, such as
    the tar commands discussed in this session, are using the non-rewinding device
    (/dev/nst0, for example). Remember, after a tape operation completes, the rewinding
    device automatically rewinds to the beginning of the tape, so the result of a
    second backup operation will partially or completely overwrite the results of
    a previous one.'
  merge: -1
  img_proc: true
