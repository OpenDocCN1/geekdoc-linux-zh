    the down option. the words UP and RUNNING will no longer appear when you list
    the interface and no data will be to go in either direction across that interface.


    When your network interfaces are up, there are tools you can use to view information
    about those interfaces and associated NICs.


    # ## Starting and Stopping Network Services


    You can start and stop services associated with your network interfaces in much
    the same way that you used the netif script to start and stop the interfaces.
    Services such as the Secure Shell (sshd) and Network File System (nfsd) can be
    set to start automatically the system boots based on settings in the `/etc/rc.conf`
    file.


    Information on how to configure and start network services is contained in Chapter
    10. To find out the options when you run network service scripts, just type the
    path to the script with no options. For example:


    ```

    # /etc/rc.d/sendmail      Check options available with start-up script

    Usage: /etc/rc.d/sendmail [fast|force|one](start|stop|restart|rcvar|status|poll)

    ```


    Here are some examples of starting and using network services that have already
    configured:


    ```

    # /etc/rc.d/sshd restart   Stop and start the SSH service

    # /etc/rc.d/sshd reload   Reload config files from /etc/ssh directory

    ```'
