  md: '# C


    # Personal Configuration Files


    In the home directory for every user account is a set of files and directories
    containing personal settings for that account. Because configuration files and
    directories begin with a dot (.), you don''t see them if you open a folder window
    to your home directory. Likewise, you typically need the -a option to ls to see
    those files when you list directory contents.


    | IN THIS APPENDIX |

    | Shell configuration files |

    | Browser and e-mail configuration files |

    | Desktop configuration files |

    | Network services configuration files |

    | Music player configuration files |


    This appendix describes many of the dot files each user can work with a BSD system.
    After creating configuration files you like, you can, when appropriate, do such
    things as save them to /usr/share/sk (so every new user gets them) or save them
    if the user moves to another machine.


    > NOTE Some of the files described in this appendix won''t exist until you start
    the application associated with the files or create the files manually.


    Bash shell files: Home directory files for storing and changing bash settings:


    +   - .bash_profile: Commands added to this file are executed when you invoke
    bash as a login shell or use bash as your default shell.


    +   - .bashrc: Commands added to this file are executed when you start a bash
    shell which is not a login shell, and your default shell is not bash. (To have
    .bashrc sourced when your default shell is set to bash, add the following line
    to your .bash_profile:test -f ~/.bashrc && ~/.bashrc.)


    +   - .bash_logout: Commands added to this file are executed when you log out
    from a bash shell.


    +   - .bash_history: Stores history of commands run by the user from a bash shell.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Appendix C: Personal Configuration Files


    **C shell files:** Besides system-wide /etc/profile and /etc/csh.rc files, home
    directory files for storing and caching C shell (tcsh and csh) settings include:


    +   - .login: Commands added to this file are executed when you log in to a C
    shell.


    +   - .tcshrc or .cshrc: Commands added to either of these files are executed
    when you start any C shell.


    +   - .history Stores history of commands run by the user from a C shell.


    **Bourne shell files:** If you are using the Bourne (sh) shell, which is the default
    for users in FreeBSD, the .shrc in your home directory is important to know about.
    Commands in this file run when the sh shell starts. The file sets several aliases
    for you and sets your line editor (emacs by default). This is a good place to
    add directories to your $PATH or change your shell prompt. (I always change the
    default editor from emacs).


    **Elinks browser files:** With the elinks-based browser, after the system configuration
    file is read (/usr/local/etc/elinks/elinks.conf), if it exists, several files
    are used for configuration settings. The following are contained in each user''s
    .elinks directory:


    +   - elinks.conf: Contains individual elinks configuration settings.


    +   - bookmarks: Contains any bookmarks you set while using elinks.


    +   - cookies: Stores cookies obtained while using elinks.

    -


    +   - exmodhost: Contains ex mode history.


    +   - globhist: Contains history of information entered into forms while using
    elinks.


    +   - searchhist: Contains a history of web addresses visited while using elinks.


    +   - .tcshrc or .cshrc: Commands added to either of these files are executed
    when you start any C shell.


    **Evolution files:** Configuration files, mail boxes, calendars, and other files
    needed to support the Evolution groupwise suite are contained in the .evolution
    directory in each user''s home directory. Files are used directly in this directory
    structure, but should be modified through the Evolution client. This directory,
    however, is a place to check if the disk space consumed in your home directory
    is growing out of control.


    **Firefox configuration files:** If you are using the Firefox browser, settings
    for your use of the browser are stored in the .mozilla/firefox directory of your
    home directory. If you ever plan to move to another machine or a different web
    browser, you might want to keep your bookmarks.html file. That file can be exported
    later to a different environment.


    278'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Appendix C: Personal Configuration Files


    **GNOME configuration files**: Users who run the GNOME desktop will have a .gnome
    directory in their home directories. Within sub-directories are configuration
    files for GNOME applications you run, such as Rhythmbox player (rhythmbox), Totem
    video player (totem) and Evince viewer (evince/). Many of config files are in
    XML format, so you can read them (although you typically wouldn''t edit them directly).
    Keeping this information is useful because it can include album art, playlists,
    and preferences (such as colors and tones).


    **KDE configuration files**: If you run the KDE desktop, the .kde directory contains
    information relating to the KDE desktop, window manager, and related KDE applications.
    With GNOME, many KDE configuration files are stored in XML format, so you can
    view their contents with any text editor. You can drop scripts in the .kde/Autostart
    directory to have them executed on KDE startup.


    **mail configuration files**: Settings for the mail command are stored in the
    .mailrc and .mail_aliases files.


    **ncptp configuration files**: If you use ncftp FTP client, settings relating
    to your ncftp sessions are stored in the .ncptp directory in your home directory.
    The firewall file in directory you set firewalls, including information for using
    ncftp through a proxy server. The history file keeps a list of commands that were
    previously run during FTP sessions. The log file gathers error and informational
    messages. The prefs_v3 file contains ncftp preferences.


    **Trusted hosts**: If you allow the system-hosts.allow or .hosts files, they can
    add a list of trusted hosts, and optionally, users from those hosts to their own
    .hosts file in their home directories. Services such as login or rcp are enabled
    (/etc/inetd.conf), a person from the trusted host can use those hosts to log in
    or copy files to your machine without entering a password. This is a good thing
    to do if all of the computers on your network are wired together, in the same
    room, in a cabin in the Himalayas, with no outside connections. Otherwise, you
    should consider using trusted hosts in this way to be very insecure.


    **Secure Shell configuration files**: If you use the secure shell (ssh) service,
    the .ssh directory in your home directory can be managed with security settings.
    Here are examples:


    +   - known_hosts: Keeps a list of host computers you have verified as authentic.

    - identity: Private authentication keys from SSH protocol version 1.

    - id_rsa: Private authentication keys from SSH protocol version 2.

    - id_dsa: Private authentication keys from SSH protocol version 2.

    - identity.pub, id_dsa.pub, id_rsa.pub: Public keys for the three private keys
    just described.

    - authorized_keys: File that contains public keys of remote clients.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Appendix C: Personal Configuration Files


    **Virtual network computing files:** If you use vncserver utility to share your
    desktop with other computers on the network, settings for how vncserver behaves
    are stored in your home directory''s .vnc directory. The xstartup file in that
    directory contains applications that run on the VNC when you start it up. The
    vncpassword file holds the passwords stored for use by vncserver.


    For each display that is started, a file named host#.pid is created (where host
    is the hostname and # is the display number). There is also a host#.pid file for
    each display containing the process ID of the Xvnc process associated with the
    display.


    **X startup files:** If you start your desktop interface using the startx command,
    .xinitrc file can be used to indicate which desktop environment to start. For
    example, add /usr/local/bin/gnome-session to .xinitrc to start the GNOME desktop
    environment. Add /usr/local/bin/kde to .xinitrc to have the KDE desktop environment
    start.


    **MMMS configuration files:** If you use the MMMS music player, configuration
    files of that player are contained in the .mmms directory in your home directory.
    Subdirectories of that directory include Plugins (which hold audio plug-ins) and
    Skins (which holds available skins to use with the player). The config file in
    that directory holds preference settings for MMMS. The mmms.m3u file contains
    paths for songs the player has played.'
