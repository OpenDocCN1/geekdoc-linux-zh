    # Using the Shell


    After you open a shell (whether from a text-based login or Terminal window), the
    shell environment is set up based on who started the shell. Each user''s default
    shell is assigned by the user''s entry in the /etc/passwd file. By default, the
    user''s password is set to csh (/bin/csh) and regular users are set to sh (/bin/sh).
    To use the bash shell, you can set your shell to /usr/local/bin/bash. Examples
    in this section you use the bash shell.


    Bash shell settings for all users'' shells are located in /etc/profile. User-specific
    settings are determined by commands executed from several dot files in the user''s
    home directory (if they exist): .bash_profile, .bash_login, and .profile. When
    a shell is closed, any commands in the ~/.bash_logout file permanently changes
    the user''s shell settings but does not affect shells that are already running.
    (Others shells use different configuration files.)


    There are a variety of ways in which you can list and change your shell environment.
    One of the biggest ways is to change which user you are; in particular, to become
    the super user (see the section "Acquiring Super User Power" later in this chapter).


