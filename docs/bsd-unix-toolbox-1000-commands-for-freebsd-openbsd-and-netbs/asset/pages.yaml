  md: '# Chapter 11: Managing Network Connections


    As you can see, the longest hop is between 4 (Global Crossing probably in Minneapolis)
    and 5 (GC in Seattle). That gap is not really a bottleneck; it reflects the distance
    between those hops. Sometimes, the last hops look like this:


    28 * * *

    29 * * *

    30 * * *


    The lines of asterisks (*) at the end of the trace can be caused by firewalls
    that block traffic to the target. However, if you see several asterisks before
    the destination, those can indicate heavy congestion or equipment failures and
    to a bottleneck.


    By default, traceroute uses UDP packets, which provide a more realistic picture
    than ICMP. That''s because some Internet have lower priority to ICMP traffic.
    If you''d still like to use ICMP packets, try this command:


    ```

    # traceroute -I boost.turbosphere.com Use ICMP packets to trace a route

    ```


    To trace a route to home using TCP packets, use the -T option to traceroute:


    ```

    # traceroute -P boost.turbosphere.com Use TCP packets to trace a route

    ```


    By default, traceroute connects to port 80. You can set a different port using
    the -p option:


    ```

    # traceroute -P -p 25 boost.turbosphere.com Connect to port 25 in trace

    ```


    You can view IP addresses of hostname by disabling name resolution of hops:


    ```

    $ traceroute -n boost.turbosphere.com Disable name resolution in trace

    ```


    To view and manipulate the kernel''s routing table, the route command used to
    be the tool of choice. This is slowly being replaced by the ip route command in
    Linux distributions, but is still commonly used in BSD distributions.


    You can use the route command to display your local routing table. Here are two
    examples of the route command, with and without DNS resolution:


    ```

    # route get freebsd.org Display routing table information

    route to: freebsd.org

    destination: default

    mask: 0.0.0.0

    gateway: 10.0.0.1

    interface: fxp0

    flags: <UP, GATEWAY, DONE, STATIC>

    recv sendpipe ssthresh rtt rvar hopcount mtu expire

    0 0 0 0 0 1500 0

    # route -n get freebsd.org Display routing table without DNS lookup

    route to: 69.147.83.40

    destination: default

    ```


