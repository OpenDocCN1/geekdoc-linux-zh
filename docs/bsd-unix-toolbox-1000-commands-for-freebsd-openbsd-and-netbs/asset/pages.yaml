  md: '# Chapter 5: Manipulating Text


    # Converting Text Files to Different Formats


    Text files in the UNIX use a different end-of-line character (\n) than those used
    in the DOS/Windows world (\r\n). You can view these special characters in a text
    file with the od command:


    ```

    $ cp /etc/hosts myfile.txt

    $ od -c t x1 myfile.txt

    ```


    So they appear properly when copied from one environment to the other, it is necessary
    to convert the files. Here are some examples using the unix2dos and dos2unix commands
    (pkg_add -r unix2dos):


    ```

    $ unix2dos < myfile.txt > myfile.txt

    $ cat myfile.txt | dos2unix > myfile.txt

    $ file myfile.txt myfile.txt

    mysfile.txt: ASCII English text, with CRLF line terminators

    myfile.txt: ASCII text

    ```


    The unix2dos example just above converts a BSD or UNIX plain text file (myfile.txt)
    to a DOS or Windows text file (myfile.txt). The dos2unix example does the opposite
    by converting a DOS/Windows file to a BSD/UNIX file. Both dos2unix and unix2dos
    are in the unix2dos package.


    # Summary


    BSD and UNIX systems traditionally use plain text files for system configuration,
    documentation, output from commands, and many forms of stored information. As
    a result, many commands have been created to search, edit, and otherwise manipulate
    plain text files. Even with today''s GUI interfaces, the ability to manipulate
    plain text files is critical to becoming a power BSD user.


    This chapter explores some of the most popular commands for working with plain
    text files in BSD systems. These commands include text editors (such as vi, nano,
    and joe), as well as commands that can edit streaming data (such as sed and awk
    commands). There are also commands sorting text (sort), counting text (wc), and
    translating characters in text (tr).'
  merge: -1
