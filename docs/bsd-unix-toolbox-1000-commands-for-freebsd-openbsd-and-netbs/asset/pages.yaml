  md: '# # 7

    # Administering File Systems


    File systems provide the structures in which files, directories, devices, and
    other elements of the system are accessed from your BSD system. FreeBSD uses the
    UNIX File System (UFS), although it also supports many different types of file
    systems (ext3, mdos, cd9660, nfs, and so on) to some extent. FreeBSD can also
    work with file systems on many different types of media (hard disks, CDs, USB
    flash drives, ZIP drives, and so on.)


    Creating and managing disk slices, partitions, and the file systems on partitions
    are among the most critical jobs in administering a BSD system. That''s because
    if you mess up your file system, you might well lose the critical data stored
    on your computer''s hard disk or removable media.


    This chapter contains commands for partitioning storage media, creating file systems,
    mounting and unmounting file systems, and checking file systems for errors and
    disk space.


    +   ### IN THIS CHAPTER

    * Understanding file systems

    * Partitioning disks with sysinstall, fdisk, and bsdlabel

    * Working with Linux file systems

    * Using swap with swapon, swapoff, and swapinfo

    * Mounting file systems

    * Checking the systems

    * Checking disk space with du and df


    # # Understanding File System Basics


    Even though there are a lot of different file system types available for FreeBSD
    systems, there are not many that you need to set up a BSD system. If you are coming
    from a Linux or other UNIX system background, however, you should start by understanding
    how BSD systems divide up disks into slices and partitions.


    In FreeBSD, the four primary parts into which you can divide a hard disk are called
    slices. Within each slice that''s dedicated to FreeBSD, the disk'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Chapter 7: Administering File Systems


    space can be divided into what are referred to as partitions. You can have multiple
    partitions within a slice, each representing a different part of the total file
    system (such as /user, /var, /tmp, and of course the root partition).


    > NOTE If you are coming from a Linux background, BSD users call slices what you
    refer as partitions. The reality that Linux systems can have more than four partitions
    is that they can have extended partitions.


    # Setting Up The Disk Initially


