    # Monitoring Memory Use


    Few things will kill performance faster than running out of memory. Commands such
    as top get some information about how your RAM and swap are being used. The vmstat
    command gives information about memory use and can run continuously.


    The top command provides a means of watching the currently running processes,
    with those processes sorted by CPU usage or memory (Chapter 9 for a description
    of top for running processes). However, you can also use top to watch your memory
    usage in a screen-oriented view. Here is an example:


    ```

    $ top

    last pid: 1619; load averages: 0.61, 0.85, 0.62 up 02:02:39 17:23:49

    85 processes: 2 running, 83 sleeping

    CPU states: 37.5% user, 0.0 nice, 15.4% system, 0.8% interrupt, 46.3% idle

    Mem: 76M Active, 31M Inact, 79M Wired, 2476K Cache, 34M Buf, 53M Free

    Swap: 484M Total, 25M Used, 459M Free, 5%

    ```


    | PID USERNAME THR PRI NICE SIZE RES STAT TIME WCPU COMMAND |

    | 1618 | 3 117 | 051964K 35352K | 0:07 7.96% totem |

    | 1462 | 1 96 | 08501K 15968K select | 0:33 5.66% Xorg |

    | 1491 | 1 96 | 01281K 8008K select | 0:05 1.03% metastability |

    | 1494 | 1 96 | 03072K 10928K select | 0:08 0.44% gnome-panel |


    To exit top, press q. The top command shows the total memory usage for RAM (Mem:)
    and swap space (Swap:). However, top is screen oriented and provides-on monitoring,
    you can watch memory usage change every two seconds (by default). The most useful
    command to analyze a process'' memory usage is RES, which shows the process''
    actual physical RAM, also known as resident size. Run top -ores and running processes
    will be displayed in resident memory use order to sort by the res column:


    ```

    $ top -ores

    | PID USERNAME THR PRI NICE SIZE RES STAT TIME WCPU COMMAND |

    | 1673 | 3 112 | 056288K 38660K | | 0:22 0.00% totem |

