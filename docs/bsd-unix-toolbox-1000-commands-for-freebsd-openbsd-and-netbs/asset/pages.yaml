  md: '# 8


    # # Backups and

    ovable Media


    Data backups in UNIX were traditionally done by running commands to archive and
    compress the files to backup, then writing backup archive to tape. Choices for
    archive tools, compression techniques, and backup media have grown tremendously
    in recent years. Tape archiving has, for many, been replaced by techniques for
    backing up data over the network, to other hard disks, or to CDs, DVDs, or other
    low-cost removable media.


    This chapter details some useful tools for backing up and restoring your critical
    data. The first part of the chapter details how to use basic tools as tar, gzip,
    and rsync for backups.


    ### IN THIS CHAPTER


    **Creating backup archives with tar**


    **Compressing backups with gzip, bzip2, and lzip**


    **Backing up over the network with SSH**


    **Doing network backups with rsync**


    **Making backup ISO images with mkisofs**


    **Burning backup images to CD or DVD with ddrecord and growsis**


    # # Backing Up Data to

    Compressed Archives


    If you are coming from a Windows background, you may be used to tools like WinZip
    and PKZIP, which both archive and compress groups of files in one application.
    BSD systems offer separate tools for gathering groups of files into a single archive
    (such as tar) and compressing that for efficient storage (gzip, bzip2, and lzip).
    However, you can also do the two steps together using additional options to the
    tar command.


    # # Creating Backup Archives with tar


    The tar command, which stands for tape archiver, dates back to early UNIX systems.
    Although magnetic tape was the common medium that tar wrote to originally, today,
    tar is most often used to create an archive file that can be distributed using
    a variety of media.'
