    * * 1,4,7,10 * find | grep .doc > /var/sales/documents.txt

    $ cronab -r Delete your cronab file

    ```


    An alternative to cron, the cron facility is the anacron (pkg_add -r anacron).
    With anacron, as cron you can configure commands to run periodically. However,
    anacron is most appropriate for machines that are not on all the time. If a computer
    was off during the scheduled time, the next time the computer is on, the anacron
    facility makes sure that the commands that were missed during the down time run
    after the system resumes.


    # Summary


    Watching and working with the processes that run on your BSD system are important
    activities to make sure that your system is operating efficiently. Using commands
    such as ps and top, you can view the processes running on your system. You can
    also use pgrep to search for list particular processes.


    With commands such as nice and renice, you can adjust the recommended priorities
    at selected processes run. When a process is running, you can change how it is
    running or kill the process by sending it signal from the kill or killall commands.


    After launching a command from the current shell, you can set that command''s
    process to run in the background (bg) or foreground (fg). You can also stop and
    restart the process using control codes.


    To schedule a command to run at a later time, you can use the at or batch commands.
    To set up a command to run repeatedly at intervals, you can use the cron or anacron
    facilities.'
