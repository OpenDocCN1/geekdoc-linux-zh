  md: '# Chapter 14: Locking Down Security


    The user name must be from one to 16 characters. Most people use lowercase letters
    and digits, with the first character being a letter. Default user UIDs (Uid) start
    at 1001. The default group is a new group with the same name as the user name.


    Login class is nothing like all UNIX-like systems. The default class is best for
    regular users (on login classes a bit later). Password-based authentication (yes)
    is the normal authentication. Select a good password (or passwords later as will).


    After you have answered all the questions, you have a chance to see and approve
    of the resulting account information.


    ```

    Username : jimbo

    Password : *****

    Full Name : James Bolatter

    Uid : 1005

    Class :

    Groups : jimbo

    Home : /home/jimbo

    Shell : /usr/local/bin/bash

    Locked : no

    OK?(yes/no):

    Add user? (yes/no): no

    Goodbye!

    ```


    As you can see, the home directory is /home/jimbo. The bash shell was assigned,
    to replace sh as the default shell (like bash for its more diverse features).
    Apparently this is the fifth user configured on your system (Uid 1005).


    Depending on the login class of the user you just added, some things will happen.
    For the default user class, an entry for the user is added to the /etc/passwd
