  md: '# Chapter 5: Manipulating Text


    To view the top of a file, use `head`:


    ```

    $ head myfile.txt

    $ cat myfile.txt | head

    ```


    Both of these commands use the `head` command to output the top 10 lines of the
    file. You can specify the line count as a parameter to display any number of lines
    from the beginning of a file. For example:


    ```

    $ head -n 50 myfile.txt

    $ ps auxw | head -n 15

    ```


    This can also be done using this outdated (but shorter) syntax:


    ```

    $ tail -50 myfile.txt

    $ ps auxw | tail -15

    ```


    You can use the tail command in a simple way to view the end of a file or command
    output:


    ```

    $ tail -n 15 myfile.txt

    $ tail -15 myfile.txt

    $ ps auxw | tail -n 15

    ```


    The tail command can also be used to continuously watch the end of a file as it
    is written by another program. This is very useful for reading log files when
    troubleshooting Apache, In Daemon, or other system services:


    ```

    $ tail -f /var/log/messages

    $ tail -f /var/log/maillog

    $ tail -f /var/log/auth.log

    ```


    Watch system messages live

    Watch server messages live

    Watch login attempt live


    # Paging Through Text


    When you have a large chunk of text and need to get more than just its beginning,
    or end, you need a tool to `page` through the text. The original UNIX system pager
    was the more command:


    ```

    $ ps auxw | more

    Page through the output of ps (press spacebar)

    $ myfile.txt

    Page through the contents of a file

    ```


    However, more has some limitations. For example, in the file with ps above, could
    not scroll up. The less command was created as a more powerful and user-friendly
    more. The common saying when less was introduced was: “What is less? less is more!”
    We recommend you no longer use more, and use less instead.


    > NOTE The less command has no benefit worth noting. Unlike text editors such
    as vi, it does not read the entire file when it starts. This results in faster
    start-up times when viewing large files.'
