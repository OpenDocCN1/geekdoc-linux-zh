    # Back Up with unison


    Although the rsync command is to back up one machine to another, it assumes the
    machine being backed up is the only one where the data is modified. What if you
    have two machines that modify the same file and you want to sync those files?
    Unison is a tool that you will need for


    It''s common for people to work with the same documents on their laptop and desktop
    systems. These machines might even run different operating systems. Because unison
    is a cross-platform application, it lets you sync files that are on both BSD and
    Windows systems. In FreeBSD, to use unison you must install the package (the pkg_add
    -r unison command).


    With unison, you can define two roots representing the paths to synchronize. These
    roots can be local or remote over ssh. For example:


    ```

    $ unison /home/francois ssh://server1/home/fcaen

    $ unison /home/francois /mnt/backups/francois-homedir

    ```


    Unison contains both graphical and command-line tools for doing unison backups.
    It will try to run the graphical version by default. This may fail if you don''t
    have a desktop-top running or if you''re launching unison from within. To force
    unison to run in command line, add the -ui text option as follows:


    ```

    $ unison /home/francois ssh://server1/home/fcaen -ui

    Contacting server...

    francois@server1''s password:

    Looking for changes

    Waiting for changes

    Reconciling changes

    local server1

    newfile ----> memo.txt [f] y

    Propagating updates

    ```


    The unison will then compare the two roots and for each change that occurred since
    last time, in the example above, there is a new file called memo.txt on the local
    system. And are asked if you want to proceed with the update (in this case, copy
    memo.txt from the local machine to server1). Type y to do the updates.


