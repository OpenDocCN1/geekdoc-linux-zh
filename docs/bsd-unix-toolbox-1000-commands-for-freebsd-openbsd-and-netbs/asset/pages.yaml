    # Backing Up to Removable Media


    The capacity of CDs and DVDs, and the low costs of this media, has made attractive
    options as computer backup media. Using tools that commonly come with BSD systems,
    you can gather files to back up into CD or DVD images and burn those to the appropriate
    media.


    Command-line tools such as mkisos (for creating CD images) and cdrecord (for images
    to CD or DVD) once there are many graphical ends to those tools you could also
    consider. For example, GUI tools for mastering and burning CDs/DVDs include K3b
    (the KDE CD and DVD Creator) and Nautilus (GNOME''s file manager that offers a
    CD-burning feature). Other GUI tools for burning CDs include combust, X-CD-Roast,
    and graveman.


    The commands for creating file system images to back up to CD or DVD, as well
    as burn those images, are described in this section. To get the mkisos and cdrecord
    commands you need to install the cdtools package (pkg_add -r cdtools).


    # Creating Backup Images with mkisos


    Most CDs and DVDs can be accessed on both Windows and BSD systems because they
    are created using the ISO9660 standard for formatting the information on those'
