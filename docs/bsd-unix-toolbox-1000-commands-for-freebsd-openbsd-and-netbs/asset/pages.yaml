    # Troubleshooting Network Problems


    Troubleshooting networks is generally done from the bottom layer up. As discussed
    in the beginning of this chapter, the first step is to make sure that the physical
    network layer components (cables, NICs, and so on) are connected and working.
    Next, check if the links between physical nodes are working. After that, there
    are lots of tools for checking the connectivity to a particular host.


    # Checking Connectivity to a Host


    When you have a link and no duplex amass, the next step is to ping your default
    gateway. You should have configured the default gateway (gw), whether you did
    that manually or set it automatically by DHCP when the network started. To check
    your default gateway in the actual routing table, use the route command to find
    a host on the other side of that gateway as follows:


    ```

    $ route get example.com

    route to: www.example.com

    destination: default

    mask: default

    gateway: 10.0.0.1

    interface: fxp0

    ```


