  md: '# Chapter 13: Doing Remote System Administration


    # Logging in Remotely with ssh


    To securely log in a remote host, you can use either of two different syntaxes
    to specify the user name:


    ```

    $ ssh -l francois myserver

    $ francois@myserver

    ```


    However, cp and sftp commands (discussed in Chapter 12) only support the user@server
    syntax, so we recommend you get used to that. If you don''t specify the user name,
    ssh will attempt to log in using the same user you are logged in as locally. When
    you need to forcefully exit your ssh session, type the escape sequence of a tilde
    followed by a period (-).


    # Accessing SSH on a Different Port


    For security purposes, a remote host may have its SSH service listening to a different
    port than the port number 22. If that''s the case, use the -p option to ssh to
    contact that service:


    ```

    $ -p 12345 francois@turbosphere.com Connect to SSH on port 12345

    ```


    # Using SSH to Do Tunneling (X11 Port Forwarding)


    With tunneling configured as described earlier, the SSH service forwards X Window
    System clients to your local display. However, tunneling can be used with other
    TCP-based protocols so they appear on the local desktop:


    # Tunneling for X11 Clients


    The following sequence of commands illustrates starting an SSH session, then starting
    a few applications so:


    ```

    $ ssh -X francois@myserver Start ssh connection to myserver

    francois@myserver''s password: *****

    [francois@myserver ~] echo $DISPLAY Show the current X display entry

    localhost:10.0 SSH sets display to localhost:10.0

    [francois@myserver ~]$ xclock Show moving desktop eyes

    [francois@myserver ~]$ gnome-system-monitor Monitor system activities

    [francois@myserver ~]$ xcalc Use a calculator

    ```


    As more connections are requested, the $DISPLAY will be set to 11.0, 12.0, and
    so on:


    # Tunneling for CUPS Printing Remote Administration


    X11 is not the only protocol that can be tunneled over SSH. You can forward any
    TCP port with SSH. This is a great way to configure secure tunnels quickly and
    easily. No configuration is required on the server side.


    228'
