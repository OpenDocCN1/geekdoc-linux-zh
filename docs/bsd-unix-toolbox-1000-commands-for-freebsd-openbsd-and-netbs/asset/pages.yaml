  md: '# Chapter 8: Backups and Removable Media


    The fact that the tar command is rich in features is reflected in the dozens of
    options with tar. The basic operations of tar, however, are used to create a backup
    archive (-c), extract files from an archive (-x), and update files in an archive
    (-u). You can also append files to (-r or -A) or list the contents of an archive
    (-t).


    > NOTE Although the tar command is available on nearly all UNIX and BSD systems,
    it behaves differently on many systems. For example, Solaris does not support
    -z to manage tar archives compressed in gzip format. The Star (pronounced ess-tar)
    command supports access control lists (ACLs) and file flags (for extended permissions
    used by Samba).


    As part of creating a tar archive, you can add options that compress the resulting
    archive. For example, add -j to compress the archive in bzip2 format or -z to
    compress in gzip format. By default, regular tar files end in .tar while compressed
    files end in .tar.bz2 (compressed with bzip2) or .tar.gz (compressed with gzip).
    If you compress a file with lzop (see www.lzop.org), the compressed file should
    end in .tar.lz. As root, use pkg_add -r lzop to install it.


    In addition to being used for backups, tar files are popular ways to distribute
    source code and binaries from software projects. That''s why you can expect every
    BSD and UNIX-like system to contain the tools you need to work with tar files.


    > One quirk of the tar command comes from the fact that tar was created before
    there were standards how options are entered. Although you can prefix tar options
    with a dash, it''s not always necessary. You might see a command that begins tar
    xvf with no dashes to indicate the options.


    A classic example using the tar command might combine old-style options and pipes
    for compressing the output, for example:


    ```

    $ tar *.txt | gzip -c myfiles.tar.gz Make archive, zip it and output

    ```


    The example just illustrates a two-step process you might find in documentation
    for old UNIX systems. The tar creates (-c) an archive from all .txt files in the
    current directory. Instead of writing to the default tape device (/dev/tape)


    New tar versions, on modern BSD systems, can create the archive and compress the
    output in one step:


    ```

    $ tar czf myfiles.tar.gz *.txt Create zipped tar file of .txt files

    $ tar cvzf myfiles.tar.gz *.txt Be more verbose creating archive

    ```'
