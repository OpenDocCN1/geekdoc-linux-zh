    # Locating Files with find


    Before the days of `locate`, the way to find files was with the `find` command.
    Although `locate` will come up with a file faster, `find` has many other powerful
    options for finding files based on attributes other than the name.


    > NOTE Searching the entire file system can take a long time to complete. Before
    searching the whole file system, considering a subset of the file system or excluding
    certain directories or remotely mounted file systems.


    This example searches the root file system (/) recursively for files named wlan_wp.ko:


    ```

    $ find -name "wlan_wp.ko" -print

    find /tmp/fan-root: Permission denied

    /usr/local/etc/samba: Permission denied

    /usr/share/man/man4/wlan_wp.4.gz

    /usr/share/man/cat4/wlan_wp.4.gz

    /boot/kernel/wlan_wp.ko

    ```


    Running find as a normal user can result in long lists of Permission denied if
    find tries to enter a directory you do not have permissions to. You can filter
    out the inaccessible directories:


    ```

    $ find -name wlan_wp.ko 2>&1 | grep -v "Permission denied"

    ```


    Or send all errors to the /dev/null bit bucket:


    ```

    $ find -name wlan_wp.ko 2>/dev/null

    /boot/kernel/wlan_wp.ko

    /boot/GENERIC/wlan_wp.ko

    /usr/share/man/man4/wlan_wp.4.gz

    ..

    ```


    Because searches with find are sensitive and must match the name exactly (wlan_wp.ko
    won''t match other instances of wlan_wep), you can use regular expressions to
    make your searches more inclusive. Here''s an example:


    ```

    $ find /usr/bin/ -amin -2

    /usr/bin/

    /usr/bin/find

    ```


    You can also find files on timestamps. This command finds files in /usr/bin/ that
    have been accessed in the past two minutes:


    65'
  merge: -1
