  md: '# Chapter 9: Checking and Managing Running Processes


    # Listing Active Processes


    To see which processes are currently running on a system, most people use the
    ps and top commands. The ps command gives you a snapshot (in a simple list) of
    processes running at the moment. The top command offers a screen-oriented, constantly
    updated listing of running commands, sorted as you choose (by CPU use, I/O, UID,
    and so on).


    NOTE To see all the output in the following examples, you need to mount the proc
    file system. One way to do that is to add the following line to /etc/fstab (as
    root user):


    ```

    proc    /proc    procfs  0 0

    ```


    Then type the following command (as root user):


    ```

    # mount /proc

    ```


    # Viewing Active Processes with ps


    Every ps (as well as every system developed from UNIX, such as Linux, Mac OS X,
    and others) includes the ps command. Over the years, however, slightly different
    versions of ps have appeared, offering slightly different options. Because ps
    dates back to the first UNIX systems, it also supports non-standard ways of entering
    some options (for example, allowing you to drop the dash before in some cases).


    The different uses of ps shown in this chapter will work on FreeBSD, OpenBSD,
    NetBSD, and most other UNIX and Linux systems. Here are some examples of how you
    can run processes for the current user (Table 9-1 contains columns of ps output):


    $ ps List processes of current user at current shell

