    # Working with System Logs


    Most BSD systems are configured to log many of the activities that occur on those
    systems. Those activities are then written to log files located in the /var/log
    directory or its subdirectories. This logging is done by the Syslog facility.


    FreeBSD uses syslog (log daemon) as part of the basic installed system to manage
    system logging. That daemon is started automatically by the syslog initialization
    script (/etc/rc.d/syslogd). Information about system activities is directed to
    files in the /var/log directory in the /etc/syslog.conf file.


    You can check any of the log files manually (using vi or another favorite text
    editor).


    You can send your own messages to the syslogd logging facility using the logger
    command. Here are a couple of examples:


    ```

    # logger Added new card Message added to messages file

    # logger -p wann -t CARD -f /tmp/my.txt Priority, tag, message file

    ```


    In the first example, words Added new card are sent to the messages files. In
    the second example, the priority of the message is set to info and a tag of CARD
    is added to each line in the message. The message text is taken from the /tmp/my.txt
    file that I created before running the command. To see these log entries in real
    time, use tail -f or less as described in Chapter 5.


