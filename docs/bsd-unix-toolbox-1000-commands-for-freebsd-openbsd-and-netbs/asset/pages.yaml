    # Securing Network Services


    Every computer system with all the security features in the world would be secure
    if the system administrator doesn''t enable those features. Although some level
    of security is achieved in BSD systems by the fact that network services are not
    turned on or even enabled by default, some of the best of securing network services
    require extra work.


    This section tells how to start network services. Then it describes ways of configuring
    and securing those services.


    In FreeBSD, most network services are secured by adding settings to configuration
    files in the /etc directory and by configuring how the network services start.
    Network services start when you boot your computer do so based primarily on two
    features:


    +   - /etc/rc.d/ scripts: Most network services are handled by daemon processes
    (such as sshd, named, and nfsd). However, those are actually launched from'
