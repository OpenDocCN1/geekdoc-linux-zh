    # Using Wireless Connections


    Setting up wireless connections in FreeBSD has been tricky in the past, primarily
    to the fact that open source drivers have not been available for the vast majority
    of wireless LAN cards on the market. The first thing you need to do is choose
    a wireless card that is supported by BSD. The next thing is to configure your
    wireless network interface using the `ifconfig` command.


    # Getting Wireless Driver


    If you have any choice in the matter, you should purchase a wireless LAN card
    that has open source drivers available that are packaged with your BSD system.
    If you are not sure of the manufacturer and model of your wireless card, if you
    have a PCI card you can determine exactly which you have, using the `lspci` command
    (`pkg_add -r pci cards`)


    The wireless card shown is not one of the supported cards. If that is the case
    with your card, you might be able to use the ndis multipoint driver (type `ndis`).
    With the nddis driver you can use Windows drivers to get your wireless LAN cards
    to work.


    Wireless cards for which there are drivers in FreeBSD are shown in Table 11-1.


    | Driver name | Supported Wireless Cards | Line to add to /boot/loader.conf |

