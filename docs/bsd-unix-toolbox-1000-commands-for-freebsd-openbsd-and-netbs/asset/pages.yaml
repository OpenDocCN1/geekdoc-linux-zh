- img_proc: true
  md: '# Chapter 4: Working with Files


    This finds files that have not been accessed in /home/chris for over 60 days:


    ```

    $ find /home/chris/ -atime +60

    ```


    Use the -type option to find directories. The following command line finds all
    directories under /etc and redirects stderr to the bit bucket (/dev/null):


    ```

    $ find /etc -type d -print 2 > /dev/null

    ```


    This command line finds files in /bin with permissions that match 555:


    ```

    $ /bin/sbin -perm 555

    /sbin/adjkerntz

    /sbin/atacontrol

    ```


    The exec option to find is very powerful, because it lets you act on the files
    found with the command find. The following command finds all the files in /var
    owned by the user francois (must be a valid argument) and executes the ls -1 command
    on each:


    ```

    $ find /var -user francois -exec ls -1 {} \

    ```


    An alternative to the find command''s exec option is xargs:


    ```

    $ find /var -user francois | xargs ls -l

    ```


    There are big differences on how the two commands just use operate, leading to
    very different performance. The find -exec spawns the ls for each result it finds.
    The xargs command works more efficiently by passing many results as input to a
    single command.


    To negate a search criterion, place an exclamation point (!) before that criterion.
    The next example finds all the files that are not owned by the group root and
    are regular files, and then does an ls -1 on each:


    ```

    $ find ! -group root -type f 2 > /dev/null | xargs ls -l

    ```


    The next example finds the files in /sbin that are regular files and are not executable
    by others, then feeds them to an ls -1 command:


    ```

    $ find /sbin -type f ! -perm o+x | xargs ls -l

    ```


    Finding files by size is a great way to determine what is filling up your hard
    disks. The following command line finds all files that are greater than 10 MB
    (+10M), lists files from largest to smallest (-ls -S) and directs them to a file
    (/tmp/bigfiles.txt):


    ```

    $ find /xdev -size +10M | xargs ls -lS > /tmp/bigfiles.txt

    ```'
  merge: -1
