  md: "# Chapter 14: Locking Down Security\n\ndata that comes from your computer's\
    \ network interfaces, then making a decision about what to do with that packet\
    \ based on the parameters you set.\n\nThree firewalls are built into FreeBSD:\
    \ IPFILTER, IPFIREWALL, and PacketFilter. This section focuses on the IPFILTER\
    \ features. There are ports of IPFILTER available not only on FreeBSD, but also\
    \ on NetBSD and OpenBSD. You can learn more about IPFILTER from the official FAQ:\
    \ www.phildev.net/ipf.\n\nWhen you build a firewall, there are a few things you\
    \ should think about. If possible, from the console terminal, as you develop your\
    \ firewall rules it's possible that you lock yourself out by mistake. In your\
    \ rules, be sure to handle loopback (and 127.0.0.0 interface) interactions.\n\n\
    To enable IPfilter, add the following settings to the /etc/rc.conf file, create\
    \ a rules file, and start the firewall. Here's an example of settings to add to\
    \ the /etc/rc.conf file:\n\n```\nfirewall_enable=YES                   # Set to\
    \ YES to enable firewall functionality\nfirewall_type=/etc/ipf.rules         \
    \  # Use /etc/ipf.rules for firewall rules\nfirewall_logging=YES             \
    \       # Set to YES to enable events logging\nfirewall_script=\"/etc/rc.firewall\"\
    \    # Which script to run to set up the firewall\nfirewall_quiet=NO         \
    \             # Set to YES to suppress rule display\nfirewall_flags=\"       \
    \                # Flags to ipfw when type is a file\nipilter_enable=YES     \
    \             # Set to YES to enable ipfilter functionality\nipilter_program=\"\
    /sbin/ipf\"      # Where the ipfilter program lives\nipilter_rules=\"/etc/ipf.rules\"\
    \ # Rules definition for ipfilter, see\n                                     \
    \    # /usr/src/contrib/ipfilter/rules for example\nipilter_flags=\"\"       \
    \        # Additional flags for ipfilter\n```\n\nNote that firewall_enable, firewall_logging,\
    \ and ipilter_enable are all set to YES. The most important thing to notice is\
    \ that the /etc/ipf.rules file is where the rules that define how your firewall\
    \ behaves are stored. Here is an example of set rules added to the /etc/ipf.rules\
    \ file:\n\n```\nadd allow from any to any via lo0\nadd allow from any to 127.0.0.0/8\n\
    add allow from any to 127.0.0.0/8 to any\nadd check-state\nadd allow tcp from\
    \ any to any established\nadd allow from any to any out keep-state\nadd allow\
    \ icmp from any to any\nadd allow tcp from any to any 22 setup keep-state\nadd\
    \ allow tcp from any to any 25 setup keep-state\nadd allow tcp from any to any\
    \ 53 setup keep-state\nadd allow udp from any to any 53 keep-state\nadd allow\
