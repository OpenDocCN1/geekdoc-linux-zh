  md: '# 2

    # Installing FreeBSD and Adding Software


    In the tradition of the first UNIX systems, FreeBSD offers a text-based installation
    facility that includes a utility called sysinstall. The installer is aimed at
    professionals, who are more interested in power and flexibility than any graphical
    screens and hand-holding. After initialization you can run sysinstall, to add
    more software packages and configure some network settings.


    +   ### IN THIS CHAPTER

    * Installing FreeBSD

    * Getting software packages

    * Using ports to get and install software


    Despite its simplicity, the installer offers many of the powerful features that
    you can find in refined Linux and UNIX installers. You can configure your hard
    disks and install from different local media (CD, DVD, or hard disk) or remote
    servers (FTP, HTTP or NFS servers). It also leads to the initial configuration
    of users, network services, and other important start-up features.


    After installation, FreeBSD offers tools such as pkg_info, pkg_add, pkg_delete,
    and pkg_check to add and otherwise work with software packages in FreeBSD. You
    can also run the sysinstall utility to install more packages after your initial
    FreeBSD install. To install packages from source code, FreeBSD offers the ports
    collection, along with tools such as portsnap and upgrade.


    This chapter highlights critical issues you need to know during the initial FreeBSD
    installation. It also provides detailed examples of commands just mentioned for
    managing software after installation.


    # # Before Installing FreeBSD


    You can get FreeBSD installation software from the Getting FreeBSD page at www.freebsd.org/where.html.
    From that page, you can find where to purchase FreeBSD CDs or DVDs. For example,
    you can purchase a four-CD set or single DVD from the FreeBSD Mall (www.freebsdmall.com),
    with or without the FreeBSD handbook.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 2: Installing FreeBSD and Android Software


