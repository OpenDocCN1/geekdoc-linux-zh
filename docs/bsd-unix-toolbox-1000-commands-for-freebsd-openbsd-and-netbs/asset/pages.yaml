  md: '# Chapter 13: Doing Remote System Administration


    # Using Public Key Logins


    Here''s the process for setting up key-based communications between BSD systems.
    In the following example, we use empty passphrases for no-password logins. If
    you prefer to protect your key with a passphrase, simply enter it when prompted
    during the first step (key pair creation).


    On the client system, run the ssh-keygen command to generate the key pair while
    logged in as the user who needs to initiate communications:


    ```

    $ ssh-keygen

    Generating public/private rsa key pair.

    Enter file in which to save the key (/home/chris/.ssh/id_rsa): <Enter>

    Enter passphrase (empty for no passphrase): <Enter>

    Enter same passphrase as before: <Enter>

    Your identification has been saved in /home/chris/.ssh/id_rsa.

    Your public key has been saved in /home/chris/.ssh/id_rsa.pub.

    The key fingerprint is:

    ac:db:a4:9e:3f:2a:90:f5:b4:74:e0:d3:db chris@host.domain.com

    ```


    Note that if you pressed the Enter key to create the default key name and now
    have a private key that you need to keep very safe, especially in this procedure
    if you didn''t protect it with a passphrase.


    You now have a public key (id_rsa.pub) which was created by the previous command.
    This public key needs to be installed on hosts you want to connect to. The content
    of ~/.ssh/id_rsa.pub needs to be copied (securely) to ~/.ssh/authorized_keys keys
    for the user you want to ssh to the remote server. The authorized_keys file can
    contain more than one public key, if multiple users use ssh to connect to this
    account.


    Log in to the remote server as the user that you want to ssh with the key. If
    you don''t already have a ~/.ssh directory, the first step is to create it as
    follows:


    ```

    $ cd

    $ mkdir .ssh

    $ chmod 700 .ssh

    ```


    The next step is to copy (secure) the public key file from the client and put
    it in authorized keys file on the server. This can be accomplished using scp.
    For example, assuming the client name myclient and user name chris, the type of
    the following:


    ```

    $ scp chris@myclient:/home/chris/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys

    $ cat id_rsa.pub >> ~/.ssh/authorized_keys      Add to your keys

    $ chmod 600 ~/.ssh/authorized_keys            Close permissions

    $ rm id_rsa.pub                             Delete public key after copying it

    ```


    This procedure can also be accomplished by editing the ~/.ssh/authorized_keys
    text file on the server and pasting the public key to the client.'
