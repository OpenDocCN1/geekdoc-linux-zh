    # Changing Time Zone


    Your BSD system''s time zone is set on the contents of the /etc/localtime file.
    You can set a new time zone immediately by copying the file representing your
    time zone from a subdirectory of /usr/share/zoneinfo. For example, to change the
    current time zone to that of America/Chicago, you could do the following:


    ```

    # cp /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    This can also be achieved by creating a symlink:


    ```

    # ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    In FreeBSD, there is also a tool called tzsetup that lets you select your local
    time zone.


    # Displaying and Setting Your Time and Date


    The date command is the primary command-based interface for viewing and changing
    date time settings, if you are not having that done automatically with NTP. Here
    are examples of date commands for displaying dates and times in different ways:


    ```

    $ date

    Display current date, time and time zone

    ```


    ```

    $ date ''%a %B %d %Y''

    Display day, month, day of month, year

    Tue Aug 12 01:26:50 CDT 2008

    Tuesday 12 August 2008

    ```


    ```

    $ date ''+The date today is %F.'' Add words to the date output

    $ date ''+TIME:%H:%M:%S\nDATE:%Y-%m-%d'' Display Time and DATE on

    TIME:06:29:10

    DATE:2008-12-18

    ```


    ```

    $ date -v+im -v -d -v-mon

    Display the last Monday in the month

    Mon 29 08:18:32 CST 2008

    ```


    ```

    $ date -u

    Display Coordinated Universal Time (UTC)

    Mon Dec 29 15:19:12 UTC 2008

    ```


    Our primary interest in this time is since, since we are on the subject of dates
    well, the cal command is a quick way to display dates by month. Here are examples:


