  md: '# Chapter 9: Checking and Managing Running Processes


    Signals are represented by numbers (9, 15, and so on) and strings (SIGKILL, SIGTERM,
    and so on). Table 9-2 shows standard signals you can send to processes in BSD
    systems.


    Table 9-2: Standard Signals to Send to Processes


    | Signal Number | Signal Name | Description |

    |---|---|--|

    | 1 | SIGHUP | Hang up from terminal or controlling process died |

    | 2 | SIGINT | Interrupt program |

    | 3 | SIGQUIT | Quit program |

    | 4 | SIGILL | Illegal instruction |

    | 5 | SIGTRAP | Trace trap |

    | 6 | SIGABRT | Abort sent from abort function |

    | 7 | SIGEMT | Emulate instruction executed |

    | 8 | SIGFPE | Floating point exception |

    | 9 | SIGKILL | Kill signal |

    | 10 | SIGBUS | Bus error |

    | 11 | SIGSEGV | Segmentation violation |

    | 12 | SIGSYS | Non-existent system call invoked |

    | 13 | SIGPIPE | Pipe broken (nothing to read or write to) |

    | 14 | SIGALRM | Timer signal from alarm system call |

    | 15 | SIGTERM | Termination signal |

    | 16 | SIGURG | Discard signal |

    | 17 | SIGSTOP | Stop the process |

    | 18 | SIGTSTP | Stop typed at terminal |

    | 19 | SIGCONT | Continue if process is stopped |

    | 20 | SIGCHLD | Child status changed |

    | 21 | SIGTTIN | Terminal tries to read background process |

    | 22 | SIGTTO | Terminal tries to write to background process |'
