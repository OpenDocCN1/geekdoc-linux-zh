    # Sorting Output with sort


    It also be useful to sort the content of a file or the output of a command. This
    can be helpful in bringing order to disorderly output. The following examples
    list the names of all software packages currently installed, grabs any with gnome
    in the name, and sorts the results in alphanumeric order (forward and reverse):


    ```

    $ pkg_info | grep sort Sort in alphanumeric order

    $ pkg_info | grep gnome sort -r Sort in reverse alphanumeric order

    ```


    The following command sorts processes based on descending memory usage (fourth
    field of ps output). The -k option specifies the key field to use for sorting:
    4,4 indicates that the fourth field and only the fourth field is a key field.


