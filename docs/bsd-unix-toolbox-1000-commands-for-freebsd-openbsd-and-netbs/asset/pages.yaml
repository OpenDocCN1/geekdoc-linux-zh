    # Working with Linux-Compatible File Systems


    Having Linux compatibility software included with FreeBSD makes it possible to
    have Linux-compatible file systems, such as ext2 and ext3 file systems. Besides
    including tools (such as mkfs.ext2 and mkfs.ext3) for creating Linux file systems,
    there are also tools for checking (fsck.ext2 and fsck.ext3) and adjusting parameters
    (tune2fs) of a Linux file system (You need to add Linux Compatibility during installation
    to get these features).


    The device examples below create and use the ext2 file system on the third slice
    of the first hard disk (/dev/ad01). Instead of working with an IDE drive by using
    a SCSI or USB memory stick, the first disk would be identified as a da. When you
    want to create a Linux-compatible file system, you can do so by creating it to
    the entire drive (da0) or on a slice (da0s4).


    # Creating Linux-Compatible File Systems


    To create a Linux-compatible file system in FreeBSD, you can start by creating
    a slice dedicated to Linux. Refer to the "Changing Disk Slices with slicepart"
    section earlier in this chapter for information on creating a slice. Then assign
    that slice to a partition type of 131 (Linux extfs). You are now ready to make
    an ext2 or ext3 file system on that partition.


    > NOTE If procedures in this chapter don''t work, make sure that you have the
    Linux compatibility feature installed and the Linux driver loaded (kload linux).
    Keep in mind that ext2 and ext3 support is not particularly stable. For production
    machines we recommend using the UFS file system in most cases.


