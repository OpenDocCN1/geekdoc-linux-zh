  md: '# Chapter 14: Locking Down Security


    # Working with Users and Groups


    During most installation procedures you are asked to assign a password to the
    root user (for system administration). Then you might be asked to create a user
    name of your choice and assign a password to that as well (for everyday computer
    use).


    We encourage you to log in as a regular user and only su sudo to the root account
    when necessary. (In fact, by default, you are not allowed to log in remotely using
    ssh to a BSD system as root user.) When FreeBSD is installed, you can use commands
    or graphical tools to add more users, modify user accounts, and assign change
    passwords.


    # Managing Users the GUI Way


    For a GNOME desktop system with X, you can manage users and groups with the User
    Manager window (Administration Users and Groups). When managing user accounts
    for servers, one option is to use web-based GUIs.


    The most commonly used general-purpose tool is Webmin (www.webmin.com). Make sure
    you do not run Webmin on its default port (1080) for security reasons. Or, better
    run services as Webmin over SSH tunnels, so communication is encrypted. You can
    also use special-purpose web interfaces. For example, there are many web-hosting
    automation GUIs, such as cPanel (www.cpanel.com), Plesk (www.swsoft.com/plesk),
    or Ensim (www.ensim.com).


    # Adding User Accounts


    To add new users you can the adduser command. With options, adduser steps you
    through the information you need to enter to add a user account. Here''s an example
    of using adduser to add a user interactively.


    ```

    # adduser Start an interactive session to add a user

    Username: jimbo

    Full name: James Bolatter

    Uid (Leave empty for default):

    Login group [jimbo]

    Login group is jimbo: Invite jimbo into other groups? []:nLogin class [default]:nShell
    (sh csh tcsh bash k login) [sh]: bash

    Home directory [/home/jimbo]

    Use password-based authentication? [yes]:nUse an empty password? (yes/no) [no]:nUse
    a random password? (yes/no) [no]:nEnter password: ******

    Enter password again: ********

    Lock the account after creation? [no]:

    ```


