    \ lines and make sure they are set to YES. The other lines are set by default\
    \ (in the /etc/defaults/rc.conf file) and are just shown here for your information.\
    \ The next time you start your systems, your time will be set on information gathered\
    \ from the NTP server and your local time zones. If you prefer to start the ntpd\
    \ daemon manually, you could type the following:\n\n```\n# /usr/sbin/ntpd -p /var/run/ntpd.pid\
