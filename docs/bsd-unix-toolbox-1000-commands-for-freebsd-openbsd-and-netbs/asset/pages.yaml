  md: '# Chapter 13: Doing Remote System Administration


    # # Reconnecting to a screen Session


    After you detach from a screen session, you can return to that screen again later
    (even after you log out and disconnect from the server). **Reconnect** when only
    one screen is running, type the following:


    ```

    $ screen -r

    ```


    If there are several screens sessions running, `screen -r` won''t work. For example,
    this shows what happens when you two detached screen sessions are running:


    ```

    $ screen -r

    ```


    There are several screens on:


    | 7089.pts-2.myserver | (Detached) |

    | 7263.pts-2.myserver | (Detached) |


    Type `screen [-d] -r [pid].tty.host*` to resume one of them.


    As the output, you can identify the **screen** session you want by its name (which,
    by default, is a combination of the session''s process ID, tty name, and hostname).
    For example:


    ```

    $ screen -r 7089.pts-2.myserver

    ```


    # # Naming Screen Sessions


    Instead of using the default names, you can create more descriptive names for
    your sessions when you start `screen`. For example:


    ```

    $ screen -S mysession

    $ screen -ls

    ```


    There is a screen on:

    26523.mysession (Attached)


    # # Sharing Screen Sessions


    The **screen** command allows the sharing of screens. This feature is great for
    tech support, because each person connected to the session can both type into
    and watch the current session! Creating a new screen, in the preceding section,
    makes this easier. Because you are sharing a screen, use either a temporary user
    account or temporary password, for security reasons. Then another person on a
    different computer can ssh to the server (using the same user name) and type the
    following:


    ```

    $ screen -x mysession

    ```


    Just as with `screen -r`, if there''s only one screen running, you don''t need
    to specify which screen you''re connecting to:


    ```

    $ screen -x

    ```


