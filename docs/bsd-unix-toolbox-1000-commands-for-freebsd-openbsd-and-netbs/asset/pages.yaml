    # Using Login Classes


    A potentially useful feature in FreeBSD that is not in other UNIX-like systems
    is the login class feature. When you create a normal user account, that account
    is assigned to the default login class, based on an entry in the /etc/login.conf
    file. Login class provides a list of initial settings for the user. By creating
    other login classes, you can create sets of users with different attributes.


    Here is how the default login class defines in the /etc/login.conf file:


    ```

    passwd_format=md5:\n:copyright=/etc/COPYRIGHT:\

    :welcome=/etc/motd:\

    :setenv=MAIL=/var/mail,$SIZE-K,FTP_PASSIVE_MODE=YES:\

    :path=/sbin /bin /usr/sbin /usr/bin /usr/games /usr/local/sbin /usr/local/bin
    /X1R6/bin ~~

    :login=/var/run/login:

    :cpuptime=unlimited:\n:datasize=unlimited:\

    :stacksize=unlimited:\

    :memorylocked=unlimited:\

    :memoryuse=unlimited:\n:filesize=unlimited:\n:coredumpsize=unlimited:\n:maxproc=unlimited:\n:bsize=unlimited:\n:vmemoryuse=unlimited:\n:priority=0:\

    :ignorename=:\n:umask=022:

    ```


    Seeing the default login class may answer some of your questions about where the
    initial settings each user has come from. Here are descriptions of how features
    are set and how you might change them:


    +   - passwd_format=md5: New or changed passwords will use md5 encryption. You
    could also set this to des or blf if those use encryption types.


