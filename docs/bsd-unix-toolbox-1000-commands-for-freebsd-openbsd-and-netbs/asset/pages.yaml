    Because BSD distributions have a reputation for extraordinary security, access
    to the root user account is discouraged except in very specific situations. By
    default, root access is only allowed from terminals listed in /etc/ttys as secure.
    That includes only virtual terminals accessible from the console.


    So if you need to use the root account, the only way to do that, as FreeBSD is
    delivered, is to log in directly as root from the root''s console terminal. To
    be able to become root user, while logged in as another user, you need to change
    some security settings and use either the su sudoers command as described.


    # Using the su Command


    Non-root users are prevented from becoming root users based on settings in the
    /etc/pam.d/su file. These settings only allow the root user or members of the
    wheel group access the root account via the su command. If you change the /etc/pam.d/su
    file to allow a user to use the su command, you can run the su (super) command
    to become the root user. However, simply using su, doesn''t give a login shell
    with the root user''s environment:


    ```

    $ su

    Password: ****

    # echo $MAIL

    /var/mail/fcaen

    ```


    After running su, the user still has their MAIL folder. To enable the root user''s
    environment, use the su with the dash option (-), as follows:


    ```

    # exit

