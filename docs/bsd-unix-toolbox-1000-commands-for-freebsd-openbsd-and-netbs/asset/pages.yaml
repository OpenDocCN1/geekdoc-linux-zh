    # Using VNC on Untrusted Networks with SSH


    VNC is considered to be an insecure protocol. The password is sent using fairly
    encryption and the rest of the session is not encrypted at all. For reason, when
    using VNC over an untrusted network or the Internet, we recommend you tunnel it
    over SSH.


    For a general description of how the SSH service works, refer to the “Doing Remote
    Login and Tunneling with SSH” section earlier in this book. To forward VNC display
    2 (port 5902) on the computer myserver, to the same local port, type the following:


    ```

    $ ssh -L 5902:localhost:5902 myserver

    ```


    In case VNC is already running on the client, you could assign the service to
    an arbitrary port (to avoid running into the same port number). For example:


    ```

    $ ssh -L 55902:localhost:5902 user@myserver

    $ vncviewer localhost:55902

    ```


    > NOTE If you start using VNC routinely, you may want to look at tightvnc. The
    tightvnc project provides another open source implementation of the VNC protocol,
    under active development and with newer features and optimizations. These features
    include built-in ssh tunneling.


    # Sharing a VNC Desktop with Vino


    If you''re running GNOME and like to share your existing GNOME desktop (display
    :0), you can do so with Vino (as root, use pkg_add -r vnc). From the GNOME Desktop
    panel, select System > Preference > Remote Desktop to display the Remote Desktop
    Preferences window (vino-preferences) shown in Figure 13-3.


    In the Remote Desktop Preferences window, the “Allow other users to view your
    desktop” check box enables VNC viewers to view your desktop; by contrast, selecting
    the “Allow others to control your desktop” check box enables others to manipulate
    your desktop with their mouse and keyboard.


    If the “Ask you for confirmation” box is selected, a remote request to view your
    desktop causes a pop-up window to okay the connection before the requester can
    see your desktop. Selecting the “Require the user to enter this password” check
    box is a good idea, to prevent those without a password from viewing your desktop.
    (Be sure the password is at least eight characters.)


