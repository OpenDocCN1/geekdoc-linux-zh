    mode back to command mode. This is one of the keys you will use most often.


    # Modifying Commands with Numbers


    Nearly every command described so far can be modified with a number. In other
    words, instead of deleting a word, replacing a letter or changing a line, you
    can delete six words, replace 12 letters and change nine lines. Table A-5 shows
    some examples.


    **Table A-5: Modifying Commands with Numbers


    | Command | Result |

    | --- | --- |

    | 7cw | Erase the next seven words and replace them with text you type. |

    | d5d | Cut the next five lines (including the current line). |

    | 3p | Paste the previously deleted three times after the current cursor. |

    | 9db | Cut the nine words before the current cursor. |

    | 10j | Move the cursor down 10 lines. |

    | y2 | Copy (yank) text from cursor to end of next two sentences. |

    | 5Ctrl+F | Move forward five pages. |

    | 6J | Join together the next six lines.


