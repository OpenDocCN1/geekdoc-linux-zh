    partition located on that device.


    Table 7-2 describes each field in the /etc/fstab file.


    # Table 7-2: Fields in /etc/fstab File


    | Field | Description |

    | --- | --- |

    | 1 | The device name representing the file system. This is the device name of
    the partition to mount as /dev/ad0s1. It can also contain the device name representing
    a slice (as in /dev/ad0s2 for slice 2) if the entire slice is dedicated to a single
    file system |

    | 2 | The mount point in the file system. The file system contains all data from
    the mount point down the tree structure, unless another file system is mounted
    at some point beneath it |

    | 3 | The file type. See Table 7-1 for a list of many common file types |

    | 4 | mount count options. Examples of mount options include noauto (to prevent
    the file system from mounting at boot time) or ro (to mount the file system read-only).
    Commas must separate options. See the mount manual page (-o) for other supported
    options |

    | 5 | Dump file system? This is only significant if you run backups with dump.
    Positive numbers signal that the file system should be dumped. A number 1 means
    that the file system should be dumped first (this is used for the root file system).
    A number 2 assumes that the file system can be dumped at any point after the root
    file system |

    | 6 | File check system? The number in field indicates whether or not the file
    system needs to be checked with fsck. A zero indicates that the file system should
    not be checked. With the dump indicators, number 1 means that the file system
    needs to be checked first (this is used for the root file system). A number 2
    assumes that the file system can be checked at any point after the root file system
    |'
