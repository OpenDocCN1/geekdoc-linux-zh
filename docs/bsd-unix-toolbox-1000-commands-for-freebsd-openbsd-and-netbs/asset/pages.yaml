    # Installing Software Using Ports (source code)


    The BSD ports collection contains sets of make files, patches, and descriptive
    information needed to get, compile and install thousands of applications that
    have been ported to FreeBSD. When you install the ports collection, it is stored
    in the `/usr/ports` directory. From there, you can run a few simple commands to
    build selected applications from source code and install them on your system.


    In general, installing packages from the ports collection is generally preferred
    by more expert users. That''s because building from source offers opportunities
    for checking the code, making it to work efficiently for your uses, and incorporating
    the latest patches.


    When you first installed FreeBSD, you were given the opportunity to install the
    ports collection. If you chose not to do that at the time, you can install the
    ports collection later, as described in the following section.'
