    The lftp session illustrates how you can use shell commands to operate on remote
    directories (provided you have permission). The mkdir and chmod creates a directory
    and leave permissions only to your user account. The put command uploads one or
    more files to remote. The mput command can use wildcards to match multiple files
    for download. Other commands include mirror (to download a directory tree) and
    mirror -R (to download a directory tree).


    lftp also provides a script for non-interactive download sessions: ftpget. The
    syntax of ftpget is similar to that of the get command:


    ```

    $ ftpget http://ftp.freebsd.org/pub/FreeBSD/doc/en/books/handbook/book.pdf.bz

    ```


    Keep in mind that standard FTP clients are insecure because they do all their
    work in clear text. Your alternative, especially when security is a major issue,
    is to use SSH tools to transfer files.


    # Using SSH Tools to Transfer Files


    Because SSH utilities are among the most important tools in a system administrator’s
    arsenal of communications commands, some of the more complex uses of configuring
    and using SSH utilities are covered in Chapter 13. However, in their most basic
    form, SSH utilities are the tools you should use most often for basic file transfer.


    In particular, the scp command will do most of what you need to get a file from
    one computer to another, while making communication safe by encrypting both the
    password stage and data transfer stage of the process. The sc command replaces
    the rcp command as the most popular tool for host-to-host file copies.


    > WARNING! You do not get a warning before overwriting existing files with scp,
    so be sure that the target host doesn''t contain any files or directories you
    want that are in the path of your scp file copies.


