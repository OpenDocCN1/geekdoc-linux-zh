  md: "# Chapter 2: Installing FreeBSD and Adding Software\n\n# Getting and Installing\
    \ Applications with Ports\n\nApplications in the ports collection are available\
    \ via port skeletons. A port skeleton is represented by a directory in the /usr/ports\
    \ directory structure that contains components needed to get the source code,\
    \ compile it, and install the components.\n\nBasically, the skeleton contains\
    \ all the information needed to build an application from source code, without\
    \ containing the source code itself. The source code itself is contained in a\
    \ tariff referred to as a distfile. During the build process you get the distfile\
    \ from a FreeBSD mirror site on the Internet or from a local disk.\n\nHere’s how\
    \ to use the skeleton for the ftppcopy application:\n\n```\n# cd /usr/ports/ftp/ftppcopy\
    \    Change to the ftppcopy directory in ports\n# ls -CF                     \
    \          Lists the contents of the ftppcopy directory\n Makefile           \
    \  distinfo      files/ pkg-descr  pkg-list\n```\n\nThe Makefile is used by the\
    \ make command to describe how the application is to compiled. The distinfo file\
    \ contains the md5 and sha256 checksums needed to check the download files used\
    \ to build. The files directory contains any patch files to the application, as\
    \ those needed to get the application to run in FreeBSD or to fix a security problem.\n\
    \nThe pkg-desc file contains the description of the package and usually a web\
