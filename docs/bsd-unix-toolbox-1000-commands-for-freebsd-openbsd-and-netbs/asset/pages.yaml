    > NOTE You may encounter .rar compressed files in the RAR format. This format
    seems to be popular in the world of peer-to-peer networks. RAR is a proprietary
    format so there is no widespread compression tool. There is a rar package available
    in the FreeBSD ports system (/usr/ports/archivers/rar). The unrar command, on
    the other hand, has a binary package available with FreeBSD.


