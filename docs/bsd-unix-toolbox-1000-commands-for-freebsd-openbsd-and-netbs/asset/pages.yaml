  md: '# Chapter 1: Starting with BSD Systems


    # Using info Documents


    In some cases, developers have put more complete descriptions of commands, file
    formats, devices, or other BSD components in the info database. You can enter
    the info database by simply typing the info command or by opening a particular
    component:


    ```

    $ info ls

    ```


    The previous command shows information on the ls command. Use up, down, left,
    and right arrows and Page Up and Page Down to move around the screen. Home and
    End keys go to the beginning and end of a node, respectively. When you are displaying
    info screen, you can get around using the keystrokes shown in Table 1-4.


    # Table 1-4: Moving Through the Info Screen


    | Keystroke | Movement |

    | --- | --- |

    | ? | Display the basic commands to use in info windows. |

    | L | Go back to the previous node you were. |

    | n, p, u | Go to the node that is next, previous, or up. |

    | Tab | Go to the next hyperlink that is in this node. |

    | Enter | Go to the hyperlink that is under the cursor. |

    | R | Follow a cross-reference. |

    | Q | Quit and exit from info. |


    Software packages have particularly extensive text available in the info database
    include gimp, festival, libc, autautomake, zsh, sed, tar, and bash. Files used
    by the info database are stored in the /usr/share/info directory.


    # Summary


    Although you certainly can read this book from cover to cover if you like, the
