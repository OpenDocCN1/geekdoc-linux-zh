  md: '# Chapter 8: Backups and Removable Media


    algorithm is so efficient that it has been reused in many backup products. To
    add the rsync package, you can use pkg_add -r rsync.


    The rsync command can work either on top of a remote server (ssh), or by running
    an rsync daemon on the server end. The following example uses rsync over ssh to
    mirror a directory:


    ```

    $ rsync -avz --delete server1:chris@home/chris/pics/ chrispics/

    ```


    The command just is intended to mirror the remote directory structure (/home/chris/pics/)
    to a directory on the local system (chrispics/). -a says to run in archive mode
    (recursively copying all files from the remote directory), the -z compresses the
    files, and -v makes the output verbose. The --delete tells rsync to delete any
    files that no longer exist on the remote system.


    For ongoing-backups, you can have rsync do seven-day incremental backups.

    Here''s an example:


    ```

    # mkdir /mnt/backups

    # rsync --delete --backup

    # --backup-dir=/mnt/backups/backup-`date +%A` \

    # -avz chris@server1:home/chris/Personal/ \

    # /mnt/backups/current-backup/

    ```


    When the command just shown runs, all the files from /home/chris/Personal are
    copied to the remote server1 to the local directory /mnt/backups/current-backup.
    The first time the command is run, all files are backed up to the current-backup
    directory. The next time the command runs (on the next day), all modified that
    day are copied to a directory named after the current day of the week, over a
    week, seven directories will be created that reflects changes over each of the
    past seven days.


    Another trick for rotated backups is to use hard links instead of multiple copies
    of the files. This two-step process consists of rotating the files, then running
    rsync:


    ```

    # rm -rf /mnt/backups/backup-old/

    # mv /mnt/backups/backup-current/ /mnt/backups/backup-old/

    # rsync --delete --link-dir=/mnt/backups/backup-old -avz \

    # chris@server1:home/chris/Personal/ /mnt/backups/current-backup/

    ```


    In the previous procedure, the existing backup-current replaces the backup-old
    directory, deleting the two-week full backup with last-week''s backup. When the
    new full backup is run using rsync using the --link-dest option, if any of the
    files being backed up from the remote Personal directory on server1 existed during
    the previous backup (now in backup-old), a hard link between the file in the backup-current
    directory and backup-old is created.


