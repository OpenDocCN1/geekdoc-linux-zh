    # Checking Name Resolution


    Because IP addresses are numbers, and people prefer to address things by name,
    TCP/IP networks (such as the Internet) rely on DNS to resolve hostnames to IP
    addresses. FreeBSD provides several tools for looking up information related to
    DNS name resolution.


    When you first installed FreeBSD, you either identified Domain Name System (DNS)
    servers to do name resolution or had them assigned automatically from a DHCP server.
    That information is stored in the /etc/resolv.conf file, looking something like
    the following:


    ```

    nameserver 11.22.33.44

    nameserver 22.33.44.55

    ```


