  md: '# Chapter 4: Working with Files


    With all the ISO files listed in CHEKSUM.MD5 file contained in the current directory,
    you can verify them all at once using the -c option and the Linux-compatible md5sum
    command. Here is an example:


    ```

    $ /usr/compat/linux/usr/bin/md5sum -c CHEKSUM.MD5

    6.3-RELEASE-i386-bootoonly.iso: OK

    6.3-RELEASE-i386-discl1.iso: OK

    6.3-RELEASE-i386-disc2.iso: OK

    6.3-RELEASE-i386-disc3.iso: OK

    6.3-RELEASE-i386-docs.iso: OK

    ```


    To verify only one of the files listed in the checksum file, you could do something
    like the following:


    ```

    $ grep bootoonly CHEKSUM.MD5 | /usr/compat/linux/usr/bin/md5sum -c

    6.3-RELEASE-i386-bootoonly.iso: OK

    ```


    If you had a SHA1SUM instead of an MD5 file to check, you could use the sha1sum
    command described earlier in this chapter with the md5 command, you can verify
    any part of your file system. For example, here how to create an MD5 checksum
    for every file in the /etc directory so they can be checked later to see if any
    have changed:


    ```

    $ find /etc -type f -exec md5 {} \; 2>/dev/null > /tmp/md5.list

    ```


    The result of the previous command is a /tmp/md5.list file that contains a 128-bit
    checksum for every file in the /etc directory. Later, you could type the following
    command to see if any of those files have changed:


    ```

    # cd /etc

    # /usr/compat/linux/usr/bin/md5sum -c /tmp/md5.list | grep -v ''OK''

    ./hosts.allow: FAILED

    md5sum: WARNING: 1 of 1668 computed checksums did not match

    ```


    As you can see from the output only one file (hosts.allow). So the next step is
    to check the changed file and see if the changes to that file were intentional.


    # Summary


    There are dozens of commands for exploring and working with files in BSD. Commands
    such as chmod can change the permissions associated with a file, whereas commands
    include lsattr and chatter can be used to list and change file attributes that
    are associated with ext2 and ext3 file system types.'
