  md: '# Chapter 10: Managing the System


    NOTE You can set your computer''s hardware clock in the BIOS. How your BSD system
    interprets your hardware clock depends on several things. If the /etc/wall_cmos_clock
    file exists, BSD assumes the hardware clock should be interpreted as local time.
    If not, it is interpreted as UTC time. Based on your hardware clock and time zone,
    the running adjkertenz process adjusts the kernel clock and stores that information.
    Type sysctl maxdep.adjkertenz to see that offset.


    # Checking Uptime


    A matter of pride among BSD and other Linux and UNIX enthusiasts is how long they
    can keep their systems running without having to reboot. BSD systems have been
    known for years without having to reboot. that reboot is referred to as uptime.
    You can check your system''s uptime as follows:


    ```

    $ Check how long your system has been runningn6:53pm up 196 days, 14:25, 3 users,
    load average: 1.66, 0.88, 0.35

    ```


    The uptime output shows the current time, how many days and hours the system has
    been up and how many users are currently logged in. After that, uptime shows the
    system load over the last 1-, 5-, and 15-minute time periods.


    # Managing the Boot Process


    When a PC (x86) starts up, the basic input/output system (BIOS) looks to its boot
    order settings to determine where to find the operating system. Typically, if
    a bootable medium has not been inserted into a removable drive (CD, DVD, floppy
    disk, and so on), the BIOS looks to the master boot record (MBR) on the first
    bootable hard disk. At point, for most BSD systems, the control of the process
    is handed to the boot loader.


    FreeBSD and other BSD systems have a choice of boot loaders. By default, however,
    FreeBSD uses the boot0 loader. By configuring boot0, you can not only have your
    computer boot FreeBSD exactly as you would like, but you can configure it to boot
    other operating systems installed on your computer. You can choose to use a different
    boot loader (such as GRUB, described later) to direct the boot process.


    A BSD system boots in several stages. The first is the stage where the BIOS starts
    to initialize the hardware and find the master boot record, on hard disk, where
    the boot0 boot loader takes over. Next, boot1 starts and uses bslabel to point
    boot2. Next boot2 starts, which passes control to the boot loader or directly
    to the kernel. At end of that, with FreeBSD you should see a boot prompt that
    is similar to the:


    ```

    F1 FreeBSDnDefault: F1

    ```


    172'
