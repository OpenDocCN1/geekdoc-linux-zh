  md: '# Chapter 13: Doing Remote System Administration


    Although there are still some uses for the legacy remote commands (see the “Using
    Legacy Communications Tools” sidebar), most of this section describes how to use
    SSH commands to handle most of your needs for remote communications commands.


    # Using Legacy Communications Tools


    Despite the fact that SSH provides better tools for remote communications, legacy
    communications commands, sometimes referred to as commands, are still included
    with most BSD distributions. Some of these tools will perform faster than equivalent
    SSH commands because they don’t need to encryption. Some old-school Unix administrators
    may use them occasionally on private networks or still include them in old scripts.
    Although, for the most part, you should ignore these legacy remote commands, one
    of these in particular can be useful in some cases: _telnet.


    The **telnet** command is still used to communicate with network appliances (routers,
    switches, UPSes, and so on) that do not have the horsepower to run an ssh daemon.
    Even though it has a security risk, some appliance manufactures include telnet
    support.


    One way to use the **telnet** command, however, is for troubleshooting many Internet
    protocols like POP3, SMTP, HTTP, and others. Under the hood, plain-text protocols
    are simply automated telnet sessions during which a client (such as a browser
    or mail user agent) exchanges text with a server. The only difference is the TCP
    port in use. Here is an example of how you could telnet to the HTTP port (80)
    of a web server.


    ```

    $ telnet www.example.com 80

    208.77.188...

    Connected to www.example.com.

    Escape character is ''^''

    GET /index.html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.1//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>My Web server...</title>

    ```


    Similarly, you can telnet to a server on port 25 (SMTP) and 110 (POP3) and issue
    the proper commands to troubleshoot email-programs. For complete descriptions
    of using the **telnet command** to troubleshoot network protocols, refer to *Linux
    Troubleshooting Bible* (ISBN 076456997X, Wiley Publishing, 2004), pages 505 and
    508.


    If you need to forcefully exit your telnet session, use the escape sequence (Ctrl+])
    by default. This will stop sending your keyboard input to the remote end and bring
    you to the telnet command prompt where you can type quit or ? for more options.


