  md: '# Chapter 12: Accessing Network Resources


    Here is a quick procedure for mounting a directory of documents from a remote
    server to a local directory. Doing this only requires that the remote server is
    running SSH, is accessible, and that the directory you want to access is your
    user account on. Here we are mounting a directory /var/docs from the host at 10.0.0.50
    to a mount point called /mnt/docs on the local system:


    ```

    # pkg_add -r fuse-sshfs

    # kldload /usr/local/modules/fuse.ko

