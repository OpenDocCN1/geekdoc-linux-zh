  md: '# Chapter 2: Installing FreeBSD and Adding Software


    # Getting the Ports Collection


    There are several ways to get the ports collection for your FreeBSD system after
    the system is installed. Choices include sysinstallall, portsnap, or cvsup. Of
    the three, the sysinstallall method is the most intuitive, but each is pretty
    easy to use. This first procedure either installs or updates your ports collection
    using portsnap:


    +   1. Create the ports directory (if it doesn''t already exist):


    ```

    # mkdir /usr/ports

    ```


    +   2. If it is not already installed, install portsnap:


    ```

    # pkg_add -r portsnap

    ```


    +   3. Download ports collection to /var/db/portsnap:


    ```

    # portsnap fetch

    ```


    +   4. Do one of the following to either install a new /usr/ports or update an
    existing /usr/ports collection, respectively:


    > Install a new ports collection


    or


    ```

    # portsnap update

    ```


    > Update an existing ports collection command as root user.


    To use sysinstall to install the ports collection, run the sysinstall Distributions
    ports. With ports selected, select OK. When prompted, select the location of the
    ports collection (CD, DVD, FTP site, etc.) and the ports collection will be extracted
    to the /usr/ports directory structure.


    To use cvsup to install the ports collection, do the following:


    +   1. Create the ports directory:


    ```

    # mkdir /usr/ports

    ```


    +   2. Install cvsup:


    ```

    # pkg_add -r cvsup-without-gui

    ```


    +   3. Run the cvsup command, replacing cvsup.FreeBSD.org with a FreeBSD mirror
    site near to your location and optionally copying and modifying the ports-suffix:


    ```

    # cvsup -L 2 -h cvsup.FreeBSD.org /usr/share/examples/cvsup/ports-supufile

    ```


    Regardless of which of the three procedures you used to get your FreeBSD ports
    collection, the next section provides instructions for using the ports collection
    to install applications on your FreeBSD system.'
