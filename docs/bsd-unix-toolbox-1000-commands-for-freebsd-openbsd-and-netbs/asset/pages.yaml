    The file command runs document and image files of different formats, related to
    libtiff. It can look inside the files and determine if a file contains text with
    HTML markup (used in web pages), plain text, or an image. There is even a subdirectory
    shown (ogg).


    Creating regular files can be done by any application that can save its data.
    If you just want to create blank files with text, there are many ways to do that.
    Here are two examples:


    ```

    $ touch /tmp/newfile.txt      Create a blank file

    $ cat /dev/null /tmp/newfile2.txt  Create an empty file

    ```


    Doing a list on on a file is another way to determine its file type. For example:


    ```

    $ ls -1 /tmp/newfile2.txt  List a file to see its type

    -rw-rw-r-- 1 chris 0 Sep 5 14:19 newfile2

    ```


    A dash in the first character of the 10-character permission (-rw-rw-r--) indicates
    that the item is a regular file. (Permissions are explained in the “Setting File
    and Directories Permissions” section in this chapter.) Commands are also regular
    files, but are saved as executables. Here are some examples:


    ```

    $ ls -d /usr/bin/apropos  1 root 22248 Jan 12 2007 /usr/bin/apropos

    $ file /usr/bin/apropos  Bourne shell script text executable

    /usr/bin/apropos: Bourne executable

    $ file /bin/ls

    /bin/ls: ELF 32-bit LSB executable, Intel 80386, version 1 (FreeBSD), for FreeBSD
    6.3, dynamically linked (used shared libraries), stripped

    ```


    You can see that the apropos command is executable by the x settings for owner,
    group, and others. By running file apropos, you can use the x to show that it
    is a shell script. That’s opposed to a binary executable, as the ls indicated
    above.


    # Using Directories


    A directory is a container for files and subdirectories. Directories are set up
    in a hierarchy from the root (/) down to subdirectories, separated by a slash
    (/). Directories are folders when you access them from graphical file managers.


    To create directories for storing data, you can use the mkdir command. Here are
    examples of using mkdir to create directories in different ways:


    ```

    $ mkdir /tmp/new          Create "new" directory in /tmp

    $ mkdir -p /tmp/a/b/c/new  Create parent directories as needed for "new"

    $ mkdir -m 700 /tmp/new2    Create new2 with drwx------ permissions

    ```'
