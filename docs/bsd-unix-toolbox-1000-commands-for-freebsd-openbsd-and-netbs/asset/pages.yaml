  md: '# 10


    # Managing the System


    Without careful management, the demands on your BSD system can sometimes exceed
    the resources you have available. Being able to monitor your system''s activities
    (memory, CPU, and device usage) over time can help make sure that your machine
    has enough resources to do what you need. Likewise, managing other aspects of
    your system, as the device drivers it uses and how the boot process works, can
    help avoid problems and system failures.


    +   IN THIS CHAPTER

    Checking memory usage with top and westat

    Viewing CPU usage with iostat, sysat, and top

    Monitoring storage devices with iostat, gstat, and lsof

    Working with dates/time using date, cal, and NTP

    Changing boot loader behavior

    Switching to the GRUB boot loader

    Shutting down the system with reboot, halt, and shutdown

    Checking and changing kernel drivers with kidstat, kidunload, and kidload

    Watching hardware settings with isci and dmidecode


    This chapter is divided into several sections that relate to ways of managing
    FreeBSD or other BSD system. The first section can help you monitor the resources
    (processing power, devices, and memory) on your BSD system. The next section describes
    how to check and set your system clock. Descriptions of the boot process and subsequent
    run levels follow. The last sections describe how to work with the kernel and
    related device drivers, as well as how to view information about your computer''s
    hardware components.


    # Monitoring Resources


    FreeBSD, OpenBSD, NetBSD, and other UNIX-like systems do a wonderful job of keeping
    track of what they do. If you care to look, you can find lots of information about
    how your CPU, hard disks, virtual memory, and other computer resources are being
    used.


    You can use commands to view information about how your computer''s virtual memory,
    processor, storage devices, and network interfaces are being used on your system.
    There are commands that can monitor several different aspects of your system''s
    resources. Because this book is not just a man page, however, we have divided
    up the'
