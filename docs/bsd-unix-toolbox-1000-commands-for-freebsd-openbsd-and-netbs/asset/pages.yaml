    # # Checking Differences Between\Two Files with diff


    When you have two versions of a file, it can be useful to know the differences
    between the two files. For example, when changing a configuration file, people
    often leave a copy of the original configuration file. When that occurs, you can
    use the diff command to discover which lines differ between your new configuration
    and the original configuration, or to see what you have done. For example:


    ```

    $ cp /etc/sysctl.conf /etc/sysctl.conf.backup

    Make some changes to the sysctl.conf file

    $ diff /etc/sysctl.conf /etc/sysctl.conf.backup

    ```


    You can compare the output of diff to what is known as unified format. Unified
    format can be easier to read by human beings. It adds three lines of context before
    and each block of changed lines that it reports, and uses + and - to show the
    difference between the files. The sequence of commands creates a file (f1.txt)
    containing a sequence of numbers (1–7), creates a file (f2.txt) with one of those
    numbers changed (using sed), and compares the two files using the diff command
    (type pkg_add -r seq2 to get the seq2 command):


    ```

    $ seq2 -s 1 -e 7 > f1.txt Send a sequence of 7 number to f1.txt

    $ cat f1.txt Display contents of f1.txt

    1

    2

    3

    4

    5

    6

    7

    ```


    ```

    $ sed s/4/FOUR/ < f1.txt > f2.txt Change 4 to FOUR and send to f2.txt

    $ diff f1.txt f2.txt Shows line 4 was changed in file

    4c

    < 4

    ```


    ```

    $ diff -u f1.txt f2.txt Display unified output of diff

    --- f1.txt 2007-09-07 18:26:06.000000000 -0500

    +++ f2.txt 2007-09-07 18:26:39.000000000 -0500

    @@ -1,7 +1,7 @@

    -4

    +

    + FOUR

    ```'
