    # Using screen: A Rich Remote Shell


    The ssh command gives you only one screen. If you lose that, you lose all you
    were doing on the remote computer. This can be very bad if you were in the middle
    of something important, like a 12-hour compile. And if you want to do three things
    at once, for vi httpd.conf, tail -f error_log, service httpd reload, you need
    to enter three separate screen sessions.


    Essentially, screen is a terminal multiplexer. If you are a system administrator
    working on servers, screen is a great tool for managing a remote computer with
    a command line interface available. Besides allowing multiple sessions, screen
    also lets you disconnect, and reconnect to that screen session later.


    The screen software package is available with FreeBSD. To create and install the
    screen package, type the following from the FreeBSD server on which you want to
    use screen:


    ```

    $ # cd /usr/ports/sysutils/screen

    # make install

    ```


    To use screen, run the ssh command from a client system to connect to the BSD
    server where screen is installed. Simply type the following command:


    ```

    $ screen

    ```


    If you ran screen from a Terminal window, after you see the license message press
    and you should see a regular bash prompt in the window. To control screen, press
    the Ctrl+A key combination, followed by another keystroke. For example, Ctrl+A
    followed by ? (noted as Ctrl+A, ?) displays the help screen. With screen running,
    there are some commands and control keys you can use to operate screen.


    ```

    $ screen -ls

    ```


