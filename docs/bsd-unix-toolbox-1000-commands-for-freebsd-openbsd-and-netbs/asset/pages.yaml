  md: '# Chapter 11: Managing Network Connections


    From the FreeBSD Configuration menu that appears, select Networking Interfaces.
    At this point you have options of configuring your network interfaces based on
    the networking hardware connected to your computer. For example:


    +   - Ethernet Network Interface Card (fxp0, Inc0, or other) — Wired connection
    to Ethernet network


    +   - Parallel IP Port (plip0) — Direct connection to another computer between
    the parallel ports


    +   - Serial Line Internet Protocol (cuad0) — Serial port connection to a modem
    or null modem to another computer


    +   - Point-to-Point Protocol (ppp) — Serial port connection to modem or null
    modem to another computer


    Of the two interfaces, SLIP is older than PPP but more commonly used today. PLIP
    requires a special cable, and because Ethernet network cards are so inexpensive
    these days, PLIP is rarely used.


    If your NIC is supported, you should see the name of that card in the sysctl display.
    To configure it, you can configure IPv6 networking. Then you have the option of
    getting your computer''s address information from DHCP, or configuring manually.
    If you configure manually, you can enter the computer''s hostname, domain name,
    gateway (IPv4), server, IP address (IPv4) netmask, and any options to `ifconfig`.


    In some cases, however, your network interfaces may not be working. Likewise,
    there may be ways to work with your network interfaces that are not supported
    from sysctl. In those cases, the following sections describe how to work with
    your network interfaces from the command line.


    > The interface names for your Ethernet NICs are based on the driver used to support
    NIC. If you are coming from a Linux environment, you may expect Ethernet interfaces
    to be named eth0, eth1 and so on. In FreeBSD, the names might be fxp0, inc0 or
    something else. Examples in this chapter use fxp0 to represent a wired Ethernet
    interface.


    # Managing Network Interface Cards


    If the network hardware on your computer didn''t immediately come up and let connect
    to the Internet, there are some steps you should go through to troubleshoot the
    problem:


    +   - Check that your network interface card (NIC) is properly installed and that
    the cable is connected to your network (ISPs CPE, switch and so on).'
