    # Using ssh with Public Key Authentication


    Up to this point, we''ve only used ssh with the default password authentication.
    The ssh also supports public key authentication. This offers several benefits:


    +   - Automated logins for scripts and cron jobs: By assigning an empty passphrase
    you can use ssh in script to log in automatically. Although this is convenient,
    it is also dangerous, because anybody who gets to your key file can connect to
    any machine you can. Configuring for automatic login can also be done with a passphrase
    and a key agent. This is a trade-off between convenience and security, as explained
    below.


    +   - A two-factor authentication: When using a passphrase-protected key for interactive
    logins, authentication is done using two factors (the key and the passphrase)
    instead of one.'
