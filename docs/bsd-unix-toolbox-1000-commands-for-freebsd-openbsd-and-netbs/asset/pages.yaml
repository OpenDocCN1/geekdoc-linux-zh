    Some processes start up other processes. For example, a web server (http daemon)
    will spin off multiple httpd daemons to wait for requests from your server. You
    can view the hierarchy of processes (in a tree view) using the pstree command
    (as root, type pkg_add -r pstree to install it):


    ```

