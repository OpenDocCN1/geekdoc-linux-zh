  md: '# Chapter 9: Checking and Managing Running Processes


    # Adjusting Processor Priority with nice


    Every running process has a nice value that can be used to tell the BSD process
    scheduler what priority should be given to that process. Positive values of niceness
    actually give your process a lower priority. The concept came during the days
    of lage, multi-user UNIX systems where you could be “nice” by running a non-urgent
    process at lower priority so other users have a shot at the CPU.


    Niceness does not enforce scheduling priority, but is merely a suggestion to the
    scheduler.


    The default nice value is 0. You can use the nice command to run a process at
    a higher or lower priority than the default. The priority number can range from
    -35 (most favorable scheduling priority) to 19 (least favorable scheduling priority).
    Although the root user can raise or lower any user''s nice value, a regular user
    can only lower the priorities of a process (setting a higher value).


    > **WARNING!** Proceed with caution when assigning negative nice values to processes.
    This can crash your machine if critical system processes lose their priority.


    Here are a few examples of starting a command with nice to change a command''s
    value:


    ```

    $ nice -n 12 roff -n a.roff | less  Format man pages at low priority

    # nice -n -10 designer Launch Qt Designer at higher priority

    ```


    When a process is already running, you can change the process using the nice command.
    Here are some examples of the nice command:


    ```

    $ renice +2 -u francois Renice francois'' processes +2

    $ renice +5 4737 Renice PID 4737 by +5

    # renice -3 -pgrep -u chris spam Renice chris'' spam processes -3

    9688: old priority -1, new priority -3

    20279: old priority -1, new priority -3

    20282: old priority -1, new priority -3

    ```


    The backticks are used in the previous command line to indicate the output of
    the pgrep command (presumably PIDs of spam daemons run by chris) be fed to the
    renice command.


    The niceness settings for your processes are displayed by default when you run
    top. You can also see niceness settings using -o when you produce custom output
    from the ps command.


    # Running Processes in the Background and Foreground


    When you run a process from a shell, it is in the foreground by default. That
    means you can''t type another command until the first one is done. By adding an
    ampersand (&) to the end of a command line, you can run that command line in the
    background. Using the fg, bg, and jobs commands, along with various control commands,
    you can move commands between background and foreground.'
