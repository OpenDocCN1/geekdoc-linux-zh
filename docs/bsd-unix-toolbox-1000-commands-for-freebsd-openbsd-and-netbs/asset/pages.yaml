    # Using Symbolic and Hard Links


    Instead of copying files and directories to different parts of the file system,
    links can be set up to access that file from multiple locations. BSD supports
    both soft links (usually symbolic links) and hard links.


    When you try to use a symbolic link that points to a file or change to one that
    points to a directory, the command you run acts on the file or directory that
    is the target of your link. The target has its own set of permissions and ownership
    that you cannot see from the symbolic link. The symbolic link can exist on a different
    disk partition than the target. In


    > NOTE When you use commands such as tar to backup files that include symbolic
    links, there are ways of choosing whether or not the actual file symbolic link
    points to is archived. If you do back up the actual file, restoring the file can
    cause the link to be overwritten (which may not be what you want). See the tar
    page for different ways of backing up symbolic links.


    A hard link can only be used on files (not directories) and is basically a way
    of giving multiple names to the same file. Every physical file has at least one
    hard link, which is commonly thought of as the file itself. Any additional names
    (hard links) that point to the same physical file must be on the same partition
    as the original file (in fact, one way to tell that files are hard links is that
    they all have the same inode number). Changing permission, ownership, date/timestamp,
    or content of any hard link to a file results in all others changed as well. However,
    deleting one link will not remove the file; it will continue to exist until the
    last link, and technically the last inode, is deleted.


    Here are some examples of using the ln command to create hard and symbolic links:


    ```

    $ touch myfile

    $ ln myfile myfile-hardlink

    $ ln -s myfile myfile-symlink

    ```


