  md: '# Chapter 1: Starting with BSD Systems


    # Using help Messages


    The -h or --help options are often used to display help messages for a command.
    The following example illustrates how to display help for the ogg123 command:


    ```

    $ ogg123 --help | less

    ogg123 from vorbis-tools 1.1.1

    by the Xiph. Foundation (http://www.xiph.org/)


    Usage: ogg123 [<options>] <input file> ...


    h-h, --help this help

    -V, --version display Ogg123 version

    -d, --device d uses ''d'' as an output device

    Possible devices are (''=live, ''=file):

    oss* null* raw@ au

    -f, --file=filename Set the output filename for a previously

    specified file device (with -d).

    ```


    The preceding output shows how the ogg123 command is used and lists available
    options. Piping the output to the less command lets you page through it.


    # Using man Pages


    Suppose you want to find man pages for commands related to a certain word. Use
    the apropos command to search the man database. This shows man pages that have
    crontab in the page NAME line:


    ```

    $ apropos crontab

    contab(1) - maintain crontab files for individual users (V3)

    contab(5) - tables for driving cron

    ```


    The apropos output shows here each page NAME line that contains crontab. The number
    shows the man page section in which the man page appears. (We discuss sections
    shortly.)


    The whatis command is a way to show NAME lines alone for commands that contain
    the word you enter:


    ```

    $ whatis cat

    cat (1) - concatenate files and print on the standard output

    ```


    The easiest way to display the man page for a term is with the man command and
    the man name. For example:


    ```

    $ man

    FIND(1) FreeBSD General Commands FIND(1)

    NAME walk -- a file hierarchy

    ```'
