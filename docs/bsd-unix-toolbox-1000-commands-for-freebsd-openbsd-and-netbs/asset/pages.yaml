  md: '# Chapter 13: Doing Remote System Administration


    # ## Using Remote BSD Desktop and Applications


    The X Window System (X) should not be run on typical production servers for security
    and performance reasons. But thanks to the client-server nature of X, you can
    run an X-enabled program on a remote machine with its graphical output directed
    to your desktop. In that relationship, the application running from the remote
    machine is referred to as the client, and your desktop is the X server. When running
    remote X applications on untrusted networks or the Internet, use SSH forwarding
    as described earlier. On trusted LANs, do it without SSH, as described here.


    By default, your X desktop will not allow remote applications to connect (pop-up)
    on your desktop. You can allow remote apps on your desktop using the xhost command.
    On your local BSD display, use the xhost command to control which remote machines
    can connect to X and display applications on your desktop. Here are examples of
    xhost:


    ```

    $ xhost List allowed hosts

    access control enabled, only authorized clients can connect

    $ xhost Disable access control (dangerous)

    access control disabled, clients can connect from any host

    $ xhost Re-enable access control

    access control enabled, only authorized clients can connect

    $ xhost remotachine Add an allowed host

    remotachine being added to access control list

    ```


    Access control should be completely disabled for troubleshooting purposes. However,
    with access enabled for a particular host machine (remotachine in this case),
    you can do the following from a shell on the remote computer to have X applications
    from that appear on the local desktop (in this called localmachine):


    ```

    $ export DISPLAY=localmachine:0 Set the DISPLAY to localmachine:0

    $ xterm Open remote Terminal on local

    $ xclock Open remote clock on local

    $ gdali Open remote dice game on local

    ```


    After setting the DISPLAY variable on remotachine to localmachine, an application
    run from shell on remotachine should appear on Desktop 0 on local. In this case,
    we started Terminal window, clock, and game applications.


    Sharing X applications in this way between BSD and other UNIX-like hosts is pretty
    easy. However, it is not trivial to use across other computer platforms. If your
    desktop runs


