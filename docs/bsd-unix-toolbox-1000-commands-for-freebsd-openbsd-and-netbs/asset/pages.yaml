  md: '# Chapter 5: Manipulating Text


    The less command can be used with the same syntax as more in the examples above:


    ```

    $ ps awk | less              Page through the output of ps

    $ cat myfile.txt | less      Page through the contents of a file

    $ less myfile.txt                   Page through a text file

    ```


    The less command enables you to navigate the up and down arrow keys, PageUp, PageDown,
    and the spacebar. If you are using less on a file (not standard input), press
    v to open the current file in vi. As with G, go to the end of the file. F takes
    you to the end of the file, and then scrolls as new input is added, similar to
    a tail -f.


    In vi, viewing a file with less, you can search for a string by pressing / (forward
    slash) followed by the string and Enter. To search for further occurrences, press
    / n repeatedly. To search backwards, press ? followed by the string and Enter.


    To scroll forward and back while using less, use the f and b keys, respectively.
    For example, 10f scrolls forward ten lines and 15b scrolls back 15 lines. Type
    d to scroll down half screen and u to scroll up half screen.


    # Paginating Files with pr


    The pr command provides a quick way to format a bunch of text into a form where
    it can be printed. This can be particularly useful if you want to print the results
    of commands, without opening up a word processor or text editor. With pr, you
    can format text into pages with header information such as date, time, file name,
    and page number. Here is an example:


    ```

    $ ls /usr/ports | sort | pr -4 | less      Paginate ports directory in 4 cols

    ```


    Instead of paging the output, you can send the output to a file or to a printer.
    Here are examples of:


    ```

    $ ls /usr/ports | sort | pr -4 | less | pkg.txt      Send pr output to a file

    $ ls /usr/ports | sort | pr -4 | less | lpr          Send pr output to printer

    ```


    Other text manipulation you can do with the pr command includes double-spacing
    the text (-d), or offsetting the text a certain number of spaces from the left
    margin (for example, -o 5 will indent five spaces from the left).'
