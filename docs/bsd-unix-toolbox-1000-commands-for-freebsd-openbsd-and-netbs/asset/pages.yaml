  md: '# Chapter 2: Installing FreeBSD and Adding Software


    # Cleaning Up the Ports Collection


    After each time you install a package from the ports system, it is usually best
    to run the make command to get rid of the temporary files created during the builds.
    If you forget to do that, a lot of unused files can fill your disk space. You
    can clean out groups of unused files in your ports collection at once using the
    portsclean command (portsclean is in the portupgrade package: pkg_add -r portupgrade).


    Although work files clean when you run the make command, the distfiles (source
    code todays) that are downloaded to /usr/ports/distfiles are not cleaned out.
    Depending on how many ports you install, this directory can grow quite large.
    You can use the -D option to portsclean to remove ports that are not referenced
    by any ports number:


    ```

    # portsclean -D    Remove unreferenced distfiles

    Detecting unreferenced distfiles...

    ```


    Likewise, you can have portsclean check all distfiles and remove any distfiles
    that are not referenced by a port that is installed:


    ```

    # portsclean -DD    Remove unreferenced distfiles of uninstalled ports

    Detecting unreferenced distfiles...

    [Updating the pkgdb <format=bdb_btree> in /var/db/pkg ...

    - 440 packages found (0 + 2) .. done]

    Delete /usr/ports/distfiles/LPrng-3.8.28.tgz

    ```


    You can out all your work files at once using the -C option:


    ```

    # portsclean -C    Remove ports work files

    Cleaning out /usr/ports/*/*work...

    Delete /usr/ports/ftp/ftpcopy/work

    Delete /usr/ports/net/samba-nmblookup/work

    ```


    Packages that are not referenced by any other (called packages) can be deleted
    interactively using the pkg_cutleaves command (as root, type is this: pkg_add
    -r pkg_cutleaves). To list unreferenced packages, type the following:


    ```

    # pkg_cutleaves -lc    List unreferenced packages

    3dm-2.04.00.018.1 - 3ware RAID controller monitoring daemon and web server

    ...

    ```


    You can cut unreferenced packages as follows:


    ```

    # pkg_cutleaves    Step through unreferenced packages list (keep or delete)

    package 1 of 147

    3dm-2.04.00.018.1 - 3ware RAID controller monitoring daemon and web server

    3dm-2.04.00.018.1 - [keep](d)elete/(f)lush marked pkgs/(a)bort d

    3dm-2.04.00.018.1 - 3ware RAID controller monitoring daemon and web server

    ```'
