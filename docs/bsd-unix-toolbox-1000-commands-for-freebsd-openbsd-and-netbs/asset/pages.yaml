  md: '# 5


    # Manipulating Text


    With only a shell available on the first UNIX systems (on which BSD systems were
    based), using those systems meant dealing primarily with commands and text files.
    Documents, program code, configuration files, e-mail, and almost anything you
    created or configured were text files. To work with those files, developers created
    many text manipulation tools.


    IN THIS CHAPTER

    Matching text with Regular Expressions

    Editing text files with vi, JOE, or nano

    Using graphical text editors

    Listing text with cat, head, and tail

    Paging text with less and more

    Paginating text with pr

    Searching for text with grep

    Stream editing with sed, tr, cut, and awk

    Finding differences in files with diff

    Converting text files to different formats


    Despite having graphical tools for working with text, most seasoned users find
    command line tools to be more efficient and convenient. Text editors such as vi,
    Emacs, JOE, nano, and Pico are available with most BSD distributions. Commands
    such as grep, sed, and awk can be used to find, and possibly change, pieces of
    information within text files.


    This chapter explains how to use many popular commands for working with text files
    in BSD systems. It also explores some of the less common uses of text manipulation
    commands that you might find interesting.


    # Matching Text with Regular Expressions


    Many of the tools for working with text enable you to use Regular Expressions,
    sometimes referred to as regex, to identify the text you are looking for based
    on some pattern. You can use these strings to find text within a text editor or
    use them with search commands to scan multiple files for the strings of text you
    want.


    A RegEx search pattern can include a specific string of text (as in a word such
    as UNIX) or a location (such as end of a line or beginning of a word). It can
    also be specific (find just the hello) or more inclusive (find any word beginning
    with h and ending with o).'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Chapter 5: Manipulating Text


    Appendix C includes reference information for shell metacharacters that can be
    used in conjunction with Regular Expressions to do the exact kinds of matches
    you are looking for. This section shows examples of using Regular Expressions
    with several different tools you encounter throughout this chapter.


    Table 5-1 shows some examples using basic Regular Expressions to match text strings.


    # Table 5-1: Matching Using Regular Expressions


    | Expression | Matches |

    | --- | --- |

    | a* | a, ab, aecjejih |

    | ^a | Any “a” appearing at the beginning of a line |

    | *a$ | Any “a” appearing at the end of a line |

    | a.c | 3-character strings that begin with a and end with c |

    | [bcf]at | bat, cat, or fat |

    | [a-d]at | aat, bat, cat, but not Aat, and so on |

    | [A-D]at | Aat, Bat, Cat, Dat, but not aat, and so on |

    | 1[3-5]7 | 137, 147, and 157 |

    | \Hello | A tab character preceding the word Hello |

    | \. [TT] [xX] [Tt] | .txt, .TXT,.Xt or other case combinations |


    Many examples of Regular Expressions are used in throughout this chapter. Keep
    in mind that not every command that incorporates RegEx uses its features the same
    way.


    # Editing Text Files


    There are many text editors in the BSD/UNIX world. The most common editor is vi,
    which can be found on virtually any Unix system today. That is why knowing how
    to at least make edits in vi is a critical skill for BSD administrator. One day,
    if you find yourself in a minimalist, foreign BSD, Linux, or other UNIX environment,
    trying to bring a server back online, vi is the tool that will always be there.


    On FreeBSD, an improved version of vi is available called vim (install the vim6
    package to get it). Vi (Vi Improved) with the vim6 package will provide the most
    up-to-date, feature-rich, and user-friendly vi editor. For more details about
    using vi and vim, refer to Appendix A.'
