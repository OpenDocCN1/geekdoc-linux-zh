    # Checking File Systems


    File systems are traditionally checked when the system first boots up. Settings
    in the /etc/fstab file are used to determine which file systems are checked before
    they are mounted. The fsck command, which actually depends on a set of file system-specific
    fsck commands, not only check for consistency problems in a file system, it can
    also interactively repair those problems when necessary.


    After file systems are mounted and users are allowed to access the system, fsck
    can run again with the -B flag to do background checking. You can run fsck at
    any time to check, and possibly repair, a file system.


    Instead of using fsck to figure out the file type you can run the file system-specific
    commands directly on your file systems. These commands include fsck_ufs and fsck_mdosfs.


    The following example shows how to check a UFS file system by simply adding the
    device of the disk partition you want to check with the fsck_ufs command:


    ```

    # fsck_ufs /dev/ad04          Check UFS file system of inconsistencies

    ** /dev/ad0s4

    ** Last Mounted on /mnt/extra

    ** Phase 1 - Check Blocks and Sizes

    ** Phase 2 - Check Pathnames

    ** Phase 3 - Check Connectivity

    ** Phase 4 - Check Reference Counts

    ** Phase 5 - Check Cyl groups

    377 files, 864 used, 371871 free (15 fragments, 46732 blocks, 0.0% fragmentation).

    ```


    This example shows a file system check on slice for IDE disk 1 (/dev/ad0s4). The
    slice is not mounted, if so needs to be done for the disk, you could be. Here
    are some other examples of what you can use when checking a file system with the
    fsck_ufs command:


    ```

    # fsck_ufs -B /dev/ad0s1    Run check in the background

    # fsck_ufs -B -f ad0s1       Force file system check, even if marked clean

    ```'
