  md: '# Chapter 14: Locking Down Security


    Beyond the commands covered in this chapter, here are descriptions of some features
    you may want to look into to further secure your BSD system:


    +   - **Central logging:** If you''re managing more than a couple of BSD servers,
    it becomes preferable to have all your logs sent to a central syslog server. When
    you implement your syslog server, you may want to explore syslog-ng. (As root,
    type `pkg_add -r syslog-ng`)

    - **Tripwire:** Using the tripwire package, you can take a snapshot of all the
    files on your system, then use that snapshot to find if any of those have been
    changed. This is particularly useful to find out if applications have been modified-if
    that should not have been.. First, you take a baseline of your system. Then at
    regular intervals, you run a tripwire integrity check to see if any of your applications
    or configuration files have been modified.

    - **chkrootkit:** If you suspect your system has been compromised, download and
    build chkrootkit from `www.chkrootkit.org`. To install it in FreeBSD, type `pkg_add
    -r chkrootkit`. This will help you detect rootkits that may have been used to
    take over your machine. We recommend you run chkrootkit from a LiveCD or after
    mounting the suspected drive on a clean system.


    # Summary


    Although there are many tools available for securing the BSD system, the first
    line of security starts with the user accounts on your system and the services
    that run on your system. Commands such as `adduser`, `rmuser`, and `passwd` are
    standard tools for setting up user and group accounts.


    Because most serious security breaches outside your organization can come from
    intruders accessing your systems on public networks, setting up secure firewalls
    is important for any system connected to the Internet. The ipfw facility is one
    of several facilities in FreeBSD that provides the firewall features you can configure
    to meet your needs.


    To keep track of activities on your system, the Syslog facility logs information
    about nearly every aspect of the actions that take place on your system. There
    are also many other software packages you can add to help check the security of
    your system, such as chkrootkit and tripwire.'
