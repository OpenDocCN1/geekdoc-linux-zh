    # Managing Network Connections


    Starting and stopping the network interfaces for your wired Ethernet connections
    to your LAN or the Internet are usually handled automatically at the time you
    boot and shut down your BSD system. However, you can run scripts from the /etc/rc.d
    directory to start and stop your network interfaces you want or edit the /etc/rc.conf
    file to set whether your network services start automatically.


    The ifconfig command can also be used to configure, activate, and deactivate interfaces.


    # Starting and Stopping Ethernet Connections


    The reason that your wired Ethernet interfaces come just in many cases when you
    boot your BSD system is that the netif service is to be on when the system boots
    up. After the system is booted, you can use the netif script to stop, and restart
    your network interfaces.


    The script that starts your network interfaces in FreeBSD is /etc/rc.d/netif.
    With other BSD services, you can start and stop the netif service by running the
    script with options such as start, stop, and restart.


    To take all network interfaces offline then bring them online, type the following
    as root user:


    ```

    # /etc/rc.d/netif restart      Shutdown and bring up network interfaces

    Stopping: l0 fxp0 plibo.

    DHCPREQUEST fxp0 255.255.255.255 port 67

    DHCPACK from 10.0.0.1

    bound to 10.0.0.204 -- renewal in 7200 seconds.

    l0: flags=8049-UP, RUNNING, MULTICAST> mtu 16384

    inet6 fe80::1%l0 prefixlen 64 scope 03

    inet6 ::1 prefixlen 128

    inet 127.0.0.1 mask 0xff000000

    xp0: flags=8843<UP, BROADCAST, RUNNING, SIMPLEX, MULTICAST> mtu 7200

    ```


