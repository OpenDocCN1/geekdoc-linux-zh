  md: '# Chapter 5: Manipulating Text


    # Graphical Text Editors


    Just because you are editing text doesn''t mean you have to use a text-based editor.
    One advantage of using a graphical text editor is that you can use a mouse to
    select menus, highlight text, and copy text, and run special plug-ins.


    You can expect to have the GNOME text editor (gedit) if your BSD system has the
    GNOME desktop installed. Features in gedit enable you to check spelling, list
    document statistics, change display fonts and colors, and print your documents.
    KDE desktop also has its own KDE text editor (kedit in kdeutils package). It includes
    similar features to the GNOME text editor, along with a few extras, such as the
    ability to send the current document with vim or any other user-KDE Component.


    Vim comes with an X GUI version. It is launched with the gvim command, which is
    part of the vim package. If you''d like to turn Vim into a more user-friendly
    text editor, you can install Cream (pkg_add -r cream).


    Other text editors you can install include (with features for macros and executing
    shell commands) and leafpad (which is similar to the Windows Notepad editor).
    The Scribes text editor (scribes) includes some advanced features for automatic
    correction, replacement, indentation, and word completion.


    # Listing, Sorting, and Changing Text


    Instead of just editing a single file, you can use a variety of BSD commands to
    display, search, and manipulate the contents of one or more files at a time.


    # Listing Text Files


    The most basic method to display the content of a text file is with the cat command.
    The cat command concatenates (in other words, outputs as a string of characters)
    the contents of a file to your display (by default). You can then use different
    attributes to direct the contents of a file in different ways. For example:


    ```

    $ cat myfile.txt

    $ cat myfile.txt > copy.txt

    $ cat myfile.txt >> myfile.txt

    $ cat -s myfile.txt

    $ cat -n myfile.txt

    $ cat -b myfile.txt

    ```


    ```

    Send entire file to the screen

    Direct file contents to another file

    Append file contents to another file

    Discard multiple consecutive blank lines

    Show line numbers with output

    Show line numbers only on non-blank lines

    ```


    However, if your block of text is more than a few lines long, using cat itself
    becomes impractical. That''s when you need better tools to look at the beginning,
    the end, or page through the entire text.'
