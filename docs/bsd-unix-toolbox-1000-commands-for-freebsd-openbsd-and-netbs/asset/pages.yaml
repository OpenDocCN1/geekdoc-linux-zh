    # Focusing on BSD Commands


    These days, many important tasks in BSD can be done from both graphical interfaces
    and from commands. However, the command line has always been, and still remains,
    the interface of choice for BSD power users.


    Graphical user interfaces (GUIs) may seem to be intuitive. With some experience,
    you can probably figure out, for example, how to add a user, change the time and
    date, and configure a sound card for a GUI. For these cases, we''ll mention which
    graphical tool you need to use for the job. For the following cases, you will
    probably need to rely on the command line:


    +   - Almost time something goes wrong Ask a question at an online forum to solve
    some BSD problem you are having and the help you will always come in the form
    of commands to run. Also, command line tools typically offer more feedback if
    there is a problem configuring a device or accessing files and directories.


    +   - Remote systems administration If you are administering a remote server,
    you may have graphical tools available. Although remote GUI access (using X applications
    or VNC) and web-based administration tools may be available, they usually run
    more slowly than what you can do from the command line.


    +   - Features not supported by GUI administration tools tend to present the most
    basic ways of performing a task. More complex operations often require options
    that are only available from the command line.'
  merge: -1
