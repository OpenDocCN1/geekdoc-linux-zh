    here. Here are values associated with the SSH service that you can add to the
    /etc/rc.conf file:


    ```

    sshd_enable="YES"               # Enable sshd

    sshd_program="/usr/sbin/sshd" # Path to sshd, if you want a different one

    sshd_flags=""                   # Additional flags for sshd.

    ```


    To configure the ssh service, you need to modify files in the /etc/ssh directory
    (particularly the sshd_config file). By specifying other options in sshd_flags
    you can change how the sshd daemon operates. The following illustrates resulting
    sshd commands:


    ```

