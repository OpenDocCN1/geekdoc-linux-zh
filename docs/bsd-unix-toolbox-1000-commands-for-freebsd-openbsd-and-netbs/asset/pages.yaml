  md: '# Using vi or Vim Editors


    Although easy-to-use graphical text editors (such as gedit and kedit) are readily
    available with BSD systems, most power users still use vi or Emacs to edit text
    files. Besides the fact that vi and Emacs will work from any shell (no GUI required),
    offer other advantages such as your hands never having to leave the keyboard and
    integration with useful utilities. Unlike GUI editors, text-based editors are
    usable over slow Internet connections as dial-up or satellite.


    | IN THIS APPENDIX |

    | Using the vi editor |

    | Starting/quitting the editor |

    | Moving around in vi |

    | Changing and deleting text |

    | Using Ex commands |

    | Using visual model |


    This appendix focuses on features of the vi editor that can not help you with
    basic editing, but also help you do advanced text manipulation. We chose to cover
    vi rather than Emacs because vi is more universal and leaner, and also because
    keyboard shortcuts only require two arms. Some UNIX-like systems use the Vim (Vi
    Improved) editor in the past of the older editor, the descriptions in this appendix
    are extended to cover Vim as well. Some features in Vim that are not in vi include
    multiple levels, syntax highlighting, and online help.


    > NOTE If you have never used vi or Vim before, try the tutor that comes with
    the vim6 package. Run the vimutor command and follow the instructions to step
    through many of the key features of vi and Vim. To see the differences between
    vi and Vim, type:help vi_diff.txt while running the command. To install the vim6
    package, do the following as root user:pkg_add -r vim.


    Depending on how your vim package was built, you may or not get all the latest
    vim features first. In many cases, the compatible option is on, which causes conflicting
    behaviors between vi and vim to behave like vi (the text on undo later in this
    appendix). To turn on the latest vim features type:set incompatible while editing
    with vim or add this to your ~/.vimrc file:


    ```

    set incompatible

    ```'
