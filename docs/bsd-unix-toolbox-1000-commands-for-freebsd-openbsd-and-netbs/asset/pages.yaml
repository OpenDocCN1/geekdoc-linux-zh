    # Other Useful Network Tools


    If you''d like to see information about packets as they are sent and received
    by your system, use tcpdump. The tcpdump command has a lot of advanced features,
    most of which revolve around filtering and finding a needle in a haystack of packets.
    If you run tcpdump on a remote machine, your screen will be flooded with all the
    ssh traffic between your client and the remote machine. To get started without
    having to learn too much about tcpdump filtering rules, run the following command:


    ```

    # tcpdump not port ssh Find all TCP packets EXCEPT associated with ssh

    ```


    If you''d like to dig deeper into packet-level traffic, use wireshark (formerly
    known as ethereal). A graphical version of wireshark is available for the GNOME
    desktop environment (pkg_add -r wireshark). You can run wireshark with X over
    on a remote machine. Wireshark is a very powerful packet sniffer that rivals the
    best tools.


    To explore networks and machines and what services they offer, use nmap (pkg_add
    -r nmap). The nmap command is the most common port scanner. It even featured in
    the movie The Matrix Reloaded. Make sure that you are authorized to scan the systems
    or networks you are using. The nmap command is part of the nmap package and can
    be run as a user, but several scans require root privilege.


    Here''s how to do a basic scan with nmap:


    ```

    # nmap 127.0.0.1 Scan your localhost, to see how nmap works

    # nmap 10.0.0.1 Scan ports on computer at 10.0.0.1

    ```


    To get maximum verbosity from nmap, use the -vv option:


    ```

    # nmap -vv -sP 10.0.0.0/24 Show maximum verbosity from nmap

    ```


    To use nmap to scan an network, use the network address as an argument. In the
    following example, we add the -sP option to tell nmap to perform a simple ping
    sweep:


    ```

    # nmap -vv -sP 10.0.0.0/24 Scan hosts on an entire network

    ```


    You can be very specific about the information that nmap gathers for you. In the
    following example, the -P0 option tells nmap not to use ping (this is good for
    scanning machines that don''t respond to ping). The -O option displays OS fingerprinting
    for'
