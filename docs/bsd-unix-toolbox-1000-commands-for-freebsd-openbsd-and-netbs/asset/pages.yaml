  md: "# Chapter 12: Accessing Network Resources\n\n# Transferring Files\n\nCommands\
    \ available with FreeBSD for downloading files from remote servers (HTTP, HTTPS,\
    \ FTP, or SSH) are plentiful and powerful. You might choose one command over another\
    \ because of the specific options you need. For example, you may want to perform\
    \ a download over an encrypted connection, resume an aborted download, or do recursive\
    \ downloads. This section describes how to use wget, lftp, scp, and sftp.\n\n\
    # Downloading Files with wget\n\nSometimes you need to download a file from a\
    \ remote server using the command line. For example, your link goes through several\
    \ HTTP redirects that prevent pkg_add from installing from HTTP. Or you may want\
    \ to script the automated download of a file, such as a log file, every time.\n\
    \nThe wget command can download files from web servers (HTTP and HTTPS) and FTP\
    \ servers (pkg_add -r wget). With a server that does not require authentication,\
    \ a wget command can be as simple as the wget command and the location of the\
    \ download file:\n\n```\n$ wget http://upload.wikimedia.org/wikipedia/commons/2/2c/Chollad.jpg\n\
    ```\n\nIf, for example, an FTP server requires a login and password, you can enter\
    \ that information on the wget command line in the following forms:\n\n```\n$\
    \ wget ftp:user=password@ftp.example.com/path/to/file\n$ wget --user=user --password=password\
    \ ftp://ftp.example.com/path/to/file\n```\n\nFor example:\n\n```\n$ wget ftp:mykulpwd@ftp.linuxoys.net/home/chris/image.jpg\n\
    $ wget --user=chris --password=mykulpwd \\\n  ftp://ftp.linuxoys.net/home/chris/image.jpg\n\
