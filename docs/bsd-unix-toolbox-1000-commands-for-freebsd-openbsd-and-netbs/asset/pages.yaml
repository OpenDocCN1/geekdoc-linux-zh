  md: '# Searching for Text with grep


    The grep command is handy when you need to perform more advanced string searches
    in a file. In fact, the phrase to grep has actually entered the computer jargon
    as a verb, just as of Google has entered the popular language. Here are examples
    of the grep command:


    ```

    $ grep francois myfile.txt

    # grep -i ftp /etc/services

    # ps auxw | grep

    # ps auxw | grep "\*\"

    # dmesg grep "[ata]\\||ata"

    ```


    Show lines containing francois

    Show lines containing FTP

    Show init lines from ps output

    Show bracketed commands

    Show ata kernel device information


    These line commands have several uses, beyond being examples of the grep command.
    By searching /etc/services for ftp you can see port numbers associated with FTP
    services. Displaying bracketed commands that are output from the command is a
    way to see commands for which ps cannot display options. The last command checks
    the kernel buffer ring for any ATA device information, such as hard disks and
    CD-ROM drives.


    The grep command can also recursively search a few or a lot of files at the same
    time. The following command recursively searches (-R) files in the /usr/local/etc
    and /etc directories for your search ftp (-i for any case):


    ```

    $ grep -R ftp /usr/local/etc /etc | less

    ```


    Add line numbers (-n) to your grep command to find the exact lines where the search
    terms occur:


    ```

    # grep -R ftp /etc /usr/local/etc | less

    ```


    To colorize the searched term in the search results, add the --color option:


    ```

    # grep --color -Rin ftp /etc/services | less

    ```


    By default, in a multi-file search, the file name is displayed for each search
    result. Use the -h option to disable the display of file names. This example shows
    the string relay in the files dmesg.today, dmesg.yesterday, and so on:


    ```

    # grep -h acvi /var/log/dmesg*

    ```


    If you want to ignore case when you search messages, use the -i option:


    ```

    # grep -i audio /var/log/messages  Search file for audio (any case)

    ```'
