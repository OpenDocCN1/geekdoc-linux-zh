  md: '# Chapter 7: Administering File Systems


    # Table 7-1: File System Types Supported in FreeBSD (continued)


    | File System Type | Description |

    |---|---|

    | reiserfs | Journaling file system that used to be the default on some SUSE,
    Slackware, and other Linux systems. Reiserfs is not well-supported on many BSD
    systems. |

    | swap | Used on swap partitions to hold data temporarily when RAM is not currently
    available. |

    | unionfs | Often used on live CDs to give the appearance of being able to read-only
    file systems, while the actual saved data resides in a writable area (such as
    a ramdisk). |


    Besides the file system types listed, there are also what are referred to as network
    shared file systems. Locally, a network shared file system may be a ufs, nfs,
    or other normal file system type. However, all or part of those file systems can
    be shared with network protocols such as Samba (smbfs file system type), NFS (nfs),
    and NetWare (nwfs).


    You can use procedures in the following sections to create, manage, mount, and
    other-use the file system types just described.


    # Creating and Managing File Systems


    FreeBSD gives you the option of either having the installer create a default partitioning
    and file system scheme or letting you set all up manually when you install FreeBSD.
    It does this by running the sysinstall utility, which in turn use tools such as
    bslabel and fdisk to actually change your disk slices and partitions.


    After your system is installed, you can use sysinstall to create or change partitions
    and slices. Or, you can use command-line utilities to directly change and work
    with your disk partitions and the file systems created on those partitions.


    # Slicing and Partitioning Hard Disks


    Historically, PC hard drives have used a 32-bit PC-BIOS partition table with a
    Master Boot Record (MBR). This limits the sizes of partitions (referred to as
    slices in BSD systems) to 2TB and allows only four partitions per device. The
    use of extended partitions is a way to overcome the four-partition limit. In order
    to overcome the 2TB limit, PC-BIOS partition tables are being replaced with GPT
    (GUID Partition Tables).


    FreeBSD uses the fdisk utility to create and manage slices. It uses the bsdlabel
    utility to work with the partitions within each slice. Both have simplified interfaces
    available through the sysinstall utility.'
