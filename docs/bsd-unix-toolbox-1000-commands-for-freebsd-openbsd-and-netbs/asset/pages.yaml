    | cmd1 < | Redirects standard input to command. |

    | cmd1 >> | Append standard output to file command, without erasing its contents.
    |

    | cmd1 | cmd2 | Pipe the output of one command to the input of the next. |

    | cmd1 & | Run the command in the background. |

    | cmd1 && cmd2 | Run first command, then, if it returns a zero exit status, run
    the second command. |

    | cmd1 ; cmd2 | Run the first command and, when it completes, run the second command.
    |


