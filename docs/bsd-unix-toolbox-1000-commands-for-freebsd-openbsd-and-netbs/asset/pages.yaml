    # Mounting and Unmounting File Systems


    Before you use a regular, non-swap file system, you need to attach it to a directory
    in your computer file tree by mounting it. Your root file (/) and other file systems
    you use on an ongoing basis are typically mounted automatically based on entries
    in your /etc/fstab file. Other file systems can be mounted manually as they are
    needed, using the mount command.


    # Mounting File Systems from the fstab


    When you install FreeBSD, the /etc/fstab file is usually set up automatically
    to contain information about your root partition and other partitions. Those partitions
    can be set to mount at boot time or be ready to mount manually (with mount points
    and options ready to use when a manual mount is done).'
