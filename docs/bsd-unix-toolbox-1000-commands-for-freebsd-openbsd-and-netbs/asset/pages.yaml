  md: '# Chapter 9: Checking and Managing Running Processes


    The kill command can send signals to processes by ID or job number the killall
    command can send processes by command name. Here are some examples:


    ```

    $ kill 28665

    $ kill - 4895

    $ kill -SIGCONT 5254

    $ kill %3

    $ killall spamd

    $ killall -SIGHUP sendmail

    ```


    Send SIGTERM to process with PID 28665

    Send SIGKILL to process with PID 4895

    Continue a stopped process (pid 5254)

    Kill the process represented by job #3

    Kill all daemons currently running

    havemail processes reread config files


    The SIGHUP (9) signal, used generally by trigger-happy administrators, should
    be reserved as a last resort. It does not allow the process to exit cleanly but.
    This can potentially result in loss or corruption of data handled by that process.
    The SIGHUP was originally used on UNIX systems to indicate that a terminal was
    disconnected from a mainframe (such as a hang of a dial-in modem). However, daemon
    processes, such as sendmail and httpd, were implemented to catch SIGHUP signals
    as an indication that these processes should reread configuration files.


    # Running Processes Away from Current Shell


    If you want a process to continue to run, even if you disconnect from the current
    shell, there are several ways to go about that. You can use the nohup command
    to run a process in a way that is impervious to a hang-up signal:


    ```

    $ nohup mylongcript.sh &\n# nohup nice -9 gcc hello.c &

    ```


    Run mylongcript.sh with no ability to interrupt

    Run gcc uninterrupted and high priority


    Using nohup is different than running the command with an ampersand alone because
    nohup the command will keep running, even if you exit the shell that launched
    the command.


    The nohup command was commonly used in the days of slow processes and dial-up
    connections (so you didn''t have to stay logged into an expensive connection while
    a long compile completed). Also, today using tools such as screen (described in
    Chapter 13) you can keep a shell session active, even if you disconnect your network
    connection to that shell.


    # Scheduling Processes to Run


    Commands associated with the cron facility can be used to set a command to run
    at a specific time (including now) so that it is not connected to the current
    shell. The at command runs a command at the time you set. Enter the at command,
    type the commands you want to run at the later time, and press Ctrl-D to queue
    the job:


    ```

    # at now +1 minute

    at ls -R /usr/ports > /tmp/portlist.txt

    at <Ctrl+D> <EOT>

    job 5 at Thu Mar 20 20:37:00 2008

    # at teatime

    ```


    Start command running in one minute

    Start command at 4pm today'
