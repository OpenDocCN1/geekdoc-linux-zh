    # Sharing Remote Directories with Samba


    Samba is the open source implementation of the Windows file and print protocol
    originally known as Server Message Block (SMB) and now called Common Internet
    File System (CIFS). There is an implementation of Samba in BSD, as well as in
    many other operating systems. You can install the basic Samba package by typing
    this as root user:


    ```

    $ pkg_add -r samba3

    ```


    Graphical tools for sharing, querying, and mounting SMB directories from Windows
    include the Samba SWAT web-based administration tool. To use SWAT in FreeBSD,
    enable the inetd service (inetd_enable=YES) to /etc/rc.conf and turn on SWAT (reboot
    or /usr/sbin/inetd -W -C 60) and open SWAT by pointing your browser to the SWAT
    screen (http://localhost:901) and typing the root user name and password.


    You can create an initial /usr/local/etc/smb.conf file from the SWAT screen or
    create it directly using any text editor. Commands for working with Samba shares
    can be used to add shares, view your configuration from the SWAT screen, query
    Samba servers, mount directories, and share directories.


    To start a Samba server, you can run the nmbd and smbd servers manually. However,
    if you have SWAT running as described above, you can start the entire service
    (with the proper options), add shares, and view your configuration from the SWAT
    screen. From the Samba screen, select STATUS, then choose All to start the service.


    # Viewing and Accessing Samba Shares


    To scan your network for SMB hosts, type the following:


    To view a test representation of your network neighborhood (shared directories
    and printers), use smbtree


    ```

    $ smbtree *****

    Password: *****

    MYGROUP

    \THOMPSON


    Samba Server Version 3.0.25a-3.fc

    ```'
