    command also offers the advantage of keeping a session open by default until you
    close it, so you don''t need to do anything special for multi-burn sessions.


    Here is an example of growisofs commands for a multi-burn session:


    ```

    # growisofs -Z /dev/cd0 -R -J /home/chris    Master and burn to DVD

    # growisofs -Z /dev/cd0 -R -J /home/francois  Add to burn

