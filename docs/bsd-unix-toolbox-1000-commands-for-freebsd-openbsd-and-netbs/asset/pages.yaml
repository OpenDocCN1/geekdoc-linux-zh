  md: '# # Starting with BSD Systems


    Whether you use BSD systems every day or just tweak once in a while, a book that
    presents efficient ways to use, check, fix, secure, and enhance your system can
    be an invaluable resource.


    BSD UNIX Toolbox is that resource.


    BSD UNIX Toolbox is aimed primarily at BSD power users and systems administrators.
    To give you what you need, we tell you how to quickly locate and get software,
    monitor the health and security of your systems, icons, and access network resources.
    In short, we cut to the most efficient ways of using BSD systems.


    Our goal with BSD UNIX Toolbox is to pack a lot of useful information for using
    systems into a small package that you can carry around with you. To that, we describe:


    +   - Commands Tons of command line examples to use BSD systems in helpful and
    clear ways


    +   - GUI Tools Quick pointers to graphical administration tools to configure
    your system


    +   - Software packages Short procedures to find and download tons of applications


    +   - Online resources Listings of the best locations to find BSD forums, mailing
    lists, IRC channels, and other online resources


    +   - Local documentation Tools for gathering more information from man pages,
    doc directories, help commands, and other resources on your BSD system


    Because you''re not a beginner with BSD systems, you won''t see a lot of screenshots
    of windows, icons, and menus. What you will see, however,'
