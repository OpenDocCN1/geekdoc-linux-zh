  md: '# Chapter 10: Managing the System


    # Using bsdlabel to Check Out Partitions


    When you first installed FreeBSD, the sysinstaller created partitions on your
    BSD disk slice. To display and work with those partitions within a particular
    BSD disk slice, you can use the bsdlabel command. Assuming that the first slice
    of your disk contains your BSD-slice, type the following command to see the partitions
    on the slice:


    ```

    # bsdlabel ad0s          Display partitions on BSD disk, slice 1

    # /dev/ad0s:

    8 partitions:

    # size    offset  fsize bps [cpg]

    a 1048576      0       4.2BSD  2048 163844 8

    b 975760               swap

    c 4094962      0       # "raw" part, don''t edit

    d 2584576    2024336  4.2BSD  2048 163844 28552

    e 1048576    4608912  4.2BSD  2048 163844 8

    f 3529134    5657448  4.2BSD  2048 163844 28552

    ```


    The output from bsdlabel shows the different partitions within the first slice
    of the first IDE hard drive (ad0s1). You can better see how these partitions relate
    to how you use your system by running the df command to display mounted partitions:


    ```

    # df -h          Mounted partitions

    Filesystem      Size  Avail Capacity Mounted on

    /dev/ad0s1      496M   39M  418M 8%        /

    /devs           1.0K    0B  100%       /dev

    /dev/ad0s11     496M   16K  456M 0%         /usr

    /dev/ad0s11f    160     1.7G   13G  11%        /tmp

    /dev/ad0s11d    1.2G    19M    2%         /var

    ```


    As you can see, eight partitions, partition a, d, e, and f are mounted on the
    root (/), /var, /tmp, and /usr directories, respectively. Partition b is the swap
    partition. Partition c is the "raw" part and should not be modified. The devfs
    file system, /dev, provides access to the computer''s hardware devices.


    Because the discussion in this chapter relates to the boot process, refer to Chapter
    7 for information on other uses of the bsdlabel and fdisk commands for creating
    and modifying disk slices and partitions.


    # Changing to the GRUB boot loader


    There is no reason to use the boot0 boot loader to boot your BSD system. In these
    days, many people use the Grand Unified Boot Loader (GRUB), especially in situations
    where they are booting multiple operating systems, such as Linux. GRUB has some
    features, such screens and menus for editing boot options.


    176'
