  md: '# 14


    # # Locking Down Security


    Securing your BSD system means many things things. To be secure, you need to restrict
    access to the user accounts and services on the system. However, after that, security
    means checking that no one has gone around the defenses you have set up.


    FreeBSD, NetBSD, OpenBSD, and other systems based on BSD distributions are designed
    in many ways to be secure. That means that there are no user accounts with blank
    passwords, that the firewall is restrictive by default, and that most network
    services (Web, FTP and so on) are off by default (even if the service''s software
    is installed).


    As someone setting up a BSD system, you can go beyond the default settings to
    make your system even more secure. For example, by setting up services in jailed
    jails you can prevent an intruder from accessing parts of the system that are
    outside the compromised service. By encrypting critical data, you can make it
    nearly impossible for someone to use stolen data.


    | IN THIS CHAPTER |

    | Add user accounts and change user settings with adduser |

    | Delete users with rmuser |

    | Add and change passwords with passwd |

    | See who''s logged in with last and now |

    | Configure firewalls with ipfw |

    | Manage log files Syslog |

    | Check out advanced security with tripwire and chkrootkit |


    Many of the commands in this chapter can be used to check and improve the security
    of your BSD system, some basic BSD features are particularly geared towards security.
    For example, secure user accounts with good password protection, a solid firewall,
    and consistent logging (log monitoring) are critical to having a secure BSD system.
    Commands related to those features, plus some advanced features related to protecting
    network services, are covered in this chapter.


    > NOTE A lot of computer security efforts focus on protecting computers from outside
    attackers, policies protecting data from those inside a company have become a
    growing issue. Procedures in this chapter should be enhanced with policies that
    restrict internal users from accessing data they don''t need for their jobs and
    tracking improper access from these users.'
