    aliases. |

    | $ pkg_info -W convert\n /usr/local/bin/convert\n installed by package ImageMagick-6.3.6.9
    | Find which package the convert command is from. |


    If you suspect the command you want is not installed, you can search the ports
    database for the package that it is in. If you find the right package (for example,
    bzflag) and it isn''t installed, install it from the Internet as root by typing
    the following:


    ```

    # find /usr/ports | grep ImageMagick

    /usr/ports/graphics/ImageMagick


    # pkg_add -r ImageMagick

    ```


    The command just shown grabs the ImageMagick binary package (in tar bzip2 format)
    from a BSD software repository and installs it from the local system. Refer to
    Chapter 2 for information on other methods of installing software, such as using
    the ports system.


    # Command Reference Information in BSD


    Original BSD, Linux and UNIX documentation was all done on manual pages, generally
    referred to as man. A slightly more sophisticated documentation effort came a
    bit later with the info facility. Within each command itself, help messages are
    almost always available.


    This reference information is component oriented — in other words, there are separate
    man pages for every command, file format, system call, device, and other component
    of a BSD system. Documentation more closely aligned to whole software packages
    is typically stored in a subdirectory of the /usr/local/share/doc directory.


    All three reference features — man pages, info documents, and help messages —
    are available in BSD systems.'
