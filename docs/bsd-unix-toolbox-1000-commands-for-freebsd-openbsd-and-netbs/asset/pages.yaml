    # Summary


    Despite not having a graphical installer, FreeBSD offers some sophisticated tools
    for installing and working with software packages. Initial installation is done
    using the sysinstall utility. After the system is installed, you have the choice
    of installing additional software packages from binary packages or source code.


    For binary packages, you can use pkg_add, pkg_delete, and pkg_info. For building
    packages from source code, you can use the make command, with a variety of options.


    There are many tools available to manage your computer''s ports collection. You
    can use portupgrade to update some or all of the ports in the collection. If you
    have security concerns about your computer, the portaudit command can download
    all of your installed packages and report on potentialial security holes contained
    in the software.


    Because files can build up over time in temporary directories when you install
    a lot of applications from ports, you can use commands such as portcollection
    and pkg_cutleaves to clean up unneeded files. With portcollection you can clean
    out workdirectories of files left behind. With pkg_cutleaves, you can remove packages
    that are not referenced by any other package.'
