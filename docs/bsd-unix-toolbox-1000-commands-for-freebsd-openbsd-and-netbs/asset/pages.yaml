    # Finding About File System Use


    Running out of disk space can be annoying on your desktop and potentially a disaster
    on your servers. To determine how much disk space is available and how much is
    currently in use, you use the df command. To check how much disk space particular
    files and directories occupy, use the du command.


    The df command provides utilization summaries of your mounted file systems. Using
    the -h option, you can have the data (which is shown by default) converted to
    kilobytes (K), megabytes (M) and gigabytes (G), to make output human-readable:


