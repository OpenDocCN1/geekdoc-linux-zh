    root (hd0,1)

    chainloader +1

    ```


    At this point you should be able to reboot your computer and see the GRUB screen
    after control is passed off from the BIOS.


    Instead of using chainloader, you can be more specific about the next stage of
    the boot process. For BSD systems, you can call the loader program directly. For
    Linux systems, you can identify the location of the kernel to boot. Here are examples:


    ```

    title FreeBSD

    root (hd0,0,a)

    kernel /loader

    ```


    ```

    title Debian GNU/Linux, kernel 2.6.18-4-686

    root (hd0,1)

    kernel /boot/vmlinuz-2.6.18-4-686 root=/dev/hda2 ro

    initrd /boot/initrd.img-2.6.18-4-686

    ```


    In the example shown, select the FreeBSD from the GRUB boot screen run /loader
    from hard disk (disk 0, slice 0, and partition a). The Debian will boot the selected
    kernel directly to the selected kernel (vmlinuz) and initial RAM disk (initrd).


    You can do things with GRUB as well. For example, you can use an image as a splash
    screen for GRUB boots. Create a 16-color, 640 x480 image, save it to XPM format.
    Do this in the GNU Image Manipulation Program (The GIMP) by selecting Image <-
    Color, then setting the number of colors to 16. Next, gzip the image and copy
    it to the `/boot/grub` directory. For example, if you created an image named splash.xpm.gz,
    you could identify the image as your splash screen by adding this to the menu.list
    entry:


    ```

    splashimage=(hd0,0,a)/boot/grub/splash.xpm.gz

    ```


    # Controlling System Services


    Many BSD administrators leave the start-up features alone and focus on configuring
    and enabling system services. Most of the optional services are represented by
    start-up scripts in the `/etc/rc.d` directory. The service is actually turned
    on and configured in the `/etc/rc.conf` file.'
