  md: "# Chapter 2: Installing FreeBSD and Adding Software\n\n# Checking Packages\
    \ and Ports\n\nFreeBSD comes with a lot of tools for making sure the software\
    \ you install is both safe and up-to-date. There are also tools for comparing\
    \ installed packages to see if they match what is in the latest ports and to update\
    \ your ports collection to the latest versions. This section contains examples\
    \ of commands for checking your installed packages.\n\n# Checking Installed Packages\
    \ Against Ports\n\nYou can use the pkg_version command to find out if one or more\
    \ installed packages is up-to-date with the latest version from the ports collection.\
    \ For example, if you check packages with a string name in their is up-to-date,\
    \ try using the -s option as follows:\n\n```\n# pkg_version -v               \
    \ Check if all packages are up-to-date (verbose)\n# pkg_version -v -s ftp    \
    \  Check if ftp packages are up-to-date with ports\nftopcopy-0.6.7           \
    \    = up-to-date with port\nlftp-3.5.4_1                  = up-to-date with port\n\
    ```\n\nThe ports collection index file is stored in /usr/ports/INDEX-6, by default.\
    \ When you run the pkg_version command, packages are checked against that file.\
    \ To check against a different INDEX file, for example from an earlier or later\
    \ release, add the name of that INDEX file (either locally or on the Internet)\
    \ to the end of the command line as:\n\n```\n# pkg_version /tmp/INDEX      Check\
    \ packages against local INDEX file\n```\n\n# Upgrading Ports\n\nTo keep your\
    \ ports collection up-to-date, you can use the portupgrade command. Once portupgrade\
    \ is installed, you can use it to upgrade individual packages or update the entire\
    \ ports collection. Here's an example of updating an individual package in the\
    \ ports collection:\n\n```\n# pkg_add -r portupgrade      Update Conquer software,\
    \ if it's installed\n# portupgrade -R conquer          \n[Rebuilding the pkgdb\
    \ (format:bdb-tree) in /usr/ports ...\n1598 port entries found. .................................................\n\
    ```\n\nAnother tool for upgrading installed ports is portmanager. After installing\
    \ portmanager, you can upgrade port skeletons for whatever ports you choose. Here\
    \ are some examples:\n\n```\n# cd /usr/ports/ports-mgmt/portmanager\n\n# make\
    \ install                Compile and install portmanager.\n# portmanager -u  \
    \           Upgrade all ports\n# portmanager math/numeric    Upgrade selected\
    \ ports\n```"
