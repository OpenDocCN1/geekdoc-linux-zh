    \ the running setup turns your machine into a time server, listening on UDP port\
    \ 123. Unless you have specific needs (and your own GPS or atomic clock), running\
    \ ntpd on your machine can be a waste of resources (often in a daily cronjob)\
    \ to set their system time via NTP. For that reason, system administrators prefer\
    \ using ntpdate (to set their system time via NTP:\n\n```\n# ntpdate pool.ntp.org\
