  md: '# Chapter 3: Using the Shell


    # Using aliases


    Use the alias command to set and list aliases. Some aliases are already set in
    each user''s ~/.cshrc file, if a user uses the csh shell. Here''s how to list
    the aliases that are currently set for that shell:


    ```

    # alias

    h      (history 25)

    j      (jobs -1)

    la     (ls -a)

    lf     (ls -FA)

    11     (ls -IA)

    ```


    Aliases can be as simple as a way of adding options to the default behavior of
    a command (such as alias mv mv -i, so that the user is always prompted before
    moving a file). To define other aliases for the csh shell, use the alias command,
    followed by the alias name and command to run. For example:


    ```

    $ alias fi="find . | grep "

    ```


    Using the alias as shown, typing fi string causes the current directory and its
    subdirectories to be searched for any file names containing the string you entered.
    You can define your aliases for the current bash session as follows:


    ```

    $ alias la=''ls -la''

    ```


    Add that line to your ~/.bashrc for the definition to occur for each new bash
    session. Remove an alias from the current bash session using the unalias command,
    as follows:


    ```

    # unalias la      Unalias the previously aliased command

    # unalias -a     Unalias all aliased commands

    ```


    # Tailing Files


    To watch the contents of a plain text file grow over time, you can use the tail
    command. For example, you can watch as messages are added to the /var/log/cron
    file as follows:


    ```

    $ tail -f /var/log/cron

    ```


    Press Ctrl+C to exit the tail command.


    # Acquiring Super-User Power


    When you open a shell, you are able to run commands and access files and directories
    based on your user/group ID and the permissions set for those components. Many
    system features are restricted to the root user, also referred to as the super
    user.


