    # Connecting to a Windows Desktop with rdesktop


    If you prefer not to use the tsclient wrapper described above, you can log in
    to a remote Windows desktop using the rdesktop command. The rdesktop command requests
    a login to the Windows machine, then opens the Windows desktop for the user after
    you log in. Here are examples of the rdesktop command:


    ```

    $ rdesktop 172.16.18.16

    $ rdesktop -u chris -p M6pyXX win

    $ rdesktop -f win

    $ rdesktop -r sound=:local win

    $ rdesktop -E win

    ```


    If you disable client/server encryption, the login packet is encrypted, but everything
    after that is not. Although this can improve performance greatly, anyone sniffing
    your LAN may be able to see your clear-text communications (including any interactive
    logins after the initial login packet). Other rdesktop options that improve performance
    on your Windows desktop include -m (don''t send mouse events), -D (hide window
    manager''s decorations), and -K (don''t override window manager bindings).


