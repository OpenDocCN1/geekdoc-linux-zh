- img_proc: true
  md: '# Chapter 14: Locking Down Security


    Although there are graphical tools for adding, removing, modifying groups (such
    as the Users and Groups window in GNOME), most administrators must manually edit
    the /etc/group file to work with groups. The format of the /etc/group file is
    like a shortened /etc/passwd file.


    Here is a shortened version of the /etc/group file to illustrate a few groups:


    ```

    wheel:*0

    tty:*4

    operator*:5:root

    mail:*6

    bin:*7

    www:*80

    nogroup:*65533

    nobody:*65534

    cups:*193

    sales:*1001:curt,mike,sally

    wnelson:*2001:

    jbjing:*2002:mike,sally

    ```


    The structure of the /etc/group file is group name, password (optional), group
    ID, and users assigned to that group. Normally, the password field simply has
    an asterisk (*) in it. Users are assigned in a comma-separated list.


    The group conventions with FreeBSD include starting regular user accounts at 1001
    and above. Accounts below 100 are administrative groups. Special groups, typically
    used for mapping group permissions for users across network interfaces, include
    nogroup (GID 65533) and nobody (GID 65534).


    When you add a user with the adduser command, the default is to create a new group
    and assign the ID to that. This approach ensures that less care need to be taken
    when protecting the permissions of a file the user creates. Other users can be
    added to a user''s group if they need to work on a project together.


    If you use any of the existing groups, the wheel group is the one you will most
    be interested in. Adding a user to the wheel group is a common way to provide
    root privilege to that.


    Keep in mind that removing a group or user doesn''t remove the files, directories,
    devices or other items owned by that group or user. If you do a long list (ls
    -1) of a file or directory assigned to a user or group that was deleted, the UID
    or GID of the deleted user or group is displayed, instead of a user or group name.


