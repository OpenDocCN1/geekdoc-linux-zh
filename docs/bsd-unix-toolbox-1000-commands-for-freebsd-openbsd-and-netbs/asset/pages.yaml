    # Summary


    If you ever find yourself in a position where you need to administer multiple
    BSD systems, you have a rich set of commands with BSD systems for doing remote
    system administration. The Secure Shell (SSH) facility offers encrypted communications
    between clients and servers for remote login, tunneling, and file transfer.


    Virtual Network Computing (VNC) lets one BSD system share its desktop with a client
    system so that the remote desktop appears right on the client’s desktop. With
    tools like Vino, you can even share a desktop in such a way that the VNC server
    and client both work from the same desktop at the same time.'
