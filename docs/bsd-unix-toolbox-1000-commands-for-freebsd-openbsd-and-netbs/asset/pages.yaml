    # Understanding File System Types


    To use FreeBSD, you can get by very few different file system types. The UNIX
    File System (UFS) is used for most disk storage needs. As noted earlier, you should
    also have at least one partition defined as a swap area. However, cases where
    you might want to use other file system types with FreeBSD include:


    +   - Other Operating Systems: If multiple operating systems (such as Windows
    or Linux) are installed on your hard disk, you might want to access the data from
    the partitions containing those systems (even if only to read the data).


    +   - Other Media: You may have a CD, DVD, backup tape, or other media that contains
    data formatted in other file system types. Even in cases where FreeBSD can’t create
    file systems of a certain type, you might be able to mount and use those file
    systems.


    Most of the examples in this chapter use UFS file systems to illustrate how a
    file system is created and managed. However, Table 7-1 lists different file system
    types and describes when you want to use them.


    # Table 7-1: File System Types Supported in FreeBSD


    | File System Type | Description |

    | --- | --- |

    | ufs | Default file system type used with FreeBSD and other BSD systems |

    | ext2fs | Most commonly used file system with Linux is ext3. It contains journaling-features
    for safer data and reboots after unintended shutdowns. The ext2fs file system
    is the predecessor of ext3, but doesn’t contain journaling. Each type can be mounted
    as an ext2fs in FreeBSD. However, journaling will not be enabled if you mount
    an ext3 file system using mount_ext2fs. |

    | cd9660 | File system used on most CDs and DVDs. Evolved from the High Sierra
    file system (which was the original standard used on CD-ROM). May contain Ridge
    extensions to allow cd9660 file systems to support long filenames and other information
    (file permissions, ownership, and links). |

    | msdfs | MS-DOS file system. Can be used to mount older MS-DOS file systems,
    such as those on old floppy disks. |

    | ntfs | Microsoft New Technology File System (NTFS). Useful when file systems
    need to share files with most Windows systems (as with dual booting or removable
    drives). |'
