- img_proc: true
  md: '# Chapter 14: Locking Down Security


    scripts in the /etc/rc.d directory. These scripts can be run with simple arguments,
    such as start, stop, or restart in order to get the services they provide running.


    +   - rc.conf files: When and how the rc.d scripts runs is determined by entries
    in rc.conf files. The /etc/defaults/rc.conf file contains the default setting
    of available services. However, it also holds tons of commented lines that can
    be uncommented and modified to launch the service scripts in the /etc/rc.d directory.
    To change how services start from the default, you can create an /etc/rc.conf
    file, then copy and uncomment entries from the original rc.conf file.


    When FreeBSD and other BSD systems up, the rc.conf files are read and the appropriate
    services (with appropriate settings) are started. The start of this section is
    devoted to showing you entries you can add to /etc/rc.conf file to start and secure
    a variety of network services. (Refer to Chapter 12 for basic ways of enabling
    NFS and Samba network.)


    **WARNING!** If you make a mistake in /etc/rc.conf file, it is possible for that
    mistake to keep your system from booting completely. Be very careful editing your
    /etc/rc.conf file (and have a disk handy just in case).


    The examples below are taken from the Network Configuration Sub-Section of the
