  md: '# Backing Up Over Networks


    After you have backed up your files and gathered them into a tar archive, what
    do you do with that archive? The primary reason for having a backup is in case
    something happens (such as hard crash) where you need to restore files from that
    practice. Methods you can employ to keep backups safe include:


    +   - Copying backups to removable media such as tape, CD, or DVD (as described
    later in this chapter)

    - Copying them to another machine over a network


    Fast and reliable networks, inexpensive high-capacity hard disks, and the security
    that comes with moving your data off-site have all network backups popular practice.
    For an individual backing up personal data or for a small office, combining a
    few simple commands may be all you need to execute and secure backups. This approach
    represents a direct application of the UNIX philosophy: joining together simple
    programs that do one thing to get a more complex job done.


    Although just any command that can copy files over a network can be used to move
    your data to a remote machine, some utilities are especially good for the job.
    You can set up passwordless transfers of backups and encrypted transmissions of
    other machines.


    Tools such as the rsync command can save resources by backing up only files (or
    parts of files) that have changed since the previous backup. With tools such as
    unison (www.cis.upenn.edu/~bpierce/unison/), you can back up files over a network
    from Windows, as well as BSD systems.


    The following sections describe some of these techniques for backing up your data
    to other machines over a network.


    > NOTE A tool that might interest you is the rsnapshot command (pkg_add -r rsnapshot).
    The rsnapshot command (www.rsn.org/) can work with rsync to make configurable
    hourly, daily, weekly or monthly snapshots of a file system. It uses hard links
    to keep a snapshot of a file system, which it can then sync with changed files.


    # Backing Up tar Archives Over ssh


    OpenSSH (www.openssh.org/) provides tools to securely remote login, remote execution,
    and remote file copy over network interfaces. By setting up two machines to share
    encryption keys, you can transfer files between those machines without entering
    for each transmission. That fact lets you create scripts to back up your data
    from an SSH client to an SSH server, without any manual intervention.'
