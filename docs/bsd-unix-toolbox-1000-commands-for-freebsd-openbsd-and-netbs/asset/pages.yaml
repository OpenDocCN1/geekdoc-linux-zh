  md: '# Appendix A: Using vi or Vim Editors


    # Starting and Quitting the vi Editor


    If you want to experiment with vi, you should copy a text file to practice on.
    For example, type:


    ```

    $ cp /etc/services /tmp

    ```


    Then open that file using the vi command as follows:


    ```

    $ vi /tmp/services

    ```


    To benefit from the improvements of Vim, make sure you have the FreeBSD vim6 package
    installed. On many systems, vi is aliased to the vim command. You may want to
    double-check, that the alias command. If you want to use vim directly, type /usr/local/bin/vim.
    If you specifically want to use the older-style vi command, use the full path
    to /tmp/vi command instead


    ```

    /bin/vi /tmp/text.txt

    ```


    Here are a few ways you can start vi:


    +   - vi +25 /tmp/services      Begin on line 25

    - vi +/tmp/services      Begin editing file on the last line

    - vi +/tty /tmp/services Begin on first line word with "tty"

    - vi -r /tmp/services      Recover file from crashed edit session

    - view /tmp/services      Edit file in read-only mode


    When you are done with your session, you have several different ways to save and
    quit. To save the file before you are ready to quit, type w: either ZZ or :wq.
    To quit without saving changes, type q!. If you find you can''t write to the file
    you are editing, it may be opened in read-only. If that''s the case, you can try
    forcing a write by typing,w! or you can save the contents of the file to a different
    name. For example, type the following to save the contents of the current file
    to a file named myfile.txt:


    ```

    :w /tmp/myfile.txt

    ```


    > NOTE It''s important to understand that :w writes the current file out to another
    file. If you continue editing, you are still editing the original file. In the
    example above, if you started the services file, then write the contents to myfile.txt,
    to continue editing myfile.txt you would have to change it by typing the following-e:
    /tmp/myfile.txt.


    The vi editor also enables you to line several files at a time to edit. For example,
    type:


    ```

    $ cd /tmp

    touch a.txt b.txt c.txt

    vi a.txt b.txt c.txt

    ```'
