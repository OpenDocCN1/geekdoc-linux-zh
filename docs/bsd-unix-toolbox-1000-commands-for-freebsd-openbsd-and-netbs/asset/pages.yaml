  md: '# Chapter 2: Installing FreeBSD and Adding Software


    # # Auditing Installed Packages


    The **portaudit** command (`pkg_add -r portaudit`) lets you check your installed
    packages for known security vulnerabilities. Regardless of whether or not your
    FreeBSD system is using the latest ports collection, you can use **portaudit**
    to check your installed packages against a database of security advisories.


    The **portaudit** database is kept in `/usr/local/etc/periodic/security` directory.
    The portaudit package contains a script in directory for updating the security
    advisories as they become available. Those advisories are updated by the FreeBSD
    security team, as well as by those who commit ports to the ports collection.


    You can run **portaudit** to get the latest ports security database:


    ```

    # portaudit -Fda Download the ports security database

    auditfile.tbz 100% of 47 kB 26 kBPs

    New database installed.

    ```


    Next you can check all installed packages against the security database by typing
    the following:


    ```

    # portaudit -a Check all installed packages against security database

    Affected package: libxine-1.1.2_2

    Type of problem: libxine buffer overflow vulnerability.

    ```


    > <http://www.FreeBSD.org/ports/portaudit/6ec0db42-6ce77-11dc-89b1-000e35248ad7.html>


    Affected package: xorg-server-6.9.0_5

    Type of problem: xorg multiple vulnerabilities.


    > <http://www.FreeBSD.org/ports/portaudit/fe2b6597-c9a4-11dc-8da8-0008a18a9961.html>


    44 package(s) in your installed packages found.

    You are advised to update or deinstall the affected pakage(s) immediately.


    Instead of waiting for packages to be installed, you can check a single package
    for vulnerabilities before it is installed using the **-f** option:


    ```

    # portaudit -f /usr/ports/distfiles/ftpcopy* Check a package for

    vulnerabilities

    0 problem(s) found.

    ```


    In the information produced by **portaudit**, security vulnerabilities are accompanied
    by links to descriptions of the vulnerabilities found. Then you can decide whether
    or not you want to update, patch, or remove the vulnerable software package.'
