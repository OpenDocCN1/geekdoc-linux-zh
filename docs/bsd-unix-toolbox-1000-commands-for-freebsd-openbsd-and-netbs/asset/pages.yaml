  md: '# Chapter 13: Doing Remote System Administration


    # # Configuring SSH


    Nowadays, the all-purpose tool of remote system administration is Secure Shell
    (SSH). SSH commands and services replace all the old remote tools, add strong
    encryption, public keys, and many other features. The most common implementation
    of SSH in the free and open source software world is OpenSSH (www.openssh.com),
    maintained by the OpenBSD project. OpenSSH provides both client and server components.
    Here are a few facts about SSH:


    +   - For Windows, you can use the SSH tools within Cygwin (www.cygwin.com). But
    unless you''re already using Cygwin (a UNIX-like environment for Windows), we
    recommend PuTTY (www.chiark.greenend.org/uk/sgatatham/putty). PuTTY is a powerful
    open source Telnet/SSH client.


    +   - Use SSH version whenever possible, because it is the most secure. SSH-enabled
    network applications may only support older, less secure versions. OpenSSH supports
    all versions. Some older BSD systems accepted SSH v1 and v2 connections. Newer
    releases accept version 2 by default.


    +   - In FreeBSD, to enable the SSH service, check that the following line is
    contained in the /etc/rc.conf file (which it should be by default):


    ```

    sshd_enable="YES"

    ```


    To configure the server, edit the /etc/ssh/sshd_config file.


    To configure the ssh client, edit the /etc/ssh/ssh_config file.


    If you prefer using graphical tools to administer your remote BSD system, you
    can enable X11 Tunneling (also called X11 Port Forwarding). With both the SSH
    client and server, you can start an X application on the server and have it displayed
    on the client. All communication across that connection is encrypted.


    FreeBSD comes with X11 forwarding turned on (X11Forwarding yes) for the server
    (sshd daemon). You still need to enable it on the client. To enable X11 forwarding
    for a one-time session, use connect with the following:


    ```

    $ ssh -X francois@myserver

    ```


    To enable X11 forwarding permanently for all users, add ForwardX11 to /etc/ssh/ssh_config.
    To enable it permanently for a specific user, add the lines to the user''s ~/.ssh/config.
    After these settings have been added, the -X option is no longer required to use
    X11 Tunneling. Run ssh to connect to the remote system as you would normally.
    To test that the tunneling is working, run xclock after ssh-ing into the remote
    machine, and it should appear on your client desktop.


    SSH Tunneling is an excellent way to use remote graphical tools!


    227'
