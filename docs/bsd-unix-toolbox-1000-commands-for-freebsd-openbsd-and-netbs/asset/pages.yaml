  md: '# Chapter 8: Backups and Removable Media


    discs. Because most modern operating systems need to save more information about
    file and directories than the ISO9660 standard includes, extensions to that standard
    were added to contain that information.


    Using the mkisosfs command, you can back up the file and directory structure from
    any point in your BSD file system and produce an ISO9660 image. That image can
    include the following kinds of extensions:


    +   - System Sharing Protocol (SUSP) are records identified in the Rock Ridge
    Interchange Protocol. SUSP records can include UNIX -style attributes, such as
    ownership, long file names, and special files (such as character devices and symbolic
    links).

    - Joliet records store longer file names in a format that makes them usable to
    Windows systems.

    - Hierarchical File System (HFS) extensions allow the ISO image to appear as an
    HFS file system, which is the native file system for Macintosh computers. Likewise,
    Data and Resources forks can be added in different ways to read


    When you set out to create your ISO image, consider where you will ultimately
    access the files you back up using mkisosfs (BSD, Linux, Windows, or Macs). The
    image you created, it can be created in different ways, the most obvious of which
    is to burn the image to a CD or DVD.


    Besides useful in producing or all portions of a BSD file system to use on a portable
    medium, mkisosfs is also useful for creating live CDs/DVDs. It does by adding
    boot information to the image that can launch a BSD kernel or other operating
    system, bypassing the computer’s hard drive.


    Because most BSD users store their personal files in their home directories, a
    common way to use mkisosfs to back up files is to back up everything under the
    /home directory. Here are some examples of using mkisosfs to create an image for
    all files and directories under the /home directory.


    ```

    # cd /tmp

    # mkisosfs -o home.iso /home              Create basic ISO9660 image

    # mkisosfs -o home2.iso -J -R /home         Add Joliet Rock Ridge extensions

    # mkisosfs -o home3.iso -J -R -hfs /home     Also add HFS extensions

    ```


    In each of the three examples above files and directories denote the /home directory
    are added to the ISO image. The first example has no extensions, so all file names
    are converted to DOS-style naming (8.3 characters). The second example uses Joliet
    and Rock Ridge extensions, so file names and permissions should appear as they
    did on the original BSD system when you open the ISO on a BSD, Linux, or Windows
    system. The last example also makes the files on the image readable from a Mac
    file system.'
