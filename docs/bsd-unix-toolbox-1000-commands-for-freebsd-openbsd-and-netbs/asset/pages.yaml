    If you are archiving and compressing large amounts of data, the time it takes
    to compress your backups can be significant. You should be aware that, in general,
    bzip2 may take about five times longer than lzip and only give you twice the compression.
    However, with each compression, you can choose different compression levels, to
    balance the need for more compression with the time that takes.


    Use the tar command with bzip2 compression, use the -j option. You can add the
    bzip2 package with pkg_add -r bzip2 if it does not exist:


    ```

    $ tar cvf myfiles.tar.bz2 *.txt    Create archive, compress with bzip2

    ```


    You can uncompress (-j) a bzip2 compressed file as extract files (-x) using the
    tar command:


    ```

    $ tar xvf myfiles.tar.bz2    Extract files, uncompress bzip2 compression

    ```


    The lzip compression is a bit less integrated into tar. Before you can use lzip,
    you need to install the lzip package. To do lzip compression, you can pipe the
    output of tar to lzip as:


    ```

    $ pkg-add -r lzip

    $ tar -cf | lzip > myfiles.tar.lz    Create lzip compressed tar archive

    $ lzip -d < myfiles.tar.lz tar -xf    Extract lzip-compressed tar archive

    ```


