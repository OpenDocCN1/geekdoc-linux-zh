    \ directory of files.\n\nYou may want to create thumbnails for your duck collection\
    \ images. Or perhaps you want to reduce all your wedding photos so they can play\
    \ well on a digital photo frame. You might even want to add copyright information\
    \ to every image in a directory before you share them on the Web. All these things\
    \ can be done quite easily with the convert commands already described and some\
    \ simple shell scripts.\n\nHere's an example of a script you can run to resize\
    \ an entire directory of photos to 1024 × 768 pixels to play on a digital photo\
    \ frame:\n\n```\n$ cd $HOME/images\nmkdir small\n$ for pic in `ls *.tif`;\ndo\n\
    \  echo \"converting $pic\"\n  convert -resize 1024x768 $pic small/sm-$pic\ndone\n\
    ```\n\nBefore running this script, this procedure changes to the $HOME/images\
    \ directory (which happens to contain a set of high-resolution images). Then it\
    \ creates a subdirectory to hold the reduced images small. The script itself starts\
    \ with a for that lists each file ending in .tif (you might need to make .jpg\
    \ or other image suffix). Then, each file is resized to 1024 × 768 and copied\
    \ to the small directory, with sm- added to each file name.\n\n100"
