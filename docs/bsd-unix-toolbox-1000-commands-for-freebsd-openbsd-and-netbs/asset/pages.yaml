  md: '# Introduction


    Many of the commands described in this book will work on other UNIX and Linux
    systems as well. Because this book focuses on FreeBSD and other BSD-based distributions,
    descriptions will differ from other UNIX-like systems most prominently in the
    areas of packaging, installation, and GUI administration tools.


    # Conventions


    To help you get most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book. In particular, we have created
    styles for showing commands that allow us to fit as many command lines as possible
    in the book.


    With command examples, command output (shell prompts and messages) is shown in
    regular monospace font, computer input (the stuff you type) is shown in bold monospace
    font, and a short description (if) appears in italics. Here is an example:


    ```

    $ ls *jpg          List JPEG files in the current directory

    hat.jpg

    dog.jpg

    ...

    ```


    To save space, output is sometimes truncated (or skipped altogether). Three dots
    (...) are sometimes used to indicate that additional output was cut. If a command
    is particularly long, backslashes will appear at the end of each line to indicate
    that input is continuing to the next line. Here is an example:


    ```

    # oggencSong.wav -o NewSong.ogg \

    -a Bernstein -G Classical \\

    -d 06/15/1972 -t "Simple Song" \\

    -1 "Bernsteins Mass" \\

    -c info-*"From Kennedy Center"

    ```


    In the example just shown, you can type the backslashes to have all that information
    included in the single command. Or, you can put all the information on a single
    line (excluding the backslashes). Note that command prompts are shown in one of
    two ways:


    ```

    $          Indicates a regular user prompt

    #          Indicates the root prompt

    ```


    As noted, when a dollar sign prompt ($) appears, any user can run the command.
    With a pound sign prompt (#), you probably need to be the root user for the command
    to work.


    Notes and warnings appear as follows:


    NOTE Warnings and notes are offset and placed in italic like this.'
  merge: -1
