  md: '# Chapter 12: Accessing Network Resources


    Instead of supporting all, recursive downloads (as wget does), curl is designed
    for single-shot file transfers. It does, however, support more protocols (as needed)
    and some neat enhanced features. There are some interesting examples of file transfers
    with curl for downloading a three-disc set of ISO images for FreeBSD


    ```

    curl -o \

    ftp.freebsd.org/pub/FreeBSD/ISO-IMAGES-1386/6.3/6.3-RELEASE-1386-disc[1-3].iso

    curl -o0 \

    ftp.freebsd.org/pub/FreeBSD/ISO-IMAGES-1386/6.3/6.3-RELEASE-1386-disc[1,2,3].iso

    ```


    The commands just illustrate how to use square brackets to indicate a range [1-3]
    and curly brackets for [1, 2, 3] of characters or numbers to match files.


    The following set of curl illustrates how to download, update, and delete files
    from password-protected servers.


    ```

    curl -OP ftp://chris:Mypasswd@ftp.example.com/home/chris/fileA \

    -Q ''-DELE fileA''

    curl -T install.log ftp://chris:Mypasswd@ftp.example.com/tmp/ \

    -Q "RNFR install.log" -Q "RNFR install.log"

    curl ftp://freebsd.org/pub/FreeBSD/doc/en/books/ List books contents

    ```


    The first command adds a user and password (chris:Mypasswd), downloads a file
    (fileA) from the server, and then deletes the file on the server once the download
    is done (-Q ''-DELE fileA''). The next example uploads (-T) the file install.log
    to FTP server. It then renames the remote file to Xinstall. The last example uses
    curl to list the contents of the /pub/FreeBSD/doc/en/books/ directory at ftp.freebsd.org.


    # Transferring Files with FTP Commands


    Most BSD systems come with the standard FTP client (ftp command), that works the
    same way it does on UNIX and Windows systems. We recommend you use the full-featured
    user-friendly lftp (as root, type pkg_pkg -r lftp).


    With these FTP clients, you can open a session to the FTP server (as opposed to
    joining a file, as you do with wget and curl). Then you navigate the server as
    much as you would a local file system, and putting documents across the network
    connection. Here are examples of how to connect to an FTP server with lftp:


    ```

    $ lftp freebsd.org                   Anonymous connection

    lftp.freebsd.org->

    $ lftp francois@example.com               Authenticated connection

    lftp.example.com->

    $ lftp -u francois example.com             Authenticated connection

    Password: *****

    lftp.example.com->

    $ lftp -u francois, Mypwd example.com      Authentication with password

    lftp example.com:->

    ```'
