  md: '# Chapter 12: Accessing Network Resources


    If you find yourself needing to check e-mail on a remote server or other text-based
    environment, venerable text-based mail clients are available and still quite useful.
    In fact, some hard-core geeks still use text-based mail clients exclusively, touting
    their efficiency and scoffing at HTML-based messages.


    The mail clients described in this chapter expect your messages to be stored in
    standard BOX format on the local system. That means that you are already logged
    into the mail server or you have already downloaded the messages locally (for
    example, by using POP3 or similar).


    NOTE Text-based mail clients can be used to read mail already downloaded by other
    mail clients. For example, you could open your Evolution mail Inbox by typing
    mail -f $HOME/.evolution/mail/local/Inbox.


    # Managing e-mail with mail


    The oldest, and easiest to use when you just want a quick check for messages in
    the root user''s mailbox on a remote server, is the mail command (/bin/mail).
    If $MAIL variable is set, just login as root and type mail. Otherwise, use the
    -f option, as noted earlier, to identify the mail directory directly -f /var/mail/root.


    Although mail can be used interactively, it is often used for sending script-based
    e-mails Here are some examples:


    ```

