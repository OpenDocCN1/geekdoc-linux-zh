    # /usr/sbin/sshd -g 60           Change client time from 120 to 60 seconds

    # /usr/sbin/sshd -p 53943         Change listening to 53943 (for security)

    ```


    +   - File Transfer protocol (ftpd): The FTP service is one of the oldest, still
