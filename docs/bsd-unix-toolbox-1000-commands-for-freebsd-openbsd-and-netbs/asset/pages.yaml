    # Creating and Using Partitions


    Swap partitions are needed in BSD systems to handle overflows from your system''s
    RAM. If you don''t create a swap partition when you installed BSD, you can create
    it later. You can create your swap area either on a regular disk partition (identify
    a new partition as you create partitions as described earlier) or in a file formatted
    as a swap partition.


    If you don''t have a partition, you can create a swap area within a file as follows:


    ```

    # dd=/dev/zero of=/tmp/swapfile00 count=65536

    65536+0 records in

    65536+0 records out

    33554432 bytes transferred in 1.541522 secs (21767079 bytes/sec)

    ```'
