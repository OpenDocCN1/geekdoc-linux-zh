    to a file, as opposed to redrawing the same screen for interactive viewing. This
    can be used to create a log of processes, for example, when hunting down process
    that eats all your resources in the middle of the night. Here''s how to run top
    and log the output for 10 minutes:


    +   $ top -b -d 12000 > myprocesslog


    When top is running, you can update and sort the process list in different ways.
    To immediately update the process list, press Space C to sort by CPU and weighted
    CPU time. Press I to hide idle processes or displayed. Or, press m to toggle between
