  md: '# 13


    # # Doing Remote System Administration


    Most professional BSD administrators do not run a graphical interface on their
    Internet servers. As a result, when you need to access other computers for remote
    administration, you will almost surely need to work from the command line at some
    time. Luckily, there are many feature-rich BSD commands to help you do so.


    +   ### IN THIS CHAPTER

    - Configuring SSH

    - Using SSH for remote proxy

    - Using SSH to do tunneling

    - Using SSH to provide proxy service

    - Using SSH with private keys

    - Using screen remote multiplexing terminal

    - Accessing remote Windows desktops

    - Sharing remote desktops with VNC


    Tools associated with the Secure Shell (SSH) service not only allow remote login
    and file transfer, but they also offer encrypted communication to keep your remote
    administration secure. With tools such as Virtual Network Computing (VNC), you
    can have a server''s remote desktop appear on your local client desktop. These
    and other features for doing remote systems administration are described in this
    chapter.


    # # Doing Remote Login and Tunneling with SSH


    BSD systems, like their big brother UNIX, grew up on university networks. At a
    time when the only users of these networks were students and professors, and with
    networks mostly isolated from each other, there was little need for security.


    Applications and protocols that were designed in those times (the 1970s and 1980s)
    reflect lack of concern for encryption and authentication. SMTP is a perfect example
    of that. This is also true of the first generation of UNIX tools: `telnet`, `ftp`
    (file transfer protocol), `rsh` (remote shell), `rpc` (remote copy), `rex` (remote
    execution) and `login` (remote login). These tools use send credentials and traffic
    in clear text. For that reason, they are very dangerous to use on the public,
    untrusted Internet, and have become much deprecated and replaced with the Secure
    Shell (SSH) commands `ssh`, `scp`, `sftp` commands, and related services.


    ![](img/a8f0676d6e7f319a693ce1963202001e_252_0.png)'
