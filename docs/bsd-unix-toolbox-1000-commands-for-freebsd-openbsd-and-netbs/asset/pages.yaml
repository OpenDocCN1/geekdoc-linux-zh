  md: '# Chapter 8: Backups and Removable Media


    You can have multiple sources added to the image. Here are some examples:


    ```

    # mkisofs -o home.iso -R -J music/ docs/ \ Multiple directories/files

    chris.pdf /var/spool/mines\

    # mkisofs -o home.iso -J -R \\ Graft files on to the image

    graft-points Points=/var/pics/ \\

    /home/chris

    ```


    The first example above shows various files and directories being combined and
    placed on the root of the ISO image. The second example grafts the contents of
    the /var/pics directory into the /home/chris/Pictures directory. As a result,
    the CD image the /Pictures directory will contain all content from the /var/pics
    directory. We use the -graft option if backing up files from multiple directories
    causes duplicate names.


    Adding information to the header of the ISO image can help you identify the contents
    of image later. This is especially useful if the image is saved or distributed
    online, without a physical disk you can write on. Here are some examples:


    ```

    # mkisofs -o tmp/home.iso -R -J \ Add header info into ISO

    -p www.handsonhistory.com \

    -publisher "Swan Boy Folk Art Center" \

    -V WebBackup" \

    -A mkisofs \

    -volset "All web site material on November 2, 2008" \

    /home/chris

    ```


    In the example above, p indicates the identifier, which could include a phone
    number, mailing address or web site for contacting the preparer of the ISO image.
    The option -publisher, you can indicate a 128-character description of the preparer
    (possibly the company or organization name). The -V indicates the volume ID. Volume
    ID is important because some operating systems this volume ID used to mount the
    CD when it is inserted. For example, in the command line shown above, the CD would
    be mounted on /media/WebBackup in FreeBSD and other BSD systems. The -A option
    can be used to indicate the application using a set of images to create the ISO.
    The -volset option can contain a string of information about a set of images.


    When you have created your ISO image, and before you burn it to disc, you can
    check the image and make sure it contains the files. Here are ways how to check
    it:


    ```

    # isoinfo -d home.iso Display header information

    CD-ROM is in ISO 9660 format

    System id: FreeBSD

    Volume: WebBackup

    Volume set id: All Website material on November 2, 2008

    Publisher id: Swan Boy Folk Art Center

    Data preparer: www.handsonhistory.com

    ```'
