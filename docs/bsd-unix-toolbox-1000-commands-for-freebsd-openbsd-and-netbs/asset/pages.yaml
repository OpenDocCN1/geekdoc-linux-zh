    # Saving Private Keys to Use from a USB Flash Drive


    If you''d like to store your private key somewhere safer than your hard drive,
    you can use a USB drive (sometimes called thumbdrive or pen drive):


    ```

    $ mv -/.ssh/id_rsa /media/THUMDRIVE1/myprivatekey

    ```


    And then, when you want to use the key, insert the USB drive and type the following:


    ```

    $ ssh -i /media/THUMDRIVE1/myprivatekey chris@myserver

    ```


    Using keys with passphrase is more secure than simple passwords, but also more
    cumbersome. To make your life easier, you can use ssh-agent to store unlocked
    keys for the duration of your session. When you add an unlocked key to your running
    ssh-agent, you can run ssh using the key without being prompted for the passphrase
    each time.


    To see what ssh-agent command does, run the command with no option. A three-line
    bash script appears when you run it,:


    ```

    $ ssh-agent

    SSH_AUTH_SOCK=/tmp/ssh-SKEZ18329/agent.18329; export SSH_AUTH_SOCK;

    SSH_AGENT_PID=18330; export SSH_AGENT_PID;

    echo agent 18330

    ```


    The first two lines of the output shown need to be executed by your shell. Copy
    and paste those lines into your shell. You can add this extra step by starting
    ssh-agent and having the bash evaluate its output by typing the following:


    ```

    $ eval `ssh-agent''

    Agent pid 18408

    ```


    You can now unlock keys and add them to your running agent. Assuming you already
    run the ssh-keygen command to create a default key, let''s add that default key
    using the ssh-add command:


    ```

    $ ssh-add

    Enter passphrase for /home/chris/.ssh/id_rsa: ********

    Identity added: /home/chris/.ssh/id_rsa (/home/chris/.ssh/id_rsa)

    ```


    Next you could add the key to the USB thumbdrive:


    ```

    $ ssh-add /media/THUMDRIVE1/myprivatekey

    ```'
