  md: '# Chapter 3: Using the Shell


    If you launch gnome-terminal manually, you can add options. Here are some examples:


    ```

    # gnome-terminal -x alisamixer      Start terminal with alisamixer displayed

    # gnome-terminal --tab --tab --tab      Start a terminal with three open tabs

    # gnome-terminal --geometry 80x20      Start terminal 80 characters by 20 lines

    # gnome-terminal --zoom=2               Start terminal with larger font

    ```


    Besides gnome, you can use many other terminals. Here are some examples: xterm
    (basic terminal emulator that comes with X), aterm (terminal emulator delivered
    after system XP VT12 emulator), and console (terminal emulator delivered with
    the KDE desktop). The Enlightenment desktop project offers the ether terminal
    (which includes features such as message logs on the screen background). Each
    of the Terminal window commands just be obtained by installing the software package
    of the same name, except console, which is in the kdebase package.


    # Using Virtual Terminals


    When FreeBSD boots in multi-user mode, eight virtual consoles (represented by
    a console message window and virtual terminals tty0 through tty7) are created
    with text-based logins. If an X Windows system is running, X is probably running
    in virtual console 8. Virtual console 1 is where messages are displayed. If X
    isn''t running, you''re looking at virtual console 2.


    From X, you can switch to another console with Ctrl+Alt+F1, Ctrl+Alt+F2 and so
    on up to F8. For a virtual console, you can switch using Alt+F1, Alt+F2 and so
    on. Press Alt+F9 to return to the X GUI. Each console allows you to log in using
    different user accounts. Switching to look at another console doesn''t affect
    running processes in any of them. When you switch to virtual terminal through
    six, you see a login prompt similar to the following:


    FreeBSD/i386 (localhost) (tty1)

    login:


    Separate getty processes manage each virtual terminal. If you are in a Terminal
    window, do this to see what getty processes look like before you log in to any
    virtual terminals.


    ```

    # ps awk | grep -v grep | grep getty

    780 v1  Is+    0:00:01 /usr/libexecec/getty Pc tty1

    782 v2  Is+    0:00:01 /usr/libexecec/getty Pc tty2

    782 v3  Is+    0:00:01 /usr/libexecec/getty Pc tty3

