  md: '# Chapter 4: Working with Files


    Having the sticky bit for a directory keeps users from removing or renaming files
    from that directory they don''t own (/tmp is an example). Given the right permissions,
    however, users can change the contents of files they don''t own in a sticky directory.
    The final permission character is t instead of x on a sticky directory. A command
    with sticky bit on will cause the command to stay in memory, while not being used.
    This is an old UNIX feature that is not supported in modern BSD, UNIX, and Linux
    systems.


    The R option is a handy feature of the chmod command. With -R, you can recursively
    change permissions of all directories starting from a point in the file system.
    Here are some examples:


    ```

    # chmod -R 700 /tmp/test    Open permission only to owner below /tmp/test

    # chmod -R 000 /tmp/test    Close all permissions below /tmp/test

    # chmod -R a+r /tmp/test    Open permissions to all below /tmp/test

    ```


    Note that the r is inclusive of the directory you indicate. So the permissions
    above, for example, would change for the /tmp/test directory itself, and not just
    for the files and directories below that directory.


    # Setting the umask


    Permissions given to a file or directory are originally set at the time it is
    created. How those permissions are set is based on the user''s current umask value.
    Using the umask command, you can set the permissions to files and directories
    when you create them.


    ```

    $ umask 0066    Make directories drwx--x-- and files -rw----

    $ umask 0077    Make directories drwx------ and files -rw----

    $ umask 0022    Make directories drwxrxr-x and files -rw-r---

    $ umask 0777    Make directories --------- and files ---------

    ```


    # Changing Ownership


    When you create a file or directory, your user account is assigned to that file
    or directory. Your so is primary. As root user, you can change the ownership (user)
    and group assigned to a different user or group using the chown and chgrp commands.
    Here are some examples:


    ```

    # chown chris test/         Change owner to chris

    # chown chris:market test/       Change owner and group to market

    # chgrp market test/             Change group to market

    # chown -R chris                   Change all files below test/ to owner chris

    ```


    The recursive option to chown (-R) just is useful if you need to change the ownership
    of an entire directory. With chown, using recursively recursively changes permissions
    for the directory named, also with its contents. You might use chown recursively
    when a person leaves a company or stops using your web service. You can use chown
    -R to reassign the entire /home directory to a different user.'
