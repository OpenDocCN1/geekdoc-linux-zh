  md: '# Chapter 10: Managing the System


    > WARNING! If you mess up your boot loader, your computer could become temporarily
    unbootable. I recommend you have a rescue CD available to correct the problem
    if your system becomes unbootable.


    ```

    # boot0cfg -b ad0                Install /boot/boot0, no slice change

    # boot0cfg -b /root/boot0 ad0    Install specific boot0 manager file

    # boot0cfg -t 364 ad0               Change timeout to 20 seconds (364 ticks)

    ```


    For the cases where you have a single 40GB hard drive with 20GB assigned to FreeBSD
    on a single slice, there may be cases where you have multiple bootable operating
    systems on the same or multiple hard disks.


    For example, here are a few tips for installing multiple operating systems on
    the computer:


    +   - Windows — If possible, always try to install Windows first. At least some
    versions of Windows are a bit antisocial, thinking they own your machine, and
    they will probably overwrite your master boot record (without making your BSD
    system bootable). With installed systems, that can be added to your BSD boot loader
    by any OS you can.


    +   - Linux — Most Linux systems will happily coexist with FreeBSD or other BSD
    systems. When you install Linux, just tell the installer to put the Linux boot
    loader (probably GRUB) on the partition containing the /boot directory (often
    the / partition). You can then tell the installer not to overwrite the master
    boot record (which I presume contains your BSD0 boot loader).


    To illustrate a computer that dual boots with FreeBSD and Debian/Linux, we installed
    FreeBSD first (slice 1). Then we installed Debian, putting the operating system
    on slice 2 and making a separate slice for swap for Linux. We installed the GRUB
    boot loader during the Debian installation on slice 2, which Linuxux refers to
    as hd0, 1 (for disk 1, partition 2).


    > NOTE Before things get more confused here, we need to clear up some terminology.
    In BSD, you can divide the disk into parts referred to as slices. In a BSD slice,
    you can further divide the disk into what are called partitions. In Linux, what
    BSD refers to as slices are partitions. You can have more than the four primary
    partitions in Linux because it allows what are called extended partitions. For
    clarity, and this is a BSD book, we are trying to use the BSD slice, partition
    terminology.


    Anyway, with FreeBSD and Debian installed, here''s what output from the boot loader
    with two bootable operating systems looks like:


    ```

    # boot0cfg -v ad0                Display information about boot0 loader (multiple
    OS)

    # flag           start chs    type      end chs    offset size

    ```'
