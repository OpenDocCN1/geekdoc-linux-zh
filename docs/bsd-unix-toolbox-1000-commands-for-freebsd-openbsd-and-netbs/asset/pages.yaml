  md: '# Chapter 10: Managing the System


    When a BSD system is selected to boot from the boot loader, the boot loader goes
    to the partition you asked to boot and either a secondary boot loader or loads
    the kernel. In the final stage of the bootstrapping process in FreeBSD, the kernel
    is booted, the rc scripts start up system services, and you are presented with
    a prompt or display manager to login.


    The following sections describe commands for modifying the boot loader and start-up
    scripts associated with your BSD system.


    # Using the boot0 Boot Loader


    The /boot/boot0 contains the default boot image used by FreeBSD. If you want to
    replace your boot image with one that you compile, you can also do that with the
    boot0cfg command can also be used to view or change settings relative to the current
    boot loader.


    NOTE When referring to disks in the following examples, IDE disks begin with ad
    and SCSI disks begin with da. The first IDE disk is ad0, the second is ad1, and
    so on. Likewise with SCSI disks named da0, da1, and so on. The first slice on
    IDE disk 1 is ad01.


    Here are some examples using the boot0cfg command to check and change your boot
    image:


    ```

    # boot0cfg -v ad0 Display information about boot0 loader on IDE disk 1

    # flag start chs type end chs offset size

    1 0x80 0: 1 0xa5 1023:254:63 63 40949626

    ```


    ```

    versions1.0 drive=0x80 mask=0xf ticks=18

    options-packet,update,nosetdrv

    default_selection=1 (Slice 1)

    ```


    The output from boot0cfg -v shows you information how boot0 is set up on the selected
    disk (in this case, the first disk, ad0). In this case, one slice (1) on the first
    disk (0x80) is bootable. The slice starts at cylinder 0, head 0, and sector 0.
    It ends at cylinder 1023, head 254, and sector 63. The type of slice is 0xa5 used
    with FreeBSD, NetBSD, and 386BSD.


    After the version number (1.0), the output shows that the BIOS will tell to boot
    the first hard disk (ad0), that four slices are enabled (0xf), and that the boot
    prompt timeout is set to 18 ticks (about 10 seconds). The three options you say
    use the disk packet (BIOS INT 0x13 extension) interface for disk I/O (packet),
    allow the master boot record to be updated by the boot manager (update), and don''t
    force the drive containing the disk referenced by -d option to be used.


    Now that you have the settings, here is how you can make changes to the boot0
    loader.'
