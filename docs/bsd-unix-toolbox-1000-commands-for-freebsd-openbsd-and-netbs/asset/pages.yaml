  md: '# Chapter 7: Administering File Systems


    If you’re mounting something that is listed in your fstab file already, you only
    need to specify mount point or device. For example, with the following fstab entry:


    ```

    /dev/ads04       /mnt/music      ext2fs  rw  2 2

    ```


    You can mount the file system using some of the options:


    ```

    # mount -v /dev/ads04  Mount file system with device name only

    /dev/ads04 /mnt/music  (ext2fs, local, fsid 5e00000000000000)

    # mount -v /mnt/music  File system with mount point only

    /dev/ads04 /mnt/music  (ext2fs, local, fsid 5e00000000000000)

    ```


    You can specify mount options by adding -o and a comma-separated list of options.
    The same options can also be added to field 4 of the /etc/fstab file. By default,
    partitions are mounted with read/write. You can explicitly indicate to mount a
    file system as read-only (ro) or read-write (rw):


    ```

    # mount -v ext2fs -o rw /dev/ads04 /mnt/music  Mount read/write

    /dev/ads04 /mnt/music  (ext2fs, local, fsid 5e00000000000000)

    # mount -v ext2fs -o ro /dev/ads04 /mnt/music  Mount read-only

    /dev/ads04 /mnt/music  (ext2fs, local, fsid 5e00000000000000)

    ```


    A few useful mount options you can use:


    +   - noatime: Does not update the access time on files. Good for file systems
    with a lot of I/O, such as swap pools and logs.


    +   - noexec: Prevents execution of binaries located on this file system. Can
    be used to increase security, for /tmp in environments with untrusted users.


    Just as you can swap to a file, you can create a file system in a file and then
    mount it so you can view its contents as you would any file system. Creating and
    mounting such a file is described in the “Creating a Memory Disk File System”
    section earlier in this chapter. A common situation where you might want to mount
    a file in loopback is after downloading a ISO CD or LiveCD. By mounting that CD,
    you can view your contents or copy files from that image to your hard disk.


    ```

    # mdconfig -a t vnode -f /usr/images/FreeSBIE-2.0.1-RELEASE.iso -o u 1

    # mkdir /mnt/freebies

    # mount -t /dev/md1 /mnt/freebies

    # ln -s /mnt/freebies/ boot

    ```


