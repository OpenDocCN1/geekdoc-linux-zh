  md: '# Chapter 13: Doing Remote System Administration


    # Using a Remote Windows Desktop


    Many system administrators who become comfortable with a BSD desktop prefer to
    administration of their Windows systems from BSD whenever possible. BSD systems
    provide tools such as desktop and tclient, which enable you to connect to a Windows
    system running Windows Terminal Services.


    NOTE Because there are no BSD or other UNIX implementations of Microsoft''s proprietary
    Remote Desktop Protocol (RDP), there are no methods for doing RDP-enabled Windows
    Desktops in FreeBSD. If you are interested in encrypted remote desktop solutions,
    refer to projects that use SSH to encrypt remote desktops, as as NoMachine (www.nomachine.com).


    To be able to connect your Windows system desktop from FreeBSD, you will have
    to enable Remote Desktop from your Windows XP (and others) right-click My Computer
    and select Properties. Then choose the Remote tab from the System Properties window
    and select the Allow users to connect remotely to this computer check box. Select
    users you want to let connect to the Windows box and click OK.


    Now, from FreeBSD, you can either the rdesktop or tclient (a graphical wrapper
    around rdesktop) to connect to the Windows system using Remote Desktop Protocol
    (RDP). If those applications are not already installed, type the following from
    your FreeBSD system:


    ```

    # pkg-add -r rdesktop

    # pkg-add -r tclient

    ```


    # Connecting to a Windows Desktop with tclient


    If you are using Windows'' Remote Desktop Connection (formerly known as Terminal
    Services Client) to connect from one Windows box to another, you will probably
    find the tclient tool a good way to connect to a Windows desktop from a BSD system.
    Running tclient opens a Terminal Server Client window that mimics the Windows
    remote desktop client''s interface.


    When the tclient package is installed, launch tclient by selecting Applications
    Internet Terminal Client from the GNOME desktop or by typing the following from
    the shell:


    ```

    $ tclient &

    ```


    Figure 13-2 shows the Terminal Server Client window.


    Probably all you need to enter on this is the name or IP address of the Windows
    system. You will be prompted for user name and password, depending on how the
    Windows system is configured. Select different tabs to refine your connection
    to the remote Windows desktop.


