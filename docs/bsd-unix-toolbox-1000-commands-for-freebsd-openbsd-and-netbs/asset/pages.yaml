    | Date | Owner | Queue | Job# |

    | Tue Dec 29 16:00:00 CST 2008 | root | c | 4 |

    | Sat Aug 2 19:24:00 CST 2008 | root | c | 5 |


    Regular users can view queued jobs. The root user can see everyone''s queued jobs.
    If you want to delete an job from the queue, use the atm command:


    > Delete at job number 5


    The at and batch commands are for queuing a command as a one-shot deal. These
    commands are scripted into cron jobs, which are scheduled in cronontab files.
    There is one system cronontab file (/etc/crontab). Also, each user can create
    a personal crontab at times that the user chooses. To create a personal crontab,
