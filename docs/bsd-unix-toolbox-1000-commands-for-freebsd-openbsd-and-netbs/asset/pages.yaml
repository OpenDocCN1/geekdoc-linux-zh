    # Managing Passwords


    Adding or changing a password is usually done quite simply with the passwd command.
    Besides passwd there are commands such as chfn and vipw (described earlier) for
    working with user passwords.


    Regular users can change only their own passwords, whereas the root user can change
    the password for any user. For example:


    ```

    $ passwd  Change a regular user''s own password

    Changing local password for chris

    Old Password: ********

    New Password: ********

    Retype Password: ********

    # passwd joseph  Root can change any user''s password

    Changing local password for joseph

    New Password: ********

    Retype Password: ********

    ```


    In the first example, a regular user (chris) changes his own password. While logged
    in, the user must type the password before entering a new one. Unlike other UNIX-like
    systems, passwd prevents users from using a password that is too short, based
    on a dictionary word, doesn''t have different characters, or is otherwise easy
    to guess. So it is important that users choose good passwords on their own.


    The root user, in the second example, can change any password without the old
    password. Likewise, the root user can assign a short or easy-to-guess password,
    so diligence should be exercised in well as choosing a good password.


    Passwords should be at least eight characters, a combination of letters and other
    characters (numbers, punctuation, and so on), and not include real words. As noted
    earlier in this chapter, make passwords easy to remember but hard to guess.


    # Adding Groups


    Each user is assigned to one or more groups. You can create groups at any time
    and add users to those groups. The permissions that each group has to use files
    and directories in BSD system depend on how the group permissions are set on each
    item. Assigning users to a group enables you to attach ownership to files, directories,
    and applications that those users can work together on a project or have common
    access to resources.


