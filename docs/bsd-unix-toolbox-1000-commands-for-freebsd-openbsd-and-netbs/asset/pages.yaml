    4 packets transmitted, 4 received, %0 packet loss

    round-trip min/avg/max/stddev = 0.313/0.621/1.432/0.469 ms

    ```


    > NOTE Some hosts are configured to ignore ping requests. So getting no reply
    does not indicate that the host or gateway is down.


    By default, ping continues until you press Ctrl+C. Other ping options include
    the following:


    ```

    $ ping -s 10.0.0.1 Add an audible ping as ping progresses

    $ ping -c 4 10.0.0.1 4 times and exit (default in Windows)

    $ ping -q 5 10.0.0.1 Show summary of pings (works best with -c)

    # ping -f 10.0.0.1 Send a flood of pings (must be root)

    $ ping -i 3 10.0.0.1 Send packets in 3 intervals

    $ ping -s 1500 10.0.0.1 Set packet size to 1500 bytes (must be root)

    PING 10.0.0.1 1500 data bytes

    ```


    Use the flood option with caution. By default, ping sends small packets (56 bytes).
    Large packets (such as the 1500-byte setting shown above) are likely to make faulty
    NICs or connections down. Only the root user can send a flood of pings or pings
    by byte sized over the default 56 bytes.


    # Checking Address Resolution Protocol (ARP)


    If you''re unable to ping your gateway, you may have an issue at the Ethernet
    MAC layer. The Address Resolution Protocol (ARP) can be used to find information
    at the MAC layer. To view and configure ARP entries, use the arp command. This
    example shows arp listing computers in the ARP cache by hostname:


    ```

    # arp -a List all current ARP entries

    ritchie (10.0.0.1) at 00:10:5a:ab:f6:a7 on fxp0 [ethernet]

    estein (10.0.0.50) at 00:0b:6a:ec:98 on fxp0 [ethernet]

    thpson (10.0.0.204) at 00:d0:b7:79:a5:35 on fxp0 permanent [ethernet]

    ```'
