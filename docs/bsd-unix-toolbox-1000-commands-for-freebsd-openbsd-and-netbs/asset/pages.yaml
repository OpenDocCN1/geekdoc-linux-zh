    The output of iostat reveals processes that occur when a large amount of data
    is copied from one partition to another on the hard disk (ad0). The columns show
    reads per second (r/s), writes per second (w/s), kilobytes per second (kr/s),
    kilobytes per second (kw), and length of the transactions queue (wait). They also
    show the duration of transactions, on average, in milliseconds (svc_t) and percentage
    of the age of the device that has one or more transactions outstanding (%b).


