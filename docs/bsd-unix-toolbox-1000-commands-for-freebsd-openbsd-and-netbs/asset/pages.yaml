  md: '# Chapter 7: Administering File Systems


    If you have network mounts (such as Samba or NFS), these will show up, too, in
    your df output. To limit df output to local file systems, use the -l (as in local)
    option:


    ```

    $ df -hl          Display disk space only for local file systems

    ```


    To display output for a particular file system, use the -T option:


    ```

    $ df -ht ufs    Only display file system types

    Filesystem      Size    Avail Capacity Mounted on

    /dev/ad0s0      496M    39M    417M 9%         /

    ```


    To check disk space for particular directories or files in a file system, use
    the du command. The following command was named by francois:


    ```

    $ du -h /home/    Show disk space usage for /home directory

    du: /home/chris: Permission denied

    4.0K             /home/francois/Mail

    52K             /home/francois

    64K             /home/

    ```


    The output shows that access to another home directory''s disk (in this case /home/chris)
    was denied for security reasons. The next examples show how to avoid permission
    issues and get totals that are correct by using the root user account. This is
    clearly visible when we use -s to summarize


    ```

    $ du -sh /home   Regular user is denied space totals to others'' homes

    du: /home/chris: Permission denied

