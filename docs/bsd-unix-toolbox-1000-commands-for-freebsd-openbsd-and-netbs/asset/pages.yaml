    \ time 66.92.68.11 offset 0.009204 sec\n```\n\nIf you try ntpdate while ntpd is\
    \ running, you will get the following error:\n\n```\n# ntpdate pool.ntp.org\n\
    15 Aug 00:37:00 ntpdate[9695]: the NTP socket is in use, exiting\n```\n\nNote\
    \ that the ntpdate command has been marked as deprecated and will disappear in\
    \ the future. It has been replaced by the following options of ntpd:\n\n```\n\
    # ntpd -qq\n```\n\n-the q option allows ntpd to exit after setting the clock (as\
