  md: '# 3


    # # Using the Shell


    The use of a command interpreter (usually just called a shell) dates back to the
    early days of the first UNIX systems. Besides their obvious use of running commands,
    shells have many built-in features such as environment variables, aliases, and
    a variety of functions for programming.


    There are several shells to choose from on BSD systems. By default, the root user
    is assigned to use the C shell (`csh`) and a regular user is assigned to the Bourne
    shell (`sh`). Most users use the Bourne Again Shell (`bash`). There are other
    shells available as well (such as `zsh`, `ksh`, and `tcsh`).


    This chapter offers information that will help you use BSD shells, in general,
    and the `bash` shell, in particular.


    IN THIS CHAPTER

    Accessing the shell

    Using the shell

    Acquiring super-user powers

    Using environmental variables

    Creating simple shell scripts


    # ## Terminal Windows and Shell Access


    The most common way to access a shell from a BSD graphical interface is using
    a Terminal window. From a graphical interface, you can often access virtual terminals
    to get to a shell. With no graphical interface, and a text-based login, you are
    typically dropped directly to a shell after login.


    # ## Using Terminal Windows


    To open a Terminal window from GNOME, select Accessories Terminal. This opens
    a gnome-terminal window, displaying a `bash` shell prompt. From an XFce desktop,
    select the Terminal icon from the Xfce panel. From KDE, select the Terminal Program
    to start a konsole terminal window. Figure 3-1 shows an example of a gnome-terminal
    window.'
