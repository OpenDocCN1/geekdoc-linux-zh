    Password: *****

    # echo $MAIL

    /var/mail/root

    ```


    In most cases, use su -, unless you have a very specific reason not to. If no
    user is specified, su defaults to the root user. However, su can also be used
    to become other users:


    ```

    $ su -c whoami

    Password: *****

    root

    # su -c ''less /var/log/messages''

    ```


    Although in the second example you are logged in as a regular user, when you run
    whoami with -c, it shows that you are the root user. In the directly example,
    the quotes are required around the less command line to identify'
