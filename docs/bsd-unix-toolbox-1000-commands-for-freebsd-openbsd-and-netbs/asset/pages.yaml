  md: '# Chapter 6: Playing with Multimedia


    # # Converting Images


    The convert command is the Swiss Army knife of file converters. Here are some
    ways to manipulate images using the convert command. The following examples convert
    image files from one to another:


    ```

    $ convert tree.jpg tree.png      Convert a JPEG to a PNG file

    $ convert icon.gif icon.gif        Convert a GIF to a BMP file

    $ convert photo.tiff photo.pcx   Convert a TIFF to a PC file

    ```


    Image types that convert supports JPG, BMP, PCX, GIF, PNG, TIFF, XPM, and XWD.
    Here are examples of convert being used to resize images:


    ```

    $ convert -resize 1024x768 hat.jpg hat-sm.jpg

    $ convert -sample 50%x50% dog.jpg dog-half.jpg

    ```


    The first example creates an image (hat-sm.jpg) that is 1024 × 768 pixels. The
    second example reduced the image dog-jpg in (50%x50%) and saves it as dog-half.jpg.


    You can rotate images from 0 to 360 degrees. Here are examples:


    ```

    $ convert -rotate 270 sky.jpg sky-final.jpg    Rotate image 270 degrees

    $ convert -rotate 90 house.jpg house-final.jpg  Rotate image 90 degrees

    ```


    You can add text to an image using the -draw option:


    ```

    $ convert -fill black -pointsize 60 -font helvetica \

    -draw ''text 10,80 "Copyright Negnus Inc."'''' \

    p10.jpg p10-cp.jpg

    ```


    The previous example adds copyright information to an image, using 60-point Helvetica
    to write text to the image. The text is placed 10 points in and 80 points down
    from the upper left. The new image name is p10-c.jpg, to indicate that the new
    image has copyright information.


    Here are some interesting ways to create thumbnails with the convert command:


    ```

    $ convert -thumbnail 120x120 a.jpg a-a.jpg

    $ convert -thumbnail 120x120 -frame 40x40 a.jpg a-b.jpg

    $ convert -thumbnail 120x120 -frame 40x40 -rotate 10 \

    -background red a.jpg a-c.jpg

    ```


    All three examples create a 120 × 120 thumbnail. The second adds a border around
    the thumbnail, so it looks like a picture frame. The last example sets the -rotate
    angle to 10, so that the image looks slightly askew, and fills the background
    in red. Figure 6-1 shows the results of these three examples.


    98'
