  md: '# Chapter 14: Locking Down Security


    The first three lines allow whatever you want to do from the local system (lo0)
    and 127.0.0.1). The check-state option allows packets to be checked against the
    dynamic ruleset. The next two lines allow packets from established connections
    and keep-state state. The icmp line allows other computers to ping your computer.


    The rest of the lines have to do with packets that request services from your
    system. This machine allows connections to requests for SSH (port 22), SMTP mail
    (port 25), DNS service (port 53), web service (port 80), Post Office Protocol
    v3 (port 110), and IMAP mail v2 (143). The last line logs to syslog from any other
    ports that are denied.


    To get the firewall settings in rc.conf working and the firewall rules in ipfw.rules,
    you need to start the ipfw service. Here''s how to do:


    ```

    # /etc/rc.conf Starts the ipfw firewall service

    Flushed rules.

    Starting divert daemons:Flushed rules.

    00100 allow ip from any to any via lo0

    00200 allow ip from any to 127.0.0.0/8

    00300 allow ip from any to 127.0.0.0/8 to any

    00400 check-state

    00500 allow tcp from any to any established

    00600 allow ip from any to any out keep-state

    00700 allow icmp from any to any

    00800 allow tcp from any to any dst-port 22 setup keep-state

    00900 allow tcp from any to any dst-port 25 setup keep-state

    01000 allow tcp from any to any dst-port 53 setup keep-state

    01100 allow udp from any to any dst-port 53 keep-state

    01200 allow udp from any to any dst-port 80 keep-state

    01300 allow tcp from any to any dst-port 110 setup keep-state

    01400 allow udp from any to any dst-port 123 setup keep-state

    01500 allow udp from any to any dst-port 123 setup keep-state

    01600 allow tcp from any to any dst-port 143 setup keep-state

    01700 deny log ip from any to any

    Firewall rules loaded.

    Firewall logging enabled

    net.ip.fw.enable: 0 -> 1

    ```


    Once you have a firewall, which you should do at this point, you can use a variety
    of IPFILTER commands to work with the firewall. Keep in mind that changes you
    make to the firewall live will be lost at the next reboot if you don''t save those
    changes. In general, it''s best to make rules using the ipfw.rules file and simply
    restart the service to test them out.


    Here are some commands for checking out the state of your firewall:


    ```

    # ipfw list List the current set of firewall rules

    00100 allow ip from any to any via lo0

    00200 allow ip from any to 127.0.0.0/8

    ...

    ```'
