  md: '# Chapter 12: Accessing Network Resources


    # Mounting Samba Shares


    You can mount remote Samba shares on your local file system much as you would
    a local system or remote NFS file system. To mount the share:


    ```

    # -t smbfs //francois@192.168.1.1/myshare /mnt/mymount/

    ```


    > NOTE The Samba file system (smbfs), while still available on FreeBSD, is deprecated
    on Linux systems. If you are mounting a Samba share from a BSD system to a Linux
    system, indicate CIFS (-t cifs) as the file type when you mount that remote Samba
    share.


    You can see the current connections and file locks on a server using the smstatus
    command. This will tell you if someone has mounted your shared directories or
    is currently using an smbclient connection to your server:


    ```

    $ smstatus

    samba version 3.0.23c

    PID Username Group Machine

    5466 francois francois 10.0.0.55 (10.0.0.55)

    Service pid machine Connected at

    myshare 5644 10.0.0.55 Tue Jun 3 15:08:29 2008

    ```


    No locked files


    To see a more brief output, use the -b option:


    ```

    $ smstatus -b

    ```


    # Looking Up Samba Hosts


    NetBIOS are used to identify hosts in Samba. You can determine the IP address
    of a computer using the nmblookup command to broadcast for a particular NetBIOS
    name on the local subnet as follows:


    ```

    $ nmblookup thompson

    querying thompson on 192.168.1.255

    192.168.1.1 server1<0>

    ```


    To find the IP address for a server on a specific subnet, use the -U option:


    ```

    $ nmblookup -U 192.168.1.0 server1

    querying server1 on 192.168.1.255

    192.168.1.1 server1<0>

    ```


