    # Transforming Images


    With dictionaries full of digital images, the ability to manipulate images from
    the command line can be a huge saver. The ImageMagick package (available with
    FreeBSD) comes with some very useful tools for transforming digital images into
    formats you can work with. This section shows some commands for manipulating digital
    images, and provides examples of simple scripts for making these changes in batches.


    # Getting Information about Images


    Get information about an image, use the identify command, as follows:


    ```

    $ identify p209042.jpg

    p209042.jpg JPEG 2048x1536+0+0 DirectClass 8-bit 402.037kb

    $ identify -verbose p209042.jpg | less

    Image p209042.jpg

    Format: JPG (Joint Photographic Experts Group JFIF format)

    Standard deviation: 61.1665 (0.23986)

    Colors: 205713

    Rendering intent: Undefined

    Resolution: 72x72

    Units: PixelsPerInch

    Filesize: 402.037kb

    Interlace: None

    Background color: white

    Border color: rgb(223,223,223)

    Matte color: grey74

    Transparent color: black

    Page geometry: 2048x1536+0+0

    Compression: JPEG

    Quality: 44

    ```


    The first command in the preceding example displays basic information about the
    image (its file name, format, geometry, channel depth, and file size). The second
    command shows every bit of information it can extract from the image. In addition
    to the information you see in it, the verbose output also shows creation times,
    the type of camera used, aperture value, and ISO speed rating.'
