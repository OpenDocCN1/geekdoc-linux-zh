    # Summary


    Creating and managing file systems is a critical part of BSD system administration.
    Most BSD systems use the UNIX File System (UFS) as the primary file system type
    for storing data. However, most BSD systems can mount and use data from a variety
    of file system types, including ext2, ext3, nfs, mdos, reiserfs, and unionfs.
    It can also work with network file systems, such as NFS, nwfs, and smbfs.


    You can partition hard disks with commands such as `fdisk` and `bsdlabel`. Tools
    for working with file systems include those that create file systems (newfs),
    mount/unmount file systems (mount and umount), and check for problems (fsck).
    To see how much space has been used in file systems, use the `df` and `du` commands.'
