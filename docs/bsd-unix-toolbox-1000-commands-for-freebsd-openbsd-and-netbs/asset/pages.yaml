- img_proc: true
  md: '# Chapter 13: Doing Remote System Administration


    For example, myserver is a print server with the CUPS printing service''s web-based
    user interface enabled (running on port 631). That GUI is only accessible from
    the local machine. On my client PC, I tunnel to that using ssh with the following
    options:


    ```

    $ ssh -L 1234:localhost:631 myserver

    ```


    This example forwards port 1234 on my client PC to localhost port 631 on the server.
    I can now browse to http://localhost:1234 on my client PC. This will be redirected
    to cupd listening on port 631 on the server. Note that you need root privilege
    to forward ports with numbers less than 1024.


    # Tunnelling to an Internet Service


    Another example of using SSH tunneling is when your local machine is blocked from
    connecting to the Internet, but you can get to another machine (myserver) that
    has an Internet connection. The following example enables you to visit the Google.com
    web site (HTTP, TCP port 80) across an SSH connection to a computer myserver that
    has a connection to:


    ```

    $ ssh -L 12345:google.com:80 myserver

    ```


    With this, any connection to the local port 12345 is directed across an SSH tunnel
    to myserver, which in turn opens a connection to Google.com port 80. You can now
    browse to http://localhost:12345 and use myserver as a relay to the Google.com
    web site. Since you only intend to use ssh to forward a port, and not to obtain
    a shell on the server, you can use the -N option to prevent the execution of remote
    commands:


    ```

    $ ssh -L 12345:google.com:80 -N myserver

    ```


    # Using SSH as a SOCKS Proxy


    The previous example demonstrates that you can forward a port from the client
    to a machine other than the server. In the real world, the best way to get your
    browser traffic out of your local network via an encrypted tunnel is using SSH''s
    built-in SOCKS proxy feature. For:


    ```

    $ ssh -D 12345 myserver

    ```


    The dynamic (-D) option of ssh enables you to log in to myserver as long as the
    connection is open, all requests directed to port 12345 are then forwarded to
    myserver. Next, set your browser of choice to use localhost port 12345 as a SOCKS
    v4 proxy and you''re good to go.


    For example, to get to the Connection Settings window in your Firefox browser
    select Edit ⚙️ Preferences. Then choose General ⚙️ Connection Settings (Firefox
    1.5) or


