  md: 'In this example, the -xdev option prevents any mounted file systems, besides
    the root file system, from being searched. This is a good way to keep the find
    command from searching file systems such as the /proc file system (if it is mounted)
    and from remotely mounted file systems, as well as other locally mounted file
    systems.


    # Using Other Commands to Find Files


    Other commands for finding files include the whereis and which commands. Here
    are some examples of these commands:


    ```

    $ whereis man

    man: /usr/bin/man /usr/share/man/man1.gz

    ```


    The whereis command is useful because it not only finds commands, also finds pages
    and configuration files associated with a command. From the example of whereis
    for the word man, you can see the executable, its configuration file, and the
    location of man pages for the man command. The which command is useful when you''re
    looking for the actual location of an executable in your PATH, in this example:


    ```

    $ pkg_info -W ''which mkfs.ext2''

    /usr/local/sbin/mkfs.ext2 was installed by package e2fprogs-1.40.2_1

    ```


    # Finding Out More About Files


    Now that you know how to find files, you can get more information about those
    files. Using less-common options to the ls command lets you list about a file
    that you won''t see when you run ls without options. Commands such as file help
    you identify a file''s type. With md5sum and shalsum, you can verify the validity
    of a file.


    # Listing Files


    Although you are probably familiar with the ls command, you may not be familiar
    with many of the useful options for ls that help you find out a lot about the
    files on your system. Here are some examples of using ls to display lists (-1)
    of files and directories:


    ```

    $ ls -l          Files and directories in current directory

    $ ls -la         Includes files/directories beginning with dot (.)

    $ ls -lt         Orders files by time recently changed

    $ ls -S          Orders by size (largest first)

    $ ls -li         Lists the inode associated with each file

    $ ls -ln         List numeric user/group IDs, instead of names

    $ ls -lh         List file sizes in human-readable format (K, M, etc.)

    $ ls -R          List files recursively, from current and subdirectories

    ```'
