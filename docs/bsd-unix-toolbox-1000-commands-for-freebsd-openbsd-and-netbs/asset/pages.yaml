  md: '# Chapter 2: Installing FreeBSD and Adding Software


    # # Installing Software Packages (binary)


    You can install precompiled, binary packages that are ready to run using either
    a menu interface (sysinstall) or a command-line interface (pkg_add). Both sysinstall
    and pkg_add try to get and install the packages you request, along with any dependent
    packages you selected packages to run.


    After you have installed FreeBSD, you can run the sysinstall utility to add more
    software packages. As root user, type `/usr/sbin/sysinstall` to display the sysinstall
    Main Menu. Then select Configuration, and choose the menu you want to install
    from (CD/DVD, FTP, HTTP, and so on). You will have to select the location and
    network interface to reach your chosen online software as well. Figure 2-1 shows
    an example of the Package Selection screen of the sysinstall utility.


    ![](img/a8f0676d6e7f319a693ce1963202001e_48_0.png)


    **Figure 2-1:** Install software packages using the sysinstall utility.


    Use keystcribes described during installation to move among the categories and
    packages to select what you want to install. If any of the packages you select
    depend other packages that are not already installed, those dependent packages
    will be marked with a D and automatically installed with your selections. After
    you have made your selections, tab to the OK button, then select Install to begin
    installing the packages.


    If you prefer the command line to a menu interface, you can use the pkg add command
    to add packages to your BSD system. The packages you request can be in a local
    directory or in a BSD repository. Here are examples:


