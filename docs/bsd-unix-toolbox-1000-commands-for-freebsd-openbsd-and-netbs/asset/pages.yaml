  md: '# Chapter 13: Doing Remote System Administration


    If you are using the firewall built into your system, make sure you open the port(s)
    for VNC. Each display runs on its own port. Display number N is accessed on TCP
    port 5900+N. For example, display 1 is accessible on port 5901. Refer to Chapter
    14 for more details on firewalls.


    The vnserver command will start an Xnc process to listen on the first available
    display (probably :1). It will also create a basic set of X applications to start
    when someone connects to the server (in $HOME/.vnc/xstartup file). You can add
    or change those applications as you like, including the window manager twm (which
    is the default). In that directory are log files and the VNC password file.


    A VNC client, with access to your computer and,, connect to your VNC service as
    described in the next section. If you are setting up the VNC service temporarily,
    and the client is connecting to your VNC service, you can kill the VNC server
    as follows:


    ```

    $ vnserver -kill :1

    Killing Xnc process ID 49901

    ```


    # Starting Up the VNC Client


    With the VNC server running, you can connect to a desktop on that server from
    any of the clients systems mentioned earlier (BSD, Windows, Linux, Mac OS X, UNIX,
    and so on). For example, assuming your VNC server is on a system myserver, you
    could type the following command to start remote desktop from another BSD system:


    ```

    $ vncviewer myserver:1      Connect to VNC service on myserver display 1

    ```


    You can also use tclient to connect; for this example, you would specify myserver:1
    as the computer and as the protocol. By default, once you connect via VNC, all
    you get is a basic window manager (twm) and a terminal. To get the full desktop
    next time the user logs in, you should edit your VNC $HOME/.vnc/xstartup file
    on the VNC server. For example, log as the user who started the server and type
    the following:


    ```

    $ vi $HOME/.vnc/xstartup

    ```


    When editing that, change the lines to include the window manager you want (replace
    twm) and applications you want (replace or add applications starting with the
    xterm line). Here is an example of the contents of that file:


    ```

    #!/bin/sh

    -r $HOME/.Resources && xrdb $HOME/.Resources

    xsetroot -solid grey

    vncconfig -iconic &

    xterm -geometry 80x24+10+10 -ls -title "$VNCDESKTOP Desktop" &

    twm & &

    ```


