  md: '# Chapter 12: Accessing Network Resources


    # Copying Remote Files with scp


    Use scp to transfer files, the SSH service (usually the sshd daemon) must be running
    on the remote system. Here are some examples of useful scp commands:


    ```

    $ scp myfile francois@server1:/tmp/    Copy myfile to server

    Password: ******

    $ scp server1:/tmp/myfile .    Copy remote myfile to local working dir

    Password: ******

    ```


    Use the -p option to preserve permissions and timestamps on the copied files:


    ```

    $ scp -p myfile server1:/tmp/

    ```


    If the SSH service is configured to listen on a port other than the default port
    22, -P to indicate that port on the scp command line:


    ```

    $ scp -12345 myfile server1:/tmp/    Connect to a particular port

    ```


    To do recursive copies, from a particular point in the remote file system, use
    the -r option:


    ```

    $ scp -r mydir francois@server1:/tmp/    Copies all mydir to remote /tmp

    ```


    Although scp is most useful when you know the locations of the file(s) you want,
    sometimes it is more helpful to browse and transfer files interactively.


    # Copying Remote Files in sftp and lftp Sessions


    The sftp command lets you use an ftp-like interface to find and list directories
    over SSH protocols. Here''s an example of how to start an sftp session:


    ```

    $ sftp chris@server1

    chris@server1''s password: ******

    sftp>

    ```


    Use ftp in the same manner as you use regular ftp clients. Type ? for a list of
    commands. You can change directories (cd), change local directories (lcd), check
    current remote and local directories (pwd and lwd), and list remote and local
    contents (is and ls). Depending on the permission of the user you logged in, you
    may be able to create and remove directories/group (mkdir and rdir), and change
    permissions (chmod and chgrp) of files and directories.


    You can also use lftp (discussed earlier in this chapter) as an sftp client. lftp
    adds many user-friendly features such as path completion using the Tab key:


    ```

    $ lftp sftp://chris@server1

    Password: ******

    lftp chris@server1->

    ```


