    If you want to add options when creating the ISO image, you can simply add mkisofs
    to the command. (For example, see how the -R and -J options are added in the above
    examples.)


    If you want to burn a DVD image using growisofs, you can use the -dvd-compat option.
    Here''s an example:


    ```

    # growisofs -dvd-compat -Z /dev/cd0-image.iso Burn an ISO image to DVD

    ```


    The -dvd-compat option can improve compatibility with different DVD drives over
    some multi-session DVD burning procedures.


    # Summary


    BSD and its predecessor UNIX systems handled data backups by combining commands
    that each handled a discrete set of features. Backups of your critical data can
    still be done in this way. In fact, many of the tools you use will perform more
    securely and efficiently than ever before.


    The tape archive utility (tar command) has expanded well beyond its original job
    of making magnetic tape backups of data files. Because nearly every BSD, Linux,
    and UNIX system uses tar, it becomes a standard utility for packaging software
    and backing up data to compressed archives. These archives can then be transported
    and stored in a variety of ways.


    To move back data to other machines over a network, you can use execution features
    of OpenSSH tools (such as ssh). You can also use an excellent utility called rsync.
    With rsync, you can save resources by only backing up files (or parts of files)
    that have changed.


    Inexpensive CDs and DVDs have made these media popular for doing personal and
    small-office backups. The mkisofs command can create files of backed up data in
    ISO9660 format that can be restored on a variety of systems (BSD, Linux, Windows,
    or Mac). After mkisofs command has created an ISO image, the image can be burned
    to CD or DVD using the cdrecord and growisofs commands.'
