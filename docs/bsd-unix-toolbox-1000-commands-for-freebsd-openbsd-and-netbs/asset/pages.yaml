  md: '# Chapter 10: Managing the System


    Some services are turned on /etc/rc.conf based on selections you made when you
    ran sysinstall file to install FreeBSD. For example, here is how /etc/rc.conf
    file looked just after installation:


    ```

    hostname="myhost.localdomain"

    ifconfig_fp0=DHCP

    linux_enable=YES

    local_startup="/usr/local/etc/rc.d"

    shhd_enable="YES"

    ```


    As you can see, the hostname is, the Ethernet interface is started using DHCP,
    and Linux compatibility is enabled. Additional rc.d scripts are enabled from the
    /usr/local/etc/rc.d directory and the Secure Shell service is started, so people
    can log in to machine over the LAN.


    Many of the services you can enable network services and are described in detail
    Chapter 14. At this point, I would recommend you go through the default rc.conf
    file (/etc/defaults/rc.conf) and look at the services and features you can enable
    in there. Copy the lines representing the features you want to the /etc/rc.conf
    file. Features change from NO to YES will start and run as configure them.


    # Starting and Stopping Your System


    Although you can use the init command to start and stop your BSD system, including
    init 0 (shut down) and init 6 (reboot), there are also specific commands for stopping
    BSD. The advantages of such commands as halt, reboot, or shutdown are that they
    include you to let some features before shutdown occurs. For example:


    > WARNING! Don''t try the following commands if you don''t intend to actually
    turn off your system, especially on a remote system.


    ```

    # reboot

    Reboot the computer

    # halt -n

    Don''t run sync to sync hard drives before shutdown

    # halt -p

    The system will power down, if possible

    # shutdown +10

    Shutdown in ten minutes after warning the users

    # shutdown -r 06:08

    Reboot at 06:08 am

    # shutdown +10 ''Bye!''

    Send custom message to users before shutdown

    ```


    Besides the reboot or init 6 commands, you can also use the old PC keystrokes
    Ctrl+Alt+Del to reboot your computer.


