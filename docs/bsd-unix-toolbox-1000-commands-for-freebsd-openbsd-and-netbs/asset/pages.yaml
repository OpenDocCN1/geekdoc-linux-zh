  md: '# Appendix A: Using vi or Vim Editors


    From the ex prompt you can also see and change settings related to your vi session
    using the set command. Table A-7 shows some examples.


    # Table A-7: set Commands in ex Mode


    | Command | Result |

    | :--- | :--- |

    | :set all | List all settings. |

    | :set | List only those that have changed from the default. |

    | :set number | Have lines appear left of each line. (Use set non to unset) |

    | :set ai | Sets autoleindent, opening a new line follows the previous indent.
    |

    | :set ic | Sets ignore case, so text searches match regardless of case. |

    | :set list | Show $ for end of lines and ^| tabs. |

    | :set wm | Causes vi to add line breaks between words near the end of a line.
    |


    # Working in Visual Mode


    The Vim editor provides a more intuitive means of selecting text called visual
    mode. To begin visual mode, move the cursor to the first character of the text
    you want to select and press the v key.


    At this point, you can use any of your cursor movement keys (arrow keys, Page
    Down, End, and so on) to move the cursor to the end of the text you want to select
    and move cursor, you will see text being highlighted. When all the text you want
    to select is highlighted, you can press keys to act on that text. For example,
    d deletes the text, c lets you change the selected text, :w /tmp/test.txt saves
    selected text to a file, and so on.


    # Summary


    The vi command is one of the most popular text editors used for FreeBSD and UNIX
    systems. Using keystrokes, you can go and forth between command mode (where you
    can move around the file) and insert or replace modes. For a vi that is more advanced,
    you can use the vim command. Using ex mode, you can read and write text from files,
    do complex search and replace commands, and temporarily exit to a shell or other
    command.


    270'
