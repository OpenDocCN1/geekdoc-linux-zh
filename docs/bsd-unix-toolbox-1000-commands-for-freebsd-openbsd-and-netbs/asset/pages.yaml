    # Summary


    FreeBSD, OpenBSD, NetBSD, and other BSD systems make it easy for you to watch
    and modify many aspects of your running system to make sure it is operating at
    peak performance. Commands such as vmstat, and iostat, let you see how your system
    is using its memory, CPU, and storage devices. Using commands such as date and
    cal, as well as services as NTP, you can watch and manage your system''s date
    and time settings.


    To manage the features that are set and services come up when you boot your system,
    you can modify features associated with your boot0 boot loader. You can change
    your boot loader to a different one, such as GRUB. Commands such as reboot, halt,
    and shutdown let you safely stop or reboot your computer.


    When it comes to managing your computer''s hardware, commands such as kldstat,
    kldload, and kunload let you work with loadable modules. You can view information
    about your hardware with such commands as lspci and dmidecode.'
