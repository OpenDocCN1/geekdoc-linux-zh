    # Sharing Desktops Using VNC


    Virtual Network Computing (VNC) consists of server and client software that enables
    you to assume remote control of a full desktop display from one computer to another.
    In FreeBSD and similar systems, you need the VNC package to access a remote desktop
    on your display (client) or share a desktop from your computer (server). To install
    those VNC client and server components, type the following:


    ```

    # pkg_add -r vnc

    ```


    VNC client are available for all, and interoperable with many different operating
    systems. VNC servers are available on BSD, Linux, Windows (32-bit), Mac OS X,
    and UNIX systems. VNC clients are offered on those, and many other types of systems
    (including OS/2, PalmOS, and even as a Java application in a web browser).


    > NOTE Opening access to manipulate your desktop represents a security risk. You
    can help minimize risk by running the VNC server on the local host only, then
    having remote users connect to the machine using SSH (or Putty from Windows systems).


    # Setting Up the VNC Server


    Because VNC shares desktops on a per-user basis, you can start by logging in as
    the user whose desktop you want to share. As that user, you want to create a VNC
    password and launch the VNC server. Here''s how:


    +   1. Create a directory to hold the VNC settings:


    ```

    $ mkdir $HOME/.vnc

    ```


    +   2. Create a VNC password for that user:


    ```

    $ vncpasswd

    Password: *******

    Verify: ********

    ```


    +   3. Finally, you can start the VNC service (vncserver) either by running vncserver
    directly from the shell or by adding the command to a start-up file that is launched
    each time the system boots. For now, run the following command to start the VNC
    server:


    ```

    $ vncserver

    ```'
