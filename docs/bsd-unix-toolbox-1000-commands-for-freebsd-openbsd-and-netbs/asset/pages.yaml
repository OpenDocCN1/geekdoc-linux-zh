  md: '# Chapter 5: Manipulating Text


    # # Using the Pico and Nano Editors


    Pico is a popular, very small text editor, distributed as part of the Pine e-mail
    client. Although Pico is free, it is not truly open source. Some BSD distributions
    do not offer Pico (although pkg_add -r pico). As an alternative to Pico, you can
    use an open source clone of Pico called nano (nano''s another editor). This section
    describes the nano editor (pkg_add -r nano).


    Nano (represented by the nano command) is a command that runs text editors from
    the shell, is screen-oriented (owing to the fact that it is based on the curses
    library). Nano is popular with those who formerly used the Pine e-mail client
    because nano''s editing features are the same as those used by Pico''s editor.
    On the rare occasion that you don''t have the vi editor available on a BSD or
    Linux system (for example, isn''t available when you are installing a minimal
    Gentoo Linux), nano may be available. On FreeBSD, nano is part of the nano package
    and relies on the asp package for spell checking.


    As with JOE, to add text, just begin using command and typing, you can just begin
    typing. To open a text file for editing, just type nano and the file name or use
    some of the following options:


    ```

    $ nano memo.txt               Open memo.txt for editing

    $ nano -B memo.txt             When saving, backup previous to ~.filename

    $ nano -m memo.txt              Turn on mouse to move cursor (if supported)

    $ nano +83 memo.txt             Begin editing on line 83

    ```


    As with JOE, to add text, just begin using. Use arrow keys to move the cursor
    left, right, up, or down. Use the Delete key to delete text under the cursor or
    the Backspace to erase text to the left of the cursor. The press codes for nano
