  md: '# # About the Authors


    Christopher Negus is the author of the best-selling Fedora and Red Hat Linux Bibles,
    Linux Toys, Linux Troubleshooting Bible, and Linux Bible 2008 Edition. He is a
    member of the Madison Linux Users Group. Before becoming a full-time writer, Chris
    served for eight years on development teams for the UNIX operating system at AT&T,
    where UNIX was created and developed. He also worked with Novell on Linux development
    and Caldera Linux.


    François Caen, through his company Turbosphere LLC, hosts and manages business
    application infrastructures, with 95 percent running on Linux systems. As an open
    source advocate, he has lectured on OSS network management and Internet services
    and served as president of the Tacoma Linux Users Group. François is a Red Hat
    Certified Engineer (RHCE). In his spare time, he enjoys managing enterprise Cisco
    networks.


    # # About the Technical Editor


    Thomas Blader first began dabbling in Linux/UNIX in 1993 with Yggdrasil Linux
    and BSD. Since 1997, he has worked for the same company as Solaris/Linux administrator.
    He has recently become involved with network security. He also does UNIX-related
    consulting and software development as well as book writing and editing.'
