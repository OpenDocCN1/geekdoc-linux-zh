  md: '# 6


    # Playing with Multimedia


    There''s no need to go to a GUI tool, if all you need to do is play a song or
    convert an image or audio file to a different form. There are commands for working
    with multimedia files (audio or images) that are quick and efficient if you find
    yourself working from the shell files, the same command you use to transform one
    file can be added to a script to repeat the process on many files.


    This chapter focuses on tools for working with audio and digital image files from
    the shell.


    # IN THIS CHAPTER


    +   Playing music with play, ogg123, and mpg321.


    +   Adjusting audio with alsmixer and aix


    +   Ripping music CDs with cdparanoola


    +   Encoding music with oggenc, flac, and lame


    +   Converting audio files with sox


    +   Transforming digital images with convert


    # Working with Audio


    There are commands available for BSD systems that can manipulate files in dozens
    of audio formats. Commands are as ogg123, mpg321, and play can be used to listen
    to audio files. There are commands for ripping songs from music CDs and encoding
    them to store efficiently. There are even commands to stream audio anyone on your
    network can listen to your playlist.


    # Working with Audio


    Your BSD system may not be configured to play sound when you install it. If that''s
    the case, you need to load the appropriate drivers for your sound card. The drivers
    for many popular sound cards are already included in FreeBSD. Here is a quick
    procedure to find and configure sound in FreeBSD:


    ```

    # dmesg | grep -i audio Check if your sound card was detected

    pcm0: <AudioPCI ES1373-B> port 0xdf00-0xdf3f irq 6 7.0 on

    pci1

    # lspci | grep -i audio List PCI devices (from pciutils\package)

    01:07.0 Multimedia audio controller: Ensoniq ES1371 [AudioPCI-rev 0]

    ```'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 6: Playing with Multimedia


    Next check the /boot/defaults/loader.conf file to find the module for your card.

    Don''t edit it for Instead, add entries to /boot/loader.conf to enable sound and
    load

    y sound card''s driver. In my case, I added this and rebooted:


    ```

    sound_load=YES              # Digital sound system

    snd_es137x_load=YES      # es137x

    ```


    If you are not sure which sound card you have, you can try loading all sound

    drivers with the line snd_driver_load=YES instead of the es137x line shown

    After reboot, sound devices in /dev/ that should now be available include dsp,

    dsp0.0, audio0.0, mixer0, and sndstat. (The devices you depend on

    your sound card). Try this to see if the sound module was properly configured:


    ```

    $ cat /dev/sndstat Check your installed audio device

    FreeBSD Audio Driver (newpcm)

    Installed devices:

    ```


    ```

    pcm0: <AudioPCI ES137x-0> at 0xdf00 irq 6 kld snd_es137x

    (lp1/0r channels duplex)

    ```


    Some commands let you to enter a specific device, which is particularly useful
    if

    y have multiple sound cards or CD drives. Mixing applications use /dev/mixer0

    by default. Your CD device is likely /dev/acd0. For some reason, permissions on

    dev/acd0 are closed to all, but for root. So, you might need to open

    permissions to let regular users play music from a CD as follows:


    ```

    $ chmod 666 /dev/acd0 Open permissions so any user can play CDs.

    ```


    Next, out adjusting the Audio Levels section and then playing some audio.

    For the audio players described in the rest of this section, you can install the
    following-\packages: sox, vorbis-tools, libvorbis, mpg123, and aum. For audio
    ripping and

    encoding, you can install packages such as cdparanoia and flac. You can use pkg_add

    -r package to install any of those packages.


    # Playing Music


    Depending on the audio format you want to play, some command line players are

    available for BSD. The play command (based on the sox facility, detected later),
    can

    audio files in multiple, freely available formats. You can use ogg123 to play
    popular source music formats, including Ogg Vorbis, Freeless Audio Codec

