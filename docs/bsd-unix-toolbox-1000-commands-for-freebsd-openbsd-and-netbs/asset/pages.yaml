  md: '# Chapter 1: Starting with BSD Systems


    is the quickest path to getting the information you need to use your BSD system
    to his fullest extent.


    If this sounds useful to you, please read on.


    # About FreeBSD, NetBSD, code and OpenBSD


    In the early 1970s, AT&T released the UNIX source code to several colleges and
    universities, allowing them to begin changing, adapting, and improving that code
    as they pleased. That decision has led to the development of every major free
    and open source averaging operating system, not least of which the systems are
    based on the Berkeley Software Distribution (BSD).


    The twisty history of BSD is easy to Google for, if you care to learn the details.
    For our purposes, let''s just say:


    +   - BSD began as a set of software add-ons to AT&T''s Sixth Edition UNIX.

    - Over the years, BSD developers split off on their own development path, rewriting
    software with the intention of replacing all AT&T copyrighted code.

    - In the early 1990s, AT&T''s Unix Laboratories used BSD developers (Berkeley
    Software Design, Inc.) for copyright infringement.


    +   - In 1995, the final version of BSD from Berkeley was released under the name
    4.4BSD-Lite, release 2. Today''s BSD operating systems, including FreeBSD, NetBSD,
    and OpenBSD, are all based to some extent 4.4BSD-Lite.


    Operating systems derived from BSD have a well-earned reputation for stability
    and security. BSD was developed at a time when computing resources (disk space,
    network bandwidth, and memory) were meager by today''s standards. BSD systems
    are operated by efficient commands, instead of the bloated applications and dumbed-down
    graphical interfaces seen today.


    Because of the nature of BSD systems, people running those systems required a
    high level of expertise. Even when using graphical user interfaces based on the
    X Window System appear to, effectively operate a BSD system you still needed to
    know about such things as kernels, device drivers, modules, and daemons. Because
    security came before ease-of-use, a BSD expert needed to know how to deal with
    the fact that many features they may have wanted were not installed, or were turned
    off, by default.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1: Starting with BSD Systems


    If you are someone who has used Linux before, transitioning to a BSD system shouldn''t
    be too hard. However, BSD systems tend to behave a bit more like older UNIX systems
    than they do Linux. Many interfaces are text-based, offering lots of power if
    you know what you are doing. Despite that fact, all the major desktop components
    that, for example, you get with the GNOME desktop environment are available with
    BSD systems. So you don''t have to live on the command line.


    Here is a list of popular BSD-based operating systems that are still being developed
    today:


    +   - FreeBSD (www.freeBSD.org) is the most popular of the BSD operating system
    distributions. It can be operated as a server, workstation, desktop system, but
    has also been used in network appliances and special-purpose embedded systems.
    It has a reputation for maximum performance.


    +   - NetBSD (www.netbsd.org) has a reputation for being very popular, with versions
    of NetBSD running as an embedded system on variety of hardware. NetBSD can run
    on anything from 32-bit and 64-bit PCs to personal digital assistants (PDAs) to
    VA minicomputers.


    +   - OpenBSD (www.netbsd.org) is a popular system for network servers, although
    it can operate as a workstation or network appliance as well. The goal of OpenBSD
    is to attain maximum security. Unlike FreeBSD and NetBSD, which are covered under
    the BSD license, OpenBSD is covered primarily under the more-permissive Internet
    Systems Consortium (ISC) license.


    +   - DragonFly BSD (www.dragonfly.org) was originally based on FreeBSD. Its goal
    was to develop technologies different from FreeBSD in areas such as symmetric
    multiprocessing and concurrency. The focus has on on expanding features in the
    kernel.


    Other free (as no cost, as well as freedom to do what you like with the code)
    operating systems based on BSD include Darwin (on which Mac OS X is based) and
    desktop-oriented systems as PC-BSD and DesktopBSD. FreeBSD is a live CD BSD system.
    Proprietary operating systems that have derived from BSD include:


    +   - Mac OS X (www.apple.com/macos) is produced by Apple, and focuses on adding
    an easy-to-use graphical interface to sell with its line of computers. There is
    also Mac OS X Server product available. Although Mac OS X was originally based
    on Darwin, it is considered a closed-source operating system with open source
    components.


    +   - SunOS (www.sun.com) was developed by Sun Microsystems and was very popular
    as a professional workstation system. Sun stopped development of SunOS in favor
    of Solaris. However, because Solaris represents a merging of SunOS and UNIX System
    V, many BSD features made their way into Solaris.'
