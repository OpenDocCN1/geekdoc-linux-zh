- img_proc: true
  md: '# Chapter 10: Managing the System


    There is a grub package available with FreeBSD. Or you can configure GRUB from
    one of the other systems installed on your computer, if they have to. install
    GRUB in FreeBSD, type the following:


    ```

    # pkg_add -r grub      Install the grub package

    ```


    Next, you set up GRUB files by creating /boot/grub directory and copying the GRUB
    files you need there.


    ```

    # mkdir /boot/grub      Create the /boot/grub directory

    # cp -Rf /usr/local/share/grub/i386-freeBSD/ /boot/grub Copy files to /boot/grub

    ```


    Next you need to create a menu.list file using any editor, to tell GRUB what boot
    and how. In this example, the FreeBSD system and the Debian GNU/Linux system described
    earlier are set up to boot from the GRUB boot screen.


    ```

    default-0

    timeout 15


    title FreeBSD

    rootnofify (hd0,0)

    makeactive

    chainloader +1


    title Debian GNU/Linux

    root (hd0,1)

    chainloader +1

    ```


    The default operating system to boot is the first one (default=0), FreeBSD. GRUB
    will pause for 15 seconds (timeout 15) before booting the operating system. Because
    boot loaders are installed on both the FreeBSD and Debian partitions, an easy
    way to configure the two systems to boot with chainloader. That will let you see
    a secondary boot screen for each of those two systems.


    Now you need to overwrite the hard disk''s master boot record. Because you will
    probably be unable to write to your hard disk''s MBR by default, run the following
    sysctl make it possible to overwrite the MBR:


    ```

    # sysctl kernel.geom.debugflags=16

    ```


    Once you have the menu.list file created and are able to write to the master boot
    record, you can install it to the master boot record using the grub-install command.
    Type the following to install GRUB to the master boot record on disk ad0.


    > WARNING! You are about to overwrite your computer''s master boot record. If
    you did something wrong in your menu.list file, grub-install will probably fail.
    However, if the write completed with information that you won''t work, you can
    always put the old boot0 loader by typing boot0cfg -B ad0.


    # 177'
