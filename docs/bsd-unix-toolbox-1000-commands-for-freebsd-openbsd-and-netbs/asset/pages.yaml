  md: '# Introduction


    BSD UNIX Toolbox provides you with more than 1,000 specific command lines to help
    you become a BSD power user. Whether you are a systems administrator or desktop
    user, the book will show you commands to create file systems, troubleshoot networks,
    lock down security, and dig out anything you know about your BSD system.


    This book''s focus for your BSD command line journey is FreeBSD, one of the most
    popular BSD derivatives in the world. Tapping into the skills needed to run those
    systems can help you work with your own BSD systems and to learn what you need
    as a BSD professional.


    # Who Should Read This Book


    This book is for anyone who wants to access the power of a BSD system as systems
    administrator or user. You may be a free and open source software (FOSS) enthusiast,
    a BSD professional, or possibly a computer professional who is increasingly finding
    the Windows systems in your data center supplanted by BSD and Linux boxes.


    The bottom line is that you want to find quick and efficient ways of getting FreeBSD,
    NetBSD, OpenBSD systems working at peak performance. Those systems may be a few
    desktop systems at work, a file and print server at your school, or a home web
    server that you''re doing for fun.


    In the best case, you should already have some experience with BSD, Linux or other
    UNIX-like systems. However, if you are a computer professional with skills managing
    other types of operating systems, such as Windows, you should be able to easily
    adapt your knowledge to be able to use the specific commands we cover in the book.


    # What This Book Covers


    This is not a beginner''s BSD UNIX book. Before you jump in, it would be best
    if you have a basic working knowledge, of what BSD and other UNIX systems are,
    how the shells work, and processes, file systems, and network interfaces are.
    The book will then supplement that knowledge with information you need to do the
    following activities:


    +   - Get software — FreeBSD offers both binary software packages and source packages
    in the ports database that can be used to download, build, and install software
    from'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    source code. With tools like pkg_info, pkg_add, and pkg_delete, you''ll learn
    the best ways to find, download, install, and otherwise manage software from the
    command line.


    +   Access applications — Find what''s available from the FreeBSD distribution,
    then select and install the ones you want using the sysinstall utility.


    +   Use the shell — Find neat techniques and tips for the shell.


    +   Play with multimedia — Play and work with multimedia content from your computer.
    You can also modify audio and image, and convert the content of those files to
    different formats.


    +   Work with files — Use, manipulate, convert, and secure a wide range of file
    types in BSD systems.


    +   Administer file systems — Access, format, partition, and monitor your file
    storage hardware (hard disks, CD/CD drives, floppy disks, USB flash drives, and
    so on). Then create, format, and check the file systems that exist on those hardware
    devices.


    +   Back up restore data — Use commands to gather, archive, and compress your
    files into efficient backup archives. Then store those locally or on remote computers.


    +   Work with processes — List running processes in a variety of ways, such as
    CPU use, processor use, or process ID. Change running processes to have them run
    in the background or foreground. Send signals to processes to have them re-read
    configuration files, stop and resume processing, or stop completely (abort).


    +   Manage the system — Run commands to check system resources, such as memory
    usage, boot loaders, and kernel modules.


    +   Monitor networks — Bring wired, wireless, and dial-up network connections
    up and down. Check routing, DNS, and host information. Keep an eye on network
    traffic.


    +   Get network resources — Connect to BSD and Windows remote file systems using
    FTP, NFS, and Samba facilities. Use shell-based commands to browse the web.


    +   Do remote administration — Access and administer other computers using remote
    login (ssh, telnet, and so on), and screen. Learn about remote administration
    interfaces, such as SWAT and CUPS.


    +   Lock down security — Set up firewalls and system logging to secure your BSD
    systems.


    +   Get reference information — Use the appendixes at the end of this book to
    get more information about the shell (such as metacharacters and shell variables)
    and personal configuration files.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    Hopefully, if we have done it right, it will be easier to use this book than to
    Google for the command lines or GUI tools you need.


    After you have mastered many of the features described in this book, you''ll gained
    the following advantages:


    +   - **Hundreds of commands** — By compressing a lot of information into a small
    space, you will have access to hundreds of useful commands, in over 1,000 command
    lines, in a handy form to carry with you.

    - **Critical BSD information** — This book lists connections to the most critical
    information on the Web for succeeding with BSD systems in free and FreeBSD in
    particular.

    - **Transferable knowledge** — Most of the same commands and options you use in
    BSD systems will work exactly the same way on other UNIX-like systems. Different
    UNIX systems, on the other hand, offer different graphical administration tools.
    Even within a particular distribution, graphical tools change more often than
    commands.

    - **Quick problem solving** — By the time others have started up a desktop and
    launched a graphical administration tool, you will have already run a half dozen
    commands and solved the problem.

    - **Enduring value** — Many of the commands described in this book were used in
    early UNIX systems. So you are gaining the experience of thousands of command
    experts for more than 30 years.


    Because the full documentation for commands used in BSD systems connects thousands
    of man pages, info text, and help messages, you will surely want to reach beyond
    the pages of this book from time to time. Luckily, FreeBSD and other UNIX systems
    include helpful information installed on the system itself. Chapter 1 contains
    descriptions of how to access that information that is probably already installed,
    or can be easily installed, on your BSD system.


    # How This Book Is Structured


    The book is neither a pure reference book (with alphabetically listed commands)
    nor a guide (with step-by-step procedures for doing tasks). Instead, the book
    is organized by topics and aimed at including as many useful commands and options
    as you could fit in.


    Chapter 1 starts by giving you a basic understanding of what BSD is and how it
    relates to the operating systems that are derived from BSD, such as FreeBSD, NetBSD,
    and OpenBSD. Then it describes some of the vast resources available to support
    your experience with this book (such as man pages, info material, and help text).
    Chapter 2'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction


    provides a quick overview of installation and then describes useful commands as
    pkg_info and pkg_add for getting and managing your BSD software.


    Chapters 3, 4, 5, and 6 describe commands that a regular user may find useful
    on BSD systems. Chapter 3 describes tools for using the shell, Chapter 4 describes
    commands for working with files, and Chapter 5 describes how to manipulate text.
    Chapter 6 tells how to work with music and image files.


    Starting with Chapter 7, we get into topics relating to system administration.
    Creating and checking file systems is covered in Chapter 7, while commands for
    doing backups are described in Chapter 8. Chapter 9 describes how to manipulate
    running processes, and Chapter 10 describes administrative tools for managing
    basic components, such as hardware devices, CPU usage, and memory use.


    Chapter 11 begins the chapters devoted to managing network resources how to set
    up and work with wired, wireless, and dial-up network interfaces. Chapter 12 covers
    text-based commands for web browsing, file transfer, file sharing, chats, and
    e-mail. Tools for doing remote system administration are included in Chapter 13.


    Chapter 14 covers how to lock down security using features such as firewalls and
    logging. After that there are three appendices that provide reference information
    for text editing, shell features (metacharacters and variables), and personal
    configurations.


    # What You Need to Use This Book


    Although we you enjoy the beauty of prose, this is not meant to be a book you
    curl up in front of a nice fire with a glass of wine. We expect you will be sitting
    in front of a computer screen trying to connect to a network, fix a file system,
    or add a user. The wine is optional.


    In other words, the book is meant to be a companion as you work on a FreeBSD,
    NetBSD, or OpenBSD operating system. All these systems are available for the x86
    and x86_64 computer architectures. Some versions of those systems are also available
    for IBM PowerPC, SPARC, Intel i64 (Itanium), and Alpha. If you don''t already
    have one of these systems installed, refer to Chapter 2 for information on getting
    and installing those systems.


    All the commands in this book have been tested against FreeBSD on x86 or x86_64
    architecture. However, because many of these commands have been around for a long
    time (since dating back over 30 years to the original UNIX days), most will work
    exactly as described here on NetBSD, OpenBSD, and other derivative systems, regardless
