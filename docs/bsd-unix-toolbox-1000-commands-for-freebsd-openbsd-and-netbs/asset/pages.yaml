  md: '# Chapter 11: Managing Network Connections


    The numbers shown above are replaced by real IP addresses of computers that serve
    as DNS name servers. When you connect to working DNS servers, you can use commands
    to query those servers and look up host computers.


    You can use the dig command (which should be used instead of the nslookup command)
    to look up information from a DNS server. The host command can be used to look
    up address information for a hostname or domain name.


    To search your DNS servers for a particular hostname (in the following examples
    www.turbosphere.com), use the dig command as follows:


    ```

    $ dig www.turbosphere.com    Search DNS servers set in /etc/resolv.conf

    << DIG 9.3 << www.turbosphere.com

    ;; global options:

    ;; Got answer:

    ;;;>>HEADER-- opcode: QUERY, status: NOERROR, id: 45

    ;;; flags: qr rd ra; QUERY: 1, ANSWER: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    www.turbosphere.com.                IN      A

    ```


    Instead of using your assigned name server, you can query a specific name server.
    This is useful if you believe your name server is not resolving the address of
    a particular host properly. You can then check different servers to see how the
    name resolves. The following examples query the DNS server at 4.2.2.1:


    ```

    $ dig www.turbosphere.com mx @4.2.2.1

    ```


    Using dig, you can also query for a specific record type:


    ```

    $ dig turbosphere.com mx      Queries for the mail exchanger

    $ dig turbosphere.com ns      Queries for the authoritative name servers

    ```


    Use the +trace option to trace a recursive query from the top-level DNS servers
    down to the authoritative servers:


    ```

    $ dig +trace www.turbosphere.com    Recursively trace DNS servers

    ```


    If you just want to get the IP address of a host computer, use the +short option:


    ```

    $ dig +short www.turbosphere.com  Display only name/IP address pair

    turbosphere.com.

    66.113.99.70

    ```


    You can use -x to do a reverse lookup to find DNS information based on IP address


    ```

    $ dig -x 66.113.99.70        Get DNS information based on IP address

    ```'
