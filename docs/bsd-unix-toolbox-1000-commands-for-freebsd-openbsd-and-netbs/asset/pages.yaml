    # Finding Text in Binaries with Strings


    Sometimes you need to read the ASCII text that is inside a binary file. Occasionally,
    you can learn a lot about an executable that way. For those occurrences, use strings
    to extract all the human-readable ASCII text. Here are some examples:


    ```

    $ strings /bin/ls | grep -i libc      Find occurrences of libc in ls

    $ cat /bin/ls | strings      List all ASCII text in ls

    $ strings /bin/ls               List all ASCII text in ls

    ```


    # Replacing Text with sed


    Finding text within a file is the first step towards replacing text. Editing streams
    of text is done using the sed command. The sed command is actually a fully-blown
    scripting language. For the examples in this chapter, we cover basic text replacement
    with the sed command.


    If you are familiar with text replacement commands in vi, in this example, you
    would replace only the first occurrence per line of francois with chris. Here,
    sed takes input from a pipe, sending its output to stdout (your screen). The original
    file itself is not changed:


    ```

    $ cat myfile.txt | sed s/francois/chris/

    ```


    Adding a g to the end of the substitution line, as in the following command, causes
    every occurrence of francois to be changed to chris. Also, in the following example,
    input is directed from the myfile.txt and output is directed to myfile.txt:


    ```

    $ sed s/francois/chris/g < myfile.txt > myfile.txt

    ```


    The next example replaces the first occurrences of myname on each line in the
    /etc/hosts file with yourname. The output is directed to the /tmp/hosts file.


    ```

    $ sed ''s/myname/yourname/'' < /etc/hosts > /tmp/hosts

    ```


    Although the slash is the sed command''s default delimiter, you can change the
    delimiter to any other character of your choice. Changing the delimiter can make
    your life easier when the string contains slashes. For the previous example, a
    path could be replaced with either of the following commands:


    ```

    $ sed ''s-/nswitch.conf-/nswitch.conf and stuff-'' < /etc/hosts | grep nss

    $ sed ''sD/termios.hd/termios.h and stuffed'' < /etc/gettyab | grep termios

    ```


