    # Summary


    Nearly every aspect of the network connections from your BSD system can be configured,
    checked, and monitored using command line tools. You can view and change settings
    of your NICs using the ifconfig command. You can view network statistics with
    netstat.


    To start and stop your network, commands such as netif and ifconfig are easy to
    manage. When a connection is established, you can see statistics about that connection
    using netstat and route commands.


    To check DNS name resolution, use the dig, host, and hostname commands. Commands
    for checking connectivity and routes to a host include ping, arp, traceroute,
    and arping.'
