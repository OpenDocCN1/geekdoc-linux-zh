  md: '# Chapter 12: Accessing Network Resources


    # Using Windows File Transfer Tools


    In many cases, people need to get files from BSD servers using Windows clients.
    If your client operating system is Windows, you can use one of the open source
    tools to get files from BSD servers:


    +   * WinSCP (http://winscp.net). Graphical scp, sftp, and FTP client for Windows
    over SSH and SSH2 protocols.

    * FileZilla (www://zilla.sourceforge.net): Provides graphical client FTP and SFTP
    services in Windows, as well as offering FTP server features.

    * PSCP (http://chiark.greenend.org/~~sgtatham/putty/): Command line scp client
    that is part of the PuTTY suite.

    * PSFTP (http://chiark.greenend.org/~~sgtatham/putty/): Command line sftp client
    that is part of the PuTTY suite.


    # Sharing Remote Directories


    Tools described to this point in the chapter provide atomic file access, where
    connection is set up and files are transferred in one shot. In where more persistent,
    on-going access to a remote directory of files is needed, services for sharing
    and mounting remote file services can be most useful. Such services include Network
    File System (NFS), Samba, and SSHS.


    # Sharing Remote Directories with NFS


    Before sharing directories from your BSD system with NFS, you must start the NFS
    service. To do this in FreeBSD, copy NFS lines from the /etc/defaults/rc.conf
    file to the /etc/rc.conf and enable them. Here is what we added to the file /etc/rc.conf:


    ```

    nfs_server_enable=YES      # This host is an NFS server (or NO).

    rpc_lock_enable=YES        # Run NFS rpc.lockd needed for client/server.

    rpc_statd_enable=YES       # Run NFS rpc.statd needed for client/server.

    nfs_server=''u -t n 4''      # Flags for nfsd (if enabled)

    ```


    The NFS service will start the next time you reboot BSD. Or you can start it immediately
    by typing this as your root user:


    ```

    # nfsd -u -t n 4           Start the NFS service manually

    ```


    When your BSD system is running the NFS service, you can add entries to the /etc/exports
    file on the server to share directories with remote clients and showmount commands
    to see available and mounted shared directories. Mounting a shared directory is
    done with special options to the standard mount command.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    # ## Sharing Directories from an NFS Server


    With the NFS server running as just described, directories can be shared from
    that server by adding entries to the `/etc/exports` file. Here are examples of
    entries to that file:


    ```

    /usr/ports /usr/ports/Tools dt 001

    /usr/ports -rw mapall-jake

    /usr/ports -aldirs -network 10.0.0

    Let dt01 mount /usr/ports, /usr/ports/

    Share read/write, all users map to jake

    All on 10.0.0 can mount all /usr/ports dirs

    ```


    The examples just illustrate how an NFS server can share a specific directory
    (`/usr/ports`), several directories (`/usr/ports/Tools), or any directory beneath
    the named directory (-aldirs). Client permission can be mapped into specific users
    on the server (mapall) and host access can be granted to machines on select subnets
    (-network).


    # ## Viewing and Exporting NFS Shares


    From the BSD system, you can use the `mount` command to **see what shared directories
    are available from the local system**. For example:


    ```

    # /usr/bin/showmount -e

    Export list for server.example.com

    /export/myshare client.example.com

    /mnt/public .

    ```


    From a client BSD system, you can use the `mount` command to **see what shared
    directories are available from a selected computer**. For example:


    ```

    # /usr/bin/showmount -e server2.example.com

    Exports list on server2.example.com

    /export/myshare client.example.com

    /mnt/public .

    ```


    # ## Mounting NFS Shares


    Use the `mount` command to mount a remote NFS share on the local computer. Here
    is example:


    ```

    # mkdir /mnt/server-share

    # mount server.example.com:/export/myshare /mnt/server-share

    ```


    This example notes the NFS server (`server.example.com`) and the shared directory
    from that server (`/export/myshare`). The local mount point, must exist before
    mounting the share, at the end of the command (`/mnt/server-share).


    Pass NFS-specific options to the `mount` command by adding them after the `-o`
    option:


    ```

    # mount -o rw,hard,int server.example.com:/export/myshare /mnt/server-share

    ```


    214'
