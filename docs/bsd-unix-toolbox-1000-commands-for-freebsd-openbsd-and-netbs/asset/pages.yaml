    letters include r (file is in the process''s root directory), j (file is the jail
    root of the process), t (file is the kernel tracing of the process), y (the process
    uses the file as its controlling ty), m (file is mapped), w (the file is open
    for writing), a (file is open as append only), s (file has a shared lock), and
    e (file has an exclusive lock).


