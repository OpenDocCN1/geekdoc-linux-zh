- img_proc: true
  md: '# Checking and Managing Running Processes


    When an executable program starts up, it runs as a process that is under the management
    of your BSD system''s process table. Every BSD system provides all the tools you
    need to view and change the processes running on your system.


    The ps and top commands are great for viewing information on your running processes.
    There are literally dozens of options to ps and top to help you process information
    exactly way you want. The pgrep command can further help find the process you
    want.


    There are commands such as nice and renice for raising and lowering processor
    priority for a process. You can move processes to run in the background (bg command)
    or back to the foreground (fg command).


    Sending signals to a process is a way of changing its behavior or killing it altogether.
    Using the kill and killall commands, you can send signals by PID or name, respectively.
    You can also send other signals to process to do things as reread configuration
    files or continue on a stopped process.


    To run commands at scheduled times or so they are not tied to your shell session,
    you can use the at and batch commands. To run commands repetitively at set times,
    there are the cron and anacron facilities.


    +   IN THIS CHAPTER

    View active processes with ps and top

    Finding and controlling processes

    Adjust CPU priority with nice and renice

    Move processes to background (bg) or foreground (fg)

    Killing and signaling processes with kill and killall

    Using at and batch to run commands

    Scheduling commands to run repeatedly with cron'
  merge: -1
  pgno: 170
