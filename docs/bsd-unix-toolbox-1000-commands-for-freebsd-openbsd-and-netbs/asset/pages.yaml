  md: '# B


    # # Shell Special Characters\and Variables


    BSD systems offer several different shells you can use to enter commands and run
    scripts. Chapter 3 helps you become comfortable working in the shell. This appendix
    provides a reference of the numerous characters and variables that have special
    meaning to particular shells (such as the bash shell) or are available on most
    shells. Many of those elements are referenced in Table B-1 (Shell Special Characters)
    and Table B-2 (Shell Environment Variables).


    IN THIS APPENDIX


    Using special shell characters


    Using shell variables


    # ## Using Special Shell Characters


    You can use special characters from the shell to manage multiple files, save some
    keystrokes, or perform special operations. Table B-1 shows some special characters
    that you may find useful.


    ### Table B-1: Shell Special Characters


    | Character | Description |

    |---|---|

    | * | Match any string of characters. |

    | ... | Match any one character. |

    | [ ... ] | Match any character enclosed in the braces. |

    | ''...'' | Remove special meaning of characters between quotes. *Variables are
    not expanded.* |

    | " ... " | Same as simple quotes except for the escape characters ($ ` and \
    ) that preserve their special meaning. |


    Continued'
