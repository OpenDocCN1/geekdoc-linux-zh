  md: '# Using awk and cut to Process Columns


    Another massive text processing tool is the awk command. The awk command is a
    full-blown programming language. Although there is much more you can do with the
    awk command, the following examples show you a few tricks for extracting columns
    of text:


    ```

    $ awk ''print $1, $11''  # Show columns 1, 11 of ps

    $ awk ''/francois/(print $11)''  # Show francois processes

    $ awk grep francois | awk ''print $11''  # As as above

    ```


    The first example displays the contents of the first column (user name) and eleventh
    column (command name) from currently running processes output the ps command (awk
    aux). The next two commands produce the same output, with one using the awk command
    and the other using the grep command to find all processes owned by the user named
    francois. In each case, when processes owned by francois are found, column eleven
    (command name) is displayed for each of those processes.


    By default, awk assumes the delimiter between columns is spaces. You can specify
    a different delimiter with the -F option as follows:


    ```

    $ awk -F:''print $1,$5'' /etc/passwd  # Use colon delimiter to print cols

    ```


    You can get similar results with the cut command. As with the previous example,
    we specify a colon (:) as the column delimiter to process information from the
    /etc/passwd file:


    ```

    $ cut -d: -f1,5 /etc/passwd  # Use colon delimiter to print cols

    ```


    The cut command can also be used with ranges of fields. The following command
    prints columns 1 thru 5 of the /etc/passwd file:


    ```

    $ cut -d: -f1-5 /etc/passwd  # Show columns 1 through 5

    ```


    Instead of using a dash (- ) to indicate a range of numbers, you can use it to
    print all columns from particular column number and above. The following command
    displays all columns from column five and above from the /etc/passwd file:


    ```

    $ cut -d: -f5- /etc/passwd  # Show columns 5 and later

    ```


    We prefer to use the awk command when columns are separated by a varying number
    of spaces, such as the output of the ps command. And we prefer the cut command
    when dealing with fields delimited by commas (,) or colons (:), such as as the
    /etc/passwd file.'
  merge: -1
