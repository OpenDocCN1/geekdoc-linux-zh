    Microsoft DOS 提示符上工作，你应该知道你看到并操作的屏幕被称为命令行界面 (`LUI`)。


    Linux 是一个非常技术性的操作系统，这就是为什么程序员、工程师以及其他喜欢技术的人非常喜欢它。他们喜欢使用这种界面，因为这有助于他们编程。当你安装 Linux
    时，你可以选择图形用户界面，就像你使用 Windows 界面一样。在这里，你可以使用鼠标点击，也可以使用对程序员更好的命令行界面。由于这个原因，Linux
    的命令行界面可以用于很多事情。


