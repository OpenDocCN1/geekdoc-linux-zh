    # 键盘技巧


    Unix 是一个为热爱打字的人设计的操作系统。命令行不允许使用鼠标操作。Linux 命令可能非常繁琐，因此你应该学习许多键盘技巧。


    ### 文本修改


    以下列表显示了你如何在 Linux 命令行中修改文本。`killing”（杀死）和 `yanking”（拉取）术语分别指剪切和粘贴。


    - 键盘技巧 `CTRL-D` 将帮助你删除光标当前位置的字符。

    - 键盘技巧 `CTRL-T` 将帮助你交换光标当前位置字符与前一个字符的位置。

    - 键盘技巧 `Alt-U` 将帮助你将光标当前位置到单词结束点的字符转换为大写写。

    - 键盘技巧 `Alt-L` 将帮助你将光标当前位置到单词结束点的字符转换为小写。

    - 键盘技巧 `Alt-T` 将帮助你交换光标当前位置单词与前一个单词的位置。

    - 键盘技巧 `CTRL-K` 将帮助你删除光标当前位置到行尾的文本。

    - 键盘技巧 `CTRL-U` 将帮助你删除光标当前位置到行首的文本。

    - 键盘技巧 `ALT-D` 将帮助你删除光标当前位置到当前单词末的文本。

    - 键盘技巧 `ALT-Backspace` 将帮助你删除光标当前位置到当前单词开头的文本。如果光标位于单词开头，它还会删除上一个单词。

    - 键盘技巧 `CTRL-Y` 将帮助从剪贴板（kill-ring）中提取文本并粘贴到光标当前位置。


    # 全命令


    shell 帮助你的另一种方式是通过补全。当你输入命令时按下 Tab 键，就会发生这种情况。当你输入命令的一半时，可以按 Tab 键完成命令。需要记住的一点是你不要按
    Enter 键。


    ### 补全命令


    - 键盘技巧 `Alt-$` 将帮助显示所有可能的补全列表。你也可以通过双击 Tab 键来实现。这简单得多。

    - 键盘技巧 `Alt-*` 将帮助你插入可能的补全内容。当你打算使用多个匹配项时，这非常有用。


    # 历史记录


    Bash 会维护你输入命令的历史记录。命令列表保存在主目录下一个名为 `.bash_history` 的文件中。历史记录功能对于减少所需的打字量非常有用，特别是当它与命令行编辑结合使用时。这里是
    `history` 命令的语法。


    ```

    [gha@localhost ~]$ history | less

    ```

    Bash 默认存储你最后输入的 500 条命令。假设你想找到以前列出 `/usr/bin` 的命令。以下是实现方法。


    ```

    [gha@localhost ~]$ history | grep /usr/bin

    ```

    在浏览 `history` 命令时，你可以使用一系列按键组合。


    - 你可以使用快捷键 `CTRL-P` 移动到最新的历史记录项。此操作与向上方向键相同。

    - 你可以使用快捷键 `CTRL-N` 移动到下一条历史记录项。此操作与向下方向键相同。

    - 你可以使用快捷键 `ALT->` 移动到历史列表的底部（即当前命令行位置）。

    - 你可以使用快捷键 `ALT-<` 移动到历史列表的起点。

    - 你可以使用快捷键 `CTRL-R` 进行反向增量搜索。此选项从当前命令行开始向上历史列表进行增量搜索。

    - 你可以使用快捷键 `CTRL-O` 执行历史列表中的当前项并移动到下一个。如果你希望重新执行列表中的一系列命令，这非常方便。

    - 你可以使用快捷键 `ALT-N` 进行正向搜索。这是非增量的。

    - 你可以使用快捷键 `ALT-P` 进行反向搜索。这同样是非增量的。结合此快捷键，你可以在执行搜索之前先输入搜索字符串并按 ENTER。


    ### 历史扩展


    shell 通过使用 `!` 字符对历史列表中的不同项目提供特殊类型的扩展。我们已经看到数字可以跟在感叹号后面，以插入历史列表中的特定条目。还有许多其他扩展功能。历史扩展机制有许多可用元素，但这个主题太深奥了。


    - 你可以输入序列 `!!` 来重复最新命令。不过，按下向上箭头再按 ENTER 可能更容易。

    - 你可以输入序列 `!?string` 重复包含该字符串的最新历史列表项。

    - 你可以输入 `!string` 重复以字符串开头的最新历史项。

    - 你可以输入 `!number` 重复指定数字的历史项。


