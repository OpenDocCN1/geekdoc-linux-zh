    # emacs 编辑器


    Emacs 是一款流行的编辑器，在 Unix 出现之前就已经存在，开发者非常喜欢它，因为它可以移植到 Linux 中。它最初是一个控制台编辑器，类似于 `vi`，但很快迁移到了图形化环境。它提供了对原始控制台编辑器的访问，并在图形环境中使用图形化的
    X 窗口进行文本编辑。


    当从命令行启动 emacs 编辑器时，它会确定是否存在活跃的 X Window 会话并以图形模式启动。控制台模式版本使用多个你需要学习的命令来编辑程序。这需要使用键盘上的
    `CTRL` 和 `Meta` 键进行组合。通常，`Meta` 键映射到 PC 的 `ALT` 键，尽管并非所有系统都是如此。这里使用了缩写——`CTRL`
    简写为 `C-`，`Meta` 简写为 `M-`。


    ## emacs 编辑器的基本命令


    要从命令行编辑 emacs 文件，需要以下命令：


    ```bash

    emacs myfile.c

    ```


    当 emacs 控制台窗口打开时，你会看到简短的介绍和帮助屏幕。当按下按键时，文件会被加载到缓冲区并显示文本。你会在窗口顶部看到标准的菜单栏，但在控制模式下无法使用，只有在图形模式下可以使用。与
    `vim` 编辑器不同，emacs 编辑器只有单一模式，你通过进入和退出插入模式在插入命令和文本之间切换。当你输入可打印字符时，emacs 将将其插入到光标的当前位置；当输入命令时，它会被执行。要在缓冲区中移动光标，需要使用方向键以及
    `PageUp` 和 `PageDown` 键。移动光标的其他命令还包括：


    *   你可以使用 `C-p` 命令移动到文本的上一行。

    *   你可以使用 `C-n` 命令移动到文本的下一行。

    *   你可以使用 `C-b` 命令向后或向左移动一个字符。

    *   你可以使用 `C-f` 命令向前或向右移动一个字符。


    如果你希望进行更长跨度的跳转，可以使用以下命令：


    *   你可以使用 `M-f` 命令移动到右侧下一个单词。

    *   你可以使用 `M-b` 命令移动到左侧上一个单词。

    *   你可以使用 `M-a` 命令移动到当前句子的开头。

    *   你可以使用 `M-e` 命令移动到当前句子的末尾点。

    *   你可以使用 `C-e` 命令移动到当前句子的末尾点。

    *   你可以使用 `C-a` 命令移动到当前句子的起始点。

    *   你可以使用 `M->` 命令移动到文本的末尾行。

    *   你可以使用 `M-<` 命令移动到文本的起始行。

    *   你可以使用 `M-v` 命令向后移动一屏幕的数据。

    *   你可以使用 `C-v` 命令向前移动一屏幕的数据。


    你可以使用以下命令将编辑器缓冲区保存为文件并退出 emacs 编辑器：


    *   你可以使用 `C-x C-s` 命令将你在当前缓冲区中编写的内容保存到文件中。

    *   你可以使用 `C-x C-c` 命令退出 emacs 编辑器并停止编辑器的操作。

    *   你可以使用 `C-z` 命令退出 emacs 编辑器。但是，该命令不会保持会话运行，因此你可能需要回来。


    # 常用 Linux 命令


    Linux 命令多到无法逐一详细讨论，但我们涵盖了一些最常用的。如果你想知道某个 Linux 命令的作用，只需使用下面的语法访问其帮助页（manual page）：


    ```bash

    man command-name

    ```


    下表显示了更多命令、它们的语法及其功能的描述：


    | 命令 | 语法 | 描述 |

    | :--- | :--- | :--- |

    | adduser/ addgroup | `sudo adduser / sudo addgroup` | 这两个命令分别向系统添加用户或组。 |

    | agetty | `agetty -L 9600 tty1 vt100` | 一个管理虚拟和物理终端的程序。由 init 调用，在建立连接时打开 tty
    端口。 |

    | alias | `alias home=''cd''` | 在用户系统上为特定的 Linux 命令创建快捷方式或别名。 |

    | apropos | `apropos adduser` | 搜索并显示命令或程序的帮助页描述。 |

    | apt | `sudo apt update` | 用于 Ubuntu 和 Debian 系统的层级包管理器。 |

    | apt-get | `sudo apt-get update` | 用于安装、删除和升级软件包以及升级操作系统。 |

    | aptitude | `sudo aptitude update` | 基于文本的 GNU/Linux 包管理器系统，用于安装或删除包。 |

    | arch | `arch` | 显示机器硬件或架构名称。 |

    | arp | `sudo arp scan` | ARP 将 IP 网络地址映射到 MAC 地址——此命令扫描指定网络上的所有活动主机。 |

    | at | `sudo echo` | 调度任务在未来的指定时间执行。 |

    | atq | `atq` | 用于查看 at 命令队列中的作业。 |

    | atrm | `atrm (job number)` | 用于通过作业号从 at 命令队列中删除作业。 |

    | awk | `awk ''` | 用于处理文本以及报告和数据提取工具的程序。 |

    | basename | `basename bin/findhosts.sh` | 从绝对路径中去除目录并打印文件名。 |

    | bc | `echo 20.05 +15.00 | bc` | 强大的命令行计算器语言——详见语法语法下的示例。 |

    | bzip2 | `bzip2 -z filename / bzip2 -d filename.bz2` | 压缩或解压缩指定的文件。 |

    | cal | `cal` | 打印日历。 |

    | cat | `cat file.txt` | 查看文件内容，合并文件或数据并显示它们。 |


