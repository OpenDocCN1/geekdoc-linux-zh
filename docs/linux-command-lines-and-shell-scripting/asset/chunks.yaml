- fmt: '

    * The command `k` in `vim` Linux editor is used to move up the cursor by one line.

    * The command `PageDown` or `Ctrl-f` in `vim` Linux editor is used to move forward
    one screen of your data.

    * The command `PageUp` or `Ctrl-b` in `vim` Linux editor is used to move forward
    one screen of your data.

    * The command `gg` in the `vim` Linux editor is used to shift to the first line
    in the buffer.

    * The command `G` in `vim` Linux editor is used to move to the last line in the
    buffer.

    * The command `num G` in `vim` Linux editor is used to move to the line number
    in the buffer.


    A special mode in `vim`''s normal mode is called command line mode, and it lets
    you do things like type commands into it. The command line mode has a command
    line that you can use to control different types of actions in the `vim` editor.
    You can add commands to the command line to control different types of actions.
    In the `vim` editor, you have to press the colon key while you are in normal mode.
    When you click on the message line, the cursor will move to that line. Here, you
    will see a colon appear on the screen. This means that you should now enter a
    command.


    When you are in the command line mode, you may enter several commands to save
    the buffer to file and move out of the editor.


    * The command `q` in `vim` Linux editor is used to exit the system if you have
    made no changes to buffer data.

    * The command `wq` in `vim` Linux editor is used to save buffer data to file and
    then exit the editor.

    * The command `q!` in `vim` Linux editor is used to quit the editor and then discard
    the changes that are made to the data of buffer.

    * The command `w filename` in `vim` Linux editor is used to save your file with
    a different filename.


    ## Data Editing


    When you are in the insert mode, you may insert data in the buffer. Sometimes
    you have to add or remove some data after entering into the buffer. While you
    are in normal mode, the `vim` editor will provide certain commands for editing
    data in the buffer. You should take extra care when you try to use a PC keyboard
    `Delete` or `Backspace` keys while you are inside the `vim` editor. The `vim`
    editor recognizes the keyboard `Delete` key as an `x` command functionality, which
    will delete a character at the current cursor location.


    ## Copy & Paste


    A standard feature of these editors is their ability to make a cut or copy data,
    and after that, paste it into the document. Cutting and pasting text is easy.
    When `vim` removes your data, it will forward it into a separate register. You
    can then retrieve that data by using the `p` command. You can use the `dd` command
    to remove different lines of text. When you try to copy text, you may find it
    a bit trickier.


    * `x` in `vim` Linux editor is used to delete a character at the cursor''s current
    position.

    * `R text` in `vim` Linux editor is used to overwrite the data at the cursor''s
    current position with the text until you hit the `Escape` key.

    * `r char` in `vim` Linux editor is used to replace any single character at the
    cursor''s current position with `char`.

    * `dd` in `vim` Linux editor is used to delete a line at the cursor''s current
    position.

    * `A` in `vim` Linux editor is used to append data to the end point of the line
    at the cursor''s current position.

    * `a` in `vim` Linux editor is used to append data next to the cursor''s current
    position.

    * `J` in `vim` Linux editor is used to delete a line break to the end of the line
    at the cursor''s current position.

    * `dw` in `vim` Linux editor is used to delete a word at the cursor''s current
    position.

    * `d$` in `vim` Linux editor is used to delete the text to the ending point of
    a line from the cursor''s current position.


    ## The KDE Editor Family


    If you are using a Linux distribution that uses KDE desktop, you will see a couple
    of options in relation to text editors. The KDE project will officially support
    a couple of editors, such as `Kate` and `KWrite`. Both are graphical text editors
    containing a number of advanced features and some extra niceties that are not
    found in some common standard editors. This section will describe each editor
    and also the features that you may use in shell scripting.


    ## The KWrite Editor


    This is the basic editor for the KDE environment. It offers word-style text editing
    with support for code syntax editing and highlighting and is used for different
    types of programming languages. It uses color-coding to distinguish comments,
    constants, and functions. You should notice that the `for` loop carries an icon
    that connects the opening and closing braces. The editing window provides cut-and-paste
    capabilities.


    * The editor has many command line parameters you may use to customize how it
    starts.

    * The `Kwrite` editor command `--stdin` triggers the editor to read the data from
    a standard input device in place of a file.

    * `--column` triggers the editor to specify a column number in a file to initiate
    the process in the window of the editor.

    * `--encoding` triggers the editor to specify the type of character encoding for
    a file.

    * `--line` triggers the editor to specify the number of a line in a file to initiate
    in the window of the editor.


    The `KWrite` editor offers a toolbar and a menu bar at the top of the window used
    for editing, which allows you to select different features and then change the
    editor''s configuration settings. The menu bar will contain the following items.


    * `File` helps you load up, save, export or print different pieces of text from
    different files.

    * `Edit` aids you in manipulating text in buffer.

    * `View` helps you manage the appearance of the text in the editor of the window.

    * `Bookmarks` helps you handle the pointers to get back to certain locations in
    the text.

    * `Tools` has some specialized features for manipulation of text.

    * `Settings` helps you configure the way your editor handles the text.

    * `Help` will give you the information about the editor.


    ### The Edit Menu of KWrite


    Here is a rundown of different commands of the Edit menu.


    * `Undo` is used to reverse your latest action. `Redo` is used to reverse the
    latest action you undid.

    * `Cut` is used to delete the text that you have selected and then placed in the
    clipboard.

    * `Copy` is used to copy any piece of text you have selected to the clipboard.

    * `Copy as HTML` is used to copy the selected text to the clipboard as the HTML
    code.

    * `Paste` is used to insert the current content of the clipboard at the present
    position of the cursor on the screen.

    * `Select All` is used to select the entire text in your editor.

    * `Deselect` is used to deselect the piece of text you have currently selected.

    * `Block Selection Mode` permits you to select a piece of text between the columns
    instead of all the lines.

    * `Overwrite Mode` is used to toggle between insert mode and overwrite mode by
    replacing text with newly typed text instead of inserting the new text.

    * `Find` is used to produce the Find Text dialog box, which allows you to customize
    the text search.

    * `Find Next` is used to repeat the last find operation forward in the buffer.

    * `Find Previous` is used to repeat the last find operation backward in the buffer.

    * `Replace` is used to bring about on the screen the Replace With Dialog box.
    You can use it to customize a text search.

    * `Go to Line` is used to produce the Goto dialog box. It allows you to enter
    a certain line number. The cursor jumps to a specified line.


    ## The KWrite Editor Tools


    KWrite offers a wide range of tools for users to write and edit their shell scripts.
    Some of the tools are as under:


    * The `KWrite` editing tool, `Read Only Mode` will lock the text so that no changes
    may be made while you are still using the editor.

    * `Filetype` will select the file-type scheme used in a piece of text.

    * `Spelling` will start the spellcheck program at the starting point of a piece
    of text.

    * `Highlighting` will highlight the text based on the content like program code
    or the configuration file.

