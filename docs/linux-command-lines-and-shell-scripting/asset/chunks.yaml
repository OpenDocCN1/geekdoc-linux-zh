    ## 基础命令


    本章这一节将带你了解 Unix 命令和工具。位于行的第一个命令是 `cat` 命令，它用于显示文件的内容。我将使用系统信息文件，然后返回 Shell 提示符。这是最容易理解的命令之一。你可以获取一个或多个文件的输出并阅读它们。


    注意：从现在开始，我将使用 Fedora 发行版测试命令。


    ## Linux 中的文件导航


    你们很多人可能对图形用户界面很熟悉。在那个系统中进行导航非常容易。你可以看到一个完美的文件树来查看系统上的不同文件。你可以在几秒钟内打开并在它们之间导航。然而，在
    Linux 中情况并非如此。Linux 操作系统中没有文件的图形化显示。最好将 Linux 文件系统看作一个迷宫。你当前所在的目录就是当前目录。你上方的目录是父级目录。你可以使用
    `pwd` 命令显示当前工作目录。


    ```bash

    [gha@localhost ~]$ pwd

    /root

    ```


    ### ls 命令


    `ls` 命令将显示系统中某个目录的目录。默认是当前目录。你可以使用 `ls -1` 命令显示更长格式的文件列表。你也可以使用 `ls –F` 命令显示文件类型的信息。


    ```bash

    [gha@localhost ~]$ ls bench.py hello.c

    ```


    你可以使用 `cd` 命令更改当前工作目录。只需在 shell 中输入 `cd` 加上你想要工作的目录路径即可。路径是沿着树的分支到达你目标目录的通用路径。你可以通过两种方式指定路径。第一种是绝对路径。绝对路径从根目录开始，并逐分支跟踪树结构，直到文件或目标目录的路径完成。以你系统中的一个目录为例，大多数系统程序都安装在该处。


    ```bash

    [gha@localhost ~]$ cd /usr/downloads

    [gha@localhost downloads]$ pwd

    /usr/downloads

    [gha@localhost downloads]$ ls

    ```


    该命令将列出该目录下的文件。`ls` 命令是 Linux 操作系统广泛使用的命令之一。通过这个命令的帮助，你可以查看目录的内容并确定文件的数量和目录属性。正如你所看到的，你可以输入
    `ls` 命令查看当前工作目录中包含的文件和子目录列表。


    ```bash

    [gha@localhost ~]$ ls /usr

    bin games include lib lib64 libexec local sbin share src tmp

    ```


    你可以使用以下命令列出用户目录和 `/usr`。


    ```bash

    [gha@localhost ~]$ ls ~ /usr

    /root:

    bench.py hello.c

    /usr:

    bin games include lib lib64 libexec local sbin share src tmp

    ```


    你可以为 `ls` 命令添加 `-1` 来更改显示格式并显示更多细节。通过在同一个 `ls` 命令中添加 `-1`，你可以将输出更改为长格式。


    ## 选项和参数命令


    大多数 Linux 命令由一个连字符前的一个字符组成。然而，有些命令较长，带有两个连字符后跟一个单词，例如 GNU 支持项目中的命令。某些命令甚至允许将两个或多个较短选项标记在一起。在下方的示例中，我们将为
    `ls` 命令提供两个选项——第一个（`l`）将减少长格式输出，而第二个（`t`）将按修改时间对结果排序。


    让我们看看 `–l` 命令的结果。


    ```bash

    [gha@localhost ~]$ ls -l total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    现在我将 `t` 添加到 `–l` 中，如果可以延长输出，则延长它。


    ```bash

    [gha@localhost ~]$ ls -lt total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    你可以使用 `reverse` 命令反转输出顺序。该命令的语法如下所示：


    ```bash

    [gha@localhost ~]$ ls -lt --reverse total 8

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    ```


    让我们来看一些可以与 `ls` 命令配合使用的杂项命令。


    - `ls a` 用于列出所有以点开头且具有正确名称的文件列表。它还会产生那些通常被列为隐藏的文件。

    - `ls --all` 是相同命令的长格式选项。

    - `ls –d` 用于指定一个目录并显示其内容。它不显示目录本身。你可以将此命令与 `–l` 命令配合使用，以探索有关目录的细节而非内容。

    - `ls --directory` 用于产生关于目录或其内容的更多细节。

    - `ls –F` 用于在列出的名称末尾添加特定的指示字符，例如名称后的正斜杠表示已在目录中。

    - `ls --classify` 用于在末尾添加指示字符。

    - `ls --human-readable` 用于以易读格式显示，而不是以字节为单位。

    - `ls –S` 用于按大小排序。

    - `ls –t` 用于按修改时间排序。


    ## 查看文件类型


    当我们开始探索系统时，你应该学习的最有用事情之一就是查看文件。为了做到这一点，我们使用 `file` 命令来帮助我们。Linux 不需要通过文件名来指定类型，例如你预期的
    `.jpg` 文件包含图像。当 `file` 命令被调用时，它会打印出文件的描述。


    ```bash

    [gha@localhost ~]$ file image.jpg

    ```


    有很多文件类型，而且像许多操作系统一样，Linux 将一切都视为文件。


    ### less 命令


    我们使用 `less` 命令查看文本文件。Linux 操作系统包含许多肉眼可读的文件，`less` 命令为我们提供了阅读它们的简单方法。文本文件需要检查，因为其中一些充满了系统设置。你会看到这些被标记为配置文件，而且它们都以特定的格式存储。当你阅读这些文件时，你将对
    Linux 的运行方式有一个了解，并且你会发现系统的某些程序（称为脚本）是以相同方式存储的。


    一旦执行了 `less` 命令，你就可以后滚动文本文件。假设你正在查看定义系统账户的文件。你可以使用此命令：


    ```bash

    [gha@localhost ~]$ less /etc/passwd

    ```


