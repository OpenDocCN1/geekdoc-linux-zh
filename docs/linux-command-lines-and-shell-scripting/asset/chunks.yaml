    # 第 9 章：用于函数的 Linux Shell 脚本


    ![](img/image00305.jpeg)


    你编写的代码可以用于脚本中的多个地方。如果代码很短，重写它并不是什么大问题。当你有大量代码需要在很多地方使用时，这会非常耗时。bash shell 做的就是**封装**。通过这种方式，代码被放入一个函数中，可以在代码中任何需要的地方使用它。


    ## 你需要知道的一切


    每隔一段时间，你代码中执行某些特定功能的部分可能需要在更复杂的脚本中被重用。这可能简单来说是反复显示一条消息来让人回答。也可能更复杂，例如脚本中需要频繁使用的复杂数学运算。人们厌倦了不断重写自己的代码。bash
