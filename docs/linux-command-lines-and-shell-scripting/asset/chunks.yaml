    The `for` command offers us the quotation marks to separate values that have more
    than one word. You may use double quotes to separate different values in the `for`
    command. See the following example.


    ```bash

    $ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    for mytest in Alabama Texas "New York" Alaska Virginia Arizona Ohio Arkansas "South
    Dakota" California "North Dakota" Colorado "New Jersey" Florida Michigan Georgia
    "North Carolina" "South Carolina" "New Mexico" "Rhode Island" "West Virginia"
    "New Hampshire" Vermont

    do


    echo I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $mytest

    done


    echo "The last US state I traveled to was $mytest" mytest=Connecticut

    echo "Now I am going to visit $mytest"


    $bash -f main.sh

    ```


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Alabama.


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Texas.


    Continuing through the States until we get to the last one:


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Vermont


    The last US state I traveled to was Vermont Now I am going to visit Connecticut


    Now the `for` command can distinguish between the single word and multi-word values.
    Also, the best thing is that when you are using double quotation marks, the shell
    sheds the quotation marks as a part of the value.


    ### Reading a List through a Variable


    Often what happens inside a shell script is that you accumulate lists of values
    that are stored inside a variable. Then it needs to iterate through a list. You
    may do this with the help of the `for` command.


    ```bash

    $ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    list="Alabama Texas New York Alaska Virginia Arizona Ohio Arkansas South Dakota
    California North Dakota Colorado New Jersey Florida Michigan Georgia North Carolina
    South Carolina New Mexico Rhode Island West Virginia New Hampshire Vermont"

    list=$list" Idaho"


    for state in $list do


    echo "I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $state"


    done


    $bash -f main.sh

    ```


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Alabama


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Texas


    Right up to the last state:


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Idaho


    The `list` variable contains the list of values that have been used for iterations.
    You should take note that the code uses another assignment statement for the concatenation
    of items to the existing list. Even when you forget to add items in the list,
    you can add them up by the concatenation method later on. I will add five more
    items to the list in the next example.


    ```bash

    $ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    list="Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado
    Florida Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee
    Utah Maine Missouri Minnesota" list=$list" Idaho"

    list=$list" Oregon" list=$list" Montana" list=$list" Delaware"


    for state in $list do


    echo "I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $state"


    done


    $bash -f main.sh

    ```


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Alabama


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Texas


    This output continues to list the states, right up to the last one:


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Delaware


    There is a way to generate values for custom usage in a list to use the output
    of a particular command.


    ```bash

    $ cat testing111 #!/bin/bash


    # I will read values from files


    myfile="states"


    for state in `cat $myfile` do


    echo "I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $state"


    done


    $cat states Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado
    Florida Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee
    Utah Maine Missouri Minnesota Idaho Oregon Montana Delaware

    ```


    ### The while Command


    The `while` command is a cross between the `if-then` statement and Linux `for`
    loop. It allows you to define a command to test a condition and then looping through
    a set of commands until you reach a zero exit status. It will analyze the test
    command at the start of each iteration. Upon reaching the non-zero exit status,
    the `while` command stops the execution of the set of commands.


    ```bash

    $ cat test10 #!/bin/bash


    # This is a while command test in Linux var15=20


    while [ $var15 -gt 0 ] do


    echo This is $var15 in the while loop. var15=$[ $var15 - 1 ]


    done


    $bash -f main.sh

    ```


    This is 20 in the while loop. This is 19 in the while loop. This is 18 in the
    while loop.


    The loop continues to the final line:


    This is 1 in the while loop.


    ## Multiple Test Commands


    You can pack up multiple test commands in the `while` loop.


    ```bash

    $ cat test1133 #!/bin/bash


    # Now I am testing a multicommand while loop in Linux shell var15=20


    while echo $var15 [ $var15 -ge 0 ] do


    echo "This operation is being conducted inside the while loop." var15=$[ $var15
    - 1 ]


    done


    $bash -f main.sh

    ```


    20


    This operation is being conducted inside the while loop. 19


    This operation is being conducted inside the while loop.


    18


    This operation is being conducted inside the while loop. 17


    This will continue until it reaches the last number:


    This operation is being conducted inside the while loop. 0


    This operation is being conducted inside the while loop.


    -1


    The first test command displays the present value of `var15` variable. The second
    command will use the test command to know the value of `var15` variable. The `echo`
    statement returns a simple message within the loop that indicates that the loop
    has runs its course.


    ### The until Command


    The `until` command works opposite to the `while` command. It requires a simple
    test command is specified, which will produce a non-zero exit status, at which
    point the bash shell will execute the `while` loop commands.


    However, similar to the `while` command, the `until` statement can also contain
    multiple test commands, and the exit status of the final command is the determining
    factor.


    ```bash

    $ cat test1222 #!/bin/bash


    # In this code block I will be using the until command var15=100


    until [ $var15 -eq 0 ] do


    echo You are seeing the operations of the until command. The next digit in the
    loop is $var15


    var15=$[ $var15 - 5 ] done


    $bash -f main.sh

    ```


    You are seeing the operations of the until command. The next digit in the loop
    is 100


    You are seeing the operations of the until command. The next digit in the loop
    is 95


    You are seeing the operations of the until command. The next digit in the loop
    is 90


    And continuing, until it reaches the final digit:


    You are seeing the operations of the until command. The next digit in the loop
    is 5


    The example has successfully tested the `var15` variable in order to determine
    when the loop will stop - when the value of the variable drops down to zero, the
    `until` command stops right away.

