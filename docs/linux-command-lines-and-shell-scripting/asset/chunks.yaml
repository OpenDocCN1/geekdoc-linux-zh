    We can use the `AND` operator to check whether several conditions have been satisfied.
    Every part that the operator separates has to be true; otherwise, the `AND` statement
    will only return false. Have a look at the script below to see how the operator
    works:


    ```bash

    #!/bin/bash


    echo -n "Enter Number:" read num


    if [[ ( $num -lt 10 ) && ( $num%2 -eq 0 ) ]]; then echo "Even Number"


    else


    echo "Odd Number" fi

    ```


    We the double-ampersand (`&&`) to denote the `AND` operator.


