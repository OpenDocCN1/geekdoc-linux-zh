    countries after Covid-19 is over. I am going to visit 8 countries after Covid-19
    is over. I am going to visit 9 countries after Covid-19 is over.

    I am going to visit 10 countries after Covid-19 is over. I am going to visit 11
    countries after Covid-19 is over. I have visited all the countries.

