    ![](Images/image00298.jpeg)Chapter 5 Redirection Commands & Keyboard Tricks with
    Linux Commands


    I/O redirection is the coolest thing about the command line. In this chapter,
    we''ll talk about this feature and how it can be very useful. IO stands for input
    and output, and it stands for "input and output." When you use this feature, you
    can change the input and output of commands and connect several commands to make
    a powerful command called a pipeline.


    In a program, there are two types of output that can happen. The first thing you
    have is the data that the program makes. As a second thing, there are status and
    error messages that tell you how the program is going. If you look at the command
    ls, you will see that it gives you results and error messages that you can see
    on your screen.


    This program sends the output to a file called standard error, which is where
    it is stored. This means that both standard error and output are connected to
    the screen, and they are saved in a file on the computer. There is a facility
    called standard input that many programs use to get information from a keyboard.
    This facility is called stdin.


    You can change where the output goes and where the input comes from with I/O redirection.
    In Linux, most of the time, output goes to the screen and input comes from the
    keyboard. I/O has the power to change that, though.


