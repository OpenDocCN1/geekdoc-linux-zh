    - Linux 命令 `cp item1 item2` 将将 `item1` 的文件复制到 `item2` 的文件中。如果 `item2` 存在，它将被 `item1`
    的内容覆盖。如果它不存在，系统将创建它。

    - Linux 命令 `-i item1 item2` 将将 `item1` 的文件复制到 `item2` 的文件中。然而，唯一的例外是，如果 `item2`
    存在，在覆盖文件之前会提示用户。

    - Linux 命令 `item1 item2 dir1` 将将 `item1` 和 `item2` 的内容复制到 `dir1`。在执行此命令之前，目录 `dir1`
    必须存在。

    - Linux 命令 `cp dir1* dir2` 使用通配符。它将 `dir1` 的所有文件复制到 `dir2`。条件是在执行命令之前 `dir2` 必须存在。

    - Linux 命令 `-r dir1 dir2` 将将目录 `dir1` 复制到目录 `dir2`。如果 `dir2` 不存在，它将被创建并包含与目录 `dir1`
    相同的内容。


    ### `mv` 命令


    Linux 命令 `mv` 根据用户的使用方式对文件进行移动和重命名。执行命令后，原始文件名将不再存在。`mv` 命令用法与 `cp` 命令相同。


    ```

    mv file1 file2

    ```


    就像 `cp` 命令一样，`mv` 命令也带有不同的选项，如下：

    - `mv` 命令选项 `-u` 或 `--update` 用于当你从一个目录移动到另一个目录时，且你移动的文件在目标目录不存在或比目标目录中的文件新。

    - `mv` 命令选项 `-v` 或 `--verbose` 用于在执行移动时显示信息消息。

    - `mv` 命令选项 `-i` 或 `--interactive` 用于在覆盖现有文件之前，它会提示用户进行确认。如果你没有指定该选项，`mv` 命令将覆盖现有文件，这对于你的文档记录是不利的。


    ### `mv` 命令示例


    - Linux 命令 `mv item1 item2` 将 `item1` 的文件移动到 `item2` 的文件中。如果 `item2` 存在，它将被 `item1`
    的内容覆盖。如果不存在，系统将创建它。在任何情况下，文件 `item1` 都将不再存在。

    - Linux 命令 `mv -i item1 item2` 将 `item1` 的文件移动到 `item2` 的文件中。然而，唯一的例外是，如果 `item2`
    存在，在覆盖文件之前会提示用户。

    - Linux 命令 `mv item1 item2 dir1` 将 `item1` 和 `item2` 的内容移动到 `dir1`。在执行此命令之前，目录
    `dir1` 必须存在。

    - Linux 命令 `mv dir1* dir2` 使用通配符。它将 `dir1` 的所有文件移动到 `dir2`。条件是在执行命令之前 `dir2` 必须存在。

    - Linux 命令 `mv dir1 dir2` 将目录 `dir1` 移动到目录 `dir2`。如果 `dir2` 不存在，你必须创建并将 `dir1`
    的内容移动到 `dir2`。


    ### `rm` 命令


    `rm` 命令用于移除或删除目录和文件，如下：


    ```

    rm file...

    ```


    在此命令中，`file`是一个或多个目录和文件的名称。使用此命令可能是非常危险的。一旦你用 `rm` 命令删除了某些东西，你就永远无法找回它。Linux 假设你是故意删除该文件的，它不会把文件还给你。因此，你应该谨慎使用它。假设你想删除某些目录中的
    HTML 文件。


    所以，当你使用 `rm` 命令配合通配符时，你应该先用 `ls` 命令测试通配符，以查看你将从系统中删除的文件内容。你可以使用方向键回命令，然后将其替换为
    `rm`。


    - `rm` 命令选项 `-r` 或 `--recursive` 用于递归删除目录。这意味着如果你要删除的目录有子目录，你也可以删除它们。如果你想删除一个目录，应该指定此选项。

    - `rm` 命令选项 `-f` 或 `--force` 用于忽略不存在的文件。它不会提示。它倾向于覆盖 `-interactive` 选项。

    - `rm` 命令选项 `-v` 或 `--verbose` 用于在执行删除时显示信息消息。

    - `rm` 命令选项 `-i` 或 `--interactive` 用于在删除现有文件之前，会提示用户进行确认。如果你没有指定该选项，`rm` 命令将静默删除现有文件，这对于你的文档记录是不利的。


    ### `rm` 命令示例


    - Linux 命令 `rm item1` 将静默删除 `item1` 的文件。

    - Linux 命令 `rm -i item1` 将删除 `item1` 的文件。然而，唯一的例外是，在删除文件之前会提示用户。

    - Linux 命令 `rm item1 dir1` 将删除 `item1` 和 `dir1` 的内容。在执行此命令之前，目录 `dir1` 必须存在。

    - Linux 命令 `rm -rf item1 dir1` 的工作与上述相同，例外是如果 `item1` 和 `dir1` 都不存在。


