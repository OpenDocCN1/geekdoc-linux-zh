    ```bash

    $ cat test1444 #!/bin/bash


    # The following code block shows nesting for loops for (( x = 1; x <= 4; x++ ))


    do


    echo "You are seeing the operations of the until command. The next digit in the
    loop is $x:"


    for (( y = 1; y <= 7; y++ )) do


    if [ $y -eq 5 ] then


    break


    fi

