    * `Indent`（缩进）将段落的缩进增加一个。

    * `Indentation`（缩进）将根据你在编辑器中的选择自动进行缩进。

    * `Spelling`（拼写检查）将在文本起始点启动检查程序。

    * `Spellcheck Selection`（检查选中文）将在文本的选中区域启动检查程序。

    * `Unindent`（取消缩进）将段落的缩进减少一个。

    * `Clean Indentation`（清理缩进）将段落缩进恢复为原始设置。

    * `Align`（对齐）将选中行的当前行恢复默认缩进设置。

    * `Uncomment`（取消注释）根据文件类型消除当前行的注释符号。

    * `Lowercase`（小写）将所选文本或光标所在字符设置为小写。

    * `Uppercase`（大写）将所选文本或光标所在字符设置为大写。

    * `Capitalize`（首字母大写）将所选文本或光标所在单词的首字母大写。

    * `Join Lines`（合并行）将当前位置的所选文本或行与下一行合并为单行。

    * `Word Wrap Document`（自动换行）将启用文本的自动换行。如果一行超过编辑器窗口边缘，它将继续在下一行。


    ## GNOME 编辑器


    如果你正在通过 GNOME 编辑器运行 Linux，使用一个看起来像图像一样的文本编辑器是非常简单的。它是一个简单的文本编辑器，具有一些额外的功能来增加编辑的乐趣。当你启动
    `gedit` 并打开多个一个文件时，它会将这些文件加载到不同的缓冲区中，并在编辑器的主窗口中以标签页的形式显示每一个文件。要查看你在 `gedit` 中处理过的文档，请查看左侧边框。


    ### 编辑器的基本功能


    除了编辑窗口外，`gedit` 还使用菜单栏和工具栏，允许你设置配置和功能。工具栏提供了对菜单栏项的快速访问，如下：


    * `File`（文件）菜单项帮助你加载新文件、保存现有文件并打印来自不同文件的不同文本。

    * `Edit`（编辑）帮助你操作缓冲区中的文本并设置编辑器偏好。

    * `View`（视图）帮助你设置与显示相关的编辑器功能。它也用于设置文本高亮模式。

    * `Search`（搜索）帮助你在编辑器活动缓冲区区域查找并替换文本段。

    * `Tools`（工具）用于访问安装在 `gedit` 中的插件工具。

    * `Documents`（文档）帮助你管理在缓冲区区域打开的不同文件。

    * `Help`（帮助）将为你提供关于编辑器及其命令的信息。你将看到一份完整的手册，用于使用编辑器和操作命令。


    ### 偏好


    `Edit` 菜单提供 `Preferences`（偏好）项，允许你自定义编辑器的操作。`Preferences` 对话框带有标签区域，允许你根据需求设置编辑器功能。


    ### 视图


    `View` 标签页提供了许多在编辑器窗口中显示文本的选项。


    * 你在 `View` 标签页中找到第一个选项名为 `Text Wrapping`（换行）。它决定了你如何处理编辑器中的长文本。当你启用该选项时，长文本将折到编辑器的下一行。`Do
    Not Split Words Over Two Lines`（不要跨两行拆分单词）选项防止在长单词中自动插入连字符，以防止单词在两行之间断开。

    * 你在 `View` 标签页中找到的第二个选项名为 `Line Numbers`（行号）。该选项在编辑器窗口的左侧边缘显示行号。

    * 你在 `View` 标签页中找到的第三个选项是 `Current Line`（当前行），突出光标所在的行。这让你能够轻松找到光标位置。

    * 你在 `View` 标签页中找到的第四个选项名为 `Right Margin`（右边界），用于启用右边界。该选项还允许你设置编辑器窗口的列数。列的默认值为
    80。

    * 你在 `View` 标签页中找到的第五个选项名为 `bracket matching`（括号匹配）。当你启用此选项时，编写 `if-then` 语句、`for`
    循环或 `while` 循环以及任何涉及括号的代码行时，可以轻松匹配括号。


    行号和括号匹配为用户提供了一个方便的环境。这有助于故障排除，并且在许多其他文本编辑器中并没有找到。


    ### 编辑器标签页


    * `Editor`（编辑器）标签页提供了处理缩进和制表符的选项。它还负责编辑后如何保存文档。

    * `Editor` 标签页中的 `Tab Stops`（制表停止）选项允许你设置按下 `Tab` 键时跳过的空格数。默认跳过值为 8。你可以重置它。该功能还有一个复选框，用于插入空格而不是制表符。

    * 你在 `Editor` 标签页中找到的第二个选项名为 `Automatic Indentation`（自动缩进）。当你启用它时，`gedit` 会对文本中的代码元素和段落（如
    `if-then` 语句和循环）缩进。

    * 你在 `Editor` 标签页中找到的第三个选项名为 `File Saving`（文件保存），提供了两个保存文件的功能。你可以为编辑窗口中打开的文件创建备份。你还可以设置是否喜欢按预选间隔保存文件。


    ### 字体与颜色


    `Font & Colors`（字体与颜色）选项提供了两项配置。


    * `Font & Colors` 标签页中的 `Font`（字体）选项允许你选择 `Monospace 10` 作为默认字体，或从对话框中选择自定义字体样式和大小。

    * `Font & Colors` 标签页中的 `Colors`（颜色）选项允许你选择用于文本、选中文本、背景和选择颜色的默认颜色方案。它用于为列表中的不同类别选择自定义颜色。


    默认颜色与为桌面选择的 `GNOME` 标准桌面主题匹配。当你选择不同的颜色时，这些颜色会改变以匹配桌面主题。


    ### 语法高亮


    `Syntax Highlighting`（语法高亮）标签页提供了 `gedit` 在编程模式下高亮不同元素的配置选项。`gedit` 编辑器具有检测文件中存在什么编程语言的能力。它会自动为该文本设置相应的语法高亮。此外，它允许你通过选择你喜欢的颜色来高亮代码的不同元素，从而自定义高亮功能。元素根据你选择的编程代码类型而变化。对于脚本，你可以选择
    `sh` 高亮模式，它包含某些颜色方案。


    ## 插件


    `Plugins`（插件）标签页提供了对 `gedit` 中使用的插件的控制。插件是独立的程序，通常与 `gedit` 接口并提供额外的功能。`gedit`
    有许多可用插件。但并非所有插件都默认安装在系统中。启用的插件在其名称旁边的复选框中会显示勾选。像 `External Tools`（外部工具）这样的插件在你选择它们后会提供一些额外的配置功能。它允许你设置快捷键来启动
    `gedit` 显示输出的终端。


    * 你可以使用 `Change Case`（更改大小）插件更改所选文本的大小写。

    * 你可以使用 `Document Statistics`（文档统计）插件报告单词数、字符、行数和非空格字符的数量。

    * 你可以使用 `Insert Date/Time`（插入日期/时间）插件在光标当前位置以多种格式插入当前时间和日期。

    * 你可以使用 `External Tools`（外部工具）插件在编辑器中提供特定的 shell 环境来执行脚本和命令。

    * 你可以使用 `Indent Lines`（缩进行）插件提供取消缩进和高级行缩进功能。


