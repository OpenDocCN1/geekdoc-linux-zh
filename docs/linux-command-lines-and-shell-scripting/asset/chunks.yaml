    This chapter will show you how to use the commands in the Linux operating system
    to look at files and folders and move them around. You can change the names of
    folders and files. Some of the tasks are simple. When you use commands to move
    around, you have more power and flexibility than when you use a graphical user
    interface. It''s easier to use the command line to do simple things, but you need
    it to do more complicated things. In a graphical user interface, it is hard to
    move HTML files from one directory to another. In a command-line system, it is
    easier to move the files. First, I''ll talk about some special characters that
    you can use in Linux. Then I''ll talk about the commands that you can use to change
    files and directories.


    ## Special Characters


    When you are discussing Linux with others, you may hear about some special characters
    that Linux users encounter during operations. Each special character has a job
    to do, knowing which will make things easier for you.


    * `*` is technically called asterisk or star. It is used for a regular expression
    and as a glob character.

    * `‘` is technically called a tick or single quote. It is used for literal strings.

    * Special character `.` is technically called dot. It is used to denote the current
    directory you are working in or the hostname or file delimiter.

    * `$` is technically called the dollar sign. It is used for denotation of a variable
    or for representing the end of the line.

    * `\` is technically called backslash. It is used for macros and literals.

    * `/` is technically called forward slash. It is used as a search command or a
    directory delimiter.

    * `!` is technically called bang. It is used for command history.

    * `|` is technically called pipe. It is used for command pipes.

    * `_` is technically called underscore or under. It is used for particular space.

    * `` ` is technically called backtick or backquote. It is used for command.

    * `“` is technically called double quote. It is used for literal strings.

    * `{}` is technically called braces or curly brackets. It is used for blocks.

    * `^` is technically called caret. It is used to denote the start of line.

    * `[]` is technically called squares or brackets. It is used for ranges.

    * `~` is technically called squiggle or tilde. It is used as directory shortcut.

    * `#` is technically called pound, hash, or sharp. It is used for comments.


    ## Command-Line Editing


    As you move around and explore the Linux shell, you will find out that you have
    the freedom to move in the shell through arrow keys. This comes as a standard
    on most operating systems. It is a good idea to know about the standard keystrokes
    on Linux


    * `CTRL-B` is used to move the cursor on the screen to the left side.

    * `CTRL-F` is used to move the cursor on the screen to the right side.

    * `CTRL-E` is used to move the cursor on the screen to the end of a line.

    * `CTRL-A` is used to move the cursor on the screen to the start of a line.

    * `CTRL-P` is used to view any previous commands on the screen. It is used to
    move the cursor upside.

    * `CTRL-N` is used to move the cursor to the downside, and it is also used to
    view the next command.

    * `CTRL-K` is used to erase everything from the cursor to the end of a line.

    * `CTRL-W` is used to erase the preceding word from the cursor on the screen.

    * `CTRL-U` is used to erase everything from the cursor to the start of a line.

    * `CTRL-Y` is used to paste the erased text that you have already cut off on the
    screen by the command `CTRL-U`.


    ## Linux Commands for Directories


    The `mkdir` Linux command is used for the creation of directories. It works as
    the following:


    ```bash

    mkdir directoryname

    ```


    ### The cp command


    Another command, the `cp` command, is used to copy directories and files. You
    can use it in different ways, such as the following:


    ```bash

    cp file1 file2

    cp files… directoryname

    ```


    You can use the following options with the `cp` command.

