    \ --- Starting work\\n\" apt-get update\napt-get -y upgrade\napt-get -y autoremove\
    \ apt-get autoclean\necho -e \"\\n$(date \"+%T\") \\t Script Terminated\"\n```\n\
    \nThis script will also remove old packages that you do not need anymore. Make\
