    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py


    Let’s take a look at some miscellaneous commands that you can pair up with the
    ls command.


    [gha@localhost ~]$ ls is used to produce a list of all the files with proper names
    that start with a period. It also produces those files that are usually listed
    as hidden.


    [gha@localhost ~]$ ls --all is the long option for the same command.


    [gha@localhost ~]$ ls –d is used to specify a directory and display its contents.
    It does not display the directory. You can pair up this command with the –l command
    to explore details about the directory instead of the contents.


    [gha@localhost ~]$ ls --directory is used to produce more details about the directory
    or its contents.


    [gha@localhost ~]$ ls –F is used to append a particular indicator character to
    the tail of listed names, like the forward-slash of the name is already in the
    directory.


    [gha@localhost ~]$ ls --classify is used to append the indicatory character to
    the tail of a listed name.


    [gha@localhost ~]$ ls --human-readable is used to display the contents in long
    format listings and display the files in human-readable formats rather than in
    the form of bytes.


    [gha@localhost ~]$ ls –S is used to sort out the results by the size of the files.


    [gha@localhost ~]$ ls –t is used to sort out the results by the modification time.


    ## Finding Out the Type of File


    As we begin to explore the system, one of the most useful things you should learn
    is what is in the files. To do this, we use the file command to help us work out
    the file type. Linux doesn’t require the filenames to specify the file contents,
    so, for example, where you would expect a .jpg file to contain an image, Linux
    doesn’t require this. When the Linux File command is invoked, it prints out a
    description of the file contents.


    [gha@localhost ~]$ file image.jpg


    There are lots of file types, and, like many other operating systems, Linux treats
    everything in the system as a file.


    #### The less command


    We use the less command for viewing text files. The Linux operating system contains
    several files with text readable by the human eye, and the less command gives
    us an easy way to look through them. Text files need to be examined because some
    of them will be full of system settings. You see these labeled as configuration
    files, and all of them are stored in a particular format. When you can read the
    files, you will gain an idea of the way Linux works, and you will find several
    of the programs used by your system, called scripts, are stored the same way.


    Once the less command has been executed, you can scroll through a text file, back
    or forward. Let’s say you are looking at a file defining user accounts for your
    system. You could use this command:


    [gha@localhost ~]$ less /etc/passwd


    Once the command has been given, you can look at the content of a specific file.
    If it is a long file, use the arrow keys on your keyboard to navigate the contents.
    Below you can see the other common keyboard shortcuts that help you navigate files
    with the less command:


    *   Page Up to scroll back a page


    *   Page Down to scroll forward a page Spacebar to scroll forward a page


    *   Up Arrow to scroll up a line on the page


    *   Down Arrow to scroll down the line on the page


    *   G to go to the end of the text file


    *   1G or g to move to the start of the file on the page


    *   h to display the help screen on the page'
