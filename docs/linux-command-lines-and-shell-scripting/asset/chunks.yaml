    Chapter 7 Working with Linux Editors


    Before we learn how to write Linux shell scripts, we should learn about the text
    editors we will need to write shell scripts with. This chapter will show you how
    to use features like search, copy, cut, and paste. The more you use an editor,
    the faster you will learn how to write shell scripts in Linux.


    ## The Vim Editor


    To work on a computer in the command line mode, you might need a text editor that
    can work on a Linux computer. The vim editor is the first one that Unix used.
    Console graphics mode is used in order to make it look like a text-editing window.
    This lets you see different lines of the file, move around, and change or replace
    a piece of text. The vim editor is good at working with data that is stored in
    a memory buffer, like when you write something. Type vim and the name of your
    file. Then, click on the file that you want to open in your editor.


    If you start the editor without giving it a file name, it opens but there is no
    file. Using full-screen mode, the vim editor makes the editor area bigger so the
    console window can see it. The first window will show the contents of the file
    and a message at the bottom of the window. If the file doesn''t take up the whole
    screen, a tilde is put on the lines that aren''t in the file. The vim editor can
    be used in two different ways: normal mode and add mode. In normal mode, vim reads
    certain keystrokes as commands when you open a file to work on.


    In the insert mode, each key that is typed at the cursor is added to a buffer
    that can be used again. You can get into insert mode by pressing the I key, and
    you can get out of it by pressing the ESC key.


    You can use the arrow keys in normal mode to move around the text so long as vim
    has detected the correct terminal type. The vim command includes those for cursor
    navigation, as you can see below:


    *   The command h in vim Linux editor is used to move to the left by one character.


    *   The command l in vim Linux editor is used to move to the right by one character.


    *   The command j in vim Linux editor is used to move down the cursor by one line.'
