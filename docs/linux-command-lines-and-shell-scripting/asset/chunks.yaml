    ### The `man` command


    Most executable programs intended for command-line use offer a formal piece of
    documentation known as a `man` page or a manual page. A special paging program
    known as `man` is loaded up on Linux to view the details. You can type the `man`
    command and then the title of the command. The man pages differ in format and
    contain a title or a synopsis of the command''s syntax, a listing, and a description
    of the purpose of the command. The man page does not include examples, and they
    are intended as a special reference and not as a tutorial. See the following example.


    ```

    [gha@localhost ~]$ man ls

    ```


    LS(1) User Commands LS(1)


    NAME


    ls - list directory contents


    SYNOPSIS


    ls [OPTION]... [FILE]...


    DESCRIPTION


    List information about the `FILEs` (the current directory by default).


    Sort entries alphabetically if none of `-cftuvSUX` nor `--sort` is specified.


    On most of the Linux operating systems, `man` uses `less` for displaying the manual
    page so that all familiar `less` commands work while the page is displayed. The
    manual that `man` displays has different sections, and it covers user commands
    and system administration commands. In addition to that, it also covers file formats,
    programming interfaces, and much more. See the complete layout of the manual as
    under:


    *   The number 1 section of the `man` command will display user commands.

    *   The number 2 section of the `man` command will display programming interfaces
    for the kernel system calls.

    *   The number 3 section of the `man` command will display programming interfaces
    to the C library.

    *   The number 4 section of the `man` command will display special files such
    as the device nodes and the drivers.

    *   The number 5 section of the `man` command will display formats of the files.

    *   The number 6 section of the `man` command will display the details of games
    and entertainment like screensavers.

    *   The number 7 section of the `man` command will display miscellaneous items.

    *   The number 8 section of the `man` command will display the commands related
    to system administration.


    At times, you may need to look into a specific section of a manual to find out
    what you are looking for. If you do not specify a section number, you will always
    get the very first instance of a specific match in section 1.


    ### The `apropos` command


    It is possible to search the list of man pages for some possible matches based
    on a specific search term. This crude approach is often helpful. The syntax is
    as under:


    ```

    [gha@localhost ~]$ apropos floppy

    ```


    ### The `whatis` command


    The `whatis` command in Linux operating displays the name and a short description
    of a man page. The syntax is as under:


    ```

    [gha@localhost ~]$ whatis ls

    ```


    The man pages that come with a Linux distribution system are labeled as a reference
    documentation instead of a tutorial. A number of man pages are tough to read,
    so tough that a majority of us skip them right away without giving them a second
    glance. However, the most difficult of the man pages are of `bash`. They are long,
    complicated, and almost unreadable. However, their length becomes their strength
    as they contain plenty of useful information for you to add to your knowledge.
    When you have gone through one page, it will start making sense to you.


    ### The `info` command


    The GNU project provides `info` pages as an alternative option to the man pages.
    A reader program called `info` displays these pages, and these are hyperlinked
    in the same way web pages are. For example:


    ```

    [gha@localhost ~]$ info ls

    ```


    Next: dir invocation, Up: Directory listing


    10.1 ‘ls’: List directory contents


    ===============================


    In the `ls` program, you will find information about files of any type, and that
    includes directories. As usual, arbitrary mixing of options ad file arguments
    is accepted.


    By default, `ls’ will list the contents of non-option command-line arguments that
    are also directories, but this is not a recursive list, and files starting with
    `.` are left out.


    The `info` program will read the `info` files – these are structures that go into
    individual nodes, each containing one topic. Hyperlinks in the `info` files help
    users move between the nodes, and these hyperlinks are identified by a leading
    asterisk. Typically, activating these hyperlinks requires the user to click them
    with the cursor and press Enter. The `info` command provides this information:


    *   The `?` key in the `info` menu will display the help menu.

