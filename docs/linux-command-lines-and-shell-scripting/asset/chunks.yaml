    Loops are a integral part of many programming languages, including Linux and there
    are three types of looping commands in the bash shell that can be used in scripts.


    The first is the `for` command, which lets you iterate through a list of values
    in the command line, contained in a variable, or obtained through file globbing
    (used for file extraction.).


    The second is the `while` command, offering a method of looping by using the command’s
    condition and ordinary commands. In this way, different variable conditions can
    be tested and, so long as a zero exit status is returned, the `while` loop will
    continue iterating through a set of specified commands.


    The third is the `until` command, offering a way of iterating through commands,
    but based on a command or condition that produces a non-zero exit status. Using
    this feature, you can set a condition that must be met before the end of the iteration.
    Loops can be paired up in shell scripts by producing different loop layers. The
    bash shell provides the `continue` and `break` commands that we use to change
    the normal loop flow process on multiple loop values.


    ## More Basic Shell Scripts


    Here are some more simple examples of bash shell scripts that you can try for
    yourself:


    ### The Hello World Program


    Most new programmers start learning their chosen language using the help world
    program. It is one of the most simple programs that does nothing more than prints
    a simple string to the standard output, reading "Hello World." In Linux, editors
    like `nano` or `vim` can be used to create the `hello-world.sh` file and then
    copy and paste the code below into it:


    ```bash

    #!/bin/bash


    echo "Hello World"

    ```

    Save the file and exit.


    This file needs to be made executable with the command below:


    ```bash

    chmod a+x hello-world.sh

    ```


    And then, you can run the file using either of these commands:


    ```bash

    bash hello-world.sh

    ./hello-world.sh

    ```


    The result is the string you passed to `echo` being printed on the screen.


    ### How to Print With echo


    The `echo` command will print information from bash and is not unlike the `printf`
    function in `C`. Indeed, they share many of the same options, including re-direction
    and escape sequences.


    Create a new file and call it `echo.sh`. Make the file executable using the directions
    in the first example:


    ```bash

    #!/bin/bash


    echo "Printing text"


    echo -n "Print text without newline"


    echo -e "\nRemoving \t special \t characters\n"

    ```


    Run this script to see what it will do. There are two options in the script: `-n`
    is used for newline, and `-e` tells `echo` that you have passed a string containing
    some special characters and it needs extra functionality.


    ### How to Use Comments


    Comments are one of the most useful parts of any script and are required for higher-quality
    codes. They tell the coder and others reading the code what it does but should
    not be long and rambling – keep them short and to the point. Common practice has
    comments inside any code that contains critical logic. The `#` symbol is used
    to comment a line, as you can see in the example below:


    ```bash

    #!/bin/bash


    # Add two values ((sum=25+45))


    #Print result echo $sum

    ```


    The script will give us a result of 70. Have a look at how comments are used before
    each line, except for the first one. The first line is a shebang, and it tells
    the system the interpreter it should use to run the script.


    ### How to Use Multi-Line Comments


    Some coders document their scripts using multi-line comments, and you can see
    how this is done below:


    ```bash

    #!/bin/bash


    : ''

    This script will calculate

    the square of 5.  ''


    ((area=5*5)) echo $area

    ```


    Multi-line comments do not use the `#`; instead, they are enclosed in the `''`
    and `''` characters.


    ### How to Use While Loops


    The `while` loop is used when you want to run an instruction several times. Have
    a look at the script below to see how this works:


    ```bash

    #!/bin/bash i=0


    while [ $i -le 2 ] do


    echo Number: $i ((i++))


    done

    ```


    The `while` loop takes the form you can see below:


    ```bash

    while [ condition ] do


    commands 1 commands n done

    ```


    You must include the spaces surrounding the brackets – this is not optional; it
    is mandatory. Missing it out will result in errors.


    ### How to Use the For Loop


    Another popular and much user construct is the `for` loop. This is used for efficient
    iteration over a set of code, and you can see a simple example here:


    ```bash

    #!/bin/bash


    for (( counter=1; counter<=10; counter++ )) do


    echo -n "$counter " done


    printf "\n"

    ```


    Create a file and name it `for.sh`, save this, and make it executable. Then run
    it, you should see the numbers from 1 to 10.


    ### How to Receive User Input


    Implementing user interaction in bash scripts is critical and requires that you
    get user input. The example below shows how:


    ```bash

    #!/bin/bash


    echo -n "Enter anything:" read anything


    echo "You Entered: $anything"

    ```


    ### How to Use the If Statement


    The `if` statement is the most common of the conditional constructs using shell
    scripting, and they take this format:


    ```bash

    if CONDITION

    then STATEMENTS

    fi

    ```


    The statements will be executed if the `CONDITION` is true. The `fi` marks the
    end of the statement, and you can see how all works in the example below:


    ```bash

    #!/bin/bash

    echo -n "Enter a number: " read num


    if [[ $num -gt 10 ]] then


    echo "Number is greater than 10"

    ```


    You will only get an output if the given input is more than 10. The `-gt` option
    indicates "greater than" while `-lt`, if used, will indicate "less than." `-le`
    is for "less equal," and `-ge` is for "greater equal." You must include the `[]`
    – they are not optional.


    How to Get More Control Using If Else


    You can get more control over the logic in the script by combining an `else` and
    `if` construct. Have a look at the example:


    ```bash

    #!/bin/bash


    read n


    if [ $n -lt 10 ]; then


    echo "It is a one-digit number." else


    echo "It is a two-digit number." fi

    ```


    The `else` section must go after the action bit of the `if` statement before `fi`.


