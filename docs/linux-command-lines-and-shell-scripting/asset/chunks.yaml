    # 第 8 章 Linux Shell 脚本


    ![](img/image00304.jpeg)


    很多人喜欢使用命令行工具来解决计算机问题，但它们并不能让你成为 Linux 世界的大师。shell 让你成为 Linux 的大师，从而使你无所不能。了解 shell
    的工作原理以及如何在 Linux shell 中编写不同类型的脚本至关重要。通过少量的练习，你可以独立完成很多事情。


    简单来说，“shell 脚本”（shell script）就是一个内部包含命令列表的文件。如果你在命令行中编写命令，shell 就会读取该文件并执行你想让它执行的操作。shell
    的独特之处在于它既是一个命令行界面系统，又是一个脚本解释器，这使得它脱颖而出。在命令行中可以做的很多事情在 shell 脚本中也可以完成。Linux 的 用户经常使用
    shell 脚本来完成许多你在命令行中可以做的相同操作。


    我们现在已经涵盖了 shell 脚本的大部分功能。我们专注于那些在命令行中使用频繁的特性。当我们编写程序时，可以使用 shell 为我们执行的很多功能。


    ## 编写 Shell 脚本


    如果你想用文本编辑器编写 shell 脚本，你需要先获取一个。shell 脚本仅仅是文本文件。最好的文本编辑器会提供语法高亮，让你能够看到脚本不同部分的颜色编码视图。如果你想写
    shell 脚本，可以使用 `kate` 或 `vim` 来编写。如果你尝试像运行程序一样运行旧的文本文件，系统对此将并不高兴。这一切都是有原因的。你需要设置脚本文件的权限以便它可以运行。由于
    shell 会查找并运行这些文件，所以你应该将脚本放在一个容易找到的地方。


    ## Linux Shell 脚本的格式


    现在我将进入编写阶段，向你展示如何编写 shell 脚本。脚本的语言非常简单。脚本如下：


    ```bash

    [gha@localhost ~]$ echo ''I am learning Linux'' I am learning Linux

    ```


    这就是 shell 脚本。现在我将在同一个脚本中添加注释。


    ```bash

    [gha@localhost ~]$ echo ''I am learning Linux'' # 我在代码中添加了注释。


    I am learning Linux

    ```


    现在你必须让脚本变为可执行状态。如如下所示：


    ```bash

    [gha@localhost ~]$ ls -1 Linux_learning

    [gha@localhost ~]$ chmod 755 Linux_learning

    ```


    文本 `Linux_learning` 是我保存脚本的文件名。`chmod` 命令用于在 Linux 中使脚本变为可执行。


    ## 显示文本


    大多数 shell 命令倾向于产生特定的输出，这些输出会显示在你运行脚本的控制台显示器上。你可能需要添加文本消息，以帮助脚本用户知道脚本内部将发生什么。你可以通过使用我在上一节中提到过的
    `echo` 命令来实现。`echo` 命令显示简单的文本字符串。使用 `echo` 命令编写脚本有不同的技术，我将探索所有的技术。


    ```bash

    [gha@localhost ~]$ echo I am learning Linux shell scripting I am learning Linux
    shell scripting

    ```


    最显著的一点是，你不需要使用引号来包裹字符串文本，就像其他编程语言那样。然而，有时必须使用引号。你需要使用单引号或双引号来显示文本字符串。


    ```bash

    [gha@localhost ~]$ echo ‘I am learning Linux shell scripting.’ I am learning Linux
    shell scripting

    ```


    在下一个示例中，使用引号将是不可避免。


    ```bash

    [gha@localhost ~]$ echo ''Adam says, "I am learning Linux shell scripting."''


    Adam says, “I am learning Linux shell scripting."

    ```


    你可以看到，当你必须添加以直接引语形式存在的文本时，你必须给文本加上引号。


    ## if-then 语句


    许多 Linux shell 脚本程序在脚本的不同命令之间需要一些逻辑流控制，这意味着 shell 倾向于根据问题的命令来运行不同的命令。由于它还可以运行其他命令，让脚本根据其他命令的结果在命令之间来回执行，因此它也具备这种能力。我们称之为为结构化命令。也称为“条件语句”（conditionals），这是一种语句。


    如果程序具有结构化命令，你就可以改变程序工作的方式。很多命令会被执行，但在某些情况下，很多命令并不会执行。在其他编程语言中，`if` 语句后面的对象是系统检查其为真还是为假的方程，那个对象被称为对象。`bash`
    shell 的工作原理并不是这样。相反，它执行 `if` 行上写的内容。如果此命令的退出状态为零，那么下一部分中的命令更有可能执行。如果此命令没有按预期工作，其他命令将被暂停。`bash`
    shell 然后将移动到脚本中的下一个命令，即使该命令没有执行。


    ```bash

    $ cat testing5 #!/bin/bash


    # 我现在正在测试 bash shell 的 if 语句


    if date then


    echo "The structured command has completely worked" fi


    $bashbash -f main.sh


    Tue Jan 26 05:02:54 UTC 2021

    The structured command has completely worked

    ```


    脚本在 `if` 行上使用了 `date` 命令。如果该命令执行成功，`echo` 语句将显示文本字符串。当你从命令行运行脚本时，你将得到与上面相同的结果。shell
    将执行 `date` 命令。由于退出状态为零，它还将执行在 `then` 部分列出的 `echo` 语句。在下一个示例中，我将测试一个错误的命令看看它是如何工作的。


    ```bash

    $ cat testing2 #!/bin/bash


    # 是时候对错误命令进行测试了 if hgjdksll


    then


    echo "it is not going to work" fi


    echo "I cannot run the command because you’re out of the if statement."


    $bash -f main.sh


    I cannot run the command because you’re out of the if statement

    ```


    由于上面的命令是错误的，它产生了一个非零的退出状态。`bash` shell 将跳过 `then` 部分的 `echo` 语句。


    ## if-then-else 语句


    `if-then` 语句提供了一个判断命令是否成功的选项。如果返回非零退出状态码，`bash` shell 将执行下一个脚本命令。在这种情况下，最好的办法是有另一组我们可以执行的命令，这就是
    `if-then-else` 语句派上用场的地方。


    '
- fmt: '

    If the `if`-statement command produces the exit status zero code, the commands
    in the `then` part of the statement are executed. If a non- zero exit status code
    is returned, the commands in the `else` part of the statement are executed.


    ```bash

    $ cat testing4 #!/bin/bash


    # I am now going to test the else section testinguser=thisisabadtest


    if grep $testinguser /etc/passwd then


    echo The files for user $testinguser are:


    ls -a /home/$testinguser/.b* else


    echo "The user name $testinguser cannot be found on the system" fi

    ```


    ```bash

    $ ./test4


    The user name thisisabadtest cannot be found on the system


    $


    $bash -f main.sh


    The user name thisisabadtest cannot be found on the system

    ```


    On occasion, you may need to check things in the script code. Rather than separate
    `if-then` statements, a different version of the `else` statement can be used.
    This is called the `elif`, and this continues the `else` statement with a subsequent
    `if-then` statement. It provides a different evaluation command, which is much
    like the first `if` statement. If a zero exit status code is returned, the commands
    in the second `then` statement are executed by the `bash` shell.


    ## Advanced if-then Features


    There is a double parentheses command in Linux that allows you to incorporate
    some advanced mathematical formulas when you are making comparisons. The `test`
    command permits simple operations in comparison. However, the double parentheses
    command offers more mathematical symbols that a number of programmers from different
    other languages are using.


    The expression term may be any kind of mathematical assignment or expression.
    Besides the standard operators that the `test` command uses, additional operators
    are available for use in the double parentheses command.


    You also can use the double bracket command for advanced features to do string
    comparisons. The double bracket command format uses the standard string comparison
    that we have used in the `test` command. Where it differs is by the option of
    pattern matching. You will be able to define a regular expression that you need
    to match against the string value.


    ```bash

    $ cat testing2 #!/bin/bash


    # I will now be using pattern matching if [[ $MyUSER == r* ]]


    then


    echo "Hello $MyUSER I know you from the days when you used to work in a restaurant
    in Europe."


    else


    echo "Sorry, I have never seen you before. I don’t know you." fi

    ```


    ```bash

    $bash -f main.sh


    Sorry, I have never seen you before. I don’t know you.

    ```


    More often, you may find yourself attempting to evaluate the value of some variables
    in a bid to find out a specific value inside a set of possible values. In this
    typical scenario, you may end up writing a lengthy `if-then-else` statement such
    as the following:


    ```bash

    $ cat testing555 #!/bin/bash


    # I am now looking for some possible values if [ $MyUSER = "rich" ]


    then


    echo "Welcome $MyUSER to the heavens on the earth."


    echo "Please enjoy your visit in plush green fields and lush green mountains.
    I wonder if you want to take a bath in the river beneath the valley."


    elif [ $MyUSER = Jason ] then


    echo "Welcome $MyUSER to the lakes of Madora."


    echo "Please enjoy your stay in the shining waters of Madora lakes. I hope you
    enjoy the resorts, the sun, the breeze, the food, and the drinks."


    elif [ $MyUSER = Simra ] then


    echo "Welcome $MyUSER to the lakes of Madora."


    echo "Please enjoy your stay in the shining waters of Madora lakes. I hope you
    enjoy the resorts, the sun, the breeze, the food, and the drinks."


    elif [ $MyUSER = Linda ] then


    echo "Don’t forget to logout when you’re done" else


    echo "Sorry, you’re not allowed here" fi

    ```


    ## The for Command


    Iterations through a series of commands is normal practice when it comes to programming.
    Many a time, you may have to repeat different commands. Often you need to repeat
    a bunch of commands until the program meets a specified condition like processing
    files inside a directory or in all the lines inside a text file.


    The `bash` shell offers the `for` command to develop a loop that iterates through
    a set of values. Each iteration tends to perform a set of commands by using a
    single value inside the series. One of the most basic uses of the `for` command
    is iteration through a list of values that are defined inside the `for` command
    itself.


    ```bash

    v=$ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    for mytest in Alabama Texas Alaska Virginia Arizona Ohio Arkansas South Dakota
    California North Dakota Colorado New Jersey Florida Michigan Georgia


    do


    echo I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $mytest


    done

    ```


    ```bash

    $bash -f main.sh


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Alabama


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Texas


    And so on until the last line:


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Georgia

    ```


    Each time the `for` command iterates through the list of objects, it assigns the
    `mytest` variable to the next item in the list. The `$mytest` variable is used
    like other script variables in the `for` command statements. After the final iteration,
    the `$test` variable remains valid throughout the shell script''s remaining part.
    It will retain the final iteration value unless you change it.


    ```bash

    v=$ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    for mytest in Alabama Texas Alaska Virginia Arizona Ohio Arkansas South Dakota
    California North Dakota Colorado New Jersey Florida Michigan Georgia


    do


    echo I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $mytest


    done


    echo "The last US state I traveled to was $mytest" mytest=Connecticut


    echo "Now I am going to visit $mytest"

    ```


    ```bash

    $bash -f main.sh


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Alabama


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Texas


    And so on, until the last line:


    I am planning to continue my travel circle across the United States in the summer.
    The next state I will visit is Georgia


    The last US state I traveled to was Georgia Now I am going to visit Connecticut

    ```


    You can see that the `$mytest` variable retained its original value and permitted
    us to change it outside the `for` loop. Let’s see another `for` loop example:


    ```bash

    v=$ cat testing111 #!/bin/bash


    # This is the basic for command in Linux


    for mytest in pumpkin potato tomato spinach ginger garlic cauliflower cabbage
    pepper beet ladyfinger broccoli


    do


    echo I am planning to make a shift to the cooking schedule as the summer sets
    in. I have bought lots of vegetables. However, today I plan to cook $mytest.


    done


    echo "The last vegetable I cooked was $mytest" mytest=onion


    echo "Now I am going to cook $mytest"

    ```


    ```bash

    $bash -f main.sh


    I am planning to make a shift to the cooking schedule as the summer sets in. I
    have bought lots of vegetables. However, today I plan to cook pumpkin.


    I am planning to make a shift to the cooking schedule as the summer sets in. I
    have bought lots of vegetables. However, today I plan to cook potato.


    This continues through each of the vegetabes, ending with:


    I am planning to make a shift to the cooking schedule as the summer sets in. I
    have bought lots of vegetables. However, today I plan to cook broccoli.


    The last vegetable I cooked was broccoli Now I am going to cook onion

    ```


    When you are dealing with the `for` command, the biggest problem you may encounter
    is using multi-word values. The `for` loop assumes that each value ought to be
    separated by a space. If you have data values to contain spaces, you may run into
    another problem. You may see that in the example of US states. The `bash` editor
    considered South and Dakota as two separate values.

