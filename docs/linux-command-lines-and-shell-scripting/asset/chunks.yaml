    # Keyboard Tricks


    Unix is an operating system for people who love to type. The command line does
    not allow a mouse to operate. Linux commands can be exhaustive, therefore, you
    should learn a bunch of keyboard tricks.


    ### Text Modification


    The following list shows how you can modify text in the Linux command line. The
    terms killing and yanking refer to cutting and pasting, respectively.


    - The keyboard trick `CTRL-D` will help you delete the character that is at the
    present position of the cursor.

    - The keyboard trick `CTRL-T` will help you transpose the character at the present
    location of the location with the one that is preceding it.

    - The keyboard trick `Alt-U` will help you convert into uppercase the characters
    from the cursor''s present position to the ending point of the word.

    - The keyboard trick `Alt-L` will help you convert into lowercase the characters
    from the cursor''s present position to the ending point of the word.

    - The keyboard trick `Alt-T` will help you transpose the words at the cursor''s
    present position with the preceding one.

    - The keyboard trick `CTRL-K` will help you kill text from the cursor''s present
    position to the ending point of a line.

    - The keyboard trick `CTRL-U` will help you kill text from the cursor''s present
    position to the starting point of a line.

    - The keyboard trick `ALT-D` will help you kill text from the cursor''s present
    position to the end of a current word.

    - The keyboard trick `ALT-Backspace` will help you kill text from the cursor''s
    present position to the starting point of the current word. If the cursor is presently
    at the start of a word, it will also kill the previous word.

    - The keyboard trick `CTRL-Y` will help you yank text from the kill-ring and paste
    it at the cursor''s present position.


    # Completion Commands


    Another way by which the shell will help you is through completion. This occurs
    when you hit the Tab key while you are typing the command. When you are halfway
    through a command, you can enter a tab to complete the command. The important
    thing to remember is that you should not hit the Enter key.


    ### Completion commands


    - The keyboard trick `Alt-$` will help you display the list of all possible completions.
    You may also do this by pressing the Tab key twice. This is much easier to do.

    - The keyboard trick `Alt-*` will help you insert the possible completions. This
    is highly useful when you intend to use more than one match.


    # Searching History


    Bash maintains a history of the commands you type in it. The list of commands
    is kept in the home directory in a file named `.bash_history`. The history facility
    is highly useful for cutting down on the amount of typing that you need to do
    especially when you combine it with command-line editing. Here is the syntax of
    the `history` command.


    ```

    [gha@localhost ~]$ history | less

    ```

    Bash, by default, stores the last 500 commands that you have entered. Suppose
    you want to find the commands that you used to list `/usr/bin`. Here is the way
    to do that.


    ```

    [gha@localhost ~]$ history | grep /usr/bin

    ```

    There is a list of keystrokes that you may use when you are navigating through
    the `history` command.


    - You can use the keyboard shortcut `CTRL-P` to move to the latest history entry.
    This performs the same action as the up arrow.

    - You can use the keyboard shortcut `CTRL-N` to move to the next history entry.
    This performs the same action as the down arrow.

    - You can use the keyboard shortcut `ALT->` to move to the bottom of the list
    of history that is the current command line.

    - You can use the keyboard shortcut `ALT-<` to move to the starting point of the
    list of history.

    - You can use the keyboard shortcut `CTRL-R` to reverse the incremental search.
    This option incrementally searches from the current command line up the list of
    history.

    - You can use the keyboard shortcut `CTRL-O` to execute the present item in the
    list of history and then move on to the next one. This is handy if you are looking
    forward to re-execute a sequence of commands in the list.

    - You can use the keyboard shortcut `ALT-N` to forward the search. This is non-incremental.

    - You can use the keyboard shortcut `ALT-P` to reverse the search. This also is
    non-incremental. Coupled with this keyboard shortcut, you can type the search
    string and then press ENTER before you have performed the search.


    ### History Expansion


    The shell offers a special type of expansion for different items in the history
    list by using the `!` character. We have already seen how a number may follow
    the exclamation point to insert a particular entry from the list of history. There
    are many other expansion features. History expansion mechanism has many available
    elements, but this subject is too arcane.


    - You can type the sequence `!!` to repeat the latest command. However, it may
    be easier to press the up arrow and then hit ENTER.

    - You can type the sequence `!?string` to repeat the latest history list item
    that contains a string.

    - You can type the sequence `!string` to repeat the latest history list item that
    starts with a string.

    - You can type the sequence `!number` to repeat the latest history list item.


