    You are not root\" fi\nexit 0\n```\n\nThe output will depend entirely on which\
    \ user is running the script. Root users are matched by the `$UID`.\n\n## How\
    \ to Remove Duplicate Lines From a File\n\nIt can take a lot of time to process\
    \ files and it can reduce admin productivity severely. One of the most time-consuming\
    \ tasks is trying to find duplicate lines in your files but a short, simple shell\
    \ script can save the day:\n\n```bash\n#! //sh\necho -n \"Enter the Filename->\
    \ \" read filename\nif [ -f \"$filename\" ]; then\nsort $filename | uniq | tee\
    \ sorted.txt else\necho \"No $filename in $pwd...try again\" fi\nexit 0\n```\n\
    \nThis script will look through every line of the specified file and will remove\
    \ any duplicate. Those lines are then put into a new file, leaving the original\
    \ file as it is.\n\n## How to do System Maintenance\n\nIf you want to make life\
