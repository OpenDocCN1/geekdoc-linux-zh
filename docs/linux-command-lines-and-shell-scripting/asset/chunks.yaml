    ```

    if [[ ( $n -eq 15 || $n -eq 45 ) ]] then


    echo "You won" else


    echo "You lost!" fi

    ```


    这是一个简单的示例，展示了 Linux Shell 脚本中逻辑或（OR）运算符的工作。只有当输入数字 15 或 45 时，用户会被宣布为获胜。


    我们使用 `||` 符号来表示逻辑或运算符。


    ## 如何使用 Elif


    `elif` 语句意味着 "else-if"否则如果），用于实现链式逻辑。来看这个示例看看它是如何工作的：


    ```bash

    #!/bin/bash


    echo -n "Enter a number: " read num


    if [[ $num -gt 10 ]] then


    echo "Number is greater than 10." elif [[ $num -eq 10 ]]

    then


    echo "Number is equal to 10." else


    echo "Number is less than 10." fi

    ```


    这是一个自言其懂的示例，因此我不会过多介绍细节。你可以尝试更改变量名或其值，看看它们是如何运行的。


    ## 如何使用 Switch 结构


    这是 Linux 脚本中另一个非常强大的结构，当你需要使用嵌套条件但不想编写复杂的 if-else-elif 链时，可以使用它。这里是它的工作原理示例。


    ```bash

    #!/bin/bash


    echo -n "Enter a number: " read num


    case $num in 100)


    echo "Hundred!!" ;; 200)


    echo "Double Hundred!!" ;;


    *)


    echo "Neither 100 nor 200" ;; esac

    ```


    条件位于两个关键字之间——`case` 和 `esac`。我们使用 `*` 来匹配所有不为 100 或 200 的输入。


    ## 如何使用命令行参数


    有几个原因导致你可能想直接从命令行 shell 中获取参数，接下来的示例演示了你如何使用 bash shell 做到这一点：


    ```bash

    #!/bin/bash


    echo "Total arguments : $#" echo "First Argument = $1" echo "Second Argument =
    $2"

    ```


    在脚本名后加上两个额外的参数运行脚本。脚本保存为 `test.sh`，你可以在这里看到调用过程：


    `$ ./test.sh Hey Howdy`


    `$1` 访问第一个参数而 `$2` 访问第二个，以此此类推。我们使用 `$#` 来获取总参数数。


    ## 如何使用名称获取参数


    下一个示例演示了你如何使用名称来获取命令行参数：


    ```bash

    #!/bin/bash

    for arg in "$@" do


    index=$(echo $arg | cut -f1 -d=) val=$(echo $arg | cut -f2 -d=) case $index in


    X) x=$val;;


    Y) y=$val;;


    *) esac done


    ((result=x+y))


    echo "X+Y=$result"

    ```


    将此脚本保存为 `test.sh` 并这样调用它：


    `$ ./test.sh X=44 Y=100`


    你应该看到返回 `X+Y=144`。我们将参数存储在 `''@''` 中，然后使用 Linux 中的 `cut` 命令获取它们。


    ## 如何拼接字符串


    许多现代 shell 脚本使用字符串处理，最常见的方法之一是字符串拼接。Bash 让这变得简单且精确，下面的示例向你展示了它是如何工作的：


    ```bash

    #!/bin/bash

    string1="Ubuntu" string2="Pit" string=$string1$string2


    echo "$string is a fantastic Linux resource for beginners."

    ```


    运行此程序应该给你输出 "UbuntuPit is a great Linux Resource for Beginners.:"


    ## 如何切片字符串


    大多数编程语言都提供了现成的函数来帮助你切分字符串的一部分。Bash 没有，但下面的示例展示了如何使用参数扩展来实现：


    ```bash

    #!/bin/bash

    Str="Learn the Bash Commands from UbuntuPit" subStr=${Str:0:20}


    echo $subStr

    ```


    运行此脚本应该得到输出 "Learn the Bash Commands"。参数扩展的格式为 `${VAR_NAME:S:L}`，其中 `S` 表示切片的起始位置，`L`
    表示切片应该有多长。


    ## 如何使用 Cut 提取子字符串


    Linux 有一个名为 `cut` 的命令，你可以在脚本中使用它从字符串中切出某部分——这就是子字符串，下一个示例演示了它是如何工作的：


    ```bash

    #!/bin/bash

    Str="Learn the Bash Commands from UbuntuPit" #subStr=${Str:0:20}


    subStr=$(echo $Str| cut -d '' '' -f 1-3) echo $subStr

    ```


    ## 如何相加两个值


    在 Linux shell 脚本中算术运算很容易。你可以从下面的示例看到如何将两个数字作为输入并相加：


    ```bash

    #!/bin/bash

    echo -n "Enter the first number:" read x


    echo -n "Enter the second number:" read y


    (( sum=x+y ))


    echo "The result of the addition=$sum"

    ```


    你可以从此看出，在 bash shell 中加两个数字是非常简单的。


    ## 如何相加多个值


    如果你想在脚本中获取多个用户输入并将它们相加，你会使用循环。下一个示例演示了如何实现：


    ```bash

    #!/bin/bash sum=0


    for (( counter=1; counter<5; counter++ )) do


    echo -n "Enter number $counter: " read n


    (( sum=sum+n ))


    done


    echo "The total sum is $sum"

    ```


