    - The `cp` command option `-a` or `--archive` is used to copy the directories
    and files and their entire attributes, including permissions and ownerships. Usually,
    copies take on average default attributes of a user who is performing the copy
    action.

    - The `cp` command option `-u` or `--update` is used when you are copying from
    one directory to another, and you are copying files that do not exist or newer
    to the files in the destination directory.

    - The `cp` command option `-v` or `--verbose` is used to display the informative
    messages as you perform the copy.

    - The `cp` command option `-i` or `--interactive` is used before overwriting existing
    files, which prompts the user for confirmation. If you have not specified the
    option, the `cp` command will overwrite the existing files, which is not good
    for your document records.

    - The `cp` command option `-r` or `--recursive` is used to copy the contents and
    files recursively. This particular option is needed when you are copying directories.


    ### Examples of `cp` command


    - The Linux command `cp item1 item2` will copy the files of `item1` to the files
    of `item2`. If `item2` exists, it will be overwritten with the contents of `item1`.
    If it does not exis, the system will create it.

    - The Linux command `-i item1 item2` will copy the files of `item1` to the files
    of `item2`. However, the only exception is that if `item2` exists, the user will
    be prompted before the file is overwritten.

    - The Linux command `item1 item2 dir1` will copy contents of `item1` and `item2`
    into `dir1`. The directory `dir1` must exist before you execute this command.

    - The Linux command `cp dir1* dir2` uses a wildcard. It will copy all the files
    of `dir1` into `dir2`. The condition is that `dir2` must exist before the execution
    of the command.

    - The Linux command `-r dir1 dir2` will copy the directory `dir1` to the directory
    `dir2`. If `dir2` is non-existent, it will be created and will contain the same
    contents as the directory `dir1` will.


    ### The `mv` command


    The `mv` Linux command performs movement and renaming of files based on how a
    user uses it. The original filename does not exist after you have executed the
    command. The `mv` command is used in the same way as the `cp` command.


    ```

    mv file1 file2

    ```


    Just like the `cp` command, the `mv` command comes with different options that
    are given as under:

    - The `mv` command option `-u` or `--update` is used when you are moving from
    one directory to another, and you are moving files that do not exist or newer
    to the files in the destination directory.

    - The `mv` command option `-v` or `--verbose` is used to display informative messages
    as you perform the movement.

    - The `mv` command option `-i` or `--interactive` is used before overwriting existing
    files, which prompt the user for confirmation. If you have not specified the option,
    the `mv` command will overwrite the existing files, which is not good for your
    document records.


    ### Examples for `mv` command


    - the Linux command `mv item1 item2` will copy the files of `item1` to the files
    of `item2`. If `item2` exists, it will be overwritten with the contents of `item1`.
    If it does not exist, the system will create it. The file `item1` will cease to
    exist in either case.

    - the Linux command `mv -i item1 item2` will move the files of `item1` to the
    files of `item2`. However, the only exception is that if `item2` exists, the user
    will be prompted before the file is overwritten.

    - the Linux command `mv item1 item2 dir1` will move contents of `item1` and `item2`
    into `dir1`. The directory `dir1` must exist before you execute this command.

    - the Linux command `mv dir1* dir2` uses a wildcard. It will move all the files
    of `dir1` into `dir2`. The condition is that `dir2` must exist before the execution
    of the command.

    - the Linux command `mv dir1 dir2` will move the directory `dir1` to the directory
    `dir2`. If `dir2` is non-existent, you will have to create it and move the contents
    of `dir1` into `dir2`.


    ### The `rm` command


    The `rm` command is used for removing or deleting directories and files like the
    following:


    ```

    rm file...

    ```


    In this command `file` is the name of one or more than one directory and files.
    Using this command can be highly treacherous. Once you delete something with the
    `rm` command, you will never get it back. Linux assumes that you have removed
    a file on purpose. It does not give it back to you. Therefore, you should use
    it carefully. Let us say that you want to delete the HTML files in some directory.


    So when you are using wildcards with the `rm` command, you should test the wildcard
    with the `ls` command to see the contents of the file you are going to remove
    from the system. You can use the arrow key to recall the command and replace it
    with `rm` then.


    - The `rm` command option `-r` or `--recursive` is used to delete directories
    recursively. This means that if the directory you are deleting has subdirectories,
    you can delete them as well. If you want to delete a directory, you should specify
    this option.

    - The `rm` command option `-f` or `--force` is used to ignore the non-existent
    files. It does not prompt. It tends to override the `-interactive` option.

    - The `rm` command option `-v` or `--verbose` is used to display the informative
    messages as you perform the deletion.

    - The `rm` command option `-i` or `--interactive` is used before deleting the
    existing files, which prompts the user for confirmation. If you have not specified
    the option, the `rm` command will silently delete the existing files, which is
    not good for your document records.


    ### Examples of `rm` command


    - The Linux command `rm item1` will silently delete files of `item1`.

    - The Linux command `rm -i item1` will delete the files of `item1`. However, the
    only exception is that the user will be prompted before the file is deleted.

    - The Linux command `rm item1 dir1` will delete the contents of `item1` and `dir1`.
    The directory `dir1` must exist before you execute this command.

    - The Linux command `rm -rf item1 dir1` works the same as above, with the exception
    that if both `item1` and `dir1` do not exist, the `rm` command will go on silently.


