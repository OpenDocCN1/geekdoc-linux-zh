    初学者 Linux 命令行、管理与 Shell 脚本

    (2022 全员速成)

    Rocky Johnson


    ## 目录

    - 引言

    - 第 1 章 什么是 Linux？

    - 第 2 章 使用 Linux 命令操作

    - 第 3 章 文件与目录命令

    - 第 4 章 命令实战操作

    - 第 5 章 重定向命令与 Linux 命令快捷技巧

    - 第 6 章 进程命令

    - 第 7 章 使用 Linux 编辑器

    - 第 8 章 Linux Shell 脚本

    - 第 9 章 函数的 Linux Shell 脚本

    - 结语


    # Linux 命令与 Shell 脚本


    ## 引言


    本关于 Linux 命令行和 Shell 脚本的书将向你展示如何使用键盘输入命令并编写 Shell 脚本来制作程序。通常情况下，Linux 比 Windows
    和 Mac 操作系统更困难，但它三者中最安全的。当你学习 Linux 时，你可以编写自己的软件并用它来处理日常事务。如果你愿意，你可以让计算机按照你设想的方式运行。


    你可以从 Linux 中获得很多乐趣，但它并不容易使用。Linux 没有像 Windows 那样的图形化界面。相反，它有一个命令行。如果你不知道什么是命令行，应该在
    Windows 中查找 `Dos` 或 `Command Prompt` 以了解更多信息。它是一个黑屏，你必须在上面编写命令并完成日常差工作。


    这本书分为两部分：第一部分介绍命令，第二部分介绍 Shell 脚本。如果你不知道如何使用 Linux 命令和 Shell 脚本，你就无法很好地运行系统。我在书中填满了你将最常用、最需要的命令。人们在运行程序后可以在命令行中看到一些结果。我也将其中一些结果列在了下面的列表中。


    Shell 脚本部分可能会很难。如果你有编程背景，阅读这部分会很有趣。书的后面有一章关于 Linux 编辑器的章节，所以不用担心那个。你可以编写自己的脚本，也可以复制我的脚本并粘贴到编辑器中，以便学习如何编写它们。这样，你可以比较每个脚本的结果。作为额外奖励，我还包含了许多展示如何使用命令的简单脚本示例。


    ## 第 1 章 什么是 Linux？


    ![](img/image00294.jpeg)


    作为 Linux 的学生，你首先学习的是 Linux 是如何诞生的。这将帮助你理解这个操作系统是如何工作的。在计算机的硬件和软件之间，Linux 是一层被称为“Linux”的软件。它允许你在计算机上进行高效工作并编写自己的程序。简单来说，操作系统是计算机软件和硬件之间的桥梁。操作系统允许你使用存储设备（如硬盘、固态硬盘和
    USB 闪盘）来存储数据。它确保数据从一个地方移动到另一个地方。


    例如，它确保数据从操作系统传输到你办公室或家的打印机。如果你在计算机上安装了 Microsoft Windows 操作系统，Windows 操作系统就会运行硬件。它负责鼠标、键盘、打印机、扫描仪等设备。根据工作需要安装
    Microsoft Office、Adobe 阅读器、PDF 转换器和其他软件。如果你希望计算机上拥有这每种程序，你必须为此付费。


    在控制硬件方面，Linux 与 Windows 是一样的。不同之处在于，它充当了软件指令代码与运行它的物理设备之间的桥梁。主要的区别在于你在 Linux 操作系统中使用的软件。这是主要的不同点。如果你有一台
    Mac，软件将与在 Windows 上运行的软件不同。你无法在 Linux 上运行 Microsoft Office 或 Adobe Photoshop。使用
    Linux，你可以运行不同的服务器，如 虚拟化服务器、Apache 服务器、数据库服务器等。这些服务器都运行在 Linux 上。


    尽管如此，Linux 许多许多为个人电脑制作的不同发行版。这些发行版与 macOS 和 Windows 非常相似。它们使用相同类型的程序，如文字处理器、图像编辑器和游戏来工作。这些
    Linux 发行版看起来更面向那些想在家使用免费计算机系统的人。


    起初，Linux 并不是作为一个操作系统或 Windows 操作系统的竞争者出现的。起初，Linux 只是由 Linus Torvalds 制作的一个内核，由他创建了它。如果你当时在读高中，Linus
    是赫尔辛基大学的一名学生。内核仍然可以使用系统中，但它不像以前那么重要了。它是这样开始的：第一次被使用是通过 GNU 操作系统。你可以说，没有内核，GNU
    系统将无法运行。


    内核是 Linux 的重要部分。内核是操作系统中最重要的部分，因为它负责应用程序和硬件之间所有的连接。在目前的市场中，有两种内核：Unix 类内核和 Windows
    内核。


    ### Linux 操作系统的诞生


    在 1991 年到 1994 年之间，Linus 更进一步了。他制作了 Linux 操作系统。他将 GNU 操作系统与 Linux 内核结合在一起。最初，他想制作一个免费的操作系统。相反，他想做一个可以满足他编程需求的东西。起初，很多人认为
    Linux 是他最喜欢做的事，像是一份兼职。使用 Linux 的人不用 `UNIX`。


    整个 Linux 都是由 Linus 从零开始制作。为了制作一个人们可以使用开源操作系统，他想出了“Linux”这个名字。在此之前，UNIX 不是开源的。Unix
    必须付费。同样，微软的操作系统也要收费。


    因此，Linux 提出了一个免费使用的操作系统的想法。在麻省理工学院（MIT）朋友的帮助下，他想出了这个想法（MIT）。除了构建开源操作系统外，他们还需要一个易于使用且高效的操作系统，以便他们进行更改以满足他们的编程需求。这就是他们做的。


    ### Linux 的发行版


    当 Linus 编写 Linux 操作系统时，他停止工作了一段时间进行休息。那时他公开了操作系统的源代码。这让每个人参与到系统的制造成为可能。科学家和电脑极客也在研究这个想法。他们根据认为最好的方式对其进行修改。


    教育机构和企业对这个新操作系统的想法感到兴奋，因为任何拥有源代码的人都可以在自己的计算机上安装并运行 Linux。这些是人们开始制作不同版本的 Linux
    操作系统系统的步骤。加州大学伯克利分校的学生尝试开始制作一个新版本。来自中国的人和从事不同工作的人也开始制作自己的版本以满足自己的需求。


    '
- fmt: '

    The public was able to see the source code, which made it easier to make distros
    or distributions. Distributions are different types of Linux that people have
    made over time. Linux has many different versions, and each of its many distributions
    gives it a different set of skills. When you have to choose which Linux distribution
    to use, you have to figure out what you want your computer to do with Linux first,
    then choose a distribution. Windows is a good analogy to show how I will explain
    it. When you install Microsoft Windows on your computer, each distribution is
    made to do things a certain way.


    People use `Trustix`, which is a type of Linux that people use. There are many
    people who say that Linux `Trustix` is the most secure Linux operating system
    on the market. It is just a brick. It will be impossible for anyone to get into
    Linux `Trustix` until you do something very stupid. People with viruses will not
    be able to get in. It is a safe and strong server. It''s also important to think
    about whether or not you really need a secure server before you get the source
    code and start installing it, so make sure.


    To get a computer that you could use for some work apps, you might need an `Ubuntu`
    Linux desktop version. If you want a computer that is very safe, you might need
    Linux `Trustix`. If you want something that comes with a lot of support, you might
    need to use a Linux distribution and a tech support center to help you. This way,
    you can get what you need. In this case, `Red Hat` Linux will be the best choice
    for your needs, Again, you need to figure out what you want your computer to do
    in order to choose the best Linux distribution for your computer system.


    Because Linux is free, you can change it as much as you want to.


    Now that you''ve learned about the history of Linux and its different distributions,
    it''s time to move on to the concept of open-source licensing, which makes Linux
    unique from other operating systems because it lets anyone use it. Licensing for
    Linux is open source. You may have heard of open-source software at some point
    in your life. It is software that is free to use. Because your software is made
    public, it doesn''t mean that it''s free for anyone to use. Because open-source
    software is free, if you treat all of it as if it were, you could lose your job
    and your company as well. This is illegal, so we need to talk about open-source
    software to clear the air.


    This is called open-source software. When programmers write the code for a piece
    of software, they give the code to you so that you can see how he or she wrote
    the program in the first place. It does not mean that the program is free to use,
    but it does say that it is. There are a lot of ways open-source vendors can be
    paid, and they all work in different ways.


    The first way they do this is by giving away their software for free. However,
    if you need help or training for the software, they will charge you a certain
    amount of money. For example, you can download the `MySQL` server for the Linux
    server to run it on. The same thing works for you. Even though you''ve learned
    all about the `MySQL` program''s different intricacies, there are still some things
    you may need to learn or get help with. So, you go to the software developer and
    ask for help or training with the software. People who write computer programs
    or do other things like that should be paid for what they did for you at this
    point.


    They also get paid through a non-commercial open-source license, which is how
    they get paid for their work. Most people get into trouble here. They charge you
    to use them.


    For home use, there''s no problem at all. Once you use it to connect to a business
    server, you own the right to use that software for business. The worst thing is
    that licensing fees could cost more than $8,000 at times. It can be very pricey
    in some cases, but it can also be very cheap. Because of this, it is important
    to think about how you might use the software for non-commercial, personal, or
    commercial use.


    They also get paid through a paid open-source license. A lot of you might be wondering
    how open-source software can be used even if the software itself costs money to
    use. An open-source program is one that costs money. If you can see the code of
    the program, it is open-source.


    This is the fourth way that these programmers make money. They charge recurring
    fees for the open-source software that they make money from. This is like most
    of the programs that are free to use. They will let you download and try out their
    software for free, so you can see how it works. They would also show you how the
    software works so that you could understand how it works. However, if you want
    to own the legal rights to the software, you''ll have to pay a fee each year or
    every month. Here, you don''t have to pay for a one-minute license fee that costs
    too much.


