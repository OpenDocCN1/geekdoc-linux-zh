    ## 函数的创建


    函数可以通过两种方式创建。第一种方式是写一个单词或短语并作为函数名。函数的名称属性是人们对函数的认知。名称不应该是保留字之一；它应该是唯一的与函数内容相关。当函数被调用时，命令将按照它们在函数中的编写顺序执行。


    第二种格式与其他编程语言创建函数的方式相同。


    ```bash

    cat test15567 #!/bin/bash


    function Myfunction1 {


    echo "You are looking at the example of a Linux shell function."


    }


    count=1


    while [ $count -le 10 ] do


    Myfunction1 count=$[ $ count + 1 ] done


    echo "You have reached the end of the loop."

    Myfunction1


    echo "This is the finishing point of your Linux shell script. Where do you want
    to go now?"


    $bash -f main.sh

    ```


