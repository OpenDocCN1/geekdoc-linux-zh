    ### while 命令


    `while` 命令是 `if-then` 语句和 Linux `for` 循环的结合。允许允许定义一个命令来测试条件，然后循环执行一组命令直到达到零退出状态。它会在每次迭代开始时分析测试命令。当达到非零退出状态时，`while`
    命令将停止执行该组命令。


    ```bash

    $ cat test10 #!/bin/bash


    # This is a while command test in Linux var15=20


    while [ $var15 -gt 0 ] do


    echo This is $var15 in the while loop. var15=$[ $var15 - 1 ]


    done


    $bash -f main.sh

    ```


