  raw: '#### How to Append to Files


    The next shell example shows you how to use bash scripts to append data to one
    of your filesystem files. This will add an extra line into the editors.txt file:


    #!/bin/bash


    echo "Before you append the file" cat editors.txt


    echo "6\. NotePad++" >> editors.txt echo "After you append the file" cat editors.txt


    By now, you should have noticed that standard terminal commands are being used
    from the bash scripts.


    #### How to Test For File Existence


    In the next example, we can see how to use bash programs to find out if a file
    exists:


    #!/bin/bash filename=$1


    if [ -f "$filename" ]; then echo "File exists"


    else


    echo "File does not exist" fi


    The argument is the filename and it is passed directly from the command-line.


    #### How to Send Mail from Shell Scripts


    Sending emails from a bash script is quite simple to do. In the example below,
    you can see one way to do this:


    #!/bin/bash


    recipient=" [admin@example.com"](mailto:admin@example.com) subject=" Greetings"


    message=" Welcome to UbuntuPit"


    `mail -s $subject $recipient <<< $message`


    This will send an email to the specified recipient with the specified subject
    line and message.


    #### How to Parse the Date and Time


    In the next script example, you can see how to use scripts to handle time and
    date. We use the data command to get the required information and the script will
    do the necessary parsing:


    #!/bin/bash year=`date +%Y` month=`date +%m` day=`date +%d` hour=`date +%H`


    minute=`date +%M` second=`date +%S` echo `date`


    echo "Current Date is: $day-$month-$year" echo "Current Time is: $hour:$minute:$second"


    Save and run the program to see how it all works and also run the date command
    form your own terminal.


    Run this program to see how it works. Also, try running the date command from
    your terminal.


    #### How to Use the Sleep Command


    You can use the sleep command to make your shell script pause in between each
    instruction. This can be useful for many things, including when you want to perform
    system-level jobs. In the next example, the sleep command can be seen working
    in a shell script:


    #!/bin/bash


    echo "How long should you wait?" read time


    sleep $time


    echo "Waited for $time seconds!"


    The program stops the execution of the final instruction for the specified time
    – that time is provided by the user.


    #### How to Use the Wait Command


    We can use the wait command to pause bash script system processes. The example
    below demonstrates in detail how this all works in a bash script:


    #!/bin/bash


    echo "Testing the wait command" sleep 5 &


    pid=$! kill $pid wait $pid


    echo $pid was terminated.


    Save and run the program and see for yourself how it all works.


    #### How to Display the Last Updated File


    On occasion, you may need to locate the last file that was updated – this may
    be needed for specific operations. Below you can see a simple program that shows
    you how to use the awk command in bash to do this. It will list one of two things
    – the last file updates or the last file created in the current working directory.


    #!/bin/bash


    ls -lrt | grep ^- | awk ''END{print $NF}''


    Copy this code into a file and run it to see how it all works.


    #### How to Add Batch Extensions


    In the program below, we are applying a custom extension to every file inside
    a specified directory. For the purposes of this demonstration, create a brand
    new directory and put a few files in it. In my folder, I have five files. Each
    is called test followed by a number between 0 and 4\. For the sake of this demonstration
    the script will add .UP to the end of each file – you can add whatever extension
    you want, just make sure you change the script accordingly.


    #!/bin/bash dir=$1


    for file in `ls $1/*` do


    mv $file $file.UP done


    One important note – you should not try running this script from a regular directory,
    only from a test one. You must also provide a command-line argument containing
    the directory name for the files – the period (.) should be used for the current
    working directory.


    #### How to Print the Number of Files or Directories


    The script below will find how many folders or files are in a specified directory,
    using the find command provided in Linux to do it. The name of the directory where
    you are looking for the files should be passed from the command-line.


    #!/bin/bash


    if [ -d "$@" ]; then


    echo "Files found: $(find "$@" -type f | wc -l)" echo "Folders found: $(find "$@"
    -type d | wc -l)" else


    echo "[ERROR] Please retry with another folder." exit 1


    fi


    If the directory you specify is not available you will be asked to try again with
    a different one. The same message will appear if you do not have permission to
    access the specified directory.


    #### How to Clean Log Files


    In the next demonstration, you can see how shell scripts can be used easily in
    real life. We are going to delete every log file stored in the directory called
    /var/log. If you want to clean up different logs, simply change the variable holding
    the directory:


    #!/bin/bash LOG_DIR=/var/log cd $LOG_DIR


    cat /dev/null > messages cat /dev/null > wtmp echo "Logs cleaned up."


    Important – this shell script must be run as root.


    #### Using Bash to Back Up Your Script


    Shell scripts provide a strong, effective way of backing up directories and files.
    In the next example, you can see how to back up every file and directory that
    was modified in the preceding 24 hours. The Linux find command is used for this.


    #!/bin/bash


    BACKUPFILE=backup-$(date +%m-%d-%Y) archive=${1:-$BACKUPFILE}


    find . -mtime -1 -type f -print0 | xargs -0 tar rvf "$archive.tar"


    echo "Directory $PWD backed up in archive file \"$archive.tar.gz\"." exit 0


    The file and directory names will be printed once the backup is successfully completed.


    #### How To See If a User is Root


    In the next example, you can see how a bash script is used to see if a user is
    root:


    #!/bin/bash ROOT_UID=0


    if [ "$UID" -eq "$ROOT_UID" ]


    then


    echo "You are root." else


    echo "You are not root" fi


    exit 0


    The output will depend entirely on which user is running the script. Root users
    are matched by the $UID.


    #### How to Remove Duplicate Lines From a File


    It can take a lot of time to process files and it can reduce admin productivity
    severely. One of the most time-consuming tasks is trying to find duplicate lines
    in your files but a short, simple shell script can save the day:


    #! /bin/sh


    echo -n "Enter the Filename-> " read filename


    if [ -f "$filename" ]; then


    sort $filename | uniq | tee sorted.txt else


    echo "No $filename in $pwd...try again" fi


    exit 0


    This script will look through every line of the specified file and will remove
    any duplicate. Those lines are then put into a new file, leaving the original
    file as it is.


    #### How to do System Maintenance


    If you want to make life a little easier for yourself, you can use a small shell
    script to upgrade your system, rather than having to do it all manually. Here''s
    an example of how this is done:


    #!/bin/bash


    echo -e "\n$(date "+%d-%m-%Y --- %T") --- Starting work\n" apt-get update


    apt-get -y upgrade


    apt-get -y autoremove apt-get autoclean


    echo -e "\n$(date "+%T") \t Script Terminated"


    This script will also remove old packages that you do not need anymore. Make sure
    to run it using sudo – if you don''t, it won''t work.


    Shell scripting in Linux isn’t as hard as you might think it is, and your scripts
    can be as diverse as you want. There is no limit in what they can or cannot do
    and, if you are new to this, new to using Linux and the bash script, take the
    time to learn these fundamental scripts – they will form the basis of just about
    everything you want to do. Once you have learned them, take the time to play around
    with them, change things, learn how they work, and understand exactly what they
    can do.'
