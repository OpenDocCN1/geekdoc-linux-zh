    # Chapter 8 Linux Shell Scripting


    ![](Images/image00304.jpeg)


    A lot of people like to use command-line tools to solve computer problems, but
    they don''t make you a master artist in the world of Linux. The shell makes you
    a master of Linux, so you can do anything. It''s important to know how the shell
    works and how to write different kinds of scripts in a Linux shell. With a little
    practice, you can do a lot of things on your own.


    A "shell script," in simple terms, is a file that has a list of commands inside
    of it. If you write command on the command line, the shell will read the file
    and do what you want it to. The shell is unique because it is both a command-line
    interface system and a scripting language interpreter, which makes it stand out.
    There are a lot of things you can do on the command line that can also be done
    in shell scripts. People who use Linux often use shell scripts to do a lot of
    the same things you can do on the command line.


    We have now covered most of the features of shell scripting. We have focused on
    the ones that are used more often on the command line. When we write programs,
    we can use a lot of things that the shell can do for us.


    ## Writing the Shell Script


    If you want to write shell scripts with a text editor, you''ll need to get one.
    Shell scripts are just text files. The best text editors will show you syntax
    highlighting, which lets you see a color-coded view of different parts of the
    script. If you want to write shell scripts, you can use `kate` or `vim` to write
    them. If you try to run old text files like programs, the system isn''t very happy
    about it. All of this is for a good reason. You need to set the permissions of
    the script file so that it can be run, then. Because the shell looks for files
    and runs them, you should put the script in a place where you can easily find
    it.


    ## The Format of Linux Shell Scripts


    I will now enter the writing phase and show you how you can write a shell script.
    The language of the script is simple. See the script as under:


    ```bash

    [gha@localhost ~]$ echo ''I am learning Linux'' I am learning Linux

    ```


    This is shell scripting. Now I will add a comment to the same script.


    ```bash

    [gha@localhost ~]$ echo ''I am learning Linux'' # I have added a comment to the
    code.


    I am learning Linux

    ```


    Now you have to make the script executable. See the following:


    ```bash

    [gha@localhost ~]$ ls -1 Linux_learning

    [gha@localhost ~]$ chmod 755 Linux_learning

    ```


    The text `Linux_learning` is the name of the file in which I had saved the script.
    The `chmod` command is used to make the script executable in Linux.


    ## Displaying Text


    Most of the shell commands tend to produce a specific output, which is displayed
    on your console monitor where you are running the script. You may need to add
    text messages to help out the script user know what is going to happen inside
    the script. You can do this by using the `echo` command I have talked about in
    the past section. The `echo` command displays simple text strings. There are different
    techniques to write a script with the `echo` command. I will explore all of them.


    ```bash

    [gha@localhost ~]$ echo I am learning Linux shell scripting I am learning Linux
    shell scripting

    ```


    The most remarkable thing is that you do not have to use quotes to enclose the
    string text, as is the case with other programming languages. However, sometimes
    it becomes necessary to use quotes. Either you need single or double quotes to
    display the text strings.


    ```bash

    [gha@localhost ~]$ echo ‘I am learning Linux shell scripting.’ I am learning Linux
    shell scripting

    ```


    In the next example, using quotes is going to be inevitable.


    ```bash

    [gha@localhost ~]$ echo ''Adam says, "I am learning Linux shell scripting."''


    Adam says, “I am learning Linux shell scripting."

    ```


    You can see that when you have to add a text that is in the form of direct speech,
    you will have to add quotation marks to the text.


    ## The if-then Statement


    Many Linux shell scripting programs require some logic flow control between different
    commands in the script, which means that the shell tends to run different commands
    in response to the commands in question. Because it can also run other commands
    that let the script go back and forth through commands based on different results
    of other commands, it also has the ability to do this. Structured commands are
    what we call them. Also called "conditionals," these are a type of sentence.


    If a program has structured commands, you can change the way that the program
    does its work. A lot of commands are run, but a lot of them aren''t run when they''re
    in certain situations. In other programming languages, the object after an `if`
    statement is the equation that the system checks to see if it is True or False,
    and that object is called the object. That''s not how the `bash` shell works.
    In place of that, it does what is written on the `if` line. If this command''s
    exit status is zero, then the commands in the next section are more likely to
    work. Other commands are put on hold if this command doesn''t work as expected.
    The `bash` shell then moves on to the next command in a script, even if this command
    didn''t work.


    ```bash

    $ cat testing5 #!/bin/bash


    # I am now testing the if statement for bash shell


    if date then


    echo "The structured command has completely worked" fi


    $bashbash -f main.sh


    Tue Jan 26 05:02:54 UTC 2021

    The structured command has completely worked

    ```


    The script has used the `date` command on the `if` line. If this command is executed
    successfully, the `echo` statement must display the text string. When you are
    running the script from the command line, you will be getting the same results
    as above. The shell will execute the `date` command. Since the exit status was
    zero, it will also execute the `echo` statement that is listed in the `then` section.
    In the next example, I will test a bad command to see how it works.


    ```bash

    $ cat testing2 #!/bin/bash


    # It is time to run a test on a bad command if hgjdksllh


    then


    echo "it is not going to work" fi


    echo "I cannot run the command because you’re out of the if statement."


    $bash -f main.sh


    I cannot run the command because you’re out of the if statement

    ```


    Since the above command was a bad command, it produced an exit status that is
    at the moment a non-zero. The `bash` shell will skip the `echo` statement in the
    `then` section.


    ## The if-then-else Statement


    The `if-then` statement provides one option to determine whether the command is
    successful. If a non-zero exit status code is returned, the `bash` shell goes
    to the next script command. In a situation like this, it would best if we had
    another set of commands we could execute, and that is where the `if-then-else`
    statement comes in.

