    ## Basic Commands


    This section of the chapter will walk you through the Unix commands and utilities.
    The first on the line is the `cat` command that will display the contents of a
    file. I will use the system information file and then get back to the shell prompt.
    This is one of the easiest commands to understand. You can get the output of one
    or more than one file and read through them.


    Note: I will use Fedora distribution to test commands from now onwards.


    ## File Navigation in Linux


    Most of you might have been familiar with a graphical user interface. It is very
    easy to navigate in that system. You see a perfect file tree to see different
    files on your system. You can open them and navigate through them in seconds.
    However, that is not the case in Linux. There is no graphical display of files
    in a Linux operating system. It’s better to look at the Linux file system as a
    maze. The directory in which you are currently present is the current directory.
    The directory above you is the parent directory. You can display the current working
    directory with the `pwd` command.


    ```bash

    [gha@localhost ~]$ pwd

    /root

    ```


    ### The ls command


    The `ls` command will display the contents of one of the directories in your system.
    The default is the current directory. You can use `ls -1` command to display a
    lengthier version of the file. You can also use the `ls –F` command to display
    the information of the type of files.


    ```bash

    [gha@localhost ~]$ ls bench.py hello.c

    ```


    You can change the current working directory by using the `cd` command. Just type
    `cd` in the shell and the pathname of the directory you want to work in. A pathname
    is a general route that you take along the branches of a tree to reach the directory
    you want. You can specify it in two ways. The first way is the absolute pathnames.
    An absolute pathname starts with the root directory, and it follows the tree branch
    by branch until the path to file or desired directory stands completed. Take the
    example of a directory on your system in which most of the system''s programs
    are installed.


    ```bash

    [gha@localhost ~]$ cd /usr/downloads

    [gha@localhost downloads]$ pwd

    /usr/downloads

    [gha@localhost downloads]$ ls

    ```


    This command will list the files in that directory. The `ls` command is one of
    the widely used commands in a Linux operating system. With this command''s help,
    you can see the contents of a directory and determine the number of files and
    directory attributes. As you have seen, you can enter the `ls` command to see
    the list of files and subdirectories that are contained inside a current working
    directory.


    ```bash

    [gha@localhost ~]$ ls /usr

    bin games include lib lib64 libexec local sbin share src tmp

    ```


    You can list the home directory of the user and the `/usr` by using the following
    command.


    ```bash

    [gha@localhost ~]$ ls ~ /usr

    /root:

    bench.py hello.c

    /usr:

    bin games include lib lib64 libexec local sbin share src tmp

    ```


    You can add `-1` to the `ls` command to change the format of the display and reveal
    more details. By adding `-1` to the same `ls` command, you can change the output
    to a longer format.


    ## Options and Arguments Commands


    Most Linux commands are made up of one character preceded by a dash. However,
    some are longer, with two dashes followed by a word, such as those in the GNU
    support project. Some commands even allow two or more shorter options to be tagged
    to one another. In the example you see below, we will give the `ls` command two
    options – the first (`l`) will reduce the long output, while the second (`t`)
    sorts the results by modification time.


    Let us see the result of the `–l` command.


    ```bash

    [gha@localhost ~]$ ls -l total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    Now I will add `t` to `–l` to prolong the output if it can be prolonged.


    ```bash

    [gha@localhost ~]$ ls -l total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    You can reverse the order of the output by using the `reverse` command. See the
    syntax of the command as under:


    ```bash

    [gha@localhost ~]$ ls -lt --reverse total 8

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    ```


    Let’s take a look at some miscellaneous commands that you can pair up with the
    `ls` command.


    - `ls a` is used to produce a list of all the files with proper names that start
    with a period. It also produces those files that are usually listed as hidden.

    - `ls --all` is the long option for the same command.

    - `ls –d` is used to specify a directory and display its contents. It does not
    display the directory. You can pair up this command with the `–l` command to explore
    details about the directory instead of the contents.

    - `ls --directory` is used to produce more details about the directory or its
    contents.

    - `ls –F` is used to append a particular indicator character to the tail of listed
    names, like the forward-slash of the name is already in the directory.

    - `ls --classify` is used to append the indicatory character to the tail of a
    listed name.

    - `ls --human-readable` is used to display the contents in long format listings
    and display the files in human-readable formats rather than in the form of bytes.

    - `ls –S` is used to sort out the results by the size.

    - `ls –t` is used to sort the results by modification time.


    ## Finding Out the Type of File


    As we begin to explore the system, one of the most useful things you should learn
    is what is in the files. To do this, we use the `file` command to help us work
    out the type. Linux doesn’t require the filenames to specify the type, so, for
    example, where you would expect a `.jpg` file to contain an image, Linux doesn’t
    require this. When the `file` command is invoked, it prints out a description
    of the file.


    ```bash

    [gha@localhost ~]$ file image.jpg

    ```


    There are lots of file types, and, like many operating systems, Linux treats everything
    in the system as a file.


    ### The less command


    We use the `less` command for viewing text files. The Linux operating system contains
    several files readable by the human eye, and the `less` command gives us an easy
    way to look through them. Text files need to be examined because some of them
    will be full of system settings. You see these labeled as configuration files,
    and all of them are stored in a particular format. When you can read the files,
    you will gain an idea of the way Linux works, and you will find several of the
    programs used by your system, called scripts, are stored the same way.


    Once the `less` command has been executed, you can scroll through a text file,
    back or forward. Let’s say you are looking at a file defining user accounts for
    your system. You could use this command:


    ```bash

    [gha@localhost ~]$ less /etc/passwd

    ```


    Once the command has been given, you can look at the content of a specific file.
    If it is a long file, use the arrow keys on your keyboard to navigate the contents.
    Below you can see the other common keyboard shortcuts that help navigate files
    with the `less` command:


    - `Page Up` to scroll back a page

    - `Page Down` to scroll forward a page

    - `Spacebar` to scroll forward a page

    - `Up Arrow` to scroll up a line on the page

    - `Down Arrow` to scroll down the line on the page

    - `G` to go to the end of the text file

    - `1G` or `g` to move to the start of the file on the page

    - `h` to display the help screen on the page

