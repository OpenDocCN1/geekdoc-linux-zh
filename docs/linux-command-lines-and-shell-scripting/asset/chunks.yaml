    The `x` option informs `ps` that it needs to show all the processes, no matter
    what terminal controls them. Because the system is running many processes, a long
    list is produced, and more often than not, it is helpful to pipe the `ps` output
    into `less` and view them that way. Some combinations of options produce many
    output lines, and it is a good idea to maximize the emulator window in the terminal.


    ## Process States


    Here is a rundown of process states.


    - The process state `R` denotes running. This process is either running or is
    ready to run in the system.

    - The process state `S` denotes Sleeping. The process is in Sleep mode and not
    running. It is waiting for a certain event to start, such as a keystroke or network
    packet.

    - The process state `Z` denotes the zombie process. This is a child process that
    has been terminated, but the parent process has not cleaned it up.

    - The process state `D` denotes Uninterruptable sleep. This process is waiting
    for the I/O like a disk drive.

    - The process state `T` denotes stopping. This process is instructed to stop.

    - The process state `N` denotes a low-priority process. It’s a good process that
    will obtain the processor time when all other high-priority processes have been
    serviced.

    - The process state `<` denotes a high priority process. It is possible to give
    away more importance to a process and allowing it more time on your CPU. A process
    that has higher priority is less nice because it takes more of the CPU’s time.


    Other characters may follow this process and these indicate characteristics of
    other processes. The `aux` command can be used with `ps` to provide another set
    of options:


    ```

    [gha@localhost ~]$ ps aux


    USERPID %CPU %MEMVSZRSS TTYSTAT


    | root | 1 | 0.0 | 1.3 | 3136 | 2516 ? | | S14:350:00 /bin/sh /sbin/i |

    | root | 2 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [kthreadd] |

    | root | 3 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/0:0] |

    | root | 4 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [kworker/0:0H] |

    | root | 5 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/u2:0] |

    | root | 6 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [mm_percpu_wq] |

    | root | 7 | 0.1 | 0.0 | 0 | 0 ? | S | 14:350:02 [ksoftirqd/0] |

    | root | 8 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [kdevtmpfs] |

    | root | 9 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [netns] |

    | root | 10 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [oom_reaper] |

    | root | 11 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [writeback] |

    | root | 12 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [crypto] |

    | root | 13 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [kblockd] |

    | root | 14 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [kswapd0] |

    | root | 15 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/0:1] |

    | root | 33 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [khvcd] |

    | root | 43 | 0.0 | 0.7 | 1944 | 1472 ? | Ss14:350:00 dhcpcd |

    | root | 48 | 0.0 | 1.5 | 6204 | 2940 hvc0 | Ss14:350:00 sh -l |


    START TIME COMMAND

    root71 0.0 0.000 ?I14:350:00 [kworker/u2:1]

    root160 0.0 1.48180 2740 hvc0R+15:020:00 ps aux

    ```


    This command displays the processes that belong to all users of a system. When
    you use the options without a leading dash, it invokes the command with BSD-style
    behavior. Here are the details of BSD- Style `ps` Column Headers.


    - The BDS-style `ps` column header, namely `USER` alludes to User ID. This denotes
    the owner of a process.

    - The BDS-style `ps` column header called `RSS` indicates Resident Set Size. This
    denotes the amount of physical memory (RAM) used by the process.

    - The BDS-style `ps` column header, namely `VSZ` alludes to the virtual memory
    size of the system.

    - The BSD-style `ps` column header, namely `%CPU` alludes to the CPU usage in
    percentage.


    ## Using the Top Command to View Processes


    The `ps` command reveals a lot about what your Linux machine is doing. However,
    it provides you just a snapshot of the state of the machine as the `ps` command
    is executed in the system. To see a dynamic view of the machine''s activity, I
    will use the `top` command.


    ```

    [gha@localhost ~]$ top


    top - 15:10:01 up 34 min, 0 users, load average: 0.05, 0.05, 0.02

    Tasks: 20 total,1 running, 19 sleeping, 0 stopped,               0 zombie

    %Cpu(s): 1.9 us, 4.9 sy, 0.0 ni, 93.2 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st

    MiB Mem :182.0 total,171.2 free,4.9 used,5.8 buff/cache

    MiB Swap:0.0 total,0.0 free,0.0 used.172.1 avail Mem

    PID USERPR NIVIRTRESSHR S %CPU %MEM TIME+ COMMAND

    | 180 root | 200 | 842430842584 R7.41.70:01.82 top |

    ```

