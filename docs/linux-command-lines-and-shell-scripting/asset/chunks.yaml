    # LINUX COMMAND LINES AND SHELL SCRIPTING


    ## Introduction


    This book on the Linux command line and shell scripting shows you how to use the
    keyboard to type commands and write shell scripts to make your programs. In general,
    Linux is more difficult than Windows and Mac operating systems, and it is the
    safest of the three, too. When you learn Linux, you can make your own software
    and use it to do everyday things. If you want, you can make your computer work
    the way that you want it to work.


    You can have a lot of fun with Linux, but it isn''t very easy to use. Linux doesn''t
    have a graphical interface like Windows. Instead, it has a command line. If you
    don''t know what a command-line is, you should look up `Dos` or `Command Prompt`
    in Windows to learn more about it. It is a black screen on which you have to write
    commands and do your daily chores.


    There are two parts to this book: the first part talks about commands, and the
    second part talks about shell scripts. If you don''t know how to use Linux commands
    and shell scripts, you can''t do a good job of running the system. I''ve filled
    the book with the commands you''ll use the most and the ones you''ll need the
    most. People can see some results on the command line after they run a program.
    I''ve also added some of them to the list below.


    The shell scripting part can be hard. In the case that you have a background in
    programming, it is fun to read about. A chapter on Linux editors is coming up
    later in the book, so don''t worry about that. You can write your own scripts,
    or you can copy mine and paste them into the editor so you can learn how to write
    them. This way, you can compare the results of each script. As a bonus, I''ve
    also included a lot of simple script examples that show how to use commands.


    ## Chapter 1 What is Linux?


    ![](Images/image00294.jpeg)


    As a student of Linux, the first thing you should learn is how Linux came to be.
    This will help you understand how this operating system works. Between the hardware
    and the software on a computer, Linux is a layer of software called "Linux." It
    lets you do productive things and make your own programs on your computer. In
    simple terms, an operating system is a bridge between the software and the hardware
    of a computer. An operating system lets you store data on your storage devices,
    like hard drives, solid-state drives, and USBs, by letting you use them to store
    it. It makes sure that data moves from one thing to another.


    For example, it makes sure that data moves from the operating system to the printers
    in your office or home. If you have the Microsoft Windows operating system on
    your computer, the Windows operating system runs the hardware. It is in charge
    of the mouse, keyboard, printers, scanners, and other things. Install Microsoft
    Office, Adobe readers, PDF converters, and other software as you need it to do
    your job. If you want each program to be on your computer, you will have to pay
    for it.


    Linux is the same as Windows when it comes to controlling the hardware. It is
    different because it acts as a bridge between the instruction code in the software
    and the physical device that is used to run it. The main difference is the software
    you will use in Linux operating systems. This is the main thing that is different.
    If you have a Mac, the software will be different from the ones that run on Windows.
    You can''t run Microsoft Office or Adobe Photoshop on Linux. Using Linux, you
    can run different servers, like web virtualization servers, Apache servers, database
    servers, and so on. These servers all run on Linux.


    Even so, Linux has a lot of different distributions that are made for personal
    computers. These distributions are very similar to macOS and Windows. They use
    the same kinds of programs, like word processors, image editors, and games, to
    do their work. These Linux distributions look like they are more aimed at people
    who want to use a free computer system at home.


    In the beginning, Linux did not start out as an operating system or a competitor
    to the Windows operating system. In the beginning, Linux had a kernel that was
    made by Linus Torvalds, who made it. If you were in high school, Linus was a student
    at the University of Helsinki. The kernel can still be used in the system, but
    it isn''t as important as before. This is how it started: The first time it was
    used was with the GNU operating system. You can say that without the kernel, the
    GNU system would not have worked.


    A kernel is an important part of Linux. A kernel is the most important part of
    operating systems because it is in charge of all the connections between applications
    and hardware. In the market now, there are two types of kernels: Unix-like Kernels
    and Windows Kernels.


    ### Birth of the Linux OS


    It was between 1991 and 1994 that Linus took things even more. This is when he
    made the Linux operating system. He mixed the GNU OS with the Linux Kernel. In
    the beginning, he wanted to make an operating system that was not free. Instead,
    he wanted something that he could make to fit his programming needs. A lot of
    deople thought at first that Linux was his favorite thing to do. It was like a
    side job. People who use Linux don''t use `UNIX`.


    All of Linux was made from scratch by Linus. To make an open-source operating
    system that people could use, he came up with the name "Linux." Before then, UNIX
    was not open source. Unix had to be paid for. In the same way, Microsoft also
    had a fee for its operating system.


    So, Linux came up with the idea of an operating system that was free to use. With
    the help of his friends from the Massachusetts Institute of Technology, he came
    up with the idea for the game (MIT). In addition to building an open-source operating
    system, they needed an easy-to-use and efficient operating system that they could
    change to meet their programming needs. This is what they did.


    ### Distributions of Linux


    When Linus was working on the Linux operating system, he took a break from working
    on it for a while to rest. That was when he made the operating system''s source
    code public. This made it possible for everyone to be a part of the system''s
    making. Scientists and computer geeks were also working on the idea. It was changed
    as they thought was best.


    Educational institutions and businesses were excited about the idea of this new
    operating system because anyone who had the source code could install Linux on
    their own computer and run Linux. These are the steps that people took to start
    making different versions of the Linux operating system. Students at the University
    of California, Berkeley, tried to start making a new version of the game. People
    from China and people with different jobs also started making their own versions
    to meet their own needs.

