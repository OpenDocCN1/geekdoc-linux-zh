  - 第 9 章 函数的 Linux Shell 脚本\n- 结语\n\n# Linux 命令与 Shell 脚本\n\n## 引言\n\n本关于 Linux 命令行和\
  \ Shell 脚本的书将向你展示如何使用键盘输入命令并编写 Shell 脚本来制作程序。通常情况下，Linux 比 Windows 和 Mac 操作系统更困难，但它三者中最安全的。当你学习\
  \ Linux 时，你可以编写自己的软件并用它来处理日常事务。如果你愿意，你可以让计算机按照你设想的方式运行。\n\n你可以从 Linux 中获得很多乐趣，但它并不容易使用。Linux\
  \ 没有像 Windows 那样的图形化界面。相反，它有一个命令行。如果你不知道什么是命令行，应该在 Windows 中查找 `Dos` 或 `Command\
  \ Prompt` 以了解更多信息。它是一个黑屏，你必须在上面编写命令并完成日常差工作。\n\n这本书分为两部分：第一部分介绍命令，第二部分介绍 Shell 脚本。如果你不知道如何使用\
  \ Linux 命令和 Shell 脚本，你就无法很好地运行系统。我在书中填满了你将最常用、最需要的命令。人们在运行程序后可以在命令行中看到一些结果。我也将其中一些结果列在了下面的列表中。\n\
  \nShell 脚本部分可能会很难。如果你有编程背景，阅读这部分会很有趣。书的后面有一章关于 Linux 编辑器的章节，所以不用担心那个。你可以编写自己的脚本，也可以复制我的脚本并粘贴到编辑器中，以便学习如何编写它们。这样，你可以比较每个脚本的结果。作为额外奖励，我还包含了许多展示如何使用命令的简单脚本示例。\n\
  \n# 第 1 章 什么是 Linux？\n\n![](img/image00294.jpeg)\n\n作为 Linux 的学生，你首先学习的是 Linux 是如何诞生的。这将帮助你理解这个操作系统是如何工作的。在计算机的硬件和软件之间，Linux\
  \ 是一层被称为“Linux”的软件。它允许你在计算机上进行高效工作并编写自己的程序。简单来说，操作系统是计算机软件和硬件之间的桥梁。操作系统允许你使用存储设备（如硬盘、固态硬盘和\
  \ USB 闪盘）来存储数据。它确保数据从一个地方移动到另一个地方。\n\n例如，它确保数据从操作系统传输到你办公室或家的打印机。如果你在计算机上安装了 Microsoft\
  \ Windows 操作系统，Windows 操作系统就会运行硬件。它负责鼠标、键盘、打印机、扫描仪等设备。根据工作需要安装 Microsoft Office、Adobe\
  \ 阅读器、PDF 转换器和其他软件。如果你希望计算机上拥有这每种程序，你必须为此付费。\n\n在控制硬件方面，Linux 与 Windows 是一样的。不同之处在于，它充当了软件指令代码与运行它的物理设备之间的桥梁。主要的区别在于你在\
  \ Linux 操作系统中使用的软件。这是主要的不同点。如果你有一台 Mac，软件将与在 Windows 上运行的软件不同。你无法在 Linux 上运行 Microsoft\
  \ Office 或 Adobe Photoshop。使用 Linux，你可以运行不同的服务器，如 虚拟化服务器、Apache 服务器、数据库服务器等。这些服务器都运行在\
  \ Linux 上。\n\n尽管如此，Linux 许多许多为个人电脑制作的不同发行版。这些发行版与 macOS 和 Windows 非常相似。它们使用相同类型的程序，如文字处理器、图像编辑器和游戏来工作。这些\
  \ Linux 发行版看起来更面向那些想在家使用免费计算机系统的人。\n\n起初，Linux 并不是作为一个操作系统或 Windows 操作系统的竞争者出现的。起初，Linux\
  \ 只是由 Linus Torvalds 制作的一个内核，由他创建了它。如果你当时在读高中，Linus 是赫尔辛基大学的一名学生。内核仍然可以使用系统中，但它不像以前那么重要了。它是这样开始的：第一次被使用是通过\
  \ GNU 操作系统。你可以说，没有内核，GNU 系统将无法运行。\n\n内核是 Linux 的重要部分。内核是操作系统中最重要的部分，因为它负责应用程序和硬件之间所有的连接。在目前的市场中，有两种内核：Unix\
  \ 类内核和 Windows 内核。\n\n### Linux 操作系统的诞生\n\n在 1991 年到 1994 年之间，Linus 更进一步了。他制作了 Linux\
  \ 操作系统。他将 GNU 操作系统与 Linux 内核结合在一起。最初，他想制作一个免费的操作系统。相反，他想做一个可以满足他编程需求的东西。起初，很多人认为\
  \ Linux 是他最喜欢做的事，像是一份兼职。使用 Linux 的人不用 `UNIX`。\n\n整个 Linux 都是由 Linus 从零开始制作。为了制作一个人们可以使用开源操作系统，他想出了“Linux”这个名字。在此之前，UNIX\
  \ 不是开源的。Unix 必须付费。同样，微软的操作系统也要收费。\n\n因此，Linux 提出了一个免费使用的操作系统的想法。在麻省理工学院（MIT）朋友的帮助下，他想出了这个想法（MIT）。除了构建开源操作系统外，他们还需要一个易于使用且高效的操作系统，以便他们进行更改以满足他们的编程需求。这就是他们做的。\n\
  \n### Linux 的发行版\n\n当 Linus 编写 Linux 操作系统时，他停止工作了一段时间进行休息。那时他公开了操作系统的源代码。这让每个人参与到系统的制造成为可能。科学家和电脑极客也在研究这个想法。他们根据认为最好的方式对其进行修改。\n\
  \n教育机构和企业对这个新操作系统的想法感到兴奋，因为任何拥有源代码的人都可以在自己的计算机上安装并运行 Linux。这些是人们开始制作不同版本的 Linux\
  \ 操作系统系统的步骤。加州大学伯克利分校的学生尝试开始制作一个新版本。来自中国的人和从事不同工作的人也开始制作自己的版本以满足自己的需求。\n\n\n\n\n\
  公众可以查看源代码，这使得制作发行版（distros）或发布变得更容易。发行版是人们随着时间推移制作的不同类型的 Linux。Linux 有许多不同的版本，而它的许多发行版每一个都赋予了它不同的技能组合。当你必须选择使用哪种\
  \ Linux 发行版时，你必须先弄清楚你想让电脑通过 Linux 做什么，然后选择一个发行版。Windows 是一个很好的类比，可以展示我将如何解释。当你在计算机上安装\
  \ Microsoft Windows 时，每个发行版都是为了以特定的方式执行任务。\n\n人们使用 `Trustix`，这是一种人们使用的 Linux。有许多人说\
  \ Linux `Trustix` 是市场上最安全的 Linux 操作系统。它就像一块砖头一样坚固。除非你做了一些非常愚蠢的事情，否则任何都不可能进入 Linux\
  \ `Trustix`。带有病毒的人无法进入。它是一个安全且强大的服务器。在获取源代码并开始安装之前，考虑你是否真的需要一个安全的服务器也很重要，所以务必确定。\n\
  \n为了获得一台可以运行某些工作应用程序的电脑，你可能需要一个 `Ubuntu` Linux 桌面版本。如果你想要一台非常安全的电脑，你可能需要 Linux `Trustix`。如果你想要带有大量支持的东西，你可能需要使用\
  \ Linux 发行版并寻求技术支持中心来帮助你。这样，你就能得到你需要的。在这种情况下，`Red Hat` Linux 将是你需求的最佳选择。同样，你仍然需要清楚你想让你的电脑做什么，以便为你的计算机系统选择最佳的\
  \ Linux 发行版。\n\n因为 Linux 是免费的，你可以随心所欲地更改它。\n\n现在你已经学习了 Linux 的历史和它的不同发行版，是时候转向开源许可的概念了，这个概念让\
  \ Linux 与其他操作系统与众不同，因为它允许任何人使用它。Linux 的许可是开源的。你可能在人生的某个阶段听过开源软件。它是可以免费使用的软件。因为你的软件被公开了，这并不意味着任何人都可以免费使用。由于开源软件是免费的，如果你把所有软件都看作是免费的，你可能会失去你的工作以及你的公司。这是违法的，所以我们需要谈论开源软件以消除疑义。\n\
  \n这被称为开源软件。当程序员为某个软件编写代码时，他们将代码交给你，这样你就可以看到他们最初是如何编写该程序的。这并不意味着该程序是免费使用的，但它确实说明了它是免费的。开源供应商有许多付费方式，它们的方法各不相同。\n\
  \n他们这样做的第一种方法是免费提供他们的软件。然而，如果你需要该软件的帮助或培训，他们将向你收取一定费用。例如，你可以下载 Linux 服务器的 `MySQL`\
  \ 服务器并在其上运行。同样的情况也适用于你。尽管你已经完全了解了 `MySQL` 程序的不同复杂之处，但仍然有一些你可能需要学习或寻求帮助的事情。所以，你去软件开发者那里寻求有关软件的帮助或培训。编写计算机程序或进行其他此类工作的人在此时应该就他们为你所做的事情获得报酬。\n\
  \n他们还通过非商业开源许可获得报酬，这是他们获得工作付费的方式。大多数人在这里遇到了麻烦。他们向你收取使用费用。\n\n对于家庭使用，这完全没有问题。一旦你用它连接到业务服务器，你就拥有了将该软件用于业务的权利。最糟糕的情况是，许可费用有时超过\
  \ 8000 美元。在某些情况下它可能非常贵，但也可能非常廉。因此，考虑你可能如何将非商业、个人或商业用途使用该软件是非常重要的。\n\n他们还通过付费开源许可获得报酬。你们中的许多人可能很好奇即使软件本身需要付费使用，开源软件是如何被使用的。开源程序是指需要付费的程序。如果你能看到程序的代码，它就是开源的。\n\
  \n这是这些程序员赚钱的第四种方式。他们对制作的开源软件收取定期费用。这就像大多数免费使用的程序一样。他们会让你免费下载并尝试他们的软件，这样你可以看到它是如何工作的。他们还会向你展示软件如何工作，以便你理解它的运行原理。然而，如果你想拥有软件的法律权利，你必须每年或每月支付一次费用。在这里，你不需要为花费过高的单分钟许可费付费。\n\
  \n## Linux Shell\n\n现在，我将谈论 Linux shell（外壳），它是 Linux 操作系统的一部分。每当你与计算机交互时，shell 就是当你看向屏幕时看到的内容。看看\
  \ Microsoft Windows。你可以看到你的鼠标指针在 Windows shell 中工作，Windows shell 是计算机中看起来像图片的部分。当你在屏幕上移动时，你使用指针移动屏幕的不同部分，如图标和文件夹。shell\
  \ 有两种类型。第一种是图形用户界面 (`GUI`)，第二种是命令行用户界面 (`LUI`) (`LUI`)。`LUI` 看起来像 DOS 提示符。如果你曾经在\
  \ Microsoft DOS 提示符上工作，你应该知道你看到并操作的屏幕被称为命令行界面 (`LUI`)。\n\nLinux 是一个非常技术性的操作系统，这就是为什么程序员、工程师以及其他喜欢技术的人非常喜欢它。他们喜欢使用这种界面，因为这有助于他们编程。当你安装\
  \ Linux 时，你可以选择图形用户界面，就像你使用 Windows 界面一样。在这里，你可以使用鼠标点击，也可以使用对程序员更好的命令行界面。由于这个原因，Linux\
  \ 的命令行界面可以用于很多事情。\n\n## Root\n\n这是你需要思考和考虑的下一个问题。它被称为 root。在 Linux 操作系统中，`root`\
  \ 指某个东西的顶层。当你处理 Linux 时，会有有很多“root”这个词。`root user` 是一个负责计算机的人。`root user` 是计算机上可能的最强大的人。如果你能以\
  \ `root user` 身份登录，你可以做很多事情。\n\n\n\n\nroot 用户（超级用户）拥有巨大的权限，他或她是所有用户中权限最高的。在 Linux\
  \ 操作系统中有许多不同的文件夹。主目录（home folder）充满了用户的设置、文档、程序和其他重要内容。因此，主目录可以视为单个用户的最高层级。关于 Linux\
  \ 操作系统中的 root 用户，最重要的一点是：root 级别是最高级别。root 用户可以在操作系统中执行任何操作。当我们开始输入命令并让 Linux 操作系统执行不同的任务时，就会发现\
  \ root 用户这一概念对我们有多么重要。那些非 root 用户无法执行的操作，我们作为 root 用户就可以完成。\n\n## 使用 Linux 操作系统的原因\n\
  \n由于服务器运行在 Linux 上，你应该更多地了解它。Linux 操作系统非常强大。一旦你安装了 Linux 操作系统并处理了那些特殊问题且配置了设置，它运行得非常顺畅。Linux\
  \ 操作系统不会在工作过程中过热或死机，它可以一直运行。一旦你正确配置了 Linux 操作系统，它可以不关机运行一百五十天。\n\nLinux 操作系统与 Windows\
  \ 的不同在于，你必须每周重启一次以避免丢失部分内存。如果你配置得当，Linux 操作系统就会运行并执行其工作，完全无需担心正在发生什么。当你在电脑上安装 Linux\
  \ 操作系统时，它的运行方式会有极少甚至没有问题。\n\n## 安装 Linux 操作系统\n\n为了让你能够尝试并感受它的工作原理，我将向你展示如何设置 Linux\
  \ 操作系统。我会向你展示如何设置 Ubuntu Linux 服务器版以便你可以使用。它是开源且免费的。无论你将 Ubuntu 用于业务还是个人使用，都不会产生费用。访问\
  \ Google 并打开 Ubuntu 网站。然后，从网站下载 Ubuntu 服务器版的 `ISO` 文件并将其放入硬盘。将该文件刻录到 CD 或放入 USB\
  \ 优存盘中。我希望你已经了解如何使用刻录程序制作一个可以启动的启动 U 盘，我不想在这上面浪费时间。\n\n由于它是用于服务器的，屏幕上将没有图形用户界面（GUI）。简单来说，这意味着你看到的是一个黑白屏幕。屏幕上有一个会移动的光标。当你想要继续工作时，你需要输入命令。如果你不这样做，就会卡住。在服务器上运行\
  \ Linux 时，屏幕是黑白的。我会告诉你这是为什么。安全是主要原因。Linux 服务器版本上的每个功能对于黑客客来说都是一个攻击点。这就是为什么 Linux\
  \ 服务器版本采用基于行的用户界面。任何黑入你电脑的人都可以通过安装在你电脑“图形界面”上的任何程序进入。Linux 操作系统没有图形界面，也没有在之外使用的应用程序，这使得它被黑客的概率较低。\n\
  \n尽管 Mac 操作系统非常安全，但黑客已经发现了进入 Mac 系统使用的 Adobe Flash 插件的方法。随着时间的推移，黑客学会了如何进入 Mac OS\
  \ 一直使用的 Adobe Flash 插件。尽管 Mac OS X 是一个非常安全的系统，但 Flash 仍有漏洞。黑客现在可以借助 Flash 软件接管 Mac\
  \ 电脑，这让他们更容易实现这一点。然而，Linux 操作系统并没有这个缺陷。现在，让我们讨论如何在你的电脑上设置 Linux 操作系统。\n\n在设置服务器之前，你需要下载\
  \ Ubuntu Linux 服务器软件。你可以访问 `www.ubuntu.com` 了解更多关于该公司的信息。在 Ubuntu 首页上，你会发现可以执行许多不同功能的\
  \ Ubuntu 版本。那里有 Ubuntu 桌面版供你使用。还有笔记本电脑版，不要忘记它。会有云版本，以及适用于平板电脑和手机的版本。寻找 Ubuntu Server\
  \ 并从像这样的网站获取它的下载链接：\n\n如果你想把 Ubuntu 放在电脑上，文件应该从 DVD 而不是硬盘启动。为了实现这一点，你需要按下键盘上的 `DELETE`\
  \ 或 `F1` 进入主板的 BIOS 设置。要设置你想要启动电脑的位置，请进入下一步。检查你主板的用户手册以查看如何进入 BIOS 设置。进入 BIOS 设置有许多方法。\n\
  \n要安装文件，你需要获取该文件并准备好从 CD 或 DVD 启动。系统会询问你想使用什么语言来安装 Ubuntu Linux。选择你想要的语言并按 `Enter`。Linux\
  \ 将被安装到你的电脑上。\n\n![](img/image00295.jpeg)\n\n# 第 2 章 使用 Linux 命令\n\n当我们谈论 Linux\
  \ 命令行时，称之为 Linux shell（外壳）。Linux shell 是一个接收键盘命令并将其发送到操作系统以供使用的程序。所有的 Linux 发行版都带有一个名为\
  \ `bash` 的 shell 程序。`bash` 代表 Bourne Again Shell（再次 Bourne 壳）。这些词是关于 `bash` 的，它是第一个\
  \ UNIX shell `sh` 的更高级版本。\n\n当你使用图形界面时，你需要另一个名为终端（terminal）的程序进行通信。这就是 Linux shell。\n\
