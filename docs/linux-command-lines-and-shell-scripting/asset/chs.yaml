  \ countries after Covid-19 is over. I am going to visit 11 countries after Covid-19\
  \ is over.\nI have visited the countries.\n```\n\n`for` 循环运行到使用 `break` 关键字为止。当\
  \ `if-then` 条件满足时，bash shell 执行了 `break` 命令，这为 `for` 循环设置了停止器。这种技术对于 `until` 和 `while`\
  \ 循环同样适用。\n\n```bash\n$ cat test18 #!/bin/bash\n\n# 跳出 while 循环 countries=1\n\n\
  while [ $countries -lt 15 ] do\n\nif [ $countries -eq 8 ] then\n\nbreak\n\nfi\n\n\
  echo \"I am going to visit $countries after Covid-19 is over.\" countries=$[ $countries\
  \ + 1 ]\n\ndone\n\necho \"I have visited the countries.\"\n```\n\n```bash\n$bash\
  \ -f main.sh\nI am going to visit 1 countries after Covid-19 is over. I am going\
  \ to visit 2 countries after Covid-19 is over. I am going to visit 3 countries after\
  \ Covid-19 is over. I am going to visit 4 countries after Covid-19 is over. I am\
  \ going to visit 5 countries after Covid-19 is over. I am going to visit 6 countries\
