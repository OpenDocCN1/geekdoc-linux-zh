  \n# 第 8 章 Linux Shell 脚本\n\n![](img/image00304.jpeg)\n\n很多人喜欢使用命令行工具来解决计算机问题，但它们并不能让你成为\
  \ Linux 世界的大师。shell 让你成为 Linux 的大师，从而使你无所不能。了解 shell 的工作原理以及如何在 Linux shell 中编写不同类型的脚本至关重要。通过少量的练习，你可以独立完成很多事情。\n\
  \n简单来说，“shell 脚本”（shell script）就是一个内部包含命令列表的文件。如果你在命令行中编写命令，shell 就会读取该文件并执行你想让它执行的操作。shell\
  \ 的独特之处在于它既是一个命令行界面系统，又是一个脚本解释器，这使得它脱颖而出。在命令行中可以做的很多事情在 shell 脚本中也可以完成。Linux 的 用户经常使用\
  \ shell 脚本来完成许多你在命令行中可以做的相同操作。\n\n我们现在已经涵盖了 shell 脚本的大部分功能。我们专注于那些在命令行中使用频繁的特性。当我们编写程序时，可以使用\
  \ shell 为我们执行的很多功能。\n\n## 编写 Shell 脚本\n\n如果你想用文本编辑器编写 shell 脚本，你需要先获取一个。shell 脚本仅仅是文本文件。最好的文本编辑器会提供语法高亮，让你能够看到脚本不同部分的颜色编码视图。如果你想写\
  \ shell 脚本，可以使用 `kate` 或 `vim` 来编写。如果你尝试像运行程序一样运行旧的文本文件，系统对此将并不高兴。这一切都是有原因的。你需要设置脚本文件的权限以便它可以运行。由于\
  \ shell 会查找并运行这些文件，所以你应该将脚本放在一个容易找到的地方。\n\n## Linux Shell 脚本的格式\n\n现在我将进入编写阶段，向你展示如何编写\
  \ shell 脚本。脚本的语言非常简单。脚本如下：\n\n```bash\n[gha@localhost ~]$ echo 'I am learning Linux'\
  \ I am learning Linux\n```\n\n这就是 shell 脚本。现在我将在同一个脚本中添加注释。\n\n```bash\n[gha@localhost\
  \ ~]$ echo 'I am learning Linux' # 我在代码中添加了注释。\n\nI am learning Linux\n```\n\n现在你必须让脚本变为可执行状态。如如下所示：\n\
  \n```bash\n[gha@localhost ~]$ ls -1 Linux_learning\n[gha@localhost ~]$ chmod 755\
  \ Linux_learning\n```\n\n文本 `Linux_learning` 是我保存脚本的文件名。`chmod` 命令用于在 Linux 中使脚本变为可执行。\n\
  \n## 显示文本\n\n大多数 shell 命令倾向于产生特定的输出，这些输出会显示在你运行脚本的控制台显示器上。你可能需要添加文本消息，以帮助脚本用户知道脚本内部将发生什么。你可以通过使用我在上一节中提到过的\
  \ `echo` 命令来实现。`echo` 命令显示简单的文本字符串。使用 `echo` 命令编写脚本有不同的技术，我将探索所有的技术。\n\n```bash\n\
  [gha@localhost ~]$ echo I am learning Linux shell scripting I am learning Linux\
  \ shell scripting\n```\n\n最显著的一点是，你不需要使用引号来包裹字符串文本，就像其他编程语言那样。然而，有时必须使用引号。你需要使用单引号或双引号来显示文本字符串。\n\
  \n```bash\n[gha@localhost ~]$ echo ‘I am learning Linux shell scripting.’ I am learning\
  \ Linux shell scripting\n```\n\n在下一个示例中，使用引号将是不可避免。\n\n```bash\n[gha@localhost ~]$\
  \ echo 'Adam says, \"I am learning Linux shell scripting.\"'\n\nAdam says, “I am\
  \ learning Linux shell scripting.\"\n```\n\n你可以看到，当你必须添加以直接引语形式存在的文本时，你必须给文本加上引号。\n\
  \n## if-then 语句\n\n许多 Linux shell 脚本程序在脚本的不同命令之间需要一些逻辑流控制，这意味着 shell 倾向于根据问题的命令来运行不同的命令。由于它还可以运行其他命令，让脚本根据其他命令的结果在命令之间来回执行，因此它也具备这种能力。我们称之为为结构化命令。也称为“条件语句”（conditionals），这是一种语句。\n\
  \n如果程序具有结构化命令，你就可以改变程序工作的方式。很多命令会被执行，但在某些情况下，很多命令并不会执行。在其他编程语言中，`if` 语句后面的对象是系统检查其为真还是为假的方程，那个对象被称为对象。`bash`\
  \ shell 的工作原理并不是这样。相反，它执行 `if` 行上写的内容。如果此命令的退出状态为零，那么下一部分中的命令更有可能执行。如果此命令没有按预期工作，其他命令将被暂停。`bash`\
  \ shell 然后将移动到脚本中的下一个命令，即使该命令没有执行。\n\n```bash\n$ cat testing5 #!/bin/bash\n\n# 我现在正在测试\
  \ bash shell 的 if 语句\n\nif date then\n\necho \"The structured command has completely\
  \ worked\" fi\n\n$bashbash -f main.sh\n\nTue Jan 26 05:02:54 UTC 2021\nThe structured\
  \ command has completely worked\n```\n\n脚本在 `if` 行上使用了 `date` 命令。如果该命令执行成功，`echo`\
  \ 语句将显示文本字符串。当你从命令行运行脚本时，你将得到与上面相同的结果。shell 将执行 `date` 命令。由于退出状态为零，它还将执行在 `then`\
  \ 部分列出的 `echo` 语句。在下一个示例中，我将测试一个错误的命令看看它是如何工作的。\n\n```bash\n$ cat testing2 #!/bin/bash\n\
  \n# 是时候对错误命令进行测试了 if hgjdksll\n\nthen\n\necho \"it is not going to work\" fi\n\n\
  echo \"I cannot run the command because you’re out of the if statement.\"\n\n$bash\
  \ -f main.sh\n\nI cannot run the command because you’re out of the if statement\n\
  ```\n\n由于上面的命令是错误的，它产生了一个非零的退出状态。`bash` shell 将跳过 `then` 部分的 `echo` 语句。\n\n## if-then-else\
  \ 语句\n\n`if-then` 语句提供了一个判断命令是否成功的选项。如果返回非零退出状态码，`bash` shell 将执行下一个脚本命令。在这种情况下，最好的办法是有另一组我们可以执行的命令，这就是\
  \ `if-then-else` 语句派上用场的地方。\n\n\n\n\n如果 `if`-语句命令产生的退出状态码为零，则语句中 `then` 部分的命令将被执行。如果返回了非零退出状态码，则语句中\
  \ `else` 部分的命令将被执行。\n\n```bash\n$ cat testing4 #!/bin/bash\n\n# I am now going to\
  \ test the else section testinguser=thisisabadtest\n\nif grep $testinguser /etc/passwd\
  \ then\n\necho The files for user $testinguser are:\n\nls -a /home/$testinguser/.b*\
  \ else\n\necho \"The user name $testinguser cannot be found on the system\" fi\n\
  ```\n\n```bash\n$ ./test4\n\nThe user name thisisabadtest cannot be found on the\
  \ system\n\n$\n\n$bash -f main.sh\n\nThe user name thisisabadtest cannot be found\
  \ on the system\n```\n\n偶尔，你可能需要检查脚本代码中的某些内容。与其使用分开的 `if-then` 语句，可以使用不同版本的 `else`\
  \ 语句。这被称为 `elif`，它通过后续的 `if-then` 语句延续 `else` 语句。它提供了一个不同的评估命令，非常类似于第一个 `if` 语句。如果返回了零退出状态码，`bash`\
  \ 壳将执行第二个 `then` 语句中的命令。\n\n## 高级 if-then 特性\n\nLinux 中有一种双括号命令，允许你在进行比较时引入一些高级数学公式。`test`\
  \ 命令允许在比较中进行简单操作。然而，双括号命令提供了许多来自其他语言的程序员正在使用的数学符号。\n\n表达式项可以是任何类型的数学赋值或表达式。除了 `test`\
  \ 命令使用的标准运算符外，双括号命令还提供了额外的可用运算符。\n\n你也可以使用双括号命令的高级功能进行字符串比较。双括号命令格式使用了我们在 `test`\
  \ 命令中使用的标准字符串比较。它的不同之处在于模式匹配选项。你将能够定义一个正则表达式与字符串值进行匹配。\n\n```bash\n$ cat testing2\
  \ #!/bin/bash\n\n# I will now be using pattern matching if [[ $MyUSER == r* ]]\n\
  \nthen\n\necho \"Hello $MyUSER I know you from the days when you used to work in\
  \ a restaurant in Europe.\"\n\nelse\n\necho \"Sorry, I have never seen you before.\
  \ I don’t know you.\" fi\n```\n\n```bash\n$bash -f main.sh\n\nSorry, I have never\
  \ seen you before. I don’t know you.\n```\n\n更多情况下，你可能会发现自己尝试评估某些变量的值，以便在可能的可能值集中找到一个特定值。在这种典型场景下，你可能会写出如下冗长的\
  \ `if-then-else` 语句：\n\n```bash\n$ cat testing555 #!/bin/bash\n\n# I am now looking\
  \ for some possible values if [ $MyUSER = \"rich\" ]\n\nthen\n\necho \"Welcome $MyUSER\
  \ to the heavens on the earth.\"\n\necho \"Please enjoy your visit in plush green\
  \ fields and lush green mountains. I wonder if you want to take a bath in the river\
  \ beneath the valley.\"\n\nelif [ $MyUSER = Jason ] then\n\necho \"Welcome $MyUSER\
  \ to the lakes of Madora.\"\n\necho \"Please enjoy your stay in the shining waters\
  \ of Madora lakes. I hope you enjoy the resorts, the sun, the breeze, the food,\
  \ and the drinks.\"\n\nelif [ $MyUSER = Simra ] then\n\necho \"Welcome $MyUSER to\
  \ the lakes of Madora.\"\n\necho \"Please enjoy your stay in the shining waters\
  \ of Madora lakes. I hope you enjoy the resorts, the sun, the breeze, the food,\
  \ and the drinks.\"\n\nelif [ $MyUSER = Linda ] then\n\necho \"Don’t forget to logout\
  \ when you’re done\" else\n\necho \"Sorry, you’re not allowed here\" fi\n```\n\n\
  ## for 命令\n\n在编程中，对一系列命令进行迭代是标准做法。很多时候，你可能需要重复不同的命令。通常，你需要重复一组命令，直到程序满足指定条件，例如处理目录内部的文件或文本文件中的所有行。\n\
  \n`bash` 壳提供了 `for` 命令来开发一个遍历一组值的循环。每次迭代倾向于通过使用序列中的单个值来执行一组命令。`for` 命令最基本的用法之一是遍历在\
  \ `for` 命令内部定义的值列表。\n\n```bash\nv=$ cat testing111 #!/bin/bash\n\n# This is the\
  \ basic for command in Linux\n\nfor mytest in Alabama Texas Alaska Virginia Arizona\
  \ Ohio Arkansas South Dakota California North Dakota Colorado New Jersey Florida\
  \ Michigan Georgia\n\ndo\n\necho I am planning to continue my travel circle across\
  \ the United States in the summer. The next state I will visit is $mytest\n\ndone\n\
  ```\n\n```bash\n$bash -f main.sh\n\nI am planning to continue my travel circle across\
  \ the United States in the summer. The next state I will visit is Alabama\n\nI am\
  \ planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is Texas\n\nAnd so on until the last line:\n\nI am\
  \ planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is Georgia\n```\n\n当 `for` 命令每次遍历对象列表时，它会将 `mytest`\
  \ 变量赋值给列表中的下一个项。`$mytest` 变量在 `for` 命令语句中的用法与其他脚本变量一样。在最后一次迭代之后，`$test` 变量在壳脚本的剩余部分始终保持有效。除非你更改它，否则它将保留最后迭代的值。\n\
  \n```bash\nv=$ cat testing111 #!/bin/bash\n\n# This is the basic for command in\
  \ Linux\n\nfor mytest in Alabama Texas Alaska Virginia Arizona Ohio Arkansas South\
  \ Dakota California North Dakota Colorado New Jersey Florida Michigan Georgia\n\n\
  do\n\necho I am planning to continue my travel circle across the United States in\
  \ the summer. The next state I will visit is $mytest\n\ndone\n\necho \"The last\
  \ US state I traveled to was $mytest\" mytest=Connecticut\n\necho \"Now I am going\
  \ to visit $mytest\"\n```\n\n```bash\n$bash -f main.sh\n\nI am planning to continue\
  \ my travel circle across the United States in the summer. The next state I will\
  \ visit is Alabama\n\nI am planning to continue my travel circle across the United\
  \ States in the summer. The next state I will visit is Texas\n\nAnd so on, until\
  \ the last line:\n\nI am planning to continue my travel circle across the United\
  \ States in the summer. The next state I will visit is Georgia\n\nThe last US state\
  \ I traveled to was Georgia Now I am going to visit Connecticut\n```\n\n你可以看到 `$mytest`\
  \ 变量保留了它的原始值，并允许我们在 `for` 循环之外更改它。让我们来看另一个 `for` 循环的示例：\n\n```bash\nv=$ cat testing111\
  \ #!/bin/bash\n\n# This is the basic for command in Linux\n\nfor mytest in pumpkin\
  \ tomato spinach ginger garlic cauliflower cabbage pepper beet ladyfinger broccoli\n\
  \ndo\n\necho I am planning to make a shift to the cooking schedule as the summer\
  \ sets in. I have bought lots of vegetables. However, today I plan to cook $mytest.\n\
  \ndone\n\necho \"The last vegetable I cooked was $mytest\" mytest=onion\n\necho\
  \ \"Now I am going to cook $mytest\"\n```\n\n```bash\n$bash -f main.sh\n\nI am planning\
  \ to make a shift to the cooking schedule as the summer sets in. I have bought lots\
  \ of vegetables. However, today I plan to cook pumpkin.\n\nI am planning to make\
  \ a shift to the cooking schedule as the summer sets in. I have bought lots of vegetables.\
  \ However, today I plan to cook potato.\n\nThis continues through each of the vegetabes,\
  \ ending with:\n\nI am planning to make a shift to the cooking schedule as the summer\
  \ sets in. I have bought lots of vegetables. However, today I plan to cook broccoli.\n\
  \nThe last vegetable I cooked was broccoli Now I am going to cook onion\n```\n\n\
  当你处理 `for` 命令时，可能会遇到的最大问题是使用多单词的值。`for` 循环假设每个值都应该由空格分隔。如果你有包含空格的数据值，可能会遇到另一个问题。你可能会从美国州的例子中看到这一点。`bash`\
  \ 编辑器将 South 和 Dakota 视为两个独立的值。\n\n\n\n\n\n`for` 命令允许我们使用引号来分隔包含多个单词的数值。你可以使用双引号在\
  \ `for` 命令中分隔不同的不同的值。请参考以下示例。\n\n```bash\n$ cat testing111 #!/bin/bash\n\n# This\
  \ is the basic for command in Linux\n\nfor mytest in Alabama Texas \"New York\"\
  \ Alaska Virginia Arizona Ohio Arkansas \"South Dakota\" California \"North Dakota\"\
  \ Colorado \"New Jersey\" Florida Michigan Georgia \"North Carolina\" \"South Carolina\"\
  \ \"New Mexico\" \"Rhode Island\" \"West Virginia\" \"New Hampshire\" Vermont\n\
  do\n\necho I am planning to continue my travel circle across the United States in\
  \ the summer. The next state I will visit is $mytest\ndone\n\necho \"The last US\
  \ state I traveled to was $mytest\" mytest=Connecticut\necho \"Now I am going to\
  \ visit $mytest\"\n\n$bash -f main.sh\n```\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是 Alabama。\n\
  \n我计划在夏天继续我的全美旅行。我下一个要访问的州是 Texas。\n\n继续遍历各个州直到到达最后一个：\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是\
  \ Vermont\n\n我上一次旅行的美国州是 Vermont 现在我要去访问 Connecticut\n\n现在 `for` 命令可以区分单单词值和多单词值。此外，最棒的一点是，当你使用双引号时，shell\
  \ 会去掉作为值一部分的引号。\n\n### 通过变量读取列表\n\n通常在 shell 脚本内部发生是积累一组数值列表并存储在变量中。然后需要对该列表进行迭代。你可以借助\
  \ `for` 命令来实现这一点。\n\n```bash\n$ cat testing111 #!/bin/bash\n\n# This is the basic\
  \ for command in Linux\n\nlist=\"Alabama Texas New York Alaska Virginia Arizona\
  \ Ohio Arkansas South Dakota California North Dakota Colorado New Jersey Florida\
  \ Michigan Georgia North Carolina South Carolina New Mexico Rhode Island West Virginia\
  \ New Hampshire Vermont\"\nlist=$list\" Idaho\"\n\nfor state in $list do\n\necho\
  \ \"I am planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is $state\"\n\ndone\n\n$bash -f main.sh\n```\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是\
  \ Alabama\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是 Texas\n\n一直到最后一个州：\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是\
  \ Idaho\n\n`list` 变量包含了用于迭代的数值列表。你应该注意，代码使用了另一个赋值语句来将项目连接到现有列表中。即使你忘记在列表中添加项目，你也可以稍后通过连接方法添加它们。我将在下一个示例中向列表中再添加五个项目。\n\
  \n```bash\n$ cat testing111 #!/bin/bash\n\n# This is the basic for command in Linux\n\
  \nlist=\"Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado\
  \ Florida Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee\
  \ Utah Maine Missouri Minnesota\" list=$list\" Idaho\"\nlist=$list\" Oregon\" list=$list\"\
  \ Montana\" list=$list\" Delaware\"\n\nfor state in $list do\n\necho \"I am planning\
  \ to continue my travel circle across the United States in the summer. The next\
  \ state I will visit is $state\"\n\ndone\n\n$bash -f main.sh\n```\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是\
  \ Alabama\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是 Texas\n\n此输出继续列出各个州，直到最后一个：\n\n我计划在夏天继续我的全美旅行。我下一个要访问的州是\
  \ Delaware\n\n有一种方法为列表生成自定义用途的值，以便使用特定命令的输出。\n\n```bash\n$ cat testing111 #!/bin/bash\n\
  \n# I will read values from files\n\nmyfile=\"states\"\n\nfor state in `cat $myfile`\
  \ do\n\necho \"I am planning to continue my travel circle across the United States\
  \ in the summer. The next state I will visit is $state\"\n\ndone\n\n$cat states\
  \ Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado Florida\
  \ Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee Utah\
  \ Maine Missouri Minnesota Idaho Oregon Montana Delaware\n```\n\n### while 命令\n\n\
  `while` 命令是 `if-then` 语句和 Linux `for` 循环的结合。允许允许定义一个命令来测试条件，然后循环执行一组命令直到达到零退出状态。它会在每次迭代开始时分析测试命令。当达到非零退出状态时，`while`\
  \ 命令将停止执行该组命令。\n\n```bash\n$ cat test10 #!/bin/bash\n\n# This is a while command\
  \ test in Linux var15=20\n\nwhile [ $var15 -gt 0 ] do\n\necho This is $var15 in\
  \ the while loop. var15=$[ $var15 - 1 ]\n\ndone\n\n$bash -f main.sh\n```\n\nThis\
  \ is 20 in the while loop. This is 19 in the while loop. This is 18.\n\n循环继续到最后一行：\n\
  \nThis is 1 in the while loop.\n\n## 多个测试命令\n\n你可以在 `while` 循环中封装多个测试命令。\n\n```bash\n\
  $ cat test1133 #!/bin/bash\n\n# Now I am testing a multicommand while loop in Linux\
  \ shell var15=20\n\nwhile echo $var15 [ $var15 -ge 0 ] do\n\necho \"This operation\
  \ is being conducted inside the while loop.\" var15=$[ $var15 - 1 ]\n\ndone\n\n\
  $bash -f main.sh\n```\n\n20\n\nThis operation is being conducted inside the while\
  \ loop. 19\n\nThis operation is being conducted inside the while loop.\n\n18\n\n\
  This operation is being conducted inside the while loop. 17\n\n这将持续直到达到最后一个数字：\n\
  \nThis operation is being conducted inside the while loop. 0\n\nThis operation is\
  \ being conducted inside the while loop.\n\n-1\n\n第一个测试命令显示 `var15` 变量当前值。第二个命令将使用测试命令来获取\
  \ `var15` 变量的值。`echo` 语句在循环内返回一条简单的消息，表示循环已结束。\n\n### until 命令\n\n`until` 命令的作用与\
  \ `while` 命令相反。它要求指定一个测试命令，该命令将产生非零退出状态，此时 bash shell 将执行 `while` 循环命令。\n\n然而，与\
  \ `while` 命令类似，`until` 语句也可以包含多个测试命令，并且最后一个命令的退出状态是决定因素。\n\n```bash\n$ cat test1222\
  \ #!/bin/bash\n\n# In this code block I will be using the until command var15=100\n\
  \nuntil [ $var15 -eq 0 ] do\n\necho You are seeing the operations of the until command.\
  \ The next digit in the loop is $var15\n\nvar15=$[ $var15 - 5 ] done\n\n$bash -f\
  \ main.sh\n```\n\nYou are seeing the operations of the until command. The next digit\
  \ in the loop is 100\n\nYou are seeing the operations of the until command. The\
  \ next digit in the loop is 95\n\nYou are seeing the operations of the until command.\
  \ The next digit in the loop is 90\n\n并持续，直到达到最后一个数字：\n\nYou are seeing the operations\
  \ of the until command. The next digit in the loop is 5\n\n示例已成功测试了 `var15` 变量以确定循环何时停止\
  \ - 当变量值降到零时，`until` 命令立即停止。\n\n\n\n\n你正在看到 `until` 命令的操作。循环中的下一个数字是 95\n\n90\n\n\
  再次，这将持续到循环中的最后一个数字：\n\n你正在看到 `until` 命令的操作的操作。循环中的下一个数字是 5\n\n0\n\n## 嵌套循环\n\n循环语句可以在循环内部使用另一个命令，包括同一个循环的其它命令。这个过程被称为嵌套循环。你将在一个迭代内部包含另一个迭代，这将使得命令运行的次数成倍数增加。请参看示例以掌握如何嵌套循环。\n\
  \n```bash\n$ cat test1444 #!/bin/bash\n\n# 以下代码块展示了 (( x = 1; x <= 7; x++ )) 循环的嵌套\n\
  \ndo\n\necho \"You are seeing the operations of the until command. The next digit\
  \ in the loop is $x:\"\n\nfor (( y = 1; y <= 7; y++ )) do\n\necho \" Now you are\
  \ seeing what is going on inside loop: $y\" done\n\ndone\n```\n\n```bash\n$bash\
  \ -f main.sh\nYou are seeing the operations of the until command. The next digit\
  \ in the loop is 1:\nNow you are seeing what is going on inside loop: 1 Now you\
  \ are seeing what is going on inside loop: 2\nAnd so on, finishing with\nNow you\
  \ are seeing what is going on inside loop: 7\nYou are seeing the operations of the\
  \ until command. The next digit in the loop is 2:\nNow you are seeing what is going\
  \ on inside loop: 1 Now you are seeing what is going on inside loop: 2 Again, this\
  \ will continue until it ends with\nNow you are seeing what is going on inside loop:\
  \ 7\nYou are seeing the operations of the until command. The next digit in the loop\
  \ is 3:\nNow you are seeing what is going on inside loop: 1 Now you are seeing what\
  \ is going on inside loop: 2 Ending with:\nNow you are seeing what is going on inside\
  \ loop: 7\nYou are seeing the operations of the until command. The next digit in\
  \ the loop is 4:\nNow you are seeing what is going on inside loop: 1 Now you are\
  \ seeing what is going on inside loop: 2 Ending with:\nNow you are seeing what is\
  \ going on inside loop: 7\nThe entire cycle continues through the loop, until it\
  \ reaches: Now you are seeing what is going on inside loop: 7\n```\n\n你可以尝试修改循环中的数字来收缩或扩大两个循环的大小。通过改变循环的数字，你将能够改变循环的行为。\n\
  \n```bash\n$ cat test1444 #!/bin/bash\n\n# 以下代码块展示了 (( x = 1; x <= 3; x++ )) 循环的嵌套\n\
  \ndo\n\necho \"You are seeing the operations of the until command. The next digit\
  \ in the loop is $x:\"\n\nfor (( y = 1; y <= 5; y++ )) do\n\necho \" Now you are\
  \ seeing what is going on inside loop: $y\" done\n\ndone\n```\n\n```bash\n$bash\
  \ -f main.sh\nYou are seeing the operations of the until command. The next digit\
  \ in the loop is 1:\nNow you are seeing what is going on inside loop: 1 Repeated\
  \ to:\nNow you are seeing what is going on inside loop: 5\nYou are seeing the operations\
  \ of the until command. The next digit in the loop is 2:\nNow you are seeing what\
  \ is going on inside loop: 1 Repeated to:\nNow you are seeing what is going on inside\
  \ loop: 5\nYou are seeing the operations of the until command. The next digit in\
  \ the loop is 3:\nNow you are seeing what is going on inside loop: 1 And finishing\
  \ on:\nNow you are seeing what is going on inside loop: 5\n```\n\n嵌套循环在外层循环的迭代中遍历值。对于两个循环来说，`do`\
  \ 和 `done` 命令没有区别。你可以通过配对 `for` 循环和 `while` 循环来创建嵌套循环。\n\n```bash\n$ cat test15\
  \ #!/bin/bash\n\n# 这是我们如何将 for 循环放在 while 循环中 var15=15\n\nwhile [ $var15 -ge 0 ]\
  \ do\n\necho \"You are seeing the operations of nesting loops. The next digit in\
