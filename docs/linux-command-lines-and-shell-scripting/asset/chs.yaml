  \n\n\n| none | 126068 | 0 |  | 1260680% /dev/shm |\n\n`/dev/root51200002417728`\n\
  \n2702272 47% /`\n\n如果你想查看空闲内存，你需要输入 `free` 命令。\n\n```bash\nlinuxbox1:~$ free\n\
  totalusedfreeshared buff/cacheavailable\n| Mem: | 252140 | 5252 |  | 245980 | 8\
  \ | 908243104 |\n| Swap: | 0 | 0 | 0 |  |  |  |\n```\n\n当你完成工作并想要结束终端会话时，只需在命令行中输入\
  \ `exit` 并关闭终端会话即可。\n\n## 基础命令\n\n本章这一节将带你了解 Unix 命令和工具。位于行的第一个命令是 `cat` 命令，它用于显示文件的内容。我将使用系统信息文件，然后返回\
  \ Shell 提示符。这是最容易理解的命令之一。你可以获取一个或多个文件的输出并阅读它们。\n\n注意：从现在开始，我将使用 Fedora 发行版测试命令。\n\
  \n## Linux 中的文件导航\n\n你们很多人可能对图形用户界面很熟悉。在那个系统中进行导航非常容易。你可以看到一个完美的文件树来查看系统上的不同文件。你可以在几秒钟内打开并在它们之间导航。然而，在\
  \ Linux 中情况并非如此。Linux 操作系统中没有文件的图形化显示。最好将 Linux 文件系统看作一个迷宫。你当前所在的目录就是当前目录。你上方的目录是父级目录。你可以使用\
  \ `pwd` 命令显示当前工作目录。\n\n```bash\n[gha@localhost ~]$ pwd\n/root\n```\n\n### ls 命令\n\
  \n`ls` 命令将显示系统中某个目录的目录。默认是当前目录。你可以使用 `ls -1` 命令显示更长格式的文件列表。你也可以使用 `ls –F` 命令显示文件类型的信息。\n\
  \n```bash\n[gha@localhost ~]$ ls bench.py hello.c\n```\n\n你可以使用 `cd` 命令更改当前工作目录。只需在\
  \ shell 中输入 `cd` 加上你想要工作的目录路径即可。路径是沿着树的分支到达你目标目录的通用路径。你可以通过两种方式指定路径。第一种是绝对路径。绝对路径从根目录开始，并逐分支跟踪树结构，直到文件或目标目录的路径完成。以你系统中的一个目录为例，大多数系统程序都安装在该处。\n\
  \n```bash\n[gha@localhost ~]$ cd /usr/downloads\n[gha@localhost downloads]$ pwd\n\
  /usr/downloads\n[gha@localhost downloads]$ ls\n```\n\n该命令将列出该目录下的文件。`ls` 命令是 Linux\
  \ 操作系统广泛使用的命令之一。通过这个命令的帮助，你可以查看目录的内容并确定文件的数量和目录属性。正如你所看到的，你可以输入 `ls` 命令查看当前工作目录中包含的文件和子目录列表。\n\
  \n```bash\n[gha@localhost ~]$ ls /usr\nbin games include lib lib64 libexec local\
  \ sbin share src tmp\n```\n\n你可以使用以下命令列出用户目录和 `/usr`。\n\n```bash\n[gha@localhost\
  \ ~]$ ls ~ /usr\n/root:\nbench.py hello.c\n/usr:\nbin games include lib lib64 libexec\
  \ local sbin share src tmp\n```\n\n你可以为 `ls` 命令添加 `-1` 来更改显示格式并显示更多细节。通过在同一个 `ls`\
  \ 命令中添加 `-1`，你可以将输出更改为长格式。\n\n## 选项和参数命令\n\n大多数 Linux 命令由一个连字符前的一个字符组成。然而，有些命令较长，带有两个连字符后跟一个单词，例如\
  \ GNU 支持项目中的命令。某些命令甚至允许将两个或多个较短选项标记在一起。在下方的示例中，我们将为 `ls` 命令提供两个选项——第一个（`l`）将减少长格式输出，而第二个（`t`）将按修改时间对结果排序。\n\
  \n让我们看看 `–l` 命令的结果。\n\n```bash\n[gha@localhost ~]$ ls -l total 8\n-rw-r--r-- 1 root\
  \ root 114 Dec 26 15:19 bench.py\n-rw-r--r-- 1 root root 185 Sep 9 2018 hello.c\n\
  ```\n\n现在我将 `t` 添加到 `–l` 中，如果可以延长输出，则延长它。\n\n```bash\n[gha@localhost ~]$ ls -lt\
  \ total 8\n-rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py\n-rw-r--r-- 1 root root\
  \ 185 Sep 9 2018 hello.c\n```\n\n你可以使用 `reverse` 命令反转输出顺序。该命令的语法如下所示：\n\n```bash\n\
  [gha@localhost ~]$ ls -lt --reverse total 8\n-rw-r--r-- 1 root root 185 Sep 9 2018\
  \ hello.c\n-rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py\n```\n\n让我们来看一些可以与 `ls`\
  \ 命令配合使用的杂项命令。\n\n- `ls a` 用于列出所有以点开头且具有正确名称的文件列表。它还会产生那些通常被列为隐藏的文件。\n- `ls --all`\
  \ 是相同命令的长格式选项。\n- `ls –d` 用于指定一个目录并显示其内容。它不显示目录本身。你可以将此命令与 `–l` 命令配合使用，以探索有关目录的细节而非内容。\n\
  - `ls --directory` 用于产生关于目录或其内容的更多细节。\n- `ls –F` 用于在列出的名称末尾添加特定的指示字符，例如名称后的正斜杠表示已在目录中。\n\
  - `ls --classify` 用于在末尾添加指示字符。\n- `ls --human-readable` 用于以易读格式显示，而不是以字节为单位。\n-\
  \ `ls –S` 用于按大小排序。\n- `ls –t` 用于按修改时间排序。\n\n## 查看文件类型\n\n当我们开始探索系统时，你应该学习的最有用事情之一就是查看文件。为了做到这一点，我们使用\
  \ `file` 命令来帮助我们。Linux 不需要通过文件名来指定类型，例如你预期的 `.jpg` 文件包含图像。当 `file` 命令被调用时，它会打印出文件的描述。\n\
  \n```bash\n[gha@localhost ~]$ file image.jpg\n```\n\n有很多文件类型，而且像许多操作系统一样，Linux 将一切都视为文件。\n\
  \n### less 命令\n\n我们使用 `less` 命令查看文本文件。Linux 操作系统包含许多肉眼可读的文件，`less` 命令为我们提供了阅读它们的简单方法。文本文件需要检查，因为其中一些充满了系统设置。你会看到这些被标记为配置文件，而且它们都以特定的格式存储。当你阅读这些文件时，你将对\
  \ Linux 的运行方式有一个了解，并且你会发现系统的某些程序（称为脚本）是以相同方式存储的。\n\n一旦执行了 `less` 命令，你就可以后滚动文本文件。假设你正在查看定义系统账户的文件。你可以使用此命令：\n\
  \n```bash\n[gha@localhost ~]$ less /etc/passwd\n```\n\n\n\n\n\n* 使用 `n` 搜索不同字符的下一个出现位置\n\
  * 使用 `/characterstosearchforward` 跳转到字符在页面上的下一次出现位置\n* 使用 `q` 退出 less 命令\n\n你的 Linux\
  \ 文件系统与其他 UNIX 类系统相似，而《Linux 文件系统层级标准》（Linux File System Hierarchy Standard）是规定该设计的发布标准。以下是一些你可以探索的目录：\n\
  \n* `/` 是根目录，充当所有事物起点的角色。\n* `/bin` 是根目录，包含了系统启动和运行必须的二进制文件或程序。\n* `/boot` 是包含 Linux\
  \ 内核的根目录。这是引导加载程序所在，包含了系统启动所需的驱动程序。\n* `/var` 是根目录，存储最可能变化的数据的地方。你在这个目录中会发现许多池文件、数据库和用户邮件。\n\
  * `/var/log` 是包含不同日志文件的根目录。它还包含某些系统活动记录。封装在该目录内的文件非常重要。你应该定期监控它。最有用的是\n    * `/var/log/messages`。在某些系统中，你可能需要以超级用户（root）身份登录才能访问日志文件。\n\
  * `/imp` 用于存储由许多程序创建的临时文件。某些配置可能会导致目录在每次重启系统时清空。\n* `/usr` 是你 Linux 操作系统中最大的目录。它可能包含普通用户使用的程序和某些支持文件。\n\
  * `/proc` 是一个特殊目录，因为它不是用于在硬盘上存储文件的系统。相反，它是内核维护的虚拟文件系统，其中的文件是内核的快照，可读的，并会告诉你内核是如何看待计算机的。\n\
  * `/root` 如果你以 root 账户操作，这是主目录。\n* `/tmp` 用于存储临时文件。请注意，某些配置可能会每次系统重启时清空此目录。\n* `/usr/bin`\
  \ 带有由 Linux 发行版安装的一些可执行程序。该目录包含许多程序的情况并不罕见。\n* `/usr/lib` 是位于 `/usr/bin` 中不同程序所需的共享库。\n\
  * `/usr/sbin` 加载了许多系统管理程序。\n* `/usr/local` 是一个树结构，包含了不属于实际发行版但系统级使用仍需要的程序。从源代码编译的程序进入\
  \ `/usr/local/bin`，你会在新安装的 Linux 系统中找到它。然而，在系统管理员为其添加文件之前，它将保持为空。\n* `/usr/share`\
  \ 包含了 `/usr/bin` 中程序使用的共享数据。该目录包含了图标、配置文件、音频文件和屏幕背景等不同内容。\n* `/usr/share/doc` 包含按包组织的文档文件。\n\
  * `/lib` 填充满了核心系统程序使用的共享库文件。这些程序类似于 Windows 操作系统中的 DLL。\n* `/mnt` 用于旧版本的 Linux 操作系统。`/mnt`\
  \ 目录为系统中可移动设备提供了某些挂载点。条件是设备应该手动挂载。\n* `/lost+found` 用于在文件系统损坏事件后进行部分恢复。在你的系统遇到问题之前，该目录一直保持为空。\n\
  * `/media` 用于现代 Linux 操作系统。`/media` 目录包含 CD-ROM、USB 驱动器和其他任何自动挂载的设备的挂载点。\n\n![](img/image00296.jpeg)\
  \ 第 3 章文件与目录命令\n\n本章将向你展示如何使用 Linux 操作系统中的命令查看文件和文件夹并移动它们。你可以更改文件夹和文件的名称。某些任务是简单的。当你使用命令移动时，你比使用图形用户界面拥有更多的控制权和灵活性。使用命令行来做简单的事情更容易，但你需要它来完成更复杂的事情。在图形用户界面中，将\
  \ HTML 文件从一个目录移动到另一个是困难的。在命令行系统中，移动文件要容易得多。首先，我将讨论你在 Linux 中可以使用一些特殊字符。然后，我将讨论你可以用于更改文件和目录的命令。\n\
  \n## 特殊字符\n\n当你与他人讨论 Linux 时，你可能会听到 Linux 用户在操作过程中遇到的一些特殊字符。每个特殊字符都有其职责，了解它们将会让你的工作变得更容易。\n\
  \n* `*` 技术上称为星号（asterisk）。它用于正则表达式和作为通配符（glob character）。\n* `‘` 技术上称为 tick 或单引号。它用于字面量字符串。\n\
  * 特殊字符 `.` 技术上称为点（dot）。它用于表示你工作的当前目录、主机名或文件分隔符。\n* `$` 技术上称为美元符号。它用于表示变量或表示行尾。\n\
  * `\\` 技术上称为反斜杠（backslash）。它用于宏和字面量。\n* `/` 技术上称为正斜杠（forward slash）。它作为搜索命令或目录分隔符。\n\
  * `!` 技术上称为 bang。它用于命令历史。\n* `|` 技术上称为管道（pipe）。它用于命令管道。\n* `_` 技术上称为下划线（underscore\
  \ 或 under）。它用于特定的空格占位。\n* `` ` `` 技术上称为反引号（backtick 或 backquote）。它用于命令。\n* `“` 技术上称为双引号（double\
  \ quote）。它用于字面量字符串。\n* `{}` 技术上称为大括号（braces）。它们用于块。\n* `^` 技术上称为脱字符（caret）。它用于表示行首。\n\
  * `[]` 技术上称为方括号（squares）。它们用于范围。\n* `~` 技术上称为波浪号（squiggle 或 tilde）。它作为目录快捷。\n* `#`\
  \ 技术上称为井号（pound、hash 或 sharp）。它用于注释。\n\n## 命令行编辑\n\n在探索 Linux shell 时，你会发现可以通过方向键在\
  \ shell 中移动。这在大多数操作系统中都是标准的。了解 Linux 的标准快捷键是一个好主意\n\n* `CTRL-B` 用于将光标在屏幕上向左移动。\n\
  * `CTRL-F` 用于将光标在屏幕上向右移动。\n* `CTRL-E` 用于将光标移动到行的末尾。\n* `CTRL-A` 用于将光标移动到行的开头。\n\
  * `CTRL-P` 用于查看屏幕上之前的命令。它用于将光标向上移动。\n* `CTRL-N` 用于将光标向下移动，它也用于查看下一个命令。\n* `CTRL-K`\
  \ 用于删除从光标到行尾的所有内容。\n* `CTRL-W` 用于删除光标前一个单词。\n* `CTRL-U` 用于删除从光标到行首的所有内容。\n* `CTRL-Y`\
  \ 用于粘贴之前通过 `CTRL-U` 命令剪掉的文本。\n\n## 目录命令\n\n`mkdir` Linux 命令用于创建目录。它的工作方式如下：\n\n\
  ```bash\nmkdir directoryname\n```\n\n### cp 命令\n\n另一个命令 `cp` 用于复制目录和文件。你可以以不同的方式使用它，例如：\n\
  \n```bash\ncp file1 file2\ncp files… directoryname\n```\n\n你可以在 `cp` 命令中使用以下选项。\n\
  \n\n\n\n\n- `cp` 命令选项 `-a` 或 `--archive` 用于复制目录和文件及其所有属性，包括权限和所有关系。通常情况下，复制的文件将采用执行复制操作的用户默认属性。\n\
  - `cp` 命令选项 `-u` 或 `--update` 用于当你从一个目录复制到另一个目录时，且你复制的文件在目标目录不存在或比目标目录中的文件新。\n-\
  \ `cp` 命令选项 `-v` 或 `--verbose` 用于在执行复制时显示信息消息。\n- `cp` 命令选项 `-i` 或 `--interactive`\
  \ 用于在覆盖现有文件之前，它会提示用户进行确认。如果你没有指定该选项，`cp` 命令将覆盖现有文件，这对于你的文档记录是不利的。\n- `cp` 命令选项 `-r`\
  \ 或 `--recursive` 用于递归复制内容和文件。当你复制目录时，需要此特定选项。\n\n### `cp` 命令示例\n\n- Linux 命令 `cp\
  \ item1 item2` 将将 `item1` 的文件复制到 `item2` 的文件中。如果 `item2` 存在，它将被 `item1` 的内容覆盖。如果它不存在，系统将创建它。\n\
  - Linux 命令 `-i item1 item2` 将将 `item1` 的文件复制到 `item2` 的文件中。然而，唯一的例外是，如果 `item2`\
  \ 存在，在覆盖文件之前会提示用户。\n- Linux 命令 `item1 item2 dir1` 将将 `item1` 和 `item2` 的内容复制到 `dir1`。在执行此命令之前，目录\
  \ `dir1` 必须存在。\n- Linux 命令 `cp dir1* dir2` 使用通配符。它将 `dir1` 的所有文件复制到 `dir2`。条件是在执行命令之前\
  \ `dir2` 必须存在。\n- Linux 命令 `-r dir1 dir2` 将将目录 `dir1` 复制到目录 `dir2`。如果 `dir2` 不存在，它将被创建并包含与目录\
  \ `dir1` 相同的内容。\n\n### `mv` 命令\n\nLinux 命令 `mv` 根据用户的使用方式对文件进行移动和重命名。执行命令后，原始文件名将不再存在。`mv`\
  \ 命令用法与 `cp` 命令相同。\n\n```\nmv file1 file2\n```\n\n就像 `cp` 命令一样，`mv` 命令也带有不同的选项，如下：\n\
  - `mv` 命令选项 `-u` 或 `--update` 用于当你从一个目录移动到另一个目录时，且你移动的文件在目标目录不存在或比目标目录中的文件新。\n-\
  \ `mv` 命令选项 `-v` 或 `--verbose` 用于在执行移动时显示信息消息。\n- `mv` 命令选项 `-i` 或 `--interactive`\
  \ 用于在覆盖现有文件之前，它会提示用户进行确认。如果你没有指定该选项，`mv` 命令将覆盖现有文件，这对于你的文档记录是不利的。\n\n### `mv` 命令示例\n\
  \n- Linux 命令 `mv item1 item2` 将 `item1` 的文件移动到 `item2` 的文件中。如果 `item2` 存在，它将被 `item1`\
  \ 的内容覆盖。如果不存在，系统将创建它。在任何情况下，文件 `item1` 都将不再存在。\n- Linux 命令 `mv -i item1 item2` 将\
  \ `item1` 的文件移动到 `item2` 的文件中。然而，唯一的例外是，如果 `item2` 存在，在覆盖文件之前会提示用户。\n- Linux 命令\
  \ `mv item1 item2 dir1` 将 `item1` 和 `item2` 的内容移动到 `dir1`。在执行此命令之前，目录 `dir1` 必须存在。\n\
  - Linux 命令 `mv dir1* dir2` 使用通配符。它将 `dir1` 的所有文件移动到 `dir2`。条件是在执行命令之前 `dir2` 必须存在。\n\
  - Linux 命令 `mv dir1 dir2` 将目录 `dir1` 移动到目录 `dir2`。如果 `dir2` 不存在，你必须创建并将 `dir1` 的内容移动到\
  \ `dir2`。\n\n### `rm` 命令\n\n`rm` 命令用于移除或删除目录和文件，如下：\n\n```\nrm file...\n```\n\n\
  在此命令中，`file`是一个或多个目录和文件的名称。使用此命令可能是非常危险的。一旦你用 `rm` 命令删除了某些东西，你就永远无法找回它。Linux 假设你是故意删除该文件的，它不会把文件还给你。因此，你应该谨慎使用它。假设你想删除某些目录中的\
  \ HTML 文件。\n\n所以，当你使用 `rm` 命令配合通配符时，你应该先用 `ls` 命令测试通配符，以查看你将从系统中删除的文件内容。你可以使用方向键回命令，然后将其替换为\
  \ `rm`。\n\n- `rm` 命令选项 `-r` 或 `--recursive` 用于递归删除目录。这意味着如果你要删除的目录有子目录，你也可以删除它们。如果你想删除一个目录，应该指定此选项。\n\
  - `rm` 命令选项 `-f` 或 `--force` 用于忽略不存在的文件。它不会提示。它倾向于覆盖 `-interactive` 选项。\n- `rm`\
  \ 命令选项 `-v` 或 `--verbose` 用于在执行删除时显示信息消息。\n- `rm` 命令选项 `-i` 或 `--interactive` 用于在删除现有文件之前，会提示用户进行确认。如果你没有指定该选项，`rm`\
  \ 命令将静默删除现有文件，这对于你的文档记录是不利的。\n\n### `rm` 命令示例\n\n- Linux 命令 `rm item1` 将静默删除 `item1`\
  \ 的文件。\n- Linux 命令 `rm -i item1` 将删除 `item1` 的文件。然而，唯一的例外是，在删除文件之前会提示用户。\n- Linux\
  \ 命令 `rm item1 dir1` 将删除 `item1` 和 `dir1` 的内容。在执行此命令之前，目录 `dir1` 必须存在。\n- Linux\
  \ 命令 `rm -rf item1 dir1` 的工作与上述相同，例外是如果 `item1` 和 `dir1` 都不存在。\n\n# 第 4 章 命令实践\n\
  \n![](img/image0297.jpeg)\n\n当你完成了所有任务，现在应该结束了。每个人都有许多未知的选项和参数。在这里，我们将向你展示如何在命令行中使用更多命令，以帮助变得更加熟悉。\n\
  \n### `type` 命令\n\n这是一个 Linux 内置命令，用于显示 shell 将执行的典型类型。查看如何使用它。\n\n```\n[gha@localhost\
  \ ~]# type type\ntype is a shell builtin\n\n[gha@localhost ~]# type ls\nls is aliased\
  \ to `ls --color=auto’\n\n[gha@localhost ~]# type cp\ncp is /bin/cp\n[gha@localhost\
  \ ~]# type mv\nmv is /bin/mv\n[gha@localhost ~]# type rm\nrm is /bin/rm\n[gha@localhost\
  \ ~]# type cd\ncd is a shell builtin\n\n[gha@localhost ~]# type help\nhelp is a\
  \ shell builtin\n```\n\n你可以看到这些不同命令有不同的结果。\n\n### `which` 命令\n\n有时特定的系统上安装了多个版本的可执行程序。虽然这在桌面系统中并不常见，但在大型服务器上并不罕见。你可以使用\
  \ `which` 命令确定可执行程序的确切位置。\n\n```\n[gha@localhost ~]# which ls\nls=’ls --color=auto’\n\
  /bin/ls\n\n[gha@localhost ~]# which help\n/usr/bin/which: no help in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin)\n\
  ```\n\n`which` 命令对可执行程序有效，但对于作为可执行程序的内置命令或别名无效。当你对内置命令使用 `which` 命令时，你会得到无响应或一个巨大的错误信息。\n\
  \n# 命令文档\n\n### `help` 命令\n\nBash shell 为内置命令提供了一个内置帮助设施。如果你想使用它，可以输入 `help` 后跟内置命令的名称。参见下示例。\n\
  \n\n\n\n\n```\n[gha@localhost ~]$ help cd cd: cd [-L|[-P [-e]] [-@]] [dir]\n```\n\
  \n更改 shell 工作目录。\n\n将当前目录更改为 `DIR`。默认的 `DIR` 是 `HOME` Shell 变量的值。\n\n`CDPATH` 变量用于定义通往\
  \ `DIR` 所在目录的搜索路径。`CDPATH` 使用冒号（`:`）分隔来指示备选文件名。空名称表示当前目录，如果目录名称前面有斜杠（`/`），则不使用 `CDPATH`。\n\
  \n详细内容比我在这里提到的要多得多。为了节省空间，我进行了精简。你可以在终端上输入 `cmd` 命令，查看在操作 Linux 操作系统遇到困难时，`help`\
  \ 命令是如何帮助帮助的。当你在命令语法的描述中看到方括号 `[]` 时，应该记住它们仅表示可选项目。如果你在描述中看到竖线字符 `|`，它表示互斥的项目。某些可执行程序支持\
  \ `--help` 选项。应用该选项时，它会显示该命令支持的语法和相关选项的详细描述。\n\n```\n[gha@localhost ~]$ mkdir --help\n\
  ```\n\n用法：`mkdir [OPTION]... DIRECTORY...`\n\n如果 `DIRECTORY(ies)` 不存在，则创建它们。\n\n\
  长选项的强制性参数对于短选项也是强制性的。\n\n`-m, --mode=MODE` 设置文件模式（类似于 `chmod`），而不是 a=rwx - umask\n\
  \n### `man` 命令\n\n大多数供命令行使用的可执行程序都提供一份正式的文档，被称为 `man` 页面（手册页）或用户手册页。Linux 上加载了一个名为\
  \ `man` 的特殊分页程序来查看详情。你可以输入 `man` 命令，然后跟上命令的标题。man 页面的格式各异，包含命令的标题或语法摘要、列表以及命令目的的描述。man\
  \ 页面不包含示例，它们旨在作为特殊的参考资料，而不是教程。请参考下方的示例。\n\n```\n[gha@localhost ~]$ man ls\n```\n\
  \nLS(1) 用户命令 LS(1)\n\nNAME\n\nls - 列出目录内容\n\nSYNOPSIS\n\nls [OPTION]... [FILE]...\n\
  \nDESCRIPTION\n\n列出关于 `FILEs`（默认为当前目录）的信息。\n\n如果没有指定 `-cftuvSUX` 或 `--sort` 中的任何一个，则按字母顺序对条目排序。\n\
  \n在大多数 Linux 操作系统中，`man` 使用 `less` 显示手册，这样在页面显示时所有熟悉的 `less` 命令都可以生效。`man` 显示的手册有不同的章节，涵盖了用户命令和系统管理命令。此外，它还涵盖了文件格式、编程接口等更多内容。手册的完整布局如下：\n\
  \n*   `man` 命令的第 1 节将显示用户命令。\n*   `man` 命令的第 2 节将显示内核系统调用的编程接口。\n*   `man` 命令的第\
  \ 3 节将显示 C 库的编程接口。\n*   `man` 命令的第 4 节将显示特殊文件，如设备节点和驱动程序。\n*   `man` 命令的第 5 节将显示文件格式。\n\
  *   `man` 命令的第 6 节将显示游戏和屏幕保护等娱乐内容的详情。\n*   `man` 命令的第 7 节将显示杂项内容。\n*   `man` 命令的第\
  \ 8 节将显示与系统管理相关的命令。\n\n有时，你可能需要查看手册的特定章节以找到你正在寻找的内容。如果不指定章节编号，你始终会在第 1 节中获得特定匹配的实例。\n\
  \n### `apropos` 命令\n\n根据特定的搜索词在 man 页面列表中搜索可能的匹配项。这种粗略的方法通常很有帮助。语法如下：\n\n```\n[gha@localhost\
  \ ~]$ apropos floppy\n```\n\n### `whatis` 命令\n\nLinux 中的 `whatis` 命令用于显示 man 页面的名称和简短描述。语法如下：\n\
  \n```\n[gha@localhost ~]$ whatis ls\n```\n\nLinux 发行版自带的 man 页面标记为参考文档而非教程。许多 man\
  \ 页面非常难以阅读，以至于我们大多数人会直接跳过它们，不再多看一眼。然而，最难的 man 页面是 `bash` 的。它们冗长、复杂且几乎不可读。但是，它们的长度就成了它们的优势，因为其中包含了许多你可以增加知识的有用信息。当你读完一页后，它就会开始变得意义。\n\
  \n### `info` 命令\n\nGNU 项目提供了 `info` 页面作为 man 页面的替代方案。一个名为 `info` 的读取程序显示这些页面，这些页面的链接方式与网页相同。例如：\n\
  \n```\n[gha@localhost ~]$ info ls\n```\n\n下一步：dir 运行，向上：目录列表\n\n10.1 ‘ls’:列出目录内容\n\
  \n===============================\n\n在 `ls` 程序中，你将找到关于任何类型文件的信息，包括目录。按照惯例，接受选项和文件参数的任意混合。\n\
  \n默认情况下，`ls` 将列出也是目录的非选项命令行参数的内容，但这不是递归列表，且以 `.` 开头的文件会被排除。\n\n`info` 程序将读取 `info`\
  \ 文件——这些结构进入单个节点，每个节点包含一个主题。`info` 文件中的超链接帮助用户在节点之间移动，这些超链接由开头的星号 `*` 标识。通常，激活这些超链接需要用户用光标点击它们并按回车。`info`\
  \ 命令提供了这些信息：\n\n*   `info` 菜单中的 `?` 键将显示帮助菜单。\n\n\n\n\n\nI/O 重定向可以帮助你重新定义输出的方向。要将标准输出重定向到文件而不是屏幕，你需要使用重定向操作符并在后面加上文件名。这对于某些命令的输出存储在文件中非常有用。你可以告诉\
  \ shell 将 `ls` 命令的输出重定向到名为 `ls-output.txt` 的文件，而不是屏幕。\n\n```\n[gha@localhost ~]$\
  \ ls -1 /usr/bin > ls-pt.txt\n```\n我创建了 `/usr/bin` 目录的详细列表，并将结果发送到了文件 `ls-pt.txt`\
  \ 中。\n\n# 键盘技巧\n\nUnix 是一个为热爱打字的人设计的操作系统。命令行不允许使用鼠标操作。Linux 命令可能非常繁琐，因此你应该学习许多键盘技巧。\n\
  \n### 文本修改\n\n以下列表显示了你如何在 Linux 命令行中修改文本。`killing”（杀死）和 `yanking”（拉取）术语分别指剪切和粘贴。\n\
  \n- 键盘技巧 `CTRL-D` 将帮助你删除光标当前位置的字符。\n- 键盘技巧 `CTRL-T` 将帮助你交换光标当前位置字符与前一个字符的位置。\n-\
  \ 键盘技巧 `Alt-U` 将帮助你将光标当前位置到单词结束点的字符转换为大写写。\n- 键盘技巧 `Alt-L` 将帮助你将光标当前位置到单词结束点的字符转换为小写。\n\
  - 键盘技巧 `Alt-T` 将帮助你交换光标当前位置单词与前一个单词的位置。\n- 键盘技巧 `CTRL-K` 将帮助你删除光标当前位置到行尾的文本。\n-\
  \ 键盘技巧 `CTRL-U` 将帮助你删除光标当前位置到行首的文本。\n- 键盘技巧 `ALT-D` 将帮助你删除光标当前位置到当前单词末的文本。\n- 键盘技巧\
  \ `ALT-Backspace` 将帮助你删除光标当前位置到当前单词开头的文本。如果光标位于单词开头，它还会删除上一个单词。\n- 键盘技巧 `CTRL-Y`\
  \ 将帮助从剪贴板（kill-ring）中提取文本并粘贴到光标当前位置。\n\n# 全命令\n\nshell 帮助你的另一种方式是通过补全。当你输入命令时按下\
  \ Tab 键，就会发生这种情况。当你输入命令的一半时，可以按 Tab 键完成命令。需要记住的一点是你不要按 Enter 键。\n\n### 补全命令\n\n\
  - 键盘技巧 `Alt-$` 将帮助显示所有可能的补全列表。你也可以通过双击 Tab 键来实现。这简单得多。\n- 键盘技巧 `Alt-*` 将帮助你插入可能的补全内容。当你打算使用多个匹配项时，这非常有用。\n\
  \n# 历史记录\n\nBash 会维护你输入命令的历史记录。命令列表保存在主目录下一个名为 `.bash_history` 的文件中。历史记录功能对于减少所需的打字量非常有用，特别是当它与命令行编辑结合使用时。这里是\
  \ `history` 命令的语法。\n\n```\n[gha@localhost ~]$ history | less\n```\nBash 默认存储你最后输入的\
  \ 500 条命令。假设你想找到以前列出 `/usr/bin` 的命令。以下是实现方法。\n\n```\n[gha@localhost ~]$ history\
  \ | grep /usr/bin\n```\n在浏览 `history` 命令时，你可以使用一系列按键组合。\n\n- 你可以使用快捷键 `CTRL-P` 移动到最新的历史记录项。此操作与向上方向键相同。\n\
  - 你可以使用快捷键 `CTRL-N` 移动到下一条历史记录项。此操作与向下方向键相同。\n- 你可以使用快捷键 `ALT->` 移动到历史列表的底部（即当前命令行位置）。\n\
  - 你可以使用快捷键 `ALT-<` 移动到历史列表的起点。\n- 你可以使用快捷键 `CTRL-R` 进行反向增量搜索。此选项从当前命令行开始向上历史列表进行增量搜索。\n\
  - 你可以使用快捷键 `CTRL-O` 执行历史列表中的当前项并移动到下一个。如果你希望重新执行列表中的一系列命令，这非常方便。\n- 你可以使用快捷键 `ALT-N`\
  \ 进行正向搜索。这是非增量的。\n- 你可以使用快捷键 `ALT-P` 进行反向搜索。这同样是非增量的。结合此快捷键，你可以在执行搜索之前先输入搜索字符串并按\
  \ ENTER。\n\n### 历史扩展\n\nshell 通过使用 `!` 字符对历史列表中的不同项目提供特殊类型的扩展。我们已经看到数字可以跟在感叹号后面，以插入历史列表中的特定条目。还有许多其他扩展功能。历史扩展机制有许多可用元素，但这个主题太深奥了。\n\
  \n- 你可以输入序列 `!!` 来重复最新命令。不过，按下向上箭头再按 ENTER 可能更容易。\n- 你可以输入序列 `!?string` 重复包含该字符串的最新历史列表项。\n\
  - 你可以输入 `!string` 重复以字符串开头的最新历史项。\n- 你可以输入 `!number` 重复指定数字的历史项。\n\n# 第 6 章进程\n\n\
  ![](img/0029.jpeg)\n\n如果你有一台计算机，它可以同时完成多件事。它在任务之间快速切换，这被称为多任务处理。有时计算机会遇到问题，或者某个程序无法工作，所以你需要修复它们。当你的电脑启动时，内核会启动。这些事情发生：然后，一个名为\
  \ `init` 的程序启动。这些服务是用 shell 语言编写的。许多服务在后台运行，不需要用户界面。这个链接将向你如何找到 `process` 命令。如果我们为\
  \ `ps` 添加一个选项，就可以详细显示结果在屏幕上。查看下面的示例。\n\n```\n[gha@localhost ~]$ ps\n\n| PID TTYTIME\
  \ CMD |\n| :--- | :--- | :--- | :--- |\n| 1 ? | S | 0:00 | /sbin/init |\n| 2 ? |\
  \ S | 0:00 | [kthreadd] |\n| 3 ? | I | 0:00 | [kworker/0:0] |\n| 4 ? | I< | 0:00\
  \ | [kworker/0:H] |\n| 5 ? | I | 0:00 | [kworker/u2:0] |\n| 6 ? | I< | 0:00 | [mm_percpu_wq]\
  \ |\n| 7 ? | S | 0:00 | [ksoftirqd/0] |\n| 8 ? | S | 0:00 | [kdevtmpfs] |\n| 9 ?\
  \ | I< | 0:00 | [netns] |\n| 10 ? | S | 0:00 | [oom_reaper] |\n| 11 ? | I< | 0:00\
  \ | [writeback] |\n| 12 ? | I< | 0:00 | [crypto] |\n| 13 ? | I< | 0:00 | [kblockd]\
  \ |\n| 14 ? | S | 0:00 | [kswapd0] |\n| 15 ? | I | 0:00 | [kworker/0:1] |\n| 33\
  \ ? | S | 0:00 | [khvcd] |\n| 43 ? | Ss | 0:00 | dhcpcd |\n| 48 hvc | 0Ss | 0:00\
  \ | sh -l |\n| 71 ? |I | 0:00 | [kworker/u2:1] |\n| 102 hvc0|R+ | 0:00 | ps |\n\
  ```\n结果分别列出了 `sh` 和 `ps`。\n\n\n\n\n`x` 选项告知 `ps` 需要显示所有进程，无论由哪个终端控制。由于系统正在运行许多进程，会产生很长的列表，通常情况下，将\
  \ `ps` 的输出管道到 `less` 并进行查看非常有帮助。某些选项组合会产生很多输出行，此时将终端模拟器窗口最大化是一个好主意。\n\n## 进程状态\n\
  \n以下是进程状态的概述。\n\n- 进程状态 `R` 表示运行中（running）。该进程正在系统中运行，或者处于准备就绪状态。\n- 进程状态 `S` 表示睡眠（sleeping）。该进程处于睡眠模式，未运行。它正在等待某个事件的启动，例如击键或网络包。\n\
  - 进程状态 `Z` 表示僵尸进程（z）。这是一个已经终止的子进程，但父进程尚未对其进行清理。\n- 进程状态 `D` 表示不可中断睡眠（uninterruptable\
  \ sleep）。该进程正在等待 I/O，例如磁盘驱动器。\n- 进程状态 `T` 表示停止（stopping）。该进程被指令停止。\n- 进程状态 `N` 表示低优先级进程。这是一个良好的进程，当所有其他高优先级进程处理完毕后，它将获得处理器时间。\n\
  - 进程状态 `<` 表示高优先级进程。可以赋予进程更高的重要性，并允许它在 CPU 上占用更多时间。优先级较高的进程通常不那么“友好”，因为它占用了更多的 CPU\
  \ 时间。\n\n该进程后面可能跟随其他字符，这些字符表示其他进程的特征。`aux` 命令可以配合 `ps` 使用，提供另一组选项：\n\n```\n[gha@localhost\
  \ ~]$ ps aux\n\nUSERPID %CPU %MEMVSZRSS TTYSTAT\n\n| root | 1 | 0.0 | 1.3 | 3136\
  \ | 2516 ? | | S14:350:00 /bin/sh /sbin/i |\n| root | 2 | 0.0 | 0.0 | 0 | 0 ? |\
  \ S | 14:350:00 [kthreadd] |\n| root | 3 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/0:0]\
  \ |\n| root | 4 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [kworker/0:0H] |\n| root\
  \ | 5 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/u2:0] |\n| root | 6 | 0.0 |\
  \ 0.0 | 0 | 0 ? | I< | 14:350:00 [mm_percpu_wq] |\n| root | 7 | 0.1 | 0.0 | 0 |\
  \ 0 ? | S | 14:350:02 [ksoftirqd/0] |\n| root | 8 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00\
  \ [kdevtmpfs] |\n| root | 9 | 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [netns] |\n|\
  \ root | 10 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [oom_reaper] |\n| root | 11 |\
  \ 0.0 | 0.0 | 0 | 0 ? | I< | 14:350:00 [writeback] |\n| root | 12 | 0.0 | 0.0 |\
  \ 0 | 0 ? | I< | 14:350:00 [crypto] |\n| root | 13 | 0.0 | 0.0 | 0 | 0 ? | I< |\
  \ 14:350:00 [kblockd] |\n| root | 14 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [kswapd0]\
  \ |\n| root | 15 | 0.0 | 0.0 | 0 | 0 ? | I | 14:350:00 [kworker/0:1] |\n| root |\
  \ 33 | 0.0 | 0.0 | 0 | 0 ? | S | 14:350:00 [khvcd] |\n| root | 43 | 0.0 | 0.7 |\
  \ 1944 | 1472 ? | Ss14:350:00 dhcpcd |\n| root | 48 | 0.0 | 1.5 | 6204 | 2940 hvc0\
  \ | Ss14:350:00 sh -l |\n\nSTART TIME COMMAND\nroot71 0.0 0.000 ?I14:350:00 [kworker/u2:1]\n\
  root160 0.0 1.48180 2740 hvc0R+15:020:00 ps aux\n```\n\n该命令显示了属于系统中所有用户的进程。当你使用不带前导横杠的选项时，它将以\
  \ BSD 风格的行为调用命令。以下是 BSD 风格 `ps` 列头的详细信息。\n\n- BSD 风格的 `ps` 列头 `USER` 指的是用户 ID（User\
  \ ID）。它表示进程的所有者。\n- BSD 风格的 `ps` 列头 `RSS` 表示驻存集大小（Resident Set Size）。这表示进程所占用的物理内存（RAM）量。\n\
  - BSD 风格的 `ps` 列头 `VSZ` 指系统的虚拟内存大小。\n- BSD 风格的 `ps` 列头 `%CPU` 指 CPU 使用率的百分比。\n\n\
  ## 使用 top 命令查看进程\n\n`ps` 命令揭示了大量你的 Linux 机器正在运行的状况。然而，它提供的只是 `ps` 命令在系统中执行时机器状态的快照。为了查看机器活动的的动态视图，我将使用\
  \ `top` 命令。\n\n```\n[gha@localhost ~]$ top\n\ntop - 15:10:01 up 34 min, 0 users,\
  \ load average: 0.05, 0.05, 0.02\nTasks: 20 total,1 running, 19 sleeping, 0 stopped,\
  \               0 zombie\n%Cpu(s): 1.9 us, 4.9 sy, 0.0 ni, 93.2 id, 0.0 wa, 0.0\
  \ hi, 0.0 si, 0.0 st\nMiB Mem :182.0 total,171.2 free,4.9 used,5.8 buff/cache\n\
  MiB Swap:0.0 total,0.0 free,0.0 used.172.1 avail Mem\nPID USERPR NIVIRTRESSHR S\
  \ %CPU %MEM TIME+ COMMAND\n| 180 root | 200 | 842430842584 R7.41.70:01.82 top |\n\
  ```\n\n\n\n\n\n-   `vim` Linux 编辑器中的命令 `k` 用于将光标向上移动一行。\n-   `vim` Linux 编辑器中的命令\
  \ `PageDown` 或 `Ctrl-f` 用于向下滚动一页数据。\n-   `vim` Linux 编辑器中的命令 `PageUp` 或 `Ctrl-b`\
  \ 用于向上滚动一页数据。\n-   `vim` Linux 编辑器中的命令 `gg` 用于跳转到缓冲区的第一行。\n-   `vim` Linux 编辑器中的命令\
  \ `G` 用于跳转到缓冲区的最后。\n-   `vim` Linux 编辑器中的命令 `num G` 用于跳转到缓冲区指定的行行。\n\n`vim` 普通模式下的一个特殊模式被称为命令行模式（command\
  \ line mode），它允许你执行诸如向其中输入命令等操作。命令行模式有一个命令行，你可以通过它来控制 `vim` 编辑器中不同类型的动作。你可以向命令行添加命令来控制不同类型的动作。在\
  \ `vim` 编辑器中，当你处于普通模式时，必须按下冒号键（:`）。当你点击消息行时，光标将移动到该行。在这里，你会看到屏幕上出现一个冒号。这意味着你现在应该输入一个命令。\n\
  \n当你处于命令行模式时，你可能会输入多个命令将缓冲区保存到文件并离开编辑器。\n\n-   `vim` Linux 编辑器中的命令 `q` 用于在未对缓冲区数据做任何更改时退出系统。\n\
  -   `vim` Linux 编辑器中的命令 `wq` 用于将缓冲区数据保存到文件并退出编辑器。\n-   `vim` Linux 编辑器中的命令 `q!`\
  \ 用于退出编辑器并丢弃对缓冲区数据做的更改。\n-   `vim` Linux 编辑器中的命令 `w filename` 用于以不同的文件名保存文件。\n\n\
  ## 数据编辑\n\n当你处于插入模式（insert mode）时，你可以在缓冲区中插入数据。有时在进入缓冲区后，你需要添加或删除某些数据。当你处于普通模式时，`vim`\
  \ 编辑器将提供某些命令来编辑缓冲区中的数据。当你在 `vim` 编辑器内部尝试使用 PC 键盘上的 `Delete` 或 `Backspace` 键时，你应该格外小心。`vim`\
  \ 编辑器会将键盘的 `Delete` 键识别为 `x` 命令功能，这将删除当前光标位置的字符。\n\n## 复制与粘贴\n\n这些编辑器的一个标准功能是能够剪切或复制数据，然后将其粘贴到文档中。剪切和粘贴文本很容易。当\
  \ `vim` 你的数据时，它会将其发送到一个单独的寄存器中。然后你可以通过使用 `p` 命令检索该数据。你可以使用 `dd` 命令删除不同的文本行。当你尝试复制文本时，你可能会发现这稍微复杂一点。\n\
  \n-   `vim` Linux 编辑器中的 `x` 用于删除光标当前位置的字符。\n-   `vim` Linux 编辑器中的 `R text` 用于用 `text`\
  \ 覆盖光标当前位置的数据，直到你按下 `Escape` 键为止。\n-   `vim` Linux 编辑器中的 `r char` 用于将光标当前位置的任何单个字符替换为\
  \ `char`。\n-   `vim` Linux 编辑器中的 `dd` 用于删除光标当前位置的一行。\n-   `vim` Linux 编辑器中的 `A`\
  \ 用于在光标当前位置所在行的末尾追加数据。\n-   `vim` Linux 编辑器中的 `a` 用于在光标当前位置旁边追加数据。\n-   `vim` Linux\
  \ 编辑器中的 `J` 用于删除光标当前位置行尾的换行符。\n-   `vim` Linux 编辑器中的 `dw` 用于删除光标当前位置的单词。\n-   `vim`\
  \ Linux 编辑器中的 `d$` 用于删除从光标位置到行尾的文本。\n\n## KDE 编辑器家族\n\n如果你正在使用带有 KDE 桌面的 Linux 发行版，你将看到一些与文本编辑器相关的选项。KDE\
  \ 项目将正式支持几个编辑器，例如 `Kate` 和 `KWrite`。它们都是图形化文本编辑器，包含许多高级功能以及一些在常用标准编辑器中找不到的额外便利。本节将描述每种编辑器，以及你可以在\
  \ Shell 脚本中使用的功能。\n\n## KWrite 编辑器\n\n这是 KDE 环境的基础编辑器。它提供了类似文字风格的文本编辑，支持代码语法编辑和高亮，并用于不同类型的编程语言。它使用颜色编码来区分注释、常量和函数。你应该注意到\
  \ `for` 循环带有一个连接左、右括号的图标。编辑窗口提供了剪切和粘贴功能。\n\n-   该编辑器有许多你可能使用的命令行参数，用于自定义它的启动方式。\n\
  -   `Kwrite` 编辑器命令 `--stdin` 触发编辑器从标准输入设备读取数据而非文件。\n-   `--column` 触发编辑器指定文件中的列号，以便在编辑器窗口中启动该进程。\n\
  -   `--encoding` 触发编辑器指定文件的字符编码类型。\n-   `--line` 触发编辑器指定文件中的行号，以便在编辑器窗口中启动。\n\n\
  `KWrite` 编辑器在窗口顶部提供了一个用于编辑的工具栏和菜单栏，允许你选择不同的功能并更改编辑器的配置设置。菜单栏包含以下项目：\n\n-   `File`\
  \ 帮助你加载、保存、导出或打印文本。\n-   `Edit` 帮助你操作缓冲区。\n-   `View` 帮助你管理文本的外观。\n-   `Bookmarks`\
  \ 帮助你返回文本的位置。\n-   `Tools` 具有一些处理文本的功能。\n-   `Settings` 帮助你配置编辑器处理的方式。\n-   `Help`\
  \ 提供关于编辑器的信息。\n\n### KWrite 的编辑菜单\n\n以下是编辑菜单的各种命令列举：\n\n-   `Undo` 用于撤销你的操作。`Redo`\
  \ 用于重做你刚撤销的操作。\n-   `Cut` 用于删除你选择的文本并放入剪贴板。\n-   `Copy` 用于将你选择的文本复制到剪贴板。\n-   `Copy\
  \ as HTML` 用于将选中的文本作为 HTML 代码复制。\n-   `Paste` 用于在光标当前位置插入剪贴板的内容。\n-   `Select All`\
  \ 用于选择编辑器中的所有文本。\n-   `Deselect` 用于取消选择当前的文本。\n-   `Block Selection Mode` 允许选择列之间的文本而不是整行。\n\
  -   `Overwrite Mode` 用于在插入模式和覆盖模式之间切换，用新输入的文本替换文本而不是插入新文本。\n-   `Find` 用于产生查找文本对话框，允许你自定义文本搜索。\n\
  -   `Find Next` 用于在缓冲区向前重复上一次查找操作。\n-   `Find Previous` 用于向缓冲区后重复上一次查找操作。\n-   `Replace`\
  \ 用于在屏幕上弹出替换对话框。你可以用它自定义文本搜索。\n-   `Go to Line` 用于产生跳转行对话框。它允许你输入行号。光标将跳转到指定行。\n\
  \n## KWrite 编辑器工具\n\nKWrite 为用户提供了广泛的工具来编写和编辑脚本。某些工具如下：\n\n-   `KWrite` 编辑工具 `Read\
  \ Only Mode`（只读模式）将锁定文本，以便在你在使用编辑器时无法进行更改。\n-   `Filetype` 选择文本中所使用的文件类型方案。\n- \
  \  `Spelling` 在文本起始点启动拼写检查程序。\n-   `Highlighting` 根据程序代码或配置文件等内容高亮文本。\n\n\n\n\n\n\
  * `Indent`（缩进）将段落的缩进增加一个。\n* `Indentation`（缩进）将根据你在编辑器中的选择自动进行缩进。\n* `Spelling`（拼写检查）将在文本起始点启动检查程序。\n\
  * `Spellcheck Selection`（检查选中文）将在文本的选中区域启动检查程序。\n* `Unindent`（取消缩进）将段落的缩进减少一个。\n\
  * `Clean Indentation`（清理缩进）将段落缩进恢复为原始设置。\n* `Align`（对齐）将选中行的当前行恢复默认缩进设置。\n* `Uncomment`（取消注释）根据文件类型消除当前行的注释符号。\n\
  * `Lowercase`（小写）将所选文本或光标所在字符设置为小写。\n* `Uppercase`（大写）将所选文本或光标所在字符设置为大写。\n* `Capitalize`（首字母大写）将所选文本或光标所在单词的首字母大写。\n\
  * `Join Lines`（合并行）将当前位置的所选文本或行与下一行合并为单行。\n* `Word Wrap Document`（自动换行）将启用文本的自动换行。如果一行超过编辑器窗口边缘，它将继续在下一行。\n\
  \n## GNOME 编辑器\n\n如果你正在通过 GNOME 编辑器运行 Linux，使用一个看起来像图像一样的文本编辑器是非常简单的。它是一个简单的文本编辑器，具有一些额外的功能来增加编辑的乐趣。当你启动\
  \ `gedit` 并打开多个一个文件时，它会将这些文件加载到不同的缓冲区中，并在编辑器的主窗口中以标签页的形式显示每一个文件。要查看你在 `gedit` 中处理过的文档，请查看左侧边框。\n\
  \n### 编辑器的基本功能\n\n除了编辑窗口外，`gedit` 还使用菜单栏和工具栏，允许你设置配置和功能。工具栏提供了对菜单栏项的快速访问，如下：\n\n\
  * `File`（文件）菜单项帮助你加载新文件、保存现有文件并打印来自不同文件的不同文本。\n* `Edit`（编辑）帮助你操作缓冲区中的文本并设置编辑器偏好。\n\
  * `View`（视图）帮助你设置与显示相关的编辑器功能。它也用于设置文本高亮模式。\n* `Search`（搜索）帮助你在编辑器活动缓冲区区域查找并替换文本段。\n\
  * `Tools`（工具）用于访问安装在 `gedit` 中的插件工具。\n* `Documents`（文档）帮助你管理在缓冲区区域打开的不同文件。\n* `Help`（帮助）将为你提供关于编辑器及其命令的信息。你将看到一份完整的手册，用于使用编辑器和操作命令。\n\
  \n### 偏好\n\n`Edit` 菜单提供 `Preferences`（偏好）项，允许你自定义编辑器的操作。`Preferences` 对话框带有标签区域，允许你根据需求设置编辑器功能。\n\
  \n### 视图\n\n`View` 标签页提供了许多在编辑器窗口中显示文本的选项。\n\n* 你在 `View` 标签页中找到第一个选项名为 `Text Wrapping`（换行）。它决定了你如何处理编辑器中的长文本。当你启用该选项时，长文本将折到编辑器的下一行。`Do\
  \ Not Split Words Over Two Lines`（不要跨两行拆分单词）选项防止在长单词中自动插入连字符，以防止单词在两行之间断开。\n* 你在\
  \ `View` 标签页中找到的第二个选项名为 `Line Numbers`（行号）。该选项在编辑器窗口的左侧边缘显示行号。\n* 你在 `View` 标签页中找到的第三个选项是\
  \ `Current Line`（当前行），突出光标所在的行。这让你能够轻松找到光标位置。\n* 你在 `View` 标签页中找到的第四个选项名为 `Right\
  \ Margin`（右边界），用于启用右边界。该选项还允许你设置编辑器窗口的列数。列的默认值为 80。\n* 你在 `View` 标签页中找到的第五个选项名为\
  \ `bracket matching`（括号匹配）。当你启用此选项时，编写 `if-then` 语句、`for` 循环或 `while` 循环以及任何涉及括号的代码行时，可以轻松匹配括号。\n\
  \n行号和括号匹配为用户提供了一个方便的环境。这有助于故障排除，并且在许多其他文本编辑器中并没有找到。\n\n### 编辑器标签页\n\n* `Editor`（编辑器）标签页提供了处理缩进和制表符的选项。它还负责编辑后如何保存文档。\n\
  * `Editor` 标签页中的 `Tab Stops`（制表停止）选项允许你设置按下 `Tab` 键时跳过的空格数。默认跳过值为 8。你可以重置它。该功能还有一个复选框，用于插入空格而不是制表符。\n\
  * 你在 `Editor` 标签页中找到的第二个选项名为 `Automatic Indentation`（自动缩进）。当你启用它时，`gedit` 会对文本中的代码元素和段落（如\
  \ `if-then` 语句和循环）缩进。\n* 你在 `Editor` 标签页中找到的第三个选项名为 `File Saving`（文件保存），提供了两个保存文件的功能。你可以为编辑窗口中打开的文件创建备份。你还可以设置是否喜欢按预选间隔保存文件。\n\
  \n### 字体与颜色\n\n`Font & Colors`（字体与颜色）选项提供了两项配置。\n\n* `Font & Colors` 标签页中的 `Font`（字体）选项允许你选择\
  \ `Monospace 10` 作为默认字体，或从对话框中选择自定义字体样式和大小。\n* `Font & Colors` 标签页中的 `Colors`（颜色）选项允许你选择用于文本、选中文本、背景和选择颜色的默认颜色方案。它用于为列表中的不同类别选择自定义颜色。\n\
  \n默认颜色与为桌面选择的 `GNOME` 标准桌面主题匹配。当你选择不同的颜色时，这些颜色会改变以匹配桌面主题。\n\n### 语法高亮\n\n`Syntax\
  \ Highlighting`（语法高亮）标签页提供了 `gedit` 在编程模式下高亮不同元素的配置选项。`gedit` 编辑器具有检测文件中存在什么编程语言的能力。它会自动为该文本设置相应的语法高亮。此外，它允许你通过选择你喜欢的颜色来高亮代码的不同元素，从而自定义高亮功能。元素根据你选择的编程代码类型而变化。对于脚本，你可以选择\
  \ `sh` 高亮模式，它包含某些颜色方案。\n\n## 插件\n\n`Plugins`（插件）标签页提供了对 `gedit` 中使用的插件的控制。插件是独立的程序，通常与\
  \ `gedit` 接口并提供额外的功能。`gedit` 有许多可用插件。但并非所有插件都默认安装在系统中。启用的插件在其名称旁边的复选框中会显示勾选。像 `External\
  \ Tools`（外部工具）这样的插件在你选择它们后会提供一些额外的配置功能。它允许你设置快捷键来启动 `gedit` 显示输出的终端。\n\n* 你可以使用\
  \ `Change Case`（更改大小）插件更改所选文本的大小写。\n* 你可以使用 `Document Statistics`（文档统计）插件报告单词数、字符、行数和非空格字符的数量。\n\
  * 你可以使用 `Insert Date/Time`（插入日期/时间）插件在光标当前位置以多种格式插入当前时间和日期。\n* 你可以使用 `External Tools`（外部工具）插件在编辑器中提供特定的\
  \ shell 环境来执行脚本和命令。\n* 你可以使用 `Indent Lines`（缩进行）插件提供取消缩进和高级行缩进功能。\n\n\n\n\n\n* \
  \  你可以使用 `File Browser Pane` 插件来提供文件浏览器，以简化文件选择和编辑的过程。\n*   你可以使用 `Tag List` 插件提供一个常用字符串列表，你可以方便地将它们输入文本中。\n\
  *   你可以使用 `Modelines` 插件在编辑器窗口的底部提供 emacs 风格的消息。\n*   你可以使用 `Python Console` 插件在编辑器窗口底部提供交互式控制台，在\
  \ Python 编程语言的帮助下输入命令。\n*   你可以使用 `Spell Checker` 插件为文本文件提供适当的字典拼写检查。\n*   你可以使用\
  \ `Snippets` 插件存储一些经常使用的文本段，以便在文中进行检索。\n*   你可以使用 `Sort` 插件对整个文件或选定的部分文本进行排序。\n\n\
  # emacs 编辑器\n\nEmacs 是一款流行的编辑器，在 Unix 出现之前就已经存在，开发者非常喜欢它，因为它可以移植到 Linux 中。它最初是一个控制台编辑器，类似于\
  \ `vi`，但很快迁移到了图形化环境。它提供了对原始控制台编辑器的访问，并在图形环境中使用图形化的 X 窗口进行文本编辑。\n\n当从命令行启动 emacs\
  \ 编辑器时，它会确定是否存在活跃的 X Window 会话并以图形模式启动。控制台模式版本使用多个你需要学习的命令来编辑程序。这需要使用键盘上的 `CTRL`\
  \ 和 `Meta` 键进行组合。通常，`Meta` 键映射到 PC 的 `ALT` 键，尽管并非所有系统都是如此。这里使用了缩写——`CTRL` 简写为 `C-`，`Meta`\
  \ 简写为 `M-`。\n\n## emacs 编辑器的基本命令\n\n要从命令行编辑 emacs 文件，需要以下命令：\n\n```bash\nemacs myfile.c\n\
  ```\n\n当 emacs 控制台窗口打开时，你会看到简短的介绍和帮助屏幕。当按下按键时，文件会被加载到缓冲区并显示文本。你会在窗口顶部看到标准的菜单栏，但在控制模式下无法使用，只有在图形模式下可以使用。与\
  \ `vim` 编辑器不同，emacs 编辑器只有单一模式，你通过进入和退出插入模式在插入命令和文本之间切换。当你输入可打印字符时，emacs 将将其插入到光标的当前位置；当输入命令时，它会被执行。要在缓冲区中移动光标，需要使用方向键以及\
  \ `PageUp` 和 `PageDown` 键。移动光标的其他命令还包括：\n\n*   你可以使用 `C-p` 命令移动到文本的上一行。\n*   你可以使用\
  \ `C-n` 命令移动到文本的下一行。\n*   你可以使用 `C-b` 命令向后或向左移动一个字符。\n*   你可以使用 `C-f` 命令向前或向右移动一个字符。\n\
  \n如果你希望进行更长跨度的跳转，可以使用以下命令：\n\n*   你可以使用 `M-f` 命令移动到右侧下一个单词。\n*   你可以使用 `M-b` 命令移动到左侧上一个单词。\n\
  *   你可以使用 `M-a` 命令移动到当前句子的开头。\n*   你可以使用 `M-e` 命令移动到当前句子的末尾点。\n*   你可以使用 `C-e` 命令移动到当前句子的末尾点。\n\
  *   你可以使用 `C-a` 命令移动到当前句子的起始点。\n*   你可以使用 `M->` 命令移动到文本的末尾行。\n*   你可以使用 `M-<` 命令移动到文本的起始行。\n\
  *   你可以使用 `M-v` 命令向后移动一屏幕的数据。\n*   你可以使用 `C-v` 命令向前移动一屏幕的数据。\n\n你可以使用以下命令将编辑器缓冲区保存为文件并退出\
  \ emacs 编辑器：\n\n*   你可以使用 `C-x C-s` 命令将你在当前缓冲区中编写的内容保存到文件中。\n*   你可以使用 `C-x C-c`\
  \ 命令退出 emacs 编辑器并停止编辑器的操作。\n*   你可以使用 `C-z` 命令退出 emacs 编辑器。但是，该命令不会保持会话运行，因此你可能需要回来。\n\
