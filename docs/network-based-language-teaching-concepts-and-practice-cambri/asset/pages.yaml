    constitute a method. Rather, each teacher shaped their teaching according to her
    own beliefs and the more general sociocultural context. In this case, there was
    much overlap between the beliefs of individual teachers and the perspectives that
    seemed to be common in their departments and institutions. Mary Sanderson''s structural
    approach was highly congruent with the outlook of her department, college and
    church. Luz Santos'' dialectical approach, which sought to involve students in
