    #  Syntactic complexity: Identifying two trends


    We anticipated a difference between the professional style of the summary and
    the personal style of a response keyed to variation in syntactic complexity. To
    measure the amount of syntactic complexity across the two styles, we adopted an
    "acquisition scale" originally described in Rosenberg and Abbeduto, with seven
    developmental levels (Rosenberg & Abbeduto, 1987, p. 26), here reproduced in an
    abbreviated form:


    +   Level 1 embedded infinitival complement with subject identical to that of
    the matrix clause


    +   Level 2 wh-infinitive clause; conjunction within or between clauses


    +   Level 3 object noun phrase with relative clause; nominal clause as object


    +   Level 4 gerundive complement; comparative


    +   Level 5 subject noun phrase with relative clause; nominal clause as subject;
    nominalization


    +   Level 6 subordinate clause with subordinating conjunction


    +   Level 7 more than one use of clause combining within a sentence


    Although these are developmental levels, they can also be used to measure syntactic
    complexity. (See, for example, the "Nun Study" by Snowdon, Kemper, Greiner, Westein,
    & Merkesby [1996], which used such measures to track signals of Alzheimer''s disease
    in nurses'' diaries written over time.) We chose passages of summary and response
    to peers by Chang and Yoshi, and analyzed the sentences according to which features
    they presented. Sentences not showing any of the characteristics above received
    a rating of "0." The syntactic complexity of a text can then be expressed as the
    average of all of its sentences. Using this as a measure, we attempted to find
    syntactic indications of style shift. No "neat" patterns emerged, as they rarely
    do in linguistics, but we identified and can some trends.


