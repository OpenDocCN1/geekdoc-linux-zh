    formation technology society. If our goal is to help students enter new authentic
    discourse communities, and if those communities are increasingly located-on, then
    it seems appropriate to incorporate on-line activities for their social utility
    as well as for their perceived pedagogical value.


    To summarize, the computer can play multiple roles in language teaching. It originated
    on the mainframe as a tutor that delivers language drills or skill practice. With
    the advent of multimedia technology on the personal computer, it serves as a space
    in which to explore and creatively influence codewords. And with the development
    of computer networks, it now serves as a medium of local and global communication
    and a source of authentic materials. This multiplicity of roles has taken CALL
    far beyond the “electronic workbook” variety of software that dominated the second
    and foreign language marketplace for years and has opened up new avenues in foreign
    language teaching. These trends are summarized in Table 2.


    # Research on network-based language teaching


    Just as the paradigms of CALL have changed, so has research on the role of computers
    in the language classroom. Early CALL research focused mostly on the language
    performance of students who had used CALL programs, attempting to determine whether
    those programs were superior to other methods for maximizing accuracy. The cognitive
    paradigm engender research that looked at the development of individual processes,
    strategies, and competences, using measures such as motivational surveys, observations,
    recordings of keystrokes, and think-aloud protocols. The sociocognitive paradigm
    and an emphasis on learning through computer networks have brought about a focus
    on the way that'
