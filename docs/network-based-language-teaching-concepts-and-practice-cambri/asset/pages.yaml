    and Cambridge, respectively; and the third trial brought together learners of
    English, French, and Spanish from all three end-user sites. In this chapter, we
    report on the first and second trials.


    One of the major aims of the project was to assess the practicality of providing
    learners of various European languages with opportunities to collaborate with
    them in the target language community via a broadband telecommunications network.
    Reciprocal tutoring was to be one of the major features of the system.


    The main questions the project attempted to answer:


    +   - How well do high-bandwidth networks support collaborative learning?

    - How well is a task-based approach suited to the network environment?

    - What facilities are required to support network-based learning?


    One of the major challenges of the project was to develop an effective network-based
    learning methodology and to identify which factors


