  md: '# On-line learning in second language classrooms


    An ethnographic study


    Mark Warsauer


    The great enthusiasm about the potential of computer networks for language learning
    has not yet been matched by research on what actually occurs in on-line classrooms.
    Much of the published literature on the topic consists of anecdotal teacher reports.
    The small number of systematic studies that have been published may fail to account
    for the data, such as the outcome of particular class sessions (e.g., Kerns, 1995)
    or students'' use of particular discourse features (e.g., Chun, 1992). Yet, language
    learning is a complex social and cultural phenomenon, even more so when it involves
    new technologies that connect the classroom to the world. Short-term quantitative
    studies may fail to capture the complex interaction of social, cultural, and individual
    factors that shape the language learning experience. Researchers in education
    and applied linguistics are increasingly turning to interpretive qualitative approaches,
    such as ethnography (see, for example, the 1995 special issue of TESOL Quarterly),
    but thus few ethnographic studies have been conducted on uses of technology in
    the language classroom.


    This chapter reports on a 2-year ethnographic study of on-line learning in four
    language and writing classrooms in Hawaii. I undertook the study in order to achieve
    a holistic, contextualized understanding of the study. By immersing myself over
    a prolonged period in the culture of the classrooms and institutions, I sought
    to determine the *immediate and local means of actions*, as defined by others
    (Erickson, 1986, p. 119; emphasis in original). In other words, I attempted to
    understand how the students and teachers themselves perceived the experiences,
    rather than trying to fit their behaviors or comments into predesigned research
    categories.


    In the study, I chose classrooms that reflect the cultural and linguistic diversity
    of Hawaii, focusing in particular on students who could be struggling to achieve
    equal access to language and technology. The classes included (1) an English as
    a second language (ESL) writing class of Pacific Island, Asian, and South American
    students in a small Christian college; (2) a graduate ESL writing class of Asian
    students in a public university; (3) a writing-intensive undergraduate'
