    # Introduction


    The LEVERAGE project was part of the European Advanced Communications Technologies
    and Services (ACTS) program. The project''s primary aim was to establish how well
    telecommunications networks are suited to educational (and especially language
    learning) in today''s multilingual and multicultural Europe. A number of partners
