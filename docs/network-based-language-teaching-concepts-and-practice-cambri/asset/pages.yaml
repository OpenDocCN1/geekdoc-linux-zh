    feedback on peers'' compositions. Students would receive a written transcript
    of their response-group session, helping them to remember the points of discussion
    and consequently to act on peers'' suggestions. Finally, students who were more
    reticent to participate in face-to-face response-group discussion might be more
    encouraged to respond to compositions via computer-mediated discussions.


    With these possibilities in mind, InterChange was piloted in one section of French
    3 in 1994 with positive preliminary results in student writing and in student
    attitude toward the activity. Based on these findings, all French 3 and 4 sections
    began InterChange for response-group work during the spring semester. The current
    comparative study was undertaken in the spring semester of 1996. The purpose of
    the study was, to analyze concretely and quantifiably some of the issues raised
    when students moved from the traditional face-to-face format of process writing
    to networked communication, which many researchers see as the future for teaching
    composition (e.g., Holdstein, 1987; Langham, 1993; Armstrong & Vetter-Vassot,
    1994), and second, to determine the efficacy of compositions as a vehicle for
    response-group work. The study sought to answer four major questions:


    +   1. Did students respond differently to each other''s work in each format?

    2. Did they take the work produced in one format seriously than in the other?

    3. How useful did students find the computer response-group format compared to
    the face-to-face response-group format?

    4. Did student group interactions change depending on the type of response-group
    format?


    In order to answer these questions, the study was organized as described below.


    # Method


    # Subjects and treatment


    Subjects were drawn from a pool of 108 students enrolled in eight sections of
    French 3 and 4 at Berkeley. Not all of these students participated in all aspects
    of the study, however. Each of the course sections had from two to four small
    groups of three students involved in the study, and these groupings remained constant
    throughout the study. A total of 54 students participated in the essay analysis
    portion of the study, and 106 students participated in the attitude questionnaire
    portion of the study.


    Within each course level there were two control and two experiment-'
