    it locks researchers into framing questions in terms of differences between computer-assisted
    learning activities and other classroom activities. Nevertheless, some researchers
    have moved beyond this trap by investigating the effects of specific features
    of CALL activities and by looking guidance to research in second language acquisition
    (SLA), which has pointed to avenues such as the need to investigate the classroom
    context of CALL and the sociocultural factors related to CALL.


    # The need for CALL evaluation


    The concern for evaluation extends back to the 1960s and 1970s when CALL was an
    innovative and departure from other classroom practices. But then, like now, the
    focus of many CALL developers was on the technology rather than technology use.
    Summarizing more than 10 years of experience with CALL in the PLATO project at
    the University of Illinois, Hart’s overview of CALL activities on PLATO included
    the following comment on evaluation:


    It is obvious that the developers of computer-based language materials have given
    far too little to evaluation... If the issues are so complex that conventional
    procedures (e.g., those employing group mean differences) are inappropriate for
    providing an answer, then we should present clear arguments why so and provide
    alternative analyses (e.g., on individualization or optimization features). (Hart,
    1981, p. 16)


    The point was then – as it is now – CALL needs to be evaluated and more than one
    method is needed to do so. However, with the quickly changing technology of the
    1980s and an academic community preoccupied with construction rather than evaluation,
    little progress was made in CALL evaluation.²


    In the 1990s, CALL began to receive more attention. Dunkel’s words, written 10
    years after Hart’s, reflect exactly the same theme:


    Systematic evaluation of the effectiveness of CALL must continue; however, new
    focuses as well as methods of research inquiry need to be developed if we are
    to gauge correctly the power of the computer to affect different aspects of second
    language acquisition. (Dunkel, 1991, pp. 23–24)


    In the 1991 volume, concrete suggestions were made for “new focuses and methods”
    as process-oriented studies, ethnographic research, and discourse analysis. About
    the same time, an important study of CALL use in Germany included a variety of
    methodologies for CALL evaluation, such as discourse analysis for learners’ use
