    # Results and discussion


    # NBC and the negotiation of meaning


    In response to the first research question, the language data generated across
    all five tasks confirm NBC''s potential for fostering the negotiation of meaning
    in task-based interaction. When communication arouse, learners negotiated to resolve
    the problem, and their patterns of interaction look much like those in NNS oral
    conversation. Table 2 displays the variety of trigger types (in percentage) found
    per task, and demonstrates that learners negotiated over all aspects of discourse,
    including both meaning and form.


    These results corroborate the findings from studies of oral lexical items and
    the overall content of utterances (Brock et al., 1986; Sato, 1986; Pica, 1994).
    Learners pop down from the main line of discourse to negotiate spots in the communication,
    and as Brock et al. argue, the morphyntax carries a relatively communicative load
