    # Example of a networked hypermedia environment:

    Project netLearn


    Project netLearn, currently under development at UCSB and targeting second-year
    language learners, implements multimedia materials on the World Wide Web that
    contain components for enhancing proficiency in the traditional areas of listening
    comprehension, speaking, reading comprehension, and writing, as well as in communicative
    competence, discourse competence, and pragmatic competence. Built into these components
    are activities that utilize (1) Web access to “primary data” and specific networking
    capabilities that allow for synchronous and asynchronous communication and collaborative
    work, and (3) the capability of presenting information nonarly in multiple modes
    (text, graphics, sound). These components are intended to implement principles
    of interface design that support the cognitive processes of the learner. The goal
    is to create an environment that engages learners in meaningful activities that
    are rooted in reality. Instead of giving learners individual self-contained assignments,
    they are presented with a general problem whose solution is nontrivial (i.e.,
    it requires several different activities and steps). Learners have the freedom
    to choose both the order in which they tackle a task and the tools they use in
    order to accomplish their goal. For example, learners are not explicitly told
    to “listen to this first,” “read next,” or “write this now,” but they are given
    the opportunities to access information in different modes and to respond in different
    modes in order to complete their task. In other words, a variety of tools are
    implemented so that learners can decide for themselves how they would like to
    solve a problem or accomplish a task. In addition, as they are carrying out the
    various tasks, they are creating a database of information that is stored in their
    own Web space and is a collection of what each individual has created.


    # NETWORKED MULTIMEDIA TOOLS


    Specifically, the kinds of tools that we have incorporated into netLearn include
    listening tools, speaking tools, reading (decoding) tools, writing tools, tools
    to facilitate communication and negotiation, and tools providing access to cultural
    information. The so-called netTools in netLearn include: netWrite, which is an
    open-ended “notebook” function that gives learners the ability to write documents,
    anything from compiling their own notes to writing a report, a letter or an essay;
    netRead, which provides two tools for reading, both a glossary created specifically
    for a given text and access to an on-line German-English dic-'
