  md: '# Theory and practice of network-based language teaching 15


    The contexts in which networked-based teaching and learning occur have not, but
    by large, been studied in sufficient depth. As Gee (1996) explains, discourse
    represents not just language but “saying(writing)-doing-being-valuing-believing
    combinations” (p. 127). To understand the full impact of new forms of interacting
    in the language classroom, must look beyond the texts of interaction to the broader
    contextual dynamics that shape and are shaped by these types. This entails holistic,
    qualitative research that goes beyond inventories of linguistic features and attempts
    to account for the way classrooms take shape over. Although a number of educators
    have attempted to look at such phenomena, much of the published work in this regard
    has consisted of informal reports by teachers of what they have observed in their
    classes.


    Chapters 2 and 3 of this book present descriptive studies that discuss the overall
    context of network-based language teaching in foreign and second language contexts.
    In Chapter 2, Carla Merskill and Krasimira Ranglova present research on the implementation
    of new technology-enhanced EFL teaching in Bulgaria. They show that the use of
    computer networks was part of a broader reconceptualization of the language program
    that resulted in a more “sociocollaborative” approach to learning. The chapter
    is a sterling example of fact that technology is not just a machine, or even just
    the use of a machine, but rather a broad form of social organization. In Chapter
    3, Mark Marschauer presents the results of two ESL classes, one indigenous language
    class, and one English class (in which the majority of students were second language
    learners). Marschauer’s study shows that the particular implementation of network-based
    teaching is highly dependent on sociocultural context, including, but not limited
    to, the attitudes and beliefs of the teacher. The study also illustrates the significance
    of new conceptions of literacy when considering network-based teaching.


    The nature of interaction has one of the most important areas of research in second
    language learning (for a review, see P, 1994). It has been suggested that computer-mediated
    communication provides an ideal medium for students to benefit from interaction,
    because the nature of the discussion allows greater opportunity to attend to and
    reflect on the form and content of communication. Most of the research on the
    linguistic nature of CMC has focused on counting or categorizing individual students’
    comments rather than qualitatively analyzing how and in what students actually
    negotiate meaning within


    Chapters 4, 5, and 6 begin to overcome this shortcoming. In Chapter 4, Jill Pellettieri
    uses a framework from Gass and Varonis to examine task-based real-time computer
    interaction between adult learners of'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 16 Richard Kern and Mark Warschauer


    Spanish. By analyzing the modifications that learners make in response to negotiation
    signals as corrective feedback, she provides evidence that computer-mediated interaction
    provides a useful mechanism for helping learners achieve higher levels of metalinguistic
    awareness. Whereas Pelletieri uses frameworks developed from oral interaction,
    Boyd Davis and Ralf Thiede in Chapter 5 use frameworks derived from writing research.
    They examine the interaction among L2 and L1 writers in asynchronous computer
    conferences to investigate the nature and degree of language learners'' imitation
    and accommodation of writing styles. Their linguistic analysis indicates that
    L2 students shifted their style in response to L1 interlocutors.


    In Chapter 6, Jean Scholz focuses not so on the linguistic interaction during
    electronic conferencing, but rather on its results, comparing how L2 learners
    make use of peer editing feedback that has been provided in computer-mediated
    or oral discussion. The results indicate a complex interrelationship of students''
    level, activity, and motivation, rather than a simple conclusion of superiority
    or inferiority for computer-mediated feedback. She concludes with thought-provoking
    observations regarding the differences between written and oral communication.


    A final area that has been insufficiently investigated to date is the partial
    impact of combining a variety of media in networked-based learning. This area
    is so new that almost no research has published. Authors in this book examine
    this issue from several angles: in Chapter 7, Dorothy Chun and Jan Plan explain
    concepts of networked multimedia in light of theory and research in second language
    acquisition environments. They then discuss criteria for the design of networked
    multimedia. In Chapter 8, Heidi Hetzer and Mark Warschauer return to the earlier
    theme of on-line literacies, providing a theoretical framework for how literacy
    and communication practices change in on-line and hypertextual environments. They
    also provide description of pedagogical implications of adopting an electronic
    literacy to language teaching. In Chapter 9, Christoph Zahnner, Agnes Fauver,
    and Jan Wang present the results of a pilot study on the use of broadband audio
    and audiovisual conferencing to help students learn French. Their study indicates
    the potential of audiovisual networking for long-distance task-based learning.
    These three papers bring us full back, to the issues of context and interaction,
    now redefined in terms of multimedia environments.


    Finally, in Chapter 10, Carol Chapel situates the studies in this volume and previous
    research on network-based language teaching within the broader perspective of
    the history and future of how we conduct research on computer-assisted language
    learning.'
