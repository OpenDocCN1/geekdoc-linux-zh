  md: '# Style shifting in asynchronous electronic discourse 113


    same course. Status and distance dynamics among the participants suggested compliments
    (including compliments plus agreement) were more likely to be offered to prospective
    status equals. This is, we think, an apparent confirmation for electronic conference
    interaction of Wolfson’s bulge hypothesis: that minimum, or in this case, maximum,
    degrees of status and social distance among intimates on the one hand, and “strangers”
    on the other foster very similar patterns, as opposed to the greater variation
    in the middle section.


    Although the data suggested awareness of, and accommodation to, social status
    and discourse conventions, looking at syntactic and lexical profiles in two of
    the Asian graduate students’ postings suggested further signs of status awareness
    and, possibly, learning. We found indications that both Chang and Yoshi were aware
    of syntactic complexity in the sources they summarized and that probably anticipated
    a different syntactic complexity was expected in responses to other postings.
    Yoshi’s syntactic patterns showed alignment to the authority of the source he
    summarized, and a clear separation of the professional style from the possible
    style of his responses. Chang, on the other hand, assumed more control over syntax
    by scaling down his original source’s syntactic complexity and its syntactic profile,
    to other postings. Lexical and propositional profiles for density show an amount
    of linguistic and stylistic awareness that indicates active accommodation beyond
    mere appropriation: Indications are that we identified their awareness as a stage
    prerequisite for learning.


    We set up the electronic conferences as a forum for discovery-based, collaborative
    learning. It appears that this learning, for the EFL students we examined, included
    linguistic learning. We learned, too, by identifying sociostistic and lexicoactic
    patterns of adjustment in our students. All in all, the extra setting of up conferences,
    and of requiring the students to do the additional writing and adjusting, benefited
    both sides.


