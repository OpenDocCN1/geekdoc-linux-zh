    vaton is uncontrolled. Electronic conferencing was a new forum for everyone. This
    is why we have focused on indications of accommodation within the conference.
    But can such a short time yield indications of linguistic learning?


    Learning (unlike acquisition) requires awareness of a difference between the target
    language and their own language variety, they have a “matching problem” (Klein,
    1986, p. 62). We have presented some indications of such awareness: Chang''s instance
    of sentence combining to maintain syntactic complexity, even at the cost of having
    a linguistic solution for so; her choice not to emulate Halliday''s level of syntactic
    complexity; Yoshi''s strict expression of styles to signal authority versus committee,
    and his self-reported awareness of how he evaluated “logical” writing style of
    academe, are surely indicative of conscious effort rather than accidental effects.
    Such conscious awareness would at least imply that the conferencing provided an
    atmosphere conducive to learning.


    Although we believe we have seen conscious awareness and accommodation in syntax,
    lexicon, and style, we cannot rule out the possibility that other factors may
    have contributed to the trends observed. To test for the possibility that, in
    summaries, emulation of patterns in syntactic complexity and lexical inventories
    in smaller classes were simply the result of omission, we computed a factor for
