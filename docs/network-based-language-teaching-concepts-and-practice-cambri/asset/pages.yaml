    tions are not expected to exist for quite some time. Thus, although Intelligent
    CALL (Underwood, 1989) may be the next and ultimate usage of computers for language
    learning, that phase remains a distant dream.


    # Sociocognitive approaches to CALL


    Sociocognitive approaches to CALL shift the dynamic from learners’ interaction
    with computers to interaction with other humans via the computer. The basis for
    this approach to CALL lies in both theoretical and technological developments.
    Theoretically, there has been the broader emphasis on meaningful interaction in
    authentic discourse communities. Technologically, there has been the development
    of computer networking, which allows the computer to be used as a vehicle for
    interactive human communication.


    Many uses of networked computers fit Crook''s (1994) computer-astoolkit model.
    This metaphor emphasizes the role that computers can play as mediational tools
    that shape the ways we interact with the world (e.g., accessing and organizing
    information through databases, spreadsheets, and word processors). Word processors,
    for example, facilitate the invention, revision, and editing processes of writing,
    allowing quick, easy (and reversible) reshaping of text. In the 1980s, John Higgins
    developed a series of text reconstruction programs as Storyboard and Double-Up,
    which allowed learners to manipulate text in various ways. The purpose of these
    programs was to allow learners to reconstruct the original texts, to develop their
    own constructions of language. Hypertext writing assistants such as Atajo (Domínguez,
    Noblett, & Pet, 1994) and System-D (Noblett, Solá, 1992), and concordancers such
    as MicroConnect (Scott and Johns, 1993) have been valuable tools for helping learners
    to use language with greater lexical and syntactic appropriateness.


    Computer networking allows a powerful extension of the computer-as-tool that it
    now facilitates access to other people as well as information and data. Computer
    networking in the language classroom stems from two important technological (and
    social) developments: (1) computer-mediated communication (CMC) and (2) globally
    linked hypertext. CMC has emerged in primitive form since the 1960s, but its use
    has became widespread since the late 1980s, CMC allows language


