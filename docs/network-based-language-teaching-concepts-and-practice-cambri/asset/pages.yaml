    lists, Web discussion boards) themselves in order to understand how they can be
    used for structuring language opportunities. It might also take considerable time
    to collect examples of on-line communicative acts. Thus, professional development
    and instructional implications require: Teachers to learn how to use tools, and
    they also need support and encouragement from their institutions to design classes
    that contain the components desired.


    If students join and participate in on-line discussion forums, they, as well as
    their teachers, encounter a range of problems dealing with netiquette, privacy,
    and safety. These are all topics that should be included in the classroom lessons.
    Students can discuss the role of proper netiquette (polite on-line behavior) as
    well as basic notions of on-line privacy. They need to be aware that electronic
    messages sent to public forums on-line are often archived and permanently available
    to the public. Teachers can integrate on-line “street smart” strategies into their
    to promote effective, safe on-line communication practices. The goal should be
    that students learn to effectively network and promote their ideas on-line, without
    taking unnecessary risks.


    # Construction


    Creating Web pages and Web sites is an increasingly common activity in business
    and academic environments. Using tools available in the learning context, such
    as text editors for writing HTML or Web page creation software, students can create
    their own Web sites to express themselves through text, graphics, audio, and video.
    What is unique about having students create Web pages for communication and expression
    is that their work may be stored on a world-accessible Web server. This provides
    opportunities for public-line publishing that can result in students receiving
    attention and feedback for their writing.


    Some teachers might assist students to publish their writing in the teacher’s
    Web server space or publish student work in on-line magazines devoted to publishing
    student writing. In this case, the editing and maintenance of these documents
    is in the hands of people other than the students. An alternative is to teach
    students how they can publish, maintain, and control their own writing on-line.
    Students can be taught how to manage their own Web sites by controlling their
    own Web server space, which is now made available through many venues. Essentially,
    this lets students become the writers, editors, and publishers of their own information
    and provides personal power that might bring results well beyond the language
    classroom. For example, some students might create'
