    Hawaiian language class of an undergraduate English writing class of immigrant,
    international, and (4) ethnically diverse American students at a community college.
    The research methods I used were across classes, and included longitudinal open-ended
    interviews with students and teachers; audio-video-taping of class sessions; analysis
    of students’ e-mail messages and other electronic texts; and participant observation
    in the classes. The nature of my participation varied; I assisted in all classes
    helping the students during computer-based activities, and in the Hawaiian class
    I also participated as a learner.


    The entire story has been reported at monograph elsewhere (Warschchauer, 1999).
    In this chapter, I will summarize the main findings. These relate to (1) the effect
    of sociocultural context on use of technologies, (2) the importance of electronic
    literacies, and (3) the purpose of literacy activities.


