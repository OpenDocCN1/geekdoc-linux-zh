    of learners than text-based conferencing (but, on the other hand, provide additional
    scaffolding for other types of learners)?


    Therefore, before assuming that hypermedia environments are inherently beneficial
    to language learning because they allow immediate access to authentic material
    and facilitate communication, we need to understand some basic principles of how
    individual learners process and retain information in different modes and how
    they integrate this information into the different aspects of their L2 competence.
    We must be specific in isolating the features of networked multimedia that can
    enhance particular competencies of different kinds of learners and in determining
    at what point cognitive overload from the medium can hinder the language acquisition
    processes for certain learners.


