    Changes in pedagogical values


    ![](img/94e7c2d52061faa2444ce44f6bdb210e_234_0.png)


    The dimensions of curricular innovation (from Markee, 1997, p. 54).


    Figure 1 The dimensions of curricular innovation (from Markee, 1997, p. 54).


    changes everything” (p. 175). Similarly, Debski (1997b) calls the relationship
    of language teaching and technology “ecological change” because any significant
    change in one of its components may lead to changes in the remaining factor” (p.
    41).


    These observations are consistent with Markee’s (1997) characterization of innovation
    in second language teaching. As illustrated in Figure 1, changes in materials
    do not occur independently. Instead, they must occur with changes in methodological
    teaching skills and philosophical values. The findings of NBLT studies have begun
    to demonstrate the interplay among these facets of teaching. For example, in his
    study of the CALL of several different classrooms,chauer observed that the “implementation
    of new technologies varied from classroom to classroom, influenced by the general
    institutional context and the particular beliefs of each individual teacher” (Warschauer,
    this volume). Similarly, Levy (1997b) describes how his project-based approach
    was influenced by institutional requirements for a syllabus at the beginning of
    the semester and formal evaluation of students – requirements reflecting pedagogical
    values. Other researchers have observed that when teachers do not have the values
    and skills that changes introduced by NBLT are consistent with NBLT activities,
    they appear “unsettling,” in because teachers’ control is compromised and participation
    can appear “anarchistic” (Kern, 1995, p. 470).


    NBLT also has much to add to the study of the sociocultural impact of CALL. Debski,
    justifies the use of NBLT on the basis of societal values: “It should be evident
    that current evolution of the society and the human self, and role technology
    plays in shaping them, are in synchronicity with the basic tenets of an exploratory,
    experience-based approach to second or foreign language learning” (Debski, 1997a,
    pp. 213–214). In this volume, the chapters by Meskill and Ranglova and bychauer
    provide the clearest examples of how technology use is subject to and becomes
    part of the sociocultural environment. Perhaps'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 222 Carol A. Chapelle


    the most compelling illustration of the convergence of L2 activity, cultural values,
    and the technology that put them together is offered in a qualitative study by
    Warsauer and Lepeintre (1997). They tell a vivid story of their experience with
    an Internet list designed for EFL practice. The topic of war atrocities was nominated
    because of a question about Japanese culture by a Japanese learner, and a heated
    political discussion between two ethnic and cultural groups followed:


    [A]some point, profoundly successful discussion started to turn into its opposite.
    These students weren''t just talking about the real world, but rather they were
    the world: they were debating serious issues of international relations based
    on their own personal experiences with war and oppression. (Warschau & Lepeintre,
    1997, p. 83)


    What could display a greater contrast to the types of pre-network CALL dialogues
    illustrated in Table 1? Observations as these indicate that NBLT pushes CALL research
    beyond examining the impact of and exporting educational technology to the study
    of how education, technology, language, and culture are evolving together.


    # Is network-based learning CALL?


    This question is important for conceptual development and evolution of CALL as
    a whole and network-based learning in particular. In an initial response to this
    question, I have suggested that a meaningful definition of CALL activities requires
    descriptive research documenting the language and interactions that learners engage
    during CALL use. I examined six themes that emerged throughout the evolution of
    CALL and suggested the degree of connectedness of network-based learning to each
    theme. Network-based learning — in part through the studies in this volume contributes
    substantially to each theme and therefore to the evolution of CALL. It seems that,
    at least for the time being, it is useful to consider network-based learning within
    the scope of CALL. Debski (1997b) suggests that “the use of linguistically enriched
    environments (i.e., network-mediated multimedia) . . invites a serious reconsideration
    of computer-aided language teaching and all of its constitutive elements” (p.
    47). However, given the existing themes identified in the past CALL literature
    and the contributions that NBLT makes, one might suggest that NBLT represents
    an expansion rather than a reconceptualization of CALL.


