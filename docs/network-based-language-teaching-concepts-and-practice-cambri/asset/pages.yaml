    # Statistical analysis of data


    Statistical analysis was carried out using multivariate regression analysis. This
    allowed for the combination of all data (increasing degrees of freedom), while
    controlling for variation in average number of changes owing to differences in
    assignments, class level (French 3 versus French 4), venue, and multiple observations
    provided by individual students. The regression analysis provided a broad perspective
    on the benefits of the computer versus face-to-face venue. The unit of analysis
    for the statistical inquiry was the assignment (e.g., individual essay). Of the
    54 students who turned in usable assignments, 24 students turned in two or more
    usable assignments.


    Regression analysis seeks to explain variation in a dependent variable given in
    a set of related independent variables. In this research, there were different
    variables of interest: average number of changes per page in content, organization,
    style, and grammar. This required the estimation of four separate regression models.


    Several independent variables were thought to influence the average number of
    changes per page that students made. Of greatest interest was the role that venue
    played in influencing how intensively students edited their papers. Thus, the
    first independent variable was Venue, which was coded 0 if the communication was
    face-to-face, and 1 if communication was computer. A positive regression coefficient
    would indicate that the computer venue was associated with more changes than the
    face-to-face venue. In order to account for a unique effect for the mixed venue,
    a second variable was created, Mixed (Mixed = 0 if venue was pure, and 1 if venue
    alternated the face-to-face and computer formats). Again, a pos'
