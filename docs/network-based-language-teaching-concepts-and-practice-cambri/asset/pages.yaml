  pgno: 195
- img_proc: true
  md: '# An electronic literacy approach 183


    We do not contend that action research is the only viable model for investigating
    electronic literacies, just that it is a research approach especially congruent
    with this topic of investigation. Teachers and students can work collaboratively
    to look at the types of language they use in different media, their attitudes
    towards communicating in a variety of media, the problems and successes that arise
    as they try to implement their own goals related to technology-enhanced learning
    and teaching. Computer-assisted discussion sessions, on-line dialogue journals,
    and other forms of electronic communication provide an excellent means for engaging
    interactively while saving interactions for future reflection. Writing up their
    analyses in the form of on-line presentations provides opportunities to further
    practice what they have learned, and also to get feedback and rapid input from
    the broader teaching and learning community. Such a process provides opportunities
    for both teachers and students to reflect critically on the issues they discovered
    during their research and to revise future teaching, learning, or research plans
    (Ross, Bondy, & Kyle, 1993; Eby & Kujawa, 1994; Richards & Lockhart, 1994; Shetzer,
    1997).


    To return to our earlier urban metaphor, it has been noted that the postmodern
    city “renders doubtful most of the conventional ways of thinking about landscapes
    and geographical patterns. It is also serious challenge for cartographers” (Relph,
    1991, p. 105). We would contend that the rapid growth of the Internet equally
    complicates the work of those of us who are trying to map out theories of language
    and literacy development. By engaging students, teachers, and scholars in collaborative
    investigative activity, we can at least describe the terrain of electronic literacy
    and inquiry into its myriad sorts of diversity.


