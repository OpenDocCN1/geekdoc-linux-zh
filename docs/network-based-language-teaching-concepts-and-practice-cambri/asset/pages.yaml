    that are capable of offering high-quality audioconferencing and videoconferencing
    are able to support effective zones of proximal development. However, the provision
    of the sufficient communication bandwidth is not enough: Students must be provided
    with the right setting to engage collaborative work. First, students must be provided
    an appropriate, engaging task. Second, a mean of externalizing and exchanging
    thoughts and ideas in written form (e.g., a shared scratch pad or similar tool)
    seems necessary, even in a task strongly oriented toward spoken communication.
    Third, support must be available to students with ready assistance in understanding
    the problem domain, in finding solutions, and in monitoring progress. To this
    end, the role of the adviser in the system is crucial. Carefully chosen tasks,
    a shared tool, and to access an adviser together can help maximize the potential
    benefits of audiovisual conferencing for collaborative interaction and language
