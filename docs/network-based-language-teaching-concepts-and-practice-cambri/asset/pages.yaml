    the vocational employment of the community college which she taught.


    One question that is sometimes raised whether technology contributes to an empowering
    role for students or whether it serves to heighten aspects of social control (see
    the discussion in Wasauer & Lepeintre, 1997). This study suggests that technology
    can be bent to serve the particular purposes and beliefs of individual teachers
    and the contexts of their institutions. Critical, then, to thinking about how
    to use technologies is not the particular techniques themselves, but rather the
    broader purposes to which they are put. A teacher who favors structuralism will
    use technology in a structural way. Teachers favor constructivist or critical
    approaches will similarly find ways to use technology to further their ends.


