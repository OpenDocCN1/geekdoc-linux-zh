    # Method


    # Subjects


    The subjects consisted of twenty-eight university students in Cambridge, England,
    who were learners of French and sixteen university students in Paris, France,
    who were learners of English. All subjects were volunteers, and none know each
    other before the study.


    The Cambridge students'' proficiency in French varied, but all had reached at
    least high school standard (British A-level, or equivalent). The range of their
    specializations ranged from engineering to law and history. The Parisian students
    were all engineering students studying telecommunications and taking English as
    a subsidiary and compulsory part of their main degree program. They attended all
    traditional classroom-based tutorials in addition to participating in the LEVERGE
    project.


    Computer literacy among the subjects varied greatly, from the highly experienced
    user to the near novice with difficulties using a mouse and moving windows in
    a graphic user environment. Both the observation of the students and the postobservation
    interviews indicated that the level of computer literacy had little impact on
    how effectively the system was used. Even the inexperienced subjects acquired
    the necessary skills quickly and easily.


    An attempt to establish the students'' general education and linguistic background
    through a questionnaire administered at the outset of the study. One significant
    area of variability that became evident during the study itself was the wide range
    in learning styles exhibited by individual students. These ranged along two axes:
    First, some students showed a clear preference for close guidance and almost continuous
    supervision, whereas others preferred to learn independently, following a less
    prescriptive and more exploratory path. Second, some students preferred working
    on their own, whereas others clearly appreciated and enjoyed the collaborative
    learning experience.


    The first trial involved only Cambridge-based students (N = 16), whereas the second
    trial involved involved students from both Cambridge (N = 12) and Paris (N = 16).


