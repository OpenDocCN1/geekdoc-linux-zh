    # Conclusion


    This study holds a number of practical implications for the implementation of
    computer-assisted instruction in the foreign language classroom. The analyses
    revealed that the course level of students is of primary concern. Although students
    benefited from each format of response-group work, face-to-face produced quantitatively
    more changes and qualitatively more extensive changes in the content category
    than did InterChange among the less advanced (French 3) students. This is a very
    important finding, because a student''s interpretive abilities are crucial for
    improving content and producing a compelling composition at any level. For French
    3 students, content modification seems to have a reverberative effect on organization
    and style as well. Fundamentally, the three other assessment areas of grammar,
    organization, and style can be more easily relegated to the editing process after
    the ideas have been generated. This finding must also be evaluated against time
    factors and other'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 138 Jean Marie Schultz


    language acquisition goals. The InterChange sessions required an entire 50-minute
    class period, as opposed to the face-to-face sessions, which required only 20
    minutes. This study calls into question the ultimate efficiency of synchronous
    conferencing as a tool for fostering writing improvement. Although the possible
    impact of InterChange on speaking skills was not part of this study (cf. Kern,
    1995), the students'' attitude questionnaires not surprisingly pointed to a declared
    preference for face-to-face work in order to practice their spoken French.


    We get a different picture of the role of computers from the more advanced students.
    When computer and face-to-face formats are assessed separately, differences in
    mode are unimpressive. However, when students alternate formats, they dramatically
    make interpretative-level changes than in either pure mode. Moreover, according
    to the regression analysis, the mixed venue students also make style changes.
    This study suggests, then, that it is important for students to participate in
    both experiences in order to achieve optimum results in writing development


    These findings are particularly significant for understanding the writing process
    itself. Despite frequent recommendations from both English composition and foreign
    language specialists to move response-group work to computer formats (Herron &
    Moos, 1993; Lanham, 1993), the findings of this study do not support any exclusively
    computer-based implementation of the article. Different cognitive processes are
    involved in the computer and face-to-face response-group formats. Essentially,
    the face-to-face format, which is a predominantly verbal mode in nature, is nonlinear
    and characterized by degrees and departures from the topic (Williams & Holt, 1989,
    pp. 26–27). This was clearly the case of the tape transcripts where, as described
    earlier, students would shift focus from a specific paper to discussion of tangential
    issues of interpretation (always remaining on task). Thus, in the face-to-face
    format students generated many different interconnected ideas about the text under
    consideration. The interactive process directly feeds into the net-working cognitive
    processes essential for formulating interpretations (Flower, 1988; Hayes & Flower,
    1980; Schulz, 1991a, 1991b). Our knowledge of cognitive processes in writing and
    the results of this study in terms of InterChange''s unconstrained negative effects
    on content point to the importance of the idea-generating and recursive characteristics
    of speech for the idea-generating process (Flower & Hayes, 1980) that forms the
    foundation for writing.


    Although the InterChange transcripts had some characteristics of speech, as a
    vehicle for composition assessment, students'' utterances were modeled predominantly
    true for the written comments of their instructors. This was particularly true
    for French 3 students, but for French 4 students as well. Despite efforts to transpose
    the more fluid characteristics'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Computers and collaborative writing 139


    of speech into a written mode, according to Williams and Holt (1989, p. 27), the
    computer fosters essentially linear forms of discourse. This was born out in the
    computer transcripts, which overwhelmingly demanded features of writing speech.
    As indicated in one of the student attentional questionnaires, the computer allowed
    students to target one or two ideas, but without the digressions that seem to
    feed positively into idea generation. Moreover, research by Holdstein and Selfe
    (1990, p. 37–38) suggests that seeing writing on a computer screen has a decided
    impact on the composing process, affecting the way in which one reads a text,
    to both positive and negative ends.


    As mentioned, the mixed-mode students, however, made the most changes in content
    and style of any group. We can understand these dramatic gains in the interactive
    nature of different cognitive processes. In Interfaces of the Word, Walter Ong
    (1977) discusses the differences of the visual and the verbal as they pertain
    to noetic activity. According to Ong, sound, which is fleeting yet more tactile
    and corporeal, allows for a more generic understanding (p. 139). Ong elaborates
    as follows:


    > Sound . reveals the interior without the necessity of physical invasion. Thus
    we tap a wall to discover where it is hollow, or we ring a silver-colored coin
    to discover whether it is perhaps lead. Sound by sight, we would have to open
    what we examine, making the inside outside, destroying its interiority as such.
    Sound reveals interiors because its nature is determined by interior relationships.
    (ibid., p. 140).


    Ong''s point is pertinent to this study where, in fact, relatively few ideas generated
    in the face-to-face mode found their way into students'' compositions, and yet
    students made more content changes when in this format. There seems to have a
    vaguer, more profound effect of speech and discussion on writing. On the other
    hand, the visual, according to Ong, provides a more immediate comprehension of
    the specific. It is both fragmenting and distancing (ibid., p. 138). It is through
    sight that we can come to understand the surface of things. Ultimately, it is
    the fusion of these two senses, the visual and the vocal, that allows us to make
    tremendous intellectual strides


    What is distinctive of the visualist development leading to our modern culture
    is that it learns to vocalize visual observation far accurately and deliberately
    than primitive may, by managing to intellectualize it, and by intellectualizing
    it comes to generate further visual observation, and so on. The visualism we are
    talking of is thus a visualism strengthened by intimate association with voice,
    directly in speech or indirectly through script. This association is crucial.
    For vision is the most tempting symbol for knowing, noetic activity itself is
    rooted directly or indirectly in the world of sound, through vocalization and
    hearing. In order to make what we'
