  md: '# 164 Dorothy M. Chun and Jan L. Plass


    Another potential source of cognitive overload is the structure of hypermedia
    itself. Structural information within a knowledge domain traditionally contained
    in the sequential or spatial arrangement of the information in linear text, such
    as in a book, is identified and perceived by the reader in this form. In hypermedia
    systems, on the other hand, structural information is coded in the form of links
    between nodes and thus has to be decoded in a different way. The learner unfamiliar
    with these environments, may add to the cognitive overhead in solving a learning
    task. Furthermore, for a second language learner, there is the additional burden
    of decoding not only the structure of the information but the basic vocabulary
    and syntax of the text itself. Specifically, if the learner does not understand
    the word or phrase in the foreign language that constitutes the “hot link,” then
    clicking on the link and being taken to another node may confuse the learner rather
    than help. Developers of second language hypertext programs must thus be particularly
    sensitive to keeping this burden to a minimum. On the other hand, one of the potential
    strengths of hypermedia systems is that, by their very nature, they can help learners
    link information that the might otherwise not have connected. In particular, if
    information is provided in multiple modes, such as visual and as audio, comprehension
    might be facilitated for certain types of learners who would benefit from having
    multiple forms of input to help decode a piece of information in the foreign language.


    In sum, the approach taken in this chapter has been to consider all the four features
    of hypermedia environments (the universal availability of materials, the communication
    capabilities through networking, the multimedia capabilities, and the nonlinear
    [hypermedia] structure of the information) and to integrate each with the goal
    of supporting cognitive processes in a constructivist learning environment. Comparable
    to the notion that multimedia information may aid comprehension of information
    by supporting the various cognitive processes involved in comprehension (Chun
    & Plass, 1997), we argue that the design of a hypermedia language learning environment
    has been based on the goal of supporting the cognitive processes involved in constructing
    the instructional materials in a networked environment while ensuring a reduction
    of impacting factors such as extraneous cognitive load resulting from navigational
    requirements of hypertext.


    Specifically, as a way of integrating (1) the learning approach (constructivism)
    and the accompanying cognitive processes with (2) the learning environment (networked
    multimedia), the tools implemented in netLearn include: tools for communication
    between learners (e.g., chat room, e-mail, conferencing, bulletin board), tools
    for learners to construct their own information database (e.g., bag/pack metaphor
    for collecting and storing information), tools for navigation through the Web'
