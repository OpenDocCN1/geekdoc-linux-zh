  md: '# Networked multimedia environments for second language acquisition


    Dorothy M. Chun

    Jan L. Plass


    # Introduction


    Networked environments have been used for many years as both a delivery mechanism
    and a collaboration tool in second language acquisition. Typical examples preceding
    the studies reported in this volume include the use of e-mail for asynchronous
    collaboration (e.g., Esling, 1991; Bar-Sommer, Frommer, and Schwartz, 1993; Conelos
    & Oliva, 1993; Oliva & Pollastrini, 1995; Brammerts, 1995; Kern, 1996), support
    for “writing as process,” including peer-review software (e.g., Michaels, 1993),
    and on-line discussions for synchronous collaboration between students and for
    negotiating meaning and developing discourse and sociocultural competence (e.g.,
    Beauvois, 1992; Kelm, 1992, 1996; Kern, 1995; Pinto, 1996; Sanchez, 1996; Wassauer,
    1996a, 1997; Chávez, 1997). All of the aforementioned work, is based on a primarily
    verbal presentation of information and text-based communication.


    In recent years, of the World Wide Web for delivery of language learning materials
    has been expanding rapidly (e.g., Godwin-Jones, 1996; Peterson, 1997; Blyth, 1998).
    There is a plethora of Web sites for language teaching and learning that incorporate
    the multimedia capabilities of the Web and present information in visual forms
    and audio in addition to text. However, the vast majority of learner activities
    involve only text-based responses from the learner (e.g., answering multiple-choice
    questions about content or grammar, typing in answers to content questions or
    grammatical exercises, filling in tables with information discovered in the various
    Web sites, and writing short answers or essays [Mehle-Viierge, Bird, and Mantegi,
    1996]). Follow-up activities suggested on Web sites often require students to
    compare notes with each other, discuss what they found, or present their findings
    only to the class. Although these activities may be inspired by hypermedia environments,
    however, they are usually carried out in more traditional, non-networked means.


    +   1 An exceptional project that involved international collaboration among students
    creating a bilingual audiovisual Web document is described in Baron and Debski
    (1996).'
