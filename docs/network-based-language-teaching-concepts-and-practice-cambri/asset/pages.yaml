    such as “effective and ineffective uses,” “meta-analytic research,” and “consistent
    findings” (e.g., Dunkel, 1991). These language differences reflect the divergent
    approaches of those concerned with pre-network CALL and NBLT, but do actually
    denote critical distinctions!


    To what extent is it useful to consider network-based learning the same as pre-network
    CALL? This question is important given the tendency of work in CALL to rediscover
    the same instructional practices and problems with each given of computer hardware
    and software – a tendency that has stifled evolutionary progress. Some of the
    software designs appeared upon the mainframe computers of the 1970s, the microcomputers
    and the World Wide Web of the 1990s – not necessarily because they showed to be
    effective, but because some members of each generation were satisfied to reinvent
    rather than determined to evolve. If NBLT is CALL, one would hope that design
    and evaluation of Web-based learning would draw on past work in CALL. If network-based
    activities are different from pre-network CALL, their development and study should
    imply a different set of issues from those in the CALL of the 1970s and 1980s.


    In this chapter, I would like to suggest that grounds for making a useful distinction
    between network-learning and pre-network CALL do not exist at this time. I will
    first discuss the nature of empirically based research that would help to make
    meaningful distinctions among different types of CALL activities. I will then
    review recurring themes evident throughout the CALL literature and suggest that
    these themes are relevant to NBLT. Finally, I will outline the contributions that
    the study of NBLT offers in the evolution of CALL.


    # Defining types of CALL activities


    To address the question of similarity between NBLT and pre-network CALL, it is
    necessary to have a means – beyond the broad definitions already cited – distinguishing
    computer-based activities from one another. If the superficial definition “use
    of computers in language teaching” is inadequate, what pedagogical or analytic
    criteria should be brought to bear on defining types of CALL activities?


    # How can CALL activities be categorized?


    Historically, categorization of CALL has been attempted on the basis of global
    judgments made by teachers and CALL developers – judgments about the intended
    role of the computer, the role of the target language, or a cluster of descriptive
    features. For example, one approach focusing on the role of the computer relative
    to the learner in the CALL activity'
