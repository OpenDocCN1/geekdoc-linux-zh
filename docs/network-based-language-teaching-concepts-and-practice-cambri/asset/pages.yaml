    helping learners become part of literate through extensive discussion of readings
    and the linking of reading and writing (see, for example, Bernhardt, 1991; Eskey,
    1993; Leki, 1993). Writing instruction focused not only on the development of
    individual strategies but also on learning appropriate ways to communicate to
    particular audiences. In the field of English for academic purposes, for example,
    there has been a shift in emphasis from expressive writing toward helping students
    to integrate themselves into academic communities through discussion and analysis
    of the nature of academic writing (e.g., Swales, 1990). Literacy has been increasingly
    seen as a key to developing not only language knowledge but also sociocultural
    and intercultural competence.


    Table 1 summarizes the respective instructional foci commonly associated with
    structural, cognitive, and sociocognitive approaches to language teaching.'
