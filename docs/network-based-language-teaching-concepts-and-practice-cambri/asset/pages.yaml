    1990; Pusack & Orto, 1990; Rüssch, 1993). Critics pointed out that the computer
    was being used in an ad hoc and disconnected fashion and thus was “making a greater
    contribution to marginal rather than to central elements” of the language teaching
    process (Kenning & Kenning, 1990, p. 90). Moreover, Crook (1994) points out, computer
    activities based on either a tutor or a pupil metaphor potentially distance the
    teacher from what students are doing individually and autonomously and can compromise
    the collaborative nature of classroom learning. Despite the apparent advantages
    of multi-media CALL, today’s computer programs are not intelligent enough to be
    truly interactive. Interactive programs such as *Philippe* put the learner in
    an active stance and provide an illusion of communicative interaction, the learner
    nevertheless acts in a principally consultative mode within a closed system, and
    does not engage in genuine negotiation of meaning. Computer programs that are
