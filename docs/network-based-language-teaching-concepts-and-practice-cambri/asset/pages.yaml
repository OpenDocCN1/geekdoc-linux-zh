    their interlanguage utterance and the L2 form offered (Tomasello & Heron, 1988,
    1989). Corrective feedback can be explicit, where an overt indication of nontarget
    usage is made to the learner, but it can also be implicit, through negotiation
    strategies as recasting, learners are offered a replay of their original utterance
    with the target form proposed. For example, if a learner of English says, “I live
    San Francisco,” and the continuant responds, “No, you should live in San Francisco,”
    that is explicit feedback. If the continuant instead responds, “Where do you live
    in San Francisco?” is a recast and is an example of implicit feedback. Current
    research has shown that during negotiation learners provide corrective feedback
    of both types and that both lead the L2 learners to incorporate TL forms into
    subsequent output (Gass & Varonis, 1989; Oliver, 1995). Overwhelmingly, the research
    on NNS interaction suggests that, whether interaction moves or more directly through
    corrective feedback, the negotiation of meanings pushes learners’ L2 abilities
    and produces increasingly modified or “pushed” output. Modified output of this
    type is named only to the consolidation of existing linguistic knowledge, that
    is, increased control over a form or structure (Nobuyoshi & Ellis, 1993; Swain
    & Lapkin, 1995), but also to lead to the internalization of new linguistic forms
    and structures (Pica, Holliday, Lewis & Montenhaler, 1989; Gass & Varonis, 1994;
    Swain & Lapkin, 1995).


    We therefore have the logical connection between the negotiation of meaning in
    oral interaction and the development of grammatical competence: Through the process
    of negotiation, learners are exposed to imperfect input conditions (i.e., interactionally
    modified and comprehensible input) as well as optimal output conditions (i.e.,
    modified or “pushed” output produced in the context of meaning construction).
    Bothhensible input and pushed output have been claimed to be, at the very least,
    if not necessary for the development of grammatical competence. This being the
    link between negotiation and the development of grammatical competence in oral
    interaction, is important to determine to what extent learners involved in NBC
    chats can negotiate the meaning way we do in oral communication.


    # NBC chatting and virtual classroom language learners


    Overwhelmingly, classroom research on NBC chatting has demonstrated that learners
    accept this new medium as a valid means of communication. In fact, these studies
    show that, during NBC chats, learners report reduced anxiety by participating
    and increasing motivation for using the target language, both of which result
