    # The second trial


    Based on the task of preparing a joint presentation on the Channel tunnel to the
    Canadian Institute of Engineering, the second trial involved the remaining twelve
    students in Cambridge and the sixteen students in France. The native/nonnative
    speaker interaction and the reciprocal peer tutoring made the second trial a richer
    environment for language learning than the first. Among the raised were: How would
    the students negotiate the choice of language? How would they collaborate? Would
    there be evidence of planning, work sharing, and so on? Would there clear signs
    of peer tutoring and where it would occur: in the lexical or grammatical domain
    or at the level of discourse and planning? How would they use the various communication
    facilities? Would one communication channel be chosen to the exclusion of the
    others?


    The decision about language choice during the collaborative sessions was left
    entirely to the students themselves. Logically, three possibilities presented
    themselves: (1) each student speaking his or her native language; (2) each student
    speaking the he/she is learning; or (3) the use of one language only, perhaps
    alternating after a certain period of time. Of these choices, the one clearly
    declared. Interestingly, the choice of language appeared to be uncontroversial
    and almost automatic. Concerns of the teaching staff that one language might dominate
    were not borne out. The fact that most students preferred to practice the foreign
    language indicates the opportunity to speak the foreign language was perceived
    to be the most important aspect of this form of collaborative work. The opportunity
    to listen to a native speaker was obviously perceived to be of lesser importance,
    despite the fact that in posttrial interviews students stated that the opportunity
    to communicate with a native speaker was the most important aspect of the trial.
    A clue to this apparent contradiction lies in the observation of one student who
    stated that talking to a peer in the foreign language was much less stressful
    than talking to a tutor or teacher who is a native speaker. The social standing
    of the participants, and their relative roles in the institutional setting, clearly
    played an important part in howsubjectivity between native and nonnative speakers
    was established and experienced.


    One of the most significant aspects of the observed instances of peer tutoring
    was their integration into the collaborative process. Overt tutoring occurred
    not as a distinct and separate interaction unit but naturally and spontaneously
    out of the task. The most directly observable instances'
