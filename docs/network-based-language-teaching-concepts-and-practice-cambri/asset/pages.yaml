    # Negotiation, comprehension, and successful communication


    In response to the second research question, the transcripts show that to ensure
    mutual comprehension, learners often went through labored negotiations before
    popping up to the main line of discourse. Consider the following example, taken
    from Task 2, in which students were trying to find the differences between their
    respective pictures. G is trying to describe her picture of a man who is next
    to a dartboard, but obviously does not know the word for dartboard.


