    to learn to properly cite works created by others.


    # Research


    The Internet is a powerful tool for finding information from educational organizations,
    governmental organizations, businesses, and individuals. With on-line search tools
    such as search engines and indices, students can learn how to answer questions
    they devise themselves or their teachers devise for. Research tasks can be done
    using on-line tools that can be learning activities themselves or be a part of
    large projects that integrate listening, speaking, reading, and writing tasks.


    In order to promote autonomous learning, teachers might progress from teacher-directed
    projects, which provide necessary scaffolding for beginning Internet users, to
    student-directed projects. Beginning steps include having students preselected
    Web sites for answers to questions or to complete an on-line “scavenger hunt”
    (i.e., a contest involving a search for on-line information). Later, students
    can use Web search engines and indices to answer specific questions. Later still,
    they might jointly conduct research on a topic agreed upon by the entire class
    for compilation into a document to be shared by all, such as a handout or a Web
    page. After doing initial training activities such as these,'
