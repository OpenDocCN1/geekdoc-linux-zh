    # Overview of the conferences


    Each of the mainframe VAXnotes conferences was designed to last about 3 weeks.
    Individual computer accounts were given to each student; after initial instruction
    in how to access the mainframe and the conference, and the basic commands required
    by the conferencing software, a student offered additional support and training
    for an hour each day. The instructor never wrote in any of the conferences, to
    avoid privileging any particular reply or style of writing, though students knew'
