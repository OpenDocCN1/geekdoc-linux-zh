    # Methods


    # Subjects


    Twenty students (eleven females and nine males) from the undergraduate Spanish
    program at the University of California at Davis volunteered to participate in
    this study in lieu of fulfilling their natural language requirement for the quarter.
    All participants were native speakers of American English and intermediate-level
    classroom learners of Spanish. Subjects were paired according to their schedule
    availability, which led to seven mixed dyads and three same-sex dyads (two female
    and one male). To ensure that all learners felt comfortable using the computers,
    practice sessions were conducted before data collection began.


    # Tasks


    During one university quarter, students participated in five communication tasks,
    which ranged in type from focused open conversation, in which students had a specific
    topic to discuss, to more closed tasks, such as jigsaw-type activities. Two of
    the tasks (3 and 5) included a subtask, in which learners were asked to jointly
    compose, on-line, a short piece of discourse based on the information they shared
    during their task. Table 1 presents a detailed description of each task.


    # PROCEDURES


    Each dyad met once a week to complete a specific language task; dyad composition
    did not change throughout the study. Before beginning each session, instructions
    for that week''s task were explained to help ensure clarity of the task directions.
    Additionally, students were reminded to use only Spanish in their chats. Participants
    were visually separated, and they carried out the language tasks using ytalk,
    a UNIX program that was used to capture the transcripts of the language data produced
    during each task. This program records all keystrokes made by the participants
    including backspacing; the transcripts thereby display learner utterances as well
    as self-corrections.


    # Analysis


    The purpose of this analysis of learner chats is mainly descriptive and centers
    on two general aspects: the nature of the negotiation routines themselves and
    linguistic modifications made during these negotiations. Based on the model for
