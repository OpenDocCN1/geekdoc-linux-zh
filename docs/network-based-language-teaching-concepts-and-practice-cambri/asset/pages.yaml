  md: '# Sociocollaborative language learning in Bulgaria


    access to computers have been limited to computer-science faculty and students.
    EFL students, although required to spend a significant amount of time every week
    in an audiolingual audotape laboratory, had no other access to technologies to
    support their learning.


    Since the early 1990s, the English department at the University of Sofia has seen
    burgeoning activity on the part of faculty who have been taking advantage of access
    to information and professional contacts outside the country. Several initiatives,
    including the USIA-sponsored exchange that supported this curriculum innovation
    project, have worked to increase faculty opportunity for professional development
    as well as to and implementation of instructional technologies. The EFL curriculum
    redesign project discussed in this chapter concentrated on the integration and
    use of technologies both as tools for teaching and learning and as a way to expand
    faculty understandings of current language teaching pedagogies.


    # Pedagogical groundings for change


    Recent theoretical and pedagogical trends in the field of second language acquisition
    favor socially mediated forms of instructional activity over the drilling, testing,
    and language appreciation activities that once dominated. Active use of language
    by learners is no longer believed to be merely a venue for students to practice
    the syntax and vocabulary of the language they study. On the contrary, process
    writing, response-based reading, and the active negotiation of meaning with others
    are widely considered the primary locus of syntactic development and ultimately,
    overall competence in use and understanding of the target language (Wagner-Gough
    & Hatch, 1975; Savignon, 1983, 1991; Ellis, 1984). A language learner''s engagement
    in meaningful communication activity using the target language is considered the
    best route to becoming both literate and fluent in that language (Stevik, 1980;
    Brown, 1994). Practice, therefore, sees student- and meaning-centered activity
    in motivated, content-rich environments as the best route for nonnative speakers
    to learn English language and literacy. The redesign of the Bulgarian EFL curriculum,
    therefore, was based on current sociognitive theory and practice.


    # Response-based literature teaching and learning


    Central to the revised EFL curriculum was a radical shift away from a curriculum
    that emphasized lecture and philology to a student-centered one that emphasizes
