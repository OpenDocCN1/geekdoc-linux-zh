  md: '# 5 Writing into change


    Style shifting in asynchronous electronic discourse


    Boyd Davis

    Ralf Thiede


    Asynchronous electronic discourse presents researchers with a way to look at how
    writers accommodate each other in a medium that is new to them. Even when the
    asynchronous exchange is relatively brief, in monthlong asynchronous computer
    conferences, one can spot some aspects of style shifting in extemporaneously composed
    on-line replies to other writers'' postings. Style shifting in response to each
    other''s texts takes place in the writings of both L1 and L2 writers, and like
    conversation, is keyed to the preferences of the individual. For L2 writers, newly
    plummeted into an L1 environment, such style shifting can be a signal that they
    have become aware of a range of discourse conventions in the L1 and are beginning
    to imitate or accommodate to these conventions. That is what writers tell us in
    their reflections on participating in a pair of asynchronous conferences, and
    it is what we think their substantiating.


    This study examines what happens to different features of discourse when learners
    move to function in an ESL situation, as by changes in their writing in asynchronous,
    or delayed-time, mainframe conferences. Specifically, we examine style-shifting
    patterns in rapidly keyboarded writings by three newly arrived Chinese and Japanese
    graduate students as they participated with thirty-one other graduate and undergraduate
    students from Asia, the United States and Canada, France, Egypt, and the United
    Arab Emirates (UAE) in a sequenced pair of asynchronous conferences. This pair
    of conferences was one of the requirements for a semester-long course in linguistics
    that all thirtyfour students took together at the University of North Carolina-Charlotte,
    a public university in the upper South.


    Our research examines accommodation to the experience of creating a learning community
    on-line, as suggested by two kinds of student reactions to the conference: L1
    English writers predominantly wrote in their final reflections about the experience
    of learning to write for a community, where L2 (NNS) writers commented on how
    they noticed discourse patterns and modified their own writing. In this chapter,
    we look first at conference conventions of approbation, agreement, and alignment
    and their appropriation. An examination of changes'
