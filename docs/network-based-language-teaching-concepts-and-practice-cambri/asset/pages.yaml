    found that learners who received “intelligent” feedback about their use of performed
    significantly better on both posttests and end-of-semester tests than those students
    who had only an indication of whether they had made an error.


    Results of such research are obviously useful for informing the development and
    use of CALL tasks, but they can also contribute to the broader research of SLA
    if the task variables are chosen in view of theory-based hypotheses about the
    relationship between features and SLA (e.g., Doughty, 1991). Such hypotheses have
    been formulated by researchers studying SLA from an interactionist perspective
    (e.g., Pica, 1994). Based on a review of this research, Pica, Kanagy, and Falodun
    summarized the features that had proven significant in previous research and organized
