    used and acquired. The organizational basis for the student-centered curriculum
    became the contemporary short story. A response-based approach to teaching and
    learning with literature formed the basis of classroom and homework activity.


    The traditional role of literature in the language classroom has been the embodiment
    of target language literacy and culture. Canonical works of literature from the
    target culture are typically read, analyzed, and explicated for purposes of appreciation
    with a subsidiary goal to augment students'' understanding of target vocabulary
    and usage. This tradition, while certainly exposing learners to important aspects
    of language and culture, falls far short of contributing to the acquisition processes
    now widely valued as primary in the teaching community. Literature, especially
    contemporary literature, has more to offer than a singular representation of the
    target language and culture. Indeed, it is the potential for active, critical,
    interpretive involvement on the part of individual students who render literature
    a powerful tool for second language teaching. Moreover, just as language activity
    can no longer be confined to the study of unique interpretations, in the age of
    extensive global communications for which English is the lingua franca, instruction
    can no limited to treating a single, canonical English as reflected in culturally
    sanctioned literary forms.


    A response-based approach to literature regards learners as active whose personal
    experiences affect their interpretations of the texts they read. Therefore it
    advocates practice that encourages exploration of multiple meanings and perspectives
    and the development of personal, defensive interpretations (Iser, 1974, 1978;
    Holland, 1975; Rosenblatt, 1978; Langer, 1991; Cox & May, 1992). The processes
    of literary understanding are both socially and personally mediated; that is,
    equal value is placed on personally and socially constructed meaning derived from
    literary texts, with class and small-group discussion serving as a venue for presentation,
    expansion, and revision of personal readings. A great deal of emphasis, therefore,
    is on dialogic processes whereby meaning and interpretation get discovered and
    articulated (Miller, 1993).


    In short, response-based practice views literature as a vehicle to promote critical
    and creative thinking through student discourse. Literature is viewed not as an
    embodiment of the aesthetic side of the target culture but as a springboard for
    learners to explore the worlds and feelings of provocative narrative art. In doing
    so, learners of another language are using the target language in a highly charged,
    extensive, and meaningful way.


