    The clips from Bonita, Patty, and Monique point to one crucial aspect of conference
    discourse: It provides participants with an audience beyond the teacher through
    interaction with peers. Extemporaneous asynchronous conference composition, like
    e-mail exchanges (Kern, 1996), provides a way for researchers to elicit interactive
    discourse, a way more limited of course than natural observation of conversation,
    because the discourse is written, for class, and initiated with the teacher''s
    prompt. However, the discourse elicited is probably fuller than responses to survey,
    questionnaire, or rating scales, and is directed by the individual participant.
    The discourse resulting from asynchronous interaction differs again from papers
    written for the teacher''s eyes because the participants, in the absence of teacher
    participation or a model, themselves establish and maintain conventions for both
    genre of writing (here, summary versus debate) and sanctioned interactions, such
    as ways for agreeing or disagreeing with another writer.


    # Identifying social practices


    The investigation of politeness, authority, status, or distance is not always
    simple in electronic discourse; indeed, the investigator of any kind of computer-mediated
    communication (CMC) must often work with subtleties order to reconstruct or infer
    social practice. Herring claims that “text-based CMC makes transparent as never
