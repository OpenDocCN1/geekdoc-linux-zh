  md: '# 8 An electronic literacy approach

    to network-based language teaching


    Heidi Shetzer

    Mark Warsauer


    # Introduction


    Since the early 1990s, English-language teaching professionals have tried a variety
    of ways to make use of the Internet to promote language learning and practice.
    These range from the creation of self-access on-line quiz collections to the use
    of authentic on-line materials as input for content-based projects and activities
    (Hegheimer, Mills, Salzmann, & Shetzer, 1996).¹


    However, the Internet is much more than just a teaching tool. It is becoming one
    of the primary media of literacy and communication practices The estimated number
    of worldwide users of the Internet topped 130 million in August 1998 (Nua Ltd.,
    1998) and continues to grow at a rate of 40%–50% a year, with growth rates in
    China, Indonesia, and other developing countries as great as or greater than in
    the United States (Glave, 1998). E-mail is now surpassing face-to-face and telephone
    conversation as the most used communication tool in certain business sectors (American
    Management Association International, 1998), while Internet-based publishing and
    collaboration are transforming scientific research (Harnad, 1991). Meanwhile,
    students of all ages must learn to find, share, and interpret online information
    as part of a necessary shift from just in case to just in time (Lenme, 1998).
    Even in the personal sphere, the Internet has become a major arena for entertainment
    and socializing in the United States and other developed countries. It is no exaggeration
    to say that the development of literacy and communication skills in new online
    media is critical to success in almost all walks of life. Finally, with an estimated
    85% of the electronically stored information in the world in the English language
    (Crystal, 1997), the overlap between English language learning and the development
    of electronic literacy is especially pronounced.


    1 For examples of self-access on-line quiz collections, Dave''s ESL Café (http://www.lescafe.com)
    or InternetTESL Self-Study Quizzes (http://www.aitech.ac.jp/~iteslj/quizzes/).
    For content-based projects and activities, in addition to Hegheimer et al.,Opportunities
    in ESL Theme-Based Pages (http://darkwing.uoregon.edu/-leslieb/themes).'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Therefore, whereas previously educators considered how to use information technology
    in order to teach language, it is now essential also to consider how to teach
    language so that learners can make effective use of information technology. Working
    toward both objectives, rather than just the one, distinguishes an electronic
    literacy approach to network-based language teaching.


    In developing and implementing an electronic literacy approach, a number of questions
    must be addressed. How should ESL and EFL teachers make best use of on-line opportunities
    to maximize language study and practice while also helping students develop computer-based
    communication and literacy skills? What strategies for communicating and working
    should students be taught? What goals should language teachers aim for and what
    kind of on-line projects should carry out to achieve these goals? Which are the
    most crucial resources and tools that students should learn so that they can teach
    them to others? How can teachers encourage students to become autonomous learners
    who can continue to learn how to communicate, conduct research, and present their
    ideas effectively using information technology beyond the confines of the class
    or the semester?


    To address these questions, we begin by presenting a conceptual framework for
    the development of electronic literacy. We then discuss classroom applications
    derived from this framework. Finally, we examine the research implications of
    an electronic literacy approach.


    # An electronic literacy framework


    An electronic literacy framework is based on several premises. First, it assumes
    that becoming literate is not just a matter of learning how to decode and put
    to paper letters and words, but rather a matter of processes that are deemed valuable
    in particular societies, cultures, and contexts. Thus, just as the development
    of the printing press helped redefine literacy in Europe and, eventually, the
    whole world (Eisenstein, 1979), the spread of on-line communication is reshaping
    literacy today, and at a much faster pace (Warschauer, 1999). Within the industrialized
    world, virtually all academic and professional writing now involves computer use,
    and according to some predictions, most reading will likely take place on computer
    screens within a few decades (Bolter, 1991). Literacy is a shifting target, and
    we have to prepare students for their future rather than our past.


    An electronic literacy approach also assumes that there is not just one literacy,
    but many kinds of literacy, depending on context, purpose, and medium. Although
    reading and writing on-line are closely related to reading and writing in print,
    the two literacy contexts are also sufficiently different to demand theoretical
    and practical attention.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# An electronic literacy approach 173


    Finally, an electronic literacy framework differs sharply from the notion of computer
    literacy, a concept largely discredited for its minimalist focus on matters such
    as how to turn a computer on and operate simple programs (Papert, 1980). Rather,
    an electronic literacy framework considers how people use computers to interpret
    and express meaning. Electronic literacy involves what has been called information
    literacy—the ability to find, organize and make use of information—but electronic
    literacy is broader in that it also encompasses how to read and write in a new
    medium.


    We divide electronic literacy skills into three broad, overlapping areas: communication,
    construction, and research (cf. Eisenberg & Johnson, 1996; Sandberg & Berkowitz,
    1998; Lemke, 1998). In the rest of this section, we will examine these three areas
    conceptually, and then discuss practical applications in the following section.


    # Communication


    By allowing us to communicate with groups of people over the world, simultaneously,
    at little cost, and in an archived format that allows us to record, reflect on,
    and refine our previous words as well as those of our interlocutors, computer-mediated
    communication serves as an intellectual amplifier, bringing about a revolution
    in human interaction and cognition (Harasim, 1990; Harnad, 1991). It is no surprise
    that such a powerful communications tool transforms how we interact in business,
    education, and personal life.


    Yet, like many powerful tools, computer-mediated communication is difficult to
    master and, if used poorly, can do as much harm as good. Features of computer-mediated
    communication deserve attention.


    Computer-mediated communication (CMC) has been found to exhibit characteristics
    typical of written communication, certain characteristics typical of spoken communication,
    and other characteristics unique to the computer medium (Collor & Bellmore, 1996;
    Werry, 1996; Yates, 1996). For example, CMC includes its own forms of salutation
    and greetings and, in some forms, its special uses of abbreviations and symbols
    (Werry, 1996). On-line forums develop their own complex rules for turn taking
    and topic shifting, which differ greatly from those of other oral or written media.
    In all communication, those who master the particular stylistic and sociolinguistic
    features required by the context and medium will best reach their audience.


    Computer-mediated face-to-face conversation strips away factors that tend to control
    or delete CMC reduces social context clues related to race, gender, handicap,
    accent, and status, as well as non cues, such as frowning and hesitating (Sproull
    & Kiesler, 1991). CMC also allows individuals to contribute at their own time
    and pace, neutralizing the advantage of those who tend to speak out loudest and'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# 174 Heidi Shetzer and Mark Wassauer


    interrupt the most (ibid.). The result is free-flowing communication that, if
    handled well, can result in the fruitful exchange of ideas, but if handled poorly,
    can quickly erupt into hostile outbursts. In the “classroom applications” section
    of this chapter, we offer suggestions for structuring electronic literacy activities.


    The result is that learning how to communicate via computer involves more than
    just translating from one communications to another; it involves new ways of interacting
    and collaborating. To use an urban metaphor, the Internet is analogous to the
    typical postmodern city, such as Los Angeles; it is “pluralistic, chaotic, designed
    in detail lacking universal foundations or principles, linked by centereless flows
    of information” (Relph, 1991, pp. 104–105). And the newcomer to the Internet,
    as to Los Angeles, must negotiate the decentered terrain.


    # Construction


    Construction more or less corresponds to what would be considered “writing” in
    traditional pedagogy. However, the term “construction” is used to designate two
    important shifts: (1) from essay to hypertext, (2) from words to multimedia, and
    (3) from author to co-constructor.


    Although essays are never read in a linear fashion, they at least in a linear
    form. The hypertext that appears on the World Web, with its decentralized linkages
    to other materials at the same Web site or to other sites around the world, represents
    a radically different way of presenting information. Hypertext is for replacing
    traditional linear ways of way of presenting written information and ideas, but
    at the very least is supplementing them as an important new way of way of presenting
    written information and ideas (Bolter, 1991; Lanham, 1993). Creating a good hypertext
    involves many challenges, from the rhetorical to the organizational to the technical.


    Hypertext authorship is not only a matter of reconceptualizing how to arrange
    words; it also involves creative use of other media, such as graphics, audio,
    and video. Document appearance has seen long before the Internet. However, with
    each decade of the electronic, the value of the visual is growing, as witnessed
    by changes in everything from newspaper styles to news television to school textbooks
    (Kress, 1998). The Internet represents a further extension of this, with quality
    Web documents judged as their appearance and presentation as their texts. It is
    not a matter of starting with a text and then prettifying it, but rather of knowing
    how to combine various media to communicate most effectively to an audience (Kress,
    1998; Lemke, 1998).


    Finally, on-line construction of documents is generally a collaborative process,
    in several ways. First, most Web sites are the joint effort of a'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# An electronic literacy approach 175


    team of people rather than just one person. Second, Web sites inevitably link
    to the work of other sites and authors; whereas this is also done via footnoting
    in traditional texts, it becomes a much more dynamic form of interaction in Web
    site design, as the original author(s) must consider that the reader will link
    to the other site in the middle of reading and thus engage in the two (or more)
    pieces in a back and forth fashion. In this sense, the readers also become co-constructors,
    as they play a more active role in piecing together to make meaning (Landow, 1992).
    Finally, the hypertext author must consider the possible interaction and response
    not only of the intended audience, but also of a broader audience that might happen
    across the Web site.


    # Research


    The amount of information available worldwide to the average individual has exploded
    in recent years, and an increasing amount of it is available on-line. Knowing
    how to navigate Internet sources, search for information, and critically evaluate
    and interpret what is found represents perhaps the most crucial set of electronic
    skills.


    To understand research, and other skills such as reading, have changed in the
    on-line environment, let us examine the example of a student who is assigned to
    do a research project on a contemporary topic. In a traditional print environment,
    the student will go to the library, gather some source material, bring it home,
    read through it, and write an essay to turn in to the teacher. The student would
    assume that the sources were valued because they were (a) published in a book,
    and (b) included in the library’s holdings. If any questions come about the sources,
    the student could clear these up with the teacher later.


    Students looking for information on the Internet would have to use different reading
    and research strategies. On the Internet, reading skills are intimately bound
    with searching and evaluation skills, just to find the material that one wants.
    This involves first knowing how to use engines effectively and then being able
    to skim and scan to see if what was found is remotely of interest, while simultaneously
    making judgments as to its source, validity, reliability, and accuracy – and then
    making on-spot judgments about whether to continue persuing with Web page, or
    go to other links from the same page, or go back to the search engine, or give
    up for this particular investigation and try another source. Thus, reading in
    the on-line realm by necessity becomes critical literacy – because those who cannot
    make evaluation cannot find what they need to read on the Internet.


    Finally, as suggested earlier, on-line reading and research also involve the ability
    to critically evaluate not only texts, but also multimedia documents. One important
    advantage of having students construct multimedia'
  merge: -1
  pgno: 188
- img_proc: true
  md: '176 Heidi Shetzer and Mark Warschauer


    work is that they will then be in a better position to critically interpret multimedia
    documents produced by others.


    One other principle of electronic literacy intersects with all of the others,
    Lemke (1998) distinguishes between a curricular learning paradigm, which dominates
    of education today, and an interactive learning paradigm of libraries and research
    centers. In the former, someone else decides what you need to know and when to
    need it; in the latter, determining your own learning goals and interests is the
    key feature of the educational process. Flexible, autonomous, lifelong learning
    is essential to success in the age of information (Reich, 1991; Rifkin, 1995).
    Autonomous learners know how to formulate research questions and devise plans
    to answer them. They answer their own questions through learning tools and resources
    online and off-line. Moreover, autonomous learners are able to take charge of
    their own learning by working on individual and collaborative projects that result
    in communication opportunities in the form of presentations, Web sites, and traditional
    publications accessible to local and global audiences. Language professionals
    who have access to an Internet classroom can teach students valuable lifelong
    learning skills and strategies for becoming autonomous learners.


    Table 1 summarizes some of the key differences between an electronic approach
    and earlier approaches to language and literacy instruction.


    # Classroom applications


    The framework described in this section is designed to be used as a tool for planning
    tasks and projects for the language classroom that use computers and the Internet
    as tools for personal and professional empowerment. The framework expands on the
    three areas already discussed: communication, construction, and research. Within
    each section of the framework, skills and activities are suggested to promote
    autonomous learning and meaningful language use.


    Access to technological tools and resources varies from context to context, and
    technologies change rapidly. Therefore, the following list allows instructors
    the flexibility to select and choose from the technologies available in their
    particular teaching context.


    Electronic literacy and language use


    # Communication


    +   * How to contact individuals to ask a question, give an opinion, give advice,
    or share knowledge. How to respond to questions, replies, feedback, advice, or
    other communication.'
