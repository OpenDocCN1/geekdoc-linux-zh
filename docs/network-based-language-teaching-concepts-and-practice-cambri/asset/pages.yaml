    # Recurring themes through generations of CALL


    The NBLT-related issues in this volume are familiar to those who have participated
    in pre-network CALL. Difficult issues of evaluation, exacerbated by the temptation
    to equate the computer with a method of instruction, have persisted throughout
    CALL’s history. This conceptual “computer method” trap presents a problem for
    CALL research because'
