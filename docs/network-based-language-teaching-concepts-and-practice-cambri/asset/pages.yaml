    # Background: The pedagogicale rationalenfor the conferences


    Computer conferencing differs from other asynchronous, or time-delayed, exchange
    of information via networked computers, as e-mail lists or news groups, in that
    conferencing store archives and threads all writings that participants can access,
    select, and retrieve at any time written message in the conference, regardless
    of topic or time written, as long as the message is stored on its host. All messages
    from participants are equally and imminently available, with their storage topically,
    as opposed to chronologically, arranged.


    The mainframe conferencing software program that we use, VAX-Notes, has an additional
    feature. Instead of presenting writers with a subject line in memo format of e-mails,
    it initially splits the screen between the message being read and the one to be
    composed, and when the writer use keyboard commands to save and post a reply,
    VANotes promotes the writer to add a title. This title can serve as a signpost
    (Davis & Brewer, 1997) to some aspect of the writing and may reveal some aspect
    of the writer’s purpose. The title is filed in the conference directory under
    the topic holding the original message that stimulated the reply. Storage requirements
    can be higher than for the average e-mail list or news group, which may be why
    conferences are always of short duration and specific focus. However, because
    all messages are always available, letting participants track and interact with
    a discussion at any time, they are useful for collaborative work, which say Sussex
    and West (1996), fosters “new patterns of intellectual activity” (p. 207; cf.
    Bibliography, pp. 215–219); that is, “networked learning provides not only a medium
    but also a stimulus . . . [with a j] new emphasis'
