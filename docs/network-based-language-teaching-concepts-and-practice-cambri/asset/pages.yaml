    at the expense of grammatical accuracy. Kern states that “discourse mediated by
    networked computers bears linguistic consequences . . . details fall by the wayside:
    Orthographic accents are often missing, verb conjugations are simplified” (p.
    459). Noting that, in NBC, learners are exposed to “defective” language, he suggests
    that “formal accuracy is not a goal served by InterChange [the software for synchronous
    interaction used in his study] (p. 470). I believe that this judgment is premature,
    especially because to my knowledge, no published research on synchronous NBC has
    yet focused on the role of the negotiation of meaning, in terms of either modified
    input or modified output.


    The pacity of research on negotiated interaction NBC is certainly not the result
    of a lack of potential for this kind of interaction to occur in NBC chats. If
    there has been a scarcity of negotiation work in electronic discussions, it is
    most likely because of other factors, such as the nature of the tasks in which
    learners have been involved. Many of the students of network-based interaction
    report discuss their opinions about current affairs, world politics, or even upcoming
    class assignments – in short, conversation-type activities. However, research
    by Crookes and Roulon (1985), Brock, Crookes, and Long (1986); and Pica et al.
    (1989) has proven that the interaction structure of NBC is quantitatively and
    qualitatively affected by the type of task in which the learners are involved:
    the negotiation of meaning and the resultant learner modifications are more prevalent
    in goal-oriented, task-based interaction than in casual conversation. Furthermore,
    current research suggests that negotiation will have a stronger effect on grammatical
    accuracy when the task demands rest crucially on the correct interpretation or
    usage of the target language (Loschky & Bley-Vroman, 1993).


    # Research questions


    This chapter reports on a study of nonnovative speaker chats mediated by ytalk
    to investigate the potential of task-based NBC to foster the negotiation of meaning
    and form-focused interaction and thus to be beneficial for the development of
    grammatical competence. The following research questions were asked: (a) Does
    the negotiation of meaning in task-based synchronous NBC as we know it in oral
    interaction? (b) Do the negotiations facilitate mutual comprehension? (c) Do the
    negotiations push learners to output modifications that are both meaning– and
    form-focused? (d) Do the negotiated interactions foster the provision of corrective
    feedback and the incorporation of target-like forms into subsequent turns?'
