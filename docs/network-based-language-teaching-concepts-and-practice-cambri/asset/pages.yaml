  md: '# 6 Computers and collaborative writing in the foreign language curriculum


    Jean Marie Schultz


    Not long ago, as the technological revolution began accelerating at an astounding
    rate, a number of humanists admonished their more reticent colleagues to put aside
    their misgivings about the educational potential of the computer and to begin
    integrating technology into their approaches to teaching. Some scholars argued
    implementing new technologies, the risk of increasing obsolescence (see Herron
    & Moos, 1993, p. 479). Partially on this basis, Richard Lanham (1993) argues strenuously
    for the integration of computers into the humanities, and particularly into the
    writing curriculum, noting that “The students we teach are going to do most of
    their writing and much of their reading on an electronic screen. They are going
    to live – they live now – in a world of electronic text” (p. 121).


    As Lanham suggests, one of the most compelling areas of exploration for computer
    use is in the field of foreign language writing. Part of this attention derives
    quite naturally from the English composition curricula from which the teaching
    of foreign language writing takes its cue. With the advent of the word processor,
    the teaching of writing has drastically changed, making the radical revision of
    a text possible with a few strokes. This technological ease of revision has in
    turn served to bolster the parallel shift in the teaching of writing from an end-product
    approach, where the teacher reads and comments on papers written without the benefit
    of feedback on a rough draft, to a process approach, where students work in small
    groups of peers for suggestions for multiple drafts, subsequently revising their
    papers before finally handing them to the teacher. In foreign language as well,
    process writing has become the accepted approach not only because it has been
    shown to improve students’ writing significantly, but also in part because it
    needs verbal communication in small groups on an authentic task, thus articulating
    particularly well with the communicative goals of the forign language classroom
    (Gaudiani, 1981; Barnett, 1989; Schultz, 1991b). Textbooks implementing a process
    approach now occupy a significant place in the field of foreign language composition,
    with the most recent composition textbooks advocating the use of computers'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'in their writing programs (se Garrard, Rusterholz, & Long, 1993; Siskin, Krueger,
    & Fauvel, 1996).


    Despite the increasing push to use computers in the foreign language curriculum,
    the effect of computer use on actual writing skills is in need of more rigorous
    investigation. Articles advocating the use of various computer programs have yet
    to offer concrete studies of these programs'' actual benefits for writing. Most
    are satisfied to claim that student writing is simply “improved.” For instance,
    in an article on the possibilities of using computer technology in the foreign
    language classroom, Armstrong and Yetter-Vassot (1994) advocate the direct use
    of computers in the process-approach peer-review process (pp. 479–480). They propose
    that students begin writing their papers during class time on computers in a lab
    setting. During the activity, students are encouraged to discuss their work with
    each other; the teacher also makes an effort to visit each student, offering suggestions
    for improvement. During the next session, students bring their completed drafts
    to class on diskette and in small groups on computer terminals. Armstrong and
    Yetter-Vassot (1994) remark at the end of the “Process Writing with Computers”
    section of their article that student writing improves and that “students are
    willing to take more risks, that is, experiment with unfamiliar vocabulary or
    difficult grammatical structures, because they have the opportunity to provide
    them with the instructor” (ibid).


    Their article raises some interesting issues in terms of student writing improvement
    and computers: It suggests that a qualitative difference in papers exists, depending
    on mode of production. The first question to be asked in an attempt to evaluate
    computer efficacy: To what format is computer writing to be compared? What approach
    to writing had been used prior to the incorporation of computers? Also, factors
    other than computer use responsible for improvement in writing, particularly in
    light of the fact that the authors cite instructor previewing as a significant
    element of their approach? The authors note that the writing activity requires
    two full class periods and that the time tradeoff is worthwhile in terms of the
    improvement in writing. However, given the lack of comparative evaluative basis,
    is this expenditure of time justified? Might there be other efficient formats,
    computer or noncomputer, would improve writing? The notion of improvement is itself
    a vague, catchall term. What exactly constitutes improvement? How is improvement
    defined? And for what types of improvement is the computer responsible? Additional
    questions have to do with group interaction during face-to-face and computer response-group
    work. How do students interact in each format? Do they respond to their classmates’
    writing differently? Do they offer different types of advice, depending on response-group
    format? Does the discourse change change?'
