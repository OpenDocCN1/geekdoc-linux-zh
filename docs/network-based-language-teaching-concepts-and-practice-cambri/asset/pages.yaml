    We chose to develop a pair of asynchronous conferences for two reasons. First,
    the focus of the course was to introduce key concepts about language acquisition:
    It seemed desirable for the students to participate directly in some sort of learning
    or acquisition process, regardless of how rudimentary or how limited. None of
    the thirty-six students had any prior experience with mainframe conferencing,
    and only a handful (four) had learned to send and receive-email, although slightly
    more (eleven) had some facility with CD-ROM bibliographic searching. This was,
    after all, 1993: The World Wide Web was only beginning to inch onto campus horizons,
    and word processing was the computer-supported activity which all of the students
    had some familiarity. Learning the routines and formulas involving locating terminals,
    accessing and going on the correct mainframe, calling up the conferencing software,
    with ease would, we thought, provide both challenge and a relatively brief curve.


    Second, we wanted to build communications in the sense of learning partnerships
    within the class, because its constituency was disparate in terms of dominant
    language, class standing, and experience with linguistic content. Half of the
    students were speakers of American English; other half had, their dominant language,
    Mandarin (Taiwan), French (Paris, Montreal), Guatemalan Spanish, Japanese, Standard
    classical Arabic, and Egyptian Cairo. Two-thirds of the students were junior and
    senior undergraduates, who were primarily taking the course to fulfill a requirement
    of a language course in their major or minor concentrations and who had had no
    prior course in linguistics. One-third of the students were graduate students
    with at least one undergraduate course in linguistics. But all one were in their
    first semester of a master’s degree in TESOL, and six had just arrived in the
    United States from Taiwan and Japan.


    If the class were to adequately prepare the students to pursue the next courses
    in their sequence without disenfranchising or abandoning the undergraduates, some
    sort of community would, we thought, need to be established, particularly because
    we wanted to foster discovery-student-driven learning (Wassauer, 1995) through
    enabling their collaboration in a variety of ways. Considering Scandamia and Beriter
    (1996), computer-supported learning can provide what they call a knowledge-building
    discourse, which is characterized by “focus” on problems and depth of understanding;
    decentralized, open knowledge environments for collective understanding; and productive
    interaction within broadly conceived knowledge-building communities” (p. 258).
