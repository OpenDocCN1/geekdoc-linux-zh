    Over a period of 6 weeks, the groups worked on a given task. A task-based approach
    suited itself for the natural way it fit both the theoretical orientation and
    the practical constraints of the project. The aim of the tasks was to design an
    environment that would require the students to engage in a series of metacognitive
    processes, including planning, monitoring, and the negotiation of meaning. The
    goal-oriented nature of task-based learning helps students frame the problem space.
    Exploration of the problem space, in turn, entails students'' negotiating new
    meanings with their collaborators or tutors. Students need to plan, monitor, modify,
    and evaluate their actions in the problem space and neutralize the newly encountered
    environment and culturally shared representations. The switches between zones
    of proximal development, such as collaboration, speech as the medium of interaction,
    and the externalization of thinking, occur naturally in task-based learning. Nonnative/native
    peer tutoring also offered a strong element of asymmetry, which was, hoped, would
    foster scaffolding.


    For each trial, LEVERAGE provided a large-scale task, which was divided into a
    number of clearly identified subtasks. In the first trial (Cambridge students
    only), learners were asked to assume the role of a British advertising agency
    building a contract to represent the French North Pas-de-Calais in the United
    Kingdom. Students worked in groups of three (one remote site) and were given four
    weeks to complete their task. The final objective was a 20-minute oral presentation
    in French explaining the chosen marketing strategy and the production of material
    supporting the presentation. Documents leading into the task (initial letters,
    memos, and authentic information about the area) were available on the system,
    as access to an on-line adviser who was able to help with task-related, language-related,
    and technical issues. The main aim of


    a video server. All workstations had a 133-MHz processor, a 17-inch color monitor,
    a 1.6G hard disk, and 16 Mb of RAM. They were equipped with a sound card, an MPEG-capable
    graphics card, a headset, a microphone, and a video camera attached. All workstations
    ran Windows 95 and Hot Desktop and Microsoft Office installed. The network connectivity
    was provided by 25 Mbps network cards. All workstations were connected via an
    ATM switch. The switches were connected via access nodes to a double ring running
    at 62 Mbps. The servers were connected directly to the access nodes (155-Mbps
    link).


    > ^3 The transnational link was a 10-Mbit rate ATM connection allowing high-quality
    videoconferencing and audioconferencing, as well as the running of shared applications.
    The access to the system was through a Web browser running on all. The resources
