  md: '# 152 Dorothy M. Chun and Jan L. Plass


    This chapter is concerned with the use of networked hypermedia- environments that
    are not only present learners with information in various modes (visual, audio,
    and web/textual), but also require learners to engage in productive tasks and
    activities in a variety of modes. These environments can include synchronous or
    asynchronous methods of collaboration, and they employ video, images, sound, and
    text for both the presentation and the negotiation of information, which results
    in a different set of questions regarding design and use of these environments.
    This chapter will first describe a Web-based project, Learn, which is currently
    being developed at the University of California, Santa Barbara (UCSB) The underlying
    purposes of the project are to provide a set of hypermedia tools on the Web that
    help learners attain second language competencies and skills, and using learnIt
    to study how students'' interaction and learning in a multimedia environment might
    differ qualitatively from stand-alone multimedia environments or text-based networking
    environments. Of importance is that the project is also based on an integrated
    approach to the design of networked multimedia programs (i.e., on the integration
    of interface design issues with principles of language acquisition). These issues
    will be discussed in the second part of the chapter.


    # Networked multimedia environments for language learning


    The unique attributes of networked multimedia environments, such as instant access
    to a wealth of primary information on the World Wide Web, the capabilities of
    synchronous and asynchronous communication and collaborative work, and the use
    of multiple modes and nonlinear forms of presenting information, make this medium
    a strong candidate for use in language learning and acquisition. The use of networked
    environments for learning in general, and for second language acquisition in particular,
    raises many questions regarding the design of these environments that differ from
    the traditional design of text-based and stand-alone systems. This section describes
    the goals of language instruction and the existing instructional materials to
    meet these goals. There are currently numerous multimedia programs for language
    learning, but most of them tend to be stand-alone programs that are not (e.g.,
    Barson, 1989; Lyman-Hager, Davis, Burnett, & Chennai, 1993; Chun & Plass, 1995,
    but a few). In addition there are many uses of networking functions for enhancing
    language acquisition, but they are predominantly text-based functions. What remains
    relatively unexplored is the development of networked multimedia materials (see
    Figure 1). This is an important avenue for instructional research and development
    because many'
