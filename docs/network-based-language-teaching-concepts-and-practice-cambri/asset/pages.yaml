    In a networked multimedia environment, the most important criteria for implementing
    language instruction are (1) the cognitive processes involved in developing linguistic
    and pragmatic competence must be supported, and (2) the problems of hypermedia
    environments that could diminish the potentially positive effects must be avoided.
    Much remains to be learned about the cognitive processes of learners when they
    use these environments. Further studies on the use of these instructional materials
    (e.g., the netLearn program) and on how language learners process information
    in such environments will need to address some questions with regard to these
    two criteria.


    First, from the perspective of studying the cognitive processes involved in learning
    with hypermedia materials, the following questions are important for language
    learning: How do the cognitive processes of users in networked multimedia environments
    differ from those used for purely text-based networked communication (e.g., videoconference
    exchanges versus e-mail exchanges)? How do learner interactions differ in written
    versus spoken-line discussions? Are speech acts and different types of pragmatic
    signals used in different discussion modes, resulting in different types or degrees
    of pragmatic competence? Do these reflect potentially different cognitive processes?
    How does the presentation of information in textual, graphic, video, and audio
    modes support cognitive processes in language learning? Do the modes reinforce
    each other by providing learners with multiple retrieval routes for learning words
    (linguistic competence) or concepts (sociocultural competence) in the second language?
    Do individual differences among learners result in their using different cognitive
    processes and therefore benefiting from multimodal stimuli? For example, visual
    metaphors better understood by certain when combined with textual cues but understood
    by other learners when combined with audio cues?


    Second, in order to avoid the potential drawbacks of networked multimedia environments,
    a critical perspective is needed when designing these environments. It is imperative
    not to underestimate the cognitive resources that learners must navigate in hypermedia
    environments and additionally not to overload learners with an excessive amount
    of input that cannot be processed efficiently. Some questions to be studied include:
    In ways multimedia (e.g., videoconferencing) or the structure of hypermedia (causing,
    for example, navigational problems) potentially distract from or interfere with
    enhancing different types of competence? Does providing information in multiple
    modes create a cognitive overload for certain users? For example, communicating
    via videoconferencing make greater cognitive demands on certain types'
