  md: '# 4 Negotiation in cyberspace


    The role of chatting in the development of grammatical competence


    Jill Pellettieri


    # Introduction


    Recent technological advancements in network-based communication (NBC) hold special
    promise for second and foreign language teachers and learners, as they provide
    for connectivity to a wider range of speakers than previously believed possible.
    Particularly promising among the various forms of NBC are those that allow for
    synchronous, real-time communication, the obvious advantage being that messages
    are typed, sent, and received instantaneously, bringing the electronic exchanges
    from the static to the more dynamic, and thus more closely resembling oral interaction.
    Communication through synchronous NBC has been dubbed "chatting," further underscores
    its resemblance to oral interaction. Because oral interaction is considered to
    be important for second language development, and because synchronous NBC, such
    as chatting, bears a striking resemblance to oral interaction, it seems logical
    to assume that language practice through NBC will reap some of the benefits for
    second language development as practice through oral interaction. While interesting,
    this assumption is nevertheless less than one that has been fully explored. Specifically,
    there is no published research that demonstrates NBC holds the same potential
    for the development of grammatical competence as does oral interaction. Grammatical
    competence is defined by Canale and Swain (1980) as the knowledge of the features
