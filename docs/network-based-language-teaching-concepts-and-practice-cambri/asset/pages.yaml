    – invited the writer to adopt a professional persona and voice, which could also
    carry over into a critique or position taken about the material. Responding to
    a fellow participant in the electronic conference, however, shifting into a different
    style. The professional voice that in a summary could establish trust by representing
    the source''s authority could, if it appeared in a reply, be a signal of distancing
    or exclusion of peer readers assuming authority unlicensed by a task. Writing
    within the knowledge community that we hoped the conferences would establish brought
    with it two demands on the ability of its participants: that they have or develop
    a sensitivity to both thoughts and enough linguistic ability to switch between
    them to be perceived as doing so. This ability to recognize signs and to shift
    into them as part of social practices, comes at a higher linguistic cost for nonnative
    speakers.


    In a summary, the student must negotiate capturing the source''s professional
    voice and writing “in your own words”, between appropriating and emulating. In
    a response, the student must find the balance between being personable to peers
    while being faithful to the academic style. Linguistic restrictions complicate
    such tasks. Among the pitfalls of overcompensation one described in Pennycock''s
    (1996) article “Borrowing Others’ Words: Text, Ownership, Memory, and Plagiarism.


    Kirkland and Saunders (1991) have reviewed studies of constraints that might affect
