    Many of the ideas presented in the communication section of the framework encourage
    the teaching of speech acts and conversational strategies and functions reminiscent
    of notional-functional syllabi. In this case, though, they are taught not part
    of an abstract syllabus but in response to the real needs of students as they
    engage in authentic interaction. Through e-mail and other electronic communication
    tools, students have the opportunity to contact speakers of the language studied
    in the'
