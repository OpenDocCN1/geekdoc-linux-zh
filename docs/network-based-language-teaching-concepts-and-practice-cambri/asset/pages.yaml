    # Technology and curricular change


    Outcomes of the revised curriculum consistently point to the viability of technologies
    as tools to support language learning goals and the socio-collaborative processes
    that promote them. More instructive, however, may be the role that technologies
    came to play in catalyzing philosophical change on the part of students and their
    teachers. The revised curriculum brought about fairly radical changes in participants''
    views of language and teaching. To a great extent, the technologies utilized a
    key role in bringing about new ways of using and thinking about language, collaboration,
    and teacher participation. Through literature-based and technologies-based activities
    involving both independent and collaborative work, students come to model back
    to their teachers what knowing a language means and some powerful ways to gain
    that knowledge. The telecommunications component in these new practices, moreover,
    worked to bring instructors out of the traditional role of single known into one
    that places them within a wide target-speaking community, which had, in effect,
    "equal time" in expressing personal and collaborative understandings of the literature.
    The project is, an example not only of the ways in which telecommunications opens
    the world to teachers and students of another language but also of how the introduction
    of the world outside the classroom can come to impact beliefs and practices.


    Additionally, the revised curriculum had a wider, systemic impact. Based on the
    "misfit" between traditional tests and testing procedures and the new curriculum,
    the EFL program at Sofia is redesigning tests to better reflect the ways in which
    English is now learned. This is an extraordinary instance where practice is determining
    evaluation, rather than the widespread tradition of tests determining teaching
    practices.


    # Conclusion


    The widening, practical availability of technologies in tandem with the democratization
    of nations around the globe gles new possibilities on many fronts. For language
    education, access to people and materials through technology opens doors for teaching
    professionals and their students. Where learning another language was once confined
    to activity isolated from productive use of language in its cultural context,
    new approaches to language teaching, in conjunction with technologies called into
    its service, may make obsolete the traditional combination of "book learning"
    and the language appreciation lecture. This project demonstrates the processes
    and outcomes of the revised'
