    # Design of language instruction based on a constructivist approach


    The development of theories of second language acquisition in general, progressing
    from behaviorism to cognitionism, and most recently, in the case of theories of
    language learning, to connectionism. In connectionist models, “knowledge is in
    the connections themselves, rather than in the units themselves” (Rumhart & McClelland,
    1986, p. 132; emphasis added). Some connectionist models also take an interactionist
    perspective in which all the connections can be modified as one interacts with
    the environment. This interactionist view of learning is similar to constructivist
    approaches to learning, which builds an internal representation and interpretation
    of knowledge by internalizing and transforming new information (e.g., Bednar,
    Cunningham, Duffy & Perry, 1992; Greene & Ackerman, 1995).


    Based on these theories, pedagogical approaches in second language teaching and
    learning have also shifted emphasis from acquisition skills or learning content
    (product-oriented processes) to the interaction of the learner with the content
    and the environment (process-oriented approaches). These process-oriented approaches
    are very much in accordance with the constructivist approaches to learning and
    the emphasis on developing communicative language proficiency, as distinguished
    from grammatical competence. The next step is to integrate principles of language
    instruction based on a constructivist approach with principles of designing multimedia
    learning environments.


    Constructivist approaches to learning allow learners not to interact directly
    with information to be learned, but also to add their own information and construct
    their own relationships. In the more traditional model of learning, the “learning-as-knowledge-absorption
    model,” the learner is viewed as a passive recipient of knowledge. The purpose
    of instructional materials is to present information, and the goal of the learner
    is to absorb or acquire information. In contrast, the “learning-as-knowledge-construction
    model,” the learner is viewed as an active processor of information and constructor
    of new knowledge. The purpose of instructional media in this case is to foster
    active cognitive processing, and the goal of the learner is to make sense of the
    material and create new material. Multimedia programs aimed at fostering knowledge
    absorption simply present information. On the other hand, multimedia programs
    based on knowledge construction add options to suit the individual learning strategies
    of active learners, such as to see animations or videos, to receive text commentary
    on the material, or to hear audio supplements (Mayer, 1997). Furthermore, learners
    can be asked or encouraged to respond in modes other than the text mode,'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Networked multimedia environments 161


    that is, by employing visual and audio forms of information in addition to text.
    In this way, multimedia programs based on a constructivist model can potentially
    enhance language learning by facilitating comprehension in listening and reading
    and, by providing opportunities for learners to construct and negotiate meaning,
    in speaking, writing, and other symbolic modes. Networked multimedia environments
    provide opportunities for asynchronous and synchronous dialogue in which meaning
    can be negotiated in modes other than written or printed text. The interactions
    between among learners, as well as the interaction of the learner with authentic
    material in the Web environment, enhance the “learning-as-knowledge-construction”
    process.


    # Design issues specific to learning with networked multimedia


    The design of multimedia and hypermedia materials must be based on the underlying
    question of how to integrate SLA principles with the capabilities of the learning
    environment (e.g., Hemard, 1997; Watts, 1997). Four general capabilities or features
    of the World Web that have the potential to enhance language learning are: the
    universal availability of authentic materials, the communication capabilities
    through networking, and the nonlinear (hypermedia) structure of the information.
    All four areas have been separate topics of research, not necessarily with regard
    to language learning or considered in combination with one another.


    One of the important principles of communicative language teaching is that authentic
    language should be used in instruction whenever possible (Omaggio-Hadley, 1993).
    Authentic materials are easily accessed and instantly retrievable on the Web,
    but the sheer volume of available information, particularly when in a foreign
    language, is daunting. Instruction must be designed to provide guidance to the
    learner. Preselecting certain sites or providing specific search criteria can
    help learners see through the mass of information. As a concrete example, in the
    netLearn program, students need to select a university abroad to study. The program
    provides the URLs for five recommended universities in geographically diverse
    areas that the student can begin exploring (see Figure 2), and then lists an additional
    set of URLs for the other universities that have Web sites. (The last instruction
    on the screen, Drücken Sie hier, wenn Sie möchten, “Click here if you want to
    look at the Internet sites of other German-speaking universities.”) Learners are
    thus directed to authentic Web sites but are not overwhelmed initially by having
    to choose from a lengthy list.


    The second capability of the Web – to foster and enhance communication – has been
    documented in a wide range of studies and papers on'
