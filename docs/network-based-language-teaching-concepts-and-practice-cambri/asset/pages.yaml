    Table 3 summarizes the implications for research methods of CALL. Research on
    network-based language teaching, while potentially spanning all of these approaches,
    has so far largely limited to structural goals and methods.


    Because NBLT is an emerging area, the corpus of NBLT research includes published
    studies that examine in depth the development of discourse and discourse communities
    in on-line environments. These studies that have been published have tended to
    focus on the most quantifiable and easily measured aspects of on-line communication.
    For example, a number of studies (e.g., Kern, 1995; Sullivan & Pratt, 1996;chauer,
    1996) have quantitatively compared amount of participation in face-to-face and
    considered discussion and have found more balanced participation among students
    (and students and teacher) in the computer mode. Other studies have attempted
    to quantify the language functions used in on-line communication, connecting to
    little surprise that learners use a variety of functions in computer-mediated
    communication (Chun, 1994;chauer, 1996). Researchers have also quantitatively
    examined the linguistic features of on-line discussion and found that it is lexically
    and syntactically more complex than face-to-face discussion (Warschauer, 1996).
    These are all examples of a product-structuralist approach to NBLT research.


    This volume attempts to expand the body of NBLT research into several important
    areas that have been so far relatively neglected. These areas are context, interaction,
    and multimedia networking.'
