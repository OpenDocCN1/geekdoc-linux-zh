  md: '# The need to link to SLA research


    Some of the CALL literature also attempts to link evaluation methods to research
    in SLA, specifically including studies of interlanguage, individual differences
    (Skhan, 1989), strategies (Wenden & Rubin, 1987; Oxford, 1990; O''Malley & Chamot,
    1991), and classroom discourse (Chaudron, 1988). I will briefly summarize the
    CALL/SLA connections below. The CALL studies working within the tradition of interlanguage
    research have used the computer to linguistic data from language learners. Examples
    of such work include studies of ESL spelling errors (Chapelle & Jamieson, 1981),
    acquisition of German syntax (Garrett, 1982), and learners'' lexical development
    (Bland, Noblitt, Armington, & Gay, 1990). In the latter study, the researchers
    used learners'' queries to an on-line dictionary during completion of a writing
    assignment as an indicator of their lexical development. Because the linguistic
    data collected while learners were focused on constructing meaningful texts in
    a class assignment, one might argue for the ecological validity of the data. By
    supporting a variety of activities or language use, NBLT affords unique opportunities
    to expand computer-based interlanguage research to the study of pragmatic competence.


    The individual-differences research in SLA has provided some guidance for the
    study of CALL. Because individual differences are known to play a role in language
    teaching and learning because CALL activities offer a viable means of providing
    individual instruction, research might ideally identify CALL activities that are
    beneficial for specific types of learners. Despite the apparent richness of this
    line of research, as of the late 1990s few studies had taken up the suggestion.
    That did (Abraham, 1985) found that field-independent learners performed better
    on postests when they used a rule-presentation (deductive) approach and field-dependent
    learners performed better after using a lesson presenting examples of the structure
    (inductive approach). Investigating the same learner variable, Chapelle & Jamieson
    (1986) found that field-independent ESL students tended to have a more negative
    attitude toward the CALL under investigation, while the field-dependent students
    had more positive attitudes. A third study found that impulsive students performed
    better on an oral sentence-construction task in Spanish when the program required
    them to wait before responding (Meredith, 1978). This initial research is the
    beginning of what might prove to be an important line of inquiry—one that has
    begun to be taken up by NBLT researchers (e.g., Meunier, 1996).


    Studies of strategies have been conducted to address two research objectives:
    investigating psycholinguistic questions about language processing, and studying
    conditions of learning (Chapelle, Jamieson, & Park, 1996). Examples of psycholinguistic
    investigations are studies of EFL'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Is network-based learning CALL? 215


    learners'' reading processes through data gathered as they worked on the on-line
    dictionary (Hulijn, 1993), learners'' automaticity as inferred from response-time
    data in grammaticality judgment tasks (Hagen, 1994), and monitoring strategies
    through collection of error correction from a dictation task (Jamieson & Chapelle,
    1987). In each of these, inferences were made about learners'' ability to address
    psychol questions about L2 processing.


    Research investigating pedagogical questions relies on process data to act as
    evidence about the quality of a CALL activity in meeting instructional goal. For
    example, Goodfellow and Laurillard (1994) reported the results of a case study
    investigating learners'' use of a CALL program for vocabulary acquisition in Spanish.
    The program allowed learners to select, group, and practice vocabulary contained
    in on-line texts to achieve pedagogical goals of the selected vocabulary. The
    researchers examined learning processes by observing the choices they made during
    use of the program and think-al protocols. The results indicated that learners
    were not able to use the program effectively for vocabulary learning, and they
    needed more training if they were to use the software tools effectively – a result
    that has been found in other pedagogically oriented CALL research as well (Hsu,
    Chapelle & Thompson, 1993).


    A fourth connection with SLA research has called for methods of discourse analysis
    for describing the interactions within learning activities (e.g., Long, 1980;
    Allwright, 1988; Chaudron, 1988; van Leer, 1988; Allwright & Bailey, 1991). In
    CALL research, Esling (1991) suggested that it might be valuable to examine the
    oral and written texts that learners produce during CALL use:


    One area in the evaluation of the effectiveness of CALL with immediate and potentially
    powerful research possibilities involves the assessment of the types of discourse
    generated during a CALL activity, and its similarities and differences to the
    discourse found in non-CALL classroom activities (Esling, 1991, p. 114).


    Esling''s idea was that such research would improve understanding of the instructional
    value of various types of CALL activities by viewing them through the lens of
    familiar discourse types as outlined by Brown and Yule (1983). Fruitful work in
    using these methods has demonstrated, for example, that the discourse functions
    that students produce orally while working on CALL depend, in part, on the type
    of program the students work with (Piper, 1986; Abraham & Liou, 1991) and context-embedded,
    cognitively demanding discourse can occur in such activities (Mohan, 1992).


    Chapelle (1990) extended Esling''s basic idea by applying classroom discourse
    analysis (Sinclair & Coulthard, 1975) to the “communication'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 216 Carol A. Chapelle


    (Luff, Gilbert, & Frohlich, 1990; Hirst, 1991) that occurs between the learner
    and the computer program:


    Depending on the program, the interaction allowed can render possible a variety
    of functional acts. A precise description of an activity could be formulated by
    specifying the types of acts possible within a given CALL program, which acts
    can be used as each type of move, how moves fit together to form legal exchanges,
    with a grammar of the CALL activity defined. This grammar, then, provides an unambiguous
    statement of the parameters of student-computer interaction within a CALL program.
    The grammar of possible discourse forms a framework for describing actual acts
    of the students they work, as well as a basis for comparison with the acts allowed
    in other CALL and classroom activities. (Chapelle, 1990, p. 207)


    Renie and Chanier (1995) took a similar approach in their description of a computer
    program by conceptualizing it as a collaborator with a French learner who participates
    in goal-directed scenarios such as making a reservation at a restaurant. Their
    approach to understanding the collaboration between learner and computer is to
    characterize the nature of the utterances (i.e., the acts) each can contribute
    to the collaboration. They are then able to speculate on the potential value of
    particular collaborative sequences for second language acquisition, on the basis
    of Vygotsk''s theory of collaboration and "exolingual interaction" theory, which
    hypothesizes the nature of "potentially acquisitional sequences" of interaction
    during collaboration.


    These functional perspectives on learner–computer interaction provide a means
    for connecting CALL research to research on SLA tasks. For example, Hsu (1994)
    conducted a focused discourse analysis of interactions between learners and the
    computer to identify functions of interest for SLA (e.g., requests for modified
    input within a listening comprehension program). The normal interaction in this
    part of the program consisted of learners'' requests for continuation of a story
    with accompanying pictures on one screen after another. The researcher counted
    as "interactional modification" sequences in which this normal interaction was
    interrupted by the learners'' requests for modified input (which could be in the
    form of repetitions, writtenions, or written definitions for words in the input).
    Among the findings a significant relationship between interaction modifications
    and acquisition of specific lexical phrases with the modifications had occurred.


    Discourse analysis appears to be a useful tool for the language of NBLT. Investigating
    computer-assisted class discussion (i.e., written language transmitted over a
    network) in a first-year German class to seek evidence of the functions used,
    Chun (1994) found that learners used a number of interactional speech acts – for
    example, asking questions and requesting clarifications. She concluded that the
    computer-assisted class-discussion format created a context that was positive
    for'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Is network-based learning CALL?


    the acquisition of these acts. Others have concluded on the basis of discourse
    analysis that learners make turns in NBLT relative to some other classroom activities,
    that taking may be more evenly distributed, and that teacher control is diminished
    (Beauvais, 1992; Kelm, 1992; Kern, 1995; Waschauer, 1996; Ortega, 1997).


    # The classroom context of CALL


    In 1991, Johnson pointed out the CALL research of the 1980s needed to evolve beyond
    investigation of the linguistic and cognitive facets of development:


    The bulk of research on computers and learning in educational environments has
    focused on the cognitive aspects of learning. Yet, theory in second language acquisition
    and research in second language acquisition indicate that the social interactive
    environments of the classroom are also crucial factors that affect language learning
    in important ways. (Johnson, 1991, p. 62)


    Johnson''s suggestion to expand CALL to social interactive environments is consistent
    with the ethnographic tradition of classroom research that investigates the classroom
    contexts in which second language acquisition occurs (Watson-Gegeo, 1988). Moreover,
    a qualitative study of CALL conducted in an L1 classroom prior to 1991 pointed
    to the value of examining the role the computer players within the larger culture
    of the classroom (Kazden, Michaels, & Watson-Gegeo, 1987).


    Little work has been done far to probe questions about the sociocultural and classroom
    contexts of CALL. One study (Park, 1994) used qualitative methods to investigate
    the classroom culture of ESL learners using hypermedia learning software in an
    intensive English program in the United States. The research revealed the role
    of factors in the language program and classroom culture in shaping the learners''
    experiences with CALL. A second study (Edwards, 1994), conducted in an intensive
    program in the United States, used survey methods to investigate how the teachers''
    attitudes and knowledge of CALL influenced their CALL use. Sanaoui and Lapkin''s
    (1992) qualitative study observed the nature of the language that ESL and FSL
    (French as a second language) learners in Canada produced and the quality of instructional
    experience that learners and teachers perceived as they worked collaboratively
    with peers from the target language across a computer network. Research on NBLT
    (including the studies in this volume) helps reveal how CALL can work within the
    classroom context.


    # Sociocultural issues of CALL


    The classroom-based studies that have been cited offer insight into some of the
    sociocultural issues related to CALL use. Critical perspectives'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 218  Carol A. Chapelle


    on technology and society (e.g.


    It is clear that research in CALL must include cross-cultural perspectives. Even
    CALL researchers who wish to remain within the tradition of educational technology
    find work in that area has evolved into a number of different perspectives, including
    “a cultural constructivist approach” (Scott, Cole, & Engel, 1992; Crook, 1994).
    This approach roots in Vygotsky cultural psychology (Wertsch, 1985), which “makes
    sense of ‘learning’ by reference to the social structure of activity – rather
    than by reference to the mental structure of individuals” (Crook, 1994, p. 78).
    The perspective emphasizes that the values and priorities of culture influence
    decisions concerning such as technology use within classrooms (Olson, 1987), and
    therefore affect learners’ experiences.


    None of the themes described in this section has yet been fully developed. CALL
    research is just beginning to pull together the relevant questions, methods, and
    data. NBLT has arrived on the critical period to contribute to the evolution of
    CALL research.


    # Network learning: A critical role in CALL’s evolution


    Network learning significantly expands the scope of CALL activities and, as a
    consequence, critical investigation of NBLT offers fresh perspectives on CALL’s
    familiar themes. NBLT has already added to current evolution in CALL and is likely
    to continue to do.


    The need for CALL evaluation is more evident to observers of NBLT than it has
    ever been. Teachers and researchers who critically observe the unique registers
    of Internet chat sessions (Werry, 1996) or on-line classroom discussions cannot
    help but ask about the effects on second language development. Such registers
    are characterized by a variety of features that do not appear in many forms of
    written language, such as partial sentences, invented words, and iconic symbols.
    Because NBLT moves beyond the clear objectives and controlled instructional sequences
    of some pre-network CALL, the registers of language it produces appear chaotic.
    Collombet-Sankey describes NBLT that she considered a success as follows:'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Is network-based learning CALL? 219


    No planned activity could have created better conditions for interaction in French.
    It unlocked the dynamics of the group because a new report among students was
    established on criteria other than language competence. This reconfiguration of
    the culture of the language classroom comprises a different system of socializing
    has to be regarded as a positive development in strategic learning. (Colomb-Sankey,
    1997, p. 149)


    Despite the impression one might gain that such classroom dynamics are ideal for
    language learning, their success may be difficult to document in more concrete
    terms. When the goals of an activity are to create conditions for interaction
    and reconfiguration of classroom culture, methods of evaluation must focus on
    slippery objectives than those involving development of aspects of competence,
    for example.


    NBLT should be more complex than pre-network CALL because network-based activities
    may attempt to develop a more complex set of abilities. Barson''s description
    of a project-based methodology for NBLT is a good example of the types of learning
    goals that may be targeted by NBLT:


    At the heart of the paradigm proposed is well learning to act as oneself in a
    foreign language is the primary goal of the student, a goal involving conciliation,
    over time, of self-identity with the linguistic code under assimilation. (Barson,
    1997, p. 12)


    Such goals may prove difficult for CALL evaluation. Past work has shown that the
    more concretely defined the outcomes assessed (Doughty, 1992; Nagata, 1993; Hsu,
    1994). Researchers attempting to assess more complex outcomes, such as development
    of context-embedded and cognitively demanding language proficiency, have run into
    challenges in assessment (Mohan, 1992). Barson''s targets for NBLT appear even
    more elusive, and therefore promise to challenge efforts in evaluation. Such challenges
    are needed, however, to push forward the scope of CALL and evaluation.


    The myth of "CALL method" is exposed in NBLT through the qualitative, process-oriented
    approaches in NBLT. Based on longitudinal interviews with students and teachers,
    audiotaping and videotaping of class sessions, analysis of electronic texts, and
    classroom observation, Warsauer (Chapter 3, this volume) reveals the dramatically
    different character of the activities in each class: "These four classes provided
    a powerful illustration to that the Internet itself does not constitute a method,
    more than books, or blackboards, or libraries constitute a method." In Warsauer''s
    study, these NBLT activities were interpreted as reflecting different teacher
    beliefs and institutional ideologies. Additional research on CALL may help to
    clarify the differences'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# 220 Carol A. Chapelle


    in the language of these activities are related to the features of the activities
    that teachers design on the basis of their beliefs and institutional contexts.


    The pursuit of significant activity features in NBLT extends beyond those proposed
    for pre-network CALL. In most NBLT activities, the software does not control the
    goals, the topics, or the duration of activities. The teacher can choose to specify
    these or not, and the learners – through language – can play a significant role
    in shaping the activity. One student investigating the language of an international
    Internet discussion list interpreted results as follows:


    With new teachers and students meeting in each virtual encounter, communication
    forms from those anticipated by any model of structured community, whether of
    a Freirian community of co-investigators or a Faucauldian model of panopticon
    control, will develop. Tapping into the learning possible in this creative language
    environment is the next task for those interested in Internet-based education.
    (Warschauer & Leepentre, 1997, p. 86)


    The creativity afforded by an Internet discussion group as the one Warsauer Leepintre
    describes that a framework of CALL activity features include the sociolinguistic
    factors to influence context-containing communication. Given the global community
    that can be created through the Internet, CALL research promises to enrich the
    study of sociolinguistics and language acquisition.


    Links between CALL and SLA are also strengthened by NBLT studies such as Pelletieri’s
    (this volume), which draw on conceptual and empirical methods for investigating
    the language of L2 tasks. Given the principled basis for this research, the results
    address an important question about instructed SLA: To what extent do particular
    tasks provide opportunities for negotiation of meaning? Pelletieri describes the
    results of one such study:


    The results of this study demonstrate that task-based synchronous NBC [network-based
    communication], as chatting, can indeed foster the negotiation of meaning. Learners
    involved in NBC chats negotiate over all aspects of the discourse, which in turn
    pushes form-focused linguistic modifications. Additionally, learners provide and
    are provided corrective-feedback, which was demonstrated to result in the incorporation
    of language-forms. . . . (Pellettieri, this)


    All forms of CALL have a dynamic relationship with the classrooms in which they
    are used, but approaches to design and research of NBLT have pushed the view of
    CALL to include the classroom context of CALL. Writing about NBC, Patrikis (1997)
    notes that “a simple and often heard phrase ‘the integration of computers into
    the curriculum’ is a false lead. Once introduced in any meaningful way, the computer'
  merge: -1
  pgno: 233
- img_proc: true
