    # Conclusion


    The results of this study demonstrate that task-based synchronous NBC, such as
    chatting, might indeed foster the negotiation of meaning. Learners involved in
    NBC chats negotiate over all aspects of the discourse, which in turn pushes learners
    to form-focused linguistic modifications. Additionally, learners provide and receive
    corrective feedback, which was demonstrated to result in the incorporation of
    target-language forms into subsequent turns. Furthermore, this study indicates
    that although these routines might push learners down from the main line of discourse,
    ultimately they are facilitating mutual comprehension and successful communication.
    Because synchronous NBC fosters the negotiation of meaning and form-focused interaction,
    and students communicating through this medium have more time to process and monitor
    their interlanguage, I believe, contrary to what has been suggested in the recent
    literature, that NBC chatting can play a significant role in the development of
    grammatical competence among classroom language learners.


    This study also demonstrates the importance of the language task for the quantity
    and type of negotiation produced. Synchronous NBC tasks should be goal-oriented,
    with a minimum of possible outcomes, and should be designed in such a way that
    all participants are required to request and obtain information from one another
    for successful task completion. Task difficulty is also an important factor in
    task design. The data presented would suggest that those tasks that involve vocabulary
    beyond the repertoire of the learners, and that involve ideas, concepts, or items
    outside of their real-world expectations, can increase the quantity of negotiation
    produced. Furthermore, this study suggests that if the language goal is to promote
    an even level of learner focus on grammatical form, those tasks that require learners
    to produce and reflect on the language produced might be fruitful avenues to pursue.


    Of course, because of the descriptive nature of this study, generalizations of
    these results to other populations should be made cautiously. Future research
    of a more experimental nature is needed to better compare the differential effect
    of task types and type of corrective feedback, as well as to elucidate individual
    differences that could affect negotiation routines. Such research should also
    consider the advantages of the talk software for the investigation of issues such
    as self-repair and monitoring during chatting. Finally, further classroom research
    should consider'
