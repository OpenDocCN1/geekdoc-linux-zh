  md: '# Style shifting in asynchronous electronic discourse 91


    that she, like them, would read the conference postings. In Bell''s terms, she
    was an auditor (Bell, 1984, p. 159). Students could print any posting at any time;
    the full set of postings was printed at the end of conference and placed in the
    library for student use.


    Each conference had a slightly different set of purposes and a slightly different
    task, and intended thereby to elicit different patterns of discourse. The goal
    for the first conference (“Classics”) was to initiate student-generated body of
    shared knowledge, through which to establish it. Students chose one of forty articles
    or chapters from a list of “classics” from 1960 to 1990 that represented disciplinary
    perspectives on the study of language acquisition and language learning, including
    linguistics, psycholinguistics, psychology, and education. Students were required
    to provide a summary of their chosen article or chapter in 1, and at a later date,
    to post to any two other student summaries.


    The second conference (“Debate”) required pairs of students to read and post analyses
    of a current article from a professional journal, with one person presenting an
    analysis supporting the article''s findings and the other presenting a rebuttal
    of some kind; each pair of students worked with a different article. At a later
    date, students were again required to post responses, this time to any student-generated
    text. The purposes here were to extend the previous student interaction by asking
    the students to stage a debate, to familiarize themselves with professional journals,
    to becomeant with ways to handle dissent, and to practice identifying the four
    moves noted by Swales for initiating scientific or professional writing: Establish
    the field, summarize relevant research, and outline the purpose of the new study
    (Swales, 1990; cf. Connor, 1996, p. 41).


    We think that the use of the computer conferences was not the innovation in and
    of itself; it was instead that the “functional writing enrollments [they] [the
    students] used computers as tools to initiate new participation structures . .
    . . and affected the length and quality of student writing” (Johnson, 1991, p.
    76; from Mehan, Moll, & Ries 1985). The conferences provided student readers with
    a variety of text types and styles, from which they could identify and incorporate
    into their own writing those features that seemed effective, useful, or attractive.
    These features could require the involvement of multiparty conversation or the
    informational density of academic prose; the latter terms here are from Biber
    (1988). The students found electronic discourse surrounding them, both in their
    carefully composed summaries and critiques of the texts and in the more casual
    responses they wrote to each other.'
