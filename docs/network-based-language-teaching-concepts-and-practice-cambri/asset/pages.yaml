    # TASKS/ACTIVITIES


    In our prototype of the netLearn environment, students are presented with the
    prospect of studying abroad for a year. They must prepare themselves by going
    through an application process, requesting letters of recommendation from instructors,
    writing a statement of purpose, and gathering the necessary documents. They must
    arrange for housing abroad (e.g., find a roommate and a place to live). They must
    make travel arrangements, both for the transatlantic trip and for travel within
    Europe. In the following paragraphs, some of the individual activities and their
    specific goals will be described. What must be borne in mind, however, is that,
    in constructivist learning environments, learners have the freedom to approach
    these tasks in the order of their choice, using the tools that they find most
    helpful.


    At the beginning, learners are given their “mission”: The stage is set with learners
    receiving a letter congratulating them on their achievements in language learning
    and inviting them to study abroad at a European university. They have the option
    of hearing this letter read to them by a native speaker of German and of looking
    up unfamiliar words that have been annotated by the creators of the program. In
    addition, there is a link to an online English–German dictionary so that they
    can look up words that have not been specifically glossed. After reading and/or
    hearing the letter, they can choose one of three subgroups in any order of preference:
    Preparing for Study Abroad, Arranging Housing, or Making Travel Arrangements.
    Each of the subgroups contains a variety of activities: listening activities,
    speaking activities, writing activities, collaborating activities, and activities
    requiring negotiation.


    In order to arrange for housing, the learner consults the second subgroup, Arranging
    Housing, and is presented with a menu of different tasks. A “Housing Wanted” card
    can be filled out: The learner types in information (e.g., regarding what type
    of housing is desired, whether roommates are desired, whether he or she can afford
    to pay in rent). The learner can read other students’ cards that have been posted
    in order to find a roommate. The learner can record his or her own descriptions
    of an ideal roommate and post it for others to listen to. In addition, the learner
