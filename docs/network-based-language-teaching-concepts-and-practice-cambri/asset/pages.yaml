    # Qualitative analysis of face-to-face and computer transcripts


    An examination of the tape and computer transcripts of response-group sessions
    reveals a number of characteristics that might explain the differences produced
    by each format (see Appendices B and C for sample InterChange and face-to-face
    peer-editing exchanges). In the transcripts of face-to-face peer-editing, students
    at both courses generally centered on content alone, making suggestions to their
    peers for elaboration and clarification of ideas. In the InterChange transcripts,
    on the other hand, students elaborated on both content and organization, offering
    suggestions for improved argumentation. In the computer format, however, the French
    3 students tended to veer off the topic to discuss subjects irrelevant to the
    task, once they had written an evaluation (frequently modeled on the written evaluations
    they received from their instructors on their compositions). Thus, although students
    carried on conversations via computer, they did not necessarily stick to the business
    at hand. By contrast, in none of the French 3 face-to-face transcripts did any
    of the groups get off the topic. All discussion concerned compositions and interpretation
    of the works under consideration. This difference in student interaction dynamics
    might help explain the fewer organizational changes made by the French 3 students
    seemed to interact less humorously than face-to-face peer-editing, and considered
    their work completed as soon as they had written their assessment in one single
    InterChange turn.


    Both tape and computer transcripts of French 4 students exhibited significantly
    greater intellectual maturity than those of French 3 students. These students
    did not get off to discuss irrelevant subjects in either format, and in InterChange
    they concentrated on both organization and interpretation. Their ideas were decidedly
    better developed and more than than the French 3 groups (see Appendix B for sample
    InterChange transcripts). This difference would explain the statistical results
    obtained within the French 4 experimental group, which indicated no statistically
    significant difference in content changes due to venue (Table 3).


