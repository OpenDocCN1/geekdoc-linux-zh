    The effects of these problems were not only obvious from the session records but
    were commented on by the students in posttrial interviews. The results of the
    evaluation, therefore, have to be seen at least partly in the light of these problems.


    # Results


    # The first trial


    The first trial was organized among sixteen of the Cambridge students, with none
    of the French students participating. Thus, there was native speaker/nonnative
    speaker reciprocal peer tutoring. Students were allowed to use either English
    or French in their negotiation and planning. Although most of the interaction
    took place in English, the negotiation provided some interesting observations
    about the effectiveness of collaborative learning in general and a useful comparison
    for the second trial, with much heavier emphasis on native/nonnative speaker interaction.
    The main features we looked for in the data from the first trial were the typical
    features of metacognitive processing: framing, planning, and interaction.


    The students had been given a brief description of their task. It was left to
    the individual groups to establish a framework, identify specific goals, and to
    plan their work accurately. The effect of this approach varied considerably from
    group to group. In the posttrial, some students commented on the focus task provided
    and its integrative effect:


    > S1: The presentation is a good idea because it''s the work side and everyone
    can discuss who is going to do what and things like that.


    > S2: Because it was focused and we actually had to do something at the end of
    it, I felt I was actually using language (emphasis added).


    > S3: It''s a very good way of integrating language. Quite often the traditional
    approach to language is that it is taught in bits and pieces and people think
    of applying it in bits and pieces and don''t think of it as an all-round learning
    experience, that gave you the entire sort of range of how you would be using it,
    and how you would be expected to use a language and how you would experience it,
    which was a very, very good idea.'
