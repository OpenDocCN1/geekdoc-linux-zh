    * To distinguish primary and secondary sources.

    * To cite on-line sources and give credit to.

    * To select the available search technologies: search indices and engines, software
    packages for brainstorming, and so on.

    * Understanding implications: corporate advertising issues, authority issues,
    privacy issues, quality issues, theft/crime issues.


    Each section of the framework suggests potential implications with the activities
    are listed. Many of these implications challenge the boundaries of traditional
    teaching. Teaching students in a global, on-line context raises provocative sociopolitical
    issues that teachers need to comprehend in order to effectively teach strategies
    for autonomous learning and language usage. Instructors are encouraged to draw
    from the suggestions presented here to develop new, integrative activities that
    combine all three parts of the framework.


