    their projects and determine final outcomes. The research itself can involve collaboration
    and communication with their peers or with distant interlocutors, and can result
    in on-line publication, thus achieving integration of communication, construction,
    and research.


    # Research implications of an electronic literature approach


    Finally, we examine the concept of “research” in a slightly different guise than
    that described earlier. We now look at professional research into the learning
    process itself. Here we are concerned not so with general research into network-based
    language learning (as discussed throughout this book), but with the specific kind
    of research meant to yield insight into the development of electronic literacies.


    In this regard, we would contend that, just as the development of electronic literacies
    affects notions of student research, the investigation of electronic literacies
    affects notions of professional research. In our opinion, excellent models of
    research on electronic literacies (1) involve teachers themselves as autonomous
    investigators involved in lifelong learning (rather than having research relegated
    exclusively to outside experts); (2) involve students as well as co-investigators
    of their own learning processes (because students are essential co-constructors
    of knowledge in a learner-centered classroom) and (3) take advantage of the new
    types of collaborative interaction and co-construction of knowledge facilitated
    by electronic communication.


    An outstanding model of this type of research is provided by Heath (1992), which
    corresponded by distance with the teacher and students in a 9th-grade class as
    they collaboratively investigated the students’ use of oral and written language
    in the classroom and community. Heath’s project did not involve electronic communication
    (as either an object of study or a medium of interaction), it is not hard to imagine
    the advantages of similar action-research projects involving students, teachers,
    and, where appropriate, outside researchers jointly communicating via e-mail or
    the World Wide Web about their own electronic literacy practices. One of us, in
    fact, successfully employed such triangular electronic communication in investigating
    electronic literacy practices (see Warschauer, Chapter 3, this volume).'
