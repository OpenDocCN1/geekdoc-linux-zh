    # Summary and conclusions


    The increasing use of multimedia environments (in particular the World Wide Web)
    for language learning leads to questions such as how to reconcile instructional
    design with principles of second language acquisition, how best to support the
    cognitive processes involved in second language learning, and how to capitalize
    on the unique capabilities of the Web. So far, the Web has been used primarily
    as a source of authentic linguistic and cultural data for language learning and
    as a platform for written networked communication – features that have been exploited
    for a number of years in Web-based programs. Networked environments that allow
    learners to communicate using the full range of multimodal forms are relatively
    new, however. We have described netLearn,'
