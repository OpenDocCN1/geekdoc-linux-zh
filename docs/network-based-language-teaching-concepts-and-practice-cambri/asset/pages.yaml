    # Changing nature of computer use in language teaching


    It is within this shifting context of structural, cognitive, and sociognitive
    orientations that we can understand changes in how computers have been used in
    language teaching, and in particular the role of network-based language teaching
    today. Interestingly, shifts in perspectives on language learning and teaching
    have paralleled developments in technology from the mainframe to the personal
    to the networked computer. As will be seen, they correspond roughly to three metaphors
    of computer-based educational activities posed by Charles Crook (1994): namely,
    a tutorial metaphor (computer-as-tutor), a construction metaphor (computer-as-pupil),
    and a toolbox metaphor (computer-as-tool).'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 8 Richard Kern and Mark Warschauer


    ![](img/94e7c2d52061faa2444ce44f6bdb210e_21_0.png)


    Figure 1 Screen shot from MacFrançais (Raymond, 1988).


    # Structural approaches to CALL


    The earliest CALL programs, consisting of grammar and vocabulary tutorials, drill
    and practice programs, and language testing instruments, strictly followed the
    computer-as-tutor model. Developed originally for mainframe computers in the 1960s
    and 1970s, though still used in different variations today, these programs were
    designed to provide immediate positive or negative feedback to learners on the
    formal accuracy of their responses. This was consistent with the structuralist
    approach, which emphasized repeated drilling on the same material was beneficial
    or essential to learning.


