    suggested that the salient feature of an activity was whether the computer played
    the role of “magister” directing the student’s learning or “pedagogue” assisting
    the student’s learning Higgins, 1988. An approach reaching the role of the target
    language distinguished between communicative and noncommunicative CALL activities
    (Underwood, 1984). Levy (1997a) reviews a number of such schemes for conceptualizing
    CALL that were developed for pre-network CALL. Many of these suggest CALL programs
    can be described through multiple features such as “language difficulty” and “activity
    type” (Phillips, 1985). Description of NBLT, in contrast, typically includes two
    features of the hardware and software configurations: (1) whether the activity
    takes place over a local network or a wide area network such as the Internet,
    and (2) whether the communication takes place synchronously (i.e., in real time)
    or asynchronously (i.e., with delay, as in e-mail)


    These approaches to description provided the conceptual apparatus for researchers
    and CALL developers to describe and expand the methodological techniques underlying
    CALL design. At the same time, fall short of what is needed in three ways, as
    I pointed out in 1990:


    First, descriptions based on a single view of every CALL activity do not account
    for the details of student-computer interaction... A second problem with general
    descriptions of CALL activities is they characterize what students can or do while
    working on a computer activity, failing to describe what they do... . . [Third,
    when a CALL activity is described in terms devised and defined exclusively for
    that [activity], it is not clear how the [activity] is similar to or different
    from other CALL or classroom activities (Chapelle, 1990, p. 204)


    To move beyond a sufficient level of description, activities need to be defined
    on the basis of a description of the language that learners use through their
    interactions during the activity.


    # CALL texts


    CALL text refers to the observable record of the process of learners’ work on
    CALL activities (Chapelle, 1994). CALL texts are the data used by researchers
    to document the language and interactions relevant for empirically based descriptions
