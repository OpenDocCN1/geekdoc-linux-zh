  md: '# 10 Is network-based learning CALL?


    Carol A. Chapelle


    In his overview, Levy defines computer-assisted language learning (CALL) broadly
    as “the search for study of applications of the computer in language teaching
    and learning” (Levy, 1997a, p. 1). In Chapter 1 of this volume, Kern and Waschauer
    describe network-based language teaching (NBLT) as “language teaching that involves
    computers connected to one another either in local or global networks. On the
    basis of these broad definitions, it appears that network-based learning might
    be considered one type of CALL. Consistent with this expectation, the essays in
    this volume raise many of the same issues that have appeared in the CALL literature
    since the early 1980s – issues such as evaluation and the role of the teacher.


    Despite superficial appearances, however, one cannot be satisfied to consider
    NBLT as same as pre-network CALL simply because computers play a role in both
    types of activities.¹ From the perspective of second language acquisition, it
    is significant that learners often interact with a computer program in pre-network
    CALL activities, but they usually interact with other people in NBLT activities.
    Drawing a sharp distinction between the “impoverished” interactions afforded by
    pre-network CALL and those of NBLT, Debski (1997b) points out that “until, very
    few teachers looked to the potential of computer technology to enrich the foreign
    language classroom through fostering human to human communication and creative
    endeavour” (p. 46). From a historical perspective, Kern and Waschauer (this volume)
    explain that theoretical foundations for network-based learning are social as
    well as cognitive in nature and that uses of computer-mediated communication have
    mainly focused on creating discourse communities. The current literature reflects
    these historical roots. The NBLT literature displays the language of “activity,”
    “collaboration,” “creativity,” “experimental learning,” and even “social computing”
    (e.g., Debski, Gassin, & Smith, 1997). The pre-network CALL literature reflects
    different perspectives through language


    ¹ CALL that does not require networking is referred to as “pre-network CALL”,
    even though, as Patrikis (1997) points out, approaches to computer-based teaching
    accumulate and coexist rather than progressing in a linear fashion replacing old
    (pre-network CALL) with new (NBLT).


    204'
