  md: 'Computers and collaborative writing 123


    # Rationale of the study


    It was with these questions in mind that the present study was constituted, to
    compare the effects of two distinct process-approach formats, one computer-based
    and one face-to-face, on intermediate-level French students writing. Since 1986,
    the writing component of the second-year (intermediate-level) French program at
    the University of California Berkeley involved peer review. Students bring two
    copies of the rough draft of their compositions to class, which they exchange
    with two other classmates. As homework, students are asked to analyze the compositions
    for content, organization, and style, to comment on the composition drafts in
    the margins, and to write an evaluation offering suggestions for improvement at
    the end, an evaluation modeled on the ones teachers provide on the final drafts
    of compositions. The next day in class, students meet in their small groups and
    go over them, discussing how to improve the compositions and addressing issues
    of interpretation. The in-class small-group discussions take approximately 20
    minutes of class time. Working from their commented rough drafts, students then
    write the final draft of their papers, which they then turn in their instructors
    (see Schultz, 1991b).


    In 1992, the Language Media Center at Berkeley acquired the Daedalus Integrated
    Writing Environment, "InterChange" component allows students to communicate with
    one another via networked computer stations in real time. The program had been
    used successfully in Berkeley''s French 2 courses (second semester of first-year
    French). In a French 2 study comparing language produced via computer with that
    produced during InterChange took from two to three-and-a-half times more turns
    during in-class discussion, Kern (1995) found that students using InterChange
    found that the length of utterances for the InterChange students was longer than
    students not using InterChange. Moreover, according to the attitude questionnaire
    distributed to the students, 93% responded favorably and considered InterChange
    to be a positive addition to the French 2 curriculum (ibid., p. 469).


    The results of the French 2 InterChange study seemed to hold for the second-year
    (French 3 and 4) response group formats. Instead of discussing rough drafts and
    face-to-face, InterChange students would each have a computer networked with the
    terminals of the two other students in their response-group. In addition to the
    positive effects detailed in the Kern study, InterChange potentially offered to
    overcome three problematic areas of traditional response-group work for intermediate
    program students. In principle, students would be able to "talk" all at the same
    time instead of waiting in the face-to-face format, and therefore they would be
    able to produce more extensive'
