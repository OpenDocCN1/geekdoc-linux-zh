  md: '# Theory and practice of network-based language teaching


    # Conclusion


    Network-based language teaching does not represent a particular technique, or
    approach. It is a constellation of ways by which students communicate via computer
    networks and interpret and construct on-line texts and multimedia documents, all
    as part of steadily increasing engagement in new discourse communities. How that
    engagement takes depends on a number of factors, including the nature of interaction
    via computer, the sociocultural context that shapes interaction, and the way that
    students communicate and learn in multimedia modes. We hope that the chapters
    in this volume provide some initial steps toward a better understanding of these
    issues.


