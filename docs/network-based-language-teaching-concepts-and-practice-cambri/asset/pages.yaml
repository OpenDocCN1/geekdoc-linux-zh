    Anderson-Hsieh, 1994), intelligent tutoring systems (Chanier, Penny, Twadle, &
    Self, 1992), concordance programs (Jones, 1986; Trouble & Jones, 1990), and word
    processing (, 1993), to name a few. Similarly, a variety of activities can be
    carried out through NBLT (Warschawski, 1995). Given the variety – as opposed to
    dichotomy – of activities that can be devised in pre-network CALL and NBLT, what
    is a means of definition of CALL based on observation, description, and analysis
    of CALL texts, that, an empirically based procedure, needs to be developed through
    two levels of analysis: description of CALL texts (i.e., what learners are doing
    with language) and explanation of activity features likely to be responsible for
    the significant aspects of the texts (i.e., why the activity influences the language
    as it does).


