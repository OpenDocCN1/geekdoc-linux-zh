    come dual benefits for the development of grammatical competence: Negotiation
    provided enhanced target-language (TL) input, as messages become more comprehensible,
    and perhaps equally important, negotiation fostered modified output, as learners
    push their L2 abilities to their linguistic limits in trying to more precisely
    convey their messages.


    With regard to input, numerous studies of nonnative speaker interaction have demonstrated
    that, through careful and labored input of meaning, learners have access to both
    linguistically modified input (including grammatical simplifications and repetition)
    and interactionally modified input (including comprehension checks, clarification
    requests, and recasts), both of which serve to make the TL input in conversation
    more comprehensible (Long, 1981, 1993; Varonis & Gass, 1985; Pica, Young, & Doherty,
    1987). Comprehensible input has long been argued for the development of grammatical
    competence, by some scholars (Krashen, 1985; Schwartz, 1993), because it triggers
    internal, processes of language acquisition, and for others (Gass & Varonis, 1994;
    Pica, 1994; Long, 1996) makes TL forms and structures more transparent, in which
    case learners’ attention be more easily drawn to them. Attention to L2 form, as
    I will discuss shortly, has been claimed to be necessary for the restructuring
    of the interlanguage grammar.


    Turning to the issue of output, two aspects of interaction have been demonstrated
    to foster modified learner learning, which in turn can be beneficial to grammatical
    development. First, there is focus-focused negotiation work. Indeed, language
    production itself can push learners from the more semantic type of language processing
    required for comprehension (Swain, 1985, 1995; Swan & Lapkin, 1995), but because
    negotiation, interlocutors can zero in on the exact source of the communicative
    problem they are trying to resolve, and often often at the root of the problem
    is some aspect of the L2 form, be it lexical, syntactic, or semantic, L2 learners
    are even more likely to notice the problem and attend to these aspects of output
    while negotiating (Varonis & Gass, 1985; Gass & Varonis, 1989; Pica, Kanagny,
    & Falodon, 1993; Call & Sotillo, 1995; Swan & Lapkin, 1995). This type of selective
    attention to form within the context of meaning creation has been claimed to be
    necessary for grammatical development in a second language (Schmidt, 1990; Spada
    & Lightfoot, 1993; Gass & Varonis, 1994; Long, 1996).


    A second feature of interaction that leads to modified output is corrective feedback.
    Such feedback serves to temporarily shift attention from form learning learners
    to a cognitive comparison between


