  md: '# Summary


    The fact that having authentic purpose is beneficial for learning is not a dramatic
    new insight. It certainly also applies to language and writing classes that are
    taught without computers. However, several additional twists on this point emerge
    from the observations above. First of all, research in both the classroom (Sandholz,
    Ringsaft, & Dwyer, 1997) indicates that people’s expectation they can fully participate
    in and determine the shape of meaningful activity, so they are even more frustrated
    than usual when they are not given the opportunity. This might explain, for example,
    the resistance shown by students in Mary’s class, who could see the potential
    of computers for authentic communication but were at first denied opportunities
    to use them.


    Second, it should be noted that authentic purpose generally coincides with rhetorical
    appropriateness. For example, many teachers enthusiastically view the Web as a
    chance to publish students’ work but fail to give students the opportunity to
    develop their writings in ways appropriate for the medium. If this is any indication,
    though, students view the Web not merely as a publishing vehicle but also as a
    medium in its own right. They appropriated the task of writing for the Web when
    they were encouraged and enabled to use a full range of medium-appropriate rhetorical
    styles including texts and graphics. Similarly, e-mail has its own rhetorical
    features, and second language students can benefit from learning and practicing
    those features as well.


    Third, although authentic communication is not a necessary condition for purposeful
    electronic language use, it is not a sufficient condition. In this study, after
    some initial enthusiasm, students later tired of communication-on tasks that they
    perceived as meaningless; these tasks certainly did not bring forth the kind of
    effort and attention usually required for heightened learning. On the other hand,
    tasks perceived as tied to larger, more important goals–developing academic research
    and writing skills, maintaining and promoting their language and culture, providing
    service to real organizations – did engage high motivation and serious engagement.
    Students paid closer attention to their language during these tasks, and the extra
    effort resulted in more polished work and one, assumes greater learning.


    Fourth, the Internet appears to be a particularly important medium for fostering
    the exploration and expression of cultural and social identity. This has been
    pointed out earlier by Turkle (1995), based on her years of research on teenagers’
    on-line activity. although Turkle emphasized teenagers’ use of anonymous chat
    lines to explore fantasy selves, students in these classes seemed to be developing
    their notion of “real” selves'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# On-line learning in second language classrooms 57


    (cf. Tobin & Tobin, 1997), in some cases making important life decisions based
    on their evolving identities. This was true in Kapili''s class, students used
    the World Wide Web to explore the sense of what it means to be Hawaiian, as well
    as in Luz''s class where several students e-mail to explore their sense of what
    it means to be a graduate student.


    In summary, for electronic learning activities to be most purposeful and effective,
    it would seem that they should (a) be learner-centered, with students having a
    fair amount of control over their planning and implementation, (b) be based on
    authentic communication in ways relatively appropriate for the medium, (c) be
    tied to making some real difference in the world or in the students'' place in
    it, and (d) provide students an opportunity to explore and express their evolving
    identity.


    # Conclusion


    Ethnographic research does not claim the generalizability that is often asserted
    of quantitative studies. Readers must think about what other situation might be
    similar for some of the results of this study to be applicable. In particular
    I should point out several constraints pertaining to this study. First, all the
    classes were of second language students, rather than foreign language students.
    Second, all the classes included an important focus on writing. Third, almost
    all the students were nonlanguage-minority students who faced some degree of marginalization
    from an on-line world that was launched and is still largely populated by middle-class
    white, native English speakers. A class, for example, of middle-class Americans
    studying German 1 in the U.S. Midwest, with an emphasis on oral communication
    skills, might face very different imperatives for on-learning.


    On the other hand, issues raised in this study – in particular the need for electronic
    literacy and the factors that shape their development – likely resonate with other
    classes of students in EFL, ESL, indigenous, or bilingual educational programs.
    By developing electronic literacy, students in these kinds of programs can learn
    to better participate in the English-language-dominated on-line world and also
    to carve out on-line space for their own language and culture. The Internet does
    not constitute or prescribe a particular method; rather, it is an important new
    medium bringing together tens of millions of people throughout the world. The
    existence of on-line communication provides the potential for useful, powerful
    use of on-line communication in language and writing classes. It is up to us to
    give life to that purpose and to achieve the full potential of computer networks
    in second language teaching.'
