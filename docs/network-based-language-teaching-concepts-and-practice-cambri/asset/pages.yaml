    lexicon, the syntax, and the semantics.¹ The purpose of this chapter is twofold:
    first, to present an analysis of nonnative speaker (NNS) discourse mediated by
    synchronous NBC software in an effort to specify the potential that this new form
    of communication holds for the development of grammatical competence in a second
    language; second, to demonstrate principled-wise ways in which NBC chatting can
    be incorporated into the second language classroom so to maximize this potential.


    I will first examine ytalk, the particular software program used to mediate the
    NNS interaction; I will then review the research that motivates this investigation;
    finally, I will present the study along with a discussion of its findings.


    # Synchronous NBC through ytalk


    Ytalk is a UNIX software program that allows for synchronous NBC. Unlike e-mail,
    where the entire discourse is composed and often edited before transmission of
    the message, ytalk chats “on the fly” and participants co-construct the discourse,
    as in in oral conversations. Topics can change rapidly and turning is not dependent
    on the computer processor; speakers can self-select or interrupt each other''s
    message. This is possible because ytalk software presents users with a split screen:
    In the top half they view their own messages as they type and in the bottom half
    they view the replies from their interlocutors, letter by letter, as they are
    typed. This feature distinguishes ytalk from Daedalus InterChange, an NBC software
    program commonly used in language classrooms, because in InterChange users view
    only the final version of their partners'' composed utterances. Because of these
    specific features of ytalk, it closely resembles oral conversation over other
    NBC software programs and thus is an ideal tool to study synchronous NBC''s potential
    role in the development of grammatical competence.


    # Research background


    # Oral interaction and the negotiation of meaning


    One of the reasons that oral interaction is claimed to be beneficial to language
    development is it fosters the negotiation of meaning. Through negotiation, interlocutors
    work cooperatively to zero in one and resolve problem spots in the discourse to
    successfully convey meaning. From this discursive objective of maintaining the
    flow of conversation


