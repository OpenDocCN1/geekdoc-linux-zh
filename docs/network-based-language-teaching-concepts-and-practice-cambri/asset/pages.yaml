    # Roles for technologies


    Traditional uses of technologies – ones that adhere to a “transmission model”
    of teaching and learning – cast machines in the role of delivery systems for instruction;
    that is, audio, video, and computers are considered to be teachers and textbooks
    are used accordingly. Responsibility for a set of information and the transmission
    of information is perceived as residing in the medium, the learner in the role
    of recipient of a body of knowledge on whom she is drilled and tested. In the
    transmission paradigm, students work independently with technologies with the
    goal of arriving at a specified level of mastery of a given knowledge set. This
    project was guided by a recently evolved paradigm for technologies use, one that
    reverses the role of learners and masters inherent in the transmission model –
    that is, technologies become *slaves* to student learning rather than masters
    of it (iggins, 1998).


    A technology-mediated model places machines within carefully crafted social contexts
    where student-constructed knowledge is central. The role of the technology is
    as a tool, resource, and catalyst for socially constructed knowledge and understanding
    (Snyder & Palmer, 1986; Penfield, 1987; Papert, 1993). Learning is teacher-orchestrated
    and student-centered, with technology tools stimulating and supporting off-line
    thinking, discourse, and learning. Machines serve to cure, support, and encourage
    collaborative activity in their role as “object to think with” (Winograd & Flores,
    1988). For this curriculum, technologies were enslaved to activate, meaningful
    language learning activity.


