    # Discussion


    Unlike the majority of empirical studies on technology’s contribution to teaching
    and learning, this project enjoyed yearlong of implementation and data collection,
    rather than the “one-or two-shot deal” common to instructional technologies studies.
    The longitudinal, mixed-method nature of this project’s evaluation is, therefore,
    in keeping with current calls for more extensive, comprehensive, and context-based
    approaches to studying computer-assisted language learning (CALL) in use (Crookall,
    Coleman, & Oxford, 1992; Chapelle, Jamieson, & Park, 1996). In addition to collecting
    both formative and summative data on participant reactions and English-language
    development, the project tracked the implementation process over a significant
    period of time. It is note that, even though using the computer was very new,
    there was no initial wave of enthusiasm over the introduction of new technologies
    in the course; or, there was no novelty effect. On the contrary, it was at the
    start of the course that students reported misgivings about the nature of the
    course and its tools. However, this trepidation turned to an enthusiasm that grew
    progressively over the course of the year. Parallel to, and not independent of,
    this enthusiasm was steadily increasing sense of individual property and achievement
    on the part of participating learners. As students became increasingly confident
    in themselves as active users of English, so their instructors became more confident
    in the philosophy, methods, and technology tools of the revised curriculum.'
