    see scientifically usable, we have to be able to verbalize it, and that in elabo-
    rately controlled ways. For man there is no understanding without in- volgement
    in words. (Ibid., pp. 129–130)


    In this study we directly manifest in the writing of foreign lan- gu students
    the interaction of two different cognitive processes for ul- timately superior
    benefits. Response-group formats are considered separately, this study speaks
    for the crucial nature of the verbal in an interactive context for a positive
    impact on generating processes that in turn have a reverberative effect on organization
    and style. However, the verbal characteristics of the face-to-face formats in
    tandem with the visual characteristics of the computer format bring to bear different
    cognitive processes, which interact to produce re- sults in writing development.


