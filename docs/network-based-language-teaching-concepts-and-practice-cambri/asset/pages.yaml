    We begin with a brief outline of the theoretical assumptions on which the project''s
    methodology was based, followed by a description of the methods, a discussion
    of the results, and some preliminary conclusions.


    # Theoretical background


    Work on second language acquisition tends to take one of two fundamentally positions.
    Researchers in the tradition of cognitive science focus on the mental processing
    of the individual engaged in language learning, the general conditions of learnability,
    and the internal structures and representations involved in language learning.
    The importance of the context in which language takes places and its effect on
    learning are often played down because of a belief that environmental stimuli
    are not sufficiently rich to explain the structure of our internal representations
    and the cognitive processes that work on them. Researchers in the tradition of
    cultural psychology, on the other hand, usually stress the importance of seeing
    learning as socially and culturally situated, intramental rather than intramental
    processes. As Wertsch (1991) puts it, "The basic goal of the socio-cultural approach
    is to understand the essential relationship between these processes and their
    cultural, historical and institutional settings" (p. 6). In sociocultural approaches,
    the importance of the mind as a computational device that manipulates internal
    representations is minimized.


    For researchers who feel that both approaches have valuable insights over, it
    is difficult to find sufficient common ground between the two approaches on to
    base their work. However, recent work by Fawley (1997) may offer a way forward.
    Fawley draws a distinction between nonconscious, conscious, and metacognitive
    processing, with the first two involving the mind as a biological computational
    device, this acknowledging the concerns of cognitive science. The concept of metacognitiveness,
    on the other hand, offers a way of joining the computational and social domains;
    it is the essential interface between the mind and the individual''s computing
    device and the mind as a sociocultural phenomenon.


    In this view, the metacondious domain is concerned with high-level mental activities
    that include problem problems, planning actions, monitoring performance, reflecting
    on outcomes, and negotiating between cooperating individuals. These processes,
    by necessity, transcend the autonomous individual and involve him interaction
    with'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 188 Christoph Zahnner, Agnès Fauverge, and Jan Wong


    other individuals in social and cultural settings. Collaborating individuals to
    establish a level of intersubjectivity that sustains their cooperative efforts.
    They can do this only if they have means at their disposal to construct joint
    frames of reference, to plan, monitor, and adjust their actions. They have to
    form external representations that are at least shared and that they can manipulate
    jointly.


    This construction of shared external representations fulfils a fourfold role.
    First, it allows individuals to establish common goals and objectives. It enables
    them to plan and monitor a cooperative course of action and to evaluate the outcome
    of their activities. Second, by externalizing aspects of cognitive processing,
    the individual shares the burden of cognitive processing with others. A shared
    problem space makes it possible for individuals to share their problem-solving
    strategies and learn from one another. Third, the process of externalizing symbolic
    representations implies an element of reflexivity; the individual gains distance
    over the internal of cognitive processing and thus obtains control over some of
    his cognitive operations. He can take the position of an external controller over
    his owns actions. Fourth, and for our purpose most important, the individual who
    is a newcomer to a given social and cultural domain has a way of integrating him
    or herself into that domain by internalizing the existing representation and making
    it part of his or her own thinking. This is a true process of integration – not
    just a matter of apprehending or transferring the external to the internal mind.


    It has been claimed that any intervention to change an individual''s subjectivity
    (and learning clearly implies such an intervention) takes place at the metaconscious
    level (Neisser, 1992). The instigator of the intervention is – individual himself
    or herself, or some external agent, such as a peer or a mentor – does not matter
    in this. In view, learning implies that the learner is placed in some environment
    where he can engage in metaconscious activities with other collaborating individuals.
    The collaboration does not need to be intentionally pedagogical.


    Vygotsky''s zone of proximal development describes more precisely the conditions
    under which learning takes place. Vygotsky (1978) describes the zone of proximal
    development as "the distance between the actual development as determined by independent
    problem solving and the level of potential development as determined through problem
    solving without adult guidance or in collaboration with more capable peers" (p.
    86). The crucial features of the zone of proximal development are intersubjectivity
    and asymmetry. To be established, the cooperating individuals must share some
    symbolic external representations, usually, but not necessarily or exclusively,
    construed via a common language. Furthermore, for development to take'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Task-based language learning via audiovisual networks 189


    place, one of the individuals must have internalized more of the relevant external
    representations and show greater competence in manipulating these representations.
    He or she is able to provide the guidance necessary for the learner to acquire
    these representations and to manipulate them.


    The fact that external representations in this process are mostly represented
    through speech implies that in some sense most learning also includes form of
    "language learning," albeit usually in the native language. The difference in
    second language learning is that the mediating of socially and culturally representations
    itself becomes the focus of the learning activity.


    In this view, language learning, as a deliberate and controlled activity, is essentially
    an intermental (social and cultural) process situated at the metaconscious level.
    This is not to deny that the conscious and unconscious levels are also involved.
    The metaconscious level, after all, is seen as resting on these levels and extending
    the internal computational device into the external world. Moreover, the learning
    practice will itself shape automatic processes at the conscious level and to a
    lesser degree at the unconscious level. However, learning as intersubjective activity
    with possibilities of control and intervention has to focus on the metaconscious
    level and is thus mainly concerned with issues of problem framing, negotiation
    of meaning, planning, monitoring, and evaluation. Put differently, both the fact
    and the outcome of learning will turn on the successful establishment of a zone
    of proximal development for the learner.


    # Research questions


    Based on the preceding theoretical orientation, the LEVERAGE project involving
    designing and implementing a network-based language learning environment. Our
    research attempted to answer a range of questions: Did the environment and the
    tasks provided offer sufficient common ground for learners and their collaborators
    in the learning process to establish a shared frame of reference, to map out the
    problem space, and to work together toward a common goal? Were sufficient opportunities
    for learners to construct new concepts through the negotiation of new meanings?
    Did the learners, by externalizing their thinking, share the cognitive burden
    with other, more competent, collaborators and also engage in a process of reflection
    on their thinking, allowing them ultimately to gain greater control over their
    thinking? In general, did the environment offer opportunities for planning, monitoring,
    and evaluation of learners’ activities?'
