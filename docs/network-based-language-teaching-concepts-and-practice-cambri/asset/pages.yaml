  md: '# # Introduction


    Theory and practice of network-based language teaching


    Richard Kern

    Mark Wachschauer


    Since the early 1960s, language teachers have witnessed dramatic changes in the
    ways that languages are taught. The focus of instruction has broadened from the
    teaching of discrete grammatical structures to the fostering of communicative
    ability. Creative self-expression has come to be valued over recitation of memorized
    dialogues. Negotiation of meaning has come to take precedence over structural
    drill practice. Comprehension has taken on new importance, and providing comprehensible
    input has become a common pedagogical imperative. Culture has even if many teachers
    remain unsure how to teach it. Language textbooks have begun to distinguish spoken
    and written forms, and commonly incorporate authentic texts (such as advertisements
    and really) alongside literary texts. It is in the context of these multifaceted
    changes that one of the most significant areas of innovation in language education
    – computer-assisted language learning (CALL) – has to age. Nowadays, audiotape-based
    language labs are gradually replaced by language media centers, where language
    learners can use multimedia CD-ROMs and disc access, access foreign language documents
    on the World Wide Web, and communicate with their teachers, fellow classmates,
    and native speakers by electronic mail. If language teaching has become more exciting,
    it has also become more complex.


    This book deals with one form of CALL, what we call network-based language teaching
    (NBLT). NBLT is language teaching that involves the use of computers to connect
    to one another in either local or global networks. Whereas CALL has traditionally
    been associated with self-contained, programmed applications such as tutorials,
    drills, simulations, instructional games, tests, and so on, NBLT represents a
    new and different side of CALL, where human-to-human communication is the focus.
    Language learners with access to the Internet, for example, can now communicate
    with native speakers (or other language learners) all over the world twenty-four
    hours a day, seven days a week, from school, home, or work. That learners can
    communicate either on one-to-one or many-to-many basis in local-area network conferences
    further multiplies their opportunities for communicative practice. Finally, the
    fact that computer-mediated communication occurs in a written, electronically'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Richard Kern and Mark Warschauer


    archived form gives students additional opportunities to plan their course to
    notice and reflect on language use in the messages they compose and read.


    Given these possibilities, it is not surprising that many language teachers have
    enthusiastically embraced networking technology and have developed creative ways
    of using networked computers with their students (see Warschauer, 1995, for 125
    such examples). On the other hand, many other teachers remain skeptical of the
    value of computer use in general. A 1995 survey of instructional use of technology
    in twelve academic areas (Cotton, 1995), for example, showed that 59% of foreign
    language programs and 65% of ESL programs used no computer technology in their
    courses – placing language teaching at the bottom of the list of academic surveyed.


    To date, there has been relatively little research that explores the relationship
    between the use of computers and language learning. The simple question to which
    everyone wants an answer – Does the use of network-based language teaching lead
    to better language learning? turns out not to be so. The computer, like any other
    technological tool used in teaching (e.g., pencils and paper, blackboards, overhead
    projectors, tape recorders), does not in and of itself bringing about improvements
    in learning. Furthermore, we must look to particular practices of use in particular
    contexts in order to begin to answer the question. These practices of use must
    be described as well as evaluated in terms of their specific social context. Who
    were the learners? What did they do? For what purpose? In what setting? What kind
    of language? In what patterns of social interaction? What were the outcomes in
    terms of quantity/quality of language use, attitudes, motivation?


    This book is written for researchers, graduate students, and teachers who are
    interested in the theory and practice of network-based language learning. The
    book has two main purposes: (1) to frame a conceptual rationale for network-based
    teaching in trends of language acquisition theory and educational theory, and
    (2) to present a variety of empirical studies that will help scholars and educators
    make informed decisions about both pedagogical practices and future research.


    In this first chapter, we situate NBLT within the history of approaches to second
    language education as well as the particular history of computer-assisted language
    learning. We also discuss some of the particular research issues associated with
    network-based language teaching, and identify gaps in our knowledge chapters that
    this volume help to fill.


    # Shifting perspectives on language learning and teaching


    Although the changes in language teaching are described at the beginning of this
    chapter are often characterized in terms of a polar shift from struc'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Theory and practice of network-based language teaching


    tural to communicative perspectives on language teaching, we perceive a more complex
    overlapping of three theoretical movements – structural, cognitive, and sociocognitive
    – in the recent history of language teaching. Because each of these theoretical
    perspectives has influenced how computer technology has been used in language
    teaching, we will begin by briefly tracing the development of these perspectives.


    # Structural perspective


    For much of the twentieth century (as well as preceding centuries), language teaching
    emphasized the formal analysis of the system of structures that make up a given
    language. The grammar-translation method, for example, trained students to memorize
    verb paradigms, apply prescriptive rules, parse sentences, and translate texts.
    From the 1920s through the 1950s, influenced by the work of American linguists
    (e.g., Bloomfield, 1933), various structural methods of language instruction were
    developed, culminating in the audolingual method of the 1940s and 1950s. Although
    audolingual teaching focused on spoken rather than written language skills, it
    shared two principal assumptions with the grammar-translation method: that language
    teaching syllabus be organized by linguistic categories and that the sentence
    was the primary unit of analysis and practice. Strongly influenced by the work
    of behavioral psychologists such as John Watson and B. F. Skinner, methodologists
    conceived of learning as habit formation and saturated students with dialogues
    and patterns designed to condition learners to produce automatic, correct responses
    to linguistic stimuli. Contrastive analyses of the structural differences between
    the native and target languages (e.g., Lado, 1957; Moulton, 1962; Stockwell, Bowen,
    & Martin, 1965) provided the basis for careful selection, graduation, and presentation
    of structures. Practice, not abstract knowledge, was the key.


    Approaches to the teaching of reading and writing also reflected the emphasis
    on structure. During the audolingual period, reading was largely seen as an aid
    to the learning of correct structures; students were instructed to read out loud
    in order to practice correct pronunciation. Secondlanguage writing instruction
    focused on students’ production of formally correct sentences and paragraphs.
    At more advanced levels, contrastive however used to provide examples of L1/L2
    essay structure differences. In some, the emphasis in speaking, reading, and writing
    was on the achieved linguistic product, not on cognitive or social processes.


    # Cognitive/constructivist perspective


    By the early 1960s, the audolingual method began to be criticized as being overly
    mechanical and theoretically unjustified. Noam Chomsky'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Richard Kern and Mark Warschauer


    (1959) rejected B. F. Skinner’s behaviorist notion of language learning, arguing
    that because a speaker of a language can produce (and understand) an infinite
    number of well-formed utterances, language competence could possibly be explained
    by a model based on imitation and habit formation. Instead, Chom (1957; 1965)
    proposed a transformational-generative grammar that mediated between deep structures
    and surface structures of language. The development of an individual’s grammatical
    system was guided by innate cognitive structures – not behavioral reinforcement.
    In the language teaching world, Chomsky’s theory contributed to a gradual shift
    in goals from instilling accurate language habits to fostering learners’ mental
    construction of a second language system. Errors come to be seen in a new light
    – not as bad byproducts of a creative learning process that involved simplification,
    generalization, transfer, and other general cognitive strategies. Language learning
    had thus come to be understood not as conditioned response but as an active process
    of generating and transforming knowledge.


    Although this new perspective at led renewed attention to the teaching of grammar
    rules (e.g., the cognitive code learning method), it later de to an emphasis on
    providing incomprehensible input in lieu of an explicit focus on grammar (Krashen,
    1982). The purpose of providing comprehensible input, at least in Krashen’s view,
    was not to foster authentic interaction (indeed, Krashen felt that learners’ speech
    was largely irrelevant to learning learning), rather to give individuals an opportunity
    to mentally construct the grammar of the language from extensive data.


    The influence of cognitive approaches was seen quite strongly in the teaching
    of reading and writing. Following developments in first language reading and writing
    research, second language educators came to see literacy as an individual psycholinguistic
    process. Readers were taught a variety of cognitive strategies, both top-down
    (e.g., using schematic knowledge) and bottom-up (e.g., using individual word clues),
    in order to improve their reading processes. Second language writing instruction
    shifted its emphasis from the mimicking of correct structure to the development
    of a cognitive, problem-solving approach, focused on heuristic exercises and collaborative
    tasks organized in staged processes such as idea generation, drafting, and revising.


    # Sociocogn perspective


    At about the same time that cognitively oriented perspectives on language acquisition
    were gaining popularity, Dell Hymes, an American sociolinguist, and Michael Halliday,
    a British linguist, reminded educators that language is not just a private, “in
    the head”, but rather a socially'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Theory and practice of network-based language teaching


    constructed phenomenon. Hymes, who coined the term communicative competence in
    response to Chomsky''s mentalistic characterization of linguistic competence,
    insisted on the social appropriateness of language use, remark, "There are rules
    of use without which the rules of grammar would be useless" (Hymes, 1971, p. 10).
    For Hymes, syntax and language forms were best understood not as autonomous, contextual
    structures, but rather rather as meaning resources used in particular ways in
    particular speech communities. Grammaticality was not separable from social acceptability,
    nor was cognition separable from communication.


    Halliday posted three principal functions of language use – ideational, interpersonal,
    and textual. In doing so, he brought to attention the fact that language teaching
    had only dealt with the first of these – ideational (i.e., use of referential
    language to express content) – while the interpersonal function (i.e., use of
    language to maintain social relations) and the textual function (i.e., to create
    situations relevant discourse) had largely been neglected.


    In the 1980s, communicative competence became the buzzword of the language teaching
    profession. What needed to be taught was longer just linguistic competence but
    also sociolinguistic competence, discourse competence, and strategic competence
    (Canale and Swain, 1980; Canale, 1983). With interactive communicative language
    as the call of the day, communicative processes became as important as linguistic
    product, and instruction became more learner-centered and structurally driven.
    In a sociocognitive approach, learning was not just in terms of changes in individuals''
    cognitive structures but also in terms of the social structure of learners'' discourse
    and activity (Crook, 1994, p. 78). From this point of view, cognitive and social
    dimensions overlap in a "dialectical, co-constitutive relationship" (Nystrand,
    Greene, & Wemelt, 1993, p. 300). Or, as Holquist (1990) puts it, "Discourse does
    not reflect a situation, it is a situation" (p. 63).


    From this perspective, language instruction was not just in terms of providing
    input, but rather helping students enter into the kinds of authentic social discourse
    and communities that would later encounter the classroom. Some this was to be
    achieved through various types of task-based learning, in which students engaged
    in authentic tasks and projects (see, for example, Breen, 1987; Candlin, 1987;
    Prabhu, 1987; Long & Crookes, 1992). Others emphasized content-based learning,
    in which students learned language and content simultaneously (e.g., Snow, 1991;
    Flower-dewyd, 1993).


    In sociocognitive approaches, reading and writing came to be viewed as processes
    embedded in particular sociocultural contexts. Instruction focused not only on
    individual learning strategies but also on'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Richard Kern and Mark Warsauer


    TABLE I. PEDAGOGICAL FOCI IN STRUCTURAL, COGNITIVE, AND SOOCOGNITIVE FRAMEWORKS


    | | Structural |

    |---|---|

    | Who are some key scholars? | Leonard Bloomfield, Charles Fries, Robert Lado
    |

    | How is language viewed? | As an autonomous structural system. |

    | How is language understood to develop? | Through transmission from competent
    users. Internalization of structures through repetition and corrective feedback.
    |

    | What should be fostered in students? | Mastery of a prescriptive norm, imitation
