    # The data


    Data about the subjects'' interaction with each other and the system was collected
    in a number of ways. All students were given a pretrial questionnaire in order
    to assess their general education, language background, and expectations. A posttrial
    questionnaire allowed comparison with initial expectations and asked for opinions
    and suggestions. After each trial, the participants were interviewed and asked
    a range of questions about their impression of the usability of the system. These
    interviews were tape-recorded on videotape (with the camera looking at the screen
    and the audio signal from all participants in the group recorded). These sessions
    were later transcribed for analysis. The system tracked a range of user statistics,
    including the use of particular modules such as videoconencing, the users'' access
    to resources, and their time on the system.


