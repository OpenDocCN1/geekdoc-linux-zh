    task, and the multimedia information provided. For example, students who are classified
    as visualizers (based on their behavior of selecting visual information for unknown
    vocabulary words) learn lexical items when these words are presented in a visual
    mode (e.g., pictures, videos), whereas students who are classified as verbalizers
    (based on their behavior of selecting verbal information for unknown vocabulary
    words) learn lexical items when these words are presented in a verbal mode (e.g.,
    written translations) (Chun, Mayer, & Leutner, 1998). The effects of multimedia
