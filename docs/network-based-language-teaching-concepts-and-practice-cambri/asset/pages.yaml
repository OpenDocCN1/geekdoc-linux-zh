    # Concluding remarks


    An asynchronous electronic conference has a number of learning curves associated
    with it, for its sponsors as well as its participants. Its utility for researchers
    is that it stores all contributions, preserves the dynamics of responses, and
    provides a window into the group mechanisms of how a knowledge community forms,
    thus, a completed conference becomes a document – a data collection. A number
    of questions and investigation techniques could be brought to bear on such a collection.
    Here we worked mainly with discourse and corpus linguistic issues and limited
    the scope mainly to how three Asian graduate students accommodated to styles they
    perceived in the conference interaction, particularly those of native speakers.


    The final reports of the second language students were more reflective of their
    realization that they had adjusted their discourse patterns, whereas the native
    English wrote more about their awareness of writing in and for a community. The
    conferences seem to have a netiquette of one, such as adhering to a rule like
    “more than usually polite.” At the same time, politeness indicators such as compliments
    also reflected social negotiation, especially assumptions of authority, in how
    they signaled approbation alone without bestowing explicit agreement or alignment.
    The Chinese and Japanese participants showed a trend of cultural adjustment, here
    we illustrated the changing contributions by Wang. Compliments also reflected
    the fact that the second language graduate students had more authority in the
    classroom than the primarily NES undergraduates in'
