    # The purpose of literacy activities


    From the preceding discussion, we can see that students experienced the use of
    technologies in these classes, not as an aid for learning language or writing,
    but rather as an important new medium of literacy in its own right. In most cases,
    they saw a focus on new electronic literities as complementing and contributing
    to their more general learning purposes. In other cases, they saw on computers
    as taking away from the main purpose of the classes. What then, seemed, to help
    or hinder a positive integration of electronic literities with the more general
    content material of the classes? Although there were many different contributing
    factors, I view them as all connected to a single overriding principle: the purpose
    of electronic literacy activities. In short, if students understood the purpose
    of the activities, found them culturally and socially relevant, and were able
    to use the new media in appropriate ways to strive to achieve the purpose, the
    activities were most successful. In situations where students did not understand
    the purpose, found the purpose culturally or socially irrelevant, or were instructed
    to use the new media in ways that were not appropriate for the purpose, the activities
    were less successful. A comparison of the features and results that describe the
    strong- weak purpose activities noted in this study is given in Table 1.


    I will illustrate examples of these by revisiting each of the four classes. In
    Mary Sanderson''s ESL writing class at Miller College, computer-based assignments
    included on-line grammar exercises, numerous typing drills (for students who already
    knew how to type), small-group electronic exchange of paragraphs for correction,
    and submission of short e-mail letters to be corrected by the teacher before being
    sent to a number of different key pals. Students perceived most of this to be
    computer busywork with little or no relationship to their goal of becoming better
    writers, and they resented it. They felt overwhelmed with tedious tasks, especially
    during the first half of the semester. As Julie, a female student from Samoa told
