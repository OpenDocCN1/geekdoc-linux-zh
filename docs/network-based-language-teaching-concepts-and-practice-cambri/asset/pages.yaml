    # Lexical inventory


    The two quotes from Yoshi above suggest that one of the ways in which he observed
    himself as emulating a Western style of writing is by his lexical selections.
    The introductory “That is” echoes the same phrase in a preceding passage and different
    context in the original source. Its word choice appears to correspond more to
    an academic, or lecturing, style. The second sentence illustrates a more conversational
    style. Both would, of course, be appropriate to choices, given the task of each
    posting.


    To explore whether Yoshi’s lexical inventory was an indicator of stylistic change
    or accommodation, we computed an index of “lexical density” by Michael Stububs,
    in which lexical density equals 100 x L/N (L the lexical words and N the total
    number of words) (Stububs, 1996, p. 72). The percentages for the two passes in
    Yoshi’s summary were consistent, both 62% (compared to 60% and 58.6% in the original
    Oberl). The percentage of lexical words dropped considerably however, in his personal
    reply to KAKASHI, to 49%. Such a relative increase in function words over lexical
    words has been taken to indicate a different style of discourse. Stububs summarizes
    surveys tend to have a lexical density in the range of 36% to 57%, whereas spoken
    texts typically range from 24% to 43% (Stububs, 1996, p. 72). On the basis of
    Stububs’s own surveys, the density index of Yoshi’s summary would pattern with
    written non-fiction from the Lancaster-Oslo Bergen (L) corpus, whereas the lexical
    density of his personal response would pattern either with written fiction from
    that same corpus or spoken “public speeches” or “answer-phone” messages in the
    Lund corpus, right on the border (45%–50%) between spoken language with and without
    feedback from other speakers (p. 74). Large-corpus surveys have established ranges
    of lexical density for different languages, there is a possibility that Yoshi’s
    self-reported awareness of stylistic differences extended to their lexical inventories.


    It should be noted that Yoshi’s consistency in lexical density for both samples
    from his summary and his remarkable closeness to Oberl’s original source are not
    simply the result of copying. Yoshi’s clause length is slightly different from
    Oberl’s in both samples: 10.3 words per clause compared to Oberl’s 10.7 in “Yoshi
