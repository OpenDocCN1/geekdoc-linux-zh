    ally allowing only one acceptable response per item. These factors, combined with
    the learning of purely behavioristic approaches to language learning at both theoretical
    and pedagogical levels, as well as the development of more sophisticated personal
    computers, propelled CALL into its second generation.


    # Cognitive approaches to CALL


    In line with cognitive-constructivist views of learning, the next generation of
    CALL programs tended to shift agency to the learner. In this model, learners construct
    new knowledge through exploration of what Seymour Papert has described as microworlds,
    which provide opportunities for problem solving and hypothesis testing, allowing
    learners to utilize their existing knowledge to develop new understandings. Extending
    a tradition of thought popularized by John Dewey and Alfred Whitehead showed that
    learning occurs through active creation, Papert (1980) and his colleagues at the
    MIT Media Laboratory flip the earlier computer-as-tutor metaphor on its head,
    seeing computers as things to be controlled by, rather than controlling learners.
    The computer provides tools and resources, but it is up to the learner to do something
    in this simulated environment (e.g., in Papert''s Turtle Logo program, learners
    program a turtle to carry their instructions.


    A more recent and sophisticated application in this tradition is the multimedia
    video *A rencontre de Philippe* (Furstenberg, Murray, Malone, & Farmanian, 1993),
    developed by the Athena Language Learning Project at the MIT Laboratory for Advanced
    Technology in the Humanities. *Philippe* is a game for intermediate and advanced
    French learners that incorporates full-motion video, sound, graphics, and text,
    allowing learners to “walk around” and explore simulated environments by filming
    screens or floor plans, as shown in Figure 2. Filmed in Paris, the video creates
    a sense of realism, and the branching of the story lines maintains the player''s
    interest. To help language learners understand the challenges spoken French, the
    program provides optional comprehension tools, such as transcripts of all audio
    segments and a glossary, as well as a video album that includes samples of many
    of the language functions one would teach in a communicative approach as expressing
    feelings, saying hello and goodbye, and using gestures. Students can easily create
    their own custom video albums, which they store on their own computer diskettes.¹


    +   1 Other multimedia programs using high-quality video and branching technology
    to create vivid worlds include *Dans un quartier de Paris* (Furstenberg, in press),
    *Nouvelles dimensions* (Noblitt, 1994), and * Nuevas dimensiones* (Noblitt, Rosser,
    & Martinez-Lage, 1997).'
