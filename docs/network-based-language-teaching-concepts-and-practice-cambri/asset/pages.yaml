    Why do evaluation issues continue to plague CALL researchers? Perhaps one of the
    thorniest problems in evaluating CALL, which is evident in NBLT as is in pre-network
    CALL, is the temptation to equate the computer with a method of instruction.


    # The myth of “CALL method”


    The most intuitively logical method of evaluation for CALL is comparison of the
    linguistic or cognitive outcomes between learners who have used CALL and those
    who have not. This intuitive approach to evaluation, which treats the computer
    as a method of instruction, has been problematic in CALL evaluation for at least
    two reasons. First, the focus on outcomes neglects important evidence for the
    quality of instruction in second language learning. As second language classroom
    researchers have'
  merge: -1
  pgno: 224
