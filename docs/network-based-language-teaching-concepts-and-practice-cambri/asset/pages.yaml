    factors influencing the process of learning (Seliger & Long, 1983; Day, 1986;
    Wright, 1988; Chaudron, 1988; van Leer 1988; Allright and Bailey, 1991; Johnson,
    1995). Other researchers in educational technology working within the social constructivist
    paradigm echo this, arguing for example, that “the educational context that is
    created online ... needs to be the focus of analysis” in research on computer
    use (Riel & Rasmussen, 1994, p. 92) and that “computer in and of itself is hardly
    a conceptually satisfying variable likely to have consistent and predictable results”
    (Schofield, 1995, pp. 6–7).


    The second problem with method comparison studies is that they rest on the faulty
    assumption that the computer itself constitutes a method of instruction. Clark
    (1985, 1994) argues in research that “instructional methods [have] been confounded
    with *media*” and that “it is the methods which influence learning” (Clark, 1994,
    p. 22). Clark defines “methods” as the “structural” characteristics of tasks for
    learners who engender the processes and strategies necessary for learning; he
    contrasts methods with “media,” a means of delivering methods to learners. His
    argument can be challenged on a number of grounds, including his assumption that
    media and methods can be distinguished, yet Clark succeeds in questioning any
    general claims about the effects of the computer on learning. More his argument
    helps to point out that, rather than studies focused on “the computer”, there
    is a need for studies that attempt to isolate and investigate the relevant structural
    task features in computer-assisted learning environments.


    Doughty (1992) develops this general argument for the specific case of second
    language learning and CALL, pointing out that CALL activities should attempt to
    operationalize those features that are theorized to facilitate SLA. The object
    of investigation, then, changes from the effects of the computer to the learners’
    interactions and outcomes involving particular features. The challenge in this
    promising line of research, both for pre-network CALL and for NBLT, is to identify
    the features that should be developed in CALL activities and to identify appropriate
    methods for investigating their effects.


    # Significant features of activities


    Past CALL research has examined specific aspects of CALL activities such as the
    role of the linguistic input to learners and the type of interaction supported.
    For example, Schaeffer (1981) compared what he called “meaningful” versus “nonmeaningful”
    input in German grammar lessons and found the “meaningful” input better. Doughty
    (1991) compared the effects of two different types of explicitly salient input
    with input that was not explicitly flagged to direct learners’ attention. The
    learners'
