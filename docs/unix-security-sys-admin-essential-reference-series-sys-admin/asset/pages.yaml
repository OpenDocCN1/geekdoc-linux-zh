- pgno: 201
  md: "# Listing 16.1 (continued)\n\n```\n# Check system for pending batches\nsub\
    \ uucpbatch\n{\n    local( $sysnam ) = @_; \n\n    open UUSTAT, \"uustat -s $sysnam\"\
    \ || warn \"Cannot start $uustat, $!\\n\" && return 1;\n    while( <UUSTAT> )\
    \ {\n        close UUSTAT;\n        return 1;\n    }\n    close UUSTAT;\n    return\
    \ 0;\n}\n# uucpbatch\n\n# Delete one UUCP host from uucp configuration\nsub deluucp\n\
    {\n    local( $deleteme ) = @_; \n    local( $sysnam, $backup, $dummy );\n   \
    \ local( $uid, $gid, $mode );\n\n    # Back up older versions\n    &backupfile(\
    \ $uuconf );\n    $backup = $uuconf . \".o\";\n\n    open ORIGINAL, \"$backup\"\
    \ || warn \"Cannot open $uuconf, $!\\n\" && link $backup, $uuconf && return;\n\
    \    open NEW, \">$uuconf\" || warn \"Cannot creat $uuconf, $!\\n\" && link $backup,\
    \ $uuconf && return;\n\n    while( <ORIGINAL> ) {\n        if( /^\\*START .*\\\
    $/ ) {\n            chop;\n            $sysnam = $.;\n            $sysnam =~ s/^\\\
    *START //;\n            if( $sysnam ne $deleteme ) {\n                while( <ORIGINAL>\
    \ ) {\n                    last if (/^\\*END .*\\$/);\n                }\n   \
    \         }\n            else {\n                print NEW;\n                while(\
    \ <ORIGINAL> ) {\n                    print NEW;\n                    last if\
    \ ( /^\\*END .*\\$/);\n                }\n            }\n        }\n        else\
    \ { print NEW; }\n    }\n    close ORIGINAL;\n    close NEW;\n    # Set ownership\
    \ and permissions\n    &setperm( $backup, $uuconf );\n    &deluser( $deleteme\
    \ );\n}\n# deluucp\n```"
