- pgno: 62
  md: '# Security Issues


    Granting some super-user privileges to ordinary users and depending on their login
    passwords for security is likely to cause security problems. If a user with sudo
    privileges has a poor password, shares the password, or has it stolen, then the
    super-user privileges granted to that user have also been compromised. The following
    text lists a number of things that you can do to limit this risk.


    +   - Require that the users use good passwords.

    +   - Give sudo privileges only to those users who really need them.

    +   - Give users sudo access only to the commands that they need.

    +   - Monitor the log files to see what the users are doing.


    Some commands should not be given out to sudo users. For example, certain commands
    circumvent the logging procedure. These are commands that spawn an interactive
    shell or replace the sudo process with another process. These include sh, ksh,
    csh, rsh (restricted shell), and exec. Other commands increase the risk to other
    systems, particularly in a Trusted Computer Base. These are rlogin and remsh (remote
    shell, rsh on some systems). These programs allow you to logon to another computer
    without requiring a password. Still other commands, such as chmod and chown, can
    be used to coerce additional permissions and can be used to make set-UID shells
    that can be executed outside of sudo.


    # Security Measures


    The locations of the configuration file, log file, and time directory should be
    known only to the security manager. Any user who knows where these files are located
    can manipulate them to add users or commands to the configuration file, to add
    commands in the secure path to be executed via sudo, or to alter the logfile.
    One way to obscure the location of these files is to put them in a hidden directory,
    that is, a directory whose name starts with a period, with no read or write permission
    for anyone and root ownership. A directory name that cannot be typed would actually
    be better. Only commands that are to be executed would be placed in this directory,
    and permissions for these commands should be execute only, no read or write permissions.


    The source code should not be left online and the binary file should be marked
    as execute only, with no read or write permissions for anyone. Failure to observe
    these guidelines would allow someone to locate the path to the configuration and
    log files and time directories.'
  merge: -1
