- pgno: 154
  md: '# Connections from the Internet


    To allow the telnet connections via the network from the Internet, we opened up
    the telnet port (port 23) on the gateway router to a specific machine on our LAN.
    At this point, there were two possible methods we could have chosen to implement
    the challenge/response login.


    +   - Setup a firewall machine with restricted access into which the remote connection
    would be established. The login shell for the user would prompt with the challenge/response
    senerio. A successful response would present the user with a menu giving access
    to a restricted set of machines on the LAN.


    +   - Modify the telnet daemon on the special machine in the Centre to give the
    initial login challenge. A successful response to the challenge would present
    the user with a single-try password prompt that, if successfully entered, would
    give the user a normal shell.


    The first method had one particularly bad drawback. If the password file was not
    maintained properly, the user could be given a normal shell instead of the restricted
    shell. This meant that security was dependent on an administrative setup. We chose
    the second method because it proved to be more flexible for accessing machines
    in the Centre and it placed the responsibility for implementing the security in
    an executable module rather than an administrative setup (as in the firewall case).
    The drawback to this method was that it required access to the source code for
    the login program we wished to modify. Without this source code, the only option
    would have been a firewall machine.


    The linchpin to our challenge/response scenario is the SecureNet encryption key
    (SNK) from Digital Pathways, Inc. This hardware key implements a simple mutual
    authentication scheme using DES as the encryption method (see the sidebar "About
    the SecureNet Key"). We used the C code provided by Digital Pathways for deciphering
    the DES key.


    # Modified telnet Program


    The telnetd, rshd, and rlogind programs are used to manage connections through
    a network. The telnetd daemon is launched by the inet daemon when inetd detects
    a TCP connection attempt on port 23; it executes the login program to prompt for
    a user ID/password combination. We modified the telnetd program to call our login
    wrapper program, snklogin, instead. The rshd and rlogind programs were not modified.
    This allowed local users to bypass the SNK challenge/response procedure for internal
    machines. In our security setup, the lack of SNK security on these programs did
    not present a problem. The gateway router turns back connector attempts coming
    from outside our local area network on the ports for rlogin, rsh, and rexec.'
