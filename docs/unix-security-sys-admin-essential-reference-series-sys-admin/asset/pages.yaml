- pgno: 69
  md: 'TIME and TIMEDIR allow a user to enter a number of sudo commands without re-entering
    his or her password if the TIME has not expired. This is managed by making timestamp
    files in the TIMEDIR directory. Setting TIME to 0 disables this option. This directory
    also needs appropriate permissions.


    SUDO_COP is the mail address of the security manager, where information about
    violations is to be sent. The mail address must be in a format understood by the
    mail system running on the node where sudo is installed.


    # Configuration File


    The configuration file consists of the user''s logon name, followed by either
    the commands that the user can execute, the not option and the commands that this
    user cannot execute, or the all option that allows this user to execute all commands.
    The following lines represent three users: the user operator, who can execute
    the du and dump commands; the user nice_guy, who can execute all sudo commands;
    and the user buster, who cannot execute the command sh.


    ```

    operator du dump

    nice_guy all

    buster not sh

    ```


    Only commands that are in the secure path can be executed with sudo.


    # Log File


    The log file contains the date and time that sudo was executed (whether it was
    successful or not), who executed sudo, and the command line used with the sudo
    command. The following is an excerpt of a sudo log file.


    ```

    Mon Aug 15 9:25:42 : SUCCESS buster vi /etc/hosts

    Mon Aug 15 11:30:05 : FAIL operator lpshut

    Tue Aug 16 22:02:46 : SUCCESS buster mv rouge/bin

    Thu Aug 18 8:05:21 : FAIL hacker vi /etc/passwd

    Fri Aug 19 16:54:02 : SUCCESS nice_guy shutdown -h

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Using sudo


    Using sudo is generally very straightforward. You invoke the sudo command, followed
    by the command and parameters that you wish to execute with super-user privileges.
    For example, to edit the password file you would type the following command.


    ```

    sudo vi /etc/passwd

    ```


    Some situations are not so obvious. If you are pipelining commands, you have to
    invoke sudo for each command in the pipe that requires super-user privileges.
    For example, if you wish to find all the files on the system and create a cpio
    archive on a tape drive that has write permissions only for root, you would use
    the following command.


    ```

    sudo find / -print | sudo cpio -o >/dev/rmt

    ```


    You can combine remote execution with sudo to execute commands on remote systems
    that support sudo. For example, if you wish to print all the failed login attempts
    of a remote system on a local printer, you would use the following command.


    ```

    remsh remotehost sudo who </etc/btmp | lp

    ```


    The lp command does not have to be invoked with sudo since the output from the
    who command is available across the pipe without privileges.


    # Enhancements


    It would be convenient to have the ability to enable a group of users for a list
    of commands. You could accomplish this by adding a group command to the command
    file, followed by a list of the users who are members of the group.


    I have also had requests to add a node name to the log file for systems that share
    file systems. With the current configurations, it is impossible to tell on which
    node the sudo command was executed. The only change required would be a simple
    change to the logging routine, but I contend that if the nodes share a file system,
    then a security problem on one is a security problem on all.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Conclusion


    Some vendors are starting to address the issue of granularity of control in UNIX,
    but currently their efforts are very limited and vendor-specific. Until standards
    for subdividing and assigning privileges are more widespread, sudo, which is easily
    portable, can be a useful tool if appropriate security precautions are taken.
    It allows system administrators to delegate tasks while maintaining system security
    across UNIX systems from many vendors.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Restricting Machine Access with the rma “Shell”


    Greg A. Wade


    Many sites restrict machine access by account holders in an NIS domain. These
    access policies are motivated by a wide range of concerns, some political and
    others technical, with the goal of protecting the CPU resources of one workgroup
    from use by others in the organization. Administrators may also wish to restrict
    unauthorized users from logging into systems that perform critical roles in the
    networked environment. Typically, these types of access restrictions are implemented
    by using netgroups.


    # Using NIS Netgroups to Restrict Access


    Netgroups can be used essentially to make only portions of the NIS password map
    visible to the client. On the NIS server, netgroups containing user lists are
    added to the /etc/netgroup file, and the NIS netgroup map is populated with this
    information. No additional configuration or modification of the server machine
    is required. Figure 6.1 shows a segment of a netgroup file specifying two netgroups
    — staff with members tim and jill, and sales with brad, randy, and mark.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The password files of the client machines are then modified. These files will
    typically contain +::+::0:0::: as the final entry. A UID of + indicates that the
    entire NIS passwd map should be appended to the local passwd file. The disabled
    password for the user + is used to maintain security on some older systems, and
    the user and group IDs of 0 are included so the line has the format of a valid
    entry. The entire NIS map does not need to be included, so the +::+::0:0::: entry
    is removed and replaced with entries of the form +@netgroup, where netgroup is
    the name of a netgroup containing user accounts with access to the machine. Figure
    6.2 shows a portion of a passwd file from an NIS client that only allows logins
    from NIS users in the sales netgroup.


    Similarly, you can exclude netgroups of users from the password file by retaining
    the +::+::0:0::: and including -@netgroup entries. Figure 6.3 shows a segment
    from a passwd file allowing logins from all NIS users except those in the staff
    netgroup.


    # Figure 6.1 A segment of a netgroup file specifying groups and members.


    ```

    staff:(tim,)(jill,)

    sales:(brad,)(randy,)(mark,)

    ```


    # Figure 6.2 A segment of a passwd file allowing logins for only the sales netgroup.


    ```

    root:x:0:1:Super-User:/:/sbin/sh

    daemon:x:1:1:::/

    ...

    +@sales

    ```


    # Figure 6.3 A segment of a passwd file allowing logins for all users except the
    staff netgroup.


    ```

    root:x:0:1:Super-User:/:/sbin/sh

    daemon:x:1:1:::/

    ...

    -@staff

    +::+::0:0:::

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'When excluding netgroups from the passwd file, the @netgroup entries must precede
    the +::*:0:0::: entry. The routines for reading the passwd file stop their search
    of the file as soon as a match is found. As a result, @netgroup entries placed
    after the +::*:0:0::: would never be processed.


    One additional step is required on clients running Solaris v2.x. You must enable
    the +/- syntax for policy control in the password file by modifying the passwd
    line in /etc/nsswitch.conf. If the client is accessing an NIS server, the line
    passwd: compat should be placed in the file. Clients accessing NIS+ servers should
    contain the lines passwd: compat and passwd_compat: nisplus.


    # The Advantage of Using rma


    Although netgroups are effective at prohibiting unauthorized users from logging
    into workstations, they are not appropriate for restricting logins to many types
    of servers. NIS servers, HTTP servers serving user’s WWW pages, mail hubs performing
    local delivery, and print servers performing per user accounting are all examples
    of servers that must be aware of all the users in the domain (i.e., they must
    have access to a complete password file). To overcome this limitation of NIS netgroups,
    the rma (restricted machine access) shell wrapper was created.


    ```

    Listing 6.1 rma.c can restrict access to workstations and servers.


    /* rma.c -- Restricted Machine Access */

    /* Greg A. Wade */


    /* Configuration section */

    #define SHELL_DIR "/usr/bin/shells/"

    #define ACCESS_LIST "/etc/access.lst"

    #define MAIL_TO "wade"

    #define LOGIN_SCRIPT "/etc/enter.sh"

    #define LOGOUT_SCRIPT "/etc/exit.sh"


    #include <stdio.h>

    #include <strings.h>

    #include <sys/types.h>

    #include <unistd.h>

    #include <grp.h>

    #include <stdlib.h>

    #include <sys/param.h>

    #include <signal.h>


    #ifdef SVR4

    #include <netdb.h>

    #include <fcntl.h>

    #else

    #include <sys/file.h>

    #endif

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: "The original version of rma was created to restrict 25 undergraduate students\
    \ at Southern Illinois University at Carbondale to the use of six Sun workstations\
    \ located in a small lab operated by the Department of Computer Science. During\
    \ the past four years, rma has evolved and is now used to restrict undergraduate\
    \ students from using computing\n\n# Listing 6.1 (continued)\n\n```\n/* Returns\
    \ 1 if the user is allowed to login, otherwise 0 is returned */\nint CanLogin\
    \ gid_t gid, char *host)\n{\n    FILE *access_file;\n    struct group *gr = NULL;\n\
    \    char *p = NULL;\n    int result = 1;\n\n    if (access_file = (FILE *)fopen(ACCESS_LIST,\
    \ \"r\"))!=NULL) {\n        /* Lookup the group in ACCESS_LIST */\n        while((gr\
    \ = (struct group *)fgetgrent(access_file))!=NULL)\n            if ((gr->gr_gid\
    \ == gid)\n                break;\n        fclose(access_file);\n        if (gr==NULL)\n\
    \            /* Our gid is not in ACCESS_LIST..deny access */\n            result=0;\n\
    \        else {\n            /* search for the current machine name */\n     \
    \       result = \"*(gr->gr_passwd)==\"* ? 0 : 1;\n            p = gr->gr_mem;\n\
    \            while (p!=NULL)\n                if(strcmp(p,host) )\n          \
    \          result = (! result);\n                    break;\n                }\n\
    \                p++;\n            }\n        }\n    }\n    return(result);\n\
    }\n\n/* Execute the script specified by LOGIN_SCRIPT */\nvoid loginScript(void)\n\
    {\n    int status;\n    if(fork() == 0) {\n        execv(LOGIN_SCRIPT,rindex(LOGIN_SCRIPT,'/'),NULL);\n\
    \        exit(1);\n    } else\n        wait(&status);\n}\n```"
