- pgno: 40
  md: '# Summary


    Every UNIX system administrator must set up and keep track of many simple security
    measures. Simple scripts can automate these tasks. Eliminating root access requirements
    allows non-administrative users to monitor their portions of the system. Distributing
    the monitoring of simple security operations lets the administrator pay attention
    to the complex jobs.


    # Listing 2.4 (continued)


    ```

    #

    # Collect the 1st 2 fields of the password file & parse the aging info

    #

    show_aging ()

    {

    INFO=`

    cut -f1-2 -d: $PW_FILE |  # Extract name & passwd fields

    egrep -v ''\*:''          # Ignore disabled accounts


    for n in $INFO

    do

    #

    echo "`echo $n | cut -d: -f1`\t`c"


    oldFS="$IFS"

    IFS=":"

    # Use field sep to parse aging

    set $n

    # $2 has the aging field value

    IFS="$oldFS"


    if [ -z "$2" ]

    then

    #

    echo aging inactive!

    NOAGING="$NOAGING `echo $n | cut -d: -f1`"

    else

    echo "`echo $n | cut -d: -f1`\t`c"

    aging_val $2

    fi

    done


    if [ -n "$NOAGING" ]

    then

    echo "\nAging inactive ($PWFILE order):"

    echo $NOAGING | tr '' '' ''\012'' | pr -t -6

    fi

    }

    ```'
  merge: -1
  img_proc: true
