- pgno: 204
  md: "Adding a host to this file is done by adding a number of configuration lines\
    \ describing the characteristics of this host. Most of these characteristics are\
    \ equal among the different hosts, the sole difference being the name of the UUCP\
    \ machine. To add a host, simply fill out a template file that is concatenated\
    \ to the existing sys file. The %% tokens in this template will be replaced by\
    \ the actual name of the UUCP machine. To be able to delete a host later, the\
    \ part added will be delimited by special comment lines that determine the beginning\
    \ and end of a host section. The template is shown in Listing 16.2. As you can\
    \ see, a number of %% tokens are present, and the beginning and ending of this\
    \ host section are marked with START and END.\n\n# Listing 16.1 (continued)\n\n\
    ```\n# Add host to news config for UUCP\nsub adducpmanews\n{\n    # First the\
    \ batch params\n    $addbatch( );\n    # Secondly the mail setup\n    $addmail(\
    \ );\n    # Lastly the sys file\n    $addnews( );\n}\n# adducpmanews\n\n# Backup\
    \ a file\nsub backupfile\n{\n    local( $file ) = @_;\n    local( $backup );\n\
    \n    # Back up older versions\n    $backup = \"$file\".\"~ooo\";\n    unlink\
    \ $backup if( -e $backup );\n    $backup = \"$file\".\"~oo\";\n    rename $backup,\
    \ \"$backup\".\"~o\" if( -e $backup );\n    $backup = \"$file\".\"~o\";\n    rename\
    \ $backup, \"$backup\".\"~o\" if( -e $backup );\n    rename $file, $backup;\n\
    }\n# backupfile\n\n# Set permissions on new file as they were on the old one\n\
    sub setperm\n{\n    local( $new, $old );\n\n    ($dummy, $dummy, $mode, $dummy,\
    \ $uid, $gid, $dummy) = stat $old;\n    chown $uid, $gid, $new;\n    chmod $mode,\
    \ $new;\n}\n# setperm\n```"
  merge: -1
  img_proc: true
