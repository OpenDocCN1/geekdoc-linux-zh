- pgno: 124
  md: 'A dual-homed gateway is not vandal-proof. An attacker who successfully obtains
    access to the dual-homed gateway has what amounts to local network access on your
    private network. At this point, all of the standard security holes become available.
    Misconfigurations or improper permissions on NFS-mounted filesystems, .rhosts
    files, automatic software distribution systems like rdist, network backup programs,
    and other administrative shell scripts become tools to help the attacker gain
    a presence on your gateway. Once that presence is established, it will only be
    a matter of time before all of the systems in your network are compromised.


    With a dual-homed gateway, if the firewall is destroyed, the attacker may be able
    to alter the routing and expose the entire network. Since most UNIX-based dual-homed
    gateways disable TCP/IP forwarding by modifying the kernel parameter IPFORWARDING,
    the attacker might want simply to defeat the gateway and change this parameter.
    If root privileges on the gateway can be obtained, then this is most certainly
    the first choice of attack. Once the new kernel is linked, the intruder can force
    a reboot during the night and gain access to your network without having to access
    the gateway first.


    # The Screened Host Gateway


    The screened host gateway is similar to the dual-homed gateway, but is considered
    very secure while remaining relatively easy to implement. While the dual-homed
    gateway consists of a single machine, the screened host gateway (Figure 11.7)
    is more


    Figure 11.7 The screened host gateway is similar to the dual-homed gateway, but
    is more complicated to establish and requires additional equipment.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 126
  md: 'This strategy involves the use of application-level gateways or the use of
    servers on the screened subnet. For example, if the organization wants to support
    other services for customers or the general Internet population — such as anonymous
    ftp, gopher, or World Wide Web — then one or more machines can be added to the
    screened subnet for this purpose (Figure 11.9).


    To invade a screened subnet with the intent of breaking into the bastion host,
    an attacker would have to reconfigure the routing on three networks: the Internet,
    the screened subnet, and the private network. All this would have to be done without
    setting off any alarms, and without disconnecting from or being locked out of
    the network. If the screened routers have been configured to accept no network
    connections or to accept them only from specific hosts, the attacker would be
    forced to invade the bastion host, break into a machine on the private network,
    and then go through the screening router.


    There are other advantages to the screened subnet. If an organization didn’t apply
    for a registered IP address but chose its own, either for simplicity’s sake or
    because of the need for a private TCP/IP network, the screened subnet becomes
    the easiest way to access the Internet. Because the private network is entirely
    invisible to the Internet, it is easy for the system administrator to slowly re-address
    the IP addresses of the internal machines.


    # Figure 11.8 A sample screened subnet that includes a bastion host configured
    to support either interactive terminal sessions or application-level gateways.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# The Application-Level or Proxy Gateway


    A lot of software in the networking community relies upon a store-and-forward
    approach (e.g., UUCP, electronic mail, and USENET news). The application collects
    the information, examines it, and then forwards it to the remote destination.
    Application-level gateways are service-specific forwarders or reflectors that
    operate at a user level, rather than a protocol level. When these services are
    running on a firewall, they become an essential element in the security of the
    entire private network.


    The theory behind the application-level or proxy gateway is to restrict user interaction
    to a machine that does not itself provide the service the user is accessing. The
    proxy host provides additional authentication of the user, and keeps an audit
    trail to improve logging and allow the network administrator to see what the users
    of the various services are doing. The external user never sees the internal network,
    and therefore has no means of attacking it.


    The advantage of this approach, in combination with any of the others, is that
    for each type of service you want to allow, you must add a gateway. For example,
    if you wanted to allow telnet services, then you would need to install a telnet
    proxy gateway; and similarly for ftp, and so on. In this situation, if the proxy
    service does not exist, then the application will not be permitted and access
    to the appropriate service will be denied.


    # Figure 11.9 A sample screened subnet with machines added to support gopher,
    ftp, and World Wide Web services.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The disadvantage is that the development of these proxy gateway services is
    not trivial, and can be a serious stalling point. However, many of the software
    vendors who offer firewalls can provide application-level and proxy gateway services.


    # The Hybrid Gateway


    The hybrid gateway falls into a category other than those already mentioned. An
    example would be a serial connection to the Internet with a terminal server on
    the private network side. The more difficult the access to the internal network,
    the less likely that an attacker will spend the time necessary to break in. The
    hybrid gateway allows for the introduction of some rather esoteric ideas, such
    as tunneling one protocol over another, or using custom-designed software to monitor
    and examine the connections that are in place. An example is a site where the
    firewall consists of a hybrid gateway combined with a bastion host.


    Hybrid gateways come in different shapes and sizes, and tend to be somewhat specific
    to the organization; thus, it isn''t possible to describe exactly what such a
    gateway would look like. The obvious advantage to a hybrid gateway is that, if
    the security approach is nonstandard, then it becomes harder for an attacker to
    figure it out and more likely that the attacker will be discovered.


    The trade-off here is security through obscurity versus the benefits of a well-documented
    and thoroughly understood security configuration. The more esoteric the scheme,
    the more difficult it becomes for the administrator to remember how it works and
    how the pieces fit together. The danger increases when the administrator is replaced
    by someone who was not involved in the process of designing the obscure gateway.
    It may ultimately be better to take a security approach that is easy to understand,
    document, and control.


    Since hybrids are by definition eclectic, it isn''t possible to generalize about
    their vulnerability to attack or about the risk involved in running this type
    of firewall. One obvious requirement is that the organization have the internal
    resources to design, build, and maintain the system without having to rely upon
    outside resources. It seems likely that with the continued expansion of the Internet,
    methods for developing hybrid gateways will become better known and will allow
    more security options for the administrator.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Firewall Tools


    Vast collections of tools and numerous vendors offer software and security products
    and services. Even though firewalls are relatively new, they are fast becoming
    a major part of the network security business. I recommend that you examine publicly
    available code very carefully before trusting it to protect your network. This
    caution is not meant to imply that the code itself may be questionable, but to
    ensure that what you think you are getting is actually what you want. The sidebar,
    “Publicly Available Tools,” lists a number of popular tools and explains how to
    get them.


    # Conclusion


    If you are considering whether or not to use a firewall, be sure to answer the
    following questions.


    +   - From whom are we protecting ourselves?

    +   - What are we trying to protect?

    +   - How valuable is the information we are trying to protect?

    +   - How important is Internet access to our users?

    +   - How important is access to our network from the Internet?


    Once you have addressed these questions, the issue becomes a matter of selecting
    the firewall method that best meets the needs of your organization, its users,
    and clients.


    # Reference


    Hare, Chris and Karanjit Siyan. Internet Firewalls and Network Security, 2nd ed.
    Indianapolis: New Riders Publishing. 1996.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Publicly Available Tools


    The number of publicly available tools is large, and the network administrator
    who is prepared to spend time investigating each of them is wise. Listed here
    are some of the more popular tools.


    As is always the case with publicly available software, the authors of the software
    make no claims as to its usefulness (nor do I). As the system administrator, you
    are responsible for verifying the usefulness and risks associated with the software
    you choose for your system.


    # tcpwrapper


    This is probably one of the best-known tools for adding logging and filtering
    to most standard services. The tcpwrapper program supports only services that
    are invoked through inetd, while portmapper is used for RPC services that are
    invoked through the standard portmapper. The tool was written by a consultant
    at Eindhoven University in The Netherlands to help determine the source of some
    cracking activity directed at the University. The collection of programs that
    make up the TCPwrapper kit can be found by anonymous ftp on FTP.MIN.TUE.NL in
    the /pub/security directory.


    With this package you can monitor and filter incoming requests for the SYSTAT,
    FINGER, FTP, TELNET, RLOGIN, RSH, EXEC, TFTP, TALK, and other network services.
    It supports both 4.3 BSD-style sockets and System V-4-style TLI.


    The package provides tiny daemon wrapper programs that can be installed without
    any changes to existing software or to existing configuration files. The wrappers
    report the name of the remote host and of the requested service. The wrappers
    do not exchange information with the remote client process, and impose no overhead
    on the actual communication between the client and server applications.


    Optional features are: access control, to restrict the systems that can connect
    to your network daemons; remote user name lookups, with the RFC 931 protocol;
    additional protection against a host pretending to have someone else''s host name;
    additional protection against a host pretending to have someone else''s host address.


    Early versions of the programs were tested with Ultrix = 2.2, SunOS = 3.4, and
    ISC 2.2. Later versions have been installed on a wide variety of platforms, including
    SunOS 4.x and 5.x, Ultrix 3.x and 4.x, DEC OSF/1 T1.2-2, HP-UX 8.x, AIX 3.1.5
    up to 3.2., Apollo SR10.3.5, Sony, NeXT, SCO UNIX, DG/UX, Cray, Dynix, and an
    unknown number of others.


    Requirements are that the network daemons be spawned by a super-server such as
    the inetd; either a 4.3 BSD-style socket programming interface, or System V-4-style
    TLI programming interface; or both; and the availability of a syslog(3) library
    and of a syslogd(8) daemon. The wrappers should run without modification on any
    system that satisfies these requirements. Workarounds have been implemented for
    several common bugs in systems software.


    # The swatch Logfile Monitor


    swatch is a tool (written in perl) that lets you associate actions with logfile
    entries. When logfile entries are found, the administrator can arrange for a command,
    such as mail, finger, etc., to be executed. For example, swatch can be used to
    read through the contents of the system syslog file to filter and report only
    on information that is of interest. Figure 11.10 shows a sample configuration
    file to restrict information from a syslog file.'
  merge: -1
  img_proc: true
- pgno: 131
