- pgno: 46
  md: '# Timing Out Idle Users


    Larry Reznick


    All users should logout when they leave their workstations for an extended period
    of time or when they leave at the end of the day. A workstation with a user logged
    in but not present is an invitation to a security breach. System administrators
    don’t have the time to watch what everybody is doing and finger-wag when users
    forget to logout. Besides, after a certain amount of finger-wagging, the system
    administrator loses credibility with the users.


    The system knows how active the user’s terminal is because the system has to keep
    up with all of that activity. You could make the system monitor the users’ activities
    and, if one of the terminals is idle for longer than a specific time, force the
    user to logout. SCO UNIX has a special program for this, named ... SVR4 has no
    such program, but a simple shell script can do the same work.'
