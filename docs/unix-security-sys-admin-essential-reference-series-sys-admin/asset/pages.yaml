- pgno: 176
  md: 'Amazingly enough, everything worked the first time! Well, okay, everything
    worked the second time, once we realized that we had forgotten to add the gateway
    machine to our DNS (Domain Name Services) database. Once the DNS was rebuilt,
    test mail sent from a workstation on our LAN to my buddy Jim at chat.smtp:(jreich@decbert.ece.cmu.edu)
    actually got there!


    But our amazement was short-lived. That method of writing e-mail addresses gets
    old very quickly. And we could just imagine fielding the support calls from the
    various users of WordPerfect Office: “How many parentheses? Do the quotes go on
    the outside or on the inside? Which comes first, chat or smtp? What’s this smtp
    thingy anyway? I thought we had Internet mail!”


    # Refinement


    Fortunately, WPO is easily configurable and supports “simplified passthrough addressing.”
    Using the ad.exe program, we created a new domain, with a TYPE of “Foreign,” and
    a DOMAIN NAME of “Internet.” Then we edited our primary domain, Chat, to link
    it to our new SMTP gateway.


    We selected “Message Server Configuration,” then “Network Links.” At the Domain
    Connections dialog box, we selected the new domain that we had made, “Internet,”
    and chose “Edit Link.” At the “How” dialog, we chose “Gateway,” then “SMTP.” At
    first, I made the mistake of assuming that this would propagate throughout the
    subdomains. Not so. You must do this for all of your subdomains.


    After reconfiguring, I could send mail to Jim with the address Internet:jreich@decbert.ece.cmu.edu


    Once the process of outgoing mail was sound and simple to use, we examined the
    refinement of incoming mail. Mail from the outside to user@wpo.co.chatham.ga.us
    would work just fine unless the user had special characters in his or her name.
    Unfortunately for us, most of our users do in fact have what the SMTP gateway
    considers to be “special characters” (i.e., underscores). For example, our WPO
    administrator initially set my username as “J_FELDMAN. This means that external
    users have to send mail to J##J#FELDMAN@wpo.co.chatham.ga.us. The WPO gateway
    treats number signs (#) similarly. A few frustrating phone calls with vendors,
    trying to spell out our user names, convinced us that this method was not going
    to work.


    Fortunately, WPO also supports “Native SMTP Gateway Aliases.” From the ad.exe
    program, we selected the domain to which the user belonged, hit “Enter” on the
    user’s name to edit that user, and clicked on “Gateway Aliases” in the “Edit User”
    dialog box. From the “Gateway” dialog box, we created a new alias with TYPE “SMTP”.
    We entered the user’s external alias at the “Native Gateway Address.” For example,
    I chose the domain CHAT, the user J_FELDMAN, and entered “jonathan” for the Native
    Gateway Address'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'You can also define aliases to the SMTP Gateway, which allows you to define
    system-wide aliases for external addresses. For example, we include aliases for
    the city of Savannah. Simply edit the SMTP gateway object in the ad.exe program,
    and create a user. Name this "pseudo-user" whatever you want the system-wide alias
    to be. You can add other fields, such as phone number or job title, that users
    of the WPO system can view.


    # Figure 14.3 A modified user''s login script that calls smtpbat at bootup.


    ```

    NETWARE LOGIN SCRIPT:

    map root H:=drv2:smtp

    map j:=drv2:wpdomain/wpgate/smtp40

    drive h:

    exit "smtp.bat"


    SMTP.BAT:

    @echo off

    REM reject broadcast messages that hang me up!

    cast off all

    REM don''t even try CloseUP for remote manglement;

    REM it doesn''t work with the gateway.

    REM nostt

    cd odi

    REM Do TCP/IP for Internet ONLY.

    call lanwp

    cd ..

    j:

    REM Start the WPO mail daemon, then the gateway program.

    cd \wpdomain\wpgate\smtp40

    smtpdn.exe /hn-wpo.co.chatham.ga.us /gw-J:\wpdomain\wpgate\smtp40

    smtp /gw-J:\wpdomain\wpgate\smtp40


    LANWP.BAT

    rem batch file to load TCPIP ODI drivers

    lsl

    osh39xr

    tcpip

    set NAME=wpo

    ```'
