- pgno: 151
  md: 'The Linux kernel used in this firewall, v1.3.68, is relatively new. It will
    have to prove itself in the long run, but it looks promising.


    The hardest part of building a good firewall lies in building good packet rules.
    Careful analysis is important to building good rules, but the ultimate proof is
    thorough testing. Test these rules, test them again, and then test them some more.


    One good test strategy is to probe your firewall using SATAN running on some Internet
    host. I cannot stress this enough — the heart of your security lies in the rules
    you specify for your firewall. The rules given here work for me, but that doesn’t
    mean they’ll give you a secure installation. I would never presume that they are
    completely watertight. If you use these rules verbatim, be warned: you do so at
    your own risk.


    This caution isn’t meant to be intimidating; I simply want to make it clear to
    you that constructing comprehensive and effective rules is not a trivial task.


    # Listing 12.10 (continued)


