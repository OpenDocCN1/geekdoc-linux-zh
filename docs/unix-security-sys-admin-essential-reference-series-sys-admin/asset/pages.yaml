- pgno: 213
  md: 'In this line, %s is replaced by the name of the system already added. The UID
    and GID are a unique User ID number and the Group ID of the UUCP group. The function
    adduser in Listing 16.1 will take care of this. adduser will first read the /etc/group
    file to determine the GID of the UUCP group. If found, it will add the user uux%
    to the group file. It will open the /etc/passwd file and determine the first unused
    UID. It will then add the line to the file. The account is default disabled, as
    there is an * in the password field, and the network or system operator should
    give this account a secret password for security reasons. When these two functions
    are completed successfully, the remote system is able to dial in. However, it
    still needs to be fed data (i.e., mail and news). The next thing to do is tell
    the news and mail software that they can batch outgoing data for this new system.


    # Adding Hosts to the news Configuration


    For CNews, the configuration is stored in a number of files in the home directory
    of the news user. This also applies to INN, but the files and formats are different.
    The main configuration file for CNews is sys. This file contains the names and
    setting for systems exchanging news, and defines which newsgroups are exchanged
    with a system. Listing 16.3 contains an example of this sys file.


    # Listing 16.2 A UUCP template file is filled out and concatenated to the existing
    sys file to add a host to the UUCP network setup.


    ```

    #START %s

    system %s

    time Never

    baud 38400

    port Direct

    phone **

    called-login uux%s

    send-request yes

    receive-request yes

    called-transfer yes

    remote-send /usr/spool/uucppublic /usr/spool/news

    local-receive /

    remote-receive /usr/spool/uucppublic /usr/spool/news

    commands /bin/mail /usr/local/lib/news/bin/rnews

    myname ra

    #END %s

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'To add a host to this file, simply add a line describing the newsgroups for
    this system. While this line is added, the %S tokens are replaced with the actual
    name of the system. In Listing 16.1, this action is done in the function addnews.
    This function is also called when a host needs to be added to the LAN configuration.


    To ensure the system will batch outgoing news through UUCP, the system needs to
    be added to another configuration file, batchparms. This file describes the parameters
    with which the batches are created (Listing 16.4).


    # Listing 16.3 An example CNews sys.file.


    ```

    # Only the ME line is mandatory: the others are just samples of how to do

    # things. Virtually everything will need modifying for your local feeds

    # and newsgroups.

    # line indicating what we are willing to receive: note local groups near end

    # ME:comp,news,sci,rec,misc,soc,tak,can,ont,tor,ut, to

    ME:vpro,comp,news,misc,eunet,nl,ninet,nl,hacktic,general,reseau

    # My primary newsfeed

    sun4nl:news,misc,comp,eunet,nl,ninet,to,sun4nl/all,general,reseau:ft

    # My remote site

    #scarab:news,misc,comp,eunet,nacktic,nl,ninet,reseau,to,scarab/all,general

    ::scarab/logo

    # The ones I feed

    ```


    # Listing 16.4 An example CNews batchparms.file.


    ```

    # 100KB, after compress, is 10 minutes at 1200 baud

    # 20 batches is somewhat arbitrary, about 1MB per site

    # defaults: 2.11-compatible compression, transfer by uux

    #

    # site          class  <size  queue  command

    # /default/     u      100000 20     batcher | compcun | viaux

    #

    # My primary feed

    sun4nl         u      100000 20     batcher | compcun | viaux

    #

    # My secondary feed

    #utopia        u      100000 20     batcher | compcun | viaux

    #

    # My remote site

    #scarab        u      1000000 50     batcher | compcun | viaux

    #

    # I feed these

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'batchparms tells the maximum size of one batch file, whether it should be compressed,
    and how the batches are sent to the remote system. In this case the viaaux setting
    makes the batches go out via UUCP. Systems are added by appending a line describing
    the system name and a default setting for the batch parameters. This is done in
    function addnewsuucp in Listing 16.1.


    # Adding Hosts to the mail Configuration


    Adding a host to UUCP for mail is also simple. The sendmail.cf I use assumes that
    the names of all UUCP hosts are contained in a file called /etc/mail/sendmail.uunames
    and that when a UUCP host is added, its name is appended to this file. This change
    is automatically reflected when sendmail is started to send mail to a host. All
    of these actions are done by the function addmailuucp in Listing 16.1.


    The sendmail documentation describes how to adapt your sendmail.cf file to read
    the names of UUCP hosts from a file. Previous implementations of the sendmail
    program called the uunames program directly and read the output. In v8, this has
    been abandoned due to security reasons. Once all actions have completed successfully,
    a mail is sent to root, informing it of a successful addition.


    # Removing Hosts


    When a host needs to be removed, the inverse of the actions described above are
    performed. Furthermore, these actions are performed in the reverse order. There
    is one catch, however. When a UUCP host is about to be removed, the system might
    still have a number of batches waiting to be transmitted. These batches need to
    be sent before the host can be deleted from the UUCP configuration, or else some
    mail could be lost.


    So, removing a host from the UUCP configuration is a two-stage process. First
    of all, the host is removed from both the mail and news configuration to prevent
    new batches from being created. This is done by the deluucpmainews function in
    Listing 16.1. For mail, its associated lines from the sys and batchparms files
    are removed. Once this has been done, the system must wait until the pending batches
    have been sent, or until the maximum waiting time has expired. If the batches
    are still pending after 24 hours, they are removed. If there are no pending batches,
    the function deluucp is called, and the host is removed from the UUCP sys file.
    If there are pending batches, the name of the system is stored in a file called
    /etc/pending.uucp. This file is scanned each time the job is started by cron.
    If the job detects that all batches have been sent, it deletes the host. If after
    24 hours the batches are still pending, they are removed from the queue, and the
    host is removed from the UUCP configuration, including the /etc/passwd and /etc/group
    file. Once the host is completely removed, mail is sent to root informing it of
    the successful deletion.'
  merge: -1
  img_proc: true
- pgno: 216
  md: "# The LAN Connection\n\nIn a networking environment, it is common for hosts\
    \ to be connected and disconnected from the LAN. Adding a host to a UUCP setup\
    \ can be relatively complicated. It involves editing a number of unrelated config\
    \ files that are scattered around the filesystem.\n\nManaging the LAN configuration\
    \ is a better structured process. Only a limited number of related config files\
    \ needs to be edited, with only one exception. The program used to perform these\
    \ functions is shown in Listing 16.1. It is the same program used for the UUCP\
    \ connection. When the program is started, it will determine its own name. Depending\
    \ on this name, the program will either go for the UUCP configuration or the LAN\
    \ configuration.\n\n# Adding Hosts to the named\n\nAdding hosts to the LAN configuration\
    \ involves a number of simple steps. The host must be assigned an IP address,\
    \ but fortunately that address is already included in the mainsite.lan file. First,\
    \ you need to add this IP address to the named configuration files. This is the\
    \ daemon that will resolve all IP address translation queries. These configuration\
    \ files are stored in the directory specified in the /etc/named.boot file. This\
    \ file is read by the named when it is started, and contains pointers to other\
    \ configuration files. An example of this named.boot file is shown in Listing\
    \ 16.5.\n\n```\nListing 16.5 An example named.boot file.\n\n; boot file for name\
    \ server\n; type      domain                  source file or host\n\n directory\
    \ /etc/inet\n\n; cache\nprimary   reseau.nl               named.reseau\nprimary\
    \   56.34.193.in-addr.arpa  named.rev\nprimary   0.0.127.in-addr.arpa    named.local\n\
    \nforwarders 193.78.240.1           ; sun4n1\n\nslave\n```"
  merge: -1
  img_proc: true
- pgno: 217
  md: 'If a host is added to the network, it must also be added to the forward and
    reverse mapping files. The forward mapping (translating a name into an address)
    is done by the named.reseau file, and the reverse mapping (translating an address
    into a host-name) is done by the named.rev file. These two files are kept very
    simple. They include .data files that contain the lists of hosts and IP addresses.


    When a host is added, its information is added to one of these .data files. An
    example of the named.reseau.data is shown in Listing 16.6, and an example of named.rev.data
    is shown in Listing 16.7.


    So, you add a host simply by appending the information to both of these files.
    As shown in Listing 16.2, this is done by the function addnamed. After the information
    is added to the configuration, the named program must be notified of the change.
    This is done by sending it a HUP signal. After receiving this signal, the program
    will reread its configuration file and the new data will be available.


    One problem remains to be solved. The new system may not be directly accessible,
    but connected to the LAN via a router. The only thing this program can do is check
    the active routing tables in the kernel and test if the machine can be reached
    directly. If not, a mail message is sent to root, so he or she can adapt the routing
    information in the kernel.


    # Listing 16.6 An example named.reseau.data file.


    ```

    ; testnet

    78 IN PTR isis.reseau.nl.

    ;

    ```


    # Listing 16.7 An example named.rev.data file.


    ```

    ; testnet

    isis IN A 193.34.56.78

    ;

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'If you are using some sort of security software, you need to add the name and
    IP address of this new host to those config files, as well. An example is the
    tcp_wrappers package that is used by the inetd program to control which hosts
    may connect to the system. The configuration of tcp wrappers is stored in two
    files, /etc/hosts.allow and /etc/hosts.deny. These files control which hosts are
    allowed and denied access, respectively. These actions are performed by the function
    addsecurity in Listing 16.1. If you are using another package, you can change
    this function to suit your needs.


    # Adding Hosts to the news Configuration


    Apart from adding the host to the sys file as described in the UUCP configuration,
    you also need to add the name of the new host to another file, nntp_access. This
    file controls which hosts may access the news spool through NNTP (Listing 16.8).
    This action is performed by the function addnews lan in Listing 16.1.


    Next, the host is added to the basic network configuration and services. A mail
    is sent to root notifying it of this successful addition. If your network needs
    more adaptations, you can add functions to the program to perform them.


    # Adding Hosts to the mail Configuration


    There is no need to change the mail configuration when adding a host to the LAN.
    As sendmail is configured to use named, it will automatically detect when a new
    host is added to the configuration.


    # Listing 16.8 An example nntp_access file.


    ```

    #

    # Sample NNTP access file. "read" implies "xfer".

    # Note that "default" must be the first entry in the

    # table. Order is important. Put the most restrictive

    # entried just behind "default"

    #

    # by default, nothing is allowed

    default        no     no

    #

    # hosts on the localnet can read and post

    fsis.reaseau.nl  both   post   *

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Removing Hosts


    Removing hosts is just as simple as adding them. The actions described previously
    for adding hosts are reversed and executed in reverse order. I assume the host
    has already been physically disconnected from the network before removing it,
    so no more links are open to the host.


    First, the host is removed from the nntp_access file so it can no longer access
    the news spool. This is done by function delnews law in Listing 16.1. Then, the
    information is removed from the named configuration and the named program is notified
    by the HUP signal. When both of these tasks are completed successfully, root is
    notified of the successful deletion. Root must check the routing information by
    hand to make sure no excess routes are left lingering in the kernel.


    # Conclusion


    The program presented in this chapter is experimental and is not suited for use
    in a production environment. You will need to tune it and add more error handling
    to deal with user and system errors. This program does show you the techniques
    involved and how to apply them in your own programs. Combining all of these simple
    steps into one program can save a lot of manual work and creeping errors.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Creating Secure CGI Environment


    # David Endler


    Current design trends for enhanced Web pages often require data from the Web server
    to be manipulated in conjunction with input from the user. To do this, Web authors
    can choose from a plethora of page enhancement tools, including Common Gateway
    Interface (CGI), Java, ActiveX, and Javascript. Although Java, Javascript, and
    ActiveX may be the latest and greatest, CGI programming is still the most convenient
    way to manipulate data on the Web server itself. Thus, CGI programming remains
    the popular way to handle simple user input concepts. An unfortunate side effect
    is that CGI opens various security risks on a UNIX Web server.


    The mere phrase "server side execution" should be enough to make any cautious
    system administrator cringe. Security concerns become especially important if
    other crucial services such as mail, domain name service, user disk storage, or
    a company database also reside on the server. Although completely removing CGI
    capabilities from the Web server might appear to be an option, design objectives
    make this unrealistic. To secure your Web site, you must first establish a secure
    foundation CGI environment. Next, you must find and repair security gaps in CGI
    scripts that are added over time. In this chapter, I highlight some common Perl
    CGI scripting errors and provide tips on how to avoid the associated security
    problems.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Where to Start


    The first step toward a secure foundation CGI environment is establishing a policy
    regarding ownership of Web server processes. Many CGI-related security problems
    capitalize on the rights of the User ID (UID) and Group ID (GID) of the Web server
    process. Thus, Web server processes should never be run as root. Running the Web
    server with the nobody-nogroup combination is reasonable in that it gives the
    CGI programs minimal privileges. A better alternative is to run Web server processes
    as a specified UID and GID, such as www. This prevents the Web server from meddling
    with other services and programs that run as nobody. Look in httpd.conf on Apache
    and NCSA to configure the UID and GID.


    Most Web servers offer several options regarding the setup of your CGI directory
    structure. You can allow CGI scripts with the extension .cgi or .pl, for example,
    to be located anywhere below the Web server root. This is a menacing setup, however,
    as it makes monitoring and maintaining the scripts very difficult. For extra security,
    it is recommended to allow the server to see only file systems under its "Server
    Root" — read about chroot for more details in the NCSA docs.


    On most large Web servers, CGI scripts will be written by different people with
    various skill levels. It is not uncommon even for experienced UNIX programmers
    to fall prey to a security hole specifically open to a Hypertext Text Transfer
    Protocol (HTTP) attack. To ease administration and minimize potential security
    risks, you should define only one active CGI executable directory (named cgi-bin
    on most UNIX Web servers) and grant write access only to the most competent and
    conscientious of CGI programmers. Even with such restricted access, you must be
    vigilant in identifying vulnerabilities in your scripts. Creating a separate,
    nonpublic CGI development partition may also be helpful in minimizing security
    problems.


    The execution environment for CGI also provides various other configurable options.
    Be very selective in defining the options for your CGI directory. For example,
    with NSCA httpd and Apache Web servers, it is a good idea to disable Server Side
    Includes, or SSIs (see the sidebar "Server Side Includes"). You should not give
    random users viewing access to the contents of your CGI directory with the Indexing
    option enabled in the global access file, access.conf. The more system information
    you can keep private, the less likely an intruder will be able to exploit obvious
    or even subtle vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Server Side Includes


    Server Side Includes (SSIs) are embedded in your HTML document and can execute
    or manipulate environment variables and file statistics. A typical SSI is in the
    form of <!-- include_command -->. If an HTML document contains SSIs, it will usually
    end in .shtml.


    The following is an example, called test.shtml


    ```

    <HTML><body>

    <H1>My page was last modified on </H1>

    <!--#echo var="LAST_MODIFIED" -->

    </body></html>

    ```


    In addition to echo, the commands are config, include, fsize, flastmod, and exec.
    The exec option makes SSIs very dangerous. exec executes a given command as the
    UID of the Web server. Imagine, for example, a typical guestbook that allows people
    to enter commands in their message. For example, if someone entered


    ```

    <!--#exec cmd="/bin/rm -rf /*" -->

    ```


    you would have a big headache the next time someone browsed through the messages!
    As another example, the entry


    ```

    <!--#exec cmd="find / -name foo -print" -->

    ```


    would perform a systemwide search for the files named foo. If someone pasted this
    a few hundred times in their html document, the server would come to a screeching
    halt.


    A good rule of thumb is to disable SSIs on your Web server — you can almost always
    find ways to work around them, regardless of their convenience.


    To see whether SSIs are disabled on NCSA and Apache servers, look in the file
    access.conf for the following bit of code and make sure that "Includes" is not
    in the option list. The following is an example with the Web server document root,
    but you should also check all defined directories.


    ```

    # /home/www/docs being the document root

    <Directory /home/www/docs>

    # This may also be "None", "All", or any combination of

    # "Indexes", "Includes", "FollowSymLinks", "ExecCGI", or "MultiViews".

    Options Indexes FollowSymLinks

    </Directory>

    ```


    Also, check the srm.conf file for either of the following lines.


    ```

    AddType text/server-parsed .shtml

    AddType text/server-parsed-html .html

    ```


    If found, comment out these lines to prevent further use of SSIs.


    If you simply must have SSIs on your Web server, put "IncludesNOEXEC" in the option
    list to disable the exec command. This will eliminate many of the dangers, but
    there will still be the threat of severe system lag. For example, consider a prankster
    who pastes the following line a hundred times in a guestbook.


    ```

    <!-- #echo var = "LAST_MODIFIED" -->

    ```


    The server lag induced by hundreds of people viewing the page might just be enough
    to convince you to turn off SSIs completely.'
  merge: -1
  img_proc: true
