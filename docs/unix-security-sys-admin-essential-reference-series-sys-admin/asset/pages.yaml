- pgno: 103
  md: "minalpha Minimum number of alphabetic characters in a password.\n\nminother\
    \ Minimum number of nonalphabetic characters in password.\n\nmindiff Minimum number\
    \ of characters that must differ between the old and new passwords.\n\nmaxrepeats\
    \ Maximum number of times a character can occur in a password.\n\nminlen Minimum\
    \ length of passwords.\n\nmaxage Maximum number of weeks for a password to be\
    \ valid.\n\nmixage Minimum number of weeks before a password can be changed.\n\
    \n# Listing 9.1 checkpwd.c is a local program used to extend password verification.\n\
    \n```\n/*\n** Password extension function.\n**\n** Function must have the interface\n\
    **   char *user - User name for which invoked\n**   char *new - New password in\
    \ clear text\n**   char *old - Old password in clear text\n**   char **message\
    \ - Error Message, must be allocated from heap.\n**                 Caller will\
    \ call free().\n**\n** Compile with\n**   cc -e checkpwd -o checkpwd checkpwd\n\
    **\n** Return false when password contains userid, otherwise return true.\n*/\n\
    \n#include <string.h>\n\nint checkpwd(char *user, char *new, char *old, char **message)\n\
    {\n    char *error = \"Userid must not be part of password\\n\";\n\n    *message\
    \ = NULL;\n    if( strstr(new, user) != NULL )\n        return 0;\n    *message\
    \ = strdup(error);\n    return 1;\n}\n```"
