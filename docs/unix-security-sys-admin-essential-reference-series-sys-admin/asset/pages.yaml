    # Publicly Available Tools — continued


    # Firewall and Security Mailing Lists


    A number of mailing lists and forums are available on the topic of firewalls,
    and on security in general. Some are distributed via electronic mail, while others
    are part of the USENET News System.


    There are two major mailing lists for firewalls. One is hosted by greatcircle.com,
    and the other is hosted by tis.com. To subscribe to the Great Circle mailing list,
    send a message to majordomo@greatcircle.com, with the body of the message reading


    ```

    subscribe firewalls your-email-address

    ```


    You can subscribe to the tis.com firewall list, which focuses primarily on using
    the TIS firewall toolkit, by sending a message to fwall-user-request@tis.com,
    with the body of your message reading


    ```

    subscribe fwall-users your-email-address

    ```


    In both cases, the messages will start flowing to your mailbox within a day or
    two.


    There are other forums available for the discussion of security in general. These
    forums are typically part of the USENET News system, and include the news groups
    comp.security.announce, comp.security.misc, comp.security.unix, and alt.security.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Building a Firewall with Linux


    Arthur Donkers


    Getting access to the Internet is easy. A great many Internet service providers
    (ISPs) are available, almost always just a local call away. Getting safe access
    to the Internet is completely different. You want internal users to have convenient
    access to information on the Internet, but you don’t (usually) want outsiders
    to have any, let alone easy, access to your internal information. The best way
    to achieve this selective connectivity is to separate your internal network from
    the Internet with a firewall. (See the sidebar “What Is a Firewall?” for a brief
    description.)


    This chapter shows you how to install and configure a Linux-based firewall that
    connects to the Internet via a demand-dial PPP link.


    My firewall implementation uses a standard SMC Ethernet card for the firewall
    host. The connection to the Internet goes through a high-speed modem on a dial-up
    PPP link to our service provider. (Figure 12.1 — see the sidebar “Dedicated Lines”
    for an alternative Internet connection.)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Figure 12.1 A sample firewall implementation.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_135_0.png)


    # What Is a Firewall?


    A firewall is a dedicated system situated between your internal network (sometimes
    called an intranet) and the Internet. The firewall system scrutinizes all offered
    network traffic and throws away or refuses any packets that would violate the
    integrity and security of the internal network.


    The firewall is invisible to the users on the internal network. Internal workstations
    simply contact the firewall whenever they want access to the Internet. Users aren’t
    required to use special programs or contact special daemons running on the firewall.
    The firewall’s protective packet filtering is completely transparent.


    # Dedicated Lines


    My firewall connects to the Internet via a dial-up PPP connection. If your connection
    to the Internet runs via another interface, a 56k or ISDN packet connection for
    instance, you may use the following alternative. Use a dedicated router that connects
    to your Internet connection on one side, and a "normal" Ethernet on the other
    side. Then, equip your firewall with a second network card. Finally, connect your
    firewall, with a separate cable, to the router. The firewall will now transport
    packets between the two Ethernets. This Internet connection alternative is shown
    in Figure 12.1. Note that it is very important to use two physically separate
    network segments for this setup.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# The Big Picture


    The major steps in building a Linux-based firewall are:


    +   - load a base installation, probably from a CD-ROM;

    +   - reconfigure or upgrade the kernel to include firewall capabilities;

    +   - add PPP or SLIP support, if necessary;

    +   - add IP masquerading support; add ip_fw support; configure the firewall rules;

    +   - configure a name server; and

    +   - revise the startup configuration.


    # Obtaining Linux


    Linux has been, and still is, developed on the Internet. Therefore, the source
    is also available on the Internet. Two main ftp servers offering the Linux source
    are tsx-11.mit.edu:/pub/linux and sunsite.unc.edu:/pub/Linux.


    Downloading a Linux distribution and all the supporting packages can be tedious.
    I recommend buying one of the available CD-ROM distributions. A good CD-ROM distribution
    will greatly simplify the task of getting a complete working Linux system running.


    One of the most popular Linux distributions is Slackware. As of this writing,
    the most current release is Slackware v3.0. This release offers a complete setup
    for a standalone or networked Linux system. I used the Slackware release as a
    starting point for constructing my firewall. Although the Slackware release simplifies
    the installation process, you still should be prepared to do a lot of tweaking
    and twiddling. The standard distribution does not come close to being a secure
    firewall setup. The Slackware distribution is commonly "bundled" with Linux books.
    The Yggdrasil "Plug ''n Play" distribution is also available at many larger bookstores.


    If you decide to use a CD-ROM distribution, check that you have a Linux-supported
    CD-ROM drive. Although drivers are available for nearly every drive you can imagine,
    the precompiled kernels supplied with the distribution will usually support only
    the most common CD-ROM drives. You need to be able to mount the CD-ROM using one
    of these precompiled kernels if you are to conveniently install from the CD-ROM.
    If the precompiled kernels don''t support your CD-ROM, don''t panic. You may be
    able to copy the necessary software packages to a DOS partition on the same machine
    and install it from there.


    Also be warned that there is considerable lag between CD-ROM mastering and kernel
    development. It is unlikely that you will find the 1.3.68 kernel mentioned here
    on any of the current CD-ROM distributions. In fact, some of the current bundled
    CD-ROMs are still using a 1.0.x or 1.1.x kernel. You should check carefully before
    you buy. A 1.2.x or later kernel will be much easier to upgrade to function as
    a firewall.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'I recommend using a CD-ROM-based distribution for your initial installation.
    (See the sidebar “Obtaining Linux” for more details on Linux distributions. See
    the sidebar “A Freeware Firewall?” for the pros and cons of using a freeware product
    in the construction of a firewall.) These distributions usually include install
    scripts and instructions that greatly simplify the installation process. They
    also include all of the drivers and most of the other components you will need.
    Having all the necessary components in one place is a significant time saver.


    Typically, these distributions come with prebuilt kernels for common configurations.
    You boot with one of these kernels and then use that as a development environment
    to build a kernel specific to your machine’s configuration.


    Once you have a working, properly configured base kernel running, you should configure
    PPP, or whatever network interface you will be running, and download the source
    tree for a kernel with appropriate firewall support. At this point, you should
    also download any other packages you may need to upgrade. Specifically, you will
    need current versions of ipf, PPP, SLIP, and IP masquerading. (See the sidebar
    “IP Masquerading” for a description of this feature.)


    # A Freeware Firewall?


    Some gurus say you should not use a public domain or freeware product in a mission-critical
    role like a firewall. In most cases, I agree with them; however, Linux is an exception.
    First, the support via the Internet is not only better, it’s quicker, better,
    and more accurate than commercially funded support. If you invest some time, you
    will quickly become very good at supporting Linux yourself. Second, Linux supports
    a vast set of hardware peripherals, and new ones are added every day. Chances
    are very good that Linux will support the hardware you use for the firewall. Third,
    Linux has a very large audience. Estimates I’ve seen say there are more than 10
    million Linux users worldwide. With this many “software testers,” bugs are identified
    and corrected very quickly.


    Moreover, instead of waiting for a vendor to send you a patch, you can retrieve
    it via the Internet immediately. Linux also has very good network support. In
    the later version, 1.3.x, the networking code is both faster and more reliable.
    This improvement is especially noticeable in the firewalling and masquerading
    code. An added benefit is that the Linux code comes in source, and is free. So,
    the code is available for inspection, and you may audit your own improvements
    if special needs arise.


    Even if Linux weren’t so widely used and so well supported, I would still be inclined
    to build my own firewall instead of buying a prefabricated one. An advantage of
    a “home grown” solution is that you can tailor it completely to the demands of
    your company. No two networks are alike, and therefore no two firewalls are alike.
    Prefab firewalls aren’t always as flexible as a firewall based on a general-purpose
    kernel. Furthermore, building your own firewall forces you to become familiar
    with the critical components. You know where the pitfalls are, and you know how
    to circumvent them. This might sound unimportant, but the main reason firewalls
    are not as safe as they should be lies in human failure. If you aren’t familiar
    with the software involved, you can easily configure it incorrectly and, thus,
    leave the backdoor wide open.'
  merge: -1
  img_proc: true
- pgno: 138
  md: "Once you have the source for all the firewall components, you need to build\
    \ yet another kernel, this time configuring it to enable IP forwarding and other\
    \ firewall-related features.\n\nWith the firewall-configured kernel running, the\
    \ last steps are to configure the firewall packet filtering rules, configure an\
    \ appropriate nameserver, and revise the startup sequence so that only a minimum\
    \ of daemons are running.\n\n# Upgrading the Kernel Source\n\nFor this firewall,\
    \ I chose the most recent kernel available — v1.3.68, as of this writing. By the\
    \ time you read this, there will no doubt be an even newer version of Linux.\n\
    \n> **IP Masquerading**\n> \n> One of the features in the Linux kernel is IP masquerading,\
    \ which enables you to “hide” local systems behind one IP address. Its workings\
    \ are best explained by an example (Figure 12.2).\n> \n> The machine called “firewall”\
    \ will connect to the Internet, using IP address 194.09.13.150. This is the address\
    \ assigned to me by the ISP. These addresses are single node addresses, which\
    \ means that they cannot be used for routing traffic. So, the firewall cannot\
    \ run routed to announce routes to the machines host1 or host2.\n> \n> So, if\
    \ I want to connect to the Internet from host1 or host2, I need to do something\
    \ extra. Usually, I would install application proxies on the firewall. The local\
    \ hosts would then connect to these proxies, which in turn would connect to the\
    \ Internet.\n> \n> IP masquerading, however, enables the firewall to modify the\
    \ IP addresses in the IP packets sent by host1 or host2. For host1 and host2,\
    \ the machine firewall is a “normal” gateway. All nonlocal IP traffic from host1\
    \ or host2 will be sent to this firewall at address 193.78.174.33. The firewall\
    \ will then replace the source address, either 193.78.174.34 or 193.78.174.35,\
    \ with the IP address of the firewall (in this case, 194.109.13.150). Furthermore,\
    \ the firewall will store enough information from the IP packet in its internal\
    \ administration to reconstruct the answer received. When the destination on the\
    \ Internet sends a reply, the firewall will replace the destination address 194.109.13.150\
    \ with the address of the original sender, either 193.78.174.34 or 193.78.174.35.\n\
    > \n> This masquerading feature is configured with the ipfwadm program. You can\
    \ specify which source addresses should be masqueraded. You only have to specify\
    \ the outgoing route, from the local network to the Internet. The reverse is automatically\
    \ done by the kernel.\n> \n> Masquerading has some advantages over routing. First,\
    \ you are able to completely hide the local network (and thus the local addresses)\
    \ from the outside world. You only need to make one IP address publicly known,\
    \ which is an added security benefit. Second, you don’t need to configure a routing\
    \ daemon. This will save you some trouble and avoid a potential security hazard.\
    \ Third, you do not need to install proxy daemons on the firewall. This will also\
    \ avoid a potential security hazard; the fewer daemons running on the firewall,\
    \ the better. With masquerading, it is even possible to completely dispense with\
    \ inetd. This limits the number of open ports on your firewall and, thus, the\
    \ number of holes a hacker can probe to try to get in."
  merge: -1
  img_proc: true
