- pgno: 210
  md: "As shown in Listing 16.1, adding a host is done in the function addhost. It\
    \ will first scan the active sys file to see if the host is already present. If\
    \ so, it will issue a warning mail to root and exit. If not, it makes a backup\
    \ of the sys file, opens the template, and adds the host to the bottom of the\
    \ sys file. The sys file also replaces the %%% tokens with the name of the new\
    \ system.\n\n# Listing 16.1 (continued)\n\n```\n# Delete all hosts from sendmail.uunames\n\
    sub delmail\n{\n  local( $sysnam, $backup, $dummy );\n  local( $uid, $gid, $mode\
    \ );\n\n# Back up older versions\n&backupfile( $mailnam );\n$backup = $mailnam\
    \ . \".o\";\nopen ORIGINAL, \"$backup\" || warn \"Cannot open $mailnam, $!\\n\"\
    \ && link $backup,\n$mailnam && return;\nopen NEW, \">$mailnam\" || warn \"Cannot\
    \ creat $mailnam, $!\\n\" && link $backup,\n$mailnam && return;\n\nwhile( <ORIGINAL>\
    \ ) {\n  if( /^#/ || /^\\s*$/ ) {\n    print NEW;\n  }\n  next;\n}\nchomp;\nprint\
    \ NEW if (exists $delete{$_});\n\nclose ORIGINAL;\nclose NEW;\n# Set ownership\
    \ and permissions\n&setperm( $backup, $mailnam );\n} # delmail\n\n# Add all hosts\
    \ to sendmail.uunames\nsub addmail\n{\n  local( $sysnam, $backup, $dummy );\n\
    \  local( $uid, $gid, $mode );\n\n# Back up older versions\n&backupfile( $mailnam\
    \ );\n$backup = $mailnam . \".o\";\nopen ORIGINAL, \"$backup\" || warn \"Cannot\
    \ open $mailnam, $!\\n\" && link $backup,\n$mailnam && return;\nopen NEW, \">$mailnam\"\
    \ || warn \"Cannot creat $mailnam, $!\\n\" && link $backup,\n$mailnam && return;\n\
    \nwhile( <ORIGINAL> ) {print NEW $_;}\nclose ORIGINAL;\n\nforeach $sysnam (keys\
