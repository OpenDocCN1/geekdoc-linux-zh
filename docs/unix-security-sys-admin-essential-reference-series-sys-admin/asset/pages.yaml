- pgno: 206
  md: "Before a change is made to the sys file, a backup is saved. Experience has\
    \ taught me that one backup is sometimes not enough — if you make the same mistake\
    \ twice, you have lost the original. So, a history is kept of a maximum of three\
    \ old sys files.\n\n# Listing 16.1 (continued)\n\n```\n# Delete all hosts from\
    \ named\nsub delnamed\n{\n    local( $sysnam, $backup, $dummy );\n    local( $uid,\
    \ $gid, $mode );\n\n    # First the forward mapping. Back up older versions\n\
    \    &backupfile( $namedfwd );\n    $backup = $namedfwd . \".0\";\n    open ORIGINAL,\
    \ \"$backup\" || warn \"Cannot open $namedfwd, $!\\n\" && link $backup, $namedfwd\
    \ && return;\n    open NEW, \">$namedfwd\" || warn \"Cannot creat $namedfwd, $!\\\
    n\" && link $backup, $namedfwd && return;\n\n    while( <ORIGINAL> ) {\n     \
    \   if( /^;;/ ) {\n            print NEW;\n            next;\n        }\n    \
    \    ($sysnam, $dummy) = split /\\s/;\n        print NEW if( !exists $delete{$sysnam}\
    \ );\n    }\n    close ORIGINAL;\n    close NEW;\n    # Set ownership and permissions\n\
    \    &setperm( $backup, $namedfwd );\n\n    # Secondly the reverse mapping. Back\
    \ up older versions\n    &backupfile( $namedrev );\n    $backup = $namedrev .\
    \ \".0\";\n    open ORIGINAL, \"$backup\" || warn \"Cannot open $namedrev, $!\\\
    n\" && link $backup, $namedrev && return;\n    open NEW, \">$namedrev\" || warn\
    \ \"Cannot creat $namedrev, $!\\n\" && link $backup, $namedrev && return;\n\n\
    \    while( <ORIGINAL> ) {\n        if( /^;;/ ) {\n            print NEW;\n  \
    \          next;\n        }\n        ($dummy, $dummy, $sysnam) = split /\\s+/;\n\
    \        $sysnam =~ s/\\[.*\\]//;\n        print NEW if( !exists $delete{$sysnam}\
    \ );\n    }\n    close ORIGINAL;\n    close NEW;\n    # Set ownership and permissions\n\
    \    &setperm( $backup, $namedrev );\n}\n# delnamed\n```"
  merge: -1
  img_proc: true
