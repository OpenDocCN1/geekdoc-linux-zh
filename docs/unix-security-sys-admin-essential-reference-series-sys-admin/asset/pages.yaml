- pgno: 149
  md: 'I place these rule commands in a special rc file (rc.ineternet) in the /etc/rc.d
    directory. Make certain that the rc.local script invokes the rc.ineternet script.
    With this arrangement, the firewall rules and Internet-related modules are guaranteed
    to be loaded on every boot cycle. As its final act, this script should start the
    diald daemon. The complete source for the rc.ineternet script and its associated
    files is shown in Listings 12.6–12.9.


    The two most important files in the /etc/rc.d directory are rc.inet1 and rc.inet2.
    They take care of starting all the network-related daemons. To ensure that you
    aren''t starting any unnecessary daemons, you should probably remove the call
    to these two files from the rc.ineternet script and explicitly add invocations
    for any daemons you really need. Listing 12.10 shows my rc.ineternet script. Once
    you have managed to tune these scripts you will get a very lean firewall machine
    with a minimum of processes running. Listing 12.11 shows a typical process listing
    from an active firewall.


    # Conclusion


    With the system in this chapter, you can build an Internet firewall without a
    large number of complicated applications. You can use a simple configuration on
    your local network, without the need for proxy daemons. The firewall itself is
    also a straightforward machine, with a minimum of processes running.


    # Listing 12.9 diald.start — part of the source for the rc.ineternet script and
    its associated files.


    ```

    #!/bin/sh

    /usr/sbin/diald /dev/cua0 -m ppp mtu 1500 local 194.109.13.150 \

    remote 0.0.0.0 dynamic connect "/usr/sbin/chat -f /etc/ppp/pppcchat.xs4all" \

    defaultroute reroute lock modem crtscts

    ```


    # No telnet Please


    If you do not want to walk to the console of your firewall each time you need
    to change something, it is inadvisable to enable inetd so you can use telnet.
    Instead, connect the firewall via a dedicated serial cable to another trusted
    machine. You can then telnet to this trusted machine. Once logged into the trusted
    machine, you can use tip or cu to connect to your firewall. This is the safest
    way to do "remote" maintenance on your firewall.'
