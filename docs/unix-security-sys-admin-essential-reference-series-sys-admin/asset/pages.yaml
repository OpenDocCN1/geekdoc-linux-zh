- pgno: 112
  md: '# How Does Equivalency Work?


    Both local host and the remote host play a role in determining equivalency. When
    a user runs an r command, the local host attempts to validate the hostname. If
    the hostname is not in /etc/hosts and cannot be resolved using the Domain Name
    Server, the local host aborts the command and informs the user that the hostname
    is invalid. If the hostname is validated, the local host connects via TCP/IP to
    the remote host.


    When a user runs an r command, the remote host looks up the requested account
    name in /etc/passwd. If the account name is not there, the remote host aborts
    the command. The remote host checks to see if the account has an encrypted password:
    if there is no password, the command is executed. The remote host also checks
    to see if the user is root. If the user is root, the remote host checks /.rhosts
    for the host''s name; if it is there, the command is executed. (This is an example
    of user equivalency.) If the user is not root, then the remote host checks /etc/hosts.equiv
    for the local host''s name. If it is found, the command is executed. If no match
    is found, the remote host looks for an .rhosts file in the user''s $HOME directory.
    If .rhosts doesn''t exist or there is no match, rcp and rcmd(rsh) commands will
    fail, and rlogin will prompt for a password.


    # Security Issues with Equivalence


    The potential for security breaches is significant in organizations that make
    extensive use of root equivalency. If someone discovers the root password on one
    machine, he or she will then have access as root to all of the machines in the
    network.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_112_0.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The several offices of my company share a high volume of information, but as
    we are only using a 19.2 kilobaud PPP link, NFS usage is not practical. To avoid
    using root equivalency, we send some of the information via rdist. On the machines
    involved in these transactions, we created a special user with write access to
    the files into the appropriate directories.


    Remember that having host equivalency but no user equivalency can also be dangerous,
    in that a host from outside your network with the same user name as one of your
    users would be able to access your system almost unrestricted.


    For further information on host and user equivalency, see your system documentation
    and the book *TCP/IP Network Administration* by Craig Hunt (Sebastopol, CA: O''Reilly
    and Associates, 1992).'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Network Construction:

    Using a Firewall


    Chris Hare


    With the Internet becoming more and more popular, the need to control interaction
    between the Internet and the private network has become a critical issue for system
    and network administrators. Current policies range from the very restrictive —
    no Internet access at all — to laissez-faire — total access for all users. Each
    of these extremes is dangerous. The first denies users access to information for
    which they may have a legitimate need; the second opens a Pandora’s box of administrative
    nightmares. This chapter looks at how the two approaches can be bridged to meet
    legitimate user needs while minimizing security and other risks.


    # The Definition of a Firewall


    In building architecture, a firewall is a fireproof wall used to prevent a fire
    from spreading from one part of the structure to another. The concept applies
    in a similar fashion to computer technology, except that the “fire” usually originates
    outside the system itself. For computer purposes, a firewall consists of one or
    more machines separated from both the external network (e.g., the Internet) and
    the internal, or private, network by a collection of filters, which provide the
    protection. Filters can be used for a wide variety of tasks, including packet
    filtering, service relays, and more. As with firewalls used in architecture, there
    are different types of firewalls for computer purposes, each with different levels
    of protection.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# The Costs


    Even though free firewall software can be downloaded from the Internet, a firewall
    is not free. In fact, the costs can be significant. Some of the major costs are:


    +   - initial hardware purchase (if you don’t have something on hand that you
    can use);

    +   - ongoing maintenance of the hardware (remember, it can and does fail);

    +   - development or purchase of the relevant software;

    +   - software update and maintenance fees;

    +   - administrative and setup training;

    +   - ongoing maintenance and troubleshooting of the firewall;

    +   - losses from a misconfigured gateway or blocked services; and

    +   - loss of some services or conveniences that an open connection would supply.


    The software development or procurement cost can be very significant. Even if
    you elect to use free firewall software, it is up to you to compile it and make
    it work. Thus, you must have the internal resources to get the software compiled
    and operating.


    These costs must be weighed against the costs of not having a firewall, including:


    +   - time and effort spent in dealing with security breaches and break-ins;

    +   - loss of critical information from a security breach; and

    +   - data compromised by a security breach.


    The cost considerations vary greatly, from the value of the information that could
    be compromised or lost to the level of expertise available for handling the implementation
    and maintenance of the firewall. Each organization must assess these questions
    for itself before embarking upon the firewall journey.


    # What Do You Need to Protect?


    Information is the lifeblood of the computer age, and organizations of all types
    and sizes use computers for their information storage. The security perimeter
    to be enforced is the “fence” that surrounds the organization’s computing environment.
    However, the fence must allow guarded gate access to users with a legitimate need
    for the services offered by the organization. The perimeter becomes difficult
    to define and manage when the organization’s network connects to other networks,
    over which the administrator has no control.


    Telecommuting and home office computing further compound the difficulty of defining
    a security perimeter. If a user works from a hotel or home, you must extend the
    perimeter to that remote location. If you neglect to do this, the opportunity
    for the perimeter to be breached through this extension of the network is significantly
    increased.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'In the remote computing situation, the security perimeter can consist of several
    extensions. For example, the modems used to establish the link may be encrypting
    modems, which encrypt packet information prior to transmitting it on the line
    (though, this technology is expensive). The actual data on the hard disk of the
    remote computer could also be encrypted. Then if the computer were stolen, the
    data would be meaningless unless the user had left the decryption key with the
    computer.


    # The Building Materials: Firewall Architecture


    Once you’ve defined your security perimeter, the next issue is whether and how
    a firewall can be built to protect it. Different types of firewalls are appropriate
    to different circumstances: the type of firewall to be used should be matched
    to the problem or to the security policies that the organization wishes to enforce.
    In this section, I examine the major types of firewalls, explaining what they
    are, how they perform, and any known pitfalls. I won’t make recommendations, since
    what works in one situation may not work in another.


    # The Gate and Choke


    The gate in a network functions like a gate in a fence: it allows data to pass
    between the Internet and the private network. The choke is the opposite: it typically
    blocks all packets from the Internet to the private network, unless they are destined
    for the gate, and blocks all packets going from the private network to the Internet,
    unless they are destined for the gate. The choke is like a fence around a queue
    at an amusement park: there is only one entrance to the ride and all attempts
    to go around the queue are blocked by the fence.


    The gate and the choke can exist on separate computers or on the same computer.
    There can be multiple gates (e.g., one for each supported protocol) or there can
    be one gate. Multiple gates provide a small measure of increased security, but
    this is countered by the extra complexity and administration involved.


    The gate and the choke are built into many different firewalls. For a truly effective
    firewall, both must be present.


    # The Air Gap


    The air gap is probably the best firewall that can be devised, and it is used
    by many security and law enforcement agencies. In air gap implementation, any
    computer connected to the Internet cannot be connected to any other computer or
    network in the organization. While this may sound paranoid, it means that break-ins
    and viruses can affect only the systems connected to the Internet. Since these
    machines are not connected to any other host in the organization, the attacker
    cannot proceed any further.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'An air gap creates a problem with respect to getting useful information to
    the users in the organization. The problem can be solved in one of two methods:
    by hand or by disk. The first method, by hand, involves printing the relevant
    information and then typing it back in on a machine that is connected to the network.
    The advantage here is that the “seal” is very tight: no air or viruses being carried
    in the air can escape into the internal network. The second method involves saving
    the information to a disk, copying it back onto a networked system, and then distributing
    the information from that system.


    While these methods provide very tight security, they will also frustrate and
    alienate the users in the organization unless there is a very specific need for
    such heavy security. Users want to be able to correspond with colleagues on the
    Internet, and the prospect of having to re-input all of their information in order
    to send it out is not one they will welcome.


    # The Screening Router


    The screening router is a basic component of most firewalls. It can be either
    a commercial router or a host-based router with some form of packet-filtering
    capability. Many screening routers are able to block traffic between networks,
    between specific hosts, or on an IP port level. The screening router is situated
    between the Internet and the private network (Figure 11.1).


    A filter is used to monitor packets and decide which ones will be allowed past
    the router. The filter can allow or deny both inbound and outbound packets. Thus,
    the system administrator can not only deny packets coming from a particular external
    host, but also prevent connections to specific external systems from an internal
    machine.


    The filter can also allow or deny connections to a particular IP service port.
    Thus, you could block telnet or rlogin services while allowing FTP connections
    to an anonymous ftp server. Setting up packet filtering can be a frustrating and
    even dangerous experience. Developing an effective packet filtering configuration
    requires intimate knowledge of the TCP and UDP service ports. If the tables are
    inadvertently misconfigured, the packet filtering implementation may actually
    make it easier for vandals to gain access.


    Morningstar Technologies has built packet filtering capabilities into its PPP
    implementation (Figure 11.2). These capabilities allow the system administrator
    to permit or deny certain types of traffic. To prevent or restrict traffic flow,
    you must be able to anticipate what will be coming in over your router. Whatever
    the mechanism, many firewalls consist of nothing more than a screening router
    between the private network and the Internet. The pitfall is that this makes the
    network highly vulnerable to attack. Since there is direct communication from
    the Internet to the private network, the exposure in the event of an attack is
    equal to the number of hosts in the network. Furthermore, unless each host is
    being regularly examined for attack, the likelihood of an attack being discovered
    is low.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Figure 11.1 A screening router is situated between an external network (the\
    \ Internet) and an internal network (Macintosh).\n\n![](img/113bcc15fc2db8f0f40ac5d1e755f41c_118_0.png)\n\
    \n# Figure 11.2 An example PPP filter configuration file illustrates the necessity\
    \ of knowing what will come in over the router.\n\n```\n$ cat Filter\n#\n#/etc/ppp/filter\
    \ - PPP configuration file binding packet type to actions.\n#\n\ninternet system:\n\
    \    bringup intp 13/icmp 15/icmp 111/icmp !who !route !ntp\n    pass nntp/137.39.1.2\
    \ !nntp\n    !telnet/syn/recv\n    ftp/syn/recv !login/syn/recv !shell/syn/recv\
    \ !who\n    !sunrpc !chargen !ftp !supdup/syn/recv !exec !syslog\n    !route 16000/tcp/syn/send\n\
    \    keepup !send intp 13/icmp 15/icmp 111/icmp !who !route\n    log\n    rejected\n\
    \ndefault bringup intp 13/icmp 15/icmp 111/icmp !who !route\n    keepup !send\
    \ intp 13/icmp 15/icmp 111/icmp !who !route\n$\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: 'To make matters worse, most commercial routers have no logging capabilities,
    which makes detection of problems with the firewall virtually impossible. Screened
    routers are by no means the most secure solution, but they are one of the most
    popular because they provide virtually unrestricted access to the Internet for
    internal users. If there are trade secrets or sensitive information on hosts within
    the private network, a screening router will not provide the level of security
    needed.


    # The Bastion Host


    A bastion is a defensive strong hold. An electronic bastion is a strong point
    in a network’s security. Typically, a bastion host has a high degree of security,
    undergoes regular system and security audits, and may have modified software.
    The bastion host is often situated in a position similar to the screening router
    (Figure 11.3).


    The bastion host supports a configuration for each network and allows traffic
    for each network to pass through. Because of its exposure, the bastion host is
    often the subject of attacks from vandals. Despite this, the bastion host is frequently
    used in other firewall configurations to deliver the protection desired.


    # The Dual-Homed Gateway


    The dual-homed gateway is a firewall that is implemented without a screening router;
    it is probably the most common method of providing a firewall. A dual-homed gateway
    essentially consists of a bastion host system that allows no IP forwarding between
    the Internet and the private network (Figure 11.4).


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Under a dual-homed gateway, the only way to access the internal network is
    to negotiate the connection with the bastion host and then initiate a connection
    with the internal host. Another way of looking at this is that hosts on the internal
    network can communicate with the gateway, as can hosts on the Internet, but direct
    traffic between the two networks is blocked. From the Internet, the dual-homed
    gateway looks like all of the machines in the private network; from the private
    network, it looks like all of the machines in the Internet. The dual-homed gateway
    effectively acts as a service gateway, providing support for electronic mail and
    other services: it is, by definition, a bastion host.


    This is a popular firewall configuration because it is fairly easy to set up and
    provides a complete block between the Internet and the private network. The degree
    of user friendliness depends on how the system administrators set up access between
    the networks. Services like SMTP must have the mail delivered to the gateway,
    which then forwards the message to the destination machine. Other services, like
    telnet and rlogin, must be configured with accounts on the gateway to which users
    log in or must provide application-level relays to redirect the packets to the
    appropriate host.


    # Figure 11.4 A dual-homed gateway is essentially a bastion host that allows no
    IP forwarding between the external and internal networks.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
