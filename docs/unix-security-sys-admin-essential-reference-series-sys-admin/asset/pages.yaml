    | ALRM | 14 | Alarm clock timeout |

    | TERM | 15 | Terminate |

    | USR1 | 16 | User-defined signal |

    | USR2 | 17 | User-defined signal |

    | CHLD | 18 | Child status (aka CLD) |'
