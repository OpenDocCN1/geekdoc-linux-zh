  md: "# Listing 16.1 (continued)\n\n```\n# Delete all hosts from newsconfig\nsub\
    \ delnews\n{\n    local( $sysnam, $backup, $dummy );\n    local( $uid, $gid, $mode\
    \ );\n\n    # Back up older versions\n    &backupfile( $newsconf );\n    $backup\
    \ = $newsconf . \"o\";\n    open ORIGINAL, \"$backup\" || warn \"Cannot open $newsconf,\
    \ $!\\n\" && link $backup, $newsconf && return;\n    open NEW, \">$newsconf\"\
    \ || warn \"Cannot creat $newsconf, $!\\n\" && link $backup, $newsconf && return;\n\
    \n    while( <ORIGINAL> ) {\n        ($sysnam, $dummy) = split /:/, $_, 2;\n \
    \       if (lexists $delete{$sysnam}) {\n            print NEW;\n        }\n \
    \   }\n    close ORIGINAL;\n    close NEW;\n    # Set ownership and permissions\n\
    \    &setperm( $backup, $newsconf );\n}\n# Delete all hosts from nntpconfig\n\
    sub delnntp\n{\n    local( $sysnam, $backup, $dummy );\n    local( $uid, $gid,\
    \ $mode );\n\n    # Back up older versions\n    &backupfile( $newsnntp );\n  \
    \  $backup = $newsnntp . \"o\";\n    open ORIGINAL, \"$backup\" || warn \"Cannot\
    \ open $newsnntp, $!\\n\" && link $backup, $newsnntp && return;\n    open NEW,\
    \ \">$newsnntp\" || warn \"Cannot creat $newsnntp, $!\\n\" && link $backup, $newsnntp\
    \ && return;\n\n    while( <ORIGINAL> ) {\n        if( /^\\s*#/ ) {\n        \
    \    print NEW;\n            next;\n        }\n        $sysnam = $_;\n       \
    \ $sysnam =~ s/\\s*\\([^\\),]*\\)*,?//;\n        chomp $sysnam;\n        print\
    \ NEW if (lexists $delete{$sysnam});\n    }\n    close ORIGINAL;\n    close NEW;\n\
    \    # Set ownership and permissions\n    &setperm( $backup, $newsnntp );\n}\n\
    # delnntp\n```"
