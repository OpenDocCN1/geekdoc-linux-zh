- pgno: 83
  md: "That’s when I wrote logit (Listing 7.1). logit is a simple shell script that\
    \ “ages” any system accounting or log files by nightly renaming the current day’s\
    \ file to add an extension (e.g., syslog would become syslog.1). At the same time,\
    \ extensions from previously aged files are incremented (e.g., syslog.1 becomes\
    \ syslog.2, syslog.2 becomes syslog.3, etc.).\n\nAfter a log file becomes n days\
    \ old, it is purged. Thus, any file specified in the variable LOGFILE will be\
    \ aged until OLD, and then removed from the system. I keep log files around for\
    \ a week (Figure 7.1). Each aged file is named with the .n extension displaying\
    \ its current age. syslog.6 is the oldest syslog file and will be purged next.\n\
    \n# Listing 7.1 The logit shell script ages any system accounting on log files.\n\
    \n```\n#!/bin/sh\n#\n# Move today's system log files to yesterday's,\n# and yesterday's\
    \ to the day before's, etc.\n# Then, mail the contents of yesterday's.\n\nfor\
    \ LOGFILE in /usr/adm/isdn.log /usr/adm/syslog\ndo\n    OLD=6 # Logs older than\
    \ current.\n    while [ $OLD -gt 1 ]\n    do\n        NEW=`expr $OLD - 1`\n  \
    \      mv $LOGFILE.$NEW $LOGFILE.$OLD\n        OLD=$NEW\n    done\n    mv $LOGFILE\
    \ $LOGFILE.$OLD 2> /dev/null\n    touch $LOGFILE 2> /dev/null\ndone\n\nkill -HUP\
    \ `cat /etc/syslog.pid` # Restart syslog.d\n\nnohup /usr/bin/mailx -s \"SYSLOG\
    \ Status\" root </usr/adm/syslog.1 &\nnohup grep \"Security Error\" /usr/adm/isdn.log.1\
    \ \\\n| /usr/bin/mailx -s \"ISDN Status\" root &\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The syslog file with no extension is the current file in use by the system.
    After aging, logit uses kill to force syslogd to reread its configuration file.
    This is necessary after the current file has been aged: without the kill, messages
    will go to syslog.1 instead of syslog. I fire logit nightly by cron.


    Aging the syslog file and purging the oldest each night ensures that syslog will
    not grow to unlimited proportions. Unfortunately, it does not guarantee that I’ll
    remember to look at the log or that I’ll find the right information buried in
    it. To help


    # Figure 7.1 A sample file list shows the current and aged syslog files produced
    by logit.


    ```

    -rw-r--r-- 1 root sys 39 Aug 21 03:05 syslog

    -rw-r--r-- 1 root sys 45 Aug 20 03:05 syslog.1

    -rw-r--r-- 1 root sys 2850 Aug 19 03:05 syslog.2

    -rw-r--r-- 1 root sys 8735 Aug 18 03:05 syslog.3

    -rw-r--r-- 1 root sys 39 Aug 17 15:38 syslog.4

    -rw-r--r-- 1 root sys 541 Aug 16 03:05 syslog.5

    -rw-r--r-- 1 root sys 1502 Aug 15 03:05 syslog.6

    ```


    # Listing 7.2 A sample syslog.conf file shows the prioritization and routing of
    accounting and log messages.


    ```

    # syslogd configuration file.

    #

    # facility[...].severity    Destination

    #

    mail.debug                /usr/spool/mqueue/syslog

    local0.debug              /usr/adm/isdn.log

    *.info;local0.mail.none   /usr/adm/syslog

    *.alert                   /dev/console

    *.alert                   root

    *.emerg                   *

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'me do that, logit uses mailx to send me an e-mail containing either the entire
    contents of the log or just the interesting portions. This way, when I have time
    to check my mail, I can quickly verify system status and look for the bad guys.
    If I see something suspicious, I can go to any of this week’s logs for more information.


    The for loop and the two mailx commands reference two log files, syslog and isdn.log.
    When I first turned on accounting at our ISDN router, syslogd sent the data to
    /usr/adm/syslog. But I wanted the ISDN information split from all the other data
    in the syslog. By modifying /etc/syslog.conf, I rerouted the ISDN information
    to its own destination. (For a brief discussion of syslog.conf, see the sidebar.)


    The mailx commands at the bottom of logit route the log information to root. The
    first mailx sends all the contents of /usr/adm/syslog. The second mailx sends
    only the lines containing Security Error in the /usr/adm/isdn.log file. Obviously,
    there is room for customization here. Depending on your environment, you can use
    file aging and mailx on all sorts of files. In addition to monitoring log files,
    I use file aging and mailx to inform me of my disk-server status and the previous
    night’s backup results. Now my biggest nuisance is remembering to read my e-mail.


    # About /etc/syslog.conf


    /etc/syslog.conf is responsible for prioritizing and routing accounting and log
    messages (Listing 7.2). The first field is the priority level and the second is
    the information destination. The priority field is broken into sets of subfield
    pairs. The pairs are comprised of log types (or message-generating facilities)
    and message severity levels, separated by a dot. Multiple pairs are separated
    by a semicolon. The first line in Listing 7.2 defines the destination of mail
    message information. The .debug priority means send all data regardless of priority.
    Thus, any mail-related warnings or error messages will be reported to /usr/spool/mqueue/syslog.
    Likewise, all messages received via local0 are routed to /usr/adm/isdn.log.


    The syntax of the priority field takes a little getting used to. All messages
    at the alert level and above will be routed to both the console and root, if root
    is logged in. All messages at the emerg (emergency) level will be routed to everyone
    logged in. All messages at the info (informational) level will be routed to /usr/adm/syslog,
    with the exception (and here’s the complication) of messages from local0 and mail,
    which have the .none priority.


    .none is the opposite of .debug. It disables all facilities listed before it (but
    after the semicolon separator). In this case, .none ensures local0 and mail information
    level messages, which have already been sent elsewhere, won’t be duplicated in
    /usr/adm/syslog. Notice that alert and emerg level messages — including those
    regarding the ISDN connection and mail — will be duplicated at the console, and
    sent to root and all others currently logged in.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Login Surveillance on AIX


    Thomas Richter


    Monitoring user logins is important for the security of UNIX systems. System administrators
    need to know if someone has tried to gain unauthorized access (e.g., if someone
    has experimented with passwords for a certain user id). AIX v3.2.5 maintains several
    files with information about logins and failed logins, including details like
    time and date, remote host name, and terminal names. AIX does not, however, provide
    automatic reporting facilities for that information. This chapter describes the
    files in which AIX stores login information and introduces some tools that generate
    mail messages when suspicious activity has occurred.


    # Shadow Password File


    The encoded user password stored in the world readable password file `/etc/passwd`
    poses a distinct security risk. Any bad guy could use the `ftp` command to copy
    this file either locally or remotely, and then use a password cracking program
    [1, 2].


    AIX maintains a shadow password file, `/etc/security/passwd`. This file contains
    the encrypted password and is used when the `/etc/passwd` file contains an exclamation
    mark (!) as the password for a user ID. `/etc/security/passwd` is owned by user
    root and has read and write permissions for root only. This makes relevant user
    details accessible to general users while protecting the encoded password.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Figure 8.1 shows sample entries from /etc/passwd and /etc/security/passwd files.
    The first line is the user''s entry in /etc/passwd; the next four lines are the
    user''s entry in /etc/security/passwd. password is the encoded password and lastupdate
    is the time and date of the last password change in seconds since 1 Jan 1970 (epoch).
    flags can be one of the following values.


    NOCHECK Password restrictions defined in /etc/security/login.cfg are not enforced.
    These restrictions define password aging, the character set, and the maximum number
    of repetition of characters in a password.


    ADMCHG The password was last changed by a member of the security group. The password
    must be changed when the user logs in.


    ADMIN Only root can change this password.


    # Log Files


    AIX maintains several log files in which login-related data is stored. All of
    these files except /etc/security/lastlog grow until manually reduced.


    /etc/security/failedlogin contains all logins that failed for any reason, whether
    it was an invalid password or userid. This file contains binary data and does
    not record failed su commands. The contents of the file can be displayed with
    who /etc/security/failedlogin, as shown in the following example.


    ```

    richter pts/4 Sep 09 10:50 (tiger)

    root pts/4 Sep 09 10:50 (tiger)

    UNKNOWN pts/4 Sep 09 10:50 (tiger)

