- pgno: 30
  md: "Such accounts shouldn't figure into oldacct's checking. Typically, administrative\
    \ accounts have low UID numbers. These numbers reside in field three of the /etc/passwd\
    \ file. On the system for which I originally wrote the oldacct script, the threshold\
    \ UID was 200. Administrative accounts had UIDs less than 200; regular user accounts\
    \ used 200 or greater. You'll need to tune the oldacct script to reflect the lowest\
    \ regular UID your system uses.\n\n# Listing 2.3 (continued)\n\n```\nif [ \"$5\"\
    \ = \"Idle\" ]      # Still logged in\nthen\n    continue                 # Keep\
    \ going\nfi\n\nOLDMONTH=$4\nOLDDay=$5\nOLDYEAR=$6\n\n# If last login was within\
    \ 6 months, year will be an hh:mm time\nif [ $OLDYEAR -gt 999 ]      # It must\
    \ be >= 6 months old\nthen\n    echo \"$u\\t$OLDMONTH $OLDDay $OLDYEAR\"\n   \
    \ continue\nfi\n\nif [ `monthnum $OLDMONTH` -lt $EXPMONTH -o \\\n`monthnum $OLDMONTH`\
    \ -gt $CURRMONTH ]\nthen\n    echo \"$u\\t$OLDMONTH $OLDDay $OLDYEAR\"\n    continue\n\
    fi\n\nif [ `monthnum $OLDMONTH` -eq $EXPMONTH -a $OLDDay -lt $EXPDAY ]\nthen\n\
    \    echo \"$u\\t$OLDMONTH $OLDDay $OLDYEAR\"\n    continue\nfi\n\ndone\n\nif\
    \ [ -n \"$NOLOGIN\" ]\nthen\n    echo \"Never logged in:\"\n    echo $NOLOGIN\
    \ | tr ' ' '\\012' | pr -t -6\n```"
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The oldacct script must convert the month names, as finger delivers them, into
    month numbers. The function monthnum handles the conversion by setting up an associative
    array between the month names and their numbers. Given the name string, it returns
    the number. The script also includes code to show a way to turn a month number
    back into that month’s name. That conversion isn’t needed, though, so it is disabled.


    Expiration dates derive from the current date, so the system delivers the current
    month, day, and year. A four-digit year matches finger’s use. Using 90 days as
    the age threshold requires removing three months from the current date to get
    the expiration date. The script checks whether the current month is between January
    and March. If so, removing three months would wrap around to the previous year,
    delivering a negative number that would require an additional arithmetic operation.
    So instead of subtracting three months, the script adds nine months (January,
    month 1, becomes October, month 10, which is three months earlier), then reduces
    the year number. When the current month is April or later, it simply subtracts
    the three and leaves the year alone.


    Although three months is considered 90 days without regard to the actual days
    elapsed, the day number will play a small part in the comparison. Because most
    months have 30 or 31 days, the day isn’t too critical except for February, which
    may be off by as much as three days. So, if the calculated expiration month number
    is February and the expiration day number is past the 28th, I force it to be the
    28th. Otherwise, I leave it alone. That’s close enough for this rough work. If
    you need more precision, set up another array to deliver the correct total days
    for every month and include the February leap day.


    Before the program begins its search for old accounts, it must decide which users
    to look for. awk passes through the password file using a colon as the field separator.
    If the record’s UID comes after the threshold for regular users, it omits the
    user’s name. All these names are collected into the USERS variable. With this
    variable set, the script can call finger once for each user name.

    finger can match its arguments either in the login name or in the passwd file’s
    GECOS field, which spells out lots more detail about the user. The GECOS field
    is informative when you are using finger interactively. You can ask for another
    user’s first name or last name and get the rest of the information, including
    the login name. When you know very little about the person, this feature can help
    you discover more. For the script’s purposes, a problem arises when a user’s login
    name is his or her first name and several other users have the same first name.
    finger lists all of the users with that name, not only the one I want first. finger’s
    -m option forces it to match only the login name.


    If finger has trouble with that user’s data, the script sends its error messages
    to the bit bucket. Otherwise, the fourth line contains the last login date and
    time. sed extracts that fourth line; the -n option suppresses sed’s default printing.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The script’s subsequent actions depend on the number of words in the fourth
    line. `finger`’s output is not completely consistent. When the fourth line contains
    more than five words, that line has the information that the script wants. When
    there are fewer than five words, `finger` is indicating something special about
    the login. The shell’s `set` command parses the words, making word counting and
    isolating simple.


    One special fact `finger` can discover is whether the account has ever been used.
    If the user has never logged in to the account, the old `acct` script must report
    that account name. The original version of the program simply output each user’s
    name followed by whether that user was beyond the ancient account threshold. By
    overprinting, the script showed only those ancient accounts.


    So much for best-laid plans. When I ran that version on the first test system,
    I found too many never-used user accounts, and these tended to scroll the list.
    I did want to know about such accounts. To correct the scrolling problem, I decided
    to separate the unused accounts from the used accounts and report the unused ones
    in a list at the end of the regular report. So I commented out the simpler echo
    code and created a `NOLOGIN` variable to hold the concatenated list of never-used
    user names. At the very end of the script is the code to print out that variable’s
    value.


    Another problem came up when the `GECOS` field included lots of information. `finger`
    analyzes the `GECOS` field looking for certain characteristics. Most of the information
    appears on the second line, while the home directory and the default shell show
    up on the third line. When a home phone number was included, `finger` put it on
    the third line and dropped the home directory and default shell information to
    the fourth line, happily fouling up all of my line-oriented assumptions.


    I couldn’t avoid those line-oriented assumptions because `finger` doesn’t apply
    a uniform heading to the line containing the login information. Sometimes it says
    `Last login`, other times it says `On since`, and, as already mentioned, it might
    say `Never logged in`. These appeared most frequently on line four. Since I didn’t
    want to run `finger` too often, I thought it would be easier to focus on that
    fourth line, and correct the program’s assumptions when the fourth line was fouled.
    For the home phone number, the first word in the fourth line is `Directory:`,
    so the script tests specifically for that. If the script finds that word, `finger`
    is reexecuted to extract the fifth line. The `set` command parses the extracted
    line, and the `while` loop reexecutes using the newly extracted line.


    Another special case appeared when there was no phone number in the `GECOS` field.
    When this happened, the third line contained the relevant data, not the fourth.
    (Account creation consistency can be a wonderful thing — try to set your `GECOS`
    fields uniformly.)


    If fewer than five arguments appeared, the user had never logged in. The `while`
    loop’s test for fewer than five arguments has already accounted for the ancient
    account. A separate less-than-four test following the `while` loop continues with
    the next user name. All other account dating lines are five words or more.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'If the first two words are On since, the user is still logged in. Similarly,
    the fifth word is Idle when a user is logged in but idle. finger doesn''t always
    show On since for the Idle case. These aren''t ancient accounts, so the script
    continues with the next user.


    When all these tests pass, the current line contains the last login date. finger''s
    fourth line contains the words Last login followed by the date when the user last
    logged in, including the day of the week, either the time or year, and which tty
    or pty device the user last logged in on. The fourth, fifth, and sixth fields
    contain the relevant date information. The OLDMONTH, OLDDAY, and OLDYEAR variables
    hold those date values. If the last login was within six months, finger shows
    the time in the sixth field; dates older than six months show the year instead.
    The easiest way to isolate that case is to look for a four-digit number. If the
    OLDYEAR variable has four digits, it can''t be a time and so the account must
    be ancient. Otherwise, the script doesn''t get off so easily.


    If the month finger reports is less than the expiration month, this is an ancient
    account. What if the finger month is really old? If the expiration month is January,
    the finger month could be December and not be less than the expiration month.
    Because the expiration month is January, the current month must be April. December
    is still within six months, so this won''t be caught by the four-digit year test.
    Consider that December (12) comes after April (4), the current month when this
    case happens. If either happens, this is an ancient account. Finally, if the finger
    month is identical to the expiration month, the script compares the account with
    the calendar day. An account is not ancient unless $OLDDAY is prior to that calendar
    day.


    By the time the username loop finishes, all ancient accounts have been printed
    with the user name and the last login date separated by a tab. As with the previous
    script, the format isn''t necessarily pretty, but another program can easily parse
    it. If you want prettier output, surround the entire for loop with parentheses
    and pipe it into awk or something else.


    The script finishes by testing whether the NOLOGIN string variable has anything
    in it. If it does, the variable contains a set of words, each word naming one
    user who never logged in. pr(1) formats that list into a set of columns if the
    list is delivered with each name on its own line. tr(1) translates the spaces
    into newlines. pr formats the lines into six columns, truncating the names as
    needed to fit. The names are not sorted, so they appear in their /etc/passwd order.
    If you''d rather sort the names, pipe tr''s output through sort before piping
    the result to pr.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Stalking the Wily Aging Report


    Unless you''re the only user on your UNIX system, be sure to password protect
    all accounts and enable aging on all passwords. Password aging methods vary from
    one UNIX system to another. On SVR4, for example, the aging information is kept
    in the /etc/shadow(4) file as a set of colon-delimited numbers. However, HP-UX
    keeps the aging information in the /etc/passwd(4) file. Aging values are encrypted
    as base-64 numbers and concatenated to the encrypted password, separated from
    the password by a comma. The problem with this method is the lack of an easy way
    for anyone to review the settings. Without a simple way to review the aging settings,
    administrators over time have found it easier to leave aging unset than to figure
    out the proper settings and implement them.


    The chkaging script (Listing 2.4) identifies the aging settings for the HP-UX
    /etc/passwd file. The script also offers translation features. Someone could deliver
    an encrypted aging value and what the aging numbers are, or deliver aging numbers
    and discover the correctly encrypted aging value. With this script, administrators
    and managers could review and properly set aging on their systems. (We eventually
    found a script from the HP-UX community that also set the /etc/passwd file. Many
    features in that script would have been included in the next incarnation of this
    chkaging script.)


    # Listing 2.4 The chkaging script identifies the aging settings for the HP-UX
    /etc/passwd file.


    ```

    #!/bin/sh

    #

    # chkaging

    #

    # Report current password aging settings from the /etc/passwd file.

    # If -a is used, translates an aging value into a set of weeks numbers.

    # If -d is used, translates a set of weeks number into an aging value.

    #

    # Each aging value is formed from a set of base-64 numbers representing:

    #

    # 1. the number of weeks maximum before a password change is forced

    #    by the system,

    # 2. the number of weeks minimum before a new password may be changed

    #    by the user, and

    # 3. the number of weeks elapsed since week 0, 1970, when the password

    #    was last changed.

    ```'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Listing 2.4 (continued)


    ```

    #

    # The base-64 numbers are formed from the set of alphanumeric characters

    # and two punctuation marks. The aging value follows the password,

    # separated by a comma. If the comma isn''t there, aging is deactivated

    # for that account. The weeks elapsed string may be missing, which

    # corresponds to 0 weeks elapsed. That should force the password to change

    # with the next login. According to passwd(4), the .. (00) should always

    # force a new password on the next login.

    #

    # Copyright 1994, Lawrence S Reznick

    # HISTORY

    #

    # 94Apr19 LSR

    # The base-64 digits are output in reverse place-value order. That is,

    # if the digits should have been Hm (H in the 64s place and m in the

    # 1s place), the password aging system will output it as mH. Corrected

    # the weeknum() & code_val() functions to handle it that way.

    #

    # Also, the NOW_WEEKS value is off because a 365-day year is really 52

    # weeks plus 1 day. expr doesn''t work with floating point, so the simplest

    # solution is to add 1 day for every 7 years since the epoch.

    #

    PW_FILE=/etc/passwd # Point to passwd file

    #

    # NOW_WEEKS holds the number of weeks elapsed since 1970: aging epoch

    #

    NOW_WEEKS=`expr \(`date ''+%Y''\` - 1970 \) * 52 + \`date ''+%U''\`

    NOW_WEEKS=`expr \`date ''+%Y''\` - 1970

    NOW_WEEKS= `expr $NOW_WEEKS \* 52 + \`date ''+%U''\` + \( $NOW_WEEKS / 7 \)`

    #

    #

    # Given an encoded aging weeks value, return the numeric equivalent

    #

    DIGITS="./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"


    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Implementing a base-64 translation in shell script was an interesting exercise.
    Unfortunately, it got even more interesting when I discovered that HP-UX stores
    the digits in reverse place-value order. For instance, the decimal value 12 is
    one in the ten’s place and two in the one’s place. Written in reverse place-value
    order, that same number is 21, which violates the law of least astonishment. For
    those interested in the correct numeric way to handle the base-64 digits, I’ve
    left the original code, but commented out the lines.


    Aging values come in three parts. The first part is the maximum number of weeks
    a user may continue using a password until the system forces a change. This maximum
    value uses only one character, so a password must be changed within 63 weeks from
    the date of the last change. You may require users to keep the same password for
    some minimum weeks. The next character stores minimum time before a change. As
    with the maximum, the minimum may be as few as zero weeks. Such a user could change
    the password again immediately after changing it. As much as 63 weeks could elapse
    before the system allows a change. All remaining characters define the base-64
    week number when the last password change was done. This week number is the weeks
    elapsed since 1970, where zero is 1970’s first week.


    NOW_WEEKS holds the number of weeks elapsed at the time the program runs. At first
    thought, this is the number of years since 1970 multiplied by 52 plus the week
    number of the current date. However, that’s not really good enough. A 365-day
    year divided by a 7-day week yields 52 weeks and one day. For most quick and dirty
    estimations, 52 weeks is good enough, but every seven years, this Q&D calculation
    loses a week. With over 20 years having passed since the 1970 epoch, the Q&D calculation
    loses over three weeks. You can correct the formula by finding out how many seven-year
    periods have elapsed, then adding one week for each of those periods. So, NOW_WEEKS
    precalculates the number of years, then reuses that number to calculate the main
    weeks number and the fractional correction.


    The weeknum function converts a base-64 number into its decimal equivalent. weeknum
    uses the DIGITS variable to hold the base-64 digits and associates their place
    values with each digit’s subscript number. This function was one of those that
    needed changing to accommodate the reverse place-value order. Originally, a for()
    loop scanned across the base-64 digits from left to right. That for() loop remains
    commented in the code for reference, but I replaced it with a do...while() loop
    to scan from right to left. Shifting the 64-weighted decimal values is identical
    despite the digit scanning order.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# Listing 2.4 (continued)\n\n```\nweeknum ()\n{\n    echo $1 |\n    awk '\n\
    \    #\n    for (i = 1; i <= length; i++) |\n        i = length;\n        do |\n\
    \            sum += 64;\n            sum += index(digits, substr($0, i, 1)) -\
    \ 1;\n        | while (--i);\n    }\n    END |\n        print sum;\n    |\n  \
    \  ' digits=$DIGITS\n}\n# Given a comma-separated number list (max,min,elapsed),\n\
    # output aging code\n#\ncode_val ()\n{\n    echo $1 |\n    awk -f '\n    $1 <\
    \ 0 || $1 >= length(digits) {\n        print \"Max out of range! 0 <= Max < \"\
    , length(digits);\n        exit;\n    }\n    $2 < 0 || $2 >= length(digits) {\n\
    \        print \"Min out of range! 0 <= Min < \", length(digits);\n        exit;\n\
    \    }\n    |\n```"
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The code_val function also required changing to handle the reverse place-value
    problem. Values are passed to this function as a comma-separated list. Because
    /etc/passwd requires the maximum and minimum values to be single-character values,
    though a user could pass test values of any amount, the awk program range-checks
    them. Encoded values show as a set of characters, such as 00AH where the o is
    the MAX, the 0 is the MIN, and the AH is the weeks ELAPSED. The code produced
    can simply receive these characters concatenated. Because the MAX and MIN are
    single characters, awk''s substr() function is sufficient.


    The elapsed value requires base-64 decomposition. awk doesn''t have Boolean AND
    or bit-shifting operators, so division and remainder operators are needed. These
    operations don''t change with the reverse place-value order, but the concatenation
    sequence does. The original version showing the mathematically correct digit construction,
    appending the base-64 number to the latest digit''s value, remains as a comment
    for interested readers. To get reverse place-order sequence, append the latest
    digit to the base-64 number constructed instead. The final base-64 number, whatever
    the place-value order, is concatenated to the MAX and MIN codes and omitted from
    the code_val function.


    aging_val converts an encoded aging value into its decimal form. aging_val uses
    expr()''s colon operator to extract the MAX, MIN, and ELAPSED substring codes,
    and the weeknum function to show their decimal equivalents. One key issue is that
    HP-UX''s /etc/passwd specifies that a missing elapsed code is equivalent to a
    0 value. To make the code regular, aging_val appends the ..0 value to the code.
    Finally, in displaying the time elapsed since the last change, I chose to show
    how long ago the password was changed. This number is dynamic. As time passes
    from week to week, running the chkaging program will show different values for
    the same account.


    show_aging is the default operating function for the chkaging program. It extracts
    the user names and their encrypted password fields from the /etc/passwd file.
    chkaging assumes that administrative accounts will have their logins explicitly
    disabled and will show an * instead of a password. It ignores such accounts. Otherwise,
    each name is echoed with its aging information. The shell''s set command parsing
    mechanism separates the aging information from the encrypted password. There is
    no comma in the 4-digit encryption character list.


    Originally, the script simply output the warning that aging was inactive next
    to each login name. Soon, though, I ran into a system where almost every account
    had no aging. To simplify identifying such accounts for repair, I decided to accumulate
    the names into a NOAGING variable. After showing the active user list, I display
    the NOAGING names all at once in a columnar list. Once the NOAGING variable''s
    handling and printing were in place, I commented out the two original lines.


    The main processing routine decides whether to call show_aging to review the /etc/passwd
    file, to analyze the encrypted aging values (the -a option), or to analyze the
    decimal week code values (the -d option).'
  merge: -1
  img_proc: true
- pgno: 39
  md: "# Listing 2.4 (continued)\n\n```\ncode = substr(digits, $1 + 1, 1);\ncode =\
    \ code substr(digits, $2 + 1, 1);\n\nelapsed = $3;\ndo\n  quot = int(elapsed /\
    \ 64);\n  remn = elapsed % 64;\n  base64 = substr(digits, remn + 1, 1) base64;\n\
    \  base64 = base64 substr(digits, remn + 1, 1);\n  elapsed = quot; while (elapsed\
    \ >= 64);\n  base64 = substr(digits, quot + 1, 1) base64;\n  base64 = base64 substr(digits,\
    \ quot + 1, 1);\n  code = code base64;\n  print code;\n}\n\n' digits=$DIGITS\n\
    |\n#\n# Given a full aging value (no comma), display its numeric values\n#\naging_val\
    \ ()\n{\n  code = $1\n  if [ `expr length $code` -eq 2 ]\n  then\n    code=$[code]..\n\
    \  else if [ `expr length $code` -lt 3 ]\n  then\n    echo Invalid aging code\
    \ \"$code\"\n    return\n  fi\n  fi\n\n  MAX=`expr $code : '\\(..)'`      # Grab\
    \ max weeks\n  MIN=`expr $code : ':\\(..)'`    # Grab min weeks\n  ELAPSED=`expr\
    \ $code : ':\\..\\(*' ` # Grab weeks since epoch\n\necho \"aging set to `weeknum\
    \ $MAX` weeks max, \\c\"\necho \"`weeknum $MIN` weeks min, \\c\"\necho \"last\
    \ changed `expr $NOW_WEEKS - \\`weeknum $ELAPSED\\`` weeks ago.\"\n}\n```"
  merge: -1
