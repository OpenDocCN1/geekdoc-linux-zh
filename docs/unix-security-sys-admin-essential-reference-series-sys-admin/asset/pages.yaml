- pgno: 58
  md: '# Managing Super-User Privileges with a Revised sudo


    Don Pipkin


    Most mature operating systems (e.g., IBM''s MVS, DEC''s VMS, and HP''s MPE) provide
    a number of privileges, many of which are limited in scope, that can be assigned
    individually to users on the system. On UNIX, however, you either have super-user
    privileges or you don''t — all or nothing. Generally, the super-user privileges
    are given to one user, root. This means root has to be available for any of a
    number of tasks, including lp administration, mounting and unmounting disks, changing
    network configuration, adding users, shutting down a system, and running backups.


    Working around this inconvenience can cause a number of security issues for a
    system. If you give root''s password to everyone, you violate basic password security
    and lose the ability to find out who performed a command as root. Being able to
    log on as root from anywhere is always a bad idea; and allowing several people
    to do this is worse, since it greatly increases the likelihood that a root terminal
    session will be left unattended. Anyone with physical access to a terminal left
    in such a state has root access. It takes only minutes to extend privileges or
    subvert the system.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Under certain circumstances, however, it’s useful to be able to delegate some
    privileges. It may be that a networking staff, rather than the system administrator,
    is responsible for the networking. Operators may need to back up files. Perhaps
    a manager has a team of support personnel, but does not want the root password
    to be that widely known.


    This last was the case for a recent customer of mine. The organization had about
    500 workstations that were supported by a staff of 20. All these systems had the
    same root password, which was changed weekly. The major concern was keeping track
    of what had been done on each of the systems by any of the support personnel.
    To this end, the root logon was only used when mandatory and was restricted to
    the system consoles. In place of the root logon, they used a program called sudo
    (super-user do), which allows them to execute commands with super-user privileges
    and logs this activity.


    # History


    sudo (Listing 5.1) is a set-user-id program that runs as root and allows authorized
    users to execute commands for which they are approved. sudo originally written
    by Cliff Spencer of SUNY-Buffalo and was published in Evi Nemeth’s UNIX System
    Administration Handbook. sudo was originally written to run under BSD UNIX.


    The original sudo left a number of things undone. These included being able to
    shell out of programs like vi, using root’s path, having to fully qualify the
    commands to be executed, having to specify all the commands that can be executed
    and not being able to specify commands that cannot be executed, and being able
    to specify "all" commands, thereby allowing a user free range. A user could also
    sudo a shell and thereby circumvent the logging mechanism.


    The original sudo used root’s complete environment, including root’s shell and
    path. I added the putenv commands to set the shell to /bin/false and assigned
    a path for commands that can be run by sudo. Reassigning the shell variable keeps
    programs like vi from being able to spawn a subshell. Assigning a path limits
    the scope of the commands that can be executed with sudo. It also eliminates the
    need to fully qualify path names for commands. I added a not option to the configuration
    file to allow you to configure someone to run all commands except those listed.'
  merge: -1
  img_proc: true
