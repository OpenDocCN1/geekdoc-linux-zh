- pgno: 186
  md: '# The Second Part


    Now you have to get the updated password file to the clients. This looks harder,
    but is actually much easier: cron can use any of at least five perfectly good
    ways.


    # Alternatives


    There are two main sets of programs that can be used to transfer the updated password
    files: the Berkeley r-commands and NFS. ftp and tftp are possible, but may pose
    security problems.


    # Using the Berkeley r-commands


    rdist is convenient, because it runs a script after transferring. It therefore
    doesn''t require a crontab entry on the client. rdist is particularly good for
    a centralized implementation, in which all the clients trust rsh commands from
    a central password server.


    track is also good. It strictly "pulls" from a server to a client that subscribes
    to the password service. track reverses the r-command trust relationship: the
    server trusts the clients, which is better for decentralization.


    If rdist or track won''t work on all your machines, then you can use rcp to copy
    files and rsh to run the installation command. However, rcp and rsh can fail silently.


    You can also simulate rcp with rsh server cat /etc/passwd | cat >safe-place, which
    works reliably even on the worst systems, such as an "ursus horribilis" that I
    used to administer.


    # Using NFS


    NFS is another good means, with quite a different set of access controls than
    the r-commands: the server exports a filesystem containing the data to a limited
    list of clients.


    # Using ftp


    ftp also works, at the cost of finding a noninteractive ftp program and at the
    risk of sending an ftp password clear across the Net.


    # Using tftp


    Well, perhaps, if you don''t actually mind crackers.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Transferring the Updated Password Files


    In all these cases, the updated password file is deposited in a "safe" place (a
    partition with lots of space), and then a script copies it to /etc/passwd with
    suitable safety checks. The script could be as simple as the following pseudocode
    example.


    ```

    if [! -f /etc/ptmp ]; then

    cp /some/safe/place/in/root /etc/ptmp

    mv /etc/ptmp /etc/passwd

    fi

    ```


    That''s almost what I''ve done, but without the race condition. The code is in
    the client password update script (Listing 15.3).


    # Listing 15.3 The client password update script deposits the updated password
    files in a partition with lots of space, then copies them to /etc/password with
    suitable safety checks.


    ```

    #!/bin/sh

    #

    # passwd-update -- update /etc/passwd from a copy of the master.

    # Spends most of it''s time checking to see if it succeeded.

    #

    SAFEPLACE=/usr/local/etc/passwd # Place where the master puts it.

    SAFEMINIMUM=25 # Smallest allowable /etc/passwd file size, in lines.


    if ccopy $SAFEPLACE /etc/ptmp; then

    : It was ok.

    else

    echo "$0: /etc/ptmp exists, therefore the /etc/passwd file"

    echo " is locked. Try again later, please."

    exit 0

    fi

    ```'
