    if [ -f $MODDIR/slip.o ]; then

    echo -n "slip"

    /sbin/insmod $MODDIR/slip.o

    fi

    # And finally, start the diald

    if [ -x /etc/ppp/diald.start ]; then

    echo "starting diald"

    /etc/ppp/diald.start

    fi

    echo "Done"

    ```


