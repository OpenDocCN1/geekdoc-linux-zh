    #

    ```


    # Publicly Available Tools — continued


    The configuration file shown in Figure 11.10 consists of patterns in the same
    style as perl and an action to be performed. In most of these examples, the patterns
    are echo or ignore. echo actions print the lines: ignore actions are self-explanatory.
    When the swatch program uses this configuration file to examine the syslog file,
    the output is similar to that shown in Figure 11.11.


    The configuration possibilities using swatch are extensive, and it is a good tool
    for sorting through the contents of a syslog file. The swatch programs can be
    found on sierra.stanford.edu in /pub/sources.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/113bcc15fc2db8f0f40ac5d1e755f41c_132_0.png)


    # ## Publicly Available Tools — continued


    # ### tcpdump


    tcpdump is the best tool available on the Internet for monitoring the traffic
    on a network. tcpdump prints out the headers of packets on a network interface
    that match a Boolean expression. In order to build tcpdump, you must also have
    the libpcap library from the same ftp site. Sample output of the tcpdump command
    is shown in Figure 11.12. The source code for tcpdump can be found on FTP.FE.EB.LGOV
    in /tcpdump-3.0 (as of November 5, 1994).


    # ### TAMU


    The TAMU (Texas A&M University) system is a collection of tools that can be used
    to build a firewall or detect attack signatures. The collection includes a set
    of scripts that can be used to assess the security of the machines in your network.
    The tools include an advanced internet filter bridge, a powerful but easy-to-use
    program for securing individual hosts, and a network monitor. Be warned that the
    anonymous FTP server at F.T.A.M. specifically restricts the number of anonymous
    ftp users. The directory /pub/security/TAMU contains the scripts.


    # ### COPS


    COPS, another popular system auditing package, runs a set of programs, each of
    which checks a different aspect of security on a UNIX system. If potential security
    holes do exist, the results are either mailed or saved to a report file. COPS
    provides extensive capabilities; Figure 11.13 shows a sample report from the COPS
    tools. The COPS scan can be retrieved from FTP.CERT.ORG, in the directory /pub/tools/cops.


    # ### crack


    While I am loath to condone the use of password cracking programs as a system
    administration tool, I also feel that if we as system administrators don''t use
    the tools at hand to validate the state of our system''s security, someone else
    will use those tools to break that security. A real firewall alleviates the possibility
    of external attack, but it does not solve the problem of potential threats from
    internal users.


    crack is one of the best-known password cracking programs. It can be customized
    to use your own dictionaries. crack can be found on ftp.cert.org in /pub/tools/crack.
    A good set of alternate dictionaries can be found on black.ox.ac.uk in /ordlists.'
  merge: -1
  img_proc: true
