- pgno: 180
  md: '# Remote Password Update


    David Collier-Brown


    If you have more than one machine, it can be a nuisance to change your password
    in several places. If you have more than two or three machines and multiple users,
    updating the password on each machine individually is error-prone. Fixing people''s
    passwords, even your own, wastes time better spent doing more useful work. A program
    that allows you to change the password once on a server then have all the client
    machines updated from it would be more efficient. This chapter introduces a remote
    password update program that I use to streamline these tasks.


    # Alternatives


    There are lots of ways to update password files for several machines, including
    sneakernet. Most are rather complicated. One (Kerberos) requires you to dedicate
    a machine just to the management of passwords and "tickets." Another (Yellow Pages)
    assumes that every machine you have will store all the main configuration tables
    under the control of a single program.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'This is not the simple, single, elegant solution I normally expect to see on
    UNIX. So, several years ago, I set out to provide a simple mechanism that used
    only pedestrian UNIX networking facilities (rlogin and rsh). The homebrew program
    here, called "Blue Pages" was originally written to allow me to avoid using Yellow
    Pages (YP) in a university teaching lab. Besides being insecure, YP in that era
    was appallingly slow when an entire class attempted to change passwords. Since
    then, I''ve rewritten the program three times (see the sidebar "Tradeoffs") and
    found that the approach works as well for three machines at home as it does for
    a 40-machine commercial R&D company. And it works on machines that can''t run
    YP.


    There are only two parts to the program: the first arranges for everyone to change
    their passwords on a "master" server and the second arranges for the other machines
    to pick up the updated password file. The first uses rlogin, the second uses rsh,
    NFS, or ftp.


    # The First Part


    Arranging for everyone to change their password on the master server appears deceptively
    simple: all they need to do is run the passwd program on the master. In fact,
    this is the hard part, and took several experiments before I found that I really
    didn''t need anything more than rlogin and /bin/passwd. I was greatly relieved,
    as I lacked the time to write a massive program like YP or Kerberos/Hesiod.


    # Tradeoffs


    I have tried several other variations of this setup, including the one I would
    prefer — that of /bin/passwd doing all the prompting and the /etc/passwd program
    being utterly unprivileged.


    In my opinion, that would be the right way. Alas, it would require the /etc/passwd
    program to set itself to the proper UID and GID of the user, something which should
    be universally possible, but isn''t. So, I traded simplicity for greater portability.


    There is also a definite tradeoff in having /bin/passwd run as root with the username
    passed to it as a parameter. In some vendor''s systems, this enables a "special
    deal" intended for the root user: the checks against using a bad password are
    turned off. Needless to say, this is bad. However, one of the common UNIX conventions
    is never to do more than you have to. (See The UNIX Programming Environment by
    B. W. Kernighan and R. Pike, Prentice-Hall, NJ, 1984 for this and other bits of
    UNIX folklore.) As /etc/passwd executes whatever is found at /bin/passwd, you
    can install a better /bin/passwd to enforce whatever policy you prefer, without
    any effect on the rest of the programs.


    The last requirement is that your system will allow rlogin to unpassworded accounts,
    something that has been disabled in a few versions of UNIX. I haven''t made any
    tradeoffs here: I simply don''t use those machines as password servers; they''re
    fine as clients.'
  merge: -1
  img_proc: true
