- pgno: 202
  md: "# Adding Hosts to the UUCP config\n\nAdding a host to the UUCP network setup\
    \ is done in several steps. To keep things simple, only dial-in UUCP connections\
    \ are supported. People on the road are constantly on the move, so they cannot\
    \ be reached at a fixed phone number. The first step is to add the machine to\
    \ the list of well-known UUCP hosts. These are trusted hosts that are allowed\
    \ to dial-in and transfer data. The list of these machines is kept in a config\
    \ file called sys in the Taylor config directory. This config directory is usually\
    \ located in a subdirectory called conf in the home directory of the UUCP user.\
    \ This conf file is the equivalent of the Systems file in HDB.\n\n# Listing 16.1\
    \ (continued)\n\n```\n# Add UUCP host to uucp configuration\nsub adduucp\n{\n\
    \    local( $sysnam, $backup, $dummy );\n    local( $uid, $gid, $mode );\n   \
    \ # Back up older versions\n    $backupfile = \"$uucconf/\";\n    $backup = $uucconf\
    \ . \".o\";\n    open ORIGINAL, \"$backup\" || warn \"Cannot open $uucconf, $!\\\
    n\" && link $backup, $uucconf && return;\n    open NEW, \"$uucconf\" || warn \"\
    Cannot creat $uucconf, $!\\n\" && link $backup, $uucconf && return;\n    while(\
    \ <ORIGINAL > ) { print NEW; }\n    close ORIGINAL;\n    foreach $sysnam (keys\
    \ %add) {\n        print NEW <<EOF\n#START $sysnam\nsystem $sysnam\ntime Never\n\
    baud 38400\nport Direct\nphone *\ncalled-login uucp$sysnam\nsend-request yes\n\
    receive-request yes\ncalled-transfer yes\nremote-send /usr/spool/uucppublic /usr/spool/news\n\
    local-receive /usr/spool/uucppublic /usr/spool/news\nremote-receive /bin/rmail\
    \ /usr/local/lib/news/bin/rnews\nmyname lrnate\n#END $sysnam\nEOF\n    }\n   \
    \ $adduser( $sysnam );\n    close NEW;\n    # Set ownership and permissions\n\
    \    &setperm( $backup, $uucconf );\n}\n# adduucp\n```"
  merge: -1
  img_proc: true
- pgno: 203
  md: "# Listing 16.1 (continued)\n\n```\n# Notify root of successful action for UUCP\n\
    sub notifyuucp\n{\n    local( $action, @hostlist ) = @_;\n\n    open MAILTO, \"\
    |mail root\" || warn \"Cannot start mail program, $!\\n\" & return;\n    print\
    \ MAILTO <<EOF\nSubject: UUCP hosts $action.\n\nThe following UUCP hosts have\
    \ been $action :\n\n@hostlist\nEOF\n    ; # notifyuucp\n\n# Notify root of successful\
    \ action for LAN\nsub notifylan\n{\n    local( $action, @hostlist ) = @_;\n\n\
    \    open MAILTO, \"|mail root\" || warn \"Cannot start mail program, $!\\n\"\
    \ & return;\n    print MAILTO <<EOF\nSubject: LAN hosts $action.\n\nThe following\
    \ LAN hosts have been $action :\n\n@hostlist\nEOF\n    ; # notifylan\n\n# Delete\
    \ host from news config for LAN\nsub delnews lan\n{\n    # First the nntp access\n\
    \    &delnntp( );\n    # Secondly the sys file\n    &delnews( );\n} # delnews\
    \ lan\n\n# Add host to news config for LAN\nsub addnews lan\n{\n    # First the\
    \ nntp access\n    &addnntp( );\n    # Secondly the sys file\n    &addnews( );\n\
    } # addnews lan\n\n# Delete host from news and news config for UUCP\nsub deluucp\
    \ mailnews\n{\n    # First the batch params\n    &delbatch( );\n    # Secondly\
    \ the mail setup\n    &delmail( );\n    # Lastly the sys file\n    &delnews( );\n\
    } # deluucp mailnews\n```"
