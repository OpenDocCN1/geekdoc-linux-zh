- pgno: 164
  md: 'The getty modifications were not as straightforward as the telnet modifications.
    The challenge/response technique is excellent for cases in which a human operator
    is at the other end of the connection and can respond to the challenge. With SLIP
    connections, the automated software cannot conveniently respond to the challenge
    string. So, in keeping with our security objectives, it was necessary in this
    case to implement dialback as the alternative security method. This dialback scheme
    also has the benefit that the office ends up footing the telephone bill for the
    connection — an advantage especially in Europe where telephone calls are expensive.
    A special bit of coding was necessary to allow dialback SLIP.


    # SLIPping in


    When a SLIP user ID logs into the system, the SNK challenge/response scenario
    is bypassed. To accomplish this, SLIP user IDs are placed in a unique SNK class
    of users. Assigning user classes of users is a feature of the shadow password
    scheme used in versions of 4.3BSD Reno or later. The fifth field of the shadow
    password file is an arbitrary ASCII string that represents the class name. When
    the SLIP user ID is set up, the class field is given the special string that triggers
    this code in getty. The difference between the security of this administrative
    setup and that of the firewall machine setup described earlier is that if, for
    example, an administrator forgets to set the class field, SLIP doesn’t work. In
    other words, the system security is not compromised by a mistake. The user is
    only denied a service.


    Our dialback SLIP is relatively simple. The dialback code, sldial, was based on
    UUCP code. We used the UUCP dialing routines to handle most of the connection
    and modem details and wrote simple high-level code that looks to a file for mapping
    the SLIP user ID to SLIP parameters like dialback number, Maximum Transmission
    Unit (MTU) size, IP number, and so on. When the remote user initiates the call,
    the user will sign into the system using a specially allocated SLIP user ID. The
    login shell for the SLIP user ID is a simple wrapper, slcallback (Listing 13.5),
    which drops the current connection, resets the modem, and executes a dialing program,
    sldial (Listing 13.6). sldial then looks up the telephone number to callback,
    dials the modem and waits for a carrier. When the connection is established, sldial
    executes the sliplogin program, which looks up the session parameters from the
    /etc/slip.hosts file and establishes the SLIP session. A typical SLIP login is
    shown in the following example.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# Listing 13.5 s1callback.c—a login shell for the SLIP user ID that drops the\
    \ current connection, resets the modem, and executes the sldial program.\n\n```\n\
    #include <stdio.h>\n#include <signal.h>\n#include <strings.h>\n#include <sys/types.h>\n\
    #include <pwd.h>\n\n#define _PATH_SLDIAL  \"/usr/bin/sldial\"\n#define CB_DELAY\
    \      30\n\nmain()\n{\n    struct passwd *pw ent;\n    char *pgrm, *name, *slhost;\n\
    \n    pw ent=getpwid(getuid());\n    printf(\"You seem to be %s $(d)\\n\", pw\
    \ ent->pw_name, getuid());\n    printf(\"Calling back\\n\\n\\n\");\n    fflush(stdout);\n\
    \    signal(SIGHUP, SIG_IGN);\n    slhost=pwent->pw_name;\n\n    /* some code\
    \ to hang up the line */\n    if (fork())\n        exit(0);\n    sleep(CB_DELAY);\
    \  /* time for IBM modems to hangup */\n\n    /* just call sldial. It has everything\
    \ set up */\n    pgrm = _PATH_SLDIAL;\n    name = ((name = strchr(pgrm, '/'))\
    \ == NULL) ? pgrm : name + 1;\n\n    execl(pgrm, name, \"-f\", \"-d\", \"-S\"\
    , slhost, slhost, (char *) 0);\n\n    exit(0);\n}\n```"
