- pgno: 123
  md: "The sample output in Figure 11.6 illustrates how a telnet or, more appropriately,\
    \ an rlogin service could be configured on a dual-homed gateway. The major advantage\
    \ to such a scheme is that there are no user login accounts on the gateway. Another\
    \ advantage is that damage control in the event of an attack is much easier, because\
    \ if a user other than those permitted on the gateway is logged in, the login\
    \ becomes a noteworthy security event.\n\nIn fact, the script shown in Figure\
    \ 11.5 can be considered a proxy, as it accepts packets and sends them on to the\
    \ recipient machine. Most firewall software offers proxy agents that allow traffic\
    \ to pass through the firewall in either direction, so long as the user initiating\
    \ the traffic provides some level of identity authentication.\n\nAnother benefit\
    \ is that, because most dual-homed gateways will be operating on a computer system,\
    \ the operating system can be adapted to provide system and event logs. Such logs\
    \ make it easier to detect and track vandals and security breaches after a break-in,\
    \ though they may not help the administrator determine which other hosts were\
    \ breached from the gateway.\n\n# Figure 11.6 The sample output generated by the\
    \ login profile shown in Figure 11.5; this output illustrates how a telnet or\
    \ rlogin service could be configured on a dual-homed gateway.\n\n```\nWelcome\
    \ to the Network Access Gate\nConnected at : Thu Nov 03 14:10:13 EST 1994\nConnected\
    \ to : gateway-anywhere.CA\n\nPlease enter your REAL login name : chare\nPlease\
    \ enter the name of the machine you want to work on : oreo\nYour session to oreo\
    \ will now be started.\n running : rlogin oreo -8 -l chare\nPassword:\nLast successful\
    \ login for chare: Sat Oct 29 15:44:57 EDT 1994 on ttyP0\nLast unsuccessful login\
    \ for chare: Thu Oct 27 13:25:12 EDT 1994 on ttyP0\noreo\n\nyou have mail\nTERM\
    \ = (vt220)\nTerminal type is vt220\n Configuring NNTP Server\nerase = ^? stop\
    \ = ^C\n% $\n```"
