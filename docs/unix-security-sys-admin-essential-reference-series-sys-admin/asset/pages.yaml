    \ (the configuration file contains the list of authorized users and the commands\
    \ that they can execute). sudo next validates the user, by scanning through the\
    \ configuration file to find the user's logon name, and the command that was entered,\
    \ by scanning the list of commands that are valid for that user.\n\n# Listing\
