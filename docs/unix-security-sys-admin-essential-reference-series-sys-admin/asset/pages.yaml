- pgno: 152
  md: '# Chapter 13


    # Remote System Security:\

    A SecureNet and\

    SLIP Solution


    *Rob MacKinnon and Mark Dapoz*


    As computing becomes more portable, the need for people to connect back to a “home
    base” becomes more important. The system administrator must balance the convenience
    of remote access for the users against the dangers of compromised system integrity.
    Security must be at the forefront, so it becomes necessary to do more than just
    authorize remote use of the system: the remote user must be authenticated every
    time the system is accessed. This will guarantee that whoever is at the other
    end of the telephone is truly who they claim to be.


    At the Bergen Environmental Centre, we implemented two different security schemes
    to get the flexible remote access we needed. This chapter explains how we implemented
    a secured login scheme for the Centre. It describes how we modified the getty
    program and telnet daemon to include SecureNet authentication, how we administer
    the system, and some of the system’s benefits and shortcomings. It also describes
    how we implemented a dialback capability into SLIP so that system administrators
    could access and maintain the system from home.'
