- pgno: 200
  md: "As an added bonus, Taylor UUCP comes with a special program, called uuconv,\
    \ which enables you to convert HDB- or V2-style config files into Taylor files,\
    \ and vice versa. Because of its flexibility, I use Taylor format config files.\
    \ However, you can easily change the software to HDB format, either by using the\
    \ uuconv program or by changing the templates I use.\n\n# Listing 16.1 (continued)\n\
    \n```\n# Check the pending file for pending UUCP systems applicable for deletion\n\
    sub dopending\n{\n    local( $spendfile ) = @_; \n    local( $oldpendfile, $sysnam,\
    \ $retry, $total, @deleted );\n\n    $oldpendfile = $spendfile . \".old\";\n \
    \   link $spendfile, $oldpendfile;\n    unlink $spendfile;\n    $total = 0;\n\n\
    \    # There is a pending file, read it\n    open PENDING, \"$oldpendfile\" ||\
    \ warn \"Cannot open file $oldpendfile, $!\\n\" && return;\n    open NEWPENDING,\
    \ \">$spendfile\" || warn \"Cannot create file $spendfile, $!\\n\" && unlink $oldpendfile;\n\
    \    &link $oldpendfile, $spendfile & unlink $oldpendfile;\n\n    # Read host\
    \ names from pending file\n    while( <PENDING> ) {\n        ($sysnam, $retry)\
    \ = split /\\s/;\n        $retry = 0 if $retry == 0;\n        if( &deluucp( $sysnam\
    \ ) ) {\n            push @deleted, $sysnam;\n        }\n        else {\n    \
    \        if( &uucpbatch( $sysnam ) ) {\n                print NEWPENDING \"$sysnam\\\
    t$retry\\n\";\n                $total++;\n            }\n            else {\n\
    \                &deluucp( $sysnam );\n                push @deleted, $sysnam;\n\
    \            }\n        }\n    }\n    close PENDING;\n    close NEWPENDING;\n\
    \    unlink $oldpendfile;\n\n    unlink $spendfile if( $total == 0 );\n    &notifyuucp(\
    \ \"deleted\", @deleted );\n} # dopending\n```"
