- pgno: 193
  md: '# Network Security


    You should be aware of two broad problems in network security: snooping on the
    Net and trusting the wrong server. Snooping is a problem in any site that allows
    arbitrary users to collect packets. This system, as discussed so far, can allow
    someone to capture all the keystrokes of a user changing his or her password.
    This is as bad as someone snooping a telnet session and watching you change your
    password. Trusting the wrong server is a problem because the use of any of the
    r-commands requires root .rhosts files on various machines, and the use of NFS
    requires the export of sensitive files.


    Both problems, however, are eminently solvable. If you already have worked out
    what the .rhosts or exports implications are for your organization, you merely
    need to check to ensure that allowing rsh and NFS to support password update doesn’t
    break your trust rules. If you are small, at home, or behind a firewall, you probably
    don’t have a lot to worry about. And if you do need secure, untappable, and trusted
    channels to selected machines, you can use several programs to make encrypted
    connections to other machines: either ssh, the Secure SHell, or the new skip program
    of the IETF.


    # Listing 15.4 (continued)


    ```

    sayWriteError(name,errno) char *name; int errno; {


    (void) fprintf(stderr, "%s: Error writing and closing output

    file "%s". %s (errno %d), halting.\n",

    ProgName, name, (errno < sys_nerr)?

    sys_errlist[errno]: "Unknown error", errno);

    (void) fprintf(stderr, "%s: please inspect and remove remnant

    of "%s".\n", ProgName,name);

    return;

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Automating Your Network Maintenance


    Arthur Donkers


    In this rapidly changing era of online media and the Internet, it is vital to
    maintain a consistent and reliable network configuration. This chapter discusses
    a number of programs that a network administrator can use to automate the process
    of adding and removing users and systems from the network configuration databases.


    # Introduction


    Each time a network administrator adds a node to the network, a certain number
    of jobs come back. This is also true when adding users to your network environment,
    either as interactive or "fake" users for dial-in network access. As you probably
    have experienced when doing the same job over and over again, you tend to let
    things slip a bit and become somewhat careless (at least I do!). I''ve written
    a few Perl programs to help automate these jobs. When you want to add or remove
    a host or user, you just have to edit one or two files, and the software does
    the rest (almost) "automagically."'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Because of the variety in networks and dial-up access. I have split up the
    software into three parts. The first part takes care of the UUCP connections,
    which are used to access mail while away from the office. The second part is used
    for LAN (i.e., TCP/IP) access, the "normal" way of accessing the services on the
    network. The third part is common to the first two, and is used in both cases.
    Note that these programs are still experimental and should be adapted to your
    own specific environment and needs.


    # The Setup


    I used the following networking packages.


    +   - Taylor UUCP v1.06.1

    +   - Sendmail v8.6.12

    +   - CNews (Cleanup Release, April 1995)


    You can find these at a number of sites on the Internet — an archie or WAIS search
    will point you to the spot closest to you.


    I run this software on a SPARCstation with Solaris v2.4. The Taylor UUCP packages
    replace the stock Solaris UUCP, as does the Sendmail software. This machine does
    not run NIS or NIS+, as there are no NIS clients on the network. If you want to
    expand the software in this chapter to support NIS(+), please feel free to do
    so. If you send me these extensions, I can add them to the package.


    This SPARCstation is the central network server. It runs the stock named, the
    name resolver, and our mail and news server software. People can contact this
    machine over the LAN to retrieve their mail and read their Usenet news. For those
    who are connected through a UUCP dial-up link, it batches all the outgoing traffic
    into UUCP batches.


    Almost all network maintenance is done on this machine, so all software will run
    on this machine as well. If your setup differs from this one, you can split up
    the software and divide it over the different machines on your network.


    # The Basic Structure


    The basic structure of this software is simple. Adding and removing hosts is done
    by a cron job that runs every hour. Both the UUCP and LAN parts have their own
    cron job.


    The host to be added or removed is put in a special file that will be read by
    this cron job. This file is called /etc/maint/site.uucp for UUCP connections and
    /etc/maint/site.lan for LAN connections. After reading this file, the cron job
    deletes it, so the job will not run into it on the next round. The format for
    these two files is not exactly the same, but they are similar.'
  merge: -1
  img_proc: true
