- pgno: 191
  md: "# But Is It Secure?\n\nSecurity raises its ugly head in two areas here: security\
    \ on the server and security for the transport channel. On the server, you are\
    \ faced with providing an unpassworded privileged account or an unpassworded privileged\
    \ program. This sounds horrible, but in fact, the security of the combination\
    \ of programs is exactly as good as the security of /bin/passwd. The added programs\
    \ merely authenticate a person and then run /bin/passwd. It is easy enough to\
    \ read the program and convince yourself that it does no more than it claims.\
    \ It is harder to read /bin/passwd, for which you may or may not have the source.\n\
    \n```\noldUmask = umask((mode_t)0);\nif ((outFd = open(outFile,O_CREAT|O_EXCL\
    \ | O_WRONLY | O_TRUNC,\n    status.st_mode)) == ERR) {\n    switch (errno) {\n\
    \    case EEXIST:\n        rc = EXISTS;\n        sayExists(outFile);\n       \
    \ break;\n    default:\n        rc = REAERR;\n        sayOpenError(outFile,O_WRONLY,errno);\n\
    \        break;\n    }\n    (void) umask(oldUmask);\n    return rc;\n}\nwhile\
    \ ((nread = read(inFd,buf,sizeof(buf))) != 0) {\n    if (write(outFd,buf,nread)\
    \ != nread) {\n        rc = REAERR;\n        sayWriteError(outFile,errno);\n \
    \       break;\n    }\n}\n\n(void) umask(oldUmask);\n\n(void) close(inFd);\nif\
    \ (close(outFd) == ERR) {\n    sayWriteError(outFile,errno);\n    rc = REAERR;\n\
    }\nreturn 0;\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "There is one extra risk to SUID root programs. Because they usually start out\
    \ running from the user's account, they need to be very careful about setting\
    \ their $PATH, their shared library search path, and so on. In our case, we always\
    \ run out of an account under control of the systems administrator, so we merely\
    \ need to make the environment the same as root's. For that reason, passwd is\
    \ the account's shell, with a very minimal environment.\n\n```\n/*\n * error reporters\
    \ -- for open, existence and write errors.\n */\nsayExists(outFile) char *outFile;\
    \ {\n    (void) fprintf(stderr, \"%s: Error - file %s already exists,\\n\"\n \
    \                  \"    try again later.\\n\", ProgName,outFile);\n    return;\n\
    }\n\nsayOpenError(name,readWriteOrStat,errno) char *name;\n    int readWriteOrStat,\
    \ errno;\n    char *operation;\n{\n    switch (readWriteOrStat) {\n    case R_OK:\n\
    \        operation = \"stat input\";\n        break;\n    case O_RDONLY:\n   \
    \     operation = \"read input\";\n        break;\n    case O_WRONLY:\n      \
    \  operation = \"create output\";\n        break;\n    }\n    (void) fprintf(stderr,\
    \ \"%s: can't %s file \\\"%s\\\", %s (errno %d).\\n\"\n                   \" \
    \   halting.\\n\", ProgName, operation, name,\n                   (errno < sys_nerr)\
    \ ? sys_errlist[errno] :\n                   \"Unknown error\", errno);\n    return;\n\
    }\n```"
