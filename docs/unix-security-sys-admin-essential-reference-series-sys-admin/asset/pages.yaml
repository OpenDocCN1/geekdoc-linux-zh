- pgno: 101
  md: 'day is a digit between 0 and 6 representing the day of the week, starting with
    0 (Sunday). date and time are both four-digit numbers of the form mmdd and hhmm,
    with mandatory leading 0s. month ranges from 0 for January to 11 for December.
    For example, 0001-0231 indicates 1 January until 31 March. dd may be 00, indicating
    the first or last day of the month, depending on whether it appears in a start
    or end context. For example, 0700-1000 indicates the first day of August to the
    last day of November.


    time is a 24-hour clock always preceded by a colon. Entries without a leading
    exclamation mark allow access during that time; a leading exclamation mark denies
    access. Several values may be specified, delimited by commas. The sample entry
    in Figure 9.2 allows login on Monday to Friday from 7a.m. till 7p.m., on Saturdays
    from 8a.m. till 2p.m., and no login on Sundays.


    login timeout Timeout in seconds for user to enter the password.


    maxlogins Number of simultaneous logins per user. This includes su and telnet
    sessions.


    shells List of valid command shells.


    The second section of login.cfg (Figure 9.2) is used if you call an alternate
    login program. The third section has only one stanza, which applies to all users
    and must be named usw. The file /etc/security/user (Figure 9.3) contains an entry
    for each user, and the default stanza applies to all users. Password rules, login
    times, password dictionaries, and password extension rules can be specified on
    a per-user basis. There are many more options, such as setting a user''s initial
    umask and remote login permission [6].


    The attributes displayed in Figure 9.3 are listed in the following text.


    ttys List of valid terminals to login.


    auth1 Primary authorization method. Values are SYSTEM for default password verification,
    NONE for no checking, and token;name for an alternate login program, where token
    is the key when searching in the second part of /etc/security/login.cfg and name
    is the userid to authenticate.


    auth2 Secondary authorization method. Values are the same as for auth1.


    SYSTEM Describes the login requirements, which may consist of multiple or alternate
    methods. Values are NONE for no password checking, files for local authentication
    only, and compat for local and Network Information System (NIS) authentication.'
