- pgno: 168
  md: "# Administering the SLIP Users\n\nSetting up a SLIP user requires several administrative\
    \ steps. Once the setup is completed, though, the user will be able to connect\
    \ to the SLIP server and have the server call the user back at a predetermined\
    \ number. The user can then use all the services available on the Internet and\
    \ the LAN.\n\nThe first step is to create the user ID under which the user will\
    \ login to the SLIP server and assign a password to the new user ID. The actual\
    \ name of the user ID is not important, although by convention all SLIP login\
    \ IDs start with a capital S followed by the user's initials (e.g., Sm d). The\
    \ user ID must have /usr/sbin/slcallback as the login shell and must also have\
    \ the class remote to login without needing SecureNet authentication. The UID\
    \ and GID are not important, except that the UID must be unique across all SLIP\
    \ logins. A sample /etc/passwd entry for a SLIP user would look as follows.\n\n\
    ```\nSrbm::500:9999:remote:0:0:Slip Callback (Rob Mackinnon): /tmp:/usr/sbin/slcallback\n\
    ```\n\n# Listing 13.6 (continued)\n\n```\n/* fork early so that the lockfile gets\
    \ our pid */\nif (iff lag && fork() > 0)\n    exit(0);\n\nfd = conn(Rmtname);\n\
    if (fd < 0) {\n    delock(Rmtname);\n    fprintf(stderr, \"%s: FAILED: %s\\n\"\
    , Progname, UERROR TEXT);\n    cleanup(101);\n}\n/* slip login expects the tty\
    \ on stdin */\n(void)dup2(fd, 0);\n\n/* XXX: pick between slip login or pppd */\n\
    pgm = *Progname == 's' ? _PATH_SLIPLOGIN : _PATH_PPPD;\nname = ((name = strchr(pgm,\
    \ '/')) != NULL) ? pgm : name + 1;\nexec l(pgmname, name, slhost, (char *) 0);\n\
    exit (1);\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "The next step is to setup the UUCP Systems file so that slip login can find\
    \ the appropriate telephone numbers and chat scripts. Edit the file /etc/uucp/Systems.slip\
    \ and add lines similar to the following, replacing the user ID, phone number,\
    \ and chat script as appropriate. For a PC-based user calling the system, since\
    \ a PC can’t allow logins into itself, leave the chat script off and hope that\
    \ the PC on the other end is really who you think it is. If there’s a UNIX machine\
    \ on the other end, attempt to log into the machine with the special SLIP ID,\
    \ which they must create. A sample entry follows.\n\n```\n# Slip line entries\
    \ for callback\n# Rob MacKinnon (home, unix)\nSrbm Any D_slip1 9600 55544618 in:\\\
    r\\d-in: Stoppe word: foobar\nSrbm Any D_slip2 9600 55544618 in:\\r\\d-in: Stoppe\
    \ word: foobar\n```\n\n# Listing 13.6 (continued)\n\n```\nvoid\ncleanup(code)\n\
    int code;\n{\n    CDEBU G4,\"call cleanup(%d)\\r\\n\", code);\n    /* XXX: might\
    \ want to do more here ?? */\n    rmlock(char*) NULL); /* remove lock files */\n\
    \    exit(code);\n}\n/*\n * produce an assert error message input:\n * s1 - string\
    \ 1\n * s2 - string 2\n * i1 - integer 1 (usually errno)\n * file - __FILE__ of\
    \ calling module\n * line - __LINE__ of calling module\n */\nvoid\nassert(s1,\
    \ s2, i1, file, line)\nchar *s1, *s2, *file;\n\nchar buf[80];\n\nsprintf(buf1,\
    \ \"%s %s: %d\\n\", s1, s2);\nVERBOSE(buf1,i1);\n}\nvoid logent()  /* so we can\
    \ load ulockf() */\n```"
  merge: -1
  img_proc: true
- pgno: 170
  md: 'There are as many entries in Systems.slip for a given user ID as there are
    modem lines available. This allows sl dial to try each line in turn in case some
    of the lines are in use.


    An IP address is assigned for the SLIP connection. By convention, it is assigned
    a name of the form slipNNN (where NNN is replaced by the user’s initials). Once
    the name and IP address have been chosen, the domain nameserver database is updated
    with the information. The file /etc/slip.hosts provides slip login with the ability
    to map a SLIP user ID to a given SLIP IP address, subnet mask, header compression
    scheme, and MTU size for the SLIP connection. An example entry would be as follows.


    ```

    # login local-addr remote-addr mask mtu opt1 opt2

    #

    #                               (normal,

    #                                compress,

    #                                nocmp)

    Srbm 129.177.21.15 129.177.21.131 0xffffffff 1500 normal

    ```


    # Conclusion


    The setup we describe has been in operation for about a year. Most users feel
    that the inconvenience of having to obtain the SNK before traveling and having
    to answer the challenge at login time is far outweighed by the convenience of
    being able to access the systems from pretty well anywhere in the world. We, as
    administrators, appreciate the advantages of dialback SLIP and the ability to
    access the systems at work from home.'
  merge: -1
  img_proc: true
