- pgno: 141
  md: '# Configuring the Firewall Rules


    Again, the kernel’s firewall supports three distinct groups of packet filtering
    rules: input, output, and forward. Each of these groups has its own set of firewall
    rules and, thus, needs to be configured appropriately.


    The rules for the input group describe which traffic is allowed into the firewall.
    These rules apply to all network interfaces on the firewall, not just the Internet
    interface. Each rule gives a combination of source address, destination address,
    and interface address. When an IP packet matches a rule, it is processed according
    to the action in the rule.


    The rules for the output group specify which packets may leave the firewall. These
    rules resemble the input rules; it is just the direction of the traffic that differs.


    # Listing 12.2 The ipfwadm options.


    ```

    ipfwadm 2.0beta1, 1996/02/10


    Usage: /sbin/ipfwadm -A command [options] {accounting}

    /sbin/ipfwadm -F command [options] {forwarding firewall}

    /sbin/ipfwadm -I command [options] {input firewall}

    /sbin/ipfwadm -O command [options] {output firewall}

    /sbin/ipfwadm -M -i [options] {masquerading entries}

    /sbin/ipfwadm -h {print this help information}


    Commands:

    -i [policy] insert rule (no policy for accounting rules)

    -a [policy] append rule (no policy for accounting rules)

    -d [policy] delete rule (no policy for accounting rules)

    -l list all rules of this category

    -r reset packet/byte counters of all rules of this category

    -f remove all rules of this category

    -p policy change default policy (accept/masquerade/deny/reject)

    -c check acceptance of IP packet


    Options:

    -p protocol (either tcp, udp, icmp, or all)

    -S address/mask [port ...] source specification

    -D address/mask [port ...] destination specification

    -V address interface address

    -W name interface name

    -b bidirectional match

    -e extended output mode

    -k match TCP packets with ACK set

    -n numeric output of addresses and ports

    -o turn on kernel logging for matching packets

    -t and xor and/or masks for TOS field

    -v verbose mode

    -x expand numbers (display exact values)

    -y match TCP packets with SYN set and ACK cleared

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The rules for the forward group specify which packets may flow from one interface
    to another. These rules really make the firewall a firewall, either allowing or
    blocking traffic. You can also specify in the forwarding group whether or not
    a packet should be masqueraded. The forwarding rules are the only place where
    masquerading can be configured. The other two groups only concern the traffic
    on the physical interface.


    These rules are constructed using various options of the ipfwadm command (Listing
    12.2). It is very important to become familiar with these options. Incorrect rules
    may create subtle and not so subtle backdoors through your firewall.


    Here are the most important options. The first option states the group for which
    the rule is intended. The -I is for the input group, the -O for the output group,
    and the -F for the forwarding group. You can then specify whether a rule should
    be added (-a), deleted (-d), or inserted (-i). The parameter of this option is
    the policy for the rule. This policy can be accept (accept the packet), reject
    (reject the packet), or deny (ignore the packet).


    Neither reject nor deny allows matching packets in, but there is a subtle, yet
    important difference. A packet that is rejected will result in an ICMP message
    transmission to the sender of the original packet. The user originating the rejected
    message will get some sort of error message stating "connection refused." This
    error message gives potential intruders some information. It tells them that some
    host (the one sending the ICMP messages) "owns" the refused address; thus, the
    intruder now knows that perhaps some other attempt will succeed at that host.


    A denied packet is silently ignored; thus, the intruder cannot tell whether there
    is no host responding or the packets are just tossed away. My advice is to always
    use a deny policy instead of a reject policy for your Internet connection. Connections
    on the local net may be rejected, so the local user will know they''ve been refused.


    Using the -D and -S options of the ipfwadm command, you can specify the source
    and destination address. You can even mask bits from the address to specify a
    group of hosts belonging to the same subnet. This will save you a lot of typing
    and speed up the matching process in the firewall. Note that 0.0.0.0 matches all
    IP addresses (i.e., the world).


    The next two important options are -k and -y. These two specify whether the ACK
    and SYNC flags in the TCP header should be set. (For more information on headers,
    see the sidebar "TCP/IP Headers.") You can use these options to block anyone from
    initiating a connection to your firewall. Although blocking SYNC packets originating
    in the Internet is generally a good idea, it does cause problems with SMTP and
    FTP protocols, as detailed later.


    The last important option is the -p option. It specifies the default policy. The
    default policy is activated when no rule matches. This rule is a safety net of
    sorts: it closes all the unspecified possibilities in your packet filtering. For
    my firewall, I have set the default policy for all groups to deny, so all unknown
    packets are silently ignored. A few examples of these rules are shown in Listing
    12.3.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Figure 12.3 A simplified description of the TCP protocol.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_143_0.png)


    # TCP/IP Headers


    Each packet transmitted across the network has a number of headers. The first
    is the header determined by the physical transport medium. In this case, that
    is Ethernet. These headers are not relevant to the firewall.


    The second set of headers are the IP headers. The IP header contains the source
    and destination IP address. The firewall code will check these addresses against
    the specified rules. Besides these addresses, the header also has a TOS (Type
    Of Service) field, which describes the kind of traffic in the packet. In ftp data
    traffic, for example, this field will contain the hexadecimal number 8. The TOS
    field is not used in all packets.


    A UDP header does not contain that much information; however, it does specify
    a source and destination port number. These port numbers can be useful when you
    want to write rules that allow only certain UDP services.


    Last but not least, the TCP header has many fields, only a few of which are of
    interest. Just like the UDP header, the TCP header contains a source and destination
    port number. It also contains a number of bitfields that are used by the TCP protocol
    to make a TCP connection reliable. These bitfields are used to indicate the state
    of a packet. Figure 12.3 is a simplified description of the TCP protocol. The
    SYN and ACK denote when the SYN and ACK fields in the TCP header are set.


    You can specify in your firewall rules whether the SYN and ACK fields should be
    set or cleared. Thus, you can keep anyone on the Internet from initiating a connection
    to your firewall by stating that the SYN bit may not be set on any packet that
    reaches your firewall via the Internet interface. Refusing all SYN packets, however,
    can cause problems with SMTP and ftp services. (See the section "Special Input
    Rules" in the main text for more information on problems with refusing SYN packets.)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Special Input Rules


    A normal firewall will not allow a client on the Internet to initiate a connection.
    All input rules related to the Internet interface have the -k option set (ACK
    flag must be set in TCP header). This causes two problems, however. The first
    problem is that if your firewall will be running an SMTP daemon, refusing all
    SYNC packets will cause the SMTP daemon to hang. If a client on the Internet wants
    to send you mail via SMTP, the client opens port 25 on your firewall. You can
    bypass this problem by specifying a special input rule for the SMTP port. The
    SMTP rule should specify that anybody on the Internet may open a connection to
    port 25, and only port 25. This rule may look like the following example.


    ```

    # Add input rule for Internet -> me for mail (stops at firewall)

    ipfwadm -I -a accept -P tcp -S 0.0.0.0/0 -D 194.109.13.150 25

    ```


    This connection will stop at the firewall, so it does not need an accompanying
    output or forwarding rule.


    # Listing 12.3 Examples of firewall packet filtering rules.


    ```

    # Add output rule for local -> Internet

    ipfwadm -O -a accept -P tcp -S 194.109.13.150 -D 0.0.0.0/0

    ```


    This rule defines an output rule for the Internet interface. It states that a
    packet for any destination on the Internet is allowed out. This rule applies only
    to packets for the TCP protocol.


    ```

    # Add input rules for cli# Add output rule for local -> Internet

    ipfwadm -O -a accept -P tcp -S 194.109.13.150 -D 0.0.0.0/0

    ```


    This rule defines an output rule for the Internet interface. It states that a
    packet for any destination on the Internet is allowed out. This rule applies only
    to packets for the TCP protocol.


    ```

    # Add input rules for clients -> Internet (will masquerade)

    ipfwadm -I -a accept -P tcp -V 193.78.174.33 -S 193.78.174.34 -D 0.0.0.0/0

    ipfwadm -I -a accept -P tcp -V 193.78.174.33 -S 193.78.174.35 -D 0.0.0.0/0

    ```


    This rule describes packets sent by the hosts on the local net to destinations
    on the Internet. These packets are going to be masqueraded by the forwarding rules.
    As you can see, these packets must be received on the trusted interface 193.78.174.33
    (-V option).


    The final example shows you a masquerading rule.


    ```

    # Add forwarding rules for clients

    ipfwadm -F -a masquerade -P tcp -S 193.78.174.34 -D 0.0.0.0/0

    ipfwadm -F -a masquerade -P tcp -S 193.78.174.35 -D 0.0.0.0/0

    ```


    As you can see, the policy here is masquerade, so these packets will be masqueraded.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The second problem with refusing SYNC packets is created by ftp (the file transfer
    protocol). When transferring files, ftp opens two connections. The first connection
    is a control channel, which ftp uses to send commands such as change directory,
    obtain file listings, etc. This control connection is initiated by the machine
    on the local net and, thus, follows the normal flow (output directed traffic).


    However, when the ftp client retrieves a directory or file, ftp uses its second
    connection, the data connection for the transfer. The client sends the server
    a port command that tells the server which port on the client should be opened
    for transferring the data. Thus, the data connection is initiated in reverse (from
    outside into the local net). With all SYNC packets denied, the firewall would
    deny such a connection, blocking the data transfer.


    The general solution is to define a special set of rules for this ftp data connection.
    Because the server also uses port 20 as its end for the data connection, you can
    enable data transfer by including a rule that accepts connections initiated on
    that port number. The newer Linux kernels now fully support these port-specific
    rules. The pertinent rules involved for this are shown in Listing 12.4.


    Even without this rule, some ftp clients may be able to successfully transfer
    data from your host. Some ftp clients know a "passive" mode, in which the client
    asks the ftp server to create a port for transferring data. The resulting transfer
    is accomplished with ACK packets, avoiding the SYNC restrictions.


    # Listing 12.4 Examples of firewall packet filtering rules for ftp.


    ```

    # Add input rule for Internet -> me for FTP data connection (masqueraded)

    ipfwadm -I -a accept -P tcp -S 0.0.0.0/0 20 -D 194.109.13.150 1024:65535


    # Add output rules for FTP data connection

    ipfwadm -O -a accept -P tcp -S 0.0.0.0/0 20 -D 193.78.174.34 1024:65535

    ipfwadm -O -a accept -P tcp -S 0.0.0.0/0 20 -D 193.78.174.35 1024:65535

    ```


    The first rule specifies the incoming packets on the Internet interface of the
    firewall. The other rules specify the outgoing packets to the hosts on the local
    net. Remember that these packets are forwarded through the firewall using the
    (masquerading) firewall rules.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# The Nameserver


    All of these IP mechanisms need access to a nameserver to resolve names for various
    destination machines. Running the nameserver on the firewall is not a good idea.
    First, it''s always good practice to limit the number of daemons on the firewall;
    fewer daemons translate into fewer opportunities for a would-be intruder. Second,
    the nameserver mapping tables contain information on the structure of your local
    network. So, you need a nameserver, but it needs to run on some machine other
    than the firewall.


    The simple solution is to host the nameserver on one of the machines in your local
    network. This local nameserver should be configured to resolve all name references
    involving local machines and to forward requests it cannot resolve to some nameserver
    on the Internet. The firewall will require special rules to properly handle these
    requests directed to the external nameserver [Listing 12.5].


    All nameserver traffic is based on the UDP protocol. The firewall itself may need
    to contact the nameserver; this is described in the rules nameserver > me and
    me > nameserver. The other rules are used for name queries from the nameserver
    to a machine on the Internet and back. Wherever possible, the traffic is limited
    to port 53, the nameserver port.


    # Listing 12.5 Example firewall rules to forward all unresolved requests from
    the local nameserver host to an Internet nameserver.


    ```

    # Add input rule for nameserver -> me

    ipfwadm -I -a accept -P udp -V 193.78.174.33 -S 193.78.174.34 53 -D 193.78.174.33


    # Add input rule for Internet -> nameserver (masqueraded)

    ipfwadm -I -a accept -P udp -S 0.0.0.0/0 53 -D 194.109.13.150


    # Add input rule for nameserver -> Internet (will masquerade)

    ipfwadm -I -a accept -P udp -V 193.78.174.33 -S 193.78.174.34 53 -D 0.0.0.0/0
    53


    # Add forwarding rules for nameserver

    ipfwadm -F -a masquerade -P udp -V 193.78.174.33 -S 193.78.174.34 53 -D 0.0.0.0/0
    53


    # Add output rule for me -> nameserver

    ipfwadm -O -a accept -P udp -V $TRUSTIF -S 193.78.174.33 -D 193.78.174.34 53


    # Add output rule for nameserver -> Internet

    ipfwadm -O -a accept -P udp -S 194.109.13.150 -D 0.0.0.0/0 53


    # Add output rule for Internet -> nameserver (masqueraded)

    ipfwadm -O -a accept -P udp -V 193.78.174.33 -S 0.0.0.0/0 53 -D 193.78.174.34
    53

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Revising the Startup Process


    Once you have the kernel and the associated utilities installed, you can start
    modifying the kernel startup files. If you used Slackware v3.0 to build your Linux
    system, you need to change a number of configuration files. Most of these files
    are located in the /etc/rc.d directory. The files in this directory are executed
    when the system changes its running state (e.g., from single user to multiuser
    or back).


    First, make certain that only the necessary daemons are started. The default configuration
    will also start lpd and others, but you do not need those on a firewall. You also
    do not need inetd, as you do not want to offer services like telnet and ftp on
    the firewall. (See the sidebar "No telnet Please" for more information on inetd.)


    Last but not least, add startup commands to set the firewall rules automatically
    when booting. This ensures that your system won’t come up in a "totally open"
    mode after a power outage.


    # Listing 12.6 add.put — part of the source for the rc.internet script and its
    associated files.


    ```

    #!/bin/sh


    IPFW="/sbin/ipfwadm"


    # Assume eth0 is our trusted interface

    TRUSTIF=`/sbin/ifconfig eth0|sed -n -e "s/^\tinet addr:\([0-9]*\.[0-9]*\.[0-9]*\.[0-9]*\).*/\1/p"`


    if [ -x $IPFW ]; then

    # Add input rule for nameserver -> me

    $IPFW -i accept -P udp -V $TRUSTIF -S 193.78.174.34 53 -D 193.78.174.33

    # Add input rule for Internet -> nameserver (masqueraded)

    $IPFW -i accept -P udp -S 0.0.0.0/0 53 -D 194.109.13.150

    # Add input rule for nameserver -> Internet (will masquerade)

    $IPFW -i accept -P udp -V $TRUSTIF -S 193.78.174.34 53 -D 0.0.0.0/0 53

    # Add input rule for Internet -> me for mail (stops at firewall)

    $IPFW -i accept -P tcp -S 0.0.0.0/0 25 -D 194.109.13.150 25

    # Add input rule for Internet -> me for FTP data connection (masqueraded)

    $IPFW -i accept -P tcp -S 0.0.0.0/0 20 -D 194.109.13.150 1024:65535

    # Add input rule for Internet -> local (masqueraded)

    $IPFW -i accept -P tcp -k -S 0.0.0.0/0 -D 194.109.13.150

    # Add input rules for clients -> Internet (will masquerade)

    $IPFW -i accept -P tcp -V $TRUSTIF -S 193.78.174.34 -D 0.0.0.0/0

    $IPFW -i accept -P tcp -V $TRUSTIF -S 193.78.174.35 -D 0.0.0.0/0

    fi

    ```'
