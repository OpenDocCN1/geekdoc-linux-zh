- pgno: 172
  md: '# Chapter 14


    # Simple Security:

    A GroupWise/SMTP Connection


    *Jonathan Feldman*


    Getting Internet e-mail to your LAN in a secure way does not necessarily imply
    the existence of a TCP/IP firewall. In fact, if you run another protocol on your
    LAN, such as IPX/SPX or VINES, it is possible to use a translating gateway as
    a “mail courier” so that only mail protocols are dispatched. This effectively
    leaves the rest of your network secure—even if you use TCP/IP on your LAN.


    Imagine two couriers exchanging top-secret packages. Ideally, the manager of the
    courier agency, you would want these couriers to speak different languages, so
    that all they could do is exchange packages and not communicate in any other way.


    This method can be a good one if you don’t have funds for a firewall, the expertise
    to build one yourself, or even if you’re suspicious of the complexity of a firewall.
    As Chesnick and Belovitz observe in Firewalls and Internet Security (Addison Wesley,
    1994): “All programs are buggy. . . . Large programs are even buggier than their
    size would indicate. . . . A security program has security bugs. . . . Exposed
    machines should run as few programs as possible; the ones that are run should
    be as small [and simple] as possible.”'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Using a small and simple application gateway is certainly a much better choice
    than plugging your mission-critical TCP/IP network into the Internet. For example,
    our outside-world Web server has no business being on our LAN; instead, it is
    on our Internet segment, and it will stay there.


    We use Novell’s GroupWise (formerly WordPerfect Office’s) SMTP (Simple Mail Transfer
    Protocol) Gateway product as our mail gateway. It is configurable to run SPX/IPX
    on one interface and TCP/IP on another, effectively rendering routing of packets
    between the internal and external networks impossible. The internal daemon software
    routes TCP/IP’s socket 25 (mail) through its internal parser, and out the other
    end as its own proprietary format. The GroupWise product works similarly to other
    SMTP gateways (Figure 14.1).


    Again, only mail is handled by this gateway. To do anything else, you have to
    get another type of gateway or install a firewall. (Other types of gateways, such
    as NOV*IX for NetWare, handle a similar procedure for web clients, etc.) The nice
    thing about this setup is that even if the gateway is compromised through a software
    bug or malicious design, the only likely danger is bogus mail — annoying but hardly
    threatening.


    **Figure 14.1  A SMTP gateway runs TCP/IP and SPX/IPX on separate interfaces to
    handle mail.**


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Implementation\n\nWe purchased a copy of the WordPerfect Office SMTP Gateway,\
    \ which needed to be installed on a standalone PC. We salvaged an IBM PS/2 80386\
    \ running at 16MHz, with 4Mb of memory. To prepare it for the installation, we\
    \ installed the requisite two network cards: one Pronet 10 card (a proprietary\
    \ 10Mb token-ring technology) and one IBM 16Mb Token-Ring card. No hard drive\
    \ was required because we planned to run most of the drivers, daemons, and programs\
    \ off the Novell fileserver.\n\nThe TCP/IP software we used with the gateway was\
    \ Novell’s LANWorkPlace, which runs under Novell’s ODI drivers. Because the Pronet\
    \ 10 card was using a .obj (linked) version of IPX, we were a little leery of\
    \ using it with the ODI drivers, but everything worked out fine. We used Novell’s\
    \ NETX to bootstrap the workstation, and loaded everything else (including the\
    \ ODI drivers and the TCP/IP) from the fileserver (Figure 14.2).\n\nWe structured\
    \ the NetWare setup as follows. The machine loads IPX and NETX from the floppy\
    \ drive, and logs into the network. No password is required, so unattended reboots\
    \ are possible. We used SYSCON to set a station restriction for the login, effectively\
    \ limiting the no-password login to the SMTP gateway’s MAC address and IPX network\
    \ number. (Don’t use the MAC address of the TCP/IP card!) Additionally, we used\
    \ SYSCON to add the login to the group MACHINES, which is typically used in our\
    \ local login scripts to avoid “Press Any Key To Continue” prompts, and so forth.\
    \ The only trustee rights given were access to the WordPerfect Office Domain directory\
    \ (e.g., F:\\WPDOMAIN) and the login’s home directory (which we mapped as the\
    \ root of the H: drive).\n\n```\nCONFIG.SYS\n  device=himem.sys\n  device=emm386.exe\
    \ ram\n  files=80\n  buffers=40\n  dos=high,umb\n\nAUTOEXEC.BAT:\n  prompt $p$g\n\
    \  rem gen rd IPX via Pronet-10:\n  ipx\n  netx ps=chat\n  f:\n  login chat/smtp\n\
    ```\n\n![](img/113bcc15fc2db8f0f40ac5d1e755f41c_174_0.png)"
  merge: -1
  img_proc: true
