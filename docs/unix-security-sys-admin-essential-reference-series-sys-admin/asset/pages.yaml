- pgno: 10
  md: '# Assorted Security Tips for UNIX


    Arthur Donkers


    This chapter is a collection of tips and tricks to secure your internal network.
    By using the standard supplied tools and configuring your system with a bit of
    common sense, you should be able to prevent about 80 percent of security-related
    problems.


    Why should you secure your internal network? Simply because most break-ins occur
    from another machine on your local network. These intrusions might be accidental
    or malicious, but that does not matter. They might be done by your own staff or
    people you hired for a project, but that does not matter either. These break-ins
    happen, and you must prevent them. Because there are so many types of internal
    networks, I cannot cover them all in this chapter. I will concentrate on TCP/IP-based
    networks built of UNIX computers connected directly via the LAN or via a router
    and a WAN connection.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Tip 1: Know Your Network


    This may seem obvious, but to make your network secure, you must know how it works,
    what is connected to what, and who the users are.


    Typically, you would divide the machines connected to your network into two groups,
    the servers and the clients. This division makes sense; however, it does not always
    depict the real situation. A client machine may double as a sort of server machine,
    in that it has extra privileges with one or more servers. Using these privileges,
    it could mount a special NFS volume with sensitive data on it.


    Most modern networks today contain not only UNIX machines, but also PCs. People
    can install freely-available UNIX implementations, like Linux and FreeBSD, onto
    their local PCs. They would then have access to a full-blown UNIX machine, including
    root access. Root access allows them to use all kinds of tools available on the
    Internet to roam your network looking for information. For instance, they might
    use a program like tcpdump to monitor all packets traveling on the wire. Or they
    might use a number of NIS (formerly known as Yellow Pages) snoopers that can copy
    your company password file from the server. Once they have access to this password
    file, they can use a program like crack to “guess” your passwords. You might be
    surprised at how many passwords can be found (approximately 30 percent) in a reasonably
    short time.


    The best strategy is to try to protect yourself from this sort of attack, rather
    than to forbid it. One way to protect yourself is to keep up with the dynamics
    of your network. Larger networks in particular have a tendency to grow and shrink
    and constantly change. It is important that once you have established a secure
    environment, you keep it safe.


    # Tip 2: Keep Close Watch on Your Network


    Once you have a grasp of your network, you should begin to get an idea of what
    a “normal” day will look like on your network. This means you need a sort of traffic
    profile of your network. Some machines will generate more traffic than others,
    and over time you can build this type of profile for each system.


    You can build these profiles using a packet sniffer or a program like tcpdump
    that monitors your network traffic. A larger network should keep a network monitor
    running permanently because some kinds of attacks and break-ins generate traffic
    that will not fit into your normal profile. An IP spoofing attack, for instance,
    will generate a lot of SYN packets on your network to flood a machine (a so-called
    SYN flood). If you are able to detect this while it is actually happening, you
    might keep the break-in from succeeding.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Building a traffic profile might also help you in troubleshooting problems
    on your network. It is easier to see which hosts are working within their operation
    parameters and which are exhibiting irrational behavior. Another benefit of these
    profiles is that you can better handle growth. You can more easily estimate when
    all available bandwidth will be used up, and you can thus take adequate measures
    to prevent your network from clogging up.


    # Tip 3: Decide What You Want to Protect


    After the basic structure and monitoring of Tips 1 and 2 are in place, the first
    question that arises is one of risk assessment. What do you protect and how strongly
    do you want to protect it? You can use the information you gathered for Tip 1
    to help make this decision. That information will show you which machines contain
    sensitive data and which systems have access to these data. You’ll need to protect
    these systems if you want to protect your data.


    Securing all machines on your network may seem like a good idea, but on a large
    network (or at least one with more than 100 connected machines), this might turn
    into a real challenge to manage. So you will have to find a workable balance between
    these two strategies.


    # Tip 4: Establish a Workable Security Policy


    Implementing a workable security policy is probably the biggest challenge of all.
    It is not done by simply applying technical gadgets and widgets alone. A complete
    security solution involves your network topology, your network administration,
    and most importantly, your users.


    Before you start applying technical solutions, you must decide what kind of security
    policy you will adopt. There are basically two kinds, each with a different approach.


    The first one is based on the following statement: "That which is not explicitly
    forbidden is allowed." This means that all users are allowed to do everything
    they want, unless some service, system, or user is explicitly prohibited. Your
    first reaction might be to discard this policy as being unsafe. This is true for
    some services, but certainly not for all. An example of this is the SMTP service,
    which is used for e-mail. Everybody is allowed to send e-mail (i.e., make a connection
    to the SMTP service on the mail server); only the people who tend to send mail
    bombs are prohibited. To save yourself much unnecessary work, you allow everybody
    by default to send e-mail.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The second policy (as you probably guessed) is based on the statement: “That
    which is not explicitly allowed is forbidden.” Nobody can use the service unless
    he or she has reached some special level of clearance and is explicitly allowed
    in. An example of this might be the telnet service on the server of the financial
    department. Everybody is denied access to the telnet port of this machine unless
    he or she has a special clearance and works from a trusted system. To implement
    this policy, the system must provide you with appropriate tools that allow you
    to select a “deny by default” strategy. This minimizes the administrative work
    and makes for a much more secure situation. Most standard tools supplied with
    UNIX systems do not allow for such a policy. They either allow everyone access
    (service enabled) or deny everyone access (service disabled).


    Note that I refer to the tools and services that come with the basic installation
    of UNIX. There are good exceptions to this rule, and in other cases, you might
    replace these with more subtle versions you can find on the Internet.


    You can use a mix of these two policies on the local network. As shown in the
    previous examples, some services are better served by a “default allowed” policy
    and others by a “default forbidden” policy. The most important thing is to think
    before you act and use a checklist to implement changes.


    With any policy, you must know which hosts you trust and which you do not. Trusted
    hosts have special status and are allowed more privileges than untrusted hosts.
    Furthermore, the host address is, in most cases, the “finest” level of discrimination
    you can apply. To balance security with the cost of administration, making a difference
    at the address level may be the best you can do. Sometimes this is not enough.
    Some users on a trusted host may need more privileges than other users. It is
    best to move these users to a new machine (or move the unprivileged users to another
    machine). It can be very difficult to enforce a different security level for different
    users on the same machine at the network level. Furthermore, there is no reliable
    way to establish the identity of a user beyond reasonable doubt. It is fairly
    easy to pretend to be another user, so user-based security is not very effective.


    # Tip 5: Know Thy TCP/IP


    To be able to implement, or at least appreciate, a security solution, you must
    know a few things about the TCP/IP protocol. A TCP/IP protocol stack contains
    a number of layers (protocols). Figure 1.1 shows the structure of the TCP/IP stack.
    The basic layer is called IP. It handles getting a packet from here to there.
    This also the layer that uses the IP addresses for finding a destination. Very
    few applications talk directly to this IP layer.


    On top of the IP layer are a number of different protocols. Each of these protocols
    offers a programming interface to the application that wants to use it. In Figure
    1.1, the height of the protocol bar indicates the level of functionality that
    is offered to the application.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The first of these protocols is the ICMP protocol. It is mainly used for managing
    and controlling the IP layer. With it, you can force routing options, declare
    a destination unreachable, etc. The most widely used functions, however, are echo
    request and echo reply. These two functions are used by the ping program to see
    if you can reach a certain host on your (or somebody else’s) network.


    In general, this is a somewhat dangerous protocol because it directly interacts
    with the IP layer of your machine. If possible, you should only enable the echo
    request and echo reply functions and disable the others. If this is not possible,
    you should enable it so you can use the ping command to verify the reachability
    of your hosts.


    The second protocol is UDP. This is a datagram protocol, which means it does not
    have to establish a connection to another machine before sending data. The UDP
    protocol takes the data an application provides, packs it into a UDP packet, and
    hands it


    Figure 1.1 The structure of the TCP/IP stack: the basic layer, IP, supports a
    number of different protocols, of which the bar height indicates the functionality
    level offered.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'to the IP layer. The packet is then put on the wire, and that is where it ends.
    There is no way to guarantee that the packet will reach its destination. The UDP
    protocol is mostly used by (old implementations of) NFS and by the Name Service.


    The last, and probably most widely used, protocol is TCP. This offers the application
    (client) a virtual circuit to a program (server) on another machine. This virtual
    circuit needs to be established, which means that the client has to open a connection
    to the server. Once this connection is established, the TCP protocol guarantees
    the correct (both in content and in order) delivery of the data transmitted through
    this circuit. While establishing the connection, both the client and the server
    exchange a sequence number that they will use as a ruler for their sliding window
    protocol. These sequence numbers should be generated at random, so they are impossible
    to guess. However, a large number of TCP/IP implementations use an algorithm to
    generate these numbers. Once a hacker knows that algorithm, he or she can predict
    a sequence number and use it in a spoofing attack. (See the sidebar “IP spoofing.”)


    # IP Spoofing


    A frequently exploited trick for breaking into a system is called IP spoofing,
    which is based on the strategy that a system with an address of an untrusted host
    pretends to be a system with an address of a trusted host (very often the local
    host 127.0.0.1). For example, a system with the address 1.x.y.z pretends to be
    a system with the address 2.a.b.c. Because the IP layer normally adds these IP
    addresses to a data packet, a spoofer has to circumvent the IP layer and talk
    directly to the raw network device. The spoofer builds an IP packet by hand and
    puts it on the wire. This may sound more complicated than it really is.


    Faking a UDP packet is relatively simple. The header of a UDP packet is very simple
    due to its connectionless nature. You can fill in any IP address you like and
    pretend to be somebody else. There is one problem, however. If a server needs
    to send a reply, it will send it to the “real” 2.a.b.c instead of to the “fake”
    1.x.y.z. IP spoofing is normally used to deposit another exploit on the target
    machine.


    Faking a TCP connection is much harder, but not impossible. The difficulty lies
    in the fact that when a TCP connection is established, both the server and the
    client generate a sequence number from which they will start counting the packets
    transmitted. This sequence number is generated at random (or at least it should
    be), and should be hard to predict. However, some implementations of the TCP/IP
    protocol make it rather easy to predict this sequence number. Once the spoofer
    has managed to predict the sequence number, he or she can send packets to the
    target machine, just as if the connection were established. This is also often
    used to deposit another exploit on the target machine.


    Figure 1.2 shows what happens when a client and a server make a TCP connection.
    You can see the sequence numbers that are exchanged between server and client.
    Each time one of the parties acknowledges a message, it increments the sequence
    number by 1.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Figure 1.2 An illustration of a client-server TCP connection shows how the
    sequence numbers are incremented.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_16_0.png)


    # IP Spoofing — continued


    The TCP protocol uses a handshake between the two parties. Thus, whenever the
    spoofer sends a packet to the server, the server will send an acknowledgement
    back to the "real" client. This real client does not know what to do with this
    ACK, and sends a message back to the server. The spoofer may try to flood the
    real client with dummy packets at such a rate that its buffers will overflow;
    thus, the ACK from the server will be lost.


    Under some circumstances, a spoofing attack can be detected. If the machine has
    two network interfaces, one for a trusted network and one for an untrusted network,
    a spoofing attack can be detected as follows. For each connection request arriving
    on the machine, the receiving application must check the sender address. If this
    address does not match with the interface on which it was received (e.g., a message
    from a trusted host on the untrusted interface), the connection request should
    be refused, and the event should be logged. If needed, the administrator can be
    warned that such an event has occurred.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Tip 6: Enable Only What You Need


    In most cases, a preinstalled UNIX machine comes with a setup that enables all
    the bells and whistles. One of the first things you should do is disable the IP
    FORWARDING option in your kernel. (Do not disable this option if you use the machine
    as a gateway!) Most machines probably have this option enabled, which means that
    it can send a network packet from one interface to another. If you have connected
    this machine to both a trusted and an untrusted network, you could allow a machine
    on your untrusted network to connect or probe machines on the trusted network.
    The method of disabling this option is system dependent and can normally be found
    in the system manual.


    You should also disable all of the services that are not required for your machine
    to work properly. In most cases, this means that only the telnet and ftp services
    will be enabled. All others will be disabled, including finger, systat, and rservices.
    This last set of services can provide snoopers with information about active users
    on your system, programs running on your system, and much more.


    Before you can disable these services, you must first know how they are used.
    When a client system wants to connect to your server, it contacts a program running
    on your server machine in one of two ways.


    The first way involves daemons—programs running all by themselves. Each daemon
    provides one or more services to the network. These daemons are normally started
    during system startup, in one of the rc files or the inittab file. Not all of
    these daemons are necessary. (For example, do all machines need to run sendmail?)
    You should change your system startup files so that only the necessary daemons
    are started. A tip here is not to remove the unnecessary programs from your startfiles,
    but simply to comment them out. You might need them later, and it is much easier
    to remove a comment than to add programs to the startfiles again.


    The second way to start a server program is through the superdaemon, inetd. inetd
    listens on all the ports to which it is configured. Once a connection comes in
    on one of these ports, inetd will complete it. Once this connection is completed,
    inetd will start the program associated with that port and hand it the connection
    on stdin and stdout. This mechanism is used for telnet connections, ftp connections,
    and many more.


    The configuration of inetd is stored in a special file called /etc/inetd.conf.
    This file tells inetd which services it should listen to and what it should do
    once it receives a connection request. A short fragment of this file is shown
    in Listing 1.1. (Listings 1.1–1.3 are available from the Sys Admin ftp site: ftp.nis.com
    in /pub/sysadmin/.)


    All unused services in this file should have a # on the first line. Note that
    the services on the last eight lines are internal services of inetd, which means
    that they are served by inetd itself. Since inetd is running under the root account,
    any bugs or exploits for these services are likely to give a hacker root access
    to your machine. I suggest you normally disable these. Do not forget to send the
    inetd program the HUP signal whenever you have changed something in the inetd.conf
    file. Only then will it read its new configuration.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Tip 7: Accept Only Trusted Hosts (from Trusted Interfaces)


    A system should only accept connections from machines it trusts. This cannot be
    configured with the normal UNIX configuration. You must resort to extra tools,
    such as tcpwrapper, or write one yourself, like I did. One thing these tools all
    have in common is that they work only for the services started by inetd. The reason
    for this is simple. Once inetd has completed a connection, it will start the program
    that is associated with the service. It is therefore very easy to insert a wrapper
    program between inetd and the real program. This wrapper program will then check
    the address of the client. If the address belongs to the trusted group, it will
    hand the connection over to the server program. If the host is not trusted, the
    wrapper program will close the connection and the server program will not be started.
    You can find the source for tcpwrapper on the ftp site ftp://ftp.win.tue.nl/pub/security.


    Listing 1.2 contains the wrapper program I wrote, which is simpler and has a few
    advantages. First, it uses IP addresses of clients instead of hostnames. Thus,
    it does not rely on the name server for authentication of the client. This can
    be an advantage especially in local network situations, as the name server is
    often one of the first machines to be compromised. Furthermore, the program in
    Listings 1.2 and 1.3 checks the interface on which the packet was received. For
    a client to be able to connect to a server program, the following three items
    must match one of the rules in the configuration file.


    ```

    interface address client address/mask service

    ```


    To be able to handle groups of hosts, the client address may be followed by a
    mask, which denotes the bits in the IP address that are used for matching. Listing
    1.2 contains the main module of the program. Listing 1.3 contains the routine
    that checks the address of both client and interface. If you need the complete
    source of this program, you can find this at the ftp site ftp://ftp.reeseau.nl/pub/divert.


    Adding such a wrapper program to inetd is simple, but how is it done for the stand-alone
    daemons? The answer is that it cannot be done. These daemons open and complete
    their own connections, so there is no way to put a wrapper inbetween.


    However, there are other ways to make daemons more secure. A notorious stand-alone
    daemon (for security holes anyway) is sendmail. It is used to send and receive
    mail and normally runs under the root account. Furthermore, sendmail can start
    programs for users on the system, so it has all the ingredients of a good attack
    target. The Firewall Toolkit (FWTK), however, contains a placebo sendmail daemon
    called smap that can be used in place of the stand-alone sendmail daemon. All
    smap does is adhere to SMTP protocol and store the data it receives in a file.
    Once the message has been completed and stored, smap will hand the data over to'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'the real sendmail. This prevents anyone who telnets directly to the SMTP port
    (port 25) from establishing an interactive connection with the real sendmail to
    try a few exploits. You can find this firewall toolkit at the ftp site ftp://ftp.tis.com/pub/firewalls/toolkit.


    Another way to secure your stand-alone daemons is to run them in their own part
    of the filesystem. This means that the daemon is started through another program
    that first does a chroot system call. Thus, the program has its root on a secure
    directory in the filesystem and cannot access any files above this directory.
    Should the daemon be compromised, the hacker will not be able to access real files
    in the filesystem, just secured copies. The copies of these files, however, should
    not contain any sensitive information, such as real passwords from real users.
    You can find this chroot utility at the ftp site ftp://ftp.win.tue.nl/pub/security.


    # Tip 8: Log and Scan as Much as You Can


    Preventing a break-in is important, however, you should also prepare for the fact
    that sometimes someone will succeed in gaining unwanted access. Therefore, you
    need to have a reliable way of detecting a break-in. The best thing you can do
    is to enable logging of the different tools. If at all possible, this logging
    information should be written to a secure disk or sent to another machine through
    a serial port. You can then use a program like Perl or awk to continuously analyze
    the stream of logging information for strange messages (i.e., repeated failed
    connections from one host or connections during non-office hours). When such a
    situation arises, you should alert the administrator to take action.


    You can also scan your local network with a network scanner like SATAN or Internet
    Scanner. These programs test all hosts on your network for a large number of well-known
    security holes. If a program detects a hole, it will tell you so you can take
    appropriate action. Apart from scanning your network, you can also scan the machine
    itself with a program like COPS. COPS will check your system for strange things
    like dangerous permissions on system files (group and world writable), unknown
    setuid scripts, and much more. You should perform these scans on a regular basis,
    so you can keep a close eye (not a closed eye) on your security. Both SATAN and
    COPS are freely available through ftp.win.tue.nl. Internet Scanner is a commercial
    product available through Internet Security Systems.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Tip 9: Watch the Security Mailing Lists on the Internet


    There are a number of security-related mailing lists available on the Internet.
    You should probably subscribe to a few of them to keep informed of the newest
    exploits and problems. In any case, it is a good idea to subscribe to the CERT
    mailing list. This is one of the official organs that releases security alerts
    and fixes. Visit their Web site at http://www.cert.org for more information on
    subscribing.


    # Tip 10: Always Test a Password Scheme before Implementing It


    In this picture of networking security, there is still one big unknown: the human
    factor. You can build a very safe networking environment, but if users stick their
    password on the monitor to remember it, you still have a major problem. This may
    sound crazy, but it actually happened when a security policy forced users to use
    system-generated passwords. These passwords were so difficult to remember that
    users wrote them on yellow notes and stuck them to their monitors or (if more
    security-aware) to the bottom of their keyboards.


    You need to involve your users and make them security-aware so they are willing
    to cooperate. You will also need to draw up some guidelines for the users to follow
    so they can continue working in a safe manner.


    With respect to the human factor, some companies enforce a password policy to
    prevent users from using guessable passwords. This is wise, but such a password
    scheme should be selected with care. In some cases, this scheme leads to a situation
    where passwords are generated automatically, which often results in passwords
    like Grb16x or Pfq#12. Admittedly, these passwords are hard to guess, but are
    probably even harder to remember. You might have users follow a rule similar to
    this: Make up a sentence of words and numbers you can easily remember. Pick all
    the first letters from each word and the numbers, and use these as your password.
    For example, "I live in Holland and my zipcode is 9991 AM" would translate to
    the password I1iHamy9A. This is also hard to guess, but at least it is easier
    to remember. (BTW, this is not my real password.)


    You could also write a password program that will check the new password of a
    user against a (preferably large) dictionary before accepting it. Whenever the
    program finds a match with a word in the dictionary, the password is rejected,
    and the user must choose a new one.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# ## Conclusion


    A few simple tips can improve the security on your local network. These simple
    things do not need to cost money; usually they can be implemented by correctly
    configuring your systems. Furthermore, a number of tools are available through
    the Internet at no extra cost.


    However, these measures cover only 80 percent of the cases. If you have a more
    than average need for a secure environment, you probably need to build the expertise
    yourself or hire it. But before implementing a solution, you should always weigh
    the risks against the effort you will need to expend. The costs involved should
    not exceed the possible damage of a break-in.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Checking User Security


    Larry Reznick


    While preparing for a UNIX security audit recently, I examined several user account
    issues that many of us may overlook. These issues include duplicate home directories,
    users idle for longer than many days, old accounts that haven’t been used for
    a long time, and inactive or infrequent password aging. Left unattended, some
    of these issues may, over time, turn into big security problems. The key to preventing
    minor security breaches from becoming big problems is to learn about them soon
    after they happen.


    Simple shell scripts running once a day, once a week, or once a month can catch
    these problems, and I’ve written a set of scripts that serve this purpose. One
    of my objectives in writing these scripts was to deliver the information without
    requiring root access. Comprehensive checking scripts that only root can run are
    not useful to department managers who could keep an eye on system issues but can’t
    find out what they need to know because they can’t run root jobs. System queries
    such as those used in these shell scripts don’t require root access, so system
    administrators can offload these administrative responsibilities to group managers
    or department managers. Furthermore, because root needn’t run these scripts, they
    can run under some other cron job that isn’t as cluttered as root’s.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Duplicate Home Directories


    Generic login accounts are a bad idea. They seem convenient from the administrator’s
    view: when many people need to use a program, and the only thing they do is run
    that program, why create dozens of individual accounts? Instead, why not create
    one generic account that everyone can login to? The problem with this approach
    is the lack of accountability. If the user’s login name is your only way of knowing
    who is doing what, you won’t know much with everybody using the same login name.
    tty and pty identifiers won’t tell you who is really using the terminal. The person
    typically using that station could be at some other station.


    If the software asks for the user’s identification, you might think that a generic
    login account will be sufficient because the program will keep track of who is
    doing what. Does that program notify UNIX of this user-specific information? Without
    such notification, can a UNIX administrator know what’s happening? Does the program
    allow the user shell access? If so, that user is still not identified, yet can
    perform system operations without accountability.


    Solve these problems with separate accounts. Give each user a separate login name
    and password. Give each login a separate home directory. Some system administrators
    are tempted to create a generic home directory and have every user working with
    that application login there. A generic home directory, however, makes file isolation
    problematic. If the application creates user-specific files, are those files identified
    uniquely for each user? If not, but they’re put in the current directory or a
    central directory, how will you know which file belongs to which user? When a
    user has shell access or configuration facilities within the application, one
    user can interfere with another user’s files or operation.


    Make home directories private to each user. In a secure environment, home directories
    should not be writable by any user other than the owner. Stringent security environments
    shouldn’t allow home directories that are readable by any user other than the
    owner. When several people have ownership access to one home directory, these
    security precautions are useless.


    A simple shell script, chkduphome (Listing 2.1), examines the /etc/passwd(4) file
    and reports the names of any accounts sharing the same home directory. Field six
    of the colon-delimited /etc/passwd file holds the login account’s home directory.
    cut(1) extracts the directories and sort puts them in order so that duplicates
    become visible. sort(1) has a -u option to do the work of uniq(1). uniq’s -c option
    does something helpful that sort’s -u option doesn’t do: it shows the duplicate
    count. Every entry passed through uniq -c will have a count — even the single
    entries. egrep(1) cuts out all entries with a count of 1. Spaces before and after
    the | ensure that only 1 is eliminated, not 10 or 21. Only duplicate entries remain,
    despite the number of duplicates found. Resulting entries are passed on to sed(1).'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The script then applies two sed expressions to the entries representing duplicates.
    The first expression deletes the count part of the record, leaving only the home
    directory name. The second expression puts the colons back into the directory
    name. These actions prepare the name for another egrep search through the password
    file. egrep will collect the account names associated with those duplicate home
    directories. If the account names were collected in the initial cut, sort could
    have ordered them strictly by the home directory key, but uniq couldn''t have
    counted the duplicates so easily.


    Records are duplicates from uniq''s view only if the entire records match. Some
    versions of uniq allow field specifications — the version I used did not. sort
    won''t omit only the duplicated lines. uniq will omit only the duplicated lines,
    but then I wouldn''t get one line for each login account using a duplicate directory.


    # Listing 2.1 The shell script chkduphome examines the /etc/passwd(4) file and
    reports the names of any accounts sharing the same home directory.


    ```

    #!/bin/sh

    #

    # chkduphome

    #

    # Report account entries in the /etc/passwd file

    # using the same home directories.

    #

    # Copyright 1994, Lawrence S Reznick


    PW_FILE=/etc/passwd        # Point to passwd file

    DUP_FILE=tempdup.$$        # egrep search set


    echo The following login accounts use the same home dirs as other accounts:


    cut -d : -f6 $PW_FILE |

    sort |

    uniq -c |

    egrep ''v'' 1- |

    sed -e ''s/[1-9]*/'' -e ''s/(\t.*)/\1/'' > $DUP_FILE


    egrep -f $DUP_FILE $PW_FILE |

    cut -d : -f1,6 |

    sort -t : -k 1 |

    tr '':'' '' ''                # 2nd arg has only 1 tab


    rm $DUP_FILE

    ```'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'To get the names associated with the directory, the script outputs to a file
    that holds all of the duplicate directory names. With those duplicates known,
    it is a simple matter to tell egrep to search through the passwd file for any
    line containing the offending directory path. Every directory named in the duplicate
    file has a leading and trailing colon delimiter, as used by /etc/passwd. These
    delimiters create a whole-field match. They prevent matches when an upper level
    in a tree is a home directory, and they prevent matches to subdirectories in that
    same tree. For example, if some duplicate account error is in /usr, the program
    shouldn’t output every account having /usr in its home directory path. Only those
    entries showing a home directory of /usr will match. egrep -f identifies the duplicate
    entries file so that egrep will match any of the duplicate entries for every /etc/passwd
    line.


    Matching lines representing the duplicate entries from the passwd file are passed
    to cut, which extracts the user’s account name and home directory. sort receives
    this information and orders the records by the home directory. sort puts all of
    the names together within a single home directory, then orders the lines by name
    within that single home directory. Finally, to make the output a little easier
    to read, tr changes the colons to tabs.


    chkduphome’s output remains unadorned so that it can be piped into another program.
    That other program could parse the output based on the tab between the fields.
    Of course, a cron job could simply mail the output to the administrator or group
    manager if no further processing were needed.


    # Catching Idle Users


    User workstations idle for too long may represent a security problem. Such a user
    may have left the login active but may not be at the station. If a screen-saver
    program is active with a password-protected lock, there is probably nothing to
    worry about. However, when a user is idle for more than a week or two, I start
    to wonder if the user went on vacation without logging out.


    The idleuser script (Listing 2.2) gives a list of overly idle users. For this
    program, hours or minutes of idle time aren’t important, only days. The finger(1)
    command gives sufficient information in a table format. Unfortunately, finger
    doesn’t output convenient tab separators between its table’s fields. Fortunately,
    finger’s fields appear to use uniform character lengths. So I give cut those character
    position ranges to extract the user names and their idle times, just being sure
    to include some separating spaces in the data’s character ranges.


    When finger sees an idle time of one or more days, it shows a d after the number.
    If I tell egrep to look for one or more digits followed by that d, it will pare
    down the finger list to just the overly idle records.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'awk does the rest of the work with the pared list. awk parses the login name
    field from the idle time field. Remember that awk sees everything as strings unless
    you explicitly use a value in a numeric expression. When a value contains anything
    other than a digit, you must tell awk to convert it to a number. The d at the
    end of each idle days number prevents awk from seeing the value as numeric. String
    comparison is inappropriate for comparing the days number with the idle days threshold
    coming from idleuser’s command line. As a string, 1d would come before 2d, but
    9d would come after 10d because the 9 digit comes after the 1 digit. Adding 0
    to the value causes awk to take the numeric value of the string, throwing out
    all nondigit characters after the last digit, and use the result as a number.
    awk will compare the numbers correctly.


    The program shows the names and idle days of only those users idle for more than
    the command line’s threshold number. If you think that 7 days, 14 days, or even
    30 days of idle time is fair, you could use idleuser 30 as your command line or
    in your cron job. idleuser assumes that you’re not interested in any user idle
    for fewer than those days. The script reports anyone idle for that number of days
    or more so that you can decide whether it’s a problem.


    # Listing 2.2 The idleuser script reports overly idle users.


    ```

    #!/bin/sh

    #

    # idleuser

    #

    # Show users idle longer than specified days.

    #

    # Copyright 1994, Lawrence S Reznick


    if [ $# -ne 1 ]

    then

    echo "Usage: $0 days\n"

    echo "Show users logged in & idle for longer than the specified days."

    exit 1

    fi


    finger |

    cut -c9,35-40 |

    egrep "[0-9]d" |

    awk ''

    if ( $2 + 0 >= days ) {

    print $1, "(" $2 ")";

    }

    '' days=$1

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# In Search of Ancient Accounts


    Using finger to find idle accounts immediately suggests using finger to identify
    ancient accounts. Sometimes accounts just drop off, and, in a busy job shop with
    lots of special access and consultant accounts, it is very easy to leave old,
    unused accounts on the system. Such an account represents a security issue because
    anyone who once had access to that account could still get in. idleuser used finger''s
    summary output to find information about idle time in days. The oldacct script
    (Listing 2.3) also uses finger but requests more verbose information about each
    user.


    When you give finger a user''s name, even several users'' names, it delivers lines
    for each user, identifying various facts about that user. finger takes most of
    those facts from the /etc/passwd file, along with the /etc/utmp(4) and /etc/wtmp
    files, where who(1) and login(1) keep their latest data.


    Because finger gives verbose information only when given each user''s name individually,
    oldacct must look through the passwd file to learn the users'' names. Every possible
    account name is in the passwd file, including administrative user accounts and
    pseudo-user accounts, which may not get used for a very long time.


    # Listing 2.3 The oldacct script reports users idle for over 90 days.


    ```

    #!/bin/sh

    #

    # oldacct

    #

    # Identify accounts not used for over 90 days.

    #

    # Copyright 1994, Lawrence S Reznick

    #

    # 94Apr19 LSR

    # Finger doesn''t always show "On since" when the user is still logged in.

    # If the user has been idle, finger shows the minutes & seconds idle.

    # Added a test for "Idle" to catch that. Also found one acct that had a

    # home phone field. Finger outputs that on a separate line, pushing the

    # "Last logged in" line to the 5th line. The word "Directory:" appears on

    # the 4th line when that happens. Added a test to handle that. Finally,

    # changed the "Never logged in" code to collect the names. After the loop

    # finishes, the names are output in a columnar list. Looks cleaner that way.

    PW_FILE=/etc/passwd        # Point to passwd file

    LOWUID=200                 # Lowest non-admin UID

    ```'
  merge: -1
  img_proc: true
- pgno: 28
