- pgno: 77
  md: "facilities reserved for graduate students and faculty. rma is also used to\
    \ prevent users who are not members of systems staff from logging into the department’s\
    \ servers. Listing 6.1 is the current version of the rma code.\n\nThe rma code\
    \ restricts access by moving the shells (typically found in /bin and /usr/bin)\
    \ to a new location — the directory specified by the SHELL_DIR define in the program.\
    \ /usr/bin/shells is usually a good choice. For security reasons, the statically\
    \ linked copy of the Bourne shell (usually found in /sbin) should remain untouched,\
    \ because it is customarily root’s login shell. Then, the original shell names\
    \ are linked to the rma binary, which should be copied to /usr/bin. This same\
    \ procedure is used to install most wrapper programs.\n\n# Listing 6.1 (continued)\n\
    \n```\n/* Print access violation message and send email with /usr/ucb/Mail */\n\
    /* if configured to do so. */\nvoid KickOut(void)\n{\n    int in;\n\n    printf(\"\
    Access to this machine RESTRICTED!!\\\\n\");\n\n#ifdef MAIL_TO\n    if((in = open(\"\
    /dev/null\", O_RDONLY, 777)) != 0) {\n        dup2(in, 0);\n        execl(\"/usr/ucb/Mail\"\
    , \"Mail\", \"-s\", \"ACCESS VIOLATION\", MAIL_TO, NULL);\n        exit(1);\n\
    \    }\n#endif\n\n    /* M A I N   P R O G R A M */\n    main (int argc, char\
    \ ** argv)\n    {\n        char host[MAXHOSTNAMELEN];\n        uid_t gid;\n\n\
    \        /* Block some signals */\n        signal(SIGINT, SIG_IGN);\n        signal(SIGTERM,\
    \ SIG_IGN);\n\n        /* Determine our hostname */\n        if (gethostname(host,\
    \ MAXHOSTNAMELEN))\n            perror(\"Who am I...get me HELP!\");\n\n     \
    \   /* Get the user's primary gid */\n        gid = getgid();\n\n        /* Start\
    \ the user's shell if */\n        /* access is allowed */\n        if(CanLogin(gid,\
    \ host))\n            Login(argv);\n        else\n            KickOut();\n   \
    \ }\n```"
