- pgno: 54
  md: 'Several worthwhile changes would include:


    +   - accommodating the keyword old in the wtmp''s idle column for idle times
    older than 24 hours;

    +   - handling the full hours:minutes format for a large number of minutes requested,
    such as 120, or for an hours:minutes request format, such as 1:30; and

    +   - working from a table identifying certain users with different idle times,
    allowing the fine-tuning of the idle times for certain special users.


    # Running killidle


    You can run killidle any time manually. Just type


    ```

    killidle

    ```


    to use the default 20-minute idle time, or type


    ```

    killidle minutes

    ```


    where minutes is any positive number for the idle minutes allowed.


    | Table 4.3 (continued) |

    |---|---|---|

    | PWR | 19 | Power failure or restart |

    | WINCH | 20 | Window size change |

    | URG | 21 | Urgent socket condition |

    | IO | 22 | Socket I/O (aka POLL) |

    | STOP | 23 | Stop from non tty process (see CONT) |

    | TSTP | 24 | Stop from tty process (see CONT) |

    | CONT | 25 | Continue a stopped process |

    | TTIN | 26 | Waiting for background tty input (see CONT) |

    | TTOU | 27 | Waiting for background tty output (see CONT) |

    | VTALRM | 28 | Virtual alarm timeout |

    | PROF | 29 | Profiling timeout |

    | XCPU | 30 | CPU time limit exceeded (dumps core file) |

    | XFSZ | 31 | File size limit exceeded (dumps core file) |'
