    The output of lastlogin -u10 -htiger is as follows.


    ```

    User  FailedDate  Time    Tty     Host

    root    0   29-Aug-9413:29hft/0tiger

    ```


    # Time Conversion


    /etc/security/lastlog stores the time in seconds since epoch. cvttime.c (Listing
    8.2) converts seconds since epoch to a user-reabable format, similar to the output
    of the date command. Invoked without any parameters, it returns the current time
    in seconds since epoch. An optional flag, -f, determines which parts of the time
    and date should be printed. The format is the same as for the C library function
    strftime.


    # Logfiles Maintenance


    The logins shell script (Listing 8.3) is invoked by cron once a day. It checks
    if a compressed file for the last month, sulog.MM.Z or wtmp.MM.Z (where MM stands
    for month), already exists in the directory /var/adm/local. If this file does
    not exist or was created last year, the corresponding file /var/adm is compressed
    and stored in directory /var/adm/local. The original is then reduced to size zero.
    Note that these files must exist for entries to be made.


    If the size of /etc/security/failedlogin is greater than zero, the file''s content
    is mailed to the system administrator. The file is then also reduced to size zero.


    # Summary


    These tools keep the login log files small and also maintain a backup copy of
    recent months for reference. lastlogin enables system administrators to query
    user account login data and to automatically monitor user accounts.'
