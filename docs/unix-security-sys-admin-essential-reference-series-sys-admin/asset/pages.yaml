- pgno: 108
  md: '# Equivalency


    *Chris Hare*


    Equivalency, also known as trusted access, is an often overlooked area of network
    security. Equivalency is most useful in environments where the BSD `r` commands
    — `rlogin`, `rcmd(rsh)`, and `rcp` — are supported.


    TCP/IP environments allow for two types of equivalency: host and user. *Host equivalency*,
    or trusted host access, can be configured by the system administrator. This type
    of equivalency permits all of the users on the specified system to access the
    local system without using a password. Host equivalency is controlled through
    the file `/etc/hosts.equiv`.


    *User equivalency*, or trusted user access, is controlled by the user. It allows
    that user, as well as any others specified, to access that account without using
    a password. This type of access is managed through the user file `$HOME/.rhosts`.


    # Network Fundamentals


    Organizations often start out with one or two computers, then add more, and suddenly
    there’s a network. Unless the expansion path is carefully planned, security can
    be inadvertently compromised.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'For example, my login name at one time was simply chris. As a result of poor
    planning, another user in one of our company’s other offices had a login name
    of chris. The two offices were not connected using TCP/IP; however, when a SLIP
    line was introduced between the two offices, there were suddenly problems. The
    most obvious problem was that each of us with the login chris could access files
    belonging to the other.


    While changing the login name for one user solved the immediate problem, it did
    not address the real security issue — each of the users should have had an account
    for each machine on the network, each with the same User ID (UID).


    As a first step toward providing equivalency, keep in mind the following points
    when setting up your network.


    +   - You are essentially duplicating the /etc/passwd and /etc/group files on
    all of the machines in your organization. As a result, each user must have a unique
    login name and UID.

    +   - Group permissions cross system boundaries, so the same guidelines apply
    for groups. The same groups with the same Group IDs (GID) must exist on all machines.


    # Configuring Host Equivalency


    Host equivalency must be set up and operational to use the commands rcmd (rsh)
    and rcp. The system administrator configures host equivalency using the file /etc/hosts.equiv,
    as shown in Figure 10.1. This file consists of host names, one per line (it is
    also a good idea to document in the file who the network administrator is).


    Each entry in the hosts.equiv file is trusted. This means that users, with the
    exception of root, on the named machine can access their equivalent accounts on
    this machine without a password.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'In the configuration shown in Figure 10.2, the two machines oreo and wabbit
    both have my user name, chare. If I am currently logged into wabbit, and issue
    the command


    ```

    rlogin oreo

    ```


    with host equivalency established, then I can log into oreo without being asked
    for my password. If host equivalency is not established, then I will be asked
    for my password on the remote machine.


    There are two things to bear in mind concerning entries to /etc/hosts.equiv:


    +   - all the users on the remote machine are trusted, with one exception that

    +   - root is never trusted.


    There is a second format for the hosts.equiv file, as shown in Figure 10.3. This
    format lists a system name and a user name. With the addition of the user name,
    the user can login under any user name listed in /etc/passwd.


    # Figure 10.2 A sample configuration illustrates equivalent account access through
    the use of hosts.equiv on two machines.


    ![](img/113bcc15fc2db8f0f40ac5d1e755f41c_110_0.png)


    # Figure 10.3 An alternate format for the hosts.equiv file, which allows the system
    administrator to set user equivalency.


    ```

    oreo chare

    wabbit chare

    ovide andrewg

    ```'
