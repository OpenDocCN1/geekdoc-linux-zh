  md: "# Configurable Parameters\n\nThere are a number of locally configurable parameters\
    \ at the beginning of the sudo source code. The following are the default values.\n\
    \n```\n#define SECURE_PATH \"/bin:/usr/bin:/etc\"\n#define USERFILE \"/usr/local/adm/sudoers\"\
    \n#define LOGFILE \"/usr/local/adm/sudolog\"\n#define TIME 5 /* minutes */\n#define\
    \ TIMEDIR \"/usr/local/adm/sudocheck/\"\n#define SUDO_COP \"root@localhost\"\n\
    ```\n\nSECURE_PATH is a path statement that defines the directories that contain\
    \ the programs that can be executed by sudo. Appropriate permissions need to be\
    \ maintained for the directories in this path and the programs in these directories.\
    \ Periodic checking of these directories would be a good idea.\n\nUSERFILE is\
    \ the configuration file that contains the users and the commands that can be\
    \ executed. The format of this file is user logon name, followed by a white-space-separated\
    \ list of commands. You can use not to indicate all but the listed commands. You\
    \ can use all to indicate all commands in the secure path.\n\nLOGFILE is the location\
    \ of the log file that sudo creates to log information about commands that were\
    \ executed or attempted. This file must not be readable or writable by anyone\
    \ but root.\n\n# Listing 5.1 (continued)\n\n```\nelse\n{\n(void) log(user->pw_name,\"\
    FAIL \",argc, argv);\n fprintf(stderr,\"%s: You are not set up to \"\n \"execute\
    \ %s with sudo on this machine.\\n\", progname,argv);\n exit(1);\n}\nelse\n{\n\
    \ cmd_line = log(user->pw_name,\"FAIL \",argc, argv);\n mail(USER_SUB,user->pw_name,cmd_line,USER_ERR);\n\
    }\n```"
