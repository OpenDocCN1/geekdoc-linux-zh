  img_proc: true
- pgno: 104
  md: 'The default configuration in Figure 9.3 requires a user to change the password
    every eight weeks. The password must contain at least one alphabetic and one nonalphabetic
    character and each character can be repeated once. New passwords are checked against
    the dictionary file /usr/local/adm/pwdict/dictionary and verified using a locally
    developed loadable module in /usr/local/adm/checkpwd. Passwords cannot be reused
    within a year, and each new password must differ from the previous 25 passwords.
    Three days before a password expires, the user is reminded when logging on. Logins
    on Sundays are disabled.


    Password history is enabled; the encoded password, with the time it was changed
    and the user ID to which it belonged, is stored in /etc/security/pwdhist.dir.
    Root owns this file and is the only user with read and write permissions.


    # Logging


    The files /etc/security/lastlog and /etc/security/failedlogin log failed login
    attempts per user. The record includes time and date, terminal, user ID, remote
    host, and number of unsuccessful attempts since the last successful login (see
    Chapter 8 for a detailed description of AIX v3 login configuration and tools to
    automate login surveillance). If the number of unsuccessful login attempts exceeds
    the loginretries value, the account is logged and a warning message is issued
    when the user tries to login.


    /etc/security/portlog contains for each port the time a failed login occurred
    and the time a port was locked. Both are reset when the port is reenabled. The
    unsuccessful login times and occurrences are compared against the values of logininterval
    and logindisable to determine whether a port should be locked.


    # Extending Password Verification


    As I noted earlier, you can write your own extension to AIX v4''s password verification
    functions. Extending the password verification requires you to write a C program,
    such as checkpwd.c (Listing 9.1) and to create a dynamically loadable object file
    [6]. Use the -e checkpwd option when you compile the sample code. This causes
    the compiler to use checkpwd() as the entry point instead of main().


    You can use any function name other than main(). The login process uses the "load
    system" call to load the files listed in the pwdchecks attribute. The system call
    returns the address of the function specified with the -e option, and that function
    is then called. The function''s return value indicates success (0) or failure
    (any other value). Memory for the returned error message must be allocated from
    the heap; the login process will free it.'
  merge: -1
  img_proc: true
- pgno: 105
  md: "Writing your own password extension requires some care, however. First, and\
    \ most important, the loadable file must be placed in a secure directory with\
    \ permissions allowing only root to access it. No ordinary user must be allowed\
    \ to replace this file. The code is executed as part of the login process, with\
    \ root’s environment, credentials, and resource limits; for this reason, you should\
    \ avoid creating child processes or create and open files. Don’t call `exit`:\
    \ this would terminate the login, `su`, and `passwd` programs, so that a user\
    \ might not be able to login at all. If you change signal handlers, reset them\
    \ to their original values before your function returns. Some of the handlers\
    \ are used by the calling process as well.\n\n# Alternate and Additional Login\
    \ Checks\n\nAIX v4 lets you replace or augment the login procedure. Additional\
    \ programs must be defined in the second part of `/etc/security/login.cfg` as\
    \ trusted login programs. Figure 9.4 lists as the key `mylogin` and refers to\
    \ an executable `/usr/local2/adm/mylogin`. This program may be called instead\
    \ of, before, or after the traditional UNIX password prompt, depending on the\
    \ sequence in attribute `auth1` in `/etc/security/user`.\n\nIn the login in Figure\
    \ 9.4, the attribute `auth1` would invoke `/usr/local2/adm/mylogin`, with `richter`\
    \ as its only parameter. It is this program’s responsibility to ensure the user’s\
    \ identity. Instead of a password, one can think of a fingerprint or voice-checking\
    \ device. An exit value of 0 indicates success; any other value, failure. No other\
    \ authentication program is invoked, since the value of SYSTEM was set to NONE.\
    \ On the other hand,\n\n```\nSYSTEM = \"files\"\nauth1 = SYSTEM,mylogin:richter\n\
    ```\n\ncalls the standard login procedure before the local program.\n\n```\nAuth1\
    \ = mylogin:richter,SYSTEM\n```\n\nreverses the sequence. If both indicate success,\
    \ access is granted.\n\n**Figure 9.4**  `login.cfg` file shows an alternate login\
    \ program for the user `richter`.\n\n```text\nrichter:\n    SYSTEM = NONE\n  \
    \  auth1 = mylogin:richter\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "When you write your own login program, the same warnings apply as for extending\
    \ the password verification. However, no special compilation flags are required.\n\
    Figure 9.5 (mylogin.c) shows a sample program used as an alternative login program.\
    \ Function authenticate is used to verify the user's password. authenticate maintains\
    \ state information and may be called several times to verify a user. A nonzero\
    \ value of reenter indicates that the functions must be called again. The first\
    \ call to authenticate returns the password prompt in the parameter message. The\
    \ second call verifies the user's response; the parameter prompt contains the\
    \ password in clear text. Password mismatches are indicated by a nonzero return\
    \ code, and an error message is returned in the parameter message. However, if\
    \ you set SYSTEM = NONE, authenticate does not verify the user's password.\n\n\
    # Figure 9.5 A sample program, mylogin.c, used as an alternative login program.\n\
    \n```\n/*\n** Alternate login program\n** Invoked from system login process with\
    \ user name\n** as the only parameter.\n*/\n\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <stddef.h>\n\nint main(int argc, char **argv)\n{\n    extern int errno;\n\
    \    int rc, reenter;\n    char *message = \"this is a message:\";\n    char *prompt;\n\
    \    char *user = *++argv;\n\n    prompt = NULL;\n    rc = authenticate(user,\
    \ prompt, &reenter, &message);\n    while( rc == 0 && reenter ){\n        prompt\
    \ = getpass(message);\n        rc = authenticate(user, prompt, &reenter, &message);\n\
    \    }\n    if( rc )\n        fprintf(stderr, \"%s\", message);\n    return rc;\n\
    }\n```"
  merge: -1
  img_proc: true
