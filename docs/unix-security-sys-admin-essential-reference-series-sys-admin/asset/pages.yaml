- pgno: 212
  md: "Before the new system can dial-in, it must be added to the /etc/passwd file.\
    \ A UUCP connection is made by logging in and starting a special UUCP shell called\
    \ uucico (UUCP copy in copy out). For each user the following line is added to\
    \ the /etc/passwd file.\n\nuucs*:*:UID:GID:Dial in UUCP account for $%: /usr/spool/uucppublic:/usr/local/lib/uucico\n\
    \n# Listing 16.1 (continued)\n\n```\nclose OLD;\nclose NEW;\nrename $group, $group\
    \ . \"old\";\nrename $mfile, $group;\n&setperm($group . \"old\", $mfile);\n\n\
    # to the passwd file\n# find the gid of uucp\n($dummy, $gid, $dummy) = getgrnam(\"\
    uucp\");\n\n# find a free uid\nsetpwent;\nwhile(($dummy, $dummy, $uid, $dummy)\
    \ = getpwent) {\n  push @uids, $uid;\n}\nendpwent;\n@uids = sort numeric @uids;\n\
    $uid = shift @uids;\nwhile(@uids) {\n  $nuid = shift @uids;\n  if ($nuid - $uid\
    \ != 1) {\n    last;\n  }\n  $uid = $nuid;\n}\n$uid = $nuid;\n\n$mfile = $passwd\
    \ . \".new\";\nopen OLD, \"$passwd\" || warn \"Cannot open $passwd, $!\\n\" &&\
    \ return;\nopen NEW, \">$mfile\" || warn \"Cannot creat $mfile, $!\\n\" && close\
    \ OLD && return;\nwhile(<OLD>) {\n  print NEW;\n}\nclose OLD;\nprint NEW \"$username*:*:\
    \ $uid:$gid:Dial in UUCP account for\\n\";\n$sysnam=/usr/spool/uucppublic:/usr/local/lib/uucico\\\
    n\";\nclose NEW;\nrename $passwd, $passwd . \"old\";\nrename $mfile, $passwd;\n\
    &setperm($passwd . \"old\", $mfile);\n\n# adduser\n\nsub numeric\n{\n  $a <=>\
    \ $b;\n}\n```"
  merge: -1
