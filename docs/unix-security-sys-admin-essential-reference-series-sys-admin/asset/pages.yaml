- pgno: 208
  md: "The remote system is allowed to send and receive mail and news, plus it may\
    \ upload or download files through the UUCP public storage in /usr/spool/uucppublic.\
    \ The remote system is never called (see the time configuration line). Finally,\
    \ the username that the remote system uses for dialing in is called uuxqt.\n\n\
    # Listing 16.1 (continued)\n\n```\n# Add all hosts to named\nsub addnamed\n{\n\
    \    local( $sysnam, $backup, $dummy );\n    local( $uid, $gid, $mode );\n   \
    \ # First the forward mapping. Back up older versions\n    &backupfile( $namedfwd\
    \ );\n    $backup = $namedfwd . \".o\";\n    open ORIGINAL, \"$backup\" || warn\
    \ \"Cannot open $namedfwd, $!\\n\" && $link $backup, $namedfwd && return;\n  \
    \  open NEW, \">$namedfwd\" || warn \"Cannot creat $namedfwd, $!\\n\" && $link\
    \ $backup, $namedfwd && return;\n    while( <ORIGINAL> ) { print NEW;\n    }\n\
    \    close ORIGINAL;\n    foreach $sysnam (keys %add) {\n        print NEW <<EOF\n\
    $sysnam  IN  A  $add{$sysnam}\nEOF\n    }\n    close NEW;\n    # Set ownership\
    \ and permissions\n    &setperm( $backup, $namedfwd );\n    # Secondly the reverse\
    \ mapping. Back up older versions\n    &backupfile( $namedrev );\n    $backup\
    \ = $namedrev . \".o\";\n    open ORIGINAL, \"$backup\" || warn \"Cannot open\
    \ $namedrev, $!\\n\" && $link $backup, $namedrev && return;\n    open NEW, \"\
    >$namedrev\" || warn \"Cannot creat $namedrev, $!\\n\" && $link $backup, $namedrev\
    \ && return;\n    while( <ORIGINAL> ) { print NEW;\n    }\n    close ORIGINAL;\n\
    \    foreach $sysnam (keys %add) {\n        local( $hostnum, $fullname );\n  \
    \      $fullname = $sysnam . \".reseau.nl.\";\n        $hostnum = $add{$sysnam};\n\
    \        $hostnum =~ s/\\./(10-9)+/\\/1/;\n        print NEW <<EOF\n$hostnum PTR\
    \  $fullname\nEOF\n    }\n    close NEW;\n    # Set ownership and permissions\n\
    \    &setperm( $backup, $namedrev );\n}\n# addnamed\n```"
  merge: -1
  img_proc: true
