    # # Reaching Programming Nirvana


    The end-all and be-all of programming is to avoid having to write the same code
    over and over. Wouldn''t it be great to invent something equivalent to a hammer-program
    that you can use over and over, changing its behavior only slightly to meet the
    needs of the moment?


    The programmer tries to reach that lofty height through two goals: reuse and pluggability.
    The following sections describe these goals in more detail.


    # ## Reusing Your Work


    Correctly applied, object programming yields a design that others can leverage
    or reuse. The holy grail of all software engineering is to write-once and reuse-many
    times. Objects bring you closer to that idyllic state.


    The problems you face from day to day as a programmer do not stray much from those
    faced by others who have programmed before you. In fact, most problems are just
    mutations of age-old designs. Some reusable designs include that of TCP messengers
    or servers, such as email or HTTP. Regrettably, much of their designs are locked
    behind the walls of proprietary software.


    The power of reuse is the ability to take others''work and build on it. Consider
    how long it would take an architect to build your new home if he had to pour metal
    to make nails! Now, that industry can pump out very impressive, sturdy, and well-built
    homes in a factory and ship the pieces to the site in only three days! Why can''t
    the computer industry do that? Well, it can, but it takes discipline.


    # ### NOTE


    NIH: Not Invented Here


    When I worked at my first job, I was among the most intelligent and gifted engineers
    I had ever met. Trying to stand out of the crowd was a constant struggle. However,
    there was one trait many of them shared that limited their potential: NIH. Not
    Invented Here is a mindset that stipulates that "if we didn''t do it, it was probably
    done wrong (or not perfectly)." I have learned that this erroneous (if not arrogant)
    viewpoint is prevalent throughout nearly all software firms.


    You might want to consider two angles of reuse—accepting others''work and promoting
    your own. The first is really straightforward and requires a little trust between
    you and the provider. This is fine, as long as the provider is responsive to your
    needs.


    The flipside makes you the provider for the user-programmer. To promote your work,
    the libraries must be robust and you need to respond quickly your users. A good
    and intuitive design keeps your customer coming back for later versions. Also,
    providing clear upgrade paths helps make a difficult transition easier.


    Lastly, generalizing your design simplifies reuse. Look at the problem as a set
    of puzzle pieces. The closer you make the pieces to a generalized form, the more
    likely your users can reuse your work.'
