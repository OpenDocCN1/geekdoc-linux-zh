- pgno: 136
  md: 'Most new computer systems today conform to *Green* or *EnergyStar* standards.
    One requirement is that the drive powers down when not used for a period of time.
    The drive takes about 1 or 2 seconds to spin up from idle.


    Likewise, a 10Mb network transfers an average of 300KB/s from computer to computer
    (this is a measured optimum for a network running TCP/IP). A 100Mb/s network may
    increase this average only by a factor of 10 (3.0MB/s). Not counting the transmission,
    routing, and request-processing time, your client may have to wait an equivalent
    of 1000 instructions (on a similarly configured system). With these other factors,
    you can easily multiply that estimate by 1000 to 5000.


    An average number of opcodes per line of compiled C source is 10:1. In other words,
    a network delay of 20ms could mean that your task could have executed about 5,000,000
    opcodes, or 500,000 lines of C code.


    So, how does the operating system deal with these time lags? It basically puts
    your task to sleep (*blocking*). When the system request finishes, your task wakes
    up and continues running.


    Blocking I/O-bound tasks is usually the rule rather than the exception. To see
    how many tasks are actually running on your computer, run `ps aux`. All the tasks
    labeled R are running; those labeled S are stopped. You can have only one task
    running: the `ps` command itself.


    # When Do I Block?


    You may let a program block (stop processing and wait) when an I/O resource takes
    its time to finish. Any time your program makes a system call, the operating system
    may force your task to wait for the transaction to finish. In most cases, the
    task waits for the I/O to send or receive information. Blocks occur under the
    following circumstances:


    +   * Reading—A read-block occurs when no data has arrived yet. Internally, even
    one byte can cause the `read()` to return after a designated period of time.

    * Writing—A write-block occurs when the internal buffers are full and waiting
    for transmission and your program requests more data to be sent. Linux sets aside
    memory for buffers for all I/O subsystems. These buffers store the data temporarily
    until the I/O subsystem transmits it. If the buffers fill up, subsequent calls
    block until some buffers free up.

    * Connecting—A connection-block occurs when the `accept()` and `connect()` system
    calls find no pending connections in the listening queue. Blocking while waiting
    for a connection may actually be a good idea; otherwise, you may want to delegate
    the I/O request to a separate thread or task.


    The following sections discuss further considerations regarding blocking.


    # Alternatives to I/O Blocking


    What are some alternatives to blocking that you can use? You may want your program
    to do other things while waiting for a system request to finish. The program could


    +   * Test the integrity of its data.

    * Start and track other requests.

    * Wait for several socket connections.

    * Process some CPU-intensive calculations.'
