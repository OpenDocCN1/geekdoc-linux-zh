- pgno: 106
  md: "delegate all network I/O operations to child-tasks. In fact, because different\
    \ servers have varying response times, splitting off a few threads to load information\
    \ from them may use your network channel more efficiently.\n\nHere is a good rule\
    \ of thumb for when to use multitasking: While waiting for I/O, the program could\
    \ simultaneously\n\n+   - Do other work—Process information or delegate tasks\n\
    \    - Respond to the user—User input or status reporting\n    - Serve other computers/people—One\
    \ task waits and accepts a connection while another serves an established connection\n\
    \nMixing threads and processes in the same program may seem to be unusual. However,\
    \ this is actually common in large, interactive applications. Internet browsers\
    \ usually mix them in that each browser window is a standalone process, while\
    \ each request, such as page loading, results from the browser firing off several\
    \ threads. You can mix and match threads and processes as you need them.\n\n#\
    \ Multitasking Characteristics\n\nNotice some common features in every task in\
    \ a process listing (using either the `top` or `ps aux` command). These features\
    \ help you work with them in a consistent way.\n\nFirst, every task has a parent.\
    \ Well, this is almost true. The process table listing shows a program called\
    \ *init*; this is the mother of all tasks on the system. Its primary responsibility\
    \ is to manage the tasks running on the system. The parent task creates and manages\
    \ the tasks it uses to delegate responsibilities. When the child completes, the\
    \ parent should clean up after its termination. If the parent does not clean up,\
    \ eventually *init* has to.\n\nEvery task uses memory, I/O, and priorities. The\
    \ most interesting programs that you write work with more information than the\
    \ context can hold—16-32 registers are not much. The memory is always measured\
    \ in terms of the RAM and swap that you set up on your computer. Programs use\
    \ this memory to store their current state (this is different from the task’s\
    \ context).\n\nYour programs need to interact with something, such as you or some\
    \ file. This implies I/O. Every task gets three standard I/O channels:\n\n+  \
    \ - `stdin` Standard input (input only), typically keyboard\n    - `stdout` Standard\
    \ output (output only), typically display\n    - `stderr` Standard error (output\
    \ only), typically display or log\n\nYou can change (or *redirect*) all of these\
    \ channels from within your program or when you execute it. Your choice of redirection\
    \ destinations can include other devices, files, or a different task. When creating\
    \ (or *spawning*) a task, the child task inherits all the parent’s open files.\
    \ How closely coupled this inheritance is depends on the type of task.\n\nEvery\
    \ task has an independent hardware stack. This is very important—especially if\
    \ you use the low-level task-creation system call (`clone()`, see later in this\
    \ chapter). Programs use the hardware stack to track function return values, local\
    \ variables, parameters, and return call addresses. If tasks did share their hardware\
    \ stack, they can immediately corrupt each other’s work.\n\nLastly, every task\
    \ has a unique priority. You can change the amount of CPU time your program uses\
    \ by raising or lowering the priority."
