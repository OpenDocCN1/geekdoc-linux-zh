- pgno: 44
  md: '# ## ID Field


    The IP subsystem gives each packet a unique ID. With only a 16-bit field, you
    can imagine that the numbers get used up quickly. Nevertheless, by the time the
    IP subsystem reuses an ID, the previous packet of the same value will probably
    have expired.


    The ID helps reassemble fragmented packets. If you elect to manage the header
    (IP_HDRINCL), you must manage the IDs yourself.


    # ### NOTE


    Custom IDs


    Keep in mind that your program is not the only one that may send messages if you
    choose to manipulate the header yourself. The IP subsystem keeps track of the
    IDs. You must use caution (and extra programming) to reduce the likelihood of
    selecting an ID that the subsystem recently used or may use.


    # **_dont_frag, more_frags, frag_offset Flags and Field**


    These flags manage how (or if) your packet fragments. If while traversing the
    network a lengthy packet has to go through a constricted network segment (one
    that cannot support the frame size), the router may try to break up the packet
    into smaller pieces (*fragmentation*). A fragmented packet remains fragmented
    until it arrives at the destination. Because each fragment adds its own IP header,
    the overhead diminishes performance.


    # ### NOTE


    Kernel Fragment Reassembler


    You can choose to reassemble fragmented packets with the Linux kernel when the
    host is a router. This option is part of the firewall/router section in the kernel
    configuration. Please note that it takes time to reassemble packets, especially
    if they are scattered and arrive at different times. However, since the destination
    has to reassemble the packet anyway, selecting this option reduces traffic on
    the network inside the firewall.


    The *dont_frag* bit tells the router or host not to break up the packet. If you
    set this bit and the packet is too large for a constricted network segment, the
    router drops the packet and returns an error (ICMP) packet.


    The *more_frags* bit tells the destination to expect more pieces of the fragmented
    packet. The last fragment sets this bit to 0. (A nonfragmented packet sets this
    bit to 0.) If you are configuring the header manually, always set this bit to
    0.


    The *frag_offset* field indicates where in the packet the fragment belongs. Because
    packet fragments may travel through different routes in the network, they may
    arrive at different times. The destination has to reassemble the packet, and it
    uses the offset to place the fragment in its proper location.


    The *frag_offset* field is only 13 bits long—far too short for a packet that can
    be up to 64KB. The offset is multiplied by 8 to place the actual byte position
    in the packet. This means that each'
