    #include <resolv.h>\nint recv(int sockfd, void* buf, int maxbuf,\n         int\
    \ options);\n```\n```\n\n# Return Value\n\nThe number of bytes read or -1 if an\
    \ error occurred.\n\n# Parameters\n\n| Parameter | Description |\n|---|---|\n\
    | `sockfd`  | The open socket descriptor |\n| `buf`     | The byte array to accept\
