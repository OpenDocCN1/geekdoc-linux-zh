    All threads that run in a class can actually be unrelated to the class's base\
    \ functionality. You really don't have any restriction. But if you encounter different\
    \ groups of responsibilities, be certain that in reality you don't have two different\
    \ classes. Two ways to determine whether you really have disparate classes include\
    \ how much the separate threads (parent and child) share and whether the child-thread\
    \ could exist without the parent's data or features.\n\nCreating a separate class\
    \ for each primary responsibility is good object design, and it really helps in\
    \ a multiprogramming environment. If you need access to each object's methods\
    \ or resources, create property control methods (`set()`/`get()`). By centralizing\
    \ all the attribute control through methods, you really build on encapsulation\
    \ and make thread synchronization easier.\n\n# Synchronizing Methods\n\nOne primary\
    \ advantage of threads is the capability to share resources. This causes the same\
    \ mutual exclusion problems that [Chapter 7](#) describes. Java solves this problem\
    \ by using `synchronized` methods.\n\nThe `synchronized` method replaces the semaphores\
    \ used in `pthread`. The declaration is\n\n```\npublic synchronized changeSomething()\n\
    {\n    /\\*\\*\\* Manage contended resource \\*\\*\\*/\n}\n```\n\nThe `synchronized`\
    \ keyword forces all entries in the method to happen one at a time. Before another\
    \ thread can enter the method, the first has to complete its call.\n\nSometimes\
    \ you need a little more control. For example, suppose you have three threads\
    \ (parent and two children) that control the incoming and outgoing of buffers\
    \ through a socket. You don't want to send a buffer until it is full, and the\
    \ child threads control the outgoing buffers. A synchronized method grabs control\
    \ of a buffer, but it is not full enough. The method could return a fail-value,\
    \ forcing the child to retry the call. Alternatively, the method could hold on\
    \ to the resource and force the thread to yield control temporarily.\n\nStepping\
    \ back for a minute, when threads contend for a controlled resource, they enter\
    \ a waiting queue. When the current resource owner exits the synchronized method,\
    \ the next thread in the queue grabs control of the resource. This continues as\
    \ long as the threads contend."
