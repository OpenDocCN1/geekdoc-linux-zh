    Up to this point, the book has covered sockets and network programming in C. The
    advantages of C-style programming is very clear to operating systems designers—the
    power without overhead is a real bonus. However, it does not always result in
    reusable or portable programs.


    Alternatively, you could use an object-enabled language and create a set of reusable
    tools. Java is a great example of excellent reuse and even portability. The whole
    foundation of Java is to provide two levels of portability—source level and code
    level. Source-level portability means that all programs must be able to compile
    on any platform. (You may note that Sun Microsystems reserves the right to expire
    or deprecate certain interfaces, methods, or classes.) This is very powerful because
    you can reuse code on any platform that supports Java.


    Code-level portability is not really new. The idea “Compile once, run everywhere”
    is easy to implement with the right tools. Java compiles to a byte code on which
    a virtual machine runs. The Java Virtual Machine (JVM) executes each command sequentially,
    acting somewhat like a microprocessor. Of course, interpreting the byte code does
    not ever approximate the speed of native machine language (which C compiles into),
    but because of the speed of modern microprocessors, the performance degradation
    is less noticeable.


    Java is a very powerful, simple, and fun language. If you know how to program
    in C/C++ and understand Object Technology, you’ve got a good start in programming
    in Java. The libraries in Java are expansive, covering many, many operations.
    You can easily get lost in all the available classes. Even if you learn Java and
    become thoroughly familiar with the class libraries, you may probably keep the
    Java Developers Kit (JDK) documents and a few printed references close at hand.


    The last chapter introduced the purpose of Object Technology and how to design
    using it. This chapter covers one socket implementation in Java; the next chapter
    defines a custom C++ socket framework. Because a topic to Java is so vast, the
    topics in this chapter primarily assume that you already know Java and want to
    move into network programming. Likewise, some of the examples on the companion
    Web site contain Abstract Windowing Toolkit (AWT) program code—discussing GUIs
    and events is beyond the scope of this chapter.


    The following sections discuss the classes that Java offers for sockets, relevant
    I/O, and threading. This chapter also discusses some of the newer methods that
    support socket configuration (as found in [Chapter 9, “Breaking Performance Barriers”](#)).


    # ## Exploring Different Java Sockets


    Like C, Java offers ways to access the Internet. In fact, some programmers say
    that the true benefits of Java arise from GUI independence and the inherent network
    programming. Java offers a few Internet protocols for your use, these primarily
    being TCP and UDP.


    The Java-preferred networking channel is the TCP channel. It, as noted in the
    first part of the book, has the most reliability. Also, it’s easier to use than
    the datagram-style of communication. Java still offers a UDP connection, but the
    I/O library does not offer any direct support for it.'
