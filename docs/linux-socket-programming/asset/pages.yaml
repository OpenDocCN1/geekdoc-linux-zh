    The Get() and Set() methods are not really methods. They are part of a special
    set of functions that do nothing more than create, read, update, and delete (CRUD)
    information. Methods are responsibilities: They do something. CRUD provides no
    features and is always assumed. Therefore, it is never counted in the method set.


    Subclasses inherit both properties and attributes from their parent classes.


