    # Chapter 18. The Power of Raw Sockets


    # IN THIS CHAPTER


    +   * *When Would You Use Raw Sockets?*

    * *What Are the Limitations?*

    * *Putting Raw Sockets to Work*

    * *How Does Ping Work?*

    * *How Does Traceroute Work?*

    * *Summary: Making the Raw Decisions*


    Sometimes the materials available do not fit the intent and needs of your project.
    When this happens, you have to start with very raw materials. TCP and UDP do not
    give you access to the raw guts of the IP packets. You have to delve deeper and
    do more foundational work.


    The raw socket offers you a lot of flexibility. Also, the programs that use raw
    sockets tend to be very simple and fast. This chapter details the use and intent
    of raw sockets and gives you tips on how to construct the packets.


    # When Would You Use Raw Sockets?


    The raw material of IP programming is only one layer above the actual network
    frame. When you use a raw socket, you don''t have the overhead of the higher-level
    protocols that can erode your network throughput. But, at the same time, you lose
    the features of the higher-level protocols. You must choose carefully when to
    use raw sockets.


    # Exposing the ICMP


    Using raw socket opens up the messaging (error) protocols. The higher-level protocols,
    such as TCP and UDP, lock you out of sending ICMP packets. Additionally, the IP
    API does not provide a $SOCK\_MSG$ (compared to the names $SOCK\_STREAM$ or $SOCK\_DGRAM$).
    To send $SOCK\_MSG$-style packets, you would have to create a raw packet, create
    and populate the ICMP header, and send it out.


    The ICMP subcommands offer several services as listed in Appendix A, "Data Tables."
    Some of the useful subcommands include echo (used in *ping*), time stamping, router
    request, and address masking. Of course, these functions are all very low level.
    ICMP is not designed to manage more than the simplest messaging tasks.


    # Controlling the IP Header


    Also, if you want to manage the IP header itself, you must use raw sockets with
    the appropriate socket option ($IP\_HDRINCL$). Referring back to Chapter 3, "Different
    Types of Internet Packets," the'
