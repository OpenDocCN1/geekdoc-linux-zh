- pgno: 137
  md: 'It can be pretty enticing to avoid I/O blocking, considering how much you can
    accomplish while waiting for a request. But, it''s difficult to create the environment
    for nonblocking unless you design it in from the start. (Retrofitting nonblocking
    support is very challenging and can involve a lot more work.) Choose from these
    three methods to help avoid blocking: polling, timeouts, and asynchronous I/O.


    # **NOTE**


    Asynchronous I/O Versus Signal-Driven I/O


    The algorithms for asynchronous I/O presented in this chapter are essentially
    signal-driven I/O, letting signals determine when I/O buffers are ready to read-from
    or write-to. True asynchronous I/O, as defined in POSIX.1, never blocks. In fact,
    starting a read would immediately return. The receiving buffers are considered
    unsafe until the read finishes and the program receives a signal. Linux does not
    (like many other operating systems) comply with POSIX.1 asynchronous I/O on sockets.
    To be consistent with the majority of the industry, this chapter uses the term
    "signal-driven I/O."


    # ## Comparing the Different I/O Programming Interactions


    To increase throughput and responsiveness, perhaps your most important tool is
    the creative use of the I/O subsystem. Your programs are subject to getting information
    from outside sources. Controlling when and how you block makes your program more
    responsive to the user. Linux offers essentially four different styles of I/O
    interaction. It''s helpful for you to take into account that each of the four
    different styles of I/O interaction has strengths and weaknesses. **Figure 8.1**
    shows a task reading a packet with the different interaction styles. The process
    begins with no data waiting in the kernel buffers.


    **Figure 8.1. Each style of I/O control varies the amount of time available to
    the task during a read.**


    ![](img/03334662da8fdfb8d95a02f270c522f6_137_0.png)'
