    &on, sizeof(on)) != 0 )\n      panic("set broadcast failed");\nbzero(&addr, sizeof(addr));\naddr.sin_family
    = AF_INET;\naddr.sin_port = htons(port);\naddr.sin_addr.s_addr = INADDR_ANY;\nif
    ( bind(sd, &addr, sizeof(addr)) != 0 )\n      panic("bind failed");\naddr.sin_port
    = htons(atoi(strings[2]));\nif ( inet_aton(strings[1], &addr.sin_addr) == 0 )\n      panic("inet_aton
    failed (%s)", strings[1]);

    ```


    After enabling broadcast, you can send messages to the broadcast address. You
    may want to create a process or thread for the receiver and the sender. Unlike
    other transmissions where you can expect a single reply for a single transmission,
    broadcasting can yield many replies for each message sent. If you do this, be
    sure to turn off the incoming queue on one of the channels.


    ```

    /*****\n***** Split the responsibilities into sender and listener *****\n/*****
    Close the sender''s listening channel. ***\n/*****\nif ( fork() )\n      Receiver(sd);\nelse\n{\n     shutdown(sd,
    SHUT_RD);     /* close the input channel */\n     Sender(sd);\n}\nwait(0);

    ```


    # Broadcasting Limitations


    Broadcast messages have a few problems. While you may be able to reach many computers
    at once with a single message, you can only reach those within your subnet. Still,
    you can increase your range of influence by changing your broadcast address. Unfortunately,
    you cannot use broadcasting on the WAN because the address `255.255.255.255` is
    no longer legal on the Internet. (You may even find that most routers do not allow
    broadcast messages to pass through at all. So, even if you have the right broadcast
    address, say `198.2.255.255`, the router at `198.2.1.0` may ignore the packet.)


    Additionally, everyone on the subnet hears your message. Because of the way the
    hardware implements broadcasting, all network cards pick up broadcast messages.
    This can place a lot of unnecessary burden on the hosts that don''t want the message.


    Another problem is the protocol. IPv4 only supports broadcasting on datagrams
    (TCP is excluded). If you want reliability and streaming, you must implement your
    own. Datagrams serve well in many'
