    Some attributes can be visible to the interface. These are the properties of the
    class. Do not use this feature unless you want to expose part of your class to
    the outside world. Usually, properties are either read-only definitions or are
    behind Get() and Set() guards. You never want to expose a pure variable to the
    outside.


    # NOTE


