  md: "This excerpt shows the child closing the socket descriptor ($\\mathrm{sd}$).\
    \ The client socket descriptor provides the connection to your client. Why does\
    \ the child close $\\mathrm{sd}$?\n\nWhen you create a child process, the child\
    \ shares the open file of the parent. If the child doesn't need that file, it\
    \ should close it. However, the child could leave the file open and read or write\
    \ just like the parent. This leads to how you may create several processes serving\
    \ the same socket:\n\n```\n```C\n/*************************************************************************/\n\
    /*** Creating a set of child-servers to await connection ***/\n/*** (\"Preforking-servlets.c\"\
    \ on Web site)   ***/\n/*************************************************************************/\n\
    int ChildCount=0;\nvoid sig_child(int sig)\n{\n    wait(0);\n    ChildCount--;\n\
    }\n...\nmain()\n{\n    /*** Attach signal; create & bind socket ***/\n    for\
    \ (; ;)\n    {\n        if ( ChildCount < MAXPROCESSES )\n        {\n        \
    \    if ( pid = fork() ) == 0 )     /*---CHILD----*/\n                for (; ;)\n\
    \                {\n                    int client = accept(sd, 0, 0);\n     \
    \               Child(client);  /*---Serve new client---*/\n                }\n\
    \            else if ( pid > 0 )           /*---PARENT----*/\n               \
    \ ChildCount++;\n            else                          /*---ERROR----*/\n\
    \                perror( \"fork( ) failed\");\n        }\n        else\n     \
    \       sched_yield();                /*--- OR, sleep(1)---*/\n    }\n}\n```\n\
    ```\n\nThis reverses the order of the accept() and fork(): Instead of creating\
    \ the process after a connection, this algorithm waits for the connection after\
    \ creating the child processes.\n\nThis code fragment may create 10 processes,\
    \ for example. All the child processes enter the forever loop waiting for and\
    \ processing connections. Assuming no connections are waiting, all 10 processes\
    \ I/O block (sleep). When a connection arrives, all of the process wake up, but\
    \ only one gets the connection. The remaining nine go back to sleep. This cycle\
    \ continues indefinitely.\n\nWhat happens if one of the child processes crashes\
    \ or terminates? This is why the parent never makes the accept() system call.\
    \ The parent's primary role is to make sure that the correct number of children\
    \ are always available.\n\nAt first, the parent creates the quota of child processes.\
    \ When a child terminates, the signal handler picks up the notification and decrements\
    \ the quota by one. When the parent resumes, it creates a new child. If the parent\
    \ does not need to create more, it yields the timeslice to another task."
