    \ *out* and *empty* because they don't complete their tests.\n\nEffectively, the\
    \ two routines are contending for four data resources: *queue*, *in*, *out*, and\
    \ *empty*.\n\n# Mutual Exclusion (Mutex)\n\nYou can handle critical sections by\
    \ locking out *mutual exclusion* (or simply *mutex*) other processes from using\
    \ the resource. *This serialization* (allowing only one task at a time) ensures\
    \ that the threads don't corrupt data in the critical sections. A mutex *semaphore*\
    \ is a flag that serializes access and acts like a traffic light. As long as the\
    \ flag is clear (green), the thread can enter the critical section. If the flag\
    \ is set (red), the thread blocks until clear (green) again.\n\nTo manage resources,\
    \ programs use either of two methods: coarse- or fine-grained locking. Coarse-grained\
    \ locking basically locks everyone out of doing anything while the program is\
    \ in a critical section. One coarse-grained method turns off timeslicing. You\
    \ face two big problems with this approach: it blocks unrelated tasks, and it\
    \ does not work in multiprocessing environments.\n\nFine-grained locking offers\
    \ you control over the contended resource instead of the tasks. A thread requests\
    \ access to a shared resource. If it is unused, the thread owns it until released.\
    \ If your thread finds the resource is already reserved, your thread blocks and\
    \ waits until the resource is released by the task currently using it.\n\nThe\
    \ Pthreads library offers you a wide selection of tools for managing your threaded\
    \ applications. Included is the Mutex API. The method of using mutexes is straightforward\
    \ (see *Listing 7.15*).\n\n# Example 7.15. Creating a Semaphore Example\n\n```\n\
    /\\********************************************************************/\n/\\\
    ** Define the global mutex semaphore. The value    ***\n/\\** indicates the checking\
    \ algorithm to use.    ***\n/\\********************************************************************/\n\
    pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;\n...\n/\\* Begin critical section\
