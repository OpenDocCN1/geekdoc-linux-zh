    # NOTE


    Using Pipes Requires Closing One End


    When the system creates a pipe, it connects the input channel to the output channel:
    The pipe effectively loops in on itself—whatever the program writes can be read
    by the same task (as if it were talking to itself). The same message still goes
    to the child, but the parent sees its own message in the input. Most communication
    paths are in one direction: the parent telling the child what it should process,
    so your process closes the unneeded channels. However, if you want true bi-directional
    communication, you need to call `pipe()` twice—one pipe for each direction (see
    Figure 7.3).


    ![](img/03334662da8fdfb8d95a02f270c522f6_120_0.png)


    > Figure 7.3. Your program can create an additional connection back if you want
