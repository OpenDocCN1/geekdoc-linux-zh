    Notice that the packet structure includes many more fields than the basic four
    fields discussed earlier in this chapter. The IP subsystem uses these additional
    fields for controlling the packet. For example, the dont_frag field tells the
    network that, instead of cutting up the message into smaller chunks, it should
    either accept the message completely or drop it.


    Most of the fields are simple enough that the comments next to them provide sufficient
    description. The remaining fields require a longer description. The following
    sections define the IP fields that you can modify or use. This text is not exhaustive;
    if you want to learn more about each field, please refer to a good text on TCP/IP
    protocols.


    # version Field


    The first IP field is the version number for the IP protocol version. Most of
    the values are either reserved or unassigned; for example, IPv4 places a 4 in
    this field. The few defined values are listed in Table 3.1.


    ![](img/03334662da8fdfb8d95a02f270c522f6_43_0.png)


    | Value | Description/Use |

    |---|---|

    | 4 | IPv4 |

    | 5 | Stream IP Datagram mode (experimental IP) |

    | 6 | IPv6 |

    | 7 | TP/IX (the "next" Internet Protocol) |

    | 8 | The "P" Internet Protocol |

    | 9 | TUBA |


    The only chance you have to fill this field is when you create a raw socket *and*
    you elect to fill the header yourself (using socket option `IP_HDRINCL`). Even
    then, you may set the field to 0. The zero flags the kernel to fill in the appropriate
    value for you.


    # header_len Field


    This field tells the receiver the header length in 32-bit words. Since the value
    0 is reserved (and meaningless), the greatest length is 15 words or 60 bytes.
    Again, the only circumstance in which you fill this field is with a raw socket
    packet and `IP_HDRINCL`. Since all IP headers are at least 20 bytes, the minimum
    value for this field is 5 (20/4) bytes.


    # serve_type Field


    The `serve_type` field indicates how to manage the packet. It has two subfields:
    a *precedence* subfield (ignored on most systems) and a type of service (*TOS*)
    subfield. You normally set *TOS* with the `setsockopt()` system call. *TOS* has
    four options: Minimum Delay, Maximum Throughput, Maximum Reliability, and Minimum
    Cost (monetary). No special service selected means normal management. (See Chapter
    9, "Breaking Performance Barriers," for details on `setsockopt()` and its values.)'
