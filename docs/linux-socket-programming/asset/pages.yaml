    \ socket() and bind(), the correct form is to use the PF style for socket( ) and\
    \ the AF style for bind(). If you are uncomfortable using the PF style, you can\
    \ safely use the AF style because the C header files define the AF style as the\
    \ PF style. The structure definitions are located in <bits/socket.h>.  \n\n\n\
