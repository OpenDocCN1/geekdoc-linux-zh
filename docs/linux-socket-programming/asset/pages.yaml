    # ## Supporting Versus Enabled Versus Oriented


    You may have noticed a few shades of terms—object-oriented and object-enabled.
    These are actual terms the object technology experts have defined for different
    languages. In reality, few object languages are truly object-oriented or *object-enforced*.
    SmallTalk is perhaps the only prevalent language that is object-enforced. Everything
    that you do in SmallTalk is with an object. Whether it is creating an instance,
    working with the source or compiler, or manipulating the framework, you simply
    cannot get around it.


    Most languages are *object-enabled*: the language supports and encourages the
    foundations, features, and extensions to object technology. For example, C++ is
    an object-enabled language. You can circumvent many of the features and simply
    compile C code with it. You can even define quasi-objects with many of the features—except
    for encapsulation and privileges—of a class by using `struct` instead.


    An object-enabled language lets you write code that does not force all the tenets
    of object technology. Even Java is object-enabled; you could write one huge `main()`
    in a single class definition with several supporting methods. True object-enforced
    languages are not limited to a single entry point; all the objects the program
    needs it instantiates (creates and runs) at startup.


    The loosest form of object-orientation is *object-supporting*. Essentially, an
    object-supporting language has object-enhanced features, but they are optional
    and are appendages to the language structure. You can get similar or equal power
    out of the language with or without the object support elements. A good example
    of an object-supporting language would be Perl or Visual Basic. Of course, object-supporting
    languages have limitations. Typically, you lose inheritance.


    To make up for the limitations, these languages often throw in a catch-all element.
    For example, Visual Basic offers the `variant` type to support abstraction and
    manual inheritance. Unfortunately, these catch-all elements break other foundations
    of object technology, such as encapsulation, reuse, maintainability, readability,
    and testability. Visual Basic’s `variant` type leaves the type determination up
    to the receiver, forcing the receiver to know private information about the data
    that it gets.


    # ## How to Map Objects to Non-Object Languages


    Object technology is great if you can program in an object-enabled programming
    language (such as C++ and Java). You gain a lot of benefits from the foundations
    and extensions and, if done right, your code becomes more reusable. However, not
    every shop supports or permits object languages. What can you do?


    Believe it or not, much of the foundation and features of objects can be deployed
    in any programming language, including COBOL and assembler (except for inheritance).
    It just takes discipline and a particular programming style. Unfortunately, nearly
    all the extensions are lost.


    Because much of object-orientation is based on previous technologies (abstraction,
    modular programming, and so on), the languages of that day have those features.
    The following are ways to get those benefits:


    +   * Encapsulation— Make sure that all the interfaces with your modules are procedures
    or functions. Trust that the programmers don''t crack open your code and use the
    variables and'
