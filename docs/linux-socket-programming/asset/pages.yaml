  md: 'For clarity, this chapter uses the term *task* to mean a executable system
    entity. Under this definition, *processes* and *threads* are tasks to simplify
    the discussion and help you understand multitasking within this context.


    # Defining Multitasking: Processes Versus Threads


    With multitasking, you can access the sheer power of Linux and other UNIX clones
    because you can use it to allocate the CPU time into independent slices of time
    (*timeslicing*) and space (system resources). Programs can accomplish more and
    work more efficiently if properly designed for multitasking.


    Tasks are separate executable units on your system. Every active thing you work
    with is a task. Computer multitasking is divided into two camps—*processes* and
    *threads* (or *lightweight processes*). These two terms are actually two extremes
    along a wide spectrum of data sharing. To understand how multitasking works, you
    need to know how the operating system separates individual tasks from one another.


    Each task groups information into different partitions of memory (*pages*). The
    operating system assigns each task a *page table*—a set of pages with each page
    performing a different function. The task uses these pages through the virtual
    memory (VM) subsystem of the microprocessor. The VM is a table that translates
    the program''s effective addresses to physical locations. When the operating system
    begins a task switch, it saves information about the task—the *context*—and loads
    the next task''s page table into the VM.


    # NOTE


    # Purpose of the Virtual Memory


    The virtual memory page table includes more information than just memory translation.
    It includes references to access rights (read/write/execute). The operating system
    also flags those pages that are swapped out to secondary storage. That way, when
    the program accesses the page, the microprocessor issues a page fault (page is
    missing). The page-fault handler then loads the missing page from secondary storage.


    The tasks can share different pages, depending on how they were created. For processes,
    Linux uses a *copy on write* algorithm. Processes do not share any data, but rather
    than copying everything all at once, the VM copies only those pages that the parent
    or child revises. Copy on write reduces the overhead of process creation, increasing
    your workstation''s performance. Part of the great performance you see in Linux
    is due, in part, to this delayed memory copy.


    Processes and threads each have their respective roles and rarely cross lines.
    These roles can help you to decide which to use. For example, you use a process
    to call an external program and get information from it. On the other hand, you
    can use the thread to process an image for display while loading it. This simple
    rule can help you decide between processes or threads: If you need to share data,
    use a thread.


    *Figure 7.1* shows what parts of a task you can share. In all cases, the tasks
    cannot share the stack and the context. The current thread''s library implementation
    defines a thread to share everything except the process ID (PID).


    ![](img/03334662da8fdfb8d95a02f270c522f6_104_0.png)


    **Figure 7.1. Linux tasks own several regions of memory.**'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/03334662da8fdfb8d95a02f270c522f6_105_0.png)


    During a task switch, the operating system replaces the current page table entries
    with those of the incoming task. This overhead can take several CPU cycles. You
    may see task switching overhead between 1μs and 0.1ms, depending on the microprocessor
    and its clock rate. That can be a long time—especially when Linux task switching
    is 100 times per second (every 10ms). Each task gets a portion of the CPU’s time,
    and part of this allocation is the task switch itself.


    On some UNIX versions, threads run faster because the task switcher has to flush
    fewer page table entries. The 2.0 and 2.2 Linux kernel versions showed a nearly
    identical switching time. This similarity is due to the finely tuned switching
    algorithms.


    Linux and other operating systems also support symmetric multiprocessing. If you
    write your programs to support multitasking, you get an automatic turbo charge
    when they run on symmetric multiprocessors. Basically, the rules are the same
    in Linux, only there are two or more processors to run the tasks. (At the time
    of this writing, Linux supports a maximum of 16 symmetric CPUs.)


    # When to Use Multitasking


    When should you use multitasking? Generally, a user should always have control
    over a program. Sometimes the program has to wait for other operations to complete,
    so it must use multitasking to interact with the user while waiting for the other
    operations. In the same way that Netscape allows you to access its menus while
    downloading a Web page, the parent program you design should'
