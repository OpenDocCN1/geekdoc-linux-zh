    # **Summary: Applying IP Numbering and Tools**


    The Socket API is a very flexible interfacing tool for network programming. It
    supports several different protocols, allowing you to connect to and interconnect
    with other networking protocols.


    The Internet Protocol uses addressing that builds in routing messages and clustering
    groups of computers. This makes each message autonomous from the originator: A
    message dropped on the network can get to the destination through routing and
    ARP tables. However, because of the addressing flexibility and sparse allocation,
    the addressing allocation is losing blocks of legal addresses.


    Part of the TCP/IP stack abstracts the network with ports. The majority of connections
    use ports to communicate with specific programs on other network computers as
    if they own the network connection. This feature eases programming and reduces
    the flood of messages that your program could actually receive.


    The network uses specific types and byte-orders (endianness) to hand messages
    back and forth. `sockaddr` defines the protocol, address, and port of the connection.
    Because of all these different data formats, the Socket API offers you many conversion
    tools for addressing (for example, `inet_addr()`, `inet_aton()`, `inet_ntoa()`)
    and endianness (`htons()`, `ntohs()`, `htonl()`).


    TCP and UDP offer different interfacing levels to your program. The next chapter
    defines the different types and capabilities of each protocol within the IP.


    # ## Chapter 3. Different Types of Internet Packets


    **IN THIS CHAPTER**


    +   - The Fundamental Network Packet

    - Dissecting the Various Packets

    - How the IP Protocols Fit Together

    - Snooping the Network with Tcpdump

    - Writing a Custom Network Snooper

    - Summary: Choosing the Best Packets for Sending Messages


    The physical network supports different types of logical networks like Novell
    (IPX), Microsoft (NetBEUI), AppleTalk, and of course, TCP/IP. Each logical network
    uses discrete data messages called packets, as defined in the last chapter. The
    packets can be actual messages on the transmission line (which has a lot more
    information included) or simply the message you''re sending.


    The logical network packet at the generic level consists of information about
    the source, destination, and data payload. Each logical network offers varying
    degrees of features and interfaces (protocols). All packet types and protocols
    are available with network programming. Each type has significant strengths and
    weaknesses. Like shopping for tools, your choice of packet type depends on how
    you use it.'
