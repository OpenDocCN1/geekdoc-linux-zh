  md: 'For legitimate purposes, being able to serve up messages without joining is
    a real plus. This way, your server can avoid being hit by the traffic associated
    with multicasting.


    # ## How the Network Provides Multicasting


    The way operating systems (such as Linux) implement multicasting can lead to a
    barrage of messages. Knowing how it works can help you with performance considerations
    and how to filter messages quickly.


    Many NICs support a form of MAC aliasing (taking on an additional identification
    for a short time). All NICs have assigned MAC addresses. Unlike broadcasting,
    which uses a broadcast address (`FF:FF:FF:FF:FF:FF`), multicasting creates a temporary
    MAC address using the multicast address as the key. The standard prefix for multicast
    MACs is `01:00:5E`, and the last three bytes (actually 23 bits) come from the
    multicast address. For example, a multicast address `224.138.63.10` (`E0:8A:3F:0A`)
    morphs into a MAC address `01:00:5E:0A:3F:0A` (note that the 8 in 8A is dropped).


    The operating system takes this address and programs the NIC to accept that address.
    NIC accepts this programming in three ways:


    +   * **Tag Table**— The NIC holds the entire address verbatim. It checks every
    message on the network against its own MAC and all the MACs in this table. This
    is 100% reliable.


    +   * **Hash Key (imperfect filtering)—** The NIC hashes the MAC into a 64- to
    512-bit hash array. When a message passes through the network, the NIC hashes
    that MAC address. If the corresponding bit is on in the array, the NIC accepts
    the message. This approach can accept messages not intended for the host. The
    next layer is then responsible for filtering out unwanted messages.


    +   * **Promiscuous Mode—** Some cards cannot support multicasting. The alternative
    is placing the card in promiscuous mode and receiving all messages. The next layer
    must drop all unwanted messages. This is least desirable.


    The network cards have no concept of ports, so the higher layers in the IP stack
    must move messages to their appropriate queues or drop them. Remember that, even
    though you are not listening to a port, your host gets all messages multicast
    on the address you joined. If you select UDP or TCP, the kernel filters the ports
    for you. If you select a raw socket, you must do the filtering in the program.


    # ## Getting Out the Multicast Message


    The first step in getting multicast messages is writing the program and enabling
    the host''s hardware and kernel for multicasting. The next step is telling the
    routers that you want the message. This is not all. Your multicast messages face
    several obstacles before getting out to the WAN''s baseband.


    You may have to perform other tasks to get the messages out. This section discusses
    these issues and ways to solve them.


    # ## Letting the Routers Know


    The Internet tries to get a message from originator to destination using two addresses—the
    IP address and the MAC. The MAC is rarely known before the message is sent out,
    and the IP address has built-in routing. But the routers expect but one destination
    for a given message—having two destinations for a single address is typically
    an error.'
