    # ## Chapter 7. Dividing the Load: Multitasking


    # ### IN THIS CHAPTER


    +   - [Defining Multitasking: Processes Versus Threads](#)

    - [Beating the Clock: Race Conditions and Mutex](#)

    - [Controlling Children and Killing Zombies](#)

    - [Extending Current Clients and Servers](#)

    - [Calling External Programs with the exec Server](#)

    - [Summary: Distributing the Process Load](#)


    Imagine all the tasks you could do if you could work on many disparate activities
    at the same time. This *parallel tasking* allows you to focus efficiently on different
    tasks without distraction. In fact, the mind is able to do just that. For example,
    you can clean out the basement while contemplating a particularly hard algorithm;
    or you can stew on a mathematical problem while reading some science fiction.
    Each is an example of parallel- or multitasking.


    Up to this point, you have created a few clients that connect with network servers,
    programmed peers to share information, and written a couple servers. But in all
    these cases, each program does only one task at a time. The server allows only
    one client; and an incoming client- connection has to wait while the server services
    current client. Wouldn''t it great to accept more than one connection at a time?
    How about connecting your client to several servers at once?


    Multitasking is very powerful and can ease programming if you think of parallel
    or multiple tasks with designated responsibilities. Above all, write your code
    to be comprehensible by your peers. Revising your good source code to implement
    multitasking without proper planning can easily yield unwelcoming and unmanageable
    code.


    This chapter encompasses the often confusing topic of multitasking, covering both
    processes and threads. Along with how and when to use them, this chapter describes
    their uses, differences, strengths, and weaknesses. Additionally, this chapter
    introduces signals, locking, and deadlock.


    As you might guess, the topics presented in this chapter are rather extensive.
    You can find entire college texts devoted to these issues. However, this chapter
    presents only the multitasking essentials for network programming. So, the discussion
    focuses on the information that you need to get your job done quickly and easily.'
