  md: "The primary difference is how much time the program spends in the system calls.\
    \ The signal-driven I/O spends very little time in the `send()` and `recv()` system\
    \ calls: the kernel tells your program when it is ready. On the other hand, polling\
    \ has to repeatedly make system calls.\n\nThe algorithm in Listing 8.3 provides\
    \ a general idea how the process works.\n\n# Example 8.3. Signal-Driven I/O Algorithm\n\
    \n```\n/*******************************************/\n/*** General Asynchronous\
    \ or Signal-Driven I/O Algorithm ***/\n/*******************************************/\n\
    int ready=0;\n...\nvoid sig_io(int sig)\n{\n    /**** IF RECV(): Get all pending\
    \ data *****/\n    /**** IF SEND(): Send all processed data *****/\n    ready\
