  md: 'The program fills an array of `pollfd` structures before it uses this system
    call. The `cnt` parameter is the number of legal socket descriptors in the array.
    (Remember to keep these descriptors contiguous; if one closes, compress the array.
    Not all implementations deal well with an empty slot.) The `timeout` parameter
    acts like the `select()` timeout but in milliseconds.


    Either the `select()` or the `poll()` system calls provide the power to monitor
    several channels at the same time. With good planning, you can avoid some of the
    overhead problems multitasking encounters.


    # Implementing Timeouts


    A simple alternative to polling I/O channels is to tell the operating system that
    you do not want to wait longer than a specified time. The Linux system calls do
    not provide a direct way of doing this. Consider using these ways to implement
    timeouts:


    +   - With the timeout in the `select()` or `poll()` system call

    - With a signal (`SIGALRM`) to wake up the task


    NOTE


    Linux Socket Timeout Support


    The socket options include timeouts for sending (`SO_SNDTIMEO`) and receiving
    (`SO_RCVTIMEO`). Unfortunately, these parameters are read-only for now; on Linux,
    they default to `OFF`. If you try to port some code that uses these parameters,
    you may have to use the other two methods.


    The `select()` and `poll()` system calls (described previously) supply a timeout
    parameter in microseconds. Using these system calls is perhaps the easiest way
    to implement timeouts, but the timeouts apply to all channels in the call.


    This situation can be a problem: Suppose you have three channels, and one of them
    is not very responsive. Using just these system calls, you cannot detect that
    the failing channel should have timed out and closed. You can manually keep individual
    times for each channel, resetting the time with each response. Still, that may
    be a lot of unnecessary checking and logging.


    You can use an alternative instead: an `alarm` signal. An `alarm` is a clock that
    runs in the kernel. When the `alarm` goes off, the kernel sends a `wakeup` call
    to the task in the form of a `signal`. If the task is waiting in a `system` call,
    the `signal` interrupts the call, the task enters the `signal` handler, and then
    the `system` call returns with an `EINTR` error.


    Every task can send itself a `signal`, but the task needs to know what to do with
    the `signal`. On some systems, the `sleep` library call uses the `alarm()` system
    call, first setting up the task to capture the `SIGALRM` `signal`. Please look
    at the following `example`:


    ```

    /********************************************************************/

    /** Example: Timeout example using the alarm() system **/

    /** call. (Except from echo-timeout.c on CD.) **/

    /********************************************************************/

    ...

    int sig_alarm(int sig)

    { /** do nothing **/}

    ...

    void reader()

    ```'
