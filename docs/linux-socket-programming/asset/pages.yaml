- pgno: 59
  md: 'You can think of message passing from two different angles: continuous and
    without interruption (TCP) or discrete packets of information (UDP). While continuous
    data flow is like a telephone transmission, the discrete packet is like a letter
    in an addressed envelope.


    The continuous flow requires you to have an established connection with the destination.
    This makes sure that no information is lost during the interchange and is in order
    when it arrives. The discrete messages permit you to make a connection merely
    to ease programming. Without the connection, your program has to place an address
    on each message.


    This chapter discusses connection-based and connectionless interfaces. The comparisons
    and examples may help you choose the most appropriate type for your applications.


    # What Are Connection-Based Sockets?


    Linux (and all UNIX-type operating systems) offers essentially three different
    levels of communication for your programs. All the levels require using the `socket()`
    system call. These levels expose you to the dynamics of network programming and
    can make programming challenging.


    The three basic protocols (raw IP, UDP, and TCP, as defined in Chapter 3, "Different
    Types of Internet Packets") abstract the network and add reliability while necessarily
    whittling away performance. The highest level, TCP, has the greatest reliability
    of all protocol levels. It guarantees that the data reaches the destination correctly
    and in order. It is so reliable that you could consider it like a file or an interprocess
    pipe. That is why TCP sockets are *connection-based* sockets.


    # Open Channels Between Programs


    TCP sockets provide an open bi-directional channel between two programs. Like
    a microphone headset, the channel sends and receives streaming information without
    break. The programs may send information to each other simultaneously without
    having to reassemble the dialog from individual messages.


    TCP also remembers who you are talking to. Each message in lower levels of the
    IP protocol has to provide the destination address with each message. That is
    like dialing your friend''s number each time you want to take your turn to speak.


    When you connect to the other program (using the `connect()` system call), your
    socket then remembers the destination address and port. Also, you can use the
    higher-level library calls designed for streamed I/O, like `fprintf()` and `fgets()`.
    This simplifies programming tremendously.


    As you design your program, the TCP protocol helps you avoid the data loss problems
    that may occur with other protocols. This simplicity lets you focus on your program.


    # Reliable Communications


    TCP''s streamed I/O, high reliability, and access to the higher level I/O imply
    that the data path is clear and unencumbered. TCP guarantees reliable communications:
    The peer receives everything the program sends. The network subsystem that includes
    the devices and protocol stacks (either on the server or client) accepts a message,
    checks it, and passes it on to the program.'
