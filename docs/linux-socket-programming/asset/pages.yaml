    else if ( count == 0 )\n      fprintf(stderr, \"Timed out!\");\nelse\n      perror(\"\
    Select\");\n...\n```\n\nIn this example, when the `select()` system call returns\
    \ with a positive value, one of the three channels has data to read. To find out\
    \ which channel is ready, add the code needed and read in the data. However, if\
    \ the return value is zero, the call exceeded the 5.25-second time limit.\n\n\
    The `poll()` system call is similar to `select()` and may be a little easier to\
    \ manage. It uses an array of structures to define the behavior:\n\n```\nstruct\
    \ pollfd\n{\n    int fd;          /*  the descriptor to test  */\n    short events;\
    \   /*  requested events to watch  */\n    short revents;  /*  events that fired\
    \  */\n} ;\n```\n\nThe first field, `fd`, is the file or socket descriptor. The\
    \ second and third fields, `events` and `revents`, are bit masks for specific\
    \ events:\n\n+   *   `POLLERR` Any error condition. Return if any error occurs\
    \ on channel.\n*   `POLLHUP` Hang-up on other end. Return if peer hangs up.\n\
    *   `POLLIN` Incoming data. Return if data ready for reading.\n*   `POLLNVAL`\
    \ `fd` not open. Return if the channel is not an open file or socket.\n*   `POLLPRI`\
    \ Priority messages. Return if a priority message arrives.\n*   `POLLout` Channel\
    \ availability. Return if a `write()` won't block.\n\nThe system call to `poll()`\
    \ looks like this:\n\n```\n#include <sys/poll.h>\nint poll(struct pollfd *list,\
    \ unsigned int cnt, int timeout);\n```"
