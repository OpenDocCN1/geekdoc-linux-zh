    Note that `sa_family` and `sin_family` are common between the two structures.
    The task every procedure call executes when it receives this record is to check
    the first field. Please notice that this is the only field that is in *host byte
    ordering* (see Chapter 2). The padding field (named `sa_data` and `__pad`) may
    be common for each in the `sockaddr` family. By convention, the generic `sockaddr`
    structure and the INET `sockaddr_in` structure have to be 16 bytes long (the IPv6
    structure, `sockaddr_in6`, is 24 bytes). So, the padding field fills out the structure
    with any unused bytes.


    You may notice that the length of the padding field `sin_in` is missing. This
    is merely a convention. Since the padding has to be set to zero, the actual size
    is not important. (In the case of this `sockaddr_in` definition, it is 8 bytes
    wide.) Some implementations may define additional fields for internal computations.
    Don''t worry about them—and don''t use them, because you can''t guarantee the
    field''s availability from system to system and version to version. Any changes
    may break your code when you use nonstandard fields. In all cases, initializing
    the entire structure instance to zero is best.


    The following table describes each field. It also gives examples of possible values.


    | **Field Name** | **Description** | **Byte Ordering** | **Example** |

    |---|---|---|---|

    | `sin_family` | The protocol family | Host, Native | AF\_ |

    | `sin_port` | The server''s port number | Network | 13 (time of day) |

    | `sin_addr` | The server''s numeric IP address | Network | 127.0.0.1 (localhost)
    |


    Before calling the `connect()` system call, the program fills each field. Linux
    has masked the system call slightly, so it is not necessary to cast `sockaddr_in`
    to be a `sockaddr`. For portability, you may still want to follow conventions
    and add the casts.


    NOTE


    # Casting `sockaddr` Types


    With other UNIX-compatible OSs, you can cast any of the `sockaddr *` family members
    to `sockaddr` to avoid warnings. The examples here don''t use any casting merely
    for space (and because Linux allows it).


