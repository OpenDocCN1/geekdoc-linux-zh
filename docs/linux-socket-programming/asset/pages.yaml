    \ you many more function tools than these. This book covers only a few that are\
    \ consistently useful. For more information on these function calls, see Appendix\
    \ B.\n\n# NOTE\n\n# Aiming for Portability\n\nFor those of you who think that\
    \ you may not have to worry about these conversion tools, consider this: The whole\
    \ idea of writing Linux software is to make it compatible with all systems, right?\
    \ It does not hurt anything to use these calls despite the platform. Generally\
    \ it's good programming practice to program as if it were to be ported to another\
    \ processor.\n\nIf you are trying to convert one format to another, you may find\
    \ the appropriate converter in some library. That's the beauty of using established\
    \ technology like POSIX compatibility. Of course, that means that there are many\
