- pgno: 216
  md: 'The unpacking method, `Unwrap()`, does the reverse. It takes the block of data
    from the caller and begins to reassemble the internal information. Sometimes,
    the message may be incomplete, so `Unwrap()` must get more data to finish the
    reassembly. For example, the `TextMessage` may be larger than 64KB (the buffer
    limit), so the `TextMessage` class must be smart enough to ask for more data.
    The `Unwrap()` method returns a Boolean to indicate whether it''s done.


    # Addressing: Identifying the Source and Destination


    Each message comes from and goes to some host. The addressing of these hosts is
    important for getting the message to the rightful owner. Another simple component
    is `HostAddress`. Using the `struct sockaddr` addressing names, this component
    manages the name and resolution to an IP level.


    The framework translates all addresses into this component. And, the component
    can support several addressing types.


    # Sockets: Establishing, Configuring, and Connecting


    The last component has the most functionality. It is based on the `Socket` class
    and derives all basic connections. It uses the other components to get the job
    done. The hierarchy places the basic functionality in the `Socket` class and all
    specializations in the inherited classes.


    All protocols listed in the requirements list have a dedicated class: `SocketServer`,
    `SocketClient`, `Datagram`, `Broadcast`, and `MessageGroup` (multicast). All protocol-specific
    configurations reside in the appropriate protocol-class. When you need to change
    a setting, look at the protocol you are using. If you do not find it, look in
    the parent.


    The classes also assume you are following proper rules. From the earlier `send()`
    example, the classes do not check for a connected socket. Instead, the program
    throws an exception.


    # Creating the Framework Hierarchy


    The components ease the transition into connecting the objects together. The components
    provide the interface for the outside world and may hint at the features of the
    top-most parent (*superclass*). Before working on the framework hierarchy, you
    need to have defined the non-abstract classes within each component.


    At this point, you should have several classes, such as those listed in the last
    section. From there, you find the relationships and inheritances. Don''t be surprised
    to see features disappear and reappear from parent to child. This is normal, and
    often is still implementable.


    # Relationships


    The first step is to identify the relationships between the components and the
    classes. Use general terms, such as *uses*, *is-a*, *has-a*, and *throws*, to
    label the connections between component or class.


    In Figure 13.2, the different components are connected to show how they interact
    with each other. Some diagram systems use special line ends (such as arrows).
    Use whatever you are most comfortable with. The most important factor is clarity.


    ![](img/03334662da8fdfb8d95a02f270c522f6_216_0.png)'
