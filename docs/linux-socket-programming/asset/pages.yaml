    /* ************************************************** */\n/** Jumbo (extra large)\
    \ packet option definition    ***/\n/* **************************************************\
    \ */\nstruct Jumbo_Payload\n{\n    unsigned char option;   /* equals 194 */\n\
    \    unsigned char length;   /* equals 4 (bytes) */\n    unsigned long bytes;\
    \    /* payload length */\n};\n```\n\nWith this option, you can send up to a 4GB\
    \ packet. Not too bad for a little while.\n\n# Converting ICMPv6 Sockets to IPv6\n\
    \nThe physical layout of an ICMPv6 header [RFC2463] is the same as for an ICMPv4,\
    \ but the `type` and `code` fields have changed considerably. For example, echo\
    \ request and echo reply have new numbers (128 and 129, respectively). Several\
    \ codes are no longer supported. For a complete list of codes, refer to Appendix\
    \ A, \"Data Tables.\"\n\n# The New Multicast Protocol\n\nAnother architectural\
    \ change is in the way IPv6 manages multicasting. It has to work with three aspects:\
    \ hardware, addressing, and routing.\n\nAs Chapter 17, \"Sharing Messages with\
    \ Multicast, Broadcast, and Mbone,\" describes, multicasting has to work with\
    \ the hardware to tell it to pick up packets that are not its own ethernet or\
    \ MAC address. These addresses depend on the requested multicast address—IPv6\
    \ takes the last four bytes of the address and creates a MAC address with the\
    \ prefix of 33:33. For example, if the requested multicast address is FF02::725:6832:D012,\
    \ the resulting MAC would be 33:33:68:32:D0:12 (ignoring the 725).\n\nIPv6's addressing\
    \ for multicasting differs slightly from that of IPv4. The first byte, FF, indicates\
    \ that it is a multicast address, but the next byte contains additional information\
    \ about the type of multicast group and routing details, each four bits wide.\n\
    \nThe first subfield has four bit-flags each representing a feature. The least\
    \ significant bit (bit #0) is zero (0) to indicate a well-known multicast address.\
    \ It is one (1) to indicate a transient address. The other three bits are currently\
    \ reserved.\n\nThe other subfield likewise has four bits and indicates the scope\
    \ of the address (a local or global address). The higher the number, the wider\
    \ the scope. On the other hand, IPv4 uses just the TTL to determine the scope\
    \ (lower numbers would expire before reaching global addresses). Also, as stated\
    \ in Chapter 17, IPv4 has allocated certain address blocks to local, site, or\
    \ global scopes. Table 19.2 defines the different scopes.\n\n| Scope | Range |\
    \ Description |\n| :---- | :---- | :---------- |\n| 1 | Node | Local on the same\
    \ host (like 127.0.0.1). |"
