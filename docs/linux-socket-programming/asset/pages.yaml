    \ & POLLHUP )\n                    /*** close connection ***/\n            }\n\
    \        }\n        else if ( result < 0 )\n            perror(\"poll() error\"\
    );\n    }\n}\n```\n\nThis shows the responsibilities of the parent and the children.\
    \ The parent accepts connections and places them in the fds[ ] array. The children\
    \ wait on each range of connections. (If the events field in the pollfd structure\
    \ is zero, your call to poll( ) skips that entry. If the array has no active descriptors,\
    \ poll( ) just waits for the timeout period before returning zero.)\n\nYour client\
    \ program can use the advantages of a threaded connection as well. As you read\
    \ in Chapter 7, threads do very well in sending out multiple independent requests,\
    \ gathering the information, and summarizing it. Your client can do all this in\
    \ tandem, because most of the time spent in network communication is waiting for\
    \ the servers. Since threads inherently share their data, you can fire off several\
    \ requests and interpret some results while waiting for the rest.\n\n# Delving\
    \ Deeper into Socket Control\n\nControlling your algorithms around the sockets\
    \ and connections is one part of increasing server and client performance. You\
    \ also need to control the socket itself. Previous chapters mention a few options\
    \ you can use to configure the socket to your needs. This section defines many\
    \ more.\n\nYou can control all socket configuration options using the getsockopt(\
    \ ) and setsockopt( ) system calls. These system calls configure general and protocol-specific\
    \ options of your socket. Appendix A, \"Data Tables,\" has a summary of all available\
    \ options. The prototypes for these calls are as follows:\n\n```\nint getsockopt(int\
    \ sd, int level, int optname, void *optval, socklen_t *optlen);\nint setsockopt(int\
    \ sd, int level, int optname, const void *optval, socklen_t optlen);\n```\n\n\
    Every option has a level. Currently, Linux defines four socket levels: SOL_SOCKET,\
    \ SOL_IP, SOL_IPV6, and SOL_TCP. Each option has a type: Boolean, integer, or\
    \ structure. When you set or get an option, you place the option in optval and\
    \ declare the size of the value in optlen. When you get an option, the call returns\
    \ the number of bytes it used through optlen."
