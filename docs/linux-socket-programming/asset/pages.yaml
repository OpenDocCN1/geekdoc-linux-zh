  md: "As always, the `sd` parameter is the socket descriptor. As with the `recvfrom()`\
    \ system call, the last two parameters provide the call a place to write the client's\
    \ address and port number. Unlike the `recvfrom()` system call, the last two parameters\
    \ of `accept()` are *optional*. If you do not want to pick up the caller's address\
    \ and port number, simply set these parameters to zero.\n\nBe sure to make the\
    \ `addr` parameter size large enough to accept the address it's expecting. Don't\
    \ worry about corruption due to buffer overflow; the call does not exceed `addr_size`\
    \ bytes. In most cases, the client connections are the same size as the protocol\
    \ (for example, `AF_INET` for `sockaddr_in` or `AF_IPX` for `sockaddr_ipx`). The\
    \ call passes `addr_size` by reference so your program can determine the actual\
    \ number of bytes used (see **Listing 6.4**).\n\n# Example 6.4. Accept() Example\n\
    \n```\n/*************************************************************/\n/*** Accept\
    \ Example: Wait for and accept a client        ***/\n/*** connection.        \
    \                                 ***/\n/*************************************************************/\n\
    int sd;\nstruct sockaddr_in addr;\n\n/*** Create socket, bind it & convert it\
    \ to a listener **/\nfor (;;)                                /* repeat this indefinitely\
    \ */\n{\n    int clientsd;                       /* the new socket descriptor\
    \ */\n    int size = sizeof(addr);            /* reassign the size of addr */\n\
    \n    clientsd = accept(sd, &addr, &size); /*await connection */\n    if ( clientsd\
    \ > 0 )                 /* no error occurred */\n    {\n        /**** Interact\
    \ with client ****/\n        close(clientsd);                /* clean up and disconnect\
    \ */\n    }\n    else                                /* accept error */\n    \
    \    perror(\"Accept\");\n}\n...\n```\n\n# Communicating with the Client\n\nNotice\
    \ that the listing closes `clientsd`. The `clientsd` socket descriptor differs\
    \ from `sd`, the main socket descriptor. It's important to close `clientsd` because\
    \ each connection generates a new descriptor. Failing to close each connection\
    \ can cause you to eventually run out of file descriptor slots.\n\n# NOTE\n\n\
    # Reusing the `addr` Variable\n\nYou can reuse the `addr` local variable from\
    \ the `bind()` system call. After you have completed the `bind()` for the server\
    \ port, the server no longer needs that information. It's then safe to use that\
    \ variable for other purposes.\n\nRemember that most of the parameters are in\
