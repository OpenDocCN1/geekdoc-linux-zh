    \ = accept(sd[i], &addr, &size)) > 0 )\n\t\t\tSpawnServer(sd[i], i);\n\n\t/ ****\
    \ Do housekeeping ****/\n}\n\"\";\n```\n\nThis may seem like a great idea, but\
    \ creating a separate task for each `accept()` may be more manageable. In fact,\
    \ the best solution is to use the `select()` system call, which waits for a number\
    \ of I/O channels to unblock (refer to Chapter 7, \"Dividing the Load: Multitasking,\"\
    \ for more information on `select()`).\n\n# ## Asynchronous I/O\n\nGetting the\
    \ operating system to tell you when a channel is ready for more I/O requests turns\
    \ around the problem of file I/O in your favor. This affords more time for the\
    \ program to spend on computation and less time stalled in various system calls.\n\
    \nAn asynchronous read is similar to the blinking light on an office phone indicating\
    \ voicemail. In the same vein, the telephone callback feature is like the asynchronous\
    \ write. Picture asynchronous I/O as a notification of channel availability.\n\
    \nThe system implements this asynchronous I/O with the `SIGIO` signal (sometimes\
    \ called *signal-driven I/O*). Programs get a `SIGIO` when data is ready for reading\
    \ or when a write channel is ready for more data. As with all signals, you know\
    \ nothing more than a signal occurred. So, in the case of a program getting an\
    \ `SIGIO` when two channels are open, it is not readily apparent which channel\
    \ to check.\n\nExceptions present another problem. The kernel does not issue a\
    \ signal if an error occurs on the channel. It's not readily apparent when a program\
    \ loses connection with the client, unless you actually test the channel in the\
    \ program.\n\nThe program begins the signal-driven I/O by instructing the kernel\
    \ to accept a `SIGIO` signal. When the signal arrives, the signal handler sets\
    \ a flag that the main program watches. The main program loop in turn begins processing,\
    \ occasionally checking the flag that indicates the signal arrived. The handler\
    \ may do the I/O processing itself and then flag the main loop, or it could just\
    \ leave the I/O for the main loop.\n\nHow does this differ from polling? Both\
    \ algorithms need to check periodically if the I/O channel is ready. Polling calls\
    \ don't block the system calls but do require periodic checking. Similarly, the\
    \ main loop has to poll on the flag being set by the signal-driven I/O."
