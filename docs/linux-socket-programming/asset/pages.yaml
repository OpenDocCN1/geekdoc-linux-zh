    \ depending on the key variable Err. The rpcgen tool converts this into structure\
    \ with a union:\n\n```\n```\n/***** RPC genrpc code snippnet result ******/\n\
    /***** RPC genrpc code snippnet result ******/\nstruct proc_res\n{\n    int Err;\n\
    \    union\n    {\n        char *Data;\n    } proc_res_u;\n};\n```\n```\n\nThe\
    \ union is very useful if you want to send back a specific error code without\
