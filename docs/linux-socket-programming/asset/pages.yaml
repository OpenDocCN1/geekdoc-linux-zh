    In this excerpt, the receiver requests a port and then waits for an incoming message.
    If it gets a message, it processes the request and replies with the result.


    The sender just transmits one message. The receiver, on the other hand, acts more
    like a server, receiving, processing, and replying to every message that arrives.
    This presents a fundamental problem between these two algorithms: allocating enough
    space for the entire message.


    If your program requires a variable-length message, you may have to create a larger
    buffer. The largest UDP message is about 64KB; that is ultimately your largest
    size.


    # NOTE


    **Large UDP Messages**


    If the message is larger than the buffer, the message queue drops any remaining
    bytes of the incoming message. This applies to many of the protocol families that
    support datagrams.


    # ## Ensuring UDP Message Arrival


    Dropping a message that is only half read may not seem like a good idea. When
    using the UDP protocol, there are several issues that you need to be aware of.
    As mentioned above, you need to know how big the message is. UDP is also unreliable,
    meaning that you cannot guarantee that the destination got your message.


    You might think that in all cases you need reliability, but not all systems really
    need it. For instance, some messages are very time critical. As soon as the time
    expires, the significance of the message reduces to nothing.


    If you want to beef up UDP (without going 100% to TCP), you could take several
    steps. In fact, you could exceed the reliability of TCP rather easily.


    # ## Strengthening UDP''s Reliability


    The whole idea behind TCP is to provide a streamable interface between the client
    and the server. TCP introduces overhead that reduces performance perceptibly throughout
    the communication. Still, unlike UDP, it can guarantee the arrival of each message.
    If you want that guarantee in UDP, you have to add your own code.'
