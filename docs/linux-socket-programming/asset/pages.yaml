    # Signaling a Course Change: Folding


    The poker game has few direct, asynchronous controls. A player can fold (step
    out of the current game) at any time. If the game were held in the Old West, a
    cheater might meet a sudden, asynchronous termination. In any case, the dealer
    picks up the dropped cards. Likewise, after you have started a process, you can
    change its course or your parent task can get notified of termination with signals.


    Every task you program should handle all useful signals. There are approximately
    30 different kinds of signals (two signals are user-defined). Most signals you
    can ignore or not capture because the likelihood that they occur is slim or to
    capture them is not meaningful. Many uncaught signals usually terminate your program,
    and some of these are important to multitasking programs. For example, the system
    notifies the parent when a child terminates with a SIGCHLD signal.


    A signal is similar to an interrupt; the only information is that the signal occurred.
    When the signal arrives, the task stops what it is doing and jumps to a specified
    routine (called a signal handler). For SIGCHLD, you can call wait() to clean up
    the child''s termination. You also can support other signals, such as math errors
    or Ctrl+C breaks.


    Linux supports two styles of signals: System V (a one shot signal that reverts
    back to the default handler when the system calls your custom handler) and BSD
    (that keeps its handler until told otherwise). If you use the signal() system
    call, the single-shot is the default. You may not be interested in this feature—you
    should expect to capture the signal repeatedly.


    # NOTE


    Resetting the Signal Handler


    To reset the handler, some programs used to fix the one-shot System-V behavior
    by placing a call to the signal system call directly in the signal handler. Unfortunately,
    this can create a race condition; a signal could come in before the call to reset
    it. As a result, the signal may be lost.'
