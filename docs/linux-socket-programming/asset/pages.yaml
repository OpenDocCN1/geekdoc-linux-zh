    # Not Needing the Details: Abstract Programming


    Some details are so remote from the implementation needs that programmers began
    to look at abstract computer science concepts. With modular programming, data
    could be simply blocks of data with little meaning to the module. A classic example
    is a queue or FIFO (first in, first out); the algorithm does not need to know
    what is going in—only that it must come out.


