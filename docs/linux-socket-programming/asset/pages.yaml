- pgno: 98
  md: '# General Rules About Defining Protocols


    When communicating with other computers, your programs need to agree on a procedure
    of interaction. Two very important actions are "Who talks first?" and "When are
    we done?" This agreement defines a transaction-protocol.


    The client and server use these procedures to ensure that they don''t transmit
    at the same time or blindly wait for each other to transmit first. As you build
    servers, consider the questions in the following subsections.


    # Which Program Talks First?


    Most servers talk first. But, high security systems sometimes wait for the client
    to send the first message. The process you use can have the client identify itself
    (more than the standard host ID and port). At the same time, you may want a more
    user-friendly system that provides some identification and protocol listing upon
    connection.


    Another consideration is unneeded interaction. If the server talks first, it usually
    says the same thing each time it gets a connection. Does the client need to know
    that? Does the added interaction slow the communication channels a little?


    # Which Program Drives the Conversation?


    Often, clients drive the interaction with the server. The client connects to the
    server and sends requests. The server, in turn, processes the requests and issues
    a reply.


    But, you may have to switch roles sometimes. For example, a client requests some
    database information from your server. After transmitting the data, a different
    client updates a few fields that the first client requested. If the first client
    works exclusively from the first data set, it could make the wrong decisions.


    In that type of situation, the server should send the unsolicited updates to the
    client, and the client needs to accept them. Consider how the client interacts
    with the server and peers interact with each other and notice exceptions and define
    ways to address them.


    # What Level of Certification Do You Need?


    To write a highly secure system, it''s essential to know to whom the server is
    talking. In turn, the server must know or certify the user, or minimally the machine.


    The certification process can include usernames and passwords. It can also use
    a trusted certificate issuer for the users''machines. *Chapter 16, "Adding Security
    to Network Programs and SSL,"* discusses the Secure Socket Layer (SSL) and presents
    a couple possible solutions to this problem.


    On the other hand, you may not need certification, but want some kind of logging
    instead. How often does a demographic hit your server? Do you need to beef up
    certain server pieces to meet user needs? How can you unobtrusively get to know
    your customer?


    Each of these questions are important to consider as you program your server.
    The Web has several examples of how to get demographics and user needs/trends.
    This information can also offer information about software defects and even system
    crackers. A simple way is to ask. Some browsers and Web servers use much more
    elaborate methods.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# What Type of Data Do You Use?


    Most servers you interact with use ASCII for correspondence, while most Web pages
    are text/HTML. It''s a good idea to consider the questions "Is that the most efficient
    data form to use?" and "Does the client support compressed data?" As you look
    at your server and your customer''s clients, consider how to decrease the delays
    on the server, network, and client.


    Compressing data can have some real benefits. Compressed ASCII can yield between
    50% and 80% reduction in data size. Even compressed data can be ASCII without
    too much inflation, so the network won''t lose any binary high bits. The following
    subsections provide more detail on how to handle data.


    # How Do You Handle Binary Data?


    Binary data---especially compressed---is more efficient than ASCII. Problem: some
    networks only support 7-bit bytes. This is a real problem for 8-bit binary data.
    These networks are typically dinosaurs that cost too much to replace. Fortunately,
    the routers connected to these networks often recognize the incompatibility and
    convert the data down or up as needed. This conversion requires computation time
    and thus slows propagation. The data reformatting affects the receiver-host, because
    the host has to reassemble the fractured data.


    Also, do you start with non-binary and then switch to binary? If so, either your
    client or server needs to tell the other when to switch. Similarly, you may want
    to switch back at some point.


    # How Do You Know when There Is a Deadlock?


    You may run into instances when the server and client are waiting for each other
    (deadlock). As they wait, they are tying up valuable resources and may be taxing
    your users''patience.


    Try to identify the situations that cause deadlock before determining if your
    particular problem is deadlock. If you have deadlock, the only solution is to
    sever the connection and try again. When you have to reconnect, you lose the context
    of the connection (where you are at in the interaction), and you may lose data.


    The client or server may encounter *starvation* (indefinite waiting for resources).
    Starvation typically occurs when a client or server is doing things other than
    managing the connection. Like deadlock, the standard solution is to timeout and
    reconnect.


    # Do You Need Clock Synchronization?


    Although it is challenging, clock synchronization (coordinating the real-time
    clocks between hosts) is essential when you have time-critical issues, such as
    financial transactions. This is a nasty problem. First, determine how accurate
    the synchronization needs to be.


    The server has to establish its clock relative to the client. However, most clients
    do not synchronize with network time. Because the client is rarely accurate, both
    use an arbitrator (a time server). However, this presents its own problems (the
    delay in getting the correct time off the network).


    One solution for a synchronization problem is to set all transactions at the server
    (moving more of the responsibility away from the client). After the server completes
    the transaction, it replies to the client with the time and date of posting.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# How and When Do You Restart the Connection?


    At some points during an interaction, the server and client may have to start
    over without losing connection. Losing connection can mean significant loss of
    information, so reestablishing a connection is out of the question.


    The TCP/IP protocol offers a priority message that you can use as a reset message.
    For more information on priority messages and out-of-band data, refer to *Chapter
    9. “Breaking Performance Barriers.”* This message is only a beginning; both your
    server and the client have to return to some starting point. That is a challenge
    in structured programming.


    Reconnecting is a direct way of starting over. The urgent message can tell either
    the client or the server to close the connection. Then, the client can reconnect
    to re-establish communication. Reconnection, however, may lose more information
    than you desire. So, a reset can force both the client and server back to some
    known point. Your data’s criticality plays a very important role in connection
    recovery.


    # When Are You Finished?


    The server and client have connected and passed packets back and forth. Now it’s
    time to say goodbye. Knowing when the interaction is complete may not be as easy
    as it seems. For example, when you write an HTTP server, you complete the interaction
    by sending two newlines. However, you may wait indefinitely for the client’s request
    when you have insufficient buffer space for a single read and you read with either
    *read()* or *recv()*. In this case, the server may timeout and declare the connection
    ended.


    Similarly, it can be difficult to decide which program should close the connection
    first. A client gets a pipe broken error ($EP$) when the server closes the connection
    before the client completes the transmission.


    It all comes down to what the protocols require. HTTP interactions require a pair
    of newlines to indicate an end-of-transmission. You may have to define your own,
