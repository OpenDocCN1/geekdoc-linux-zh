    # ## Extending Control with a Smart Select


    Using processes to manage the flow of connections is an intuitive way to distribute
    the tasks. Furthermore, placing limits on the number of processes running and
    preforking the processes ensure that the connections get the attention they require.
    There is a fundamental problem, however, with all these approaches: the scheduler
    storm.


    # ## The Scheduler Storm


    The scheduler storm presents two problems that expose you to the limits of multitasking
    and the reasons why single-CPU systems can become overwhelmed. The first problem
    shows the effect a large process table has on servlets. The second problem affects
    the preforking concept.


    The process table can easily handle a few hundred processes. Depending on memory
    and swap, theoretically you could have many more. Still, consider the limits:
    Linux switches between processes every 10ms. This does not include the time delay
    of unloading old process contexts and loading a new one.


    For example, if you had 200 servlets running, each process could wait 2 seconds
    for a small slice of CPU time on a system that switches tasks every .01 second.
    If each timeslice could send out 1KB within that small slice, you may see about
    200KBps throughput on the 10Mbps LAN connection (about par for TCP/IP). However,
    each connection gets only 512 bytes per second. This is the primary risk of letting
    the process table grow without barrier.


    The second problem is at the heart of preforking: Several processes all wait for
    one connection. Your server may have 20 servlets I/O blocked when a connection
    request arrives. Since all are waiting for a connection, the kernel awakes all
    20. The first one gets the connection, while all the rest return to an I/O blocked
    state. Some programmers call this a *scheduling storm* or a *thundering herd*.
    In either case, this problem emphasizes the need to minimize the number of waiting
    servlets and adapting based on the connection load.


    **NOTE**


    Solving the Thundering Herd in the Kernel


    One of the problems with writing a book on an ever-evolving technology like Linux
    is that the information becomes obsolete very quickly. Linux 2.4 solved the thundering
    herd problem in the kernel by waking up only one I/O-blocked process.


    # ## Overburdened select()


    One solution to these problems is to avoid multitasking altogether. In a previous
    chapter you read about the I/O multiplexer system calls: *select()* and *poll()*.
    These system calls could act in a similar manner as several processes.


    Instead of 20 servlet processes all waiting for a connection, you could offer
    one process that waits for a connection. When the connection request arrives,
    the server places the connection (the client channel) in an I/O list. These system
    calls wait for any one to send a request or command. The'
