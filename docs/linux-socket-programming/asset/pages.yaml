- pgno: 9
  md: '# ## Audience and Expected Interaction


    The book and Web site contain many code examples that illustrate the current topic.
    Read the section and try the program. You will need to know how to do the following:


    +   1. Create a C or Java source file (in whatever editor you desire).

    2. Compile it using a C or Java compiler.

    3. Run the program.


    Some examples may require changing the kernel (broadcasting and multicasting).
    Most Linux distributions install and run the network even if you are not connected
    to a physical network. To run all programs in this book, you must


    +   • Be able to program and compile C, C++, and Java code.

    • Have all the compilers installed.

    • Be able to configure the kernel for networking, broadcasting, and multicasting.

    • Compile and install the new kernel.


    # ## Disclaimers and Limits


    While all the programs listed in this text have been tested, they may not always
    work out of the box, because the system configurations change over time. Most
    of the time, if something does not work, the distribution may have changed the
    includes to some extent.


    Also, testers have verified some of the programs on other UNIX operating systems.
    This helps to iron out some portability problems. However, if there is a discrepancy
    between Linux and some other implementation, the book lists the Linux version
    (and includes a note describing the issue). This book is primarily focused on
    Linux.


    Lastly, this book does not cover other operating systems (Microsoft Windows or
    Macintosh). Some chapters note comparisons, but all algorithms support Linux/UNIX.


    # ## Conventions Used in This Book


    The following typographic conventions are used in this book:


    +   • Code lines, commands, statements, variables, and any text you type or see
    onscreen appears in a mono typeface. **Bold mono** typeface is often used to represent
    the user’s input.

    • Placeholders in syntax descriptions appear in an *italic mono* typeface. Replace
    the placeholder with the actual filename, parameter, or whatever element it represents.

    • *Italic* highlights technical terms when they’re being defined.

    • The à icon is used before a line of code that is really a continuation of the
    preceding line. Sometimes a line of code is too long to fit as a single line on
    the page. If you see à before a line of code, remember that it’s part of the line
    immediately above it.

    • The text also includes references to the Internet standards documents called
    Requests For Comment (RFCs). The reference citations are enclosed in brackets
    with the RFC number, for example [RFC875].


