- pgno: 174
  md: 'Using this approach can intercept errors before they get to the I/O subsystem.
    And because you captured the error early, you can fix it before the user discovers
    the problem.


    Another way the system lets you know of an error is through signals. Most calls
    warn you once that an error occurred to the channel. Some errors, like a premature
    close or normal close, issue a signal to your program if you do not get the message
    the first time. Your program may ignore some of these signals by default, but
    capturing all relevant signals reduces the risk of long debugging nights.


    # ## Capturing Signals


    The network program involves many technologies, and some of these technologies
    invoke signals. Your program must support collecting and processing these signals.
    The most commonly overlooked signal that can cause your program to abort is SIGPIPE.


    Signal intercepting and processing has its unique problems, as noted in [Chapter
    7, "Dividing the Load: Multitasking"](#). The first problem you must deal with
    is the fact that each process records only one signal per signal type. If you
    get more signals before completely processing the first, your program drops those
    events.


    You have a few options to address this problem. First, you should do as little
    as possible in the signal handler. Any I/O can potentially lose further signals.
    The risk of I/O blocking in a signal handler can result in disastrous consequences
    (such as a program hang). Also, you should avoid loops; try to run straight through
    all your signal algorithms. This rule does have a few exceptions, but generally,
    it is a good idea to minimize processing.


    Second, you can permit your handler to be interrupted. Be careful with this option;
    your signal handler may use a different hardware stack to accept each call. Because
    that special stack is not very deep by default, you can easily overflow that stack.


    Third, your handler could accept the signal and place it in a queue for your main
    program to process. This, however, is not as useful as you might think. The signal
    only tells you that something happened. Besides the specific type of signal (Linux
    defines 32 types), you know nothing else. If you queue up the messages, your queue-processing
    loop has to determine whether multiple signal events mean something or could actually
    collapse into one event.


    Determining what to do with each signal event depends on the signal itself. Of
    the 32 defined signal types (listed in [Appendix A](#) of this book and in of
    the man pages), your program is likely to encounter or request six on a regular
    basis: SIGPIPE, SIGURG, SIGCHLD, SIGHUP, SIGIO, and SIGALRM. You could get other
    signals, but these are the more common and relevant ones.


    **SIGPIPE**


    One common signal is SIGPIPE. The UNIX manuals state that only naive network programs
    ignore this signal. In normal, nonconcurrent programming, you may never encounter
    this event. On the other hand, if you do get this signal, it may not be very important
    to your program, and it''s okay to terminate. However, when writing a server or
    client, you must watch the connection carefully so that your program can recover
    without terminating prematurely.


    A pipe error happens when the destination host closes the connection before you
    are done sending (see sigpipe-client.c and sigpipe-server.c on the Web site).
    You get the same error when you pipe a long directory listing through a paging
    program like less. If you quit the paging program before reaching the bottom of
    the listing, you get a broken pipe message. You can avoid'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'the signal by using the `MSG_NOSIGNAL` option in the `send()` system call.
    But that may not be the best approach.


    What you do with the signal depends on what you need. First, you must close the
    file (or set a flag for the main loop) because the channel is now defunct. If
    you have several connections open and your program polls each connection, you
    need to find out which connection closed.


    But you may have unfinished business with the other end. If the client or server
    knows your protocol, it is unlikely to close the connection in midstream. Two
    possible causes are that an error occurred on the client/server side and the path
    between fell apart. Either way, if you need the session to finish, you may want
    to re-establish the connection.


    If the server or client disconnected or crashed, you can re-establish as soon
    as it is ready to connect again. You may want to give other programs a little
    time to come back up. Likewise, a faulty network needs a little time to quiet
    down after it readjusts the routing. If you can’t reconnect after several attempts,
    you can notify the user and let him choose what to do (this is what some browsers
    do).


    The network may continue to be unreliable even after waiting a while. After you
    reconnect, you can send shorter bursts that you can checkpoint along the way.
    This lets you pick up where you left off in the protocol.


    # SIGURG


    The protocol between the client and server requires choosing all the features
    necessary to pass the information. You can include some key features, such as
    data-stream interrupts or a heartbeat (see Chapter 9, "Breaking Performance Barriers"),
    which require the out-of-band (OOB) data feature.


    But unless you plan it and design it into the protocol, you don’t get the `SIGURG`
    signal. The behavior differs from the other signals. The default signal behavior
    is to ignore the signal, and your program must ask for the signal to get it.


    The `SIGURG` signal is specifically for receiving OOB data. Your program has to
    follow several steps to intercept this message (see Chapter 9). Usually, if the
    client or server sent it to your program, it may be for a good reason. So, if
    you get this signal unexpectedly, you might want to capture it and log it for
    later review.


    If your program gets more than one of this signal too quickly to accept and process,
    your program loses the last OOB data message. This is because the socket’s incoming
    data queue reserves only one byte for an urgent message.


    # SIGCHLD


    Unlike the `SIGURG` signal where you have to request the notification, you get
    the `SIGCHLD` signal if you use multitasking (specifically, processes) and the
    process terminates. When the child process terminates, the kernel retains its
    context so that the parent can review the results. The kernel also notifies the
    parent with this signal. If your program ignores the signal, these contexts accumulate
    in the process table as zombies (see Chapter 7).


    Typically, programs use this signal to call the `wait()` system call. However,
    it is possible to get the signal more quickly than a one-line system call like
    `wait()`. This is a nasty problem, but it is easy to solve. The `SIGCHLD` signal
    is the only signal that justifies using a loop to process all zombies.'
  merge: -1
