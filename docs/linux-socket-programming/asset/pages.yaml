- pgno: 296
  md: "# Table A.2, Protocol Values for the *type* Parameter in `socket( )` Call\n\
    \n| Protocol Type | Description |\n| :--- | :--- |\n| **SOCK_STREAM** | (TCP)\
    \ Reliable, two-way communication in a stream. You can use this kind of socket\
    \ in higher-level I/O function calls that involve the `FILE*` type. This protocol\
    \ offers you a virtual connection to the network using ports and a dedicated client\
    \ channel. After connection, the `accept( )` call returns a new socket descriptor\
    \ specifically for the new client. |\n| **SOCK_DGRAM** | (UDP) Unreliable connectionless\
    \ communication. Each message is independent and can be lost during transmission.\
    \ This protocol virtualizes the network with ports and allows you to send and\
    \ receive messages from many peers without reconnection. |\n| **SOCK_RAW** | (IP)\
    \ Accesses the internal network interfaces and fields. If you want to create ICMP\
    \ messages, you need to create a raw socket. Root access only. |\n| **SOCK_RDM**\
    \ | (RDM—Reliably Delivered Messages) Makes sure that each packet arrives safely\
    \ to the destination, but does not guarantee correct packet order. (Not yet implemented\
    \ in Linux and other UNIX operating systems.) |\n| **SOCK_SEQPACKET** | Sequenced,\
    \ reliable, connection-based datagrams of fixed length. (Not yet implemented in\
    \ Linux.) |\n| **SOCK_PACKET** | (Physical Layer) Places the socket in promiscuous\
    \ mode (if available) where it will receive any and all packets on the network.\
    \ This is a Linux-only tool. Root-access only. (Deprecated—use PF_PACKET instead.)\
    \ |\n\n# Protocol Definitions\n\n*Listing A.1* is an excerpt from the `/etc/protocols`\
    \ file [RFC2292] on your distribution. It contains the common and standard protocol\
    \ standards used in the network packet. Revising this file is *not* a good idea.\n\
    \n# *Example A.1. /etc/protocols File*\n\n```\n```\nip\t\t0 IP\t\t# internet protocol,\
    \ pseudo number\nicmp\t\t1 ICMP\t\t# internet control message protocol\nigmp\t\
    \t2 IGMP\t\t# Internet Group Management\nggp\t\t3 GGP\t\t# gateway-gateway protocol\n\
    ipencap\t4 IP-ENCAP\t# IP encapsulated in IP\nst\t\t5 ST\t\t# ST datagram mode\n\
    tcp\t\t6 TCP\t\t# transmission control protocol\negp\t\t8 EGP\t\t# exterior gateway\
    \ protocol\npup\t\t12 PUP\t\t# PARC universal packet protocol\nudp\t\t17 UDP\t\
    \t# user datagram protocol\nhmp\t\t20 HMP\t\t# host monitoring protocol\nxns-idp\t\
    22 XNS-IDP\t# Xerox NS IDP\nrdp\t\t27 RDP\t\t# \"reliable datagram\" protocol\n\
    iso-tp4\t29 ISO-TP4\t# ISO Transport Protocol class 4\nxtp\t\t36 XTP\t\t# Xpress\
    \ Tranfer Protocol\nddp\t\t37 DDP\t\t# Datagram Delivery Protocol\nidpr-cmtp\t\
    39 IDPR-CMTP\t# IDPR Control Message Transport\nrsrp\t\t73 RSRP\t\t# Radio Shortest\
    \ Path First\nvmtp\t\t81 VMTP\t\t# Versatile Message Transport\nospf\t\t89 OSPFIGP\t\
    # Open Shortest Path First IGP\nipip\t\t94 IPIP\t\t# Yet Another IP encapsulation\n\
    encap\t\t98 ENCAP\t\t# Yet Another IP encapsulation\n```\n```\n\n# Standard Internet\
    \ Port Assignments (First 100 Ports)\n\n*Listing A.2* shows the standard ports\
    \ (up to port #100) defined in the `/etc/services` file. You can change many of\
    \ these to suit your needs, but be sure to notify the clients if you do so."
