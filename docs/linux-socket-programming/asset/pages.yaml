    \nThe header may have a variable size, so the data_off field points to the beginning\
    \ of the data. To save header space, this field acts like the IP's header_len\
    \ field: It gives the count of 32-bit words that physically precede your data.\n\
    \nTCP uses some of the fields exclusively for opening a connection, flow control,\
    \ and connection closure. During a communication session, some of the header is\
    \ empty. The following paragraphs describe a few interesting fields."
