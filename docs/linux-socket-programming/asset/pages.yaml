  md: '| [Recipient accepts interruption] | | | |

    | --- | --- | --- | --- |

    | Send message | | | |

    | Return confirmation to user | | | |

    | [User receives status] | | | |

    | Scenario #9.1: "Send a message; message denied" | | | |

    | [User types message and clicks Send] | | | |

    | Open connection to destination | | | |

    | Contact recipient | | | |

    | [Recipient rejects interruption] | | | |

    | Return rejection to user | | | |

    | [User receives status] | | | |

    | Scenario #9.2: "Send lengthy message to person on the network" | | | |

    | [User types message and clicks Send] | | | |

    | Open connection to destination | | | |

    | Contact recipient | | | |

    | [Recipient accepts interruption] | | | |

    | Send message in parts | | | |

    | Return confirmation to user | | | |

    | [User receives status] | | | |


    The scenarios in this example are simple mutations of the original use-case. The
    use-cases often include negative or *exception-cases*. An *exception-case* is
    one that demonstrates how the program will respond to a problem with the data
    or transaction.


    The last step takes the use-cases and shows graphically how the program will work
    functionally. It is important that you include each use-case and show how the
    data changes until it reaches the final destination.


    # A Blender Is Not an Object


    Another problem designers face is proper naming. After you have an understanding
    of what the user wants, you can begin the process of analyzing the "things" in
    the program''s system. This system of things has responsibilities ("What it knows"
    and "What it does") that determine its behavior.


    Naming the object with something representative determines its current behavior
    and its evolution. A good name is always a noun. For example, naming an object
    `Socket` is better than `NetIO` because you can do much more to the network than
    just I/O. But, if you name the object with a verb (`NetIO` is short for Network
    Input/Output—both verbs), you have limited the effectiveness and evolution of
    the object. With `Socket`, you don''t have to stop at reading and writing messages;
    you can include network control, subscribing to multicast networks, and so on.


    Most nouns work very well. However, the English language has a problem with certain
    words: you can name an object with a false or misleading name. Typical misleading
    names are verbal nouns (words that acts like nouns but are really verbs). For
    example, a blender is not an object.


    What does a blender do? It blenders. So what methods would a blender have? `blend()`?
    That''s not enough to be a good object. Coming up with a good name is very difficult.
    When you base a name on what it does, it''s very hard to take your mind off what
    it could do in the future.


    Sometimes, you can''t identify a name that fits the bill. An oversimplified (and
    often effective) solution is to give it an unrelated name like bob. Then let the
    responsibilities drive the object.'
  merge: -1
