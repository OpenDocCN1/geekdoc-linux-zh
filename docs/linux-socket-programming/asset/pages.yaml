  md: "# ## Prototype\n\n```\n```\n#include <sys/poll.h>\nint poll(struct pollfd *ufds,\
    \ unsigned int nfds, int timeout);\n```\n```\n\n# ## Return Value\n\nIf less than\
    \ zero, an error occurred; a zero returned means that the call timed out. Otherwise,\
    \ the call returns the number of descriptor records that changed.\n\n# ## Parameters\n\
    \n| ufd s | The following is an array of `pollfd` structures. Each record tracks\
    \ a different file descriptor. | |\n| | `struct pollfd{` | |\n| | `int fd; /*\
    \ file descriptor */` | |\n| | `short events; /* requested events */` | |\n| |\
    \ `short revents; /* returned events */` | |\n| | `};` | |\n| | The `fd` field\
    \ is the file descriptor to check. The `events` and `revents` fields indicate\
    \ the events to check and the events that occurred, respectively. The bit-values\
    \ available are as follows: `POLLIN` There is data to read. `POLLPRI` There is\
    \ urgent data to read. `POLLOUT` Writing now will not block. `POLLRERR` Error\
    \ condition. `POLLHUP` Hung up. `POLLNVAL` Invalid request: `fd` not open. `POLLRDNORM`\
    \ Normal read (Linux only). `POLLRDBAND` Read out-of-band (Linux only). `POLLWRNORM`\
    \ Normal write (Linux only). `POLLWRBAND` Write out-of-band (Linux only). | |\n\
    | nfds | The number of records to check during the call. | |\n| timeout | The\
    \ timeout in milliseconds. If timeout is negative, the call waits forever. | |\n\
    \n# ## Possible Errors\n\n| ENOMEM | There was no space to allocate file descriptor\
    \ tables. |\n| :--- | :--- |\n| EFAULT | The array given as argument was not contained\
    \ in the calling program's address space. |\n| EINTR | A signal occurred before\
    \ any requested event. |\n\n# ## Example\n\n```\n```\nint fd_count=0;\nstruct\
    \ pollfd fds[MAXFDS];\n fds[fd_count].fd = socket(PF_INET, SOCK_STREAM, 0);\n\
    \ /*** bind() and listen() socket ***/\n fds[fd_count++].events = POLLIN;\nfor\
    \ (;;)\n{\n    if ( poll(fds, fd_count, TIMEOUT_MS) > 0 )\n    {\n        int\
    \ i;\n        if ( (fds[0].revents & POLLIN) != 0 )\n        {\n            fds[fd_count].events\
    \ = POLLIN | POLLHUP;\n            fds[fd_count++].fd = accept(fds[0].fd, 0, 0);\n\
    \        }\n        for ( i = 1; i < fd_count; i++ )\n        {\n```\n\n```"
