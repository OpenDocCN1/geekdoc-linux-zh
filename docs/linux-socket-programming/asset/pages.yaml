    \ void; /*---if error, return nothing---*/\n};\nprogram RPCPROC\n{\n    version\
    \ RPCPROCVERSION\n    {\n        proc_res READPROC(string) = 1; /*---/proc filename---*/\n\
    \    } = 1;\n}\n```\n```"
