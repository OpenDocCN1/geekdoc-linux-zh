- pgno: 23
  md: 'MSG_PEEK could give you different results with consecutive calls: The first
    call may yield 500 bytes, and the second could be 750 bytes. Likewise, this is
    why there''s a MSG_WAITALL flag.


    The `recv()` system call is more flexible than `read()`, letting you use the different
    flags to modify behavior. Do a normal read from socket pipe (equivalent to `read()`):


    ```

    ```

    int bytes_read;

    bytes_read = recv(sd, buffer, MAXBUF, 0);

    ...

    ```

    ```


    Read nondestructively from socket pipe:


    ```

    ```

    int bytes_read;

    bytes_read = recv(sd, buffer, MAXBUF, MSG_PEEK);

    ...

    ```

    ```


    Read nondestructively out of band data from socket:


    ```

    ```

    int bytes_read;

    bytes_read = recv(sd, buffer, MAXBUF, MSG_OOB | MSG_PEEK);

    ...

    ```

    ```


    The first statement gets the information from the server supplying a buffer, length,
    and no flags. The next statement displays the information. There is an intentional
    flaw here: What if the server sends more information than the buffer can accept?
    This is not a critical defect; nothing is going to crash. The algorithm simply
    may lose the data it doesn''t read.


    The `recv()` system call yields similar error codes to `read()` along with the
    following extensions:


    +   - `ENOTCONN` sd not connected. The supplied socket descriptor is not connected
    to the peer or server.

    - `ENOTSOCK` sd not a socket. The supplied socket descriptor does not have the
    signatures indicating that it came from a `socket()` system call.


    Note that if you use the `read()` system call, you can still get these error codes
    when using a socket descriptor, because the `read()` call is just a portal to
    the `recv()` call.


    # Closing the Connection


    You have the information you need from the server, everything went well, and now
    you want to close the connection. There are again two ways you can close the connection.
    Most programs use the standard I/O `close()` system call:


    ```

    ```

    #include <unistd.h>

    int close(int fd);

    ```

    ```'
