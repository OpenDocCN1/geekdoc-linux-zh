  md: '# Simplifying Sockets Interfacing


    Writing a class that matches the application type lets you focus more on the programming
    and less on the network. The sockets interfacing is not difficult but requires
    specific steps to get the communication channels to work consistently.


    The C++ language is more powerful than C, and is a complete superset of C''s feature
    set. In fact, you can compile C++ programs with the same tool as with C (cc).
    (In reality this is not 100% accurate. When cc discovers a .c or .cpp extension,
    it calls g++ instead of gcc.) Along with this additional power, the C++ language
    is quite a bit more complicated as well. Nevertheless, the advantages outweigh
    the drawbacks.


    Writing a Sockets Framework lets you define simpler interfaces for others to use.
    Program simplicity is imperative for testability and defect fixing. Additionally,
    the simpler the interface, the easier it is to use. Similarly, the easier something
    is to use, the more likely it is used correctly and frequently.


    A properly designed and written C++ framework offers very easy and direct interfaces
    that let the programmer really focus on the job at hand.


    # Hiding Implementation Details


    Interfaces promote the simplicity or complexity of a product. As the interface''s
    complexity increases, the ease of use diminishes. Hiding implementation details
    is very important for ensuring simplicity. The design and implementation—particularly
    in a wrapper—attempt to hide details from the user-programmer.


    Of course, the user-programmer may want to know how you did certain things, but
    that information can hurt you and him or her. Encapsulation, one of the foundations
    of objects identified in [Chapter 11, “Saving Time with Objects,”](#chapter-11-saving-time-with-objects)
    protects both the framework writer and the user-programmer. By hiding how you
    implement certain steps, you protect the programmer from changes in those implementations.
    This also protects the framework by allowing the system to evolve internally without
    affecting the interfaces to the outside world.


    As with all other object-enabled languages, C++ enforces the rules of ownership
    so that the program can only access what it can see and own. If planned well,
    one framework can support all forms of socket networks.


    # Deploying Reusable Components with Easy to Use Interfaces


    Interfaces and hiding implementation details creates a very thin membrane between
    the program and the framework. The program must pass all requests through this
    membrane. The operations inside the class accept and work on the data and requests.


    Keeping the interfaces simple is very important. The result is clear: a set of
    program tools that many programs can use. In fact, several implementations can
    exist for the same interface. You simply choose the one that behaves the best
    for the circumstances.


    As you write these tools, the clear advantage of reuse becomes apparent to the
    user- programmers. They in turn promote your work by releasing programs based
    on these tools. (An excellent example is Qt.)'
