- pgno: 283
  md: 'When you run this program a few times, you may notice that the path seems to
    change a lot. This is normal and not a bug. Refer to Chapter 2, "TCP/IP Network
    Language Fluency," for an explanation of the network''s dynamics.


    # **Summary: Making the Raw Decisions**


    The raw socket gives you the capability of working with the error messaging protocols
    (ICMP) that the IP subsystem uses. It also allows you to create your own protocols.
    The primary advantage of raw sockets is its sheer speed, being only one abstraction
    layer above the physical network frame.


    The most common introductory raw socket programs are ping and traceroute. When
    you understand how these work and the risks involved in datagram messaging, you
    can choose the best approach to meet the requirements of your program.


    # Chapter 19. IPv6: The Next Generation to IP


    # IN THIS CHAPTER


    +   - Current Addressing Problems

    - Trying Out IPv6

    - IPv6 Pros and Cons

    - Summary: Moving Your Code into the Future


    The Internet contains much of the network traffic in today''s world. It has a
    great deal of power and flexibility. It bases its power and flexibility on the
    IP packet. This packet eases getting messages from here to there. However it has
    certain limitations, limitations based primarily on growth and extensibility.


    This chapter digs deeply into the next generation of IP: IPng (yes, "IP Next Generation")
    or IPv6. Throughout this book, you have worked entirely in the IPv4 arena, and
    most of that knowledge is applicable in IPv6. You only need to know few extra
    tips and tricks to ensure longevity in your creative projects.


    # Current Addressing Problems


    The IPv4 primarily focuses on addressing a set of computers within a subnet. As
    described in Chapter 2, "TCP/IP Network Language Fluency," the number is composed
    of 4-byte values (or a 32-bit number). Furthermore, the addresses are grouped
    into network classes. When companies buy blocks of addresses, they get them in
    these classes. These classes range from a few hundred to a few million addresses.


    The number of addresses being assigned and used has alarmed the Internet Activities
    Board (IAB). The board has discovered that less than 1% of the numbers assigned
    are really associated with a node on the network. The result: a dwindling supply
    of available addresses.


    The IAB expects the number of computers connected to the Internet to increase
    as much as a hundredfold within the next few years. IPv4 simply does not have
    enough available addresses to meet the demand.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# ## Solving the Dwindling IPv4 Address Space


    The IAB has taken some measures to solve the dwindling address problem. The cost
    of owning real IP addresses has risen, so companies now use masquerading and DHCP
    to limit the number of allocated addresses.


    Additionally, the Internet could adopt a wider addressing scheme than merely 32
    bits. IPv6 [RFC2460] answers that exact request. The IPv6 is 128-bits long (or
    16-bytes wide). This opens the possibilities well into the next century—at least.
    The effective number of addresses in IPv4 is about two billion network nodes (taking
    out the special addresses). The effective address space for IPv6 is 110381.


    # ## What Does IPv6 Look Like?


    An IPv6 address looks a little different from IPv4 because of the large number
    of digits a programmer now has to manage. Each address is eight hexadecimal numbers
    separated with colons. For example, one legal address is `2FFF:80:0:0:0:94:1`.
    For shorthand, you can replace the repeating zeros with two colons (`2FFF:80::94:1`).


    Ports can still be tacked on to the end of the address using a period and port
    number in decimal. For example, port 80 for the previous address would be `2FFF:80::94:1.80`.
    You can''t use the colon separator because it makes the shorthand ambiguous.


    The IPv6 address space (like that of IPv4) has already been divided up into specific
    regions or groups [RFC1897, RFC2471]. The groups attempt to merge different addresses
    (like IPX). As of the writing of this book, the definition is still in flux, many
    groupings remaining undefined.


    Of the different groupings, the numeric address value that starts with `001` as
    the first three bits specifically replaces the IPv4 addressing. Figure 19.1 shows
    with this address.


    ![](img/03334662da8fdfb8d95a02f270c522f6_284_0.png)


    ![](img/03334662da8fdfb8d95a02f270c522f6_284_1.png)


    Figure 19.1 has five parts: allocation ID, TLA ID, NLA ID, SLA ID, and interface
    ID. Table 19.1 defines the purpose of each part.


    Table 19.1. IPv6 Address Parts

    | Field | Description |

    | --- | --- |

    | Allocation ID | This is the 3-bit flag (001) that indicates that this is a public
    Internet address. (3 bits) |

    | TLA ID | Top-Level Aggregation. This represents the highest level of the world-wide
    Internet. (13 bits) |

    | NLA ID | Next-Level Aggregation. Subdivided group within the TLA. (32 bits)
    |

    | SLA ID | Site-Level Aggregation. This could be a large corporation or conglomerate.
    (16 bits) |

    | Interface ID | The specific machine ID. (64 bits) |


    One of the problems networks had to solve was the "everybody knows everybody"
    problem first discussed in Chapter 2. This problem forces all the routers to know
    every address available so that it routes a message correctly. That is why machines
    could not use the MAC addresses.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'IPv4 solved that problem using classes built into the network IP address. IPv6
    uses a more diluted form. It still has to resolve addresses in the TLA, NLA, and
    SLA regions, but it does not have to resolve them at the same time. Instead, the
    routers move the message from one group to the next, based on only the address
    part it has to.


    # How Do IPv4 and IPv6 Work Together?


    The promised routing mechanisms do add some attraction to the proposed change.
    But the Internet, of course, has yet to convert completely over to IPv6. In fact,
    it may always keep IPv4 around. So, how do servers and clients mix the two?


    Nearly all systems that now support the IPv6 protocol stack also support the IPv4
    protocol stack. These *dual stack* systems may exist for quite a while, or until
    most applications migrate completely over to IPv6. The main problem is how to
    get them to work together.


    In reality, the increase in address width has little effect on the protocol stack.
    The primary protocols that the Internet uses are UDP and TCP, and these are embedded
    in the IP packet anyway. When you send a message from an IPv4 client to a dual
    stack server, the IPv4 stack would respond accordingly. But, after being stripped
    of the IP wrapper, it would appear like a TCP or UDP message. If you are careful
    about programming your applications, you can move from IPv4 to IPv6 very easily.


    Essentially, IPv6 is a superset of IPv4. It adopts all the good features of IPv4
    and drops the out-of-date ones. IPv4 addresses are remapped to an IPv6 address.
    To map the address, all the upper bits of the IPv6 address are set to zero and
    the last 48 bits become 0x`FFFF` plus the IPv4 address. For example, converting
    `128.10.48.6` to an IPv6 address, you would get `::FFFF:128.10.48.6` or `::FFFF:800A:3006`
    (again, the `::` is the shorthand for all zeros).


    Of course, the only limitation is you can''t go backwards: an IPv4 application
    cannot directly accept an IPv6 message. (Some systems allow *address mutilation*,
    which converts the 128-bit address into a temporary 32-bit address. When the IPv4
    application accepts the IPv6 message, it only sees the mutilated address. When
    it replies with the address, the kernel converts the message back to the 128-bit
    address.)


    # Trying Out IPv6


    To try out IPv6, not only do you have to change your programs slightly, but the
    kernel and the networking tools must support it also. Some distributions omit
    its support to reduce installation complexity or security risks. This section
    describes the process to enable support and shows you how to convert your programs
    to IPv6.


    # Configuring the Kernel


    You can find out quickly whether your kernel version supports IPv6. If you have
    `/proc` support, look in `/proc/net`. If you see `ip6_tables` or `ipv6`, you have
    IPv6. If you don''t see these files, you may need to load the `ipv6.o` module.


    # NOTE


    Icconfig Defect'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The ifconfig tool found in `net_tools` has a defect and does not load the `ipv6.o`
    module automatically. If you have this problem, you may want to recompile the
    kernel’s `ipv6` as a non-module.


    If you need to reconfigure the kernel, go to the source directory. (Some distributions
    do not automatically install the kernel source for some reason, so you may need
    to download and install it. The Web site [http://www.kernel.org](http://www.kernel.org)
    is a good source.) Be sure that all your settings are correct in all the options,
    and select Experimental Drivers. Next select IPv6 in the Network Settings menu.
    You can find it in the It Is Safe to Leave These Untouched section. Some kernel
    configurations permit you to select exclusive IPv6. Don''t do it. Again, you may
    want to include the IPv6 in the kernel and *not* compile it as a module. That
    can save you some debugging time.


    Be sure to keep a backup of your old kernel. If you have a problem, you can use
    it to get back to a sane state.


    # ## Configuring the Tools


    The next test needed is the tools. If you have confirmed kernel support, run ifconfig
    without any arguments. It displays the current configurations of each network
    interface. If it supports IPv6, the list includes an IPv6 address in the second
    or third line of each interface.


    If you do not see the addresses, run it again with a `-help` option. The command
    then lists for you all the supported protocols. You probably won''t see IPv6 in
    this case. If it’s omitted, you need to get the `net_tools` RPM and reconfigure
    it and compile it. After installation, configure it using `configure.sh` and enable
    IPv6. You can include IPv6 over IPv4, if you would like, but that may be unnecessary.
    Compile the package and copy all the executables to their typical homes (this
    is often `/sbin`).


    Again, keeping a backup of your tools is a very good idea. (You may note that
    the default settings of `configure.sh` are the same as your old install. So if
    your backup does not work, you could simply recompile.)


    After you compile and install your tools and kernel, reboot the host. When the
    system is ready again, running ifconfig shows you the mapped addresses for its
    assigned IPv4 address. You can even add an IPv6 alias with the following:


    ```

    ```

    ifconfig eth0 add <IPv6 Address>

    ```

    ```


    For example


    ```

    ```

    ifconfig eth0 add 2FFF::80:453A:2348

    ```

    ```


    After you have your system all set up, you can begin to write a few IPv6 programs.'
