- pgno: 55
  md: 'The TCP header uses the same port number found in UDP. But `seq_num` and `ack_num`
    provide traceability to the stream. When you send a message, the IP subsystem
    attaches a sequence number (`seq_num`). The receiver replies that it got the message
    with an acknowledgment number (`ack_num`) that is 1 greater than the sequence
    number. This feature lets acknowledgment packets carry data as well.


    # Looking at the TCP Interactions


    When you open a streaming connection, your program and server exchange the messages
    listed in Table 3.6.


    Table 3.6a. The Three-Way Handshake


    | Client Sends | Server Sends | Description |

    |:-------------|:-------------|:------------|

    | SYN=1 (syn_flag) | | Request a virtual connection (pipe). |

    | ACK=0 (ack_flag) | | Set sequence number. |

    | | SYN=1 (syn_flag) | Permit and acknowledge a virtual connection. |

    | ACK=1 (ack_flag) | | |

    | SYN=0 (syn_flag) | | |

    | ACK=1 (ack_flag) | | Establish a virtual connection. |


    This is called the three-way handshake. During the transfers, the client and server
    specify the buffer size of their receiving buffers (windows).


    On the other hand, closing a connection is not as simple as it may appear, because
    there may be data in transit. When your client closes a connection, the interaction
    shown in Table 3.7 may occur.


    Table 3.7, TCP Connection Closure


    | Client | Server | Description |

    |:-------|:-------|:------------|

    | FIN=1 (fin_flag) | Transmits data | Client requests close. |

    | | Receives data | |

    | ACK=1 | Transmits more | Server channels flushed. |

    | | Receives more | |

    | ACK=1 | FIN=1 | Close accepted. Server closes and awaits client ACK. |

    | ACK=1 | | Client closes its side. |


    Closing the TCP connection makes it impossible to reuse the socket for other connections.
    For example, if you connect to a server, the only way to sever the connection
    is to close the channel, which closes the socket as well. If you then want to
    connect to another server, you must create a new socket. The other protocols do
    not have that limitation.


    # How the IP Protocols Fit Together


    While interfacing with the network, you may wonder how all these protocols fit
    together. In some cases, it may seem that they don''t fit together at all. They
    do use some of each other''s features, but they really don''t work so closely
    together that they are inseparable.


    The raw IP, ICMP, UDP, and TCP protocols fulfill specific roles. You can use these
    roles to fit your needs when you design your network application. Of course, while
    TCP has more reliability and features that the other protocols, you cannot replace
    ICMP with TCP. Because the Linux subsystems require different features from TCP/IP,
    each packet type is important for your system to work correctly.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The ICMP, UDP, and TCP packets physically rely on the raw IP packet. Their
    headers and data reside in the IP''s data section, following the IP header.


    # # Snooing the Network with Tcpdump


    Observing packets on a live network effectively shows you what the kernel does
    with messages and how the network subsystem resolves address requests. From the
    raw IP packet to TCP, tcpdump is a tool that displays data on the network. For
    security, you need root access to run tcpdump.


    By default, tcpdump uses promiscuous mode so that you can see everything on the
    network. Promiscuous mode manipulates the hardware interface directly to accept
    any and all messages.


    # **NOTE**


    The Balance of Network Ethics


    Knowing how to do many things is very powerful and holds a lot of responsibility.
    With root privilege, you can do a lot of good and a lot of harm to the network.
    When you install Linux on your computers, the distribution assumes that you act
    with the same good intentions as those who afforded you the ability to snoop others''packets.
    One effective way to destroy the Free Software movement is to abuse the power
    and trust that other good and well-intentioned people gave you.


    Normally, the hardware interface adapter picks up only those messages that it
    recognizes from the ethernet address. Recall from Chapter 2 that every ethernet
    hardware adapter has a unique 6-byte ID. The adapter uses this ID to ignore all
    packets except for the ones that match the ID.


    # **NOTE**


    Programmable Ethernet IDs


    Some OEMs (original equipment manufacturers) offer their network interface cards
    (either PCI or PCMCIA) that support a programmable MAC address (or ethernet ID).
    This makes mass production possible for a few card manufacturers while serving
    several hundred state-of-the-art companies. Unfortunately, you may get a card
    that has a bogus ID, because the name-brand company did not program it correctly.
    This error can make your card non-unique on the network.


    If you do not want promiscuous mode, you can turn it off with one of the options.
    Tcpdump has many options to help you filter out unwanted messages and select displayed
    data and data redirection. Here are a few interesting command-line options:


    | Option | Description |

    | :--- | :--- |

    | `· -a` | Try to assign names to network and broadcast addresses. This requires
    access to a nameserver. |

    | `· -c <count>` | Stop after getting the specified count of messages. |

    | `· -n` | Don''t convert the node addresses to their names (this is useful when
    you don''t have a name server). |

    | `· -p` | Don''t put the interface into promiscuous mode. If you have a small
    network or cluster, seeing all the packets may be interesting. Otherwise, with
    promiscuous mode enabled, the network could easily overwhelm your computer. |

    | `· -v` | Print a slightly more verbose dump. This includes the time-to-live
    (TTL) field. |

    | `· -vv` | Print a lot more information in the dump. |

    | `· -w` | Write the raw packet to a file. |'
  merge: -1
  img_proc: true
