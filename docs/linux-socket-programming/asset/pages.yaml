  md: "You can use this algorithm to create a few processes—much less than the number\
    \ you can create in a purely multitasking server— for example, 5–10 servlets.\
    \ Each servlet, in turn, could support 5–10 connections.\n\n# NOTE\n\n# Select\
    \ Collision\n\nYou may have heard of a BSD problem called *select collision*.\
    \ The previous algorithm assumes that the select() can wait on several descriptors\
    \ and wake up only when the descriptors change state. The BSD 4.4 implementation\
    \ has a limitation that causes all processes blocked in a select() to wake up.\
    \ It appears that Linux does not have this limitation.\n\nThis approach could\
    \ easily support hundreds of connections without interfering with each other.\
    \ The balance between the number of tasks and the number of connection helps minimize\
    \ the impact on the process table. However, having so many connections can lead\
    \ to problems if you need to track your protocol's state.\n\nYou can use this\
    \ algorithm easily with stateless servers. A stateless connection remembers nothing\
    \ about previous transactions. This requires all transactions sent to your server\
    \ to have no relationship with other transactions or each connection to have a\
    \ single transaction. Also, if your server requires short- to medium-term connections,\
    \ you can use this approach. Some examples are an HTTP server, a DB query server,\
    \ and a Web redirector.\n\n# Implementation Problems\n\nAs you might have noticed,\
    \ this approach does have a couple of limitations. First, the primary server cannot\
    \ balance the number of connections between each servlet. You can add code to\
    \ place a ceiling on the number of connections:\n\n```\n```\n /*************************************************************/\n\
    \ /** Limiting the number of connections to a servlet ***/\n /*************************************************************/\n\
    \ if ( FD_ISET(sd, &set) )\n if ( ceiling < MAXCONNECTIONS )\n {\n int client\
    \ = accept(sd, 0, 0);\n if ( maxfd < client )\n maxfd = client;\n FD_SET(client,\
    \ &set);\n ceiling++;\n }\n```\n```\n\nThis approach effectively yields the connection\
    \ to another servlet. However, the distribution of connections between your servlets\
    \ may be random.\n\nThe other problem is with regard to the context of your connection.\
    \ When a client connects to your server, unless it is a single-transaction connection,\
