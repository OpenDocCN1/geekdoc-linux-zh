    Pipe creation error\");\n...\nread(fd[0], buffer, sizeof(buffer)); /* read from\
    \ input end */\n...\n```\n```\n\n# NOTE\n\n# Indexing File Descriptors\n\nEvery\
    \ I/O channel is assigned a file descriptor number. This is an index into a file\
    \ descriptor table. By default, every process gets three channels: `stdin` (0),\
