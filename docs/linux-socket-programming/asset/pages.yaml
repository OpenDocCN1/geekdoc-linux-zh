- pgno: 180
  md: 'may want to determine how much uptime your server must have. If your server
    goes down, how quickly does the user expect the system to come back up? This all
    depends on how critical your server is.


    # ## What Qualifies as a Critical Server?


    Unlike clients that can go up and down more often, users expect servers to be
    up and stay up. Clients can connect, establish protocols, transfer information,
    and shutdown comparably quickly. Of course, in a client, you *could* be more relaxed
    in memory and file management. Some Windows programs are. When the program exits,
    the memory manager releases all those resources (at least in Linux).


    Servers, on the other hand, must remain up and running indefinitely. Like the
    genie in the lamp, you expect that your client can connect to the server at any
    time and fulfill any wish (within reason). The genie can''t say, *"Hold your horses
    while I reboot."* The server must be available and ready.


    The expected availability determines how critical your server is. Some servers
    are more critical than others. Like an HTTP server, some servers simply have to
    reply within a certain period of time. Others must track the transactions so that
    neither the client or the server loses any information, and all sessions appear
    seamless; a common example of this is a credit card purchase or money transfer.


    # ## Communication Events and Interruptions


    During a purchase, your client''s connection sudden drops. What can cause this?
    The TCP connection is supposed to be a reliable connection between client and
    server. What could possibly go wrong? Plenty.


    Connection events and interrupts can result in loss of data, money, and possible
    life. Whenever you connect two computers together using any form of channel, you
    risk losing that connection. When looking at what *could* happen, you have to
    consider what kinds of information conduits exist and how TCP interacts with each.


    # ### Physical Interruptions


    The network has so many different types of physical connections and different
    ways of *dropping carrier* (losing the electrical or optical signal that carries
    the packets) that listing them would be very laborious and not very useful. The
    simple point is that the connection between point A and point B can drop.


    TCP works with these events very well. It does not matter if the physical media
    are wire, fiber, or radio waves. The original designers came from the days of
    nuclear paranoia, where the possibility of losing entire networks shaped the way
    the router sends messages. If the network has a different route to the same destination,
    the network detects it and reprograms the routers. The problem is simply that
    it takes time to discover the new path and cause the rerouting.


    Your critical messages can encounter this problem and usually TCP recovers without
    your intervention. However, if the network can''t establish a new path, your program
    may have to recover your session itself.


    # ### Routing Flips'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Physical disruptions cause routing blips in the form of cycles. The message
    can bounce around between routers until discovered and fixed. This causes duplication
    and packet loss. Again, during a single TCP connection, your program does not
    encounter these problems because the protocol fixes them before getting to your
    program.


    # Server/Client Dropout


    On the other hand, if you have to restart a session, you must take into account
    the possibility of duplications. You may have to restart a session if the client
    or server drops out. A server drops out or completely blacks out when it crashes.
    At the time of the crash, it loses all the transactions. When the client drops
    out, the information it sends at the time can be lost. The server''s data loss
    is far more critical than the client''s.


    # Session Recovery Issues


    The client must reconnect to the server if either drops the connection. You face
    several issues to re-establish the connection. TCP usually solves these issues
    for you automatically. However, a session is connection-dependent—the user and
    server never seem to skip a heartbeat if the connection drops.


    The first issue you have to address is transaction loss. During a transaction,
    the server could drop out either from a program failure or a system failure. If
    the client does not track each message but assumes that the server gets the transaction,
    the network could lose the message. Even when the server comes back up, the sent
    message may never arrive.


    The second issue is the opposite of transaction loss—transaction duplication.
    This is different from packet duplication. During critical communications, both
    the server and the client track the messages they send. At certain times, both
    may have a copy of the same message until the receiver acknowledges the message.


    For example, the client issues a request to transfer $100 from the savings account
    to the checking account. Until the client gets the confirmation from the server,
    it holds the message in a transaction queue. If the client drops out, the system
    saves the transaction queue. After coming back up, the client retries each outstanding
    transaction in the transaction queue. If the server executes the transaction again,
    the account manager transfers a total of $200 instead of $100.


    The last typical problem you must address is the procedure of session re-establishment.
    Often, the sessions are not secure and do not require passing through different
    security walls. Insecure connections need no more than a reconnection. If, however,
    yours is a critical server, you have to authenticate. *Authentication* verifies
    the client has the right to connect. This can happen through a login prompt, a
    common form of security.


    The other form establishes and verifies that the client is really who it claims
    to be (*certification*). The certification process requires a trusted third party-server
    (*a certifier*). When the server accepts a connection and begins the login process,
    the server asks the client for a certificate of authenticity. The server then
    forwards the certificate to the third party certifier. The certifier checks the
    certificate and responds with the authenticity.


    You must consider these general issues and others you may have before implementation.
    If you consider security and session protocols after implementation, you create
    unpluggable holes in your design.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Session Recovery Techniques


    Part of the security system includes session recovery. Because you may have critical
    data, you must consider ways of securing the data. The previous section introduces
    a couple of ideas to solve this problem.


    Part of the process of auto recovery is minimizing user interaction. You also
    need to consider the issues discussed previously. The previous section provides
    some hints as to methods to help you recover a session.


    The first problem is simply the connection. Even though your server notices the
    connection loss first, it cannot initiate the connection if the protocol foundation
    is TCP. Instead, the client must connect to the server. If you want to use the
    TCP protocol, your client must be intelligent enough to detect a connection dropout
    and re-establish it.


    # NOTE


    Back-Handshaking


    Getting the client to realize that the connection has dropped out can be more
    difficult because it takes time for network errors to arise. You could back-handshake—
    connect in both directions. Normally, the client connects to the server. In back-handshaking,
    the server connects back to the client. You can use the backwards channel to send
    procedural messages back (such as reconnect). You can use a reliable UDP instead
    of TCP for this back channel.


    The connection process can include forcing the recovering client to reauthenticate
    or recertify automatically or re-log in. This is a necessary step to recover a
    secure session. If your user is still using the application when it re-establishes
    the session, you could recall the previous authentication and log it in for him.
    However, the recertification needs to follow the same procedure as before. Fortunately,
    the user does not need to get involved or even need to know.


    The user works with the session in the form of transactions. These transactions
    can get data or revise server data. To ensure that the data is always accurate,
    the client and server track each revision-transaction. As the program designer,
    you do not need to track data retrieval (unless that''s part of your security).


    You can avoid transaction loss by tagging, logging, and acknowledging all transactions.
    To acknowledge it, the transaction must have a unique ID tag. The unique tag is
    different from the TCP message ID because the tag is unique for all sessions.
    (The tag really does not have to be unique for all sessions. You could reuse the
    tags after a predefined time. This simplifies implementation a bit.)


    For example, the client sends a request to withdraw funds from a credit card account.
    At the same time, it logs the transaction locally on permanent storage. The server
    follows two steps. First it acknowledges the message (the transaction is posted).
    After completing the transaction, the server sends another acknowledgment (the
    transaction is committed).


    After the server acknowledges the transaction, the client discards the pending
    transaction. (Programs should never discard critical transactions. Instead, they
    should be moved into a secure archive.) The client can use the second acknowledgment
    as a flag to update current records.


    # NOTE'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Thin Clients


    If you do not want to risk getting out of sync with the server, you can make your
    client a *thin client* by keeping no information locally. The client that you
    program still tracks the transactions, but instead of keeping information locally
    (such as current balances), each information refresh becomes a request to the
    server.


    If the session drops out, the client and server must recover the session. After
    recovering the session, the client and server have to work through the outstanding
    transactions. They compare transaction tags, discarding those that are finished.


    This process also helps eliminate the duplicate transaction problem. The client
    and server only eliminate those transactions that they share. The remaining ones
    are outstanding and need re-posting.


    You may find other issues that require additional handling. The ones this section
