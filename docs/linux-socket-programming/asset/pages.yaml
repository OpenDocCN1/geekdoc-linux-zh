    # Prototype\n\n```\n#include <sys/socket.h>\n#include <resolv.h>\nint sendto(int\
    \ sockfd, void* msg, int len, int options,\n           struct sockaddr *addr,\
    \ int addr_len);\n```\n\n# Return Value\n\nReturns the number of bytes sent or\
    \ −1 if an error occurred.\n\n# Parameters\n\n| `sockfd` | The socket descriptor\
