- pgno: 274
  md: 'Multicasting requires a couple of unusual network features. These unusual features
    influence the configuration of supporting routers. First, the routers must accept
    the generated MACs. This is actually a change in the responsibilities of the router
    and can require additional router configurations.


    With the creation of multicasting protocol, the Internet standards proposed Internet
    Group Management Protocol (IGMP) [RFC1112, RFC2236] to pass on multicasting group
    advertisements. IGMP carries the group IDs and MACs that the hosts in the subdomains
    desire to join or drop. The join message passes only as far as the scope allows.
    Even if no host behind a router joins the group, the router still has to keep
    track of the groups available. (If the router goes down, the information is not
    lost. When the internal host joins a group, the router begins to rebuild the group
    list.)


    Another burden placed on the routers defines the uniqueness of the new protocol.
    Even though all subscribers to the group see each message, all subscribers may
    not see exactly the same message (see “Multicasting Limitations”). The router
    must pass all broadcast and multicast messages to all subdomains that have joined.
    This may require implicitly or explicitly copying the message.


    A router explicitly copies a message to two or more different connections. Routers
    often are connected to several networks, and they route traffic between them.
    An explicit copy places the packet on more than one of those networks.


    The implicit copy is due to the nature of the network. Everyone can see everything
    else (on the same subdomain) because they are physically connected to the same
    wire. An implicit copy happens when more than one host picks up a message as they
    see it on the network.


    # Tunneling Through the Firewalls (Mbone)


    Some routers or firewalls do not have the needed implementation support for multicast
    groups, so a host inside the subdomain would not be able to see any messages from
    the outside. A router that only supports directed (or unicast) messages is a *unicast
    router*.


    Shortly before 1992, programmers wanted to take advantage of the newer features
    of multicasting. Unfortunately, the network was full of unicast routers. The answer
    was to encapsulate the new protocol in an IP wrapper and send it directly to a
    receiver that would unwrap and pass it on. This virtual network backbone for multicasting
    (Mbone) can be used today for firewalls as well.


    How does it work? Mbone uses a *multicast* router (*mrouted*) to accept and pass
    messages through the external domain to another *mrouted* server. The *mrouted*
    server accepts each complete message packet and places it in another packet with
    its own header. The result is a message with two IP headers. On the other end,
    the receiving *mrouted* server unwraps the message and places the result in its
    subdomain.


    # Multicasting Limitations


    Multicasting answers a lot of issues from broadcasting, but it has its own issues.
    Some issues are hardware support, performance/bandwidth bottlenecks, accountability,
    and uniqueness.


    # Getting Hardware Support


    The last section described how the operating system and hardware supports multicasting.
    Unfortunately, some NICs (like the Ethernet Express) do not support multicasting
    and promiscuous mode at all. To get a multicast message, the hardware must support
    promiscuous mode—at the bare'
