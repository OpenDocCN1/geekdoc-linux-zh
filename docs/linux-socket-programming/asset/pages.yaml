  md: "# Child's Results\n\nReturning to the poker example, when the hand ends or\
    \ when a player folds, the dealer has to clean up and shuffle the deck. In fact,\
    \ some players may demand to see the results of the winning hand before the winning\
    \ player collects the pot. In similar manner, the parent cleans up and checks\
    \ the results of each child.\n\nThe last method of communication is the termination\
    \ results. The parent uses this information to decide the success of the child.\
    \ When a process ends, it always returns a signed integer. The thread, on the\
    \ other hand, can return an abstract object using a void*, an abstract object\
    \ like that of the thread's parameter.\n\nBe certain to use caution when supplying\
    \ the result this way—it must persist between the transition. For example, don't\
    \ return an object built from a stack variable. Instead, use the heap or a global\
    \ variable. In fact, as long as the parent expects the parameter to change and\
    \ it's not shared between threads, you can use the same parameter variable to\
    \ pass data back.\n\n# Beating the Clock: Race Conditions and Mutex\n\nThe power\
    \ that threads offer you is very enticing. If threads are correctly managed, your\
    \ programs run more quickly and experience fewer stalls. However, this feature\
    \ has one catch—resource contention. If two threads revise the same data at the\
    \ same time, they may corrupt the results. And trying to debug a contended resource\
    \ can require long hours from you. The following subsection discusses the issues\
    \ of race conditions.\n\n# Race Conditions\n\nYou may be familiar with *race conditions*,\
    \ primarily two threads in a race to get their data stored. Earlier, this chapter\
    \ presented an example of a race condition in resetting signal handlers. *A critical\
    \ section* is the section of source code where the resource contention occurs.\
    \ Consider the examples in Listings 7.13 and 7.14, assuming that Thread 1 and\
    \ Thread 2 execute at the same time.\n\n# Example 7.13. Race Condition for Thread\
    \ 1\n\n```\n/****************************************************/\n/*** Example\
    \ of a race condition where two threads are   ***/\n/*** contending for a queue\
    \ data object.                 ***/\n/****************************************************/\n\
    \nint queue[10];\nint in, out, empty;\n/*********** Thread 1 ***********/\n/*\
    \ Read queue */\nif ( !empty ) /* avoid queue underflow */\n{   int val = queue[out];\n\
    \    out++;\n    if ( out >= sizeof(queue) )\n        out = 0;  /* wrap around\
    \ */\n    empty = ( out == in );\n}\n```\n\n# Example 7.14. Race Condition for\
    \ Thread 2\n\n```\n/****************************************************/\n/***\
    \ Example of a race condition where two threads are   ***/\n/*** contending for\
    \ a queue data object.                 ***/\n/****************************************************/\n\
    \n```"
