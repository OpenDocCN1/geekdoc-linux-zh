  md: '# Summary: Java-Style Network Programming


    Java includes a large library that can help you write network programs. The Network
    packet includes classes for streaming (TCP), datagram (UDP), and multicasting
    (UDP) sockets. It also includes classes for managing the addresses and conversions.


    When used with the I/O package, the sockets package increases its capabilities.
    The I/O package offers several ways to interact with the communications between
    sockets, memory, and threads. The library, while a little confusing, has tremendous
    power to make network programming very quick.


    Java’s capacity for threading simplifies socket programming and eases server development.
    You can create threads one of two ways: inheriting `Thread` or implementing `Runnable`.
    With that, calling the `start()` method creates a new execution thread and starts
    the task at your custom implementation of `run()`. Synchronizing a multithreaded
    class is fairly easy with two tools: synchronized methods and execution yielding.


    Analyzing and using Java as a programming base helps you to see how you can deploy
    sockets in an object-enabled language. The next chapter proposes and lays out
    an implementation in C++.


    # Chapter 13. Designing and Using a C++ Socket Framework


    # IN THIS CHAPTER


    +   - Why Use C++ for Sockets Programming?

    - Laying Out the Framework

    - Testing the Socket Framework

    - Implementation Limitations

    - Summary: A C++ Socket Framework Simplifies Programming


    The last chapter showed you how to program sockets in Java. Java is a very powerful
    language and has many advantages, such as platform independence, JIT (Just In
    Time) compiling, and even native compilers/converters. However, not everyone wants
    to use Java, claiming lack of stability or needed performance, and some may be
    more inclined to use a C++ version instead.


    Writing a socket *framework* (or class library) takes in all technologies described
    in this book. In fact, this chapter offers a few additional socket features that
    are covered in *Part IV*, "Advanced Sockets—Adding Value."


    To use this chapter, you must be familiar with C++ and object programming. As
    in earlier chapters, it is assumed that you know how to write in C++ and compile
    and link the files. Tutorials for these procedures are easy to find on the Internet.


    This chapter steps you through the process of analyzing, designing, and creating
    a class framework. This particular framework only provides a wrapper (an interface
    with little added functionality) around the Socket API. You can still use these
    principles to define other frameworks, not just wrappers.


    # Why Use C++ for Sockets Programming?


    A C++ framework that wrappers the Socket API offers several advantages over making
    the individual system calls manually. As you may have noticed, the process of
    creating, configuring, and using a socket varies very little from application
    type to application type.'
