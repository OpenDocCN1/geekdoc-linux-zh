- pgno: 108
  md: "The `fork()` system call has a very simple and unassuming interface: you call\
    \ it, and suddenly you have two identical processes running at the same time.\
    \ The `fork()` system call has three ranges of values:\n\n+   - Zero—The program\
    \ in question is the child. If the call returns a zero, the `fork()` was successful\
    \ and the currently running task is the child. To obtain the child's process ID\
    \ (PID), use the `getpid()` system call.\n- Positive—The program in question is\
    \ the parent. If the call returns a positive value, the `fork()`, again, was successful\
    \ and the currently running task is the parent. The return value itself is the\
    \ PID of the new child.\n- Negative—An error occurred; the call was unsuccessful.\
    \ Check `errno` or use `perror()` to determine the nature of the error.\n\nMost\
    \ programs place the `fork()` system call in a conditional statement (such as\
    \ `if`). The conditional statement helps separate the parent from the child. Listings\
    \ **7.1** and **7.2** show two typical examples that use the call.\n\n# **Example\
    \ 7.1. Task Splitting Example**\n\n```\n```c\n/**************************************/\n\
    /* Parent and Child following unique paths */\n/* Task-splitting style of multitasking\
    \ */\n/**************************************/\nint pchild;\nif ( (pchild = fork())\
    \ == 0 )\n{     /* You're in the child */\n     /*---Do some child-ish things---*/\n\
    \     exit(status); /* This is important! */\n}\nelse if ( pchild > 0 )\n{\n \
    \    /* You're in the parent */\n     int retval;\n     /*---Do some parent-ish\
    \ things---*/\n     wait(&retval); /* await child's end */\n}\nelse\n{     /*\
    \ Some kind of error */\n     perror(\"Tried to fork() a process\");\n}\n```\n\
    ```\n\n# **Example 7.2. Job Delegation Example**\n\n```\n```c\n/**************************************/\n\
    /* Parent (server) and Child (job proc) */\n/* Job-delegation style of multitasking\
    \ */\n/**************************************/\nint pchild;\nfor (;;) /* Loop\
    \ Forever */\n{\n     /*---Wait for job request---*/\n     if ( (pchild = fork())\
    \ == 0 )\n     {     /* Child */\n          /*---Process the request---*/\n  \
    \        exit(status);\n     }\n     else if ( pchild > 0 )\n     {\n        \
    \  /* parent clean up */\n          /* notice NO WAIT() -- you must */\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "```\n/ * use signals (see later) */\n\nelse if ( pchild < 0 )\n{\n    / * Some\
    \ kind of error */\n    perror(\"Can't process job request\");\n}\n```\n\n**Listing\
    \ 7.1** creates a child in a safe environment. The parent does some work and then\
    \ waits for the child to terminate. Alternatively, you can use an algorithm, such\
    \ as that seen in **Listing 7.2**, that makes the parent into a job delegrator.\
    \ When some outside entity requests an operation, the parent creates a child to\
    \ do it. Most servers use that seen in **Listing 7.2**.\n\nYou may want to use\
    \ multitasking to get different jobs done at the same time. The jobs can be the\
    \ same algorithmically, but they use different data. Without this concept, programs\
    \ can waste computation time in duplicated effort. *Differentiation* separates\
    \ the tasks so that they do not duplicate effort. While there is nothing syntactically\
    \ wrong with the source code in **Listing 7.3**, it defeats the purpose of multitasking\
    \ because it does not differentiate.\n\n# Example 7.3. Forking Without Differentiation\
    \ Example\n\n```\n/*********************************************************************************\n\
    /*** This is an example of \"running together\". If fork() ***/\n/*** is called\
    \ without some differentiation, the two ***/\n/*** tasks duplicate each other's\
    \ work, thus wasting CPU ***/\n/*** time. ***/\n/ ********************************************************************************/\n\
    /*---do something---*/\nfork();\n/*---continue---*/\n```\n\nThis book refers to\
    \ multitasking without differentiation as *running together* or *confluence*.\
    \ As a general rule, avoid this condition. Running together can also occur if\
    \ the process did not properly terminate with an explicit call to the exit( )\
    \ system call.\n\n**NOTE**\n\nImplementing Fault-Tolerance with Confluence\n\n\
    You can use this powerful running together technique as part of a fault-tolerant\
    \ system. A fault-tolerant system can duplicate computations to check for accuracy.\
    \ When a processor begins to degrade, the computational results can vary. You\
    \ can implement this technique by running together two or more tasks and looking\
    \ them to a particular CPU (not currently supported on Linux). Each task runs\
    \ the same computations on its designated processors. And, at a certain interval,\
    \ the tasks send their current results to an arbitrator validation. The system\
    \ shuts down the odd-processor-out.\n\nIf you get any error from a fork( ) system\
    \ call, you may have problems with your process table or memory resources. One\
    \ symptom of an overloaded operating system is being denied resources. Memory\
    \ and process table entries are foundational to a properly functioning OS. Because\
    \ these resources are so important, Linux limits the total amount of resources\
    \ a process can have. When you can't get a reasonably sized chunk of memory or\
    \ you can't create a new task, you may have problems with your program or you\
    \ don't have enough memory."
