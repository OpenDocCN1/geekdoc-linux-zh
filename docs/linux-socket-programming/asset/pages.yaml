    # ## Task Communication


    You create unique tasks by differentiating them so that they don''t duplicate
    work. The two types of differentiation—specified paths and communication—help
    you design and delegate the responsibilities in logical ways. For example, consider
    playing a hand of poker. The game uses several phases and modes of operation to
    ensure players play correctly. Because each gets a different hand to play, divergent
    playing styles, and varying funds to bid with, the game becomes interesting. Similarly,
    you achieve optimal results when you take into account the differing functions
    of tasks and responsibilities.


    # ### Initialization: Setting the Child''s State


    In poker, every player buys a set of chips, and the dealer deals out the hand.
    The players may have different techniques to place a value on their hand; and
    the dealer has an added responsibility of managing the deck. In programming, one
    form of communication is simply the state with which the task starts. Both processes
    and threads typically follow a different execution path than the parent after
    the parent sets up the shared data.


    Use the parent to set up the environment with which the children work. After the
    children have what they need, they can begin processing. The parent can have a
    little control over the child, but—like the dealer and the players—these are usually
    directive ("You can''t do that!"), not procedural ("Go on! Bid your house!").


    When you create threads, you follow a procedure like creating processes. First,
    you set up the shared environment for processes and threads, and then create the
    task. Additionally, threads can accept a `void*` parameter (like a procedure call)
    for initialization. The `void*` data type is C''s way of doing abstract data types.
    With it, you can pass any value around and it''s up to the receiver to interpret
    the real meaning. This parameter is like accepting the hand to play.


    # NOTE


    # #### Using the void* Data Type


    Passing a `void*` type may seem very powerful, but be careful how you create the
    type. The data has to be either an allocated block (using the `malloc()` library
    call), global data, or static data. In other words, it should not be stack (or
    `auto`) data. The reason is simple: As the program makes the procedure calls/returns,
    the stack is going to change. The data may not exist for the child to see.


    # ### Shared/Common Memory


    When you play poker, you eyeball two particular resources—the pot and the deck.
    These are limited and shared resources. How you play and when you fold depends
    on those factors. During play, the dealer takes from the deck and distributes
    among players. Players evaluate the hand they receive and toss money bids into
    the pot. Likewise, it''s necessary to keep in mind the memory resources available
    to your program.


    You can program processes and threads to passively pass information to everyone
    else holding common or shared memory. Threading offers you common memory inherently:
    the parent and child'
