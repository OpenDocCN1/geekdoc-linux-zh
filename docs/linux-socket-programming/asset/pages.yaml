- pgno: 251
  md: '# Remembering Where You Are


    The simplest stateful connection is one that keeps track of the current state.
    You can do this with a session ID. This ID must be encoded so that only the client
    and server understand the significance of it. As a simple example, the client
    requests the first row of a database query result. To get the next row, the server
    must be able to associate the next call with the initial query.


    A simple way to address this problem is to divide up the calls into at least three
    phases: initialize, transact, and terminate. The sole purpose of the initialization
    state would be to establish the session and begin the processing. The transaction-based
    calls manipulate the state that the initialization started. And, the termination
    state flushes any pending transactions, closes the connection, and secures the
    data.


    After the session is closed, the session ID is no longer valid.


    # Following a Specific Route


    The three primary states—initialize, transact, and terminate—are the beginnings
    of providing a state route map. The state route map shows all the states and how
    to get between them. Given the current information about the session, the server
    and client know exactly what they can do and how to get to the next state.


    Determinism in a state map means that you must have unique states and unique transitions.
    Specifically


    +   * **No single transition leads to disparate states**— Example: If the server
    changes directory, the client must reflect the change.

    * **No two states can have the same transition**— Example: A transaction cannot
    result in both the client and the server waiting for a message.


    Without the predictability that determinism provides, you cannot recover from
    any state failure.


    # Recovering from a State Failure


    Of the three different problems that stateful connections face, recovering from
    state failure is the most difficult. The network particularly introduces many
    different ways to lose state. Some state loss causes include hardware, routing,
    connectivity, program defects, and so on. The first problem is recognition.


    State loss can be a nasty problem if you do not plan for it. First, both programs
    must check each other’s session ID. The session ID must also include some level
    of security, expiration, and state identification. You can even include the last
    state and potential next states. If any of these keys gets out of sync, your program
    can determine that state has been lost.


    Recovery from state loss brings its own set of difficulties. After you have determined
    that state is lost, you then face the challenge of what to do next. The following
    are a few ideas:


    +   * **Connection Reset**—Force the client to start the session over again. The
    server rolls back all transactions from the previous session.

    * **State Rollback**— Both the client and the server roll back to a known state.
    Intermediate transactions are dropped. If the known state interferes with the
    either the client or the server, they choose a different state. If all else fails,
    they reset the connection.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   • **State Force**— The server tells the client what the correct state is.
    The client replies whether that is acceptable. If not, both execute a state rollback.


    Depending on how critical the transactions are, you may choose one idea over the
    other. However, each idea depends on the previous. You cannot easily choose one
    without selecting the simpler one(s) as well.


    # Summary: Creating an RPC Toolset


    You can use your sockets programming experience to help other user-developers
    who want the benefits of network programming without having to worry about the
    implementation details. RPCs come in two forms: creating home-grown interfaces
    or using standard tools like `rpcgen`.


    Creating home-grown tools lets you define how the interface works and lets you
    customize the transport policies. The interfaces are unrestricted, allowing you
    to send as many parameters you want and in any form or order that seems best.
    However, you cannot send pointers, and you must copy all data manually.


    The `rpcgen` toolset lets you focus on the program instead of the transport. You
    can choose between TCP or UDP protocols, but the transport is off limits. It provides
    you with a wealth of automatic conversions including the capability of sending
    pointers. The tools are very easy to use and make programming simple.


    Finally, most RPC connections are stateless—a simple ask-and-reply scheme. However,
    some connections require more complex stateful interactions—the current call is
    dependent on previous calls. To achieve this level of interfacing, you must implement
    the states, sessions, and recovery yourself.


    Secure Sockets Layer (SSL), which has many states embedded in its protocol, depends
    heavily on RPCs. The next chapter discusses security and SSL.


    # Chapter 16. Adding Security to Network Programs and SSL


    # IN THIS CHAPTER


    +   • [Giving Permission to Work](#)

    • [The Problem with the Internet](#)

    • [Securing a Network Node](#)

    • [Encrypting the Messages](#)

    • [Secure Sockets Layer (SSL)](#)

    • [Summary: The Secure Server](#)


    A secure system provides no more functionality than an insecure system—the data
    it provides is more reliable. An insecure system provides services and information
    sharing, but it is prone to attacks and becomes unreliable. This unreliability
    casts a shadow on the value of the services and can even harm the company''s reputation
    or brand.


    In most cases, security is assumed as you build the product. Rarely do business
    requirements say, "The server must be impervious to Denial of Service attacks."
    Security is a foundational requirement that the customer assumes to be part of
    the product. You must incorporate the needed security into your program. The most
    difficult decision you face is, "How much security is necessary?"'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'This chapter discusses many issues of network programming security: concepts
    and terms, Internet impact, methods and implementation, and the Secure Sockets
    Layer (SSL).


    # Giving Permission to Work


    Network programming revolves around the idea of sharing information and distributing
    work. To share information, you need to know who is interacting with your server;
    is this a friend or a foe? The increased number of attacks on current systems
    indicates that the number of foes is on the rise, so designing in security has
    more priority than implementing the product features.


    Interaction implies recognition and trust. Security places the onus of identification
    on both the client and the server. After identification has been established,
    the client can ship or retrieve information or can even collaborate calculations.


    To manage the scope of security, you need to know what the levels of security
    are and where security needs to be enforced.


    # Levels of Identification


    Establishing levels of user identification is an important part of creating a
    secure system. The simplest form of security, authentication, simply identifies
    the client. This is the first door of a secure system that the user passes through.
    An example of a program that authenticates a connection is a remote login. The
    login procedure just checks your username and password.


    The next level of security, authorization, permits or denies access to features
    in the system. Linux''s remote login couples the authentication with the authorization
    by attaching the user''s roles and group permissions. Some operating systems either
    do not distinguish one remote person from another or provide very limited authorization.
    For example, if you share files in Microsoft Windows 95 and 98 with more than
    read-only access, it only checks the client''s authentication. Once authenticated,
    the client can do anything he or she wants to your files and printer.


    The problem with authentication and authorization is that the client cannot determine
    whether the server is a Trojan horse. Certification offers the most secure level
    of authentication. It requires a trusted third party to prove both the client
    and the server. The third party is a trusted certificate server that proves that
    both client and server are who they claim to be.


    # Forms of Interchange


    After you have established the client''s identity, you need to look at the information
    that the computers pass between each other. Data interchange comes in two forms:
    scrutiny and intrusion. Data scrutiny can be a problem only if the communication
    is restricted. Revealing restricted data like usernames and passwords can lead
    to intrusions. Data intrusion is a bigger problem because the intruder can add
    or even revise the data.


    Often, the communication is public because the data in the channel would not compromise
    the client or the server. Web servers and other simple services work at this level.


    A public interchange does not mean that everyone sees the data. Instead, it means
    that the two programs take no precautions for privacy. Any computer on the same
    physical LAN connection can see the interchanged messages. This form of communication
    is very prone to network scrutiny and intrusion.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Another form of data interchange is within groups. Shared messages depend on
    the TCP/IP protocols for broadcasting messages or isolating traffic. All computers
    in the same network segment can see these messages. Because routers do not pass
    foreign broadcast messages, the group messages are isolated in the destination
    segment. It tends to be more secure than the public form, but it is still subject
    to network snooping (within the same network segment). Intrusion is not as much
    of an issue because the segment typically assumes that you are among friends.


    Private messages try to limit access to the information between the source and
    destination. They often have critical information to which external data prying
    can cause serious damage. Private messages require extra measures, both physical
    and logical, to ensure data security and integrity.


    Another important message form that requires inclusion here is a special data
    form that distributes program execution to other sites. These commands include
    RPCs and direct commands (like those of `telnet`, `rlogin`, or `rsh`). The data''s
    function demonstrates its difference from regular data. Regular data (or *inactive
    data*) only changes the meaning or its interpretation if corrupted. Distributed
    commands (or *active data*) change execution when corrupted and can even compromise
    host security. The Love Bug virus in Microsoft Outlook is an example of corrupted
    active data.


    Of the different types of data interactions, active data presents the greatest
    security risk. If you are required to include remote instructions and commands,
    you must be careful to verify that the remote host is trusted.


    # ## The Problem with the Internet


    The Internet itself presents its own unique problems. Its very nature is the heart
    of the problem; it was designed in anarchy to solve the anarchy problem. You can
    find several stories of how the Internet was created, but the most relevant fact
    is that it was designed to circumvent the problem of nuclear explosion blackout.
    That is the reason that the paths from host to host are so dynamic.


    No path through the system is really exact. You cannot say to the network system:
    "Take this packet through these routers to the destination." Each packet may even
    follow a different path. Your pipe may go in and out of enemy territory on the
    Internet.


    # ## Everything Is Visible


    When writing network programs, you must remember an important rule: The Internet
    cannot guarantee you a private channel. Like yelling a sell command on the New
    York Stock Exchange floor, everyone there can hear you. However, most of the time
    those who hear don''t care and ignore the message. Other times, the room can have
    listeners that can intercept or even revise that message for ulterior motives.


    Similarly, the message may move in and out of trusted zones. A *trusted zone*
    is a network that a company trusts to be safe. For example, two popular trusted
    zones are the AT&T and US Sprint backbones. Other major corporations buy into
    these networks through dedicated lines. They are trusted because the zones host
    company provides limited guarantee of privacy.


    Corporations create or buy into trusted zones as part of their own network or
    intranet. The intranet is the corporation''s own network system. When two more
    corporations collaborate and share information in a special network (which often
    happens to be the same physical medium), they form an *extranet*. Because each
    company must get information quickly from host to host, the boundaries defining
    Internet, intranet, and extranet are beginning to blur.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Alternately, individual messages may go through the equivalent of no-man’s
    land in the Internet, where messages are subject to snooping. Even the tools that
    were once restricted to the privileged *root* are accessible to everyone. With
    these tools, a less-than-benevolent super user can access— and even revise—messages.
    The power of a free and powerful operating system, such as Linux, can also be
    its folly.


    The best solution is to be aware of the risks and to protect the data you need
    to send. Follow good practices, such as always masking username and password information
    and never ship a credit card number without encrypting it.


    # Forms of Intrusion/Attack


    You can protect your client and server by being aware of the typical forms of
    attack. These revolve around the basic form of communication. All forms of attack
    exclusively follow this nature: The client communicates with the server.


    +   *   **Line-Tapping**— An eavesdropper listens to the messages waiting for
    some juicy data that he can use. Network snoopers neatly fit into this category.

    *   **Line-Severing**— A malicious program limits the accessibility of the server
    or client. This act does something to the network or the host itself that delays
    the reply or even eliminates it. Two examples are ping-storming and Denial-of-Service
    (DoS).

    *   **Line-Hijacking**— Instead of impeding communications, a program could take
    over the communication interchange between host and client. Some protocol stacks,
    such as the one in Linux, make hijacking difficult because of how they generate
    the TCP sequence number numberering.


    More security intrusion forms may undoubtedly appear, but you can depend on the
    fact that all forms fit into one of these categories. (Virus es are an entirely
    different problem. They can cause security problems, but they are not direct data
    security attacks.) Security issues for network programming apply to everything
    connected to the network. Security is mostly independent of the operating system’s
    implementation (see the next section for an exception).


    Linux has security built into the system, and that was the fundamental design.
    The effect is obvious: a very secure and reliable system. Other operating systems
    that adopt that philosophy have a solid level of security. Similarly, those systems
    that are not founded on this philosophy will never be as secure. Still, security
    in network programs appears to be mostly independent from the system’s foundational
    philosophy, so the degree of network security relies on the programs you write.


    # TCP/IP Crackability


    Most computers now use the Internet protocols. Even Novell and Microsoft have
    begun to move away from their proprietary protocols so that they can more easily
    interface with the Internet. How crackable is IP?


    Actually, the Internet Protocol is rather easy to crack. Network snoopers, as
    presented in this book, are a good example of how easy watching network messages
    really is. Using raw sockets (remember this is a privileged protocol), a protocol
    cracker can simulate all protocols, typically flooding the recipient with bogus
    messages. The easiest protocols to falsify are ICMP, UDP, and RDP. (Reliable Datagram
    Protocol (RDP) is not yet implemented on most operating systems.)


    Each protocol in the TCP/IP stack has its vulnerabilities. Some security experts
    claim that TCP is the hardest to crack. This is true…to a point. They claim that
    the packet sequence number presents a'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'level of attachment\u2014if you cannot guess the next sequential number, you
    cannot hijack the communications. The hijacker must duplicate exactly the next
    number in order to fool the recipient into assuming that the other message is
    a duplicate.


    The TCP/IP protocol does not restrict the numbering sequence other than to ensure
    that each packet is uniquely numbered (for the lifetime of the packet). If the
    algorithm for determining the next number is predictable, the channel is vulnerable.
    (Please note that the sequence number itself is not the vulnerability. Instead,
    the way it''s generated is the weakness.) Is TCP the hardest IP protocol to hijack?
    Yes, but other networked computers can still eavesdrop, and hijacking is still
    possible.


    # Securing a Network Node


    How do you begin to lock down a system from attack and intrusion? Network security
    is a very large and complicated mix of tools and rules. This section identifies
    a few good practices for controlling the system. Some ideas do not have direct
    relevance to network programming, but they are still important. You may want to
    be aware that this is hardly exhaustive; you must consider the ideas from multiple
    sources to increase your network security.


    # Restricting Access


    You can increase your server and client program''s security using the following
    suggestions:


    +   •   **File Permissions**\u2014 The first step in network security is to make
    sure that your files have the right permissions and ownership. Some network programs
    may require *root* access (raw IP, for example); be very careful what you do in
    these programs. In fact, some programs that require *root* access relinquish *root*
    privilege as soon as they successfully open the raw socket.


    +   •   **Connection Limitations**\u2014 Restrict how much a remote host can do
    while connected. Do not allow blanket remote commands without proper authorizations.


    +   •   **Reducing Port Holes**\u2014 Limit the number of ports available. Each
    port in a system increases the security risk by another level. (Don''t go overboard
    on this suggestion. Just remember that the more ports you have, the more openings
    that a program can get into.)


    +   •   **Focusing on Cards**\u2014 If you have a router or gateway with more
    than one ethernet card (or interface), set your services to one device. Most services
    serve all devices unless told otherwise. Again, if you have more than one physical
    interface, the services are rarely needed on all interfaces. For example, you
    may want Telnet on one card for the intranet, but not on the card that connects
    to the Internet.


    +   •   **Severing Unneeded Services**\u2014 If you don''t intend to use a particular
    service (even rarely), don''t run it. When you need it, start it up at that time
    but, until then, leave it turned off. (This includes your own servers.)


    Your server can run more efficiently if you trim out all the unnecessary features
    and services it offers. Looking at the server''s logs, you can quickly determine
    what is required at all times and what you can drop.


    # Firewalls


    Firewalls offer very specific services or interfaces between external clients
    and internal servers. The services are very critical to the security of the internal
    network. Often, firewalls are not even visible to the client and can act transparently
    with the servers.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'The firewall''s primary role is filtering. The algorithms in the firewall provide
    two forms of filtering: passive and active. Passive filtering only looks at the
    addressing of each message. A good firewall hides the address of each internal
    server and forces translation of all addresses. Additionally, if desired, the
    firewall can remap ports. Passive filtering acts as an initial buffer or barrier
    between clients and servers.


    Active filtering digs deeper in the packet and tries to determine if it contains
    compromising commands or other discrepancies. This form of filtering needs to
    know about the services available on the servers. For example, FTP connections
    require different security measures than HTTP.


    Additionally, servers inside the firewall can use non-registered IP addresses.
    For example, an internal server would issue these fake addresses using DHCP. The
    firewall then uses masquerading to translate the addresses (passive filtering).
    Without real addresses, clients cannot easily initiate communications.


    # NOTE


    Some network administrators believe that a client cannot initiate communications
    with a server that has a bogus IP address. This is not completely true and can
    give a false sense of security. For example, FTP''s protocol uses a backward session:
    The client makes a request to the server to download, but the server creates the
    channel to the client to get the file. The client may really be behind a firewall.
    In that case, the external server is able to initiate communications through the
    firewall. This can happen through a firewall event with masquerading enabled.


    # Demilitarized Zones (DMZs)


    Firewalls help you increase security by channeling information from client to
    server. Some companies take the firewall concept one step further: the creation
    of Demilitarized Zones or DMZs. The concept is not very new; two or three encompassing
    walls around cities and castles in Europe and the Middle East demonstrates their
    effectiveness.


    DMZs define a simple and effective way of slowing penetration. An attack can break
    through one firewall only to discover another wall. The innermost netspace would
    be the company''s intranet, which has critical and company-private information.
    As the ancients proved, this increased security in their favor by slowing assaults,
    improving detection, and increasing protection.


    Simple forms of firewalls place the hosting servers outside with no connection
    to the intranet (see Figure 16.1). This is thoroughly secure, because there is
    no path to the sensitive data. This technique presents two fundamental problems:
    How does the server get updates, and how does the company keep internal information
    in sync? One solution is to hand carry the updated information to the server.
    Engineers like to call this approach "sneakernet." These server islands really
    limit the capabilities for accessing databases, tools, and dynamic information
    that usually reside inside the intranet. More advanced DMZs integrate the company''s
    access to the Internet, the services to the external customer, and the intranet.


    ![](img/03334662da8fdfb8d95a02f270c522f6_257_0.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: '![](img/03334662da8fdfb8d95a02f270c522f6_258_0.png)


    DMZs place more than one barrier between the Internet and the intranet (see Figure
    16.2).


    > Figure 16.2. A DMZ requires conduits through the firewall to pass information.


    ![](img/03334662da8fdfb8d95a02f270c522f6_258_1.png)


    To get the most out of a DMZ, you must establish rules about what goes inside
    it. Firewalls rarely provide many services; the servers behind the firewall do.
    However, if you expose too much inside the DMZ, you might as well forget DMZs
    and save your money. The rules of conduct become (by necessity) more relaxed as
    you get closer to the intranet. The following list offers several common rules:


    +   Minimize ports (exposed firewalls)— Most firewalls exposed to the outside
    world limit the number of ports available. These ports provide precisely what
    the client needs to get information offered by the company. The ports that are
    exposed provide more ways an attacker may gain access.


    # NOTE


    The RPC Hole


    Many network programmers recognize the potential for intrusion as the number of
    ports rises. However, less-experienced programmers may not realize that they may
    use tools that create ports on-the-fly. For example, the portmap program for Remote
    Procedure Calls (RPCs) creates ports. Furthermore, Java''s Remote Method Invocation
    (RMI) and Microsoft''s COM/COM\+ sit on top of RPCs. Webmasters who write script
    for servers may not realize that they are opening new security holes with each
    new object.'
  merge: -1
