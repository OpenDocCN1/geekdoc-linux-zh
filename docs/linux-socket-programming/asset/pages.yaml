  md: 'The peer (or server) that waits for the connection may use the same connection
    interface, or it could use `sendto()` and `recvfrom()` . However, for the program
    to connect to the peer, it is necessary for the peer to publish its port number
    with the `bind()` system call. For a complete description of the `bind()` system
    call, please refer to the "Sending a Direct Message" section, later in this chapter.


    The example code fragment in *Listing 4.1* refers to `DEST_PORT` . This number
    is an agreed-upon port interface between the two programs. The listening peer
    sets up the port by calling `bind()` to request `DEST_PORT` . When your message
    arrives, the destination may issue a `connect()` system call itself.


    Unlike TCP''s `connect()` system call, your program can reconnect as many times
    as you wish to other peers or servers without closing the socket. With TCP, you
    cannot connect to other peers or servers unless you close and then reopen the
    socket. One of the most important features UDP offers is the capability to send
    messages to different destinations without closing the socket. Using the `connect()`
    system call with UDP protocol still affords you this flexibility.


    Again, if you use UDP in any form, you elect the unreliability that goes with
    it. You could lose packets, or the packets may arrive out of order. The `connect()`
    system call for UDP only records the destination and does not increase the reliability
    of the channel between your programs.


    # **NOTE**


    Reliably Delivered Messages (RDM)


    The Reliably Delivered Messages (RDM) protocol [RFC908,RFC1151] provides the guaranteed
    delivery that TCP offers but also lets you have the message-based (nonstreamed)
    speed of UDP. RDM may still get the messages out of order, but it provides a good
    compromise between UDP and TCP. Unfortunately, even though this protocol has been
    on the books for a number of years, Linux (and other UNIX operating systems) does
    not yet support it.


    # ## Example: Connecting to the HTTP Daemon


    The most common protocol users connect with is HTTP. It describes a very simple
    interface that includes a query. The server, in turn, interprets the query and
    replies with a message that the client can understand. That message may be any
    document inside a simple email header format.


    The simplicity of the interface demonstrates for you many of the transactions
    on the network. Most client-server interactions are single-transaction based.
    All of the overhead of TCP interfacing and reliability checking can be wasteful
    on a single transaction. Still, that is the accepted standard.


    # ## Simplified HTTP Protocol


    To send a request to an HTTP server, you only need to know a single command. This
    is an oversimplified representation of the HTTP protocol. *Chapter 6, "A Server
    Primer,"* covers the protocol in greater depth:


    ```

    GET <query> HTTP/1.0<cr><cr>

    ```'
