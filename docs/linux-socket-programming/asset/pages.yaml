    \ the players direct the message to a particular player or to the entire group.\n\
    \nThe tasks you design and program can use interprocess communication (IPC). IPC\
    \ usually comes in the form of pipes; your task can direct messages to other tasks\
    \ using these pipes. Pipes are unidirectional, like using `stdin` and `stdout`\
    \ I/O channels. The system call `pipe()` creates the following pipe:\n\n```\n\
    ```\n#include <unistd.h>\nint pipe(int fd[2]);\n```\n```\n\nThe parameter `fd`\
    \ is an array of two integers. You provide this array to accept the two new file\
