  md: "can program the servlet to compare the connection with the message it receives.\
    \ It's not difficult, but you have to plan your program a little more.\n\nThe\
    \ last limitation of this algorithm is its support of long-term (deep transaction)\
    \ connections. This algorithm remains stable, if you have a client and server\
    \ doing single transactions or short interactions. However, deep transaction connections\
    \ usually require multiple states. This complicates your server tremendously.\
    \ Also, because the connection is active longer, the possibility of getting your\
    \ load out of balance increases.\n\n# # Redistributing the Load\n\nYou can solve\
    \ the load distribution limitation if you switch to threads instead of using processes.\
    \ As described above, the server cannot easily distribute the number of connections\
    \ per task. (You can do this with IPC, but it's more trouble than it's worth.)\
    \ Threading lets you share everything between tasks, including the file descriptor\
    \ table.\n\nIn a similar vein, your server may have several threads running, making\
    \ it difficult to assign connections. You have a descriptor array and can use\
    \ the poll() system call. (You can use the select() call, but the algorithm is\
    \ not as straightforward.) Each thread owns one portion of the array. This works\
    \ only if the parent accepts all connections. When your server sees a connection\
    \ request, the parent accepts it and places it in the array of descriptors.\n\n\
    Depending on the implementation of poll(), your threads may have to time out frequently\
    \ so that they can pick up any changes to the descriptor array. A few implementations\
    \ simply cycle through testing each descriptor; others (more likely used in Linux)\
    \ actually register the descriptors into a system call. The system call waits\
    \ and reports on descriptor activity. Therefore, if the parent adds a new descriptor,\
    \ the thread must call poll() again to begin processing it.\n\n```\n/*****************************************/\n\
    /*** Fair load distribution example: parent accepts ***/\n/*** and assigns connections\
    \ to various threads. ***/\n/*** (\"fair-load.c\" on Web site)   ***/\n/*****************************************/\n\
    int fd_count=0;\nstruct pollfd fds[MAXFDs]; /* cleared with bzero() */\n/*---parent---*/\n\
    int sd = socket(PF_INET, SOCK_STREAM, 0);\n/***Bind() and listen() socket***/\n\
    for (;;) {\n    int i;\n    /*--- Find an available slot before accepting conn.\
    \ ---*/\n    for ( i = 0; i < fd_count; i++ )\n        if ( fds[i].events == 0\
    \ )\n            break;\n    if ( i == fd_count  &&  fd_count < MAXFDs )\n   \
    \     fd_count++;\n    /*---If you have an available slot, accept connection---*/\n\
    \    if ( i < fd_count )\n    {\n        fds[i].fd = accept(sd, 0, 0);\n     \
    \   fds[i].events = POLLIN | POLLHUP;\n    }\n    else                    /* otherwise,\
    \ yield for a little while */\n                        /* or, some yielding delay\
    \ */\n        sleep(1);\n}\n/*---child---*/\n```"
