    # NOTE


    # Difference Between fork() and vfork()


    On other UNIX versions, you may want to use the vfork() system call. Because processes
    do not share their data, the child must get a snapshot of the parent’s data space.
    If you just want to call exec() after the fork(), that copy is a waste of time
    and space. To solve this problem, some UNIX versions introduced the vfork() system
    call to suppress the copy. However, Linux uses a copy-on-write procedure (copying
    the parent’s pages only if the child or parent revises them). The exec-child does
    not revise the data pages, so the system does not copy any data pages. Therefore,
    Linux does not need the vfork() system call. It mapped the vfork() system call
    to fork().'
