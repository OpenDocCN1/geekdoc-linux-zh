    # ## A Simple Echo Server


    Before talking about the different system calls you use to create a server, you
    may want to see the general program flow of the server example. The example is
    the standard Echo Server. Like the Hello, World example for C programming, Echo
    Server is the example for socket servers. You can find the full source of this
    program on the Web site, and it is named *simple-server.c*.


    The simplest test for most communications is an echo. Just as a telephone salesman
    repeats your order back to you to ensure correctness, you can use an echo to start
    your own server. Basically, writing the program this way helps you build and test
    your critical application.


    # **NOTE**


    Build and Test Paradigm


    You may have noticed that this book cites many computer science–based disciplines.
    Network programming requires a greater focus on testing, checking, and construction.
    It is fraught with so many different fundamental issues that you must use the
    simplest programming approaches to minimize program errors. The build and test
    paradigm (a small facet of *rapid-prototyping*) lets you focus on a specific problem.
    After you solve the problem, the result becomes a building block for the rest
    of your development.


    The generic server requires that you call a series of system calls in a particular
    order. The Echo Server is a good demonstration of this order without muddying
    the example with server- specific processing. The following is the general program
    flow for the Echo Server:


    +   1. Create a socket with `socket()`.

    2. Bind the port with `bind()`.

    3. Convert the socket into a listening socket with `listen()`.

    4. Wait for a connection with `accept()`.

    5. Read the message with `recv()` or `read()`.

    6. Echo the message back with `send()` or `write()`.

    7. If the message is not *bye*, go back to step 5.

    8. Close the connection with `close()` or `shutdown()`.

    9. Go back to step 4.


    The program flow demonstrates the difference from a connectionless interface by
    not closing the connection until the client tells it to do so (with a *bye* command).
    [Chapter 4](Chapter_04.html) presented a comparison'
