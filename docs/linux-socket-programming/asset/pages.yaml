- pgno: 229
  md: '# Separating Analysis from Design


    Naming is very important, but making sure that you don''t get too far into the
    details is more important. Companies commonly define that a project requires a
    database long before they define the whole problem. What does that do? Is that
    bad?


    Designing before analyzing places the technology in the center of the process
    while everything else revolves around it. No good home architect would define
    the timber width before identifying the load on it. Similarly, if the analysis
    concludes with \textit{\"It must be written in Java\"} before the entire problem
    is known can cause harm to health and life (note the disclaimer Sun places on
    Java).


    Analysis is the time to look at the world through rose-colored glasses. When you
    enter the analysis phase, you only look at what needs to be done at the macro
    level. Anytime someone mentions a specific implementation detail, the detail goes
    directly to the design \textit{parking lot} (a list of items to be reviewed later).


    # NOTE


    System Constraints


    Sometimes the requirements have constraints that include specific hardware and
    software materials. If in moderation and part of the business requirements, you
    must consider them. However, you often can ignore most of them until the design.
    Still, if the requirement states that it must be written in COBOL, you must consider
    how that impacts your inheritances.


    Analysis also assumes that you have all the tools and container types you may
    ever need. Don''t worry yet about how certain things get done; just focus on the
    major things in the system and how they interact to implement the use-cases.


    # The Right Level of Detail


    The use-cases are very important for leading you through the process of analysis.
    However, just like your analysis, if you get too bogged down in the details, you
    won''t rise high enough to prove that the design meets the requirements.


    As you walk through the requirements, you begin to flesh out the superficial \textit{\"how\"}
    of the system. Work directly with the business people and show them how your high-level
    solution works to do what they ask. Inevitably, they discover that what you did
    is exactly what they asked for and not what they intended. If you go too far in
    the detail, the listeners either become lost or lose focus on the use-cases.


    If your customers (the business people) want to know more about how you intend
    to implement the product, that may be a good sign that your work is good. You
    can assure them that they can review the work again after you complete the design.
    At that point, they can see all the details they want.


    # The Inheritance Explosion


    During the design phase, you take the classes you defined and provide the details.
    You must be very careful at this point; the temptation is to merely inherit all
    the classes to a design-level detail. The rationale is \textit{\"We have a pristine
    and portable analysis. Let''s keep that pure during the design.\"} In fact some
    object-technologists strongly encourage this object explosion. However, that is
    rarely needed.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Most implementations do nothing more than fleshing out the container classes
    and adding a user interface. The analysis is still pristine and the work you did
    is not diluted. Just proceed to add the needed pieces to map the analysis to the
    system architecture.


    Also, if you permit an object explosion, the result is inevitable—object anarchy
    and a maintenance nightmare. You should only inherit a class if you need to mutate
    a behavior or add functionality. If the functionality is not part of the analysis
    but in the design, be sure that was not an oversight.


    Object anarchy really demonstrates a lack of responsibility modeling. Inheriting
    each class increases the likelihood of a tangled web as each class tries to establish
    the appropriate association.


    Maintaining this nest of connections is very difficult, even with the documentation.
    And when you try to revise one object in the inheritance tree, it may affect another,
    thus defeating the purpose of encapsulation.


    # ### Reuse-Misuse


    A common myth that object-aficionados hold to is their claim that they can reuse
    everything. This belief is very unrealistic. Just as converting a hammer into
    a dentist drill is at best a mismatch, some classes are best suited in one place—their
    intended design.


    If you want to reuse a class, make sure that the intent along with the interface
    closely match your needs. If you have to refit much of the interface, you may
    not have a good fit, or the original design is flawed. The following are a few
    issues to consider:


    Does the class''s intended function approximate your own?


    Would you have to refit only one or two interfaces?


    Do the parent classes and superclass meet your needs?


    Do you use the existing data as intended?


    If you say "no" to any of these, you may have a problem with reuse-misuse. One
    solution is to find a different parent class that more closely resembles what
    you are looking for. Another solution is to completely break away from the hierarchy
    and start a new development path.


    # ### Using C++''s friend Correctly


    Inheritance is a dangerous feature—especially when you are inheriting from a foreign
    class. Another dangerous practice is the use of friend. The friend directive lets
    other classes peer into and use the private parts of your class (breaking encapsulation).
    It also lets you insert your class into a set of working functions (such as operator
    overloads).


    Almost all object experts disavow the friend directive. Only in the use of operator
    overloading is this directive accepted as a necessary evil. Some have equated
    this directive to a goto. Don''t use it unless you can''t in all other ways avoid
    it.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# The Overloaded Operator


    Even operator overloading is now deemed unneeded and unwanted. It doesn''t break
    any cardinal rule of objects, but it does make code less readable and maintainable.
    The whole purpose of improving the software engineering technology is to increase
    reuse and pluggability. Overloaded operators often do exactly the opposite. They
    are confusing to use and maintain.


    Still, if you want to use overload operators, keep the following rules in mind:


    +   * **Don''t pass data by value or pointer**— Instead, pass by reference (§)
    wherever possible. If you don''t, you can end up with dangling pointers or degraded
    performance as you call the constructor and destructor over and over.


    +   * **Always overload the equals operator**— You must do this to do type conversions
    properly.


    +   * **Choose the operator that best fits your operation**— For example, `<string>+<string>`
    is clear, but *`<queue>` does not necessarily mean `Queue->Pop()` .


    +   * **Consider overloading the new( ) and delete( ) operators**— Some authors
    suggest this is a good idea, but this advice is dubious.


    +   * **Never overload the strange operators**— Function call (" ( ) ") and field
    accessors (" . " and " -> ") rarely result in clear interface usage.


    Overall, try to use meaningful programming. If you want people to use your good
    work, make it intelligible to them.


    # Objects Don''t Solve Everything


    Some people claim that objects are the end-all and be-all of programming. You
    can do a lot by using objects and Object Technology, but some tasks are simpler
    in other paradigms. Like the plumber that has only a hammer, a strict object programmer
    may see everything as an object problem.


    This section presents the problems with Object Technology.


    # Fads Come and Evolve


    Object Technology actually was the latest technology fad. The new one is patterns,
    which look at common systems of objects. The lesson is clear: Good fads evolve
    into something better. Just as you begin to learn one technology, another comes
    up to take its place in the limelight.


    # Inheritance Infection


    Objects introduced the concept of inheritance, reusing the behaviors of established
    classes. Unfortunately, some programmers believe that this is the panacea of programming—so
    they inherit everything. These programmers try to place everything into one hierarchy,
    even though individual things are completely unrelated.


    A typical-size program has between three and five primary components, and each
    component may have between two and seven objects. Having all the classes related
    logically is extremely rare, and forcing this relationship is unnecessary. (Please
    note that this does not apply to Java, which inherits all classes from Object.)'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Unreachable Code


    Object Technology can answer many problems in a particular domain of programming.
    Many of the problems thrown at it are general and probably may not change. This
    is why reuse is so important. Someone once said that it is probable that most
    of the programs have already been written. The work that is now done is in human
    interfaces and new technology.


    Object Technology cannot solve a small set of problems, however. These problems
    get closer to nature than the current definition of objects does. This section
    introduces these limitations and possible ways around them.


    # Partial Class


    The first limitation is the partial class. In nature, if you remove all but one
    of the legs from a chair, it still would be a chair. However, if a class loses
    some of its functionality, it would no longer qualify as the original class. While
    it has the original interface, it is not an inheritance of the original form.


    # Null Functions


    The partial class also extends into null functions. The *null function* allows
    you to turn off a method so that it no longer offers the service. While inheriting
    from a parent class, you may find that a particular service is now obsolete or
    even destructive to the new class. A null function or method prunes the method
    completely out of the new class and from there is forgotten.


    If you want this feature, some programmers override the method and attach no behavior
    to it. While this effectively accomplishes the same goal, the method is still
    there, occupying definition space.


    # Object Mutation


    Another limitation is *object mutation*, which lets the programmer change one
    object into another without casting. Casting types is very dangerous, even in
    the strongly typed world of object-enabled languages such as C++ and Java. Mutation
    is a kinder form of casting that has certain rules to ensure you get from A to
    B without too much trouble.


    Mutation is a tool that lets you create a generic object and, while discovering
    more about it, you can change or mutate it little by little—even coming up with
    a whole new, previously unknown class. A perfect place for this kind of tool would
    be object streaming, where you can get a general blob of data and have to decipher
    it. You can, in part, create a translator constructor that takes the other form
    and creates a new class from it, but you would have to write a translator constructor
    for every other related class—a combinatorial problem.


    The mutation engine requires the following criteria:


    +   - **The blob must remain intact**— The engine does not create a copy or translate
    any information. Instead, it changes the interpretation of the information.

    - **The blob can only mutate within the inheritance hierarchy**— To change an
    object into another, the two classes must have a common thread of identity.

    - **The discovery engine must be able to create an instance of an abstract class**—
    You may find this difficult to accept, but during the discovery process (just
    as when playing Twenty Questions) you may have to start with the abstract.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   * **The result must always be an instance of a concrete class** — The reason
    is obvious: No object can exist on an incomplete class.

    * **The discovery engine must have access to private elements** — This does appear
    to fly in the face of encapsulation, but to discover the true nature of the blob,
    you need to know the intimate parts of the destination class.

    * **The process must be able to nullify methods and support partial classes**
    — Sometimes, you may need to turn off methods of defined classes dynamically so
    that the resulting mutated object behaves correctly. A mutated thing in nature
    may have abilities and limitations beyond those defined by the genus.


    The mutated object has great power in dealing with instances the program code
    did not anticipate. It provides a little more intelligence to the system and more
    closely resembles nature.


    # Heuristic Algorithms


    Object Technology does not directly support heuristic algorithms. *Heuristic algorithms*
    are goal-based problems in which the user describes the problem, and the computer
    resolves to the goal. Much can be simulated, but a whole premise of nondeterministic
    resolution is computationally unreachable.


    You can create heuristic algorithms and use a pseudo-random number generator to
    approximate the resolution nondeterminism. However, this simulation is bound by
    the effectiveness of the random numbers.


    # Massively Parallel Algorithms


    The last algorithmic problem involves massively parallel problems, such as true
    neural networks. Again, like heuristic algorithms, it can only simulate the results.
    True compliance to a massively parallel system would require dedicated goal-based
    processors. Even the highly integrated parallel Fortran program would struggle
    to meet those requirements.


    # Complexity Give and Take


    Object Technology has other limitations beyond just the technology itself. Professionals
    have discovered that as they work with large frameworks (library hierarchies)
    or maintain existing implementations, the promises of objects are not panning
    out. This section expands the issues with objects and what history has shown.


    # Simplifying Programs with Established Interfaces


    Over the years that object programming has flourished, professionals have discovered
    several learning points. One learning point is the importance of established interfaces.
    The interface of a class is critical for its longevity. However, programmers rarely
    put the time into designing the best interface.


    The interfaces of hacked code often are too specialized or too functional to really
    take advantage of the power of objects. So, when others open up the code to maintain
    it, they find that the methods and even the entire behavior of the class has devolved
    over time. It is very common to encounter a paintball-approach to programming
    in these classes: "It works here—why not copy and paste the code here and here?"'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The interface is the most important part of modular programming—that cannot
    be said enough. However, the interface must be simple and intuitive. Another problem
    is the frameworks themselves and their multi-class interfaces. It is very common
    to find that you have to instantiate several classes in a particular order as
    you program with these systems of classes. This order and complexity are very
    evident in GUI programming, perhaps because of the features and options GUIs offer.


    As you create your objects, consider how simple and clear the method interfaces
    are. More importantly, make sure that this is the way the programmer works with
    your classes. If you need class interdependencies, make them as easy to assemble
    as possible.


    # Multiple Inheritance Conundrum


    Another complexity stems from the features of inheritance. The C++ language lets
    you create classes that inherit from multiple parent classes. Managing an inheritance
    hierarchy is difficult enough. <span style=''color:red''>Chapter 11, "*Saving
    Time with Objects*"</span> mentions the concept of coupling. Inheriting from multiple
    sources introduces unhealthy coupling between classes.


    This coupling forms a dependency on the parent classes. If these classes change,
    the designer has to verify the interfaces between them and the subclass. The changes
    sometimes are very subtle but may require special name resolutions in the subclass.
    This is pretty messy.


    From a theoretical view, multiple inheritance is viable but impractical. A design
    that has multiple inheritances is typically broken. Most of the reasons stem from
    improper responsibility delegation or class naming. The most common cause is improper
    abstraction and delegation. Often, the two parent classes have a common set of
    behaviors that should be extracted and placed above them as a superclass.


    Another common cause of multiple inheritance is naming a class with a verb. For
    example, if you have *StreamReader* and *StreamWriter*, you must merge the two
    to get a random access *Stream*. The names *-Reader* and *-Writer* are the problem.


    You can solve the majority of multiple inheritance problems either by pulling
    out the common features into an abstract superclass or by using containers. Usually,
    the new class is more similar to one parent class than to the other. Inherit from
    the more similar class, and contain the other one.


    Task-classes prove to be a small exception to that rule. If you have a class that
    is related to one parent class and is also a task (process or thread), you may
    be stuck using multiple inheritance. The reason is that the class cannot contain
    a task-class: The programming just does not work very well. Your subclass is usually
    more related to the other class.


    To solve the task-class problem without multiple inheritance, you may have to
    force the subclass to inherit from the task and contain the other class. It''s
    double but can be cumbersome.


    # Code Bloat


    The inheritances, abstractions, overloads, and templates are tremendous helps
    in getting your job done quickly. However, you can run into another problem: source-
    and object-code bloat. The increases in object size may not be important if you
    have plenty of memory. But the more lines of code you write, the more likely the
    program has defects.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Depending on the complexity of your classes, you can see a 20% to 50% increase
    in the number of lines of code you have to write compared to a modular design.
    This is largely due to the language syntax and support. With the sacrifice of
    increased source complexity, you do get more capability and stronger typing.


    The first object programmers were surprised by object-code bloat. In some instances,
    for identical functionality, converting C to C++ yielded a 10$^{\prime}$ increase
    in the resulting program. This is an extreme example, but you can expect a typical
    2 to 5$^{\prime}$ increase in program size.


    You can reduce these increases by doing the following:


    +   Don''t overload operators.

    Don''t try to unify all classes into single inheritance hierarchies.

    Don''t use virtual inheritance.

    Don''t go overboard on virtual methods.

    Never use multiple inheritance.

    Limit inline functions. (Some say that you should always avoid explicit inline
    functions and let the compiler choose that feature.)


    These hints can help you a great deal to minimize the size of your source and
    object code. Still, expect an increase nonetheless; the name resolution engine
    and support libraries are larger than those of functional or modular languages.


    # Project Management Dilemma


    An object program presents a new and unusual set of problems for the manager.
    He has to coordinate more people at once and prove that work is moving forward.
    Especially when multiple teams are involved and unless the project has a technology
    manager, the project manager has to coordinate with many more people than those
    who are working on the project.


    The Object-Project Manager has to be all things to all people. Having skills in
    delegation, coordination, organization, and even negotiation are critical for
    the project''s success. Keep in mind that a successful project means much more
    than getting a product out on time and under budget. If the team disintegrates
    after completion or if the documentation does not represent the product or if
    the customer is unsatisfied or feels beaten up, the project was a failure.


    This section merely touches on some of these issues. You may want to remember
    that this is a much bigger problem than what a few pages can outline. Every manager
    must face the reality that the success of the project is the team—not the product.


    # Getting the Right People at the Right Time


    The best project has the best people moving in and out of the picture. Training
    is an ancillary issue and must be coordinated with mentors. The reason the product
    is not the determining fact of success is that the product was requested and approved
    by those who would use it. Its acceptance is a given if the result matches what
    the users had in mind.


    The team''s success is more important, and the manager has more people than programmers
    on the team. The following is a list of those on the team and when they are needed:


    +   **Project Sponsor**— Provides money to the project. He needs to lead the major
    milestones of the project.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   • **Customer Advocate** — Interfaces with and checkpoints the customer.
    The advocate must be very familiar with the way the customers think and how they
    work. He drives the requirements of the product and is involved all the way through
    the project.


    +   • **Business Analysts** — Collect and distill the requirements documentation.
    They are involved during requirements gathering and analysis and must checkpoint
    with the customer advocates. Later, they are very helpful during testing.


    +   • **Technical Analysts** — Take the analyses through the design process. They
    map the modeled form of the analysis to the real world, and they must checkpoint
    regularly with the business analysts.


    +   • **Quality Representative**— Collects and archives documentation and drives
    the testing process. After the business analysts solidify the requirements, the
    quality representative begins to generate the acceptance tests. When the design
    is done, he can begin to work on the boundary and stress tests.


    +   • **Programmers** — Take the design and codify it in the selected language.


    +   • **Legacy Systems(if needed)** — Stand as a resource to the technical analysts
    to ensure that the interfaces match up.


    This is a much larger team than most managers think about. If the project manager
    runs the process smoothly, each person moves in and out of the picture and places
    a stamp of approval on the product.


    # ## WISCY ("Whiskey") Phenomenon


    With all the people that need to be involved, the manager often faces the "Why
    Isn''t Sam Coding Yet?" (WISCY) problem. Both the Project Sponsor and the Customer
    Advocate often raise this issue. That''s natural: One wants to see the results
    of his money, and the other wants to see the product.


    According to the industry''s best practices, only 20% of the total project time
    is coding. The other 80% of the time is equally divided to analysis/design and
    testing (40% analysis and design, 20% coding, and 40% testing). Typically, the
    American software industry ends up following more closely to 33% analysis and
    design, 34% coding, and 33% testing. So at most, 33% of the time is really spent
    in coding. Why not spend the time up front ironing out all the requirements and
    definitions and design?


    To appease the Project Sponsor and the Customer Advocate, let them know what the
    schedule looks like and keep them apprised of the progress. Involve them with
    presentations and show them the documentation. Let them know how important their
    project is to you, the manager.


    If that doesn''t work, you can use Just-In-Time (JIT) design. JIT Design gets
    you coding quickly but can introduce holes. When that occurs, plug them. As you
    run into problems that need clarification, work with the Customer Advocate and
    even the customers themselves because a JIT design requires a much stronger interfacing.


    However, do not fall into the trap of creating a throwaway prototype to show your
    customers. That never works. If you create a prototype (especially during JIT
    design), expect to use it and never have the time to "do it right later."'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# **Testing (Dis-) Integration**


    The whole software development cycle depends on a sequence of deriving and validating
    needs. The first part of the process describes the needs, and a supervisory process
    ensures that the project codifies the needs. This supervisory process is often
    called *testing* or *quality assurance*.


    In reality, validation does much more than just test features. It gathers and
    archives work products; it checks and verifies product deliverables; and it assures
    business and product-line compliance. Of all the responsibilities of a project,
    the Quality Representative has the most difficult.


    Object Technology does not help matters. In fact, it doubles to quadruples the
    level''s complexity. First, white- and black-box (defined in the next section)
    testing and validation were sufficient. The modules introduced gray-box testing.
    Objects add inheritance, polymorphic, framework, reuse-compliance, and interface
    testing. The sheer complexity that Object Technology adds to the field of software
    quality has caused many to rethink testing entirely.


    The first mistake many make is to have the designer or coder alone test his work.
    This problem should be obvious: The same blind spots that caused the defect may
    possibly interfere with discovering them. The probability of this coincidence
    is too high to overlook. Get good experienced testing engineers to crosscheck
    the programmers''work.


    When creating an object project, you and your customer must identify how much
    testing is to be done. Be aware that validation costs resources and time. Expect
    the number of man-hours spent on a regular project to double or triple as you
    transition to an object project.


    # **Shades of Gray**


    The last section mentions white-, gray-, and black-box testing. Software testing
    uses techniques similar to those found in objects, one being encapsulation. Defining
    the *grayness* of the system exposes the amount of visible internals. In full
    light (white-box), the tester explores every function, path, decision, and statement.
    Often, the programmer or designer can do that fairly safely.


    Black-box testing perceives the system from the user''s point of view. Black-box
    is similar to acceptance testing where the use-cases decide compliance.


    The last is gray-box testing, which meets in the middle. It has more knowledge
    of the implementation (down to the module or function level, but goes no further),
    and it depends on the use-cases for the validation paths.


    Objects blur these definitions quite a bit. For example, where do you fit inheritance,
