- pgno: 351
  md: "| fd | File descriptor (can be a socket descriptor) |\n| buffer | The message\
    \ to write |\n| msg_len | The length of the message |\n\n# ### Possible Errors\n\
    \n| EBADF | fd is not a valid file descriptor or is not open for writing. |\n\
    | EINVAL | buf is attached to an object that is unsuitable for writing. |\n| EFAULT\
    \ | buf is outside your accessible address space. |\n| EPIPE | fd is connected\
    \ to a pipe or socket whose reading end is closed. When this happens, the writing\
    \ process will receive a SIGPIPE signal; if it catches, blocks, or ignores the\
    \ error, EPIPE is returned. |\n| EAGAIN | Non-blocking I/O has been selected using\
    \ O_NONBLOCK and there was no room in the pipe or socket connected to fd to write\
    \ the data immedietly. |\n| EINTR | The call was interrupted by a signal before\
    \ any data was written. |\n| ENOSPC | The device containing the file referred\
    \ to by fd has no room for the data. |\n| EIO | A low-level I/O error occurred\
    \ while modifying the inode. |\n\n# ### Example\n\n```\n```c\n/\\*\\*\\* Write\
    \ a message (TCP, UDP or Raw) \\***/\nint sockfd;\nint bytes, bytes_wrote=0;\n\
    /\\*--- Create socket, connect to server ---\\*/\nwhile ( (bytes = write(sockfd,\
    \ buffer, msg_len)) > 0 )\n    if ( (bytes_wrote += bytes) >= msg_len )\n    \
    \    break;\nif ( bytes < 0 )\n    perror(\"write\");\n```\n```\n\n# ### close()\n\
    \nCloses all descriptors (file or socket). If the socket is connected to a server\
    \ or client, it requests a close(). The channel actually remains active after\
    \ the close until the channel empties or times out. Every process has a limit\
    \ to the number of open descriptors it can have. getdtablesize() returns 1024\
    \ in Linux 2.2.14, and the /usr/include/linux/limits.h file defines this limit\
    \ with NR_OPEN. Also, the first three descriptors default to stdin(0), stdout(1),\
    \ and stderr(2).\n\n# ### Prototype\n\n```\n```c\n#include <unistd.h>\nint close(int\
    \ fd);\n```\n```\n\n# ### Return Value\n\nZero if everything goes well. If an\
    \ error occurs, you can find the cause in errno.\n\n# ### Parameter\n\n| fd |\
    \ The file or socket descriptor |"
