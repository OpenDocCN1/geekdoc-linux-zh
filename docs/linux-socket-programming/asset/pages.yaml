    # ## Adding Multitasking


    Another limitation, as mentioned earlier, is the lack of multitasking support.
    Most programs that work with the network do several tasks at the same time to
    improve performance. Offering processes and threads as an intrinsic feature of
    the framework would make that programming much simpler.


    The problem stems from the mere definition of a class: something that does and
    knows something. So, if you define a socket class, would you have a multitasking
    socket and a multithreading one? Furthermore, is a task an object? If so, there
    are really two derivable classes: Socket and Process/Thread. The result is a multiple-inheritance
    problem (which most object- fundamentalists would scowl at).


    Perhaps the problem is simpler than it appears. But the idea of combining client,
    server, datagram, broadcast, and multicast with non-multitask, thread, and process
    into 15 classes is not optimal.


    # ## Summary: A C++ Socket Framework Simplifies Programming


    Using an object-oriented language, such as C++, can help simplify socket development.
    You have seen how much of socket programming is very similar with only a few variations,
    but you need to follow certain rules to write a library or framework for sockets.
    These rules differ slightly from the standard OOA/D practices.


    A framework coordinates the interfaces between components, and components define
    the job or primary functionality of a set of networked classes. Every class in
    the component works toward completing this job.


    The Sockets Framework includes four components: exception, message, address, and
    socket. The exception component remains separate from the other components to
    reduce the likelihood of internal failure. The address and message components
    provide support to the socket component.


    This chapter demonstrates for you the process of creating a framework for sockets
    and shows you how you can do it for your own programs. The extensibility of C++
    and the framework may help you try out these features in your own C++ jobs.


