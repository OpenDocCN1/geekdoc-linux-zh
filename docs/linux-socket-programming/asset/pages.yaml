  md: "```\n```C\n/*** RPC syntax example          ****/\n/**** /***********************************/\n\
    typedef struct NodeStruct TNode;\nstruct NodeStruct\n{\n    string Name<>;\n \
    \   TNode *Next;     /--- This is not legal ---/\n};\n```\n```\n\nThe Sams Web\
    \ site has several examples, including a RPC ps command that ships the information\
    \ back in a dynamically allocated table with rows and fields.\n\n# ## Creating\
    \ Non-Stateless Calls with Open Connections\n\nPassing information back and forth\
    \ from the client to the server involves much more than the data. Each program\
    \ often has to keep track of the machine state in order to respond correctly to\
    \ a request. The previous sections focused on programs that assume nothing about\
    \ other calls; they also refer to another type of call. Each call is typically\
    \ independent from every other (a *stateless connection*). This is not very useful\
    \ if you have to maintain some kind of information from call to call.\n\nFor lack\
    \ of a better term, a *stateful* (or non-stateless) connection must retain some\
    \ kind of information so that proper communications can occur. A couple examples\
    \ of this are logins (the person must be logged in before he gets any data) and\
    \ database transactions (the server may not transmit the entire table all at once).\n\
    \nThe first course of action is to answer these questions: \"Why are stateless\
    \ connections common?\" and \"Why are stateful connections a burden?\"\n\n# ##\
    \ Diagnosing the State Problem\n\nThe stateless connection is simple. The client\
    \ sends information, and the server replies with the answer. If the question is\
    \ lost, the client simply asks again. That approach falls very short of the needs\
    \ of a stateful connection.\n\nThe stateful connection has to maintain a relationship.\
    \ As noted in earlier sections and chapters, a server and client must make sure\
    \ that the handshake is deterministic and recoverable. The problems with stateful\
    \ connection include the following:\n\n+   * **Current State**— The session must\
    \ keep track of the actions already performed. No one likes to answer questions\
    \ or jump through the same hoops over and over.\n* **State Path or Route**— The\
    \ session must clearly have a particular path or route. The steps forward and\
    \ back must be deterministic and clear. If not, state recovery or next steps become\
    \ uncertain or confused.\n* **State Recovery**— If a state is lost the system\
    \ may need to roll back to a previously known state. Even if connections drop,\
    \ the client and server must pick up where they left off. As a last resort, both\
    \ systems must be able to completely undo the transactions up to the point of\
    \ disconnection.\n\nThe state problem must address each of these issues. In some\
    \ cases, recovery is moot. But, overall, the client and server must uniquely identify\
    \ each other's current session."
