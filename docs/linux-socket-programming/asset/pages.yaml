    # **Summary: Walk Carefully on Shale**


    Object Technology provides a great deal of power, but this power does have incremental
    costs. The increased costs arise from theory, technology, and personnel. Like
    climbing a mountain of shale, you have to step carefully and expect a little backsliding.


    Some backsliding comes from trying to do too much at once. Try to control that
    urge. Educate and share the learning process. The most important task you may
    ever do is involve your customers. If the customers feel like they are involved
    and important, they will be happy with what they get.


    Working with the extended team is next in importance. Try to look out for the
    pitfalls of Object Technology and let each person know how he can be important.
    In the way a director brings actors in and out of a scene, you can give the participants
    the heads-up when they are needed.


    The success of the team supercedes the success of the product because the product
    is a known want or desire. The rest is getting done on time with satisfaction.
    A satisfied customer wants more, and a satisfied team works more closely—like
    a well-oiled machine.


    # *Part IV: Advanced Sockets—Adding Value*


