  md: "For example, if you want to disable `SO_KEEPALIVE`, use the following:\n\n\
    ```\n/*****************************************/\n/*** setsockopt() example: disable\
    \ keepalive ***/\n/*****************************************/\nint value=0; /*\
    \ FALSE */\nif ( setsockopt(sd, SOL_SOCKET, SO_KEEPALIVE, &value,\n          \
    \     sizeof(value)) != 0 )\n    perror(\"setsockopt() failed\");\n\n```\n\nLikewise,\
    \ if you want to know the socket type (`SO_TYPE`), you can use this example:\n\
    \n```\n/*****************************************/\n/*** getsockopt() example:\
    \ socket type ***/\n/*****************************************/\nint value;\n\
    int val_size = sizeof(value);\nif ( getsockopt(sd, SOL_SOCKET, SO_TYPE, &value,\n\
    \               &val_size) != 0 )\n    perror(\"getsockopt() failed\");\n\n```\n\
    \nThe following sections define each of the options you can use.\n\n# General\
    \ Options\n\nThe general options apply to all sockets. The level for these options\
    \ is `SOL_SOCKET`.\n\n+   •   `SO_BROADCAST` This option permits your socket to\
    \ send and receive broadcast messages. The `broadcast` address sets the active\
    \ subnet bits (see Chapter 2, \"TCP/IP Network Language Fluency\") to all ones.\
    \ Not all networks support broadcasting (ethernet and token ring do). Those networks\
    \ that do support it allow only datagram messages. (Boolean, disabled by default.)\n\
    \n•   `SO_DEBUG` This option enables logging of information about all messages\
    \ sent or received. TCP is the only protocol that supports this feature. To learn\
    \ how to read this queue, refer to the TCPv2 RFC. (Boolean, disabled by default.)\n\
    \n•   `SO_DONTROUTE` In rare circumstances, you may not want your packets routed\
    \ to get to the destination. An example of this is router configuration packets.\
    \ This option enables/disables routing. (Boolean, disabled by default.)\n\n• \
    \  `SO_ERROR` Get and clear any pending socket error. If you do not pick up this\
    \ error before the next I/O operation, `errno` gets the error. (Integer, 0 by\
    \ default, read only.)\n\n•   `SO_KEEPALIVE` If your TCP socket does not hear\
    \ from the external host for 2 hours, it sends a series of messages trying to\
    \ reestablish connection or determine a problem. If it finds a problem, the socket\
    \ posts an error and closes itself. (Boolean, enabled by default.)\n\n•   `SO_LINGER`\
    \ The socket does not close immediately if it still has data in its buffers. The\
    \ `close()` system call flags your socket for closure (without closing it) and\
    \ returns immediately. This option tells the socket to force your program to wait\
    \ until the close completes. It uses the `linger` structure, which has two fields:\
    \ `l_onoff` (enable/disable lingering) and `l_linger` (maximum wait in seconds).\
    \ If enabled and `l_linger` is zero, a socket close aborts the connection and\
    \ drops all buffered data. On the other hand, if"
