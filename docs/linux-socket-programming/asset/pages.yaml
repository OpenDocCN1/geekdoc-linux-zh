    You saw this algorithm in Chapter 7, and it serves a long-term connection very
    well. Long-term connections include logins, database interfacing, and any other
    interaction where the client and server correspond for several iterations.


    This algorithm has a major flaw: What happens if you run out of PIDs? What happens
    if you start thrashing your swap because you don''t have enough RAM to support
    the number of processes? This is exactly the problem with rabbit process generators.


    # **NOTE**


    Difference Between RAM and Memory


    You may think that the virtual memory system with all your swap space can save
    your system. Actually, that''s quite misleading. When you want performance, you
    need to keep all the active processes with their data available in RAM. If they
    become swapped out, the time that the kernel requires to load it back in wipes
    out any perception of speed. Knowing your system, the memory, processors, and
    I/O is the first hurdle to squeezing out performance.


    One method you could try is keeping count of processes:


