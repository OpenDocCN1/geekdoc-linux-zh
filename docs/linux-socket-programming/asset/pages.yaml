    Can't make socket input-only\");\n```\n\n# Network Data Conversions\n\nWhile working\
    \ with data on the network, you must consider the data byte-ordering, converting\
    \ addresses, and so on. The Socket API includes a sizeable list of tools to help\
    \ you get the information you need. This section describes the tools that the\
    \ book has used (and a few others).\n\n# htons() or htonl()\n\nConvert host-byte\
    \ order binary data to network-byte order. On a little-endian processor, the call\
    \ swaps the bytes around. A big-endian host does nothing but return the value.\n\
    \n# Prototype\n\n```\n#include <netinet/in.h>\nunsigned short int htons (unsigned\
    \ short int host_short);\nunsigned long int htonl (unsigned long int host_long);\n\
    ```\n\n# Return Value\n\n(none)\n\n# Parameters\n\n| |\n| --- |\n| host_short\
