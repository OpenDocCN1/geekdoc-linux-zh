    \ &addr, sizeof(addr)) != 0)\n            perror(\"bind() failed\");\n      else\n\
    \      {\n            FD_SET(sockfd, &set);\n            if ( max < sockfd )\n\
    \                 max = sockfd;\n      }\n}\nif ( select(max+1, &set, 0, &set,\
    \ &timeout) > 0 )\n{\n      for ( i = 0; i <= max; i++ )\n            if ( FD_ISSET(i,\
    \ &set) )\n            {\n                 int clicant = accept(i, 0, 0);\n  \
    \               /**** process the client's requests ****/\n            }\n}\n\
    ```\n\n# write()\n\nWrite `msg_len` bytes to `fd` field descriptor from `buffer`.\
    \ You can use a socket descriptor as well, but it does not provide you with as\
    \ much control as the `send()` system call.\n\n# Prototype\n\n```\n#include <unistd.h>\n\
    int write(int fd, const void *buffer, size_t msg_len);\n```\n\n# Return Value\n\
    \nNumber of bytes written. The byte count can be less than `msg_len`. If the call\
    \ does not succeed in writing all required bytes, you can use a loop for successive\
    \ writes. If negative, the call stores the error detail in `errno`.\n\n# Parameters"
