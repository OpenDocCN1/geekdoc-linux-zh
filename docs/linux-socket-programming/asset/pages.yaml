  md: "# Prototype\n\n```\n```c\n#include <sys/socket.h>\n#include <resolv.h>\nint\
    \ connect(int sockfd, struct sockaddr *addr, int addr_len);\n```\n```\n\n# Return\
    \ Value\n\nZero (0) if everything goes well. If an error occurs, you can find\
    \ the cause in `errno`.\n\n# Parameters\n\n| **sockfd** | The freshly created\
    \ socket. You could optionally call `bind()` before this to assign the local port.\
    \ If you do not, the kernel assigns the next available port slot. |\n| `addr`\
    \ | The address and port of the destination address. |\n| `addr_len` | The length\
    \ of addr data block. |\n\n# Possible Errors\n\n| EBADF | Bad descriptor. |\n\
    | EFAULT | The socket structure address is outside the user's address space. This\
    \ is caused by a bad addr structure reference. |\n| ENOTSOCK | The descriptor\
    \ is not associated with a socket. |\n| EISCONN | The socket is already connected.\
    \ You cannot reconnect a connected socket. Instead, you have to close the socket\
    \ and create a new one. |\n| ECONNREFUSED | Connection refused at server. |\n\
    | ETIMEDOUT | Timeout while attempting connection. |\n| ENETUNREACH | Network\
    \ is unreachable. |\n| EADDRINUSE | Address is already in use. |\n| EINPROGRESS\
    \ | The socket is non-blocking, and the connection cannot be completed immediately.\
    \ It is possible to `select()` or `poll()` for completion by selecting the socket\
    \ for writing. After `select()` indicates writeability, use `getsockopt()` to\
    \ read the `SO_ERROR` option at level `SOL_SOCKET` to determine whether the connection\
    \ was successful (`SO_ERROR` is zero) or unsuccessful (`SO_ERROR` is one of the\
    \ usual error codes previously listed, explaining the reason for the failure).\
    \ |\n| EALREADY | The socket is non-blocking, and a previous connection attempt\
    \ has not yet been completed. |\n| EAFNOSUPPORT | The passed address didn't have\
    \ the correct address family in its `sa_family` field. |\n| EACCES | The user\
    \ tried to connect to a broadcast address without having the socket broadcast\
    \ flag enabled. |\n\n# Example\n\n```\n```c\n/** Connect to a TCP server **/\n\
    int sockfd;\nstruct sockaddr_in addr;\nsockfd = socket(PF_INET, SOCK_STREAM, 0);\n\
    bzero(&addr, sizeof(addr));\naddr.sin_family = AF_INET;\naddr.sin_port = 13; /*\
    \ current time */\ninet_atoi(\"127.0.0.1\", &addr.sin_addr);\nif ( connect(sockfd,\
    \ &addr, sizeof(addr)) != 0 )\n    perror(\"connect\");\n```\n```"
