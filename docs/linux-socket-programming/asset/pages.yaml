  md: '# Give the Child More Attention: Priority and Scheduling


    You can lower the child''s priority so other tasks get more CPU time. (As you
    may know, only a *root*-privileged task can increase a task''s priority.) The
    system calls to use to change priority are `getpriority()` and `setpriority()`.


    Unlike processes that offer little control over the children, threading allows
    you to change its scheduling algorithm or disown it. Linux uses a prioritized
    round robin scheduling algorithm (as introduced earlier in this chapter). Threads
    offer you three different scheduling algorithms:


    +   - Normal—This is like the Linux scheduling algorithms. (default)


    +   - Round Robin—The scheduler ignores priority and each thread gets a slice
    of time until terminated. You might use this in real-time environments.


    +   - FIFO—The scheduler queues up and runs each thread to completion. Again,
    use this scheduling form primarily for real-time environments.


    # Burying the Zombies: Cleaning Up after Termination


    Perhaps it escaped your notice that some of the process table examples you''ve
    worked on may have some zombies floating around. Sorry, this is not a Halloween
    thriller, but the problem can cause horror to any system administrator. After
    you get them in your process table, they sometimes won''t go away without rebooting.


    If you like taking risks and don''t know what a zombie is, you might consider
    creating one on your system. *Don''t do this if you can''t reboot your computer.*
    They won''t harm your computer, but they can take up valuable resources (memory
    and process table entries). Run the Multitasking Echo-Server code (found on the
    Web site). Connect to it, and then, type "*bye*". It closes the connection. Now
    type `ps aux|grep <username>` (substituting your username as appropriate). You
    may see an entry with a status of *z*. This does not mean it''s sleeping. You
    usually can kill it by killing the parent (Echo-Server).


    When the child ends, it exits with a numeric return value. The value indicates
    either a success or some error code. Normally, you have to program the parent
    to wait for the child task to complete using the `wait(), wait()` system call.
    `wait()` retrieves the child''s return value for the parent to examine. If you
    do not wait for the child, the child waits indefinitely for you.


    NOTE


    # Getting Process Zombies


    The parent should care for all its children. Sometimes it doesn''t. When the parent
    ends without reconciling with all its completed children, the `init` program inherits
    them. The `init` program''s primary responsibility is to schedule, run, and clean
    up processes. Occasionally it can''t. This is when zombies begin to proliferate
    in your process table. You won''t be able to use the `kill()` command to remove
    them. The only solution is to reboot your system. You can try `init` s or `init`
    1 to flush the process table, but there''s no guarantee that it will work.)


