    \ %*s\\n\", \n                 NAME, Name, ADDRESS, Address, PHONE, Phone) < 0\
    \ )\n    perror(\"Fscanf\");\n{...\n```\n```\n\nOnly stream-style sockets can\
    \ be converted reliably into a FILE* stream. The reason is simple: Datagram sockets\
    \ are typically connectionless—a message is sent and that's it. Also, streaming\
    \ sockets provide data integrity and message reliability, whereas datagrams are\
    \ unreliable. Datagrams are similar to putting a message in an addressed and stamped\
    \ envelope that you send through the postal system: The message may not arrive\
    \ at all. A FILE* connection must be an open channel. If you try to convert a\
    \ datagram, you may lose critical data. For more information about streams versus\
    \ datagrams, see [Chapter 3, \"Different Types of Internet Packets.\"](#)\n\n\
    FILE* socket connections provide excellent scanning and parsing resources for\
    \ the network programmer. However, when you use them, you must check *all* return\
    \ values, including `*printf()` and `*scanf()`. Note the preceding example: If\
    \ the return value of `fscanf()` is less than zero, there was an error.\n\n# **NOTE**\n\
    \n# Network Security and Reliability\n\nSecurity and reliability are of the utmost\
    \ importance when you create network programs. At the time of writing this book,\
    \ Microsoft operating systems have faced several fundamental security problems,\
