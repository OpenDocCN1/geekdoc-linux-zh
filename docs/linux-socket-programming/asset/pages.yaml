    # Sending Simple Messages


    The second major feature is crucial for effective functionality—the framework
    must be able to send and receive messages. The message has three parts: addresses,
    the channel, and the message body.


    Earlier chapters describe two methods each for sending and receiving messages.
    These calls assume certain socket states. For example, you must have a connected
    socket to use the `send()` system call. The primary goal for getting and receiving
    messages includes simplifying these interfaces.


    What would simplify communications is to get the message to ship itself. One of
    the extended features described in Chapter 11 was data streaming—the automatic
    packaging and unpackaging of data. The class would know its internals rather well;
    it should assume that role.


    The C++ language does not lend itself to providing data streaming. It has a significant
    limitation—it must know the data before it uses it. Compare with Java—Java lets
    you define a class and attach a *Serializable* interface. From there, the class
    packages/unpackages itself automatically. Very easy. It can do this because it
    uses interpreted byte code. It assumes no machine-specific information.


    A C++ program must provide the packaging and unpackaging procedures. And, because
    C++ does not support interfaces, you must inherit from a common class that describes
    those procedures.


    # Managing Exceptions


    The third major feature must control the various exceptions and errors that the
    network introduces to programming. While you create and configure your sockets
    and while sending and receiving messages, any number of asynchronous errors can
    occur.


    All errors originate from the socket, the connection, the route, or the other
    host. Quickly and efficiently collecting the errors helps the user-programmer
    to isolate the problem and recover appropriately.


    The framework uses the C++ exception management construct `try...catch()`, similar
    to that found in Java. The user-programmer must catch all exceptions that the
    framework throws; otherwise, the program terminates with an uncaught exception
    error. You can catch all unexpected exceptions at the root of the program and
    return some meaningful message to improve debugging.


    # Configuring the Socket and Connections


    The last major feature is configuring the socket or connection you created. All
    of the socket types have different settings that allow you to tune them. The different
    tunable settings change the behavior of the socket or the send and receive channels.


    # Grouping into Major Components


    The next step in creating a framework is identifying all of the major pieces or
    components. *Components* are networks of objects that work together to solve a
    particular problem or provide a service. Just as with objects, components have
    responsibilities and interfaces, so you can treat them like objects as well.'
