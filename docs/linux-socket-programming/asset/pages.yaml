- pgno: 51
  md: 'service. Because correct time is Temporal, a host may drop a couple of clock
    ticks without losing integrity.


    UDP offers the advantage of high speed. Moreover, you can increase its reliability
    yourself in the following ways:


    +   - Break up large packets. Take each message and divide it into portions and
    assign a number (such as 2 of 5). The peer on the other end reassembles the message.
    Bear in mind that more overhead and less sent data decrease throughput.


    +   - Track each packet. Assign a unique number to each packet. Force the peer
    to acknowledge each packet because, without an acknowledgment, your program resends
    the last message. If the peer does not get an expected packet, it requests a resend
    with the last message number or sends a restart message.


    +   - Add a checksum or CRC. Verify the data of each packet with a data summation.
    A CRC is more reliable than a checksum, and the checksum is easier to calculate.
    If the peer discovers that data is corrupted, it asks your program to resend the
    message.


    +   - Use timeouts. You can assume that an expired timeout means failure. Your
    originator could retransmit the message, and your receiver could send a reminder
    to the sender.


    The Critical and Important data types require the reliability found in TCP or
    better. Fault-Intolerant requires much more than any of these protocols offer.
    These outlined steps mimic the reliability of TCP.


    UDP relies on IP''s features and services. Each UDP datagram packet receives an
    IP and a UDP header. Listing 3.3 defines how the UDP structure appears.


    # Example 3.3. UDP Structure Definition


    ```

    /****...*****/

    /** UDP (datagram) structure definition ***/

    /** (Format definition in netinet/udp.h) ***/

    /****...*****/

    typedef unsigned char ui8;

    typedef unsigned short int ui16;

    struct UDP_header {

    ui16 src_port; /* Originator''s port number */

    ui16 dst_port; /* Destination''s port number */

    ui16 length; /* Message length */

    ui16 checksum; /* Message checksum */

    uchar data[]; /* Data message */

    };

    ```


    # Figure 3.4. UDP layout.


    ![](img/03334662da8fdfb8d95a02f270c522f6_51_0.png)'
