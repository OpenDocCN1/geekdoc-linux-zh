  md: '+   - MSG_DONTROUTE Don''t allow routing the packet. This causes the packet
    to bypass the routing tables, forcing the network to try to contact the receiver
    directly. If the destination is inaccessible directly, the call yields an `ENETUNREACH`
    (network unreachable) error. Only diagnostic or routing programs use this option.

    - MSG_DONTWAIT Don''t wait for `send()` to finish. This option allows the program
    to proceed as if the `send()` were done (or delegated). If used, the operating
    system issues a `SIGIO` signal, indicating a completed `write()` operation. If
    the operation blocks because the `send()` queue is full, the call returns an error
    and sets `errno` to `EAGAIN`.

    - MSG_NOSIGNAL Don''t issue a `SIGPIPE` signal. If the other end closes early,
    and if your program sends another message, your may get a `SIGPIPE` signal. If
    you are not prepared for this signal, your program aborts.


