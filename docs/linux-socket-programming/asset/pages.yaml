- pgno: 176
  md: "Because `wait()` can block your program (blocking in a signal handler is not\
    \ a good idea), use the `waitpid()` system call:\n\n```\n```c\n#include <sys/types.h>\n\
    #include <sys/wait.h>\nint waitpid(int pid, int *status, int options);\n```\n\
    ```\n\nThe `pid` parameter can be several values; if you use `-1`, this call acts\
    \ like the regular `wait()` system call. The `status` parameter is like that of\
    \ `wait()`. To keep the call from blocking, set `options` to `WNOHANG`. If you\
    \ have exhausted all the outstanding zombies, the call returns a zero. The following\
    \ is an example of its use in a signal handler:\n\n```\n```c\n/****...*/\n/**\
    \ Improved zombie killer example      ***/\n/****...*/\nvoid sig_child(int signum)\n\
    {\n    while ( waitpid(-1, 0, WNOHANG) > 0 );\n}\n```\n```\n\nAgain, this instance\
    \ is really the only time that you should use a loop in a signal handler. Spending\
    \ too much time in a signal handler can lose pending signals. The reason why this\
    \ example works with a loop is due to the way `waitpid()` works. You don't need\
    \ a signal to pick up terminated child processes.\n\nFor example, you enter this\
    \ routine because a child terminated. While your program processes the signal,\
    \ another process terminates. Because you are in the signal handler for `SIGCHLD`,\
    \ you lose that signal. However, the next iteration of `waitpid()` picks up the\
    \ child's context. One call clears out all outstanding terminations—not just one.\n\
    \n# ### SIGHUP\n\nWhat happens to the child process when the parent terminates?\
    \ The child gets a `SIGHUP` signal. Your program may get this signal if the user\
    \ logs out. By default, the process that gets this message terminates. In most\
    \ cases, you may want to leave this behavior alone, because you might not want\
    \ the programs lingering after the controlling programs terminate.\n\nMost servers\
    \ run better in the background as daemons without a specific login. In fact, some\
    \ daemons fire off a child process that assumes the whole responsibility of the\
    \ program. When the child is ready, the parent terminates. This is similar to\
    \ using the `nohup` command, and it has the added benefit of not appearing on\
    \ the admin's job listing.\n\nAlso, one standard way of restarting a daemon is\
    \ to send it a hang up signal. Usually this terminates the currently running process,\
    \ and `init` starts a new instance. If you cannot depend on `init` to keep your\
    \ server up and running, you can force a restart by `exec()`ing a new instance\
    \ (see restart-example.c on the Web site). Before doing this, you must manually\
    \ terminate all current processes under the older parent. (You may have to use\
    \ this restarting technique on all signals that can terminate your server.)"
  merge: -1
  img_proc: true
- pgno: 177
  md: '**SIGIO**


    You can get a performance boost to your network program by offloading the I/O
    notification to the kernel. When implemented correctly, your program gets the
    SIGIO signal whenever the I/O buffers no longer block a read or write operation.
    For writing, this occurs when the I/O subsystem can accept at least one byte (see
    the write low water mark, `SO_SNDLOWAT`, socket option). For reading, this occurs
    when the I/O subsystem *has* received at least one byte (see the read low water
    mark, `SO_RCVLOWAT`, socket option). See Chapter 8, "Choosing when to Wait for
    I/O", for how to implement this signal, and see Chapter 9 for performance benefits.


    **SIGALRM**


    Like the SIGIO signal, you only get the SIGALRM signal if your program asked for
    it. This signal is typically the result of calling `alarm()` system call, a time-delayed
    wakeup call. Daemons often use this signal as a watchdog to ensure that the program
    is still alive or to check the solidarity of the connection. See Chapter 9 for
    using this as a connection heartbeat checker.


    # Resource Management


    Signals are one small part of a program''s resources. If you track and capture
    specific signals, you can reduce system corruption and may be able to increase
    performance. The *whole* program has much more than just signals. It includes
    files, heap, static/data memory, and CPU time. You have additional resources,
    such as child processes and shared memory. What makes a reliable server (or even
    client) is being careful with your resources.


    # File Management


    Your program automatically gets three standard files when it starts up: `stdin`,
    `stdout`, and `stderr`. You should be familiar with these and the fact that the
    user can redirect any one of them. This is typically not a problem because the
    kernel flushes and closes these for you upon program termination.


    New files and sockets are a different matter. You must remember to track and close
    each file. Even though the kernel closes all files for you upon program termination
    (such as the standard I/O files), all files require a portion of the kernel''s
    and program''s memories. All files that the program loses track of chew up more
    and more resources.


    Even if you are working with one file, it is good programming practice to force
    a close some where in the program. Someday, in the course of revision, you may
    open more files.


    # Memory Heap


    The memory heap (or dynamic memory allocation) is similar to opening and closing
    files where you must track each chunk of memory you carve out. But, the heap tends
    to be a really loose end for many programmers. Memory leaks are common and very
    hard to track. There are libraries to help you track these chunks (like ElectricFence),
    but some good practices can help you avoid the more common errors.


    The first and perhaps the most common programming error is forgetting to check
    the return value of `malloc()` or `calloc()` (in C++ you need to capture any exceptions).
    If the size of memory you requested is not available, the call returns a NULL
    (zero) to your program. Depending on how much you need that space, you may design
    your program to terminate, clean up and retry, notify the user,'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'and so on. Some programmers like to use `assert()` for every memory allocation.
    Unfortunately, that *always* aborts your program if it fails.


    Be consistent with the allocation calls. If you use `calloc()`, use it for all
    memory allocations. Don''t mix calls. In particular, the `C++ new` operator sometimes
    does not interface well with `malloc()` and `calloc()`. When you call `delete`
    on a `malloc()`''ed block of memory, you can see some unpredictable results.


    Furthermore, when you release a block of memory, assign a `NULL` to the pointer
    variable. This is a quick way to find out if you have a *dirty reference* (using
    a pointer after its memory is freed).


    When you allocate some memory, you can either get exactly what you need, or you
    can get what you expect you may need. These are two different approaches to the
    same problem. The first approach (*precise allocation*) carves out precisely the
    space that the variable needs when it needs it. The program that uses the other
    approach (*generous allocation*) typically requests a large chunk of memory and
    then uses the chunk for processing.


    *Table 10.1* summarizes the benefits of each programming style. Unlike mixing
    allocation calls, you can mix precise and generous allocation, but be sure to
    document your usage.


    # Table 10.1, Allocation Comparison


    | Precise Allocation | Generous Allocation |

    | :--- | :--- |

    | Gets exactly what you need. | Gets a large chunk that can be portioned out later.
    |

    | Does not waste allocated memory. | Almost always wastes a portion of the memory
    allocated. |

    | Requires several allocation and release calls. | Requires one allocation and
    one release. |

    | More likely to fragment program memory. | Less likely to fragment memory. |

    | Effective in module- or program-wide memory usage. | Very useful in a single
    procedure-call where it uses a chunk of memory then releases it. |

    | May waste allocation space because each allocated block requires an allocation
    descriptor. (This is how the allocation subsystem tracks memory use.) | Only generates
    one allocation header for the entire block. |

    | Portable to other systems. | This is also portable, but it takes advantage of
    Linux’s latent allocation. (Only the 1KB pages that are used are actually linked
    to real memory.) |


    # NOTE


    **malloc() Giving Segmentation Faults**


    If you get a segmentation fault in the `malloc()` system call, your program has
    corrupted the allocation block of some allocated memory. This fault typically
    occurs because of a misbehaving string operation or an out-of-bounds array. Test
    array index and limit string lengths to avoid this problem.


    Your program can have several modules that use allocations in different ways.
    If you are interfacing with other programmers, be sure to establish who owns what.
    For example, if you pass a pointer to some memory to a routine, does the routine
    now own the pointer? Or, should it make a copy?


    One typical approach is to leave the ownership to the routine/module that created
    it. This means that if you pass the reference to another module that needs its
    version, you must provide a way to clone the block. Some object-programmers call
    this a *deep copy* because all the references inside the block have to be copied
    as well.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # Static Data Memory


    Of the different types of resources, you may have the least problems with the
    static data memory. This memory includes both initialized and uninitialized data
    variables and stack variables. The following example shows the different types
    of data memory:


    ```

    ```

    int counter;                         /* Uninitialized data */

    char *words[] = { "the","that", "a",0} ; /* initialized data */

    void fn(int arg1, char *arg2)        /* parameters (stack) */

    {   int i, index;                    /* "auto" variables (stack) */

    ```

    ```


    The best way to avoid problems with this resource is to ensure that the program
    initializes everything before using it. You can use the -Wall C compiler option
    to show all warnings.


    # ## CPU, Shared Memory, and Processes


    The last three resources, CPU, shared memory, and processes, require only a few
    notes. See Chapters 7, 8, and 9 for more information.


    +   - Shared memory—Similar to file management. You open, lock, and close access
    to the shared regions of memory.

    - CPU—Your programs can easily dominate the computer''s scheduling time. Be sure
    to release some time by blocking at the right time.

    - Processes—If you use multitasking, the system tells you the status of each child
    process. You need to accept and act on the notifications so that you don''t fill
    the process table with zombies.


    # ## Critical Servers


    Knowing the external and internal events (signals, for example) helps you know
    how to work from a system-level view. As you program your clients and servers,
    you need to determine what has to happen when. This determines the behavior your
    program must have in each circumstance. The primary difficulty in predicting behavior
    is that each computer can have a different configuration—even though the distribution
    installation may be the same. (It''s an established fact that every system administrator
    has to tweak his worksta tion.)


    The variability on a single computer is by itself daunting, but when you bring
    in network programming, you almost have to declare that all bets are off. However,
    you do have some control. If you have a complete understanding of what the program
    is supposed to do and what it interfaces with, you can rule out the other variables.
    You may want to define for the user that the external dependencies must behave
    correctly with their own dependencies.


    For example, suppose you have a server that is to run as a daemon. If your server
    needs access to certain files on the destination system, you may want to stipulate
    that those files must reside in a particular directory and must retain a specified
    format. This helps the sysadmin to know that if anything goes wrong, he can look
    at the files to verify them.


    Servers, in particular, are different in expectation and performance. Users expect
    your server to be available when they contact it. They also expect it to reply
    within a reasonable period of time. To keep users satisfied, you need to know
    the specifics of what "reasonable" means. Furthermore, you'
  merge: -1
