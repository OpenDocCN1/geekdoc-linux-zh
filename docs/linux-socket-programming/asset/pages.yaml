  md: 'Multicasting solves many of broadcast''s limitations and has greater extensibility.
    Even though routers may need to send different copies of the same message, it
    is a better method for sharing messages on the LAN and WAN. Listening to multicast
    messages is voluntary, unlike broadcasting.


    Multicasting is a growing technology with more and more multicast routers in place
