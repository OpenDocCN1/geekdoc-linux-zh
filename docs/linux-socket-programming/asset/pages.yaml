    # ## Network Starvation


    The other networking problem you can face is starvation. Network starvation, like
    network deadlock, is a flaw in the communication with the client. Suppose you
    have a server that has ten connections in a select(), and the server only has
    enough timeslice to answer five. It is possible that one connection never gets
    serviced.


    You encounter this problem often when connecting very busy sites on the Internet.
    The only symptom you see is similar to that of a deadlock; you connect and then
    hear nothing for a long time. This is different from just connecting and waiting
    with no data transferred, which the TCP protocol causes when it establishes and
    enqueues the connection request. Instead, you see a few bytes sent to your client
    and then—silence.


    The solution to this problem is not as direct as the deadlock solution. Like trying
    to tell a micromanager that he needs to delegate some tasks, a server that accepts
    more connections than it can really support appears productive. Instead, it just
    starves one connection after another.


    The first step is to make sure that you have a good balance of processor/system
    performance to the number of active connections. When you set the listening queue
    depth, remember that pending connections are okay—as long as you serve them before
    they time out. You need to gauge how long each session is and adjust the queue
    depth accordingly.


    You can take another approach to keep connections from starving. This is similar
    to the way processes get CPU time through scheduling. The concept you might try
    is dynamic scheduling or priorities. When you have, say, three processes that
    have equal CPU usage, only one can run at a time. So the scheduler increases the
    effective priority of the ones it passes over. This ensures fair distribution
    of CPU.


    In like manner, you can use something like a priority scheme on each of your connections.
    This is advantageous because you can use the priorities in different ways. Those
    connections that have data ready get higher priority than others.


