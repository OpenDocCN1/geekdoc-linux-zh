  img_proc: true
- pgno: 78
  md: 'Interruptions in the conductor cause signal loss and packet degradation. Because
    of the physics involved, if you disconnect a coax cable from an active network,
    any active electrical signal reflects off the open connection as if it were a
    mirror. Any transmission ends up being completely garbled.


    Directed transmissions like laser, microwave, or infrared also can suffer interruptions.
    An obstacle placed between the transmitter and receiver can completely block the
    signal. Other issues like smoke, smog, and birds cause problems as well.


    Hosts connect to a common network medium, sharing time and resources, so hardware
    identification suddenly can be an issue. Each packet needs a destination on a
    shared network. If the network connection is just two computers (a point-to-point
    network), the packet does not need a destination. The destination would be implied.
    However, the shared network needs a hardware address so that the network interface
    can select its messages from the myriad that zip by.


    Ethernet LAN cards provide their own ID: the MAC, a six-byte ethernet address.
    When your computer sends a message, the networking subsystem divides the message
    into several frames, the smallest transmitted container. On an ethernet, each
    frame includes the source and destination MAC. Eventually the network associates
    the logical IP address with an actual physical (MAC) address. With the physical
    address, the LAN card listens for its address. When a matching address arrives,
    it opens its buffers and lets the message flow in.


    # # Networking Transmission Issues


    The hardware issues focus on the technology of the physical communication channel.
    The next networking issue is moving the packet around the network. The packet
    faces many hazards that can corrupt or lose it entirely. Often the sender and
    receiver get little-to-no notification of a packet failure. Sometimes the receiver
    times out because it has not received a message from the sender when, in reality,
    the route between them may be severed.


    Troubles regarding packets at the networking level typically involve problems
    with routing. Because the network changes while messages move from one place to
    another, knowing ahead of time what the symptoms are can help you identify the
    problem and effect a solution.


    Changes in network topology (*or* propagation *dynamics*) is a concern with even
    the most controlled network configurations. While it causes vary, it results in
    lost transmissions. One type of propagation dynamic is the network itself losing
    messages in transit. You may have experienced or heard about those networks in
    cubicles where someone moves his feet and shuts down someone else''s cluster.
    Networks between computers change; connections between computers appear and disappear.


    Another cause of propagation dynamics is excessive packet aging. As the packet
    propagates through a path, each node that forwards the packet tracks how old it
    is using a time-to-live (TTL) field. A packet expires when it exceeds the number
    of router hops it''s allotted. Each packet can get up to 255 hops; by default
    the value is 64 hops. Usually that is enough for your message to get where it''s
    destined to go.


    The limit on the number of hops is important to keep the network from becoming
    overcrowded with long-dead packets. It''s easy for a packet that shows no tracking
    to cycle around endlessly. For example, suppose router A gets a message. A''s
    routing tables indicate that the best path is through B, so it sends the packet
    to B. Router B, however, lost its link, so it may send the packet back to A. Router
    A has no record of receiving the packet, so the packet bounces back and forth
    (until the TTL'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'field expires or routers A and B synchronize their tables). The TTL field limits
    how long a packet goes around in a cycle.


    Routing lists and host tables can become very large. Careful table management
    can help you avoid lengthy delays in calculating the best path to the destination.


    While the complexity of the network is challenging, it is likewise complex to
    detect path loss, recovery, and cycles. Often, when a network segment disappears,
    cycles (or network loops) form that cause packets to age and die quickly. The
    network rarely notifies your sending and receiving hosts of the problem; the packets
    simply expire.


    Sometimes pathway ambiguity can cause a packet in a message to be copied during
    transit (packet-mirroring or ghosting). This strange occurrence is undetectable
    unless each packet holds an ID or sequence number. Not only can the network duplicate
    information needlessly, but the network can also lose data through disappearing
    routers during a transmission or even packet corruption so that an error message
    never arrives back to the sender.


    Packet loss happens all the time. Without accounting and acknowledgements, the
    originator may never determine whether the destination got the message.


    Lastly, the segments may have router-data incompatibilities. Some routers or networks
    cannot support full 8-bit bytes or large packet sizes. The routers must convert
    the packets or return an error.


    Fortunately, the networking issues arise only when you use lower-level protocols.
    If you don''t have the time or want to face these challenges and are satisfied
    with the slower throughputs, use the tested and proven high-level protocols. Most
    network applications use them. Once you have tested your algorithm with a high-level
    protocol, consider tuning your program for more performance with lower-level protocols.
    Then, when the dust of the project-building frenzy clears, hone and tune your
    algorithm to squeeze out more performance.


    # Network to Operating System Interfacing


    The network must be able to interface with the operating system for several reasons.
    To get its job done, the operating system handles the resources that the network
    subsystem needs, such as interrupts, ports, and memory. Also, while the networking
    subsystem manages the details of the network, it has to reside in the kernel for
    best performance.


    The network-kernel interface is complex—especially if the kernel is not reentrant.
    Fortunately, the Linux kernel is now over the reentrancy hurdle and can handle
    the associated issues.


    When a message arrives, the hardware sends an interrupt to the CPU to pick off
    the message. If the kernel (where the interrupt handler resides) is slightly late,
    another message may overrun the first message. This is especially true when the
    network card is put into *promiscuous mode* (accepting any and every message it
    hears). Chapter 3, "Different Types of Internet Packets," first introduced the
    promiscuous mode.


    Except for simulated networks like PPP, CPUs rarely work with the hardware networking
    interfaces directly. The CPU uses a coprocessor on the network interface card.
    The CPU loads the data into the network interface and instructs it to transmit.
    When done, the card raises an interrupt to the CPU. This instructs the kernel
    that the network card is again ready to accept another message. PPP on the other
    hand requires a lot more CPU interaction, but because the interface is much slower,
    it''s not as much of a burden as it could be.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'A message queue holds the outgoing and incoming messages. When the kernel gets
    a notification that the card is ready for another frame, it takes the message
    directly from the message queue. If your program sends a message when the interface
    is not ready, the kernel places the request or message on the queue for later
    processing. The network is a limited resource; no two programs can access it at
    the same time. As a result, the operating system has to queue and process the
    requests one at a time.


    Also, the kernel has to prepare each message for transmission, or it has to disassemble
    the incoming message for the receiver. The buffering subsystem tracks the constructed
    frames and readies them for the network or the client process (such as disk I/O).


    Part of the process of packaging the message is assigning identification. Hardware
    identification (like the MAC) is clumsy and difficult to manage on a large network.
    So the network subsystem provides a logical identification (for example, the IP
    number).


    Each packet needs the identification so that the operating system can quickly
    determine where to send it. IP numbering provides the network operating system
    a way of grouping computers together into subnetworks.


    # ## Network to Program Interfacing


    A main area of concern is how to interface the network to your program. Because
    network programming has so many angles and caveats, consider the specifics of
    each situation separately and then determine how they interrelate. This section
    discusses some of those issues.


    The first issue is receiving and dealing with errors and exceptions. The operating
    system and your program must be able to receive and handle network errors or exceptions.
    Some errors and exceptions are asynchronous to the running program. C and Java
    can intercept them, but some languages cannot (for example, Pascal). So, as you
    consider how to write your application, keep in mind that not all languages lend
    themselves well to the demands of network programming.


    The second issue is data and packet reliability. Some programs expect high data
    reliability; others don''t. Analyze what kind of data you have and how reliable
    it needs to be. In [Chapter 2, "TCP/IP Network Language Fluency"] you can find
    a list of data types and their criticality. Use this list to help you choose the
    right protocol.


    The third issue is synchronization and concurrency. Your network program interfaces
    with another concurrently running program. You must coordinate the programs to
    avoid deadlock and starvation problems (discussed in detail in the section ["Client-Server
    Concurrency Issues"] in [Chapter 10, "Designing Robust Linux Sockets"]).


    Lastly, consider examining real versus virtual connections. The network offers
    your program a simpler form of interfacing by making it look like your program
    owns the network connection. These virtual connections (ports) deliver only those
    messages that the connection is supposed to see.


    While the program-interfacing issues are complex, they make programming the network
    challenging and fun. This list is not comprehensive. However, the Socket API hides
    a lot of network programming challenges from your program.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'layers can depend on the solutions of lower layers. Like peeling an onion,
    the heart of networking is the physical transmission medium (electricity, radio,
    or light).


    Two models covered in this section, OSI and IP, are similar to many other network
    models. With this information, you may see why they choose their course of action.


    # **Open Systems Interconnection (OSI) Network Model**


    The most prominently recognized network model—OSI—uses the layering approach and
    has seven layers. Each layer of the model abstracts the interface between the
    hardware and the program. This model even extends the interface into the user
    space.


    The programs and applications on your workstation provide you with tools necessary
    to get your job done. The user space defines your customer''s working area. Focus
    your attention on this area, because good design makes user interactions with
    your program seamless and intuitive.


    The OSI network model provides a common interface so that once a user understands
    the procedures, he can use the same methods on other OSI implementations. The
    OSI model intentionally hides and abstracts away the implementation details of
    specific hardware. This gives the user the same feel regardless of the platform.


    The OSI model''s interface tries to answer each of the other specific challenges
    of network programming. At the same time, however, it provides interfaces (or
    *hooks*) into the lower levels so that power programmers can still play. The model
    has seven layers, beginning with the hard ware layer, as shown in Figure 5.1.
    Each layer from bottom to top abstracts the network implementation from the user
    and your program.


    ![](img/03334662da8fdfb8d95a02f270c522f6_81_0.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# OSI Model


    ![](img/03334662da8fdfb8d95a02f270c522f6_82_0.png)


    # Layer 1: Physical


    The Physical layer encompasses all the hardware-related interfaces: the medium
    and signal. The medium (for example: twisted pair, coax, fiber) carries the signal
    to its destination.


    Part of the Physical layer is the network adapter. The network adapter acts as
    the go-between for the kernel and the physical medium. On one end, it accepts
    transmit requests from the kernel drivers and transmits message packets (*frames*).
    When finished, it notifies the kernel with an interrupt.


    The adapter''s microcontroller listens for a quiescent network before it tries
    to send a frame. It detects and handles collisions and retransmissions. If necessary,
    it notifies the kernel of transmission problems. The kernel''s drivers then manage
    their own retries or pass the errors up the protocol stack.


    On the other end, the adapter listens to the network for messages that match its
    hardware (ethernet) address. When matched, the adapter fills an internal buffer
    and issues an interrupt to the kernel. To do this, the hardware layer provides
    its own hardware identification.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Data frame repeaters accept all network messages and pass them on to a new
    segment of the network. Data repeaters are dumb in that they do not select from
    packet to packet and ignore the hardware identifications. A data repeater has
    less programming intelligence than a typical repeater, which selectively permits
    packets between segments and resides in the Physical layer. Use a data repeater
    to extend the network length and amplify the attenuated signal.


    Lastly, some ethernet adapters now include a checksum or CRC of their own to perform
    data validation checks. If CRC finds an error, the card flags the data as suspect
    for the Datalink layer to fix. This may give you a little more confidence in the
    datagram protocols.


    Other physical networks may have other mechanisms. For example, the PPP connection
    may include a parity (most don''t). FDDI has checksumming or CRCs. Some obscure
    radio protocols simply send each character twice.


    # Layer 2: Datalink


    The Datalink layer rests on the Physical layer. The primary role of the Datalink
    layer is to provide data transfer from host to host. It packages messages into
    frames for the hardware. It checks for and tries to correct transmission errors.
    If the hardware does not support checksums or CRCs, the Datalink layer does the
    calculations itself.


    The Datalink layer interfaces the kernel to the network hardware. Typically, the
    Datalink layer is a network driver that resides in the kernel. The driver uses
    a uniform interface so that the kernel can work blindly with vastly different
    technologies.


    This layer prepares the data frames for transmission and disassembles received
    messages. The driver waits for interrupts that indicate a message was sent or
    a message was received. When it gets a message-sent notification, the Datalink
    driver loads the next frame to send.


    The Datalink works closely with the buffering subsystem of the kernel. Most of
    the time, it only needs 10–60KB of system RAM. Linux’s kernel configuration lets
    you define the size of the buffering and frame beyond 1MB for very fast transfers
    (100MB/s or higher), if you have enough memory. This is useful for very high-speed
    connections that may receive large frames or high throughput. To use this feature,
    you may have to recompile the kernel, because many Linux distributions do not
    enable it.


    Network bridges reside in the Datalink layer. The Linux kernel’s bridge option
    is still experimental at the time of this writing. If you want to experiment with
    it, you may have to reconfigure and compile the kernel to include the drivers.


    The Network layer rests on top of the Datalink layer and provides address resolution
    and routing.


    # Layer 3: Network


    The Network layer rests on top of the Datalink layer. Its primary function is
    to work with the routing tables, routers, and gateways to find the destination
    host. In a non-routed network, this layer is essentially inactive.


    The Network layer provides a uniform addressing mechanism for heterogeneous networks.
    If, for example, you have two physical networks such as AppleTalk and Ethernet,
    this layer bridges them using a frame translation.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Network routers reside in this layer, providing a connection between homogeneous
    and heterogeneous physical networks.


    # Layer 4: Transport


    The Transport layer rests on top of the Network layer, relying on the data integrity
    and routing of the Datalink and Network layers. Its primary responsibility is
    to deliver a message intact, in order, and without duplication. This layer adds
    many functions to provide streaming and communication integrity.


    The Transport layer is the last place that the model can address any data or communication
    errors. (*Data errors* here refers only to the integrity of the data, not the
    meaning. For example, this layer does not catch a malformed HTTP request, but
    it does catch checksum errors.) If the layer detects packet loss or corruption,
    it requests a retransmission from the sender. To do this checking, it adds more
    checksums to the packet.


    This layer introduces the concept of a *virtual network* or *multiplexing*. With
    this feature, each connection has the perception of having an exclusive connection
    to the network (like the TCP/IP port concept). Your program gets all the messages
    other programs sent to it, despite the fact that your host may have several network
    programs running.


    Because of the reliability, the Transport layer is the layer most commonly used
    by applications that communicate with one another over the Internet. It provides
    all the features needed to hold networking sessions.


    # Layer 5: Session


    The Session layer heavily depends on the Transport layer to provide the streaming
    and reliability it needs. Its primary responsibility is to provide controls over
    the connection and data flow.


    The connection may be unstable, so this layer provides *checkpointing*. For example,
    suppose the connection is transferring a file and the connection drops. All the
    time spent getting the first part of the file is lost if at reconnect the file
    has to start over. Checkpointing locks down parts of the transfer so that the
    new connection has to receive only the missing parts.


    As implied earlier, the Session layer automatically reestablishes dropped connections.
    It also provides security and login procedures.


    It also provides data flow management. One of the problems with client/server
    connections is controlling who talks first and how to hold a dialog. One method
    this layer uses is passing a token: The host that has the token can do critical
    operations. This flow control lessens the likelihood of deadlock, starvation,
    or data corruption (discussed in detail in the section, "[Client-Server Concurrency
    Issues](Client-Server%20Concurrency%20Issues)" in [Chapter 10](Chapter%2010)).


    # Layer 6: Presentation


    The Presentation layer manages the data and does needed conversion (for example:
    decompression, formatting, layout, image display, character set conversions).
    Remote Procedure Calls (see [Chapter 15](Chapter%2015), "Network Encapsulation
    with [Remote Procedure Calls (RPCs)](Remote%20Procedure%20Calls%20(RPCs))") are
    a practical example of this layer.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Layer 7: Application


    The last layer, the Application layer, provides network services such as file
    transfer, terminal emulation, messaging, and network management. Essentially,
    most applications use this layer, since it provides the Application Programming
    Interface (API). However, it is not the actual user application; it is the set
    of library calls and services to help the applications work with the network.
    Network File System (NFS) is an example of this layer that hooks into the operating
    system''s virtual file system architecture. It builds on top of the RPC tools
    to provide the function interfaces.


    # Internet Protocol Suite


    Linux (like most other UNIX operating systems) does not use the OSI network model
    directly. However, the model is a starting point to understanding the IP Stack.
    Linux uses the Internet Protocol suite to manage its native network interface.


    # NOTE


    The IP protocol sprang from the ARPAnet (Advanced Research Projects Agency Network)
    funded by DARPA (Defense Advanced Research Projects Agency) in 1972. BBN Corporation
    implemented the first vestiges of the network. Later, UNIX, a free operating system
    offered by Bell Labs, adopted the model as well. The universities involved used
    UNIX to test out a concept of linking several computers together throughout the
    United States. The Sockets API originated with BSD 4.2 in 1983.


    The Internet Protocol suite has four layers that map closely to the OSI model.
    The highest layer is called the Application layer. The IP suite''s Application
    layer encompasses OSI''s layers 5–7 (see Figure 5.2). Refer to Figure 5.1 for
    a comparison.


    > Figure 5.2. The DoD or Internet Protocol Stack compares closely to the OSI model.
    The Socket API stops at OSI''s Transport (4) layer. The protocol leaves the remaining
    layers to high-level programs like Telnet, FTP, and Lynx.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/03334662da8fdfb8d95a02f270c522f6_86_0.png)


    # **Layer 1: Network Access Layer**


    IP''s first network layer most closely matches OSI''s Physical and Datalink layers.
    Because the hardware and drivers are so closely tied together and the hardware
    support varies so widely, you cannot isolate one from the other.


    The characteristics are similar: The driver works closely with the hardware interfaces
    to provide a common set of functionality to the kernel. The kernel, in exchange,
    gives the driver direct access to the ports and interrupts. If an interface is
    lacking in any features that the kernel needs, the drivers take up the slack.


    Linux adds another feature that complicates this layer: hot swapping network adapters.
    This is found in PCMCIA support. When you insert a PC card, the PC card manager
    recognizes it, allocates the appropriate ports and interrupts, inserts the defined
    kernel modules, and configures your network. Likewise, when you remove the card,
    the manager disables the network and removes the kernel module.


    # **Layer 2: Internetwork Layer (IP)**


    The IP layers (both IPv4 and IPv6) depend on the device drivers to provide a common
    interface and functionality. Both versions are different in this layer. They compose
    different protocol stacks that translate to and from IPv4 and IPv6, as needed,
    to ensure compatibility.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The IP layer best aligns with the OSI Network layer. It provides the logical
    addressing and routing functions of that layer. The one part that the IP layer
    lacks is the error messaging of the Network layer.


    # Layer 2: Control/Error Messaging Extensions (ICMP)


    ICMP (Internet Control Message Protocol) adds the missing error messaging of the
    OSI Network layer. ICMP provides the message protocols for errors and exceptions
    in the routing and forwarding of messages. Typical exceptions include `network
    not reachable` and `host not found`.


    This protocol works with other systems to perform various functions. For example,
    it works with the routing tables (ARP) when hosts become unreachable. Additionally,
    it works with TCP to speed up or slow down the communication and change the sliding
    window. IPv6 has even added control for multicast group management.


    What''s interesting about ICMP is that it stands alone. Neither UDP nor TCP uses
    its layer. They do accept its messages for their own processing.


    # Layer 3: Host to Host (UDP)


    Contrary to popular opinion, UDP (User Datagram Protocol) does *not* match perfectly
    with the OSI Transport layer (see *Figure 5.3*). The Transport layer guarantees
    delivery, in-order packets, error-free packets, and stream-like functions. UDP
    does not; see *Table 5.2*.


    ![](img/03334662da8fdfb8d95a02f270c522f6_87_0.png)


    ![](img/03334662da8fdfb8d95a02f270c522f6_87_1.png)


    **Table 5.2**, Transport Layer Versus UDP

    | *Transport Layer* | *UDP* |

    |---|---|

    | Reliable data | Reliable data (checksums) |

    | Reliable delivery | No guaranteed delivery |'
  merge: -1
  img_proc: true
- pgno: 88
  md: '| Negotiated window size | Fixed window (determined by program) |

    | Record oriented | Packet oriented |

    | Built on Networking layer | Built on IP |


    UDP adds one primary feature of the Transport layer: virtual networks with ports.
    As described in Chapter 4, "Sending Messages Between Peers," this particular feature
    abstracts the network and lets your network program act like it solely owns the
    connection. All other features are like the IP layer. If properly positioned,
    UDP straddles the Network and Transport layers, leaning more on the Network side.


    # Layer 3: Host Streams (TCP)


    The TCP layer matches the OSI Transport layer very well. Both provide the reliability,
    streaming, ordering, and error management needed for building sessions. It is
    important to emphasize that TCP does not rest on UDP. It has its own header and
    own path in the network subsystem. For a side-by-side comparison, see Table 5.3.


    | **Table 5.3, Transport Layer Versus TCP** |  |

    | **Transport Layer** | **UDP** |

    | Reliable data | Reliable data (checksums) |

    | Reliable delivery | Guaranteed delivery |

    | Negotiated window size | Sliding window |

    | Record oriented | Stream oriented |

    | Built on Network layer | Built on IP |


    # Layer 4: Application Layer


    This is where the TCP/IP model stops. According to the model, the Application
    layer comprises OSI''s Session (5), Presentation (6), and Application (7) layers.
    The TCP/IP model has a few applications that fill these roles. Some examples of
    this layer are Web browsers, gateways, Telnet, and FTP (File Transfer Protocol).
    Remote Procedure Calls (RPCs) best align with the Presentation layer. Network
    File System (NFS) depends on RPCs and appears to fit the Application layer. Still,
    these applications blur the boundaries so that assigning them to any particular
    layer is difficult.


    The Application layer rests on top of the Host Streams layer (UDP and TCP). However,
    it may accept messages directly from ICMP.


    # Fundamental Differences Between OSI and IP


    Both the OSI and IP models use layering to define the roles of each protocol stack.
    They also move from the hardware-dependent code to the abstract application. But
    you may have noticed some differences.


    OSI layers the data as well as the protocol. Referring back to Figure 5.1, each
    layer of the stack has its own header information. As the data moves down the
    stack toward the Physical layer, each layer encapsulates the message inside its
    own packet.


    For example, if you send a Session layer message, the Physical layer sees a list
    of headers in reverse order: datalink, network, transport, and session. The message
    itself follows all these headers at the end of the data. Each layer uses this
    process, including the Physical layer. Eventually, you may have up to seven headers
    on a single packet.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The receiver reverses the process. It uses the encapsulated data to determine
    whether to pass your message up to the next layer. In the previous example, your
    message arrives at the Physical layer. Each layer peels off its header. If it
    sees another header, it passes the message up to the next layer. Eventually, the
    message stops at the Session layer.


    The IP model operates differently. Attaching a header for every layer can make
    your message header heavy, reducing throughput. Instead, the IP model places the
    protocol type in the IP header. When IP gets the message, it checks that field
    and routes the message directly to the protocol you chose, after removing its
    own header.


    Also, as indicated at the end of [Chapter 3](#), each of IP''s protocols fills
    a specific role. Unlike the OSI model, where each layer rests squarely on the
    back of the lower layers, all protocols rest on IP raw protocol.


    Again, the IP model uses a protocol to address a particular need. ICMP is for
    error messaging, UDP is for directed messages and connectionless communications,
    and TCP is for streaming. The raw IP is for developing new protocols.


    # What Services What?


    The next step is how to use the DoD Network model. If you want to access the all
    the different layers of the IP Stack, use the `socket()` system call.


    Table 5.4. DoD Layer Summary


    | **DoD Layer** | **Programmer/User Access** |

    |---|---|

    | 4-Application | FTP, Gopher, Lynx, Netscape, IRC |

    | 3-Host to Host (TCP) | `socket (PF_INET, SOCK_STREAM, 0);` |

    | 3-Host to Host (UDP) | `socket (PF_INET, SOCK_DGRAM, 0);` |

    | 2-Internetwork (ICMP) | `socket (PF_INET, SOCK_RAW, IPPROTO_ICMP);` |

    | 2-Internetwork (IP) | `socket (PF_INET, SOCK_RAW, protocol);` |

    | 1-Network Access | `socket (PF_INET, SOCK_PACKET, filter);` |


    This interface may differ from your expectations. Linux allows read access to
    the low-level driver messages using `SOCK_PACKET`. This Linux-specific feature
    gives you access to any and all messages on the network. You used this feature
    to build your own network snooper in [Chapter 3](#).


    # Summary: From Theory to Application


    This chapter examines the interface between the different network elements that
    need to work in harmony. The network challenge includes computer hardware interfacing,
    network connection issues, operating system linking, and application interfacing.
    Each has specific problems that get in the way of giving your program access to
    other computers. Networking addresses these problems using carefully designed
    models to help you program in a consistent way.


    Two networking models, OSI and IP (or DoD), separate the solutions into layers.
    The layers rest on top of each other like layers of a cake. The support that the
    lower layers provide increases the data reliability and interfacing of higher
    layers. The layers also offer you a wide selection of speed versus reliability.


    The first layer addresses the physical interfacing between computers. In succession,
    each layer strengthens message reliability, arrival, and flow. When you use interfaces
    from the middle layers of the protocol stack, you can expect that the data will
    arrive correctly.'
