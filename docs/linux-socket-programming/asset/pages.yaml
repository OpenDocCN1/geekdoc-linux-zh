    {\n    struct sigaction act;\n    bzero(&act, sizeof(act));\n    act.sa_handler\
    \ = sig_handler;\n    sigaction(SIGURG, &act, 0);\n    sigaction(SIGALRM, &act,\
    \ 0);\n    /** set up connection to server to serverfd ***/\n    /---claim SIGIO/SIGURG\
    \ signals---*/\n    if ( fcntl(serverfd, F_SETOWN, getpid()) != 0 )\n        perror(\"\
    Can't claim SIGURG and SIGIO\");\n    alarm(DELAY);\n    /** do your work ***/\n\
    }\n```\n\nThese examples show you a heartbeat that the client drives. You can\
    \ expand this to a bi- directional heartbeat simply by adding a test in the server.\
    \ If the server does not hear from the client within a period of time, you know\
    \ you have an error at the client end.\n\nUrgent messages give you more control\
    \ over the connection, as long as both ends expect that level of interfacing.\
    \ This is part of establishing protocols that Chapter 6, \"A Server Primer,\"\
    \ discusses.\n\n# Summary: Pulling Together Performance Features\n\nEach chapter\
    \ up to this one has given you a piece of a large puzzle that can help you build\
    \ a high- performance client and server. The network program (the client, server,\
    \ or peer) has to manage the information that it sends and receives. Sometimes,\
    \ using multitasking can limit the performance if you are not careful.\n\nWhen\
    \ balanced with I/O control and multiplexing I/O, you can take advantage of the\
    \ power of each and lose little. This adds complexity to your programs, but with\
    \ good design and forethought, you can overcome the problems it creates.\n\nThe\
    \ socket options also give you fine control over how the socket manages the packets.\
    \ One of the features includes sending a message even though the buffer is not\
    \ full. As you send and receive messages, calling the Sockets API can speed execution."
