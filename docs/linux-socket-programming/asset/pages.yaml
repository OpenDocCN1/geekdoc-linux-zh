- pgno: 60
  md: 'If the check fails and the subsystem detects an error, the subsystem takes
    care of it by asking for a retransmission. Both ends of the communication path
    perform this validation check. As described in the last chapter, some messages
    have a unique and sequential packet ID. The ID is important for ensuring reliability
    and order. You get this feature when you select the TCP protocol.


    The two biggest problems with network communication are packet loss and packet
    reorder. Suppose your program sends a message. Programs cannot detect absolutely
    that the destination gets the message unless it gets a response from the destination.
    For example, your program sends the message, and the destination waits for the
    packet to arrive. If the destination does not receive anything for a while, it
    sends a message to your program indicating the last sequence number it reliably
    received. This collaboration tightly couples your program with the destination.


    On the other hand, the destination may get some parts of the message out of order
    with the rest of the message. When this happens, the destination holds on to the
    message fragment until it gets your intervening pieces. The destination then reassembles
    the message using the sequence number as the ordering key.


    As noted before, the higher-level library calls expect an open channel and also
    require the reliable communication path. The TCP protocol focuses on your message
    channel so that the information appears to flow in a nonpacketed stream. Alternatively,
    lower-level protocols focus on the packet, so they could not support high-level
    I/O library calls like printf().


    The less-reliable protocols provide you with a very fast channel for your program
    to send messages. UDP, in particular, tries to get the message out on your network
    quickly without regard to order. Similarly, the destination accepts each independent
    message, not expecting any order.


    Order is an important concern for your design. You may not expect that your data
    is order dependent when, in reality, it may be. Here are a few questions that
    can help you decide whether or not your messages require streams (with quick,
    parenthetical summaries).


    +   * **Does your data form an independent request?** Your program can accept
    the reply in any order when the message is an independent request. For example,
    the order of execution is unimportant in the case of unrelated requests: A program
    can request a file and then go on to request the peer’s status. However, if you
    were sending coordinate points for a player on a network game—that is, an interdependent
    request—the order of the positions is very important. (Yes=UDP; No=TCP)

    * **If you randomly reorder the messages, does your program eventually respond
    with the same results?** This is the real litmus test of message-based channels.
    Streams cannot tolerate reordering of the packets. TCP carefully reorders the
    messages into a continuous message. (Yes=UDP; No=TCP)

    * **Do you picture your dialog as a pipe connecting the two programs or as a FedEx
    courier?** On one hand, the flow of information between your program and the peer
    can compare to water in a pipe. This information has an order. On the other hand,
    a single packet of information can compare to a parcel. The information is unordered
    and packetized. For example, you can receive several parcels in any order and
    may only reply to a couple. The flow-pipe cannot support this without information
    loss. (FedEx=UDP; Pipe=TCP)

    * **If you disconnect and reconnect between each message, does the server or peer
    have to keep track of where you were or the state of the transaction?** Some transactions
    may simply be "Give me this," and the reply is "Here." The server remembers nothing
    from transaction to transaction. Other transactions force you to pass through
    different states. A Telnet session has two states: logged-in and not logged-in.
    (No=UDP; Yes=TCP)'
