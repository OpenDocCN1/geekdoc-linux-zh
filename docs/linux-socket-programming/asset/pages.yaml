- pgno: 275
  md: 'minimum. While testing some of the algorithms for this chapter, this very problem
    hampered development for a short time.


    You can see the list of supporting NICs in `/./linux/Documentation/networking/`
    `multicast.txt`. If your programming attempts do not work, make sure your card
    has full support.


    # Bottlenecking Performance


    You face another problem with getting broadcast or multicast messages (especially
    for those NICs that use promiscuous mode for multicasting). The program has to
    filter a lot of unwanted messages. Broadcasting has that problem as well, and
    multicasting reduced its effect a lot. But the problem is still there.


    Similarly, the connection from client to the network may not be able to handle
    all the messages that the multicast group sends (for example, a video feed on
    a 56Kbps modem). What happens? The router enqueues the messages until they expire.
    Knowing the bottlenecks between your server and the client can help you maintain
    high reliability and usability.


    A potential solution to the bottleneck problem might require some stronger control
    from routers.


    # Accounting for Every Message


    The last issue is accountability; anyone can send any message whether or not he
    owns or is part of a multicast group. This can result in interference from those
    who want to harm the effectiveness of the Internet.


    # Message Uniqueness


    Another form of accounting appears as you work with the multicasting protocols.
    You may be familiar with the potential message mirroring datagrams have. In multicasting,
    the problem is more pronounced because of the requirement to copy the message
    for different paths.


    An example of this duplication is when a host connects to the Internet and has
    to pass through several routers. At one point, the message goes through a couple
    routers in the same subdomain. This should not happen because a proper network
    would only have one router per domain, but it does happen.


    When a host joins a group, the two routers see the request and pass the message
    to the parent router. Later, a multicast message arrives to the parent. The parent
    recognizes the message as one that the routers advertised using IGMP. It passes
    the message on, and the two routers pass it to their subdomain. Because of the
    implicit copy (by each router), the host gets two identical messages.


    To get around this problem, first, make sure that you tag all your messages and,
    second, try to keep the network topology clean.


    # Summary: Efficient Message Sharing


    If you need to share messages between multiple hosts without sending to each one
    directly, you can use broadcasting or multicasting. Broadcasting, the older form,
    uses the IP addressing with the netmask to create and send a message. It uses
    the network resources more efficiently but forces every host on the subnet to
    hear the message. Also, broadcasting on the WAN is not permitted.'
