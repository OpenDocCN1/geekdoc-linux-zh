  md: "```\nif ( (bytes_read = read(sockfd, buffer, sizeof(buffer))) < 0 )\n    perror(\"\
    read\");\n```\n\n# select()\n\nWait for any I/O status changes from the file descriptor\
    \ sets. When any of the specified sets changes, the call returns. You have four\
    \ macros to help construct and manage the file descriptor sets:\n\n+   * FD_CLR\
    \ Remove a descriptor from the set.\n* FD_SET Add a descriptor to a set.\n* FD_ISSET\
    \ Test if specified descriptor is ready for I/O.\n* FD_ZERO Initialize the set\
    \ to empty.\n\n# Prototype\n\n```\n#include <sys/time.h>\n#include <sys/types.h>\n\
    #include <unistd.h>\nint select(int hi_fd, fd_set *readfds, fd_set *writefds,\n\
    fd_set *exceptfds, struct timeval *timeout);\nFD_CLR(int fd, fd_set *set);\nFD_ISSET(int\
    \ fd, fd_set *set);\nFD_SET(int fd, fd_set *set);\nFD_ZERO(fd_set *set);\n```\n\
    \n# Return Value\n\nThe number of descriptors that have changed states. If an\
    \ error occurred, the return value is negative. If the timeout expired, the return\
    \ value is zero.\n\n# Parameters\n\n| Parameter | Description |\n| --- | --- |\n\
    | hi_fd | This is the highest file descriptor number + 1. For example, if you\
    \ have four files open plus the stdio, your descriptors could be 0, 1, 2, 3, 5,\
    \ 6, and 8. The highest is 8. If you include fd(8) in your select statement, hi_fd\
    \ would equal 9. If the highest fd was 5, this parameter would be 6. |\n| readfds\
    \ | The set of descriptors to test for readability. |\n| writefds | The set of\
    \ descriptors to test for writing. |\n| exceptfds | The set of descriptors to\
    \ test for out-of-band data. |\n| timeout | The maximum time to wait for data\
    \ to arrive in microseconds. This is a pointer to a number. If the number is zero\
    \ (not the pointer), the call returns immediately after checking all the descriptors.\
    \ If the pointer is NULL (zero), the select's timeout feature is disabled. |\n\
    | fd | The file descriptor to add, remove, or test. |\n| set | The file descriptor\
    \ set. |\n\n# Possible Errors\n\n| Error | Description |\n| --- | --- |\n| EBADF\
    \ | An invalid file descriptor was given in one of the sets. |\n| EINTR | A non-blocked\
    \ signal was caught. |\n| EINVAL | n is negative. |"
