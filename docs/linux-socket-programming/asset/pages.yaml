- pgno: 311
  md: "Send a message to the connected peer, client, or server. This call is like\
    \ the `write()` system call, but `send()` permits you to define additional options\
    \ for channel control.\n\n# ## Prototype\n\n```\n```\n#include <sys/socket.h>\n\
    #include <resolv.h>\nint send(int sockfd, void *buffer, int msg_len,\n       \
    \   int options);\n```\n```\n\n# ## Return Value\n\nLike `write()`, the call returns\
    \ the number of bytes written. The byte count can be less than `msg_len`. If the\
    \ call does not succeed in writing all required bytes, you can use a loop for\
    \ successive writes. If negative, the call stores the error detail in `errno`.\n\
    \n# ## Parameters\n\n| Parameter | Description |\n| :--- | :--- |\n| `sockfd`\
    \ | The socket channel. This can be a connected `SOCK_DGRAM` or `SOCK_STREAM`\
    \ socket. |\n| `buffer` | The data to send. |\n| `msg_len` | The number of bytes\
    \ to send. |\n| `options` | A set of flags to enable special message handling:<br>•\
    \ `MSG_OOB`: Send message out-of-band (urgent).<br>• `MSG_DONTROUTE`: Send the\
    \ message bypassing all routers. If unsuccessful, the network sends an error back.<br>•\
    \ `MSG_DONTWAIT`: Don't allow blocking. Similar to the `fcntl()` option call,\
    \ but only applies to this call. If the call would block, the call returns with\
    \ `EWOULDBLOCK` in `errno`.<br>• `MSG_NOSIGNAL`: If the peer severs the connection,\
    \ don't raise a `SIGPIPE` signal locally. |\n\n\n\n# ## Possible Errors\n\n| Error\
    \ | Description |\n| :--- | :--- |\n| `EBADF` | An invalid descriptor was specified.\
    \ |\n| `ENOTSOCK` | The argument `sockfd` is not a socket. |\n| `EFAULT` | An\
    \ invalid user space address was specified for `buffer`. |\n| `EMSGSIZE` | The\
    \ call can't complete because the socket requires that the message be sent atomically,\
    \ and the size of the message to be sent has made this impossible. |\n| `EAGAIN`\
    \ | The socket is marked non-blocking and the requested operation would block.\
    \ |\n| `ENOBUFS` | The system was unable to allocate an internal memory block.\
    \ The operation may succeed when buffers become available. |\n| `EINTR` | A signal\
    \ occurred. |\n| `ENOMEM` | No memory available. |\n| `EINVAL` | Invalid argument\
    \ passed. |\n| `EPIPE` | The local end has been shut down on a connected socket.\
    \ In this case, the process will also receive a `SIGPIPE` unless `MSG_NOSIGNAL`\
    \ is set. |\n\n\n\n# ## Example"
  merge: -1
  img_proc: true
