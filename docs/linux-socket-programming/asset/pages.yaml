    ```\n\n# exec()\n\nRun an external program (either a binary or an executable script\
    \ with `#! <interpreter> [arg]` in the first line). This call replaces the currently\
    \ running task with the external program's context. The new program keeps the\
    \ caller's PID and open files.\n\nThe calls **exec1()**, **execl()**, **execle()**,\
    \ **execv()**, and **execvp()** are all front ends to **execve()**.\n\n# Prototype\n\
    \n```\n#include <unistd.h>\nint execve(const char* path, char* const argv[], char*\
    \ const envp[]);\nint execl(const char* path, const char* arg, ...);\nint execle(const\
    \ char* file, const char* arg, ...);\nint execv(const char* path, const char*\
    \ arg, ..., char* const envp[]);\nint execvp(const char* path, char* const argv[]);\n\
    \n```\n\n# Return Value\n\nThis call does not return if successful. If it fails,\
    \ the return value is −1.\n\n# Parameters\n\n| Column 1 | Column 2 |\n| :-------\
    \ | :------- |\n| **file** | The program to execute. The call searches for the\
    \ name in this variable using the defined **PATH**. |\n| **path** | The absolute\
    \ path and filename of the program to execute. |\n| **argv** | The string array\
    \ of command-line parameters. The first array element value must be `arg0` (or\
    \ the name of the program). The last array element is always zero (`0`). |\n|\
    \ **arg** | A command-line parameter. This is followed by an ellipsis (…), to\
    \ indicate that there are several arguments. The first `arg` is always the name\
    \ of the program, and the last `arg` is always zero (`0`). |\n| **envp** | The\
    \ string array of environment parameters. Each parameter is in the form `<param>`=`<value>`\
    \ (for example, **TERM**=**vt100**). The last array element is always zero (`0`).\
    \ |\n\n# Possible Errors"
