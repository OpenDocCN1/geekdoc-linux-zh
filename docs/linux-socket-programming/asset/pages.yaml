  md: 'This part introduces sockets and defines terms. It describes the different
    types of sockets, addressing schemes, and network theory.


    +   - **Part II**: The Server Perspective and Load Control


    **Part II** expands socket programming with servers, multitasking techniques,
    I/O control, and socket options.


    +   - **Part III**: Looking at Sockets Objectively


    C is not the only programming language that provides access to sockets. This part
    presents some object-oriented approaches and describes the advantages and limitations
    of object technology in general.


    +   - **Part IV**: Advanced Sockets—Adding Value


    This part introduces the large realm of advanced network programming techniques,
    including security, broadcast and multicasting, IPv6, and raw sockets.


    +   - **Part V**: Appendices


    The appendices consolidate much of the resource material relevant to sockets.
    The first appendix includes tables and listings too large for the chapters. The
    second and third appendices describe the Socket and Kernel APIs.


    The companion Web site contains all the source code for the book examples, the
    book appendices in HTML and Adobe''s Portable Document Format (PDF), and socket
    programming-related RFCs in HTML format.


    # Professional Reader''s Styles


    This book is designed for the professional programmer. Typically, the professional
    wants to do one of three things: learn a new technology, solve a particular problem,
    or look up some example or definition. The chapters and appendices attempt to
    meet each of these criteria.


    +   - **Linear reading front-to-back** This is for those who want to be exposed
    to one topic at a time. Each section and chapter builds on previous knowledge.
    This text is organized to build complexity. Sockets programming may seem rather
    intuitive at first. However, the programming gives rise to several caveats and
    issues with regard to timing, exceptions, performance, and so on that can corrupt
    a great design. Reading linearly helps you build concept upon concept to know
    how to do it right.


    +   - **Browsing** The browser gets the needed information without wading through
    too much unnecessary detail. He knows more about the topic and wants to skip to
    the good stuff. Like navigating a Web site, the browser skips around the topics
    until he finds all the needed pieces of information.


    +   - **Referencing** The expert typically wants to find information (tables,
    program fragments, APIs) quickly. The information needs to be succinct and easy
    to find.


    This book is laid out with the fundamental information to accomplish what is typically
    needed or wanted. Additionally, many chapters have passages set apart from the
    text. These passages provide additional information, detail, expert notes, and
    opinions.'
