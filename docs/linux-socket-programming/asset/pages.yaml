  md: "method assumes the context to be complete and stable. While in the constructor,\
    \ the compiler considers the context to be incomplete or unstable.\n\nStatic methods\
    \ of a class do not depend on a context, so you can use them basically anytime\
    \ and anywhere. In fact, you don't even need an instantiated object to use them.\
    \ So, the relationship between the static methods and class is very loose, almost\
    \ ancillary. Classes rarely use static methods because of this loose relationship.\
