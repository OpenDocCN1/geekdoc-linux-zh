  md: "# ## Socket Controls\n\nWhile the socket is open, you can configure it to behave\
    \ in various ways. This section describes the API calls.\n\n**setsockopt()**\n\
    \nChange the behavior of socket `sd`. Every option has a value (some options are\
    \ read- or write-only). You can set each option through `optval` and `optlen`.\
    \ For a complete list of options, see Appendix A.\n\n# ### Prototype\n\n```\n\
    ```c\n#include <sys/types.h>\n#include <sys/socket.h>\nint setsockopt(int sd,\
    \ int level, int optname,\n               const void *optval, socklen_t optlen);\n\
    ```\n```\n\n# ### Return Value\n\nZero if everything goes well. If an error occurs,\
    \ you can find the cause in `errno`.\n\n# ### Parameters\n\n| | |\n|---|---|\n\
    | `sd` | The socket to modify |\n| `level` | The feature level (`SOL_SOCKET`,\
    \ `SOL_IP`, `SOL_TCP`, `SOL_IPV6`) |\n| `optname` | The option to revise |\n|\
    \ `optval` | A pointer to the new value |\n| `optlen` | The length of value in\
    \ bytes |\n\n# ### Possible Errors\n\n| | |\n|---|---|\n| `EBADF` | The argument\
    \ `sd` is not a valid descriptor. |\n| `ENOTSOCK` | The argument `sd` is a file,\
    \ not a socket. |\n| `ENOPROTOOPT` | The option is unknown at the level indicated.\
    \ |\n| `EFAULT` | The address pointed to by `optval` is not in a valid part of\
    \ the process address space. |\n\n# ### Example\n\n```\n```c\nconst int TTL=128;\n\
    /*---Change the time-to-live to 128 hops---*/\nif ( setsockopt(sd, SOL_IP, SO_TTL,\
    \ &TTL, sizeof(TTL)) != 0 )\n    perror(\"setsockopt() failed\");\n```\n```\n\n\
    **getsockopt()**\n\nGet the socket configuration.\n\n# ### Prototype"
