  md: "this in a loop that has some localized processing, such as is found in the\
    \ following polling algorithm:\n\n```\n/***************\n/ General Polling Algorithm\n\
    while ( /** Transferring Data **/)\n{\n  if ( /** check a channel for readiness\
    \ **/)\n    /** process the channel **/\n  /** Do some computation **/\n}\n...\n\
    ```\n\nWhat is important in this code segment is the computation section. Linux\
    \ uses a prioritized round-robin style of scheduling. As a task does more CPU-bound\
    \ processing (less I/O-bound), its effective priority increases. If you omit the\
    \ computation section, your task runs in a tight loop, increasing scheduling favor\
    \ while essentially doing nothing. Tight loops are very nasty to task scheduling.\
    \ Your task can eventually dominate the scheduling time while accomplishing very\
    \ little.\n\nAlso, if you can't think of anything to do while waiting for a channel\
    \ to free up, don't use a delay loop or sleep(). Unless you need a real-time response,\
    \ a delay loop or sleep() defeats the purpose of polling. Either use a timeout\
    \ or let the program block instead.\n\n# A Polling Reader\n\nPolling lets you\
    \ get pieces of information that the task can process while waiting for more.\
    \ With a polling reader, the program gets and processes data. Usually, the processing\
    \ and the data read are related, and you must enable nonblocking I/O to do polling\
    \ at the read/write level. Use the *fcntl()* system call to enable nonblocking\
