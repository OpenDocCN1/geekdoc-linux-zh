  md: '![](img/03334662da8fdfb8d95a02f270c522f6_220_0.png)


    A last special attribute requires a little more than changing a value. These are
    true properties that look like attributes but, in reality, they perform several
    operations. For example, the `MinimizeDelay()`, `MaximizeThroughput()`, `MaximizeReliability()`,
    and `MinimizeCost()` calls in `Datagram` all interface with a single `setsockopt()`.
    But to simplify the interface, they calculate and set the right bit values so
    you don''t have to.


    The classes in the socket component can include other attributes that are particular
    to the specific implementation of the class. For example, `SocketServer` can store
    the registered callback routine for accepted connections. Also, the multicasting
    socket does not have a way of cleanly dropping the groups, so `MessageGroup` includes
    an array of joined groups.


    # Methods: Adding What It Does


    As with the join group function available for multicasting sockets, some classes
    have specific method implementations that extend the CRUD methods. The normal
    OOA/D methodology identifies what each class must do to fulfill its responsibilities.
    These responsibilities are related to functions mentioned in the use-cases (as
    described in [Chapter 11]).'
