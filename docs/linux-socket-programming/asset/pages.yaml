  md: "| without removing that data from the queue. Thus, a subsequent receive call\
    \ will return the same data. | MSG_WAITALL This flag requests that the operation\
    \ block until the full request is satisfied. However, the call may still return\
    \ less data than requested if a signal is caught, an error or disconnect occurs,\
    \ or the next data to be received is of a different type than that returned. |\n\
    | --- | --- |\n| MSG_ERRQUEUE Receive packet from the error queue. |\n| MSG_NOSIGNAL\
    \ This flag turns off raising of SIGPIPE on stream sockets when the other end\
    \ disappears. |\n| MSG_ERRQUEUE This flag specifies that queued errors should\
    \ be received from the socket error queue. The error is passed in an ancillary\
    \ message with a type dependent on the protocol (for IP, IP_RECVERR). The error\
    \ is supplied in a `sock_extended_error` structure. |\n\n# Possible Errors\n\n\
    | EBADF | The argument s is an invalid descriptor. |\n| --- | --- |\n| ENOTCONN\
    \ | The socket is associated with a connection-oriented protocol and has not been\
    \ connected (see `connect()` and `accept()`). |\n| ENOTSOCK | The argument sockfd\
    \ does not refer to a socket. |\n| EAGAIN | The socket is marked as non-blocking,\
    \ and the receive operation would block, or a receive timeout had been set and\
    \ the timeout expired before data was received. |\n| EINTR | A signal interrupted\
    \ the receive operation before any data was available. |\n| EFAULT | The receive\
    \ buffer pointer points outside the process's address space. |\n| EINVAL | An\
    \ invalid argument was passed. |\n\n# Example\n\n```\n/*** Recv a message (TCP,\
