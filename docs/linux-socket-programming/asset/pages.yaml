- pgno: 158
  md: "system call returns to your server with the channels that are ready, and your\
    \ server retrieves and processes the command.\n\nThe temptation to skip multitasking\
    \ altogether and use these multiplexers may lead to some loss in performance.\
    \ When using a single task to process information, your program or server has\
    \ to wait for I/O at various times during the life of the process. If you don't\
    \ take advantage of this downtime, your servers may lose significant opportunities\
    \ to do other things. For example, if you have ever compiled the kernel, you may\
    \ find that it compiles in less time if you force multiple jobs with the -j make\
    \ option. (If you have the memory, two or three jobs per processor cuts the compilation\
    \ time noticeably.)\n\n# ## Compromising with a Smart Select\n\nAs you create\
    \ your high-powered, high-demand server, you can use various ways to distribute\
    \ the load. Two are multitasking and I/O multiplexing. However, if used exclusively,\
    \ multitasking may lose control of the scheduler and erode precious time to context\
    \ switching, while I/O multiplexing loses unused CPU bandwidth. An alternative\
    \ to using either exclusively is a combination of both. Combining the two into\
    \ a *Smart Select* could help you diminish the disadvantages of each, while giving\
    \ you their capabilities.\n\nA Smart Select dispatches a few processes. Each process\
    \ owns a connection channel and a set of open client channels. An I/O multiplexer\
    \ manages all of the channels. Here is an algorithm for the process:\n\n```\n\
    ```c\n/*****...*******************************...*****/\n/*** Smart Select example:\
    \ each child tries to accept a ***/\n/*** connection. If successful, it adds the\
    \ connection ***/\n/*** to the select() list.                ***/\n/*** (\"smart-select.c\"\
    \ on Web site)              ***/\n/*****...*******************************...*****/\n\
    int sd, maxfd=0;\nfd_set set;\nFD_ZERO(&set);\n/*** Create socket and fork() processes\
    \ ***/\n/**---In Child---*/\nmaxfd = sd;\nFD_SET(sd, &set);\nfor (;;) {\n    \
    \    struct timeval timeout={ 2,0 };         /* 2 seconds */\n        /**--Wait\
    \ for some action--*/\nif ( select(maxfd+1, &set, 0, 0, &timeout) > 0 )\n{\n \
    \       /**--If new connection, connect and add to list--*/\n if ( FD_ISSET(sd,\
    \ &set) )\n  {  int client = accept(sd, 0, 0);\n     if ( maxfd < client )\n \
    \       maxfd = client;\n     FD_SET(client, &set);\n  }\n        /**--If command/request\
    \ from client, process--*/\nelse\n        /*** Process client's request ***/\n\
    \        /*** If client just closed, remove from list ***/\n}\n}\n```\n```"
