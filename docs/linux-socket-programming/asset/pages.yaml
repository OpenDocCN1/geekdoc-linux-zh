    # ### Selecting the Right Protocol


    The first step to creating a raw socket is selecting the right protocol. The /etc/protocol
    file (see Appendix A, Table A.7) lists the protocol numbers, names, and synonyms.
    You can use this file to get the correct protocol number from the standard alphabetic
    name without having to define any constants. The system call to use is getprotobyname():


