    17 Sharing Messages with Multicast, Broadcast, and Mbone

    18 The Power of Raw Sockets

    19 IPv6: The Next Generation to IP


    # **Chapter 15. Network Encapsulation with Remote Procedure Calls (RPCs)**


    # **IN THIS CHAPTER**


    +   - Revisiting the OSI Model

    - Comparing Network and Procedural Programming

    - Supplying Middleware Methods

    - Creating RPCs with `rpcgen`

    - Creating Non-Stateless Calls with Open Connections

    - Summary: Creating an RPC Toolset


    Looking from a developer-user perspective, knowing all the eccentricities of network
    programming may be more laborious than you want. Sometimes, you or your peers
    (the developer-users) simply want to focus on the development of the programs
    at hand and leave the network details to established libraries or tools. Remote
    Procedure Calls (RPCs) fit that bill perfectly.'
