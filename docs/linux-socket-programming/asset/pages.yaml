    to which clients can connect.


    # Multicasting Messages to a Group


    Multicasting [RFC1112] answers some of the problems with broadcasting. The primary
    idea of broadcasting is sending a message to everyone within an address range.
    Multicasting uses agreed-upon addresses that hosts can join to listen for messages.


    Multicasting uses a single IP address to send messages to several recipients.
    It has the following advantages over broadcasting:


    +   * All Protocols—It supports datagram and streaming protocols (UDP and TCP).
    Datagrams support multicasting right now, but streams have no immediate implementations.
    You can find free (not Open Source) implementations of reliably delivered multcasts.

    * WAN Accessible—You can join global multicasting groups. However, at the time
    of this writing, there are sections of the WAN that do not support or pass multicast
    messages.

    * Limited Listeners—A multicast message does not *necessarily* force all NICs
    to pick it up (see the "How the Network Provides Multicasting" section later in
    this chapter).

    * IPv6 Support—IPv6 dropped support for broadcasting, but it has adopted and extended
    multicasting.


    > NOTE


    # Turning On Multicasting Support


    Most distributions include kernels that have multicasting turned on. (You can
    look in `/proc/net/dev_mcast` to check your currently running kernel.) However,
    multicast routing may not be enabled, or if you are using a downloaded kernel,
    you might not have the option set. If you want to use multicasting or you manage
    a router for others who want to use multicasting, you may need to reconfigure
    and recompile the kernel. The configurations are in the Networking part of the
    configuration.


    # Joining Multicast Groups


    Using multicasting is a simple as joining a list service. Like a list service,
    you get as many messages as others send, so it’s easy to overrun a constricted
    network connection. If you join a group, be careful that you have the bandwidth
    to support the data flow. Most likely, you may drop packets and make the connection
    less than useful.


    Broadcast addresses follow a specific pattern so that the routers can recognize
    them. These addresses come directly from the IP allocation (first introduced in
    Chapter 2). The range is 224.0.0.0–239.255.255.255. These addresses are reserved
    for broadcasting. This range of addresses is subdivided into smaller ranges to
    indicate the *address scope* or how far the message can go before a router blocks
    it. Table 17.1 shows these divisions.


    Table 27.1, Multicasting Address Allocation and Scope


    | Scope | Typical TTL | Address Range |

    | :--- | :--- | :--- |

    | Cluster | 0 | 224.0.0.0–224.0.0.255 |

    | Site | < 32 | 239.255.0.0–239.255.255.255 |

    | Organization | < 128 | 239.192.0.0–239.195.255.255 |

    | Global | <= 255 | 224.0.1.0–238.255.255.255 |'
