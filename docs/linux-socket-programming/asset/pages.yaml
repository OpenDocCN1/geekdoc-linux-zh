  md: '# Classifying the I/O Classes


    The Java I/O package includes several classes, each defined to perform a specific
    task. All of them send or receive information. Unfortunately, because it has so
    many classes, it is difficult to know which to use and when. Perhaps the easiest
    way to work with them is to group them according to their several responsibilities.
    Then you can easily see which class is best for socket use.


    The I/O package essentially offers six primary types of I/O. Each type serves
    a specific purpose, and all derive from `Reader`, `Writer`, `InputStream`, or
    `OutputStream`:


    +   * **Memory**— I/O based on memory buffers. The package accesses no hardware
    devices; instead, arrays in RAM serve as virtual I/O pools. This helps in parsing
    strings or even creating a buffer for datagrams. Examples include `ByteArrayInputStream`,
    `ByteArrayOutputStream`, `CharArrayReader`, `CharArrayWriter`, `StringReader`,
    and `StringWriter`.

    * **File**— Reading, writing, and manipulating the file system. These classes
    provide you ways to create, read, write, delete, or manipulate files in a file
    system. Examples include `FileInputStream`, `FileOutputStream`, `FileReader`,
    and `FileWriter`.

    * **Filters**— I/O that does some character-based translation or interpretation.
    For example, treating a newline like an end of record, recognizing fields by tabs
    or commas, or converting binary values into readable numbers. Examples include
    `FilterReader`, `FilterWriter`, `PrintWriter`, and `PrintStream` (deprecated).

    * **Objects**— Sending and receiving of entire objects. This is most impressive;
    Java can send and receive instances without any coding on your part. In most cases,
    you only need to flag the class `Serializable`, and you can transmit and receive
    object instances. The classes are `ObjectInputStream` and `ObjectOutputStream`.

    * **Pipes**— IPC (Inter-Process Communications) as you find in C. You create a
    pipe and link it with another pipe, and then two threads send each other messages.
    The classes are `PipedInputStream`, `PipedOutputStream`, `PipedReader`, and `PipedWriter`.

    * **Stream**— Generalized buffered I/O communications. This is the form that sockets
    use. If you want to use the others, you need to convert the streaming class to
    another (see the next section). The abstract classes are `InputStream` and `OutputStream`.
    The basic conversion classes are `InputStreamReader` and `OutputStreamWriter`.


    The package has several other classes that really don''t fit in this classification.
    An example is `SequenceInputStream`, which allows you to merge two streams into
    one.


    Of all these classes, you may want to familiarize yourself most with `ObjectInputStream`
    and `ObjectOutputStream` for sending and receiving custom classes or `BufferedReader`
    and `PrintWriter` for string I/O. Network programs often use these because they
    suit socket programming the best. Similarly, you can use the `ByteArrayInputStream`
    or `ByteArrayOutputStream` objects to provide interfaces for datagram messages.


