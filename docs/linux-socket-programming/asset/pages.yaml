  md: '# bind()


    bind() defines a port or name to a socket. If you want a consistent port for an
    incoming connection, you have to bind your socket to a port. In most instances,
    the kernel automatically calls bind() for the socket if you do not call it explicitly.
    The kernel-generated port assignment can be different from execution to execution.


    # Prototype


    ```

    #include <sys/socket.h>

    #include <resolv.h>

    int bind(int sockfd, struct sockaddr* addr,

    int addrlen);

    ```


    # Return Value


    Zero if everything goes well. If an error occurs, you can find the cause in errno.


    # Parameters


    | Parameter | Description |

    |:---|:---|

    | `sockfd` | The socket descriptor to bind. |

    | `Addr` | The port assignment or name. |

    | `Addrlen` | The length of `addr` because `addr` can be different sizes. |


    # Possible Errors


    | Error | Description |

    |:---|:---|

    | EBADF | `sockfd` is not a valid descriptor. |

    | EINVAL | The socket is already bound to an address. This may change in the future;
    see `../linux/unix/socket.c` for details. |

    | EACCES | The address is protected, and the user is not the superuser. |

    | ENOTSOCK | Argument is a descriptor for a file, not a socket. |


    # Example


    ```

    /* ** Bind port #9999 to socket from any Internet Address ** */

    int sockfd;

    struct sockaddr_in addr;

    sockfd = socket(AF_INET, SOCK_STREAM, 0);

    bzero(&addr, sizeof(addr));

    addr.sin_family = AF_INET;

    addr.sin_port = htons(9999); /* or whatever port you want */

    /* to bind any network interface */

    addr.sin_addr.s_addr = INADDR_ANY;

    /* -or- to bind a specific interface, use this: */

    /* inet_aton("128.1.1.1", &addr.sin_addr); */

    if ( bind(sockfd, &addr, sizeof(addr)) != 0 )

    perror("bind");

    ```'
