  md: 'When you choose to use objects, you may want to be aware of some of the problems.
    The problems include getting people to think in objects, realizing that objects
    still can''t do some things, being prepared for additional complexity, and managing
    a new paradigm.


    The power of Object Technology is alluring, but this chapter lets you know of
    the few limitations it has.


    # Mind Over Objects


    The first problem programmers, designers, and analysts encounter when they begin
    an object project is trying to take a look at the objects themselves. If you forget
    to do this, you can fall into the same pitfalls that many have before you. Each
    step through the object analysis focuses on what the system is supposed to do,
    what the object contributes to the effort, and when you know it''s done.


    This section presents several pitfalls that you can face during the development.
    Remember, this is only a sampling of what can go wrong.


    # Beginning on the Right Foot


    The Beguin is a Spanish dance that predates the Tango. Like this dance, if you
    don''t start on the right foot in an object project, you might as well dance with
    Death. Understanding what the user wants is the most important step you take.
    The interaction with your user is much like a dance—and the user leads.


    The user is the person or system that will interact with your program. If you
    do not identify and solidify the interfaces, the dance can turn on you—you may
    end up leading. This is not a good position; the result will inevitably be something
    other than what the user wants.


    You can use four essential tools to define the wants and needs of the user: the
    context, the function list, the use-cases/scenarios, and the system flow. Get
    a good book on requirements gathering and management for a detailed how-to. These
    tools will help you prove the program works according to the user''s expectations.


    The context simply defines what your program does *not* do. It identifies all
    the users, the information flowing in and out, and the functions for which the
    users are responsible. This is very crucial for a successful project. If you do
    not identify what you''re going to omit, the user may assume the program will
    have it.


    The context leads you directly to a list of functions that the program will do.
    Each function is in a verb-object pair. For instance, a good function would be
    "Prints statistical report for user." The implied subject is the program.


    The functional list logically leads to use-cases. The use-case describes generally
    how the program is to perform the function. The use-case always starts and ends
    with the outside; the steps in between describe the transformation required. You
    can subdivide the use-cases into individual scenarios. Remember that the use-case
    is the function, and the scenario addresses the differences in the data. Consider
    the follow examples:


    | Use-Case #9: "Send a message to person on the network" |

    | --- |

    | User types message and clicks Send |

    | Open connection to destination |

    | Contact recipient |'
  merge: -1
