    \ Refer to Appendix C for a more expansive listing.\n\n```\nif ( fcntl(sd, F_SETFL,\
    \ O_NONBLOCK) != 0 )\n    perror(\"Fcntl--could not set nonblocking\");\n```\n\
    \nFor example, suppose you are writing an audio player plug-in. Instead of waiting\
