    \ 0); /* Ignore the ^C (interrupt) */\n /*---do processing---*/\n}\n```\n\n# NOTE\n\
    \n# Losing Signals in Signal Handlers\n\nIf you take too long in a signal handler,\
    \ your program can lose pending signals. The signal queue is only a single flag—if\
    \ two signals arrive, only one gets recorded. So, try to minimize the amount of\
    \ CPU time spent in the signal handler. Also, making the handler short and succinct\
    \ ensures that your program gets more CPU time.\n\nServers and clients can receive\
    \ several different signals. To make code more robust, capture all reasonable\
    \ and applicable signals. (Some signals, such as SIGFAULT, are best uncaught.\
    \ If you get this one, there is something wrong in your code or data, and you\
    \ won’t recover.)\n\n# NOTE\n\n# Reducing Code with Shared Signal Handlers\n\n\
    You can merge your signal handlers into one handler. The system passes the handler\
    \ the signal number. Once inside the handler, simply check that value to do the\
    \ appropriate actions.\n\nYou can send any signal to a task you can control. In\
    \ other words, signals follow the same security rules as everything else. To issue\
    \ a signal from the command line, you can use the kill command. Likewise, you\
    \ can call the kill() system call in a program. The kill() system call’s prototype\
    \ is as follows:\n\n```\n#include <sys/types.h>\n#include <signal.h>\nint kill(pid_t\
