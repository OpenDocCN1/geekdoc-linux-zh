- pgno: 267
  md: '# **Summary: The Secure Server**


    The network socket connects you with many possible opportunities to increase productivity
    and distribute processing. However, the information that you share between hosts
    is not hidden from other hosts connected on the same network. Placing vital or
    secret information on the Internet is an invitation for loss, espionage, corruption,
    and so on. The very nature of the Internet can be your liability.


    You can cut your losses by planning ahead and establishing security around your
    vital products. Most companies cannot ignore the fact that they must have a presence
    on the Internet to survive. Firewalls, policies, and encryption are typical ways
    to lock down a site and blockade against attack.


    When two or more hosts communicate in a public setting, such as the Internet,
    you can require certain protocols and algorithms to reduce the possibility of
    snooping. Encryption comes in various forms and provides different levels of security.
    Two standard encryption forms are symmetric- and public-key. Both are used today
    for communications such as SSL.


    Writing programs in an SSL API depends strongly on the API implementation. No
    standard API for SSL exists at the time of this writing. However, you can get
    a taste of what it is like to use SSL in C with an Open Source version called
    OpenSSL. OpenSSL is a very rich implementation with over 200 API calls.


    With good planning, foresight, and standard tools such as OpenSSL, you can create
    an effective, reliable, and secure resource for the Internet.


    The next chapter takes you to the other extreme of information sharing with multicasting
    and broadcasting. Security attempts to ensure privacy. Multicasting and broadcasting
    attempt to share as much as possible and as efficiently as possible.


    # **Chapter 17. Sharing Messages with Multicast, Broadcast, and Mbone**


    # **IN THIS CHAPTER**


    +   - [Broadcasting Messages to a Domain](#)

    - [Multicasting Messages to a Group](#)

    - [Summary: Efficient Message Sharing](#)


    A network is a very good medium for getting a message from one place to another.
    It has a wide range of technologies and bandwidths that let you try different
    things. One advantage that you may not consider as a plus is the fact that all
    the computers are typically connected to a backbone of some kind. Now, how would
    having a computer connected on the same backbone be advantageous? Normally, the
    traffic would be greater and a dedicated connection from host to host would be
    best.


    Some services can go to several destinations simultaneously. Instead of sending
    the same message to each host, you could send one message and have all hosts simply
    pick it up. The pluses to this are obvious—less redundant traffic.


    The Internet Protocol offers two forms of distribution messaging: broadcasting
    and the newer multicasting. This chapter discusses the different types of distribution
    messaging and how to implement them.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# ### Broadcasting Messages to a Domain


    The first form of distribution messaging, broadcasting [RFC919, RFC922], uses
    the nature of subnets and network masks to determine the destination. A broadcast
    is a mandatory messaging distribution form; both the subnet and the hosts have
    to receive the message. (In reality, if a host has not enabled broadcasting, the
    hardware does not accept the message. Still, the message does occupy bandwidth,
    and every host can read it.)


    # ### Revisiting IP Structure


    The subnet is very important to sending and receiving broadcast messages. As described
    in *Chapter 2, “TCP/IP Network Language Fluency,”* when you define an interface
    with `ifconfig`, you also define a broadcast address and a netmask. The broadcast
    address is a special address to which the host listens to get messages.


    The subnet is typically the same as the netmask and broadcast address. For example,
    if you have about 250 hosts in your `198.2.56.xxx` subnet, your netmask and broadcast
    would be `255.255.255.0` and `198.2.56.255`. So, if you want to send a message
    to everyone in your subnet, you would use the `198.2.56.255` address. (As noted
    in *Chapter 2*, you can get very creative with the netmasks—just remember that
    the last significant bit is the end of the mask.)


    The subnet is really a wrapper of the hardware implementation. The real work takes
    place in the lower levels of the hardware and the kernel. To understand what is
    happening, you need to start with the physical connection.


    Beyond the physical connection, sending a broadcast message is easier than receiving
    one. To send any message, you only need the IP address (as described in *Chapter
    2*, the network even tually converts that address to the destination’s Ethernet
    MAC address). To get a message, the interface card has to be listening for the
    matching MAC address. The problem is that broadcast messages cannot assume a different
    MAC address from that of the host. In fact, as noted in *Chapter 2*, no two hosts
    in the same subnet are likely to have similar MAC addresses. So broadcasting cannot
    depend on any specialized MAC to conduct broadcast messages.


    Instead, when a program sends a broadcast message, the kernel automatically assigns
    a MAC address of all ones (`FF:FF:FF:FF:FF:FF`). This MAC is a flag to all NICs
    to pick it up—even if no program is listening for a broadcast message.


    The NIC opens the gates and lets the message fill its internal buffers. When complete,
    it notifies the kernel with an interrupt. The kernel retrieves the packet and
    looks at the destination IP. If the address matches the broadcast address, it
    passes the packet up to the network subsystem’s queues.


    The network subsystem (typically UDP) inspects the message and, if it finds a
    broadcast socket with a matching port number, it moves the packet into the socket’s
    I/O channel. If not, it drops the packet. You may want to specify a port number
    to tell the kernel to filter out unwanted messages for you. Otherwise, you can
    cause a storm of unwanted replies.


    # ### Programming to Enable Broadcasting


    You can enable broadcasting using the `SO_BROADCAST` socket option. The rest of
    the program looks like a normal datagram-messaging program.'
  merge: -1
  img_proc: true
