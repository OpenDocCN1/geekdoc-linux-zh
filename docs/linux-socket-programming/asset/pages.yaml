    # ## Some Programs Just Need the Message


    The connectionless protocol simplifies the handshaking. TCP requires a three-way
    handshake: The client sends a connection request, the server accepts the request
    and sends its own connection request, and the client accepts the server''s connection
    request.


    Connectionless UDP effectively has no handshaking; the message itself is the only
    collaboration shared remotely. This means that the protocol does no checking for
    a connection. Eventually, if the peer cannot be found or some transmission error
    occurs, you may get a network error message. However, that message may arrive
    a long time after the network detects the error (one to five minutes).


    UDP''s handshakeless protocol reduces the significant overhead of TCP handshaking.
    To support this, you may see one or two total setup packets. Not bad for high
    speed communications.


    # ## Transaction TCP (T/TCP): A Connectionless TCP


    The TCP three-way handshaking, as compared to the UDP protocol, requires up to
    10 setup packets. This slow startup is very costly when the requestor needs only
    a single transaction. During the startup process, the two ends of the connection
    verify each other''s services and channel reliability. Similarly, the shutdown
    process requires an additional handshake (refer to Chapter 3).


    TCPv3 [RFC1644] adds a new feature that provides some of the connection speed
    of UDP while retaining the reliability of TCP. Transaction TCP (T/TCP) does the
    connection, transmission, and shutdown all in one single `sendto()` system call.
    How does it do this?


    TCP establishes your connections using the three-way handshake, and it closes
    or shuts down the connection using a particular handshake. These steps are necessary
    to ensure that the client and server get all sent data in the proper order. To
    meet that goal, the TCP packet has to use flags to indicate when to establish
    connection (`SYN`), acknowledge data (`ACK`), and close the channel (`FIN`).


    Chapter 3 describes the format of the TCP packet. The packet header includes several
    fields that may appear to be mutually exclusive. For example, it has separate
    flags for `SYN`, `ACK`, and `FIN`. Why do you want to waste the precious space
    of the packet when only one bit of each field is likely to be active at the same
    time?


    T/TCP uses these fields simultaneously. When the T/TCP client connects, it sends
    the message to the server while requesting the connection (`SYN`). It also sets
    the `FIN` flag to close the connection as soon as the server completes the transaction.
    See Figure 4.1.


