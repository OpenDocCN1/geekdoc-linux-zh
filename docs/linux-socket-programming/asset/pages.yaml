    # **wait( ), waitPID( )**


    Wait for and acknowledge the termination of a child process. This is important
    to keep zombie processes from lingering in the process table and to free up valuable
    resources. The `wait( )` call waits for any process to terminate, and the `waitPID(
    )` call permits you to specify a specific process or group. You can use the following
    macros to get the meaning from the status:


    +   * `WIFEXITED(status)` is **non-zero** if the child exited normally.

    * `WXEXITSTATUS(status)` **evaluates to** the least significant eight bits of
    the return code of the child that terminated, which may have been set as the argument
    to a call to `exit( )` or as the argument for a return statement in the main program.
    This macro can only be evaluated if `WIFEXITED` returned **non-zero**.

    * `WIFSIGNALED(status)` **returns true** if the child process exited because of
    a signal that was not caught.

    * `WTERMSIG(status)` **returns** the number of the signal that caused the child
    process to terminate. This macro can only be evaluated if `WIFSIGNALED` returned
    **non-zero**.

    * `WIFSTOPPED(status)` **returns true** if the child process that caused the return
    is currently stopped; this is only possible if the call was done using `WUNTRACED`.

    * `WSTOPSIG(status)` **returns** the number of the signal that caused the child
    to stop. This macro can only be evaluated if `WIFSTOPPED` returned **non-zero**.


    # Prototype


    ```

    ```c

    #include <sys/types.h>

    #include <sys/wait.h>

    PID_t wait(int *status);

    PID_t waitpid(PID_t PID, int *status, int options);

    ```

    ```


    # Return Value


    Both calls return the PID of the child that terminated.


    # Parameters


    | status | Returns the ending status of the child. If not zero or NULL, this parameter
    picks up the child''s termination code and exit( ) value. |

    | PID | Indicates which process to wait for: |

    |  | < -1 Wait for any child process whose process group ID is equal to the absolute
    value of PID. |'
