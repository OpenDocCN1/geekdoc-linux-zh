- pgno: 171
  md: 'The tools that the Sockets API offers increase control of your program. You
    might use many of them in a single program so that you can predict the reliability
    of your program. Reliability in a network program is very elusive and requires
    several tricks, tips, and hints. The next chapter takes you to another level of
    reliability.


    # Chapter 10. Designing Robust Linux Sockets


    # IN THIS CHAPTER


    +   - Using Conversion Tools

    - Eyeing Return Values

    - Capturing Signals

    - Resource Management

    - Critical Servers

    - Client/Server Concurrency Issues

    - Denial of Service Attacks

    - Summary: Solid-as-a-Rock Servers


    So, you want to write commercial-grade clients and servers. That’s a good goal—even
    if you might donate the work to Open Source. No one likes to be criticized for
    his code. So how do you make good code great? Good question.


    You could consider what you’re trying to accomplish. If you are writing for a
    specific type of user, do you have one in mind? Can you work with him and get
    ideas about the possibilities? How reliable do the clients and servers need it
    to be?


    Writing robust network programs is similar to regular programming, but you have
    to look at the big picture first; your program always runs at the same time as
    any connected program. That opens the picture quite wider. You have to consider
    more than just making the source readable.


    This chapter provides several gems of advice on how to deal with these issues.
    It cannot be comprehensive; entire books are available just on writing solid code.
    But it can help you avoid the more typical network programming obstacles.


    # Using Conversion Tools


    The first step in creating good, robust socket programs is to use the Socket API’s
    conversion tools. You have a wealth of tools that convert the addresses, names,
    and binary numbers back and forth. This is important if you want to ensure portability,
    testability, and longevity of your code.


    As described in [Chapter 2, "TCP/IP Network Language Fluency."](Chapter_2_TCP_IP_Network_Language_Fluency)
    the network uses the big endian binary storage format. You may have an alpha or
    68040, which are themselves big endian as well. But, you probably want everyone
    in the Linux community to use your creative work. These tools automatically make
    the binary of the structures right. If you are on a big endian computer, you lose
    nothing—the libraries automatically map all conversion calls to do nothing, so
    your program does not spin its wheels in a useless call.


    Thousands of programmers have tested all the libraries on your Linux machine.
    Some of these tests may admittedly be ad hoc. However, the GNU organization is
    very serious about the reliability of their packaged libraries. The thoroughness
    and almost nit-pickiness of these test procedures have made the libraries Linux
    uses solid. This foundation gives your program strength as well.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Some programmers like to reinvent the library with their own twists on interfaces
    or behavior. If you follow this approach without trying to use the standardized
    tools, you can spend more time inventing than developing. And, the result is larger,
    more complex, and harder to test. If, however, you find the libraries lack a needed
    function, try to follow the style and philosophy of the UNIX library calls. The
    following are some examples:


    +   * Return `0` if the call completes without error.

    * Return a negative value if the call is unsuccessful and submit error to `errno`.

    * Use the standard error numbers.

    * Pass structures as references.

    * Try to define low-level calls and build high-level calls on top of them.

    * Define all read-only pointer parameters as `const`.

    * Struct definitions are preferred over typedefs.

    * Lowercase variable and function names are preferred over uppercase. Constants
    are in all capitals.

    * Use `syslog` to log events, errors, and any unusual activity.


    These are just a few. The best solution is to find existing functions and mimic
    their interface style.


    Writing your program in a familiar and readable way makes it easy for others to
    use it, revise it, and enhance it. Consider this: Linus Torvalds himself declared
    that he does not plan on owning the kernel forever. Using standard tools and practices
    lengthens its life span.


    # Eyeing Return Values


    As you work with the Socket API calls, you need to look at their behavior and
    results. Network programming is unlike most other types of programming. Errors
    can happen at any time in your program, and sometimes the error arises irrespective
    of the current execution.


    First you might want to check all return values. Some calls are very important,
    and some are crucial. Generally, conversion calls don’t return an error or a very
    critical one. The following are some critical calls:


    +   * `bind()`: When you need a specific port, you must reserve it. If you cannot,
    you need to know as early as possible in the program. Errors you are likely to
    see are port conflicts (already in use) or something wrong with the socket.

    * `connect()`: You cannot proceed unless you have an established connection. You
    may see errors like `host not found` or `host unreachable`.

    * `accept()`: Your program can’t begin communicating with the client unless the
    result of this call is greater than zero. (Yes, it’s possible to have a zero for
    a legal socket descriptor, but that is an unusual program.) Often the error you
    may see is `EINTR` (call interrupted by signal). This is okay. Either program
    the `sigaction()` call to include `SA_RESTART` in the flags or ignore the error
    and manually restart the call.

    * All I/O (`recv()`, `send()`, and so on): These calls determine whether you successfully
    sent your message or the new message is real. You may return with a connection
    closed error or a call interrupted (as discussed earlier). If you use the higher
    level functions, such as `fprintf()`, you should use calls that return some kind
    of success or failure, and you should check that. You could lose the connection
    at any time, resulting in a `SIGPIPE` signal killing your program.

    * `gethostbyname()`: If you get any error from this call, the value returned is
    zero (or `NULL`).


    So, if you de-reference the returned pointer when you get an error, your program
    aborts with a segmentation fault.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "+   * ``fork()`` The return value indicates whether you're in the child or\
    \ in the parent. And, you might want to separate the child from the parent's execution\
    \ path. Also, you can check for any errors. If the return value is negative, you\
    \ have not created the child, and you may have more systemic problems.\n* ``pthread_create()``\
    \ Like the ``fork()`` call, you might want to verify that the call succeeded in\
    \ creating the new child.\n* ``setsockopt() / getsockopt()`` The sockets have\
    \ many options you can work with to tune the behavior. Generally, you may want\
    \ to know if the call was successful so that you can proceed on that assumption.\n\
    \nAll these calls share one common fate if they fail—your program may terminate\
    \ or behave unpredictably. This is a good rule of thumb: If the call seriously\
    \ impairs the reliability of your program, always check the return value. If any\
    \ problem is evident, report it to the console. This alerts the user early of\
    \ any problems.\n\nThe following are less important calls, a few that you could\
    \ get away with ignoring the return value:\n\n+   * ``socket()`` The only time\
    \ you fail this call is if you request a socket you can't have (permission or\
    \ lack of kernel support), if you have a bad parameter, or you have a full descriptor\
    \ table. In call cases, the ``bind(), connect(),`` or I/O call acts as backup\
    \ to catch the fault with a \"not a socket\" error.\n* ``listen()`` You are unlikely\
    \ to get an error from this call if ``bind()`` previously succeeded. It does have\
    \ a limit to the depth of the listening queue. If you use 15–20 entries, your\
    \ program can work well even with a large connection rate.\n* ``close()`` or ``shutdown()``\
    \ If the file descriptor is bad, the file is gone anyway. In either case (success\
    \ or failure), the file is gone, and your program can move on. (You may want to\
    \ check the location in your program that calls this if you suddenly start running\
    \ out of file descriptors.)\n\nAPI calls that are not as critical often have other\
    \ important calls that can pick up the slack following right behind them. Also,\
    \ if they fail, they may not cause any catastrophic failures. This is not a license\
    \ to ignore the return values of these calls; in all circumstances, checking verifies\
    \ success and thus increases your program's reliability.\n\nYou can use other\
    \ measures to capture errors that occur while you may not be in a system or library\
    \ call. These errors happen because of the dynamics of the network and the possibility\
    \ that the server or client could go silent. The networking subsystem keeps track\
    \ of some of these errors in the TCP protocols, because TCP constantly ensures\
    \ that the channel is clear for bi-directional communications.\n\nIf your program\
    \ does not send a message for a while, you need to check on the connection manually.\
    \ If you do not, the error eventually appears as an I/O fault. To access this\
    \ information, you can use the ``getsockopt()`` system call with ``SO_ERROR``\
    \ option:\n\n```\n```\nint error;\nsocklen_t size=sizeof(error);\nif ( getsockopt(sockfd,\
    \ SOL_SOCKET, SO_ERROR, &error, &size) == 0 )\n    if ( error != 0 )\n       \
    \ fprintf(stderr, \"socket error: %s(%d)\\n\", strerror(error), error);\n```\n\
    ```"
