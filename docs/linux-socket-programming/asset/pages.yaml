    Network perpetrators use a degenerate form of network deadlock or starvation.
    You need to know about this, even though it''s one of the older network attacks.
    As described in previous sections, the network subsystem accepts a connection
    request from a client on a specific port. This port represents a server and the
    port has a listening queue.


