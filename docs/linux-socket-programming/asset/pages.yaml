- pgno: 259
  md: '+   - **Minimize services (exposed servers)**— Servers closest to the Internet
    offer only the absolute minimum services. Typically, those services are closely
    linked to the ports the firewall passively filters. Some include HTTP, HTTPS,
    and FTP (read-only).


    +   - **Limit databases (inner DMZs)**— Databases often house the company''s most
    valuable information. No private database should be in any of the DMZs. Some systems
    often place the LDAP in one of the inner DMZs (instead of the intranet), but that
    practise is a security hazard as well because the database often contains unencrypted
    usernames and passwords. If servers in the DMZs need database access, you can
    easily create point-to-point messengers that hand carry requests back to the intranet.
    These messengers should be compiled programs to reduce cracking.


    +   - **Use compiled services (exposed servers)**— Scripts like Perl, while easier
    to program in than C/C++, are in human-readable form that make them a security
    risk. As often as possible, try to produce tools that prevent the perpetrator
    from changing the behavior of your server if an intrusion occurs.


    +   - **Separate masquerading**— Each DMZ can use a separate fake IP space with
    masquerading. Changing the addressing from one DMZ to another makes penetration
    into the intranet more difficult and complicates network maintenance.


    The comparison with castles and walled cities of long ago is very appropriate
    to the Internet''s current state. The Internet has no rules and often runs about
    in a state of anarchy. Establishing the needed security measures can protect you
    and your real customers.


    # Securing the Channel


    The network has two distinct elements that you can tune to your needs: the physical
    network and the message. Protecting both against attack is important.


    # Physical Espionage


    An obvious physical measure is a dedicated connection. Unfortunately, this is
    not as secure as once thought. The technology for non-intrusive snooping even
    in dedicated connections is simple. Nevertheless, it is a very good start. The
    physical medium offers several ways to hide (or expose) your data. The more esoteric
    the connection, the higher the cost. This section describes the four basic physical
    transmission forms: electrical/optical and conductor/conductorless.


    Conductor-based, electrical conduits (such as twisted pair or coax) are, perhaps,
    the easiest to tap. The flexible wires are very forgiving of a surgical probe
    into the primary conductor. Also, the properties of electromagnetism permit someone
    to snoop undetected. Inflexible conduit is more secure and has less loss, but
    it is expensive and hard to work with.


    Conductorless electrical (such as radio or microwave) and optical transmissions
    (such as infrared or directed laser) are really the easiest form to tap. You simply
    need an antenna in the field or in the path of transmission. Microwave is a directed
    transmission similar to laser. Lower frequencies and infrared, on the other hand,
    tend toward broadcast. These forms cannot be physically protected and have little
    security.


    Optical conduits are the most secure. However, a few years ago, researchers found
    that if they bent the flexible conduit just the right amount (the critical angle),
    the light signal would leak out. They used this to prove that even fiber optic
    was not impervious to snooping. At the time, they still could not introduce a
    signal. If the research teams have not found a way to introduce an optical signal,
    they may very soon. Again, to solve this problem, you can get fiber conduits that
    are more rigid and do not allow the fiber to be bent near the critical angle.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'To summarize, a rigid conducted conduit reduces the possibility of tapping.
    Optical has the added security of being impervious to electromagnetic snooping.
    Optical, additionally, has proven to carry very high bandwidths.


    # Message Espionage


    Protecting the message is less obvious. The firewalls pass through and filter
    information exposed to the Internet. They use specific ports and services that
    the client expects. Changing some of the expected settings and interfaces can
    increase your security.


    While not encouraged in the Open Source movement, using privatized protocols can
    discourage intrusion (on the other hand, it can also increase attention). For
    example, instead of using HTTP as the protocol, invent a new and specialized version.
    This approach does have significant drawbacks: You must write the client interface
    and get that to your customers.


    Another method is to limit windows of availability and information sent. For example,
    during World War II, the Allies used Native Americans to chat with each other
    over the airwaves for hours on end in their own language. At specified intervals,
    the message would shift to a tactical or strategic instruction or status.


    Using that example, you could write a financial transfer mechanism that would
    fire up at specific intervals or even have it open all the time with irrelevant
    information during off hours.


    Increasing randomness is the key to message security. For example, suppose you
    have an ATM (Automatic Teller Machine) that is connected to the Internet (scary
    thought!). It needs to send and receive transaction requests to the host server.
    One way it could use randomness is by continuously sending and receiving fake
    transactions. Then, at specified intervals, both the host and the ATM would recognize
    that a transaction is real. (Of course, this is still too loose for actual implementation.)


    Another form of randomness is data encryption. Good data security depends strongly
    on the amount of randomness data encryption introduces. The more random the data
    is, the more difficult to decrypt the data. The key sets the range of possible
    outcomes. The perfect encryption key has no limit in size. Unfortunately, as the
    key increases in size, the computation time increases exponentially. So, a good
    key is one that is long enough to reduce the likelihood of discovery computationally.
    This is why everyone wants 128-bit encryption.


    # NOTE


    # Encryption Through Firewall Filters


    You cannot join some technologies together to make a stronger defense against
    attack. For example, encryption defeats a firewall''s active filtering. Again,
    active filtering looks into the packet for anything that might be suspicious.
    Unfortunately, if contents are encrypted, only the client and server know the
    contents (hopefully). If you have filtering enabled, you may only be able to expect
    passive filtering to work with encrypted messages.


    128-bit encryption has a wide enough range that if a computer were to try each
    key in succession every nanosecond (1'' 10-9 seconds), it would require over 1020
    years to find the key. That''s a long time. In terms of randomness, 128-bit encryption
    appears to be a large enough range to approximate the perfect key—at least for
    now.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Encryption has two forms: one-way (lossy) and two-way (lossless). A one-way
    encryption loses information about the original data. The typical encryption used
    in UNIX passwords is one-way. One-way encryption does not have to recover any
    data; for example, the password that a user types in only has to match the encrypted
    form.


    Requests sent to a server require a way to get the data back. Two-way encryption
    scrambles the data in such a way that the information is retrievable with a decryption
    key. The server and the client must know both the encryption algorithm and the
    encryption/decryption keys.


    # Encrypting the Messages


    Encryption is far from new. The most famous encryption device was the German Enigma
    Machine. In fact, some of the current algorithms are based on this WWII device.
    The whole idea of encryption is to make sure that only the recipient understands
    the message. Modern encryption algorithms (*ciphers*) are as common as the computer.


    When two hosts communicate with each other, the designers assume that other hosts
    can snoop the messages. A network snooping device can open and examine every protocol
    this book has defined. Of course, the snooper must be physically on the same network
    to get any message. Likewise, the snooper has to wade through a lot of fluff to
    get to the really juicy messages.


    This section describes the different parts of encryption and introduces a common
    negotiation used in computers.


    # What Are the Available Encryption Types?


    Networked computers use two different ciphers: public-key and symmetric-key. The
    public-key cipher uses two keys—one for encryption and one for decryption. A server
    often uses this algorithm to start the encryption process or to do single transactions.


    The symmetric-key cipher uses the same key to encrypt as decrypt. The decryption
    simply undoes what the encryption does (somewhat like unwinding a tightened spring).
    Because of the nature of the symmetric-key cipher, the two hosts must keep the
    key secret. The algorithms are very fast and relatively simple. Likewise, you
    can use any random number for the key.


    The public-key ciphers, on the other hand, have two keys—an encryption (public)
    key and a decryption (private) key. The servers share the encryption key with
    any client on the network. (The key is not itself critical—only the data that
    the algorithm translates is critical.) The server internally retains the decryption
    key for decrypting the incoming message.


    Public-key ciphers have a few limitations. First, the keys must be related. The
    host cannot randomly generate the encryption key without calculating the decryption
    key as well. This significantly restricts the number of available keys. Because
    the number must be related to encrypt and then decrypt, you can only have a few
    key pairs available compared to the complete set of integers. For example, within
    a 128-bit key, you can only have $2^{32}$ possible key pairs. Second, because
    you only have a limited number of key pairs (not the whole range of numbers),
    these ciphers are less secure than the private key. For example, a 128-bit public
    cipher can be only as strong as a 64- or 32-bit symmetric cipher.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Published Encryption Algorithms


    The Internet offers many different public and symmetric cipher suites (sets of
    different ciphers). The most common are based on the RSA (names of the authors,
    Rivest, Shamir, and Adleman) public-key, DES (Data Encryption Standard), and RC2/RC4
    (Rivest Ciphers). Some ciphers are still patented and require royalties to use
    (in October 2000, RSA''s patent ran out).


    Most Linux distributions either include the suites with the installation or link
    you to a site to download them.


    # Problems with Encryption


    Ciphers present an interesting set of problems. First, and until recently, the
    United States limited the export of strong encryption algorithms. In fact, that
    is one reason some distributions would not place the cipher suites on their CD-ROMs.
    Instead, the install process would try to grab the suite from a foreign country
    server. In 2000, the government lifted this restriction, and it is a little easier
    to get the ciphers.


    Another problem is computational time. While the symmetric ciphers are relatively
    quick, all initial communications must use the slower public-key. Public-key is
    not very good for large blocks of data. So the added complexity of negotiating
    the ciphers and the keys has to be part of the protocols.


    The last problem is rather strange. Encryption actually invites the very thing
    that it intends to avoid—cracking and snooping. Apparently, the Internet has a
    sector of crackers that want to appear on the headline news.


    # Secure Sockets Layer (SSL)


    As noted earlier, two hosts must agree on a set of ciphers to communicate with
    some security. The Secure Sockets Layer (SSL) defines this protocol. It is a process
    carefully designed to severely limit the potential of cracking. SSL uses both
    public and symmetric ciphers to establish connections, negotiate protocols, and
    communicate data.


    The scope of this section cannot include the details of how SSL negotiates the
    keys and communication channel. Instead, this section shows you how to write an
    SSL client and server using the OpenSSL API. Again, this chapter cannot cover
    the entire API—that information could easily fill another book.


    # Using OpenSSL


    You can get a functional, although not well-documented, SSL API called OpenSSL.
    It is available at http://www.openssl.org and supports several platforms, including
    Linux, of course. To use the API, you need to follow a few steps to configure,
    compile, and install it.


    It is not compiled out-of-the-box, and some of the installation steps do not integrate
    well with Mandrake or Red Hat Linux. (Other distributions may have similar problems,
    so you may want to take note.) The following steps will help you get the tool
    installed and usable:


    +   1. Download the tarball, open it in a secure (non-root) directory, and go
    into the newly created directory.'
  merge: -1
  img_proc: true
