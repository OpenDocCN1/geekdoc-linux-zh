    The `-t` option suppresses


    Tcpdump does have a few anomalies; for example, it does not pick up messages to
    itself. It does not see the packets from `ping` 127.0.0.1, because the network
    subsystem does not send those messages down to the lower protocol layers where
    tcpdump hooks in.


    # ## Writing a Custom Network Snooper


    How does tcpdump work? You can read the lengthy Open Source program, or you write
    your own network snooper (a tcpdump, of sorts). The only thing you need to know
    is how to capture any and all messages for a host. The tool that this section
    describes helps you write a network snooper that disassembles packets intended
    for the host. It does not support promiscuous mode, however.


    For security (like tcpdump), you need to be **root** to run a network snooper.
    The snooper captures all messages destined for your computer. To get all messages,
    you use the following calls:


    ```

    ```

    sd = socket(PF_INET, SOCK_PACKET, filter);

    bytes_read = recvfrom(sd, buffer, sizeof(buffer), 0, 0, 0);

    ```

    ```


    Notice the new socket type: `SOCK_PACKET`. This is a read-only hardware-level
    socket.


    You can use several filters for `SOCK_PACKET`. The filters tell the IP layer what
    kinds of packet you want to capture. A few of these filters are


    ```markdown

    | *ETH_P_802_3 | 802.3 frames  |

    | *ETH_P_AX25 | AX.25 frames    |

    | *ETH_P_ALL | All frames (be careful) |

    | *ETH_P_802_2 | 802.2 frames    |

    ```


    The filter to use is `ETH_P_ALL`. As the note indicates, be careful with this
    filter, because when you select it, it gives you everything. The resulting call
    is


    ```

    ```

    sd = socket(PF_INET, SOCK_PACKET, ETH_P_ALL);

    ```

    ```'
