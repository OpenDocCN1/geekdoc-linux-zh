  md: '# NOTE


    # Adapting the Hierarchy for Raw Sockets


    You could revise the hierarchy so that `Socket`, by itself, creates a raw or promiscuous
    socket.

    However, you can run into problems. First, the function of these low-level sockets
    are closer to UDP than TCP. You would have to *turn off* functionality for the
    `SocketClient` and `SocketServer` classes. That''s ugly. Or, you could abstract
    that functionality more, adding a new layer to the UDP half of the hierarchy.
    Either way, the component becomes more complicated. This is a real, persistent
    problem in writing frameworks; the more features you add, the more complicated
    it becomes and the less easy it is to use.


    The `SocketClient` and `SocketServer` remain different enough that joining them
    directly to `Socket` does not provide the TCP commonality. Additionally, they
    have more functional differences that keep them from being directly related.


    You can resolve the close relationship between `SocketClient` and `SocketServer`
    with an intermediate class (`SocketStream`) that defines the features of a TCP
    socket without losing the identity of the superclass. Figure 13.4 shows the completed
    diagram.


    Figure 13.4. The completed Socket class hierarchy includes two virtual classes:
    Socket and SocketStream.


    ![](img/03334662da8fdfb8d95a02f270c522f6_218_0.png)


    The two classes, `Datagram` and `SocketStream`, provide the configuration and
    features their protocols require. Separating the protocols like this makes it
    easy and clean to add other protocols, such as `SOCK_RAW`, or even new protocols,
    such as RDM (reliably delivered messages).


    # Defining Each Class''s Capabilities


    The last step in the design differs from the standard OOA/D iterative processing.
    The main reason is that OOA/D focuses primarily on projects, not libraries. Looking
    at a library, you cannot precisely know what the user wants or needs. Often, the
    designer must consider the question, "What could the library be used for?"


    # NOTE


    # The Project-Yields-the-Library Fallacy


    Many programmers and designers consider the project to be the ultimate source
    for designing a library. Their logic has merit: Write the tools as we write the
    project. However, this logic has two'
