- pgno: 52
  md: 'UDP creates a virtual network receptacle for each message in the form of ports.
    With the port, IP can rapidly shufle the messages to the correct owner. Even if
    you don''t define a port with bind(), the IP subsystem creates a temporary one
    for you from the ephemeral port list (see Chapter 2).


    # Transmission Control Protocol (TCP)


    Transmission Control Protocol (TCP) is the most common socket protocol used on
    the Internet. It can use read() and write() and requires re-creating a socket
    for each connection. TCP''s attributes are listed in Table 3.6.


    Table 3.6, TCP Attributes

    | Message Size (bytes) | (unlimited) |

    | Overhead (bytes) | 40~120 |

    | Reliability | High (data receipt checked) |

    | Message Type | Stream |

    | Throughput | Low (compared to other protcols) |

    | Data Integrity | High (includes checksums) |

    | Fragmentation | Unlikely |


    Taking reliability one step further requires ensuring that the destination gets
    the exact message the originator sent. UDP has the speed but does not have the
    reliability that many programs require. TCP solves the reliability problem.


    The network, however, has several fundamental problems that make it unreliable.
    These problems are not limitations. Instead, they are inherent in the design of
    the network. To get reliable, streamable messages through the tangled Web, TCP/IP
    has to incorporate many of the ideas to improve reliability suggested in the section
    on UDP. The Internet has three hurdles: dynamic connections, data loss, and constricted
    paths, as discussed in the following sections.


    # Dynamic Connections


    One host sends a message to another host. That message travels the networks, going
    through various routers and gateways. Each message sent may use a different path.
    Networking segments (connections between computers) often appear and disappear
    as servers come up and go down. The power of the Internet is its capability to
    adapt to these changes and route the information accordingly.


    Adaptability is one of the driving forces behind the Internet. Your computer can
    make a request, and the network tries possible avenues to fill the order. Unfortunately,
    this advantage means that the path between your computer and the server or peer
    can change, lengthening and shortening the distance.


    As the path lengthens, propagation times increase. This means that your program
    could send successive messages and many would arrive at different times, often
    out of order.


    TCP ensures that the destination has correctly received the last message before
    it sends the next message. Compare this to a series of numbered messages (this
    is really how TCP works). Your program may send 10 messages in succession. TCP
    takes each message, attaches a unique number, and sends it off. The destination
    accepts the message and replies with an acknowledgment. Upon receiving the acknowledgment,
    TCP lets your program send the next message.


    # NOTE'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Sliding Window Protocol


    TCP uses a better technique than the send/wait (or ACK/NACK) protocol, which is
    too slow for anyone’s patience. Instead, it uses a sliding window: It gauges when
    and how often to reply with an ACK. Slower or dirtier connections may increase
    the acknowledge messages. Connections that are faster and lose less allow more
    messages to ship before expecting acknowledgments. This is part of the Nagle Algorithm.
    You can disable this using socket options (see **Chapter 9**).


    # Data Loss


    When the destination gets your message, it determines the integrity of the data.
    The data may travel along less-than-optimal communication paths that may drop
    or corrupt message bits. Remember that the network sends every message one bit
    at a time. TCP sends with the message a checksum to verify the data. TCP is the
    last layer that can detect and remedy corrupted data.


    If the destination detects any errors, it sends back an error, requesting a retransmittal
    from your program. Likewise, if your computer does not get an acknowledgment within
    a specific amount of time, the TCP subsystem automatically resends the message
    without your program’s intervention.


    # Constricted Paths


    Going back to the single message sent to a particular host, suppose that the message
    is too long for the intervening segments. The problem that the packet encounters
    as it passes through the network is the different technologies and transmission
    carriers. Some networked computers permit lengthy packets; others place limits
    on the size.


    UDP tries to send the largest message that it can. This can be a problem with
    the constricted data paths. The IP algorithms anticipate that the routers may
    fragment data. Likewise, IP expects that it has to reassemble the incoming message.


    TCP, on the other hand, limits every packet to small chunks. TCP breaks up longer
    messages, before the network has the chance to touch them. The size TCP chooses
    is one that a majority of networks can accept intact. By default, TCP uses 536
    bytes and typically negotiates up to 1,500. To increase that size manually, set
    the **MSS** (maximum segment size) TCP socket option (see **Chapter 9**).


    The receiver may find that the message’s packets are out of order. TCP reorders
    them before handing the message to your program.


    Solving all these network problems adds protocol and header overhead to TCP’s
    algorithm. Of course, the added overhead of all TCP’s techniques slows performance
    noticeably.


    # The TCP Header Definition


    TCP had to add a lot of information to its header to support all the features
    that it offers you. The size, in bytes, of the TCP header is about three times
    that of the UDP header. See **Listing 3.4** for a definition of the structure.


    # Example 3.4. TCP Structure Definition


    ```

    ```c

    /***************************************************************************/

    /* **  TCP (streaming socket)  structure definition ** */

    /* **  (Formal definition in netinet/tcp.h) ** */

    ```

    ```'
