    # Expanding the Programming Challenge


    Most programming targets immediate functions or tasks on your desktop or laptop.
    These tasks rarely communicate with more than just the mouse, keyboard, display,
    and file system. A greater programming challenge involves several programs on
    different computers connected through a network channel. Network programming expands
    the challenge, because you have to coordinate tasks and send assignments.


    The fundamental unit of all network programming in Linux (and most other operating
    systems) is the socket. In the same way that file I/O connects you to the file
    system, the socket connects you to the network. The socket is a junction that
    your program uses to address, send, and receive messages.


    Network or socket programming is more challenging than single-task or even multitask
    programming because true multiprocessing introduces more power and issues. The
    power is obvious: Parallel Virtual Machines (PVMs) like Beowolf can do much more
    processing by organizing blocks of tasks and distributing them to networked computers.
    The issues arise through getting the best throughput, coordinating transfers,
    and managing I/O.


    This book describes and offers several solutions to these issues. It is geared
    to meet the immediate and long-term needs of the professional network programmer.


    # Book Organization


    This book delves into many particulars of network programming. It is organized
    into five specific parts, each part building upon earlier parts:


    +   - Part I: Network Programming from the Client Perspective'
  merge: -1
