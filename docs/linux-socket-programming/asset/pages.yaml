- pgno: 15
  md: '# Colon Versus Period Ports


    The colon notation is more common for ports than the period notation.


    Each IP address effectively offers about 65,000 port numbers that a socket may
    connect to. See [Chapter 2](#) for more information.


    # Hearing the Server: The Client’s Basic Algorithm


    The simplest client-socket connection is one that opens a connection to a server,
    sends a request, and accepts the response. Some of the standard services don’t
    even expect any prompting. One example is the time-of-day service found on port
    13. Unfortunately, many Linux distributions do not have that service open without
    revising the `etc/inetd.conf` file. If you have access to a BSD, HP-UX, or Solaris
    machine, you can try that port.


    There are several services available to play with safely. You may try running
    Telnet on your machine to connect to the FTP port (21):


    ```

    ```

    % telnet 127.0.0.1 21

    ```

    ```


    After connecting, the program gets the welcome message from the server. Using
    Telnet to connect with the FTP server does not work very well, but you can see
    the basic interaction. The simple client example in [Listing 1.1](#) connects
    to the server, reads the welcome, and then disconnects.


    # Example 1.1. A Basic TCP Client Algorithm


    ```

    ```

    /****** A basic client algorithm. ******/

    Create a socket

    Create a destination address for server

    Connect to server

    Read & display any messages

    Close connection.

    ```

    ```


    The algorithm in [Listing 1.1](#) may seem overly simplified, and perhaps it is.
    However, connecting to and communicating with a server is really that simple.
    The following sections describe each of these steps. You can find the complete
    source for this program at the end of the book and on the accompanying CD-ROM.


    # The Socket System Call: Procedures and Caveats


    The single tool that creates your effective message receiver and starts the whole
    process of sending and receiving messages from other computers is the `socket()`
    system call. This call is the common interface between all protocols available
    on a Linux/UNIX operating system. Just like the system call `open()` creates a
    file descriptor to access files and devices on your system, `socket()` creates
    a descriptor to access computers on your network. It requires information that
    determines what layers you want to access. The syntax is as follows:


    ```

    ```

    #include <sys/socket.h>

    #include <resolv.h>

    ```

    ```'
