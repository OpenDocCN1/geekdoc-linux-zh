    \ to default ---\\*/\n bzero(&act, sizeof(act));\n act.sa_handler = sig_alarm;\n\
    \ act.sa_flags = SA_ONESHOT;\n /\\*--- Set the signal handler ---\\*/\n if ( sigaction(SIGALRM,\
    \ &act, 0) != 0 )\n       perror(\"Could not set up timeout\");\n else\n   /\\\
    *--- If signal handler installed, set timer ---\\*/\n   alarm(TIMEOUT_SEC);\n\
    \ /\\*--- Call the I/O that might timeout ---\\*/\n if ( recv(sd, buffer, sizeof(buffer),\
    \ 0) < 0 )\n   {\n       if ( errno == EINTR )\n           perror(\"Timed-out!\"\
    );\n   }\n}\n```\n\nThe example shown sets up the signal handler, sets the timer,\
    \ and calls the I/O. If recv() gets no data by the time the timer expires, the\
    \ task gets a signal. The signal interrupts the recv() system call, and the system\
    \ call returns with an error (EINTR).\n\nTo get this behavior, leave off the SA_RESTART\
    \ option from the sa_flags field. Chapter 7 advises you to include this option\
    \ with signals. In that case, omit this option for the timeout timer to work.\n\
    \nOne final note: Avoid using the alarm() system call with sleep(), because it\
    \ can cause problems in your program. Instead, use the Linux SIGALRM signal or\
    \ use sleep() – don’t mix them.\n\n# Summary: Choosing the I/O Techniques\n\n\
    The network program interacts with other programs through the network. Since the\
    \ performance and response times vary from machine to machine and network to network,\
    \ it’s important to know when and how to use nonblocking I/O to improve the I/O\
    \ management in your clients and servers.\n\nUsed carefully and properly balanced,\
    \ blocking and nonblocking I/O increases your client’s and server’s responsiveness\
    \ to the user.\n\nThis chapter covered several topics on blocking (what it is,\
    \ when it’s useful, why it’s used) and nonblocking (what are the different types,\
    \ when to use them, how to use them). It discussed the main tool to select nonblocking\
    \ I/O: the fcntl() system call.\n\nThe two primary nonblocking tools are polling\
    \ and asynchronous I/O. Polling repeatedly tries to use an I/O system call. Asynchronous\
    \ (or signal-driven) I/O places the burden on the kernel to determine when a channel\
    \ is free. Polling focuses on the I/O, while signal-driven I/O focuses on local\
    \ processing.\n\nAnother tool to manage blocking is a timeout. You can deploy\
    \ timeouts in the select() or poll() system call or use a timer signal that wakes\
    \ up the process when a call takes too long."
