    \ own routine (fn) with configuration (arg) and behavior (attr). If you set the\
    \ attributes to NULL, you can still change the thread's behavior for later. Keep\
    \ in mind that until you change the attributes, the thread behaves in the default\
    \ manner.\n\nEssentially, the call reduces to two specific parameters. You can\
    \ compare the basic algorithms for processes and threads in the following code.\
