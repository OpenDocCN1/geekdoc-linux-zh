- pgno: 282
  md: "For the algorithm to work correctly, the program has to change some of the\
    \ socket's default settings. First, most ping programs set the *TTL* (time to\
    \ live) to the highest hop value (255). Also, the sender's socket must have nonblocking\
    \ enabled to call *recvfrom*() without stalling.\n\nThe MyPing program is a good\
    \ starting point for most ICMP-style packet messaging. After you are comfortable\
    \ with this algorithm, other raw socket programs are similar to datagram programming.\n\
    \n# ## How Does Traceroute Work?\n\nAnother type of ICMP-style raw socket program\
    \ is traceroute. You probably have used trace route for figuring out the path\
    \ of a host-visitor or a spam message. The program builds on top of the MyPing\
    \ program because it uses ICMP messages.\n\nThe basic algorithm is to send a ping\
    \ message to the destination with an insufficient TTL. The intercepting router\
    \ expires the packet and spits back an error. Repeat with a larger TTL until the\
    \ message arrives at the destination. The result is actually pretty clever: The\
    \ router between the source and the destination discovers that the TTL has expired,\
    \ so it sends back an error (ICMP message) to the source. The router places its\
    \ address in the error message. Only a raw ICMP socket works here because you\
    \ may not get the error messages from the routers.\n\nThe loop is similar to the\
    \ MyPing's sender process. The program needs a little extra logic to interpret\
    \ the replies:\n\n```\n```C\nTTL = 0;\ndo\n{\n  int len=sizof(r_addr);\n  struct\
    \ iphdr *ip;\n\n  TTL++;\n  if ( setsockopt(sd, SOL_IP, IP_TTL, &TTL,\n      \
    \            sizeof(TTL)) != 0) \n    perror(\"Set TTL option\");\n  /****Initialize\
    \ the message (see MyPing's sender)****/\n\n  if ( sendto(sd, &pkt, sizeof(pkt),\
    \ 0, addr, \n              sizeof(*addr)) <= 0) \n    perror(\"sendto\");\n  if\
    \ ( recvfrom(sd, buf, sizeof(buf), 0,\n                &r_addr, &len) > 0 ) \n\
    \  {\n    struct hostent *hname;\n    ip = (void*)buf;\n    printf(\"Host #%d:\
    \ %s \\n\", cnt-l, /* Print router IP */\n           inet_ntoa(ip->saddr));\n\
    \    hname = gethostbyaddr(\n          (void*)&r_addr, sizeof(r_addr),\n     \
    \     r_addr.sin_family);   /* Try getting name */\n    if ( hname != NULL )\n\
    \      printf(\"(%s)\\n\", hname->h_name);\n    else \n      perror(\"Name\");\n\
    \  } \n  else \n    perror(\"recvfrom\");\n}\n/*----Repeat until the destination\
    \ is the same as the reply---*/\nwhile ( r_addr.sin_addr.s_addr != addr->sin_addr.s_addr\
    \ );\n```\n```"
  merge: -1
