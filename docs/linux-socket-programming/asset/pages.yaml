    \ 0)) < 0 )\n    perror(\"sendmsg\");\n```\n```\n\n# #### sendfile()\n\nA fast\
    \ way to transmit a file through a socket. The call reads the data from in_fd\
    \ and writes it out to out_fd. The call does not change the file pointer in in_fd,\
    \ but out_fd's file pointer is changed. The call begins reading from *offset for\
    \ count bytes. When done, *offset points to the byte after the last byte read.\
    \ If you need to add header information, refer to the TCP_CORK option in TCP(4)\
    \ to improve performance.\n\n# #### Prototype\n\n```\n```c\n#include <unistd>\n\
    int sendfile(int out_fd, int in_fd, off_t *offset,\n    size_t count);\n```\n\
    ```\n\n# #### Return Value\n\nIf successful, the call returns the total number\
    \ of bytes copied. If error, the call returns -1 and sets errno to the error code.\n\
    \n# #### Parameters\n\n| out_fd | The destination descriptor (file pointer modified)\
    \ |\n| :--- | :--- |\n| in_fd | The source descriptor (file pointer not modified)\
    \ |\n| offset | A pointer to a variable that holds the starting offset |"
