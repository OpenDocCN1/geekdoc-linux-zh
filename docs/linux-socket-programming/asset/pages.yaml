- pgno: 287
  md: "# ## Converting IPv4 Calls to IPv6\n\nWith a computer properly set up for supporting\
    \ IPv6, you can write a few programs. You only need to change a few parameters\
    \ to make the conversion. Essentially, everything continues to work as you might\
    \ expect, if you have followed the formula rules defined in the first chapters.\n\
    \nThe first change is the socket structure. Instead of using `sockaddr_in`, you\
    \ use `sockaddr_in6`:\n\n```\n```\nstruct sockaddr_in6 addr;\nbzero(&addr, sizeof(addr));\n\
    ```\n```\n\nUse this structure for the `bind()`, `connect()`, and `accept()` system\
    \ calls. Similarly, the socket option to get the address of your socket or the\
    \ peer's socket needs this new structure. The second change is the socket type.\
    \ You cannot receive different protocols from the same socket. Even though IPv6\
    \ is almost a complete superset of IPv4, you must choose a different socket type:\n\
    \n```\n```\nsd = socket(PF_INET6, SOCK_STREAM, 0);    /* TCP6 */\n/*---OR---*/\n\
    sd = socket(PF_INET6, SOCK_DGRAM, 0);     /* UDP6 */\n/*---OR---*/\nsd = socket(PF_INET6,\
    \ SOCK_RAW, 0);        /* Raw-6 or ICMP6 */\n```\n```\n\nIn each of these examples,\
    \ you may notice that everything stays the same except for the socket type. This\
    \ is the intent of the common `socket()` interface. The next few steps change\
    \ slightly too:\n\n```\n```\naddr.sin6_family = AF_INET6;\naddr.sin6_port = htons(MY_PORT);\n\
    if ( inet_pton(AF_INET6, \"2FFF::80:9AC0:351\", &addr.sin6_addr) == 0 )\n    perror(\"\
    inet_pton failed\");\n```\n```\n\nThe `sockaddr_in6` has other fields that you\
    \ can ignore in your program. Just set them to zero (using `bzero()` or `memset()`),\
    \ and everything should work fine. Also, you don't have to do anything more in\
    \ your program.\n\nThe previous code fragment uses a new call, `inet_pton()`.\
    \ It and its companion call, `inet_ntop()`, are new and help with the various\
    \ forms of address calculation. The `n`, of course, represents network, and the\
    \ `p` represents presentation. This call supports many address formats including\
    \ IPv4, IPv6, Rose, IPX, and HAM radio. The current version that the GNU library\
    \ offers is undocumented and only supports INET and INET6.\n\nThe full prototype\
    \ looks as follows:\n\n```\n```\n#include <arpa/inet.h>\nint inet_pton(int domain,\
    \ const char* prsnt, void* buf);\nchar *inet_ntop(int domain, void* buf, char*\
    \ prsnt, int len);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 288
  md: "The `inet_pton()` call converts the alphanumeric address in `prsnt` into the\
    \ network byte-ordered binary form and places the result in `buf`. The `inet_ntop()`\
    \ call does the reverse. Parameters `domain` and `len` define the network (`AF_INET`\
    \ or `AF_INET6`) and `prsnt` array length, respectively.\n\n# ## Converting Raw\
    \ Sockets to IPv6\n\nIf you are using a UDP or TCP socket, that's all you have\
    \ to do. However, if you are programming a raw or ICMP socket, you have to use\
    \ special new record formats. Raw-6 and ICMP6 include new or revised fields to\
    \ support the extra capabilities.\n\nThe IPv6 header is much simpler than the\
    \ IPv4 header and only doubles the overhead (40 bytes versus 20 bytes). The header\
    \ is also a fixed size because no options are allowed (please note that this is\
    \ not quite true, as the next section describes). The IP (for raw sockets) can\
    \ be defined as follows in network byte order:\n\n```\n```c\n /***************************************************************/\n\
    \ /** IPv6 Packet definition ***/\n /***************************************************************/\n\
    \ union IPv6_Address\n {\n unsigned char u8[16];\n unsigned short int u16[8];\n\
    \ unsigned long int u32[4];\n unsigned long long int u64[2];\n };\n struct IPv6_Header\n\
    \ {\n unsigned int version:4; /* The IP version (6) */\n unsigned int priority:4;\n\
    \ unsigned int flow_label:24;\n unsigned int payload_len:16; /* bytes following\
    \ header */\n unsigned int next_header:8; /* protocol (6 for TCP) */\n unsigned\
    \ int hop_limit:8; /* same as TTL */\n union IPv6_Address source;\n union IPv6_Address\
    \ dest;\n };\n```\n```\n\nOnly three of the fields require more explanation. The\
    \ `priority` field is an experimental field that sets the priority of the packet.\
    \ If the network becomes congested, routers may hold or drop lower-priority packets.\
    \ By default, all packets are `priority` zero.\n\nThe `flow_label` field is also\
    \ experimental and works with `priority`. The flow is a sequence of packets that\
    \ move from source to destination through a series of routers. `flow_label` helps\
    \ the routers determine any special handling. A message has only one `flow_label`;\
    \ after it is selected, the flow value does not change for all packets in the\
