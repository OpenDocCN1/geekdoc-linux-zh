- pgno: 110
  md: "# How Do I Create a Thread?\n\nThreads offer you the power of closely shared\
    \ resources between parent, children, and siblings. Use threading to delegate\
    \ data tasks for a common goal. For example, one thread retrieves a picture, while\
    \ another converts it for display. In contrast, processes help you when you don't\
    \ need such closely connected interactions.\n\nOne specific implementation of\
    \ threading you may have heard about is Pthreads. Pthreads is a set of library\
    \ calls that offer threading in a POSIX lc-compliant way. The programs you write\
    \ using Pthreads are likely to be compatible with other POSIX-compliant operating\
    \ systems. The library call for creating new Pthreads is `pthread_create()`:\n\
    \n```\n```C\n#include <pthread.h>\nint pthread_create(pthread_t* child, pthread_attr_t*\
    \ attr, void* (*fn)(void*),\n    void* arg);\n```\n```\n\n# NOTE\n\n# The Difference\
    \ Between Library and System Calls\n\nThe difference between a library call and\
    \ a system call is the amount of work done in libraries versus the kernel. A `fork()`\
    \ system call really is an interface into the kernel system services. The `pthread_create()`\
    \ is in a different library that translates the call into the `__clone()` system\
    \ call. In this case, to compile C programs with threads, be sure to include `-lpthread`\
    \ as the last argument on the `cc` command line. For example, to compile `mythreads.c`\
    \ and link it with the Pthreads library, use the following:\n\n```\ncc mythreads.c\
    \ -o mythreads -lpthreads\n```\n\nAs with the `fork()` system call, at the point\
    \ you successfully execute `pthread_create()`, you have another task running.\
    \ However, creating threads is more complicated than the `fork()` system call.\
    \ Depending on how many features you want to use, you may have to do more preparatory\
    \ work. Each parameter provides the materials needed to start the new thread (see\
    \ Table 7.1).\n\n**Table 7.1. The Function of Each Parameter for the `pthread_create()`\
    \ Library Call**\n| Parameter | Description |\n| :--- | :--- |\n| child | The\
    \ handle to the new thread. You use this variable after the call to control the\
    \ thread. |\n| attr | A set of attributes or behaviors for the new thread. You\
    \ can define how the thread is to work and interact with the parent at the time\
    \ of instantiation. A few of these behaviors include priority, attachment, and\
    \ scheduling. This parameter can be `NULL`. |\n| fn | A pointer to a function\
    \ that is to house the thread. Every thread runs in a specified program subroutine\
    \ (unlike `fork()`). When the thread returns or exits the subroutine, the system\
    \ terminates the thread. This helps avoid the task confluence problem (see above).\
    \ |\n| arg | A parameter to be passed to the function. You can use this to configure\
    \ the thread's initial settings. Be sure to make the data block that this parameter\
    \ points to available to the thread. In other words, don't refer to a stack variable.\
    \ The parameter can be `NULL` as well. |"
