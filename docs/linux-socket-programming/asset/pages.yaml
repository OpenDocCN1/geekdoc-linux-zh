- pgno: 134
  md: 'The two primary differences between a normal parent-child creation are the
    I/O redirection and the `exec*` () call. You need to redirect all standard channels,
    including `stderr`, to supply the external program all the I/O it needs to work
    correctly.


    You can use the `exec()` system call in both threads and processes. With many
    tools available, this becomes very useful. Threads have a caveat; because they
    cannot redirect the standard I/O without affecting any peer thread''s I/O, threads
    that call `exec()` share the same I/O with the peer threads.


    # NOTE


    Using an `exec()` Call in a Thread


    Here''s an interesting problem: What happens if a thread calls `exec()`? The external
    program could not replace the caller without affecting the peers. The Linux kernel
    uses the policy that the call won''t share the data, but the existing file channels
    remain shared. So, when the external program terminates, it closes the `stdin`
    and `stdout` file handles. This affects the peer threads. Recommendation: Use
    `fork()` instead if you want to `exec()` an external program.


    # Summary: Distributing the Process Load


    Multitasking gives your programs the extra kick they need to increase accessibility
    and flexibility. You can use threads and processes to speed up your clients and
    boost your servers. With task management and communications, you can ease programming
    and increase reliability.


    This chapter introduced you to the topic of multitasking and the different types
    of tasks—processes and threads. You also learned how to create them with high-level
    tools like Pthreads or `fork()` or the low-level tool `__clone()`.


    After you have created the task, you can control thread interactions with synchronization.
    Synchronization further helps you serialize (or coordinate) access to the contended
    data. Serialization ensures data integrity.


    Every task can accept messages through pipes or other I/O and signals to handle
    asynchronous events. The pipes allow you to direct information to children, offloading
    the parent. They also allow you to redirect standard I/O for simpler interaction.
    Signals capture events that can help your programs be more robust.


    The next chapter extends the concepts of I/O and provides alternatives to multitasking.


    # Chapter 8. Choosing when to Wait for I/O


    # IN THIS CHAPTER


    +   - I/O Blocking: Why?

    - When Do I Block?

    - Alternatives to I/O Blocking

    - Comparing the Different I/O Programming Interactions

    - Polling I/O

    - Asynchronous I/O

    - Solving Unwanted I/O Blocking with `poll()` and `select()`

    - Implementing Timeouts

    - Summary: Choosing the I/O Techniques'
  merge: -1
