- pgno: 239
  md: 'RPCs handle all the connection and data translation for your developer-users.
    From the perspective of the developer-users, the networking piece is a small part
    of the program''s feature set. For them to dedicate more than a small portion
    of their time to the writing and testing of the network interfaces would be very
    costly and inefficient.


    In turn, you could write tools (service calls) that provide their programs robust
    ways of communicating. These tools would interface with the client, server, and
    peer. Depending on the protocol, your service calls can be complex—requiring your
    tools to provide large amounts of checking and retransmission (UDP)—or simple
    (TCP).


    This chapter shows you how to write RPCs from two different approaches. The first
    approach demonstrates how to write them with your own bare hands, without any
    tools. The second introduces the rpcgen tool. Before all of this, the next section
    revisits the concepts of the network model to show how RPCs fit.


    # ## Revisiting the OSI Model


    Back in Chapter 5, “Understanding the Network Layering Model,” you read that the
    network model layers all features and operations, hiding information from the
    user and the program. The operation includes information about how the network
    actually passes data from one program to another. The network layering model also
    increases the likelihood that the destination gets the message. According to networking
    theory, no user actually interfaces with anything other than the Application layer
    (layer 7).


    The IP protocol stack, however, effectively stops at layer 4 (the Networking layer).
    TCP is the last protocol and has the highest reliability of the IP protocol stack.
    You can create a socket that acts a lot like a file stream. This gives you a lot
    of power and flexibility. The protocol leaves the responsibility of implementing
    the higher layers to the applications.


    This does present a small problem. Without defining the higher layers, many applications
    have emerged that essentially duplicate effort. Consider the FTP and Telnet protocols.
    Each provides a authentication phase—user login. While the login interfaces may
    be small and minor, they duplicate the procedure. Furthermore, this complicates
    methods for you as a professional programmer. If you want to incorporate authentication
    in a client program, you basically have to write your own.


    You can provide some of this functionality using your own interfaces. Other programs
    can then use these functions. As with the various networking models, you may want
    to make the interfaces network-transparent. Network-transparent programs never
    force the user (or programmer) to interact with the network. The whole idea is
    to make the network connection as effortless as possible.


    # ## Comparing Network and Procedural Programming


    Whenever you start considering network interfacing, you open a whole side of programming
    that software engineers rarely touch. The challenge of it is clearly very interesting,
    but that is not enough to simply begin programming it. You must think ahead to
    how the client and server (the system) are to work together.


    Network programming is not at all like procedural programming. Procedural programming
    is very forgiving. If you write a program that two people use (a client and a
    server), these people expect a higher quality and better recovery from errors.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'To create a library of network-ready tools, you face several hurdles. The hurdles
    involve performance and reliability; they also involve simple limitations in the
    technology.


    # ## Language Limits


    The first problem you face is the language interface itself. The C programming
    language allows you to do several things that are not meaningful in a network
    interface.


    First, information that you send must be in a *value* form. Pointers are not meaningful
    in a network environment for obvious reasons; one computer''s address is not the
    same as another''s address. Your program must pass all data as values. This goes
    against some programmers'' grain. No one likes to pass a structure or array by
    value; the data-copy chews up memory and CPU time.


    # ### NOTE


    # ### C-Style Data Copying


    The C language assumes that you do *not* want to copy large data types because
    of the potential to chew up performance merely moving data around. So it tries
    to pass information by pointer or reference as much as possible. All complex languages
    support scalars (simple types like `int` and `char`) and vectors (arrays and structures).
    By default, C passes scalars by value. However, some compilers complain when you
    try to pass a structure by value. To pass an array by value, you have to declare
    a new type or use a structure. In all cases, the program uses the hardware stack
    to store your data, and you must ensure that you have enough stack space to accommodate
    the data.


    This does result in the problem of getting information back unless you let the
    return value be the result. You can get around passing everything by value, but
    at some point *the program does have to send the data*. With this approach, you
    still pass your parameters by reference, but the program does copy the data at
    least at the very last stage.


    The following example shows a prototype of an interface of the `getphoto()` service
    call. The types `image_t` and `host_t` are custom types that you create. If you
    are adventurous, you can return the result by value as well. Still, you might
    want to leave the return value open to indicate an error; if you return a structure
    or type by value, you can''t effectively detect errors.


    ```

    ```

    /******************** */

    /*** Pass-by-value example - call a camera server to get ***/

    /*** recent snapshot.  ***/

    /******************** */

    image_t *getphoto(host_t host);

    ```

    ```


    # ### NOTE


    # ### Returning Vectors by Value


    The C language permits you to return a vector by value. However, the implementation
    is compiler-specific and may surprise you. Because of the way some processors
    handle the hardware stack, the compiler may *not* actually copy the result to
    the stack. Instead, it may create a local or static variable and pass back the
    variable reference. Upon returning, the caller then copies the value into the
    appropriate destination. This may have a significant side effect in multithreaded
    programs.'
  merge: -1
  img_proc: true
