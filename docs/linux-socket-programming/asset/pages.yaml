  md: "![](img/03334662da8fdfb8d95a02f270c522f6_156_0.png)\n\n![](img/03334662da8fdfb8d95a02f270c522f6_156_1.png)\n\
    \nIf the number of connections is increasing, there are fewer being terminated\
    \ than there are being created. If your server does not see a termination within\
    \ the prescribed time, you can assume that it is serving a connection. At that\
    \ point, your server doubles the rate of servlet creation (see the second pattern\
    \ in **Figure 9.1**). This process continues until the number of servlets hits\
    \ a ceiling or your server reaches the maximum creation frequency (every 5 seconds,\
    \ per haps).\n\nAgain, suppose your server creates a new servlet every 60 seconds\
    \ (with a 30-second idle timeout). If the extra servlet does not terminate within\
    \ the prescribed time, you can cut in half the time delay between creations, thus\
    \ doubling the frequency. You can repeat this process until the connection rate\
    \ begins to stabilize.\n\nFinally, when the connections begin to dwindle, the\
    \ pending connections (if any exist) have more than enough servlets for the queue,\
    \ and the server begins to see servlet termination. When the extra servlets begin\
    \ to terminate, you can reset the server’s frequency to normal.\n\n```\n/***************************************************/\n\
    /*** Chumming connections example\t***\n/*** (\"servlet-chummer.c\" on Web site)\t\
    ***\n/***************************************************/\nint delay=MAXDELAY;\t\
    \t/* for example, 5 seconds */\ntime_t lasttime;\nvoid sig_child(int signum)\n\
    {\n\twait(0);\t\t\t/* Acknowledge termination */\n\ttime(&lasttime);\t\t/* get\
    \ the time stamp */\n\tdelay = MAXDELAY;\t\t/* reset chummer back */\n}\nvoid\
    \ Chummer(void (*servlet) (void))\n{\n\ttime(&lasttime);\t\t/* Initialize timestamp\
    \ */\n\tfor (;;) {\n\t\tif ( !fork() )\t\t/* first, set the chum */\n\t\tservlet();\t\
    /* call the task (must have exit()) */\n\t\tsleep(delay);\t\t/* dream for a while\
    \ */\n\t\t/* If no child terminated, double frequency */\n\t\tif ( time(0) - times[1]\
    \ >= delay-1 )\n\t\tif ( delay > MINDELAY )\t/* don’t go below min */\n\t\t\t\
    delay /= 2;\t/* double chum frequency */\n\t}\n}\n```"
