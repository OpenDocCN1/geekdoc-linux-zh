  md: '+   * IP_MTU_DISCOVER Lets you open the MTU (maximum transmission unit) discovery
    process. The MTU is the agreement between the sender and receiver on how large
    the packet should be. This has three values:


    IP_PMTUDISC_DONT (0) Never send DF (don''t fragment) frames.

    IP_PMTUDISC_WANT (1) Use per-route hints.

    IP_PMTUDISC_DO (2) Always use DF frames. (Integer, disabled by default.)

    * IP_MULTICAST_IP Sets the outgoing multicast interface. This is the IPv4 address
    assigned to a hardware interface. Most machines have only one interface and one
    address, while some may have more. This setting lets you indicate which address
    interface to use. (struct in_addr, INADDR_ANY by default.)

    * IP_MULTICAST_LOOP Enables multicast loopback. Your receive buffer gets a copy
    of whatever you transmit. (Boolean, disabled by default.)

    * IP_MULTICAST_TTL Sets the maximum number of hops (Time To Live) the multicast
    message is allowed. For any effective Internet multicasting, you must set this
    value, because it allows only one routing by default. (Integer-byte, 1 by default.)

    * IP_OPTIONS Lets you select specific IP options. The options are notes in the
    IP header that tell the receiver specific notes (for example, timestamping, security
    levels, and alerts). Look at the TCPv1 and TCPv2 RFCs for more information. (Byte
    array, none by default.)

    * IP_TOS This option lets you determine the type of service (TOS) that the outgoing
    packets require. You can select from four types: IPTOS_LOWDELAY (minimize delay),
    IPTOS_THROUGHPUT (maximize throughput), IPTOS_RELIABILITY (maximize reliability),
    and IPTOS_LOWCOST (minimize cost). (Integer, no extra services by default.)

    * IP_TTL Set the time to live (TTL) of each packet. This indicates the maximum
    number of router hops before the packet expires. (Integer-byte, 64 by default.)


    # IPv6-Specific Socket Options


    The IPv6-specific socket options apply to extended features of IPv6 or IPng. To
    use these options, you must set the level parameter in getsockopt() and setsockopt()
    to SOL_IPV6.


    +   * IPV6_ADD_MEMBERSHIP Like the IPv4 version, this option lets you join an
    IPv6 multicast group. (struct ipv6_mreq, none by default, write-only.)

    * IPV6_ADDRFORM This option allows you to convert the socket between IPv4 and
    IPv6. (Boolean, disabled by default.)

    * IPV6_CHECKSUM When working with raw IPv6 sockets, this option lets you tell
    the socket the byte offset to the checksum in the packet. If the value is -1,
    the kernel does not calculate the checksum for you, and the receiver skips it
    as well. (Integer, -1 by default.)

    * IPV6_DROP_MEMBERSHIP Like the IPv4 version, this option lets you unsubscribe
    from an IPv6 group. (struct ipv6_mreq, none by default, write-only.)

    * IPV6_DSTOPTS This setting allows you to retrieve all options from a received
    packet. This information appears in the recvmsg() system call. (Boolean, disabled
    by default.)

    * IPV6_HOPLIMIT If you use the recvmsg() system call and have enabled this option,
    you can get the number of hops remaining in a received packet in the ancillary
    data field. (Boolean, disabled by default.)

    * IPV6_HOPOPTS If you use the recvmsg() system call and have enabled this option,
    you can get the hop-by-hop options in the ancillary data field. (Boolean, disabled
    by default.)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   * **IPV6_MULTICAST_HOPS** Similar to the IPv4 version (TTL), this option
    lets you define the maximum number of router hops before expiring. (Integer-byte,
    1 by default.)


    +   * **IPV6_MULTICAST_IF** Similar to the IPv4 version, this option lets you
    define which interface (by IP address) to use for multicasting messages. (`struct
    in6_addr`, zero by default.)


    +   * **IPV6_MULTICAST_LOOP** Like the IPv4 version, this option echoes every
    message you send on multicast. (Boolean, disabled by default.)


    +   * **IPV6_NEIGHOP** This option lets you specify the next hop for a datagram
    when you use `sendmsg()`. You need to have `root` access to perform this operation.
    (Boolean, disabled by default.)


    +   * **IPV6_PKTHINFO** Normally you can''t get very much information about the
    received packet. This option lets you get the arriving interface index and destination
    IPv6 address. (Boolean, disabled by default.)


    +   * **IPV6_PKTOPTIONS** Similar to the IPv4''s **IP_OPTIONS**, you can directly
    specify the options using a byte array. In most cases you send IPv6 options via
    the ancillary data of the `sendmsg()` system call. (Byte array, none by default.)


    +   * **IPV6_UNICAST_HOPS** Similar to the IPv4''s **IP_TTL**, this option lets
    you specify the maximum number of router hops before expiring the packet. (Integer-byte,
    64 by default.)


    # ### TCP-Specific Socket Options


    The TCP-specific socket options apply to the streaming capabilities of the TCP
    layer. To use these options, you must set the `level` parameter in `getsockopt()`
    and `setsockopt()` to **SOL_TCP**.


    +   * **TCP_KEEPALIVE** The **SO_KEEPALIVE** waits for 2 hours before checking
    for a connection. This option lets you change that delay. The value''s units are
    in seconds. On Linux the `sysctl()` call replaced this option. (Integer, 7200
    by default.)


    +   * **TCP_MAXRT** This option lets you specify the retransmit time in seconds.
    A `0` selects the kernel default, and a `-1` forces the network subsystem to retransmit
    forever. (Integer, 0 by default.)


    +   * **TCP_MAXSEG** The TCP stream is packetized into chunks of data. The Maximum
    Segment Size (MSS) specifies the amount of data in each chunk. The network subsystem
    coordinates this value with the peer''s MSS. You cannot increase this value over
    the peer''s MSS, but you can decrease it. (Integer, 540 bytes by default.)


    +   * **TCP_NODELAY** TCP uses the Nagle Algorithm, which forbids sending any
    message that is smaller than the MSS until the receiver acknowledges (ACK) all
    outstanding messages. If you enable this option, you turn off the Nagle Algorithm,
    making it possible to send several short messages before getting the ACKs. (Boolean,
    disabled by default.)


    +   * **TCP_STDURG** This option specifies where in the stream to find the **OOB**
    data byte. By default it is the byte following the **OOB** flag. Since all implementations
    recognize this default, you may never need to use this option. Linux replaced
    this option with the `sysctl()` system call. (Integer, 1 by default.)


    # ### Recovering the Socket Descriptor


    You may write many servers as you learn how to do network programming. You may
    run into a problem that the `bind()` fails because of an `address in use` error.
    This is the most common error programmers get (even experienced ones) and one
    of the most common questions asked on the Usenet. The problem comes from the way
    the kernel allocates the ports.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "Most kernels wait for a few seconds before reallocating a port (some specifications\
    \ claim up to a minute). This policy is important for security. The delay makes\
    \ sure that floating packets are dead before permitting a new connection.\n\n\
    You can get around this problem if you use the `SO_REUSEADDR` option. In fact,\
    \ some say that you should enable this option on all your servers. As stated in\
    \ the previous section, this option lets you reconnect quickly even though the\
    \ kernel may still have it allocated. To enable the option, you can use the following\
    \ excerpt:\n\n```\n```c\n/**** REUSING A PORT EXAMPLE (FOR SERVERS THAT DIE AND\
    \ NEED TO RESTART) *****/\nint value = 1; /* TRUE */\nint sd = socket(AF_INET,\
    \ SOCK_ADDR, 0);\nif ( setsockopt( sd, SOL_SOCKET, SO_REUSEADDR, &value, sizeof(\
    \ value) ) != 0 )\n   perror( \"setsockopt() failed\" );\n/* Bind(), listen(),\
    \ and accept() */\n```\n```\n\nAnother procedure you could follow is to retry\
    \ the `bind()` system call if it returns the `EAGAIN` error. One caveat for using\
    \ this option is that no other programs should be using your port. The `SO_REUSEADDR`\
    \ option lets your programs share ports. That may cause problems. You don't want\
    \ two HTTP servers running at the same time, both using port 80. Also, trying\
    \ to start a server that's already started is a common sysadmin goof.\n\nSome\
    \ programmers leave this feature disabled and retry a few times to detect if the\
    \ program is already running. If you want to use this option (which actually is\
    \ a good idea), be sure to use a different locking mechanism, like the PID in\
    \ `/var`.\n\n# ### Sending Before Received: Message Interleave\n\nOne aspect of\
    \ server responsiveness is its quick recovery. Another aspect is how quickly the\
    \ client can get the request out to the server. You can also use `TCP_NODELAY`\
    \ to assist your server's performance by getting out the client's query as quickly\
    \ as possible.\n\nAs previously mentioned, TCP uses the Nagle Algorithm to limit\
    \ the number of small messages on a WAN. It forbids sending any message that is\
    \ smaller than the MSS until the receiver acknowledges (ACK) all outstanding messages.\
    \ Of course, if the send buffer has more than MSS bytes of data, it sends it as\
    \ quickly as possible. What this means to you is that if you have several short\
    \ requests, you may wait longer for their replies. This is because they are not\
    \ sent as soon as you `write()` them, but they are serialized into send-ACK-send\
    \ interactions.\n\nThe only loss possible when using this approach is loss of\
    \ network throughput, but you can control that. Remember that if the number of\
    \ bytes in the header begins to outweigh the data itself, the throughput suffers.\
    \ If you can limit the messages so that they are not too small (try building them\
    \ manually first into a buffer), then you can send them in a burst. The result\
    \ is getting the throughput of instant transmission while minimizing the throughput\
    \ drain."
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Noting File I/O Problems


    As you look at the options for building the messages, you may be tempted to use
    the standard file I/O system calls or the higher-level `FILE*` library calls.
    Up to this point, this text tells you that this interchangeability is great.


    Using the standard calls is very useful for quick prototypes and fast development.
    They are familiar and have several features that can make your programming very
    easy. In fact, as you do rapid prototyping, use those calls that most closely
    match the ones in the Sockets API. Try to limit those, like `printf()`, which
    may be harder to convert.


    The problem with using the file I/O calls stems from the way the libraries and
    system manage them. When you make one of the file I/O calls with a socket descriptor
    or you use `fopen()`, the system may copy your data a few times from the file
    buffers to the socket buffers. This dings your client''s or server''s stellar
    performance. Even the low-level file I/O, `read()` and `write()`, looks at your
    descriptor, determines that it needs socket I/O, and makes the appropriate call.


    Eventually, you might want to use the Sockets API exclusively. This can also help
    readability and maintainability of your code; it makes it very easy to see that
    your program is working on a file versus a socket.


    # Using Demand-Based I/O to Recover CPU Time


    Your servers, clients, and peers all share two common features: your algorithms
    and the I/O subsystem. You can control your programs by good design and profiling.
    The I/O subsystem is not as flexible. (One of the most appealing aspects of Linux
    is that you can get into it and change it.) The I/O system calls in the Sockets
    API offer you a lot of control over how you send and receive your data. Mixed
    with the control from `fcntl()`, this provides some very powerful tools.


    In most cases, the kernel simply buffers the messages you send. This means you
    can focus on getting information and processing it. **Chapter 8, "Choosing when
    to Wait for I/O"** explains how to use asynchronous I/O (or demand-based I/O)
    for letting the kernel do some of the work for you.


    Asynchronous I/O (not the real-time definition) works with your program by placing
    the burden of notification on the I/O subsystem. During the life of your program,
    you may do several reads and writes.


    # Speeding Up a send()


    When you send a message, the kernel copies the message into its buffers and starts
    the process of constructing the packets. Upon completion, the kernel returns to
    your program with a status. The only reason for the delay is to generate the results
    of the `send()`. If you have any problems with your message, the kernel can reply
    with an error message.


    However, most errors after you have connected come from transmission, not from
    the `send()` command. Unless you have something such as an illegal memory reference
    (which the call detects quickly), you may not get an error until after the `send()`
    finishes. You can get these errors from the `SO_ERROR` socket option before the
    library''s `errno` gets it.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'You can speed up the `send()` operation with the `MSG_DONTWAIT` system call
    option. With this option, the call copies your data and immediately returns. From
    that point you can proceed with other operations. However, it is your responsibility
    to check the error codes carefully.


    The only time that a write operation blocks is when the transmit buffers are full.
    This does not happen very often when you have a lot of unused memory. If it does,
    you can use asynchronous I/O with signals to let you know when the buffers are
    available.


    # ## Offloading the recv()


    Unlike the `send()` system call, most `recv()` system calls I/O block, because
    your program usually runs faster than the arriving data. If the receive buffers
    have data, the read operation copies the information and returns. Even if one
    byte is ready in the buffers, the read operation returns with that one byte. (You
    can change this behavior with the `MSG_WAITALL` option in the `recv()` system
    call.)


    Generally, you don''t want to wait for data to arrive when your program could
    be doing other things. You have two options: Spawn threads that manage that particular
    I/O or use signals. If you use threads, you may have another process that is I/O
    blocked on the `recv()`. This may not an issue, but keep in mind the system''s
    resources. If you have several processes or threads already in your program (or
    other programs), you may not want to load up the process table.


    The alternative, synchronous I/O or signal-driven I/O, lets your program run.
    When a message arrives, the kernel sends a signal (SIGIO) to your process. Your
    signal handler accepts the signal and issues the read call. When done, the handler
    sets a flag indicating that data is ready.


    Remember that the signal only tells your program that data arrived, not how much
    data. Also, the danger of doing I/O in signal handlers is the chance that you
    lose other signals. You can solve these problems by not forcing the call to give
    more data than is available and setting the flag and leaving the reading to the
    main program.


    Either algorithm—threading or signal-driven I/O—essentially does the same things.
    Both get the data as soon as it arrives, and both have to set a global flag when
    the data is ready.


    # ## Sending High-Priority Messages


    During the interchange of messages, your program may need to wake up the other
    end or stop some operation. The TCP protocol supports urgent messages that essentially
    jump the input queue. These urgent messages are the out-of-band (OOB) data you
    may have read up to this point. (Other protocols support urgent messages, but
    they differ in implementation.) This option is not as glamorous as it sounds.
    According to the specifications, urgent messages are never allowed more than a
    one-byte message.


    In fact, if your program gets two urgent messages in succession, the second may
    overwrite the first. This is due to the way the networking subsystem stores urgent
    messages. It has only a one-byte buffer for each socket.


    Originally, this feature served transaction-based connections like Telnet, which
    needed a way to force an interrupt (like `^C`) across the network. You can use
    them to tell the client or server a very specific operation, such as `reset-connection`
    or `restart-transaction`. Really, you can''t do much more than that. (You can
    get very inventive with the 256 possibilities, though.)'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'If you do not select the SO_OOBINLINE socket option, the kernel notifies your
    program of OOB data with a signal (SIGURG). (Your program ignores this signal
    by default unless you capture it.) Within the signal handler, you can read that
    message with the MSG_OOB option in the recv() system call.


    If you want to send an urgent message, you need to use the MSG_OOB option in the
    send() system call. Additionally, like asynchronous I/O, you need to enable capturing
    this event with a system call to fcntl():


    ```

      /*****************************************************/

      /*** Claim ownership of SIGIO and SIGURG signals  ****/

      /*****************************************************/

      if ( fcntl (sockfd, F_SETOWN, getpid()) != 0 )

        perror ("Can''t claim SIGURG and SIGIO");

    ```


    This call tells the kernel that you want to get asynchronous notification of SIGURG
    and SIGIO. Remember that the call uses only one byte of that message as the OOB
    data.


    You can use the urgent (OOB) messages to make sure that the listener is alive,
    because unlike regular data, flow control does not block them. You might use this
    for a heartbeat:


    ```

      /*****************************************************/

      /*** Heartbeat between programs: Server replying to beats ***

      /*** ("heartbeat-server.c" on Web site)            ***

      /*****************************************************/

      int clientfd;

      void sig_handler (int signum)

      {

        if ( signum == SIGURG )

        {

          char c;

          recv (clientfd, &c, sizeof (c));

          if ( c == ''?'')

            send (clientfd, "Y", 1, MSG_OOB);

      /* Are you alive? */

      /* YES! */

        }

      }

      int main ()

      {

        int sockfd;

        struct sigaction act;

        bzero (&act, sizeof (act));

        act.sa_handler = sig_handler;

        sigaction (SIGURG, &act, 0); /* connect SIGURG signal */

        /*** set up server & connection client to clientfd ***/

        /*---claim SIGIO/SIGURG signals---*/

        if ( fcntl (clientfd, F_SETOWN, getpid()) != 0 )

          perror ("Can''t claim SIGURG and SIGIO");

        /*** do your work ***/

      }

    ```


    In this example, the server replies to the messages that the client sends (you
    can reverse it as well). Most of the items listed set up and respond to the message.
    The client is a bit different:


    ```

      /*****************************************************/

      /*** Heartbeat between programs: Client sends beats.  ***

    ```'
  merge: -1
  img_proc: true
