    command, so you need to manage the header in your program.


    The ICMP packet has a header and a body of data. To ease your programming (and
    architecture independence), Linux includes the header definition in the libraries:


    ```

    ```

    #include <netinet/ip_icmp.h>

    struct icmphdr *icmp_header;

    ```

    ```


    Because you are likely to include more information in the packet than just the
    header, you might want to define your own structure as follows:


    ```

    ```

    #define PACKETSIZE        64        /* bytes */

    struct packet_struct

    ```

