- pgno: 18
  md: "+   The connection provides the channel for messages. Once the telephone is\
    \ answered, there is a channel through which two or more people may converse.\
    \ Your telephone number is not important unless the person has to call you back.\n\
    The path back to your handset is hidden inside the telephone system. The telephone\
    \ network has several shared paths, like a computer network. So having a reverse\
    \ path is important for getting the messages back to your handset. The destination\
    \ peer or server gets the address and port of your program so that it can reply\
    \ using a similar path.\nYour telephone number has to be published for others\
    \ to call you. If your program is going to accept calls, you must specify a unique\
    \ channel (or port) and publish it to your clients.\n\nThe connect() system call's\
    \ definition follows:\n\n```\n#include <sys/socket.h>\n#include <resolv.h>\nint\
    \ connect(int sd, struct sockaddr *server, int addr_len);\n```\n\nThe first parameter\
    \ (sd) is the socket descriptor that you created with the socket() call. The last\
    \ parameter is the length of the sockaddr structure. The second parameter points\
    \ to different types and sizes of structures. This is important, because this\
    \ is what makes the socket() calls different from the file I/O calls.\n\nRecall\
    \ that the socket() system call supports at least two different domains (PF_INET\
    \ and PF_IPX). Each network domain (PF_*) has its own structure to describe the\
    \ address. They all have one common parent—the one you see in the connect() definition—struct\
    \ sockaddr. For a complete list of all the structure declarations, see Appendix\
    \ A.\n\n# NOTE\n\n# sockaddr Data Abstraction\n\nThe sockaddr interface uses data\
    \ abstraction. Data abstraction simplifies interfaces by asserting that while\
    \ the data types may change, the algorithms remain the same. For example, a stack\
    \ can contain different data types, but the function of the stack remains the\
    \ same: push, pop, and so forth. To use an abstract interface, the first field\
    \ of the sockaddr structure must have the same meaning. All structures have one\
    \ common field: ..._family. The field's type is an unsigned 16-bit integer. The\
    \ value this field holds determines what kind of network domain to use.\n\n# NOTE\n\
    \n# Matching the Socket Type with sockaddr Family Field\n\nThe domain type you\
    \ had set in the socket() system call must be the same value as the first field\
    \ in the sockaddr family. For example, if your program created a PF_INET6 socket,\
    \ the structure field must be AF_INET6 in order for the program to work correctly.\n\
    \nFor now, here is the generic record and the INET record for comparison (from\
    \ the header files):\n\n```\nstruct sockaddr{                 struct sockaddr_in\
    \ {\n    unsigned short int sa_family;      sa_family_t    sin_family;\n```"
