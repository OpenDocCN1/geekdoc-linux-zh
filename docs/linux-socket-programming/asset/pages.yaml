    The parameter `mutex` is the semaphore you use to lock the section. A full-code
    example (called `thread-mutex.c`) is included on the Web site. Initialize it with
    one of three behavior values:


    +   - **Fast (default)**—(`PTHREAD_MUTEX_INITIALIZER`) Just check the lock. If
    the same thread tries to lock a mutex twice, it deadlocks.

    - **Recursive**—(`PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP`) Verify that the owner
    is locking the mutex again. If so, it keeps count (*counting semaphore*) of the
    number of locks. The mutex has to be unlocked as many times as it was locked.

    - **Error-Checking**—(`PTHREAD_ERRORCHECK_MUTEX_INITIALIZER_NP`) Verify that the
    thread unlocking a mutex is the same one that locked it. If it is not the same,
    it returns an error while leaving the lock intact.


    The library offers an additional call to lock without blocking. The `pthread_mutex_trylock()`
    library call attempts to lock the semaphore. If it can''t, it returns an `EBUSY`
    error.


    # NOTE


    # Playing Fair by Avoiding Critical Section Lockouts


    Try to limit computation in a critical section to just the contended items. For
    example, don''t call I/O or manipulate unrelated data unless you absolutely can''t
    avoid it. If necessary, you can copy the data into local variables for computation
    outside the section. Keep in mind that I/O mixed with critical sections leads
    to deadlock-potential.


    # Pthread Mutex Problems


    You do have a few limitations with Pthreads. First, Pthreads''mutex has no reference
    to the critical section of memory. It''s just a flag. Using the traffic light
    analogy again, the contended resource is the intersection—not the traffic light.
    The light would function with or without the intersection. The primary function
    of mutex is for you to use it exclusively for the contended data. For instance,
    if not careful, you could program two threads to use a single semaphore for unrelated
    data. This is not dangerous—you won''t crash, deadlock, or corrupt data. You may,
    however, block a thread unnecessarily.


    Second, you could have several threads working on a large block of data, such
    as a table. Each of the cells is unrelated, and the threads are working in different
    sections. You don''t want to lock the whole table, only sections of it (called
    *zone locking*). Pthreads mutexes give you the ability to block concurrent accesses,
    but it can''t dynamically determine where your thread is working.


    Finally, you may also want to prioritize access. There is no harm in reading some
    data, and you can have several readers at the same time (known as *shared locking*).
    But, no other thread can write to it. Similarly, you want only one writer; this
    only works if the contended data is atomically updated. Pthreads are limited to
    exclusive access—either you have it or you don''t.'
