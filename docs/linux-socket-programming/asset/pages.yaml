    The third and final rule is layering. *Layering* does more than modularize a set
    of data; it places a single boundary around an entire technology. The TCP or OSI
    layering models do a good to great job of layering the technology. Each layer
    has rules to it, and each has interfaces. The rules always envision a product
    that can adapt to new technologies.


