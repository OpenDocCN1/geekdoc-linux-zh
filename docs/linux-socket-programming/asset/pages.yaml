    \    if ( len == 1 )                       /* If any stray bytes, */\n       \
    \ sum += *(unsigned char*)buf;\n    sum += (sum >> 16) + (sum & 0xFFFF);  /* Add\
    \ the carry */\n    sum += (sum >> 16);                  /* (again) */\n    result\
    \ = ~sum;                        /* Take the one's complement */\n    return result;\
    \                         /* Return 16b value */\n}\n```\n```\n\nThe receiver\
    \ validates the packet by reversing the algorithm—it sums the entire contents\
    \ of the packet. The result should be zero (because of the one's-complement checksum).\
    \ This is a very slick way to check packets, but it has limitations.\n\nThe main\
    \ limitation is the fact that the algorithm can only detect unique bit errors\
    \ in the 16-bit words. It cannot detect like defects from word to word. For example,\
    \ if the packet has two words each with a bit flipped in the same position, the\
    \ checksum would compute the same.\n\n# ## Controlling the IP Header\n\nThe IP\
    \ header uses the same checksum algorithm for its own checksum field. This becomes\
    \ an issue when you choose to create your own IP header. Unlike the ICMP protocol,\
    \ the IP header does a couple of jobs for you. For example, it always calculates\
    \ the checksum, and the checksum only encompasses the IP header. (Recall that\
    \ the ICMP calculates the sum for the entire packet.) If you want to calculate\
    \ the checksum, go right ahead—it will just be redone.\n\nThe IP layer leaves\
    \ all raw IP fields (as shown in Table 3.4) alone except for the IP network version\
    \ number and the checksum. If you set the version number to zero, sendto() sets\
    \ the value to whatever the current network is (for example, 4 for PF_INET or\
    \ 6 for PF_INET6). If you set it to another value, the IP layer leaves it as is.\n\
    \nUnless you're doing something very unusual, setsockopt() touches most of the\
    \ functional fields in the IP header."
  merge: -1
  img_proc: true
- pgno: 280
  md: "# **Third-Party Traffic**\n\nDirect manipulation of the IP header permits you\
    \ some very unusual abilities. One is low-level third-party traffic. Suppose you\
    \ had a network of three servers\\u2014the source, the destination, and an intermediary.\
    \ The intermediary accepts messages from the source, does some processing, and\
    \ then passes the result to the destination. This is called third-party traffic.\
    \ In most instances, the packet sent to the intermediary would include the source\
    \ and final destination (along with its own address).\n\nNow you have to interface\
    \ with a legacy system that does not understand that the reply must be sent to\
    \ a different host other than your source. Most non-TCP protocols reply to the\
    \ Source-IP field in the IP header. Using IP header manipulation you can set the\
    \ Source-IP field to the third-party's address instead of the source's.\n\n# **NOTE**\n\
    \nThird-Party Traffic May Test Ethics\n\nThe ability to set the Source-IP field\
    \ to whatever you would like is very powerful\\u2014and unusual and rarely necessary.\
    \ More often than not, programmers who use this feature are really trying to *spoof*\
    \ the network, fooling the hosts into concluding the message came from somewhere\
    \ else. Those who try network spoofing put themselves at risk of breaking local,\
    \ national, and international laws.\n\nFirst, ISPs can (and should) easily detect\
    \ if a packet is spoofed by tracking messages and verifying Source-IP fields.\
    \ Second, Linux does not allow spoofed packets to be sent: It fills the IP source\
    \ field. And third, ISPs typically drop these \"source-routed\" packets.\n\n#\
    \ **How Does Ping Work?**\n\nWhen creating your first raw socket program, you\
    \ typically start off with ping, a standard \"Are you there?\" client. When you\
    \ send a request like that, the IP stack almost always replies\\u2014there is\
    \ no application or server waiting for that message.\n\nBecause the user may want\
    \ to test the roundtrip time, the program often has two processes running\\u2014one\
    \ for sending and the other for receiving. The sender process typically waits\
    \ one second between each transmission, and the receiver keeps track of the messages\
    \ and their times.\n\n# **The MyPing Receiver**\n\nThe receiver is simple. After\
    \ creating the raw socket, it repeatedly calls *recvfrom()* , as shown in *Listing\
    \ 18.2*.\n\n# **Example 18.2. MyPing Receiver Loop**\n\n```\n```c\n/\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*/\n/\\*\\* MyPing Receiver\
    \ \\u2013 Get pending message and display it.\\**/\n/\\*\\*\\* From MyPing.c on\
    \ Web site.\\***/\n/\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*/\nfor (;;)  {\n    int bytes, len = sizeof(addr);\n\n\n    bzero(buf,\
    \ sizeof(buf));          /*  Clear buffer & Get msg  */\n    bytes = recvfrom(sd,\
    \ buf, sizeof(buf), 0, &addr, &len);\n    if ( bytes > 0 )                  /*\
    \  If no error,  */\n        display(buf, bytes);          /*  check ID & display\
    \  */\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "```\nelse\n    perror(\"recvfrom\");\n}\n```\n\nThe display() call converts\
    \ the buf to a packet_struct and checks for the ID. If the ID matches, the packet\
    \ really does belong to the process.\n\nThe ID is needed because of how the kernel\
    \ delivers messages to raw sockets. As noted earlier, the kernel has no way to\
    \ determine the correct destination of a raw packet without ports, so it delivers\
    \ all raw packets to all raw sockets of a particular protocol.\n\nThe protocol\
    \ is a key for the kernel. If your program registers a raw socket with an ICMP\
    \ protocol, the program gets all ICMP messages (even those meant for other processes).\
    \ How do you tell the difference? ICMP includes an ID field into which most programs\
    \ place their PID (process ID). The responding host echoes back everything that\
    \ it receives, including the ID. If the ID does not match the PID, the receiver\
    \ drops it.\n\n# The MyPing Sender\n\nThe sender has a little more work to do.\
    \ Along with preparing and shipping the message, it has to accept any spurious\
    \ messages the kernel chooses to place in its queue (see *Listing 18.3* ).\n\n\
    # Example 18.3. MyPing Sender Loop\n\n```\n/***********\n* MyPing Sender - Get\
    \ & toss any pending messages, *\n* compose message, send message, and pause.\
    \ *\n* From MyPing.c on Web site. */\nfor ( ; ; )\n{\n    int len = sizeof(r_addr);\n\
    \    /*---Get any message that the kernel may have sent---*/\n    if ( recvfrom(sd,\
    \ &pktct, sizeof(pktct), 0, &r_addr, &len) > 0 )\n        printf(\"***Got message!***\\\
    n\");\n    /*---Initialize outgoing packet---*/\n    bzero(&pktct, sizeof(pktct));\
    \ /* Zero contents */\n    pktct.hdr.type = ICMP_ECHO; /* Request echo */\n  \
    \  pktct.hdr.un.echo.id = pid; /* Set ID */\n    for ( i = 0; i < sizeof(pktct.msg)-1;\
    \ i++ )\n        pktct.msg[i] = i+'0'; /* Fill buffer */\n    pktct.msg[i] = 0;\
    \ /* Make C-string compatible */\n    pktct.hdr.un.echo.sequence = cnt++; /* Set\
    \ counter */\n    pktct.hdr.checksum = /* Compute checksum */\n        checksum(&pktct,\
    \ sizeof(pktct));\n    if ( sendto(sd, &pktct, sizeof(pktct), 0, addr, /* SEND!\
    \ */\n        sizeof(*addr)) < 0 )\n        perror(\"sendto\");\n    sleep(1);\
    \ /* Wait for 1 second */\n}\n```\n\nResetting the message to the same values\
    \ is not completely necessary but is precautionary. When the destination replies,\
    \ the sender will get a copy of the message. If you don't get the message (and\
    \ any other ICMP messages), the kernel ends up setting aside more and more memory\
    \ for unwanted messages."
