- pgno: 46
  md: 'The packet types most likely to be of interest are TCP, UDP, ICMP, and raw.
    Knowing the advantages and disadvantages of each type can help you choose the
    most appropriate for your application. Each packet type has different benefits,
    as summarized in Table 3.2.


    Table 3.2, Packet Type Benefits


    | | Raw | ICMP | UDP | TCP |

    | Overhead (bytes) | 20-60 | 20-60+[4] | 20-60+[8] | 20-60 +[20-60] |

    | Message Size (bytes) | 65,535 | 65,535 | 65,535 | (unlimited) |

    | Reliability | Low | Low | Low | High |

    | Message Type | Datagram | Datagram | Datagram | Stream |

    | Throughput | High | High | Medium | Low |

    | Data Integrity | Low | Low | Medium | High |

    | Fragmentation | Yes | Yes | Yes | Low |


    In this table, notice that each packet type contains comparisons. A reliability
    of Low value only means that you cannot rely on the protocol to help reliability.
    While the differences may seem extreme, remember that they are merely comparisons.


    # ### Considering the Packet''s Issues


    Each protocol addresses issues in the transmission. The following sections define
    each issue and associated category from Table 3.2. This information can help you
    see why certain protocols implement some features and skip others.


    # #### Protocol Overhead


    Protocol overhead includes both the header size in bytes and the amount of interaction
    the protocol requires. High packet overhead can reduce throughput, because the
    network has to spend more time moving headers and less time reading data.


    Strong protocol synchronization and handshaking increase interaction overhead.
    This is more expensive on WANs because of the propagation delays. Table 3.2 does
    not include this measurement.


    # #### Protocol Message Size


    To calculate network throughput, you need to know the packet size and the protocol''s
    overhead. The transmission size gives you the maximum size of a sent message.
    Since all but TCP use a single-shot message, this limitation is typically due
    to the limits of IP packet (65,535 bytes). The amount of data your program transmits
    per packet is the transmission size less the headers.


    # #### Protocol Reliability


    Part of the problem with networks is the possibility of lost messages. A message
    could be corrupted or dropped as it moves from one host or router to another,
    or the host or router could crash or fail. In each case, a message may simply
    be lost, and your program may need to follow up.


    Also, you may need to make sure that the destination processes the packets in
    the correct order. For example, you may compose a message that does not fit in
    one packet. If the second packet arrives before the first, the receiver must know
    how to recognize and correct the problem. However, the order is not important
    when each message is independent and self-contained.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The packet''s reliability indicates the certainty of safe arrival of messages
    and their order. Low reliability means that the protocol can''t guarantee that
    the packet gets to the destination or that the packets are in order.


    # Protocol Message Type


    Some messages are self-contained and independent from other messages. Pictures,
    documents, email messages, and so on are a few examples that may fit the size
    of the packet. Others are more in the form of a flowing stream, such as Telnet
    sessions, HTTP''s open channel [RFC2616], large documents, pictures, or files.
    The message type defines which style best fits each protocol.


    # NOTE


    HTTP''s Protocol


    HTTP 1.0 could effectively use UDP for transferring messages instead of TCP. The
    client simply sends the request for a specific document, and the server replies
    with the file. Effectively, no conversation occurs between client and server.


    # Protocol Throughput


    The most noticeable aspect of data transmission is network throughput. Getting
    the most out of your network is the best way to make your users happy. To get
    the best performance, you need to know the throughput. Often, the bits-per-second
    is a small part of the whole equation; it only indicates how the network could
    perform under ideal circumstances.


    The protocol throughput measures how much real data the originator can send to
    the destination within a period of time. If the headers are large and the data
    small, the result is low throughput. Requiring acknowledgment for each message
    dramatically reduces throughput. By default, high reliability and integrity result
    in low throughput and vice versa.


    # Protocol Data Integrity


    The networking technology currently has a lot of safeguards for data integrity.
    Some network interfaces include a checksum or cyclical redundancy check (CRC)
    for each low-level message. They also include special hardware technology that
    can filter out noise and get to the real message. Additionally, each protocol
    includes measures to detect errors in the data. These errors may or may not be
    important to you.


    The importance of data integrity depends on the data; that is, some data requires
    very careful oversight, while less important data is less critical. Here are some
    types of data:


    +   - Fault-Intolerant—Life-critical data. Anything that can affect public or
    private health/life. For example, life signs and vital signs from medical equipment
    and missile launch commands.


    +   - Critical—Important and reliable data. Data that if out of sequence or faulty
    can cause harm to property or security. For example, financial transactions, credit
    cards, PIN numbers, digital signatures, electronic money, trade secrets, virus
    scanner updates, and product updates.


    +   - Important—Data that requires proper functionality. Any loss can cause malfunction.
    For example, X11 connections, FTP downloads, Web pages, server/router addresses,
    and Telnet connections.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - Informational—Data that can be less than 100% reliable for proper functionality.
    For example, email, news feeds, advertisements, and Web pages.

    - Temporal—Data that is date/time bound. Unless the program uses the information
    within a specific time, its importance lessens. For example, weather data, surveillance
    data, and time.

    - Lossy—Data that can degrade without loss of usefulness. These are typically
    audio or visual. For example, movies, audio files, photos, and spam (of course).


    Prior to choosing the packet type or protocol, try to categorize data according
    to this list. Also include the additional (or external) constraints of the program.
    These may be regulatory constraints as well.


    # Protocol Fragmentation


    Large messages on slow networks can frustrate other users. All networks place
    a maximum frame size so those large messages don''t dominate the network. Keep
    in mind that the routing host may still carve up, or fragment, large messages
    that go through a constricted network.


    Each protocol has a different likelihood of fragmentation. Since reassembling
    fragmented messages is part of IP, the reassembly may be transparent to the higher
    protocols. Certain circumstances, however, may require the packet''s wholeness.
    This is particularly important for network performance. When routers carve up
    the packet into smaller chunks, the router has to take the time to chop up the
    message, and the resulting packet overhead increases. By blocking fragmentation,
    the network drops the packet and returns a message-too-big error to your program.


    # Packet Types


    The following sections describe each packet, showing its statistics and header
    definition (if there is one). Each section uses a quick-reference style to help
    you quickly see the features of each protocol. Use this style to help you choose
    the right packet for your applications.


    # The Raw Packet


    A raw packet has direct access to an IP packet and header. It is useful in writing
    special or custom protocols. Its attributes are listed in Table 3.3.


    Table 3.3, Raw Packet Attributes


    | | |

    | :--- | :--- |

    | Message Size (bytes) | 65,535 (65,515 max data payload) |

    | Overhead (bytes) | 20–60 |

    | Reliability | Low (network may drop or rearrange packets) |

    | Message Type | Datagram |

    | Throughput | High (low system overhead) |

    | Data Integrity | Low (system does not validate message) |

    | Fragmentation | Yes |


    Linux provides the option to work with different layers in the Internet Protocol
    stack (refer to Chapter 5, "Understanding the Network Layering Model," for a complete
    definition of the layers and IP stack). The most basic TCP/IP message is the raw
    IP message. It has no information other than the most basic.


    You can use the IP packet itself to create the most basic layer to create your
    own custom protocols. Access the IP packet by selecting SOCK_RAW in the socket()
    system. For security, you must have root privileges to run a raw socket program.'
  merge: -1
  img_proc: true
