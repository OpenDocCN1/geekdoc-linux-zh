- pgno: 291
  md: 'With the extended addresses, the physical appearance has changed and has included
    some shorthand notation for ease of representation and programming. Porting programs
    from IPv4 to IPv6 is straightforward as long as you follow the guidelines and
    examples in this text. The **socket**() system call really helps network programming
    to adapt to different networks.


    The IPv6 network encompasses the IPv4 network, so all IPv4 addresses still work.
    Most operating systems that support IPv6 may likely use a dual stack to support
    and translate between the two networks. The addressing scheme and translation
    inside these dual stacks permit some implicit collaboration—requiring little reprogramming
    for support.


    The Linux kernel, as of 2.2.0, supports IPv6, but not all operating system distributions
    install a compiled kernel with this feature enabled. In fact, if your distribution
    does not include a kernel compiled with IPv6, the distribution does not likely
    have the updated tools either. This chapter describes how to get IPv6 working
    on your Linux host.


    Additionally, this chapter demonstrated by example how to translate IPv4 programs.
    It also introduced two new tools to help in address conversion. Supporting IPv6
    in your programs increases the likelihood of the future use of your work.


