    # Threads


    Threads are another kind of task. This section defines a few library calls from
    the pThreads library.


    # pthread_create()


    This call creates a lightweight kernel process (thread). The thread starts in
    the function that start_fn points to using arg as the function''s parameter. When
    the function returns, the thread terminates. The function should return a void*
    value, but if it doesn''t, the thread still terminates and the result is set to
    NULL.


    # Prototype


    ```

    #include <pthread.h>

    int pthread_create(pthread_t *tchild, pthread_attr_t *attr,

    void (*start_fn)(void*), void *arg);

    ```


    # Return Value


    This is a positive value if successful. If the thread-create call encountered
    any errors, the call returns a negative value and sets errno to the error.'
