- pgno: 135
  md: 'With today''s time demands, it''s a good idea to investigate time-saving methods
    for your network. So it''s good to keep in mind that your computer has a fundamentally
    critical, limited resource: the CPU. Every task on the system demands time from
    it, and every task has to share that time in small portions. At the most basic
    level, every task shares CPU time with time slicing. Linux uses a more dynamic
    scheduling algorithm that adapts to CPU use and I/O blocking.


    When a program runs, it is either executing or waiting for something (*blocking*).
    The program encounters two kinds of blocking: I/O-bound (spends more time waiting
    for I/O) and CPU-bound (spends more time in computation). During the I/O down
    time, other tasks can run and complete their assignments. This is how most tasks
    cooperate and share the CPU''s limited time. When a task has to wait for I/O,
    it yields (*blocks*) so that another task can run.


    You may not want to wait for a particular I/O to complete before continuing other
    tasks. For instance, consider how annoying it would be to have a browser that
    allows you to quit only *after* it has completely loaded a page. On the other
    hand, think of a client that simultaneously connects and loads resources from
    several servers. When you manage your pipeline well, it is always full, and you
    get the most out of your network connection.


    When you retain control of the CPU while waiting for I/O to finish, you can increase
    the program''s usability and reduce user frustration. One way to retain this control
    is through nonblocking I/O and timeouts. Nonblocking I/O lets you check the I/O
    subsystem or gets the kernel to tell your program when it''s ready for more data.
    This frees up your program to focus on the user or some CPU-intensive algorithm.


    Effective management of I/O blocking may work with or be an alternative to multitasking
    and multithreading. It''s another programming tool to help you get your job done.


    Choosing when to block and when not to block is very tricky. This chapter presents
    some ideas and rules of thumb to help you select the best situations.


    # ## I/O Blocking: Why?


    The multitasking environment empowers you to do many things at the same time.
    In fact, when designed right, the result is 100% scalable to symmetric multiprocessing.
    This power has some limitations and rules. If you don''t abide by those rules,
    the system suffers.


    One rule to consider is that every task has to yield time to other tasks. The
    system builds this rule into everything that it does. For instance, each task
    gets a slice of time from the CPU. If there is nothing to do, the task yields
    up its slice. But how does the task know whether there is anything to do? Isn''t
    it always doing something?


    Well, yes and no. The primary cause of having nothing to do is waiting for some
    I/O to complete. Just for scale, consider the speed of the processor against the
    speed of the disk or the network.


    Even with very fast disk arrays, you may have a transfer rate of 160MB/s and a
    seek/latency time of 5ms. If a task is running on a 500MHz Pentium III, each instruction
    is effectively taking one clock tick. You can expect an average of 2~4ns per instruction.
    In the amount of time that a seek takes to finish, your program could have executed
    about 1,250,000 assembler instructions (*opcodes*).


    **NOTE**


    EnergyStar Delays'
