    \ handlers, do not support the contexts that standard methods require. So if,\
    \ for example, you want to capture various signals in a class, you must declare\
    \ the signal handlers as static methods.\n\n# Destructors: What Requires Cleanup\n\
    \nJust as constructors initialize the object and get it ready for use, destructors\
    \ reverse some of the steps and get the object ready for the free heap. Unlike\
    \ Java, which uses a garbage collector to free up space, C++ requires you to manually\
    \ clean up objects.\n\nOften, the objects are self-contained and require little\
    \ more than freeing the space. However, some classes (such as SimpleString and\
    \ TextMessage) use some of the heap. The compiler cannot tell if the pointers\
