    Therefore, no matter what happens, you can improve the implementation (boosting
    performance, increasing reliability, fixing defects). The ability to change libraries
    or modules in and out is *pluggability*.


    You need to follow certain rules to produce pluggable code. First, define an interface
    and stick to it. A thoroughly thought out interface determines the longevity of
    the module. If the interface cannot keep pace with evolving needs, designers discard
    it for a newer (sometimes less proven) technology. A good (but often confusing)
    example of a flexible interface is the `socket()` system call itself. While initially
    less than intuitive, the interface is so flexible that it has survived several
    years of network development and many networking technologies.


    The second rule for pluggable code is *minimalism*—making the interface as simple
    as possible increases the likelihood of adoption. *Coupling* is the number of
    distinct connections (or, in terms of modules, the number of distinct data elements
    passed in) a system has. Increasing the coupling increases dependence and reduces
    adaptability. Socket programming actually is a mixture of simplified interfaces
    with complex interfacing. To get a socket running, you have to make several system
    calls (up to seven). While this provides a lot of adaptability, it does nothing
    to help the programmer. The only reason sockets have survived for so long is their
