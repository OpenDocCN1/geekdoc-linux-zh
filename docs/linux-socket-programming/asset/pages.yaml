- pgno: 26
  md: 'The previous chapter introduced you to the socket. This chapter expands the
    topic with more of the Socket API. First it discuses the IP numbering system,
    how routing works at an abstract level, correct binary formats, and different
    socket types.


    # An IP Numbering Overview


    The IP numbering uses a fixed-length address. This restriction required a great
    deal of planning when the protocol was designed. The protocol provided solutions
    to several issues during its lifetime: computer identification, network organization,
    routing, and address resolution. Now it faces new issues such as explosive growth
    and address loss.


    # Computer Identification


    Networks involve sharing a single resource (the network cable) with several computers.
    Because of all the information that could flow on a network medium, each computer
    must accept the information. However, if every computer on your network were named
    Bert or Ernie, other hosts would not be able to determine the actual destination.
    Every network computer requires a unique identification (ID). But that is not
    all.


    # NOTE


    Facing Address Collision


    A workstation does not work very well with the network when it shares an address
    (address collision). Anyone who has tried to track down an address collision can
    attest that it is pretty hard to fix. It''s even worse when one of the computers
    is supposed to be using some dynamic address allocation (like DHCP). The most
    obvious (and laborious) way to solve this problem is to look at each computer
    in the area.


    Networks are dynamic and tend to increase in complexity. The computer has to be
    easily locatable by its ID as the network expands. All information placed on the
    network consumes a portion of that valuable real estate, so no unnecessary information
    should be included in the message.


    Some networking systems include a routing map in the message. Each server in the
    list gets the message and passes it on to the next server. This approach reduces
    the throughput of the network by lowering the ratio of header to real data. If
    you encode the directions to the destination in the address itself, the routing
    map becomes unnecessary.


    Network-connected computers already have a unique ID called the *Media Access
    Control (MAC)*: one example is the ethernet ID. Your computer uses this ID to
    do network booting (diskless systems that only have RAM and all permanent storage
    is on a server). The ethernet ID is six bytes long, and you usually see it written
    in hexadecimal: `00:20:45:FE:A9:0B`. Every ethernet card has one, and it is unique.


    Unfortunately, you cannot use that ID for identifying your computer exclusively.
    It has two fundamental problems. First, every routing server must acquire every
    ID on the network. The database of IDs could get very large and could significantly
    slow the routing time for each message. Second, not every interface has a MAC
    (PPP, for example).


    The computer ID could have a built-in mechanism for routing the message. This
    mechanism is like addressing a letter: most general to most specific. Internet
    IDs solve the uniqueness issues while providing hints for the routing issues.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'IP addresses provide several advantages over the hardware-supplied MAC. First
    the number can change (it is not fixed), so deploying consistent clusters of addresses
    is easier, and laptops don''t run into problems. The network can map the IP to
    the hardware MAC using the *Address Resolution Protocol* (*ARP*). See the Request
    For Comment #826 [RFC826] on the accompanying CD-ROM.


    # NOTE


    Address Resolution Protocol (ARP)


    The ARP is a simple translation table that takes the IP and fills in the associated
    MAC. All messages on the network must have a MAC so that the adaptor (or drivers)
    can pick up the message. The source may not know the MAC of the destination host,
    which hides deeply behind several routers. The router instead sends the message
    to routers that control the sub-networks (or subnets) defined in the IP address.
    When the message gets to a router with ARP, it checks the tables. If the router
    find the IP address, the packet’s MAC gets the correct destination. Otherwise,
    the router sends a broadcast into the subnet to resolve the IP address.


    # Internet ID Organization


    The Internet ID uses a most-to-least–specific addressing scheme. Each ID is a
    four-byte number, like the ethernet ID. The first number, reading from left to
    right, is the network *class*. Look at Figure 2.1.


    ![](img/03334662da8fdfb8d95a02f270c522f6_27_0.png)


    ![](img/03334662da8fdfb8d95a02f270c522f6_27_1.png)


    The IP address acts as a general roadmap to the routers. Each part of the address
    provides more specific information about where the destination is. Beginning with
    the network class, the address ends with the host number. You could easily compare
    it to an address on an envelope: The first line is the addressee, then the street
    address or box number. The detail decreases in the address until the state or
    country.


    Internet addressing has five basic address classes. Each class is a block of allocations
    for very large to small networks. The Internet addressing plan is organized so
    that companies may buy segments from the addressing space. The classes are labeled
    A–E:


    | Class | Address | Address Range, Description |

    |---|---|---|

    | | 0.0.0.0 to 0.255.255.255 | (*Reserved*) |

    | A | 1.0.0.0 to 126.255.255.255 | 224–2 or 16,777,214 nodes for each allocation
    segment. This class has 126 segments. |

    | | | Used in very large organizations that subnet as needed, such as Internet
    service providers (ISPs). |'
  merge: -1
  img_proc: true
- pgno: 28
  md: '||127.0.0.0 to<br>127.255.255.255|**(Reserved for loopback interface)**|

    |B|128.\*\*\*.0.0 to<br>191.\*\*\*.255.255|$2^{16}–2$ or 65,534 nodes for each
    allocation segment. This class has 64×256 available segments.|

    |||$Used in large organizations such as companies and universities. They may create
    subnets. The XXX is the allocated and assigned subnet (for example, 129.5.0.0
    is an allocated subnet). Note: This address space is almost used up.|

    |C|192.\*\*\*.\*\*.0 to<br>223.\*\*\*.\*\*.255|$2^8–2$ or 254 nodes for each allocation
    segment. This class has 32×65,536 available segments.|

    |||Small companies or individual. The address has several slots available here.|

    |D|224.0.0.0 to<br>239.255.255.255|$2^{28}–2$ or 268,435,454 nodes.|

    |||These addresses are not allocated but are reserved for multicasting addresses.|

    |E|240.0.0.0 to<br>255.255.255.255|$2^{28}–2$ or 268,435,454 nodes.|

    |||These are reserved for future use. Please note that **255.255.255.255** is
    a general broadcast IP address. It is **never a legal** address.|



    The network classes are numbered peculiarly, because the addressing uses the first
    bits of the address to determine the class. For example, the Class A network has
    a zero in the first bit of the address. Likewise, the Class B has a one in the
    first bit and a zero in the second bit:


    +   Class A: **0 (0000,0000) to 126 (0111,1110)**

    Class B: **128 (1000,0000) to 191 (1011,1111)**

    Class C: **192 (1100,0000) to 223 (1101,1111)**

    Class D: **224 (1110,0000) to 239 (1110,1111)**

    Class E: **240 (1111,0000) to 255 (1111,1111)**


    Using this approach historically, the routers on the network can quickly determine
    (within four bits) whether to let the message enter the gate. Today the routing
    is more efficient, using **Classless Internet Domain Routing (CIDR)**. These new
    definitions (found in **RFCs 1517–1519**) identify the location and route of a
    host using the upper bits of the address.


    The IP protocol introduced this numbering scheme for computer identification to
    cluster these computers in an efficient way. With it, a router can quickly determine
    whether to block a packet or move it to the interface that leads to the destination
    subnet. **Propagation** is very important: Simply receiving a packet, checking
    it, and passing it on is not acceptable. Each bit that the router accepts means
    a delay on the network. The router must delay no more bits than necessary to determine
    the relevance. In other words, it must be invisible to propagation delays. For
    example, typical telephone switching in the United States of America does not
    try to resolve the whole phone number at once; the first three digits indicate
    an area or region, and the next three digits indicate the station.


    # Subnetwork Masks


    Some of the classes require more filtering. A network with 16 million nodes is
    excessive if all are clumped in one space. As you set up your Linux computer and
    configured the network, you may'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'have noticed the term subnet mask. The introduction of CIDR has helped to simplify
    the complexity of large subnets [RFC950].


    The network subnet mask is specifically for identifying the group of contiguous
    addresses an interface can reach. It provides an additional filter that permits
    only specific messages to pass through. When a message arrives, the router uses
    the subnet mask on the message''s destination address. If it matches, the router
    passes the message on. You may build mask any way you wish, but the least significant
    set bit specifies the subnetwork.


    For example, if you had a small network of eight machines, and you expected the
    group to grow by no more than five machines, you could set your router subnet
    mask to 187.35.209.176. The last bit in the address is in the 176 (1101,0000).
    The address range is in ''X''part (active subnet) of 1101,XXXX. From here, you
    can dole out the addresses: 187.35.209.176 (router), 187.35.209.177 (host #1),
    up to 187.35.209.222. You can have any combination, but the least significant
    set bit is the marker.


    # NOTE


    Subnetwork Masks and Default Addresses


    Using the network mask as a host address may cause conflict and lose packets.
    This is due to the special address 0 (zero). The example, 187.35.209.0, has the
    last eight bits as zeros. If the address matches the network mask, it is the zeroth
    address. You should always reserve the zeroth address for the network address
    mask. Likewise, you may have noticed that the example omits 187.35.209.223. If
    you were to use that ID, that host may never see a message. The number 223 has
    the active subnet as all ones: 1101,1111. This is a broadcast address. You should
    not use that as a host address.


    In most cases you do not need to worry about setting up routers, and the configuration
    is beyond the scope of this book. Usually, when you see the subnetwork mask in
    the network configuration, you can accept the mask that the script offers you.


    # Routers and Address Resolution


    Local area networks (LANs) can become very burdened by all the messages between
    hosts. Every computer on the Internet potentially could hear every message. But
    with all the traffic, the networks become very cluttered, packets collide with
    others (simultaneous transmissions), and throughput drops to near nothing.


    LANs use addressing and submasking to limit the traffic within groups (or clusters)
    of computers. Beyond passing messages to the appropriate interfaces, routers act
    as information control gates that localize the traffic. Local traffic stays inside
    the cluster, and external traffic passes through.


    The host uses the subnet mask to determine if it must pass a message to the router.
    All messages destined for the outside pass through the router, and local messages
    remain inside the subnetwork. This process reduces congestion on the network backbone.


    Routers also direct messages toward the destination using their routing tables.
    Each router tells others on the network what it can accept for directing traffic.
    Wide area networks (WANs) use this feature to deliver messages.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Each step along the way between the source and the destination looks at the
    IP address, comparing the networks with the routing tables. The routers move your
    message toward a more and more specific destination. The first hop tries to resolve
    it in the cluster, the second moves the message up to resolve in the subnetwork,
    and so on, until it resolves the class.


    As soon as a router finds a match (either general or specific), it moves your
    message in that direction, using the MAC address to send the message to the next
    router. Eventually the matched cluster gets the message, and the router''s ARP
    replaces the router MAC with the destination MAC.


    An ethernet network adapter accepts only messages with its ID. As soon as the
    host boots up and stabilizes, it tells everyone else on the subnetwork its ethernet
    ID and IP address. This is the function of ARP, as mentioned previously.


    # Special and Dwindling Addresses


    As mentioned earlier, there are some reserved addresses. The active subnet of
    a subnetwork mask has two reserved addresses: all zeros (network) and all ones
    (broadcast). This means that when you count how many addresses you have at your
    disposal, you must subtract 2 from that number. Consider this: If you create 100
    subnetworks, you effectively lose 200 addresses.


    This loss is just the beginning. Two large blocks of addresses are reserved for
    internal use: 0.0.0.0 to 0.255.255.255 and 127.0.0.0 to 127.255.255.255. The first
    address group means "this network" in IP shorthand (see the shaded note that follows).
    If you have a network address of 128.187.0.0, using 0.0.25.31 in a message results
    in 128.187.25.31, implicitly.


    In 1992, the Internet Activities Board (IAB—see RFC1160 for the design, engineering,
    and management of the Internet), became very concerned with the explosive growth
    of the Internet—even with all the addressing techniques and careful planning.
    The allocation of addresses exceeded 450 million nodes. The Board saw increased
    allocations chewing up the available address space. However, only about 2% of
    the allocations were actually used. Where were all the remaining addresses?


    IAB allocates address ranges to companies in whole blocks. The companies, in anticipation
    of additional use and to keep their addresses as contiguous as possible, buy larger
    ranges than they need.


    # NOTE


    # Allocation Inflation


    One small place I worked showed me its allocation of 128 addresses; only 30 were
    in use at the time. They carved out 10 slots for me. I never used more than 2.
    To this day, I think those addresses may still be allocated to me, even though
    I left the company about four years ago.


    In all, address exceptions and squandered allocations have eaten up most of the
    address space. Recent estimates indicate that Class B and Class C networks are
    full. ISPs are using more of Class A. Before long, the demand may use up all the
    addresses.


    What is the Internet going to do with the lost address space? How can the current
    IP addressing be better used? The IAB, now called Internet Corporation for Assigned
    Names and Numbers (ICANN), cannot easily reclaim the unused slots sold to companies,
    because the companies''IT departments have already allocated those addresses within
    the organization.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Many companies now use Dynamic Host Configuration Protocoi (DHCP) [RFC2131],
    which allocates an IP address upon bootup. No host owns an IP address permanently.
    DHCP also helps with security: Computer crackers love fixed IP addresses. If you
    recall, bootp sends out a broadcast message to find a bootp server. When found,
    the server issues an IP address. Similarly, a normal host loads its DHCP requestor
    during bootup. The requestor sends a broadcast message to find a responsive DHCP
    server. When found, the server allocates an address from its pool of available
    addresses and passes it (along with the appropriate network mask) to the requestor.


    The DHCP requestor accepts the information and configures the local host’s network
    protocols. In some cases this can take several seconds, due to network congestion.
    Until the local host is properly configured, it may suffer from IP amnesia (the
    host won’t know its own address).


    # **NOTE**


    Host or IP Amnesia


    Host or IP amnesia also occurs when network and host naming are not properly set
    up. This can be a significant problem. Even ping 127.0.0.1 may not work. If your
    host has amnesia, check your distribution. The RedHat Distribution (and derivatives)
    use /etc/sysconfig/network and /etc/sysconfig/network-scripts/ifcfg-* to define
    and set the values.


    Another solution is to lengthen the IP address size itself. Introducing: IPv6
    [RFC2460]! IPv6 in a nutshell is four times the size of an IP address: 128 bits
    versus 32 bits. IPv6 changed the appearance dramatically as well:


    ```

    001 8008:4523:F0E1:23:830:CF09:1:385<br>

    002 <Snope>

    ```


    The result is a not-so-memorable address.


    The primary advantage of IPv6 is that it has a much larger address space to work
    with. More than 3×10^38 addresses probably removes any problem of address limitations
    for a very long time. See [Chapter 17, “Sharing Messages with Multicast, Broadcast,
    and Mbone,”](#) for more information.


    # IP Host Port Numbers


    All messages arrive at one or more recognized address. If a program accepts these
    messages, it may receive information destined for other running programs. The
    operating system has little regard for where the message goes, as long as it delivers.
    The TCP/IP stack adds the concept of a port. One system can have several ports
    available, all associated with the same address.


    The TCP/IP stack adds the ports to abstract the network and ease programming for
    you. These are not real, physical ports. They are channels that the networking
    subsystem uses to redirect information to the appropriate program. All network
    programs no longer receive all messages; they receive only the messages for their
    port.


    Every typical IP data packet on your Internet-based network has the address of
    the host and the port number. When a packet arrives from the network, the 16-bit
    field in the packet header indicates the destination port number. The operating
    system reads this field and places the new packet on the port’s queue. From there,
    the program reads the socket (with either the read() or recv() system call).'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Likewise, when the program transmits a message (via the write() or send() system
    call), the operating system places the data in the port''s outgoing queue.


    By default, only one program owns a port. In fact, if you attempt to run two programs
    that allocate the same port number on the same computer, the system call returns
    an EINVAL error code. You can elect to share a port using SO_REUSEADDR (see Chapter
    9, "Breaking Performance Barriers").


    # NOTE


    # Sharing Ports on SMPs


    The rule that no two sockets can share the same port applies to symmetric processors
    as well. The reason is simple: The processors, like resources, share the memory
    and operating system. If you were to have two operating systems running, you could
    theoretically have two sockets in separately running programs with the same port
    number, as long as they reside in different operating system spaces.


    All the standard services have assigned port numbers. You can see the complete
    list in /etc/services, in Appendix A, "Data Tables," and on your Linux workstation.
    Here are a few standard ports:


    | Port | Service Name, Alias | Description |

    | --- | --- | --- |

    | 1 | tcppmux | TCP port service multiplexer |

    | 7 | echo | Echo server |

    | 9 | discard | Like /dev/null |

    | 13 | daytime | System''s date/time |

    | 20 | ftp-data | FTP data port |

    | 21 | ftp | Main FTP connection |

    | 23 | telnet | Telnet connection |

    | 25 | smtp, mail | UNIX mail |

    | 37 | time, timeserver | Time server |

    | 42 | nameserver | Name resolution (DNS) |

    | 70 | gopher | Text/menu information |

    | 79 | finger | Current users |

    | 80 | www, http | Web server |


    You can find a more complete list in Appendix A.


    You probably recognize a few of these services. The file''s format is clear: Port
    Number, Service Name, Alias, and Description. You can interact with many of them
    using Telnet or the program listed earlier. Note that even though /etc/services
    may list a server, the computer may not have the associated server running (for
    example, the Mandrake distribution does not enable the time services). All the
    ports listed in the /etc/services file are reserved, so any use may cause conflicts.


    Your sockets-based program uses some local port for all communication: This is
    bind()''s primary responsibility. Even if you do not use the bind() system call,
    as soon as your program uses the socket for any I/O, the operating system assigns
    an available local port to the socket.


    # NOTE'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Privileged Ports


    As part of the kernel’s security, ports with values less than 1024 require root
    or privileged access. For example, if you wanted to create a time server (port
    13), root would have to run that program (or *SUID root*). SUID is an acronym
    for “set user ID.” Each program in the file system can allow users to run it as
    if the owner were running it. Normally, when a user runs a program, the program
    has the same rights as the user. Sometimes the program needs different or extra
    rights. By switching the user ID, the program can run as if the owner were running
    the program. For example, `/usr/bin/at` requires accessing the cron tables (owned
    by root). For this to occur, `/usr/bin/at` must switch automatically to root access.
    For more information, refer to standard UNIX documentation. Warning: SUID root
    is a potential source of security risks. Never create or set the SUID while you
    are root, unless you know the program very well and know all the risks.


    As noted previously, if you do not assign a port to a socket, the operating system
    assigns one for you. These automatically or dynamically assigned ports are called
    *ephemeral ports*. Linux appears to follow the BSD style in port assignment: It
    assigns port 1024 and greater to ephemeral ports.


    # **NOTE**


    # Secure Debugging


    When experimenting with different ports, you may want to follow these simple rules:


    +   - Program, run, and debug as a regular user (not as root).


    - Use ports and addresses that do not affect others or cause security risks.


    - Log the source of all incoming messages.


    # Network Byte Ordering


    Many different types of computers may reside on a network, but they may not all
    use the same processor. Not all processors store their binary numbers in the same
    way. Computers use two basic types of binary number storage: *big-endian* and
    *little-endian*. Simply, big-endian numbers read from left to right; little-endian
    numbers read from right to left. For example, consider the number 214,259,635.
    In hexadecimal, the number reads as `#0CC557B3`. A big-endian processor stores
    this value like this:


    | Address: | 00 | 01 | 02 | 03 | 04 |

    | Data:    | 0C | C5 | 57 | B3 | ...|


    Note that the most significant byte (*0C*) is listed first. The little-endian
    processor stores it in reverse:


    | Address: | 00 | 01 | 02 | 03 | 04 |

    | Data:    | B3 | 57 | C5 | 0C | ...|


    Note that the least significant byte (*B3*) is listed first.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Usefulness of the different endianness is a long-debated topic. This is not
    to resurrect these discussions, only to point out the important uses and differences.
    Of course, why couldn''t you just use hexadecimal ASCII? The representation is
    inefficient, essentially doubling the number of needed bytes. For computers on
    a heterogeneous network to communicate efficiently, they have to use binary and
    must settle on one endianness. The endianness of the computer or host is the *host-byte
    order*. Likewise, the endianness of the network is called *network-byte order*.
    The network byte order is always big-endian.


    # ### Using Internet Conversion Tools


    Many years ago, the network protocol chose to speak big-endian. That''s just fine
    for big-endian processors, but what about little-endian ones? Several tools are
    available that help do the conversion. Network programs use these tools all the
    time for filling the struct sockaddr_* structure, regardless of the process''s
    endianness. Now, for another hitch: Not all fields in the structure are network
    ordered. Some are host ordered. Consider the code excerpt from *Chapter 1, "Introducing
    the Cookbook Network Client":*


    ```

    ```c

    /***************************************************************/

    /***  Conversion tools example: filling sockaddr_in     ***/

    /***************************************************************/

    struct sockaddr_in dest;

    char *dest_addr = "127.0.0.1";

    ...

    dest.sin_family = AF_INET;

    dest.sin_port = htons(13);    /* port #13 (time server) */

    if ( inet_aton(dest_addr, &dest.sin_addr) == 1 ) {

    ...

    ```


    ```


    The code is filling three fields: `sin_family`, `sin_port`, and `sin_addr`. `sin_family`
    is a host-ordered field, so it does not need conversion. The other two are network
    ordered. The two-byte field `sin_port` converts port 13 using `htons()`. There
    are several converters like this:


    | Call | Meaning | Description |

    | :--- | :--- | :--- |

    | `htons` | Host to Network Short | Converts 16-bit binary to big-endian. |

    | `htonl` | Host to Network Long | Converts 32-bit binary to big-endian. |

    | `ntohs` | Network to Host Short | Converts 16-bit to host format. |

    | `ntohl` | Network to Host Long | Converts 32-bit to host format. |



    Appendix B, "Networking API," lists these functions with greater detail. You may
    be interested to know that using these tools does not cost anything in CPU time
    if your computer is already big-endian (network-byte ordered).


    The next call in the example, `inet_aton()`, converts the ASCII IP address (using
    dot-notation) into the equivalent binary. It also converts into the network ordering
    (you don''t need to call `htonl()` on the result). Here are a few others:


    | Call | Description |

    | :--- | :--- |

    | `inet_aton()` | Converts dot-notation (`###.###.###.###`) into network-ordered
    binary. It returns zero if it fails and nonzero if the address is valid. |

    | `inet_addr()` | Obsolete (same as `inet_aton()`). It does not handle errors
    correctly. If an error occurs, it returns `-1` (`255.255.255.255`—the general
    broadcast address). |'
  merge: -1
  img_proc: true
- pgno: 35
  md: "| `inet_ntoa()` | Converts a binary, network-ordered IP into ASCII dot-notation.\
    \ |\n| `gethostbyname()` | Asks the name server to convert the name (such as http://www.linux.org)\
    \ into one or more IP address. |\n| `getservbyname()` | Gets the port and associated\
