    Network programs always have a sender and a receiver. Generally, the sender is
    a client that connects to a service offered by a networked computer. *Part 1*
    of this book, "Network Programming from the Client Perspective," covers in detail
    the client''s standpoint—how to connect to a server, how to create connectionless
    communications, and how to use the IP- supporting tools. This chapter introduces
    the other half: the receiver or the server''s perspective of the process.


    The server''s perspective completes the client/server interaction. To illustrate
    the relationship between the client and server, you might compare the network
    to a telephone system and the server to the central phone number of a large company
    that routes calls to its employees. The client connects to one of the employees
    through the central number and an extension. From this example, you can see how
    a server on the network accepts connections from a client. The main number is
    the host''s address and the extension is the service port.


    Servers request a specific port number—the port that the client knows. Similar
    to publishing a telephone number, if the server does not get the number it wants,
    the client cannot call it.


    This chapter turns the perspective around from asking for services, as discussed
    in *Part 1*, to offering them. It takes you step by step through the process of
    writing and building a server. At the conclusion, a small HTTP directory server
    shows you how to connect to a Web client and how to package HTML messages.


