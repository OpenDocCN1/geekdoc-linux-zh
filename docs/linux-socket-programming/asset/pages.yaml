- pgno: 330
  md: "# Tasks\n\nTasks include both processes and threads. Threads (pThreads) are\
    \ defined in the next section; this section covers processes and low-level tasks\
    \ (clones).\n\n# fork()\n\nCreate a new process (independent task) at this call.\
    \ This call creates a child process to run with the parent. You must be careful\
    \ that you capture the child and direct it to its assigned task; otherwise, the\
    \ child runs each statement the parent does (they run together).\n\n# Prototype\n\
    \n```\n#include <unistd.h>\npid_t fork(void);\n```\n\n# Return Value\n\n| | |\n\
    |---|---|\n|0|The task that gets this is the child.|\n|>0|The task that gets this\
    \ is the parent.|\n|<0|The parent failed to create a new child; check errno.|\n\
    \n# Parameters\n\n(none)\n\n# Possible Errors\n\n| | |\n|---|---|\n|EAGAIN|The\
    \ fork() cannot allocate sufficient memory to copy the parent's page tables and\
    \ allocate a task structure for the child.|\n|ENOMEM|The fork() failed to allocate\
    \ the necessary kernel structures because memory is tight.|\n\n# Example\n\n```\n\
    int PID;\nif ( (PID = fork()) == 0 )\n{  /*--- CHILD ---*/\n    /**** Run the\
    \ child's assignment ***/\n    exit();\n}\nelse if ( PID > 0 )\n{  /*--- PARENT\
    \ ---*/\n   int status;\n   /**** Do parent's work ****/\n   wait(status); /*\
    \ may be done in SIGCHLD signal handler */\n}\nelse /*--- ERROR ---*/\n    perror(\"\
    fork() failed\");\n```"
  merge: -1
  img_proc: true
- pgno: 331
  md: '# ### __clone()


    This is a low-level system call for creating tasks. You can directly control what
    is shared between the parent and the child. This is not for amateur programmers;
    you can create very unpredictable programs. (See Chapter 7, "Dividing the Load:
    Multitasking" for a complete description of this call.)


    # **Prototype**


    ```

    ```c

    #include <sched.h>

    int __clone(int (*fn) (void* arg), void* stacktop, int flags, void* arg);

    ```

    ```


    # **Return Value**


    `process ID` If negative, `errno` has the exact error code.


    # **Parameters**


    | fn | The home for the child task. Create a function (or procedure) that accepts
    a `void*` parameter argument. When the routine attempts to return, the operating
    system terminates the task for you. |

    | --- | --- |

    | stacktop | You must create a stack for the child task. This parameter points
    to the top of that stack (the highest address of the data block). Because you
    provide the stack, the stack is fixed in size and cannot grow like a normal task''s
    stacks. |

    | flags | Two types of information arithmetically ORed together; the VM spaces
    to share and the termination signal. This flag supports all signal types and,
    when the task terminates, the operating system raises the signal you define. |

    | | The available VM spaces are as follows: |

    | | CLONE_VM Share the data space between tasks. Use this flag to share all static
    data, preinitialized data, and the allocation heap. Otherwise, copy data space.
    |

    | | CLONE_FS Share the file system information: current working directory, root
    file system, and default file creation permissions. Otherwise, copy settings.
    |

    | | CLONE_FILES Share open files. When one task changes the file pointer, the
    other tasks see the change. Likewise, if the task closes the file, the other tasks
    are not able to access the file any longer. Otherwise, create new references to
    open inodes. |

    | | CLONE_SIGHAND Share signal tables. Individual tasks may choose to ignore open
    signals (using `sigprocmask()`) without affecting peers. Otherwise, copy tables.
    |

    | | CLONE_PID Share Process ID. Use this flag carefully; not all the existing
    tools support this feature. The PThreads library does not use this option. Otherwise,
    allocate new PID. |

    | arg | You can pass a pointer reference to any data value using this parameter.
    When the operating system finishes creating the child task, it calls the routine
    `fn` with the `arg` parameter. If you use this feature, be sure to place the value
    `arg` points to in the shared data region (`CLONE_VM`). |


    # **Possible Errors**


    | EAGAIN | The `__clone()` cannot allocate sufficient memory to copy the parent''s
    page tables and allocate a task structure for the child. |

    | ENOMEM | The `__clone()` failed to allocate the necessary kernel structures
    because memory is tight. |'
