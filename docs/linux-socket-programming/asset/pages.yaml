    You can also simply end the program, and the program cleans up the connections
    for you.


    # NOTE


    # Multicast Cleanup


    You may want to drop the multicast group manually. This is one of the few times
    that automatic process cleanup is not a good idea. If the kernel has any problems,
    no errors appear if you simply terminate the program. Also, you could be receiving
    messages after your program terminates. This would leave the ports unavailable
    or garbled for new program instances. Closing manually lets the program see any
    errors on the connection, helping you debug.


    Joining a multicasting group is relatively easy. In fact, creating a local multicast
    group simply requires selecting an unused IP address. Global addresses are a different
    matter. If you want to publish an Internet multicast service, you may have to
    request an address (and port) from the IAB.


    # Sending a Multicast Message


    Sending a message to a multicast group is as easy as sending a datagram message.
    Remember, UDP lets you connect to that address, simplifying the multicast send
    and receive.


    # NOTE


    # Owning Multicast Addresses


    Even though you can set up an address for a specific service, you cannot guarantee
    ownership of that address. Others can send messages on that address as well. If
    your service requires a certain amount of continuity, you may want to provide
    a way to distinguish your messages from others. The client still picks up all
    the messages sent on the network. It''s left to the kernel and your program to
    sort out the real messages.


    An interesting side effect in the making of multicasting has great potential:
    you do not have to be a member of a multicast group to send a message. A program
    can simply send the message to the broadcast address/port. A streaming multicast
    server may, in fact, never really join the multicast group. To receive messages,
    you must join the group.'
