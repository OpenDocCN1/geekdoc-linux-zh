- pgno: 69
  md: '# Checking Linux sockaddr Support


    The Linux kernel supports several different types of addressing protocols, but
    not all protocols are directly included in the distribution kernels. For example,
    the distribution kernels often omit the amateur radio protocols. If you are uncertain
    which binding protocols your compiled kernel supports, simply run your program.
    The bind(), sendto(), connect(), and recvfrom() system calls complain if they
    receive a sockaddr they don''t understand. You can find a list of the supported
    sockaddr in Appendix A, "Data Tables."


    The UDP/TCP senders must know what port the receiver is listening on so that the
    operating system routes the packet to the correct program. This port is usually
    an agreed-upon port number between sender and receiver. For example, the /etc/services
    file lists the published port numbers that provide standard services.


    # Binding the Port to Your Socket


    You can request a specific port number from the operating system using the bind()
    system call. You may have seen this call before, and regrettably most UNIX manual
    pages define it as a way to "name the socket." This definition refers to PF_LOCAL
    or PF_UNIX sockets that use the file system. A better description is "to bind
    a port number or other publishable interface to the socket."


    # NOTE


    # Name and Port Binding


    The port assignment and socket naming vary dramatically between each sockaddr
    family member. Some, such as AF_LOCAL and AF_AX25, are alphanumeric names; others,
    like AF_INET and AF_IPX, use ports. The port numbers must be unique, so in general
    no two TCP or UDP sockets can have the same port numbers (at least with AF_INET).
    However, you can have a UDP socket and a TCP socket share the same port number.
    That is how some services (in /etc/services) offer you both connections.


    The prototype definition of the bind() system call is


    ```

    #include <sys/socket.h>

    #include <resolv.h>

    int bind(int sd, struct sockaddr *addr, int addr_size);

    ```


    This section only introduces bind() ; for an in-depth description, see Chapter
    6. The use is similar to the connect() system call where you need to initialize
    the addr parameter first:


    ```

    /*****\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*/

    /***** Bind() example.

    /*****\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*/

    struct sockaddr addr;

    int sd;

    sd = socket(PF_INET, SOCK_STREAM, 0);

    bzero(&addr, sizeof(addr));

    addr.sin_family = AF_INET;

    addr.sin_port = htons(MY_PORT); /* request specific port */

    addr.sin_addr.s_addr = INADDR_ANY; /* any IP interface */

    ```'
