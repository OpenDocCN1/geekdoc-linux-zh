    # Client/Server Concurrency Issues


    A session may not malfunction because of something as catastrophic as a crash
    or an abort. When you work with concurrently running programs, you encounter concurrency
    issues that can cause similar deadlocks and starvation that threads and processes
    (multiprogramming) do. However, these are harder to detect.


    You need to understand that the concurrency problems found in network programming
    are not exactly like multiprogramming. The reason is simple: unlike the multithreaded
    program, client/servers and peers really don''t share resources. They are isolated
    and separate. The only link is the physical media of the network. Furthermore,
    the multiprogramming-type of deadlock is very hard (if not impossible) to untangle.
    You can untangle a network deadlock, but they still can deadlock and starve each
    other.


    # Network Deadlock


    Most network communications define a protocol of who talks first. For example,
    typically one sends requests while the other responds. That designation defines
    which end of the connection drives the protocol.


    To illustrate the interaction, please consider HTTP and Telnet servers. An HTTP
    server accepts requests from the client, making the client the driver for the
    protocol. A Telnet session, on the other hand, prompts the user for a username
    and password. Once logged in, the only time that user knows that the server can
    respond is when he sees the command prompt. The Telnet session can accept an asynchronous
    command using a keyboard interrupt (Ctrl+C).


    Network deadlock is simple: The client/server or peers forget which was to talk
    next, so they end up waiting for each other indefinitely. This form of deadlock
    is difficult to detect because it shows the same symptoms as a very congested
    network—both ends don''t hear anything for a while.


    You could place a timeout on the connections to solve this problem. This is a
    very good idea because no client or server (especially) should wait forever on
    the network. But timeouts do not tell you anything more than a message took too
    long to arrive.'
