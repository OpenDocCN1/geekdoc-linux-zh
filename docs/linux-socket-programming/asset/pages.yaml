  md: "# **Solving Unwanted I/O Blocking with `poll()` and `select()`**\n\nLinux offers\
    \ two tools to help you work with multiple open channels at the same time. These\
    \ tools are more efficient (and may be easier to implement) than manual polling.\
    \ The whole idea behind each tool is that the system call blocks until any channel\
    \ changes state.\n\nA state change includes conditions such as data being available\
    \ to read, a channel is clear for writing, or an error occurred. Upon return,\
    \ one or many of the channels may have changed state. The return value from the\
    \ call represents the number of channels that changed.\n\nHowever, the `select()`\
    \ system call is a little more complex and involves several macros to help manage\
    \ the descriptor lists:\n\n```\n```\n#include <sys/time.h>\n#include <sys/types.h>\n\
    #include <unistd.h>\nint select(int maxfd, fd_set *to_read, fd_set *to_write,\n\
    \        fd_set *except, struct timeval *timeout);\nFD_CLR(int fd, fd_set *set);\
    \    /* remove fd from set */\nFD_ISET(int fd, fd_set *set);   /* check if fd\
    \ is in set */\nFD_SET(int fd, fd_set *set);    /* add fd to set */\nFD_ZERO(fd_set\
    \ *set);           /* initialize set for use */\n```\n```\n\nThe main routine\
    \ is the `select()` system call. It has several helper macros (`FD_CLR()`, `FD_ISET()`,\
    \ `FD_SET()`, `FD_ZERO()`) to manage the descriptor lists. The parameters are\
    \ defined in Table 8.3.\n\n**Table 8.3, Parameters for the `select()` System Call**\n\
    \n| Parameter | Description |\n| :--- | :--- |\n| maxfd | One more than the highest-numbered\
    \ file descriptor in the set. (See below for more.) |\n| to_read | The set of\
    \ descriptors that await reading. This is the set that you want to test for reading.\
    \ |\n| to_write | The set of descriptors that await writing. |\n| except | The\
    \ set of descriptors that await priority messages. |\n| timeout | The time in\
    \ microseconds to wait before giving up. (See below for more details.) |\n| fd\
    \ | The file descriptor to add, delete, or test for. |\n| set | The set of descriptors\
    \ to manipulate. |\n\nThe `maxfd` parameter is the highest-numbered descriptor\
    \ slot in any of the three sets plus 1. Each task gets a number of I/O descriptor\
    \ slots (typically 1024). Each I/O channel occupies a slot (`stdin` is 0, `stdout`\
    \ is 1, and `stderr` is 2). If the sets had descriptors [3,6] in `to_read`, [4,5,6]\
    \ in `to_write`, and [3,4] in `except`, `maxfd` becomes 6 (the highest descriptor\
    \ number) plus 1, or 7.\n\nThe `timeout` parameter gives you the flexibility of\
    \ setting a limit to how long the system call waits:\n\n+   - If `NULL`, wait\
    \ indefinitely.\n- If positive, wait the specified microseconds.\n- If zero, return\
    \ immediately after checking all descriptors once.\n\nFor example, if you had\
    \ three channels open to clients numbered [3,4,6], you could wait for them to\
    \ send the program data like this:"
