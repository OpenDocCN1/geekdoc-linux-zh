  md: "Instead of using `signal()`, the preferred system call is `sigaction()`. The\
    \ `sigaction()` system call provides you more control over the behavior of the\
    \ signal subsystem. The following is its prototype:\n\n```\n#include <signal.h>\n\
    int sigaction(int sig_num, const struct sigaction *action,\n\tconst struct sigaction\
    \ *old);\n```\n\nYou use the first parameter to define which signal to capture.\
    \ The second parameter defines how you want to handle the signal. If you set the\
    \ last parameter to a non-`NULL` value, the call stores the last action definition.\
    \ The structure definition for the second and third parameters is as follows:\n\
    \n```\nstruct sigaction\n{\n    /* Function pointer to handler */\n    void (*sa_handler)(int\
    \ signum);\n    /* Specialized sigaction callback */\n    void (*sa_sigaction)(int,\
    \ siginfo_t *, void *);\n    /* Bit array of signals to block while in handler\
    \ */\n    sigset_t sa_mask;\n    /* behavior to perform */\n    int sa_flags;\n\
    \    /* (deprecated--set to zero) */\n    void (*sa_restorer)(void);\n};\n```\n\
    \nTo use this structure, you set the first field (`sa_handler`) to different values\
    \ than a function pointer. If you place `SIG_IGN` in this field, the program ignores\
    \ the specific incoming signal. Also, the program returns the behavior to the\
    \ default if you use `SIG_DFL`.\n\nTo permit or deny cascading signals (one signal\
    \ interrupting another), use the second field, `sa_mask`. Each bit (there are\
    \ 1,024 possible bits) represents a signal to permit (1) or block (0). By default,\
    \ a specific signal blocks like signals while servicing the first. For example,\
    \ if you are servicing a `SIGCHLD` signal and another process terminates, your\
    \ handler ignores that signal by default. You can change that behavior with `SA_NOMASK`.\n\
    \nThe `sa_flags` determine the behavior of the handler. Most of the time, you\
    \ can set it to zero:\n\n+   *   `SA_ONESHOT` Use the System V behavior of resetting\
    \ the handler once a signal is caught.\n*   `SA_RESETHAND` Same as `SA_ONESHOT`.\n\
    *   `SA_RESTART` Restart some system calls if a signal interrupts it. Use this\
    \ flag to restart system calls such as `accept()`.\n*   `SA_NOMASK` Allow the\
    \ same signal to interrupt while handling an earlier signal.\n*   `SA_NODEFER`\
    \ Same as `SA_NOMASK`.\n*   `SA_NOCLDSTOP` Does not notify parent if a child process\
    \ just stops (`SIGSTOP`, `SIGTSTP`, `SIGTTIN`, or `SIGTTOU`). This flag is important\
    \ for this chapter.\n\nListing 7.12 shows you an example of how to capture the\
    \ `SIGFPE` (float-point exception) and ignore the `SIGINT` (keyboard interrupt)."
