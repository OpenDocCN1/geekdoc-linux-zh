    # Summary: Solid-as-a-Rock Servers


    You can provide a reliable and stable server or client on which users can depend.
    You can recognize and avoid problems such as the network attacker, deadlock, and
    starvation. Likewise, by capturing signals, you strengthen your program to withstand
    some of the more common programming errors.


    This chapter gives a few suggestions of robust programming. These are mostly common
    sense: Conversion tools help portability, and return values are always important
    to look at. But knowing which return values to watch lets you worry less about
    the errors and more about the program. Also, knowing that the conversion tools
    don''t lose any performance on big endian computers reduces their risk.


    Knowing about how your server works and how it interfaces with the client is the
    greatest way to tune your server and make it unbreakable.


