- pgno: 277
  md: 'IP header has several fields that you can normally set with `setsockopt()`
    . Also, the IP header has fields that you cannot set.


    For example, if you want (for whatever reason) to test the fragmentation fields,
    you would have to use a raw socket with IP_HDRINCL enabled. Another use for this
    feature is programming some of the alternative IP versions listed in Chapter 3,
    Table 3.1 .


    # Speeding Through the Physical Network


    As noted earlier, the lower-level protocols are very fast. Raw sockets are only
    one level of abstraction above the network frame. Essentially, your raw packets
    fly through the network at physical network speed.


    Most network frames are 1–2KB for 10Mbps networks. Faster networks offer larger
    frame sizes. If you need speed, try to match the network frame size. This reduces
    the need to carve up your message. This is actually harder to do than it sounds;
    you cannot directly get the frame size. You could ask the user or query the hardware
    for the configuration, but that would require much more work (and less payback).


    If you need to work at the very low level of the IP stack, the raw socket is the
    answer. Alternatively, if data communication is important and accuracy is a must,
    most programs use the higher-level protocols to provide most of the communication.


    # What Are the Limitations?


    Raw sockets provide you with a lot of flexibility, but they are not a panacea.
    Choosing when to use raw sockets requires knowing what the limitations are.


    +   - **Reliability loss**— You lose a lot of features from the higher-level protocols.
    For example, TCP offers reliable connections—data sent is data received. (Of course,
    raw sockets and UDP share the same level of unreliability.)

    - **No ports**— You lose ports (virtual network connections). This actually can
    be a problem. Because you have no ports, the kernel passes a raw packet to all
    matching raw sockets. In other words, the kernel cannot determine the actual destination
    if more than one raw socket has the same protocol number. The MyPing example,
    later in this chapter, demonstrates this problem.

    - **Nonstandard communication**— Sender and receiver must understand what you''re
    doing. You cannot simply write a raw socket transmitter without writing a companion
    receiver. ICMP has its own receiver in the IP stack.

    - **No automatic ICMP**— As noted earlier, ICMP does not have an interface like
    TCP (SOCK_STREAM) or UDP (SOCK_DGRAM). Instead, you have to create a raw socket,
    set aside a header that looks like Listing 3.2 (see Chapter 3), populate it, calculate
    the checksum, attach any data, and ship it.

    - **No raw TCP and UDP**— You cannot expect a raw TCP or UDP to work. You can
    set the protocol parameter to whatever you want, even to TCP (6) or UDP (17),
    but not all operating systems honor the receiver-socket. In other words, you may
    be able to create a UDP-raw socket, build and initialize the UDP header, and send
    the message, but don''t expect any reply.

    - **root privilege**— Unlike the other protocols, the program must run with root
    privileges.


    If you can live with these limitations, raw sockets can be a real bonus to speed
    up your programs.'
