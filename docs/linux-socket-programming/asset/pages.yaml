    With T/TCP you have to disable TCP from flushing its buffers too quickly. That
    is what the `setsockopt()` system call is doing in the example. Also, you can
    send as many messages as you want, but the last message must have MSG_FIN (see
    above) in the `sendto()` system call.


    # NOTE


    # T/TCP and Linux


    Linux, unfortunately, does not currently support T/TCP. In the future it will,
    but for now, you may use these techniques on other UNIX operating systems. You
    can see some flags that indicate a work in progress in the Linux kernel (for example,
    MSG_EOF and MSG_FIN are defined in linux/socket.h). Still, you can try out the
    T/TCP programs found on the Web site.


    TCP, as mentioned before, requires you to re-create a TCP socket for every new
    connection, because you can close a connection only by closing the socket itself.
    T/TCP may have a side benefit of not requiring you to re-create a socket like
    TCP, because its connection and shutdown are implicit.


    T/TCP gives you the benefit of short bursts of interaction with any supporting
    server, while minimizing startup and shutdown times. The benefits of T/TCP help
    your program respond faster to servers.


    # Sending a Direct Message


    Up to this point you have worked with a connected channel to send and receive
    messages that is best compared to using a telephone. A directed message is unconnected,
    meaning that it does no handshaking. Creating a directed message (not a pipe)
    to a peer requires a sender and a receiver. The sender transmits the message,
    and the receiver accepts the message. It''s that simple.


    Each message needs a destination (the kernel places the return address in the
    packet for you). The `send()` and `recv()` assume that they have a connected channel,
    which automatically defines the destination. Instead, you must use the `recvfrom()`
    and `sendto()` system calls, because both provide the addressing each message
    requires.


    Prior to sending the message, you build the destination address, which includes
    the host address and the port number. As described in previous chapters, if your
    program skips selecting a port, the operating system assigns one to the socket
    randomly. This is not a good idea for peer programs. The calling peer must know
    the destination port to address the message properly.


    # NOTE'
