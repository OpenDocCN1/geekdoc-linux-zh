  img_proc: true
- pgno: 41
  md: 'You can choose from four basic Internet packet protocols: raw IP, ICMP, UDP
    (unreliable messaging), and TCP (streaming) all layered on top of the physical
    network (see Figure 3.1). This chapter describes each type and presents their
    advantages, disadvantages, and typical uses.


    Figure 3.1. The Sockets API provides different levels of reliable messages.


    ![](img/03334662da8fdfb8d95a02f270c522f6_41_0.png)


    # The Fundamental Network Packet


    If you could actually see the bits that travel from one computer to the other,
    what would you see? Each protocol is very different, but they all share one common
    necessary feature: They all carry the program''s message. Some protocols include
    a source address, while some require a destination. You may think that not requiring
    a destination is a little unusual, but some protocols (like UUCP) use the connection
    as the address to the destination.


    The Internet Protocol (IP) [RFC791] requires a packet to have three basic elements:
    source, destination, and data. (The data payload includes its length.) These elements
    provide the packet a level of autonomy. No matter where a packet is, you can identify
    where it came from, where it''s going, and how big it is.


    The packet''s autonomy is an important feature of the Internet. As long as the
    packet is *alive* (the data is timely and relevant), routers can move data to
    its destination when the packet is launched onto the network.


    # NOTE


    Packet Aliasing'
