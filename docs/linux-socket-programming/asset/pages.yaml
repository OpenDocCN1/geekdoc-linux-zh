- pgno: 151
  md: '# # Chapter 9. Breaking Performance Barriers


    IN THIS CHAPTER


    +   * Creating the Servlets Before the Client Arrives

    * Extending Control with a Smart Select

    * Delving Deeper into Socket Control

    * Recovering the Socket Descriptor

    * Sending Before Received: Message Interleave

    * Noting File I/O Problems

    * Using Demand-Based I/O to Recover CPU Time

    * Sending High-Priority Messages

    * Summary: Pulling Together Performance Features


    How do you get everything out of your server or client? Linux has several tools
    in the Sockets API that make this process relatively straightforward. However,
    you have to look at the programming problem from several angles at the same time,
    because each aspect touches on and affects another.


    Your network program has three distinct aspects: the task, the connection, and
    the messages. You work with each one of these in the course of the program. The
    task involves working with all related processes, or threads. The connection is
    the socket itself and its behavior, and the messages interact with the I/O processing
    that receives and sends messages. To get the most out of your network program,
    you have to balance the tasks with the messaging. The socket enables you to specialize
    the connection to meet your needs.


    This chapter takes you through several ideas and best practices that address the
    task, connection and messaging. You need to know the concepts presented in previous
    chapters to fully use these algorithms.


    # ## Creating the Servlets Before the Client Arrives


    To this point you have seen how to create a server, implement multitasking, and
    control I/O blocking. Each of these building blocks helps you interact with your
    clients and control the throughput. Chapter 7, "Dividing the Load: Multitasking,"
    showed you how to delegate the task of accepting and serving incoming connections,
    creating child processes as you need them.


    On some systems, however, creating a new task each time consumes time and resources.
    Also, you may not want to dedicate the entire computer resources to just serving
    network clients. (On the other hand, you may want to do just that, but there are
    logical and effective limits you must place on server access to ensure performance.)
    You may have other programs that need to execute on a regular basis, or even local/remote
    logins. In any form, you need to control the growth of your server program. And,
    controlling the number of connections requires extra programming.


    # ## Placing a Cap on the Number of Client Connections


    If you recall from the previous chapters, the server creates a new child process
    as soon as the client connects. Your program has to change here to incorporate
    the control over too many processes (once called rabbit processes because they
    multiply too quickly to control). The standard algorithm that follows does just
    that.


    ```

