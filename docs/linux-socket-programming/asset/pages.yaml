    Java supports the datagram socket to the extent that you can create sockets and
    send messages, but that''s about it. If you want more robust I/O capability, Java
    really does not offer it directly. Instead, you can use the memory I/O classes
    to build the messages in an array (described in the section "Classifying the I/O
    Classes," later in this chapter).


    The advantages of sending directed messages instead of an open pipe are essentially
    the same advantages UDP offers. (For more details on these differences, please
    refer to [Chapter 3, "Different Types of Internet Packets,"](#page-83-3) and [Chapter
    4](#page-107-4). Java provides a simple wrapper over the datagram protocols.


    # Sending to Multiple Destinations


    The datagram protocol lets you send a single message to an unconnected destination.
    An advantage to datagrams is being able to send to several destinations at once
    using broadcasting and multicasting. [Chapter 15, "Network Encapsulation with
    Remote Procedure Calls (RPCs),"](#page-343-15) discusses in detail both of these
    methods of sending messages.


    **NOTE**


    Current Java-Multicasting Support


    At the time of this writing, the multicasting socket options are not working correctly.
    This support should be fixed soon. This was tested on the 1.3 beta version for
    WinNT and Linux.


    Java offers multicasting in its networking wrapper, but it excludes broadcasting.
    Multicasting lets a program join a special IP address reserved for multicasting
    groups. Every program in this group gets messages sent to the address. To create
    a `MulticastSocket`, you can use one of two constructors:


    ```

    MulticastSocket ms = new MulticastSocket();

    MulticastSocket ms = new MulticastSocket(int localPort);

    ```


    Even though you can create a multicast socket with no specified port, your program
    must select a port before you can expect any messages. The reason is that all
    multicast datagrams use the port to filter out unwanted messages.


    After you have created the socket, it acts just like a `DatagramSocket`. You can
    send and receive directed messages. To get the extended multicast functionality,
    you need to join a group. IPv4 has set aside a range of legal multicasting addresses:
    `224.0.0.0`–`239.255.255.255`.


    ```

    MulticastSocket ms = new MulticastSocket(16900);

    ms.joinGroup(InetAddress.getByName("224.0.0.1"));

    ms.joinGroup(InetAddress.getByName("228.58.120.11"));

    ```'
