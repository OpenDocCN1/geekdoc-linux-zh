  md: '```

    `int socket(int domain, int type, int protocol);`

    ```


    The `socket()` system call accepts several different values. For a complete list,
    see Appendix A, “Data Tables.” For now, you’ll find a few in Table 1.1.


    # Table 1.1, Selected `socket()` System Call Parameter Values


    | **Parameter** | **Value** | **Description** |

    | :--- | :--- | :--- |

    | `domain` | `PF_INET` | Internet IPv4 protocols; TCP/IP stack. |

    | | `PF_LOCAL` | BSD-style locally named pipes. Typically used in the system logger
    or a print queue. |

    | | `PF_IPX` | Novell protocols. |

    | | `PF_INET6` | Internet IPv6 protocols; TCP/IP stack. |

    | `type` | `SOCK_STREAM` | Reliable, sequential data flow (byte stream) [Transmission
    Control Protocol (TCP)]. |

    | | `SOCK_RDM` | Reliable, packetized data (not yet implemented in most operating
    systems). |

    | | `SOCK_DGRAM` | Unreliable, packetized data (datagram) [User Datagram Protocol
    (UDP)]. |

    | | `SOCK_RAW` | Unreliable, low-level packetized data. |

    | `protocol` | | This is a 32-bit integer in network byte order (see the section
    on network byte-ordering in Chapter 2). Most connection types support only `protocol`
    = 0 (zero). The `SOCK_RAW` requires specifying a `protocol` value between 0 and
    255. |


    For now, the only parameters the example uses are `domain=PF_INET`, `type=SOCK_STREAM`,
    and `protocol=0` (zero).


    # **NOTE**


    # PF Values Versus AF Values


    This book uses the `PF_*` (*protocol family*) domains in the socket call, because
    `PF_*` domain constants are the proper form. However, most programs use the `AF_*`
    (*address family*) constants interchangeably. Be careful not to get confused when
    you see source code that uses the AF style. (The C-header files define the `AF_*`
    constants as `PF_*`.) If you want, using `AF_*` works just as well. However, this
    may cause incompatibilities in the future.


    An example for a streaming TCP/IP call looks like this:


    ```

    ```c

    int sd;

    sd = socket(PF_INET, SOCK_STREAM, 0);

    ```

    ```


    The `sd` is the socket descriptor. It functions the same way as the file descriptor
    `fd`:


    ```

    ```c

    int fd;

    fd = open(...);

    ```

    ```


    The call returns a negative value when an error occurs and places the error code
    in `errno` (the standard global variable for library errors). Here are some common
    errors you can get:'
