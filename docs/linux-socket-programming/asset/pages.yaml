    # ## Socket Options (get/setsockopt())


    Tables A.4 through A.7 list the various socket options and the required parameters.
    Not all options are size compatible between UNIX types. For example, `IP_TTL`
    in Linux allows a type `int`, but only fills the first byte. IBM''s AIX restricts
    the same option to a `char` instead.


    Table A.4. General Socket Options


    | Level | Option | Description | * R W | Value | Type |

