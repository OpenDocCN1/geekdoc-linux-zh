    # Order


    Order simply tells Apache the order in which it should handle a set of

    Deny and Allow directives below it. One of the following three will be

    used for an order directive:


    +   deny, allow Evaluate the deny directives first.

    allow, deny Evaluate the allow directives first.

    mutual-failure Hosts must be specifically allowed while not matching any deny
    criteria.


    The Satisfy directive can be used in concert with the Allow and Deny

    directives. It is useful only if access to a directory, location, or file is

    restricted by username/password and client host address. When this

    happens use the Satisfy directive to modify the default behavior (which

    is to require both). Within the directory or .htaccess context, Satisfy

    means that the client only has to satisfy host restriction or enter a valid

    username and password.


    Do not put spaces between the deny and allow keywords. If you

    include spaces, Apache will fail to start, displaying a configuration error.

    The following is correct:


    ```

