    # SSL–Secure Sockets Layer


    The Secure Sockets Layer protocol is a protocol layer that may be placed

    between a reliable connection-oriented network layer protocol (e.g.,nTCP/IP) and
    the application protocol layer (e.g., HTTP). SSL provides

    secure communication between client and server by allowing mutual

    authentication, the use of digital signatures for integrity, and encryption

    for privacy.


    The SSL protocol is designed to support a range of choices for specific

    algorithms used for cryptography, digests, and signatures. This allows

    algorithm selection for specific servers to be based on legal, export,

    orother concerns, and it also enables the protocol to take advantage of new'
  merge: -1
