    functionality to the Perl language and can be included and used easily in Perl.
    Perl modules are stored in files with an extension of .pm. .pm would a Perl module,
    while files without an extension, or those ending in .pl, are Perl programs. All
    Perl modules can be downloaded from the new Perl Archive Network (CPAN), which
    contains all known Perl material and modules. CPAN can be found at the www.perl.com
    site and many mirror sites.


    Apache''s mod_perl integrates a Perl interpreter with the Apache Web server. It
    contains Perl code that provides an object-oriented interface to the new Apache
    server. The mod_perl module contains lots of functions and classes that add great
    functionality to the Apache server. With mod_perl, it is possible to write Apache
    modules entirely in Perl. The major advantages of mod_perl are speed and the ability
    to deal with the inner workings of the Apache Web server. CGI scripts can also
    run under mod_perl.Installation of mod_perl is fairly complex. Please do not to
