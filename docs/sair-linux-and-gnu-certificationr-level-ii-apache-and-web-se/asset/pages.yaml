  md: 'cal programming, files are made up of records; in database programming, tables
    are made up of rows.


    Besides this basic organization, which could describe common formats used in programming,
    there is a set of rules that distinguishes the structure of a database system
    from a classical programming application. Among the rules is the concept that
    all characteristics of the data structure, as well as any changes to the data
    structure or content, are controlled through the DBMS and reflected in tables.
    Values entered into a field can be constrained by rules enforced by the DBMS,
    not by the application. Any applications that access the data are kept separate
    from the data itself and go through the DBMS to reach the data. As a result, data
    integrity is in the domain of the DBMS, not the domain of the application. Any
    data item is referenced uniquely by its table, key, and column values. In this
    way, redesign of the data structure will have no effect on the application. By
    defining a relationship between fields in different tables, it is possible to
    link tables together. Another important feature of a DBMS is that a single command
    can be issued through the DBMS interface that will affect all rows of a table,
    without the need for record-by-record processing. The abilities to relate data
    and isolate the internal workings of the database from the application are two
    of the things that give a relational database its power.


    # Normalization of Tables


    Normalization of tables in a relational database is the process of organizing
    the database into tables in such a way that the results of the database are always
    unambiguous and predictable. Normalization consists of reducing the duplication
    of data items within the database according to a set of rules, often with the
    creation of additional tables. Normalization will ensure that a particular item
    is stored in a single location. If you update an item, any references to that
    item will show the update by logical design, not by any special action.


    A database can be described in terms of its level of normalization, according
    to how many of the five rules of normalization the database''s design follows
    (Boyce-Codd Normal Form, or BCNF, is a variation of third normal, or 3NF). Typically,
    the optimum balance of speed and complexity occurs at 3NF and BCNF. Normalization
    beyond this level results in an increase in the number of tables, with an associated
    increase in complexity and a possible decrease in speed. Normalization is typically
    a refinement process after the initial exercise of identifying the data objects
    that should be in the database, identifying their relationships, and defining
    the tables required and the columns within each table.'
