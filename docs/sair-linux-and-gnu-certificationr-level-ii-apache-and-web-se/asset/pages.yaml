    # Shells and Commands


    There are many ideas and concepts behind file security, especially over a network.
    This section will describe some of these concepts and discuss how they are used
    in Apache.


    # Checksums


    A checksum is a computed value that depends on the contents of a block of data
    that is transmitted or stored along with the data in order to detect corruption
    of the data. The receiving system recomputes the checksum based on the received
    data and compares this value with the one sent with the data. If the two values
    are the same, the receiver has some confidence that the data was received correctly.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'The checksum may be 8 bits (modulo 256 sum), 16, 32, or some other size. It
    is computed by summing the bytes or words of the data block, ignoring overflow.
    The checksum may be negated so that the total of the data words plus the checksum
    is zero.


    # PGP and Checksums


    PGP uses a checksum value to do the following:


    +   - Produce noncryptographically secure pseudo-random numbers. A strong pseudo-random
    number generator (PRNG) exists for the production of numbers that need cryptographic
    security.


    +   - Check whether a message has been corrupted during transit.


    > NOTE This is in addition to any cryptographically secure method of error detection.


    Using a checksum and PGP helps to ensure that what you are downloading is the
    program you think it is. Otherwise, you could be downloading a Trojan horse or
    some other malicious program. OpenPGP (v1) does not mandate that conventionally
    encrypted non-signed messages are checked, so errors may exist without warning.
    The checksum function is used only in areas that don''t require cryptographic
    strength. When cryptographic strength is required, PGP uses a hash function.


    To perform a checksum, type the following on the command line:


    ```

    # mdsum file_name

    ```


    The output will look something like this:


    ```

    5596d03cf27c88ca0614aad016026ae file_name

    ```


    # What is MD5?


    MD5 reads data and calculates a cryptographic checksum that is very hard to duplicate.
    As traditional checksums give assurance that a file has not been accidentally
    modified, MD5 ensures that a file has not been intentionally modified, which helps
    to protect from downloading any Trojan horses.'
