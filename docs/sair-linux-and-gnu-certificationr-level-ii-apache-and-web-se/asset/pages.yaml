  md: '# Networking 123


    The ServerName and ServerAlias directives are critical to identifying the client
    requests and are necessary for this method.


    Name-based virtual hosting requires the Web browser to send a Host field in the
    HTTP request header (part of HTTP/1.1, supported by version 2.0 browsers and later).
    Browsers older 2.0 should be long retired.


    IP addresses are a scarce resource; using the name-based method allows multiple
    Web sites to share a single IP address assignment. In the future, many sites will
    be required to renumber their networks to make more efficient use of limited address
    space. When time comes, having fewer IP addresses to reassign will be much appreciated.
    We will examine the IP-based virtual hosting mechanism primarily for historical
    purposes.


    One thing to be aware of name-based virtual hosts is that if the client does not
    send the host header, it will get the first virtual host for IP address. There
    is a workaround available for supporting older browsers that does not send the
    host header that uses the ServerPath directive. See the Apache Virtual Host documentation
    for more information. This should be available from the source installation at
    http://localhost/manual/hosts/name-based.html.


    # Example of Virtual Hosting with One IP Address


    The following is a code excerpt from the httpd conf file used to set up virtual
    hosting:


    ```

    User webuser

    Group webgroup

    NameVirtualHost 12.34.56.7

    Include /etc/httpd/conf/firstwebsite.com


    #firstwebsite.conf file in /etc/httpd/conf

    <VirtualHost 12.34.56.7>

    ServerName www.firstwebsite.com

    ServerAdmin webmaster@firstwebsite.com

    DocumentRoot /home/httpd/firstwebsite/

    ErrorLog /var/log/httpd/firstwebsite-error_log

    CustomLog /var/log/httpd/firstwebsite-access_log

    </VirtualHost>

    ```


    ```

    #secondwebsite.conf file in /etc/httpd/conf

    <VirtualHost 12.34.56.7>

    ServerName www.secondwebsite.com

    ```'
