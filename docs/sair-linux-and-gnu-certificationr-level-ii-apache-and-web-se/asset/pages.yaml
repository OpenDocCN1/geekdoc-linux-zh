  md: '# Chapter 4


    +   - IP source address

    - IP destination address

    - Protocol: UDP, TCP, ICMP, or IP tunnel

    - Source port for UDP or TCP

    - Destination port for UDP or TCP

    - ICMP message type

    - Incoming interface of the packet

    - Outgoing interface of the packet


    Based on the information that the IP packet headers provide, rules can be defined
    that either allow or deny packets to reach their destination.


    For example, incoming SMTP traffic can be permitted to go only only to a designated
    mail exchanger host on the internal network and deny all incoming telnet. At the
    same time, incoming HTTP and FTP requests to a specific Web or FTP server can
    be allowed.


    # Why Packet Filtering?


    Packet filtering is useful not only for allowing, denying, and routing incoming
    requests, but also because it provides a first line of defense against some types
    of attacks, most notably spoofing, fragment, and routing attacks.


    Spoofing. In an IP spoofing attack, the malicious person sends packets from outside
    that are designed to assemble packets that would have originated from an internal
    host. In other words, the packets are disguised to look as though they originally
    came from the internal network behind the firewall. To combat spoofing, the firewall
    simply checks the packets that arrive on the network interface, and if their source
    address is that of an internal host, it refuses to admit the packets. Hence, this
    sort of attack is simple to identify and nullify.

    to turn on the kernel''s built-in anti-spoofing capabilities, run this command:


    ```

    < for in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 1; done

    ```


    Fragment and source attacks. Packet filtering also prevents tiny fragment attacks
    and source routing attacks. Tiny fragment attacks use the IP fragmentation feature
    to create very small packets that split the TCP header information into separate
    packets, or fragments. The success of this'
