    to Perl, PHP, or any other language. This is usually a problem with the Windows
    environment, for Linux users need to be aware of.


    # suExec


    One problem with CGI scripts is that they are run by the owner of the server,
    which can cause serious problems if the script is written in a malicious or careless
    way. Typically, the damage is restricted to whatever the server processes'' owner
    may access. Under some circumstances, a visitor can enter data that causes a script
    to do things the author didn''t intend, or a visitor who has access to the system
    can modify a script to do things beyond the intentions of the original author.


    The <suex> option allows CGI scripts to run under an ID other than the owner of
    the server and, at the same time, applies a series of strict tests to what the
    script is trying to do. If a script tries to step out of the prescribed parameters,
    it is terminated and an error is logged to the <suex> log file.


    The Apache documentation warns that su should be used only by someone who is familiar
    with the suid and sgid processes. An improper implementation by an inexperienced
    administrator could result in unexpected actions by the script.


    > **NOTE** Configuring suexec is beyond the scope of this course. If you would
    like to experiment with it, read the server documentation carefully, paying close
    attention to permissions and ownerships.'
