  md: '# Networking 127


    Following is the syntax:


    ```

    RewriteCond TestString CondPattern [flag]

    ```


    # CondPattern TestString


    CondPattern is an extended regular expression that has some additions.


    +   <>, and = When combined with CondPattern, treat it as a plain string and compare
    it lexically to TestString.

    < Returns true if CondPattern is lexically lower than TestString.

    > Returns true if CondPattern is lexically greater than TestString.

    = Returns true if CondPattern is lexically equal to TestString.


    Put the operator at the beginning of CondPattern, like so:


    ```

    <CondPattern

    ```


    Table 3.1 shows some of the options available when using CondPattern.


    # Table 3.1 Options for CondPattern


    | OPTION | DESCRIPTION |

    |---|---|

    | -d | Treats TestString as a path name; it tests that TestString exists and that
    it is a directory. |

    | -f | Treats TestString as a path name; it tests that it exists and that it is
    a regular file. |

    | -s | Treats TestString as a path name; it makes sure TestString exists and its
    size is greater than zero. |

    | -l | Treats TestString as a path name; it tests that it exists and is a symbolic
    link. |

    | -F | Does not deal with path names but checks if TestString is a valid file.
    Checks to see if the file is accessible via all the server''s controls for that
    path. Uses an internal subrequest for this check; server performance degrades
    accordingly. |

    | -U | Makes sure TestString is a valid URL and is accessible via the server''s
    access controls for that path. Uses an internal subrequest; server performance
    lags the more it is used. |'
