    in almost every commercial relational database management (RDBMS) system and many
    open source systems as well. SQL provides the abilities to create and maintain
    the database and to query the database. SQL is recognized by the American National
    Standards Institute (ANSI) as the standard language for relational database management
    systems. SQL is a comprehensive database language, with statements for data definition,
    query, and update. Although most database systems use SQL, many of them also have
    their own proprietary extensions that are available only on their system. A good
    RDBMS can perform all standard operations without having to call on the proprietary
    extensions.


    # Selecting a Database


    Several database systems exist for Linux. While some are commercial, others are
    free (open source). Considerations when choosing a database include the amount
    of data to be stored, the type and frequency of transactions, security features,
    multi-user support, access method, speed, and accuracy. MySQL will be used for
    this lesson because of its ease of use and also because of the extensive selection
    of third-party tools available freely on the Web. As of June 2000, MySQL was released
    under the GPL-license, which makes it free for use in commercial systems.


    The main feature of MySQL is that it is multithreaded, optimized for speed and
    use with large tables. MySQL gains its speed advantage at the cost of such desirable
    SQL features as triggers, subselect, and transaction processing. Developers, though,
    will gradually roll desirable features into the product over time. The intended
    use of the product is as a quick, fast implementation of simple applications.


    For more information on MySQL, visit the Web site at www.mysql.com.


    Other database systems are available for Linux. Commercial packages include Oracle
    8i, IBM DB2, and Informix SE.


    The MySQL package is available as freeware at prices comparable to those for MySQL
    at www.hughes.com.au/ products/msql/. It is free for non-commercial use.'
