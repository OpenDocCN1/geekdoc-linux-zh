- img_proc: true
  md: 'to develop for it correctly. A description of the API is on Apache''s reference
    for mod_rewrite.


    Apache mod_rewrite module is very complex, but once a user understands it, almost
    any URL can be transformed into another one. The module uses a rule-based rewriting
    engine for requested URLs. This feature may be found in Apache 1.2 and later.
    With its powerful URL manipulation mechanism, the Web server can examine every
    URL that arrives to see if it matches any patterns by the rewrite rules. If it
    finds a match, Apache internally rewrites the URL using the matching rule. Here,
    the module operates on full URLs in both a per-server context (httpd.conf) and
    a per-directory context (.htaccess). To use mod_rewrite, add the following line
    to the configuration file before compiling:


    ```

    AddModule modules/standard/mod_rewrite.o

    ```


    # Some examples of mod_rewrite in action.


    With a proxy, users can make sure it is used only by those desired. A 403 Forbidden
    page can be shown to unwanted users. For instance, users may use the proxy server
    only for URLs with a name ending in .anu.edu.au:


    ```

    RewriteRule !^proxy:http://[/]*.anu\.edu\.au/ - [forbidden]

    ```


    Because mod_rewrite has access to many server variables, it can be used instead
    of CGI or JavaScript to redirect Web browsers on their type and version. The following
    example was adapted from Apache''s URL Rewriting Guide (the link is provided at
    the end of this section):


    ```

    RewriteCond %{HTTP_USER_AGENT} "Mozilla/3.*"

    RewriteRule /index\.html$ [L]

    RewriteCond %{HTTP_USER_AGENT} "Lynx/" [OR]

    RewriteCond %{HTTP_USER_AGENT} "Mozilla/[12].*"

    RewriteRule /index\.html$ /index.20.html [L]

    RewriteRule /index\.html$ /index.32.html [L]

    ```


    > NOTE The use of RewriteCond is one of the most important directives of mod_rewrite.'
  merge: -1
