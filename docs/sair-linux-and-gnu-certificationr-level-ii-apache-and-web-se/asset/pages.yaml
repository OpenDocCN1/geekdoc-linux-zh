  md: '# Configure and Run mod_auth_mysql


    # Purpose


    In this lab, you will edit the httpd.conf file to use mod_auth_mysql for HTTP
    user authentication. This will configure Apache to use MySQL as the primary username
    and password database. Students will then gain familiarity with administering
    a MySQL user database. The configuration will be tested using a Web browser.


    # Theory


    To increase security, the Apache Web server can require authentication before
    processing a client''s request. There are several ways in which Apache can store
    usernames and passwords. Although Apache can use text files to store authentication
    data, it is often more secure and efficient to administer this data through a
    MySQL database. This is done by using the mod_auth_mysql module to enable authentication
    and to specify the use of the MySQL database.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Setting Up the MySQL Database


    Before Apache can use mod_auth_mysql to perform authentication, a database must
    exist to store the usernames and passwords of authorized users. mysqladmin command
    is used to create this database. When the database has been created, it is necessary
    to set up the appropriate database fields properly. After the MySQL database has
    been constructed, MySQL must be configured to allow the Web server to access the
    newly created database. MySQL must then be restarted so that the changes take
    place. It is also necessary to create a test user so that the configuration can
    be tested later.


    # Setting Up Apache


    With the MySQL database properly set up, the next step is to configure Apache
    to use this database for authentication. This is done by first editing the httpd.conf
    file to use the mod_auth_mysql module for authentication. With the authentication
    scheme in place, a test directory is needed with a .htaccess file to protect the
    directory. After making changes to Apache’s configuration file in place, the httpd
    daemon must be restarted to make the changes take effect. The authentication can
    then be checked by accessing the page with a Web browser.


    # Lab Exercises


    To complete this lab, a computer with Apache+SSL with MySQL mod_auth_mysql already
    installed must be available.


    Assuming you have added the path to the mysql bin/ directory to your PATH environment
    variable, type:


    ```

    mysqladmin create http_auth -u root -p

    ```


    Enter MySQL’s root password at the password prompt to access mysqladmin. Log into
    that database by typing:


    ```

    mysql -u root -p http_auth

    ```


    Enter your password at the prompt.'
  merge: -1
  pgno: 240
- img_proc: true
  md: "Now it is time to add a simple table to your database, which you can use to\
    \ grab usernames and passwords. mod_auth_mysql has some default field names for\
    \ this table, which we will use. Set up the table as follows:\n\n```\ncreate table\
    \ mysql_auth (\n  username char(25) not null,\n  passwd char(25) not null,\n \
    \ groups char(25),\n  primary key\n);\n```\n\nAs you can see, this is a very simple\
    \ table. In MySQL, the char() field is designed specifically to hold characters.\
    \ While it may seem unwise to store user passwords as clear text in this database,\
    \ mod_auth_mysql encrypts the passwords by default by using MySQL password() routine.\n\
    \nWe also built the table with two fields that are labeled not null, meaning neither\
    \ the username nor the password can be null when creating new users.\n\nFor security\
    \ purposes, you want to create a new username and password that mod_auth_mysql\
    \ can use to access the database you have created. Because you are currently logged\
    \ in as root, this will be easy. Type the following:\n\n```\nGRANT DELETE, INSERT,\
    \ SELECT, UPDATE ON http_auth.* TO apache_user@localhost IDENTIFIED BY 'k14u137';\n\
    ```\n\nThis gives you apache_auth the ability to remove information, insert information,\
    \ find information, or change information on any table within the mysql_auth database,\
    \ as long as apache_auth is connecting from the local host. Before the new user\
    \ can go into effect, we need to flush MySQL's privilege tables. To do this, perform\
    \ the following steps:\n\n+   1. If you are still in MySQL, type exit; hit return.\
    \ From the command line:\nmysqladmin -u root -p reload\n\n2. Enter your password\
    \ at the prompt. This command reloads the permissions so that MySQL will recognize\
    \ your new user. To, try to enter the database as apache_user with a password\
    \ of k14u137, as shown here:\nmysql -u apache_user -p http auth"
