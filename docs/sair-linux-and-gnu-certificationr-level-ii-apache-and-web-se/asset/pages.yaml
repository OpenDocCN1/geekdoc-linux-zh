  md: 'If a server configuration does not specify which IP address to listen to, Apache
    listens to all valid addresses. Hence, when running multiple daemons on the same
    machine, it is important to specify which address each daemon should listen to.


    # Directing the Request to a Virtual Host


    The first step in sharing a machine among multiple Web sites is finding a means
    of attaching the Web server to a unique address, which enables a Web browser and
    the Web server to find each other. With a system using Ethernet, this involves
    plugging another Ethernet card into an expansion slot and assigning a unique IP
    address to this new interface. Start another Web daemon, and configure it to respond
    to this new IP address. This setup works well and has few limitations.


    Although more Ethernet cards is not overly expensive, the cost of adding a card
    for each site may not be justified. The bandwidth of a single card exceeds the
    needs of most Web sites by such a margin that the first card would have been able
    to handle several Web sites if only there was a way to share among them. As the
    user adds more sites to a system, the number of expansion slots could be depleted
    before the machine’s capabilities to run additional Web server daemons are exceeded.


    Even though there may be times when the user finds the need to add cards to a
    machine, obtaining a Web server daemon to distinguish between requests for several
    different Web sites could allow several different sites to be served through a
    single card on a single machine.


    There are two ways to distinguish between requests, IP-based virtual hosting and
    name-based virtual hosting.


    # Single Daemon/Virtual Hosting


    This method uses a single instance of the httpd daemon in conjunction with IP-
    or name-based hosting to manage things. Consider the basic characteristics of
    the single daemon method to determine if it is suitable for your location’s needs:


    Using the single-daemon httpd method has the advantage of consuming fewer system
    resources because there is only one httpd daemon running. On a busy site, this
    can make a difference in system load.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Networking 119


    Settings may be easier to maintain because some of the configurations are shared,
    such as having only one httpd.conf file to edit when making changes to the daemon''s
    behavior. The user can add new hosts quickly by adding a small section in httpd.conf
    with host-specific information. All other major settings will be inherited from
    the directives outside of the VirtualHost sections. Using the Include directive
    can allow creation of separate configuration files for each virtual host.


    A potential security/privacy problem arises when using a single daemon. The httpd
    daemon runs with permissions that have been assigned to it. If Webmasters are
    to be able to access certain content or tailor the server''s behavior to their
    needs, they must have the permissions to implement them. Permissions also give
    them the ability to see or even change parameters that control the other hosts.


    # IP-Based Virtual Hosting


    If there are available IP addresses, IP-based virtual hosting is one option for
    hosting multiple Web sites. Each host has a unique network address that allows
    it to be found on the network. IP-based virtual hosting is system dependent and
    requires IP aliasing, the assignment of multiple IP addresses to the same interface.


    To set a single NIC with multiple IP addresses with IP aliases, enable the feature
    in the kernel.


    IP aliasing should be enabled by default with most distributions. If IP aliasing
    has not been enabled, the user will need to recompile the kernel to enable support
    for this feature. IP aliasing can be found under Network Options in the kernel
    configuration menus.


    Use ifconfig (interface configuration) command to control which IP addresses are
    attached to the interfaces on a system. Initially an interface has a single IP
    address, determined when the system is first configured.


    Issuing the ifconfig command with no arguments displays the current status of
    all interfaces on the system:


    ```

    # ifconfig

    eth0 Link enc:Ethernet Hwaddr 00:80:C8:14:73:77

    inet addr:192.168.0.1 Broadcast:192.168.0.255 \nUP BROADCAST RUNNING MULTICAST
    MTU:1500 \ Metric:1

    RX packets:1849 errors:0 overflows:0 frame:0

    TX packets:1359 errors:0 dropped:0 overflows:0 carrier:0

    ```'
