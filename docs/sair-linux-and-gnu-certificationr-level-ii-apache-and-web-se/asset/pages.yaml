  md: '# 38 Chapter 1


    tory of the Apache source tree, there is a file named Configuration Toward the
    bottom of the file are module definition lines that reflect the default configuration.
    Specify which modules to use by uncommenting or by deleting the number (#) symbol
    on the lines. To add new lines or by modifying lines, use the following format:


    ```

    AddModule /path/to/module/module_name

    ```


    The following example is taken from an active Apache install and represents a
    logging facility that has been enabled by default:


    ```

    AddModule modules/standard/mod_log_config.o

    Adding Modules

    ```


    Other options that are frequently used with configure to relate to modules. Apache
    comes with a number of modules that increase its functionality. Some of the modules
    are installed and enabled by default; others need to be selected at compile time.
    As mentioned earlier, there are three methods that can be used to enable modules.
    How a module is implemented is determined by how it is enabled with configure.


    One module that comes with Apache but is not enabled by default the mod_info module.
    This module allows access to detailed information about the server through a convenient
    Web interface. To enable it as a static module, invoke configure as:


    ```

    $ ./configure --enable-module=info

    ```


    Here are the options to enable the same module with DSO support:


    ```

    $ ./configure --enable-module=info \

    --enable-shared=info

    ```


    If there is more than one option, using the line break escape character (\) will
    allow everything to fit on the command line in a coherent manner.


    To simply experiment with the available options without having to specify every
    feature, include most modules as DSO modules with the following-options:


    ```

    $ ./configure --enable-module=most \

    --enable-shared=max

    ```'
