- img_proc: true
  md: 'generally a good idea because it allows an administrator to centralize many
    security policies to one system rather than having to worry every single machine
    on a network. Presence of a firewall does not guarantee absolute security but
    can enhance significantly if the firewall is well maintained.


    To make the firewall effective, all traffic entering or leaving a site must pass
