  md: '# RPM Installation


    Installing an RPM-based distribution is a matter of invoking rpm to extract and
    install the contents:


    ```

    # rpm -i apache-x.x.x.rpm

    ```


    When the install finishes, Apache should be ready to run.


    Starting, configuring, and maintaining are roughly the same as with a source install.
    One caveat with using an Apache RPM is that there are many Linux distributions
    that implement RPM for managing packages but list consensus as to certain files
    belong. If the user cannot find a central Apache or http directory and the install
    seems to have completed properly, the distribution probably has spread the Apache
    files across several directories. Use this command to list all installed files:


    ```

    # rpm -ql apache | less

    ```


    The user should be able to find the configuration and content directories in this
    list.


    Some of the important files are placed here using the Apache package included
    with Red Hat 6.2:


    ```

    httpd.conf: /etc/httpd/conf

    HTML content: /home/httpd/html

    httpd binary: /usr/sbin

    ```


    > NOTE apachectl is not included with this RPM, but there is a startup script
    in /etc/rc.d/ init.d called httpd.


    The mileage may vary depending on the distribution. The source is always available
    if an RPM install does not meet the needs of your location. A source installation
    also provides the user with the opportunity to select the features that he or
    she wishes to enable.


    > NOTE Apache may be split into multiple packages in some distributions. For example,
    Red Hat has split out some of the files into a package called devel. This package
    contains files required to build third-party modules.'
