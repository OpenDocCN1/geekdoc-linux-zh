    # Base Systems


    Many different people can be working on the Web site that is served by Apache.
    There could be many different groups of people, with each group (and/or person)
    needing unique permissions. This section will describe the ideas of access control,
    keeping a structure to security policies for an Apache install, how to use Apache
    as a proxy, and much more.


    # Apache, Users, and Groups


    If you install Apache from source and not specify a user, Apache will run as the
    user nobody. Running Apache as nobody is dangerous because other processes run
    as nobody already. In the event of a security breach, trying to figure out nobody
    actually affected your system becomes quite difficult. Remember also that any
    CGI script that Apache runs does its business as the same user as Apache.


    The obvious solution is to run Apache as a different user. We recommend configuring
    Apache to run as webuser, as a member of webgroup.


    Before Apache can run as webuser of webgroup, you must add that user and group
    to Linux. First, make sure you are operating as root, then add your group:


    ```

    # groupadd webgroup

    ```


    While still operating as root, add your user:


    ```

    # useradd webuser -g webgroup

    ```


    webuser now exists as a member of webgroup. If you were running multiple daemons
    and were very nervous about security, you could conceivably run each daemon as
    a different user, all as parts of the webgroup.


    To make sure Apache runs as the user you want, add the following to your ./configure
    command when you install Apache:'
