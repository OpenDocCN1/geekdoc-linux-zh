  md: '# Phases in Detail


    To give you a better understanding of how Apache works, the next section will
    explain each of the eight phases in more detail.


    # Phase 1: URI to File Name Translation


    Requests come with a URI, which is a subset of the URL that identifies the path
    to the Web page. If you were to open the URL http://www.linuxcertification.com/index.epl
    in a Web browser, the browser would connect to the host named .linuxcertification.com
    and send it the following request:


    ```

    GET /index.epl

    ```


    The path name /index.epl Apache needs to find out the file on the file system
    to which this corresponds. It starts at the document root, which is the root of
    all the server''s Web documents, and walks the tree down to the requested file.
    In this case, if the document root were /home/httpd/ , the corresponding file
    would be /home/httpd/html/index.epl.


    Sometimes the translation is not as simple as it seems, Apache has command directives
    that can be placed in its configuration files to alter the URI-to-file name translation
    works. One of the most common is the ScriptAlias command, used to specify both
    the URI prefix and the file system location of CGI files. A ScriptAlias command
    looks like this:


    ```

    ScriptAlias /cgi-bin/ /home/httpd/cgi-bin/

    ```


    If Apache received the request for /cgi-bin/index.epl, it would have to look in
    /home/httpd/ cgi-bin for the proper index.epl.


    # Phase 2: Authentication


    Authentication is the process of checking the user''s credentials (username and
    password, typically) with one or more lists of credentials Apache keeps. Different
    modules authenticate in different ways; the module mod_auth looks up usernames
    and passwords in text files, while mod_auth_db and mod_auth_db look them up in
    database files.


    This phase does not actually check to see if the user is authorized to view the
    requested resource; it just checks to see if the user is who he says he is. In
    other words, the username and password presented match the list of known usernames
    and password combinations?'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Phase 3: Authentication Access Checking


    It is at this point that Apache compares the authentication information from the
    previous phase with access rights to the particular resource. The way Apache handles
    authentication access checking is also tied to the particular module in use; standard
    practice is to check the .htaccess files inside of a particular directory (and
    all of its parent directories) for this information, but it also can come from
    database servers or the httpd.conf file itself.


    # Phase 4: Non-Authentication Access Checking


    After Apache checks access based on the user''s credentials, it checks access
    based on other factors, as requesting the IP address. In the httpd.conf file,
    access to certain directories can be denied based on IP address.


    Because multiple restrictions can be placed on access checking, all handlers registered
    for this phase should run.


    # Phase 5: Determining MIME Type


    MIME types let the Web browser know what type of file it is receiving—a plain
    text file, an HTML file, a JPEG, and so on. The standard modules mod_mime and
    mod_mime_magic are used to find out the particular MIME type of a file.


    Apache uses the two modules to figure out MIME types in two different ways. mod_mime
    checks for the extension of a file. For mod_mime, .txt is a text/plain file, .html
    is a text/html file, and so on.


    mod_mime_magic checks the contents of a file, typically the header, to determine
    file type. mod_mime_magic uses the “magic number” database that many Linux programs
    use, including the file command. This of type checking can be more reliable, but
    it takes more time to perform.


    # Phase 6: Fixups


    Fixups are generic tweaks that Apache makes to a response before sending it to
    the client. This is a catch-all phase that typically includes parsing server-side
    Includes, manipulating HTML headers, rewriting URIs, and handling Server-Redirects.


    The process of the Fixup phase is fairly simple. Typically it is anything that
    needs to alter the response before it gets sent back to the client.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Chapter 2


    The Fixup phase runs all of the available handlers registered for it


    # Phase 7: Sending the Response


    Sending the response means taking the referenced file, reading it from the file
    system, optionally processing it (such as by running a PHP script), attaching
    a header, and sending it back to the client.


    # Phase 8: Logging the Request


    Logging needs to happen whether the response was sent or not. If the request was
    successful and a response was sent, the log will show an HTTP status of 200 (OK).
    Otherwise, it will show a request with an error code, such as 404 (Not Found)
    or 500 (Server Error).


    This phase always runs because all requests need to be logged. Additionally, all
    handlers registered for this phase will run so that Apache can log the request
    and response in multiple places, if necessary.


    # The Future: Apache 2.0


    As of this writing, Apache 2.0 is in the beta stage. While not yet suitable for
    stable Web, the beta version hints at what will be offered.


    Apache 2.0 still has many of the same features you are used to with 1.3.x, including
    a very familiar configuration file. Most of the changes are under the hood, with
    a radically improved API, new and improved modules, and IPv6 support.


    # New Modules


    Following is a list of a few recently-developed modules, and descriptions for
    each:


    +   - mod_dav Supports the HTTP Distributed Authororing and Versioning specification
    for posting and editing Web content. This module will use Apache to tie Web development
    and Web serving to HTTP. See www.devweb.org for more information.

    - mod_charset_lite. Currently an experimental module, mod_charset allows for character
    set translation or decoding.

    - mod_file_cache. As the file name hints, mod_file_cache caches frequently used
    static files. The module does its work at server startup, opening the file and
    saving it into memory. mod_file_cache does not work on dynamic content, such as
    CGI files.'
  merge: -1
