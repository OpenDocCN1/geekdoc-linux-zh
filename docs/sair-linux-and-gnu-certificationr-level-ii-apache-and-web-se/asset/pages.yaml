    To create an alias, issue the ifconfig command with arguments describing which
    interface to alias and the new address:


    ```

    # ifconfig device:aliasnumber address

    ```


    # device


    The name of the interface to alias is device.


    # aliasnumber


    Assign an aliasnumber as each new IP address is created.


    # address


    The new IP address is defined when address is entered.

    Here is an example of creating a new alias:


    ```

    # ifconfig eth0:0 192.168.1.3

    ```


    Along with displaying the current configuration with statistics and creating aliases
    with new IP addresses, the ifconfig command has a number of options, including
    the ability to delete the aliases you has created. The user can view a detailed
    explanation on the man pages. For more detailed information, see the kernel source
    Documentation/networking/alias.txt and the IP-Alias mini-HOWTO.'
