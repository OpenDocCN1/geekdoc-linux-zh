  md: '# Add Modules via RPMs


    Adding new modules to an RPM-based distribution is a matter of invoking RPM to
    upgrade/install the new module:


    ```

    # rpm -Uvh apache-x.x.x.rpm

    ```


    When the upgrade finishes, Apache should be ready to run.


    # Start Apache


    Red Hat uses http to start the server.


    # httpd


    httpd is a script that can start Apache’s daemon (located in /usr/sbin). The script
    is located at /etc/rc.d/init.d/httpd. To see the command line options, type:


    ```

    Usage: ./httpd {start|stop|restart|reload|status}

    ```


    When the user types httpd -- help, the httpd command-line options will be visible,
    as shown in Table 1.1.


    # Verify Functionality Locally


    The final step of upgrading Apache involves testing the server. When the daemon
    is running, Apache should be listening on the loopback device at port 80. Typically
    the loopback device resides on 127.0.0.1 and can be accessed using localhost as
    the target address. Any Web browser can perform this test. Lynx is a good choice
    because it can usually be found on any Linux distribution. Test the server by
    invoking Lynx or a preferred browser with the desired server address:


    ```

    # lynx localhost

    ```


    The Apache test page should load with the following screen:


    It Worked! The Apache Web Server is Installed on this Web Site!

    If you see this page, the people who own this domain have just installed the Apache
    web server software successfully. They now have to add content to this directory
    and replace this placeholder page, or else point the server at their real content.'
