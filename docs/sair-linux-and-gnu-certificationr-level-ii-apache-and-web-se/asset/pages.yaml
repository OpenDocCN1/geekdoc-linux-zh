  md: '# Trojan Horses


    Trojan horses are named after the method the Greeks employed to circumvent the
    security of Troy. According to myth, after a futile 10-year siege, the Greeks
    built a large wooden horse and presented it to the Trojans as a peace offering.
    The Trojans accepted the horse and brought it into their heretofore impenetrable
    city. The Trojans did not know that the wooden horse had a belly full of Greek
    soldiers, who, in death of night, killed the city guards and opened Troy to the
    rest of the invading force.


    Like the story, a Trojan horse program looks harmless and claims to do something
    useful or entertaining for the user. When the program runs, it appears to do this
    task, but its primary, hidden function is to perform another, possibly malicious,
    task.


    A widely used Trojan horse replaces the login program. The Trojan program appears
    to perform the login command. In reality, the program captures the password of
    the user that logged into the system, mails the password to another account, logs
    the user in (or gives an error message and surrenders to the real login program),
    and removes itself from the system. This type of Trojan horsese is typically installed
    by an intruder, and its presence is not immediately known to the user.


    Another example might display an amusing animation or offer to play a game. While
    the user is being entertained, the program goes about its task of exploring the
    system, sending contact information to its master, or vandalizing the host system.


    # Viruses


    Viruses are another form of attack. A virus is a piece of code that might enter
    a system as part of a program. In the system, it may hide its identity in memory
    and attach itself to every program that runs every program finds files on disk.
    Some viruses are deliberately destructive in nature, destroying the master boot
    record on your hard drive, erasing programs, or simply rendering programs inoperable.
    Other viruses may not intend to cause damage but merely annoy by, for example,
    displaying a message or animation on your monitor. Frequently, due to poor coding
    technique, this class of virus can consume excessive resources and inadvertently
    cause downtime or data loss, sometimes because of simple panic.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Worms


    Worms are yet another form of attack. Unlike a virus, a worm enters a computer
    system as a stand-alone program not attached to other pieces of code. Once in
    the system, the worm goes about its business. Like a virus, a worm may be intentionally
    destructive, or it may be benign. Sometimes a benign worm, like a benign virus,
    will go out of control and cause unintentional damage or resource depletion.


    # Spoofing


    There are different types of spoofing attacks that prompt software into inappropriate
    action by presenting misleading information to software. In TCP spoofing, Internet
    packets are sent with forged addresses, and in DNS spoofing, the attacker gathers
    information about machine names and network addresses. In addition to these two
    spoofing attacks, there is Web spoofing, or the “man in the middle attack.” It
    allows an attacker to “shadow copy” the World Web, which lets the attacker monitor
    all the victim''s activities, including account numbers or passwords. While this
    attack mainly ends users, you should still know what it is and how it works to
    protect your Web site from being spoofed.


    # Buffer Overruns


    Buffer overruns are the source of most attacks to Linux systems. Their vulnerability
    comes from certain coding errors that are difficult for programmers to avoid,
    causing many programs to contain these errors. A buffer overrun occurs when certain
    variables receive more data than the program anticipated. If that variable happens
    to be responsible for storing input that someone can modify, a skilled attacker
    can induce the error condition at will, causing the program to crash or to function
    in ways that weren''t part of its original design. When an important and/or high-availability
    program contains one of these, it can be used as a path of attack.


    Attackers seek certain types of programs when looking for buffer-over candidates.
    Programs that have setuid privileges are favored by attackers. Setuid programs
    have root-level access, although they use the privilege only to perform small
    tasks, they have the ability to do almost anything nonetheless. When an attacker
    induces a buffer overrun within a setuid program, the program can crash in a way
    that leaves a root shell for the attacker. Another possibility is acceptance of
    errant behavior fininessed from the program, as if it originated from root.'
