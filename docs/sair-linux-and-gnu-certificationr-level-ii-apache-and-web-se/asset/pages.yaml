  md: '# Apache Today


    Apache possesses a level of complexity that easily surpasses some operating systems.
    Although it is not necessary to learn every feature to gain a functional understanding
    of Apache, an introduction to the overall design of the environment and methods
    used is a good start.


    The purpose of this section is to describe some of the configuration styles that
    Apache uses and to provide an overview of some encountered server features. Later
    in the course, when topics are described in more detail, a context is developed
    on which to base further learning. Ultimately, the goal of this book is to teach
    the user to set up an Apache server.


    The user can also go to the Apache Web site, www.apache.org/docs/, and study the
    full documentation in depth. The online user documentation for Apache is one of
    the most well-written and accessible sources of information for any project.


    # How Does Apache Work?


    Apache is a monolithic Web server. It looks to centralized configuration files
    for all parameters that are not compiled. Apache works much like the Linux kernel.
    It forks off child processes, accepts loadable modules, and operates via user-specified
    configurations.


    # Web Server Concepts


    On a system functioning as a Web server, the server process listens for incoming
    requests on a specified port of the network interface and responds to them appropriately.
    Originally, a Web site consisted of a directory of static documents, which would
    be served on request. Special functions could be handled by CGI scripts that are
    executed on request.


    Over the years, people have developed variations of this basic function, requiring
    a rethinking and retooling of the original Web server definition to the point
    that today''s Web users and authors expect a certain amount of active participation
    by the server. today''s server must not only provide a Web page, it must create
    it on user demand. Although the basic process is the same, expected enhancements
    place much more demand on a server than was required when static content was the
    only possibility.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Apache Child Processes


    Apache works by splitting itself and having the Apache copy handle the process.
    Child processes are the processes that actually dole out content. When Apache
    receives a request, it chooses one of its idle child processes to handle the request.
    When the child is done, it returns to an idle state, ready for more work.


    Every child completes its list of requests before dying. Killing a child process
    after it completes its list of requests also kills side effects of those processed
    requests, such as memory leaks. The user can determine the number of children
    Apache spawns at one time, as well as their life span. By default, each child
    handles an unlimited number of requests.


    # Apache Conventions


    A good way to learn how Apache functions is through its configuration. The first
    level of configuration occurs when Apache is compiled. RPM- and Debian-based installations
    decide many things by default, but when compiling from source options can be set:


    +   - Whether Apache uses Dynamic Stored Objects or statically linked modules
    (modules will be described in further detail later in the chapter)

    - If static modules are chosen, tell Apache which modules to compile into the
    server at this point

    - Default location

    - Layout of Apache''s files and directories


    The next level of configuration occurs in http.conf after the installation. The
    http.conf is a global preferences file that controls all aspects of the server,
    including the following:


    +   - Who can access the Web server

    - What dynamic modules the server loads

    - Where certain functions occur

    - What kind of information Apache will log

    - The location of the virtual Web sites Apache controls

    - What content is allowed'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The last level of configuration may occur in .httpaccess files, depending on
    what is stated in httpd.conf. These are small, local files that contain specific
    orders that apply to the directories where they reside.


    The httpd.conf file contains more than three-fourths of the Apache configuration
    options. It allows administrators to configure Apache to an optimal level at performance.
    This is possible because, based on users'' needs, Apache offers many levels of
    control through the httpd.conf file. These levels are called scopes. A scope can
    apply to an entire system, a virtual host, an absolute directory path, or even
    a single file. Wild cards can be used with scopes to give greater freedom. Containers
    are used to define each scope.


    The following are the four main containers:


    ```

    <Directory/path>

    # This container applies to the filesystem location of a directory.

    # For example, /home/user/public_html would point to user''s public_html directory.

    Directive

    </Directory>

    ```


    ```

    <Location /**>

    # Location applies to a url. For example -/user would point to user''s public_html
    directory.

    Directives

    </Location>

    ```


    ```

    <VirtualHost host_name>

    # VirtualHost applies to a virtual web site you are hosting, such as mysite.com

    Directives

    </VirtualHost>

    ```


    ```

    <Files file_name>

    # Applies to a file name, no matter where it is located. If file_name were index.html,
    then all instances of index.html (no matter what their location) would be affected
    by your directives.

    Direct

    </Files>

    ```


    # Directives


    A directive is a command given to Apache that controls its behavior. Directives
    are a single line of text with the following format:


    ```

    Directive [option [option]]

    ```'
