    # Verify Functionality over a Network


    Once Apache is functioning correctly on the local system, the user can perform
    a network test. If there are nearby machines on a local network, the user can
    go to any of those machines and use a browser. Access the server with the IP address
    of the machine''s network interface to eliminate any problems that DNS may cause.'
