- img_proc: true
  md: '# Table 3.2 Substitution Flags


    | FLAG | ACTION |

    | Redirect | R [=code ] | Prefixes Substitution with http://currenthost[:port]/,
    which forces an external redirection. If code blank is left, the HTTP response
    302 (MOVED TEMPORARILY) is given. "code" can be any number in the range of 300
    to 400. |

    | Forbidden | F | Immediately sends back an HTTP response of 403 (FORBIDDEN).
    |

    | gone | G | Immediately sends back an HTTP response of 410 (GONE). |

    | proxy | P | Forces Substitution to become a proxy request and redirects it through
    the proxy module. All rewriting processing stops here. If you do not have the
    proxy module compiled, this flag will fail. |

    | last | L | Stops the rewriting process at the flag. |

    | next | N | Runs the rewriting process from the first rewriting rule. It does
    not use the original URL, however, the URL as stands after processing. An infinite
    loop can be created with this flag, be careful. |

    | chain | C | Groups the current rule with the next rule. The effect becomes apparent
    if a rule does not match because rewriting skips all following chained rules.
    |

    | type | T=MIME-type | Changes the MIME-type of the target file to MIME-type.
    |

    | nosubreq | NS | Forces the rewriting engine to skip a rewriting rule if the
    current request is an internal request. |

    | nocase | NC | Makes pattern-insensitive when matching against the current URL.
    |

    | qsappend | QSA | Instead of replacing the current string, it appends a query
    string part in Substitution to the existing string. |

    | passthrough | PT | Looks at the internal rec_rec structure and sets the URI
    to the value of file name. |

    | skip | S=sum | Skips the next n rules when the current rule matches. |

    | env | E=VAR:VAL | Gets an environmental variable VAR that has the value of VAL,
    which can contain regexp backreferences $N and %N. Use this flag as often as you
    wish to set variables. |


    Any server on a network faces security risks. The next chapter will discuss methods
    of tightening security on your Apache server.'
