    \ execute scripts\n</Directory>\n```\n\nSave and restart Apache with the following:\n\
    \n```\napachectl restart\n```\n\nNext, a name-based virtual host will be configured.\
    \ Among the many features offered by Apache is the ability to host different sites\
    \ on the same machine. Small to medium-sized Web sites can typically be run off\
    \ a medium-grade Pentium machine with a 10-bit Ethernet connection. A 10-bit"
