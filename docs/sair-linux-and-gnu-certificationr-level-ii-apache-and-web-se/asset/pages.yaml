- img_proc: true
  md: 'Enter kl4u137 at the prompt. Now that you are in, use the following code to
    add a new user, Apache and mod_auth_mysql can use to validate:


    ```

    INSERT INTO mysql_auth (username, password, groups) VALUES (''user_1'', password(''cff33''),
    ''test'')

    ```


    user_1 will be the first Web-based user for us to use.


    Notice the use of password cff33 as the value that went into the mysql_auth password
    field. Type the following:


    ```

    select * mysql_auth;

