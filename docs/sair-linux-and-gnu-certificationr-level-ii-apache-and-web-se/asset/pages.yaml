    You will notice that the password column does not look like cff33 at all. password()
    is the default function mod_auth_mysql uses when it checks passwords.


    Open your httpd.conf file and add the following lines:


    ```

    Auth_MySQL on apache_user

    Auth_MySQL_Info localhost apache_user kl4u137

    Auth_MySQL_Encryption_Types MySQL

    ```


    Auth_MySQL_Info designates the standard database you are using, the username and
    password you use to connect to, and the location from which you plan to connect
    (in this case, localhost).


    Auth_MySQL_Encryption_Types is the method by which mod_auth_mysql will encrypt
    your passwords. There are three options here:


    +   - Plain text

    - Crypt_DES

    - MySQL


    You can use one or all of these options, and the module will use each method to
    check your database. Because we inserted our user with the password() function
    in MySQL, it makes sense to choose the MySQL option.


