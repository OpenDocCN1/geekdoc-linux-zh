  md: '# Installation and Configuration 49


    The default index has a link to the official Apache documentation. We will be
    referring to the local copy throughout this chapter, but it can also be found
    on the apache.org Web site.


    Different distributions perform different functions. The default install is similar
    to the following:


    ```

    /etc/httpd/conf ls

    access.conf httpd.conf default mime.types

    srm.conf.default access.conf default magic mime.types.default httpd.conf

    magic.default srm.conf

    ```


    These are the vanilla configuration files. In the past, Apache used a three-configuration
    file style where all general options were in httpd.conf. All resource-dependent
    configurations as virtual servers, directories, document root, and all the directives
    and options specify in the file system as they relate to Apache in srm.conf. Any
    relating to access of these resources, all Apache as blocking people from certain
    directories and turning on authentication, goes into access.conf. Three configuration
    files were confusing; all Apache configurations could go into one of the files.


    This outdated version of configuration filing was completely arbitrary. The system
    could have a zero length httpd.conf and srm.conf with all configurations in access.conf,
    and the system would perform the identical function. The main reason for this
    was for compatibility with the NCSA 1.3 Web server. Since the release of 1.3.4,
    configuration filing has moved away from this; now the default uses only the httpd.conf.
    If the user needs a distributions’ package, the configurations in the httpd.conf
    file should be checked. These lines, which are commented out by our default installation,
    are the ones to look for on the system to determine if Apache is using srm.conf
    and access.conf:


    ```

    #ResourceConfig/srm.conf

    #AccessConfig/access.conf

    ```


    As of version 1.3, the files can simply be deleted; however, you may want to explicitly
    set to zero by doing something similar to the following:


    ```

    ResourceConfig /dev/null

    AccessConfig /dev/null

    ```'
