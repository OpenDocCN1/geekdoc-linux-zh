  md: '# ab


    Apache comes with a benchmarking program called ab (Apache bench). It will be
    in bin within the main Apache directory if it has been installed from source.
    Although it is difficult to simulate a real-world situation, ab can put a heavy
    load on Apache and the underlying Linux system.


    The following is the syntax for ab:


    ```

    ab options http://hostname:port/path

    ```


    It ends up looking something like this in operation:


    ```

    # ab -n1000 -c100 http://192.168.1.1:80/htdocs

    ```


    A number of options allow benchmarks to be tailored to run in various ways. Some
    main options for use with ab are:


    +   **-n (number of requests).** This specifies how many times the specified page
    should be accessed. It can provide information about the speed of the server machine
    and the responsiveness of Apache.

    **-c (concurrency).** This option simulates a number of simultaneous connections.
    It defaults to 1, 1,000 or more can be defined. Setting the -c and the -n options
    to high numbers give an approximation of how the server works under a high load.

    **-v (verbose).** This option prints troubleshooting information.


    Running a benchmark with ab involves starting a server, determining what page
    to test, and then invoking the benchmark with the desired options.


    The following example is one of the larger pages in the Apache documentation that
    comes with the server:


    ```

    # ab -n1000 -c100 \://192.168.1.1/htdocs/manual/directives.html

    Server Hostname: 192.168.0.2

    Server Port: 80

    ```


    ```

    Document Path: /manual/directives.html

    Document Length: 12098 bytes

    Concurrency Level: 100

    Time for tests: 21.435 seconds

    Complete requests: 1000

    Failed requests: 0

    ```'
