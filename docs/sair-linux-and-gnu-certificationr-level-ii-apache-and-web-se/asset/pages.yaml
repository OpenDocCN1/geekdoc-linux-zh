  md: '# # Create a Simple CGI Script


    # ## Purpose


    This lab exercise will teach you to create a simple CGI script and execute it
    from both a command line and a Web browser. This lab will allow you to configure
    Apache to accept CGI scripts in a given directory, write a simple CGI script and
    make it executable, give parameters to a CGI from a URL, and process view parameters
    in the CGI''s output.


    # ## Theory


    The Common Gateway Interface (CGI) can do tasks that HTML cannot accomplish alone.
    CGI programs run on the server side, allowing you to create forms and guestbooks,
    among other things. CGI scripts are written most commonly in Perl, but they can
    also be written in C, C++, shell script-, Python, TCL, and other languages.


    CGI scripts are made available to a browser through the use of simple links, specialized
    URLs containing question marks, HTML tags, or HTML+FORMS. After an HTML document
    containing one of these elements is submitted, a query is passed to the HTTP server,
    which is then'
  merge: -1
  pgno: 235
- img_proc: true
  md: "passed to the CGI script itself. The script processes the input, formats the\
    \ output into HTTP codes or an HTML document, and returns the codes or documents\
    \ to the HTTP server. This information is then passed along to the client application.\n\
    \n# Lab Exercises\n\nCGI scripts can be shell scripts. This lab exercise will\
    \ allow you to create a simple CGI script and execute it.\n\n# Create a Basic\
    \ CGI Script\n\n> **NOTE** All tasks from here forward will be in the working\
    \ directory /usr/local/apache.\n\nConfigure Apache for /cgi-bin/ scripting as\
    \ root by adding the following lines to your httpd.conf file:\n\n```\nAlias /cgi-bin/\
    \ /home/httpd/cgi-bin/\n<Directory \"/home/httpd/cgi-bin\">\n    AllowOverride\
    \ None\n    Options None\n    Order allow,deny\n    Allow from all <Directory>\n\
    </Directory>\n```\n\nPaths may vary based on your installation.\n\n> **NOTE**\
    \ Save httpd.conf and restart Apache.\n\nCheck the log to see Apache's status:\n\
    \n```\n$ tail /var/log/httpd/error_log [Wed Dec 20 17:48:06 2000]\n[notice] SIGHUP\
    \ received. Attempting to restart [Wed Dec 20 17:48:10 2000]\n[notice] Apache/1.3.12\
    \ (Unix) mod_perl/1.21 PHP/3.0.16 configured - resuming normal operations\n```\n\
    \nOnce you see the resuming normal operations message, create the first script.\
    \ Create this file as /var/lib/apache/cgi-bin/set.sh as follows:"
