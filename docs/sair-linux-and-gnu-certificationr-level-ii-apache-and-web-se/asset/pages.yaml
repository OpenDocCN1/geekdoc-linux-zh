    # Apache Initialization


    When Apache starts up, it begins as root reading the

    /etc/apache/httpd.conf file. It opens the log files and then

    lunches a number of child processes, defined by the StartServers

    directive in the http.conf file. These child processes run as the user and

    group by the User and Group directives in the httpd.conf file.

    This can be seen by starting the Apache server and typing:


    ```

    root@$ ps -ef grep httpd

    ```


    This script returns the following:


    | Owner PID PPID | |

    | root10185 1 09:31:14 ? 0:01 /usr/apache/bin/httpd |

    | www-data 10189 10185 09:31:15 ? 0:00 /usr/apache/bin/httpd |

    | www-data 10186 10185 09:31:15 ? 0:00 /usr/apache/bin/httpd |

    | www-data 10196 10185 09:31:45 ? 0:00 /usr/apache/bin/httpd |

    | www-data 10188 10185 09:31:15 ? 0:00 /usr/apache/bin/httpd |

    | www-data 10190 10185 09:31:15 ? 0:00 /usr/apache/bin/httpd |


    Process ID 10185 is running as root; this is known as the Apache parent

    process. The StartServers directive is set to 5 in the httpd.conf file,

    and we see five other http processes running as www-data. Their

    parent ID is 10185, the Apache parent process.


    Changing the httpd.conf file makes it necessary to tell Apache to

    reread by stopping and restarting the server. This is accomplished by

    sending Apache a signal asking it to do so. There are two methods for

    doing this:


    +   - **restart.** Restarts every process immediately.

    - **graceful.** Allows current requests to complete before restarting the

    server.'
