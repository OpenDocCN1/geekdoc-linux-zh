    # Access Control


    Controlling access to directories is usually a relatively large concern for an
    Apache administrator. There are several ways to control access to different areas
    of the Web-space.


    # AllowOverride


    This is a very important directive and, if at all possible, should be set to None.
    The AllowOverride directive tells the server which access directives can be overridden
    by a .htaccess file. If AllowOverride is set to anything other than None, the
    server is forced to read every .htaccess file in every directory and subdirectory
    for every request, whatever the .htaccess file exists. This uses the system call
    and causes the server to do a context check for the file, and apply the directives
    in it before it can serve the request, slowing the server. If users need to set
    their own access, it may be best to use this directive to specify what can be
    overridden in the .htaccess file. Some decisions must be made, based on the site''s
    needs. Remember, it is important to recognize the performance consequences that
    result from enabling the .htaccess method.


    # Order, Allow, Deny


    These directives control access to specific parts of the server. They can be used
    in the <Directory>, <Files>, and <Location> sections to control access. It is
    also possible to control access based on client host name, IP address, or other
    aspects of the request using environmental variables. Use the Allow and Deny directives
    to define access (or lack of) to specific clients. Use the Order directive to
    set the default access state and configure how the Allow and Deny directives interact.


