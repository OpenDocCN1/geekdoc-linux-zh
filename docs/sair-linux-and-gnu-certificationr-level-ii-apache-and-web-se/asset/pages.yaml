  md: 'PostgreSQL is derived from the Postgres database object-relational database
    system. It supports declarative queries in SQL, query optimization, concurrency
    control, and transactions. It is completely Open Source and released under GPL.
    PostgreSQL comes standard with many distributions and is quite powerful. It can
