    # Configuring Apache as a Proxy Server


    Many install the Apache server while installing their particular distribution
    of Linux. Normally, distribution releases of the Apache software are not compiled
    with the mod_proxy module. Use the following command to list all modules currently
    compiled into the server:


    ```

    bash$ httpd -1

    ```


    If the mod_proxy module is not compiled into the release, then the user will need
    to obtain the Apache source and compile including the mod_proxy module. The previous
    method is recommended for an older version of Apache. In the newest version of
    Apache, uncomment and edit the lines in the httpd.conf configuration file:


    ```

    ## httpd.conf Apache HTTP server configuration file

    LoadModule proxy_proxy modules/libproxy.so

    AddModule mod_proxy.c

    ```'
