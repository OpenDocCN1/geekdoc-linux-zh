    # mod_perl


    Perl is a high-level programming language written by Larry Wall. It is derived
    from the C language and contains lots of functions and tools for numerous tasks,
    such as system administration, database access, string manipulation, networking,
    and most importantly, Web programming. The newest version of Perl is freely available
    at www.perl.com.


    Perl has its own module system. Perl modules are similar to libraries in other
