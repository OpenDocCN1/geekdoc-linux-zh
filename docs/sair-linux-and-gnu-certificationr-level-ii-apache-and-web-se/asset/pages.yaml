  md: '# # Create a Custom Log for Apache


    # ## Purpose


    The purpose of this lab is to create and implement a custom log file that tracks
    remote IP-addresses, lists the REFERR environmental variable, the time the request
    occurred (common log format), and the time it takes to serve the request. Optionally,
    you can run `resolve` to resolve the IP addresses, as well as view the log file
    using a popular log-viewing program.


    # ## Theory


    By default, Apache comes with basic logging capabilities. However, the logging
    capabilities of Apache can be greatly expanded by using the `mod_log_config` module.
    This module allows the administrator to set custom log definitions through the
    `httpd.conf` file. `mod_log_config` contains several different directives used
    to configure the log file, but the main directive of interest is LogFormat, which
    is used to specify what data is to be placed in the log and in what format. Other
    `mod_log_config` directives are listed in Table IX.1.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Table IX.1 mod_log_config Directives


    | DIRECTIVE | DESCRIPTION |

    | CookieLog | Sets the file name for logging cookies |

    | CustomLog | Sets the file name of the custom log |

    | TransferLog | Similar to custom log, with some restrictions |


    The basic syntax for the LogFormat directive is as follows:


    ```

    LogFormat formatations name

    ```


    where formatations specifies the format to write and name is an identifier used
    by CustomLog Directives.


    The most useful characteristic of mod_log_config is its ability to configure the
    data contained in a log file. This is done by providing a list of options to the
    LogFormat directive. A list of some of the options is provided in Table IX.2.


    # Table IX.2 Options for mod_log_config


    | OPTION | DESCRIPTION |

    | %a | Remote IP address |

    | %A | Local IP address |

    | %B | Bytes sent, not including headers |

    | %D | Time taken in microseconds |

    | %h | Remote host |

    | %H | Request protocol |

    | %P | PID of serving process |

    | %r | First line of request |

    | %t | Time in CLF |

    | %u | Remote user |

    | %U | URL path requested |'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Create a Custom Log for Apache 241


    The codes shown in Table IX.2 can be included on a conditional basis by placing
    an HTTP code between the percent sign (%) and the letter. For example, %404U will
    put the requested URL in the log file if an HTTP 404 error is encountered. By
    putting an exclamation point (!) before the HTTP code, the negative condition
    will cause logging. Text may also be put in a log file entry by placing it within
    braces {} and inserting between the percent sign and the letter.


    Once a format has been specified in httpd.conf, it must be implemented via either
    CustomLog or TransferLog directives. CustomLog is more commonly used because it
    is more versatile. The typical format for a CustomLog directive is this:


    ```

    CustomLog file name

    ```


    file specifies the file to which to log, and name is the name used in the LogFormat
    directive.


    # Lab Exercises


    > NOTE This lab assumes that the user has Apache with mod_log_config installed.


    +   1. Open httpd.conf in a text editor.

    2. In the main section of the file, add a LogFormat directive that lists remote
    IP addresses, lists the REFERR environmental variable, the time the request occurred
    (common log format), and the time to serve the request.

    3. Create a name to reference this configuration.

    4. Add a CustomLog line that logs data to /var/log/access_log.test using the format
    created in Step 2.

    5. Restart Apache.

    6. Make a request to the Web server from another machine.

    7. Open /var/log/access_log.test in a text editor to test the configuration.'
  merge: -1
  pgno: 263
