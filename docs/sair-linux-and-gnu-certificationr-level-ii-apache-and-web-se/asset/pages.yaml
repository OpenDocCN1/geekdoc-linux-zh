  md: '# Introduction


    Welcome to the Level II study guide series for the Clair Linux and GNU Certified
    Engineer. This is the Apache study guide for Clair Linux and GNU Certification,
    Exam 3X0-202. The Apache study guide is one of the optional elective subjects
    for the Clair Linux and GNU Certified Engineer (LCE) certificate.


    Requirements for the Clair Linux and GNU Certified Engineer (LCE) include passing
    the Core Concepts and Practices exam, 3X0-201, plus three additional exams from
    other elective subjects. In addition to this study guide, other possible elective
    areas include Sendmail and mail system components, Samba and resource-sharing
    components, and PHP and scripting. See www.linuxcertification.com for a complete
    list of available courses. Each course consists of a minimum of 32 classroom contact
    hours, making the LCE equivalent to an additional 128 hours of classroom contact
    beyond the LCA. We achievement of the LCE to be evidence of the ability to perform
    as an advanced Linux systems specialist, as a system administrator supervisor,
    or in some other form of Linux system management.


    Exams are offered at Prometric and VUE testing centers. Prometric offers the Clair
    exams at any one of its 3,500 testing centers in 141 countries. To take a test,
    simply call the Prometric registration line at 1-888-995-6717. Ask the customer
    service representatives about the 3X0 series of exams, and they will answer any
    test-taking questions related to the test, describe available local testing centers,
    and, if requested, schedule an exam. It is also possible to register for tests
    at www.prometric.com. VUE offers the Clair exams at any one of 2,500 testing centers
    in 110 countries. To take a test, call the VUE registration line at 1-952-995-8800.
    Ask the customer service representatives about the 3X0 series of exams, and they
    will answer any test-taking questions related to the test, describe available
    local testing centers, and, if requested, schedule an exam. It is also possible
    to register for tests online at www.vue.com/sairlinux.'
