  md: '# CHAPTER

    5


    # # Troubleshooting


    # ## Objectives


    +   - List Apache online troubleshooting resources.

    - List common Apache messages and debugging options.

    - List common configuration and logging problems.


    # ## Online Troubleshooting Resources


    The online Apache manual at www.apache.org/docs/ is always a good place to start.
    There is also a generic Apache FAQ available at www.apache.org/docs/misc/FAQ.html.


    Search the live Problem Report (PR) database at http://bugs.apache.org. Near the
    top of this page you can enter a search string and search the entire database.
    Further on down the page you can enter a number of parameters to narrow your search.'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'At http://dev.apache.org you will also find links to archives of the new-httpd
    mailing list. This archive is the list that the developers of Apache have been
    using for years to discuss issues related to the development of the Web server.
    There is a lot of information in these archives. Subscribing to the new-httpd
    mailing list just to listen is a good idea. Subscription instructions along with
    a list of other mailing lists can be found at: http://dev.apache.org/mailing-lists.html.


    The primary user support form available for Apache is the comp.infosystems-www.servers.unix
    newsgroup on USENET. Archives of this group can be found at www.deja.com/group/comp.infosystems.www.servers.unix.


    # Tracking Down an Apache Core Dump


    Occasionally, things go wrong. There are many reasons for Apache crashing, such
    as a bug in the Apache code, bad memory in the machine, or a bug in a third-party
    module that was added. In order to understand what might have caused the crash,
    there are a number of things that can be done.


    Check the /var/apache/logs/error_log file.


    Here are some possible messages:


    ```

    Tue May 2 09:20:46 2000 [notice] Apache/1.3.14

    (Unix) mod_perl/1.21 configured - resuming normal operations

    ```


    This is a good message. It means the server has started up and that it is happy.


    ```

    Tue May 2 09:21:17 2000 [notice] caught

    SIGTERM, shutting down

    ```


    This is also a good message. It means the server was shut down normally using
    something such as apachectl stop.


    ```

    Tue May 2 09:41:25 2000 [notice] SIGHUP

    received. Attempting to restart

    ```


    This is a good message. It means the server was restarted with a command, such
    as apachectl restart.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Troubleshooting 189


    ```

    Tue May 2 09:31:14 2000] [warn] pid file

    /var/run/httpd.pid overwritten - Clean

    shutdown of previous Apache run?

    ```


    This is not a very bad message. It means that something happened to the Apache
    server on its last run and that it did not shut down cleanly.


    ```

    Tue May 2 09:31:44 2000] [notice] child pid

    10187 exit signal Segmentation Fault (11)

    ```


    This is a very bad message. It means one of the httpd child processes dumped.


    If a Segmentation Fault error or perhaps a Bus Error is found in the error_log
    file, there are a couple of tools available that might provide a hint as what
    might be causing the problems:


    ```

    /opt/sfw/bin/gdb

    /usr/bin/truss

    /usr/bin/mdb

    ```


    # A typical use of gdb:


    ```

    # gdb /usr/apache/bin/httpd

    GNU gdb 4.18

    Copyright 1998 Free Software Foundation, Inc.

    GDS is free software, covered by the GNU General Public License, and you are welcome
    to change it and/ distribute copies of it under certain conditions.

    Type "show copying" to see the conditions.

    There is absolutely no warranty for GDB. Type "show warranty" for details.

    You can compile the httpd from the Source Package.

    PATH=/usr/sbin:/usr/bin:/opt/sfw/ccs/bin

    cd /usr/share/src/apache

    ```


    > NOTE We run httpd with the -X flag, which means that it will be started in non-forking
    mode. This makes it much easier to trace, as we have only a single httpd process
    to worry about this way.


    # Some Useful Sites


    The following sites will help you in your troubleshooting efforts:'
  merge: -1
