  md: 'As shown, there is more than one option for your key word. Although there can
    be more than one directive in a given scope, each directive must occur on its
    own line. Directives that do not reside in any container apply to all scopes.


    # Handlers


    When a user requests a file, Apache decides what to do with it. For example, if
    the user accesses a file hiccup.cgi, Apache must execute that file as a CGI script
    and not try to display it as an HTML file. Handlers help you direct Apache to
    the correct helper application. For example, add a handler called cgi-script and
    apply it to all files with an extension of .cgi at the end.


    # Logging


    Apache logs almost everything that happens to it, from errors to http transactions
    and even cookies. The user can set the level of logging and what is logged in
    the httpd.conf file.


    # Modules


    Modules are chunks of software (usually written in Perl or C) that allow customization
    of Apache. For instance, for Apache to use Server Side Includes, the user must
    install that module.


    Even though Apache was originally developed with this concept in mind, it was
    not available when the first versions of Apache were being developed. Still, because
    it was already being planned at that time, integration of dynamic module loading
    into the Apache server can come relatively easily.


    In early versions of Apache, modules were statically linked to the application
    during compilation. The specific configuration of a server was defined during
    the configure process before compilation. Using this method, many helpful modules
    were developed over the years, making a tremendous amount of customization available
    for the Apache server. Since the release of Apache version 1.3, it is possible
    to compile the server and the modules to support dynamic loading. With this option,
    the configuration of the server can be changed by restarting the server after
    editing the configuration file (rather than recompiling the server). Different
    instances of the server can be started at separate times or simultaneously using
    different configuration files running the same base installation.'
