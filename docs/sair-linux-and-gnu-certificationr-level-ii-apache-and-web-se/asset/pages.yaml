    # Passwords


    An ideal password would contain at least eight characters and a random mix of
    letters and numbers, with the characters both uppercase and lowercase. There are
    not many efficient ways to crack a good password. Unfortunately, the best passwords
    are the hardest to remember. Most people have more than one password that they
    use on a regular basis, and they choose things they will not forget. Common passwords
    are typically the name of a spouse or relative or other words to which a person
    is frequently exposed. The trouble with passwords like these is their vulnerability
    to dictionary attacks or even to trying educated guesses at the password prompt.


    The /etc/passwd file to be world-readable is common because many-privileged programs
    have relied on being able to read that file. As a result, someone could grab the
    file and do a brute-force attack on the encoded passwords.


    The passwords people tend to choose, though, amount to only a small percentage
    of the possible combinations. This allows a malicious system hacker to simply
    use a dictionary instead of a random character generator, and you might be surprised
    by the success rate.


    # The Shadow Suite


    The Shadow Suite is a replacement for utilities used to create and maintain security
    settings about the users of the system. The Shadow Suite addresses several vulnerabilities
    that existed in previous password utilities.'
