    # Number of httpd Processes


    A server process can run in one of two modes. Many servers are managed by inetd,
    a server process (or daemon) that listens for incoming requests and starts a new
    server to match the request. This is the common way to start lightweight servers
    as Telnet and FTP.


    inetd is not practical for larger servers, such as Apache, because take too much
    time to start and are called many times on an active system for inetd to be practical.
    Instead, they run as stand-alone processes (set ServerType in httpd.conf to standalone
    rather than inetd). This means that a daemon for httpd is started and spawns new
    copies of its (servers), which actually handle the incoming requests. Each request
    is handled individually by one copy. So that it will be ready immediately, the
    daemon spawns several copies initially (Start-Servers). Each child process can
    be set to self-destruct after handling a number of requests (MaxRequestsPerChild)
    to compensate for memory leaks in some systems, or the child process can be allowed
    to run indefinitely. If the load increases, the daemon spawns more processes so
    that several spares (MinSpareServers) stay in reserve. If the load decreases and
    the number of idle child processes exceeds MaxSpareServers, the excess child processes
    are killed off to free resources. If the load increases a great deal, the excess
    clients above MaxClients are ignored, in order to place a limit on how much of
    a load Apache places on the system. Monitor the system load and determine if the
    number of clients is is anywhere near MaxClients. Be careful that the MaxClients
    is not too low. By anticipating high initial loads, increase StartServers and
    the other values.


    > TIP Use apachectl status to help monitor usage.'
