  md: '# Chapter 3


    where variable is the environmental variable.


    Apache looks up the variable through internal structures. If it does not find
    it there, it uses getenv() from the Apache server process.


    %{HTTP:header}


    Use %{HTTP:header} where header is any HTTP MIME-name to find the value of header.


    %{LA-U:variable}


    If you want to determine the value of a variable that is actually set later in
    an API phase, use %{LA-U:variable}. It performs an internal (URL-based) subrequest
    and determines the final value of the variable.


    %{LA-F:variable}


    A synonym of %{LA-U:variable} is %{LA-F:variable}. Rather than performing a URL-based
    subrequest, it performs an internal, file-based subrequest.


    # RewriteRule


    RewriteRule is the directive that completes the tasks in the preceding example,
    and it is often used with mod_rewrite.


    The syntax is as follows:


    ```

    RewriteRule Pattern Substitution [flag]

    ```


    where Pattern is a POSIX regular expression in Apache versions 1.2.x and later.
    The RewriteRule can be applied more than once. Pattern applies to the URL as it
    stands when it reaches Rewrite Rule, not the URL originally requested. If there
    are problems getting RewriteRule to work properly, look at what has been done
    to the URL already to see if it has been changed to unrecognizable. As with RewriteCond,
    (! ) can be used as a Pattern prefix.


    # Substitution


    Substitution is the string that replaces the URL pattern matched. Table 3.2 gives
    a list of substitution flags and their respective actions.


    RewriteRule uses the original URL and URI in two special variables called SCRIPT_URL
    and SCRIPT_URI.'
