    # # Hard Drive


    Loading and running a Web site from RAM offers the fastest delivery of Web pages.
    Unfortunately, this configuration may not be possible; therefore, the hard drive
    must be accessed. Accessing the hard drive is significantly slower than RAM. To
    offset this performance lapse, use hard drives.


    SCSI drives are generally faster than IDE drives because they put less of a load
    on the system. If a Web server is already taxing the CPU, it is a good idea to
    remain with the SCSI drives.


    To optimize hard drive performance, take the following into account:


    **Swap space.** People often forget to put swap space on a different partition
    from the rest of the data. Not doing this can greatly slow down the Web server.
    If possible, put it on a completely different disk. Putting the swap partition
    on the first partition of the disk can actually increase transfer rates for some
    data by a factor of 2.


    **Multiple drives and logs.** Apache logs every single request that hits it. All
    of this logging means much writing to disk. If multiple drives are available,
    put the Apache logs (as well as any other logs) on the fastest drive of the bunch.


    **Logging.** If you are not planning to use logging, turn it off. While doing
    this, the speed enhancement will be substantial. This could be dangerous, because
    Apache will not write every request and error to a disk. If logging is desired,
    define the levels that work best with the system. There will be a difference in
    the error log when LogLevel is changed from debug to emerg.


    # # Kernel


    If performance is a major issue, do not run a stock kernel. Linux distributions
    tend to have a large kernel to accommodate the variety of potential hardware types
    that might be used with it. As a consequence, it can be slower than a kernel that
    has been configured by hand and pared down.'
