    # Blocking Access


    It is possible for the outside world to view the entire symbolic contents of a
    server machine’s file system if there are improper symbolic links to content that
    is accessible from outside the server. In other words, if an innocuous index.html
    file were linked to />, everything on the system would be available for perusal.


    The <Directory> directive can prevent mistakes. It allows a user to apply rules
    exclusively to a particular directory. By default, the server will inherit the
    preexisting directives on the server.


    To control access to your Web content, the server are a number of directives at
    your disposal:


    +   Deny and Allow

    Order

    Deny and Allow


    These directives use the visitor’s originating host as a criterion to determine
    if access will be permitted. As with most Linux/Unix security models, these criteria
    are based on one of two perspectives that specifically denies or allows.


    The syntax is as follows:


    ```

    Deny from host

    ```


    or


    ```

    Allow from host

    ```


    The host specified can be a specific host name, an IP address, or any of the following
    criterion arguments:


    +   **all:** Wildcard, all hosts.

    **domain-name:** Exact or partial names will be matched.

    **IP address:** Exact or partial addresses will be matched.'
