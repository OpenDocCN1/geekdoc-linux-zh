    hierarchical, relational, and object. The relational model, formally described
    by E. F. Codd in the late 1960s (published in 1970), has been extremely successful
    and is the type of database that will be examined here.


    A database consists of a set of data organized for easy retrieval and software
    is designed to retrieve it. In a relational database, the underlying concept is
    everything stored in tables. Although there are special technical terms for the
    components of a database, the more familiar common terms will be used in this
    discussion, with some reference to classical programming terms. A table consists
    of rows (records), which are divided into columns (fields). Each row in a table
