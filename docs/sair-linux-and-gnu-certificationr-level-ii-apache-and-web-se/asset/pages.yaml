    the firewall itself, but it is often used with a firewall. In some implementations,
    such as SOCKS, though, it can be used as the firewall itself. The main purposes
    of proxies are to enhance performance of Internet requests by caching files and
    to play a role in allowing/denying access to other network resources on either
    side of a firewall. The proxy will often sit on the firewall itself. Like a firewall,
    the proxy will have access to the outside. When the user configures a client to
