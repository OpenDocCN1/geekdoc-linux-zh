    # History of Apache


    Apache is based on NCSA’s httpd, a daemon that was first used in the early years
    of the Internet. Rob McCool was the creator of the NCSA Web server and continued
    his work on it until 1994. No single programmer took his place, but the server
    continued to grow in popularity. After his departure from the project, incompatibilities
    between versions began to develop. Web administrators had to make changes on their
    if they wanted to fix bugs or add features. Eventually, a group of administrators
    began working together to regain control of the project. Their efforts created
    a single path through which patches and enhancements to httpd could be submitted.
    The name of the project is derived from its origins: a series of patches applied
    to the original httpd daemon. The project came to be known as “a patchy server,”
    and from there, Apache server.'
