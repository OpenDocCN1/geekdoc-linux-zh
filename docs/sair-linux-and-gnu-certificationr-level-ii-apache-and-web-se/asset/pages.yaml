    # /var/apache/logs/access_log


    Apache adds a line to this log file for every request it receives. By default,
    entries are similar to the following:


    ```

    192.168.1.1 - [05/May/2000:12:32:52 -0700] GET / HTTP/1.0* 200 1622

    ```


