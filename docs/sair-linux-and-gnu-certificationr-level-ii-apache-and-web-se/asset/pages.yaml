  md: 'The second example is a redirect to another server. In this case, the Web browser
    does get a response from the original server but is told to immediately view a
    page on a different server:


    ```

    #!/bin/sh

    # oldnew2.sh - redirect from old server to new server via CGI

    # redirect to http://someone.elses.server.com/cgi-bin/new.sh

    echo Location: http://someone.elses.server.com/cgi-bin/new.sh

    echo

    ```


    A blank echo command is necessary even when the header contains a simple location
    directive.


    While Apache CGI implementation knows the difference between a local and remote
    redirect, the client browser does not. When working in a non-CGI environment,
    as PHP, or with a different Web server, however, not rely on the server passing
    the right header.


    The basic redirect shown previously does not give the anything in the browser
    window while the redirect is taking place. It is possible to return a page, give
    the user a few seconds to read it, and then redirect the user to a new page. This
    is through a Netscape Refresh HTTP header extension.


    As a Netscape extension, this method is widely used but not accepted by the World
    Wide Web Consortium. Although most browsers behave properly when seeing the Netscape
    Refresh HTTP header, some may not redirect but will stay on the original page.


    A Refresh tag is similar to the following:


    ```

    Refresh:5;URL=http://my.new.server.com/

    ```


    In this case, the Web browser loads http://my.new.server.com/ after five seconds.
    The length can be any number of seconds desired. Here is example:


    ```

    #!/bin/sh

    # redirect.sh - redirect via CGI script a new server

    echo Content-type: text/plain

    echo "Refresh: 5;URL=http://my.new.server.com/*"

    echo redirecting in 5 seconds...

    ```'
