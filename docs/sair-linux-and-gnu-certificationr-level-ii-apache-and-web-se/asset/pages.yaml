    # Basic Redirect


    Because a CGI script controls the header, it is able to do some things that are
    more difficult or impossible to do with just HTML. One common use of a CGI script
    is to redirect a user to a different page on a Web server using the Location header.


    The Location header can be used to give the client a different page to view. It
    can be another document on the same server or a different URL (referencing a different
    server) altogether.


    In the first example, a Web browser requests an old URL. A CGI script gives the
    new, moved page back to the client. The server acts as if the client had requested
    the new script, and the client never knows the difference because it still holds
    the old URL in its window.


    ```

    #!/bin/sh

    # old2new.sh - redirect from old CGI script to new CGI script

    # redirect to http://my.server.com/cgi-bin/new.sh

    echo Location: /cgi-bin/new.sh

    echo

    ```'
