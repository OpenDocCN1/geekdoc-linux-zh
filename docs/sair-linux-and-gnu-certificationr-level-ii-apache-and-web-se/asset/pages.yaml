    mod_perl mailing lists and are more located at http://perl.apache.org.


    # Introduction to the Apache API


    The Apache Application Programming Interface (API) is the method by which new
    pieces of code (i.e., Apache modules) integrate their handlers into the main flow
    of operation in Apache. Knowing the steps Apache follows when handling a request
    can help you to understand how Apache works.'
