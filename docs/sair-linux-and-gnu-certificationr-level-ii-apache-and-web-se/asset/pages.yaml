  md: '# Theory of Operation


    Now that Apache is installed, the administration of the Apache server and modules,
    as well as the hardware and operating system that is running the Apache server,
    must be continued. This section will discuss the various roles and responsibilities
    a system administrator or Webmaster will have while configuring and running the
    Apache server.


    # Being a Webmaster


    The title of Webmaster carries many different duties, all of which will be the
    responsibility of one person at some of the smaller Web installations. In a larger
    installation, different parts of the task are likely to be divided among several
    different people. The main groups of duties are:


    +   **System administrator.** Having total authority over the system.

    **Configuration management.** Configuring the Web server.

    **Content management.** Controlling design and deployment of the Web pages.


    The system administrator has responsibility for the integrity of the system itself.
    This is suspicious of changes to the system and is ever vigilant against intrusions
    from outside or from ordinary users exceeding their boundaries. The system administrator
    is in charge of the base operating system and usually has the hardware as well.


    In the Web server''s space, there are settings specific to each Web server, the
    Webmaster is interested in protecting more than the system, and yet changes made
    to the server configuration files can cause problems for the system administrator.
    This manager must have awareness of the consequences at this level specific to
    Web operation and beyond the knowledge of a general Unix system administrator.
    Though the Web daemon must be started by someone with root privilege, this person
    has no other needs for root privilege. Integrity of the Web server configuration
    files is the highest priority of this task.


    There is yet another Webmaster—one who trades in content and process more than
    configuration. This person works with the artists who create the Web pages and
    directs the structure of the Web site. This person depends on the configuration
    being correct and makes requests based on the needs of the site. The tree of the
    Web site is built by this person. Direct contact'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'with building the Web server and setting the configurations is not central
    to this job, though this person will need to request changes when new features
    or new revisions become available.


    In an individual''s site or a moderately sized corporate site, these three conflicting
    personalities can be embodied in a single individual, or all duties can be shared
    by several people. In a larger site, they can be handled by two, three, or more
    people, with the root user being a different person than the Webmaster. The lines
    that separate the responsibilities can vary from one installation to another.
    At an Internet Service Provider (ISP), the provider could perform the first job
    or the second job (the third job will fall mainly with the end client). With virtual
    system methods, an ISP could gain control of an entire "virtual system" to a client
    or just the configuration and content files or content files alone. If you are
    in charge of a system that is shared by many users, you will have to decide where
    the responsibilities lie and which powers to gain level of Webmaster.


    When the system is controlled by a single organization, the lines of division
    are much less critical. At a corporate site, the system administrator might give
    up root privileges to the Web managers, either temporarily or for a specific system
    dedicated to Web use.


    When a system is shared among unrelated users, decisions at this level have more
    impact on system security. You will have to decide how much freedom to give to
    the Webmasters at your site and how much personal freedom to give in order to
    maintain control. If you keep control over server configuration, you will have
    to be available to perform configuration changes. If you give up control, you
    will want to do it in a way that doesn''t give up the security of your other clients.


    Specific commands can be opened up to the Webmaster or to the end user with tools
    like the following:


    +   **sudo (super-do or pseudo-su).** Allows a user to run selected commands as
    superuser. Visit www.courtesan.com/sudo.

    **chroot (change root).** Restricts access to another user''s directory tree by
    changing the root directory that the user sees as the system root to a portion
    of the actual system root (probably just the user''s personal directory). Visit
    http://hoohoo.ncsa.uiuc.edu/tutorials/chroot.html.

    **suex.** Switches the effective user of a CGI script to that of the user account.
    Visit www.apache.org/docs/suex.html.'
