  md: '# Chapter 2


    When a group of Web sites is shared by the same organization, or perhaps different
    divisions or departments of the same corporation, the group of sites will probably
    be managed by the same person or group of people. There is no concern about information
    being shared between them or one of the sites being sabotaged by a partisan of
    another site. In instance, perhaps in a public Web site hosting service, the adjacent
    Web site may be occupied by a total stranger. In this latter instance, there is
    a need for separation between users of each site. Control of the Web server configuration
    becomes a sensitive issue.


    Of course, there are several solutions. A separate Web server daemon for each
    site could allow each Web client to manage its own configuration file and not
    have access to its neighbor''s. Restricting management of the configuration file
    to the site administrator is another alternative.


    # Tuning


    Running Apache on Linux works quite well, even under high server loads. There
    are a number of settings and directives that can be adjusted to further enhance
    performance. Apache 1.3 introduced a number of performance-enhancing changes to
    the code and default configuration. As a result, not much still needs to be modified,
    compared to previous releases. A few things remain that can enhance performance
    further, including optimizing Linux for increased speed and capacity.


    Before optimizing, think about what the server needs to do. Will other services,
    such as mail, FTP, and databases, running on the same box? Will enough images
    be served to require a separate server?


    Many large Apache installations separate the data server from the HTTP server.
    If planning a database-driven Web site, it pays to look at that option. Freeing
    the Web server from working with a database helps focus on delivering static html
    content.


    # Preparing Apache


    The Apache developers have increased the performance of the server with the release
    of 1.3.14. As a result, performance is nearly optimal. Some additional adjustments
    that can increase performance have not been included by default their optimal
    settings can be determined only by the administrator at a given location.'
  merge: -1
