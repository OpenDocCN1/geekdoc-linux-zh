    # Managing User Accounts and Security Privileges


    It is standard business practice that certain transactions be available to some
    users and not to others. For example, the user who enters invoices may be a different
    person from the one who pays invoices. Another user can enter payroll data, while
    someone else can only look at it (although most are not permitted to look, either).
    The business rules of a task are reflected in the design of the corresponding
    database. Users of a database are granted privileges based on what operations
    they need to perform and what portions of the database they are permitted to access.
    Privileges can be granted to users either by directly manipulating the user table
    or by the preferred method of using the `grant` command.


    Syntax for the `grant` command is:


    ```

    GRANT privileges

    ```


    on the user identified by `password` with `grant` option.


    # PRIVILEGES AND OPERATIONS ALLOWED


    +   ALTER

    Alter tables and indexes

    CREATE

