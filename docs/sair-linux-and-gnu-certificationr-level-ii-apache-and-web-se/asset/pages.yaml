  md: '# date


    This field contains the date and time the request was initiated. The format is
    as follows:


    ```

    05/May/2000:12:08:19 -0700

    ```


    # request


    The actual HTTP request that the client sent is enclosed in quotes.


    # status


    This field contains the three-digit HTTP status code returned to the client from
    Apache. The most common codes are 200, 202, 301, 302, 400, 403, and 404.


    # bytes


    This is the number of bytes in the response sent back to the client, including
    the response headers.


    # Log File Formats


    The actual log file format can be changed. Most log analysis tools understand
    the default CLF format, but they may also support other formats. Apache allows
    customization of log files using the LogFormat CustomLog directives.


    To use the CLF format, type the following in the httpd.conf file:


    ```

    LogFormat "%h %l %u %t "%s %b" common

    CustomLog /var/apache/logs/access_log common

    ```


    The LogFormat defines a format and assigns it a name. In this case, it is named
    common. Then the CustomLog directive tells Apache that the /var/apache/logs/access_log
    file is in the common format.


    Another popular format is the combined log format, which includes the referring
    URL and the browser type in each request.'
