  md: '# Installation and Configuration


    After installing any new product, it is a good idea to stay informed about improvements
    to the product and about any issues that arise. The Apache organization publishes
    a mailing list for that purpose. Send a message (subject and content will be ignored)
    to announce-subscribe @apache.org. You will receive a confirmation message with
    instructions on how to validate your subscription. This mailing list is one-way,
    for announcements only, and messages will be received directly from Apache. One
    aspect of extremely popular product is that many people are constantly working
    to find ways to attack it and a comparable number are working to defend against
    such attacks. The Apache organization has one of the best track records in the
    software industry for notifying users about problems and their solutions.


    # Configuring Apache Logs


    Apache logs are in the Common Log Format (CLF) by default. The Apache tracks in
    the CLF are host, ident, autouser, date, request, status, and byte.


    host


    This is the IP address from which the request comes.


    # Identity Check


    Apache can query the client''s identd (see RFC 1413) on the incoming http connection.
    To turn on this feature, edit the http.conf file and add:


    ```

    IdentityCheck On

    ```


    > NOTE identd checks can be extremely slow, so this feature should not be used
    on a busy Web server. identd checks can also be faked, so the information should
    not be completely trusted.


    # autouser


    If the requested document requires authentication, the authenticated user id is
    placed in this field.


    # date


    This field contains the date and time that the request was initiated. The proper
    format is: 05/May/2000:12:08:19 -0700.'
