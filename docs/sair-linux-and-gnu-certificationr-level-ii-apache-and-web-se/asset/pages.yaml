    in room is available, the excess data can be executed as code. If writing scripts
    in C, ensure they are free from buffer overruns by checking the amount of data
    comes into the program. Although this is relatively difficult to exploit, it is
    worth noting.


    # The Apache Proxy Server


    There is much confusion over the role of a proxy on a network. Proxies are often
