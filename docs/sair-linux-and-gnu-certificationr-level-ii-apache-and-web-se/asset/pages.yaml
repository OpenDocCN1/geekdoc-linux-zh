    # What Is CGI?


    According to the World Wide Web Consortium, the Common Gateway Interface (CGI)
    is a “standard for external gateway programs to interface with information servers
    such as HTTP servers.” In practice, this means CGI is a method of allowing the
    execution of programs on Web servers and then passing data back to the Web client
    to viewed.


