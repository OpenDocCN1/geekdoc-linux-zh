  md: '# Chapter 4


    time to time, an intruder will be successful and perhaps even gain privi-ged access.
    In a worst-case scenario, finding an intruder on a system might require dropping
    network interfaces, rebooting the server, or even doing a major restore of system
    files.


    # Handling an Attack That Is in Progress


    If you happen to catch an attack while it is in progress, the best thing to do
    is to remove the system from the network until you can resolve the weak-ness.
    You might unplug the Ethernet or hang up the mode; this''t always an option if
    the system absolutely needs to be available to other users during the time of
    the attack. If you cannot bring down the network, you can disable the service
    from which the attack is originating by commenting out in inetd.conf, followed
    by a kill -HUP pid. If that service is the one that must stay up, try to block
    a range of the attacker''s IP in TCP wrappers. Regardless of how it is done, you
    must modify your situ-ation quickly to minimize damage.


    # Notify Service Provider or Local Authorities


    If you were able to get the IP address of the attacker (this is not difficult
    in most situations), you may be able to use the whos utility to find out who owns
    the domain block from which the attack originated. If the owner is not the attacker,
    you will most likely receive some assistance.


    # Restore the System


    Recovery from attack will be much easier if you are using tools like trip-wire
    to point out files that have been compromised. Having good backups of critical
    system files (login, ls, bash, etc.) is important, as they are often used as back
    doors or Trojan horses by those who have gained privi-ged access. If at all possible,
    keep the system disconnected from the net-work until you can discover the cause
    of the security breach.


    # Block IP Addresses


    Once you have determined the domain from which the attack originated, it might
    be a good idea to block as much of it as possible. If the attacker has a dynamic
    IP address and you blocked only one IP address, the attacker could return another
    time with a slightly different address and regain access. Blocking as much of
    the attacker''s domain as possible will prevent this.


    # Counterattack?


    Never! Launching an attack is a very bad idea, not to mention illegal. Doing so
    could make it impossible to determine the origin of attack. There'
