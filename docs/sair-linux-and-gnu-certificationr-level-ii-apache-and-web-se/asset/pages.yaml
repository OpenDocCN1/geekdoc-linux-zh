  md: 'Buffer overflows problems have recently been exploited in such popular network
    daemons as qpopper, named, wu-ftpd, and many others. Candidates for the buffer
    overrun exploit can include older versions of ProtoFTPD and wu-ftp. Due to insufficient
    bounds checking in these programs, it is possible to revert an FTP server by corrupting
    its internal stack space. By supplying carefully designed commands to the FTP
    server, intruders could force the server to execute arbitrary commands using root
    privilege. Thus, intruders who are able to exploit this vulnerability can ultimately
    gain interactive access with the remote FTP server. The most vulnerable systems
    were the ones with the ftpd software installed and enabled by default.


    One temporary solution to this attack is to disable any world-writable directories
    to which the user may have access by making them read-only. This action will prevent
    an attacker from building an unusually large path, which is required to execute
    these particular attacks. The other preferred solution is to upgrade the programs
    with patches that address the potential buffer overflows.


    Of more interest, CERT reported a buffer overrun in 1998 in <cfg_getline()> that
    possibly allowed malicious users to gain access, not as root, but as the User
    of Apache. This is all the more reason to run Apache as any non-privileged user,
    other than nobody.


    Those using pre-1.5 versions of Apache are susceptible to this buffer overflow
    in <cfg_getline()>. <cfg_getline()> is a function that the Apache core and several
    Apache modules use to read certain types of files from disk. Some examples of
    the type of files that read with this are htpasswd, httppasswd, and mod_imap files.


    It is possible to create a sequence of data that this buffer overrun occurs while
