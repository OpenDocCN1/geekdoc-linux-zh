  md: '# 134 Chapter 4


    policies, and a general introduction to steps that can, when implemented,

    keep Apache server safe from being hacked.


    # Security Concerns


    You should be very sensible when using cryptography software because

    simply running a Secure Socket Layer (SSL) server does not guarantee that

    your system is secure!


    SSL itself may not be secure. Some think it is, but do you? Here are some

    situations to consider:


    +   - Have the authors of the various components in back doors?

    - Does the code take appropriate measures to keep private keys private?

    - To what extent is your cooperation in this process required?

    - Is your system physically secured?

    - Is your system appropriately secured from intrusion over the network?

    - Whom do you trust?

    - Do you understand the trust relationship involved in SSL certificates?

    - Do your system administrators?

    - Are your keys generated carefully enough to avoid reverse engineering-

    of the private keys?

    - How do you obtain certificates, keys, and the like securely?

    - Can you trust your users to safeguard their private keys?

    - Can you trust your browser to safeguard its generated private keys?


    If you cannot answer these questions to your personal satisfaction, then

    you usually have a problem. Even if you can, you may still not be secure.

    Do not blame the authors if the security fails. SSL should be used at your

    own risk.


    # Security Policies


    System attacks are possible on any network system. Absolute security is

    imimpossible, so policies specific to handling these issues as they happen

    must be in place. A security breach within a large company could affect

    thousands of users. How quickly the potential chaos can be resolved

    depends greatly on the preparation and coordination of analysts, man-\agers, and
    others. Aspects of the policy should also have preventive mea-'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'sures, such as company-wide standards regarding secure configurations

    and timely methods of conveying security-related information.


    # hosts.allow and hosts.deny


    One measure you take to lock down a system from remote intruders is con-

    trolling TCP wrappers. Two files determine who can utilize the services

    that are under control of TCP wrappers: ` /etc/hosts.allow and

    /etc/hosts.deny. Using two lists gives flexibility in how to structure

    security. For tight security or for a system that does not need to offer many

    services to outsiders, a user can deny access to all clients and then follow

    through with the hosts.allow file to permit only a narrow range of

    clients to get through. An open configuration can allow all clients and then

    limit certain clients from accessing services. A user has the option of using

    both methods. Connections that have not been specifically denied are

    accepted by default.


