- img_proc: true
  md: 'algorithms. Choices are negotiated between client and server at the establishment
    of a protocol session.


    The SSL protocol is a low-level authentication and encryption method used to secure
    transactions in higher-level protocols, such as HTTP and FTP. It was developed
    by Netscape, but support is provided by most browsers and Web servers. The current
    SSL protocol version is 3.0, but the IETF Transport Layer Security (TLS) specification
    Version 1.0 actually supersedes it. (SSL and TLS) are generally discussed together,
    as TLS is mainly a refined version of SSL.


    SSL includes provisions for server authentication (verifying the server''s identity
    to the client), encryption of data in transit, and optional client authentication
    (verifying the client''s identity to the server). By employing SSL-enabled servers
    and clients, it is possible to send encrypted data, such as passwords and credit
    card numbers, across the Internet without fear of interception.


    Clients requesting documents stored in SSL-enabled directories must use the https://
    URL format instead of the standard http format. One reason for this is that SSL-enabled
    Web services are generally offered on a different port than non-secured transmissions,
    normally port 443.


    # Implementing SSL in Apache


    There are two ways to add SSL to Apache. The first method is to replace Apache
    with Apache-SSL. This is a version of SSL security included. (Actually, it is
    distributed as a patch to the Apache source code.) It is available at the apache-ssl.org
    site. The other way is to add the mod_ssl module to a standard version of Apache.
    (In most circumstances, Apache must be recompiled to make mod_ssl work.) More
    information on mod_ssl can be found at www.modssl.org/. We will focus on Apache-SSL
    for the rest of this course.


    # Legal Issues


    SSL data transport requires encryption, and many governments have restrictions
    on the import, export, and use of encryption technology. Also, a few of the encryption
    algorithms are patented in some countries. With SSL included in a software package,
    its distribution involves a number of legal issues. This is why SSL is distributed
    separately from the standard Apache distribution.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Until recently, the United States prohibited the export of strong encryption,
    normally defined as anything beyond 40 bits. This ban has recently been eased,
    but the full implications of the new law have not been entirely analyzed. Within
    the United States, SSL can be used for any purpose due to the expiration of the
    patent held by RSA Data Security on the RSAREF code. This patent never applied
    generally outside the United States, so now you should be able to use the code
    for any purpose.


    Even though your Apache server should be well established by now, it will require
    constant maintenance. The next chapter will discuss some simple solutions to common
    problems that may arise.'
