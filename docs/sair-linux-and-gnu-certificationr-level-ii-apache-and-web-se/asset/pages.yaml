  md: '# Allow and Deny


    The Allow and Deny directives can slow things down, depending on how they are
    used. If the target location is an IP address, there is not a problem. If the
    target is a domain name, it will take some time to resolve the domain name into
    an IP address. Apache incorporates spoofing protection with these directives,
    a reverse look-up also occurs. Use IP addresses with these directives to avoid
    the lock-up penalty. Deny access starting at the system root directory, and allow
    selectively where needed. This way access permissions will not have to be checked
    with each request.


    # MaxClients


    This directive controls how many visitors Apache will handle at once. If the number
    of requests exceeds this value, clients will be locked out. This is a safety feature
    to keep Apache from taking the entire machine along as it absorbs all available
    system resources. Check to see if swapping is taking place when MaxClients is
    reached, and adjust the value accordingly. If there is no swapping at this point,
    the value can be increased. Decreasing it can reduce swapping. Adding RAM can
    also reduce swapping and increasing MaxClients, resulting in more simultaneous
    connections.


    The upper limit of 256 is hard-coded at compile time. Increasing beyond the current
    limit will require a recompile, after putting the desired value in the HARD_SERVER_LIMIT
    variable that is defined in httd.h.


    # TCP/IP Version


    Be sure to have the latest version of the system kernel. The serving of HTTP invalidates
    many assumptions built into Unix kernels from recently as 1994 or 1995.


    # Host Name Look-Ups


    Before Apache 1.3, host look-ups defaulted to On. This required a completed DNS
    look-up before Apache could finish a request. With Apache 1.3, the feature is
    defaulted to Off. Now, when the allow from domain or deny from domain features
    are used, a double DNS look-up will be performed (a reverse followed by a forward
    to ensure that the reverse is not being spoofed). If an IP address is used instead
    of a domain name, this penalty will not occur.'
  merge: -1
