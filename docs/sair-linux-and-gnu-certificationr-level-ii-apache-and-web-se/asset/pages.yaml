    # What to Do If Attacked


    The following list includes some steps you should take if your system comes under
    attack:


    +   - Gather as much information as possible.


    +   - Determine what part of the system was vulnerable.


    +   - Make appropriate changes.


    If your network has been attacked, you need to gather as much information as possible.
    Start with the system logs to try to determine how and when the attackers entered.
    Some attackers attempt to remove evidence of their entry from the system logs,
    so be observant for the disappearance of information as well. Careful examination
    of the logs will provide you with the attacker''s method of entry (which security
    loophole the attacker came through). Once you know the vulnerability, you can
    check the different resources (Bugtrap, CERT, or distribution sites) to see if
    a patch has been made available for this loophole, and if so, apply it to your
    system. If you cannot find a patch, you can certainly disseminate the existence
    of a security loophole, and a patch will usually come out in a short time.


    Fortunately, most log entries that relate to security issues on an up-to-date
    system represent failures on the part of the attacker. The Linux community responds
    quickly to system weaknesses and provides regular updates that render many intrusion
    tools useless. Addressing failed attempts usually involves blocking the offending
    IP and contacting the service provider that owns the address. It would also be
