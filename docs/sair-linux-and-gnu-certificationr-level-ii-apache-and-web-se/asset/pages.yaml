    # Introduction to Logging


    Apache has a logging mechanism that allows tracking of what goes right and goes
    wrong in Apache''s interactions with Web clients. A different log or set of logs
    can be set for every virtual domain on a system. Each log can be configured to
    track different aspects of client interaction.


    Log formats can be custom configured and named for reuse. Having a set of named
    log formats allows different virtual servers or configurations based on the same
    build to have different log files.


    The following are examples of some custom logs and their names:


    ```

    HostnameLookups On

    ErrorLog /var/apache/logs/error_log

    ```'
