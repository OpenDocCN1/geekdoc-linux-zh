  md: 'The inetd option is another ServerType option, but it is not commonly used
    anymore. The Apache documentation notes that the inetd option does not always
    work properly, but it remains as an option. Using inetd will cause a decrease
    in performance because the httpd server will launch when the user receives a request
    on port 80 (or whatever port is set in inetd.conf) and then shut down after it
