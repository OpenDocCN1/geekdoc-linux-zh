  md: '# Installation


    # Purpose


    In this exercise, you will learn how to install and update Web server modules,
    features, and configurations so that they can meet your needs.


    This exercise will be centered around four packages that you will install: the
    apache-1.x.x.i386.rpm, php-4.0.x.i386.rpm, mod_php-4.x.x.i386.rpm, and mod_perl-1.x.i386.rpm
    files. The installation of these modules will give you moderate Web server functionality.


    After these are installed, you will also need to complete any site-specific configurations
    to the Web server that are required. The files used in part of the exercise will
    commonly be contained in the apache/conf directory, with most of the work centering
    on the httpd.conf directory.


    # Theory


    For this exercise, we are using the .rpm files for the installation/update. The
    .rpm files are commonly used among many different distributions, not just Red
    Hat; however, a few distributions, including Debian, Slackware,'
  merge: -1
