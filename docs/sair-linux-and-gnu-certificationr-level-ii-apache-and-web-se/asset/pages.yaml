    # Virtual Hosting


    When hosting multiple Web sites, users have the option to run a single stand-alone
    daemon that will handle all of the hosted sites as virtual sites or to have a
    separate daemon for each site. A combination of these methods will work well (multiple
    stand-alone daemons with multiple virtual servers on each one). The single daemon
    method consumes fewer resources because there is only one master process running.


    When a separate daemon is used for each hosted site, each will consume a share
    of system resources, but maintenance will be easier. Moving one of the daemons
    to a different machine involves only copying it, shutting down on the first machine,
    then bringing up the copy on the new machine.


    Running multiple daemons allows each one to run under a separate (restricted)
    user ID, simplifying security management. This eliminates the need for suExec
    and secures scripts that cannot use suExec, such as scripts running under mod_perl
    and mod_php.


    Running multiple daemons on a machine requires additional resources. Multiple
    daemons, such as HTTPD, would require more memory, CPU time, and additional IP
    addresses for each daemon. If the machine does not have the resources to support
    such demands, consider some of the other virtual hosting options.


    # Configuring Separate Daemons


    To separate instances of Apache on the same server, a different IP address is
    required for each server. Then tell Apache which IP addresses to listen with the
    Listen directive. The following is the syntax for Listen:


    ```

    Listen <IP Address>:port

    ```


    The Listen directive tells Apache which IP addresses and port number to listen
    to for HTTP requests. Each instance of the server should listen to a different
    IP address:


    ```

    # Listen 123.456.789.10:11

    ```'
