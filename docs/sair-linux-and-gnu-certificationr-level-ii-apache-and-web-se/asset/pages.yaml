  md: 'The mod_access and mod_auth modules provide the authentication functions of
    Apache. The way Apache authentication works is really quite simple. First, the
    client sends a name with a password to Apache. Apache decides whether the host
    is allowed access to the resource. If so, Apache checks to see if the client has
    access by verifying the name and password. For instance, to prevent access to
    a /programs/ names.html file from anyone that is outside hello.com, simply type
    the following in httpd.conf.


    ```

    <Location /programs/names.html>

    Order deny, allow

    Deny from all

    Allow from .hello.com

    </Location>

    ```


    In recent versions of Apache, the file names are relative to the server root,
    or the file name is considered absolute. If the file name begins with /, it is
    said to be absolute.


    # Modules


    The ability to add modules to Apache is key to its flexibility. Some modules are
    part of the basic functionality of the standard installation. About another 50
    modules are included with the distribution that allow further customization. Some
    of these extra modules are enabled by default so the server has more than the
    minimum functionality when first installed.


    If one of the included modules does not meet a particular need, many authors have
    written additional modules that can be downloaded from the Internet. An organized
    listing of modules can be found at Apache’s site:

    www.apache.org/

    www.apache.org/dist/contrib/modules/

    http://modules.apache.org/search


    If using a module from the Internet, read the module’s documentation carefully!
    Some require Apache to be configured in a way that is specific and unique to that
    module.


    # Configuration Methods


    When Apache is installed, configuration files are placed into the /configuration
    directory, whose location is defined at compile time.'
