    # Packet Filtering


    By running a firewall as a packet filtering router, the firewall examines each
    packet of data (a datagram) against a set of predefined rules. The filtering rules
    are based on packet header information, which is available to the IP forwarding
    process of the kernel. In the IP packet header, you will find the following information:'
  merge: -1
