- img_proc: true
  md: '# 190 Chapter 5


    cronolog (www.ford-mason.co.uk/resources/cronolog). A log file rotation program
    for the Apache Web server.

    ApacheWeek (www.apacheweek.com). A free online magazine with tips.

    O’Reilly Network Apache Forum (www.oreillynet.com/cgi-bin/conf/summary?group=oreillynet.apache).
    A discussion forum for Apache users.

    nDevshed Forums (www.devshed.com). A discussion forum that covers a multitude
    of Apache problems and solutions.


    # Configuration Issues


    Problems in configuration may cause Apache not to start at all, or they may cause
    requests to fail or to be served other than the intended way.


    Permissions problems occur because of several security principles involved in
    administering a Web server:


    +   **Root.** The system user allowed to bind low-numbered ports and access all
    files.

    **http or nobody.** Who the Web “runs as.\n**Webmaster.** An administrator or
    other users who are able to start and stop the Web server.

    **remote user.** Those who are able to read.

    **author user.** Those who create content but do not administer the Web server.


    # Logging Problems


    With multiple servers running on a single instance of the Web server daemon and
    separate log files for each server, the user may become aware of the consumption
    of file descriptors (also called file handles). If the error logs start reporting
    such errors as unable to fork or access logs are not being written, this has happened.
    Basically, the problem is that Apache uses a file descriptor for each distinct
    log file and 10 or 20 for internal use. Some systems have a limit of 64 file descriptors
    for a process, which may usually be'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'increased up to a much larger number. Apache will attempt to increase the limit
    as needed but may have problems under certain circumstances:


    +   - If the system does not support the setlimit() call (or if it does not work,
    as on Solaris 2.3)

    - If the number of descriptors exceeds the absolute limit


    If one of the first two conditions applies, starting Apache with a script similar
    to this can help:


    ```

    ```

    !/bin/sh

    ulimit -S n 100

    exec httpd

    ```

    ```


    An alternate solution is to send all logs to the same file and filter them out
    later for distribution to each client. A description of real-time logging using
    piped logs is at www.apache.org/docs/new_features_1_3.html.


    This issue and other problems are addressed in detail at the Apache Web site,
    www.apache.org.'
  merge: -1
