    # # Anonymous Access


    Anonymous access uses the anon_auth_module to allow anonymous

    users to sign in with a default username and a valid e-mail address in order

    to access information. Apache checks the e-mail address validity by looking-

    for the "@" and the \.". symbols. The anonymous access method is

    good for tracking users because it does not rely on cookies, but rather logs

    the e-mail address entered by the user as the client moves around a site.


    When anonymous access is selected, it is necessary to select the valid

    User IDs using the Anonymous directive. For example:


    ```

