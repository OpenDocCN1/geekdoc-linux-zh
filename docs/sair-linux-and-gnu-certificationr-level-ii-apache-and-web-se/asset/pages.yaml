  md: 'For example, to verify a package containing a particular file:


    ```

    rpm -Vf /bin/vi

    ```


    To verify all installed packages:


    ```

    rpm -Va

    ```


    To verify an installed package against an RPM package file:


    ```

    rpm -Vp foo-1.0-1386.rpm

    ```


    This verification can be useful if the user suspects that the RPM databases are
    corrupt.


    If everything is verified properly, there will be no output. Any discrepancies
    will be displayed. The format of the output is a string of eight characters, a
    possible c denoting a configuration file, and then the file name. Each of the
    eight characters denotes the result of a comparison of one attribute of the file
    to that attribute recorded in the RPM database.


    # Test Results


    A single period (.) means the test passed. The following characters denote failure
    of certain tests:


    +   - S MD5 checksum.

    - S File size.

    - L Symbolic link.

    - T File modification time.

    - D Device.

    - U User.

    - G Group.

    - M Mode (includes permissions and file type).


    # Verify the Update Prior to Use


    To ensure the integrity of the downloaded package, use this command:


    ```

    rpm --checksig package.rpm

    ```'
