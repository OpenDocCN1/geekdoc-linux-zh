    # ServerType stand-alone


    The stand-alone option is the default method and typically the only one that is
    used anymore. In stand-alone mode, servers are ready and waiting for connections.
    Not will the user probably want to run the server this way, but it is also recommended
    for busy sites. From here, the number of servers that Apache starts and keeps
    running can be configured. This number will allow fine-tuning of configurations
    to meet specific requirements.'
