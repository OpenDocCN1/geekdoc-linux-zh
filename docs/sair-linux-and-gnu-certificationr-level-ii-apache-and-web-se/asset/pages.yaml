    # Keeping Logs of All Transactions


    Every transaction that occurs on the MySQL server can be logged at a later time.
    When starting the MySQL server daemon, specify the --log and --log-update parameters
    to tell the server to save a log. The --log option for general logging; the --log-update
    option enables logging of changes on the database.


    ```

    mysql --log-update

    ```


    As transactions are sent to the server, the log files fill up, eventually to the
    point where they take all available space on the file system. With a busy server,
    this could happen quickly; with a less busy server, it will take more time. All
    the same, if the old transactions are not purged, the file system will eventually
    fill up.


    One way to deal with the situation is to write a script that rotates the log files.
    Each time the MySQL server restarts, it creates a fresh log file. If a script
    (invoked by cron) is created that restarts the MySQL server, then deletes the
    oldest log file (or any log file over a certain age), the file system will fill
    up much more slowly.


    Log files by using the mysqladmin command with the flush-logs parameter:


    ```

    mysqladmin flush-logs -p

    ```'
