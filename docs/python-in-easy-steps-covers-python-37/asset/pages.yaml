  md: '# Doing arithmetic


    The arithmetical operators commonly used in Python programming are listed in the
    table below, together with the operation they perform:


    | Operator | Operation |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Division |

    | / | Modulo |

    | // | Floor division |

    | ** | Exponent |


    The operators for addition, subtraction, multiplication, and division act as you
    would expect. Care must be taken, however, to group expressions where more than
    one operator is used to clarify the expression – operations within innermost parentheses
    are performed first. For example, with this expression:


    ```

    a = b * c - d % e / f

    ```


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_36_0.png)


    Values used with operators to form expressions are called “operands” – in the
    expression 2 + 3 the numerical values 2 and 3 are the operands.


    The desired order in which the operations should be performed is unclear but can
    be clarified by adding parentheses, like this:


    ```

    a = (b * c) - ((d % e)/f)

    ```'
