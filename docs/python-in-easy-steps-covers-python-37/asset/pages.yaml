  md: '# Choosing radio buttons


    An HTML form can provide a "radio button" group from which the user can select
    just one button to submit its associated data to the web server. Unlike checkboxes,
    radio buttons that share a common name are mutually exclusive, so when one button
    in the group is selected, all other buttons in that group are switched off. The
    Python script nominated to handle the form data can test the value submitted for
    the radio button group name and supply an appropriate response.


