  md: '# Uploading files


    An HTML form can provide a file selection facility, which calls upon the operating
    system’s “Choose File” dialog, to allow the user to browse their local file system
    and select a file. To enable this facility the HTML <form> tag must include an
    `ctype` attribute specifying the encoding type as “multipart/form-data”.


    The full path of the selected file for upload is a value stored in the FieldStorage
    object list that can be accessed using its associated key name. Usefully, `path.basename()`
    can be stripped from the path by the “os” module’s method.


    A copy of an uploaded file can be written on the web server by reading from the
    FieldStorage object’s `file` property.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_227_0.png)


    +   Create a new HTML document containing a form with a file selection facility
    and a submit button

    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>File Upload Example</title>

    </head>

    <body>

    <form method="POST" action="upload.py" enctype="multipart/form-data">

    <input type="file" name="filename" style="width:400px">

    <input type="submit" value="Submit">

    </form>

    </body>

    </html>

    ``````


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_227_1.png)'
