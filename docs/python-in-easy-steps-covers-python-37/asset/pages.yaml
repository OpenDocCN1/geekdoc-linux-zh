  md: '# Displaying messages


    A program can display messages to the user by calling methods provided in the
    “tkinter.messagebox” module. This must be imported separately and its lengthy
    name can, usefully, be assigned a short alias by an import as statement.


    A message box is created by supplying a box title and the message to be displayed
    as the two arguments to one of these methods:


    | Method | Icon | Buttons |

    | --- | --- | --- |

    | showinfo() | | OK |

    | showwarning() | | OK |

    | showererror() | | OK |

    | askquestion() | | Yes (returns the string ''yes'') and No (returns the string
    ''no'') |

    | askokcancel() | | OK (returns 1) and Cancel |

    | askyesno() | | Yes (returns 1) and No |

    | askretrycancel() | | Retry (returns 1) and Cancel |


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_240_0.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: "Only the askquestion() method returns two values – the askyes() No button and\
    \ both Cancel buttons return nothing.\n\nThose methods that produce a message\
    \ box containing a single OK button return no value when the button gets clicked\
    \ by the user. Those that return a value can be used to perform conditional branching\
    \ by testing that value.\n\n+   - Start a new Python program by making GUI features\
    \ available and messagebox features available as a short alias\nimport tkinter.messagebox\
    \ as box\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_241_0.png)\n\n+   - Next,\
    \ create a window object and specify a title\nwindow = Tk()\nwindow.title('Message\
    \ Box Example')\n\n+   - Add a function to display various message boxes\ndef\
    \ dialog():\n    var = askyesno('Message Box', 'Proceed?')\n    if var == 1:\n\
    \        box.showinfo('Yes Box', 'Proceed...')\n    else:\n        box.showwarning('No\
    \ Box', 'Canceling...')\n\n+   - Then, create a button to call the function when\
    \ used\nbtn = Button(window, text='Click', command=dialog)\n\n+   - Add the button\
    \ to the window with positional beginning\nbtn.pack(padx = 150, pady = 50)\n\n\
    +   - Finally, add the loop to capture this window’s event\nwindow.mainloop()\n\
    \n+   - Save the file in your scripts directory, then open a Command Prompt window\
    \ there and run this program with the command python tk_message.py – click the\
    \ button to see the message boxes appear"
