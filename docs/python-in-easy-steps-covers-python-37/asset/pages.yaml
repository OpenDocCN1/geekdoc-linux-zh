  md: "# Owning function names\n\nInternally, each Python module and program has its\
    \ own “symbol table” that is used by all functions defined in that context only.\
    \ This avoids possible conflicts with functions of the same name in another module\
    \ if both modules were imported into one program.\n\nWhen you import a module\
    \ with an import statement, that module’s symbol table does not get added to the\
    \ program’s symbol table – only the module’s names get added. That is why you\
    \ need to call the module’s functions using their module prefix. Importing a “steps”\
    \ function from a module named “ineasy” and another “steps” from a module named\
    \ “dance” means they can be called without conflict in ineasy.step() and dance.step().\n\
    \nGenerally, it is preferable to avoid conflicts by importing the module name\
    \ and calling its functions with the module name prefix, but you can import individual\
    \ function names instead of the import statement. The module name is specified\
    \ after the from keyword, and functions to import are specified as a comma-separated\
    \ list after the import keyword. Alternatively, the * wildcard character can be\
    \ specified after import to import all functions into the program’s symbol table.\
    \ This means the functions can be called without a module name prefix.\n\n+  \
    \ Start a new Python module by defining a function that supplies a default string\
    \ value to its argument\n```python\ndef bark( pet = 'A Dog' )\n    print( pet\
    \ , 'Says WOOF!')\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_121_0.png)\n\
