  md: '# Assigning values


    The operators that are used in Python programming to assign values are listed
    in the table below. All except the simple = assignment operator are a shorthand
    of a longer expression, so each equivalent is given for clarity:


    | Operator: | Example: | Equivalent: |

    | --- | --- | --- |

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |

    | //= | a //= b | a = (a // b) |

    | **= | a **= b | a = (a ** b) |


    In the example above, the variable named “a” is assigned the value that is contained
    in the variable named “b” – so that becomes the new value stored in the a variable.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_39_0.png)


    > It is important to regard the = operator to mean “assign” rather than “equals”
    to avoid confusion with the == equality operator.'
