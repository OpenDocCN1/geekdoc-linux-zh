  md: '# Gathering entries


    An Entry widget provides a single-line input field in an application where the
    program can gather entries from the user. An entry object is created by specifying
    the name of its parent container, such as a window or frame name, and options
    as arguments to Entry() constructor. Each option is specified as an option=value
    pair. Popular options are listed below, together with a brief description:


    | Option | Description |

    |---|---|

    | bd | Border width in pixels (default is 2) |

    | bg | Background color |

    | fg | Foreground color used to render the text |

    | font | Font for the text |

    | highlightcolor | Border color when focus |

    | selectbackground | Background color of selected text |

    | selectforeground | Foreground color of selected text |

    | show | Hide password characters with show=''*'' |

    | state | Enabled status of NORMAL or DISABLED |

    | width | Entry width in letters |


    Multiple widgets can be grouped in frames for better positioning. A frame object
    is created by specifying the name of the window to a Frame() constructor. The
    frame''s name can then be specified as the first argument to the widget constructors
    to identify it as that widget''s container.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_244_0.png)


    Use the Text widget instead of an Entry widget if you want to allow the user to'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'enter multiple lines of text.


    When actually adding widgets to the frame you can specify which side to pack them
    in the frame with TOP, BOTTOM, LEFT, or RIGHT constants. For example, entry.pack(side=LEFT).


    Typically, an entry widget will appear alongside a label describing the type of
    input expected from the user, or alongside a button widget that the user can click
    to perform some action on the data they have entered, or positioning in a frame
    is ideal.


    Data currently entered into an entry widget can be retrieved by the program using
    that widget''s get() method.


