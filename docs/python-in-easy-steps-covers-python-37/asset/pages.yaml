    | is, not Identity |

    | in, not in Membership |

    | not Boolean NOT |

    | and Boolean AND |

    | or Boolean OR |


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_52_0.png)


    The bitwise, identity, and membership operators are introduced later in this book
