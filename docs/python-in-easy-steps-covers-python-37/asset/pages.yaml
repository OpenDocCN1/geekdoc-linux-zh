  md: "# Handling exceptions\n\nSections of a Python script in which it is possible\
    \ to anticipate errors, such as those handling user input, can be enclosed in\
    \ a try except block to handle “exception errors”. The statements to be executed\
    \ are grouped in a try : block, and exceptions are passed to the ensuing except\
    \ : block for handling. Optionally, this may be followed by a finally : block\
    \ containing statements to be executed after exceptions have been handled.\n\n\
    Python recognizes many built-in exceptions such as the NameError, which occurs\
    \ when a variable name is not found, the IndexError, which occurs when trying\
    \ to address a non-existent list index, and the ValueError, which occurs when\
    \ a built-in operation or function receives an argument that has an inappropriate\
    \ value.\n\nEach exception returns a descriptive message that can, usefully, assigned\
    \ to a variable with the as keyword. This can then be used to display the nature\
    \ of the exception when it occurs.\n\n+   Start a New Python script by initializing\
    \ a variable with a string value title = ‘Python In Easy Steps’\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_109_0.png)\n\
