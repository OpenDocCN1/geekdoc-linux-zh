  md: 'interpreter for customization.


    +   - **Python is versatile** – supports both procedure-oriented programming and
    object-oriented programming (OOP).


    +   - **Python is flexible** – can create console programs, windowed GUI (Graphical
    User Interface) applications, and CGI (Common Gateway Interface) scripts to process
    web data.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_11_0.png)


    Python is named after the British television comedy series “Monty Python’s Flying
