- img_proc: true
  md: "# Freezing the program\n\nApplications developed in the Python language can\
    \ be frozen for Windows, Linux, and Mac systems using the PyInstaller tool, introduced\
    \ here to create a single standalone executable file. Apps that require the inclusion\
    \ of additional files, such as image files, require the script file to be modified\
    \ so the PyInstaller tool can readily locate them at their absolute address:\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_0.png)\n\n+   Open the lot.py program\
    \ file and add this utility function definition at the very start of the script\n\
    ```python\ndef resource_path(relative_path):\n    absolute_path = os.path.abspath(__file__)\n\
    \    root_path = os.path.dirname(absolute_path)\n    base_path = getattr(sys,\
    \ 'MEIPASS', root_path)\n    return os.path.join(base_path, relative_path)\n```\n\
    \n+   Modify the assignment to the img variable – to identify the file's location\
    \ using the added utility function\n`img = PhotoImage(file = resource_path('logo.gif'))`\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_1.png)\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_2.png)"
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Save the modified file as “lucky.py” in your MyScripts folder, then open

    a Command Prompt in that folder


    Begin a command with pyinstaller --onefile --nconsole to instruct PyInstaller

    create a single file, and to prevent the program also opening a console

    window


    Continue the command with --add-binary logo.gif;, to include the image file

    in the single executable


    Complete the command with the lucky.py script name – so the command

    now looks like that on the opposite page


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_289_0.png)


    The file attribute is preceded by TWO _ underscore characters and followed by

    TWO _ underscore characters.


    ```

    C:\MyScripts>pyinstaller --onefile --nconsole --add-binary logo.gif;. lucky.py

    ```


    When you are satisfied that the command is correct, hit Enter to create

    the standalone executable (.exe) file


    PyInstaller creates two folders named “build” and “dist” within your

    MyScripts folder. The standalone executable file can be found in the

    “dist” folder


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_289_1.png)'
  merge: -1
  pgno: 289
