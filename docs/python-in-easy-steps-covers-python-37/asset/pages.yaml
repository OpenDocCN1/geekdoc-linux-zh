  md: '# Assessing logic


    The logical operators most commonly used in Python programming are listed in the
    table below:


    | Operator | Operation |

    | --- | --- |

    | and | Logical AND |

    | or | Logical OR |

    | not | Logical NOT |


    The logical operators are used with operands that have Boolean values of True
    or False, or values that convert to True or False.


    The (logical AND) and operator will evaluate two operands and return True only
    if both operands are True. Otherwise the operator will return False. This is used
    in conditional branching where the direction of a program is determined by testing
    two conditions – if both conditions are satisfied, the program will go in a certain
    direction, otherwise it will take a different direction.


    Unlike the and operator that needs both operands to be True, the (logical OR)
    operator will evaluate its two operands and return True if either one of the operands
    itself returns True. If neither operand returns True, then the operator will return
    False. This is useful in Python programming to perform a certain action if either
    of two test conditions has been met.


    The (logical NOT) not operator is a unary operator that is used before a single
    operand. It returns the inverse value of the given operand, so if the variable
    had a value of True then not would have a value of False. The not operator is
    useful in Python programs to toggle the value of a variable in successive loop
    iterations with a statement like a = not a. This ensures that on each iteration
    of the loop, the Boolean value is reversed, flicking a light switch on and off.'
