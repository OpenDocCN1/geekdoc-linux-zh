  md: '# Sending responses


    Whenever a user asks to view an online web page in their browser requests the
    page from the web server, and receives the page in response, via the HTTP protocol.


    Where a requested web page address is an HTML document (typically with an .html
    file extension), the web server response will return that file to the browser
    so its contents can be displayed.


    Where Python is installed on the computer hosting the web server, the web server
    can be configured to recognize Python scripts (typically with a .py file extension)
    and call upon the Python interpreter to process script code before sending an
    HTML response to the web server, for return to the browser client.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_206_0.png)


    A Python script requested by a web browser can generate a complete HTML document
    response by describing the content type on the first line as Content-type:text/html\r\n\r\n
    so the web browser will parse the markup content for display on the screen.'
