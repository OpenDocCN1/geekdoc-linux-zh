  md: '# # Installing Python on Linux


    Linux distributions will, typically, include Python but generally have the 2.7
    version as their default. For development on the 3.x branch of Python releases
    you will probably have to install the latest release alongside the default version.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_15_0.png)


    Consult your Linux distro’s documentation for further help on installing Python.


    +   - Launch a terminal window and precisely enter this command to reveal the
    installed default version python -v


    ```

    mike@ubuntu:~ ~

    mike@ubuntu:-$ python -V

    Python 2.7.3

    mike@ubuntu:-$

    ```


    +   - Next, precisely enter this command to reveal the default version of Python
    3.x branch, if any is installed python3 -v


    ```

    mike@ubuntu:~ ~

    mike@ubuntu:-$ python3 -V

    Python 3.2.3

    mike@ubuntu:-$

    ```


    +   - Now, launch your Linux system’s package manager to see if a later Python
    version is available for installation – for example use the Software Center on
    Ubuntu systems'
