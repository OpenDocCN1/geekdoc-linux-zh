  md: '# Looping while true


    A loop is a piece of code in a program that automatically repeats. One complete
    execution of all statements within a loop is called an “iteration” or a “pass”.
    The length of the loop is controlled by a conditional test made within the loop.
    While the tested expression is found to be True, the loop will continue – until
    the tested expression is found to be False, at which point the loop ends.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_77_0.png)


    In Python programming, the while keyword creates a loop. It is followed by the
    test expression then a : colon character. Statements to be executed when the test
    succeeds should follow below on separate lines, and each line must be indented
    the same space from the while test line. This statement block must include a statement
    that will at some point change the result of the test expression evaluation –
    otherwise an infinite loop is created.


    Indentation of code blocks must also be observed in Python’s interactive mode
    – like this example that produces a Fibonacci sequence of numbers from a while
    loop:'
