  md: '# Checking boxes


    A Checkbutton widget provides a single item in an application that the user may
    select. Where a number of check buttons appear together the user may select one
    or more items. Check button objects nominate an individual control variable object
    to assign a value to checked or unchecked. An empty string variable object can
    be created for this using the StringVar() constructor or an empty integer variable
    object using the IntVar() constructor.


