    \ can be specified in the function\ndefinition by including a comma-separated\
    \ list of argument names within the\nfunction parentheses:\n\n```\ndef echo(user,\
    \ lang, sys) :\n    print('User:', user, 'Language:', 'Platform:', sys)\n```\n\
    \nWhen calling a function whose definition specifies arguments, the call must\n\
    include the same number of data values as arguments. For example, to call this\n\
    example with multiple arguments:\n\n```\necho('Mike', 'Python', 'Windows')\n```\n\
