  md: '# # Restricting lists


    ## Tuple

    The values in a regular list can be changed as the program proceeds (they are
    “mutable”), but a list can be created with fixed “immutable” values that cannot
    be changed by the program.

    A restrictive immutable Python list is known as a “tuple” and is created by assigning
    values as a comma-separated list between parentheses in a process known as “tuple
    packing":


    ```

    colors-tuple = (''Red'', ''Green'', ''Red'', ''Blue'', ''Red'')

    ```


    An individual tuple element can be referenced using the tuple name followed by
    square brackets containing element''s index number. Usefully, all values stored
    inside a tuple can be assigned to individual variables in a process known as “sequence
    unpacking":


    ```

    a, b, c, d, e = colors-tuple

    ```


    ## Set

    The values in a regular list can be repeated in its elements, as in the tuple
    above, but a list of unique values can be created where duplication is not allowed.
    A restrictive Python list of unique values is known as a “set” and is created
    by assigning values as a comma-separated list between curly brackets (braces):


    ```

    phonetic-set = {''Alpha'', ''Bravo'', ''Charlie''}

    ```


    Individual elements cannot be referenced using the set name followed by square
    brackets containing an index number, but instead sets have methods that can be
    dot-suffixed to the set name for manipulation and comparison:


    | Set Method: | Description:

    | --- | --- |

    | set.add(x) | Adds item x to the set |

    | set.update(x,y,z) | Adds multiple items to the set |

    | set.copy() | Returns a copy of the set |

    | set.pop() | Removes one random item from the set |

    | set.discard( x ) | Removes item x if found in the set |'
