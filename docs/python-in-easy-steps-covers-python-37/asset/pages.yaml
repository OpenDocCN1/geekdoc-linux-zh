  md: '# Introducing Python


    Python is a high-level (human-readable) programming language that is processed
    by the Python “interpreter” to produce results. Python includes a comprehensive
    standard library of tested code modules that can be easily incorporated into your
    own programs.


    The Python language was developed by Guido van Rossum in the late eighties and
    early nineties at the National Research Institute for Mathematics and Computer
    Science in the Netherlands. Python is derived from many other languages, C, C++,
    the Unix shell and other programming languages. Today, Python is maintained by
    a core development team at the Institute, although Guido van Rossum still holds
    a vital role in directing its progress.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_9_0.png)


    Discover all the latest Python news online at www.python.org


    The basic philosophy of the Python language is readability, which makes it particularly
    well-suited for beginners in computer programming, and it can be summarized by
    these principles:


    +   - Beautiful is better than ugly.


    +   - Explicit is better than implicit.


    +   - Simple is better than complex.


    +   - Complex is better than complicated.


    +   - Readability counts.


    As Python is intended to be highly readable, it uses English keywords frequently
    where other languages may use punctuation. Most significantly, it uses'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'indentation to group together statements into code “blocks”, whereas other
    languages may use keywords or punctuation for this purpose. For example, in the
    Pascal programming language, blocks start with the keyword begin and end with
    the keyword end, and in the C programming language, blocks are enclosed within
    brackets ({}) braces. Grouping blocks of statements by indentation is sometimes
    criticized by programmers familiar with languages that group by punctuation, but
    the use of indentation in Python certainly produces code that has an uncluttered
    visual layout.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_10_0.png)


    Programming languages that group blocks by indentation are said to adhere to the
    “offside rule” – a pun on the offside rule in soccer.


    Some of Python’s key distinguishing features that make it an attractive choice
    of language for the beginner include:


    +   - **Python is free** – is open source distributable software.


    +   - **Python is easy to learn** – has a simple language syntax.


    +   - **Python is easy to read** – is uncluttered by punctuation.


    +   - **Python is easy to maintain** – is modular for simplicity.


    +   - **Python is “batteries included”** – provides a large standard library for
    easy integration into your own programs.


    +   - **Python is interactive** – has a terminal for debugging and testing snippets
    of code.


    +   - **Python is portable** – runs on a wide variety of hardware platforms and
    has the same interface on all platforms.


    +   - **Python is interpreted** – there is no compilation required.


    +   - **Python is high-level** – has automatic memory management.


    +   - **Python is extensible** – allows the addition of low-level modules to the'
  merge: -1
