  md: "# Storing functions\n\nPython function definitions can, useful, be stored in\
    \ one or more separate files for easier maintenance and to allow them to be used\
    \ in several programs without copying the definitions into each one. Each file\
    \ storing function definitions is called a “module” and the module name is the\
    \ file name without the “.py” extension.\n\nFunctions stored in the module are\
    \ made available to a program using the Python import keyword followed by the\
    \ module name. Although not essential, it is customary to put any import statements\
    \ at the beginning of the program.\n\nImported functions can be called using their\
    \ name dot-suffixed after the module name. For example, a “steps” function from\
    \ an imported module named “ineasy” can be called with ineasy.steps().\n\nWhere\
    \ functions stored in a module include arguments, it is often useful to assign\
    \ a default value to the argument in the definition. This makes the function more\
    \ versatile, as it becomes optional for the call to specify any argument value.\n\
    \n+   - Start a new Python module by defining a function that supplies a default\
    \ string value to its argument for display\n\n```\ndef purr( pet = 'A Cat' ):\n\
    \    print( pet , 'Says MEOW!' )\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_118_0.png)\n\
