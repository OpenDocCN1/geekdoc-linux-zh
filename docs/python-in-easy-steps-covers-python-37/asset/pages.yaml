  md: '# Converting strings


    Before Python 3.0, string characters were stored by their ASCII numeric code values
    in the range 0-127, representing only-accented Latin characters. For example,
    the lowercase letter ‘a’ is assigned 97 as its code value. Each byte of computer
    memory can, in fact, store values in the range 0-255 which is still too limited
    to represent all accented characters and non-Latin characters. For example, accented
    characters used in Western Europe and the Cyrillic alphabet used for Russian cannot
    be represented in the range 128-255 because there are more than 127 characters.
    Recent versions of Python overcome this limitation by storing strings as their
    Unicode code point to represent all characters and alphabets in the numeric range
    0-1,114,111. Characters that are above the ASCII range may require two bytes for
    their code point value, such as hexadecimal `0x03` for ‘ö’.


    The `str` object''s `encode()` method can be used to convert from the default
    Unicode encoding, and its `decode()` method can be used to convert back to the
    Unicode default encoding.


    Python’s `unicodedata` module, usefully, provides a `name()` method that reveals
    the Unicode name of each character. Accented and non-Latin characters can be referenced
    by their Unicode name or by decoding the Unicode code point value.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_158_0.png)


    The term “ASCII” is an acronym for American Standard Code for Information Interchange.


    +   - Start a new Python script by initializing a variable with a string containing
    a non-ASCII character then display its value, data type, and string length

    ```python

    s = ''ö''

    print(''\nRed String:'', s)

    ```'
