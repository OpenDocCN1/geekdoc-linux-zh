  md: '# Comparing values


    The operators that are commonly used in Python programming to compare two operand
    values are listed in the table:


    | Operator | Comparative test: |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The == equality operator compares two operands and will return True if both are
    equal in value, otherwise it will return a False value. If both are the same number
    they are equal, or if both are characters their ASCII code values are compared
    numerically to achieve the comparison result.


    Conversely, the != inequality operator returns True if two operands are not equal,
    using the same rules as the == operator, otherwise it returns False. Equality
    and inequality operators are useful in testing the state of two variables to perform
    conditional branching in a program according to the result.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_42_0.png)


    A-Z uppercase characters have ASCII code values 65-90 and a-z lowercase characters
    have ASCII code values 97-122.


    The > “greater than” operator compares two operands and will return True if the
    first is greater in value than the second, or it will return False if it is equal
    or less in value. The < “less than” operator makes the same comparison but returns
    True if the first operand is less in value than the second, otherwise it returns
    False. A >'
