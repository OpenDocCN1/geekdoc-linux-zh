  md: "# Submitting forms\n\nPassing data from a web page to a web server using the\
    \ GET method to append key=value pairs to a URL is simple, but has some limitations\
    \ – the request string length cannot exceed 1024 characters, and the values appear\
    \ in the browser address field.\n\nA more reliable alternative, the browser can\
    \ submit data to the script using a “POST” method that sends the information to\
    \ the web server as a separate message not appended to the URL.\n\nPython’s “cgi”\
    \ module can handle form data sent from the browser with the POST method in exactly\
    \ the same way as data passed from the GET method. This module’s FieldStorage()\
    \ constructor can create an object to store the posted data as a dictionary of\
    \ key:value pairs for each form field. Any individual value can be retrieved by\
    \ specifying its associated key name to the object’s getvalue() method.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_212_0.png)\n\
    \npost.html\n\n+   - Create a new HTML document containing a form with two text\
    \ fields containing default values and a submit button to post all form values\
    \ to a Python script\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    UTF-8\">\n<title>Python Form Values</title>\n</head>\n<body>\n<form method=\"\
    POST\" action=\"post.py\">\nMake: <input type=\"text\" name=\"name\" value=\"\
    Ford\"> Model: \n<input type=\"text\" name=\"model\" value=\"Mustang\">\n<p><input\
    \ type=\"submit\" value=\"Submit\\></p>\n</form>\n</body>"
