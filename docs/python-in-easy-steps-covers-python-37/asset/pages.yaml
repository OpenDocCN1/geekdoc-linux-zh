  md: "# # Collecting garbage\n\nWhen a class instance object is created it is allocated\
    \ a unique memory address that can be seen using the built-in id function. Python\
    \ automatically performs “garbage collection” to free up memory space by periodically\
    \ deleting unused objects such as class instances – so their memory address becomes\
    \ vacant.\n\nWhenever object gets assigned a new name or gets placed in a container,\
    \ such as a list, “reference count” increases. Conversely, whenever these are\
    \ removed or go out of scope its count decreases. The object becomes eligible\
    \ for collection when this count is zero.\n\nDestroying an instance of class may,\
    \ optionally, call upon a “destructor” to execute a __del__ method – explicitly\
    \ reclaiming occupied memory space and executing any specified statements.\n\n\
    +   - Start a new Python script by declaring a class with an initializer method\
    \ creating two instance variables and a method to display one of those variable\
    \ values\n\n```\nclass Songbird:\n    def __init__(self, name, song):\n      \
    \  self.name = name\n        self.song = song\n        print(self.name, 'Is Born..')\n\
    ```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_189_0.png)\n\n+   - Next, add\
    \ a method to simply display both variable values\n\n```\ndef sing(self):\n  \
    \  print(self.name, 'Sings:', self.song)\n```\n\n+   - Now, add a destructor method\
    \ for confirmation when instances of the class are destroyed – then save this\
    \ file\n\n```\ndef __del__(self):\n    print(self.name, 'Flew Away!\\n')\n```"
