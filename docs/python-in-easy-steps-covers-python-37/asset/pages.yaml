  md: "# Branching with if\n\nThe Python if keyword performs the basic conditional\
    \ test that evaluates a given expression for a Boolean value of True or False.\
    \ This allows a program to proceed in different directions according to the result\
    \ of the test, and is known as “conditional branching”.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_74_0.png)\n\
    \nThe tested expression must be followed by a colon, then statements to be executed\
    \ when the test succeeds should follow below on separate lines, and each line\
    \ must be indented from the if test line. The size of the indentation is not important,\
    \ but it must be the same for each line. The syntax looks like this:\n\n```\n\
    if test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
    \    statements-to-execute-when-test-expression-is-True\n```\n\nIdeally an if\
    \ test can offer alternative statements to execute when the test fails by appending\
    \ an else keyword after the statements to be executed when the test succeeds.\
    \ The else keyword must be followed by a : colon and aligned with the if keyword,\
    \ but its statements must be indented in a likewise manner, so its syntax looks\
    \ like this:\n\n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
    \    statements-to-execute-when-test-expression-is-True\nelse :\n    statements-to-execute-when-test-expression-is-False\n\
    \    statements-to-execute-when-test-expression-is-False\n```\n\nAn if test can\
    \ be blocked by an alternative test using the elif keyword (“else if ”) offers\
    \ statements to be executed when the alternative test succeeds. This must be aligned\
    \ with the if keyword, followed by a : colon, and its statements indented. A final\
    \ else keyword can then be added to offer"
