  md: '# # Summary


    +   - The standard Python library has a random module that provides functions
    to generate pseudo-random numbers.


    +   - Pseudo-random floating-point number from 0.0 to 1.0 can be generated by
    the random module''s random() function.


    +   - Multiple unique random integers within a given range can be generated by
    the random module''s sample() function.


    +   - A program plan should define the program’s purpose, required functionality,
    and interface widgets needed.


    +   - In designing a program interface, the grid() layout manager positions widgets
    in rows and columns.


    +   - Static properties do not change during execution of a program.


    +   - Dynamic properties do change during execution of a program using runtime
    functionality to respond to a user action.


    +   - Upon completion, a program should be tested to ensure it performs as expected
    in every respect.


    +   - Program files can be “frozen” into a bundle for distribution to other computers
    when the Python interpreter is not present.


    +   - The PyInstaller tool can be used to freeze programs into executables for
    Windows, Mac, or Linux.


    +   - The pyinstaller command’s --onefile argument specifies that it should create
    a single executable file.


    +   - The pyinstaller command’s --nconsole argument specifies that the executable
    file should not only produce a console window.


    +   - The pyinstaller command’s --add-binary argument can specify image files
    to be bundled within the executable file.'
  merge: -1
