    # # Manipulating bits


    In computer terms, each byte comprises eight bits that can each contain a 1 or
    a 0 to store a binary number, representing decimal values from 0 to 255. Each
    bit contributes a decimal component only when that contains a 1. Components are
    designated right-to-left from the “Least Significant Bit” (LSB) to the “Most Significant
    Bit” (MSB). The binary number in the bit pattern below is 0110010 and represents
    the decimal number 50(2+16+32):


    | Bit No. | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |

    |---|---|---|---|---|---|---|---||}{

    | Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Binary | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 0 |


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_57_0.png)


    Many Python programmers never use bitwise operators but it is useful to understand
    what they are and how they may be used.


    It is possible to manipulate individual parts of a byte using the Python “bitwise”
    operators listed and described below:


    | Operator | Name: | Binary number operation: |

    |---|---||}{

    | | OR | Return a 1 in each bit where either of two compared bits is a 1

    Example: 1010 | 0101 = 1111 |

    | & | AND | Return a 1 in each bit where both of two compared bits is a 1

    Example: 1010 & 1100 = 1000 |

    | ~ | NOT | Return a 1 in each bit where neither oft compared bits is a 1

    Example: 1010 ~ 0011 = 0100 |

    | ^ | XOR | Return a 1 in each bit where only one of two compared bits is a 1

    Example: 1010 ^ 0100 = 1110 |

    | << | Shift left | Move each bit that is a 1 a specified number of bits to the
    left

    Example: 0010 << 2 = 1000 |'
