    # Accessing files


    The __builtins__ module can be examined using the dir() function to reveal that
    it contains a file object that defines several methods for working with files,
    including open(), read(), write(), and close().


    Before a file can be read or written, it firstly must always be opened using the
    open() method. This requires two string arguments to specify the name and location
    of the file, and one of the following “mode” specifiers in which to open the file:


    | File mode | Operation |

    | --- | --- |

    | r | Open an existing file to read |

    | w | Open an existing file to write. Creates a new file if none exists, or opens
    an existing file and discards all its contents |

    | a | Append text. Opens or creates a text file for writing at the end of the
    file |

    | r+ | Open a text file to read from or write to |

    | w+ | Open a text file to write to or read from |

    | a+ | Open or creates a text file to read from ora+write at the end of the file
    |


    Where the mode includes a b after any of the file modes listed above, the operation
    relates to a binary file rather than a text file. For example, rb or w+b


    Once a file is opened and you have a file object, you can get various details
    related to that file from its properties:


    | Property | Description |

    | --- | --- |

    | name | Name of the opened file |

    | mode | Mode in which the file was opened |

    | closed | Status Boolean value of True or False |

    | readable() | Read permission Boolean value of True or False |

    | writable() | Write permission Boolean value of True or False |'
