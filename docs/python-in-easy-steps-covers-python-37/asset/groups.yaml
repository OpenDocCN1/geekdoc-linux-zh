    \nA class can have only one method with a given name – method overloading is not\
    \ supported in Python.\n\n# Summary\n\n- A class is a data structure describing\
    \ object properties with its methods.\n- Each class declaration begins with the\
    \ class keyword, and is followed by an indented code block that may contain class\
