  mdcn: "\n\n这意味着你可以在调用函数时传递的的个数少于函数定义中指定的参数数量，以使用默认参数值；或者传递与指定参数数量相同的值来覆盖默认值。\n\n\
    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_0.png)\n\n参数命名遵循与变量和函数相同的约定。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_1.png)\n\
    \n具名参数与传递给它们的变量相同，这使得数据移动变得直观。\n\n- 1. 开始编写一个新的 Python 脚本，定义一个接受三个参数的函数，该函数将打印传入的值：\n\
    ```python\ndef echo(user, lang, sys) :\n    print('User:', user, 'Language:',\
    \ lang, 'Platform:', sys )\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_2.png)\n\
    \n- 2. 接下来，按照它们出现的顺序向函数参数传递字符串值调用函数：\n`echo('Mike', 'Python', 'Windows')`\n\n\
    - 3. 现在，通过指定参数名称向函数参数传递字符串值调用函数：\n`echo(lang = 'Python', sys = 'Mac OS', user\
    \ = 'Anne')`\n\n- 4. 然后，定义另一个接受两个带有默认值参数的函数，该函数将打印参数：\n\n```python\ndef mirror(user\
    \ = 'Carole', lang = 'Python'):\n    print('\\nUser:', user, 'Language:', lang)\n\
    ```\n\n- 5. 最后，添加语句以通过使用默认值和覆盖默认值来调用第二个函数：\nmirror(lang = 'Java')\nmirror(user\
    \ = 'Tony')\nmirror('Susan', 'C++')\n\n- 6. 将文件保存到你的脚本目录，然后在那里打开命令提示符窗口并运行此程序\
    \ – 查看函数显示参数值。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_96_0.png)\n\n# 返回值\n\
    \n类似于 Python 的内置函数（该函数返回调用者指定的作为参数的值的字符串表示），自定义函数也可以通过 `return` 关键字指定要返回的值来向调用者返回值。例如，如下所示向调用者返回两个指定参数值之和：\n\
    \n```python\ndef sum(a, b):\n  return a + b\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_97_0.png)\n\
    \n返回的结果可以由调用者赋值给变量，供程序后续使用，如下：\n\n```python\ntotal = sum(8, 4)\nprint('Eight Plus\
    \ Four Is: ', total )\n```\n\n或者返回的结果可以直接“内联””使用，如下：\n\n```python\nprint('Eight\
    \ Plus Four Is: ', 8, 4) )\n```\n\n通常，`return` 语句出现在函数块的最最后，以返回执行该函数包含的所有语句的最终结果。\n\
    \n然而，`return` 语句也可以出现在函数块较早的位置，以停止该块中所有后续语句的执行。这会让程序立即在调用处恢复执行。可选地，`return` 语句可以指定返回给调用者的值，也可以省略该值。当未指定值时，假设默认值为\
    \ `None`。通常，这用于在发现条件测试为 `False` 后停止函数语句的执行。例如，当传递的参数值低于指定的数字时：\n\n```python\n\
    def sum(a, b):\n  if a < 5:\n```\n\n在这种情况下，当第一个传入的参数值小于五时，函数将返回默认的 `None`，最后的语句将不会执行。\n\
    \n当函数需要执行算运算时，可以使用内置的 `isdigit()` 函数验证用户输入是否为整数。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_98_0.png)\n\
    \n你可以在函数定义中为参数指定默认值。\n\n- 开始编写一个新的 Python 脚本，初始化一个带有用户整数输入的变量以便处理：\nnum = input('Enter\
    \ An Integer:')\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_98_1.png)\n\n- 接下来，添加一个函数定义，接受调用者传递的单个参数值：\n\
    def square(num) :\n\n- 现在，在函数块中插入一个缩进语句，以验证传递的值是否为整数或停止函数语句的执行：\nif not num.isdigit():\n\
    \    return 'Invalid Entry'\n\n- 然后，添加缩进语句将传递的值强制转换为 `int` 数据类型，然后将该值的平方和返回给调用者：\n\
    num = int(num)\nreturn num * num\n\n- 最后，添加一个语句输出字符串和函数调用的返回值：\n\n```python\n\
    print( num, 'Squared Is:', square( num ))\n```\n\n将文件保存到你的脚本目录，然后打开命令提示符并运行此程序\
    \ – 查看函数显示返回的值。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_99_0.png)\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_99_1.png)\n\
    \n记住用户输入是以 `str` 数据类型读取的 – 因此必须转换为 `int` 或 `float` 数据类型才能进行算术运算。\n\n# 使用回调\n\n\
    在 Python 中，使用 `def` 关键字创建具名函数以指定函数名，该函数可以在程序中的任何时间被调用，以执行其包含的语句。可选地，具名函数可以向调用者返回一个值。\n\
    \nPython 还允许使用 `lambda` 关键字创建无名的匿名函数。匿名函数只能包含一个表达式，并且必须返回一个值。\n\n与通常使用 `lambda`\
    \ 关键字创建函数不同，`lambda` 返回的是一个“函数对象”。这个对象可以赋值给变量，然后可以在程序中的任何时间引用（“回调”）该函数，以执行其包含的表达式。\n\
    \n因此，`lambda` 关键字为程序员提供了创建函数的替代语法。例如：\n\n```python\ndef square(x):\n    return\
    \ x ** 2\n```\n\n可以更简洁地写为：\n\n```python\nsquare = lambda x : x ** 2\n```\n\n在任何情况下，`square(5)`\
    \ 都通过参数返回 25。`lambda` 关键字后面紧跟参数，冒号后面是表达式。\n\n内联 lambda 回调通常用于定义 GUI 程序中的按钮。\n\n\
    - 开始编写一个新的 Python 脚本，定义三个返回传入参数不同幂的函数：\ndef function_1(x) : return ** 2\ndef function_2(x)\
    \ : return ** 3\ndef function_3(x) : return ** 4\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_101_0.png)\n\
    \n- 接下来，通过引用它们的名称为函数创建一个回调列表：\ncallbacks = [ function_1, function_2, function_3\
    \ ]\n\n- 现在，显示标题并向每个具名函数传递值打印结果：\nprint('\\nNamed Functions:')\nfor function in\
    \ callbacks : print('Result:', function( 3 ))\n\n- 然后，添加语句创建一个返回传入参数不同幂的内联匿名函数的回调列表：\n\
    callbacks = [ lambda : x ** 2, lambda : x ** 3, lambda : x ** 4 ]\n\n- 最后，显示标题并向每个匿名函数传递值打印结果：\n\
    print('\\nAnonymous Functions:')\nfor function in callbacks : print('Result:',\
    \ function( 3 ))\n\n"
