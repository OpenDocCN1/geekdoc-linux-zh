    3. 接下来，将 MyScripts 和 MyProjects 文件夹提取到你的主目录（如 C:\），并将 htdocs 文件夹的所有内容复制到你 Web
    服务器的文档目录。

    4. 现在，按照步骤调用 Python 解释器并查看输出。


    你还可以在本书的下载部分找到本书的更新（如有）。


    # 1 入门


    欢迎来到 Python 编程语言精彩的世界。本章将演示如何安装 Python 并创建你的第一个程序。


    - Python 简介介绍

    - 在 Windows 上安装 Python

    - 在 Linux 上安装 Python

    - 认识解释器

    - 编写你的第一个程序

    - 使用变量

    - 获取用户输入

    - 纠错

    - 总结


    # Python 简介介绍


    Python 是一种高级的（人类可读的）编程语言，由 Python “解释器”处理以产生结果。它包含一个经过测试的标准库，可以轻松集成。


    Python 语言由 Guido Rossum 在 80 年代后期和 90 年代初在荷兰数学计算机科学研究院开发。Python 源自许多其他语言，如 C、C++、Unix
    Shell 等语言。如今，Python 由核心开发团队维护。


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_9_0.png)


    在 www.python.org 获取最新的 Python 新闻


    Python 语言的基本哲学是可读性，这使其特别适合编程初学者，并可以总结为以下原则：


    - 漂亮优于丑陋。

    - 显式优于隐式。

    - 简单优于复杂。

    - 复杂优于晦涩。

    - 可读性非常重要。


    由于 Python 设计为高度可读，因此它频繁使用英语单词，而其他语言可能使用标点符号。最重要的是，它使用缩进将语句分组为代码“块”，而其他语言可能使用关键字或标点符号来实现此目的。例如，在
    Pascal 编程语言中，块以关键字 begin 开始并关键字 end 结束；在 C 编程语言中，块被包含在大括号 ({}) 内。


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_10_0.png)


    使用缩进分组块的编程语言被认为遵循了“越位规则”——这是对足球中越位规则的双关语。


    Python 的一些关键区别特征使其成为初学者的理想语言选择，包括：


    - Python 是免费的——开源发行软件。

    - Python 易于学习——语言语法简单。

    - Python 易于阅读——没有标点符号的干扰。

    - Python 易于维护——模块化设计简单。

    - Python “自带电池”——提供大型标准库，方便集成到你自己的程序中。

    - Python 是交互式的——拥有用于调试和测试片段的终端。

    - Python 是移植的——运行在各种硬件平台上，且在所有平台上具有相同的接口。

    - Python 是解释型的——不需要编译。

    - Python 是高级的——具有自动内存管理。

    - Python 是可扩展的——允许向低级模块添加


