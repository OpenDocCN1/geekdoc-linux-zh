    \ code that does not conform to the Python language rules. For example, a missing\
    \ quote mark around a string. The interpreter halts and reports the error without\
    \ executing the program.\n- Runtime Error – occurs during execution of the program,\
    \ at the time when the program runs. For example, when a variable name is later\
    \ mis-typed so the variable cannot be recognized. The interpreter runs the program\
    \ but halts at the error and reports the nature of the error as an “Exception”.\n\
    - Semantic Error – occurs when the program performs unexpectedly. For example,\
