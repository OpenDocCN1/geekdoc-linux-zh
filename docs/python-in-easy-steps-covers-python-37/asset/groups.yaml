  - "[PAGE 94]\n\n# Supplying arguments\n\nWhen defining a custom function in Python\
    \ programming you may, optionally,\nspecify an “argument” name between the function’s\
    \ parentheses. A value can\nthen be passed to that argument by specifying the\
    \ value in the parentheses of\ntcall to the function. The function can now use\
    \ that passed in value during its\nexecution by referencing it via the argument\
    \ name. For example, defining a\nfunction to accept an argument to print out,\
    \ like this:\n\n```\ndef echo(user):\n    print('User:', sys)\n```\n\nA call to\
    \ this function must specify a value to be passed to the argument within\nits\
    \ parentheses so it can be printed:\n\n```\necho('Mike')\n```\n\nMultiple arguments\
    \ (a.k.a. “parameters”) can be specified in the function\ndefinition by including\
    \ a comma-separated list of argument names within the\nfunction parentheses:\n\
    \n```\ndef echo(user, lang, sys) :\n    print('User:', user, 'Language:', 'Platform:',\
    \ sys)\n```\n\nWhen calling a function whose definition specifies arguments, the\
    \ call must\ninclude the same number of data values as arguments. For example,\
    \ to call this\nexample with multiple arguments:\n\n```\necho('Mike', 'Python',\
    \ 'Windows')\n```\n\nThe passed values must appear in the same order as the arguments\
    \ list unless the\ncaller also specifies the argument, like this:\n\n```\necho(lang\
    \ = 'Python', user = 'Mike', sys = 'Windows')\n```\n\nOptionally, a default value\
    \ may be specified in the argument list when defining a\nfunction. This will be\
    \ overridden when the caller specifies a value for that\nargument, but will be\
    \ used by the function when no value gets passed by the\ncaller:\n\n```\ndef echo(user,\
    \ lang, sys = 'Linux') :\n    print('User:', user, 'Language:', 'Platform:', sys)\n\
    ```"
- md: "\nThis means you may call the function passing fewer values than the number\
    \ of arguments specified in the function definition, to use the default argument\
    \ value, or pass the same number of values as specified arguments to override\
    \ the default value.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_0.png)\n\n\
    Argument-naming follows the same conventions as variables and functions.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_1.png)\n\
    \nName arguments are the same as variables passed to them to make the data movement\
    \ obvious.\n\n- 1. Start a new Python script by defining a function to accept\
    \ three arguments that will print out their passed in values\n```python\ndef echo(user,\
    \ lang, sys) :\n    print('User:', user, 'Language:', lang, 'Platform:', sys )\n\
    ```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_95_2.png)\n\n- 2. Next, call the\
    \ function passing string values to the function arguments in the order they appear\n\
    `echo('Mike', 'Python', 'Windows')`\n\n- 3. Now, call the function passing string\
    \ values to the function arguments by specifying the argument names\n`echo(lang\
    \ = 'Python', sys = 'Mac OS', user = 'Anne')`\n\n- 4. Then, define another function\
    \ to accept two arguments with default values that will print out argument\n\n\
    ```python\ndef mirror(user = 'Carole', lang = 'Python'):\n    print('\\nUser:',\
    \ user, 'Language:', lang)\n```\n\n- 5. Finally, add statements to call the second\
    \ function both using and overriding default values\nmirror(lang = 'Java')\nmirror(user\
    \ = 'Tony')\nmirror('Susan', 'C++')\n\n- 6. Save the file in your scripts directory,\
    \ then open a Command Prompt window there and run this program – to see the function\
    \ display the argument values\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_96_0.png)\n\
    \n# Returning values\n\nLike Python's built-in function, which returns a string\
    \ representation of the value specified as its argument by the caller, custom\
    \ functions can also return a value to their caller by using the return keyword\
    \ to specify a value to be returned. For example, to return to the caller the\
    \ total of adding two specified argument values, like this:\n\n```python\ndef\
    \ sum(a, b):\n  return a + b\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_97_0.png)\n\
    \nThe returned result may be assigned to a variable by the caller for subsequent\
    \ use by the program, like this:\n\n```python\ntotal = sum(8, 4)\nprint('Eight\
    \ Plus Four Is: ', total )\n```\n\nOr the returned result may be used directly\
    \ “in-line”, like this:\n\n```python\nprint('Eight Plus Four Is: ', 8, 4) )\n\
    ```\n\nTypically, a return statement will appear at the very end of a function\
    \ block to return the final result of executing all statements contained in that\
    \ function.\n\nA return statement may, however, appear earlier in the function\
    \ block to halt execution of all subsequent statements in that block. This immediately\
    \ resumes execution of the program at the caller. Optionally, the return statement\
    \ may specify a value to be returned to the caller or the value may be omitted.\
    \ When no value is specified, a default value of None is assumed. Typically, this\
    \ is used to halt execution of the function statements after a conditional test\
    \ is found to be False. For example, where a passed argument value is below a\
    \ specified number:\n\n```python\ndef sum(a, b):\n  if a < 5:\n```\n\nIn this\
    \ case, the function will return the default None when the first passed argument\
    \ value is below five and the final statement will not be executed.\n\nWhere the\
    \ function is to perform arithmetic, user input can be validated for integer values\
    \ with the built-in isdigit() function.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_98_0.png)\n\
    \nYou can specify a default value for an argument in the function definition.\n\
    \n- Start a new Python script by initializing a variable with user input of integer\
    \ value for manipulation\nnum = input('Enter An Integer:')\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_98_1.png)\n\
    \n- Next, add a function definition that accepts a single argument value to be\
    \ passed from the caller\ndef square(num) :\n\n- Now, insert into the function\
    \ block an indented statement to validate the passed value as an integer or halt\
    \ execution of the function's statements\nif not num.isdigit():\n    return 'Invalid\
    \ Entry'\n\n- Then, add indented statements to cast the passed value as an int\
    \ data type then return the sum of squaring that value to the caller\nnum = int(num)\n\
    return num * num\n\n- Finally, add a statement to output a string and the returned\
    \ value from the function call\n\n```python\nprint( num, 'Squared Is:', square(\
    \ num ))\n```\n\nSave the file in your scripts directory, then open a Command\
    \ Prompt window and run this program – to see the function display the returned\
    \ values\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_99_0.png)\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_99_1.png)\n\
    \nRemember that user input is read as a str data type – so must be cast into an\
    \ int or float data type for arithmetic.\n\n# Using callbacks\n\nIn Python, a\
    \ named function is created using the def keyword to specify a function name,\
    \ which can be used to call that function at any time in the program to execute\
    \ the statements it contains. Optionally, the named function can return a value\
    \ to the caller.\n\nPython also allows an anonymous un-named function to be created\
    \ using the lambda keyword. An anonymous function may only contain a single expression\
    \ and must return a value.\n\nUnlike the usual creation of a function with the\
    \ lambda keyword returns a “function object”. This can be assigned to a variable,\
    \ which can then be used to reference (“call back”) the function at any time in\
    \ the program to execute the expression it contains.\n\nThe lambda keyword, therefore,\
    \ offers the programmer an alternative syntax for the creation of a function.\
    \ For example:\n\n```python\ndef square(x):\n    return x ** 2\n```\n\ncan alternatively\
    \ be written more succinctly as...\n\n```python\nsquare = lambda x : x ** 2\n\
    ```\n\nIn either case, the call square(5) returns the result 25 by passing in\
    \ an integer argument to the function. Note that the lambda keyword is followed\
    \ by an argument without parentheses, the specified expression does not require\
    \ the return keyword as all functions created with lambda must implicitly return\
    \ a value.\n\nWhile the lambda keyword offers an alternative way to create a function\
    \ it is most used to embed a function within the code. For instance, callbacks\
    \ are frequently coded as inline lambda expressions embedded directly in a caller’s\
    \ arguments list – instead of being defined with the def keyword elsewhere in\
    \ the program and referenced by name. For example:\n\n```python\ndef function_1\
    \ : statements-to-be-executed\ndef function_2 : statements-to-be-executed\ncallbacks\
    \ = [ function_1, function_2 ]\n```\n\ncan alternatively be written more succinctly\
    \ as...\ncallbacks = [ lambda : expression , lambda : expression ]\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_101_0.png)\n\
    \nIn-line lambda callbacks are often used to define the behavior of buttons in\
    \ a GUI program.\n\n- Start a new Python script by defining three functions to\
    \ return a passed argument raised to various\ndef function_1(x) : return ** 2\n\
