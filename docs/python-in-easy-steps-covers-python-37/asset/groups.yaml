    python3 让该版本的 Python 解释器处理你的程序。


    # 会话解释器


    Python 解释器处理基于文本的程序代码，并且还有一个交互模式，你可以在其中测试代码片段，这对于调试代码非常有用。可以通过多种方式进入 Python 的交互模式：


    - 从常规命令提示符 – 只需输入命令 python 产生 Python 提示符，你可以在其中与解释器交互。

