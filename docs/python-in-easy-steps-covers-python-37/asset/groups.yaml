    # Encapsulating data


    A “class” is a specified prototype describing a set of properties that characterize
    an object. Each class has a data structure that can contain both functions and
    variables to characterize the object.


    The properties of a class are referred to as its data “members”. Class function
    members are known as its “methods”, and class variable members (declared within
    a class structure but outside any method definitions) are known as its “attributes”.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_176_0.png)


    Class members can be referenced throughout a program using dot notation, suffixing
    the member name after the class name, with syntax of class-name.method-name()
    Or class-name.attribute-name.


    A class declaration begins with the class keyword, followed by a programmer-specified
    name (adhering to the usual Python naming conventions but beginning in uppercase)
    then a : colon. Next, come indented statements optionally specifying a class document
    string, class variable attribute declarations, and class method definitions –
    so the class block syntax looks like:


    ```

    class ClassName :

    ```


    ```

    “ class-documentation-string ”

    class-variable-declarations

    class-method-definitions

    ```


    The class declaration, which specifies its attributes and methods, is a blueprint
    from which working copies (“instances”) can be made.


    All variables declared within method definitions are known as “instance” variables
    and are only available locally within the method in which they are declared –
    they cannot be directly referenced outside the class structure.'
  - "[PAGE 177]\n\nTypically, instance variables contain data passed by the caller\
    \ when an instance copy of the class is created. As this data is only available\
    \ locally for internal use, it is effectively hidden from the rest of the program.\
    \ This technique of data “encapsulation” ensures that data is securely stored\
    \ within the class structure and is the first principle of Object Oriented Programming\
    \ (OOP).\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_177_0.png)\n\nIt is conventional\
    \ to begin class names with an uppercase character, and object names with lowercase.\n\
    \nAll properties of a class are referenced internally by the dot notation prefix\
    \ self – so an attribute “sound” is self.sound. Additionally, all method definitions\
    \ in a class must have self as their first argument – so a method named “talk”\
    \ is talk(self).\n\nWhen class instance is created, a special __init__(self) method\
    \ is automatically called. Subsequent arguments can be added in these parentheses\
    \ if values are to be passed to initialize its attributes.\n\nA complete Python\
    \ class declaration could look like this example:\n\n```\nclass Critter:\n   \
    \ \"\"\"A base class for all critters properties.\"\"\"\n    count = 0\n    def\
    \ init(self, chat):\n        self.sound = chat\n        Critter.count += 1\n\n\
    \    def talk(self):\n        return self.sound\n```\n\nIt is useful to examine\
    \ the class components of this example:\n\n+   - The variable count is a class\
    \ variable whose integer value gets shared among all instances of this class –\
    \ this value can be referenced as Critter.count from inside or outside the class."
