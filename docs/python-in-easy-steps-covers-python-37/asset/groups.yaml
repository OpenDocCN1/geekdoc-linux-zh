    A Radiobutton object has a deselect() method that can be used to cancel a selection
    programmatically.


    # Checking boxes


    A Checkbutton widget provides a single item in an application that the user may
    select. Where a number of check buttons appear together the user may select one
    or more items. Check button objects nominate an individual control variable object
    to assign a value to checked or unchecked. An empty string variable object can
    be created for this using the StringVar() constructor or an empty integer variable
    object using the IntVar() constructor.


    A check button is created by specifying five arguments to a Checkbutton constructor:


    -   Name of the parent container, such as the frame name.

    - Text for a display label, as a text=text pair.

    - Control variable object, as a variable=variable pair.

    - Value to assign if checked, as an onvalue=value pair.

    - Value to assign if unchecked, as an offvalue=value pair.


    An integer value assigned by a check button can be retrieved from an integer variable
    object by its get() method.


    -   Start a new Python program by making GUI features available and messagebox
    features available as a short alias

    ```python

    from tkinter import *

    import tkinter.messagebox as box

