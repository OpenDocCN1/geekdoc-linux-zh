- md: "\n# Adding placeholders\n\nThe Python pass keyword is useful when writing program\
    \ code as a temporary placeholder that can be inserted into the code at places\
    \ where further code needs to be added later. The pass keyword is inserted where\
    \ a statement is required syntactically, but it merely performs a “null” operation\
    \ – when it is executed nothing happens and no code needs to be executed. This\
    \ allows an incomplete program to be executed for testing by simulating syntax\
    \ so the interpreter does not report errors.\n\n- Start a new Python script by\
    \ initializing a variable with a Boolean value, then add an incomplete conditional\
    \ test\n```python\nbool = True\nif bool:\n    print('Python In Easy Steps')\n\
    else:\n    # Statements to be inserted here.\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_103_0.png)\n\
    \n- Save the file in your scripts directory, then open a Command Prompt window\
    \ and run this program – to see the interpreter report an error\n\n```\nCommand\
    \ Prompt\nC:\\Scripts>python incomplete.py\nFile \"incomplete.py\", line 7\nSyntaxError:\
    \ unexpected EOF while parsing\nC:\\Scripts>>\n```\n\n- Replace the comment with\
    \ the pass keyword then save the file and run the program again – to see the program\
    \ execute as the interpreter does not now find an error\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_104_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_104_1.png)\n\nIn loop structures it\
    \ is important not to confuse the pass keyword, which allows the interpreter to\
    \ process all subsequent statements on iteration, with the continue keyword, which\
    \ skips subsequent statements on iteration of the loop only.\n\n- Start a new\
    \ Python script by initializing a variable with a string value title=`Python In\
    \ Easy Steps\\n`\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_104_2.png)\n\n- Next,\
    \ add a loop to print each character of the string `for char in title: print(char,\
    \ end='')`\n\n- Now, add a loop that prints each string character but replaces\
    \ any 'y' character then skips to the next iteration\n```python\nfor char in title:\n\
    \    if char == 'y':\n        print('', end '')\n        continue\n    print(char,\
    \ end '')\n```\n\n- Finally, add a loop that prints each string character but\
    \ inserts an asterisk before each 'y' character\n```python\nfor char in title:\n\
    \    if char == 'y':\n        print('', end '')\n```\n\n```python\npass\nprint(\
    \ char , end = ' ' )\n```\n\nSave the file in your scripts directory, then open\
    \ a Command Prompt window there and run this program – to see a different output\
    \ from each loop\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_105_0.png)\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_105_1.png)\n\
    \nIn a loop, the continue keyword continues on the next iteration, whereas the\
    \ pass keyword passes on to the next statement of the same iteration.\n\n# Producing\
    \ generators\n\nWhen a Python function is called, it executes the statements it\
    \ contains and may return any value specified to the return keyword. After the\
    \ function ends, control returns to the caller and the state of the function is\
    \ not retained. When the function is next called, it will process its statements\
    \ from start to finish once more.\n\nA Python generator, on the other hand, is\
    \ a special function that returns a \"generator object\" to the caller rather\
    \ than a data value. This, effectively, retains the state of the function when\
    \ it was last called, so it will continue from that point when next called.\n\n\
    Generator functions are produced by definition just like regular functions, but\
    \ contain a \"yield\" statement. This begins with the Python yield keyword and\
    \ specifies the generator object to be returned to the caller. When the yield\
    \ statement gets executed, the state of the generator object is frozen, and the\
    \ current value in its \"expression list\" is retained. The generator object returned\
    \ by the yield statement can be conveniently assigned to a variable. Python's\
    \ built-in next() function can then specify that variable within its parentheses\
    \ to continue execution of the function from the point at which it was frozen\
    \ – exactly as if the yield statement were just another external call.\n\nRepeatedly\
    \ calling the generator object with the next() function continues execution of\
    \ the function until it raises an exception. This can be avoided by enclosing\
    \ the yield statement within an infinite loop so it will return successive values\
