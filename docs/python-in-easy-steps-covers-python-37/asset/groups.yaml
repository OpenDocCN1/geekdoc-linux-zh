    \n# Inheriting features\n\nA Python class can be created as a brand new class,\
    \ like those in previous examples, or can be “derived” from an existing class.\
    \ Importantly, a derived class inherits members of the parent (base) class from\
    \ which it is derived – in addition to its own members.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_192_0.png)\n\
    \nThe ability to inherit members from a base class allows derived classes to be\
    \ created that share certain common properties, which have been defined in the\
    \ base class. For example, a “Polygon” base class may define width and height\
    \ properties that are common to all polygons. Classes of “Rectangle” and Triangle\
    \ could be derived from the Polygon class – inheriting width and height properties,\
    \ in addition to their own members defining their unique features.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_192_1.png)\n\
    \nThe virtue of inheritance is extremely powerful, and is the second principle\
    \ of Object Oriented Programming (OOP).\n\nA derived class declaration adds (\
    \ ) parentheses after its class name specifying the name of its parent base class.\n\
    \n- Create a new Python script that declares a base class with two class variables\
    \ and a method to set their values\n\n```python\nclass Polygon:\n    width = 0\n\
    \    height = 0\ndef set_values(self, width , height):\n    Polygon.width = width\n\
    \    Polygon.height = height\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_193_0.png)\n\
    \nNext, create a script that declares a derived class with a method to return\
    \ manipulated class variable values\nfrom Polygon import *\n\n```python\nclass\
    \ Rectangle(Polygon):\n    def area(self):\n        return self.width * self.height\n\
    ```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_193_1.png)\n\nNow, create another\
    \ script that declares a derived class with a method to return manipulated class\
    \ variable values\nfrom Polygon import *\n\n```python\nclass Triangle(Polygon):\n\
    \    def area(self):\n        return (self.width * self.height) / 2\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_193_2.png)\n\
    \nSave the three class files then start a new Python script by making features\
    \ of both derived classes available\nfrom Rectangle import *\nfrom Triangle import\
    \ *\n\nNext, create an instance of each derived class\n\n```python\nrect = Rectangle()\n\
    trey = Triangle()\n```\n\nNow, call the class method inherited from the base class,\
    \ passing arguments to assign to the class variables\n\n```python\nrect.set_values(4,\
    \ 5)\ntrey.set_values(4, 5)\n```\n\nFinally, display the result of manipulating\
    \ the class variables inherited from the base class\n\n```python\nprint('Rectangle\
    \ Area:', rect.area())\nprint('Triangle Area:', trey.area())\n```\n\nSave the\
    \ file in your scripts directory, then open a Command Prompt and run this program\
    \ – to see output inherited features\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_194_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_194_1.png)\n\nA class declaration can\
    \ derive from more than one class by listing multiple base classes in the parentheses\
    \ after its name.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_195_0.png)\n\nDon't\
    \ confuse class instances and derived classes – an instance is a copy of a class,\
    \ whereas a derived class is a new class that inherits properties of the base\
    \ class from which it is derived.\n\n# Overriding base methods\n\nA method can\
    \ be declared in a derived class to override a matching method in the base class\
    \ – if both method have the same name and the same number of arguments. This effectively\
    \ hides the base class method it becomes inaccessible unless it is called explicitly,\
    \ using the base class name.\n\nWhere a method in a base class supplies a default\
    \ argument can be used in an explicit call to the base method, or alternative\
    \ values can be supplied by overriding methods.\n\n- 1. Create a new Python script\
    \ that declares a base class with an initializer method to set an instance variable,\
    \ and a second method to display that value\n```python\nclass Person:\n    \"\"\
    \"A class to define Person properties.\"\"\"\n    def __init__(self, name):\n\
    \        self.name = name\n\n    def speak(self, msg='Calling The Base Class'):\n\
    \        print(self.name, msg)\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_196_0.png)\n\
    \n- 2. Next, create a script that declares a derived class with a method that\
    \ overrides the base method\nfrom Person import *\n\"\"\"A derived class to define\
    \ Man properties.\"\"\"\n```python\nclass Man(Person):\n    def speak(self, msg=\"\
    ):\n        print(self.name, '\\n\\tHello!', msg)\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_197_0.png)\n\
    \n3. Now, create another script that also declares a derived class with a method\
    \ that once again overrides the same method in the base class\nfrom Person import\
    \ *\n\n\"\"\"A derived class to define Hombre properties.\"\"\"\n\n```python\n\
    class Hombre(Person):\n    def speak(self, msg):\n        print(self.name, ':\\\
    ntHola!', msg)\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_197_1.png)\n\n\
    4. Save the three class files, then start a new Python script by making features\
    \ of both derived classes available\nfrom Man import *\nfrom Hombre import *\n\
    \n5. Next, create an instance of each derived class, initializing the “name” instance\
    \ variable attribute\n```python\nguy_1 = Man('Ricardo')\nguy_2 = Hombre('Ricardo')\n\
    ```\n\n6. Now, call the overriding methods of each derived class, assigning different\
    \ values to the “msg” argument\n```python\nguy_1.speak('It’s a beautiful evening.')\n\
    guy_2.speak('Es una tarde hermosa.')\n```\n\nFinally, explicitly call the base\
    \ class method, passing a reference to each derived class – but none for the “msg”\
    \ variable so its default value will be used\n\n```python\nPerson.speak(guy_1)\n\
    Person.speak(guy_2)\n```\n\nSave the file in your scripts directory, then open\
    \ a Command Prompt window there and run this program – to see output from overriding\
    \ and base class methods\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_198_1.png)\n\
    \nThe method declaration in the derived class must exactly match that in the base\
    \ class to override it.\n\n# Harnessing polymorphism\n\nThe three cornerstones\
    \ of Object Oriented Programming (OOP) are encapsulation, inheritance, and polymorphism.\
    \ Examples earlier in this chapter have demonstrated how data can be encapsulated\
    \ within a class, and how derived classes inherit the properties of their base\
    \ class. This example introduces the final cornerstone principle of polymorphism.\n\
    \nThe term \"polymorphism\" (from Greek, meaning \"many forms\") describes the\
    \ ability to assign a different meaning, or purpose, to an entity according to\
    \ its context.\n\nIn Python, the + character entity can be described as polymorphic\
    \ because it represents either the arithmetical addition operator, in the context\
    \ of numerical operands, or the string concatenation operator, in the context\
    \ of character operands.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_199_0.png)\n\
    \nPerhaps more importantly, Python class methods can also be polymorphic because\
    \ the Python language uses \"duck typing\" – meaning... if it walks like a duck,\
    \ swims like a duck, and quacks like a duck, then that bird is reckoned to be\
    \ a duck.\n\nIn a duck-typed language you can create a function to take an object\
    \ of any type and call that object's methods. If the object indeed have the called\
    \ methods (is reckoned to be a duck) they are executed, otherwise the function\
    \ signals a run-time error.\n\n- 1. Create a new Python script that declares a\
    \ class with methods to display strings unique to the class\n"
