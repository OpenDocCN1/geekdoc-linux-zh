    >>> 8 + 4

    12

    >>>

    ```

    Python 解释器还理解表达式，因此可以使用括号来赋予优先级 —— 括号内的部分将优先计算。


    - 接下来，在 Python 提示符处输入一个没有指定优先级的组件表达式

    - 现在，在 Python 提示符处输入相同的表达式但加上括号以指定优先级


    表达式中的空格是被忽略的，因此 8+4 也可以带有空格输入以保持清晰度 —— 如此处所示。


    交互模式主要用于测试代码片段和调试代码。“IDLE” 是 Python 集成开发环境的缩写，但功能有限，因此未用于本书中的示例。


    # 编写你的第一个程序


    Python 的交互模式作为简单的计算器很有用，但你可以创建具有扩展功能的程序。Python 程序只是用编辑器（如 Windows 的记事本）创建的纯文本文件脚本，并保存为“.py”扩展名。可以通过在终端提示符
    python 命令后加上脚本文件名来执行 Python 程序。


    学习任何编程语言时创建的传统第一个程序只是打印指定的问候消息。在 Python 中，使用 `print()` 函数来指定括号内的消息。这必须是包含在引号之间的字符字符串。这些引号可以是
    “ ” 双引号或 ‘  ’ 单引号 —— 但不能混合使用。


    - 在 Windows 上，启动任何纯文本编辑器，如记事本程序。

    - 接下来，在空白的文本编辑器窗口中精确输入以下语句

    ```python

    print(''Hello World!'')

    ```

    - 现在，在 c:\MyScripts 创建一个新目录并将文件保存在其中名为 hello.py

    ```

    hello.py - Notepad

    File Edit Format View Help

    print(''Hello World!'')

    ```

    - 最后，启动命令提示符窗口，导航到新目录并精确输入命令 python hello.py – 查看 Python 解释器运行你的程序并打印指定的问候


