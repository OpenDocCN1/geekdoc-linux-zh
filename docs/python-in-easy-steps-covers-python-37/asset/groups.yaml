    # Correcting errors


    In Python programming there are three types of error that can occur. It is useful
    to recognize the different error types so they can be corrected more easily:


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_30_0.png)


    Programming errors are often called “bugs” and the process of tracking them down
    is often called “debugging”.


    +   * Syntax Error – occurs when the interpreter encounters code that does not
    conform to the Python language rules. For example, a missing quote mark around
    a string. The interpreter halts and reports the error without executing the program.

    * Runtime Error – occurs during execution of the program, at the time when the
    program runs. For example, when a variable name is later mis-typed so the variable
    cannot be recognized. The interpreter runs the program but halts at the error
    and reports the nature of the error as an “Exception”.

    * Semantic Error – occurs when the program performs unexpectedly. For example,
