    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_198_1.png)\n\n派生类中的方法声明必须与基类中的完全匹配才能进行重写。\n\
    \n# 利用多态\n\n面向对象编程（OOP）的三个基石是封装、继承和多态。本章早前的示例已经演示了数据如何封装在类中，以及派生类如何继承其基类的属性。本示例引入了多态这一最后一个基石原则。\n\
