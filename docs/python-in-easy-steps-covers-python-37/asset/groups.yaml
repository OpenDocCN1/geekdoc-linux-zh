    print('\\nVariable b Is : ', 'One' if ( b == 1 ) else 'Not One')\nprint('Variable\
    \ b Is : ', 'Even' if ( b % 2 == 0 ) else 'Odd')\n```\n\n-   Then, add a statement\
    \ to assign the result of a conditional evaluation to a new variable\n`max = a\
    \ if (a > b ) else b`\n\n-   Finally, add a statement to assign the displayed\
    \ result – identifying the greater of the two variable values\n`print('Greater\
    \ Value Is:', max)`\n\n-   Save the file in your scripts directory, then open\
    \ a Command Prompt window and run this program – to see the result of conditional\
    \ expression operations\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_50_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_50_1.png)\n\nYou may find that some\
    \ Python programmers dislike conditional expressions as they consider their syntax\
    \ contradicts the principle of easy readability.\n\n# Setting precedence\n\nOperator\
    \ precedence determines the order in which the Python interpreter evaluates expressions.\
    \ For example, in the expression 3 * 8 + 4 the default order of precedence determines\
    \ that multiplication is completed first, so the result is 28 (24 + 4).\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_51_0.png)\n\
    \nThe * multiply operator is on a higher row than the + addition operator – so\
    \ in the expression 3 * 8 + 4 multiplication is completed first, before the addition.\n\
    \nThe table below lists operator precedence in descending order – those on the\
    \ middle row have highest precedence, those on lower rows have successively lower\
    \ precedence. The precedence of operators on the same row is chained Left-to-Right.\n\
    \n| Operator | Description |\n| :--- | :--- |\n| ** | Exponent |\n| * | Multiplication\
    \ |\n| / | Division |\n| // | Floor division |\n| % | Modulo |\n| + | Addition\
