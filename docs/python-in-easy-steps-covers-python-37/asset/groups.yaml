    \ = width\n    Polygon.height = height\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_193_0.png)\n\
    \n接下来，创建一个脚本声明一个派生类，该类包含一个返回修改后的类变量的方法\n```python\nfrom Polygon import *\n\nclass\
