    \n你可以显式为 `end` 参数指定换行符；例如 `end='!\\n'` 会同时添加一个感叹号和一个换行符。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_29_1.png)\n\
    \n你可以在分隔符周围包含空格字符以提高清晰度——就像此示例中星号字符周围显示的那样。\n\n# 修正错误\n\n在 Python 编程中可能会发生三种类型的错误。识别不同的错误类型很有用，这样可以更容易地修正它们：\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_30_0.png)\n\n编程错误通常被称为“bug”，追踪它们的过程通常被称为“调试”（debugging）。\n\
    \n- 语法错误（Syntax Error）——当解释器遇到不符合 Python 语言规则的代码时发生。例如，字符串周围缺少引号。解释器会停止并报告错误，而不执行程序。\n\
    - 运行时错误（Runtime Error）——发生在程序执行期间，即程序运行时。例如，当变量名后续拼写错误导致变量无法被识别时。解释器会运行程序，但在错误处停止，并将错误的性质报告为“异常”（Exception）。\n\
    - 语义错误（Semantic Error）——当程序执行但结果不符合预期时发生。例如，当表达式中没有指定顺序优先级时。解释器运行程序但不报告错误。\n\n\
    修正语法错误和运行时错误非常简单，因为解释器会报告错误发生的位置或错误类型的性质，但语义错误需要检查代码。\n\n```python\nsyntax.py\n\
    ```\n\n- 启动一个纯文本编辑器，然后添加一条语句输出省略闭合引号的字符串\n`print('Python in easy steps )`\n\n\
    - 将文件保存到你的脚本目录，然后打开命令提示符窗口并运行此程序——查看解释器报告语法错误并指示代码中发生错误的位置\n\n```cmd\nCommand\
    \ Prompt\nC:\\MyScripts>python syntax.py\nFile \"syntax.py\", line 1\nprint('\
    \ Python in easy steps )\nSyntaxError: EOL while scanning string literal\nC:\\\
    MyScripts>\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_31_0.png)\n\n通常，语法错误指示器指向代码中缺失内容之后的下一个字符。\n\
    \n- 在闭合括号之前插入引号以结束字符串，然后保存文件并再次运行程序——查看错误是否已修正。\n\n- 接下来，通过初始化变量开始一个新程序，然后尝试用错误的变量名输出其值——查看解释器如何报告运行时错误\n\
    `title = 'Python in easy steps'`\n`print(title)`\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_31_1.png)\n\
    \n```cmd\nC:\\MyScripts>python runtime.py\nTraceback (most recent call last):\n\
    \  File \"runtime.py\", line 2, in <module>\n    print(title)\nNameError: name\
    \ 'title' is not defined\n\nC:\\MyScripts>_\n```\n\n- 修改变量名以匹配变量声明中的名称，然后保存文件并再次运行程序——查看错误是否已修正。\n\
    \n- 现在，通过初始化变量开始一个新程序，尝试输出没有显式优先级的表达式——查看可能出现的意外结果 28\n`num = 3`\n`print(num *\
    \ 8 + 4)`\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_32_0.png)\n\n```cmd\nC:\\\
    MyScripts>python semantic.py\n28\nC:\\MyScripts>_\n```\n\n- 添加括号将表达式分组为 `3 * (8\
    \ + 4)`，然后保存文件并再次运行程序——查看预期的结果 36，修正语义错误。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_32_1.png)\n\
