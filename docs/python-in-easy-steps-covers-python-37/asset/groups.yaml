    多行注释可以封装在三引号之间添加到你的脚本中"""


    ## 获取用户输入


    正如数据值可以赋值给变量一样，脚本中用户指定的值可以通过 `input()` 函数赋值给变量。它在括号内的字符串将提示用户进行输入并等待。用户输入即使是数值也是作为字符串读取，并通过
    `=` 赋值运算符赋值给变量。


    为了显示变量的值，可以以逗号分隔列表传递给 `print()` 函数。


    - 启动纯文本编辑器，声明并初始化一个变量以请求输入


    ```python

    # 使用字符串值初始化变量

    user = input(''I am Python. What is your name? '')

    ```


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_27_0.png)


    - 接下来，通过引用存储的名称显示确认输入的消息


    ```python

    # 输出字符串和变量值

    print(''Welcome'', user)

    ```


    - 现在，将文件保存到你的目录，然后打开终端窗口并运行程序——输入你的名字，然后按回车查看响应消息


    ```

    C:\MyScripts>python input.py

    I am Python. What is your name? Mike

    Welcome Mike

    C:\MyScripts>

    ```


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_28_0.png)


    注意提示字符串末尾有一个空格，它在输出中会显示——用户输入在输入时与冒号隔开。


    当将多个值传递给 `print()` 函数时，它默认用单个空格分隔每个值。然而，可以通过在逗号分隔列表中添加 `sep` 参数来指定另一种分隔符。例如，`sep=''*''`
    将用星号字符分隔每个值。


    `print()` 函数显示的输出默认会在行末尾添加一个不可见的换行符，以自动将打印头移动到下一行。然而，可以通过在逗号分隔列表中添加 `end` 参数来指定另一种行结束符。例如，`end=''?''`
    将以问号结束输出的行。


    - 修改脚本，通过声明并初始化第二个变量来请求另一个用户输入


    ```python

    # 使用用户指定的值初始化另一个变量

    lang = input(''Favorite programming language? '' )

    ```


    - 接下来，通过引用存储的名称显示确认输入的消息——并指定自定义分隔符和自定义行结束符


    # 输出字符串和变量值

    print(lang, ''is'', ''Fun'', sep='' * '', end=''!'')

    ```


