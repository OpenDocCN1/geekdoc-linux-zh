    \ <FILE.ico or FILE.exe.ID or FILE.icns>\nFILE.ico: apply that to a windows executable.\n\
    ```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_287_0.png)\n\nYou will need to\
    \ use the four highlighted options depicted here to create an executable version\
    \ of the Lotto program.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_287_1.png)\n\
    \nAlso notice the **icon** option, which can be used to specify the path to an\
    \ icon (.ico) file include for the generated executable program.\n\n## Freezing\
    \ the program\n\nApplications developed in the Python language can be frozen for\
    \ Windows, Linux, and Mac systems using the PyInstaller tool, introduced here\
    \ to create a single standalone executable file. Apps that require the inclusion\
    \ of additional files, such as image files, require the script file to be modified\
    \ so the PyInstaller tool can readily locate them at their absolute address:\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_0.png)\n\n- Open the lot.py program\
    \ file and add this utility function definition at the very start of the script\n\
    ```python\ndef resource_path(relative_path):\n    absolute_path = os.path.abspath(__file__)\n\
    \    root_path = os.path.dirname(absolute_path)\n    base_path = getattr(sys,\
    \ 'MEIPASS', root_path)\n    return os.path.join(base_path, relative_path)\n```\n\
    \n- Modify the assignment to the img variable – to identify the file's location\
    \ using the added utility function\n`img = PhotoImage(file = resource_path('logo.gif'))`\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_1.png)\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_288_2.png)\n\
    \nSave the modified file as “lucky.py” in your MyScripts folder, then open a Command\
    \ Prompt in that folder\n\nBegin a command with pyinstaller --onefile --nconsole\
    \ to instruct PyInstaller create a single file, and to prevent the program also\
    \ opening a console window\n\nContinue the command with --add-binary logo.gif;,\
    \ to include the image file in the single executable\n\nComplete the command with\
    \ the lucky.py script name – so the command now looks like that on the opposite\
    \ page\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_289_0.png)\n\nThe file attribute\
    \ is preceded by TWO _ underscore characters and followed by TWO _ underscore\
    \ characters.\n\n```\nC:\\MyScripts>pyinstaller --onefile --nconsole --add-binary\
    \ logo.gif;. lucky.py\n```\n\nWhen you are satisfied that the command is correct,\
    \ hit Enter to create the standalone executable (.exe) file\n\nPyInstaller creates\
    \ two folders named “build” and “dist” within your MyScripts folder. The standalone\
    \ executable file can be found in the “dist” folder\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_289_1.png)\n\
    \nThe executable file can be distributed to other users who do not have Python\
