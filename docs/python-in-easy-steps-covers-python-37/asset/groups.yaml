    \n| 运算符 | 操作 |\n| --- | --- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n\
    | % | 取余 |\n| // | 整除 |\n| ** | 幂 |\n\n加法、减法、乘法和除法运算符的作用符合你的预期。然而，必须使用括号对表达式进行分组。例如：\n\
    \n```python\na = b * c\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_36_0.png)\n\
    \n与运算符使用的被称为“操作数”（operands）——在表达式 2 + 3 中，数字 2 和 3 就是操作数。\n\n执行操作所需的顺序并不明确，但可以通过添加括号来澄清，如下：\n\
    \n```python\na = (b * c)\n```\n\n% 模运算符会将第一个数除以第二个数并返回操作的余数。这对于判断一个数是奇数还是偶数有用。\n\
    \n整除运算符的操作与 / 除法运算符相同，但会在小数点处截断结果——移除任何浮点部分。\n\n** 幂运算符返回第一个操作数相对于第二个操作数的幂的结果。\n\
    \n- 1. 通过初始化两个整数值的变量开始一个新的 Python 脚本\n  `a = 8`\n  `b = 2`\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_37_0.png)\n\
    \n- 2. 接下来，显示相加值的结果\n`print('Addition:\\t', a, '+', b, '=', a + b)`\n\n- 3. 现在，显示减去变量值的结果\n\
    `print('Subtraction:\\t', a, '-', b, '=', a - b)`\n\n- 4. 然后，显示相乘变量值的结果\n`print('Multiplication:\\\
    t', a, '*', b, '=', a * b)`\n\n- 5. 显示带和不带浮点值的除法结果\n`print('Division:\\t', a,\
    \ '/', b, '=', a / b)`\n`print('Floor Division:\\t', a, '//', b, '=', a // b)`\n\
    \n- 6. 接下来，显示除法后的余数\n`print('Modulo:\\t', a, '%', b, '=', a % b)`\n\n- 7. 最后，显示第一个操作数相对于第二个操作数的幂的结果\n\
    `print('Exponent:\\t', a, '**', b, '=', a ** b, sep='')`\n\n- 8. 将文件保存到你的脚本目录，然后打开命令提示符。\n\
    \n"
