    # 3


    ## Making statements


    This chapter demonstrates how statements can evaluate expressions to determine
    the direction in which a Python program proceeds.


    - Writing lists

    - Manipulating lists

    - Restricting lists

    - Associating list elements

    - Branching with if

    - Looping while while

    - Looping over items

    - Breaking out of loops

    - Summary


    ## Writing lists


    In Python programming, a variable must be assigned an initial value (initialized)
    in the statement that declares it in a program, otherwise the interpreter will
    report a “not defined” error.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_62_0.png)


    Multiple variables can be initialized with a common value in a single statement
    using a sequence of = assignments. For example, to simultaneously assign a common
    value to three variables:


    ```

    a=b=c=10

    ```


    Alternatively, multiple variables can be initialized with differing values in
    a single statement using comma separators. For example, to simultaneously assign
    different values to three variables:


    ```

    a, b, c=1, 2, 3

    ```


    Unlike regular variables, which can only store a single item of data, a Python
    “list” is a variable that can store multiple items of data. The data is stored
    sequentially in list “elements” that are indexed starting at zero. So the first
    value is stored in element zero, the second value is stored in element one, and
    so on.


    A list is created much like any other variable, but is initialized by assigning
    values as a comma-separated list between square brackets. For example, creating
    a list named “nums”, like this:


    ```

    nums=[ 0, 1, 2, 3, 4, 5]

    ```


    An individual list element can be referenced using the list name followed by square
    brackets containing that element’s index number. This means that nums[1] references
    the second element in the example above – not the first element, as element numbering
    starts at zero.


    | [0] | [1] | [2] |

    |---|---|---|---|

    | [0] | 1 | 2 | 3 |

    | [1] | 4 | 5 | 6 |


    Lists can have more than one index – represent multiple dimensions, rather than
    the single dimension of a regular list. Multi-dimensional lists of three indices
    and more are uncommon, but two-dimensional lists are useful to store grid-based
    information such as X,Y coordinates.


    A list of string values can even be considered to be a multi-dimensional list,
    as each string is itself a list of characters. So character can be referenced
    by its index number within its partition string.


    - Start a new Python script by initializing a list of three elements containing
    string values `quarter = [''January'', ''February'', ''March'']`


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_63_0.png)


    - Next, add statements to individually display the value contained in each list
    element `print(''First Month :'', quarter[0])`, `print(''Second Month :'', quarter[1])`,
    `print(''Third Month :'', quarter[2])`


    - Add a statement to create a multi-dimensional list of two elements, which themselves
    are lists that have three elements containing integer values `coords=[[1, 2, 3],
    [4, 5, 6]]`


    - Now, add statements to display the values contained in two specific inner list
    elements `print(''Top Left 0,0 :'', coords[0][0])`, `print(''Bottom Right 1,2
    :'', coords[1][2])`


    - 5. Finally, add a statement to display just one character of a string value
    `print("Second Month First Letter :", quarter[1][0])`


    - 6. Save the file in your scripts directory, then open a Command Prompt window
    and run this program – to see the list element values get displayed


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_64_0.png)


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_64_1.png)


    String indices may also be negative numbers – to start counting from the right
    where -1 references the last letter.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_64_2.png)


    Loop structures, which are introduced later in this chapter, are often used to
    iterate through list elements.


    ## Manipulating lists


    List variables, which can contain multiple items of data, are widely used in Python
    programming and have a number of “methods” that can be “dot-suffixed” to the list
    name for manipulation:


    | List Method: | Description |

    | --- | --- |

    | list.append(x) | Adds item x to the end of the list |

    | list.extend(L) | Adds all items in list L to the end of the list |

    | list.insert(i,x) | Inserts item x at index position i |

    | list.remove(x) | Removes first item x from the list |

    | list.pop(i) | Removes item at index position i and returns it |

    | list.index(x) | Returns the index position in the list of first item x |

    | list.count(x) | Returns the number of times x appears in the list |

    | list.sort() | Sort all list items, in place |

    | list.reverse() | Reverse all list items, in place |


    Python also has a useful len(L) function that returns the length of the list L
    as the total number of elements it contains. Like the index(x) and count(x) methods,
    the returned value is numeric cannot be directly concatenated to a text string
    for output.


    String representation of numeric values, however, be produced by Python’s str(n)
    function for concatenation to other strings, which returns a string version of
    the numeric n value. Similarly, a string representation of an entire list can
    be returned by the str(list) function for concatenation to other strings. In both
    cases, remember that the original version remains unchanged as the returned versions
    are merely copies of the original version.


    Individual list elements can be deleted by specifying their index number to the
    Python del(i) function. This can remove a single element at a specified i position,
    or a “slice” of elements can be removed using slice notation i:j:k to specify
    the index number of the first and last element. In this case, i is the index number
    of the first element to be removed and all elements up to, but not including,
    the element at the j index number will be removed.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_66_0.png)


    For lists that contain both numerical and string values, the sort() method returns
    the list elements sorted first numerically then alphabetically – for example as
    1,2,3,A,B,C.


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_66_1.png)


    Python also has an int(s) function that returns a numeric version of the string
    s value.


    - Start a new Python script by initializing two lists of three elements each containing
    string values

    `basket = [''Apple'', ''Bun'', ''Cola'']`

    `crate = [''Egg'', ''Fig'', ''Grape'']`


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_66_2.png)


    - Next, add statements to display the contents of the first list''s elements and
    its length

    `print(''Basket:'', basket)`

    `print(''Length:'', len(basket))`


    - Now, add statements to add an element to the first list and display all elements

    `basket.append(''Damson'')`

    `print(''Basket:'', basket)`


    - Next, add statements to remove the last item from the list and display the list

    `basket.pop()`

    `print(''Basket:'', basket)`


    - Finally, add statements to add all elements of the second list to the first
    list, then remove a slice

    `basket.extend(crate)`

    `print(''Basket:'', basket)`

    `del basket[1:3]`

    `print(''Basket:'', basket)`


    Save the file in your scripts directory, then open a Command Prompt window and
    run this program – to see the lists manipulated


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_67_0.png)


    The last index number in the slice denotes at what point to stop removing, but
    the element at that position does not get.


    ## Restricting lists


    ## Tuple

    The values in a regular list can be changed as the program proceeds (they are
    “mutable”), but a list can be created with fixed “immutable” values that cannot
    be changed by the program.

    A restrictive immutable Python list is known as a “tuple” and is created by assigning
    values as a comma-separated list between parentheses in a process known as “packing":


    ```

    colors-tuple = (''Red'', ''Green'', ''Red'', ''Blue'', ''Red'')

    ```


    An individual tuple element can be referenced using the tuple name followed by
    square brackets containing element''s index number. Usefully, all values stored
    inside a tuple can be assigned to individual variables in a process known as “unpacking":


    ```

    a, b, c, d, e = colors-tuple

    ```


    ## Set

    The values in a regular list can be repeated in its elements, as in the tuple
    above, but a list of unique values can be created where duplication is not allowed.
    A restrictive Python list of unique values is known as a “set” and is created
    by assigning values as a comma-separated list between curly brackets (braces):


    ```phonetic-set = {''Alpha'', ''Bravo'', ''Charlie''}

    ```


    Individual elements cannot be referenced using the set name followed by square
    brackets containing an index number, but instead sets have methods that can be
    dot-suffixed to the set name for manipulation and comparison:


    | Set Method: | Description |

    | --- | --- |

    | set.add(x) | Adds item x to the set |

    | set.update(x,y,z) | Adds multiple items to the set |

    | set.copy() | Returns a copy of the set |

    | set.pop() | Removes one random item from the set |

    | set.discard( x ) | Removes item x if found in the set |

    '
