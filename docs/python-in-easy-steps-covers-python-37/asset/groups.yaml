    The operators commonly used in Python are listed in the table below:\n\n| Operator\
    \ | Operation |\n| --- | --- |\n| + | Addition |\n| - | Subtraction |\n| * | Multiplication\
    \ |\n| / | Division |\n| % | Modulo |\n| // | Floor division |\n| ** | Exponent\
    \ |\n\nThe operators for addition, subtraction, multiplication, and division act\
    \ as you expect. Care must be taken, however, to group expressions with parentheses.\
    \ For example, this:\n\n```python\na = b * c\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_36_0.png)\n\
    \nValues used with operators are called \"operands\" – in the expression 2 + 3\
    \ the numerical 2 and 3 are operands.\n\nThe desired order in which the operations\
    \ should be performed is unclear but can be clarified by adding parentheses, like\
    \ this:\n\n```python\na = (b * c)\n```\n\n[37]\n\nThe % modulo operator will divide\
    \ the first number by the second number and return the remainder of the operation.\
    \ This is useful to determine if a number is odd or even.\n\nThe floor division\
    \ operator performs just like the / division operator but truncates the result\
    \ at the decimal point – removing any floating point.\n\nThe ** exponent operator\
    \ returns the result of the first operand raised to the power of the second operand.\n\
    \n- 1. Start a new Python script by initializing two variables with integer values\n\
    \  `a = 8`\n  `b = 2`\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_37_0.png)\n\n\
    - 2. Next, display the result of adding the values\n`print('Addition:\\t', a,\
    \ '+', b, '=', a + b)`\n\n- 3. Now, display the result of subtracting the variable\
    \ values\n`print('Subtraction:\\t', a, '-', b, '=', a - b)`\n\n- 4. Then, display\
    \ the result of multiplying the variable values\n`print('Multiplication:\\t',\
    \ a, '*', b, '=', a * b)`\n\n- 5. Display the result of dividing the variable\
    \ values both with and without the floating-point value\n`print('Division:\\t',\
    \ a, '/', b, '=', a / b)`\n`print('Floor Division:\\t', a, '//', b, '=', a //\
    \ b)`\n\n- 6. Next, display the remainder after dividing the values\n`print('Modulo:\\\
    t', a, '%', b, '=', a % b)`\n\n- 7. Finally, display the result of raising the\
    \ first operand to the power of the second operand\n`print('Exponent:\\t', a,\
    \ '**', b, '=', a ** b, sep='')`\n\n- 8. Save the file in your scripts directory,\
    \ then open a Command Prompt\n"
