    \ has this syntax:\n\n```\n(test-expression) ? if-true-return : if-false-return\n\
    ```\n\nUnlike other programming languages, Python does not have a ?: ternary operator\
    \ but has instead a \"conditional expression\" that works in a similar way using\
    \ if and else keywords with this syntax:\n\n```\nif-true-return-this else if-false-return-this\n\
    ```\n\nAlthough the conditional expression syntax can initially appear confusing,\
    \ it is well worth familiarizing with this as it can execute powerful program\
    \ branching with minimal code. For example, to branch a variable is not a value\
    \ of one:\n\n```\nif-true-do-this if (var != 1) else if-false-do-this\n```\n\n\
    The conditional expression can be used in Python programming to assign the maximum\
    \ or minimum value of two variables to a third variable. For example, to assign\
    \ a minimum like this:\n\n```\nc = a if (a < b) else b\n```\n\nThe expression\
    \ in parentheses returns True when the value of variable a is less than that of\
    \ variable b – so in this case the lesser value of variable a gets assigned to\
    \ variable c.\n\nSimilarly, replacing the < less than operator in the test expression\
    \ with the > greater operator would assign the greater value of variable b to\
    \ variable c.\n\nAnother common use of the conditional expression incorporates\
    \ the % modulo operator in the test expression to determine if the value of a\
    \ variable is an odd number or an even number:\n\n```\nif-true(odd)-do-this if\
    \ (var % 2 != 0) else if-false(even)-do-this\n```\n\nWhere the result of dividing\
    \ the variable value by two does leave a remainder, the number is odd – where\
    \ there is no remainder, the number is even. The test expression ( var % 2 ==\
    \ 1 ) would have the same effect but it is preferable to test for inequality –\
    \ it’s easier to spot something is different than when it’s identical.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_49_0.png)\n\
    \nIn general programming terms an “expression” always returns a value whereas\
    \ “statement” need not – but a statement may include one or more expressions.\n\
    \nThe conditional expression has in effect three operands – the test expression\
    \ and two possible return values.\n\n-   1 Start a new Python script by initializing\
    \ two variables with integer values for conditional evaluation\n\n```\na = 1\n\
    b = 2\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_49_2.png)\n\ncondition.py\n\
    \n-   2 Next, add statements to display the results of conditional evaluation\
