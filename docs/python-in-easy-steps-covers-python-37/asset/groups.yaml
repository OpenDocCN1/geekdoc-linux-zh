    \ [0 : 4] |\n| in | 成员性（包含）– 如果字符存在于字符串中则返回 True | 'H' in 'Hello' |\n| not in\
    \ | 成员性（不包含）– 如果字符不在字符串中则返回 True | 'h' not in 'Hello' |\n| r/R | 原始字符串 – 抑制转义字符的含义\
    \ | print(r'\\n') |\n| \"\"\" | 文档字符串 (Docstring) – 描述模块、函数、类或方法 | def sum(a,\
    \ b): \"\"\" 添加参数 \"\"\" |\n\n`[]` 切片运算符和 `[:]` 切片运算符将字符串识别为包含每个列表元素单个字符的列表，可以通过索引编号进行引用。\n\
    \n成员运算符执行区分大小写的匹配，因此 ‘A’ in ‘abc’ 将失败。\n\n同样，`in` 和 `not in` 成员运算符会遍历每个元素，寻找匹配指定的字符。\n\
    \n原始字符串运算符 `r`（或大写的 `R`）必须置于起始引号之前，以抑制字符串中的转义字符，这在字符串包含反斜杠字符时非常有用。\n\n“文档字符串”（docstring）是一种描述性字符串字面量，作为模块、函数、类或方法定义中的第一个语句出现。它应该包含在三个单引号内。其独特之处在于，文档字符串变成了该对象的\
    \ `__doc__` 特殊属性，因此可以使用名称和点后缀进行引用。所有模块通常都具有文档字符串，模块导出的所有函数和类也应该具有文档字符串。\n\n范围切片返回到最后一个指定索引之前但不包含它的字符串。\n\
    \nmanipulate.py\n\n1. 通过定义一个包含文档字符串的简单函数来启动一个新的 Python 脚本：\n```python\ndef display(s):\n\
    \    \"\"\"显示一个参数.\"\"\"\n    print(s)\n```\n2. 接下来，添加一个语句显示函数描述：\n```python\n\
    display(__doc__)\n```\n3. 现在，添加一个语句显示包含反斜杠的原始字符串值：\n```python\ndisplay(r'C:\\\
    Program Files')\n```\n4. 然后，添加一个语句显示包含转义字符和空格的两个字符串值的拼接：\n```python\ndisplay('\\\
    nHello ' + ' Python')\n```\n5. 接下来，添加一个语句显示指定索引范围内指定字符串的切片：\n```python\ndisplay('Python\
    \ Easy Steps\\n'[0:7])\n```\n6. 最后，显示在指定字符串中查找字符的结果：\n```python\ndisplay('P' in\
    \ 'Python')\ndisplay('p' in 'Python')\n```\n7. 将文件保存到你的脚本，然后在那里打开命令提示符并运行此程序 –\
    \ 查看显示的操作后的字符串。\n\n`__doc__` 关键字前面有两个下划线，后面有两个下划线。\n\n记住字符串必须包含在单引号或双引号内。\n\n\
    在范围切片中，如果省略了起始索引数字，则假设为 0；如果省略了结束索引数字，则假设为字符串长度。\n\n# 格式化字符串\n\nPython 内置函数 `dir()`\
    \ 非常有用，通过在它的括号内指定模块名，可以检查模块中定义的函数和变量名称。在调用 `dir()` 函数之前导入模块名，可以轻松地使用交互模式实现此目的。下面的示例检查了在本章中创建的“dog”模块：\n\
    \n```\nC:\\Scripts>python\nPython 3.7.0\n>>> import dog\n>>> for i in dir(dog):\n\
    ...     print(i)\n...\n__builtins__\n__cached__\n__doc__\n__file__\n__loader__\n\
    __name__\n__package__\n__spec__\nbark\nmap\n```\n\n以双下划线开头和结尾定义的名称是 Python 对象，而其他是程序员定义的。可以使用\
    \ `dir()` 函数检查 `__builtins__` 模块，以检查默认定义的函数和变量，例如 `print()` 函数和 str 对象。\n\n`str`\
    \ 对象定义了几个用于字符串格式化的有用方法，包括一个执行替换的实际 `format()` 方法。由 `format()` 方法格式化的字符串可以同时包含文本和“替换字段”，这些标记标记从有序的逗号分隔值列表中插入文本的位置。每个替换字段由\
    \ `{}` 表示，它可能可选包含替换项在列表中的索引数字位置。\n\n字符串也可以使用 C 样式的 `%s` 替换运算符进行格式化，以标记字符串中用于从逗号分隔值列表中插入文本的位置。\n\
    \n注意，上一个示例中引入的 `__doc__` 属性出现在 `dir()` 函数的列表中。\n\n不要将此处描述的 `str` 对象与将值转换为字符串数据类型的\
    \ `str()` 函数混淆。\n\n1. 通过用格式化字符串初始化变量来启动一个新的 Python 脚本：\n```python\nsnack = '{0}\
    \ and {1}'.format('Burger', 'Fries')\n```\n2. 接下来，显示变量值以查看按顺序替换的文本：\n```python\n\
    print('\\nReplaced:', snack)\n```\n3. 现在，将一个不同格式的字符串赋值给变量：\n```python\nsnack =\
    \ '{1} and {0}'.format('Burger', 'Fries')\n```\n4. 然后，再次显示变量值以查看按指定的索引元素值替换的文本：\n\
    ```python\nprint('Replaced:', snack)\n```\n5. 将另一个格式化字符串赋值给变量：\n```python\nsnack\
    \ = '%s and %s' % ('Milk', 'Cookies')\n```\n6. 最后再次显示变量值以查看按顺序替换的文本：\n```python\n\
    print('Substituted:', snack\n```\n7. 将文件保存到脚本目录，然后在那里打开命令提示符并运行此程序 – 查看格式化后的字符串：\n\
    ```\nC:\\Scripts>python format.py\nReplaced: Burger and Fries\nReplaced: Fries\
    \ and Burger\nSubstituted: Milk and Cookies\n```\n\n其他数据类型可以使用 `%d` 表示整数、`%c`\
    \ 表示字符以及 `%f` 表示浮点数进行替换。\n\n# 修改字符串\n\n`str` 对象具有许多有用方法，可以通过后缀于其名称来修改字符串并检查其内容。常用的字符串修改方法列在下表中，并附有简短描述：\n\
    \n| 方法 | 描述 |\n|---|---|\n| capitalize() | 将字符串的首字母改为大写 |\n| title() | 将所有首字母改为大写\
    \ |\n| upper() lower() swapcase() | 分别将所有字母改为大写、小写或当前大小的反反 |\n| join(seq) | 使用分隔符合并字符串\
    \ seq |\n| lstrip() rstrip() strip() | 分别删除领先空白、尾部空白或两侧空白 |\n| replace( old ,\
    \ new ) | 将所有的 old 替换为 new |\n| ljust(w, c) rjust(w, c) | 分别使用字符 c 向右或向左填充字符串达到总宽度\n\
    | center(w, c) | 使用字符 c 在字符串两侧达到总宽度（默认是空格） |\n| count(sub) | 返回 sub 出现的次数 |\n\
    | find(sub) | 返回 sub 首次出现的索引编号，如果未找到则返回 -1 |\n| startswith(sub) endswith(sub)\
    \ | 如果 sub 在开头或结尾则返回 True – 否则返回 False |\n| isalpha() isnumeric() isalnum() |\
    \ 如果所有字符仅字母、仅数字或仅字母和数字则返回 True – 否则返回 False |\n| islower() upper() istitle() |\
    \ 如果字符串字符为小写、大写或所有首字母为大写则返回 True – 否则返回 False |\n| isspace() | 如果字符串仅包含空白字符则返回\
    \ True – 否则返回 False |\n\n"
