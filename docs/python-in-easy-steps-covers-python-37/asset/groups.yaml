    ## 使用变量


    在编程中，“变量”是计算机内存中的一个容器，可以在其中存储一个数据值。然后可以使用变量名来引用存储的值。程序员可以为变量选择任何名称，但书中内封页列出的 Python
    关键字除外，且选择反映变量内容的有意义名称是一个良好的习惯。


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_24_0.png)


    要存储在变量中的数据在 Python 程序的声明语句中通过 `=` 赋值运算符进行赋值。例如，要将数字值存储在名为 "a" 的变量中：


    ```

    a = 8

    ```


    然后可以使用变量名来引用存储的值，因此语句 `print(a)` 将输出存储的值 8。该变量随后可以被赋予不同的值，因此它的值可以随着程序的运行而变化——这就是“变量”一词的由来。


    在 Python 编程中，必须在程序中声明变量的语句中赋予其初始值（初始化），否则解释器将报告“未定义”（not defined）错误。


    可以在单个语句中使用一系列 `=` 赋值为多个变量初始化共同的值。例如，初始化名为 "a"、"b" 和 "c" 的变量，每个变量的数值均为八，如下：


    ```

    a = b = c = 8

    ```


    或者，可以使用逗号分隔符在单个语句中使用不同的值初始化多个变量。例如，初始化名为 "a"、"b" 和 "c" 的变量，数值值分别为一、二、三，如下：


    **a, b, c=1, 2, 3**


    某些编程语言（如 Java）要求你在声明时指定变量可能包含的数据类型。这预留了特定数量的内存空间被称为“静态类型”。相比之下，Python 变量没有这种限制，并调整内存分配以适应分配给变量的各种数据值（“动态类型”）。这意味着它们根据需要存储整数、浮点数、文本字符串或
    True 或 False 的布尔值。


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_25_0.png)


    字符串数据必须封装在引号内以表示字符串的开始和结束。


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_25_1.png)


    要求指定变量类型的编程语言被称为“强类型”（strongly typed），而不需要指定的语言则被称为“弱类型”（loosely typed）。


    可选地，可以在 Python 脚本中添加注释，用 `#` 哈希字符来描述语句或代码段的目的。`#` 哈希字符之后到行尾的所有内容都会被 Python 解释器忽略。注释你的代码对于明确其目的非常有用。


    - 启动纯文本编辑器，声明并初始化一个变量以显示值


    ```python

    # 初始化一个整数变量

    var = 8

    ```


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_26_0.png)


    接下来，为变量赋值一个浮点数


    ```python

    # 初始化一个浮点数变量

    var = 3.14

    ```


    现在，为变量赋值一个字符串值


    ```python

    # 初始化一个字符串变量

    var = ''Python''

    ```


    最后，为变量赋值一个布尔值


    ```python

    # 初始化一个布尔值变量

    var = True

    ```


    将文件保存到你的目录，然后打开终端窗口并运行程序以查看输出的值


    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_26_1.png)


