  mdcn: "\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_46_0.png)\n\n“布尔”（Boolean）一词是指英国数学家乔治·布尔（George\
    \ Boole，1815-1864）开发的一种逻辑思维系统。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_46_1.png)\n\
    \n-   通过初始化两个布尔值的变量来启动一个新的 Python 脚本进行逻辑评估\n a = True\n b = False\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_46_2.png)\n\
    \n-   接下来，添加语句来显示逻辑与（AND）评估的结果\n print('AND Logic:')\n print('a and a =', a and\
    \ a)\n print('a and b =', a and b)\n print('b and b =', b and b)\n\n-   现在，添加语句来显示逻辑或（OR）评估的结果\n\
    \ print('OR Logic:')\n print('a or a =', a or a)\n print('a or b =', a or b)\n\
    \ print('b or b =', b or b)\n\n-   最后，添加语句来显示逻辑非（NOT）评估的结果\n print('\\nNOT Logic:')\n\
    \ print('a =', a, '\\tnot a =', not a)\n\n```\nprint(' b = ', 'b, \\tnot b =',\
    \ not b )\n```\n\n5. 将文件保存到你的脚本目录，然后在该处打开命令提示符窗口并运行此程序——查看逻辑操作的结果\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_47_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_47_1.png)\n\n在 Python 编程中，布尔值也可以用数字表示，其中\
    \ True 为 1，False 为 0（零）。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_47_2.png)\n\
    \n注意，表达式 False and False 返回 False 而不是 True —— 这或许证明了格句“两个错的不能出一个对的”。\n\n# 检查条件\n\
    \n许多编程语言（如 C++ 或 Java）都有一个 `?:` “三元”运算符，它会对一个表达式进行真或假判断进行评估，然后根据评估结果返回两个指定值之一。`?:`\
    \ 三元运算符的语法如下：\n\n```\n(test-expression) ? if-true-return : if-false-return\n```\n\
    \n与其他编程语言不同，Python 并没有 `?:` 三元运算符，而是使用了一种“条件表达式”，它通过使用 `if` 和 `else` 关键字以类似的方式工作，语法如下：\n\
    \n```\nif-true-return-this else if-false-return-this\n```\n\n虽然条件表达式的语法最初看起来可能很困惑，但非常值得熟悉，因为它可以用最少的代码执行强大的程序分支。例如，根据变量值是否不等于\
    \ 1 来进行分支：\n\n```\nif-true-do-this if (var != 1) else if-false-do-this\n```\n\n\
    条件表达式可以用于 Python 编程，将两个变量的最大值或最小值赋值给第三个变量。例如，这样赋值一个最小值：\n\n```\nc = a if (a <\
    \ b) else b\n```\n\n当变量 a 的值小于变量 b 的值时，括号中的表达式返回 True —— 因此，在这种情况下，变量 a 的较小值被赋值给变量\
    \ c。\n\n同样地，将测试表达式中的 `<` 小于运算符替换为 `>` 大于运算符，会将变量 b 的较大值赋值给变量 c。\n\n条件表达式的另一个常见用法是在测试表达式中使用\
    \ `%` 取模运算符，来判断变量的值是奇数还是偶数：\n\n```\nif-true(odd)-do-this if (var % 2 != 0) else\
    \ if-false(even)-do-this\n```\n\n变量值除以二如果有余数，则为奇数——如果没有余数，则为偶数。测试表达式 `var % 2\
    \ == 1` 效果相同，但测试不相等性比测试相等更容易发现某处不同。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_49_0.png)\n\
    \n在通用术语中，“表达式”（expression）始终返回一个值，而“语句”（statement）则不需要——语句可以包含一个或多个表达式。表达式包含三个操作数——测试表达式和两个返回值。\n\
    \n-   1 通过初始化两个整数值的变量启动一个新的 Python 脚本\n```\na = 1\nb = 2\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_49_2.png)\n\
    \ncondition.py\n\n-   2 接下来，添加语句显示条件评估的结果——描述第一个变量的值\n```\nprint('\\nVariable\
    \ a Is : ', 'One' if ( a == 1 ) else 'Not One')\nprint('Variable a Is : ', 'Even'\
    \ if ( a % 2 == 0 ) else 'Odd')\n```\n\n-   3 现在，添加语句显示条件评估的结果——描述第二个变量的值\n```\n\
    print('\\nVariable b Is : ', 'One' if ( b == 1 ) else 'Not One')\nprint('Variable\
    \ b Is : ', 'Even' if ( b % 2 == 0 ) else 'Odd')\n```\n\n-   然后，添加一个语句将条件评估的结果赋值给新变量\n\
    `max = a if (a > b ) else b`\n\n-   最后，添加一个语句显示结果——识别两个变量中的较大值\n`print('Greater\
    \ Value Is:', max)`\n\n-   将文件保存到你的脚本目录，然后打开命令提示符窗口并运行此程序——查看条件表达式的操作结果\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_50_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_50_1.png)\n\n你可能会发现某些程序员不喜欢条件表达式，因为他们认为其语法违反了易读性原则。\n\
    \n# 设置优先级\n\n运算符优先级决定 Python 解释器评估表达式的顺序。例如，在表达式 `3 * 8 + 4` 中，默认优先级决定先完成乘法，因此结果为\
    \ 28 (24+4)。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_51_0.png)\n\n`*` 乘法运算符的优先级高于\
    \ `+` 加法运算符——所以在表达式 `3 * 8 + 4` 中，乘法先加法完成。\n\n下表列出了运算符优先级——中间行的优先级最高，较低行的优先级依次降低。同一行运算符的优先级从左到右链接。\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| ** | 幂 |\n| * | 乘法 |\n| / | 除法 |\n| // | 整除\
    \ |\n| % | 取模 |\n| + | 加法 |\n| - | 减法 |\n| == | 比较 |\n| != | 比较 |\n| > | 比较 |\n\
    | >= | 比较 |\n| < | 比较 |\n| <= | 比较 |\n| = | 赋值 |\n| & | 按位与 |\n| \\| | 按位或 |\n\
    | ^ | 按位异异 |\n| ~ | 按位非 |\n| >> | 按位右移 |\n| << | 按位左移 |\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_52_0.png)\n\
    \n按位运算符、身份运算符和成员运算符将在本书后面介绍——但为了完整性包含在此处。\n\n-   通过初始化三个变量进行优先级比较启动一个新的 Python\
    \ 脚本\n```\na = 2\nb = 4\nc = 8\n```\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_52_1.png)\n\
    \n-   接下来，添加语句显示默认优先级的结果并强制加法先于乘法\n```python\nprint(\"\\nDefault Order:\", a *\
    \ c + b)\nprint(\"Forced Order:\", a * (c + b))\n```\n\nprecedence.py\n\n-   现在，添加语句显示默认优先级的结果并强制减法\n\
    ```python\nprint(\"\\nDefault Order:\", c // b - a)\nprint(\"Forced Order:\",\
    \ c // (b - a))\n```\n\n-   最后，添加语句显示默认优先级的结果，并现在取模运算和幂运算之前执行加法\n```python\nprint(\"\
    \\nDefault Order:\", c % a + b)\nprint(\"Forced Order:\", c % (a + b))\n\nprint(\"\
    \\nDefault Order:\", c ** a + b)\nprint(\"Forced Order:\", c ** (a + b))\n```\n\
    \n将文件保存到你的脚本目录，然后打开命令提示符窗口并运行此程序——查看默认和显式优先级的结果\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_53_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_53_1.png)\n\n// 整除运算符会截断浮点值的小数部分——但\
    \ / 除法运算符会保留它们。\n\n不要依赖默认优先级——始终使用括号来明确你的表达式。\n\n"
