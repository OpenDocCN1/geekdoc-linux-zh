- md: "\n## Casting data types\n\nAlthough Python variables can store data of any\
    \ data type, it is important to recognize the different types of data they contain\
    \ to avoid errors when manipulating that data in a program. There are several\
    \ Python data types by far the most common ones str (string), int (integer), and\
    \ float (floating-point).\n\nData type recognition is especially important when\
    \ assigning numeric data to variables from user input as it is stored by default\
    \ as a str (string) data type. String values cannot be used for arithmetic expressions\
    \ as attempting to add string values together simply concatenates (joins) the\
    \ values rather than adding them numerically. For example '8' + '4' = '84'.\n\n\
    Fortunately, the data type of stored values can be easily converted (“cast”) into\
    \ a different data type using built-in Python functions. The value to be converted\
    \ is specified within the parameters that follow the function name. Casting str\
    \ (string) to become int (integer) values allows them to be used for arithmetic\
    \ expressions, for example, 8 + 4 = 12.\n\nPython's built-in data conversion functions\
    \ return a new object representing the converted value, and those conversion functions\
    \ most frequently used are listed in the table below:\n\n| Function | Description\
    \ |\n| :--- | :--- |\n| int( x ) | Converts x to an integer whole number |\n|\
    \ float( x ) | Converts x to a floating-point number |\n| str( x ) | Converts\
    \ x to a string representation |\n| chr( x ) | Converts integer x to a character\
    \ |\n| unichr( x ) | Converts integer x to a Unicode |\n| ord( x ) | Converts\
    \ character x to its integer value |\n| hex( x ) | Converts integer x to a hexadecimal\
    \ string |\n| oct( x ) | Converts integer to an octal string |\n\nThe Python built-in\
    \ type() function can be used to determine which data type class the value contained\
    \ in a variable belongs, simply by specifying that variable’s name within its\
    \ parentheses.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_55_0.png)\n\nConverting\
    \ a float (floating-point) data type to an int (integer) data type will truncate\
    \ the number at the decimal point losing the fraction.\n\n- Start a new Python\
    \ script by initializing two variables with numeric values from user input\n \
    \ `a = input('Enter A Number: ')`\n  `b = input('New Enter Another Number: ')`\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_55_1.png)\n\n- Next, add statements\
    \ to add the variable values together then display the combined result and its\
    \ data type – to see a concatenated string value result\n  `sum = a + b`\n  `print('Data\
    \ Type sum: ', sum, type(sum) )`\n\n- Now, add statements to add variable values\
    \ together then display the result and its data type – to see a total integer\
    \ value result\n  `sum = int(a) + int(b)`\n  `print('Data Type sum: ', sum, type(sum)\
    \ )`\n\n- Then, add statements to cast a variable value then display the result\
    \ and its data type – to see a total float value\n  `sum = float(sum)`\n  `print('Data\
    \ Type sum: ', sum, type(sum) )`\n\n- Finally, add statements to cast an integer\
    \ representation of a variable value then display the result and its data type\
    \ – to see a character string value\n  `sum = chr(int(sum) )`\n\n```python\nprint('\
    \ Data Type sum : ', sum, type(sum) ))\n```\n\n6 Save the file in your scripts\
    \ directory, then open a Command Prompt window and run this program – to see the\
    \ result of casting as various data types\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_56_0.png)\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_56_1.png)\n\nThe number 65 is the ASCII\
    \ character code for uppercase letter A.\n\n## Manipulating bits\n\nIn computer\
    \ terms, each byte comprises eight bits that can each contain a 1 or a 0 to store\
    \ a binary number, representing decimal values from 0 to 255. Each bit contributes\
    \ a decimal component only when that contains a 1. Components are designated right-to-left\
    \ from the “Least Significant Bit” (LSB) to the “Most Significant Bit” (MSB).\
    \ The binary number in the bit pattern below is 0110010 and represents the decimal\
    \ number 50(2+16+32):\n\n| Bit No. | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Decimal |\
    \ 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| Binary | 0 | 0 | 1 | 1 | 0 | 0 | 1 |\
    \ 0 |\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_57_0.png)\n\nMany Python programmers\
    \ never use bitwise operators but it is useful to understand what they are and\
    \ how they may be used.\n\nIt is possible to manipulate individual parts of a\
    \ byte using the Python “bitwise” operators listed and described below:\n\n| Operator\
    \ | Name | Description |\n| :--- | :--- | :--- |\n| \\|\\| | OR | Return 1 if\
    \ either bit is 1 |\n| & | AND | Return 1 if both bits are 1 |\n| ~ | NOT | Return\
    \ 1 if neither bit is 1 |\n| ^ | XOR | Return 1 if only one bit is 1 |\n| << |\
    \ Shift left | Move the bit values a specified number of bits to the left |\n\
