  - "[PAGE 91]\n\n# Understanding scope\n\nPrevious examples in this book have used\
    \ built-in functions of the Python programming language, such as the `print()`\
    \ function. However, most Python programs contain a number of custom functions\
    \ that can be called as required when the program runs.\n\nA custom function is\
    \ created using the `def` (definition) keyword followed by a name of your choice\
    \ and `()` parentheses. The programmer can choose any name for a function except\
    \ the Python keywords listed on the inside front cover of this book, and the name\
    \ of an existing built-in function. This line must end with a : colon character,\
    \ then the statements to be executed whenever the function gets called must appear\
    \ below and be indented. Syntax of a function definition, therefore, looks like\
    \ this:\n\n```\ndef function-name ():\n    statements-to-be-executed\n    statements-to-be-executed\n\
    ```\n\nOnce the functions have been created, program flow resumes at the point\
    \ directly following the function call. This modularity is very useful in Python\
    \ programming to isolate set routines so they can be called upon repeated.\n\n\
    To create custom functions it is necessary to understand the accessibility (“scope”)\
    \ of variables in a program:\n\n+   * Variables created outside functions can\
    \ be referenced by statements inside functions – they have “global” scope.\n\n\
    +   * Variables created inside functions cannot be referenced from outside the\
    \ function in which they have been created – these have “local” scope.\n\nThe\
    \ limited accessibility of local variables means that variables of the same name\
    \ can appear in different functions without conflict.\n\nIf you want to coerce\
    \ a local variable to make it accessible elsewhere, it must first be declared\
    \ with the Python `global` keyword followed by its name only. It may subsequently\
    \ be assigned a value that can be referenced from anywhere in"
  - "[PAGE 92]\n\nthe program. Where a global variable and a local variable have the\
    \ same name, the function will use the local version.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_92_0.png)\n\
    \nFunction statements must be indented from the definition line by the same amount\
    \ so the Python interpreter can recognize the block.\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_92_1.png)\n\
    \nAvoid using global variables in order to prevent accidental conflict – use only\
    \ local variables where possible.\n\n+   - Start a new Python script by initializing\
    \ a global variable\nglobal_var = 1\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_92_2.png)\n\
    \nscope.py\n\n+   - Next, create a function named \"my_vars\" to display the value\
    \ contained within the global variable\ndef my_vars():\n    print('Global Variable:',\
    \ global_var )\n\n+   - Now, add indented statements to the function block to\
    \ initialize a local variable and display the value it contains\nlocal_var = 2\n\
    \    print('Local variable:', local_var )\n\n+   - Then, add indented statements\
    \ to the function block to create a coerced global variable and assign an inner\
    \ value\nglobal inner_var\ninner_var = 3"
