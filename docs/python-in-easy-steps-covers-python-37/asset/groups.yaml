    ![](img/4d3471d9d7885aa6ac413c9170a3fa2e_10_0.png)


    Programming languages that group blocks by indentation are said to adhere to the
    “offside rule” – a pun on the offside rule in soccer.


    Some of Python’s key distinguishing features that make it an attractive choice
    of language for the beginner include:


    +   - **Python is free** – is open source distributable software.


    +   - **Python is easy to learn** – has a simple language syntax.


    +   - **Python is easy to read** – is uncluttered by punctuation.


    +   - **Python is easy to maintain** – is modular for simplicity.


    +   - **Python is “batteries included”** – provides a large standard library for
    easy integration into your own programs.


    +   - **Python is interactive** – has a terminal for debugging and testing snippets
    of code.


    +   - **Python is portable** – runs on a wide variety of hardware platforms and
    has the same interface on all platforms.


    +   - **Python is interpreted** – there is no compilation required.


    +   - **Python is high-level** – has automatic memory management.


    +   - **Python is extensible** – allows the addition of low-level modules to the'
- md: '

    interpreter for customization.


    - **Python is versatile** – supports both procedure-oriented programming and object-oriented
    programming (OOP).

    - **Python is flexible** – can create console programs, windowed GUI (Graphical
    User Interface) applications, and CGI (Common Gateway Interface) scripts to process
    web data.


    Python is named after the British television comedy series “Monty Python’s Flying
    Circus” – you may encounter references to this in the Python documentation.


    As development of Python continues, newer versions are released as with most software.
    Currently, the final 2.7 version is out, with a statement of extended support
    for this end-of-life release. The 2.x branch will see no new major releases after
    that.


    The 3.x branch is under active development and has already seen several stable
    releases. This means that all recent standard library improvements, for example,
    are only available in Python 3.x. This book describes and demonstrates features
    of the present and the future of Python with the latest 3.x version.


    Python 3.x is not backward compatible with Python 2.7.


    # Installing Python on Windows


    Before you can begin programming in the Python language you need to install the
    Python interpreter on your computer, and the standard library of tested code comes
    along with it. This is available online as a free download from the Python website
    at https://python.org/downloads. For Windows users there are installers available
    in both 32-bit and 64-bit versions: Installers for macOS X in 32-bit and 64-bit
    versions are available at python.org/downloads.


    1. Launch a web browser, then navigate to python.org/downloads and download the
    appropriate installer for your system – in this example it''s a file named "python-3.7.0.exe".

    2. When the download completes, run the installer and check the “Add Python 3.7
    to PATH” option.

    3. Next, click the “Customize installation” option. Check all “Optional Features”
    options, then click Next. Be sure to check the option to install “pip” so you
    can easily install packages later.

    5. Now, change the lengthy installation location to a more simple location of
    “C:\Python37”. Accept the suggested features in Advanced Options dialog – as illustrated
    here.

    6. Click on Install to begin copying files onto your PC, then click the Close
    button to complete the installation.

    7. To confirm Python is now available, launch a Command Prompt window (run cmd.exe)
    and precisely enter the command python -V – the Python interpreter should respond
    with its version number.


    The letter V in the command must be uppercase. Ensure the command responds with
    the version number before proceeding to the examples in this book.


    # Installing Python on Linux


    Linux distributions will, typically, include Python but generally have the 2.7
    version as their default. For development on the 3.x branch of Python releases
    you will probably have to install the latest release alongside the default version.
    Consult your Linux distro’s documentation for further help on installing Python.


    - Launch a terminal window and precisely enter this command to reveal the installed
    default version python -v

    ```

    mike@ubuntu:~ ~

    mike@ubuntu:-$ python -V

    Python 2.7.3

    mike@ubuntu:-$

    ```

    - Next, precisely enter this command to reveal the default version of Python 3.x
    branch, if any is installed python3 -v

    ```

    mike@ubuntu:~ ~

    mike@ubuntu:-$ python3 -V

    Python 3.2.3

    mike@ubuntu:-$

    ```

    - Now, launch your Linux system’s package manager to see if a later Python version
    is available for installation – for example use the Software Center on Ubuntu
    systems. Don''t remove the default 2.7 version of Python from your system in case
    some applications depend upon it.

    4. Search for "python" in the package manager to see what Python versions and
    components are installed, or if later versions are available for installation.

    5. Finally, install the latest version of the Python 3.x branch for Linux – in
    this case it''s Python 3.5.

    6. To confirm the latest version of Python is now available on your computer launch
    a Terminal window and precisely enter this command python3 -V

    ```

    mike@ubuntu: ~

    mike@ubuntu:-$ python3 -V

    Python 3.5.2

    mike@ubuntu:-$

    ```

    You may also, optionally, install IDLE for Python 3.5, but this is not an absolute
    requirement as the programming examples in this book are all created in a plain
    text editor such as Nano. You can now use the command python3 to have that version
    of the Python interpreter process your programs.


    # Meeting the interpreter


    The Python interpreter processes text-based program code, and also has an interactive
    mode where you can test snippets of code and is useful for debugging code. Python’s
    interactive mode can be entered in number of ways:


    - From a regular Command Prompt – simply enter the command python to produce the
    Python prompt where you can interact with the interpreter.

    - From the Start Menu – choose “Python” (command line) to open a window containing
    the Python prompt.

    - From the Start Menu – choose “IDLE” (Python GUI) to launch a Shell window containing
    the Python prompt.


    Irrespective of the method used to enter interactive mode, the Python interpreter
    will respond in the same way entered at its prompt. In its simplest form, the
    interpreter can be used as a calculator.


    - Enter Python interactive mode, using any method outlined, then type a simple
    addition and hit Return to see the interpreter print out the sum

    ```

    Python 3.7 (32-bit) [MSC v.1914 32 bit (Intel)] on win32

    >>> 8 + 4

    12

    >>>

    ```

    The Python interpreter also understands expressions, so parentheses can be used
    to give higher precedence – the part of the expression enclosed within parentheses
    will be calculated first.


    - Next, at the Python prompt enter an expression with three components without
    specifying any precedence order

    - Now, at the Python prompt enter the same expression but add parentheses to specify
    precedence order.


    Spaces in expressions are ignored, so 8+4 can also be entered with added spaces
    for clarity – as illustrated here.


    Interactive mode is mostly used to test snippets of code and for debugging code.
    “IDLE” is an acronym for Python’s Integrated Development Environment, but has
    limited features so is not used to demonstrate examples in this book.


    # Writing your first program


    Python’s interactive mode is useful as a simple calculator, but you can create
    programs for more extensive functionality. A Python program is simply a plain
    text file script created with an editor, such as Windows’ Notepad, that has been
    saved with a “.py” extension. Python programs can be executed by stating the script
    file name after the python command at a terminal prompt.


    The traditional first program to create when learning any programming language
    simply prints out a specified greeting message. In Python, the print() function
    is used to specify the message within its parentheses. This must be a string of
    characters enclosed between quote marks. These may be “ ” double quote marks or
    ‘ ’ single quote marks – but not a mixture of both.


    - On Windows, launch any plain text editor such as the Notepad application.

    - Next, precisely type the following statement into the empty text editor window

    ```python

    print(''Hello World!'')

    ```

    - Now, create a new directory at c:\MyScripts and save the file in it as hello.py

    ```

    hello.py - Notepad

    File Edit Format View Help

    print(''Hello World!'')

    ```

    - Finally, launch a Command Prompt window, navigate to the new directory and precisely
    enter the command python hello.py – to see the Python interpreter run your program
    and print out the specified greeting

