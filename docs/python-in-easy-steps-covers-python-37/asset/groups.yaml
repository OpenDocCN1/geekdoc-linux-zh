    ## 封装数据\n\n“类”（class）是一个指定的原型，描述了刻画对象的一组属性。每个类都有一个数据结构，其中可以包含函数和变量，用于描述该对象。\n\n\
    类的属性被称为它的数据“成员”（members）。类函数成员被称为“方法”（methods），而类变量成员（在类结构内部但在任何方法定义之外声明）被称为它的“属性”（attributes）。\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_176_0.png)\n\n类成员可以在整个程序中使用点符号法（dot\
    \ notation）引用，在类名后加上成员名，语法为 `class-name.method-name()` 或 `class-name.attribute-name`。\n\
    \n类声明以 `class` 关键字开始，随后是程序员指定的名称（遵循通常的 Python 命名规范但大大写开头），然后是一个冒号 `:`。接下来是缩进的语句，可选地指定类文档字符串、类变量属性声明和类方法定义——因此类块的语法如下：\n\
    \n```python\nclass ClassName :\n    \"\"\"class-documentation-string\"\"\"\n \
    \   class-variable-declarations\n    class-method-definitions\n```\n\n类声明指定了它的属性和方法，它是蓝图，可以从此创建工作的副本（“实例”\
    \ instances）。\n\n所有在方法定义内部声明的变量被称为“实例”（instance）变量，并且仅在声明它们的方法内部局部可用——它们不能在类结构之外直接引用。\n\
    \n通常，实例变量包含调用者在创建类的实例副本时传递的数据。由于这些数据仅在本地供内部使用，因此它们实际上对程序的其余部分是隐藏的。这种数据“封装”（encapsulation）技术确保了数据安全地存储在类结构中，它是面向对象编程（OOP）的第一原则。\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_177_0.png)\n\n类名以大写字母开头、对象名以小写字母开头是常规。\n\
    \n类的所有属性都通过点符号前缀 `self` 在内部引用——因此属性“sound”是 `self.sound`。此外，类中的所有方法定义必须将 `self`\
    \ 作为第一个参数——因此一个名为“talk”的方法是 `talk(self)`。\n\n当类实例被创建时，会自动调用一个特殊的 `__init__(self)`\
    \ 方法。可以在这些括号中添加后续参数。\n\n一个完整的类声明可能像这个示例所示：\n\n```python\nclass Critter:\n    \"\
    \"\"A base class for all critters.\"\"\"\n    count = 0\n    def __init__(self,\
    \ chat):\n        self.sound = chat\n        Critter.count += 1\n\n    def talk(self):\n\
    \        return self.sound\n```\n\n检查此类的组成部分是有用的：\n\n- 变量 `count` 是类变量，其整数值在所有实例之间共享——在类内部或外部都可以作为\
    \ `Critter.count` 被引用。\n- 第一个 `__init__` 方法是初始化方法，在创建类的实例时自动调用。\n- 在这种情况下，`__init__`\
    \ 方法使用从 `chat` 传递的值来初始化实例变量，并增加类变量。\n- 第二个方法 `talk()` 的声明像普通函数，除了第一个参数是 `self`\
    \ 外，不需要传递值。\n- 在这种情况下，`talk()` 方法简单返回封装在 `sound` 变量中的值。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_178_0.png)\n\
    \n类文档字符串可以通过特殊属性 `__doc__` 通过 `ClassName.__doc__` 访问。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_178_1.png)\n\
    \n虽然程序类无法完美模拟真实对象，但目标是封装所有相关的属性和动作。\n\n## 创建实例对象\n\n类对象的“实例”（instance）是通过调用该类的构造函数并在括号内指定所需数量的参数创建的原型的副本。调用参数必须与\
