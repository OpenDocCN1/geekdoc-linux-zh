    print(''Subtract & Assign:\t'', ''a ='', a, ''(12 - 4)'')


    a *= b

    print(''Multiply & Assign:\t'', ''a ='', a, ''(8 x 4)'')

    ```


    - Finally, divide and assign a new value to the first variable and display its
