    - 从“开始”菜单 – 选择“IDLE”（Python GUI）启动一个包含 Python 提示符的 Shell 窗口。


    无论使用哪种方法进入交互模式，Python 解释器都会以在提示符处输入的相同方式做出响应。在最形式的形式，解释器可以当作计算器使用。


    - 使用上述任何方法进入 Python 交互模式，然后输入一个简单的加法并按回车键，查看解释器打印出的和：

    ```

