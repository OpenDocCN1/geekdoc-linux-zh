    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_191_2.png)\n\n# 继承特性\n\nPython 类可以被创建一个全新的类（如之前示例中的类），也可以从现有类“派生”。重要的是，派生类会继承它所派生的父类（基类）的成员——除了它自身的成员之外。\n\
    \n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_192_0.png)\n\n从基类继承成员的能力允许创建共享某些共同属性的派生类，这些属性定义在基类中。例如，“多边形”（Polygon）基类可以定义所有多边形通用的宽度和高度属性。“矩形”（Rectangle）和三角形（Triangle）类可以从\
    \ Polygon 类派生——继承宽度和高度属性，以及定义其独特特性的自身成员。\n\n![](img/4d3471d9d7885aa6ac413c9170a3fa2e_192_1.png)\n\
    \n继承的是非常强大的，它是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在其类名后添加 `( )` 括号，指定其父基类的名称。\n\n-   创建一个新的\
