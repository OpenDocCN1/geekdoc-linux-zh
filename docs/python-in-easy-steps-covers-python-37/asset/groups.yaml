    \nNote that the expression False and False returns False, not True – perhaps demonstrating\
    \ the maxim “two wrongs don’t make a right”.\n\n# Examining conditions\n\nMany\
    \ programming languages, such as C++ or Java, have a ?: \"ternary\" operator that\
