    # Preface


    The creation of this book has been for me, Mike McGrath, an exciting personal
    journey in discovering how Python can be used today for procedural and oriented
    programming to develop applications. Code listed in this book describes how to
    produce Python programs in easy steps – and screenshots illustrate the actual
    results. I sincerely hope you enjoy discovering the possibilities of Python and
    have as much fun with it as I did in writing this book.


    In order to clarify the code listed in each example I have adopted certain conventions.
    Components of the Python programming language are colored blue, programmer-specified
    names are red, numeric and data values are black, and comments are green, like
    this:


    ```python

    greeting = ''Hello World!''

    print(greeting)

    ```


