    ## Summary


    - Python can be installed on a web server host to process script code before sending
    a response to a web browser client.

    - A server-side Python script can generate an HTML document by describing the
    content type as Content-type:text/html.

    - The cgi module provides a FieldStorage() constructor to create an object for
    storing submitted data as key:value pairs.

    - Any value stored in a FieldStorage object can be retrieved by specifying its
    key name to the object''s getvalue() method.

    - The browser can send data to a script using the GET method that appends key=value
    pairs to its URL address after a ? mark.

    - Multiple key=value pairs of data can be submitted using the GET method if each
    pair is separated by an & character.

    - The GET method request string length cannot exceed 1024 characters and will
    be visible in the browser address field.

    - The browser can send data to a script using the POST method that submits key=value
    pairs as a separate message.

    - Data submitted from an HTML form can be stored in a FieldStorage object as key:value
    pairs for each form field.

    - A server-side Python script can provide default values for submitted HTML form
    fields that the user has left blank.

    - Checkbox fields of an HTML form that are unchecked do not get submitted to the
    web server.

    - A selected radio button in a group provides the value to be associated with
    the group name when the form gets submitted.

    - A selected item in a drop-down list provides the value to be associated with
    the list name when the form gets submitted.

    - An HTML form can allow file uploads only if its **ctype** attribute specifies
    its encoding type as “multipart/form-data”.


    ## 9


    ## Building interfaces


    This chapter demonstrates how to create graphical windowed applications with Python.


    - Launching a window

    - Responding to buttons

    - Displaying messages

    - Gathering entries

    - Listing options

    - Checking radio buttons

    - Adding images

    - Summary


    ### Launching a window


    The standard Python module that you can use to create graphical applications is
    called “tkinter” – a toolkit interface with the system GUI.


    The tkinter module can be imported into a program like any other module to provide
    attributes and methods for windowed apps. Every tkinter program must begin by
    calling the Tk constructor to create a window object. The window’s size can, optionally,
    be specified as a ‘width’ string argument to the window object’s geometry() method.
    Similarly, the window’s title can be specified as a ‘title’ string argument to
    the window object’s title() method. If not specified, default size and title values
    will be used. There can be only one call to the Tk constructor and it must be
    at the start of the program. Every tkinter program must also call the window object’s
    mainloop() method to capture events, such as when the user closes the window.
    This loop should appear at the end of the program as it handles window updates
    that may be implemented during execution.


    With tkinter, all the graphical controls that can be included in the application
    window, such as buttons or checkboxes, are referred to as “widgets”. Perhaps the
    simplest widget is a non-interactive label object that merely displays text or
    an image. A label object can be created by specifying the window name and text
    arguments to Label constructor. Once created, each widget must then be added to
    the window using one of these “geometry manager” methods:


    - pack() – places the widget against a specified side of the window using TOP,
    BOTTOM, LEFT, or RIGHT constants specified to its side=.

    - place() – places the widget at XY coordinates in the window using numerical
    values specified to x= and y=.

    - grid() – places the widget in a cell within the window using numerical values
    specified to row= and column=.


    The grid() geometry manager is demonstrated here. Optionally, the pack() method
    may include a fill argument to expand the widget in available space. For example,
    with fill=''x’. Alternatively, the pack method may include padx and pady arguments
    to expand the widget along an axis by a specified amount.


    1. Start a new Python script with a statement to import the “tkinter” module:
    `from tkinter import *`

    2. Next, add a statement to call the constructor to create a window object: `window
    = Tk()`

    3. Now, add a statement to specify a title for this window: `window.title(''Label
    Example'')`

    4. Then, add a statement to call the constructor to create a label object: `label
    = Label(window, text=''Hello World!'')`

    5. Use the packer to add the label to the window with both horizontal and vertical
    padding for positioning: `label.pack(padx=200, pady=100)`

    6. Finally, add the mandatory statement to maintain the window by capturing events:
    `window.mainloop()`

    7. Save the program in your scripts directory, then open a Command Prompt there
    and run this program: `python tk_window.py` – see a window appear containing a
    label widget


    Widgets will not appear in the window when running the program unless they have
    been added with a geometry manager.


    ## Responding to buttons


    A Button widget provides a graphical button in an application window that may
    contain either text or an image to convey the button''s purpose. A button object
    is created by specifying the window name and options as arguments to Button constructor.
    Each option is specified as an option=value pair. The command option must always
    specify the name of a function or method to call when the user clicks that button.
    The most popular options are listed below, together with a description:


    | Option | Description |

    | : --- | : --- |

    | activebackground | Background color when the cursor is over |

    | activeforeground | Foreground color when the cursor is over |

    | bd | Border width in pixels (default is 2) |

    | bg | Background color |

    | command | Function to call when clicked |

    | fg | Foreground color |

    | font | Font for button label |

    | height | Button height in text lines, or pixels for images |

    | highlightcolor | Border color when in focus |

    | image | Image to be displayed instead of text |

    | justify | Multiple lines as LEFT, CENTER, or RIGHT |

    | padx | Horizontal padding |

    | pady | Vertical padding |

    | relief | Border style of SUNKEN, RIDGE, RAISED or GROOVE |

    | state | Enabled status of NORMAL or DISABLED |

    | underline | Index number in text of character to underline |

    | width | Button width in letters, or pixels for images |

    | wraplength | Length at which to wrap text |


    The values assigned to other options determine the widget''s appearance. These
    can be altered by specifying a new option=value pair as an argument to the widget''s
    configure() method. Additionally, a current option value can be retrieved by specifying
    its name as a string argument to the widget''s cget() method.


    You can also call a button''s invoke() method to, in turn, call the function nominated
    to its command option.


    - Start a new Python script by making GUI features available then create a window
    and specify a title

    ```python

    from tkinter import *

    window = Tk()

    window.title(''Button Example'')

    ```

