    ## 总结


    - Python 可以安装在 Web 服务器主机上，在向 浏览器客户端发送响应之前处理脚本代码。

    - 服务端 Python 脚本可以通过将内容类型描述为 `Content-type:text/html` 来生成 HTML 文档。

    - cgi 模块提供了 `FieldStorage()` 构造函数，用于创建一个对象以 `key:value` 对的形式存储提交的数据。

    - `FieldStorage` 对象中存储的任何值都可以通过向对象的 `getvalue()` 方法指定其键名来检索。

    - 浏览器可以使用 GET 方法向脚本发送数据，该方法在 URL 地址的 `?` 标记之后附加 `key=value` 对。

    - 如果每个对之间用 `&` 字符分隔，则可以使用 GET 方法提交多个 `key=value` 数据对。

    - GET 请求字符串长度不能超过 1024 个字符，并且会在浏览器地址栏中可见。

    - 浏览器可以使用 POST 方法向脚本发送数据，该方法将 `key=value` 对作为单独的消息提交。

    - 从 HTML 表单提交的数据可以作为每个表单字段的 `key:value` 对存储在 `FieldStorage` 对象中。

    - 服务端 Python 脚本可以为用户留空的 HTML 表单字段提供默认值。

    - HTML 表单中未勾选的复选框字段不会提交到 Web 服务器。

    - 表单提交时，单选按钮组中被选中的按钮将提供与组名关联的值。

    - 表单提交时，下拉列表中的选定项目将提供与列表名关联的值。

    - 只有当 HTML 表单的 **ctype** 属性指定其编码类型为“multipart/form-data”时，该表单才允许文件上传。


    ## 9


    ## 构建界面


    本章演示了如何使用 Python 创建图形窗口应用程序。


    - 启动窗口

    - 响应按钮

    - 显示消息

    - 收集条目

    - 列出选项

    - 检查单选按钮

    - 添加图像

    - 总结


    ### 启动窗口


    你可以用于创建图形应用程序的标准 Python 模块称为“tkinter” —— 一个与系统 GUI 交互的工具包接口。


    `tkinter` 模块可以像其他模块一样导入到程序中，为窗口程序提供属性和方法。每个 tkinter 程序都必须从调用 `Tk` 构造函数开始创建一个窗口对象。窗口的大小可以可选地作为
    `width` 字符串参数传递给窗口对象的 `geometry()` 方法。同样，窗口的标题可以作为 `title` 字符串参数传递给窗口对象的 `title()`
    方法。如果没有指定，将使用默认的大小和标题值。`Tk` 构造函数只能调用一次，且必须在程序开始时。每个 tkinter 程序还必须调用窗口对象的 `mainloop()`
    方法来捕获事件，例如用户关闭窗口时。该循环应该出现在程序的末尾，因为它处理了在执行期间可能实现的窗口更新。


    通过 `tkinter`，应用程序窗口中可以包含的等所有图形化控制控件（如按钮或复选框）被称为“部件”（widgets）。也许最简单的部件是一个非交互的标签对象，它仅显示文本或图像。可以通过向
    `Label` 构造函数指定窗口名称和文本参数来创建标签对象。一旦创建，必须使用以下这些“几何管理器”方法之一将部件添加到窗口中：


    - `pack()` —— 使用指定给 `side=` 的 `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量将部件放置在窗口的指定侧边。

    - `place()` —— 使用指定给 `x=` 和 `y=` 的数值值将部件放置在窗口的 XY 坐标处。

    - `grid()` —— 使用指定给 `row=` 和 `column=` 的数值值将部件放置在窗口内的单元格中。


    此处演示了 `grid()` 几何管理器。可选地，`pack()` 方法可以包含一个 `fill` 参数以在可用空间内扩展部件。例如，使用 `fill=''x''`。或者，`pack`
    方法可以包含 `padx` 和 `pady` 参数以按指定的量沿轴线扩展部件。


    1. 使用导入语句导入“tkinter”模块来启动一个新的 Python 脚本：`from tkinter import *`

    2. 接下来，添加一条语句调用构造函数创建窗口对象：`window = Tk()`

    3. 现在，添加一条语句为此窗口指定标题：`window.title(''Label Example'')`

    4. 接着，添加一条语句调用构造函数创建标签对象：`label = Label(window, text=''Hello World!'')`

    5. 使用包布局器通过同时设置水平和垂直内边距将标签添加到窗口中进行定位：`label.pack(padx=200, pady=100)`

    6. 最后，添加强制性的语句通过捕获事件来维持窗口：`window.mainloop()`

    7. 将程序保存到你的脚本目录中，然后在那里打开命令提示符并运行此程序：`python tk_window.py` —— 看到一个包含标签部件的窗口出现。


    在运行程序时，除非使用几何管理器添加部件，否则部件将不会出现在窗口中。


    ## 响应按钮


    `Button` 部件在应用程序窗口中提供一个图形按钮，其可能包含文本或图像以传达按钮的用途。通过将窗口名称和选项作为参数传递给 `Button` 构造函数创建按钮对象。每个选项都以
    `option=value` 对指定。`command` 选项必须指定用户点击该按钮时调用的函数或方法名称。下面列出了最常用的选项及其描述：


    | Option | 描述 |

    | : --- | : --- |

    | activebackground | 光标悬停在上方背景颜色 |

    | activeforeground | 光标悬停在上方的前颜色 |

    | bd | 像素单位边框宽度（默认为 2） |

    | bg | 背景颜色 |

    | command | 点击时调用的函数 |

    | fg | 前颜色 |

    | font | 按钮标签的字体 |

    | height | 以文本行为单位的高度，或图像的像素 |

    | highlightcolor | 焦点时的边框颜色 |

    | image | 代替文本显示的图像 |

    | justify | 多行对齐方式为 LEFT、CENTER 或 RIGHT |

    | padx | 水平内边距 |

    | pady | 垂直内边距 |

    | relief | 边框样式为 SUNKEN、RIDGE、RAISED 或 GROOVE |

    | state | 启用状态为 NORMAL 或 DISABLED |

    | underline | 文本中下划线的字符索引数字 |

    | width | 以字母单位的宽度，或图像的像素 |

    | wraplength | 换行的长度 |


    分配给其他选项的值决定了部件的外观。可以通过向部件的 `configure()` 方法传递一个新的 `option=value` 对来更改这些值。此外，可以通过将选项的名称作为字符串参数传递给部件的
    `cget()` 方法来检索当前的选项值。


    你还可以调用按钮的 `invoke()` 方法，从而调用其 `command` 选项所指定的函数。


    - 通过让 GUI 特性可用来启动一个新的 Python 脚本，然后创建窗口并指定标题

    ```python

    from tkinter import *

    window = Tk()

    window.title(''Button Example'')

    ```


