  \n## 管理日期和时间\n\n在我们全球社会中，分布在各地且需要相互交互的系统是非常常见的。这些系统上创建和访问的文件和文件夹使用正确的日期标记来指示文件时间是非常重要的。你可以使用两个命令来查看当前的系统日期时间：\n\
  \n* `date`\n* `time`\n\n`date` 命令还允许你使用格式操作符来自定义输出。`date` 命令有许多自定义格式可用。使用主 `date`\
  \ 命令可以查看 `date` 命令可用的不同格式。例如，要以 YYYYMMDD 格式查看年、月、日，请使用以下格式：\n\n![Line 1: dollar\
  \ space date space plus percentage Y percentage m percentage d. Line 2: 2022 0 1\
  \ 1 5\\. Line 3: dollar.](img/9781284255805_CH10_CUM30.jpg)\n\n在 Linux 系统上设置日期时间有两种方法：\n\
  \n* 手动设置\n* 自动设置\n\n本节将展示如何使用这些方法每一种来更改你 Linux 系统的时间日期。\n\n## 手动设置日期时间\n\n`date`\
  \ 命令不仅允许你查看当前的系统日期时间，还允许管理员设置它们。你通过在 `date` 命令行中使用以下格式来设置日期和时间：\n\n![date space\
  \ Y Y Y Y M M D D h h m m s s.](img/9781284255805_CH10_CUM31.jpg)\n\n如果你只需要设置日期，可以省略时间值。但是，如果你需要设置时间，则必须指定日期。只有\
  \ root 用户账户（或具有 `sudo` 权限的账户）才能更改系统的日期时间。\n\n## 自动同步时间\n\n为几十个或数百个 Linux 系统手动设置时间可能是一项巨大的挑战。为了避免这种情况，你可以使用网络时间协议\
  \ (NTP)。NTP 允许将网络上所有的 Linux 系统指向单一的时间源，并始终将系统日期时间与时间源同步。\n\nLinux 中有多个 NTP 程序可用，但目前流行的两个是\
  \ `ntpd` 和 `system-timesyncd` 程序。\n\n`ntpd` 程序在后台运行，与远程时间源通信，并不断将系统日期时间同步到时间源。你在\
  \ `/etc/ntp.conf` 配置文件中设置一个或多个远程时间源。只需在配置文件的单独行指定每个时间源即可：\n\n![server space host\
  \ name.](img/9781284255805_CH10_CUM32.jpg)\n\n`systemd-timesyncd` 程序是 Systemd 工具族的一部分。你可以通过使用\
  \ `systemctl` 命令检查它是否在你的 Linux 系统上运行，如列表 10-6 所示：\n\nListing 10-6 中的输出显示系统正在使用 `systemd-timesyncd`\
  \ 程序同步时间。你在 `/etc/systemd/timesyncd.conf` 配置文件中定义 NTP 服务器。\n\n许多网络利用本地时间源，所有系统都同步到该源。然而，如果你愿意，也可以使用互联网上的公共时间源。例如，特殊地址\
  \ `pool.ntp.org` 提供了一组 24/7 可用的时间源服务器集群。\n\n## 设置时区\n\n除了日期时间之外，Linux 系统的另一个重要时间特性是时区。大多数\
  \ Linux 发行版使用 `/etc/localtime` 文件来定义服务器的时区；然而，某些旧的 Linux 发行版使用 `/etc/timezone` 文件。\n\
  \n`localtime` 和 `timezone` 文件本身有些晦涩，但幸运的是对我们来说，我们不需要直接处理它们。相反，Linux 发行版在 `/usr/share/zoneinfo`\
  \ 文件夹中存储了时区模板文件（全球每个时区一个）。时区文件被分为代表地理位置的文件夹，这使得更容易找到你所在区域的时区文件。你只需要使用 `ln` 命令将你所在区域的适当时区模板文件链接到系统的实际时区文件位置：\n\
  \n![l n space hyphen s space slash u r slash share slash zone info slash U S slash\
  \ Eastern space slash e t c slash local time.](img/9781284255805_CH10_CUM34.jpg)\n\
  \n这将系统时区设置为美国东部时区。\n\n# 打印机管理\n\n多年来，打印一直是 Linux 系统的噩梦。在 Windows 世界中，打印机制造商只需为每台打印机创建自定义的打印机驱动程序，使得连接任何打印机都轻而易举，但在\
  \ Linux 世界并非如此。Linux 使用两个不同的系统来管理打印机：\n\n* BSD 软件发行版 (BSD) 打印守护进程 (LPD)\n\n`打印守护进程\
  \ (LPD)` 打印方法是两者中较老的，因为它源于 BSD 世界。在 LPD 中，每台打印机都在 `/etc/printcap` 中定义，指定连接端口、处理文本和特殊字符的规则以及定义打印队列的规则（通常存储在\
  \ `/var/spool/lpd` 中）。LPD 打印系统相当复杂，并非即插即用。由于这种复杂性，Unix 开发者创建了通用 打印系统 (CUPS)。它包含一个定义打印机和管理打印作业的\
  \ Web 界面。由于其简单性，它已成为所有 Linux 发行版的默认打印方法。本节重点介绍如何在你的 Linux 系统实现 CUPS。\n\n## 配置 CUPS\n\
  \nCUPS 设置由一个在后台运行的程序（称为 `cupsd`）和两个定义系统参数及打印机的配置文件组成。这些打印机通常使用 CUPS Web 界面定义。\n\n\
  `/etc/cups/cupsd.conf` 文件定义了控制 CUPS 服务器整体操作的系统参数。CUPS 还利用互联网打印协议 (IPP)，允许网络打印机在网络上广播，以便\
  \ CUPS 服务器能够自动检测它们。\n\n要使用 CUPS Web 界面设置新打印机，请打开浏览器并导航到 URL：`http://localhost:631`。主\
  \ CUPS Web 界面如图 10-2 所示：\n\n```\n![截图显示了 CUPS 主 Web 界面。```](img/9781284255805_CH10_FIGF02.jpg)\n\
  \nCUPS Web 界面在 TCP 端口 631 上监听来自客户端和其他 CUPS 服务器的请求。\n\n点击“管理”（Administration）选项卡来定义新打印机。你首先会被提示输入管理员账户和密码，然后你可以通过一个简单的向导选择要添加的打印机。一旦你使用\
  \ CUPS 添加了打印机，该打印机将在系统上运行的所有图形桌面应用程序中都可用。如果你需要从命令行提示符使用打印机，也有程序可以提供帮助。\n\n\n\n\n\
  \n## 使用 LPD 命令\n\n为了支持命令行打印方法，CUPS 还包含了模拟 LPD 系统中所用标准程序的程序。表 10-4 显示了可用的打印命令。\n\n\
  ### 表 10-4 CUPS 命令行命令。\n\n| 命令 | 描述 |\n| --- | --- |\n| `lpc` | 启动、停止或重新排序打印任务。\
  \ |\n| `lpr` | 将任务发送到打印队列。 |\n| `lprm` | 从打印队列中删除任务。 |\n| `lpq` | 显示打印队列。 |\n\n\
  每个命令都使用 `–P` 参数来指定使用的打印机：\n\n![Line 1: dollar space l p q space hyphen P h p 6 4\
  \ 0 0\\. Line 2: h p 6 4 0 0 is ready. Line 3: no entries. Line 4: dollar.](img/9781284255805_CH10_CUM35.jpg)\n\
  \n虽然 CUPS 帮助让安装和管理打印机变得简单，但仍然存在一个：如何向打印机发送它能够理解并打印的数据。这就是 Linux PPD 文件大显身场。\n\n\
  # 使用 Linux 打印机驱动程序\n\nUnix 处理打印的原始解决方案设计了一种标准的打印协议，用于格式化发送到打印机的文本和图形。Postscript\
  \ 协议就是这项工作的成果。Postscript 协议 定义了一种控制打印机如何显示文本和图形的格式语言。\n\n遗憾的是，并没有多少廉价消费级打印机支持 Postscript\
  \ 协议，因为该协议实现起来相当复杂。这使得 Linux 用户回到了依赖各个打印机制造商为其特定打印机创建 Linux 驱动程序。\n\n随着 Ghostscript\
  \ 程序的开发，这个问题得到了解决。`Ghostscript` 将 Postscript 数据转换为特定打印机识别的命令。它使用 Postscript 打印机定义\
  \ (PPD) 文件来定义过滤 Postscript 命令并将其转换为打印机识别的命令的规则。每台打印机只需要一个 PPD 文件，`Ghostscript` 程序就能将\
  \ Postscript 数据转换以便在打印机上打印。\n\n这为打印机制造商和 Linux 用户组为各种常见打印机生成 PPD 文件打开了大门。CUPS 软件包本身包含了数千种不同打印机的\
  \ PPD 文件，此外，还有整个网站致力于 Linux 用户分享他们自己的自定义 PPD 文件。现在，Linux 世界终于有了一个合理的打印解决方案。\n\n\
  # 电子邮件管理\n\n在如今这个即时通信时代，电子邮件服务器不仅在商业世界是必需品，对于个人计算机系统也是如此。大多数 Linux 系统默认安装某种邮件系统，要么是允许用户连接到远程电子邮件服务器的桌面客户端程序，要么是处理本地电子邮件的内部电子邮件服务器。\n\
  \n本节描述了 Linux 如何处理电子邮件，以及在 Linux 环境中处理电子邮件时可提供的不同选项。\n\n### 描述 Linux 电子邮件架构\n\n\
  在电子邮件的早期，标准做法是创建一个单一的单体程序来处理电子邮件的所有方面：\n\n* 向远程系统上的用户发送消息\n* 从远程系统接收消息\n* 允许客户端读取消息\n\
  * 允许客户端发送消息\n\nUnix 操作系统的背后的思想是尽可能将许多功能模块化，电子邮件也不例外。Unix 开发人员设计了一种模块化的方法来处理电子邮件功能。Unix\
  \ 系统没有使用单一的单体电子邮件程序，而是将功能分为三个子系统：\n\n* 邮件传输代理 (MTA)—向远程服务器发送消息并从远程服务器接收消息。\n* 邮件投递代理\
  \ (MDA)—从 `MTA` 接收入站的邮件消息，并确保它们进入正确的本地用户邮箱箱。\n* 邮件用户代理 (MUA)—为用户提供读取消息和发送新消息的界面。\n\
  \n通过对每个功能进行模块化，Unix 开发人员可以创建更高级的程序，专门负责邮件过程的每个特性。图 10-3 展示了这些模块如何组合在一起，以便在独立系统的用户之间接收和投递消息。\n\
  \n![A chart shows the Linux modular email programs.](img/9781284255805_CH10_FIGF03.jpg)\n\
  \n图 10-3 Linux 模块化电子邮件程序。\n\n图表说明\n\nLinux 开发人员继续这一过程，并开发了几个用于实现电子邮件系统的新模块化程序。本节将介绍目前适用于客户端和服务器功能的程序。\n\
  \n### 识别 Linux 电子邮件服务器\n\n电子邮件服务器需要 `MTA` 和 `MDA` 程序来接受并将邮件投递给系统上的用户。Linux 环境提供了几种不同的\
  \ `MTA` 程序，表 10-5 描述了最常用的程序。\n\n| 服务器 | 描述 |\n| --- | --- |\n| `Sendmail` | 原始 Unix\
  \ 电子邮件程序，`Sendmail` 功能强大但配置复杂。 |\n| `Exim` | 创建为单体电子邮件程序，`Exim` 于配置。 |\n| `Postfix`\
  \ | `Postfix` 作为一组模块化程序创建，用于入站和出站邮件。 |\n| `qMail` | `qMail` 是专注于保证邮件投递的模块化程序集。 |\n\
  \nPostfix 电子邮件程序已变得非常流行。大多数 Linux 发行版默认安装它。然而，许多经验丰富的电子邮件管理员更倾向于 `qMail` 的健性和可靠性。\n\
  \n电子邮件服务器使用简单邮件传输协议（SMTP`)互相发送消息。每个电子邮件服务器都可以向远程服务器发送消息，也可以接收本地用户的消息。\n\nLinux 世界中一种流行的\
  \ `MDA` 程序是 Procmail。`Procmail` 程序允许邮件管理员自定义邮件投递。你不仅可以将邮件发送到特定的用户账户，`Procmail` 还允许用户根据过滤命令将邮件定向到特定文件夹。\n\
  \n### 使用 Linux 电子邮件客户端\n\nLinux 环境包含了大量的电子邮件客户端包。对于图形桌面环境，`Thunderbird` 和 `Evolution`\
  \ 包是最常用的。`Thunderbird` 电子邮件客户端如图 10-4 所示。\n\n![A screenshot shows the Thunderbird\
  \ email client.](img/9781284255805_CH10_FIGF04.jpg)\n\n图 10-4 Thunderbird 电子邮件客户端。感谢\
  \ Mozilla 基金。\n\n感谢 Mozilla 基金。\n\n说明\n\n图形电子邮件客户端包提供了从本地用户账户和远程电子邮件服务器接收邮件的配置选项。这使得它们成为完整的\
  \ `MUA` 包。\n\n你还可以配置 `Thunderbird` 和 `Evolution` 将出站邮件消息发送到电子邮件服务器。电子邮件服务器接受来自客户端和服务器的电子邮件，如果这些邮件不是给主机上的本地用户账户的，则根据需要进行转发。它使用\
  \ `SMTP` 将消息转发到相应的目标电子邮件服务器。这一功能被称为 邮件提交代理 (MSA)，通常是电子邮件服务器上 `MTA` 软件的一部分。\n\n\n\
  \n\n\nLinux 命令行中也提供了许多可用的电子邮件客户端程序。`mailx` 程序是最流行的，并且通常在 Linux 发行版中默认安装。`mailx`\
  \ 程序允许你通过简单的 `mail` 命令行命令发送电子邮件消息，并检查你的本地用户账户邮箱箱：\n\n![使用简单的 mail 命令行命令检查本地用户账户邮箱的输出结果。](img/9781284255805_CH10_CUM36.jpg)\n\
  \n描述\n\n问号提示符允许你提交命令来读取、删除、存储和响应消息。\n\n你也可以使用 `mail` 命令发送邮件：\n\n![第 1 行：美元符号 空 mail\
  \ 空 连字符 s 空双引号 Test 双引号 空 空 空 c 冒号。第 2 行：这是一条测试消息。第 3 行：美元符号。](img/9781284255805_CH10_CUM37.jpg)\n\
  \n按下 `Ctrl+D` 组合键即可结束消息文本。\n\n### 重定向邮件\n\n在 Linux 电子邮件系统中，重定向邮件投递有两种常用方法：\n\n*\
  \   转发 (Forwarding)\n*   别名 (Aliases)\n\n转发 允许每个用户将消息转发到另一个位置。你只需要在主目录下创建一个 `.forward`\
  \ 文件（由于文件名以点开头，Linux 将其视为隐藏文件），并定义你希望将所有邮件转发到的位置。这些位置可以是备用电子邮件地址、文件，甚至是程序。\n\n邮件系统管理员还可以设置别名\
  \ 来重定向电子邮件消息。`/etc/aliases` 文件允许你使用以下格式创建别名列表：\n\n![别名 冒号 空 地址 1 逗号 空 地址 2 逗号 空\
  \ 省号。](img/9781284255805_CH10_CUM38.jpg)\n\n别名名称的作用类似于本地用户账户；电子邮件服务器将接受发往该别名的入站邮件。然而，它不会将其投递给别名，而是将消息重定向到指定的某或多个替代地址。\n\
  \n在 `/etc/aliases` 文件中定义别名后，管理员必须运行 `newaliases` 命令，该命令会将别名文件转换为 MTA 软件使用的独立二进制文件。\n\
  \n### 安全登录\n\n在多服务器的 Linux 环境中，你很有可能在物理上并不靠近任何 Linux 服务器。要访问这些服务器，你需要利用某种远程访问软件。\n\
  \n过去，Telnet 协议提供了通过网络使用命令行提示符与服务器交互的最简单方法。遗憾的是，该协议以明文、未加密文本的形式发送数据，使得攻击者很容易监听你的连接并获取宝贵信息。\n\
  \n如今，所有系统都支持用于远程访问的安全 Shell (SSH) 登录。SSH 登录使用加密密钥对客户端和服务器之间的网络会话流量进行加密，使得攻击者更难监听。\n\
  \nSSH 最流行的软件包是 OpenSSH，它是 SSH 协议的开源实现。\n\nOpenSSH 软件包在同一个包中提供了客户端和服务器软件，因此你只需要安装一个包即可同时拥有两者。OpenSSH\
  \ 软件包包含支持以下内容的程序：\n\n*   交互式命令行提示符会话\n*   远程文件复制\n*   两个服务器之间任何类型数据的隧道传输\n\n隧道 在两个服务器之间提供一种加密连接，任何应用程序都可以使用它来发送数据。这为几乎任何应用程序加密数据提供了一种简单的方法，即使该程序并不直接支持加密连接。\n\
  \n本节将介绍在 Linux 环境中使用 OpenSSH 的基础知识，为服务器和客户端之间提供安全通信。\n\n### 使用 OpenSSH\n\nOpenSSH\
  \ 软件包由四个主要程序组成：\n\n*   `sshd`—安全服务器\n*   `ssh`—安全客户端\n*   scp—一个安全复制命令\n*   sftp—一个功能全的安全文件传输程序\n\
  \nOpenSSH `sshd` 服务器程序监听 TCP 端口 22 网络连接，并根据客户端请求启动交互式 Shell 或文件传输应用程序。它利用 `/etc/ssh/sshd_config`\
  \ 配置文件，允许你自定义其行为。你可能需要查看的四个主要配置设置：\n\n*   `Protocol`—设置为 `1`（版本 1）或 `2`（版本 2）加密协议。版本\
  \ 1 不再被认为是安全的，因此尽可能使用版本 2。\n*   `PermitRootLogin`—当设置为 `yes` 时，允许 root 用户账户从交互式\
  \ SSH 连接登录。\n*   `AllowTcpForwarding`—当设置为 `yes` 时，允许 TCP 转发。\n*   `X11Forwarding`—当设置为\
  \ `yes` 时，允许通过加密连接转发图形应用程序。\n\nSSH 登录使用密钥对客户端和服务器之间的网络会话进行加密，使得攻击者难以监听。\n\nSSH 协议使用非对称加密（也称为公钥加密）。这种方法生成两个密钥：\n\
  \n*   公钥 保存在远程服务器的 `~/.ssh/authorized_keys` 中。\n*   私钥 只有你的工作站可以访问，通常存储在 `~/.ssh/id_rsa`\
  \ 中。\n\n### SSH 密钥\n\nOpenSSH 软件包包含了可以生成公钥和私钥的 `ssh-keygen` 程序。它可以标识服务器和客户端。\n\n\
  服务器维护密钥对，以便客户端确保使用的是真实的服务器而不是伪服务器。服务器保留私钥，客户端放置服务器的公钥。\n\n虽然这在安装服务器时会自动完成，但你也可以使用命令手动生成服务器密钥：\n\
  \n![生成服务器密钥的命令](img/9781284255805_CH10_CUM39.jpg)\n\n描述\n\n这些命令生成三种最常见的密钥类型：RSA\
  \ 版本 1、RSA 版本 2 和 DSA。私钥存储在 `/etc/ssh` 文件夹中，分别为 `ssh_host_rsa1_key`、`ssh_host_rsa_key`\
  \ 和 `ssh_host_dsa_key`。公钥使用相同的文件，但扩展名为 `.pub`。\n\n### 使用 SSH 登录\n\n当你使用 `ssh` 程序登录远程主机时，有两种模式可以使用：\n\
  \n*   密码模式—输入你的普通用户账户密码。\n*   密钥模式—输入私钥验证你的连接。\n\n在密码模式下，`ssh` 程序会提示你输入用户账户密码：\n\
  \n![脚本显示 s s h 程序提示用户账户密码。](img/9781284255805_CH10_CUM40.jpg)\n\n描述\n\n\n\n\n当你第一次连接到服务器时，系统会提示你接受该服务器的公钥。后续对该服务器的连接将会将存储的公钥与服务器的私钥进行比较。如果它们不匹配，`ssh`\
  \ 程序将警告你发生了变化。\n\n在成功连接后，提示符将变为远程服务器的命令行提示符。自定义 `PS1` shell 提示符以在提示符中显示主机名是有帮助的，这样你就可以随时记录你正在从哪个系统的\
  \ shell 提示符进行工作。\n\n你可以不使用用户账户密码，而是配置 SSH 使用你的私钥登录远程系统。要做到这一点，你必须生成一对公钥和私钥：\n\n\
  ![生成了公钥和私钥对。](img/9781284255805_CH10_CUM41.jpg)\n\n描述\n\n然后，你必须将公钥从文件 `~/.ssh/id_rsa_pub`\
  \ 复制到远程服务器上用户账户的 `~/.ssh` 文件夹下的 `authorized_keys` 文件中。你可以手动执行此操作，也可以使用 `ssh-copy-id`\
  \ 命令。\n\n### 加密文件\n\n有时你可能需要比加密网络连接更な安全性。如果你处理敏感文件，可能希望在发送到远程位置之前对实际文件进行加密。遗憾的是，OpenSSH\
  \ 包仅用于加密网络会话，而不能加密单个文件。相反，你可以使用 GNU Privacy Guard (GPG) 包。\n\nGPG 包提供了一种方法，使你既可以加密文件以保护数据，也可以对文件进行数字签名以验证其来自你。所有这些操作都是使用\
  \ `gpg` 程序完成的。\n\n`gpg` 程序维护着密钥环，其中包含了与你交换文件的个人的公钥。要使用 GPG，你首先需要创建自己的公钥/私钥对并添加到密钥环中：\n\
  \n![gpg 空间生成密钥。](img/9781284255805_CH10_CUM42.jpg)\n\n要将你的公钥导出到可以发送给其他人的文件中，请使用\
  \ `--export` 参数：\n\n```\ng p g space double hyphen export space name space greater\
  \ than space my key dot pub.\nimages/9781284255805_CH10_CUM43.jpg\n```\n\n你必须为自己指定一个唯一的名称，以便在\
  \ `gpg` 密钥环中标识你的公钥。然后你可以将公钥文件通过电子邮件发送给任何与你交换加密文件的人。\n\n同样，你必须导入其他人的公钥以便读取他们发送给你的加密文件。你使用\
  \ `--import` 参数来实现操作：\n\n```\ng p g space double hyphen import space their key dot\
  \ pub.\nimages/9781284255805_CH10_CUM44.jpg\n```\n\n如果你想列出密钥环中包含的公钥，请使用 `--list-keys`\
  \ 参数，或者使用 `--gen-revoke` 参数从密钥环中移除单个密钥。\n\n一旦你在密钥环中有了接收者的密钥，你就可以使用命令加密文件并发送给他们：\n\
  \n```\ng p g space double hyphen out space encrypted file space double hyphen recipient\
  \ space user space double hyphen encrypt space input file.\nimages/9781284255805_CH10_CUM45.jpg\n\
  ```\n\n你必须指定与密钥环中公钥用户名匹配的用户名。默认情况下，GPG 生成二进制加密文件。如果你希望将加密文件作为文本消息通过电子邮件发送，请添加 `--armor`\
  \ 参数。\n\n要解密发送给你的加密文件，请使用命令：\n\n```\ng p g space double hyphen out space decrypted\
  \ file space double hyphen decrypt space input file.\nimages/9781284255805_CH10_CUM46.jpg\n\
  ```\n\n除了加密文件外，GPG 还允许你对文件进行数字签名以验证其来自你。要做到这一点，请使用命令：\n\n```\ng p g space double\
  \ hyphen clear sign space file.\nimages/9781284255805_CH10_CUM47.jpg\n```\n\n要验证由他人数字签名的文件，请使用：\n\
  \n```\ng p g space double hyphen verify space file.\nimages/9781284255805_CH10_CUM48.jpg\n\
  ```\n\n通过结合 GPG 和 OpenSSH，你可以帮助提高文件在主机之间传输过程的安全性。\n\n## 日志文件\n\n在多用户 Linux 系统中，跟踪用户以及后台程序正在做什么是非常重要的。你可以利用系统日志文件来实现这一点。几乎所有的\
  \ Linux 系统将系统日志文件存储在 `/var/log` 目录结构中。\n\nLinux 中使用了两种常用的日志系统。对于使用 SysVinit 启动脚本方法的\
  \ Linux 系统，syslogd 程序（或其表兄弟 `rsyslogd`）是最常用的日志程序。对于使用 Systemd 启动脚本方法的系统，则使用 `systemd-journald`\
  \ 程序。\n\n以下章节详细介绍了这些方法。\n\n### 使用 syslogd\n\n`syslogd` 程序使用 `/etc/syslog.conf`（或\
  \ `/etc/rsyslog.conf`）来控制记录哪些事件以及如何记录。条目的格式为：\n\n```\nfacility priority action.\n\
  images/9781284255805_CH10_CUM49.jpg\n```\n\n可用的设施有：\n\n| 设施 | 描述 |\n| :--- | :---\
  \ |\n| authpriv | 用于安全和授权。 |\n| cron | 用于 cron 。 |\n| daemon | 用于各种系统消息。 |\n| kern\
  \ | 用于内核消息。 |\n| lpr | 用于打印系统。 |\n| mail | 用于邮件消息。 |\n| news | 用于新闻消息。 |\n| syslog\
  \ | 用于内部生成的消息。 |\n| user | 用于用户级消息。 |\n| uucp | 用于 Unix 到 Unix 拷贝 (uucp) 消息。 |\n\
  | local0 到 7 | 用于本地定义的应用程序。 |\n\n优先级见表 10-7：\n\n| 优先级 | 描述 |\n| :--- | :--- |\n\
  | emerg | 紧急消息，表示系统不可用。 |\n| alert | 关于主系统的紧急故障错误消息。 |\n| crit | 关于次要系统的紧急故障错误消息。\
  \ |\n| err | 非紧急故障错误消息。 |\n| warning | 此消息表示如果不采取行动将发生错误。 |\n| notice | 标识不关注的异常消息。\
  \ |\n| info | 关于正常操作的消息。 |\n| debug | 应用程序的调试消息。 |\n\n对于 `action` 参数，你可以指定一个或多个文件名来记录消息、一个或多个用户账户，甚至是远程主机日志系统。你也可以使用\
  \ `*` 通配符来覆盖所有设施、优先级或用户账户。\n\n例如，要将所有邮件消息发送到 `/var/log/mail` 日志文件，请使用条目：\n\n```\n\
  mail dot asterisk space /var/log/mail\nimages/9781284255805_CH10_CUM50.jpg\n```\n\
  \n要将所有紧急消息发送给系统上的所有用户，请使用：\n\n```\nasterisk dot emerg space asterisk.\nimages/9781284255805_CH10_CUM51.jpg\n\
  ```\n\n最后，将所有关键优先级消息发送到远程服务器，请使用：\n\n```\nasterisk dot crit space at remote host.\n\
  images/9781284255805_CH10_CUM52.jpg\n```\n\n你还可以使用 `logger` 程序手动向 `syslogd` 系统记录消息：\n\
  \n```\nMessages are manually logged to the sys log d system using the logger program.\n\
  images/9781284255805_CH10_CUM53.jpg\n```\n\n\n\n\n最后，使用 `logrotate` 程序来拆分（或轮转）日志文件，防止它们变得过大。你可以根据文件大小或日期启动一个新的日志文件。`/etc/logrotate.conf`\
  \ 配置文件设置了每种日志类型的旋转方式。\n\n### 使用 Systemd-journald\n\nsystemdjournald 日志系统使用 `/etc/system/journald.conf`\
  \ 配置文件定义如何记录事件。该配置文件包含了所有可能的设置，并已注释掉。要将某设置从默认值更改，只需删除注释字符，并将值更改为你所需的值。对于大多数系统，默认值已经足够好。\n\
  \n查看由 `systemdjournald` 生成的日志文件有些棘手。遗憾的是，`journald` 程序将事件消息记录在二进制日志文件中，而不是文本日志文件中。因此，你不能直接使用文本工具查看\
  \ `journald` 生成的日志文件。相反，你必须使用 `journalctl` 程序。\n\njournalctl 程序本身从第一条开始显示 `journald`\
  \ 日志文件项。你可以使用一些命令行参数来更改它的行为：\n\n*   `-a`—显示所有数据字段。\n*   `-e`—跳转到文件末尾并使用分页器程序显示。\n\
  *   `-l`—仅显示可打印的数据字段。\n*   `-n number`—显示最近的日志数据并将其限制在特定的行数内（如果没有指定数字，则为 10 行）。\n\
  *   `-r`—反转日志数据的输出，使最新的条目首先显示。\n\n`journalctl` 程序还有许多其他功能，你可以利用它们来过滤你查看的日志消息。请参阅\
  \ `journalctl` 手页以查看所有功能。\n\n## 资源\n\nRed Hat 文档，“通过命令行工具管理用户”，访问于 2022 年 1 月 15\
  \ 日，来自 [`access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/deployment_guide/s2-users-cl-tools.`](https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/deployment_guide/s2-users-cl-tools)\n\
  \nUbuntu 文档“CUPS—打印服务器”，访问于 2022 年 1 月 15 日，来自 [`ubuntu.com/server/docs/service-cups`](https://ubuntu.com/server/docs/service-cups)。\n\
  \nOpenSSH，“OpenSSH”，访问于 2022 年 1 月 15 日，来自 [`openssh.com`](https://openssh.com)。\n\
  \n![一张抽象图像显示了烟雾状的纹理。](img/Chapter-opener.jpg)\n\n© Picsfive/Shutterstock\n\n## 第\
  \ 11 章\n\n### Linux 安全\n\n如今，了解运行安全的 Linux 系统是必须的。幸运的是，Linux 世界有许多工具可以帮助这项工作变得更容易。本章讨论了\
  \ Linux 的某些安全特性，根据你的特定环境，你可能需要使用这些特性。\n\n本章开始讨论 Linux 管理帐户的重要性。`root` 用户账户拥有更改 Linux\
  \ 系统上所有内容的权限。控制谁可以使用该账户、他们如何使用它以及他们使用它时的记录是 Linux 安全的第一步。本节讨论了一些用于控制和监控系统 root 访问的\
  \ Linux 工具和常用技术。\n\n接下来，本章讨论了在 Linux 中实现高级安全权限。虽然 Linux 提供了基本的文件保护，但它缺乏管理进程安全的能力。然而，有两个常用的软件包用于为其他\
  \ Linux 对象（如进程）提供基于上下文的安全权限。SELinux 和 AppArmor 是 Linux 世界中提供高级安全的两个流行软件包。\n\n本章接着讨论了加密分区。Linux\
  \ 有几种不同的方法加密存储在系统上的文件。本章讨论了 `cryptsetup` 工具，它允许你加密整个分区，这样你就无需加密单个文件。本章最后通过探索流行的\
  \ `firewalld` 工具，简要介绍了在 Linux 中使用防火墙。\n\n### 访问 root 权限\n\nLinux 系统通过使用用户账户来控制对文件、目录和应用程序的访问。Linux\
  \ 有三种类型的用户账户：\n\n*   Root—拥有所有文件、目录和服务的完全权限的管理员账户\n*   Standard—普通用户账户\n*   Service—应用程序账户\n\
  \n由于其权限强大，root 用户 账户在你的 Linux 系统上处于可能会有些危险。默认情况下，Ubuntu 发行版阻止了登录或切换到 root 用户账户，以帮助管理安全环境。然而，基于\
  \ Red Hat 的发行版情况并非如此。\n\n如果你在 Red Hat 环境中检查，root 用户账户存在：\n\n![第 1 行：dollar space\
  \ get ent space pass w d space root. 第 2 行：root colon x colon 0 colon 0 colon root\
  \ colon slash root colon slash bin slash bash. 第 3 行：dollar.](img/9781284255805_CUM01.jpg)\n\
  \n并且在安装时分配了密码：\n\n![输出显示了 root 账户的存在。](img/9781284255805_CUM02.jpg)\n\n描述\n\n由于\
  \ root 用户账户在 Red Hat 系统中是激活的，在使用 Red Hat 系统时应注意几点。\n\n### 获取超级用户权限\n\n在 Linux 上获取超级用户权限最简单的方法是登录\
  \ root 用户账户。然而，这可能是一个危险的做法，因为很难追踪是谁登录了 root。为了避免这个问题，许多 Linux 发行版（如 Ubuntu）默认配置为禁止直接登录\
  \ root 。相反，你必须使用两个命令行之一获取超级用户权限：\n\n*   `su` 以另一个用户账户启动新的命令行 shell。如果没有指定用户账户，它默认为\
  \ root 。\n*   `sudo` 以 root 权限运行单个命令。\n\n当你使用这些命令时，Linux 系统会记录哪个用户账户获取了超级用户权限以及何时（称为不可否认性）。\n\
  \nsudo 命令是“sub user do”的缩写，尽管许多人仍称其旧名称“super user do”，因为它提供了超级用户访问权限。它允许标准用户账户以另一个预授权用户（包括\
  \ root 用户）的身份运行任何预授权命令。使用 `sudo` 命令提供了以下优点和功能：\n\n*   使用时，`sudo` 会提示用户输入自己的密码以验证身份。\n\
  *   验证使用 sudo 后，在一段时间不使用 sudo 命令之前，账户不需要重新输入密码。\n*   使用 `sudo` 命令的操作会被记录。\n*   可以配置用户组使用\
  \ `sudo`，而不是列出单个账户访问。\n*   配置得当，`sudo` 提供了一个最小权限和不可否认的环境，有助于系统安全。\n\n`/etc/sudoers`\
  \ 配置文件定义了哪些用户允许运行 `sudo` 命令以及他们拥有权限的操作。sudoers 文件可能包含允许用户提升权限的用户账户、别名和/或组列表。默认情况下，Ubuntu\
  \ 系统上的 `sudoers` 文件如下：\n\n![输出显示了 sudoers 文件的插图。](img/9781284255805_CUM03.jpg)\n\
  \n描述\n\n\n\n\nLinux 发行版会创建一个独立的用户账户，用于指定谁可以使用完全超级用户权限。Ubuntu 使用 `sudo` 组，而基于 Red\
  \ Hat 的发行版则使用 `wheel` 组。通常，安装时创建的初始账户会被分配到该组。你可以通过 `groups` 命令判断你的账户是否这些组之一的成员：\n\
  \n![Line 1: dollar space groups. Line 2: sys admin space a d m space c d rom space\
  \ sudo space dip space plug dev space l x d. Line 3: dollar.](img/9781284255805_CH11_CUM04.jpg)\n\
  \n如果你想修改 sudo 配置，需要使用 `visudo` 命令。它是一个特殊的脚本，防止多个管理员同时进行更改导致文件损坏，并检查语法是否正确。\n\n然而，与其直接在\
  \ `/etc/sudoers` 文件中添加你的配置，不如在 `/etc/sudoers.d/` 目录中创建你的 sudo 命令配置文件。如果你这样做，请务必取消\
  \ sudoers 文件末尾 `includedir` 操作的注释，以便加载你的配置。\n\n还有一个提供权限提升的实用命令。`sudoedit` 命令允许标准用户以另一个预授权用户账户（包括\
  \ root 用户账户）的权限在文本编辑器中打开文件。与 `sudo` 命令类似，`sudoedit` 也会提示用户输入自己的密码以验证其身份。\n\n###\
  \ 确定你的权限提升状态\n\n在 Ubuntu 上，提升权限的常用方法是使用 `sudo` 命令。但是，你必须属于 `/etc/sudoers` 文件中列出的可以访问更高权限的组，或者在文件中具有授权该权限的记录。\n\
  \n要确定你的权限提升状态，你需要判断你的用户 ID 是直接在 `/etc/sudoers` 文件中，还是某个该组的成员。首先，使用 `whoami` 命令验证你的账户名：\n\
  \n![Line 1: dollar space whoami. Line 2: rich. Line 3: dollar.](img/9781284255805_CH11_CUM05.jpg)\n\
  \n接下来，使用 `groups` 命令确定该账户所属的组：\n\n![Line 1: dollar space groups. Line 2: rich space\
  \ a d m space c d rom space sudo space dip space plug dev space l p admin space\
  \ l x d space samba share. Line 3: dollar.](img/9781284255805_CH11_CUM06.jpg)\n\n\
  通常，Ubuntu Linux 允许属于 `sudo` 组的用户访问完全超级用户权限。要在你的系统上检查这一点，可以使用 `cat` 命令显示 `/etc/sudoers`\
  \ 文件（你需要 root 权限才能显示）：\n\n![An output displays user privileges of a file using the\
  \ cat command.](img/9781284255805_CH11_CUM07.jpg)\n\n描述\n\n![An output displays\
  \ user privileges of a file using the cat command.](img/9781284255805_CH11_CUM08.jpg)\n\
  \n描述\n\n你应该应该在 `/etc/sudoers` 文件中看到你账户所属的组名之一。在这个示例中，我的用户名在 `sudo` 组中，该组列在 sudoers\
  \ 文件中，让我拥有系统的管理权限。\n\n### 跟踪 root 登录\n\n如果你的 Linux 服务器上启用了 root 用户账户，那么监控其使用时间一直是个好主意。你可以使用\
  \ `last` 命令来实现。`last` 命令会显示审计日志中登录过系统的用户列表。示例输出显示在 列表 11-1 中。\n\n`last` 输出的第二列显示\
  \ root 用户账户登录的终端。如果是远程终端（如 SSH 连接），第三列将显示远程设备的 IP 地址。定期监控此是一个好主意，以关注未知的活动。\n\n###\
  \ 禁止从 SSH 访问 root\n\nopenSSH 软件软件包包含一个 SSH 服务器，允许远程客户端使用 SSH 协议进行连接。`/etc/ssh/sshd_config`\
  \ 文件控制 SSH 服务器的行为。默认情况下，Red Hat 服务器使用的配置允许 root 用户账户从远程设备登录。要防止 root 用户账户通过 SSH\
  \ 协议从远程设备登录，你需要修改配置文件。\n\n配置文件中允许此功能的行是：\n\n![Permit Root Login yes.](img/9781284255805_CH11_CUM10.jpg)\n\
  \n要阻止 root 用户账户访问，将该行编辑为：\n\n![Permit Root Login no.](img/9781284255805_CH11_CUM11.jpg)\n\
  \n然后重启 openSSH 服务使更改生效：\n\n```\nsudo systemctl restart sshd\n```\n\n![sudo systemctl\
  \ restart sshd.](img/9781284255805_CH11_CUM12.jpg)\n\n重启 openSSH 后，你现在应该被拒绝以 root\
  \ 用户账户在远程 SSH 连接中进行访问：\n\n![Line 1: login as root. Line 2: root at 192.168.1.81\
  \ password. Line 3: Access denied. Line 4: root at 192.168.1.81 password.](img/9781284255805_CH11_CUM13.jpg)\n\
  \n现在 root 用户账户只能从服务器上的控制台设备登录。\n\n### 启用自动注销\n\n如果你允许 Linux 服务器上的管理员使用 root 用户账户登录，那么为\
  \ Bash shell 设置超时时间是个好主意。一个带有 root 登录且无人看管的 Bash 提示符对你的 Linux 服务器环境是一个巨大的安全风险。\n\
  \nBash shell 中的超时功能由 `TMOUT` 环境变量控制。要实现 shell 超时，你只需要将 `TMOUT` 环境变量设置为你希望空闲会话终止的秒数即可。\n\
  \n为了让该设置适用于所有登录，你应该在 `/etc/profile` 脚本中启用它，Bash shell 在每次登录时都会运行该脚本。然而，为了让添加登录脚本更容易，Red\
  \ Hat 系统还会查找 `/etc/profile.d` 目录中的脚本。你可以在 `/etc/profile.d` 目录中创建一个设置 `TMOUT` 环境变量的文件，它将在每次用户账户登录系统并打开\
  \ Bash shell 时运行。同时将 `TMOUT` 环境变量设置为只读也是一个好主意，这样用户就无法覆盖该功能。你可以使用 `readonly` 命令来实现。\n\
  \n因此，要实现此功能，你仅需创建文件 `/etc/profile.d/timeout.sh` 并包含以下两行：\n\n```\nTMOUT=300\nreadonly\
  \ TMOUT\n```\n\n![Line 1: TMOUT equals 300. Line 2: read only TMOUT.](img/9781284255805_CH11_CUM14.jpg)\n\
  \n在这个示例中，我们将超时设置为 300 秒（5 分钟）。现在，如果任何用户账户空闲 5 分钟（300 秒），服务器将终止会话。\n\n### 禁止 root\
  \ 访问\n\n如果你希望你的 Red Hat 服务器像 Ubuntu 那样阻止对 root 用户账户的所有访问，也可以这样做。有几种方法：\n\n*   类似于\
  \ Ubuntu 的方法，可以使用星号作为 root 用户账户的密码。\n*   你可以为 root 用户分配特殊的非登录 shell。\n\n虽然 Ubuntu\
  \ 使用星号作为密码的方法可行，但它通常不是阻止用户访问的首选方法。/sbin/nologin` 文件是一个特殊程序，它向用户显示一条消息然后退出。要激活它，只需在\
  \ `/etc/passwd` 文件中将其设置为 root 用户账户的默认 shell 即可：\n\n```\nroot:x:0:0:root:/root:/sbin/nologin\n\
  ```\n\n![root:x:0:0:root:/root:/sbin/nologin.](img/9781284255805_CH11_CUM15.jpg)\n\
  \n当你当你使用 root 用户账户登录时，你会看到默认警告消息并被断开：\n\n![An output shows the default warning message\
  \ using the ssh command.](img/9781284255805_CH11_CUM16.jpg)\n\n\n\n\n您可以通过创建 `/etc/nologin`\
  \ 文件并输入自定义文本来自定制显示的消息：\n\n![root 用户不可用。请使用 sudo 获取 root 权限。](img/9781284255805_CH11_7.jpg)\n\
  \n现在当您尝试使用 root 用户登录时，将看到自定义消息：\n\n![输出显示了自定义消息。](img/9781284255805_CH11_8.jpg)\n\
  \n描述\n\n## 基于上下文的权限\n\n原始 Linux 权限和为文件目录分配权限的高级 ACL 方法均称为自主访问控制 (DAC) 方法。权限由文件或目录的所有者决定。管理员无法做什么来防止用户向目录中的所有文件授予完全权限。为了给您的\
  \ Linux 系统提供完整的保护，有助于利用强制访问控制 (MAC) 方法。MAC 方法允许管理员根据 Linux 系统中对象的上下文定义安全，以覆盖文件和目录设置的权限。\n\
  \n目前 Linux 中有两种流行的 MAC 实现：\n\n* 适用于 Red Hat 系统的 SELinux\n* 适用于 Ubuntu 系统的 AppArmor\n\
  \n以下章节提供了有关在 Linux 环境中使用 SELinux 和 AppArmor 的详细信息。\n\n### 使用 SELinux\n\n安全增强 Linux\
  \ (SELinux) 是美国国家安全局 (NSA) 的项目，自 2.6 版本以来已集成到 Linux 内核中。现在它是 Fedora、Rocky 和 CentOS\
  \ 等基于 Red Hat 的发行版的标准部分，也是基于 Debian 的发行版的可选安装。\n\nSELinux 通过允许您设置策略规则来控制 Linux 系统上用户、目录、内存、网络端口和进程之间的访问。每当用户或进程尝试访问\
  \ Linux 系统上的对象时，SELinux 都会拦截该尝试并根据策略规则进行评估。\n\n#### 启用 SELinux\n\n`/etc/selinux/config`\
  \ 文件控制 SELinux 的基本操作。您需要设置两个主要选项：\n\n* `SELINUX` 决定 SELinux 的操作。将其设置为 `enforcing`\
  \ 以启用系统上的策略规则并阻止任何未经的访问。当将其设置为 `permissive` 时，SELinux 会监控策略规则并记录任何违反策略的操作但不执行。`disabled`\
  \ 设置完全禁用 SELinux 对系统操作的监控。\n* `SELINUXTYPE` 决定执行哪些策略规则。`targeted` 设置是默认值，仅执行守护进程策略规则。`minimum`\
  \ 设置仅对指定的进程执行策略规则。`mls` 设置使用多级安全，提供遵循 Bell-LaPadula 安全控制模型的先进策略，适用于大多数需要高安全性的美国政府和军事环境。它使用\
  \ `top secret`、`unclassified` 和 `public` 等安全分类。`strict` 设置执行所有守护进程的策略规则，但不建议使用。\n\
  \n要更改 SELinux 的状态，您还可以从命令行使用 `setenforce` 工具。但是，您可以使用该工具在 `enforcing` 和 `permissive`\
  \ 模式之间切换 SELinux。要禁用 SELinux，您必须在 SELinux 文件中进行更改。要查看 SELinux 的当前模式，使用 `getenforce`\
  \ 工具：\n\n```\n第 1 行：$ sudo getforce。第 2 行：Enforcing。第 3 行：$\n```\n(images/9781284255805_CH11_19.jpg)\n\
  \n要查看更详细的 SELinux 状态列表，使用 `sestatus` 工具：\n\n```\n输出使用 sestatus 工具显示更详细的 SEL 状态列表。\n\
  ```\n(images/9781284255805_CH11_20.jpg)\n\n描述\n\n启用 SELinux 后，它开始对策略集中定义的对象执行访问规则。接下来的章节将解释\
  \ SELinux 策略的工作原理。\n\n#### 理解安全上下文\n\nSELinux 为系统上的每个对象标记一个安全上下文。安全上下文 定义了 SELinux\
  \ 应用于该对象的哪些策略。安全内容的格式如下：\n\n```\n用户:角色:类型:级别.\n```\n(images/9781284255805_CH11_21.jpg)\n\
  \n用户和角色属性仅在多级安全模式在使用，并且可能变得非常复杂。运行在默认目标安全模式下的系统仅使用类型属性来设置对象安全类型并据此控制访问。级别属性设置了安全敏感级。\n\
  \n要查看分配给对象的上下文，为 `id`、`ls` 和 `netstat` 等常用命令添加 `-Z` 选项。例如，要查看您的安全上下文：\n\n```\n使用\
  \ id 命令显示安全上下文。\n```\n(images/9781284255805_CH11_22.jpg)\n\n描述\n\n`unconfined_u`\
  \ 用户安全上下文意味着用户账户未分配特定的策略；同样，角色为 `unconfined_r`，类型为 `unconfined_t`。安全上下文 `s0-s0:c0.1023`\
  \ 表示未设置安全级别。\n\n要查看文件的安全上下文，使用：\n\n```\n使用 ls 命令显示安全上下文。\n```\n(images/9781284255805_CH11_23.jpg)\n\
  \n描述\n\n再次，用户和角色属性是未限制的，但现在类型属性被设置为 `user_home_t`。您可以在安全策略中使用此属性设置用户 `$HOME` 目录下文件的访问。\n\
  \n要检查分配给进程的安全上下文，使用：\n\n```\n显示分配给进程的安全上下文。\n```\n(images/9781284255805_CH11_24.jpg)\n\
  \n描述\n\n`sshd` 应用所需的进程被设置为 `system_u` 用户安全上下文和 `system_r` 角色安全上下文。这些表示进程与系统相关。进程的类型安全上下文是不同的，这意味着可以使用独立的策略进行控制。\n\
  \n`semanage` 工具允许您查看和设置系统账户的安全上下文。对于文件和目录，Linux 系统在创建它们时会根据父目录的安全上下文设置它们的安全上下文。您可以使用\
  \ `chcon` 或 `restorecon` 工具来更改分配给文件的默认安全上下文。\n\n`chcon` 格式如下：\n\n```\nchcon -u [新用户]\
  \ -r [新角色] -t [新类型] 文件名\n```\n(images/9781284255805_CH11_25.jpg)\n\n\n\n\nSELinux\
  \ 根据策略控制对系统对象的访问。在目标安全模式（targeted security mode）下，每个策略都定义了特定类型安全上下文内的对象可以访问另一个类型安全上下文内的哪些对象。这被称为类型强制（type\
  \ enforcement）。\n\n例如，标记为 `sshd_t` 类型安全上下文的应用程序仅允许访问标记为 `sshd_t` 类型安全上下文的文件。这限制了应用程序对系统上某些文件的访问。\n\
  \nSELinux 将策略以文本文件的形式维护在 `/etc/selinux` 目录结构中。例如，所有目标安全模式的策略都在 `/etc/selinux/targeted`\
  \ 目录下。\n\n创建自己的策略可能会有些复杂。幸运的是，SELinux 包含了名为模块（modules）的策略组，你可以将其作为标准的 RPM 软件包安装。使用\
  \ `semodule` 工具可以在你的系统中列出、安装和移除策略策略模块。\n\n为了使操作更加简单，SELinux 使用了一种在无需修改策略文件的情况下启用和禁用单个策略的方法。布尔值（Boolean）是一个开关，允许你根据策略名称从命令行启用或禁用策略规则。要查看策略的当前设置，请使用\
  \ `getsebool` 命令：\n\n![输出显示了使用 getsebool 命令的策略当前设置。](img/9781284255805_CH11_CUM26.jpg)\n\
  \n描述\n\n要查看系统所有的策略，请包含 `-a` 选项，如列表 11-2 所示。\n\n列表 11-2 仅显示了 `getsebool` 命令的部分输出；大多数\
  \ Red Hat Linux 环境中默认安装了许多不同的策略。\n\n要更改布尔设置，请使用 `setsebool` 命令：\n\n![输出显示了使用 setsebool\
  \ 命令更改布尔设置。](img/9781284255805_CH11_CUM28.jpg)\n\n描述\n\n此设置仅适用于当前会话。要使更改永久化，必须在命令中添加\
  \ `-P` 选项。这让你对 SELinux 定义的策略设置拥有完全控制。\n\n### 使用 AppArmor\n\n基于 Debian 的 Linux 发行版通常使用\
  \ AppArmor MAC 系统。AppArmor 没有 SELinux 复杂或通用；它只控制应用程序访问的文件和网络端口。\n\nAppArmor 也根据策略定义访问，但将其称为配置文件（profiles）。这些配置文件在\
  \ `/etc/apparmor.d` 目录结构中为每个应用程序定义。通常，每个应用程序包都会安装自己的配置文件。\n\n每个配置文件都是一个文本文件，定义了应用程序允许通信的文件和网络端口，以及每个允许的访问权限。文件的名称通常引用应用程序可执行文件的路径，并将斜杠替换为点。例如，`mysqld`\
  \ 应用程序的配置文件名为 `usr.sbin.mysqld`。\n\n要确定你的 Linux 系统上 AppArmor 的状态，请使用 `aa-status`\
  \ 命令，如列表 11-3 所示。\n\n列表 11-3 中的 `aa-status` 命令输出显示了所有处于强制（enforce）、投诉（complain）或禁用（disabled）状态的配置文件。你可以使用\
  \ `aa-unconfined` 命令查看系统中未定义配置文件的活动网络端口列表：\n\n![输出显示使用 aa-unconfined 命令列出的系统中未定义配置文件的活动网络端口。](img/9781284255805_CH11_CUM31.jpg)\n\
  \n描述\n\n![输出显示使用 aa-unconfined 命令列出的系统中未定义配置文件的活动网络端口。](img/9781284255805_CH11_CUM32.jpg)\n\
  \n描述\n\n![第一行：美元符号 空格 sudo 空格 aa- complain 空格 / u s r / s bin / t c p dump。第二行：将\
  \ / u s r / s bin / t c p dump 设为投诉模式。第三行：美元符号。](img/9781284255805_CH11_CUM33.jpg)\n\
  \n要关闭特定的配置文件，请使用 `aa-complain` 命令，它会将配置文件于投诉模式：\n\n![第一行：美元符号 空格 sudo 空格 aa- disable\
  \ 空格 / u s r / s bin / t c p dump。第二行：正在禁用 / u s r / s bin / t c p dump。第三行：美元符号。](img/9781284255805_CH11_CUM34.jpg)\n\
  \n在投诉模式下，任何违规都将被记录。如果你想完全禁用配置文件，请使用 `aa-disable` 命令：\n\n```\n第一行：美元符号 空格 sudo 空格\
  \ aa- disable 空格 / u s r / s bin / t c p dump。第二行：正在禁用 / u s r / s bin / t c p dump。第三行：美元符号。\n\
  ```\n\n要关闭特定的配置文件，请使用 `aa-complain` 命令，它会将配置文件于投诉模式：\n\n```\n第一行：美元符号 空格 sudo 空格\
  \ aa- complain 空格 / u s r / s bin / t c p dump。第二行：将 / u s r / s bin / t c p dump\
  \ 设为投诉模式。第三行：美元符号。\n```\n\n要关闭特定的配置文件，请使用 `aa-complain` 命令，它会将配置文件于投诉模式：\n\n```\n\
  第一行：美元符号 空格 sudo 空格 aa- disable 空格 / u s r / s bin / t c p dump。第二行：正在禁用 / u s r\
  \ / s bin / t c p dump。第三行：美元符号。\n```\n\n（注：原文末尾存在部分重复内容，此处已根据提供的内容重新组织了逻辑流。）\n\n\
