  © Picsfive/Shutterstock\n\n# 前言\n\nLinux 世界不断变化，要求 Linux 系统管理员具备新的知识和技能。《Linux 基础》的第二版不仅用新材料更新了第一版，还将重点从基础方法转向对\
  \ Linux 的更深入探讨。\n\n本版涵盖了在商业环境中担任 Linux 系统管理员所需的技能。示例同时使用了 Red Hat 和基于 Debian 的发行版，因此你将在这些环境中获得经验。更新后的章节扩展了在网络服务器环境中管理用户、设备和文件系统的覆盖范围。在这些危险的时代，没有什么比安全的\
  \ Linux 系统更重要了。本版增加了一个专注于 Linux 安全的新章节。它涵盖了用于强制访问控制的流行 `SELinux` 和 `AppArmor` 工具，并提供了加密和防火墙建议，以确保您的数据在网络内外的安全。最后，本第二版对虚拟化、容器和编排等热门话题进行了简要介绍。这些已成为\
  \ IT 世界的热点，而 Linux 在这些技术中都发挥了重要作用。最后一章概述了如何在 Linux 环境中使用这些技术。\n\n![一张显示烟雾纹理的抽象图像。](img/FM-opener.jpg)\n\
