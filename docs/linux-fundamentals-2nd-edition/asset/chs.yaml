  \ |\n| file1 -nt file2 | 文件 | 检查 file1 是否比 file2 新 |\n| file1 -ot file2 | 文件 | 检查\
  \ file1 是否比 file2 旧 |\n\n以下是在脚本中使用 if-then 语句的示例：\n\n![示例展示了两种命令替换格式的用法。](img/9781284255805_CH06_CUM52.jpg)\n\
  \n描述\n\n![第 1 行：if 左括号 条件 右括号。第 2 行：then。第 3 行：缩进，命令。第 4 行：f i。](img/9781284255805_CH06_CUM53.jpg)\n\
  \n该脚本比较前两个命令行参数（`$1` 和 `$2`），并判断哪一个较大或它们是否相等。在设置好运行权限后，你可以对其进行测试：\n\n![展示了在脚本中使用\
  \ if-then 语句的示例。](img/9781284255805_CH06_CUM54.jpg)\n\n描述\n\n 脚本只会处理逻辑值为真（True）的\
  \ if-then 语句中的命令。\n\n### 循环\n\n在编写脚本时，你经常会发现多次重复执行相同的命令会非常方便，例如对目录中的所有文件执行某个命令。bash\
  \ shell 提供了一些基本的循环命令来满足这一需求。\n\n`for` 语句遍历序列中的每一个元素，例如目录中的文件或文本文档中的行。`for` 命令的格式如下：\n\
  \n![继续](img/9781284255805_CH06_CUM55.jpg)\n\n描述\n\n变量变成一个占位符，在每次迭代中获取序列中每个元素的值。命令可以像你在脚本中定义的任何其他变量一样使用该变量。这里是一个展示如何使用\
  \ `for` 循环遍历目录中所有文件的示例：\n\n![第 1 行：dollar c h mod u plus x script 5 dot s h。第 2\
  \ 行：dollar dot slash script 5 dot s h 10 5\\。第 3 行：第一个值大于第二个值。第 4 行：dollar。](img/9781284255805_CH06_CUM56.jpg)\n\
  \n![第 1 行：for variable in series semicolon do。第 2 行：缩进，命令。第 3 行：done。](img/9781284255805_CH06_CUM57.jpg)\n\
  \n如果你运行 `script6.sh` shell 脚本，你应该看到家目录下文件和目录的列表：\n\n![脚本展示了如何使用 for 循环遍历目录中的所有文件。](img/9781284255805_CH06_CUM58.jpg)\n\
  \n描述\n\n这节省了在了一堆 if-then 或 case 语句中手动检查每个文件的大量编码工作！\n\n另一个有用的循环语句是 `while` 命令。它的格式如下：\n\
  \n![继续](img/9781284255805_CH06_CUM59.jpg)\n\n描述\n\n只要指定的条件逻辑值为真（True），`while` 循环就会持续进行。当条件逻辑值为假（False）时，循环停止。`while`\
  \ 循环使用的条件与 if-then 语句的相同，因此你可以测试数字、字符串和文件。这里有一个演示使用 `while` 循环计算数字阶乘的示例：\n\n![输出展示了家目录下文件和目录的列表。](img/9781284255805_CH06_CUM60.jpg)\n\
  \n描述\n\nshell 脚本获取传递给脚本的第一个参数并在 `while` 循环中使用它。只要 `$number` 变量中存储的值大于 0，`while`\
  \ 循环就会持续执行。在每次循环迭代中，该值都会减 1，因此在某个时刻 `while` 条件会变为假。当发生这种情况时，`factorial` 变量包含了最终计算结果。当你运行\
  \ `script7.sh` 程序时，将得到以下结果：\n\n![第 1 行：while 左括号 条件 右括号 分号 do。第 2 行：缩进，命令。第 3 行：done。](img/9781284255805_CH06_CUM61.jpg)\n\
  \n`while` 循环承担了遍历系列文件的繁重工作。`while` 循环承担了遍历系列文件的繁重工作。\n\n![输出展示了家目录下文件和目录的列表。](img/9781284255805_CH06_CUM60.jpg)\n\
  \n\n\n\n\nLinux 虚拟目录结构包含一个单一根目录，称为根。根目录下的目录和文件是根据访问它们时使用的目录路径列出的，这与 Windows 的方式类似。\n\
  \n例如，Linux 文件路径 `/home/rich/Documents/test.doc` 仅表示文件 `test.doc`  `Documents` 目录下，该目录位于\
  \ `rich` 目录下，而 `rich` 又位于 `home` 目录下。它没有提供关于该文件存储在 PC 上哪个物理磁盘的任何信息。\n\nLinux 虚拟目录的特殊之处在于它如何整合每个存储设备。在\
  \ Linux PC 中安装的第一块硬盘被称为根分区。根分区包含了虚拟目录的核心。其他所有内容都从那里构建。\n\n在根分区上，Linux 创建了名为挂载点的特殊目录。挂载点是虚拟目录中的目录，你可以在其中分配额外的存储设备。\n\
  \n虚拟目录使得文件和目录出现在这些挂载点目录中，尽管它们在物理上存储在不同的硬盘上。\n\n通常，系统文件物理存储在根分区上，而用户文件存储在不同的硬盘上，如图图\
  \ 7-1](#9781284254884_CH07_01.xhtml_c7-fig001)所示。\n\n![图表显示了分布在两个磁盘之间的 Linux 文件结构。](img/9781284255805_CH07_FIGF01.jpg)\n\
  \n图 7-1 Linux 文件结构。\n\n描述\n\n在图 7-1 中，PC 上有两个硬盘。其中一个硬盘与虚拟目录的根相关联（由单个正斜杠 `/` 表示）。其他硬盘可以挂载到虚拟目录结构的任何位置。在例示例中，第二个硬盘挂载在\
  \ `/home` 位置，这是用户目录所在的位置。\n\nLinux 文件系统结构是从 Unix 文件结构演变而来的。遗憾的是，Unix 文件结构多年来由于不同版本的\
  \ Unix 变得有些错复杂。为了帮助解决 Linux 世界的这个问题，Linux 基金会开发了 Linux 文件系统层次结构标准 (FHS)。它为 Linux\
  \ 系统上的虚拟目录定义了标准结构。虽然不是强制性的，但大多数 Linux 发行版现在都遵循这一结构。表 7-1 列出了 FHS 中包含的一些较常见的 Linux\
  \ 虚拟目录名。\n\n表 7-1 Linux 文件系统层次结构标准。\n\n| 目录 | 用途 |\n| --- | --- |\n| `/` | 虚拟目录的根。通常在此处放置任何文件。\
  \ |\n| `/bin` | 二进制目录，存储基本的的用户级实用程序。 |\n| `/boot` | 启动目录，存储启动文件。 |\n| `/dev` | 设备目录，Linux\
  \ 在此处创建设备节点。 |\n| `/etc` | 系统配置文件目录。 |\n| `/home` | 目录，Linux 在此处创建用户目录。 |\n| `/lib`\
  \ | 库目录，存储系统和应用程序库文件。 |\n| `/media` | 介质目录，用于可移动介质的挂载点的常用位置。 |\n| `/mnt` | 挂载目录，另一个用于临时挂载介质的挂载点常用位置。\
  \ |\n| `/opt` | 可选目录，通常用于存储可选软件包。 |\n| `/proc` | 进程目录，是一种虚拟文件系统，通过系统生成的单个文件提供进程和内核信息。\
  \ |\n| `/root` | root 用户的家目录。 |\n| `/run` | 运行目录，包含自上次启动以来的系统信息。 |\n| `/sbin` |\
  \ 系统二进制目录，存储了许多管理员级实用程序。 |\n| `/sys` | 系统目录，包含有关设备、驱动程序某些内核功能的信息文件。 |\n| `/tmp`\
  \ | 临时目录，可以在此处创建和删除临时工作文件。该目录通常在每次系统重启后被清理。 |\n| `/usr` | 用户安装的软件目录，此目录通常被设置为只读以保护安装软件的完整性。\
  \ |\n| `/var` | 变量目录，用于频繁变化的文件，例如日志文件。 |\n\n当你启动一个新的 shell 提示符时，你的会话从你的家目录开始，该目录是为你的用户账户分配的唯一目录。创建一个用户账户时，系统通常会为该账户分配唯一的目录。\n\
  \n在 Windows 世界中，你可能习惯于使用图形用户界面在目录结构中移动。要从命令行界面 (CLI) 提示符在虚拟目录中移动，你需要学习使用 `cd` 命令。\n\
  \n### 遍历目录\n\n切换目录命令（`cd`）将是你用于将 shell 会话移动到 Linux 文件系统中另一个目录的命令。`cd` 命令的格式非常简单：\n\
  \n![cd 目标](img/9781284255805_CH07_C02)\n\n`cd` 命令可以接受一个参数，目标，用于指定你想去的目录。如果你没有在 `cd`\
  \ 命令上指定目标，它将带你进入家目录。\n\n但是，目标参数可以使用两种不同的方法表示：\n\n*   绝对路径\n*   相对路径\n\n接下来的章节将描述这两种方法之间的区别。\n\
  \n#### 绝对路径\n\n你可以使用绝对路径在虚拟目录内引用目录名。绝对路径定义了该目录在虚拟目录中的确切位置，类似于目录的全名。\n\n因此，为了引用 `apache`\
  \ 目录（它包含在 `lib` 目录下，而 `lib` 又在 `usr` 目录下），你将使用绝对路径：\n\n`/usr/lib/apache`\n\n使用绝对路径，对于你想去哪里没有疑问。要使用绝对路径移动到文件系统中的特定位置，只需指定完整路径：\n\
  \n```\ncd /usr/lib/apache\n```\n\n在大多数 Linux 发行版中，提示符显示当前目录（波浪号代表你的用户目录）。你可以使用绝对路径移动到整个虚拟目录的任何层次。\n\
  \n然而，如果你只是在自己的家结构内工作，通常使用绝对路径可能会很繁琐。例如，如果你已经在 `/home/rich` 目录下，为了进入你的 Documents\
  \ 目录，似乎必须输入命令：\n\n```\ncd /home/rich/Documents\n```\n\n这听起来有些累赘。幸运的是，有一个更简单的解决方案。\n\
  \n#### 相对路径\n\n相对路径 允许你相对于当前位置指定目标目录，而无需从根目录开始。相对路径不以表示根目录的正斜杠 `/`开头。\n\n相反，相对路径以目录名开头（如果你正在遍历到当前目录下的目录），或以表示当前目录位置相对位置的特殊字符开头。有两个特殊字符用于此：\n\
  \n*   单点 (`.`) 表示当前目录\n*   双点 (`..`) 表示父目录\n\n\n\n\n\n双点字符（..）在在遍历目录层级结构时非常有用。例如，如果你位于主目录下的\
  \ `Documents` 目录，需要进入同样位于主目录下的 `Desktop` 目录，你可以这样做：\n\n![Line 1: rich at Ubuntu\
  \ 02 space Documents dollar space c d space double dot slash Desktop. Line 2: rich\
  \ at ubunut 02 space Desktop dollar.](img/9781284255805_CH07_CUM06.jpg)\n\n双点字符会将你带回上一级回到主目录，然后\
  \ `/Desktop` 部分又会带你进入 `Desktop` 目录。你可以根据需要使用任意数量的双点字符进行移动。例如，如果你在主目录（`/home/rich`）并想去\
  \ `/etc` 目录，你可以输入：\n\n![Line 1: rich at ubunut 02 space tilde dollar space c d space\
  \ double dot slash double dot slash e t c. Line 2: rich at Ubuntu 02 space e t c\
  \ dollar.](img/9781284255805_CH07_CUM07.jpg)\n\n当然，在这种情况下，使用相对路径实际上需要输入更多内容，而不是直接输入绝对路径\
  \ `/etc` 简单！\n\n## Linux 文件\n\nUnix 操作系统在 20 世纪 70 年代最初创建时，其独特之处之一是它将计算机系统上的一切都视为文件：硬件设备、数据、网络连接，所有一切。这简化了程序与硬件以及程序之间交互的方式，因为无论你的数据来自哪里，Unix\
  \ 操作系统都以相同的方式处理它。虽然这看起来很奇怪，但它彻底改变了计算机世界，并让 Unix 操作系统如此流行。\n\n然而，由于一切都是文件，你会遇到一些问题。其中一个问题就是识别文件类型。本节将介绍\
  \ Linux 如何处理文件名，并提供一些关于如何在 Linux 系统上确定文件类型的提示。\n\n### 确定文件类型\n\nLinux 数据文件涵盖了非常广泛的文件类型——从文本数据到可执行程序。由于\
  \ Linux 文件并不强制使用文件扩展名，有时很难判断哪些文件是程序，哪些文件是文本数据，哪些文件是二进制数据。幸运的是，有一个命令行工具可以提供帮助。\n\n\
  `file` 命令返回指定文件的类型。如果该文件是数据文件，它还会尝试检测该文件包含的内容：\n\n![显示了 file 命令的输出。](img/9781284255805_CH07_CUM08.jpg)\n\
  \n描述\n\n在这个示例中，`myprog.c` 文件是一个 C 程序文本文件，而 `myprog` 文件是一个二进制可执行程序。\n\n### 文件名\n\n\
  当你浏览 Linux 系统上的目录时，首先会注意到 Linux 的文件命名标准与 Windows 不同。在 Windows 世界中，你可能习惯看到每个文件后面都带有三个或四个字符的文件扩展名（例如\
  \ Word 文档的 `.docx`）。Linux 不需要通过文件扩展名来识别系统上的文件类型（尽管如果你喜欢使用，它是允许的）。\n\nLinux 文件名可以是任意长度的字符，尽管\
  \ 255 是文件名的实际限制（当文件名超过这个长度时，某些程序处理起来会遇到困难）。Linux 文件名可以包含大小写字母、数字和大多数特殊字符（唯一不允许的字符是正斜杠\
  \ `/` 和 `NULL` 字符）。Linux 文件名可以包含空格以及外语字符。然而，文件名始终以字母或数字开头。\n\n这里是一些有效 Linux 文件名的示例：\n\
  \n![Line 1: testing. Line 2: A space test space file dot t x t. Line 3: 4 underscore\
  \ data underscore points. Line 4: my dot long dot program dot name.](img/9781284255805_CH07_CUM09.jpg)\n\
  \n### 隐藏文件\n\nLinux 文件名的另一个与 Windows 不同的特性是隐藏文件。隐藏文件不会出现在普通的文件列表中。在 Windows 世界中，你使用文件属性来使文件在普通视图中变为隐藏。当普通用户显示目录列表时，隐藏文件不会出现，但当管理员显示目录列表时，隐藏文件会神奇地出现在输出中。这一功能有助于保护重要的系统文件免被意外删除或覆盖。\n\
  \nLinux 不使用文件属性来使文件隐藏。相反，它使用文件名。以点（.）开头的文件名被视为隐藏文件，因为当你使用 `ls` 命令或使用图形化文件管理器工具显示时，它们不会出现在普通列表中。不过，你可以使用选项在\
  \ `ls` 命令或文件管理器工具中显示隐藏文件。图 7-2 显示了在 Ubuntu 中设置“文件”图形文件管理器工具显示隐藏文件。\n\n![截图显示使用 Ubuntu\
  \ 中的 Files 显示隐藏文件。](img/9781284255805_CH07_FIGF02.jpg)\n\n图 7-2 使用 Ubuntu 中的 Files\
  \ 显示隐藏文件。由 Canonical Ltd. 提供。\n\n描述\n\n要用 `ls` 命令显示隐藏文件，你需要包含 `-a` 参数：\n\n![显示 ls\
  \ 命令配合 a 参数显示隐藏文件的输出。](img/9781284255805_CH07_CUM10.jpg)\n\n![显示 ls 命令配合 a 参数显示隐藏文件。](img/9781284255805_CH07_CUM11.jpg)\n\
  \n描述\n\n在这个示例中，`ls` 命令本身只显示主目录中的几个目录。添加 `-a` 参数会显示目录中的所有隐藏文件。许多 Linux 程序将你的设置存储在每个用户目录的隐藏文件中。\n\
  \n### 文件节点 (Inodes)\n\nLinux 必须为系统上的每个文件跟踪大量信息。实现方法是使用索引节点，也称为 inode。Linux 操作系统为每个文件创建一个\
  \ inode 来存储文件属性。inode 是隐藏的；只有操作系统可以访问它们。每个 inode 还分配了一个数字，称为 inode 号。Linux 使用它来引用文件，而不是文件名。inode\
  \ 号在每个磁盘分区上都是唯一的。\n\nLinux 还在每个磁盘分区上创建一个表，称为 inode 表。inode 表包含分配给磁盘分区上每个文件的 inode\
  \ 号列表。当你创建和删除文件时，Linux 在后台自动更新 inode 表。然而，如果系统突然关闭（例如由于电源故障），inode 表可能会损坏。幸运的是，有一些工具可以帮助重组\
  \ inode 表并防止数据丢失。遗憾的是，如果 inode 表确实无法修复，你将无法访问分区上的文件，即使实际文件还在那里！\n\n要查看文件的 inode\
  \ 号，请在 `ls` 命令中使用 `-i` 选项。你可以将其与 `-l` 选项结合，生成详细列表以显示有关文件的更多信息：\n\n```![显示 ls 命令配合\
  \ i l 参数的输出结果。](img/9781284255805_CH07_CUM12.jpg)\n```\n\n描述\n\n详细列表中显示的第一个数字是每个文件的\
  \ inode 号。注意 `myprog.c` 文件的 inode 号与 `copy.c` 文件的相同。这意味着这两个文件之间存在硬链接。硬链接指向与原始文件相同的物理磁盘位置，因此\
  \ inode 号是相同的。\n\n## 文件和目录列表\n\n\n\n\n\nShell 最基本的功能是查看系统上可用哪些文件。`ls` 命令就是实现此操作的工具。本节将介绍\
  \ `ls` 命令以及所有用于格式化其所提供信息的选项。\n\n### 基本列出\n\n最基本形式的 `ls` 命令显示位于当前目录下的文件和目录：\n\n![输出使用\
  \ l s 命令显示了当前目录下的文件和目录。](img/9781284255805_CH07_CUM13.jpg)\n\n注意，`ls` 命令按字母顺序生成列表（按列而非按行显示）。如果你使用的是支持颜色的终端模拟器，`ls`\
  \ 命令可能还会用不同的颜色显示不同类型的条目。`LS_COLORS` 环境变量控制着此功能。不同的 Linux 发行版会根据终端模拟器的能力设置此环境变量。\n\
  \n如果你没有带颜色的终端模拟器，可以在使用 `ls` 命令时配合 `-F` 参数来轻松区分文件和目录。使用 `-F` 参数会产生如下输出：\n\n![输出使用\
  \ l s 命令配合连字符 F 参数区分了文件和目录。](img/9781284255805_CH07_CUM14.jpg)\n\n`-F` 参数现在会在目录后标记一个正斜杠，以帮助在列表中识别它们。同样，它会在可执行文件（如上面的\
  \ `test.sh` 文件）后标记一个星号，帮助你更容易地找到可以在系统上运行的文件。\n\n`-R` 参数是另一个可使用的 `ls` 参数。它会显示包含在当前目录下的的文件。如果你有很多目录，这个列表可能会非常长。这里是\
  \ `-R` 参数产生的简单示例：\n\n![输出使用 l s 命令配合连字符 F 和连字符 R 参数显示了包含在当前目录下的的文件。](img/9781284255805_CH07_CUM15.jpg)\n\
  \n注意，首先，`-R` 参数显示了当前目录的内容，包含一个文件（`file1`）两个目录（`test1` 和 `test2`）。随后，它会遍历这两个目录，显示每个目录内是否包含任何文件。`test1`\
  \ 目录显示两个文件（`myprog1` 和 `myprog2`），而 `test2` 目录不包含任何文件。如果 `test1` 或 `test2` 目录中还有进一步的子目录，`-R`\
  \ 参数将继续遍历这些目录。如你所示，对于大型目录结构，这可能会变成一个巨大的输出列表。\n\n### 修改列表信息\n\n正如你在基本列表中所看到的，`ls`\
  \ 命令并没有关于每个文件产生太多信息。为了列出额外信息，另一个常用参数是 `-l`。`-l` 参数产生长列表格式，为目录中的每个文件提供更多信息：\n\n![输出使用\
  \ l s 命令配合连字符 l 参数显示了关于目录中每个文件的更多信息。](img/9781284255805_CH07_CUM16.jpg)\n\n长列表格式每行列出目录中包含的每个文件和目录。除了文件名，它还显示了额外的有用信息。输出的第一行显示了该目录中包含的块总数。之后，每行包含关于每个文件（或目录）的以下信息：\n\
  \n*   文件类型（例如目录 `(d)`、文件 `(-)`、字符设备 `(c)` 或块设备 `(b)`）\n*   文件的权限字符串，表示用户、组和其他用户的权限\n\
  *   指向文件的硬链接数\n*   文件所有者的用户名\n*   文件所属组的组名\n*   以字节为单位的文件大小\n*   最后修改的时间\n*   文件或目录名称\n\
  \n`-l` 参数是一个非常强大的工具。拥有了这些信息，你可以查看系统上任何文件或目录的所需的任何信息。\n\n### 完整参数列表\n\n`ls` 命令有很多参数，在进行文件管理时会大派用场。如果你对\
  \ `ls` 使用 `man` 命令，你将看到几页可用的参数，供你使用它们来修改 `ls` 命令的输出。\n\n`ls` 命令使用两种类型的命令行参数：\n\n\
  *   单字母参数\n*   全单词（长）参数\n\n单字母参数前总是跟有一个单连字符 `-。全单词参数更具描述性，并带有一个双连字符 `--。许多参数同时具有单字母和全单词版本，而某些参数只有一种类型。表\
  \ 7-2 列出了一些可以帮助你使用 bash `ls` 命令的常用参数。\n\n表 7-2 常用 `ls` 命令参数。\n\n| 单字母 | 全单词 | 描述\
  \ |\n| --- | --- | --- |\n| `-a` | `--all` | 不忽略以点开头的条目。 |\n| `-A` | `--almost-all`\
  \ | 不列出 `.` 和 `..` 文件。 |\n| | `--author` | 每个文件的作者。 |\n| `-b` | `--escape` | 为不可打印字符打印八进制值。\
  \ |\n| | `--block-size=size` | 使用字节块计算块大小。 |\n| `-B` | `~` | 不列出带有波浪号 (`~`) 符号的条目（用于指示备份）。\
  \ |\n| `-c` | | 按修改时间排序。 |\n| `-C` | | 按列列出。 |\n| | `--color=when` | 何时使用颜色（始终、从或自动）。\
  \ |\n| `-d` | `--directory` | 列出目录本身而非内容，不跟踪链接。 |\n| `-F` | `--classify` | 为条目添加文件类型指示。\
  \ |\n| | `--file-type` | 仅对某些文件类型添加指示（非可执行）。 |\n| | `--format=word` | 输出格式为跨行、逗号、长、单列、垂直。\
  \ |\n| `-g` | | 列出除所有者外的完整信息。 |\n| | `--group-directories-first` | 先列出目录。 |\n| `-G`\
  \ | `--no-group` | 在列表中不显示组名。 |\n| `-h` | `--human-readable` | 使用千字节、兆字节和吉字节为单位打印大小。\
  \ |\n| | `--si` | 与 `-h` 相同，但使用 1000 代替 1024。 |\n| `-i` | `--inode` | 显示每个文件的索引节点\
  \ (inode)。 |\n| `-l` | | 显示长列表格式。 |\n| `-L` | `--dereference` | 为链接文件显示原始文件的信息。\
  \ |\n| `-n` | `--numeric-uid-gid` | 使用数字 uid 和 gid 代替名称。 |\n| `-o` | | 在列表中不显示所有者。\
  \ |\n| `-r` | `--reverse` | 反转文件和目录的排序顺序。 |\n| `-R` | `--recursive` | 递归列出子目录内容。\
  \ |\n| `-s` | `--size` | 每个文件的块大小。 |\n| `-S` | `--sort=size` | 按文件大小排序。 |\n| `-t`\
  \ | `--sort=time` | 按文件修改时间排序。 |\n| `-u` | | 显示文件最后访问时间而非最后修改时间。 |\n| `-U` | `--sort=none`\
  \ | 不排序输出列表。 |\n| `-v` | `--sort=version` | 按文件版本排序。 |\n| `-x` | | 按行列出而非按列。 |\n\
  | `-X` | `--sort=extension` | 按文件扩展名排序。 |\n\n\n\n\n如果你愿意，可以同时使用多个参数。双横杠参数必须单独列出，但单横杠参数可以组合成一个字符串放在横杠后面。常用的组合方式是使用\
  \ `-a` 参数列出所有文件，使用 `-i` 参数列出每个文件的 inode（索引节点），使用 `-l` 参数生成详细列表，以及使用 `-s` 参数列出文件的块大小。文件或目录的\
  \ inode 是内核为文件系统中的每个对象分配的唯一标识符。将所有这些参数结合就创建了一个易记的 `-sail` 参数：\n\n![显示了使用 l s 命令配合横杠\
  \ sail 参数的输出](img/9781284255805_CH07_CUM17.jpg)\n\n描述\n\n除了正常的 `-l` 参数输出的信息外，你还会看到每行中额外添加了两个数字。列表中的第一个数字是文件或目录的\
  \ inode 号。第二个数字是文件的块大小。\n\n## 目录处理\n\n在 Linux 中，有一些命令同时适用于文件和目录，而有些命令仅适用于目录。本节将讨论仅适用于目录的命令。\n\
  \n### 创建目录\n\n在 Linux 中创建新目录并不复杂，只需使用 `mkdir` 命令即可：\n\n![输出显示了 m k d i r 和 l s 配合横杠\
  \ i l 命令的用法](img/9781284255805_CH07_CUM18.jpg)\n\n描述\n\n![输出显示了 m k d i r 和 l s\
  \ 配合横杠 i l 命令的用法](img/9781284255805_CH07_CUM19.jpg)\n\n描述\n\n系统会创建一个新目录并为其分配一个新的\
  \ inode 号。\n\n### 删除目录\n\n删除目录可能是很复杂的，但这有其原因。当你开始删除目录时，有很多发生坏事的机会。Bash 会尽可能地保护我们免受意外灾难的影响。删除目录的基本命令是\
  \ `rmdir`：\n\n![第 1 行：$ r m d i r d i r 3\\。第 2 行：$ r m d i r d i r 1\\。第 3 行：r\
  \ m d i r: d i r 1: Directory not empty（目录非空.）。第 4 行：$。](img/9781284255805_CH07_CUM20.jpg)\n\
  \n默认情况下，`rmdir` 命令仅用于删除空目录。由于 `dir1` 目录有一个文件，`rmdir` 命令拒绝删除它。你可以使用 `--ignore-fail-on-non-empty`\
  \ 参数来删除非空目录。\n\n处理目录时你也可以使用 `rm` 命令。\n\n如果你尝试像处理文件一样不带参数使用它，你会感到有些失望：\n\n![第 1 行：$\
  \ r m d i r 1\\。第 2 行：rm: d i r 1 is a directory（这是一个目录）。第 3 行：$。](img/9781284255805_CH07_CUM21.jpg)\n\
  \n然而，如果你真的想删除一个目录，可以使用 `-r` 参数递归地删除目录中的文件，然后删除目录本身：\n\n![输出显示了使用配合横杠 r 的 rm 命令删除目录中的文件，然后删除目录本身](img/9781284255805_CH07_CUM22.jpg)\n\
  \n描述\n\n虽然这种方法可行，但有些笨拙。注意，你仍然必须验证每个被删除的文件。对于包含大量文件和子目录的目录，这可能会变得非常乏味。\n\n不顾一切并删除整个目录（包括所有内容）的终极解决方案是使用带有\
  \ `-r` 和 `-f` 参数的 `rm` 命令：\n\n![第 1 行：$ r m -r f d i r 2\\。第 2 行：$。](img/9781284255805_CH07_CUM23.jpg)\n\
  \n就是这样。没有警告，没有张仗，只有一个另一个 shell 提示符。当然，这是一个极其危险的工具，特别是当你以 root 用户身份登录时。请谨慎使用，并仅在三重检查确保你完全按照自己的意图操作后再使用。\n\
  \n## 文件处理\n\nBash 提供了许多用于操作 Linux 文件系统上文件的命令。本节将介绍你从命令行界面（CLI）处理文件以满足所有文件处理需求所需的基本命令。\n\
  \n### 创建文件\n\n偶尔你会遇到需要创建一个空文件的情况。有时应用程序在写入日志之前期望该日志文件存在。在这些情况下，你可以使用 `touch` 命令轻松地创建一个空文件：\n\
  \n![输出显示了 touch 命令](img/9781284255805_CH07_CUM24.jpg)\n\n描述\n\n`touch` 命令也可以用于在不改变文件的情况下修改访问时间：\n\
  \n![显示了 touch 命令](img/9781284255805_CH07_CUM25.jpg)\n\n描述\n\n默认情况下，`touch` 使用当前时间。如果你只想更改访问时间，使用\
  \ `-a` 参数。如果只想更改修改时间，使用 `-m` 参数。\n\n![显示了带有时间戳的 touch 命令](img/9781284255805_CH07_CUM26.jpg)\n\
  \n描述\n\n### 复制文件\n\n将文件和目录从文件系统的一个位置复制到另一个位置是系统管理员的常见做法。`cp` 命令提供了这种功能。\n\n最基本的形式\
  \ `cp` 使用两个参数：源对象和目标：\n\n![源 目标](img/9781284255805_CH07_CUM27.jpg)\n\n当两个参数都是文件名时，`cp`\
  \ 将源文件复制到指定为目标的新文件中。新文件就像一个全新的文件，具有更新的创建和最后修改时间：\n\n![显示了将源文件复制到新文件的 cp 输出](img/9781284255805_CH07_CUM28.jpg)\n\
  \n描述\n\n新文件显示出不同的 inode 号，表明它是一个全新的文件。你还会注意到 `test2` 文件的修改时间是它创建的时间。如果目标文件已存在，`cp`\
  \ 命令将提示你是否要覆盖它：\n\n![第 1 行：$ cp test 1 test 2\\。第 2 行：cp: overwrite test 2? y。第\
  \ 3 行：$。](img/9781284255805_CH07_CUM29.jpg)\n\n如果你不回答 `y`，文件复制将不会进行。你也可以将文件复制到现有目录：\n\
  \n![显示了将文件复制到现有目录的 cp 用](img/9781284255805_CH07_CUM30.jpg)\n\n描述\n\n新文件现在位于 `dir1`\
  \ 目录下，文件名与原始文件相同。这些示例都使用了相对路径，但你同样可以为源和目标对象使用绝对路径。\n\n要将文件复制到当前所在的目录，你可以使用 `.` 符号：\n\
  \n![第 1 行：$ cp /home/rich/dir1/test 1 .。第 2 行：cp: overwrite ./test 1?](img/9781284255805_CH07_CUM31.jpg)\n\
  \n\n\n\n与大多数命令一样，`cp` 命令也有几个命令行参数可以帮助你。这些参数显示在表 7-3 中。\n\n## 表 7-3 `cp` 命令参数。\n\n\
  | 参数 | 描述 |\n| --- | --- |\n| -a | 通过保留属性来归档文件。 |\n| -b | 为每个存在的目标文件创建备份，而不是覆盖它。\
  \ |\n| -d | 保留。 |\n| -f | 强制覆盖已的目标文件而无需提示。 |\n| -i | 在覆盖目标文件之前提示。 |\n| -l | 创建文件链接而不是复制文件。\
  \ |\n| -p | 在可能的情况下保留文件属性。 |\n| -r | 递归复制文件。 |\n| -R | 递归地复制目录。 |\n| -s | 创建符号链接而不是复制文件。\
  \ |\n| -S | 覆盖备份功能。 |\n| -u | 仅当源文件的日期和时间新于目标文件时才复制（更新）。 |\n| -v | 详细模式，解释正在发生什么。\
  \ |\n| -x | 将复制限制在当前文件系统中。 |\n\n使用 `-p` 参数可以将原始文件的访问时间或修改时间保留到复制后的文件中。\n\n![输出保留了复制文件的原始文件访问或修改时间。](img/9781284255805_CH07_CUM32.jpg)描述\n\
  \n![输出保留了复制文件的原始文件访问或修改时间。](img/9781284255805_CH07_CUM33.jpg)\n\n描述\n\n现在，尽管 `test3`\
  \ 文件是一个全新的文件，但它的时间戳与原始的 `test1` 文件相同。\n\n`-R` 参数非常强大。它允许你在一个命令中递归地复制整个目录的内容：\n\n\
  ![输出使用 `cp` 命令和连字符 R 参数复制整个目录的内容。](img/9781284255805_CH07_CUM34.jpg)\n\n描述\n\n现在\
  \ `dir2` 是 `dir1` 的完整拷贝。\n\n你还可以在 `cp` 命令中使用通配符：\n\n![输出显示了使用 `cp` 命令将所有以 test 开头的文件复制到\
  \ dir2 用。](img/9781284255805_CH07_CUM35.jpg)\n\n描述\n\n该命令将所有以 test 开头的文件复制到了 `dir2`。`-f`\
  \ 参数强制覆盖目录中已有的 `test1` 文件，而无需询问。\n\n### 链接文件\n\n你可能已经注意到 `cp` 命令的几个参数提到了文件链接。这是\
  \ Linux 文件系统中一个非常酷的选项。如果你需要在系统中维护同一个文件的两个（或多个）副本，而不是拥有独立的物理副本，你可以使用一个物理副本和多个虚拟副本，称为链接。链接是目录中的一个占位符，指向文件的真实位置。Linux\
  \ 中有两种不同的文件链接：\n\n*   符号链接或软链接\n*   硬链接\n\n硬链接创建了一个单独的文件，但它指向与原始文件相同的 inode 编号，因此文件系统中没有创建物理文件。硬链接文件包含关于原始文件的信息，就像普通文件一样。当你引用硬链接文件时，就像你在引用原始文件一样：\n\
  \n![输出显示了使用 `cp` 命令和连字符 `l` 参数的四个文件的详情。](img/9781284255805_CH07_CUM36.jpg)\n\n描述\n\
  \n`-l` 参数为 `test1` 文件创建了一个名为 `test4` 的硬链接。文件列表显示 `test1` 和 `test4` 文件的 inode 编号相同，这表明实际上它们都是同一个文件。还要注意，链接计数（列表中的第三项项）现在显示两个文件都有两个链接。\n\
  \n另一方面，`-s` 参数创建一个符号链接（或软链接）：\n\n![输出显示了使用 `cp` 命令和连字符 `s` 参数的五个文件的详情。](img/9781284255805_CH07_CUM37.jpg)\n\
  \n描述\n\n文件列表中有几点需要注意。首先，你会发现新的 `test5` 文件的 inode 编号与 `test1` 文件不同，这表明 Linux 系统将其视为一个单独的文件。其次，文件大小是不同的。链接文件只需要存储关于源文件的信息，而不是文件中的实际数据。列表的文件名区域显示了两个文件之间的关系。\n\
  \n在复制链接文件时要小心。如果你使用 `cp` 命令复制一个链接到另一个源的文件，你所做的只是创建了源文件的另一个副本。这可能会很快变得混乱。\n\n与其复制链接文件，不如为原始文件创建另一个链接。你可以对对同一个文件创建许多链接而不会出现任何问题。然而，你也不想对其他软链接文件创建软链接。这会创建一个链接链，不仅会令人困惑，而且很容易损坏，导致各种问题。\n\
  \n### 重命名文件\n\n在 Linux 世界中，重命名文件被称为“移动”。`mv 命令可将文件和目录移动到另一个位置：\n\n![输出显示了五个文件的详情并使用了\
  \ `mv` 命令。](img/9781284255805_CH07_CUM38.jpg)\n\n描述\n\n注意，移动文件更改了文件名，但保留了相同的 inode\
  \ 编号和时间戳值。移动带有软链接的文件是个问题：\n\n![输出显示了五个文件的详情并使用了 `mv` 命令。](img/9781284255805_CH07_CUM39.jpg)\n\
  \n描述\n\n![输出显示了五个文件的详情并使用了 `mv` 命令。](img/9781284255805_CH07_CUM40.jpg)\n\n描述\n\n\
  使用硬链接的 `test4` 文件仍然使用相同的 inode 编号，这是正常的。但是 `test5` 指向无效的文件，不再是一个有效的链接。如果你的终端使用颜色识别文件类型，`test5`\
  \ 将显示为红色，表示它是无效文件。如果你将文件移回 `test1` 名称（或使用 `test1` 名称创建文件），`test5` 链接将变为有效。\n\n你还可以使用\
  \ `mv` 命令移动目录：\n\n```\n第 1 行：$ mv dir2 dir4\n```\n![images/9781284255805_CH07_CUM41.jpg)整个目录的内容没有变化。改变的是目录的名字。###\
  \ 删除文件在你的 Linux 涯的某个时刻，你很可能想要删除现有文件。无论是清理文件系统还是移除软件包，总会有删除机会。在 Linux 世界中，删除被称为“移除”。在\
  \ Bash 中移除文件的命令是 `rm。`rm` 命令的基本格式非常简单：![输出使用了 `rm` 命令并显示了四个文件的详情。](img/9781284255805_CH07_CUM42.jpg)\n\
  \n描述\n\n注意命令会提示你确认是否真的要移除文件。CLI 中没有像图形桌面环境中那样的回收站。一旦你删除了文件，它就永远消失了。\n\n现在，有一个关于删除带有链接文件的有趣小知识：\n\
  \n![输出使用了 rm、ls 和 cat 命令并显示了三个文件的详情。](img/9781284255805_CH07_CUM43.jpg)\n\n描述\n\n\
  ![输出使用了 rm、ls 和 cat 命令并显示了三个文件的详情。](img/9781284255805_CH07_CUM44.jpg)\n\n\n\n\n\n\
  [描述]\n\n在此示例中，删除了 `test1` 文件，该文件既与 `test4` 文件有一个硬链接，也与 `test5` 文件有一个软链接。注意观察发生了什么。尽管\
  \ `test1` 文件已经删除，但两个链接文件仍然显示存在（尽管在我的彩色终端上，`test5` 的文件名现在显示为红色）。如果你查看作为硬链接的 `test4`\
  \ 文件的内容，它仍然显示该文件的内容。但如果你尝试查看作为软链接的 `test5` 文件的内容，`Bash` 会指示该文件已不存在。\n\n请记住，硬链接文件与原始文件使用相同的\
  \ inode 索引节点号。在您删除最后一个链接文件之前，硬链接文件都会保持该 inode 编号，从而保留数据！而软链接文件只知道底层文件已经删除，因此它再也无物可指。这是在处理链接文件工作工作时需要记住的一项重要特性。\n\
  \n`rm` 命令的另一个功能是，如果你要删除大量文件且不想被提示信息打扰，可以使用 `-f` 参数进行强制删除。但务必小心！\n\n## 文件特性\n\n有些功能是\
  \ Linux 特有的，在处理文件时你需要留意这些特性。本节将介绍这些特性。\n\n### 使用通配符\n\n`ls`、`cp`、`mv` 和 `rm` 命令非常方便，但在命令中指定单个文件或目录名称会让它们在\
  \ Linux 命令行中显得有些笨拙。如果你想处理多个文件或目录，需要使用一种 Linux 世界称为通配符匹配 (globbing)的技术。\n\n通配符基本上是使用通配字符来表示文件或目录名称中的一个或多个字符。该特性允许我们指定一个模式，让\
  \ Linux 匹配多个文件或目录。你可以使用两个基础通配符：\n\n*   问号——代表单个字符\n*   星号——代表零或多个字符\n\n问号是一个占位符，代表匹配文件名中的任何单个字符。例如，你可以在\
  \ `rm` 命令中指定文件名 `file?.txt`，以删除任何以“file”开头、中间接一个字符并以“.txt”结尾的文件。这里有一个示例：\n\n![输出显示了使用\
  \ rm 和 ls 命令关于几个文件的信息。](img/9781284255805_CH07_CUM45.jpg)\n\n[描述]\n\n![输出显示了使用 rm\
  \ 和 ls 命令关于几个文件的信息。](img/9781284255805_CH07_CUM46.jpg)\n\n[描述]\n\n`rm` 命令使用通配符 `file?.txt`\
  \ 作为参数。Linux 在目录中查找匹配该模式的文件进行删除。两个文件 `file1.txt` 和 `file2.txt` 该模式。然而，`file10.txt`\
  \ 文件不匹配该模式，因为文件名中“file”和“.txt”部分之间有两个字符；而 `file.txt` 文件也不匹配该模式，因为文件名中“file”和“.txt”部分之间没有任何字符。\n\
  \n你使用星号通配符来匹配文件名中的零或多个字符：\n\n![输出显示了使用带有 file*.txt 参数的 rm 命令关于四个文件的详细信息。](img/9781284255805_CH07_CUM47.jpg)\n\
  \n[描述]\n\n通过使用星号，Linux 匹配了所有以“file”开头并以“.txt”结尾的文件，甚至是 `file.txt` 文件！你可以在命令行的任何列表、复制、移动或删除操作中使用星号。\n\
  \n### 引用\n\n你在 Linux 中可能遇到的另一个问题是名称中包含空格的文件或目录。这在 Linux 中是完全允许的，但在命令行操作时可能会引起麻烦。\n\
  \n如果你尝试引用文件名中包含空格的文件或目录，你将收到错误消息：\n\n![输出显示了 ls 和 rm 的用法。](img/9781284255805_CH07_CUM48.jpg)\n\
  \n[描述]\n\n![输出显示了 ls 和 rm 的用法。](img/9781284255805_CH07_CUM49.jpg)\n\n[描述]\n\n问题在于，默认情况下，`rm`\
  \ 命令使用空格来指示文件名的结束，因此它认为你正尝试删除三个独立的文件——“long”、“file”和“name.txt”！\n\n有两种方法可以解决这个问题。一种是使用引用，在任何包含空格的文件名周围加上引号：\n\
  \n![第 1 行：美元 空格 rm 空格 双引号 long 空格 file 空格 name.txt 双引号。第 2 行：美元 空格 ls 空格 横杠 l。第\
  \ 3 行：总 0。第 4 行：美元。](img/9781284255805_CH07_CUM50.jpg)\n\n只要在文件名周围使用单引号或双引号即可。\n\
  \n解决的另一种方法是使用转义，在你想让 Linux 解释为字符而非 shell 的字符前面加上一个反斜杠：\n\n![美元 空格 rm 空格 \\ file\\\
  \ name.txt.](img/9781284255805_CH07_CUM51.jpg)\n\n### 大写敏感性\n\n在使用命令行时，最后一点需要注意的是文件名的大小写。Linux\
  \ 是一个大小写敏感的操作系统，因此文件和目录可以包含大小写字母。同样，当你处理文件时，请引用正确的格式：\n\n![输出显示了针对名称相同但大小写不同的 rm\
  \ 命令。](img/9781284255805_CH07_CUM52.jpg)\n\n[描述]\n\n这是通配符大用处的一个良好示例。如果你不字符的大小写，可以使用问号来代表任何字符：\n\
  \n![第 1 行：美元 空格 rm 空格 ?1.txt。第 2 行：美元。](img/9781284255805_CH07_CUM53.jpg)\n\n此命令将同时删除\
  \ `file1.txt` 和 `File1.txt` 文件。\n\n## 查找文件\n\n由于 Linux 系统存储了大量文件，查找所需的文件往往变得很困难。幸运的是，Linux\
  \ 提供了不同的文件搜索功能。本章将介绍你可能会使用并在 Linux Essentials 考试中遇到的功能。\n\n### which 命令\n\n你可以使用\
  \ which 命令来查找程序和实用程序的存储位置。如果你在系统中安装了两个版本的程序，或者你不确定某个命令是内置于 Linux shell 的还是作为独立工具提供的，这就会非常有用。使用\
  \ `which` 命令的格式非常简单：\n\n```\nwhich touch\n```\n\n![第 1 行：美元 空格 which 空格 touch。第\
  \ 2 行：/usr/bin/touch。第 3 行：美元。](img/9781284255805_CH07_CUM54.jpg)\n\n`which` 命令的输出显示了命令在系统中完整路径。如果你系统中有两个版本的程序，`which`\
  \ 命令会显示在命令行输入它时将运行哪一个。如果你需要使用不同的版本，必须使用程序文件的完整路径。\n\n### locate 命令\n\n\n\n\n大多数\
  \ Linux 发行版默认都包含 `locate` 命令。`locate` 命令使用一个数据库，该数据库会跟踪系统上文件的位置。当你使用 `locate` 命令时，它会搜索数据库以找到所需的文件。这个过程通常比尝试搜索文件系统的所有文件要快。\n\
  \n`locate` 命令的关键在于数据库中的信息。它只能找到已经索引到数据库中的文件。数据库中的信息由命名为 `updatedb` 的程序进行更新。Linux\
  \ 系统会定期在后台模式运行 `updatedb` 程序，用系统上存储的任何新文件更新文件数据库。\n\n不过，在使用 `locate` 命令时要小心，你得到的结果可能比预期的多！这里有一个例子：\n\
  \n![显示了 locate 命令的输出。](img/9781284255805_CH07_CUM55.jpg)\n\n描述\n\n`locate` 命令会返回文件名中包含“touch”字的任何文件！你需要过滤结果来找到你寻找的文件。\n\
  \n`locate` 命令的另一个缺点是，在下一次运行 `updatedb` 程序之前，它无法找到新添加的文件。某些 Linux 系统会定期运行 `updatedb`\
  \ 程序（每几分钟一次），而另一些系统仅每天调度一次或两次。你需要运行它的频率取决于你在 Linux 系统上获取新文件的频率以及你多快需要找到它们。\n\n###\
  \ whereis 命令\n\n`whereis` 命令与 `which` 命令类似，因为它查找你正在搜索的文件的特定出现。然而，它只在二进制文件目录、库目录和文档目录中查找，这在一定程度上加速了搜索过程。这对于寻找命令，以及与命令一起的文档文件非常有用。\n\
  \n![第 1 行：美元空格 whereis 空格 touch。第 2 行：touch 冒号空格 / u s r / bin / touch 空格 / u s\
  \ r / share / man / man 1 / touch dot 1 dot g z。第 3 行：美元。](img/9781284255805_CH07_CUM56.jpg)\n\
  \n在这个示例中，`whereis` 命令返回了 `touch` 程序文件的位置以及与 `touch` 程序相关的帮助页的位置。\n\n### find 命令\n\
  \n在你的 Linux 系统上找到文件的最后手段是 `find` 命令。它通过虚拟目录树进行物理搜索以寻找指定的文件。你可以想象，搜索区域越广，`find` 命令返回答案的时间就越长。你可以在\
  \ `find` 命令行的第一个参数上指定搜索区域：\n\n![第 1 行：美元空格 find 空格 /home/r b l u m 空格 name 空格 hello\
  \ 空格 print。第 2 行：/home/r b l u m/test/hello。第 3 行：美元。](img/9781284255805_CH07_CUM57.jpg)\n\
  \n此示例将 `find` 命令限制在 `/home/rblum` 目录结构中查找名为 `hello` 的文件。`-name` 选项指定要查找的文件，`-print`\
  \ 命令告诉 `find` 命令显示结果。\n\n`find` 命令之所以如此多功能，是因为它可以根据文件名之外的许多不同标准来查找文件，例如创建时间、文件所有者、文件大小甚至文件权限。例如，你可以使用\
  \ `find` 命令查找文件系统中所有大于 1MB 的文件。表 7-4 显示了你在 `find` 命令中可以使用的一些选项。\n\n表 7-4 有用的 find\
  \ 命令选项。\n\n| 选项 | 描述 |\n| --- | --- |\n| `-amin n` | 文件在 n 分钟前最后被访问。 |\n| `-atime\
  \ n` | 文件在 n 天前最后被访问。 |\n| `-ctime n` | 文件在 n 分钟前最后被更改。 |\n| `-inum n` | 文件的 inode\
  \ 号与指定的数字匹配。 |\n| `-name` | 文件名与指定的模式匹配。 |\n| `-perm` | 文件权限与指定的模式匹配。 |\n| `-size\
  \ n` | 文件大小与指定的数量匹配。 |\n| `-user` | 文件所有者与指定的名称匹配。 |\n\n你还可以在 `find` 选项上使用特殊修符，例如表示“大于”的加号或表示“小于”的减号。例如，要列出所有大于\
  \ 5000 个字符的文件，你会使用：\n\n![第 1 行：美元空格 find 空格 . 空格 size 空格 +5000c c print。第 2 行：./hello。第\
  \ 3 行：美元。](img/9781284255805_CH07_CUM58.jpg)\n\n```\nfind . -size +5000c -print\n\
  ```\n\n### 创建归档文件\n存储数据可能会变得混乱。数据越多，需要的空间就越大。为了帮助这一点，你可以使用一些`压缩目录` 列出了 Linux 中可用的不同文件压缩工具。\n\
  \n表 7-5 Linux 文件压缩工具。\n\n| 工具 | 文件扩展名 | 描述 |\n| --- | --- | --- |\n| `bzip2` | `.bz2`\
  \ | 使用 Burrows-Wheeler 排序文本压缩算法 |\n| `compress` | `.Z` | 原始 Unix 压缩工具，但已开始被遗忘 |\n\
  | `gzip` | `.gz` | GNU 项目的压缩工具，使用开源的 Lempel-Ziv |\n| `zip` | `.zip` | 用于 Windows\
  \ 的 PKZip  Unix 版本 |\n\n`compress` 工具可以与标准 Unix 系统上压缩的文件配合，但 Linux 系统默认通常不安装。如果你下载了带有\
  \ `.Z` 扩展的文件，通常可以从发行软件存储库安装 `compress` 包。`zip` 工具创建的压缩目录可以在 Windows 上解压，但如果你将文件保留在\
  \ Linux 系统上，这不是最好的压缩算法。\n\n`gzip` 工具是 Linux 中常用的压缩工具。它是 GNU 项目的产，旨在创建一个原始 Unix compress\
  \ 工具的免费版本。该包包含三个主文件：\n\n*   `gzip` 用于压缩文件\n*   `gzcat` 用于显示压缩文本文件的内容\n*   `gunzip`\
  \ 用于解压缩文件\n\n`gzip` 命令压缩你在命令行上指定的文件。你还可以指定多个文件名，甚至使用通配符一次性压缩多个文件：\n\n```\ngzip my*\n\
  ```\n此 `gzip` 命令压缩目录中所有以“my”开头的文件。\n\n### 创建归档文件\n\n\n\n\n虽然 `gzip` 命令不仅可以压缩数据，还可以将数据归档到单个文件中，但它并不是\
  \ Unix 和 Linux 世界中归档大量数据的标准工具。目前，Unix 和 Linux 中最流行的归档工具是 `tar` 命令。\n\n`tar` 命令最初用于将文件备份到带带设备进行归档。然而，它也可以将输出写入文件，这已成为\
  \ Linux 中打包数据进行分发的流行方式。你也可以对归档文件进行压缩，使其成为存储大量文件的紧凑方式。看到源代码文件被打包成 `tar` 归档文件（亲切地称为\
  \ `tarball`）进行分发是非常常见的。\n\n以下是 `tar` 命令的格式：\n\n![tar space function space open bracket\
  \ options close bracket space object 1 space object 2.](img/9781284255805_CH07_CUM60.jpg)\n\
  \n函数参数定义了 `tar` 命令应该做什么，如表 7-6 所示。\n\n表 7-6 `tar` 命令函数。\n\n| 功能 | 说明 |\n| --- |\
  \ --- |\n| -a | 将现有的 `tar` 归档文件追加到另一个 `tar` 归档文件中 |\n| -c | 创建一个新的 `tar` 归档文件 |\n\
  | -d | 检查 `tar` 归档文件与文件系统文件之间的差异 |\n| -r | 将文件追加到现有的 `tar` 归档文件中 |\n| -t | 列出现有\
  \ `tar` 归档文件的内容 |\n| -u | 将比归档中相同文件更新的文件追加到现有的 `tar` 归档文件中 |\n| -x | 从现有的 `tar`\
  \ 归档文件中提取文件 |\n\n每个函数都使用一个或多个选项来定义 `tar` 归档文件的特定行为。表 7-7 显示了你可以配合 `tar` 命令使用的选项：\n\
  \n表 7-7 `tar` 命令选项。\n\n| 选项 |  |\n| --- | --- |\n| -C dir | 切换到指定的目录 |\n| -f file\
  \ | 输出结果到指定的文件（或设备）。 |\n| -j | 将输出重定向到 `bzip2` 命令进行压缩 |\n| -P | 保留所有文件权限 |\n| -v\
  \ | 列出正在处理的文件 |\n| -z | 将输出重定向到 `gzip` 命令进行压缩 |\n\n虽然多个函数和多个选项的组合看起来是一项难以记忆的任务，但现实中你会发现自己只需要使用几种组合即可完成任务。下节介绍了你会遇到的更常见的归档场景。\n\
  \n### 归档场景\n\n通常你使用 `tar` 命令只需要做三基础件事：\n\n*   归档文件以创建 `tarball`\n*   列出 `tarball`\
  \ 中的文件\n*   从 `tarball` 提取文件\n\n这有助于缩小你需要记忆的 `tar` 命令的函数和选项范围。\n\n开始，你可以使用此命令创建一个归档文件：\n\
  \n![tar space hyphen c v space test dot tar space test slash test 2 slash.](img/9781284255805_CH07_CUM61.jpg)\n\
  \n此命令创建一个名为 `test.tar` 的归档文件，包含 `test` 目录和 `test2` 目录的内容。`-v` 选项是一个很好的功能，可以在文件添加到归档文件时显示它们。\n\
  \n接下来，要显示 `tarball` 文件的内容，只需此命令：\n\n![tar space hyphen t f space test dot tar.](img/9781284255805_CH07_CUM62.jpg)\n\
  \n`-t` 函数通过标准输出列出 `tarball` 的内容，而不是提取。\n\n最后，要提取 `tarball` 中的文件，你会使用此命令：\n\n![tar\
  \ space hyphen x v space test dot tar.](img/9781284255805_CH07_CUM63.jpg)\n\n它将\
  \ `test.tar` 文件的内容提取到当前目录。如果 `tar` 文件是从目录结构创建的，则整个目录结构会在当前目录重建。\n\n如你所见，使用 `tar`\
  \ 命令是创建整个目录归档文件的简单方法。这就是为什么它变成了 Linux 世界分发源代码文件的常用方法！\n\n## 资源\n\nLinux Documentation\
  \ Project，“The Linux Filesystem,”访问于 2015 年 10 月 17 日，来自[`www.tldp.org/LDP/Linux-Filesystem-Hierarchy/html/`](http://www.tldp.org/LDP/Linux-Filesystem-Hierarchy/html/)。\n\
  \n![烟雾形式的抽象图像](img/Chapter-opener.jpg)\n\n© Shutterstock\n\n## 第 8 章\n\n# 网络概念\n\
  \n如今让你的 Linux 系统连接到某种网络几乎是必要的。无论是为了共享文件和打印机，还是为了连接互联网下载更新和安全补丁，大多数 Linux 系统都有连接。\n\
  \n本章介绍了如何将你的 Linux 系统配置到网络，以及出现问题时如何进行排除。首先，章节涵盖了配置的常见位置。接下来，检查了你可以用来配置网络的不同工具。之后，章节介绍了你可以使用的一些网络故障排除技术。\n\
  \n## 配置网络功能\n\n你需要五个主要信息来配置你的 Linux 系统在网络上交互：\n\n*   IP 地址\n*   子网地址（等一下，原文是“subnet\
  \ address”，我将保留语义）\n*   默认路由器（有时称为网关）\n*   系统主机名\n*   用于解析主机名的域名系统 (DNS) 服务器\n\n\
  在 Linux 中有三种配置这些信息的方法：\n\n*   手动编辑网络配置文件\n*   使用发行版自带的图形化工具\n*   使用命令行工具\n\n以下章节将介绍这些方法。\n\
  \n### 网络配置文件\n\n每个 Linux 发行版使用网络配置文件来定义网络设置。遗憾的是，并没有一个所有发行版都使用的标准配置文件。\n\n相反，不同的发行版使用不同的配置文件来定义网络设置。表\
  \ 8-1 显示了你会遇到的常见的网络配置文件。\n\n| 发行版 | 网络配置位置 |\n| --- | --- |\n| Debian 系 | `/etc/network/interfaces`\
  \ |\n| Red Hat 系 | `/etc/sysconfig/network-scripts` |\n| openSUSE | `/etc/sysconfig/network`\
  \ |\n\n虽然每个 Linux 发行版定义网络设置的方法不同，但它们具有相似的功能。大多数配置文件将每个所需的网络设置定义为配置文件中的单独值。列出 8-1\
  \ 显示了一个基于 Debian 的 Linux 系统的示例。\n\n[列表 8-1]所示的示例为指定为 `eth0` 的有线网络接口分配了 IP 和 IPv6\
  \ 地址。\n\n列表 8-2 显示了如何使用网络上的 DHCP 服务器自动定义 IP 网络设置。\n\n\n\n\n\n`auto` 属性告诉 Linux 分配本地链路地址，这允许\
  \ Linux 系统与本地网络上的任何其他 IPv6 设备通信，但无法与全局地址通信。\n\n对于基于红帽的系统，你需要在多个文件中定义网络设置，每个网络接口对应一个文件。每个文件的格式如下如下：\n\
  \n![i f c f g hyphen interface.](img/9781284255805_CH08_CUM04.jpg)\n\n其中 `interface`\
  \ 是网络适配器的设备名称，例如 `ifcfg-enp0s3`。列表 8-3 显示了来自 Rocky Linux 系统的示例。\n\n此配置表明工作站在使用 DHCP\
  \ 进程从网络服务器自动获取网络信息。对于静态 IP 地址，你可以在配置文件中设置 IP 地址、默认网关和子网掩码。\n\n大多数 Linux 发行版使用 `/etc/hostname`\
  \ 文件来存储系统的本地主机名，但某些发行版使用 `/etc/HOSTNAME`。你还需要定义一个 DNS 服务器，以便系统能够解析 DNS 主名。幸运的是，这是所有\
  \ Linux 系统都遵循的标准，并在 `/etc/resolv.conf` 文件中进行处理：\n\n![Line 1: domain space my domain\
  \ dot com. Line 2: search space my test dot com. Line 3: name server space 192 dot\
  \ 168 dot 1 dot 1.](img/9781284255805_CH08_CUM06.jpg)\n\n`domain` 条目定义了分配给网络的域名。默认情况下，系统会将此域名附加到你指定的任何主机名。`search`\
  \ 条目定义了用于搜索主名的额外域名。`nameserver` 条目用于指定分配给网络的 DNS 服务器。某些网络可以有多个 DNS 服务器；只需在文件中添加多个\
  \ `nameserver` 条目即可。\n\n### 使用图形化工具\n\nNetwork Manager 工具是一个流行的程序，被许多 Linux 发行版使用，用于为定义网络连接提供图形界面。Network\
  \ Manager 工具在启动时自动启动，并以图标的形式出现在桌面的系统托区域。\n\n如果你的系统检测到有线网络连接，图标将显示为连接在一起的区块微网络。如果你的系统检测到无线网络连接，图标将显示为空的无线信号。当你点击图标时，你将看到网卡检测到的可用无线网络列表（如图\
  \ 8-1 所示）。\n\n![一张截图显示 Network Manager 显示的无线网络连接。](img/9781284255805_CH08_FIGF01.jpg)\n\
  \n图 8-1 显示无线连接的 Network Manager。感谢 Linux Foundation 提供。\n\n感谢 Linux Foundation 提供。\n\
  \n描述\n\n点击你的接入点从列表中选择它。如果你的接入点经过了加密，系统将提示你输入密码以访问网络。\n\n一旦你的系统连接到无线接入点，图标将显示为无线信号。点击图标，然后选择“编辑连接”（Edit\
  \ Connections）来编辑系统的网络连接设置，如图 8-2 所示。\n\n![一张截图显示网络连接窗口。](img/9781284255805_CH08_FIGF02.jpg)\n\
  \n图 8-2 网络连接窗口。感谢 Linux Foundation 提供。\n\n感谢 Linux Foundation 提供。\n\n描述\n\n你可以选择要配置的网络连接（无线或有线），然后点击“编辑”（Edit）按钮来更改当前配置。\n\
  \nNetwork Manager 工具允许你通过手动配置选项指定所有四个网络配置值，或者将配置设置为使用 DHCP 来确定设置。Network Manager\
  \ 工具会自动使用更新后的设置更新相应的网络配置文件。\n\n### 使用命令行工具\n\n如果你不是在图形化桌面客户端环境中工作，你需要使用 Linux 命令行工具来设置网络配置信息。有很多命令行工具可供选择。以下章节涵盖了你最可能会遇到的工具。\n\
  \n#### Network Manager 命令行工具\n\nNetwork Manager 工具还提供了两种不同类型的命令行工具：\n\n*   `nmtui`\
  \ 提供了一个简单的基于文本的菜单工具。\n*   `nmcli` 提供了一个纯文本命令行工具。\n\n这两个工具都能帮助引导你完成为 Linux 系统设置所需网络信息的过程。nmtui\
  \ 工具显示了图形工具的精简版本，你可以在其中选择网络接口并为其分配网络属性，如图 8-3 所示。\n\n![一张截图显示 Network Manager 显示的无线网络连接。](img/9781284255805_CH08_FIGF01.jpg)\n\
  \n图 8-1 显示无线连接的 Network Manager。感谢 Linux Foundation 提供。\n\n感谢 Linux Foundation 提供。\n\
  \n描述\n\nnmcli 工具不尝试任何图形界面，它只是显示当前设置，如列表 8-4 所示。\n\n`nmcli` 使用选项设置网络设置：\n\n![nmcli\
  \ 使用命令行。](img/9781284255805_CH08_CUM06.jpg)\n\n描述\n\n#### iproute2 工具\n\niproute2\
  \ 包是一个较新的开源项目，包含一组管理网络连接的命令行工具。该包包含多个不同的程序，`ip`](9781284254884_Glossary.xhtml_GLOS-155)\
  \ 命令是最常用的。\n\n`ip` 命令是网络工具的瑞士军刀，正成为命令行定义网络设置更流行的方法。它使用多个选项显示当前网络设置或定义新的网络设置。表 8-2\
  \ 显示了这些命令。\n\n表 8-2 ip 命令选项\n\n| 参数 | 描述 |\n| --- | --- |\n| address | 在设备上显示或设置\
  \ IPv4 或 IPv6 地址。 |\n| addrlabel | 定义标签。 |\n| l2tp | IP 隧道。 |\n| link | 定义网络设备。\
  \ |\n| maddress | 定义系统监听的组播地址。 |\n| monitor | 监控 netlink 消息。 |\n| mroute | 定义组播路由缓存条目。\
  \ |\n| mrule | 定义组播路由策略数据库中的规则。 |\n| neighbor | 管理 ARP 或 NDISC 缓存条目。 |\n| netns\
  \ | 管理网络命名空间。 |\n| ntable | 管理缓存操作。 |\n| route | 管理路由表。 |\n| rule | 管理路由策略数据库中的条目。\
  \ |\n| tcpmetrics | 管理接口上的 TCP 度量。 |\n| token | 管理令牌接口标识符。 |\n| tunnel | IP 隧道。\
  \ |\n| tuntap | 管理 TUN/TAP 设备。 |\n| xfrm | 用于安全连接的 IPSec 策略。 |\n\n每个命令选项都利用参数来定义操作，例如显示网络设置或修改现有网络设置。列表\
  \ 8-5 演示了如何使用 `show` 参数显示当前网络设置。\n\n此示例显示了 Linux 系统上的两个网络接口：\n\n*   `lo` 是本地环回接口。\n\
  *   `enp0s3` 是有线网络接口。\n\n\n\n\n本地回环接口 是一种特殊的虚拟网络接口。任何本地程序都可以使用它与系统上的其他程序进行通信，就像它们跨越网络一样。这可以简化程序之间的数据传输。\n\
  \n`enp0s3` 网络接口是 Linux 系统的有线网络连接。`ip` 命令显示分配给接口的 IP 地址（分配了 IP 地址和 IPv6 链路本地地址）、子网掩码值以及关于接口上数据包的一些基本统计。\n\
  \n如果输出没有显示分配给接口的网络地址，你可以使用 `ip` 命令为接口指定主机地址和子网掩码值：\n\n![Hash space i p space address\
  \ space add space 10 dot 0 dot 2 dot 15 slash 24 space dev space e n p 0 s 3.](img/9781284255805_CH08_CUM11.jpg)\n\
  \n然后使用带有 `route` 选项的 `ip` 命令为网络接口设置默认路由器：\n\n![Hash space i p space route add space\
  \ default space via space 192 dot 168 dot 1 dot 254 space dev space e n p 0 s 3.](img/9781284255805_CH08_CUM12.jpg)\n\
  \n最后，使用 `link` 选项激活网络接口：\n\n![Hash space i p space link space set space e n p 0\
  \ s 3 space up.](img/9781284255805_CH08_CUM13.jpg)\n\n通过一个 `ip` 命令，你就可以管理网络连接所需的几乎一切内容。\n\
  \n## 遗留工具 net-tools\n\n如果你需要在较旧的 Linux 发行版上工作，net-tools 包可能是你唯一的可用工具。`net-tools`\
  \ 包曾是 Linux 中管理网络配置各个方面的原始方法。你需要使用四种主要的命令行工具：\n\n*   ethtool 显示网络接口的以太设置。\n*   ifconfig\
  \ 显示或设置网络接口的 IP 地址和子网掩码值。\n*   `iwconfig` 设置无线接口的 SSID 和加密密钥。\n*   `route` 设置默认路由器地址。\n\
  \n`ethtool` 命令允许你查看网络网卡的以太设置，并更改你与网络设备（如交换机）通信可能需要的任何属性。\n\n默认情况下，`ethtool` 命令显示网络接口的当前配置设置，如\
  \ 列表 8-6 所示。\n\n你可以更改速度、双工以及网络接口是否尝试与交换机自动协商功能等特性。\n\n`ifconfig` 命令是一个遗留命令，允许为网络接口设置网络地址和子网掩码：\n\
  \n![Dollar space sudo space if config space e n p 0 s 3 space down space 10 dot\
  \ 0 dot 2 dot 10 space net mask space 255 dot 255 dot 255 dot 0.](img/9781284255805_CH08_CUM15.jpg)\n\
  \n你也可以使用 `ifconfig` 命令查看网络接口的当前统计数据，如 列表 8-7 所示。\n\n使用 `ifconfig` 命令，你可以看到网络接口的链路状态、它正在接收还是发送数据包，以及是否存在丢包或冲突。这可以是一个实用的网络故障排除工具。\n\
  \n使用 `net-tools` 包，你必须使用独立的 `route` 命令设置默认路由器：\n\n![Hash space route add space default\
  \ g w space 192 dot 168 dot 1 dot 254.](img/9781284255805_CH08_CUM17.jpg)\n\n你也可以单独使用\
  \ `route` 命令查看系统配置的当前默认路由器。\n\n![输出显示使用 route 命令为系统配置的当前默认路由器。](img/9781284255805_CH08_CUM18.jpg)\n\
  \n描述\n\n![继续](img/9781284255805_CH08_CUM19.jpg)\n\n描述\n\n为 Linux 系统定义的默认路由器为 `192.168.1.254`，可通过\
  \ `enp0s3` 网络接口可用。输出还显示，要访问 `192.168.1.0` 网络不需要网关，因为那是 Linux 系统所连接的本地网络。\n\n如果你的网络通过多个路由器连接到多个网络，你可以使用\
  \ `ip` 命令手动创建路由表：\n\n```\nip route add default via 192.168.1.254 dev enp0s3\n```\n\
  \n为 Linux 系统定义的默认路由器为 `192.168.1.254`，可通过 `enp0s3` 网络接口可用。输出还显示，要访问 `192.168.1.0`\
  \ 网络不需要网关，因为那是 Linux 系统所连接的本地网络。\n\n如果你的网络通过多个路由器连接到多个网络，你可以使用 `ip` 命令手动创建路由表：\n\
  \n```bash\nip route add default via 192.168.1.254 dev enp0s3\n```\n\n为 Linux 系统定义的默认路由器为\
  \ `192.168.1.254`，可通过 `enp0s3` 网络接口可用。输出还显示，要访问 `192.168.1.0` 网络不需要网关，因为那是 Linux\
  \ 系统所连接的本地网络。\n\n（注：原文此处存在大量重复和乱码字符，已基于 `ip` 命令逻辑进行清理）\n\n为 Linux 系统定义的默认路由器为 `192.168.1.254`，可通过\
  \ `enp0s3` 网络接口可用。输出还显示，要访问 `192.168.1.0` 网络不需要网关，因为那是 Linux 系统所连接的本地网络。\n\n\n\n\
  \n![输出显示了使用特定 IP 地址使用 `ping` 命令的用法。](img/9781284255805_CH08_CUM25.jpg)\n\n描述\n\n\
  `ping` 命令持续发送数据包，直到你按下 `Ctrl+C`。你也可以使用 `-c` 命令行选项来指定要发送的数据包数量，然后停止。\n\n对于 `ping6`\
  \ 命令，情况会变得复杂一些。如果你使用的是 IPv6 链路本地地址，你还需要告诉命令从哪个接口发送数据包：\n\n![输出显示了 `ping 6` 命令的用法。](img/9781284255805_CH08_CUM26.jpg)\n\
  \n描述\n\n`%enp0s3` 部分告诉系统通过 `enp0s3` 网络接口为链路本地地址发送 ping 数据包。\n\n另一个有用的工具是 `traceroute`\
  \ 命令。`traceroute` 命令利用 ICMP 数据包的一种，该特性限制了数据包到达目的地之前可以经过的网络路由器数量（称为“跳”）。通过操作数据包中的该值，`traceroute`\
  \ 命令允许你看到数据包从客户端传输到服务器所经过的网络路由器。\n\n最后，`mtr` 程序是一个软件包，它利用从 `ping` 和 `traceroute`\
  \ 命令检索的数据，在实时图表中记录网络可用性和延迟。图 8-4 显示了 `mtr` 命令追踪到 `linux.org` 服务器连接的输出。\n\n![截图显示了使用\
  \ mtr 监控到服务器的网络连接的用法。](img/9781284255805_CH08_FIGF04.jpg)\n\n图 8-4 使用 `mtr` 监控到服务器的网络连接情况。感谢\
  \ BitWizard 提供。\n\n感谢 BitWizard 提供。\n\n描述\n\n### 查找主机信息\n\n有时问题不在于网络连接，而在于 DNS 主机名系统。你可以使用\
  \ `host` 命令测试主机名：\n\n![输出使用 host 命令测试了一个主机名。](img/9781284255805_CH08_CUM27.jpg)\n\
  \n描述\n\n`host` 命令查询 DNS 服务器以确定分配给指定主机名的 IP 地址。默认情况下，它返回所有与主机名关联的 IP 地址。某些主机在负载均衡配置中由多个服务器支持。`host`\
  \ 命令将显示与这些服务器关联的所有 IP 地址：\n\n![输出显示了使用 host 命令与服务器关联的所有 IP 地址。](img/9781284255805_CH08_CUM28.jpg)\n\
  \n描述\n\n你也可以为 `host` 命令指定一个 IP 地址，它将尝试查找与其关联的主机名：\n\n![输出尝试使用 host 命令查找与 IP 地址关联的主机名。](img/9781284255805_CH08_CUM29.jpg)\n\
  \n描述\n\n但请注意，IP 地址通常解析为托管网站的通用服务器主机名，而不是网站别名，这里的 `www.linux.org` IP 地址就是如此。\n\n\
  另一个非常好用的工具是 `dig 命令。`dig` 命令显示与特定主机或网络关联的所有 DNS 数据记录。例如，你可以查询特定主机名的信息：\n\n![输出显示了使用\
  \ dig 命令与特定主机关联的所有 DNS 数据记录。](img/9781284255805_CH08_CUM30.jpg)\n\n描述\n\n或者你可以查询与特定网络服务（如邮件服务器）关联的\
  \ DNS 数据记录：\n\n![输出显示与特定网络服务关联的 DNS 数据记录。](img/9781284255805_CH08_CUM31.jpg)\n\n\
  描述\n\n![输出显示与特定网络服务关联的 DNS 数据记录。](img/9781284255805_CH08_CUM32.jpg)\n\n描述\n\n如果你需要查询多个服务器或域的\
  \ DNS 信息，`nslookup` 命令提供了一个交互界面：\n\n![输出显示与特定网络服务关联的 DNS 数据记录。](img/9781284255805_CH08_CUM33.jpg)\n\
  \n描述\n\n\n\n\n\n![输出显示了使用 net stat 命令连字符 s 选项系统在网络使用的不同类型数据包的统计信息。](img/9781284255805_CH08_CUM41.jpg)\n\
  \n描述\n\n`netstat` 统计输出可以让你大致了解你的 Linux 系统在网络上的忙碌程度，或者已安装的某个协议是否存在特定问题。\n\n### 检查套接字\
  \ (Sockets)\n\n`netstat` 工具提供了丰富的网络信息，但往往难以确定底哪个程序正在监听哪个打开的端口。这时，`ss` 命令可以为你解决问题。\n\
  \n程序连接到端口被称为套接字（socket）。`ss` 命令可以关联哪些系统进程正在使用哪些活跃的网络套接字：\n\n```\n![输出使用 ss 命令关联了哪些系统进程正在使用哪些活跃的网络套接字。](img/9781284255805_CH08_CUM42.jpg)\n\
  ```\n\n描述\n\n`-anpt` 选项同时显示监听和已建立的传输控制协议（TCP）连接以及它们相关的进程。此输出显示 SSH 端口（22 端口）有一个已建立的连接，并由进程\
  \ ID 15176 的 `ssh` 程序控制。\n\n## 资源\n\nLinux 内核项目，“Linux 网络文档”，访问于 2021 年 12 月 22\
  \ 日，来自 [`www.kernel.org/doc/html/v5.8/networking/index.xhtml`](https://www.kernel.org/doc/html/v5.8/networking/index.xhtml)。\n\
  \n![一张抽象图像显示了烟雾形式的纹理。](img/Chapter-opener.jpg)\n\n© Picsfive/Shutterstock\n\n# 第\
  \ 9 章：管理进程\n\nLinux 服务器必须跟踪运行在系统上的许多不同的应用程序。作为 Linux 时代员，你的目标是确保一切运行顺畅且在正确的时间运行！本章将展示\
  \ Linux 是如何跟踪所有活跃程序的，以及你如何管理这些信息。\n\n## 查看进程\n\n在任何给定时刻，Linux 系统上都有许多活跃程序运行。Linux\
  \ 将每个运行的程序称为进程 (process)。进程可以在前台运行，在控制台显示器或图形桌面窗口中显示输出，也可以在后台运行，在幕后处理数据。Linux 系统为每个进程分配一个进程\
  \ ID（或 `PID`），并根据该 `PID` 管理进程使用内存和 CPU 时间。\n\n当 Linux 系统首次启动时，它会启动一个名为 `init` 的特殊进程。`init`\
  \ 进程是 Linux 系统的核心；它运行脚本启动系统上运行的所有其他进程，包括启动你用于登录的任何文本终端或图形窗口的进程。\n\n你可以通过 ps 命令查看你的\
  \ Linux 系统上当前正在运行哪些进程。`ps` 命令的默认输出如下：\n\n```\n![输出显示了使用 ps 命令当前 Linux 系统上运行的进程。](img/9781284255805_CH09_CUM01.jpg)\n\
  ```\n\n描述\n\n默认情况下，`ps` 命令只显示运行在当前用户 shell 中的进程。在这个示例中，我只运行了命令提示符 shell (`bash`)，当然，还有\
  \ `ps` 命令本身。\n\n`ps` 命令的基本输出显示了分配给每个进程的 `PID`、它们启动的终端 (`TTY`) 以及该进程使用的 CPU 时间。\n\
  \n`ps` 命令的复杂之处（也是它变得如此复杂的原因）在于，在 Linux 中曾经存在过两个版本。每个版本都有自己的一套命令行参数，用于控制其显示的信息。这使得在不同系统之间切换变得有些复杂。\n\
  \nGNU 开发者决定将这两个版本合并为一个单一的 `ps` 程序，并且当然添加了一些他们自己的额外参数。因此，Linux 中使用的当前 `ps` 程序支持三种不同风格的命令行参数：\n\
  \n*   Unix 风格参数，以连字符 (-) 前缀\n*   BSD 风格参数，不以连字符前缀\n*   GNU 长参数，以双连字符 (--) 前缀\n\n\
  这使得 `ps` 命令有了许多可能的参数和选项。你可以查阅 `ps` 手页来查看所有可用的参数。大多数 Linux 管理员都有自己的一套常用参数，并记住它们提取相关信息。例如，如果你需要查看系统上运行的每个进程，请使用\
  \ Unix 风格的 `-ef` 参数组合，如下：\n\n```\n![输出使用带有连字符 e f 参数的 ps 命令显示系统上运行的每个进程。](img/9781284255805_CH09_CUM02.jpg)\n\
  ```\n\n描述\n\n此格式提供了关于运行进程的某些有用信息：\n\n*   `UID`——运行进程的用户\n*   `PID`——进程 ID\n*   `PPID`——父进程\
  \ ID\n*   `C`——处理器利用率\n*   `STIME`——进程启动的系统时间\n*   `TTY`——启动该进程的终端设备\n*   `TIME`——运行所需的累计\
  \ CPU 时间\n*   `CMD`——程序名称\n\n另外注意在 `-ef` 输出中某些进程名显示在括号中。交换虚拟内存的进程处于睡眠状态。\n\n## 实时监控进程\n\
  \n`ps` 命令是获取系统运行进程快照的一种极方法，但有时你需要更多信息来了解状况。如果你正试图寻找频繁在内存中交换进出的进程趋势，使用 `ps` 命令很难做到这一点。\n\
  \n相反，top 命令可以解决这个问题。`top` 命令显示的进程信息与 `ps` 命令类似，但它是实时模式运行的。\n\n```\n![显示了 top 命令的输出。](img/9781284255805_CH09_FIGF01.jpg)\n\
  ```\n\n图 9-1 top 命令的输出。感谢 Linux 基金会。\n\n描述\n\n`top` 输出的第一部分显示了通用系统信息。第一行显示了当前时间、系统运行时间、登录用户数以及系统的负载平均。\n\
  \n负载平均值表现为三个数字：1 分钟、5 分钟和 15 分钟的负载平均。数值越高，系统承受的负载越大。1 分钟负载值在短期活动中出现高值并不常见。如果 15\
  \ 分钟负载值很高，你的系统可能有问题。\n\n第二行显示了通用进程信息（在 top 中称为任务）：有多少进程正在运行、睡眠、停止或处于僵尸状态。\n\n\n\n\
  \n下一行显示通用的 CPU 信息。顶部显示区域根据进程所有者（用户进程与系统进程）以及进程状态（运行、空闲或等待）将 CPU 利用率细分为几类。\n\n接随其后的是两行详细说明系统内存状态的信息。第一行显示系统中物理内存的状态，包括总内存量、当前使用量以及可用量。第二行内存信息显示系统交换分区（swap\
  \ memory area）的状态（如果已安装），包含相同的信息。\n\n最后，接下来的部分显示了当前运行进程的详细列表，其中某些信息列你可能在 `ps` 命令的输出中看起来很熟悉：\n\
  \n*   `PID`—进程 ID\n*   `USER`—进程所有者的用户名\n*   `PR`—进程的优先级\n*   `NI`—进程的 nice 值（调度值）\n\
  *   `VIRT`—进程使用的虚拟内存总量\n*   `RES`—进程使用的物理内存量\n*   `SHR`—进程与其他进程共享的内存\n*   `S`—进程状态（D\
  \ = 可中断的睡眠，R = 运行，S = 睡眠，T = 跟踪或停止，或 Z = 僵尸）\n*   `%CPU`—进程占用的 CPU 时间比例\n*   `%MEM`—进程占用的可用物理内存比例\n\
  *   `TIME+`—进程自启动以来使用的总 CPU 时间\n*   `COMMAND`—进程的命令行名称（启动的程序）\n\n默认情况下，当你启动 `top`\
  \ 时，它会根据 `%CPU` 值对进程进行排序。你可以在 `top` 运行期间使用几种交互式命令之一改变排序顺序。每个交互式命令都是你可以在 `top` 运行时按的单个字符，并能改变程序的行为。这些命令如表\
  \ 9-1 所示。\n\n表 9-1 top 交互式命令。\n\n| 命令 | 描述 |\n| --- | --- |\n| 1 | 切换单 CPU 和对称多处理处理器\
  \ (SMP) 状态。 |\n| b | 切换表格中重要数字的加粗显示。 |\n| I | 切换 Irix/Solaris 模式。 |\n| z | 配置表格颜色。\
  \ |\n| l | 切换显示平均负载信息行。 |\n| t | 切换显示 CPU 信息行。 |\n| m | 切换显示 MEM 和 SWAP 信息行。 |\n\
  | f | 添加或移除不同的信息列。 |\n| o | 更改信息列的显示顺序。 |\n| F 或 O | 选择用于对进程排序的字段（默认为 %CPU）。 |\n\
  | < 或 > | 将排序字段向左 (<) 或向右 (>) 移动列。 |\n| r | 切换普通或反向排序顺序。 |\n| h | 切换显示线程。 |\n| c\
  \ | 切换显示进程的命令名称或完整命令行（包括参数）。 |\n| i | 切换显示空闲进程。 |\n| S | 切换显示累积 CPU 时间或相对 CPU 时间。\
  \ |\n| x | 切换排序字段的高亮显示。 |\n| y | 切换运行任务的高亮显示。 |\n| z | 切换颜色和单色模式。 |\n| u | 显示特定用户的进程。\
  \ |\n| n 或 # | 设置要显示的进程数量。 |\n| k | 杀死特定进程（仅限进程所有者或 root 用户）。 |\n| r | 更改特定进程的优先级\
  \ (renice)(仅限进程所有者或 root 用户）。 |\n| d 或 s | 更改更新间隔（默认为三秒）。 |\n| W | 将当前设置写入配置文件。\
  \ |\n| q | 退出 top 命令。 |\n\n你对 `top` 命令的输出有很大的控制权。使用 `F` 或 `O` 命令可以切换排序依据的字段。你也可以使用\
  \ `r` 交互式命令来反转当前排序。通过这个工具，你通常可以找到接管你系统的异常进程。\n\n## 管理进程\n\nLinux 系统管理员的工作之一是监视可能导致\
  \ Linux 系统崩溃的失控进程（runaway processes）。你已经学会了如何使用 `ps` 和 `top` 命令（或系统监视图形工具）来监控进程在系统中的运行情况，下一步是查看如何停止失控进程。\n\
  \n### 设置优先级\n\n默认情况下，在 Linux 系统上运行的所有进程都是平等的，也就是说，它们获取 CPU 时间和内存资源的优先级是相同的。然而，你可能会运行一些不需要相同优先级的应用程序，或者可能需要更高优先级的应用程序。\n\
  \n`nice` 和 `renice` 命令允许你设置和更改分配给应用程序进程的优先级级别。`nice` 命令允许你以非默认优先级设置启动应用程序。其格式如下：\n\
  \n![nice space hyphen n space value space command.](img/9781284255805_CH09_CUM03.jpg)\n\
  \n`value` 参数是一个从 –20 到 19 的数值。数字越小，进程优先级越高。默认优先级为零。`command` 参数指定以指定优先级启动的程序。\n\n\
  要更改已运行进程的优先级，请使用 `renice`：\n\n![renice space priority open bracket pids close space\
  \ open bracket hyphen users close space open bracket hyphen groups close bracket.](img/9781284255805_CH09_CUM04)\n\
  \n`renice` 命令允许你更改优先级\n\n### 停止进程\n\n有时进程会卡住，只需要轻轻推一下就能重新运行。在其他情况下，进程会夺占 CPU 并拒绝交出。在这两种情况下，你都需要一个允许你控制进程的命令。为了实现这一点，Linux\
  \ 遵循进程间通信的方法。\n\n在 Linux 中，进程通过信号（signals）相互通信。进程信号是预定义的各种，进程可以识别它，并可以选择忽略或处理它。开发者通过编程规定进程如何处理信号。大多数编写良好的应用程序都有接收和处理标准进程信号的能力。这些信号如表\
  \ 9-2 所示。\n\n表 9-2 Linux 进程信号。\n\n| 数字 | 名称 | 描述 |\n| --- | --- | --- |\n| 1 | HUP\
  \ | 挂断。 |\n| 2 | INT | 中断。 |\n| 3 | QUIT | 停止运行。 |\n| 9 | KILL | 无条件终止。 |\n| 11\
  \ | SEGV | 段错误。 |\n| 15 | TERM | 尽可能终止。 |\n| 17 | STOP | 无条件停止，但不终止。 |\n| 18 | TSTP\
  \ | 停止或暂停，但在后台继续运行。 |\n| 19 | CONT | 在 STOP 或 TSTP 后恢复执行。 |\n\n虽然一个进程可以向另一个进程发送信号，但\
  \ Linux 中有两个命令允许你向运行中的进程发送进程信号。\n\n### kill 命令\n\n`kill` 命令允许你根据进程 ID (PID) 向进程发送信号。默认情况下，`kill`\
  \ 命令向命令行列出的所有 PID 发送 `TERM` 信号。遗憾的是，你只能使用进程 PID 而不是命令名称，这使得 `kill` 命令有时难以使用。\n\n\
  要发送进程信号，你必须是进程的所有者或以 root 用户身份登录。\n\n![Line 1: dollar kill space 3940\\. Line 2:\
  \ hyphen bash colon space kill colon open parenthesis 3940 close parenthesis hyphen\
  \ Operation not permitted. Line 3: dollar.](img/9781284255805_CH09_CUM05.jpg)\n\n\
  \n\n\n\n`TERM` 信号仅是请求进程进程停止运行。不幸的是，如果你有一个失控的进程（runaway process），它很可能会忽略该请求。当你需要强制执行时，可以使用\
  \ `-s` 参数允许你指定其他信号（可以使用其名称或信号数字）。\n\n通常的后续程序是首先尝试 `TERM` 信号。如果进程忽略了它，则尝试 `INT` 或\
  \ `HUP` 信号。如果程序识别了这些信号，它将尝试在关闭之前优雅地停止正在执行的操作。最强制的信号是 `KILL` 信号。当进程接收到此信号时，它会立即停止运行。请将此作为最后手段，因为可能会导致文件损坏。\n\
  \n`kill` 命令的恐怖之处之一是它没有任何输出：\n\n![Line 1: dollar space sudo space kill space hyphen\
  \ s space H U P space 3 9 4 0\\. Line 2: dollar.](img/9781284255805_CH09_CUM06.jpg)\n\
  \n要查看命令是否生效，你必须执行另一个 `ps` 或 `top` 命令来查看该问题的进程是否已停止。\n\n### pkill 命令\n\n`pkill` 命令是一种通过名称而非\
  \ PID 数字来停止进程的强大方法。`pkill` 命令允许你使用通配符字符，这在系统出现故障时是一个非常有用的工具：\n\n![Line 1: dollar\
  \ space sudo space p kill space h t t p asterisk. Line 2: dollar.](img/9781284255805_CH09_CUM07.jpg)\n\
  \n此示例将杀死所有以 `http` 开头的进程，例如 Apache Web 服务器的 `httpd` 服务。在使用 `pkill` 命令的搜索功能时要小心。通常情况下，根据当前运行的进程检查搜索项是一个好主意，以确保你不会意外杀死任何其他匹配搜索项的进程。`pgrep`\
  \ 命令允许你显示所有匹配搜索项的进程。\n\n## 在后台模式下运行程序\n\n有时，直接从命令行界面运行程序是不方便的。某些程序可能需要很长时间来处理，而你可能不想一直占用命令行界面等待。在程序运行时，你无法在终端会话中执行其他操作。幸运的是，这个问题有一个简单的解决方案。\n\
  \n当你使用 `ps` 命令时，你会看到 Linux 系统上运行着许多不同的进程。显然，这些进程并不是运行在你的终端显示器上。这被称为在后台运行进程。在后台模式下，进程的运行不与终端会话关联。\n\
  \n你也可以让程序利用此特性，让它们在后台运行而不会锁定你的终端会话。接下来的章节描述了如何在 Linux 系统上以后台模式运行程序。\n\n### 在后台运行\n\
  \n在后台模式下运行程序或脚本是一件很容易的事。要从命令行界面以后台模式运行某些内容，只需在命令后放置一个安符符号（&）：\n\n![A script shows\
  \ ampersand symbol placed after the command to run the program in background mode.](img/9781284255805_CH09_CUM08.jpg)\n\
  \nDescription\n\n当你在命令后放置安符符号时，它会将命令与 Bash Shell 分隔，并作为系统上独立的后台进程运行。首先显示的是行：\n\n\
  ![Open bracket 1 close bracket space 1976.](img/9781284255805_CH09_CUM09.jpg)\n\n\
  方括号中的数字是 Shell 分配给后台进程的作业号（job number）。下一个数字是分配给进程的 `PID`。\n\n一旦系统显示了这些项目，一个新的命令行提示符就会出现。你返回到\
  \ Shell，而你执行的命令在后台模式下安全地运行。\n\n此时，你可以在提示符处输入新命令（如示例所示）。然而，当后台进程仍在运行时，它仍然使用你的终端显示器显示消息。你从示例中注意到，`test1.sh`\
  \ 脚本的输出会与从 Shell 运行的任何命令交混在一起。\n\n当后台进程完成时，它会在终端上显示一条消息：\n\n![Open bracket 1 close\
  \ bracket plus space Done space dot slash test 1 dot s h.](img/9781284255805_CH09_CUM10.jpg)\n\
  \n这显示了作业号和作业状态（Done），以及用于启动作业的命令。\n\n### 运行多个后台作业\n\n你可以从命令行提示符同时启动任意数量后台作业：\n\n\
  ![A script starts multiple background jobs at the same time from the command line\
  \ prompt.](img/9781284255805_CH09_CUM11.jpg)\n\nDescription\n\n每当你启动一个新作业时，Linux\
  \ 系统都会为其分配一个新的作业号和 `PID`。你可以通过 `ps` 命令看到所有脚本都在运行：\n\n![An output shows running processes\
  \ using the p s command.](img/9781284255805_CH09_CUM12.jpg)\n\nDescription\n\n![An\
  \ output shows running processes using the p s command.](img/9781284255805_CH09_CUM13.jpg)\n\
  \nDescription\n\n你启动的每个后台进程都会出现在 `ps` 命令的运行进程列表中。如果所有进程都在你的终端会话中显示输出，情况很快就会变得非常混乱。下一节将介绍一种解决方案。\n\
  \n## 在无控制台的情况下运行程序\n\n有时你可能希望从终端会话启动一个 Shell 脚本，然后让脚本在后台模式运行直到完成，即使你退出了终端会话也是。你可以使用\
  \ `nohup` 命令来实现。\n\n`nohup` 命令运行另一个命令并阻塞任何发送给该进程的 `SIGHUP` 信号。这防止了进程在你退出终端会话时退出。\n\
  \n`nohup` 命令使用的格式如下：\n\n![The format used for the no hup command is shown.](img/9781284255805_CH09_CUM14.jpg)\n\
  \nDescription\n\n与普通的后台进程一样，Shell 会为命令分配一个作业号，Linux 系统会分配一个 `PID` 数字。区别在于，当你使用 `nohup`\
  \ 命令时，如果你关闭会话，脚本将忽略终端会话发送的任何 `SIGHUP` 信号。\n\n由于 `nohup` 命令将进程与终端解离，进程丢失了到终端的输出链接。为了适应命令生成的任何输出，`nohup`\
  \ 命令会自动将任何输出重定向到名为 `nohup.out` 的文件中。\n\n`nohup.out` 文件包含了通常发送到终端显示器的所有输出。进程运行结束后，你可以查看\
  \ `nohup.out` 文件的输出：\n\n![The no hup out file is shown for the output results.](img/9781284255805_CH09_CUM15.jpg)\n\
  \nDescription\n\n![The no hup out file is shown for the output results.](img/9781284255805_CH09_CUM16.jpg)\n\
  \nDescription\n\n输出出现在 `nohup.out` 文件中的方式，就像进程在命令行上运行一样！但要小心；如果你使用 `nohup` 运行多个程序，它们都会将输出发送到同一个\
  \ `nohup.out` 文件。\n\n### 作业控制\n\n启动、停止、杀死和恢复作业的功能被称为作业控制。通过作业控制，你可以完全控制在 Shell 环境中运行进程的方式。本节描述了用于查看和控制在\
  \ Shell 中运行作业的命令。\n\n### 查看作业\n\n作业控制的关键命令是 `jobs`。`jobs` 命令允许你查看 Shell 正在处理的当前作业：\n\
  \n\n\n\n\n![输出显示了 shell 使用 `jobs` 命令正在处理的当前作业。](img/9781284255805_CH09_CUM17.jpg)\n\
  \n描述\n\n![输出显示了 shell 使用 `jobs` 命令正在处理的当前作业。](img/9781284255805_CH09_CUM18.jpg)\n\
  \n描述\n\n该脚本使用 `$$` 变量来显示 Linux 系统分配给脚本的 `PID`；然后，它进入一个循环，每次迭代睡眠 10 秒。在示例中，第一个脚本从命令行界面启动，然后使用\
  \ `Ctrl+Z` 组合键暂停。接着，使用 `&` 符号作为后台进程启动另一个作业。为了方便起，该脚本的输出被重定向到一个文件中，这样它就不会显示在屏幕上。\n\
  \n在启动这两个作业后，使用 `jobs` 命令查看分配给 shell 的作业。`jobs` 命令会显示已停止和正在运行的作业，以及它们的作业编号和作业中使用的命令。\n\
  \n`jobs` 命令使用了几个不同的命令行参数，如表 9-3 所示。\n\n表 9-3 `jobs` 命令参数\n\n| 参数 | 描述 |\n| --- |\
  \ --- |\n| -l | 列出进程的 `PID` 以及作业编号。 |\n| -n | 仅列出自 shell 上次通知以来状态发生改变的作业。 |\n| -p\
  \ | 仅列出作业的 `PIDs`。 |\n| -r | 仅列出正在运行的作业。 |\n| -s | 仅列出停止的作业。 |\n\n你可能注意到了 `jobs`\
  \ 命令输出中的加号和减号。带有加号的作业被视为默认作业。如果命令行中没有指定作业编号，该作业将是任何作业控制命令所引用的作业。带有减号的作业是在当前默认作业处理完成后将成为默认作业的作业。无论\
  \ shell 中运行了多少作业，任何时候都只有一个带加号和一个带减号的作业。\n\n下面的示例显示了当默认作业被移除时，下一个中的作业如何接管默认状态：\n\n\
  ![输出显示了当默认作业被移除时，队列中的作业如何接管默认状态。](img/9781284255805_CH09_CUM19.jpg)\n\n描述\n\n![输出显示了当默认作业被移除时，队列中的作业如何接管默认状态。](img/9781284255805_CH09_CUM20.jpg)\n\
  \n描述\n\n在这个示例中，启动并停止了三个独立的脚本。`jobs` 命令列表显示了三个进程及其状态。注意默认进程（带有加号列出的进程）是最后一个启动的进程。\n\
  \n然后发出了 `kill` 命令，向默认进程发送 `SIGHUP` 信号。在下一个 `jobs` 列表中，之前带有减号的作业现在是默认作业。\n\n### 重启停止的作业\n\
  \n你可以将任何停止的作业作为后台进程或前台进程重启。前台进程会接管你正在工作的终端的控制权，因此在使用该功能时要小心。\n\n要在后台模式下重启作业，请使用\
  \ `bg` (#9781284254884_Glossary.xhtml_GLOS-29) 命令以及作业编号：\n\n![输出使用 bg 命令在后台模式下重启作业。](img/9781284255805_CH09_CUM21.jpg)\n\
  \n描述\n\n![输出使用 bg 命令在后台模式下重启作业。](img/9781284255805_CH09_CUM22.jpg)\n\n描述\n\n因为作业是在后台模式下重启的，所以命令行提示符会出现，允许输入其他命令。`jobs`\
  \ 命令的输出现在显示该作业确实在运行（你可以从现在出现在显示器上的输出判断出来）。\n\n要在前台模式下重启作业，请使用 `fg` (#9781284254884_Glossary.xhtml_GLOS-98)\
  \ 命令以及作业编号：\n\n![输出使用 fg 命令在前台模式下重启作业。](img/9781284255805_CH09_CUM23.jpg)\n\n描述\n\
  \n### 调度作业\n\n在某些情况下，你需要调度一个作业。以下章节描述了如何使用 `at`。\n\n#### 使用 at 命令调度作业\n\n`at` 命令允许你指定\
  \ Linux 系统何时运行作业。`at` 守护进程运行提交给它的作业。基本的 `at` 命令格式非常简单：\n\n![at 空格 左括号 减号 f 右括号](img/9781284255805_CH09_CUM24.jpg)\n\
  \n默认情况下，`at` 从终端提交输入。你可以使用 `-f` 指定文件名。\n\n时间参数指定你想要运行作业的时间。`at` 命令识别许多时间格式：\n\n\
  *   标准的小时分钟，例如 `10:15`\n*   带有 `AM`/`PM` 指示，例如 `10:15PM`\n*   特定的命名时间，例如 `now`、`noon`\
  \ 或 `midnight`\n\n如果你指定的时间已经过去，`at` 命令将在次日的该时间运行作业。\n\n除了指定运行作业的时间，你还可以包含特定的日期，使用几种日期格式：\n\
  \n*   标准日期格式，例如 `MMDDYY`、`MM/DD/YY` 或 `DD.MM.YY`\n*   文本日期，例如 `Jul 4` 或 `Dec 25`，可以不带年份\n\
  *   你还可以指定时间增量：\n    *   `now + 25 minutes`\n    *   `10:15PM tomorrow`\n    * \
  \  `10:15 + 7 days`\n\n当你使用 `at` 命令时，作业被提交到一个作业队列。作业队列持有 `at` 命令提交的待处理作业。有 26 个不同的作业队列供不同优先级使用。作业队列使用小字母\
  \ `a` 到 `z` 进行引用。\n\n字母表越靠后的作业队列优先级越低（nice 值越高）。默认情况下，`at` 作业提交到 `a` 队列。如果你想以更高的优先级运行作业，可以使用\
  \ `-q` 参数指定不同的字母。\n\n#### 获取作业输出\n\n当作业在 Linux 系统上运行时，没有与作业关联显示器。相反，Linux 系统使用提交作业的用户电子邮件来接收任何输出消息。任何发往终端的输出将通过邮件系统发送给用户。\n\
  \n这里有一个使用 `at` 命令调度作业运行的简单示例：\n\n![显示使用 at 命令调度作业运行的示例。](img/9781284255805_CH09_CUM25.jpg)\n\
  \n\n\n\n\n![显示了使用 `at` 命令调度作业运行的示例。](img/9781284255805_CH09_CUM26.jpg)\n\n描述\n\n\
  \n\n`at` 命令会产生一条警告信息，指示系统使用什么 shell 来运行脚本（/bin/sh）、分配给作业的任务编号以及作业计划运行的时间。\n\n作业完成后，显示器上不会出现任何内容，但系统会生成一封邮件。邮件显示了脚本生成的输出。如果脚本没有产生任何输出，默认情况下不会生成邮件。你可以通过\
  \ `at` 命令中的 `-m` 选项来更改这一点。这会生成一封邮件指示作业已完成，即使脚本没有产生任何输出也是如此。\n\n### 列出等待作业\n\n`atq`\
  \ 命令允许你查看系统中正在等待的作业：\n\n![输出显示了使用 `atq` 命令系统中正在等待的作业。](img/9781284255805_CH09_CUM27.jpg)\n\
  \n描述\n\n![输出显示了使用 `atq` 命令系统中正在等待的作业。](img/9781284255805_CH09_CUM28.jpg)\n\n描述\n\
  \n作业列表显示了任务编号、系统运行该作业的日期和时间以及作业所在的队列。\n\n#### 删除作业\n\n一旦你了解了作业队列中等待作业的信息，就可以使用 `atrm`\
  \ 命令删除等待中的作业：\n\n![输出显示了使用 `atrm` 命令删除等待中的作业。](img/9781284255805_CH09_CUM29.jpg)\n\
  \n描述\n\n只需指定你想要删除的任务编号即可。你只能删除自己提交执行的作业。你无法删除他人提交的作业。\n\n### 调度周期性程序\n\n使用 `at`\
  \ 命令调度程序或脚本在预设时间运行是非常棒的，但如果你需要它每天同一时间运行、每周一次或每月一次怎么办？与其不断地提交 `at` 作业，你可以使用 Linux\
  \ 系统的另一个功能。\n\nLinux 系统使用 `cron` 程序允许你调度需要定期运行的作业。`cron` 程序在后台运行，并检查称为 `cron tables`\
  \ 的特殊表以查找计划运行的作业。\n\n#### cron 表\n\n每个单独的用户账户都有一个独立的、用于调度程序的 `cron table`。用户 cron\
  \ 表使用特殊格式，允许你指定作业应何时运行。cron 表的格式为：\n\n![分钟 空格 小时 空格 日 月 空格 星期 空格 命令。](img/9781284255805_CH09_CUM30.jpg)\n\
  \ncron 表允许你通过特定值、取值范围（例如 1–5）或通配符（星号 *）来指定条目值。例如，如果你想在每天的 10:15 运行一个命令，你会使用以下 cron\
  \ 表条目：\n\n![15 空格 10 空格 星号 星号 星号 命令。](img/9781284255805_CH09_CUM31.jpg)\n\n在 `dayofmonth`、`month`\
  \ 和 `dayofweek` 字段中使用的通配符表示 `cron` 将在每月的每天 10:15 执行该命令。要指定在每周一下午 4:15 运行命令，你会使用以下配置：\n\
  \n![15 空格 16 空格 星号 星号 1 空格 命令。](img/9781284255805_CH09_CUM32.jpg)\n\n你可以将 `dayofweek`\
  \ 条目指定为三字符文本（mon, tue, wed, thu, fri, sat, sun）或数值，其中 0 代表周日，6 代表周六。\n\n这是另一个例子：要在每月的第一天中午\
  \ 12 点执行命令，你会使用以下格式：\n\n![0 0 空格 12 空格 1 空格 星号 星号 命令。](img/9781284255805_CH09_CUM33.jpg)\n\
  \n`dayofmonth` 条目指定月份的日期值（1–31）。\n\n命令列表必须指定要运行命令的完整路径。你可以像普通命令行一样添加任何喜欢的命令行参数或重定向符号：\n\
  \n![15 空格 10 空格 星号 星号 星号 命令。](img/9781284255805_CH09_CUM34.jpg)\n\n\n\n\n\nLinux\
  \ 操作系统被设计为一种多用户操作系统。这意味着它可以支持多个用户同时登录系统，并且他们都在执行不同的操作。然而，拥有多个用户带来的问题是，你需要跟踪谁在做什么什么，以及谁被允许做什么什么！\n\
  \n这就是用户账户派上用场的地方。Linux 使用用户账户来唯一标识单个用户，并控制他们对系统中的设备、文件和文件夹的访问权限。Linux 在记录系统活动时也使用用户账户作为标识符。这样，你就可以追踪到到底是谁删除了那个重要文件！作为系统管理员，你可以控制所有\
  \ Linux 用户被允许的操作，然后从系统日志文件中监控他们的行为。\n\n本节讨论了 Linux 中使用的用户账户类型、如何使用它们以及如何管理它们。\n\n\
  ## 检查用户账户\n\nLinux 系统提供三种类型的用户账户：\n\n*   普通用户账户\n*   服务账户（有时称为伪用户）\n*   管理员账户\n\n\
  `普通用户账户` 被分配给每个使用 Linux 系统的用户。默认情况下，普通用户账户在 Linux 系统上没有任何特殊权限。普通用户只有运行程序以及访问其家目录中包含的文件和文件夹的权限。通常，一个用户账户无法访问另一个用户账户拥有的文件和文件夹（尽管稍后你会看到，你可以更改设置以允许用户组共享文件和文件夹）。\n\
  \n`服务账户` 用于必须在后台持续运行的应用程序，例如电子邮件服务器、数据库服务器和 Web 服务器。这种账户通常被称为伪用户账户，因为这些应用程序必须持续运行，需要访问系统上的文件和文件夹，而且无法让一个普通用户账户登录来运行这些程序。\n\
  \n出于安全考虑，服务账户无法登录到交互式桌面或命令行提示符，它们只能在系统后台运行。通常会为每个应用程序分配一个唯一的系统账户，该账户仅具有访问特定应用程序所需的文件和文件夹的权限。这样应用程序就被隔离，如果一个应用程序被攻击者破解（例如有人入侵了\
  \ Web 服务器应用程序），攻击者无法访问 Linux 系统的其他部分，只能访问与应用程序相关的文件。\n\n`管理员账户` 由需要完全控制系统的系统管理员使用。这些账户拥有\
  \ Linux 系统上所有文件和文件夹的权限，并且修改任何文件和文件夹的权限。在 Linux 中，主管理员账户被分配了特殊名称 `root`。\n\n由于 root\
  \ 用户账户拥有 Linux 系统上所有文件、文件夹和设备的完全权限，在执行大多数与系统相关的工作（如添加新设备、划分新文件系统或创建新用户账户）时，必须使用\
  \ root 用户账户。\n\n由于 root 用户账户拥有的巨大权力，以 root 用户账户登录是非常危险的。命令中错误位置的一个微小拼写错误就会导致 Linux\
  \ 系统完全无法使用！通常，Linux 系统管理员只在绝对必要时才以 root 用户账户登录。他们会使用普通账户账户执行日常活动，如检查电子邮件和浏览网页。\n\
  \n## 获取管理员权限\n\n由于管理员账户的重要性，Linux 系统管理员有三种方法变为 root 用户账户：\n\n*   直接从登录提示符作为 root\
  \ 用户账户登录\n*   作为普通用户账户使用 `su` 命令\n*   作为普通用户账户使用 `sudo` 命令\n\n在上一节中，你已经学习了直接以 root\
  \ 用户账户登录的危险性。除非绝对必要，否则直接以 root 用户账户登录通常不是一个好主意。事实上，某些 Linux 发行版甚至会阻止你直接以 root 用户账户登录。\n\
  \n`su` Linux 命令是一个极佳的替代方案。它允许我们将登录的用户账户切换为系统上的任何其他用户账户，包括 root 用户账户。要切换到另一个用户账户，你需要在\
  \ `su` 命令行指定该用户名。例如，如果我当前以用户账户 `rich` 登录并想切换到用户账户 `barbara`，你需要输入命令：\n\n```\nsu\
  \ - barbara\n```\n\n![Line 1: dollar space s u space hyphen space barbara. Line\
  \ 2: password colon. Line 3: dollar.](img/9781284255805_CH10_CUM01.jpg)\n\n`su`\
  \ 命令会提示你输入尝试切换的用户账户的密码。命令中的横杠 `-` 告诉 `Bash` 模拟实际登录，运行为该账户创建的任何登录 脚本，包括切换目录。如果不使用横杠，你将以该用户登录，但仍然访问你自己的环境。\n\
  \n当你单独输入 `su` 命令时，Linux 会假设你想切换到 root 用户账户。Linux 系统将提示你输入 root 用户账户的密码，以确保你有权限代表\
  \ root 账户操作。\n\n了解 root 用户账户的能力后，你可能会好奇如何记得登录的是哪个账户。大多数 Linux 系统使用命令提示符来指示你的权限级别。当你以普通用户账户登录时，命令提示符是美元符号\
  \ (`$`)；当你使用 `su` 命令获得 root 权限时，命令提示符变为井号 (`#`)，如下例所示：\n\n```\nsu\n```\n\n![Line\
  \ 1: dollar space s u. Line 2: password colon. Line 3: hash space exit. Line 4:\
  \ dollar.](img/9781284255805_CH10_CUM02.jpg)\n\n在你输入 root 用户账户密码后，命令提示符变为井号，表示你现在是\
  \ root 用户账户。在井号命令提示符下，输入的任何命令都具有 root 权限。当你完成管理员任务后，只需使用 `exit` 命令退出 root 用户账户并切回普通用户账户（以及美元符号提示符）。\n\
  \n`sudo` 命令提供了另一种作为 root 用户账户登录的替代方案。不需要直接登录 root 用户账户来输入多条命令，`sudo` 命令允许你以 root\
  \ 用户账户运行单个命令，本质上授予了你临时账户权限。只需将你需要运行的命令作为 `sudo` 命令的参数即可：\n\n```\nsudo cat\n```\n\
  \n![An output shows the usage of the sudo command with cat as the parameter.](img/9781284255805_CH10_CUM03.jpg)\n\
  \nDescription\n\n注意命令提示符完全没有变化。示例从普通用户账户开始，提交了带有系统命令的 `sudo` 命令，然后当该命令完成后，它又恢复到普通用户账户的美元符号提示符。\n\
  \n\n\n\n\n另请注意，`sudo` 命令提示我输入自己的密码，而不是 root 用户账户的密码。这不是错误，而是一个安全功能。只有特定的用户账户被允许使用\
  \ `sudo` 命令。你必须验证自己的身份才能使用该命令。系统会在一段时间内维护你的验证状态（你可以配置该时间），因此在此时间段内后续使用的任何 `sudo`\
  \ 命令将不再需要密码。\n\n`/etc/sudoers` 文件列出了有权运行 `sudo` 命令的用户账户，并限制了它们可以使用 root 权限运行的特定命令。你必须使用\
  \ `visudo` 程序（`vi` 编辑器程序的特殊版本）来编辑 `/etc/sudoers` 文件。\n\n## 与组一起操作\n\n在多用户环境中，你经常会遇到这样的情况：你希望多个用户账户访问相同的文件和文件夹（例如，销售团队处理同一个项目）。在\
  \ Linux 环境中，当尝试共享文件时，设置为单个用户账户的文件权限将无法起作用。\n\n为了解决这个问题，Linux 支持组。`group`（组）是用户账户的集合，在权限管理上被视为单一账户。你可以为一个组分配文件和文件夹权限，从而允许组内的所有用户账户访问共享的文件和文件夹。\n\
  \nLinux 在 `/etc/groups` 文件中存储有关组账户的信息。文件中的每行都定义一个组，其中包含组名、唯一的组 ID 值以及该组组成员的用户账户列表。要添加新组，请使用\
  \ `groupadd` 命令。\n\n默认情况下，当你在 Linux 中创建一个新用户账户时，系统会将该用户分配到默认用户组中。大多数 Linux 发行版会为每个用户账户创建单独的用户组，这样你就不会无意中创建共享的文件或文件夹。\n\
  \n## 管理用户账户\n\n你将使用五个基本命令来管理 Linux 中的用户账户：\n\n*   `useradd`: 创建新用户账户\n*   `userdel`:\
  \ 删除现有用户账户\n*   `usermod`: 修改现有用户账户的设置\n*   `passwd`: 更改现有用户账户的密码\n*   `chage`:\
  \ 更改现有用户账户的密码过期属性\n\n`useradd` 命令有很多参数，你可以用它们自定义 Linux 创建新用户账户的方式。这些参数见表 10-1。\n\
  \n表 10-1 useradd 命令参数。\n\n| 参数 | 说明 |\n| --- | --- |\n| `-c comment` | 用户账户注释字段的值\
  \ |\n| `-d home` | 用户主目录的路径（默认是 `/home/username`） |\n| `-e date` | 账户自动过期的日期 |\n\
  | `-g group` | 用户账户的默认组 |\n| `-m` | 创建主目录并将 `/etc/skel` 文件夹中的内容复制其中 |\n| `-s shell`\
  \ | 用户账户的 shell |\n| `-u UID` | 使用特定的 UID 值，而不是让 Linux 自动分配 |\n\n例如，要创建一个名为 `test1`\
  \ 的新用户账户并为该账户分配主目录，请使用此命令：\n\n```\nsudo useradd -m test1\n```\n\n创建用户账户后，使用 `passwd`\
  \ 命令为该账户分配一个默认密码：\n\n```\nsudo passwd test1\n```\n\n现在，你可以使用刚刚创建的 `test1` 用户账户和密码登录命令行或桌面环境了！\n\
  \n你可以使用 `usermod` 命令更改现有用户账户的这些设置中的任意。例如，要更改用户账户的注释字段，只需使用：\n\n```\nsudo usermod\
  \ -c \"Test test1\" test1\n```\n\n当你想要删除用户账户时，只需使用 `userdel` 命令：\n\n```\nsudo userdel\
  \ test1\n```\n\n## Linux 文件和目录权限\n\nLinux 的核心安全功能是文件和目录权限。Linux 通过为每个文件和目录分配一个所有者，并允许该所有者设置基本安全设置以控制对文件或目录的访问来实现。以下章节将介绍\
  \ Linux 如何处理文件和目录的所有权，以及你可以分配给 Linux 系统中任何文件或目录的基本权限设置。\n\n### 理解所有权\n\nLinux 使用三级防护方法来保护文件和目录：\n\
  \n*   **所有者（Owner）**——在 Linux 系统中，每个文件和目录都分配给单一所有者。Linux 系统管理员可以为文件或目录分配特定的权限。\n\
  *   **组（Group）**——Linux 系统还将每个文件和目录分配给单一的用户组。管理员可以为该组分配特定的文件或目录权限，且这些权限与所有者的权限不同。\n\
  *   **其他（Others）**——这类权限分配给任何不是所有者也不属于分配用户组的用户账户。\n\n你可以通过在 `ls` 命令中添加 `-l` 选项来查看文件或目录分配的所有者和组。\n\
  \n```\nls -l\n```\n\n第一列 `-rw-rw--` 定义了分配给所有者、组和其他人的访问权限。第三列显示了分配为文件所有者的用户账户。第四列显示了分配给文件的组。\n\
  \n当用户创建文件或目录时，Linux 系统默认将该用户分配为所有者，并使用该用户所属的主组作为该文件或目录的组。你可以使用 Linux 命令更改分配给文件和目录的默认所有者组。以下章节将展示如何操作。\n\
  \n### 更改文件或目录所有权\n\nroot 用户账户可以使用 `chown` 命令更改分配给文件或目录的所有者。`chown` 命令的格式如下：\n\n\
  ```\nchown [options] owner filenames\n```\n\n`owner` 参数是分配给文件或目录的新所有用户名，`filenames`\
  \ 是要更改的文件或目录名称。你可以通过在每个文件或目录名称之间放置空格来指定多个文件或目录。\n\n```\nchown newowner file1 file2\n\
  ```\n\n`chown` 命令有一些命令行选项，但大多很冷门且不常用。对你可能有用的一个选项是 `-R` 选项，它可以递归地更改指定目录下所有文件和目录的所有者。\n\
  \n### 更改文件或目录组\n\n文件或目录的所有者或 root 用户账户可以使用 `chgrp` 命令更改分配给文件或目录的组。`chgrp` 命令使用此格式：\n\
  \n```\nchgrp group filename\n```\n\n\n\n\n\n![c h g r p space open bracket options\
  \ close bracket space new group space filenames.](img/9781284255805_CH10_CUM11.jpg)\n\
  \n`newgroup` 参数是分配给文件或目录的新用户组名称，而 `filenames` 参数是要更改的文件或目录的名称。如果你是文件的所有者，你只能将组更改为你所属的某个组。root\
  \ 用户账户可以将组更改为系统上的任何用户组：\n\n![An output changes the group assigned to the file or\
  \ directory by using the c h g r p command.](img/9781284255805_CH10_CUM12.jpg)\n\
  \n描述\n\n`chown` 命令允许你使用以下格式同时更改分配给文件或目录的所有者和组：\n\n![chown space new owner colon\
  \ new group space filenames.](img/9781284255805_CH10_CUM13.jpg)\n\n这通常比使用单独的 `chgrp`\
  \ 命令更优。\n\n### 控制访问权限\n\n在建立文件或目录的所有者和组之后，你可以为每个对象分配特定的权限。Linux 使用三种类型的权限控制：\n\n\
  *   读取—访问文件或目录中存储数据的能力\n*   写入—修改文件或目录中存储数据的能力\n*   执行—在系统上运行该文件的能力，或者列出目录中包含的文件列表的能力\n\
  \n你可以为每个层级的保护（所有者、组和其他用户）分配不同的读取、写入和执行权限。这创建了一组九种不同的权限，分配给 Linux 系统上的每个文件和目录。当你使用\
  \ `-l` 选项时，这九种权限会出现在 `ls` 输出的第一列信息中，如列列表 10-1 所示。图 10-1 显示了权限在 `ls` 输出中显示的顺序。\n\n\
  ![一个图表显示了 l s 输出中文件和目录权限的显示顺序。](img/9781284255805_CH10_FIGF01.jpg)\n\n图 10-1 `ls`\
  \ 输出中显示的文件和目录权限。\n\n描述\n\n在图 10-1 中，第一个字符表示对象类型。横杠 `-` 表示文件，而 `d` 表示目录。\n\n接下来的三个字符按照读取、写入和执行的顺序表示所有者权限。横杠\
  \ `-` 表示未设置权限，而 `r`、`w` 或 `x` 表示设置了读取、写入或执行权限。在列表 10-1 的示例中，所有三个文件的所有者权限都使用 `rw-`，这意味着所有者有读取和写入文件的权限，但不能执行或运行该文件。这在数据文件中很常见。\n\
  \n第二组三个字符表示该文件或目录的组权限。同样，它使用读取、写入和执行的顺序，横杠 `-` 表示未设置权限。在对营销组的 `customers.txt` 文件更改后，销售组只能写入\
  \ `research.txt` 和 `salesdata.txt` 文件，而营销组只能写入 `customers.txt` 文件。\n\n最后，第三组三个字符表示分配给不是文件或目录所有者或所属组成员的用户账户的权限。同样使用了读取、写入和执行的顺序。在列表\
  \ 10-1 示例中，系统上的其他用户账户可以读取文件但不能写入或执行它们。\n\nroot 用户账户或文件或目录的所有者可以使用 `chmod` 命令更改所分配的权限。\n\
  \n`chmod` 命令的格式可能有些困惑。它使用两种不同的模式来表示所有者、组和其他用户的读取、写入和执行权限设置。\n\n在符号模式中，使用 `u`（所有者）、`g`（组）或\
  \ `o`（其他）或 `a`（所有）来指定对象，并使用 `r`（读取）、`w`（写入）或 `x`（执行）来指定权限。使用 `+` 添加权限、`-` 移除权限或\
  \ `=` 设置权限。如列表 10-1 所示，在 `chmod` 命令中，使用 `+` 符号表示添加权限，`-` 符号表示移除权限，或 `=` 符号设置权限。如列表\
  \ 10-1 所示，在 `chmod` 命令中，使用 `ug` 组合表示所有者和组。八进制模式中，使用三个八进制数字表示权限，所有者、组和和其他各一个。这种八进制模式比符号模式更方便。[表\
  \ 10-2]显示了八进制模式与符号模式的对应。\n\n| 八进制值 | 权限 | 含义 |\n| :--- | :--- | :--- |\n| 0 | ---\
  \ | 无权限 |\n| 1 | --x | 仅执行 |\n| 2 | -w- | 仅写入 |\n| 3 | -wx | 写入和执行 |\n| 4 | r--\
  \ | 仅读取 |\n| 5 | r-x | 读取和执行 |\n| 6 | rw- | 读取和写入 |\n| 7 | rwx | 读取、写入和执行 |\n\n\
  在列表 10-4 中，`664` 八进制模式将所有者和组的权限设置为读取和写入（6），而其他权限设置为读取（4）。你可以从 `ls` 输出中看到结果。\n\n\
  ### 探索特殊权限\n\nLinux 使用三个特殊权限位来控制文件和目录的高级行为。\n\n设置用户 ID (SUID) 位用于可执行文件。它告诉 Linux\
  \ 内核以文件所有者的权限运行程序，而不是运行文件的用户账户的权限。此功能最用于需要 root 用户权限才能访问系统上所有文件的服务器应用程序，即使启动进程的用户是标准用户。\n\
  \nSUID 位通过在所有者执行权限字母处用 `s` 来表示：`rwsrxr-x`。系统假设文件具有执行权限。如果在没有所有者执行权限的文件上设置了 SUID\
  \ 位，则用大写的 `S` 表示。\n\n若要为文件设置 SUID 位，在符号模式中向所有者权限添加 `s`，或者在八进制模式中在八进制模式设置的开头包含 `4`。\n\
  \n设置组 ID (SGID，也称为 GUID) 位在文件和目录中的工作方式不同。对于文件，它告诉 Linux 以文件的组权限运行程序文件。它通过在组执行位置用\
  \ `s` 来表示：`rwxrwsr--`。\n\n\n\n\n对于目录来说，`SGID` old 位可以帮助我们创建一个多个用户可以共享文件的环境。当一个目录设置了\
  \ `SGID` old 位时，用户在该目录中创建的任何文件都将被分配目录的组，而不是用户的所属组。这样，该组中的所有用户都可以拥有与共享目录中的所有文件相同的权限。\n\
  \n要设置 `SGID` old 位，在符号模式下，向组权限添加 `s`，或者在在八进制模式下，在八进制模式设置的开头包含一个 `2`：\n\n![Line 1:\
  \ hash space c h mod space g plus s space slash sales. Line 2: hash space c h mod\
  \ space 2 6 6 0 space slash sales.](img/9781284255805_CH10_CUM18.jpg)\n\n最后，粘滞位（sticky\
  \ bit）用于保护文件不被非所有者删除，即使他们属于对文件具有写入权限的组。粘滞位在其他用户的执行位上用一个 `t` 表示：`rwxrw-r-t`。\n\n\
  粘滞位通常用于组共享的目录。组员对目录包含的数据文件具有读写访问权限，但只有文件所有者才能从共享目录中删除文件。\n\n要设置粘滞位，在符号模式下，向所有者权限添加\
  \ `t`，或者在八进制模式下，在八进制模式设置的开头包含一个 `1`：\n\n![Line 1: hash space c h mod space o plus\
  \ t space slash sales. Line 2: hash space c h mod space 1 7 7 7 space slash sales.](img/9781284255805_CH10_CUM19.jpg)\n\
  \n### 管理默认权限\n\n当用户创建一个新文件或目录时，Linux 系统会为分配一个默认的所有者、组和权限。正如预期的，默认所有者是创建该文件的用户。默认组是该所有者的主组（primary\
  \ group）。\n\n用户掩码（user mask）功能定义了 Linux 分配给文件或目录的默认权限。用户掩码是一个八进制值，代表从文件的八进制模式 `666`\
  \ 权限或目录的八进制模式 `777` 权限中移除的位。\n\n用户掩码值通过 `umask` 命令设置。你可以通过在命令行中直接输入命令本身来查看当前的 `umask`\
  \ 设置：\n\n![Line 1: dollar space u mask. Line 2: 0 0 2 2\\. Line 3: dollar.](img/9781284255805_CH10_CUM20.jpg)\n\
  \n`umask` 命令的输出显示四个八进制值。第一个八进制值代表分配为你创建的文件和目录的 `SUID` (4)、`GUID` (2) 和粘滞位 (1) 的掩码。接下来的三个八进制值则掩盖了所有者、组和其他的权限设置。\n\
  \n掩码是应用于文件或目录权限位上的位运算掩码。掩码中设置的任何位都会从文件或目录的权限中移除。如果某个位未设置，则掩码不会更改该设置。TABLE 10-3 演示了在你的\
