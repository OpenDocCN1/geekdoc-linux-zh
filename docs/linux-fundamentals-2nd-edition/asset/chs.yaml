  \n# 第 1 章：Linux 基础\n\nLINUX 操作系统已经成为最广泛使用的操作系统之一，在研究人员、应用开发者和爱好者中都广受欢迎。如今，Linux\
  \ 操作系统可以出现在各种计算机环境中，从手机到卫星。\n\n本章将探讨 Linux 操作系统到底是什么，以及为什么有这么多不同的 Linux 发行版供选择。通过这些信息，你可以为你的环境选择合适的\
  \ Linux 发行版。\n\n## 什么是 Linux？\n\n如果你以前从未接触过 Linux，你可能会困惑为什么会有这么多不同的版本。在查看 Linux\
  \ 软件包时，你可能听过发行版（distribution）、LiveDVD 和 GNU 等术语，并可能感到困惑。在你开始研究 Linux 命令和特性之前，本节将揭开\
  \ Linux 系统的一些神秘面纱。\n\n尽管人们通常将 Linux 操作系统直接称为“Linux”，但实际上，很多部分组成了一个完整的 Linux 系统。Linux\
  \ 系统主要包含四个部分：\n\n*   Linux 内核\n*   GNU 工具\n*   用户界面\n*   应用软件\n\n这四个部分中的每一个部分在 Linux\
  \ 系统中都承担着特定的任务。虽然每个部分本身并不非常有用，但它们结合在一起，就创建了人们所说的“Linux”。图 1-1 显示了这些部分如何组合形成整个 Linux\
  \ 系统的基础图。\n\n![图表显示了完整 Linux 系统的四个主要部分。](img/9781284255805_CH01_FIGF01.jpg)\n\n\
  图 1-1 Linux 系统。\n\n描述\n\n接下来的章节将详细描述这四个部分，并让你概述它们如何协同工作以创建一个完整的 Linux 系统。\n\n##\
  \ Linux 内核\n\nLinux 系统的核心是内核。内核控制计算机系统上的所有硬件和软件，在必要时提供硬件访问权限，并在需要时执行软件。\n\n如果你关注过\
  \ Linux 世界，那么一定听过林纳斯·托瓦尔斯（Linus Torvalds）的名字。Linus 是在赫尔辛基大学上学期间负责创建第一个 Linux 内核软件的人。他本意是将其作为\
  \ Unix 系统的副本，而当时 Unix 是许多大学使用的流行操作系统。\n\n在开发出 Linux 内核后，Linus 将其发布到互联网社区，并征求改进建议。这个简单的过程在计算机操作系统世界中引发了一场革命。很快，Linus\
  \ 就收到了来自世界各地学生和专业程序员的建议。\n\n允许任何人更改内核中的编程代码将导致完全的混乱。为了简化问题，Linus 充当了所有改进建议的中心。最终是否将建议的代码合并到内核由\
  \ Linus 决定。这种理念仍然适用于 Linux 内核代码，只不过不再仅仅由 Linus 个人控制内核代码，而是由一个开发团队承担了这项任务。\n\n内核主要负责四个主要功能：\n\
  \n*   系统内存管理\n*   软件程序管理\n*   硬件管理\n*   文件系统管理\n\n接下来的章节将更详细地探索这些功能。\n\n### 系统内存管理\n\
  \n操作系统内核的主要功能之一是内存管理。内存管理是控制程序和工具在系统内存限制内运行的能力。内核不仅管理服务器上可用的物理内存，还可以创建和管理虚拟内存，即实际上并不存在但在硬盘上创建并被视为真实内存的内存。\n\
  \n它通过使用硬盘上称为交换空间（swap space）的空间来实现这一点。内核在虚拟内存的位置与交换空间以及实际物理内存之间来回交换。这使得应用程序认为可用内存比物理实际存在的多（如图\
  \ 1-2 所示）。\n\n![三个标记为虚拟内存、物理内存和交换空间的框都指向内核框。交换空间框被放置在一个圆柱中。](img/9781284255805_CH01_FIGF02.jpg)\n\
  \n图 1-2 Linux 系统内存映射。\n\n内存位置被分组称为页（pages）的块。内核在物理内存或交换空间定位每个内存页。然后，内核维护一张表，指示哪些页在物理内存中，哪些已交换出。\n\
  \n内核跟踪哪些内存页正在使用，并自动将一段时间未被访问的内存页复制到交换空间（称为交换出）——即使有其他可用内存。当程序想要访问已交换出的内存页时，内核必须通过交换出另一个内存页并从交换空间换入所需的页，为物理内存腾空间。显然，这个过程需要时间并会降低运行速度。只要\
  \ Linux 系统运行，交换页的过程就会持续。\n\n你可以通过查看特殊的 `/proc/meminfo` 文件来查看 Linux 系统虚拟内存的当前状态。这是一个\
  \ `/proc/meminfo` 条目的示例：\n\n```\n(示例 /proc/meminfo 项)\n```\n\n描述\n\n`MemTotal` 和\
  \ `MemFree` 行显示此台 Linux 服务器有 20 GB 物理内存，目前有约 14 GB 未使用（空）。输出还显示该系统可用 2 GB 的交换内存。内核不断更新\
  \ `meminfo` 文件，以显示此时内存的确切情况。\n\n### 软件程序管理\n\n在 Linux 操作系统中，运行的程序被称为进程（process）。进程可以在在前台运行（在显示器上显示输出），也可以在后台运行。内核控制\
  \ Linux 系统如何管理系统中运行的所有进程。\n\n\n\n\n内核创建第一个进程，称为 init 进程，用于启动系统上的所有其他进程。当内核启动时，它会将\
  \ `init process` 加载到虚拟内存中。当内核启动每个额外的进程时，它会在虚拟内存中为其分配一个唯一的区域，用于存储该进程使用的数据和代码。\n\n\
  Linux 中有几种不同类型的 `init process` 实现方式，但如今有两种最受欢迎：\n\n*   `SysVinit`——SysVinit 初始化方法是\
  \ Linux 最初使用的方法，它基于 Unix System V 的初始化方法。尽管现在许多 Linux 发行版不再使用它，但你仍然可以在旧的 Linux 发行版中发现它。\n\
  *   `Systemd`——`systemd` 初始化方法创建于 2010 年，已成为 Linux 发行版最常用的初始化和进程管理系统。\n\n## SysVinit\
  \ 方法\n\n`SysVinit` 初始化方法使用了一种称为运行级别（run levels）的概念来确定启动哪些进程。运行级别定义了运行中的 Linux 系统状态以及每个状态下应该运行的进程。表\
  \ 1-1 显示了与 `SysVinit` 初始化方法相关的不同运行级别。\n\n表 1-1 SysVinit 初始化方法。\n\n| 运行级别 | 描述 |\n\
  | --- | --- |\n| 0 | 关闭系统 |\n| 1 | 用于系统维护的单用户模式 |\n| 2 | 未启用网络服务的多用户模式 |\n| 3 |\
  \ 已启用网络服务的多用户模式 |\n| 4 | 自定义 |\n| 5 | 启用 GUI 的多用户模式 |\n| 6 | 重启系统 |\n\n`/etc/inittab`\
  \ 文件定义了系统的默认运行级别。特定运行级别启动的进程定义在 `/etc/rc.d` 目录的子目录下。你可以随时使用 `runlevel` 命令查看当前运行级别：\n\
  \n```\n![Line 1: dollar space run level. Line 2: N space 5\\. Line 3: dollar.](img/9781284255805_CH01_CUM03.jpg)\n\
  ```\n\n此输出显示系统当前处于运行级别 5，这是图形桌面所使用的默认级别。\n\n## systemd 方法\n\n`systemd` 初始化方法之所以流行，是因为它对原始\
  \ init 方法进行了多项改进。其中一项改进是它具有根据不同事件启动进程的能力：\n\n*   当系统启动时\n*   当连接特定的硬件设备时\n*   当服务启动时\n\
  *   当建立网络连接时\n*   当定时器过期时\n\n`systemd` 方法通过将事件链接到单元文件（unit files）来确定运行哪些进程。每个单元文件定义了发生指定事件时启动的程序。`systemctl`\
  \ 程序允许你启动、停止和列出系统中当前运行的单元文件。\n\n`systemd` 方法还将单元文件分组为目标（targets）。目标定义了 Linux 系统的特定运行状态，类似于\
  \ `SysVinit` 的运行级别概念。系统启动时，default.target 目标定义了所有要启动的单元文件。你可以使用 `systemctl` 命令查看当前的默认目标：\n\
  \n```\n![Line 1: dollar space system c t l space get hyphen default. Line 2: graphical\
  \ dot target. Line 3: dollar.](img/9781284255805_CH01_CUM04.jpg)\n```\n\n`graphical.target`\
  \ 目标定义了在运行多用户图形环境下启动的进程，类似于旧的 `SysVinit` 运行级别 5。\n\n## 查看进程\n\n`ps` 命令允许你查看当前 Linux\
  \ 系统上运行的进程。以下是你使用 `ps` 命令时看到的示例：\n\n```\n![An output of the p s command is shown.](img/9781284255805_CH01_CUM05.jpg)\n\
  ```\n\nDescription\n\n```\n![Continuation](img/9781284255805_CH01_CUM06.jpg)\n```\n\
  \nDescription\n\nLinux 系统在任何时候都有许多运行的进程；我简化了输出，仅显示列出的进程中的几个。输出的第一列显示进程 ID（或 `PID`）。注意，第一个进程是友好的\
  \ `init process`，Linux 系统为其分配了 `PID` 1。所有在 `init process` 之后启动的进程都按数字顺序分配 `PID`。没有两个进程具有相同的\
  \ `PID`。\n\n第三列显示进程的当前状态（`I` 表示空闲，`S` 表示睡眠，`R` 表示运行）。最后一列显示进程名称。`ps` 命令用于确定命令行参数。\n\
  \n## 硬件管理\n\n内核的另一项职责是硬件管理。Linux 系统必须与之通信的任何设备都需要驱动程序代码。驱动代码允许内核在应用程序之间传递数据。将驱动代码与内核接口的方法有两种：\n\
  \n*   编译设备\n*   将设备编译为单独的模块\n\n在 Linux 极早期，插入驱动代码的唯一方法是重新编译内核。每当你添加新设备时，都必须重新编译内核。随着\
  \ Linux 支持更多硬件以及可热拔设备（如 USB 盘）变得流行，这个过程变得更加低效。幸运的是，Linux 开发人员发明了一种更好的方法向运行中的内核插入驱动代码。这大大简化了\
  \ Linux 对硬件的使用。\n\nLinux 系统将硬件设备表示为称为设备文件（device files）用于一次只能处理一个字符的设备。大多数类型的调制解调器和终端创建为字符文件。块设备文件用于磁盘驱动器等一次可以处理大块数据的设备。\n\
  \n网络设备文件类型（也称为 `socket` 文件）用于使用数据包发送和接收数据的设备。这包括用于在同一物理主机上的程序之间发送网络数据的临时文件，以及一个允许\
  \ Linux 系统通过常用网络协议与自身通信的特殊环回设备。\n\nLinux 为系统上的每个设备创建一个称为节点（nodes）\n```\n\n\n\n不同的\
  \ Linux 发行版使用不同的设备名称来处理设备。在这个发行版中，`sda` 设备是系统中的第一块固态硬盘（SSD）。\n\n第五列是主设备节点号。注意，所有的\
  \ `sda` 设备都具有相同的主设备节点号 `8`。第六列是次设备节点号。每个主设备号下的每个设备都有自己唯一的次设备节点号。\n\n第一列表示设备文件的权限。权限的第一个字符表示文件类型。注意，SSD\
  \ 文件都被标记为块设备 `(b)`。\n\n## 文件系统管理\n\n文件系统定义了操作系统如何在存储设备上存储数据。与某些其他操作系统不同，Linux 内核可以支持不同类型的文件系统，以便在硬盘器、CD\
  \ 或 DVD 设备以及 USB 闪存盘上进行读写操作。Linux 除了拥有十多种自己的文件系统外，还可以读写和读写由其他操作系统（如 Microsoft Windows）使用的文件系统。内核在编译时必须支持系统将要使用的所有类型的文件系统，或者必须构建并安装设备驱动模块来支持该文件系统。表\
  \ 1-2 列出了 Linux 系统可用于读写数据的标准文件系统。\n\n表 1-2 Linux 文件系统。\n\n| FILESYSTEM | DESCRIPTION\
  \ |\n| --- | --- |\n| ext | Linux 扩展文件系统——原始的 Linux 文件系统 |\n| ext2 | 第二扩展文件系统，比\
  \ ext 提供了高级功能 |\n| ext3 | 第三扩展文件系统，支持日志记录 |\n| ext4 | 第四扩展文件系统，支持高级日志记录 |\n| btrfs\
  \ | 一种新的、高性能的文件系统，支持日志记录和大文件 |\n| exfat | 扩展 Windows 文件系统，用于 SD 卡和 U 盘 |\n| hpfs\
  \ | OS/2 高性能文件系统 |\n| jfs | IBM 的日志文件系统 |\n| iso9660 | ISO 9660 文件系统（光光光） |\n| minix\
  \ | MINIX 文件系统 |\n| msdos | Microsoft FAT16 |\n| nfs | 网络文件系统 |\n| ntfs | 支持 Microsoft\
  \ NT 文件系统 |\n| proc | 系统信息 |\n| smb | 用于网络访问的 Samba SMB 文件系统 |\n| sysv | 旧的 Unix\
  \ 文件系统 |\n| ufs | BSD 文件系统 |\n| umsdos | 位于 MS-DOS 之上的类 Unix 文件系统 |\n| vfat | Windows\
  \ 95 文件系统 (FAT32) |\n| XFS | 高性能 64 位日志文件系统 |\n\nLinux 系统访问的任何硬盘必须使用表 1-1 列出的文件系统类型进行格式化。\n\
  \nLinux 内核通过虚拟文件系统 (VFS) 与每个文件系统建立接口。这为内核与任何类型的文件系统通信提供了标准接口。当每个文件系统挂载和使用时，VFS 在内存中缓存信息。\n\
  \n## GNU 工具\n\n除了需要控制硬件设备的内核外，计算机操作系统还需要工具来执行标准功能，例如处理文件和程序。尽管 Linus 创建了 Linux 系统内核，但他并没有可以运行在其上的系统实用程序。对他来说的是，在他工作的同时，互联网上的一群人正在合作，试图开发一套模仿流行的\
  \ Unix 操作系统的标准计算机系统工具集。\n\nGNU 组织（GNU 代表 GNU's Not Unix，这是一个巧妙的递归缩写）开发了一套完整的 Unix\
  \ 类工具，但没有一个可以运行它们的内核系统。这些工具是在名为开源软件 (OSS) 的软件哲学下开发的。\n\nOSS 的概念允许程序员开发软件并将其发布到世界上供使用，通常没有任何许可费用。任何人都可以该软件、修改它或将其整合到自己的系统中，而无需支付许可费。将\
  \ Linus 的 Linux 内核与 GNU 操作系统工具相结合，创建了一个完整、功能、免费操作系统。\n\n尽管 Linux 内核和 GNU 工具的组合通常只被称为\
  \ Linux，但你会在互联网上看到一些 Linux 原生主义者称之为 GNU/Linux 系统，以感谢 GNU 组织对这一事业的贡献。\n\nGNU 项目主要为\
  \ Unix 系统管理员设计，以提供一个可用的 Unix 类环境。这种关注导致该项目移植了许多常用的 Unix 系统命令行工具。为 Linux 系统提供的核心工具包称为\
  \ coreutils 软件包。\n\nGNU coreutils 包包含三个部分：\n* 处理文件的工具\n* 处理文本的工具\n* 管理进程的工具\n\n\
  这三组主工具中的每组都包含若干个对 Linux 系统管理员和程序员来说无价之宝实用工具程序。\n\n## Linux 用户界面\n\n拥有一个可以管理你的计算机硬件和软件的世界级操作系统是非常棒的，但你需要某种方式与它通信。随着\
  \ Microsoft Windows 的普及，桌面用户期望某种类型的图形显示。这促进了 OSS 的更多开发，Linux 桌面由此应运而生。\n\nLinux\
  \ 以可以用多种方式完成事情而闻名，这一点在图形桌面上尤为突出。Linux 中有许多图形桌面供选择。以下章节描述了其中一些最流行的。\n\n### X Window\
  \ 系统\n\n两个基本元素控制你的视频环境——显卡和显示器。为了在你的计算机上显示复杂的图形，Linux 软件需要与两者通信。\n\nX Window 软件是一个直接与显卡和显示器工作的底层程序，控制\
  \ Linux 应用程序展示窗口和图形。\n\nLinux 并不是唯一使用 X Window 的操作系统；许多操作系统都有版本。在 Linux 世界，有几个软件包可以实现\
  \ X Window，但最常用的有两个：\n* X.org\n* Wayland\n\nX.org 软件包是两者较旧的，基于原始 Unix 窗口系统版本 11（通常称为\
  \ X11）。更多的 Linux 发行版正在向新的 Wayland 迁移，它更多功能且更容易维护。\n\n核心 X Window 软件为运行图形应用程序提供界面，除此之外没有其他功能。虽然对于运行单个应用程序来说是可以的，但对于日常计算机使用来说并没有太大用处。它没有允许用户操作文件或启动程序的桌面环境。要做到这一点，你需要在\
  \ X Window 系统软件之上一个桌面环境。\n\n### KDE Plasma Desktop\n\n\n\n\n\nK 桌面环境 (KDE) 首次于 1996\
  \ 年作为一个开源项目发布，旨在创建一个与微软 Windows 环境类似的图形桌面。KDE 桌面整合了你作为 Windows 用户可能熟悉的所有功能。图 1-3\
  \ 显示了当前版本，名为 KDE Plasma，它运行在 openSUSE Linux 发行版中。\n\n![截图显示了 openSUSE 中的 K KDE Plasma\
  \ 桌面。](img/9781284255805_CH01_FIGF03.jpg)\n\n图 1-3 openSUSE 中的 KDE Plasma 桌面。\n\n\
  由 KDE 提供。\n\n描述\n\nKDE Plasma 桌面允许你将应用程序和文件图标放置在桌面上的特殊区域。如果你点击应用程序图标，Linux 系统将启动该程序。如果你点击文件图标，KDE\
  \ 桌面将尝试确定启动哪个应用程序来处理该文件。\n\n桌面底部的条称为面板（Panel）。面板由四个部分组成：\n\n*   K 菜单——类似于 Windows\
  \ 的开始菜单，K 菜单包含启动已安装应用程序的链接。\n*   程序快捷方式——这些是直接从面板启动应用程序的快速链接。\n*   任务栏——任务栏显示当前在桌面上运行的应用程序图标。\n\
  *   组件（Applets）——这些是小型应用程序，在面板中有一个图标，可以根据应用程序的信息发生变化。\n\n面板的所有功能与你在 Microsoft Windows\
  \ 中找到的相似。除了桌面功能外，KDE 项目还开发了大量在 KDE 环境中运行的应用程序。这些应用程序在表 1-3 所示。（你可能会注意到 KDE 应用程序名称大字母\
  \ K 的趋势。）\n\n表 1-3 KDE 应用程序。\n\n| 应用程序 | 描述 |\n| --- | --- |\n| Amarok | 音频文件播放器\
  \ |\n| digiKam | 数字相机软件 |\n| Dolphin | 文件管理器 |\n| K3b | CD 刻录软件 |\n| Kaffeine |\
  \ 视频播放器 |\n| KMail | 电子邮件客户端 |\n| KOffice | 办公套件 |\n| Konqueror | 文件和网页浏览器 |\n|\
  \ Kontact | 个人信息管理器 |\n| Kopete | 即时消息客户端 |\n\n这只是 KDE 项目产出的应用程序部分列表。KDE 桌面还包含了更多应用程序。\n\
  \n### GNOME 桌面\n\nGNU 网络对象模型环境 (GNOME) 是另一个流行的 Linux 桌面环境。GNOME 最初于 1999 年发布，已成为许多\
  \ Linux 发行版的默认桌面环境（最流行的是红帽企业级 Linux）。\n\n图 1-4 显示了 Ubuntu Linux 发行版中使用的标准 GNOME\
  \ 3 桌面。\n\n![截图显示了 GNOME 3 桌面。活动和垃圾桶图标位于桌面的左上。左侧丝带中从上到下在活动下列出了几个图标。](img/9781284255805_CH01_FIGF04.jpg)\n\
  \n图 1-4 Ubuntu Linux 系统上的 GNOME 3 桌面。\n\n由 GNOME 项目提供。\n\n为了不输输给 KDE，GNOME 开发者也制作了一系列与\
  \ GNOME 桌面集成的图形应用程序，如表 1-4 所示。\n\n表 1-4 GNOME 应用程序。\n\n| 应用程序 | 描述 |\n| --- | ---\
  \ |\n| Epiphany | 网页浏览器 |\n| Evince | 文档查看器 |\n| Gcalctool | 计算器 |\n| Gedit | GNOME\
  \ 文本编辑器 |\n| GNOME Panel | 用于启动应用程序的桌面面板 |\n| GNOME Nettool | 网络诊断工具 |\n| GNOME\
  \ Terminal | 终端模拟器 |\n| Nautilus | 图形文件管理器 |\n| Nautilus CD Burner | CD 刻录工具 |\n\
  | Sound Juicer | 音频 CD 刻录工具 |\n| Tomboy | 笔记软件 |\n| Totem | 多媒体播放器 |\n\n如你所见，GNOME\
  \ 桌面也提供了许多应用程序。除了这些应用程序之外，绝大多数使用 GNOME 桌面的 Linux 发行版还整合了 KDE 库，允许你在 GNOME 桌面上运行\
  \ KDE 应用程序。\n\n### 其他 Linux 桌面\n\nLinux 的主要特征之一是选择，这一点在图形桌面世界比哪里都更明显。Linux 世界中有大量不同类型的图形桌面可用。如果你对\
  \ Linux 发行版的默认桌面不满意，通常不需要费太大精力将其更改其他！\n\n当 GNOME 桌面项目在版本 3 中彻底改变其界面时，许多偏好 GNOME\
  \ 2 版本外观和体验的 Linux 开发者创建了基于 GNOME 2 的衍生版本。其中两个变得非常流行：\n\n*   Cinnamon——由 Linux Mint\
  \ 在 2011 年开发，旨在延续 GNOME 2。它现在在包括 Ubuntu 在内的多个发行版中可用。\n*   MATE——由不喜欢转向 GNOME 3 的\
  \ Arch 用户在 2011 年开发。它包含了 GNOME 2 的一些功能，如任务栏。\n\n图 1-5 显示了 Linux Mint 中的 Cinnamon\
  \ 桌面。\n\n![截图显示了 Linux Mint 中的 Cinnamon 桌面。](img/9781284255805_CH01_FIGF05.jpg)\n\
  \n图 1-5 Linux Mint 中的 Cinnamon 桌面。\n\n由 Linux Mint 提供。\n\n这些桌面环境的缺点是它们需要大量的系统资源。在\
  \ Linux 早期，一个特点卖点是能够在新桌面无法运行的旧 PC 上运行。然而，随着 KDE Plasma 和 GNOME 3 桌面的普及，情况发生了变化，因为运行\
  \ GNOME 3 消耗的内存与最新桌面一样。\n\n如果你有一台旧电脑，不要灰馁。Linux 开发者们聚集在一起让 Linux 回归初心。他们创建了若干面向低内存的图形桌面应用程序，提供了良好的基础功能。\n\
  \n虽然这些图形桌面没有围绕它们设计的众多应用程序，但它们仍然运行许多支持文字处理、电子表格、数据库、绘图以及多媒体支持的图形应用程序。\n\n表 1-5 显示了可以在配置电脑和笔记本电脑上的一些小型\
  \ Linux 桌面环境。\n\n表 1-5 其他 Linux 图形桌面。\n\n| 桌面 | 描述 |\n| --- | --- |\n| Fluxbox |\
  \ 基础桌面，不包含面板，只有一个启动应用程序的弹出菜单 |\n| Xfce | 与 GNOME 2 桌面类似的桌面，但针对低内存减少了图形 |\n| JWM\
  \ | Joe 的窗口管理器，非常轻量级的桌面，适用于低内存和低磁盘空间环境 |\n| fvwm | 支持虚拟桌面和面板等高级桌面功能，但在低内存环境中运行 |\n\
  | fvwm95 | 源自 fvwm，但为了看起来像 Windows 95 桌面 |\n\n这些图形桌面环境没有 KDE Plasma 和 GNOME 3 桌面那么华丽，但它们提供了良好的基础图形化功能。图\
  \ 1-6 显示了 MX Linux 发行版中使用的 Xfce 桌面是什么样的。\n\n![截图显示了 MX Linux 发行版中使用的 X f c e 桌面。](img/9781284255805_CH01_FIGF06.jpg)\n\
  \n\n\n\n\n图 1-6 MX Linux 发行版中的 Xfce 桌面。\n\n感谢 Linux 基金会。\n\n描述\n\n如果你在使用旧款 PC，请尝试一个使用这些桌面之一的\
  \ Linux 发行版看看会发生什么。你可能会感到惊喜。\n\n### 命令行界面\n\n虽然拥有华丽的图形桌面界面很好，但它也有缺点。与显卡交互所需的额外处理能力会消耗本可以用于其他程序的关键\
  \ CPU 时间。在服务器环境中，这一点比任何地方都更重要。\n\n正因如此，许多 Linux 服务器默认不安装图形桌面，而是依赖基于文本的界面，称为命令行界面\
  \ (CLI)。`CLI` 为用户提供了一种通过简单的文本命令启动程序、管理文件系统上的文件以及管理在 Linux 系统上运行进程的方法。`CLI` 由一个名为\
  \ shell 的程序产生。`shell` 允许你输入文本命令，然后它解释这些命令并在内核中执行它们。\n\n`shell` 包含一组内部命令，你用它们来控制复制文件、移动文件、重命名文件、显示系统当前运行的程序以及停止系统上运行的程序等操作。除了内部命令外，`shell`\
  \ 还允许你在命令提示符处输入程序名称。`shell` 将程序名传递给内核以启动。\n\n你还可以将 `shell` 命令组合到文件中并作为程序执行。这些文件被称为\
  \ shell 脚本。任何你可以从命令行执行的命令都可以放在 `shell script` 中，并作为一组命令运行。这为创建常用命令或需要将多个命令组合在一起的进程的实用程序提供了极大的灵活性。\n\
  \nLinux 系统中有许多可用的 Linux `shell`。不同的 `shell` 具有不同的特性，有些更适合创建脚本，而另一些更适合管理进程。许多 Linux\
  \ 发行版使用的默认 `shell` 是 Bash。`Bash` `shell` 是由 GNU 项目开发的，用于替代标准的 Unix shell（称为 Bourne\
  \ shell，以其创建者命名）。`bash` `shell` 的名称是对该词的一种双关语，被称为“再次的 Bourne shell（Bourne again\
  \ shell）”。\n\n除了 `Bash` `shell` 之外，在 Linux 环境中还会遇到其他几种流行的 `shell`。表 1-6 列出了更流行的几种。\n\
  \n表 1-6 流行的 Linux shell\n\n| SHELL | 描述 |\n| --- | --- |\n| ash | 一种简单轻量级的 shell，运行在低内存环境中，但与\
  \ `bash` shell 完全兼容 |\n| ksh | 一种与 Bourne shell 兼容的编程 shell，但支持关联数组和浮点算术等高级编程功能\
  \ |\n| tcsh | 一种将 C 语言元素整合到 shell 脚本中的 shell |\n| zsh | 一种整合了 `bash`、`tcsh` 和 `korn`\
  \ 特性的高级 shell，提供了高级编程功能、共享历史文件和主题提示符 |\n\n大多数 Linux 发行版都包含多个一个 `shell`，尽管它们通常会选择其中一个作为默认。如果你的\
  \ Linux 发行版包含多个 `shell`，请尽管尝试不同的 `shell`，看看哪一个符合你的需求。\n\n### Linux 发行版：为什么这么多？\n\
  \n现在你已经了解了构建完整 Linux 系统所需的主要组件，你可能在好奇如何将它们全部组合在一起形成一个 Linux 系统。幸运的是，已经有人做到了这一点。\n\
  \n一个完整的 Linux 系统包被称为发行版。有许多不同的 Linux 发行版可以满足你可能遇到的任何计算需求。大多数发行版都是为特定的用户群体定制定制的，例如商务用户、多媒体爱好者、软件开发人员或典型的家庭用户。每个定制的发行版都包含了支持特殊功能所需的软件软件包，例如为多媒体爱好者提供的音视频编辑软件，或为软件开发人员提供的编译器和集成开发环境\
  \ (IDE)。\n\n不同的 Linux 发行版通常分为两类：\n\n* 核心 Linux 发行版\n* 专用发行版\n\n后续章节将描述这些不同类型的 Linux\
  \ 发行版，并展示每个类别中的示例。\n\n### 核心 Linux 发行版\n\n核心 Linux 发行版包含一个内核、一个或多个图形桌面环境以及几乎所有的\
  \ Linux 应用程序。它为完整的 Linux 安装提供了一站式服务。其他 Linux 发行版通常派自核心 Linux 发行版，使用可用应用程序的子集。表 1-7\
  \ 显示了一些流行的核心 Linux 发行版。\n\n表 1-7 核心 Linux 发行版\n\n| 发行版 | 描述 |\n| --- | --- |\n|\
  \ Slackware | 原始 Linux 发版之一，深受 Linux 极客喜爱 |\n| Red Hat Enterprise | 一种主要用于互联网服务器的商业级发行版\
  \ |\n| Gentoo | 一种为高级 Linux 用户设计的发行版，仅包含 Linux 源码 |\n| openSUSE | 适用于商务和家庭的不同发行版\
  \ |\n| Debian | 受 Linux 专家和商业 Linux 产品欢迎 |\n\n在 Linux 早期，发行版是以软盘形式发布的。你必须下载一组文件并将它们复制到磁盘中。制作一个完整的发行版通常需要\
  \ 20 或更多磁盘！不用说，这是一种痛苦的经历。\n\n如今，Linux 发行版以 ISO 镜像文件 的形式发布。`ISO 镜像文件` 是 DVD 完整映像的单个文件。你使用软件应用程序将\
  \ `ISO 镜像文件` 刻录到 DVD 或创建一个可启动的 U 盘。然后你只需从 DVD 或 U 盘启动工作站来安装 Linux。这使得安装 Linux 变得简单得多。\n\
  \n然而，初学者在安装核心 Linux 发行版时仍然经常会遇到问题。为了涵盖人们可能使用 Linux 的任何情况，单一发行版必须包含大量的应用程序。这涵盖了从高端互联网数据库服务器到常见游戏的所有内容。\n\
  \n虽然在发行版中提供许多选项对 Linux 极客来说是很好的，但对于 Linux Linux 用户来说这可能是一场噩梦。大多数发行版在安装过程中询问一系列问题，以确定默认加载哪些应用程序和功能。初学者通常觉得这些问题很困惑。结果，他们经常在计算机上加载了太多的程序，或者加载得不够，后来发现计算机无法实现他们想要的功能。\n\
  \n### 衍生 Linux 发行版\n\n了一个新的 Linux 发行版子群体，专门针对 Linux 初学者设计。这些衍生发行版通常基于核心发行版之一，但仅包含对特定用途有意义的子集。\n\
  \n\n\n\n\n除了提供专门的软件（例如为商业用户提供办公软件）之外，衍生的 Linux 发行版还尝试通过自动检测和配置常见的硬件设备来帮助初 Linux\
  \ 用户。这使得安装 Linux 的过程变得更加愉快。\n\n表 1-8 显示了一些可用的特化 Linux 发行版及其专长领域。\n\n### 表 1-8 衍生\
  \ Linux 发行版。\n\n| 发行版 | 描述 |\n| --- | --- |\n| Fedora | 作为红帽企业级 Linux（Red Hat Enterprise\
  \ Linux）测试场的免费发行版 |\n| Ubuntu | 适用于学校和家庭使用的免费发行版 |\n| MX Linux | 适用于家庭使用的免费发行版 |\n\
  | Mint | 适用于家庭娱乐的免费发行版 |\n| Puppy Linux | 一种免费、小型的发行版，可以在旧电脑上良好运行 |\n\n这只是特化 Linux\
  \ 发行版的一个小样本。互联网上实际上有成百上千种特化 Linux 发行版，并且不断不断涌出。无论你的专业领域是什么，你可能都能找到一个为你定制的 Linux\
  \ 发行版。\n\n许多特化 Linux 发行版基于 Debian Linux 发行版。它们使用与 Debian 相同的安装文件，但只封装了完整 Debian\
  \ 系统的一小部分。\n\n![一张抽象图像显示了烟雾形式的纹理。](img/Chapter-opener.jpg)\n\n© Picsfive/Shutterstock\n\
  \n## 第 2 章：Linux 与软件\n\n应用程序决定了操作系统的成败。**许多初衷良好的操作系统由于缺乏软件支持而消亡。幸运的是，Linux 受益于桌面端和服务器端各种开源应用程序。\n\
  \n本章将讨论 Linux 中最受欢迎的桌面和服务器应用程序。它将展示在默认情况下是如何安装应用程序的，以及如何向你的 Linux 系统中添加新应用程序。本章最后讨论了\
  \ Linux 发行版保持已安装软件更新以及针对安全漏洞进行补丁的不同方法。如今，这些功能与软件的初始安装同样重要。\n\n## 流行的 Linux 应用\n\n\
  得益于各种开源项目，Linux 中提供的应用程序可以涵盖你目前在 Microsoft Windows、Apple macOS 甚至 Unix 桌面和服务器上进行的几乎所有操作。然而，如此大量的应用程序缺点是，有时很难知道哪些程序最适合你的环境。本节将介绍\
  \ Linux 中一些更流行的桌面和服务器应用程序，让你对从何开始有一个了解。\n\n### 桌面应用程序\n\n如果你正在运行 Linux 图形桌面环境，你可能希望它能够运行类似于你在\
  \ Microsoft Windows 或 Apple macOS 桌面环境中看到的类似应用程序。这包括办公效率工具（文字处理、电子表格和演示文稿）、网页浏览、电子邮件和文件管理等功能。本节将介绍用于这些领域最常见的\
  \ Linux 应用程序。\n\n### 办公效率\n\n曾几何时 OpenOffice.org 软件包是 Linux 中最常见的办公套件。它提供了用于文字处理（`Writer`）、电子表格（`Calc`）、演示文稿（`Impress`）、绘图（`Draw`）、数学公式（`Math`）和桌面数据库接口（`Base`）的程序。然而，OpenOffice.org\
  \ 软件软件包 在几年前遇到了一些争议，当时 Oracle 公司在收购前所有者 Sun Microsystems 的过程中，购买了它的版权。\n\n虽然 Oracle\
  \ 保持了 OpenOffice.org 项目的开源状态，但一组开源开发者决定分支出一个替代软件包，称为 LibreOffice。LibreOffice 分支包含了与\
  \ OpenOffice.org 完全相同的软件包，并使用完全相同的源代码。然而，它是作为一个独立的分支包维护的，因此这两个软件包现在在各种功能上产生了一定分歧。\n\
  \n从那时，Oracle 将 OpenOffice.org 软件包捐赠给了 Apache 基金会（Apache foundation），这是一个大型开源组织。这安抚了大多数开源爱好者，但遗憾的是，损害已经造成。随着\
  \ LibreOffice 的流行，大多数流行的 Linux 桌面发行版都已迁移到它。图 2-1 显示了在 Ubuntu 桌面运行 `Writer` 应用程序。人们希望这两个软件包有一天能合并回一个，但在那之前，开源社区必须同时面对这两个版本。\n\
  \n![截图显示了 Ubuntu 中的 LibreOffice Writer 程序。](img/9781284255805_CH02_FIGF01.jpg)\n\
  \n图 2-1 Ubuntu 中的 LibreOffice Writer 程序。\n\n由 The Document Foundation 和 Mozilla\
  \ 感谢。\n\n描述\n\n除了 OpenOffice.org 和 LibreOffice 软件包外，GNOME 和 KDE 桌面项目也创建了自己的办公软件套件（称为\
  \ `Gnome Office` 和 `KOffice`）。这些软件包往往不如 OpenOffice.org 那么先进，但如果你在使用旧的、低功率的工作站，它们是非常棒的！\n\
  \n### 网页浏览\n\nFirefox 远是 Linux 平台上最常见的默认网络浏览器软件。Linux 版本提供了与 Windows 和 Mac 版本相同的界面界面和功能。图\
  \ 2-2 显示在 Ubuntu 上运行 Firefox。\n\n![截图显示了 Ubuntu 中的 Firefox 浏览器，显示了 ubuntu.com 的网页。顶部的标签代表企业级。](img/9781284255805_CH02_FIGF02.jpg)\n\
  \n图 2-2 Ubuntu 中的 Firefox 浏览器。\n\n感谢 Mozilla Corporation 和 Canonical Ltd.\n\n你可能会遇到使用\
  \ GNU IceCat 浏览器的发行版。它是 Firefox 浏览器的衍生版本，但没有 Firefox 标志。几年前，关于 Firefox 浏览器曾引发争议。虽然程序代码是开源的，但\
  \ Firefox 注册注册。开源开发者创建了 Iceweasel（梗？）浏览器，使用原始 Firefox 代码但使用新标志，以绕过商标限制。这个问题后来得到了解决，但\
  \ GNU 项目继续开发 Iceweasel，现在将其称为 IceCat，某些 Linux 发行版仍然喜欢使用 IceCat 版本而不是 Firefox。\n\n\
  除了 Firefox 和 IceCat，其他流行的 Linux 浏览器还有 Chromium（Google Chrome 浏览器的开源版本）和 Opera 的文本浏览器。由于\
  \ Lynx 是基于文本的浏览器，它不用于标准的图形桌面环境，但在脚本世界中流行，用于从网页上抓取数据而无需下载页面上的所有图形元素\n\n大多数使用 GNOME\
  \ 桌面环境的 Linux 发行版（如红帽）支持 Evolution 电子邮件客户端。同样，许多 KDE Plasma 桌面发行版使用 KMail 电子邮件客户端。这两个软件包都提供基本的电子邮件客户端功能，但并不花哨。\n\
  \n\n\n\n\n默认情况下，Ubuntu 发行版使用 Thunderbird 邮件客户端（如图 2-3 所示），它由与 Firefox 浏览器（Mozilla）相同的开发团队创建。Thunderbird\
  \ 提供了一个简单的设置程序，支持大多数常见的电子邮件服务器（包括 Gmail 和 Yahoo），并与 Linux 本地邮件系统建立接口。\n\n![截图显示了\
  \ Ubuntu 中的 Thunderbird 邮件客户端。](img/9781284255805_CH02_FIGF03.jpg)\n\n图 2-3 Ubuntu\
  \ 中的 Thunderbird 邮件客户端。\n\n由 Mozilla Corporation 和 Canonical Ltd. 提供。\n\n描述\n\n\
  你可以使用 Evolution 和 Thunderbird 管理多个邮箱，并创建本地邮件文件夹来对你的消息进行分类。\n\n### 文件管理\n\n文件管理软件允许你通过图形界面浏览存储的文件和文件夹，并创建、复制、移动和删除它们。你的\
  \ Linux 发行版使用的文件管理器通常取决于桌面管理器。GNOME 桌面使用 Files 文件管理器软件（以前称为 Nautilus），而 KDE Plasma\
  \ 桌面使用 Dolphin 文件管理器包。图 2-4 显示了 Ubuntu 中的 Files 文件管理器。\n\n![截图显示了 Ubuntu 中的 Files\
  \ 文件管理器。](img/9781284255805_CH02_FIGF04.jpg)\n\n图 2-4 Ubuntu 中的 Files 文件管理器。\n\n\
  由 Canonical Ltd. 提供。\n\n描述\n\nFiles 和 Dolphin 都允许你通过简单的点击在 Linux 系统的目录层级中导航，类似于\
  \ Windows 中的资源管理器以及 Mac 上的 Finder。复制或移动文件的操作在图形界面中就像文件夹之间拖放图标一样简单。\n\n### 服务器应用程序\n\
  \n如今 Linux 比较流行的用途之一是作为服务器平台。Linux 服务器系统比其 Windows 对应品更廉价、更容易管理，而且它们通常可以运行数月而无需重启。Linux\
  \ 平台支持丰富的服务器应用程序，这些程序可以无缝地融入任何服务器环境中。本节将介绍一些更流行的 Linux 服务器应用程序。\n\n#### Web 服务器\n\
  \nLinux 原始的 Web 服务器软件是 Apache 服务器。Apache 服务器软件最初是作为启动世界维网的原始 NCSA Web 服务器包的分支的。Apache\
  \ 这个名字是“a patchy server”（打过补丁的服务器）这一短语的双关语，因为对 NCSA 软件应用了大量的软件补丁。\n\n在 Linux 世界中日益流行的新型\
  \ Web 服务器包是 Nginx（读作“engine-X”）。Nginx 包的成名之处在于它可以实现多个 Web 服务器之间的负载均衡。这在互联网上的高流量网站中变得非常流行。\n\
  \nApache 和 Nginx Web 服务器是 Linux Web 服务器的“瑞士军刀”。它们能完成所有工作，甚至还有有余。有时，你可能有一个不需要如此复杂的\
  \ Web 服务器的应用程序，或者你可能在低功率系统上运行你的应用程序。这些包还有几个替代方案，它们只提供基本的 Web 服务器服务。Lighttpd 是你可能在较小的\
  \ Linux 设置中遇到的的一种流行的、不花哨的 Web 服务器。\n\n#### 数据库服务器\n\n互联网运行在数据之上。每个应用程序都需要某种数据管理系统。Linux\
  \ 服务器在数据库服务器方面有很多不同的选择。MySQL（及其克隆 MariaDB）和 PostgreSQL 软件包是关系型数据库服务器最流行的两个选择。\n\n\
  MySQL 包以速度著称，但它不支持商业数据库包中的某些更高级的数据库功能。另一方面，PostgreSQL 支持许多高级的数据库功能，但速度可能会慢一些。许多流行的在线商店为了速度放弃了高级功能，而使用\
  \ MySQL 数据库服务器。\n\n一种转向 NoSQL 数据库的新趋势已经开始。NoSQL 数据库通过放弃 SQL 关系型数据库的结构化表，转而将数据存储为无结构的\
  \ collections，从而可以处理大量数据。每个集合由文档组成，文档包含单个数据元素。NoSQL 的关键在于，与关系型数据库不同，在集合中的每个文档可以包含不同的数据！查询的结构设计为在集合中不同类型的文档之间查找单个数据元素。目前，MongoDB\
  \ 数据库是 Linux 中建立基于文档的 NoSQL 环境的首选工具。\n\n#### 邮件服务器\n\nsendmail 包是 Unix 环境原始邮件服务器软件。它延续到了\
  \ Linux 环境，但显得有些过时了。它以极其复杂的配置而闻名，使得即使设置一个基本的邮件服务器都很困难，而且开发者不断发现其中的安全漏洞并进行修复。\n\n\
  正如此，其他几个邮件服务器包也流行起来了。其中最流行的三个包是 Postfix、eXim](#9781284254884_Glossary.xhtml_GLOS-90)\
  \ 和 qMail。这三个包都使用更简单的配置文件，允许服务器管理员轻松微调服务器处理内部和邮件的方式。\n\n##### 网络文件共享\n\n大多数本地网络都需要某种类型的文件共享。Linux\
  \ 支持两种主要的共享应用程序。网络文件共享 (NFS) 软件是 Unix 系统间共享的原始 Unix 软件。该包对于 Linux 之间的共享效果非常好。\n\n\
  但由于 Windows 工作站的普及，许多网络需要与 Windows 服务器交互以共享文件和打印机。Samba 软件包可以在 Linux 服务器上模拟微软服务器环境，包括活动目录认证系统。这允许你将运行\
  \ Samba 的 Linux 服务器无缝集成到微软网络中，与微软服务器和客户端通信以提供打印和文件共享功能。\n\n## 探索包管理\n\n跟踪 Linux\
  \ 系统上安装了哪些软件可能有些挑战。为了方便起起，每个主要的 Linux 发行版都使用某种形式的包管理系统 来控制安装软件应用程序和库。包管理系统将每个应用程序打包成一个独立的包，可以作为一个整体进行安装、修改或卸载。包管理系统利用数据库来跟踪以下内容：\n\
  \n*   Linux 系统上安装了哪些软件包\n*   每个包安装了哪些文件\n*   安装的每个软件包是什么版本\n\n\n\n\n\n软件软件包存储在称为仓库（repositories）的服务器上，并通过在本地\
  \ Linux 系统上运行的包管理系统实用工具通过互联网访问。你可以使用包管理系统实用工具搜索新的软件包，甚至为系统中已安装的软件包搜索更新和由于安全补丁。\n\
  \n一个软件包通常具有依赖关系，即为了让软件正常运行而必须先安装的其他软件包。包管理系统实用工具会检测这些依赖关系，并在安装目标软件包之前提议安装任何额外需要的软件包。\n\
  \n包管理系统的缺点是并没有单一的标准实用工具。在不同的 Linux 发行版之间，包管理系统实用工具及其相关命令差异巨大。然而，两种主要的包管理系统工具在 Linux\
  \ 世界中变得流行并被广泛使用。它们是 `dpkg` 和 `rpm`。\n\n如 Ubuntu 和 Linux Mint 等基于 Debian 的发行版在其包管理系统实用工具的核心使用\
  \ `dpkg` 命令。该命令直接与 Linux 系统上的包管理系统交互，用于安装、管理和删除软件包。\n\n如 Fedora、CentOS、openSUSE\
  \ 和 Rocky 等基于 Red Hat 的发行版在其质包管理系统的核心使用 `rpm` 命令。与 `dpkg` 命令类似，`rpm` 命令可以列出已安装软件包、安装新软件包并删除现有软件。\n\
  \n注意，这两个命令是各自包管理系统的核心，而不是整个包管理系统本身。许多使用 `dpkg` 或 `rpm` 方法的 Linux 发行版在这些命令的基础上构建了额外的专用包管理系统实用工具，帮助让你的生活变得轻松。以下章节将介绍你在流行的\
  \ Linux 发行版中遇到的各种包管理系统实用工具命令。\n\n### 探索基于 Debian 的系统\n\n`dpkg` 命令是 Debian 系包管理系统工具的核心。它提供了在你的\
  \ Linux 系统上安装、更新和删除 `.deb` 软件包文件的选项。\n\n`dpkg` 命令假设你已经将 `.deb` 软件包文件下载到本地 Linux\
  \ 系统中。大多数情况下并非如此。通常你可能想从你 Linux 发行版的仓库中安装应用程序包。为了实现这一点，你需要使用 `apt` 工具套件：\n\n* `apt-cache`\n\
  * `apt-get`\n* `apt`\n\n`apt` 工具本质上是 `apt-cache` 和 `apt-get` 工具的前端。`apt` 的用处在于你不需要记住何时该使用哪种工具；它涵盖了你使用包管理时需要的所有操作。`apt`\
  \ 工具具有基本格式：\n\n![apt 左括号选项右括号 空 命令。](img/9781284255805_CH02_CUM01.jpg)\n\n命令定义了\
  \ `apt` 工具要执行的操作。如果有需要，你可以指定一个或多个选项来微调发生的情况。本节介绍了如何使用 `apt` 命令行工具来处理你 Linux 系统上的软件包。\n\
  \n#### 使用 apt 管理软件包\n\nLinux 系统管理员面临的一个常见任务是确定系统中已经安装了哪些软件包。`apt list` 命令显示仓库中所有可用软件包，但通过添加\
  \ `--installed` 选项，你可以将输出限制为仅包含已安装在系统中的软件包：\n\n![apt list installed 选项显示了系统中已安装的软件包。](img/9781284255805_CH02_CUM02.jpg)\n\
  \n描述\n\n正如你猜到的，已安装的软件包列表将非常长，我缩短了输出，仅为了展示输出的样本。软件包名称旁边是关于软件包的一些额外信息，例如版本名称以及软件包是否已安装以及是否标记为自动升级。\n\
  \n如果你已经了解系统上的软件包，并想快速显示特定软件包的详细信息，请使用 `show` 命令：\n\n![apt show 软件包下划线名](img/9781284255805_CH02_CUM03.jpg)\n\
  \n这里是显示 `zsh` 软件包详情的示例：\n\n![输出显示了软件包 z s h 的详情。(images/9781284255805_CH02_CUM04.jpg)![输出显示了软件包\
  \ z s h 的详情。(images/9781284255805_CH02_CUM05.jpg)描述你无法通过 `apt` 获取的一个细节是特定软件软件包的所有文件列表。要获取此列表，你需要使用\
  \ `dpkg` 工具本身：![d p k g 连字符 L 软件包下划线名](img/9781284255805_CH02_CUM06.jpg)\n\n这里是使用\
  \ `dpkg` 列出作为 `acl` 软件包一部分安装的所有文件的示例：\n\n![输出显示了作为 acl 软件包一部分安装的所有文件列表。(images/9781284255505_CH02_CUM07.jpg)![输出显示了作为\
  \ acl 软件包一部分安装的所有文件列表。(images/9781284255805_CH02_CUM08.jpg)描述你也可以反向操作——查找文件属于哪个软件包：![dpkg\
  \ 连字符 search 绝对路径](img/9781284255805_CH02_CUM09.jpg)\n\n注意，你需要使用绝对路径才能使其工作：\n\n\
  ![第 1 行：美元符号 dp k g 连字符 search / get c l。第 2 行：a c l 空格 / get c l。第 3 行：美元符号](img/9781284255805_CH02_CUM10.jpg)\n\
  \n输出显示 `getfacl` 是 `acl` 的一部分安装的。\n\n#### 使用 apt 安装软件包\n\n现在你已经更熟悉如何列出软件包信息，本节将引导你安装软件包。首先，你需要确定软件包名称。如何查找特定软件包？使用\
  \ `apt` 的 `search` 命令：\n\n![apt search 软件包下划线名](img/9781284255805_CH02_CUM11.jpg)\n\
  \n`search` 命令的巧妙之处在于你不需要为 `package_name` 插入通配符；通配符是隐含的。默认情况下，搜索命令显示名称或描述中包含搜索词软件包，这有时具有误导性。如果你想将输出限制为仅名称，请包含\
  \ `--names-only` 选项：\n\n![显示仅名称输出。(images/9781284255805_CH02_CUM12.jpg)![显示仅名称输出。(images/9781284255805_CH02_CUM13.jpg)一旦找到了想要安装的软件包，使用\
  \ `apt` 安装它只需如下：![apt install 软件包下划线名](img/9781284255805_CH02_CUM14.jpg)\n\n输出将显示关于该软件包的一些基本信息，并询问你是否继续安装：\n\
  \n![输出显示关于软件包的基本信息](img/9781284255805_CH02_CUM15.jpg)\n\n![输出显示关于软件包的基本信息](img/9781284255805_CH02_CUM16.jpg)\n\
  \n要检查安装是否正确处理，只需再次使用带有 `--installed` 选项的列表命令。你应该看到该软件包，表示它已安装。\n\n\n\n\n注意，在安装请求的软件包时，`apt`\
  \ 要求也安装其他软件包。这是因为 `apt` 会自动为我们解析任何必要的软件包依赖关系，并安装了所需的额外库和软件包。这是许多包管理系统中包含的一项非常棒的功能。\n\
  \n### 使用 apt 升级软件\n\n虽然 `apt` 帮助你免受安装软件时出现的问题，但要协调具有依赖关系的多个软件包更新可能会很复杂。要安全地升级系统中仓库中任何新版本的所有软件包，请使用\
  \ `upgrade` 命令：\n\n![apt 空间升级。](img/9781284255805_CH02_CUM17.jpg)\n\n注意，此命令没有接受任何软件包名称作为参数。这是因为\
  \ `upgrade` 选项将所有已安装的软件包升级到仓库中提供的最新版本，这对于系统的稳定性更安全。\n\n这是运行 `apt upgrade` 命令的示例输出：\n\
  \n![显示了 apt upgrade 命令的输出。](img/9781284255805_CH02_CUM18.jpg)\n\n![显示了 apt upgrade\
  \ 命令的输出。](img/9781284255805_CH02_CUM19.jpg)\n\n描述\n\n在输出中，注意 `apt` 不仅列出了将升级的软件包，还列出了由于升级而需要安装的任何新软件包。\n\
  \n`upgrade` 命令不会在升级过程中删除任何软件包。如果需要在升级过程中删除某个软件包，请使用以下命令：\n\n![apt 空间 全连字符升级。](img/9781284255805_CH02_CUM20.jpg)\n\
  \n虽然这看起来可能很奇怪，但有时为了在发行版升级之间保持同步，需要移除某些软件包。\n\n### 使用 apt 卸载软件\n\n使用 `apt` 移除软件包与安装和升级它们一样简单。你唯一需要做的真实选择是在之后是否保留软件的数据和配置文件。\n\
  \n要移除软件包但不保留数据和配置文件，请使用 `apt` 的 `remove` 命令。要移除软件包以及相关数据和配置文件，请使用 `purge` 选项：\n\n\
  ![输出显示了 purge 选项的用法。](img/9781284255805_CH02_CUM21.jpg)\n\n描述\n\n但注意，作为 purge 的输出中，`apt`\
  \ 警告我们作为依赖项安装的 `zsh-common` 软件包没有自动删除，以防它可能某些其他软件包需要。如果你确定该依赖包没有被其他任何需要，可以使用 `autoremove`\
  \ 命令将其移除：\n\n![输出显示了 autoremove 命令的用法。](img/9781284255805_CH02_CUM22.jpg)\n\n![输出显示了\
  \ autoremove 命令的用法。](img/9781284255805_CH02_CUM23.jpg)\n\n描述\n\n`autoremove` 命令将检查所有标记为依赖项且不再需要的软件包。\n\
  \n前端界面 `apt` 为处理基于 Debian 的 `dpkg` 工具提供了智能的命令行选项。现在是时候查看基于 Red Hat 的发行版的 `rpm` 工具及其各种前端界面了。\n\
  \n### 基于 Red Hat 的系统\n\n与基于 Debian 的发行版一样，基于 Red Hat 的系统有几种不同的前端工具可用。以下是常见的：\n\n\
  * yum: 用于 Red Hat、CentOS 和 Rocky\n\n* zypper: 用于 openSUSE\n\n* dnf: `yum` 的更新版本，带有一些额外功能\n\
  \n这些前端都基于 `rpm` 命令行工具。下一节将讨论如何使用这些各种基于 `rpm` 的工具管理软件包。重点将放在 `dnf`，但其他软件包使用类似的命令和格式。\n\
  \n### 列出已安装的软件包\n\n要确定你的系统上当前安装了什么，在 shell 提示符处输入以下命令：\n\n![dnf 空间 list installed。](img/9781284255805_CH02_CUM24.jpg)\n\
  \n信息可能会在显示上飞闪而过，因此最好将已安装软件列表重定向到文件中。然后可以使用 `more` 或 `less` 命令（或 GUI 编辑器）以受控的方式查看列表。\n\
  \n![dnf 空间 list installed 空间 greater 空间 installed_software。](img/9781284255805_CH02_CUM25.jpg)\n\
  \n要查找特定软件包的详细信息，`dnf` 真正大放异彩。它不仅会给你一个非常详细的软件包描述。\n\n```bash\ndnf list installed\
  \ > installed_software.txt\n```\n\n\n\n虽然包管理系统确实让 Linux 世界的软件安装变得简单得多，但它们也有其缺缺点。首先，正如你在本章中看到的，存在多个竞争性的包管理系统。因此，应用程序开发者为了分发一个可以在所有\
  \ Linux 发行版中安装的应用程序，必须创建多个版本进行分发。\n\n但情况比这更为复杂。每个应用程序都依赖于某些类型的库函数才能运行。当开发者创建 Linux\
  \ 应用程序时，他们必须考虑大多数 Linux 发行版提供了哪些库文件，不仅如此，还包括库文件的版本。虽然包管理系统可以跟踪依赖关系，但正如你所能到的，对于试图让应用程序在大多数\
  \ Linux 发行版中正常运行的软件开发者来说，这可能会迅速变成一场噩梦。\n\n随着云计算的出现，应用程序打包出现了一种新范式——应用容器。应用容器创建了一个环境，将运行所需的所有文件都打包在一起，包括运行时库文件。开发者随后可以将应用容器作为一个软件包发布，并保证它在任何\
  \ Linux 系统上运行良好。\n\n尽管应用容器仍然相对较新，但已经开始出现几种竞争性的应用容器标准。接下来的章节将介绍其中两个流行的标准——snap 和\
  \ flatpak。\n\n### 使用 Snap 容器\n\nUbuntu Linux 发行版的创建者 Canonical 开发了一种名为 snap 的应用容器格式。snap\
  \ 打包系统将应用程序所需的所有文件打包成单独的 snap 分发文件。`snapd`](9781284254884_Glossary.xhtml_GLOS-313)\
  \ 应用程序在后台运行，你使用 `snap` 命令行工具查询 snap 数据库以显示已安装的 snap 包，以及安装、升级和删除 snap 包。\n\n要检查\
  \ snap 是否在你的系统上运行，请使用 `snap version` 命令：\n\n![输出输出显示了 snap version 命令的用法。](img/9781284255805_CH02_CUM37.jpg)\n\
  \n描述\n\n如果 snap 正在运行，你可以通过 `snap list` 命令查看当前安装的 snap 应用程序列表：\n\n![输出显示了使用 snap\
  \ list 命令列出的当前安装的 snap 应用程序列表。](img/9781284255805_CH02_CUM38.jpg)\n\n描述\n\n要在 snap\
  \ 仓库中搜索新应用程序，请使用 `snap find` 命令：\n\n![输出显示了 snap find 命令的用法用于在 snap 仓库中搜索新应用程序。](img/9781284255805_CH02_CUM39.jpg)\n\
  \n![输出显示了 snap find 命令的用法用于在 snap 仓库中搜索新应用程序。](img/9781284255805_CH02_CUM40.jpg)\n\
  \n描述\n\n要查看有关 snap 的更多信息，请使用 `snap info` 命令：\n\n![输出显示了 snap info 命令的用法用于查看有关 snap\
  \ 的更多信息。](img/9781284255805_CH02_CUM41.jpg)\n\n描述\n\n要安装一个新的 snap 应用程序，请使用 `snap\
  \ install` 命令：\n\n![输出显示了 snap install 命令的用法用于安装新的 snap 应用程序。](img/9781284255805_CH02_CUM42.jpg)\n\
  \n描述\n\n注意，你必须拥有 root 用户权限才能安装 snaps。在 Ubuntu 中，这意味着要使用 `sudo` 命令。\n\n如果你需要删除 snap，只需使用\
  \ `snap remove` 命令即可：\n\n```\n![第 1 行：美元 sudo snap remove solitaire. 第 2 行：solitaire\
  \ 已删除. 第 3 行：美元。](img/9781284255805_CH02_CUM43.jpg)\n```\n\n当 snap 被删除时，你会看到一些关于删除进度的消息。与其删除\
  \ snap，你也可以只需禁用它而不删除。只需使用 `snap disable` 命令即可。要重新启用 snap，请使用 `snap enable` 命令。\n\
  \n### 使用 Flatpak 容器\n\nflatpak` 应用容器格式作为一个独立的开源项目创建的，与任何特定的 Linux 发行版没有直接联系。尽管如此，战斗线已经形成，基于\
  \ Red Hat 的发行版倾向于使用 flatpak 而不是 Canonical 的 snap 容器格式。\n\n如果你在使用支持 flatpak 的 Linux\
  \ 发行版，可以使用 `flatpak list` 命令列出已安装的应用容器：\n\n![输出显示了使用 flatpak list 列出的已安装应用容器列表。](img/9781284255805_CH02_CUM44)\n\
  \n要在 flatpak 仓库中搜索应用程序，请使用 `flatpak search` 命令：\n\n![输出显示了 flatpak search 命令在 flatpak\
  \ 仓库中搜索应用程序。](img/9781284255805_CH02_CUM45.jpg)\n\n要安装应用程序，请使用 `flatpak install`\
  \ 命令：\n\n![输出显示了 flatpak install 命令的用法用于安装应用程序。](img/9781284255805_CH02_CUM46.jpg)\n\
  \n描述\n\n要检查安装是否成功，你可以再次使用 `flatpak list` 命令：\n\n![输出显示了使用 flatpak list 检查是否成功。](img/9781284255805_CH02_CUM47.jpg)\n\
  \n描述\n\n最后，要移除应用容器，请使用 `flatpak uninstall` 命令：\n\n![输出显示了 flatpak uninstall 命令的用法用于移除应用容器。](img/9781284255805_CH02_CUM48.jpg)\n\
  \n描述\n\n虽然使用应用容器与使用包管理系统相似，但底层原理完全不同。然而，结果是在你的系统中安装了一个可以轻松维护和升级的应用程序。\n\n## 从源码安装\n\
  \n在包管理系统和应用容器之前，开源应用程序开发者必须以源码的形式分发软件，并允许用户在自己的系统中进行编译。源码包通常以 tarball 的形式发布。tarball\
  \ 包使用 `tar`](9781284254884_Glossary.xhtml_GLOS-332) 命令将多个文件归档到一个文件中（无论是否压缩）。\n\n\
  如果你经常开发或处理开源软件源码，你很有可能会遇到以 tarball 封装的软件。本节将引导你如何解压并安装 tarball 软件包。\n\n在本示例中，将使用\
  \ `sysstat` 软件包。`sysstat` 工具是一个非常实用的软件包，提供了多种系统监控工具。\n\n首先，你需要将 `sysstat` tarball\
  \ 下载到你的 Linux 系统。虽然你可以在不同的 Linux 网站找到 `sysstat` 软件包，但最好是直接去源头。在这种情况下，地址是 `sebastien.godard.pagesperso-orange.fr/`。\n\
  \n点击下载链接后，你将进入包含下载文件的页面。本文当时的当前版本为 `12.5.4`，发行文件名为 `sysstat-12.5.4.tar.xz`。\n\n\n\
  \n点击链接将文件下载到你的 Linux 系统。一旦下载完成，你就可以对其解压。\n\n要解压软件 tar 包，请使用标准的 `tar` 命令。由于文件是使用\
  \ `xz` 程序压缩的，你必须包含 `-J` 选项，并配合 `-x` 选项来提取 tar 包、使用 `-v` 选项开启详细模式，以及使用 `-f` 选项来指定文件名：\n\
  \n![输出显示了使用标准 tar 命令解压软件 tar 包用法。](img/9781284255805_CH02_CUM50.jpg)\n\n描述\n\n现在\
  \ tar 包已经解压，且文件已整齐地存放在名为 `sysstat-12.5.4` 的目录中，你可以进入该目录并继续操作。\n\n首先，使用 `cd` 命令进入新目录，然后列出目录内容：\n\
  \n![输出使用 c d 命令进入新目录并列出目录内容。](img/9781284255805_CH02_CUM51.jpg)\n\n![无](img/9781284255805_CH02_CUM52.jpg)\n\
  \n描述\n\n在列出的目录文件中，你通常会看到一个 `README` 或 `INSTALL` 文件。阅读这个文件非常重要。文件中将包含你完成软件安装所需的实际指令。\n\
  \n遵循 `INSTALL` 文件包含的建议，下一步是为你的系统运行 `configure` 工具。该工具会检查你的 Linux 系统，以确保它不仅具有适当的库依赖，还具有编译源代码所需的正确编译器：\n\
  \n![输出显示了为系统运行 configure 工具的结果。](img/9781284255805_CH02_CUM53.jpg)\n\n描述\n\n由于 `configure`\
  \ 工具位于本地目录中，你必须使用 `./` 相对路径符号来运行它。如果出现任何问题，`configure` 步骤将显示解释缺少什么内容的错误消息。\n\n下一阶段是使用\
  \ `make` 命令构建各种二进制文件。`make` 命令会编译源代码，然后通过链接器创建该包的最终可执行文件。与 `configure` 命令一样，`make`\
  \ 命令在编译和链接所有源文件的步骤过程中会产生大量输出：\n\n![输出显示了 make 命令的结果。](img/9781284255805_CH02_CUM54.jpg)\n\
  \n描述\n\n当 `make` 完成完成后你就在目录中拥有实际的 `sysstat` 软件程序了！然而，从该目录运行它可能有些不便。相反，你可能希望将其安装在\
  \ Linux 系统的常用位置。要做到这一点，你需要使用 `sudo` 命令获取 root 权限，然后使用 `make` 命令的 `install` 选项：\n\
  \n![输出显示了使用 sudo 命令后使用 make 命令的 install 选项的结果。](img/9781284255805_CH02_CUM55.jpg)\n\
  \n![输出显示了使用 sudo 命令后使用 make 命令的 install 选项的结果。](img/9781284255805_CH02_CUM56.jpg)\n\
  \n描述\n\n现在 `sysstat` 软件包已安装在系统上！虽然不像通过包管理系统安装软件包那样简单，但使用 tar 包安装软件并没有那么困难。\n\n![一张抽象图像显示了烟雾形式的纹理。](img/Chapter-opener.jpg)\n\
  \n© Picsfive/Shutterstock\n\n# 第 3 章：Linux 与硬件\n\n操作系统 `kernel` 的工作之一是与连接到计算机的硬件建立接口。如今，你可以将许多不同类型的硬件连接到计算机，从外部硬盘到手机应都有。尝试让\
  \ Linux 在所有这些设备上运行可能会有些棘手。\n\n本章探索了让你的 Linux 系统与不同类型的硬件设备接口的可用工具。章节首先探讨了 Linux 内核如何处理与硬件设备接口所需的软件。它展示了模块的概念在处理最新的可拆卸设备时如何变得无价。接下，本章检查了如何处理各种类型的硬件设置，例如中断和\
  \ I/O 端口，这些设置在桌面和服务器环境中都被用于识别硬件。之后是一个关于 Linux 如何与热插拔设备协作的章节，特别是那些使用流行的 USB 接口的设备。随着\
  \ USB 接口的普及，你的 Linux 系统能够与它们工作，并且你知道在系统的何处找到这些工具，是至关重要的。\n\n## 设备驱动模块\n\nLinux 操作系统的主要工作之一是为应用程序与硬件的交互提供标准接口。由于有许多不同类型的硬件设备，让每个应用程序都包含与它们交互的软件是不可能的。\n\
  \n相反，Linux 操作系统为所有面临的硬件类型提供了一个通用接口。应用程序只需要知道如何与系统交互，剩下的交给 Linux。这使得向打印机打印或向 DVD\
  \ 驱动器写入数据变得简单得多。\n\n与 Windows 世界类似，Linux 内核使用所谓的设备驱动 与硬件设备接口。设备驱动是用于与特定设备交互的小型软件。连接到\
  \ Linux 系统的每个设备都必须有一个设备驱动。幸运的是，随着 Linux 的日益普及，大多数硬件制造商都为他们的设备提供了设备驱动，以便 Linux 用户可以使用。对于制造商未能制作设备驱动的特定设备，也有一些开源项目创建设备驱动。一旦你获取了要在\
  \ Linux 系统上安装的硬件所需的设备驱动，有两种方法将其引入内核：\n\n- 将其编译进内核\n- 将模块插入内核\n\n编译设备驱动 是你直接编译到 Linux\
  \ 内核的设备驱动软件。这种方法需要设备驱动的源代码以及内核的源代码。当你重新编译内核程序时，必须指定要包含内核的额外设备驱动。\n\n将设备驱动编译到内核中的缺点是，每当你需要向\
  \ Linux 系统添加新硬件设备时，都必须重新编译整个内核软件。久了会了，而且这还是向运行的内核引入漏洞的好方法！\n\n作为解决方案，Linux 开发者创建了\
  \ Linux 内核模块](9781284254884_Alt.xhtml-206)。内核模块可以随时插入到运行的内核中，而不影响系统操作。同样，你也可以随时从内核中删除模块，而不影响内核的其他操作。这提供了灵活性，让你只需安装系统与你所使用的硬件交互所需的设备驱动，而无需忍受为每个设备重新编译内核的丑陋。\n\
  \n设备驱动模块现在几乎是处理硬件设备的默认方式。Linux 系统提供了几种不同的工具用于从命令行处理设备驱动模块。接下来的章节将介绍你用于管理 Linux 系统中硬件模块的命令。\n\
  \n### 列出已安装的模块\n\n\n\n\n在你深入使用 Linux 系统之前，你可能需要确定它默认支持哪些设备。大多数 Linux 发行版都为大多数常见的硬件预装了一套设备驱动模块。\n\
  \n你可以通过使用 `lsmod` 命令行来查看 Linux 内核中已经加载了哪些设备模块：\n\n![输出显示了使用 l s mod 命令行在 Linux 内核中已加载的设备模块。](img/9781284255805_CH03_CUM01.jpg)\n\
  \n![输出显示了使用 l s mod 命令行在 Linux 内核中已加载的设备模块。](img/9781284255805_CH03_CUM02.jpg)\n\
  \n![输出显示了使用 l s mod 命令行在 Linux 内核中已加载的设备模块。](img/9781284255805_CH03_CUM03.jpg)\n\
  \n描述\n\n`lsmod` 命令的输出包含三列。`Module` 列显示模块名称。`Used by` 列显示使用该模块的其他模块或进程的数量以及它们的名称。这可以帮助你确定模块依赖，以防在你不知道哪些其他模块或进程依赖它的情况下尝试删除某个模块。\n\
  \n了解你的 Linux 发行版预装了哪些设备模块有助于排查硬件问题，并让你大致知道为特定硬件需要查找哪些驱动程序。\n\n## 安装新模块\n\n一旦你为硬件获取了设备驱动模块文件，可以使用以下两种常用命令之一将其安装到\
  \ Linux 系统内核中：\n\n*   `insmod`\n*   `modprobe`\n\n虽然这两个命令都可以插入模块，但它们的工作方式略有不同。接下来的章节将描述使用每个命令时需要了解的知识。\n\
  \n### 使用 insmod\n\n`insmod` 命令将单个设备模块文件插入内核。你必须将设备模块文件复制到你的 Linux 系统中中才能使用此命令。大多数\
  \ Linux 发行版使用 `/lib/modules` 目录结构来存储模块文件。如果你查看 Linux 系统上的该文件夹，你会看到一个文件夹树形结构，它将每个内核版本的设备驱动程序以及不同类型的硬件隔离开。\n\
  \n例如，在我的 Ubuntu Linux 服务器系统上，我有用于蓝牙硬件驱动的以下文件夹：\n\n![Slash lib slash modules slash\
  \ 5 dot 4 dot 0 hyphen 80 generic slash kernel slash drivers slash bluetooth.](img/9781284255805_CH03_CUM04.jpg)\n\
  \n该文件夹用于我系统中当前安装的 Linux 内核——5.4.0-80。该文件夹内有许多针对不同类型蓝牙系统的设备驱动模块文件：\n\n![输出显示了各种类型蓝牙系统的不同设备驱动模块文件。](img/9781284255805_CH03_CUM05.jpg)\n\
  \n描述\n\n每个 `.ko` 文件都是独立的设备驱动模块文件，你可以将其安装到 5.4.0-80 内核中。要安装模块，只需在 `insmod` 命令行上指定文件名。某些模块还需要参数，你也必须在命令行上指定这些参数：\n\
  \n![代码显示在 ins mod 命令行上指定文件名。](img/9781284255805_CH03_CUM06.jpg)\n\n![代码显示在 ins mod\
  \ 命令行上指定文件名。](img/9781284255805_CH03_CUM07.jpg)\n\n描述\n\n安装模块你必须拥有系统的 root 用户权限，对于大多数\
  \ Linux 系统来说，这是通过使用 `sudo` 命令完成的。安装模块后，你可以使用 `lsmod` 程序检查其是否存在。\n\n### 使用 modprobe\n\
  \n使用 `insmod` 程序的缺点是，你可能会遇到依赖其他模块的模块，如果这些其他模块尚未安装，`insmod` 程序将失败。为了让过程更简单，`modprobe`\
  \ 命令可以帮你解决模块依赖关系。\n\n`modprobe` 命令的另一个优点是它可以理解模块名称，并会在模块库中搜索提供该模块名称驱动程序的模块文件。\n\n\
  由于这种多功能性，`modprobe` 命令有许多可用选项。`表 3-1` 显示了你可以使用的命令行选项。\n\n表 3-1 modprobe 命令选项\n\n\
  | 选项 | 说明 |\n| --- | --- |\n| -a | 插入命令行列出的所有模块 |\n| -b | 应用配置文件中指定的黑名单命令 |\n| -C\
  \ | 指定一个除默认之外的配置文件 |\n| -c | 显示当前使用的配置 |\n| -d | 指定用于安装模块的根目录。默认是 `/` |\n| -f |\
  \ 强制安装模块 |\n| -i | 忽略配置文件指定的安装 |\n| -n | 对模块安装进行干运行（dry run） |\n| -q | 静默模式——如果安装失败时不显示任何错误消息\
  \ |\n| -r | 移除模块 |\n| -s | 将任何错误消息发送到 syslog |\n| -V | 显示程序版本并退出 |\n| -v | 在处理模块时提供额外信息（详细模式）\
  \ |\n\n如你所见，`modprobe` 命令本身就是一个功能齐全的工具。最方便的功能是它可以根据模块名称处理模块，而无需列出完整的模块文件名：\n\n![代码显示\
  \ mod probe 的用法。](img/9781284255805_CH03_CUM08.jpg)\n\n描述\n\n注意，通过添加详细选项 `-v`，输出会显示由\
  \ `modprobe` 命令自动生成的 `insmod` 命令。`insmod` 命令显示了安装模块的具体文件。\n\n### 移除模块\n\n通常即使设备不存在，在系统中安装模块也没有害。但某些\
  \ Linux 管理员希望内核尽可能轻量，因此 Linux 开发者创建了移除模块的方法——`rmmod` 命令。\n\n然而，我们的朋友 `modprobe`\
  \ 命令也可以移除模块，所以不需要记忆另一个命令。相反，只需配合 `modprobe` 命令使用 `-r` 选项：\n\n```\nsudo modprobe\
  \ -r v\n```\n\n![第 1 行：美元 mod probe - r b s b。第 2 行：r mod b s b。第 3 行：美元。](img/9781284255805_CH03_CUM09.jpg)\n\
  \n`modprobe -r` 命令会自动调用 `rmmod` 命令，按名称移除模块。你可以使用 `lsmod` 命令验证模块是否已移除。\n\n## 与 Linux\
  \ 设备通信\n\n安装模块后，内核必须知道如何与设备通信。Linux 支持多种类型的硬件接口和设备通信方法。本节将讨论 Linux 如何与不同设备交互。\n\n\
  ### 设备接口\n\n连接到 Linux 系统的每个设备都使用某种标准协议与系统硬件通信。内核模块必须知道如何使用这些协议向硬件设备发送和接收数据。目前有三种流行的标准用于连接设备。\n\
  \n#### PCI 板\n\n`外围部件连接 (PCI) 标准开发于 1993 年，作为将硬件板连接到 PC 主板的方法。该标准更新过几次以适应更快的接口速度并增加主板上的数据线宽度。PCI\
  \ Express (PCIe) 标准目前用于大多数服务器和桌面工作站，为外部硬件卡提供通用接口。\n\n\n\n\n\n- **内部硬盘**：使用旧的串行高级技术接口\
  \ (`SATA`）和小型计算机系统接口 (`SCSI`）连接器的硬盘通常使用 `PCI` 板卡连接到工作站或服务器。Linux 内核会自动识别连接到 `PCI`\
  \ 板板的 `SATA` 和 `SCSI` 硬盘。此外，Linux 内核还能自动识别较新的非易失性内存 (`NvMe`）控制器，这些控制器用于连接固态硬盘 (`SSD`）存储设备。\n\
  - **外部硬盘**：使用光纤通道（Fiber Channel）标准的网络硬盘为服务器环境提供了高速共享驱动器环境。要在光纤网络上通信，服务器通常使用支持主机总线适配器（HBA）标准的\
  \ `PCI` 板卡。\n- **网络接口卡**：有线网卡允许你使用常用的 RJ-45 线缆标准将工作站或服务器连接到局域网。这类连接主要出现在需要高网络吞吐量的高速网络环境中。\n\
  - **无线网卡**：有支持 IEEE `802.11` 标准的局域网无线连接的 `PCI` 板卡。虽然这些在服务器环境中并不常见，但在工作站环境中非常流行。\n\
  - **蓝牙设备**：蓝牙技术允许在点对点网络设置中与其他蓝牙设备进行短距离无线通信。这些在工作站环境中最为常见。\n- **视频加速器**：需要高级图形的应用程序通常使用视频加速卡，该卡卡将视频处理需求从\
  \ `CPU` 卸载以提供更快的图形渲染。虽然这些卡在游戏环境中很流行，但你也会发现视频加速卡用于编辑和处理电影的视频处理应用程序。\n- **声卡**：同样，需要高质量音频的应用程序通常使用专用声卡来提供先进的音频处理和播放，例如处理杜比尔环绕声以增强电影的音频质量。\n\
  \n### USB 接口\n通用串行总线 (USB)接口因其易于使用以及对高速数据通信日益增加的支持而变得越来越流行。由于 `USB` 接口使用串行通信，它与主板连接的连接器较少，允许使用更小的接口插头。\n\
  \n`USB` 标准多年年来不断演变。原始版本 (`1.0`）仅支持高达 `12Mbps` 的数据传输速度。`2.0` 标准将数据传输速度提高到 `480Mbps`。目前的\
  \ `USB` 标准 `4.0` 允许高达 `40Gbps` 的数据传输速度，使其与外部存储设备的高速连接非常有用。\n\n有无数设备可以通过 `USB` 接口连接到系统。你可以找到硬盘、打印机、数字相机和摄像机、键盘、鼠标和网卡，它们都有具有使用\
  \ `USB` 接口连接的版本。\n\n### GPIO 接口\n通用输入/输出 (`GPIO`) 接口在设计用于控制外部设备进行自动化项目的小型实用 Linux\
  \ 系统中变得流行。这包括受欢迎的爱好者 Linux 系统，如树莓派（Raspberry Pi）和 BeagleBone 套件。\n\n`GPIO` 接口提供了多个数字输入和输出线，你可以单独对它们进行控制，精细到单比特位。`GPIO`\
  \ 功能通常由专用集成电路 (`IC`) 芯片处理，该芯片映射到 Linux 系统的内存中。\n\n`GPIO` 接口是支持与继电器、灯光、传感器和电机等外部设备通信的理想选择。应用程序可以读取单个\
  \ `GPIO` 线来确定开关状态、开启或关闭继电器，或者读取从任何类型的模拟数字传感器（如温度或压力传感器）返回的数字值。\n\n通过 `GPIO` 接口，你利用\
  \ Linux 控制物体和环境拥有丰富的可能性。你可以编写程序来控制房间的温度、感知门窗的开启或关闭、感知房间内的运动，甚至控制机器人的运行。\n\n### /dev\
  \ 目录\n在 Linux 内核能够与接口上的设备通信后，它必须能够与设备之间传输数据。对于许多设备，这是通过设备文件完成的。设备文件是 Linux 内核在特殊的\
  \ `/dev` 目录中创建的，用于与硬件设备接口的文件。\n\n要从特定设备检索数据，程序只需要读取与该设备关联的 Linux 设备文件。Linux 操作系统处理了与实际硬件交互的所有繁杂工作。同样，要向设备发送数据，程序只需要向\
  \ Linux 设备文件写入。\n\n当你向系统添加如 `USB` 驱动器、网卡或硬盘等硬件设备时，Linux 会在 `/dev` 目录中创建一个代表该硬件设备的文件。应用程序随后可以直接与该文件交互，在设备上存储和检索数据。这比要求每个应用程序都知道如何直接与设备交互要得多。\n\
  \nLinux 中有两种类型的设备文件，基于 Linux 向设备传输数据的方式划分：\n\n- 字符设备文件： 一次传输一个字符数据。这种方法通常用于串口终端和\
  \ `USB` 设备等串行设备。\n- 块设备文件： 传输大块数据。这种方法通常用于硬盘和网卡等高速数据传输设备。\n\n除了设备文件，Linux 还提供了一种名为设备映射器（device\
  \ mapper）的系统。设备映射功能由 Linux 内核执行。它将物理块设备映射到虚拟块设备。这些虚拟块设备允许系统拦截写入或读取物理设备的数据并执行某些操作。映射设备用于逻辑卷管理器\
  \ (`LVM`) 创建逻辑驱动，用于 Linux 统一密钥设置 (`LUKS`) 对硬盘上的数据进行加密。\n\n### /proc 目录\n`/proc`\
  \ 目录是在 Linux 系统上排除硬件故障时可以使用的重要工具之一。它不是文件系统上的物理目录，而是由内核动态填充的虚拟目录，用于提供有关系统硬件状态的信息。\n\
  \nLinux 内核会在监控系统状态时更改 `/proc` 目录中的文件和数据。要查看硬件设备的状态设置，只需要使用标准的 Linux 命令读取虚拟文件的内容。\n\
  \n不同的系统功能对应不同的 `/proc` 文件，包括系统硬件使用的 `IRQ`、`I/O` 端口和 `DMA` 通道。接下来的章节将讨论监控这些功能的文件以及你如何访问它们。\n\
  \n#### 中断请求\n中断请求\n\n![输出显示使用 Linux cat 命令查看的中断请求](img/9781284255805_CH03_CUM11.jpg)\n\
  \n描述\n\n\n\n\n第一列表示分配给设备的 IRQ。某些 IRQ 被系统保留用于特定的硬件设备，例如，0 用于系统定时器，1 用于系统键盘。其他 IRQ\
  \ 则在启动时检测到设备时由系统分配。\n\n#### I/O 端口\n\n系统 `[I/O ports]` 是内存中 CPU 可以向硬件设备发送数据或从其接收数据的位置。与\
  \ IRQ 一样，系统必须为每个设备分配唯一的 I/O 端口。这是 PnP（即插用）系统处理的另一个功能。\n\n你可以通过查看 `/proc/ioports`\
  \ 文件来监控分配给系统硬件设备的 I/O 端口：\n\n![输出显示分配给硬件设备的输入输出端口](img/9781284255805_CH03_CUM12.jpg)\n\
  \n描述\n\nLinux 系统在任何时候都有许多不同的 I/O 端口在使用，因此你的输出可能与此示例不同。有了 PnP，I/O 端口冲突并不常见，但可能会有两个设备被分配到同一个\
  \ I/O 端口。在这种情况下，你可以使用 `setpci` 命令手动覆盖自动分配的设置。\n\n#### 直接内存访问\n\n使用 I/O 端口向 CPU 发送数据可能有些较慢。为了加快速度，许多设备使用\
  \ `[直接内存访问 (DMA)]` 通道。DMA 通道顾其实名：它们将数据从硬件设备直接发送到系统的内存，而无需等待 CPU。CPU 可以在数据就绪后读取这些内存位置以访问数据。\n\
  \n与 I/O 端口一样，每个使用 DMA 的硬件设备必须分配一个唯一的通道号。要查看系统当前使用的 DMA 通道，只需显示 `/proc/dma` 文件即可：\n\
  \n![第 1 行：美元 cat 斜 proc 斜 d m a。第 2 行：4 冒号级。第 3 行：美元](img/9781284255805_CH03_CUM13.jpg)\n\
  \n此输出表示 Linux 系统上仅使用了 DMA 通道 4。\n\n#### /sys 目录\n\n另一个用于处理设备的工具是 `/sys` 目录。`/sys`\
  \ 目录是另一个虚拟目录，类似于 `/proc` 目录。它提供了关于硬件设备的额外信息，系统上的任何用户都可以访问。\n\n`/sys` 目录内有许多信息文件。它们根据系统中的设备和功能划分为子目录。你可以使用\
  \ `ls` 命令行查看你系统中 `/sys` 目录下的可用的子目录和文件：\n\n![输出显示使用 ls 命令行显示的子目录和文件](img/9781284255805_CH03_CUM14.jpg)\n\
  \n描述\n\n注意可用的不同类别信息。你可以获取有关系统总线、设备、内核甚至已安装的内核模块的信息。\n\n#### 操作设备\n\nLinux 提供了丰富的命令行工具来使用连接到你系统的设备，并在出现问题时对设备进行监控和故障排除。接下来的章节将介绍你在处理\
  \ Linux 设备时可能需要了解的一些常用工具。\n\n#### 查找设备\n\n新 Linux Linux 员员的首要任务之一是找到 Linux 系统上安装的不同设备。幸运的是，有几个命令行工具可以提供帮助。\n\
  \n#### lsdev 命令\n\n`lsdev` 命令行显示安装在 Linux 系统上的硬件设备信息。它从 `/proc/interrupts`、`/proc/ioports`\
  \ 和 `/proc/dma` 虚拟文件中检索信息并将其合并到一个输出中：\n\n![输出显示使用 lsdev 命令行显示的硬件设备信息](img/9781284255805_CH03_CUM15.jpg)\n\
  \n![输出显示使用 lsdev 命令行显示的硬件设备信息](img/9781284255805_CH03_CUM16.jpg)\n\n描述\n\n这为你提供了一个查看运行在系统上的所有设备重要信息的地方，更容易识别出可能导致问题的冲突。\n\
  \n#### lsblk 命令\n\n`lsblk` 命令行显示安装在 Linux 系统上的块设备信息。默认情况下，`lsblk` 命令显示所有块设备：\n\n\
  ![输出显示使用 lsblk 命令显示的块设备信息](img/9781284255805_CH03_CUM17.jpg)\n\n描述\n\n如果你在输出末尾注意到\
  \ `lsblk` 命令还指示了相关的块，例如设备映射的 LVM 卷和相关的物理硬盘。你可以使用 `-S` 选项修改自动分配的设置。\n\n![输出显示使用 lsblk\
  \ 命令显示的块设备信息](img/9781284255805_CH03_CUM18.jpg)\n\n#### dmesg 命令\n\n`dmesg` 命令记录内核事件。在环形缓冲区中，缓冲区区域保持不变，缓冲区填充后事件消息会被覆盖。你可以使用\
  \ `dmesg` 查看当前消息。\n\n![输出显示使用 dmesg 命令的当前消息](img/9781284255805_CH03_CUM19.jpg)\n\
  \n描述\n\n这是一个快速监控的方法。由于内核负责检测设备并安装正确的模块，当设备无法工作时，`dmesg` 是一个很好的故障排除工具。\n\n### 操作\
  \ PCI 卡\n\n`lspci` 命令允许你查看 Linux 系统上当前安装并识别的 PCI 和 PCIe 卡。你可以配合 `lspci` 使用许多命令行选项来显示安装的\
  \ PCI 和 PCIe 卡的信息。\n\n不带任何选项的 `lspci` 输出显示连接到系统的所有设备：\n\n![输出显示使用 lspci 命令连接到系统的所有设备](img/9781284255805_CH03_CUM20.jpg)\n\
  \n![输出显示使用 lspci 命令连接到系统的所有设备](img/9781284255805_CH03_CUM21.jpg)\n\n\n\n\n你可以使用\
  \ `lsusb` 命令查看连接到 Linux 系统的 USB 设备的基本信息。表 3-3 显示了该命令的选项。\n\n表 3-3 `lsusb` 命令选项。\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| -d | 仅显示指定厂商 ID 的设备 |\n| -D | 仅显示具有指定设备文件的设备信息 |\n\
  | -s | 仅显示使用指定总线的设备信息 |\n| -t | 以树状显示信息，展示相关设备 |\n| -v | 显示有关设备的额外信息（详细模式） |\n|\
  \ -V | 显示 `lsusb` 程序的版本 |\n\n以下是 `lsusb` 程序基础输出的一个示例：\n\n![显示了基础 l s u s b 程序的输出。](img/9781284255805_CH03_CUM22.jpg)\n\
  \n描述\n\n大多数系统集成了一个标准的 USB 集线器，用于将多个 USB 设备连接到 USB 控制器。幸运的是，市场上的 USB 集线器很少，因此所有 Linux\
  \ 发行版都包含了与这些 USB 集线器通信所需的设备驱动。这确保了你的 Linux 系统至少能检测到 USB 设备的插入。\n\n## 使用热拔设备\n\n\
  计算机硬件通常分为两类：\n\n- 冷插拔设备\n- 热插拔设备\n\n冷插拔设备是在完全关机时才能连接到系统的硬件。这些通常包括机箱内部常见的物品，如内存、PCI\
  \ 卡和硬盘。在系统运行时，你无法移除这些任何物品。\n\n相反，你通常可以在任何时间添加和移除热插拔设备。这些通常是外部组件，例如网络连接、显示器和 USB\
  \ 设备。热插拔设备的关键在于，Linux 内核需要知道设备何时连接，并自动加载正确的设备驱动模块来支持该设备。\n\nLinux 提供了一个与热插拔设备交互的子系统，使用户可以使用它。该子系统将在后续章节中描述。\n\
  \n### 检测动态设备\n\n`udev` 设备管理器是由 `init` 进程（通常在启动时通过运行级别 5 运行，通过 `/etc/rc5.d/udev`\
  \ 脚本）或 Systemd 系统自动启动并在后台始终运行的程序。它监听硬件设备的通知。当新硬件设备插入正在运行的系统，或现有硬件设备被移除时，内核会发送通知事件消息。\n\
  \n`udev` 程序监听这些通知消息，并将消息与一组配置文件中定义的规则进行比对，这些文件通常存储在 `/etc/udev/rules.d` 目录下。如果设备匹配定义的规则，`udev`\
  \ 将根据规则定义对事件通知执行操作。\n\n每个 Linux 发行版都定义了一套供 `udev` 遵循的标准规则。规则定义了此类操作，例如在插入 USB 闪存时将其挂载到\
  \ `/media` 文件夹下，或在移除 USB 网卡时禁用网络访问。你可以修改定义的规则，但通常没有必要。\n\n### 操作动态设备\n\n当 `udev`\
  \ 程序在你的 Linux 系统后台运行运行时，你仍可以使用 `udevadm` 命令行工具与其进行交互。`udevadm` 命令允许你向 `udev` 程序发送命令。`udevadm`\
  \ 命令的格式如下：\n\n![u d e v a d m 命令左括号选项右括号。](img/9781284255805_CH03_CUM23.jpg)\n\n\
  表 3-4 显示了可以发送给 `udevadm` 程序的命令。\n\n表 3-4 `udevadm` 命令。\n\n| 命令 | 描述 |\n| --- | ---\
  \ |\n| control | 修改 `udev` 的内部状态 |\n| info | 查询 `udev` 数据库获取设备信息 |\n| monitor |\
  \ 监听并显示内核事件 |\n| settle | 监控 `udev` 事件队列 |\n| test | 模拟一个 `udev` 事件 |\n| test-builtin\
  \ | 运行内置设备命令进行调试 |\n| trigger | 从内核请求设备事件 |\n\n`control` 命令允许你更改当前运行的 `udev` 程序。例如，通过添加\
  \ `-R` 选项，你可以强制 `udev` 重新加载 `/etc/udev/rules.d` 目录中定义的规则。\n\n## 参考文献\n\nEgidio Docile,\
  \ “Tutorial on how to write basic udev rules in Linux,” LinuxConfig.org, 2018 年\
  \ 8 月, 于 2021 年 10 月 14 日检索 [`linuxconfig.org/tutorial-on-how-to-write-basic-udev-rules-in-linux`](https://linuxconfig.org/tutorial-on-how-to-write-basic-udev-rules-in-linux)。\n\
  \nJon Masters, Robby Workman, and Lucas De Marchi, “modprobe,” Ubuntu Manuals, 于\
  \ 2021 年 10 月 14 日检索。\n\n\n\n\n有时候启动信息的滚动速度较快，导致很难看清到底发生了什么。如果你需要排查启动问题，可以使用 `dmesg`\
  \ 命令查看启动时间期间的日志。大多数 Linux 发行版会将启动内核消息复制到内存中一个特殊的环形缓冲区，称为内核环形缓冲区 (kernel ring buffer)。该缓冲区是循环的，并设置了预定的大小。当新消息被记录在缓冲区中时，旧的消息会被轮换出。\n\
  \n你使用 `dmesg` 命令来显示当前存储在内核环形缓冲区中的启动消息：\n\n![输出使用 d m e s g 命令显示当前存储在内核环形缓冲区中的启动消息。](img/9781284255805_CH04_CUM01.jpg)\n\
  \n描述\n\n![输出使用 d m e s g 命令显示当前存储在内核环形缓冲区中的启动消息。](img/9781284255805_CH04_CUM02.jpg)\n\
  \n大多数 Linux 发行版还将启动消息存储在日志文件中，通常位于 `/var/log` 文件夹中。\n\n虽然查看启动期间生成的不同消息很有帮助，但了解究竟是什么生成了这些消息同样有用。本章将讨论这三个启动步骤中的每一个，并通过一些示例来展示它们是如何工作的。\n\
  \n# 固件启动\n\n所有工作站和服务器都利用某种内置固件来控制已安装的操作系统是如何启动的。在较旧的工作站和服务器上，这种固件被称为基本输入/输出系统 (BIOS)。在较新的工作站和服务器上，一种名为统一可扩展性固件接口\
  \ (UEFI) 的新方法负责维护系统硬件状态并启动已安装的操作系统。\n\n这两种方法都会启动 Linux 引导加载程序，但使用的方法不同。本节将介绍 BIOS\
  \ 和 UEFI 方法的基础知识，展示它们是如何参与 Linux 启动过程的。\n\n## BIOS 启动\n\n旧工作站和服务器中使用的 BIOS 固件在功能上相当局限。BIOS\
  \ 固件具有一个简单的菜单界面，允许你更改某些设置以控制系统如何查找硬件，并定义 BIOS 应该使用哪个设备来启动操作系统。\n\nBIOS 固件本身只能从硬盘读取一个扇区的数据到内存中运行。正如你可能猜到的，这个空间不足以加载整个操作系统。这导致大多数操作系统（包括\
  \ Linux 和 Microsoft Windows）将启动过程分为两个部分。\n\n首先，BIOS 运行一个引导加载程序 (boot loader) 程序。引导加载程序是一个很小的程序，用于初始化必要的硬件，以找到并运行完整的操作系统程序，该程序通常位于同一块硬盘的另一个位置，但有时位于单独的内部或外部存储设备上。\n\
  \n引导加载程序通常有一个配置文件，因此你可以告诉它去哪里寻找要运行的实际操作系统文件，甚至可以生成一个小型菜单，允许用户在多个操作系统之间进行启动。\n\n\
  为了启动程序，BIOS 必须知道在已安装的存储设备上从何处找到引导加载程序。大多数 BIOS 设置允许你从几个位置加载引导加载程序：\n\n* 内部硬盘\n*\
  \ 外部硬盘\n* CD/DVD 驱动器\n* USB 闪盘\n* 网络服务器\n\n从硬盘启动时，你必须指定 BIOS 应该从哪块硬盘以及该硬盘上的哪个分区加载引导加载程序。这是通过定义主引导记录\
  \ (MBR) 完成的。\n\n`MBR` 是系统上第一个硬盘分区的第一个扇区。整个计算机系统只有一个 `MBR`。BIOS 寻找 `MBR` 并将存储在那里的程序读取到内存中。当它运行引导加载程序时，该程序会指向实际操作系统内核文件的位置，该文件存储在系统上已安装的某个独立分区的启动扇区中。内核启动文件没有大小限制。\n\
  \n## UEFI 启动\n\n虽然 BIOS 存在极大的局限性，但计算机制造商学会了与这些局限性共处，因此多年来 BIOS 一一直是工作站和服务器的默认标准。然而，随着操作系统和硬件变得越来越复杂，显然显然需要开发一种新方法。\n\
  \nIntel 在 1998 年创建了可扩展固件接口 (EFI) 以解决 BIOS 的某些局限性。到 2005 年，这一想法得到了其他供应商的认可，UEFI 规范被采用为标准。如今，几乎所有的桌面和服务器系统都能支持\
  \ UEFI 固件标准。\n\nUEFI 固件可以与 `MBR` 格式的硬盘配合工作，但也使用一种较新的格式，称为 GUID 分区表 (GPT)。`GPT` 不再依赖硬盘上的单个启动扇区来存放引导加载程序，而是指定了一个特殊的磁盘分区，称为\
  \ EFI 系统分区 (ESP)。`ESP` 利用旧的文件分配表 (FAT) 文件系统来存储引导加载程序。在 Linux 系统上，`ESP` 通常挂载在 `/boot/efi`，而引导加载文件通常使用\
  \ `.efi` 后缀。\n\nUEFI 固件利用一个内置启动管理器)允许你配置要启动的引导加载文件。对于 UEFI，你需要在启动菜单中注册每个你想显示的引导加载文件。\n\
  \n每当你启动系统，一旦固件找到并运行了引导加载程序，它的任务就结束了。启动过程中的引导加载程序可能会有些复杂；下一节将深入探讨。\n\n# Linux 引导加载程序\n\
  \n引导加载程序帮助桥接系统固件与 Linux 操作系统之间的差异。在 Linux 中有多种引导加载程序可供选择。然而，你最常用的是：\n\n* Linux Loader\
  \ (LILO)\n* 统一引导加载程序 (GRUB) Legacy\n* GRUB2\n\n在 Linux 的早期版本中，`LILO` 引导加载程序是唯一的可用引导加载程序。它在功能上极其局限，但它完成了任务——从\
  \ BIOS 启动加载 Linux 内核。`LILO` 成为 90 年代 Linux 发行版使用的默认引导加载程序。遗憾的是，`LILO` 不支持 `GPT`\
  \ 磁盘，因此在现代系统上的用途有限。\n\n第一代 `GRUB` 引导加载程序（现在称为 `GRUB Legacy`）于 1999 年创建，旨在提供更健壮、可配置的引导加载程序来取代\
  \ `LILO`。`GRUB` 迅速成为所有 Linux 发行版的默认引导加载程序，无论它们运行在 BIOS 还是 UEFI 系统上。\n\n`GRUB2` 于\
  \ 2005 年作为 `GRUB Legacy` 系统的完全重写而创建。它支持高级功能，例如加载硬件驱动模块的能力以及根据系统检测到的条件（例如是否连接了外部硬盘）使用逻辑语句动态更改启动菜单选项。\n\
  \n\n\n\n本节将介绍 GRUB Legacy 和 GRUB2 启动加载程序的基础知识，这应该涵盖了你现在会遇到的几乎所有 Linux 发行版。\n\n###\
  \ GRUB Legacy\n\nGRUB Legacy 启动加载程序旨在简化创建启动菜单和向内核传递选项的过程。GRUB Legacy 允许你通过菜单界面以及交互式\
  \ shell 来选择多个内核和/或操作系统。你可以配置菜单界面，为你想要启动的每个内核或操作系统提供选项。交互式 shell 则为你提供了一种即时自定义启动命令的方法。\n\
  \n这两种方法都使用一组控制启动加载程序功能的命令。本节将介绍如何配置 GRUB Legacy 启动加载程序、如何安装它，以及在启动时如何与它交互。\n\n####\
  \ 配置 GRUB Legacy\n\n当你使用 GRUB Legacy 交互式菜单时，你需要告诉它显示哪些选项。你使用特殊的 GRUB 命令来完成这一操作。\n\
  \nGRUB Legacy 系统将菜单命令存储在一个标准的文本文件中。GRUB Legacy 使用的配置文件名为 `menu.lst`，存储在 `/boot/grub`\
  \ 文件夹中（虽然不是强制，但某些 Linux 发行版会在硬盘上创建一个独立的 `/boot` 分区）。基于 Red Hat 的 Linux 发行版（如 CentOS\
  \ 和 Fedora）使用 `grub.conf` 代替 `menu.lst`。\n\nGRUB Legacy 配置文件包含两个部分：\n\n* 全局定义\n\
  * 操作系统启动定义\n\n全局定义部分定义了控制 GRUB Legacy 启动菜单整体运行的命令。全局定义必须出现在配置文件的开头。你可以进行的全局设置寥寥几个；表\
  \ 4-1 显示了这些设置。\n\n表 GRUB Legacy 全局命令。\n\n| 设置 | 描述 |\n| --- | --- |\n| color | 指定启动菜单中使用的前景色和背景颜色\
  \ |\n| default | 定义要选择的默认菜单选项 |\n| fallback | 当默认选项失效时使用的备用菜单选择 |\n| hiddenmeu |\
  \ 不显示菜单选择选项 |\n| splashimage | 指向一个作为启动菜单背景的图像文件 |\n| timeout | 指定在执行默认选项之前等待菜单选择的时间\
  \ |\n\n对于 GRUB Legacy，要为命令定义值，只需将该值作为命令行参数列出即可：\n\n![第 1 行：default 0。第 2 行：timeout\
  \ 10。第 3 行：color white slash blue yellow slash blue。](img/9781284255805_CH04_CUM03.jpg)\n\
  \n`color` 命令定义了菜单的配色方案。第一对定义了普通菜单项的前景色/背景对，而第二对定义了被选中菜单项的前景色/背景对。\n\n在全局定义之后，你为安装在系统上的各个操作系统放置定义。每个操作系统都应该有自己的定义部分。有很多启动定义设置，可以用来自定义启动加载程序寻找操作系统内核文件的方式。幸运的是，只需要几个命令就可以定义操作系统。需要记住的是以下几个：\n\
  \n* `title`——每个启动定义部分的第一行，这是显示在启动菜单中的内容\n* `root`——定义系统上存放 GRUB `/boot` 文件夹分区的磁盘和分区\n\
  * `kernel`——定义存储在 `/boot` 文件夹中用于加载的内核镜像文件\n* `initrd`——定义初始 RAM 磁盘文件，该文件包含了内核与系统硬件交互所需的硬件驱动程序\n\
  * `rootnoverify`——定义非 Linux 启动分区，例如 Windows\n\n`root` 命令定义了包含 GRUB Legacy 的 `/boot`\
  \ 文件夹的硬盘和分区。遗憾的是，GRUB Legacy 使用了一种相当奇怪的方式引用这些值：\n\n![左括号 h d drive 逗号 partition\
  \ 右括号。](img/9781284255805_CH04_CUM04.jpg)\n\nGRUB Legacy 引用硬盘的方式不像 Linux 那所的；它使用一套数字系统来引用磁盘和分区，从\
  \ 0 开始而不是从 1。例如，要引用系统上第一块硬盘上的第一个分区，你需要使用 `(hd0,0)`。要引用第一块硬盘上的第二个分区，你需要使用 `(hd0,1)`。\n\
  \n这是一个示例 GRUB 配置文件，定义了用于启动的 Windows 和 Linux 分区：\n\n![显示了一个示例 G R U B 配置文件。](img/9781284255805_CH04_CUM05.jpg)\n\
  \n此示例显示了两个启动选项——一个用于 Ubuntu Linux 系统，另一个用于 Windows 系统。Ubuntu 系统安装在第二块硬盘的第一个分区上，而\
  \ Windows 系统安装在第一块硬盘的第一个分区上。\n\n#### 安装 GRUB Legacy\n\n一旦构建了 GRUB Legacy 配置文件（作为\
  \ `menu.lst` 或 `grub.conf`，取决于你的 Linux 发行版），你就必须在 MBR 中安装 GRUB。执行此操作的命令是 `grub-install`。\n\
  \n`grub-install` 命令使用单个参数——要安装 GRUB 的分区。你可以使用 Linux 或 GRUB Legacy 格式指定该分区。例如，要使用\
  \ Linux 格式，你需要使用\n\n![hash 空格 g r u b 连字符 install 空格 斜杠 dev 斜 s d a。](img/9781284255805_CH04_CUM06.jpg)\n\
  \n```\ngrub-install /dev/sda\n```\n\n在 MBR 中安装 GRUB。要使用 GRUB Legacy 格式，必须给硬盘加上引号：\n\
  \n![左括号 hd,0 右括号。](img/9781284255805_CH04_CUM07.jpg)\n\n```\ngrub-install \"(hd0,0)\"\
  \n```\n\n如果你使用链式加载方法并倾向于将 GRUB Legacy 安装在分区而不是硬盘上，必须指定分区：\n\n```\ngrub-install /dev/sda1\n\
  ```\n\n在修改配置文件后，你不需要在 MBR 中重新安装 GRUB Legacy——GRUB Legacy 在每次运行时读取配置文件。\n\n#### 与\
  \ GRUB Legacy 交互\n\n当你启动使用 GRUB Legacy 启动程序的系统时，你会看到一个显示你在配置文件定义的启动选项的菜单。如果你等待超时，将执行默认选项。或者，你可以使用方向键选择一个启动选项，然后按回车。\n\
  \n你还可以从 GRUB 菜单即时编辑启动选项。首先，移动到你想修改的启动选项，然后按 E 键会出现一个新屏幕，显示该项当前的配置选项。使用方向键移动光标到需要修改的行，然后按\
  \ E 键编辑。按 B 使用新值启动系统。你也可以随时按 C 进入交互式 shell 模式，允许你提交命令。\n\n### GRUB2\n\n由于 GRUB2\
  \ 系统旨在对 GRUB Legacy 进行改进，许多功能是相同的，只是有些小变化。例如，GRUB2 系统将配置文件名改为 `grub.cfg` 并将其存储在\
  \ `/boot/grub/` 文件夹中。（这允许你同时安装 GRUB Legacy 和 GRUB2。）\n\n#### 配置 GRUB2\n\nGRUB2 中使用的命令也有一些变化。例如，与其使用\
  \ `title` 命令，GRUB 使用 `menuentry` 命令，并且你必须用紧跟在 `menuentry` 命令后的括号将每个独立的启动部分括起来。这里是一个示例\
  \ GRUB2 配置文件的例子：\n\n![显示了一个示例 G R U B 2 配置文件。](img/9781284255805_CH04_CUM09.jpg)\n\
  \n\n\n\n\n![显示了一个示例 G R U B 2 配置文件。](img/9781284255805_CH04_CUM10.jpg)\n\n描述\n\n\
  注意，`GRUB2` 使用 `set` 命令为 `root` 关键字赋值，并使用等号为设备赋值。`GRUB2` 利用环境变量来配置设置，而不是使用命令。\n\n\
  让事情变得更加复杂的是，`GRUB2` 更改了分区的编号系统。虽然它仍然使用 `0` 表示第一块硬盘，但第一个分区的（partition）被设置为 `1`。因此，要在第一块硬盘的第一个分区上定义\
  \ `/boot` 文件夹，你现在需要使用：\n\n![设置根空间等于硬盘空间左括号 0 逗号 1 右括号。](img/9781284255805_CH04_CUM11.jpg)\n\
  \n此外，注意 `GRUB2` 不使用 `rootnoverify` 和 `kernel` 命令。非 Linux 启动选项现在与 Linux 启动选项相同，通过\
  \ `root` 环境变量定义，并且你使用 `linux` 命令定义内核位置。\n\n`GRUB2` 的配置过程也略有不同。虽然 `/boot/grub/grub.cfg`\
  \ 文件是 `GRUB2` 使用的配置文件，但你不应该修改该文件。相反，单独的配置文件存储在 `/etc/grub.d` 文件夹中。这允许你（或系统）为系统上安装的每个启动选项创建单独的配置文件（例如，一个用于启动\
  \ Linux 的配置文件，另一个用于启动 Windows 的配置文件）。\n\n对于全局性命令（global commands），请使用 `/etc/default/grub`\
  \ 配置文件。你会发现某些全局命令的格式已从 GRUB Legacy 命令发生了变化，例如，使用 `GRUB_TIMEOUT` 代替单独的 `timeout`。\n\
  \n大多数 Linux 发行版会在某些事件发生后（例如升级内核）自动生成新的 `grub.cfg` 配置文件。\n\n### 安装 GRUB2\n\n与 `GRUB\
  \ Legacy` 不同，你不需要安装 `GRUB2`；你只需要重新构建主安装文件。这是通过运行 `grub-mkconfig` 程序实现的。\n\n`grub-mkconfig`\
  \ 程序读取存储在 `/etc/grub.d` 文件夹中的配置文件，并将命令汇合成单个的 `grub.cfg` 配置文件。\n\n你可以通过运行 `grub-mkconfig`\
  \ 命令手动更新配置文件：\n\n```\ngrub-mkconfig > /boot/grub/grub.cfg\n```\n\n![hash 空间 g r\
  \ u b- m k config 空间大于 / boot / g r u b / g r u b . c f g。](img/9781284255805_CH04_CUM12.jpg)\n\
  \n注意，你必须手动将 `grub-mkconfig` 程序的输出重定向到 `grub.cfg` 配置文件。默认情况下，`grub-mkconfig` 程序将新的配置文件命令输出到标准输出。\n\
  \n### 与 GRUB2 交互\n\n`GRUB2` 引导程序产生一个与 `GRUB Legacy` 方法相似的启动菜单。你可以使用方向键在启动选项之间切换，使用\
  \ `E` 键编辑启动项，或使用 `C` 键调出 `GRUB2` 命令行以提交交互式启动命令。\n\n### 替代引导程序\n\n虽然 `GRUB Legacy`\
  \ 和 `GRUB2` 是目前最流行的 Linux 引导程序，但取决于你使用的 Linux 发行版，可能还会遇到其他几个程序。\n\n`Syslinux` 项目包含了五个独立的引导程序，它们在\
  \ Linux 中有特殊用途：\n\n*   `SYSLINUX`——用于使用 Microsoft FAT 文件系统的引导程序（常用于从 USB 闪存盘启动）\n\
  *   `EXTLINUX`——用于从 ext2、`ext3`、`ext4` 或 `btrfs` 文件系统启动的微型引导程序\n*   `ISOLINUX`——用于从\
  \ LiveCD 或 LiveDVD 启动的引导程序\n*   `PXELINUX`——用于从网络服务器启动的引导程序\n*   `MEMDISK`——一个从其他\
  \ `Syslinux` 引导程序启动旧版 DOS 操作系统的工具\n\n`ISOLINUX` 引导程序在发布 LiveDVD 版本的发行版中非常流行。该引导程序需要两个文件：`isolinux.bin`（包含引导程序镜像）和\
  \ `isolinux.cfg`（包含配置设置）。\n\n`PXELINUX` 引导程序相当复杂。它使用预启动执行环境（`PXE`）标准，该标准定义了网络工作站如何从中央网络服务器启动并加载操作系统。PXE`\
  \ 使用 `DHCP` 为工作站分配网络地址，并使用 `BOOTP` 和 `TFTP` 从服务器加载引导程序镜像。\n\n要利用 `PXELINUX`，`TFTP`\
  \ 服务器需要拥有 `PXELINUX` 引导程序（通常存储为 `/tftpboot/pxelinux.0`供工作站下载。每个工作站必须在 `/tftpboot/pxelinux.cfg`\
  \ 文件夹中有一个可用的配置文件。文件根据工作站的 MAC 地址命名，并包含该工作站所需的特定配置。\n\n## 进程初始化\n\nLinux 系统包含许多在后台运行的程序，为系统提供服务。\n\
  \n\n\n\n\n虽然每个 Linux 发行版都定义了在特定运行级别（runlevels）下运行的应用程序，但你可以参考一些通用指南。表 4-2 显示了 Linux\
  \ 运行级别的通用用途。\n\n表 4-2 Linux 运行级别。\n\n| 运行级别 | 说明 |\n| --- | --- |\n| 0 | 关闭系统 |\n\
  | 1 | 单用户模式。用于系统维护。 |\n| 2 | 在基于 Debian 的系统中，多用户图形模式 |\n| 3 | 在基于 Red Hat 的系统中，多用户文本模式\
  \ |\n| 4 | 未定义 |\n| 5 | 在基于 Red Hat 的系统中，多用户图形模式 |\n| 6 | 重启系统 |\n\n大多数 Linux 发行版使用\
  \ Red Hat 运行级别方法，即使用运行级别 3 作为多用户文本模式，运行级别 5 作为多用户图形模式。\n\n### 在运行级别中启动应用程序\n\n在运行级别中启动应用程序有两种方法：\n\
  \n- 使用 `/etc/inittab` 文件\n- 使用启动脚本\n\n`/etc/inittab` 文件定义了哪些应用程序在哪个运行级别启动。`/etc/inittab`\
  \ 文件中的每一行都定义了一个应用程序并使用以下格式：\n\n![I d colon run levels colon action colon process.](img/9781284255805_CH04_CUM14.jpg)\n\
  \n`id` 字段包含一到四个字符，用于唯一标识进程。`runlevels` 字段包含应用程序应该运行的运行级别列表。该列表不是用逗号分隔的，因此值 `345`\
  \ 表示应用程序应该在运行级别 3、4 和 5 下启动。\n\n`action` 字段包含一个关键字，告诉内核对于该运行级别应该对应用程序执行什么操作。可能的值见表\
  \ 4-3。\n\n表 4-3 SysV inittab action 值。\n\n| 动作 | 说明 |\n| --- | --- |\n| boot | 进程在启动时启动。\
  \ |\n| bootwait | 进程在启动时启动，系统将等待其完成。 |\n| initdefault | 指定系统启动后进入的运行级别。 |\n| kbrequest\
  \ | 在按下特殊组合键后启动进程。 |\n| once | 在进入运行级别时启动一次进程。 |\n| powerfail | 在系统关电时启动进程。 |\n\
  | powerwait | 在系统关电时启动进程，系统将等待其完成。 |\n| respawn | 进程在进入运行级别时启动，并在每次终止时重启。 |\n| sysinit\
  \ | 进程在启动时于任何 boot 或 bootwait 项目之前启动。 |\n| wait | 进程启动一次，系统将等待其完成。 |\n\n`initdefault`\
  \ 所在的行指定了系统在启动后正常运行的运行级别：\n\n![I d colon 3 colon init default colon.](img/9781284255805_CH04_CUM15.jpg)\n\
  \n除了运行级别外，SysVinit 方法还指定了启动脚本来控制应用程序的启动和停止。`/etc/init.d/rc` 或 `/etc/rc.d/rc` 脚本运行所有具有指定运行级别的脚本。脚本本身存储在\
  \ `/etc/init.d/rcx.d` 或 `/etc/rcx.d` 中，其中 `x` 是运行级别数字。\n\n脚本以特定的文件名存储，该文件名指定它们是在该运行级别启动还是停止。以\
  \ `S` 开头的脚本启动程序，以 `K` 开头的脚本停止程序。脚本文件名还包含一个数字，表示 `rc` 程序运行脚本的顺序。这允许你指定哪些脚本在其他脚本之前启动，以控制任何依赖问题。\n\
  \n### 检查运行级别\n\n你已经看到 `/etc/inittab` 文件通过 `initdefault` 动作指示了默认运行级别；但是，无法保证这就是你的\
  \ Linux 系统当前运行的运行级别。`runlevel` 命令会了系统的当前运行级别和上一个运行级别：\n\n![Line 1: dollar run level.\
  \ Line 2: N 2\\. Line 3: dollar.](img/9781284255805_CH04_CUM16.jpg)\n\n第一个字符是上一个运行级别。`N`\
  \ 字符意味着系统处于原始启动运行级别。第二个字符是当前运行级别。\n\n### 更改运行级别\n\n你可以使用 `init` 或 `telinit` 命令更改\
  \ Linux 系统的当前运行级别。只需将运行级别数字作为命令行参数指定即可。例如，要重启系统，你可以输入命令：\n\n![Hash space init space\
  \ 6.](img/9781284255805_CH04_CUM17.jpg)\n\n使用 `init` 命令的缺点是它会立即将系统切换到指定的运行级别。如果你是\
  \ Linux 系统上的唯一用户，这可能不是问题，但在多用户 Linux 环境中，可能会对其他用户产生不利影响。\n\n在多用户 Linux 系统上更改运行级别的更温和的方法是使用以下特殊命令：\n\
  \n- `shutdown`——优雅地将运行级别切换到 1，单用户模式\n- `halt`——优雅地将运行级别切换到 0，停止系统\n- `poweroff`——优雅地将运行级别切换到\
  \ 0，停止系统\n- `reboot`——优雅地将运行级别切换到 6，重启系统\n\n这些命令允许你指定更改的时间。\n\n### Systemd 方法\n\n\
  systemd 初始化进程已迅速成为标准。虽然它最初是 Red Hat 的功能，但现在 Linux 发行版已采纳了它。systemd 初始化进程改变了 Linux\
  \ 系统处理服务的范式，这引发了一些争议。与其使用许多初始化脚本，systemd 方法使用一个带有单独文件的单一程序。\n\n本节将介绍 systemd 工作的基本原理。\n\
  \n#### 单元和目标\n\nsystemd 方法不再使用 shell 脚本和运行级别，而是使用 units 和 targets。单元定义了一个服务或操作，由名称、类型和配置文件组成。目前有\
  \ 12 种类型的单元：\n\n- automount\n- device\n- mount\n- path\n- scope\n- service\n- slice\n\
  - snapshot\n- socket\n- swap\n- target\n- timer\n\nsystemd 程序通过 `name.type` 格式根据名称和类型识别单元。处理单元时使用\
  \ `systemctl` 命令。要列出 Linux 系统当前加载的单元，请使用 `list-units` 参数：\n\n![输出显示了使用 list-units\
  \ 参数加载到 Linux 系统中的单元](img/9781284255805_CH04_CUM18.jpg)\n\nDescription\n\nLinux\
  \ 发行版可能加载并激活数百个不同的单元，此列表仅显示了输出中的几个，让你了解它们的样式。systemd 方法使用服务类型单元来管理 Linux 系统上的守护进程。目标类型单元很重要，因为它们将多个单元组合在一起以便同时启动。例如，`network.target`\
  \ 单元组合了启动网络接口所需的所有单元。\n\nsystemd 初始化进程使用目标的方式类似于 SysV 运行级别。每个目标代表系统上应该运行的不同服务组。与其通过更改运行级别来更改系统运行的内容，只需更改目标。\n\
  \n为了使从 SysV 过渡到 systemd 更平滑，有模拟标准 0 到 6 SysV 运行级别的目标，称为 `runlevel0.target` 到 `runlevel6.target`。\n\
  \n\n\n\n每个单元都需要一个配置文件，用于定义它启动什么程序以及如何启动该程序。`systemd` 系统将单元配置文件存储在 `/usr/lib/systemd/system`\
  \ 文件夹中。以下是 Ubuntu 中使用的 `cron.service` 单元配置示例：\n\n![Ubuntu 中使用的 cron.service 单元配置文件的示例。](img/9781284255805_CH04_CUM19.jpg)\n\
  \n描述\n\n`cron.service` 配置文件定义了要启动的程序（`/usr/sbin/cron`）以及其他一些功能，例如在 `cron` 服务启动之前应该运行哪些服务（`After`\
  \ 行）、系统应该处于什么目标级别（`WantedBy` 行）以及如何重新加载程序（`Restart` 行）。\n\n目标单元也使用配置文件。它们不定义程序，而是定义要启动哪些服务单元。以下是\
  \ CentOS 中使用的 `graphical.target` 单元配置示例：\n\n![CentOS 中使用的 graphical.target 单元配置文件的示例。](img/9781284255805_CH04_CUM20.jpg)\n\
  \n描述\n\n目标配置定义了应该先加载哪些目标（`After` 行）、启动此目标需要哪些目标（`Requires` 行）、哪些目标与此目标冲突（`Conflicts`\
  \ 行）以及该目标需要哪些目标或服务运行（`Wants` 行）。\n\n### 设置默认目标\n\nLinux 系统启动时使用的默认目标定义为 `default.target`\
  \ 文件，位于 `/usr/lib/systemd/system` 文件夹中。这是 `systemd` 程序在启动时查找的文件。该文件通常被设置为指向位于 `/usr/lib/systemd/system`\
  \ 文件夹中某一个标准目标文件的链接：\n\n![显示了将文件设置为指向标准目标文件的链接的代码。](img/9781284255805_CH04_CUM21.jpg)\n\
  \n描述\n\n在该 Ubuntu 系统上，默认目标被设置为 `graphical.target` 单元。\n\n你也可以通过 `systemctl` 命令查看系统的默认目标：\n\
  \n![第 1 行：$ systemctl get-default。第 2 行：graphical.target。第 3 行：$](img/9781284255805_CH04_CUM22.jpg)\n\
  \n这再次显示 `graphical.target` 目标是默认的。\n\n### systemctl 程序\n\n你使用 `systemctl` 程序控制服务和目标。`systemctl`\
  \ 程序使用选项来定义要执行的操作，如表 4-4 所示。\n\n表 4-4 `systemctl` 命令\n\n| 命令名称 | 解释 |\n| --- | ---\
  \ |\n| `get-default` | 显示系统配置的默认目标 |\n| `list-units` | 显示所有配置单元的当前状态 |\n| `default\
  \ name` | 切换到默认目标单元 |\n| `isolate name` | 启动指定的单元并停止所有其他单元 |\n| `start name` | 启动指定的单元\
  \ |\n| `stop name` | 停止指定的单元 |\n| `reload name` | 导致指定的单元重新加载其配置文件 |\n| `restart\
  \ name` | 导致指定的单元关闭并重启 |\n| `status name` | 显示指定单元的状态（如果你愿意，可以传递 PID 值，可以使用名称） |\n\
  | `enable name` | 配置单元在下次下次启动时启动 |\n| `disable name` | 配置单元在下次下次启动时不启动 |\n\n不再使用\
  \ shell 脚本来启动和停止服务，而是使用 `start` 和 `stop` 命令：\n\n![输出显示了 systemctl 命令的用法。](img/9781284255805_CH04_CUM23.jpg)\n\
  \n![输出显示了 systemctl 命令的用法。](img/9781284255805_CH04_CUM24.jpg)\n\n![输出显示了 systemctl\
  \ 命令的用法。](img/9781284255805_CH04_CUM25.jpg)\n\n描述\n\n要更改当前运行的目标，你必须使用 `isolate`\
  \ 命令。例如，要进入单用户模式，你会使用：\n\n```\nsystemctl isolate rescue.target\n```\n\n![](img/9781284255805_CH04_CUM26.jpg)\n\
  \n要返回系统的默认目标，只需使用 `default` 命令。\n\n`systemd` 初始化过程中较有争议的特性之一是它不使用标准的 Linux `syslogd`\
  \ 日志系统。相反，它有自己的日志文件，而且这些日志不是以文本格式存储的。要查看 `systemd` 日志文件，你需要使用 `journalctl` 程序。\n\
  \n![抽象图像显示了烟雾形式的纹理。](img/opener.jpg)\n\n## 磁盘管理\n\nLinux 有许多增强，使其对新手用户更加友好。如果人们找不到或无法使用存储设备，他们会感到不适。\n\
  \nLinux 处理磁盘的方式具有控制性、可靠性和预测性，这使其成为取证调查人员的首选之一。阅读本章后，你将更好地理解 Linux 如何分配设备名称，以及 `sdb2`\
  \ 和 `sde3` 的含义。磁盘分区命名最初可能难以理解，但正如你所看到的，Linux 分配它们的过程是有逻辑的。\n\n\n\n\nLinux 处理 HDD\
  \ 和 SSD 存储设备的方式相同。它主要取决于将驱动器连接到 Linux 系统的方法。本节介绍了 Linux 用于连接和使用 HDD 及 SSD 设备的不同方法。\n\
  \n## 驱动器连接\n\n虽然 HDD 和 SSD 在存储数据的方式上有所，但它们都使用相同的方法与 Linux 系统交互。在 Linux 系统中，你会遇到三种主要的驱动器连接类型：\n\
  \n* 并行高级技术接口 (PATA) 使用并行接口连接驱动器，这需要一个宽连接器。PATA 每个适配器支持两个设备。\n\n* 串行高级技术接口 (SATA)\
  \ 使用串行接口连接驱动器，但其速度比 PATA 快得多。SATA 每个适配器支持最多四个设备。\n\n* 小型计算机系统接口 (SCSI) 使用并行接口连接驱动器，但具有\
  \ SATA 的速度。SCSI 每个适配器支持最多八个设备。\n\n* 非易失性内存表达式 (NVMe) 使用并行接口连接固态硬盘，以实现最大的数据传输速度。NVMe\
  \ 标准每个适配器支持最多 12 个设备。\n\n当你将驱动器连接到 Linux 系统时，Linux 内核会在 `/dev` 目录中为驱动器设备分配一个文件。该文件被称为原始设备，因为它提供了从\
  \ Linux 系统直接到驱动器的路径。写入该文件的任何数据都会被写入驱动器，读取该文件则会直接从驱动器读取数据。\n\n对于 PATA 设备，此文件命名为 `/dev/hdx`，其中\
  \ `x` 是代表单个驱动器的字母，从 a 开始。对于 SATA 和 SCSI 设备，Linux 使用 `/dev/sdx`，其中 `x` 同样是代表单个驱动器的字母，且从\
  \ a 开始。因此，要引用系统上的第一个 SATA 设备，你会使用 `/dev/sda`，然后是第二个设备使用 `/dev/sdb`，以此类推。\n\n## 驱动器分区\n\
  \n大多数存储设备允许你将设备划分为多个区域。分区是驱动器内部一个自包含的区域，操作系统将其视为独立的存储空间。\n\n驱动器分区可以帮助你更好地组织数据，例如将操作系统数据与用户数据分离。如果一个恶意用户用数据填满了她的\
  \ `/home` 磁盘空间，操作系统仍有空间在独立的分区上运行。\n\n分区必须由驱动器上的某种索引系统进行跟踪。使用旧版 BIOS 引导加载程序方法（见第\
  \ 4 章）的系统使用主引导记录 (MBR)方法来管理磁盘分区。该方法在驱动器上支持最多四个主分区。或者，你可以创建一个或多个扩展分区，它们可以被拆分为多个分区。\n\
  \n使用 UEFI 引导加载程序方法（见第 4 章）的系统使用更高级的 GUID 分区表 (GPT)方法来管理分区，它支持驱动器上最多 128 个分区。Linux\
  \ 按分区在驱动器上出现的顺序分配分区编号，从数字 1 开始。\n\nLinux 为每个单独磁盘分区创建 `/dev` 文件。它将分区编号附加在设备名称末尾，并从\
  \ 1 开始为主分区编号，因此第一个 SATA 驱动器上的第一个主分区是 `/dev/sda1`。MBR 扩展分区从 5 开始编号，因此第一个扩展分区被分配文件\
  \ `/dev/sda5`。\n\n## 自动驱动器检测\n\nLinux 系统在启动时检测驱动器和分区，并为每一个一个分配一个唯一的设备文件名。然而，随着可插拔\
  \ USB 驱动器（如优存盘）的发明（它们可以在系统运行时随时添加和删除），这种方法需要进行修改。\n\n绝大多数 Linux 系统现在使用 `udev` 。`udev`\
  \ 程序始终在后台运行，并自动检测连接到运行中的 Linux 系统的的新硬件。当你连接新驱动器、USB 设备或光驱（如 CD 和 DVD 设备）时，`udev`\
  \ 会检测它们并在 `/dev` 目录中为每一个分配一个唯一的设备文件名。\n\n`udev` 应用程序的另一个功能是它还为存储设备创建了持久性设备文件。当你添加或删除可插拔存储设备时，分配给它的\
  \ `/dev` 名称可能会发生变化，取决于此时连接了哪些设备。这可能导致应用程序每次无法找到同一个存储设备。\n\n为了解决这个问题，`udev` 应用程序使用\
  \ `/dev/disk` 目录根据驱动器的唯一属性创建指向 `/dev` 存储设备文件的链接。`udev` 创建了四个独立的目录来存储链接：\n\n* `/dev/disk/by-id`——通过制造商、型号和序列号链接\n\
  * `/dev/disk/by-label`——通过标签链接\n* `/dev/disk/by-path`——通过物理路径链接\n* `/dev/disk/by-uuid`——通过\
  \ 128 位唯一标识符 (UUID)链接\n\n## 分区工具\n\n将驱动器连接到 Linux 系统后，你需要对其创建分区。Linux 提供了几种处理存储设备的工具。本节将介绍常用的工具。\n\
  \n### 使用 fdisk\n\n最常用的命令行分区工具是 `fdisk`。`fdisk` 程序允许对任何使用 MBR 方法的磁盘创建、查看、删除和修改分区；它无法处理\
  \ GPT 分区。\n\n要使用 `fdisk` 程序，你需要指定要处理设备的名称（而不是分区名称）：\n\n```\nfdisk /dev/sda\n```\n\
  \n`fdisk` 程序使用自己的命令行允许你提交命令来处理磁盘分区。表 5-1 显示了你可以使用的命令。\n\n| 命令 | 描述 |\n| --- | ---\
  \ |\n| a | 切换启动标记 |\n| b | 编辑 bsd 磁盘标签 |\n| c | 切换 DOS 兼容标记 |\n| d | 删除分区 |\n| g\
  \ | 创建新的 GPT 分区表 |\n| G | 创建 IRIX (SGI) 分区表 |\n| l | 列出已知分区类型 |\n| m | 打印此菜单 |\n\
  | n | 添加新分区 |\n| o | 创建新的 DOS 分区表 |\n| p | 打印分区表 |\n| q | 退出不保存更改 |\n| s | 创建新的\
  \ Sun 磁盘标签 |\n| t | 修改分区的系统 ID |\n| u | 更改显示/输入单位 |\n| v | 验证分区表 |\n| w | 将表写入磁盘并退出\
  \ |\n| x | 额外功能（仅限专家） |\n\n`p` 命令显示驱动器上当前的分区方案：\n\n```\nfdisk -l /dev/sda\n```\n\
  \n\n\n\n\n在本示例中，`/dev/sda` 驱动器被划分为两个分区，`sda1` 和 `sda2`。`Id` 和 `System` 列指的是分区格式化时处理的文件系统\
  \ 类型。两个分区都格式化为以支持 Linux 文件系统。第一个分区分配了约 1GB 的空间，而第二个分区分配了略多 9GB 的空间。\n\n`fdisk` 命令在某些方面比较原始的，因为它不允许你更改现有分区的大小；你所能做的只是删除现有分区并从头开始重建它。\n\
  \n为了能够从分区启动系统，必须为该分区设置启动标志。你可以使用 `a` 命令执行此操作。在输出列表中，带有星号 `*` 的表示可启动的分区。\n\n如果你对驱动器分区进行了任何更改，必须使用\
  \ `w` 命令退出，以便更改写入驱动器。\n\n### 使用 gdisk\n\n如果你正在使用 GPT 索引方法的驱动器，则需要使用 `gdisk` 程序：\n\
  \n![了使用 gdisk 程序处理使用 GPT 索引方法的驱动器的输出。](img/9781284255805_CH05_CUM03.jpg)\n\n描述\n\
  \n`gdisk` 程序识别驱动器上使用的格式化类型。如果驱动器当前没有使用 GPT 方法，`gdisk` 将提供将其转换为 GPT 驱动器的选项。\n\n`gdisk`\
  \ 程序还使用自己的命令提示符，允许你输入命令来操作驱动器布局，如表 5-2 所示。\n\n表 5-2 常见的 `gdisk` 命令。\n\n| 命令 | 说明\
  \ |\n| --- | --- |\n| `b` | 将 GPT 数据备份到文件 |\n| `c` | 更改分区名称 |\n| `d` | 删除分区 |\n\
  | `i` | 显示分区的详细信息 |\n| `l` | 列出已知的分区类型 |\n| `n` | 添加新分区 |\n| `o` | 创建新的空 GUID 分区表\
  \ (GPT) |\n| `p` | 打印分区表 |\n| `q` | 在不保存更改的情况下退出 |\n| `r` | 恢复和转换选项（仅限专家） |\n| `s`\
  \ | 排序分区 |\n| `t` | 更改分区的类型代码 |\n| `v` | 验证磁盘 |\n| `w` | 将表写入磁盘并退出 |\n| `x` | 额外功能（仅限专家）\
  \ |\n| `?` | 打印此菜单 |\n\n你会发现许多 `gdisk` 命令与 `fdisk` 程序中的命令相似，这使得在两个程序之间切换变得更加容易。\n\
  \n### GNU parted 命令\n\nGNU `parted` 程序为处理驱动器分区提供了另一种命令行界面：\n\n![输出提供了一个使用 GNU parted\
  \ 命令处理驱动器分区的命令行界面。](img/9781284255805_CH05_CUM04.jpg)\n\n描述\n\n![输出提供了一个使用 GNU parted\
  \ 命令处理驱动器分区的命令行界面。](img/9781284255805_CH05_CUM05.jpg)\n\n描述\n\n`parted` 程序的卖点之一是它允许你修改现有分区的大小，因此你可以轻松地缩小或扩大驱动器上的分区。\n\
  \n### 图形化工具\n\n如果你在图形化桌面环境中工作，也有一些可用的图形化工具。其中最常用的是 GNOME 分区编辑器，称为 `gparted`。图 5-1\
  \ 显示了在 Ubuntu 桌面环境中运行 `gparted` 的示例。\n\n![截图显示了 g parted 界面。](img/9781284255805_CH05_FIGF01.jpg)\n\
  \n图 5-1 `gparted` 界面。\n\n感谢 Gparted。\n\n描述\n\n`gparted` 窗口一次显示系统上的每个驱动器，以图形化布局显示驱动器中包含的所有分区。你可以右键点击分区以选择挂载或卸载、格式化、删除或调整分区大小的选项。\n\
  \n虽然作为原始设备与驱动器进行交互是完全可能的，但这通常不是 Linux 应用程序的工作方式。在原始设备上尝试读写数据需要大量工作。\n\n## 理解文件系统\n\
  \n与 Windows 一样，Linux 使用文件系统来组织存储媒体上的数据。然而，Linux 文件系统在几个方面有所不同。不像 Windows 使用驱动器号（如\
  \ `C:` 或 `D:`），Linux 使用从根目录开始的单一目录树。所有如硬盘、U 盘和网络驱动器都会“挂载”到特定的目录中。这些目录被称为挂载点。\n\n\
  例如，你可能会将硬盘挂载到 `/mnt`，或者将 U 盘挂载到 `/media`。一旦挂载，设备上的文件就像是根目录的一部分一样。\n\nLinux 支持许多文件系统，包括\
  \ `ext4`、`xfs`、`btrfs` 和 `ntfs`。`ext4` 文件系统是大多数 Linux 发行版的常用选择，以可靠性和性能著称。`xfs` 是另一种常用于大存储的高性能文件系统。`btrfs`\
  \ 提供快照和池等现代功能。`ntfs` 是 Windows 使用的文件系统，Linux 可以读写 NTFS 分区。\n\n### 虚拟目录\n\nLinux\
  \ 虚拟目录是一种忽略物理位置的文件和目录结构。根目录是整个文件系统的起点。Linux 系统上的所有文件和目录都在根目录下。常见的目录包括：\n\n- `/bin`:\
  \ 包含所有用户使用的二进制程序。\n- `/boot`: 包含启动所需的文件。\n- `/home`: 包含用户目录。每个用户都有自己的子目录。\n- `/dev`:\
  \ 包含代表硬件的设备文件。\n- `/etc`: 包含系统配置文件。\n- `/null`: 一个特殊的设备黑洞，丢弃写入它的所有数据。\n- `/proc`:\
  \ 一个虚拟文件系统，包含进程和内核的信息。\n- `/lib`: 包含二进制文件使用的共享库。\n- `/root`: root 用户的家目录。\n- `/opt`:\
  \ 用于可选附加包。\n- `/tmp`: 临时文件目录，通常在重启时清除。\n- `/usr`: 包含用户特定的程序和数据。\n- `/var`: 包含经常变化的文件，如日志和邮件队列。\n\
  \n### 挂载与卸载\n\n挂载点是虚拟文件系统中连接物理设备的目录。要挂载设备，你需要使用 `mount` 命令。例如：\n\n```\nmount /dev/sdb1\
  \ /mnt/data\n```\n此命令使 `/dev/sdb1` 分区的内容可以通过 `/mnt/data` 可。\n\n要安全地移除设备，使用 `umount`\
  \ 命令：\n\n```bash\numount /mnt/data\n```\n\n在移除设备之前卸载它以防止数据损坏是非常重要的。\n\n\n\n\n\n\
  由于 Linux 将所有内容都存储在虚拟目录中，这可能会变得有些复杂。幸运的是，Linux 虚拟目录定义了一种标准格式，称为 Linux 文件系统层次结构标准\
  \ (FHS)。FHS 定义了每个 Linux 系统中应该存在的内核目录名称和位置，以及它们应该包含什么类型的数据。表 5-3 仅显示了 FHS 中定义的一些常用目录。\n\
  \n表 5-3 常见的 Linux FHS 目录。\n\n| 目录 | 描述 |\n| --- | --- |\n| `/boot` | 包含用于启动系统的引导加载程序文件\
  \ |\n| `/home` | 包含用户数据文件 |\n| `/media` | 用作可移动设备的挂载点 |\n| `/mnt` | 也用可移动设备的挂载点\
  \ |\n| `/opt` | 包含可选第三方程序的数据 |\n| `/tmp` | 包含系统用户创建的临时文件 |\n| `/usr` | 包含标准 Linux\
  \ 程序的数据 |\n| `/usr/bin` | 包含本地用户程序和数据 |\n| `/usr/local` | 包含本地安装唯一程序的数据 |\n| `/usr/sbin`\
  \ | 包含系统程序和数据 |\n\n### 在文件系统中移动\n\n使用虚拟目录使得文件从一个物理设备移动到另一个设备变得轻而易举。你不需要担心驱动器号，只需关注虚拟目录内的位置即可：\n\
  \n![Dollar space c p space slash home slash rich slash Documents slash my file dot\
  \ t x t space slash media slash u s b.](img/9781284255805_CH05_CUM08.jpg)\n\n文件的路径列出了虚拟目录结构中的每个目录，引导你向下找到文件。这种格式被称为绝对路径。文件的绝对路径始终从根目录\
  \ `/` 开始，并包含从虚拟目录树到文件的每一个目录。\n\n或者，你可以使用相对路径 来指定文件位置。文件的相对路径表示文件相对于你在虚拟目录树结构中当前位置的位置。如果你已经在\
  \ Documents 目录中，你只需要输入以下：\n\n![Dollar space c p space my file dot t x t space slash\
  \ media slash u s b.](img/9781284255805_CH05_CUM09.jpg)\n\n当 Linux 看到路径不是以正斜杠 `/`\
  \ 开头时，它假设该路径相对于当前目录。\n\n## 格式化文件系统\n\n在将驱动分区分配给虚拟目录中的挂载点之前，你必须使用文件系统对其进行格式化。Linux\
  \ 支持多种不同的文件系统类型，每种都有不同的功能和特性。本节将讨论 Linux 支持的不同文件以及如何为这些文件系统格式化驱动分区。\n\n### 常见文件系统类型\n\
  \n每个操作系统都使用自己的文件系统类型在驱动器上存储数据。Linux 不仅支持几种自己的文件系统类型，还支持其他操作系统的文件系统。本节涵盖了可以在 Linux\
  \ 分区中使用的常用的 Linux 和非 Linux 文件系统。\n\n#### Linux 文件系统\n\n当你专门为 Linux 系统创建文件系统时，你可以从四种主要的文件系统中进行选择：\n\
  \n*   btrfs—一种较新的、高性能文件系统，支持大小可达 16 EiB 的文件，总文件系统大小可达 16 EiB。它还可以执行某种形式的独立磁盘冗余 (RAID)以及逻辑卷管理\
  \ (LVM)。它包含额外的高级功能，例如用于备份的内置快照、改进的容错性和实时数据压缩。\n\n*   ecryptfs—企业加密文件系统 (eCryptfs)\
  \ 在将数据存储设备设备之前应用符合 POSIX 标准的加密协议处理数据。这为存储在设备上的数据提供了一层保护。只有创建该文件系统的操作系统才能从从中读取数据。\n\
  \n*   ext3—也称为 `ext3fs`，是原始 Linux ext 文件系统的后代。它支持大小达 2TiB 的文件，总文件系统大小为 16TiB。它支持日志记录以及更快的启动和恢复。\n\
  \n*   ext4—也称为 `ext4fs`，是 ext 文件系统的最新版本。它支持大小达 2TiB 的文件，总文件系统大小为 16TiB。它支持日志记录以及更快的启动和恢复。\n\
  \n*   reiserfs—由 Hans Reiser 创建，该文件系统设计为即使在系统崩溃后保持快速和可靠。它使用日志机制确保数据完整性。\n\n####\
  \ 非 Linux 文件系统\n\nLinux 的一个伟大功能之一是它可以读取为其他系统（如 Apple 和微软）格式化的数据。这一特性使得不同操作系统之间共享数据变得轻而易举。\n\
  \n以下是常见的非 Linux 文件系统列表：\n\n*   HFS—分级文件系统 (HFS) 是 Apple 为其系统开发的。Linux 也可以与更高级的 `HFS+`\
  \ 交互。\n\n*   ISO-9660—ISO-9660 标准用于在 CD-ROM 设备上创建文件系统。\n\n*   NTFS)—新技术文件系统 (NTFS)\
  \ 是 NT 操作系统及后续 Windows 版本使用的文件系统。Linux 可以在 NTFS 分区上读写数据。\n\n*   [UDF—通用光盘格式 (UDF)\
  \ 常用于 DVD-ROM 设备。Linux 可以使用此文件系统从 DVD 读取数据并向 DVD 写入数据。\n\n*   [VFAT)—虚拟文件分配表 (VFAT)\
  \ 是微软文件分配表 (FAT) 文件系统的扩展。它不常用于驱动器，但常用于可移动存储设备，如 USB 闪存。\n\n*   [XFS)—X 文件系统 (XFS)\
  \ 是 Silicon Graphics 为其工作站创建的。该文件系统提供先进的高性能特性，使其在 Linux 中仍然流行。\n\n*   [ZFS)—泽字节文件系统\
  \ (ZFS) 是 Sun Microsystems 为其 Unix 工作站和服务器创建的。另一种高性能文件系统，它具有与 Linux `btrfs` 文件系统相似的功能。\n\
  \n\n\n\n\n在 Linux 中，用于创建文件系统的“瑞士军刀”程序是 `mkfs` 程序。`mkfs` 程序实际上是几个用于创建特定文件系统的独立工具的前端，例如用于创建\
  \ ext4 文件系统的 `mkfs.ext4` 程序。幸运的是，你不需要记住所有的独立程序；只需在 `mkfs` 命令中指定文件系统类型，它就会自动运行正确的程序。\n\
  \n`mkfs` 程序的优之处在于，你只需要记住一个程序名称，就可以在你的 Linux 系统上创建任何类型的文件系统。只需使用 `-t` 选项来指定文件系统类型即可：\n\
  \n![输出显示了使用连字符 t 选项指定文件系统的 mk f s 程序的用法。](img/9781284255805_CH05_CUM10.jpg)\n\n\
  描述\n\n只需在命令行中指定你想要格式化的分区的设备文件名即可。请注意，`mkfs` 程序在格式化文件系统时会在后台执行很多工作。每个文件系统都有自己索引文件和目录以及跟踪文件访问的方法。`mkfs`\
  \ 程序创建了特定文件系统所需的所有索引文件和表。\n\n## 挂载文件系统\n\n一旦你用文件系统格式化了驱动器分区，就可以将其添加到 Linux 系统的虚拟目录文件系统中。这个过程被称为挂载文件系统。\n\
  \n你可以通过命令行在虚拟目录结构内手动挂载分区，也可以允许 Linux 在启动时自动自动挂载分区。本节将介绍这两种方法。\n\n### 手动挂载设备\n\n\
  要将文件系统临时挂载到 Linux 虚拟目录中，请使用 `mount` 命令。`mount` 命令的基本格式为：\n\n![mount space 连字符 f\
  \ space f s type device space mountpoint.](img/9781284255805_CH05_CUM11.jpg)\n\n\
  使用 `-f` 命令行选项指定设备的文件系统类型：\n\n![第 1 行：美元 sudo mount 连字符 t e x t 4 空格 / dev / s d\
  \ b 1 空格 空格 media u s b 1。第 2 行：美元。](img/9781284255805_CH05_CUM12.jpg)\n\n如果你在指定\
  \ `mount` 命令时不带任何参数，它将显示当前挂载在 Linux 系统上的所有设备。但准备好面对大量的输出，因为大多数 Linux 发行版在虚拟目录中挂载了大量的虚拟设备，以提供系统资源的信息。这里是\
  \ `mount` 命令的部分输出：\n\n![显示了 mount 命令的部分输出。](img/9781284255805_CH05_CUM13.jpg)\n\n\
  描述\n\n为了节省空间，我精简了 `mount` 命令的输出，只显示系统上的物理设备。主硬盘设备（`/dev/sda`）包含两个分区，USB 闪存盘设备（`/dev/sdb`）也包含两个分区。\n\
  \n`mount` 命令的缺点是它只将设备临时挂载到虚拟目录中。当你重启系统时，必须手动再次挂载设备。这对于可移动设备（如 USB 闪存盘）通常没问题，但对于更永久的设备，如果\
  \ Linux 能自动为我们挂载就太好了。幸运的是，Linux 确实做到。\n\n要从虚拟目录移除挂载的驱动器，请使用 `umount` 命令（注意缺少一个“n”）。你可以通过指定设备文件名或挂载点目录来移除挂载的驱动器。\n\
  \n### 自动挂载设备\n\n对于永久存储设备，Linux 维护 `/etc/fstab` 文件来指示启动时应将哪些驱动器设备挂载到虚拟目录。`/etc/fstab`\
  \ 文件是一个表，指出了驱动器设备文件（原始文件或其永久 udev 文件名之一）、挂载点位置、文件系统类型以及挂载驱动器所需的任何额外选项。这是一个来自 Ubuntu\
  \ 工作站的 `/etc/fstab` 文件示例：\n\n![显示了 Ubuntu 工作站的 / e t c / f s tab 文件示例。](img/9781284255805_CH05_CUM14.jpg)\n\
  \n描述\n\n此 `/etc/fstab` 文件通过设备的 udev UUID 值引用设备，确保无论其在原始设备表中的顺序如何，都能访问正确的驱动器分区。第一个分区挂载在虚拟目录的\
  \ `/boot/efi` 挂载点。第二个分区挂载在虚拟目录的根目录（`/`），第三个分区挂载作为虚拟内存的交换区域。\n\n你可以手动将设备添加到 `/etc/fstab`\
  \ 文件中，以便它们在 Linux 系统启动时自动挂载。然而，如果它们在启动时并不存在，将会产生启动错误。\n\n## 管理文件系统\n\n一旦你创建了文件系统并将其挂载到虚拟目录，你可能需要对其进行管理和维护以保持运行顺畅。本节将介绍一些用于管理文件系统的\
  \ Linux 工具。\n\n### 获取文件系统统计信息\n\n在使用 Linux 系统时，你可能需要监控磁盘性能和使用情况。以下是可用于此目的的一些 Linux\
  \ 工具：\n\n- `df`: 显示磁盘使用情况\n- `du`: 显示磁盘使用情况；用于查找占用空间最大的用户或应用程序\n- `iostat`: 显示磁盘的实时图表\n\
  - `lsblk`: 显示分区大小\n\n除了这些工具外，`/proc` 和 `/sys` 目录是内核用于记录统计信息的特殊文件系统。两个目录分别是 `/proc/partitions`\
  \ 和 `/proc/mounts`。此外，`/sys/block` 包含每个挂载驱动器的独立目录。\n\n某些文件系统（如 ext3 和 ext4）在创建时分配特定数量的\
  \ inode。inode 是跟踪文件的索引项。如果文件系统耗用了 inode 条目，即使磁盘上有可用空间也无法创建更多文件。使用 `df` 命令配合 `-i`\
  \ 选项可以显示文件系统的 inode 使用率，这可能是救命的。\n\n### 文件系统工具\n\nLinux 使用 `e2sprogs` 工具包提供处理 ext\
  \ 文件系统（如 ext3 和 ext4）的实用程序。以下是 `e2sprogs` 包中最常用的工具：\n\n- `blkid`: 显示块设备的信息，例如存储\n\
  - `chattr`: 修改文件属性\n- `debugfs`: 手动查看和修改文件系统结构，例如删除文件或提取损坏的文件\n- `dumpe2fs`: 显示块和超级块组信息\n\
  - `e2label`: 修改文件系统标签\n- `resize2fs`: 扩展或缩小文件系统\n- `tune2fs`: 修改文件系统参数\n\n这些工具帮助你精调\
  \ ext 文件系统的参数，但如果文件系统发生损坏，你将需要 `fsck` 程序。\n\nXFS 文件系统也有一套可用于调优文件系统的工具。你最可能会遇到以下两个：\n\
  \n- `xfs_admin`: 显示或更改文件系统参数，例如分配的标签或 UUID\n- `xfs_info`: 显示挂载文件系统的信息，包括块大小和扇区大小，以及标签和\
  \ UUID 信息\n\n虽然这些 ext 和 XFS 工具很有用，但如果文件系统本身出现错误，它们无法帮助修复。对于这种情况，应该使用 `fsck` 程序：\n\
  \n```\n![输出显示了 f s c k 程序的用法。](img/9781284255805_CH05_CUM15.jpg)\n```\n\n\n\n\n\
  `fsck` 程序是几个不同程序的界面，这些程序用于检查各种文件系统，并将索引与文件系统中存储的实际文件进行匹配。如果出现任何`discrepancies`，请运行\
  \ `fsck` 程序，它将尝试协调这些`discrepancies` 并修复文件系统。\n\n## 存储替代\n\n存储设备上的标准分区布局具有局限性。一旦你创建并格式化了一个分区，就很难将其放大或缩小。单个分区也容易磁盘故障的影响，在这种情况下，存储在分区中的所有数据将丢失。\n\
  \n为了适应更动态的存储选项以及容错功能，Linux 整合了一些先进的存储管理技术。本节介绍了你可能会遇到的三种常用技术。\n\n### 多路径 (Multipath)\n\
  \nLinux 内核现在支持设备映射多路径（`DM-multipathing`），它允许你在 Linux 系统和存储设备之间配置多条路径。通过多路径，内核可以合并路径在所有路径均激活时提供更高的吞吐量，或者在其中一条路径变为活动时使用另一条路径进行容错。\n\
  \nLinux DM-multipathing 工具包括：\n\n* `dm-multipath`—提供多路径支持的内核模块\n* `multipath`—用于查看多路径设备的命令行命令\n\
  * `multipathd`—用于监控路径并激活/禁用路径的后台进程\n* `kpartx`—为多路径存储设备创建设备条目的命令行工具\n\n`dm-multipath`\
  \ 特性使用 Linux 中动态的 `/dev/mapper` 设备文件目录。Linux 为你添加到系统的每个新多路径存储设备创建一个名为 `mpathN` 的\
  \ `/dev/mapper` 设备文件，其中 `N` 是多路径驱动器的编号。该文件对 Linux 系统充当普通设备文件，允许你像对待普通驱动分区一样在多路径设备上创建分区和文件系统。\n\
  \n### 逻辑卷管理器 (Logical Volume Manager)\n\nLinux 逻辑卷管理器（`LV`）也利用 `/dev/mapper` 动态设备目录允许你创建虚拟驱动设备。你可以将多个物理磁盘分区聚合为虚拟卷，然后在系统中将其视为单个分区。\n\
  \n`LVM` 的用处在于，你可以根据需要向逻辑卷添加或删除物理分区，并根据需要扩展或收缩逻辑卷。\n\n使用 `LVM` 有些复杂。图 5-3 展示了 `LVM`\
  \ 环境的布局。\n\n![一张图显示了 Linux LVM 环境的布局。](img/9781284255805_CH05_FIGF03.jpg)\n\n图 5-3\
  \ Linux LVM 布局。\n\n在图 5-3 所示的示例中，三个物理驱动每个包含三个分区。第一个逻辑卷由第一个磁盘的前两个分区组成。第二个逻辑卷跨越磁盘，将第一个磁盘的第三个分区与第二个磁盘的第一、二个分区合并创建一个卷。第三个逻辑卷由第二个磁盘的第三个分区以及第三个磁盘的前两个分区组成。第三个磁盘的第三个分区被留空未分配，以后需要时可以将其添加到任何逻辑卷中。\n\
  \n对于每个物理分区，你必须在 `fdisk` 或 `gdisk` 中将分区类型标记为 Linux `LVM` 文件系统类型。然后，你必须使用几个 `LVM`\
  \ 工具来创建和管理逻辑卷：\n\n* `pvcreate`—创建物理卷\n* `vgcreate`—将物理卷分组卷组\n* `lvcreate`—从每个物理卷中的分区创建逻辑卷\n\
  \n逻辑卷会在 `/dev/mapper` 目录下创建条目，这些条目代表你可以格式化文件系统并像普通分区一样使用的 `LVM` 设备。\n\n虽然 `LVM`\
  \ 的初始设置很复杂，但它提供了巨大的益处。如果逻辑卷空间耗尽，只需向卷中添加新的磁盘分区即可。\n\n### 使用 RAID 技术\n\nRAID 技术允许你通过将多个驱动器合并为一个虚拟驱动器来提高数据访问性能和可靠性，并实现容错的数据冗余。常用的有几种版本的\
  \ RAID：\n\n* `RAID 0`—磁盘条列，将数据分布在多个磁盘上以实现更快访问\n* `RAID 1`—磁盘镜像，在两个驱动器上复制数据\n* `RAID\
  \ 10`—磁盘镜像和条列：为性能提供条列，为容错提供镜像\n* `RAID 4`—带校验块的磁盘条列，增加一个存储在独立磁盘上的校验位，以便从故障数据磁盘上恢复数据\n\
  * `RAID 5`—带校验块的磁盘条列，增加一个存储在独立磁盘上的校验位，以便从故障数据磁盘上恢复数据\n* `RAID 6`—带双校验块的磁盘条列，条列的校验位可以从两个故障的驱动器中恢复\n\
  \n如果你的存储硬件不支持 RAID，Linux 实现了一套软件 RAID 系统，可以在任何磁盘上实现 RAID。\n\n`mdadm` 实用程序允许你指定用于任何\
  \ RAID 环境的分区。RAID 设备显示为 `/dev/mapper` 中的单个设备，然后你可以对其进行分区和格式化。\n\n\n\n\n\nShell 允许用户从\
  \ CLI（命令行界面）执行基本有两种操作：\n\n*   运行内部 shell 命令\n*   启动外部程序\n\nShell 本身拥有一组内置命令，可以向用户提供不同类型的信息。这些内部命令\
  \ 范围从允许你从系统注销，到控制你的用户账户在系统上如何创建文件。Shell 是与 Linux 内核交互工作时不可或缺的一部分，了解如何使用它非常有用。\n\n\
  外部命令 包括了 Linux 系统自带的 GNU 工具集，以及任何应用程序，例如桌面程序和服务器程序。\n\n本节将详细介绍 Linux shell 以及 CLI\
  \ 如何为你提供一个基础接口供你与 Linux 内核进行通信。\n\n## Shell 的类型\n\n与 Linux 世界的其他所有事物一样，你有多种类型的 shell\
  \ 可供在 Linux 系统上使用。某些 Linux 发行版默认只安装一个 shell，而另一些发行版则安装多个 shell，允许你尝试你最喜欢哪种。\n\n\
  你会遇到的常见 Linux shell 如下：\n\n*   `bash`——原始的 Linux shell，为了复制 Unix 的 Bourne shell\
  \ 而创建。\n*   `dash`——`bash` 的改进版，由 Debian 开发者创建，用于 Ubuntu Linux。\n*   `ash`——为低功耗桌面设计的\
  \ `bash` 简化版。\n*   `tcsh`——对原始 `csh` shell 的改进，支持 C 风格编程。\n*   `ksh`——Korn shell，在许多\
  \ Unix 发行版中流行，但在 Linux 中不那么流行。\n*   `zsh`——Z shell，它为高级网络和数学功能提供了插件模块。\n\n如你所见，不同的\
  \ shell 为用户和程序员提供了不同的功能。例如，`tcsh` 是一个面向编程的 shell，提供了 C 编程语言特征，帮助程序员创建脚本来自动处理数据，并从\
  \ shell 中控制程序。另一个被脚本编写人员使用的流行的 shell 是 `zsh`，它使用独立的插件模块提供高级的数学方程处理，甚至还支持网络通信！\n\n\
  到目前为止，Linux 中最常见的 shell 是 `bash`。它在所有 Linux 发行版中都可用，也是所有 Linux 认证考试的重点。这也是本书关注的\
  \ shell。\n\n## 启动 Shell\n\n系统为你的会话启动的 shell 取决于你的用户账户配置`/etc/passwd` 文件包含了所有系统用户账户列表，以及关于每个用户的一些配置信息。以下是\
  \ `/etc/passwd` 文件中的示例条目：\n\n![rich colon x colon 501 colon 501 colon Rich Blum\
  \ colon slash home slash rich colon slash bin slash bash.](img/9781284255805_CH06_CUM01.jpg)\n\
  \n每个条目有七个数据字段，字段之间用冒号分隔。系统使用这些字段中的数据为用户分配特定的功能：\n\n*   用户名\n*   用户的密码（如果密码存储在另一个文件中，则是标记）\n\
  *   用户的系统用户 ID 号\n*   用户的系统组 ID 号\n*   用户的全名\n*   用户的默认家目录\n*   用户的默认 shell 程序\n\
  \n大多数 Linux 系统在为用户启动 CLI 环境时使用 `bash` 作为默认 shell。\n\n`bash` 程序还使用命令行参数来修改你可以启动的\
  \ shell 类型。表 6-1 列出了 `bash` 中可用的定义使用何种类型 shell 的命令行参数。\n\n表 6-1 `bash` 命令行参数。\n\n\
  | 参数 | 说明 |\n| --- | --- |\n| `-c string` | 从指定的字符串读取命令并处理它们 |\n| `-r` | 启动受限 shell，将用户限制在默认目录\
  \ |\n| `-i` | 启动交互式 shell，允许用户输入 |\n| `-s` | 从标准输入读取命令 |\n\n默认情况下，当 `bash` 启动时，它会自动处理位于用户家目录下的\
  \ `.bashrc` 文件中的命令。许多 Linux 发行版使用此文件来加载一个包含系统所有用户通用命令和设置的通用文件。该通用文件通常位于 `/etc/bashrc`\
  \ 文件。该文件经常设置在各种应用程序中使用的环境变量（在本章稍后描述）。\n\n## Shell 命令提示符\n\n一旦启动了 shell，CLI 就会显示命令提示符。命令提示符是你与\
  \ shell 交互的网关。这是输入 shell 命令的地方。\n\n`bash` shell 的默认提示符符号是美元符号（`$`）。该符号表示 shell 正在等待输入文本。然而，你可以更改\
  \ shell 使用的提示符格式。不同的 Linux 发行版使用不同的提示符格式。在 Ubuntu Linux 系统中，命令提示符看起来如下：\n\n![rich\
  \ at ubuntu 02 space tilde dollar.](img/9781284255805_CH06_CUM02.jpg)\n\n你可以配置提示符以提供有关你环境的基本信息。上面的第一个示例显示了提示符中的三个信息：\n\
  \n*   启动 shell 的用户名（`rich`）\n*   系统的主机名（`ubuntu02`）\n*   当前目录（波浪号 `~`）\n\n控制提示符格式的变量有两个：\n\
  \n*   `PS1`——控制默认提示符格式\n*   `PS2`——控制次级提示符格式\n\nshell 使用 `PS1` 进行初始输入。如果你输入的命令需要额外信息，shell\
  \ 将显示由 `PS2` 指定的次级提示符。\n\n要显示你的提示符设置，使用 `echo` 命令：\n\n![Line 1: dollar echo P S\
  \ 1. Line 2: backslash u space backslash h space backslash W dollar. Line 3.](img/9781284255805_CH06_CUM03.jpg)\n\
  \n提示符变量的格式看起来很奇怪。shell 使用特殊字符表示提示符内的元素。表 6-2 显示了你可以在提示符使用的特殊字符。\n\n表 6-2 bash shell\
  \ 字符。\n\n| 字符 | 说明 |\n| --- | --- |\n| `\\a` | 铃声字符 |\n| `\\d` | “格式日期”的日期 |\n|\
  \ `\\e` | ASCII 转义字符 |\n| `\\h` | 本地主机名 |\n| `\\H` | 完全域名主机名 |\n| `\\j` | shell\
  \ 管理的作业数 |\n| `\\l` | shell 终端设备名称的基 |\n| `\\n` | ASCII 换行符 |\n| `\\r` | ASCII 回车符\
  \ |\n| `\\s` | shell 的名称 |\n| `\\t` | 24 小制 HH:MM:SS 格式的当前时间 |\n| `\\T` | 12 小制\
  \ HH:MM:SS 格式的当前时间 |\n| `\\@` | 12 小制 am/pm 格式的当前时间 |\n| `\\u` | 当前用户的用户名 |\n| `\\\
  v` | bash shell 版本 |\n| `\\V` | bash shell 的发行级别 |\n| `\\w` | 当前工作目录 |\n| `\\W`\
  \ | 当前工作目录的基 |\n| `\\!` | 该命令的 bash 历史编号 |\n| `\\#` | 该命令的数量 |\n| `\\$` | 普通用户为美元符号，root\
  \ 用户为井号 |\n| `\\nnn` | 与八进制值 nnn 对应的字符 |\n| `\\\\` | 反斜杠 |\n| `\\[` | 开始控制代码序列 |\n\
  | `\\]` | 结束控制代码序列 |\n\n\n\n\n注意，所有的特殊提示符字符都以反斜杠 (`\\`) 开头。这用于区分提示符中的提示符字符与普通文本。在之前的示例中，提示符同时包含了提示符字符和普通字符（“@”符号和方括号）。你可以在提示符中创建任何提示符字符组合。要创建一个新的提示符，只需为\
  \ `PS1` 变量分配一个新字符串：\n\n![给 P S 1 变量分配了一个新字符串。](img/9781284255805_CH06_CUM04.jpg)\n\
  \n描述\n\n这个新的 shell 提示符现在显示当前时间以及用户名。新的 `PS1` 定义仅在当前 shell 会话期间有效。当你启动一个新的 shell\
  \ 时，默认的 shell 提示符定义会被重新加载。要使更改永久生效，你可以将 `PS1` 赋值放在主目录下的 `.bashrc` 文件中。\n\n## 访问命令行\n\
  \n在 Linux 早期，访问系统的唯一方法是通过硬连接的文本终端，称为控制台（console）。与 Linux 系统的所有交互都必须通过控制台设备进行。这不仅与\
  \ Linux 系统交互的唯一方法，也是系统显示任何系统错误的唯一方法。\n\n现代 Linux 系统使用虚拟终端和终端模拟器与用户及管理员进行交互。本节描述了进入\
  \ Linux 系统 CLI 的两种方法。\n\n### 使用虚拟终端\n\n在在现代 Linux 系统中，当 Linux 系统启动时，会自动创建几个虚拟终端，也称为虚拟控制台（virtual\
  \ consoles）。虚拟终端是运行在 Linux 系统内存中的 CLI 会话。与其在计算机上连接多个哑终端（dumb terminals），不如大多数 Linux\
  \ 发行版会启动七个（有时更多）虚拟终端，你可以通过单个键盘和显示器访问它们。\n\n在大多数 Linux 发行版中，你可以使用简单的按键组合访问虚拟终端。通常，你必须按住\
  \ `Alt` 键或 `Ctrl+Alt` 组合键，然后按下要使用的虚拟终端会话对应的功能键（`F1` 到 `F8`）。功能键 `F1` 生成虚拟终端 1，键\
  \ `F2` 生成虚拟终端 2，依此类推。图 6-1 显示了 Rocky Linux 发行版中虚拟终端。\n\n![截图显示了 Rocky Linux 在虚拟终端\
  \ 1 中的全屏文本登录。](img/9781284255805_CH06_FIGF01.jpg)\n\n图 6-1 Rocky Linux 在虚拟终端 1 中的全屏文本登录。\n\
  \n由 Rocky Enterprise Software Foundation 提供。\n\n描述\n\n虚拟终端提示你输入用户账户和密码。使用用户 ID 和密码登录后，你将带到\
  \ Linux bash shell CLI。在 Linux 虚拟终端中，你没有直接运行任何图形化程序的能力。你只能运行在 Linux 文本控制台上显示输出的文本程序。\n\
  \n登录虚拟终端后，你可以切换到另一个虚拟终端会话而不会丢失现有的活动会话。你可以在所有虚拟终端之间切换，同时运行多个活动会话。\n\n对于 Linux 服务器系统，你可用的只有面向文本的虚拟终端控制台会话。然而，对于\
  \ Linux 桌面发行版，通常第一个或最后一个虚拟终端被留给 X Window 图形桌面。你可能需要通过尝试 `Ctrl+Alt+F1` 和 `Ctrl+Alt+F7`\
  \ 来测试哪个虚拟终端运行着你特定 Linux 系统上的图形桌面。\n\n大多数发行版在启动序列完成后会自动切换到其中一个图形虚拟控制台，提供完整的图形化登录和桌面体验。\n\
  \n如果你登录到桌面虚拟终端并想切换到图形桌面，通常可以运行 `startx` 命令来启动 X Window 系统和图形桌面环境。不过，登录到文本虚拟终端会话然后切换到图形会话可能会很无味。\n\
  \n幸运的是，在 Linux 系统上在图形和文本模式之间跳转有更好的方法。终端模拟包是在图形桌面会话内部访问 shell CLI 的流行方式。\n\n### 终端模拟\n\
  \n终端模拟包在图形桌面环境的窗口内提供了一个 CLI。你不需要切换到单独虚拟终端即可访问 CLI。终端模拟包在窗口内模拟控制台操作，允许你使用键盘向 CLI\
  \ 输入数据并在窗口中显示 CLI 的输出。\n\nLinux 中使用了三种基本的终端模拟包：\n\n* `xterm`\n* `Konsole`\n* `GNOME\
  \ Terminal`\n\n`Konsole` 包专门为 KDE 桌面环境创建，而 `GNOME Terminal` 包（显然）是为 GNOME 桌面环境创建的。`xterm`\
  \ 包是一个通用包，功能没有另外两个多，但对于设计用于在旧硬件运行的 Linux 发行版（如 LUbuntu）流行。\n\n在 Rocky Linux GNOME\
  \ 桌面中，你可以通过选择系统应用程序区域的菜单项启动 `GNOME Terminal` 程序。在 Ubuntu 中，要启动 `GNOME Terminal`，你需要使用\
  \ Dash 界面按名称搜索它。一旦启动 Terminal，你可以右键点击它并将其添加到左侧的启动器（Launcher）中以便访问。\n\n图 6-2 显示了\
  \ Ubuntu 桌面上的 GNOME Terminal 程序。\n\n![截图显示 Ubuntu 桌面上的 Terminal 程序。](img/9781284255805_CH06_FIGF02.jpg)\n\
  \n图 6-2 Ubuntu 桌面上的 Terminal 程序。\n\n由 Canonical Ltd. 提供。\n\n描述\n\n## Shell 基础\n\n\
  现在你已经了解了什么是 shell 以及如何与其交互，让我们来看一些 shell 的功能。本节将介绍大多数 Linux shell 提供的某些功能。\n\n###\
  \ 命令\n\n如前所述，Linux shell 允许你执行两种功能——运行内置命令和启动外部程序。你能够启动的外部程序必须从 Linux 系统访问——要么直接安装在硬盘或可移动介质上，要么在网络共享驱动器可用。\n\
  \n如果你对某个程序有疑问，可以使用 `type` shell 内置程序。`type` 程序为命令或应用程序提供快速信息，例如它是否为 shell 内置命令或外部程序：\n\
  \n![行 1：dollar type c d。行 2：c d 是 shell 内置。行 3：dollar。](img/9781284255505_CH06_CUM05.jpg)\n\
  \n这是一个获取文件基本信息的方便方法。\n\n\n\n\n\n如果你启动了一个基于文本的应用程序，启动程序的虚拟终端将成为与程序交互的界面。程序的输出显示在虚拟终端显示器上，而程序的输入则从键盘获取。这些被称为\
  \ shell 的标准输出和标准输入。你可以从不同的虚拟终端运行多个程序，每个程序都使用各自虚拟终端的输入和输出。稍后你将看到如何使用其他源重定向输入和输出，这在后台模式运行程序时会非常有用。\n\
  \n你可以从命令行界面（CLI）启动图形化应用程序，但结果取决于 CLI 是如何启动的。当你启动图形化应用程序时，它会寻找一个运行所需的图形桌面环境。在文本模式控制台环境中，没有可用的图形桌面环境，因此通常程序会终止并报错。如果你在图形桌面内部使用终端模拟器包，你启动的图形化程序将出现在图形桌面中，就像你直接从桌面启动它一样。\n\
  \n### 获取帮助\n\nLinux shell 提供了几层帮助来让你的操作变得更简单。第一层是 `help` 命令。`help` 命令显示有关内置 shell\
  \ 命令的信息。你可以通过在命令提示符处输入 `help` 本身来获取你的 shell 中可用的内置命令列表，如图 6-3 所示。\n\n![输出显示了使用 help\
  \ 命令列出的可用内置命令。](img/9781284255805_CH06_FIGF03.jpg)\n\n图 6-3 help 命令的输出。\n\n描述\n\n\
  你可以通过在 CLI 中的 `help` 命令后输入命令名称来获取特定内置命令的帮助：\n\n![帮助空格 c p.](img/9781284255805_CH06_CUM06.jpg)\n\
  \n下一层帮助是 man 程序。`man` 程序显示由应用程序开发者提供的内置文档，只要这些文档安装在你的 Linux 系统上即可。man 页（帮助页）有一种官方格式，可以帮助你快速找到要找的信息。man\
  \ 页的内容被分为不同的标题。虽然定义了一些标准标题，但并没有要求每个 man 页都包含所有标题中的信息。你可能会在 man 页中看到这些常见标题之一：\n\n\
  *   Name（名称）——提供程序名称以及它可能具有任何别名\n*   Synopsis（概要）——对程序的功能进行简要回顾\n*   Description（描述）——对程序的工作原理提供更详细解释\n\
  *   Options（选项）——描述任何可命令行选项\n*   Arguments（参数）——描述所需的任何选项参数\n*   Files（文件）——出程序所需的文件，包括配置文件\n\
  *   Examples（示例）——显示如何使用程序的示例\n*   See Also（另请）——引用类似的程序\n*   History（历史）——提供关于程序创建时间和不同版本的详细信息\n\
  *   Copyright（版权）——列出程序的版权状态\n*   Bugs（缺陷）——列出任何已知缺陷\n\nman 页还组织成独立的章节，编号从 1 到 8。每个章节存储不同类型程序的\
  \ man 页。需要了解的主要章节有第 1 部分（存储用户级程序页）、第 2 部分（系统调用）、第 3 部分（库函数）和第 8 部分（管理员级程序页）。要指定章节，只需在\
  \ `man` 命令中列出它即可：\n\n![美元空格 man 空格 1 空格 grep.](img/9781284255805_CH06_CUM07.jpg)\n\
  \n与 `man` 命令相关的命令是 apropos。这个很有特色的命令会在所有 man 页中查找指定的术语，并返回引用该术语的 man 页。\n\n提供的第三层帮助是\
  \ info 程序。`info` 程序是 `man` 程序的替代品，并具有高级功能，例如链接页面。它以树形结构显示信息，允许你浏览信息树中的不同分支。每篇文章都可以包含指向其他命令相关\
  \ info 页的链接，类似于浏览网页。info 页的实现速度较慢，因此你可能在某些应用程序的 info 页中找不到任何信息。图 6-4 显示了 Linux `grep`\
  \ 命令的 info 页示例。\n\n![截图显示了 Linux grep 命令的 info 页。](img/9781284255805_CH06_FIGF04.jpg)\n\
  \n图 6-4 Linux grep 命令的 info 页。\n\n描述\n\n### Shell 功能\n\nshell 内置的一些功能可以帮助命令操作。其中是\
  \ history。`history` 文件记录了你输入的命令。你可以使用方向键从历史中恢复、修改和使用命令。向上方向键检索最近一次使用的命令。再次按向上方向键检索倒数第二个命令。如果你继续按向上方向键，shell\
  \ 会继续从历史中检索命令。同样，你可以使用向下方向键回溯历史。\n\n一旦你输入或从历史中检索了命令，可以使用多种组合键来修改命令。bash 中提供了许多编辑命令；表\
  \ 6-3 显示了常用的命令：\n\n表 6-3 Shell 编辑命令。\n\n| 命令 | 描述 |\n| --- | --- |\n| 左箭头 | 光标向左移动命令文本\
  \ |\n| 右箭头 | 光标向右移动命令文本 |\n| Ctrl+a | 光标移动到命令文本开头 |\n| Ctrl+e | 光标标到命令文本的末尾 |\n\
  | Delete | 删除光标处的字符 |\n| Backspace | 删除光标前的字符 |\n| Ctrl+t | 交换两个字符 |\n| Ctrl+k |\
  \ 将光标位置到命令末尾的字符删除到缓冲区 |\n| Ctrl+y | 将缓冲区中的字符取回命令文本 |\n\n如果你知道命令在历史中的位置，也可以使用 `history`\
  \ 命令直接跳转到特定的先输入命令。只需在 `history` 命令后指定命令位置。例如，要检索三个命令前运行的，使用：\n\n```\nhistory 3\n\
  ```\n\n![美元空格 history 空格 3.](img/9781284255805_CH06_CUM08.jpg)\n\n最后，命令补全](#9781284254884_Glossary.xhtml_GLOS-48)是另一个实用的\
  \ shell 功能。它搜索与你在命令提示符界面输入的文本匹配的命令。例如，如果你不确定命令或程序的拼写，可以输入几个字母然后按 Tab 键。shell 会搜索匹配的命令和程序并显示它们，允许你选择要使用的命令。\n\
  \n### 运行多个命令\n\nLinux 命令行一个令人兴奋的功能是，你可以在同一行输入多个命令，Linux 将处理所有命令！只需在输入的每个命令之间放置分号即可：\n\
  \n![分号被输入多个命令之间。](img/9781284255805_CH06_CUM09.jpg)\n\n\n\n\nLinux shell 会运行第一个命令（`date`）并显示输出，然后运行第二个命令（`who`）并显示该命令的输出，紧接在第一个命令的输出之后。虽然这看起来可能微不足道，但这就是\
  \ shell 脚本的工作原理，而且它可以是一个非常强大的工具！\n\n## 重定向输入和输出\n\n有时，你可能想保存命令的输出，而不仅仅将其显示在显示器上。shell\
  \ 提供了几个不同的运算符，允许你将命令的输出重定向到另一个位置（例如文件）。重定向既可以用于输入，也可以用于输出，将文件重定向到命令作为输入。本节描述了在 CLI\
  \ 中使用重定向时需要的内容。\n\n### 输出重定向\n\n重定向最基本的类型是将命令的输出重定向到文件中；这被称为输出重定向。`Bash` 使用大于符号来实现此操作：\n\
  \n![命令 空格大于 空格 输出文件。](img/9781284255805_CH06_CUM10.jpg)\n\n原本本会在显示器上显示的任何内容现在都存储在指定的输出文件中：\n\
  \n![命令的输出存储在指定的输出文件中。](img/9781284255805_CH06_CUM11.jpg)\n\n描述\n\n重定向运算符创建了文件 `test1`，并将\
  \ `date` 命令的输出重定向到该文件。如果输出文件已存在，重定向运算符将用新文件数据覆盖现有文件：\n\n![重定向运算符用新文件数据覆盖现有文件。](img/9781284255805_CH06_CUM12.jpg)\n\
  \n描述\n\n现在`test1` 文件的内容包含了 `who` 命令的输出。\n\n有时，你可能需要将命令的输出追加到现有文件中，而不是覆盖文件内容，例如，如果你正在创建一个日志文件来记录系统上的操作。在这种情况下，你可以使用双大于符号（`>>`）来追加数据：\n\
  \n![代码显示了双大于符号追加数据的用法。](img/9781284255805_CH06_CUM13.jpg)\n\n描述\n\n`test2` 文件仍然包含早先处理的\
  \ `who` 命令的原始数据，现在它还包含了 `date` 命令的新输出。\n\n### 输入重定向\n\n输入重定向 是输出重定向的相反。输入重定向不是获取命令的输出并将其重定向到文件，而是获取文件的内容并将其重定向到命令。\n\
  \n输入重定向符号是小于符号（`<`）：\n\n![命令 空格小于 空格 输入文件。](img/9781284255805_CH06_CUM14.jpg)\n\n\
  容易记住它的方法是，命令在命令行中总是第一个出的，而重定向符号“指向”数据流向。小于符号表示数据从输入文件流向命令。\n\n这是一个使用 `wc` 命令进行输入重定向的示例：\n\
  \n![第 1 行：美元 空格 w c 空格小于 空格 test 2\\。第 2 行：双缩进，2 空格 11 空格 75。第 3 行：美元。](img/9781284255805_CH06_CUM15.jpg)\n\
  \n`wc` 命令提供数据中文本的计数。默认情况下，它产生三个值：\n\n*   文本中的行数\n*   文本中的单词数\n*   文本中的字节数\n\n通过将文本文件重定向到\
  \ `wc` 命令，你可以快速统计文件中行、单词和字节的数量。示例显示 `test2` 文件中有 2 行、11 个单词和 75 个字节。\n\n还有另一种输入重定向方法，称为内联输入重定向。这种方法允许你在命令行上指定用于输入重定向的数据，而不是在文件中。起初看起来可能有些奇怪，但此过程有一些应用场景，例如提供交互式脚本。\n\
  \n内联输入重定向符号是双小于符号（`<<`）。除了此符号外，你必须指定一个文本标记来界定用于输入的数据的开始和结束。可以使用任何字符串值作为文本标记，但在数据的开头和结尾必须相同：\n\
  \n![第 1 行：命令 空格双小于 空格 标记。第 2 行：数据。第 3 行：标记。](img/9781284255805_CH06_CUM16.jpg)\n\
  \n```\nwc << marker\ndata\nmarker\n```\n\n### 管道\n\n有时你需要将一个命令的输出重定向到另一个命令，而不是文件。这种过程被称为管道。管道符号是竖线运算符（`|`）：\n\
  \n![命令 1 空格竖线 空格 命令 2。](img/9781284255805_CH06_CUM19.jpg)\n\n管道提供了一种链接命令以提供更多输出的方法。不要把管道认为是接接运行两个命令。Linux\
  \ 系统实际上同时运行这两个命令，并在系统内部将它们链接。当第一个命令产生输出时，它会被发送到第二个命令。不需要使用中间文件或缓冲区来传输数据。\n\n现在，通过管道，你可以轻松地将\
  \ `rpm` 命令的输出直接重定向到 `sort` 命令产生结果：\n\n![rpm 命令的输出直接重定向到 sort 命令。](img/9781284255805_CH06_CUM20.jpg)\n\
  \n\n\n\n在命令中使用的管道符（pipes）数量是没有限制的（受行长度 255 个字符的限制）。你可以继续将命令的输出传递到其他命令，以精炼你的操作。\n\
  \n在这种情况下，由于 `sort` 命令的输出速度极快，我们可以使用文本分页命令之一（例如 `less` 或 `more`）来强制输出在每页数据结束处停止：\n\
  \n![Dollar space r p m space hyphen q a space vertical bar space sort space vertical\
  \ bar space more.](img/9781284255805_CH06_CUM22.jpg)\n\n此命令序列运行 `rpm` 命令，将输出传递给\
  \ `sort` 命令，然后将该输出再次传递给 `more` 命令以显示数据，并在每显示一屏信息后停止。这现在允许你能够在继续操作之前暂停并阅读显示器上的内容。\n\
  \n为了进行更高级的操作，你可以将重定向与管道结合使用，将输出保存到文件中：\n\n![Codes use redirection along with piping\
  \ to save the output.](img/9781284255805_CH06_CUM23.jpg)\n\n描述\n\n如所预期，`rpm.list`\
  \ 文件中的数据现在已经排序了！\n\n## Linux 环境变量\n\nshell 使用一种称为环境变量的功能来存储关于 shell 会话和工作环境的信息（因此被称为环境变量）。此功能还允许你在内存中存储数据，任何从\
  \ shell 运行的程序或脚本都可以轻松访问这些数据。这是一种存储持久数据的方便方法，可用于标识用户账户、系统、shell 或你在登录会话期间需要存储的任何内容的特征。\n\
  \n在 `bash` shell 中有两种类型的环境变量：\n\n* 全局变量\n* 局部变量\n\n本节描述了每种类型的环境变量变量，并展示了如何查看和使用它们。\n\
  \n### 全局环境变量\n\n全局环境变量 在 shell 会话以及 shell 派生的任何子进程中可见。局部变量仅在创建它的 shell 中可用。这使得全局环境变量在需要从父进程获取信息的子进程应用程序中非常有用。\n\
  \n当你启动 `bash` 会话时，Linux 系统会设置几个全局环境变量。系统环境变量始终使用全大写字母，以区别于普通的用户环境变量。\n\n要查看全局环境变量，使用\
  \ `printenv` 命令：\n\n![An output shows the global environment variables using the\
  \ print e n v command.](img/9781284255805_CH06_CUM24.jpg)\n\n描述\n\n![延续](img/9781284255805_CH06_CUM25.jpg)\n\
  \n描述\n\n如你所见，shell 中设置了许多全局环境变量。其中大多数是由系统在登录过程中设置的。\n\n要显示单个环境变量的值，使用 `echo` 命令。在引用环境变量时，必须在环境变量名称之前放置美元符号：\n\
  \n![Line 1: dollar space echo space dollar HOME. Line 2: slash home slash rich.\
  \ Line 3: dollar.](img/9781284255805_CH06_CUM26.jpg)\n\n如所述，全局环境变量在当前 shell 会话下运行的子进程也可用：\n\
  \n![Line 1: dollar space bash. Line 2: dollar space echo space dollar HOME. Line\
  \ 3: slash home slash rich. Line 4: dollar.](img/9781284255805_CH06_CUM27.jpg)\n\
  \n在这个示例中，在使用 `bash` 命令启动新 shell 后，使用 `echo` 命令显示 `HOME` 环境变量的当前值，该值是在我登录主 shell\
  \ 时由系统设置的。示例所示，该值在子 shell 进程中也可用。\n\n### 局部环境变量\n\n局部环境变量 仅在定义它们的局部进程中可见。但不要对局部环境变量感到困惑，它们与全局环境变量一样重要。事实上，Linux\
  \ 系统默认也会为你定义标准的局部环境变量。\n\n尝试查看局部环境变量列表有点棘手。遗憾的是，没有一个命令可以只显示局部环境变量。`set` 命令显示为特定进程设置的所有环境变量，包括全局环境变量。这会产生一个非常长的列表（长到无法在此处显示）。\n\
  \n当你运行 `set` 命令时，注意有几个与 `bash` 相关的条目在 `printenv` 命令生成的全局列表中是不会出现的：\n\n![An output\
  \ shows a list of environment variables.](img/9781284255805_CH06_CUM28.jpg)\n\n\
  描述\n\n这些是 shell 的环境变量特征。\n\n### 设置环境变量\n\n除了系统创建的环境变量，你还可以创建自己的环境变量。本节展示了如何操作。\n\
  \n#### 设置局部环境变量\n\n一旦启动 bash shell，就可以使用等号为环境变量赋值数值或字符串值：\n\n![Line 1: dollar space\
  \ test equals testing. Line 2: dollar space echo space dollar test. Line 3: dollar.](img/9781284255805_CH06_CUM29.jpg)\n\
  \n一旦为环境变量赋值，你可以在 shell 中的任何地方引用它。\n\n如果你需要分配包含空格的字符串值，你需要使用单引号来界定字符串的开始和结束：\n\n\
  ![Codes use single quotation mark to save the output.](img/9781284255805_CH06_CUM30.jpg)\n\
  \n描述\n\n如果没有单引号，shell 会认为下一个字符是另一个命令。注意我们定义的局部环境变量使用了小写字母，而我们目前看到的系统环境变量使用了大写字母。\n\
  \n这是 bash 中的标准约定。如果你创建新的环境变量，建议（但强制）使用小写字母。这有助于区分你的个人环境变量和系统环境变量。\n\n一旦你设置了局部环境变量，它在你\
  \ shell 进程的任何地方可用。但是，如果你派生另一个 shell，它在子 shell 中是不可用的：\n\n![Line 1: dollar space\
  \ test 2 equals test. Line 2: hyphen bash colon test 2 colon. Line 3: command not\
  \ found. Line 4: dollar.](img/9781284255805_CH06_CUM31.jpg)\n\n此示例使用 `bash` 命令启动了子\
  \ shell。`test` 环境变量在子 shell 中无效（它为空值）。退出子 shell 并返回原始 shell 后，局部环境变量是可用的。\n\n同样，如果你在子进程中设置了局部环境变量，一旦你离开子进程，该局部环境变量不再可用：\n\
  \n![The test environment variable is set in the child shell.](img/9781284255805_CH06_CUM32.jpg)\n\
  \n描述\n\n在子 shell 中设置的 test 环境变量在父 shell 中不存在。\n\n\n\n\n\n## 设置全局环境变量\n\n全局环境变量对于设置该变量的进程所创建的任何子进程都是可见的。创建全局环境变量的方法是先创建一个本地环境变量，然后将其\
  \ `export` 导出到全局环境中。\n\n这是通过使用 `export` 命令实现的：\n\n![代码显示了 export 命令的用法。(images/9781284255805_CH06_CUM33.jpg)描述在导出本地环境变量\
  \ `test` 之后，一个子 shell 进程处理并查看了 `test` 环境变量的值。这次，环境变量保留了它的值，因为 `export` 命令将其变为全局变量。##\
  \ 删除环境变量当然，如果你能创建一个新的环境变量，那么删除现有的环境变量也是理所当然的。这是通过使用 `unset` 命令实现的：![第 1 行：$ 空格 echo\
  \ 空格 $ test。第 2 行：testing。第 3 行：$ 空格 unset 空格 test。第 4 行：$ 空格 echo 空格 $ test。第 5\
  \ 行：$。](img/9781284255805_CH06_CUM34.jpg)\n\n在 `unset` 命令中引用环境变量时，记住不要使用美元符号。\n\n\
  在处理全局环境变量时，情况可能会变得有点复杂。如果你在一个子进程中删除一个全局环境变量，它只作用于该子进程。全局环境变量在父进程中仍然可用：\n\n![代码显示全局环境变量在父进程中仍然可用。(images/9781284255805_CH06_CUM35.jpg)描述这个示例设置了一个名为\
  \ `test` 的本地环境变量，然后将其导出以成为全局环境变量。接着，它启动了一个子 shell 进程并检查全局环境变量 `test` 是否仍然可用。接下来，在子子\
  \ shell 中，它使用 `unset` 命令删除全局环境变量 `test`，然后退出子 shell。现在回到原始的父 shell，它检查了 `test` 环境变量的值，该值仍然有效。##\
  \ 编写 Shell 脚本通过使用分号或管道将多个命令放在单行上是处理数据的极佳方法，但这可能仍然变得相当繁琐。每当你想要运行一组命令时，你都需要在命令行提示符输入所有命令。然而，Linux\
  \ 也允许我们将多个命令放在一个文本文件中，然后从命令行将该文件作为程序运行。这被称为 shell 脚本，因为我们正在为 Linux shell 编写运行命令的脚本。Shell\
  \ 脚本文件是纯文本文件。要创建一个 shell 脚本文件，你只需要使用任何你熟悉的文本编辑器即可。如果你在基于 KDE 的图形桌面上工作，可以使用 `KWrite`\
  \ 或 `Kate` 程序；或者如果你使用基于 GNOME 的桌面，可以使用 `Gedit` 程序。如果你直接在命令行环境中工作，你仍然有一些选择。许多 Linux\
  \ 发行版都包含了 `pico` 或 `nano` 文本编辑器，它们提供了一个类图形化的文本编辑环境，使用 ASCII 控制字符来创建一个全屏窗口。如果你的 Linux\
  \ 发行版没有包含这些程序之一，还有最后的最后的手段——`vi` 编辑器。`vi` 编辑器是一个基于文本的编辑器，使用简单的单字母命令。它是 Linux 环境中最古老的编辑器，并不非常用户友好。一旦你选择了你的文本编辑器，就可以准备好创建\
  \ shell 脚本了。本节将介绍如何做的这些基础知识。### 入门 shell 脚本文件的第一行标识该文件为 shell 脚本。它告诉 Linux 使用哪种\
  \ shell 来处理 shell 脚本中包含的命令：![井号感叹斜杠 bin 斜杠 bash。(images/9781284255805_CH06_CUM36.jpg)井号和感叹符号的组合（`#!）通常被称为\
  \ shebang。它向操作系统指示使用哪种 shell 来运行 shell 脚本。大多数 Linux 发行版支持多个 Linux shell，但最常见的是 `bash`\
  \ shell。只要 Linux 发行版上安装了该 shell，你就可以运行为其他 shell 编写的 shell 脚本。指定 shell 后，你就可以开始在脚本中列出命令了。你不需要将所有命令都放在同一行；Linux\
  \ 允许将它们放在不同的行上。此外，Linux shell 假设每一行都是 shell 脚本中的新命令，因此你不需要使用分号来分隔命令。这里有一个简单的 shell\
  \ 脚本文件示例。![第 1 行：$ 空格 cat 空格 script 1.sh。第 2 行：井号感叹斜杠 bin 斜杠 bash。第 3 行：# 这此脚本显示日期和登录用户。第\
  \ 4 行：date。第 5 行：who。第 6 行：$。](img/9781284255805_CH06_CUM37.jpg)\n\n`script1.sh`\
  \ 脚本文件以 shebang 行开头，标识 Linux 中的标准 shell —— `bash`。代码的第二行演示了 shell 脚本的另一个功能。以井号开头的行被称为注释行。它们允许你在\
  \ shell 脚本中嵌入注释，帮助你记住代码的作用。shell 在处理脚本时会跳过注释行。你可以将注释行放在脚本的任何位置，shebang 行之后。\n\n\
  保存新的 shell 脚本文件后，你想运行它。然而，在此之前你需要采取一步。默认情况下，文本文件没有标记为程序文件，因此 shell 无法运行它们。要解决这个问题，你需要使用\
  \ `chmod` 命令：\n\n![chmod 空格 x script 1.sh。(images/9781284255805_CH06_CUM38.jpg)这种命令格式在你读过第\
  \ 10 章“Linux 服务器管理”（该章节介绍了可以为文件设置的不同权限）后会理解得多。基本上，此命令为文件所有者添加了执行（运行）权限。现在你可以从命令行运行该命令了：![从命令行运行。(images/9781284255805_CH06_CUM39.jpg)描述符号\
  \ `./` 是必须的，因为脚本所在的当前目录没有包含在 `PATH` 环境变量中。它告诉 shell 在当前目录查找文件。### 显示消息当 shell 脚本文件中组合命令时，输出看起来可能有些混乱。通过分离输出并添加自己的文本来自定义输出会有帮助。`echo`\
  \ 命令允许你从命令行显示文本消息。在命令行使用时，它并不有趣：![第 1 行：$ 空格 echo This is a test。第 2 行：This is a\
  \ test。第 3 行：$。](img/9781284255805_CH06_CUM40.jpg)\n\n但现在你可以在 shell 脚本输出的任何地方插入消息。只需通过添加几个\
  \ `echo` 命令来修改 `test1.sh` shell 脚本程序：\n\n![test1.sh shell 脚本程序通过添加几个 echo 命令修改。(images/9781284255805_CH06_CUM41.jpg)\n\
  \n描述\n\n现在运行脚本时，你应该看到以下输出：\n\n![输出显示了运行脚本的结果。(images/9781284255805_CH06_CUM42.jpg)\n\
  \n描述\n\n\n\n\n\n你创建的 shell 脚本为 `script1.sh` 脚本添加了三个 `echo` 命令。注意，第一个 `echo` 命令没有使用任何引号，但第三个使用了。之所以这样做，是因为第三个\
  \ `echo` 命令的文本输出包含了单引号。单引号在 shell 中也是一个元字符，它会混淆 `echo` 命令，因此你需要在文本周围加上双引号。另外请注意，第二个\
  \ `echo` 命令在行上没有任何文本。它会输出一个空行，这在你需要将多个命令的输出隔离开时非常有用。\n\n### 使用变量\n\nShell 脚本还可以利用\
  \ shell 中设置的全局和局部环境变量。只需记住在脚本中引用环境变量时，在变量名前前面加上美元符号 `$` 即可：\n\n![在脚本中将美元符号放在环境变量名字前面。](img/9781284255805_CH06_CUM43.jpg)\n\
  \n描述\n\n`$USER`、`$UID` 和 `$HOME` 环境变量通常用于显示有关登录用户的信息。当你运行 shell 脚本时，你应该能看到与运行脚本的用户的相关信息：\n\
  \n![输出显示运行 shell 脚本的结果。](img/9781284255805_CH06_CUM44.jpg)\n\n描述\n\n你看到的值应该与你的账户有关。这允许你动态地获取运行\
  \ shell 脚本的用户账户信息以自定义输出。\n\n你还可以在 shell 脚本内部设置局部环境变量：\n\n![在 shell 脚本内部设置局部环境变量。(images/9781284255805_CH06_CUM45.jpg)描述运行\
  \ `script3.sh` 脚本会产生以下输出：![第 1 行：美元 空格 c h mod 空格 u + x 空格 script 3 dot s h。第 2\
  \ 行：美元 空格 点斜杠 script 3 dot s h。第 3 行：Rich checked in 10 days ago。第 4 行：美元。](img/9781284255805_CH06_CUM46.jpg)\n\
  \n一旦你将数据存储在用户变量中，你就可以在 shell 脚本任何地方引用它！\n\n### 命令行参数\n\nshell 脚本最灵活的功能之一是在运行它时将数据传递给脚本。这允许你每次运行脚本时使用新数据对脚本进行自定义。\n\
  \n向 shell 脚本传递数据的方法之一是使用命令行参数。命令行参数是你在运行命令时在命令行中包含的数据。只需在命令后列出这些参数，并用空格分隔每个数据值，格式如下：\n\
  \n![命令 空格 参数 1 空格 参数 2 空格 省号。](img/9781284255805_CH06_CUM47.jpg)\n\n你在 shell 脚本代码中使用特殊的数字位置变量来获取这些值。使用变量\
  \ `$1` 获取第一个命令行参数，使用 `$2` 获取第二个参数，以此此类推。这个示例展示了如何在 shell 脚本中使用位置变量：\n\n![示例展示了如何在\
  \ shell 脚本中使用位置变量。](img/9781284255805_CH06_CUM48.jpg)\n\n描述\n\n`script4.sh` shell\
  \ 脚本使用了两个命令行参数。`$1` 存储人的名字，`$2` 存储他们签到前的天数。当你运行 `script4.sh` shell 脚本时，请确保在命令行中包含这两个数据值。如果位置变量不存在，shell\
  \ 不产生错误信息；你只是不会得到预期的结果：\n\n![第 1 行：美元 空格 点斜杠 script 4 dot s h 空格 rich。第 2 行：rich\
  \ checked in days ago。第 3 行：美元。](img/9781284255805_CH06_CUM49.jpg)\n\n在程序代码中检查位置变量是否存在取决于你的决定。\n\
  \n### 命令替换\n\nshell 脚本最实用的功能可能可能是存储和处理数据。到目前为止，我讨论了如何使用输出重定向将命令的输出存储到文件中，以及如何使用管道将一个命令的输出重定向到另一个命令。然而，还有另一种技术可以让你在脚本存储和使用数据时更具活性。\n\
  \n命令替换允许你将命令的输出赋值给 shell 脚本中的局部变量。一旦输出存储在变量中，你就可以标准的 Linux 字符串处理命令（如 `sort`）在显示之前对其进行处理。\n\
  \n要将命令的输出重定向到变量，你需要使用两种命令替换格式之一：\n\n- 在命令周围使用反引号（`` ` ``）\n- 在 `$()` 函数中使用命令\n\n\
  这两种方法产生相同的结果——将命令的输出重定向到用户变量。这里有一个示例演示了如何使用这两种方法：\n\n![示例展示了如何在 shell 脚本中使用变量](img/9781284255805_CH06_CUM50.jpg)\n\
