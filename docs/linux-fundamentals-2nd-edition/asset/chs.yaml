  \ 文件系统一样，在 `/mnt/mydata` 目录下创建、修改和删除文件及目录。\n\n要关闭加密分区使其无法访问，请使用 `luksClose` 命令选项：\n\
  \n![使用 luks Close 命令选项关闭加密分区使其无法访问。](img/9781284255805_CH11_CUM42.jpg)\n\n描述\n\n\
  当你关闭加密分区时，Linux 会将其从 `/dev/mapper` 目录中移除，使其无法访问。要再次挂载该分区，你需要在 `cryptsetup` 命令中使用\
  \ `luksOpen` 并提供密码。\n\n# 使用防火墙进行网络安全\n\n防火墙软件帮助保护你的 Linux 服务器免受不受授权的网络访问。它们使用访问控制列表（ACL）来定义哪些网络连接是允许的，哪些应该被拦截。\n\
  \nLinux 中用于创建和维护防火墙 ACL 的核心系统是 `iptables`。通过 `iptables`，你可以定义规则链，内核将遵循这些规则来判断是否允许或拒绝入站或出站数据包。然而，在\
  \ `iptables` 中定义规则可能有些复杂，因为它使用了一种相当晦涩的方法来定义主机和端口。为了方便管理员，几个不同的 Linux 防火墙程序使用了易读的命令来创建内核允许或拒绝数据包所需的规则。其中最流行的两个似乎是：\n\
  \n*   `firewalld`——默认预安装在基于 Red Hat 的发行版中\n*   `ufw`——安装在 Ubuntu 发行版中但未激活\n\n在运行\
  \ Linux 服务器时，防火墙保护尤为重要。你需要能够阻止恶意入侵者访问服务器应用程序，同时允许客户自由访问。本节介绍了 `firewalld` 程序，并展示了如何使用它来提供帮助。\n\
  \n## Red Hat 防火墙概念\n\n`firewalld`get 使用“区域”（zones）的概念来定义 Red Hat 服务器上网络接口的保护。区域定义了接口连接的网络类型，以及应该允许或拦截什么类型的网络流量。不同类型的网络连接需要不同级别的保护。例如，参考\
  \ `图 11-1` 所示的网络。\n\n![一个框代表 Red Hat Linux 服务器，其中网络接口 A 连接到一个代表家庭网络的椭圆，网络接口 B 连接到云端（互联网）。](img/9781284255805_CH11_FIGF01.jpg)\n\
  \n图 11-1 连接到两个网络的 Linux 服务器。\n\n在 `图 11-1` 中，Linux 服务器有两个网络接口。网卡 A 连接到家庭网络，该网络包含了其他需要连接\
  \ Linux 系统的网络设备。服务器中的网卡 B 连接到互联网。你可能希望为每个网络接口定义不同的 ACL 规则：网卡 A 应该允许本地客户端连接服务器资源，例如共享文件、打印机，甚至可能建立\
  \ SSH 连接进行登录。\n\n然而，网卡 B 需要额外的安全保护，以防止潜伏在互联网上的未知攻击者访问你的服务器。由于有各种不同的网络应用程序和协议，你可以看出在系统中保持条理清晰会变得多么困难。\n\
  \n解决方案是实现基于区域的 ACL 规则。`firewalld` 程序允许你定义多个区域，并为每个区域分配一套不同的规则来控制网络访问。通常，根据网络需求，服务器上的每个网络接口被分配到一个特定的区域。`firewalld`\
  \ 程序会将区域规则应用到网络接口。\n\n默认情况下，Red Hat 服务器定义了十个区域。你可以使用 `firewall-cmd` 命令列出当前定义的区域：\n\
  \n![第 1 行：美元符号 空 firewall hyphen c m d 空格双横线 get hyphen zones。第 2 行：block d m z\
  \ drop external home internal n m hyphen shared public trusted work。第 3 行：美元符号。](img/9781284255805_CH11_CUM43.jpg)\n\
  \n`表 11-1` 提供了这些默认区域用途的基本描述。\n\n表 11-1 默认 firewalld 区域。\n\n| 区域 | 描述 |\n| --- |\
  \ --- |\n| block | 拒绝所有入站网络连接并发送 ICMP 禁止消息。仅允许出站网络连接。 |\n| dmz | 仅接受特定的入站连接。 |\n\
  | drop | 拒绝所有入站网络连接且不回复消息。仅允许出站网络连接。 |\n| external | 启用伪装功能以隐藏服务器真实的 IP 地址。仅接受特定的入站连接。\
  \ |\n| home | 允许特定的入站连接，但允许所有出站连接。 |\n| internal | 仅接受特定的入站连接。 |\n| nm-shared |\
  \ 特地为网络共享定义的特殊区域。 |\n| public | 用于不可信的网络，仅接受特定的入站连接。 |\n| trusted | 接受所有网络连接。 |\n\
  | work | 用于大部分可信的网络，接受连接。 |\n\n每个区域都分配有一组不同的设置规则，用于控制哪些网络流量可以进入或离开。要管理网络接口的访问，只需将其分配到一个区域即可。\n\
  \n除了区域之外，`firewalld` 还使用 ACL 规则。ACL 规则定义了哪些网络连接应该是允许的。通过 `firewalld`，你可以通过两种方法定义规则：\n\
  \n*   定义服务名\n*   定义端口\n\n通过使用服务名，你可以按应用程序（如 FTP、SSH 或 HTTP）允许或拦截连接。通过使用端口，你可以根据\
  \ TCP 或 UDP 端口号允许或拦截连接。\n\n以下章节将如何在 Red Hat 服务器中使用 `firewalld`。\n\n### 检查防火墙状态\n\
  \n虽然 `firewalld` 程序使用文本文件，但对于你大多数需要的操作，你可以使用 `firewall-cmd` 命令行。要检查 `firewalld`\
  \ 是否正在运行，只需使用 `--state` 选项：\n\n```bash\nsudo firewall-cmd --state\n```\n![显示运行状态的命令输出](img/9781284255805_CH11_CUM44.jpg)\n\
  \n你可以使用 `--get-zone-of-interface` 选项检查特定接口当前所在的区域：\n\n```bash\nsudo firewall-cmd\
  \ --get-zone-of-interface=enps8\n```\n![显示 public 的命令输出](img/9781284255805_CH11_CUM45.jpg)\n\
  \n或者如果你有多个网络网卡，可以使用 `--get-active-zones` 选项列出所有当前激活的区域：\n\n```bash\nsudo firewall-cmd\
  \ --get-active-zones\n```\n![列出激活区域的输出](img/9781284255805_CH11_CUM46.jpg)\n\n你可以通过使用\
  \ `--list-all` 选项并使用 `--zone` 选项指定区域名称来查看区域的当前配置：\n\n```bash\nsudo firewall-cmd\
  \ --list-all --zone=public\n```\n\n输出显示了该区域的功能以及哪些项目可以通过防火墙。`target`（目标）功能定义了区域的操作类型：\n\
  \n*   `default`——拒绝所有不匹配区域规则的数据包，但向客户端发送一个 ICMP 包以说明原因\n*   `ACCEPT`——接受不匹配区域规则的数据包\n\
  \n\n\n\n*   `DROP`—丢弃不匹配区域规则的数据包\n*   `%%REJECT%%`—拒绝所有不匹配区域规则的数据包\n\n源、服务、端口和协议功能根据目标设置定义了允许或阻止的规则项。在例例中，Red\
  \ Hat web cockpit 服务、DHCPv6 客户端服务和 openSSH 服务都是允许的。同样，通过 `TCP` 端口 `631`（用于打印的 CUPS\
  \ 应用程序）的流量也是允许的。\n\n### 操作区域 (Zones)\n\n除了默认区域外，你还可以创建自己的区域来帮助自定义服务器的网络环境。`firewall-cmd`\
  \ 命令的 `--new-zone` 选项用于定义区域名称：\n\n![Line 1: dollar space sudo space firewall hyphen\
  \ c m d space double hyphen permanent space double hyphen new hyphen zone equals\
  \ my test. Line 2: Success. Line 3: dollar.](img/9781284255805_CH11_CUM48.jpg)\n\
  \n需要 `--permanent` 选项才能使更改永久保存到配置文件中。在使用区域之前，你必须告诉 `firewalld` 重新加载配置文件，以便它识别新区域：\n\
  \n![Line 1: dollar space sudo space firewall hyphen c m d space double hyphen reload.\
  \ Line 2: Success. Line 3: dollar.](img/9781284255805_CH11_CUM49.jpg)\n\n然后你可以列出区域来查看新区域是否存在：\n\
  \n![An output lists the zones to see if the new zone exists.](img/9781284255805_CH11_CUM50.jpg)\n\
  \n描述\n\n一旦创建了区域，就可以使用 `--add-interface` 选项将网络接口移动到该区域：\n\n![Line 1: dollar space\
  \ sudo space firewall hyphen c m d space hyphen zone equals my test space double\
  \ hyphen add hyphen interface equals e n p 0 s 8\\. Line 2: Success. Line 3: dollar.](img/9781284255805_CH11_CUM51.jpg)\n\
  \n但要小心，因为新区域尚未应用任何 ACL 规则：\n\n![An output shows the current configuration for a\
  \ zone by using the double hyphen list hyphen all option.](img/9781284255805_CH11_CUM52.jpg)\n\
  \n描述\n\n如果你添加了当前连接到服务器的网络接口，这将导致你的连接断开，并引发问题！下一节将介绍如何向区域添加规则。\n\n### 操作防火墙规则 (Firewall\
  \ Rules)\n\nACL 规则是防火墙的核心。它们定义了网络接口允许或阻止类型的网络流量。添加或删除规则时的错误可能会代价惨昂，尤其是当你远程连接到服务器时！\n\
  \n`firewalld` 程序在定义规则方面非常健壮。你可以使用 `--add-service` 选项根据常见的应用程序服务名称来定义允许或阻止访问的规则：\n\
  \n![An output defines rules to allow or block access based on an application service\
  \ name by using the double hyphen add hyphen service option.](img/9781284255805_CH11_CUM53.jpg)\n\
  \n描述\n\n再次注意，你应该添加 `--permanent` 选项以确保新规则在系统重新加载时生效。\n\n你还可以指定 `TCP` 或 `UDP` 端口值作为规则：\n\
  \n![An output shows the addition of the double hyphen permanent option with rules\
  \ specified as T C P port values.](img/9781284255805_CH11_CUM54.jpg)\n\n描述\n\n![A\
  \ script shows commands to customize a rule to specify a specific object.](img/9781284255805_CH11_CUM55.jpg)\n\
  \n描述\n\n`firewalld` 程序还使用它所谓的“富规则”（rich rules），这些规则允许你自定义规则以指定特定对象，例如单个 IP 地址以及端口或服务：\n\
  \n![An output shows the rich rule applied to the my test zone.](img/9781284255805_CH11_CUM56.jpg)\n\
  \n描述\n\n这个富规则示例接受来自特定源地址 `192.168.1.70` 的 SSH 数据包（端口 `22`）。该命令将此富规则应用于 `mytest`\
  \ 区域。然后你可以检查规则是否已应用：\n\n![An output shows the rich rule applied to the my test zone.](img/9781284255505_CH11_CUM57.jpg)\n\
  \n描述\n\n\n\n\n接下来的章节将详细介绍云计算环境的不同组件。\n\n## 什么是云服务？\n\n云计算环境能够根据每个客户的需求，定制提供给客户的资源级别。本节描述了从云计算提供商处可以找到的最常用的资源级别提供模型。\n\
  \n### 基础设施即服务 (IaaS)\n\n在基础设施即服务 (IaaS)模型中，云计算提供商提供低级服务器资源，以为组织托管应用程序。这些低级资源包括运行物理服务器所需的所有物理组件，包括\
  \ CPU 时间、内存空间、存储空间和网络资源，如图 12-2 所示。\n\n提供的服务器资源可能位于在单台服务器上，也可能分布在几台服务器上。在分布式环境中，服务器可能共同位于一个设施内，也可能分散在位于不同城市的多个设施中。这有助于提高可用性。\n\
  \n![显示了 IaaS 云模型。](img/9781284255805_CH12_FIGF02.jpg)\n\n图 12-2 IaaS 云模型。\n\n描述\n\
  \n如图 12-2 所示，在 IaaS 模型中，客户提供操作系统以及其运行所需的任何应用程序。大多数 IaaS 环境支持多种不同的操作系统，包括 Linux、Windows\
  \ 和 macOS。客户负责操作系统所需的任何系统管理工作，以及任何应用程序管理。云计算提供商负责维护物理基础设施环境。\n\n### 软件即服务 (SaaS)\n\
  \n在软件即服务 (SaaS)模型中，云计算提供商为客户提供物理服务器环境以及操作系统环境，如图 12-3 所示。\n\n![显示了 SaaS 云模型。](img/9781284255805_CH12_FIGF03.jpg)\n\
  \n图 12-3 SaaS 云模型。\n\n描述\n\n在 SaaS 模型中，云计算提供商负责物理组件以及操作系统管理。它提供系统管理支持，以确保操作系统得到适当更新和更新，以跟当前的发布和安全功能。这允许客户主要关注运行在\
  \ SaaS 环境中的应用程序。\n\n### 平台即服务 (PaaS)\n\n在平台即服务 (PaaS)模型中，云计算提供商为软件开发和部署提供完整的计算环境。提供商提供服务器环境、操作系统以及开发和运行应用程序所需的任何编程工具和库。这在图\
  \ 12-4 所示。\n\n![显示了 PaaS 云模型。](img/9781284255805_CH12_FIGF04.jpg)\n\n图 12-4 PaaS\
  \ 云模型。\n\n描述\n\n在 PaaS 模型中，客户可以专注于开发软件并将其部署给客户（通常通过云计算环境）。客户端可以远程连接到在云计算环境中运行的应用程序以运行该程序。这种模型有助于应用程序无缝地贯穿开发、测试和生产阶段，而无需担心服务器或操作系统环境的变化。\n\
  \n## 理解虚拟化\n\n使云计算成为可能的技术是虚拟化，这也是让 Linux 成为云计算提供商热门选择的原因。虚拟化允许你在单个硬件平台上运行多个服务器，并根据需要在这服务器之间共享资源。\n\
  \n在正常的物理服务器环境中，操作系统利用硬件资源的时间只占其一小部分。这导致了“浪费”的资源闲置。虚拟化利用了这种情况，允许多个服务器共享硬件资源，从而提供了巨大的成本节省。本节描述了什么是虚拟化、可用的不同虚拟化类型以及如何在\
  \ Linux 环境中实现虚拟化。\n\n### 管理程序 (Hypervisors)\n\n对于运行支持大量客户端应用程序的组织，标准的性能模型规定，你应该将应用程序的不同功能分离到不同的服务器上，如图\
  \ 12-5 所示。\n\n![将应用程序的功能分离到不同的服务器上。](img/9781284255805_CH12_FIGF05.jpg)\n\n图 12-5\
  \ 隔离资源。\n\n描述\n\n如图 12-5 所示，在 IaaS 模型中，应用程序、Web 服务器和数据库服务器位于不同的物理服务器上。从性能角度来看，这种模型是合理的，因为你为每个元素分配了单独资源。此外，从安全角度来看，这有助于隔离访问，增加潜在攻击者的工作难度。\n\
  \n然而，随着服务器容量的增加，这种模型变得效率低下。将整台物理服务器仅用于运行 Web 服务器，另一台仅用于运行数据库服务器，再另外第三台仅用于运行应用程序是非常昂贵的。\n\
  \n这就是虚拟化发挥作用的地方。通过虚拟化，你可以在单台物理服务器上运行多个虚拟服务器环境。图 12-6 展示了这一点。\n\n![显示在单个物理服务器上运行多个虚拟服务器环境。](img/9781284255805_CH12_FIGF06.jpg)\n\
  \n图 12-6 虚拟化概念。\n\n描述\n\n每个虚拟服务器都是在物理硬件上运行的孤立服务器。这被称为虚拟机，或 `vm`。每个服务器的操作就像它位于单独的物理服务器上一样。然而，需要一种方法让每个虚拟服务器公平地共享主机服务器上的物理资源，以免它们之间发生冲突。\n\
  \n这就是管理程序的介入点。管理程序，也称为虚拟机监视器 (`vmm`)，充当虚拟机间共享的物理服务器资源的交通警察。它为运行在服务器上的每个虚拟机提供 CPU\
  \ 时间、内存空间和存储空间的虚拟环境。对于每个虚拟机来说，它似乎直接访问服务器资源；它并不知道管理程序在中间控制对资源的访问。\n\n由于每个虚拟机都是服务器上的一个独立实体，你可以在不同的虚拟机中运行不同的操作系统。这允许你轻松地尝试在不同的操作系统中运行应用程序，或者相同操作系统的不同版本，而无需购买额外的服务器。\n\
  \n### 管理程序的类型\n\n实现管理程序有两种不同的方法。本节将讨论它们是什么以及它们之间的区别。\n\n#### 第一型管理程序\n\n\n\n\nType\
  \ I 型虚拟机通常称为裸金属虚拟机（bare-metal hypervisors）。虚拟机系统直接运行在服务器硬件上，没有中间环节。虚拟机软件直接与系统的 CPU、内存和存储进行交互，并根据需要将它们分配给每个虚拟机。图\
  \ 12-7 描述了这种设置。\n\n![一张插图显示了 Type I 虚拟机的设置。](img/9781284255805_CH12_FIGF07.jpg)\n\
  \n图 12-7 Type I 型虚拟机。\n\n描述\n\n在 Linux 世界中，使用了两种流行的 Type I 虚拟机包：\n\n* `KVM`—基于 Linux\
  \ 内核的虚拟机（`KVM`）利用了标准的 Linux 内核以及一个特殊的虚拟机模块，取决于所使用的 CPU（Intel 或 AMD）。一旦安装，它可以托管任何类型的客体操作系统。\n\
  * `XEN`—`XEN` 项目是一个硬件虚拟化的开源标准。它不仅支持 Intel 和 AMD CPU，还有一个针对 Arm CPU 的版本。`XEN` 项目除了虚拟机软件外还包含额外的软件，包括用于从客体操作系统管理虚拟机的\
  \ API 栈。\n\n## Type II 虚拟机\n\nType II 型虚拟机通常称为托管虚拟机（hosted hypervisors），因为它们运行在已有的操作系统安装之上。虚拟机软件像宿主操作系统上的任何其他应用程序一样运行。图\
  \ 12-8 显示了 Type II 型虚拟机的工作原理。\n\n![一张插图显示了 Type II 虚拟机的设置。](img/9781284255805_CH12_FIGF08.jpg)\n\
  \n图 12-8 Type II 型虚拟机。\n\n描述\n\nType II 虚拟机软件将客体虚拟机作为独立的进程运行在宿主操作系统上。客体虚拟机支持客体操作系统，客体操作系统与宿主操作系统完全隔离。因此，你可以使用\
  \ Linux 宿主操作系统并仍然运行 Windows 或 macOS 客体操作系统。\n\n## 虚拟机模板\n\n你创建的在虚拟机中运行的虚拟机必须经过配置，以确定它们所需的资源以及它们如何与硬件交互。这些配置设置可以保存到模板文件中，这样你就可以轻松地在同一台虚拟机或独立的虚拟机服务器上复制虚拟机环境。\n\
  \n虚拟机配置的开源标准被称为开放虚拟化格式（`OVF`）。`OVF` 格式创建一个包含多个文件的分发包。该包使用单个 XML 配置文件来定义虚拟机硬件环境需求。除了该文件，还有定义虚拟机网络访问需求、虚拟驱动需求以及任何操作系统要求的额外文件。\n\
  \n`OVF` 模板的缺点是分发繁琐。解决方案是开放虚拟化设备（`OVA`）格式。`OVA` 模板将所有的 `OVF` 文件封装在一个 tar 归档文件中，以便分发。\n\
  \n## 探索容器\n\n虽然利用虚拟机是在服务器环境中启动多台服务器的一种极方法，但对于处理和分发应用程序来说仍然有些笨重。分发应用程序不需要复制整个操作系统环境。解决这个问题的方案是容器。本节探讨了容器是什么以及它们如何改变开发者在云环境中管理和分发应用程序的方式。\n\
  \n### 什么是容器？\n\n开发应用程序需要大量文件。除了应用程序运行时文件外，通常还需要用于应用程序与数据库、桌面管理软件或内置操作系统功能接口的额外库文件。这些文件通常位于\
  \ Linux 虚拟目录中散落在各处难以发现的地方。\n\n由于运行应用程序需要的所有辅助文件，经常会出现一个应用程序在开发环境中运行良好，但在部署到未能准确还原开发环境的生产环境时发生崩溃的情况。在\
  \ Windows 世界中，这通常被称为“DLL 地狱”，因为不同的应用程序会覆盖通用的 DLL 库文件，导致其他应用程序损坏。然而，这不仅限于 Windows\
  \ 世界；它也适用于 Linux 世界。\n\n一个容器收集了运行应用程序所需的所有文件——运行时文件、库文件、数据库文件以及任何特定于操作系统的文件。容器使得应用程序的运行变得自给自足——应用程序所需的一切都存储在容器内部。\n\
  \n如果你在服务器上运行多个应用程序，可以安装多个容器。每个容器对于每个特定的应用程序来说仍然是一个独立的环境，如图 12-9 所示。\n\n![一张插图显示每个容器都是特定应用程序的独立环境。](img/9781284255805_CH12_FIGF09.jpg)\n\
  \n图 12-9 在容器中运行应用程序。\n\n描述\n\n应用程序容器是可移植的。你可以在任何宿主环境中运行相同的容器，并期望应用程序具有完全相同的行为。这对于应用程序开发者来说是理想的。开发者可以在一个环境中开发应用程序容器，将其复制到测试环境，然后将应用程序容器部署到生产环境，而完全无需担心缺少文件。\n\
  \n通过将应用程序封装并分发为容器，开发者可以确保应用程序在客户处的运行方式与在开发环境中的方式完全一致。\n\n由于容器不包含整个操作系统，它们比尝试分发完整的虚拟机要轻量得多，因此更容易分发。下一节描述了\
  \ Linux 中使用的两种最常见的容器封装系统。\n\n### 容器软件\n\nLinux 一直处于容器开发的前沿，是开发者的流行选择。Linux 中通常使用两种主要的容器包：\n\
  \n* `LXC`—`LXC` 包被开发为创建容器的开源标准。`LXC` 中的每个容器都比标准的轻量级应用程序容器复杂一点，但还没有完整的虚拟机那么重，介于两者之间。`LXC`\
  \ 容器包含了自己的精简操作系统，直接与宿主系统硬件交互，不需要宿主操作系统。由于 `LXC` 容器包含自己的微操作系统，它们有时被称为虚拟机，尽管这个术语并不完全准确，因为\
  \ `LXC` 容器需要宿主操作系统才能运行。\n* `Docker`—`Docker` 包由 Docker Inc 开发并作为开源项目发布。`Docker`\
  \ 非常轻量，允许多个容器运行在同一台宿主 Linux 系统上。`Docker` 使用运行在宿主 Linux 系统上的独立守护进程来管理已安装的 `Docker`\
  \ 镜像。守护进程监听来自单个容器的请求以及允许你控制容器环境的 `Docker` 界面。\n\n### 容器模板\n\n就像虚拟机一样，容器允许你创建模板，以便轻松地复制容器环境。不同类型的\
  \ Linux 容器使用不同的方法分发模板。\n\n`LXC` 包使用一个名为 `LXD` 的独立工具来管理容器。`LXD` 使用容器的系统镜像\n\n\n\n\
  \n\nDocker 使用 `Docker image` 文件来存储容器配置。Docker 镜像文件是一个只读的容器镜像，你可以用它来存储和分发应用程序容器。\n\
  \n## 使用容器\n\n当正确实现时，容器提供了一种增加部署速度和敏捷性的方法。无论您公司的数据中心是在本地还是在云端，您可以使用容器概念来快速设置应用程序所需的基础设施。后续章节将涵盖一些重要的基础设施供应概念。\n\
  \n## 创建容器\n\n就像物理数据中心一样，容器也需要管理和控制。在大多数环境中，容器的配置处理方式类似于处理软件版本的方式。以下章节概述了为应用程序创建容器环境的基本思想。\n\
  \n### 设计容器\n\n除了应用程序需求外，运行程序的环境必须经过预计划。这项活动是软件开发与技术运维之间的共同活动。在这种共同活动中，将选择容器的操作系统、库、服务、安全配置以及任何其他支持软件或网络工具。\n\
  \n确定的基础设施会被冻结，以为开发和生产提供一个不变的环境。通常，此应用程序基础设施仅可通过应用程序或开发者的 API 访问。为了保护其环境，不提供 `OpenSSH`\
  \ 等远程访问服务。\n\n### 文档化\n\n预设的应用程序容器通常会记录文档，以确保容器可以被准确复制。虽然有许多记录容器的方法，但现在这通常使用[编排]工具完成。编排工具允许您轻松地自动化容器的配置、管理和协调。配置设置在一个名为自动化配置管理的过程中加载。这些数据随后用于通过构建自动化来部署和复制应用程序容器。\n\
  \n### 提供版本控制\n\n配置管理信息不仅被记录，还被插入到编排工具的注册表中，提供版本控制。每当容器镜像基础设施发生变化时，其修改都会在版本控制系统中被跟踪。这确保了引入过程的任何错误都可以轻松地“回滚”到应用程序的先版本。\n\
  \n### 故障排除容器\n\n如果应用程序容器部署到生产环境中并出现问题，将由技术运维、软件开发人员或两者共同处理故障排除过程。要检查的一个项目是生产容器的文档化配置（以及其版本），以确定是否任何基础设施项目可能是祸首。\n\
  \n这为跟踪可能导致问题的新软件库提供了一种更简单的方法。各种编排工具允许快速确定修改的基础设施组件，并更快地解决问题。\n\n以这种方式处理应用程序基础设施增加了您的应用程序容器部署的敏捷性。它还提高了进入生产的速度。编排的应用程序镜像的基本生命周期如图\
  \ 12-10 所示。\n\n![流程图显示基本应用程序容器的生命周期。](img/9781284255805_CH12_FIGF10.jpg)\n\n图 12-10\
  \ 基本应用程序容器生命周期。\n\n描述\n\n注意图 12-10，在容器生命周期结束时（通常当新的应用程序镜像准备绪时），容器镜像会被删除。然而，旧的应用程序镜像配置应该存储在版本控制系统（或备份存储）中，如果新的应用程序镜像出现任何问题，则重新部署。\n\
  \n## 自动化容器\n\n通过自动化配置管理，不仅可以更轻松地排除基础设施故障并将环境回滚到之前的版本，容器部署也是自动化的。通常使用多个应用程序容器来帮助负载。高流量环境可能需要数百个运行中的生产应用程序容器。\n\
  \n手动配置此类基础设施是枯燥的，而且显然不快速也不符合成本效益。通过 `Chef` 和 `Puppet` 等编排工具以及自动化配置管理，你可以轻松地复制生产应用程序容器，甚至不需要参与该过程（构建自动化）。你只需要让你的编排工具知道你在任何时候运行\
  \ X 个生产应用程序镜像即可。\n\n## 代理与无代理容器\n\n编排监控、日志和报告工具允许您跟踪应用程序容器的健康状况（运行性能如何，以及每个容器是否仍然存活）。对这些工具可能如何负面影响应用程序容器健康的担忧引发了代理与无代理之争端。\n\
  \n代理监控工具是编排实用程序，它们需要在被监控的应用程序容器中安装软件（`agent`）。这些 `agents` 收集数据并将其传输到另一个位置，例如监控服务器。监控服务器管理信息、提供分析报告，并对事件（如容器崩溃）发送警报。\n\
  \n无代理监控工具也是编排工具。在这种情况下，被监控的应用程序容器中不安装 `agent`。相反，该工具使用容器内或容器外部环境中预先存在和或嵌入的软件来执行其监控活动。\n\
  \n使用基于代理的还是无代理的编排工具存在激烈的争论。一些人认为 `agent` 对应用程序容器的性能是有害的，另一些人则认为影响微其微。一些技术运维坚持认为无代理工具缺乏灵活性，而另一些人则认为在容器中安装和维护\
  \ `agent` 是没麻烦。无论你选择哪一方，都要意识到大多数公司使用代理和无代理编排工具的组合。\n\n### 监控容器\n\n编排监控工具可以自动处理应用程序容器的意外死亡。当应用程序容器关闭时，这将触发一个事件，且不再满足期望状态。期望状态是一个预定义的设置，声明运行容器的数量。\n\
  \n例如，假设您的软件应用程序需要运行 10 个生产应用程序容器来高效处理工作负载。如果其中一个容器崩溃，容器数量现在变为 9 个。这将触发监控工具中的事件，表明期望状态不再满足。\n\
  \n许多编排工具采用自愈功能。通过自愈，如果尚未实现期望状态，编排工具可以自动部署额外的生产应用程序容器。在之前的示例中，这意味着编排工具将立即使用存储的容器配置设置（构建自动化）启动额外的生产应用程序容器。不需要人工干预。\n\
  \n当首次部署新的生产应用程序容器时，自愈编排属性会导致自动部署容器，直到满足期望状态。\n\n无论容器是在您的本地服务器还是在云端，正确维护它们都需要某种编排引擎（也称为编排系统）。没有一个系统可以完成所有工作。最佳组合是通用和专用编排工具的集合。\n\
  \n### Kubernetes\n\n\n\n\n`Kubernetes` 最初由 Google 设计并使用，是一个开源编排系统，被许多人认为是事实上的标准。`Kubernetes`\
  \ 不仅受欢迎且免费，而且具有高度的可扩展性、容错性且易于学习。\n\n该系统包含了 `Google` 多年的编排经验，而且因为是开源的，还增加了许多社区所需的额外功能。这也是许多公司采用它进行容器编排的原因之一。\n\
  \n每个由 `Kubernetes` 管理的服务或应用程序包含以下主要组件：\n\n*   集群服务—使用 `YAML` 文件来部署和管理应用 pod\n* \
  \  `Pod`—包含一个或多个运行中的应用容器\n*   `Worker`—Pod 宿主机系统，使用 `kubelet`（代理）与集群服务进行通信\n*  \
  \ `YAML` 文件—包含特定应用容器的自动化配置管理和期望状态设置\n\n这种分布式组件配置允许了高可扩展性和极大的灵活性。它对于采用 DevOps 模式的公司所追求的持续软件交付也运行非常好。\n\
  \n## Docker Swarm\n\n`Docker` 是一种流行的应用容器管理工具，它创建了自己的编排系统，称为 `Docker Swarm`（也称为 `Swarm`）。一组\
  \ `Docker` 容器被称为集群，它在用户看来是一个单一容器。要编排 `Docker` 集群，你可以使用 `Swarm`。\n\n通过 `Swarm` 系统，你可以监控集群的健康状况，并在集群内的容器故障时将集群恢复到期望状态。如果当前无法满足应用性能需求，还可以部署额外的\
  \ `Docker` 容器。在部署额外容器方面，`Swarm` 通常比 `Kubernetes` 快。\n\n虽然没有 `Kubernetes` 编排系统受欢迎，但\
  \ `Docker Swarm` 有其用武之地。它通常被那些对编排不熟悉但已经熟悉 `Docker` 工具的人使用。\n\n## Mesos and Marathon\n\
  \n`Mesos`（也称为 `Apache Mesos`）并不是一个容器编排系统。相反，由加州大学伯克利分校创建的 `Apache Mesos` 是一个分布式内核。它与\
  \ `Linux` 内核类似，但它在更高的构造级别运行。它的功能之一是创建容器。底线是，`Apache Mesos` 结合另一个产品 `Marathon` 确实了一种容器编排系统框架。你可以模糊地将\
  \ `Mesos` 与 `Marathon` 比较作 `Docker` 与 `Swarm` 的关系。\n\n`Mesos` 配合 `Marathon` 提供了高可用健康监控集成，并可以支持\
  \ `Mesos` 和 `Docker` 容器。该编排框架在大型容器部署环境中悠久的历史。\n\n## 理解 DevOps 概念\n\n容器和编排对 IT 世界产生影响的一个特定领域是\
  \ `DevOps`，它现在备受关注。`DevOps` 定义了一种通过融合软件开发人员和 IT 运维人员来创建和部署应用程序的方法。虽然不是强制性的，但容器可以通过提供一个从开发环境到生产环境的应用部署平台来帮助这一过程。本节提供了\
  \ `DevOps` 的概述。\n\n### DevOps 流程\n\n在 `DevOps` 中，主要目标是快速且持续地为客户提供新的软件功能、错误修复和所需的修改。重点是对应用进行持续的小幅更改，而不是大型的单体更新。这样做涉及本节概述的几个步骤。\n\
  \n### 持续应用处理\n\n一个 `DevOps` 层涉及开发者在受控的中央仓库中进行软件修订的过程。中央仓库易于使用自动化方法快速将应用更改集成到主软件分支（持续集成）。此外，这些更改会经过自动化测试，以避免在分支合并时破坏应用（持续测试）。在上述两个组件的帮助下，软件持续地交付给客户（持续交付）。\n\
  \n### 控制应用环境\n\n为了支持这种持续应用处理层，`DevOps` 中开发环境和生产环境匹配是有帮助的。这包括等效的硬件、设备驱动、操作系统版本、软件库等。这种要求提供了一个软件开发环境，使其产生的生产代码不会因环境不匹配而产生错误或复杂问题。\n\
  \n此外，环境的变化必须以类似于编排软件修订的方式进行控制和测试。例如，如果开发环境中对 `Linux` 内核的受控更新引入了不可预的应用错误，则环境可以回滚到之前的版本，直到错误得到解决。环境更新通常以小块进行，就像处理应用修订一样，这样每个环境修改都可以得到适当且离散的管理。经过测试的新环境被被注册注册表中，那里也维护着旧环境，以防需要回滚到之前的环境。\n\
  \n### 定义应用环境\n\n在 `DevOps` 中，开发和生产环境（基础设施）具有预定义的规范，例如需要哪些硬件设备、核心操作系统以及任何需要的软件软件包和关键代码库。非硬件规范通常通过自动化代码（配置管理）实施到环境中。\n\
  \n除了环境配置外，安全措施（如防火墙配置和身份验证策略）也必须编排。这同样通过自动化代码（策略即代码）实施到环境中。\n\n配置管理和策略即代码属于基础设施即代码这一伞术语。使用基础设施即代码的好处是环境是可以重复的。此外，它们可以版本化，这对于在应用环境中实现策略和配置的版本控制是必要的。这个\
  \ `DevOps` 组件将在本章后面深入介绍。\n\n### 部署应用环境\n\n应用及其开发环境通常以持续的方式转换为生产状态（生产环境。“持续的方式”可以是每小时、每天、每周或任何符合应用业务要求的。\n\
  \n采用基础设施即代码技术的用处是部署应用及其环境的过程可以很容易地自动化（基础设施自动化）。Red Hat 的 `Ansible` 产品是用于这种 `DevOps`\
  \ 部署的工具之一。\n\n### 监控应用环境\n\n当应用在其环境中运行时，需要对其监控和记录。软件指标、基础设施资源使用和性能统计只是监控和记录的项目之。目标是跟踪应用环境并确保它符合预设条件（环境健康）。通常这种监控也是自动的。\n\
  \n随着业务需求的变化，记录的数据对于未来的期望环境状态非常有价值。它提供了阈值和性能测量，使得决定需要哪些应用或环境基础设施修改变得更容易。\n\n此外，监控可以为潜在的故障或资源耗尽事件提供警报。如果超过了特定的预设限制，监控软件可以发出警报，甚至使用预定义的事件规则处理事件本身。\n\
  \n编排是敏捷 `DevOps` 的关键。除了方法论，各种编排工具为在持续软件交付业务环境中成功所需的额外速度。\n\n### DevOps 容器属性\n\n\n\
  \n\n\n虚拟化，更特别是容器，极大地帮助了 DevOps 进程。容器在 DevOps 中提供了以下支持：\n\n### 静态环境\n容器提供了一个预定义的应用环境（也称为容器镜像），该环境不会随时间改变（不可变）。容器在创建时带有预设的库、操作系统版本以及安全设置。所有这些设置都被记录下来。镜像内部不会使用标准的操作系统升级包发布软件更新。\n\
  \n### 版本控制\n在软件开发过程之后、将修改后的应用容器镜像移动到生产环境之前，容器及其记录的配置将注册到版本控制系统中。版本控制系统可以包含之前的应用容器镜像，包括当前生产中的。某些公司使用通过备份实现的手动版本控制系统。\n\
  \n### 替换而非更新\n注册后，应用容器已准备好移动到生产环境。并不是更新生产应用容器镜像以匹配开发镜像，而是停止生产容器。然后用开发应用容器镜像替换生产容器并作为生产环境启动。因此，发生了一个环境切换。\n\
  \n### 高可用性\n复制是创建多个生产应用容器镜像副本并运行它们的过程。这允许你停止旧的当前未使用生产应用容器，并用新的生产应用容器替换它们，从而为你的应用用户提供持续的运行时间。通过容器和复制，在凌晨时段关闭生产环境进行更新的旧方法已经消失了。\n\
  \n为了使用容器镜像完成这些任务，你需要编排。编排原理为在快速环境（如使用 DevOps 的环境）中实现应用容器镜像提供了工具、实用程序和指导。因此，云、容器、编排和\
  \ DevOps 共同互动，为当今高需求的网络世界创造了理想的应用环境。\n\n## 资源\nDocker 文档，“什么是容器？”，访问于 2022 年 1 月\
  \ 29 日，来自 [`www.docker.com/resources/what-container`](https://www.docker.com/resources/what-container)。\n\
  \nRed Hat 文档，“理解云计算”，访问于 2022 年 1 月 29 日，来自 [`www.redhat.com/en/topics/cloud`](https://www.redhat.com/en/topics/cloud)。\n\
  \nRed Hat 文档，“理解 DevOps”，访问于 2022 年 1 月 29 日，来自 [`www.redhat.com/en/topics/devops`](https://www.redhat.com/en/topics/devops)。\n\
