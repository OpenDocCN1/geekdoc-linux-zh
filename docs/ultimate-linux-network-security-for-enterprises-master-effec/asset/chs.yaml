  \ [`www.orangeava.com`](http://www.orangeava.com)。\n\n# 第 1 章：## 探索 Linux 网络安全基础\n\
  \n### 引言\n\n学习 Linux 基础将让你接触到一个稳定且适应性强的操作系统，该系统驱动着互联网大部分份额。Linux 以其可靠性、安全性和开源状态而闻名，是许多应用程序（包括嵌入式系统和服务器）的基础。在介绍之旅中，我们将探索支撑\
  \ Linux 的基本理念，剖析其文件系统设计、命令行界面和必要的工具。我们还将解构支撑计算机网络的基本理念。我们将揭示允许设备高效交互的关键组件，从理解 OSI\
  \ 模型层级到深入研究协议和寻址的细差别。此外，我们将检查网络管理和安全的关键方面，阐明为保护数据机密性和完整性所实施的步骤。在探索交换机、路由器和防火墙的世界时，你将学习决定现代网络韧性的物理组件。\n\
  \n### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   理解和探索 Linux 环境\n*   学习计算机网络基础概念\n*   理解 CIA 原则\n\
  *   防火墙如何帮助网络安全\n*   理解 Web 安全\n\n#### Linux 简介\n\n#### CLI\n\n命令行界面，简称为 `CLI`，是一种基于文本的界面，允许用户在终端或命令提示符中输入命令以与计算机或程序通信。提供\
  \ `CLI` 访问权限的一个程序被称为 `Terminal`。通常，命令提示符会显示当前目录和用户的信息。\n\n操作系统是在启动期间加载到计算机并控制所有应用程序的软件。\n\
  \n开源、社区驱动的 Linux 是一种操作系统。该系统的基石是 `kernel`（内核），它与其他程序和工具结合。\n\n#### 基础 Linux 命令\n\
  \n| 文件命令：用于执行基本文件操作 | 描述 |\n| :--- | :--- |\n| `ls` | 列文件和目录 |\n| `ls -lt` | 按修改时间对格式化列表排序\
  \ |\n| `cd <dir>` | 切换目录到 `<dir>` |\n| `cd ..` | 回到父目录 |\n| `pwd` | 打印工作目录 |\n|\
  \ `mkdir <dir>` | 创建目录 `<dir>` |\n| `cat ><filename>` | 将标准输入写入文件 |\n| `more <filename>`\
  \ | 输出文件内容 |\n| `touch <filename>` | 创建空文件或更新文件时间戳 |\n| `rm <filename>` | 删除文件 |\n\
  | `rm -r <dir>` | 递归删除（用于目录） |\n| `cp <filename1> <filename2>` | 将文件 1 的内容复制到文件\
  \ 2 |\n| `cp -r <dir1> <dir2>` | 递归将 dir1 复制到 dir2；如果不存在则创建 dir2 |\n| `ln -s <filename>\
  \ <link>` | 为文件创建符号链接或软链接 |\n\n| 进程管理：用于管理进程 | 描述 |\n| :--- | :--- |\n| `ps` | 显示当前运行的进程\
  \ |\n| `top` | 显示所有运行中的进程 |\n| `kill <pid>` | 杀死给定 pid 的进程 |\n| `killall <proc>`\
  \ | 杀死所有名为 proc 的进程 |\n\n| 文件权限：用于设置权限 | 描述 |\n| :--- | :--- |\n| `chmod octal file`\
  \ | 将文件权限更改为八进制，可以通过添加以下数字分别查找用户、组、世界：4-读(r), 2-写(w), 1-执行(x) |\n\n| 搜索：用于搜索特定内容\
  \ | 描述 |\n| :--- | :--- |\n| `grep pattern file` | 在文件中搜索模式 |\n| `grep -r pattern\
  \ dir` | 在目录中递归搜索模式 |\n| `command \\| grep pattern` | 在命令输出中搜索模式 |\n| `locate file`\
  \ | 查找所有文件实例 |\n| `find . -name filename` | 在当前目录（用点表示）和所有子目录中搜索与 filename 精确匹配的文件和目录\
  \ |\n| `pgrep pattern` | 搜索所有匹配模式的命名进程，默认返回它们的 ID |\n\n| 系统信息：用于获取系统信息 | 描述 |\n\
  | :--- | :--- |\n| `Date` | 显示当前日期和时间 |\n| `cal` | 显示本月日历 |\n| `uptime` | 显示运行时间\
  \ |\n| `w` | 显示谁在线 |\n| `whoami` | 显示当前用户是谁 |\n| `uname -a` | 显示内核信息 |\n| `cat /proc/cpuinfo`\
  \ | 显示 CPU 信息 |\n| `cat /proc/meminfo` | 显示内存信息 |\n| `man command` | 显示命令的手手册 |\n\
  | `df -h` | 显示磁盘占用情况 |\n| `du -h <filename>` | 如果给出文件名，则显示其磁盘占用情况 |\n| `du -h <dirname>`\
  \ | 如果给出目录名，则显示所有目录的磁盘占用情况 |\n| `free` | 显示内存和交换空间 |\n| `whereis app` | 显示 app 的可能位置\
  \ |\n| `which app` | 显示默认运行哪些应用程序 |\n\n| 网络命令：用于获取网络相关信息 | 描述 |\n| :--- | :--- |\n\
  | `ping host` | 探测主机并输出结果 |\n| `whois domain` | 获取域名的 WHOIS 信息 |\n| `dig domain`\
  \ | 获取域名的 DNS 信息 |\n| `dig -x host` | 反向查找主机 |\n| `wget file` | 下载文件 |\n| `wget\
  \ -c file` | 继续停止下载 |\n\n**表 1.1：Linux 命令**\n\n| 文件层级 | 描述 |\n| :--- | :--- |\n\
  | /root 目录 | 用户命令二进制 |\n| `/boot/` | 引导程序的静态文件 |\n| `/dev/` | 设备文件 |\n| `/etc/`\
  \ | 主机特定系统配置 |\n| `/home/` | 用户主目录 |\n| `/lib/` | 共享库 |\n| `/media/` | 可移动介质 |\n\
  | `/mnt/` | 挂载的文件系统 |\n| `/opt/` | 附加软件包 |\n| `/sbin/` | 系统二进制文件 |\n| `/srv/` |\
  \ 系统服务数据 |\n| `/tmp/` | 临时文件 |\n| `/usr/` | 用户工具 |\n| `/proc/` | 进程信息 |\n\n**表 1.2：文件系统**\n\
  \n#### `root`\n*   文件系统的顶层目录是根目录。\n*   只有 root 用户有权限写入根目录。\n\n#### `bin`\n*   单用户模式运行所需的主要命令位于\
  \ `/bin` 目录。\n*   它包含二进制执行程序，系统无需解释器即可运行它们。\n*   该目录包含了单用户模式下常用的常用 Linux 命令。\n\n\
  #### `device`\n*   重要的设备文件（包括 `/dev/null`）存储在 `/dev` 目录。\n*   物理连接到系统的终端设备、USB 设备和其他外设设备通过这些设备文件来表示。\n\
  \n\n\n\n\n*   两个设备文件的实例是 `/dev/usbmon0`（用于跟踪 USB 设备）和 `/dev/tty1`（代表第一个串口控制台）。\n\
  \n#### 4. `/etc`\n* 需要主机特定系统级配置文件的程序和服务可以在 `/etc` 目录中找到。\n* 此外，它还包含用于启动和停止某些应用程序及服务的\
  \ shell 脚本。\n* 该目录包含配置文件，例如调节日志文件轮转的 `/etc/logrotate.conf` 以及管理 DNS 设置的 `/etc/resolv.conf`。\n\
  \n#### 5. `/home`\n* 系统上所有用户的家目录都包含在 `/home` 目录下。\n* 每个用户都有一个唯一的家目录，用于保存他们的私人文件、偏好和设置。\n\
  \n#### 6. `/lib`\n* `/bin` 和 `/sbin` 文件夹中的二进制文件依赖于 `/lib` 目录中的重要库。\n* 可执行文件正确运行所需的功能由这些库提供。\n\
  \n#### 7. `/media`\n* `/media` 目录作为 CD-ROM 等可移动介质设备的临时挂载点。\n* 它为挂载和卸载可移动存储设备提供了一个标准位置。\n\
  \n#### 编辑器\n*   **Vim**: 它是一个高度可配置的文本编辑器，非常高效且功能强大。它以两种模式运行：用于导航和编辑文本的普通模式以及用于插入文本的插入模式。\n\
  *   **Emacs**: 它因内置的脚本语言（Emacs Lisp）而闻名，允许用户大量自定义和扩展其功能。它的学习曲线很陡，但一旦掌握就会非常强大。\n\
  *   **Nano**: 一个简单易用的文本编辑器，专为可能不习惯 Vim 或 Emacs 陡峭学习曲线的用户设计。它提供了基本的文本编辑能力，是快速编辑的良好选择。\n\
  *   **Sublime Text**: 一个知名的内置文本编辑器，拥有许多功能和时尚的界面。它强大的插件生态系统并支持多种编程语言。尽管不是开源，但 Sublime\
  \ Text 提供免费试用版。\n*   **Atom**: 由 GitHub 创建的开源文本编辑器。Atom 以其用户友好性和丰富的社区贡献自定义包而闻名。它具有高度扩展性，并使用\
  \ Web 技术构建。\n\n## 计算机简介\n通过通信链路连接的一组设备称为网络。计算机、打印机、路由器和其他数据传输与接收设备都是节点的示例。任何可以传输数据信号的介质（如电缆或光纤）都可以认为是链路。\n\
  \n### OSI 模型\n开放系统互连接（OSI）是一个描述计算机之间传输数据所需程序的参考模型。它帮助我们理解数据如何从一端传输到另一端。它是一个分层模型，将通信划分为更小的、可管理的组件，从而加速开发并使各种硬件和软件的协作成为可能。\n\
  \n| 123 | 应用层表示层会话层 | 用户支持层（提供无关软件间的互操作性） |\n| 4 | 传输层 | 确保端到端可靠数据传输 |\n| 567 |\
  \ 网络层数据链路层物理层 | 用户支持层（提供无关软件间的互操作性） |\n\n****表 1.3:** OSI 层的功能\n\n#### 1. 物理层\n\
  该层负责将单个比特位从一个节点传输到下一个节点。\n* OSI 模型的底层\n* 通信单位是比特（Bit）\n* 将比特位转换为电子信号以发送出的消息\n* 将电子信号转换为比特位以接收传入的消息\n\
  * 管理计算机与网络介质之间的接口\n\n**职责：**\n* 比特位的同步和数据速率\n* 线路配置\n* 物理拓扑\n* 传输模式\n\n#### 2. 数据链路层\n\
  数据链路层负责将帧从一个节点传输到下一个节点。\n* 通信单位是帧（Frame）\n* 将物理层的原始数据封装成数据帧，并交付到接收端的网络层\n* 在发送端，数据链路层将数据转换为物理层可以处理的原始格式\n\
  \n**职责：**\n* 物理地址\n* 序列号\n* 错误控制\n* 控制\n* 访问控制\n\n#### 3. 网络层\n网络层负责将单个数据包从源地交付到终点（端到端交付）。\n\
  * 通信单位是数据包（Packet）\n* 负责数据包的源到目的交付\n* 提供在网络之间移动数据包的机制\n* 如果两个系统连接到同一条链路，通常不需要网络层。然而，如果两个系统连接到不同的网络（链路），且网络之间有连接设备，通常需要网络层来完成源到目的的交付\n\
  * 也处理数据包交换\n\n**职责：**\n* 网络地址（逻辑地址）\n* 路由\n\n#### 4. 传输层\n传输层负责将消息从一个进程交付到另一个进程（源到目的交付）。\n\
  * 通信单位是分段（Segment）\n* 提供可靠的数据交付\n* 从上层接收信息并将其分段\n\n**职责：**\n* 进程间通信\n* 分段和重组\n*\
  \ 连接控制\n\n#### 5. 会话层\n会话层负责会话控制和同步。\n**职责：**\n* 同步设备之间的数据交换\n* 管理令牌以控制对通信信道的访问\n\
  \n#### 6. 表示层\n表示层负责处理两个系统之间信息的语法和语义。\n**职责：**\n* 数据翻译\n* 语法检查\n* 加密和解密\n* 数据格式化\n\
  * 图形处理\n\n#### 7. 应用层\n应用层负责为用户提供服务。\n**职责：**\n* 文件传输和管理存访问\n* 电子邮件服务\n* 网页浏览\n\
  * 数据库访问\n\n| 层 | 功能 |\n| :--- | :--- |\n| 应用层 | 提供网络资源的服务 |\n| 表示层 | 对数据进行翻译、加密和压缩\
  \ |\n| 会话层 | 建立、管理和终止会话 |\n| 传输层 | 提供可靠的进程间交付和错误恢复 |\n| 网络层 | 将数据包从源移动到目以提供网络互连\
  \ |\n| 数据链路层 | 将比特组织成帧并提供跳跳交付 |\n| 物理层 | 在介质上传输比特以提供机械和电气规范 |\n\n## IP 地址\nIPv4\
  \ 地址是一个 32 位地址，唯一且通用地定义设备（例如计算机或路由器）与互联网的连接。\n\n![](img/Fig-1.1.jpg)\n\n**图 1.1:**\
  \ IP 地址\n\n地址划分有两种类型：类划址和无类划址。\n\n### 类划址\n在类类划址中，地址空间被分为五类：A、B、C、D 和 E。\n\n![](img/tab1.5.jpg)\n\
  \n**表 1.5:** 类划址\n\n在类划址中，浪费了大量的 IP 地址。\n\n### 无类划址\n\n\n\n\n在无分类寻址中，块中的地址数量可以通过公式\
  \ `2^(32−n)` 找到，其中 `n` 是掩码值。\n\n*   块中的第一个地址可以通过将右侧的 `(32 – n)` 位设置为 0 来找到。\n* \
  \  块中的最后一个地址可以通过将右侧的 `(32 – n)` 位设置为 1 来找到。\n\n## IPv6 地址\n\n尽管有了所有短期解决方案，地址枯竭仍然是互联网面临的一个长期问题。这一问题以及\
  \ IP 协议本身的其他问题是开发 IPv6 的动力。\n\nIPv6 地址的长度为 128 位。\n\n![](img/Fig-1.2.jpg)\n\n**图\
  \ 1.2:** *IPv6 地址缩写*\n\n## 特殊地址\n\n有很多类型的特殊地址，用于某些特定的任务。\n\n![](img/Fig-1.3.jpg)\n\
  \n**图 1.3:** *特殊地址*\n\n*   虽然该块的部分内容用于定义某些特殊地址，但以前缀 `(0000::/8)` 开头的地址是保留的。\n* \
  \  当主机在启动过程中想要发送查询以查找自己的地址时，它可以使用 `unspecified address`（未指定地址）子块，这是一个只有一个地址的子块。\n\
  *   回环地址只有一个地址。IPv4 的 `Loopback addresses`（回环地址）之前讨论过。在 IPv6 中，一个块由单个地址组成，而不是 IPv4\
  \ 中的地址范围。\n*   主机在从 IPv4 切换到 IPv6 时，可以使用嵌入其 IPv6 地址中的 IPv4 地址。\n\n专门为这种用途创建了两种格式：兼容格式（compatible）和映射格式（mapped）。\n\
  \n*   **兼容（Compatible）：** 由 96 位零后跟 32 位 IPv4 地址组成的地址被认为是兼容的。当一台支持 IPv6 的计算机想要与另一台支持\
  \ IPv6 的计算机通信，但消息必须通过仍然仅支持 IPv4 的网络部分时。\n*   **映射（Mapped）：** 当已过渡到版本 6 的计算机向仍在运行版本\
  \ 4 的计算机发送地址时，它使用映射地址。\n\n| | **IPv4** | **IPv6** |\n| :--- | :--- | :--- |\n| 地址长度\
  \ | 32 位 | 128 位 |\n| 地址表示 | 十进制 | 十六进制 |\n| 多组播地址 | 224.0.0.0/4 | FF00::/8 |\n\
  | 广播地址 | 存在 | 不适用 |\n| 未指定地址 | 0.0.0.0 | :: |\n| 回环地址 | 127.0.0.1 | ::1 |\n\n**表\
  \ 1.6:** *IPv4 和 IPv6 比较*\n\n## 子网划分\n\n子网划分是在网络创建子网络（也称为 subnet）的过程。子网内的网络接口和设备可以相互通信。路由器促进不同子网之间的通信。\n\
  \n块中的每个地址都可以被视为两级层次结构：最左侧的 `n` 位（前缀）定义网络，而最右侧的 `(32 – n)` 位定义主机。\n\n### 类\n\n假设我们有一个\
  \ IP 地址为 `200.1.2.0` 的网络。该地址属于 C 类，因此掩码值为 `/24`，这意味着前 24 位保留用于网络地址。\n\n现在，要将其分为两部分，我们需要\
  \ 1 位 `(0/1)`。\n\n```\n200.1.2.0\n```\n\n我们将最后一个十进制值表示为二进制值（我们只扩展最后一个十进制值，因为掩码值为\
  \ 24，所以我们只需要 8 位来划分网络。如果我们需要超过 8 位，我们将必须也扩展倒数第二个十进制值，依此类推）。\n\n```\n200.1.2.00000000\n\
  ```\n\n*   第 1 个子网：`200.1.2.00000000` -> `200.1.2.0`\n*   第 2 个子网：`200.1.2.10000000`\
  \ -> `200.1.2.128`\n\n| **子网** | **起始地址** | **结束地址** |\n| :--- | :--- | :--- |\n\
  | 子网 1 | 200.1.2.0 | 200.1.2.127 |\n| 子网 2 | 200.1.2.128 | 200.1.2.255 |\n\n**表\
  \ 1.7:** *示例*\n\n现在，要将其分为四部分，我们需要 2 位 `(00/01/10/11)`。\n\n```\n200.1.2.0\n```\n\n\
  ```\n200.1.2.00000000\n```\n\n*   第 1 个子网：`200.1.2.00000000` -> `200.1.2.0`\n* \
  \  第 2 个子网：`200.1.2.01000000` -> `200.1.2.64`\n*   第 3 个子网：`200.1.2.10000000` ->\
  \ `200.1.2.128`\n*   第 4 个子网：`200.1.2.11000000` -> `200.1.2.192`\n\n| **子网** | **起始地址**\
  \ | **结束地址** |\n| :--- | :--- | :--- |\n| 子网 1 | 200.1.2.0 | 200.1.2.63 |\n| 子网\
  \ 2 | 200.1.2.64 | 200.1.2.127 |\n| 子网 3 | 200.1.2.128 | 200.1.2.191 |\n| 子网 4 |\
  \ 200.1.2.192 | 200.1.2.255 |\n\n*(注：原始文本在 4 部分划分的表中存在某些错误，我已根据逻辑进行了修正。)***表 1.7:**\
  \ *示例*\n\n\n\n\n## 2. 文件传输协议\n文件传输协议，简称 FTP，允许通过基于 TCP 的网络（如互联网）从一端到另一端进行文件传输。与\
  \ `FTPS` 或 `SFTP` 类似，FTP 可以在加密或不加密的情况下使用。尽管如此，结合外部加密使用 FTP 会更安全。\n\n## 3. 电子邮件\n\
  它可以使用简单邮件传输协议 (`SMTP`）在服务器之间发送。\n\n## 4. 邮局协议版本 3 (POP3)\n这是一种基于电子邮件的协议，用于从服务器检索电子邮件到客户端设备，通常会将其下载并从服务器删除。\n\
  \n## 5. 互联网消息访问协议 (IMAP)\n该协议与 `POP3` 类似，允许电子邮件客户端访问邮件服务器上的消息，而无需下载。它允许用户在服务器上组织和操作他们的电子邮件。\n\
  \n## 6. 域名系统 (DNS)\n这是一个将人类可读的域名转换为 IP 地址的系统，以便客户端能够获取请求的网页。DNS 使用分布式服务器系统来管理从域名到\
  \ IP 地址的转换。在 DNS 查找过程中，将 `www.example.com` 等域名转换为如 `192.168.1.1` 的 IP 地址非常重要。\n\n\
  ## 7. 简单网络管理协议 (SNMP)\n该协议用于管理和监控路由器、交换机、服务器等许多网络设备及其功能。SNMP 陷阱是代理向管理员发送的异步通知，用于向他们报警特定事件，例如系统重启、链路状态更改或其他重大事件。\n\
  \n## 8. Telnet\n一种提供与远程计算机通信的文本接口的协议。它是不安全的，并在很大程度上已被安全外壳 (`SSH`) 取代。\n\n## 9. 安全外壳\
  \ (SSH)\n它提供访问远程计算机的安全方法，允许加密通信和安全的远程管理。\n\n## 10. 动态主机配置协议 (DHCP)\n它为网络上的设备动态分配\
  \ IP 地址和其他网络配置信息。\n\n## 11. 网络时间协议 (NTP)\n它用于同步网络上计算机和网络设备的时钟。它的设计目的是确保分布式系统中准确且一致的时间计时，允许设备与参考时间源保持同步时间。\n\
  \n## 网络安全\n\n### CIA\nCIA 指的是信息安全的核心原则：机密性、完整性和可用性。这些原则为设计和实施安全系统及实践奠定了基础。\n\n![](img/Fig-1.6.jpg)\n\
  \n**图 1.6:** 信息安全基础\n\n* **机密性**：确保数据仅对授权人员可见且可访问。\n* **完整性**：确保存在的数据是正确且准确的。这意味着数据没有被任何未经授权的人篡改。\n\
  * **可用性**：确保数据对于需要并愿意访问它的人是可用的。\n\n### IdAM\n身份和访问管理（IdAM）是一项策略和技术框架，确保正确的个人拥有对技术资源的适当访问。\n\
  \n* **身份识别**：涉及识别系统内的个人。\n* **身份验证**：涉及验证用户的身份。最广泛使用的三个因素是用户所知道的、用户拥有的以及用户具备的特征。\n\
  * **授权**：涉及用户可以拥有的访问级别。\n\n## 防火墙配置\n防火墙是一种网络安全设备或软件，根据预定义的安全规则监控并控制入出站的网络流量。防火墙的主要目的是在安全的内部网络与不可信的外部网络（如互联网）之间建立屏障。\n\
  \n防火墙可以以硬件和软件的形式实现：\n\n硬件防火墙实现在路由器层级并保护整个网络，而软件防火墙保护单台计算机，通常成本较低。\n\n![](img/Fig-1.7.jpg)\n\
  \n**图 1.7:** 防火墙实现\n\n然而，防火墙不执行以下操作：\n\n* 防止免受可能伤害你的内部人员攻击。\n* 防止免受完全全新的威胁。\n* 编程访问互联网，尽管这是防火墙可以控制的功能之一。\n\
  * 确定哪些程序可以访问互联网。\n* 防止弹出广告。\n* 防范 `SMTP` 会话劫持。\n* 防止免受操作系统中 bug 的影响。\n* 防止未经授权的用户使用计算机。\n\
  * 防止免受源路由攻击（Source routing）。\n\n以下是防火墙实现的安全技术：\n\n* **深度防御**：一种安全方法，确保网络上的每个系统都尽可能安全。\n\
  * **默认拒绝**：禁止所有未显式许可的通信。\n* **默认允许**：允许所有未显式禁止的通信。\n* **最小权限**：降低执行各种操作时的授权级别。\n\
  * **瓶颈点**：迫使攻击者通过狭小的通道规避网络。\n\n以下是防火墙测试方法：\n\n* **Ping**：要检查防火墙是否允许互联网控制消息协议（ICMP）流量，请使用\
  \ `ping` 命令：\n```bash\nping <IP>\n```\n这可以支持基本的连通性验证。\n\n* **端口扫描**：要发现系统上哪些端口是开启，请使用端口扫描器（如\
  \ `Nmap`）。这有助于定位任何未使用的开放端口。\n* **测试防火墙规则**：要测试防火墙的行为，请创建特定的规则。例如，通过尝试阻止或允许特定的端口或\
  \ IP 地址，查看防火墙的行为是否符合预期。\n* **渗透测试**：为了发现网络漏洞并评估防火墙阻止未经授权访问的能力，请进行伦理黑客或渗透测试。\n\n\
  ## 欺骗\n欺骗背后的想法是为恶意用户创建一个虚假的攻击面感知。欺骗有以下几个优点：\n\n* 高性效益比\n* 支持策略分析\n* 易于部署和使用\n\n\
  ## 蜜罐方法\n蜜罐是针对恶意人员具有吸引力的精心制作的信息、服务、数据或其他任何资源。它用于诱骗黑客进入欺骗系统。\n\n蜜罐是一种用于检测、偏离或研究未经授权使用信息系统尝试的安全机制。蜜罐方法涉及部署一个具有真实系统漏洞的系统或网络，诱骗攻击者与之交互。蜜罐的主要目的是收集攻击者使用的战术、技术和程序（TTP）信息，并将他们从实际生产系统中分散。\n\
  \n以下是蜜罐方法的关键点：\n\n**蜜罐类型：**\n\n* **研究蜜罐**：用于研究和理解攻击者的战术。这些蜜罐通常部署在公共网络中。\n* **生产蜜罐**：设计用于模拟真实系统，但在生产环境中使用，以检测并将攻击引离关键基础设施。\n\
  * **高交互蜜罐**：功能完整的系统，模拟真实的服务和操作系统，允许与攻击者进行深度交互。\n* **低交互蜜罐**：仅模拟攻击者经常针对的服务和协议。它们的功能有限，以降低被破解的风险。\n\
  \n**部署：**\n\n\n\n\n\n-   蜜罐可以部署在各种网络层级，包括边界、内部网络，甚至特定的应用程序内部。\n-   它们可以是物理系统，也可以是虚拟系统，取决于部署的需求和目标。\n\
  \n### 目标：\n- **检测**：蜜罐设计用于检测和记录未经授权的访问或活动。与蜜罐的任何交互都可能是恶意的，因为在正常情况下它不应该被访问。\n- **分析**：蜜罐为分析受受攻击者所使用的工具、战术和程序提供了宝贵的数据。这些信息可用于改进整体安全措施。\n\
  - **分散攻击者注意力**：通过将攻击者引入蜜罐，组织可以分散其对实际生产系统的注意力，为响应和缓解威胁赢得时间。\n\n### 挑战\n- **被破解风险**：部署蜜罐面临蜜罐本身可能被破解的风险。这需要仔细的配置和监控以最大限度地降低这种风险。\n\
  - **伦理考虑**：蜜罐的使用引发了伦理考量，因为它涉及到故意创建一个带有漏洞的系统来吸引攻击者。\n- **法律考虑**：组织在部署蜜罐时需要考虑法律影响，特别是当它们被用于与潜在攻击者交互时。未经授权的访问和数据收集可能会引发法律问题。\n\
  - **与安全运营集成**：蜜罐应集成到组织的整体安全运营和事件响应流程中，以确保任何发现都能得到及时处理。\n\n![](img/Figure-1.8.jpg)\n\
  \n**图 1.8：蜜罐生命周期***\n\n## SSH 协议\n\n该协议在客户端-服务器模型中运行，由 SSH 客户端发起与 SSH 服务器的连接。连接建立由\
  \ SSH 客户端发起，利用公钥加密验证 SSH 服务器的合法性。在设置阶段之后，SSH 协议采用稳健的对称加密和哈希算法来确保客户端与服务器之间交换数据的机密性和完整性。数据传输过程中采用了加密技术以防止窃听或拦截，从而确保登录凭据和命令输出等敏感信息的机密性。SSH\
  \ 基于 TCP 运行，利用了其可靠性以及在需要传输数据时信号的能力。\n\n### SSH 的关键属性：\n- **加密**：所有数据（包括登录凭据和会话命令）在传输过程中都会经过加密，即使被拦截也能保持机密性。\n\
  - **身份验证**：SSH 使用各种方法（如密码、公钥加密和高级技术，如双因子认证）来验证用户身份。公钥认证因其更高的安全性而通常受青睐。\n- **密钥交换**：在客户端-服务器连接后，会执行密钥交换以建立共享秘密密钥。该密钥随后被用于加密客户端与服务器之间交换的数据。\n\
  - **端口转发**：SSH 促进了安全隧道的创建，允许将特定的网络连接从客户端转发到服务器或反之。这对于访问其他因网络限制而受限的服务非常有价值。\n\n##\
  \ 访问控制列表\n\n访问控制列表 (ACL) 是一组规则或条件，规定了在网络或系统资源上允许或拒绝执行的操作。ACL 常用于计算机安全和网络技术中，用于控制对文件、目录、网络资源或服务的访问。\n\
  \n### 组成\n- **主体**：尝试访问资源的实体（用户、组或系统进程）。\n- **对象**：主体尝试访问的资源（文件、目录、网络服务等）。\n- **权限**：在对象上允许或拒绝的特定操作或过程。这可能包括读取、写入、执行、删除等许多项。\n\
  - **条件**：应用规则必须满足的额外标准。例如，网络 ACL 可能包含基于源或目的 IP 地址、端口号或协议的条件。例如：\n    - 允许用户 `Alice`\
  \ 读取和写入文件 `example.txt`。\n    - 拒绝来自特定 IP 地址范围的所有入站流量。\n\n### 使用 ACL 的益处\n- **简化用户识别**：使用访问控制列表使用户识别变得更容易。ACL\
  \ 保证了系统只有授权的用户和流量才能访问。\n- **工作输出**：与实现相同目的的其他技术相比，ACL 提供了性能上的优势。访问控制列表不会影响路由设备的性能，因为它们直接设置在设备的转发硬件上。相比之下，状态检测防火墙是是种不同的软件，可能会导致性能下降。此外，当流量受到控制时，网络可以运行得更高效。\n\
  - **控制**：管理员可以使用 ACL 对网络中各个网络节点上的用户和流量权限进行更精确的控制。它们有助于控制对网络端点的访问以及流在内部网络之间的流量。\n\
  \n## 虚拟专用网络\n\nVPN 是一种在不安全性较差的网络（如互联网）上建立安全且加密连接的技术。VPN 为用户提供了一种方法，通过用户设备与目标网络之间创建虚拟加密隧道，在互联网上安全地访问私网络。VPN\
  \ 使用加密算法保护通过互联网传输的数据，例如安全套接层 (SSL) 和传输层安全 (TLS)。\n\n### VPN 连接的优势\n- **安全加密**：为了读取数据需要加密密钥。如果没有暴力破解，计算机解码这些代码需要数百万年。有了\
  \ VPN，即使在公共网络上你的在线活动也会被隐藏。\n- **隐藏你的位置**：本质上，VPN 服务器充当你的在线代理。系统的精确位置无法确定，因为人口统计位置数据来自不同的服务器。此外，大多数\
  \ VPN 提供商不维护活动日志。另一方面，某些服务供应商会记录你的活动但保持信息私密。这意味着任何关于你当前和过去用户行为的信息都将永远保密。\n- **访问区域内容**：并不是每个网站都能从任何地方访问区域内容。网站和服务的内容通常限制在特定地理位置的用户。标准连接使用各地的本地服务器来确定你的确切位置。这意味着你在旅行或从海外访问时无法访问国内内容。通过启用\
  \ VPN，你可以通过连接到另一个国家的服务器来“更改”你的位置。\n- **安全数据传输**：如果你远程工作，可能需要访问公司网络上的重要文件。出于安全考虑，此类数据必须通过安全连接发送。通常情况下，访问网络需要\
  \ VPN 连接。VPN 服务连接到私有服务器并使用加密方法来降低数据泄露的风险。\n\n## 入侵防御系统 (IPS) 和 入侵检测系统 (IDS)\n\n\n\
  \n\nIDS 监控网络或系统活动，以检测恶意行为或违反安全策略的情况。它能够检测并警告管理员潜在的安全事件。当检测到可疑活动时，IDS 会生成警报，这些信息可能包含攻击性质、受影响的系统以及潜在影响。\n\
  \n- `基于签名的检测`：已检测出的威胁的行为可用于检测后续的相同威胁。然而，它无法检测完全未知的威胁。\n- `基于异常的检测`：基于检测特定流量流中的异常。然而，它可能会产生误报，并且如果异常范围设置不当，可能会允许恶意内容通过。\n\
  - `内存保护**：这是一组机制，旨在防止同一系统上的一个进程擦除另一个进程的内存。进程执行监控，结合终止看似为恶意的进程的能力，构成了进程保护。\n- `内联网络设备`：通过将网络设备直接放置在网络通信的路径上，这种入侵防御技术使设备具备在攻击包通过其接口时对其进行修改和拦截的能力。\n\
  - `会话抢占`：这种入侵防御技术向连接的两端发送 `TCP RST` 数据包以结束 `TCP` 会话。发送 `TCP RST` 是为了响应检测到的尝试攻击，从缓冲区中清除尝试的利用并防止其发生。\n\
  - `网关交互设备`：这种入侵防御策略允许检测设备与路由器或防火墙等网络网关设备进行动态交互。当检测到尝试攻击时，检测设备可以引导路由器或防火墙拦截攻击。\n\n\
  ## Web 安全\n\n保护网站免受未经授权的利用、访问、更改、破坏或中断的行为被称为网站安全。\n\n- `HTTPS`：使用 `HTTPS` 保证连接的安全和加密。它结合了\
  \ `SSL/TLS` 和 `HTTP` 协议，为用户提供一个与网站交互的安全界面。此外，启用 `HTTPS` 的网站在搜索结果中的排名更高。\n- `XSS\
  \ 保护`：实施保护措施防止攻击者将恶意脚本插入其他用户正在查看的网站。安全头部、输出编码和输入验证都可以帮助实现这一点。\n- `CSRF 保护`：确保只有授权用户才能发起敏感的网站操作，并使用反\
  \ CSRF 令牌来防御跨站请求伪造 (`CSRF`)攻击。\n- `SQL 注入预防`：对用户输入进行清理和验证，以防止 SQL 注入攻击，攻击者通过用户输入操纵\
  \ SQL 查询以获得对数据库的非法访问。\n\n## 事件响应\n\n事件是指一组或多个安全事件或条件，需要采取行动并关闭以维持可接受的风险状况。事件响应是快速检测事件、最小化损失和破坏、缓解被利用的弱点以及恢复\
  \ IT 服务的能力。\n\n![](img/Figure-1.9.jpg)\n\n**图 1.9:** 事件响应\n\n### 事件响应的必要性\n\n事件响应的必要性在于及时高效地响应安全泄露。这对于几个原因非常重要：\n\
  \n- 通过处理当前事件获得的知识，更好地为处理即将发生的事件做准备。\n- 为数据和系统提供更好的保护。\n- 协助处理事件期间可能出现的任何法律问题。\n\
  - 遵守规定对数据进行同步高效保护的法律法规、政策和指南。\n\n### 事件处理阶段\n\n事件处理过程涉及几个阶段，例如：\n\n- `准备`：组建并培训事件响应团队，以及获取所需的设备和用品。\n\
  - `检测与分析`：识别安全漏洞并通知组织即将到来的攻击。\n- `抑制`：减轻事件影响的一种策略是抑制。\n- `消除与恢复`：完成检测和分析循环以结束事件并开始修复过程。\n\
  - `事后活动`：准备关于事件原因、成本的详细报告，以及未来针对类似攻击的预防措施。\n\n## 结论\n\n本章提供了 Linux 操作系统、计算机网络和信息安全的基础知识。这些是网络安全之旅中的基础主题。掌握这些基础概念使你能够理解如何与\
  \ Linux 工作，并获得网络基础知识，这对于理解网络中的数据流起着至关重要的作用。此外，获得信息安全的基础知识让你理解计算机安全动态格局中常见的挑战和解决方案。\n\
  \n在接下来的章节中，我们将探索建立安全的实验室环境，以便实践练习的无缝执行。这种方法旨在增强我们的学习体验，并从每次实验室课程提取最大的知识。\n\n## 第\
  \ 2 章：创建一个安全的实验室环境\n\n### 引言\n\n开始创建安全的实验室环境是为各种操作、实验和学习体验提供受控且保护空间的关键步骤。建立这样的环境可以确保一个安全的场所，用于探索各种任务，而不会损害您的系统完整性或面临外部漏洞。选择虚拟机\
  \ (`VMs`) 来实施任务是一项战略决策，在灵活性、可扩展性和安全性方面具有许多优势。虚拟化技术允许你在单台物理机上创建多个隔离的操作系统实例，为各种任务提供动态且高效的环境。\n\
  \n### 结构\n\n在本章中，我们将讨论以下主题：\n\n- 什么是虚拟化以及如何实现？\n- 安装安全的实验室环境\n- 用于安全实验的虚拟机的逐步设置\n\
  - 为即将进行的实践练习准备实验室环境\n\n## 虚拟化\n\n虚拟化是将计算机硬件资源划分为多个执行环境的框架或方法。这是通过应用一个或多个概念，如软件分区、时间共享以及部分或完整的机器模拟或仿真实现的。这种技术允许创建事物的虚拟（逻辑上的而非物理上的）版本，例如操作系统、存储设备或网络资源。\n\
  \n主机操作系统可以运行多个虚拟机，每个虚拟机都具有特定操作系统的特性。\n\n### 虚拟机\n\n虚拟机是一种软件构造，允许用户将现有硬件虚拟化，以便在同一硬件上运行多个操作系统。\n\
  \n- 它配置了一个或多个处理器、内存、存储器和网络连接。\n- 虚拟机只能看到它被配置的资源，而看不到主机上物理可用的所有资源。\n\n### 虚拟机程序 (Hypervisor)\n\
  \n虚拟机程序充当虚拟机和物理硬件之间的桥梁，实现无缝通信和资源分配。它将底层硬件从客户操作系统中抽象出来，允许它们独立运行同时高效地共享可用资源。\n\n\n\
  \n\n\n![](img/Fig-2.1.jpg)\n**图 2.1:** *虚拟机管理程序*\n\n## 安装 VirtualBox\n\nVirtualBox\
  \ 是一款免费且开源的虚拟化软件，允许用户在单台计算机上运行多个操作系统。它创建了虚拟机（VM），虚拟机是利用宿主机物理硬件的模拟计算机。这允许用户在不影响其主操作系统的情况下，测试不同的操作系统、软件应用程序和配置。\n\
  \n欲需更多详情和信息，请访问以下链接：[`www.virtualbox.org/`](https://www.virtualbox.org/) (Oracle\
  \ VM VirtualBox)。\n\n以下是下载和安装 VirtualBox 的步骤：\n\n1. 要下载 Oracle VM VirtualBox，请访问以下链接：[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)\n\
  \    ![](img/Fig-2.2.jpg)\n    **图 2.2:** *安装虚拟机*\n\n2. 下载开始，下载完成后，打开文件安装 VirtualBox。\n\
  \    ![](img/Fig-2.3.jpg)\n    **图 2.3:** *安装向导*\n\n3. 如果你想更改位置，请点击“浏览”。否则，你可以保持默认并点击“下一步”。\n\
