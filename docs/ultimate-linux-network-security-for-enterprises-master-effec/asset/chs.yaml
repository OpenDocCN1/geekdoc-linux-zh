  \   ![](img/Fig-4.14.jpg)\n   **图 4.14:** 允许连接\n\n6. 如果规则已存在，它将不会再次添加规则，你会收到“Skipping\
  \ adding the existing rule”的输出。\n   用于 `allow` 或 `deny` 来自任何特定端口或该端口的任何特定包的流量。\n\
  \   ![](img/Fig-4.15.jpg)\n   **图 4.15:** 允许或拒绝流量\n\n7. 为了 `allow` 来自特定 IP 地址或特定子网的连接：\n\
