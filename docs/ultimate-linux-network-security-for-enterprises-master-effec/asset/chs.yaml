  \    [root@HQDEV1 ~]# systemctl disable firewalld\n    ```\n\n### 入侵检测防御系统\n\n一种名为\
  \ IDPS（入侵检测防御系统）的安全技术结合了 IDS 和 IPS。它监控系统操作，寻找恶意活动、非法访问和策略违规。通过结合 IDS 和 IPS，IDPS\
  \ 能够在检测的同时停止有害活动。为了企业保护其网络和系统免受各种网络威胁，如恶意软件、拒绝服务 (DoS) 攻击和未经授权的访问尝试，IDPS 因此是一个关键工具。\n\
  \n## 入侵检测防御系统的类型\n\n现在的 IDPS 有多种类型。虽然某些被设定为适用于任何类型的网络，但其他仅为特定类型的网络设计。最常见的 IDPS 类型包括：\n\
  \n![](img/Fig-10.7.jpg)\n\n**图 10.7：** *IDPS 的类型*\n\n*   **基于网络的 IDPS**：网络边界设备（如防火墙或路由器）托管基于网络的\
  \ IDPS。它监控所有入站和出站网络流量并具有停止有害活动的能力。\n*   **基于主机的 IDPS**：基于主机的 IDPS 位于服务器或工作站上。除了监控进出主机的流量，它还可以采取行动停止有害流量。\n\
  *   **无线 IDPS**：无线 IDPS 的目的是监控并保护无线网络。通常由无线控制器或访问点托管。为了检测潜在的安全漏洞，无线 IDPS 实时分析无线网络数据，寻找模式和异常。\n\
  \n\n\n\n![](img/Fig-10.10.jpg)\n图 10.10: 无线 IDPS*\n\n## 入侵检测与防御系统的最佳实践\n\n在按照下图所示设置\
  \ IDPS 时，请记住以下需要遵循的最佳实践：\n\n![](img/Fig-10.11.jpg)\n图 10.11: *IDPS 最佳实践*\n\n## Snort\
  \ 和 Suricata\n\nSuricata 和 Snort 已经成为两种强大的开源网络安全解决方案和入侵检测解决方案。这些 IDS 在保护网络免受恶意活动以及检测潜在威胁方面发挥着关键作用。\n\
  \n![](img/Figure-10.12.jpg)\n图 10.12: *Snort 与 Suricata 的对比*\n\n### 为什么你应该使用 Snort？\n\
  \n如果你正在考虑使用 Snort，有几个选项可以探索。最初，你可以选择下载并将其安装在你的系统或网络上。一旦 Snort 开始运行，你将需要整合规则以指示它监控网络流量中的哪些内容。主要的主要的规则集可供选择：“社区规则集”（Community\
  \ Ruleset）和“Snort 订阅者规则集”（Snort Subscriber Ruleset）。订阅规则集仅供订阅者访问，由 Cisco Talos 精心制作和验证。订阅者在规则发布给\
  \ Cisco 客户后，即可实时访问这些规则。相反，社区规则集由 Snort 社区开发并由 Cisco Talos 审核，所有用户都可以免费访问。这些规则可以从网站获取并实施到你的网络环境中。\n\
  \n## 安装和配置 Snort\n\nSnort 是一个免费的开源的网络入侵检测和防御系统。它可以安装在 Linux、Windows 和 macOS 操作系统上。在本节中，我们将讨论在\
  \ Linux 系统上的安装。\n\n### 步骤 1：安装依赖项\n\n假设所有所需的依赖项已经安装，我们必须继续安装程序。使用以下命令安装依赖项：\n\n\
  ```bash\nsudo apt-get install build-essential libpcap-dev libpcre3-dev libdumbnet-dev\
  \ bison flex zlib1g-dev liblzma-dev openssl libssl-dev libnghttp2-dev\n```\n\n![](img/Figure-10.13.jpg)\n\
  图 10.13: *安装 Snort 的前提条件*\n\n### 步骤 2：下载并提取 Snort\n\n访问官方网站获取最新版本的 Snort。你可以使用以下命令进行下载：\n\
  \n```bash\nwget https://www.snort.org/downloads/snort/snort-2.9.20.tar.gz\n```\n\
  \n![](img/Fig-10.14.jpg)\n图 10.14: *下载 Snort 的 tar 包*\n\n下载完成后，使用以下命令解压下载的压缩包：\n\
  \n```bash\ntar -xzf snort-2.9.20.tar.gz\n```\n\n### 步骤 3：配置和安装 Snort\n\n在 Snort\
  \ 压缩包解压后，使用以下命令进入提取目录：\n\n```bash\ncd snort-2.9.20\n```\n\n**运行以下命令来配置安装**：\n\n\
  ```bash\n./configure --enable-sourcefire --disable-open-appid --prefix=/usr --enable-ipv6\
  \ --enable-perfprofiling --with-libpcap-includes=/usr/include/pcap --with-libpcap-libraries=/usr/lib/x86_64-linux-gnu\n\
  ```\n\n![](img/Figure-10.15.jpg)\n图 10.15: *配置 Snort 以安装*\n\n使用此命令将使用所需的设置进行配置。你现在可以通过执行以下命令开始安装：\n\
  \n```bash\nsudo make install\n```\n\n![](img/Fig-10.16.jpg)\n图 10.16: *将 Snort 安装到系统*\n\
  \n## 安全外壳 (SSH)\n\n一种名为 Secure Shell (SSH) 的网络协议允许从一台机器到另一台机器的安全远程登录。确保你的 SSH 连接安全至关重要，因为未经授权的人一旦通过\
  \ SSH 访问你的系统，可能会对你的基础设施造成破坏、窃取机密并导致你整个运营的中断。然而，管理和安全远程访问基础设施并非易事。你必须确保对监督范围内的所有系统、用户和设备的授权访问，并监控每次远程登录。\n\
  \n### 加固你的 SSH 设置\n\n**更新 SSH 包：** 使用以下命令确保你的 SSH 包是最新版本：\n\n```bash\nsudo apt-get\
  \ update\nsudo apt-get install openssh-server\n```\n\n![](img/Fig-10.17.jpg)\n图\
  \ 10.17: *安装 OpenSSH 服务*\n\n**验证系统状态：** 使用以下命令验证系统是否正在运行：\n\n```bash\nsudo systemctl\
  \ status ssh\n```\n\n![](img/Fig-10.18.jpg)\n图 10.18: *检查 SSH 状态*\n\n**配置 SSH 守护进程：**\
  \ 编辑 SSH 守护进程配置文件。主配置文件通常位于 `/etc/ssh/sshd_config`。\n\n```bash\nsudo nano /etc/ssh/sshd_config\n\
  ```\n\n**端口：** 更改默认端口 (22) 以增加安全性。\n\n![](img/Fig-10.19.jpg)\n图 10.19: */etc/ssh/sshd_config*\n\
  \n**使用 SSH 密钥认证：** SSH 密钥提供了更安全的身份验证方法。在你的本地机器上生成密钥：\n\n```bash\nssh-keygen -t rsa\n\
  ```\n\n![](img/Fig-10.20.jpg)\n图 10.20: *生成 RSA*\n\n## 虚拟专用网 (VPN)\n\nVPN（或虚拟专用网）是一种在不安全的网络（如互联网）上创建安全加密连接的技术。它可以帮助你保护在线隐私、访问地理限制内容并绕过防火墙。\n\
  \n![](img/Fig-10.21.jpg)\n图 10.21: *虚拟网络*\n\n## OpenVPN 和 IPsec\n\nOpenVPN 和 IPsec\
  \ 都是 VPN 协议。OpenVPN 是一种运行在 SSL/TLS 之上的灵活协议，提供了易于配置的跨平台兼容性。IPsec 运行在网络层，通常用于站点对点\
  \ VPN。它们之间的选择取决于具体的需求和网络配置。\n\n这些是两种流行的 VPN 协议：\n\n*   **OpenVPN**：OpenVPN 是一种使用\
  \ SSL/TLS 加密的开源协议，可以在任何端口运行。它通常被认为比 IPsec 更安全可靠，但速度较慢且消耗资源。\n*   **IPsec**：IPsec\
  \ 是一套运行在网络层的协议，为数据包提供身份验证和加密。它比 OpenVPN 更快更高效，但也更复杂且难以配置。\n\n## 配置和安全 VPN 连接\n\n\
  以下是在 Kali Linux 系统上配置和安全 VPN 连接的一些步骤：\n\n1.  OpenVPN 是一种流行且安全的 VPN 协议，可以在任何端口运行并使用任何加密算法。\n\
  2.  使用以下命令在 Kali Linux 系统上安装 OpenVPN 包和所需的依赖项：\n\n    ```bash\n    sudo apt install\
  \ openvpn network-manager-openvpn network-manager-openvpn-gnome\n    ```\n3.  安装\
  \ OpenVPN 包后，你需要从 VPN 服务商的网站下载配置文件文件。\n4.  使用 CLI 连接到 VPN 服务器，你需要打开终端并输入以下命令：\n\n\
  \    ```bash\n    sudo openvpn --config /path/to/file.ovpn\n    ```\n    其中 `/path/to/file.ovpn`\
  \ 是你想使用的 OpenVPN 配置文件的路径。\n5.  使用 GUI 连接到 VPN 服务器，你需要安装支持 OpenVPN 的网络管理器，例如 NetworkManager\
  \ 或 Wicd。\n6.  打开终端并输入以下命令：\n\n    ```bash\n    sudo apt install network-manager\
  \ network-manager-gnome or sudo apt install wicd wicd-gtk\n    ```\n7.  安装网络管理器后，你需要使用下载的\
  \ OpenVPN 配置文件添加 VPN 连接。\n\n\n\n\n\n## 8. 要使用网络管理器连接到 VPN 服务器，你需要打开网络管理器应用程序，点击\
  \ VPN 图标，并选择你添加的 VPN 连接。\n\n## 9. 你也可以通过点击 VPN 图标并选择你添加的“断开 VPN”选项来断开 VPN 连接。\n\n\
  ## VPN 隧道与加密协议\n\nVPN 隧道是你的设备与外部网络（如互联网）之间的加密链接。加密可以防止任何人在数据通过隧道传输时截获或修改你的数据。加密类型以及隧道的创建方式取决于你的\
  \ VPN 服务所使用的 VPN 协议。有许多类型的 VPN 协议，每种协议都有不同的优缺点。\n\n### 点对点隧道协议 (PPTP)\n\n点对点隧道协议\
  \ (PPTP) 是最老且最快的 VPN 协议之一，但也是安全性最低的协议之一。它使用弱加密，容易受到各种攻击。不建议用于敏感数据或活动。\n\n![](img/Fig-10.22.jpg)\n\
  \n**图 10.22:** `PPTP`\n\n### 第二层隧道协议 (L2TP)\n\n带有带有协议安全性的第二层隧道协议 (L2TP) 比 PPTP 更安全，因为它使用了更强的加密和身份验证方法。它的速度可能较慢，设置也较复杂。由于使用了特定的端口和协议，它可能会被某些防火墙和路由器拦截。\n\
  \n![](img/Fig-10.23.jpg)\n\n**图 10.23:** `L2TP`\n\n### 安全套接隧道协议 (SSTP)\n\n![](img/Fig-10.24.jpg)\n\
  \n**图 10.24:** `SSTP`\n\n安全套接隧道协议 (SSTP) 是一种使用 SSL/TLS 加密的协议（HTTPS 网站使用的相同加密类型）。它非常安全，并兼容大多数平台和设备。它还可以绕过大多数防火墙和审查，因为它使用了通常用于网络流量的\
  \ 443 端口。互联网密钥交换版本 2 (IKEv2) 是一种为移动设备设计的协议，可以在不同的网络连接之间快速切换并恢复 VPN 会话。它也非常安全快速，因为它使用了\
  \ AES 加密并支持各种身份验证方法。它还可以绕过某些防火墙和审查，因为它可以使用不同的端口和协议。\n\n## 网络服务安全\n\n网络服务安全涉及实施措施来保护在网络内部运行的各种服务，确保它们的可用性、完整性和机密性。这些服务可以包括电子邮件、Web\
  \ 托管、文件共享等。为了增强网络服务安全，组织通常会采用组合策略。实施访问控制（如防火墙和入侵防御系统）来监控和调节进入和离开网络的流量。加密在保护网络服务与其用户之间传输的数据方面起着至关重要的作用，保护信息免受潜在的窃听或未经授权的访问。定期软件更新和补丁管理对于解决网络服务的漏洞至关重要，可以降低恶意攻击者利用的风险。此外，实施强身份验证机制（如多因素身份验证）可以确保只有授权用户才能访问网络服务。持续监控和日志有助于检测并响应潜在的安全事件，从而采取主动的方法维护网络服务安全。总而言之，全面的网络服务安全策略涉及分层方法，结合各种措施来保护网络内多样化的服务。\n\
  \n## 保护域名系统 (DNS) 服务器\n\n![](img/Fig-10.25.jpg)\n\n**图 10.25:** `DNS`\n\n域名系统 (DNS)\
  \ 是一种将域名（如 `www.pppp.com`）转换为 IP 地址（如 `204.79.197.200`）的服务。它容易受到各种攻击，例如 DNS 欺骗、DNS\
  \ 劫持、DNS 缓存中毒和 DNS 放大。\n\n## 保护动态主机配置协议 (DHCP) 服务\n\n![](img/Fig-10.26.jpg)\n\n\
  **图 10.26:** `DHCP`\n\nDHCP 是一项为网络上的主机分配 IP 地址和其他网络配置参数的服务。它容易受到如 DHCP 欺骗、DHCP 饥饿和流氓\
  \ DHCP 服务器等攻击。\n\n## 网络时间协议 (NTP) 安全\n\n![](img/Fig-10.27.jpg)\n\n**图 10.27:** `NTP`\n\
  \nNTP 是一项同步网络上主机时钟的服务。它容易受到如 NTP 欺骗、NTP 反射和 NTP 放大等攻击。为了保护 NTP，你可以使用 `NTPsec`，它是\
  \ NTP 的一个分支，实现了安全改进并修复了漏洞。你还可以使用网络时间安全 (NTS)，这是一种为 NTP 消息提供加密和身份验证的协议，防止窃听和篡改。\n\
  \n## Web 服务器安全\n\n![](img/Fig-10.28.jpg)\n\n**图 10.28:** `Web Server Security`\n\
  \n保护 Web 服务器是一项多方面的工作，对于防御网络威胁和维护在线服务的完整性至关重要。定期更新和补丁管理构成了第一道防线，确保服务器软件、操作系统和应用程序针对已知漏洞进行了强化。\n\
  \n## Kali Linux 加密连接的 TLS/SSL 配置\n\nKali Linux 加密连接的 TLS/SSL 配置是在 Web 服务器和浏览器之间建立安全通信通道的过程。\n\
  \n此过程涉及几个步骤，例如：\n\n*   为你的 Web 服务器生成私钥和证书签名请求 (CSR)。\n*   从信任的证书颁发机构 (CA) 获取签名证书或使用自签名证书。\n\
  *   将证书和私钥安装在 Web 服务器上。\n*   配置你的 Web 服务器启用 TLS/SSL 并指定支持的协议、加密算法和其他选项。\n*   使用\
  \ `sscan`、`openssl` 或在线服务测试你的 Web 服务器的 TLS/SSL 配置。\n\n使用 OpenSSL 为 Web 服务器生成私钥和\
  \ CSR，请遵循以下步骤：\n\n```bash\n# 生成 2048 位 RSA 私钥\nopenssl genrsa -out server.key 2048\n\
  \n# 使用私钥生成 CSR\nopenssl req -new -key server.key -out server.csr\n```\n\n使用 OpenSSL\
  \ 创建自签名证书，请遵循以下步骤：\n\n```bash\n# 生成有效期为 365 天的自签名证书\nopenssl x509 -req -days 365\
  \ -in server.csr -signkey server.key -out server.crt\n```\n\n将证书和私钥拷贝到相应的目录：\n\n\
  ```bash\nsudo cp server.crt /etc/ssl/certs/\nsudo cp server.key /etc/ssl/private/\n\
  ```\n\n找到以下行并确保它们指向正确的文件：\n\n```apache\nSSLCertificateFile /etc/ssl/certs/server.crt\n\
  SSLCertificateKeyFile /etc/ssl/private/server.key\n```\n\n使用 `Ctrl+O`、`Enter`、`Ctrl+X`\
  \ 保存退出文件。\n\n\n\n\n\n# 启用 SSL 模块和默认-ssl 站点\n\n```bash\nsudo a2enmod ssl\nsudo a2ensite\
  \ default-ssl own\n```\n\n# 重启 Apache 服务\n\n```bash\nsudo systemctl restart apache2\n\
  ```\n\n# Web 应用防火墙 (WAF)\n\nWeb 应用防火墙 (WAF) 是用于保护 Web 应用免受 SQL 注入、跨站脚本和暴力破解等常见攻击的安系统。WAF\
  \ 工作在 OSI 模型的应用层，并根据预定义的规则或策略过滤恶意请求。\n\n有几款工具可以帮助你识别并测试 Web 服务器上是否存在 WAF，例如：\n\n\
  * `wafw00f`: 一个基于 Python 的工具，它通过一组 HTTP 请求和方法查询 Web 服务器，并分析响应以检测部署的防火墙。你可以使用 `-a`\
  \ 选项查找所有匹配特征的 WAF，使用 `-t` 选项测试某个特定的 WAF，以及使用启用详细输出的选项。\n\n你可以使用 `apt` 命令或通过克隆其 GitHub\
  \ 仓库在 Kali Linux 上安装这些工具。例如，要安装 `wafw00f,`，可以使用以下命令：\n\n```bash\n# 从 Kali Linux\
  \ 仓库安装 wafw00f\nsudo apt install wafw00f\n\n# 或者克隆 GitHub 仓库\ngit clone [⁷^][7]\n\
  \ncd wafw00f\n\n# 给工具赋予执行权限\nchmod +x setup.py\n\n# 运行工具\n./setup.py --help\n```\n\
  \n# 使用 Wireshark 等工具监控网络流量\n\nWireshark 是监控网络流量的关键工具，可提供数据流的实时洞察。网络管理员使用它来排查连接问题、识别瓶颈并通过分析\
  \ IP 地址、协议和时间戳等包细节来诊断问题。它的用途扩展到协议分析，有助于理解应用程序和设备如何在网络上进行通信。安全专业人员利用 Wireshark 通过检查数据包内容、识别可疑模式和缓解潜在威胁来检测安全事件。\n\
  \n* 使用 Wireshark 等工具监控网络流量是网络管理员、安全分析师和白帽黑客的一项有用技能。\n\n* Wireshark 是一个实时捕获和分析数据包的图形化工具。\n\
  \n在 Kali Linux 上使用 Wireshark 进行网络监控，你需要遵循以下步骤：\n\n1.  使用以下命令在 Kali Linux 上安装 Wireshark：\n\
  \n    ```bash\n    sudo apt install wireshark\n    ```\n\n2.  通过应用程序菜单或在终端输入 `Wireshark`\
  \ 启动 Wireshark。\n\n3.  从可用接口列表中选择你想要监控的网络接口。你也可以使用 `ifconfig` 命令查看网络接口的详情。\n\n4.\
  \  点击绿色的鲨鱼图标开始捕获数据包。你也可以使用红色正方形图标停止捕获数据包。\n\n5.  你可以使用过滤器栏根据各种标准（如协议、源、目的、端口等）对捕获的数据包应用过滤器。你还可以使用表达式生成器创建复杂的过滤器。\n\
  \n# 文件系统安全\n\n文件系统安全是整个系统安全的关键方面，重点保护存储在文件结构中的数据和资源。它涉及实施措施控制访问、防止未经授权的修改并确保文件的机密性和完整性。文件权限是文件系统安全的基础组成部分，规定了哪些用户或系统进程可以读取、写入或执行特定的文件和目录。正确配置的文件权限有助于降低未经授权访问和数据泄露的风险。此外，文件系统安全还包括加密技术，这些技术保护静态数据，使其在没有相应解密密钥的情况下无法读取。定期审核、监控和入侵检测机制对于识别和响应文件系统内的潜在安全事件至关重要，确保对未经授权的访问、数据篡改和其他安全威胁的稳健防御。文件系统安全是数据安全的子集，侧重于保护文件免受未经授权的访问、修改、删除或损坏。\n\
  \n# 文件权限与所有权\n\n这些决定谁可以访问、读取、写入、执行或修改文件的属性。它们通常由文件所有者或系统管理员设置，并可以使用命令或图形化工具进行更改。\n\
  \n### 文件权限\n\n文件权限定义了用户和组对文件或目录可以执行的操作。在 Unix 类操作系统中，这些权限通常被分为三个级别：读取 (r)、写入 (w)\
  \ 和执行 (x)。每个级别分别为文件所有者、与文件关联的小组以及其他人（既不是所有者也不在组的用户）分配。这些权限的组合形成了一组规则，规定了谁可以对文件或目录执行特定操作。例如，一个对所有者具有读和写权限、但对其他人只有读取权限的文件，可以确保只有所有者可以修改该文件。\n\
  \n# 所有权\n\n文件系统中的每个文件和目录都有一个所有者，并与特定的组相关联。所有者是创建文件的用户账户，组是一组共享共同访问权限的用户。所有权决定了分配给文件的初始权限集。所有者通常有权修改权限、更改所有权并控制对文件的访问。同时，组允许一组用户共享共同的访问权限。通过管理所有权组分配，管理员可以控制谁可以对文件和目录执行各种操作。\n\
  \n# 安全工具与实用程序\n\n安全工具和实用程序是帮助用户保护计算机、网络、数据和应用程序免受各种网络威胁（如病毒、恶意软件、黑客或数据泄露）的程序。\n\n\
  # 用于入侵防御的 Fail2ban\n\nFail2ban 是一个监控日志文件恶意活动（如暴力破解攻击）并通过本地防火墙封禁源 IP 地址的工具。\n\n在\
  \ Kali Linux 上使用 fail2ban 可以下步骤：\n\n1.  从 Kali 仓库安装 fail2ban：\n\n    ```bash\n \
  \   sudo apt-get install fail2ban\n    ```\n\n2.  将配置 `/etc/fail2ban/jail.conf`\
  \ 复制到 `/etc/fail2ban/jail.local` 并根据需要进行编辑。你可以启用或禁用不同的监狱（jails），这些部分定义了要保护的服务的日志文件、过滤器、动作和参数。\n\
  \n3.  使用命令重启 fail2ban 服务：\n\n    ```bash\n    sudo service fail2ban restart\n  \
  \  ```\n\n4.  使用命令检查 fail2ban 状态：\n\n    ```bash\n    sudo fail2ban-client status\n\
  \    ```\n\n    你也可以使用以下命令检查特定监狱（如 sshhd）的状态。你会看到被封的 IP 地址数量和监狱的激活时间：\n\n    ```bash\n\
  \    sudo fail2ban-client status <jail>\n    ```\n\n5.  使用命令解禁 IP 地址：\n\n    ```bash\n\
  \    sudo fail2ban-client set <jail> unbanip <ip>\n    ```\n\n# Nessus 或 OpenVAS\
  \ 等安全扫描器\n\n安全扫描器通过与已知漏洞数据库对比，帮助你识别并优先处理系统或网络中的漏洞。Nessus 和 OpenVAS 是可以在 Kali Linux\
  \ 上使用的常用安全扫描器。Nessus 是一个专有工具，为个人使用提供免费版本，为专业使用提供付费版本。\n\n在 Kali Linux 上配置 Nessus，你可以遵循以下步骤：\n\
  \n1.  下载 Nessus。\n\n2.  使用以下命令安装 Nessus：\n\n    ```bash\n    sudo apt install -f/Nessus\
  \ amd64.deb\n    ```\n\n\n\n\n\n3. 使用以下命令启动 `Nessus` 服务：\n\n```bash\nsudo service\
  \ nessusd start\n```\n\n4. 访问 Nessus Web 界面 `https://localhost:8834/`，并按照安装向导创建管理员用户账户并激活\
  \ Nessus。\n\n## 结论\n\nLinux 网络安全专业人员必须优先考虑持续教育，保持对新兴威胁的关注，并定期进行安全审计以识别并解决漏洞。网络分段、双因子认证和定期数据备份是增强整体韧性的必要措施。与开源社区合作以及参与安全论坛可以促进知识共享和集体防御。在组织内部实施全面的安全策略可确保安全措施的一致性。通过整合这些实践，Linux\
  \ 网络安全专业人员可以建立起针对不断变化的威胁格局的稳健防御体系，维护系统的完整性和功能性。\n\n# 索引\n\n## A\n\n### 访问控制 39\n\
