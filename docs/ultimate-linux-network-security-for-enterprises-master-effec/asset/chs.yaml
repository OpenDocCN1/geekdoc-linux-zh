  \n4. 根据你的需求选择内存和处理器。\n\n5. 现在，运行虚拟机。\n    ![](img/Fig-2.8.jpg)\n    **图 2.8:** *在虚拟机上安装\
  \ Parrot OS*\n\n6. 点击`Install Parrot` 图标开始安装。\n    ![](img/Fig-2.9.jpg)\n    **图\
  \ 2.9:** *在虚拟机上安装 Parrot OS*\n\n7. 选择合适的选项并输入你的登录用户名和密码，然后点击`Next` 安装。\n    ![](img/Fig-2.10.jpg)\n\
