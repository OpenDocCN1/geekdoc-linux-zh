  \    **图 2.5:** *设置向导*\n\n5. 安装将开始。安装完成后，点击“完成”。\n\n## 在 VirtualBox 上安装 Parrot Security\
  \ 虚拟机\n\n### Parrot Security\n\nParrot Security 是一个基于 Debian 的 Linux 发行版，专门为安全专业人员、道德黑客和渗透测试人员量定制。这是一个由\
  \ Parrot Project 团队领导的社区驱动项目。该发行版拥有一套全面的安全工具，涵盖了网络分析、漏洞评估、数字取证等许多任务。\n\n*   Parrot\
  \ Security 提供了一个全面的安全工具集，包括信息收集、漏洞评估、渗透测试、密码学、逆向工程等。它作为网络安全专业人士和爱好者执行各种安全相关任务的平台。\n\
  *   Parrot Security 优先考虑用户的匿名性和隐私。它包含了 Tor 浏览器等工具，并提供了对 VPN 的内置支持，使用户在进行安全评估时能够保护自己的在线身份。\n\
  *   作为一个开源项目，Parrot Security 受益于开发者和用户社区，他们为开发做出贡献，并通过论坛和其他渠道提供支持。\n\n以下是下载和安装 Parrot\
  \ Security 的步骤：\n\n1. 访问链接 [`www.parrotsec.org/download/`](https://www.parrotsec.org/download/)\
  \ 下载适用于 VirtualBox 的 Parrot Security OS ISO 文件。\n    ![](img/Fig-2.6.jpg)\n    **图\
