  \ Puppet 5* 和 *Automation with Ansible*，并在多个平台发布了他的在线课程。此外，他还为 Packt 评审了多本书，包括 *Implementing\
  \ Splunk 7, Third Edition* 和 *Splunk Operational Intelligence Cookbook, Third Edition*\
  \ 等。\n\n# 关于技术评审\n![](img/aut1.jpg)\n\n`Surendranath P` 是一位丰富的嵌入式系统开发者，在网络和汽车软件开发方面拥有超过\
  \ 7 年的经验。他工作过 Cisco 交换机、路由器和防火墙，以及使用 `Yocto` 进行 IVI 系统软件开发和平台软件集成。他在海得拉巴的 Vector\
  \ India 受过培训，`Surendra` 在 `C` 和 `DS` 方面的技能值得赞。此外，他还出于兴趣担任过自由职业撰稿人和版主。\n\n# 致谢\n\
