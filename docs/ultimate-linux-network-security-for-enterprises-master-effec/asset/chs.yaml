  \    [root@HQDEV1 ~]# systemctl disable firewalld\n    ```\n\n[译文]\n防火墙是网络安全的一个组件，作为受信任的内部网络与互联网等可能不可信的外部网络之间的屏障。它的主要功能是根据预定义的安全规则控制和监控入站及出的网络流量。防火墙根据既定的规则和策略对数据包进行调节，从而允许或阻止它们。这种控制有助于防止未经授权的访问并保护敏感信息。\n\
  \n防火墙在网络层工作，会检查单个数据包并根据指定的标准决定是否允许或拒绝这些数据包。在 Linux 生态系统中，防火墙配置通常通过 `iptables` 等工具进行管理，它提供了详细的控制；而\
  \ Uncomplicated Firewall（UFW，简化防火墙）则提供了简化的规则设置。\n\n防火墙规则定义了允许或拒绝流量的条件。这包括指定允许哪些服务或应用程序进行通信。防火墙具有默认策略（通常设置为拒绝），这规定了如何处理未被定义规则明确涵盖的流量。这增加了额外的安全层。\n\
