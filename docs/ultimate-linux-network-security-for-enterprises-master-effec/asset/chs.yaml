  \n## 结论\n\n虚拟机（VM）实验室环境的成功安装为各种计算任务提供了一个安全、灵活且动态的平台。通过选择虚拟化技术，用户可以充分利用硬件的潜力，创建隔离实例，并享受资源效率、可扩展性和可移植性带来的好处。\n\
  \n在接下来的章节中，我们将开始对实际实现进行上手探索，深入研究核心概念，例如对访问控制机制的细致维护。此外，我们还将研究防火墙和 IDS/IPS 系统的复杂部署，深入理解它们的内部原理，并积极将这些知识转化为有效的实现。\n\
  \n# 第 3 章\n\n## Linux 中的访问控制机制\n\n### 引言\n\n作为数字环境的守护者，访问控制机制通过管理权限和入口，确保只有经过授权的用户或系统才能与资源交互。这些保护措施对于保护网络安全领域的私有数据和维护数字环境的完整性至关重要。\n\
  \n一种被称为访问控制的详尽安全机制被用于管理和限制对资源的访问。这些资源可能包括实际区域、网络、数据库或文件，访问控制确保只有具有权限的人才能使用或更改它们。基于角色的访问控制（`RBAC`）、强制访问控制（`MAC`）和自主访问控制（`DAC`）是三大基本类别。\n\
  \n### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   Linux 访问控制机制简介\n*   探索不同的访问控制类型\n*   理解基于访问类型的\
  \ Linux 环境\n*   根据组织对不同用户实施权限\n*   保持环境安全的最佳实践\n\n## Linux 中的访问控制机制\n\n### 资源与所有权\n\
  \n*   **用户**：用户是与计算机系统交互的人或系统。它是所有程序操作、文件创建和修改以及系统请求的起点。每个用户账户关联一个用户 ID。\n*   **进程**：进程是运行中的程序。在系统中，任何时刻都有多个进程正在运行。用户创建进程来执行特定的操作。每个进程都有其自己的资源和地址空间。\n\
  *   **文件**：在计算机上，文件是存储的数据组。它们可以代表程序、图片、文档等。\n    ![](img/Fig-3.1.jpg)\n    **图 3.1:**\
  \ *资源与所有权*\n\n### 沙箱\n\n沙箱的主要目的是提供一个与系统隔离的封闭环境。在沙箱中，你可以在受控的环境中运行未知的代码，而不会干扰其他运行的程序。这种隔离有助于控制错误或恶意代码带来的危害。\n\
  \n它被认为是防御零日漏洞的有效系统，零日漏洞是全新的且从未见过的威胁。\n\n沙箱在各种情况下都非常有用：\n\n*   **安全测试**：软件开发和测试经常使用沙箱。在沙箱环境中，开发者可以测试新的代码或程序，因为它提供了灵活性而不会损害整个系统。\n\
  *   **网页浏览**：浏览器中的每个标签页或进程都运行在自己的沙箱环境中，因此即使访问了恶意网站，影响也局限于该标签页的沙箱环境。\n\n\n\n\n\n\
  - **虚拟化**：虚拟机和容器可以被视为沙箱的一种形式。它们允许在隔离环境中执行应用程序或进程，从而提供额外的安全保护层。\n- **利用高级网络和支持**：通过使用合适的沙箱环境，你可以探索高级网络功能，并在这些功能符合你的预期工作环境时对其进行测试。\n\
  - **防止未来的攻击**：如果危险被限制在沙箱环境中，IT 人员或外部网络安全专家可以在隔离环境中对其进行研究。仔细检查威胁有助于发现趋势，从而帮助防止未来发生类似的攻击。\n\
  \n## 访问控制类型\n\n访问控制是一种安全措施，用于规范和限制对资源或系统的访问。它确保只有授权的实体（如用户或系统）可以与某些资源交互，同时防止未经授权的实体访问敏感信息或执行特定操作。访问控制是计算机安全的一个基本方面，通过各种机制和技术实现。以下是某些访问控制类型：\n\
  \n### 任意访问控制\n\nDAC（或自主访问控制）是一种安全访问控制技术，它通过由主体或对象所有组建立的策略来管理对象的访问。在身份验证过程中，将使用用户名和密码等凭据来验证用户并在\
  \ DAC 内部设置控制。主体（所有者）有权向其他用户提供对验证对象或信息的访问，这就是 DAC 的“任意”之处。换句话说，对象的访问权限是由所有者决定的。\n\
  \nDAC 是计算机系统安全概念，赋予管理员或所有者对资源访问的控制权。对象（如文件、目录或网络）的所有者有权在 DAC 下决定是否对其提供访问。\n\n任意访问控制的主要特征包括：\n\
  \n- **所有者控制**：资源所有者有权选择谁可以使用该资源以及他们可以在该资源上执行什么操作。所有者可以授予或撤销权限。\n- **授权程度**：DAC 通常涉及赋予个人或组不同程度的授权。常见的权限包括读、写、执行和删除。这些权利可以根据所有者的主意授予。\n\
  - **访问控制列表 (ACLs)**：ACL 是 DAC 中建立访问限制的一种流行方法。ACL 是附加在项目上的权限列表，描述了哪些操作是允许的，哪些用户或系统进程被授权访问。\n\
  - **自由度**：由于资源所有者可以选择访问控制，DAC 提供了很大的自由度。然而，如果所有者未能仔细监控权限，可能会导致未经授权或不当的访问，这种灵活性也会变成一个缺点。\n\
  - **困难性**：在大规模系统中管理 DAC 可能困难，并可能导致权限过度。此外，它可能不如某些其他类型的访问控制（如强制访问控制 MAC）那样精确。\n\n\
  **注意**：你将在标准 Linux 下学习更多关于 DAC 的知识。\n\n### 强制访问控制\n\n强制访问控制（MAC）网络安全系统旨在提供或限制对组织内部机密和受保护数据的访问。组织内部人员的分级决定了访问权限的分配方式。用户被限制在与其许可级别匹配（或低于）的资源上，而管理员是唯一的控制者。系统会自动验证用户访问资源及其所属类别的资格。\n\
  \n在使用 MAC 之前，公司必须投入时间和资源来充分理解流程控制。这涉及对人员、流程和可用资源的分析，以及建立标签和类别等属性和规则。\n\n强制访问控制的主要特征包括：\n\
  \n- **集中化控制**：MAC 由系统管理员或安全策略进行集中控制。访问决策基于分级方式，而不是根据资源所有者的主意。\n- **卓越的数据安全性**：由于这是一个强制性系统，公司可以保证重要和私密信息被安全存储，且不太可能泄露。由于其细密的设计、测试和强化，MAC\
  \ 是最安全的访问系统之一。企业可以放心，因为只有某些经过批准的人员才能看到所需的信息，且在没有所需权限的情况下无法更改数据。\n- **隐私**：由于该系统是集中的，其他人无法简单地更改类别或访问级别。只有高级官员才能编辑它，为企业提供了一定程度的隐私保护，帮助其保护数据。\n\
  \n**注意**：你将在 SELinux 下学习更多关于 MAC 的知识。\n\n### 基于角色的访问控制\n\n系统访问还可以通过基于角色的访问控制（RBAC）方法进行限制，这有时被称为基于角色的安全。有必要设置权利权限以允许授权用户访问系统。基于角色的访问控制是大企业使用的流行工具，根据员工的职位和职责为他们提供不同程度的访问。这保护了隐私信息，并确保员工只能访问和执行履行职责所必需的操作。\n\
  \n因此，如果低级人员执行职责时不需要敏感数据，他们通常无法访问这些数据。这在雇佣承包商和第三方以及拥有大量员工时特别有用，因为此时严密监控网络访问具有挑战性。\n\
  \nRBAC 的核心组件包括：\n\n- **用户**：这些与系统交互的个人。用户被分配一个或多个角色，其访问权限由与这些角色相关的权限决定。\n- **角色**：定义了具有该角色的用户可以执行的操作或过程的权限集。例如，系统可能有“管理员”、“经理”和“用户”等角色，每个角色具有不同的访问级别。\n\
  - **权限**：这些是在系统中可以执行的单个访问权限或操作。权限被分配给角色，用户通过被分配特定角色获得这些权限。\n- **角色分配**：这涉及根据工作职责将用户与特定角色关联。用户可以拥有一个或多个角色，每个角色提供特定级别的访问。\n\
  \n![](img/Fig-3.2.jpg)\n\n**图 3.2**：*基于角色的访问控制*\n\nRBAC 提供了若干优势，包括：\n\n- **简单性**：基于角色管理权限可以简化访问控制管理。\n\
  - **可扩展性**：随着组织增长，通过将新用户分配到相应角色来添加用户比定义个人权限要容易。\n- **安全性**：RBAC 有助于实施最小权限原则，确保用户拥有执行其工作功能所需的最低级别权限。\n\
  \n## 访问控制命令\n\n以下是一些用于访问控制的命令：\n\n```\nsudo (Superuser Do) 允许许可的用户以超级用户或其他用户的身份执行命令，如\
  \ sudoers 文件中所指定的。\n```\n\n\n\n\n要创建另一个用户账户，请使用命令 `sudo useradd <username>`，设置密码时使用命令\
  \ `sudo passwd <user>` 并输入密码。\n\n![](img/Fig-3.3.jpg)\n\n**图 3.3:** `sudo`\n\n如果你想给某个用户授予管理员权限，可以使用\
  \ `sudo visudo` 在 sudoers 文件添加该用户。\n\n![](img/Fig-3.4.jpg)\n\n**图 3.4:** `/etc/sudoers.tmp`\n\
  \n如果非根用户尝试访问特权文件和文件夹，该事件将被记录。\n\n现在，如果你想根据角色授予任何用户访问特定文件和文件夹的权限，请打开 sudoers 文件并添加以下内容：\n\
  \n`<username> ALL=(ALL:ALL) NOPASSWD: </path of file or directory>`\n\n![](img/Fig-3.5.jpg)\n\
  \n**图 3.5:** `/etc/sudoers.tmp`\n\n使用 `sudo visudo -c` 命令，你可以检查 sudoers 文件是否存在任何语法错误。\n\
  \n![](img/Fig-3.6.jpg)\n\n**图 3.6:** `sudo visudo -c`\n\n现在，如果 xyz 用户尝试访问 passwd\
  \ 文件，将获得访问权限，但对任何其他特权文件或文件夹将不会获得访问权限。\n\n![](img/Fig-3.7.jpg)\n\n**图 3.7:** `sudo\
  \ su`\n\n根据访问控制，Linux 主要分为两种类型：\n\n*   标准 Linux：基于 DAC（自主访问控制）\n*   安全增强型 Linux\
  \ (SELinux)：基于 MAC（强制访问控制）\n\n## 标准 Linux（Standard Linux）\n\n通常，“标准 Linux”指的是遵循特定规定和标准的\
  \ Linux 操作系统发行版。Linux 是一个开源操作系统内核，与 Unix 相似，是多个操作系统发行版的基础。Linux 发行版（或称为 distro）是\
  \ Linux 操作系统的完整封装版本，包含了桌面环境、包管理系统、库和 Linux 内核。\n\n标准 Linux 构建在被称为“自主访问控制”（DAC）的安全范式之上，该范式允许资源的所有者（无论是文件还是系统）控制对该资源的访问。在\
  \ DAC 系统中，资源所有者有权决定授予哪些权限以及授予谁访问该资源。\n\n以下是几个被视为标准或被频繁使用的流行 Linux 发行版：\n\n*   **Ubuntu**：Ubuntu\
  \ 基于 Debian，以其用户友好型和强大的社区支持而闻名。它提供桌面版和服务器版。\n*   **Debian**：这个稳定且灵活的发行版是许多其他发行版（包括\
  \ Ubuntu）的上游基础。\n*   **Fedora**：红帽（Red Hat）支持 Fedora，它以利用最新的软件和技术而闻名。它经常被用作红帽企业\
  \ Linux (RHEL) 日后可能包含的功能的测试场。\n*   **CentOS**：CentOS 基于与 RHEL 相同的架构，旨在提供一个开源、免费且持久的替代。\n\
  *   **Arch Linux**：得益于这种流行、灵活且简单的操作系统的滚动发布机制，用户可以定期安装更新，而无需等待特定的版本发布。\n*   **openSUSE**：由\
  \ SUSE 支持，openSUSE 同时提供稳定版（Leap）和滚动发布版（Tumbleweed）。它提供了系统管理工具 YaST 设置。\n*   **Linux\
  \ Mint**：这种基于 Ubuntu 的桌面替代品专注于提供各种用户友好的桌面环境。\n\n这些发行版使用了广泛接受的 Linux 标准，例如 Linux\
  \ 标准基础 (LSB) 和文件系统层次结构标准 (FHS)，这有助于发行版之间的兼容性。\n\n为了理解如何对不同用户实施访问控制，我们首先需要了解不同的用户、用户管理以及可以授予用户的权限。\n\
  \n## 用户（Users）\n\n用户（无论是系统还是人类）与计算机系统通信。它是所有程序操作、文件创建和修改以及系统服务请求的起点。每个用户账户都与一个用户\
  \ ID（UID）关联。\n\n### 普通用户（Regular Users）\n\n*   使用计算机系统处理日常事务和应用程序的终端用户被称为普通用户。\n\
  *   普通用户拥有的资源通常只有他们自己的文件和最基本的系统功能。\n*   在没有管理员或特殊访问权限的情况下，他们执行常规任务，包括文字处理、上网和使用应用程序。\n\
  \n### 特权用户（Privileged Users）\n\n*   也被称为超级用户（super users）。特权用户比普通用户拥有更高级的功能。这些功能可能包括安装软件、执行管理功能和修改某些系统设置。特权用户可以管理系统配置的方面，并执行普通用户无法执行的任务，但他们通常没有完全的管理员控制权。\n\
  \n### 网络用户（Network Users）\n\n*   网络用户侧重于管理、配置和故障排除活动。\n*   他们经常拥有调整网络配置、控制网络硬件和解决网络相关问题的权限。\n\
  *   网络用户可能负责管理 IP 地址、建立和维护网络连接以及监控网络的整体健康状况。\n\n### 用户管理（Managing Users）\n\n*  \
  \ 最高级别的访问权限和责任归属于用户管理员，通常被称为系统管理员（system administrators）。\n*   系统管理员负责确保整个系统的安全。他们对系统拥有完全控制权，包括安装软件、修改用户账户和更改系统设置的能力。他们负责用户账户管理、安全设置、软件升级和常规系统维护等工作。\n\
  \n## 集中式用户管理（Centralized User Management）\n\n集中用户管理是指从单一的集中化位置管理用户账户和权限的实践。这种方法提供了许多优势，特别是在具有多个应用程序和服务的组织中。\n\
  \n根据您的需求，有不同的选项可用，包括：\n\n*   **轻量级目录访问协议 (LDAP)**：它是一种用于访问和维护目录服务的开放标准协议。它通常用于网络环境中的集中身份验证和授权。\n\
  \    *   LDAP 是为目录服务设计的，这类数据库易于读取和搜索，而不是频繁更新。目录服务是一种层次化组织存储和检索网络内用户、设备和其他信息的方式。\n\
  \    *   LDAP 使用名为目录信息树（DIT）的层次树形结构组织信息。树中的每个条目都是包含实体（如用户或设备）信息的记录。条目通过唯一的区分名（DN）标识。\n\
  \    *   它概述了许多用于与目录服务器通信的协议过程。添加新条目、编辑现有条目、删除条目和搜索条目是常见操作。这些操作供 LDAP 客户端和服务器交换消息。\n\
  \    *   它经常用于授权身份验证。当用户尝试访问系统或应用程序时，系统可以查询 LDAP 目录以确认用户的凭据并获取其访问权限的详情。\n\n\n\n\n\
  \n*   主流的 LDAP 实现包括 Microsoft Active Directory（它是一个商业系统，但基于 LDAP）以及 OpenLDAP（它是一个开源程序）。这些实现使得\
  \ LDAP 能够处理用户账户及其数据，并提供目录服务。电子邮件系统、业务目录和网络身份验证只是 LDAP 的应用场景之一。它通常用于企业环境，用于管理用户身份、访问控制和目录服务。\n\
  \n*   `Kerberos`：这是一种网络身份验证协议，旨在为客户端服务器应用程序在可能不安全的网络上提供安全认证。在身份验证过程中，使用密钥加密来保证用户凭据的完整性和机密性。包括\
  \ Microsoft Windows 在内的许多操作系统都带有 Kerberos 作为默认认证机制。Kerberos 经常用于业务场景。\n\n    单点登录（Single\
  \ Sign-On）通过 Kerberos 实现，它使用户只需登录一次即可访问多种服务，无需再次输入凭据。\n\n    Kerberos 主要使用两个元素：密钥分配中心\
  \ (KDC) 和对称密钥加密。KDC 涉及三个要素：\n\n    *   服务服务器 (SS)，通过票据授予服务器 (TGS) 连接到用户。\n    *\
  \   Kerberos 数据库，存储每个经过验证的用户身份和密码。\n    *   身份验证服务器 (AS) 执行初始验证，并负责验证用户并在成功验证后向他们提供票据授予票据\
  \ (TGT)。\n\n    身份验证过程的步骤如下：\n\n    1.  用户通过提供凭据（通常是密码）向 AS 进行身份验证。AS 验证凭据，如果有效，则颁发\
  \ `TGT`。\n    2.  用户将 `TGT` 提交给 TGS，请求特定服务的服务票据。\n    3.  如果 `TGT` 有效，TGS 颁发一个服务票据，其中包含访问所请求服务的会话密钥。\n\
  \    4.  用户将服务票据同时间戳和其他信息提交给请求的服务。该服务验证票据，如果成功，则授予访问。\n\n*   `Microsoft Active Directory`：Kerberos\
  \ 是 Windows 域的默认身份验证协议，Active Directory 高度依赖 Kerberos 在 Windows 网络中进行安全身份验证。\n\n\
  *   `MIT Kerberos`：马省理工学院 (MIT) 开发了 Kerberos 的开源实现，通常用于 Unix/Linux 环境。\n\n*   `Configuration\
  \ Management Systems`：配置管理系统是旨在自动化基础设施配置和管理的工具，确保不同环境之间的一性和可重现性。提到的每个工具 —— Ansible、Chef、Puppet\
  \ 和 SaltStack —— 都用于此目的，但它们的方法和方法论上有所不同。以下是每种工具的概述：\n\n    *   `Ansible`：这种开源自动化工具强调易用性和简单性。它使用基于\
  \ YAML 的语言定义剧（playbooks）——指定所需配置和任务的指令集。\n        *   **无代理 (Agentless)**：由于其无代理特性，Ansible\
  \ 不需要向受管理节点上安装代理。因为它使用 `SSH` 与远程计算机交互，因此安装和使用非常简单。\n    *   `Chef`：开源配置管理应用程序使用基于\
  \ Ruby 的语言描述系统设置。Chef 使用声明式方法，定义系统的理想状态。\n        *   **客户端-服务器架构 (Client-Server\
  \ Architecture)**：Chef 使用客户端-服务器架构，Chef 服务器存储配置数据，Chef 客户端（节点）获取并应用配置。\n    *  \
  \ `Puppet`：它是一种广泛使用的配置管理系统，使用声明式语言描述系统的预期状态。它遵循客户端-服务器架构，节点上的 Puppet 代理从中央 Puppet\
  \ 主服务器请求配置。\n        *   **丰富的生态系统 (Rich Ecosystem)**：Puppet 拥有丰富的生态系统和大量的预构建模块（Puppet\
  \ Forge），可用于管理系统配置的各个方面。\n    *   `SaltStack`：它通常简称为 Salt，是一种开源配置管理和编排工具。它使用与 Ansible\
  \ 类似的声明式语言，以其速度和可扩展性而闻名。\n        *   **主-从架构 (Master-Minion Architecture)**：SaltStack\
  \ 采用主-从架构，Salt Master 将配置和命令分发到受管理节点上的 Salt Minions。它还支持事件驱动自动化。\n\n## 权限 (Permissions)\n\
  \nLinux 权限是指 Linux 操作系统中访问控制机制，用于规定谁可以访问文件、目录和其他资源，以及他们对这些执行哪些操作。权限系统是 Linux 安全的重要组成部分，允许管理员和用户控制对敏感数据和系统资源的访问。\n\
  \n### 文件权限\n\n![](img/Fig-3.8.jpg)\n\n**图 3.8:** 文件权限拆解\n\n### 权限范围\n\n*   **用户\
  \ (User)**：文件的所有者。第一组 `rwx` 权限适用于用户。\n*   **组 (Group)**：包含一个或多个成员。第二组 `r-x` 权限适用于组。\n\
  *   **其他 (Other)**：针对所有其他人的类别。第三组 `r-x` 适用于其他人。\n\n### 访问类型\n\n*   **读 (r)**：允许用户查看/读取文件内容。\n\
  *   **写 (w)**：允许用户查看、创建、更新或删除文件或文件内容。\n*   **执行 (x)**：对于文件，允许将文件作为程序执行。对于目录，允许访问目录内容。\n\
  \n此外，还有其他类型的访问，如下所示：\n\n*   可执行文件的 `setuid/setgid` 权限由字母 `s` 表示。\n*   `t` 是粘滞位（sticky\
  \ bit），仅对目录有效。如果配置，非 root 用户无法从中删除文件。\n\n`ls -l` 命令列出所有文件和目录的详情，如权限、所有者、组、大小、修改日期等。\n\
  \n![](img/Fig-3.9.jpg)\n\n**图 3.9:** ls -l\n\n在上述图中，你可以看到：\n\n*   `drwxr-xr-x` 代表类型和权限。\n\
  *   `1` 代表文件或目录的硬链接数。\n*   `root` 代表文件或目录的所有者。\n*   `root` 代表与文件/目录相关的组。\n*   `28`\
  \ 代表文件/目录的大小（单位为 kb）。\n*   `Apr 28 2023` 表示最后修改日期。\n*   `Desktop` 表示文件/目录的名字。\n\n\
  | 符号 | 语义 |\n| :--- | :--- |\n| `-` | 普通文件（例如执行 `touch abc`） |\n| `b` | 设备文件 |\n\
  | `c` | 字符设备文件 |\n| `C` | 高性能（连续数据）文件 |\n| `d` | 目录 |\n| `l` | 符号链接 |\n| `p` | 管道（通过\
  \ `mkfifo` 创建） |\n| `s` | 套接字 |\n| `?` | 其他（未知）文件类型 |\n\n**表 3.1:** 文件/目录类型及其符号\n\
  \n### 十进制值表示的权限\n\n一个三位数值代表文件的权限。第一位代表所有者的权限，第二位代表组的权限，第三位代表对其他用户的权限。\n\n*   读 (r):\
  \ 4\n*   写 (w): 2\n*   执行 (x): 1\n\n| 模式 | 有效权限 | 十进制表示 |\n| :--- | :--- | :---\
  \ |\n\n\n\n\n\n| `---` | None | 0 |\n| `--x` | Execute | 1 |\n| `-w-` | Write |\
  \ 2 |\n| `-wx` | Write and execute | 3 |\n| `r--` | Read | 4 |\n| `r-x` | Read and\
  \ execute | 5 |\n| `rw-` | Read and write | 6 |\n| `rwx` | Read, write, execute\
  \ | 7 |\n\n**表 3.2:** 权限的十进制表示\n\n现在，让我们取一个数字代码 744：\n\n| **所有者** | **组组** | **其他人**\
  \ |\n| 7 | 4 | 4 |\n| 4 + 2 + 1 | 4 + 0 + 0 | 4 + 0 + 0 |\n\n**表 3.3:** 示例\n\n###\
  \ 修改文件权限\n\n我们可以使用 `chmod`（更改模式）命令来更改文件的权限：\n\n*   `$ chmod <numeric code> <filename>`\n\
  \n    ![](img/Fig-3.10.jpg)\n\n    **图 3.10:** chmod 命令\n\n*   `$ chmod <user category>+<permissions>`\n\
  \n    其中用户类别表示为：\n\n*   `u`: 用户（所有者）\n*   `g`: 组\n*   `o`: 其他用户\n\n权限表示为：\n\n* \
  \  `r`: 读取\n*   `w`: 写入\n*   `x`: 执行\n\n![](img/Fig-3.11.jpg)\n\n**图 3.11:** 权限\n\
  \n## 进程权限\n\n与当前正在执行的操作系统进程相关的权利和特权被称为进程权限。一种名为访问控制的安全技术，限制了谁或什么实体可以使用计算机系统的资源并执行特定任务。进程权限对于维护系统安全和实施访问控制至关重要。\n\
  \n*   **实际 UID (Actual UID)**：实际 UID 是启动进程的用户的用户 ID，从人类用户的角度来看指示了所有权。`getuid(2)`\
  \ 系统调用允许进程确定其实际 UID。\n\n    使用 `top` 命令查看进程及其资源使用的的动态列表：\n\n    ![](img/Fig-3.12.jpg)\n\
  \n    **图 3.12:** top 命令\n\n    *   `PID`: 进程 ID（进程的唯一标识符）。\n    *   `USER`: 进程所有者的用户名或\
  \ ID。\n    *   `PR`: 进程优先级。\n    *   `NI`: Nice 值。nice 值越高，优先级越低。\n    *   `VIRT`:\
  \ 虚拟内存占用（进程使用的总虚拟内存）。\n    *   `RES`: 驻留集合大小（进程使用的非交换物理内存）。\n    *   `SHR`: 共享内存大小（进程使用的共享内存）。\n\
  \    *   `S`: 进程状态（例如，‘R’表示运行中，‘S’表示睡眠）。\n    *   `%CPU`: 进程占用 CPU 的百分比。\n    *\
  \   `%MEM`: 进程占用物理内存（RAM）的百分比。\n    *   `TIME+`: 进程累计使用的 CPU 时间。\n\n    ![](img/Fig-3.13.jpg)\n\
  \n    **图 3.13:** stat -c “%u %g” /proc/1336/\n\n`stat -c “%u %g” /proc/1336/` 命令显示\
  \ PID 为 1336 的进程的用户 ID 和组 ID。每个进程都与用户和一个组关联。要查找与 ID 关联的用户名和组名，请使用 `id <id>` 命令：\n\
  \n*   **有效 UID (Effective UID)**：Linux 内依赖有效 UID 来建立进程在访问共享资源（如消息队列）时拥有的权限。在传统的\
  \ UNIX 系统中，有效 UID 也用于文件访问。然而，Linux 以前使用专门的文件系统 UID（参见随后的讨论）用于文件访问权限。为了兼容性考虑，这种做法仍然保留。进程可以通过\
  \ `geteuid(2)` 系统调用确定其有效 UID。\n\n*   **保存的组用户 ID (Saved Set-User-ID)**：在 `setuid`\
  \ 实例中，进程可能通过在实际 UID 和保存的组用户 ID 之间切换其有效 UID 来获取特权，此时保存的组用户 ID 是相关的。例如，为了让进程获得使用特定网络端口的权限（参见“端口”），需要特权（例如以\
  \ root 身份运行）。进程可以通过 `getresuid(2)` 系统调用检索其保存的组用户 ID。\n\n*   **文件系统 UID (Filesystem\
  \ UID)**：这些 ID 是 Linux 特有的，用于设置文件访问权限。程序通常不直接修改此 UID；它最初开发是为了方便此类情况：文件服务器代表普通用户操作，同时将进程与该用户发送的信号隔离。内核监控所有对有效\
  \ UID 的修改并相应地调整文件系统 UID。通常，文件系统 UID 与有效 UID 匹配，但可以使用 `setfsuid(2)` 系统调用进行更改。值得，从技术上讲，这个\
  \ UID 已不再存在。\n\n## SELinux\n\nLinux 安全扩展，称为安全增强型 Linux (SELinux)，提供了一种处理访问的方法。Linux\
  \ 包含了强制性访问控制 (MAC)。\n\n安全策略是一组规则，规定了 SELinux 中哪些用户可以访问哪些资源。这些规则通常以标签的形式阐述，标签与文件、进程和其他系统组件相连。\n\
  \n通过将所有决策（阻止或允许）存储在访问向量缓存（AVC）中，SELinux 加快了访问控制过程。当进程请求访问时，SELinux 检查 AVC 以判断\n\n\
  ### SELinux 模式\n\nSELinux 运行三种不同的模式：\n\n### 强制模式 (Enforcing Mode)\n\nSELinux 在强制模式下会严格执行\
  \ SELinux 策略中规定的安全策略。访问违规将导致拒绝，SELinux 会记录这些事件。对于 SELinux 来说，这是许多系统的默认选项。\n\n* \
  \  **强制执行**：在强制模式下，SELinux 严格执行访问控制限制。它通过评估 SELinux 策略中的安全上下文和权限，确定进程或用户是否被允许访问资源。SELinux\
  \ 会阻止访问。\n*   **安全策略**：SELinux 使用安全策略为用户和进程的交互提供指南和限制。\n*   **防止策略违反**：强制模式的主要目标是通过阻止可能破坏性或未经授权的行为来保护系统。如果进程尝试\
  \ SELinux 策略不允许的操作，该操作将被拒绝。\n*   **日志记录**：当 SELinux 在强制模式下拒绝操作时，它会生成日志记录。\n\n###\
  \ 许可模式 (Permissive Mode)\n\n在许可模式下，SELinux 会记录策略违规，但不会主动执行它们。这种模式对于排排除故障有用，允许管理员识别并理解潜在问题，而不会阻止资源的访问。\n\
  \n\n\n\n日志记录允许管理员识别并理解问题，而无需主动阻止资源的访问。\n\n*   **访问控制绕过**：在宽容模式（Permissive mode）下，即使操作违反了\
  \ SELinux 策略，该操作也不会被拒绝。这种模式有效地绕过了访问控制的执行，同时仍会提供有关策略违规的信息。\n*   **故障排除与策略开发**：宽容模式通常用于排查与\
  \ SELinux 相关的问题。管理员可以通过查看日志来识别问题操作，并相应地调整 SELinux 策略。\n    这在开发或测试 SELinux 策略期间可能大有益，允许管理员在不立即阻塞操作的情况下精调策略。\n\
  \n### 禁用模式（Disabled Mode）\n\n在禁用模式（Disabled mode）下，SELinux 被关闭，不提供任何安全增强或策略执行。这种模式通常用于管理员想要临时禁用\
  \ SELinux 的情况，通常是为了故障排除或在特定环境不需要 SELinux 的时候。\n\n*   **无访问控制执行**：禁用模式下的 SELinux\
  \ 不会主动执行任何安全策略。它不会评估 SELinux 策略中指定的安全上下文或权限来做出访问控制决策。\n    对资源的访问完全由传统的 Linux 任意访问控制（DAC）机制主管。\n\
  *   **无策略违规日志**：由于 SELinux 已禁用，它不会记录任何策略违规或安全相关事件。\n*   **无 SELinux 保护**：在禁用模式下，系统完全依赖底层\
  \ Linux 内核和文件系统提供的安全机制。\n\n## 信息策略（Information Policies）\n\n信息策略是指组织建立的一系列指南、规则和程序，用于管理、访问、使用和保护信息资产。这些策略的设计初衷是确保信息的机密性、完整性和可用性，同时符合组织的目标、法律要求和伦理标准。信息策略在管理和保护组织信息资源方面起着至关重要的作用。\n\
  \n## 目标策略（Targeted Policy）\n\n在 SELinux 中，有不同的策略类型，常见的策略类型之一是“目标”（targeted）策略。目标策略旨在安全性和可用性之间取得平衡。它侧于限制特定的高风险服务或进程，同时允许大多数其他进程以最小的\
  \ SELinux 限制运行。以下是关于 SELinux 目标策略的一些关键点：\n\n*   **关注特定服务**：目标策略针对从安全角度来看具有高风险的特定服务或进程量身定制。目标策略通常涵盖的服务示例包括\
  \ Web 服务器、数据库和网络服务。\n*   **对通用系统的影响最小化**：与对所有进程实施强限制的严格策略不同，目标策略对通用系统操作的侵入性较小。在目标策略下，大多数用户应用程序和系统进程不受\
  \ SELinux 的严重约束。\n*   **增强高风险服务的安全性**：目标策略的目标是通过限制其进程并减少其攻击面来增强关键服务的安全性。它有助于防止安全泄露，并限制由受攻击服务造成的潜在损害。\n\
  *   **类型强制（Type Enforcement）**：目标策略与其他 SELinux 策略一样，使用类型强制来定义进程和资源如何交互的规则。每个进程、文件和网络端口都分配了一个带有特定类型的安全上下文，访问决策基于这些类型。\n\
  *   **更易维护**：由于目标策略关注服务的子集，因此在维护方面可能更具管理性。这使得管理员更易于理解、自定义和排排除 SELinux 配置。\n*   **附加模块的灵活性**：虽然目标策略解决了高风险服务，但管理员仍可以通过通过加载额外的策略模块来扩展或修改策略。这允许在不牺牲目标方法整体优势的情况下进行定制。\n\
  *   **可用性考虑**：SELinux 目标策略旨在安全性和可用性之间取得平衡点。其目标是提供一个安全的环境，而不过度阻碍系统功能。\n*   **用于监控的审计日志**：目标策略生成的审计日志可以进行监控，以跟踪安全相关事件。这些日志帮助管理员识别并响应与受限服务相关的安全事件。\n\
  \n## 多级安全策略（Multi-Level Security Policy）\n\n多级安全策略（通常称为 MLS）是一种旨在保护组织内不同分级水平敏感信息的安全方法。这种类型的安全策略通常用于政府、军事以及具有不同级别机密信息的环境。\n\
  \n*   **分级水平**：信息根据其敏感性和重要性归分为不同的级别。常见的分级包括不机密（Unclassified）、机密（Confidential）、秘密（Secret）和绝机密（Top\
  \ Secret）。\n*   **访问控制**：根据用户的安全许可和信息的分级水平限制对信息的访问。用户仅被授予与其安全许可相对应的信息。\n*   **知情原则（Need-to-Know\
  \ Principle）**：只有当用户执行工作职责确实需要该特定信息时，才授予其对信息的访问权限。这一原则有助于限制访问并降低未经授权披露的风险。\n*  \
  \ **划分管理（Compartmentalization）**：即使在同一分级水平内，信息通常也会划分为特定的区域或类别。用户根据其角色和职责可能只能访问特定的区域。\n\
  *   **数据标记和标识**：信息会根据其分级水平进行标记和标识。这有助于用户轻松识别信息的敏感性并确保妥善处理。\n*   **审计与监控**：持续监控和审计对于确保符合安全策略至关重要。可疑活动或未经授权的访问尝试会被记录并调查。\n\
  *   **安全通信**：使用安全通道和加密传输机密信息，以防止拦截和未经授权的访问。\n*   **安全策略执行**：通过技术控制和组织程序严格执行安全策略。\n\
  \n### 设置 SELinux 策略\n\nSELinux 策略类型通常可以在安装 SELinux 时设置，也可以根据系统的安全后续更改。可以通过以下步骤更改策略类型：\n\
  \n1.  首先，使用 `sestatus` 检查 `selinux` 状态。\n2.  如果是禁用模式，使用命令 `setenforce [1 | 0]` 分别设置为强制模式（enforcing）或宽容模式（permissive）。\n\
  3.  现在，打开配置文件 `[/etc/selinux/config]`并将 `SELINUXTYPE` 设置为 `targeted` 或 `mls`。\n\
  4.  重启系统使更改生效。\n\n### 自定义 SELinux 策略\n\n自定义 SELinux 策略涉及创建或修改策略模块以适应系统的特定安全需求。SELinux\
  \ 使用策略模块来定义各种进程和资源的规则和访问控制。\n\n要显示布尔值及其描述，使用以下命令：\n\n```\nsemanage Boolean -l\n\
  ```\n\n\n\n要显示和设置特定布尔（Boolean）值，你可以使用 `getsebool` 和 `setsebool` 命令。以下示例展示了如何显示和设置\
  \ `ftp_home_dir` 布尔值：\n\n```\ngetsebool ftp_home_dir\n```\n\n```\nftp_home_dir -->\
  \ off\n```\n\n```\nsudo setsebool ftp_home_dir on\n```\n\n```\ngetsebool ftp_home_dir\n\
  ```\n\n```\nftp_home_dir --> on\n```\n\n要切换布尔值的值，请使用 `togglesebool` 命令，如下例所示：\n\n\
  ```\nsudo togglesebool ftp_home_dir\n```\n\n```\nftp_home_dir: inactive\n```\n\n\
  要使布尔值在重启后依然有效，请为 `setsebool` 指定 `-P` 选项。例如：\n\n```\nsudo setsebool -P ftp_home_dir\
  \ on\n```\n\n```\ngetsebool ftp_home_dir\n```\n\n```\nftp_home_dir --> on\n```\n\
  \n### 最佳实践\n\n为了保持环境安全，应该实施以下最佳实践：\n\n### 最小权限\n\n* 最小权限原则传达了一个理念：个人或进程应仅拥有完成特定任务所需的本质权限。\n\
  * 在 `File Permissions`（文件权限）的范围内，讨论了使用 `chmod +x` 命令的影响。注意到，该命令除了预期的权限外，还授予了其他用户额外的权限。\n\
  * 建议避免使用 root 权限进行操作。例如，在安装软件时，推荐的方法是使用 `sudo` 而不是以 root 登录。\n\n### 审计\n\n* 审计涉及记录操作的实践，包括执行者的身份，其记录方式可以防止生成的日志被任何篡改。\n\
  \n## 结论\n\n总而言之，Linux 访问控制对于维护操作系统的安全态势和保护其监管的资源至关重要。由于 Linux 访问控制方法强大且适应性强，管理员能够精确控制和管理用户与文件、目录以及系统功能交互的方式。\n\
  \nLinux 访问控制遵循通过坚持最小权限概念来减少可能的安全风险的哲学。用户通过身份和授权过程经过验证，然后根据预设权限提供访问，确保只有授权的实体才能执行某些操作。\n\
  \n在接下来的章节中，我们将开始实现防火墙。这一过程涉及配置网络安全措施，特别关注数据包过滤，以对互连网络和设备之间的流量进行控制。\n\n# 第 4 章\n\n\
  ## 实现防火墙与包过滤\n\n### 引言\n\n实现防火墙和数据包过滤涉及配置网络安全措施，以控制网络与设备之间的流量。防火墙充当受信内部网络与不可信外部网络（如互联网）之间的屏障。防火墙架构的核心是数据包过滤的复杂功能。\n\
  \n这是一个决定跨越网络的单个数据包命运的关键机制。这一过程由精心编写的规则引导。这些规则中的每一条都作为防火墙的指令，用于允许或拒绝特定的数据包。这些规则是根据一系列标准建立的，包括源地址、目的地址、端口和协议，从而实现了对网络流量的细粒化和精细控制。\n\
  \n### 结构\n\n在本章中，你将学习：\n\n* 防火墙及其组件\n* 防火墙架构\n* 数据包过滤及其类型\n* 使用 UFW 在 Linux 环境中配置防火墙\n\
  \n## 防火墙\n\n防火墙是一种网络安全硬件或软件，负责监控所有进入和退出的网络流量。它使用预定义的的安全规则来决定是否允许或禁止特定类型的数据。通常，网络节点通过防火墙与进入和退出的数据流量以及某些应用程序隔离开。防火墙利用硬件、软件或云端技术保护网络免受外部威胁。防火墙的主要目标是防止有害流量和数据包进入，而同时允许合法流量通过。为了停止攻击，防火墙根据预定义的安全规则检查入站的通信，并过滤源自不可信或可疑源的流量。在计算机与外部设备传输数据传输端口上，流量得到了保护。\n\
  \n![](img/Fig-4.1.jpg)\n\n**图 4.1:** 防火墙实现\n\n### 防火墙的组件\n\n### 边界路由器\n\n任何网络的入口点都是边界路由器，它位于外部防火墙和互联网之间。因此，我们的第一个网络访问控制是通过在路由器上配置适当参数来在边界路由器上定义安全策略。边界路由器将根据\
  \ IP 地址范围过滤流量。使用它的主要越是提供到公共网络系统（如互联网或特定组织）的链接。它通过遵循适当的路由协议执行数据包的路由。它还提供数据包过滤和地址转换功能。\n\
  \n![](img/Fig-4.2.jpg)\n\n**图 4.2:** 边界路由器\n\n### 虚拟专用网络 (VPN)\n\n其目的是在两个计算机、两个网络或计算机与网络之间提供安全的链接。这包括数据包可靠性保证、验证和加密。通过启用安全的远程网络访问，它连接了同一平台上但未连接的两个广域网（WAN）。\n\
  \n以下是 VPN 的一些用场景：\n\n* **隐私与匿名性：** 通过加密你的互联网连接，VPN 减少了外部人员（如黑客或政府组织）监控你在线活动的能力。当你使用公共\
  \ Wi-Fi 时尤为关键。\n* **绕过地理限制：** 你可以使用 VPN 访问所在地区可能被屏蔽的内容。通过连接到不同位置的服务器，你可以让自己看起来像是从该位置浏览的。\n\
  * **安全远程访问：** 组织经常部署 VPN，以允许员工从外部安全地访问公司内部网络。这对于在访问敏感数据时保持高水平的安全至关重要。\n* **绕过审查：**\
  \ VPN 可以帮助用户绕过限制，访问在互联网审查常见的地区被禁止的内容。\n* **增强安全性：** VPN 为你的互联网连接提供了额外的保护。VPN 利用加密来保护你的数据免受潜在危险，并让你的在线体验更安全。\n\
  \n![](img/Figure-4.3.jpg)\n\n**图 4.3:** VPN\n\n## VPN 工作原理\n\nVPN 的基本工作涉及在用户设备与位于不同位置的服务器之间建立安全加密的连接。这一过程确保用户的互联网流量通过安全的\
  \ VPN 隧道路由，保护数据免受可能的窃听或未经授权的访问。以下是 VPN 操作的关键步骤：\n\n1. **用户发起连接：** 用户在设备上启动 VPN 客户端或应用程序，并启动到\
  \ VPN 服务器的连接。\n2. **验证：** 用户设备向 VPN 服务器进行身份验证。这可能包括输入凭据（如用户名和密码）、使用数字证书或其他身份验证方法。\n\
  \n\n\n\n### 3. 隧道建立\n一旦通过验证，用户设备与 VPN 服务器之间将建立一个安全隧道。隧道是一个虚拟的加密连接，所有数据流量都通过它传输。\n\
  \n### 4. 加密\n通过 VPN 隧道传输的数据经过加密，以确保机密性。通常使用 `AES` 等加密算法来保护数据。\n\n### 5. 数据传输\n用户的网络流量（包括网页浏览、文件下载和其他活动）现在都通过\
  \ VPN 隧道进行路由。这使得第三方很难截获或监控用户的在线活动。\n\n### 6. VPN 服务器路由\nVPN 服务器位于不同的地理位置，充当用户设备与互联网之间的中介。当用户访问在线资源时，请求似乎源自\
  \ VPN 服务器的 IP 地址，从而掩盖了用户的实际 IP 地址。\n\n### 7. 服务器端解密\nVPN 服务器对入入的数据进行解密，并将其转发到互联网上的目标位置。来自互联网的响应随后会被加密，并通过\
  \ VPN 隧道传回给用户设备。\n\n### 8. 安全数据传输\n用户设备与 VPN 服务器之间、以及 VPN 服务器与互联网之间的整个通信都在加密隧道内进行。这确保了传输数据的机密性和完整性。\n\
  \n### 9. 会话终止\n当用户断开 VPN 连接时，安全隧道将被终止。用户设备在没有 VPN 保护的情况下恢复到正常的互联网连接。\n\n## 入侵检测系统\
  \ (IDS)\n\n这种安全技术通过监控和检查网络或系统活动，来寻找恶意活动、非法访问或违反安全策略的迹象。入侵检测系统的主要目标是通过检查与恶意活动相关的趋势、异常或已识别的指标，来识别并解决安全问题。它有能力通过未经授权的访问从网络后端发起拒绝服务攻击（denial-of-service\
  \ attack）。这类攻击能够由智能防御系统进行管理。\n\n![](img/Fig-4.4.jpg)\n\n**图 4.4:** IDS 的工作原理\n\n\
  IDS 通过监控和分析网络或系统活动来识别并响应潜在的安全威胁。IDS 有两种主要类型：基于网络的入侵检测系统 (NIDS) 和基于主机的入侵检测系统 (HIDS)。以下是\
  \ IDS 典型工作方式的概述：\n\n### 基于网络的入侵检测系统 (NIDS)\n\n*   **流量监控**：NIDS 被动地监控网络流量，在数据包流经网络时对其进行分析。它可以部署在网络的关键节点以捕获并检查流量。\n\
  *   **数据包捕获与分析**：NIDS 捕获网络数据包并分析其头部和内容。它可能使用多种技术，包括基于特征的分析、异常检测和启发式分析，以识别潜在威胁。\n\
  *   **基于特征的检测**：基于特征的检测将网络流量特征与已知攻击特征数据库进行对比。如果发现匹配，系统将生成警报。\n*   **基于异常的检测**：基于异常的检测建立正常网络行为的基准。偏离此基准的行为（例如异常的流量模式或意外的数据流）会触发警报。\n\
  *   **启发式分析**：启发式分析涉及使用预定义的规则或算法来识别与已知攻击方法相关的模式。这种方法允许 NIDS 检测已知攻击的变体。\n*   **警报生成**：当\
  \ NIDS 检测到潜在的恶意活动时，它会生成警报。这些警报提供了有关威胁性质、受影响系统以及潜在影响的信息。\n*   **响应或通知**：根据配置，NIDS\
  \ 可以采取行动，例如记录事件、阻止恶意流量或通知安全人员。然而，NIDS 通常以监控模式运行，默认不会主动拦截流量。\n\n### 基于主机的入侵检测系统 (HIDS)\n\
  \n*   **代理部署**：HIDS 部署在单个主机机器上。每个主机都运行自己的 HIDS 代理，监控该特定设备上的活动。\n*   **系统事件监控**：HIDS\
  \ 代理监控各种系统事件，包括登录、文件更改、进程执行以及与其他与主机相关的特定活动。\n*   **基准建立**：HIDS 中的异常检测涉及建立正常主机行为的基准。HIDS\
  \ 系统学习该主机的典型行为，并在发生偏离时发出警报。\n*   **基于特征的检测**：与 NIDS 类似，HIDS 使用基于特征的检测，将活动与已知攻击模式或恶意行为数据库进行对比。\n\
  *   **警报生成**：当 HIDS 检测到可疑或恶意活动时，它会生成警报。这些警报包含了有关活动类型及其潜在影响的信息。\n*   **响应或通知**：HIDS\
  \ 可以触发响应，例如记录事件、隔离受影响的主机或通知管理员。响应通常可以根据组织的安全策略进行配置。\n\n## NIDS 和 HIDS 的共同元素\n\n\
  *   **日志与报告**：NIDS 和 HIDS 系统都会记录检测到的事件以便分析和报告。这些信息对于调查事件和提高整体安全性具有重要价值。\n*   **与\
  \ SIEM 集成**：IDS 通常与安全信息和事件管理 (SIEM) 系统集成，以提供整个组织安全事件的集中视图。\n*   **持续监控**：IDS 实时运行，对网络或主机活动提供持续监控，以便快速识别和响应安全事件。\n\
  \n## 防火墙架构\n\n防火墙拓扑根据网络的特定需求和规格分类。根据网络规模、所需的安全级别以及要缓解的威胁类型，不同的企业可能会使用不同的防火墙架构。\n\
  \n以下组件构成了防火墙架构：\n\n### 堡垒机 (Bastion Host)\n\n网络通过堡垒机免受攻击。它充当外部和内部网络之间的中介。构建并设置用于防御网络入侵的计算机系统称为堡垒机。防火墙过滤所有进入和离开网络的流量。它有两个接口：一个连接到内网的私有接口，另一个直接连接到互联网的公共接口。\n\
  \n![](img/Fig-4.5.jpg)\n\n**图 4.5:** 堡垒机\n\n### 隔离子网 (Screened Subnet)\n\n非军事化区\
  \ (DMZ)，也称为隔离子网，是在筛选防火墙后面使用双口或三口防火墙建立的安全网络。将三口防火墙的第一个接口连接到互联网，第二个接口连接到 DMZ，第三个接口连接到内网。私网络无法访问\
  \ DMZ 内的任何主机，但它回答公共查询。用户无法访问秘密区域。在内网之外筛选子网的一个优点是它可以回答公共查询，而不会让流量进入内网。如果三口防火墙被攻破，DMZ\
  \ 和内网可能会受到影响，这是一个缺点。更安全的方法是使用多个防火墙来隔离互联网与 DMZ，然后将 DMZ 与内网隔离开。\n\n\n\n\n\n一个有多个 NIC（网络接口卡）连接到两个或多个网络的节点被称为多宿主防火墙。它在每个接口与其他网络组件之间建立了逻辑和物理连接。在多宿主防火墙的帮助下，IP\
  \ 网络可以运行得更可靠、更高效。多宿主防火墙的三个以上的接口允许根据组织独特的安全目标进行额外的系统划分。然而，背对背防火墙概念提供了更全面的安全性。\n\n\
  ![](img/Fig-4.7.jpg)\n\n**图 4.7:** 多宿主防火墙\n\n## 包过滤\n\n包过滤防火墙是一种用于调节进出网络数据流的网络安全功能。每一个包含控制数据和用户数据的数据包都会经过防火墙的检查，防火墙根据预设的一组规则对其进行测试。如果包通过了测试，防火墙允许其到达目的地。未通过测试的包会被拒绝。防火墙通过查看规则集、协议集、端口和目的地址来测试数据包。\n\
  \n在系统网络中，数据包是跨分组交换网络发送的结构化数据单元。由于这些网络将通信分成称为“数据包”的小单元，并在网络上逐个交付，因此它们能够抵抗故障。当数据包通过防火墙到达目的地时，它们会被重新排列以正确显示其内容。当正确实施时，分组交换可以减少传输延迟，化网络通道容量并提高通信效率。\n\
  \n数据包有两个关键部分：\n\n*   头部（Headers）：数据通过数据包头部定向到目标位置。它们包含了地址位、互联网协议（IP）以及发送数据包到其预期地所需的任何其他信息。\n\
  *   载荷（Payloads）：数据包中包含的用户数据称为载荷。这是试图到达其预期位置的数据。\n\n![](img/Fig-4.8.jpg)\n\n**图\
  \ 4.8:** 每一层的头部\n\n### 包过滤的类型\n\n防火墙利用称为包过滤的技术根据预定义的标准来调节网络流量。存在多种不同的包过滤技术，每种技术都为控制和保护网络流量提供了独特的方法。以下三类是主要的：\n\
  \n*   **静态包过滤**：这种包过滤是最基础的。它根据协议类型（例如 TCP、UDP）、源和目的端口号以及源和目的 IP 地址等参数分析数据包。管理员预先建立规则，根据静态标准指示允许或禁止某些类型的数据包。它易于实现，对于简单的网络安全效果良好。\n\
  *   **动态包过滤**：考虑到活动连接的状态，动态包过滤是静态包过滤的扩展。为了跟踪连接，它维护一个更新的状态表，并根据流量的上下文做出选择。为了根据连接的当前状态对接受或拒绝哪些数据包做出更具信息量的判断，防火墙维护了对现有连接状态的跟踪。通过考虑连接的当前状态，它提供了增强的安全性并增加了其对特定类型攻击的抵抗力。\n\
  *   **状态检测检测 (SPI)**：SPI 是动态包过滤的增强版本。除了监控连接状态外，它还会检查应用层的数据包内容。它通过跟踪现有连接的状态来确定应用程序或服务。\n\
  *   **无状态包过滤**：这种技术在不考虑状态的情况下过滤网络流量，仅依赖于数据包的属性。\n\n# 防火墙的类型\n\n## 包过滤防火墙\n\n包过滤防火墙是一种调节进出网络数据流的网络安全功能。每一个包含控制数据和用户数据的数据包都会经过防火墙的检查，防火墙根据预设的一组规则对其进行测试。如果包通过了测试，防火墙允许其到达目的地。未通过测试的包会被拒绝。防火墙使用规则集、协议、端口和目的地址来检查数据包。\n\
  \n包过滤防火墙根据以下内容允许或拒绝网络数据包：\n\n*   数据包的地址是目的 IP 地址，源 IP 地址是发送包的地址。\n*   数据传输协议，包括会话和应用协议（TCP、UDP）是协议的示例。\n\
  *   端口包括源和目的端口，以及 ICMP 类型和代码。\n*   标志包括头部标志，例如数据包是否为连接请求。\n*   数据包通过的物理接口（NIC）（入站或出站）。\n\
  \n### 优点\n\n*   **效率**：使用包过滤的防火墙的主要优点之一是它们的效率。路由器通常以高速运行，根据其地址、源端口和目的地实时接受和拒绝数据包。\n\
  *   **透明性**：这是额外的优势。当防火墙拒绝数据包时，用户是知晓的，而包过滤器通常会快速且静默地阻止用户功能。其他方法需要用户为某些服务器或客户端手动设置防火墙。\n\
  *   **成本效益**：由于只需要一个过滤路由器来保护内部网络，包过滤是非常经济的。包过滤是许多硬件和软件路由系统的标准功能。\n*   **易用性**：由于包过滤廉价且易于使用，它是一种理想的替代方案。这种安全方法允许整个网络受到单个筛选路由器的保护。用户在使用防火墙时需要的帮助、指导或培训很少。\n\
  \n### 缺点\n\n*   **安全性较低**：包过滤的主要缺点是它忽略了应用或上下文信息，而仅依赖 IP 地址和端口号。因此，它们被认为是不安全的。这是因为任何通过允许的\
  \ IP 地址或端口的流量都会被它们转发。未被注意的头部或载荷本身可能包含恶意命令。\n*   **缺乏日志功能**：对于必须遵守报告和合规义务的企业，如果包过滤器没有日志功能，可能会遇到问题。\n\
  \n\n\n\n\n- **无状态性**：数据包过滤本质上是无状态的——也就是说，它独立检查每个数据包，而不考虑已建立的连接或之前的数据包。因此，防火墙防御严重威胁和攻击的能力相当有限。\n\
  \n# 电路级网关\n\n电路级网关是一种工作在网络会话层的设备，用于为网络内部和外部的计算机提供连接安全。与应用网关不同，电路级网关不根据数据包的内容进行过滤。它验证两个传输层之间之间虚拟电路上的\
  \ `TCP` 或 `UDP` 数据包。电路级网关运行在开放系统互连（OSI）模型的会话层。防火墙会检查数据包之间的 `TCP` 握手，以检测并防止非法访问尝试。在确定流量是否符合电路级网关要求时，会忽略数据包的内容；只检查头部信息。它管理使用不可信主机和可信服务器的客户端之间的连接。\n\
  \n### 工作原理\n- 当用户开始连接到某个主机时，电路级网关会在用户和远程主机之间创建一个电路或虚拟连接。\n- 穿过该电路的流量将由电路级网关进行观察，它会判断其是否属于已建立连接的一部分，并仅允许允许的流量通过。\n\
  - 之后，使用 `UDP` 或经过验证的 `TCP` 连接将代表客户端与目标服务器通信。如果连接被拒绝，会话结束。\n\n电路级网关由一组规则控制。这些规则规定了哪些流量应该被禁止，哪些流量规则可以通过电路级网关流动。通过将这些数据与协议类型、端口号以及源和目的\
  \ IP 地址等因素进行交叉引用，网络管理员可以对网络会话层进行细粒度的控制。\n\n### 优点\n- **性能增强**：与应用网关和其他防火墙解决方案相比，电路级防火墙通常更快且消耗资源更少。这是因为它们只在会话层监控流量，并运行在较低的网络栈层级。由于此，它们增加延迟或影响网络性能的概率也较低。\n\
  - **易于配置**：与其他防火墙系统相比，电路级防火墙的设置和维护更简单。它们不需要对需要配置的网络中协议和应用层网关有深入了解。由于关注点仅在于连接状态，变量比更复杂的防火墙类型更少。\n\
  - **成本效益**：与下一代防火墙等更复杂的防火墙相比，它们属于完全不同的价格范围。另一方面，电路网关是最廉价的选择。因此，资源紧张的中小型企业会选择这种。\n\
  - **提供隐蔽连接安全**：由于其工作方式，电路级网关代表内部主机使用虚拟连接评估已建立连接的安全性。这个中间人有助于向服务器隐藏其 IP 地址和身份。因此，供黑客利用的痕迹（线索）更少。\n\
  \n### 缺点\n- **应用感知能力有限**：电路级网关缺乏对 OSI 模型应用层（第 7 层）的详细了解。这意味着可能无法有效过滤或控制某些可能被攻击者利用的特定应用程序行为。\n\
  - **性能影响**：监控连接状态的过程引入了一些开销，可能会影响防火墙的性能。随着活动连接数量增加，这种影响可能会变得更加。\n- **配置复杂**：配置电路级网关可能比设置基础数据包过滤防火墙复杂。理解和管理连接状态及规则需要更多的专业知识。\n\
  - **细粒度控制不足**：与应用层防火墙相比，电路级网关对特定应用程序及其功能的细粒度控制较少。在对精细控制至关重要的环境中，这种局限性可能是一个缺点。\n\
  - **状态攻击的风险**：虽然电路级网关提供了连接状态监控，但仍存在状态攻击的可能性。复杂的攻击者可能会利用状态跟踪机制中的漏洞。\n\n# 应用层防火墙\n\
  \n应用层防火墙运行在 OSI（开放系统互连）模型的应用层，有时被称为代理防火墙。应用层防火墙的设计目的是根据特定的应用程序或服务过滤流量，而不是运行在传输层和网络层的标准网络防火墙。\n\
  \n### 应用层防火墙的关键特性包括：\n- **深度数据包检测 (DPI)**：与传统防火墙不同，应用层防火墙更彻底地检查数据包内容。这使得它们能够理解正在发送的数据含义和内容。\n\
  - **协议过滤**：它们能够根据特定的应用程序或协议过滤流量。例如，你可以决定是否允许或禁止特定程序（如电子邮件客户端、即时消息服务和网络浏览器）的流量。\n\
  - **用户身份验证**：通过将某些应用层防火墙与用户身份验证系统集成，你可以根据用户标识限制访问。通过确保只有授权用户才能访问某些应用或服务，这提供了额外的保护。\n\
  - **内容过滤**：这些防火墙具有检查和管理数据包内容的能力。此功能对于阻止敏感数据的传输、根据内容类别筛选网站以及拦截危险内容很有帮助。\n- **状态检测**：为了监控活动连接的状态并根据通信上下文做出选择，应用层防火墙通常配备了状态检测功能。\n\
  - **代理服务**：应用层防火墙能够充当公司内外网络通信的中间介。结果是它们能够更好地监管和过滤流量。\n- **日志与审计**：通过其尽的日志和审计功能，管理员可以监控网络活动，发现任何安全风险并生成报告。\n\
  - **配置简便**：许多应用层防火墙提供了易于使用的界面来设置策略和规则。\n\n### 缺点\n- **复杂性**：实施和管理应用层防火墙可能比传统防火墙复杂，需要更高水平的专业知识和精细配置。\n\
  - **性能影响**：深度数据包检测和内容过滤过程可能会引入延迟并影响网络性能，特别是在高流量环境中。\n- **资源密集型**：与简单的数据包过滤防火墙相比，应用层防火墙通常需要更多资源（CPU\
  \ 和内存），这可能导致硬件需求和潜在的可扩展性挑战。\n- **兼容性问题**：某些应用程序可能无法与应用层防火墙无缝工作，需要额外的配置，并可能导致某些功能中断。\n\
  \n\n\n\n\n*   **成本**：功能和能力是有代价的，应用层防火墙的实施和维护成本可能比简单的防火墙解决方案更高。\n*   **潜在的误报**：深度包检测可能会导致误报，即合法流量被错误地标记为恶意，可能对正常业务操作造成干扰。\n\
  *   **配置错误**：配置不当会导致安全漏洞或意想不到的后果，这强调了正确设置和持续管理的重要性。\n*   **对加密流量的保护有限**：应用层防火墙在加密流量时可能会面临挑战，因为它需要额外的资源，并可能为处理\
  \ SSL/TLS 连接引入复杂性。\n\n# 状态多层检测\n\n动态包过滤（或称为状态检测）是数据包过滤的一种，它能够监控活动连接的状态，并根据流量上下文做出判断。在连接期间，防火墙会跟踪序列号、其他相关数据以及\
  \ TCP 握手的状态。通过这种方式，防火墙能够理解流量的上下文，并决定允许还是拒绝数据包。\n\n在 OSI 模型的许多层（通常是网络层、传输层和应用层）分析网络流量被称为多层检测。多层检测意味着对数据包的内容和上下文进行更深入的检查，而不仅仅关注其基础信息。检查负载内容、应用层协议甚至用户行为可能都属于这一类。\n\
  \n通过将状态检测与多个 OSI 层次的分析相结合，该方法提供了更彻底且感知上下文的安全态势。多层检测能够更好地识别复杂的威胁，包括那些可能试图利用高层协议或应用程序漏洞的威胁。\n\
  \n![](img/Fig-4.9.jpg)\n\n**图 4.9:** 状态多层检测\n\n### 用例\n\n**网络安全**：状态多层检测通常用于防火墙，保护网络免受未经的访问、恶意活动和其他安全威胁。\n\
  \n**入侵检测与防御系统 (IDPS)**：该方法也应用于入侵检测与防御系统，用于监控和分析网络和/系统活动，寻找恶意行为或违反安全策略的迹象。\n\n###\
  \ 挑战与考虑\n\n*   **资源密集型**：在多个层对流量进行深度分析可能会消耗大量资源，影响安全基础设施的性能。\n*   **配置复杂性**：实施和配置状态多层检测需要仔细的考虑，以避免可能导致安全漏洞或运行问题的配置错误。\n\
  \n# 简单的防火墙\n\nUncomplicated Firewall，简称 `UFW`，是一个易于使用的命令行界面 (CLI) 程序，可用于处理多种 Linux\
  \ 发行版（包括 Debian、Ubuntu 和 Arch Linux）的防火墙配置选项。`UFW` 的设计是为了让用户更容易在计算机上设置和维护防火墙配置，特别是对于那些不是防火墙专家的用户。\n\
  \n### 使用 UFW 的优势\n\n*   `UFW` 为防火墙管理提供了一个易于使用的界面。\n*   对于大多数用户，`UFW` 提供的默认设置已经是安全的。\n\
  *   `UFW` 提供了一种通用灵活的方法，可以根据你的独特需求定制防火墙规则。\n*   `UFW` 是一个轻量级应用，占用资源少。\n*   `UFW`\
  \ 是一个开源免费的应用，所有人都可以。\n\n### 与 UFW 相关的命令和信息\n\n1. 首先，确保你的计算机上安装了 `UFW`。\n   ![](img/Fig-4.10.jpg)\n\
