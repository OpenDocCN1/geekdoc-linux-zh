  \   **图 4.18:** icmp 请求\n\n10. 如果你想阻止来自 `192.168.20.1` 端口 `22` 的访问，则允许所有其他 IP 使用\
  \ tcp。\n    ![](img/Fig-4.19.jpg)\n    **图 4.19:** 阻止来自 192.168.20.1 的 22 访问\n\n\
  11. 要启用日志，使用命令 `sudo ufw logging on`。\n\n## 测试防火墙配置\n\n在创建合适的配置后，确认你的防火墙配置确实实现了预期结果是非常关重要的。Linux\
  \ 防火墙提供了一种更快、更易用户的方法。它让你手动创建测试，并以处理真实数据报的方式通过防火墙执行测试。\n\n```\nNmap -p <port> <IP>\n\
  ```\n![](img/Fig-4.20.jpg)\n**图 4.20:** 工具\n\n我们还可以检查系统的 `iptables`。系统管理员可以使用用户空间实用软件\
  \ `IP tables` 配置 Linux 内核防火墙的 IP 包过滤规则，这些规则是以各种 netfilter 模块的形式实现的。过滤器根据几个表排列，这些表包含了规定如何处理网络流量的规则链。\n\
  \n\n\n\n密码学是网络安全的基石，是保护数字领域敏感信息的关键。随着网络变得越发互联，保护数据免受未经授权访问和篡改的需求呈指数级增长。密码技术提供了一个稳健的框架，通过采用数学算法对数据进行加密和解密来实现这一目标。通过加密，明文信息被转换为不可读的密文，使得任何缺乏相应解密密钥的人无法破译。这一过程确保了数据的机密性，这是网络安全通信的基本要求。\n\
  \n除了机密性之外，密码学在维护传输信息的完整性和验证通信双方身份方面起着至关重要的作用。哈希函数通过为数字内容生成唯一的指纹（哈希值），担任数据完整性的守护者。这种多维的密码学方法为网络通信建立了安全基础，促进了信息交换中的信任与可靠性。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 理解密码学及其类型\n* 密码学中使用的不同算法\n* 各种哈希技术及其应用\n* 使用密码学工具加密和解密数据\n\
  * 学习密码学攻击\n* 隐写术与密码学的区别\n\n## 理解密码学\n\n`cryptography` 一词源于希腊语单词 `graphein`（意思是写）和\
  \ `kryptos`（意思是隐藏或秘密）。`cryptography` 描述了使用代码和密码进行数据安全和安全通信的方法及研究。密码学的目标是在传输过程中和存储时对数据进行加密。在计算机科学中，密码学是对数学思想和技术的研究，通过使用加密密钥或方案将可读的明文转换为不可读的密文，从而防止通信被他人窥探。\n\
  \n密码学的主要目标包括：\n\n* **机密性 (Confidentiality)**：保护私有数据免受泄露或非法访问。可以使用加密对数据进行编码，使得只有获得授权的人才能对其进行解码和理解。\n\
  * **完整性 (Integrity)**：保证信息在发送、存储或处理过程中不被篡改。其目的是确保数据是准确的，且没有被意外或未经授权的个人所更改。\n* **身份验证\
  \ (Authentication)**：验证实体（人、设备或系统）的身份以确保其确实为其声称的身份，这就是身份验证的过程。可以使用数字签名、证书和身份验证方法验证消息中发送者或接收者的身份。\n\
  * **不可否认性 (Non-repudiation)**：不可否认性的目标是防止人们或事物对消息或数据的合法性或来源产生争议。换句话说，如果一个人同意做某事（例如发送消息或批准交易），他们就不应该撤回自己的同意或否认参与。数字签名极大地有助于不可否认性，因为一旦有人对文档或通信进行了数字签名，他们以后就无法撤回该签名。\n\
  \n# 密码学的类型\n\n根据加密和解密使用的密钥，加密分为两种：对称加密和非对称加密。\n\n### 对称加密\n\n对称加密是一种密码技术，使用相同的密钥对明文（原始数据）进行加密对密文（加密数据）进行解密。换句话之，通信双方存在一个共享的密钥，且该密钥保持保密以确保通信的安全。\n\
  \n以下是对称加密工作的基本概述：\n\n* 由发送者或密钥分发机制生成一个密钥。然后将该密钥安全地共享给目标接收者。\n* 将明文（原始数据）连同密钥输入加密算法。\n\
  * 算法将明文转换为密文，密文看起来是随机且无意义的数据。\n* 密文通过通信通道传输，或存储在数据库、云服务或其他存储介质中。\n* 拥有密钥的接收者将其密文输入解密算法。\n\
  * 算法反转加密过程，将密文转换回原始明文。\n* 对称加密的安全性取决于共享密钥的秘密性和完整性。如果未经授权的方获取了密钥，他们解密密文并访问原始数据。\n\
  \n![](img/Fig-5.1.jpg)\n\n**图 5.1:** 对称加密与解密\n\n### 非对称加密\n\n非对称加密也称为公钥密码学，是一种使用一对数学相关的密钥对数据进行加密和解密的密码技术。与使用相同密钥进行加解密的对称加密不同，非对称加密涉及一对密钥：公钥和私钥。\n\
  \n以下是对非对称加密原理的基本说明：\n\n* 为每个用户或企业生成一对密钥——公钥和私钥。尽管密钥之间存在数学关系，但无法从公钥计算出私钥。\n* **公钥\
  \ (Public key)**：任何想要与密钥所有者通信的人都可以获取并自由传播公钥。它可以包含在数字证书中，或发布在公钥服务器上。\n* **私钥 (Private\
  \ key)**：只有密钥所有者知道私钥，且必须保持保密。它绝不能分发或共享。\n* 使用接收者的公钥来加密旨在发送给密钥所有者的消息。只有私钥的所有者才能解码并读取该消息。\n\
  \n![](img/Fig-5.2.jpg)\n\n**图 5.2:** 非对称加密与解密\n\n在接下来的表中，我们可以看到对称加密和非对称加密之间的区别。\n\
  \n| 对称加密 | 非对称加密 |\n| :--- | :--- |\n| 使用单一的共享秘密密钥进行加密和解密。该密钥必须保持保密并在通信双方之间安全共享。\
  \ | 使用公钥加密、私钥解密，这两者是一对数学上关联的密钥。虽然私钥需要保持保密，但公钥可以无限制共享。 |\n| 挑战在于如何在通信双方之间安全地分发和管理秘密密钥。\
  \ | 公钥的发布使得密钥分发变得更容易。所有者是唯一知道秘密私钥的人。 |\n| 通常计算开销较小，适用于加密大量数据。 | 随着密钥长度的增加，计算开销往往更大。\
  \ |\n| 由于其简单性和处理效率，速度比非对称加密快。 | 不太适合加密大数据集，因为它比对称加密慢。 |\n| 缺乏交换秘密密钥的安全通道。 | 由于私钥不需要发送或共享给任何人，安全性更高。\
  \ |\n| 容易受到字典攻击和暴力破解。 | 容易受到中间人攻击和暴力破解。 |\n\n\n\n\n\n| 适用于批量数据加密，在这种情况下，效率和速度至关重要。通常用于磁盘加密、文件加密和数据传输等应用。\
  \ | 广泛用于数字签名、安全密钥交换以及保护少量数据的隐私。经常用于涉及数字签名、在线交易和安全通信的场景。 |\n\n**表 5.1:** *对称加密与非对称加密的差异*\n\
  \n### 加密算法\n\n将可读数据转换为不可读格式的过程被称为加密。通过增加未经授权的人员或系统访问、理解或更改原始数据的难度，加密起到了保护信息的作用。在许多不同领域，加密方法对于保护私有数据和对话至关重要。加密算法是一系列数学操作和规则的集合，用于将数据（即明文）转换为一种难以理解的格式（即密文）。\n\
  \n以下是一些用于加密数据的加密算法。\n\n## 数据加密标准 (DES)\n\n数据加密标准 (DES) 是一种对称密钥分组密码，在被更先进的加密算法取代之前，它被广泛用于安全数据传输和机密性。\n\
  \n*   分组密码是一种在固定大小数据块（位位组）上运行的确定性算法。`DES` 使用固定大小的 64 位块。每个明文块都被单独加密。\n*   `DES`\
  \ 是一种对称密钥技术，这意味着加密和解密是通过相同的秘密密钥完成的。通信双方必须安全地交换此共享密钥。64 位密钥由 56 个随机生成的位和用于错误检测所需的\
  \ 8 位组成。\n*   使用该秘密密钥，`DES` 算法将固定长度的明文位字符串转换为相同长度的密文位字符串。\n*   随着计算机算力的提高，56 位密钥长度被证明随着时间的推移容易受到暴力破解攻击。在这些攻击中，攻击者会系统地尝试每一个密钥来解密密文。\n\
  \n## 三重数据加密标准 (3DES)\n\n为了增强安全性，三重数据加密标准 (3DES) 作为 DES 的扩展被引入。\n\n3DES 使用不同的密钥应用了三次\
  \ `DES` 算法。虽然 3DES 更安全，但计算量也更大。\n\n*   `3DES` 使用的“密钥包”由三个 `DES` 密钥组成：`K1`、`K2` 和\
  \ `K3`。每个密钥都使用一个典型的 56 位 `DES` 密钥。然后执行以下过程：`DES` 使用 `K1` 加密，`DES` 使用 `K2` 解密，`DES`\
  \ 使用 `K3` 加密。\n*   对于密钥有三种选择。第一种选择中的三个密钥是不同的且独立运行。第二种选择中的 `K1` 和 `K3` 是相同的。第三种选择中的三个密钥完全相同。因此，你实际上是三次使用了同一个密钥和同一个\
  \ `DES` 方法。安全性最低的是第三种，最安全的是第一种。\n*   `DES` 算法为用户在物理驱动上存储加密数据提供了一种简单的方法。\n\n![](img/Fig-5.3.jpg)\n\
  \n**图 5.3:** *3DES 算法*\n\n### 高级加密标准 (AES)\n\n与 `DES` 类似，`AES` 是一种对称密钥方法，这意味着加密和解密是用同一个密钥完成。通信双方必须安全地交换共享秘密密钥。\n\
  \n*   它的分组大小为 128 位，密钥大小对于 `AES-128` 为 128 位，`AES-192` 为 192 位，`AES-256` 为 256 位。\n\
  *   因为其计算效率高，`AES` 可用于各种目的，包括跨多个平台的软件实现。\n*   密钥的大小影响 `AES` 中处理的轮数：\n    *   128\
  \ 位密钥：10 轮\n    *   192 位密钥：12 轮\n    *   256 位密钥：14 轮\n*   原始秘密密钥使用 `AES` 密钥扩展方法转换为一组轮密钥。每一轮加密都使用这些轮密钥来增加安全性能并增加复杂性。\n\
  *   数据在每个周期中都将经过混合、置换和替换程序的处理。\n*   `AES` 使用一种高安全分组密码架构，称为代换排列网络 (SPN) 结构。\n*  \
  \ `AES` 现在是一种广泛使用且受认可的加密系统。它用途广泛，包括保护敏感数据的机密性、加密文件和存储设备，以及促进安全的在线通信（例如 HTTPS）。\n\
  \n![](img/Fig-5.4.jpg)\n\n**图 5.4:** *AES 算法*\n\n### RSA (Rivest-Shamir-Adleman)\n\
  \n`RSA` 是一种广泛使用的非对称加密算法，以其发明者 Ron Rivest、Adi Shamir 和 Leonard Adleman 命名。它是一种公钥体系，广泛用于安全数据传输、数字签名和密钥交换。\n\
  \n![](img/Fig-5.5.jpg)\n\n**图 5.5:** *RSA 算法*\n\n`RSA` 的工作原理如下：\n\n*   两个两个质数（`x`\
  \ 和 `y`），并确定它们的积（ `p = xy`，其中 `p` 称为模）。\n*   `RSA` 选择一个小于 `p` 且与 `(x-1)(y-1)` 互质的数字\
  \ `n`。因此，`n` 和 `(x-1)(y-1)` 除了 1 没有公因子。\n*   此外，`RSA` 选择一个数字 `m`，使得 `nm` 能被 `(x-1)(y-1)`\
  \ 整除。\n*   值 `n` 和 `m` 分别是公次私指数。\n*   公钥为 `(p, n)`；私钥为 `(p, m)`。\n*   从公钥 `(p, n)`\
  \ 获取私钥 `(p, m)` 是困难的。但是如果有人能将 `p` 分解为 `x` 和 `y`，那么这个人就可以解密 `m`。\n\n分解两个大整数乘积的复杂性是\
  \ `RSA` 安全性的基础。\n\n数字签名使用 `RSA` 生成，提供了一种确认消息或文档完整性和有效性的手段。\n\n`RSA` 用于安全电子邮件协议中的数字和加密，例如\
  \ Pretty Good Privacy (PGP) 和 S/MIME。\n\n## 哈希\n\n哈希在密码学领域起着至关重要的作用，用于各种目的以确保数据完整性、提供认证并安全存储密码。\n\
  \n![](img/Fig-5.6.jpg)\n\n**图 5.6:** *哈希*\n\n### 哈希算法\n\n哈希算法是加密操作，将输入数据（有时称为 `message`）转换为固定长度的字符字符串，通常由哈希值或哈希代码表示。这些算法经常用于生成数字签名、维护密码安全并保证各种安全应用和协议中的数据完整性。\n\
  \n# 消息摘要算法 5 (MD5)\n\n**目标：** `MD5` 是一种加密哈希函数，接受任何输入数据（通常称为消息）并输出固定大小的 128 位哈希值（32\
  \ 个十六进制字符）。\n\n数据块由 `MD5` 算法处理，生成 128 位哈希。它利用移位、位逻辑运算（AND、OR、XOR）以及一系列模算运算。\n\n\
  **特性：**\n\n*   **确定性**：`MD5` 对于相同的输入总是生成相同的输出（哈希值）。\n*   **计算快速**：由于其相对快速且高效的计算，`MD5`\
  \ 可用于快速哈希操作。\n*   **不可逆性**：由于它被设计为单向函数，反转过程并从哈希值获取原始输入在计算上是不可能的。\n\n\n\n\n\n*  \
  \ **安全问题**：`MD5` 被认为在密码学上存在缺陷，在安全是首要考虑的情况下不应再次使用。它包含的弱点使其容易受到特定类型攻击的影响，例如碰撞漏洞（不同的输入产生相同的哈希值）。\n\
  *   **常见用途**：在过去，完整性检查和校验和是 `MD5` 的两种常见用途。对于密码学应用，由于其局限性，目前强烈不建议使用。\n*   **漏洞**：当两个不同的输入产生相同的哈希值时，`MD5`\
  \ 容易受到碰撞攻击。对于数字签名或证书生成等安全关键型应用，这使其变得不再适用。\n\n# 安全哈希算法 (SHA)\n\nSHA 是由美国国家安全局（NSA）设计并由美国国家标准与技术研究院（NIST）发布的一系列加密哈希函数。这些哈希函数每一个属于不同的家族，并提供不同级别的安全性。\n\
  \n### SHA-1\n\n*   该函数的输出结果大小为 160 位（20 字节）。\n*   **漏洞**：不同的输入可以生成相同的哈希值，使其容易受到碰撞攻击。由于这些缺陷，从密码学角度考虑，它不再被认为是安全的。\n\
  *   **用法**：考虑到密码学的发展，已过时。它曾被用于证书、数字签名和其他安全流程。\n\n### SHA-2\n\n*   SHA-2 家族中有多个不同输出宽度的哈希函数版本。\n\
  \    *   `SHA-224`：224 位（28 字节）。\n    *   `SHA-256`：256 位（32 字节）。\n    *   `SHA-384`：384\
  \ 位（48 字节）。\n    *   `SHA-512`：512 位（64 字节）。\n*   **安全性**：被认为是安全的，并广泛应用于许多密码学领域，例如区块链技术、`SSL/TLS`、数字签名和证书。\n\
  *   **抗碰撞性**：对碰撞提供了高程度保护，使得两个不同的输入很难生成相同的哈希值。\n*   **应用**：用于许多对数据完整性至关重要的安全程序。\n\
  \n### SHA-3\n\n*   `SHA-3` 是安全哈希算法家族的最新成员，其内部结构与 `SHA-1` 和 `SHA-2` 不同。它是通过公开竞赛选出的。\n\
  *   **输出大小**：可变（例如 `SHA3-256` 输出 256 位）。\n*   **安全性**：根据 2022 年 1 月的最新更新，`SHA-3`\
  \ 被认为是安全的，为加密哈希函数提供了额外的选择。\n*   **特性**：与 `SHA-1` 和 `SHA-2` 使用的 Merkle-Damgård 结构相比，使用了不同的海绵结构。\n\
  *   **应用**：虽然没有 `SHA-2` 那么广泛，但 `SHA-3` 已用于各种安全应用，其使用可能会随时间的推移而增加。\n\n# RACE 完整性原语消息摘要\
  \ (RIPEMD-160)\n\n名为 `RIPEMD-160` 的加密哈希算法生成 160 位固定大小的哈希值。它是欧洲高级通信技术研究（RACE）项目期间创建的哈希函数之一，由\
  \ Hans Dobbertin、Antoon Bosselaers 和 Bart Preneel 创建。\n\n*   **输出长度**：`RIPEMD-160`\
  \ 生成的 160 位哈希值通常表示为 40 个十六进制整数。\n    `RIPEMD-160` 的主要目标包括数据完整性验证、数字签名和其他安全应用，与其他加密哈希函数相似。\n\
  *   **算法**：为了处理输入数据，`RIPEMD-160` 使用了移位、模加和一系列位逻辑操作。它使用特定的数学运算和轮次构建结构。\n*   **安全性**：`RIPEMD-160`\
  \ 的构建考虑了防御一系列密码学威胁，例如碰撞攻击。对于对安全性要求更高的应用，当安全标准变化时，必须考虑更新的哈希算法。\n*   **常见用途**：各种加密协议和应用都使用了\
  \ `RIPEMD-160`。一个突出的应用是在比特币协议中，它用于生成比特币地址所需的公钥加密哈希。\n\n## 哈希的应用\n\n哈希有多种应用，包括：\n\
  \n## 文件哈希\n\n*   文件哈希的主要目标是验证文件的完整性和真实性。它确认了信息在发送或存储过程中没有被篡改。\n*   **应用**：为了产生哈希值，会对原始数据应用哈希函数。发送者可以发送数据及其哈希值。之后，接收方可以独立地对其接收的数据进行哈希，并通过将计算出的哈希与发送的哈希比较来验证其完整性。\n\
  \n### 数字签名\n\n*   数字签名的目标是提供一种安全的方法来确认数字消息或文档的完整性和真实。\n*   **应用**：使用哈希函数创建消息的固定大小表示（即哈希）。然后使用发送者的私钥对该哈希进行签名，创建数字签名。接收方可以使用发送者的公钥验证签名，并将计算出的哈希与对接收的消息进行单独计算的哈希进行比较。\n\
  \n### 密码存储\n\n*   密码存储的目标是安全地隐藏密码，防止窥探。\n*   **应用**：系统保存哈希后的密码值而非实际明文密码。系统会对登录时输入的密码进行哈希处理，并与保存的哈希进行比较。在发生数据泄露时，这种策略保护了密码，增加了安全性。\n\
  \n## 密钥派生函数\n\n*   是从低熵输入（如密码）中提取加密密钥的目标。\n*   **应用**：为了从密码创建加密密钥，密钥派生函数使用了哈希函数。通过增加计算复杂度，该过程增加了攻击者破解的难度。\n\
  \n## 消息认证码\n\n*   消息认证码 (`MAC`) 和哈希消息认证码 (`HMAC`) 的目标是保证消息的真实性和完整性。\n*   **应用**：通过哈希算法生成消息的固定大小哈希值并与密钥密钥配对。通过查看生成的\
  \ `MAC`，可以确认消息没有被篡改且来自可靠来源。\n\n## 区块链技术\n\n*   区块链技术的目标是保护分布式账本的交易完整性。\n*   **应用**：区块链由一系列连接的块组成，每个块包含前一个块的哈希。这通过确保更改一个块也会修改后续所有的块，从而保证高安全性。\n\
  \n## 数据去重\n\n*   数据去重的目标是有效地查找并删除重复数据。\n*   **应用**：哈希函数产生数据块哈希值。相同的数据块提供相同的哈希结果，即可区分重复数据。\n\
  \n## 加盐\n\n*   在密码哈希中添加盐的目的是保护其免受彩虹表攻击。\n*   **应用**：在哈希之前，将密码与随机数（盐）拼接。这确保了即使两个用户的密码相同，也会产生不同的哈希结果。\n\
  \n## 一次密码 (OTP)\n\n一次性密码 (`OTPs`) 是一种加密安全功能，生成的密码仅对单个计算机系统或其他数字设备登录话或交易有效。`OTPs`\
  \ 具有时间敏感性且仅限一次使用，在静态密码之上提供了额外的保护。\n\n\n\n\n# 基于时间的一次性密码 (TOTP)\n\n* 它基于哈希消息认证码 (HMAC)\
  \ 算法。\n* **描述**：双因子身份验证 (2FA) 通常通过 TOTP 实现。它依赖于客户端和服务器共享一个密钥。使用当前时间和和一个移动因子（或时间步长——通常为\
  \ 30 秒）来构建一次性密码 (OTP)。基于计数器的 HMAC (HOTP) 是一种经常与 `SHA-1` 或 `SHA-256` 哈希配合使用的哈希函数。\n\
  \n## 基于计数器的哈希消息认证码 (HOTP)\n\n* **算法**：基于 `HMAC`。\n* **概述**：HOTP 使用每次使用都会增加的计数器值来生成\
  \ OTP。通过对计数器值应用 `HMAC` 生成 OTP，服务器和客户端交换一个密钥。\n\n## 通用第二因子 (U2F)\n\n* 用于通用第二因子 (U2F)\
  \ 的算法是公钥密码学。\n* 快速身份在线 (FIDO) 联盟是建立 U2F 标准的组织。为了创建 OTP，它利用公私密钥对。在注册期间，设备创建一个公私密钥对，私钥安全地保存在设备上。服务提供商保留公钥。在身份验证期间，服务提供商使用\
  \ `nonce` 对设备发起，设备使用其私钥对 `nonce` 进行签名。\n\n### 基于移动设备的 OTP\n\n* 它基于各种算法（通常基于 TOTP）。\n\
  * 描述：在移动设备上，许多应用程序（如 Authy 和 Google Authenticator）创建 OTP。对于基于时间的 OTP，它们经常使用基于 TOTP\
  \ 的算法。\n\n## 密码学工具\n\n密码学工具是实现加密技术以保护信息和通信的软件或硬件应用程序。这些工具用于保护数据的机密性、完整性和真实性。\n\n\
  ### GnuPG (GPG)\n\nGnuPG 也称为 `GPG`，是一个强大且广泛使用的 OpenPGP 标准开源实现，用于安全通信和数据加密。\n\n要在你的系统中安装\
  \ `GPG`，请使用以下命令：\n\n![](img/Figure-5.7.jpg)\n\n**图 5.7：** 安装 GPG\n\n现在，使用以下命令生成\
  \ `GPG` 密钥对：\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8：** 生成 GPG 密钥对\n\n按照接后的提示输入名称和电子邮件\
  \ ID，并为你的密钥设置一个强密码短。\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9：** 密码短\n\n现在，你的密钥已生成。\n\
  \n![](img/Figure-5.10.jpg)\n\n**图 5.10：** 密钥已生成\n\n此信息包含了关于你的公钥的细节。密钥类型为 `RSA`，密钥大小为\
  \ 3072 位。以下是信息的分解：\n\n* 密钥类型：`RSA 3072-bit`\n* 密钥过期日期：`2025 年 12 月 10 日`\n* 密钥 ID：`ED8D7DA52A806EC110A27EC44C3416D909D9B9D2`\n\
  * 用户 ID (UID)：`Admin <admin@gmail.com>`\n\n此外，还有一个具有相同 `RSA 3072-bit` 类型且过期日期与主密钥匹配的子密钥。\n\
  \n要加密文件，使用以下命令：\n\n```bash\ngpg --encrypt --recipient <key ID> -o <newfilename.gpg>\
  \ <filename>\n```\n\n![](img/Figure-5.11.jpg)\n\n**图 5.11：** 加密文件\n\n加密后的文本存储在 `encrypted_file.gpg`\
  \ 中，你可以使用 `nano encrypted_file.gpg` 查看内容。\n\n现在，如果你想解密一个加密文件，请使用以下命令：\n\n```bash\n\
  gpg --decrypt <encryptedfilename> <new file>\n```\n\n![](img/Figure-5.12.jpg)\n\n\
  **图 5.12：** 解密文件\n\n输入你密钥的密码短。\n\n![](img/Figure-5.13.jpg)\n\n**图 5.13：** 输入密码短\n\
  \n解密后的文本将存储在新文件中。\n\n### OpenSSL\n\nOpenSSL 是 SSL/TLS 协议的健壮开源实现，提供了多功能的加密函数集。\n\n\
  使用以下命令创建对称密钥：\n\n```bash\nopenssl rand -base64 32 > encryption_key.txt\n```\n\n\
  ![](img/Figure-5.14.jpg)\n\n**图 5.14：** OpenSSL\n\n此命令生成 32 字节的随机数据，以 Base64 格式编码，然后将结果保存到名为\
  \ `encryption_key.txt` 的文件中。\n\n可以使用 `nano` 或 `cat` 命令打开密钥文件。\n\n加密文件：\n\n```bash\n\
  openssl enc -aes-256-cbc -salt -in <filename> -out <encrypted_file.enc> -pass file:encryption_key.txt\n\
  ```\n\n![](img/Figure-5.15.jpg)\n\n**图 5.15：** 加密文件\n\n解密文件：\n\n```bash\nopenssl\
  \ enc -aes-256-cbc -d -in <encrypted_file.enc> -out <decrypted_file> -pass file:encryption_key.txt\n\
  ```\n\n## 消息摘要算法 5 (MD5) 计算器\n\n一种名为 MD5 的流行哈希算法生成 128 位的哈希值，通常显示为十六进制整数。MD5 经常用于确认数据的完整性。要创建文件的哈希，请使用以下命令：\n\
  \n```bash\nmd5sum <filename>\n```\n\n要比较两个不同文件的哈希，请使用以下命令：\n\n```bash\ndiff <hash1.txt>\
  \ <hash2.txt>\n```\n\n\n\n这就是为什么建议使用慢速且计算开销大的哈希算法（如 `bcrypt` 或 `Arg2`）对密码进行哈希处理的原因之一。\n\
  \n可以使用多种策略来防止暴力破解攻击，例如：\n\n*   **复杂的密码规定**：确保人员使用安全且唯一的密码。\n*   **账户锁定策略**：为了防止自动化暴力破解，在登录失败一定次数后临时冻结账户。\n\
  *   **速率限制**：为了减慢暴力破解的速度，对特定时间内登录尝试次数进行限制。\n*   **采用强健的加密**：通过使用长密钥和强健的加密方法，可以大幅增加成功暴力破解所需的时间和资源。\n\
  \n# 中间相攻击 (Meet-in-the-Middle Attack)\n\nMITM 攻击（不要与中间人攻击 Man-In-The-Middle attack\
  \ 混淆）是一种密码分析攻击，它通过执行预计算和暴力破解攻击的组合来破解加密系统。这种攻击对于使用两步过程（如双重加密或密钥交换机制）的加密系统特别有效。\n\n\
  以下是中间相攻击工作原理的概述：\n\n*   **预计算阶段**：攻击者预计算并存储加密过程或密钥生成过程中一部分的结果。这通常涉及尝试过程的前半部分的所有可能的密钥，并存储中间结果。\n\
  *   **暴力破解阶段**：攻击者对过程的后半部分进行暴力破解，尝试所有可能的密钥直到找到匹配项。由于预计算阶段的中间结果已经存储，攻击者在暴力破解阶段不需要重新计算它们。\n\
  \n**示例：**\n\n举个例子，经过双重 DES 加密后产生的消息为 `hPe`，明文为 `Boy.`。攻击者使用所有 256 个可能的单 DES 密钥对\
  \ `key1` 进行暴力破解，对明文 `John.` 密加密，并将每个密钥与相应的中间密文一起记录在表中，以便检索用于加密的两个密钥（即 `key1` 和 `key2`）。通过暴力破解，攻击者对\
  \ `hPe` 进行最多 256 次解密。当初始暴力破解后在密文表中找到的中间密文与第二次尝试的结果相同时，该攻击被视为成功。攻击者一旦找到匹配项，就可以识别出两个密钥并完成攻击。这种攻击最多需要\
  \ 257 次操作，或者最多 256 次。当双重 DES 结合时，这使得攻击者能够获取数据。\n\n# 彩虹表攻击 (Rainbow Table Attack)\n\
  \n彩虹表攻击是一种密码破解攻击，涉及使用预计算表来破解密码哈希值。出于安全考虑，密码通常以哈希值而非明文存储在数据库中。哈希函数将密码转换为固定长度的字符串，使得攻击者难以逆转该过程获取原始密码。在彩虹表攻击中，攻击者使用一个预计算表（彩虹表），该表包含明文密码及其对应哈希值的值对。这些表是通过预先对大量可能的密码进行哈希并将结果存储在表中生成的。一旦创建了表，就可以快速查找被捕获密码的哈希并找到对应的明文值。\n\
  \n彩虹表攻击背的基本思想是用存储空间换取计算时间。攻击者在攻击过程中不再计算密码的哈希，而是快速从彩虹表中查找预计算的哈希值。这种方法对于没有包含额外安全措施（如加盐\
  \ salting）的密码哈希系统是有效的。\n\n![](img/Figure-5.20.jpg)\n\n**图 5.20：** 彩虹表攻击\n\n为了防御彩虹表攻击，许多系统使用名为\
  \ `salting`（加盐）的技巧。为每个用户生成一个唯一的随机值（盐），并在哈希处理之前与其密码结合。这意味着即使两个用户具有相同的密码，由于唯一的盐，它们的哈希值也是不同的。因此，彩虹表变得不再那么有效，因为无法为每种可能的盐值进行预计算。\n\
  \n# DROWN 攻击\n\nDROWN 攻击（使用过时和弱化的加密解密 RSA）是一种安全漏洞，针对支持 SSL/TLS 但仍在使用过时的 SSLv2（安全套接层版本\
  \ 2）协议的服务器。DROWN 允许攻击者解密用户浏览器与易受服务器之间的安全通信。\n\n![](img/Figure-5.21.jpg)\n\n**图 5.21：**\
  \ DROWN 攻击\n\n以下是关于 DROWN 攻击的关键点：\n\n*   **SSLv2 漏洞**：该攻击利用 SSLv2 协议的漏洞，它是 SSL/TLS\
  \ 协议过时且不安全的版本。SSLv2 有许多安全缺陷，强烈建议不要使用。\n*   **跨协议攻击**：DROWN 是一种跨协议攻击，这意味着它允许攻击者利用一个协议（SSLv2）中的漏洞来支持更现代更安全协议（如\
  \ TLS，传输层安全）的服务器。\n*   **加密密钥恢复**：该攻击的工作原理是利用服务器上多个协议共同使用同一个私钥的情况。攻击者可以使用 SSLv2\
  \ 对服务器执行一系列特殊构造的连接。通过这些连接，攻击者最终可以恢复更安全协议（例如 TLS）所使用的加密密钥。\n*   **影响**：如果成功，攻击者可以解密并监听用户与受影响服务器之间的安全通信。这可能包括敏感数据，如登录凭据、个人信息或财务交易。\n\
  *   **缓解措施**：DROWN 攻击的主要缓解措施是禁用服务器对 SSLv2 的支持。此外，鼓励组织使用强且最新的加密协议（如 TLS），并更新软件和系统以修复漏洞。\n\
  \n## 侧信道攻击 (Side-Channel Attack)\n\n侧信道攻击是一种安全攻击，其重点是利用系统在正常运行期间泄露的信息，而不是尝试直接破解加密算法本身。这些攻击利用来自各种侧信道的无意信息泄露，例如功耗、电磁辐射、计时或声音。\n\
  \n以下是一些常见的侧信道攻击类型：\n\n*   **计时攻击**：计时攻击涉及分析系统执行某些操作所需的时间。通过测量这些时间，攻击者可能会获得系统内部运作的见解，特别是在涉及加密操作时。例如，执行时间的变化可能会暴露密钥信息。\n\
  *   **功耗分析攻击**：功耗分析攻击利用设备在加密操作期间功耗的变化。通过监控功耗模式，攻击者可以推断出所使用的加密密钥。这在功耗随处理的位值而变化的情况下尤为相关。\n\
  *   **电磁分析攻击**：与功耗分析类似，电磁分析攻击侧重于测量设备在加密操作期间产生的电磁辐射。通过分析电磁发射的波动，可以推导出系统内部状态的信息。\n\
  \n\n\n\n*   **声学密码分析 (Acoustic Cryptanalysis)**：声学密码分析涉及分析系统在加密操作过程中产生的声音。例如，计算机硬盘或键盘发出的可能会泄露正在执行活动的信息，包括加密密钥生成。\n\
  \n*   **基于缓存的攻击 (Cache-based Attacks)**：这些攻击利用访问系统缓存中数据的时间差异。通过仔细测量这些访问时间，攻击者可能会推断出正在处理的数据信息。\n\
  \n![](img/Figure-5.22.jpg)\n\n**图 5.22:** *侧信道攻击*\n\n以下是一些侧信道攻击的防御措施：\n\n*   **算法措施\
  \ (Algorithmic countermeasure)**：使用抵抗侧信道攻击的算法。\n\n*   **随机化技术 (Randomization techniques)**：在加密过程中增加不可预测性，以增加攻击者模式识别的难度。\n\
  \n*   **恒时间实现 (Constant-time implementations)**：为了减少计时攻击，确保加密程序的执行时间不依赖于秘密值。\n\n\
  *   **防护屏蔽 (Protective shielding)**：实施具体的安全措施以减少噪声和电磁辐射。\n\n*   **硬件安全模块 (HSMs)**：使用内置侧信道攻击防御的专用硬件，HSM\
  \ 旨在安全地执行加密操作。\n\n# 密码分析工具\n\n### John the Ripper\n\nJohn the Ripper（通常简称为 John）是一种广泛使用的开源密码破解工具。它通过使用各种破解方法（如字典攻击、暴力破解和混合攻击）来识别弱密码。John\
  \ the Ripper 支持多个平台，包括 Linux、Windows 和 macOS。它通常用于道德黑客、渗透测试和安全评估。\n\n以下是 John the\
  \ Ripper 的一些关键方面：\n\n*   **密码破解技术 (Password Cracking Techniques)**：\n\n    *   **字典攻击\
  \ (Dictionary Attack)**：John the Ripper 使用词列表（字典）系统地尝试不同的单词和短语作为潜在密码。\n\n    * \
  \  **暴力破解 (Brute-Force Attack)**：它可以通过尝试所有可能的密码组合来执行穷举搜索，这可能耗时但有效。\n\n    *   **混合攻击\
  \ (Hybrid Attack)**：它将字典攻击与暴力破解结合起来以提高效率。\n\n*   **哈希算法 (Hash Algorithms)**：John\
  \ the Ripper 支持广泛的加密哈希算法，包括 DES、MD5、SHA-1、SHA-256 等。\n\n*   **社区版 (Community Editions)**：John\
  \ the Ripper 有多个版本，包括“John the Ripper 社区版”（John the Ripper Jumbo）和“John the Ripper\
  \ Pro”（一个带有额外功能的商业版本）。\n\n*   **平台支持 (Platform Support)**：John the Ripper 适用于各种操作系统，包括\
  \ Linux、Windows 和 macOS。\n\n*   **自定义 (Customization)**：用户可以自定义攻击参数、规则和词列表，以根据其特定需求定制密码破解过程。\n\
  \n### Hashcat\n\n使用 Hashcat 可以通过暴力破解、字典攻击和其他复杂方法来破解不同类型的密码哈希。它是一个广受欢迎且强大的开源密码恢复程序。由于它支持多种哈希算法，因此它适用于各种安全评估和渗透测试任务。\n\
  \n*   **哈希算法 (Hash Algorithms)**：Hashcat 支持 MD5、SHA-1、SHA-256、SHA-512 等许多哈希算法。它能够胜任。\n\
  \n*   **攻击模式 (Modes of Attack)**：\n\n    *   **暴力破解 (Brute-Force Attack)**：Hashcat\
  \ 通过尝试所有可能的密码组合来执行穷举搜索，这可能耗时但有效。\n\n    *   **字典攻击 (Dictionary Attack)**：Hashcat\
  \ 使用词列表（字典）系统地尝试不同的单词和短语作为潜在密码。\n\n    *   **混合攻击 (Hybrid Attack)**：Hashcat 将字典攻击与暴力破解结合起来以提高效率。\n\
  \n*   **性能 (Performance)**：Hashcat 能够处理多种哈希算法。\n\n*   **用例 (Use Cases)**：Hashcat\
  \ 经常用于道德黑客和渗透测试。\n\n## 公钥基础设施\n\n公钥基础设施或 `PKI` 是一种支持信息传输的强有力架构。`PKI` 从根本上使用公钥加密技术。\n\
  \n**公私钥对 (Pairs of Public and Private Keys)**：`PKI` 为用户提供一个保密的私钥和一个共享的公钥。\n\n**数字证书\
  \ (Digital Certificates)**：在 `PKI` 中，数字证书是至关重要的。这些证书通过将实体的公钥与该身份关联，为人们提供验证密钥所有者的方法。证书中包含了密钥数据、颁者详细信息、身份信息以及由可靠的\
  \ `CA` 生成的数字签名。\n\n**机构的角色 (The Role of Authorities)**\n\n*   **证书权威 (CAs)**：`CAs`\
  \ 是负责创建和确认数字证书的可靠第三方。`PKI` 的核心由 `CAs` 运行。它们负责确认获取数字证书的机构的身份，并授予证明相应公钥的证书。在链的顶端，根\
  \ `CAs` 向中间 `CAs` 发行证书，然后由后者向终端实体发放证书。\n\n*   **注册机构 (RA)**：当注册机构 (`RAs`) 与 `CAs`\
  \ 协作时，它们作为证书请求的转发代理和验证者。在将用户请求转发给 `CA` 之前，`RAs` 会验证用户。\n\n*   **证书吊销列表 (CRL)**：`CAs`\
  \ 发布 `CRLs` 以维护安全性。用户和依赖方可以使用这些列表来确认证书的真实性，因为它们包含了在过期日期之前被吊销的证书序列号。\n\n`PKI` 程序涉及的步骤列如下：\n\
  \n1. 主体（人、企业或系统）向注册机构 (`RA`) 请求证书，以便安全地通信信息。\n2. 在确认主体的身份后，`RA` 获取来自主体的请求并要求 `CA`\
  \ 授予用户公钥证书。\n3. 一旦 `CA` 生成公钥证书，修改后的数据随后会被转发给验证机构 (`VA`)。\n4. 完成交易后，用户在使用公钥证书进行数字签名后，将消息传递给客户端。\n\
  5. 通过询问 `VA` 用户的公钥证书是否仍然，客户端可以确认用户的身份。\n6. `VA` 通过将用户的公钥证书与 `CA` 提供的新数据进行对比，评估结果（有效或无效）。\n\
  \n# 隐写术\n\n\n\n\n隐写术是将信息隐藏在文本、图像、音频、视频等看似无害的其他数据中的一种实践。它是各方之间进行机密通信的有效方法。这种技术通过将秘密数据隐藏在普通的、非秘密的文件或消息中来避免检测，然后在目标位置提取出这些秘密数据。隐写术的使用可以与加密相结合，作为隐藏或保护数据的额外步骤。\n\
  \n隐写术与密码学是不同的。将两者结合使用可以帮助提高受保护信息的安全性，并防止机密通信被检测。如果隐藏的数据也经过了加密，数据可能仍然能够免受检测，尽管信道将不再能免受检测。与仅使用加密的通信相比，隐写术与加密相结合具有优势。\n\
  \n使用隐写术隐藏数据相比于密码学的主要优势在于，它有助于模糊敏感数据隐藏在文件或其他载有隐藏文本的内容中的事实。相比之下，加密的文件、消息或网络包载荷会被明确标记并识别为此类内容，而使用隐写技术则帮助隐藏安全通道的存在。\n\
  \n# 隐写算法\n\n隐写算法是在将秘密数据嵌入其他非秘密数据（载体媒体）中以隐藏嵌入信息存在的技术或方法。存在多种隐写算法，每种算法都有其优缺点。\n\n\
  一些常见的隐写算法包括：\n\n### 最低位 (LSB)\n- `LSB` 算法涉及将载体媒体（如图像像素或音频样本）的最低位替换为秘密数据的位。\n- 这是最且应用最广泛的隐写技术之一。\n\
  - 它被用于 `Steghide` 等工具中。\n\n### 扩频\n- 该技术将数据分布在宽泛的频谱上，使其难以检测。\n- 跳频和直接序列扩频是扩频隐写中的常用方法。\n\
  \n### 变换域技术\n- 技术如 `离散余弦变换 (DCT)` 或 `离散小波变换 (DWT)` 可以应用于频率域或变换域中隐藏数据。\n- `JPEG`\
  \ 和 `JPEG2000` 图像通常使用频率域隐写。\n\n### 相位编码\n- 该技术通过修改信号的相位信息来编码隐藏数据。\n- 它常用于音频隐写。\n\
  \n### 回声隐藏\n- 这通过操纵音频信号中的回声来嵌入信息。\n- 它利用了人耳在某些情况下忽略回声的能力。\n\n### F5 算法\n- `F5` 算法是一种基于\
  \ `LSB` 和纠错码的隐写算法，旨在增加安全性和抗攻击能力。\n\n### Jsteg\n- `Jsteg` 是一种用于在 `JPEG` 图像中隐藏信息的算法。它修改了\
  \ `JPEG` 编码过程的量化表。\n\n### 基于混沌的技术\n- 可以通过使用混沌函数对隐藏信息进行编码和解码应用于隐写。\n\n### 混合技术\n\
  - 结合多种隐写技术可以增强安全性，并增加检测难度。\n\n# 隐写工具\n\nLinux 上的隐写工具允许用户在其他文件或媒体中隐藏信息，以保护敏感数据或进行秘密通信。\n\
  \n### Steghide\n`Steghide` 是一种流行的命令行工具，用于在各种图像和音频文件中嵌入和提取数据。\n\n要在图像文件中隐藏数据，请使用以下命令：\n\
