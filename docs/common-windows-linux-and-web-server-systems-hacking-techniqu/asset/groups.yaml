    ## 理解跨站脚本 (XSS)


    跨站脚本攻击是一种注入问题，将恶意脚本注入到受信任的网站中。跨站脚本 (XSS) 发生在 Web 应用使用用户输入而未进行验证或编码时。攻击者可以使用 XSS
    发送脚本，因为他们认为脚本来自信任源，恶意脚本可以访问 cookie 或敏感信息。这些脚本可以重写 HTML 页面的内容。- 原因是 Web 程序允许攻击者执行命令。如果攻击者编写了代码，那么应用程序存在
    XSS 漏洞。

    - 存在持久型 XSS 和反射型 XSS 攻击


    ## 持久型攻击（Persistent）


    持久型攻击是将注入的代码永久存储在目标服务器上，例如数据库、论坛、评论字段等。当用户请求时，从服务器检索恶意脚本


    ## 反射型攻击（Reflected）


    反射型攻击是指注入的代码从 Web 服务器反射，例如错误信息、搜索结果或任何包含发送到服务器输入的响应。反射型攻击通过另一种路由交付受害者，例如电子邮件，或者用户被骗点击恶意链接或提交特制的表单，注入的代码到达漏洞服务器并反射回用户的浏览器，因为它来自“信任”服务器。-
    反射型 XSS 攻击通过注入 URL 进行，我们称之为。在持久型攻击中，它存储在数据库中并非常危险，因为任何人访问帖子，代码就会应用到他们的计算机。


