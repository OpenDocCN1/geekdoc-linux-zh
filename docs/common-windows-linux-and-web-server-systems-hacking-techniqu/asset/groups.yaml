    # Brute Force Vulnerability


    During this type of attack, the attacker is trying to bypass security mechanisms
    while having minimal knowledge about them. Using one or more accessible methods:
    dictionary attack (with or without mutations), brute-force attack (with given
    classes of characters e.g.: alphanumeric, special, case (in)sensitive the attacker
    is trying to achieve his/her goal. Considering a given method, number of tries,
    efficiency of the system, which conducts the attack and estimated efficiency of
    the system which is attacked, the attacker is able to calculate how long the attack
    will have to last. Non brute-force attacks, on the other hand, which includes
    all classes of characters, give no certainty of success.


    Brute-force attacks are mainly used for guessing passwords and bypassing access
    control. However there are a lot of tools which use this technique to examine
    the web service''s catalogue structures and seek interesting, from the attacker''s
    point of view. Very often of the attack data are in forms (GET/POST) and use Session-Ids.


