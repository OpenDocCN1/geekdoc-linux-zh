    ## Client side attack: Hack Windows by Java Applet


    This exploit creates a jar file via exploit: java, then signs it. The resulting
    signed applet is presented to the victim via a web page. On older versions the
    victim''s JVM will show a dialog asking if they trust the signed applet. Newer
    versions will display a WARNING in the ''Publisher'' line when the signature is
    not trusted (i.e. not signed by a trusted CA). The SigningCert option allows you
    to provide a trusted code signing cert, which values will override. If SigningCert
    is not given, a randomly generated self-signed cert will be used. Either way,
    once the user clicks "run", the exploit executes with full permissions.


    ![](img/91b4da451291288ee84ff207e2121)


