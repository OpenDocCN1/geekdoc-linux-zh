    # 6. Part E: Windows and Linux Hacking


    a) Understanding Server Side Attack and Client Side Attack


    ![](img/91b4da451291288ee84ff207e23ccb97_115_0.png)


    +   * Server Side Attack

    * Hacker use exploit can be launched over network and work without any action
    from user

    * The exploit in system or O.S uses metasploit for attack by server side attack

    * Client Side Attack

    * These are attacks that target vulnerabilities in client applications that interact
    with a malicious server or process malicious data. Here, the client initiates
    the connection that could result in an attack. If a client does not interact with
    a server, it is not at risk, because it doesn''t process any potentially harmful
    data sent from the server.


    # How Do Reverse-Connecting Trojans?


    Reverse-connecting Trojans let an attacker access a machine on the internal network
    from the outside. The hacker can install a simple Trojan program on a system on
    the internal network, such as the reverse WWW shell server. On a regular basis
    (usually every 60 seconds), the internal server tries to access the external system
    to pick up commands. If the attacker has typed something into the master system,
    this command is retrieved and executed on the internal system. Reverse WWW shell
    uses standard HTTP. It''s dangerous because it''s difficult to detect—it looks
    like a client is browsing the Web from the internal network.'
