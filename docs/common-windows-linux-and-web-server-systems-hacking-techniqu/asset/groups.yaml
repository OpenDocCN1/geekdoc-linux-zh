    ## 客户端攻击：通过 Java Applet 攻击 Windows


    此漏洞通过 exploit: java 创建一个 jar 文件，然后对其进行签名。生成的签名 applet 通过网页呈现给受害者。在旧版本中，受害者的 JVM
    将显示对话框，询问他们是否信任该签名 applet。较新版本在签名不受信任时会在“发布者”行显示警告（即未受信任的 CA 签名）。SigningCert 选项允许你提供受信任的代码签名证书，该值将被覆盖。如果没有提供
    SigningCert，将使用随机生成的自签名证书。无论如何，一旦用户点击“运行”，漏洞将以全权限执行。


    ![](img/91b4da451291288ee84ff207e2121)


    - 这是一个客户端攻击。当黑客在 metasploit 中使用 java signed applet 模块时，它将作为服务器，并有一个带有 java 反向
    payload 的网站。它要求客户端拥有 java 应用程序以执行 java payload。任何访问网站的人都会下载并安装 payload，黑客就可以控制该计算机。它可以攻击任何带有
    java 应用程序的机器。

    - 你设置 LHOST 和 RHOST 黑客 ip 地址。LPORT 可以是任何端口，RPORT 放 8080 或 80 或任何端口。使用 URI 部分。


    ![](img/91b4da451291288ee84ff207e2121.png)


