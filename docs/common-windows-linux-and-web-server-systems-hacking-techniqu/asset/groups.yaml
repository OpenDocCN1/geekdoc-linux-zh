    ## k) Understanding Blind SQL injection:


    Blind SQL (Structured Query Language) injection is a type of SQL injection that
    attacks the database or false questions and determines the answer based on the
    application''s response. This attack is often used when the web application is
    configured to show generic error messages, but has not mitigated the code that
    is vulnerable to SQL injection.


    When an attacker exploits SQL injection, sometimes the web application displays
    error messages from the database claiming that the SQL Query''s syntax is incorrect.
    Blind SQL injection is nearly identical to normal SQL Injection, the only difference
    is the way the data is retrieved from the database. When the database does not
    output data to the web page, an attacker is forced to steal data by asking the
    database a series of true or false questions. This makes exploiting the SQL injection
    vulnerability more difficult, but not impossible.


