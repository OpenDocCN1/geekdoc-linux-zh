    ## 理解盲注 SQL 注入：


    盲注 SQL（结构化查询语言）注入是 SQL 注入的一种，通过询问数据库真假问题来确定答案。这种攻击通常用于 Web 应用配置为显示通用错误信息但未进行缓解的情况。当攻击者利用
    SQL 注入时，Web 应用有时会显示 SQL 语法错误。盲注 SQL 注入与普通 SQL 注入几乎相同，区别在于从数据库检索数据。当数据库不将数据输出到
    Web 页面时，攻击者通过向数据库提出一系列真或假问题来强制获取数据，这使得利用 SQL 注入变得困难。在盲注 SQL 注入中，我们将取决于错误信息。


