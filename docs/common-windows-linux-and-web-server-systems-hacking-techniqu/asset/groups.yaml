    # Ethical Hacking Techniques:


    +   - Dictionary - A file of words is run against user accounts, and if the password
    is a simple word, it can be found pretty quickly.


    +   - Hybrid attack - A common method utilized by users to change passwords is
    to add a number or symbol to the end. A hybrid attack works like a dictionary
    attack, but adds simple numbers or symbols to the password attempt.


    +   - Brute force - The most time-consuming, but comprehensive way to crack a
    password. Every combination of character is tried until the password is broken.


    +   - Sybil - it is the combination of both brute force attack and the dictionary
    attack


    +   - Backdoor - this attack is used when the attacker gets some information about
    the password


    +   - Social engineering is understood to mean the art of manipulating people
    into performing actions or divulging confidential information


    +   - Shoulder surfing - using direct observation techniques, such as looking
    over someone''s shoulder, to get information


    +   - Dumpster diving is a technique used to retrieve information that could be
    used to carry out an attack on a computer network'
