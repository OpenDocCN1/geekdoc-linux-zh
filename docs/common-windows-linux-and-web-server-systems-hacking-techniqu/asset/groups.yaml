    # Understanding Cross-Site Scripting (XSS)


    Cross-Site Scripting attacks are a type of injection problem, in which malicious
    scripts are injected into the otherwise benign and trusted web sites. Cross-site
    scripting (XSS) attacks occur when an attacker uses a web application to send
    malicious code, generally in the form of a browser script, to a different end
    user. Flows allow these attacks to be quite widespread and occur wherever a web
    application uses user input in a output without validating or encoding it a malicious
    script to an unsuspecting user.


    An attacker can use XSS to send a script should not be trusted, and will user''s
    browser has no way to know that the script is false. Because they think the script
    came from a trusted source, the malicious script can access any cookies, session
    tokens or other sensitive information retrieved by your browser and used with
    that. These scripts can rewrite the content of the HTML page.


    +   - The reason that there is hole, in the web application program that allows
    the hacker to execute command or browse the computer. If the hacker wrote a script
    code and the web application executed the code, then the application has a XSS
    hole.


    +   - There are persistent XSS attacks and reflected XSS attacks


    # Persistent XSS Attacks


    +   - Stored attacks are where the injected code is permanently stored on the
    target servers, such as in a database, in a message forum, comment field, etc.
    the victim retrieves the malicious script from the server when it requests the
    stored information.


    # Reflected XSS Attacks


    Reflected attacks are those where the injected code is reflected off the web server,
    such as in an error message, search result, or any other response that includes
    some or all of the input sent to the server as part of the request. Reflected
    attacks are delivered to victims via another route, such as in an email message,
    or when a user is tricked into clicking on a malicious link or submitting a specially
    crafted form, the injected code travels to the vulnerable web server, which reflects
    the attack back to the user''s browser. The browser then executes the code because
    it came from a "trusted" server.


    +   - The reflected XSS attack is through injecting the url, and we call it url
    inject. In persistent attack, it stores in the database and is very dangerous
    since anybody will visit the post, the code will be applied on its computer.'
