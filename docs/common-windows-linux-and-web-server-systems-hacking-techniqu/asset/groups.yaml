    Understanding How to Cover Tracks and Erasing Evidence


    Once intruders have successfully gained Administrator access on a system, they
    try to cover their tracks to prevent detection of their presence (either current
    or past) on the system. A hacker may also try to remove evidence of their identity
    or activities on the system to prevent tracking of their identity or location
    by authorities. The hacker usually erases any error messages or security events
    that have been logged, preventing detection. In the following sections, we will
    look at disabling auditing and clearing the event log, which are two methods used
    by a hacker to cover their tracks and avoid detection.


