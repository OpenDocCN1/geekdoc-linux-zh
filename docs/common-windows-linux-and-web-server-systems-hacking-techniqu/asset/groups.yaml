    # Different Types of Password Cracking:


    +   - Passive online Eavesdropping on network password exchanges. Passive online
    attacks include sniffing, man-in-the-middle, and replay attacks.

    - Active Online Guessing the Administrator password. Active online attacks include
    automated password guessing.

    - Offline: Dictionary, hybrid, and brute-force attacks.

