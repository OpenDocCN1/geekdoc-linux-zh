    ## Understanding Cross-Site Scripting (XSS)


    Cross-Site Scripting attacks are a type of injection problem in which malicious
    scripts are injected into otherwise benign and trusted sites. Cross-site scripting
    (XSS) attacks occur when an attacker uses a web application to send malicious
    code, generally in the form of a script, to a different end. Flows allow these
    attacks to be quite widespread and occur wherever a web application uses user
    input in output without validating or encoding it to an unsuspecting user. An
    attacker can use XSS to send a script should not be trusted because they think
    the script came from a trusted source, the malicious script can access cookies
    or other sensitive information retrieved by your browser. These scripts can rewrite
    the content of the HTML page.


    - The reason that there is in the web application program that allows the hacker
    to execute command or browse the computer. If the hacker wrote a code then the
    application has a XSS hole.

    - There are persistent XSS and reflected XSS attacks


    ## Persistent Attacks


    Stored attacks are where the injected code is permanently stored on target servers,
    such as in a database, forum, comment field, etc. the victim retrieves the malicious
    script from the server when it requests


    ## Reflected Attacks


    Reflected attacks are those where the injected code is reflected off the web server,
    such as in an error message, search result, or any response that includes some
    or all of the input sent to the server. Reflected attacks are delivered to victims
    via another route, such as in an email, or when a user is tricked into clicking
    on a malicious link or submitting a specially crafted form, the injected code
    travels to the vulnerable server, which reflects the attack back to the user''s
    browser because it came from a "trusted" server.


    - The reflected XSS attack is through injecting the url, and we call it. In persistent
    attack, it stores in the database and is very dangerous since anybody will visit
    the post, the code will be applied on its computer.


