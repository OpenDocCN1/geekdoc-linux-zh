    # How Do Reverse Connecting Trojans :


    Trojan in the hacker computer which creates server installed in the client computer.
    The reverse connection, the technique on the client computer will make connection
    to the Trojan program on the hacker machine. We have problem that the hacker needs
    constant real ip that does not.


    # How Reverse-Connecting Trojans Work?


    Reverse-connecting Trojans let an attacker access a machine on the internal network
    from the outside. The hacker can install a simple Trojan program on the system
    on the internal network, such as the reverse WWW shell. On a regular basis (usually
    every 60 seconds), the internal server tries to access the external master system
    to pick up commands. If the attacker has typed something into the master system,
    this command is retrieved and executed on the internal system. Reverse WWW shell
    uses standard HTTP. It is dangerous because it is difficult to detect-it looks
    like a client is browsing the Web from the internal network.


    ![](img/91b4da451291288ee84ff207e23ccb97_9_0.png)


