    Microsoft uses NT Lan Manager (NTLM) hashing to secure passwords in transit on
    the network. Depending on the password, NTLM hashing can be weak and easy to break


    When this password is encrypted with LM algorithm, it is first converted to uppercase:
    `123456QWERTY`


    The password is padded with null (blank) characters to make it 14character length:
    `123456QWERTY`


    Before encrypting this password, 14 character string is split intohalf: `123456Q`


    Each string is individually encrypted and the results concatenated.

    `123456Q` = `BF11E04AFAB197F`

    `WERTY` = `F1E9FFD0CC75575B15`


    Note: The first half of the hash contains alpha-numeric characters and it will
    take 24 hrs to crack by Lophcrack and second half only takes 60 seconds.


    Note: ImHash has been disabled in windows vista and windows 7

    The Microsoft in work group environment registers the passwords in sam files.
    It is in system32/config folder.

    We cant do anything to the SAM file while the operating system is active as it
    is protected.

    - To get the data in SAM file we have two methods. The first method to bring program
    that can extract the data in SAM file and the second method is to boot from another
    operating system through the live CD.


    +   * When Microsoft saves the password, it saves them in LMHash. Now there is
