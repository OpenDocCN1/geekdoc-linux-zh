    ## o) 理解 Rootkits（根内核）


    它们是某些能够保持 root 权限并隐藏你创建的所有进程的程序或工具。Kit 指允许你控制计算机的工具组。分为应用层 rootkit（application
    rootkit）和内核 rootkit（kernel rootkit）。应用层 rootkit 可以控制某些应用程序和如 `ls`、`dir` 等命令。它们可以隐藏后台进程，并控制和隐藏端口。内核
    rootkit 是最危险的 rootkit，如果系统被内核 rootkit 感染，我们需要更换操作系统。它会感染机器的内核。


    ![](img/91b4da451291288ee84ff207e23ccb97_68_0.png)


    ## r) 理解如何隐藏文件


    ![](img/91b4da451291288ee84ff207e23ccb97_69_0.png)


    我们可以通过 `attrib` 命令来隐藏文件，该命令可以更改文件的属性。


    - 在 c: 盘创建文件 1.txt，并使用命令 `attrib +h` 更改其属性并将其隐藏。


    ```

    C:\cd d

    C:\dattrib +h 1.txt

    ```


    - 我们可以通过 ntfs 流属性隐藏 ntfs 驱动器中的文件。


