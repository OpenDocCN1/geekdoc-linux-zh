    same as the ip in the router configuration. If the router will make connection
    to the router at port 81, it must forward the hacker computer with the internal
    ip 192.168.1.150 at port 81.

    - The problem of the real ip is not constant and changing. One solution that we
    buy is dynamic dns. To get real ip, we need to have phone it. Another solution
    is to register your domain name in dns server. This domain name will point to
    the ip of the router. If the real ip changes, the router will change the data
    in the dynamic dns server. The client Trojan will make connection with the dynamic
    dns server and tell it the real ip of the router. So the Trojan will make connection
    to the router at the port given in the Trojan program at hacker computer.


