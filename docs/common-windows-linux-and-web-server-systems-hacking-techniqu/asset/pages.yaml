  md: '# What Is Meant by Overt and Covert Channels?


    An overt channel is the normal and a legitimate way that programs communicate
    with a computer system or network. A covert channel uses programs or communications
    paths in ways that were not intended.


    Trojans can use covert channels to communicate. Some client Trojans use covert
    channels to send instructions to the server component on the compromised system.
    This sometimes makes Trojan communication difficult to decipher and understand.


    Covert channels rely on a technique called tunneling, which lets one protocol
    be carried over another protocol. Internet Control Message Protocol (ICMP) tunneling
    is a method of using ICMP echo-request and echo-reply to carry any payload an
    attacker may wish to use, in an attempt to stealthily access or control a compromised
    system.


    The overt channel means that any program when run makes for it channel between
    it and the system. The covert channel means that the program will use the channel
    in the wrong direction to access the machine.'
  merge: -1
