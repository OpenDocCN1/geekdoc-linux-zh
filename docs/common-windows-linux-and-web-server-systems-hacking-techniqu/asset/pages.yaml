  md: '# k) Client side Attack: Hack windows by BeEF


    BeEF is short for the Browser Exploitation Framework. It is a penetration testing
    tool that focuses on the web browser.


    Amid growing concerns about web-attacks against clients, including mobile clients,
    BeEF allows the professional penetration tester to assess the actual security
    posture of a target environment using client-side attack vectors. Unlike other
    security frameworks, BeEF looks past the hardened network perimeter and client
    system, and examines exploitability within the context of the one open door, the
    web browser. BeEF will hook one or more web browsers and use them as beachheads
    for launching directed command modules and further attacks against the system
    from within the browser context.


    ![](img/91b4da451291288ee84ff207e23ccb97_138_0.png)


