  md: '# c) Understanding Network Environment Types


    Understanding network environment types


    # Workgroup Domain


    ![](img/91b4da451291288ee84ff207e23ccb97_41_0.png)


    +   - In workgroup the uses name and passwords stored in the SAM file in the same
    machine. We can crack the passwords if we got the data on the sam file.

    - In the domains, the usernames and passwords are store in the domain controller.
    The directory service consists of four parts: domain partition, schema partition,
    configuration partition and application partition. The domain partition contains
    data about all objects in network. Schema partition consists of attributes or
    class templates. The configuration partition consists of attributes.

    - In active directory domains, the machine logon using Kerberos service. When
    the client wants to access any resource, it goes to a service under Kerberos TGS
    (ticket granting ticket). The TGS carries TGT (ticket granting ticket). In TGT
    file contains SID for users and the security groups that the users members on
    them. The machine requests the TGT when it wants to access a service and the active
    directory grants it service ticket and session key the the machine gives the service
    ticket and the authentication to the service'
