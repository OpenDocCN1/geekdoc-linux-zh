  md: '# 2. Part B: Trojans and Backdoors and Viruses


    # a) Backdoors


    # What is Backdoors ?


    - A backdoor is a means of access to a computer program that bypasses security
    mechanisms. A programmer may sometimes install a backdoor so for troubleshooting
    or other purposes. However, attackers often use backdoors that they detect or
    install themselves


    - A backdoor is a program or a set of related programs that a hacker installs
    on a target system to allow access to the system at a later time. A backdoor''s
    goal is to remove the evidence of initial entry from the system''s log files.
    But a backdoor may also let a hacker retain access to a machine it has penetrated
    even if the intrusion has already been detected and remedied by the system administrator.


    ![](img/91b4da451291288ee84ff207e23ccb97_5_0.png)


    The backdoor is the backdoor that through it we can make access on the machine
    and we can make bypass to the existing security policies. Microsoft has backdoors
    that enables it to make remote access to the machine.'
