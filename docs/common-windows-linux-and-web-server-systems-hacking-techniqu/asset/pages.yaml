  md: '# Client side attack: Hack Windows by Java Signed Applet


    This exploit creates a jar file via the Maf: Exploit: java_mixin, then signs it.

    The resulting signed applet is presented to the victim via a web page with an
    applet tag. On older versions the victim''s JVM will show a dialog asking if they
    trust the signed applet. Newer versions will display a WARNING in the ''Publisher''
