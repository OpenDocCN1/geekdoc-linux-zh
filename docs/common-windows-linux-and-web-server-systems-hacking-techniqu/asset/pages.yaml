  md: '# Understanding Keyloggers and Spyware Techniques


    If all attempts to gather passwords fail, then a keystroke logger is the tool
    of choice for hackers. Keystroke loggers (keyloggers) can be implemented either
    using hardware or software. Hardware keyloggers are small hardware devices that
    connect the keyboard to the PC and save every keystroke into a file or in the
    memory of the hardware device. In order to install a hardware keylogger, a hacker
    must have physical access to the system. Software keyloggers are pieces of stealth
    software that sit between the keyboard and the operating system, so that they
    can record every keystroke. Software keyloggers can be deployed on a system by
    Trojans or viruses.


    +   - There are hardware keyloggers and software keyloggers


    ![](img/91b4da451291288ee84ff207e23ccb97_62_0.png)


    +   - The hardware keylogger is hardware to connect the PC and keyboard to register
    every keyed letter. It is not detected by spyware

    - There are programs to detect the keyboard actions

    - PCSpy spykeylogger can do the task

    - Actualspy can do the task'
