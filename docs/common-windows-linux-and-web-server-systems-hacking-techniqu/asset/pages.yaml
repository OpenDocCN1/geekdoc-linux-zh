  md: '# # 1. Introduction


    Trojan horse or Trojan is a type of malware that is often disguised as legitimate
    software. Trojans can be employed by cyber-thieves and hackers trying to gain
    access to users'' systems. Users are typically tricked by some of social engineering
    into loading and executing Trojans on their systems. Once activated, Trojans enable
    cyber-criminals to spy on you, steal your sensitive data, and gain backdoor access
    to your system.


    A computer virus is a type of computer program that, when executed, replicates
    itself by modifying other computer programs and inserting its own code. If this
    replication succeeds, the affected areas are then said to be "infected" with a
    computer virus. Computer viruses generally require a host program.


    System hacking is defined as the compromise of computer systems and software to
    access the target computer and steal or misuse their sensitive information. The
    malicious hacker exploits the weaknesses in a computer system or network to gain
    unauthorized access to its data or take illegal advantage.


    Web content is generated in real time by a software application running at server-side.
    So hackers attack on the web server to steal credential information, passwords,
    and business information by using DoS (DDoS) attacks, SYN flood, ping flood, port
    flood scan, sniffing attacks, and social engineering attacks.


    This report covers the common techniques and tools used for Systems, Windows,
    Linux and Web Server Hacking. The report contains from the following:


    +   * Part A: Setup Lab

    * Part B: Trojans and Backdoors and Viruses

    * Part C: System Hacking

    * Part D: Hacking Web Servers

    * Part E: Windows and Linux Hacking


    You can download all hacking tools and materials from the following websites


    http://www.hxf4rall.com/2016/02/13/ceh-v9-pdf-certified-ethical-hacker-v9-courseeducational-materials-tools/


    www.mediafire.com%2FFolder%2Fad5szsted5end%2FEduors_Professional_Ethical_Hacker&h=gAQGad5Hf'
