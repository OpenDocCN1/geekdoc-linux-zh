    to modify the Linux kernel.


    # The LGPL and Class Inheritance


    The LGPL is a license most used for libraries. It allows proprietary code to use
    the functionality of libraries without being forced into GPL rules. There is another
    special case associated with the extension of class libraries. As shown in Figure
    3–5, object-oriented languages such as C++ are built on hierarchies of classes.


    Each extension of the hierarchy provides new functionality built on the original
    base class. Whereas the LGPL rules are clear when it comes to using the functionality
    of a library, the rules are not clear when it comes to extending the functionality
    of a class library.


    As of this writing, the debate on this topic no clear answer, the LGPL should
