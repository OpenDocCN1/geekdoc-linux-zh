  md: '# Business Benefits


    It also follows that the newest generations of developers are all trained and
    have built their expertise on Linux and its associated application programming
    interfaces (APIs). Many of the most popular open source applications, such as
    the Apache Web Server, are also very familiar to this new generation.


    Figure 1–3 shows the key stakeholders that represent competence in the Linux movement
    and resources you can draw on.


    As your enterprise grows and you need more talented personnel to run your network
    infrastructure, application servers, and data center, Linux-capable talent will
    be one of the most readily available resources.


    # Support


    One of the raging debates about Linux is the issue of support comes from. One
    side of the debate argues that since Linux is maintained and enhanced by a community
