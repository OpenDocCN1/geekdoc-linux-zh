  md: '# Hardware


    To fully understand the impacts of migration, we need to look at the details of
    the key components that affect these costs.


    There are those who believe that since Linux can run on a wide range of different
    architectures, you should consider active deployment on any of those architectures.
    In Chapter 2, I outlined a number of reasons why deploying Linux on hardware platforms
    other than the ones where the core development occurs can be undesirable. However,
    migration and hardware reuse can present a good opportunity for Linux on non-core
    development platforms. Assume that you have an existing hardware platform that
