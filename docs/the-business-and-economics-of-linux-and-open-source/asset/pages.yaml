    # The Freedom to Be Open Source


    Open source gets its roots from free software. When most people first hear the
    term "free software," they invariably jump to the conclusion that the software
    is without cost. This is not true. The word "free" when applied to software in
    this context is about freedom—meaning the freedom to copy, modify, and distribute
    the software. In principle, those freedoms require equal access to the source
    code. Richard Stallman is the author of the term "free software." He implemented
    important software for UNIX, licensed that software to the public under the GPL,
    and then created the Free Software Foundation (FSF) to promote this concept of
    freedom.


    Following the model promoted by the FSF, by Linus Torvalds distributed Linux,
    he did so under the GPL free software license.


    Other leaders of the free software movement, including Eric Raymond and Larry
    Augustin (among many others), were concerned about the confusion with the other
    meaning of the word "free" in the English language, "without cost." This confusion,
    they believed, was unnecessarily frightening larger software companies away from
    the development model underlying free software. Eric Raymond wrote his historic
    essay, "The Cathedral and the Bazaar" (later published as a collection of essays
    under that same title), to describe the creation of excellent software by communities
    of developers. To describe this software, he coined the term "open source" because
    it evoked no economic model, yet it recognized open access to the source code
