  md: '# Chapter 3 · Open Source—Navigating the Legal Path to Freedom


    The FSF created a special word to describe reciprocity in their GPL. They call
    it “copyleft” to indicate the relationship of that term to the law of “copyright.”
    Copyleft is a general method for making a free software and requiring all modified
    and extended versions of the program to be free software as well. To copyleft
    a program, the software is first copyrighted, and then the software is distributed
    under a license, legal instrument that gives everyone the rights to use, modify,
    and redistribute the program’s code or any program derived from it only if the
    distribution terms are unchanged. Thus, the code and freedoms become legally inseparable.
    (Remember, the word “free” doesn’t mean “at no cost; this concept of freedom relates
    to the rights guaranteed by the OSD discussed earlier.)


    Reciprocity (or copyleft) allows the creator of an original piece of software
    to benefit from your improvements just as you benefited from him or her providing
    you the source code that made those improvements possible. Contributors of open
    source software are encouraged to give their software away for free because they
    get free software in return.


    Reciprocity obligations do not arise by the use of software; they only arise when
    the modified (and/or improved) software is distributed. If you are using Linux
    as an operating system on your computers, but are not distributing Linux outside
    of your company, reciprocity obligations from the Linux license don’t apply to
    you. Reciprocity obligations, furthermore, only apply when you modify the original
    program—in copyright law terms, so if you merely distribute Linux to your customers
    as you received it, reciprocity obligations from the Linux license don’t apply
    to you.


    If you modify Linux and distribute your modified version to others, you must license
    those modifications—including the source code—to everyone under the terms of the
    GPL. This is the only situation in which the reciprocity obligations of the Linux
    license apply to you. But it may be an important situation to you. When you modify
    software (including Linux) that you receive from others, you should consult an
    intellectual property attorney to determine whether you are creating a derivative
    work. Under a reciprocal open source license, you must give your derivative works
    to everyone the same (or an equivalent) open source license.


    # Dual-Licensing and Copyright Ownership


    Any copyright owner can license his or her copyrighted software under more than
    one license. Each licensee, then, can choose to accept the software under the
    terms of one or the other license.'
