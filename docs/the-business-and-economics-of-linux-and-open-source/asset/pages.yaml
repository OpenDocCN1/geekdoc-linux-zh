    # Primary Architect


    The primary architect should be the lead visionary. This might be somewhat different
    than a typical Chief Technology Officer (CTO) role in large companies. Whereas
    the CTO would be responsible for the overall company technology, the primary architect
    drives the vision for a given product. In our case, we want to deliver the Linux
    operating system. What are the key strategic goals? Performance? Scalability?
    Usability? If all of these are goals, what is the priority, and what are the tradeoffs?


    Some argue that technologists are incapable of internalizing customer needs and
