    The other place that talent may come from is your customers and partners. This
    falls under the special category of gated communities; we will look at these later
    in this chapter.


    # Human Resources


    The open source community does not think too much about the management of human
    capital. There is no need to worry about things like deciding raises, issuing
    paychecks, making equipment available, or providing career counseling. This group
    is one of the key differences between bazaar development in the community and
    bazaar development in the corporation.


    It is likely that the roles and responsibilities I describe go far beyond what
    you would normally expect of your human resources group. This team plays a critical
    role. The goal of the technology team is to focus as much energy as possible on
    technology and product delivery. This implies that people management issues will
    take a peripheral role unless managed directly by another team. This is what the
    human resources group is all about.


    # People Development


    Your talent needs to have resources available to help with career counseling and
    any number of professional development topics. It may be desirable to go to graduate
    school, or help with a specific development area, such as how to develop teams.
    In traditional companies, personal development will often be part of an employee''s
    direct manager''s responsibilities. In this style of development, direct management
    no longer exists, but there still needs to be a resource to help in personal development.


    Overall corporate communications happen here as well. There needs to be a process
    for company management to communicate the overall company strategy to the employee
    population. While the engineering'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Structural Bazaar 151


    structure will ensure that the day-to-day work is aligned with the objectives
    of the technology being developed, corporate communications ensure that the employee
    has access to a larger strategic context.


    # Talent Management


    This group is responsible for listening to the talent needs of the architects
    and ensuring that the required talent is available. If rare talent is needed,
    this is where the investment in acquisition needs to be focused. This team also
    ensures that there is diversity in the talent sought. By diversity, I mean a mix
    of talent interested in specific technology areas, growing within a management
    hierarchy, and with varying degrees of people management skills.


    This team must play the "bad guy" role when it comes to how much talent the company
    can afford to have. This can sometimes be managed by a combination of permanent
    and temporary employees. But, if the company can no longer afford talent, this
    team must work with the engineering teams to help the tradeoffs of which subsystems
    need more focus than others. At this point, the engineering teams can make choices
    as shutting down contributions in a particular subsystem to ensure that the available
    talent is focused on the subsystems that need the most help. Recall that one of
    the measures for talent is the quantity of submissions. Talent that chooses to
    sit idle until a culture reopens for submission will suffer very negative consequences.


    The other parts of talent management are ensuring that the best possible talent
    is available and always evolving the talent. This team needs to develop the processes
    that allow for the ongoing measurement of contributions by every engineer. They
    need to measure the ongoing rate of contributions, the diversity of the contributions,
    and the rejected contributions. Active processes need to be developed to proactively
    manage the situations where an individual is contributing at an unacceptable level.
    While this seem harsh, this evolves into a self-selection system that makes it
    those who can''t make a useful contribution to find a way, or find another. Only
    your own individual culture will determine the amount time an individual has to
    start making useful and sustained contributions.


    # Training


    This team manages the combination of corporate training and engineering process
    training. Corporate training is the usual mix of vision, mission, and goals aligned
    with identity and culture. Engineering process training gets the talent ready
    to submit contributions. While there'
