    # Table 7–2 Architecture-Specific LSB Components


    | LSB Component | Description |

    |---|---|

    | Low-Level System Information | This section describes the very low-level interface
    to the IA-32 architecture. This section ensures that compilers have the standards
    required to create properly executable programs. |

    | Object Format | Similar in context to the gLSB specification, the object format
    is also directed at the compilers to ensure that symbol information is properly
    written during compilation. |

    | Program Loading and Dynamic Linking | The act of running a program consists
    of loading it into memory and scheduling it for execution. gLSB specifies, during
    the load phases, applications need to link in any required libraries. This section
    of the standard ensures that the acts of loading, linking, scheduling, and locating
    an executable program in memory follow a proper convention. |

    | Base Libraries | Much as gLSB defines a base set of libraries, there are certain
    libraries that are specific to the IA-32 architecture. These are defined here.
    |


    The LSB is a comprehensive standard and set of tools that describes what an application
    can expect of a compliant system. There are also rules that applications must
    follow to be considered LSB-compliant.


    # Conforming Applications


    Ensuring that applications you develop, either for internal use or for commercial
    sale, can run on any Linux distribution is a big win. It will ensure that your
    users have a choice of Linux distributions to select from,'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Linux Internationalization 115


    or allow you to change your choice of Linux distributions if you ever need to,
    thereby protecting your investment.


    The simple way to think about application conformance is that your application
    must run on any LSB-compliant Linux distribution. It cannot be dependent on any
    vendor extensions that are beyond the scope of the LSB. Also, if your application
    is combined with or dependent on another application, that other application must
    also be LSB-compliant.


    Of course, your application must conform to all of the formats and dynamic linking
    elements outlined in the LSB specification. A little later, we will look at conformance
    testing so that you make sure your application is LSB-compliant and you know what
    it means for a distribution to be conformant.


    # LSB Futures


    LSB focused its initial efforts on getting, a small subset of all that is Linux
    very carefully and thoroughly specified. It did so at the expense of breadth.
    LSB Futures is a subcommittee of the LSB working group. Its goal is to broaden
    the scope of the LSB to be much more inclusive. If you are motivated to enhance
    the LSB specification, you should consider joining this group.


    # Linux Internationalization


    The Free Standards Group’s second primary working group is the Linux Internationalization
    Initiative (www.li18n.org), which is focused on standardizing a core set of APIs
    to ensure that localized applications can run correctly on any LSB Linux distribution.


    Distribution vendors benefit from the li18n standard (the number 18 signifies
    the number of letters between “i” and “n” in “internationalization”) by ensuring
    that their distribution can be used anywhere in the world, and can run applications
    from any local region.


    Large corporations and ISVs also benefit by being able to localize their applications
    for any geography while ensuring that their application will run on any compliant
    distribution.


    There are a few terms that are useful to understand:


    +   * Internationalization—The process of making an application or other software
    environment localizable. Internationalization provides the underlying infrastructure
    to ensure that an application can be localized.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '+   Localization—The process of supporting cultural-specific issues in an application,
    such as language, time, currency, etc. Once an application''s infrastructure has
    been internationalized, it can then be localized for any number of specific geographies.


    +   Globalization—The combination of internationalization and localization.


    When developing applications for internal or commercial use, you should require
    that all applications be internationalized. By doing this, you will ensure that
    all of your applications can be localized to your countries of choice when the
    need arises. It is very common to use third-party companies that specialize in
    translation services to localize applications for a specific language.


    The li18nux standard guides you by providing a standard set of APIs to handle
    character sets from Latin, Asian, and many other languages. Li18nux also provides
    suites and sample implementations for verifying compliance. With li18nux, you
    will be able to add local support without having to change any code in your applications.


    # # Testing and Conformance


    The Free Standards Group takes every opportunity to document and use what already
    exists. The testing and conformance aspects are really no different. In the UNIX
    world, the Open Group drives a comprehensive set of test suites to ensure conformance
    to standards such as UNIX98. The Free Standards Group is working with the Open
    Group and other skilled UNIX organizations to reuse and build on the same test
    suites rather than starting over. The test suites focused on LSB conformance are
    divided into four major categories:


    +   Distribution testing—This part of the testing program is directed at Linux
    distribution vendors. However, there are cases where you may build your own custom
    distribution for your own internal uses. If you do that, you should make sure
    that your custom distribution is also LSB-compliant. This ensures that you can
    run any LSB-compliant application.


    +   Application testing—For ISVs and enterprise customers, this is the most important
    part of certification testing. Even if your applications are for internal use,
    you should always check for LSB conformance. This will ensure that you can run
    your applications on any LSB-compliant distribution that your company chooses
    to deploy.'
