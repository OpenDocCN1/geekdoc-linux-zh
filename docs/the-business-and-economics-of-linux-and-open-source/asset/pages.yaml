    the kernel boundaries within Linux (i.e., a portion of your application soft-

    ware runs within the kernel). In this very specific instance, you will need to

    manage the process of building and packaging your application differently,

    and make a few business decisions. Since the Linux kernel is licensed under

    the GPL, the portions of your application that integrate with the kernel must

    also be licensed under the GPL. Review Chapters 2 and 3 for the discussion

    of kernel modules and the GPL for more specific details.


