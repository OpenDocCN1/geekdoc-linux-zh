  md: '# CHAPTER 6


    # The Cost of Linux and Open Source


    Linux is free! Well, not exactly. Any seasoned manager clearly understands that
    component costs represent a small portion of the big picture and that the whole
    solution, over a lifetime, must be considered. The industry term is “total cost
    of ownership,” or TCO. Remember that car from the previous chapter that will now
    get you from point A to point B? Depending on the car, you will need to consider
    the cost of gas, insurance, maintenance, parts, and a number of other factors
    over the lifetime of your vehicle. Technology acquisitions, including open source,
    are no different—especially for open source, due to the perception that “free”
    implies “without cost.”


    In this chapter we will examine the cost elements associated with open source
    that might be different from any other cost calculations you might have done in
    the past. Remember that Linux is simply a very large open source project. Although
    you may have a tendency to focus on the cost of Linux, virtually everything I
    outline can be applied to any open source application you choose to deploy. The
    goals for this chapter are:


    +   - Understanding the total cost of a solution

    - The effects of open source on solutions costs

    - How to procure open source software

