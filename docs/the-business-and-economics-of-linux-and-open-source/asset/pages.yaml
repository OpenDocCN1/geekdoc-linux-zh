- img_proc: true
  md: 'The File System Hierarchy (FSH) standard—This standard ensures a consistent
    model for file locations on UNIX, and now Linux systems. This is one of the key
    standards on which the LSB depends. The FSH standard is discussed with the LSB.


    The Free Standards Group does not attempt to do all the standards work on its
    own and is affiliated with another standards initiative relevant to Linux: the
    X Desktop Group. The X Desktop Group is focused on standards to encourage cooperation
