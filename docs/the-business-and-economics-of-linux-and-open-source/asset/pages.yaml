- img_proc: true
  md: '150 Chapter 9 • The Corporate Bazaar


    If other parts of your company have a desire to make contributions to enhance
    your system, you should look at this as a very positive development. First, it
    is an indicator that the current system is not meeting the needs of the users.
    Second, it provides additional talent that is highly motivated. Contributions
    must still be accepted by one of the architects, and bad contributions should
