    new heights within the hierarchy, a clear successor should be identified. The
    replacement, when it happens, should be a combined decision between the subsystem
    architect leaving the job and the next level in the hierarchy.


    You should see a theme developing here. Rather than the organizational hierarchy
    developed by top-down management decisions, a culture evolves that is based on
