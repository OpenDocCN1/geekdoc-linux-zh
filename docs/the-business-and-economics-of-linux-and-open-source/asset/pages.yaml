    # Why Standards?


    Based on your knowledge from previous chapters, you know that a Linux distribution
    is a combination of the Linux kernel, modules, patches, the suite of GNU system
    tools, and host of other add-ons. Distribution vendors need to be commended for
    their work in packaging Linux in such way that it has become relatively easy to
