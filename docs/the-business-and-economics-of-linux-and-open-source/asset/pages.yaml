    # Value Stuck in Time


    At a recent Linux event, I went for drinks with Tim O’Reilly (of O’Reilly Books).
    We talked about a number of different open source topics and I used the phrase
    “value as a function of time.” After I described the concept, he enlightened me
    with a different view of what the concept might mean. His view was that the open
    source community is not beholden to a timeframe to deliver a useful and capable
    product. Anyone who has lived in the high-technology industry for any length of
    time will be well-aware of situations where products are released before their
    time. When these situations occur, the product is often shelved and never again
    sees the light of day. The free software community doesn’t have such restrictions
    and technology can find new uses when the community is finally ready for it. After
    our meeting, I started to think a bit more about this concept that Tim had brought
    forward and realized that this concept of value stuck in time had already happened
    to me.


    # Pilot Foundation Classes


    In 1996, USRobotics released a revolutionary PDA called the Pilot 5000. Today,
    most of you will be familiar with the descendants of that device as the Palm family
    of PDAs (many still call it PalmPilot). I was so excited with this device that
    not only did I get one, I immediately wanted to start programming applications
    for it. The operating system for the Pilot (now called PalmOS) was based on a
    C language API. I was an object-oriented programmer and really wanted to write
    for the device'
