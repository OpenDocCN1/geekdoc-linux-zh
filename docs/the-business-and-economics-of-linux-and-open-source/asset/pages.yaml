    As a non-profit corporation, the Free Standards Group is funded by major industry
    vendors who obviously understand the significant benefits brought about these
    standards. Any end-user, IS, or hardware vendor is encouraged to participate.
    Standards are only successful when they meet the requirements of those who use
    them and when they reflect broad involvement in the community. The more the merrier.


    # Linux Standards Base


    The LSB (www.linuxbase.org) is the core standard that ensures a successful marriage
    between Linux distributions and Linux applications. Specifically, it is a:


    +   - Binary interface specification (a binary specification implies that applications
    do not need to be recompiled when moving from system to system) ensures application
    compatibility across all certified Linux distributions.


    +   - Set of test suites to test both Linux distributions and Linux-based applications
    for LSB conformance.


    +   - Build environment to develop LSB-compliant applications.


    +   - Sample implementation to run and test applications in a “pure” Linux environment.


    By utilizing the standards and tools, distribution vendors create LSB-conforming
    Linux distributions, and application vendors create LSB-conforming software applications.


    By focusing on a common set of interfaces, an application vendor can write and
    test an application according to the LSB and be assured that'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Linux Standards Base


    the application will run on any LSB-compliant distribution. Companies with internal
    IT development teams should also create all their applications with LSB conformance
    in mind. With this degree of traction, the LSB now has, it is a good idea to ensure
    that any Linux distribution you select is compliant to the latest version of the
    LSB and that any applications you acquire are also LSB-compliant. This way, you
    can be assured that your investment will be preserved.


    In many ways, the LSB can be thought of as aggregating a set of standards that
    the industry uses and the Linux development community endorses. It is actually
    a stated goal of the LSB to document existing standards and not invent new ones.
    Since the LSB is not a reinvention of the wheel, but rather built on what is already
    out there, it has made it very easy for distribution vendors and application providers
    to work with and comply with the LSB specification.


    Since the LSB is a binary specification, it needs to be divided into two core
    components: general and processor-specific; general for those things that are
    machine independent, and processor-specific for only those things that must be
    machine-dependent. Figure 7–1 shows how the two combined on your platform create
