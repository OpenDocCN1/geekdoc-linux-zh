    name, Ian.


    This disconnection from a corporate identity makes Debian a favorite among community
    leaders and developers. The Debian community includes hundreds of developers and
    much of their work will find its way into the other mainstream distributions.
    Also, remember that the O takes its heritage from the Debian Social Contract (www.debian.org/social_contract).


    Debian probably boasts the most supported platforms of any distribution. Many
    companies contribute to Debian since no corporate agenda drives the development
    and contributions are readily accepted. Since everything is always open, competitors
    can operate on an even field. If you are a software vendor and need to standardize
    components specific to your industry, Debian may be the best environment for you
    to work in.


    Many community groups and organizations use Debian as a base for their work, then
    provide support for other distributions from there. Debian has been criticized
    for lagging the other distributions in supporting the latest innovation in packages
    and kernel releases. But, this really is a double-edged sword. While Debian may
    track somewhat behind the other distributions, it is widely recognized as having
    some of the most comprehensive integration testing across the broadest range of
    platforms, and the most stable release of any.


    For enterprises looking for the most open distribution with vendor independence
    that will offer some impressive stability, Debian can be a good choice. The primary
    downside is due to the lack of corporate backing, Debian is often the last choice
    for commercial application developers.


