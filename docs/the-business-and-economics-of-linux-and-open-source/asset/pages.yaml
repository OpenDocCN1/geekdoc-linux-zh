  md: '# The Open Source Effect


    Since understanding the costs is probably one of the most important aspects to
    consider in deploying Linux and open source software, it is worth going through
    each of the elements of the list that benefit or suffer from the effect of open
    source. Some of the elements on this list are covered in greater detail in later
    chapters.


    # Hardware


    Open source software affects hardware costs in a cost ofにつき different ways. This
    is also where the specifics of the Linux operating system play a key role. As
    I mentioned in Chapters 1 and 2, virtually all open source software, including
    Linux, is developed on open commodity computing. Since there is no need to depend
    on proprietary hardware solutions, the cost of hardware can be reduced considerably.
    This assumes that the combination of an open platform with Linux will meet your
    scalability, reliability, availability, and performance needs. Another consideration
    is the hardware ecosystem available as a result of using an open platform. This
    means that there is generally a huge selection of supported hardware add-ons available.
    This selection increases your solution options, and the competitive effect will
    also reduce your costs.


    Many users have also reported that the combination of Linux and open source software
    will run on much older hardware configurations than proprietary solutions. Linux
    is often deployed on much older hardware as a reuse option. Also, low-performance
    hardware solutions can meet your business'' needs for a much lower cost. Finally,
    some will choose to re-use proprietary hardware, or use a portion of an existing
    system to take advantage of the benefits of Linux.


    # Operating System


    Proprietary operating systems can cost well into the hundreds of thousands of
    dollars on large systems. Linux can be acquired, replicated, and installed with
    no associated license costs. Probably more significant is the ongoing support,
    upgrade, and maintenance costs associated with the operating system over the life
    of the system. I will cover this in more detail later. Obviously, there is an
    expectation that the hardware and operating system combination meets your business
    needs.


    As I outlined in Chapter 5, you have the ability to combine a number of different
    components to build your own Linux distribution. Rather than needing to acquire
    component parts, you can assemble open source parts into your own operating system.'
  merge: -1
