  md: '# The Linux Kernel


    Another type of kernel used in modern operating systems is the micro-kernel. Micro-kernels
    break apart most of the key control functions. Rather than state information being
    available to all functions, messages are passed from one function to another.
    Figure 2–3 demonstrates a simple micro-kernel architecture.


    Proponents of micro-kernels argue that they increase modularity, portability,
    and performance. Others, such as Linus Torvalds, argue that the message passing
    required each of the control modules increases complexity and makes the kernel
    more prone to obscure defects.


    Of historical interest is the fact that Richard Stallman was developing a kernel
    for his GNU system that was based on a micro-kernel architecture, the GNU Hurd
    kernel. Richard admits that the development and debugging complexity associated
    with the GNU Hurd slowed development considerably. Linus Torvalds'' monolithic
    kernel was developed far more rapidly and became available to support the GNU
    system well before the GNU Hurd ready.


    # Linux Kernel Modules


    One of the key advances of the 2.0 version of the Linux kernel is its use of modules.
    Prior to this, any new functionality or capability added to the kernel had to
    be compiled into the kernel and the system restarted


    ![](img/9f16a110ce50f60110e048120e699904_46_0.png)


    > Figure 2–3 Micro-kernel.'
