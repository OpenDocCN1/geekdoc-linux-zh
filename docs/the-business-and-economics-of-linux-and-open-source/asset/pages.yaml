    # The Cathedral and the Bazaar


    This terminology comes from the groundbreaking paper by Eric Raymond. In it, he
    defines traditional software development, which you must likely understand very
    well, as the cathedral style of development. It describes the new open source
    development process pioneered by Linus Torvalds as a bazaar development style.
    It is not my intention to review the entire contents of Eric’s paper here, but
    it is important that you have a high-level understanding of what the cathedral
    and the bazaar represent.


    +   * Cathedral development—This is the traditional style of development where
    teams are kept small. The design and functionality are well-understood before
    development begins. Complete plans from architecture, design, development, integration,
    and test are well-understood and documented. Release cycles during the development
    phase are few, and external feedback is only sought during alpha and beta test
    cycles.\n* Bazaar development—A maintainer releases functionality that can be
    built and has some usefulness, but the package lacks functionality and defects
    may be prevalent. Release cycles are frequent (sometimes hourly). Feedback is
    sought as early and as frequently as possible. Anyone, anywhere, with a good idea
    can contribute to either fix defects or add new functionality. The maintainer
    declares a production release when he or she determines it.


    These are summary descriptions. Obviously, I strongly encourage you to read Eric’s
    paper (and book). Eric’s thesis attempted to replicate what Linus accomplished
    with Linux. On a different project, but his parameters were very similar to those
    of Linus’: He was working with a public community of volunteers. What Eric did
    not address was how to take all the benefits of bazaar development and bring them
    to the corporate world. The question is how one takes into account the structural
    realities of large corporations today. Real'
