    licenses that a project must have for employees to participate? If you work on
    Linux kernel projects, what will be your policy on proprietary and open source
    kernel modules? In short, use the elements of this chapter, and the other elements
    you have learned from the rest of this book, to develop a comprehensive open source
    policy and strategy that define for your employees and the community what your
    expectations are for a respectable code of conduct and how you intend to partner
    with the community.


    # Hiring the Right Person


    During the hiring process, you are trying to assess if an individual is a fit
    as a new employee within the organization. There are now an additional set of
    criteria you need to look for in a prospective candidate. This list does not replace
    your standard hiring processes. You should consider these additional criteria
    to evaluate during the hiring process.


    # Technology


    Each technology (Linux kernel, file system, Web server, device drivers, networking
    stacks, etc.) area will have a sub-community. Although your prospective candidate
    may not be well-known in the larger community, a prospective employee may be one
    of the best-known developers for'
