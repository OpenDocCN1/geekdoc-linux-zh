  md: '# Inhibitors to Linux Growth


    By almost any measure, Windows with Visual Studio continues to grab the lion’s
    share of the software development market. But, if you segment out the UNIX market,
    the software development activity is rapidly shifting to Linux. A significant
    part of this phenomenon is driven by the education and research market mentioned
    earlier.


    # Upgrades


    Today, Linux is considered to be rock-solid for many application workloads. Every
    year, companies spend millions of dollars upgrading applications or environments
    that work just fine. Much of the motivation for the upgrades is due to hardware
    and licensing requirements various vendors. With Linux, you are in control. You
    have the option to consider the costs of self-support, buying support, or doing
    upgrades and making the best set of tradeoffs for your business. It is not uncommon
    for users to skip many upgrade opportunities until there is a compelling benefit
    and a return for the costs and risks of upgrading an environment. One of the beauties
    of open source is that you decide when to do this, not the vendor. Hardware is
    also not necessarily simply because you upgrade your software. Many developers
    in the community are making very productive use of systems such as 10 years old,
    which are considered obsolete by most others.


    It is well understood by most corporations that change implies risks and opportunities,
    both of which need to be measured and qualified just as any other operational
    activity within the corporation. If you deploy an environment, no license in the
    Linux and open source world will compel you to change, downgrade, or upgrade that
    environment. It is always possible for you to obtain and use old versions of software.
    You are in complete control of your environment; therefore, you control the success/failure
    of your network, and ultimately, your business.


    # Inhibitors to Linux Growth


    Linux is not a panacea to solve all the woes of the average IT department. It
    is clearly a new opportunity to lower costs, maintain or expand functionality,
    and partner with a huge community of developers that would be too expensive for
    anyone to hire. Let’s explore some of the more significant inhibitors holding
    Linux back. With most things in the high-tech world, there is a large contingent
    working diligently to eliminate any inhibitors to Linux’s growth. Time will eliminate
    the inhibitors listed here.'
