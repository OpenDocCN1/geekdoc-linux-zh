  md: '# CHAPTER 4


    # Communities and Organizations


    Open source represents a collection of communities. Chapter 3 described some of
    the various ways in which projects can be run, from company-run projects to foundations.
    There are also a number of other organizations that exist in support of Linux
    and the open source movement. Having a deeper understanding of all the communities
    that out there will give you a sense of how large the movement truly is. There
    are also complex interactions between many communities that you can only begin
    to understand if you have visibility to the larger whole.


    This chapter outlines some of the most significant communities. I will start with
    the Linux kernel community, look at some of the major industry organizations.
    A link is included to all of the organizations both here and in the reference
    section at the end of the book. It is not possible for this chapter to present
    a list of all possible groups, communities, foundations, and organizations. However,
    it is more than enough to get you started. In many cases, I could write a complete
    chapter, or even a book, for some of these communities. The intent here is to
    give you a view of what is out, not to give you a comprehensive view of each and
    every project. This will also give you an inside look at some open source projects
    that are giving their commercial counterparts a run for their money. If you are
    developing commercial applications, take note: You might be the one facing market
    erosion next.'
  merge: -1
