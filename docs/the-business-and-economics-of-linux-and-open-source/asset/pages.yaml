  md: '# Databases


    Databases represent the core infrastructure for many applications. They provide
    a number of functions for efficiently storing, organizing, and retrieving information.
    We normally think of databases under commercial names such as Oracle, Sybase,
    and DB2, among others. While these commercial implementations provide outstanding
    scalability, performance, and a litany of features, there are a number of cases
    where open source alternatives will more than meet these needs at a lower cost.


    # PostgreSQL


    http://www.postgresql.org/


    PostgreSQL is a serious object-oriented SQL database engine. gets its heritage
    from development at UC Berkeley in the late 1970s and early 1980s. Early ancestors
    of PostgreSQL were released or integrated with commercial implementations from
    Ingress (later Computer Associates) and Informix (now IBM). With such a heritage,
    PostgreSQL can be taken seriously for many database applications. A number of
    companies also provide commercial support for PostgreSQL.


    # MySQL


    http://www.mysql.org/


    Another credible open source database alternative, MySQL, is often associated
    with Web applications and personal use. However, MySQL is a high-performance database
    with a large following, and it it touts itself as the most widely used open source
    database.


    MySQL is another great example of dual-licensing in action. Anyone can use the
    MySQL database engine under the terms of the GPL. However, if you want a commercial
    license or you want to bundle MySQL with your product as a commercial whole, this
    is a great alternative.


