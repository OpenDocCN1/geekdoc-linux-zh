- img_proc: true
  md: '# Chapter 12 • Integrating Open Source into Your Business


    within your organization, you cannot ignore the fact that it is incredibly easy
    for engineers to grab code from Internet sources. Therefore your policy must be
    explicit and communicated to all of your engineers.


    Your company needs to make its own decisions to allow the integration of open
    source. Your policy needs to cover:


    +   * What project classes should consider using open source software

    * What licenses or class of licenses you will allow

    * Employee behavior when working with company resources and accessing software
    under an open source license

    * How the software is managed within the organization

    * Support processes for released software that includes open source


    The next chapter will cover more detailed employee issues related to open source
    software that will help you make the right decisions for your employees and your
    business.


    # Determining the License


    As you now understand, there is a class of license that incorporates a reciprocity
    provision which dictates that contributions are returned to the community. The
    GPL and LGPL are the most common. If this is the type of license for the code
    you integrate, then you need to establish the proper engineering controls to ensure
    that open source code is not mixed with proprietary code unless that is your specific
    intent.


    If the license does not contain a reciprocity provision, for example a BSD or
    MIT, then you can safely integrate the code within your project. You should still
    consider working proactively with the community, developing the code so that you
    can share the support burden should anything wrong.


    # Firewall


    If your company is maintaining proprietary software and open source software,
    it is critical that you have processes established to maintain a firewall between
    the two environments. The best way to ensure this happens is to maintain two different
    software configuration management systems, or to only use the public open source
    repository for the open source code. You should also consider the assignments
    of your engineers. If you have a single engineer working on both proprietary code
    and open source code, then that engineer needs to be very well-trained to ensure'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# IT Development


    that he or she does not inappropriately move open source code to the proprietary
    code base unless the open source license permits combination. Even in cases where
    engineering teams are kept separate, a team should still be trained to avoid situations
    where it shares code and may lose track of the license on the code.


    # IT Development


    If you are doing internal software development and never plan to release software
    to the public, then you can extract open source code, use it, and not worry about
    how it is integrated into your environment. All open source licenses permit for
    use without affecting your proprietary software; only subsequent redistribution
    would be constrained. If you choose to do this, you should consider the potential
    negative consequences you will have to deal with:


    +   - If you take the code and never return contributions, then you are on your
    own from that point on. You need to support the software thereafter.

    - Should the company ever decide to commercialize your internal project, you could
    have significant dependencies on open source components that have not been well-architected
    to allow for a clean separation from the software you developed internally.


    The best approach is always to work collaboratively with the community, and properly
    architect clean separations between proprietary and open source software.


    # Indemnification


    If you are delivering commercial software and typically integrate software from
    a third party, your contract with that third party will often contain indemnification
    provisions. One purpose of an indemnity provision is to ensure that if the software
    you are using another person’s IP without permission, you are not the one held
    liable. Most open source licenses do not provide indemnification provision. The
    nature of most open source software is that it incorporates elements from many
    different sources, and many of those sources may not be traceable.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Even if a major corporation “sells” open source software as part of a larger
    commercial offering, it may not be possible for that company to indemnify you
    against any IP claims.


    The industry is gradually getting more aware of this notion of no indemnification.
    For example, in many cases, you cannot be held liable for software that can be
    downloaded freely from the Internet.


    # Summary


    This chapter gave you the foundation to make solid business decisions when integrating
    open source within your business. You should now have an understanding of what
    it means to take your software and release it to the community, as well as take
    open source code and integrate it within your company. You should have nearly
