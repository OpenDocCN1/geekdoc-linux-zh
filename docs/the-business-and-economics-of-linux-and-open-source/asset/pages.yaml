  md: '# Gated Communities


    are impacted. It will be important for you to communicate the changes to the support,
    manufacturing, sales, and other key partners of the organization. As an example,
    the support teams may welcome the ability to participate in the development and
    enhancement process and provide you with valuable customer input. There are other
    elements of development I did not cover here that you will need to assess based
