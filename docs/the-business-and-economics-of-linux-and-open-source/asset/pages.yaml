  md: '# Non-Open Source Licenses


    There are a few “non-open source licenses,” or licenses that do not comply with
    the OSD that satisfy many of its requirements. Remember that just because source
    code has been made available to you, the license may not comply with the OSD.
    These non-open source licenses are usually created to solve very specific business
    issues. In some cases, a company may not have the rights to license the code,
    but wants to benefit from communal development. In other cases, it may be appropriate
    to make source available to help other developers debug an application. It is
    not possible to present an exhaustive list of non-open licenses. Most of the licenses
    that provide access to source code but do not fit the OSD fall into one of the
    following situations:


    +   1. The owner wanted to debug an application dependent on a development library.
    For example, Microsoft distributes source code to most of its foundation classes
    (MFC). This allows a developer to trace his or her application through Microsoft
    source. Microsoft does not currently have a true open source license, however.

    2. The individual or company does not own complete rights. In many cases, someone
    would like to apply an open source license but is restricted from doing so because
    of contracts with other third parties. In most of these cases, a new license is
    created that is specific to the company and/or product.

    3. The individual or company wants feedback from a development community without
    giving up intellectual property (IP) rights. There are cases where a company might
    want to provide access to source code to get the benefit of feedback and peer
    review from a development community. Any changes and rights must be returned to
    the company. Microsoft’s shared source license fits into this category. This type
    of license has generated significant ill will within the open source development
    community. However, it may be appropriate if your business model is completely
    dependent on software revenue and an alternate business model is not possible.


    Table 3–2 lists significant non-open source licenses you should be aware of. These
    licenses do not meet the requirements of the OSD.'
