  md: '# Groundwork


    Welcome to the world of Linux and open source. This book assumes that you have
    a technology background, but does not assume prior knowledge of Linux and open
    source. Part 1 lays a foundation of basic knowledge that you need to navigate
    and understand an open source operating system, development model, and licensing
    process.


    Chapter 1 will give you the business basics of why you need to care about Linux
    and open source. Chapter 2 will detail the core of the Linux kernel. Chapter 3
    will walk you through the Open Source Definition and its associated licenses.
    Finally, Chapter 4 will give a view of just how big the open source movement really
    is.'
