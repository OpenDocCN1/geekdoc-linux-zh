    # Migration and Coexistence


    As I mentioned at the start of this chapter, my intent is not to make the case
    for migrating. There are a number of resources available on the Internet (some
    of them listed in the reference section) dedicated to the specific issues of migrating
    from one platform to another given very specific circumstances. It would be easy
    to dedicate an entire book to the details of migration issues from the platform,
    through to the application, and the overall environment. My intent here is to
    cover the significant migration issues you should consider at the platform and
    operating system layers.


    Migration will involve costs. For a migration to be viable, you must be able to
    justify the costs with substantial new gains. For this reason, if you have a stable
    environment that is meeting your business needs at minimal costs, a migration
    may not make any sense. Some of the significant migration costs to consider are:


    +   - Hardware—Moving to Linux may involve a change of hardware platforms. Depending
    on the current age of your existing systems, this may or may not make sense. On
    the other hand, as you will discover a little later, Linux''s ability to support
    multiple platforms can make hardware reuse an attractive proposition.


    +   - Training—If your current environment is predominantly based on UNIX systems,
    then the retraining of your administrative staff should be minimal. If, however,
    you are migrating from Windows, Novell, or other environment, the retraining costs
    will be considerable.


    +   - Licensing—Depending on the applications you use and your current environment,
    you may need to repurchase or upgrade many of your current applications. This
    assumes that your business applications are available for Linux. On the plus side,
    since Linux itself has no licensing fees, you may be able to offset some of these
    costs.


    +   - Data—It is highly likely that your true assets are in the information you
    store rather than the hardware and software used to store and retrieve information.
    When transitioning an existing environment, data migration can become the highest
    cost and highest risk element. I will cover some elements of data migration a
    little later.'
