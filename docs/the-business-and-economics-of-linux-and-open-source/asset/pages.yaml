    Linux and open source software have now matured to the point where the only way
    to assure sustainable growth of the industry is to have standards that will ensure
    a focus on new innovation rather than on managing differences that add no value.


    # Free Standards Group


    The Free Standards Group (www.freestandards.org) is a non-profit organization
    whose primary mission in life is to grow the use and acceptance of open source
    technologies through standards. The natural outcome of their work will move Linux
    to the next stage of market growth: an enterprise platform for commercial applications.
    The Free Standards Group’s three primary workgroups are:


    +   The Linux Standards Base (LSB)—The LSB is a set of interfaces and test suites
    allowing for ultimate portability of applications across Linux, allowing an application
    to run regardless of distribution or version number.


    +   The Linux Internationalization Initiative (Li18nux)—This standard creates
    a foundation for language and cultural localization of compliant distribution
    and applications.'
