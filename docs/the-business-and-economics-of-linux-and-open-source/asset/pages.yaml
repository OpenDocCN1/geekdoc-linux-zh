  md: '# Chapter 10 • Value as a Function of Time


    You should also be very careful about believing that you are in a small niche
    industry, you will not be at risk of the effects of open source software. One
    example is photo finishing and film production. The open source community has
    created a very advanced photo editing called GIMP (GNU image manipulation program),
    and this product is being expanded for film editing. While GIMP and its film editing
    counterpart may not meet every user''s requirements, it is a leading indicator
    of things to come and hint that the value you are delivering will soon come under
    significant price pressures. Ironically, commercial products now seem to be borrowing
    from GIMP!


    Figure 10–2 depicts the effects of open source on the value of software and the
    power of commercial vendors to command a premium for that value. Almost any commercial
    software has value. Over time, it is normal that the value of the software decreases
    in the eyes of the customer. The devaluation comes from competitive forces and
    a somewhat natural commodity effect. Twenty years ago, the power windows on car
    were an expensive add-on option. Today, you would likely be surprised if they
    were not in a base vehicle. Software vendors (and auto-makers) typically respond
    to this natural devaluation process by continuously adding new features and new
    capabilities. These updates refresh the value on an ongoing basis. When it comes
    to enterprise software, vendors can maintain value by being the only entity with
    the ability to support the software for customers. Another factor that will protect
    enterprise software vendors is barrier to entry. Once a customer has committed
    to a particular software choice, as long as the cost of support and updates is
    less than the cost of replacement, the vendor can continue to charge a premium.


    Open source has the effect of accelerating devaluation in a number of dimensions.
    First, since many cases a large number of developers will attack the problem,
    the time required to create a comparable offering to yours can be greatly reduced.
    Second, since the community is generally not motivated by money, features for
    which you would charge a premium are all included at no charge. Third, although
    a barrier to entry will always be maintained, since the license cost of the open
    source software is usually zero, that barrier will be dramatically reduced. That
    final barrier is usually tied to some form of support availability. The size of
    the barrier will depend on the end-user''s willingness to engage in open source
    support models.


    The final challenge is predictability. The pharmaceutical industry can predict
    with a high degree of accuracy when its products will be commoditized and it can
    react with adjusted cost models at just the right point'
