  md: '# Chapter 12 • Integrating Open Source into Your Business


    +   * **Resources—If the licenses and structure of the open source technology
    (discussed next) are such that you can effectively use the technology as a foundation
    for your product, then open source can be a very effective way to focus available
    resources on higher value-added capabilities that you can use to generate more
    revenue.


    +   * **No reciprocity risk—The GPL, LGPL, and a few other source licenses contain
    reciprocity provisions that require you to return any changes or enhancements
    to the community. It is therefore important that you evaluate the risk of mixing
    GPL code, for example, with a proprietary code that you will subsequently be distributing.


    Similarly, there are few cases where bringing open source software into your organization
    or integrating it into an internal project should be avoided:


    +   **Strategic direction—Although the open source project may meet your immediate
    needs, its future direction may be inconsistent with your business goals. You
    should endeavor to work with the project maintainer to understand where or he
    would like to drive the project. If you ignore the stated intent of the project,
    you could find yourself supporting the project on your own.


    +   **Technical assessment—If your key technical leads do not agree with the use
    of open source software as part of the overall architecture, a deeper analysis
    is required at minimum. You may need to balance valid architectural concerns with
    a cultural aversion to trying something new. Make sure that your technical team
    is making the best assessment for the business and that you push for options that
    would allow the use of the open source project.


    +   **Release control—As you now well understand, the community will release software
    when the maintainer determines the time is right. If you need absolute control
    over time-to-market and this component has upcoming features that are critical
    to your release, you may not be able to afford the dependency. Of course, the
    way in which you should deal with this condition is to engage with the community
    and make contributions that will meet the needs of your project.


    Figure 12–2 is a simplified view of a process you can follow to ensure inbound
    open source is done with the correct level of business controls.'
