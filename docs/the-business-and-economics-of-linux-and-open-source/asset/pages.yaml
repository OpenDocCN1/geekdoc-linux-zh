  md: 'Summary


    This is an example of a business model that demonstrates one of the best ways
    that open source benefits everyone by allowing a focus on the core value being
    delivered to the customer, lowering development costs, and accelerating time-to-market:


    +   * Palm Computing correctly determined the value they deliver to their customers:
    a connected, portable device with a large number of applications.

    * The community provided Palm with a valuable ecosystem that promoted its product
    and made it even more valuable.

    * The community developed a key component of the value chain that enabled developers
    on the PC platform to develop fully for the product.

    * Palm continues to share development of the POSE with the community at large.
    This active involvement guides where Palm needs it to go, while leveraging the
    development know-how of the community.

    * Releasing ROM images is a form of releasing documentation that the community
    needs to be successful. Palm Computing also releases other documentation to help
    developers be successful.


    No one at USRobotics, or 3COM, or now Palm Computing, could have predicted this
    sequence of events. The opportunity for you is to learn from those who blazed
    this trail and plan for this type of productive collaboration with the open source
    community.


    # Summary


    Any of these business models can succeed or fail based on execution alone. Understanding
    a business model is not a replacement for a comprehensive business analysis. You
    must still understand your addressable market and customer needs. All of the other
    elements of building a profitable business are still required. Open source is
    simply another element that can open opportunities to build a new business or
    enhance an existing business.


    Now that you have an understanding of the business models available to you, you
    must understand how to integrate open source within your company. The next chapter
    will give you the processes and tools that you need to make decisions about using
    or releasing open source software.'
