- img_proc: true
  md: '# Implementation


    After going through the business case development process, you should have enough
    information to make a go/no-go decision. If you get to the implementation phase,
    then you have made the decision to proceed with your project and it is now time
    to make the plan operational.


    # Code Cleanup


    Implementation begins with code cleanup to ensure you have a source base that
    you can release to the public. The elements of code cleanup include:


    +   Making sure what you are releasing can be built with minimal instructions
    and is fully functional—The community will react negatively to nonfunctional software.
    This does not mean defect-free, but it should be stable enough that others can
    understand how the product works.


    +   Structuring and commenting the code—This can be a complex task if you are
    extracting the code from a larger project. Consider that a group of outsiders
    needs to understand how the code works. The easier you make it for them to understand,
    the more likely it is you will receive contributions.


    +   Sanitizing the code—You need to ensure that any comments, coding conventions,
    and other parts of the project do not contain proprietary information. This is
    usually in the form of employee names, product code names, and future product
    intent. You may also need to clean out derogatory comments that may have been
    included by some of your engineers.


    +   Validate the IP status of the code—You need to make sure that the code you
    are releasing was either written entirely by you and your employees or that you
    have valid licenses to distribute the code. If your contractors contributed to
    your code, did they assign their copyright to you in their contract or grant you
    sufficient license rights so that you can include it with your code? Verify also
    that you have patent rights to use, sell, and offer for sale the code embodying
    the patents. Consult an experienced IP attorney for this step.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '200 Chapter 12 • Integrating Open Source into Your Business


    You also need to include detailed build instructions and document any other dependencies
    such as external libraries and their versions. Releasing good-quality code is
    a big part of building a vibrant community. You and your engineers need to take
    this step very seriously.


    # License Selection


    You need to undertake this step with the help of your legal counsel. Chapter 3
    explained that there are over 30 licenses currently approved by the OSI. If at
    possible, you should select one of the licenses currently available with a reciprocity
    provision (a license that forces contributions to be returned to the community).
    If your goal is to create a community with an incentive to innovate and grow your
    project, then you should look at such reciprocal licenses, the most common being
    the GPL and LGPL. However, if you want others to use your software and create
    other proprietary solutions, then a BSD or MIT license may be the most appropriate.
    Of course, as I already mentioned, you may choose to dual-license your solution.


    Whatever license you select, you should attempt to develop a consistent strategy
    for all the open source projects you may eventually release to the community.
    A consistent strategy does not imply the same license for all projects, but rather
    a coherent license selection for similar project types. This way, the outside
    world will have a consistent set of expectations from your company. This would
    become part of an overall corporate source strategy.


    # Development Environment


    You need to select the development environment, tools, and processes you will
    use to work with your community. This can be simple as packaging your software
    solution, making it available for download, and never looking at it again. Obviously,
    this is not the best way to create a collaborative community. Most will use the
    tools commonly accepted by the majority of open source projects and discussed
    in previous chapters. It is possible to build more informal sharing processes
    with simple tools such as email. Depending on the project, you may want to create
    discussion groups to encourage communication among all those in your community.


    You also need to know how to host your project. You may choose to use internal
    company servers or the services of third parties to host your project. Whatever
    route you choose, your hosting selection should be closely tied to your marketing
    programs to drive the maximum traffic to your project.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Training


    Training is not usually considered part of the process of releasing open source
    software, but it should be. Considering training should also be part of your marketing
    program. Most developers will not be able to attend training classes or be able
    to travel to any location. You should consider formal training only if you are
    building a community built on your customer base and the training is part of an
    overall solution program.


    Of course, you can consider electronic training methods as simple as good documentation
    and as complex as comprehensive Web seminars.


    # Marketing


    For those who believe that taking software to an open source license is a simple
    process of packaging the code and making it available for download, the idea of
    a comprehensive marketing program will seem somewhat foreign. But, successful
    projects will have good, sustained marketing programs. The key elements of your
    marketing program will include some or all of the elements that follow.


    # Launch Planning


    Planning the launch of your project is a critical component that will involve
    getting key members on-board the community. If you have the ability to quote well-known
    members in a press release, that will help your launch activity. If you have well-known
    industry partners involved in the project, you should attempt to have them join
    your launch. Projects tied to specific industries should attempt to synchronize
    their launches with well-publicized industry events.


    # Community Awareness


    You need to build an awareness that will encourage developers to come and participate
    in your development project. You need to focus your awareness campaign on the
    topical area of interest. The term "community" is a generic term that refers to
    any group of developers. Clearly, if you are building a human resources application,
    you do not want to get hackers hacked.


    # Competitive Participation


    Working with your competitors will usually be the result of recognizing that no
    one organization can afford the complete development cost of the project when
    all will share in the results. For some industries, working with competitors is
    a fact of life and will be par for the course.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Chapter 12 • Integrating Open Source into Your Business


    In other industries, joining in a project with your competitors will seem strange
    at first. But, when you internalize the open nature of the proj-ures that everyone
    is participating equally, you will get more and more comfortable with the notion.
    Consult your attorney so that you can avoid antitrust behavior; the law limits
    the kinds of cooperation you can have with your competitors.


    # Maintenance


    The maintenance phase begins when the project is public, you have executed your
    marketing plan, and if all goes well, a community begins to form around your project.
    This phase needs to be actively managed to ensure that your success goals are
    being met and that the project contin-ues to go in the direction you envisioned.
    For most projects, you will also need to keep up the marketing and awareness campaign.


    # Measuring


    In the business planning phase you should have defined suc-cess metrics, including
    items such as the number of contributors and con-tributions, downloads or requests
    for the software, etc. You should collect each metric on a predetermined timeline
    and initiate actions based on the results of the metrics. For example, if the
    number of contributors is not living up to expectations, you might turn up the
    heat on your marketing campaign, or gather intelligence from early contributors
    that might help build a plan for increasing the contributions. Whatever metrics
    you develop, measure the results and react when the measures are either above
    or below expectations.


    # Ongoing Marketing


    You should avoid a scenario where you launch your project but not have the plan
    and budget to keep the awareness going. Industry events occur frequently and your
    project can often be connected to any one of those events. For example, if your
    project is a software program targeted at mobile devices and the industry releases
    new products or standards related to mobility, you might be able to latch on an
    event to raise the visibility of your project. This is an ongoing effort and it
    needs to be someone’s job to monitor the industry and take every opportunity to
    con-nect your project to these events.


    There is also always a new stream of developers joining the indusry. What was
    common knowledge a year ago is new information for'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Inbound Open Source 203


    many entrants to your industry. Constant updates, refreshes, and education are
    the keys to ensuring that your community stays fresh and vibrant.


    # Strategic Direction


    One of the most wonderful things about open source (which will make many managers
    uncomfortable) is that the community will often take your project in directions
    you might not have predicted. Portions of your software may be used in other,
    unrelated areas, in ways you could not have anticipated. In most cases, you should
    view these as positive events. They are signs of a community that is alive, growing,
    and sustaining itself. But, you must also take care to ensure that the direction
    of the project is consistent with the objectives you established during the business
    planning phase.


    A interesting dynamic can occur here and it needs to be monitored closely. It
    is possible that the community will want to take your project in a different direction
    than you had anticipated; this new direction may require you to have a very open
    mind and consider the new options being presented to you. However, it is your
    role to establish leadership and communicate the strategic vision of the project.
    You just need to make sure you don''t get so myopic that you ignore great opportunities
    that are dropped in your lap. An attitude of “not invented here (NIH)” is not
    useful.


    # Inbound Open Source


    The process of existing open source software and integrating it as part of a product,
    or used within an internal IT project, is known as “inbound open source.” The
    rules and processes associated with doing this are radically different than you
    do outbound open source and the business processes you establish need to be even
    more rigorous in nature. Here is a list of valid business reasons to look at bringing
    open source software within your organization:


    +   - Standards—If there is an open source implementation of a key industry standard
    that is important to your business, then building your products on this standard
    may be good thing. You will not have to re-implement your own version of the standard.

    - Existing technology—If the community has already developed a technology that
    has become pervasive, then using that technology will often be the most effective
    way to drive your product forward.'
  merge: -1
