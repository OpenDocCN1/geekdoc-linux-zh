  md: '# Dual-Licensing and Copyright Ownership


    For some open source software, the licensor allows you to elect license the software
    under a reciprocal open source license (like the GPL) or under a commercial license
    for which royalties must be paid. Dual-licensing marketing strategies were developed
    in response to those customers who were unwilling to accept reciprocity requirements
    and were willing to pay them.


    Linux is not available under a dual-license, but other important open source software
    that runs under Linux is. For example, Hans Reiser makes his file system, ReiserFS,
    available under more than one license. This allows ReiserFS to be used by the
    Linux operating system under the provisions of the GPL. However, Hans also has
    the ability to license his file system under a proprietary license. Developers
    of other operating systems work with Hans to make his file system available. The
    difference is that Hans can charge a fee for his work and the developer(s) can
    create an effective support structure for the file system. This is one example
    of many. Figure 3–1 demonstrates the flow of implementing a dual-licensing model.


    To control licensing alternatives, open source developers often request that contributors
    assign their copyrights in the enhanced software. That way, the original developer
    has the right to decide on the licensing strategy for the enhanced version. Linus
    Torvalds doesn''t require copyright assignments when enhancements are made to
    Linux, but the FSF will accept copyright assignments so that it has a large body
    of open source work it can defend.


    Some contributors refuse to assign their copyrights to anyone else. The management
    and accounting of copyright ownership is one of the major headaches for an open
    source project.


