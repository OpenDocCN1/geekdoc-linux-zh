    help balance the technology teams with the go-to-market teams and work with the
    human resources group to make sure the fixed cost structure associated with human
    talent is properly managed.


    # Market Planning


    Another key role not generally found in the community at large is market planning.
    Recall that in the community, the developer is the user. This is a wonderful thing,
    but if you are delivering a product inside your company, or delivering a commercial
    product, you need a much better sense of user needs. In typical planning fashion,
    you will segment your markets and target them in an order of priority that yields
    the greatest return. This is where you have an advantage over community players.
    You can clearly see the current and future target markets for the technology being
    developed for the primary architect. This information will provide far more guidance
    than the typical open source project trends to receive.


    This team is also responsible for generating and calibrating the metrics that
    make the team is focused on the right set of objectives. By measuring competitive
    performance, this provides direct feedback into how well the primary architect
    is doing his or her job. There is another positive side-effect that happens here.
    Many market planning teams want to plan down to finite and individual features.
    As a result, engineering teams end up feeling though they have no room left to
    innovate or add creativity. Since this team identifies the key markets,'
