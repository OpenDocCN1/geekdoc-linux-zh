  md: '# Licensing and Purchasing


    Licenses for commercial software running on a Linux system are largely unchanged
    from those of any other platform. Some software vendors have tried to correlate
    the cost of the hardware platform and operating system to the cost of the application
    running on that platform. In most cases, there is very little reason to expect
    that correlation. In fact, the price/performance cost of hardware has reduced
    dramatically over the years, by the cost of commercial software has largely stayed
    the same or even increased over the same period. The price of commercial software
    should be based on the competitive landscape and the value it delivers to its
    customers, not on the price of the hardware on which it runs.


    If you are migrating from an existing proprietary platform to a Linux system,
    you should contact your commercial software suppliers to ensure that the applications
    you run for your business are available on Linux and that they are all LSB-compliant.
    You will then need to negotiate the price of moving these licenses from your current
    platform to your new Linux system. As I mentioned in the previous section, there
    may be instances where the availability of an open source competitive offering
    will create more favorable price points, or you may be able to consider an open
    source alternative to an existing application.


    If you implement open source applications, then you should ensure that your procurement
    group is well aware that freely copying open source software for use throughout
    your enterprise is perfectly legal. Your purchasing agents need to clearly understand
    the difference between procuring open source software as opposed to any bundled
    add-ons that a vendor may be including with the open source software. This does
    not mean that there is no value in the bundles, or the add-ons. However, since
    the process for purchasing commercial, proprietary software is well understood,
    there may be a tendency to apply the same process to open source software. Make
    sure when you work with your open source vendors that you are clear about the
    price for the specific components (media, support, manuals, etc.) for which you
    are paying. In some cases, hardware vendors will include Linux bundles or other
    open source software and may be charging to cover their costs in including this
    software. You should uncover these costs in detail and decide if the convenience
    associated with these bundles is worth the cost. Take the time to train your purchasing
    agents on the details of how open source works so that they can get the best possible
    advantage for your company.'
  merge: -1
