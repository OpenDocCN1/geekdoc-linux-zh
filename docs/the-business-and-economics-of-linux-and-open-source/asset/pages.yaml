- img_proc: true
  md: '# The Costs


    Depending on your application and the size of your organization, modifying commercial
    Linux distributions for your particular needs can inject new costs in the form
    of self-maintenance or custom support contracts.


    # Administration Tools and Utilities


    Almost any large corporation has developed a significant suite of tools that are
    specific to the organization. Oftentimes, these tools were developed years ago,
    and the original developer has long left the company. In some cases, the source
    code for these internal tools and utilities is nowhere to be found. Your costs
    of maintaining and migrating these internal tools to other platforms can be very
    substantial.


    This is the open source “sweet spot.” In many cases, almost any function you can
    think of has been written by another developer in the community. If it is not
    available, then there will be something close that can be leveraged and adapted
    to your needs. The wonderful part of this is that your extensions to any tool
    can be contributed back to the community and maintained on an ongoing basis by
    the community. This presents a significant opportunity for reducing your costs.
    Contributions to the community will build goodwill and a real desire on the part
    of the community to help you in.


    # Upgrades to the Solution


    Upgrades to your deployment are always done on your terms and on schedule. You
    never need to be concerned about the loss of vendor support. Since the source
    code is always available, you can always choose to support your own environment.
    In the case of large open source projects as Linux and Apache, you will have the
    choice of several companions from which to obtain support or you can support yourself
    with backup from the community.


    The other factor is the cost of license fees associated with upgrades. Many software
    vendors charge maintenance fees to get minor updates to their software, and significant
    new license charges for upgrades to major releases. With open source software,
    these ongoing costs vanish.


    # Management, Administration, and License-Tracking


    When I discuss deployment in more detail in Chapter 8, you will understand that
    one of the considerations for deploying a Linux environment is the ability to
    integrate it into your existing infrastructure.


    Large corporations usually spend millions of dollars every year to track software
    licenses. Many companies develop sophisticated tools to track licenses on a global
    basis, while others do everything possible to'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 100 Chapter 6 • The Cost of Linux and Open Source


    negotiate corporate licenses with vendors in an effort to reduce tracking costs.
    With open source software distributed under an OSI-approved license, there is
    no need to track licenses and it is perfectly legal to replicate as many copies
    of the software as you need.


    # Application and Other Software Licenses


    The most obvious place you can reduce costs is by eliminating the cost of licensing
    software. For many, this is still a new concept. In many cases, you actually buy
    open source software—you might have seen boxed sets of your favorite Linux distribution
    at your local electronics store. The big difference is that you are not buying
    a license to the software. In the case of open source software, you are buying
    convenience and a brand you trust. In most cases, this takes the form of media
    (the CD/DVD to load the software), documentation, and in many cases, some form
    of support from the company offering the bundle.


    When we go through support in more detail, you will see the options available
    to you. For, be aware that there is no requirement to pay license fees on open
    source software. You can usually download the software from any number of locations,
    create your own CDs, and even print your own documentation. You have to decide
    how much convenience you are willing to pay.


    # Support Fees


    One of the most common business models associated with open source is to offer
    support. When you deal with proprietary software, your support options are significantly
    limited. You can usually only get support from the vendor selling the software.
    As a result of a captive audience, the vendor can charge a premium for support
    services.


    Even if your plan is to treat open source software in the same way as commercial
    software, the simple fact that support services will be available from multiple
    vendors increases competition and has a positive effect on price. Operationally,
    you need to alter your business processes to look at support as a competitive
    bidding process.


    # Unplanned Downtime


    In the world of proprietary software, some defects can cause unexpected and undesirable
    downtime. For mission-critical environments, you will often negotiate very extensive
    support arrangements to minimize these scenarios. However, the fact remains that
    you are at the mercy of your vendor. If your vendor does not want to make the
    changes needed, in the timeframe you need, you will often be left with very little
    recourse.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Adapting to an Imperfect Solution


    Again, even in an an environment where you choose to work with open source software
    as if it were commercial software, the fundamental ability to work with the community
    at large or your own internal IT staff to fix problems that arise can reduce the
    cost of unplanned downtime.


    # Training


    As I mentioned in Chapter 1, the availability of trained resources is one of the
    key benefits of Linux moving forward. If you deploy an industry standard, open
    environment, then your training costs should be reduced by the simple fact that
    trained resources are available. However, if you are migrating from an existing
    environment, then training costs could represent a substantial investment that
    you need to consider.


    Regardless of the type of deployment you have, open source requires a different
    set of behaviors from developers, purchasing officers, contract negotiators, and
    the management team. This book gives you the details you need to understand how
    those behaviors are different, but you need to consider the associated costs.


    # Adapting to an Imperfect Solution


    In the early days of computing, most environments were custombuilt from the ground
    up. As a result, the solution became very close to meeting your needs perfectly.
    However, developing these solutions was a very expensive proposition. Over time,
    software vendors built generic applications that could be applied to a wide range
    of problems. Although the solution was not perfect, the costs were so dramatically
    lower that it was worth the tradeoff of an imperfect solution. However, this is
    a cost to consider in your business, and a very unique benefit of open source
    that is often overlooked.


    This is where open source can shine. The ability to procure open source software
    that approximates your business needs and customize it to your specific needs
    allows you to have the best of both worlds. As I mentioned earlier, in many cases,
    the open source community will welcome many of your enhancements, accept them
    into the core source tree, and support the complete environment.


    Measuring this benefit can be complex, since you must analyze and compare where
    costs no longer exist, plus account for incremental costs. With this analysis,
    you can construct a business case. Table 6–1 gives you a guide to do this analysis:'
  merge: -1
