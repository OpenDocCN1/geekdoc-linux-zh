    # Programming Models


    Programming models refer to the APIs that application developers use to create
    applications that run on the chosen operating system. Since UNIX and Linux share
    a very close heritage and very similar programming models, application developers
    can usually adapt to the Linux programming model very easily. In fact, Linux is
    sometimes considered the lowest common denominator for all UNIX-based systems.


    The programming model for Windows systems is based on a core API known as Win32.
    This model is dramatically different than the model used by Linux and UNIX systems.
    Since the programming paradigm is so fundamentally different, developers from
    one environment usually struggle quite a bit to move to the other. If you have
    an extensive talent base familiar with the Win32 programming model, you should
    expect a steep and difficult learning curve for most of your developers attempting
    to absorb the Linux program model. This difference will be similar for most other
    non-UNIX operating systems.


    If most of the development within your organization is based on higher level development
    paradigms such as Java application servers or database applications, then the
    switch to a different programming model'
