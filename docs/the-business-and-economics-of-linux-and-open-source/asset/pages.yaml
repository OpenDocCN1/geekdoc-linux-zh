    # Specialized Linux Distributions


    The standards currently developed and-promoted by the Free Standards Group are
    focused on mainstream Linux distributions. We need to not lose sight of the fact
    that one of the great strengths of Linux is its ability to be customized at will.
    There is therefore an array of specialized applications (set-top boxes, PDAs,
    embedded applications, etc.) that will customize Linux to the point where it can
    no longer be considered “standard.” The good news is as these applications become
    more and more common, standards efforts will develop to support these environments.


    # Summary


    You have been shown the relevant standards that apply to the mainstream world
    of Linux. By ensuring that you acquire and deploy LSB-compliant distributions
    and follow through with LSB-compliant applications, you should take advantage
    of the key Linux benefit that avoids vendor lock-in. For large corporations and
    software vendors, following the li8nux specification for globalization ensures
    that you can deliver your applications in whatever local markets justify the expense
    of localization.'
