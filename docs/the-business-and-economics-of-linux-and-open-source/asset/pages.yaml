- img_proc: true
  md: '104 Chapter 6 • The Cost of Linux and Open Source


    Remember, in any negotiation with a commercial vendor that packages open source
    software, you are not negotiating simply for the cost of a software license. You
    are likely negotiating for support, services, and specialized consulting. Also
    remember that this is a competitive environment, and you will have many options
    available to you.


    # Modifying Open Source Software


    Many industry analysts recommend against modifying open source software, and recommend
    that you treat it as any other proprietary software within your corporation. This
    recommendation comes from the fact that changing the software for your specific
    uses will imply picking up the support burden for the new software solution. For
    smaller companies with a small IT staff, this can in fact be an appropriate answer.
    However, for large corporations that can engage with the open source community,
    the ability to modify the software can be a great opportunity to reduce costs.
    Modifying open source software should always be done with a view to contributing
    the changes back to the maintainers within the community.


    This ability to modify open source software brings a number of benefits to both
    large corporations and ISVs:


    +   - Influence the direction of the software product

    - Invest in making your priorities real, on your schedule

    - Getting an inside view to help future planning


    You should note that the maintainer is in control. Influence is based on sustained
    participation. When analyzing the costs of waiting for a vendor to make your priorities
    real, compared to the costs of making direct investments and contributing to make
    your priorities real.


    If you are unwilling or unable to join the community and participate in the future
    of any software product, then the analysts are absolutely right. You should stay
    away from making any modifications to open source software and only use it when
    it has been packaged and is supported by a commercial vendor.


    # Summary


    You should now be able to see how Linux and open source affect the costs of a
    solution throughout your business. In most cases, you can reap'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'tremendous benefits and significantly lower the costs in your environment.
    However, you also learned that open source does not directly translate into zero
    costs. There are no license fees associated with open source software and there
    is no requirement for you to pay for open source software, even if it has been
    bundled with other components, but you may have to pick up the costs to maintain
    the solution yourself. Your procurement and contract negotiation processes may
    need to be revised. Finally, you can control your costs further by making clear
    decisions to modify software, return it to the community, and reap the benefits
    of a solution that most closely matches your business needs.


    One of the key elements in keeping costs low throughout the ecosystem is standards.
    The next chapter will examine the standards that are specific to the Linux environment.
    Promoting these standards will encourage the growth of the ecosystem and keep
    the costs low by ensuring that choice and competition continue to be available.'
