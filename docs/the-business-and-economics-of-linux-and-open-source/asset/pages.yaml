    provided assistance in the form of development support and documentation. The
    Puffin Group was acquired by LinuxCare and they now host most of the development
    activities with Linux on PA-RISC.


    # File Systems


    Linux supports a wide variety of file systems. Generically, file systems define
    how data is stored, indexed, and retrieved from disk. The most common file system
    available for Linux is the ext2 file system. If you acquire one of the standard
    Linux distributions, this is likely what will be. However, there are a number
    of reasons why you might choose an alternate. In some cases you might want to
    share disks between different systems, and therefore, they need to share a common
    structure. In other cases, you might have specific performance or reliability
    requirements that will dictate a specific file system. You should also perform
    a number of tests using your specific application workloads to decide which file
    system is best for you. Here are some of the other major file systems to look
    for:


    # EXT


    http://e2fsprogs.sourceforge.net/ext2.html


    As mentioned, the ext2 file system is the one most often shipped with Linux distributions.
    Ext3 represents journaling extensions to the ext2 file system. Ext3 is not a file
    system, but rather journaling capabilities to ext2 while maintaining backward
    compatibility. See the next section for a discussion of journaling.


    # IBM JFS


    http://oss.software.ibm.com/developer/opensource/jfs/


    Journaling file systems add a significant amount of resiliency and reliability
    to operating systems. During the normal operation of a system, there is a significant
    amount of disk storage and retrieval taking place.'
  merge: -1
