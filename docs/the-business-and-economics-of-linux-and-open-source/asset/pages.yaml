  md: '# Business Models—Making Money


    As a developer of software products, there will undoubtedly come a time when you
    will recognize that Linux and open source are having a direct effect on your revenue
    stream. You will need to do something to adjust how you develop products and look
    at your revenue sources in a different way. As you learn about Linux and open
    source, and the concept of free software, you will need to understand how you
    can make money with a new product, service, and support paradigm. This chapter
    will look at a number of different business models and the different options that
    are available to you. While every business is different, if you read through each
    of these models, you should be able to adapt one or more of them to your specific
    situation. Your goal for this chapter is to understand the variety of different
    business models and use this information as a guide to adapt your business models
    accordingly.

    While this chapter is written with software product companies in mind, it is also
    useful for IT managers to be aware of the challenges facing your software vendors.
    A change in a business model by software vendors will invariably alter purchasing
    processes for the IT manager. Here is the list of the most common open source
    business models that we will examine throughout this chapter:


    +   - Commercial software for Linux

    - Services and support tied to an open source product

    - Enhancing commercial products with open source software'
