  md: '# Kernel Fragmentation (or Forking)


    # Linux Kernel Patches


    Just as modules provide a mechanism to add new functionality to the Linux kernel,
    patches provide a way to extend or change kernel functionality without compromising
    the integrity of the Linux kernel as released by Linus Torvalds. Patches are often
    thought of as a mechanism to repair defects. With Linux, patches are also used
    to change or add functionality to the kernel. Again using the aircraft analogy,
    where throttle and navigation controls are the device drivers, patches in some
    cases represent repairs to the engine and in others will be ways to implement
    new functions, such as adding special cooling capabilities to your engine.


    As you deploy Linux in your enterprise or build new applications to work on Linux,
    you will want to take careful note of your dependencies, not just on a kernel
    version, but also on any patches and modules that may need to be installed.


    # Kernel Fragmentation (or Forking)


    One of the biggest concerns newcomers have when considering Linux is the notion
    of fragmentation. Kernel fragmentation is also called "forking the kernel.". In
    any case, it refers to a proliferation of various different kernel implementations.


    The root of this concern stems from the history of the UNIX vars. UNIX originally
    had the promise of being one system with one common set of programming interfaces.
    Porting your application from one UNIX system to another was supposed to be a
    simple matter of recompiling for the new target system. However, UNIX vendors
    needed to differentiate their offerings. So, each vendor would extend and add
    new functionality to the operating system, and in many cases, the functionality
    was implemented in radically different ways. The end result was that although
    all UNIX systems shared a common heritage and functioned in the same way, each
    vendor''s UNIX was different enough to force significant application efforts when
    moving from one version to another. These differences also created "lock-ins"
    that increased your costs when you switched from a vendor who was not delivering
    value to your satisfaction.


    ISVs face the brunt of the work caused by each of these disparate UNIX flavors.
    The ISVs need to balance the costs of porting and supporting each new computer
    platform, while achieving the broadest market. Each supported platform requires
    extensive tuning, verification, and support. Forks of the kernel dramatically
    increase costs for ISVs and their customers.'
