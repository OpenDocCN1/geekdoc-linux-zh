  md: '# Business Case


    The first step is to walk through a detailed business case to understand if it
    even makes sense to proceed with an open source project. Figure 12-1 shows the
    key elements of the business case. Since following this process will likely be
    new to you, it is worth going through each element in detail.


    # Objective


    Before engaging in any implementation work, you should make sure that you have
    sensible objectives for the open source project and that everyone involved is
    clear about those objectives. Here are some examples, many of them related to
    the business model discussion of the previous chapter:


    +   **Devalue a competitive product**—If you have a competitor that has a solution
    you do not offer, or a solution that is significantly better than yours, this
    can be a good reason to proceed. The implication is that your objective is to
    accelerate the devaluation of your competitors'' product and remove competitors''
    revenue and profit stream. You must recognize that if you choose to do this, you
    are affecting the entire market segment for this solution, inclus yourself.


    +   **Pervasiveness**—If you have a core infrastructure technology that is an
    enabler to other products and solutions in your portfolio, then you may want to
    consider using open source as a method to make your technology pervasive, or adopted
    as a standard.


    +   **Cost reduction**—There are times when working collaboratively with the community
    can reduce the costs of developing a solution. In these instances, you will likely
    be providing a complex solution to your customers and using open source in certain
    parts of the stack will allow you to deliver a bigger solution faster and at a
    lower cost.


    +   **Hardware**—As I mentioned in the hardware business model discussion, enabling
    hardware sales is a great reason to work with the open source community.


    +   **Services and support**—If your primary business model is tied to service
    delivery, then providing an open source solution can make sense.'
