    scalability to 16 processors is usually possible, provided the application can
    take advantage of it. Today’s UNIX systems will often scale to 128 processors
    and beyond.


    However, scalability can take many forms. Many of those who need scalability beyond
    what Linux can deliver and also want the cost advantages have turned to clusters
    to solve their performance needs. Horizontal scalability, or combining a large
    number of low-cost systems and'
