    # Commercial Software and Linux


    This is the most simplistic business model, but the point must still

    made. There are many individuals who believe that you cannot sell or

    run commercial, proprietary software on the Linux operating system.

    With very few exceptions, proprietary application software can be pack-

    aged and sold for Linux in the same way as you would package and sell

    y application for any other operating system. There are many exam-

    ples of proprietary application software available today for Linux and

    nothing in the Linux license (the GPL) requires the proprietary code to be

    published. Figure 11–1 is a view of a regular application running on

    Linux as well as a kernel-intrusive application running on Linux.


