    source, what is really interesting is the development methodology associated with
    it. The real beauty of open source is not the license; it is the process.


    This description of the open source development methodology applies to many projects.
    The specifics will change depending on the size and use of the project. Eric Raymond’s
    essay (and book), The Cathedral'
