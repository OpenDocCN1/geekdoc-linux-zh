  md: '# CHAPTER 7


    # Standards—One Linux


    You have now built your car, starting at the engine, and then combined it with
    all the options you want. You have a clear view of what your car is going to cost
    you through the life of the vehicle. But now imagine if everyone''s car was built
    with enough differences that you couldn''t share the same roads and highways,
    or if every car used a completely different kind of fuel. The odds are pretty
    good that we would not have our network of roads and highways, and that driving
    a vehicle would be restricted to a few select individuals. While it is important
    that every car manufacturer can build vehicles with unique characteristics to
    meet the various needs of different customers, it is equally important that there
    be a common set of standards that allow everyone to benefit from this form of
    transportation.


    In this chapter, we will go through the details of standards specific to Linux
    and open source software currently available and under development. Only standards
    that are new and specific to Linux will be discussed here. Also, this chapter
    focuses on the aspects of standards that ensure application portability. Therefore,
    the goals for this chapter are to understand:


    +   * Why Linux and open source standards are needed

    * The key standards and how they work

    * Conformance and testing

    * Where the standards don''t apply'
  merge: -1
