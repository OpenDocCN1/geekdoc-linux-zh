  md: '# # Crash Course in Linux and Open Source Lingo


    By the time you finish this book, you will have a solid understanding of how Linux
    and open source work and apply to your business. However, an early crash course
    on some key terminology will help us get through some of the early parts of this
    book. This set of explanations is only meant to give you enough understanding
    to make it through the book. Most of these concepts will be explained in detail
    as the book progresses.


    +   **Kernel**—The kernel is the heart of the operating system that manages the
    key resources (such as memory, processes, etc.) on your system. Linux is in fact
    a kernel, not an operating system.

    **GNU**—This is a recursive acronym for GNU''s, Not UNIX. As you can see the first
    letter of the acronym is the acronym itself. Whereas Linux is the kernel of the
    operating system, the GNU system represents many of the other parts (compilers,
    tools, editors, etc.) needed to have a useful system. Purists contend that referring
    to Linux as the operating system is erroneous and it should be referred to as
    the GNU/Linux system, an important distinction to keep in mind as you discuss
    Linux opportunities in your company.

    **Distribution**—Most companies that deploy or develop applications for Linux
    will usually do this by acquiring a distribution. Some of the most common Linux
    distributions are Red Hat, SuSE, Debian, Mandrake, Connectiva, and Red Flag. Vendors
    combine the Linux kernel, many parts of the GNU system, other open source components,
    and enhancements of their own to distribute the whole as an integrated and tested
    system. In many instances, distributions are targeted at specific sectors or specific
    geographies of the market.

    **Package**—The individual components installed on a Linux system are distributed
    as packages. Generically, a package refers to any collection of files distributed
    to serve a specific purpose. Since many packages can share the same set of files,
    complex interdependencies are managed by installation and deployment tools.

    **Free software**—Free is meant to signify freedom, as in free speech, and not
    to characterize “without cost.” Free software originated with the Free Software
    Foundation under the premise that all software should be shared and everyone should
    have equal access to source code, or the blueprints of the system.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '+   Open source—This term will generally be used in two contexts: first, as
    the marketing phrase for free software; and second, as a development methodology
    that I will cover in great detail in Part 3. While the leaders of the free software
    movement tend to object to the association with open source, the term was coined
    to overcome the common misconception that free software implied software without
    cost. Open source is not a license. It provides a common set of specifications
    to which licenses must adhere to be considered open source.


    +   Community—Any collection of software developers working collaboratively on
    a software project. A community can represent students, hobbyists, corporate developers,
    competitors, and customers, among many others.


    +   Maintainer—The individual, committee, board of directors, or foundation that
    accepts or rejects code into an open source project. You can also think of the
    maintainer as the project manager. Probably the most well-known maintainer is
    Linux Torvals (the creator of the Linux kernel).


    +   GPL—This stands for the GNU public license. The GPL will be covered in depth
    in Chapter 3. For now, understanding that the GPL is the most frequently used
    open source license will suffice. The GPL is the license that governs the Linux
    kernel. The GPL requires that any modifications to the source base be returned
    to the community at large.


    This list of terms should be enough to get you going. As you read through the
    book, refer back to these to make sure you have a solid grasp of these key terms.
    By the time you finish the book, most of these should be very familiar to you.


    # Linux Workloads


    Figure 1–2 demonstrates the key places where Linux is being used and how usage
    is expanding over time. In the server realm, Linux is strongest at the edge of
    the network. This is largely due to the powerful combination created by the Linux
    operating system and Apache Web Server. These appliance-like devices draw on the
    strength of Linux as a network operating system.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Business Benefits


    ![](img/9f16a110ce50f60110e048120e699904_30_0.png)


    **Figure 1–2** Linux workloads growing over time.


    As Linux matures, it will gradually see its application workloads evolve to the
    infrastructure and application server tiers. The great debate is how long this
    evolution will take and how far Linux will push into the enterprise data center.
    On the client side, Linux, with its heritage of being a UNIX-like operating system,
    has naturally gained popularity with engineering workstations and application
    development systems. Linux has also started to penetrate the embedded device arena.
    The great debate is whether or not Linux becomes a viable operating system for
    the general office desktop. While these are general adoption trends, there are
    pockets of adoption already scattered in virtually all areas of the computing
    spectrum.


    # Business Benefits


    Linux has rapidly evolved from a niche and hobbyist toy to a credible environment
    in use at many businesses. Much of Linux’s initial transition into the business
    world was as a result of the Internet boom. Service providers saw Linux as a way
    to deploy systems using commodity components and not have any costs associated
    with licensing'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'either the operating system or key open source applications such as the Apache
    Web Server and other programs that are essential to the Internet that run well
    under Linux. Service providers tend to have highly technical personnel, thereby
    rendering vendor support a controllable issue. Mainstream businesses are now seeing
    that Linux is maturing as a credible alternative to other operating environments
    from the cost, resource, and control perspectives. Here are some of the key business
    benefits of Linux:


    # Cost


    The fact that Linux can be freely copied


    # Availability of Trained Resources


    Linux is now more than 10 years old and so trained resources are available. The
    cost advantages of Linux have elicited many education and research institutions
    such as the University of Waterloo in Ontario, Canada, the University of Illinois
    at Urbana-Champaign/NCSA (National Center for Super Computing Applications), and
    many others to deploy Linux aggressively. This has now been happening for a few
    years. For example, the Groupe ESIEE in France, a center for advanced scientific
    and technical education, has been using Linux for three years because Linux is
    open source. They state their motivation very very simply: ESII develops for the
    community, and the community develops for ESII. It is a simple return on investment
    for the center. The University of New South Wales converted all of their UNIX-based
    teaching labs to Linux in one year. The result is that many, many new graduates
    are fully trained and well-versed in the Linux operating system, even more so
    than in most flavors of UNIX.'
