  md: '# 86 Chapter 5 • Distributions—Completing Linux


    Each package has a maintainer or group of maintainers. Also, each package will
    have a number of different versions available. In many cases, these packages can
    be found localized for any number of languages. Distribution vendors make a selection
    of not only which packages to include with their distribution, but also decide
    which version, with what patches, and which local languages to support.


    For a distribution vendor to include a package in a distribution, the package
    must support the kernel version being included, there must be a version available
    for the processor being supported, there may be other dependencies (on other packages,
    for example), but these are the core requirements. The Venn diagram in Figure
    5–3 demonstrates the conditions that need to be met for a package to be included
    in a distribution.


    You must always remember one of the key contributions that open source represents
    is that you are in control, not your vendors. If you don''t like any of the decisions
    that your distribution provider has made, you can make as many changes as you
    like. If you would like a particular package that has not been included, you can
    usually find it on the Internet and download a copy for installation.


    # Package Formats


    Packages are combined and built from files through the use of special tools that
    generate a special module ready for deployment. There are two popular package
    formats: One was developed by Red Hat and is called the Red Hat Package Manager,
    or RPM; the other comes from the Debian community and is referred to as the DEB
    (or “dot-deb”) package format.


    ![](img/9f16a110ce50f60110e048120e699904_109_0.png)


    Figure 5–3 Package inclusion Venn diagram.'
