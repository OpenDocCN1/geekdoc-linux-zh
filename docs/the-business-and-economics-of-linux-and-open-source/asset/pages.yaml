    # Know Your Value


    The most fundamental assessment you need to make before examining open source
    business models is to be clear about your core business. Who are your customers
    and what value are you trying to deliver to them? You learned in the previous
    chapter that any value gets commoditized over time. Open source has the effect
    of accelerating the commodity effect of the value you are trying to deliver. Your
    goal is to continually deliver more and higher value to your customers. This implies
    that components you deliver lower in the stack are not components for which your
    customers are willing to pay as much as they were willing to pay in the past.


    If you are clear about your value proposition to your customers, then you can
    easily go of components that are required for your business and must be delivered,
    but for which you cannot count on any more revenue. This is where open source
    will have a positive effect on your business. By leveraging the community at large,
    you can focus your investments higher up in the value stack.


    This process can be very disconcerting to managers within your organization. It
    implies that value they have successfully delivered in the past will now come
    from other sources. The cultural shift you must undertake is to help your managers
    and their employees continuously'
