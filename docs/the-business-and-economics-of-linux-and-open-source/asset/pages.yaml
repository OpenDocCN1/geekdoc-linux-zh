  md: '# Free Standards Group


    +   Distribution vendors—The more standards are there, the more leverage is not
    insignificant. there can be between each of the distributions, thereby reducing
    the investment. Also, standards have clearly demonstrated the effect of making
    the market much larger. Consider the Internet. Had we not had standards, the size
    of the Internet would be substantially reduced, and we likely would not have had
    the industry transformation that took place in the late 1990s. Distribution vendors
    win in two primary areas: 1) maintaining compatibility between versions; 2) a
    clear definition of where the “universal” commonality layer ends and the “unique”
    value-added begins.


    +   Software vendors—Creating applications for multiple variants of UNIX has already
    demonstrated an expensive history. Software vendors will typically be forced to
