    The other likely scenario is that these distributions of local interest will be
    the only ones that have been localized in the native culture and language.


    You can make a choice to standardize on a single distribution for all your deployments
    around the world, or you can make the decision to let your remote offices make
    a local choice. This is one of the benefits of the LS standard comes into play.
    By focusing your energy on'
