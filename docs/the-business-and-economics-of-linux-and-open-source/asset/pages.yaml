  md: '# Hiring the Right Person 211


    If your set of policies and guidelines covers these elements, you should be able
    to work on open source projects and take advantage of the talent that is available.


    # Participation Policies


    Make it clear to your employees what the business objectives are. Some engineers
    will need to be reminded that your company is in the business of making a profit.
    Even if they work on a project that will not generate direct revenue, they should
    understand where the business intends to make money (e.g., support, services,
    hardware, etc.). A clear communication of your business model will help your engineers
    ensure that they participate in the most effective way possible with the community,
    while applying the right degree of judgment when decisions need to be made on
    the lines between open source and proprietary software need to be drawn.


