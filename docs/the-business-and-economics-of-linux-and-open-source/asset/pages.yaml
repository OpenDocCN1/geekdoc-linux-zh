  md: '# Acknowledgments


    Like many open source projects, I started with the simple notion of solving a
    problem (in this case, documenting the business side of Linux and open source)
    without any view of how big the project would be, and how many contributors I
    would get. I have been delighted with the number of contributors who offered to
    read and re-read this manuscript under development and offer incredible suggestions
    to make it much better than it would have been otherwise.


    The primary reviewers were Al Stone, Mike Millard, and Katrina Klier. Their comprehensive
    reviews were enhanced by specific technical and business reviews made by Scott
    Peters, David Mosberger, Fred Madden, B’Dale Garbee, Doug Mason, Paul Madick,
    and Jeff Quigley. Some of the information in the chapters on open source processes
    include content and work by Bruce Perens.


    Some reviewers provided input related to their specific areas of expertise and
    experience. Scott McNeil and Matt Taggart did a great job reviewing the chapter
    on standards. I had a great deal of legal help from those who make sure I don''t
    really need to go to law school and for this I thank Scott Peterson, Fred Mailman,
    and especially, Larry Rosen. I offer special thanks to Vern McCrory, who did a
    great job making sure that my analogies to the pharmaceutical industry were well-grounded
    in reality, even though I kept them overly simplistic.


    I also want to recognize all the people who helped me along the way, including
    Louise Whissell, Donna Blochl, Jim Birchfield, Walt Pienkos, Connie Chao, Ralph
    Hyver, Al Gillen, and Earl Zmijewski.


    The executive sponsorship at HP has been equally tremendous with special gratitude
    to Scott Stallard, Duane Zitner, and Ed Yang.


    Finally, a book like this does not happen without a publisher. I''d like to thank
    the wonderful people from Prentice Hall, specifically Jill Harry. Additionally,
    I am grateful for the encouragement of Pat Pekary from HP Books.'
  merge: -1
