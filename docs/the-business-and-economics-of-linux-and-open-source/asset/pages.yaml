    # Linux Distribution


    When most people refer to “Linux”, they are generally referring to a Linux distribution.
    As you will soon learn, a distribution is assembled by any number of vendors and
    combines many components over and above the kernel. Distribution vendors generally
    perform the following tasks:


    +   - Select a specific kernel version

    - Create or select patches to add new functionality or solve problems

    - Select the specific collection of packages and their versions

    - Add their own value-added enhancements such as installation and deployment tools

    - Combine the entire collection on distribution media

    - Certify and test each component, as well as the whole distribution

    - In some cases, bundle in third-party applications or features

    - Apply their individual brand image

    - Select go-to-market channels for distribution

    - Offer value-added services in conjunction with the distribution


    Every Linux distribution is different, sometimes subtly, blatantly. However, Figure
    5–1 gives you a view of the structure common to all distributions. As you can
    see, the distribution includes far more than just the kernel.


    Distribution vendors perform significant amounts of work to bring Linux to you.
    How well they do this work and how well they support their work will be prime
    factors in choosing a distribution to install.


    Most distribution vendors combine a collection of packages (discussed) that are
    all open source. This implies that their distribution can be downloaded and copied
    at no cost. Therefore, distribution vendors have been evolving their business
    models in order to sustain their growth. Here is a quick summary of how most distribution
    vendors make their money:


    +   - Selling boxed sets with media and documentation through retail channels

    - Providing support and update services'
