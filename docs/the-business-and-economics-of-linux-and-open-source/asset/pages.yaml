    source projects, the maintainer is often an individual. Even if the maintainer
    changes companies, he or she may continue as the official maintainer of the code.
    In some cases, a change of companies means a change of priorities and the maintainer
    will pass the torch. People always think of Linus as the maintainer of the Linux
    kernel, not Transmeta, Linus’s current employer, nor any future employer he may
    have.


    +   4 Tools—All developers within a community are used to work with a well-established
