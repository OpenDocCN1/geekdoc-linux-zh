  md: '# The Linux Kernel


    Technically speaking, Linux is the kernel of the operating system. Figure 2–2
    outlines the key components of a kernel. A simple way to think of a kernel is
    to think of the engine in an aircraft. While the engine provides the power for
    the aircraft, pilots do not interact directly with the engine. The kernel is the
    power in your operating system that the users of the computer never directly see.
    In real terms, the kernel is one large application that controls your system.
    This application has complete control- and authority over all the resources (disks,
    memory, CPU, etc.) on your system. It is the job of the kernel to manage and respond
    to all of the incoming requests (from applications and users) for system resources.
    How efficiently the kernel does this depends on its overall design and configuration.


    # Kernel Design


    Linux is a monolithic kernel. As Figure 2–2 depicts, all of the kernel components
    are contained as one special, large application running on the system. The kernel
    is a special type of application, with special privileges, whose job is to control
    your system. The “application” should not be confused with applications you use
    to run your day-to-day business. Any information about the state of the kernel
    is available to all components of the kernel.


