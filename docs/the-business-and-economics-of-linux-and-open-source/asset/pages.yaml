  md: '# Export and Cryptography


    Software that is open source must still comply with the laws regarding export
    control. This is particularly important for software that includes cryptographic
    capabilities, because the U.S. and some other countries impose restrictions on
    the export of such software.


    Because open source software is so readily copied and distributed worldwide, no
    open source license can explicitly require compliance with U.S. law. Such a license
    would conflict with Clause 5 of the OSD (“No discrimination against persons or
    groups). An open source license cannot excuse compliance with the law. Anyone
    who writes software and distributes it is responsible for reviewing the export
    control laws of his or her country and following those laws.


    For open Linux distributions, this presented a special problem. Originally, the
    only way to deliver full cryptographic capabilities in Linux was to do it outside
    the U.S. For some time, certain “crypto” softare, for example Secure Sockets Layer-
    (SSL)—enhanced Web servers, needed to be developed and downloaded from sources
    outside the U.S.


    Recent changes in U.S. export law allow open source software containing cryptographic
    code to be exported. A simple notification to the relevant government agencies
    is all that is required. This provides an incentive for all cryptographic software
    to be open sourced as a way to circumvent current restrictions. Details are available
    at the Bureau of Industry and Security (www.bis.doc.gov). Search for the current
    Export License Exception Chart and look for license exception TSU—740.13.


    Since it is always possible for rules and restrictions to change, much of the
    cryptographic software within the open source community is developed and maintained
    outside the U.S. Therefore, any changes in U.S. export law should have little
    impact on Linux and any other open source applications.


    # Open Source Development Methodology


