    # Languages


    A number of open source programming languages exist. Some are interpreted languages
    (interpreted line-by-line during execution of the program), while others are compiled
    (translated into machine code prior to being executed). Figure 4–3 represents
    the difference in how compiled and interpreted languages run on a system.


    Most of the Linux kernel, device drivers, and other kernel components are written
    in the C programming language. However, a significant amount of software for the
    Web and simple scripts are based on interpreted languages such as Perl and Python.
    I remind you to be careful about associating these specifically to Linux. These
    languages and their associated interpreters/compilers are available on many other
    operating systems, including most flavors of UNIX as well as Windows.


