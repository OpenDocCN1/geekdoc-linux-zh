    # The Open Source Definition


    In general terms, an open source license protects the rights of anyone, anywhere,
    for any purpose whatsoever to use, copy, modify, and distribute (sell or give
    away) software. In practice, this requires open access to the source code.


    These essential rights are codified more formally in an official OSD (OSI), published
    by the Open Source Initiative, a non-profit corporation. The open source community
    recognizes the OSD as the guide to what is truly an open source license. Licenses
    that comply with the provisions of the OSD necessarily provide the essential rights
    listed above.


    It is very important to understand that the OSD is not itself a license. Bruce
    Perez, the author of the initial version of the OSD, refers to it as a specification
    that actual licenses must comply with so that software distributed under the licenses
    can be legitimately “open source.” For the complete, detailed text of the OSD,
    check the reference section at the end of this book for the link.


    The OSI created a certification mark to serve as an indicator of a legitimate
    open source license; when you see “OSI Certified” on a software package, you can
    be assured that the license under that software is distributed with the OSD.


    There is no standard definition (or rule set) for proprietary licenses. Every
    company develops its own. Attorneys review the terms of each proprietary license
