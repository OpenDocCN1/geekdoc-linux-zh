  md: '# Operations—Using Linux and Open Source


    For Linux to become real in your environment, it needs to become an integral part
    of your day-to-day operations. For most businesses, this means having a plan to
    deploy Linux in an existing infrastructure. Those of you who choose to migrate
    from an existing UNIX or Windows environment to Linux need to understand what
    a migration and coexistence plan should include. The latter part of this chapter
    will cover some of the other operational elements that will likely be different
    for Linux: support and training.


    This chapter covers operational elements. Since every enterprise is different,
    you should think of this chapter as a tool to help you make decisions and choices
    for deploying Linux in your environment. This chapter does not attempt to present
    a case for migrating from UNIX, Windows, or any other operating environment to
    Linux, but rather presents the elements you should consider to help you make that
    choice, or if you have already made that choice, the elements to help you plan
    for a successful implementation. There are cases when migrating to Linux is not
    appropriate and should not be considered.


    # Deployment


    Deploying Linux in your enterprise will require extensive planning to decide which
    applications to implement on Linux first. In most cases, Linux will need to be
    deployed alongside an existing infrastructure. Even'
