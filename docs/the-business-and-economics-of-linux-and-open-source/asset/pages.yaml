  md: '170 | Chapter 10 • Value as a Function of Time


    using C++. While this was technically possible, it would only be effective if
    I could use the PalmOS API as a collection of object-oriented C++ class libraries.
    What I needed to do was a much smaller equivalent of what Microsoft had done to
    build their Microsoft Foundation Classes (MFC). The MFC was a set of class libraries
    that dramatically increased the efficiency of writing applications for Windows
    by encapsulating the operating system''s Win32 API.


    I ended writing what I called the Pilot Foundation Classes. It was a part-time
    project that I worked on only during transatlantic trips. Although I completed
    most of my project, another developer beat me to it and released a similar project.
    There was no reason for me to compete with his offering. Had learned quite a bit
    about the PalmOS platform and I was still very happy with the time I had spent
    on development. It turns out my experience in building foundation classes to encapsulate
    an operating system interface would not go to waste.


    # Jump


    One of the key contributors to the Palm (then Pilot) ecosystem was a developer
    Greg Hewgill. Greg had already delivered an emulator CoPilot that was the mainstay
    of every developer''s tool suite (I will come back to this emulator as an example
    of an open source business model in the next chapter). Around 1997, Greg started
    to work on a different project he called Jump. Although the “official” definition
    of Jump is an acronym for Java User Module for Pilot, Greg actually claims it
    came from listening to the popular Van Halen song of the same name during a late-night
    hacking session. Jump allowed a developer to write Java code and then use Jump
    to translate it into the low-level machine language used by Palm devices. (Those
    familiar with Java will know that Java normally runs inside a virtual machine
    known as a Java virtual machine, or JVM. Jump translated Java code directly into
    Motorola 68K assembly code and attached a runtime garbage collector to the application.)
    While Greg was releasing versions of Jump, I was creating a demonstration called
    the “WorldClock.” (I later renamed WorldClock to DeskClock; it is shown in Figure
    10–4). It was a simple application that displayed three time zones simultaneously
    on the display. The plan was for Greg to include my demonstration applications
    when Jump finally released as a training aid for new developers.'
