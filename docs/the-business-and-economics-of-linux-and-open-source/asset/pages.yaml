- img_proc: true
  md: '# Engineering Talent


    The engineers in your organization are just that, talent. They are a valuable
    asset, not irreplaceable parts. When new to the organization, your talent needs
    time to adjust to the corporate culture, understand the system being developed,
    and decide the best place to make contributions. Different individuals will end
    up with a variety of goals. For some, it will be to climb to the highest level
    within the hierarchy; for others, it will be to make contributions as broadly
    as possible throughout the system to expand their knowledge as much as possible;
    and for others, it will be peaked in one very specific area of the technology.
    You need to recognize the value of each one of these goals. They all add value
    to the system.


    For an engineer to climb the hierarchy, he or she will need to demonstrate not
    only technological talent, but some degree of architectural vision, and more importantly,
    significant interpersonal skills. These people will become more and more important
    the higher in the hierarchy engineer aspires to reach.


    The engineering talent needs to be measured on the quality, diversity, and innovation
    of their contributions. This combination of metrics create an interesting dynamic.
    If a favorite subsystem reaches a point of maturity, then the engineer must innovate
    within the system or move to another subsystem to make contributions. If the number
    of contributions becomes too low, then any number of material consequences can
    be established to reenergize the talent.


    The key thing to watch for is the number of rejected contributions. Since every
    level in the hierarchy is held accountable for a quality system, balanced with
    competitive functionality, bad contributions will be summarily rejected. Some
    rejections are normal and should be expected. It may simply imply a highly motivated
    engineer pushing the envelope. By, repeated and sustained rejections point to
    a problem with the talent that needs to be corrected.


    The human resources group should continually enhance the engineering talent. We
    will look at the details of the human resources team a little later. Notice, however,
    the appendices on the engineering talent box. These represent other key parts
    of the larger organization. One of the key benefits of bazaar development is that
    everyone gets to play. While you must ensure that contributors have proper training
    on the system, the tools, and the rest of the infrastructure, your culture needs
    to encourage submissions from anywhere.'
