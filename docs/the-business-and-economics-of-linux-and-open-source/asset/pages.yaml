    Any operating system/microprocessor can have a different endian byte order. Linux
    on the IA-32 and IA-64 platforms are little-Endian, while Linux on SPARC and PA-RISC
    are big-Endian. HP-UX on PA-RISC and Solaris are big-Endian. This byte order issue
    is often the most overlooked, least understood in any management effort.


    As you can see from the example, Linux is unambiguous about endian byte order.
    It depends on the architectural implementation. For this reason, most developers
    will consider an application that is Endian-sensitive (or Endian-unaware) as broken,
    or defective. The Linux development community has developed a set of small, easy-to-use
    tools to ensure that applications developed for Linux are not Endiansensitive.
    This is part of the reason why Linux applications port easily between architectures.


    Most commercial applications that have already been ported to other platforms
    will likely have already dealt with this issue. This means that you and you will
    be able to use the same data if you move your application from a proprietary system
    to Linux or between Linux systems. You should pay special consideration to internally
    developed applications. Very often, internal IT applications will not have considered
    Endian issues and porting your applications will need to be extensively tested
    for data corruption.


