    with the individual(s) making contributions, plus the quality of the contributions.
    Does the prospective candidate have positive visibility and respect within the
    community? To determine the level of respect and visibility, look at the online
    interactions your candidate has with the community (e.g., mailing lists, archives,
    etc.).


