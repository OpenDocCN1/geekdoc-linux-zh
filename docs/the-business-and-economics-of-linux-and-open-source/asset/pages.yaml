    Web Server. According to the Netcraft Web server survey (www.netcraft.com), at
    the end of 2001, the Apache Web Server was being used by more than 50% of sites
    on the Internet. The combination of Linux and Apache creates a low-cost, high-performance,
    easily deployed environment for almost any service provider or IT department.


    Beyond Apache, many applications have been developed by research and educational
    communities, or have been developed in-house by companies on the leading edge.


    The classic chicken-and-egg conundrum occurs with any environment, and Linux is
    no different. While many companies wait for applications to be available before
    they deploy Linux in their environment, ISVs wait for customers to deploy Linux
    before they make their applications available.


    This conundrum is gradually breaking down, Part of the breakdown is attributed
    to the normal maturation of Linux. Also, mainstream application vendors are seeing
    part of their business being eroded by open source alternatives. One of the first
    and most significant of these breakdowns was the effect of Apache on the Netscape
    Web server family.


    Another factor driving the change is one already mentioned: the development environment.
    ISVs have had to maintain multiple development environments for each of their
    UNIX platforms. Many are shifting to Linux as their core development environment
    and using it as the base port for all other platforms. In fact, in conversations
    with ISVs, many of them were surprised to find that a significant portion of their
    engineers were already using Linux both at work and at home. Some of them expected
