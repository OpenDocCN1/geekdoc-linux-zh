    counts on basic testing and quality. Since it is also likely that the size of
    the developer/user population in your organization is much smaller than the community
    at large, you will need more formal testing and integration processes.


    In Chapter 12, I will discuss the process of making your source available under
    an open source license. It often impossible to predict when the time might come
    that you may want to do. Therefore, from a source integration perspective, using
    the same tools that will give you the flexibility to integrate and potentially
    migrate to a community source base. In some cases, legacy or other company dynamics
    may force you into specific source integration systems. In these cases,


