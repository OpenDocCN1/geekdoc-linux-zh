    # Cost/Benefit Analysis


    Many people believe that the process of moving software to an open source license
    only requires a simple packaging exercise and making the product available for
    download. However, it can be far more expensive to open source products than this
    simple view of the world. Each financial analysis must take into consideration
    the goals and dynamics of the specific project. There are some common elements
    that should be considered part of the cost analysis:


    +   - Maintaining a new software repository.

    - Sanitizing the existing code base and removing any inappropriate components
    or comments.

    - Marketing programs to announce the availability of the project and building
    a community.

    - Performing ongoing maintenance of the software (assuming you choose to remain
