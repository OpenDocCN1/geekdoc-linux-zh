    and the right competitive goals within these markets, the engineering teams have
    all the motivation they need to deliver the right technology with the right features.


    # Go-to-Market


    So far in this discussion, I have been very careful to associate the technology
    team with technology delivery. This is because the responsibility for delivering
    a polished product is the responsibility of this team. To understand this concept,
    take a look at how the Linux operating system is delivered to the vast majority
    of customers. Linux works with a talented team to create a kernel. Thousands of
    other developers work to create and enhance what you understand as the GNU system
    and other key software components. Then, a suite of distribution vendors combine
    all of these components and integrate them into a polished product for end-user
    consumption. What may not be obvious is that distribution vendor assembles the
    component parts differently, and adds custom tools and capability largely dependent
    on the market being targeted. As mentioned, some vendors might target the server
    market, others the desktop, while still others real-time telecommunications applications.


    This team fills the role equivalent to the distribution vendor. This can give
    you the same technology and deliver it to vastly different market segments. For
    smaller projects, you might have only one of these teams; for very large projects,
    you could have dozens. The management challenge will be clearly draw the lines
    of where the technology team ends and the market teams begin. But, this implies
    that you will need some engineering talent as part of your go-to-market teams.
    This talent can differ substantially from the core engineering teams.


    This team is also responsible for completing all the elements of the value chain,
    including working with sales teams, manufacturing, support, and all the other
    organizational teams that are part of delivering a working solution to your customer,
    whether internal or external.


    # Other Structural Elements


    The focus of this discussion has been largely on where engineering tends to occur
    within the organization, with some connection to the other teams immediately affected
    by such a fundamental change in development style. You will need to determine
    how any of the other structural connections'
