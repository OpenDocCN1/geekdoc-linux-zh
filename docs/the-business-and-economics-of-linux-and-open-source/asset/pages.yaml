  md: '# CHAPTER 10


    # Value as a Function of Time


    Software vendors create technology in the hopes that more value will be created
    than the cost of developing the software. The more unique and significant the
    value, the more pricing power the vendor will have. The primary factors affecting
    pricing power are the value perceived by the customer and the competitive pressure
    in the market. Open source atacks pricing power in new ways and accelerates the
    devaluation of some technology. This chapter examines this new form of competition
    in the marketplace. Although this chapter is written with commercial software
    vendors in mind, it is equally useful for IT managers to understand how their
    vendors are being affected by market dynamics, and to also have visibility into
    new competitive offerings developing in the marketplace. Understanding the effect
    on resources is also important for IT managers. The objectives for this chapter
    are for you to understand:


    +   * The economic impact of the time/value curve

    * The effects of open source on the value of commercial software

    * The effects of open source on the sustainability of value

    * How to use the time/value effect to your advantage


    As a developer of commercial software, you will need to accelerate your move up
    the value stack or risk seeing your value getting commoditized and no longer be
    in a position to generate enough revenue to recover'
