  md: '# CHAPTER 13


    # Human Resources—nGetting Top Talent


    Many companies have employment policies that stipulate that the company owns anything
    its employees develop. What happens when an employee works on an open source project?
    How is it possible for your employee to give away their developments while fulfilling
    the requirements of his or employment agreement? Open source fundamentally changes
    how you view human resources and organizational development. In this chapter,
    we will examine the details of how the hiring process needs to change, the new
    qualifications that you need to look for, and some of the IP provisions normally
