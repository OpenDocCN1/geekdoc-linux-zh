    # Support and Services Tied to Open Source


    Linux distribution vendors created one of the first business models used in the
    open source community. The most basic form of this model sets out to sell support
    for the distribution a vendor provides. Most Linux distributions package their
    distributions with open source components they have developed, they are the experts
    on the package. With these open source distributions, a number of business models
    have developed:


    +   Retail packaging—Many customers are willing to pay for the simple convenience
    of media and manuals. Many are still unaware that they can simply download or
    copy the software legally and at no cost. Many Linux distributions are available
    at retail.


    +   Support—Distribution vendors typically bundle support services with their
    retail packages to help customers with installation and any other difficulties
    they may encounter. Large corporate customers will purchase comprehensive support
    services for their complex installations. Some companies, as Linux-Care, are dedicated
    to support services for a broad range of open source offerings.


    +   Subscriptions—This is part of the services portfolio offered by some distribution
    vendors. Subscription services offer a number of options for keeping your software
    automatically up-to-date. Xianian Corporation uses subscription services to provide
    update services to users of the GNOME desktop.'
