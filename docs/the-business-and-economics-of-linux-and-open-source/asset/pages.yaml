- img_proc: true
  md: '# Geography


    Anyone with experience in working with the open source community will be capable
    of working and interacting with people across geographies, time zones, and cultures.
    The challenge for the hiring manager will be to develop a geography strategy for
    talent acquisition, as well as where the talent resides after hiring.


    It can be a great benefit to your company to be able to hire talent from anywhere
    in the world and have them join your team. However, this will need to be balanced
    with the obvious benefits of having a co-located team that can work closely together.
    From my experience, one of the best strategies is to ensure that you have a strong
    critical mass in one location for a given project. Avoid splitting projects across
    geographic boundaries. Then you can add specialized, high-caliber talent in remote
    geographies that supports and enhances a local team. The other benefit to this
    is that when your team works with outside community members, it manages the relationship
    to remote community members virtually the same way as community members.


    If you are contributing to an open source project that is critical to your company,
    consider funding face-to-face meeting on a periodic basis for the key members
    of this community. This is often called a “hackfest.” If you can plan this around
    an industry event related to the business, then you can bring all the developers
    together to learn about the industry, to know each other, and get some serious
    development accomplished. Plan to pay for airfare, hotel, meals, and all the usual
    expenses that a regular employee would have. You will generally find that community
    participants are frugal and more interested in getting development done than wasting
    your money. Your goal should be to get through a critical development crunch by
    supplying all the equipment the team needs. This way, the co-location and resultant
    collaboration will yield significant results.


    # Count the Hops


    A community is largely driven by influence. The ultimate point of influence is
    the maintainer of a project. For large projects, there will be an informal hierarchy
    of trust between the maintainer and key contributors. Obviously, it is not realistic
    to always expect to be able to hire the maintainer of a project. In the hiring
    process, discover and understand this hierarchy and then count the number of developers
    between your prospective hire and the final control point, the maintainer. This
    is known'
  merge: -1
  pgno: 238
- img_proc: true
  md: '216 • Chapter 13 • Human Resources—Getting Top Talent


    as “counting the hops,” like one does in network traffic routing. The less hops,
    the closer the candidate is to the maintainer.


    # Structuring the Teams


    Structuring your teams will largely depend on the role your company takes in an
    open source project. As you learned from the corporate bazaar concept, it is possible
    for you to structure a very large open source project and manage the team. More
    often, you will be working on much smaller projects; in many cases, you will be
    one of many contributors to an open source project.


    Because of the reciprocity issues outlined in the previous chapter, you should
    make every effort to keep developers contributing to external projects dedicated
    to open source projects.


    The special case of gated communities will also come into play structuring your
    development teams. You may find yourself with a combination of proprietary projects,
    open source projects, and projects within gated communities. It will be up to
    you to ensure that you have defined detailed processes to ensure that IP ownership
    and developer assignments are clearly defined for each of the boundaries.


    # Hiring Visible Leaders


    At this late point in the book, I will share a specific and personal experience
    from within the HP context. By many peoples’ measure, I took a significant risk
    when I hired a visible and vocal open source community leader, Bruce Perens. Bruce’s
    first priority continues to be represent the community at large and to advance
    the open source movement. He works with a number of internal HP product teams
    to offer advice and education related to working with the open source community.
    Bruce represents HP with a number of our customers. On some rare occasions, Bruce’s
    opinions are different than those of the company’s. Bruce and I have worked on
    a set of rules to guide these conditions:


    +   Bruce cannot make personal attacks on HP and its executives.


    +   Bruce cannot share proprietary product information until it is publicly released.


    +   Bruce must clearly identify when he speaks his opinion representing rather
    than that of HP’s.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Summary


    It was also my job to work with the industry, the press, analysts, customers,
    partners, and competitors to ensure that they clearly understood Bruce''s role
    within HP. In my estimation, while Bruce''s dual role continues to cause a small
    degree of discomfort with some management teams within HP, it has been very positive
    to our Linux and open source business. Most people in the industry have adapted
    well to the dual role that community leaders need to have. Both Bruce and HP have
    been able to maintain a high degree of credibility and integrity.


    Open source leaders must represent their community first and company second. It
    will be difficult for you to accept this concept at first, if you establish clear
    boundaries for communication, it can be successful. Make sure your employees understand
    that this individual has a unique role and that you are not redefining the behavior
    code for the company. Make sure you develop a solid, trusting relationship between
    your company and any visible leader you might hire.


    # Summary


    Structuring, building, and managing teams that combine open source and non-open
    source projects is a different way to manage engineering teams. Culturally, your
    engineers will struggle between their loyalty to the community and their loyalty
    to the company. You need to be aware of this cross-loyalty challenge that many
    of your developers will have and get accustomed to managing it, and not feel threatened
    by it. This chapter gave you the new items you need to consider as part of the
    hiring and management process, and the elements you should consider as part of
    developing company policy.'
  merge: -1
