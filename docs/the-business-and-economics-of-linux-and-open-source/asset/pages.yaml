  md: '# Control and Vendor Independence


    The Intel x86 architecture (also known as IA-32) brought commodity economics to
    the personal computer (PC). In many ways, Linux is the same thing for the operating
    system. Prior to Linux, your choice was primarily a proprietary operating system
    on proprietary hardware, or a proprietary operating system on commodity hardware.
    While there are other open source operating systems such as BSD, Linux is the
    first viable combination of a commodity operating system on commodity hardware
    (Linux is also available on a wide range of proprietary and embedded architectures).
    As you will discover later, the licensing model used by Linux is what differentiated
    it from BSD and created a single operating system developed by many. With more
    and more independent software vendors (ISVs) making their applications available
    on Linux, IT managers can now deploy solutions on the hardware and operating environment
    that is the most cost-effective and delivers the highest return.


    Enterprises that have deployed commodity hardware on the Intel IA-32 architecture
    have seen the many benefits of commodity economics. Companies are no longer tied
    to one vendor and the switching costs are very low. Companies also choose to mix
    and match hardware and peripherals since a large ecosystem develops around commodity
    products. Most, if not all, these advantages, which boil down to choice and control,
    are available with Linux. If one Linux operating system vendor does not provide
    the level of service or quality your company needs, then switch. If the support
    does not measure up, find someone else or do it yourself. The do-it-yourself option
    is one that is much more viable with open source software than with commodity
    hardware. With commodity hardware, you still need to work with one hardware vendor
    for the features or defect repairs you need. With software, you can implement
    changes on your own or seek the help of professionals to do it on your behalf.


    # Software Development


    Linux has become the primary platform for Fluent''s development team. Fluent is
    a leading vendor of computer-aided engineering (CAE) software solutions. Linux
    gives Fluent''s developers an extremely fast and stable platform with a wealth
    of freeway tools. In addition, developers have complete access to all Windows
    applications via VMware, an Intel chip emulator that runs under Linux. This gives
    them access to both UNIX and Windows environments from a single machine.'
