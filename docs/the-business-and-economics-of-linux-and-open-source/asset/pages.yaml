  md: '# Who This Book Is For


    This book is directed primarily at business managers. Some of you will be information
    technology (IT) managers in any given industry and may be trying to understand
    what Linux and open source deliver to your business. In other words, what is different
    that would cause you to want to change? Others will be managers developing software
    for internal use, or for commercial resale. In these cases, you will likely be
    looking at the open source movement as a way to leverage a huge population of
    developers, but may struggle to understand the best way to integrate with this
    community and return return profit for your investors. This book is from one manager
    to another and there are two levels of management that can benefit. If you are
    part of executive management, this book will give you a guide to help your teams
    find the right answers and ask you the right questions when your teams make new
    proposals related to Linux and open source. If you are in the middle management
    ranks, this book should help you make sure that your plans and proposals to senior
    management are complete and address the new business paradigms of Linux and open
    source.


    This book is not for developers. It does not navigate through any code modules
    for any software in Linux or any other open source project. There may be cases
    where uninitiated developers may be looking for a big-picture view of the Linux
    and open source communities. In these cases, this book will add value, at least
    in parts.


    For the past few years, I have been working every day in this wonderful way of
    doing business. It is always a challenge to take on a job where concepts are different
    and some of the fundamental rules change. It is natural for most people to reject
    these changes and do everything possible to maintain the status quo. I continue
    to deal with this resistance every day. While the business concepts associated
    with Linux and open source are still very new, corporate managers are rapidly
    discovering that they can no longer ignore what is happening. The wonderful thing
    about a market economy is that it requires new business concepts as Linux and
    open source to prove themselves, and once proven, those who ignore them, invariably
    lose. Competitors who notice and aggressively take advantage of new opportunities
    begin to take business from those who reject change. However, those who move quickly
    to every fad that comes around waste resources and eventually disappear or realign
    to an accepted business reality. There are those who believe Linux and open source
    are still a passing fad, and some who even hope it will go away soon. The Linux
    operating system is now more than 10 years old.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Preface


    The open source movement, which started with the free software movement, is approaching
    20 years of existence. It should be apparent that it is not going away, and that
    your business needs to deal with new realities.


    # HOW THIS BOOK IS ORGANIZED


    Part 1 of the book is an initiation into the world of Linux and open source. Chapter
    1 starts by examining the fundamental business reasons why this new movement is
    good for business and how it delivers value. It also establishes a core understanding
    of terminology and significant players so that you can follow the rest of the
    book. Chapter 2 digs deep into the Linux kernel. While the kernel may seem a deeply
    technical topic for business, in this new world, it is a core requirement to understand
    how components fit together. The next chapter outlines the Open Source Definition.
    Since open source is at the core of what makes Linux work, understanding open
    source licenses is also a required component of basic training. Part 1 ends with
    a broad look at a number of communities and organizations you will need to be
    familiar with as you integrate your company with this movement.


    Part 2 looks at the operational side of Linux. It starts with a look at Linux
    distributions to help you finalize the Linux kernel integrates with all the pieces
    that constitute an operating system. Next, you will be taken through a detailed
    analysis of measuring IT costs with an open source mindset. We will also look
    at how key standards affect the future success and success of Linux. Finally,
    we will take a look at operations from deployment, migration, and coexistence,
    to support and training.


    The last part of this book explores in great detail the open source effect on
    the corporations and businesses developing commercial software. This is where
    the fundamental new business paradigms are examined. We will start by looking
    at how the open source community is structured, some of its cultural elements,
    and how it compares to a corporate structure. We will also examine the open source
    effect on the value delivered over time. This will prepare you for the following
    discussion, which is a detailed examination of open source business models and
    how to make money. The last two chapters examine in great detail the process of
    integrating open source within your company and the people management effects
    of working with this new community of developers.


    Many of the concepts presented, especially in Part 3, will be very new to a business
    audience. Hopefully the information will give you enough guidance to manage open
    source projects within your company and help'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'you build synergistic relationships with the great communities of developers
    out there.


    As you being to understand how open source works and what it really is, I encourage
    you to look at this book as an open source project. I am but the maintainer, and
    I hope that any of you will become contributors. I present to you an imperfect
    project and hope you will share your genius, much as those who contributed to
    the review process, to evolve it into a great one.


    Martin Fink

    Summer 2002'
  merge: -1
