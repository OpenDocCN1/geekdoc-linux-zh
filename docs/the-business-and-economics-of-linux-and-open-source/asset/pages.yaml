  md: '# PA-RISC


    http://www.parisc-linux.org/


    PA-RISC is the processor family developed by HP. HP has also significant investments
    in the IPF and is the co-inventor along with Intel. HP is evolving PA-RISC to
    IPF as its strategic microprocessor for the future. The Puffin Group, a small
