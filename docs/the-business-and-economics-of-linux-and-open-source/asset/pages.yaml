  md: '# Chapter 3 • Open Source—Navigating the Legal Path to Freedom


    Although this table lists the most popular open source licenses, we need to take
    a more detailed look at primary copyleft licenses such as the GPL and LGPL.


    # The GPL and LGPL


    The most talked about open source license is the GPL, or the GNU general public
    license. The GPL was authored by Richard Stallman as a way to ensure that the
    freedom of source code he was creating did not get abused by others (see Appendix
    C for the full text of the GPL). Simply making software open and public, Richard
    understood there was a real danger that others could take that software and reuse
    it in restrictive and proprietary ways. Richard wanted to ensure a quid-pro-quo.
    If you benefit from open source, any changes or contributions you make should
    benefit others as well. The GPL ensures that this chain of freedom is never broken.
    The license requires that any modifications you make to GPL code and that you
    distribute be made available to the community. The GPL was the first “copyleft”
    license. Figure 3–2 outlines two source trees, one GPL and one proprietary, and
    how the flow of the source needs to be considered.


    Unfortunately, some have incorrectly interpreted the GPL to mean that anything
    that touches running GPL code must also be GPL. This is completely false. The
    best example of this is the Linux operating system. The Linux kernel is licensed
    under the GPL. Today, there are many commercial applications (e.g., Oracle) that
    are available on Linux that are not GPL. Part 3 will go into the details of writing
    software that is closely connected to the GPL without forcing the GPL on the source
    base.


    The other cousin to the GPL is the LGPL, or lesser GNU public license. The LGPL
    was created to solve the problem of using libraries licensed under the GPL. The
    GPL forces any commercial application that uses shared libraries licensed under
    the GPL and is distributed


