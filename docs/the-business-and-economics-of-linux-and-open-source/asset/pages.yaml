  md: '# Chapter 12 • Integrating Open Source into Your Business


    +   Exit plan—If you are exiting a particular business category, open source can
    be an effective way to accelerate the process and refocusing valuable resources.


    +   Partner play—Open source has the effect of encouraging collaboration. You
    can use open source as a way to work with partners and competitors on very large
    projects.


    +   Documenting prior art—There may be times when your company has developed technology
    that is not strategic and does not want to incur the costs of applying for a patent.
    Releasing software under an open source license is an effective way to document
    prior art.


    Similarly, there are a host of reasons why using open source does not yield a
    business benefit. Here is a list of the most common reasons for which open source
    is generally not a good idea:


    +   Control point—If your product is a competitive control point, or generates
    a significant barrier to entry for your competitors, you should not consider open
    source for a product.


    +   Product obsolescence—End-of-life may not be the same as an obsolete product.
    If a product is no longer useful in your eyes and those of your customers, terminate
    the product. Attempting to keep the product alive through open source is generally
    not a very good reason to use open source.


    +   Negative cost/benefit—If you do the financial analysis of what it will take
    to move a product to an open source license, you should be able to quantify a
    larger return, or not execute.


    +   Resource defocus—Usually when moving to the open source community, you will
    still need to apply internal resources. The application and cost of those resources
    significantly defocuses the organization, then it may not be a good idea to move
    ahead.


    +   IP risk—Your attorneys work with you to understand who owns the IP in a project.
    If the legal risks are too great, or difficult to quantify, you should not proceed
    with the project.


    +   Competing with the community—Competing with an existing open source project
    is generally not a good idea and will generate all ill with the community. If
    a project similar to yours already exists, you should attempt to join and enhance
    the project rather than compete with it. There are times when competing projects
    with different goals can make sense. Take time to consider your options carefully
    in this scenario and seek guidance from the community.'
