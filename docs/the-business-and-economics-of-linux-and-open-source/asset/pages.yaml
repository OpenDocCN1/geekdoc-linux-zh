    and optimizing for smaller systems. This may make it more difficult to find ways
    to vertically scale the kernel.


    # Business Risk


    Linux (and most open source software) presents a new class of risks, usually involving
    the management of intellectual property. Implementing any new technology within
    an enterprise involves risk that needs to be managed. Linux and open source are
    no different. Business processes that may not have existed before must be established.
    Many companies are discovering, however, that managing these risks are well worth
    the economic returns that Linux brings. Part 3 of this book will examine, in significant
    detail, many of the risks associated with open source and how to manage them.
    In fact, open source opens a wealth of new opportunities to increase productivity
    and refocus your energy to the core value you bring to your customers.


