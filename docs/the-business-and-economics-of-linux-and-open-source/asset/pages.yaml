  md: '# Open Source Development Methodology


    +   1 Maintainer—Most projects are run by a maintainer. The maintainer is the
    individual who initiated the project, or who was assigned by a previous maintainer.
    The maintainer accepts/rejects submissions, applies patches, monitors defects,
    and interacts with other projects where needed. Open source projects typically
    have an orderly handoff from one maintainer to another. When a developer loses
    interest in a project (or no longer has the time to devote to), he or she will
    pass the torch to a new maintainer. The new maintainer is typically selected from
    a list of individuals who have made significant contributions to the project.
    Maintainers are always volunteers. There are cases where the maintainer is a committee
    established for the project. Also, when a project is driven by a company, the
    maintainer may be a group of individuals within that company.


    +   2 Respect—Built over time, and by ongoing contributions, respect for the individual
    is paramount in the open source development community. If a developer attempts
    to contribute code, he or she will be quickly notified by members of the community—the
    community tends to be equal with praise and criticism. Continuous, high-quality
    contributions will build respect over time. A maintainer (such as Linus Torvalds)
    will more readily accept contributions from someone he or she knows well and has
    a history of good, solid code. Contributions from an unknown will be carefully
    examined and critiqued before being accepted. Poor contributions will cause a
    developer to get shunned by the community.


