- img_proc: true
  md: '# 60 Chapter 4 • Communities and Organizations


    Reading this chapter in detail is not required. At a minimum, you should scan
    this chapter and read the detail of the communities that you think are relevant
    to your business. Also, take some time to look through some of the communities
    that you might not be familiar with. Then, refer back to this chapter on occasion
    when you are looking for a connection to a specific community.


    # Linux


    As you learned in Chapters 1 and 2, Linux is a kernel. The kernel community comprises
    a number of groups focused on the core of the kernel proper, processor-specific
    work, and finally those that work on extensions to the kernel such as file systems
    and other device drivers.


    # Kernel


    ```

    http://www.kernel.org/

    ```


    The center of the kernel universe starts at kernel.org. This group of engineers
    focuses on the deepest and most complex aspects of software development. Playing
    here is not for the faint of heart. You will find a very sparse Web site focused
    on the developer. This community, like many others, operates on the basis of email
    conversations through reflectors (email sent to one address is automatically forwarded
    to all subscribers). The email traffic is very high, and only those who are dedicated
    to kernel development should connect to this community.


    # Processors


    x86 (IA-32)

    The IA-32 processor family does not have a different community since it is at
    the core of all kernel development. Simply follow the link for primary kernel
    development.


    Itanium Processor Family (IPF, also known as IA-64)

    http://www.linuxia64.org/

    IPF is widely believed to be the successor to the IA-32 family of processors.
    This will not happen overnight. For the immediate future, IA-32 will continue
    to provide price/performance leadership for low-end systems. Look to IPF to take
    an early lead in higher computing, and to gradually take over as the dominant
    processor as applications begin to'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'demand 64-bit computing and a commodity-driven ecosystem evolves around the
    architecture.


    Linux for IPF began as a project primarily driven by David Mosberger and Stephane
    Eranian at HP Labs. Intel and other companies who were under confidential disclosure
    requirements from Intel were also working in this space. Shortly after the began,
    this group of companies, which included HP, Intel, SGI, IBM, and others, formed
    a consortium known as the Trillion group. Trillion allowed companies to work on
    Linux support for Itanium without disclosing the specifics of Itanium to the general
    public. When Intel finally released Itanium to the industry at large, the Trillion
    group was disbanded and the code for Linux on IPF was available as open source.


    An IPF simulator is available for the IA-32 processor family. The wonderful thing
    about this is that it allows developers to use their low-cost laptops and desktops
    for all their development for Linux on IPF. There are a number of other tools
    available at the official Linux IPF Web site.


    David continues his role today as the maintainer of the Linux/IPF kernel and is
    one of a few individuals on the short list to succeed Linux. David also represents
    a good example of where the maintainer of the project is an individual, not the
    company.


    # Alpha


    http://www.linuxalpha.org/


    The Alpha processor is well-liked within Linux circles. In fact, for a long time,
    the Alpha was the preferred processor for Linux in high-performance computing
    applications.


    The Alpha Linux Organization hosts this community. Some distribution providers
    providing support for the Alpha implementation. However, prior to its acquisition
    by HP, Compaq had announced an impending end of life for Alpha and has committed
    to the IPF for its future. Much of the Alpha IP is now owned by Intel.


    # PowerPC


    http://www.linuxppc.com/

    http://www.linuxppc.com/


    IBM and Motorola have both produced PowerPC. The PowerPC community is largely
