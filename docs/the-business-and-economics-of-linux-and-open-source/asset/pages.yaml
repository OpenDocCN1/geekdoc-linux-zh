    * Integrated patches

    * Modules, drivers, and versions

    * Location of files

    * Package versions


    Almost everyone in the Linux industry (end-users, distribution vendors, and application
    vendors) have come to realize that these differences are having the simple and
    undesired effect of slowing Linux adoption. As a result, the top distribution
    vendors, as well as the hardware vendors, ISVs, and open source developers who
    as Linux himself, have grouped together to create a set of standards managed by
    the Free Standards Group. It is obviously important for there to be significant
    benefits to creating new standards. Before we look at the details of the standards
    under the Free Standards Group here are the key advantages and winners behind
    these standards:


    +   * End-users—The final end-user will often be medium to large corporations
    with a presence all over the world. Linux standards allow end-users to select
    distributions of local interest while ensuring that they have one support model
    for the entire enterprise. End-users also benefit by ensuring maximum application
    support on their platform of choice.'
