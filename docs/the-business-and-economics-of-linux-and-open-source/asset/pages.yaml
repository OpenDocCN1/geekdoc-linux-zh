    The subsystem architect also has responsibility to the release architect. Any
    issues with the subsystem will typically find their way through the release architect.
    The subsystem architect is highly motivated to work with the release architect
    to make the required enhancements and fixes to the currently released environment.
    Responsiveness will only improve the ongoing quality of the system.


    There are a few key metrics you can put in place for the subsystem architect:


    +   **The ability to attract talent to the subsystem**—Also, extension, you must
    do the work to ensure that talent is available.

    * **The timely and quality submission of the subsystem**—The next level up in
    the hierarchy is the key input for this. If the submissions do not meet acceptable
