  md: '> "A thought-provoking analysis of the role of open source software in the
    corporate environment. A must-read guide for managers considering how open source
    can help their organization."

    —Tim O''Reilly


    # The BUSINESS and ECONOMICS of LINUX and OPEN SOURCE


    The manager’s guide to using Linux and open source for competitive advantage


    Using Linux and open source technologies, thousands of enterprises are cutting
    costs, gaining flexibility, and discovering powerful new sources of business value.
    Now, there’s an objective, realistic manager’s guide to using Linux and open source
    technology for competitive advantage. Martin Fink gets you past the hype and the
    naysayers, so you can accurately assess the benefits, costs, and risks of open
    source in your organization. Writing strictly from the manager’s viewpoint, covers
    every step of Linux and open source business lifecycle, and every crucial issue,
    from licensing to collaborating with the open source community of developers.
    Coverage includes:


    +   - Assessing the costs, benefits, and risks of pursuing Linux and open source
    initiatives

    - Open source licensing: avoiding the minefields

    - Managing Linux and open source projects within your company

    - Assessing the size, breadth, and capabilities of the open source community

    - Building strong, positive, synergistic relationships with external open source
    communities

    - The crucial role of Linux standards

    - Integration, development, deployment, migration, coexistence, support, and training

    - Understanding the difference between the Linux kernel and the Linux operating
    system

    - Understanding and choosing Linux distributions

    - How the open source paradigm impacts commercial software developers

    - Open source business models: what it takes to make a profit from open source
    technology

    - Applying the open source development methodology in a corporate setting


    # ABOUT THE AUTHOR


    MARTIN FINK is General Manager for Hewlett-Packard’s Linux Systems Division, where
    he has been leading Linux development activities for more than three years. He
    is responsible for driving HP’s overall Linux and open source strategy and managing
    the firm’s open source business processes. He is also Vice President of the Board
    of Directors for the Open Source Development Lab, a global consortium of industry
    leaders dedicated to promoting Linux and telecom carrier-class environments.


    ![](img/9f16a110ce50f60110e048120e699904_275_0.png)'
