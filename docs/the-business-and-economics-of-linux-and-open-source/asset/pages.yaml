  md: '# Web Services and Application Servers


    I have already discussed the role of the Apache Web Server in the explosive growth
    of Linux. But Apache is not alone, and the work of Apache is no longer confined
    to the simple Web server. The Web has also evolved from providing static content
    such as publications to more dynamic content, which is usually associated with
    database interactions. Additionally, we have seen the evolution into e-commerce,
    business logic, and most recently, full-blown Web services. There are a number
    of open source communities dedicated to providing offerings in ever-evolving space.
    Keep in mind that many of these are not dedicated to Linux; many of these open
    source capabilities are available for operating systems other than Linux. Here
    are a few to keep a close eye on:


    # Apache


    http://www.apache.org/


    The Apache Foundation was formed as a non-profit corporation to further the development
    of not only the core Web server, but all of the dynamic services evolving around
    the core Web server. From this location, you will discover a number of sub-communities
    rapidly evolving to keep up with the most of the new technologies developing in
    the Web and application server spaces. One of the most significant sub-communities
    to keep an eye on is the XML community for Apache. XML provides a common data
    format for evolving application servers (discussed later) into the next generation
    of Web services.


    # TUX


    http://www.redhat.com/products/software/linux/tux/


    TUX is a kernel-based Web server. A Web server such as Apache runs as an application
    on top of the Linux kernel. What makes TUX special is the performance it can achieve
    as a result of being part of the kernel, as well as the integration it provides
    to higher level Web services. Figure 4–1 graphically shows the connection between
    TUX within the kernel and the Apache Web Server.


    Combining TUX with the Apache Web Server is worth serious consideration for deployment
    within your organization.'
