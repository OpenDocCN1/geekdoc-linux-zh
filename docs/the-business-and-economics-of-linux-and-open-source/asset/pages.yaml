  md: '# Migration and Coexistence


    at the operating system layer could be painless and even invisible for your developers.


    # Applications


    When migrating from existing proprietary environments to a Linux-based platform,
    you should look for open source equivalents to your existing applications. This
    is not meant to promote the notion that all open source software can replace any
    commercial application. Rather, there are times when we implement very good and
    very powerful commercial applications, but end using a very small percentage of
    the capabilities of the software. If you have deployed applications that are not
    being used to the full extent of their capabilities, there may be an open source
    equivalent out that more than meets your requirements. For example, you may be
    using a commercial database to do simple storage and retrieval of employee data
    on an internal Web portal. The odds are quite good that an open source database
    such as MySQL or PostgreSQL will more than meet your needs.


    # Desktop


    Migrating a desktop environment to Linux should be undertaken with some degree
    of care. Most will agree that the Linux desktop is currently suited primarily
    to power users, or engineers accustomed to UNIX desktops. While this may change
    as time progresses, evolving your desktop environment for an average user will
    require some extensive retraining, not only on the operating system itself (user
    interface, file sharing, file management, etc.), but also on all of the office
    productivity applications currently within your infrastructure. If you make the
    choice to migrate your office productivity desktop environment to Linux, make
    sure that you have a detailed inventory of all the applications that your users
    currently depend on, and also make sure that even your Web-based applications
    will work with Linux-based browsers.


    There are also a number of solutions appearing on the market based on an open
    project called “WINE” (Win32 Emulator). Win32 is the core Windows operating system
    API. WINE has been developed to provide this API on the Linux operating system.
    WINE allows a few Windows-based applications to run as-is on your system. Commercial
    vendors are certifying and testing specific applications and providing special
    installation tools to help the process of loading and running applications.'
