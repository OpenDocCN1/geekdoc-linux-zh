    as an extension of the organization and managing the organizational firewall.
    Your goals for this chapter are to understand how to:


    +   - Evolve your recruiting and hiring processes

    - Manage the IP ownership among employee, company, and community

    - Manage community leaders in your company


    Hiring and working with the community of developers is a different process, but
    it allows you to know and understand who you are hiring and what skills they have
    very early in that process.'
