  md: '# Cost, Value, Return, and Time


    The pharmaceutical industry has the very distinct benefit of knowing exactly when
    its patent expiration will have the effect of having generic versions of drugs
    begin to appear in the market. This allows the industry to build well-understood
    cost/return models. Take a look at the chart in Figure 10–1.


    This chart depicts a simplified view of the economic lifecycle of new drug development.
    My goal is not to make you an expert in the economic models of this industry,
    but to use this to parallel the effects of open source on the software industry.


    Pharmaceutical companies invest large amounts of money in research for new drugs.
    Their goal is to discover new treatment options for any number of ailments that
    our society must contend with. The major motivation for these companies to incur
    high research costs is the knowledge that their discoveries will be protected
    by applying for a patent, and if that patent is awarded, exclusive rights to the
    drug for a period of 20 years (there are cases when the life of a patent can be
    extended).


    ![](img/9f16a110ce50f60110e048120e699904_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Chapter 10 • Value as a Function of Time


    At some point in the research cycle of this simplified model, a discovery for
    a new drug occurs. To protect the discovery, the company will apply for a patent
    (patents take 2-4 years to be awarded). The next stage is to do a number of developments
    based on the new discovery. The development cycle includes refining the drug,
    testing the effects on a variety of non-human subjects, and looking for compound
    activity against the target disease.


    The development cycle will next evolve to clinical trials. This stage involves
    controlled testing with human subjects. The drug compound is tested for safety,
    efficacy, and ideal dosage. Even before approval is received from regulatory agencies,
    if the new drug compound appears promising, the production cycle will begin. The
    product can be made available for sale only after the drug has completed clinical
    trials and has been approved by regulatory agencies. In some cases, the compound
    will not be approved and the production process will need to be halted. Note that
    by the time a drug reaches the market, the patent''s clock has ticking for years.
    The goal for the drug company is to make it through development and trials and
    get approval in the shortest possible time, ensuring delivery of a safe product.


    Even before a drug gets full regulatory approval, drug companies will start to
    ramp up their production capabilities, train their sales forces, and seed the
    market for their great new product. During this cycle, the goal is to maximize
    the revenue for the new product. The product must not only cover the operational
    costs of manufacturing, sales, marketing, and distribution, but it must also be
    able to recover the costs of the research and development cycle. If the revenue
    exceeds the ongoing operational costs as well as the research and development
    costs, only then will the drug reach a positive return on investment (ROI).


    A complexity not shown in the diagram is that at one time, there will be research
    underway in a number of different areas. Some research will never turn into a
    product. In fact, most compounds never reach the market. Therefore, not only must
    a new drug cover its costs, but it must also contribute to recover the costs of
    inevitable failed research attempts. The revenue combination of all drugs currently
    released in the market must generate enough operational cash flow to fund ongoing
    research and return a profit to investors.


    One clear advantage that the pharmaceutical industry has is a clear view of when
    a patent will expire. Therefore, it knows when a product will be commoditized
    by a generic drug. Therefore, the industry can build very accurate cost models
    that allow it to balance the market'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Pharmaceutical Industry


    will bear with all the operational costs and ensure a positive ROI and acceptable
    operational profit. This ability to predict when the value will be commoditized
    also allows the industry to begin the cycle of reducing operational costs at exactly
    the right time. This overall predictability allows for a very efficient and accurate
    cost model, even if there is a degree of uncertainty in how much research will
    turn into revenue-producing products.


    # Recovering from Commodity


    What will happen when a generic drug becomes available and the market will no
    longer pay a premium price for the drug? The drug company must develop a new business
    model to sustain profitability with this newfound competition. You will note from
    the chart that revenue did not reach zero. There are a number of reasons why there
    is a continued revenue stream:


    +   * Brand awareness for the product by individuals, pharmacies, and doctors

    * Trust in the company delivering the drug

    * Perceived and real quality and consistency of the premium product

    * Adverse effects in some patients of the inert components in the generic drug

    * The belief by some drug companies should continue to be rewarded for their research
    efforts and ongoing contributions through innovation


    The other way to maintain higher revenues for a product is to develop new business
    models or find new applications. For some medicines, this may mean expansion into
    other global regions or combining medications in innovative ways to treat new
    ailments. Recall my earlier discussion on Ranitidine and the brand name Zantac.
    The reason you are probably familiar with Zantac is because GlaxoSmithKline, the
    drug''s creator, developed'
  merge: -1
  pgno: 186
- img_proc: true
  md: '164 Chapter 10 • Value as a Function of Time


    a low-dosage version (Zantac 75) of their product that was approved for over-the-counter
    sale. The industry refers to this scenario as “Rx to OTC (over-the-counter) switch.”
    Through the use of extensive advertising,antac has become a very successful and
    popular antacid treatment for millions of individuals. Even though generic versions
    of Ranitidine are available with a prescription, brand power and a non-prescription
    version continue to provide a revenue source for the drug’s developer.


    This is the type of creative business model evolution that the soft-industry must
    develop to maintain profitability when open source software becomes an alternative
    for customers.


    # Open Source Effect on Software


    What do my stomach ailments have to do with software and open source? While there
    are some key differences, the open source effect on the commercial software industry
    is very similar to the generic drug effect on the pharmaceutical industry. The
    pharmaceutical industry has been dealing with this phenomenon for many years and
    has learned to fine-tune their business models accordingly. This is a new phenomenon
    for software industry and we are all still learning to adapt to the effect.


    Let me take a look at some of the key differences between the two industries.
    A software product usually contains a long list of features and capabilities,
    while a drug is usually a finite compound. It is generally easier to patent an
    invention where the embodiment of invention is a finite compound than it is to
    patent a software product. This is due to the fact that the software patent will
    likely apply to an invention that is embodied in a small subset (or feature) of
    the software product. There are many in the open source community who object entirely
    to the whole notion of software patents. These objections stem from the fact that
    the community freely gives away its IP and expects the same in return. Even if
    a method has been patented, defending such software patent can be expensive. Since
    the software industry is so dynamic and broad, it is not possible to verify that
    absolutely prior art exists when awarding a patent. This means that even if a
    particular software method has been patented, you may find prior art when attempting
    to defend that patent. Software patents also hold for 20 years.


    A generic drug will generally attempt to be identical to the premium product.
    Competing software products, even if the open source, will generally have very
    different models to accomplish the'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Open Source Effect on Software


    task. The end result is that while the drug companies can count on a degree of
    exclusivity for a number of years, it is rare for a software company to maintain
    any exclusivity in a particular product category.


    Predictability is also very different in the two models. While the drug industry
    can build fairly cost models around a predictable product life, the software industry
    never knows when a competitor will provide a better product, or a lower cost alternative.
    The drug industry must still contend with other competitive pressures similar
