    # Training the Engineers


    It is too easy for an engineer to go to the Internet, find useful code, and integrate
    it into your source base. The problem is that unless you educate your engineering
    talent, you may integrate code, such as GPL-licensed code, into your proprietary
    software, such that it affects the proprietary status of your software. Those
    who try to pitch doom-like scenarios will assert that the end result is your entire
    code base must immediately be made available under the same reciprocal license.
    No court has ever required such a drastic measure. The more likely scenario is
    that the offending GPL or other open source code must be removed from your source
    base as soon as it is discovered. However, this can still be an expensive proposition,
    which is why training is critical.


    A greater concern than exposing your IP in an uncontrolled way is having to recall
    a product you have delivered to your customers. Therefore, it is critical that
    your engineers are well-trained on the implications of extracting code from unknown
    sources and clearly understand the implications to your business.


    # Company-Specific Decisions


    As you develop more competence with open source, your company should develop policies
    that cover the appropriate use and methods for integration with open source. Obviously,
    this book is about giving you enough information to recognize the tremendous benefits
    that can come with using open source software. However, even if you decide to
    implement a policy that completely disallows open source'
  merge: -1
