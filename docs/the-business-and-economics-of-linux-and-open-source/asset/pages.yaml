  md: '212 Chapter 13 · Human Resources—Getting Top Talent


    the area you are looking for. Therefore, do not focus so much on overall notoriety
    in the Linux and open source community, but look for respect within the focused
    sub-communities you care about. Contact members of that sub-community and get
    to know who the players are.


    # Community Home


