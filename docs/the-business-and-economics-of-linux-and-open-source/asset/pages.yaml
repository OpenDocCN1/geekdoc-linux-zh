    # Devaluation as a Competitive Advantage


    The key to benefiting from open source is to understand how to take advantage
    of devaluation, and the community rather than to react in a defensive way. Here
    are some examples of defensive reactions to open source:


    +   **Aggressive patent use**—Some companies will respond with patent attacks
    on the open source community. This is not an advisable tactic. Since the community
    has limited resources to defend itself in the courtroom from patent attacks, it
    will usually respond by sustained and aggressive negative public relations attacks.
    In almost all cases, it will be possible to write code that does not infringe
    the patent claim and therefore little will be gained in the end. Unisys started
    to enforce a patent that covered the compression algorithm used for Graphics Interchange
    Format (GIF) files, which were commonly used for images on the Internet. The community
    responded by simply using JPEG or PNG files instead.


    +   **Monolithic software**—Most software today is written as a collection of
    functional layers, each building on another. One open source software developers
    typically begin their projects at the lowest layer in any given software stack.
    By creating monolithic software, vendors hopes to prevent commoditization from
    the bottom of the stack. However, the effect will usually be to have the community
    create a better architected software solution and commoditize the monolithic software
    all at once.


    +   **Competition**—One common reaction is to attempt to compete with the open
    source community. This is usually a knee-jerk reaction that will go away with
    time. Competing against a community of first-rate developers who are not motivated
    by profit or constrained by time is a foolhard exercise. At some point, usually
    sooner than you think, time and resources will make such a move impossible to
    sustain.'
