  md: '# Hiring the Right Person


    If you decide that you need to fill a leadership role, look for someone who has
    previous experience maintaining an open source project. As a maintainer, test
    some of the following leadership characteristics:


    +   - Does he/she recognize and give credit to key contributors?

    - How does he/she resolve conflicts between contributors?

    - Has he/she seen competing projects created as a result of resolving conflict?
    Was it the right outcome?

    - Has he/she been able to attract key contributors to his/her project?

    - Has/she developed release processes?

    - What process do he/she use to determine that a project is ready for release?

