    work with to avoid a competing project?

    * What if a community creates an alternate project with a different strategic
    direction based on your project? What will be your public reaction? Do you care?

    * What if the downloads far exceed your expectations and users cannot get to the
    software? What processes have you developed to handle unexpected loads?


    Always take the time to consider what may go wrong. Do not take a pessimistic
    view of the project; just build smart business contingencies.'
