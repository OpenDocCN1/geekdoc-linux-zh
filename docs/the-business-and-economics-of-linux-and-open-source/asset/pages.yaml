  md: '# 24 Chapter 2 · Linux—Heart of the Operating System


    to make it available. Modules provide a mechanism to extend the functionality
    of the Linux kernel while the system is running.


    The most common way in which modules are used via "device drivers." A device driver
    is the software link between the operating system and a device. In our aircraft
    analogy, think of device drivers as throttle, navigation, and other mechanisms
    that the pilot use to control the plane. Pilots use these controls without worrying
    about the specifics of the engine itself. Device drivers require access to information
    about the current state of the kernel. Device drivers also need to be controlled
    by other kernel modules.


    Most device drivers are written by individual members of a large and disparate
    source development community. Also, it is almost impossible to determine at the
    time a kernel is built all of the different possible device and system configurations
    that will be needed by an end-user. Without modules, every possible device driver
    would need to be compiled into the kernel, potentially significantly increase
    the size (or memory footprint) of the kernel, potentially making the system less
    efficient.


    Since Linux 2.0, modules are extensions that can be bolted into, and unbolted
    from, the operating system at almost any time. Figure 2–4 shows how kernel modules
    fit into Linux.


