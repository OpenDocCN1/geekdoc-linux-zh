    # Data


    Data migration will be an important consideration, especially if your current
    data is shared among many systems in your current environment. Data migration
    will involve storage formats, sharing between systems, and application data. One
    of the first considerations is the Endian byte order used by your current system.


    # Endian


    In Jonathan Swift’s book, Gulliver’s Travels, Swift describes the inhabitants
    of Lilliput who break their eggs on the larger size as BigEndians. We can assume
    that those who break their eggs on the smaller side would be Little-Endians. The
    term “Endian” has been borrowed by the computer industry to refer to a difference
    in byte order used by various computers and operating systems. Endian byte order,
    shown in Figure 8–2, refers to the direction in which bytes of data are stored
    and retrieved by a system. If a system has data using big-Endian byte order, and
    the new system retrieves it in little-Endian byte order, then data corruption
    is assured. Your goal is to prevent this with proper planning.'
