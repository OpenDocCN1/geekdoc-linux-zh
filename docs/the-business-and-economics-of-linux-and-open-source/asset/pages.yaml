- img_proc: true
  md: '# Linux 63


    Since disk storage is relatively slow, all systems use a number of techniques
    to accelerate the availability and storage of information. This acceleration usually
    takes the form of temporary storage of disk information in the main system memory.
    However, if there is a disk failure in the middle of all this activity, the integrity
    of the information on the disk can be compromised. Journaling file systems such
    as JFS, ReiserFS, ext3, and others use a number of sophisticated techniques to
    ensure that storage is not compromised during failures. The other aspect of these
    file systems is that they allow for the very rapid recovery of systems in the
    event of failures.


    With the availability of a number of journaling systems, Linux overcome what many
    considered to be a very significant limitation of the operating system.


    # XFS

    http://oss.sgi.com/projects/xfs/


    XFS is a journaling file system released under the GPL by SGI. All file systems
    will perform with different characteristics depending on the application. The
    XFS file system is generally a good choice when large files are used, and when
    your need is to keep the number of accesses to disk to a minimum to read these
    large files. Visit the XFS home page for details on the features of XFS.


    # ReiserFS

    http://www.namesys.com/


    Hans Reiser is the creator of the ReiserFS file system, a high-performance journaling
    file system available under the GPL. If you recall our discussion on dual-licensing,
    Hans also licenses his file system to commercial operating system vendors. This
    feature may allow you to use the same file system technology and share storage
    between Linux and many other UNIX deployments you might have.


    # Device Support


    It is not possible to list the communities for each and every device out there.
    The best way to find support for your specific device is to check the supported
    device list for your distribution. When we discuss distributions in detail in
    Chapter 5, I will talk more about how distributions provide device support.'
  merge: -1
