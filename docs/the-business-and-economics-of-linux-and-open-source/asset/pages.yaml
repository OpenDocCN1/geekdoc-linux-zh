- img_proc: true
  md: '# Procuring Linux and Open Source Software


    example of procuring the Linux operating system. Here are the most common ways
    to get a copy of Linux:


    +   - Purchase a boxed set from a local supplier

    - Download CD images from the Internet

    - Use a CD included with a book or bundled with another product

    - Use software preloaded or bundled with a computer system or peripheral


    There are similar ways to acquire virtually any open source software, software
    vendors will include open source utilities, tools, and add-on applications with
    their own software.

    Purchasing agents in your organization will likely be trained to acquire and account
    for licenses for any software that is purchased. Left unchecked, it be equally
    likely they be tempted to apply these same processes to open source software.
    However, it is important that your teams be trained to only purchase open source
    software that includes elements your business believes is worth paying for (manuals,
    media, support, etc.).


    In the case where hardware or software vendors bundle open source software, you
    should be aware that you may be paying additional for the bundling. Branded open
    source software usually refers to a marketing arrangement between two companies
    that allows the use of brand and trademark associations between the companies.
    In many instances, the hardware and software vendors will be bundling source components
    that may be available elsewhere at no cost. However, there may be cases where
    the convenience of bundling is worth an additional cost to your money. The point
    is for you to be aware of what you are getting for your money. It is always possible
    to acquire open source software from another source, or to replicate as many copies
    as you need within your organization. There is no need to track licenses in use.


    # Contracts


    If you are a software or hardware vendor, it is typical to require indemnification
    from any vendor whose software you incorporate, or bundle with your own. When
    it comes to open source software, the rules change. Since most open source software
    is written by a collection of individuals, and there can be literally hundreds
    of copyright owners, no one can afford to give you such indemnification.'
