    to maintain good communication throughout the organization.


    # Gated Communities


    I quickly mentioned the notion of “gated communities” a little earlier in the
    chapter. As your culture evolves to welcome and more participants to your development
    community, you will reach a point where your key customers and partners may want
    to join in the actual development process. While you cannot engage in a free-for-all
    that lets external partners modify your system, you can welcome this participation
    in a disciplined fashion.


    Recall the goal of this chapter is to expose you to the bazaar development process,
    not release your code to the public. “Gated communities” is the process of allowing
    customers and partners to engage in the development process, while keeping your
    source code proprietary.


    Why allow customers and partners to participate in the development process? One
    of the key benefits of open source is the responsiveness that the community provides
    to identified problems. In the software world, many large customers frustrated
    at their inability to get specific requests worked on. Some of these requests
    can be as simple as defect repairs, but they can also be sophisticated new feature
    enhancements. Partners are those companies that are dependent on your product
    for their products. Partner involvement also allows you to enhance your product.
    Therefore, your big win in gated communities is innovation that solves needs,
    and an opportunity to be responsive to customer issues by allowing direct involvement
    on their part.


    The process of creating gated communities involves creating a network infrastructure
    that allows external parties access to the source base, but maintains strict security
    and privacy. You also need to build controls that identify the key partners that
    can participate.


    You will need to establish confidential disclosure contracts with your partners.
    If you were able to build your source infrastructure based'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'on open source conventions, you will find that your partners are able to join
    your community very effectively. You will also need to agree on IP ownership for
    any contributions made by your customers and partners. You should avoid situations
    where you cannot control IP. If you ever want to release your code under an open
    source license, you will want to make sure you have as few encumbrances as possible.


    Finally, the next step will involve proper training, and some degree of relationship
    building between the engineers from customers and partners and the key engineers
    within your company.


    # Risks and Issues


    Any new structure involves a degree of imperfection and some risks. This structure
    is no different. First, you need to translate this functional structure into a
    specific organizational structure. The choice of some of your key players will
    have a dramatic effect on the success of this model. In Chapter 13, we will go
    into more detail on the selection process of individuals within this model. There
    is also a transition risk as you attempt to move from whatever your current structure
    is to a migration and new and different model. Ensuring that you have a detailed
    migration plan with detailed communications will be the key to minimizing this
    risk. You will also need to make a choice as the right time in your release cycles
    to start implementing this new style of development. Also, if you use this as
    a guide for some of the key cultural goals, you can start an evolutionary process
    of encouraging open access to source within your organization.


    I mentioned a few times the need to drive an open culture with few restrictions
    within the organization on the access to source code. While this is a requirement
    to apply an open source development model, since you are developing proprietary
    software, you still need to balance this openness with a need to know. You are
    still developing proprietary software, and you need to make sure that your IP
    is not transferred to other companies without your knowledge. The best way to
    manage this risk is to ensure that you have confidentiality agreements with your
    employees, and to never stop the education process to make sure your engineers
    clearly understand what they are doing.


    Probably the biggest risk is the one associated with people management issues.
    Since this structure minimizes the role of direct management within the engineering
    ranks, you will want to ensure that counselors and coaches are readily available
    and that the human resources team is proactive to make sure your engineering talent
    is a top priority.'
