- img_proc: true
  md: '# Employment Contracts


    When you hire engineering talent that has been working within the Linux community
    and hold very strong beliefs about open source and free software, you will likely
    encounter a new request from these employees during the hiring phase. Such a prospective
    employee will be excited about coming to work with a company that is involved
    in open source projects. However, that person may also have very clear expectations
    that the only projects they will ever work on are open source projects. Your company
    needs to develop a clear set of policies governing existing and new employee hires.
    Your new policies should consider the following elements:


    +   Projects—Can a new or existing employee limit or her contributions to open
    source projects? For large companies that know they will have long, sustained
    engagements with the company this may be fine. However, if you expect employees
    to participate in proprietary projects, your policy needs to be clear.


    +   Copyright ownership—As you have learned throughout this book, even open source
    contributions include copyright ownership. Your policy should dictate who is expected
    to own the copyright for contributions by your engineers. It is owned by the company,
    the employee, or both? In most cases, the company should retain the copyright
    ownership (or acceptable license) to be able to implement dual-licensing should
    not arise. There may be cases such as Apache and SAMBA when it will not be possible
    for your company to retain the copyright on contributions. These projects have
    policies that prevent you from retaining copyright ownership.


    +   Personal vs. company time—Many engineers will work on open source projects
    in their spare time. In some cases, the line between company-related work and
    employee hobby will be clear; or it will not. In other cases, what an employee
    starts as a hobby project may evolve into a company-relevant project. You need
    to clearly define when and how your engineers can participate in open source projects
    on their personal time, and define the disclosure rules for your employees. Local
    employment may limit restrictions on your employees.


    +   Competition—Your human resources policy will likely restrict your employees''
    abilities to work with competitors. One of the fundamental benefits of open source
    is that it is best to share the developments and costs with your competitors (within
    the limits of antitrust law). In these cases, your engineers may be actively involved
    with your competitors in development projects.'
  merge: -1
