    for front-end and back-end components. The front-end of a compiler translates
    a high-level language such as C, C++, FORTRAN, or others into an intermediate
    language. The back-end of a compiler does the “heavy lifting." The back-end is
    responsible for taking the intermediate code and performing two primary tasks:
    (1) translation to machine code, and (2) optimization. The translation to machine
    code allows your developed application to run on the target system. It will translate
    in such a that it can run on the target microprocessor architecture as well as
    be compatible with the operating system. Optimization techniques are the subject
    of advanced computer science study and application. Optimization will rearrange
    the code to ensure that it is run in the fastest, most efficient way possible
    by the target processor.


    GCC is a core part of the GNU project. GCC compilers are now in wide use on a
    large variety of operating systems. In fact, many ISVs make the choice to do all
    development using GCC to ensure maximum portability across their myriad of supported
    platforms.


    GCC''s primary design goal has “retargetability." This means that GCC can be effectively
    used to target many disparate systems. However, in'
