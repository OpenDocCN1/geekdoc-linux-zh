    # Summary


    This chapter was a demonstration of the economic impact that open source software
    can have on your product. Your choice in responding to this economic effect can
    be to attack, defensive, or even try to compete. Your best option will always
    be to participate and partner with the community as an opportunity to refocus
    your resources to tasks that will yield much greater value and return to your
    company. IT managers can also benefit from this effect by expanding their available
    resources to accelerate IT projects.


    You also saw that participating actively in the community would allow you to keep
    track of projects, even stalled ones, and plan your business model evolution in
    a more predictable way.


    Now that you can see the economic effects and your best response, it is time to
    understand how your business model can and should evolve. The next chapter goes
    into the detail of business models so that you can take the best possible advantage
    of open source.'
