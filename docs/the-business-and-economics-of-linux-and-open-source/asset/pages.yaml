  md: '# Mozilla


    Much like GNOME established the GNOME Foundation to bring together industry leaders
    to help fund and guide GNOME development, the KDE League was formed to serve a
    similar purpose.


    http://www.mozilla.org/


    Mozilla is an open source Web browser with a core heritage in the Netscape Web
    browser. Mozilla was the original code name for the Netscape product, and when
    Netscape made the decision to open up the Web browser, it returned to that code
    name. The release of Netscape is probably the most significant example of a commercial
    product released under an open source license. The community has learned a bit
    from the release of Mozilla. It took more than a couple of years for Mozilla to
    achieve the reliability and functionality that we were all accustomed to from
    Netscape or Microsoft’s Internet Explorer.


    The release of Mozilla was precipitated by the release of Internet Explorer as
    a no-cost addition to the Windows operating system. It was also the time Eric
    Raymond raised his groundbreaking paper, “The Cathedral and the Bazaar.” Netscape
    became convinced they could use the communal development style that Eric described
    in his paper to further the development of an alternative Web browser. It did
    not quite work out. Netscape made a few mistakes (like releasing code that was
    not fully functional). Part 3 of this book is all about avoiding these and other
    mistakes.


    Mozilla is now among the rank of credible and useful Web browsers available.


