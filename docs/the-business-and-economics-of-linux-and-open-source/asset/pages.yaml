    # Procuring Linux and Open Source Software


    When acquiring traditional software products, your company will likely have established
    a comprehensive process with vendors and suppliers. You negotiate license fees
    based on volume and choose from a few select suppliers, or even a single supplier,
    to keep your overall costs to a minimum. Whether you acquire Linux, Apache, or
    any other open source software, the processes for acquisition are radically different.
    Consider the'
