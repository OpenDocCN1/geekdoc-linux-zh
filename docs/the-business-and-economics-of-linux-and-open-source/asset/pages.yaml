  md: '# Support


    The support model for Linux and open source software can change dramatically from
    your current model, or it can stay relatively static. The good news here is that
    the choice is largely yours. The available support models can be thought of in
    these general categories:


    +   - Commercial by component

    - Integrated end-to-end

    - Self-support with the community


    Since these support models are likely to be very different from your current models,
    it is worth going through each one in detail.


    # Commercial by Component


    This model uses a different commercial vendor for each component of your solution
    stack. The hardware support is delivered by the hardware vendor, the operating
    system by the distribution vendor, the application support by the commercial supplier
    of the open source application, and so on.


    The main advantage to this support model is that if any vendor support in the
    stack does not measure up to your expectations, you can change that component,
    or the support for that component, without necessarily affecting other parts of
    the stack. The other logic to this model is that it delivers best-of-breed support
    for each component of the solution.


    This model can also make a lot of sense for branded or commercialized open solutions
    such as a Linux distribution. For example, if you deploy a Linux distribution
    from one of the major vendors, that vendor will usually be in the best position
    to make changes to the distribution should you encounter any difficulties. In
    some cases, you can take advantage of competitive support offerings for any individual
    component. The same model applies for other branded or commercialized open source
    software products.


    While this model is preferred by many enterprises implementing Linux and open
    source solutions, it can present some disadvantages:


    +   - Solution ownership—Building a support model based on each individual component
    can deliver best-of-breed. However, there are cases when you will encounter difficulties
    and the source of the problem is not obvious. You may find yourself managing conflicts
    between component suppliers.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '+   Component upgrades—Managing each vendor and each support contract means
    that you take ownership for the overall solution working together. If you upgrade
    any one, you can create a situation where another vendor in the stack will refuse
    to support a component. In this model, you should ensure that you have a clear
    articulation from the solution as to what they will support and how they plan
    to manage conflict resolution.


    +   Contract management—This model necessitates that you manage a number of different
