    Once you understand the community(ies) that your candidate is involved in, and
    you believe you have a strong fit with your specific needs, spend time understanding
    how the individual interact with others online. Online interactions will be the
    primary vehicle for communication with others. It is vital that the candidate
    is able to wield influence with others in disparate time zones and cultures. Here
    are some things to look for:'
