  \ |\n\n因此，如果您想创建一个名为 `SALES` 的 MDC 表，以便其数据根据 `CUSTOMER, REGION,` 和 `YEAR` 列中唯一值的组合组织到扩展区（extents），可以执行类似下面的\
  \ `CREATE TABLE` SQL 语句：\n\n![Image](img/226-1.jpg)\n\n上述命令创建了三个维度块索引和一个复合索引，如下：\n\
  \n![Image](img/226-2.jpg)\n\n物化查询表（MQT）是定义在 SQL 语句结果上的表。通常情况下，您使用 MQT 通过在表中存储预先计算的聚合结果来避免重复计算。如果\
  \ DB2 数据库管理器确定 SQL 语句的一部分可以使用 MQT 来解决，则数据库管理器将重写访问计划，代表普通基表使用适当的 MQT 这种访问。这一过程对于应用程序或终端用户来说是完全透明的。\n\
  \n创建和维护 MQT 是一个两步过程。首先，您根据业务逻辑和需求创建一个 MQT，然后是刷新 MQT 数据。如果您想构建一个 MQT 来记录每个 `SALES_DATE`\
  \ 的 `SALES_AMOUNT` 总和，可以执行类似下面的 `CREATE TABLE` 命令：\n\n![Image](img/227-1.jpg)\n\n\
  当您有 `REFRESH DEFERRED` MQT 可用时，尝试将数据库配置参数 `DFT_REFRESH_AGE` 设置为 `ANY`。\n\n如果您在 `SAMPLE`\
  \ 数据库上运行以下 SQL 语句，数据库管理器将尝试使用可用的 MQT 快速向客户端返回数据。您可以使用 Explain 计划来验证这一点：\n\n![Image](img/227-228.jpg)\n\
  \n如果没有匹配的 MQT，DB2 优化器将生成一个 Explain 计划（当然是一个开销较大的）：\n\n![Image](img/228.jpg)\n\n\
  ![Image](img/229.jpg)\n\n![Image](img/230.jpg)\n\n插入时间聚类（ITC）表提供了一种基于插入时间维护数据聚类的有效方法，且空间管理更加简单。ITC\
  \ 表的特征如下：\n\n* ITC 表记录根据其插入时间进行聚类。\n* ITC 表具有与 MDC 表具有相似的特征；它们使用基于块的数据分配和维度块索引。然而，其数据组织方案是基于隐式创建的虚拟维度（记录插入时间），而不是显式声明的维度列。\n\
  * ITC 表通过使用 `CREATE TABLE … ORGANIZE BY INSERT TIME` 子句创建。\n* ITC 表的空间回收可以通过执行 `REORG\
  \ TABLE … RECLAIM EXTENTS` 命令来完成。\n\n如果您想创建 ITC 表 `SALES_ITC`，可以通过执行此命令来实现：\n\n\
