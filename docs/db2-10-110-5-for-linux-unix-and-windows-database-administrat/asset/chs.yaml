  \ `COMMIT_AFTER_N_ROWS`：\n\n![Image](img/672-1.jpg)\n\n**步骤 3:** 带有剩余阶段调用 `ADMIN_MOVE_TABLE`\
  \ 以完成复制：\n\n![Image](img/672-2.jpg)\n\n# SYSPROC.ADMIN_COPY_SCHEMA() 过程\n\n通过 `ADMIN_COPY_SCHEMA()`\
  \ 过程，你可以将特定的数据库模式及其关联对象复制到新的目标模式，使用与源模式相同的对象名称，但带有目标模式限定符。复制模式过程的语法如下：\n\n![Image](img/672-3.jpg)\n\
  \n| 其中： | |\n| :--- | :--- |\n| `SourceSchema` | 指定要复制的对象的模式名称 |\n| `TargetSchema`\
  \ | 指定用于创建复制对象的唯一模式名称；你不能指定已存在的模式作为目标模式 |\n| `CopyMode` | 指定复制操作的模式，有效选项有：• `DDL`\
  \ 从源模式创建所有支持对象的空副本。• `COPY` 从源模式创建所有支持对象的空副本，并使用 `NONRECOVERABLE` 子句加载数据。• `COPYNO`\
  \ 类似于 `COPY` 选项类似，但它会调用带有 `COPYNO` 子句的 `LOAD` 命令。 |\n| `ObjectOwner` | 指定用作复制对象所有者的授权\
  \ ID |\n| `SourceTBSP` | 指定用于复制的源表空间列表，用逗号分隔 |\n| `TargetTBSP` | 指定用于复制的目标表空间列表，用逗号分隔\
  \ |\n| `ErrorTableSchema` | 指定包含无法复制对象的错误信息的表模式名称 |\n| `ErrorTable` | 指定包含无法复制对象的错误信息的表名称\
  \ |\n\n要将模式 `MOHAN` 中的所有表复制到 `MILAN`，你可以遵循以下简单步骤：\n\n**步骤 1:** 列出 `MOHAN` 模式中的可用表：\n\
  \n![Image](img/673.jpg)\n\n**步骤 2:** 调用过程 `ADMIN_COPY_SCHEMA()` 复制所有模式对象：\n\n![Image](img/674-1.jpg)\n\
  \n**步骤 3:** 通过列出新模式 `MILAN` 中的表来验证复制结果：\n\n![Image](img/674-2.jpg)\n\n# 使用 db2relocatedb\
  \ 迁移数据库\n\nrelocate database 命令对于重命名数据库或重新定位数据库表空间容器或数据库日志目录非常方便。在运行 `db2relocatedb`\
  \ 命令修改元数据和关联控制文件之前，必须先激活目标数据库。\n\n命令语法为：\n\n![Image](img/674-3.jpg)\n\n| 其中： |\n\
  | :--- |\n| `ConfigFileName` | 指定包含数据库迁移所需的配置信息的文件 |\n\n`db2relocatedb` 命令本质上允许你更改各种数据库特性，包括：\n\
  \n* 数据库名称\n* 数据库路径\n* 与数据库关联的实例\n* DPF 环境中的每个节点数据库名称\n* 与数据库关联的活动日志路径 (`newlogpath`)\n\
  * 表空间的容器路径\n* 数据库的存储路径\n* 故障归档日志路径 (`failarchpath`)\n* 与数据库关联的归档日志路径 (`logarchmenth1`)\n\
