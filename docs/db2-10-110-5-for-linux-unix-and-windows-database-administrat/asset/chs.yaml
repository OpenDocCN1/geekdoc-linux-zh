  \ RECREATE TABLESPACES (USER_TMPTS)` 重启数据库。 |\n\n### Question 4\n\n使用哪种恢复操作来重新应用已提交但尚未外部化到存储的事务、回滚已外部化到存储但尚未提交的事务，并从内存中清除既未提交也没有外部化到存储的事务？\n\
