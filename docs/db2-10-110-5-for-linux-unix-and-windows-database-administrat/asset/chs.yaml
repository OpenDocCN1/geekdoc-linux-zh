  \ 50001/tcp`。 |\n| ![images](img/circ.jpg) | C. | 在 DCS 目录中编入数据库 `SAMPLE`。 |\n|\
  \ ![images](img/circ.jpg) | D. | 在 UNIX 服务器的 services 文件中添加项 `DB2_db2inst1_0 10.205.15.100`。\
  \ |\n\n### 问题 13\n数据库管理员正尝试从 Linux、UNIX 和 Windows 服务器编入 DB2 for z/OS 服务器。管理员使用的通信协议是\
  \ TCP/IP。如果管理员无法连接到 DB2 for z/OS 服务器上的数据库，他应该做什么？\n\n| ![images](img/circ.jpg) |\
  \ A. | Ping 通 DB2 for z/OS 数据库所在的服务器，并验证服务器是否已正确编入。 |\n| ![images](img/circ.jpg)\
  \ | B. | 验证服务器上的进程 `db2tcpcm` 正在运行，且服务器是否已正确编入。 |\n| ![images](img/circ.jpg) | C.\
  \ | 验证分布式数据设施 (DDF) 正在运行，且服务器是否已正确编入。 |\n| ![images](img/circ.jpg) | D. | 验证分布式连接设施\
  \ (DCF) 正在运行，且服务器是否已正确编入。 |\n\n### 问题 14\n从 Linux、UNIX 和 Windows 服务器到 DB2 for z/OS\
  \ 数据库建立 TCP/IP 连接时，以下各项中*不*需要的是哪两项？\n\n| ![images](img/box.jpg) | A. | 主机名 |\n|\
  \ ![images](img/box.jpg) | B. | 端口号 |\n| ![![images](img/box.jpg) | C. | 数据库名（目标和本地）\
  \ |\n| ![images](img/box.jpg) | D. | 子系统 ID |\n| ![images](img/box.jpg) | E. | 逻辑单元\
  \ (LU) |\n\n### 问题 15\n轻量级目录协议 (LDAP) 支持哪两种服务器方法？\n\n| ![images](img/box.jpg) |\
  \ A. | CLIENT |\n| ![images](img/box.jpg) | B. | SERVER |\n| ![images](img/box.jpg)\
  \ | C. | KERBEROS |\n| ![images](img/box.jpg) | D. | DATA_ENCRYPT |\n| ![images](img/box.jpg)\
  \ | E. | KERBEROS_PLUGIN |\n\n### 问题 16\n你使用哪个 DB2 注册表来配置你的实例使用 LDAP？\n\n| ![images](img/circ.jpg)\
  \ | A. | `DB2AUTH` |\n| ![images](img/circ.jpg) | B. | `DB2LDAP` |\n| ![images](img/circ.jpg)\
  \ | C. | `DB2CACHE` |\n| ![images](img/circ.jpg) | D. | `AUTHENTICATION` |\n\n\n\
  \n\n正确答案为 `B` 和 `C.`。`db2ubind.lst` 文件包含了创建 DB2 数据库实用程序包所需的绑定文件（`.bnd`）列表；`db2cli.lst`\
  \ 文件包含了创建 DB2 节点级别接口 (CLI) 和 DB2 ODBC 驱动程序包所需的绑定文件（`.bnd`）列表。当你执行这两个命令时，Bind 实用程序产生的所有消息将写入名为\
  \ `bind.msg` 的文件中，并且 `PUBLIC` 组将获得每个生成包的 `EXECUTE` 和 `BINDADD` 权限。\n\n`db2schema.bnd`\
  \ 绑定文件用于创建一个提供系统目录函数支持的包，通常与 DB2 Connect 一起使用。\n\n### 问题 3\n\n正确答案为 `D.`。要在客户端和服务器系统之间建立连接，必须通过网络传输数据包。行业标准通信协议是\
  \ `TCP/IP` 版本 4 和版本 6。\n\n进程间通信 (`IPC`) 不支持跨网络的数据移动；但是，它支持系统内部进程之间的数据流。回环连接（loopback\
  \ connection）是对本地数据库建立连接，就像它是远程数据库一样。这基本上用于故障排除连接性问题。编编回环节点和数据库的命令语法为：\n\n![Image](img/978-3.jpg)\n\
  \n建议你运行与 DB2 服务器版本相同的 DB2 客户端版本，以避免客户端驱动程序和服务器之间的功能问题。\n\n### 问题 4\n\n正确答案为 `B`\
  \ 和 `D.`。如果你将 `discover_inst` DB2 数据库管理器配置参数设置为 `ENABLE`，则在响应搜索和已知发现请求时，都会返回有关相应实例的信息。如果你将\
  \ `discover_db` 数据库配置参数设置为 `ENABLE`，则在响应搜索和已知发现请求时，都会返回有关相应数据库的信息。DB2 数据库管理器配置参数通过执行命令\
  \ `UPDATE DBM CFG *[Parameter] [Value];` 来设置，数据库配置参数通过执行命令 `UPDATE DB CFG FOR [DBAlias]\
  \ USING *[Parameter] [Value].` 来设置。\n\n### 问题 5\n\n正确答案为 `D.`。如果你将实例 `DB2INST1`\
  \ 的 DB2 数据库管理器配置参数 `discover_inst` 设置为 `DISABLE`，则在响应 DB2 发现请求时将不会返回有关该实例和数据库的信息。如果你将\
  \ `discover_db` 数据库配置参数设置为 `DISABLE`，则在响应 DB2 发现请求时将不会返回数据库；但是它会返回实例信息。`discover`\
  \ DB2 管理服务器参数必须在服务器级别设置，而不是客户端级别。\n\n### 问题 6\n\n正确答案为 `C.`。如果你将 `discover_db` 数据库配置参数设置为\
  \ `DISABLE`，则在响应 DB2 发现请求时将不会返回相应数据库的信息。如果你将数据库所在的实例的 `discover_inst` DB2 数据库管理器配置参数已设置为\
  \ `DISABLE`，则不需要此操作。如果你将 `discover_inst` DB2 数据库管理器配置参数设置为 `DISABLE`，则在响应 DB2 发现请求时将不会返回相应实例的信息。\n\
  \n### 问题 7\n\n正确答案为 `D.`。要与服务器通信，每个客户端必须使用服务器识别的某种通信协议。同样，每个服务器都必须使用某种通信协议来检测来自客户端的入站请求。客户端和服务器都必须配置为使用\
  \ DB2 识别的通信协议。\n\n每当你手动为服务器配置通信时，在实例开始使用所需的通信协议之前，你必须更新 `DB2COMM` 注册变量的值。你分配给 `DB2COMM`\
  \ 注册变量的值将决定在特定实例启动时激活哪些通信管理器。（错误设置 `DB2COMM` 注册变量可能会在 DB2 实例初始化期间启动协议支持时产生一个或多个错误。）\n\
  \n当你为服务器配置通信后，任何想要访问服务器上数据库的客户端必须在客户端的系统数据库和节点目录中包含针对服务器和远程数据库的额外条目。（如果客户端打算通过 DB2\
  \ Connect 连接到 System z 或 System i 数据库，还必须向 `DCS` 目录添加条目。）条目是通过一种称为 `cataloging`（编编）的过程添加到\
  \ DB2 目录中的。\n\n在例例中，由于 HR 部门的其他所有人都能连接到 `PAYROLL` 数据库，因此在服务器上必须正确设置 `DB2COMM` 注册变量。`PAYROLL`\
  \ 数据库在服务器上的编编方式也是如此——因为其他人都可以连接到该数据库，所以数据库必须正确编编。客户端上分配给 `DB2COMM` 注册变量的值没有影响，因为节点目录条目指定了连接到服务器所需的通信协议和端口号。所以，那也不是问题。因此，问题可能是服务器（节点）或数据库在客户端上的编编不正确。\n\
  \n### 问题 8\n\n正确答案为 `A.`。要与服务器通信，每个客户端必须使用服务器识别的某种通信协议。同样，每个服务器都必须使用某种通信协议来检测来自客户端的入站请求。客户端和服务器都必须配置为使用\
  \ DB2 识别的通信协议。\n\n每当你手动为服务器配置通信时，在实例开始使用所需的通信协议之前，你必须更新 `DB2COMM` 注册变量的值。你分配给 `DB2COMM`\
  \ 注册变量的值将决定在特定实例启动时激活哪些通信管理器。\n\n在例中，由于 HR 部门的每个人都无法连接到 `PAYROLL` 数据库，问题最有可能是 `DB2COMM`\
  \ 注册变量没有被分配值 `TCPIP`。\n\n### 问题 9\n\n正确答案为 `A` 和 `B.`。要处理发现请求，DB2 Discovery 可以使用两种方法之一：搜索或已知。当你使用搜索发现方法时，会在整个网络中搜索有效的\
  \ DB2 服务器和数据库，并向客户端返回找到的所有服务器、实例和数据库的列表，以及编编和连接到每一个项所需的通信信息。相比之下，当你使用已知发现方法时，将使用特定的通信协议在网络中搜索特定的服务器。（因为客户端知道服务器的名称和该服务器使用的通信协议，所以该服务器对于客户端是“已知的”。）再次，当找到指定的服务器时，将向客户端返回服务器上找到的所有实例和数据库的列表，以及编编和连接到每一个项所需的信息。\n\
  \n### 问题 10\n\n\n\n\n正确答案是 **D.**。要从客户端工作站访问远程数据库，你必须在客户端和服务器的系统数据库目录中对数据库进行目录，并且必须在客户端的节点目录中对服务器服务器进行目录。（节点目录中的条目告诉\
  \ DB2 数据库管理器如何连接到服务器以访问存储在服务器上的数据库。）因为连接 DRDA 主机数据库所需的信息与连接局域网数据库使用的信息不同，有关远程主机或\
  \ System i 数据库的信息存储在名为 `Database Connection Services (DCS)` 目录的特殊目录中。如果 DCS 目录中的条目的数据库名称与系统数据库目录中存储的数据库名称对应，则指定的应用程序请求者（大多数情况下是\
  \ DB2 Connect）就可以将 SQL 请求转发到位于远程 DRDA 服务器上的数据库。如果 DCS 目录中不存在 System z 或 System i\
  \ 数据库的记录，则无法建立数据库连接。\n\n### Question 11\n\n正确答案是 **B.**。你通过执行 `CATALOG DCS DATABASE`\
  \ 命令来目录 DCS 数据库。\n\n该命令的语法为：\n\n![Image](img/981-1.jpg)\n\n| 何处: |\n\n| `Alias`\
  \ | 识别要目录的目标数据库的别名；此名称必须与系统数据库目录中关联远程节点的条目匹配 |\n| `TargetName` | 识别要目录的目标主机数据库的名称（如果要目录的主机数据库位于\
  \ OS/390 或 z/OS 服务器上，请指定 `TargetName` 以引用通过其 `LOCATION NAME` 标识的 DB2 for z/OS 子系统，或\
  \ z/OS 服务器上定义的别名 `LOCATION` 名称之一；要确定 `LOCATION NAME`，请登录 TSO 并使用可用的查询工具之一执行以下 SQL\
  \ 查询：`SELECT CURRENT SERVER FROM SYSIBM.SYSDUMMY1`） |\n| `LibraryName` | 识别要加载并用于访问\
  \ DCS 目录中列出的远程数据库的应用程序请求库名称 |\n| `ParameterString` | 识别在调用应用程序请求者时传递的参数字符串；你必须将参数字符串包含在双引号中\
  \ |\n| `Description` | 描述在 DCS 目录中为要目录的数据库创建的数据库条目的注释；你必须将描述包含在双引号中 |\n\n因此，如果你想目录一个位于\
  \ z/OS 服务器上 `DSN_DB_1` 子系统中的、名为 `PAYROLL_DB` 的 DB2 for z/OS 数据库，并为其分配别名 `PAYROLL`，你将执行类似下面的\
  \ `CATALOG DCS DATABASE` 命令：\n\n![Image](img/981-2.jpg)\n\n### Question 12\n\n正确答案是\
  \ **B.**。如果你想配置服务器使用 TCP/IP，你将执行以下步骤（顺序任意）：\n\n### Step 1: 为 `DB2COMM` 注册表变量分配值\
  \ `TCPIP`。\n\n你通过执行类似下面的 `db2set` 命令为 `DB2COMM` 注册表变量分配 `TCPIP`：\n\n![Image](img/981-3.jpg)\n\
  \n### Step 2: 将数据库服务器用于接收来自远程客户端通信的 TCP/IP 端口名称分配给 DB2 数据库管理器配置文件的 `svcename` 参数。你通过执行类似下面的\
  \ `UPDATE DATABASE MANAGER CONFIGURATION` 命令来设置此参数：\n\n![Image](img/982-1.jpg)\n\
  \n### Step 3: 如果适当，更新数据库服务器上的服务文件。\n\nTCP/IP 服务文件标识了服务器应用程序监听客户端请求的端口。如果你在 DB2 数据库管理器配置文件的\
  \ `svcename` 参数中指定了服务名称，则必须在服务器上的服务文件中添加相应的服务名称到端口号/协议的映射。如果你在 `svcename` 参数中指定了端口号，则不需要更新服务文件。\n\
  \n服务文件的默认位置取决于所使用的操作系统：在 UNIX 系统上，服务文件名为 `services` 并位于 `/etc` 目录；在 Windows 系统上，服务文件位于\
  \ `%SystemRoot%\\system32\\drivers\\etc`。DB2 在服务文件中的条目可能如下所示：\n\n![Image](img/982-2.jpg)\n\
  \n在你配置好服务器通信后，任何想要访问服务器上数据库的客户端都必须在客户端的系统数据库目录和节点目录中包含针对服务器和远程数据库的额外条目。\n\n在此示例中，由于服务器和数据库在\
  \ Windows 客户端上正确地进行了目录处理，问题最可能的原因是 UNIX 服务器上的服务文件缺少了 DB2 服务名称和端口的条目。\n\n### Question\
  \ 13\n\n正确答案是 **C.**。一旦你配置了服务器进行通信，任何想要访问服务器上数据库的客户端都必须配置为与服务器进行通信。要使用 TCP/IP 目录远程服务器，你必须提供\
  \ TCP/IP 网络已知的主机名。（这是你正尝试通信的远程数据库所在的服务器的名称。）当你目录 DB2 for z/OS 远程服务器时，当 DDF 启动时，主机将出现在\
  \ `DSNL004I` 消息（`DOMAIN=hostname`）中——前提目标数据库已设置为用于 TCP/IP 通信；与 z/OS 服务器上的 DB2 进行\
  \ TCP/IP 通信需要 DDF。\n\n### Question 14\n\n正确答案是 **D** 和 **E**。任何想要访问服务器上数据库的客户端都必须配置为与服务器进行通信。这只是第一步。你必须在客户端的系统数据库和节点目录中添加针对服务器和远程数据库的条目。你通过一种名为*目录*的过程在\
  \ DB2 目录中添加条目。\n\n要显式地目录远程服务器，你执行与要访问的服务器对应的 `CATALOG ... NODE` 命令。\n\n要目录数据库，你执行\
  \ `CATALOG DATABASE` 命令。`CATALOG NODE` 命令的语法为：\n\n![Image](img/983-1.jpg)\n\n| 何处:\
  \ |\n\n| `NodeName` | 识别分配给要目录节点的别名；这是在工作站上创建的任意名称，用于识别节点 |\n| `IPAddress` | 识别正尝试通信的远程数据库所在的服务器\
  \ IP 地址 |\n| `HostName` | TCP/IP 网络已主机主机（这是你正尝试通信的远程数据库所在的服务器的名称） |\n| `ServiceName`\
  \ | 标识服务器数据库管理器实例用于通信的服务名称 |\n| `PortNumber` | 标识服务器数据库管理器实例用于通信的端口号 |\n| `InstanceName`\
  \ | 识别要连接的服务器实例名称 |\n| `SystemName` | 标识标识服务器的 DB2 系统名称 |\n| `SystemType` | 标识服务器上使用的操作系统类型；此参数的有效值为\
  \ AIX, WIN, HPUX, SUN, OS390, OS400, VM, VSE 和 LINUX。 |\n| `Description` | 指定在节点目录中为要目录的节点条目创建的注释；你必须将描述包含在双引号中\
