  \ 身份执行 `ssh MEMSERVER4`。\n\n**步骤 3：** 将 DB2 安装包放置在服务器 `MEMSERVER4` 和 `MEMSERVER5`\
  \ 上，并在每个服务器上执行 `db2setup –r <response file>`。\n\n**步骤 4：** 运行此命令验证集群软件的同质状态：\n\n\
