  \ | 分隔 ASCII (DEL) |\n| `nochardel` | 指示不使用字符分隔符包围列数据——如果数据意图使用 DB2 导入或加载，则不应指定此选项；提供此选项是为了支持没有字符分隔符的供应商数据文件，使用不当可能导致数据丢失或损坏——此选项不能与\
