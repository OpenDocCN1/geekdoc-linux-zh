  \ 的能力：\n\n![Image](img/869-3.jpg)\n\n## 授予和撤销权限与权利的要求\n\n授权级别和权限不仅控制用户可以做什么和不能做什么，还控制用户被允许授予和撤销哪些权限和权利。表\
  \ 8.1 列出了具有特定权限级别或权限的用户被允许授予和撤销的权限和权利。\n\n| **表 8.1：授予和撤销权限与权利的要求** |\n| **如果用户持有…**\
  \ | **用户可以授予…** | **用户可以撤销…** |\n| `SYSADM authority` | `SYSCTRL authority` `SYSMAINT\
  \ authority` `SYSMON authority` `DBADM authority` `SECADM authority` `LOAD authority`\
  \ 任何数据库权限 任何对象权限，包括 `CONTROL` 权限 | `SYSCTRL authority` `SYSMAINT authority` `SYSMON\
  \ authority` `DBADM authority` `SECADM authority` `LOAD authority` 任何数据库权限 任何对象权限，包括\
  \ `CONTROL` 权限 |\n| `SYSCTRL authority` | USE 表空间权限 | USE 表空间权限 |\n| `SYSMAINT authority`\
  \ | 无权限或权利 | 无权限或权利 |\n| `SYSMON authority` | 无权限或权利 | 无权限或权利 |\n| `DBADM authority`\
  \ | 任何数据库权限 任何对象权限，包括 `CONTROL` 权限 | 任何数据库权限 任何对象权限，包括 `CONTROL` 权限 |\n| `SECADM\
  \ authority` | `DBADM authority` `SQLADM authority` `WLMADM authority` `EXPLAIN\
  \ authority` `ACCESSCTRL authority` `DATAACCESS authority` | `DBADM authority` `SQLADM\
  \ authority` `WLMADM authority` `EXPLAIN authority` `ACCESSCTRL authority` `DATAACCESS\
  \ authority` |\n\n\n\n\n\n| SQLADM 权限 | 无权限或特权 | 无权限或特权 |\n| :--- | :--- | :---\
  \ |\n| WLMADM 权限 | 无权限或特权 | 无权限或特权 |\n| EXPLAIN 权限 | 无权限或特权 | 无权限或特权 |\n| ACCESSCTRL\
  \ 权限 | `SQLADM authority`、`WLMADM authority`、`EXPLAIN authority`、系统目录表的 `SELECT`\
  \ 权限 | |\n| 表、表空间、视图、索引、别名、包、程序、模式、序列、服务器、全局变量和 XSR 对象的所有权限 | `SQLADM authority`、`WLMADM\
  \ authority`、`EXPLAIN authority`、系统目录表的 `SELECT` 权限 | 表、表空间、视图、索引、别名、包、程序、模式、序列、服务器、全局变量和\
  \ XSR 对象的所有权限 | |\n| DATAACCESS 权限 | 无权限或特权 | 无权限或特权 |\n| LOAD 权限 | 无权限或特权 | 无权限或特权\
  \ |\n| 对对象具有 `CONTROL` 特权（但无其他权限） | 对用户持有 `CONTROL` 特权的对象拥有其所有可用权限（`CONTROL` 特权除外）\
  \ | 对用户持有 `CONTROL` 特权的对象拥有其所有可用权限（`CONTROL` 特权除外） |\n| 使用指定的 `WITH GRANT OPTION`\
  \ 选项分配的对象的权限 | 使用指定的 `WITH GRANT OPTION` 选项分配的相同对象权限 | 无权限或特权 |\n\n## 执行常见任务所需的权限和特权\n\
  \n到为止，我们已经识别了可用的权限和特权，并检查了如何授予和撤销这些权限和特权。但要有效使用权限和特权，你必须确定哪些权限和特权适用于个人用户，哪些不适用。通常，根据个人的职位名称和工作职责分配一套通用的权限和特权。然后，当该个人开始操作数据库时，你可以根据情况修改其拥有的权限和特权。表\
  \ 8.2 列出了一些常用的职位名称、相应的任务以及执行这些任务所需的权限和特权。\n\n### 表 8.2：常用职位名称、任务、权限和特权\n\n| 职位名称\
  \ | 任务 | 所需权限/特权 |\n| :--- | :--- | :--- |\n| 部门管理员 | 管理部门系统；设计并创建数据库 | `SYSCTRL`\
  \ 权限或 `SYSADM` 权限（如果部门拥有实例） |\n| 安全管理员 | 向其他用户授予权限并在必要时撤销这些权限 | `SYSADM` 权限或 `DBADM`\
  \ 权限（如果使用基于标签的访问控制） |\n| 数据库管理员 | 设计、开发、操作、保护和维护一个或多个数据库 | 数据库的 `DBADM` 权限和 `SYSMAINT`\
  \ 权限，或者某些情况下对 `SYSCTRL` 权限 |\n| 系统操作员 | 监控数据库并在需要时执行备份操作 | `SYSMAINT` 权限或 `MON`\
  \ |\n| 应用开发人员/程序员 | 开发并测试数据库管理程序；可能还会创建表并填充数据 | 多个数据库的 `CONNECT` 和 `CREATE TABLE`\
  \ 权限，多个包的 `BINDADD` 和 `BIND` 权限，多个模式的模式权限，以及多个表的权限；可能还需要多个数据库的 `CREATE EXTERNAL\
  \ ROUTINE` 权限 |\n| 用户分析师 | 通过检查系统目录视图定义应用程序的数据需求 | 多个数据库的 `CONNECT` 权限以及系统目录视图的\
  \ `SELECT` 权限 |\n| 终端用户 | 执行多个应用程序 | 多个数据库的 `CONNECT` 权限以及每个应用程序包 `EXECUTE` 权限；如果应用程序包含动态\
  \ SQL 语句，可能还需要多个表的 `SELECT`、`INSERT`、`UPDATE` 和 `DELETE` 权限 |\n| 信息中心顾问 | 定义查询用户的数据需求；通过创建表和视图并授予多个数据库对象的访问权限\
  \ | 多个数据库的 `DBADM` 权限 |\n| 应用用户 | 执行程序、函数和模块；对应用程序执行多个插入、更新、删除操作 | 多个数据库的 `DATAACCESS`\
  \ 权限 |\n| 查询用户 | 发布 SQL 语句（通常来自 CLP）来检索、添加、更新或删除数据（可能在表中保存查询结果） | 多个数据库的 `CONNECT`\
  \ 权限；每个使用表的 `SELECT`、`INSERT`、`UPDATE` 和 `DELETE` 权限；以及创建表和视图所需的 `CREATE` 权限 |\n\
  \n## 基于角色的访问控制\n\n最近，基于角色的安全已成为保护组织信息资产的首选方式。在这种访问控制机制中，你将权限授予角色，而不是直接授予用户 ID。角色是一个将多个特权组合在一起的数据库对象，可以分配给用户、组、`PUBLIC`或其他角色。\n\
  \n如果你想创建一个名为 `TESTER` 的角色，可以使用如下 `CREATE ROLE` 命令：\n\n![Image](img/872-1.jpg)\n\n\
  你可以在数据库内授予的所有 DB2 特权和权限也可以授予角色。例如，可以向角色授予以下任何权限和特权：\n\n*   数据库权限，包括 `DBADM`、`SECADM`、`DATAACCESS`、`ACCESSCTRL`、`SQLADM`、`WLMADM`、`LOAD`、`IMPLICIT\
  \ SCHEMA`、`CONNECT`、`CREATE TABLE`、`CREATE NOT FENCED`、`BINDADD`、`CREATE EXTERNAL\
  \ ROUTINE` 和 `QUIESCE CONNECT`\n*   任何数据库对象权限，包括 `SELECT`、`INSERT`、`UPDATE`、`DELETE`、`CONTROL`、`EXECUTE`\
  \ 和 `USE`\n\n一旦创建了角色，你可以使用 `GRANT` 命令为角色关联一组特权：\n\n![Image](img/872-2.jpg)\n\n创建角色后，安全管理员可以将角色授予用户、组或另一个角色。此外，安全管理员可以使用\
  \ `WITH ADMIN OPTION` 子句将角色成员的管理权委托给授权 ID。`GRANT ROLE` 命令的基本语法为：\n\n![Image](img/872-3.jpg)\n\
  \n| 要求： | |\n| :--- | :--- |\n| `RoleName` | 要授予的角色名称 |\n| `AuthorizationID` | 多个用户、组或角色的授权\
  \ ID 列表；但是，授权 ID 不能向自身授予权限或权限 |\n\n要将 `TESTER` 角色的成员管理权委托给 `SIMON`，请执行 `GRANT` 命令：\n\
  \n![Image](img/873-1.jpg)\n\n同样，你可以使用 `REVOKE` 命令从用户、组或另一个角色处撤销角色。`REVOKE ROLE`\
  \ 命令的基本语法为：\n\n![Image](img/873-2.jpg)\n\n| 要求： | |\n| :--- | :--- |\n| `RoleName`\
  \ | 要撤销的角色名称 |\n| `AuthorizationID` | 多个用户、组或角色的授权 ID 列表 |\n\n例如，如果你想从用户 `SIMON`\
  \ 处撤销 `TESTER` 角色，请执行 `REVOKE` 命令：\n\n![Image](img/873-3.jpg)\n\n## 角色与组的比较\n\n\
  角色和操作系统组的功能方式相似，差异相似，如表 8.3 所示。\n\n### 表 8.3：角色与组的比较\n\n| 角色 | 组 |\n| :--- | :---\
  \ |\n\n\n\n\n\n| 它是权限的集合，当将角色授予用户时，用户实际上也继承了这些权限。 | 它是用户的集合，该组拥有一组给定的权限。 |\n| 它由\
  \ `SYSADM` 或 `SECADM` 用户在数据库引擎内部创建和管理。 | 它由操作系统管理员或 AD 管理员在操作系统引擎内或 LDAP 中创建和管理。\
  \ |\n| 在创建视图、MQT、SQL 过程、触发器和包含静态 SQL 的包时，会考虑授予角色的权限和授权。 | 在创建视图、MQT、SQL 过程、触发器和包含静态\
  \ SQL 的包时，不考虑授予组的权限和授权。 |\n| 角色不能拥有数据库对象。 | 组不能拥有数据库对象。 |\n| 角色不能用于授予如 `SYSADM`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON` 等实例级权限。 | 组可以用于授予如 `SYSADM`、`SYSCTRL`、`SYSMAINT` 和 `SYSMON` 等实例级权限。\
  \ |\n| 可以通过在 `GRANT ROLE` 命令中使用 `WITH ADMIN OPTION` 子句来委托角色维护。 | 组的维护只能通过具有 `UNIX`\
  \ 权限的用户完成。 |\n\n## 关于数据加密的说明\n\n如今的大多数法规和标准很大程度上关注存储级别、事务执行期间以及在网络传输过程中对私有数据的保护。在组织中实施良好的数据保护策略可能是一项艰巨的任务。然而，表\
  \ 8.4 中的全球法规和标准正在使有效实施数据保护策略变得更容易。\n\n### 表 8.4：全球法规和标准\n\n| 法规/标准 | 关注点 |\n| :---\
  \ | :--- |\n| 支付行业数据安全标准 (DSS) | 处理、传输和存储期间对支付卡信息的保护 |\n| 格拉姆-莱奇-布莱法案 (GLBA) | 金融行业私有数据的保护\
  \ |\n| 萨班斯-奥克斯法案 (SOX) | 公共公司与财务报告相关的私有数据的保护 |\n| 健康保险流动性与责任法 (HIPAA) | 与患者健康相关的私有数据的保护\
  \ |\n| 1984 年数据保护法 (DPA) | 英国个人信息的保护 |\n| 个人信息保护和电子文件法案 (PIPEDA) | 加拿大个人信息的保护 |\n\
  \nDB2 10.1 支持不同级别的数据加密——磁盘级别以及数据通过网络传输时。\n\n你可以使用内置加密函数对数据库表中的磁盘级数据进行加密，并在显示数据时使用\
  \ `decrypt` 内置函数。请记住，只有 `CHAR`、`VARCHAR` 和 `FOR BIT DATA` 可以使用这些函数进行加密。表 8.5 列出了关于这些加密内置加密函数的更多信息。\n\
  \n### 表 8.5：加密和解密内置标量函数\n\n| 内置函数名称 | 描述 | 基础命令语法 |\n| :--- | :--- | :--- |\n| `ENCRYPT`\
  \ | 该标量函数使用基于密码的加密方法对数据进行加密。它还接受密码提示作为参数，帮助数据所有者记住密码。一旦数据加密，解密的唯一方法是使用正确的密码。 | `ENCRYPT\
  \ (<DataStringExp>, <PasswordStringExp>, <PasswordHintExp>)` 其中：• DataStringExp\
  \ 标识需要加密的数据。• PasswordStringExp 标识用于加密数据的密码。• PasswordHintExp 标识帮助数据所有者记住密码的提示。\
  \ |\n| `DECRYPT_CHAR` | 该标量函数解密使用 `ENCRYPT` 函数加密的数据，它始终返回 `VARCHAR` 数据。 | `DECRYPT_CHAR(<EncryptedData>,\
  \ <PasswordStringExp>)` 其中：• EncryptedData 标识需要解密的数据。• PasswordStringExp 标识加密数据时使用的密码。\
  \ |\n| `DECRYPT_BIN` | 该标量函数解密使用 `ENCRYPT` 函数加密的非结构化数据（如图像），它始终返回 `VARCHAR FOR BIT\
  \ DATA`。 | `DECRYPT_BIN(<EncryptedData>, <PasswordStringExp>)` 其中：• EncryptedData\
  \ 标识需要解密的数据。• PasswordStringExp 标识加密数据时使用的密码。 |\n| `GETHINT` | 该标量函数返回封装的密码提示，帮助数据所有者在忘记密码时记住密码。\
  \ | `GETHINT(<EncryptedData>)` 其中：• EncryptedData 标识需要查找密码提示的数据。 |\n\n使用 `ENCRYPT`\
  \ 标量函数在存储级别加密数据有两种实现级别：*列级*和*行-列级*。列级加密使用 `ENCRYPTION PASSWORD` 特殊寄存器中指定的密码对给定列的数据进行加密。\n\
  \n始终建议对表中的所有行使用同一个公共密码，如下所示：\n\n![Image](img/876-877.jpg)\n\n如果你尝试设置一个与之前设置不同的密码，你将收到类似这样的错误：\n\
  \n![Image](img/877.jpg)\n\n与列级加密不同，如果你想使用许多不同的密码来加密数据，请使用行-列级加密，如下所示：\n\n![Image](img/877-878.jpg)\n\
  \n要对网络上的传输数据进行加密，可以使用 `DATA_ENCRYPT` 身份验证机制或安全套接层 (SSL)。当 DB2 客户端和服务器都支持 `DATA_ENCRYPT`\
  \ 时，该方案有效。\n\n如果你想通过 `DATA_ENCRYPT` 启用加密，请在服务器端和客户端端将数据库配置 `AUTHENTICATION` 设置为\
  \ `DATA_ENCRYPT`。\n\n在 DB2 服务器端：\n\n![Image](img/878.jpg)\n\n在 DB2 客户端端：\n\n![Image](img/879-1.jpg)\n\
  \n要实现 SSL，请参考 DB2 10.1 的“在 DB2 实例中配置安全套接层 (SSL)”。\n\n## 信任上下文与信任连接\n\n在具有 Web 服务器、应用程序服务器和数据库服务器的三层应用模型中，中间层（如\
  \ Web Application Server）负责验证运行应用程序的用户并管理与数据库的交互。所有用户——例如 Eric、Jason、Simon、Colin\
  \ 和 Hamdi——都通过自己的用户 ID 连接到应用程序服务器。然而，从应用程序服务器到数据库服务器的连接通常通过常用的应用程序用户 ID `AppUser`\
  \ 完成，如图 8.16 所示。\n\n![Image](img/879-2.jpg)\n\n*图：三层应用模型和上下文切换*\n\n这引发了几个安全问题：\n\
  \n- 用户身份和问责制的丢失：为了访问控制和审计目的，如今的组织希望知道访问数据库的用户身份以及他对数据库执行的操作。\n- 权限过度授予：在大多数情况下，中间层应用程序\
  \ ID 将拥有所有表的 `CONTROL` 权限，并对所有函数和包拥有 `EXECUTE` 权限。这导致了安全威胁，允许不需要访问某些信息的用户获取这些数据的访问权限。\n\
  - 安全削化：除了权限过度授予的问题外，中间层应用程序 ID 还可以访问用户请求可能访问的所有资源。如果应用程序 ID 遭到攻破，所有这些资源都会暴露。\n\n\
  DB2 的信任上下文功能解决了这些问题。信任上下文是一个数据库对象，用于定义数据库与外部实体（如应用程序服务器）之间连接的信任关系。该信任关系基于以下属性集构建：\n\
  \n\n\n\n\n*   **授权 ID (Authorization ID)**：标识建立到数据库连接的用户。\n*   **IP 地址或域名 (IP address\
  \ or domain name)**：标识建立到数据库服务器连接的主机名。\n*   **数据流加密 (Data stream encryption)**：标识数据库服务器与客户端之间数据流的最小加密级别。\n\
  \n拥有 `SECADM` 权限的人可以使用 `CREATE TRUSTED CONTEXT` 命令创建信任上下文。基本语法如下：\n\n![Image](img/880.jpg)\n\
  \n| where: | |\n| :--- | :--- |\n| `ContextName` | 标识信任上下文的名称 |\n| `AuthorizationID`\
  \ | 标识建立信任上下文时使用的系统授权 ID |\n| `IPAddress` | 标识与 `ADDRESS` 信任属性关联的 IP 地址值；这必须是 IPv4、IPv6\
  \ 或安全域名名 |\n| `EncryptionValue` | 标识特定 IP 地址的数据流加密级别或网络加密级别；有效值为 `NONE`、`LOW` 和\
  \ `HIGH` |\n| `RoleName` | 标识与基于信任上下文的信任连接的角色名称 |\n| `UseAuthorizationID` | 标识可以使用该信任连接的授权\
  \ ID |\n| `UseRoleName` | 标识当信任连接使用信任上下文时供用户使用的角色 |\n\n让我们创建一个信任上下文 `TCXU1`，允许应用程序用户\
  \ `APPUSER` 仅从 IP 地址 `196.126.17.149` 连接到数据库 `SAMPLE`，并将其与角色 developer 关联联：\n\n\
  ![Image](img/881.jpg)\n\n如果你尝试从 IP 地址 `196.126.17.149` 连接到数据库 `SAMPLE` 并运行 `SELECT`\
  \ 语句，你将看到如下内容：\n\n![Image](img/881-882.jpg)\n\n同样，从 IP 地址 `196.126.19.150` 发起连接并执行\
  \ `SELECT` 语句将导致类似的错误：\n\n![Image](img/882.jpg)\n\n从上述结果可以看出，通过结合信任上下文和角色的功能，你可以控制用户从哪里连接到数据库，并获得对数据库对象的访问权限。\n\
  \n要创建一个信任上下文以允许用户 `Jason` 从 IP 地址 `196.12.17.149` 连接，并允许连接在无需身份验证的情况下从 `Jason` 切换到\
  \ `Eric`，在需要身份验证的情况下切换到 `Colin`，请执行 `CREATE TRUSTED CONTEXT` 命令，如下：\n\n![Image](img/882-883.jpg)\n\
  \n## 使用基于标签的访问控制保护数据\n\n在此，你已经看到身份验证是在操作系统级别进行的，以验证用户确实是他们所称的，并且权限和特权控制对数据库以及其中包含的对象和数据的访问。视图允许不同用户看到相同数据的不同表现，可以配合权限来限制对特定列的访问。但如果你的安全需求要求创建并管理数百个视图怎么办？或者更重要的是，如果你想限制对表中单行的访问怎么办？对此解决方案解决方案基于标签的访问控制\
  \ (LBAC)。\n\nLBAC 是一项功能，允许你根据分配给行和列的安全标签以及用户来限制对表中内容的访问。LBAC 使用安全标签来判断用户是否拥有数据的访问权限。\n\
  \nLBAC 是一种处理复杂安全需求的灵活解决方案。传统安全方法的一个问题是它们可能无法轻松扩展到行级安全。LBAC 通过允许你定义安全标签和组件，然后使用它们来控制谁可以访问特定数据来解决这个问题。例如，LBAC\
  \ 可以使用分级标签如 `CONFIDENTIAL`、`SECRET` 和 `TOP SECRET`。\n\n## 实现行级 LBAC\n\n在实现行级 LBAC\
  \ 之前，你需要对安全策略有深入的理解。假设你有一个数据库，并想要控制高管、区域经理和销售代表访问数据。要实现这一点，你必须定义安全策略、创建受 LBAC 保护的表并授予适当的安全标签。\n\
  \n## 定义安全标签组件\n\n安全标签组件代表判断用户是否具有访问权限的标准。存在三种类型的安全标签组件：\n\n*   **集合 (Set)**：元素（字符串值）的集合，每个元素出现的顺序很重要。\n\
  *   **数组 (Array)**：一组有序的元素集合。在数组中，顺序是重要的——第一个元素的排名高于第二个元素。\n*   **树 (Tree)**：一种更复杂的层次结构，可以包含多个节点。\n\
  \n要创建标签组件，你需要执行以下 `CREATE LABEL COMPONENT` SQL 语句之一：\n\n| where: | |\n| :--- | :---\
  \ |\n| `ComponentName` | 标识分配给正在创建的安全标签组件的名称 |\n| `StringConstant` | 标识构成安全标签组件将使用的有效数组、集合或树的一个或多个字符串常量\
  \ |\n\n因此，要创建一个名为 `SEC_COMP` 且包含顺序不重要的值集合的安全标签组件，你需要执行如下的 `CREATE LABEL COMPONENT`\
  \ 语句：\n\n![Image](img/884-1.jpg)\n\n要创建一个包含按从高到低顺序排列的值数组的安全标签组件，请执行如下 `CREATE LABEL\
  \ COMPONENT` 语句：\n\n![Image](img/884-2.jpg)\n\n要创建一个包含描述公司组织架构的值树的安全标签组件，你需要执行如下的\
  \ `CREATE LABEL COMPONENT` 语句：\n\n![Image](img/884-3.jpg)\n\n## 定义安全策略\n\n安全策略确切决定了\
  \ LBAC 如何保护表。具体而言，安全策略标识了以下内容：\n\n*   在作为策略组成部分的安全标签中使用哪些安全标签组件\n*   在比较安全标签组件时使用哪些规则（目前仅支持一组规则：`DB2LBACRULES`）\n\
  *   在访问受策略保护的数据时使用哪些可选行为\n\n每个受 LBAC 保护的表必须且仅能关联一个安全策略。表中的行和列只能由该安全策略的安全标签进行保护；所有受保护的数据访问必须遵循该策略的规则。\n\
  \n\n\n\n\n要创建安全策略，请执行 `CREATE SECURITY POLICY` SQL 语句，如下：\n\n![Image](img/886-1.jpg)\n\
  \n| where: |\n| `PolicyName` | 标识分配给正在创建的安全策略的名称 |\n| `ComponentName` | 通过名称标识一个或多个作为正在创建的安全策略部分的安全标签组件\
  \ |\n\n`[OVERRIDE | RESTRICT] NOT AUTHORIZED WRITE SECURITY LABEL` 选项指定了当未授权写入通过\
  \ `INSERT` 和 `UPDATE` 语句显式指定的安全标签的用户尝试向受保护的表写入数据时，要采取的操作。默认情况下，在插入和更新操作期间，使用的是用户的安全标签，而不是显式指定的安全标签（`OVERRIDE\
  \ NOT AUTHORIZED WRITE SECURITY LABEL`）。如果你使用 `RESTRICT NOT AUTHORIZED WRITE SECURITY\
  \ LABEL` 选项，则当用户未获得权限向受保护的表写入显式指定的安全标签时，插入和更新操作将失败。\n\n因此，要基于之前创建的 `SEC_COMP` 安全标签组件创建一个名为\
  \ `SEC_POLICY` 的安全策略，请执行类似下面的 `CREATE SECURITY POLICY` 语句：\n\n![Image](img/886-2.jpg)\n\
  \n## 定义安全标签\n\n安全标签描述了一组安全标准，用于保护数据免受未经授权的访问或修改。安全管理员将安全标签授予允许访问或修改受保护数据的用户；当用户尝试访问或修改受保护数据时，会将其安全标签与保护数据的安全标签进行比较，以确定是否允许访问或修改。每个安全标签恰恰属于一个安全策略，且安全策略中的每个安全标签组件都必须存在一个安全标签。\n\
  \n你通过执行 `CREATE SECURITY LABEL` SQL 语句来创建安全标签。该语句的语法为：\n\n![Image](img/887.jpg)\n\
  \n| where: |\n| `LabelName` | 标识分配给正在创建的安全标签的名称；你指定的名称必须由安全策略名称进行限定，并且不能与所指示的安全策略的现有安全标签匹配\
  \ |\n| `ComponentName` | 通过名称标识作为 `LabelName` 参数限定符的安全策略部分的安全标签组件 |\n| `StringConstant`\
  \ | 标识一个或多个字符串常量值，这些值是 `ComponentName` 参数指定的安全标签组件的有效元素 |\n\n因此，为之前创建的名为 `SEC_POLICY`\
  \ 的安全策略创建一组安全标签，你需要执行一组类似下面的 `CREATE SECURITY LABEL` 语句：\n\n![Image](img/887-888.jpg)\n\
  \n## 创建受 LBAC 保护的表\n\n一旦定义了执行你的安全需求所需的安全策略和标签，就可以准备创建表并为其配置 LBAC 保护了。要为新表配置行级 LBAC\
  \ 保护，你需要在表定义中包含一个数据类型为 `DB2SECURITYLABEL` 的列，并使用 `CREATE TABLE` SQL 语句的 `SECURITY\
  \ POLICY` 子句将安全策略与表关联。\n\n因此，要创建一个名为 `SALES` 的表并使用之前创建的名为 `SEC_POLICY` 的安全策略对其配置行级\
  \ LBAC 保护，你需要执行一个类似下面的 `CREATE TABLE` 语句：\n\n![Image](img/888.jpg)\n\n要使用名为 `SEC_POLICY`\
  \ 的安全策略为现有表 `SALES` 配置行级 LBAC 保护，请执行类似于下面的 `ALTER TABLE` 语句：\n\n![Image](img/889-1.jpg)\n\
  \n然而，在执行此类 `ALTER TABLE` 语句之前，你必须拥有作为保护该表的安全策略一部分的写入访问安全标签（在此例中，为 `SEC_POLICY`）。否则，你将无法创建\
  \ `DB2SECURITYLABEL` 列。\n\n## 向用户授予安全标签\n\n一旦定义了执行你的安全需求所需的安全策略和标签，并启用了表的 LBAC 保护，你必须向适当的用户授予适当的安全标签，并指示他们对该标签保护的数据具有读取权限、写入权限还是完全访问权限。你通过执行特殊形式的\
  \ `GRANT` SQL 语句向用户授予安全标签。该形式 `GRANT` 语句的语法为：\n\n![Image](img/888.jpg)\n\n| where:\
  \ |\n| `LabelName` | 标识分配给正在创建的安全标签的名称；你指定的名称必须由安全策略名称进行限定，并且不能与所指示的安全策略的现有安全标签匹配\
  \ |\n| `UserName` | 标识授予安全标签的用户名称 |\n\n因此，赋予用户 `USER1` 读取安全标签 `SEC_POLICY.STAFF`\
  \ 的能力，请执行类似下面的 `GRANT` 语句：\n\n![Image](img/889.jpg)\n\n# 让行级 LBAC 运行起来\n\n为了强制列出的安全需求，你必须首先赋予用户对\
  \ `SALES` 表执行 DML 操作的能力。你必须向适当的用户授予适当的安全标签，并指示他们对该标签保护的数据具有读取权限、写入权限还是完全访问权限。你通过执行以下\
  \ `GRANT` 语句来实现这一点，但这次是以具有 `SYSADM` 或 `DBADM` 权限的用户身份执行：\n\n![Image](img/890.jpg)\n\
  \n现在，假设 `SALES_REP1` 通过执行以下 SQL 语句向 `SALES` 表添加了行数据：\n\n![Image](img/890-891)\n\n\
  `SALES_REP1` 通过 `SEC_POLICY.SALES_REP1` 安全标签拥有该表的读取和写入权限，因此语句执行。接下来，`SALES_REP2`\
  \ 通过执行以下 SQL 语句向 `SALES` 表又添加了两行数据：\n\n![Image](img/891-1)\n\n`SALES_REP2` 也通过 `SEC_POLICY.SALES_REP2`\
  \ 安全标签持有该表的读取和写入权限，因此行成功插入。\n\n现在，当用户 `EXEC_STAFF` 查询 `SALES` 表时，所有输入的五条记录都将出现（因为安全标签\
  \ `SEC_POLICY.EXEC_STAFF` 是安全策略安全标签树中的最高级别）。然而，如果用户 `EXEC_STAFF` 尝试插入额外记录或更新现有记录，将生成错误，因为用户\
  \ `EXEC_STAFF` 只允许读取数据。\n\n当用户 `N_MANAGER` 查询表时，只会显示由用户 `SALES_REP1` 输入的记录；用户 `W_MANAGER`\
  \ 将看到由用户 `SALES_REP2` 输入的记录；而用户 `E_MANAGER`、`S_MANAGER` 和 `C_MANAGER` 无法查看任何记录（`SALES_REP1`\
  \ 汇报给 `N_MANAGER`，`SALES_REP2` 汇报给 `W_MANAGER`，其他经理没有汇报给他们）。\n\n最后，当 `SALES_REP1`\
  \ 或 `SALES_REP2` 查询 `SALES` 表时，他们将只看到自己输入的记录。同样，他们只能更新自己插入的记录。\n\n## 实现列级 LBAC\n\
  \n为了理解如何使用列级 LBAC，假设你想控制人力资源（HR）工作人员、经理和员工访问存储名为 `EMPLOYEES` 的表中的数据。在这种场景中，安全需求如下：\n\
  \n*   所有员工都可以查看姓名、性别、部门和电话信息。\n*   只有经理和 HR 工作人员可以看到入职日期、薪水和奖金信息（此外还有姓名、性别、部门和电话信息）。\n\
  \n\n\n\n\n*   只有 HR 人员可以查看员工 ID 和社会安全号信息。此外，HR 人员是唯一可以创建和修改员工记录的用户。\n\n再次，在您确定了安全需求后，接下来的步骤是定义适当的安全组件、策略和标签；创建存储数据的表；修改表以添加\
  \ LBAC 保护；以及向适当的用户授予适当的安全标签。\n\n## 定义安全标签组件\n\n由于按从高到低顺序列出的值数组是实现上述概述安全要求的最佳方式，您可以通过执行\
  \ `CREATE SECURITY LABEL COMPONENT` 语句（以具有 `SECADM` 权限的用户身份）来创建所需的安全组件，该语句类似于所示：\n\
  \n![Image](img/892.jpg)\n\n## 定义安全策略\n\n在创建了适当的安全标签组件后，您可以通过执行以下 `CREATE SECURITY\
  \ POLICY` 语句（以具有 `SECADM` 权限的用户身份），创建一个基于 `SEC_COMP` 安全标签组件的名为 `SEC_POLICY` 的安全策略：\n\
  \n![Image](img/893-1.jpg)\n\n## 定义安全标签\n\n在此之前，您已经看到安全标签被授予允许访问或修改受 LBAC 保护数据的用户。当用户尝试访问或修改受保护的数据时，他们的安全标签将与保护数据的安全标签进行比较，以确定是否允许访问或修改。但在授予安全标签之前，您必须首先定义它们。\n\
  \n要为刚刚创建的名为 `SEC_POLICY` 的策略创建一组安全标签，您需要执行以下 `CREATE SECURITY LABEL` 语句（以具有 `SECADM`\
  \ 权限的用户身份）：\n\n![Image](img/893-2.jpg)\n\n请记住，每个安全标签都恰好属于一个安全策略，并且该安全策略中的每个安全标签组件必须存在一个安全标签。\n\
  \n## 创建受 LBAC 保护的表\n\n如前所述的，要为行级 LBAC 保护配置新表，您必须使用 `CREATE TABLE` SQL 语句的 `SECURITY\
  \ POLICY` 子句将安全策略与正在创建的表关联。列级 LBAC 保护也是如此。因此，要创建一个名为 `EMPLOYEES` 的表并与名为 `SEC_POLICY`\
  \ 的安全策略关联，您必须执行一个类似于所示的 `CREATE TABLE` 语句：\n\n![Image](img/894-1.jpg)\n\n## 向用户授予安全标签\n\
  \n为了实施之前确的安全需求，您必须赋予用户对 `EMPLOYEES` 表执行适当 DML 操作的能力。您通过执行以下 `GRANT` SQL 语句（以具有 `SYSADM`\
  \ 或 `DBADM` 权限的用户身份）来实现这一点：\n\n![Image](img/894-2.jpg)\n\n最后，您必须向适当的用户授予适当的安全标签，并指定他们对受标签保护的数据是具有读取权限、写入权限还是完全访问权限。为了实现这一点，您执行一组类似于所示的\
  \ `GRANT` 语句（以具有 `SECADM` 权限的用户身份）：\n\n![Image](img/894-895.jpg)\n\n## 创建受 LBAC\
  \ 保护的列\n\n一旦您定义了执行安全需求所需的安全策略和标签，并向用户授予了适当的权限和安全标签，就可以修改与安全策略关联的表，并配置其列以列级 LBAC\
  \ 保护了。您通过执行 `ALTER TABLE` 语句来实现：\n\n![Image](img/895-1.jpg)\n\n这里事情变得有点复杂了。如果您尝试以具有\
  \ `SYSADM` 或 `SECADM` 权限的用户身份执行上述 `ALTER TABLE` 语句，操作将失败，并且您将收到类似下方的错误消息：\n\n![Image](img/895-2.jpg)\n\
  \n这是因为唯一可以使用 `CONFIDENTIAL` 安全标签保护列的用户是（此处原文未提供完整用户说明，推断为特定权限用户）。\n\n\n\n\n用户 `HR_STAFF1`\
  \ 拥有表中所有列的读取和写入权限（通过 `SEC_POLICY.CLASSIFIED` 安全标签和 `DB2LBACWRITEARRAY WRITEDOWN`\
  \ 免），因此语句被成功执行。如果用户 `HR_STAFF` 尝试查询该表，该用户将看到每一列和每一行，因为他或她拥有数组中的最高安全级别。\n\n现在，当用户\
  \ `MANAGER1` 尝试读取表中的每一列时，将生成一个错误，说明该用户没有列 `SSN` 的读取权限。然而，`MANAGER1` 将能够执行以下查询，因为该用户对指定的每个列都有读取权限：\n\
  \n![Image](img/899-1.jpg)\n\n现在，如果用户 `EMPLOYEE1` 尝试执行相同的查询，将生成一个错误，说明他或她没有列 `BONUS`\
  \ 的读取权限。\n\n但 `EMPLOYEE1` 尝试执行以下查询将成功：\n\n![Image](img/899-2.jpg)\n\n此外，如果用户 `MANAGER1`\
  \ 或用户 `EMPLOYEE1` 尝试插入额外的记录或更新现有信息，该用户将收到一个错误，说明他或她没有权限对该表执行操作。\n\n## 结合行级和列级 LBAC\n\
  \n有时你可能希望限制单个用户对特定行和列组合的访问。情况下，你必须在表定义中包含一个数据类型为 `DB2SECURITYLABEL` 的列，在表定义中的每个列上添加\
  \ `SECURED WITH` `[SecurityLabel]` 选项，并使用 `CREATE TABLE` SQL 语句的 `SECURITY POLICY`\
  \ 子句或 `ALTER TABLE` 语句的 `ADD SECURITY POLICY` 子句将安全策略与表关联。通常你还会创建两个安全标签组件——一个用于行，一个用于列——并使用这两个组件来构建所需的安全策略和标签。\n\
  \n例如，假设你通过执行以下命令创建两个安全标签组件：\n\n![Image](img/900-1.jpg)\n\n然后你通过执行类似下方的 `CREATE SECURITY\
  \ POLICY` 命令来创建安全策略：\n\n![Image](img/900-2.jpg)\n\n接下来，你通过执行类似下面的命令创建相应的安全标签：\n\n\
  ![Image](img/900-3.jpg)\n\n最后，在将适当的安全标签与各个列关联后，你向每个用户授予正确的安全标签，并进行几次测试以确保数据访问按照预期控制。\n\
  \n## 行和列访问控制\n\nDB2 10.1 引入了 RCAC 作为一种额外的数据安全功能，将数据访问限制那些对数据有真实业务访问需求的用户——此功能也称为\
  \ `细粒度访问控制 (FGAC)`。与 LBAC 不同，RCAC 是一种通用的安全模型，可以与你自己的安全规则一起工作。\n\n你可以通过以下方式实现 RCAC：\n\
  \n ** **行权限**：表示行访问控制规则。\n- **列掩码**：表示列访问控制规则。\n\n### 实现行权限\n\n拥有 `SECADM` 权限的用户可以使用\
  \ `CREATE PERMISSION` 命令创建行权限。基本语法如下：\n\n![Image](img/901.jpg)\n\n| where: | |\n\
  | :--- | :--- |\n| `PermissionName` | 标识权限名称 |\n| `TableName` | 标识表名 |\n| `SearchCondition`\
  \ | 标识权限应用的条件 |\n\n激活行权限使用 `ALTER TABLE` 命令：\n\n![Image](img/904-1.jpg)\n\n### 创建表\n\
  \n在为 RCAC 创建表时，使用以下步骤：\n\n![Image](img/902.jpg)\n\n### 加载数据\n\n要将数据加载到表中，使用 `INSERT`\
  \ 命令：\n\n![Image](img/903.jpg)\n\n### 创建角色\n\n你可以使用 `CREATE ROLE` 命令创建角色：\n\n![Image](img/904.jpg)\n\
  \n将角色与权限关联使用 `ALTER TABLE` 命令：\n\n![Image](img/904-2.jpg)\n\n### 启动 RCAC \n\n当 Jason\
  \ 连接到数据库并执行 `SELECT` 命令时，他只能看到数据：\n\n![Image](img/904-3.jpg)\n\n同样，Colin 只能看到数据：\n\
  \n![Image](img/905.jpg)\n\n而当 Eric 连接到数据库并执行 `SELECT` 命令时，他将看到所有记录：\n\n![Image](img/906.jpg)\n\
  \n### 理解 RCAC 下的 DML 行为\n\nDML 行为非常简单：如果你无法通过 `SELECT` 指定某种类型的记录，那么你就无法对该记录执行 `INSERT`、`UPDATE`\
  \ 或 `DELETE`。\n\n例如，对于 `DEPT_ID 0001`，该部门的 HR 经理或 HR 总监可以向 `HR.EMPLOYEES` 表插入一条新记录：\n\
  \n![Image](img/906-907.jpg)\n\n同样，当 Jason 尝试插入 `DEPT_ID 0002` 的记录时，他收到了 `SQL20471N`\
  \ 错误：\n\n![Image](img/907-1.jpg)\n\n### 禁用行访问控制\n\n如果你由于任何原因想要禁用行访问控制，执行 `ALTER\
  \ TABLE` 命令：\n\n![Image](img/907-2.jpg)\n\n### 创建列掩码\n\n为了在列级限制访问或掩码数据，你可以使用列掩码。拥有\
  \ `SECADM` 权限的用户可以使用 `CREATE MASK` 命令创建列掩码：\n\n![Image](img/907-3.jpg)\n\n\n\n\n\
  \n| `ColumnName` | 标识应用掩码的列；列名必须是未限定名称，且该列上不能有任何现有掩码——该列不能是 LOB、XML 或生成列 |\n| `CaseExpression`\
  \ | 标识用于评估的 `CASE` 表达式，以确定为该列返回的值 |\n\n使用之前的 `HR.EMPLOYEES` 示例，如果业务需求是允许薪资部门看到完整的社会安全号码\
  \ (`SSN`)，让福利部门仅看到 `SSN` 的最后四位，并让通信部门无法看到 `SSN` 的任何内容，你可以通过执行 `CREATE MASK` 命令来实现这一目标：\n\
  \n![Image](img/908.jpg)\n\n当薪资用户在 `HR.EMPLOYEES` 上运行 `SELECT` 查询时，他们将看到类似下所示的数据：\n\
  \n![Image](img/908-909.jpg)\n\n当福利用户在 `HR.EMPLOYEES` 上运行 `SELECT` 查询时，他们将看到类似所示的数据：\n\
  \n![Image](img/909-910.jpg)\n\n同样，当通信用户在 `HR.EMPLOYEES` 上运行 `SELECT` 查询时，他们将看到类似下所示的数据：\n\
  \n![Image](img/910-911.jpg)\n\n如果你想停用表上的列掩码，执行 `ALTER TABLE` 命令：\n\n![Image](img/911.jpg)\n\
  \n## 内置标量函数\n\n正如你在早期的 RCAC 示例中所看到的，你有三个内置标量函数可用于在行权限和列掩码中表示条件。表 8.7 描述了用于验证用户是否属于给定角色或组的函数。\n\
  \n| 表 8.7: 内置 RCAC 标量函数 |\n\n| `Built-in Function Syntax` | `Description` |\n| :---\
  \ | :--- |\n| `VERIFY_ROLE_FOR_ USER (SESSION_USER, [RoleNameExp])` | 返回一个值，指示由\
  \ `SESSION_USER` 特殊寄存器标识的授权 ID 关联的任何角色，是否在 `RoleNameExp` 参数列表中指定的角色名称（或包含其中任何一个）中\
  \ |\n| `VERIFY_GROUP_FOR_ USER(SESSION_USER, [GroupNameExp])` | 返回一个值，指示由 `SESSION_USER`\
  \ 特殊寄存器标识的授权 ID 关联的任何组，是否在 `GroupNameExp` 参数列表中指定的组名称（或包含其中任何一个）中 |\n| `VERIFY_TRUSTED_\
  \ CONTEXT_ROLE_FOR_ USER(SESSION_USER, [RoleNameExp])` | 返回一个值，指示由 `SESSION_USER`\
  \ 特殊寄存器标识的授权 ID 已在关联某些信任上下文的信任连接下获取角色，且该角色在 `RoleNameExp` 参数列表中指定的角色名称（或包含其中任何一个）中\
  \ |\n\n## 使用 RCAC 的优势\n\n使用 RCAC 多种优势：\n\n*   所有列或行访问规则都集中存储在系统目录表中。\n*   没有任何数据库用户天生免于\
  \ RCAC 规则，包括拥有 `DATAACCESS` 权限的用户。\n*   通过 `SECADM` 权限集中创建和管理规则。\n*   无论通过如何访问数据，无论是通过\
  \ SQL 工具（例如 IBM Data Studio, Toad）还是通过应用程序，所有方法都受 RCAC 规则的约束。\n*   使用此额外的数据安全层无需对应用程序进行更改。\n\
  *   这在云计算解决方案中实现了多租户功能，其中多个独立的客户或业务单元可以共享单个数据库表，而互不感知。\n*   启用列掩码的应用不会影响语句与其他子句的操作，例如\
  \ `WHERE`、`GROUP BY`、`HAVING`、`SELECT DISTINCT` 和 `ORDER BY`。\n*   RCAC 对 `LOAD`、`REORG`、`RUNSTATS`\
  \ 和 `BACKUP` 操作没有影响。\n\n![Image](img/note.jpg)\n\n**注意：** 函数和触发器在可以使用行和列访问控制定义调用之前，必须被认为是安全的。要创建安全的\
  \ UDF 或修改现有 UDF 以使其安全，开发者必须拥有 `CREATE_ SECURE_OBJECT` 权限。\n\n## DB2 审计功能\n\nDB2\
  \ 有多种身份验证和授权控制机制来建立规则并控制对敏感数据的访问。然而，为了保护数据免受未知或不可接受行为的影响，你可以使用 DB2 审计功能监控数据访问。\n\
  \nDB2 审计功能生成并允许你维护一系列预定义数据库事件的审计跟踪。从该功能生成的记录保留在审计日志文件中。对这些记录的分析可以揭示识别系统滥用的模式。一旦识别出来，你就可以采取行动来减少或消除此类系统滥用。\n\
  \n审计功能提供了实例级和数据库级审计的能力，通过各自的日志独立记录所有实例和数据库级的活动。拥有 `SYSADM` 权限的用户可以使用 `db2audit`\
  \ 工具配置实例级审计，并控制审计信息。你还可以使用 `db2audit` 工具将实例和数据库审计日志归档或提取到存档位置。\n\n表 8.8 列出了可用于审计的事件类别。\n\
  \n| **表 8.8: db2audit 工具可用的事件类别** |\n\n| `Event` | `Command Option` | `Description`\
  \ |\n| :--- | :--- | :--- |\n| 审计 | `audit` | 在更改审计设置或访问审计日志时生成记录 |\n| 授权检查 | `checking`\
  \ | 在尝试访问或操作 DB2 数据库对象或函数的授权检查期间生成记录 |\n| 对象维护 | `objmaint` | 在创建或删除数据库对象时生成记录 |\n\
  | 安全维护 | `secmaint` | 在授予或撤销数据库/对象权限或 DBADM 权限时生成记录；修改数据库管理器安全配置参数 `sysadm_group`、`sysctrl_group`\
  \ 或 `sysmaint_group` 时也会生成记录 |\n| 系统管理 | `sysadmin` | 在执行需要 `SYSADM`、`SYSMAINT`\
  \ 或 `SYSCTRL` 权限的操作时生成记录 |\n| 用户验证 | `validate` | 在用户通过身份验证或检索系统安全信息时生成记录 |\n| 操作上下文\
  \ | `context` | 在执行实例操作时生成显示操作上下文的记录 |\n| 执行 | `execute` | 在执行 SQL 语句期间生成记录 |\n\n\
  DB2 提供了一系列存储过程来归档日志、定位感兴趣的日志并将数据提取到分隔符文件中进行分析。这些过程包括：\n\n*   `SYSPROC.AUDIT_ARCHIVE`\n\
  *   `SYSPROC.AUDIT_LIST_LOGS`\n*   `SYSPROC.AUDIT_DELIM_EXTRACT`\n\n拥有 `SECADM`\
  \ 权限的用户可以向其他用户授予上述存储过程的 `EXECUTE` 权限，以便安全管理员能够委托这些任务。\n\n# db2audit 命令\n\n在实例级，拥有\
  \ `SYSADM` 权限的用户可以使用 `db2audit` 命令启动或停止审计功能：\n\n![Image](img/913.jpg)\n\n如果你想查看当前的实例级审计设置和状态，使用带有\
  \ `describe` 选项的 `db2audit` 命令如下：\n\n![Image](img/914.jpg)\n\n上述输出表示当前实例上未配置审计。要配置它，请执行如下\
  \ `db2audit` 命令：\n\n![Image](img/914-915.jpg)\n\n一旦执行了上述命令，你可以在指定的数据路径位置看到审计文件：\n\
  \n![Image](img/915-1.jpg)\n\n如果你想归档审计日志，可以通过执行带有 `archive` 命令选项的 `db2audit` 命令来实现，如下：\n\
  \n![Image](img/915-2.jpg)\n\n如果你想将归档的审计日志转换为可读格式，请执行此命令：\n\n![Image](img/915-3.jpg)\n\
  \n你可以看到所有转换后的分隔符 ASCII 文件和一个示例输出文件：\n\n![Image](img/916.jpg)\n\n\n\n\n\n由于 DB2 审计功能独立于\
  \ DB2 实例运行，因此即使实例停止，它仍将保持激活状态。\n\n# 审计 SQL 语句\n\n拥有 `SECADM` 权限的用户可以使用 `CREATE AUDIT\
  \ POLICY` 命令创建审计策略，以对数据库中的特定对象进行审计。你可以将以下对象与审计策略关联：\n\n*   整个数据库\n*   表\n*   可信上下文\
  \ (Trusted contexts)\n*   代表用户、组或角色的授权 `ID`\n*   权限——`SYSADM`、`SECADM`、`DBADM`、`SQLADM`、`WLMADM`、`ACCESSCTRL`、`DATAACCESS`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON`\n\n如果你想对表 `HR.EMPLOYEES` 中数据的 SQL 访问，可以通过创建安全策略并关联到相应的表中来实现，如下：\n\n\
  ![Image](img/917-1.jpg)\n\n同样，如果你想对由 `SYSADM` 或 `DBADM` 权限执行的所有活动进行审计，可以创建一个类似下面的策略：\n\
  \n![Image](img/917-2.jpg)\n\n要提取 `AUDIT` 语句数据，请使用“`db2audit` 工具命令”章节所示的 `db2audit`\
  \ 命令。\n\n# 关于安全信息系统目录的说明\n\n现在你已经对 DB2 中的各种权限和特权有了深入了解，了解这些安全信息存储在何处、如何检索它们，以及你应该考虑限制其他用户访问哪些系统目录对象的访问是有益的。\n\
  \n表 8.9 列出了包含用户、角色和对象所有权权限信息的视图和表函数：\n\n| 表 8.9: 包含权限信息的视图和表函数 |\n\n| 目录视图、管理视图和表函数\
  \ | 说明 | 限制 PUBLIC 和其他用户的访问 |\n| :--- | :--- | :--- |\n| `SYSCAT.COLAUTH` | 存储列权限\
  \ | 是 |\n| `SYSCAT.DBAUTH` | 存储数据库权限 | 是 |\n| `SYSCAT.INDEXAUTH` | 存储索引权限 | 是 |\n\
  | `SYSCAT.MODULEAUTH` | 存储模块权限 | |\n| `SYSCAT.PACKAGEAUTH` | 存储包权限 | 是 |\n| `SYSCAT.PASSTHRUAUTH`\
  \ | 存储服务器权限 | 是 |\n| `SYSCAT.ROLEAUTH` | 存储角色权限 | |\n| `SYSCAT.ROUTINEAUTH` | 存储例程权限\
