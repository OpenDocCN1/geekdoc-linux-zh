  *   `FOR BUSINESS_TIME FROM <ts1> TO <ts2>`: 允许你查询从特定时间 `ts1` 到特定时间 `ts2` 的数据。\n\
  *   `FOR BUSINESS_TIME BETWEEN <ts1> AND <ts2>`: 允许你查询一段时间范围之间的数据。\n\n例如，要查询 2015/01/01\
  \ 到 2015/02/12 期间的数据，运行类似如下 `SELECT` 语句：\n\n![Image](img/245.jpg)\n\n为了完整性，表 3.5\
  \ 列出了系统周期表和应用周期表之间的差异。\n\n\n\n\n\n| 表 3.5: 系统周期时间表与应用周期时间表对比 |\n| 系统周期时间表 | 应用周期时间表\
  \ |\n| :--- | :--- |\n| 此表在基表中维护记录当前版本，并在历史表中维护记录的版本。 | 此表维护生效的业务数据。 |\n| 此表包含一个\
  \ `SYSTEM_TIME` 周期，其列用于捕获行数据有效的开始时间和终结束时间。它还用它来维护历史信息。 | 此表包含一个 `BUSINESS_TIME`\
  \ 周期，其列用于捕获有效期的开始和结束时间。 |\n| 需要一个历史表。 | 不需要历史表。 |\n| 此表包含一个事务 ID 列，用于捕获影响行的事务的开始时间。\
  \ | 不需要事务 ID 列。 |\n| 此表可以定义引用完整性 (RI) 约束；然而，无法在历史表上创建约束。 | 此表可以定义引用完整性 (RI) 约束。\
  \ |\n| 在检索数据时，你可以使用 `SELECT` 语句的 `FOR SYSTEM_TIME AS OF <ts1>`、`FOR SYSTEM_TIME\
  \ FROM <ts1> TO <ts2>` 或 `FOR SYSTEM_TIME BETWEEN <ts1> AND <ts2>` 子句。 | 在检索数据时，你可以使用\
  \ `SELECT` 语句的 `FOR BUSINESS_TIME AS OF <ts1>`、`FOR BUSINESS_TIME FROM <ts1> TO\
  \ <ts2>` 或 `FOR BUSINESS_TIME BETWEEN <ts1> AND <ts2>` 子句。 |\n| 不支持 `ALTER TABLE\
  \ ACTIVATE NOT LOGGED INITIALLY` 语句。 | 不支持 `ALTER TABLE ACTIVATE NOT LOGGED INITIALLY`\
  \ 语句。 |\n| 不支持 `TRUNCATE` 命令。 | 支持 `TRUNCATE` 命令。 |\n| 在处理系统周期时间表时，数据移动工具和命令需要 `MODIFIED\
  \ BY` 子句。 | 数据移动工具和命令正常工作。 |\n| 你不能带 `REPLACE` 子句运行 `IMPORT` 或 `LOAD`。 | 你可以使用 `REPLACE`\
  \ 子句运行 `IMPORT` 或 `LOAD`。 |\n| 此表不能 MQT。 | 此表可以是 MQT。 |\n| 可以使用 `SET CURRENT TEMPORAL\
  \ SYSTEM_TIME` 注册变量更新会话的系统时间。 | 可以使用 `SET CURRENT TEMPORAL BUSINESS_TIME` 注册变量更新会话的业务时间。\
  \ |\n| 当会话系统时间注册表设置为 `NOT NULL` 值时，无法执行更新或删除操作。 | 当会话业务时间注册表设置为 `NOT NULL` 值时，可以执行更新或删除操作。\
  \ |\n\n## 双时间周期表 (Bitemporal Period Tables)\n\n双时间表是一种既在基表中存储记录当前版本，又在历史表中存储记录版本，同时存储生效业务数据的表。如果你想创建一个双时间表并配置其用于历史跟踪和特定时间的数据存储能力，可以通过执行以下步骤实现：\n\
  \n**步骤 1：** 在 `CREATE TABLE` 命令中同时包含 `SYSTEM_TIME` 周期和 `BUSINESS_TIME` 周期。\n\n**步骤\
  \ 2：** 创建历史表以记录旧行。\n\n**步骤 3：** 添加版本控制以建立基表与历史表之间的关联。\n\n**步骤 4：** 在主键、`UNIQUE`\
  \ 约束或 `UNIQUE INDEX` 语句上定义 `WITHOUT OVERLAPS` 子句，以消除相同键重叠的业务时间周期：\n\n![Image](img/247.jpg)\n\
  \n## 关于 SESSION 特殊寄存器 (SESSION Special Register)\n\n如果你有一个现有的应用程序或任何 SQL 批脚本，想要在\
  \ DB2 10.1 系统周期时间表或应用周期时间表针对特定的系统时间或业务时间点运行，可以使用 `SET CURRENT TEMPORAL` 特殊寄存器，从而无需修改\
  \ SQL 语句以包含 `FOR SYSTEM_TIME` 和 `FOR BUSINESS_TIME` 子句。\n\n要设置特殊寄存器，执行 `SET` 命令：\n\
