  ![Image](img/474.jpg)\n\n输出包含分析锁定超时原因所需的所有信息，包括：\n\n*   关于参与锁定超时的应用程序信息，例如应用程序句柄、授权\
  \ ID、代理程序状态和 SQL 语句\n*   关于锁的信息，包括锁的数量、锁的类型、锁升级条件和锁等待阈值设置\n*   关于负载的信息，包括负载 ID 和服务子类\n\
  \n表 5.12 显示了 `db2evmonfmt` 工具的示例命令，用于为数据库 SAMPLE 中支持的事件类型生成报告。\n\n| **表 5.12：db2evmonfmt\
  \ 命令示例** |\n| **描述** | **命令** |\n| :--- | :--- |\n| 为过去 24 小时生成文本格式的锁定超时报告 | `java\
  \ db2evmonfmt -d SAMPLE -ue <Lkt_UeTable> -ftext -hours 24 -type locktimeout` |\n\
  | 为过去 24 小时生成文本格式的死锁报告 | `java db2evmonfmt -d SAMPLE -ue <Dlk_UeTable> -ftext -hours\
  \ 24 -type deadlock` |\n| 为过去 24 小时生成文本格式的锁等待报告 | `java db2evmonfmt -d SAMPLE -ue\
  \ <Lkw_UeTable> -ftext -hours 24 -type lockwait` |\n| 格式 XML 源文件以生成过去 5 小时锁等待的文本格式报告\
  \ | `java db2evmonfmt -f lock.xml -ftext -type lockwait -hours 5` |\n\n# 未格式化事件数据格式函数\n\
  \n与 `db2evmonfmt` 工具一样，另一种从未格式化表提取数据的方法是使用以下函数。通过这些过程，您可以通过创建自己的 XSLT 样式表来控制输出：\n\
  \n*   `SYSPROC.EVMON_FORMAT_UE_TO_XML()`\n*   `_TO_TABLES()`\n\n`EVMON_FORMAT_UE_TO_XML()`\
  \ 函数从未格式化事件表中提取二进制事件并将其格式化为 XML 文档。该函数的语法如下：\n\n![Image](img/476.jpg)\n\n| where:\
  \ |\n| `FullSelect` | 标识符合 `SELECT` 规则的查询 |\n\n如果返回 XML 文档大于 100 MB（此函数返回的最大大小），可以通过指定\
  \ `LOG_FILE` 参数将 XML 文档写入文件。文件将写入 `<xml_id>.xml` 文件，其中 `xml_id` 是每个文档生成的唯一 ID。输出文件位于\
  \ `diagpath`。`LOG_PARTIAL_EVENTS` 选项表示将所有不完整或部分的事件写入文件。`SUPPRESS_PARTIAL_EVENTS_ERR`\
  \ 选项表示存在不完整或部分事件时忽略 SQL443N 警告，`NULL` 表示未指定选项。\n\n从 UE 表提取锁信息的示例命令如下：\n\n![Image](img/476-2.jpg)\n\
  \n`EVMON_FORMAT_TO_TABLES()` 函数提取存储在 UE 表中的数据并转换为关系表。DB2 通过两个步骤完成 UE 表数据到关系数据的转换。首先，使用\
  \ `EVMON_FORMAT_UE_TO_XML`过程将数据转换为 XML 格式。其次，DB2 执行 XML 分解并将 XML 数据转换为关系数据。该函数的语法如下：\n\
  \n![Image](img/477.jpg)\n\n| where: |\n| `EventMonitorType` | 标识存储在 UE 表中的数据类型；可能值为\
  \ `LOCKING, PKGCACHE,` 和 `UOW` |\n| `XSRSchema` | 标识描述 UE 文件数据与列对应关系的 XML 架构存储 (XSR)\
  \ 对象架构 |\n| `XSRObjectName` | 标识描述 UE 文件数据与列对应关系的 XSR 对象名称 |\n| `XMLSchemaFile`\
  \ | 标识描述事件监控器输出的 XML 架构文件的完全限定路径 |\n| `TableSchema` | 标识创建事件监控器关系表的架构名称 |\n\n\n\n\
  \n\n| `TablespaceName` | 标识创建关系表所在的表空间 |\n| `Options` | 标识表函数支持的选项；你必须使用分号分隔每个选项\
  \ |\n| `RECREATE_FORCE` | 表示删除并重新创建关系表 |\n| `RECREATE_ONERROR` | 表示在以下情况下删除并重新创建关系表：•\
  \ XSR 对象未注册但表已存在• 发生分解失败（decomposition failures）和负值 `SQLCODES` 错误 |\n| `PRUNE_UE_TABLE`\
  \ | 指定修剪任何成功插入到关系表中的二进制事件 |\n| `UPGRADE_TABLES` | 当 DB2 版本包含更改时，升级早期创建的 UE 表 |\n\
  | `CommitCount` | 标识分解提交频率：• -1: 每成功分解 100 份文档后提交（默认值）• 0: 从不提交• n: 每成功分解 `*n*`\
  \ 文档后提交 |\n| `FullSelect` | 标识符合 `SELECT` 语句规则的查询 |\n\n将 UE 表信息转换为关系表的示例命令如下：\n\n\
  ![Image](img/478.jpg)\n\n上述过程调用转换数据并插入到以下表中。如果这些表不存在，DB2 会在过程执行期间创建它们：\n\n*   `LOCK_ACTIVITY_VALUES`\n\
  *   `LOCK_PARTICANT_ACTIVITIES`\n*   `LOCK_PARTICANTS`\n*   `EVENT`\n\n## 关于 MONREPORT\
  \ 模块\n\n正如你所知，监控是一项耗时且需要经验的任务。DB2 具有许多内置模块，为执行各种有用操作（包括使用 `MONREPORT` 模块进行数据库监控）提供了易用的接口。该模块通过提供简单的过程调用来提取与连接、语句和包相关的监控数据，简化了数据库管理员的工作。表\
  \ 13 显示了 `MONREPORT` 模块中的可用程序。\n\n![Image](img/478-479.jpg)\n\n你可以使用这些报告来排查 SQL\
  \ 性能问题。要调用过程，请使用简单的 `CALL` 命令：\n\n![Image](img/479.jpg)\n\n![Image](img/480.jpg)\n\
  \n![Image](img/481.jpg)\n\n![Image](img/482.jpg)\n\n![Image](img/483.jpg)\n\n![Image](img/484.jpg)\n\
  \n![Image](img/485.jpg)\n\n![Image](img/486.jpg)\n\n上述报告旨在提供整个数据库系统级、应用级和成员级的数据。\n\
  \n## 关于 DB2 WLM 监控\n\n实现 DB2 WLM 的主要目的是为连续业务实现稳定且可预测的系统。DB2 有多种 WLM 监控表函数，用于监控异常查询、资源消耗模式的变化以及系统保持健康状态的。表\
  \ 14 显示了可用的负载管理过程。\n\n| 表 14：DB2 WLM 监控表函数 | |\n| `Routine Name` | `Description`\
  \ ` |\n| `WLM_GET_SERVICE_CLASS_WORKLOAD_OCCURRENCES` | 返回系统上运行的所有负载实例列表，包括负载名称、应用程序名称以及父类和子类名称\
  \ |\n| `WLM_GET_WORKLOAD_OCCURRENCE_ACTIVITIES` | 返回指定应用程序提交的所有当前活动列表 |\n| `WLM_GET_SERVICE_CLASS_AGENTS`\
  \ | 返回在指定服务类中运行的代理、围栏进程和系统实体（如页面清理程序和预取器）列表 |\n| `WLM_GET_SERVICE_SUPERCLASS_STATS`\
  \ | 返回跨父类或跨成员的聚合连接信息 |\n| `WLM_GET_SERVICE_SUBCLASS_STATS` | 返回跨子类或跨成员的聚合连接信息 |\n\
  | `WLM_GET_WORKLOAD_STATS` | 返回摘要信息，包括每个负载名称和数据库成员的总活动、平均执行时间、活动吞吐量、总 CPU 时间和总 CPU\
  \ 利用率 |\n| `WLM_GET_WORK_ACTION_SET_STATS` | 返回工作操作集的总活动信息 |\n| `WLM_GET_QUEUE_STATS`\
  \ | 返回一个或多个阈值队列的总耗时、总队列大小和连接阈值 |\n\n引用表函数的查询语法所示：\n\n![Image](img/487.jpg)\n\n|\
  \ 其中： | |\n| :--- | :--- |\n| `FunctionName` | 标识要使用的监控表函数名称（即表 14 中列出的函数之一） |\n\
  | `WLMSpecifics` | 标识监控表函数的 WLM 特有信息，例如要检索监控数据的服务父类和子类 |\n| `Member` | 标识收集监控数据的成员；你可以指定\
  \ -1 表示当前成员，指定 -2 表示所有数据库成员 |\n| `CorrelationName` | 标识分配给查询产生的结果集的名称 |\n\n如果你想列出所有成员中\
  \ `SYSDEFAULTUSER` 父类和 `SYSDEULTSUBCLASS` 子类的实例，请使用类似下面的 SQL 语句：\n\n![Image](img/487-488.jpg)\n\
  \n要理解系统上运行的当前活动（包括读取行数、返回行数和总 CPU 时间），请使用类似的 SQL 语句：\n\n![Image](img/488-489.jpg)\n\
  \n# 使用 Explain 功能分析 SQL\n\n## 访问计划\n\n当 SQL 语句提交给 DB2 数据库引擎进行处理时，DB2 优化器将对其进行分析以产生所谓的*访问计划*（access\
  \ plan）。每个访问计划都包含有关执行语句的策略的详细信息（例如是否使用索引；所需的排序方法；所需的锁以及要使用的连接方法）。如果你在应用程序中编写 SQL\
  \ 语句，访问计划将在预编译时生成（如果使用延迟绑定则在绑定时生成），生成的访问计划执行形式作为*包*（package）存储在系统目录中。然而，如果你从 CLP\
  \ 提交语句，或者语句是应用程序中的动态 SQL 语句（即在应用程序运行时构造的 SQL 语句），访问计划将在语句准备执行时生成，生成的访问计划临时存储在内存中（全局包缓存中），而不是系统目录中。\n\
  \n## Explain 表\n\n\n\n\n\n在获取 Explain 信息之前，你必须创建一个一组名为 `Explain tables` 的特殊表。表 5.15\
  \ 显示了每个 Explain 表及其所包含的信息。\n\n| 表 5.15: Explain 功能表 |\n| 表名 | 内容 |\n| :--- | :---\
  \ |\n| EXPLAIN_ARGUMENT | 包含所用每个操作符的唯一特性（如果有的话） |\n| EXPLAIN_INSTANCE | 包含被解释的 SQL\
  \ 或 XQuery 语句源的基本信息，以及执行解释时的环境信息（`EXPLAIN_INSTANCE` 表是所有 Explain 信息的主控制表；其他 Explain\
  \ 表中的每行数据都显式地链接到此表中的唯一行） |\n| EXPLAIN_OBJECT | 包含为 SQL 或 XQuery 语句生成的访问计划所需的数据对象的信息\
  \ |\n| EXPLAIN_OPERATOR | 包含查询编译器为了满足 SQL 或 XQuery 语句所需的所有操作符 |\n| EXPLAIN_PREDICATE\
  \ | 包含识别特定操作符所应用的谓词的信息 |\n| EXPLAIN_STATEMENT | 包含不同级别 Explain 信息的 SQL 或 XQuery\
  \ 语句文本；用户输入的原始 SQL 语句存储在此表中，以及 DB2 优化器为了选择满足 SQL 语句的访问计划而使用的版本（后版本可能与原始语句几乎不相似，因为它可能被\
  \ SQL 预编译器重写或通过额外的谓词进行了增强） |\n| EXPLAIN_STREAM | 包含存在于单个操作符和数据对象之间的输入输出数据流的信息（数据对象本身表示在\
  \ `EXPLAIN_OBJECT` 表中，涉及数据流的操作符存在于 `EXPLAIN_OPERATOR` 表中） |\n| EXPLAIN_ACTUALS |\
  \ 包含关于 SQL 语句部分的信息 |\n| EXPLAIN_DIAGNOSTIC | 包含为 `EXPLAIN_STATEMENT` 表中被解释语句的特定实例所产生的每条诊断消息的信息\
  \ |\n| EXPLAIN_DIAGNOSTIC_DATA | 包含记录在 `EXPLAIN_DIAGNOSTIC` 表中的诊断消息的消息令牌信息 |\n|\
  \ ADVISE_INDEX | 包含设计建议器推荐的索引的信息 |\n| ADVISE_INSTANCE | 包含设计建议器（`db2avis` 命令执行）的信息，例如开始时间、结束时间、模式和状态\
  \ |\n| ADVISE_MQT | 包含关于 MQT 的信息，例如建议创建 MQT 的 SQL 语句、列和行统计以及刷新类型 |\n| ADVISE_PARTITION\
  \ | 包含设计建议器推荐的数据库分区的信息 |\n| ADVISE_TABLE | 包含使用设计建议器的 MQT、MDCs 和数据库分区建议来创建表的数据定义\
  \ |\n| ADVISE_WORKLOAD | 包含负载信息，包括 SQL 或 XQuery 语句 |\n| OBJECT_METRICS | 包含在特定时间某部分的特定执行中引用的每个对象的运行时信息\
  \ |\n\n通常，你在开发数据库中使用 Explain 表来辅助应用程序设计，但在生产数据库中不会，因为生产环境的应用程序代码保持相对静态。由于由于，这些表不会作为数据库创建过程的一部分与系统目录表一起创建。相反，你必须在要使用\
  \ Explain 的数据库中手动创建 Explain 表。\n\n幸运的是，创建 Explain 表的过程非常简单：使用 `CLP` 建立与适当数据库连接并执行名为\
  \ `EXPLAIN.DDL` 的脚本，该脚本位于最初安装 DB2 软件的 `sqllib` 目录下的 `misc` 子目录中。或者，你可以使用 `SYSINSTALLOBJECTS`\
  \ 过程来创建表，如下所示：\n\n![Image](img/491.jpg)\n\n## 收集 Explain 数据\n\nExplain 功能由多个单独的工具组成，并非所有工具都需要相同类型的\
  \ Explain 数据。因此，可以收集两种类型的 Explain 数据：\n\n* **全面 Explain 数据 (Comprehensive Explain\
  \ data)**。包含有关 SQL 或 XQuery 语句访问计划的详细信息；这些信息存储在多个不同的 Explain 表中\n* **Explain 快照数据\
  \ (Explain Snapshot data)**。包含 SQL 或 XQuery 语句的当前内部表示以及任何相关信息；这些信息存储在 `EXPLAIN_STATEMENT`\
  \ Explain 表的 `SNAPSHOT` 列中\n\n正如你可能想象的那样，你可以通过多种方式收集这两种 Explain 数据。收集 Explain 数据的方法包括：\n\
  \n* 执行 `EXPLAIN` SQL 语句\n* 设置 `CURRENT EXPLAIN MODE` 特殊寄存器\n* 设置 `CURRENT EXPLAIN\
  \ SNAPSHOT` 特殊寄存器\n* 在使用 `PRECOMPILE` 或 `BIND` 命令时使用 `EXPLAIN` 绑定选项\n* 在使用 `PRECOMPILE`\
  \ 或 `BIND` 命令时使用 `EXPLSNAP` 绑定选项\n\n# EXPLAIN SQL 语句\n\n为单个动态 SQL 语句收集全面 Explain\
  \ 信息和 Explain 快照数据的一种方法是执行 `EXPLAIN` SQL 语句。\n\n该语句的基本语法如下：\n\n![Image](img/492-1.jpg)\n\
  \n| 其中： | |\n| :--- | :--- |\n| `SQLStatement` | 标识要收集 Explain 数据或 Explain 快照数据的\
  \ SQL 语句（指定的语句必须是有效的 `INSERT, UPDATE, DELETE, SELECT, SELECT INTO, VALUES, 或 `VALUES\
  \ INTO` SQL 语句） |\n\n如果你在 `EXPLAIN` 语句中指定 `FOR SNAPSHOT` 选项，则仅为指定的动态 SQL 语句收集 Explain\
  \ 快照信息。但如果你改为指定 `WITH SNAPSHOT` 选项，则将为该动态 SQL 语句收集全面的 Explain 信息和 Explain 快照数据。然而，如果两个选项都不使用，则只收集全面的\
  \ Explain 数据；不会产生 Explain 快照数据。\n\n因此，如果你想为语句 `SELECT * FROM department` 收集全面的 Explain\
  \ 数据，请执行如下的 `EXPLAIN` 语句：\n\n![Image](img/492-2.jpg)\n\n但如果你想为相同的 SQL 语句仅收集 Explain\
  \ 快照数据，请执行以下 `EXPLAIN` 语句：\n\n![Image](img/492-3.jpg)\n\n最后，如果你想为语句 `SELECT * FROM\
  \ department` 收集全面的 Explain 数据和 Explain 快照信息，请执行此 `EXPLAIN` 语句：\n\n![Image](img/492-4.jpg)\n\
  \n注意的是，`EXPLAIN` 语句不会执行指定的 SQL 语句，也不会显示收集到的 Explain 信息——你必须使用 Explain 工具来查看收集的信息。（我们很快就会查看这些工具。）\n\
  \n# 特殊寄存器\n\n虽然 `EXPLAIN` SQL 语句对于为单个动态 SQL 语句收集 Explain 或 Explain 快照信息非常很有用，但如果需要分析大量的\
  \ SQL 语句，使用它会非常耗费时间。为多个动态 SQL 语句收集相同信息的更好方法是在执行一组动态 SQL 语句之前设置一个或两个特殊的 Explain 功能寄存器。然后，当语句准备好执行时，将为处理的每个语句收集\
  \ Explain 或 Explain 快照信息。然而，语句本身可能执行，也可能不执行。\n\n\n\n\n\n以这种方式使用的两个 Explain（解释）功能专用寄存器是\
  \  `CURRENT EXPLAIN MODE` 和 `CURRENT EXPLAIN SNAPSHOT`。你可以通过 `SET CURRENT EXPLAIN\
  \ MODE` SQL 语句设置 `CURRENT EXPLAIN MODE` 专用寄存器，并通过 `SET CURRENT EXPLAIN SNAPSHOT`\
  \ SQL 语句设置 `CURRENT EXPLAIN SNAPSHOT` 专用寄存器。`SET CURRENT EXPLAIN MODE` 语句的基本语法为：\n\
  \n![Image](img/493-1.jpg)\n\n`SET CURRENT EXPLAIN SNAPSHOT` 语句的基本语法为：\n\n![Image](img/493-2.jpg)\n\
  \n正如你可能想象到的，将 `CURRENT EXPLAIN MODE` 和 `CURRENT EXPLAIN SNAPSHOT` 两个特殊寄存器都设置为 `NO`\
  \ 将禁用 Explain 功能，且不会捕捉任何 Explain 数据。但如果你将其中任何一个特殊寄存器设置为 `EXPLAIN,`，Explain 功能将变为激活，并且每当为执行准备一个动态\
  \ SQL 语句时，都会收集详尽的 Explain 信息或 Explain 快照数据（如果两个特殊寄存器都已设置，则两者都收集）。然而，语句本身不会被执行。如果你将其中任何一个特殊寄存器设置为\
  \ `YES,`，其行为与将相应的寄存器设置为 `EXPLAIN,` 相同，但有一个显著区别：在收集到适当的 Explain/Explain 快照数据后，收集\
  \ Explain 信息的动态 SQL 语句将立即执行。\n\nTable 5.16 总结了每个 Explain 专用寄存器设置对 Explain 功能和动态\
  \ SQL 语句处理的影响。\n\n![Image](img/494.jpg)\n\n# EXPLAIN 和 EXPLSNAP 绑定选项（Bind Options）\n\
  \n到目前，你已经看到了为动态 SQL 语句收集详尽 Explain 信息和 Explain 快照数据的方法。但数据库应用程序通常包含必须分析的静态 SQL 语句。那么，你如何使用\
  \ Explain 功能来分析嵌入式 SQL 应用程序中编写的静态 SQL 语句？要为嵌入式 SQL 应用程序中编写的静态和动态 SQL 语句收集详尽的 Explain\
  \ 信息或 Explain 快照数据，你必须使用 `EXPLAIN` 和 `EXPLSNAP` 绑定选项。\n\n`EXPLAIN` 绑定选项控制是否为嵌入式\
  \ SQL 应用程序中编写的 SQL 语句收集详尽的 Explain 数据；`EXPLSNAP` 绑定选项控制是否收集 Explain 快照数据。你可以在 `PRECOMPILE`\
  \ 命令中指定一个或两个选项，该命令用于预编译包含嵌入式 SQL 语句的源文件——如果你使用延迟绑定（deferred binding），这些选项可以通过 `BIND`\
  \ 命令提供，该命令将把嵌入式 SQL 应用程序的绑定文件绑定到数据库。\n\n你可以为 `EXPLAIN` 选项和 `EXPLSNAP` 选项分配 `NO,`、`YES,`\
  \ 或 `ALL.`。将两个选项都赋值为 `NO`（例如 `EXPLAIN NO EXPLSNAP NO)`）将禁用 Explain 功能，且不会捕捉任何 Explain\
  \ 数据。然而，将其中任何选项赋值为 `YES` 将激活 Explain 功能，并为源文件中遇到的每个静态 SQL 语句收集详尽的 Explain 信息或 Explain\
  \ 快照数据（如果两个选项都设置为 `YES`，则两者都收集）；动态 SQL 语句将被忽略。如果你将其中任何选项赋值为 `ALL,`，Explain 功能将变为激活，并为找到的每一个静态和动态\
  \ SQL 语句收集详尽的 Explain 信息或 Explain 快照数据（如果两个选项都已设置），即使 `CURRENT EXPLAIN MODE` 或 `CURRENT\
  \ EXPLAIN SNAPSHOT` 专用寄存器已被设置为 `NO`。\n\nTable 5.17 总结了当与 `EXPLAIN MODE` 专用寄存器结合使用时，`EXPLAIN`\
  \ 绑定选项对 Explain 功能以及静态和动态 SQL 语句处理的影响。Table 5.18 总结了 `EXPLSNAP` 绑定选项对 Explain 功能以及静态和动态\
  \ SQL 语句处理的影响。*（注：原文在此处似乎有格式断裂或描述重复，已按逻辑完整翻译）*\n\n\n\n\n\n| `-g` | 标识图计划（graph plan）；有效选项包括：•\
  \ `O:` 生成图计划，但不对表格内容进行格式化• `T:` 标识图图中每个算子的总成本• `F:` 指定图图中第一个元组（tuple）的成本• `I:` 标识图图中每个算子的\
  \ I/O 成本• `C:` 指定图图中每个算子的输出基数（cardinality） |\n| `-l` | 标识处理包名时的区分大小敏感情况 |\n| `PkgName`\
  \ | 标识 Explain 请求的包名，且区分大小 |\n| `PkgSchema` | 标识 Explain 请求的包模式（schema），且区分大小 |\n\
  | `OutPutFile` | 标识输出文件名 |\n| `User` | 标识连接数据库的用户名 |\n| `Password` | 标识连接数据库的密码\
  \ |\n| `Timestamp` | 标识 Explain 时间戳；指定 `-1` 以获取最新的 Explain 计划 |\n| `SectionNum`\
  \ | 标识源 SQL 语句中的部分；指定 `0` 表示所有部分 |\n| `PkgVersion` | 标识 Explain 请求的包版本；默认值为 `%`\
  \ |\n\n例如，要生成一个包含 DB2 提供的 `SAMPLE` 数据库中收集并存储的所有 Explain 数据的详细报告，你可以执行 `db2exfmt`\
  \ 命令：\n\n![Image](img/501-1.jpg)\n\n执行此命令时，将生成一个报告并写入名为 `db2exfmt.out.` 的文件中。如果你想为\
  \ SQL 语句 `“SELECT * FROM department” 生成详细报告，请执行以下命令：\n\n![Image](img/501-2.jpg)\n\
  \n你可以使用 UNIX 下的 `vi` 编辑器或 Windows 平台上的 `Notepad` 查看详细报告。输出内容大致如下：\n\n![Image](img/502.jpg)\n\
  \n![Image](img/503.jpg)\n\n![Image](img/504.jpg)\n\n![Image](img/505.jpg)\n\n![Image](img/506.jpg)\n\
  \n## 可视化解释 (Visual Explain)\n\n可视化解释是集成在 IBM Data Studio 中的的一项 GUI 工具，为数据库管理员和应用程序开发人员提供查看针对特定\
  \ SQL 语句所选访问计划（access plan）的图形化表示的能力。此外，可视化解释允许你执行以下操作：\n\n* 查看用于优化 SQL 语句的数据库统计信息\n\
  * 确定是否使用了索引来访问表数据（如果未使用索引，可视化解释可以帮助你决定哪些列可能从索引中获益）\n* 通过允许进行“修改前”和“修改后”对比，查看性能调优的效果\n\
  * 获取有关访问计划执行的每个操作的详细信息，包括每个操作的估计成本\n\n然而，你只能使用可视化解释查看 Explain 快照数据。要查看已收集并写入 Explain\
  \ 表的 Explain 数据，你必须使用 `db2exfmt` 工具。\n\n### 激活可视化解释\n\n激活可视化解释的常用方法之一是通过使用查询调优（Query\
  \ Tuning）对话框为动态 SQL 语句生成 Explain 数据。图 5.1 展示了为了激活查询调优对话框必须选择的 IBM Data Studio 项目。图\
  \ 5.2 显示了查询向导器（Query Advisor）和分析工具（Analysis Tools）对话框在填充了简单查询后的外观。\n\n![Image](img/507-1.jpg)\n\
  \n*图 5.1: 激活查询调优向导*\n\n![Image](img/507-2.jpg)\n\n*图 5.2: 查询向导器和分析工具向导*\n\n打开查询向导器和分析工具对话框后，你可以在\
  \ **Query Text** 输入字段中输入任何动态 SQL 语句。然后，当你点击 **Select What To Run** 按钮时，你将看到与 图 5.3\n\
  \n*图 5.3: 选择活动向导*\n\n一旦你选择了要在数据库上执行的操作，你将看到所提供 SQL 语句的访问计划图（图 5.4）。在分析访问计划以识别改进\
  \ SQL 语句性能的机会时，点击不同的对象类型以检索关键信息，例如节点类型、算子类型、估计基数、对象类型和总成本，以理解当前的优化计划。\n\n![Image](img/509.jpg)\n\
  \n*图 5.4: 访问计划图向导*\n\n### 可视化解释输出\n\n如图 5.4 所示，可视化解释提供的输出由一个分级图组成，代表处理特定 SQL 语句所选访问计划所需的各种组件。每个组件都表示为一个称为节点（node）的图形对象，存在两种类型的节点：\n\
  \n* 必须对数据或从表或索引产生的输出执行的操作。\n* 操作数节点标识执行操作的实体（例如，表将表扫描算子的操作数）。\n\n通常，操作数节点标识表、索引和表队列（当你使用分区内并行性时使用表队列），它们在分级图中用矩形（表）、菱形（索引）和平行四边形（表队列）表示。然而，算子节点（Operator\
  \ nodes）标识了从插入到表扫描的任何操作。表 5.19 列出了出现在访问计划中的更常见的算子。\n\n**表 5.19: DB2 常见算子**\n\n|\
  \ 定义 | 说明 |\n| :--- | :--- |\n| DELETE | 从表中删除行 |\n| EISCAN | 扫描用户定义的索引以产生减少的数据流\
  \ |\n| FETCH | 使用特定的记录标识符从表提取列 |\n| FILTER | 通过应用一个或多个谓词过滤数据 |\n| GENROW | 生成行 |\n\
  | GRPBY | 按指定的列或函数对行分组并评估集合函数 |\n| HSJOIN | 表示哈希连接，其中两个或多个表按连接列进行哈希（在决策支持环境中执行连接的方法）\
  \ |\n| INSERT | 向表中插入行 |\n| IXAND | 逻辑结合来自两个或多个索引的行标识 (RID) |\n| IXSCAN | 扫描带有可选起始/停止条件的索引，产生有序数据流\
  \ |\n| MSJOIN | 表示合并连接，其中外部表和内部表都必须按连接谓词排序 |\n| NLJOIN | 表示嵌套循环连接，为外部表的每行访问一次内部表（在\
  \ OLTP 环境中执行连接的方法） |\n| PIPE | 在调试模式下从编译表函数传输记录 |\n| REBAL | 在对称多处理子代理之间重新平衡记录 |\n\
  | RETURN | 代表将数据返回给用户 |\n| RIDSCN | 扫描从一个或多个索引获得的 RID 列表 |\n| RPD | 远程推送算子定义了在远程数据源执行的计划部分\
  \ |\n| SHIP | 从远程数据库源检索数据；用于联邦系统 |\n| SORT | 按指定列排序行并可选消除重复项 |\n| TBFUNC | 在 SAS\
  \ 嵌入处理期间使用的内置表函数算子 |\n| TBSCAN | 通过直接读取数据页检索所有行 |\n| TEMP | 将数据存储在临时表中以便多次读取 |\n\
  | TQ | 在数据库代理之间传输表数据 |\n| UNION | 连接来自多个表的行流 |\n| UNIQUE | 消除指定列的重复值 |\n\n\n\n\n\
  \n| UPDATE | 在表更新更新行 |\n| :--- | :--- |\n| XISCAN | 对 XML 数据使用索引扫描 |\n| XSCAN |\
  \ 遍历 XML 元素以评估 XPath 表达式并在必要时提取文档元素 |\n| XANDOR | 优化器通过对 XML 数据进行 AND 和 OR 操作来使用适用的索引\
  \ |\n| ZZJOIN (ZigZag join) | 在星型架构中连接事实表和两个或多个维度表时使用 |\n\n说明数据如何从一个节点流到下一个节点的箭头连接了层级图中的所有节点，`RETURN`\
  \ 算符通常会终止此路径。图 5.4 显示了包含两个不同操作节点 `(TBSCAN` 和 `RETURN)` 以及一个操作数节点（名为 `DB2INST1.DEPARTMENT`\
  \ 的表）的访问计划的层级图在可视化解释（Visual Explain）或访问图计划中可能的样子。\n\n# 关于 DB2 优化类的说明\n当编译 SQL 或\
  \ XQuery 语句时，你可以指定一个优化类，该类决定了 DB2 优化器如何为该查询选择最高效的访问计划。优化类根据编译查询时考虑的优化策略的数量和类型进行区分。取值范围从\
  \ 0 到 9；通常情况下，类别越高，优化器在选择最佳访问计划时花费的时间和内存越多，可能会产生更好的访问计划并提高运行性能。\n\n你使用 `QUERYOPT`\
  \ 预编译/绑定选项在准备静态 SQL 语句时指定使用的优化技术类。如果应用程序在预编译或绑定到数据库时未提供此选项，则使用数据库配置参数 `dft_queryopt`\
  \ 的当前值作为默认。你使用 `CURRENT QUERY OPTIMIZATION` 特殊寄存器来控制绑定动态 SQL 语句时使用的优化技术类。要更改参数值，请执行\
  \ `SET CURRENT QUERY OPTIMIZATION` SQL 语句。该语句的基本语法如下：\n\n![Image](img/511.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `OptimizationLevel` | 指定在准备动态 SQL 语句时使用的优化级别（类）；此参数必须设置为以下值之一：\
  \ |\n| | • `0:` 明在优化器生成访问计划时使用最少量的优化技术；此优化类级别最适用于访问良好索引表的简单动态 SQL 语句 | • `1`: 明在优化器生成访问计划时使用的优化技术数量应大致等于\
  \ DB2 版本 1 提供的数量 | • `2`: 明在优化器生成访问计划时使用的优化技术数量应高于 DB2 版本 1 提供的数量，但显著少于级别 3 及以上所使用的数量\
  \ | • `3`: 明在优化器生成访问计划时使用适量的优化技术 | • `5:` 明在优化器生成访问计划时使用大量的优化技术；对于复杂查询，将使用启发式规则来限制选择访问计划花费的时间（只要可能，查询将使用汇总表而不是底层基础表——这是\
  \ DB2 使用的默认优化类） | • `7:` 明在优化器生成访问计划时使用大量的优化技术；此级别与级别 5 类似；但是，不会使用启发式规则来限制为复杂查询选择访问计划花费的时间\
  \ | • `9:` 明在优化器生成访问计划时使用最大数量的优化技术；此优化类可以极大扩展在选择访问计划之前评估的可能访问路径数量；由于此原因，此类通常用于处理针对非常大的表执行的包含非常复杂且运行时间长的\
  \ SQL 语句 |\n\n因此，如果你想指示 DB2 优化器在生成动态 SQL 语句的访问运行时使用比默认更多的优化技术，请执行 `SET CURRENT QUERY\
  \ OPTIMIZATION` 语句：\n\n![Image](img/512.jpg)\n\n当你为 `CURRENT QUERY OPTIMIZATION`\
  \ 特殊寄存器分配新值时，一组新的查询重写规则将被启用，并为某些优化变量分配适当的值。这些查询重写规则和优化变量将在准备动态 SQL 语句期间使用，以便为语句选择最佳访问计划。注意，你可以为\
  \ `QUERYOPT` 预编译/绑定分配与 `CURRENT QUERY OPTIMIZATION` 特殊寄存器相同的值。\n\n# DB2 故障排除工具\n\
  除了数据库系统和解释（Explain）设施，还有许多工具帮助数据库管理员隔离和识别系统、数据库或应用程序的问题。本节探讨了许多工具，包括 `db2fodc`、`db2diag`、`db2pd`、`db2bfd`、`db2mtr`、`db2top`\
  \ 和 `db2support`。\n\n# 获取错误代码信息\n当数据库管理器返回错误代码时，你可以使用 `db2diag <SQL Error Code>`\
  \ 查看详细信息。例如：\n\n![Image](img/513.jpg)\n\n## 原因码\n在某些情况下，错误消息将包含对所谓“原因码”（reason code）的引用。原因码提供了与错误代码相关的附加信息。\n\
  \n| where: |\n| :--- | :--- |\n| `ReasonCode` | 指定与错误消息相关的原因码；通常这是一个数值（对于错误代码 SQL011N，`ReasonCode`\
  \ 可以是 2、68、72 或 73） |\n\n## dbdiag 工具\n本质上，管理通知日志文件和 DB2 诊断日志文件中的信息一旦理解了格式就是易于阅读的。然而，搜索大型\
  \ DB2 日志文件是非常耗时的，特别是日志文件跨越数月时。为了帮助确定问题，DB2 提供了一个可以过滤和格式化 `db2diag.log` 文件信息的工具。该工具被称为\
  \ `db2diag` 工具，你通过执行 `db2diag` 命令来激活它。该命令有多个选项：\n\n*   `db2diag -help`: 提供可用选项的简短描述\n\
  *   `db2diag -h brief`: 提供所有选项的描述但不带示例\n*   `db2diag -h notes`: 提供用法说明和限制\n*   `db2diag\
  \ -h examples`: 提供一组示例帮助入门\n*   `db2diag -h tutorial`: 为所有选项提供示例\n*   `db2diag -h\
  \ all`: 提供可用选项的完整列表\n\n如果你看到下一个示例中的错误，带有十六进制 ZRC 数字 `0x86100025`，你可以使用 `db2diag`\
  \ 命令提取特定 ZRC 的详细信息，如下：\n\n![Image](img/515-516.jpg)\n\n在上面的示例中，显然问题出在存储服务器上，需要适当的分析和修复。\n\
  \n## 首次发生数据捕获 (FODC)\n\n\n\n\n\nDB2 提供的最重要的诊断工具之一是`首次发生数据捕获 (FODC)` 的功能。FODC 在后台静默运行，直到发生重大事件，此时，DB2\
  \ 数据库管理器会自动捕获有关该事件的诊断信息，并将其记录在特殊的 ASCII 格式文件中。这些信息包含了有助于诊断和解决问题的关键细节。由于这些信息是在事件发生的实际时间收集的，因此通过重现错误来获取诊断信息的需求大大减少，在某些情况下甚至可以消除。FODC\
  \ 捕获的信息通过几种不同的方式外部化，包括以下：\n\n*   **DB2 诊断日志文件条目。** 每当发生重大事件时，包含该事件诊断信息的条目就会自动记录在名为\
  \ `db2diag.log` 的文件中，该文件是 DB2 的主要诊断日志文件。\n\n*   **管理通知日志条目。** 当发生重大事件时，针对生成的任何 SQL\
  \ 返回码的补充信息将写入 Windows 事件日志（在 Windows NT、Windows 2000 和 Windows XP 系统上）或写入名为 `InstanceName.nfy`\
  \ 的文件中——其中 `InstanceName` 是生成该信息的实例名称（在所有其他支持的操作系统上）。这些信息并不是晦涩的，可以使用 Windows 事件查看器（在\
  \ Windows 系统上）或任何文本编辑器（在所有其他系统上）查看。\n\n*   **转储文件。** 在某些情况下，当特定的 DB2 进程或线程失败时，额外信息将记录在外部二进制转储文件中（根据失败进程/线程的\
  \ ID 命名）。这些文件在某种程度上是不可读的，旨在给 IBM 软件技术支持进行解读。\n\n*   **DB2 事件日志。** 每当系统发生基础设施事件时，它都会以循环方式记录在事件日志二进制文件中。当实例重启时，该日志文件会被替换。如果实例崩溃，将生成一个\
  \ `db2eventlog.xxx.crash` 文件。这些文件供 IBM 软件技术支持使用。\n\n*   **DB2 回调脚本 (db2cos) 输出文件。**\
  \ 当数据库管理器由于恐慌、段错误或异常无法继续处理用户或系统请求时，`db2cos` 脚本作为 FODC 的一部分会被调用。默认的 `db2cos` 脚本调用\
  \ `db2pd` 命令以非锁定的方式收集信息。`db2cos` 脚本位于 `~sqllib/bin/`。如果您想修改它，可以将 `db2cos` 脚本复制到\
  \ `~sqllib/adm/` 并使用 `vi` 编辑器进行更改。\n\n*   **陷阱文件 (Trap files)。** 如果 DB2 数据库管理器由于陷阱、段错误或异常发生无法继续处理，它将生成一个陷阱文件，其中包含在陷阱、段错误或异常事件发生前执行的最后步骤所进行的函数调用序列。\n\
  \n*   **核心文件（仅限 UNIX）。** 如果 DB2 在 UNIX 平台上异常终止，操作系统将生成核心文件，这是一个包含与 DB2 陷阱文件中记录信息类似的二进制文件。核心文件还可能包含终止\
  \ DB2 进程的整个内存映像；文件大小由 UNIX 限制 `/etc/security/limits.conf` 控制。\n\n# FODC 信息位置\n\n\
  默认情况下，FODC 信息存储在 `~/sqllib/db2/InstanceName/instrumentation`，其中 `InstanceName` 是实例名称。如果您使用\
  \ Windows 系统，信息存储在 `C:\\ProgramData\\DB2\\DB2\\InstanceName\\instrumentation` 中。\n\
  \n如果您想查看诊断信息，可以使用 `db2diag` 命令。例如，要查看诊断日志的最后 100 条条目，请使用：\n\n```bash\ndb2diag -n\
  \ 100\n```\n\n\n\n\n此前，你已经看到每当发生重大事件时，包含该事件诊断信息的条目就会自动记录在名为 `db2diag.log` 的文件中，该文件是\
  \ DB2 的主要诊断日志文件。`db2diag.log` 文件是一个 ASCII 格式的文件，由 `FIDC` 工具和其他 DB2 引擎组件生成的诊断记录组成。该文件中的每个记录（或条目）要么包含已发生的特定管理事件的信息，要么包含特定的错误信息。管理事件的条目非常有价值，因为它们指示了如备份和恢复等操作是否已启动，以及如果已启动，它们是否成功完成。然而，错误信息的条目仅在你尝试诊断外部症状，或者在你已经隔离了特定错误的源头并正在寻找更多信息时才有用（例如，应用程序接收到意外的\
  \ SQL 代码或数据库崩溃）。如果数据库运行正常，则信息性消息条目并不重要，通常可以忽略。\n\n一旦创建 `db2diag.log` 文件，当你将 `diagsize`\
  \ 数据库管理器配置参数设置为 `0` 时，它将持续增长。因此，最近的条目始终位于文件的末尾。如果该文件的存储空间成为问题，你可以删除现有文件——在下次需要时将会自动创建一个新的\
  \ `db2diag.log` 文件。当你将 `diagsize` 数据库管理器配置参数设置为非零值时，DB2 数据库管理器将在 `diagpath` 数据库管理器配置参数位置创建一系列诊断日志文件（也称为*循环诊断日志文件*，名为\
  \ `db2diag.N.log`，其中 `N` 从 `0` 开始并按 `1` 自动递增），每个文件都会增长直到达到限制的大小。\n\n# 管理通知日志\n\n\
  管理通知日志（`instance_name.nfy`）是一个存储库，你可以从中获取有关大量数据库管理和维护活动的信息，包括 DB2 实用程序的状态、客户端应用程序错误和存储路径。\n\
  \n与 DB2 诊断日志条目相比，管理通知日志条目的一个显著区别是缺少混淆的十六进制转储。取而代之的是提供了在真实的、专业的 DB2 数据库管理员（DB2 客户）帮助下审核和编写的具有意义且有用的消息。这些消息大部分为返回给应用程序或\
  \ CLP 的每个相关 SQL 返回代码值的补充信息。其他消息提供了对意外错误或异步事件的通知，例如崩溃、操作系统的信号或次优配置。管理通知日志条目和 DB2\
  \ 诊断日志条目的格式本质上相同。然而，写入管理通知日志的所有消息均使用安装过程中指定的终端用户语言（写入 DB2 诊断日志的消息始终为英语，无论使用的终端用户语言如何）。\n\
  \n与 DB2 诊断日志文件一样，通知日志文件的循环是在 `diagsize` 数据库管理器配置参数设置为非零值时产生的。如果你将 `diagsize` 设置为非零值，该值指定了诊断数据目录下所有循环管理通知日志文件和所有循环诊断日志文件的组合总大小。例如，如果一个具有四个数据库分区的系统将\
  \ `diagsize` 设置为 1 GB，则活跃的通知日志和诊断日志组合能达到的最大总大小为 4 GB (4 x 1 GB)。\n\n# 控制收集的信息量\n\
  \n记录的管理和诊断信息的类型（即控制数量）也由 DB2 数据库管理器实例配置中的参数（`notifylevel` 和 `diaglevel`）控制。根据这些参数的当前值，它们告诉\
  \ DB2 应该收集什么类型的管理和诊断信息：\n\n*   `0`: 不收集管理信息和诊断数据（不建议）。\n*   `1`: 仅针对严重（致命或不可恢复）错误收集管理信息和诊断数据。\n\
  *   `2`: 收集所有类型错误（包括严重和非严重错误）的管理信息和诊断数据，但不收集警告。\n*   `3`: 收集所有错误和警告的管理信息和诊断数据。\n\
  *   `4`: 收集所有错误和警告的管理信息和诊断数据，包括信息性消息和其他内部诊断信息。\n\n当实例首次创建时，DB2 数据库管理器实例配置文件中的 `notifylevel`\
  \ 和 `diaglevel` 参数默认设置为 `3`，每当此类事件发生时，DB2 都会为错误和警告收集管理信息和诊断数据。\n\n# 解析通知和诊断日志条目\n\
  \n管理通知日志文件和 DB2 诊断日志文件中的每个条目都从一组特定的值开始，这些值旨在帮助识别该条目对应的特定事件。由于此块信息记录在所有条目中，并且它总是以特定格式记录，因此它被称为*条目头*（entry\
  \ header）。图 5.6 展示了典型的管理通知日志条目头的外。\n\n![Image](img/524.jpg)\n\n*图 5.6: 管理通知日志/DB2\
  \ 诊断日志条目头的各个组件*\n\n所有条目头由以下组件组成（请参考图 5.6 中的带编号的项目符号）：\n\n1.  标识条目生成时间的时间戳\n2.  `db2diag.log`\
  \ 文件的记录 ID——此 ID 指定了正在记录当前消息的文件偏移量（例如，在 `E5434E1225` 中，对于创建 DB2 诊断日志的平台，文件偏移量为 `5434`，消息长度为\
  \ `1225`）\n3.  与错误消息相关的诊断级别——有效值为 `Info, Warning, Error, Severe` 和 `Event`\n4. \
  \ 操作系统分配给 `db2sysc` 进程的唯一标识——从 DB2 9.5 开始，DB2 在 Windows 和 UNIX 环境中均为多线程而非多进程；因此，提供的进程\
  \ ID 通常是主 DB2 可执行文件的 ID\n5.  操作系统分配给生成条目的线程的唯一标识\n6.  生成条目的进程名称\n7.  生成条目的实例名称\n\
  8.  对应于生成条目的节点的编号——如果你使用非分区数据库，节点数通常为 `000`；然而，即使在单节点分区数据库中，你可以在 `db2nodes.cfg`\
  \ 文件中指定非零分区数\n9.  生成条目的数据库名称\n10. 分配给运行应用程序的应用句柄——该值由协调分区编号和协调索引组成，并用连字符分隔\n11.\
  \ 分配给运行应用程序的唯一标识——要获取有关特定应用程序 ID 的信息，请执行以下任务：\n\n    1.  在 DB2 服务器上使用 `LIST APPLICATIONS`\
  \ 命令，或在 DB2 Connect 网关上使用 `LIST DCS APPLICATIONS` 命令获取应用程序 ID 列表。在此列表中搜索该应用程序 ID；一旦找到，就可以获取有关发生错误的客户端的信息，例如其节点名称和\
  \ TCP/IP 地址。\n\n\n\n\n\n2. 使用 `GET SNAPSHOT FOR APPLICATION` 命令查看应用程序 ID 列表。\n\n\
  3. 使用 `SYSPROC.MON_GET_CONNECTION` 表函数查看应用程序 ID 列表。\n\n4. 执行命令 `db2pd -applications\
  \ -db [DatabaseName].`。\n\n12. 生成该条目时正在操作实例或数据库的用户授权 ID。\n\n13. 运行 DB2 的服务器名称\n\n\
  14. 引擎可分发单元 ID，你可以通过使用命令 `db2pd -edus` 找到它。\n\n15. 引擎可分发单元的名称\n\n16. 产品名称 DB2 UDB、组件名称访问计划管理器（access\
  \ plan manager）以及生成该信息的函数名称 `sqlra_cache_mem_pleaset` 和该函数内部的探测点 `[100]`——如果该条目是由执行了\
  \ `db2AdminMsgWrite()` API 的用户应用程序生成的，则条目头部的此组件将显示“User Application”；应用程序可以通过调用\
  \ `db2AdminMsgWrite()` API 向管理通知日志文件和 DB2 诊断日志文件写入消息。\n\n要了解更多关于产生该条目的函数所执行的活动类型，请查看其名称的第四个字母；以下显示了\
  \ DB2 函数名称中第四位置使用的某些字母以及每个函数执行的活动类型：\n\n* `b`: 缓冲池管理和操作\n* `c`: 客户端与服务器之间的通信\n*\
  \ `d`: 数据管理\n* `e`: 数据库引擎进程\n* `o`: 操作系统调用（如打开和关闭文件）\n* `p`: 数据保护（如锁定和日志记录）\n* `r`:\
  \ 关系数据库服务\n* `s`: 排序操作\n* `x`: 索引操作\n* `u`: 工具性操作\n\n在 图 5.6 的条目中，名为 `sqlra_cache_mem_\
  \ pleaset` 的函数第四个字母为 `r`，表示该消息是由尝试执行某种类型关系数据库服务的服务的函数生成的。\n\n17. 描述所记录事件的 \n\n18.\
  \ 表示报告是从包缓存（Package Cache）应用程序插件模块生成的\n\n19. 返回的记录的影响级别——可能的值为 `NONE, UNLIKELY,\
  \ POTENTIAL, IMMEDIATE,` 和 `CRITICAL`\n\n20. 来自 (18) 中报告的数据点\n\n# db2pdcfg 命令\n\n\
  DB2 问题确定位配置 `(db2pdcfg)` 命令允许你在 DB2 软件故障期间，为了问题确定目的而影响数据库系统的行为。`db2pdcfg` 命令的基本语法为：\n\
  \n![Image](img/526-527.jpg)\n\n| where: | |\n| :--- | :--- |\n| `ErrorCode` | 识别要捕获的任何特定\
  \ SQLCODE、ZRC 代码、ADM、死锁或锁超时错误消息，并指示调用 `db2cos` 脚本以转储信息进行分析 |\n| `LockName` | 识别用于捕获特定锁的名称\
  \ |\n| `LockType` | 识别用于捕获特定锁的类型 |\n| `NumSeconds` | 识别以秒为单位的睡眠或等待时间:** `sleep`\
  \ — 这是在检查 `db2cos` 脚本生成的输出大小之间的睡眠时间；默认值为三秒** `timeout` — 这是在假设 `db2cos` 脚本完成工作之前等待的时间；默认值为\
  \ 30 秒 |\n| `Count` | 识别在数据库管理器陷阱期间运行 `db2cos` 脚本的迭代次数；默认值为 `255` |\n| `FODCPath`\
  \ | 识别存储 FODC 数据包的完整路径 |\n| `DumpCoreValues` | 识别在 UNIX 系统上启用或禁用操作系统核心文件生成的值；有效值为\
  \ `AUTO, ON,` 和 `OFF` |\n| `DumpDirectory` | 识别存储操作系统核心转储文件的完整路径 |\n| `CoreSize`\
  \ | 识别创建的核心文件的最大大小 |\n| `ServiceValue` | 识别在恐慌、陷阱或可能指示数据损坏的特定错误期间收集数据；有效值为 `AUTOMATIC,\
  \ BASIC,` 和 `FULL` |\n\n如你所见，可以使用 `db2pdcfg` 命令提供的许多选项来定制你的问题确定需求（以下是几个示例）。\n\n\
  要在任何死锁情况下捕获信息，请通过执行此命令设置捕获标志：\n\n![Image](img/527-528.jpg)\n\n错误捕获数显示了设置的捕获标志数量，操作显示了在发生数据库陷阱或错误时如何调用\
  \ `db2cos` 命令。\n\n如果你想显示所有捕获标志，请不带任何额外参数执行 `db2pdcfg` 命令：\n\n![Image](img/528.jpg)\n\
  \n![Image](img/529.jpg)\n\n![Image](img/530-1.jpg)\n\n# db2bfd 命令\n\n你可以使用 DB2 绑定文件描述工具来检查和验证绑定文件内的\
  \ SQL 语句，并显示用于创建绑定文件的预编译选项。如需调用 DB2 绑定文件描述工具，请执行 `db2bfd`。\n\n![Image](img/530.jpg)\n\
