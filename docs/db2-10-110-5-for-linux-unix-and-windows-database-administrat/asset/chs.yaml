  \ `admin\\tmp`并将 zip 文件放置在此处并解压。\n\n你现在已使用基本的 UNIX 标准在 Windows 上设置了 DB2 数据服务器。\n\
  \n执行 `gunzip <zip file from IBM>` 解压文件，或在 Windows 上将内容提取到此位置。在 UNIX 上，内容看起来大致如下：\n\
  \n![Image](img/1002.jpg)\n\n**步骤 3：** 在运行 `db2setup` 或 Windows `setup` 程序之前，执行 `db2prereqcheck`\
  \ 命令，以确保你已满足运行 DB2 的服务器要求。\n\n**步骤 4：** 使用 `db2setup` 安装 DB2 软件。要在集群中每台服务器的相同位置安装\
  \ DB2 软件，你将使用响应文件。响应文件可能会根据你安装的内容而不同。\n\n安装所有内容的响应文件如下所示：\n\n![Image](img/1003-1.jpg)\n\
  \n然而，执行基础安装的响应文件如下所示：\n\n\n\n\n\n![Image](img/1003-2.jpg)\n\n用户“root”在服务器上执行的命令为\
  \ `db2setup –r <rsp.file>`。\n\n## 第 5 ：创建 DB2 实例。\n\n对于非 pureScale 部署，您可以使用此命令在服务器上创建实例：\n\
  \n![Image](img/1003-3.jpg)\n\n在运行上述命令之前，您必须创建 UNIX 或 Windows 账户 `<fenced_user>`\
  \ 和 `<instance_name>`。\n\n仅限 pureScale，按照以下步骤操作：\n\n### 第 1 步：在集群中的所有服务器上执行步骤 1–4。\n\
  \n可以使用以下响应文件：\n\n![Image](img/1003-4.jpg)\n\n### 第 2 步：创建 pureScale 实例。\n\n执行 `db2icrt`\
  \ 命令的服务器（成员）称为`初始安装主机 (IIH)`。让我们为每个新成员运行一次 `db2icrt` 和 `db2iupdt` 命令，以添加以及第二个备备集群节点（CF）。\n\
  \n假设您有以下服务器组：\n\n![Image](img/1004-1.jpg)\n\n在每台服务器上，确保 `/etc/hosts` 文件在它们之间一致。将这些项目放入\
  \ `/etc/hosts` 文件中允许服务器在没有外部 DNS 服务器的情况下解析名称。只需在 IP 地址或名称发生变化时务必修改这些项目即可。\n\n![Image](img/1004-2.jpg)\n\
  \n![Image](img/note.jpg)\n\n**注意：**某些源使用 `-ib` 表示基于 InfiniBand 的 RDMA，相对于以太网的 `-roce`。我们的示例将使用以太网。pureScale\
