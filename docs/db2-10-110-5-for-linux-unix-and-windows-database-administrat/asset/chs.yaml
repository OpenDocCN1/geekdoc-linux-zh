  \ TABLE EMPLOYEE ALLOW READ ACCESS` |\n| ![images](img/circ.jpg) | C. | `REORG TABLE\
  \ EMPLOYEE RESETDICTIONARY` |\n| ![images](img/circ.jpg) | D. | `REORG TABLE EMPLOYEE\
  \ KEEPDICTIONARY` |\n\n## **问题 50**\n哪条 DB2 命令在 DB2 10.1 中被废弃？\n\n| ![images](img/circ.jpg)\
  \ | A. | `db2setup` |\n| ![images](img/circ.jpg) | B. | `db2_install` |\n| ![images](img/circ.jpg)\
  \ | C. | `db2rf` |\n| ![images](img/circ.jpg) | D. | `db2rspgn` |\n\n\n\n\n正确答案是\
  \ **A.** 只有具有系统管理员（SYSADM）权限或系统控制（SYSCTRL）权限的用户允许对实例进行静止（quiesce）。一旦实例处于静止状态，只有具有系统管理员（SYSADM）、系统控制（SYSCTRL）或系统维护（SYSMAINT）权限的用户；指定组的成员（如果在将实例置静止模式时指定了组名）；或指定用户名的用户（如果在将实例放入静止模式时指定了用户名）才允许连接到该实例。\n\
  \n### 问题 2\n\n正确答案是 **B.** 如果与特定实例相关的 DB2 数据库管理器后台进程尚未运行，可以通过执行 `START DATABASE\
  \ MANAGER` 命令来启动。该命令的基本语法如下：\n\n![Image](img/146-1.jpg)\n\n或\n\n![Image](img/146-2.jpg)\n\
  \n因此，要启动默认实例（无论其名称为何）的 DB2 数据库管理器后台进程，你需要执行如下所示命令：\n\n![Image](img/146-3.jpg)\n\n\
  ### 问题 3\n\n正确答案是 **C.** 系统的默认实例由 `DB2INSTANCE` 环境变量定义，在许多情况下，这是执行所有实例级操作的所在实例。如果你需要对不同的实例执行操作，必须首先更改分配给\
  \ `DB2INSTANCE` 变量的值（通过执行命令 `set DB2INSTANCE=[InstanceName]`，或者在 Linux 和 UNIX 上执行\
  \ `export DB2INSTANCE=[InstanceName]` 命令，其中 `InstanceName` 是分配给你希望作为默认实例的实例的名称），或者必须附加（`attach`）到实例。应用程序和用户可以通过执行\
  \ `ATTACH` 命令附加到任何实例。\n\n### 问题 4\n\n正确答案是 **B.** 你使用 `db2set` 系统命令来确定设置了哪些注册表变量以及它们设置的值，或者为一个或多个注册表变量赋值。`-g`\
  \ 选项表示要显示、设置或删除全局配置变量（记住此命令在 UNIX 服务器上需要 root 权限），因此答案 B 是正确的。`-all` 选项指定显示注册表变量的所有出现情况（环境、节点、实例和全局），因此答案\
  \ C 无效，且答案 A 将仅为默认实例设置 `DB2COMM` 变量。\n\n### 问题 5\n\n正确答案是 **D.** 你可以通过仅向 `db2set`\
  \ 命令提供变量名和等号来删除分配给任何注册表变量的值。因此，要禁用名为 `TEST` 的实例的 `DB2COMM` 实例级注册表变量，你需要执行如下所示的 `db2set`\
  \ 命令：\n\n![Image](img/147-1.jpg)\n\n### 问题 6\n\n正确答案是 **A.** 执行 `GET DATABASE CONFIGURATION`\
  \ 命令可以显示特定数据库配置文件的内容。该命令的语法如下：\n\n![Image](img/147-2.jpg)\n\n| 其中: |\n\n| `DatabaseAlias`\
  \ | 标识要分配给显示配置信息的数据库别名 |\n\n因此，要查看名为 `SAMPLE` 的数据库的配置文件内容，你需要执行 `GET DATABASE CONFIGURATION`\
  \ 命令：\n\n![Image](img/147-3.jpg)\n\n### 问题 7\n\n正确答案是 **A.** `MAXAPPLS` 配置参数指定了连接到数据库的最大并发应用程序数量。将\
  \ `MAXAPPLS` 设置为 `AUTOMATIC` 的效果是允许任意数量的应用程序连接数据库。在某种程度上，应用程序的最大数量也受 `MAX_COORDAGENTS`\
  \ 数据库管理器配置参数的限制。只有当连接和协调代理均可用时，应用程序才能连接到数据库。\n\n`AVG_APPLS` 数据库参数用于优化器确定为 SQL 语句所选执行计划在运行时可用的缓冲池空间。`NUM_INITAGENTS`\
  \ 是数据库管理器配置参数，用于确定实例启动时在代理池中创建的初始空闲代理数量。`NUM_POOLAGENTS` 是数据库管理器配置参数，用于设置空闲代理池的最大\
  \ own。\n\n### 问题 8\n\n正确答案是 **B.** 你使用 `LOGARCHMETH1` 数据库配置参数来指定归档日志主要目的地的介质类型以及是否使用归档日志。如果此参数设置为\
  \ `OFF`，则使用循环日志且无法进行前滚恢复；如果此参数设置为 `LOGRETAIN`，则使用归档日志并可以进行前滚恢复。`MIRRORLOGPATH` 数据库配置参数指定存储活动日志文件第二个副本的位置。\n\
  \n`NEWLOGPATH` 指定了用于存储恢复日志的备用路径；`LOGSECOND` 指明可用于数据库恢复的次要日志文件数量；`LOGARCHMETH2` 指定了归档日志次要目的地的介质类型。\n\
  \n### 问题 9\n\n正确答案是 **C.** `SHEAPTHRESH` DB2 数据库管理器配置参数指定了用于排序操作的总内存（以页为单位）的实例级软限制；`SORTHEAP`\
  \ 数据库配置参数指示用于私有排序的私有内存页数，或用于共享排序的的最大共享内存页数。每个排序操作消耗 10 MB——或 2500 页（10,000 KB /\
  \ 4 KB = 2500 页）。可用排序的总内存为 37500 页，每个排序操作最多消耗 2500 页，因此 37500 / 2500 = 15。\n\n###\
  \ 问题 10\n\n正确答案是 **B.** 你使用 `LOCKTIMEOUT` 数据库配置参数指定应用程序等待锁的秒数——如果给此参数分配 `-1`，应用程序将无限等待锁。`LOCKLIST`\
  \ 数据库配置参数指定了用于持有锁列表的最大内存（以页为单位）；`DLCHKTIME` 配置参数指示数据库管理器检查连接到数据库的所有应用程序之间死锁的频率；`MAXLOCKS`\
  \ 配置参数指定了应用程序持有的锁列表达到百分比后，DB2 数据库管理器执行锁升级。\n\n### 问题 11\n\n正确答案是 **C.** 通过执行 `UPDATE\
  \ DATABASE CONFIGURATION` 命令可以更改特定数据库配置文件参数的值。该命令的语法如下：\n\n![Image](img/148.jpg)\n\
  \n| 其中: |\n\n| `DatabaseAlias` | 标识要修改配置信息的数据库别名 |\n\n| `Parameter` | 标识要修改的一个或多个数据库配置参数（通过关键字）（通常参数的关键字与参数名称相同）\
  \ |\n\n| `Value` | 标识要分配给指定的数据库配置参数的新值 |\n\n如果你在 `UPDATE DATABASE CONFIGURATION`\
  \ 命令中指定 `DEFERRED` 子句，对数据库配置文件的更改在终止到相应数据库的所有连接并建立新连接之前不会生效。如果你指定 `IMMEDIATE` 子句或不指定任何子句，对数据库配置文件的所有更改将立即生效——前提是可用可用。\n\
  \n\n\n\n正确答案是 `A.`。如果你在 `UPDATE DATABASE CONFIGURATION` 命令中指定了 `IMMEDIATE` 子句，或者不指定任何子句，则对数据库配置文件的所有更改将立即生效——前提是可用所需的资源。在配置更改时正在数据库上运行的应用程序将在下次执行\
  \ SQL 语句时看到更改。\n\n### 问题 13\n\n正确答案是 `D.`。`AUTOCONFIGURE` 命令旨在捕获有关你的数据库环境的特定信息，并根据提供的信息提出建议和或对配置参数进行更改。该命令的基本语法如下：\n\
  \n![Image](img/149.jpg)\n\n| 说明: | |\n| :--- | :--- |\n| `Keyword` | 指定一个或多个 `AUTOCONFIGURE`\
  \ 命令识别的特殊关键字；有效值包括 `mem_percent`、`workload_type`、`num_stmts`、`tpm`、`admin_priority`、`is_populated`、`num_local_apps`、`num_remote_apps`、`isolation`\
  \ 和 `bp_resizable` |\n| `Value` | 标识与提供的关键字关联的值 |\n\n如果你在 `AUTOCONFIGURE` 命令中指定\
  \ `APPLY DB ONLY` 子句，则 Design Advisor 建议的数据库配置和缓冲区池更改将应用到适当的数据库配置文件；如果你指定 `APPLY\
  \ DB AND DBM` 子句，则建议的数据库配置和缓冲区池更改将应用于数据库配置文件，而建议的实例配置更改将应用于适当的 DB2 数据库管理器配置文件。如果你改为指定\
  \ `APPLY NONE` 子句，则将显示更改建议，但不会应用。\n\n### 问题 14\n\n正确答案是 `A.`。`AUTOCONFIGURE` 命令（以及\
  \ Design Advisor）始终会建议配置数据库以利用 STMM。然而，如果你在一个 `SHEAPTHRES` 配置参数被分配了非零值的实例中对数据库运行\
  \ `AUTOCONFIGURE` 命令，则 `SORTHEAP` 配置参数将不会被配置为自动调优。因此，在执行 `AUTOCONFIGURE` 命令之前，你必须执行命令\
  \ `UPDATE DATABASE MANAGER CONFIGURATION USING SHEAPTHRES 0` 以便启用排序内存调优。\n\n###\
  \ 问题 15\n\n正确答案是 `A` 和 `C.`。如果你选择手动配置通信，你必须遵循的步骤可能根据你使用的通信协议而异。例如，要配置服务器使用 TCP/IP，你必须执行以下步骤：\n\
  \n1. 为 `DB2COMM` 注册表变量分配值 `TCPIP`。\n\n   分配给 `DB2COMM` 注册表变量的值决定了启动特定实例的 DB2 数据库管理器运行时激活哪些通信管理器。你通过执行\
  \ `db2set` 命令为 `DB2COMM` 注册表变量分配值 `TCPIP`：\n\n   ![Image](img/150-1.jpg)\n\n2. 将数据库服务器将用于接收远程客户端通信的\
  \ TCP/IP 端口名称分配给 DB2 数据库管理器配置文件的 `svcename` 参数。\n\n   `svcename` 参数设置为与主连接端口关联的服务，这样当数据库服务器启动时，它可以确定在哪个端口上监听入站的连接请求。要设置此参数，请执行\
  \ `UPDATE DATABASE MANAGER CONFIGURATION` 命令：\n\n   ![Image](img/150-2.jpg)\n\n\
  3. 更新数据库服务器上的 services 文件。\n\n   TCP/IP services 文件标识了服务器应用程序监听客户端请求的端口。如果你在 DB2\
  \ 数据库管理器配置文件的 `svcename` 参数中指定了服务名，你必须在服务器的 services 文件中添加相应的服务名到端口号/协议映射。（如果你在\
  \ `svcename` 参数中指定了端口号，则不需要更新 services 文件。）\n\n   DB2 数据库服务器的 services 文件中的项可能如下所示：\n\
  \n   ![Image](img/150-3.jpg)\n\n### 问题 16\n\n正确答案是 `A.`。`ALT_DIAGPATH` 是一个数据库管理器配置参数，用于在主诊断数据路径\
  \ `DIAGPATH` 不可用时为 DB2 诊断信息指定一个完全限定备用路径。其他选项——B、C 和 D——都是错误的，因为没有用于备用诊断日志路径的数据库、DB2\
  \ 注册表和环境变量。\n\n### 问题 17\n\n正确答案是 `C.`。聚合注册表变量是由多个注册表变量组成的一个组，通过一个注册表变量名称进行标识。组中的每个注册表变量都有预定义的设置。聚合注册表变量的目的是为了根据广泛的操作目标简化注册表配置。\n\
  \n你可以使用聚合注册表变量来显式定义任何隐式配置的注册表变量，这在某种程度上覆盖了聚合注册表变量的隐式值。\n\n选项 A 是错误的——聚合注册表变量不能覆盖注册表变量。选项\
  \ B 也是错误的——聚合注册表变量可以通过显式设置注册表的值被轻松覆盖。选项 D 也是错误的——显式的注册表设置优先级高于隐式的聚合注册表设置。\n\n###\
  \ 问题 18\n\n正确答案是 `A` 和 `D.`。你可以通过执行 `FORCE APPLICATION` 命令提前终止一个或多个正在运行的应用程序（假设你有\
  \ `SYSADMN` 或 `SYSCTRL` 权限）。该命令的基本语法为：\n\n![Image](img/151-1.jpg)\n\n或\n\n![Image](img/151-2.jpg)\n\
  \n| 说明: | |\n| :--- | :--- |\n| `ApplicationHandle` | 标识与要终止的一个多个应用程序关联的句柄 |\n\n\
  因此，要强制连接到名为 `DB_SERVER` 的数据库的用户和应用程序终止连接，请执行 `FORCE APPLICATION` 命令：\n\n![Image](img/151-3.jpg)\n\
  \n然而，如果你想强制句柄为 `148` 的特定应用程序终止处理，请执行如下的 `FORCE APPLICATION` 命令：\n\n![Image](img/151-4.jpg)\n\
  \n### 问题 19\n\n正确答案是 `C.`。通过自动统计收集，数据库管理器决定是否必须更新统计信息。自动统计收集可以在编译时通过使用实时统计功能同步进行，也可以通过启用\
  \ `RUNSTATS` 命令在后台进行异步收集。你可以通过设置以下数据库配置参数来启用或禁用自动统计：\n\n*   `AUTO_MAINT`\n*   `AUTO_TBL_MAINT`\n\
  *   `AUTO_RUNSTATS`\n*   `AUTO_STMT_STATS`\n\n在答案 A、B 和 D 中，一个或多个参数未设置以形成完整的自动统计。\n\
  \n### 问题 20\n\n正确答案是 `D.`。STMM 以三种状态工作：\n\n*   `OFF`\n*   `ON (Active)`\n*   `ON\
  \ (Inactive)`\n\n如果参数指定为 `ON (Active)`，则内存调优程序正在调优系统内存。如果参数指示为 `Inactive`，虽然参数设置为\
  \ ON，但由于少于两个内存参数启用自调优，因此自调优并未发生。如果参数指定为 `OFF`，那么当然没有启用内存调优。\n\n选项 A 是错误的，因为 STMM\
  \ 在 Inactive 状态下不会调优实例内存。选项 B 是错误的，因为 STMM 不调优操作系统内存。选项 C 是错误的，因为所有 STMM 参数都可以在线配置，不需要重启实例或数据库。\n\
  \n### 问题 21\n\n\n\n\n正确答案是 `A.` 你可以通过将设置 `AUTO_MAINT`、`AUTO_TBL_MAINT` 和 `AUTO_REORG`\
  \ 数据库配置参数为 ON 或 OFF 来启用或禁用自动重组维护。其他的数据库配置参数选项在某种程度上都是错误的。\n\n### Question 22\n\n\
  正确答案是 `B.` 你可以使用自动维护来执行以下维护操作：\n\n*   创建数据库的备份映像。自动数据库备份为用户提供了一种解决方案，帮助确保数据库得到正确且定期的备份，而用户无需担心何时进行备份，也不需要了解\
  \ `BACKUP` 命令的语法。\n*   整理数据碎片（表或索引重组）。此维护活动可以提高 DB2 数据库管理器访问表的效率。自动重组可以管理离线表和索引重组，而用户无需担心何时以及如何重组其数据。\n\
  *   优化数据访问（运行 `RUNSTATS`）。DB2 数据库管理器会更新关于表中的数据、表索引中的数据或表及其索引中数据的系统目录统计信息。DB2 优化器使用这些统计信息来确定响应查询时访问数据的路径。自动统计收集尝试通过维护最新的表统计信息来提高数据库性能。其目标是让\
  \ DB2 优化器始终根据准确的统计信息选择访问计划。\n*   执行统计分析。自动统计分析通过检测过时、缺失和指定错误的统计信息，并根据查询反馈生成统计配置文件，建议何时以及如何收集表信息。\n\
  \n### Question 23\n\n正确答案是 `C.` 在创建 DB2 10.1 数据库时，默认启用了自动 `RUNSTATS` 和实时统计收集维护。然而，你需要在新创建的数据库上执行\
  \ `UPDATE DB CFG USING AUTO_REORG ON` 命令来显式启用重组维护。默认数据库配置参数设置如下：\n\n![Image](img/153-1.jpg)\n\
  \n### Question 24\n\n正确答案是 `C.` 为了控制实用程序节流（throttling），你必须建立影响策略。影响策略是指实例范围内的限制，所有节流的实用程序对生产工作负载的累积影响；一旦建立了此类策略，确保遵守该策略即是系统的责任。运行在实例中的所有启用了节流的实用程序的影响策略通过\
  \ `util_impact_lim` DB2 数据库管理器配置参数进行控制。该参数是动态的，因此可以在不停止和重启实例的情况下更改；甚至可以在启用节流的实用程序运行时进行设置。要定义所有节流实用程序的影响策略，你只需为\
  \ `util_impact_lim` 配置参数分配 1 到 100 之间的值即可。\n\n因此，要将所有节流实用程序对生产工作负载的累积实例范围限制设置为 20%（换句话说，确保所有节流实用程序带来的性能下降对系统工作负载的影响不超过\
  \ 20%），你需要执行 `UPDATE DATABASE MANAGER CONFIGURATION` 命令为 `util_impact_lim` 配置参数分配值\
  \ 20：\n\n![Image](img/153-2.jpg)\n\n### Question 25\n\n正确答案是 `A.` 要更改已运行实用程序的影响优先级（节流级别），请执行\
  \ `SET UTIL_IMPACT_PRIORITY` 命令。通过此命令，你可以：\n\n*   对在节流模式启动的运行中的实用程序进行节流\n*   对运行中的节流实用程序取消节流（禁用节流）\n\
  *   重新调整运行中的节流实用程序的优先级（如果同时运行了多个节流实用程序且其中一个比其他更重要，则此很有用）\n\n`SET UTIL_IMPACT_PRIORITY`\
  \ 命令的语法为：\n\n![Image](img/154-1.jpg)\n\n| where: | |\n| :--- | :--- |\n| `UtilityID`\
  \ | 通过 ID 标识要更改优先级的运行中实用程序（要获取分配给运行中实用程序的 ID，请执行 `LIST UTILITIES` 命令） |\n| `Priority`\
  \ | 指定与运行指定的实用程序相关的影响的实例级限制；值 100 代表最高优先级；值 1 代表最低优先级——将 `Priority` 设置为 0 将强制节流的实用程序继续以非节流模式运行；将\
  \ `Priority` 设置为非零值将强制非节流的实用程序继续以节流模式运行 |\n\n因此，如果你想强制一个已分配实用程序 ID 为 191 的运行中节流备份操作继续以非节流模式运行，你只需执行\
  \ `SET UTIL_IMPACT_PRIORITY` 命令：\n\n![Image](img/154-2.jpg)\n\n### Question 26\n\
  \n正确答案是 `C.` 当数据库启用自调优时，内存调优器会对数据库工作负载特征的重要变化做出响应，调整内存配置参数的值和缓冲池的大小以优化性能。你可以为自调优启用以下内存消耗者：\n\
  \n*   缓冲池（由 `ALTER BUFFERPOOL` 和 `CREATE BUFFERPOOL` 语句控制）\n*   包缓存（由 `PCKCACHESZ`\
  \ 参数控制）\n*   锁内存（由 `LOCKLIST` 和 `MAXLOCKS` 参数控制）\n*   排序内存（由 `SHEAPTHRES_SHR` 和\
  \ `SORTHEAP` 参数控制）\n*   数据库共享内存（由 `DATABASE_MEMORY` 参数控制）\n\n### Question 27\n\n\
  正确答案是 `A.` `STMM` 执行的更改记录在内存调优日志文件中，这些文件位于实例的 `mmlog` 子目录下。（第一个创建的文件命名为 `stmm.0.log`，第二个将被命名为\
  \ `stmm.1.log`，依此类推。）每个内存调优日志文件包含调优执行时消耗者的资源摘要。你可以通过检查内存调优日志中的时间戳来确定调优间隔。\n\n###\
  \ Question 28\n\n正确答案是 `A.` 自适应压缩使用两种压缩方法。第一种通过表级压缩字典（经典行压缩）根据对表的采样数据进行压缩。第二种通过页级字典根据每个页面内的重复数据进行压缩。字典将重复的字节模式映射为更小的符号；这些符号随后替换表中较长的字节模式。表级压缩字典位于创建它的表对象内部，用于压缩整个表的数据。页级压缩字典与数据存储在一起；仅用于压缩该页的数据。\n\
  \n### Question 29\n\n正确答案是 `C.` 你可以通过设置 `AUTO_MAINT` 和 `AUTO_DB_BACKUP` 数据库配置参数为\
  \ ON 或 OFF 来启用或禁用自动备份。当你创建一个新数据库时，默认 `AUTO_MAINT` 将设置为 ON。要激活自动备份维护，你必须显式将 `AUTO_DB_BACKUP`\
  \ 设置为 ON 并实施在线或离线维护策略以指定备份窗口。\n\n### Question 30\n\n正确答案是 `D.` `STMM` 以四种模式工作（如下）。你可以根据应用程序和业务需求使用其中一种。\n\
  \n**Mode 1:** 当 `DATABASE_MEMORY= AUTOMATIC`\n\n在这种情况下，所需的内存将从操作系统获取并在需要时归。DB2 使用的内存总量会随时间增长，仅受操作系统可用内存的限制。\n\
  \n**Mode 2:** 当 `DATABASE_MEMORY= <NUMERIC VALUE> AUTOMATIC`\n\n\n\n\n\n在这里，内存调优仍然发生，但数据库使用的总内存从\
  \ `NUMERIC` 值开始，并随时间推增长。它仅限于操作系统的可用内存。\n\n### 模式 3：当 `DATABASE_MEMORY=<NUMERIC VALUE>`\
  \ 时\n\nDB2 在启动期间分配此数量的内存，且此内存设置是静态的。它无法根据需要从操作系统获取内存或向操作系统释放内存。\n\n### 模式 4：当 `DATABASE_MEMORY=COMPUTED`\
  \ 时\n\n数据库内存根据数据库启动期间内存堆（memory heaps）初始值之和计算得出。在这种情况下，`database_memory` 未启用自调优。\n\
  \n### 问题 31\n\n正确答案是 `A` 和 `D`。STMM 在三种不同的状态下工作：\n\n* OFF（关闭）\n* ON（Active 激活）\n\
  * ON（Inactive 未激活）\n\n如果参数指定 `ON (Active)`，则内存调优程序正在对系统内存进行调优。如果参数指示 `ON (Inactive)`，尽管参数设置为\
  \ `ON`，但并没有进行自调优，因为启用自调优的内存参数少于两个。如果参数指定 `OFF`，则未启用内存调优。\n\n### 问题 32\n\n正确答案是 `B`。你使用实例升级命令\
  \ `db2iupgrade` 将实例从 DB2 9.7 代码库升级到 DB2 10.1 代码库。你使用 `db2iupdt` 命令在版本发布内执行修复补丁包（fix\
  \ pack）升级。实例迁移命令 `db2imigr` 在 DB2 10.1 中已弃用，不应用于升级目的。数据库升级命令没有更改，你可以在升级实例后运行该命令。更多详细信息，请参阅本章开头的升级实例部分。\n\
  \n### 问题 33\n\n正确答案是 `B`。聚合注册表变量（aggregate registry variable）是一组作为配置的注册表变量，通过一个注册表名称进行标识。组中的每个注册表变量都有预定义的设置。聚合注册表变量的目的是为广泛的操作目标简化注册表配置。\n\
  \n在 DB2 10.1 中，唯一有效的聚合注册表变量是 `DB2_WORKLOAD`。\n\n### 问题 34\n\n正确答案是 `D`。当你在 DB2 10.1\
  \ 中创建数据库时，默认存储组 `IBMSTOGROUP` 会自动创建。你可以在 `CREATE DATABASE` 命令中为它建立一个或多个初始存储路径。随着数据库的增长，数据库管理器会在这些存储路径上创建容器，并根据需要扩展它们或自动创建新容器。\n\
  \n### 问题 35\n\n正确答案是 `A`。你还可以使用 `ADMIN_GET_STORAGE_PATHS` 表函数列出每个数据库存储组的自动存储路径，包括每个存储组的文件系统信息：\n\
  \n![Image](img/157-1.jpg)\n\n### 问题 36\n\n正确答案是 `C`。DB2 10.1 中的压缩功能包括：\n\n* 自适应压缩（Adaptive\
  \ compression）——经典行和页级压缩组合；你通过使用 `CREATE TABLE` 或 `ALTER TABLE` 命令激活它：\n    ![Image](img/157-2.jpg)\n\
  * 归档日志压缩（Archive log compression）——在存储服务器上归档事务日志之前对其进行压缩；你通过使用 `UPDATE DB CFG` 命令激活此功能：\n\
  \    ![Image](img/157-3.jpg)\n* XML 对象压缩（XML object compression）——引入于 DB2 9.7，并压缩位于\
  \ XDA 区域内的 XML 数据；当使用 `COMPRESS YES` 选项创建表或修改表以使用压缩时，此功能会隐式激活\n\n可操作压缩（Actionable\
  \ compression）是 DB2 10.5 的一项功能，它使用近似霍夫曼编码、前缀压缩和偏移压缩。可操作压缩提供了许多优势，其中之一是在处理 SQL 过滤谓词（如\
  \ `=`, `<`, `>`, `>=`, `<=`, `BETWEEN`）、`joins`（连接）、`aggregations`（聚合）等时，数据不会被解压缩。相反，解压缩只在结果集返回给用户时才发生。\n\
  \n### 问题 37\n\n正确答案是 `A`。每当你创建数据库时，配置顾问（Configuration Advisor）都会被自动调用。要更改此行为，你需要将值\
  \ `NO` 赋值给 `DB2_ENABLE_AUTOCONFIG_DEFAULT` 注册表变量。建议在创建数据库之前检查此注册表变量设置。\n\n### 问题\
  \ 38\n\n正确答案是 `A`。锁内存由 `locklist` 和 `maxlocks` 数据库配置参数控制。`locklist` 参数指示分配给锁列表的存储量。每个数据库有一个锁列表，它包含了所有并发连接到数据库的应用程序所有的锁。`maxlocks`\
  \ 参数定义了应用程序持有的锁列表的百分比，该百分比填满后数据库管理器才会执行锁升级（lock escalation）。要启用 `locklist` 配置参数的自调优，必须同时启用\
  \ `maxlocks`。\n\n### 问题 39\n\n正确答案是 `B`。当为分区数据库启用自调优内存时，单个数据库分区被指定为调优分区，所有的内存调优决策都基于该数据库分区的内存和负载特征。在该分区上做出调优决策后，内存调整将分配到其他数据库分区，以确保所有数据库分区保持相似的配置。\n\
  \n### 问题 40\n\n正确答案是 `B`。自调优内存仅在 HADR 主服务器上运行。当在 HADR 对上激活自调优内存时，它不会在备服务器上运行，而只在主服务器上运行。如果你在当前的备机器上运行\
  \ `HADR TAKEOVER` 命令，自调优内存也会切换到新的主机器。\n\n### 问题 41\n\n正确答案是 `A` 和 `E`。IBM Data Studio\
