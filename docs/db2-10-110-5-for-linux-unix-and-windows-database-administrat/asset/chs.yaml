  \n**注意：** 在向影子表的行父表加载大量数据时，建议通过运行 `RUNSTATS` 工具来手动为影子表收集统计信息。如果工作负载将在加载完成后立即执行，这一点尤为重要。数据加载与实时统计收集器操作之间存在时间差。如果加载过程是在维护窗口内批量执行的，在此期间几小时内不会执行工作负载，则\
  \ `RTS` 函数将执行所需的工作：\n\n![Image](img/1104-2.jpg)\n\n# 工具：将行表转换为列表\n\n有几种方法可以将行组织表转换为列组织。在查看它们之前，你需要记住几个关键点。转换为列是单行道。目前没有回转到行的操作，因此请采取必要的预防。在许多情况下，行组织表被放置在未针对列进行正确配置的表空间中；因此，建议将转换后的表移动到新的、定义良好的表空间。这将允许移动操作执行得更高效。\n\
  \n某些类型的表无法转换：\n\n*   RCT\n*   类型表\n*   MQT\n*   声明全局临时表\n*   创建的全局临时表\n*   带有 XML\
  \ 或 LOB 列的表\n*   非自动存储表空间中的表\n*   带有生成列的表\n\n## ADMIN_MOVE_TABLE\n\n你可以使用 `ADMIN_MOVE_TABLE`\
  \ 存储过程移动行组织表，并在过程中将其转换为列组织。适用以下限制条件：\n\n*   无法强制外键约束。\n*   无法强制检查约束。\n*   无法定义主键约束。\n\
  \n在接下来的示例中，`SCH1.TATTR_STG` 表被移动到 `XXA10500`（数据）和 `XXX10500`（索引），并在过程中转换为列组织。如果你想移动表而不进行复制它，请使用\
  \ `COPY_USE_LOAD` 选项：\n\n![Image](img/1105.jpg)\n\n## db2convert\n\n`db2convert`\
  \ 是 `ADMIN_MOVE_TABLE` 的可执行程序包装器，包含了一些实用的功能。可以通过一个命令转换数据库中的所有表，尽管这样做可能并不被推荐。使用 `-force`\
  \ 参数将转换所有表，包括范围分区表、MDC 和 ITC 表：\n\n![Image](img/1106-1.jpg)\n\n你也可以在特定阶段停止执行。例如，`-stopbeforeswap`\
  \ 将在交换（swap）阶段停止移动操作，防止进入 INIT、COPY 和 REPLAY 阶段，直到请求者对提示做出响应。这将允许请求者在继续之前执行在线备份。\n\
  \n`–check` 选项允许用户运行 `db2convert` 程序进行验证而不进行任何更改。这是在实际运行程序之前确保所有条件都满足的有用方法。\n\n以下是几个示例：\n\
  \n![Image](img/1106-2.jpg)\n\n# 回收列组织表中的删除空间\n\n列组织表没有聚集索引，因此除非用于恢复伪删除行，否则传统的 `REORG`\
  \ 操作是不必要的。你可以手动执行该命令，但它会通过 `AUTO_REORG` 自动执行。恢复的区可以被表空间中的任何列组织表使用。\n\n要回收区，请执行类似下面的\
  \ `REORG` 命令：\n\n![Image](img/1107.jpg)\n\n## PureScale\n\nIBM DB2 pureScale 集群技术是过去\
  \ 10 年数据库技术领域最重要的成就。PureScale 于 2010 年作为 IBM DB2 9.8 引入。运行 pureScale 可以通过提供以下功能节省成本：\n\
  \n*   无限扩展性\n*   无容量浪费\n*   无空闲备用服务器成本\n*   无需 DBA 花费时间在服务器之间移动数据库\n*   能够在无停机的情况下增加容量\n\
  *   在集群级或成员子集级管理资源的能力\n*   自动化释放 DBA 时间来处理业务需求\n*   更高的可用性，并随每次发布而不断提高\n*   更易于维护，因为通常可以在成员级进行且不中断服务\n\
  \npureScale 与 DB2 工作负载的服务器虚拟化相比如何？表 10.19](#017_Chapter010.html_tab10.19) 列出了比较，但请注意这些并不是竞争技术。pureScale\
  \ 可以运行在虚拟镜像上。还需要注意，我们只讨论数据库工作负载，特别是 DB2（假设 pureScale 运行在裸机或专用 LPAR 上）。\n\n| 表 10.19：pureScale\
  \ 与虚拟化对比 |\n| 测量 | pureScale | 虚拟化 |\n| :--- | :--- | :--- |\n| 增加容量（内存/CPU）——无停机\
  \ | 是 | |\n| 性能 | 是 | |\n| 所有工作负载 | | 是 |\n| 可扩展性——无限 | 是 | |\n| 无资源浪费 | 是 | |\n\
  | 准备——初始规划和设置 | | 是 |\n| 具有经验的工作人员 | | 是 |\n| 解决性能问题 | 是 | |\n| 复杂性——可能取决于硬件 | 是\
  \ | |\n| 数据库工作负载的成本节省 | 是 | |\n\n迁移到 pureScale 意味着改变数据管理方式。对于无共享架构，大多数工作负载是隔离管理的。这通常意味着工作负载按服务器、实例和数据库进行分离。对于大型\
  \ UNIX/Windows 商店，这体现在支持和管理方面的爆炸性增长。\n\n有些公司通过虚拟化来应对这个问题。这导致用一个问题取代另一个问题，而没有解决爆炸性增长问题。提供镜像而非服务器使得准备更快，但围绕尺寸、性能、容量和核心产品升级的挑战带来了新的管理机会。\n\
  \n\n\n\n\n从 `DB2` 10.5 FP4 开始，IBM 通过滚动升级提高了可用性。一个 `DB2` 版本包含两个标识其版本的标记。其中一个是架构级别，另一个是代码级别。每个\
  \ `DB2` 版本都有一个特定的代码级别，而架构级别可能保持不变。这些分别被称为 `当前有效架构级别 (CEAL)` 和 `当前有效代码级别 (CECL)`。\n\
  \n如果你想显示任何版本的标记，请执行以下命令：\n\n![Image](img/1108-1109.jpg)\n\n如图 10.59 所示，在线（滚动）升级过程非常简单。你打算升级的每个集群都有一个\
  \ `CECL` 级别，该级别必须在所有成员和 `CFs`（缓存协调器）之间保持一致。当你升级每个成员和 `CF` ，，它们各自的 `CECL` 级别将更改为新版本的\
  \ `CECL`。一旦所有节点都升级到该版本的 `CECL` 级别，集群的 `CECL` 级别将更改以进行匹配。\n\n![Image](img/1109.jpg)\n\
  \n*图 10.59: 在线滚动修复包升级*\n\n# PureScale 集群的在线（滚动）升级\n\n你可以在线或离线升级 pureScale 软件，但以下步骤仅提供在线升级方法的详细说明。\n\
  \n**步骤 1：** 将未压缩的修复包放置在所有成员和 `CFs` 均可访问的文件系统上。\n\n**步骤 2：** 在每个成员上逐一运行以下命令：\n\n\
  ![Image](img/1110-1.jpg)\n\n在继续处理 `CF` 之前，确保软件已成功安装在所有成员上。\n\n**步骤 3：** 使用步骤 2 中的命令将修复包应用到备用\
  \ `CF`。\n\n在继续之前，确认备用 `CF` 处于对等状态（peer state）。使用 `db2instance –list` 命令验证这一点。\n\n\
  **步骤 4：** 使用步骤 2 中的命令将修复包应用到主 `CF`。\n\n**步骤 5：** 执行此命令，检查所有成员和 `CFs` 是否已妥善升级：\n\n\
  ![Image](img/1110-2.jpg)\n\n**步骤 6：** 运行以下命令提交升级：\n\n![Image](img/1110-3.jpg)\n\n\
  **步骤 7：** 执行 `db2updv105` 将更改应用到现有数据库 `DB2` 目录：\n\n![Image](img/1110-4.jpg)\n\n\
  可能需要如 `–o`（Oracle 兼容视图）和 `–a`（强制执行所有函数）等选项。\n\n# 检查升级进度和状态\n\n在升级过程中，你可以通过运行此命令获取状态信息：\n\
  \n![Image](img/1111.jpg)\n\n获取实例代码信息的另一种方法是使用表函数“`ENV_GET_INSTANCE_CODE_LEVEL`”:\n\
  \n![Image](img/1112.jpg)\n\n# HADR 配置下 PureScale 的在线（滚动）升级\n\n要执行此升级方法，你需要使用之前列出的步骤，但有几个额外需要考虑的项目：\n\
  \n1. 完全升级备用集群——所有成员和 `CFs`。\n2. 如上一节所述，在升级备用 `CF` 之前先升级备用集群中的成员，但将当前的重放成员留最后。\n\
  3. 在对主集群执行任何工作之前，验证备用集群上的所有成员和 `CFs` 已升级。\n4. 按照上一节的方法升级主集群。\n5. 只有在两个集群都完全升级后，该集群才被认为是同质的\
  \ (`homogenous`)。\n\n# 添加 PureScale 成员\n\n通过 `DB2` 10.5，现在可以在不需要停机的情况下扩展 pureScale\
  \ 集群的容量。你可以向现有服务器或新服务器添加 pureScale 成员或 `CF`。该过程与在初始成员和 `CF` 之后添加第二个 `CF` 或成员的过程基本相同。\n\
  \n新服务器需要所有的初始安装步骤和网络配置更改，以便在集群内添加路由。在讨论中假设服务器已正确配置并布线。\n\n你想添加一个具有双 LPAR 配置的新裸机服务器，每个\
  \ LPAR 具有相等的资源和专用网络适配器。现在可能是回顾“pureScale 模型”部分中“安装 DB2”的好时机，因为你将向该配置中添加内容。\n\n**步骤\
  \ 1：** 修改集群中所有 LPAR 上的 `/etc/hosts` 文件以反映两个 LPAR 的添加。\n\n以下 `/etc/hosts` 文件显示了当前配置：\n\
  \n![Image](img/1113.jpg)\n\n你想添加 `MEMSERVER4` 和 `MEMSERVER5`。因此，新的 `/etc/hosts`\
  \ 文件如下所示，并将放在集群中的每个 LPAR 上：\n\n![Image](img/1114.jpg)\n\n注意，你的 pureScale 集群的每个组件有两个条目。这是因为你正在使用“双路径”通过冗余来实现高可用性。此外，通过使用\
  \ InfiniBand 和 DIY 配置，可以对这些路径进行负载均衡以实现高带宽和大容量。\n\n**步骤 2：** 验证免密 SSH 是否正常工作。你可以从任何现有服务器以\
