  \n为了捕获跨所有成员的特定工作负载的锁日志信息，例如死锁数量、锁等待时间、锁等待次数、锁超时次数、锁升级次数以及日志缓冲区等待时间（这是代理等待日志缓冲区区域空间消耗的时间，单位为毫秒），请执行此查询：\n\
  \n![Image](img/408-1.jpg)\n\n如果你想查看数据库系统上的工作单元特征，例如总 CPU 时间、总等待时间、应用程序请求数、排序时间和排序溢出、总\
  \ SQL 编译时间以及总提交时间，请执行以下语句：\n\n![Image](img/408-2.jpg)\n\n为了捕获当前数据库连接的连接开始时间、总缓冲池读取时间（单位为毫秒）、缓冲池逻辑读取、缓冲池物理读取、返回的记录数以及通过\
  \ TCP/IP 网络发送的数据量，你可以通过执行以下查询来实现：\n\n![Image](img/409.jpg)\n\n如果你想通过 XML 文档格式使用\
  \ `MON_GET_CONNECTION_DETAILS` 表函数捕获相同的连接信息，请执行此查询：\n\n![Image](img/409-410.jpg)\n\
  \n`DETAILS` 列中返回的 XML 文档架构可以在文件 `sqllib/misc/DB2MonRoutines.xsd` 中找到，你可以使用它来扩展函数中的数据选择。\n\
  \n数据库配置参数 `mon_req_metrics` 控制跨数据库服务器的请求监控元素的数据收集。你可以将该参数设置为以下值之一：\n\n* `NONE`——不收集任何请求监控元素。\n\
  * `BASE`——收集所有请求监控元素。这是默认值。\n* `EXTENDED`——以更细粒度收集所有请求监控元素并封装在 XML 中。\n\n或者，你可以在创建或更改服务类时使用\
  \ `COLLECT REQUEST METRICS` 子句来控制单个服务类的请求监控。\n\n为数据库 `SAMPLE` 激活 `EXTENDED` 请求监控，请执行\
  \ `UPDATE DB CFG` 命令，如下：\n\n![Image](img/410.jpg)\n\n然而，如果你想修改现有的 WLM 服务类，请使用类似这样的\
  \ `ALTER SERVICE CLASS` 命令：\n\n![Image](img/411.jpg)\n\n## 监控活动\n\n监控元素是请求监控元素的子集。活动监控视角关注与\
  \ SQL 语句执行相关的活动。对于进行中的活动，活动指标累积在内存中。对于 SQL 语句活动，活动指标累积在包缓存中。在包缓存中，活动指标按每个 SQL 语句部分的所有执行进行聚合。\n\
  \n表 5.4 列出了访问活动信息的表函数。\n\n| 表 5.4：监控活动的表函数 |\n\n| 表函数名称 | 返回的信息 |\n| :--- | :---\
  \ |\n| MON_GET_ACTIVITY_DETAILS | 返回活动的详细信息，包括调用时的 SQL 语句文本 |\n| MON_GET_PKG_CACHE_STMT\
  \ | 返回数据库包缓存中静态和动态 SQL 语句的时间点视图 |\n| MON_GET_PKG_CACHE_STMT_DETAILS | 返回一个更多包缓存的详细指标\
  \ |\n\n要查找系统中当前运行的所有活动的详细信息，请使用类似于下面的查询：\n\n![Image](img/411-412.jpg)\n\n![Image](img/412.jpg)\n\
  \n\n\n\n\n在上面的示例中，`WLM_GET_WORKLOAD_OCCURRENCE_ACTVITIES` 函数将应用程序句柄、工作单元 ID 和活动\
  \ ID 等活动信息传递给 `MON_GET_ACTIVITY_DETAILS` 函数，以捕获当前执行的 SQL 活动细节。与 `MON_GET_ACTIVITY_DETAILS`\
  \ 返回活动的瞬时视图不同，`MON_GET_PACKAGE_CACHE_STMT` 返回自 DB2 实例启动以来动态和静态 SQL 语句的信息。\n\n如果你想捕获一段时间内进行大量数据读取的高成本动态和静态\
  \ SQL 语句，可以使用类似下面的查询：\n\n![Image](img/413.jpg)\n\n在示例查询片段中，从数据库读取的记录总数为 315,970\
  \ 条——其中第一条语句 `SELECT COUNT (*) FROM t1,` 读取了 294,912 条记录；但它只向应用程序返回了一条记录。第二条语句 `SELECT\
  \ * FROM t1 WHERE ID=2,` 读取了 21,058 条记录，向应用程序返回了 4,679 条记录。为了使读取活动达到 100% 的效率，`READ_EFFICIENCY`\
  \ 应该始终小于 10。这意味着 SQL 语句仅读取了应用程序所需的记录。你通过在底层表上建立适当层级的索引来实现这一点。你可以使用 `MON_GET_PKG_CACHE_STMT_DETAILS`\
  \ 函数以 XML 格式提取与示例查询类似的类似信息，并具有更细粒度的细节。\n\n与请求监控元素类似，数据库配置参数 `mon_act_metrics` 控制跨越数据库服务器的活动监控元素收集的数据。你可以将该参数设置为以下值之一：\n\
  \n*   `NONE`——不收集请求监控元素。\n*   `BASE`——收集所有活动监控元素。这是默认值。\n*   `EXTENDED`——以更细粒度的级别收集所有活动监控元素，并封装在\
  \ XML 格式中。\n\n或者，你可以在创建或更改服务类时，使用 `COLLECT ACTIVITY METRICS` 子句来控制单个 WLM 服务类的监控活动指标收集。\n\
  \n如果你想为数据库 `SAMPLE,` 激活 `EXTENDED` 监控活动指标监控，请执行 `UPDATE DB CFG` 命令，如下所示：\n\n![Image](img/414-1.jpg)\n\
  \n然而，要更改现有的 WLM 服务子类（注意，父类无法更新活动数据），请使用 `ALTER SERVICE CLASS` 命令，如下：\n\n![Image](img/414-2.jpg)\n\
  \n## 监控数据对象\n\n数据对象监控视角侧重于提供对数据对象（如表、索引、缓冲池、表空间和容器）的操作的信息。每当请求涉及处理该对象时，数据对象的监控元素就会增加。例如，当你从特定表读取数据时，每当你读取该表时，读取行数的指标就会增加。然而，无法获取数据对象的历史数据。\n\
  \n表 5.5 列出了访问数据对象信息的表函数。\n\n| 表 5.5: 用于监控数据对象的表函数 |\n\n| 函数名称 | 返回信息 |\n| :--- |\
  \ :--- |\n| `MON_GET_BUFFERPOOL` | 返回一个或多个表缓冲池的监控指标 |\n| `MON_GET_TABLESPACE` |\
  \ 返回一个或多个表空间的监控指标 |\n| `MON_GET_CONTAINERS` | 返回一个或多个表容器的监控指标 |\n| `MON_GET_TABLE`\
  \ | 返回一个或多个表的监控指标 |\n| `MON_GET_INDEX` | 返回一个或多个表索引的监控指标 |\n\n构造引用监控数据对象表函数的查询的语法为：\n\
  \n![Image](img/415.jpg)\n\n| where: |\n| :--- | :--- |\n| `FunctionName` | 标识要使用的监控表函数名称（即\
  \ 表 5.5 中列出的函数之一） |\n| `FunctionSpecifics` | 标识监控表函数特有的对象信息，例如用于检索监控指标数据的缓冲池名称、表空间名称、表架构名称、表名、索引架构名称和索引名称\
  \ |\n| `Member` | 标识要收集监控指标数据的成员；你可以指定 `-1` 表示当前成员，或指定 `-2` 表示所有数据库成员 |\n| `CorrelationName`\
  \ | 标识分配给查询生成的结果集的名称 |\n\n你可以使用 `MON_GET_BUFFERPOOL` 表函数通过命中率来衡量缓冲池的效率。最高可能的命中率是\
  \ 100%；也就是说，应用程序请求的每个页面始终可用于缓冲池。如果应用程序请求的页面无法通过预取过程在缓冲池中可用，则命中率为 0% 或更低。在某些情况下，负命中率意味着预取器将页面带入缓冲池，但随后未被引用，因为查询在到达表空间结束之前停止了，或者预取页面在查询访问之前被\
  \ DB2 进程抢占并重复使用。\n\n要计算缓冲池命中率，你可以使用类似的查询：\n\n![Image](img/416.jpg)\n\n在 DB2 中，表空间是数据库最基本的逻辑存储结构。在大多数情况下，你需要找到表空间属性，如表空间类型、页大小、预取大小、重平衡模式、存储类型、状态、使用页面、可用页面和总页面。你可以通过\
  \ `LIST TABLESPACE SHOW DETAIL` 命令捕获这些信息；然而，使用新的数据对象监控元素表函数 `MON_GET_TABLESPACE`\
  \ 可以一次性检索所有信息，如下：\n\n![Image](img/417.jpg)\n\n在此示例中，预取等待时间显示了应用程序花多长时间等待 I/O 服务器（预取进程）完成从表空间容器将页面加载到缓冲池。如果预取等待次数和预取等待时间多得多，你将需要增加\
  \ I/O 服务器或使用 I/O 测试工具检查每秒输入/输出次数 (IOPS)。\n\nDB2 数据库管理器提供了 `MON_GET_CONTAINER` 函数来补充表空间发现。让我们继续之前的表空间故障排除示例。你已经确定\
  \ `USERSPACE1` 表空间具有较高的预取等待时间。现在你可以深入到容器级别，使用以下命令来识别高预取等待时间的原因：\n\n![Image](img/418.jpg)\n\
  \n预取等待时间较高的潜在原因是，大量的读取和写入可能是由于高磁盘排序，或者许多表具有 `LONG VARCHAR,` LOB 列，或者表空间 `USERSPACE1`\
  \ 频繁发生备份。你必须将数据库配置参数 `mon_obj_metrics` 设置为 `BASE` 或 `EXTENDED` 以激活收集上述函数报告的数据对象监控元素。\n\
  \n现在你已经检查了表空间容器级别，现在是时候深入到表和索引级别，识别 `USERSPACE1` 表空间中导致高预取等待时间的对象了：\n\n![Image](img/419-1.jpg)\n\
  \n由于你已经在逻辑上将问题从范围范围缩小到特定对象级别，你可以开始寻找减少读取和写入的解决方案。\n\n你还可以使用 `MON_GET_TABLE` 函数来确定昂贵的表扫描：\n\
  \n![Image](img/419-2.jpg)\n\n一如既往，解释表函数的输出是趣味且有趣的。表 `GDS_LEGALENT_STG` 中的记录总数为 560\
  \ 条：\n\n![Image](img/420.jpg)\n\n\n\n\n根据统计数据，数据加载可能只发生过一次，而此表主要用于数据读取目的。表扫描次数高是因为表中没有索引，因此你必须识别并创建适当的索引。\n\
  \n在 `DB2` 中，索引用于高效访问数据。你始终会产生维护索引的开销，这些开销包括：\n\n- 需要额外的存储空间来存储索引键以及实际数据。\n- 表对象页上的每次插入都需要在索引页上进行额外的插入。\n\
  - 表重组需要额外的时间来重建索引。\n- 在某些情况下，低效的索引会导致锁超时和死锁。\n\n建议在对使用的索引采取任何操作之前，务必识别数据库中未使用的索引并咨询应用程序团队。\n\
  \n你可以使用 `MON_GET_INDEX` 表函数来确定数据库中未使用的、低效的索引。命令看起来如下：\n\n![Image](img/420-421.jpg)\n\
  \n与未使用的索引不同，如果你想在数据库中找到极高效的索引，请执行类似下方的查询：\n\n![Image](img/421.jpg)\n\n## 监控锁\n\n\
  理解锁行为是解决数据库中锁等待和死锁性能问题的关键要素。你可以使用锁对象监控表函数来获取锁的信息。表 5.6 列出了用于访问锁对象信息的表函数，例如锁名称、锁模式、锁状态、锁等待、持有锁的应用程序、等待获取锁的应用程序以及锁属性。\n\
  \n| 表 5.6：监控锁的表函数 |\n\n| 表函数名称 | 返回信息 |\n| :--- | :--- |\n| `MON_GET_LOCKS` | 返回当前连接数据库中所有锁的列表\
  \ |\n| `MON_GET_APPL_LOCKWAIT` | 返回每个应用程序代理连接到当前数据库时正在等待获取的所有锁的信息 |\n\n以下示例说明了如何使用锁表函数识别数据库中的锁问题。在此例中，两个事务——`TR1`\
  \ 和 `TR2` 分别尝试读取和修改表 `T1` 中的数据。当 `TR1` 和 `TR2` 同时执行时，`TR2` 停止了处理。为了捕获应用程序句柄、锁和锁属性，请使用\
  \ 表 5.6 列出的表函数来分析潜在的锁问题：\n\n![Image](img/422.jpg)\n\n你可以使用 `MON_GET_LOCKS` 表函数来识别锁模式以及属性，如更新/插入行锁、锁升级过程获取的锁以及通过可重复读扫描获取的锁：\n\
  \n![Image](img/422-423.jpg)\n\n`LOCK_ ATTRIBUTES` 列 `G` 代表当前持有锁的应用程序，`W` 或 `C` 表示当前等待获取锁的应用程序。`LOCK_\
  \ ATTRIBUTES` 列值 `0000000000000002` 表示由锁升级过程获取的锁，`0000000000000004` 代表 `RR` 锁。\n\
  \n你可以使用 `MON_GET_ACTIVITY_DETAILS` 表函数来捕获每个问题应用程序句柄的 SQL 语句，然后识别解决方案以避免它们之间的锁问题：\n\
  \n![Image](img/423.jpg)\n\n## 监控系统内存\n\n要查看你的数据库服务器上使用的系统内存量，你可以使用系统内存表函数。表 5.7\
  \ 列出了在内存集级别检查内存使用的表函数，内存集是从操作系统分配的内存内存。这些函数应在服务器上本地运行，且不支持远程编目录的数据库。\n\n| 表 5.7：监控系统内存的表函数\
  \ |\n\n| 表函数名称 | 返回信息 |\n| :--- | :--- |\n| `MON_GET_MEMORY_SET` | 返回实例级和活动数据库级已分配内存集的指标\
  \ |\n| `MON_GET_MEMORY_POOL` | 返回内存集内包含的内存池的指标 |\n\n如果你想按数据库管理器、数据库、应用程序、围栏模式进程\
  \ (FMP) 和代理私内存查看整体内存利用率，请执行类似下方的查询：\n\n![Image](img/424.jpg)\n\n要查找内存集内每个内存池的详细内存利用率，请使用\
  \ `MON_GET_MEMORY_POOL` 表函数：\n\n![Image](img/424-425.jpg)\n\n同样，要查找所有内存集的详细内存消耗者，请使用此查询：\n\
  \n![Image](img/425.jpg)\n\n## 监控例程\n\n使用监控例程表函数，你可以衡量自数据库激活以来过程、外部过程、函数、编译函数和编译触发器以及匿名块的聚合执行指标。通过列出例程内执行的子程序和\
  \ SQL 语句，有助于问题确定过程。表 5.8 列出了可用的例程表函数。\n\n| 表 5.8：监控例程的表函数 |\n\n| 表函数名称 | 返回信息 |\n\
  | :--- | :--- |\n| `MON_GET_ROUTINE` | 以关系格式返回例程的执行指标 |\n| `MON_GET_ROUTINE_DETAILS`\
  \ | 以 XML 格式返回例程的详细执行指标 |\n| `MON_GET_ROUTINE_EXEC_LIST` | 返回例程执行的所有语句和部分的列表 |\n\
  | `MON_GET_SECTION_ROUTINE` | 返回执行输入部分期间可能调用的所有子函数和子程序列表 |\n\n要分析存储过程性能，你可以执行以下查询，它将显示以微秒为单位的\
  \ CPU CPU 时间消耗：\n\n![Image](img/426.jpg)\n\n如果你想提取过程 `DB210.PROC_DEP_DS` 的详细信息，请执行此查询：\n\
  \n![Image](img/426-427.jpg)\n\n要捕获作为过程 `DB210.PROC_DEP_DS` 部分执行的所有语句，你可以使用此查询：\n\
  \n![Image](img/427-1.jpg)\n\n与其他监控收集设置一样，你需要将例程数据收集数据库配置参数 `mon_rtn_data` 设置为 `BASE`，并收集语句执行列表信息；你还必须将\
  \ `mon_rtn_execlist` 数据库参数设置为 `BASE`。\n\nDB2 提供了一些监控表函数用于检索与快速通信管理器 (FCM) 和表空间移动相关的信息：\n\
  \n![Image](img/427-2.jpg)\n\n要在数据库分区功能环境中衡量当前成员与远程成员之间的流量，请使用类似下方的查询：\n\n![Image](img/428.jpg)\n\
  \n如果你看到多个节点之间存在不规则的 FCM 缓冲区发送和接收，请考虑跨节点均匀重新分布事实数据并评估分区键以实现共存连接。\n\n当你想监控 `ALTER\
  \ TABLESPACE … REDUCE` 命令的进度时，可以使用 `MON_GET_EXTENT_MOVEMENT_STATUS` 表函数。该函数返回有关当前正在移动扩展的信息、已移动扩展的数量、剩余等待移动的扩展数量以及所有移动扩展的总移动时间（毫秒）。\n\
  \n查询如下：\n\n![Image](img/429.jpg)\n\n## 函数快速参考\n\n表 5.9 提供了表函数的摘要，以及相应的监控级别和控制监控数据收集的数据库配置参数。\n\
  \n![Image](img/429-430.jpg)\n\n## 监控的管理视图\n\n\n\n\n从 DB2 9.7 Fix Pack 1 开始，在 `SYSIBMADM`\
  \ 架构中创建了新的管理视图，用于检索关键的数据库监控信息。与监控表函数不同，管理视图不需要输入参数，并且它们始终以关系型格式返回数据。表 5.10 列出了基于新的轻量级、高速监控解决方案的监控视图。\n\
  \n| 表 5.10: 监控管理视图 |\n\n| 管理视图名称 | 返回信息 |\n| :--- | :--- |\n| MON_BP_UTILIZATION\
  \ | 返回缓冲池的关键监控指标，包括当前连接数据库中所有数据库分区的命中率以及平均读/写时间。 |\n| MON_CONNECTION_SUMMARY | 返回所有连接的关键指标，包括应用程序句柄、总提交次数、平均消耗的\
  \ CPU 时间，以及当前连接数据库中每个活动的锁等待时间。 |\n| MON_CURRENT_SQL | 针对跨越数据库所有成员提交且尚未完成的所有活动的关键指标，包括当前连接数据库中正在执行的动态和静态\
  \ SQL 语句的时间点视图。 |\n| MON_CURRENT_UOW | 返回跨越数据库所有成员提交的所有工作单元的关键指标，确定长时间的工作单元语句，并有助于防止性能问题。\
  \ |\n| MON_DB_SUMMARY | 返回当前连接数据库中所有成员所有服务类的聚合关键指标，通过提供数据库的简要摘要，帮助以高层次方式监控系统。 |\n\
  | MON_LOCKWAITS | 返回在当前连接数据库中等待获取锁的代表应用程序运行的代理信息（这在解决锁问题时非常有用）。 |\n| MON_PKG_CACHE_SUMMARY\
  \ | 返回缓存中动态和静态 SQL 语句的关键指标，提供数据库包缓存的高级摘要；返回的指标是该语句跨越数据库所有成员的所有执行情况的聚合。 |\n| MON_SERVICE_SUBCLASS_SUMMARY\
  \ | 返回当前连接数据库中所有服务子类的关键指标，通过显示每个服务类执行的工作，帮助以高层次方式监控系统。 |\n| MON_TBSP_UTILIZATION\
  \ | 返回当前连接数据库中表空间的关键监控指标，包括所有表空间属性、利用百分比、高水位线和命中率。 |\n| MON_WORKLOAD_SUMMARY | 返回当前连接数据库中所有工作负载的关键指标，通过显示每个工作负载的输入工作，帮助以高层次方式监控系统。\
  \ |\n\n识别关键性能指标 (KPIs) 对于验证数据库性能和功能至关重要。大多数新的 DB2 监控管理视图提供了预计算的 KPI 值，而不需要你像旧版本那样对其进行计算。\n\
  \n## 缓冲池命中率和 I/O 响应时间\n\n为了捕获缓冲池的性能指标（例如数据、索引和辅助存储对象的命中率以及平均缓冲池 I/O 响应时间），请使用类似的查询：\n\
  \n![Image](img/431.jpg)\n\n为了获得更好的用户体验，OLTP 应用程序数据库的缓冲池命中率应始终大于 95%；然而，由于大型顺序扫描，OLAP\
  \ 应用程序数据库的情况会有不同。平均读取时间和平均写入时间表示 I/O 子系统的响应时间，该时间应在 10 毫秒以内。\n\n## 当前运行的高消耗 SQL\
  \ 语句\n\n低效的 SQL 语句是数据库管理员真正的敌人，因此你应该密切监控数据库服务器活动，以识别这些高消耗 SQL 语句并在适当的时间采取行动。要捕获自活动开始的已时间、在\
  \ timerons 中消耗的总 CPU 时间、活动类型和状态、表上索引的效率、查询的粗略成本估计以及实际 SQL 语句，可以使用以下查询：\n\n![Image](img/432.jpg)\n\
  \n`ROWS_READ/ROWS_RETURNED` 比例高的语句表示存在大表扫描，可能需要索引来修复。在上面的示例中，`SELECT * FROM t1 WHERE\
  \ id=2` 显然需要索引，因为读取的记录只有约 25% 发给了应用程序。\n\n你完全可以使用 `SYSIBMADM.MON_PKG_CACHE_SUMMARY`\
  \ 管理视图来分析高消耗 SQL 语句：\n\n![Image](img/433.jpg)\n\n## 数据库中的当前锁等待链\n\n锁问题的常见症状是应用程序挂起。在大多数情况下，挂起表现为数据库引擎内的锁等待。理解锁等待事件是永久解决问题的关键。你可以通过调用以下查询访问锁等待信息，例如请求锁的应用程序、持有锁的应用程序、锁等待持续时间以及相关的\
  \ SQL 语句：\n\n![Image](img/433-434.jpg)\n\n## 理解你的表空间\n\n表空间是容器的逻辑分组。了解它们的运行性能统计数据（如表空间级别的数据、索引和\
  \ XML 数据区域 (XDA) 对象命中率）以及表空间利用率始终是有益的。你可以使用类似这样的查询访问这些信息：\n\n![Image](img/434-435.jpg)\n\
  \n在此示例中，索引命中率是不可接受的；事实上，许多表缺少关键索引，所以这是你修复它们的所有大机会。\n\n## 了解你的数据库服务器\n\n建议始终了解整个数据库服务器性能，相对于提交次数、回滚次数、应用程序请求数、总请求、活动、I/O\
  \ 和网络等待时间。你可以使用 `SYSIBMADM.MON_DB_SUMMARY` 管理视图来确定数据库的健康状况：\n\n![Image](img/436.jpg)\n\
  \n在此示例中，锁等待时间明显较高，需要数据库管理员关注以识别根源。\n\n## 事件监控器\n\n快照监控器和表函数提供了一种记录特定时间点数据库活动状态的方法，而扫描监控器则在事件或转换发生时记录数据库活动的信息。因此，事件监控器允许你随时间收集无法使用快照监控器或其他手段监控的事件或活动的监控数据。\n\
  \n例如，假设你想在每次发生死锁循环时捕获监控数据。如果你熟悉死锁的概念，你可能记得一个名为 `deadlock detector` 的特殊进程会在后台静静运行，并按照定义的间隔“唤醒”，扫描锁定系统以寻找死锁循环。如果存在死锁循环，死锁检测器会随机选择循环中的一个事务进行回滚并终止。被回滚并终止的事务将接收\
  \ SQL 错误代码 `SQL0911N` 原因代码 2，它获得的所有锁都将被释放，然后允许剩余的事务或事务继续运行。\n\n此类事件的信息无法通过快照监控器捕获，因为可能在拍摄快照很久之前死锁循环已经被打破。然而，事件监控器可以捕获此类信息，因为它在检测到死锁循环的瞬间就会激活。\n\
  \n与位于后台且始终可用的快照和表函数不同，事件监控器是你必须创建的特殊对象。要创建事件监控器，你需要执行 `CREATE EVENT MONITOR` SQL\
  \ 语句。该语句的基本语法如下：\n\n![Image](img/437-438.jpg)\n\n\n\n\n\n| where: |\n| :--- | :---\
  \ |\n| `EventMonName` | 指定要分配给要创建的事件监控器的名称 |\n| `EventCondition` | 指定确定要收集的 `CONNECTION`、`STATEMENT,`\
  \ 或 `TRANSACTION` 事件监控器数据的条件 |\n| `TableName` | 指定要分配的数据库表名称，所有收集的事件监控器数据将写入该表 |\n\
  | `EventControl` | 指定事件监控器要捕获哪些事件的事件控制 |\n| `PipeName` | 指定要分配给命名管道的名称，所有收集的事件监控器数据将写入该管道\
  \ |\n| `DirectoryName` | 指定要分配给目录的名称，一个或多个包含事件监控器的数据将被写入此处 |\n| `PartitionNumber`\
  \ | 在分区数据库或 pureScale 环境中，指定事件监控器需要收集数据的数据库分区号或成员 |\n\n通过检查 `CREATE EVENT MONITOR`\
  \ 语句的语法可以看出，当创建事件监控器时，必须指定要监控的事件类型。DB2 支持的事件类型如下：\n\n* `ACTIVITIES`\n* `BUFFERPOOLS`\n\
  * `CONNECTIONS`\n* `DATABASE`\n* `DEADLOCKS`\n* `DEADLOCKS WITH DETAILS`\n* `DEADLOCKS\
  \ WITH DETAILS HISTORY`\n* `DEADLOCKS WITH DETAILS HISTORY VALUES`\n* `STATEMENTS`\n\
  * `STATISTICS`\n* `TABLES`\n* `TABLESPACES`\n* `THRESHOLD VIOLATIONS`\n* `TRANSACTIONS`\n\
  * `UNIT OF WORK`\n* `LOCKING`\n* `PACKAGE CACHE`\n* `CHANGE HISTORY`\n\n必须指定所有收集的监控数据的写入位置；事件监控器的输出可以写入一个或多个数据库表、一个或多个外部文件、命名管道或未格式化的事件表。表事件监控器和管道事件监控器将事件记录直接流到指定的表或命名管道。然而，文件事件监控器会将事件记录流到一系列扩展名为\
  \ `.evt` 的八位编号文件（例如，`00000000.evt`、`00000001.evt`、`00000002.evt`）。你应该将收集并存储在这些文件中的监控数据视为存储在一个逻辑文件中，尽管数据被切分成了更小的部分。换句话说，数据流的开始是名为\
  \ `00000000.evt` 文件的第一个字节；数据流的结束是名为 `nnnnnnnn.evt` 文件的最后一个字节。\n\n事件监控器收集的数据在外部化到磁盘（即写入表或文件）之前会流到缓冲区。如果你指定了\
  \ `BLOCKED` 选项，产生被监控事件的代理程序在发现两个事件缓冲区均满时，将等待事件缓冲区写入磁盘后继续执行。因此，尽管 `BLOCKED` 事件监控器保证不会丢失任何监控器数据，但它们的行为可能会增加应用程序响应时间，因为任何挂起的代理程序（以及任何相关的代理程序）只有在事件监控器缓冲区为空时才允许运行。如果你改为指定\
  \ `NONBLOCKED` 选项，产生被监控事件的代理程序在发现两个事件缓冲区均满时，将不会等待事件缓冲区写入磁盘即可继续。因此，`NONBLOCKED` 事件监控器的执行速度比\
  \ `BLOCKED` 事件监控器快，但在高活跃系统上可能会丢失数据。如果两个选项都不指定，则创建的事件监控器将是 `BLOCKED` 事件监控器。\n\n如果要将事件监控器的输出存储在一个或多个数据库表中，则在执行\
  \ `CREATE EVENT MONITOR` 语句时，会自动创建所需的所有目标表。在分区数据库的情况下，必须选择一个跨越所有分区的表空间来创建事件监控器表。同样，如果你想监控所有分区的事件，请将监控范围指定为\
  \ `GLOBAL.`。另一方面，如果要将事件监控器的输出写入一个或多个外部文件或命名管道，则在执行 `CREATE EVENT MONITOR` 语句时，你指定的输出位置输出目录/命名管道不需要存在。但在激活事件监控器时，它必须存在，且\
  \ DB2 数据库实例所有者必须能够对其写入。监控命名管道的应用程序在事件监控器激活之前也必须打开该管道进行读取。\n\n如果你想创建一个事件监控器，捕获所有应用程序级计数器的值，并在每次连接到数据库的应用程序终止连接时将其写入名为\
  \ `TB_CON_EVENTMON` 的数据库表，请执行类似于下方的 `CREATE EVENT MONITOR` 命令：\n\n![Image](img/440-1.jpg)\n\
  \n但如果你想创建一个事件监控器，捕获缓冲池和表空间事件的监控数据，并将收集的所有数据写入名为 `/db2fs/dump/bptsmonitor,` 的目录，则执行如下所示的\
  \ `CREATE EVENT MONITOR` 命令：\n\n![Image](img/440-2.jpg)\n\n## 激活和停用事件监控器\n\n一旦关联的数据库激活或建立了数据库连接，事件监控器将立即开始收集监控数据——前提是在创建事件监控器时指定了\
  \ `AUTOSTART` 选项。如果你使用 `MANUALSTART` 选项，或者未指定任何选项（在这种情况下，默认使用 `MANUALSTART` 选项），则必须在它开始收集之前激活它。你通过执行\
  \ `SET EVENT MONITOR` 语句来激活（和停用）事件监控器。其基本语法如下：\n\n![Image](img/440-3.jpg)\n\n| where:\
  \ |\n| :--- | :--- |\n| `EventMonName` | 指定要更改状态的事件监控器的名称 |\n| `MonitorState` |\
  \ 指定要将事件监控器的状态；如果要激活事件监控器（即置于活动状态），必须指定值 `1`；如果要停用事件监控器（即置于非活动状态），必须指定值 `0` |\n\n\
  因此，如果你想激活一个使用 `MANUALSTART` 选项创建的名为 `CON_EVMON` 的事件监控器，请执行 `SET EVENT MONITOR` 语句：\n\
  \n![Image](img/441-1.jpg)\n\n然而，要停用 `CON_EVMON` 事件监控器，你需要执行 `SET EVENT MONITOR`\
  \ 语句：\n\n![Image](img/441-2.jpg)\n\n你可以使用类似的查询查看数据库上创建的事件监控器状态：\n\n![Image](img/441-442.jpg)\n\
  \n激活特定监控器后，你应该在特定事件的 `EVMON_ACTIVATES` 列中看到值 `1`。\n\n当事件监控器激活（启动）后，它会静静地在后台运行等待与其关联的事件之一发生。一旦受监控事件发生，事件监控器会立即收集与触发该事件相关的监控数据，并将所有收集的数据写入事件监控器的目标位置。因此，事件本身控制了何时收集监控数据——与快照监控器不同，事件监控器不需要特殊步骤来捕获监控数据。\n\
  \n## 强制事件监控器提前生成输出\n\n\n\n\n由于某些事件激活事件监器的频率低于其他事件，因此可能希望在触发事件监器的事件发生*之前*，强制事件监器收集监控数据并将其写入其目标位置。在这种情况下，您可以通过执行\
  \ `FLUSH EVENT MONITOR` SQL 语句让事件监器尽早收集信息。该语句的基本语法如下：\n\n![Image](img/442.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `EventMonName` | 指定分配给强制收集监控数据的事件监器的名称。 |\n\n默认情况下，过早写入事件监器目标位置的记录将记录在事件监器日志中，并分配“部分记录”（partial\
  \ record）标识符。但是，如果您在执行 `FLUSH EVENT MONITOR` 语句时指定了 `BUFFER` 选项，则只有存在事件监器活动内部缓冲区中的监控数据会被写入事件监器的目标位置；而不会生成部分记录。\n\
  \n因此，如果您想强制命名为 `CON_EVMON` 的事件监器立即收集监控数据并将其写入其目标位置，则应执行 `FLUSH EVENT MONITOR` 语句：\n\
  \n![Image](img/443-1.jpg)\n\n注意，当冲刷事件监器时，计数器不会重置。这意味着，如果您没有使用 `FLUSH EVENT MONITOR`\
  \ 语句强制写入事件监器数据，那么本应生成的事件监器记录在事件监器正常触发时仍会被生成。\n\n## 查看事件监器数据\n\n要查看写入文件和命名管道的事件监器数据，您必须使用事件监器实用性工具。此基于文本的工具从事件监器数据文件或命名管道中检索信息并生成格式化报告。（事件监器文件和命名管道包含逻辑数据分组的二进制流，在显示之前必须进行格式化。）您通过执行\
  \ `db2evmon` 命令激活事件监器实用性工具。该命令的基本语法如下：\n\n![Image](img/443-2.jpg)\n\n或\n\n![Image](img/443-3.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `DatabaseAlias` | 指定分配给定义了要数据的事件监器的数据库别名 |\n| `EventMonName`\
  \ | 指定分配给要显示数据的事件监器的名称 |\n| `EventMonTarget` | 指定存储事件监器收集的数据的位置（目录或命名管道） |\n\n因此，如果您想格式化并显示由名为\
  \ `SAMPLE` 的数据库中命名为 `BPTS_ EVMON` 的事件监器收集的所有数据，请执行如下 `db2evmon` 命令语句：\n\n![Image](img/444-1.jpg)\n\
  \n或\n\n![Image](img/444-2.jpg)\n\n## 事件类型与示例\n\n让我们看看 DB2 10.1 中可用的各种事件类型，以及它们所收集的信息类型、实际收集数据的时间，以及每种类型的实时示例。\n\
  \n## 数据库事件监器\n\n该事件监器捕获反映整个数据库信息的指标和其他监控元素。基本上，它捕获了数据库的完整统计信息，例如：应用程序段的插入、查找、目录缓存堆内存信息、在数据库中提交的\
  \ SQL 语句数量、数据库堆内存高水位、数据对象更改数量、死锁数量、数据读取和写入（插入、更新、删除）数量、锁属性、事务日志存档、日志写入时间、阈值违规次数、包缓存信息、缓冲池命中率、哈希连接数以及消耗的总排序时间。\n\
  \n数据库事件监器在数据库去激活时生成数据，因此您通常会在事件监器文件中看到条目或在事件监器表中看到记录条目。例如，要创建并激活数据库事件监器，可以使用类似于\
  \ `CREATE EVENT MONITOR` 命令：\n\n![Image](img/444-3.jpg)\n\n事件监器命令会创建一个具有 127 列的表\
  \ `DB210.DB_EVENTMON`，用于记录所有与数据库相关的信息。您还可以使用 `db2evtbl` 命令生成事件监器目标表定义：\n\n![Image](img/445-1.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `SchemaName` | 指定事件监器表的模式名称；如果不指定此定义，它将提供未限定的表创建语句\
  \ |\n| `EventMonitorName` | 指定要创建的事件监器的名称 |\n| `EventType` | 指定 `FOR` 子句中可用的事件类型；目前，DB2\
  \ 支持最多 15 种带有 `DEADLOCK;` 子类型的类型；但是，`DEADLOCK` 和 `TRANSACTIONS` 事件类型在 DB2 10.1 中已弃用，并将在未来的版本中删除\
  \ |\n\n因此，如果您想为事件类型 `database,*` 创建事件监器，可以使用类似于下方的查询：\n\n![Image](img/445-2.jpg)\n\
  \n您可以在执行此语句之前修改事件监器。\n\n数据库事件类型支持三种逻辑数据分组：`DB,`、`CONTROL` 以及 `DBMEMUSE`。`CONTROL`\
  \ 记录了数据库首次连接的时间戳。\n\n与任何其他事件监器一样，您可以使用 `SET EVENT MONITOR` 命令激活新创建的事件监器。如果您选择通过表创建事件监器，可以使用如下查询来查看表信息：\n\
  \n![Image](img/446.jpg)\n\n\n\n\n## 锁事件监控器\n\n此事件监控器捕获参与锁事件应用程序的全面信息，例如锁参与者、锁属性、应用程序句柄、涉及的对象、工作负载详情、语句文本、隔离级别以及优化参数。根据事件监控器的配置，当检测到锁超时、死锁以及超过指定时间的锁等待等任何事件类型时，锁事件监控器会生成数据。\n\
  \n捕获锁事件信息需要四个关键的数据库配置参数：\n\n* 监控锁超时 `(mon_locktimeout)`\n* 监控死锁 `(mon_deadlock)`\n\
  * 监控锁等待 `(mon_lockwait)`\n* 监控锁等待阈值 `(mon_lw_thresh)`\n\n你可以使用 `UPDATE DATABASE\
  \ CONFIGURATION` 命令将这些参数更新为正确的值：\n\n![Image](img/451-2.jpg)\n\n要在事件监控器中启用所有事件类型，或选择性地构建并激活特定的锁事件类型，请使用类似的\
  \ SQL 语句：\n\n![Image](img/452-1.jpg)\n\n以下示例通过识别数据库中的锁超时问题，说明了 `LOCKING` 事件监控器的用法。在这种情况下，两个事务——`TR1`\
  \ 和 `TR2` 分别尝试读取和修改表 `T1` 中的数据。当 `TR1` 和 `TR2` 同时执行时，`TR2` 停止了处理。\n\n现在让我们使用事件监控器捕获锁信息。请记住，你也可以使用监控表函数来识别锁问题。然而，与基于事件而非点快照的事件监控捕获相比，在正确的时间提取\
  \ `LOCKTIMEOUT` 信息是非常困难的。\n\n如下所示，事务 `T2` 在应用程序中接收到了错误消息：\n\n![Image](img/452-2.jpg)\n\
  \n数据库管理员负责识别包含在锁超时问题中的 SQL 语句。\n\n既然你已经启用了 `LOCKING` 事件监控器，只需查询监控表即可，如下：\n\n![Image](img/452-453.jpg)\n\
  \n上述输出显示了参与锁超时的应用程序句柄和对象名称，包括锁等待和锁持有状态。要了解更多关于参与锁超时的 SQL 语句，请使用类似下面的查询：\n\n![Image](img/453.jpg)\n\
  \n你也可以使用 `LOCKING` 事件监控器，通过使用一组类似于示例的查询查找死锁（SQL0911N 原因代码 2）参与者。要查找回滚应用程序句柄信息，请查询表\
  \ `DB210.LOCK_lk_evmon`：\n\n![Image](img/454-455.jpg)\n\n请记住，之前的死锁事件监控器 `DB2DETAILDEADLOCK`\
  \ 和锁超时报告功能 `DB2_CAPTURE_LOCKTIMEOUT db2` 注册设置在 DB2 10.1 中已弃用。\n\n锁超时一样，你还可以捕获锁等待事件，例如任何超过五秒的锁等待（由数据库配置参数\
  \ `mon_lw_threash` 控制），并将其捕获到监控目标表中。事件类型为 `LOCKWAIT.`。你可以使用与之前示例类似的命令组来分析事件。\n\n\
  有时，你可能不想等待无法获得的锁。你可以使用 `SET CURRENT LOCK TIMEOUT` 语句在执行 SQL 语句之前和之后更改 `CURRENT LOCK\
  \ TIMEOUT` 特殊寄存器的值：\n\n![Image](img/455.jpg)\n\n在这种情况下，应用程序将不会等到 `locktimeout` 期间来获取所需对象的锁。然而，应用程序会收到\
  \ SQLSTATE 40001 或 57033 错误消息，这些可以很好地用于在应用程序中构建重试逻辑。\n\n最后，如果你想总结数据库过去 24 小时的锁事件发生情况，请使用类似下面的查询。\n\
  \n过去 24 小时内的锁事件：\n\n![Image](img/456.jpg)\n\n过去 24 小时内参与锁事件的 SQL 语句：\n\n![Image](img/456-457.jpg)\n\
  \n## 工作单元事件监控器\n\n此事件监控器捕获与事务相关的信息，例如执行的开始和结束时间、运行所属的工作负载和类类名称，以及语句和请求指标的包或可执行 ID。工作单元事件监控器在事务（工作单元）完成时生成数据。\n\
  \n因此，如果你想为工作单元类型事件创建并激活事件监控器，请运行类似下所示的 SQL 语句：\n\n![Image](img/457.jpg)\n\n## 活动事件监控器\n\
  \n此事件监控器捕获与系统活动相关的信息，例如语句的执行、资源消耗以及完整的活动指标。当在开启了 `COLLECT ACTIVITY DATA` 选项的服务类、工作负载或工作类中执行的活动完成后，就会生成事件数据。\n\
  \n因此，如果你想为活动类型事件创建并激活事件监控器，请运行类似下面的 SQL 语句：\n\n![Image](img/458.jpg)\n\n## 包缓存事件监控器\n\
  \n此事件监控器捕获已不在包缓存中的动态和静态 SQL 语句的历史以及相关指标。当你需要检查在内存中不再使用的语句的性能指标时，可以使用此监控器。它收集所有执行聚合的\
  \ SQL 语句和指标。每当条目从包缓存中删除时，就会生成事件数据。\n\n因此，要为包缓存类型创建并激活事件监控器，请运行类似下面的 SQL 语句：\n\n\
  ![Image](img/458-459.jpg)\n\n你可以使用上述控制表的多种方法确定问题的 SQL 语句。\n\n要查找执行时间、排序总数、读取和修改的行以及相关的\
  \ SQL 语句，请使用类似下面的查询：\n\n![Image](img/459.jpg)\n\n## 统计信息监控器\n\n此事件监控器捕获与数据库工作负载管理对象相关的处理指标。例如，你可以使用统计信息监控器来理解给定时间段内工作负载的\
  \ CPU 利用率。数据根据 `wlm_collect_int` 数据库配置参数定义的间隔，从每个 WLM 服务类、工作负载或工作类执行的活动中收集。\n\n\
  因此，如果你想为统计信息类型创建并激活事件监控器，请运行类似下面的 SQL 语句：\n\n![Image](img/460.jpg)\n\n## 阈值违反监控器\n\
  \n此事件监控器捕获数据库操作期间超出特定阈值。你可以设置各种阈值，包括 CPU 时间、数据库连接数和执行语句数。在检测到阈值违反时生成事件数据。\n\n因此，要为阈值违反类型创建并激活事件监控器，可以运行示例\
  \ SQL 语句：\n\n![Image](img/460-461.jpg)\n\n`PCTDEACTIVATE` 参数指定了事件监控器自动禁用之前表空间必须满的程度。这仅适用于事件监控器控制表创建在自动存储或\
  \ DMS 表空间中。\n\n## 连接事件监控器\n\n此事件监控器捕获连接指标，例如应用程序名称、身份验证 ID、客户端平台、连接协议、每个连接的读取和写入次数以及\
  \ CPU 利用率。事件数据在每个连接结束时生成。\n\n因此，如果你想为连接类型创建事件监控器，请运行类似下面的 SQL 语句：\n\n\n\n\n\n![Image](img/461-462.jpg)\n\
  \n你可以执行命令输出来创建 `CONNHEADER`、`CONN` 和 `CONTROL` 表。在完成控制表创建后，可以通过执行 `SET EVENT MONITOR`\
  \ 命令来激活事件监器：\n\n![Image](img/462.jpg)\n\n## 语句事件监器\n\n此事件监器捕获因执行 SQL 语句而向数据库发出的请求。它收集语句的开始时间、结束时间、语句文本、CPU\
  \ 时间、读取和修改的记录数以及 SQL 通信区域 (`SQLCA`) 结构。事件数据在四个不同的阶段生成，例如准备（prepare）、描述（describe）、打开（open）和关闭（close）。最有价值的数据通常出现在关闭阶段。然而，执行大量排序的\
  \ SQL 语句可能会有很长的打开时间，或者花费长时间准备的 SQL 语句可能在准备阶段产生有价值的数据。\n\n因此，如果你想为语句（statements）类型的事件类型创建一个事件监器，请运行类似下所示的命令：\n\
  \n![Image](img/462-463.jpg)\n\n你可以执行命令输出来创建 `CONNHEADER`、`STMT` 和 `CONTROL` 表。在完成控制表创建后，可以通过执行\
  \ `SET EVENT MONITOR` 命令来激活事件监器：\n\n![Image](img/463.jpg)\n\n# 变更历史事件监器\n\n此事件监器捕获通过\
  \ DDL 语句和实用程序执行对数据库、数据库管理器配置、DB2 注册设置以及数据对象的更改。每当参数值更改或 DDL、命令或实用程序完成时，就会生成事件监器数据。\n\
  \n因此，如果你想为变更历史（change history）类型的事件类型创建一个事件监器，请运行类似下所示的 SQL 语句：\n\n![Image](img/463-464.jpg)\n\
  \n然后通过使用 `SET EVENT MONITOR` 命令激活事件监器：\n\n![Image](img/464.jpg)\n\n你可以从变更摘要表 `DB210\\\
  .CHANGESUMMARY_CGHIST_EVMON` 查询变更摘要信息：\n\n![Image](img/464-465.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** 用于死锁（deadlocks）和事务（transactions）的事件监器在 DB2 10.1 中已弃用，因此不再建议使用。建议使用 `CREATE\
  \ EVENT MONITOR FOR LOCKING` 和 `CREATE EVENT MONITOR FOR UNIT OF WORK` 来监控死锁和事务。\n\
  \n## 事件监器快速参考\n\n表 5.11 提供了 DB2 10.1 事件监器的摘要，并包含相应的逻辑数据组、数据生成和收集信息以及目标表选项。\n\n|\
  \ 表 5.11: 事件监器摘要 |\n\n| **事件监器名称** | **逻辑数据组** | **事件监器属性** |\n| :--- | :--- | :---\
  \ |\n| 数据库 (Database) | `DB`, `CONTROL`, `DBMEMUSE` | 当最后一个应用程序断开数据库连接时生成事件数据。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 缓冲池 (Buffer pool) | `BUFFERPOOL`, `CONTROL` | 在数据库停用时生成事件数据。它捕获缓冲池性能指标。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 表空间 (Table spaces) | `TABLESPACE`, `CONTROL` | 在数据库停用时生成事件数据。它捕获表空间性能指标。你可以引导此事件监器将监器数据写入表、文件或管道。\
  \ |\n| 表 (Tables) | `TABLE`, `CONTROL` | 在数据库停用时生成事件数据。它捕获表性能指标。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 锁 (Locking) | `LOCK`, `LOCK_PARTICIPANTS`, `LOCK_PARTICIPANT_ACTIVITIES`,\
  \ `LOCK_ACTIVITY_VALUES`, `CONTROL` | 当数据库管理器检测到锁超时、死锁或超过指定时间的锁等待时生成事件数据。它捕获应用程序和锁信息。你可以引导此事件监器将监器数据写入格式化表或非格式化表。\
  \ |\n| 工作单元 (Unit of work) | `UOW`, `UOW_METRICS`, `UOW_PACKAGE_LIST`, `UOW_EXECUTABLE_LIST`,\
  \ `CONTROL` | 当工作单元完成时生成事件数据。它捕获资源性能信息。你可以引导此事件监器将监器数据写入格式化表或非格式化表。 |\n| 活动 (Activities)\
  \ | `ACTIVITY`, `ACTIVITYMETRICS`, `ACTIVITYSTMT`, `ACTIVITYVALS`, `CONTROL` | 当活动完成时生成事件数据。它捕获单个语句的执行。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 包缓存 (Package cache) | `PKGCACHE`, `PKGCACHE_METRICS`, `CONTROL` | 当条目从包缓存内存中移除时生成事件数据。它捕获每个\
  \ SQL 的执行统计信息以及语句文本。你可以引导此事件监器将监器数据写入格式化表或非格式化表。 |\n| 统计信息 (Statistics) | `QSTATS`,\
  \ `SCSTATS`, `SCMETRICS`, `WCSTATS`, `WLSTATS`, `WLMETRICS`, `HISTOGRAMBIN`, `CONTROL`\
  \ | 根据 `wlm_collect_int` 数据库配置参数定义的间隔自动生成事件数据。它捕获与 WLM 相关的处理指标。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 阈值违规 (Threshold violations) | `THRESOLDVIATIONS`, `CONTROL` | 当数据库操作期间超过指定的阈值时自动生成事件数据。它捕获与系统的处理指标。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 连接 (Connections) | `CONNHEADER`, `CONN`, `CONTROL`, `CONNMEMUSE` | 当连接结束数据库时生成事件数据。它捕获所有级计数。你可以引导此事件监器将监器数据写入格式化表、文件或管道。\
  \ |\n| 语句 (Statements) | `CONNHEADER`, `STMT`, `SUBSECTION`, `CONTROL` | 当语句执行结束时生成事件数据。它捕获所有语句性能指标，包括\
  \ `SQLCA`。你可以引导此事件监器将监器数据写入格式化表、文件或管道。 |\n| 变更历史 (Change history) | `CHANGESUMMARY`,\
  \ `EVMONSTART`, `TXNCOMPLETION`, `DDLSTMTEXEC`, `DBMCFG`, `REGVAR`, `UTILSTART`,\
  \ `UTILSTOP`, `UTILPHASE`, `UTILLOCATION`, `CONTROL` | 当对配置参数、数据库对象或实用程序执行进行更改时生成事件数据。它捕获所述命令产生的所有更改。你可以引导此事件监器将监器数据写入格式化表。\
  \ |\n\n## 读取非格式化事件数据\n\n非格式化事件 (`UE`) 表可以存储收集到的锁、包缓存和工作单元事件数据。当数据存储在非格式化事件表中时，它以二进制格式存储在内置\
  \ BLOB 列中，无法像格式化表那样通过 SQL 语句直接读取。因此，事件监器收集并写入非格式化事件表的数据有两种查看方式：使用 `db2evmonfmt`\
  \ 工具或使用事件监器格式表过程。\n\n## db2evmonfmt 工具\n\n基于 Java 的通用 XML 解析器工具 `db2evmonfmt` 从\
  \ UE 表生成可读的文本报告。基本命令语法为：\n\n![Image](img/467-1.jpg)\n\n或\n\n![Image](img/467-2.jpg)\n\
  \n| where: |\n\n| `DatabaseName` | 为定义要显示的 UE 监器的数据库指定别名。 |\n| `UeTable` | 为要格式化的\
  \ UE 监器表指定名称。 |\n| `StyleSheet` | 用于转换 XML 文档的 XSLT 样式表。 |\n| `EventID` | 为必须显示的匹配事件指定\
  \ ID。 |\n| `EvenType` | 为必须显示的匹配事件指定类型。 |\n\n\n\n\n\n| `NumHours` | 标识必须显示的事件信息小时数\
