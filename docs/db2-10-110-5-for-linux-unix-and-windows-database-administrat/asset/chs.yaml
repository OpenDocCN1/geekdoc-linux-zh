  \ in unthrottled mode, but after we set the `UTIL_IMPACT_PRIORITY` to `50,` it started\
  \ running with priority 50.\n\n# Taking Control of a DB2 Server\n\nBecause any number\
  \ of clients (maximum of 64,000 concurrent connections as per `MAX_COORDAGENTS`\
  \ configuration) can access a server, and in turn any number of users can be granted\
  \ the privileges needed to work with a particular database, it can be difficult,\
  \ if not impossible, to coordinate the work efforts of everyone using a specific\
  \ database at any given point in time. This situation can create a problem because,\
  \ to perform routine maintenance operations, a database administrator will need\
  \ all users to stop using a particular instance or database. If your organization\
  \ is small, it may be possible to contact each database user and ask him or her\
  \ to disconnect long enough to perform any necessary maintenance operations. But\
  \ what if your organization consists of several hundred users? Or what if an employee\
  \ went home early and inadvertently left an instance attachment or database connection\
  \ open? How can you find out which users and applications are interacting with the\
  \ instance or database you need exclusive access to?\n\n# Determining Who Is Using\
  \ the Instance or Database\n\nIf you have System Administrator `(SYSADMN),` System\
  \ Control `(SYSCTRL),` System Maintenance `(SYSMAINT)` or System Monitoring `(SYSMON)`\
  \ authority for a DB2 database server, you can find out who is using an instance\
  \ or a database on that server by executing the `LIST APPLICATIONS` command. The\
  \ basic syntax for this command is:\n\n![Image](img/107-1.jpg)\n\n| where: |\n\n\
  | `DatabaseAlias` | Identifies the alias assigned to the database for which to obtain\
  \ application information |\n\nThus, to determine which applications are currently\
  \ connected to a database named `SAMPLE` (along with the authorization IDs associated\
  \ with the users running those applications), you execute a `LIST APPLICATIONS`\
  \ command:\n\n![Image](img/107-2.jpg)\n\nAnd when this command is executed, you\
  \ might see output that looks something like this:\n\n![Image](img/107-3.jpg)\n\n\
  (Note: In this book, the format of SQL output such as the preceding example has,\
  \ in some cases, been modified to fit the book page width; for example, output column\
  \ headings may be split over multiple lines and extra spaces between columns removed.)\n\
  \nYou can also discover which applications are attached to an instance or connected\
  \ to a database within that instance by selecting the **Monitor** and **Application\
  \ Connections** actions from the IBM Data Studio Administration Explorer. Figure\
  \ 2.18 shows the Data Studio menu items that you must select to activate the Application\
  \ Connections console.\n\n![Image](img/108.jpg)\n\n*Figure 2.18: Application Connections\
  \ monitor console activation*\n\nFigure 2.19 shows how the web console might look\
  \ if an application is connected to a database within the specified instance.\n\n\
  ![Image](img/109-1.jpg)\n\n*Figure 2.19: IBM Data Studio Application Connections\
  \ web console*\n\n# Forcing Application Connections\n\nOnce you know which applications\
  \ are using a particular instance or database, you can terminate one or more of\
  \ those applications prematurely by executing the `FORCE APPLICATION` command (assuming\
  \ you have `SYSADMN`, `SYSCTRL`, or `SYSMAINT` authority). The basic syntax for\
  \ this command is:\n\n![Image](img/109-2.jpg)\n\nor\n\n![Image](img/109-3.jpg)\n\
  \n| where: |\n\n| `ApplicationHandle` | Identifies the handle to associate with\
  \ one or more applications whose instance attachments or database connections are\
  \ to be terminated |\n\nThus, if you want to force all users and applications connected\
  \ to databases on a server named DB210 to terminate their database connections,\
  \ you execute a `FORCE APPLICATION` command:\n\n![Image](img/109-4.jpg)\n\nHowever,\
  \ to force a specific application whose handle is 3500 (refer to the sample output\
  \ for the `LIST APPLICATIONS` command to see where this value came from) to terminate\
  \ its connection to a database named `SAMPLE,` execute a `FORCE APPLICATION` command\
  \ that looks something like this:\n\n![Image](img/110.jpg)\n\nIt is important to\
  \ note that when an application’s instance attachment or database connection is\
  \ terminated by the `FORCE APPLICATION` command, any SQL operations that have been\
  \ performed by the application but have not been committed are rolled back.\n\n\
  ![Image](img/note.jpg)\n\n**Note:** To preserve database integrity, only applications\
  \ that are idle or that are performing interruptible database operations can be\
  \ terminated when the `FORCE APPLICATION` command is processed. In addition, the\
  \ DB2 database manager for the instance cannot be stopped during a force operation;\
  \ the DB2 database manager must remain active so that subsequent instance-level\
  \ operations can be handled without having to restart the instance. Finally, because\
  \ the `FORCE APPLICATION` command is run asynchronously, other applications or users\
  \ can attach to the instance or connect to a database within the instance after\
  \ this command has been executed. Multiple `FORCE APPLICATION` commands may be required\
  \ to completely terminate all instance attachments and database connections.\n\n\
  If you are using the IBM Data Studio web console to see which users or applications\
  \ are currently attached to an instance or connected to a database, you can terminate\
  \ instance attachments and database connections by highlighting one or more entries\
  \ in the list on the Applications Connections page and clicking **Force Application**.\n\
  \n# Working with IBM Data Studio\n\nIBM Data Studio provides application developers\
  \ and database administrators with a single integrated environment for creating,\
  \ deploying, debugging, and administering data-centric applications. The product\
  \ consists of the following components:\n\n* The IBM Data Studio client, which is\
  \ an Eclipse-centric tool that provides an integrated development environment for\
  \ database and instance administration, routine and Java application development,\
  \ and query-tuning tasks\n\n\n\n\n\n*   IBM Data Studio Web 控制台是一个基于 Web 的工具，用于健康和可用性监控、作业创建以及数据库管理任务\n\
  \n通过 IBM Data Studio 和 IBM Data Studio Web 控制台，你可以执行各种任务，包括：\n\n*   连接到实例和数据库\n\
  *   生成 DDL 脚本\n*   执行数据库管理任务\n*   执行数据库开发任务\n*   调度数据库作业\n*   分析 SQL 查询\n\n## 连接到实例和数据库\n\
  \n要对实例或数据库执行任何任务，必须挂载实例或连接到数据库。请按照以下步骤建立实例或数据库的连接。\n\n**步骤 1：** 点击 `Start > All\
  \ Programs > IBM Data Studio > Data Studio 4.1.0.0 Client,` 启动 IBM Data Studio，如图\
  \ 2.20 所示。\n\n![Image](img/111.jpg)\n\n*图 2.20: 启动 IBM Data Studio 客户端*\n\n**步骤\
  \ 2：** 打开数据库管理视图，如图 2.21 和 2.22 所示。\n\n![Image](img/112-1.jpg)\n\n*图 2.21: 打开数据库视图*\n\
  \n![Image](img/112-2.jpg)\n\n*图 2.22: Data Studio 视图*\n\n**步骤 3：** 在数据库管理视图的“管理资源管理器”（Administration\
  \ Explorer）中点击 `New Connection to a database` 图标，如图 2.23 所示。\n\n![Image](img/113-1.jpg)\n\
  \n*图 2.23: 管理资源管理器中的新建连接图标*\n\n**步骤 4：** 如图 2.24 所示，选择所需的驱动程序、连接名称以及任何在创建新连接时启用跟踪的任何选项。完成连接参数后，点击\
  \ `Test Connection` 查看连接是否成功完成。\n\n![Image](img/113-2.jpg)\n\n*图 2.24: 新连接参数*\n\n\
  ## 生成数据定义语言脚本\n\n你可以通过右键点击数据库并选择 `Generate DDL` 选项来提取整个数据库或特定对象的 DDL，如图 2.25 所示。在“选项”（Options）屏幕上，选择你想要包含在\
  \ DDL 脚本中的模型元素（例如 `Create Statement, Drop Statements, Replace Clause`）。在“对象”（Objects）屏幕上，选择要包含在\
  \ DDL 脚本中的模型对象（例如表、别名、缓冲池、表空间、全局变量、存储过程）。在“保存并运行 DDL”（Save and Run DDL）屏幕上，指定保存生成的\
  \ DDL 脚本的路径。你还可以通过提供目标数据库连接信息来运行 DDL 脚本。\n\n![Image](img/114.jpg)\n\n*图 2.25: 为数据库生成\
  \ DDL*\n\n如果你对为少数对象生成 DDL 感兴趣，可以右键点击对象并选择 `Generate DDL` 选项来为这些对象生成 DDL。\n\n## 执行数据库管理任务\n\
  \n通过 IBM Data Studio 可以执行多种数据库管理任务，包括管理安全；将数据从一个数据库复制到另一个数据库；管理数据库作业；创建或修改对象、数据库备份、数据库恢复、停止实例和启动实例。\n\
  \n要启动数据库管理关键任务列表，点击 `Task Launcher` 图标（参见图 2.26），并点击相应的任务列表调用关键管理任务，如图 2.27 所示。\n\
  \n![Image](img/115-1.jpg)\n\n*图 2.26: 在管理视图中打开任务启动器*\n\n![Image](img/115-2.jpg)\n\
  \n*图 2.27: 任务启动器中的关键管理任务列表*\n\n## 执行数据库开发任务\n\n如图 2.28 所示，你可以通过任务启动器的 `Develop`\
  \ 选项卡在 IBM Data Studio 中执行数据库开发任务，例如创建和运行 SQL 语句、开发和调试存储过程及 UDF，以及创建数据库应用程序。\n\n\
  ![Image](img/116.jpg)\n\n*图 2.28: 通过任务启动器 Develop 选项卡执行开发任务*\n\n## 调度数据库作业\n\nIBM\
  \ Data Studio 提供了一个 Web 控制台用于创建、调度和管理数据库作业。你可以从 `Start` > `All Programs` > `IBM\
  \ Data Studio` > `IBM Data Studio 4.1.0.0 Web Console` > `Web Console,` 启动 IBM Data\
  \ Studio Web 控制台（默认为 [`localhost:11086/console`](http://www.localhost:11086/console)），如图\
  \ 2.29 所示。\n\n当你启动 Web 控制台时，它将带你进入 `Task Launcher` 选项卡并提供 `Open` 选项来激活 `Job Manager`、多个健康监控和告警。\n\
  \n![Image](img/115-1.jpg)\n\n*图 2.26: 在管理视图中打开任务启动器*\n\n![Image](img/115-2.jpg)\n\
  \n*图 2.27: 任务启动器中的关键管理任务列表*\n\n## 创建和调度作业\n\n要创建作业，在 `Job Manager` 部分打开 `Job List`\
  \ 选项卡并点击 `Add Job.`。在出的屏幕上（参见图 2.32），输入作业信息，如名称；类型（DB2 CLP 脚本、仅 SQL 脚本、可执行/Shell\
  \ 脚本）；作业描述；是否启用调度。\n\n如图 2.33 所示，你可以在 `Job Components` 部分更新作业属性、脚本、调度（添加或使用现有调度）、链和通知列表。\n\
  \n你可以灵活地为现有的作业链添加调度。不过，你也可以使用 `Schedule` 选项卡来实现（参见图 2.34）。在 `Schedules` 选项卡上，点击\
  \ `Add Schedule` 并从列表中选择要调度的作业。\n\n在 `Schedule Details` 部分，你可以指定初始日期、初始时间、重复周期（每月、每周、每天、每日间隔、每小时、每分钟）以及该作业的运行时长。在\
  \ `Databases` 部分，你可以选择在哪些数据库上运行该作业。最后，通过 `Timeout Settings`，你可以指定当脚本执行持续超过超时时间时执行的操作（例如取消作业），如图\
  \ 2.35 所示。\n\n\n\n...\n\n\n\n| ![images](img/circ.jpg) | B. | `UPDATE DBM CFG USING\
