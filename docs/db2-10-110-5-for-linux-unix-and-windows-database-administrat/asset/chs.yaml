  \ |\n\n### 题 15\n\n正确答案是 **B** 和 **D**。要在您的 DB2 实例上配置透明性 LDAP 身份验证：\n\n1. 将 DB2\
  \ 注册表变量 `DB2AUTH` 设置为 `OSAUTHDB`。\n2. 将数据库服务器实例上的身份验证设置为以下值之一：\n- SERVER\n- SERVER_ENCRYPT\n\
  - DATA_ENCRYPT\n3. 对数据库管理器配置参数 `CLNT_PW_PLUGIN`、`GROUP_PLUGIN` 和 `SRVCON_PW_PLUGIN`\
  \ 使用默认值。\n4. 重启 DB2 实例。\n\n### 题 16\n\n正确答案是 **A**。要在您的 DB2 实例上配置透明性 LDAP 身份验证：\n\
  \n1. 将 DB2 注册表变量 `DB2AUTH` 设置为 `OSAUTHDB`。\n2. 将数据库服务器实例上的身份验证设置为以下值之一：\n- SERVER\n\
  - SERVER_ENCRYPT\n- DATA_ENCRYPT\n3. 对 DBM CFG 参数 `CLNT_PW_PLUGIN`、`GROUP_PLUGIN`\
  \ 和 `SRVCON_PW_PLUGIN` 使用默认值。\n4. 重启 DB2 实例。\n\n您使用 DB2 注册表变量 `DB2LDAPCACHE` 和数据库管理器配置参数\
  \ `DIR_CACHE` 在客户端配置 LDAP 目录信息缓存。\n\n| `DB2LDAPCACHE` | `DIR_CACHE` | 缓存信息 |\n|\
  \ :--- | :--- | :--- |\n| 否 | 否 | 连接始终从 LDAP 读取信息。 |\n| 否 | 是 | 连接信息从 LDAP 读取一次并存储在\
  \ DB2 内存缓存中。 |\n| 是 | 是/否 | 连接信息从 LDAP 读取一次并存储在 DB2 本地数据库、节点和 DCS 目录中。 |\n\n# 第\
  \ 10 章\n\n# DB2 10.5 考试冲刺课程\n\n本章将您的 DB2 10 知识接接到 10.5 PF4 (Cancun)，并为配置和管理运行 DB2\
  \ 10.5 的 DB2 服务器、实例和数据库提供重要信息。它还详细探讨了 V10.5 中引入的新功能和增强。\n\n本章的目的是补充通过阅读和学习前面的九章所获得的知识和信息。您将学习许多\
  \ DB2 BLU 加速功能，这些功能旨在提高业务分析解决方案的可用性和性能，以及如何计划、设计、配置和管理列负载 (BLU)。\n\n本章还将涵盖 IBM DB2\
  \ 集群技术 (pureScale) 的重大进展，包括 FP5 中引入的重大 CF 功能（位于 Cancun 之后的修复包）。此外，您还将学习如何安装和配置 IBM\
  \ Optim Query Workload Tuner，以获得管理 BLU 环境中查询负载性能的专家建议，以及如何正确部署影子表 (shadow tables)。\n\
  \n## 考试目标\n\n* 展示为分析系统配置 DB2 负载的能力\n* 展示在 DB2 10.5 BLU 加速中使用自动执行功能的能力\n* 展示理解新 DB2\
  \ 软件封装的能力\n* 展示使用 10.5 中引入的配置参数的能力\n* 展示理解 DB2 10.5 BLU 加速七大核心理念的能力\n* 使用基于表达式的索引以及针对这些索引的统计信息的能力\n\
  * 展示理解新 SQL 增强的能力\n* 展示理解和使用 BLU 新监控元素的能力\n* 展示理解 DB2 10.5 中 pureScale 增强的能力\n*\
  \ 展示理解影子表工作原理以及如何部署它们的能力\n* 展示理解和使用 DB2 10.5 压缩功能的能力\n* 展示理解 `db2dsdriver.cfg` 的\n\
  * 展示将行组织表转换为列组织表的能力\n* 展示理解 DB2 Advanced 复制服务 (ACS) 自定义脚本的能力\n* 展示设置和配置 DB2 JSON\
  \ 的\n\n## DB2 服务器管理\n\n本节回顾了影响服务器管理的特定 DB2 10.5 增强功能，重点关注服务器管理员通常执行的任务和操作。\n\n##\
  \ 产品封装\n\n从 10.5 开始，IBM 更改了 DB2 的产品封装。为了完全理解这些变化，请记住这三个简单点：\n\n1. IBM 将可用包从九个减少到六个。\n\
  2. 所有名称中带有“Advanced”字样的包都包含所有可用功能，但高级恢复功能（它是唯一单独定价的功能）。\n3. 企业版 (Enterprise) 和工作组版\
  \ (Workgroup) 的封装相同。工作组版有大小限制。\n\n[表 10.1] 显示了高级版的功能列表。\n\n| 表 10.1：高级版包含的工具和功能\
  \ |\n| :--- | :--- |\n| BLU 加速 | pureScale |\n| 数据库分区功能 | Optim Performance Manager\
  \ |\n| Optim 配置管理器 | pureQuery |\n| WHS Design Studio | WHS SQL Warehouse Tool |\n\
  | WHS 挖掘和文本分析 | Cognos 10.2 (5 个用户) |\n| WHS 立方服务 | MQ/CDC 复制 |\n| 自适应压缩 | solidDB\
  \ 和 solidDB UC |\n| DB2 Connect | 持续数据摄入 |\n| Tivoli 系统自动化 | SQL 复制 |\n| Optim Query\
  \ Workload Tuner | 仓库模型包 |\n| 负载管理器 | Data Architect (10 个用户) |\n\n如果某功能包含在所有产品中则不列出。有关哪种包适用于您的特定情况，请在\
  \ IBM Knowledge Center for DB2 10.5 中搜索“DB2 Database Product Editions”（*www-01.ibm.com/support/knowledgecenter*）。若要在\
  \ IBM Knowledge Center for 10.5 中按版本查找功能，请在“Functionality in DB2 feature and product\
  \ editions”下进行搜索。\n\n## 理解这一切\n\nIBM DB2 有一个共享的集群解决方案，称为 pureScale。有两个产品包获得许可运行它：高级企业服务器版\
  \ (AESE)，产品标识符为 `db2aese`，以及高级工作组服务器版 (AWSE)，产品标识符为 `db2awse`。工作组服务器版 (WSE) 和企业服务器版\
  \ (ESE) 是行组织的非集群产品。\n\n从 IBM DB2 pureScale 9.8 或 10.1 开始，许多功能在产品企业服务器版 (`db2ese`)\
  \ 下单独获得许可：\n\n产品包 `db2aese` 和 `db2awse` 可以在三种不同的模式下运行：集群 (DSF)、非集群 (ESE) 或分区 (DPF)：\n\
  \n将 AESE-C 或 AWSE-C 视为集群模式产品（也称为 pureScale），而将 AESE 或 AWSE 视为非集群模式产品 (ESE)。\n\n\
  适用于 AESE-C 的内容也适用于 AWSE-C，但规模较小；适用于 AESE 的内容也适用于 AWSE，但规模也较小。[表 10.2] 显示了这些产品包可以在哪些解决方案上运行。\n\
  \n\n\n\n\n你可以使用 `db2ls` 命令来显示服务器上所有或仅已安装的产品和功能。你能从以下示例中看出是谁安装了这些产品吗？该命令列出了安装者的 UID，在本例中为\
  \ root。由于现在 DB2 产品可以由非 root 用户安装，使用 `db2ls` 显示此类信息可能非常有用：\n\n![Image](img/988-989.jpg)\n\
  \n`db2ls` 命令提供了额外信息，例如已安装的产品包以及组成该包的详细功能：\n\n![Image](img/989-990.jpg)\n\n如果你想显示全局注册表的位置和内容，请使用\
  \ `db2greg` 命令（将其想象为软件的税务局 IRS）：\n\n![Image](img/990-1.jpg)\n\n`-dump` 选项显示全局注册表的完整内容。上述输出来自\
  \ 2012 年的一个 pureScale 9.8 FP5 部署。服务器为 `srvxxdb2t001`，实例为 `db2blu01`。\n\n`-g` 选项显示全局注册表文件的位置：\n\
  \n![Image](img/990-2.jpg)\n\n`-getservrec` 选项显示特定字段的详细信息，在本例中为 GPFS 服务：\n\n![Image](img/images991.jpg)\n\
  \n## 用于 BLU 的服务器\n\nBLU 加速可以在 DB2 支持的任何硬件或操作系统上运行，但每种方案都有其优缺点。BLU 服务器选型的最确切口号非得是“要么大，要么回家（go\
  \ big or go home）”。\n\n在选择平台时，请记住以下几点：\n\n* 越多越好。\n* 平台应允许每个插槽拥有更多核心。\n* 每个核心应有更多的硬件线程。\n\
  * POWER 8 每个核心有八个线程。\n* 平台应该有更多的内存（RAM）。\n* 它应该有更多的处理器寄存器。\n* POWER 8 每个核心有 64 个寄存器。\n\
  * 快的处理器比慢的处理器好。\n* 虚拟镜像可以提供资源的快速供应，但你必须注意虚拟化限制。\n* 虚拟 = 共享，而 BLU 是名副其实的“霸主”，因此务必为服务器设置最大\
  \ CPU/核心和内存。\n* 如 PureFlex 或 PureApplication 等设备提供了快速供应和隔离以及大型磁盘存储卷。\n* 你可以在同一台服务器上运行\
  \ OLTP 和分析工作负载，但最好即使分析负载之间也相互隔离。\n\n### 选项 1：在单独服务器上运行 BLU 和 OLTP 工作负载\n* 这是最佳选项。\n\
  * 它将工作负载的风险降最低。\n* 你需要管理、配置和设置的内容更少。\n* 它提供了最好的安全性。\n* 它提供了资源和容量管理的便利性。\n\n### 选项\
  \ 2：带有独立 DB2 实例的单一服务器\n* 这是一个不错的选项。\n* 你设置 DB2 实例资源以确保每个实例接收到特定级别的服务器资源。\n* 此选项允许你进行管理、配置和设置注册表/实例的控制。\n\
  * 它提供了良好的安全性。\n* 如果 OLTP 是 BLU 分析数据的源，则它使用本地提取、转换和加载 (ETL) 过程。\n\n### 选项 3：一台服务器、一个实例、一个或多个数据库\n\
  * 你可以实现此选项，但不推荐。\n* 它要求在数据库级别设置资源限制。\n* 需要实例周期的实例级更改会导致所有数据库以及实例一起机。\n* 实例升级影响所有数据库。\n\
  * 此选项允许 OLTP（行）和 BLU（列）表之间进行连接。\n* 一条 SQL 查询无需联邦（单个数据库）即可访问两种表类型。\n* 如果 OLTP 是 BLU\
  \ 分析数据的源且数据包含在一个数据库中，则使用 ETL。\n* 此选项在可能运行 OLTP 工作负载的同一服务器和实例上启用单指令多数据 (SIMD) 处理。\n\
  \n在 Linux 系统上，你可以执行 `cat /proc/cpuinfo | grep -i sse`。然而，仅仅因为处理器具有向量指令并不意味着运行在服务器上的软件正在使用\
  \ SIMD。你必须设置编译器以启用向量指令，并且软件必须编写为能够利用向量指令。\n\n如果你创建了 DB2 实例并启动它，它会在 `db2diag.log`\
  \ 中告知你是否启 SIMD。为 BLU 工作负载或混合工作负载配置服务器大小并不是一门精确的科学。这就是选择一个可以扩展的平台的良好理由。从小开始，配置在 16\
  \ 到 24 个核心之间，配备 64 到 128 GB 的内存，随着工作负载的增加向外构建。在扩展服务器时，尝试保持每个核心 8 GB RAM 的内存比例。\n\
  \n## BLU 自主性\n\nIBM 在 DB2 10.5 中提供的 BLU 功能是第一个设计为自主性的。最初发布时，pureScale 需要自动存储管理器\
  \ (ASM)，但不再有其他要求。\n\nBLU 在考虑不同服务器尺寸的情况下自动执行配置和操作设置。行工作负载的大部分所需负载维护任务已实现自动化。\n\n\
  ## 配置自主性\n\n你可以通过设置几个配置参数来完全配置 BLU 环境。如果你设置实例注册表变量 `DB2_WORKLOAD=ANALYTICS`，则使用此设置创建的所有数据库都将具有以下参数：\n\
  \n![Image](img/993-1.jpg)\n\n在更改注册表设置之前创建的数据库将具有行默认值，如果需要，则需要手动修改。\n\n要构建行配置和列配置数据库的混合，从配置为行的实例开始。构建你需要的行数据库，设置\
  \ `DB2_WORKLOAD=ANALYTICS` 注册表设置，然后重启实例并创建配置为列的数据库。\n\n在运行具有行组织和列组织数据库的 DB2 实例时，为列工作负载配置数据库管理器和数据库配置设置。行工作负载\
  \ (OLTP) 在列配置的 DB2 实例中运行良好，但反之不然。\n\nBLU 工作负载的三个关键数据库配置设置是 `SHEAPTHRES_SHR`、`SORTHEAP`\
  \ 和 `DATABASE_MEMORY`，其中 `DATABASE_MEMORY` 设置为 `AUTOMATIC`。DB2 数据库配置管理器将根据创建数据库时的服务器资源为\
  \ `SHEAPTHRES_SHR` 和 `SORTHEAP` 设置初始值。\n\n在 64 GB RAM 的服务器上，如下设置数据库管理器配置：\n\n![Image](img/993-2.jpg)\n\
  \n然而，在 128 GB RAM 的服务器上，你使用这些设置：\n\n![Image](img/994-1.jpg)\n\n你必须定期检查排序性能，目标是达到排序的标准水平。排序的良好水平是\
  \ 95% 的单次通过，这意味着 95% 的所有排序都在内存中处理，不需要磁盘存储。数据库中的所有排序都是基于行的。\n\nBLU 工作负载的推荐值为：`SHEAPTHRES_SHR`\
  \ 占用 `DATABASE_MEMORY` 值的 40–50%，`SORTHEAP` 为 `SHEAPTHRES_SHR` 值的 5–20%，取决于并发排序请求的数量，对于大量并发排序使用\
  \ 5%，对于较少数量的并发排序使用 20%。\n\n对于上一个示例中的 128 GB 服务器，一个良好的起始点是：\n\n![Image](img/994-2.jpg)\n\
  \n将实例配置设置 `SHEAPTHRES` 保持为 0，这是首选值。记住，此设置管理的不仅仅是排序，还包括所有工作内存。这将允许 `SHEAPTHRES_SHR`\
  \ 控制私有和共享排序内存。\n\n对于 BLU 数据库，自动维护设置与行组织数据库不同，唯一的例外是列组织数据库启用了自动重组组 (`AUTO_REORG`)\
  \ = `ON`。用于统计收集的另外两个推荐数据库配置设置是 `AUTO_STATS_VIEWS` 和 `AUTO_SAMPLING`，你应该开启它们。\n\n\
  \n\n\n\n适当收集统计通常会带来性能提升，但也可能产生负面结果。因此，请监控负载的性能以确保影响是积极的，并根据需要进行更改。\n\n## 运维自治 (Operational\
  \ Autonomics)\n\n`UTIL_HEAP_SZ` 是第三个关键数据库设置。虽然列表支持全 DML，但数据主要通过 `Load`（加载）或 `Ingest`（导入）实用程序填充。\n\
  \n列表的 `Load` 工具分为三个阶段。第一阶段是分析阶段，在此阶段处理整个输入以确定压缩键。第二和第三阶段对于所有加载操作都是相同的。\n\n![Image](img/note.jpg)\n\
  \n**注意：** `INSTANCE_MEMORY` 或 `DATABASE_MEMORY` 不限制 `UTIL_HEAP_SZ`。池中的内会在不再需要时被释放。\n\
  \n当你在 `DB2_WORKLOAD=ANALYTICS` 下创建新数据库时，`UTIL_HEAP_SZ` 被设置为 `AUTOMATIC (<some size\
  \ value>)`。在 64 GB 的服务器上，初始设置为 `AUTOMATIC (827738)`，即 3.157 GB，默认设置为内存的 5%。\n\n\
  对于典型的 BLU 安装，良好的设置是在四百万到六百万个 4 KB 页面之间。实用程序堆内存过过小会显著影响加载过程的压缩效率，从而影响 BLU 查询的性能。当加载过程开始时，它会获取完整的实用程序堆内存。如果启动了第二个并发加载，内存将从第一个加载中移除并分配给第二个加载。这一过程将持续到执行的并发加载数量。\n\
  \n## 统计收集 (Statistical Collection)\n\n对于列组织表，压缩和统计都是由系统自动内部管理的。无法开启或关闭它们。这就是为什么在初始种子压缩字典或统计信息时，处理整个数据集至关重要。\n\
  \n让我们考虑一个示例来理解其逻辑和影响。假设你想构建一个列组织表并有 12 个月的数据，每个月一个文件。你可以设置 12 个加载命令，每个文件对应一个，并使用\
  \ `LOAD INSERT` 命令将数据加载到你的列组织表中。\n\n这种方法无疑行之有效；但更好的方法是使用一个 `LOAD INSERT` 命令加载所有\
  \ 12 个文件。这样，`LOAD` 命令的分析阶段就拥有完整的数据范围以便在做出最终压缩键选择时进行审查。\n\n每次执行 `LOAD INSERT` 时，代表列组织表的目录统计信息都会进行更新。因此，无论如何加载数据，结果都应该是对数据的准确表示。\n\
  \n## 空间管理 (Space Management)\n\n已有文档说明，当设置 `DB2_WORKLOAD=ANALYTICS` 时，列组织表的磁盘存储空间管理会自动执行。让我们来看看它的工作原理和作用。\n\
  \nDB2 长期以来一直执行所谓的行逻辑删除。这与伪删除（pseudodeletion）不同，因为在逻辑删除中，删除行在数据页上占据的空间可以被插入的行覆盖，而伪删除行在执行额外的清理操作之前不可用。\n\
  \n对于列组织表，数据是伪删除的；对于行组织表，则是逻辑删除。因此，对于列组织表，空间回收是在区（extent）级别进行的，区空间被返回表空间供任何定义的表使用。\n\
  \n![Image](img/note.jpg)\n\n**注意：** 当你将数据库配置设置 `AUTO_MAINT` 和 `AUTO_REORG` 为开启 时，系统会自动对列组织表执行空间回收。\n\
  \n有关构建和管理表空间的信息，请参阅本章后后的“物理设计”部分。你可以在“工具：将行表转换为列表”部分找到有关用于管理表空间和表的特定工具的信息。\n\n##\
  \ 自治负载 (Autonomic Workloads)\n\n对于所有创建的数据库，都会自动定义 WLM 设置。然而，这些设置默认仅对列默认数据库启用。在阅读此内容时请记住，所有数据库都定义了这些对象：\n\
  \n*   定义的两个负载：一个用于管理活动，另一个用于用户查询。它们分别是 `SYSDEFAULTUSERWORKLOAD` 和 `SYSDEFAULTADMWORKLOAD`，评估顺序分别为\
  \ 1 和 2。\n*   创建了一个名为 `SYSDEFAULTUSERWAS` 的工作操作集，其包含一个操作名称 `SYSMAPMANAGEDQUERIES`\
  \ 和一个工作类 `SYSMANAGEDQUERIES`，并分配给名为 `SYSDEFAULTUSERCLASS` 的服务超类，除了管理负载外，所有内容都默认分配到该类。\n\
  \n工作类集 (WCS) 基本识别了所有 `timeron` 成本大于 150000 的读负载，其评估顺序为 1。`timeron` 是由 DB2 优化器根据内部成本值（I/O\
  \ 和处理器成本的加权和）确定的相对度单位。\n\n要建立基于使用的 `<n>` 并发查询阈值，请使用 `SYSDEFAULTCONCURRENT`，其中 `<n>`\
  \ 由数据库创建时的核心数决定。超过 `<n>` 的并发请求将排队。如果实例部署在虚拟硬件上且在数据库创建后镜像大小发生了变化，请使用 `AUTOCONFIGURE\
  \ APPLY NONE` 来获取新建议：\n\n![Image](img/997-1.jpg)\n\n你可以使用 `ALTER THRESHOLD` 命令应用新值。例如：\n\
  \n![Image](img/997-2.jpg)\n\n对于行组织数据库，此阈值被禁用，但对于列组织数据库，它是启用的。记住，如果你设置了 `DB2_WORKLOAD=ANALYTICS`\
  \ 并创建了数据库，即使对于行负载，此并发阈值也会启用。反之亦然，即设置了 `DB2_WORKLOAD=<blank>` 并且手动更改了数据库管理器和数据库配置，此并发阈值将被禁用，需要你手动修改并启用它。\n\
  \n## pureScale 模型\n\npureScale 特现在可以安装在带有支持版本 UNIX 的通用硬件上，但每种方案都有优缺点。不同架构之间的两个主要区别是互连通信和成员恢复。\n\
  \n提供三种支持的方法：\n\n*   基于 InfiniBand (IB) 网络的 RDMA 协议\n*   基于收敛以太网 (RoCE) 网络的 RDMA\
  \ 协议\n*   基于以太网 (Ethernet) 的 TCP/IP 协议\n\n这些方法的列表顺序也是性能顺序。远程内存访问 (RDMA) 是一种允许服务器访问彼此内存的指令集。它快速且廉价。\n\
  \n![Image](img/note.jpg)\n\n**注意：** InfiniBand 在支持 RDMA 时提供了最低延迟和最高带宽。某些以太网适配器支持\
  \ RDMA，某些不支持。\n\n问题是，你将如何运行事务负载？\n\n*最佳适应 (Best fit)* 意味着负载将在集群中找到最佳运行位置。连接和事务将在整个集群之间负载均衡。*控制\
  \ (Control)* 意味着负载将被分配到集群内的特定成员。此配置可以是两个选项之一：活动或活动/备用。表 10.3 比较了最佳适应负载与控制负载。\n\n\
  | **表 10.3: 最佳适应与控制负载** |\n\n| **考虑因素** | **最佳适应** | **控制** |\n| :--- | :--- | :---\
  \ |\n| 容量管理：ClusterServer | 是 N/A | 否 是 |\n| HADR 活动/备用配置 | N/A | 是 |\n| 集群资源感知\
  \ | 是 | N/A |\n| 可性管理：ClusterServer | 是 N/A | N/A 是 |\n| 最高可靠性 | 是 | 否 |\n| 最高互连通信级别\
  \ | 是 | 否 |\n| 添加成员—负载自动重新平衡 | 是 | 否 |\n\n\n\n\n\n| 特性 | 是 | 否 |\n| --- | --- |\
  \ --- |\n| 移除成员—工作负载自动重新平衡 | 是 | 否 |\n| 服务器升级—硬件或操作系统—对工作负载无影响 | 是 | 可能 |\n\n##\
  \ 在选择运行 `pureScale` 的平台时，请记住以下几点：\n\n1. 在任何对性能重要的最佳匹配环境中，都需要 `RDMA`。\n2. `Ethernet`\
  \ 比 `InfiniBand` 慢，且带宽较小。\n3. `PureData` 没有 Power 版本。`PureFlex` 有。\n4. `PureData`\
  \ 不支持集群通信负载均衡。`PureFlex` 可以设置负载均衡。\n5. `PureData` 针对 `pureScale` 进行了预配置。\n6. `PureFlex`\
  \ 必须进行配置。\n7. `PureApplication` 无法运行 `pureScale`。\n8. 自建 (DIY) 集群提供的回报最高，但风险也最高。\n\
  9. 物有所所值。构建高可用/高性能的 `pureScale` 集群没有捷径。\n10. 虚拟化不等同于逻辑分区 (`LPAR`)。根据定义，虚拟化是多个镜像的硬件共享。虚拟化需要部署\
  \ `VIO` 和 `N-Port ID Virtualization (NPIV)`，因为这意味着跨多个镜像共享 I/O 卡、以太网卡和内部总线。\n\n你可以配置\
  \ `LPARs` 共享硬件，并需要 `VIO` 和 `NPIV` 部署。然而，在硬件足够的情况下，你可以配置多个除与服务器电源外不共享任何内容的分区。图 10.1\
  \ 显示了基于 `LPARs` 构建的 `pureScale` 集群。\n\n![Image](img/999.jpg)\n\n*图 10.1: 基于 LPARs\
  \ 构建的 pureScale 集群*\n\n## 安装 DB2\n\n无论你是构建单实例还是 `pureScale` 集群，都可以采用一种安装方法安装 `DB2`。这将允许你对\
  \ `pureScale` 和非 `pureScale` 部署遵循相同的通用流程。软件包的部署与实例的创建是独立的操作。\n\n## 安装前信息\n\n`DB2`\
  \ 安装包有多种形式，例如 zip 文件下载、DVD 或 ISO 文件。将此软件安装包复制到目标服务器上并解压。\n\n在 UNIX 系统上，`DB2` 产品安装不再是操作系统包。因此，你不能再使用\
  \ `rpm` 和 `installp` 等工具。文件可以存放在 `/opt/ibm/db2`、`/tmp` 等独立位置，或者你创建的路径如 `/ibm/software`\
  \ 中。\n\n在 UNIX 系统上，`db2setup` 程序需要以下条件：\n\n* `/tmp` 需要 2 GB 空闲空间\n* `/var` 需要 2\
  \ GB 空闲空间 (`pureScale`)\n\n你需要创建支持此安装的 UNIX 账户和组。\n\n以 root 身份在每台服务器上创建所需的 UNIX\
  \ 账户。虽然不是必须，但将 `pureScale` 集群中每个服务器的这些账户的 `UID` 和 `GID` 设置为相同是一个好主。非 `pureScale`\
  \ 集群只有一个服务器，因此无需担心。\n\n要安装 `pureScale`，请在集群中的一台服务器上运行这些命令并获取 `GID` 和 `UID` 值。然后对于所有其他服务器，为\
  \ `groupadd` 添加参数 `-G`，为 `useradd` 添加参数 `-U`。\n\n**步骤 1：** 添加 UNIX 组：\n\n![Image](img/1000-1.jpg)\n\
  \n**步骤 2：** 为 `DB2` 实例添加 UNIX ID：\n\n![Image](img/1000-2.jpg)\n\n**步骤 3：** 为围栏用户\
  \ (fenced user) 添加 UNIX 组：\n\n![Image](img/1000-3.jpg)\n\n**步骤 4：** 为围栏用户添加 UNIX\
  \ ID：\n\n![Image](img/1000-4.jpg)\n\n**步骤 5：** 为 `<DB2INSTANCE>` 和 `<FENCED USER>`\
  \ 设置密码永不过期并将 `ulimits` 设置为无限。\n\n**步骤 6：** 根据需要在每台服务器上设置内核设置。\n\n## db2setup 信息\n\
  \nGUI 模式是安装 DB2 的优选方法。从远程 Windows 笔记本电脑运行 GUI 模式需要设置 `DISPLAY` 变量。例如，`export DISPLAY=<hostname>:10,0`，其中\
  \ `<hostname>` 是你想要安装软件的数据库服务器主机。在某些情况下允许使用 `'localhost'`。\n\n在 UNIX 服务器上，如下编辑 `/etc/ssh/sshd_config`\
  \ 文件：\n\n![Image](img/1001.jpg)\n\n要执行 `db2setup`，你必须拥有 SSH 客户端。Cygwin ([www.cygwin.org](http://www.cygwin.org))\
  \ 是一款开源产品，在 Windows 上提供完整的 UNIX Shell 功能。你启动 `XWin` 服务来运行 `xterm`，并在 `xterm` 窗口执行\
  \ `ssh <user>@<hostname>` 来访问远程服务器。\n\nCygwin `XWin` 的一个特性是，当你执行 SSH 访问远程服务器时，`XWin`\
  \ 会自动设置 `DISPLAY` 变量。\n\nPutty ([www.putty.org](http://www.putty.org)) 是另一个开源工具，提供从\
  \ Windows 访问 UNIX 服务器的远程 SSH 客户端界面。让我们来看使用 Cygwin 1.11.2 的安装步骤 ([x.cygwin.com](http://x.cygwin.com))：\n\
  \n1. 启动 `XServer`（这提供了 X11）。\n2. 启动 `xterm` 会话。\n3. 右键点击 `XServer` 并选择 Applications，然后\
  \ `Xterm`。\n4. 从命令行执行 `ssh root@<servername or IP>`。\n5. 从命令行执行 `env | grep -i display`\
  \ 查看 `DISPLAY` 变量是否已设置。如果 `DISPLAY` 变量已设置，你就可以准备执行 `db2setup` 了。\n\n![Image](img/note.jpg)\n\
  \n**注意：** UNIX 服务器必须安装 X11。例如，在 Linux 系统上，你可以运行 `yum grouplist` 查看安装了哪些组包。在 Redhat\
  \ 上，安装 X11 的最佳方法是运行命令 `yum -y groupinstall \"Desktop\"` 仅安装 Desktop 组。\n\n# 响应文件（静默）模式\n\
  \n如果你想通过响应文件安装 DB2，请运行 `db2setup -r <rsp.file>` 命令。目前，`db2setup` 和 `db2_install`\
  \ 两种方法都受支持，但由于 `db2setup` 是优选方法，因此这里仅介绍了该方法。`db2_install` 方法已过时，可能会在未来的版本中删除。\n\n\
  在执行 `db2setup` 过程中，可以为 AESE-C 和 AESE 环境执行创建 DB2 实例的所有必要步骤。即使你选择了这种方法，了解在软件安装之外如何创建\
  \ DB2 实例也是一个好主意。\n\n## 安装过程\n\n**步骤 1：** 获取并将所需的 DB2 安装包放置在目标服务器上。如果你没有软件，可以从 [www-01.ibm.com/software/data/db2/linux-unix-windows/downloads.html](http://www-01.ibm.com/software/data/db2/linux-unix-windows/downloads.html)\
  \ 下载。\n\n**步骤 2：** 将 DB2 安装包放置在服务器上，位于要解压内容的位置。对于 UNIX，将文件放置在你想解压的位置。数据库服务灵活架构 (DSFA)\
  \ 指南建议使用 `/db/admin/tmp` 并在该位置为特定版本创建目录。如果你正在安装 FP4，请将 zip 文件放置在 `/db/admin/tmp/db2/V10.5/fp4`。\n\
