  \ | D. | 成员 {0, 5, 10, 20, 25} 的系统 |\n\n### 问题 94\n\n在 pureScale 的向前滚操作期间，如果遇到“删除成员”（drop\
  \ member）日志记录，命令会发生什么情况？\n\n| ![images](img/circ.jpg) | A. | 向前滚命令删除该成员并继续到达指定的时间。\
