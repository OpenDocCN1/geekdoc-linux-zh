  \ `AUTOCONFIGURE` 命令（*每个数据库执行一次*）：\n\n![Image](img/102-3.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** `AUTOCONFIGURE` 命令（以及配置顾问）将始终建议配置数据库以利用 STMM。然而，如果您对位于某个实例中的数据库运行 `AUTOCONFIGURE`\
  \ 命令，而该实例的 `sheapthres` 数据库管理器配置参数被分配了非零值，则排序内存堆数据库配置参数（`sortheap`）将不会配置为自动调优。因此，您必须在执行\
  \ `AUTOCONFIGURE` 命令之前执行命令 `UPDATE DATABASE MANAGER CONFIGURATION USING SHEAPTHRES\
  \ 0` 以启用排序内存调优。\n\n# 自适应实用程序节流 (Adaptive Utility Throttling)\n\n数据库维护活动在运行时会消耗资源，因此它们的执行可能会影响数据库性能。为了对对系统的影响，您可以使用\
  \ DB2 的自适应实用程序节流系统来调节某些自动维护活动的资源使用。\n\n自适应实用程序节流系统允许维护实用程序在关键期间与负载并发运行，同时将其对系统的影响控制在可接受范围内。以下维护操作可以利用实用程序节流：\n\
  \n* 统计收集\n* 备份操作\n* 重平衡操作\n* 异步索引清理\n\n## 设置影响策略\n\n要控制实用程序节流，您必须建立影响策略。影响策略是指实例范围的限制，即所有节流实用程序对生产工作负载的累积影响；一旦建立了此类策略，系统的责任就是确保遵守该策略。要为所有节流实用程序定义影响策略，您只需为\
  \ `util_impact_lim` DB2 数据库管理器配置参数分配 1 到 100 之间的值。\n\n例如，要将所有节流实用程序对生产工作负载的实例级累计限制设置为\
  \ 10%（换句话说，确保所有节流实用程序带来的性能下降对系统工作负载的影响不超过 10%），您可以通过执行 `UPDATE DBM CFG` 命令为 `util_impact_lim`\
  \ 配置参数分配值 10：\n\n![Image](img/103.jpg)\n\n正如您预期的，节流的实用程序完成通常比未节流的实用程序需要更长时间。如果您发现某个实用程序运行时间过长，可以增加分配给\
  \ `util_impact_lim` 配置参数的值，或者通过将 `util_impact_lim` 配置参数设置为 100 来完全禁用节流。如果 `util_impact_lim`\
  \ 设置为 100，则没有实用程序调用会被节流。在这种情况下，实用程序可以运行得更快，但它们最可能对工作负载产生不利影响。\n\n## 以节流模式执行实用程序\n\
  \n定义影响策略并不意味着所有的实用程序调用都会以节流运行。事实上，默认情况下，即使定义了影响策略，实用程序也会以非节流模式运行。要在节流模式下执行实用程序，必须在调用实用程序时或在其启动后启用节流。\n\
  \n要在调用实用程序时启用节流，您必须在执行实用程序的命令中指定 `UTIL_IMPACT_PRIORITY` 选项。目前，唯一识别 `UTIL_IMPACT_PRIORITY`\
  \ 子句的命令是 `BACKUP DATABASE` 和 `RUNSTATS`。请记住，在 `UTIL_IMPACT_PRIORITY` 子句对这些命令产生作用之前，必须通过\
  \ `util_impact_lim` 配置参数定义影响策略。\n\n`UTIL_IMPACT_PRIORITY` 子句接受一个可选的相对优先级参数（0 到 100\
  \ 之间的值，0 为 `OFF`），用于区分节流实用程序之间的重要性。高优先级的节流实用程序运行会比低优先级的更激进。\n\n## 运行中实用程序的影响优先级\n\
  \n要更改已运行的实用程序的影响优先级（节流程度），请执行 `SET UTIL_IMPACT_PRIORITY` 命令。通过此命令，您可以\n\n* 对以非节流模式启动的运行中的实用程序进行节流\n\
  * 取消实用实用程序的节流（禁用节流）\n* 重新调整运行中节流实用程序的优先级（当同时运行多个节流实用程序且其中一个比其他更重要时，此功能非常有用）\n\n\
  `SET UTIL_IMPACT_PRIORITY` 命令的语法如下：\n\n![Image](img/104-1.jpg)\n\n| where: |\n\n\
