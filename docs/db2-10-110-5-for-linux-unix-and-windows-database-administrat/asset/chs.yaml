  \ 2.12](#009_Chapter002.html_fig2.12）所示。\n\n**步骤 2：** 根据业务需求定义在线或离线维护窗口，如图 2.14](#009_Chapter002.html_fig2.14）所示。\n\
  \n**步骤 3：** 定义备份策略以控制自动备份的行为，如图 2.15](#009_Chapter002.html_fig2.15）所示。\n\n备份准则指示了何时备份数据库。当满足以下任何条件时，将调度自动备份：\n\
  \n*   数据库没有可用的备份。\n*   距离上次备份的时间超过了指定的数值（如天、周、月）。\n*   自上次备份以来消耗的活动日志空间（仅适用于归档日志数据库）超过了指定值。\n\
  \n![Image](img/94.jpg)\n\n*图 2.15：备份策略选项*\n\n备份位置指定了备份映像的位置。你可以将备份映像的位置更改为以下：\n\n\
  *   文件系统\n*   磁带\n*   TSM\n*   XBSA（ Veritas/Symantec 接口）\n*   供应商 DLL 媒体文件\n\n\
  备份模式指定执行在线还是离线自动备份。如果数据库启用了滚倒恢复，则可以启用在线或离线自动数据库备份。否则，可用离线备份。完成策略选择后，点击 Run 提交。\n\
  \n你还可以使用系统存储过程 `SYSPROC.AUTOMAINT_SET_POLICY` 设置备份策略。你可以在 `$INSTHOME/sqllib/samples/automaintcfg`\
  \ 找到示例 XML 文件 `DB2AutoBackupPolicySample.xml` 并对其进行修改以适应你的环境：\n\n![Image](img/95.jpg)\n\
  \n使用系统过程 `SYSPROC.AUTOMAINT_GET_POLICYFILE,`，你可以从系统中提取当前策略。当你在 UNIX 环境下运行以下命令时，它会提取\
  \ XML 文件并存储在 `$INSTHOME/sqllib/tmp`。\n\n![Image](img/95-96.jpg)\n\n\n\n...\n\n\n\
  \n| `is_populated` | yes, no 默认: yes | 表示数据库当前是否包含数据。有效值如下：yes—数据库包含数据，no—数据库不包含数据。\
  \ |\n| `num_local_apps` | 0–5,000 默认: 0 | 一时连接到数据库的本地应用程序数量。 |\n| `num_remote_apps`\
  \ | 0–5,000 默认: 10 | 一时连接到数据库的远程应用程序数量。通过为处理所有所需的连接（包括本地和远程）分配内存，可以确保用户无需等待现有连接终止即可建立连接。然而，为连接过度分配内存可能会导致资源浪费。DB2\
  \ 性能监控可以帮助您确定在指定的时间范围内实际获取了多少个连接。 |\n| `isolation` | RR, RS, CS, UR 默认: RR | 大多数访问数据库的应用程序使用的隔离级别。有效值包括：RR—可重复读（长时间获取大量锁）；RS—可读取稳定性（长时间获取较少锁）；CS—游标稳定性（短时间内获取大量锁）；以及\
  \ UR—未提交读（不获取任何锁）。 |\n| `bp_resizeable` | yes, no 默认: yes | 表示缓冲区池是否可调整大小。有效值是：yes—缓冲区池可调整大小；no—缓冲区池不可调整大小。\
  \ |\n\n如果您在执行 `AUTOCONFIGURE` 命令时指定 `APPLY DB ONLY` 子句，Design Advisor 建议的数据库配置和缓冲区池更改将应用于适当的数据库配置文件。如果您指定\
  \ `APPLY DB AND DBM` 子句，建议的数据库配置和缓冲区池更改将应用于数据库配置文件，而建议的实例配置更改将应用于适当的 DB2 数据库管理器配置文件。相反，指定\
  \ `APPLY NONE` 子句将显示更改建议但不会应用它们。\n\n因此，要为一个名为 `SAMPLE` 且使用可调整大小缓冲区池并已填充数据的 OLTP\
  \ 数据库确定最佳配置，并在将其应用到相应的数据库配置文件之前审查任何建议的配置更改，请执行 `AUTOCONFIGURE` 命令：\n\n![Image](img/102-1.jpg)\n\
