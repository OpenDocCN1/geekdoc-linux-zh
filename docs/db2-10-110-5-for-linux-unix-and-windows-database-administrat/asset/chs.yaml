  ## Answers\n\n### Question 1\n\n正确答案是 **B.** 关于每个创建的 DB2 数据库的信息都存储在一个特殊的层次目录树中。该该目录树实际创建的位置取决于你通过\
  \ `CREATE DATABASE` 命令提供的信息。如果你没有提供位置信息，则该目录树将创建在与创建数据库的实例相关的 `DFTDBPATH` DB2 数据库管理器配置参数所指定的位置。\n\
  \n该层次结构树的根目录被分配为与数据库关联的实例名称。此目录将包含一个子目录，其名称与分区的节点对应。如果数据库是分区数据库，此目录将被命名为 `NODE*xxxx*，其中\
  \ *xxxx* 是分配给分区的唯一节点号；如果数据库是非分区数据库，此目录将被命名为 `NODE`0000。节点名称目录反过来将为每个创建的数据库包含一个子目录，以及一个包含存放数据库数据的容器的子目录。\n\
  \n你分配给存放数据库数据的容器的子目录的名称与为数据库指定的名称相同；你分配给包含数据库基础文件的子目录的名称对应于创建过程中分配给数据库的数据库令牌（token）（第一个创建的数据库的子目录将命名为\
  \ `SQL00001`，第二个创建的数据库的子目录将命名为 `SQL00002`，依此类推）。\n\n### Question 2\n\n正确答案是 **C.**\
  \ 每当你创建一个新的 DB2 10.1 数据库时，默认启用以下功能：\n\n- 自动维护（数据库备份、表和索引重组、数据访问优化和统计分析）\n- 自调优内存管理器（包缓存、锁定内存、排序内存、数据库共享内存和缓冲池内存）\n\
  - 实用程序节流（Utility throttling）\n\n### Question 3\n\n正确答案是 **A.** 每当你创建一个新数据库时，默认会自动授予以下权限和特权：\n\
  \n- `DBADM` 权限以及 `CONNECT`、`CREATETAB`、`BINDADD`、`CREATE_NOT_FENCED`、`IMPLICIT_SCHEMA`\
  \ 和 `LOAD` 权限被授予创建数据库的用户。\n- 表空间 `USERSPACE1` 的 `USE` 权限授予组 `PUBLIC`。\n- `CONNECT`、`CREATETAB`、`BINDADD`\
  \ 和 `IMPLICIT_SCHEMA` 权限授予组 `PUBLIC`。\n- 对系统目录表的 `SELECT` 权限授予组 `PUBLIC`。\n- 对 `SYSIBM`\
  \ 模式下所有过程 `EXECUTE` 权限授予组 `PUBLIC`。\n- 对 `SYSFUN` 模式下所有函数 `EXECUTE WITH GRANT` 权限授予组\
  \ `PUBLIC`。\n- 每个成功绑定的实用程序的 `BIND` 和 `EXECUTE` 权限授予组 `PUBLIC`。\n\n然而，如果你在 `CREATE\
  \ DATABASE` 命令中使用 `RESTRICTIVE` 子句，权限将仅授予数据库创建者——不会授予组 `PUBLIC`。\n\n### Question\
  \ 4\n\n正确答案是 **D.** 默认启用自动存储，存储路径 `/data/dbfs1` 和 `/data/dbfs2` 将包含自动存储使用的容器。由于没有指定数据库路径，与数据库相关的元数据将存储在第一个存储路径\
  \ `/data/dbfs1`。\n\n### Question 5\n\n正确答案是 **A.** 在 Windows 平台上，数据库路径必须是一个盘符。如果你想配合盘符指定目录，必须将注册变量\
  \ `DB2_CREATE_DB_ON_PATH` 设置为 `YES`。没有数据库配置参数可以设置默认数据库路径（这是一个数据库管理器参数）。注册变量 `DB2_OVERRIDE_BPF`\
  \ 通常用于恢复期间限制缓冲池的大小。注册变量 `DB2LIBPATH` 经常用于在联邦设置期间添加数据客户端库。\n\n### Question 6\n\n\
  正确答案是 **B.** 你可以使用 `CREATE STGROUP` 命令将现有的非自动存储数据库转换为自动存储：\n\n![Image](img/295.jpg)\n\
  \n在 DB2 10.1 上删除并重建数据库显然了一个自动存储数据库；但你会丢失之前存储的数据，因此这不是明智之。如果你将注册变量 `DB2_ENABLE_AUTONFIG_DEFAULT`\
  \ 设置为 `YES`，DB2 数据库管理器会在创建数据库后自动调用配置顾问。\n\n### Question 7\n\n正确答案是 **C.** 一旦创建表空间，无法为\
  \ SMS 表空间（使用 `ALTER TABLESPACE` SQL 语句）添加更多容器。但是你可以在为 DMS 表空间添加更多容器。当你添加新容器时，现有数据可以自动重新平衡到新的容器集中，以保持最佳的\
  \ I/O 效率。\n\n### Question 8\n\n\n\n\n\n正确答案是 **D.**。在 DB2 中，DMS 表空间中对象的初始空间分配为两个区（extents）；SMS\
  \ 表空间中对象的初始空间分配为一个区。在本示例中，一个区包含 32 个 8 KB 页面，即 256 KB（`8 KB x 32 = 256 KB`）。\n\n\
  ### 问题 9\n正确答案是 **B** 和 **D.**。你可以通过执行 `LIST TABLESPACES` 命令来获取有关特定数据库创建的所有表空间的信息。该命令的语法为：\n\
  \n![Image](img/296-1.jpg)\n\n你还可以通过使用监控表函数获取有关特定数据库创建的所有表空间的详细信息：\n\n![Image](img/296-2.jpg)\n\
  \n其他选项命令在 DB2 10.1 中为语法错误或已弃用。\n\n### 问题 10\n正确答案是 **B.**。不存在名为“在线且不可访问”（Online\
  \ and not accessible）的状态（顺便说一下，这是一个自矛盾的状态）。\n\n### 问题 11\n正确答案是 **C.**。如果数据库启用了自动存储（这是\
  \ DB2 的默认行为），则其表空间的容器和空间管理特性由 DB2 数据库管理器决定。尽管你可以使用 `ALTER TABLESPACE` 命令向现有的 DMS\
  \ 表空间添加新容器，但你不能使用它向自动存储表空间添加新容器。要执行此类操作，你必须使用 `ALTER STOGROUP` 或 `CREATE STOGROUP`\
  \ 命令。该语句的基本语法为：\n\n![Image](img/296-3.jpg)\n\n### 问题 12\n正确答案是 **A.**。DMS 表空间由文件容器或原始设备容器组成，其大小在容器分配给表空间时设置。当容器内的所有空间都被使用时，表空间被认为已满。但对于\
  \ DMS 表空间，你可以使用 `ALTER TABLESPACE` 语句添加或扩展容器，为给定的表空间提供更多存储空间。\n\nDMS 表空间还有一个名为 `autoresize`（自动调整大小）的功能。当可以自动调整大小的\
  \ DMS 表空间空间空间时，DB2 数据库管理器可以扩展与表空间关联的一个或多个文件容器。（SMS 表空间也有类似的自动增长能力，但 `autoresize`\
  \ 一词专门用于 DMS。）你通过在创建表表的 `CREATE TABLESPACE` 语句中指定 `AUTORESIZE YES` 来启用 DMS 表空间的自动调整大小功能。例如，你可以使用以下\
  \ `CREATE TABLESPACE` 语句创建一个自动调整大小的 DMS 表空间：\n\n![Image](img/297-1.jpg)\n\n你也可以在\
  \ DMS 表空间创建后，通过执行指定 `AUTORESIZE YES` 的 `ALTER TABLESPACE` 语句来启用自动调整大小功能。例如：\n\n\
  ![Image](img/297-2.jpg)\n\n### 问题 13\n正确答案是 **C.**。如果数据库启用了自动存储，你可以在 `CREATE TABLESPACE`\
  \ 命令中指定 `MANAGED BY AUTOMATIC STORAGE` 子句来创建自动存储表空间（或者你可以完全省略此子句；在这种情况下，将隐含使用自动存储）。在这种情况下，不提供任何容器定义，因为\
  \ DB2 数据库管理器会自动分配容器。\n\n尽管自动存储表空间看起来是不同的表空间类型，但它们实际上是现有 SMS 和 DMS 类型的扩展。如果正在创建的表空间是\
  \ `REGULAR`（常规）或 `LARGE`（大型）表空间，它将作为带有文件容器的 DMS 创建。如果正在创建的表空间是 `USER` 或 `SYSTEM\
  \ TEMPORARY`（系统临时）表空间，它将作为带有目录容器的 SMS 创建。\n\n### 问题 14\n正确答案是 **A.**。你可以通过创建存储组或向默认存储组\
  \ `IBMSTOGROUP` 添加存储路径，将非自动存储数据库转换为自动存储数据库。然后你可以通过执行以下命令将表空间转换为使用自动存储：\n\n![Image](img/297-3.jpg)\n\
  \n要将内容从旧容器移动到新的自动存储路径，请使用 `REBALANCE` 命令：\n\n![Image](img/297-4.jpg)\n\n### 问题 15\n\
  正确答案是 **D.**。你可以使用 `ALTER TABLESPACE` 命令将 DMS 表空间转换为自动存储表空间。示例命令看起来所示：\n\n![Image](img/298.jpg)\n\
  \n### 问题 16\n正确答案是 **D.**。只有自动存储空间表空间可以使用存储组。你可以在一个存储组上创建多个表空间；然而，一个表空间应该只使用一个存储组。存储组通过多温度存储功能根据温度管理数据。\n\
  \n### 问题 17\n正确答案是 **D.**。当你创建一个数据库时，它会创建三个表空间：\n\n*   名为 `SYSCATSPACE` 的常规表空间，存储与数据库相关的系统目录表和视图\n\
  *   名为 `USERSPACE1` 的常规表空间，存储所有用户定义的对象（如表、索引等）以及用户数据、索引数据和长标值数据\n*   名为 `TEMPSPACE1`\
  \ 的系统临时表空间，它是用于数据排序、重组表和创建索引等操作的临时存储区域\n\n### 问题 18\n正确答案是 **D.**。你可以使用 `ADMIN_MOVE_TABLE`\
  \ 过程在线移动表，而不影响数据的可用性。使用 `db2relocatedb` 命令将重命名数据库或将数据库从一个位置移动到另一个位置。`db2move` 工具将数据从一个表复制到另一个表，或从一个模式复制到另一个模式。`ADMIN_MOVE_TABLE_UTIL`\
  \ 与 `ADMIN_MOVE_TABLE` 配合工作，提供了一种更改 `ADMIN_MOVE_TABLE` 协议表中用户定义值的机制。\n\n### 问题 19\n\
  正确答案是 **B.**。当你将表空间从旧存储组移动到新存储组或删除可用的存储路径时，DB2 数据库管理器会在移动数据从旧到新的同时执行反向重平衡操作。当存储路径处于\
  \ `Drop Pending`（等待删除）状态时，数据库管理器执行反向重平衡，区的移动从高水位区（表空间中包含数据的最后一个可能的区）开始，并在区 0 结束。\n\
  \n如果在执行重定向恢复（redirect restore）操作期间，省略了设置表空间容器阶段或指定了无效路径，你会看到“必须定义存储”（Storage must\
  \ be defined）状态的表空间。其他状态都是 DB2 中的无效状态。\n\n### 问题 20\n正确答案是 **A.**。你可以使用 `ALTER TABLESPACE`\
  \ 命令将表空间在线从一个存储组移动到另一个。命令看起来所示：\n\n![Image](img/299.jpg)\n\n你也可以删除当前表空间 `TBSP1`并在指定的存储组上重新创建它。但是，你会丢失当前\
  \ `TBSP1` 表空间中的数据。`ALTER DATABASE ... MOVE` 和 `ALTER TABLESPACE ... MOVE` 命令不存在。\n\
  \n### 问题 21\n正确答案是 **D.**。声明临时表是一种代表单个应用程序持有的临时数据的特殊表。与基表一样，你可以在声明临时表上创建索引并收集统计信息。与基表（其描述和约束存储在所属数据库的系统目录表中）不同，声明临时表不是持久的，它们只能由创建它们的应用程序使用——且仅在应用程序的生命周期内有效。当创建声明临时表的应用程序终止时，表行将被删除，表的描述也将被删除。（然而，存储在临时表中的数据可以跨越事务边界。）\n\
  \n\n\n\n\n另一个显著区别在于每种类型的数据存储位置。在应用程序创建和使用声明的临时表之前，用户必须为应用程序将操作的数据库至少创建一个用户临时表空间，并且必须向适当的用户授予使用该表空间所需的权限。（在创建数据库时，默认不会创建用户临时表空间）。然而，基础表是在普通表空间中创建的。如果你在创建基础表时未指定表空间，则其数据将存储在\
  \ `USERSPACE1` 表空间中，该空间是在创建数据库时默认创建的。\n\n### 问题 22\n正确答案是 **D.**。如果你在创建对象时没有指定模式（schema）或限定符名（qualifier\
  \ name），则该对象被分配到默认模式，该模式通常是当前连接到数据库并创建该对象的用户 ID。在示例中，默认模式是 `DB2ADMIN`，因为使用了该用户 ID\
  \ 来建立数据库连接并创建了 `TEST_TAB` 表对象。\n\n### 问题 23\n正确答案是 **B.**。虽然表空间在物理上存储数据库中的对象，但模式（schemas）在逻辑上对数据库中的其他对象进行分类和分组，无论它们物理上存储在何处。\n\
  \n### 问题 24\n正确答案是 **A.**。RCT（包含索引表）需要较少的缓存缓冲区分配，因为没有需要维护的辅助对象。不需要索引，也不支持索引。\n\n\
  ### 问题 25\n正确答案是 **D.**。根据你在 `CREATE TABLE` 语句的 `PARTITION BY` 子句中提供的规范，给定表的数据被分区到多个存储对象。因此，如果你想创建一个名为\
  \ `DEPARTMENTS` 的表并对其进行分区，使得数值在 0 到 9 范围内的行存储在位于一个表空间的分区中，数值在 10 到 19 范围内的行存储在位于另一个表空间的另一个分区中，此类推，你可以执行类似下面的\
  \ `CREATE TABLE` SQL 语句来实现：\n\n```\n![Image](img/300.jpg)\n```\n\n### 问题 26\n正确答案是\
  \ **D.**。默认情况下，DB2 创建分区索引。分区索引由一组索引分区组成，每个分区都包含单个数据分区的索引项。每个索引分区只引用其对应数据分区中的数据。\n\
  \n### 问题 27\n正确答案是 **D.**。默认情况下，DB2 创建分区索引；然而，你可以在索引创建命令中指定 `PARTITIONED` 关键字。分区索引由一组索引分区组成，每个分区都包含单个数据分区的索引项。每个索引分区只引用其对应数据分区中的数据。\n\
  \n### 问题 28\n正确答案是 **A.**。默认情况下，DB2 创建分区索引；然而，你可以在索引创建命令中指定 `NOT PARTITIONED` 关键字，以将所有索引键存储在一个表空间中。在示例中，你在\
  \ `CREATE TABLE` 命令中指定了 `INDEX IN` 子句，因此所有索引键都存储在 `TBSP3` 中。\n\n### 问题 29\n正确答案是\
  \ **D.**。尽管你在 `CREATE TABLE` 命令中指定了 `INDEX IN` 子句，但关键字 `NOT PARTITIONED` 或 `PARTITIONED`\
  \ 具有更高优先级。在这种情况下，`CREATE INDEX` 命令中的默认子句是 `PARTITIONED`，因此索引存储在它们各自的数据表空间中。\n\n\
  ### 问题 30\n正确答案是 **D.**。被拆离（detached）的数据分区通过以下两个阶段的过程转换为独立表：\n\n*   `ALTER TABLE…DETACH\
  \ PARTITION` 操作在逻辑上将数据分区从分区表中拆离。\n*   一个异步分区拆离（索引清理）任务将逻辑上拆离的分区转换为独立表。\n\n### 问题\
  \ 31\n正确答案是 **B.**。你可以使用 `DB2_INDEX_PCTFREE_DEFAULT` 注册表变量来指定构建索引时每个索引页留出的空空间百分比。注册表变量\
  \ `DB2_INDEX_FREE` 具有与 `DB2_INDEX_PCTFREE_DEFAULT` old 的功能；但它已弃用。`DB2_PARTITIONEDLOAD_DEFAULT`\
  \ 注册表变量允许你在 ESE 环境在未指定 ESE 特有加载选项时更改 Load 工具的默认行为。默认值为 `YES`，表示在 ESE 环境中，如果你没有指定\
  \ ESE 特有的加载选项，则将尝试在定义了目标表的所有数据库分区上进行加载。当值为 `NO` 时，则仅在 Load 工具当前连接的数据库分区上尝试加载。如果你将\
  \ DB2 注册表变量 `DB2_ENABLE_AUTOCONFIG_DEFAULT` 设置为 `YES`，DB2 数据库管理器会在创建数据库后自动调用配置顾问（Configuration\
  \ Advisor）。\n\n### 问题 32\n正确答案是 **C.**。当你创建一个 MDC 表时，你指定用于聚类表数据的维度键（或多个键）。你可以像索引键一样，用一列或多列来定义指定的每个维度。对于指定的每个维度，系统将自动创建一个维度块索引（dimension\
  \ block index），该索引将用于快速、高效地沿每个指定的维度访问数据。维度块索引指向的是区段（extents）而不是单行，因此比普通索引小得多。这些维度块索引可以非常快速地访问包含特定维度值的表区段。此外，还会自动创建一个块索引（block\
  \ index），其中包含所有维度键列。块索引将在插入和更新活动期间维护数据的聚类性，并提供快速、高效的数据访问。\n\n系统还会自动创建一个包含所有维度键列的复合块索引（composite\
  \ block index）。复合块索引在插入和更新活动期间维护数据的聚类性。复合块索引还用于查询处理，以访问具有具有特定维度值的表数据。\n\n### 问题\
  \ 33\n正确答案是 **B.**。RCT 的限制如下：\n\n*   RCT 不能在 pureScale 环境中使用。\n*   分区表不能是 RCT。\n\
  *   声明和创建的临时表不能是 RCT。\n*   自动汇总表不能是 RCT。\n*   不支持 `LOAD` 命令。\n*   不支持 `REORG` 命令。\n\
  *   MDC 和聚类索引与 RCT 不兼容。\n*   不支持压缩。\n*   不支持对 RCT 进行反向扫描（reverse scans）。\n*   不支持\
  \ `IMPORT` 命令的 `REPLACE` 参数。\n*   在 `ALTER TABLE … ACTIVATE NOT LOGGED INITIALLY`\
  \ 命令上不支持 `WITH EMPTY TABLE` 子句。\n\n### 问题 34\n正确答案是 **C.**。声明全局临时表（Declared global\
  \ temporary tables）受到某些不适用于普通基础表的限制。其中一个限制是，不能使用 `IMPORT` 和 `LOAD` 工具来填充这些表。\n\n\
  ### 问题 35\n正确答案是 **A.**。RCT 在查询处理期间可以带来显著的性能优势，因为所需的 I/O 操作较少。此外，RCT 需要较少的缓存缓冲区分配，因为没有需要维护的辅助对象；不需要索引，也不支持索引。\n\
  \n### 问题 36\n正确答案是 **C.**。ITC 表提供了一种基于插入时间维护数据聚类的有效方法，且空间管理更简单。ITC 表的特征如下：\n\n*\
  \   ITC 表记录根据其插入时间进行聚类。\n\n\n\n\n\n* ITC 表与 MDC 表具有相似特性——它们使用基于块的数据分配和维度块索引。然而，其数据组织方案基于隐式创建的虚拟维度（记录插入时间），而不是显式指定的维度列。\n\
  * ITC 表通过使用 `CREATE TABLE … ORGANIZE BY INSERT TIME` 子句创建。\n* 通过执行 `REORG TABLE\
  \ … RECLAIM EXTENTS` 命令，可以完成 ITC 表的 own 回收。\n* ITC 表可以是范围分区表。\n\n### 题 37\n正确答案是\
  \ **B.**。`DATA INITIALLY DEFERRED REFRESH DEFERRED` 需要执行 `REFRESH TABLE` 命令来从基表填充\
  \ MQT 表。\n\n### 题 38\n正确答案是 **B.**。目前没有直接的命令可以将 ITC 表转换为 MDC 表。你必须识别维度列，使用所识别的维度列创建\
  \ MDC 表，然后将数据从 ITC 表复制到 MDC 表。\n\n### 题 39\n正确答案是 **C.**。当指定的文档插入到 `CUSTOMER` 表的\
  \ `CUSTINFO` 列时，值 `27603` 和 `29501` 将被添加到 `CUST_ZIP_IDX` 索引中，值 Raleigh 将添加到 `CUST_CITY_IDX`\
  \ 索引中。\n\n### 题 40\n正确答案是 **B.**。正如你可以使用关系型数据上的索引来提高查询性能一样，你可以使用 XML 数据上的索引来提高对存储在\
  \ XML 列中的 XML 文档查询效率。与传统的关系型索引（索引键由你指定的一个或多个列组成）不同，XML 数据索引使用特定的 XML 模式表达式来索引存储在单列中的\
  \ XML 文档中的路径和值——该列的数据类型必须是 XML。XML 列的全部或部分内容都可以被索引。\n\n### 题 41\n正确答案是 **B.**。若要在表上使用数据行压缩，必须满足两个前提条件：\n\
  * 必须在表层级启用压缩。\n* 必须为该表构建压缩字典。\n\n### 题 42\n正确答案是 **D.**。当对表启用压缩时，索引数据也会被压缩。但是，由于压缩表中的记录在存储和内存之间是以压缩格式移动的（压缩字典也会移动到内存中以便进行解压），写入事务日志文件的压缩表记录也将被压缩。要启用事务日志压缩，请使用数据库配置参数\
  \ `LOGARCHCOMPR1` 和 `LOGARCHCOMPR2`。\n\n### 题 43\n正确答案是 **A** 和 **C.**。虽然你可以通过将\
  \ `COMPRESS` 属性设置为 `YES` 来随时为表启用数据行压缩，但你可以通过 `REORG` 和 `INSPECT` 命令强制存储在表中的数据创建压缩字典。\n\
  \n### 题 44\n正确答案是 **B.**。你可以通过执行离线表重组操作来强制构建压缩字典（并压缩表中的数据）。通过执行指定 `KEEPDICTIONARY`\
  \ 或 `RESETDICTIONARY` 的 `REORG` 命令来启动此类操作。如果你指定任一选项执行 `REORG` 命令且不存在压缩字典，则将构建新字典。然而，如果你指定任一选项执行\
  \ `REORG` 命令且字典已存在，表中的数据将会被重组并压缩，且现有字典将被重新创建（`RESETDICTIONARY`）或保持原样（`KEEPDICTIONARY`）。\n\
  \n### 题 45\n正确答案是 **B** 和 **E.**。在查询时间段规范时，你同时需要基时间表及其关联的历史表。同样，当你创建历史表并指定 `WITH\
  \ RESTRICT ON DROP` 子句时，当基时间表被删除时，历史表不会被删除。否则，时间表和历史表将在单条 `DROP TABLE` 命令中被删除。\n\
  \n### 题 46\n正确答案是 **B.**。临时表始终使用静态行压缩算法进行压缩。用户无法决定哪些表需要压缩，哪些表不需要。\n\n### 题 47\n\
  正确答案是 **B.**。自适应行压缩依赖于页级构建的压缩字典，并压缩页内不属于静态字典的模式。\n\n### 题 48\n正确答案是 **A.**。当你启用表压缩时，所有关联索引默认都会压缩。如果你不想压缩特定索引，请在\
  \ `CREATE INDEX` 命令中指定 `COMPRESS NO` 子句。\n\n### 题 49\n正确答案是 **A.**。当你创建一个启用了压缩的表时，所有关联索引默认会被压缩。因此，索引创建命令\
  \ `CREATE INDEX ix1_employee ON employee (ID)` 将继承索引压缩功能。如果你不想压缩特定索引，请在 `CREATE\
  \ INDEX` 命令中指定 `COMPRESS NO` 子句。\n\n### 题 50\n正确答案是 **A.**。要禁用表的压缩，或从一种行压缩类型更改为另一种，请发布\
  \ `ALTER TABLE` 语句并使用 `REORG TABLE` 命令执行离线表重组。\n\n# 第 4 章\n## 业务规则实现\n\n本章将向你介绍每天用于数据库层定义实体、属性、关系和约束的业务规则，而不是在应用层定义它们。它还包含介绍关键系统目录表的主题，这些数据表描述了数据的物理和逻辑结构。\n\
  \n## 考试目标\n* 证明理解各种约束的能力，并识别何时以及如何使用 `NOT NULL` 约束、`DEFAULT` 约束、`CHECK` 约束、`UNIQUE`\
  \ 约束、完整性约束以及约束\n* 证明创建包含多个约束的基表的能力\n* 证明识别完整性约束父表上的操作如何反映在子表中的能力\n* 证明创建和使用触发器的能力\n\
  * 证明使用 `SET INTEGRITY` 命令的能力\n* 证明检查系统目录表内容\n\n## 业务规则\n业务规则是定义或限制业务某些特性的陈述。根据 Business\
  \ Rules Group ([www.businessrulesgroup.org](http://www.businessrulesgroup.org))\
  \ 组织，业务规则属于以下之一：\n* 业务术语的定义（实体规则）。实体是对业务重要且值得记录的对象的信息的集合。业务术语在特定语境下具有特定含义。这描述了人们如何思考事物并根据行为和依赖关系对其分类。\n\
  * 术语之间的事实（关系和基数规则）。表达术语之间的关系以及特定情况下的行为。\n* 约束。每个组织都以某种方式限制行为以防止某些操作发生。\n* 推导。定义了组织如何将知识从一种形式转换为另一种形式以得出事实或推理。\n\
  \n\n\n\n\n本节侧重于约束规则。与大多数业务场景一样，数据通常必须遵循一组特定的规则和限制。例如，公司在生成采购订单时通常会使用特定的格式和编号序列。约束允许你直接在数据库中放置执行此类业务规则所需的逻辑，而不是在与数据库交互的应用程序中实现。本质上，约束是用于规范数据值如何被添加到表中，以及这些值在添加后如何能被修改的规则。\n\
  \n以下类型的约束包括：\n\n*   `NOT NULL`\n*   `DEFAULT`\n*   `CHECK`\n*   `UNIQUE`\n*   引用完整性\
  \ (Referential integrity)\n*   信息 (Informational)\n\n约束通常在创建表时定义；但也可以通过 `ALTER TABLE`\
  \ SQL 语句向现有表添加约束。\n\n## 非空约束 (Not Null Constraints)\n\n在 DB2 中，你使用 `NULL` 值（不要与空字符串混淆）来表示缺失或未知的数据或状态。默认情况下，表中的每一列都接受\
  \ `NULL` 值。这允许你在与记录相关的所有值都未知时，向表中添加记录。然而，某些情况下，这种行为可能是不可接受的（例如，为公司工作的每位员工可能都需要税收识别号）。当出现这种情况时，使用\
  \ `NOT NULL` 约束可以确保基础表中的特定列永远不会分配 `NULL` 值；一旦你为列定义了 `NOT NULL` 约束，任何尝试在该列中放置 `NULL`\
  \ 值的操作将失败。图 4.1 展示了如何使用 `NOT NULL` 约束避免插入 `NULL` 值。\n\n![Image](img/309.jpg)\n\n\
  *图 4.1：NOT NULL 约束防止 NULL 值*\n\n由于 `NOT NULL` 约束与基础表中的特定列相关，它们通常在表创建过程中或表更改过程中定义。上述场景的\
  \ DB2 命令和结果如下：\n\n![Image](img/309-310.jpg)\n\n如果你在奇 `TBSPACEID=2`、`TABLEID=258,`\
  \ 和 `COLNO=2` 是什么，它们都是系统目录表中关于该表和列的元数据信息。你可以使用类似下面的命令来查询系统目录表或视图：\n\n![Image](img/310.jpg)\n\
  \n## 默认约束 (Default Constraints)\n\n正如有时接受 `NULL` 值是不可接受的，有时你可能希望系统为你提供一个特定值（例如，你可能希望在向表中添加新记录时，自动为特定列分配当前日期）。在这些情况下，你可以使用\
  \ `DEFAULT` 约束来确保每次向表中添加记录时，基础表中的特定列都会分配一个预定义值（除非该值被覆盖）。提供的预定义值可以是 `NULL`（如果未为该列定义\
  \ `NOT NULL` 约束）、与列数据类型兼容的用户提供的值，或 DB2 数据库管理器提供的值。表 4.1 显示了 DB2 数据库管理器为各种 DB2 数据类型提供的默认值。\n\
  \n| 表 4.1：DB2 默认值 |\n| 列数据类型 | 提供的默认值 |\n| :--- | :--- |\n| 小整数 (`SMALLINT`) | 0\
  \ |\n| 整数 (`INTEGER` 或 `INT`) | 0 |\n| 小数 (`DECIMAL`, `DEC`, `NUMERIC` 或 `NUM`)\
  \ | 0 |\n| 单精度浮点数 (`REAL` 或 `FLOAT`) | 0 |\n| 双精度浮点数 (`DOUBLE`, `DOUBLE PRECISION`\
  \ 或 `FLOAT`) | 0 |\n| 固定长度字符字符串 (`CHARACTER` 或 `CHAR`) | 空格字符字符串 |\n| 变长度字符字符串 (`CHARACTER\
  \ VARYING`, `CHAR VARYING` 或 `VARCHAR`) | 零长度字符串 |\n| 长变长度字符字符串 (`LONG VARCHAR`)\
  \ | 零长度字符串 |\n| 固定长度双字节字符字符串 (`GRAPHIC`) | 空格字符字符串 |\n| 变长度双字节字符字符串 (`VARGRAPHIC`)\
  \ | 零长度字符串 |\n| 长变长度双字节字符字符串 (`LONG VARGRAPHIC`) | 零长度字符串 |\n| 日期 (`DATE`) | 记录添加到表时的系统日期（当向现有表添加日期列时；现有行被分配\
  \ 0001 年 1 月 1 日） |\n| 时间 (`TIME`) | 记录添加到表时的系统时间（当向现有表添加时间列时；现有行被分配时间 00:00:00）\
  \ |\n| 时间戳 (`TIMESTAMP`) | 记录添加到表时的系统日期和时间（包括微秒）（当向现有表添加时间戳列时；现有行被分配对应 0001 年 1\
  \ 月 1 日 - 00:00:00.000000 的戳） |\n| 二进制大对象 (`BLOB`) | 零长度字符串 |\n| 字符对象 (`CLOB`) |\
  \ 零长度字符串 |\n| 双字节字符对象 (`DBCLOB`) | 零长度字符串 |\n| XML 文档 (`XML`) | 不适用 |\n|  | 不适用\
  \ |\n\n## 检查约束 (Check Constraints)\n\n有时，控制特定项目接受哪些值以及不接受哪些值是理想的（例如，公司可能决定所有非免税员工的工资至少要达到联邦最低工资）。在这种情况下，你可以将判断值是否可接受所需的逻辑直接整合到收集数据的输入程序中。\n\
  \n实现相同目标的更好方法是在接收数据的表列上定义 `CHECK` 约束。你可以使用 `CHECK` 约束（称为表检查约束）来确保基础表中的特定列永远不会被分配不可接受的值——一旦你为列定义了\
  \ `CHECK` 约束，任何尝试在该列中放置不符合特定标准的操作将失败。\n\n`CHECK` 约束由一个或多个谓词组成，通过关键字 `AND` 或 `OR`\
  \ 连接，合称为检查条件。此检查条件与你提供的数据值进行比较，比较结果作为 `TRUE`、`FALSE` 或 `Unknown` 值返回。如果 `CHECK`\
  \ 约束返回 `TRUE`，则该值是可以接受的，因此会被添加到列。然而，如果 `CHECK` 约束返回 `FALSE` 或 `Unknown`，尝试在列中放置值的操作将失败，该操作的所有更改都将回滚。但是，重要的是，当特定操作的结果由于违反\
  \ `CHECK` 约束而回滚时，调用该操作的事务不会终止，该事务中的其他操作不受影响。图 4.3 展示了如何使用简单的 `CHECK` 约束来控制列接受哪些数据值。\n\
  \n![Image](img/314.jpg)\n\n\n\n\n\n图 4.3：如何使用 CHECK 约束来控制哪些数据值是可以的\n\n与 `NOT NULL`\
  \ 约束和 `DEFAULT` 约束一样，`CHECK` 约束与基表中的特定列相关联，并且通常在表创建过程中或表更改过程中定义。上述场景的 DB2 命令和结果所示：\n\
  \n![Image](img/315.jpg)\n\n你可以通过查询 `SYSIBM.CHECK_CONSTRAINTS` 系统目录表来获取 `CHECK` 约束信息，如下所示：\n\
  \n![Image](img/315-316.jpg)\n\n## 唯一约束 (Unique Constraints)\n\n默认情况下，添加到基表中的记录可以在任何列上分配相同的值，且可以任意多次。只要表中存储的记录不包含不应重复的信息，这种行为就是可以接受的。然而，有时构成记录的某些信息必须是唯一的（例如，如果为特定公司的每位员工分配一个员工识别号，那么每个编号必须是唯一的——两个员工绝不能拥有相同的员工识别号）。\n\
  \n在这种情况下，你可以使用 `UNIQUE` 约束来确保在向基表添加记录时，分配给一个或多个列的值始终是唯一的。一旦你为一个或多个列定义了 `UNIQUE`\
  \ 约束，任何尝试在这些列中放置重复值的操作都将失败。图 4.4 展示了如何使用 `UNIQUE` 约束。\n\n![Image](img/316.jpg)\n\
  \n图 4.4：如何使用 UNIQUE 约束控制数据值的重复\n\n与 `NOT NULL` 约束、`DEFAULT` 约束和 `CHECK` 约束不同（这些约束只能与基表中的单个列关联），`UNIQUE`\
  \ 约束可以与单个列或一组列关联。然而，无论你如何对列进行分组，基表中的每个列只能参与一个 `UNIQUE` 约束。与其他约束一样，`UNIQUE` 约束通常在表创建过程中或表更改过程中定义。上述场景的\
  \ DB2 命令和结果所示：\n\n![Image](img/317.jpg)\n\n无论你何时定义 `UNIQUE` 约束，在创建它时，DB2 数据库管理器都会检查是否已存在\
  \ `UNIQUE` 约束所引用列的索引。如果是，该索引将被标记为唯一且系统所需的（当索引被标记为系统需要时，在不删除基表上约束的情况下无法删除它）。如果没有，将创建一个适当的索引并标记为唯一且系统需要。该索引将在每当为定义了唯一约束的列添加新记录时，强制执行唯一性。与其他约束一样，你可以通过查询系统目录视图来验证唯一性规则：\n\
  \n![Image](img/318.jpg)\n\n由于 `EMPLOYEE` 表的 `EMPID` 列没有有效索引，DB2 数据库管理器创建了索引 `SQL140717202520710`\
  \ 并将其标记为系统需要。为了提供更好的命名规范，建议创建一个索引并将 `UNIQUE` 约束与先创建的索引关联，如下所示：\n\n![Image](img/318-319.jpg)\n\
  \nDB2 数据库管理器正在使用 `DATAMARTS.IX1_EMPLOYEE` 索引在表上构建 `UNIQUE` 约束。你也可以像下面所示在系统目录视图中验证唯一规则：\n\
  \n![Image](img/319.jpg)\n\n主键（primary key，我们将在接下来查看它）是 `UNIQUE` 约束的一种特殊形式。每个表只能包含一个主键，并且定义主键的每个列必须分配\
  \ `NOT NULL` 约束。除了确保添加到表的每条记录具有某些唯一特征外，主键还允许表参与引用性约束。\n\n表可以有任意数量的 `UNIQUE` 约束；然而，一个表在同一组列上不能定义多个\
  \ `UNIQUE` 约束。因为 `UNIQUE` 约束是通过索引强制的，所以适用于索引的所有限制（例如，允许最多 64 个列且总长度为 8,192 字节；任何列不能具有大对象、长字符字符串数据类型）也适用于\
  \ `UNIQUE` 约束。\n\n虽然唯一的、系统所需的索引可以强制 `UNIQUE` 约束，但定义 `UNIQUE` 约束和创建唯一索引之间存在区别。两者都强制唯一性，但唯一索引允许\
  \ `NULL` 值，且通常不能用于引用性约束。然而，`UNIQUE` 约束不允许 `NULL` 值，并且可以在外键规范中被引用。（`NULL` 值意味着列的值是未定义的，与任何其他值（包括其他\
  \ `NULL` 值）不同。）\n\n## 引用完整性约束 (Referential Integrity Constraints)\n\n如果你曾与关系型数据库管理系统工作过任何段时间，你可能已经意识到数据归一化是一种用于确保只存在一种方法获取单一事实的技术。数据归一化之所以可能，是因为两个或多个单独的基表之间可以存在某种关系，并且如果需要，可以通过\
  \ `JOIN` 操作将相关基表中存储的信息组合起来。这就是引用完整性约束发挥作用的地方。你使用引用完整性约束（也称为引用约束和外键约束）来定义两个基表之间的所需关系。\n\
  \n为了理解引用约束如何工作，查看一个示例会有帮助。假设你拥有一家小型零件店，并使用数据库来跟踪你的库存。你备的许多零件仅适用于特定的品牌和型号；因此，你的数据库有一个\
  \ `MAKE` 表来存储品牌信息，另一个 `MODEL` 表来存储型号信息。由于这两个表是关联的（每个型号必须属于一个品牌），你可以使用引用性约束来确保 `MODEL`\
  \ 表中的每条记录在 `MAKE` 表中都有对应的记录。这两个表之间的关系是通过比较要添加到 `MODEL` 表的 `MAKEID` 列（作为子表的外键）的值与\
  \ `MAKE` 表构成主键的列集（作为父表的主键）的现有值来建立的。\n\n要创建上述的引用约束，你需要在 `MAKE` 表中使用一个或多个列定义一个主键，然后为\
  \ `MODEL` 表中的一个或多个对应列定义一个外键以引用 `MAKE` 表的主键。如果你使用名为 `MAKEID` 的列为 `MAKE` 表创建主键，并使用同样名为\
  \ `MAKEID` 的列为 `MODEL` 表创建外键，创建的引用性约束将类似于图 4.5 中的所示。\n\n![Image](img/321.jpg)\n\n\
  图 4.5：如何使用引用约束定义表之间的关系\n\n在这个示例中，单个列定义了引用约束的父键和外键。然而，与 `UNIQUE` 约束一样，你可以使用多个列来定义引用性约束的父键和外键。引用约束示例的\
  \ DB2 命令和结果如下：\n\n![Image](img/321-322.jpg)\n\n当你尝试向 `MODEL` 表插入一条在 `MAKE` 表中没有匹配值的记录时，`MODEL`\
  \ 表将由于带有错误 `SQL0530N` 而失败：\n\n![Image](img/322.jpg)\n\n\n\n\n\n引用性约束信息可以通过 `SYSCAT.REFERENCES`\
  \ 和 `SYSCAT.TABCONST` 系统目录表视图获取，如下：\n\n![Image](img/323-324.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** 用于创建引用性约束外键的列名不需要与创建该约束主键的列名相同（如上一个示例所示）。然而，构成引用性约束主键和外键的列或列的数据类型必须完全一致。\n\
  \n如你所见，引用性约束比 `NOT NULL, DEFAULT, CHECK,` 和 `UNIQUE` 约束复杂得多。事实上，它们非常复杂，以至于使用一组特殊术语来标识构成单个引用性约束的各个组件。尽管你可能已经熟悉其中一些，但表\
  \ 4.2 显示了术语的完整列表。\n\n| **表 4.2：引用完整性约束术语** |\n| **术语** | **含义** |\n| 唯一键 (Unique\
  \ key) | 一列或一组列，其中每一行的值都与其他所有行的值不同 |\n| 主键 (Primary key) | 一种不接受 NULL 值的特殊唯一键 |\n\
  | 外键 (Foreign key) | 子表中的一列或一组列，其值必须与父表中父键的值匹配 |\n| 父键 (Parent key) | 父表中的主键或唯一键，被引用性约束中的外键引用\
  \ |\n| 父表 (Parent table) | 包含引用性约束父键的表（表可以既是任意数量引用性约束的父表又是从属表） |\n| 父行 (Parent row)\
  \ | 父表中的某行，在从表中至少有一个匹配的行 |\n| 从属表或子表 (Dependent or child table) | 包含至少一个引用引用性约束父键的外键的表（表可以既是任意数量引用性约束的从属表又是父表）\
  \ |\n| 从属行或子行 (Dependent or child row) | 从属表中的某行，在父表中至少有一个匹配的行 |\n| 后代表 (Descendent\
  \ table) | 从属表或从属表的后代 |\n| 后代行 (Descendent row) | 从属行或从属行的后代 |\n| 引用循环 (Referential\
  \ cycle) | 一组定义的引用性约束，使得集合中的每个表都是其自身的后代 |\n| 自引用表 (Self-referencing table) | 在同一个引用性约束中既是父表又是从属表的表（该约束被称为\
  \ `self-referencing constraint`） |\n| 自引用行 (Self-referencing row) | 自身的父行 |\n\n\
  创建引用性约束的主要原因是为了确保当一个表对象引用另一个表时，都能维护数据完整性。只要引用性约束生效，DB2 数据库管理器就会确保对于子表中任何作为外键一部分的列中具有值的行，在父表中都存在对应的行。那么，当\
  \ SQL 操作尝试以违反引用性约束的方式操纵数据时会发生什么？为了回答这个问题，让我们看看如果没有引用性约束提供的检查和平衡机制，此类操作将如何损害数据完整性：\n\
  \n*   插入操作（insert）可能会向子表添加一行数据，该数据在相应的父表中没有匹配的值。例如，使用我们的 `MAKE/MODEL` 场景，你可能会向 `MODEL`\
  \ 表中添加一条在 `MAKE` 表中没有对应值的记录。\n*   更新操作（update）可能会更改子表中的现有值，使其在相应的父表中不再具有匹配的值。例如，你可能会修改\
  \ `MODEL` 表中的一条记录，使其不再在 `MAKE` 表中具有对应的值。\n*   更新操作可能会更改父表中的现有值，导致子表中的行值不再与父表中的匹配。例如，你可能会修改\
  \ `MAKE` 表中的一条记录，导致 `MODEL` 表中的记录不再具有相应的 `MAKE` 值。\n*   删除操作（delete）可能会从父表中删除一个值，导致子表中的行值不再与父表中的值匹配。例如，你可能会从\
  \ `MAKE` 表中删除一条记录，导致 `MODEL` 表中的记录不再具有相应的 `MAKE` 值。\n\nDB2 数据库管理器可以限制在参与引用性约束的表上执行这些类型的操作，或者它可以尝试以保护数据完整性的方式来执行这些操作。无论何种情况，DB2\
  \ 均使用一组规则来控制操作的行为：\n\n*   插入规则 (Insert Rule)\n*   更新规则 (Update Rule)\n*   删除规则 (Delete\
  \ Rule)\n\n每个引用性约束都有自己的一套规则。在创建引用性约束的过程中，指定每条规则的强制方式。\n\n# 引用性约束的插入规则\n\n插入规则保证，除非在关联父表的相应父键中存在匹配的值，否则无法将值插入到子表的外键中。任何尝试向子表插入违反此规则的记录的尝试都将导致\
  \ `SQL0530N` 错误，且插入操作将失败。相反，当向父表的父键中添加记录时，不会发生任何检查。\n\n创建引用性约束本身会隐式地为该约束创建插入规则。图\
  \ 4.6 阐述了符合插入规则的行是如何成功添加到子表的。\n\n![Image](img/326.jpg)\n*图 4.6：符合引用性约束插入规则的插入操作*\n\
  \n图 4.7 说明了违反插入规则的行如何导致插入操作失败。\n\n![Image](img/327.jpg)\n*图 4.7：违反引用性约束插入规则的插入操作*\n\
  \n上述场景的 DB2 命令和结果如下：\n\n![Image](img/328.jpg)\n\n当符合引用性约束的插入规则时，新记录被成功插入 `OBJECT`\
  \ 表；当不符合时，返回 SQL 错误 `SQL0530N`：\n\n![Image](img/329.jpg)\n\n需要注意的是，由于插入规则的存在，必须先向父表的父键插入记录，才能向子表插入相应的记录。回到\
  \ `MAKE/MODEL` 示例，这意味着在向 `MODEL` 表添加引用新 `MAKE` 的记录之前，必须先向 `MAKE` 表添加该 `MAKE` 的记录。\n\
  \n# 引用性约束的更新规则\n\n更新规则控制处理针对参与引用性约束的任一表（子表或父表）的更新操作。取决于你如何定义更新规则，存在两种行为：\n\n*  \
  \ `ON UPDATE RESTRICT`（限制）。该定义确保每当对引用性约束的父表执行更新操作时，子表中每一行外键的值在父键中的匹配值将与更新操作执行之前的匹配值相同。\n\
  *   `ON UPDATE NO ACTION`（无操作）。该定义确保每当对引用性约束中的任一表执行更新操作时，子表中每一行外键的值在相应的父键中都具有一个匹配的值；但该值可能与更新操作发生之前的值不同。\n\
  \n\n\n\n\n图 4.8 展示了如何通过 `ON UPDATE RESTRICT` 定义来执行更新规则（Update Rule）。\n\n![Image](img/330.jpg)\n\
  \n*图 4.8：如何使用引用性约束的更新规则执行 ON UPDATE RESTRICT*\n\n当您尝试更新 `C_ID` 列的数据时，您将得到错误 `SQL0531N`，因为在这种情况下更新是受限制的：\n\
  \n![Image](img/331-1.jpg)\n\n图 4.9 展示了当您使用 `ON UPDATE NO ACTION` 定义时，如何执行更新规则。\n\
  \n![Image](img/331-2.jpg)\n\n*图 4.9：如何使用引用性约束的更新规则执行 ON UPDATE NO ACTION*\n\n与插入规则（Insert\
  \ Rule）类似，在创建引用完整性约束时，会隐含创建更新规则。如果没有提供更新规则定义，则默认使用 `ON UPDATE NO ACTION` 定义。无论您使用哪种更新规则，只要不满足规则条件，更新操作将失败，显示错误消息，并且对参与该表中数据的任何更改都将回滚。\n\
  \n# 引用性约束的删除规则（Delete Rule）\n\n删除规则控制如何处理针对父表的删除操作。根据您对删除规则的定义，可能会出现四种行为：\n\n* \
  \  `ON DELETE CASCADE.` 这种定义确保当从父表中删除一个父行时，子表中所有具有相同主键值的依赖行也会被删除。\n*   `ON DELETE\
  \ SET NULL.` 这种定义确保当从父表中删除一个父行时，子表中所有具有相同主键值的依赖行都会被找到，并将其外键值改为 `NULL`（如果您尝试使用 `ON\
  \ DELETE SET NULL` 子句将外键列设置为 `NOT NULL`，将收到错误代码 `SQL0629N`，因为设置相互冲突）。其他行不受影响。\n\
  *   `ON DELETE RESTRICT.` 这种定义确保每当对父表执行删除操作时，子表中每行的外键值将保持执行删除操作之前的父表主键值。\n*   `ON\
  \ DELETE NO ACTION.` 这种定义确保每当对父表执行删除操作时，在执行其他引用性约束后，子表中每行的外键值将具有与父表相同的主键值。\n\n图\
  \ 4.10 展示了如何通过 `ON DELETE CASCADE` 定义执行删除规则。\n\n![Image](img/333.jpg)\n\n*图 4.10：如何使用引用性约束的删除规则执行\
  \ ON DELETE CASCADE*\n\n图 4.11 展示了如何通过 `ON DELETE SET NULL` 定义执行删除规则。\n\n![Image](img/334.jpg)\n\
  \n*图 4.11：如何使用引用性约束的删除规则执行 ON DELETE SET NULL*\n\n图 4.12 展示了如何通过 `ON DELETE RESTRICT`\
  \ 定义执行删除规则。\n\n![Image](img/335.jpg)\n\n*图 4.12：如何使用引用性约束的删除规则执行 ON DELETE RESTRICT*\n\
  \n图 4.13 展示了如何通过 `ON DELETE NO ACTION` 定义执行删除规则。\n\n![Image](img/336.jpg)\n\n*图\
  \ 4.13：如何使用引用性约束的删除规则执行 ON DELETE NO ACTION*\n\n在 `ON DELETE RESTRICT` 和 `ON DELETE\
  \ NO ACTION` 的情况下，`DELETE` 语句会收到来自 DB2 数据库器的 `SQL0532N` 错误。\n\n完整的错误消息如下：\n\n![Image](img/337.jpg)\n\
  \n与插入规则和更新规则一样，在创建引用性约束本身时，会隐含创建删除规则。如果没有提供删除规则定义，则默认使用 `ON DELETE NO ACTION` 定义。无论您使用哪种形式的删除规则，只要不满足规则条件，就会显示错误消息且删除操作失败。\n\
  \n如果您使用 `ON DELETE CASCADE` 删除规则，并且父表中父行的删除导致了相应子表中一个或多个依赖行的删除，则该删除操作被认为已传播到子表。在这种情况下，子表与父表是删除连接的（delete-connected）。因为删除连接的子表也可以是另一个引用性约束的父表，传播到一个子表的删除操作可以反而传播到另一个子表，以此此类推。因此，从单个父表中删除一个父行可能会导致另一个父表中删除一个父行。\n\
  \n# 信息性约束（Informational Constraints）\n\n每当向表中添加新数据或修改现有数据值时，DB2 数据库管理器会自动执行我们目前为止看到的所有约束。正如您所想象的，定义许多约束可能需要大量的开销来执行这些约束。\n\
  \n如果应用程序的编码方式是在将数据插入表之前对其进行验证，那么创建信息性约束可能比创建其他约束更有效率。与其他约束不同，信息性约束在插入和更新期间不被执行。然而，DB2\
  \ 优化器在考虑使用最佳访问计划时，会评估信息性约束提供的信息。\n\n您通过在约束定义后附加关键字 `NOT ENFORCED ENABLEABLE QUERY\
  \ OPTIMIZATION` 来定义信息性约束。因此，信息性约束可能会带来更好的查询性能，尽管约束本身不会被用于数据录入。图 4.14 展示了简单信息性约束的行为。\n\
  \n![Image](img/338.jpg)\n\n*图 4.14：简单信息性约束的行为*\n\n需要注意的是，由于 DB2 优化器在选择最佳数据访问计划时会评估信息性约束，某些查询可能无法返回违反信息性约束的插入记录。\n\
  \n例如，如果您对图 4.14 中的 `EMPLOYEE` 表执行 `SELECT` 查询，将不会返回任何记录，因为所选的访问计划假设表中不存在 `TAX_ID`\
  \ 值小于 1000 的记录：\n\n![Image](img/338-2.jpg)\n\n然而，执行不带过滤谓词的 `SELECT` 将返回表中存在的所有数据，如下：\n\
  \n![Image](img/339-1.jpg)\n\n您可以使用 `ALTER TABLE` 命令禁用该表的查询优化：\n\n![Image](img/339-2.jpg)\n\
  \nDB2 数据库管理器将不再在使用约束从 `EMPLOYEE` 表中检索数据。因此，查询表产生的结果将如下：\n\n![Image](img/339-3.jpg)\n\
  \n## 设置完整性命令\n\n\n\n\n\n虽然约束提供了一种在对基础表进行数据操作时维持某种程度完整性的方法，但它们的强制执行可能会阻止某些操作的成功执行。例如，假设你想使用\
  \ `Load` 实用程序向基础表批量加载 10,000 行数据（我们将在第 6 章）“DB2 实用程序”中更详细地介绍它）。如果数据包含了违反你为要加载数据的目标表所定义的约束的值，则该操作将失败。或者，假设你想对一个已经包含数百行数据的现有表添加新约束。如果表中有一行或多行数据包含了违反你想要添加的约束的键值，则任何添加该约束的尝试都将失败。在这些情况下，暂时挂起约束检查以执行所需的操作可能是有益的。然而，当你挂起约束检查时，在某个时刻必须恢复它，并且届时你必须定位并处理表中导致违反约束的行。\n\
  \n## 挂起约束检查\n\n通过执行 `SET INTEGRITY` SQL 语句可以临时挂起表的约束检查。当用于挂起约束检查时，该语句最简单形式的语法如下：\n\
  \n![Image](img/340-1.jpg)\n\n| where: |\n| `TableName` | 标识要临时挂起约束检查的一个或多个基础表的名称\
  \ |\n| `AccessMode` | 标识在约束检查挂起期间，指定的表是否可以以只读模式访问；此参数的有效值为：`NO ACCESS` 和 `READ ACCESS`——如果未指定访问模式，则默认使用\
  \ `NO ACCESS` |\n\n因此，如果你想临时挂起表 `EMPLOYEE` 的约束检查，并在关闭约束检查时拒绝对该表的只读访问，请执行 `SET INTEGRITY`\
  \ 语句：\n\n![Image](img/340-2.jpg)\n\n对特定表挂起约束检查会将该表置于完整性检查等待（Set Integrity Pending）状态，表示它包含未经过检查的数据，并且可能存在约束违反。在表处于完整性检查等待状态期间，它不能用于\
  \ select、insert、update 或 delete 操作，也不能被任何需要执行此类类型操作的 DB2 实用程序使用。此外，在表处于完整性检查等待状态时，不能为其创建索引，并且只有当使用\
  \ `SET INTEGRITY` 语句将表置于完整性检查等待状态时指定的访问模式允许只读访问时，才能检索表中存储的数据。\n\n## 恢复约束检查\n\n正如\
  \ `SET INTEGRITY` 语句的一种形式会临时挂起约束检查，另一种形式将恢复它。在这种情况下，`SET INTEGRITY` 语句最简单形式的语法如下：\n\
  \n![Image](img/341-1.jpg)\n\n或\n\n![Image](img/341-2.jpg)\n\n| where: |\n| `TableName`\
  \ | 标识要恢复挂起的约束检查的一个或多个基础表的名称；这些表也是所有违反引用完整性约束或检查约束的行将被复制的基础表 |\n| `ExceptionTable`\
  \ | 标识一个基础表的名称，所有违反引用完整性约束或检查约束的行将被复制到该基础表中 |\n| `ConstraintType` | 标识要恢复的约束检查类型；此参数的有效值为：`FOREIGN\
  \ KEY, CHECK, MATERIALIZED QUERY, GENERATED COLUMN, STAGING,` 和 `ALL` |\n\n因此，为了恢复你在上一个示例中挂起的\
  \ `EMPLOYEE` 表的约束检查，请执行类似于下所示 `SET INTEGRITY` 语句：\n\n![Image](img/341-3.jpg)\n\n\
  当执行这种特定形式的 `SET INTEGRITY` 语句时，`EMPLOYEE` 表将从完整性检查等待状态移除，并对表中存储的每行数据进行约束违反检查。如果发现违规行，约束检查将停止，`EMPLOYEE`\
  \ 表将返回完整性检查等待状态。然而，考虑以下形式的 `SET INTEGRITY` 语句：\n\n![Image](img/341-4.jpg)\n\n当你执行此语句时，发现的违反你为\
  \ `EMPLOYEE` 表定义的一个或多个约束的每一行都将被复制到名为 `BAD_ROWS,` 的表中，如果需要，可以在该表中对其进行修正并将其复制回 `EMPLOYEE`\
  \ 表。\n\n然而，如果你执行以下形式的 `SET INTEGRITY` 语句，`EMPLOYEE` 表将退出完整性检查等待状态，且不进行任何约束检查：\n\n\
  ![Image](img/342-1.jpg)\n\n但是，这样做非常危险；只有在你拥有某些独立手段可以确保 `EMPLOYEE` 表不包含违反为 `EMPLOYEE`\
  \ 表定义的一个或多个约束的数据时，才这样做这样做。\n\n![Image](img/note.jpg)\n\n**注意：** 当表处于完整性检查等待状态且你尝试查询它时，你将收到\
  \ SQL0668N 错误：\n\n![Image](img/342-2.jpg)\n\n你可以通过运行以下命令获取处于完整性检查等待状态表的列表：\n\n![Image](img/342-3.jpg)\n\
  \n当你对带有异常表的表完成 `SET INTEGRITY` 检查命令时，你将收到一条类似的警告消息：\n\n![Image](img/342-4.jpg)\n\
  \n你可以利用以下 UNIX 脚本自动对所有完整性检查等待表运行 INTEGRITY 检查：\n\n![Image](img/343.jpg)\n\n创建异常表时需要遵循某些规则：\n\
  \n*   如果表受安全策略保护，则异常表必须受相同的策略保护。\n*   异常表的前 `n` 列与被检查表的列相同。所有列属性（包括名称、数据类型和长度）必须一致。对于受保护的列，安全标签在两个表中必须相同。\n\
  *   异常表的所有列都不能有约束和触发器。约束包括引用完整性约束和检查约束，以及可能导致插入错误的唯一索引约束。\n*   异常表的 `(n+1)` 列是一个可选的\
  \ `TIMESTAMP` 列。用于标识对同一表的多次调用（如果异常表中的行尚未被删除）。时间精度可以是 0 到 12 之间的任何值，分配的值将是 `CURRENT\
  \ TIMESTAMP` 寄存器的结果。\n*   `(n+2)` 列必须为 `CLOB` (32 KB) 或更大。该列是可选的但建议使用；它将提供违反行内约束的名称。\n\
  *   不允许额外的列。\n*   异常表不能是分区表、范围聚集表、物化查询表或临时表。\n\n## 创建表和约束\n\n虽然可以通过执行 `ALTER TABLE`\
  \ SQL 语句向现有表添加约束，但通常会在创建表的过程中定义它们。与许多数据库对象一样，表可以通过 IBM Data Studio 的 SQL 和例程开发视图或\
  \ IBM Data Studio 的数据库管理视图创建，也可以通过 CLP 创建。在本节中，我们将更多地关注命令语法以及通过 CLP 执行，而不是使用 IBM\
  \ Data Studio 编辑器。\n\n\n\n\n也可以使用 `CREATE TABLE` SQL 语句创建表。在最简单的形式下，该语句的语法如下：\n\n\
  ![Image](img/344-1.jpg)\n\n| where: | |\n| :--- | :--- |\n| `TableName` | 指定分配给要创建表的名称（表名在定义该表的\
  \ schema 中必须是唯一的） |\n| `Element` | 指定包含在表定义中的一个或多个列、`UNIQUE`/`primary key constraints`、引用约束、`CHECK`\
  \ 约束以及信息约束；定义这些元素中每个元素时所使用的语法取决于所定义的元素类型 |\n| `TablespaceName` | 指定用于存储表及其常规数据、索引或长/大对象数据的表空间名称\
  \ |\n\n定义列的基本语法为：\n\n![Image](img/344-2.jpg)\n\n| where: | |\n| :--- | :--- |\n\
  | `ColumnName` | 指定分配给要创建的列的唯一名称 |\n| `DataType` | 指定分配给要创建列的数据类型（内置或用户定义）；指定的数据类型决定了列中可以存储的数据值类型（表\
  \ 4.3 包含了有效数据类型定义的列表） |\n| `DefaultValue` | 在对表执行插入或更新操作且未提供值时，为该列提供的值 |\n| `UniqueConstraint`\
  \ | 指定与该列关联的 `UNIQUE` 或主键约束 |\n| `CheckConstraint` | 指定与该列关联的 `CHECK` 约束 |\n| `ReferentialConstraint`\
  \ | 指定与该列关联的引用约束 |\n\n### 表 4.3：配合 `CREATE TABLE` 语句使用的数据类型定义\n\n| 数据类型 | 定义(s)\
  \ |\n| :--- | :--- |\n| 小整数 | `SMALLINT` |\n| 整数 | `INTEGER INT` |\n| 大整数 | `BIGINT`\
  \ |\n| 小数 | `DECIMAL(Precision, Scale) DEC*(Precision, Scale) NUMERIC(*Precision,\
  \ Scale) NUM*(Precision, Scale)` 其中 `Precision` 是 1 到 31 之间的任意数字；`Scale` 是 0 到 `Precision`\
  \ 之间的任意数字 |\n| 单精度浮点数 | `REAL FLOAT(*Precision*)` 其中 `Precision` 是 1 到 24 之间的任意数字\
  \ |\n| 双精度浮点数 | `DOUBLE FLOAT(Precision)` 其中 `Precision` 是 25 到 53 之间的任意数字 |\n|\
  \ 固定长度字符字符串 | `CHARACTER*(Length) <FOR BIT DATA>* CHAR*(Length) <FOR BIT DATA>*`\
  \ 其中 `Length` 是 1 到 254 之间的任意数字 |\n| 变长度字符字符串 | `CHARACTER VARYING*(MaxLength)*\
  \ <FOR BIT DATA>* CHAR VARYING(*MaxLength*) <FOR BIT DATA>* VARCHAR(*MaxLength*)\
  \ <FOR BIT DATA>*` 其中 `MaxLength` 是 1 到 32,672 之间的任意数字 |\n| 长变长字符字符串 | `LONG VARCHAR`\
  \ |\n| 固定长度双字节字符 | `GRAPHIC*(Length)*` 其中 `Length` 是 1 到 127 之间的任意数字 |\n| 变长度双字节字符\
  \ | `VARGRAPHIC(*MaxLength*)` 其中 `MaxLength` 是 1 到 16,336 之间的任意数字 |\n| 长变长双字节字符\
  \ | `LONG VARGRAPHIC` |\n| 日期 | `DATE` |\n| 时间 | `TIME` |\n| 时间戳 | `TIMESTAMP` |\n\
  | 二进制大对象 | `BINARY LARGE OBJECT(Size <K &#124; M &#124; G>) BLOB(Size <K &#124;\
  \ M &#124; G>)` 其中 `Size` 是 1 到 2,147,483,647 之间的任意数字；如果指定 `K`（千字节），`Size` 是 1 到\
  \ 2,097,152 之间的任意数字；如果指定 `M`（兆字节），`Size` 是 1 到 2,048 之间的任意数字；如果指定 `G`（吉字节），`Size`\
  \ 是 1 到 2 之间的任意数字 |\n| 字符大对象 | `CHARACTER LARGE OBJECT(Size <K &#124; M &#124; G>)\
  \ CHAR LARGE OBJECT*(Size* <K &#124; M &#124; G>) CLOB*(Size* <K &#124; M &#124;\
  \ G>)` 其中 `Size` 是 1 到 2,147,483,647 之间的任意数字；如果指定 `K`（千字节），`Size` 是 1 到 2,097,152\
  \ 之间的任意数字；如果指定 `M`（兆字节），`Size` 是 1 到 2,048 之间的任意数字；如果指定 `G`（吉字节），`Size` 是 1 到 2\
  \ 之间的任意数字 |\n| 双字节字符大对象 | `DBCLOB(Size <K &#124; M &#124; G>)` 其中 `Size` 是 1 到 1,073,741,823\
  \ 之间的任意数字；如果指定 `K`（千字节），`Size` 是 1 到 2,097,152 之间的任意数字；如果指定 `M`（兆字节），`Size` 是 1\
  \ 到 2,048 之间的任意数字；如果指定 `G`（吉字节），`Size` 是 1 到 2 之间的任意数字 |\n\n\n\n正如你从这些示例中看到的，`UNIQUE`约束、`CHECK`\
  \ 约束、引用约束或涉及单列的信息性约束都可以定义为该特定列定义的一部分。但如果你需要定义一个包含表中多个列的约束该怎么办？或者，如果你想将约束定义与列定义分开来呢？你可以通过将约束定义为另一个元素，而不是作为单个列定义的扩展来实现这一点。将\
  \ `UNIQUE` 约束定义为独立元素的基本语法如下：\n\n![Image](img/349-3.jpg)\n\n| 说明: |\n| :--- |\n|\
  \ `ConstraintName` | 指定分配给要创建约束的唯一名称 |\n| `ColumnName` | 标识将作为要创建的 `UNIQUE` 或主键约束一个或多个列\
  \ |\n\n作为独立元素创建 `CHECK` 约束的语法与作为列定义一部分创建 `CHECK` 约束的语法相同：\n\n![Image](img/350-1.jpg)\n\
  \n| 说明: |\n| :--- |\n| `ConstraintName` | 指定分配给要创建约束的唯一名称 |\n| `CheckCondition`\
  \ | 标识在存储到列中之前必须评估为 `TRUE` 的条件或测试 |\n\n最后，作为独立元素创建引用约束的语法如下：\n\n![Image](img/350-2.jpg)\n\
  \n| 说明: |\n| :--- |\n| `ConstraintName` | 指定分配给要创建约束的唯一名称 |\n| `ColumnName` | 标识将作为要创建的引用约束一个或多个列\
  \ |\n| `PKTableName` | 标识参与引用约束的父表名称 |\n| `PKColumnName` | 标识构成参与引用约束的父表主键的列或列 |\n\
  \n因此，一个通过执行如下 `CREATE TABLE` 语句创建的表：\n\n![Image](img/351-1.jpg)\n\n也可以通过执行类似这样的\
  \ `CREATE TABLE` 语句来创建：\n\n![Image](img/351-2.jpg)\n\n## 创建带有 Check 选项的视图\n\n视图提供了一种查看存储在一个或多个基表中的数据的不同方式。本质上，视图是结果表的命名命名规范，每当在\
  \ SQL 语句中引用该视图时，它就会被填充。每引用一次视图，都会执行一次查询，并以类表的形式返回结果。与基表一样，视图可以被认为具有列和行。在大多数情况下，你可以像从表中检索数据一样从视图检索数据。然而，你是否可以在插入、更新和删除操作中使用视图取决于它是如何定义的——视图可以定义为可插入、可更新、可删除和只读的。\n\
  \n尽管视图看起来和行为上通常类似于基表，但它们没有自己的物理存储；因此，它们不包含真实数据。相反，视图引用物理上存储在其他基表中的数据。只有视图定义本身实际上存储在数据库中。事实上，当对视图显示的数据进行更改时，更改实际上是应用于视图引用的基表中的存储的数据。图\
  \ 4.15 显示了简单视图的结构及其与两个基表的关系。\n\n![Image](img/352.jpg)\n\n*图 4.15: 引用两个基表的简单数据库视图*\n\
  \n由于视图允许不同的用户看到相同数据的不同呈现，它们通常与视图权限一起用于控制数据访问。例如，假设你有一个包含某特定公司所有员工信息的表。你可以通过视图赋予部门经理访问该表的权限，允许他们只看到在他们部门工作的员工信息。然而，薪资部门的成员可以通过视图获得访问该表的权限，允许他们只看到生成员工工资单所需的信息。这两组用户都具有访问同一表的权限；但是，由于每个用户处理的是不同的视图，看起来用户正在操作他们自己的表。通过创建视图并将其与视图权限结合，数据库管理员可以更有效地控制单个用户访问特定数据的方式。\n\
  \n![Image](img/note.jpg)\n\n**注意：** 由于没有办法直接在表中的特定列上授予 `SELECT` 权限（除非使用行级/列级访问控制机制），但你可以通过创建一个仅包含特定用户需要的数据的结果、摘要或声明临时表来防止用户访问表中的每一列——或者通过创建一个仅包含用户允许访问的表列的视图。在这两个选项中，视图更容易于实现和管理。\n\
  \n你可以通过执行 `CREATE OR REPLACE VIEW` SQL 语句来创建或替换视图（如果它已经存在）。该语句的基本语法为：\n\n![Image](img/353-1.jpg)\n\
  \n| 说明: |\n| :--- |\n| `ViewName` | 指定分配给要创建的视图的名称 |\n| `ColumnName` | 标识要包含在要创建的视图中的一个多个列的名称；如果指定了列名列表，提供的列名数量必须与创建视图的\
  \ `SELECT` 语句返回的列数匹配（如果未提供列名列表，视图的列将继承 `SELECT` 语句返回的列名） |\n| `SELECTStatement`\
  \ | 标识执行后将填充视图的 `SELECT` 语句 |\n\n因此，要创建一个引用 `DEPARTMENT` 表所有数据的视图并命名为 `DEPT_VIEW`，请执行\
  \ `CREATE VIEW` 语句：\n\n![Image](img/353-2.jpg)\n\n然而，如果你想创建一个引用 `DEPARTMENT` 表特定数据的视图并命名为\
  \ `ADV_DEPT_VIEW`，请执行类似这样的 `CREATE VIEW` 语句：\n\n![Image](img/353-3.jpg)\n\n该语句创建的视图将包含人数超过\
  \ 25 人的每个部门的编号、名称和规模信息。\n\n如果在 `CREATE VIEW` 语句指定 `WITH LOCAL CHECK OPTION` 子句，针对新创建视图的插入和更新操作将通过验证，以确保插入或更新到基表中的所有行都符合视图定义（否则，插入/更新操作将失败）。这到底意味着什么？\n\
  \n假设你使用以下 `CREATE VIEW` 语句创建一个视图：\n\n![Image](img/354-1.jpg)\n\n现在，假设用户尝试向此视图插入一条\
  \ `RESPONSE_TIME` 为 `6.` 的记录。插入操作将失败，错误代码为 `SQL0161N`，因为该记录违反了视图定义。如果创建视图时没有使用 `WITH\
  \ LOCAL CHECK OPTION` 子句，插入操作将成功，尽管新记录对于添加它的视图是不可见的。图 4.16 说明了 `WITH LOCAL CHECK\
  \ OPTION` 子句的工作原理。\n\n![Image](img/354-2.jpg)\n\n*图 4.16: 在视图定义中使用 WITH LOCAL CHECK\
  \ OPTION 子句的方式*\n\n使用 `WITH LOCAL CHECK OPTION` 子句创建的视图被称为*对称视图*，因为可以插入其中的每个记录也可以从从中检索到。\n\
  \n\n\n\n如果你在 `CREATE VIEW` SQL 语句中指定 `WITH CASCADED CHECK OPTION` 子句，则创建的视图将继承其基础父视图的搜索条件，并将这些条件视为一个或多个约束，用于验证对该视图执行的插入和更新操作。此外，任何基于带有\
  \ `WITH CASCADED CHECK OPTION` 子句视图创建的子视图都将继承这些约束；父视图和子视图的搜索条件将组合在一起形成约束。\n\n为了更好地理解其含义，让我们来看一个示例。假设你使用以下\
  \ `CREATE VIEW` 语句创建了一个视图：\n\n![Image](img/355-1.jpg)\n\n现在，假设你使用此 `CREATE VIEW`\
  \ 语句创建了第二个视图：\n\n![Image](img/355-2.jpg)\n\n如果用户尝试向 `SPECIAL_ORDERS` 视图插入一条 `RESPONSE_TIME`\
  \ 值为 `6,` 的记录，则插入操作将失败，并返回相同的错误代码 `SQL0161N`，因为该记录违反了 `PRIORITY_ORDERS` 视图定义的搜索条件（该条件是\
  \ `SPECIAL_ORDERS` 视图的约束）。图 4.17 展示了 `WITH CASCADED CHECK OPTION` 子句的工作原理。\n\n![Image](img/356.jpg)\n\
  \n*图 4.17：在视图定义中使用 WITH CASCADED CHECK OPTION 子句的方式\n\n## 关于失效视图的说明\n\n失效视图是指用户和应用程序不再可用或访问的视图。当发生以下情况时，视图可能会失效：\n\
  \n* 视图定义所依赖的权限被撤销，导致无法访问一个或多个底层基表。\n* 视图定义所依赖的底层视图、表、别名或函数被删除。\n* 视图定义所依赖的视图失效。\n\
  * 视图的超视图失效（超视图是指以另一个类型视图——即子视图——为基础的类型视图）。\n\n一旦视图变为失效，你可以按照以下步骤进行恢复：\n\n**步骤 1：**\
  \ 重新被删除的父对象（视图或表），然后访问该视图以自动激活它。\n\n**步骤 2：** 通过查询 `SYSCAT.VIEWS` 目录视图的 `TEXT` 列，获取最初用于创建视图的\
  \ SQL 语句。\n**步骤 3：** 通过重新执行 `CREATE OR REPLACE VIEW` 语句（使用相同的视图名称和定义）重新创建视图。\n**步骤\
  \ 4：** 使用 `GRANT` 语句重新授予之前授予该视图的所有权限。（当视图被标记为失效时，授予该视图的权限会被撤销。）\n\n如果你不想恢复失效视图，可以使用\
  \ `DROP VIEW` 语句显式地删除它。或者，你可以创建一个新视图并为其分配与失效视图相同的名称，但提供不同的定义。\n\n让我们来看在 DB2 9.7\
  \ 中引入的自动对象重新验证功能。数据库配置参数 `AUTO_REVAL` 控制重新验证和失效的语义。你可以在不重启数据库或实例的情况下在线设置此配置参数。该参数可以取以下任一值：\n\
  \n* `IMMEDDIATE`\n* `DEFERRED`\n* `DEFERRED_FORCE`\n* `DISABLED`\n\n将 `AUTO_REVAL`\
  \ 配置参数设置为 `IMMEDIATE` 将在所有依赖对象失效时立即对其进行重新验证。将其设置为 `DEFERRED` 则仅在下次访问这些依赖对象后才进行重新验证；在此之前，它们在数据库中被视为\
  \ `INVALID` 对象。将参数设置为 `DEFERRED_FORCE` 将启用 `CREATE WITH ERROR` 支持功能，该功能允许在引用对象不存在的情况下创建某些数据库对象（例如视图、函数和触发器）。例如，你可以在数据库中从未存在的表上创建视图。然而，数据库管理器会将其标记为\
  \ `INVALID` 视图，直到你创建引用的基表。将 `AUTO_ REVAL` 设置为 `DISABLED` 可确保永远发生自动对象重新验证。\n\n当启用自动对象重新验证功能时，视图永远不会标记为失效。相反，它们被标记为\
  \ `INVALID`，并根据 `AUTO_REVAL` 配置设置自动重新验证。你可以查询 `SYSCAT.INVALIDOBJECTS` 系统目录视图来了解失效对象的状态。\n\
  \n# 创建和使用触发器\n\n触发器是一种数据库对象，可以响应对指定表或视图的插入、更新或删除操作执行一组操作。触发器在数据库集中定义和强制转换业务规则（涉及数据不同状态的规则）非常有用，而不是在多个应用程序模块中定义它们。\n\
  \n你可以使用触发器结合结合性约束和 `CHECK` 约束来强制数据完整性规则。你还可以使用它们引起其他表的更新，自动为插入或更新的行生成或转换值，或调用函数执行发布告警等任务。\n\
  \n任何触发器都与五个主要组件相关：\n\n* 主体，定义触发器的主体——基本上是表或视图\n* 事件，启动触发器的事件——基本上是插入、更新或删除操作\n*\
  \ 触发器的激活时间——基本上是 `BEFORE` 或 `AFTER`\n* 粒度，指定触发器是针对每个语句执行一次还是针对每个受影响的行执行一次——基本上是\
  \ `FOR EACH STATEMENT` 或 `FOR EACH ROW`\n* 动作，触发器执行的操作——基本上是以下元素中的一个或多个：\n    *\
  \ `CALL` 语句\n    * `DECLARE` 和/或 `SET` 变量\n    * `WHILE` 和/或 `FOR` 循环\n    * `IF`,\
  \ `SIGNAL`, `ITERATE`, `LEAVE` 和 `GET DIAGNOSTIC` 语句\n    * `SELECT SQL` 语句\n  \
  \  * `INSERT, UPDATE, DELETE,` 和 `MERGE SQL` 语句（仅用于 `AFTER` 和 `INSTEAD OF` 触发器）\n\
  \n在 DB2 中，触发器分类为 `BEFORE, AFTER,` 或 `INSTEAD OF`：\n\n* `BEFORE` 触发器在更新或插入操作之前激活，在数据库实际修改表数据之前，可以更改要更新或插入的值。通常，此触发器用于数据清洗和修改。例如，如果你正在向表中插入一行，`BEFORE`\
  \ 触发器可以检查数据的完整性。如果数据不符合业务规则，你可以在其插入到表之前对其进行修改。\n* `AFTER` 触发器在插入、更新或删除操作后激活，用于维护数据之间的关系或保留审计跟踪信息。例如，如果\
  \ `EMPLOYEE` 表由于新入职发生了插入操作，你可以调用 `AFTER` 触发器增加 `COMPANY_STATS` 统计表中的人数。\n* `INSTEAD\
  \ OF` 触发器定义了如何在不允许这些操作的视图上执行插入、更新或删除操作。例如，假设人事部门想要通过使用在 `EMPLOYEE` 表上创建的 `V_EMPLOYEE`\
  \ 视图更新一组人的薪水。虽然只读视图 `V_EMPLOYEE` 数据无法修改，但底层 `EMPLOYEE` 表数据是可以修改的。因此，通过使用 `INSTEAD\
  \ OF` 触发器，你可以确保在尝试修改只读视图数据时在基表上触发业务逻辑。\n\n可以通过执行 `CREATE OR REPLACE TRIGGER` SQL\
  \ 语句创建或替换（如果已存在）触发器。该语句的基本语法如下：\n\n![Image](img/359.jpg)\n\n| where: |\n\n| *TriggerName*\
  \ | 标识分配给要创建触发器的名称 |\n\n\n\n\n\n| `TriggerEvent` | 指定每当其中一个事件应用到主体表或主体视图时，执行与触发器关联的触发操作\
  \ |\n| `TableName` | 标识定义触发器的表（主体）的名称 |\n| `ViewName` | 标识定义触发器的视图（主体）的名称 |\n| `CorrelationName`\
  \ | 指定一个关联名称，用于识别触发 SQL 操作之前的行状态 |\n| `Identifier` | 指定一个临时表名称，用于识别触发 SQL 操作之前受影响的行集\
  \ |\n| `Action` | 指定当触发器激活时要执行的操作；触发操作由一个 SQL 过程语句和一个用于执行该 SQL 过程语句的可选条件组成 |\n\n\
  以下示例说明了一个当在 `EMPLOYEE` 表上执行 `INSERT` 语句时激活的 `BEFORE`（触发前）触发器。根据人力资源部门的业务规则，如果被插入的行在\
  \ `EMPSTARTDATE` 列上具有 `NULL` 值，则应将员工的入职日期视为第二天。因此，当触发器 `EMPLOYEEJOINDATE` 检测到向 `EMPLOYEE`\
  \ 表的 `EMPSTARTDATE` 列插入了 `NULL` 时，它会分配次天的值并继续插入操作：\n\n![Image](img/360.jpg)\n\n\
  在下一个示例中，当在 `EMPLOYEE` 表上执行 `INSERT` 语句时会激活一个 `AFTER`（触发后）触发器。根据人力资源部门的业务规则，如果插入\
  \ `EMPLOYEE` 表的行是因为新入职，则触发器语句还将更新公司统计表 `COMPANY_STATS` 中的员工人数：\n\n![Image](img/361-362.jpg)\n\
  \n示例末尾的 `SELECT * FROM EMPLOYEE` 是否让你感到好奇？你是的——`INSERT INTO EMPLOYEE` SQL 语句触发了两个触发器操作：一个是插入\
  \ `EMPSTARTDATE`，另一个是更新 `EMP_TCOUNT`。你可以为表、事件或激活时间的组合指定多个触发器。当某个特定表、事件和激活时间存在多个触发器时，触发器激活的顺序与它们被创建的顺序相同。因此，最近创建的触发器是最后一个被激活的触发器。\n\
  \n考虑这样一个例子：人力资源部门想在 `EMPLOYEE` 表中实际进行薪资更改之前，检查员工的加薪情况。对于任何员工，如果加薪金额是当前薪资的两倍，则必须记录在\
  \ `SALARY_AUDIT` 表中供分析：\n\n![Image](img/362.jpg)\n\n以下 SQL 语句在激活触发器 `employeeSalaryUpdate`\
  \ 之前，提取了 `EMPLOYEE` 和 `salary_audit` 表中的可用信息：\n\n![Image](img/363-1.jpg)\n\n要激活\
  \ `employeeSalaryUpdate` 触发器，通过将薪资增加三倍来更新 Milan 的薪资列：\n\n![Image](img/363-2.jpg)\n\
  \n触发器的激活结果如下：\n\n![Image](img/363-3.jpg)\n\n触发器还可以通过 `SIGNAL` 语句抛出错误并防止对表执行特定操作。例如，如果人力资源部门的规则不允许任何超过\
  \ 300% 的加薪，你可以通过触发器代码来实现，如下所示：\n\n![Image](img/364.jpg)\n\n当你需要在触发器中处理原始结果集和修改后的结果集，可以使用\
  \ `REFERENCING OLD_TABLE` 和 `NEW_TABLE` 转换表。例如，假设人力资源部门的规则不允许任何旧薪资与新薪资之和超过 200%\
  \ 的加薪。为了实现这一点，使用转换表触发器，如下所示：\n\n![Image](img/364-365.jpg)\n\n当你使用 `INSTEAD OF`（替代）触发器时，针对视图的请求修改操作将由触发器逻辑取代，由触发器代表视图执行该操作。从应用程序的角度来看，这是透明发生的，因为它感知到所有操作都是针对视图执行的。对于给定主体视图的每种操作只允许一个\
  \ `INSTEAD OF` 触发器。\n\n最后，当需要更改触发器代码时，无法修改触发器定义。你必须使用 `CREATE OR REPLACE` 命令，该命令会在内部删除并重新创建触发器。否则，你可以使用\
  \ `DROP TRIGGER` 命令显式地删除触发器，并使用 `CREATE TRIGGER` 命令创建它。\n\n# 关于多事件触发器\n\n在 DB2 10.1\
  \ 中，你可以创建一个多事件触发器，根据三种可能的触发事件之一——`INSERT`、`UPDATE` 或 `DELETE` 语句——来触发触发器操作，而不是为每个事件创建一个单独的触发器。\n\
  \n多事件触发器支持行级触发器 `(FOR EACH ROW)` 和语句级触发器 `(FOR EACH STATEMENT)`，这允许你将复杂的业务规则转换为复杂的触发器逻辑。在数据库迁移过程中（将其他数据库供应商的产品迁移到\
  \ DB2），这对你非常有帮助。\n\n考虑这样一个例子：人力资源部门希望对 `EMPLOYEE` 表中 `SALARY` 列的任何插入、更新或删除操作设置审计日志。实现代码如下所示：\n\
  \n![Image](img/365-366.jpg)\n\n触发事件发生之前的 `EMPLOYEE` 和 `SALARY_AUDIT` 表数据提取如下：\n\n\
  ![Image](img/366.jpg)\n\n向 `EMPLOYEE` 表添加新员工（如下所示）将产生事件并在 `SALARY_AUDIT` 表中插入记录：\n\
  \n![Image](img/367.jpg)\n\n同样，删除或更新 `EMPLOYEE` 表中的条目将产生事件并在 `SALARY_AUDIT` 表中插入记录，如下：\n\
  \n![Image](img/368.jpg)\n\n## 关于系统目录\n\n系统目录由一组特殊表（和视图）组成，包含了数据库中所有对象的信息。这些表包含数据库对象的定义信息（例如表、视图、索引和包）以及用户对这些访问的安全信息。在第三章“物理设计”中，你看到系统目录表在创建新数据库时会自动创建。你无法显式地创建或删除这些表，但你可以控制谁有访问权限。\n\
  \n每当创建、修改或删除对象时，DB2 都会描述该对象及其与其他对象关系的记录。因此，如果你想获取特定数据库的信息，通常可以通过连接到该数据库并查询系统目录来实现。例如，为了找出名为\
  \ `EMPLOYEE` 的表是否需要重组以消除碎片，你对名为 `SYSCAT.TABLES` 的系统表执行查询：\n\n![Image](img/368.jpg)\n\
  \n如果查询结果显示 `EMPLOYEE` 表存在大量溢出记录，则数据已碎片，该表可能需要重组。（我们将在第六章“DB2 工具”中讨论如何重组表。）然而，如果你想知道是否为\
  \ `EMPLOYEE` 表收集了统计信息，可以对系统目录执行如下查询：\n\n![Image](img/369-1.jpg)\n\n在这种情况下，如果查询返回的是\
  \ `-1` 而不是存储在 `EMPLOYEE` 表中的行数，则尚未收集统计信息。（我们将在第六章讨论如何为表收集统计信息。）\n\n要提取触发器定义，你可以使用\
  \ `SYSCAT.TRIGGERS` 系统目录视图并生成触发器代码：\n\n![Image](img/369-2.jpg)\n\n\n\n\n通过直接或间接使用系统目录信息（不包括执行简单的\
  \ `db2look` 命令），可以重建任何数据库对象（例如表、视图、索引、序列、触发器、存储过程、约束）。\n\n这种可能性几乎是无限的。如需了解更多关于系统目录中的表以及每个表所含的信息，请参阅\
  \ *IBM DB2 10.1 SQL Reference, Volume 1* 附录 D，“目录视图”（Catalog Views）（第 853 页）产品文档。\n\
  \n你只能使用系统目录来获取有关特定数据库的信息。要获取系统级的信息，你必须求助于执行管理系统命令或查询管理视图。例如，要获取已安装在特定服务器上的 DB2 产品信息，你必须执行系统命令\
  \ `db2ls –q -a` (UNIX) 或对 `SYSIBMADM.ENV_PROD_INFO` 管理视图执行查询：\n\n![Image](img/370.jpg)\n\
  \n## 章节总结\n\n本章的目标是让您熟悉：\n\n* 什么是业务规则以及它们在真实数据世界中的重要性\n* DB2 内部各种约束，以及利用它们在数据库层构建业务规则，而不是在应用层构建\n\
  * `SET INTEGRITY` 命令和用于复制违反业务规则数据的异常表\n* 触发器及其各种类型，以及针对人力资源（HR）合作伙伴业务规则的实现\n* 系统目录表的重要性及其对其内容的检查\n\
  \n完成本章后，你将具备足够的知识来回答认证考试中的业务规则实现问题。还强烈建议你完成章节末的示例题。\n\n## 练习题\n\n### 第 1 题\n\n信息性约束的用途是什么？\n\
