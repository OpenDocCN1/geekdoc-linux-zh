  \ sample failarchpath D:\\logs_copy` \n* C. `UPDATE DB CFG FOR sample mirrorlogpath\
  \ D:\\logs_copy` \n* D. `UPDATE DB CFG FOR sample USING logarchmeth MIRRORPATH:D:\\\
  logs_copy`\n\n**问题 2**\n\n执行以下 SQL 语句会发生什么？\n\n（SQL 语句）\n\n* A. SAMPLE 数据库将被配置为无限日志。\n\
