  \ | D. | `CATALOG DCS DATABASE payroll AS payroll_db AR dsn_db_1` |\n\n### 问题 12\n\
  数据库管理员获取了关于某 UNIX DB2 服务器的以下信息：\n\n- 实例名：`db2inst1`\n- 端口号：`50001`\n- 服务名：`db2c_db2inst1`\n\
  - 主机名：`db2server1`\n- 主机 TCP/IP 地址：`10.205.15.100`\n- `DB2COMM=TCPIP`\n- 数据库名：`SAMPLE`\n\
  \n在尝试在 Windows DB2 客户端与 DB2 服务器之间建立连接时，从 Windows 客户端执行了以下命令：\n\n```\n![Image](img/975.jpg)\n\
  ```\n\n然而，当尝试连接数据库时发生了错误。你应该执行哪项操作来解决问题？\n\n| ![images](img/circ.jpg) | A. | 在本地数据库目录中编入数据库\
