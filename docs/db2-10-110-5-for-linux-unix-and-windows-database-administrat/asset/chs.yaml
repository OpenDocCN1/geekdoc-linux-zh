  \ mode`模式）从生产数据库中提取数据。使用 `db2move` 工具（`Import mode`模式）填充测试数据库。在测试数据库的每个表上运行 `RUNSTATS`\
  \ 工具。 |\n| ![images](img/circ.jpg) | C. | 在生产数据库的每个表上运行 `RUNSTATS` 工具。使用 `db2look`\
  \ 工具生成创建生产数据库中对象所需的 SQL 并重现统计配置文件。创建一个测试数据库并运行 `db2look` 产生的脚本以创建数据库对象并复制统计信息。向数据库中插入、导入或加载测试数据。\
  \ |\n| ![images](img/circ.jpg) | D. | 使用 `db2look` 工具生成创建生产数据库中对象所需的 SQL。创建一个测试数据库并运行\
  \ `db2look` 产生的脚本以创建数据库对象。使用指定 `STATISTICS USE PROFILE` 选项的 `LOAD` 命令将测试数据加载到数据库，以便收集统计信息。\
