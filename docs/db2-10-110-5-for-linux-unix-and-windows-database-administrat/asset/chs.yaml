  \n# db2mtrk 命令\n\nDB2 内存跟踪工具产生实例、数据库和代理内存状态的完整报告。此工具提供有关内存分配的信息：\n\n*   当前大小\n*\
  \   最大大小（硬限制）\n*   最大大小（高水位）\n*   类型（指示内存用途的标识符）\n*   分配池的代理（仅当内存池为私有时）\n\n你通过执行\
  \ `db2mtrk` 命令调用 DB2 内存跟踪。\n\n![Image](img/535-2.jpg)\n\n| where: |\n| :--- | :---\
  \ |\n| `Interval` | 识别后续调用 DB2 内存跟踪之间等待的秒数 |\n| `Count` | 识别重复调用 DB2 内存跟踪的次数 |\n\
  \n\n\n\n\nTable 5.21 描述了所有其他 `db2mtrk` 命令选项。\n\n| 表 5.21: db2mtrk 命令选项 |\n\n| 选项\
  \ | 含义 |\n| :--- | :--- |\n| -i | 指定收集并显示实例级内存信息 |\n| -d | 指定收集并显示数据库级内存信息 |\n|\
  \ -a | 指定收集并显示应用程序级内存信息 |\n| -p | 指定收集并显示私有内存信息 |\n| -m | 指定收集并显示每个内存池的最大值 |\n|\
  \ -w | 指定收集并显示每个内存池的高水位值（high watermark value） |\n| -v | 指定返回详细输出 |\n| -h | 显示帮助信息；指定此选项将忽略所有其他选项并仅显示帮助信息\
  \ |\n\n因此，如果您想查看实例以及系统上所有活动数据库如何使用内存，请执行一条类似于下所示的 `db2mtrk` 命令：\n\n![Image](img/536-1.jpg)\n\
  \n假设在您执行 `db2mtrk` 命令时，有一个名为 `SAMPLE` 的数据库处于活动状态，产生的结果应如下：\n\n![Image](img/536-2.jpg)\n\
  \n![Image](img/537.jpg)\n\n您还可以使用 Perl 脚本通过类似于下所示的内容来提取总内存利用率：\n\n![Image](img/538-1.jpg)\n\
  \n## db2pd 命令\n\n您可以使用 DB2 问题确定工具从 DB2 数据库系统内存集中获取快速且即时的信息，而无需获取任何锁（latches）。不加锁的情况下收集信息有两个优点：数据检索速度更快，且不竞争引擎资源。然而，由于\
  \ DB2 问题确定工具直接与内存交互，可能会在收集信息时检索到正在变化的信息；因此，检索的数据可能不完全准确。（信号处理程序可以防止 DB2 问题确定工具在遇到更改的内存指针时异常终止。然而，这可能会导致输出中出现诸如“数据结构更改强制终止命令”之类的消息。）尽管如此，该工具对于问题确定非常有帮助。\n\
  \n您通过执行 `db2pd` 命令来调用 DB2 问题确定工具。该命令的基本语法为：\n\n![Image](img/538-2.jpg)\n\n![Image](img/539.jpg)\n\
  \n| 其中: |\n| :--- | :--- |\n| DatabaseName | 通过名称标识 DB2 问题确定工具要交互的数据库 |\n| ProcessID\
  \ | 通过 ID 标识要生成堆栈跟踪文件（stack trace file）的进程 |\n| Interval | 指定在后续调用 DB2 问题确定工具之间等待的秒数\
  \ |\n| Count | 指定重复调用 DB2 问题确定工具的次数 |\n| CmdFileName | 指定给 ASCII 格式文件的名称，该文件包含要使用的\
  \ DB2 问题确定工具命令选项 |\n| OutFile | 指定用于写入 DB2 问题确定工具返回的信息的文件名 |\n\nTable 5.22 描述了所有其他\
  \ `db2pd` 命令选项。\n\n| 表 5.22: db2pd 命令选项 | |\n| 选项 | 含义 |\n| :--- | :--- |\n| -version\
  \ \\| -v | 指定收集并显示已安装 DB2 产品的当前版本和服务级别 |\n| -inst | 指定收集并显示所有可用的实例级信息 |\n| -alldatabases\
  \ \\| -alldbs | 指定实用程序连接到所有可用数据库的所有内存集 |\n| -full | 指定将所有输出扩展到最大长度（不指定此选项将截断输出以节省显示空间）\
  \ |\n| -everything | 指定使用所有选项，并收集和显示服务器本地所有数据库分区服务器上所有数据库的信息 |\n| -hadr | 指定收集并显示关于\
  \ HADR 的信息 |\n| -utilities | 指定收集并显示关于实用工具的信息 |\n| -applications | 指定收集并显示关于应用程序的信息\
  \ |\n| -agents | 指定收集并显示关于代理的信息 |\n| -transactions | 指定收集并显示活动事务的信息 |\n| -bufferpools\
  \ | 指定收集并显示缓冲区的信息 |\n| -logs | 指定收集并显示事务日志文件信息 |\n| -locks | 指定收集并显示锁的信息 |\n| -tablespaces\
  \ | 指定收集并显示表空间信息 |\n| -dynamic | 指定收集并显示动态 SQL 语句的执行信息 |\n| -static | 指定收集并显示静态\
  \ SQL 和包的执行信息 |\n| -fcm | 指定收集并显示关于快速通信管理器（fast communication manager）的信息 |\n| -memsets\
  \ | 指定收集并显示内存集的信息 |\n| -mempools | 指定收集并显示内存池的信息 |\n| -memblocks | 指定收集并显示内存块的信息\
  \ |\n| -dbmcfg | 指定收集并显示当前 DB2 数据库管理器配置参数设置 |\n| -dbcfg | 指定收集并显示当前数据库配置参数设置 |\n\
  | -catalogcache | 指定收集并显示关于目录缓存的信息 |\n| -tcbstats | 指定收集并显示关于表和索引的信息 |\n| -reorg\
  \ | 指定收集并显示表分区重组的信息 |\n| -recovery | 指定收集并显示关于恢复活动的信息 |\n| -reopt | 指定收集并显示关于使用\
  \ REOPT ONCE 重新优化的缓存 SQL 语句 |\n| -osinfo | 指定收集并显示操作系统信息 |\n| -storagepaths | 指定收集并显示数据库定义的存储路径信息\
  \ |\n| -pages | 指定收集并显示缓冲区页的信息 |\n| -stack | 指定收集并显示堆栈跟踪信息 |\n| -repeat | 指定在指定的秒数后重复执行指定的次数\
  \ |\n| -command | 指定执行存储指定文件中的 db2pd 命令 |\n| -file | 指定将收集的所有信息写入指定的文件 |\n| -interactive\
  \ | 在运行 db2pd 命令时，覆盖 DB2OPT 环境变量指定的值 |\n| -help \\| -h | 显示帮助信息；指定此选项将忽略所有其他选项并仅显示帮助信息\
  \ |\n\n\n\n\n\n![Image](img/543-2.jpg)\n\n## db2top 命令\n\nDB2 监控 `(db2top)` 命令是\
  \ Linux 和 AIX 平台上 DB2 内置的一个监控实用程序。这是一个查看系统实时监控数据的非常实用的工具。你可以通过交互模式或批处理模式调用 `db2top`\
  \ 命令来启动它。该命令的基本语法如下：\n\n![Image](img/544-1.jpg)\n\n| where: |\n| :--- | :--- |\n\
  | `DBName` | 标识 `db2top` 工具交互的数据库名称 |\n| `NodeName` | 标识 `db2top` 工具交互的逻辑分区号 |\n\
  | `ExplainSchema` | 标识默认解释表（explain tables）的模式名称 |\n| `Interval` | 标识屏幕刷新之间的延迟时间，单位为秒\
  \ |\n| `Member` | 标识发布快照命令的数据库分区号 |\n| `ReplayFile` | 标识在回放模式下运行 `db2top` 时使用的快照采集文件\
  \ |\n| `BackgroundMode` | 标识运行 `db2top` 命令的背景模式选项；有效选项包括 `d`（数据库）、`l`（会话）、`t`（表空间）、`b`（缓冲池）、`T`（表）、`D`（动态\
  \ SQL 语句）、`s`（所有 SQL 语句）、`U`（锁）、`u`（实用程序）、`F`（联邦）和 `m`（内存池） |\n| `MaxSamples` |\
  \ 标识在背景模式下运行命令时采集样本的数量 |\n| `Delimiter` | 标识在背景模式下采集数据时的字段分隔符 |\n| `OutputFile`\
  \ | 标识背景模式下记录信息的文件名 |\n| `Duration` | 标识在背景模式下运行命令的持续时间（分钟） |\n\n若要在 `SAMPLE` 数据库上以交互模式调用该工具，请执行类似下面的命令（图\
  \ 5.7 显示了 `db2top` 交互模式屏幕）：\n\n![Image](img/544-2.jpg)\n![Image](img/545.jpg)\n\n\
  *图 5.7: db2top 交互模式屏幕*\n\n你可以在故障排除过程中交互地选择相应的选项来查看监控数据。在分析过程的任何时候，点击 `h` 查看帮助信息。\n\
  \n如果你想以批处理模式运行命令，将监控数据收集到名为 `db2top.collect.file` 的文件中，间隔为五秒一次，持续五分钟，请执行类似下面的命令：\n\
  \n![Image](img/545-546.jpg)\n\n采集数据后，如果你想在分析模式下回放动态 SQL 语句的监控数据，可以执行此命令：\n\n![Image](img/546.jpg)\n\
  ![Image](img/547-1.jpg)\n\n默认情况下，`db2top` 允许每小时收集 100 MB 的数据，你可以在 `.db2toprc` 配置文件中添加“streamsize”变量条目以将限制增加到\
  \ 500 MB，如下例所示。可以使用各种参数来精细调整数据采集，包括颜色、图形、会话排序和用户定义命令：\n\n![Image](img/547-2.jpg)\n\
  \n# db2trc 命令\n\n有时，你可能被要求进行跟踪（trace）以分析反复出现且可重的问题。建议仅在 DB2 技术支持代表的指导下启用跟踪；否则请关闭跟踪以避免系统出现任何性能问题。DB2\
  \ 跟踪分为两个不同的阶段。在阶段 1 中，它收集信息；在阶段 2 中，它将信息解析为可读格式。捕捉 DB2 跟踪的基本步骤如下：\n\n**步骤 1:** 开启\
  \ DB2 跟踪以收集信息，并指定 8 MB 的文件限制：\n\n![Image](img/547-3.jpg)\n\n**步骤 2:** 重现问题。\n\n\
  **步骤 3:** 将信息转储到二进制文件中：\n\n![Image](img/548-1.jpg)\n\n**步骤 4:** 关闭 DB2 跟踪：\n\n![Image](img/548-2.jpg)\n\
  \n**步骤 5:** 将跟踪转储文件格式化为文本文件，并按进程或线程排序：\n\n![Image](img/548-3.jpg)\n\n格式化后的文件看起来如下：\n\
  \n![Image](img/548-549.jpg)\n\n**步骤 6:** 将跟踪转储文件格式化为文本文件，并按顺序流（sequential flow）排序：\n\
  \n![Image](img/549.jpg)\n\n# inspect 命令\n\n`inspect` 命令检查数据库内部的架构完整性和页面一致性。在不使数据库离线的情况下验证表和表空间的结构时，这是一个非常实用的命令。你可以对整个数据库、表空间或表执行检查。\n\
  \n如果你想检查你的数据库，可以执行类似下面的命令：\n\n![Image](img/550-1.jpg)\n\n默认情况下，`inspect` 命令的输出存储在目录\
  \ `$HOME/sqllib/db2dump` 中，其中 `$HOME` 是实例所有者的主目录。然而，可以通过 `diagpath` 或 `alt_diagpath`\
  \ 参数的值来控制。\n\n你需要使用 `db2insp` 工具对 `inspect` 命令的输出进行格式化，使其人类可读：\n\n![Image](img/550-2.jpg)\n\
  \n示例输出如下：\n\n![Image](img/550-3.jpg)\n![Image](img/551.jpg)\n![Image](img/552.jpg)\n\
  \n## db2dart 命令\n\n你可以使用 DB2 分析和报告工具来验证数据库及其对象的架构正确性。你还可以使用此工具显示控制文件的内容，以便提取由于页面损坏而无法访问的数据。与\
  \ `inspect` 命令不同，`db2dart` 应该在没有连接的情况下运行。如果数据库有活动连接，`db2dart` 将无法感知数据页面的任何更改，导致报告不准确，例所示：\n\
  \n![Image](img/553-1.jpg)\n\n当你对没有连接的数据库运行相同的命令时，报告如下：\n\n![Image](img/553-2.jpg)\n\
  \n`db2dart` 报告存储在目录 `$HOME/sqllib/db2dump/DARTxxxx`，其中 `$HOME` 是实例所有者的主目录。然而，可以通过\
  \ `diagpath` 或 `alt_diagpath` 参数的值来控制。\n\n如果你只想分析一个表空间，可以使用类似下面的命令而不是分析整个数据库：\n\n\
  ![Image](img/553-3.jpg)\n\n同样地，如果你想分析一个表，可以执行此命令：\n\n![Image](img/554-1.jpg)\n\n\
  要以分隔符 ASCII 格式转储格式化的表数据，请使用示例中的命令：\n\n![Image](img/554-2.jpg)\n\n# db2support 工具\n\
  \n`db2support` 问题分析和环境收集工具是一个非常实用的命令，用于提取所有的诊断信息，包括 `db2diag.log`、通知日志、跟踪文件、锁列表、转储文件、应用程序快照、ODBC\
  \ 数据源、事件监控、`getsadata` 以及各种操作系统的命令输出。基本调用方式为：\n\n![Image](img/554-3.jpg)\n\nDB2\
  \ 技术代表通常会提供 `db2support` 命令选项，以收集故障确定和排除所需的特定细节。\n\n## 本章总结\n\n本章目的是让你熟悉\n\n*  \
  \ 监控开关和监控元素\n*   用于收集和查看系统、活动和数据对象的 DB2 监控表函数\n*   用于捕捉特定信息的 DB2 管理视图及其用例，包括缓冲池命中率、锁等待链等\n\
  *   DB2 事件监控，用于在事件或转换发生时记录数据库活动信息\n\n\n\n\n\n*   `DB2` Explain 功能用于捕获和查看针对特定 SQL\
  \ 语句所选访问计划的详细信息\n*   各种 `DB2` 故障排除工具，包括 `FIDC`、`db2pd` 和 `db2pdcfg`\n\n完成本章后，你将具备足够的知识来回答认证考试中的\
  \ `DB2` 监控问题。强烈建议完成本章末提供的示例题。\n\n## 练习题\n\n### 问题 1\n\n用户执行了以下命令：\n\n![Image](img/555.jpg)\n\
