  \ | C. | `inspect` |\n| ![images](img/circ.jpg) | D. | `db2support` |\n\n### Question\
  \ 25\n应该使用哪个过程从未格式化的事件表中提取数据并将其转换为 XML 文档？\n\n| ![images](img/circ.jpg) | A. | `EVMON_FORMAT_UE_TO_XML`\
  \ |\n| ![images](img/circ.jpg) | B. | `EVMON_FORMAT_UE_TO_TABLES` |\n| ![images](img/circ.jpg)\
  \ | C. | `UE_LOCKING_EVENTS` |\n| ![images](img/circ.jpg) | D. | `MONREPORT` module\
  \ |\n\n## Answers\n\n### Question 1\n正确答案是 **C.** 您可以通过修改相应的数据库管理器配置参数在实例级别更改快照监控开关设置。在实例级别进行的快照监控开关设置是持久的。您可以通过\
  \ `UPDATE SWITCHES` 命令在应用程序级别更改快照监控开关设置。\n\n### Question 2\n正确答案是 **A.** `MON_GET_BUFFERPOOL`\
  \ 表函数返回缓冲池指标，包括逻辑读、物理读、块 I/O 等。\n\n### Question 3\n有时可能需要在不关闭监控开关、不终止和重新建立连接的情况下将所有计数器重零。最简单的方法是执行\
  \ `RESET` 命令。\n\n### Question 4\n正确答案是 **C.** 锁监控数据只能写入格式化的事件表。请记住，早期的死锁监控和锁超时报告注册表设置\
  \ `DB2_CAPTURE_LOCKTIMEOUT` 已弃用。相反建议使用新的 LOCKING 事件监控。捕捉锁信息需要四个关键数据库配置参数：\n\n* `mon_locktimeout`\n\
  * `mon_deadlock`\n* `mon_lockwait`\n* `mon_lw_thresh`\n\n### Question 5\n正确答案是 **B.**\
  \ 事件监控收集的数据在外部化（即写入表或文件）之前会流向缓冲区。如果您在 `CREATE EVENT MONITOR` 命令中指定 BLOCKED ，当代理确定两个事件缓冲区都满时，产生事件的代理将等待事件缓冲区写入磁盘后继续执行。因此，尽管\
  \ BLOCKED 事件监控保证不会丢失事件监控数据，但其行为可能会增加响应时间，因为任何挂起的代理（以及任何依赖代理）只有在事件监控缓冲区为空时才被允许运行。如果指定\
  \ NONBLOCKED 选项，当代理确定两个缓冲区都满时将不会等待缓冲区写入磁盘。因此，NONBLOCKED 事件监控的性能比 BLOCKED 事件监控更快，但在高活动系统中可能会丢失数据。如果未指定任何选项，创建的事件监控将是\
  \ BLOCKED 事件监控。\n\n### Question 6\n正确答案是 **C.** 虽然对单个数据库定义的事件监控数量没有限制，但同时只能有 128\
  \ 个事件监控处于激活状态。\n\n\n\n\n\n正确答案是 `B` 和 `D`。当收集 Explain 信息时，生成的数据将存储在一个或多个 `Explain`\
  \ 表中。你可以构建查询来检索这些数据，但查看所收集的 Explain 信息的更好方法是使用专门为设计的 Explain 功能工具之一，这些工具专门用于以有意义的格式呈现\
  \ Explain 信息。这套工具包括：\n\n* `db2expln` 工具\n* `db2exfmt` 工具\n* 可视化解释 (Visual Explain)\n\
  \n### 问题 8\n正确答案是 `C`。可视化解释访问计划图中的 `NLJOIN` 算符表示嵌套循环连接，它为外表的每行访问一次内表。在 OLTP 环境中执行的连接操作中，优先使用嵌套循环连接。\n\
  \n### 问题 9\n正确答案是 `A`。可视化解释访问计划图中的 `HSJOIN` 算符表示哈希连接，其中两个或多个表在连接列上进行哈希处理。在决策支持环境中执行的连接操作中优先使用哈希连接。\n\
  \n### 问题 10\n正确答案是 `D`。`CURRENT QUERY OPTIMIZATION` 特殊寄存器控制在绑定动态 SQL 语句时使用的优化技术类。你可以通过执行\
  \ `SET CURRENT QUERY OPTIMIZATION` SQL 语句来更改值。其他选项是错误的，因为没有名为 `DB2_QUERYOPT` 的注册表，没有名为\
  \ `QUERYOPT` 的 `DBM CFG`，也没有名为 `QUERYOPT` 的 `DB CFG`。\n\n### 问题 11\n正确答案是 `B`。你可以使用\
  \ DB2 绑定文件描述工具来检查和验证绑定文件中的 SQL 语句，并显示创建绑定文件时使用的编译选项。要调用 DB2 绑定文件描述工具，你需要执行 `db2bfd`\
  \ 命令。其他选项是错误的，因为你使用 `db2advis` 调用设计顾问器，使用 `db2mtrk` 跟踪当前内存使用率，以及使用 `db2rbind` 重新绑定包到数据库。\n\
  \n### 问题 12\n正确答案是 `C`。DB2 内存跟踪实用程序生成实例、数据库和代理内存状态的完整报告。该工具提供有关内存池分配的以下信息：\n\n*\
  \ 当前大小\n* 最大大小（硬限制）\n* 最大大小（高水位）\n* 类型（指示内存将用于哪些函数的标识）\n* 分配池的代理（仅当池为私有时）\n\n你通过执行\
  \ `db2mtrk` 命令调用 DB2 内存跟踪。\n\n### 问题 13\n正确答案是 `A`。你使用 DB2 问题确定工具从 DB2 数据库系统内存集中获取快速、直接的信息，而无需获取任何锁（latches）。你通过执行\
  \ `db2pd` 命令调用 DB2 问题确定工具。\n\n如果你想确定已向名为 `SAMPLE` 的数据库相关的事务日志文件写入了多少页，你可以执行一个类似如下所示的\
  \ `db2pd` 命令：\n\n![Image](img/565.jpg)\n\n### 问题 14\n正确答案是 `C`。你使用 DB2 问题确定工具 (`db2pd`)\
  \ 从 DB2 数据库系统内存集中获取快速、直接的信息，而无需获取任何锁。在不加锁的情况下收集信息的两个优势包括：数据检索速度更快且不与引擎资源产生竞争。然而，由于\
  \ DB2 问题确定工具直接与内存交互，可能会在收集信息时获取正在变化的信息；因此，检索的数据可能不完全准确。（信号处理程序可以防止 DB2 问题确定工具在遇到变化的内存指针时异常终止。然而，这可能会导致输出中出现“更改数据结构强制终止命令”等消息。）尽管如此，该工具对于问题确定非常有帮助。\n\
  \n执行 `db2pd` 命令没有最低连接要求；如果你指定了数据库级别的选项，则在返回请求的信息之前该数据库必须处于活动状态。你不能使用 `db2pd` 命令获取已停止实例的信息。\n\
  \n### 问题 15\n正确答案是 `D`。`timeron` 是一种发明的相对单位。`timeron` 值由优化器根据内部值（如随数据库使用而变化的统计信息）确定。因此，对于\
  \ SQL 或 XQuery 语句，`timeron` 值在每次确定 `timerons` 估计成本时并不保证是相同的。\n\n### 问题 16\n正确答案是\
  \ `B`。在这种情况下，强烈建议使用 `REORG TABLE...INDEX` 命令根据聚簇索引进行数据重组，将数据放置在顺序页中以提高性能，然后运行 `RUNSTATS`\
  \ 让优化器选择最近重组的数据。\n\n### 问题 17\n正确答案是 `C`。你使用 `db2diag` 日志分析工具过滤和格式化来自服务器的 `db2diag`\
  \ 日志文件。可以使用多种选项根据应用程序 ID、严重程度、函数名、数据库、时间戳等过滤数据。以下是几个示例。\n\n要显示由进程 ID (PID) 为 17417\
  \ 的进程在节点 1 和 2 上产生的所有严重错误消息，请输入：\n\n![Image](img/566-1.jpg)\n\n要显示包含数据库字段的所有严重错误消息，请输入：\n\
  \n![Image](img/566-2.jpg)\n\n要显示过去三天记录的严重错误，请输入：\n\n![Image](img/566-3.jpg)\n\n\
  ### 问题 18\n正确答案是 `D`。DB2 问题确定 (`db2pd`) 工具不提供安全日志审核信息，但它提供了大多数故障排除信息，例如锁、锁等待、当前运行的事务、恢复状态、`REORG`\
  \ 状态等。\n\n### 问题 19\n正确答案是 `A`。Explain 表格式 (`db2exfmt`) 命令生成的信息包括算子摘要、访问计划图、每个算子在\
  \ `timerons` 下的总成本以及图中的基基数。\n\n### 问题 20\n正确答案是 `B`。`LOG_DISK_WAIT_TIME` 监控元素确定代理等待日志记录刷新到磁盘的时间。你也可以通过将\
  \ `LOG_WRITE_TIME` 除以 `TOTAL_COMMITS` 来计算。`LOG_BUFFER_WAIT_TIME` 监控元素确定代理等待缓冲区空间的时间。`EVMON_FLUSHES`\
  \ 监控元素确定执行 FLUSH 事件监控 语句的次数。`LOG_WRITE_TIME` 监控元素确定日志记录写入数据到磁盘的总耗时（毫秒）。\n\n### 问题\
  \ 21\n正确答案是 `C`。DB2 提供了各种监控元素来检查和诊断性能问题或检查数据库健康。监控元素分类如下：\n\n* 请求监控元素\n* 活动监控元素\n\
  * 数据对象监控元素\n* 时间消耗监控元素\n\n从 DB2 10.1 开始，强烈建议使用 `MON_GET_BUFFERPOOL` 表函数（轻级基础设施）获取缓冲区池信息。由于缓冲区池属于对象监控元素，你必须将数据库配置参数\
  \ `mon_obj_metrics` 设置为 `BASE` 或 `EXTENDED` 以激活对上述表函数报告的数据对象监控元素的收集。\n\n### 问题 22\n\
  正确答案是 `D`。DB2 提供的最重要的诊断工具之一是 FODC 功能。当 DB2 数据库管理器出现真实问题时，会调用 `db2fodc` 命令。如果你想在任何挂起情况下调用\
  \ `db2fodc`，可以通过执行类似如下所示的命令来调用它：\n\n![Image](img/567.jpg)\n\n### 问题 23\n\n\n\n\n\
  \n正确答案是 **B.**。DB2 问题确定工具 (`db2pd`) 提供了大量的故障排除信息，包括类似于下面的锁等待进程：\n\n![Image](img/568.jpg)\n\
  \n### 问题 24\n\n正确答案是 **C.**。`inspect` 命令检查数据库内部的架构完整性和页面一致性。在不使数据库离线的情况下验证表和表空间的结构时，这是一条非常实用的命令。你可以对整个数据库、表空间或单个表进行检查。虽然\
  \ `db2dart` 也执行类似的检查，但它要求在开始检查之前应用程序必须离离状态。\n\n### 问题 25\n\n正确答案是 **A.**。与 `db2evmonfmt`\
  \ 工具一样，从未格式化的事件表中提取数据的另一种方法是使用以下格式表函数：\n\n* `SYSPROC.EVMON_FORMAT_UE_TO_XML()`\n\
  * `SYSPROC.EVMON_FORMAT_UE_TO_TABLES()`\n\n`EVMON_FORMAT_UE_TO_XML()` 表函数从未格式化的事件表中提取二进制事件，并将其格式化为\
  \ XML 文档。\n\n# 第 6 章\n\n## DB2 实用\n\n本章将向你介绍 DB2 中提供的各种数据移动和数据库维护工具。你将学习如何使用 DB2\
  \ 设计顾问（Design Advisor）针对索引、MQT、表重分区、MDC 表以及未使用数据库对象的删除生成专家建议。在本章结束时，你还将能够使用在线表维护程序来复制特定的架构、其表及其对象。\n\
  \n## 考试目标\n\n* 证明理解 DB2 中数据移动文件格式的能力\n* 证明使用 `Export` 工具从数据库中提取数据并存储在外部文件中的能力\n\
  * 证明使用 `Import` 工具将数据从外部文件传输到数据库表的能力\n* 证明使用 `Load` 工具将数据批量加载到数据库表的能力\n* 证明使用 `Continuous\
  \ Data Ingest (CDI)` 工具向数据库表执行高速数据加载的能力\n* 证明根据业务需求选择恰当的数据加载工具的能力\n* 证明使用 `ADMIN_MOVE_TABLE`\
  \ 和 `ADMIN_COPY_SCHEMA` 系统存储过程的能力\n* 证明使用 `REORKCHK` 和 `REORG` 命令定位并移除表空间容器中碎片的能力\n\
  * 证明使用 `RUNSTATS`、`REBIND,` 和 `FLUSH PACKAGE CACHE` 命令以确保 DB2 优化器始终为给定查询生成最佳访问计划，并在应用程序在生成新访问计划时能够利用它们的能力\n\
  * 证明使用 `db2look`、`db2move` 和 `db2batch` 命令的能力\n* 证明使用 `db2relocatedb` 命令在实例之间重命名或移动数据库的能力\n\
  * 证明使用设计顾问对数据库对象生成专家性能建议的能力\n\n# 数据移动工具和格式\n\n尽管数据库通常作为一个自包含的实体运行，但有时需要与“外部世界”交换数据。这就是\
  \ DB2 的目的。\n\n## 数据移动文件格式\n\n尽管数据库通常作为一个自包含的实体运行，但有时需要与“外部世界”交换数据。这就是 DB2 的目的。\n\
  \n## 数据移动工具\n\n尽管数据库通常作为一个自包含的实体运行，但有时需要与“外部世界”交换数据。这就是 DB2 的目的。\n\n## 数据移动格式\n\n\
  尽管数据库通常作为一个自包含的实体运行，但有时需要与“外部世界”交换数据。这就是 DB2 的目的。\n\n### 分隔符 ASCII (DEL)\n\nASCII\
  \ 格式在许多数据库中被广泛使用。适当的分隔符分隔每列的数据值，适当的行分隔符则分隔各个行。\n\n### 非分隔符 ASCII (ASC)\n\n非分隔符 ASCII\
  \ 文件格式也被各种软件和数据库应用程序使用。\n\n\n\n\n\n与分隔符 ASCII 格式文件一样，数值由其 ASCII 等效字符表示——点字符 `.`\
  \ 表示小数点（在适用时）；科学计数法 `(E)` 表示实值；负号 `-` 位于负值之前；加号 `+` 可能可能不位于正值之前。\n\n因此，一个简单的非分隔符\
  \ ASCII 文件可能如下所示：\n\n![Image](img/573.jpg)\n\n与分隔符 ASCII 文件一样，你可以使用简单的文本编辑器编辑非分隔符\
  \ ASCII 文件的内容。你仅使用此文件格式从外部兼容的文件导入或加载数据到数据库表中。\n\n## 工作表格式\n\nWSF 是一种专门供 Lotus 1-2-3\
  \ 和 Lotus Symphony 电子表格产品使用的特殊文件格式。这些产品的不同版本在用于数据存储的文件格式中整合了不同的功能；然而，所有版本都使用一个共同的功能子集，而正是这个子集是\
  \ DB2 的某些数据移动工具识别并支持的。你无法使用简单的文本编辑器编辑 WSF。\n\n# PC 集成交换格式\n\nPC/IXF 文件格式是一种特殊的文件格式，几乎专门用于在不同的\
  \ DB2 数据库之间移动数据（你不能使用此文件格式在 DB2 和其他供应商数据库之间移动数据）。通常，当数据被写入 PC/IXF 文件时，行会逐条流式写入文件，形成一个不连续的变长度记录序列。使用这种格式，字符数据值以其原始\
  \ ASCII 表示形式存储（不带额外的填充），而数值值则以压缩进制值或二进制值存储，取决于在数据库中存储它们时使用的数据类型。除了数据外，表定义和相关的索引定义也存储在\
  \ PC/IXF 文件中。因此，当你使用此文件格式时，可以同时定义并填充表（以及任何相应的索引）。与 WSF 一样，你无法使用简单的文本编辑器编辑 PC/IXF\
  \ 文件。\n\n# 从外部文件提取列式数据\n\n如你所见，你使用的文件格式决定了数据在外部文件中物理存储的方式。而数据在文件中物理存在的方式决定了你必须使用的方法来提取这些数据并映射到表的一列或多列。在\
  \ DB2 中，使用了三种映射方法：\n\n*   位置法 `(METHOD P)`\n*   位置法 `(METHOD L)`\n*   名称法 `(METHOD\
  \ N)`\n\n## 位置方法\n\n当你使用位置方法从外部文件提取数据时，列式数据值通过其在单行内的索引位置来识别；找到第一个数据值被分配索引位置 1，找到的第二个数据值被分配索引位置\
  \ 2，依此类推。图 6.1 展示了位置方法如何将外部文件中的数据值映射到表中的列。\n\n![Image](img/574.jpg)\n\n*图 6.1：使用位置法映射列式数据*\n\
  \n只有使用分隔符 ASCII (DEL) 格式或 PC/ IXF 格式的外部文件数据值可以使用位置法进行映射。\n\n## 位置方法\n\n当你使用位置方法从外部文件提取数据时，列式数据值通过一系列起始和结束字节位置来识别，这些位置组合后可以识别单行内特定数据值的位置。指定的每个字节位置被视为相对于行开始（即字节位置\
  \ 1）的偏移量，且提取单个值需要两个字节的位置。图 6.2 展示了位置方法如何将外部文件中的数据值映射到表中的列。\n\n![Image](img/575.jpg)\n\
  \n*图 6.2：使用位置法映射列式数据*\n\n只有使用非分隔符 ASCII (ASC) 格式的外部文件数据值可以使用位置法进行映射。\n\n## 名称方法\n\
  \n当你使用名称方法从外部文件提取数据时，假设列名存储在文件中，列式数据值通过其关联的列名称来识别。图 6.3 展示了名称方法如何将外部文件中的数据值映射到表中的列。\n\
  \n![Image](img/576.jpg)\n\n*图 6.3：使用名称法映射列式数据*\n\n因为在使用名称法时，DB2 期望列名与数据值本身一起位于外部文件中，因此只有使用\
  \ PC/IXF 格式的外部文件数据值可以被映射。\n\n## DB2 导出工具\n\n`Export` 工具从 DB2 数据库表或视图提取数据并将其外部化到文件中，使用分隔符\
  \ ASCII (DEL) 格式、WSF 格式或 PC/IXF 格式。此类文件可以为其他数据库（包括提取数据的数据库）以及电子表格和文字处理器等软件应用程序提供数据值。\n\
  \n要成功调用 `EXPORT` 命令，你必须在实例级别具有 `SYSADM` 权限，在数据库级别具有 `DBADM` 权限、数据库级别的 `DATAACCESS`\
  \ 权限，或在表或视图级别具有 `CONTROL` 或 `SELECT` 权限。\n\n当你从具有受保护行的表中导出数据时，你的授权 ID 持有的 LBAC 凭据可能会限制导出的行。你的授权\
  \ ID 无读取访问权的记录将不会导出。然而，不会显示错误或警告消息。如果 LBAC 凭据不允许读取导出中包含的一个或多个列，导出将失败并报错（SQLSTATE\
  \ 4212）。\n\n调用导出工具的一种方法是执行 `EXPORT` 命令。该命令的基本语法如下：\n\n![Image](img/577.jpg)\n\n\
  | 参数 | 描述 |\n| :--- | :--- |\n| `FileName` | 指定导出或拷贝数据的外部文件的名称和位置 |\n| `LOBPath`\
  \ | 指定存储 LOB 值的多个位置（如果指定了此选项，每个 LOB 值将存储在指示的位置） |\n| `LOBFileName` | 指定用于命名写入 LOB\
  \ 数据值的文件的多个基名称；在导出操作期间，文件名是通过在当前基名称后添加点 `.` 和三位数序列号生成的，然后将生成的文件名附加到指定的大对象路径（LOBPath）——例如，如果当前\
  \ LOB 路径是目录 `C:\\LOBData` 且当前 LOB 文件名为 `Value`，创建的 LOB 文件将为 `C:\\LOBData\\Value.001.lob,\
  \ C:\\LOBData\\Value.002.lob,` 等 |\n| `XMLPath` | 指定存储 XML 文档的多个位置（如果指定了此选项，每个 XML\
  \ 值将存储在指示的位置） |\n| `XMLFileName` | 指定用于命名写入 XML 文件的多个基名称；在导出操作期间，文件名是通过在当前基名称后添加点\
  \ `.` 和三位数序列号生成的，然后将生成的文件名附加到指定的 XML 数据路径（XMLPath）——例如，如果当前 XML 路径是目录 `C:\\XMLData`\
  \ 且当前 XML 文件名为 `Value`，创建的 XML 文件将为 `C:\\XMLData\\Value.001.xml, C:\\XMLData\\Value.002.xml,`\
  \ 等 |\n| `Modifier` | 指定用于覆盖 `Export` 工具默认行为的多个选项（表 6.1 包含有效修饰符列表） |\n| `ColumnName`\
  \ | 指定要写入到要导出数据的外部文件的多个列名 |\n\n\n\n\n\n| `MsgFileName` | 标识外部文件的名称和位置，在执行导出操作时，`Export`\
  \ 实用程序产生的消息将写入该文件。 |\n| `SELECTStatement` | 标识一个 `SELECT` SQL 语句，执行该语句将检索要复制到外部文件的数据。\
  \ |\n| `XQueryExpression` | 标识一个 XQuery 表达式，执行该表达式将检索要复制到外部文件的数据。 |\n\n一个简单的 `EXPORT`\
  \ 命令看起来像这样：\n\n![Image](img/578-1.jpg)\n\n下面的输出文件 `employee.del,` 具有默认的文件类型修饰符；即：用引号（\"\
  ) 包围的字符串、用逗号（,）分隔的列值以及用回车符 `(0x0A)` 或 `CHR(10)` 分隔的行：\n\n![Image](img/578-2.jpg)\n\
  \n表 6.1 出了出了 `EXPORT` 命令最常用的文件类型修饰符。\n\n### 表 6.1：EXPORT 命令识别的文件类型修饰符\n\n| 修饰符 |\
  \ 说明 | 文件格式 |\n| :--- | :--- | :--- |\n| `lobsinfile` | 指示将 LOB 数据值写入 `LOBS TO`\
  \ 子句指定的位置；否则，LOB 数据将发送到与生成的数据文件相同的位置 | 分隔 ASCII (DEL),WSF 和 PC/IXF |\n| `lobsinpfiles`\
  \ | 指示将每个 LOB 值写入单独的文件中；默认情况下，多个值将合并在同一个文件中 | 分隔 ASCII (DEL),WSF 和 PC/IXF |\n| `xmlinsepfiles`\
  \ | 指示将每个 XML 文档（XQuery 数据模型或 QDM 实例）写入单独的文件中；默认情况下，多个值将合并在同一个文件中 | 分隔 ASCII (DEL),WSF\
  \ 和 PC/IXF |\n| `xmlnodeclaration` | 指示在不带 XML 声明标签的情况下写入 XML 文档；默认情况下，导出的 XML 文档开头带有一个包含编码属性的\
  \ XML 声明标签 | 分隔 ASCII (DEL),WSF 和 PC/ IXF |\n| `xmlchar` | 指示使用字符代码页写入 XML 文档；字符代码页是由\
  \ `codepage` 修饰符指定的值，如果未指定该修饰符则使用应用程序代码页；默认情况下以 Unicode 写入 XML 文档 | 分隔 ASCII (DEL),WSF\
  \ 和 PC/IXF |\n| `xmlgraphic` | 指示无论 `codepage` 修饰符指定的应用程序代码页或字符代码页，均使用 UTF-16 代码页编码并写入\
  \ XML 文档 | 分隔 ASCII (DEL),WSF 和 PC/IXF |\n| `chardelx` 其中 `x` 为任何有效分隔符 | 标识一个作为字符分隔符的特定字符；默认字符分隔符是双引号\
  \ (\")；指定的字符将代替双引号来包围字符字符串 | 分隔 ASCII (DEL) |\n| `codepage=x` 其中 `x` 为任何有效代码页标识符\
