  \n![Image](img/860-4.jpg)\n\n**示例 5。** 授予用户 `USER1` 运行名为 `GET_INVENTORY` 包的嵌入 SQL\
  \ 应用程序的能力：\n\n![Image](img/861-1.jpg)\n\n**示例 6。** 授予用户 `USER1` 在查询中使用名为 `PAYROLL.CALC_SALARY`\
  \ 的存储过程的能力：\n\n![Image](img/861-2.jpg)\n\n**示例 7。** 授予用户 `USER1` 和组 `GROUP1` 在表\
  \ `EMPLOYEE` 和 `DEPARTMENT` 之间定义引用约束的能力，并使用 `EMPLOYEE` 表中的列 `EMPID` 作为主键：\n\n![Image](img/861-3.jpg)\n\
  \n**示例 8。** 授予组 `PUBLIC` 修改存储 `EMP_INFO` 表中 `ADDRESS` 和 `HOME_PHONE` 列的信息的能力：\n\n\
  ![Image](img/861-4.jpg)\n\n**示例 9。** 授予组 `APPGRP` 在数据库 SAMPLE 中创建表并加载数据的能力：\n\n\
  ![Image](img/861-5.jpg)\n\n**示例 10.**** 授予用户 `ICEBI` 使用和修改序列 `DATAMARTS.COMPOSITION_SEQ`\
  \ 的能力：\n\n![Image](img/861-6.jpg)\n\n## 使用 REVOKE SQL 语句撤销权限和许可\n\n正如 SQL 语句可以授予数据库级权限和数据库/对象权限，也有\
  \ SQL 语句可以撤销这些权限。该语句是 `REVOKE` SQL 语句，与 `GRANT` 类似，`REVOKE` 的语法根据要撤销的权限或许可而异。\n\n\
  ## 数据库级权限和许可\n\n![Image](img/862-1.jpg)\n\n| where: |\n| `Privilege` 权限 | 识别要撤销的一个或多个数据库级权限；有效的值为：`DBADM`、`SECADM`、`CONNECT`\
  \ |\n| `Forfeiter` 撤销者 | 识别要撤销权限的用户、组和角色名称；您为 `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],`, `<GROUP>` `[GroupName],`, `<ROLE>` `[RoleName],` 以及 `PUBLIC` |\n\
  | `ALL` | 可选子句，用于撤销所有权限 |\n\n注意，当您撤销 `DBADM` 权限时，如果使用了 `ALL` 子句，`REVOKE` 语句将自动撤销所有被授予的权限。\n\
  \n## 表空间权限\n\n![Image](img/862-2.jpg)\n\n| where: |\n| `Tablespace` 表空间名 | 通过名称识别要关联使用权限的表空间空间\
  \ |\n| `Forfeiter` 撤销者 | 识别要撤销权限的用户、组和角色名称\n\n只有持有 `SYSADM` 或 `DBADM` 权限的用户允许撤销表的\
  \ `CONTROL` 权限。因此，当您指定 `ALL PRIVILEGES` 子句时，每个接收者都将获得除 `CONTROL` 权限以外的所有权限；您必须单独撤销\
  \ `CONTROL` 权限。\n\n# Schema 权限\n\n![Image](img/863-1.jpg)\n\n| where: |\n| `Privilege`\
  \ 权限 | 识别要撤销的一个或多个 Schema 权限；有效的值为：`CREATE`、`ALTER`、`DROP` |\n| `SchemaName` Schema\
  \ 名 | 通过名称识别要关联所有指定权限的 Schema |\n| `Forfeiter` 撤销者 | 识别要撤销权限的用户、组和角色名称\n\n## 表权限\n\
  \n![Image](img/863-2.jpg)\n\n| where: |\n| `Privilege` 权限 | 识别要授予一个或多个用户和组的表权限；该参数的有效值为：`CONTROL`、`ALTER`、`SELECT`、`INSERT`、`UPDATE`、`DELETE`、`INDEX`\
  \ 和 `REFERENCES` |\n| `TableName` 表名 | 通过名称识别要关联所有指定权限的表 |\n| `Forfeiter` 撤销者 |\
  \ 识别要撤销权限的用户、组和角色名称\n\n## 视图权限\n\n![Image](img/864.jpg)\n\n| where: |\n| `Privilege`\
  \ 权限 | 识别要授予一个或多个用户和组的视图权限；该参数的有效值为：`CONTROL`、`SELECT`、`INSERT`、`UPDATE` 和 `DELETE`\
  \ |\n| `ViewName` 视图名 | 通过名称识别要关联所有指定权限的视图 |\n| `Forfeiter` 撤销者 | 识别要撤销权限的用户、组和角色名称\n\
  \n\n\n\n\n再次，只有拥有 `SYSADM` 或 `DBADM` 权限的用户才允许撤销表的 `CONTROL` 权限。因此，当你指定 `ALL PRIVILEGES`\
  \ 子句时，每个 `Forfeiter` 拥有的 `CONTROL` 权限以外的所有表权限都会被撤销；你必须单独撤销 `CONTROL` 权限。\n\n## 索引权限\n\
  \n![Image](img/865-1.jpg)\n\n| where: |\n| `IndexName` | 通过名称识别与 `CONTROL` 权限关联的索引\
  \ |\n| `Forfeiter` | 识别将失去 `CONTROL` 权限的用户、组和角色名称；你为 `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  ## 序列权限\n\n![Image](img/865-2.jpg)\n\n| where: |\n| `Privilege` | 识别要从一个或多个用户或组撤销的一个多个序列权限；此参数的有效值为：`USAGE`\
  \ 和 `ALTER` |\n| `SequenceName` | 通过名称识别与指定的所有序列权限关联的序列 |\n| `Forfeiter` | 识别将失去指定序列权限的用户、组和角色名称；你为\
  \ `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],` `<GROUP>` `[GroupName],`\
  \ `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n## 常程权限\n\n![Image](img/865-866.jpg)\n\n\
  | where: |\n| `RoutineName` | 通过名称识别与 `EXECUTE` 权限关联的例程（UDF、方法或存储过程） |\n| `TypeName`\
  \ | 通过名称识别指定方法的类型 |\n| `SchemaName` | 通过名称识别从哪个模式撤销所有函数、方法或过程的 `EXECUTE` 权限——包括未来可能创建的\
  \ |\n| `Forfeiter` | 识别将失去 `EXECUTE` 权限的用户、组和角色名称；你为 `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  `RESTRICT` 子句保证，如果指定的例程用于视图、触发器、约束、索引、SQL 函数、SQL 方法或转换组，或者被引用为源函数，则 `EXECUTE` 权限不会被撤销。此外，如果失去权限会导致例程定义者无法执行该例程（即如果创建例程的用户被标识为\
  \ `Forfeiter`），则 `EXECUTE` 权限也不会被撤销。\n\n## 包权限\n\n![Image](img/866.jpg)\n\n| where:\
  \ |\n| `Privilege` | 识别要从一个或多个用户或组撤销的一个多个包权限；此参数的有效值为：`CONTROL`、`BIND` 和 `EXECUTE`\
  \ |\n| `SchemaName` | 通过名称识别指定包所在的模式 |\n| `PackageName` | 通过名称识别与所有指定包权限关联的特定包 |\n\
  | `Forfeiter` | 识别将失去指定包权限的用户、组和角色名称；你为 `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  ## 服务器权限\n\n![Image](img/867-1.jpg)\n\n| where: |\n| `ServerName` | 通过名称识别与 `PASSTHRU`\
  \ 权限关联的服务器 |\n| `Forfeiter` | 识别将失去 `PASSTHRU` 权限的用户、组和角色名称；你为 `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  ## 别名权限\n\n![Image](img/867-2.jpg)\n\n| where: |\n| `Privilege` | 识别要从一个或多个用户或组撤销的一个多个别名权限；此参数的有效值为：`CONTROL`、`ALTER`、`SELECT`、`INSERT`、`UPDATE`、`DELETE`、`INDEX`\
  \ 和 `REFERENCES` |\n| `Nickname` | 通过名称识别与所有指定权限关联的别名 |\n| `Forfeiter` | 识别将失去指定别名权限的用户、组和角色名称；你为\
  \ `Forfeiter` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],` `<GROUP>` `[GroupName],`\
  \ `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n只有拥有 `SYSADM` 或 `DBADM` 权限的用户才允许撤销别名的 `CONTROL`\
  \ 权限。因此，当你指定 `ALL PRIVILEGES` 子句时，每个 `Forfeiter` 拥有的 `CONTROL` 权限以外的所有别名权限都会被撤销；你必须单独撤销\
  \ `CONTROL` 权限。\n\n## REVOKE SQL 语句示例\n\n现在你已经熟悉了各种形式的 `REVOKE` SQL 语句的基本语法，让我们来看一些示例。\n\
